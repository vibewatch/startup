company:
  name: Prague Technology
chapter:
  number: 7
  title: Risks
  summary: >-
    Prague Technology faces a high-risk execution environment: the embodied-AI market is
    crowded and capital intensive, while public evidence does not establish its own
    commercialization, safeguards, financing terms, or legal posture. The most decision-relevant
    controls are proof of differentiated deployments, disclosed compute and capital plans, and
    measurable governance around agentic-model failure modes.
sections:
  - id: risk-ranking
    title: Risk ranking and thesis-break triggers
    body: >-
      The highest-consequence risk is not a documented incident at Prague Technology; it is
      the absence of public evidence that a pre-product world-model company can convert founder
      credentials and sector momentum into repeatable deployments. Sector evidence shows both
      intense capital formation and an early-stage competitive field. PanDaily reports 503 China
      embodied-intelligence funding rounds totaling more than RMB 96 billion between July 2025
      and June 2026, while also noting that even a highly patented competitor had only 20 core
      invention patents out of 262. The combination raises the bar for technical moat, data
      access, and customer proof. A thesis break would be a failure to demonstrate a production
      deployment with measurable outcomes, or a financing event that leaves compute capacity
      and runway materially below the plan. Monitoring should therefore emphasize signed
      deployments, repeat usage, model-evaluation deltas, cash runway, and funding terms rather
      than headline round size.
    claimRefs: [CR001, CR002, CR003, CR004]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Legal, regulatory, and governance exposure
    body: >-
      Publicly available evidence in the assigned pool does not confirm Prague Technology's
      licenses, litigation status, privacy controls, export-control permissions, or incident
      history. That is a material diligence gap, not evidence that no issue exists. The
      company-registry URL in the pool resolves to a login page, so ownership, registered
      capital, legal representatives, and court history remain unverified from that source.
      The sector context also creates cross-border compliance exposure: an embodied-AI
      platform may combine model weights, robotics hardware, customer operational data, and
      cloud or GPU dependencies. Before investment, counsel should verify the Chinese entity
      and affiliates, IP assignments, data-processing basis, model and robotics safety
      obligations, export-control screening, and any restrictions affecting overseas customers
      or suppliers. A thesis break is a regulator, court, or counterparty finding that blocks
      core data, compute, or deployment access.
    claimRefs: [CR005, CR006, CR007]
    tableRefs: [TR002]
  - id: execution-dependencies
    title: Operational, technical, partner, and financial dependencies
    body: >-
      The operating model is exposed to three linked dependencies. First, agentic systems need
      reliable environments and tool access: the reviewed technical discussion identifies
      reward hacking as a central risk once models gain real tool access and says that
      training and inference must be cleanly decoupled to avoid rollout bottlenecks. Second,
      large incumbents are entering embodied intelligence as infrastructure providers, and
      automotive supply chains can transfer sensors, actuators, decision systems, and data
      pipelines into robotics. This can accelerate the market while compressing differentiation.
      Third, early-stage AI financing can obscure effective valuation and employee or investor
      downside: Forbes describes tranched rounds in which the headline valuation can differ
      materially from the blended price. Prague Technology's public financing, runway,
      customer concentration, supplier commitments, and model-cost profile are not established
      by this pool. The practical kill criteria are failed safety or reliability evaluations,
      inability to secure compute on acceptable terms, loss of a critical partner, or a
      financing requirement before repeatable commercial evidence.
    claimRefs: [CR008, CR009, CR010, CR011, CR012]
    tableRefs: [TR001, TR003]
  - id: diligence-actions
    title: Required monitoring and diligence actions
    body: >-
      The risk posture should remain high until management supplies primary evidence. The
      minimum package is a current cap table and financing instruments; a 24-month cash,
      compute, and hiring plan; named pilot and production customers with outcome metrics; a
      model and robotics safety case; incident and vulnerability disclosures; IP ownership
      records; and a map of cloud, GPU, data, manufacturing, and distribution dependencies.
      External monitoring should track new entrants and financing intensity, benchmark
      reproducibility, regulator or court records, security incidents, export-control changes,
      and any down-round or tranche disclosures. Because sector valuation sentiment can reverse
      quickly, an investment committee should not treat any headline valuation or funding total
      as cash available or fair value without primary documentation. The decision should be
      revisited only when the gaps are closed with dated, attributable evidence.
    claimRefs: [CR002, CR006, CR010, CR012]
tables:
  - id: TR001
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Agentic reward hacking or unsafe tool use, medium, critical, "Low: no company-specific controls are public", high, "Reproducible red-team results, sandbox boundaries, and incident records"]
      - [Training and serving bottlenecks in live tool environments, medium, high, "Unknown: architecture and GPU plan are not public", high, "Train/serve separation, rollout throughput, utilization, and recovery evidence"]
      - [Weak differentiation against open and incumbent models, high, high, "Low: no company benchmark package is public", high, "Independent benchmark deltas and customer outcome evidence"]
      - [Failure to convert a pre-product narrative into reliable deployment, high, critical, "Low: no production deployment is established by the pool", critical, "Named production use, repeat usage, reliability, and rollback metrics"]
    notes: "Likelihood and severity are analytical assessments based on cited technical and competitive evidence; no row asserts that Prague Technology has experienced an incident."
    claimRefs: [CR001, CR003, CR007, CR008, CR012]
  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule, jurisdiction, status, likelihood, severity, mitigation, residual exposure, diligence path]
    rows:
      - ["Data protection and customer operational data", "China and customer jurisdictions", "Not publicly verified", medium, critical, "Require data map, processing basis, retention policy, and customer-contract controls", high, "Obtain counsel-reviewed privacy and cross-border data assessment"]
      - ["Export controls and access to advanced compute", "China and supplier jurisdictions", "Not publicly verified", high, critical, "Screen suppliers, models, cloud regions, and end uses", high, "Obtain written supply-chain and export-control opinion before funding"]
      - ["IP ownership and model or robotics training rights", "China and any operating jurisdiction", "Not publicly verified", medium, high, "Verify assignments, licenses, training-data provenance, and open-source obligations", high, "Complete chain-of-title and training-data audit"]
      - ["Corporate registry, ownership, and litigation status", "China", "Source access blocked", medium, high, "Use direct registry extract and counsel confirmation", high, "Obtain authenticated registry, court, and beneficial-ownership searches"]
    notes: "The assigned registry URL returned a login page rather than the company record; unknown status is retained as a risk gap and not interpreted as a clean legal record."
    enumerationScope:
      coverage: partial
      basis: "Public-source screen of company, sector, data, IP, compute, and jurisdictional legal exposures available in the assigned refresh pool."
    claimRefs: [CR005, CR006, CR007]
  - id: TR003
    title: Operational, partner, and financial dependency register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Monitoring indicator]
    rows:
      - ["GPU and cloud capacity", "Compute providers and cloud platforms", "Capacity, export restrictions, or price changes delay training and deployment", critical, "Dual-source compute and maintain a milestone-based capacity plan", high, "Available GPU hours, cost per training run, and blocked workloads"]
      - ["Model and tooling environment", "Internal harness, tool servers, and evaluators", "Reward hacking, tool misuse, or environment instability produces unsafe or non-reproducible results", critical, "Sandbox tools, red-team evaluations, and separate train/serve controls", high, "Incident rate, evaluation variance, and rollback frequency"]
      - ["Incumbent and automotive ecosystem", "Alibaba, ByteDance, Li Auto, and robotics entrants", "Better-funded entrants commoditize models, data, or hardware interfaces", high, "Prove differentiated customer outcomes and defensible data or workflow access", high, "Win rate, benchmark delta, and renewal or expansion evidence"]
      - ["Capital providers and financing terms", "Investors and strategic backers", "Headline valuation masks tranche pricing or restrictive preferences", medium, "Require full financing documents and diluted cap table", high, "Runway, liquidation preferences, ownership dilution, and next-round price"]
      - ["Customer concentration and pilots", "Early enterprise adopters", "A pilot fails or a lead customer delays procurement", medium, "Diversify pilots and define production acceptance metrics", high, "Pilot-to-production conversion and revenue concentration"]
      - ["Manufacturing and component supply", "Robot-body and actuator suppliers", "Component shortages or quality failures delay field deployment", medium, "Qualify alternate suppliers and incoming quality controls", medium, "Lead times, defect rates, and single-source spend"]
      - ["Workforce and specialist talent", "Researchers, robotics engineers, and safety staff", "Hiring or retention gaps delay milestones and weaken oversight", medium, "Track critical-role coverage, retention, and succession plans", medium, "Time to fill, regretted attrition, and milestone slippage"]
    notes: "Several dependencies are company-specific unknowns. Their inclusion identifies what must be measured before assigning a lower residual exposure; it does not assert that a failure has occurred."
    claimRefs: [CR008, CR009, CR010, CR012]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: The largest residual exposures combine high impact with unverified mitigation maturity.
    data:
      columns: [Critical impact, High impact, Medium impact]
      rows:
        - label: High likelihood
          note: "Crowded competition and missing commercialization evidence are persistent current risks."
          values: [5, 4, null]
        - label: Medium likelihood
          note: "Governance, valuation, and customer failures are plausible but not evidenced as incidents."
          values: [5, 4, 3]
        - label: Low likelihood
          note: "No low-likelihood risk is treated as cleared; this row represents monitoring discipline."
          values: [null, null, null]
        - label: Unknown likelihood
          note: "Legal and ownership status is not independently verified because the registry page is access-blocked."
          values: [5, 4, null]
        - label: Monitoring priority
          note: "Compute, safety, and financing indicators should be reviewed before each investment decision."
          values: [5, 4, 3]
        - label: Evidence gap
          note: "Missing customer and runway evidence keeps residual exposure elevated."
          values: [5, 4, 3]
    approximationNotes: "Values are ordinal monitoring priorities on a five-point scale, not measured incident probabilities."
    claimRefs: [CR001, CR003, CR006, CR007, CR010, CR012]
callouts:
  - calloutType: risk
    title: Primary risk
    body: "The public record supports a high-risk posture because product proof, mitigation maturity, legal posture, financing terms, and runway are not established; this is an evidence gap, not a claim of an incident."
    claimRefs: [CR001, CR005, CR010, CR012]
  - calloutType: assumption
    title: Monitoring assumption
    body: "A lower-risk rating requires dated primary evidence of production use, safety controls, compute access, and financing capacity; sector growth alone is not a substitute."
    claimRefs: [CR002, CR008, CR009]
