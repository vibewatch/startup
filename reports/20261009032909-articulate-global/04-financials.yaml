    title: Enterprise Revenue Streams and Monetization Mechanics
    columns:
      - Revenue Stream
      - Delivery Mechanism
      - Unit / Pricing Metric
      - Current Operational Status
      - Revenue Quality
      - Core Diligence Ask
    rows:
      - - Articulate 360 Enterprise Subscriptions
        - Cloud-based desktop and web application suite (Storyline 360, Rise 360, Review 360)
        - Annual recurring subscription per named authoring seat
        - Active commercial scale across 125,000+ customer organizations
        - High (Mission-critical core authoring workflow with annual prepaid commitments)
        - Audited ARR bridge and net revenue retention (NRR) schedules across enterprise cohorts
      - - Rise.com Standalone LMS Platform
        - Turnkey cloud-based learning management system for SMBs and enterprise departments
        - Tiered annual software subscription based on enrolled learners and administrative seats
        - Active commercial availability for organizations without dedicated LMS infrastructure
        - Medium (Faces direct competition from established SMB learning platforms and LXPs)
        - Logo churn, active learner engagement metrics, and standalone annual contract values (ACVs)
      - - Articulate Localization Add-on
        - Integrated multi-language translation and validation service powered by DeepL engines
        - Paid localization plan activated upon course publishing across multi-language projects
        - Commercial rollout with ongoing version updates in 2025 and 2026
        - High (Usage-linked upsell embedded directly into the primary course authoring workflow)
        - Customer attach rates, translation volume tiers, and gross margin after provider API costs
      - - Enterprise Reseller & Channel Distribution
        - Global reseller network supporting international commercial and government procurement
        - Contracted licensing agreements with regional distributor margins
        - Active international coverage coordinated via New York headquarters
        - Medium-High (Expands geographic distribution across 187 countries but introduces channel margin share)
        - Channel revenue share percentage, distributor payment terms, and partner concentration
    notes: >-
      Revenue streams mapped from official company product disclosures, career descriptions, and institutional financing records.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI009
  - id: TI002
    title: Pricing and Monetization Architecture Comparison
    columns:
      - Product Tier / Service
      - Contract Basis
      - List Pricing Convention
      - Realized Pricing Dynamics
      - Known Enterprise Discounts & Unknowns
      - Source Attribution
    rows:
      - - Articulate 360 Standard Teams
        - Annual prepaid contract
        - List pricing per user seat per year with centralized administrative console
        - High realized rate among SMBs; enterprise accounts negotiate volume tiering
        - Enterprise discounting percentages and minimum commitment floors remain private
        - Articulate corporate sales and customer support documentation
      - - Articulate AI Integrated Suite
        - Embedded platform capability
        - Bundled into platform updates for automated drafts, voiceovers, and quiz generation
        - Drives seat retention and supports price stability during annual renewal cycles
        - Separate consumption metering or premium tier boundaries are not fully disclosed
        - Official press releases and 2026 Training Industry AI recognition
      - - Articulate Localization Plan
        - Project publishing activation
        - Free translation and validation during drafting; paid plan required for final publishing
        - Converts casual translation users into recurring localization billing accounts
        - Overage costs per translated word and multi-year commitment terms remain private
        - Articulate Support localization release notes and version history
      - - Enterprise Custom Licensing
        - Multi-year enterprise agreement
        - Custom pricing based on global seat pools, dedicated support SLAs, and security reviews
        - Heavy procurement discounting common among Fortune 100 enterprise accounts
        - Average contract values (ACVs) and realization vs list prices are undisclosed
        - Official enterprise contact sales portal and reseller documentation
    notes: >-
      Monetization architecture reflects official public disclosures; realized enterprise discounting and net contract realization are private data gaps.
