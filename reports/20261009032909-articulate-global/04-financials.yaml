callouts:
  - calloutType: insight
    title: Organic Community Flywheel Shields Sales Efficiency
    body: >-
      Unlike conventional enterprise SaaS vendors that expend 40% to 50% of annual revenue on outbound sales and marketing,
      Articulate built an extraordinary distribution advantage through its 1M+ member E-Learning Heroes community. Instructional
      designers champion Articulate within enterprise procurement, creating an inbound-driven sales motion that preserves cash
      and sustains high capital efficiency.
    claimRefs:
      - CI006
      - CI007
      - CI008
  - calloutType: risk
    title: $1.5B Preferred Liquidation Preference Overhang
    body: >-
      The $1.5 billion Series A funding led by General Atlantic, Blackstone, and ICONIQ established a formidable preferred
      capital layer ahead of common equity holders. In the absence of an active IPO market or updated 409A valuation clearing
      prices on secondary exchanges like EquityZen and Forge Global, common equity holders face severe downside risk if enterprise
      software multiple contraction forces an exit below historical headline benchmarks.
    claimRefs:
      - CI010
      - CI011
      - CI013
      - CI015
