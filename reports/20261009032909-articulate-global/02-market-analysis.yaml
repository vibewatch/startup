figures:
  - id: FM001
    title: Layered Sizing and Enterprise Addressability Structure
    type: pyramid
    summary: Structured market sizing pyramid illustrating the transition from broad global enterprise training spend down to high-value authoring and consumption workflows.
    data:
      items:
        - label: Global Corporate Training Spend (Macro Market)
          value: High-level multi-billion enterprise spending on global workforce development, external agencies, and infrastructure
        - label: Enterprise Digital Learning Solutions (Broad LMS / Content)
          value: Integrated LMS platforms, learner analytics suites, and centralized corporate training infrastructure
        - label: Digital Courseware & Authoring Systems (SAM)
          value: Seat-licensed enterprise authoring software ($1,449-$1,749/seat/yr) across corporate L&D teams
        - label: Departmental & Guided Training Expansion (Frontline SOM)
          value: Line-of-business informal training capture via flat-rate $500/year unlimited seat packaging
        - label: Consumption-Based AI & Localization Workflows
          value: High-margin credit consumption ($250 per 50,000 credits) for automated translation in 80+ languages and AI avatars
        - label: Custom Enterprise & Agency Services (Excluded Boundary)
          value: Bespoke instructional design agencies and specialized third-party media production contracts
    approximationNotes: "Pyramid layers represent qualitative enterprise addressability tiers structured by Articulate's pricing architecture and market boundaries; absolute TAM dollar aggregates remain unquantified due to private disclosure limitations."
    claimRefs:
      - CM001
      - CM005
      - CM006
      - CM007
callouts:
  - calloutType: insight
    title: Shift from Pure Seat Licensing to Hybrid Consumption Architecture
    body: Articulate's core commercial model historically relied on high-margin annual subscription seats for dedicated instructional designers. The introduction of Frontline at $500 per year for unlimited seats, coupled with credit-based pricing for AI avatars and 80+ language translations ($250 per 50,000 credits), marks a structural shift toward capturing decentralized enterprise spend while protecting per-seat pricing power among specialized L&D authors.
    claimRefs:
      - CM006
      - CM007
      - CM013
  - calloutType: risk
    title: Private Financial Opacity and TAM Ceiling Constraints
    body: Despite claiming adoption across 125,000+ organizations and all Fortune 100 companies, Articulate has not disclosed audited financial metrics, ARR growth, net revenue retention (NRR), or credit attach rates since its 2021 Series A. Without verified revenue segmentation, diligence cannot confirm whether market growth is driven by expanding seat counts or offsetting churn through AI pricing add-ons.
    claimRefs:
      - CM004
      - CM008
      - CM014
