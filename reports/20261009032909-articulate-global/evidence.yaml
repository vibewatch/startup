evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited 2024-2025 financial statements, annual recurring revenue (ARR) bridge, gross margins, EBITDA, and balance
      sheet cash reserves.
    whyItMatters: >-
      Without audited ARR and margins, investors cannot independently determine revenue multiple expansion or
      compression since the 2021 Series A financing.
    diligencePath: >-
      Request confidential disclosure schedule and audited income statement from Articulate executive management or
      General Atlantic investment team.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: arr-breakdown
    missingEvidence: >-
      Audited segment revenue figures separating Articulate 360 enterprise subscriptions, Frontline subscriptions, and
      AI consumption credit purchases.
    whyItMatters: >-
      Prevents independent determination of whether growth is driven by core L&D seat expansion or new departmental
      credit consumption.
    diligencePath: >-
      Request confidential management financial presentation, ARR bridge, and product-line revenue segmentation under
      NDA.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: net-revenue-retention
    missingEvidence: Verified enterprise net revenue retention (NRR) and logo churn rates across customer cohorts.
    whyItMatters: >-
      Critical for establishing whether enterprise accounts expand seat counts or contract spend as generative AI
      authoring tools proliferate.
    diligencePath: Review SaaS cohort retention schedules and renewal transaction records from growth equity investors.
    relatedQuestionRefs:
      - QM005
  - type: enumeration-incomplete
    severity: material
    topic: competitor-landscape
    missingEvidence: >-
      Current primary product, pricing, security, integration, and channel evidence from Adobe Captivate, iSpring,
      Lectora, and likely AI-native entrants.
    whyItMatters: >-
      Without first-party competitor evidence or independent testing, the feature matrix cannot support a complete
      parity or superiority judgment.
    diligencePath: >-
      Collect current vendor documentation and run a scored buyer-workflow benchmark using identical authoring,
      localization, publishing, and analytics tasks.
    relatedQuestionRefs:
      - QP001
      - QP002
      - QP003
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-and-retention
    missingEvidence: >-
      Cohort retention, NRR, competitive win/loss rates, migration frequency, legacy-course conversion cost, and
      multi-homing behavior.
    whyItMatters: >-
      These measures determine whether Articulate's installed base creates durable lock-in or merely a large but
      contestable footprint.
    diligencePath: >-
      Request cohort and renewal data, inspect 20 lost and 20 won enterprise deals, and interview customers that
      evaluated or adopted a second authoring tool.
    relatedQuestionRefs:
      - QP004
      - QP005
      - QP008
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: pricing-benchmarks
    missingEvidence: >-
      Current vendor quotes and anonymized contract records with sample size, seat count, term, geography, product
      bundle, and realized discounts.
    whyItMatters: >-
      Vendr's directional ranges lack disclosed denominators and cannot be treated as realized company revenue or a
      universal buyer outcome.
    diligencePath: >-
      Obtain matched quotes for 10-, 50-, and 250-author deployments and reconcile them against recent procurement
      contracts.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Independent product benchmarks and customer evidence measuring time-to-publish, translation quality, learner
      outcomes, author productivity, and switching effort.
    whyItMatters: >-
      Company and competitor marketing can describe breadth, but cannot independently establish sustained product
      superiority or outcome advantage.
    diligencePath: Commission a blinded benchmark with experienced authors and validate the results through customer reference calls.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-statements
    missingEvidence: >-
      Audited GAAP financial statements covering FY2024 through FY2026, including income statement, balance sheet, cash
      balance, and ARR bridge.
    whyItMatters: >-
      Without verified ARR, gross margin, and operating cash flow, investors cannot substantiate financial performance
      or underwrite equity value against the $3.75B mark.
    diligencePath: >-
      Request confidential management financial package and independent auditor reports under a formal non-disclosure
      agreement.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-unit-economics
    missingEvidence: >-
      Cohort-level net revenue retention (NRR), gross revenue retention (GRR), annual contract value (ACV)
      distributions, and customer churn metrics.
    whyItMatters: >-
      Critical to establish whether revenue expansion is compounding organically across existing enterprise accounts or
      masking seat contraction.
    diligencePath: Review SaaS cohort retention schedules and net expansion data during sponsor-led management diligence.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capitalization-table-terms
    missingEvidence: >-
      Detailed capitalization table specifying liquidation preferences, participation rights, dividend accruals, and
      anti-dilution protections from the 2021 Series A.
    whyItMatters: >-
      Determines the net equity recovery for common shareholders across various exit valuation thresholds and potential
      down-round scenarios.
    diligencePath: >-
      Obtain the amended and restated certificate of incorporation and investor rights agreements from corporate legal
      counsel.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: infrastructure-architecture
    missingEvidence: >-
      Technical documentation of Articulate's cloud hosting topology, multi-tenant isolation model, and data center SLA
      specifications.
    whyItMatters: >-
      Enterprise IT buyers require verified infrastructure reliability, failover latency, and cloud isolation
      architecture.
    diligencePath: >-
      Request Articulate's SOC 2 Type II report, enterprise security whitepaper, and infrastructure SLA disclosures
      during technical review.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited net revenue retention (NRR), gross renewal rates (GRR), and logo retention percentages broken down by
      enterprise and mid-market cohorts.
    whyItMatters: >-
      Without retention benchmarks, diligence cannot verify whether high reported customer counts represent durable
      expansion or high churn masked by new logo acquisition.
    diligencePath: >-
      Request audited GAAP cohort retention schedules, annualized contract value distributions, and churn data during
      management diligence.
    relatedQuestionRefs:
      - QU004
  - id: GU002
    type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue contribution and contract values for Articulate's top 10, 25, and 50 enterprise accounts.
    whyItMatters: >-
      High account concentration among Fortune 100 enterprises could pose material revenue risk if enterprise
      consolidation or budget compression occurs.
    diligencePath: Review customer concentration tables, enterprise master services agreements, and multi-year commitment schedules.
    relatedQuestionRefs:
      - QU008
  - id: GU003
    type: enumeration-incomplete
    severity: minor
    topic: named-deployments
    missingEvidence: >-
      Comprehensive contract value, seat count, and retention duration data for named enterprise customers such as CVS,
      L'Oréal, and Nestlé.
    whyItMatters: >-
      Confirms whether named Fortune 100 accounts represent enterprise-wide standardizations or isolated departmental
      licenses.
    diligencePath: Request customer reference calls and detailed account licensing histories for flagship enterprise logos.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: stale
    severity: material
    topic: valuation-staleness
    missingEvidence: >-
      Audited 409A valuation reports, secondary transaction prints, or board-approved common stock fair-value
      determinations post-2021.
    whyItMatters: >-
      Without current valuation benchmarks, equity investors cannot determine downside risk, preference overhang, or
      entry multiple discipline.
    diligencePath: >-
      Request most recent board-approved 409A valuation report, cap table detail, and any secondary transaction ledger
      records from management.
    relatedQuestionRefs:
      - QR009
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: Comprehensive listing of global customer data processing addenda and cross-border data transfer agreements.
    whyItMatters: >-
      Incomplete visibility into customer-negotiated compliance clauses prevents precise estimation of indemnity and
      audit liabilities.
    diligencePath: Review standard enterprise DPA terms and sample of negotiated enterprise contracts in dataroom diligence.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: internal-headcount-directory
    missingEvidence: Official employer-disclosed departmental headcount distribution, attrition metrics, and organizational charts.
    whyItMatters: Third-party platform directory gating prevents independent verification of technical and engineering team scale.
    diligencePath: Request verified employee census by department, location, and tenure during management diligence sessions.
