  topStrengths:
    - Category-leading enterprise penetration across Fortune 100 and 125,000+ organizations.
    - Broad product breadth across authoring, review, localization, AI, and frontline training.
    - Large community-led acquisition flywheel through E-Learning Heroes and customer advocacy.
    - Capital-efficient heritage with significant growth capital and a still-healthy operating footprint.
  topRisks:
    - No audited financial statements, ARR bridge, or current retention cohorts are publicly disclosed.
    - The 2021 $3.75B valuation remains stale and sits behind a preferred-capital overhang.
    - AI and localization competition could commoditize core authoring workflows over time.
    - Public metric inconsistencies weaken confidence in disclosure governance.
  unresolvedGaps:
