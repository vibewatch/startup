callouts:
  - calloutType: recommendation
    title: Valuation Discipline Precludes Buy Recommendation
    body: >-
      Articulate Global demonstrates exemplary software heritage, product love, and corporate footprint, but
      investors cannot overlook the valuation mismatch between its 2021 $3.75 billion round and 2026 market realities.
      Under current SaaS multiples, the company's valuation would require dramatic top-line acceleration that remains
      unsupported by public evidence. We strongly recommend a research-more stance until audited financials and
      clear cap-table preference terms are made available.
    claimRefs: [CV007, CV008, CV011, CV012]

