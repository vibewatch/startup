callouts:
  - calloutType: insight
    title: Enterprise Account Density vs. Monoline Authoring Exposure
    body: Articulate's achievement of 100% penetration among Fortune 100 companies and 125,000+ organizations represents exceptional top-of-funnel customer capture. However, because Articulate historically operated primarily as a course authoring suite rather than a system-of-record LMS, enterprise accounts frequently license relatively few author seats compared to their total workforce, capping contract values unless distribution products like Reach 360 achieve high attach rates.
    claimRefs:
      - CU004
      - CU007
      - CU011
      - CU014
  - calloutType: risk
    title: Unverified Retention Economics and Third-Party Workflow Disintermediation
    body: The total lack of public disclosure regarding net revenue retention, gross renewal rates, or cohort-level churn constitutes a material investment risk. In addition, third-party software vendors such as Smartcat actively promote external AI localization workflows for Articulate courses that claim 70% cost savings, presenting disintermediation risks to Articulate's proprietary localization monetization tiers.
    claimRefs:
      - CU014
      - CU015
      - CU016
