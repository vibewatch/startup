      - number: '6.2'
        title: Adoption Trajectory, Account Scale, and Historical Macro Growth
        blocks:
          - type: paragraph
            body: >
              Articulate's top-line customer footprint reflects sustained long-term expansion from its bootstrapped
              foundation in 2002 to scaled enterprise SaaS distribution. Public corporate marketing and investor
              financing announcements report growth from 106,000 organizations and 112 million learners across 161
              countries at the time of its July 2021 Series A round to 125,000+ organizations and 133 million learners
              across 187 countries by 2026. The platform also claims an active professional community of more than 1
              million e-learning developers and over 140 million created lessons, underscoring extensive market
              penetration among corporate training specialists.


              Despite these impressive macro indicators, third-party benchmarks and diligence assessments indicate
              material information gaps regarding ongoing utilization and annualized run-rate expansion. Third-party
              industry trackers like GetLatka estimate Articulate's annualized recurring revenue at approximately $111.7
              million as of late 2024 with 120,000 customers, yet private company disclosure provides no audited
              financial reconciliations, active paid seat counts, or average revenue per user (ARPU) metrics. The
              absence of verified denominators prevents independent validation of true seat growth versus accumulated
              legacy licenses.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
