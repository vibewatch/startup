      - number: '2.2'
        title: Sizing Lenses and Evidence-Constrained TAM/SAM/SOM Boundaries
        blocks:
          - type: paragraph
            body: >-
              Rigorous diligence requires evaluating addressable market scale through constrained operational boundaries
              rather than generic global e-learning projections. While macro corporate e-learning research estimates
              broad multi-billion-dollar global markets, Articulate's serviceable addressable market is bounded by
              professional instructional design headcount and seat-based enterprise licensing models. Articulate's
              expansion from dedicated authoring seats ($1,749 per seat annually for Articulate 360 AI Teams) into
              departmental frontline tools ($500 per year for unlimited seats) and credit-based usage tiers for
              translation and AI video avatars represents a strategic effort to unlock broader operating budgets.
              Nevertheless, private corporate disclosure omits audited ARR breakdowns, preventing an independent
              empirical reconciliation between high-level addressable spend and Articulate's captured segment share.
            claimRefs:
