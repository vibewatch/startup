              - CU009
              - CU010
      - number: '6.3'
        title: Named Customer Proof, Enterprise Retention, and Third-Party Substitution Friction
        blocks:
          - type: paragraph
            body: >
              Empirical customer deployment proof illustrates the practical operational benefits and workflow trade-offs
              associated with Articulate's software suite. In documented customer case studies such as Tamr, a data
              management enterprise with 100 employees, adopting Rise 360 and Reach 360 enabled the company to
              transition from four-day instructor-led training to asynchronous digital customer education, achieving an
              LMS administration reduction of at least 50% and expanding its enrolled learner base by more than 30%.
              Similarly, large enterprise accounts cited in corporate releases—such as CVS, L'Oréal, and
              Nestlé—demonstrate sustained production deployment for global employee reskilling and compliance
              education.


              Conversely, critical diligence concerns persist regarding net revenue retention (NRR), gross revenue
              retention (GRR), and enterprise procurement friction. Articulate has never publicly disclosed retention
              benchmarks, contract duration distributions, or cohort-level churn metrics. Furthermore, external workflow
              dependencies reveal competitive vulnerability: independent translation platforms like Smartcat actively
              market direct XLIFF-based AI localization workflows for Articulate Rise courses, claiming up to 70% cost
              savings compared to traditional translation methods and challenging Articulate's proprietary monetization
              of add-on localization tiers.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
