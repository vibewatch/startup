            title: Pervasive Enterprise Market Penetration
            body: >-
              Articulate holds an exceptionally defensible commercial footprint across enterprise learning departments,
              counting all 100 of the Fortune 100 as customers and serving over 125,000 organizations. This massive
              installed base creates strong workflow stickiness around Storyline and Rise authoring formats.
            calloutType: strength
            claimRefs:
