chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Model, and Historical Scale
        blocks:
          - type: paragraph
            body: >-
              Articulate Global, LLC operates as a specialized enterprise software-as-a-service provider developing
              digital training infrastructure and e-learning authoring applications. Originally founded and bootstrapped
              in 2002 by Chief Executive Officer Adam Schwartz, the business maintained capital-efficient,
              non-institutional operations for nearly two decades before accepting its first institutional equity
              financing in 2021. The company maintains an official corporate correspondence address at 244 5th Avenue,
              Suite 2960, in New York, NY, but runs an entirely remote workforce spanning hundreds of professionals
              across the United States. Across its historical development, Articulate transitioned from standalone
              desktop authoring utilities into a unified cloud subscription ecosystem anchored by Articulate 360, which
              integrates rapid course authoring tools such as Storyline 360 and Rise 360 with collaborative review
              systems and native asset libraries. Commercial scale has expanded from 106,000 organizations and 112
              million learners reported in 2021 to over 125,000 customer organizations and 133 million learners across
              187 countries by 2026, including training adoption across all 100 of the Fortune 100 enterprise
              organizations.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
