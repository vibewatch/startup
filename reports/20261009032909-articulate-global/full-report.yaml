            title: Private Financial Opacity and TAM Ceiling Constraints
            body: >-
              Despite claiming adoption across 125,000+ organizations and all Fortune 100 companies, Articulate has not
              disclosed audited financial metrics, ARR growth, net revenue retention (NRR), or credit attach rates since
              its 2021 Series A. Without verified revenue segmentation, diligence cannot confirm whether market growth
              is driven by expanding seat counts or offsetting churn through AI pricing add-ons.
            calloutType: risk
            claimRefs:
