  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              The defensible competitive set is broader than dedicated course-authoring software. Vendr identifies Adobe
              Captivate, iSpring, and Lectora as Articulate's primary commercial alternatives, while Articulate's own
              2026 product announcement describes slides, messages, and videos as the improvised tools used when formal
              learning teams cannot meet every request. That status quo matters because it requires no new
              specialist-authoring purchase and is already embedded in departmental workflows. Articulate's response is
              to span both professional L&D and occasional business-team creators: the current platform pairs Articulate
              360 AI with Frontline, which is explicitly designed for training created outside L&D. This broadens the
              addressable creator base, but it also puts Articulate into competition with general-purpose productivity
              and AI tools. Internal build remains another alternative for organizations willing to combine document
              creation, an LMS, analytics, and translation vendors; the assigned pool does not quantify how often buyers
              choose that route.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
