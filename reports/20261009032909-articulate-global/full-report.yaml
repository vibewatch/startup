      - number: '3.3'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Articulate's strongest observable defenses are scale, workflow coverage, and product continuity rather
              than a proven technical monopoly. Current company surfaces report at least 125,000 organizations and more
              than 128 million learners, and the 2021 financing release records a $1.5 billion Series A at a $3.75
              billion valuation. Those disclosures indicate resources and an installed base, but neither funding raised
              nor customer reach establishes retention, cash availability, or switching cost. A useful moat test
              distinguishes hard-to-replicate advantages from well-executed but copyable strengths. On that test,
              Articulate's integrated authoring, review, distribution, analytics, and localization workflow may create
              friction, yet the assigned sources provide no migration rates, archive-conversion costs, NRR, or
              competitive win/loss evidence. Smartcat also demonstrates that part of the workflow can be unbundled: its
              competitor-issued page supports exporting Articulate XLIFF, translating externally, and importing the
              result. This does not prove displacement, but it shows that localization can multi-home outside the native
              suite. The prudent conclusion is a durable incumbent position with unquantified lock-in and credible
              commoditization pressure at the basic creation and translation layers.
            claimRefs:
              - CP003
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad workflow coverage is more defensible than any single AI feature
            body: >-
              Articulate combines professional authoring, informal-team creation, localization, distribution, and
              analytics. The evidence supports suite breadth, but not the magnitude of switching costs or retention.
