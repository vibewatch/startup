      - number: '3.2'
        title: Capability, Pricing, and Distribution
        blocks:
          - type: paragraph
            body: >-
              The evidence is strongest on commercial benchmarks and Articulate's own product direction, not on
              independently tested feature parity. Vendr reports an approximately $1,399 annual Articulate 360 list
              price for small teams and about $499 for standalone Rise, versus approximately $1,299 for Adobe Captivate,
              $770 for iSpring Suite, and $1,899 for Lectora Online. Those figures are third-party benchmarks rather
              than contemporaneous vendor quotes, and enterprise pricing is negotiated: Vendr says 15% to 30% below list
              is common for larger or multi-year Articulate purchases, while Articulate's own site routes purchasing
              questions through sales and global resellers. This structure gives large buyers room to multi-home during
              procurement by testing lower-priced authoring tools or using competitive bids. Product differentiation is
              clearer in Articulate-issued evidence: Nova supports training-kit generation, translation, and enterprise
              integrations, while the support history shows continuing investment in native localization. Because the
              pool contains no current official pages from Adobe, iSpring, or Lectora, unsupported capability cells
              remain explicitly unknown rather than inferred from price.
