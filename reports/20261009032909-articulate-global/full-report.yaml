      - number: '1.3'
        title: Financing History, Capitalization, and Stakeholder Mapping
        blocks:
          - type: paragraph
            body: >-
              Articulate completed one of the largest Series A growth equity transactions in enterprise software history
              on July 1, 2021, securing $1.5 billion in funding led by growth equity firm General Atlantic, with
              substantial co-investment from Blackstone Growth (BXG) and ICONIQ Growth, and advisory participation from
              LionTree. The transaction established a post-money equity valuation of $3.75 billion, providing the
              company with substantial growth capital while enabling partial secondary liquidity for early equity
              holders after 19 years of bootstrapped profitability. However, since the July 2021 capitalization
              announcement, Articulate Global has operated without publishing audited financial disclosures, post-2021
              valuation revisions, annual recurring revenue bridges, or operating cash balances. Outside independent
              estimates from employment intelligence databases such as LeadIQ project company employment in the 501 to
              1,000 employee band, contrasting with the historical 300-employee baseline cited at funding. The resulting
              stakeholder map pairs influential minority growth equity sponsors with founder control, leaving enterprise
              valuation assessments reliant on multi-year-old headline figures.
            claimRefs:
              - CO002
