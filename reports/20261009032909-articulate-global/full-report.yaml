              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Track Authoring Creates Enterprise Defensibility
            body: >-
              Articulate's strategic durability is anchored in the symbiosis between Rise 360 for high-velocity
              corporate content creation and Storyline 360 for high-fidelity compliance and process simulations. By
              allowing multi-language Storyline blocks to embed directly into responsive Rise courses, Articulate
              mitigates the trade-off between responsive web accessibility and deep instructional branching, cementing
              its platform footprint across enterprise L&D departments.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE013
          - type: callout
            title: Spatial XR Deficit and AI Dependency Present Long-Term Platform Exposure
            body: >-
              Despite dominance in 2D slide and block-based authoring, Articulate lacks a native 3D spatial simulation
              runtime, forcing customers with hands-on industrial and field training requirements to rely on external
              platforms like ThingLink. Additionally, rapid integration of third-party AI models for text-to-speech,
              translation, and chat creates dependency on external API providers and data-processing jurisdictions that
              necessitate stringent enterprise security verification.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation Across Enterprise L&D, SMBs, and Operational Workflows
        blocks:
          - type: paragraph
            body: >
              Articulate Global addresses corporate workplace learning through distinct buyer, user, and payer segments
              that govern commercial expansion and seat licensing leverage. The core customer population divides between
              centralized corporate Learning and Development (L&D) departments purchasing dedicated Articulate 360
              authoring suites for instructional designers and decentralized operational departments adopting simplified
              modules like Reach 360 and Frontline. In enterprise accounts, VP-level L&D and Human Resources executives
              act as economic buyers, while professional course authors utilize Storyline 360 and Rise 360 to construct
              complex compliance and technical training programs.


              At the line-of-business level, operational managers across customer support, technical operations, and
              commercial sales increasingly deploy e-learning authoring tools to replace unstructured documentation and
              costly multi-day instructor-led sessions. Enterprise deployments span Fortune 100 conglomerates that
              require SCORM and xAPI standard compatibility for corporate learning management systems (LMS) alongside
              mid-market firms seeking turnkey course creation and lightweight distribution. However, Articulate does
              not publish revenue breakdowns by customer size, vertical distribution, or geographic territory, leaving
              enterprise concentration and average contract values unverified.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
