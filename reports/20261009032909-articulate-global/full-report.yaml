  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Enterprise Spend Categories, and Status Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The enterprise learning and development software landscape spans distinct budget line items that determine
              software adoption and pricing leverage. Articulate Global operates primarily within the digital course
              authoring software and content creation layer, serving instructional designers and line-of-business
              creators. Enterprise buyers draw explicit boundaries between authoring software seats, learning management
              systems (LMS) or learning experience platforms (LXP) that host course catalogs, human-led external content
              development agencies, and generative AI productivity suites. Status quo substitutes remain deeply
              entrenched across departments, where informal training continues to rely on static presentation decks,
              internal documentation wikis, and unindexed video recordings that carry high ongoing maintenance friction
              without measurable completion or comprehension tracking.
            claimRefs:
