      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Purchasing authority across corporate workplace learning divides between centralized Human Resources and
              L&D leaders and decentralized departmental managers. Professional instructional designers in corporate L&D
              control specialized authoring budgets where compliance defensibility, complex branching logic, xAPI or
              SCORM standard conformance, and screen-reader accessibility govern tooling selection. Conversely, sales,
              customer support, and IT teams seek rapid, guided training creation to turn internal documents and slide
              decks into trackable digital lessons without programming overhead. Growth drivers include post-COVID
              hybrid workforce training demands, enterprise reskilling initiatives, and multilingual global workforce
              training across 80+ supported languages. Major adoption constraints center on enterprise software
              procurement reviews, instructional switching costs across legacy SCORM archives, and independent
              third-party tool alternatives for translation workflows.
