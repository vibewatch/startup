      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Structure
        blocks:
          - type: paragraph
            body: >-
              The corporate governance structure of Articulate Global reflects a deliberate transition from
              founder-centric operational bootstrapping to an institutional executive leadership model backed by
              top-tier growth private equity sponsors. Founder Adam Schwartz serves as Chief Executive Officer and
              Executive Chairman, retaining primary strategic authority over corporate direction, product design vision,
              and company philosophy. Operational continuity is managed alongside Vice Chair Lucy Suros, who previously
              served as company President during the 2021 recapitalization and continues to guide long-term
              organizational strategy. Financial stewardship, tax compliance, and commercial operations are directed by
              President and Chief Financial Officer Edwin Scholte, alongside Senior Vice President of Finance Trevor
              Renfield. The extended executive leadership team encompasses specialized functional heads across product,
              engineering, customer success, legal compliance, and learning design architecture. Because founder Adam
              Schwartz has driven core product design and organizational strategy since founding, key-person risk
              remains concentrated at the executive chairman tier, mitigated by institutional board representation from
              growth equity partners.
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
