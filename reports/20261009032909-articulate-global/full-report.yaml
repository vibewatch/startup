      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Shift from Pure Seat Licensing to Hybrid Consumption Architecture
            body: >-
              Articulate's core commercial model historically relied on high-margin annual subscription seats for
              dedicated instructional designers. The introduction of Frontline at $500 per year for unlimited seats,
              coupled with credit-based pricing for AI avatars and 80+ language translations ($250 per 50,000 credits),
              marks a structural shift toward capturing decentralized enterprise spend while protecting per-seat pricing
              power among specialized L&D authors.
            calloutType: insight
            claimRefs:
              - CM006
