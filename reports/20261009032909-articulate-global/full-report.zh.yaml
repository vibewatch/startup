      - number: '3.2'
        title: 能力、定价与分销
        blocks:
          - type: paragraph
            body: >-
              现有证据在商业基准和 Articulate 自身产品方向上最有力，而非独立测试的功能对等性。Vendr 报告 Articulate 360 小团队年标价约 $1,399，独立 Rise 约 $499；Adobe
              Captivate 约 $1,299，iSpring Suite $770，Lectora Online $1,899。这些是第三方基准而非供应商同期报价，企业价格需要谈判：Vendr 称大型或多年期
              Articulate 采购通常比标价低 15% 至 30%，而 Articulate
              官网将采购问题导向销售团队和全球经销商。该结构让大买方可在采购期间多平台并用，通过测试低价创作工具或采用竞争性报价。产品差异化在 Articulate 发布的证据中更清晰：Nova
              支持培训包生成、翻译和企业集成，支持历史也显示公司持续投入原生本地化。由于现有证据没有 Adobe、iSpring 或 Lectora 的最新官方页面，未获支持的能力字段应明确标为未知，而不能从价格推断。
