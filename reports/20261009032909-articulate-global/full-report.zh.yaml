            - G2 上的同行评价
        - label: 首次部门采购
          value: >-
            L&D teams purchase single or multi-seat Articulate 360 licenses funded via annual departmental training
            budgets
          touchpoints:
            - 直接信用卡或发票销售
            - 标准年度席位许可
            - SCORM LMS 打包导出
        - label: 企业生产环境部署
          value: >-
            Full-scale deployment across corporate L&D with security reviews, SSO integration, and standardized content
            libraries
          touchpoints:
            - 《财富》100 强企业协议
            - 集中式 IT 采购
            - 通过 xAPI/cmi5 集成 LMS/LXP
        - label: 运营邻近领域扩张
