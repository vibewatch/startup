  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、订阅架构与定价机制
        blocks:
          - type: paragraph
            body: >-
              Articulate Global 主要通过核心电子学习创作和工作场所培训平台的年度软件即服务（SaaS）订阅获得企业软件收入。创始人 Adam Schwartz 从 2002 年起以自有资金发展公司，直到
              2021 年 7 月获得机构成长资本；公司由此打造出面向教学设计师和企业培训团队的资本高效商业引擎。核心产品 Articulate 360
              是一套集成应用，帮助组织设计、审核、验证和发布可兼容企业学习管理系统（LMS）及现代学习体验平台的互动课程。除旗舰企业创作工具外，Articulate 还开发了 Rise，为不维护旧版 LMS
              基础设施的组织提供一体化系统，扩大了在企业部门和中型客户中的可触达范围。


              商业变现围绕席位许可、团队管理能力和按使用量计费的本地化升级展开。客户组织按年订阅，获得持续的云端更新、数字素材库和协作审核工作流。平台官方披露显示，Articulate 已从标准创作席位扩展到付费
              Articulate Localization 方案，让团队在激活商业发布权限前，跨数十种目标语言翻译并验证课程。然而，由于 Articulate
              仍是财务不透明的私营公司，实际净价、数量折扣安排，以及部门信用卡与集中式企业主服务协议（MSA）之间的精确收入分配仍未披露。
