          value: >-
            High-level multi-billion enterprise spending on global workforce development, external agencies, and
            infrastructure
        - label: 企业数字学习解决方案（广义 LMS / 内容）
          value: Integrated LMS platforms, learner analytics suites, and centralized corporate training infrastructure
        - label: 数字课程内容与创作系统（SAM）
          value: Seat-licensed enterprise authoring software ($1,449-$1,749/seat/yr) across corporate L&D teams
        - label: 部门与引导式培训扩张（Frontline SOM）
          value: Line-of-business informal training capture via flat-rate $500/year unlimited seat packaging
        - label: 按使用量计费的 AI 与本地化工作流
          value: >-
            High-margin credit consumption ($250 per 50,000 credits) for automated translation in 80+ languages and AI
            avatars
