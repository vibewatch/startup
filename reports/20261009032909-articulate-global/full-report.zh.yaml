figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Articulate Global 自 2002 年成立至 2026 年平台演进期间的公司、融资、运营和技术关键里程碑。
    data:
      items:
        - date: '2002-01-01'
          label: 公司成立与自力更生
          detail: Adam Schwartz 创立 Articulate Global，将其打造为一家自筹资金的电子学习软件公司。
          tone: positive
          claimRefs:
            - CO001
        - date: '2016-11-01'
          label: Articulate 360 发布
          detail: 推出 Articulate 360 订阅套件，整合 Storyline 360、Rise 360 和 Review。
          tone: positive
          claimRefs:
            - CO006
        - date: '2020-02-01'
          label: Rise.com 商业发布
          detail: 推出面向中小企业和企业团队的一体化轻量 LMS 与课程分发系统。
          tone: neutral
          claimRefs:
            - CO007
        - date: '2021-07-01'
          label: 历史性的 $1.5B Series A 融资轮次
          detail: 完成由 General Atlantic 领投的 $1.5B 机构 Series A 融资，公司估值达到 $3.75B。
          tone: positive
          claimRefs:
            - CO002
            - CO003
        - date: '2024-06-01'
          label: 最佳职场认可
          detail: 入选 Inc. Magazine 最佳职场榜单，彰显以人为本的远程文化。
          tone: neutral
          claimRefs:
            - CO010
        - date: '2025-04-08'
          label: Articulate 本地化发布
          detail: 在 Rise 360 和 Storyline 360 中引入集成式 AI 翻译，覆盖 70+ 种语言。
          tone: positive
          claimRefs:
            - CO013
        - date: '2025-05-27'
          label: DeepL 新一代 LLM 集成
          detail: 将翻译引擎升级为 DeepL 新一代 LLM，提升企业本地化质量。
          tone: positive
          claimRefs:
            - CO013
        - date: '2026-04-01'
          label: 商业本地化计划启用
          detail: 发布多语言验证工作流，并启用商业付费本地化层级。
          tone: neutral
          claimRefs:
            - CO013
        - date: '2026-10-09'
          label: 私募估值披露停滞
          detail: 连续第四年未更新 409A、财务审计或 ARR 披露。
          tone: negative
          claimRefs:
            - CO014
            - CO015
