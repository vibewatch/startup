      - number: '1.2'
        title: 高管领导、治理与关键人物结构
        blocks:
          - type: paragraph
            body: >-
              Articulate Global 的公司治理显示出一条清晰转变：公司从创始人主导的自有资金运营，走向由一线成长型私募股权机构支持的制度化高管模式。创始人 Adam Schwartz 担任 CEO
              和执行董事长，继续掌握公司方向、产品设计愿景及企业理念的主要战略决策权。公司运营由副董事长 Lucy Suros 协同管理；她曾在 2021 年资本重组期间担任总裁，如今继续负责长期组织战略。总裁兼 CFO
              Edwin Scholte 负责财务管理、税务合规和商业运营，财务高级副总裁 Trevor Renfield 与其并肩工作。扩展后的高管团队覆盖产品、工程、客户成功、法律合规和学习设计架构等职能。由于 Adam
              Schwartz 自创立以来一直主导核心产品设计和组织战略，关键人物风险仍集中在执行董事长一职，成长股权合作方的机构董事会代表可在一定程度上缓释该风险。
