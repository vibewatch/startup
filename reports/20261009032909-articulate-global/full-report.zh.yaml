    title: 企业客户采用与扩张旅程
    type: journey-map
    summary: 结构化客户旅程图，勾勒买方评估、部门部署以及 Articulate 产品之间的扩张循环。
    data:
      items:
        - label: 发现与试用
          value: Instructional designers test Rise 360 and Storyline 360 for authoring speed and modern responsive design
          touchpoints:
