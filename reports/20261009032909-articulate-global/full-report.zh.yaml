chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营模式与历史规模
        blocks:
          - type: paragraph
            body: >-
              Articulate Global, LLC 是一家专注于企业软件即服务的供应商，开发数字培训基础设施和电子学习创作应用。公司由 CEO Adam Schwartz 于 2002 年创立并以自有资金起步；在
              2021 年首次接受机构股权融资前，近二十年一直保持资本高效、非机构化运营。公司在纽约州纽约市 244 5th Avenue、Suite 2960
              设有官方通信地址，但实际采用完全远程的用工模式，员工遍布美国各地。随着业务发展，Articulate 从独立桌面创作工具转向以 Articulate 360 为核心的统一云订阅生态，将 Storyline
              360、Rise 360 等快速课程创作工具与协作审核系统和原生素材库整合起来。商业规模从 2021 年披露的 106,000 个组织和 112 million 名学员，增长到 2026 年覆盖 187
              个国家的逾 125,000 个客户组织和 133 million 名学员，其中包括 Fortune 100 的全部 100 家企业。
            claimRefs:
