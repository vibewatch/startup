      - number: '1.3'
        title: 融资历史、资本结构与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              2021 年 7 月 1 日，Articulate 完成企业软件历史上规模最大的 Series A 成长股权交易之一，由成长型股权公司 General Atlantic 领投，Blackstone
              Growth（BXG）和 ICONIQ Growth 大额共同投资，LionTree 提供顾问支持。交易确定投后股权估值为 $3.75B，并筹得 $1.5B，为公司提供大量成长资本，也让早期股东在 19
              年自有资金盈利后获得部分二级流动性。然而，自 2021 年 7 月公布资本化情况以来，Articulate Global 未发布经审计财务披露、2021
              年后的估值修订、年度经常性收入桥接表或运营现金余额。LeadIQ 等就业情报数据库的外部独立估算显示，公司员工数处于 501 至 1,000 人区间，与融资时披露的 300
              人历史基线形成对比。由此形成的利益相关方图谱，是有影响力的少数成长股权投资方与创始人控制权并存，企业估值判断仍依赖多年以前的 headline 数据。
