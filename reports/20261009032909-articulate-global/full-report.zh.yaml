        title: 展示项
        blocks:
          - type: callout
            title: 从纯席位许可转向混合消费架构
            body: >-
              Articulate 的核心商业模式过去依靠面向专业教学设计师的高毛利年度订阅席位。Frontline 以每年 $500 提供不限席位，再叠加 AI 头像和 80+ 种语言翻译的按额度定价（每 50,000
              个额度 $250），标志着公司转向捕获分散式企业支出，同时保护专业 L&D 作者的席位定价能力。
            calloutType: insight
