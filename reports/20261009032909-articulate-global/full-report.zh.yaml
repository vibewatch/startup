  - id: FE001
    title: Articulate 360 产品与交付架构栈
    type: stack
    summary: 六层架构栈，展示从基础内容输入到 LMS 分发包的演进。
    data:
      layers:
        - label: 分发与 LMS 遥测
          detail: 多标准打包与语句导出
          outputs:
            - SCORM 1.2 & 2004
            - xAPI（Tin Can）标准
            - cmi5 与 AICC 包
        - label: 交互与状态引擎
          detail: 客户端课程执行与决策逻辑
          modules:
            - 幻灯片层与对象状态
            - 操作触发器与条件
            - 变量与跟踪逻辑
        - label: 模拟与评估引擎
          detail: 交互式软件演练与能力测试
          modules:
            - 演示模式录制
            - 引导试用模式
            - 验证测试模式
            - Skip Ahead 自适应测验
        - label: 核心创作环境
          detail: 支持快速与复杂课程开发的双重模式
          modules:
            - Rise 360 响应式网页编辑器
            - Storyline 360 桌面创作客户端
            - 嵌入式多语言 Storyline 模块
        - label: 企业 AI 与翻译服务
          detail: 智能体 AI 生成与多语言工作流加速
          modules:
            - Nova 智能体课程起草
            - AI Tutor 对话测试版
            - DeepL 数据中心本地化
            - 快速布局调整
        - label: 内容与媒体摄取
          detail: 原始组织资产与协作反馈
          modules:
            - 演示文稿、文档与视频输入
            - AI 虚拟形象与文本转语音脚本
            - Review 360 利益相关方反馈
    approximationNotes: 基于已发布模块文档和部署规范，对 Articulate 360 产品栈的概念化呈现。
