      - number: '3.3'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Articulate 最强的可观察防御是规模、工作流覆盖和产品连续性，而不是已被证明的技术垄断。公司当前页面披露至少 125,000 个组织和超过 128 million 名学员，2021 年融资公告则记录了
              $1.5B Series A 和 $3.75B
              估值。这些披露说明公司拥有资源和安装基础，但融资额和客户触达都不能证明留存、现金可用性或切换成本。评估护城河时，应区分难以复制的优势与执行出色但可复制的能力。按此标准，Articulate
              将创作、审核、分发、分析和本地化整合到一个工作流，可能形成摩擦，但现有证据没有迁移率、档案转换成本、NRR 或竞争胜负数据。Smartcat 还表明部分工作流可以拆开：其竞争对手页面支持导出 Articulate
              XLIFF、在外部翻译，再导入结果。这不能证明客户会离开 Articulate，却说明本地化可以在原生套件之外多平台并用。审慎结论是：Articulate
              仍是持久的在位者，但锁定程度尚未量化，基础创作和翻译层面存在可信的商品化压力。
            claimRefs:
              - CP003
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 广泛工作流覆盖比任何单一 AI 功能更可辩护
