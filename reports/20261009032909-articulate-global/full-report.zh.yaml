        - label: 工作流与 AI 扩展
          value: >-
            Enterprise accounts adopt AI Assistant authoring credits and Articulate Localization for multi-language
            rollouts
          touchpoints:
            - AI 生成额度
            - 本地化增值订阅
            - 多语言课程发布
        - label: 采购摩擦与替代方案风险
