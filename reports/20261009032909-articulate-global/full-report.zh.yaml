              General Atlantic、Blackstone 和 ICONIQ 领投的 $1.5B Series A 融资，建立了位于普通股股东之前的强大优先资本层。在缺少活跃 IPO 市场，且
              EquityZen、Forge Global 等二级交易所没有更新 409A 估值成交价的情况下，如果企业软件倍数收缩导致退出价格低于历史 headline 基准，普通股股东将面临严重下行风险。
