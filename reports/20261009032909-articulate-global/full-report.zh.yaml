  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 市场格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              可辩护的竞争集合不止专用课程创作软件。Vendr 将 Adobe Captivate、iSpring 和 Lectora 列为 Articulate 的主要商业替代品，而 Articulate 自己 2026
              年的产品公告称，幻灯片、消息和视频是正式学习团队无法满足所有需求时使用的临时工具。这个现状很重要，因为它不需要新的专业创作软件采购，且已嵌入部门工作流。Articulate 的应对方式是同时覆盖专业 L&D
              和偶尔创作的业务团队：当前平台将 Articulate 360 AI 与明确面向 L&D 之外培训创作的 Frontline 配对。这扩大了可触达创作者基础，也让 Articulate 与通用生产力和 AI
              工具正面竞争。对愿意组合文档创作、LMS、分析和翻译供应商的组织而言，内部自建也是替代方案；现有证据没有量化买方选择这条路线的频率。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
