  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、企业支出类别与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              企业学习与发展软件市场涵盖多个独立预算科目，这些科目决定软件采用和定价议价能力。Articulate Global
              主要处于数字课程创作软件和内容制作层，为教学设计师及业务线创作者服务。企业买方会明确区分创作软件席位、承载课程目录的学习管理系统（LMS）或学习体验平台（LXP）、人工主导的外部内容开发机构，以及生成式 AI
              生产力套件。现状替代方案在各部门依然根深蒂固：非正式培训继续依赖静态演示文稿、内部文档 wiki 和未编目的视频录制，维护摩擦高，却无法量化跟踪完成率或理解程度。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
