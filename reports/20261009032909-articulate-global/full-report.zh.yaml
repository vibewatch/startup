      - number: '2.3'
        title: 买方分层、预算归属与采用约束
        blocks:
          - type: paragraph
            body: >-
              企业工作场所学习的采购权分布在集中式人力资源和 L&D 负责人，以及分散式部门经理之间。企业 L&D 中的专业教学设计师掌握专用创作预算；合规可辩护性、复杂分支逻辑、xAPI 或 SCORM
              标准兼容性及屏幕阅读器可访问性决定工具选择。相反，销售、客户支持和 IT
              团队希望快速、带引导地把内部文档和幻灯片变成可追踪的数字课程，不需要编程。增长动力包括后疫情时代的混合办公培训需求、企业再技能计划，以及覆盖 80+
              种支持语言的多语言全球员工培训。主要采用约束来自企业软件采购审查、旧版 SCORM 档案的教学内容迁移成本，以及翻译工作流的独立第三方工具替代品。
