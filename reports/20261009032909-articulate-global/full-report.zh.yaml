            title: 私营财务不透明与 TAM 上限约束
            body: >-
              尽管 Articulate 声称已覆盖 125,000+ 个组织和全部 Fortune 100 公司，但自 2021 年 Series A 以来，公司没有披露经审计财务指标、ARR
              增长、净收入留存率（NRR）或额度附加率。缺少经验证的收入分层，尽调无法确认市场增长来自席位数增加，还是由 AI 定价增值服务抵消流失。
