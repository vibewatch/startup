      - number: '2.2'
        title: 市场规模视角与受证据约束的 TAM/SAM/SOM 边界
        blocks:
          - type: paragraph
            body: >-
              严格尽调应以受约束的运营边界评估可触达市场规模，而不是套用笼统的全球电子学习预测。宏观企业电子学习研究估算全球市场规模达到数十亿美元，但 Articulate
              的可服务市场受专业教学设计师人数和按席位计费的企业许可模式约束。Articulate 从专用创作席位（Articulate 360 AI Teams 每席每年 $1,749）扩展到部门一线工具（每年
              $500、席位不限）以及翻译和 AI 视频头像的按额度计费层级，意在打开更广泛的运营预算。然而，私营公司的披露缺少经审计 ARR 拆分，无法独立核对高层次可触达支出与 Articulate 已占据的细分份额。
