  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构、核心模块与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Articulate Global 提供双轨工作场所学习架构，覆盖不同的企业创作工作流。基础是 Rise 360 和 Storyline
              360：前者是面向快速模块化课程生成的响应式网页创作环境，后者是为复杂、由逻辑驱动的交互而打造的桌面级创作工具。在现代企业培训工作流中，学习与发展团队既要速度，也要教学深度。Rise 360
              用预构建区块组件快速组装标准化课程；Storyline 360 则依靠幻灯片图层、状态、触发器和变量，充当高级交互引擎。为衔接这两种工作流，Articulate 支持将多语言 Storyline 区块直接嵌入
              Rise 360 课程，无需设计师维护彼此割裂的课程版本。近期季度功能更新通过 Skip Ahead Quizzes 和原生撤销/重做能力增强了教学分支，同时开放 AI Tutor 公测——这是一个在 Rise
              课程内部运行、理解课程上下文的对话代理，提供辅助而不打断学员进度。
            claimRefs:
              - CE001
