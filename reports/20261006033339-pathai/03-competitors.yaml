    title: "The clearest moat evidence is regulated workflow integration"
    body: "AISight Dx has an evidenced regulatory scope and named interoperability path. The assigned sources do not establish that PathAI's models outperform direct peers, so the investable differentiation is workflow adoption and regulatory integration rather than an unsupported accuracy claim."
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP012"
  - calloutType: "risk"
    title: "Commercial comparisons remain issuer-driven"
    body: "The only specific public price in the assigned pool comes from Deelo's own comparison, while RFP Wiki emphasizes services and data-rights diligence. Competitive underwriting should therefore require matched proposals and customer references before treating pricing or switching costs as a moat."
