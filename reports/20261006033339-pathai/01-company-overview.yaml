company:
  name: "PathAI"
chapter:
  number: 1
  title: "Company Overview"
  summary: "PathAI is an AI-powered digital pathology enterprise founded in 2016 in Boston, Massachusetts, that develops the AISight cloud workflow platform and algorithms for biopharma drug trials and clinical diagnostics. Having raised approximately $255 million in private venture funding through its May 2021 Series C round, the company entered into a definitive merger agreement in May 2026 to be acquired by Roche Holding AG for up to $1.05 billion ($750 million upfront plus up to $300 million in milestones), prompting biopharma counterparty governance reviews over platform neutrality."
sections:
  - id: "corporate-identity-and-leadership"
    title: "Corporate Identity, Foundation, and Governance"
    body: "PathAI was founded in 2016 in Boston, Massachusetts, by Chief Executive Officer Andrew H. Beck, M.D., Ph.D., and Chief Technology Officer Aditya Khosla, Ph.D. [CO001]. The enterprise was established to improve patient outcomes by applying modern machine learning and deep learning algorithms to histopathology, supporting both clinical diagnostic workflows and biopharma drug development programs [CO002]. The company operates corporate offices at 1325 Boylston Avenue, Suite 10000, in Boston [CO003]. Governance has historically been steered by a five-member board of directors, including co-founders Beck and Khosla alongside independent directors Stanley Lapidus, Dr. Michelle Dipp of General Atlantic, and Chairman Jeff Leiden [CO004]. Total operating headcount expanded from early-stage research teams of 25 to 60 employees in 2019 [CO005] to approximately 283 personnel globally by late 2026 according to workforce intelligence data [CO006], while broader industry estimates place staffing between 250 and 500 personnel prior to acquisition closing [CO007]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-acquisition"
    title: "Financing History and Roche Strategic Acquisition"
    body: "PathAI accumulated approximately $255 million in cumulative equity funding across five institutional financing rounds prior to its transaction agreement [CO008]. Notable financing milestones included an April 2019 $60 million Series B round led by General Atlantic with existing backer General Catalyst [CO009], followed by a May 2021 $165 million Series C round co-led by D1 Capital Partners and Kaiser Permanente, which valued the company at $1.11 billion post-money [CO010]. In May 2026, Swiss healthcare conglomerate Roche Holding AG entered into a definitive agreement to acquire PathAI for consideration of up to $1.05 billion, comprising $750 million in upfront cash and up to $300 million in performance-linked milestones [CO011]. The transaction structures PathAI's integration directly into Roche Diagnostics, positioning the business within Roche's clinical and tissue diagnostics franchise while leaving private venture-backed standalone standalone operations scheduled to transition upon closing in the second half of 2026 [CO011]."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO001"
      - "TO003"
  - id: "commercial-scale-and-ecosystem"
    title: "Product Evolution, Scale Metrics, and Ecosystem Exposure"
    body: "The core commercial software offering of the business is AISight, a cloud-native enterprise workflow and image management system powering digital pathology and AI application deployment across research centers and reference laboratories [CO012]. In June 2025, the U.S. Food and Drug Administration (FDA) granted 510(k) clearance (K243391) for AISight Dx as a Class II whole slide imaging system with an established Predetermined Change Control Plan (PCCP) [CO013]. Commercial scale accelerated through strategic partnerships, with PathAI ranking 420th on the 2024 Deloitte Technology Fast 500 based on 260% three-year revenue growth [CO014], and deploying AISight to Quest Diagnostics laboratories while selling select clinical lab assets to Quest [CO015]. However, the pending Roche acquisition creates counterparty governance risks, as PathAI had contracted ten major pharmaceutical collaborations—including non-Roche competitors Gilead Sciences, MSD, Novo Nordisk, GSK, Bristol Myers Squibb, EMD Serono, and Incendia Therapeutics—whose trial biomarker scoring and companion diagnostics become exposed to a major diagnostics competitor [CO016]."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
