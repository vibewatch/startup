evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-run-rate
    missingEvidence: >-
      Audited financial statements, ARR breakdown between software subscriptions and biopharma services, gross margins,
      and cash burn rate.
    whyItMatters: >-
      Enables precise valuation benchmarking and standalone economic assessment prior to absorption into Roche
      Diagnostics.
    diligencePath: >-
      Review internal financial disclosure schedules or integration accounting exhibits filed in connection with Roche's
      diagnostic division reporting.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance-leadership-TO002
    missingEvidence: >-
      Complete historical directory of all vice presidents, functional department heads, and observer seats on PathAI's
      board of directors.
    whyItMatters: >-
      Table TO002 provides a sample of core founders and key independent directors rather than an exhaustive
      organizational census.
    diligencePath: >-
      Inspect formal corporate minutes, Delaware secretary of state officer filings, and corporate governance records
      upon merger closing.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: capitalization-cap-table-TO003
    missingEvidence: >-
      Full shareholder cap table showing exact share allocations, option pool reserves, secondary transaction transfers,
      and debt instruments.
    whyItMatters: >-
      Table TO003 enumerates prominent lead institutional investors and strategic acquirers rather than every minor
      syndicate participant.
    diligencePath: >-
      Review definitive merger disclosure schedules and stockholder allocation rosters compiled for Roche acquisition
      closing.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-segmentation
    missingEvidence: >-
      Audited primary accounting disclosures disaggregating PathAI's historical standalone annual recurring revenue
      between biopharma research contracts and clinical diagnostic software licenses.
    whyItMatters: >-
      Without segmented revenue disclosures, the exact serviceable obtainable market (SOM) conversion rate for clinical
      versus pharma software cannot be verified.
    diligencePath: >-
      Review internal management reporting, Roche transaction carve-out financial statements, or commercial contract
      pipeline metrics.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-models
    missingEvidence: >-
      Matched vendor proposals showing realized software, services, implementation, hardware, storage, discount, and
      renewal economics.
    whyItMatters: A competitor-issued list-price comparison cannot establish total deployed cost or pricing power.
    diligencePath: Request comparable quotes and executed-contract references from PathAI and at least three direct peers.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-economics
    missingEvidence: >-
      Customer migration histories, multi-homing behavior, integration effort, implementation time, and internal-build
      cost benchmarks.
    whyItMatters: >-
      Without buyer-side evidence, regulatory integration cannot be translated into quantified retention or switching
      cost.
    diligencePath: >-
      Interview recent adopters and churned customers and build a scanner-, LIS-, validation-, and staffing-level
      migration model.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: material
    topic: peer-performance
    missingEvidence: >-
      Direct competitor product documentation, current regulatory records, security materials, and matched accuracy and
      throughput benchmarks.
    whyItMatters: >-
      Directory descriptions identify categories but cannot prove feature parity, regulatory equivalence, or clinical
      superiority.
    diligencePath: >-
      Collect primary documentation and run the same representative slide and workflow protocol across shortlisted
      vendors.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Audited GAAP income statement segmenting biopharma software contracts from physical CLIA laboratory services
      revenue.
    whyItMatters: Blended revenue figures obscure the underlying gross margin quality and recurring SaaS durability of the business.
    diligencePath: Obtain the confidential disclosure schedule and audited financial statements from the Roche transaction data room.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Audited pre-deal balance sheet detailing cash and cash equivalents, outstanding debt obligations, and monthly
      operating cash burn.
    whyItMatters: >-
      Determines whether PathAI had sufficient standalone runway to negotiate from commercial strength versus an
      impending financing crunch.
    diligencePath: Inspect pre-closing capitalization tables, working capital settlement certificates, and cash flow schedules.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: standalone-cdx-approvals
    missingEvidence: >-
      Public FDA documentation confirming standalone Premarket Approval (PMA) or 510(k) clearance for PathAI's automated
      AI diagnostic algorithms (e.g., automated cancer detection) independent of the AISight Dx image viewing system.
    whyItMatters: >-
      While AISight Dx is cleared as a viewing and management system, automated AI diagnostic models remain restricted
      to research use or investigational use until cleared as formal companion diagnostics or computer-assisted
      detection software.
    diligencePath: >-
      Review FDA CDRH device clearance database for subsequent algorithm-specific 510(k) or PMA submissions and inquire
      with company regulatory affairs regarding the status of pending CDx submissions.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: minor
    topic: cloud-latency-and-egress
    missingEvidence: >-
      Quantitative latency benchmarks for whole-slide gigapixel image rendering over commercial laboratory broadband
      connections and annualized AWS egress cost metrics.
    whyItMatters: >-
      Whole slide images frequently exceed 1 to 2 gigabytes each; slow rendering latency can impede pathologist clinical
      adoption, while high cloud bandwidth costs impact gross software margins.
    diligencePath: >-
      Request internal engineering telemetry on average slide tile render times across customer network tiers and AWS
      cloud infrastructure billing allocations.
    relatedQuestionRefs:
      - QE001
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn-metrics
    missingEvidence: >-
      Audited figures for Net Revenue Retention (NRR), Gross Revenue Retention (GRR), customer lifetime value (LTV), and
      churn rates across reference lab and biopharma customer tiers.
    whyItMatters: >-
      Without retention and NRR data, investors cannot verify the organic durability of software revenues or assess
      whether customer expansion offsets implementation and sales costs.
    diligencePath: >-
      Request confidential disclosure of customer renewal histories, annual contract value (ACV) expansion cohorts, and
      pilot-to-production conversion rates from management during acquisition review.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-register-completeness
    missingEvidence: >-
      Exhaustive roster of all commercial laboratory deployments, academic hospital accounts, and active clinical trial
      biopharma contracts beyond the sample of publicly disclosed marquee partnerships.
    whyItMatters: >-
      A sample enumeration of announced partnerships omits smaller commercial laboratory accounts and stealth biopharma
      trial engagements that determine baseline recurring revenue stability.
    diligencePath: >-
      Review full master service agreement (MSA) customer roster, statement of work (SOW) backlog, and commercial
      account ARR stratification in the virtual data room.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: milestone-uncertainty
    missingEvidence: Exact definitions, performance metrics, and clinical endpoints triggering payment of the $300M milestone earnout.
    whyItMatters: >-
      The $300M earnout represents 28.6% of maximum nominal transaction proceeds, materially altering valuation
      realizations.
    diligencePath: Review definitive merger agreement exhibits or Roche regulatory filings specifying milestone triggers.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: earnout-milestone-criteria
    missingEvidence: >-
      Exact technical, regulatory, and commercial milestone definitions and hurdles required to unlock the $300 million
      earnout.
    whyItMatters: Determines whether risk-adjusted transaction proceeds exceed the $750 million guaranteed base.
    diligencePath: >-
      Review definitive merger agreement disclosures, SEC proxy statements if available, or request transaction
      disclosure schedules.
    relatedQuestionRefs:
      - QV008
