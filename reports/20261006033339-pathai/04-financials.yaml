callouts:
  - calloutType: "insight"
    title: "Revenue Model Bifurcation Between Software and Wet Lab Services"
    body: "PathAI operates a hybrid commercial architecture that differs substantially from pure-play SaaS vendors. By maintaining a CAP/CLIA-certified laboratory in Memphis alongside its Boston AI software headquarters, the company captures lucrative end-to-end biopharma research contracts but incurs the operational and capital overhead of clinical wet-lab testing. Standalone financial underwriting cannot treat PathAI as a standard 80%+ gross margin software enterprise without audited segmentation of its reported revenue."
    claimRefs:
      - "CI001"
      - "CI004"
      - "CI007"
      - "CI009"
  - calloutType: "risk"
    title: "Milestone Contingency and Standalone Opacity in the Roche Transaction"
    body: "While Roche's acquisition agreement values PathAI at up to $1.05B to $1.1B, $300M of the transaction is structured as earn-out milestone payments contingent on unspecified operational or commercial targets. Standalone financial indicators including gross margin, annual net burn, and independent cash runway remain completely private, leaving external analysts unable to determine whether the transaction was executed from a position of commercial strength or impending capital depletion."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI015"
      - "CI016"
