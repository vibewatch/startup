  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Conventional Workflow
      - PathAI Solution
      - Measurable / Operational Benefit
      - Technical & Workflow Limitation
    rows:
      - - Primary Diagnostic Review
        - Physical examination of glass slides via optical microscope with manual paperwork
        - AISight Dx digital slide review with synchronized case worklists via LIS
        - Eliminates physical slide transport; enables rapid digital case sharing and second opinions
        - Requires validated high-resolution medical displays and compatible 510(k) scanners
      - - LIS Case Synchronization
        - Dual-entry or disconnected accessioning between laboratory LIS and imaging viewers
        - AISight Link bi-directional LIS integration engine
        - Synchronizes open cases automatically; reduces sample identification and labeling errors
        - Requires custom interface adapters for legacy hospital information systems
      - - Clinical Trial Histology Scoring
        - Manual glass reading by individual pathologists subject to substantial inter-rater variability
        - AIM-NASH algorithm-assisted central pathology scoring
        - Standardizes staging/grading criteria; achieves non-inferiority to glass consensus
        - Requires validated digital reading platforms and rigorous scanner calibration protocols
      - - Enterprise Image Archiving
        - Proprietary, siloed digital pathology file storage systems (e.g., SVS, NDPI formats)
        - DICOM Visible Light (VL) whole-slide support and DICOMweb API
        - Unifies pathology imaging into Vendor Neutral Archives alongside radiology
        - High network bandwidth and massive cloud storage requirements for gigapixel files
    notes: >-
      Workflow parameters derived from PathAI technical announcements, clinical study presentations, and regulatory
      filings.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Architecture Layer
      - Core Technologies & Components
      - Operational Role
      - Critical External Dependency
      - Technical Risk & Failure Mode
    rows:
      - - Presentation & Viewing Layer
        - Web-based zero-footprint viewer, HTML5/Canvas rendering engine
        - Interactive whole-slide navigation, digital annotation, pan/zoom across gigapixel images
        - Client web browser compatibility (Chrome, Edge) and calibrated diagnostic displays
        - Client-side rendering latency and display color profile calibration drift
      - - Application & API Layer
        - Python, FastAPI, Django, Django REST Framework, Docker
        - User authentication, case management, worklist distribution, RESTful API endpoints
        - Container runtime environment and microservices orchestration
        - Service interface regressions during rapid API updates across external LIS integrations
      - - Interoperability & Data Layer
        - AISight Link, DICOM Visible Light (VL), DICOMweb API, HL7/FHIR interfaces
        - Bi-directional LIS case synchronization, image push/pull to Vendor Neutral Archives
        - Hospital LIS interfaces and enterprise PACS/VNA network configurations
        - Network firewall restrictions and proprietary protocol mismatches from legacy lab systems
      - - Machine Learning & Compute
        - PyTorch, Multi-Instance Learning (MIL) models, GPU inference pipelines
        - Cellular feature extraction, biomarker quantification, patch-level classification
        - Pre-trained model weights derived from 20M+ annotations and GPU compute hardware
        - Out-of-distribution performance drops due to staining variability across external slide preparations
      - - Cloud Infrastructure Layer
        - AWS EKS (Kubernetes), S3, RDS/PostgreSQL, SQS, MSK/Kafka, RabbitMQ
        - Elastic compute scaling, high-throughput whole slide image storage, asynchronous task queuing
        - Amazon Web Services cloud availability and HIPAA-compliant hosting agreements
        - Cloud egress cost escalation and unexpected cloud service interruptions
    notes: Stack components identified via PathAI engineering infrastructure specifications and architecture disclosures.
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
      - CE014
