      - number: '1.3'
        title: Product Evolution, Scale Metrics, and Ecosystem Exposure
        blocks:
          - type: paragraph
            body: >-
              The core commercial software offering of the business is AISight, a cloud-native enterprise workflow and
              image management system powering digital pathology and AI application deployment across research centers
              and reference laboratories [CO012]. In June 2025, the U.S. Food and Drug Administration (FDA) granted
              510(k) clearance (K243391) for AISight Dx as a Class II whole slide imaging system with an established
              Predetermined Change Control Plan (PCCP) [CO013]. Commercial scale accelerated through strategic
              partnerships, with PathAI ranking 420th on the 2024 Deloitte Technology Fast 500 based on 260% three-year
              revenue growth [CO014], and deploying AISight to Quest Diagnostics laboratories while selling select
              clinical lab assets to Quest [CO015]. However, the pending Roche acquisition creates counterparty
              governance risks, as PathAI had contracted ten major pharmaceutical collaborations—including non-Roche
              competitors Gilead Sciences, MSD, Novo Nordisk, GSK, Bristol Myers Squibb, EMD Serono, and Incendia
              Therapeutics—whose trial biomarker scoring and companion diagnostics become exposed to a major diagnostics
              competitor [CO016].
