      - number: '1.2'
        title: Financing History and Roche Strategic Acquisition
        blocks:
          - type: paragraph
            body: >-
              PathAI accumulated approximately $255 million in cumulative equity funding across five institutional
              financing rounds prior to its transaction agreement [CO008]. Notable financing milestones included an
              April 2019 $60 million Series B round led by General Atlantic with existing backer General Catalyst
              [CO009], followed by a May 2021 $165 million Series C round co-led by D1 Capital Partners and Kaiser
              Permanente, which valued the company at $1.11 billion post-money [CO010]. In May 2026, Swiss healthcare
              conglomerate Roche Holding AG entered into a definitive agreement to acquire PathAI for consideration of
              up to $1.05 billion, comprising $750 million in upfront cash and up to $300 million in performance-linked
              milestones [CO011]. The transaction structures PathAI's integration directly into Roche Diagnostics,
              positioning the business within Roche's clinical and tissue diagnostics franchise while leaving private
              venture-backed standalone standalone operations scheduled to transition upon closing in the second half of
              2026 [CO011].
