      - number: '5.4'
        title: Clinical Validation, Regulatory Clearances, and Deployment Constraints
        blocks:
          - type: paragraph
            body: >-
              Transitioning artificial intelligence models from computational research into regulated diagnostic
              infrastructure imposes rigorous clinical and technological constraints. While PathAI achieved FDA 510(k)
              clearance K243391 in June 2025 for AISight Dx as a Class II medical device, the clearance is legally tied
              to specific validated whole-slide imaging hardware predicates—specifically the Hamamatsu NanoZoomer S360MD
              and Leica Aperio GT 450 DX scanners—alongside designated medical displays from Barco, JVC Kenwood, and
              Dell. The platform incorporates a Predetermined Change Control Plan (PCCP) to govern incremental hardware
              and browser additions without requiring full de novo submissions. However, significant product and
              technical risks persist: multi-instance learning models face generalization hurdles when encountering
              variations in tissue staining protocols across unaffiliated laboratories, necessitating hundreds of
              thousands of annotated data points to mitigate the risk of algorithmic misdiagnosis. Furthermore,
              enterprise adoption requires ongoing maintenance of bi-directional LIS synchronization and enterprise
              cybersecurity safeguards across multi-tenant cloud environments.
            claimRefs:
              - CE007
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'FDA 510(k) Scope: Software Clearance Versus Hardware Coupling'
            body: >-
              AISight Dx's 510(k) clearance (K243391) represents a substantial regulatory milestone, establishing PathAI
              as a cleared primary diagnostic viewer. However, investors must recognize that whole-slide imaging
              clearances legally couple software to specific scanner hardware and display profiles. While the
              Predetermined Change Control Plan (PCCP) eases future hardware additions, clinical adoption remains
              tethered to hospital capital scanner cycles.
            calloutType: insight
            claimRefs:
              - CE007
              - CE014
          - type: callout
            title: The Data Generalization Boundary in Pathology AI
            body: >-
              Algorithmic efficacy in histopathology is fundamentally bounded by data diversity. Deep learning models
              employing multi-instance learning require hundreds of thousands of expert-annotated slide instances to
              prevent severe performance degradation when exposed to variations in laboratory tissue preparation,
              fixation, and staining protocols.
            calloutType: risk
            claimRefs:
              - CE009
              - CE013
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Multi-Tier Commercial Architecture
        blocks:
          - type: paragraph
            body: >-
              PathAI operates a dual-pronged commercial architecture addressing clinical laboratory networks and
              biopharmaceutical sponsors [CU001, CU006]. In the clinical diagnostics vertical, the core offering centers
              on the AISight and AISight Dx digital pathology image management platforms, deployed across anatomical
              pathology laboratories, hospital systems, and reference laboratories to transition manual microscope
              review to automated digital workflows [CU001, CU004, CU008]. In the biopharma vertical, enterprise
              sponsors engage PathAI for high-throughput tissue slide scanning, computational biomarker discovery,
              patient stratification in clinical trials, and companion diagnostic (CDx) algorithm co-development [CU002,
              CU007]. Commercial arrangements for laboratories typically follow software subscription and enterprise
              workflow licensing models, whereas biopharmaceutical engagements combine multi-year research service
              contracts, per-slide trial analysis fees, and milestone-linked companion diagnostic development agreements
              [CU002, CU007]. Commercial traction is supported by specialized subspecialty expertise and lab network
              infrastructure gained through operating initiatives such as the Poplar Healthcare acquisition [CU003].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU006
              - CU007
              - CU008
