  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Enterprise Digital Pathology and Clinical Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              PathAI defines its core technology offering around the digitization and computational analysis of
              histopathology workflows. Traditional pathology practices rely heavily on manual optical microscopy of
              glass slides prepared from formalin-fixed, paraffin-embedded (FFPE) tissue, introducing diagnostic
              turnaround friction and inter-observer variability. PathAI addresses this operational bottleneck through
              AISight, a cloud-native enterprise image management system designed to serve as a central workflow hub for
              clinical laboratories, academic health systems, and biopharmaceutical sponsors. Within routine laboratory
              operations, pathologists utilize AISight Link to establish bi-directional integration with existing
              Laboratory Information Systems (LIS), allowing practitioners to launch digital slides, case data, and AI
              algorithm results directly from active worklists without fracturing the specimen chain of custody. By
              standardizing whole slide image review and integrating image management into laboratory networks, PathAI
              seeks to transition clinical pathology from fragmented manual glass examination to centralized digital
              diagnostics.
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
      - number: '5.2'
        title: 'Product Matrix: AISight, AISight Dx, and Biopharma AI Solutions'
        blocks:
          - type: paragraph
            body: >-
              PathAI structures its commercial offerings across two primary customer segments: pathology laboratories
              and biopharmaceutical research organizations. At the foundation of the clinical diagnostic suite is
              AISight Dx, a web-based, software-only medical device cleared under FDA 510(k) (K243391) under 21 CFR
              864.3700 for primary diagnostic viewing and management of digital whole slide images. For
              biopharmaceutical partners, PathAI provides translational research algorithms, clinical trial services,
              and real-world data assets across therapeutic areas including metabolic dysfunction-associated
              steatohepatitis (MASH/NASH), inflammatory bowel disease (IBD), and oncology. These specialized algorithms,
              including AIM-NASH and NASH Explore, assist central pathologists in standardizing histological scoring,
              reducing reader variability in clinical trial inclusion criteria, and quantifying continuous sub-ordinal
              tissue measurements over trial time points.
            claimRefs:
              - CE002
              - CE004
              - CE006
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE007
      - number: '5.3'
        title: 'Computational Architecture: Deep Learning, Interoperability, and Cloud Operations'
        blocks:
          - type: paragraph
            body: >-
              The technical architecture of PathAI's platform is engineered to handle gigabyte-scale Whole Slide Images
              (WSIs) comprising billions of pixels. At the algorithmic layer, PathAI utilizes PyTorch to implement
              multi-instance learning (MIL), dividing massive slide images into localized patches to model cellular
              phenotypes and tissue microenvironments while circumventing human ocular fatigue. At the data and
              standards layer, AISight supports DICOM Visible Light Whole Slide Microscopy standards and DICOMweb APIs,
              enabling interoperability with enterprise Vendor Neutral Archives (VNAs) and cross-modality clinical
              archiving. Operationally, PathAI's software platform is deployed on Amazon Web Services (AWS) utilizing
              containerized microservices managed via Elastic Kubernetes Service (EKS), relational data management on
              RDS/PostgreSQL, object storage in S3, asynchronous message streaming via MSK/Kafka and RabbitMQ, and
              backend application services developed in Python with FastAPI and Django REST Framework.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE009
