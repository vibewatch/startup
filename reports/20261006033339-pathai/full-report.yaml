      - number: '6.2'
        title: Named Enterprise Deployments and Diagnostic Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of PathAI's clinical platform reached enterprise scale with Labcorp's nationwide
              expansion announced in February 2026 [CU001, CU009]. Building upon an initial strategic investment in
              2019, Labcorp committed to deploying AISight Dx across its national network of anatomic pathology
              laboratories and hospital collaborations, integrating AI image analysis, secure cloud storage, and digital
              case management into routine clinical care and precision medicine initiatives [CU001, CU009]. In parallel,
              PathAI has established translational research and biomarker discovery partnerships with over ten leading
              global pharmaceutical companies, including Bristol Myers Squibb, Gilead Sciences, MSD, Novo Nordisk, GSK,
              and EMD Serono [CU005, CU007]. The platform's regulatory credibility is anchored by FDA 510(k) clearance
              K243391 for AISight Dx as a Class II whole slide imaging system with a cleared Predetermined Change
              Control Plan (PCCP), providing legal clearance for primary diagnostic review in FFPE surgical pathology
              tissue sections [CU004, CU008]. Nevertheless, public disclosures omit exact active laboratory account
              tallies, customer retention rates, and annual recurring revenue run rates [CU010].
            claimRefs:
              - CU001
              - CU004
