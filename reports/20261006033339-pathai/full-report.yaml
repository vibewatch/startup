              - CR010
      - number: '7.2'
        title: Regulatory Oversight, Medical Device Software, and Predetermined Change Controls
        blocks:
          - type: paragraph
            body: >-
              PathAI operates under stringent medical device regulatory frameworks governing clinical software and
              diagnostic tools. In June 2025, the U.S. Food and Drug Administration (FDA) cleared PathAI's premarket
              notification K243391 for AISight Dx as a Class II Whole Slide Imaging System under 21 CFR 864.3700 with
              product code QKQ [CR006]. Crucially, the clearance incorporates an approved Predetermined Change Control
              Plan (PCCP) pursuant to section 515C of the Federal Food, Drug, and Cosmetic Act [CR007]. While the PCCP
              grants PathAI defined flexibility to update software algorithms and qualify interoperable displays,
              scanners, and file formats without submitting de novo 510(k) notifications, any architectural modification
              or algorithmic drift exceeding established bounds constitutes illegal adulteration and misbranding
              [CR007]. PathAI must maintain continuous compliance with 21 CFR Part 820 Quality System Regulations,
              including design controls, nonconforming product procedures, and corrective and preventive action (CAPA)
              mandates [CR007]. In vitro diagnostic use is strictly restricted to formalin-fixed paraffin embedded
              (FFPE) tissue, with explicit contraindications prohibiting cytology, frozen sections, and non-FFPE
              hematopathology [CR006]. Diagnostic errors or unvalidated hardware interoperability could trigger FDA
              warning letters, mandatory software recalls, or commercial distribution injunctions.
            claimRefs:
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
