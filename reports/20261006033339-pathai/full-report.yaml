      - number: '4.2'
        title: Operating Cost Structure, Gross Margins, and Laboratory Service Delivery
        blocks:
          - type: paragraph
            body: >-
              PathAI's operating cost structure is bifurcated between high-margin cloud software inference and
              capital-intensive clinical laboratory operations. The company maintains an active corporate and software
              engineering presence in Boston, Massachusetts, while operating a CAP/CLIA-certified wet laboratory in
              Memphis, Tennessee. This dual structure creates distinct delivery cost drivers: cloud infrastructure
              spanning Google Cloud Platform, Kubernetes container clusters, and machine learning model training on the
              one hand, and specialized histology equipment, wet lab consumables, and licensed laboratory personnel on
              the other. Standalone gross margin percentages, compute expense per processed whole-slide image, and
              laboratory processing margins are not publicly disclosed by the company, leaving standalone unit economic
              viability opaque for outside investors.
