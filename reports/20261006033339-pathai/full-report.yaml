  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Governance
        blocks:
          - type: paragraph
            body: >-
              PathAI was founded in 2016 in Boston, Massachusetts, by Chief Executive Officer Andrew H. Beck, M.D.,
              Ph.D., and Chief Technology Officer Aditya Khosla, Ph.D. [CO001]. The enterprise was established to
              improve patient outcomes by applying modern machine learning and deep learning algorithms to
              histopathology, supporting both clinical diagnostic workflows and biopharma drug development programs
              [CO002]. The company operates corporate offices at 1325 Boylston Avenue, Suite 10000, in Boston [CO003].
              Governance has historically been steered by a five-member board of directors, including co-founders Beck
              and Khosla alongside independent directors Stanley Lapidus, Dr. Michelle Dipp of General Atlantic, and
              Chairman Jeff Leiden [CO004]. Total operating headcount expanded from early-stage research teams of 25 to
              60 employees in 2019 [CO005] to approximately 283 personnel globally by late 2026 according to workforce
              intelligence data [CO006], while broader industry estimates place staffing between 250 and 500 personnel
              prior to acquisition closing [CO007].
