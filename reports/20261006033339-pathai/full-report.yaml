  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Taxonomy, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The AI-based digital pathology market represents an architectural transition in anatomic pathology,
              substituting manual glass-slide optical microscopy with high-resolution whole slide imaging (WSI) and
              algorithmic cellular analysis. In this market structure, PathAI delineates its addressable boundary across
              two primary commercial domains: biopharmaceutical translational research and clinical in vitro diagnostic
              (IVD) pathology. Biopharma spend encompasses computational biomarker discovery, patient stratification
              algorithms for oncology clinical trials, and quantitative histopathology assay development. In contrast,
              clinical diagnostic spend encompasses enterprise image management systems (IMS) and
              software-as-a-medical-device (SaMD) diagnostic decision support for hospital laboratories and reference
              centers. Crucially, the total market spend excludes capital-intensive whole-slide hardware scanners,
              laboratory information systems (LIS) core licenses, and general cloud infrastructure hosting, focusing
              purely on digital pathology software and specialized AI analysis solutions. The persistent status-quo
              substitute remains traditional light microscopy, which carries zero incremental digital workflow license
              fees and retains entrenched clinical acceptance among practicing pathologists.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing, Growth Trajectory, and Commercial Lenses
        blocks:
          - type: paragraph
            body: >-
              Industry market sizing projections quantify the global AI-based digital pathology software and services
              market at $1.01 billion in baseline market value, expanding to $2.32 billion by 2035 at an annualized
              compound growth rate (CAGR) of 8.7%. Substantial private venture and strategic capital—exceeding $2.0
              billion invested across more than 60 funding transactions globally—has flowed into the sector to finance
              neural network development and clinical validation studies. Growth within the sector is led by deep
              learning architectures, specifically convolutional neural networks (CNNs), which dominate automated tissue
              segmentation, cell proliferation scoring (such as Ki67 assays), and tumor microenvironment
              characterization. Geographically, North America represents the largest revenue-generating market due to
              concentrated biopharma research expenditure and early digital pathology laboratory adoption, whereas
              Europe is forecasted to experience a higher CAGR. Research institutes and pharmaceutical sponsors
              currently comprise the largest share of realized software spending, while clinical diagnostic facilities
              demonstrate the highest forward growth potential as regulatory clearances unlock routine primary
              diagnostic workflows.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
