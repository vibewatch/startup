callouts:
  - calloutType: "risk"
    title: "Biopharma Vendor Neutrality Friction Post-Acquisition"
    body: "PathAI's acquisition by Roche Diagnostics transforms an independent platform vendor into a wholly owned subsidiary of a major diagnostics competitor. Competing pharmaceutical companies engaged in oncology clinical trials may resist sharing proprietary whole-slide biopsy data and exploratory biomarker endpoints with a Roche-owned entity, posing substantial churn risk for commercial biopharma services."
    claimRefs:
      - "CR001"
      - "CR004"
      - "CR008"
  - calloutType: "insight"
    title: "Regulatory Change Control Flexibility vs. Strict Boundary Constraints"
    body: "The FDA's inclusion of a Predetermined Change Control Plan (PCCP) in the K243391 clearance for AISight Dx provides PathAI with an invaluable regulatory advantage by permitting iterative software modifications without repetitive 510(k) filings. However, any algorithmic modification that alters clinical intended use or deviates from pre-specified validation protocols risks immediate FDA enforcement."
    claimRefs:
      - "CR006"
      - "CR007"
