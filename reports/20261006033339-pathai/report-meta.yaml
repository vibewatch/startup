companyProfile:
  summary: >-
    PathAI is an AI-enabled digital pathology company founded in Boston in 2016 that sells AISight workflow software,
    AISight Dx clinical viewing, and biopharma analysis services. The business raised about $255 million in private
    capital before entering a definitive May 2026 acquisition agreement with Roche Holding AG for up to $1.05 billion,
    leaving the standalone financial profile opaque but confirming material strategic value.
