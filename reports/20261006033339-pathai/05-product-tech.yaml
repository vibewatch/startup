callouts:
  - calloutType: "insight"
    title: "FDA 510(k) Scope: Software Clearance Versus Hardware Coupling"
    body: "AISight Dx's 510(k) clearance (K243391) represents a substantial regulatory milestone, establishing PathAI as a cleared primary diagnostic viewer. However, investors must recognize that whole-slide imaging clearances legally couple software to specific scanner hardware and display profiles. While the Predetermined Change Control Plan (PCCP) eases future hardware additions, clinical adoption remains tethered to hospital capital scanner cycles."
    claimRefs:
      - "CE007"
      - "CE014"
  - calloutType: "risk"
    title: "The Data Generalization Boundary in Pathology AI"
    body: "Algorithmic efficacy in histopathology is fundamentally bounded by data diversity. Deep learning models employing multi-instance learning require hundreds of thousands of expert-annotated slide instances to prevent severe performance degradation when exposed to variations in laboratory tissue preparation, fixation, and staining protocols."
    claimRefs:
      - "CE009"
      - "CE013"
      - "CE015"
