  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与治理
        blocks:
          - type: paragraph
            body: >-
              PathAI 由首席执行官 Andrew H. Beck, M.D., Ph.D. 和首席技术官 Aditya Khosla, Ph.D. 于 2016 年在 Massachusetts 的 Boston 创立
              [CO001]。公司成立的目的，是把现代机器学习和深度学习算法用于组织病理学，改善患者结局，同时支持临床诊断工作流和生物医药药物开发项目 [CO002]。公司办公地址位于 Boston 的 1325
              Boylston Avenue, Suite 10000 [CO003]。历史上，公司治理由五人董事会主导，成员包括联合创始人 Beck、Khosla，以及独立董事 Stanley Lapidus、General
              Atlantic 的 Dr. Michelle Dipp 和董事长 Jeff Leiden [CO004]。运营团队从早期 25 至 60 人的研究团队（2019 年）[CO005]，扩展到 2026
              年底前后全球约 283 名员工（据劳动力情报数据）[CO006]；更宽泛的行业估计则认为，收购交割前员工规模在 250 至 500 人之间 [CO007]。
            claimRefs:
