  - id: FU001
    title: PathAI 客户采用旅程与扩张生命周期
    type: journey-map
    summary: 展示临床实验室和生物制药赞助方采用、扩展并嵌入 PathAI 数字病理平台的生命周期阶段。
    data:
      items:
        - label: 第 1 阶段：发现与评估
          stage: 发现与评估
          buyer: Biopharma Scientists & Lab Directors
          touchpoints:
            - 审阅科学出版物
            - 探索性切片扫描试点
            - 监管验证基准
          painPoints: High upfront scanner infrastructure cost and pathologist cultural skepticism
        - label: 第 2 阶段：技术试点与验证
          stage: 技术试点与验证
          buyer: Lab Technical Operations & Clinical Research Teams
          touchpoints:
            - 可行性回顾性切片队列
            - 算法一致性基准测试
            - IT 安全与数据合规审计
          painPoints: Protracted institutional review board and data governance approvals
        - label: 第 3 阶段：初始系统部署
          stage: 初始系统部署
          buyer: Lab Technical Operations & Clinical Trial Teams
          touchpoints:
            - AISight 云端图像管理集成
            - 单项研究回顾性试验分析
            - 病理科医生工作流用户培训
          painPoints: Complex LIS/EHR system integration and IT security compliance reviews
        - label: 第 4 阶段：临床与试验规模化
          stage: 临床与试验规模化
          buyer: Commercial Lab Executives & Translational Leads
          touchpoints:
            - AISight Dx 初始诊断正式上线
            - 多项试验前瞻性生物标志物筛查
            - 定量 IHC 算法评分
          painPoints: Multi-site scanner interoperability and turn-around time SLA monitoring
        - label: 第 5 阶段：企业网络扩张
          stage: 企业网络扩张
          buyer: C-Suite & Global Portfolio Governance
          touchpoints:
            - 实验室网络标准化
            - 伴随诊断共同开发
            - 长期组织数据档案集成
          painPoints: Post-acquisition counterparty neutrality concerns and data ring-fencing audits
        - label: 第 6 阶段：多供应商与治理审查
          stage: 多供应商与治理审查
          buyer: External Pharma Executive Committees & Legal Counsel
          touchpoints:
            - 控制权变更后的合同重新谈判
            - 专有算法 IP 隔离
            - 与独立供应商开展双供应商 RFP
          painPoints: Vendor lock-in across active Phase II/III biomarker analysis protocols
    approximationNotes: 概念性工作流模型综合自企业案例研究、Labcorp 商业公告和 RFP Wiki 采购框架。
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU007
      - CU011
