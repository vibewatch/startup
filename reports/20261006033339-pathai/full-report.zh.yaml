      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: 从风险投资支持的平台转向 Roche Diagnostics 资产的战略转型
            body: >-
              Roche Holding AG 以最高 $1.05B 收购 PathAI，验证了其 AISight 病理软件和伴随诊断模型的临床及药企价值。然而，从独立软件供应商转为 Roche Diagnostics
              子公司，会给十家生物医药合作伙伴带来摩擦——竞争药企必须评估数据防火墙、知识产权边界和双供应策略。
            calloutType: insight
            claimRefs:
              - CO011
              - CO016
          - type: callout
            title: 独立财务数据的不透明与绩效挂钩的盈利补偿结构
            body: >-
              PathAI 虽已实现 FDA 510(k) 许可等关键技术和监管里程碑，但在出售前从未公开披露独立经营的 GAAP 财务表现、ARR 运行收入和烧钱速度。此外，$1.05B 收购价中有 $300M
              取决于盈利补偿和运营目标，全部交易价值能否实现仍取决于交割后的商业执行和整合进度。
            calloutType: risk
            claimRefs:
              - CO011
              - CO013
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              AI 数字病理市场代表了解剖病理的一次架构转型：用高分辨率全视野成像（WSI）和算法细胞分析，替代人工玻片光学显微镜。在这一市场结构中，PathAI
              将可服务边界划分为两个主要商业领域：生物制药转化研究和临床体外诊断（IVD）病理。生物医药支出包括计算生物标志物发现、肿瘤临床试验患者分层算法，以及定量组织病理检测开发；临床诊断支出则包括企业影像管理系统（IMS）和面向医院实验室及第三方中心的软件医疗器械（SaMD）诊断决策支持。总市场支出明确排除资本密集型全玻片硬件扫描仪、实验室信息系统（LIS）核心许可和通用云基础设施托管，只聚焦数字病理软件及专用
              AI 分析方案。持续存在的现状替代方案仍是传统光学显微镜：它不收取增量数字工作流许可费，并且在执业病理学家中已有根深蒂固的临床接受度。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模、增长轨迹与商业视角
        blocks:
          - type: paragraph
            body: >-
              行业市场规模预测显示，全球 AI 数字病理软件和服务市场基准规模为 $1.01 billion，到 2035 年将增至 $2.32 billion，年复合增长率（CAGR）为 8.7%。全球超过 60
              笔融资交易累计投入超过 $2.0 billion 的私募风险和战略资本，用于神经网络开发及临床验证研究。行业增长由深度学习架构带动，尤其是卷积神经网络（CNN），其主导自动组织分割、细胞增殖评分（如 Ki67
              检测）和肿瘤微环境表征。按地区看，North America 因生物医药研发支出集中、数字病理实验室较早采用而成为收入规模最大的市场；Europe 的 CAGR
              预计更高。研究机构和药企赞助商目前占已实现软件支出的最大份额，而随着监管许可推动常规初级诊断工作流落地，临床诊断机构的未来增长潜力最高。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
