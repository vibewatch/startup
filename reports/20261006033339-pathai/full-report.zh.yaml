      - number: '5.3'
        title: 计算架构：深度学习、互操作性与云端运营
        blocks:
          - type: paragraph
            body: >-
              PathAI 平台的技术架构可处理由数十亿像素组成、达到 GB 级别的全视野影像（WSI）。算法上，PathAI 使用 PyTorch
              实现多实例学习（MIL），把大型玻片影像切分为局部图块，从而建模细胞表型和组织微环境，同时避开人工视觉疲劳。数据标准上，AISight 支持 DICOM 可见光全视野显微镜标准和 DICOMweb
              API，实现与企业级厂商中立归档（VNA）及跨模态临床归档的互操作。运营上，PathAI 软件平台部署在 Amazon Web Services（AWS）上，使用 Elastic Kubernetes
              Service（EKS）管理容器化微服务，以 RDS/PostgreSQL 进行关系数据管理，以 S3 存储对象，通过 MSK/Kafka 和 RabbitMQ 异步传输消息；后端应用服务采用
              Python、FastAPI 和 Django REST Framework 开发。
