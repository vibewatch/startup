  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 企业数字病理与临床工作流集成
        blocks:
          - type: paragraph
            body: >-
              PathAI 的核心技术把组织病理工作流数字化，并交给计算分析。传统病理实践高度依赖人工光学显微镜检查福尔马林固定石蜡包埋（FFPE）组织制成的玻片，这会带来诊断周转摩擦和观察者间差异。PathAI 借助
              AISight 应对这一运营瓶颈：这是一套云原生企业影像管理系统，定位为临床实验室、学术医疗系统和生物医药赞助商的中央工作流枢纽。在日常实验室运营中，病理学家利用 AISight Link
              与现有实验室信息系统（LIS）建立双向集成，使其能够直接从活动工作列表启动数字玻片、病例数据和 AI 算法结果，而不破坏标本监管链。PathAI
              通过标准化全视野影像阅片并把影像管理接入实验室网络，试图把临床病理从分散的人工玻片检查转向集中式数字诊断。
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
