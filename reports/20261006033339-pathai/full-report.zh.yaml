      - number: '1.3'
        title: 产品演进、规模指标与生态暴露
        blocks:
          - type: paragraph
            body: >-
              公司的核心商业软件是 AISight：一套云原生企业工作流和影像管理系统，为研究中心和第三方检验实验室的数字病理及 AI 应用部署提供支持 [CO012]。2025 年 6 月，美国食品药品监督管理局（FDA）为
              AISight Dx 授予 510(k) 许可（K243391），将其认定为带有既定 Predetermined Change Control Plan（PCCP）的 Class II 全视野切片成像系统
              [CO013]。战略合作推动商业规模加速：PathAI 凭借三年收入增长 260%，在 2024 Deloitte Technology Fast 500 中排名第 420 [CO014]；公司还向 Quest
              Diagnostics 实验室部署 AISight，并将部分临床实验室资产出售给 Quest [CO015]。但待完成的 Roche 收购带来交易对手治理风险：PathAI 曾签约十家大型制药公司，其中包括
              Roche 的竞争者 Gilead Sciences、MSD、Novo Nordisk、GSK、Bristol Myers Squibb 和 Incendia
              Therapeutics；这些合作方的试验生物标志物评分和伴随诊断业务将暴露在一家大型诊断竞争者面前 [CO016]。
