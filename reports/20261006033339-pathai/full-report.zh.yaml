      - number: '5.4'
        title: 临床验证、监管许可与部署约束
        blocks:
          - type: paragraph
            body: >-
              将人工智能模型从计算研究转入受监管的诊断基础设施，会带来严格的临床和技术约束。PathAI 于 2025 年 6 月为 AISight Dx 取得 FDA 510(k) 许可 K243391，将其认定为
              Class II 医疗器械，但许可在法律上绑定于经过特定验证的全视野成像硬件对照设备——具体包括 Hamamatsu NanoZoomer S360MD 和 Leica Aperio GT 450 DX
              扫描仪——以及 Barco、JVC Kenwood 和 Dell 的指定医疗显示器。平台纳入 Predetermined Change Control
              Plan（PCCP），用于管理硬件和浏览器的增量新增，无需每次都提交完整的 de novo
              申请。然而，产品和技术风险仍然明显：多实例学习模型遇到非关联实验室不同的组织染色方案时，可能面临泛化障碍，因此需要数十万标注数据点来降低算法误诊风险。此外，企业采用还要求持续维护双向 LIS
              同步，并在多租户云环境中做好企业网络安全防护。
            claimRefs:
              - CE007
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: FDA 510(k) 范围：软件许可与硬件耦合
            body: >-
              AISight Dx 的 510(k) 许可（K243391）是重要监管里程碑，使 PathAI
              成为获批的初级诊断阅片器。然而，投资者必须注意，全视野影像许可在法律上会把软件与特定扫描仪硬件和显示器配置绑定。Predetermined Change Control
              Plan（PCCP）虽然让未来新增硬件更容易，但临床采用仍受医院资本扫描仪更新周期制约。
            calloutType: insight
            claimRefs:
              - CE007
              - CE014
          - type: callout
            title: PathAI 病理 AI 的数据泛化边界
            body: 组织病理中的算法效果从根本上受数据多样性约束。采用多实例学习的深度学习模型需要数十万由专家标注的玻片实例，才能避免暴露于不同实验室组织制备、固定和染色方案时出现严重性能下降。
            calloutType: risk
            claimRefs:
              - CE009
              - CE013
              - CE015
