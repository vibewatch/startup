              - CR007
              - CR010
      - number: '7.2'
        title: 监管监督、医疗器械软件与预先确定的变更控制
        blocks:
          - type: paragraph
            body: >-
              PathAI 受严格的医疗器械监管框架约束，该框架管理临床软件和诊断工具。2025 年 6 月，美国食品药品监督管理局（FDA）批准 PathAI 为 AISight Dx 提交的上市前通知
              K243391，将其认定为依据 21 CFR 864.3700、产品代码 QKQ 的 Class II 全视野成像系统 [CR006]。关键在于，该许可纳入了依据《联邦食品、药品和化妆品法》第 515C 节批准的
              Predetermined Change Control Plan（PCCP）[CR007]。PCCP 赋予 PathAI 一定灵活性，可在不提交新的 de novo 510(k)
              通知的情况下更新软件算法，并使互操作显示器、扫描仪和文件格式符合要求；但任何超出既定边界的架构修改或算法漂移，都会构成非法掺假和错误标识 [CR007]。PathAI 必须持续符合 21 CFR Part 820
              质量体系法规，包括设计控制、不合格产品程序，以及纠正和预防措施（CAPA）要求 [CR007]。体外诊断使用严格限于福尔马林固定石蜡包埋（FFPE）组织，明确禁止用于细胞学、冷冻切片和非 FFPE 血液病理
              [CR006]。诊断错误或未经验证的硬件互操作性可能触发 FDA 警告信、强制软件召回或商业分销禁令。
            claimRefs:
              - CR006
              - CR007
