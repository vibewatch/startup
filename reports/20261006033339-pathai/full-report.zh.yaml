      - number: '1.2'
        title: 融资历史与 Roche 战略收购
        blocks:
          - type: paragraph
            body: >-
              在签署交易协议前，PathAI 通过五轮机构融资累计筹得约 $255 million [CO008]。重要融资节点包括 2019 年 4 月由 General Atlantic 领投、现有投资人 General
              Catalyst 参投的 $60 million B 轮融资 [CO009]；随后是 2021 年 5 月由 D1 Capital Partners 和 Kaiser Permanente 共同领投的 $165
              million C 轮融资，投后估值为 $1.11 billion [CO010]。2026 年 5 月，瑞士医疗健康集团 Roche Holding AG 签署最终协议，以最高 $1.05 billion
              的对价收购 PathAI，其中包括 $750 million 现金首付款和最高 $300 million 的绩效挂钩里程碑付款 [CO011]。交易将 PathAI 直接并入 Roche
              Diagnostics，使其进入 Roche 的临床与组织诊断业务；与此同时，私营、风险投资支持的独立运营安排预计在 2026 年下半年交割时转换 [CO011]。
