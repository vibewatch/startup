      - - 资本回报倍数
        - 中等（2.1x - 2.9x MOIC）
        - $750M 首付款对应 $255M 至 $350M 的风险资本总投入。
        - 早期风险投资联合体获得正回报；但晚期、Series C 估值高峰时入场者的上行空间有限。
    notes: 数据反映 Roche、Medical Device Network 和 MedTech Dive 公布的交易条款，以及 Tracxn 和 Netfigo 汇总的私募融资总额。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV007
      - CV013
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 投资论点支柱
      - 反论点
      - 观察到的市场证据
      - 论点被打破的监测触发器
    rows:
      - - 全球体外诊断分销
        - 渠道依赖与平台锁定
        - Roche 的诊断基础设施将 AISight 扩展至全球医院和癌症中心。
        - 失去 Labcorp 或 Quest Diagnostics 等独立病理实验室集成。
      - - 已验证的监管护城河
        - 审批周期漫长且成本高昂
        - AISight Dx 获 FDA 510(k) K243391 批准，并附带预定变更控制计划（PCCP）。
        - PCCP 偏差导致意外提交从头申请或算法召回。
      - - 制药伴随诊断牵引力
        - 客户集中度高且销售周期长
        - 生物制药合作支持癌症生物标志物识别和临床试验。
        - 收购后头部生物制药研究合同终止或不续约。
      - - 品类整合溢价
        - 独立估值压缩
        - 交易估值最高达 $1.05B，而 Tempus AI 收购 Paige 的价格为 $81M。
        - 因反垄断或重大不利条件干预，交易未能完成。
    notes: 该分析将 PathAI 的监管与商业优势，与行业可比案例和 FDA 申报文件中记录的企业软件及监管障碍进行对照。
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV010
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率
      - 隐含估值 / 收益
      - 关键运营假设
      - 下行触发因素与缓释措施
    rows:
      - - 乐观情景
        - 25%
        - $1,050M（$750M 首付款 + $300M 业绩奖励）
        - 反垄断审批迅速通过；到 2028 年完全实现伴随诊断商业化里程碑。
        - 生物制药试验延迟；由 Roche 占据主导地位的全球临床肿瘤销售团队缓释。
      - - 基准情景
        - 60%
        - $850M - $900M（$750M 首付款 + $100M-$150M 业绩奖励）
        - 交易于 2026 年下半年按时交割；临床试验管线支持带来的里程碑部分兑现。
        - 中等整合摩擦；由既有的 2021-2024 开发合作关系缓释。
      - - 悲观情景
        - 15%
        - $750M（仅首付款，业绩奖励为零）
        - 反垄断补救措施或合作实验室抵触；商业采用放缓，$300M 里程碑全部落空。
        - Paige/Tempus 竞争加剧；由保证交割时获得 $750M 现金这一底线缓释。
    notes: 情景概率和收益模型基于 Roche 的 $750M 首付款加 $300M 业绩奖励这一二元结构。
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV009
      - CV012
figures:
  - id: FO001
    title: PathAI 公司里程碑时间线
    type: timeline
    summary: 展示从 2016 年创立到 2026 年被 Roche 收购期间的关键公司、融资、监管和商业里程碑。
    data:
      items:
        - date: 2016-01
          label: 公司成立
          detail: Andrew Beck 与 Aditya Khosla 在波士顿创立公司，将 AI 应用于数字病理学。
        - date: 2019-04
          label: Series B 融资（$60M）
          detail: 由 General Atlantic 领投、General Catalyst 参与，融资 $60M，用于推动临床和生物制药业务扩张。
        - date: 2021-05
          label: Series C 融资（$165M）
          detail: D1 Capital 与 Kaiser Permanente 共同领投 $165M 的 Series C，投后估值 $1.11B。
        - date: 2024-04
          label: Quest Diagnostics 战略合作
          detail: 与 Quest Diagnostics 合作，在美国实验室部署 AISight，并剥离部分临床实验室资产。
        - date: 2024-11
          label: Deloitte Fast 500 认可
          detail: 依据三年收入增长 260%，在 Deloitte Technology Fast 500 中排名第 420 位。
        - date: 2025-06
          label: AISight Dx 获 FDA 510(k) 批准
          detail: FDA 依据 K243391 批准 AISight Dx 全切片成像系统，并附带预定变更控制计划。
        - date: 2026-05
          label: Roche 收购协议
          detail: Roche 宣布签署最终并购协议，以最高 $1.05B 收购 PathAI（$750M 首付款 + $300M 里程碑）。
        - date: 2026-10
          label: 收购整合与交易对手审查
          detail: 推进 2026 年下半年交割，并应对生物制药合作伙伴围绕算法中立性的治理审查。
    approximationNotes: 里程碑日期反映公开宣布的公司协议、监管批准日期和机构融资交割日期。
    claimRefs:
      - CO001
      - CO009
      - CO010
      - CO011
      - CO013
      - CO014
      - CO015
      - CO016
