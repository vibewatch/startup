              - CM008
      - number: '2.3'
        title: 买方分层、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              数字病理市场的客户分层呈现出多种买方画像，其采购周期、经济激励和决策标准各不相同。生物制药赞助商的预算通常归于转化医学、生物标志物发现和肿瘤临床运营部门。这些企业买方通过数百万美元的软件和服务合同采购
              PathAI 平台，用于量化药效，并在全球多中心临床试验中识别有反应的患者群体。临床实验室环境覆盖学术医疗中心、区域医疗系统和 Labcorp、Quest Diagnostics
              等商业第三方检验实验室，预算则转向实验室医学主任、首席医疗官和医院采购委员会。临床买方主要看软件能否提升病理学家生产率、减少诊断不一致并缩短病例周转时间，而不是直接变现生物标志物。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 监管动态、采用摩擦与资本约束
        blocks:
          - type: paragraph
            body: >-
              AI
              病理的采用速度取决于强劲人口结构驱动因素与严重机构摩擦之间的平衡。利好因素包括全球认证外科病理学家严重短缺、全球癌症负担上升，以及不断扩大的肿瘤临床管线；这些因素都要求精准的伴随诊断和定量细胞表型分析。反过来，采用约束仍然严峻。临床落地需要为高通量全视野扫描仪和企业
              IT 存储投入大量前期资本，还要完成复杂的实验室信息系统（LIS）接口工程。监管上，初级诊断部署必须走严格的许可路径；例如，FDA 对 AISight Dx 作出的 510(k)
              实质等同性认定（K243391）将其归类为 Class II 处方器械，仅限用于福尔马林固定石蜡包埋（FFPE）组织，并明确要求在 Predetermined Change Control
              Plan（PCCP）下针对指定许可扫描仪和显示器完成验证。此外，缺少通用、专门针对独立 AI 解读的报销代码，迫使实验室把 AI 软件当作运营管理费用，而不是可直接报销的诊断服务。
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 生物医药补贴临床诊断市场进入
            body: 由于独立人工智能诊断算法的临床报销仍处于早期且高度碎片化，市场领导者依靠高毛利的生物医药生物标志物发现合同，为周期很长的 FDA 许可试验和医院 IT 集成提供资金。
            calloutType: insight
            claimRefs:
              - CM010
              - CM014
              - CM016
          - type: callout
            title: 诊断采用摩擦与硬件资本密集度
            body: 数字病理软件若没有医疗系统先行投入数百万美元采购全视野扫描仪、数 TB 影像归档和病理学家显示器认证，就无法在临床网络中实现企业级部署。
            calloutType: risk
            claimRefs:
              - CM004
              - CM015
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局覆盖直接 AI 同行、设备老牌厂商和混合替代方案
        blocks:
          - type: paragraph
            body: >-
              现有证据指向一个广泛的竞争集合，而不是一个边界清晰的软件品类。Tracxn 将 Deciphex、Aiforia 和 Aignostics 列为主要竞争者，并把
              Nucleai、Techcyte、Visiopharm、Paige 和 Proscia 也列入前十。Pitch Kitchen 独立列出 Paige、Indica Labs、Leica
              Biosystems、Hamamatsu、Visiopharm、Aiforia 和 Proscia，作为从 PathAI 定位中识别出的替代方案。买方面对的还包括非同类选项：FDA
              记录显示，工作流围绕扫描仪和显示器生态构建，同时在必要时保留合格病理学家的责任和传统光学显微镜。RFP Wiki 进一步把采购选择框定为精准医疗平台、数据与商业化平台、病理专业厂商和 AI
              发现供应商。内部自研也是合理替代方案，但现有证据池没有可靠的成本、验证或部署基准，因此它仍是明确的尽调缺口，而不是一个可评分的竞争者。
            claimRefs:
              - CP004
              - CP007
              - CP010
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP010
              - CP011
              - CP016
      - number: '3.2'
        title: 监管工作流深度比模型对比性能更清晰
        blocks:
          - type: paragraph
            body: >-
              PathAI 将 AISight 描述为云原生、开放式企业平台，集中管理病例、影像和 AI 应用。FDA 记录为这一说法提供了最有力的外部证据：AISight Dx
              针对其声明适应症被认定为实质等同，支持对扫描后的 FFPE 外科病理玻片进行初级诊断阅片，同时排除冷冻切片、细胞学和非 FFPE 血液病理。相同记录还列出与指定扫描仪、显示器、文件格式、浏览器和 LIS
              接入的互操作性，这能降低对单一设备的依赖，但也仍把 PathAI 嵌入受监管的硬件和实验室技术栈。Tracxn 目录显示同行获得了大量资本：PathAI 报告融资 $255 million，Paige 为
              $241 million，Proscia 为 $129 million。融资额不能证明产品质量或市场份额；现有证据没有准确率、吞吐量、实施时间和客户成果的直接基准数据。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP012
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP014
      - number: '3.3'
        title: 商业透明度与渠道力量决定护城河能否持久
        blocks:
          - type: paragraph
            body: >-
              公开商业证据弱于产品和监管证据。竞争者 Deelo 声称 PathAI 采用定制企业定价，而 Deelo 起价为每席位每月 $19，并捆绑超过 50
              个业务应用；这一比较可用来观察打包差异，但不是临床等效性的独立基准。RFP Wiki 同样提醒买方检验服务依赖、数据权利限制、实施能力和决定价格的计量单位。C-Suite Strategy 报道称，PathAI
              的影像管理系统正并入 Roche Diagnostics，并将该交易解读为一次工作流 AI 能力收购。如果报道准确，Roche
              可以增加分销和集成能力，但现有证据无法证明未来的中立性、客户留存或实际定价。Pitch Kitchen 给出的主页评分为 15/38，并批评行业语言同质化，这说明定位存在风险：监管证明可能形成差异化，但更宽泛的
              AI 叙事更容易被同行复制。
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP011
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP012
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 最清晰的护城河证据是受监管的工作流集成
            body: AISight Dx 已有明确的监管范围和指定互操作路径。现有证据没有证明 PathAI 模型优于直接同行，因此可投资的差异化来自工作流采用和监管集成，而不是没有依据的准确率主张。
