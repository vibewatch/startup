      - number: '5.2'
        title: 产品矩阵：AISight、AISight Dx 与生物医药 AI 解决方案
        blocks:
          - type: paragraph
            body: >-
              PathAI 面向两类主要客户组织商业产品：病理实验室和生物制药研究机构。临床诊断套件的基础产品是 AISight Dx，这是一款依据 FDA 510(k)（K243391）和 21 CFR 864.3700
              获批的软件型医疗器械，用于初级诊断阅片和数字全视野影像管理。对生物制药合作伙伴，PathAI
              提供转化研究算法、临床试验服务和真实世界数据资产，覆盖代谢功能障碍相关脂肪性肝炎（MASH/NASH）、炎症性肠病（IBD）和肿瘤等治疗领域。这些专用算法包括 AIM-NASH 和 NASH
              Explore，可帮助中央病理学家统一组织学评分，减少临床试验入组标准中的阅片者差异，并量化试验各时间点的连续次序组织测量值。
            claimRefs:
              - CE002
