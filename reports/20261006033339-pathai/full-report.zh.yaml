  - id: FE001
    title: 产品架构图
    type: stack
    summary: 展示 PathAI 企业数字病理平台从临床工作流集成到云基础设施的逻辑架构层。
    data:
      layers:
        - label: 诊断应用与查看层
          detail: 基于 Web 的 AISight Dx 查看器、数字病例管理和全切片标注工具
        - label: 临床互操作与集成层
          detail: AISight Link 双向 LIS 同步、DICOM VL WSI 渲染和 DICOMweb API
        - label: AI 建模与算法推理层
          detail: PyTorch 多实例学习流水线、补丁级特征提取和生物标志物评分模型
        - label: 云与数据基础设施层
          detail: AWS EKS 容器编排、S3 千兆像素图像存储、RDS PostgreSQL 和 Kafka 事件流
        - label: 企业安全与治理层
          detail: HIPAA 合规保护、基于角色的访问控制（RBAC）、审计日志和数据加密
        - label: 硬件与设备集成层
          detail: 已获批准的 Hamamatsu 与 Leica 全切片成像扫描仪驱动程序及校准医疗显示器
    approximationNotes: 根据技术文档和工程基础设施披露，综合呈现功能性架构拓扑。
