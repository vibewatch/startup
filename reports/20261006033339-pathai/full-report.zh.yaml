      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 收购后的生物医药供应商中立性摩擦
            body: >-
              Roche Diagnostics 收购 PathAI 后，独立平台供应商变成大型诊断竞争者的全资子公司。参与肿瘤临床试验的竞争药企可能不愿把专有全视野活检数据和探索性生物标志物终点交给 Roche
              控股实体，从而给生物医药服务带来显著流失风险。
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR008
          - type: callout
            title: 变更控制灵活性与严格边界约束的平衡
            body: >-
              FDA 在 AISight Dx 的 K243391 许可中纳入 Predetermined Change Control Plan（PCCP），让 PathAI 能够迭代修改软件而不必反复提交
              510(k)，提供了宝贵的监管优势。然而，任何改变临床预期用途或偏离预先规定验证方案的算法修改，都可能立即触发 FDA 执法。
            calloutType: insight
            claimRefs:
              - CR006
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与交易架构
        blocks:
          - type: paragraph
            body: >-
              PathAI 的商业与估值轨迹在 2026 年 5 月达到节点：Roche 宣布签署最终合并协议，以最高 $1.05 billion 收购公司。交易结构包括 $750 million 有保障的现金首付款，以及最高
              $300 million、取决于目标商业和技术成就的或有盈利补偿里程碑付款。此次收购延续了 Roche 与 PathAI 自 2021 年开始、并于 2024 年扩大的一系列合作，双方共同为肿瘤平台开发 AI
              伴随诊断算法。这一战略交易验证了 PathAI 的核心企业平台 AISight，也凸显 Roche
              计划在全球临床诊断和生物医药转化研究中扩大数字病理工作流。不过，交易条款和资本历史显示，相比此前私募融资估值峰值，估值已有明显压缩：PathAI 在 2021 年市场高点前后通过五轮融资累计筹得超过 $255
              million，私募市场估值一度达到 $1.5 billion。由于独立收入运行率、毛利率、现金消耗，以及决定 $300 million 盈利补偿的具体概率触发条件仍未在公开披露中得到核实，这笔交易对 Roche
              这位收购方意味着合理估值，但独立投资者仍需在 2026 年下半年交易完成前采取审慎跟踪策略。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV013
      - number: '8.2'
        title: 论点反驳与可比基准估值
        blocks:
          - type: paragraph
            body: >-
              评估 PathAI 的估值，需要在临床和企业验证力度与 AI 辅助病理固有的重大运营摩擦之间取得平衡。积极的一面是，PathAI 已为 AISight Dx 取得 FDA 510(k)
              许可（K243391），将其认定为带有 Predetermined Change Control Plan（PCCP）的 Class II 全视野成像系统，从而提供较强的监管防御力，并能在不反复提交 de
              novo 申请的情况下简化软件算法更新。此外，PathAI 已与 Bristol Myers Squibb 等合作伙伴开展临床试验级企业生物医药合作，也已与 Labcorp、Quest Diagnostics
              等大型诊断服务商完成实验室集成。反方论点则强调，病理自动化仍是一项昂贵且周期漫长的监管工作，临床病理团队对诊断自动化的文化阻力也一直存在。可比估值基准凸显了这些结构性现实：Tempus AI 于 2025 年以约
              $81 million 收购数字病理竞争者 Paige，说明如果没有集成仪器渠道，纯 AI 诊断服务商会面临严重的私募市场估值折价。Multiples 和 Tracxn 的交易跟踪数据显示 PathAI 累计融资
              $255 million，Netfigo 则报告分批融资累计筹资最高 $350 million；相比之下，$750 million 首付款对应投入资本的 2.1x 至 2.9x
              倍数。这一倍数对早期风险投资支持者而言是有吸引力的战略退出，但也确认独立商业化相较于风险投资高峰期预测只实现了有限规模。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV010
              - CV011
      - number: '8.3'
        title: 情景回报、下行敏感性与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              我们将 PathAI 的风险调整后回报与估值画像拆成三种运营情景，覆盖预计在 2026 年底完成交割的时间点。乐观情景（概率 25%）下，Roche 无需监管让步即可取得反垄断许可，将 AISight
              集成进全球肿瘤诊断设备；PathAI 迅速达到临床试验伴随诊断的采用里程碑，拿满 $300 million 业绩奖励，交易总价值达到 $1.05 billion。基准情景（概率 60%）下，交易按计划完成并支付
              $750 million 预付现金，伴随诊断采用里程碑逐步兑现，部分业绩奖励支付约为 $100 million 至 $150 million。悲观情景（概率 15%）下，交割条件遭遇监管审查延误，或非 Roche
              实验室合作方因寻求平台无关的替代方案而出现客户合同流失，导致业绩奖励被没收，交易价值封顶于预付对价。从企业风险看，BreachHistory 报告称，截至 2026 年 PathAI
              没有登记在册的网络安全漏洞或暴露记录，眼下的数字基础设施安全担忧因此有所缓解。仍需完成的关键尽调包括取得经审计收入数据、核实 $300 million
              业绩奖励所依据的确切技术基准、评估高管团队在并购整合后的留任情况，以及确认非 Roche 病理账户的合作合同连续性。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV009
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV014
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 并购立场：持续跟踪至交易交割
            body: >-
              Roche 的收购协议以 $750 million 预付对价为交易下行价格提供了较强支撑，但 $300 million
              里程碑业绩奖励仍取决于不透明的商业交付。建议持续跟踪交易直至交割，并监测合作实验室的连续性，再把完整交易价值视为已实现。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV004
