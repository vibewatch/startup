      - number: '7.3'
        title: 生物医药供应商中立性、运营依赖与网络安全态势
        blocks:
          - type: paragraph
            body: >-
              PathAI 并入 Roche Diagnostics 后，交易对手治理会带来深刻的运营和商业脆弱性。历史上，PathAI 曾与多家全球药企合作，提供生物标志物评分、转化病理和伴随诊断算法开发服务
              [CR008]。Roche 拥有底层软件和专有组织数据后，竞争性肿瘤生物医药赞助商会因专有临床试验终点和患者数据保密而面临利益冲突 [CR001]。大型药企合作方可能终止现有合同，或将未来的伴随诊断开发转向
              Paige、Indica Labs 等竞争性中立平台 [CR004]。运营上，AISight 是企业级云原生工作流枢纽，支持临床实验室病例和影像管理
              [CR009]。系统可用性高度依赖公有云托管基础设施、安全的全视野影像传输，以及与 Hamamatsu NanoZoomer、Leica Aperio 等扫描仪的互操作硬件接口 [CR006, CR009]。截至
              2026 年 10 月，公开威胁情报目录中没有 PathAI 已披露的数据泄露或安全事件
              [CR010]。然而，作为处理敏感患者组织病理数据和受保护健康信息（PHI）的企业医疗软件供应商，任何未被发现的泄露或系统中断，都可能导致严重的 HIPAA 执法处罚、临床实验室工作流停摆和长期声誉损害。
            claimRefs:
              - CR001
