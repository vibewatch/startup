  topStrengths:
    - 唯一做出全球规模的人才投资机构，积累 15 年联合创始人匹配数据——竞争位置在结构上独一档
    - $16B 组合价值由 Tractable、Cleo、PolyAI、Gensyn 等独角兽 / 准独角兽校友撑起，证明模型跑得通
    - Series D 投资人名单（Collisons、Hoffman、Schmidt、Dean、Gomez）提供了目前最强的第三方估值验证
    - Bay Area 转向让英国 / 法国创始人的种子轮估值高出 85% / 68%——竞争优势有量化支撑
    - $130M 管理公司资金把运营现金跑道拉到 3–5 年，不依赖组合退出时点
  topRisks:
    - Matt Clifford 利益冲突（ARIA、Callosum、Parliament Q24439、Private Eye 2026 年 5 月）——机构出手前优先级最高、必须正式解决的反向材料
    - 公开财务披露为零（无收入、无 P&L、无 2022 年后退出数据）——管理公司估值无法用常规指标独立核验
    - 模型扩张存在张力：Series D 暗示 cohort 大幅增长，但 EF 的价值主张靠极强筛选（约 3–5% 录取率）撑着，扩张可能稀释这一点
    - YC 的远程友好扩张与 Antler 的 20+ 城市全球网络，对 EF 欧洲人才管线构成结构性竞争威胁
    - 申请量和录取质量指标已滞后 4 年以上——Bay Area 强制搬迁转向后，缺少当前需求健康度证据
  unresolvedGaps:
    - Entrepreneur First Ltd 在 UK Companies House 的财务申报——必须用来独立评估管理公司 P&L 和运营经济性
    - ARIA 正式利益冲突登记，显示 Clifford 在 EF 组合公司决策中的回避机制
    - Callosum（EF 组合公司）ARIA 申请 / 拨款状态——这是 Parliament Q24439 所涉具体事实
    - 更新后的（2024–2026）EF 申请量、录取率和 cohort NPS——上次披露指标停留在 2022 年 6 月
    - 2022 年后已实现退出分配——上次数据（$680M+）来自 2022 年中；Sonantic/Spotify 以及后续退出未公开量化
    - Cleo（估值 $1.3B+、7M 用户）或 Tractable（$1B+）IPO 时间表——最重要的近期管理公司估值催化剂
