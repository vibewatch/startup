company:
  name: Entrepreneurs First
chapter:
  number: 1
  title: Company Overview
  summary: >
    Entrepreneurs First (EF) is a global talent investor and company builder that backs exceptional
    individuals before they have a co-founder, team, or idea — reaching unicorn status in March 2026
    with a $200M Series D at a $1.3B valuation. Founded in 2011 in London by Alice Bentinck and Matt
    Clifford, EF has built 600+ companies now collectively valued at over $16 billion, deploying its
    distinctive pre-idea, pre-team model across London, Paris, Bangalore, and San Francisco.

sections:
  - id: identity-and-model
    title: Identity, Headquarters, and Business Model
    body: >
      Entrepreneurs First (EF), formerly Entrepreneur First, is an international company builder and
      talent investor headquartered in San Francisco, with programs in London, Paris, and Bangalore.
      Founded in 2011 by Alice Bentinck and Matt Clifford, EF invests in exceptional individuals before
      they have a startup idea, co-founder, or team — the earliest possible stage of company formation.
      Participants join an intensive cohort-based program, find co-founders using EF's matching process,
      develop business ideas, and receive a pre-seed investment of up to $250,000 for approximately 9%
      equity via a SAFE instrument once they pass EF's investment committee. EF's core thesis is that
      the world's most important companies are built by exceptional individuals, and that identifying
      and backing those individuals before they coalesce into a company creates outsized venture-scale
      returns. In 2024 EF introduced mandatory Bay Area relocation for all pre-seed graduates, creating
      a transatlantic pipeline from global talent pools to Silicon Valley. The company describes its
      model informally as the "CAA for startups." Its programs operate on two phases: a talent-
      identification and co-founder matching phase (FORM, up to 12 weeks), followed by a Bay Area
      scaling phase (LAUNCH, up to 12 weeks) during which teams raise seed rounds from US investors.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]

  - id: founders-and-leadership
    title: Founders, Leadership, and Governance
    body: >
      Alice Bentinck (CEO, MBE, born 1986) and Matt Clifford (Chairman, CBE, born 1985) co-founded EF
      in 2011 after meeting at McKinsey & Company in 2009. Both are Oxford-educated entrepreneurs who
      observed that top European technical talent lacked a structured pathway to company creation
      comparable to Silicon Valley. Bentinck previously interned in Tony Blair's office and worked at
      McKinsey (2009–2011); she served as EF's CPO before assuming the CEO role in December 2023.
      Clifford, who led EF as CEO through most of its history, stepped down to focus on AI policy
      work and became Chairman. Clifford holds a CBE, was named to TIME100 AI 2024, helped design
      the UK's AI Safety Institute, chaired the UK Advanced Research and Invention Agency (ARIA),
      and served briefly as Prime Minister's Adviser on AI (January–June 2025). Reid Hoffman
      (LinkedIn co-founder, Greylock partner) joined EF's board in 2017 and remains an active
      board member and Series D investor. The investor roster for the March 2026 Series D —
      including Patrick and John Collison (Stripe), Eric Schmidt (Google), Danny Rimer (Index
      Ventures), Matt Cohler (Benchmark), Aidan Gomez (Cohere), and Jeffrey Dean (former Google
      Brain) — functions as a high-profile external advisory network. EF's 120+ person team
      includes full-time university scouts deployed at Stanford, MIT, Berkeley, CMU, Yale, Princeton,
      and UT Austin, as well as top European and Indian universities.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO002, TO004]

  - id: funding-history
    title: Funding History and Valuation Trajectory
    body: >
      EF has raised capital in multiple rounds structured as equity rounds in its management company
      rather than traditional LP fund raises, positioning it as a hybrid between a VC firm and a
      venture-backed startup. The 2017 Series A raised $12.4 million with Reid Hoffman and Greylock
      leading, bringing Hoffman onto the board. A $115 million Fund 3 closed in 2019. The June 2022
      Series C raised $158 million at a $560 million valuation, adding the Collison brothers (Stripe)
      as new investors. On March 11, 2026, EF announced its Series D: $200 million at a $1.3 billion
      valuation — EF's first unicorn milestone. Of the $200 million, approximately $130 million flows
      to the EF management company to fund institutional infrastructure (talent scouts, program
      operations, technology), while $70 million goes to the investment fund that backs portfolio
      companies. Total capital raised in the management company track stands at approximately $485
      million to date across all rounds. The Series D was not a traditional VC fund raise; it is an
      equity round in EF Ltd (the operating entity), affirming the platform-company interpretation
      of EF's business model.
    claimRefs: [CO014, CO015, CO016, CO017, CO018, CO019]
    tableRefs: [TO003]
    figureRefs: [FO001]

  - id: portfolio-and-milestones
    title: Portfolio Scale and Key Milestones
    body: >
      EF's portfolio — comprising 600+ companies built through its programs since the first cohort
      began investing in 2015 — is collectively valued at over $16 billion as of March 2026, up from
      approximately $3 billion when EF last raised in 2021. EF has realized $680 million in exit
      proceeds as of its last published disclosure (mid-2022), with subsequent exits not yet
      publicly quantified. Notable portfolio companies include Tractable (AI visual damage assessment,
      $1B+ valuation), Cleo (AI financial wellness app, 7M+ users), PolyAI (enterprise voice AI,
      backed by Khosla Ventures), Gensyn (decentralized AI compute, backed by a16z), and Aztec
      (Web3 privacy infrastructure, backed by a16z). Key exits include Magic Pony Technology
      (acquired by Twitter for a reported $150 million in 2016), Sonantic (voice AI, acquired by
      Spotify), Bloomsbury AI and Atlas ML (acquired by Facebook/Meta), and PassFort (acquired by
      Moody's). The Bay Area LAUNCH program launched in January 2024; by April 2026, EF was
      reporting Seed round valuations 85% higher for UK startups and 68% higher for French startups
      versus pre-relocation cohorts. EF's new "Bridge" program launched in April 2026 to serve
      European founders who want to build directly in San Francisco from the start.
    claimRefs: [CO020, CO021, CO022, CO023, CO024, CO025]
    tableRefs: [TO005]
    figureRefs: [FO002]

  - id: kpi-snapshot
    title: Key Performance Indicators and Scale Metrics
    body: >
      EF's publicly disclosed KPIs as of July 2026 include: 600+ portfolio companies created;
      $16B+ combined portfolio value; $1.3B management company valuation (March 2026 Series D);
      $200M total raised in Series D; approximately 3–5% acceptance rate from applicant pools;
      40–50 founders per cohort; 80% co-founder match rate within 8 weeks; up to $250K initial
      investment per company (equity stake ~9%); up to $5M follow-on investment capacity; $600K+
      in tech partner credits per program. Headcount is approximately 120+ employees (as of 2022
      disclosure; current figure undisclosed). Revenue is not publicly disclosed; EF's primary
      financial upside is through equity appreciation and exit proceeds from its portfolio
      companies. The management company operates on the basis of investment returns rather than
      management fees, distinguishing it from traditional VC structures.
    claimRefs: [CO026, CO027, CO028, CO029, CO030]
    figureRefs: [FO003]

