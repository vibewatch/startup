  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 创始人客户——画像、管线与需求信号
        blocks:
          - type: paragraph
            body: >
              EF 的主要「客户」是它为 FORM 和 LAUNCH 项目挑选的顶尖个人。EF 对目标创始人画像说得很明确：公司寻找各自领域「1 in 500」级别的人才，通常处在职业生涯前 6–7 年，在
              AI、深科技或工程上有深厚技术能力。实际队列构成偏向 PhD、来自 DeepMind、OpenAI、Google Brain 等实验室的 AI
              研究者、来自一线科技公司（Google、Meta、Stripe、Jane Street、Goldman Sachs）的工程师，以及通过全国竞赛路径识别出的数学天赋极强者（UK Mathematical
              Olympiad、Putnam、Physics Olympiad）。FORM 阶段不拿股权：参与者不用付费，EF
              只有在公司成形并获投后才拿股权。这种「免费试」模式在加速器行业并不常见，降低了高质量候选人的试错门槛；否则，前置股权稀释可能把他们挡在门外。EF 披露的需求信号是，截至 mid-2022，每 18 个月收到
              17,000 份申请，并从中录取约 500–600 人（录取率约 3–5%）。EF 知名校友的级别也从方向上支撑了申请池质量——Barney Hussey-Yeo（Cleo）、Alex
              Dalyac（Tractable）、Nikola Mrkšić（PolyAI）后来都做出了十亿美元级公司。2024 以来的全球湾区扩张进一步筛选了申请池：愿意申请一个强制在 San Francisco
              参与的项目，本身就已经自筛出创业野心和地理流动性，这两种特质都与创业成功相关。
