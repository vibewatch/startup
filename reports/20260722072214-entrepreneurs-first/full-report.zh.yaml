      - number: '3.2'
        title: Y Combinator —— 拥有强势品牌优势的下游竞争者
        blocks:
          - type: paragraph
            body: >
              Y Combinator 只有在批次加速器层面才是 EF 的结构类比；作为想法前人才投资机构，EF 并不直接争夺同一批项目。不过，YC 在两个维度与 EF 竞争：（1）品牌偏好——全球最优秀的技术创始人常因 YC
              品牌带来的下游融资优势而默认优先申请 YC；（2）校友网络密度——YC 的 3,000+ 公司投资组合，让校友到申请人的管道显著密于 EF 的 600+ 家公司。YC 以 $500K SAFE 换 7%
              股权（2022 年从 $125K 提高到 $500K），比 EF 的 $250K 换 9% 提供更多资本且稀释更少。YC 每年两批，每批 200–250 家公司，年吞吐量约为 EF 的 4–5 倍。YC
              投资组合包括 Airbnb（峰值 $86B）、Stripe（$95B）、Dropbox（$9B）和 OpenAI（据报道 2025 年 $157B），带来无可匹敌的声望光环。YC
              还通过远程友好批次扩大了申请者接受半径，这意味着它现在也在争夺原本属于 EF 核心管道的欧洲和亚洲技术创始人。不过，YC 不解决联合创始人匹配问题：没有联合创始人的申请者申请 YC 时处于明显劣势，因此 EF
              对大量想创业但缺少联合创始人的顶尖个人仍保有结构性优势。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
