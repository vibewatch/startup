    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              Entrepreneurs First（EF，原名 Entrepreneur First）是一家国际化创业公司共建平台和人才投资机构，总部位于 San Francisco，在
              London、Paris、Bangalore 设有项目。Alice Bentinck 和 Matt Clifford 于 2011 年创立
              EF；它在个人还没有创业想法、联合创始人或团队时就投资——这是公司形成的最早阶段。参与者加入高强度队列制项目，借助 EF 的匹配流程寻找联合创始人、打磨商业想法；通过 EF 投资委员会后，通过 SAFE
              工具获得最高 $250,000 的种子前投资，换取约 9% 股权。EF 的核心判断是：世界上最重要的公司由极少数顶尖个人搭建；在这些人还没聚合成公司之前识别并下注，能创造超额的风险投资级回报。2024 年，EF
              要求所有种子前毕业团队强制搬到湾区，把全球人才池接入 Silicon Valley，形成跨大西洋管道。公司非正式地把自己的模式称为“创业公司的 CAA”。项目分两阶段：人才识别和联合创始人匹配（FORM，最长
              12 周），随后是湾区扩张阶段（LAUNCH，最长 12 周），团队在这一阶段向美国投资人募集种子轮。
