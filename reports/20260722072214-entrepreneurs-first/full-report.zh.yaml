      - number: '6.4'
        title: 地理牵引力与客户集中度
        blocks:
          - type: paragraph
            body: >
              EF 的创始人客户基础历史上集中在英国和欧洲；自 2011 创立以来，London 一直是主要人才枢纽。2024 湾区转向显著改变了地理分布：EF 现在在 San Francisco
              运行主要项目，并主动从七所主要美国大学校园招募。Bridge 项目（April 2026）是面向欧洲创始人的 8 周 San Francisco 驻地，说明 EF
              一边保持申请池的地理多样性，一边把项目交付集中到湾区。EF 目前或历史上也在 Paris（France）和 Bangalore（India）运营项目，不过当前重点是把 San Francisco
              作为主要队列地点。EF 申请池的地理多样性是战略资产：欧洲和印度技术人才通常比美国本土申请者创业经验更少，因此更愿意接受 EF 结构化的联合创始人匹配项目。反过来，经验最丰富的美国创始人——已经参加过 YC
              或有过创业经历的人——从结构化项目中获益较少，也较不可能申请 EF。这意味着 EF 的获客策略聚焦于尚未创办公司的顶尖技术人才；在全球顶尖技术大学的每一届毕业生中，这都是一个庞大且持续补充的人群。
