            body: >
              EF 最重要的需求指标——申请量——最后一次公开披露是在 June 2022。Series C
              之后四年，公司没有发布更新的申请人数、录取率或被投公司牵引力汇总。这给外部尽调留下重大透明度缺口：如果湾区搬迁要求导致申请量下降，或队列规模扩张导致录取质量下滑，公开证据既无法证实也无法否认。Series D
              在没有向公众发布任何更新创始人需求指标的情况下完成，这意味着 $1.3B 估值缺少当前需求透明度支撑。
