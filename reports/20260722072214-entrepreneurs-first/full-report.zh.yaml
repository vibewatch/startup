        - 17K 份申请、3-5% 录取率、校友独角兽
        - 队列扩张可能削弱筛选强度
        - 若录取率守住，投资逻辑成立
      - - 湾区带来估值溢价
        - 英国种子轮高 85%，法国高 68%
        - 自报数据；未独立验证
        - 方向上有支撑，但未验证
      - - 投资组合股权支撑 $1.3B
        - 估算：9% x $16B = $1.44B > $1.3B
        - 投资组合估值标记可能过时（2021-22）
        - 按账面值看投资逻辑成立；估值标记风险仍在
      - - EF 模式可防守
        - 15 年记录、600+ 家公司
        - Antler 在扩张；YC 转向远程
        - 短期成立；长期不确定
      - - Series D 投资者提供验证
        - Schmidt、Dean、Gomez 以 $1.3B 估值参与
        - 投资人可能带有非财务动机
        - 强背书信号
    notes: 投资逻辑 / 反向逻辑框架概括了以 $1.3B 估值投资 EF 管理公司的正反两面。
