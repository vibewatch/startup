      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: EF 是唯一拥有 15 年记录的规模化想法前人才投资机构
            body: >
              EF 的 15 年运营历史、600+ 家公司搭建经验、$16B 投资组合价值，以及机构投资人阵容（Collison 兄弟、Hoffman、Schmidt、Rimer）叠加起来，形成了可信度差距；Antler 作为
              EF 最接近的模式竞争者，只有约 6 年历史，无法快速补齐。EF 在联合创始人匹配上的数据优势，以及校友网络复利，都是会随时间累积的真实护城河。到 2026 年，没有竞争对手能可信地声称拥有同等深度的模式验证。
            calloutType: strength
            claimRefs:
              - CP004
              - CP015
              - CP021
          - type: callout
            title: Antler 的全球城市数量和规模优先模式构成长期结构性风险
            body: >
              Antler 20+ 城市足迹和每年约 4,000 名创始人，相比 EF 每年约 200–250 名，形成了市场覆盖缺口；随着公司共建模式成熟，这个缺口可能越来越重要。如果全球最佳技术人才逐渐围绕
              YC（美国、成熟团队）或 Antler（全球、易进入）做选择，EF 可能发现自身中间地带——比 Antler 更挑剔、但品牌不如 YC——被挤压。Antler 2022 年融资 $285M
              且持续扩张，说明它资本充足，足以维持增长轨迹。
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP014
          - type: callout
            title: YC 扩张远程批次，侵入 EF 的欧洲人才管道
            body: >
              Y Combinator 转向远程友好批次，让欧洲和亚洲创始人无需搬到湾区即可参与，直接侵入 EF 历来独家服务的非美国人才池。过去欧洲技术创始人需要在 YC（必须搬到美国）和 EF（结构化英国 /
              欧盟项目）之间二选一；现在 YC 的远程友好扩大了选择集。EF 的强制湾区搬迁要求可能同时是它最强的差异点（更高估值），也是相较更灵活 YC 申请流程的最大筛出点。
            calloutType: insight
            claimRefs:
