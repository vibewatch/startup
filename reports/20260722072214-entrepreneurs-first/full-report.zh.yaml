      - number: '7.3'
        title: 模型扩张风险——质量与数量的取舍
        blocks:
          - type: paragraph
            body: >
              EF 的 $1.3B 估值隐含着显著的队列扩张：以当前每年约 200–250 名创始人的项目吞吐量，EF 单靠运营无法支撑独角兽管理公司估值。Series D 明确用于资助湾区项目扩张——增加更多队列名额、扩张
              Scout 网络、扩大 Bridge 项目。然而，EF 的核心价值主张依赖维持约 3–5% 的录取率，以传递极强精选信号。如果 EF 在同一地理人才池内把队列规模翻倍或翻三倍，录取创始人的平均质量可能下降。80%
              联合创始人匹配率是一项效率指标；如果队列更大、天然兼容性更低，该指标可能恶化。EF
              没有公开说明计划如何在扩大项目吞吐量的同时守住驱动需求的质量信号。这个结构性张力内生于人才投资人模式：项目对单个创始人的价值，恰恰来自 EF 的排他性声誉，而排他性与规模负相关。Antler 优先追求规模（每年
              4,000+ 名创始人）的选择，很可能已经削弱了它相对 EF 的声望溢价；EF 当前的差异化取决于不做同样选择。
