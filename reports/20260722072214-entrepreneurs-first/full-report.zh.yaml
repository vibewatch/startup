  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 关键人风险——Matt Clifford 与 Alice Bentinck 集中度
        blocks:
          - type: paragraph
            body: >
              EF 两位创始人——Alice Bentinck（CEO，b.1986）和 Matt Clifford（董事长，b.1985）——搭建了公司的每个维度：模式、品牌、投资者关系、政府通道和校友网络。Clifford
              在 December 2023 卸任 CEO，转任董事长，由 Bentinck 接任 CEO。从投资者反应看，这次交接处理得顺畅——March 2026 Series D 在 Bentinck
              领导下成功完成——但集中度风险仍然很高。Bentinck 是可信且受尊重的 CEO，也有独立运营 EF 的深度；自 2011 项目创立以来，她一直是主要运营型创始人，并因服务创业获得
              MBE。不过，Clifford 因英国政府顾问职责从 CEO 转为董事长后，外部开始不确定两位创始人是否都会长期投入 EF。Clifford 随后离开首相 AI 顾问职位（June
              2025），并继续担任董事长，显示他仍然参与；但 Private Eye Issue 1674 报道（May 2026）和议会审查（Question 24439，January
              2025）提出了一个问题：声誉事件若进一步升级，是否会触发 Clifford 完全离开 EF。若发生这种情况，EF 将失去其在英国机构和政府市场最具知名度的品牌大使。Clifford
              若完全退出——或出现与他本人相关的重大声誉事件——EF 就必须只靠 Bentinck 的品牌来重建英国 / 欧盟政府和机构叙事。
