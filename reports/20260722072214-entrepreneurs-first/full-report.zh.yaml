      - number: '4.4'
        title: 管理公司财务状况与运营经济学
        blocks:
          - type: paragraph
            body: >
              管理公司的运营模型没有详细公开披露。Entrepreneur First Ltd 在英国 Companies House 的文件可公开访问，但本报告未详细审阅。基于现有公开资料，EF 在全球运营（San
              Francisco、London、Paris、Bangalore）约有 100–150 名员工；2024 年转向湾区后，最大人员集中地在 San
              Francisco。管理公司运营成本主要来自人力（招聘人才侦察员、项目经理、投资组合支持）和不动产（湾区 FORM 和 LAUNCH 项目空间）。2026 年 3 月 Series D 轮中的 $130M
              管理公司部分，按估算年运营成本 $25–40M（由员工规模和湾区不动产成本推断），应能提供约 3–5 年运营现金跑道。EF 从未公开报告管理公司运营层面的正
              EBITDA；作为股权增值业务，管理公司会产生经营亏损，并随时间由投资回报抵消。管理公司的主要负债是：如果投资组合公司退出被不利公开市场条件延迟或压低，回报就会被稀释。不同于传统 VC，EF 没有来自基金 LP
              的管理费收入来抵消管理公司开支；所有运营都必须由股权融资或已实现退出支持。
