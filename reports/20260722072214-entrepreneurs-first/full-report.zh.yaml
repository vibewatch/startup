      - number: '5.3'
        title: AI 集成与被投公司的技术栈
        blocks:
          - type: paragraph
            body: >
              EF 2025–2026 产品中的关键差异化，是为被投公司集成 AI 工具。EF 向每个队列中的公司提供超过 $600K 的技术额度，包括 OpenAI API 额度、Anthropic Claude
              额度，以及面向整个创始团队的 GitHub Copilot Pro。这意味着 2025–2026 年获 EF 支持的创始人，在最关键的早期成形阶段，可以零边际成本调用前沿 AI 模型。相较竞争者，这套
              $600K+ 额度包是显著的产品层优势：Antler 不提供可比的 AI 额度组合；YC 通过合作伙伴网络提供一些额度，但标准批次的历史金额更小。EF 的大学 Scout 网络覆盖 AI
              研究人才集中的机构——Stanford 的 AI Lab、MIT CSAIL、Berkeley AI Research（BAIR）——把学术研究直接接入 EF 项目。Scout
              项目全年运行，不只在申请窗口开放，因此 EF 可以在博士生自然考虑申请前 2–3 年就识别人才。EF 被投公司本身也越来越 AI 原生：Tractable 用计算机视觉处理保险理赔，Cleo
              用大语言模型做个人金融，PolyAI 用对话式 AI 服务企业，Gensyn 则在建设去中心化 AI 计算基础设施。投资组合的 AI 深度验证了 EF 的技术人才识别逻辑，也为考虑创业的 AI
              研究者提供了有说服力的案例。
