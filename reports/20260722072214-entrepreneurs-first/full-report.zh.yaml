      - number: '6.5'
        title: 需求验证、流失风险与客户留存
        blocks:
          - type: paragraph
            body: >
              EF 的主要需求验证风险在于，其公开引用的指标——每 18 个月 17,000 份申请、80% 联合创始人匹配率、种子轮估值高 85%——都来自 2022 或更早的数据；其中种子轮估值指标还来自 EF
              自己的湾区扩张项目材料，而非独立验证的基准。公开指标已有四年没有更新，外部难以判断申请量、录取率和投资组合表现是否延续历史轨迹。EF
              的精选声誉是关键需求驱动：高录取难度向申请者发出信号，入选本身就是质量证明，从而形成自我强化的声望循环。不过，如果 EF 大幅扩大队列规模（Series D
              扩张计划暗示了这一点），精选信号可能被稀释，最有野心候选人眼中的项目声望溢价也会下降。EF
              没有传统意义上的客户留存指标：完成项目的创始人要么获得投资并成为长期投资组合关系，要么未获投资离开。这里没有年度订阅、续约或 SaaS 合同。「客户终身价值」完全通过 7–12 年周期内的股权增值捕获，因此 EF
              的需求指标更像基金管理人的资产管理规模（AUM）留存，而不是 SaaS 公司的客户留存。
