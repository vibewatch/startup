      - number: '3.3'
        title: Antler —— 最接近的模式竞争者，带来全球扩张风险
        blocks:
          - type: paragraph
            body: >
              Antler 是 EF 最直接的竞争威胁，因为它在全球规模上复制了想法前、联合创始人匹配模式。Antler 覆盖六大洲 20+ 城市，每年在全球队列网络中接收约 4,000+ 名创始人，而 EF 估计每年
              200–250 名。Antler 以约 £210,000（或等值本币）换约 8.5% 股权。Antler 在 2022 年完成相当于 Series D 的 $285M 融资，全球城市数量让它的地理覆盖远超
              EF。EF 与 Antler 的关键竞争差异在于：（1）选择性——EF 约 3–5% 的录取率相对 Antler 更高的录取率，显示 EF 更挑剔；（2）湾区整合——EF
              强制湾区队列项目独特，并带来更高种子轮估值；（3）投资组合深度——EF 合计 $16B 投资组合价值高于 Antler 的较小总量，来自 EF 15 年先发优势；（4）投资人质量——EF
              投资人名单（Hoffman、Collison 兄弟、Schmidt、Rimer）相较 Antler 的 LP 基础带来显著下游背书。Antler 相对 EF 的主要竞争优势是全球地理密度：在
              Singapore、Sydney、Oslo、Berlin、Lagos、New York 和另外 15+ 城市设有本地存在，创造了 EF 当前没有的人才管道触达。Antler 的城市数量扩张也让它能够从 EF
              没有存在的地域获取人才。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Founders Factory、Techstars 及其他相邻竞争者
        blocks:
          - type: paragraph
            body: >
              Founders Factory 在英国和欧盟运营企业支持的公司共建模式，与企业赞助方合作，在明确主题（医疗、金融科技、能源、媒体）内搭建新创业公司。Founders Factory 以约 £30,000
              投资换取 4–6% 股权，显著低于 EF；企业支持结构也意味着其投资组合优先级部分由企业赞助方战略利益决定，而非纯粹市场机会。Founders Factory 与 EF
              的竞争主要发生在英国人才市场，特别是考虑结构化公司共建或直接进入产业就业的技术候选人。Techstars 是传统 3 个月批次加速器，以 $220,000 换约 6% 股权，历史上在全球 40+ 城市运营；不过
              Techstars 在 2024 年经历重大运营重组，关闭多个项目并重新聚焦核心市场。Techstars 主要与 EF 争夺已有想法、正在寻找结构化导师和种子资本的团队。Seedcamp
              是英国种子基金和加速器，主要作为 EF 校友公司的跟投方，而不是直接争夺人才的竞争者。500 Startups 同样处于更后阶段、覆盖不同地域。高校加速器生态——Oxford Foundry、Cambridge
              Enterprise、Harvard iLab、Stanford StartX——争夺学生创始人，但不解决联合创始人匹配问题，通常提供的资本和运营支持也少于 EF。
