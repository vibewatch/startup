              按 EF 在 600+ 家公司中的平均持股约 9%、合计投资组合价值 $16B 粗算，组合股权总值约 $1.44B，几乎正好对上管理公司的 $1.3B
              估值。二者贴合有一部分是巧合（管理公司价值既来自持续经营，也来自组合股权），但它说明 Series D
