      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Alice Bentinck（CEO，MBE，1986 年生）和 Matt Clifford（董事长，CBE，1985 年生）2009 年在 McKinsey & Company 相识，2011 年共同创立
              EF。两人均受过 Oxford 教育，并观察到欧洲顶尖技术人才缺少一条类似 Silicon Valley 的结构化创业路径。Bentinck 曾在 Tony Blair 办公室实习，并在 McKinsey
              工作（2009–2011 年）；2023 年 12 月接任 CEO 前，她是 EF 的 CPO。Clifford 在 EF 大部分历史中担任 CEO，之后卸任以专注 AI 政策工作，并转任董事长。Clifford
              获授 CBE，入选 TIME100 AI 2024，参与设计英国 AI Safety Institute，担任英国 Advanced Research and Invention
              Agency（ARIA）主席，并短暂出任首相 AI 顾问（2025 年 1–6 月）。Reid Hoffman（LinkedIn 联合创始人、Greylock 合伙人）2017 年加入 EF
              董事会，至今仍是活跃董事和 Series D 轮投资人。2026 年 3 月 Series D 轮投资人名单包括 Patrick 和 John Collison（Stripe）、Eric
              Schmidt（Google）、Danny Rimer（Index Ventures）、Matt Cohler（Benchmark）、Aidan Gomez（Cohere）和 Jeffrey Dean（前
              Google Brain）；这批人本身就是高能见度外部顾问网络。EF 的 120+ 人团队包括部署在 Stanford、MIT、Berkeley、CMU、Yale、Princeton、UT Austin
              的全职校园人才侦察员，也覆盖欧洲和印度顶尖高校。
