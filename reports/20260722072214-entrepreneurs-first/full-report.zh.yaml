      - number: '7.5'
        title: 结构与运营风险
        blocks:
          - type: paragraph
            body: >
              EF 湾区优先模式引入了运营集中风险：如果湾区房地产成本、签证政策限制或 AI 实验室人才留存动态发生重大变化，EF 的主要价值主张（湾区种子轮估值溢价）可能被侵蚀。美国移民政策是重要风险向量：EF
              支持的欧洲和印度创始人需要 O-1 或 EB-1 签证才能在 San Francisco 创业，任何对技术工人移民路径的收紧都会削弱 EF 的跨大西洋管线。EF
              的技术额度合作（OpenAI、Anthropic、GitHub）是一项产品层依赖：如果任一合作伙伴改价、调整 API 额度项目或减少与 EF 的合作，区分 EF 项目的 $600K
              额度包就会受损。队列地理集中在单一城市（San Francisco）还带来疫情式韧性风险：任何阻断线下共处的事件，都会打断 EF 依赖面对面互动的联合创始人匹配模式。2020–2021
              年已经证明，远程联合创始人匹配明显更难，产出的配对质量也更低；这是该模式内在的结构脆弱性，而批次虚拟替代方案（Antler 的远程选项、YC 的远程批次）没有同样问题。
