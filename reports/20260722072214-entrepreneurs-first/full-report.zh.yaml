  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: EF 在竞争格局中的独特位置
        blocks:
          - type: paragraph
            body: >
              EF 与竞争对手的关键差异在介入阶段：公司还不存在、联合创始人还没见面、想法还没成形，EF 就已经投资。这个“想法前、团队前”模式在已规模化的全球平台中结构性独特。Y Combinator
              是全球投资组合价值最高的加速器（合计 $600B+），但要求申请者在申请前已有公司，并至少有想法雏形。Techstars、Seedcamp、500 Startups
              和大多数全球加速器至少要求团队已有早期验证。Founders Factory 要求产品概念更成熟。Antler 是 EF 模式上最直接的竞争者，也运营想法前联合创始人匹配模式，但与 EF
              有几处关键不同：Antler 模式优先追求规模（20+ 城市同时跑更大队列），EF 模式优先追求选择性（录取率约 3–5%）。EF 的竞争护城河来自三项相互强化的优势：（1）15
              年数据，知道哪些个人类型和联合创始人组合能产出爆发式增长公司；（2）$16B 投资组合校友网络，提供社会证明和校友对队列的辅导；（3）湾区整合管道，这是任何竞争性人才投资机构都没有的。EF 相对 YC
              的主要竞争弱点是品牌：全球最优秀的技术创始人比较选项时，YC 约 $2M 的中位结果（种子轮 + 后续融资环境）和品牌认知度，常常仅凭名字就胜出。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
