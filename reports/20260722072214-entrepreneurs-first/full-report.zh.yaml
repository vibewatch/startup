      - number: '5.4'
        title: 人才识别与 Scout 网络基础设施
        blocks:
          - type: paragraph
            body: >
              EF 的人才识别基础设施是正式项目上游的关键产品层。EF 在 Stanford、MIT、Berkeley、CMU、Yale、Princeton 和 UT Austin 配置全职 Scout，职责是在 STEM
              和创业项目中识别尚未申请的顶尖候选人。Scout 网络有双重作用：一是浮出可能不会自然发现 EF 项目的候选人，二是在下一代深科技创始人聚集的大学环境中建立 EF 声誉。2024–2025 年，在 $200M
              Series D 预公告之后，EF 大幅扩张了 Scout 网络，并在多个 AI 研究项目新增岗位。EF 还运营一个由 EF
              校友组成的非正式顾问网络——这些创始人曾参加项目，后来做成了成功公司，并为新队列担任大使。这条校友到队列的管线在 AI 人才圈尤其有力，Tractable 的 Alex Dalyac、Cleo 的 Barney
              Hussey-Yeo 和 PolyAI 的 Nikola Mrkšić 都是模式跑通的样板，能说服潜在申请人。Scout 和校友网络会随时间复利：投资组合越大、成功案例越多，EF
              招募人员接触顶尖技术人才时就越可信。这种复利是 Antler 和其他竞争者最难复制的产品元素。
