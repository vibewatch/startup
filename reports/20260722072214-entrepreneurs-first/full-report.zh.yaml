      - number: '7.2'
        title: 利益冲突——Matt Clifford、ARIA、Callosum 与 Sovereign AI Fund
        blocks:
          - type: paragraph
            body: >
              EF 最尖锐的反向材料，是围绕 Matt Clifford 多重重叠角色的利益冲突风险。Clifford 同时是：（1）EF 董事长，持有 EF 被投公司的股权和经济利益；（2）ARIA（Advanced
              Research + Invention Agency）主席，即英国 政府的高风险研究资助机构；以及（3）首相 AI 顾问（January–June 2025）。UK Parliament Written
              Question 24439（January 2025）由国会议员 Dr Ben Spencer 提交，正式询问 Clifford 的 EF 被投公司 Callosum 是否已获得或申请 ARIA 资金，因为
              Clifford 参与设计并担任该基金主席。Clifford 公开表示，凡涉及 EF 被投公司的 ARIA
              决策，他都会回避。然而，英国议会透明记录中没有正式利益申报，无法完整记录回避在实践中如何执行。Private Eye magazine Issue 1674（May 2026）报道 Clifford 可能从政府
              AI 基础设施决策中获益——具体是由 Clifford 帮助设计参数的 UK Sovereign AI Fund——而这些决策可能让 EF 被投公司占优。Clifford 否认不当行为，并以自己在 June
              2025 辞去首相顾问职务作为致力于避免冲突的证据。EF 面临的风险有两层：（1）机构声誉——主要英国 政府实体、养老基金和大学合作伙伴可能在调查解决前与 EF
              拉开距离；（2）监管风险——正式的议会调查或利益冲突裁定，可能带来整改义务、资产追回（尤其针对 Callosum），或对 EF 政府合作施加更广泛限制。
