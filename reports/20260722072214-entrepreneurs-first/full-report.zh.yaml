              Eric Schmidt（Google 前 CEO）、Jeffrey Dean（Google Brain 前负责人）、Aidan Gomez（Cohere CEO）、Matt
              Cohler（Benchmark）、Danny Rimer（Index Ventures）以及 Patrick 和 John Collison（Stripe）参与 March 2026 这一轮，并接受 $1.3B
              估值，是公开记录中最强的验证，表明该估值反映了有信息的机构共识。这些投资者能看到外部分析师看不到的可比私营公司估值；他们集体愿意以 $1.3B 投后估值投资，本身就是高质量价格发现信号。任何把 EF 估得显著低于
              $1.3B 的分析，都必须解释为什么这些特定投资者愿意支付这个价格。
            calloutType: strength
