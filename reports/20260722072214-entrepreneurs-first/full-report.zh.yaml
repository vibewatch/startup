      - number: '2.5'
        title: 市场顺风与结构性增长驱动
        blocks:
          - type: paragraph
            body: >
              几股结构性顺风支持 EF 的目标市场在 2026 年及之后加速增长。第一，AI 热潮实质性提高了有资历、且有创业兴趣的技术人才密度：大型实验室中考虑离职创业或首次创业的 AI
              研究员和工程师数量处在历史高位。第二，硬科技和 AI 领域向创始人主导公司倾斜的长期趋势，意味着 EF 这种“想法形成前先投技术创始人”的模式，比寻找成品的模式更贴近最高价值公司的诞生位置。第三，湾区对种子阶段
              AI 公司持续存在溢价，EF 的跨大西洋管道功能可以从欧洲人才深度与美国资本密度之间的地域套利中提取结构性价值。第四，2022 年后调整结束后，全球种子轮和种子前市场在 2025 年恢复，AI
              原生公司带来新一波高质量早期项目流。主要逆风来自相邻模式的竞争加剧：YC 扩张远程友好批次、a16z 的 START 项目以及 Antler 的全球扩张，都在争抢同一批顶尖技术人才。
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
