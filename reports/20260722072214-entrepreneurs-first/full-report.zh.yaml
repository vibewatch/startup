      - number: '7.6'
        title: 展示材料
        blocks:
          - type: callout
            title: Matt Clifford ARIA/Callosum 利益冲突是近期最显眼风险
            body: >
              关于 Clifford 利益冲突的公开记录——Parliament Question 24439（January 2025）和 Private Eye Issue 1674（May
              2026）——不是猜测或轻微批评；它是正式议会审查和调查性媒体报道，涉及具名政府实体（ARIA、Sovereign AI Fund）以及具名 EF
              被投公司（Callosum）。风险在于，事件从媒体和议会提问升级为正式监管调查，从而触发 EF 在英国政府合作上的整改义务、限制 EF 接入公共资金项目，并要求 Clifford 完全离开
              EF，以保护管理公司不再受到牵连。EF 投资者应正式要求 EF 提供关于 ARIA 回避文件的法律意见，以及 EF 在 Callosum 冲突整改中的风险敞口。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: callout
            title: 扩张计划制造质量—数量张力，可能结构性损害 EF 模型
            body: >
              $1.3B 估值隐含着显著的项目增长，但 EF 的竞争定位依赖极强精选。从当前每年约 200–250 人把队列规模翻倍到 400–500 人——Series D 可能资助这一扩张——将要求 EF
              提高录取率，从而削弱吸引目标「1 in 500」候选人的声望信号。EF 没有公开说明计划如何协调规模增长与精选维持。这是管理公司长期价值创造中最重要的单一运营问题。
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
              - CR013
          - type: callout
            title: $130M Series D 现金跑道为近期财务风险提供显著缓冲
            body: >
              EF 最有效的财务风险缓释，是 $130M Series D 管理公司部分；按估计年度成本计算，它提供约 3–5 年运营现金跑道。这意味着，即便被投公司退出因不利的 M&A 或 IPO 市场环境而延迟 2–3
              年——如 2022–2024 年全行业所见——EF 管理公司也能继续运营，不必追加融资。Series D 的时间点（March 2026）也与创纪录的 VC 活动（$510B H1
              2026）重合，说明这轮融资是在有利市场条件下完成；一旦宏观环境恶化，这种条件不容易复现。
