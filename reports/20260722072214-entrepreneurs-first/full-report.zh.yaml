              EF 披露每 18 个月 17,000 份申请（mid-2022），录取率 3–5%，说明人才投资人模式能在全球范围内从高质量候选人那里产生大量主动需求。17,000 份申请竞争约 500–600 个名额，EF
              的精选程度可比 Harvard 或 Stanford 的精英 MBA 项目，后者录取 1.5–3% 的申请者。由此形成的声望循环——入选 EF 本身就向 VC
