      - number: '2.3'
        title: 公司共建子市场与 EF 的机构合法性里程碑
        blocks:
          - type: paragraph
            body: >
              公司共建（或人才投资）板块是早期投资栈中最年轻、也最差异化的一层。传统加速器投资已有团队和早期产品，VC
              投资有牵引力或产品市场匹配的团队；公司共建平台则用尚未组队的个人才华来创建公司。全球公司共建市场很难单独测算，因为市场报告常把它与加速器混在一起。全球主要公司共建平台包括 EF、Antler（全球，20+
              城市）、Founders Factory（英国 / 欧盟，企业支持）和 Rocket Internet（欧洲，现已基本退出）。2026 年，EF 的 $1.3B Series D
              轮估值标志着一家达到这种运营规模的公司共建平台——600+
              家公司、四大洲——首次被机构投资人明确按独角兽估值。这个里程碑对更广泛市场有两点含义：（1）它验证了公司共建平台的管理公司本身可以是风险投资级业务，而不只是带运营手臂的基金；（2）它扩大了愿意把公司共建平台作为资产类别来支持的机构
              LP 和股权投资人池。EF 开创的融资模式——在管理公司层面做股权轮，而不是把 LP 资本放进基金——让管理公司可以独立于特定年份基金回报来扩张运营，降低传统 VC 管理公司常见的结构性脆弱性；后者依赖 2%
              管理费。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
