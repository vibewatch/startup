      - number: '5.5'
        title: 产品局限与技术风险
        blocks:
          - type: paragraph
            body: >
              EF 的产品有几项已记录的局限和风险。第一，项目按批次运行且依赖地点：FORM 阶段要求在湾区线下共处 12 周，能触达的人才池被限制在可以临时搬迁的人群。这既是卖点（湾区估值溢价），也是限制（排除了无法总计搬迁
              24+ 周的创始人）。第二，FORM 约 20% 的掉队率（没有找到联合创始人或没有获得投资委员会出资的创始人）会让一小部分但仍有意义的录取候选人经历明显负面体验；如果这些队列校友公开负面描述
              FORM，申请量可能受压。第三，Form 匹配平台没有接受独立审计或基准测试；EF 对匹配效率的说法来自自报。第四，EF
              地理上集中在四个市场（美国、英国、法国、印度），意味着其他高密度市场（加拿大、以色列、德国、韩国、澳大利亚）的顶尖技术人才并未被 Scout 项目规模化触达。第五，EF
              没有发布技术路线图或专利组合，外部难以判断当 AI 人才匹配商品化后，EF 的平台优势是否可持续。第六，EF 的 $600K 额度包依赖 AI
              实验室基础设施（OpenAI、Anthropic、GitHub）；如果价格变化或合作伙伴关系恶化，项目价值主张会明显受损。
