            title: 管理公司股权模式提供结构性稳定
            body: >
              EF 选择通过股权轮资本化管理公司，而不是只依赖基金管理费，因此其运营预算不依赖在特定时间表上返还 LP 资本。Series D 轮带来 $130M 新管理公司资本后，无论投资组合公司退出是否在某个窗口兑现，EF
              都拥有多年运营现金跑道。这种结构在加速器行业少见，并提供战略优势：EF 可以在回报兑现前投入人才侦察网络、项目基础设施和湾区不动产，不受传统结构加速器管理费依赖的约束。
