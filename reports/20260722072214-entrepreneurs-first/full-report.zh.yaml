      - number: '1.4'
        title: 投资组合规模与关键里程碑
        blocks:
          - type: paragraph
            body: >
              EF 的投资组合由 600+ 家通过其项目搭建的公司组成，第一批队列于 2015 年开始投资；截至 2026 年 3 月，这些公司合计估值超过 $16 billion，高于 EF 上次于 2021 年融资时的约
              $3 billion。EF 截至最近一次公开披露（2022 年中）已实现 $680 million 退出收益，之后的退出尚未公开量化。代表性被投公司包括 Tractable（AI 视觉损伤评估，估值
              $1B+）、Cleo（AI 财务健康应用，7M+ 用户）、PolyAI（企业语音 AI，Khosla Ventures 支持）、Gensyn（去中心化 AI 计算，a16z 支持）和 Aztec（Web3
              隐私基础设施，a16z 支持）。关键退出包括 Magic Pony Technology（2016 年据报道以 $150 million 被 Twitter 收购）、Sonantic（语音 AI，被
              Spotify 收购）、Bloomsbury AI 和 Atlas ML（被 Facebook/Meta 收购）以及 PassFort（被 Moody's 收购）。湾区 LAUNCH 项目于 2024 年 1
              月上线；到 2026 年 4 月，EF 报告称，与搬迁前队列相比，英国创业公司的种子轮估值高 85%，法国创业公司高 68%。EF 新的“Bridge”项目于 2026 年 4 月推出，服务一开始就想直接在
              San Francisco 搭建公司的欧洲创始人。
