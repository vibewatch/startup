      - number: '8.4'
        title: 退出路径分析——IPO、收购与老股出售选项
        blocks:
          - type: paragraph
            body: >
              对管理公司投资者而言，EF 管理公司有三条主要退出路径：（1）管理公司 IPO；（2）被大型 VC、主权财富基金或战略买家收购；（3）在未来轮次中以更高管理公司估值向新的机构投资者出售老股。IPO
              路径是长期选项——此前没有可比的公司建造者管理公司尝试 IPO，而收入模式（股权增值而非经常性收入）也很难向公开市场投资者讲清。收购路径有近期先例：Sequoia Capital、Andreessen
              Horowitz 和 GV 近年都战略投资过或收购式招聘过人才平台业务。寻求早期 AI 交易流的主权财富基金（ADIA、Temasek、GIC）或大型资管公司，可能会认为收购 EF
              管理公司具备战略吸引力，尤其考虑到 EF 的 Scout 网络和湾区管线。老股出售路径——管理公司投资者近期最现实的选项——要求管理公司估值从 $1.3B 进一步上调至
              $2.5–3B+，而这需要显著扩大队列、出现大型新组合退出（Tractable 或 Cleo IPO），或进入能扩大 TAM 的新市场。对基金投资人而言，主要回报路径仍是 $70M 基金部分和 600+
              家公司组合股权对应的被投公司退出（收购、IPO）。
