  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与 EF 的可服务市场
        blocks:
          - type: paragraph
            body: >
              Entrepreneurs First 同时处在两个重叠市场中：（1）全球创业公司加速器和孵化器服务市场；（2）全球种子前和种子轮 VC 生态。EF
              的具体子市场是“人才投资人”或“创业公司共建平台”类别，即平台在个人尚未组建公司前就识别并支持他们，而不是投资已有早期创业公司。这个子类别位于传统 VC 上游：EF
              不是争夺现有创始团队的项目流，而是从零搭建创始团队。2024 年，全球创业公司加速器市场规模约 $4.3 billion，预计 2025 年达到 $5.1 billion（CAGR 约
              19%）。北美板块约占全球加速器收入的 41%（2024 年约 $2.0 billion）。另有估计称，创业公司孵化器市场 2024 年规模约 $1.98 billion。结构化早期创业支持（加速器 +
              孵化器）合计市场 2024 年全球约 $6.3 billion。EF 的可服务市场更窄：全球顶尖高校和顶级科技公司中，高学历技术与创业型个人；他们是风险投资支持型创始人的原材料。在 EF
              的目标地域（美国、英国、法国、印度），任一时点这类人群有数十万人，但只有一小部分会申请 EF 项目（截至 2022 年，每 18 个月约 17,000 人申请）。
