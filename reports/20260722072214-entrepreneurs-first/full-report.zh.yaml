  - id: TV005
    title: 投资逻辑破裂与止损触发因素表
    columns:
      - 止损触发因素
      - 可观察信号
      - 阈值
      - 建议动作
    rows:
      - - Clifford 受到监管制裁
        - 议会调查形成正式结论
        - 任何有约束力的监管行动
        - 重新评估；可能下调至 HOLD/SELL
      - - Bentinck 离任
        - CEO 辞任且无继任者
        - 90 天内未指定继任者
        - 投资逻辑立即破裂；EXIT
      - - 投资组合价值下滑 >30%
        - 重大减值
        - $16B 降至 $11B 以下
        - 重新评估投资组合股权锚
      - - 批次种子轮融资率 <40%
        - 连续两个批次表现不佳
        - 外部种子轮融资率低于 40%
        - 模型有效性存疑；HOLD
      - - 竞争替代
        - 申请量同比下降 >50%
        - 由批次规模推断
        - 长期投资逻辑风险；HOLD
    notes: 止损触发因素指会从根本上改变投资逻辑的事件。这些是监控标准，不是预测。
