      - number: '4.2'
        title: 收入模式与商业化策略
        blocks:
          - type: paragraph
            body: >
              EF 的收入模式与传统 VC 基金和传统加速器根本不同。EF 不向投资组合公司收取项目费，也不以传统意义上的投资基金管理费作为收入来源。相反，EF 的主要经济引擎是股权增值：团队正式成形时，EF 通过 SAFE
              票据向每家公司投入 $250,000，取得约 9% 股权。随后 EF 在后续融资轮中持有这部分股权，并在投资组合公司退出（被收购或 IPO）或完成老股交易时实现价值。因此，主要商业化路径是长周期的：EF
              在数百家早期公司中建立持股，并通过收购（Sonantic 卖给 Spotify、PassFort 卖给 Moody's、Bloomsbury AI 卖给 Meta、Magic Pony 以 $150M 卖给
              Twitter）、未来 IPO 和老股交易组合变现。EF 还获得每家公司最高 $5M 的跟投权，使其能提高在最高确信度投资组合公司中的持股。次级价值来源包括 EF 分发给投资组合公司的 $600K+
              技术额度（来自 OpenAI、Anthropic、GitHub）——这不是收入线，而是成本抵扣，但为每个队列创造可观价值。2022 年 Series C 轮新闻稿显示，截至 2022 年中已实现退出
              $680M，说明已有可观但未量化的累计分配。到 2026 年 7 月，2022 年之后期间的已实现退出数字没有更新公开披露；不过投资组合价值从 $3B（2021 年）增至 $16B（2026 年 3
              月），意味着组合层面约 $13B 未实现增值。
