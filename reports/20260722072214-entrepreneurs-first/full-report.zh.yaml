      - number: '5.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 15 年联合创始人匹配数据集是最难复制的护城河
            body: >
              EF 拥有 600+ 次联合创始人成形的自研数据集，并用结果标签把人格画像、技能组合和想法领域连到公司结果，这是公司手里最能防守的竞争资产。Antler 正在建设可比数据集，但才走到第 6 年——比 EF 晚 9
              年。YC 不系统匹配联合创始人，因此没有可比的数据资产。这个数据集的复利价值随每个队列增加：更多 EF
              校友公司做到规模、完成退出后，结果标签更扎实，匹配预测也更准。这个数据护城河很可能比任何单一软件功能集或网络效应都更耐久。
            calloutType: strength
            claimRefs:
              - CE007
              - CE008
              - CE009
          - type: callout
            title: 项目地点依赖压缩可触达人才池
            body: >
              EF 强制创始人在 San Francisco 线下共处 24+ 周（FORM +
              LAUNCH），既是其最强的产品差异化（湾区估值溢价），也是最显著的管线瓶颈。这一要求系统性排除了无法离开工作、家庭或所在地六个月的创始人。虽然 EF 的 Bridge 项目（April 2026）提供了 8
              周的轻量选项，但无法完全解决那部分顶尖技术人才对 24 周承诺的搬迁摩擦。对这一人群，YC 更友好的远程批次选项吸引力越来越强，Antler 的全球城市网络则通过本地项目交付来覆盖。
            calloutType: risk
            claimRefs:
              - CE019
              - CE020
              - CE021
          - type: callout
            title: AI 技术额度在关键想法成形窗口创造创始人与市场匹配
            body: >
              在 FORM 阶段向每个队列提供 $600K+ 的 AI 模型额度，不只是成本补贴——创始人仍在探索问题空间时，就能快速原型化 AI 原生产品。12 周 FORM 阶段里零成本调用前沿 AI 模型，意味着获 EF
              支持的创始人可以探索更多想法、更快验证假设，并比自掏腰包接入 API 的创始人做出更好的公司成形决策。在多数高价值创业公司都 AI 原生的当前环境中，这种基础设施优势直接影响 EF 队列中冒出的想法质量。
