      - number: '2.2'
        title: 种子前与种子轮 VC 投资动态
        blocks:
          - type: paragraph
            body: >
              种子前和种子轮投资市场构成 EF 的下游收入引擎：EF 创建公司，这些公司随后从外部 VC 募集种子轮和 Series A 轮；一旦这些轮次发生，EF 的回报来自股权增值。2026 年上半年，全球 VC
              市场融资创下 $510 billion 纪录——主要由集中化 AI 超大轮融资拉动——但种子前和种子轮层级表现更分化。2023–2024 年，全球种子前和种子轮交易量从 2021 年高点回落，随后在 2025
              年受 AI 顺风恢复。不过，种子轮结果的质量——以估值和后续 Series A 转化衡量——有所改善，AI 原生创业公司尤其明显。湾区相对于其他地域仍享有溢价：YC
              支持且位于湾区的种子阶段公司，历史上种子轮估值比可比欧洲公司高 2–3 倍，这解释了 EF 强制湾区搬迁的战略决策。EF 自己的数据——湾区队列中英国创始人种子轮估值高 85%、法国创始人高
              68%——与这一市场结构方向一致。人才投资人模式还受益于长期趋势：AI 浪潮正在缩短从人才识别到公司成形的时间；OpenAI、DeepMind、Anthropic
              等实验室的研究员和工程师越来越多选择离职创业，而不是继续做雇员，扩大了 EF 可触达的人才池。
