      - number: '7.4'
        title: 竞争替代与财务集中风险
        blocks:
          - type: paragraph
            body: >
              EF 面临三类竞争风险，可能损害 $1.3B 管理公司价值。第一，YC 的远程友好扩张削弱了 EF 对欧洲技术人才的历史垄断。如果最好的欧洲创始人现在可以远程进入 YC，EF 强制 24
              周湾区搬迁的要求就会从溢价信号变成净劣势。第二，Antler 的全球城市网络扩张可能吸走 EF
              未覆盖地区的人才——Singapore、Lagos、Oslo、Berlin、Sydney——并让地理覆盖缺口随时间扩大。第三，大型 AI
              实验室（OpenAI、DeepMind、Anthropic）通过内部研究项目、高薪酬和 spinout 文化留住最佳技术员工，实际上也在争夺 EF 所瞄准的同一批「1 in 500」技术人才。财务方面，EF
              的收入模式完全基于股权增值：没有经常性收入、没有订阅收入，也没有来自 LP 的管理费收入（除基金部分隐含的内容外）。这意味着 EF
              管理公司现金流完全依赖被投公司退出——这些退出流动性差、不连续，并与公开市场环境相关。IPO 窗口长期关闭或 M&A 放缓（如 2022–2023 所见）可能把分配推迟数年，在此期间 EF
              管理公司必须用股权融资余额来支撑运营。
