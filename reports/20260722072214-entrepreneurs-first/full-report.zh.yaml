companyProfile:
  summary: >
    Entrepreneurs First（EF）是全球领先的想法成形前人才投资机构兼创业公司共建平台，2011 年由 Alice Bentinck 和 Matt Clifford 在 London 创立。EF
    在个人还没有联合创始人、团队或商业想法时就识别并下注顶尖人才——通常是职业生涯前 7 年的博士、AI 研究员和精英工程师。借助结构化的 12 周 FORM 阶段，EF 匹配联合创始人、打磨公司命题；团队成形后，以 SAFE 投入
    $250K，取得约 9% 股权。之后还有 12 周在 San Francisco 的 LAUNCH 阶段。截至 2026 年 3 月，EF 已搭建 600+ 家公司，合计投资组合价值超过 $16B；截至 2022 年中，已实现退出
    $680M+；并在 Greylock、Collison 兄弟（Stripe）、Reid Hoffman、Eric Schmidt 等支持的 $200M Series D 轮中，拿到 $1.3B 管理公司独角兽估值。Alice
    Bentinck 自 2023 年 12 月起担任 CEO；Matt Clifford 担任董事长。
