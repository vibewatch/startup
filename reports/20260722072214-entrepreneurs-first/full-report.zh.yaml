  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 项目架构——FORM 与 LAUNCH 阶段
        blocks:
          - type: paragraph
            body: >
              EF 的核心产品是一个两阶段项目：潜在创始人先经过结构化的 12 周 FORM 阶段，再进入 12 周 LAUNCH 阶段。FORM 阶段里，获录取的个人还没有想法、也没有联合创始人，会被放进湾区约 40–50
              人的队列。12 周内，他们探索问题空间、测试潜在联合创始人组合，并形成初始假设。FORM 参与者中约 80% 会在 8 周内找到联合创始人，EF 将其作为匹配流程有效性的证据。FORM
              结束时，已找到联合创始人并形成有说服力创业命题的团队，会向 EF 内部投资委员会路演，争取一笔 $250K SAFE，对应约 9% 股权。没有找到联合创始人、或想法尚未达到投资委员会标准的团队不会获得投资；EF
              估计约 20% 的参与者拿不到投资。LAUNCH 阶段是 12 周湾区驻地，获投团队专注于打造初版产品、招募早期客户，并准备种子轮融资。LAUNCH 团队可以借力 EF 的 Demo Day 网络——其中包括一线
              VC、Greylock 合伙人，以及 Index、Benchmark、Cohere Ventures 等机构的 Scout 网络。April 2026 推出的 Bridge 项目是更短的 8 周 SF
              驻地，面向希望测试湾区网络、但还不想承诺完整 FORM 周期的欧洲创始人。每个队列约接收 40–50 名创始人，并为未来 FORM 申请人输送管线。
