      - number: '8.5'
        title: 乐观、悲观与基准估值情景（2029）
        blocks:
          - type: paragraph
            body: >
              以 2029 投资期看，三种情景框定了 EF 管理公司的估值区间。乐观情景下，EF 成功扩张到每年 500+ 名创始人，借助改进后的 Form 平台 AI 能力守住精选度，并产生 2–3
              个重大组合退出（Tractable IPO、Cleo IPO、PolyAI 收购），带来 $3–5B 已实现分配。湾区扩张继续为 EF 支持的公司带来 85% 估值溢价，Clifford
              利益冲突问题在没有正式监管制裁的情况下解决。在这一情景中，EF 管理公司可在 2029 Series E 或老股交易中估值 $3–4B，对 Series D 投资者意味着 2.5–3x 回报。基准情景下，EF
              温和扩张队列（每年 300–350 人），产生 1 个重大退出（Cleo IPO 或 Tractable 收购），并继续把投资组合价值推向 $25B+，但 Clifford 争议带来一些机构阻力。到 2029
              年，管理公司估值达到 $2–2.5B。悲观情景下，Clifford 冲突升级为正式调查，EF 的英国机构关系受损，队列扩张稀释精选信号，被投公司退出又因宏观环境推迟。湾区搬迁要求压低申请量。管理公司估值在
