      - number: '1.3'
        title: 融资历史与估值轨迹
        blocks:
          - type: paragraph
            body: >
              EF 多轮融资采用管理公司股权融资，而不是传统 LP 基金募集，使其定位介于 VC 机构和风险支持创业公司之间。2017 年 Series A 轮由 Reid Hoffman 和 Greylock 领投，融资
              $12.4 million，Hoffman 也因此进入董事会。2019 年，Fund 3 完成 $115 million 募集。2022 年 6 月 Series C 轮以 $560 million 估值融资
              $158 million，引入 Collison 兄弟（Stripe）作为新投资人。2026 年 3 月 11 日，EF 宣布 Series D 轮：$200 million，估值 $1.3
              billion——这是 EF 首次迈入独角兽。$200 million 中，约 $130 million 流向 EF 管理公司，用于人才侦察员、项目运营、技术等机构化基础设施；$70 million
              进入支持被投公司的投资基金。迄今管理公司路径累计融资约 $485 million。Series D 轮不是传统 VC 基金募集，而是 EF Ltd（运营主体）的股权融资，进一步确认 EF 商业模式更像平台公司。
