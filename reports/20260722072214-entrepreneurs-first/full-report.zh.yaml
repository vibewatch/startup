      - number: '6.2'
        title: 被投公司牵引力——Tractable、Cleo、PolyAI 等
        blocks:
          - type: paragraph
            body: >
              EF 的下游牵引力最直观地体现在被投公司上；这些公司既是人才投资人模式的验证点，也间接证明 EF 吸引到的创始人客户质量。Tractable 是一家用计算机视觉处理保险理赔和机动车损伤评估的 AI 公司，2021
              年以 $1B+ 估值完成 $60M Series D，并已被全球大型保险公司部署。Tractable 每月处理数十万次车辆损伤评估，客户包括 Tokio Marine、MAPFRE 和 Covéa。AI 理财应用
              Cleo 到 2024–2026 年已增长至 7M+ 用户，并以 $1.3B+ 估值完成 Series C。Cleo 用户集中在美国和英国，主要是通过对话式 AI 管理个人财务的年轻成年人。企业对话式 AI 公司
              PolyAI 从 Khosla Ventures 获得 Series C 融资，其 AI 语音智能体客户包括多家全球大型企业。Gensyn 是 a16z 支持的去中心化 AI
              计算基础设施公司，正在开发让开发者在分布式硬件网络上运行 AI 训练的技术。更广泛的 EF 600+ 家公司投资组合虽然无法逐一公开追踪，但在医疗 AI、金融科技、物流软件、气候科技和企业 SaaS
