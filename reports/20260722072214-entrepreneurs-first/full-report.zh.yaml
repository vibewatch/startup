      - number: '8.2'
        title: 组合股权价值作为估值锚
        blocks:
          - type: paragraph
            body: >
              EF 管理公司估值最扎实的锚，是其投资组合持仓中的股权价值。EF 通过 SAFE 票据和跟投，在 600+ 家被投公司中每家约持有 9% 股权。March 2026 披露这些公司的合计总投资组合价值为
              $16B。将 9% 乘以 $16B，得到约 $1.44B 的组合股权总值——与 $1.3B 管理公司估值格外接近。不过，三点限制很重要：（1）9% 平均持股只是近似；EF 对头部公司最高 $5M
              的跟投会提高其持股，后续轮次稀释又会随时间降低持股；（2）$16B
              是总投资组合估值和，不是市场清算金额——它主要由未实现的私营公司估值构成，这些估值可能停留在过时轮次价格；（3）管理公司价值还包括平台价值部分：人才投资人模式、Scout 网络、Form
              平台、品牌和未来队列世代的持续价值，都没有反映在当前组合股权里。如果单独给平台部分估值——哪怕保守按每个队列年度创造股权的 0.5x——管理公司总价值也会超过
              $1.3B。反过来，如果私营公司组合估值发生重大减记（如 2022–2023 年普遍出现的情况），EF 隐含的组合股权可能明显下降，从而削弱估值锚。
