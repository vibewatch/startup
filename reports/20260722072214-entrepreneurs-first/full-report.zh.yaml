      - number: '4.3'
        title: 投资组合经济学与未实现增值
        blocks:
          - type: paragraph
            body: >
              $16B 合计投资组合价值（2026 年 3 月）代表 EF 600+ 家投资组合公司按最近已知估值计算的总价值。EF 在该组合中平均约 9% 的持股，意味着纸面总股权价值约 $1.44 billion——与
              $1.3B 管理公司估值惊人接近，尽管这个比较混合了不同财务结构。投资组合价值从 2021 年估计 $3B 增至 2026 年 3 月 $16B，约 4 年实现 5.3 倍总组合价值增值。$16B
              的构成没有详细披露，但关键锚点包括 Tractable（保险 / 车险理赔 AI，2021 年 Series D 轮估值 $1B+）、Cleo（AI 理财助手，2024 年
              $1.3B+）、PolyAI（企业对话式 AI，完成 Khosla Ventures 参与的 Series C 轮）和 Gensyn（去中心化 AI 计算，获得 a16z 投资）。已实现退出部分——截至 2022
              年中 $680M+——来自多起收购，包括 Magic Pony（2016 年被 Twitter/X 以 $150M 收购）、Sonantic（2022 年被 Spotify 收购）、PassFort（被
              Moody's 收购）和 Bloomsbury AI（被 Meta/Facebook 收购）。2022 年后的已实现退出没有公开披露，但投资组合继续成熟；Gensyn 的 a16z 轮和 PolyAI 的
              Khosla 轮代表了更近期的高能见度结果。自 2011 年以来支持约 600 家公司、隐含平均持股约 9%，意味着 EF
              的总投资组合股权基础分散在数百家非常早期公司中，同时少数数十亿美元级爆发式增长公司形成幂律集中。
