  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: March 2026 Series D 估值——结构与机制
        blocks:
          - type: paragraph
            body: >
              $1.3 billion 投后估值确立于 March 11, 2026 的 Series D；该轮融资 $200M，其中 $130M 进入管理公司，$70M 进入关联投资基金。$1.3B
              估值只适用于管理公司（Entrepreneur First Ltd），不适用于更广义的 EF 基金结构或 LP 资本。从 $560M Series C（June 2022）到 $1.3B Series
              D（March 2026），估值上调 2.3x，跨越约 3.75 年，隐含年化 CAGR 约 27%。在 AI 时代的创业公司中，这个升幅相对温和——相比之下，同期 AI 基础设施公司实现了 5–10x
              估值——但它也反映了 EF 管理公司是长周期股权业务，没有传统 SaaS 式收入增长来支撑更激进的倍数。本轮由 Eric Schmidt、Jeffrey Dean、Aidan Gomez（Cohere CEO）和
              Benchmark 的 Matt Cohler 等一线运营者和投资者参与，且有现有投资者跟投，说明融资规模更可能受公司资金需求约束，而不是市场资金供给不足。$1.3B 是本轮成交价格；也就是 March 2026
              全球最合格、信息最充分的技术投资者同意投资 EF 的价格。
