      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: AI 浪潮大幅扩张 EF 可触达的人才供给
            body: >
              AI 研究人才爆发——OpenAI、DeepMind、Anthropic 和大学实验室里的博士、工程师、研究员——让 EF 的可服务人才池出现阶跃式扩张。这些人越来越愿意创业；EF
              结构化的联合创始人匹配基础设施，为他们提供了一条比单打独斗阻力更低的路径。全球 AI 人才密度最高的地方，正是 EF 已部署全职人才侦察员的机构。
            calloutType: strength
            claimRefs:
              - CM021
              - CM022
          - type: callout
            title: AI 人才的地域竞争加剧
            body: >
              EF 的人才管道正面对资金充足替代方案的更激烈竞争。YC 接受远程申请；a16z START 瞄准同一批美国和欧洲技术创始人，且不稀释股权；大型 AI 实验室支付留任奖金并提供研究资源，削弱创业本身的吸引力。EF
              模式依赖说服最优秀的技术人才相信，结构化联合创始人匹配路径比自发创业或加入现有公司能带来更好结果；经验证据支持这一点（投资组合结果、湾区估值溢价），但比较优势必须持续证明。
            calloutType: risk
            claimRefs:
              - CM019
              - CM024
              - CM025
          - type: callout
            title: 公司共建平台估值拐点显示资产类别成熟
            body: >
              EF 的 $1.3B 管理公司估值——由曾经打造 Stripe、LinkedIn、Google、Cohere 和 Benchmark
              的运营者背书——显示人才投资人模式已经从实验走向机构资产类别。这会形成飞轮：机构可信度吸引更好的人才侦察员，更好的人才侦察员识别更好的创始人，更好的创始人创造更大的投资组合价值，更大的投资组合价值又吸引更多机构资本。作为品类先行者，EF
              拥有 15 年模式迭代优势，最能受益于这个正循环。
            calloutType: insight
