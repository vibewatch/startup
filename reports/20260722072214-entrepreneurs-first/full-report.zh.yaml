  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 资本结构与融资历史
        blocks:
          - type: paragraph
            body: >
              Entrepreneurs First 采用双实体财务结构：管理公司（Entrepreneur First Ltd，在英国注册）运营人才筛选和公司共建项目；配套投资基金向投资组合公司部署股权支票。管理公司 9
              年内通过四轮股权融资累计募集约 $485M。2017 年 Series A 轮由 Reid Hoffman 和 Greylock Partners 领投，融资 $12.4M。2019
              年轮次以管理公司股权和投资基金结合的结构融资 $115M。2022 年 6 月 Series C 轮以 $560M 管理公司估值融资 $158M，引入 Patrick 和 John Collison（Stripe
              联合创始人）为投资人。2026 年 3 月 Series D 轮以 $1.3B 估值融资 $200M——其中 $130M 进入管理公司用于运营，$70M 进入配套基金用于投资组合。Series D 轮中的
              $130M 管理公司部分，是机构投资人相信这家公司可作为独立于基金年份回报的运营实体的主要指标。这一结构在加速器行业并不常见：包括 YC
              在内的大多数加速器都把运营开支作为成本中心，由投资基金管理费承担，也就是说管理公司不是独立资本化的业务。EF 选择向管理公司注入股权资本，而不是只依赖 LP
              资本，打造了更稳定的运营底座，也让管理公司能在基金回报兑现前先投人才侦察网络、技术基础设施和湾区不动产。
