      - number: '4.5'
        title: Series D 轮估值机制与投后结构
        blocks:
          - type: paragraph
            body: >
              管理公司的 $1.3B 投后估值在 2026 年 3 月 11 日 Series D 轮中确立。该轮由 Greylock Partners 共同领投或提供重要支持，Patrick Collison、John
              Collison、Reid Hoffman、Eric Schmidt、Danny Rimer（Index Ventures）、Matt Cohler（Benchmark）、Aidan Gomez（Cohere
              CEO）、Jeffrey Dean（前 Google Brain）、Claire Hughes Johnson、Charlie Songhurst、Sara Clemens 和 Barney
              Hussey-Yeo（Cleo 创始人、EF 校友）参与。Eric Schmidt 和 Jeffrey Dean 这两位 Google AI 重要人物，与 Cohere 的 Aidan Gomez
              一起参投，说明该轮不只是财务投资，更是对 EF 在 AI 人才战中投资逻辑的战略背书。以 $1.3B 投后估值向管理公司投入 $130M，意味着现有股东约 10% 稀释。上一轮投资人 Greylock 和
              Collison 兄弟继续参投，显示内部投资人信心仍在。$1.3B 估值相较 2022 年 6 月 $560M 估值提高 2.3 倍，历时约 3.75 年。从 Series C 到 Series
              D，年化估值增值约 27% CAGR，符合高增长风险投资业务特征，但按 AI 行业标准并不突出。$70M 配套基金部分与管理公司股权分开，充当共同投资工具，使 EF
              能在种子阶段向自家投资组合公司部署资本，区别于管理公司的运营预算。
