      - number: '2.4'
        title: 全球人才投资的供需动态
        blocks:
          - type: paragraph
            body: >
              供给端，EF 目标中的顶尖技术创始人——“500 人里挑 1 个”的个人——是全球性的，但集中在特定教育和职业环境：顶级 PhD 项目、AI
              研究实验室（DeepMind、OpenAI、Anthropic、FAIR）、精英科技公司（Google、Meta、Stripe）以及高选择性的国家级项目（英国数学奥林匹克、Putnam、物理奥林匹克）。EF 在
              Stanford、MIT、Berkeley、CMU、Yale、Princeton 和 UT Austin 的校园人才侦察网络，是系统性提前捕捉这条供给管道的尝试。需求端，2024–2026
              年，高质量种子前公司——尤其是 AI 原生公司——的市场显著升温，一线 VC 争抢最早轮次的份额。EF 的“管道工厂”模式创造了一批经过预筛选、完成联合创始人匹配的团队，落在 VC
              很难靠传统项目流触达的领域。供需方程的主要张力在于，EF 约 3–5% 的录取率限制了吞吐量；扩大队列规模又可能稀释信号质量。围绕这类人才的地域竞争正在加剧：美国政府移民政策、AI
              安全监管框架和湾区租金经济都会影响非美国人才搬迁意愿，因此 EF 的跨大西洋桥梁功能对市场越来越有价值。
            claimRefs:
