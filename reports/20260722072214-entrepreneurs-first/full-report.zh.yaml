      - number: '5.2'
        title: Form 平台——自研联合创始人匹配软件
        blocks:
          - type: paragraph
            body: >
              EF 运营一套名为「Form」的自研软件平台，作为联合创始人匹配和人才识别流程的数据底座。2022 Series C 新闻材料称，Form 是一套 CRM
              和行为数据平台，追踪候选人互动、会面模式、想法演变和队列内团队动态信号。平台汇总 EF 项目经理的结构化反馈、创始人自报的兼容性评估，以及会面频率数据，用来浮出联合创始人配对建议。15 年、600+
              家公司之后，EF
              积累了其所称全球最大的联合创始人成形结果数据集：谁和谁组队、哪些信号画像预示成功、哪些个人后来做出了独角兽公司。这个数据集的预测价值会随时间复利：每个新队列都会增加更多带标签的结果数据，让模型在申请筛选阶段识别高潜力候选人的能力更尖锐。Form
              平台不是面向消费者的产品，公开资料也只停留在高层营销描述。公开记录中没有发现与 Form 算法有关的专利申请或技术论文。考虑到 Series D 中有技术型 AI 投资人参与（Cohere 的 Aidan
              Gomez、Google Brain 的 Jeffrey Dean），平台很可能接入了现代 ML 管线来给申请人打分，但具体架构仍是自研闭源。
