  headquarters: San Francisco, CA, USA (primary program location since 2024; UK operations maintained)
  productSummary: >
    EF 的核心产品是一套两阶段结构化人才投资项目：FORM（12 周，湾区，匹配联合创始人并打磨想法）和 LAUNCH（12 周，湾区，搭产品并准备种子轮融资）。每家公司成形后，EF 以 SAFE 投入 $250K，取得约 9%
    股权；同时提供 $600K+ AI 技术额度（OpenAI、Anthropic、GitHub）、最高 $5M 跟投，以及 600+ 公司建设者组成的全球校友网络。EF 还在 7 所美国高校运营校园人才侦察项目，并为欧洲创始人推出 8
    周 Bridge 项目（2026 年 4 月上线）。
  customerFocus: |
    职业生涯前 6–7 年的顶尖个人技术创始人——来自顶尖实验室和科技公司的博士、AI 研究员、精英工程师；他们想创业，但还没有联合创始人、团队或想法。
  businessModel: >
    股权增值模式：每家公司成形时，EF 投入约 $250K，拿约 9% 股权，并在后续轮次中持续持有，最终通过被投公司收购、IPO 和老股交易实现回报。管理公司单独通过股权轮融资资本化；没有传统管理费收入。对每家公司最高 $5M
    的跟投提高 EF 在头部项目中的持股。
  stage: Series D
