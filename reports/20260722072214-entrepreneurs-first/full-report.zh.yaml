      - number: '6.3'
        title: 下游 VC 与机构投资者「客户」
        blocks:
          - type: paragraph
            body: >
              EF 的第二类客户，是在 FORM/LAUNCH 阶段之后为 EF 被投公司出资的机构投资者。实际上，这些投资者是 EF 的「下游分销客户」——他们通过为 EF 校友公司的种子轮和 Series A 出资，购买
              EF 人才筛选和公司成形流程的产出。机构 VC 的需求信号很强：Greylock、Index Ventures、Khosla Ventures、a16z 和 Cohere Ventures 都直接投过 EF
              被投公司，同一批机构也成了 EF 管理公司的直接投资者（Greylock、Index、Cohere）。这种纵向整合——EF 的投资者同时投资 EF 被投公司——形成飞轮：最好的 VC
              既有经济激励，也有内部信息，可以以有利条款投资 EF 校友公司，从而提高投资组合成功退出的概率。湾区搬迁数据——英国 创始人种子轮估值高 85%、法国创始人种子轮估值高 68%——是最具体的证据，说明在湾区 VC
              生态运营的 EF 公司，相比欧洲同类公司享有机构投资者需求溢价。EF 的 Demo Day 形式吸引 Greylock、Index、Benchmark，以及 Cohere/Google
              生态的战略投资者，是机构投资者接触 EF 被投公司的主要渠道。
