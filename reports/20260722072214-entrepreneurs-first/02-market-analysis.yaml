callouts:
  - calloutType: strength
    title: AI Wave Dramatically Expands EF's Accessible Talent Supply
    body: >
      The explosion of AI research talent — PhDs, engineers, and researchers at OpenAI, DeepMind,
      Anthropic, and university labs — represents a step-change expansion of EF's addressable
      talent pool. These individuals are increasingly inclined to found companies, and EF's
      structured co-founder matching infrastructure gives them a lower-friction path to doing
      so than going it alone. The global AI talent density is highest precisely at the
      institutions where EF has deployed full-time scouts.
    claimRefs: [CM021, CM022]

  - calloutType: risk
    title: Geographic Competition for AI Talent Intensifies
    body: >
      EF's talent pipeline faces intensified competition from well-resourced alternatives. YC
      accepts remote applications, a16z START targets the same US and European technical founders
      with no equity dilution, and large AI labs pay retention bonuses and offer research resources
      that compete with the intrinsic draw of founding a company. EF's model depends on convincing
      the best technical talent that the structured co-founder matching pathway produces better
      outcomes than self-starting or joining an existing company; the empirical evidence supports
      this claim (portfolio outcomes, Bay Area valuation premium), but the comparative case must
      be continuously earned.
    claimRefs: [CM019, CM024, CM025]

  - calloutType: insight
    title: Company Builder Valuation Inflection Signals Asset Class Maturation
    body: >
      EF's $1.3B management company valuation — backed by operators who built Stripe, LinkedIn,
      Google, Cohere, and Benchmark — signals that the talent investor model has crossed from
      experiment to institutional asset class. This creates a flywheel: institutional credibility
      attracts better talent scouts, better scouts identify better founders, better founders
      produce larger portfolio values, and larger portfolio values attract more institutional
      capital. The virtuous cycle benefits EF as the category pioneer with 15 years of model
      iteration advantage over competitors.
    claimRefs: [CM012, CM013, CM015]

