- id: portfolio-economics
  title: Portfolio Economics and Unrealized Appreciation
  body: >
    The $16B combined portfolio value (March 2026) represents the gross value of all 600+ EF portfolio companies at their
    last known valuations. EF's ~9% average stake across this portfolio implies an approximate gross equity value of $1.44
    billion on paper — strikingly close to the $1.3B management company valuation, though this comparison conflates different
    financial structures. The portfolio value has grown from an estimated $3B in 2021 to $16B in March 2026 — a 5.3x gross
    portfolio value appreciation in approximately 4 years. The composition of this $16B is not disclosed in detail, but key
    anchors include Tractable (AI for insurance/motor claims, valued at $1B+ in a 2021 Series D), Cleo (AI money manager,
    $1.3B+ in 2024), PolyAI (conversational AI for enterprise, raised Series C from Khosla Ventures), and Gensyn (decentralized
    AI compute, raised from a16z). The realized exit component — $680M+ as of mid-2022 — was driven by acquisitions including
    Magic Pony ($150M acquisition by Twitter/X in 2016), Sonantic (acquired by Spotify in 2022), PassFort (acquired by Moody's),
    and Bloomsbury AI (acquired by Meta/Facebook). Post-2022 realized exits are not publicly disclosed, but the portfolio
    has continued to mature with Gensyn's a16z round and PolyAI's Khosla round representing more recent high-profile outcomes.
    The approximately 600 companies backed since 2011 with an implied average stake of ~9% means EF's total portfolio equity
    stake base is diversified across hundreds of companies at very early stages, with power-law concentration in a small number
    of multi-billion-dollar breakouts.
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  tableRefs:
  - TI002
  - TI005
- id: management-co-financials
  title: Management Company Financial Position and Operating Economics
  body: >
    The management company's operating model has not been publicly disclosed in detail. UK Companies House filings for Entrepreneur
    First Ltd are publicly accessible but have not been reviewed in detail for this report. From available public sources,
    EF employs approximately 100–150 people across its global operations (San Francisco, London, Paris, Bangalore), with the
    largest concentration in San Francisco following the 2024 Bay Area pivot. Management company operating costs are primarily
    headcount (recruitment scouts, program managers, portfolio support) and real estate (Bay Area FORM and LAUNCH program
    space). The $130M management company tranche of the March 2026 Series D should provide approximately 3–5 years of operating
    runway at estimated annual operating costs of $25–40M per year (inferred from headcount scale and Bay Area real estate
    costs). EF has never reported positive EBITDA from management company operations publicly; as an equity-appreciation business,
    the management company generates operating losses that are offset by investment returns over time. The management company's
    primary liability is diluted returns if portfolio company exits are delayed or suppressed by adverse public market conditions.
    Unlike traditional VCs, EF has no management fee income from fund LPs to offset management company expenses; all operations
    must be funded from equity raises or realized exits.
  claimRefs:
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
  tableRefs:
  - TI006
  - TI007
  figureRefs:
  - FI004
- id: valuation-analysis
  title: Series D Valuation Mechanics and Post-Money Structure
  body: >
    The $1.3B post-money valuation of the management company was established in the March 11, 2026 Series D. The round was
    co-led or significantly backed by Greylock Partners, with participation from Patrick Collison, John Collison, Reid Hoffman,
    Eric Schmidt, Danny Rimer (Index Ventures), Matt Cohler (Benchmark), Aidan Gomez (Cohere CEO), Jeffrey Dean (formerly
    Google Brain), Claire Hughes Johnson, Charlie Songhurst, Sara Clemens, and Barney Hussey-Yeo (Cleo founder, EF alumnus).
    The participation of Eric Schmidt and Jeffrey Dean — both Google AI luminaries — alongside Aidan Gomez of Cohere signals
    that the round is positioned not just as a financial investment but as a strategic validation of EF's thesis in the AI
    talent war. The $130M management company investment at $1.3B post-money implies approximately 10% dilution to existing
    shareholders. Prior round investors Greylock and the Collisons are notable participants, indicating continued insider
    confidence. The $1.3B valuation represents a 2.3x step-up from the $560M valuation set in June 2022, over approximately
    3.75 years. Annualized valuation appreciation of approximately 27% CAGR from Series C to Series D is consistent with a
    high-growth venture business but not exceptional by AI sector standards. The $70M associated fund component — separate
    from the management company equity — functions as a co-investment vehicle enabling EF to deploy capital into its own portfolio
    companies at seed stage, distinct from the management company's operating budget.
  claimRefs:
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
  figureRefs:
  - FI002
