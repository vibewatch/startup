      - number: '8.2'
        title: Portfolio Equity Value as Valuation Anchor
        blocks:
          - type: paragraph
            body: >
              The most grounded anchor for EF's management company valuation is the equity value embedded in its
              portfolio holdings. EF holds approximately 9% equity in each of its 600+ portfolio companies via SAFE
              notes and follow-on investments. The combined gross portfolio value of these companies was stated as $16B
              in March 2026. Applying 9% to $16B yields approximately $1.44B in gross portfolio equity — notably close
              to the $1.3B management company valuation. However, three caveats are material: (1) the 9% average stake
              is an approximation; EF's follow-on investments of up to $5M per company increase its stake in top
              performers while dilution from later rounds reduces it over time; (2) the $16B is a gross portfolio
              valuation sum, not a market-liquidated figure — it is dominated by unrealized valuations in private
              companies that may be marked at outdated round prices; and (3) the management company's value also
              includes a franchise component: the ongoing value of the talent investor model, the scout network, the
              Form platform, the brand, and future cohort generations, none of which are reflected in the current
              portfolio equity. If the franchise component is valued separately — even at a conservative 0.5x of annual
              equity created per cohort — the total management company value exceeds $1.3B. Conversely, if significant
              write-downs occur in private company portfolio marks (as occurred broadly in 2022–2023), EF's implied
              portfolio equity could decrease materially, reducing the valuation anchor.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV023
              - CV029
              - CV030
