  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Program Architecture — FORM and LAUNCH Phases
        blocks:
          - type: paragraph
            body: >
              EF's core product is a two-phase program that runs prospective founders through a structured 12-week FORM
              phase followed by a 12-week LAUNCH phase. In the FORM phase, accepted individuals — who have no idea and
              no co-founder — are placed in a cohort of approximately 40–50 people in the Bay Area. Over 12 weeks, they
              explore problem spaces, test potential co-founder pairings, and develop initial hypotheses. Approximately
              80% of FORM participants identify a co-founder within 8 weeks, which EF cites as evidence of the matching
              process's efficacy. At the end of FORM, teams that have found a co-founder and developed a compelling
              thesis pitch to an internal EF investment committee for a $250K SAFE at approximately 9% equity. Teams
              that do not find a co-founder or whose ideas are not investment-committee-ready are declined investment;
              EF estimates roughly 20% of participants do not receive investment. The LAUNCH phase is a 12-week Bay Area
              residency where funded teams focus on building initial product, recruiting early customers, and preparing
              for seed fundraising. Teams in LAUNCH benefit from EF's demo day network — which includes Tier 1 VCs,
              Greylock partners, and scout networks from firms including Index, Benchmark, and Cohere Ventures. The
              Bridge program, launched in April 2026, is a shorter 8-week SF residency designed for European founders
              who want to test Bay Area network without committing to the full FORM cycle. It accepts approximately
              40–50 founders per cohort and serves as a pipeline feeder for future FORM applicants.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
