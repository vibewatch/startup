    title: EF Management Company Valuation Scenarios (Base, Bull, Bear) Through 2029
    type: range
    layout: standard
    summary: >-
      EF management company valuation range from bear ($1.45B) to bull ($3.5B) by 2029. Current $1.3B (Series D March
      2026).
