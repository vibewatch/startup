      - number: '5.2'
        title: The Form Platform — Proprietary Co-Founder Matching Software
        blocks:
          - type: paragraph
            body: >
              EF operates a proprietary software platform called "Form" that serves as the data backbone of its
              co-founder matching and talent identification process. Form was described in the 2022 Series C press
              materials as a CRM and behavioral data platform that tracks candidate interactions, meeting patterns, idea
              evolution, and team dynamic signals across the cohort. The platform aggregates structured feedback from EF
              program managers, self-reported compatibility assessments from founders, and meeting cadence data to
              surface co-founder pairing recommendations. Over 15 years and 600+ companies, EF has accumulated what it
              describes as the world's largest dataset of co-founder formation outcomes — who paired with whom, what
              signal profiles predicted success, which individuals went on to build unicorn companies. The predictive
              value of this dataset compounds over time: each new cohort adds more labeled outcome data that sharpens
              the model's ability to identify high-potential candidates at the point of application screening. The Form
              platform is not a consumer-facing product and is not publicly documented beyond high-level marketing
              descriptions. No patent applications or technical publications related to the Form algorithm have been
              identified in public records. The platform likely incorporates modern ML pipelines for applicant scoring
              given the involvement of technical AI investors (Aidan Gomez of Cohere, Jeffrey Dean of Google Brain) in
              the Series D, but the specific architecture is proprietary.
