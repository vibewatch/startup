  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital Structure and Funding History
        blocks:
          - type: paragraph
            body: >
              Entrepreneurs First operates a dual-entity financial structure: a management company (Entrepreneur First
              Ltd, UK-registered) that runs the talent selection and company building programs, and associated
              investment funds that deploy equity checks into portfolio companies. The management company has raised
              equity capital in four rounds totaling approximately $485M over nine years. The 2017 Series A raised
              $12.4M led by Reid Hoffman and Greylock Partners. The 2019 round raised $115M as a combined management
              company equity and investment fund structure. The June 2022 Series C raised $158M at a $560M management
              company valuation, adding Patrick and John Collison (Stripe co-founders) as investors. The March 2026
              Series D raised $200M at a $1.3B valuation — $130M to the management company for operations and $70M to
              the associated fund for portfolio investments. The $130M management company tranche in the Series D is the
              primary indicator of institutional confidence in the business as an operating entity independent of fund
              vintage returns. The structure is unusual for the accelerator industry: most accelerators — including YC —
              run their operating expenses as a cost center funded by management fees from their investment funds,
              meaning their management companies are not independently capitalized businesses. EF's decision to raise
              equity into the management company rather than relying solely on LP capital creates a more stable
              operating base and allows the management company to invest in scout networks, technology infrastructure,
              and Bay Area real estate ahead of fund returns.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
