            title: Antler's Global City Count and Volume Model Creates Long-Term Structural Risk
            body: >
              Antler's 20+ city footprint and ~4,000 founders per year versus EF's ~200–250 creates a market coverage
              gap that may matter increasingly as the company builder model matures. If the best technical talent
              globally coalesces around choosing either YC (US, established teams) or Antler (global, accessible), EF
              could find its middle-market position — more selective than Antler, less branded than YC — squeezed.
              Antler's 2022 $285M raise and continued expansion suggest it is well-capitalized to sustain its growth
              trajectory.
            calloutType: risk
            claimRefs:
