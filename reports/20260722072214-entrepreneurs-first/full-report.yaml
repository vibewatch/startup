companyProfile:
  summary: >
    Entrepreneurs First (EF) is the world's leading pre-idea talent investor and company builder, founded in London in
    2011 by Alice Bentinck and Matt Clifford. EF identifies and backs exceptional individuals — typically PhDs, AI
    researchers, and elite engineers in the first 7 years of their careers — before they have a co-founder, team, or
    business idea. Through its structured 12-week FORM phase, EF matches co-founders and develops company theses,
    investing $250K via SAFE at ~9% equity upon team formation. A 12-week LAUNCH phase in San Francisco follows. As of
    March 2026, EF has built 600+ companies with a combined $16B+ portfolio value, completed $680M+ in realized exits
    (as of mid-2022), and reached a $1.3B management company unicorn valuation in a $200M Series D backed by Greylock,
    the Collison brothers (Stripe), Reid Hoffman, Eric Schmidt, and others. Alice Bentinck has been CEO since December
    2023; Matt Clifford serves as Chairman.
  foundedDate: '2011-01-01'
  founders:
    - name: Alice Bentinck
      role: CEO
      background: >
        Oxford-educated; ex-McKinsey; co-founded EF in 2011; appointed MBE for services to entrepreneurship; became CEO
        December 2023 following Clifford's transition to Chairman.
      claimRefs:
