            body: >
              A key product-level differentiator in EF's 2025–2026 offering is its AI tool integration for portfolio
              companies. EF provides each company in its cohort with access to more than $600K in technology credits,
              including access to OpenAI API credits, Anthropic Claude credits, and GitHub Copilot Pro for the full
