              AI-native: Tractable uses computer vision for insurance claims, Cleo uses large language models for
              personal finance, PolyAI uses conversational AI for enterprise, and Gensyn is building decentralized AI
              compute infrastructure. The AI depth of the portfolio validates EF's technical talent identification
              thesis and creates a compelling case study for AI researchers considering founding companies.
