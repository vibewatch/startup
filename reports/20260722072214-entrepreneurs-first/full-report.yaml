      - number: '4.2'
        title: Revenue Model and Monetization Strategy
        blocks:
          - type: paragraph
            body: >
              EF's revenue model is fundamentally different from traditional VC funds and traditional accelerators. EF
              does not charge portfolio companies a program fee, nor does it derive revenue from management fees on an
              investment fund in the traditional sense. Instead, EF's primary economic engine is equity appreciation: EF
              takes approximately 9% equity via a SAFE note at a check size of $250,000 per company at the point of
              formal team formation. EF then holds this equity through subsequent funding rounds, realizing value when
              portfolio companies exit (via acquisition or IPO) or complete secondary sales. The primary monetization
              pathway is therefore long-cycle: EF builds stakes in hundreds of early-stage companies and monetizes
              through a combination of acquisitions (Sonantic to Spotify, PassFort to Moody's, Bloomsbury AI to Meta,
              Magic Pony to Twitter for $150M), future IPOs, and secondary transactions. EF also earns follow-on
              investment rights for up to $5M per company, enabling it to increase stake in its highest-conviction
              portfolio companies. Secondary revenue streams include the $600K+ in tech credits (from OpenAI, Anthropic,
              GitHub) that EF distributes to portfolio companies — this is a cost offset rather than a revenue line, but
              represents substantial value creation per cohort. The 2022 Series C press release indicated $680M in
              realized exits as of mid-2022, suggesting meaningful but unquantified cumulative distributions. As of July
              2026, no updated realized exit figure has been publicly disclosed for the post-2022 period, though the
              portfolio value grew from $3B (2021) to $16B (March 2026), implying unrealized appreciation of
              approximately $13B on a portfolio basis.
            claimRefs:
