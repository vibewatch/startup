      - number: '6.4'
        title: Geographic Traction and Customer Concentration
        blocks:
          - type: paragraph
            body: >
              EF's founder customer base historically concentrated in the UK and Europe, with London as the primary
              talent hub since the program's founding in 2011. The 2024 Bay Area pivot materially changed the geographic
              distribution: EF now runs its primary programs in San Francisco and actively recruits from seven major US
              university campuses. The Bridge program (April 2026) — an 8-week San Francisco residency for European
              founders — indicates that EF is maintaining geographic diversity in its applicant pool while concentrating
              program delivery in the Bay Area. EF operates or has historically operated programs in Paris (France) and
              Bangalore (India), though the current emphasis is on San Francisco as the primary cohort location. The
              geographic diversity of EF's applicant pool is a strategic asset: European and Indian technical talent
              often arrives with less startup experience than US-native applicants, making them more receptive to EF's
              structured co-founder matching program. Conversely, the most experienced US founders — those who have
              already been through YC or prior startups — are less likely to benefit from a structured program and less
              likely to apply to EF. This means EF's customer acquisition strategy focuses on the segment of exceptional
              technical talent that has not yet started a company, which is a large and continuously replenishing
              population at every graduating cohort of top technical universities globally.
