      - number: '8.5'
        title: Bull Case, Bear Case, and Base Case Valuation Scenarios (2029)
        blocks:
          - type: paragraph
            body: >
              Looking out to a 2029 investment horizon, three scenarios capture the valuation range for EF's management
              company. In the bull case, EF successfully scales to 500+ founders per year, maintains selectivity through
              improved Form platform AI capabilities, and generates 2–3 major portfolio exits (Tractable IPO, Cleo IPO,
              PolyAI acquisition) that create $3–5B in realized distributions. Bay Area expansion continues to generate
              the 85% valuation premium for EF-backed companies, and the Clifford conflict-of-interest issue resolves
              without formal regulatory sanctions. In this scenario, EF's management company could be valued at $3–4B in
              a 2029 Series E or secondary transaction, implying a 2.5–3x return for Series D investors. In the base
              case, EF scales cohorts modestly (300–350 per year), generates 1 major exit (Cleo IPO or Tractable
              acquisition), and continues to grow the portfolio value toward $25B+, but the Clifford controversy creates
              some institutional headwind. Management company valuation reaches $2–2.5B by 2029. In the bear case, the
              Clifford conflict escalates to formal investigation, EF's UK institutional relationships are impaired,
              cohort scaling dilutes selectivity signal, and portfolio company exits are delayed by macro conditions.
              Bay Area relocation requirement reduces applicant volumes. Management company valuation plateaus at
              $1.3–1.5B for 2–3 years.
            claimRefs:
