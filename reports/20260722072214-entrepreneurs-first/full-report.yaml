      - number: '7.3'
        title: Model Scaling Risk — Quality vs. Quantity Trade-Off
        blocks:
          - type: paragraph
            body: >
              EF's $1.3B valuation implicitly prices in significant cohort scaling: at current program throughput of
              approximately 200–250 founders per year, EF cannot justify a unicorn management company valuation on
              operations alone. The Series D is explicitly intended to fund Bay Area program scaling — adding more
              cohort slots, expanding scout networks, growing the Bridge program. However, EF's core value proposition
              depends on maintaining a ~3–5% acceptance rate that signals extreme selectivity. If EF doubles or triples
              cohort sizes while maintaining the same geographic talent pool, the average quality of accepted founders
              may decline. The 80% co-founder match rate is an efficiency metric that may deteriorate if cohorts are
              larger and less naturally compatible. EF has not publicly addressed how it plans to scale program
              throughput while maintaining the quality signal that drives demand. The structural tension is inherent to
              the talent investor model: the program's value to individual founders derives precisely from EF's
              exclusive reputation, which is inversely correlated with scale. Antler's decision to prioritize volume
              (4,000+ founders per year) has likely reduced its prestige premium relative to EF's — and EF's current
              differentiation depends on not making the same choice.
            claimRefs:
              - CR011
