      claimRefs:
        - CO002
        - CO004
  foundingLocation: London, UK
  headquarters: San Francisco, CA, USA (primary program location since 2024; UK operations maintained)
  productSummary: >
    EF's core product is a structured two-phase talent investment program: FORM (12 weeks of co-founder matching and
    idea development, Bay Area) and LAUNCH (12 weeks of product building and seed fundraising preparation, Bay Area). EF
    provides $250K SAFE investment at ~9% equity per company formed, $600K+ in AI technology credits (OpenAI, Anthropic,
    GitHub), follow-on investment of up to $5M, and access to a global alumni network of 600+ company builders. EF also
    operates a university scout program at 7 US campuses and an 8-week Bridge program for European founders (launched
    April 2026).
  customerFocus: >
    Exceptional individual technical founders in the first 6–7 years of their careers — PhDs, AI researchers, and elite
    engineers from top labs and technology companies — who want to found a company but do not yet have a co-founder,
    team, or idea.
  businessModel: >
    Equity-appreciation model: EF invests ~$250K for ~9% in each company formed, then holds this equity through
    subsequent rounds, realizing returns through portfolio company acquisitions, IPOs, and secondary transactions.
    Management company is separately capitalized through equity rounds; no traditional management fee income. Follow-on
    investments of up to $5M per company increase stakes in top performers.
