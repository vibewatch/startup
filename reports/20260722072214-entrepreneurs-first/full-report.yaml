    title: EF Portfolio Equity Value vs Management Company Valuation ($B)
    type: bar
    layout: standard
    summary: >-
      EF's implied portfolio equity (~$1.44B from ~9% of $16B portfolio) closely matches the $1.3B management company
      valuation, with a small residual franchise premium.
    data:
      items:
        - label: Implied portfolio equity stake (9% of $16B)
          value: 1.44
        - label: Series D management co. valuation
          value: 1.3
        - label: Franchise premium (implied)
          value: 0.14
    approximationNotes: >-
      Portfolio equity stake is an analyst calculation (9% × $16B). The 9% is an approximation; actual stake varies by
      company and is reduced by dilution in later rounds. Franchise premium is the arithmetic difference. The $16B
      portfolio value is company-disclosed (March 2026).
    claimRefs:
      - CV006
      - CV007
      - CV008
