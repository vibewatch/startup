              mature with Gensyn's a16z round and PolyAI's Khosla round representing more recent high-profile outcomes.
              The approximately 600 companies backed since 2011 with an implied average stake of ~9% means EF's total
              portfolio equity stake base is diversified across hundreds of companies at very early stages, with
