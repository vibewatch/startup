        - Portfolio marks may be stale (2021-22)
        - Thesis holds at face value; mark risk exists
      - - EF model is defensible
        - 15-year track record, 600+ companies
        - Antler expanding; YC going remote
        - Thesis holds near-term; long-term uncertain
      - - Series D investors provide validation
        - Schmidt, Dean, Gomez at $1.3B
        - Investors may have non-financial motivations
        - Strong validation signal
