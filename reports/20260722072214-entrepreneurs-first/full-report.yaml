            body: >
              The management company's operating model has not been publicly disclosed in detail. UK Companies House
              filings for Entrepreneur First Ltd are publicly accessible but have not been reviewed in detail for this
              report. From available public sources, EF employs approximately 100–150 people across its global
              operations (San Francisco, London, Paris, Bangalore), with the largest concentration in San Francisco
              following the 2024 Bay Area pivot. Management company operating costs are primarily headcount (recruitment
              scouts, program managers, portfolio support) and real estate (Bay Area FORM and LAUNCH program space). The
              $130M management company tranche of the March 2026 Series D should provide approximately 3–5 years of
              operating runway at estimated annual operating costs of $25–40M per year (inferred from headcount scale
              and Bay Area real estate costs). EF has never reported positive EBITDA from management company operations
              publicly; as an equity-appreciation business, the management company generates operating losses that are
              offset by investment returns over time. The management company's primary liability is diluted returns if
              portfolio company exits are delayed or suppressed by adverse public market conditions. Unlike traditional
              VCs, EF has no management fee income from fund LPs to offset management company expenses; all operations
              must be funded from equity raises or realized exits.
