  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and EF's Addressable Market
        blocks:
          - type: paragraph
            body: >
              Entrepreneurs First operates within two overlapping markets: (1) the global startup accelerator and
              incubator services market, and (2) the global pre-seed and seed venture capital ecosystem. EF's specific
              sub-market is the "talent investor" or "company builder" category, which refers to platforms that identify
              and back individuals before they have formed companies, rather than investing in existing early-stage
              startups. This sub-category sits upstream of traditional VC: EF is not competing for deal flow from
              existing founding teams; it is creating founding teams from scratch. The global startup accelerator market
              was valued at approximately $4.3 billion in 2024 and is projected to reach $5.1 billion in 2025 (CAGR
              ~19%). The North American segment accounts for roughly 41% of global accelerator revenue (~$2.0 billion in
              2024). The startup incubator market is separately estimated at approximately $1.98 billion in 2024. The
              combined market for structured early-stage startup support (accelerators + incubators) totals roughly $6.3
              billion globally in 2024. EF's serviceable addressable market is narrower: the population of highly
              credentialed technical and entrepreneurial individuals at leading universities and top technology
              companies globally who represent the raw material for venture-backed founders. At any point in time, this
              population runs to several hundred thousand people across EF's target geographies (US, UK, France, India),
              though only a small fraction (~17,000 per 18 months applied as of 2022) choose to apply to EF's programs.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
