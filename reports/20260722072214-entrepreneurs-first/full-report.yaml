            title: Management Company Equity Model Provides Structural Stability
            body: >
              EF's decision to capitalize its management company via equity rounds — rather than relying solely on fund
              management fees — means its operating budget is not dependent on returning LP capital on any particular
              schedule. With $130M fresh management company capital from the Series D, EF has a multi-year operating
