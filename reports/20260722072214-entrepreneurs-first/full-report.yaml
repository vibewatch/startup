              credit package is a significant product-level advantage over competitors: Antler does not provide
              comparable AI credit bundles; YC provides some credits through its partner network but historically in
              smaller amounts for standard batches. EF's university scout network operates at institutions where AI
              research talent is concentrated — Stanford's AI Lab, MIT CSAIL, Berkeley AI Research (BAIR) — which
