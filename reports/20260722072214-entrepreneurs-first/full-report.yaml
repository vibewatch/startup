      - number: '6.3'
        title: Downstream VC and Institutional Investor "Customers"
        blocks:
          - type: paragraph
            body: >
              EF's secondary customer group consists of the institutional investors who fund EF portfolio companies
              after the FORM/LAUNCH phase. These investors are effectively EF's "downstream distribution customers" —
              they purchase the output of EF's talent selection and company formation process by funding the seed and
              Series A rounds of EF alumni companies. The demand signal from institutional VCs is strong: Greylock,
              Index Ventures, Khosla Ventures, a16z, and Cohere Ventures have all backed EF portfolio companies
              directly, and the same firms have also become direct investors in EF's management company (Greylock,
              Index, Cohere). This vertical integration — where EF's investors also back EF's portfolio companies —
              creates a flywheel: the best VCs have both economic incentive and insider knowledge to fund EF alumni
              companies at favorable terms, increasing the probability of successful portfolio exits. The Bay Area
              relocation data — 85% higher UK founder seed valuations, 68% higher French founder seed valuations — is
              the most concrete evidence of the institutional investor demand premium for EF companies operating in the
              Bay Area VC ecosystem versus their European counterparts. EF's demo day format, which attracts Greylock,
              Index, Benchmark, and strategic investors from the Cohere/Google ecosystem, is the primary channel through
              which institutional investors encounter EF portfolio companies.
