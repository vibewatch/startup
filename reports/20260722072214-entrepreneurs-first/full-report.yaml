      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: EF Is the Only Scaled Pre-Idea Talent Investor with 15-Year Track Record
            body: >
              The combination of EF's 15 years of operational history, 600+ companies built, $16B portfolio value, and
              institutional investor roster (Collisons, Hoffman, Schmidt, Rimer) creates a credibility gap that Antler —
              EF's closest model competitor with only ~6 years of history — cannot close quickly. EF's data advantage in
              co-founder matching and its alumni network compounding are legitimate moats that accrue with time. No
              competitor is in a position to credibly claim the same model validation depth in 2026.
            calloutType: strength
            claimRefs:
