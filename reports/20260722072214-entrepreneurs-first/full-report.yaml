      - number: '7.2'
        title: Conflict of Interest — Matt Clifford, ARIA, Callosum, and Sovereign AI Fund
        blocks:
          - type: paragraph
            body: >
              The most acute adverse material for EF is the conflict-of-interest risk surrounding Matt Clifford's
              overlapping roles. Clifford was simultaneously: (1) Chairman of EF, with equity and financial interest in
              EF portfolio companies; (2) Chair of ARIA (Advanced Research + Invention Agency), the UK government's
              high-risk research funder; and (3) Adviser to the Prime Minister on AI (January–June 2025). UK Parliament
              Written Question 24439 (January 2025), filed by Member of Parliament Dr Ben Spencer, formally asked
              whether Clifford's EF portfolio company Callosum had received or applied for ARIA funding, given
              Clifford's role in designing and chairing the fund. Clifford has stated publicly that he recuses himself
              from ARIA decisions related to EF portfolio companies. However, the UK parliamentary transparency record
              contains no formal declaration of interests that would fully document how recusal was implemented in
              practice. Private Eye magazine Issue 1674 (May 2026) reported on Clifford's alleged benefit from
              government AI infrastructure decisions — specifically the UK Sovereign AI Fund, whose parameters Clifford
              helped design — that may have advantaged EF portfolio companies. Clifford denied impropriety and pointed
              to his resignation from the PM adviser role in June 2025 as evidence of his commitment to avoiding
              conflicts. The risk for EF is two-dimensional: (1) institutional reputation — major UK government
              entities, pension funds, and university partnerships may distance themselves from EF pending investigation
              resolution; and (2) regulatory risk — a formal Parliamentary inquiry or conflict-of-interest ruling could
              result in remediation obligations, asset clawbacks (from Callosum specifically), or broader restrictions
              on EF's government engagement.
            claimRefs:
              - CR006
