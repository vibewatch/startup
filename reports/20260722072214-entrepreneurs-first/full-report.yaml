      - number: '6.5'
        title: Demand Validation, Churn Risks, and Customer Retention
        blocks:
          - type: paragraph
            body: >
              The primary demand validation risk for EF is that its publicly cited metrics — 17,000 applications per 18
              months, 80% co-founder match rate, 85% higher seed valuations — are all derived from 2022 or earlier data,
              and in the case of the seed valuation metrics, from EF's own Bay Area expansion program materials rather
              than independently verified benchmarks. The four-year gap in updated public metrics creates uncertainty
              about whether applicant volumes, acceptance rates, and portfolio performance have maintained their
              historical trajectories. EF's reputation for selectivity is a key demand driver: the high acceptance
              difficulty signals to applicants that being accepted is itself a quality signal, creating a
              self-reinforcing prestige loop. However, if EF expands cohort sizes materially (as implied by the Series D
              scale-up plan), this could dilute the selectivity signal and reduce the program's prestige premium for the
              most ambitious candidates. EF does not have a customer retention metric in the traditional sense: founders
              who complete the program either receive investment (and become long-term portfolio relationships) or exit
              without investment. There is no annual subscription, renewal, or SaaS contract. The "customer lifetime
              value" is entirely captured through equity appreciation over 7–12 year timeframes, making EF's demand
              metrics more similar to a fund manager's AUM retention than a SaaS company's customer retention.
