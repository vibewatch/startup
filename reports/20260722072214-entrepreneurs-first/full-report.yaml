      - number: '5.5'
        title: Product Limitations and Technical Risks
        blocks:
          - type: paragraph
            body: >
              EF's product has several documented limitations and risks. First, the program is batch-based and
              location-dependent: the FORM phase requires physical co-location in the Bay Area for 12 weeks, which
              limits the accessible talent pool to individuals who can relocate temporarily. This is both a feature (Bay
              Area valuation premium) and a limitation (excludes founders who cannot relocate for 24+ weeks total).
              Second, the ~20% dropout rate in FORM (founders who do not find co-founders or are not funded by the
              investment committee) represents a significant adverse experience for a small but meaningful fraction of
              accepted candidates; if alumni of this cohort publicly describe their FORM experience negatively, it could
              dampen applications. Third, the Form matching platform has not been independently audited or benchmarked;
              EF's claims about matching efficacy are self-reported. Fourth, EF's geographic concentration in four
              markets (US, UK, France, India) means that exceptional technical talent in other high-density markets
              (Canada, Israel, Germany, South Korea, Australia) is not reached at scale by the scout program. Fifth, the
              absence of a published technical roadmap or patent portfolio makes it difficult to assess whether EF's
              platform advantages are durable as AI-based talent matching becomes commoditized. Sixth, EF's dependence
              on AI lab infrastructure (OpenAI, Anthropic, GitHub) for its $600K credit package means pricing changes or
              partner relationship deterioration could reduce the program's value proposition materially.
