chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >
              Entrepreneurs First (EF), formerly Entrepreneur First, is an international company builder and talent
              investor headquartered in San Francisco, with programs in London, Paris, and Bangalore. Founded in 2011 by
              Alice Bentinck and Matt Clifford, EF invests in exceptional individuals before they have a startup idea,
              co-founder, or team — the earliest possible stage of company formation. Participants join an intensive
              cohort-based program, find co-founders using EF's matching process, develop business ideas, and receive a
              pre-seed investment of up to $250,000 for approximately 9% equity via a SAFE instrument once they pass
              EF's investment committee. EF's core thesis is that the world's most important companies are built by
              exceptional individuals, and that identifying and backing those individuals before they coalesce into a
              company creates outsized venture-scale returns. In 2024 EF introduced mandatory Bay Area relocation for
              all pre-seed graduates, creating a transatlantic pipeline from global talent pools to Silicon Valley. The
              company describes its model informally as the "CAA for startups." Its programs operate on two phases: a
              talent- identification and co-founder matching phase (FORM, up to 12 weeks), followed by a Bay Area
              scaling phase (LAUNCH, up to 12 weeks) during which teams raise seed rounds from US investors.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
