      - number: '1.3'
        title: Funding History and Valuation Trajectory
        blocks:
          - type: paragraph
            body: >
              EF has raised capital in multiple rounds structured as equity rounds in its management company rather than
              traditional LP fund raises, positioning it as a hybrid between a VC firm and a venture-backed startup. The
              2017 Series A raised $12.4 million with Reid Hoffman and Greylock leading, bringing Hoffman onto the
              board. A $115 million Fund 3 closed in 2019. The June 2022 Series C raised $158 million at a $560 million
              valuation, adding the Collison brothers (Stripe) as new investors. On March 11, 2026, EF announced its
              Series D: $200 million at a $1.3 billion valuation — EF's first unicorn milestone. Of the $200 million,
              approximately $130 million flows to the EF management company to fund institutional infrastructure (talent
              scouts, program operations, technology), while $70 million goes to the investment fund that backs
              portfolio companies. Total capital raised in the management company track stands at approximately $485
              million to date across all rounds. The Series D was not a traditional VC fund raise; it is an equity round
              in EF Ltd (the operating entity), affirming the platform-company interpretation of EF's business model.
