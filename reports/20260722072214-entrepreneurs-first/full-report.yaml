      - number: '7.4'
        title: Competitive Displacement and Financial Concentration Risk
        blocks:
          - type: paragraph
            body: >
              EF faces three categories of competitive risk that could impair the $1.3B management company value. First,
              YC's remote-friendly expansion reduces EF's historical monopoly on European technical talent. If the best
              European founders can now access YC remotely, EF's mandatory 24-week Bay Area relocation requirement
              becomes a net disadvantage rather than a premium signal. Second, Antler's global city network expansion
              could capture talent in geographies EF does not serve — Singapore, Lagos, Oslo, Berlin, Sydney — creating
              a geographic coverage gap that widens over time. Third, large AI labs (OpenAI, DeepMind, Anthropic) that
              retain their best technical employees through internal research programs, high compensation, and spinout
              culture are effectively competing for the same pool of "1 in 500" technical talent that EF targets. On the
              financial side, EF's revenue model is entirely equity-appreciation-based: there is no recurring revenue,
              no subscription income, and no management fee income from LPs (beyond whatever is implicit in the fund
              component). This means EF's management company cash flow is entirely dependent on portfolio company exits
              — which are illiquid, lumpy, and correlated with public market conditions. A prolonged IPO window closure
              or M&A slowdown (as occurred in 2022–2023) can delay distributions for years, during which EF's management
              company must fund operations from its equity raise balance.
