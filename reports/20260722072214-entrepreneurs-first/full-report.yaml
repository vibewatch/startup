      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 15-Year Co-Founder Matching Dataset Is the Hardest-to-Replicate Moat
            body: >
              EF's proprietary dataset of 600+ co-founder formations, with outcome labels linking personality profiles,
              skillset pairings, and idea domains to company outcomes, is the single most defensible competitive asset
              the company has. Antler is building a comparable dataset but is at year six — nine years behind EF. YC
              does not systematically match co-founders and therefore has no comparable data asset. The compounding
              value of this dataset increases with each cohort: as more EF alumni companies reach scale and exits, the
              outcome labels improve, and the matching predictions sharpen. This data moat is likely more durable than
              any software feature set or network effect alone.
            calloutType: strength
            claimRefs:
              - CE007
              - CE008
              - CE009
          - type: callout
            title: Program Location-Dependency Limits Talent Accessible Pool
            body: >
              EF's mandatory physical co-location in San Francisco for 24+ weeks (FORM + LAUNCH) is both its strongest
              product differentiator (Bay Area valuation premium) and its most significant pipeline bottleneck. The
              requirement systematically excludes founders who cannot leave jobs, families, or geographies for six
              months. While EF's Bridge program (April 2026) provides an 8-week lighter-touch option, it does not fully
              address the relocation friction for the segment of exceptional technical talent that cannot commit to 24
              weeks. YC's remote-friendly batch option is an increasingly attractive alternative for this segment, and
              Antler's global city network addresses it through local program delivery.
            calloutType: risk
            claimRefs:
              - CE019
              - CE020
              - CE021
          - type: callout
            title: AI Tech Credits Create Founder-Market Fit During the Critical Idea-Formation Window
            body: >
              Providing $600K+ in AI model credits per cohort during the FORM phase is more than a cost subsidy — it
              allows founders to rapidly prototype AI-native products during the period when they are still exploring
              problem spaces. Access to frontier AI models at zero cost during the 12-week FORM phase means EF-backed
              founders can explore more ideas, validate hypotheses faster, and arrive at better company formation
              decisions than founders bootstrapping their own API access. In the current environment where most
              high-value startups are AI-native, this infrastructure advantage directly influences the quality of ideas
              that emerge from EF cohorts.
            calloutType: insight
            claimRefs:
              - CE010
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Founder Customers — Profile, Pipeline, and Demand Signals
        blocks:
          - type: paragraph
            body: >
              EF's primary "customers" are the exceptional individuals it selects for its FORM and LAUNCH programs. EF's
              target founder profile is explicit: the firm describes seeking candidates who are at the "1 in 500" level
              of talent in their domain, typically in the first 6–7 years of their career, with deep technical skills in
              AI, deep tech, or engineering. In practice, the EF cohort composition skews toward PhDs, AI researchers
              from labs including DeepMind, OpenAI, and Google Brain, engineers from Tier 1 technology companies
              (Google, Meta, Stripe, Jane Street, Goldman Sachs), and mathematically exceptional individuals identified
              through national competition pathways (UK Mathematical Olympiad, Putnam, Physics Olympiad). The EF program
              is equity-free for the FORM phase: participants do not pay to attend and EF only takes equity if a company
              is formed and funded. This "free-to-try" model is unusual in the accelerator industry and reduces the risk
              threshold for high-quality candidates who might otherwise be deterred by equity dilution upfront. The
              stated demand signal is 17,000 applications per 18-month period as of mid-2022, from which EF admitted
              approximately 500–600 individuals (a ~3–5% acceptance rate). The quality of the applicant pool is
              directionally supported by the caliber of EF's notable alumni — Barney Hussey-Yeo (Cleo), Alex Dalyac
              (Tractable), Nikola Mrkšić (PolyAI) — who went on to build billion-dollar companies. The global Bay Area
              expansion since 2024 has further qualified the applicant pool: candidates who apply for a San
              Francisco-mandatory program have pre-selected for founder ambition and geographic mobility, two traits
              correlated with startup success.
