            title: YC's Expansion into Remote Batches Encroaches on EF's European Talent Pipeline
            body: >
              Y Combinator's shift to remote-friendly batches — enabling European and Asian founders to participate
              without Bay Area relocation — directly encroaches on the non-US talent pool that EF historically served
              exclusively. For European technical founders who previously had to choose between YC (US relocation
              required) or EF (structured UK/EU program), YC's remote-friendliness now expands the choice set. EF's
