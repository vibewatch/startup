      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Alice Bentinck (CEO, MBE, born 1986) and Matt Clifford (Chairman, CBE, born 1985) co-founded EF in 2011
              after meeting at McKinsey & Company in 2009. Both are Oxford-educated entrepreneurs who observed that top
              European technical talent lacked a structured pathway to company creation comparable to Silicon Valley.
              Bentinck previously interned in Tony Blair's office and worked at McKinsey (2009–2011); she served as EF's
              CPO before assuming the CEO role in December 2023. Clifford, who led EF as CEO through most of its
              history, stepped down to focus on AI policy work and became Chairman. Clifford holds a CBE, was named to
              TIME100 AI 2024, helped design the UK's AI Safety Institute, chaired the UK Advanced Research and
              Invention Agency (ARIA), and served briefly as Prime Minister's Adviser on AI (January–June 2025). Reid
              Hoffman (LinkedIn co-founder, Greylock partner) joined EF's board in 2017 and remains an active board
              member and Series D investor. The investor roster for the March 2026 Series D — including Patrick and John
              Collison (Stripe), Eric Schmidt (Google), Danny Rimer (Index Ventures), Matt Cohler (Benchmark), Aidan
              Gomez (Cohere), and Jeffrey Dean (former Google Brain) — functions as a high-profile external advisory
              network. EF's 120+ person team includes full-time university scouts deployed at Stanford, MIT, Berkeley,
              CMU, Yale, Princeton, and UT Austin, as well as top European and Indian universities.
