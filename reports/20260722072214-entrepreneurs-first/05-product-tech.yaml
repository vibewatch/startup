callouts:
- calloutType: strength
  title: 15-Year Co-Founder Matching Dataset Is the Hardest-to-Replicate Moat
  body: >
    EF's proprietary dataset of 600+ co-founder formations, with outcome labels linking personality profiles, skillset pairings,
    and idea domains to company outcomes, is the single most defensible competitive asset the company has. Antler is building
    a comparable dataset but is at year six — nine years behind EF. YC does not systematically match co-founders and therefore
    has no comparable data asset. The compounding value of this dataset increases with each cohort: as more EF alumni companies
    reach scale and exits, the outcome labels improve, and the matching predictions sharpen. This data moat is likely more
    durable than any software feature set or network effect alone.
  claimRefs:
  - CE007
  - CE008
  - CE009
- calloutType: risk
  title: Program Location-Dependency Limits Talent Accessible Pool
  body: >
    EF's mandatory physical co-location in San Francisco for 24+ weeks (FORM + LAUNCH) is both its strongest product differentiator
    (Bay Area valuation premium) and its most significant pipeline bottleneck. The requirement systematically excludes founders
    who cannot leave jobs, families, or geographies for six months. While EF's Bridge program (April 2026) provides an 8-week
    lighter-touch option, it does not fully address the relocation friction for the segment of exceptional technical talent
    that cannot commit to 24 weeks. YC's remote-friendly batch option is an increasingly attractive alternative for this segment,
    and Antler's global city network addresses it through local program delivery.
  claimRefs:
  - CE019
  - CE020
  - CE021
- calloutType: insight
  title: >-
    AI Tech Credits Create Founder-Market Fit During the Critical Idea-Formation Window
  body: >
    Providing $600K+ in AI model credits per cohort during the FORM phase is more than a cost subsidy — it allows founders
    to rapidly prototype AI-native products during the period when they are still exploring problem spaces. Access to frontier
    AI models at zero cost during the 12-week FORM phase means EF-backed founders can explore more ideas, validate hypotheses
    faster, and arrive at better company formation decisions than founders bootstrapping their own API access. In the current
    environment where most high-value startups are AI-native, this infrastructure advantage directly influences the quality
    of ideas that emerge from EF cohorts.
  claimRefs:
  - CE010
  - CE011
  - CE014
