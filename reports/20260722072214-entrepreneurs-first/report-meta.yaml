companyProfile:
  summary: >
    Entrepreneurs First (EF) is the world's leading pre-idea talent investor and company builder,
    founded in London in 2011 by Alice Bentinck and Matt Clifford. EF identifies and backs
    exceptional individuals — typically PhDs, AI researchers, and elite engineers in the first
    7 years of their careers — before they have a co-founder, team, or business idea. Through
    its structured 12-week FORM phase, EF matches co-founders and develops company theses,
    investing $250K via SAFE at ~9% equity upon team formation. A 12-week LAUNCH phase in San
    Francisco follows. As of March 2026, EF has built 600+ companies with a combined $16B+
    portfolio value, completed $680M+ in realized exits (as of mid-2022), and reached a $1.3B
    management company unicorn valuation in a $200M Series D backed by Greylock, the Collison
    brothers (Stripe), Reid Hoffman, Eric Schmidt, and others. Alice Bentinck has been CEO
    since December 2023; Matt Clifford serves as Chairman.
  foundedDate: "2011-01-01"
  founders:
    - name: Alice Bentinck
      role: CEO
      background: >
        Oxford-educated; ex-McKinsey; co-founded EF in 2011; appointed MBE for services to
        entrepreneurship; became CEO December 2023 following Clifford's transition to Chairman.
      claimRefs: [CO002, CO003]
    - name: Matt Clifford
      role: Chairman (formerly CEO)
      background: >
        Cambridge-educated; ex-McKinsey; co-founded EF in 2011; was CEO until December 2023;
        served as UK ARIA Chair and PM's AI Adviser (Jan–Jun 2025); now Chairman; CBE honoree.
      claimRefs: [CO002, CO004]
  foundingLocation: "London, UK"
  headquarters: "San Francisco, CA, USA (primary program location since 2024; UK operations maintained)"
  productSummary: >
    EF's core product is a structured two-phase talent investment program: FORM (12 weeks of
    co-founder matching and idea development, Bay Area) and LAUNCH (12 weeks of product building
    and seed fundraising preparation, Bay Area). EF provides $250K SAFE investment at ~9% equity
    per company formed, $600K+ in AI technology credits (OpenAI, Anthropic, GitHub), follow-on
    investment of up to $5M, and access to a global alumni network of 600+ company builders.
    EF also operates a university scout program at 7 US campuses and an 8-week Bridge program
    for European founders (launched April 2026).
  customerFocus: >
    Exceptional individual technical founders in the first 6–7 years of their careers — PhDs,
    AI researchers, and elite engineers from top labs and technology companies — who want to
    found a company but do not yet have a co-founder, team, or idea.
  businessModel: >
    Equity-appreciation model: EF invests ~$250K for ~9% in each company formed, then holds
    this equity through subsequent rounds, realizing returns through portfolio company acquisitions,
    IPOs, and secondary transactions. Management company is separately capitalized through equity
    rounds; no traditional management fee income. Follow-on investments of up to $5M per company
    increase stakes in top performers.
  stage: "Series D"
  fundingStatus: >
    March 2026 Series D: $200M total ($130M management company + $70M investment fund) at
    $1.3B post-money management company valuation. Prior rounds: Series A $12.4M (2017),
    ~$115M hybrid round (2019), Series C $158M at $560M valuation (June 2022).
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO007, CO019]

summary:
  headline: >
    EF's $1.3B unicorn valuation is well-anchored by $1.44B implied portfolio equity, validated
    by world-class informed investors, and driven by a genuinely differentiated pre-idea talent
    investor model — but the Matt Clifford conflict-of-interest risk and absence of public
    financial metrics represent material diligence gaps that must be resolved before institutional
    commitment.
