    - "Formal ARIA conflict-of-interest register showing Clifford's recusal mechanism for EF portfolio company decisions"
    - "Callosum (EF portfolio company) ARIA application/grant status — the specific fact at issue in Parliament Q24439"
    - "Updated (2024–2026) EF application volume, acceptance rate, and cohort NPS — last disclosed metrics are from June 2022"
    - "Post-2022 realized exit distributions — last figure ($680M+) is from mid-2022; Sonantic/Spotify and subsequent exits not publicly quantified"
    - "IPO timeline for Cleo ($1.3B+ valuation, 7M users) or Tractable ($1B+) — the most significant near-term management company valuation catalysts"
