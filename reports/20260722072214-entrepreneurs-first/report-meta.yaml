  topStrengths:
    - "Only scaled global talent investor with 15 years of co-founder matching data — structurally unique competitive position"
    - "$16B portfolio value driven by unicorn/near-unicorn alumni (Tractable, Cleo, PolyAI, Gensyn) proving the model works"
    - "Series D investor roster (Collisons, Hoffman, Schmidt, Dean, Gomez) provides best-available third-party valuation validation"
    - "Bay Area pivot delivers 85%/68% higher seed valuations for UK/French founders — quantified competitive advantage"
    - "$130M management company tranche provides 3–5 year operating runway independent of portfolio exit timing"
  topRisks:
    - "Matt Clifford conflict-of-interest (ARIA, Callosum, Parliament Q24439, Private Eye May 2026) — highest-priority adverse material requiring formal resolution before institutional commitment"
    - "Zero public financial disclosure (no revenue, no P&L, no post-2022 exit figures) — management company valuation cannot be independently verified through conventional metrics"
    - "Model scaling tension: Series D implies significant cohort growth, but EF's value proposition depends on extreme selectivity (~3–5% acceptance rate) that scaling may dilute"
    - "YC's remote-friendly expansion and Antler's 20+ city global network create structural competitive threats to EF's European talent pipeline"
    - "Application volume and acceptance quality metrics are 4+ years stale — no evidence of current demand health post-Bay Area mandatory relocation pivot"
  unresolvedGaps:
