- id: exit-pathway-analysis
  title: Exit Pathway Analysis — IPO, Acquisition, and Secondary Sale Options
  body: >
    EF's management company has three primary exit pathways for management company investors: (1) IPO of the management company;
    (2) acquisition of the management company by a large VC, sovereign wealth fund, or strategic; and (3) secondary sale to
    a new institutional investor at a higher management company valuation in a future round. The IPO pathway is a long-term
    option — no comparable company builder management company has previously attempted an IPO, and the revenue model (equity
    appreciation rather than recurring revenue) would be difficult to present to public market investors. The acquisition
    pathway has recent precedent: Sequoia Capital, Andreessen Horowitz, and GV have all made strategic investments in or acqui-hired
    talent platform businesses in recent years. A sovereign wealth fund (ADIA, Temasek, GIC) or a large asset manager seeking
    access to early-stage AI deal flow could find EF's management company acquisition strategically compelling, particularly
    given EF's scout network and Bay Area pipeline. The secondary sale pathway — the most realistic near-term option for management
    company investors — would require a further step-up in management company valuation from $1.3B to $2.5–3B+, which would
    require either significant cohort scaling, large new portfolio exits (Tractable or Cleo IPOs), or expansion into new markets
    that increase the TAM. For fund investors, the primary return pathway remains portfolio company exits (acquisitions, IPOs)
    on the $70M fund component and the portfolio equity stake in the 600+ companies.
  claimRefs:
  - CV014
  - CV015
  - CV016
  - CV017
