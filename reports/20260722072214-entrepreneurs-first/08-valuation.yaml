company:
  name: Entrepreneurs First
chapter:
  number: 8
  title: Valuation and Exit Analysis
  summary: >
    Entrepreneurs First reached a $1.3 billion management company post-money valuation in March 2026 through a $200M Series
    D backed by Greylock, the Collison brothers, Reid Hoffman, Eric Schmidt, and other prominent technology investors. The
    valuation is supported by a $16B gross portfolio value, ~$1.44B implied portfolio equity stake, $680M+ in historical realized
    exits, and a growing market for company builder platforms. Standard revenue-multiple approaches are inapplicable (EF does
    not disclose revenue). The most relevant valuation analog is EF's own portfolio equity value plus a franchise premium
    for 15 years of compounding model advantages. At $1.3B, the management company valuation is approximately 0.9x the implied
    portfolio equity — suggesting modest franchise premium — but the real bull case depends on future cohort quality, scaling
    success, and portfolio company exit timing.
sections:
- id: valuation-mechanics
  title: March 2026 Series D Valuation — Structure and Mechanics
  body: >
    The $1.3 billion post-money valuation was established in the March 11, 2026 Series D, which raised $200M split between
    $130M into the management company and $70M into an associated investment fund. The $1.3B valuation applies to the management
    company (Entrepreneur First Ltd) only, not to the broader EF fund structure or LP capital. The valuation step-up from
    the $560M Series C (June 2022) to $1.3B Series D (March 2026) represents a 2.3x increase over approximately 3.75 years,
    implying approximately 27% annualized CAGR. This is a relatively modest step-up for a venture-stage company in the AI
    era — by comparison, AI infrastructure companies in the same period achieved 5–10x valuations — but it reflects the reality
    that EF's management company is a long-cycle equity business without traditional SaaS-style revenue growth that would
    justify more aggressive multiples. The valuation was supported by the participation of Tier 1 operators and investors
    including Eric Schmidt, Jeffrey Dean, Aidan Gomez (Cohere CEO), and Benchmark's Matt Cohler alongside existing investors,
    suggesting the round was demand-limited rather than supply-limited. The $1.3B valuation is the number at which the round
    cleared; it represents the price at which the most qualified, informed technology investors in the world agreed to invest
    in March 2026.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
