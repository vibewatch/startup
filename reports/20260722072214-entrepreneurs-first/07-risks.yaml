  claims:
  - id: CR001
    statement: >-
      Matt Clifford stepped down as CEO in December 2023, transitioning to Chairman with Alice Bentinck becoming CEO — a planned
      succession that reduces but does not eliminate key-person concentration risk.
    type: third-party-reported
    topic: key-person
    sourceRefs:
    - SR006
    - SR003
    confidence: medium
    freshness: historical
    answersQuestionRefs:
    - QR001
    - QR006
  - id: CR002
    statement: >-
      Alice Bentinck has been EF's operational founder since its 2011 founding and was awarded an MBE for services to entrepreneurship;
      she is a credible CEO capable of running EF independently.
    type: third-party-reported
    topic: key-person
    sourceRefs:
    - SR007
    - SR006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR019
  - id: CR003
    statement: >-
      The March 2026 Series D was successfully closed under Bentinck's leadership, demonstrating that EF's investor relationships
      and institutional credibility do not depend solely on Clifford.
    type: inferred
    topic: key-person
    sourceRefs:
    - SR008
    - SR017
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
  - id: CR004
    statement: >-
      Clifford's continued Chairman role despite stepping down as CEO and PM adviser suggests ongoing engagement with EF;
      however, Private Eye May 2026 reporting may accelerate pressure for his full departure.
    type: inferred
    topic: key-person
    sourceRefs:
    - SR003
    - SR002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR004
  - id: CR005
    statement: >-
      EF's brand narrative in the UK and EU institutional market is tightly tied to Clifford's profile; any full exit by Clifford
      would require rebuilding the UK/EU institutional narrative under Bentinck's brand alone.
    type: inferred
    topic: key-person
    sourceRefs:
    - SR010
    - SR009
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
  - id: CR006
    statement: >-
      Parliament Written Question 24439 (January 16, 2025) filed by MP Dr Ben Spencer formally asked whether Callosum (an
      EF portfolio company) had received or applied for ARIA funding given Clifford's role as ARIA Chair.
    type: third-party-reported
    topic: conflict-of-interest
    sourceRefs:
    - SR001
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QR002
    - QR003
  - id: CR007
    statement: >-
      Clifford stated publicly that he recuses himself from ARIA decisions related to EF portfolio companies, but no formal
      audit or independent verification of this recusal has been published.
    type: third-party-reported
    topic: conflict-of-interest
    sourceRefs:
    - SR010
    - SR009
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QR005
  - id: CR008
    statement: >-
      Private Eye magazine Issue 1674 (May 2026) reported on Clifford's alleged benefit from UK Sovereign AI Fund parameters
      he helped design, citing EF portfolio company Callosum as a potential beneficiary.
    type: third-party-reported
    topic: conflict-of-interest
    sourceRefs:
    - SR003
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QR004
  - id: CR009
    statement: >-
      Clifford resigned from his PM's AI Adviser role in June 2025 but retained his ARIA Chair role and EF Chairman position,
      meaning the conflict-of-interest structure between ARIA and EF portfolio companies persists.
    type: third-party-reported
    topic: conflict-of-interest
    sourceRefs:
    - SR003
    - SR009
    confidence: high
    freshness: recent
    answersQuestionRefs:
    - QR002
    - QR005
  - id: CR010
    statement: >-
      A formal Parliamentary inquiry into Clifford's dual roles could trigger remediation obligations, restrict EF's UK government
      partnerships, or require asset clawbacks from Callosum specifically.
    type: inferred
    topic: regulatory-risk
    sourceRefs:
    - SR001
    - SR002
    confidence: low
    freshness: current
    answersQuestionRefs:
    - QR016
    - QR017
  - id: CR011
    statement: >-
      EF's $1.3B valuation implicitly prices in significant cohort scaling from the current ~200–250 founders per year, but
      scaling cohort sizes may dilute the selectivity signal that drives founder demand.
    type: inferred
    topic: scaling-risk
    sourceRefs:
    - SR008
    - SR014
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR007
  - id: CR012
    statement: >-
      Antler's decision to prioritize volume (4,000+ founders per year) has likely reduced its prestige premium relative to
      EF's selectivity-first model, which EF must avoid replicating.
    type: inferred
    topic: scaling-risk
    sourceRefs:
    - SR005
    - SR008
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR007
  - id: CR013
    statement: >-
      EF has not publicly addressed how it plans to reconcile cohort scale growth with selectivity maintenance; this is a
      material open question for the management company's long-term value creation.
    type: inferred
    topic: scaling-risk
    sourceRefs:
    - SR008
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR007
  - id: CR014
    statement: >-
      The 80% co-founder match rate that EF cites as program efficacy evidence may deteriorate if cohort sizes grow significantly,
      as larger cohorts provide more mismatched pairings per participant.
    type: inferred
    topic: scaling-risk
    sourceRefs:
    - SR008
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR007
  - id: CR015
    statement: >-
      YC's expansion to remote-friendly batches directly reduces EF's historical monopoly on European technical talent, giving
      the best European founders a YC pathway without Bay Area relocation commitment.
    type: inferred
    topic: competitive-risk
    sourceRefs:
    - SR004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR008
  - id: CR016
    statement: >-
      Antler's 20+ city global footprint captures talent in geographies (Singapore, Lagos, Oslo, Berlin, Sydney) where EF
      has no current presence, creating a widening geographic coverage gap.
    type: inferred
    topic: competitive-risk
    sourceRefs:
    - SR005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR009
  - id: CR017
    statement: >-
      EF's management company has no recurring revenue and no management fee income; all cash flow is dependent on portfolio
      company exits, which are illiquid and correlated with public market conditions.
    type: inferred
    topic: financial-risk
    sourceRefs:
    - SR008
    - SR018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR011
  - id: CR018
    statement: >-
      The $130M Series D management company tranche provides approximately 3–5 years of operating runway, mitigating near-term
      financial risk even if exit markets remain suppressed.
    type: estimated
    topic: financial-risk
    sourceRefs:
    - SR017
    - SR008
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR012
  - id: CR019
