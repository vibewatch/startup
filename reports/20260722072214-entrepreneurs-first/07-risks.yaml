  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: clifford-recusal-documentation
    missingEvidence: >-
      Formal ARIA board minutes or published register of interests showing how Clifford implemented his stated recusal from
      EF portfolio company decisions
    whyItMatters: >-
      Without documented recusal mechanism, Parliament Q24439 and Private Eye reporting cannot be fully resolved in EF's favor;
      the ambiguity sustains reputational risk
    diligencePath: >-
      Request ARIA published register of member interests from GOV.UK; file Freedom of Information request for ARIA board
      conflict-of-interest declarations; request EF legal counsel opinion
    relatedQuestionRefs:
