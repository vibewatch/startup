callouts:
  - calloutType: strength
    title: EF Is the Only Scaled Pre-Idea Talent Investor with 15-Year Track Record
    body: >
      The combination of EF's 15 years of operational history, 600+ companies built, $16B portfolio
      value, and institutional investor roster (Collisons, Hoffman, Schmidt, Rimer) creates a
      credibility gap that Antler — EF's closest model competitor with only ~6 years of history —
      cannot close quickly. EF's data advantage in co-founder matching and its alumni network
      compounding are legitimate moats that accrue with time. No competitor is in a position
      to credibly claim the same model validation depth in 2026.
    claimRefs: [CP004, CP015, CP021]

  - calloutType: risk
    title: Antler's Global City Count and Volume Model Creates Long-Term Structural Risk
    body: >
      Antler's 20+ city footprint and ~4,000 founders per year versus EF's ~200–250 creates a
      market coverage gap that may matter increasingly as the company builder model matures.
      If the best technical talent globally coalesces around choosing either YC (US, established
      teams) or Antler (global, accessible), EF could find its middle-market position — more
      selective than Antler, less branded than YC — squeezed. Antler's 2022 $285M raise and
      continued expansion suggest it is well-capitalized to sustain its growth trajectory.
    claimRefs: [CP012, CP013, CP014]

  - calloutType: insight
    title: YC's Expansion into Remote Batches Encroaches on EF's European Talent Pipeline
    body: >
      Y Combinator's shift to remote-friendly batches — enabling European and Asian founders to
      participate without Bay Area relocation — directly encroaches on the non-US talent pool that
      EF historically served exclusively. For European technical founders who previously had to
      choose between YC (US relocation required) or EF (structured UK/EU program), YC's
      remote-friendliness now expands the choice set. EF's mandatory Bay Area relocation
      requirement may simultaneously be its strongest differentiator (higher valuations) and
      its biggest filter-out point versus a more flexible YC application process.
    claimRefs: [CP009, CP010, CP025]

