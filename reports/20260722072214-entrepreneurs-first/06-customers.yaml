- id: portfolio-traction
  title: Portfolio Company Traction — Tractable, Cleo, PolyAI, and Others
  body: >
    EF's downstream traction is most visible through its portfolio companies, which serve as proof points for the talent investor
    model and, indirectly, evidence of the quality of the founder customer base EF has attracted. Tractable, an AI company
    using computer vision for insurance claims and motor vehicle damage assessments, raised a $60M Series D in 2021 at a $1B+
    valuation and is deployed by major insurers globally. Tractable processes hundreds of thousands of vehicle damage assessments
    per month, serving customers including Tokio Marine, MAPFRE, and Covéa. Cleo, an AI-powered money management app, had
    grown to 7M+ users by 2024–2026 and raised a Series C at a $1.3B+ valuation. Cleo's user base is concentrated in the US
    and UK, primarily among young adults managing personal finances through conversational AI. PolyAI, an enterprise conversational
    AI company, raised a Series C from Khosla Ventures and counts major global enterprises among its customer base for AI
    voice agents. Gensyn, an a16z-backed decentralized AI compute infrastructure company, is developing technology that allows
    developers to run AI training on distributed hardware networks. The broader EF portfolio of 600+ companies, while not
    individually tracked publicly, represents a diverse set of downstream traction signals across sectors including healthcare
    AI, fintech, logistics software, climate tech, and enterprise SaaS.
