company:
  name: Entrepreneurs First
chapter:
  number: 6
  title: Customers and Traction
  summary: >
    Entrepreneurs First has two distinct customer groups: (1) individual founders who apply to and participate in its programs,
    and (2) downstream institutional investors who back companies EF creates. EF's founder customer base has historically
    attracted PhD researchers, AI engineers from DeepMind and Google Brain, and top-tier software engineers from companies
    including Stripe, Meta, and Goldman Sachs. The demand signal is robust — 17,000 applications per 18-month period as of
    mid-2022 — though this figure has not been updated publicly. Portfolio company traction spans Tractable ($1B+ valuation,
    deployed globally in insurance), Cleo (7M+ users), and PolyAI (serving enterprise voice AI customers). These portfolio
    companies serve as the primary external demand validation for EF's talent investor model.
sections:
- id: founder-customers
  title: Founder Customers — Profile, Pipeline, and Demand Signals
  body: >
    EF's primary "customers" are the exceptional individuals it selects for its FORM and LAUNCH programs. EF's target founder
    profile is explicit: the firm describes seeking candidates who are at the "1 in 500" level of talent in their domain,
    typically in the first 6–7 years of their career, with deep technical skills in AI, deep tech, or engineering. In practice,
    the EF cohort composition skews toward PhDs, AI researchers from labs including DeepMind, OpenAI, and Google Brain, engineers
    from Tier 1 technology companies (Google, Meta, Stripe, Jane Street, Goldman Sachs), and mathematically exceptional individuals
    identified through national competition pathways (UK Mathematical Olympiad, Putnam, Physics Olympiad). The EF program
    is equity-free for the FORM phase: participants do not pay to attend and EF only takes equity if a company is formed and
    funded. This "free-to-try" model is unusual in the accelerator industry and reduces the risk threshold for high-quality
    candidates who might otherwise be deterred by equity dilution upfront. The stated demand signal is 17,000 applications
    per 18-month period as of mid-2022, from which EF admitted approximately 500–600 individuals (a ~3–5% acceptance rate).
    The quality of the applicant pool is directionally supported by the caliber of EF's notable alumni — Barney Hussey-Yeo
    (Cleo), Alex Dalyac (Tractable), Nikola Mrkšić (PolyAI) — who went on to build billion-dollar companies. The global Bay
    Area expansion since 2024 has further qualified the applicant pool: candidates who apply for a San Francisco-mandatory
    program have pre-selected for founder ambition and geographic mobility, two traits correlated with startup success.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU023
  - CU024
