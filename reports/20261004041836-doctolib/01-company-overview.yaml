  title: "Company Overview"
  summary: "Doctolib is Europe's leading healthcare workflow and booking SaaS platform, generating €348 million in 2024 ARR across 300,000 medical professionals while navigating antitrust fines and an upcoming public listing window."
sections:
  - id: "sec-identity-product"
    title: "Corporate Identity, Platform Footprint, and Business Model"
    body: "Founded in 2013 and headquartered in the Paris metropolitan area (Levallois-Perret), France, Doctolib has evolved from a medical appointment booking portal into a comprehensive digital operating system for European healthcare professionals. Operating primarily across France, Germany, and Italy, the platform combines consumer-facing appointment discovery with subscription-based provider practice management software. Unlike consumer-monetized digital platforms, Doctolib generates approximately 99% of its revenue directly from healthcare professionals through monthly SaaS subscriptions starting at €129 per month. The company maintains an explicit policy against monetizing patient medical records or selling advertising, positioning itself as a sovereign, trusted utility for healthcare actors. Across its core European territories, Doctolib connects more than 300,000 subscribing practitioners and hospital teams with over 80 million patient users, processing administrative workflows, appointments, teleconsultations, and medical record exchanges across urban and rural care networks."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO012"
    tableRefs:
      - "TO001"
  - id: "sec-leadership-governance"
    title: "Founders, Leadership Structure, and Key-Person Risk"
    body: "Doctolib was co-founded and continues to be guided by Chief Executive Officer Stanislas Niox-Chateau, who serves as the central strategic architect and primary institutional representative of the company. Executive governance is reinforced by long-tenured leaders including France Managing Director Arthur Thirion, Chief Financial Officer Pierre Vergnes, and operational leadership across product, engineering, and revenue generation. The leadership structure reflects a mission-driven governance ethos, formalized through B Corp certification and a dedicated Mission Committee tasked with overseeing social and public health impact. In January 2022, Doctolib expanded long-term employee ownership by granting a minimum of €20,000 in equity value to all employees under its DoctoGrowth value-sharing plan. However, key-person risk remains concentrated in Niox-Chateau, whose public reputation and political relationships across French healthcare and ministerial bodies have been vital in securing national infrastructure roles such as the COVID-19 vaccination campaign."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO001"
    tableRefs:
      - "TO002"
  - id: "sec-capital-valuation"
    title: "Financing History, Investor Governance, and Capital Structure"
    body: "Across ten private financing rounds since inception, Doctolib has raised approximately $1.2 billion in total equity and debt capital to fund platform development, national market rollouts, and defensive M&A. The company achieved unicorn status in 2019 and reached a peak valuation of €5.8 billion ($6.4 billion) in March 2022 upon closing a $549 million (€500 million) Series G funding round. That financing was led by French private equity firm Eurazeo, alongside prominent continuing participation from French sovereign fund Bpifrance and global growth investor General Atlantic. Doctolib reported fiscal year 2024 Annual Recurring Revenue of €348 million, reflecting 22.5% year-on-year growth, alongside an adjusted EBITDA loss of -€53.8 million that narrowed significantly from -€87.1 million in 2023. While management has targeted operational breakeven for 2025 and is evaluating potential IPO timing between late 2026 and 2027, private secondary transactions indicate valuation recalibration toward ~€3.6 billion, and audited 2025 financial disclosures remain closely guarded."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO003"
  - id: "sec-milestones-adverse"
    title: "Operational Milestones, Regulatory Overhangs, and Expansion Trajectory"
    body: "Doctolib's trajectory over the past decade reflects aggressive product diversification punctuated by targeted acquisitions and increasing regulatory friction. Key strategic milestones include the 2021 nationwide mobilization for France's vaccination rollout, the 2022 acquisition of encryption specialist Tanker to secure end-to-end messaging, and the 2023 purchase of Dutch communication app Siilo to establish a Benelux provider hub. In June 2024, Doctolib acquired Swiss speech-recognition startup Typeless, using its technology as the core engine for its Consultation Assistant ambient AI clinical documentation tool. Concurrently, the platform faces mounting regulatory scrutiny: on November 6, 2025, France's Autorité de la concurrence levied a €4.665 million fine against Doctolib for software bundling and exclusivity provisions, sparking follow-on complaints from legacy medical software competitors. Furthermore, planned geographic expansion into the United Kingdom via the acquisition of NHS-native software provider Medicus exposes the company to stringent NHS procurement cycles and potential capital burn."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
    figureRefs:
      - "FO001"
