    title: "Operating Leverage Driven by Pure-Play Subscription Revenue Model"
    body: "With 99% of revenue deriving from predictable recurring subscriptions paid by healthcare professionals, Doctolib benefits from strong cash flow visibility and insulation from transaction volume swings. However, achieving enterprise profitability requires maintaining strict sales efficiency and controlling R&D intensity as it scales into Germany and Italy."
