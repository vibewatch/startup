  topStrengths:
    - Large and sticky European healthcare workflow footprint with strong practitioner adoption.
    - Recurring subscription model with improving ARR growth and narrowing EBITDA losses.
    - Clear product expansion path from booking into clinical workflow, messaging, and AI-assisted documentation.
  topRisks:
    - Audited 2025 financials, debt covenants, and secondary terms remain undisclosed.
    - Regulatory and antitrust scrutiny continues to create execution and pricing risk.
    - Historical valuation marks still imply a stretched multiple versus more recent secondary indications.
  unresolvedGaps:
    - Audited 2025 revenue, EBITDA, cash, and debt disclosures remain unavailable.
    - The 2022 debt quantum, financing covenants, and liquidation-preference terms are still not public.
    - Country-level retention, churn, NRR, realized pricing, and module attach rates remain undisclosed.
    - >-
      France appeal and remedy scenarios still need sensitivity analysis tied to teleconsultation and workflow attach
      economics.
    - >-
      Public disclosures still do not reconcile the broader user base with paying practitioner counts in a way that
      cleanly supports underwriting.
