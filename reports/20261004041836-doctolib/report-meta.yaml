companyProfile:
  summary: >-
    Doctolib is a Paris-based European healthcare workflow company founded in 2013 that connects patients and healthcare
    professionals through booking, teleconsultation, messaging, and clinical software. The company monetizes primarily
    through recurring subscriptions paid by practitioners and care teams, has scaled to hundreds of thousands of
    professional users across France, Germany, and Italy, and continues to expand into more workflow modules and
    AI-assisted documentation.
  foundedDate: '2013-01-01'
