callouts:
  - calloutType: "insight"
    title: "Scale does not equal paid retention"
    body: "The strongest independent source explicitly says that not all of the 300,000 healthcare workers reported in 2022 paid a monthly subscription. Patient, network-professional, employee, and paying-account counts should therefore remain separate."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU009"
      - "CU014"
  - calloutType: "risk"
    title: "Continuity and concentration remain unpriced"
    body: "Official terms permit service discontinuation with fifteen days' notice, while the assigned evidence does not disclose renewal, churn, top-customer, channel, or country concentration metrics."
    claimRefs:
      - "CU013"
