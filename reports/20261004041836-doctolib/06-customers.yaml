company:
  name: "Doctolib"
chapter:
  number: 6
  title: "Customers"
  summary: "Doctolib has documented scale across professional and patient cohorts, but the strongest current counts come from supplier or low-reputation analyst material rather than audited customer disclosures. Historical reporting confirms daily practitioner use and public-hospital reach, while named-provider references, retention, and concentration remain material diligence gaps."
sections:
  - id: "segments-and-payer-boundaries"
    title: "Segments and payer boundaries"
    body: >-
      The evidence supports a two-sided user map, but not a complete current payer map.
      Patients create demand through appointment discovery and booking, while healthcare
      professionals use scheduling and broader workflow tools. A supplier case study places
      those professionals in hospitals, clinics, and nursing homes across France, Germany,
      Italy, and the Netherlands. Doctolib's Connect terms add an important product boundary:
      the professional communications services are restricted to healthcare actors, Messenger
      and Webchat are free, and paid Connect or Prisma terms are negotiated separately. This
      distinguishes users from payers without assuming that every professional in headline
      counts is a paying subscriber.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory"
    title: "Adoption trajectory and metric comparability"
    body: >-
      Independent reporting shows clear historical expansion: 5,000 doctors used the platform
      daily in 2015, alongside roughly 100 clinics and two million monthly unique visitors.
      By 2022, TechCrunch reported 60 million people had used Doctolib in three countries,
      300,000 healthcare workers were using it, and the company worked with 250 public
      hospitals. Later scale claims are less comparable. A Coalesce supplier story reports
      more than 400,000 professionals and 80 million patients, while a 2026 analyst article
      reports 900,000 professionals across the network and the same patient count. These
      measures use different labels, dates, populations, and denominators and should not be
      treated as a single conversion funnel or a clean paid-customer time series.
    claimRefs:
      - "CU002"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
  - id: "customer-proof-and-durability"
    title: "Customer proof and durability"
    body: >-
      The retained evidence demonstrates aggregate production use but weak named-customer
      proof. Daily use by doctors in 2015 is stronger than a logo because it identifies an
      operating behavior, and the 2022 public-hospital count indicates institutional reach.
      However, none of the retained sources identifies an individual provider organization
      and documents its deployment scope, outcome, and renewal. The pool also contains no
      supportable NRR, GRR, churn, renewal-rate, cohort, satisfaction, or contract-length
      measure. Consequently, workflow use and network size are evidence of adoption, not
      evidence of retention, commercial durability, or expansion within cohorts.
    claimRefs:
      - "CU004"
      - "CU007"
      - "CU008"
      - "CU016"
    tableRefs:
      - "TU003"
  - id: "expansion-and-concentration"
    title: "Expansion signals and concentration risk"
    body: >-
      Geographic expansion is visible but economically under-disclosed. A low-reputation 2026
      analyst article attributes 17% to 20% of total ARR and 28% of first-quarter 2025 new
      revenue to Germany, which is directionally useful but not independently corroborated.
      A LeadIQ estimate of roughly 3,700 employees and a company-issued Berlin engineering job
      repost are operating-footprint signals, not customer evidence. Doctolib's terms also
      permit service discontinuation with fifteen days' notice, creating continuity exposure
      for embedded users. No retained source quantifies top-customer, country, channel, or
      hospital concentration, so expansion quality and dependency risk remain open.
    claimRefs:
      - "CU010"
      - "CU013"
      - "CU014"
      - "CU015"
    figureRefs:
      - "FU001"
