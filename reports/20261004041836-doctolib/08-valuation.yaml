chapter:
  number: 8
  title: "Valuation"
  summary: "Doctolib demonstrates scaled European healthcare SaaS workflow reach with €348.0M ARR in 2024 growing 22.5% YoY, but its unanchored headline historical marks of $6.4B to $6.5B and recent secondary transactions reflect significant multiple compression and valuation tension. With management targeting 2025 adjusted EBITDA breakeven while navigating debt and capital-structure opacity, an investment stance of research-more with medium confidence and stretched valuation stance is warranted."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Core Investment Thesis and Anti-Thesis"
    body: "Doctolib operates as an essential workflow infrastructure and appointment management network across France, Germany, and Italy, serving over 300,000 healthcare professionals and managing deep clinical touchpoints. The affirmative core investment thesis rests on its transition from a pure medical appointment booking engine into a comprehensive clinical operating system that unifies scheduling, patient records via Doctolib Médecin, and secure team messaging. The recurring subscription model delivers high revenue predictability, with 99% of top-line revenue generated through practitioner SaaS subscriptions, while operational scale has driven narrowing adjusted EBITDA losses from -€87.1M in 2023 to -€53.8M in 2024. Conversely, the anti-thesis highlights persistent valuation overhangs and multiple compression across European private tech. With historical Series F and Series G rounds pricing the company at $6.4B to $6.5B, the implied enterprise valuation has faced secondary market recalibration down toward flat or discounted territory, as tracked in private market transactions such as Caplight secondary prints in April 2026. Furthermore, significant capital structure opacity persists, as exact covenants and liquidation preferences tied to the 2022 conventional debt round remain unverified."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV002"
  - id: "recommendation-and-valuation-context"
    title: "Recommendation Stance, Multiples, and Financing Context"
    body: "Evaluating Doctolib across late-stage private software marks requires rigorous entry discipline. Based on the documented Series F round in March 2022, Doctolib raised $549M to $554M at a headline valuation of $6.4B, which represented an aggressive 16.0x multiple on its then-recorded $400M revenue run-rate. While third-party aggregate metrics vary widely—with Tracxn reporting $866M raised across 10 rounds including a conventional debt facility, Forge Global citing $825.7M total funding, Multiples VC noting $818M, and LeadIQ estimating cumulative financing up to $1.2B—no audited financial statements for 2025 revenue, gross margin, cash balances, or debt service have been publicly disclosed. Caplight tracks comparable European healthcare software vendors including DocPlanner, Cegedim, and Groupe NEHS, indicating that public and private market multiples have recalibrated toward single-digit revenue multiples. Consequently, we maintain a research-more recommendation with medium confidence, a high risk rating, and a stretched valuation stance. A formal buy recommendation remains premature until audited 2025 operating profitability and debt instruments are reconciled."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV011"
      - "CV012"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "scenario-modeling-and-diligence-path"
    title: "Scenario Analysis, Exit Readiness, and Thesis-Break Triggers"
    body: "To model enterprise value outcomes ahead of an anticipated late 2026 or 2027 IPO window, we project three distinct operational scenarios. In the bull case, Doctolib achieves management's forecast of exceeding €420.0M ARR in 2025, turns EBITDA positive, successfully rolls out ambient AI clinical transcription modules, and secures an IPO valuation between $6.0B and $8.0B at a 12x to 15x multiple. In the base case, revenue grows at a moderate 20% to 22% rate, reaching approximately €415M ARR with modest EBITDA breakeven, resulting in a public or secondary valuation range of $4.0B to $5.5B at an 8x to 11x multiple. In the bear case, regulatory scrutiny under the EU AI Act, competitive incursions from specialized ambient voice solutions, and macroeconomic multiple compression drive revenue deceleration below 15%, leaving valuation discounted at $2.5B to $3.5B at a 5x to 7x multiple. Key thesis-break triggers include any renewal failure or regulatory sanctions under healthcare compliance rules, inability to verify debt covenants, or prolonged adjusted EBITDA losses past fiscal 2025."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
