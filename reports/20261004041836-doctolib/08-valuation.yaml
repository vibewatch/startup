callouts:
  - calloutType: "insight"
    title: "Valuation Anchor vs Secondary Market Realities"
    body: "While Doctolib achieved a peak valuation mark of €5.8B ($6.4B) during its March 2022 Series F round, private secondary trades tracked on Caplight and industry comparables indicate that software multiples have adjusted downwards. Investors evaluating entry points must decouple headline historical round valuations from forward enterprise cash-generation capability."
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV007"
      - "CV011"
  - calloutType: "risk"
    title: "Capital Structure and Debt Covenant Opacity"
    body: "The incorporation of conventional debt alongside equity in the March 2022 funding package introduces senior creditor claims and potential liquidation preference overhangs. Without full visibility into debt maturity dates, interest covenants, and conversion terms, common equity and junior secondary buyers carry unquantified structural risk."
    claimRefs:
      - "CV003"
      - "CV008"
      - "CV012"
      - "CV015"
