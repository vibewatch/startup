company:
  name: "Doctolib"
chapter:
  number: 7
  title: "Risks"
  summary: "Doctolib's clearest evidenced downside is regulatory: French competition enforcement has already reached a below-threshold acquisition, while the company's own terms expose ongoing health-data, identity-verification, and service-continuity obligations. Financial and execution risk remain harder to size because public sources mix historical ARR, an unaudited revenue estimate, and a 2022 equity-and-debt financing without current audited cash, debt, or covenant disclosure."
sections:
  - id: "ranked-risk-view"
    title: "Ranked risk view and investment implication"
    body: >-
      Antitrust exposure ranks first because a 2026 legal analysis reports an actual French
      enforcement decision against a Doctolib acquisition, not merely a hypothetical sector
      concern [CR001]. The same analysis says structural remedies can include separation or
      divestment, making future close-competitor acquisitions a high-impact pathway even though
      the cited €50,000 fine was described as symbolic [CR002]. Health-data governance and
      service continuity rank next: Doctolib's terms reserve emergency change rights and place
      specific verification and lawful-sharing duties around sensitive data [CR004][CR005][CR006].
      Financial/model risk is material but less measurable. The available pool contains a 2024
      ARR figure, an adjusted EBITDA loss, and a separate 2026 revenue estimate; these are not
      interchangeable and do not establish current cash burn or liquidity [CR010][CR011][CR013].
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR010"
      - "CR011"
      - "CR013"
    figureRefs:
      - "FR001"
  - id: "regulatory-and-legal"
    title: "Regulatory and legal exposure"
    body: >-
      The French competition precedent directly constrains a buy-and-build strategy. Mayer
      Brown's analysis says the FCA treated the below-threshold acquisition of a close rival as
      abuse of dominance and relied heavily on employee exchanges and consultant reports when
      assessing exclusionary intent [CR001][CR003]. That raises both transaction-screening and
      document-governance risk. Separately, Doctolib's Connect terms show that compliance is an
      operating process: the company may shorten its normal notice period for urgent legal or
      cybersecurity changes, may use a specialized provider and official databases to verify
      identity and practice rights, and assigns users responsibility for lawful health-data
      sharing [CR004][CR005][CR006]. The evidence does not establish whether current controls,
      certifications, or regulator commitments are sufficient, so those items remain diligence
      asks rather than inferred mitigations.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
    tableRefs:
      - "TR001"
  - id: "operational-quality-and-security"
    title: "Operational, quality, and security exposure"
    body: >-
      The public evidence supports a dependency on reliable support and engineering capacity,
      but it does not provide an outage history, availability denominator, recovery-time record,
      or security-incident register. Doctolib's terms permit discontinuation of the Connect app
      or services with fifteen days' notice, which defines contractual continuity exposure but
      is not evidence that discontinuation is planned [CR007]. A third-party interview guide
      describes customer-success engineers as the primary technical interface for complex
      platform issues and setups, while a company-issued LinkedIn job repost names a senior
      full-stack Kotlin/React opening in Berlin [CR014][CR015]. Those are operating-capacity
      signals, not proof of service quality. International execution adds another layer because
      an independent outlook characterizes Germany as producing significant results while Italy
      remains in a learning phase [CR012].
    claimRefs:
      - "CR007"
      - "CR012"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR002"
  - id: "dependencies-financial-risk-and-kill-criteria"
    title: "Dependencies, financial risk, and kill criteria"
    body: >-
      Doctolib depends on regulated health systems, verification infrastructure, technical
      personnel, and continued access to capital. The 2022 financing combined equity and debt,
      but the assigned evidence does not disclose the debt quantum, covenants, current cash, or
      liquidation preferences [CR008]. A 2024 ARR claim of €348 million and adjusted EBITDA loss
      of €53.8 million cannot be reconciled from this pool with LeadIQ's separate $100 million to
      $250 million annual-revenue estimate; ARR is not accounting revenue, and neither figure is
      audited here [CR010][CR011][CR013]. Monitorable thesis-break triggers are therefore
      evidence-based but prospective: an adverse appeal or new remedy in the competition matter,
      repeated material outages, failed identity or health-data controls, deterioration rather
      than improvement from the cited 2024 loss, or financing terms that subordinate new common
      investors. Any investment decision should require primary regulatory records, audited
      accounts, and customer/partner concentration data before treating those triggers as cleared.
    claimRefs:
      - "CR002"
      - "CR005"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR013"
      - "CR016"
    tableRefs:
      - "TR003"
