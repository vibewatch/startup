      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The French competition precedent directly constrains a buy-and-build strategy. Mayer Brown's analysis says
              the FCA treated the below-threshold acquisition of a close rival as abuse of dominance and relied heavily
              on employee exchanges and consultant reports when assessing exclusionary intent [CR001][CR003]. That
              raises both transaction-screening and document-governance risk. Separately, Doctolib's Connect terms show
              that compliance is an operating process: the company may shorten its normal notice period for urgent legal
              or cybersecurity changes, may use a specialized provider and official databases to verify identity and
              practice rights, and assigns users responsibility for lawful health-data sharing [CR004][CR005][CR006].
              The evidence does not establish whether current controls, certifications, or regulator commitments are
              sufficient, so those items remain diligence asks rather than inferred mitigations.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
