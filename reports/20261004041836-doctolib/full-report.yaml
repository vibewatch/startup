        - High for affected professional workflows
        - Contractual notice only; technical migration controls are undisclosed
        - Fifteen-day notice may be insufficient for continuity planning
        - Product-level termination history, export tooling, and customer migration SLA
      - - Complex client issues exceed customer-success capacity
        - Medium
        - Medium to high
        - Role coverage is visible; staffing, backlog, and resolution performance are not
        - Slow issue resolution could impair healthcare-practice workflows
        - Ticket volume, severity mix, first-response time, resolution time, and escalation rate
      - - Engineering execution cannot keep pace with platform complexity
        - Medium
        - High
        - A Berlin senior full-stack job repost is a staffing signal, not a delivered mitigation
        - Hiring gaps or integration debt could slow reliability and product delivery
        - Vacancy aging, attrition, deployment failure rate, incident ownership, and architecture roadmap
      - - International rollout underperforms outside the strongest market
        - Medium
        - High
