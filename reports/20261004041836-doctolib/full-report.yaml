      - number: '6.4'
        title: Expansion signals and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Geographic expansion is visible but economically under-disclosed. A low-reputation 2026 analyst article
              attributes 17% to 20% of total ARR and 28% of first-quarter 2025 new revenue to Germany, which is
              directionally useful but not independently corroborated. A LeadIQ estimate of roughly 3,700 employees and
              a company-issued Berlin engineering job repost are operating-footprint signals, not customer evidence.
              Doctolib's terms also permit service discontinuation with fifteen days' notice, creating continuity
              exposure for embedded users. No retained source quantifies top-customer, country, channel, or hospital
              concentration, so expansion quality and dependency risk remain open.
            claimRefs:
              - CU010
              - CU013
              - CU014
              - CU015
