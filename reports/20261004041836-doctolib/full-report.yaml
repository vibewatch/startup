  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Clinical Operating Model
        blocks:
          - type: paragraph
            body: >-
              Doctolib structures its product surface as an integrated dual-sided operating system serving both
              healthcare professionals and patient populations across Europe. For medical practitioners, the suite spans
              core practice efficiency modules—such as continuous 24/7 online appointment scheduling, calendar
              optimization, automated appointment reminders, and patient recall workflows—and clinical electronic health
              record (EHR) functions through Doctolib Médecin. Clinical capabilities include structured consultation
              documentation, prescription generation, diagnostic support, and billing management. For healthcare
              collaboration, the platform provides Doctolib Team and Doctolib Connect Messenger, which integrate secure
              instant messaging and document exchange for clinical care cooperation. For patients, Doctolib functions as
              a digital health companion, providing localized directory discovery across 120+ specialties, video
              teleconsultation, booking management, and preventative care tracking.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
