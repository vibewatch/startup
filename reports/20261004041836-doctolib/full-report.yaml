      - number: '2.3'
        title: Buyer Segmentation, Workflow Integration, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Doctolib's customer base is segmented into three distinct buyer tiers: solo medical practitioners (general
              practitioners and specialists), multi-practitioner group practices or private clinics, and large regional
              public hospital networks such as the Public Hospitals of Paris (AP-HP). For solo practitioners and small
              medical cabinets, the purchasing decision and budget ownership rest directly with the licensed physician,
              driven by the operational imperative to reduce administrative telephone triage, minimize appointment
              no-show rates from 10% down to 2.5%, and secure practitioner verification under national healthcare
              registries. In hospital networks and integrated clinics, budget ownership shifts to institutional IT
              procurement, hospital executive directors, and medical boards requiring enterprise-level data compliance,
              end-to-end encryption standards, and interoperable clinical messaging suites like Doctolib Connect and
              Doctolib Team.
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM004
              - CM010
              - CM011
      - number: '2.4'
        title: Growth Catalysts, Regulatory Governance, and Structural Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The primary catalysts propelling European healthtech adoption include acute clinical workforce
              shortages—highlighted by a global deficit of 11 million healthcare workers—which necessitate
              productivity-enhancing workflow automation such as ambient AI scribes and automated voice triage. However,
              structural constraints temper market expansion. Post-pandemic teleconsultation adoption plateaued from
              pandemic highs of 17% of medical visits down to a stabilized hybrid baseline of 4% to 6%, disproving
              aggressive pure-telehealth forecasts. Furthermore, regulatory compliance hurdles under the European Union
              AI Act and strict national health data hosting regulations elevate ongoing operational overhead and
              product liability for high-risk clinical software, limiting swift cross-border deployment across
              unharmonized European jurisdictions.
            claimRefs:
              - CM005
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: SaaS Expansion Against Macro Multiple Compression
            body: >-
              Between 2022 and 2026, Doctolib expanded its top-line annual recurring revenue from approximately €270
              million to €422 million (+56%), yet saw its cleared secondary market valuation contract by 40% from €5.8
              billion to €3.6 billion. This divergence highlights how European healthtech valuation has transitioned
              from speculative venture multiples exceeding 20x ARR to disciplined, utility-like multiples of
              approximately 8.5x ARR.
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
          - type: callout
            title: Stabilization of Telemedicine Demand and Hybrid Care Realities
            body: >-
              During the peak of the COVID-19 pandemic, teleconsultations surged to 17% of all medical visits, fostering
              inflated market sizing expectations for digital-first healthcare delivery. By 2026, remote consultation
              rates normalized to a durable hybrid baseline of 4% to 6%, requiring healthcare software providers to
              anchor valuation models on core practice workflow automation and ambient clinical efficiency rather than
              pure telehealth visit monetization.
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview and Peer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The competitive arena surrounding Doctolib spans five distinct operational vectors rather than a single
              monolithic competitor category: pan-European appointment networks (such as DocPlanner/ZnanyLekarz), legacy
              on-premise Electronic Health Record (EHR) and practice management vendors (such as CGM/CompuGroup
              Medical), localized telemedicine and regional scheduling platforms (such as Dottori in Italy prior to its
              acquisition, and TeleMed, Tele2Doctor, or eMedicine in emerging regions like the Baltics), horizontal
              scheduling alternatives (such as Calendly, Acuity Scheduling, or Setmore), and next-generation clinical AI
              point solutions (such as Nabla, Aaron.ai, or Abridge). In its core French and German healthcare markets,
              Doctolib maintains commanding visibility across outpatient primary care and specialist practices. However,
              as medical software requirements shift from basic appointment booking toward comprehensive practice
              operating systems, competition increasingly hinges on clinical documentation depth, seamless local
              insurance and billing integration, and automated patient communication workflows.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP007
              - CP009
      - number: '3.2'
        title: Competitor Profiles, Capability Benchmarks, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Evaluating direct and adjacent competitors reveals marked structural divergences in product breadth,
              regulatory compliance, and geographic concentration. Regional incumbents like DocPlanner dominate Central
              and Eastern Europe with extensive patient directories and booking tools, but historically possessed
              narrower inpatient EHR capabilities compared to Doctolib's enterprise hospital deployments across 250
              public centers. In contrast, legacy enterprise healthcare IT providers like CompuGroup Medical (CGM)
              command deep institutional lock-in through certified local billing and clinical charting modules, yet
              suffer from legacy user interfaces and fragmented cloud accessibility. Horizontal appointment platforms
              evaluated by software buyers—including Acuity Scheduling, Setmore, and Zoho Bookings—provide low-cost,
              self-serve calendar management but entirely lack European medical device certifications, health data
              hosting (HDS) compliance, and specialized EHR interoperability. Concurrently, specialized clinical AI
              startups like Nabla and Abridge threaten to decouple ambient clinical documentation from traditional
              practice management suites by offering standalone transcription and EHR-agnostic note generation.
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
