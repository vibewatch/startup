      - number: '6.2'
        title: Adoption trajectory and metric comparability
        blocks:
          - type: paragraph
            body: >-
              Independent reporting shows clear historical expansion: 5,000 doctors used the platform daily in 2015,
              alongside roughly 100 clinics and two million monthly unique visitors. By 2022, TechCrunch reported 60
              million people had used Doctolib in three countries, 300,000 healthcare workers were using it, and the
              company worked with 250 public hospitals. Later scale claims are less comparable. A Coalesce supplier
              story reports more than 400,000 professionals and 80 million patients, while a 2026 analyst article
              reports 900,000 professionals across the network and the same patient count. These measures use different
              labels, dates, populations, and denominators and should not be treated as a single conversion funnel or a
              clean paid-customer time series.
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
