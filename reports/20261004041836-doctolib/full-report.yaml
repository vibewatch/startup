      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale does not equal paid retention
            body: >-
              The strongest independent source explicitly says that not all of the 300,000 healthcare workers reported
              in 2022 paid a monthly subscription. Patient, network-professional, employee, and paying-account counts
              should therefore remain separate.
            calloutType: insight
            claimRefs:
              - CU006
              - CU007
              - CU009
              - CU014
          - type: callout
            title: Continuity and concentration remain unpriced
            body: >-
              Official terms permit service discontinuation with fifteen days' notice, while the assigned evidence does
              not disclose renewal, churn, top-customer, channel, or country concentration metrics.
            calloutType: risk
            claimRefs:
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view and investment implication
        blocks:
          - type: paragraph
            body: >-
              Antitrust exposure ranks first because a 2026 legal analysis reports an actual French enforcement decision
              against a Doctolib acquisition, not merely a hypothetical sector concern [CR001]. The same analysis says
              structural remedies can include separation or divestment, making future close-competitor acquisitions a
              high-impact pathway even though the cited €50,000 fine was described as symbolic [CR002]. Health-data
              governance and service continuity rank next: Doctolib's terms reserve emergency change rights and place
              specific verification and lawful-sharing duties around sensitive data [CR004][CR005][CR006].
              Financial/model risk is material but less measurable. The available pool contains a 2024 ARR figure, an
              adjusted EBITDA loss, and a separate 2026 revenue estimate; these are not interchangeable and do not
              establish current cash burn or liquidity [CR010][CR011][CR013].
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR010
              - CR011
              - CR013
          - type: figure
