      - number: '7.3'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a dependency on reliable support and engineering capacity, but it does not
              provide an outage history, availability denominator, recovery-time record, or security-incident register.
              Doctolib's terms permit discontinuation of the Connect app or services with fifteen days' notice, which
              defines contractual continuity exposure but is not evidence that discontinuation is planned [CR007]. A
              third-party interview guide describes customer-success engineers as the primary technical interface for
              complex platform issues and setups, while a company-issued LinkedIn job repost names a senior full-stack
              Kotlin/React opening in Berlin [CR014][CR015]. Those are operating-capacity signals, not proof of service
              quality. International execution adds another layer because an independent outlook characterizes Germany
              as producing significant results while Italy remains in a learning phase [CR012].
            claimRefs:
              - CR007
              - CR012
              - CR014
              - CR015
          - type: table
