      - number: '5.2'
        title: Platform Architecture, Data Infrastructure, and Developer Experience
        blocks:
          - type: paragraph
            body: >-
              The core technical architecture of Doctolib is built on a single, cloud-native distributed platform
              supporting web and mobile applications across multiple languages and national healthcare regulatory
              jurisdictions. Historically developed as a Ruby on Rails monolith, the engineering organization deploys
              daily while managing high concurrency that reaches up to 350,000 requests per minute with an internal
              response time target under 70 milliseconds. The frontend architecture relies on React and TypeScript,
              supported by Java and Ruby on Rails backend services. To accelerate delivery velocity and reduce developer
              cognitive load across 900+ technical personnel, Doctolib has invested heavily in automated developer
              tooling. Specifically, the team embedded Anthropic's Claude Code into its engineering continuous
              integration workflows to automate pull request reviews, migrate legacy visual regression test suites in
              hours rather than weeks, and maintain technical documentation continuously with each code commit.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
