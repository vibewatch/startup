      - number: '4.2'
        title: GTM Motion, Cost Structure, and Margin Trajectory
        blocks:
          - type: paragraph
            body: >-
              Doctolib's go-to-market motion relies on localized field sales teams stationed across more than 30 major
              and mid-sized European cities to drive direct engagement with independent medical practices and hospital
              procurement committees. This direct-sales intensity has historically driven significant operational
              expenditure, but expanding platform scale has facilitated meaningful operating leverage. In fiscal year
              2024, Doctolib reported an Annual Recurring Revenue (ARR) of €348.0 million, representing a 22.5% increase
              over €284.1 million in 2023, while adjusted EBITDA losses narrowed by 38% from -€87.1 million to -€53.8
              million. Management has targeted enterprise-wide adjusted EBITDA breakeven alongside gross margins
              expanding from 60% in 2023 to 65% in 2024 and surpassing 70% in forward periods. To sustain product
              leadership in clinical automation and generative AI consultation assistants, Doctolib maintains an
              intensive research and development posture, deploying €115 million into R&D in 2024 (equivalent to 33% of
              revenue) following approximately €90 million (31% of revenue) in 2023. These investments support workforce
              scaling toward 3,500+ full-time equivalents while engineering teams build compliance-heavy integrations
              for national electronic patient records and clinical AI workflows.
            claimRefs:
              - CI002
              - CI004
              - CI005
              - CI006
              - CI007
              - CI012
          - type: table
            tableRef: TI003
