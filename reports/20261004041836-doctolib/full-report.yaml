      - number: '4.3'
        title: Capital Adequacy, Valuation, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              From a capital structure perspective, Doctolib has accumulated substantial equity and debt financing,
              securing over $800M to $866M in cumulative capital across ten funding rounds from institutional sponsors
              including Eurazeo, Bpifrance, and General Atlantic. Its primary Series G financing round in March 2022
              raised $549 million (€500 million) in combined equity and debt at a peak post-money valuation of €5.8
              billion ($6.4 billion). In 2026, secondary transactions reportedly priced Doctolib at an implied valuation
              of €3.6 billion, representing an approximate 38% contraction from 2022 levels. Industry analyses attribute
              this valuation adjustment to macro SaaS multiple compression—shifting valuation multiples from over 20x
              ARR during 2022 tech euphoria to sub-10x multiples—combined with secondary market illiquidity discounts
              where long-term sovereign and growth investors such as ATHOS, A.P. Moller Holding, and Generation
              Investment Management acquired secondary equity. However, significant diligence blockers persist: audited
              2025 financial statements, precise debt covenants, net debt quantum, and country-level net revenue
              retention (NRR) schedules remain undisclosed, preventing definitive underwriting of independent cash
              runway and return on invested capital.
            claimRefs:
