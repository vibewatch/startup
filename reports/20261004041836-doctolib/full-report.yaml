              - CE005
              - CE007
              - CE009
              - CE013
      - number: '5.3'
        title: Artificial Intelligence Roadmap, Security Controls, and Governance Boundaries
        blocks:
          - type: paragraph
            body: >-
              Doctolib has positioned generative and ambient artificial intelligence as central to its clinical
              operating roadmap, aiming to reduce documentation burdens for care teams. Following the acquisition of
              Swiss speech-recognition startup Typeless, Doctolib introduced its AI Consultation Assistant, an ambient
              scribe tool that transcribes clinical dialogue into structured consultation notes and medical letters,
              supporting over 5 million consultations across its network. The company is also rolling out automated
              telephone assistants based on Aaron.ai technology to manage inbound clinic calls outside operating hours.
              However, this aggressive AI expansion introduces compliance and trust trade-offs: in August 2026,
              healthcare evaluators identified that Doctolib automatically enrolled patient medical histories into
              clinical AI research programs with public institutes like Inria and Inserm unless patients actively opted
              out. On the security and confidentiality front, Doctolib maintains end-to-end encryption for sensitive
              health exchanges using Tanker technology and holds ISO 27001, ISO 27701, BSI C5, and French HDS
              certifications.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Pivot from Directory Utility to Clinical Workflow Monolith
            body: >-
              Doctolib's technical moat no longer resides in its patient booking portal, which has become a commodity
              interface, but in its deep embedding within medical practice workflows. By integrating electronic health
              records, ambient AI transcription, and encrypted practitioner messaging into its core platform, Doctolib
              increases doctor switching costs while aggregating proprietary clinical datasets across 90 million patient
              records.
            calloutType: insight
            claimRefs:
              - CE001
              - CE005
              - CE009
          - type: callout
            title: Data Governance and Regulatory Headwinds Under EU AI Governance
            body: >-
              The rollout of generative AI models trained on patient medical histories under opt-out governance creates
              acute regulatory and reputational vulnerabilities under GDPR and the EU AI Act. Default inclusion of
              patient histories without explicit pre-consultation consent exposes the company to potential
              administrative inquiries by data protection authorities such as CNIL and BfDI.
            calloutType: risk
            claimRefs:
              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segments and payer boundaries
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a two-sided user map, but not a complete current payer map. Patients create demand
              through appointment discovery and booking, while healthcare professionals use scheduling and broader
              workflow tools. A supplier case study places those professionals in hospitals, clinics, and nursing homes
              across France, Germany, Italy, and the Netherlands. Doctolib's Connect terms add an important product
              boundary: the professional communications services are restricted to healthcare actors, Messenger and
              Webchat are free, and paid Connect or Prisma terms are negotiated separately. This distinguishes users
              from payers without assuming that every professional in headline counts is a paying subscriber.
            claimRefs:
              - CU002
              - CU003
              - CU011
              - CU012
