      - number: '6.3'
        title: Customer proof and durability
        blocks:
          - type: paragraph
            body: >-
              The retained evidence demonstrates aggregate production use but weak named-customer proof. Daily use by
              doctors in 2015 is stronger than a logo because it identifies an operating behavior, and the 2022
              public-hospital count indicates institutional reach. However, none of the retained sources identifies an
              individual provider organization and documents its deployment scope, outcome, and renewal. The pool also
              contains no supportable NRR, GRR, churn, renewal-rate, cohort, satisfaction, or contract-length measure.
              Consequently, workflow use and network size are evidence of adoption, not evidence of retention,
              commercial durability, or expansion within cohorts.
            claimRefs:
              - CU004
              - CU007
              - CU008
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
