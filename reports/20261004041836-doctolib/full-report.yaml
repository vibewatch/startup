              - CR014
              - CR015
      - number: '7.4'
        title: Dependencies, financial risk, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Doctolib depends on regulated health systems, verification infrastructure, technical personnel, and
              continued access to capital. The 2022 financing combined equity and debt, but the assigned evidence does
              not disclose the debt quantum, covenants, current cash, or liquidation preferences [CR008]. A 2024 ARR
              claim of €348 million and adjusted EBITDA loss of €53.8 million cannot be reconciled from this pool with
              LeadIQ's separate $100 million to $250 million annual-revenue estimate; ARR is not accounting revenue, and
              neither figure is audited here [CR010][CR011][CR013]. Monitorable thesis-break triggers are therefore
              evidence-based but prospective: an adverse appeal or new remedy in the competition matter, repeated
              material outages, failed identity or health-data controls, deterioration rather than improvement from the
              cited 2024 loss, or financing terms that subordinate new common investors. Any investment decision should
              require primary regulatory records, audited accounts, and customer/partner concentration data before
              treating those triggers as cleared.
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Acquisition optionality is no longer frictionless
            body: >-
              The reported FCA decision means that staying below filing thresholds does not eliminate competition risk.
              A close-competitor acquisition should be underwritten as potentially reviewable after closing, with fines
              and structural remedies in scope.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Require primary records before clearing the risk case
            body: >-
              Do not treat the absence of an incident record in this source pool as proof of no incidents. Clearance
              requires the regulator docket, audited financials, service-level and incident history,
              verification-control testing, and customer or partner concentration data.
            calloutType: recommendation
            claimRefs:
