callouts:
  - calloutType: "insight"
    title: "Architectural Pivot from Directory Utility to Clinical Workflow Monolith"
    body: "Doctolib's technical moat no longer resides in its patient booking portal, which has become a commodity interface, but in its deep embedding within medical practice workflows. By integrating electronic health records, ambient AI transcription, and encrypted practitioner messaging into its core platform, Doctolib increases doctor switching costs while aggregating proprietary clinical datasets across 90 million patient records."
    claimRefs:
      - "CE001"
      - "CE005"
      - "CE009"
  - calloutType: "risk"
    title: "Data Governance and Regulatory Headwinds Under EU AI Governance"
    body: "The rollout of generative AI models trained on patient medical histories under opt-out governance creates acute regulatory and reputational vulnerabilities under GDPR and the EU AI Act. Default inclusion of patient histories without explicit pre-consultation consent exposes the company to potential administrative inquiries by data protection authorities such as CNIL and BfDI."
    claimRefs:
      - "CE010"
      - "CE012"
