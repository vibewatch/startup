chapter:
  number: 5
  title: "Product & Technology"
  summary: "Doctolib has transitioned from a medical booking directory into an integrated pan-European health operating system that connects 90 million patients with 420,000 healthcare professionals across clinical EHR, scheduling, teleconsultation, and AI assistants. Its technical infrastructure combines an evolving Ruby on Rails monolith and cloud-native services with specialized acquisitions such as Tanker for client-side encryption and Typeless for ambient medical voice AI. However, the platform faces structural operational risks, including high documentation overhead in legacy codebases, opt-out clinical AI data governance controversies, and deep integration friction across fragmented national healthcare standards."
sections:
  - id: "product-suite-overview"
    title: "Product Portfolio and Clinical Operating Model"
    body: "Doctolib structures its product surface as an integrated dual-sided operating system serving both healthcare professionals and patient populations across Europe. For medical practitioners, the suite spans core practice efficiency modules—such as continuous 24/7 online appointment scheduling, calendar optimization, automated appointment reminders, and patient recall workflows—and clinical electronic health record (EHR) functions through Doctolib Médecin. Clinical capabilities include structured consultation documentation, prescription generation, diagnostic support, and billing management. For healthcare collaboration, the platform provides Doctolib Team and Doctolib Connect Messenger, which integrate secure instant messaging and document exchange for clinical care cooperation. For patients, Doctolib functions as a digital health companion, providing localized directory discovery across 120+ specialties, video teleconsultation, booking management, and preventative care tracking."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-and-technical-foundation"
    title: "Platform Architecture, Data Infrastructure, and Developer Experience"
    body: "The core technical architecture of Doctolib is built on a single, cloud-native distributed platform supporting web and mobile applications across multiple languages and national healthcare regulatory jurisdictions. Historically developed as a Ruby on Rails monolith, the engineering organization deploys daily while managing high concurrency that reaches up to 350,000 requests per minute with an internal response time target under 70 milliseconds. The frontend architecture relies on React and TypeScript, supported by Java and Ruby on Rails backend services. To accelerate delivery velocity and reduce developer cognitive load across 900+ technical personnel, Doctolib has invested heavily in automated developer tooling. Specifically, the team embedded Anthropic's Claude Code into its engineering continuous integration workflows to automate pull request reviews, migrate legacy visual regression test suites in hours rather than weeks, and maintain technical documentation continuously with each code commit."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "ai-roadmap-security-governance"
    title: "Artificial Intelligence Roadmap, Security Controls, and Governance Boundaries"
    body: "Doctolib has positioned generative and ambient artificial intelligence as central to its clinical operating roadmap, aiming to reduce documentation burdens for care teams. Following the acquisition of Swiss speech-recognition startup Typeless, Doctolib introduced its AI Consultation Assistant, an ambient scribe tool that transcribes clinical dialogue into structured consultation notes and medical letters, supporting over 5 million consultations across its network. The company is also rolling out automated telephone assistants based on Aaron.ai technology to manage inbound clinic calls outside operating hours. However, this aggressive AI expansion introduces compliance and trust trade-offs: in August 2026, healthcare evaluators identified that Doctolib automatically enrolled patient medical histories into clinical AI research programs with public institutes like Inria and Inserm unless patients actively opted out. On the security and confidentiality front, Doctolib maintains end-to-end encryption for sensitive health exchanges using Tanker technology and holds ISO 27001, ISO 27701, BSI C5, and French HDS certifications."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
