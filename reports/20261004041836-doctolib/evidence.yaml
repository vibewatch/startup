evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-secondary-terms
    missingEvidence: >-
      Audited fiscal year 2025 statutory financial filings, exact secondary transaction valuations, and debt covenant
      structures.
    whyItMatters: >-
      Without audited financial statements, Doctolib's gross margin, net burn rate, and exact enterprise valuation
      multiples cannot be independently verified.
    diligencePath: >-
      Inspect upcoming French Greffe commercial court registry filings for Doctolib SAS and request secondary transfer
      cap table disclosures.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Comprehensive listing of all vice presidents, medical advisory board members, and regional country managers across
      Germany and Italy.
    whyItMatters: >-
      Leadership depth in non-French expansion territories indicates the degree of operational decentralization and
      local execution capability.
    diligencePath: >-
      Review commercial registry filings in Germany (Handelsregister) and Italy (Registro delle Imprese) for appointed
      managing directors.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Complete cap table breakdown showing precise shareholding percentages, liquidation preferences, and secondary
      transaction sellers.
    whyItMatters: >-
      Understanding voting control and preference overhang is critical to assessing alignment between founders, early
      venture backers, and growth investors.
    diligencePath: >-
      Request confidential cap table disclosures or inspect registrar share registry filings in commercial court
      records.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited country-by-country ARR breakdowns, net revenue retention (NRR), customer acquisition cost (CAC), and paid
      subscriber counts for France versus Germany and Italy.
    whyItMatters: >-
      Without segmented geographic and product ARR disclosures, SAM and SOM penetration rates across individual national
      health systems cannot be independently verified.
    diligencePath: >-
      Inspect audited FY2025 financial disclosures, prospective IPO registration filings (F-1 or French AMF prospectus),
      or confidential management presentation data.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-metrics
    missingEvidence: >-
      Audited regional market share figures and customer churn rates comparing Doctolib to DocPlanner in Central Europe
      and CGM in Germany.
    whyItMatters: >-
      Without segmented regional churn and market share data, displacement velocity and pricing power relative to
      localized incumbents cannot be independently quantified.
    diligencePath: >-
      Review internal commercial win/loss reports, regional medical association software surveys, or prospective IPO
      disclosures.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-cash-runway
    missingEvidence: Audited 2025 statutory income statement, cash flow statement, net cash balance, and debt covenant terms.
    whyItMatters: >-
      Without audited cash flow and debt obligations, independent verification of cash runway and debt refinancing risk
      is impossible.
    diligencePath: Obtain confidential vendor due diligence (VDD) pack and management accounts during formal pre-IPO diligence.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: cohort-unit-economics-and-nrr
    missingEvidence: >-
      Country-level cohort retention, churn rates, net revenue retention (NRR), and customer acquisition cost (CAC)
      payback periods.
    whyItMatters: >-
      Geographic unit economics are necessary to underwrite expansion returns and long-term operating leverage outside
      of France.
    diligencePath: >-
      Request cohort retention schedules segmented by customer tier (independent doctor vs hospital) and country (France
      vs Germany vs Italy).
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: ambient-ai-clinical-error-rates
    missingEvidence: >-
      Audited error rates, hallucinations, and omission frequency of the Typeless-powered AI Consultation Assistant in
      real-world clinical consultations across French and German specialties.
    whyItMatters: >-
      Unmeasured transcription or coding errors create medical liability and clinical documentation inaccuracies for
      practicing doctors.
    diligencePath: >-
      Request clinical validation trial datasets and internal quality-assurance logs comparing human vs AI transcription
      accuracy.
    relatedQuestionRefs:
      - QE004
  - type: access-blocked
    severity: material
    topic: opt-out-privacy-compliance-investigations
    missingEvidence: >-
      Official regulatory correspondence or preliminary inquiries from CNIL or BfDI concerning Doctolib's default
      opt-out health data inclusion for Inria and Inserm AI models.
    whyItMatters: >-
      Regulatory enforcement could mandate retroactive data deletion, model retraining, or substantial GDPR financial
      penalties.
    diligencePath: >-
      Review company regulatory disclosure filings, internal DPO legal memos, and formal inquiries from European privacy
      regulators.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: retention-and-durability
    missingEvidence: Current NRR, GRR, logo churn, renewal rate, contract length, satisfaction, and country-level cohort retention.
    whyItMatters: >-
      Adoption counts do not establish durable subscription economics or expansion within professional and institutional
      cohorts.
    diligencePath: >-
      Request board-approved cohort schedules and contract-level renewal data split by country, customer type, and
      product module.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer, top-ten-customer, country, channel, hospital-system, and referral-source concentration.
    whyItMatters: >-
      The assigned evidence cannot determine whether expansion is broad-based or dependent on a small number of
      institutions or markets.
    diligencePath: >-
      Obtain anonymized customer revenue concentration, country ARR, channel contribution, and hospital tender
      schedules.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Named provider references showing production scope, measured outcome, deployment date, and renewal status.
    whyItMatters: Aggregate cohorts cannot establish reference quality, implementation depth, or customer-specific durability.
    diligencePath: >-
      Request reference calls and contracts for at least three providers spanning independent practice, clinic, and
      public-hospital segments.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Regulator-primary Decision 25-D-06, current appeal status, remedies, commitments, and any subsequent compliance
      orders.
    whyItMatters: >-
      A secondary legal analysis establishes enforcement risk but cannot determine the current procedural posture or
      binding restrictions.
    diligencePath: >-
      Retrieve the FCA docket and court record, then have French competition counsel map each live obligation to planned
      acquisitions.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-quality-security-risk-register
    missingEvidence: >-
      Audited uptime, outage, recovery-time, security-incident, support-backlog, and software-quality metrics by product
      and country.
    whyItMatters: >-
      The assigned evidence documents contractual rights and staffing signals but cannot establish actual reliability or
      incident frequency.
    diligencePath: >-
      Request SLA reports, incident postmortems, recovery tests, penetration-test summaries, and customer-support
