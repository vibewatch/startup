  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场范围、边界与可触达支出
        blocks:
          - type: paragraph
            body: >-
              Doctolib 的核心可触达市场，是面向西欧独立医生、集团诊所、门诊和公共医疗机构的 SaaS 工作流解决方案。              欧洲大陆每年估计有 8 billion
              次医生预约，构成可触达活动的基础。但可触达的软件支出只包括行政自动化、电子健康记录（EHR）集成、患者沟通、诊所管理和环境式临床记录，不包括更广义的临床交付支出、药品报销和医疗器械采购。过去，私人医生依赖本地化本地部署计费软件、纸质排班、行政电话秘书和人工患者分诊等零散替代方案。Doctolib
              将自身定位为完整临床操作系统，而非单纯的消费者预约门户，因此可直接收取服务方月度订阅费：基础价格为 €139，搭配环境式临床语音助手和自动电话管理工具后最高可达 €500。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 市场规模测算视角与可触达机会
        blocks:
          - type: paragraph
            body: >-
              评估 Doctolib 的可触达市场，需要把宏观估算拆成可执行的运营细分。最宽口径下，欧洲每年 8 billion
              次问诊构成理论活动上限，规模约为传统餐厅预约垂直市场的二十倍。将其收窄到法国、德国和意大利的基层医生软件订阅后，市场规模取决于医生数量及其采用统一云平台的意愿。到 2026 年，Doctolib 的 ARR 达到
              €422 million，覆盖超过 300,000 名医疗人员和 250
              个公立医院网络。法国以外的扩张面临结构性放缓：德国医疗软件采用受联邦无纸化数字化要求推动，但各国监管架构和临床协议不同，国际获客成本仍然偏高。单纯依据风险投资时代市场倍数的估值已从 2022 年 €5.8
              billion 峰值调整至 2026 年老股交易的 €3.6 billion，收入倍数也从超过 20x 压缩至约 8.5x。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM009
