      - 估值区间
      - 主要风险与概率信号
    rows:
      - - 乐观情景
        - 2025 年 ARR 超过 €420.0M；调整后 EBITDA 转正；欧盟 AI 推出成功
        - 12.0x - 15.0x ARR 倍数
        - $6.0B - $8.0B
        - 医院 EHR 集成执行失败；估计概率 25%
      - - 基准情景
        - 2025 年 ARR 达到约 €415M（同比 +20%）；调整后 EBITDA 达到盈亏平衡；流失率稳定
        - 8.0x - 11.0x ARR 倍数
        - $4.0B - $5.5B
        - 二级市场重新定价和倍数温和压缩；估计概率 55%
      - - 悲观情景
        - ARR 放缓至低于 €380M（同比 <10%）；EBITDA 亏损扩大；监管瓶颈
        - 5.0x - 7.0x ARR 倍数
        - $2.5B - $3.5B
        - 债务重组、优先级更高的权益被稀释、倍数收缩；估计概率 20%
    notes: 情景模型根据前瞻收入预测和欧洲医疗 SaaS 可比公司倍数分布估算企业价值。
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV008
      - CV009
      - CV011
      - CV014
      - CV015
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 梳理 2013 至 2026 年间塑造 Doctolib 的创立、融资、产品扩张和监管关键事件。
    data:
      items:
        - date: 2013-10
          label: 公司成立
          detail: Doctolib 在巴黎成立，最初是面向医疗从业者的预约平台。
          tone: positive
          claimRefs:
            - CO001
        - date: 2019-03
          label: 独角兽估值里程碑
          detail: 估值达到 $1 billion，确立其在法国医疗机构排班领域的领先地位。
          tone: positive
          claimRefs:
            - CO006
        - date: 2021-06
          label: 疫苗接种活动转向
          detail: 在法国 COVID-19 全国推广中，承担核心数字预约基础设施角色。
          tone: positive
          claimRefs:
            - CO012
        - date: 2022-01
          label: Tanker 收购与股权授予
          detail: 收购医疗加密公司 Tanker，并向所有员工授予 €20,000 股权。
          tone: positive
          claimRefs:
            - CO010
        - date: 2022-03
          label: G 轮融资与 $6.4B 峰值
          detail: 在 Eurazeo 牵头下筹集 $549 million 股权和债务，峰值估值达到 €5.8 billion。
          tone: positive
          claimRefs:
            - CO005
        - date: 2023-05
          label: Siilo 收购
          detail: 收购荷兰安全医疗消息应用 Siilo，拓展至荷兰和比荷卢地区。
          tone: positive
          claimRefs:
            - CO010
        - date: 2024-06
          label: Typeless AI 收购
          detail: 收购语音识别初创公司 Typeless，开发 Consultation Assistant 环境式记录工具。
          tone: positive
          claimRefs:
            - CO011
        - date: 2024-12
          label: 2024 财年财务表现
          detail: ARR 达到 €348 million（同比 +22.5%），调整后 EBITDA 亏损收窄至 -€53.8 million。
          tone: neutral
          claimRefs:
            - CO007
            - CO008
        - date: 2025-11
          label: 法国反垄断罚款
          detail: 因排他性和捆绑行为被法国 Autorité de la concurrence 罚款 €4.665 million。
          tone: negative
          claimRefs:
            - CO009
        - date: 2026-05
          label: Medicus 收购与英国扩张
          detail: 宣布收购 NHS 基层医疗软件制造商 Medicus，并投资 £100 million 拓展英国业务。
          tone: neutral
          claimRefs:
            - CO009
    approximationNotes: 里程碑日期来自新闻稿、新闻报道和战略展望文件。
    claimRefs:
      - CO001
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
  - id: FM001
