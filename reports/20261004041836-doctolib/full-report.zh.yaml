  - id: FI001
    title: Doctolib 供应商活动转化为经常性订阅收入和毛利
    type: flow
    summary: 展示医疗从业者发现与患者预约互动如何转化为经常性 SaaS 订阅、附加产品扩张和毛利创造。
    data:
      nodes:
        - id: node-1
          label: 患者预约与目录流量
        - id: node-2
          label: 从业者获客与地推销售
        - id: node-3
          label: 核心 SaaS 排班订阅（约 €99+/月）
        - id: node-4
          label: 临床 EHR 与附加产品扩张（Médecin、AI）
        - id: node-5
          label: 托管、数据基础设施与支持（30-35% COGS）
        - id: node-6
          label: 毛利（目标利润率约 65-70%+）
      edges:
        - from: node-1
          to: node-2
          label: 流入需求
        - from: node-2
          to: node-3
          label: 上手与转化
        - from: node-3
          to: node-4
          label: 模块追加销售
        - from: node-3
          to: node-5
          label: 服务交付成本
        - from: node-4
          to: node-5
          label: 计算与托管
        - from: node-5
          to: node-6
          label: 净利润率转化
    approximationNotes: 流程关系描绘了从用户预约流量到核心订阅 ARR 和毛利目标的商业路径，目标来自战略财务披露。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
