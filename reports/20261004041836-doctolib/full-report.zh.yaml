              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
      - number: '8.2'
        title: 推荐立场、倍数与融资背景
        blocks:
          - type: paragraph
            body: >-
              评估 Doctolib 这类后期私募软件资产，需要严格控制入场纪律。根据 2022 年 3 月有记录的 Series F 轮融资，Doctolib 募资 $549M 至 $554M，名义估值为
              $6.4B，相当于其当时记录的 $400M 收入年化水平的 16.0x 倍数。第三方汇总口径差异很大：Tracxn 称 10 轮累计募资 $866M（含传统债务工具），Forge Global 报道总融资
              $825.7M，Multiples VC 记录 $818M，LeadIQ 则估算累计融资最高 $1.2B；但 2025 年收入、毛利率、现金余额和偿债情况均没有公开的经审计财务报表。Caplight 跟踪
              DocPlanner、Cegedim 和 Groupe NEHS
              等欧洲可比医疗软件供应商，显示公开和私募市场倍数已向个位数收入倍数重估。因此，我们维持“继续研究”的建议，中等置信度、高风险评级和偏高估值判断。在经审计的 2025
              年经营盈利能力与债务工具完成对账前，正式买入建议仍为时过早。
            claimRefs:
              - CV002
