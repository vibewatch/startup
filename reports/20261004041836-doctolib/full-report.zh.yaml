      - number: '1.2'
        title: 创始人、领导结构与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Doctolib 由 CEO Stanislas Niox-Chateau 联合创立，至今仍由其主导；他是公司的核心战略设计者和主要机构代表。法国区董事总经理 Arthur Thirion、CFO Pierre
              Vergnes 等长期任职高管，以及产品、工程和营收团队的运营负责人，进一步支撑了管理体系。该领导结构体现出使命驱动的治理理念，并通过 B Corp
              认证和专门的使命委员会正式化，后者负责监督社会与公共卫生影响。2022 年 1 月，公司通过 DoctoGrowth 价值分享计划扩大员工长期持股，向所有员工授予最低 €20,000
              的股权价值。不过，关键人物风险仍集中在 Niox-Chateau 身上；他在法国医疗体系和政府部门中的公众声誉及政治关系，对获取 COVID-19 疫苗接种活动等国家级基础设施角色至关重要。
            claimRefs:
              - CO003
              - CO004
              - CO001
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.3'
        title: 融资历史、投资者治理与资本结构
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Doctolib 在 10 轮私募融资中累计获得约 $1.2 billion 股权及债务资本，用于平台开发、全国市场扩张和防御性并购。公司 2019 年达到独角兽地位，并在 2022 年 3 月完成
              $549 million（€500 million）的 Series G 融资后达到 €5.8 billion（$6.4 billion）峰值估值。该轮由法国私募股权公司 Eurazeo 领投，法国主权基金
              Bpifrance 和全球成长型投资者 General Atlantic 继续参与。Doctolib 披露 2024 财年 ARR 为 €348 million，同比增长 22.5%；调整后 EBITDA 亏损为
              -€53.8 million，较 2023 年的 -€87.1 million 大幅收窄。管理层目标是在 2025 年实现经营盈亏平衡，并评估 2026 年末至 2027 年的 IPO
              时点；但私募老股交易显示估值正向约 €3.6 billion 重估，且经审计的 2025 年财务披露仍被严格保密。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
      - number: '1.4'
        title: 运营里程碑、监管压力与扩张路径
        blocks:
          - type: paragraph
            body: >-
              过去十年，Doctolib 通过产品多元化和定向收购推进增长，同时面临日益加重的监管摩擦。关键节点包括 2021 年动员法国全国疫苗接种、2022 年收购加密专家 Tanker 以保障端到端消息安全，以及
              2023 年收购荷兰通信应用 Siilo 以建立 Benelux 服务方中心。2024 年 6 月，Doctolib 收购瑞士语音识别初创公司 Typeless，并将其技术用于 Consultation
              Assistant 环境式 AI 临床记录工具。与此同时，平台承受更强监管审查：2025 年 11 月 6 日，法国竞争管理局因软件捆绑和排他性条款对 Doctolib 处以 €4.665 million
              罚款，引发传统医疗软件竞争者后续投诉。此外，公司计划通过收购 NHS 原生软件服务商 Medicus 进入英国，这使其暴露于严格的 NHS 采购周期和潜在资本消耗。
