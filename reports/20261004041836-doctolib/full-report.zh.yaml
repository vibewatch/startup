chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、平台覆盖与商业模式
        blocks:
          - type: paragraph
            body: >-
              Doctolib 成立于 2013
              年，总部位于法国巴黎大都会区（Levallois-Perret）。公司已从医疗预约门户发展成服务欧洲医疗专业人士的数字化操作系统。平台主要覆盖法国、德国和意大利，把面向消费者的预约搜索与按订阅收费的医疗服务方管理软件结合起来。与靠消费者付费变现的平台不同，Doctolib
              约 99% 的收入直接来自医疗专业人士，月度 SaaS 订阅起价 €129。公司明确不将患者病历变现或出售广告，定位是医疗行业的主权型、可信基础设施。在核心欧洲市场，Doctolib 连接了超过 300,000
              名订阅医生和医院团队与超过 80 million 名患者，支撑城乡医疗网络中的行政工作流、预约、远程问诊和病历交换。
            claimRefs:
              - CO001
              - CO002
              - CO012
