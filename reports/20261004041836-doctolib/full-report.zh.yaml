              €50,000 罚款被描述为象征性金额，未来收购紧密竞争者仍可能成为高影响路径 [CR002]。健康数据治理和服务连续性紧随其后：Doctolib 条款保留紧急变更权，并围绕敏感数据规定具体的验证和合法共享义务
              [CR004][CR005][CR006]。财务和模式风险也很重要，但更难量化。现有证据池包含 2024 年 ARR、调整后 EBITDA 亏损和另一项 2026
              年收入估算；三者不能互换，也无法证明当前现金消耗或流动性 [CR010][CR011][CR013]。
