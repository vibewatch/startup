      - number: '7.4'
        title: 依赖、财务风险与终止标准
        blocks:
          - type: paragraph
            body: >-
              Doctolib 依赖受监管的医疗系统、验证基础设施、技术人员和持续融资。              2022 年融资包含股权和债务，但现有证据未披露债务规模、契约、当前现金或清算优先权
              [CR008]。本证据池无法将据称为 €348 million 的 2024 年 ARR 和 €53.8 million 的调整后 EBITDA 亏损，与 LeadIQ 另行估计的 $100 million 至
              $250 million 年收入对账；ARR 不是会计收入，且这里的任何数字都未经审计
              [CR010][CR011][CR013]。因此，可监测的论点破坏触发因素虽有证据基础，但仍是前瞻性的：竞争事项出现不利上诉结果或新救济、反复发生重大宕机、身份或健康数据控制失败、上述 2024
              年亏损恶化而非改善，或融资条款使新普通股投资者处于次级。任何投资决定在认定这些风险已解除前，都应要求一手监管记录、经审计账目以及客户 / 合作伙伴集中度数据。
            claimRefs:
