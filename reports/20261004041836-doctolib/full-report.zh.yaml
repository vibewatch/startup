      - number: '3.3'
        title: 定价结构、产品包装与市场进入动态
        blocks:
          - type: paragraph
            body: >-
              医疗排班与诊所管理市场的商业模式，因客户层级不同而差异很大。横向排班器和基础 SaaS 预约工具通常采用免费增值或分层定价，月费从 $5 到 $100 不等，小团队还可使用免费入门层。相反，Doctolib
              坚持订阅制企业架构，超过 99% 的营收来自向医生、诊所和医院销售平台，不收消费者预约费。Doctolib Connect Messenger
              等基础患者访问工具可免费下载，但专业临床订阅从专业基础档位起价，并随诊所采用 Doctolib Médecin、环境式 AI 记录（Typeless
              集成）和自动电话助手（Aaron.ai）等附加模块而上升。市场进入依靠本地化地推团队、遍布 30 个欧洲城市的城市区域中心，以及负责按各国监管框架调整功能发布的产品营销团队。
            claimRefs:
              - CP003
              - CP005
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
