  - id: FE001
    title: Doctolib 端到端技术栈架构
    type: stack
    summary: 展示 Doctolib 云原生医疗平台的架构层，从用户触点一直到数据安全基础设施。
    data:
      layers:
        - label: 互动与用户体验
          detail: 患者 Web / 移动应用、医生 EHR 工作区、前台日程看板、Doctolib Connect 信使
        - label: 临床与工作流应用
          detail: 预约排班引擎、Doctolib Médecin EHR、电子处方、计费与开票引擎
        - label: 环境式智能与 AI 服务
          detail: Typeless 环境式记录工具、Aaron.ai 电话助手、临床数据洞察平台、任务自动化
        - label: 核心平台与集成服务
          detail: Ruby on Rails 单体、Java 服务、使用 Claude Code 的 CI/CD、从业者仓库、Health API 网关
        - label: 安全、合规与数据基础设施
          detail: Tanker 端到端加密、ISO 27001/27701 控制、HDS 托管、BSI C5 鉴证
        - label: 云托管与分布式运行时
          detail: 多区域欧盟云基础设施、PostgreSQL 集群、Redis 缓存、Kafka 事件流
    approximationNotes: 各层是根据公开的工程团队结构和技术出版物抽象出的逻辑架构域。
    claimRefs:
      - CE001
      - CE005
      - CE007
      - CE009
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示从患者需求到专业工作流和机构扩张的证据约束路径，并保留尚未解决的商业关卡。
    data:
      items:
        - label: 患者需求
          description: 患者使用发现和预约入口；历史触达规模较大，但活跃使用频率不可得。
          touchpoints:
            - 预约发现
            - 在线预约
        - label: 医疗参与者资格
          description: Connect 服务在合同上限于医疗参与者，不面向消费者或未成年人。
          touchpoints:
            - 专业身份
            - 执业授权
        - label: 产品访问
          description: Messenger 和 Webchat 免费，但 Connect 或 Prisma 的价格可能需要另行协商。
          touchpoints:
            - 免费通信
            - 单独签约的服务
        - label: 专业人员持续使用
          description: 历史资料记录了医生每日使用，但当前付费席位和留存率指标不可得。
          touchpoints:
            - 日程管理
            - 日常工作流
        - label: 机构覆盖
          description: 诊所和公立医院的汇总群体显示，覆盖范围已超出单人执业者，但未提供具名部署、席位或续约数据。
          touchpoints:
            - 诊所
            - 公立医院
        - label: 地理扩张
          description: 据报道，德国商业进展势头良好，但当前各国留存率和客户集中度仍未披露。
          touchpoints:
            - 柏林运营布局
            - 国家扩张
    approximationNotes: 这些阶段是对已观察触点的分析性排序，不是实测漏斗；不代表转化率、持续时长或队列连续性。
    claimRefs:
      - CU001
      - CU010
      - CU011
      - CU012
      - CU013
      - CU015
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 对证据最充分的风险进行序数评估；标签是尽调判断，并非实测概率。
    data:
      columns:
        - label: 可能性
          detail: 面向未来的分析师判断，不是统计概率。
        - label: 影响
          detail: 该失效模式发生时可能造成的投资影响。
        - label: 缓释成熟度
          detail: 仅纳入有公开证据支持的缓释措施。
        - label: 剩余严重度
          detail: 在有证据支持的缓释措施之后仍然存在的敞口。
      rows:
        - label: 未来收购近距离竞争对手的挑战
          note: 以据报道的 2025 年 FCA 决定及可用补救措施为依据。
          values:
            - label: 高
              tone: risk
            - label: 高
              tone: risk
            - label: 部分
              tone: warning
            - label: 高
              tone: risk
        - label: 健康数据或验证控制失效
          note: 条款文件记录了职责和权利，但没有说明控制措施的有效性。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: risk
            - label: 部分
              tone: warning
            - label: 高
              tone: risk
        - label: 服务连续性失效
          note: 没有可用的故障分母或恢复记录。
          values:
            - label: Unknown
              tone: neutral
            - label: 高
              tone: risk
            - label: 未验证
              tone: warning
            - label: 高
              tone: risk
        - label: 国际执行不及预期
          note: 独立展望显示各国进展不均衡。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: risk
            - label: 未验证
              tone: warning
            - label: 中高
              tone: warning
        - label: 财务轨迹不及预期
          note: 2024 年调整后 EBITDA 亏损不等于当前现金消耗。
          values:
            - label: Unknown
              tone: neutral
            - label: 高
              tone: risk
            - label: 未验证
              tone: warning
            - label: 高
              tone: risk
        - label: 私募市场流动性或披露冲击
          note: 保留的 IPO 前页面指出了流动性和有限披露风险场景，但未对其量化。
          values:
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
            - label: 低
              tone: risk
            - label: 中高
              tone: warning
    approximationNotes: 四个维度都是基于所引来源的序数分析师判断；不代表任何数值概率、事件频率或损失估算。
    claimRefs:
      - CR001
      - CR004
      - CR007
      - CR010
      - CR012
      - CR013
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将运营规模和财务表现连接至我们的估值立场与尽调建议的逻辑链条。
    data:
      nodes:
        - id: scale
          label: 运营规模：超过 300k 名医疗服务提供者，以及无处不在的法国患者网络
        - id: financials
          label: 财务进展：2024 年 ARR 为 €348.0M，EBITDA 亏损收窄至 -€53.8M
        - id: multiples
          label: 估值脱节：历史私募估值 $6.4B-$6.5B（16.0x）面临二级市场压缩
        - id: information-gaps
          label: 信息缺口：2025 年经审计数据、现金余额和债务契约仍未披露
        - id: downside-risks
          label: 下行风险：优先债务契约、欧盟《人工智能法案》合规，以及竞争对手的单点解决方案
        - id: recommendation
          label: 投资立场：继续研究，信心中等、风险高，估值偏高
      edges:
        - from: scale
          to: financials
        - from: financials
          to: multiples
        - from: multiples
          to: information-gaps
        - from: information-gaps
          to: downside-risks
        - from: downside-risks
          to: recommendation
    approximationNotes: 该流程展示支撑投资立场的确定性定性与定量评估步骤。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV010
      - CV013
