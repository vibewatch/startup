      - number: '2.3'
        title: 买方细分、工作流集成与预算归属
        blocks:
          - type: paragraph
            body: >-
              Doctolib
              的客户可分为三层：单人医疗从业者（全科医生和专科医生）、多医生集团诊所或私立诊所，以及大型区域公立医院网络，例如巴黎公立医院（AP-HP）。对单人医生和小型诊所而言，持证医生直接负责采购和预算，主要诉求是减少行政电话分诊、将爽约率从
              10% 降至 2.5%，并通过国家医疗登记系统完成医生验证。在医院网络和综合诊所中，预算转由机构 IT 采购、医院执行董事和医疗委员会掌握；这些买方要求企业级数据合规、端到端加密，以及 Doctolib
              Connect、Doctolib Team 等可互操作的临床消息套件。
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM004
              - CM010
              - CM011
      - number: '2.4'
        title: 增长催化剂、监管治理与结构性采用约束
        blocks:
          - type: paragraph
            body: >-
              推动欧洲医疗科技采用的主要催化剂，是临床人力短缺——全球医疗工作者缺口达到 11 million——这迫使机构采用环境式 AI
              记录员、自动语音分诊等提升生产率的工作流自动化工具。但结构性约束限制了市场扩张。疫情后，远程问诊从高峰期占医疗就诊 17% 回落并稳定在 4% 至 6% 的混合基线，说明激进的纯远程医疗预测并未兑现。此外，欧盟
              AI 法案及各国严格的健康数据托管规定带来合规障碍，抬高高风险临床软件的持续运营成本和产品责任，限制其在监管尚未统一的欧洲司法辖区快速跨境部署。
            claimRefs:
              - CM005
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: SaaS 扩张对阵宏观倍数压缩
            body: >-
              2022 至 2026 年间，Doctolib 的 ARR 从约 €270 million 增至 €422 million（+56%），但已完成的老股市场估值却从 €5.8 billion 下跌 40% 至
              €3.6 billion。这一背离说明，欧洲医疗科技估值已从超过 20x ARR 的投机型风险投资倍数，转向约 8.5x ARR 的纪律化、类公用事业倍数。
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
          - type: callout
            title: 远程医疗需求稳定与混合医疗现实
            body: >-
              COVID-19 疫情高峰期，远程问诊一度占全部医疗就诊的 17%，推高了市场对数字优先医疗交付的预期。到 2026 年，远程问诊率回归 4% 至 6%
              的稳定混合基线，医疗软件服务商必须把估值建立在核心诊所工作流自动化和环境式临床效率上，而非单纯靠远程医疗就诊变现。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局概览与同业分层
        blocks:
          - type: paragraph
            body: >-
              Doctolib 面临的竞争不是单一、同质化的对手，而是五条运营战线：泛欧洲预约网络（如 DocPlanner/ZnanyLekarz）；传统本地部署 EHR 和诊所管理供应商（如 CGM/CompuGroup
              Medical）；本地化远程医疗和区域排班平台（如意大利 Dottori 被收购前的业务，以及波罗的海等新兴地区的 TeleMed、Tele2Doctor 和 eMedicine）；横向排班替代品（如
              Calendly、Acuity Scheduling 和 Setmore）；以及下一代临床 AI 单点方案（如 Nabla、Aaron.ai 和 Abridge）。在法国和德国核心医疗市场，Doctolib
              在基层和专科门诊中保持强大可见度。但随着医疗软件从基础预约转向完整诊所操作系统，竞争越来越取决于临床记录深度、本地保险和计费的无缝集成，以及自动化患者沟通工作流。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP007
              - CP009
      - number: '3.2'
        title: 竞争者画像、能力基准与产品范围
        blocks:
          - type: paragraph
            body: >-
              直接和相邻竞争者在产品广度、监管合规和地域集中度上存在明显结构差异。DocPlanner 等区域龙头凭借庞大的患者目录和预约工具主导中东欧，但其住院 EHR 能力历史上窄于 Doctolib 在 250
              个公立中心的医院部署。相较之下，CompuGroup Medical（CGM）等传统企业医疗 IT 供应商依靠经过认证的本地计费和临床病历模块形成深度机构锁定，却受制于老旧界面和割裂的云访问体验。Acuity
              Scheduling、Setmore 和 Zoho Bookings 等横向预约平台提供低成本、自助式日历管理，但完全不具备欧洲医疗器械认证、健康数据托管（HDS）合规和专门的 EHR
              互操作能力。同时，Nabla 和 Abridge 等临床 AI 初创公司通过提供独立转录和不依赖 EHR 的笔记生成，试图把环境式临床记录从传统诊所管理套件中拆出来。
            claimRefs:
              - CP004
              - CP006
