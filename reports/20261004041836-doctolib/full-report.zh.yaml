      - number: '3.4'
        title: 护城河耐久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Doctolib 的竞争护城河来自双边网络密度、深度工作流集成和欧洲健康数据隐私标准下的严格合规。在法国、德国和意大利，平台连接超过 300,000 名医疗人员和 80 million
              名注册患者，形成强大的消费者发现飞轮，使医生流失在运营上代价高昂。迁移历史预约数据库、安全消息渠道和已验证服务方身份，还会带来技术和法律摩擦，形成较高切换成本。不过，结构性脆弱点仍在：不依赖 EHR 的 AI
              单点方案可能把基础排班和行政界面商品化，降低医生为一体化套件支付溢价的意愿。跨境扩张也会受到本土竞争者和各国医疗体系差异的阻力；Doctolib 必须在意大利进行数百万欧元的 Dottori
              收购，正说明了有机进入市场的困难。
            claimRefs:
              - CP001
              - CP006
              - CP013
              - CP014
              - CP015
