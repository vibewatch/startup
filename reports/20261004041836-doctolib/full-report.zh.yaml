  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Doctolib 是横跨法国、德国和意大利的关键工作流基础设施与预约管理网络，服务超过 300,000
              名医疗专业人士，并深度嵌入临床触点。正向投资论点的核心，是公司已从单纯的医疗预约引擎转向完整临床操作系统，把排班、Doctolib Médecin
              的患者记录和安全团队消息统一起来。经常性订阅模式带来较强收入可预测性，99% 的营收来自医生 SaaS 订阅；规模化运营也使调整后 EBITDA 亏损从 2023 年的 -€87.1M 收窄至 2024 年的
              -€53.8M。反论点则是欧洲私募科技估值持续承压、倍数不断压缩。历史 Series F 和 Series G 轮将公司定价在 $6.4B 至 $6.5B
              后，隐含企业估值已在老股市场重新校准至持平或折价区间，Caplight 记录的 2026 年 4 月老股成交也反映出这一点。此外，资本结构仍不透明：与 2022
              年传统债务轮融资相关的确切契约和清算优先权尚未验证。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
