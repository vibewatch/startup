            body: >-
              Doctolib 的商业收入几乎全部来自直接卖给医疗专业人士、诊所和医院的 SaaS
              订阅协议。在法国、德国、意大利和荷兰等核心欧洲市场，患者可以免费使用预约排班、医疗目录和远程问诊入口，而医疗从业者支付月度经常性费用部署工作流平台。战略财务分析显示，Doctolib 99%
              的平台收入来自向护理团队销售软件订阅，因此经常性现金流高度可预测且黏性强。商业产品已从基础在线排班逐步扩展到专业软件档位：Doctolib Médecin 集中管理临床记录、患者问诊历史和开票；Doctolib
              Connect 提供服务方之间的安全消息和协作；专业远程问诊工具则作为高级附加模块。尽管订阅收入提高了可见度，公开披露并未按产品模块拆分每位医生的实际收入，也未披露各地区
