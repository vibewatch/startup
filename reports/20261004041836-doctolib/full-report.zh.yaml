      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              公开证据支持公司依赖可靠的支持和工程能力，但没有提供宕机历史、可用性分母、恢复时间记录或安全事件登记。Doctolib 条款允许提前十五天终止 Connect
              应用或服务，这定义了合同层面的连续性风险，但不代表公司计划终止服务 [CR007]。第三方访谈指南称客户成功工程师是复杂平台问题和搭建工作的主要技术接口；公司发布的 LinkedIn 岗位转发则显示柏林招聘资深
              Kotlin/React 全栈工程师 [CR014][CR015]。这些是运营能力信号，不是服务质量证明。国际执行又增加一层难度：独立展望认为德国已产生显著成果，而意大利仍处于学习阶段 [CR012]。
            claimRefs:
              - CR007
              - CR012
              - CR014
              - CR015
