              - CV010
              - CV013
      - number: '8.3'
        title: 情景分析、退出准备度与论点破坏触发因素
        blocks:
          - type: paragraph
            body: >-
              为在预计 2026 年末或 2027 年 IPO 窗口前模拟企业价值，我们设置三种运营情景。乐观情景下，Doctolib 达到管理层预计的 2025 年 ARR 超过 €420.0M，实现 EBITDA
              盈利，成功推出环境式 AI 临床转写模块，并以 12x 至 15x 倍数获得 $6.0B 至 $8.0B IPO 估值。基准情景下，收入以 20% 至 22% 的温和速度增长，ARR 约 €415M，EBITDA
              小幅盈亏平衡，公开市场或老股估值为 $4.0B 至 $5.5B，对应 8x 至 11x 倍数。悲观情景下，欧盟 AI 法案监管审查、专业环境式语音方案的竞争进入和宏观倍数压缩使收入增速降至 15%
              以下，估值折价至 $2.5B 至 $3.5B，对应 5x 至 7x 倍数。关键论点破坏触发因素包括任何续约失败、医疗合规规则下的监管处罚、无法核实债务契约，或 2025 财年之后调整后 EBITDA 仍长期亏损。
            claimRefs:
