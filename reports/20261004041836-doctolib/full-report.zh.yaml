        title: 展示项
        blocks:
          - type: callout
            title: 估值锚点对阵老股市场现实
            body: >-
              Doctolib 在 2022 年 3 月 Series F 轮融资中达到 €5.8B（$6.4B）峰值估值，但 Caplight
              跟踪的私募老股交易和行业可比公司显示，软件倍数已经下调。评估入场点时，投资者必须把历史融资轮的 headline 估值，与未来企业现金创造能力分开。
            calloutType: insight
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV011
          - type: callout
            title: 资本结构与债务契约不透明
            body: >-
              2022 年 3 月融资方案在股权之外加入传统债务，引入了高级债权人的债权主张，也可能形成清算优先权压力。
              在无法全面掌握债务到期日、利息契约和转换条款的情况下，普通股股东与次级二级市场买家承担着尚未量化的结构性风险。
            calloutType: risk
            claimRefs:
              - CV003
              - CV008
              - CV012
              - CV015
