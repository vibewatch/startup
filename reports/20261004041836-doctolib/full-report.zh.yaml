        - label: 注册患者基数
          value: 80000000
          valueNote: 网络覆盖范围内有 80 million 名欧洲患者
        - label: 签约公立医院部署
          value: 250
          valueNote: 250 家公立医院中心，包括 AP-HP 网络
        - label: 主要估值峰值上限（€）
          value: 5800000000
          valueNote: 2022 年 3 月主要股权融资峰值估值 €5.8 billion
        - label: 二级市场清算交易估值（€）
          value: 3600000000
          valueNote: 2026 年二级市场交易估值 €3.6 billion
        - label: 已实现年度经常性收入（€）
          value: 422000000
