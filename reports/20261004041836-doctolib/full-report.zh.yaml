            title: 收购选择权不再没有摩擦
            body: 报道中的法国竞争管理局决定表明，低于申报门槛并不能消除竞争风险。对近邻竞争者的收购，应按交易完成后仍可能被审查来评估，罚款和结构性救济都应纳入范围。
