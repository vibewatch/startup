            body: >-
              法国竞争法先例直接限制了滚雪球式并购策略。Mayer Brown 的分析称，法国竞争管理局将一次低于申报门槛的近邻竞争者收购视为滥用支配地位，并在评估排除性意图时高度依赖员工交流和顾问报告
              [CR001][CR003]。这同时抬高交易筛查和文件治理风险。另一方面，Doctolib Connect
              条款显示，合规是一项运营流程：公司可以因紧急法律或网络安全变更缩短通常通知期，可以使用专业供应商和官方数据库验证身份及执业权利，并要求用户对健康数据的合法共享负责
              [CR004][CR005][CR006]。现有证据无法证明当前控制、认证或监管承诺是否足够，因此这些事项仍是尽调问题，不能被推定为缓释措施。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
