callouts:
  - calloutType: "insight"
    title: "SaaS Expansion Against Macro Multiple Compression"
    body: "Between 2022 and 2026, Doctolib expanded its top-line annual recurring revenue from approximately €270 million to €422 million (+56%), yet saw its cleared secondary market valuation contract by 40% from €5.8 billion to €3.6 billion. This divergence highlights how European healthtech valuation has transitioned from speculative venture multiples exceeding 20x ARR to disciplined, utility-like multiples of approximately 8.5x ARR."
    claimRefs:
      - "CM008"
      - "CM009"
  - calloutType: "risk"
    title: "Stabilization of Telemedicine Demand and Hybrid Care Realities"
    body: "During the peak of the COVID-19 pandemic, teleconsultations surged to 17% of all medical visits, fostering inflated market sizing expectations for digital-first healthcare delivery. By 2026, remote consultation rates normalized to a durable hybrid baseline of 4% to 6%, requiring healthcare software providers to anchor valuation models on core practice workflow automation and ambient clinical efficiency rather than pure telehealth visit monetization."
    claimRefs:
      - "CM013"
      - "CM014"
