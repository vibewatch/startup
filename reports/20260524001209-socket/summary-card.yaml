summary:
  headline: >
    Socket has real product-market fit in software supply chain security — strong AI/developer customer proof,
    transparent seat pricing, and a differentiated behavior-plus-reachability stack — but the May 2026 $1 billion Series
    C still looks slightly stretched on public evidence because ARR, retention, margins, burn, and cap-table terms
    remain undisclosed.
