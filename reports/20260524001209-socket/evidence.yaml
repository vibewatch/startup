evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-year
    missingEvidence: >-
      Certificate of incorporation or another canonical corporate record that resolves whether Socket should be treated
      as founded in 2020 or 2021.
    whyItMatters: Founding year is a reused company-age fact for every later chapter and should not drift across the report.
    diligencePath: >-
      Request Delaware incorporation documents or a company-approved historical timeline and reconcile public-facing
      pages before final publication.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO001
      - TO004
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-governance
    missingEvidence: A current executive roster, board list, committee structure, and any investor-designated governance rights.
    whyItMatters: >-
      The chapter can validate founder centrality but not the full governance depth or succession resilience of the
      company.
    diligencePath: >-
      Request the latest board deck or investor presentation with board composition, committee membership, and
      executive-team chart.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: investor-governance
    missingEvidence: >-
      Ownership percentages, board seats, liquidation preferences, debt facilities, and any secondary-liquidity activity
      across funding rounds.
    whyItMatters: Public round headlines show valuation momentum, but not who actually controls economic or governance outcomes.
    diligencePath: >-
      Request a current cap table, financing docs summary, and any debt or secondary schedule from the company or lead
      investor.
    relatedQuestionRefs:
      - QO015
      - QO027
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-chronology
    missingEvidence: >-
      Canonical publication dates for every major launch or acquisition, especially where readable fetches surface the
      event but not the exact timestamp.
    whyItMatters: >-
      The chronology is directionally strong, but later chapters should not over-precision date fields that remain only
      year- or month-resolved in public materials.
    diligencePath: >-
      Reconcile company blog CMS metadata or internal launch notes against the public chronology before using exact
      dates elsewhere.
    relatedQuestionRefs:
      - QO020
      - QO021
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue-arr
    missingEvidence: ARR, revenue, growth rate, and customer concentration metrics that tie operating scale to economic quality.
    whyItMatters: >-
      The company-overview chapter can validate capital raised and operating footprint, but not commercialization
      efficiency or valuation support.
    diligencePath: >-
      Request management KPI reporting, cohort ARR data, and gross-retention or net-retention disclosures from the
      finance team.
    relatedQuestionRefs:
      - QO028
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: legal-regulatory
    missingEvidence: A more exhaustive litigation and regulatory sweep tied to legal entity names, court dockets, and agency records.
    whyItMatters: >-
      No material public regulatory or litigation overhang surfaced in reviewed overview sources, but absence of
      evidence should not be treated as a clean bill of health.
    diligencePath: >-
      Run dedicated court, sanctions, and regulator searches against Socket's legal entity names and key executives
      before final recommendation work.
    relatedQuestionRefs:
      - QO026
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A credible, directly comparable 2026 software supply chain security market estimate from a methodology-transparent
      publisher.
    whyItMatters: >-
      Current public estimates mix direct category data, broader AppSec adjacency, and at least one likely over-broad
      SCA figure, which limits precision on TAM narratives.
    diligencePath: >-
      Obtain primary analyst methodology notes or paid extracts for direct SCA and software supply chain security
