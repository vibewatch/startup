  - id: TP004
    title: Distribution / switching-cost / substitute comparison
    columns:
      - Alternative class
      - Default control point
      - Why buyers stay there
      - Socket counter-position
      - Switching / multi-home dynamic
    rows:
      - - GitHub-native baseline
        - Repository, pull request, and security tab
        - Already embedded in daily development workflow with public add-on pricing
        - Specialist malicious-package detection and deeper dependency-risk signal
        - High distribution advantage for GitHub; Socket can layer but must justify extra spend
      - - Broad AppSec platform
        - Existing SAST or platform-security contract
        - One vendor can cover dependencies, code, containers, and policy
        - Cleaner specialist story for supply-chain attacks and install-time blocking
        - Multi-homing is easy, so Socket may win a slot without displacing the platform vendor
      - - Reachability-first specialist
        - Vulnerability backlog and false-positive reduction motion
        - Buyers want exploitability context and fix workflows more than new scanners
        - Socket can pair behavior signals with its own reachability, but must prove equivalent workflow impact
        - Competitive overlap is highest in noisy enterprise estates
      - - Compliance / audit-heavy incumbent
        - SBOM, license, or artifact-governance process
        - Legal and regulatory outcomes can dominate buying criteria
        - Socket wins when supply-chain malware risk matters more than documentation and attribution workflow
        - Switching tends to be low unless compliance becomes the lead use case
      - - Code-to-cloud platform
        - AppSec, CI/CD, cloud, API, and runtime visibility in one console
        - Consolidation lowers console fatigue and procurement overhead
        - Socket offers better specialist dependency depth, not full-stack coverage
        - Hardest accounts for specialists are those explicitly cutting tool count
      - - Internal build / status quo
        - Dependabot-style alerts plus internal package review policy
        - Good-enough baseline is free or already staffed
        - Socket reduces blind spots around behavior-based attacks and pre-install blocking
        - Lowest switching cost but also lowest urgency to buy
    notes: This table compares control points and buying inertia, not product quality in isolation; it is designed to surface where Socket faces default incumbency versus where it can layer in.
