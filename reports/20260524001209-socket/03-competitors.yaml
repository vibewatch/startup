  - id: TP005
    title: Moat durability / competitive risk register
    columns:
      - Socket moat / risk
      - Why it matters
      - Main threat
      - Severity
      - Mitigation / diligence ask
    rows:
      - - Behavior-based malicious-package detection
        - Distinguishes Socket from tools centered on known-vulnerability freshness alone
        - GitHub, Snyk, or platform vendors become good-enough for buyers who do not prioritize package-behavior risk
        - high
        - Quantify how often malicious-package concerns are the explicit reason Socket wins a deal
      - - Install-time firewall
        - Moves control earlier than post-merge or post-scan remediation
        - Buyers may prefer fewer agents or rely on registry, image, or workflow controls instead
        - high
        - Validate attach rate and renewal impact of Firewall versus core scanning alone
      - - Reachability-led noise reduction
        - Helps Socket compete beyond pure malware detection and into triage efficiency
        - Endor Labs and Snyk sell stronger public narratives on exploitability context and platform breadth
        - high
        - Benchmark Socket win rates in large noisy environments against Endor and Snyk specifically
      - - Transparent public pricing
        - Lowers initial adoption friction for teams that want to start small
        - GitHub keeps a lower-friction native baseline and enterprise list-to-net dynamics remain undisclosed
        - medium
        - Collect realized price and expansion paths by segment to test pricing power versus native substitutes
      - - Specialist focus
        - A sharper specialist message can outperform broader tools in supply-chain-sensitive accounts
        - Aikido, OX, Apiiro, and Upwind can absorb the same budget into larger code-to-cloud contracts
        - high
        - Measure how often consolidation mandates knock Socket out before technical evaluation
      - - Multi-home friendliness
        - Layering can help land accounts quickly
        - Easy layering also lowers switching costs and can cap long-term wallet share
        - medium
        - Request module attach, multi-product overlap, and displacement data against GitHub and Snyk
    notes: Severity reflects the likelihood of value-capture pressure over the next 12-24 months based on retained public evidence, not current churn.
