    - type: private-evidence-only
      severity: material
      topic: switching-costs
      missingEvidence: Socket win-loss, attach-rate, and overlap data by competitor class, especially versus GitHub and Snyk.
      whyItMatters: Public product pages show positioning, but they do not show whether Socket actually displaces bundled or broad-platform rivals in practice.
      diligencePath: Request pipeline-level win-loss, renewal, and multi-product overlap data segmented by GitHub-native, platform-consolidation, and reachability-led competitors.
      relatedQuestionRefs:
        - QP019
        - QP020
      relatedTableRefs:
        - TP004
    - type: missing-source
      severity: material
      topic: enterprise-pricing
      missingEvidence: Realized list-to-net pricing and discount bands for Socket, Mend, Endor Labs, JFrog Xray, OX Security, and Upwind.
      whyItMatters: Published list signals do not show whether Socket can sustain specialist pricing once buyers benchmark against native or consolidated alternatives.
      diligencePath: Collect recent enterprise quotes or procurement screenshots for comparable team sizes and normalize spend per active developer, repository, or workload.
      relatedQuestionRefs:
        - QP025
      relatedTableRefs:
        - TP003
    - type: missing-source
      severity: minor
      topic: customer-overlap
      missingEvidence: Named public migrations or overlap examples showing when buyers moved between Socket, Snyk, GitHub, Endor Labs, or Aikido.
      whyItMatters: Customer-overlap evidence would sharpen which substitute paths are most common instead of inferring overlap from positioning alone.
      diligencePath: Pull customer case studies, review-site migration comments, and public procurement references that explicitly mention replacing or layering one of these vendors.
