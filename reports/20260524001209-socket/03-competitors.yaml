  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor
      - Public list signal
      - Contract model
      - Included breadth
      - Unknowns / caveats
      - Strategic implication
    rows:
      - - Socket
        - '$0 / $25 / $50 per developer; Enterprise custom'
        - Seat-based SaaS plus separate product purchases within the same plan structure
        - Dependency security, firewall, reachability, SBOM, GitHub Actions, AI model scanning
        - Realized enterprise discounting is undisclosed
        - Transparent specialist pricing helps small teams start, but paid spend is additive against native baselines
      - - Snyk
        - Public Free / Team / Ignite / Enterprise tiers
        - Per contributing developer
        - Broad AppSec platform with SCA, code, containers, IaC, API/web
        - Exact Team and Ignite unit economics vary by product mix
        - Strong public price anchor for broad developer-first AppSec
      - - Mend
        - No public unit price on retained page
        - Per contributing developer
        - AppSec platform plus AI premium and Renovate-style automation
        - Quote-led pricing limits apples-to-apples comparisons
        - Broad-platform buyers must diligence realized list-to-net separately
      - - FOSSA
        - Free plus '$20 per project per month' Business
        - Per project with Enterprise upsell
        - License, vulnerability, SBOM, snippet, and binary workflows
        - Security depth varies by add-on and enterprise configuration
        - Transparent compliance-centric price anchor for legal and audit buyers
      - - GitHub Dependabot + GHAS
        - Dependabot alerts built-in; Secret Protection '$19' and Code Security '$30' per active committer per month
        - Add-ons inside GitHub workflow
        - Dependency monitoring, code security, and secret protection
        - Dependabot scope is limited to known-vulnerability coverage and supported ecosystems
        - Creates the clearest default price anchor in GitHub-centered accounts
      - - Chainguard
        - Starts at '$19K' for a team of 10 in Catalog
        - Licensed by engineering-org size or image / ecosystem scope
        - Hardened images and libraries with CVE remediation SLAs
        - Substitute economics depend on how much spend shifts from repos to images and libraries
        - Strong adjacent anchor for regulated container-heavy buyers
      - - Aikido
        - Public pricing with free tier and enterprise services
        - SaaS plans with optional on-prem and device / runtime extensions
        - Code, cloud, runtime, SCA, SAST, IaC, DAST, and malware detection
        - Enterprise custom terms still apply for advanced services
        - Transparent consolidation pitch can undercut specialist tool sprawl
      - - OX Security
        - Public message is 'one platform, one price, one license'
        - Per developer
        - Code-to-cloud platform with SAST, SCA, SBOM, CI/CD, runtime, and pentesting
        - Retained sources do not expose public numeric list price
        - Consolidation story matters more than list price transparency
      - - JFrog Xray
        - Pricing sits inside Pro X, Enterprise X, and Enterprise+ subscriptions
        - Platform-bundled subscription
        - Repo, build, container, artifact, SBOM, and compliance scanning
        - Retained pricing source does not expose a clean Xray-only unit price
        - Platform bundling can be compelling where Artifactory is already entrenched
    notes: This table intentionally separates public numeric anchors from quote-led or platform-bundled offers. Missing list prices remain diligence items rather than estimates.
