tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Class
      - Primary overlap with Socket
      - Pricing / packaging signal
      - Best-fit buyer
      - Key limitation vs. Socket
    rows:
      - - Socket
        - Specialist dependency and supply-chain security
        - Behavior-based package risk, firewall, and reachability-led triage
        - Free '$0', Team '$25', Business '$50', Enterprise custom per developer
        - Developer-first teams that want malicious-package blocking plus CVE noise reduction
        - Narrower code, cloud, and runtime breadth than platform consolidators
      - - Snyk
        - Broad AppSec / SCA platform
        - Dependencies plus code, container, IaC, API/web, and AI workflows
        - Free, Team, Ignite, and Enterprise tiers priced per contributing developer
        - Polyglot development orgs standardizing on one vendor across the SDLC
        - Less specialized install-time malware-blocking story than Socket
      - - Mend
        - Enterprise AppSec plus Renovate-style automation
        - Reachability-driven SCA, AI-code controls, and automated dependency updates
        - Quote-led per-contributing-developer model
        - Large AppSec programs that want one vendor for code, dependencies, and remediation automation
        - Less public pricing transparency and less specialist Socket-style brand around package behavior
      - - Endor Labs
        - Reachability-first / AI-native AppSec
        - Full-stack reachability, evidence-backed findings, and policy customization
        - Free developer tools; enterprise platform by demo / quote
        - Enterprises drowning in false positives and prioritization noise
        - Less public price transparency and less focused install-time blocking story than Socket
      - - JFrog Xray
        - Artifact and registry-centric SCA incumbent
        - Repo, build, container, SBOM, license, and malicious-package scanning inside JFrog Platform
        - Bundled in Pro X, Enterprise X, and Enterprise+ platform tiers
        - DevOps and platform teams standardizing on Artifactory and artifact governance
        - Stronger where the registry is the control point than in repo-native developer workflows
      - - FOSSA
        - Compliance and license platform
        - SBOM, license, snippet, and binary scanning with security add-ons
        - Free, '$20 per project per month' Business, Enterprise custom
        - Legal, compliance, and audit-heavy organizations
        - Less emphasis on pre-install malicious-package blocking than Socket
      - - GitHub Dependabot + GHAS
        - Native GitHub substitute
        - Known-vulnerability alerts, code security, and secret protection in the repo workflow
        - Dependabot is built-in; GHAS add-ons are '$19' and '$30' per active committer per month
        - GitHub-centered teams seeking the lowest-friction default
        - Coverage is more native and convenient than specialist on dependency behavior
      - - Apiiro
        - ASPM and software-supply-chain platform
        - Risk graph, contextual SCA, secure-by-design, and XBOM generation
        - Demo-led platform sale
        - Security teams wanting deep application context and programmatic workflows
        - Indirect substitute rather than a pure dependency-security specialist
      - - Aikido
        - Unified developer-to-runtime security platform
        - SCA, SAST, IaC, DAST, container, cloud, runtime, and malware detection in one platform
        - Public pricing with free tier and enterprise add-ons
        - Teams consolidating multiple point tools under one contract
        - Broader but less focused on Socket's specific package-behavior niche
      - - OX Security
        - Code-to-cloud AppSec platform
        - One license across SAST, SCA, SBOM, CI/CD security, runtime, and pentesting
        - One platform and one price, priced per developer
        - Mature AppSec programs consolidating scanners and delivery-stack controls
        - Less direct category equity than Socket in dependency-security specialist buying
      - - Chainguard / Upwind
        - Adjacent supply-chain and runtime substitutes
        - Trusted images and libraries, or runtime-first cloud and AI security with SCA/SBOM
        - Chainguard starts at '$19K' for a 10-person catalog team; Upwind is demo-led
        - Regulated container-heavy teams or cloud-security buyers broadening left
        - Substitute value comes from a different control point than Socket's repo-centric workflow
    notes: Public pricing and packaging cells use only retained current vendor pages; quote-led categories are labeled as such instead of estimated.
