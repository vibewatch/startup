company:
  name: Socket
chapter:
  number: 8
  title: Valuation
summary: Socket’s $1 billion May 2026 Series C is plausible only if the company has already converted its large protected-developer footprint into roughly $50 million-plus of high-quality ARR or can sustain a private-market premium closer to Wiz than to mature public DevSecOps comps. Public evidence shows strong category timing, blue-chip customers, rapid product expansion, and prior revenue tripling, but it still omits ARR, retention, gross margin, burn, and cap-table terms. That makes the round defendable yet slightly ahead of what public disclosures alone prove.
sections:
- id: financing-context-and-scale-proof
  title: Financing context and scale proof
  body: 'Socket’s May 2026 Series C is easy to describe and harder to underwrite. The observable part is strong: the company said it raised $60 million at a $1 billion valuation, bringing total funding to roughly $125 million and adding Thrive Capital, a16z, Abstract Ventures, and Capital One Ventures to a high-quality syndicate. Public operating proof is stronger than a typical Series C as well. Socket discloses recognizable customers such as Anthropic, xAI, Figma, Vercel, and Mercado Libre; its homepage claims 27,000+ protected organizations, 300,000+ protected repositories, 1.5 million trusted developers, 11.6 million secured commits per month, and more than 10,000 blocked attacks per week. The 2025 Coana acquisition adds a second important signal: Socket said revenue had more than tripled over the prior year and used the transaction to bring reachability analysis into the platform, a feature set meant to cut alert noise and move the product beyond basic SCA. Those are credible reasons
    investors would pay a premium for category leadership in software supply-chain security as AI coding expands the volume of third-party code entering production.


    The underwritten part is still opaque. Public sources do not disclose ARR, net retention, gross margin, cash burn, or the cap-table waterfall that determines whether a $1 billion enterprise value is actually attractive to new money. That makes the round price defendable as a strategic category bet, but not fully proven as a fundamentals-backed bargain.'
