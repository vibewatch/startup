  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-arr-and-unit-economics
    missingEvidence: Current ARR, growth, NRR, gross margin, and burn-efficiency metrics by product and plan tier.
    whyItMatters: These numbers determine whether $1B is fair on software multiples or merely a premium category bet.
    diligencePath: Request the latest CFO dashboard, board package, and management accounts covering ARR bridge, retention, gross margin, and cash burn.
    relatedQuestionRefs:
    - QV031
  - type: private-evidence-only
    severity: material
    topic: paid-seat-conversion
    missingEvidence: Paid-customer count, protected-versus-paid developer conversion, enterprise seat counts, ACV mix, and attach rates for premium modules.
    whyItMatters: Socket’s disclosed footprint is large, but the valuation turns on how much of that footprint pays meaningful recurring revenue.
    diligencePath: Request cohort tables by plan, customer size, paid seats, ARPU, and module attach rates.
    relatedQuestionRefs:
    - QV020
    - QV021
    - QV031
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-waterfall
    missingEvidence: Fully diluted cap table, liquidation preferences, option pool dilution, and any 2024-2026 secondary or tender economics.
    whyItMatters: A defendable enterprise value can still produce poor investor returns if structured terms absorb value near the round price.
    diligencePath: Review financing documents, the current cap table, 409A materials, and any secondary transaction summaries with finance and counsel.
    relatedQuestionRefs:
    - QV032
    relatedTableRefs:
    - TV005
    - TV006
  - type: conflicting-data
    severity: minor
    topic: operating-metric-drift
    missingEvidence: A reconciled methodology for how Socket defines protected organizations, repositories, developers, and attacks blocked across 2025-2026 disclosures.
    whyItMatters: Metric-definition drift reduces confidence when using top-of-funnel operating proof as a valuation proxy.
    diligencePath: Ask management to reconcile homepage, acquisition, and product-metric definitions in one operating KPI deck.
    relatedQuestionRefs:
    - QV003
    - QV031
  - type: enumeration-incomplete
    severity: minor
    topic: private-comparable-set
    missingEvidence: More 2025-2026 private developer-security and supply-chain comparables with disclosed ARR and valuation.
    whyItMatters: The current private comp set is decision-useful but thin, which makes the premium end of the valuation range more assumption-heavy than the public-comp floor.
    diligencePath: Request banker screens or secondary-market comps covering other developer-security and software-supply-chain vendors with current ARR estimates.
    relatedQuestionRefs:
    - QV016
    - QV017
    - QV018
    relatedTableRefs:
    - TV004
