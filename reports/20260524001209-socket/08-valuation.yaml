- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Covers the most decision-relevant public and private cyber/devtools valuation anchors with retained May 2026 or latest available revenue evidence. Private comparables remain partial because most do not disclose current ARR regularly.
  columns:
  - Comparable
  - Status
  - Revenue / ARR anchor
  - Valuation / market cap
  - Implied multiple
  - Relevance
  - Limitation
  rows:
  - - GitLab
    - Public DevSecOps platform
    - $955.2M FY2026 revenue
    - $4.51B market cap
    - ~4.7x
    - Public floor for developer tooling with security inside a broader platform
    - Public-market multiple reflects slower growth and broader product scope.
  - - SentinelOne
    - Public cyber platform
    - $1.001B FY2026 revenue
    - $6.38B market cap
    - ~6.4x
    - Public cyber mid-band for scaled but still loss-making security software
    - Closer to endpoint security than supply-chain developer workflows.
  - - JFrog
    - Public software supply chain / DevSecOps
    - $628M-$632M FY2026 revenue guide
    - $8.96B market cap
    - ~14.2x
    - Most relevant public comp for securing the software delivery chain
    - Uses forward guidance rather than a completed fiscal year.
  - - Palo Alto Networks
    - Scaled public cyber platform
    - $9.2B FY2025 revenue
    - $211.33B market cap
    - ~23.0x
    - Shows premium investors pay for broad security platforms with strong distribution
    - Far larger, more diversified, and more mature than Socket.
  - - Wiz
    - Private premium cloud-security comp
    - ~$350M ARR (2024)
    - $12B valuation
    - ~34.3x
    - Upper-bound private premium for a fast-scaling security leader
    - Different product scope and much larger disclosed ARR base.
  - - Chainguard
    - Private software supply-chain comp
    - $40M ARR with >$100M near-term target
    - $3.5B valuation
    - ~87.5x current / ~35x target
    - Closest hypergrowth software-supply-chain valuation reference
    - Outlier multiple and 2025 disclosure, not a stable median comp.
  notes: Comparable math is meant to bracket what ARR Socket would need to justify $1B, not to imply one perfect peer exists.
