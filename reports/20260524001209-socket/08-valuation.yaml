- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Category timing
    - AI coding and rising package risk push software supply-chain security higher on the enterprise agenda.
    - Category urgency does not automatically convert into durable paid seat growth.
    - Show enterprise conversion, renewal, and expansion data tied to AI-driven adoption.
  - - Product differentiation
    - Coana reachability, Firewall, and rapid 2025-2026 feature expansion support a premium platform narrative.
    - Buyers may still see Socket as a point solution if premium modules do not raise ACV materially.
    - Disclose attach rates and ACV uplift from reachability, patches, and firewall.
  - - Commercial proof
    - Blue-chip customer logos and 27,000+ protected orgs imply real market pull.
    - Free/open-source usage can inflate footprint versus paid revenue.
    - Split protected users, paid seats, and enterprise ACV by plan tier.
  - - Comparable support
    - JFrog, PANW, and Wiz show the market will pay premium multiples for strong developer-security platforms.
    - GitLab and SentinelOne show the public market also rerates toward much lower revenue multiples quickly.
    - Provide current ARR, NRR, gross margin, and growth to place Socket credibly inside the comp band.
  - - Competition
    - Socket’s developer-first workflow and threat research cadence create real product identity.
    - GitHub bundles AppSec inside native workflows and Copilot is becoming the AI-era developer control plane.
    - Show win rates versus GHAS and evidence of durable workflow ownership in large accounts.
  notes: The anti-thesis is centered on monetization and bundling pressure rather than on demand denial.
