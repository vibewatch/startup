    {
      "id": "unit-economics-and-cost-structure",
      "title": "Unit-economics proxies and cost-structure clues",
      "body": "Public unit-economics evidence is mostly proxy-based, but the proxies point toward software-like rather than asset-heavy economics. Socket sells cloud-delivered analysis, seats, and premium workflow features instead of hardware, inventory, or project-finance-heavy assets. The pricing page’s developer-based packaging and enterprise support features suggest that gross margin will depend more on compute, data processing, support, and go-to-market efficiency than on physical delivery costs. The same page also reveals layered upsell paths such as compliance integrations, audit logs, SBOM workflows, reachability, private Slack channels, and named account managers, all of which imply some incremental service-delivery burden for larger accounts. Coana matters financially because its reachability technology is positioned to reduce false positives and remediation time; if those claims hold, the acquisition could raise product value and retention without changing Socket’s basic software cost structure. Still, the company does not publish CAC, payback, gross margin, support ratios, or NRR, so public analysis stops at directional inference rather than a defensible unit-economics model.",
