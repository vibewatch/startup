    {
      "id": "capital-adequacy-and-valuation-implications",
      "title": "Capital adequacy, financing history, and valuation implications",
      "body": "Capital formation is much clearer than capital adequacy. Official May 2026 disclosures, legal coverage, and independent reporting align on a $60 million Series C at a $1 billion valuation led by Thrive Capital, with participation from Andreessen Horowitz, Abstract Ventures, and Capital One Ventures. Socket’s own blog says that round brought total funding to $125 million. Earlier public coverage shows a $40 million Series B in October 2024 led by Abstract Ventures, which had taken total funding to $65 million, and analyst databases point to a first round in May 2022. The read-through is that Socket has raised a substantial equity cushion in under two years, and the cap table includes recognizable venture firms and angels. But outsiders still cannot verify the cash model. There is no public cash balance, burn, runway bridge, or debt schedule. The valuation therefore looks like a confidence trade on customer quality, AI-driven demand, and product breadth rather than a publicly auditable margin or cash-flow story. Coana adds a strategic use-of-capital signal, but even that deal’s consideration is undisclosed.",
