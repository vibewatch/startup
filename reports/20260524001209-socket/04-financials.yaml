    {
      "id": "adverse-lens-and-disclosure-blockers",
      "title": "Adverse lens and disclosure blockers",
      "body": "The adverse financial lens on Socket is not visible distress; it is disclosure quality. Public sources can substantiate the round sizes, investor roster, list pricing, customer logos, and growth rhetoric, but they cannot underwrite revenue quality or downside resilience. Third-party market-data sites offer partial substitutes, yet they introduce noise: ZoomInfo models about $18.1 million of revenue and 51-200 employees, Tracxn shows a Series C company with $125 million raised but hides key figures, and Scamadviser simultaneously reports a trust score of zero while also saying the site is likely legitimate. Even Socket’s own surfaces are not perfectly consistent, with the About page saying the company was founded in 2021 while multiple funding materials say 2020. Acquisition economics are also incomplete: official and independent coverage agree that Coana was acquired in April 2025, but purchase price and integration cost remain undisclosed, and the few published revenue-growth or purchase-price estimates appear to be syndicated or speculative. The chapter verdict is therefore constructive but incomplete: recurring software revenue appears plausible, capital intensity looks modest, and investor support is strong, yet serious underwriting still needs management-only data.",
