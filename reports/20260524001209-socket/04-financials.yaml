  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Socket now presents a credible private-company growth narrative around a May 2026 $60 million Series C at a $1 billion valuation, transparent per-developer pricing, and expanding enterprise traction, but it still withholds the core underwriting inputs: realized revenue, margin, burn, runway, retention, and concentration. Public evidence supports a capital-light software model with strong investor backing and M&A ambition, yet the valuation still rests more on growth signals and customer quality than on auditable financial disclosure."
  },
  "sections": [
    {
      "id": "pricing-traction-and-revenue-shape",
      "title": "Pricing model, traction, and revenue shape",
      "body": "Socket’s public monetization surface is unusually legible for a private security startup even though its realized economics remain opaque. The pricing page shows a per-developer SaaS model with a $0 Free tier, a $25 Team tier, a $50 Business tier, and custom Enterprise contracts, plus annual prepay discounts, startup discounts, marketplace procurement, and manual invoicing for large accounts. That structure implies recurring subscription revenue rather than services-led monetization, but it does not reveal actual ACV, discounting, or renewal quality. The strongest traction signals come from Socket’s own May 2026 Series C materials and homepage: more than 27,000 organizations protected, 1.5 million repositories, 11.6 million commits secured monthly, and more than 10,000 blocked attacks per week. Those metrics, combined with named customers such as Anthropic, xAI, Replit, Cursor, Figma, Vercel, Gusto, Mercado Libre, and Cribl, support demand and enterprise relevance. What remains missing is the core revenue ledger: no official ARR, GAAP revenue, gross margin, or retention disclosures are public.",
