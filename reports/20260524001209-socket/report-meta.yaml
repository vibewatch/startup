companyProfile:
  summary: >
    Socket is a San Francisco software supply chain security company led by founder-CEO
    Feross Aboukhadijeh. Socket's About page says it was founded in 2021, though several
    2026 funding materials say 2020. The company sells a developer-first platform across
    GitHub, CLI, VS Code, Firewall, API, and SDK workflows to block malicious packages,
    surface dependency risk before merge or install, and now triage CVEs with Coana-derived
    reachability analysis. Public May 2026 materials say Socket protects more than 27,000
    organizations, 1.5 million repositories, and 11.6 million commits per month, with
    customers including Anthropic, xAI, Replit, Cursor, Figma, Vercel, Gusto, Mercado
    Libre, and Cribl. The May 2026 Series C valued Socket at $1 billion and brought total
    disclosed funding to $125 million. Public disclosures still do not provide ARR, gross
    margin, NRR, burn, or paid-seat conversion.
  foundedDate: "2021-01-01"
  founders:
    - name: "Feross Aboukhadijeh"
      role: "Founder and CEO"
      background: "Open-source developer and security founder behind WebTorrent, StandardJS, Node.js governance work, and Stanford teaching."
      claimRefs: [CO006, CO007]
  foundingLocation: "San Francisco, California (public materials consistently place Socket there; separate founding-location disclosure not found)"
  headquarters: "San Francisco, California, USA"
  productSummary: >
    Developer-workflow security platform for open-source dependencies spanning a GitHub App,
    CLI, VS Code extension, Socket Firewall, REST API, and SDKs. The core product combines
    behavior-based package and maintainer analysis with install-time blocking and Coana-derived
    reachability analysis; enterprise tiers add compliance integrations, SBOM workflows,
    SSO/SAML, audit logs, custom policy, and broader ecosystem coverage.
  customerFocus: >
    AI-native, cloud, and security-conscious software teams that want dependency protection
    inside existing GitHub-centric workflows; typical buyers are CISOs, security engineering,
    or platform-security leaders, while day-to-day users are developers and platform engineers.
  businessModel: >
    Subscription SaaS priced per active developer: Free for open-source use, Team at $25 per
    developer per month, Business at $50 per developer per month, and Enterprise custom.
    Socket lands through self-serve GitHub deployment and expands into enterprise controls,
    reachability, firewall, compliance workflows, and marketplace procurement.
  stage: "Series C / late-stage private (May 2026 $1B round)"
  fundingStatus: >
    Socket raised a $40 million Series B in October 2024 and a $60 million Series C in May 2026,
    bringing total disclosed funding to $125 million. The Series C was led by Thrive Capital
    with participation from Andreessen Horowitz, Abstract Ventures, and Capital One Ventures;
    public company materials also highlight backing from Elad Gil, Bret Taylor, and Patrick and
    John Collison.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO005, CO006, CO009, CO011, CO012, CO018, CO022, CO024, CE019, CE025, CI008, CI019, CU002, CI029]

summary:
  headline: >
    Socket has real product-market fit in software supply chain security — strong AI/developer
    customer proof, transparent seat pricing, and a differentiated behavior-plus-reachability
    stack — but the May 2026 $1 billion Series C still looks slightly stretched on public evidence
    because ARR, retention, margins, burn, and cap-table terms remain undisclosed.
  overallScore: 6.4
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 125
    customerCount: null
    headcount: 100
  topStrengths:
    - "Behavior-first dependency security plus Coana reachability gives Socket a differentiated workflow story versus CVE-only tooling and may materially reduce alert noise."
    - "Customer proof is unusually strong for the stage, with public references spanning Anthropic, xAI, Replit, Cursor, Vercel, Figma, Gusto, Mercado Libre, Cedar, JumpCloud, Render, and JupiterOne."
    - "Distribution is developer-friendly: GitHub-native rollout, free open-source entry, transparent Team/Business pricing, and self-serve-to-enterprise expansion paths."
    - "Product cadence is high, with 2025-2026 expansion across Firewall, reachability, PHP/Composer, OpenVSX, Jira, Data Exports, and AI-tool or MCP coverage."
    - "High-quality investors and a capital-light SaaS delivery model give Socket room to keep scaling without hardware or inventory risk."
  topRisks:
    - "The $1B round is hard to underwrite because public evidence still omits ARR, paid-customer count, NRR, gross margin, burn, and cap-table preference terms."
    - "GitHub-native bundling and broader AppSec platforms such as Snyk can compress monetization if Socket cannot sustain clearly better signal quality and workflow fit."
    - "Public proof remains strongest in GitHub/npm- and JavaScript-heavy environments; docs and external testing show weaker or uneven evidence outside the best-documented ecosystems."
    - "Alert-noise risk is real: Socket itself warns AI-assisted detection can create false positives, and public issues or reviews show some benign-package or coverage complaints."
    - "The legal and compliance surface lags the product surface, including a privacy policy last updated in 2022 and limited public visibility into contract liability or indemnity terms."
  unresolvedGaps:
    - "Current ARR or GAAP revenue and paid-versus-free developer conversion; the $1B valuation is highly sensitive to whether monetized ARR is already in the mid-tens of millions."
    - "Net revenue retention, gross margin, burn efficiency, and runway; no public source provides the core durability metrics needed to test software-quality economics."
    - "Fully diluted cap table, liquidation preferences, and any secondary-liquidity terms from the Series C."
    - "Coana purchase price, integration cost, and measurable post-acquisition upsell or retention impact."
    - "Cross-ecosystem product parity and large-enterprise proof outside the clearest GitHub/npm- or JavaScript-heavy deployments."
    - "Whether the very large organizations-protected and repository counts translate into durable paid-customer concentration and renewal quality."

disclaimer: >
  This diligence report is based solely on publicly available information as of 2026-05-24 and
  does not constitute investment advice. Socket is a private company, and several key financial
  and contractual inputs — including ARR, GAAP revenue, gross margin, NRR, burn, cap-table terms,
  and paid-customer counts — are not publicly disclosed. Company-claimed operating metrics,
  customer lists, and product-performance claims may not map directly to paid revenue or audited
  results. Analytical judgments and valuation ranges should therefore be treated as directional,
  not definitive.
