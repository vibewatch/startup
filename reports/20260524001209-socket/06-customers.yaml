tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / User / Payer
      - Representative proof
      - Primary use case
      - Strategic value
      - Key gap
    rows:
      - - AI research labs and agent builders
        - >-
          Buyer: CISO / security engineering; Users: researchers and infrastructure engineers;
          Payer: central security budget
        - Anthropic, xAI, Cursor
        - Approve new dependencies faster without losing zero-day supply-chain visibility
        - High strategic value because AI coding and research velocity amplify third-party code risk
        - xAI and Cursor are logo-only in public proof; no contract or deployment detail
      - - Developer tools and cloud platforms
        - >-
          Buyer: security lead / head of security; Users: platform and application developers;
          Payer: platform engineering or security
        - Replit, Vercel, Render
        - >-
          Inline PR-time protection, dependency hygiene, monorepo control, developer-friendly
          rollout
        - Strong fit because GitHub-native rollout minimizes friction for fast release cycles
        - Little public evidence on contract size or renewal economics
      - - Compliance, identity, and security platforms
        - >-
          Buyer: CISO / security engineering director; Users: AppSec, DevSecOps, developers; Payer:
          security/compliance
        - JumpCloud, Drata, JupiterOne
        - Reachability, license policy, SBOMs, CI/CD enforcement, audit evidence
        - >-
          Important because Socket expands from scanning into governance and customer-assurance
          workflows
        - Most proof is curated case-study content rather than independent procurement evidence
      - - Regulated software and healthcare platforms
        - >-
          Buyer: product security / security ops; Users: developers and compliance stakeholders;
          Payer: security or platform org
        - Cedar, Doctolib, Gusto
        - Lower-noise dependency security plus compliance support and auditor-friendly evidence
        - Shows fit where auditability and patient/financial-data controls matter
        - Gusto is logo-only; public evidence is far thinner than for Cedar or Doctolib
      - - Open-source, crypto, and web3 ecosystems
        - >-
          Buyer: platform / security lead; Users: OSS maintainers and senior reviewers; Payer:
          platform/security
        - Chia, MetaMask
        - >-
          Vet community-contributed dependencies and large dependency trees without manual review
          bottlenecks
        - Useful proof that Socket can operate in very public codebases with contributor volume
        - Public record is still centered on JavaScript-heavy environments
      - - Large internet platforms and enterprise technology groups
        - >-
          Buyer: security, platform, or product leadership; Users: developers and review teams;
          Payer: central engineering or security
        - Mercado Libre, SHI, Fortune 100 finance/media logos
        - Centralized dependency screening, minimal-access rollout, and early threat blocking
        - Suggests Socket can sell above startup scale into large engineering organizations
        - Mercado Libre and unnamed Fortune 100s lack public deployment depth or measured outcomes
    notes: >-
      Rows group customers by buying context and workflow rather than by disclosed ARR because
      Socket does not publish a segment revenue mix. Logo-only accounts are separated from accounts
      with case-study depth.
