  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration / execution risk
      - Impact
      - Diligence path
    rows:
      - - GitHub App or PR-check initial rollout
        - >-
          Heavy dependence on GitHub-centric workflows may limit fit in heterogeneous SCM
          environments
        - Strong acquisition wedge but platform-concentration risk
        - Break down revenue by SCM, package ecosystem, and deployment model
      - - API, reachability, and CI/CD policy expansion
        - Buyers may stop at tactical scanning if governance depth is not required
        - Upsell depends on proving value beyond noisy-alert reduction
        - Request attach-rate by module and customer segment
      - - "Compliance workflows: SBOM, Vanta, audits, license policy"
        - Integration fragility such as Vanta token revocation can weaken trust
        - Useful cross-sell motion into compliance-led budgets
        - Ask for active integration usage, breakage rates, and expansion win rates
      - - AI-native and developer-tooling customer density
        - Public brand is concentrated in a hot but relatively narrow buyer cohort
        - >-
          Positive category leadership, but risk if AI-native teams standardize on platform-native
          tools
        - Request revenue share from AI-native logos and top-ten accounts
      - - Logo-led awareness from marquee accounts
        - xAI, Cursor, Figma, Gusto, and Mercado Libre remain logo-only in reviewed public proof
        - Can overstate production depth if not separated from measured deployments
        - Request deployment stage, contract size, and referenceability for marquee logos
      - - Broad platform-footprint metrics
        - >-
          27,000 organizations protected may overstate commercial depth if free or incident-driven
          usage is large
        - Could mask concentration or weak paid conversion
        - Request paid-customer count, free-to-paid conversion, and segment ARR mix
    notes: >-
      Expansion here refers to product-surface depth after initial rollout, not to disclosed net
      revenue retention. Concentration risks are public-record gaps that need management disclosure
      rather than assumptions.
    claimRefs:
