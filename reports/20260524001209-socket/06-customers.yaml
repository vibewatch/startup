company:
  name: Socket
chapter:
  number: 6
  title: Customers
  summary: >-
    Socket's public customer proof is strongest in AI-native and security/compliance-heavy software
    teams. Official May 2026 materials claim growth from 7,500 to more than 27,000 organizations
    protected and list Anthropic, xAI, Replit, Cursor, Vercel, Figma, Gusto, Mercado Libre, and
    Cribl among customers, while case studies provide quantified workflow wins at Anthropic, Cedar,
    and Chia. Durability looks promising through GitHub-native adoption and compliance-led
    expansion, but the public record still lacks paid-customer counts, NRR/GRR, and top-customer
    concentration, while independent testing flags Java-coverage risk and review sources keep
    pointing to npm/GitHub concentration.
sections:
  - id: customer-base-and-buyer-profile
    title: Customer base and buyer profile
    body: >-
      Socket's customer evidence points to a developer-centric but security-budget-led buying
      motion. The strongest public references sit in AI-native, cloud, identity, compliance, and
      security-conscious software organizations rather than in broad offline enterprises [CU002,
      CU004]. Official May 2026 materials say Socket protects more than 27,000 organizations, 1.5
      million repositories, and 11.6 million commits per month, but those are platform-footprint
      metrics rather than disclosed paid-customer counts [CU001, CU024, CU026]. The named-logo set
      highlighted by Socket's funding announcement and press release includes Anthropic, xAI,
      Replit, Cursor, Vercel, Figma, Gusto, Mercado Libre, and Cribl, plus unnamed Fortune 100
      companies in financial services and global media [CU002].


      Across case studies, the budget owner is usually the CISO, head of security, security
      engineering leader, or platform-security lead, while day-to-day users are developers and
      platform engineers who receive PR comments, GitHub checks, or API-driven approval results
      directly inside their existing workflow [CU005, CU006]. The deployment motion is notably
      lightweight: Replit, JumpCloud, SHI, Render, and GitHub Marketplace materials all describe
      GitHub App or GitHub-check rollout as the initial wedge, with little change-management burden
      [CU007, CU041]. That low-friction motion appears especially well matched to fast-moving
      engineering teams that care about supply-chain risk but cannot afford large manual review
      queues.


      Public segmentation is therefore less about company size than about code-intensity and
      governance pressure. AI labs need faster dependency approval, cloud platforms want lower-noise
      dependency hygiene, compliance vendors want audit evidence, and open-source or crypto projects
      need review tooling that works with large dependency trees and contributor volume [CU008,
      CU012, CU016, CU021, CU042].
