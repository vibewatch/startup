  - id: TU006
    title: Independent review and skeptical signal table
    columns:
      - Source
      - Signal type
      - Observation
      - Customer impact
      - Counterpoint / remaining ask
    rows:
      - - Medium (Jan 2025 test)
        - Adverse product-quality signal
        - >-
          Tester reported Java dependencies that failed to appear in UI or PR comments even after
          support acknowledged one bug
        - Potential false sense of security for buyers assuming broad ecosystem coverage
        - Need updated independent validation on Java and other non-core ecosystems
      - - AppSecSanta
        - Independent review
        - >-
          Praises behavioral detection and GitHub PR integration but says Socket should complement,
          not replace, classic CVE scanners
        - Supports positioning as proactive layer rather than complete platform replacement
        - Ask how often customers pair Socket with another SCA tool in production
      - - ToolRadar
        - Review aggregator
        - >-
          Highlights 4.6/5 aggregate signal but notes newer platform, npm focus, learning curve, and
          paid enterprise features
        - Suggests fit is best for growing technical teams rather than every enterprise buyer
        - Need verified customer references outside npm-heavy organizations
      - - MakerStack
        - Independent analyst-style review
        - >-
          Rates product 7.4/10 and says JavaScript remains the strongest ecosystem with no
          self-hosted option
        - May slow adoption for regulated or non-cloud buyers
        - Ask for roadmap and attach rate in Java, Ruby, Rust, and self-hosted-sensitive accounts
      - - Socket Vanta documentation
        - Vendor-documented caveat
        - >-
          OAuth tokens are often revoked, which can make compliance synchronization appear broken
          until re-authorized
        - Compliance-led buyers may face operational friction even after deployment
        - Ask for token-revocation frequency and mitigation roadmap
    notes: >-
      This table deliberately mixes positive and skeptical outside-in signals so the chapter does
      not rely only on vendor-selected customer stories.
    claimRefs:
