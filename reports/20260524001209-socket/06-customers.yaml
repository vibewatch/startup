  - id: retention-voice-and-operations
    title: Retention proxies, voice of customer, and operating friction
    body: >-
      Socket does not publicly disclose NRR, GRR, contract length, logo retention cohorts, or
      customer-count conversion from free/open-source usage into paid enterprise accounts [CU026,
      CU035]. As a result, public durability has to be inferred from workflow stickiness, review
      sentiment, and evidence of deeper operational embedding. Those proxies are directionally
      positive. Render says Socket has remained in pull requests for years because it stays
      low-noise; JumpCloud feeds it into internal scoring across 50 teams and 600-plus repositories;
      JupiterOne treats it as a CI/CD policy gate; Replit and Doctolib connect it to compliance
      evidence and customer assurance [CU017, CU018, CU019, CU040].


      Independent reviews are also mostly favorable, though less rigorous than the named case
      studies. AppSecSanta, ToolRadar, Startupik, and MakerStack all frame Socket as differentiated
      by behavioral analysis, PR-level feedback, and proactive supply-chain detection rather than
      classic CVE matching [CU027]. At the same time, those same reviews keep noting that the
      platform is still maturing, is strongest in npm or JavaScript-heavy environments, and works
      best alongside a traditional CVE scanner rather than as a total replacement [CU028, CU038].


      The adverse evidence matters. A January 2025 Medium test reported Java dependencies that
      failed to appear in Socket's UI or PR comments even after support acknowledged and partially
      fixed a reported issue, arguing this could create a false sense of security if buyers assume
      universal ecosystem coverage [CU029]. Socket's own Vanta-integration docs also note that OAuth
      tokens are often revoked, which can create synchronization gaps for compliance users until the
      connection is re-authorized [CU030]. These issues do not negate the strong GitHub-native
      customer references, but they do qualify the retention story: the product is easiest to
      underwrite where GitHub, JavaScript/Python, and low-friction developer workflows are core to
      the buyer environment [CU038].
    claimRefs:
