figures:
  - id: FU001
    title: Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      Public case studies show a repeatable motion from GitHub-native trial to governance and
      compliance expansion.
    approximationNotes: >-
      Stages are synthesized from public case studies and marketplace/docs material. Timing and
      internal procurement steps are not publicly disclosed; the figure maps sequence rather than
      duration.
    data:
      nodes:
        - label: Discovery and lightweight evaluation
          description: >-
            Security or platform lead discovers Socket through threat research, marketplace listing,
            peer recommendation, or incident-driven urgency.
          actors: CISO, Head of Security, Security Engineering lead
          examples: GitHub Marketplace copy, Vercel evaluation, Render peer recommendation
        - label: GitHub-native initial rollout
          description: >-
            Customer enables the GitHub App or GitHub check so developers receive dependency
            feedback inside pull requests with minimal process change.
          actors: Security engineer, application developers, platform engineers
          examples: Replit, Cedar, JumpCloud, SHI, Render
        - label: Policy tuning and precision controls
          description: >-
            Customer adds thresholds, reachability, phased rollout, or API-based approval logic to
            reduce noise and automate acceptable dependency decisions.
          actors: Security engineering, AppSec, platform team
          examples: Anthropic API workflow, Vercel phased rollout, JupiterOne CI policy
        - label: Governance and compliance embed
          description: >-
            Socket becomes part of SBOM, license, audit, or compliance evidence workflows and feeds
            customer-assurance or internal control processes.
          actors: Security, compliance, legal, audit stakeholders
          examples: JumpCloud SBOMs, Replit Vanta flow, Doctolib audits
        - label: Surface expansion and platformization
          description: >-
            Customer expands from repo scanning into dependency search, firewall, browser-extension,
            or developer-endpoint protection across the engineering estate.
          actors: Security leadership, developer platform, IT / endpoint security
          examples: MetaMask historical dependency search, JumpCloud Firewall, Secure Annex roadmap
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU012
      - CU016
      - CU018
      - CU031
      - CU041
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      The public expansion path starts with PR-time scanning and deepens into policy, compliance,
      and endpoint coverage.
    approximationNotes: >-
      This is a qualitative deployment flow, not a quantified conversion funnel. Public sources do
      not disclose win rates or stage counts.
    data:
      nodes:
        - id: f1
          label: Evaluate risk gap
          detail: >-
            Buyer identifies that CVE-only tooling misses malicious-package or transitive-dependency
            risk.
        - id: f2
          label: Install GitHub App / check
          detail: Socket is rolled out in GitHub with low setup effort and immediate PR visibility.
        - id: f3
          label: Reduce noise and automate decisions
          detail: >-
            Reachability, thresholds, or API scoring reduce manual review effort and false
            positives.
        - id: f4
          label: Embed in compliance and SDLC controls
          detail: >-
            License checks, SBOMs, Vanta sync, or CI policy gates become part of everyday
            governance.
        - id: f5
          label: Expand to broader developer surface
          detail: >-
            Customer adopts dependency search, firewall, browser-extension, or adjacent protection
            layers.
      edges:
        - from: f1
          to: f2
          label: initial wedge
        - from: f2
          to: f3
          label: prove signal quality
        - from: f3
          to: f4
          label: justify governance use
        - from: f4
          to: f5
          label: land-and-expand
    claimRefs:
      - CU007
      - CU011
      - CU031
      - CU032
      - CU033
      - CU041
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Public evidence quality varies widely between quantified case studies and marquee logos with
      little disclosed deployment depth.
    approximationNotes: >-
      Ratings are qualitative assessments of public evidence depth. Strong means named deployment
      plus concrete workflow or outcome detail; weak means logo mention with little or no deployment
      detail.
    data:
      columns:
        - Outcome specificity
        - Deployment detail
        - Expansion signal
        - Independent corroboration
      rows:
        - label: Anthropic
          values:
            - Strong — 95% reduction, >5 hours/week saved
            - Strong — API-based approval pipeline detailed
            - Moderate — fit for scaling research and infra teams
            - Moderate — investor and news quotes corroborate logo
        - label: Replit
          values:
            - Moderate — false-positive reduction and compliance value, not quantified
            - Strong — GitHub-check workflow described
            - Moderate — Vanta and compliance tie-in
            - Moderate — official quote repeated in funding materials
        - label: Vercel
          values:
            - Moderate — dependency-sprawl and cognitive-load benefits
            - Strong — pnpm/monorepo and phased rollout detail
            - Moderate — hygiene and rollout depth suggest broader platform use
            - Moderate — official quote repeated in funding materials
        - label: Cedar
          values:
            - Strong — 70% alert reduction and monthly workload change
            - Strong — GitHub plus reachability workflow described
            - Moderate — scorecard roadmap suggests broader embed
            - Weak — no independent customer-side writeup reviewed
        - label: Chia / JumpCloud / JupiterOne
          values:
            - Moderate — strong operational detail, mixed quantification
            - Strong — GitHub, SBOM, CI policy, and endpoint detail
            - Strong — governance and compliance expansion clearly visible
            - Weak — corroboration is mostly vendor-led case-study material
        - label: xAI / Cursor / Figma / Gusto / Mercado Libre
          values:
            - Weak — no public KPI or outcome detail reviewed
            - Weak — logo mention only in reviewed corpus
            - Weak — no public module or rollout detail reviewed
            - Moderate — repeated across official and news sources but still logo-level
