  - id: expansion-loops-and-concentration-risk
    title: Expansion loops and concentration risk
    body: >-
      The most credible Socket expansion path in the public record is not seat-count disclosure; it
      is product-surface expansion after an easy initial rollout. Case studies show a recurring
      pattern: the customer starts with GitHub App or PR-time dependency scanning, then extends into
      API-based approvals, reachability, license and SBOM workflows, CI/CD gating, Vanta
      synchronization, dependency search, or developer-endpoint protection [CU007, CU031, CU041].
      That sequence turns a tactical dependency scanner into part of a broader governance and
      compliance stack, which is why customers like JumpCloud, JupiterOne, Replit, Doctolib, and
      MetaMask talk about SBOMs, CI policy, historical dependency search, audit evidence, and
      developer-machine protection instead of only one-off alerts [CU011, CU016, CU018, CU021,
      CU031].


      The concentration risk is that this expansion thesis is still built on a narrow public
      customer profile. Socket's best-known references remain AI labs, developer tools,
      open-source-heavy platforms, compliance vendors, and cloud/security teams [CU034, CU037]. That
      is an attractive cohort in 2026 because AI-driven development is accelerating dependency risk,
      but it also means the public customer brand is concentrated in organizations that are already
      sophisticated and often GitHub-centric [CU037, CU038]. Reviews and the adverse Java test
      reinforce the same point from another angle: Socket appears strongest in npm/Python and
      GitHub-centered workflows, while broader enterprise heterogeneity is less well proven publicly
      [CU028, CU029, CU038].


      External corroboration helps on awareness but not on economics. News coverage largely repeats
      Socket's customer names and usage metrics rather than exposing procurement detail, retention
      cohorts, or revenue concentration [CU039]. Public diligence therefore still needs management
      answers on paid-customer mix, top-customer exposure, and whether the AI-native logo set is a
      representative base or a curated leadership wedge [CU036, CU039].
    claimRefs:
