  evidenceGaps:
    - type: missing-source
      severity: material
      topic: paid-customer-count
      missingEvidence: Exact paid-customer count, free-to-paid conversion, and segment-level account distribution.
      whyItMatters: >-
        Platform-footprint metrics can overstate commercial depth if free, OSS, or incident-driven
        users dominate the disclosed organization count.
      diligencePath: >-
        Request current paid-customer count, split by free versus paid accounts, and number of
        customers above meaningful ARR thresholds.
      relatedQuestionRefs:
        - QU013
      relatedTableRefs:
        - TU002
    - type: missing-source
      severity: material
      topic: retention-economics
      missingEvidence: >-
        NRR, GRR, churn, renewal cohorts, contract length distribution, and expansion rates by
        module.
      whyItMatters: >-
        Durability and expansion are the key underwriting questions for a developer-security
        subscription business, and public proxies do not replace cohort economics.
      diligencePath: >-
        Request cohort retention by vintage, gross and net retention, renewal rates, and attach
        rates for reachability, Firewall, or compliance modules.
      relatedQuestionRefs:
        - QU014
        - QU024
      relatedTableRefs:
        - TU004
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Top-customer revenue share, AI-native customer revenue concentration, and the number of
        six-figure-plus or seven-figure-plus accounts.
      whyItMatters: >-
        A strong AI-native customer roster is strategically positive, but concentration could make
        revenue more cyclical and more sensitive to platform-standardization risk.
      diligencePath: >-
        Request top-10 customer share of ARR, revenue by customer segment, and pipeline mix outside
        AI-native and GitHub-centric accounts.
      relatedQuestionRefs:
        - QU015
        - QU025
      relatedTableRefs:
        - TU005
    - type: enumeration-incomplete
      severity: minor
      topic: logo-only-marquee-accounts
      missingEvidence: >-
        Deployment stage, use case, and measurable outcomes for xAI, Cursor, Figma, Gusto, and
        Mercado Libre.
      whyItMatters: >-
        These logos improve brand credibility, but without deployment detail they do not prove
        production depth or expansion economics.
      diligencePath: >-
        Ask management which marquee accounts are referenceable, in production, and willing to
        discuss scope, rollout chronology, and realized outcomes.
      relatedQuestionRefs:
        - QU023
      relatedTableRefs:
        - TU003
    - type: missing-source
      severity: material
      topic: ecosystem-coverage-validation
      missingEvidence: >-
        Updated independent validation of Java and other non-core ecosystem coverage after the 2025
        adverse test.
      whyItMatters: >-
        If Socket's public perception outruns actual coverage in non-core ecosystems, customer
        satisfaction and expansion into broader enterprises could suffer.
      diligencePath: >-
        Request third-party test results or run a controlled proof with representative Java, Ruby,
        Rust, and mixed-monorepo environments.
      relatedQuestionRefs:
        - QU012
        - QU021
      relatedTableRefs:
        - TU006
