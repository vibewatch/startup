  - id: named-proof-and-deployment-depth
    title: Named proof and deployment depth
    body: >-
      Socket's public proof is materially stronger for some customers than others. Anthropic,
      Replit, Vercel, Cedar, Chia, JumpCloud, Render, Doctolib, Drata, MetaMask, SHI, and JupiterOne
      each have named case studies or detailed testimonials describing deployment surfaces, buyer
      roles, or operating outcomes [CU008, CU010, CU012, CU013, CU015, CU016, CU018, CU019, CU020,
      CU021, CU022]. Anthropic is the best quantified proof: the company says Socket was embedded
      into an internal dependency-approval pipeline, cutting manual dependency review by 95% and
      saving security engineers more than five hours per week [CU008, CU009]. Cedar and Chia provide
      the next-best quantified evidence, each describing a 70% reduction in alert burden or open
      security alerts after rollout [CU014, CU015].


      Replit and Vercel show why Socket resonates with AI-native and developer-tooling customers.
      Replit describes GitHub-check rollout, fewer false positives, and better confidence around
      transitive dependencies and compliance workflows [CU010, CU011]. Vercel emphasizes pnpm and
      monorepo fit, phased rollout, reduced dependency sprawl, and lower cognitive load for
      developers [CU012]. JumpCloud, JupiterOne, Doctolib, SHI, and Render push the story further
      into governance and ops: SBOM and license support, CI/CD enforcement, audit readiness,
      minimal-access deployment, and durable low-friction PR usage [CU016, CU017, CU018, CU019,
      CU022, CU040].


      The limitation is that Socket's highest-profile logos are not equally well substantiated. xAI,
      Cursor, Figma, Gusto, and Mercado Libre appear in official customer lists, but the reviewed
      public corpus does not disclose deployment architecture, contract scope, or outcomes for those
      accounts [CU023]. That means Socket can legitimately claim marquee customer logos, but outside
      the case-study set the public record is still closer to logo proof than to deep production
      proof.
