company:
  name: Socket
chapter:
  number: 5
  title: Product & Technology
  summary: Socket is a developer-workflow security platform built around behavior-based dependency analysis, multi-surface enforcement, and increasingly reachability-based CVE triage. The strongest evidence is the breadth of shipping surfaces — GitHub, CLI, VS Code, Firewall, API and SDKs — plus a fast 2025-2026 release cadence around Coana reachability, PHP and Composer, OpenVSX scanning, Jira, and Data Exports. The main technical risks are uneven public clarity on feature parity outside the best-documented ecosystems and trust evidence that is thinner than a procurement team will eventually want.
sections:
- id: product-definition-and-developer-workflow
  title: Product Definition and Developer Workflow
  body: 'Socket is best understood as a developer-workflow security platform rather than as a single static scanner. The public entry point is a GitHub app that watches dependency changes in pull requests, comments before merge, and produces project-health style output around new packages. That is only one surface, though. The same product family also includes a CLI for more customized or non-GitHub workflows, a VS Code extension that brings manifest scanning into the editor, and Socket Firewall, which shifts enforcement to install time by sitting between package managers and registries. The result is a product that can see dependency risk at multiple moments: when code is edited, when a dependency is proposed in a PR, and when a package is actually downloaded into a developer laptop or CI runner. That multi-surface design matters because Socket is selling protection that fits into the normal developer toolchain instead of asking security teams to run an isolated after-the-fact report.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  tableRefs:
  - TE002
  figureRefs:
  - FE002
- id: product-surface-and-ecosystem-map
  title: Product Surface and Ecosystem Map
  body: The product map is broad, but the evidence shows it is broad in layers rather than in one monolithic SKU. Public materials describe GitHub review, editor-time guidance, install-time policy enforcement, reachability analysis, API and SDK access, and a research-led package intelligence layer. Socket also markets multi-ecosystem support across mainstream open-source registries, and its Firewall and release posts show expansion into Maven, Ruby, NuGet, Packagist, OpenVSX, and PHP or Composer surfaces. At the same time, the public evidence does not show perfectly even depth across every ecosystem. The GitHub page still spotlights JavaScript, Python, and Go most explicitly; the FAQ claims wider language support; and independent reviewers still describe the deepest fit as strongest in JavaScript-centric workflows. That means the portfolio should be read as wide and expanding, but not as a fully symmetric feature matrix where every ecosystem clearly has identical behavior analysis, reachability
    depth, and workflow coverage.
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
