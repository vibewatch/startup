  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cross-language-feature-parity
    missingEvidence: A public feature matrix that shows, by ecosystem, where Socket provides full behavior analysis, reachability, Firewall support, IDE support, and policy enforcement at GA or beta maturity.
    whyItMatters: Without a parity matrix, a buyer cannot tell whether non-JavaScript teams will receive the same prevention and triage quality that the marketing breadth implies.
    diligencePath: Request a current ecosystem-by-ecosystem capability matrix plus live demos for Maven, Go, Rust, .NET, Ruby, and PHP teams, including what is GA, beta, or roadmap only.
    relatedQuestionRefs:
    - QE006
    - QE007
    - QE024
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: procurement-grade-assurance
    missingEvidence: Public pages state source-code and PII boundaries, but they do not expose the deeper audit, certification, penetration-test, or control-mapping materials that large buyers usually request.
    whyItMatters: Trust posture affects whether Socket can be rolled out broadly in regulated or high-sensitivity environments, especially when it plugs into CI, GitHub, and developer endpoints.
    diligencePath: Request SOC 2 or ISO artifacts, architecture and data-flow documentation, pentest summaries, and customer security questionnaire responses under NDA.
    relatedQuestionRefs:
    - QE019
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: false-positive-benchmarks
    missingEvidence: Independent reviews acknowledge false positives and tuning needs, but the public record does not provide benchmarked false-positive rates or policy-tuning case studies by repo type.
    whyItMatters: Alert quality is central to the value proposition because Socket is selling prevention and prioritization, not just broad detection coverage.
    diligencePath: Ask for customer references and benchmark data comparing pre- and post-tuning alert quality across mature production repos, experimental repos, and monorepos.
    relatedQuestionRefs:
    - QE022
    - QE023
    relatedTableRefs:
    - TE004
