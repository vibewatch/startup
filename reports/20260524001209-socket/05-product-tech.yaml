- id: release-cadence-roadmap-and-developer-signal
  title: Release Cadence, Roadmap, and Developer Signal
  body: Socket’s 2025-2026 public release cadence is fast and unusually visible. Product pages show adjacent launches such as OpenVSX scanning, Ruby reachability beta, Immutable Scans, PHP and Composer support, Jira, and Data Exports; the research feed simultaneously shows a high-volume stream of threat-intelligence posts across npm, Go, NuGet, PyPI, RubyGems, Packagist, and extension ecosystems. That combination suggests the company is trying to turn first-party research into shipping product surfaces instead of publishing research as a detached marketing activity. Public developer-signal data points in the same direction. The GitHub organization shows dozens of public repositories, and the CLI, VS Code extension, JavaScript SDK, and Python SDK all saw activity close to the run date. The signal is not massive open-source scale, but it is real and current. In parallel, the Series C materials frame the roadmap around broader install-time protection, precision reachability, and adjacent surfaces
    such as extensions and AI tooling.
  claimRefs:
  - CE028
  - CE029
  - CE030
  - CE031
  - CE032
  - CE033
  - CE034
  - CE035
  - CE036
  - CE037
