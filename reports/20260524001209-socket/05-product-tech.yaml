- id: architecture-and-reachability-operating-model
  title: Architecture and Reachability Operating Model
  body: 'Socket’s operating architecture starts with dependency intake rather than runtime telemetry. It consumes manifests, lockfiles, and install requests; classifies behavior and metadata; folds in maintainer-behavior heuristics; and then projects that intelligence back into developer-facing surfaces. Reachability is now the major precision layer on top of that stack. Public product pages distinguish three tiers: dependency reachability, precomputed reachability, and full application reachability. The lower-friction tiers work across existing integrations, while full application reachability is the heavier option that requires CLI or GitHub Action setup and language-specific runtime prerequisites. The Coana acquisition is the key technical move here: Socket is explicitly using Coana’s static and control-flow analysis to decide whether a CVE is truly reachable, and official materials emphasize that precomputed reachability can deliver large noise reduction without immediately requiring
    source-code upload. This is a material differentiator from tools that stop at a vulnerability match list.'
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
