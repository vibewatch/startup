  - TE005
  figureRefs:
  - FE004
- id: differentiation-trust-and-technical-risks
  title: Differentiation, Trust, and Technical Risks
  body: 'Socket’s clearest differentiation is that it is built to catch malicious dependency behavior and then prioritize reachable vulnerabilities inside the normal developer workflow. That is a sharper proposition than classic CVE scanning, and the combination of GitHub review, editor feedback, install-time blocking, and reachability triage gives it a coherent platform story. The trust posture is directionally positive but still only partially transparent in public evidence. Official pages are clear that proprietary source code is meant to stay on the developer machine or CI environment and that manifests or dependency lists are the main data shared with Socket. That is useful for procurement conversations, but it is not the same thing as a public assurance package. The main technical risks therefore center on execution and transparency rather than on product surface area: cross-language parity is not fully documented, behavior-based analysis can still need tuning in dynamic repos, and
    buyers that want procurement-grade assurance evidence will need more than the current public materials disclose.'
  claimRefs:
  - CE038
  - CE039
  - CE040
  - CE041
