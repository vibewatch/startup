- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Key risk
  - Evidence
  rows:
  - - Manifest and install intake
    - Collects manifests, lockfiles, and install requests as the raw package graph input
    - Package-manager and repository integration points
    - If intake misses a dependency surface, downstream detections cannot compensate
    - GitHub, Firewall, and docs pages
  - - Behavior analysis engine
    - Inspects network, filesystem, shell, environment, install-script, telemetry, and obfuscation signals
    - Language parsers and package source visibility
    - Behavior analysis can still create tuning work or false positives
    - FAQ plus independent reviews
  - - Metadata and maintainer heuristics
    - Uses metadata changes, maintainer behavior, and release anomalies as additional risk signals
    - Registry metadata quality and historical package records
    - Signal quality varies with ecosystem history and maintainership visibility
    - FAQ
  - - Reachability precision layer
    - Filters vulnerability alerts to focus on reachable and exploitable paths
    - Static and control-flow analysis plus repo or CI execution context
    - Higher precision costs more setup and compute
    - Reachability feature page and docs
  - - Coana-derived full-app analysis
    - Adds function-level and precomputed reachability for CVE triage
    - Coana engine integration and language-specific runtimes
    - Feature parity across ecosystems is not yet fully spelled out publicly
    - Acquisition posts and reachability docs
  - - Reporting and enforcement surfaces
    - Returns results to PR comments, editor UIs, org dashboards, APIs, and install-time blocks
    - GitHub permissions, editor extension settings, package-manager hooks, and API availability
    - Workflow value depends on how well teams deploy these surfaces together
    - Getting-started, GitHub, VS Code, and Firewall pages
