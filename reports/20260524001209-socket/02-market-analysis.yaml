- id: buyers-budgets-and-adoption-path
  title: Buyer, User, Payer Segments and the Adoption Path
  body: 'The initial user is usually a developer, platform engineer, or build owner, but the eventual payer often shifts as soon as governance matters. Socket prices around developers who committed to scanned repositories in the prior 90 days; GitHub charges active committers for Code Security and Secret Protection; GitLab folds stronger dependency security into Ultimate; and Snyk ladders from free individual use to team and enterprise plans. Those packaging choices imply a common market structure: tools land bottoms-up in repository workflows, then monetize once AppSec, platform, or compliance leaders want centralized policy, reporting, and support. Free and open-source tools are essential to the adoption path because they set the baseline expectation of what teams can already get without paying. Dependabot, npm audit, OSV, Dependency-Check, Dependency-Track, and Renovate can handle basic update automation, CVE visibility, or SBOM inventory. Buyers only upgrade when they believe built-in
    options miss malicious behavior, create too much alert noise, or fail procurement and audit requirements. For Socket, the best-fit segment is organizations that already feel the limits of free or bundled tools but still want something lighter and more precise than a full AppSec suite.'
