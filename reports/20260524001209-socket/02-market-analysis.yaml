company:
  name: Socket
chapter:
  number: 2
  title: Market Analysis
  summary: 'Socket''s direct market is software supply chain security centered on dependency admission control, malicious package detection, SBOM-aware inventory, and continuous advisory triage inside developer workflows. Public market data is contradictory by category design: a direct software supply chain security lens sits around USD 1.2 billion in 2025 while broader application security estimates cluster near USD 14.8 billion in 2026 and at least one SCA estimate appears implausibly broad. The category has durable regulatory and incident tailwinds after EO 14028, SBOM policy, XZ, and Log4Shell, but free tools and platform bundles from GitHub, GitLab, and Snyk keep the price floor low and force Socket to win on precision and workflow fit rather than on generic TAM rhetoric.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: Socket should be framed as a software supply chain security company, not as a proxy for all application security. The direct buying problem is deciding whether a third-party package or update is safe enough to admit into a repository, CI pipeline, or production release. Socket's own product surfaces emphasize vulnerable and malicious dependencies, PR gating, and risk signals such as typosquats, install scripts, obfuscation, shell access, network access, and environment-variable access. That means included spend is dependency review, malicious package detection, SBOM-aware inventory, advisory monitoring, and policy or triage workflows tied to software delivery. Excluded spend is most standalone SAST, DAST, API testing, and general cloud security unless a buyer is reopening a larger AppSec platform contract. The substitute set is unusually deep. Dependabot, npm audit, OSV, Dependency-Check, Dependency-Track, and Renovate provide a low-cost or free baseline for updates, CVE matching,
    or inventory; GitHub, GitLab, Snyk, and Black Duck bundle dependency controls into broader platforms. For diligence, the market boundary should therefore be the recurring workflow of dependency admission and software supply chain control, not every dollar labeled AppSec.
  claimRefs:
