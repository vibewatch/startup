  rows:
  - - Direct dependency security / SCA
    - Dependency admission control, version update review, CVE matching, license and metadata review, PR gating
    - Most standalone SAST, DAST, API testing, and general cloud security
    - Engineering platform, AppSec, or shared engineering/security budget
    - Core direct category for Socket
  - - Malicious package and behavior detection
    - Typosquat, install-script, obfuscation, network, shell, and credential-risk detection for packages and updates
    - Generic code quality tooling or runtime-only protection
    - Security engineering and developer platform leaders
    - Main premium wedge beyond CVE-only scanning
  - - SBOM / inventory / policy workflow
    - SBOM generation or ingestion, advisory refresh, inventory, policy exceptions, VEX or VDR adjacent workflows
    - Generic GRC tooling without package intelligence
    - Security, compliance, procurement, and platform teams
    - Regulation-driven adjacency that is still relevant to Socket
  - - Built-in repo-host coverage
    - GitHub or GitLab dependency security features embedded in SCM and CI workflows
    - Unrelated source-control collaboration spend
    - Existing GitHub or GitLab platform owners
    - Strong substitute and distribution pressure
  - - Open-source and no-cost tools
    - npm audit, OSV, Dependency-Check, Dependency-Track, Renovate, and similar community tooling
    - Premium managed services or enterprise support contracts
    - Maintainers, developers, and cost-sensitive teams
    - Sets the price floor for basic scanning and inventory
  - - Broader AppSec platform adjacency
    - SCA sold together with SAST, DAST, secret scanning, and broader developer security suites
    - Pure network or endpoint security budgets
    - CISO, AppSec, or enterprise platform buyer
    - Useful TAM ceiling but not a clean direct SAM
  notes: The economically relevant boundary is dependency admission and software supply chain control inside developer workflows; broader AppSec is adjacency, while open-source and built-in tools define the baseline alternative.
