- id: sizing-lenses-and-contradictory-estimates
  title: 'Sizing Lenses: Direct Supply Chain Security, Broader AppSec, and a Serviceable SAM'
  body: 'Public sizing needs to be handled as a range problem, not as a single headline TAM. The cleanest direct-category lens we found is Verified Market Reports, which places software supply chain security at USD 1.2 billion in 2025 growing to USD 4.5 billion by 2034. Broader application security estimates are an order of magnitude larger: Mordor places the category at USD 14.83 billion in 2026 and Fortune at USD 14.86 billion in 2026. Those numbers are useful as adjacency ceilings because broader AppSec budgets can sometimes absorb dependency security, but they are too wide to call Socket''s direct TAM. At the other extreme, Mordor''s SCA page claims a USD 430.12 billion market in 2026, a figure so large relative to nearby AppSec estimates that it should be treated as a warning about category inflation rather than as a valuation anchor. The practical sizing move is a layered one: direct software supply chain security as the floor, broader AppSec as the adjacency ceiling, and serviceable
    SAM defined by active developers or committers whose organizations are willing to pay recurring fees for dependency admission control, SBOM workflows, and malicious package triage.'
