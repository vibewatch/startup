  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A credible, directly comparable 2026 software supply chain security market estimate from a methodology-transparent publisher.
    whyItMatters: Current public estimates mix direct category data, broader AppSec adjacency, and at least one likely over-broad SCA figure, which limits precision on TAM narratives.
    diligencePath: Obtain primary analyst methodology notes or paid extracts for direct SCA and software supply chain security coverage, then rebuild the market range using only like-for-like categories.
    relatedQuestionRefs:
    - QM022
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: conversion-and-segment-share
    missingEvidence: Socket-specific conversion, expansion, win-rate, and segment-mix data showing how many users move from free or bundled alternatives into paid deployments.
    whyItMatters: Public sources show pricing models and substitutes, but they do not reveal how much of the serviceable market Socket actually converts or from which buyer segment.
    diligencePath: Request cohort, pipeline, and win-loss data broken out by source of displacement, buyer persona, and compliance-driven deals.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: bundle-pressure
    missingEvidence: Competitor-specific renewal and win-loss evidence quantifying how often GitHub, GitLab, or Snyk bundles displace best-of-breed dependency-security vendors.
    whyItMatters: We can show strong qualitative bundle pressure, but not its exact effect on standalone pricing power or Socket's addressable share.
    diligencePath: Review CRM win-loss data, channel feedback, and renewal analyses against GitHub, GitLab, Snyk, and Black Duck by segment and ACV band.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM004
