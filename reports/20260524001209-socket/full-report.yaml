      - number: '7.5'
        title: People, Execution, and Proof Gaps
        blocks:
          - type: paragraph
            body: >-
              Socket’s public momentum is real: the Series C, named customers, and broad case-study roster establish
              market relevance. But proof of relevance is not the same as proof of durability. Public materials show
              many logo-level and case-study-level wins, especially around alert reduction and workflow efficiency, yet
              they do not disclose ARR, NRR, churn, or concentration with the specificity an investor would normally
              want after a $1 billion valuation round. Execution risk is amplified by breadth. SecurityWeek reported
              roughly 100 employees at the time of the Series C, while Socket simultaneously markets or documents
              GitHub, GitLab, Azure DevOps, AI-model scanning, browser extensions, firewall, certified patches,
              reachability, enterprise governance, and more. Founder-led credibility is a strength—Feross Aboukhadijeh
              and the advisor network clearly help trust and recruiting—but that public positioning also concentrates
              reputational and product-authorship risk. The Coana acquisition mitigates part of the technical gap, yet
              it also introduces dependence on retaining a newly integrated, research-heavy team while converting that
              expertise into repeatable enterprise product outcomes.
