      - number: '3.3'
        title: Bundled and adjacent substitutes
        blocks:
          - type: paragraph
            body: >-
              GitHub is the most important bundled substitute because it owns the workflow in which many teams already
              review dependencies, pull requests, alerts, and remediation tickets. GitHub Advanced Security explicitly
              markets built-in secret protection, code security, and dependency monitoring, while Dependabot alerts
              cover known vulnerable dependencies directly in the repository. That native position creates distribution
              power Socket cannot match on its own: even when GitHub’s dependency coverage is less specialized than
              Socket’s behavior-based model, the procurement and workflow friction is lower, and GitHub’s public
              per-active-committer pricing gives buyers a clear baseline for “good enough” protection.

              Adjacent platforms raise a different risk. Apiiro, Aikido, OX Security, and Upwind all market broader
              context than Socket: graph-based or code-to-cloud visibility, secure-by-design policy, API and runtime
              coverage, or one-platform replacement for multiple scanners. Chainguard competes from yet another angle by
              moving the control point to hardened images and libraries with contractual CVE remediation SLAs. These are
              not one-to-one Socket clones, but they are credible substitutes whenever the buyer prefers consolidation,
              cloud/runtime context, or artifact provenance over a specialist dependency-security tool. That is why
              Socket’s real competition increasingly includes platforms that want to absorb supply-chain spend rather
              than only rival tools that look like Socket.
