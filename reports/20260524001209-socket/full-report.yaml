      - number: '7.2'
        title: Competition and Platform Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Socket is strategically entangled with platforms that also compress the category. Its own getting-started
              guide calls Socket for GitHub the easiest and most powerful deployment path, which is rational for
              adoption but risky because GitHub simultaneously controls the pull-request surface, advisory graph,
              dependency review, and bundled security features that shape buyer expectations. Dependabot and dependency
              review already cover a meaningful subset of what many engineering organizations need for policy
              enforcement on known vulnerabilities, and GitHub can turn those controls into default workflow
              assumptions. Snyk’s reachability work reduces another historical differentiator: after Coana, reachability
              matters more than ever, yet it is no longer unique. Meanwhile npm and GitHub are steadily raising the
              security baseline through trusted publishing, provenance, and attestations. Those changes do not eliminate
              malicious-package risk, but they do make Socket’s long-run moat more dependent on precision, policy,
              response speed, and enterprise workflow fit. Enterprise expansion outside GitHub is possible, but pricing
              and documentation show much of that breadth—GitLab, Azure DevOps, self-hosted repositories, SCIM, audit
              logs, and IP controls—is reserved for higher tiers.
