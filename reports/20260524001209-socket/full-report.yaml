      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              The category has real structural tailwinds. EO 14028 told NIST to advance software supply chain security;
              NIST's SSDF explicitly gives purchasers and consumers a framework they can use in acquisition; CISA calls
              SBOM a key building block in software supply chain risk management; and the EU Cyber Resilience Act
              creates lifecycle cybersecurity duties with reporting obligations beginning in September 2026. Incidents
              keep reinforcing that policy pressure. XZ demonstrated that an upstream package can be backdoored in a way
              that reaches ssh-related production paths, while Apache's Log4j security page is still evidence of how
              long transitive dependency response can linger after a high-severity event. Threat telemetry remains
              intense: Sonatype describes industrialized repository abuse and secrets exfiltration in developer or CI
              environments, and Veracode shows surging malicious URLs, obfuscation, and typosquatting. The constraints
              are equally real. Buyers face false-positive fatigue, skills shortages, and tool sprawl, while GitHub,
              GitLab, Snyk, and other bundles compress standalone pricing. That means Socket's upside depends less on
              whether the market grows and more on whether its behavior-first detection produces meaningfully better
              outcomes than free and bundled substitutes.
