  - id: FU001
    title: Customer Journey Map
    type: journey-map
    layout: wide
    summary: Public case studies show a repeatable motion from GitHub-native trial to governance and compliance expansion.
    approximationNotes: >-
      Stages are synthesized from public case studies and marketplace/docs material. Timing and internal procurement
      steps are not publicly disclosed; the figure maps sequence rather than duration.
    data:
      nodes:
        - label: Discovery and lightweight evaluation
          description: >-
            Security or platform lead discovers Socket through threat research, marketplace listing, peer
            recommendation, or incident-driven urgency.
          actors: CISO, Head of Security, Security Engineering lead
          examples: GitHub Marketplace copy, Vercel evaluation, Render peer recommendation
        - label: GitHub-native initial rollout
          description: >-
            Customer enables the GitHub App or GitHub check so developers receive dependency feedback inside pull
            requests with minimal process change.
          actors: Security engineer, application developers, platform engineers
          examples: Replit, Cedar, JumpCloud, SHI, Render
        - label: Policy tuning and precision controls
          description: >-
            Customer adds thresholds, reachability, phased rollout, or API-based approval logic to reduce noise and
            automate acceptable dependency decisions.
          actors: Security engineering, AppSec, platform team
          examples: Anthropic API workflow, Vercel phased rollout, JupiterOne CI policy
        - label: Governance and compliance embed
          description: >-
            Socket becomes part of SBOM, license, audit, or compliance evidence workflows and feeds customer-assurance
            or internal control processes.
          actors: Security, compliance, legal, audit stakeholders
          examples: JumpCloud SBOMs, Replit Vanta flow, Doctolib audits
        - label: Surface expansion and platformization
          description: >-
            Customer expands from repo scanning into dependency search, firewall, browser-extension, or
            developer-endpoint protection across the engineering estate.
          actors: Security leadership, developer platform, IT / endpoint security
          examples: MetaMask historical dependency search, JumpCloud Firewall, Secure Annex roadmap
    claimRefs:
