  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - ARR shortfall
        - Current ARR materially below ~$40M
        - Breaks the case that $1B is supported by anything above a public mid-band multiple.
        - Re-rate toward bear range or walk away unless price resets materially.
      - - Weak paid conversion
        - Low-single-digit monetization of protected developers or weak enterprise ACV
        - Shows the large footprint is mostly top-of-funnel rather than monetizable demand.
        - Downgrade the round from fair-ish to stretched.
      - - Bundling pressure
        - GitHub GHAS / Copilot displaces Socket in core enterprise workflows
        - Compresses attach rates and undermines long-term seat ownership.
        - Reduce target multiple and treat platform risk as thesis-breaking.
      - - Margin / burn weakness
        - Gross margin or burn efficiency materially below premium-software norms
        - Turns a category story into a capital-intensity problem.
        - Tighten valuation range and require stronger financing terms.
      - - Preference overhang
        - Cap table or structured terms consume value near $1B-$1.2B outcomes
        - A defendable enterprise value can still produce poor equity returns.
        - Do not invest without waterfall clarity or better structure.
    notes: Triggers are measurable operating or structural events, not generic risks.
    claimRefs:
      - CV048
      - CV056
      - CV058
      - CV059
      - CV060
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current ARR / growth
        - Latest ARR, growth rate, and revenue bridge by product and plan
        - This is the single biggest variable separating fair from stretched.
        - CFO dashboard, board pack, or audited management accounts.
      - - Customer quality
        - Paid-customer count, seat counts, ACV buckets, and net retention by cohort
        - Converts disclosed footprint into real monetization evidence.
        - Sales / FP&A cohort cut and top-50 customer review.
      - - Unit economics
        - Gross margin, burn, sales efficiency, and cloud-hosting cost profile
        - Determines whether premium private multiples are sustainable.
        - Finance diligence and operating-plan review.
      - - Competitive proof
        - Win-loss and renewal data versus GHAS, GitLab, JFrog, and other bundled alternatives
        - Tests whether workflow ownership is durable or temporary.
        - Sales ops analysis plus customer reference calls.
      - - Capital structure
        - Fully diluted cap table, preference terms, and any secondary or tender economics
        - Turns enterprise value into actual investor return math.
        - Legal + finance review of cap table, financing docs, and 409A materials.
    notes: These asks are the minimum package required before treating $1B as a conviction entry point.
    claimRefs:
      - CV049
      - CV052
      - CV060
      - CV061
