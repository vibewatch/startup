      - number: '8.2'
        title: Comparable set and revenue proxies
        blocks:
          - type: paragraph
            body: >-
              Public comparables do not produce one clean answer, but they do define the work Socket’s economics must be
              doing underneath a $1 billion price. GitLab trades around 4.7x revenue and SentinelOne around 6.4x, which
              would require Socket to already be at roughly $150 million-plus of ARR to justify the round. JFrog, a more
              relevant software-supply-chain and DevSecOps platform, trades closer to 14x on FY2026 revenue guidance,
              implying Socket would need roughly $70 million of ARR. Premium cyber platforms such as Palo Alto Networks
              and CrowdStrike, and premium private comps such as Wiz, support much richer multiples, but they do so with
              either far greater scale or much clearer disclosed revenue. Chainguard shows how high the market can go
              for hypergrowth software-supply-chain security, but its disclosed multiple is an outlier rather than a
              median.


              Socket’s own public footprint helps create a rough proxy. With 1.5 million protected developers and list
              prices of $25 and $50 per developer per month on Team and Business, every 1% of monetized developers at a
              $35 blended price implies about $6.3 million of ARR. That means supporting a $1 billion valuation at a 20x
              multiple requires roughly 8% monetization of the disclosed developer base, or a smaller enterprise cohort
              paying materially higher effective ARPU through reachability, firewall, certified patches, and broader
              enterprise controls. Because Socket is free for open source and has a $0 entry tier, those protected-user
              counts are noisy revenue proxies rather than revenue disclosures. That is why the comp bridge says
              “possible,” not “proven.”
