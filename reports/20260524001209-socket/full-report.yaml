      - number: '7.4'
        title: Legal, Regulatory, and Trust Risks
        blocks:
          - type: paragraph
            body: >-
              Socket does several privacy-positive things publicly—most importantly, it says it never uploads source
              code—but its legal and compliance disclosures still look thin relative to the current product surface. The
              privacy policy remains dated February 2022 despite 2025-2026 expansion into more integrations, AI-related
              surfaces, enterprise controls, and broader analysis categories. That policy also explicitly contemplates
              third-party processing and disclosures required by law or government request, so cross-border transfer
              mechanics matter in enterprise sales. The EU-US Data Privacy Framework helps, but it does not remove the
              need for safeguards, diligence, and updated documentation when regulated customers ask for current
              transfer, subprocessors, and data-handling detail. The EU Cyber Resilience Act raises the forward-looking
              burden further by bringing reporting obligations into 2026 and broader lifecycle obligations into 2027.
              Contractually, Socket’s public agreements page proves agreements exist and are current, but not what
              liability caps, indemnity scope, or uptime commitments actually say outside marketing-level summaries.
              Public enforcement searches did not surface a Socket-specific FTC matter during this review, but that is
              only a monitoring signal—not proof that there are no threatened claims, customer disputes, or regulator
              questions elsewhere.
