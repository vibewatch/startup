  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Developer Workflow
        blocks:
          - type: paragraph
            body: >-
              Socket is best understood as a developer-workflow security platform rather than as a single static
              scanner. The public entry point is a GitHub app that watches dependency changes in pull requests, comments
              before merge, and produces project-health style output around new packages. That is only one surface,
              though. The same product family also includes a CLI for more customized or non-GitHub workflows, a VS Code
              extension that brings manifest scanning into the editor, and Socket Firewall, which shifts enforcement to
              install time by sitting between package managers and registries. The result is a product that can see
              dependency risk at multiple moments: when code is edited, when a dependency is proposed in a PR, and when
              a package is actually downloaded into a developer laptop or CI runner. That multi-surface design matters
              because Socket is selling protection that fits into the normal developer toolchain instead of asking
              security teams to run an isolated after-the-fact report.
