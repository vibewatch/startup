  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >-
              Socket is no longer competing only against another npm-scanning tool. The retained source set shows four
              real buyer alternatives in 2026. First are direct specialist rivals such as Snyk, Mend, Endor Labs, JFrog
              Xray, and FOSSA, which all compete for dependency, software-composition-analysis, or remediation budget
              with different combinations of reachability, compliance, and platform breadth. Second are GitHub-native
              substitutes: Dependabot and GitHub Advanced Security already sit inside the repo workflow where many teams
              discover and fix dependency issues, making them the default baseline Socket must beat. Third are broader
              code-to-cloud or ASPM platforms such as Aikido, OX, Apiiro, and Upwind that now bundle SCA, SBOM, CI/CD,
              cloud, API, or runtime context into a single contract. Fourth is the status quo: for lower-complexity
              teams, free dependency alerts plus internal package-governance process can be “good enough” and delay a
              standalone specialist purchase.

              That structure matters because Socket’s differentiation is real but narrow. Official Socket pages
              emphasize behavior-based malicious-package detection, install-time blocking, and reachability-led CVE
              noise reduction rather than an all-in-one AppSec or CNAPP message. Independent 2026 review coverage
              reaches a similar conclusion: Socket is strongest when buyers explicitly care about supply-chain attacks
              in developer workflows, especially around JavaScript and npm, while broader or more polyglot organizations
              can justify looking at vendors that consolidate more of the security stack.
            claimRefs:
