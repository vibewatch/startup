  - id: FE001
    title: Product Architecture Map
    type: stack
    layout: wide
    summary: Representative stack from developer entry points through analysis and enforcement layers.
    approximationNotes: >-
      This is a public operating architecture synthesized from official docs and release notes rather than an internal
      service map.
    claimRefs:
      - CE002
      - CE013
      - CE019
      - CE020
      - CE044
    data:
      layers:
        - label: Developer entry points
          detail: >-
            GitHub PR checks, CLI workflows, VS Code scanning, and API or SDK integrations are the public ways users
            invoke Socket.
          items:
            - GitHub App
            - CLI
            - VS Code extension
            - REST API / SDKs
        - label: Dependency intake layer
          detail: >-
            Socket takes in manifests, lockfiles, and install requests to understand which third-party code is entering
            the environment.
          items:
            - Manifest files
            - Lockfiles
            - Install commands
            - Package graph context
        - label: Risk analysis layer
          detail: >-
            Behavior analysis, metadata analysis, and maintainer-behavior heuristics generate the first-pass risk
            picture for a dependency.
          items:
            - Behavior flags
            - Metadata anomalies
            - Maintainer changes
            - Threat signatures
        - label: Precision and prioritization layer
          detail: Reachability tiers decide whether vulnerabilities are actually relevant enough to escalate or suppress.
          items:
            - Dependency reachability
            - Precomputed reachability
            - Full app reachability
        - label: Enforcement and reporting layer
          detail: >-
            Results return to the workflow as PR comments, editor findings, exported data, dashboards, or install-time
            blocks.
          items:
            - PR comments
            - Editor findings
            - Firewall block or warn
            - Exports / dashboards
