      - number: '1.2'
        title: Founder leverage, technical bench, and customer proof
        blocks:
          - type: paragraph
            body: >-
              Leadership is unusually founder-centric. Feross Aboukhadijeh remains the public face across the about
              page, fundraising posts, technical messaging, and recruiting materials, and his background as a prolific
              open-source maintainer, Node.js governance participant, and Stanford lecturer clearly matches the problem
              Socket is selling. That founder-market fit is a real strategic asset: customers and investors repeatedly
              cite developer credibility as a reason Socket can replace legacy SCA products. The tradeoff is
              concentration. Reviewed public materials expose Feross clearly, but they do not offer the same level of
              detail on a mature executive bench, a formal board structure, or investor-governance rights.


              Customer evidence is stronger than governance disclosure. Official 2024 and 2026 materials repeatedly name
              Anthropic, xAI, Replit, Cursor, Figma, Vercel, Gusto, Mercado Libre, and Cribl, while docs and prior
              customer quotes separately corroborate usage by Brave, MetaMask, and open-source projects in the broader
              JavaScript ecosystem. That pattern suggests Socket already matters most to the fast-moving AI-native and
              developer-infrastructure teams most exposed to dependency risk. The Coana and Secure Annex acquisitions
              also matter organizationally because they effectively import specialist technical leaders into the company
              and broaden coverage beyond classic package scanning.
