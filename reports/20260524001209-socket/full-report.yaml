      - number: '3.4'
        title: Moat durability, switching costs, and risk
        blocks:
          - type: paragraph
            body: >-
              Socket still has a defendable moat, but it is a specialist moat. The strongest retained evidence supports
              two differentiated control points: behavior-based malicious-package blocking before code runs, and
              reachability-driven noise reduction that now extends into full-application analysis. Those capabilities
              matter most for teams that are explicitly worried about supply-chain attacks, not just advisory freshness.
              When buyers have already felt the pain of compromised packages, typosquatting, or overwhelming CVE noise,
              Socket’s story is sharp and credible.

              The risk is that this moat does not automatically translate into exclusive ownership of the account.
              Multi-homing is plausible because Socket can sit alongside GitHub, Snyk, or broader AppSec tooling, which
              lowers switching costs and can limit pricing power. Public 2026 commentary also suggests that simple
              vulnerability detection is commoditizing, so buyers increasingly ask whether they should consolidate into
              GitHub, Snyk, Mend, Aikido, OX, or Upwind rather than add one more specialist. The key diligence issue is
              therefore not whether Socket’s technical differentiation exists; it does. The harder underwriting question
              is how often that differentiation is valuable enough to overcome GitHub’s native distribution, broader
              platform contracts, and the status-quo tendency to buy only “good enough” dependency coverage.
