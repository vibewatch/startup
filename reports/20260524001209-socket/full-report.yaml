      - number: '8.3'
        title: Bull, base, and bear valuation ranges
        blocks:
          - type: paragraph
            body: >-
              The scenario framework should stay simple because the biggest unknown is current ARR. In the bear case,
              Socket is still a real company with strong technology, but public scale signals convert into revenue more
              slowly than the round implies. That means something like $25 million to $35 million of ARR and a mid-teens
              to 20x multiple, producing roughly $450 million to $700 million of value. In the base case, Socket has
              successfully turned a meaningful minority of its protected-developer footprint into paid seats, enterprise
              plans, and higher-ARPU reachability or firewall modules. That supports roughly $45 million to $60 million
              of ARR and about an 18x to 22x multiple, which lands near $800 million to $1.1 billion.


              The bull case requires more than good logos and fast product cadence. It requires evidence that revenue
              tripling in 2025 translated into continued 2026 scale, that monetization is closer to high-single-digit
              developer conversion or equivalent enterprise ACV, and that the market continues to treat
              software-supply-chain leaders like Wiz or Chainguard rather than like slower public DevSecOps names. Under
              those conditions, $65 million to $85 million of ARR and a 20x to 25x multiple can support roughly $1.2
              billion to $1.7 billion. The probability-weighted center still lands below the round by a modest amount,
              which is why the round looks defendable but not obviously cheap.
