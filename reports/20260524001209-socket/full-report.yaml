  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Socket’s most material risks cluster around differentiation durability rather than simple survival. The
              company has fresh capital and visible customer proof, but the core investment question is whether Socket
              can keep its detection and prioritization meaningfully better than what large platforms increasingly
              bundle into existing developer workflows. GitHub now ships dependency review, Dependabot, malware alerts,
              SBOM support, advisory data, and artifact attestations, while Snyk has its own reachability analysis.
              Socket’s answer is broader malicious-package detection, Coana-derived reachability, and human-verified
              analysis, but that answer raises its own execution bar: once customers buy Socket to cut noise, any
              regression in precision or workflow friction can quickly undermine willingness to pay. The strongest
              public mitigants are the company’s no-source-code model, transparent status page, enterprise controls, and
              a Series C that reduces near-term financing pressure. The weakest public evidence remains around
              durability: public customer materials show breadth and case-study wins, but not retention, concentration,
              or cohort economics.
            claimRefs:
