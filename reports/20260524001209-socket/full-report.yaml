  headquarters: San Francisco, California, USA
  productSummary: >
    Developer-workflow security platform for open-source dependencies spanning a GitHub App, CLI, VS Code extension,
    Socket Firewall, REST API, and SDKs. The core product combines behavior-based package and maintainer analysis with
    install-time blocking and Coana-derived reachability analysis; enterprise tiers add compliance integrations, SBOM
    workflows, SSO/SAML, audit logs, custom policy, and broader ecosystem coverage.
  customerFocus: >
    AI-native, cloud, and security-conscious software teams that want dependency protection inside existing
    GitHub-centric workflows; typical buyers are CISOs, security engineering, or platform-security leaders, while
    day-to-day users are developers and platform engineers.
  businessModel: >
    Subscription SaaS priced per active developer: Free for open-source use, Team at $25 per developer per month,
    Business at $50 per developer per month, and Enterprise custom. Socket lands through self-serve GitHub deployment
    and expands into enterprise controls, reachability, firewall, compliance workflows, and marketplace procurement.
