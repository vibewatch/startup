companyProfile:
  summary: >
    Socket is a San Francisco software supply chain security company led by founder-CEO Feross Aboukhadijeh. Socket's
    About page says it was founded in 2021, though several 2026 funding materials say 2020. The company sells a
    developer-first platform across GitHub, CLI, VS Code, Firewall, API, and SDK workflows to block malicious packages,
    surface dependency risk before merge or install, and now triage CVEs with Coana-derived reachability analysis.
    Public May 2026 materials say Socket protects more than 27,000 organizations, 1.5 million repositories, and 11.6
    million commits per month, with customers including Anthropic, xAI, Replit, Cursor, Figma, Vercel, Gusto, Mercado
    Libre, and Cribl. The May 2026 Series C valued Socket at $1 billion and brought total disclosed funding to $125
    million. Public disclosures still do not provide ARR, gross margin, NRR, burn, or paid-seat conversion.
  foundedDate: '2021-01-01'
  founders:
    - name: Feross Aboukhadijeh
      role: Founder and CEO
      background: >-
        Open-source developer and security founder behind WebTorrent, StandardJS, Node.js governance work, and Stanford
        teaching.
      claimRefs:
        - CO006
        - CO007
  foundingLocation: >-
    San Francisco, California (public materials consistently place Socket there; separate founding-location disclosure
