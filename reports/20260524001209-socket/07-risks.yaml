chapter:
  number: 7
  title: Risks
  summary: >-
    Socket’s risk profile is dominated by platform dependence on GitHub-centric workflows, the need to keep
    alert quality materially better than bundled alternatives, and a legal/compliance stack that has not kept
    pace publicly with the company’s expanding product surface. The Coana acquisition and 2026 Series C
    strengthened product depth and financing, but they also raise integration, precision, and
    proof-of-durability demands that public materials still do not fully resolve.
sections:
  - id: risk-overview
    title: Risk Overview and Severity Ranking
    body: >-
      Socket’s most material risks cluster around differentiation durability rather than simple survival. The
      company has fresh capital and visible customer proof, but the core investment question is whether Socket
      can keep its detection and prioritization meaningfully better than what large platforms increasingly
      bundle into existing developer workflows. GitHub now ships dependency review, Dependabot, malware
      alerts, SBOM support, advisory data, and artifact attestations, while Snyk has its own reachability
      analysis. Socket’s answer is broader malicious-package detection, Coana-derived reachability, and
      human-verified analysis, but that answer raises its own execution bar: once customers buy Socket to cut
      noise, any regression in precision or workflow friction can quickly undermine willingness to pay. The
      strongest public mitigants are the company’s no-source-code model, transparent status page, enterprise
      controls, and a Series C that reduces near-term financing pressure. The weakest public evidence remains
      around durability: public customer materials show breadth and case-study wins, but not retention,
      concentration, or cohort economics.
    claimRefs:
      - CR001
      - CR003
      - CR020
      - CR023
      - CR028
      - CR036
      - CR039
      - CR040
    tableRefs: []
    figureRefs:
      - FR001
  - id: competition-and-dependency-risks
    title: Competition and Platform Dependency Risks
    body: >-
      Socket is strategically entangled with platforms that also compress the category. Its own
      getting-started guide calls Socket for GitHub the easiest and most powerful deployment path, which is
      rational for adoption but risky because GitHub simultaneously controls the pull-request surface,
      advisory graph, dependency review, and bundled security features that shape buyer expectations.
      Dependabot and dependency review already cover a meaningful subset of what many engineering
      organizations need for policy enforcement on known vulnerabilities, and GitHub can turn those controls
      into default workflow assumptions. Snyk’s reachability work reduces another historical differentiator:
      after Coana, reachability matters more than ever, yet it is no longer unique. Meanwhile npm and GitHub
      are steadily raising the security baseline through trusted publishing, provenance, and attestations.
      Those changes do not eliminate malicious-package risk, but they do make Socket’s long-run moat more
      dependent on precision, policy, response speed, and enterprise workflow fit. Enterprise expansion
      outside GitHub is possible, but pricing and documentation show much of that breadth—GitLab, Azure
      DevOps, self-hosted repositories, SCIM, audit logs, and IP controls—is reserved for higher tiers.
    claimRefs:
      - CR020
      - CR021
      - CR022
      - CR023
      - CR024
      - CR025
      - CR026
      - CR027
      - CR028
      - CR035
