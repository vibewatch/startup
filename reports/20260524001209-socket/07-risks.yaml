      - FR003
  - id: product-quality-and-operational-risks
    title: Product Quality, Coverage, and Operational Risks
    body: >-
      Socket’s product promise is precision under real-world developer constraints, so false-positive and
      false-negative risk remains central even after the Coana deal. Coana’s reachability engine and Socket’s
      pricing claims suggest substantial noise reduction, but those same claims make customer disappointment
      more expensive if precision slips in dynamic or partial-coverage environments. Socket’s no-source-code
      architecture is a procurement strength, yet it also creates blind spots: the company’s own known-issues
      page says private npm packages are skipped unless the private repository is separately enabled or the
      package is restructured as a workspace. Coverage is also uneven across ecosystems and surfaces. GitHub
      Actions lacks reachability and autofix in the public matrix, Swift remains CVE-only, and several
      ecosystems are still planned or unsupported. Operational complexity keeps rising as Socket adds browser
      extensions, AI-model scanning, GitHub Actions analysis, and more language engines. The status page shows
      how many discrete components must stay healthy, while CI/CD integration guides show customers still need
      to manage API keys, tokens, and branch-protection details correctly. The Vanta integration further
      demonstrates that compliance automation can be operationally brittle when third-party token behavior is
      unstable.
    claimRefs:
