  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - GitHub platform compression
        - GitHub ships materially broader dependency, malware, or policy controls by default
        - A major buyer cohort can replace Socket with GHAS/Dependabot plus native policy checks at renewal
        - >-
          Move thesis from premium-growth to price-pressure case unless Socket shows better precision and
          retained wins
      - - Alert precision deterioration
        - >-
          Public case studies or customer references stop citing major noise reduction, or support burden
          rises sharply
        - >-
          Any evidence that false-positive reduction claims no longer hold in dynamic or mixed-language
          environments
        - Treat as thesis-breaking because precision is the core product promise
      - - Coana integration slippage
        - Key Coana leaders leave or reachability rollout stalls on important ecosystems
        - Missed enterprise rollout milestones or team departures before the feature is embedded broadly
        - Increase execution discount and require proof of sustained customer value from reachability
      - - Legal / privacy disclosure lag
        - >-
          No updated DPA, subprocessor, or refreshed privacy/legal package appears despite enterprise
          expansion
        - Another 2-3 quarters pass without refreshed public documentation or customer-ready evidence packs
        - >-
          Assume procurement friction and require management-close diligence before underwriting
          regulated-customer growth
      - - Availability / integration brittleness
        - Repeated outages or token-based integration failures hit GitHub, GitLab, or Vanta flows
        - Material incident frequency or persistent support escalations on key integrations
        - Discount expansion assumptions and treat operational reliability as a board-level issue
      - - Durability proof gap after the Series C
        - Next major financing or board package still lacks ARR, NRR, churn, or concentration detail
        - >-
          No improvement in public or diligence-room durability metrics before the next step-up round or major
          secondary event
        - Do not underwrite a premium multiple without private evidence of retention and concentration quality
    notes: >-
      These triggers are chosen for observability: each can be monitored externally or requested explicitly in
      diligence.
