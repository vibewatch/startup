  evidenceGaps:
    - type: missing-source
      severity: material
      topic: enterprise-contract-liability
      missingEvidence: >-
        Current public or diligence-room copies of Socket’s enterprise MSA, DPA, indemnity schedule, warranty
        language, and SLA credits.
      whyItMatters: >-
        Without contract detail, investors cannot size downside from false negatives, outages, privacy events,
        or customer claims.
      diligencePath: >-
        Request current contract set used for new enterprise deals, including liability caps, carve-outs,
        service credits, indemnity scope, and security commitments.
      relatedQuestionRefs:
        - QR020
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: revenue-retention
      missingEvidence: >-
        ARR, NRR, GRR, top-customer concentration, contract length, expansion rates, and win/loss data by
        platform or ecosystem.
      whyItMatters: >-
        The Series C valuation implies premium durability, but public materials show demand breadth without
        proving revenue quality or retention.
      diligencePath: >-
        Obtain board deck or operating metrics package with cohort retention, concentration, net dollar
        retention, pipeline conversion, and competitor displacement analysis.
      relatedQuestionRefs:
        - QR017
        - QR029
      relatedTableRefs:
        - TR004
    - type: missing-source
      severity: material
      topic: privacy-subprocessors
      missingEvidence: >-
        Updated DPA, subprocessors list, EU residency posture, and documented data-retention schedule aligned
        to the 2026 product set.
      whyItMatters: >-
        Enterprise procurement and cross-border transfer reviews depend on fresher documentation than the 2022
        privacy policy currently visible.
      diligencePath: >-
        Request the current DPA package, subprocessors annex, retention schedule, incident-notification
        commitments, and EU-specific buyer FAQ used by sales.
      relatedQuestionRefs:
        - QR018
        - QR019
        - QR021
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: minor
      topic: litigation-monitoring
      missingEvidence: >-
        A comprehensive litigation schedule covering threatened claims, arbitration, settlement letters, and
        non-US matters.
      whyItMatters: >-
        Public regulator and court monitoring is useful but incomplete, so absence of a public signal is not
        the same as zero legal exposure.
      diligencePath: >-
        Request management’s litigation schedule, threatened-claim log, insurance notices, and any regulator
        correspondence for the last 24 months.
      relatedQuestionRefs:
        - QR023
      relatedTableRefs:
        - TR001
