callouts:
  - calloutType: risk
    title: GitHub is both Socket’s easiest route to value and its most dangerous compression vector
    body: >-
      Public Socket docs present GitHub as the easiest and most powerful deployment path, while GitHub itself
      now bundles dependency review, advisories, malware alerts, and artifact attestations. That combination
      makes platform dependence and platform competition inseparable risks rather than two separate issues.
    claimRefs:
      - CR020
      - CR021
      - CR038
  - calloutType: risk
    title: Precision is the thesis fulcrum
    body: >-
      After Coana, Socket is explicitly selling less noise and more actionable reachability. If customers do
      not feel a step-change in alert quality, the company loses both its clearest differentiator and the
      justification for premium pricing beside GHAS, Dependabot, or Snyk.
    claimRefs:
      - CR006
      - CR007
      - CR023
      - CR024
      - CR047
      - CR048
  - calloutType: insight
    title: Public proof shows breadth of adoption, not durability of economics
    body: >-
      The named customers, case studies, and Series C announcement prove demand. They do not prove NRR,
      concentration quality, or renewal behavior, which means a large share of underwriting still depends on
      private diligence rather than public evidence.
