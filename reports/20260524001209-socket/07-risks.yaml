  - id: legal-regulatory-and-trust-risks
    title: Legal, Regulatory, and Trust Risks
    body: >-
      Socket does several privacy-positive things publicly—most importantly, it says it never uploads source
      code—but its legal and compliance disclosures still look thin relative to the current product surface.
      The privacy policy remains dated February 2022 despite 2025-2026 expansion into more integrations,
      AI-related surfaces, enterprise controls, and broader analysis categories. That policy also explicitly
      contemplates third-party processing and disclosures required by law or government request, so
      cross-border transfer mechanics matter in enterprise sales. The EU-US Data Privacy Framework helps, but
      it does not remove the need for safeguards, diligence, and updated documentation when regulated
      customers ask for current transfer, subprocessors, and data-handling detail. The EU Cyber Resilience Act
      raises the forward-looking burden further by bringing reporting obligations into 2026 and broader
      lifecycle obligations into 2027. Contractually, Socket’s public agreements page proves agreements exist
      and are current, but not what liability caps, indemnity scope, or uptime commitments actually say
      outside marketing-level summaries. Public enforcement searches did not surface a Socket-specific FTC
      matter during this review, but that is only a monitoring signal—not proof that there are no threatened
      claims, customer disputes, or regulator questions elsewhere.
    claimRefs:
      - CR029
      - CR030
      - CR031
      - CR041
      - CR042
      - CR043
      - CR044
    tableRefs:
      - TR001
    figureRefs: []
  - id: people-execution-and-proof-gaps
    title: People, Execution, and Proof Gaps
    body: >-
      Socket’s public momentum is real: the Series C, named customers, and broad case-study roster establish
      market relevance. But proof of relevance is not the same as proof of durability. Public materials show
      many logo-level and case-study-level wins, especially around alert reduction and workflow efficiency,
      yet they do not disclose ARR, NRR, churn, or concentration with the specificity an investor would
      normally want after a $1 billion valuation round. Execution risk is amplified by breadth. SecurityWeek
      reported roughly 100 employees at the time of the Series C, while Socket simultaneously markets or
      documents GitHub, GitLab, Azure DevOps, AI-model scanning, browser extensions, firewall, certified
      patches, reachability, enterprise governance, and more. Founder-led credibility is a strength—Feross
      Aboukhadijeh and the advisor network clearly help trust and recruiting—but that public positioning also
      concentrates reputational and product-authorship risk. The Coana acquisition mitigates part of the
      technical gap, yet it also introduces dependence on retaining a newly integrated, research-heavy team
      while converting that expertise into repeatable enterprise product outcomes.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR036
      - CR037
      - CR039
      - CR040
      - CR045
    tableRefs:
      - TR004
