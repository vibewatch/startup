chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品逻辑与当前规模
        blocks:
          - type: paragraph
            body: >-
              Socket 的公开材料一贯把公司定位为开发者优先的软件供应链安全平台：恶意或高风险开源依赖进入生产前就要被拦下。 核心产品逻辑不是先查数据库，而是先看行为。Socket 称会实时分析依赖行为，再把结果推到
              GitHub、CLI、文档和安装时 Firewall 工作流里，而不是等 CVE 披露后再入库。文档和定价材料把商业定位说得更清楚：开源项目有免费路径， 企业买方为策略深度和支持付费；Socket
              还称源代码本身留在本地，只把依赖元数据传到上游。


              身份层基本清楚，但并不完全干净。当前官方和独立材料都把 Socket 放在 San Francisco，但公开来源对创立年份不一致： 官方 About 页面写 2021，若干 2026 年融资材料写
              2020。这个差异不改变经营故事，但提醒我们，公司公开时间线仍需要文件层面的校准。 有充分支撑的是规模。到 2026 年 5 月，Socket 称其保护超过 27,000 个组织、1.5 million
              个代码库、每月 11.6 million 次提交， 并且每周拦截超过 10,000 次攻击。
