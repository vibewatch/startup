      - number: '7.4'
        title: 法律、监管与信任风险
        blocks:
          - type: paragraph
            body: >-
              Socket 公开做了几件隐私友好的事——最重要的是它说自己从不上传源代码——但相对于当前产品面，它的法律和合规披露仍显得偏薄。尽管 2025-2026 年公司扩展到更多集成、AI
              场景界面、企业控制项和更广分析类别，隐私政策仍停在 February 2022。政策也明确涵盖第三方处理，以及按法律或政府要求披露，因此跨境传输机制会影响企业销售。EU-US Data Privacy
              Framework 有帮助，但当受监管客户要求最新的传输、子处理方和数据处理细节时，它不能替代保障措施、尽调和更新文档。EU Cyber Resilience Act 进一步抬高前瞻负担：2026
              年开始引入报告义务，2027 年扩展到更广生命周期义务。合同层面，Socket 的公开 agreements 页面证明协议存在且为当前版本，但没有说明营销摘要之外的责任上限、赔偿范围或 uptime
              承诺究竟如何。公开执法搜索在本次审查中没有发现针对 Socket 的 FTC 事项，但这只是一个监测信号，不等于其他地方不存在潜在索赔、客户争议或监管问题。
