        - 头部客户 logo 和 27,000+ 个受保护组织，暗示真实市场拉力。
        - 免费 / 开源使用可能把覆盖面做大，却不对应付费收入。
        - 按套餐层级拆分受保护用户、付费席位和企业 ACV。
      - - 可比公司支撑
        - JFrog、PANW 和 Wiz 显示，市场愿意为强开发者安全平台支付高倍数。
        - GitLab 和 SentinelOne 显示，公开市场也会很快重估到低得多的收入倍数。
        - 提供当前 ARR、NRR、毛利和增长，把 Socket 可信地放进可比区间。
      - - 竞争
        - Socket 的开发者优先工作流和威胁研究节奏，形成了真实产品身份。
        - GitHub 把 AppSec 打包进原生工作流，Copilot 正变成 AI 时代的开发者控制平面。
        - 展示相对 GHAS 的胜率，以及大客户中长期工作流所有权的证据。
    notes: 反向假设核心是变现和打包压力，而不是否定需求。
