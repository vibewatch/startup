      - number: '6.2'
        title: 具名验证与部署深度
        blocks:
          - type: paragraph
            body: >-
              Socket 的公开验证在不同客户之间强弱差异明显。Anthropic、Replit、Vercel、Cedar、Chia、JumpCloud、Render、 Doctolib、Drata、MetaMask、SHI
              和 JupiterOne 都有具名案例研究或详细证言，描述部署表面、买方角色或运营结果 [CU008, CU010, CU012, CU013, CU015, CU016, CU018, CU019,
              CU020, CU021, CU022]。Anthropic 是量化最好的一条验证： 公司称 Socket 被嵌入内部依赖批准流水线，把手工依赖审查减少 95%，每周为安全工程师节省超过五小时 [CU008,
              CU009]。 Cedar 和 Chia 提供次强量化证据，分别描述上线后告警负担或未关闭安全告警减少 70% [CU014, CU015]。


              Replit 和 Vercel 解释了为什么 Socket 能打动 AI 原生和开发者工具客户。Replit 描述了 GitHub 检查推出、更少误报， 以及围绕传递依赖和合规工作流的更高信心 [CU010,
              CU011]。Vercel 强调 pnpm 和 monorepo 适配、分阶段推出、 依赖蔓延减少，以及开发者认知负担降低 [CU012]。JumpCloud、JupiterOne、Doctolib、SHI 和
              Render 把故事进一步推向治理和运营： SBOM 与许可证支持、CI/CD 执行、审计准备、最小访问部署，以及持久低摩擦的 PR 使用 [CU016, CU017, CU018, CU019, CU022,
              CU040]。


              限制在于，Socket 最亮眼的客户标识并非同等充分。xAI、Cursor、Figma、Gusto 和 Mercado Libre 出现在官方客户名单中，
              但已审阅的公开语料没有披露这些账号的部署架构、合同范围或结果 [CU023]。这意味着 Socket 可以合理声称拥有标志性客户标识； 但在案例研究集合之外，公开记录仍更接近客户标识验证，而不是深度生产验证。
