disclaimer: >
  本尽调报告仅基于截至 2026-05-24 的公开信息，不构成投资建议。Socket 是一家私营公司，若干关键财务和合同输入——包括年经常性收入（ARR）、GAAP
  收入、毛利率、净留存率（NRR）、烧钱速度、股权结构条款和付费客户数——均未公开披露。公司声称的运营指标、客户名单和产品性能说法，未必能直接映射到付费收入或经审计结果。因此，分析判断和估值区间应视为方向性，而非定论。
