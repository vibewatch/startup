              公开单位经济性证据大多是代理指标，但这些代理指向软件式经济性，而不是重资产模式。Socket 销售云交付分析、席位和高级工作流功能，
              而不是硬件、库存或项目融资重的资产。定价页按开发者包装和企业支持功能显示，毛利率更多取决于算力、数据处理、支持和商业化效率， 而不是实体交付成本。同一页面还暴露分层增购路径，例如合规集成、审计日志、SBOM
              工作流、可达性、私有 Slack 频道和指定客户经理； 这些都意味着大客户会带来一定增量服务交付负担。Coana 在财务上重要，因为其可达性技术被定位为降低误报和修复时间；
              如果这些主张成立，收购可以提高产品价值和留存，同时不改变 Socket 的基本软件成本结构。公司仍未发布 CAC、回本周期、毛利率、支持比率或 NRR，
