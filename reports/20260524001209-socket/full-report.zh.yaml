      - number: '6.3'
        title: 留存代理、客户声音与运营摩擦
        blocks:
          - type: paragraph
            body: >-
              Socket 没有公开披露 NRR、GRR、合同期限、客户留存队列，或从免费 / 开源使用转化为付费企业账号的客户数 [CU026, CU035]。
              因此，公开耐久性只能从工作流粘性、评测情绪和更深运营嵌入证据中推断。这些代理指标方向上正面。Render 称 Socket 多年来一直留在 PR 中，因为它保持低噪声；JumpCloud 把它输入覆盖 50
              个团队和 600+ 个代码库的内部评分；JupiterOne 把它视作 CI/CD 策略门；Replit 和 Doctolib 则把它连接到合规证据和客户保证 [CU017, CU018, CU019,
              CU040]。


              独立评测也大多正面，尽管严谨度不如具名案例研究。AppSecSanta、ToolRadar、Startupik 和 MakerStack 都把 Socket 描述为靠行为分析、 PR
              级反馈和主动供应链检测区别于经典 CVE 匹配 [CU027]。与此同时，这些评测也持续指出，平台仍在成熟， 在 npm 或 JavaScript 为主的环境中最强，并且最好与传统 CVE
              扫描器搭配使用，而不是完全替代 [CU028, CU038]。


              反向证据也重要。2025 年 1 月一篇 Medium 测试称，Java 依赖没有出现在 Socket 的 UI 或 PR 评论中，即使支持团队承认并部分修复了已报告问题；
              作者认为，如果买方假设生态覆盖是通用的，这可能制造虚假的安全感 [CU029]。Socket 自己的 Vanta 集成文档也指出，OAuth 令牌经常被撤销， 这会为合规用户制造同步缺口，直到连接重新授权
              [CU030]。这些问题并不抵消强 GitHub 原生客户背书，但确实限定了留存故事： 当 GitHub、JavaScript/Python 和低摩擦开发者工作流是买方环境核心时，产品最容易承保 [CU038]。
