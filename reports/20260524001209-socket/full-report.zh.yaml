  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与规模证据
        blocks:
          - type: paragraph
            body: >-
              Socket 的 May 2026 Series C 描述起来容易，写进投资模型更难。可观察部分很强：公司称自己以 $1 billion 估值融资 $60 million，使累计融资达到大约 $125
              million，并把 Thrive Capital、a16z、Abstract Ventures 和 Capital One Ventures 加进了一个高质量投资团。公开运营证据也强过典型 Series
              C。Socket 披露了 Anthropic、xAI、Figma、Vercel、Mercado Libre 等有辨识度的客户；官网称保护了 27,000+ 个组织、300,000+ 个仓库、1.5 million
              名受信任开发者、每月 11.6 million 个受保护 commits，并且每周拦截超过 10,000 次攻击。2025 年收购 Coana 又提供了第二个重要信号：Socket
              称收入较前一年增长超过三倍，并借这笔交易把可达性分析带入平台，意图降低告警噪音，把产品从基础 SCA 往外推。AI
              编码扩大第三方代码进入生产的规模之后，投资人愿意为软件供应链安全里的品类领导者支付溢价，这些都是可信理由。


              仍然难以承销的部分在于透明度。公开来源没有披露年经常性收入（ARR）、净留存、毛利率、现金消耗，或决定 $1 billion
              企业价值对新资金是否真正有吸引力的股权结构瀑布。因此，本轮价格可以作为战略品类押注来辩护，但还没有完全证明是一笔由基本面支撑的便宜交易。
