      - number: '8.3'
        title: 乐观、基准与悲观估值区间
        blocks:
          - type: paragraph
            body: >-
              情景框架应该保持简单，因为最大未知数是当前 ARR。悲观情景下，Socket 仍是一家真实公司，技术也强，但公开规模信号转化为收入的速度慢于本轮隐含预期。这大致对应 $25 million to $35
              million ARR 和十几倍中段到 20x 的倍数，得到大约 $450 million to $700 million 价值。基准情景下，Socket
              已经把受保护开发者足迹中的一个有意义少数，成功转成付费席位、企业套餐，以及 ARPU 更高的可达性或 firewall 模块。这能支撑大约 $45 million to $60 million ARR 和约
              18x to 22x 倍数，对应 $800 million to $1.1 billion 附近。


              乐观情景需要的不只是好 logo 和快速产品节奏。它需要证据证明，2025 年收入增长超过三倍已经转化为 2026 年持续规模化，变现更接近高个位数开发者转化率或等效企业
              ACV，而且市场继续把软件供应链领导者当作 Wiz 或 Chainguard，而不是增速更慢的公开 DevSecOps 公司。在这些条件下，$65 million to $85 million ARR 和 20x
              to 25x 倍数可以支撑大约 $1.2 billion to $1.7 billion。概率加权中枢仍略低于本轮，因此本轮看起来可辩护，但并不显然便宜。
            claimRefs:
              - CV045
