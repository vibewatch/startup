      - number: '2.2'
        title: 规模测算：直接供应链安全、更广 AppSec 与可服务市场（SAM）
        blocks:
          - type: paragraph
            body: >-
              公开市场规模需要按区间处理，而不是只看单一总可用市场（TAM）标题。我们找到最干净的直接品类口径来自 Verified Market Reports： 软件供应链安全 2025 年为 USD 1.2
              billion，到 2034 年增至 USD 4.5 billion。更广应用安全估算大一个数量级： Mordor 给出 2026 年 USD 14.83 billion，Fortune 给出 2026 年
              USD 14.86 billion。这些数字可作为相邻天花板， 因为更广 AppSec 预算有时会吸收依赖安全，但它们太宽，不能称为 Socket 的直接 TAM。另一个极端是 Mordor 的 SCA 页面声称
              2026 年市场为 USD 430.12 billion；相对邻近 AppSec 估算过大，应视为品类膨胀警示，而不是估值锚。实际测算应分层： 直接软件供应链安全作为地板，更广 AppSec
              作为相邻天花板，可服务市场（SAM）则由活跃开发者或提交者界定——其组织愿意为依赖准入控制、 SBOM 工作流和恶意软件包分流持续付费。
