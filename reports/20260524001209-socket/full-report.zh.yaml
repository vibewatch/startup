    data:
      layers:
        - label: 开发者入口
          detail: GitHub PR 检查、CLI 工作流、VS Code 扫描，以及 API 或 SDK 集成，是用户调用 Socket 的公开方式。
          items:
            - GitHub App
            - CLI
            - VS Code 扩展
            - REST API / SDKs
        - label: 依赖摄取层
          detail: Socket 接收清单文件、锁文件和安装请求，以判断哪些第三方代码进入环境。
          items:
            - 清单文件
            - 锁文件
            - 安装命令
            - 包图谱上下文
        - label: 风险分析层
          detail: 行为分析、元数据分析和维护者行为启发式规则，为依赖生成第一轮风险画像。
          items:
            - 行为标记
            - 元数据异常
            - 维护者变化
            - 威胁签名
        - label: 精准度和优先级层
          detail: 可达性分层决定漏洞是否真的值得升级处理，还是应当压制。
          items:
            - 依赖可达性
            - 预计算可达性
            - 全应用可达性
        - label: 执行和报告层
          detail: 结果回到工作流，形式包括 PR 评论、编辑器发现、导出数据、仪表盘或安装时阻断。
          items:
            - PR 评论
            - 编辑器发现
            - Firewall 阻断或警告
            - 导出 / 仪表盘
