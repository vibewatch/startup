      - 收入 / ARR 锚点
      - 估值 / 市值
      - 隐含倍数
      - 参照意义
      - 局限
    rows:
      - - GitLab
        - 上市 DevSecOps 平台
        - $955.2M FY2026 收入
        - $4.51B 市值
        - ~4.7x
        - 为内嵌安全能力的开发者工具提供上市公司下限
        - 公开市场倍数反映增长较慢、产品范围更宽。
      - - SentinelOne
        - 上市网络安全平台
        - $1.001B FY2026 收入
        - $6.38B 市值
        - ~6.4x
        - 规模化但仍亏损的安全软件上市中档参照
        - 更接近终端安全，不是供应链开发者工作流。
      - - JFrog
        - 上市软件供应链 / DevSecOps
        - $628M-$632M FY2026 收入指引
        - $8.96B 市值
        - ~14.2x
        - 保护软件交付链的最贴近上市可比公司
        - 用的是前瞻指引，不是已完成财年。
      - - Palo Alto Networks
        - 规模化上市网络安全平台
        - $9.2B FY2025 收入
        - $211.33B 市值
        - ~23.0x
        - 表明投资人愿为分发强、覆盖广的安全平台支付溢价
        - 规模、分散度和成熟度都远高于 Socket。
      - - Wiz
        - 私营高溢价云安全可比公司
        - ~$350M ARR (2024)
        - $12B 估值
        - ~34.3x
        - 快速扩张安全龙头的私营溢价上限参照
        - 产品范围不同，披露 ARR 基数也大得多。
      - - Chainguard
        - 私营软件供应链可比公司
        - $40M ARR，近期目标 >$100M
        - $3.5B 估值
        - ~87.5x 当前 / ~35x 目标
        - 最接近的软件供应链高增长估值参照
        - 倍数属离群值，且是 2025 年披露，不是稳定中位可比。
    notes: 可比估值计算旨在圈定 Socket 需要多少 ARR 才能支撑 $1B，而不是暗示存在一个完美对标。
