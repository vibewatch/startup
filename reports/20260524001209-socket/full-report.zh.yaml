  - id: TR005
    title: 缓释措施与放弃标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - GitHub 平台挤压
        - GitHub 默认推出显著更宽的依赖、恶意软件或策略控制能力
        - 续约时，主要买家群体可以用 GHAS/Dependabot 加原生策略检查替代 Socket
        - 除非 Socket 证明精准度更强且胜单可留住，否则将投资判断从高溢价增长切到价格压力情景
      - - 告警精准度恶化
        - 公开案例或客户背书不再提显著降噪，或支持负担急剧上升
        - 任何证据显示，动态或多语言环境下的误报降低主张不再成立
        - 视为打破投资假设，因为精准度是产品核心承诺
      - - Coana 整合延误
        - Coana 核心负责人离开，或可达性功能在重要生态的推出停滞
        - 功能广泛嵌入前，企业推出里程碑未达成或团队成员离职
        - 提高执行折扣，并要求可达性分析带来持续客户价值的证据
      - - 法律 / 隐私披露滞后
        - 企业扩张之下，仍没有更新 DPA、子处理方清单或刷新后的隐私 / 法律材料
        - 再过 2-3 个季度，公开文档或面向客户的证据包仍未刷新
        - 在押注受监管客户增长前，假设采购摩擦存在，并要求管理层深度尽调
      - - 可用性 / 集成脆弱性
        - GitHub、GitLab 或 Vanta 流程反复受到宕机或 token 集成故障影响
        - 关键集成出现重大事故频率，或支持升级长期持续
        - 下调扩张假设，把运营可靠性视为董事会层面问题
      - - Series C 轮后的耐久性证据缺口
        - 下一轮重大融资或董事会材料仍缺少 ARR、NRR、流失或集中度细节
        - 下一轮估值上调融资或重大老股交易前，公开材料或尽调室中的耐久性指标没有改善
        - 没有留存和集中度质量的私下证据，就不要给高倍数定价
    notes: 这些触发项按可观测性选择：每一项都可以外部监控，或在尽调中明确索取。
