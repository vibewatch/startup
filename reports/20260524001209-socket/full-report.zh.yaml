  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 定价模型、牵引力与收入形态
        blocks:
          - type: paragraph
            body: >-
              对一家私有安全创业公司而言，Socket 的公开变现界面异常清晰，尽管实际经济性仍不透明。定价页显示按开发者计费的 SaaS 模型： $0 Free 层级、$25 Team 层级、$50 Business
              层级和自定义 Enterprise 合同，另有年度预付折扣、创业公司折扣、市场采购和大客户手工开票。 这个结构意味着收入更像经常性订阅，而不是服务驱动变现，但它没有披露实际
              ACV、折扣或续约质量。最强牵引力信号来自 Socket 自己的 2026 年 5 月 Series C 材料和首页：超过 27,000 个组织受保护、1.5 million 个代码库、每月 11.6
              million 次提交受保护、 每周超过 10,000 次攻击被拦截。这些指标加上 Anthropic、xAI、Replit、Cursor、Figma、Vercel、Gusto、Mercado Libre 和
              Cribl 等具名客户，支撑需求和企业适配度。缺失的仍是核心收入账本：没有官方 ARR、GAAP 收入、毛利率或留存披露。
