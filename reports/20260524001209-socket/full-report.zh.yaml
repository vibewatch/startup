              CLI 或 GitHub Action 设置以及特定语言运行时前置条件。 Coana 收购是这里的关键技术动作：Socket 明确使用 Coana 的静态分析和控制流分析来判断某个 CVE 是否真正可达；
              官方材料强调，预计算可达性可以在不立刻要求上传源代码的情况下带来大幅降噪。这是相对于只停留在漏洞匹配列表工具的实质差异化。
