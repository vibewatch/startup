        blocks:
          - type: paragraph
            body: >-
              Socket 的反向财务视角不是可见困境，而是披露质量。公开来源能支撑融资规模、投资人名单、标价、客户标识和增长叙事， 却无法承保收入质量或下行韧性。第三方市场数据网站提供部分替代，但会引入噪声：ZoomInfo
              模型估计收入约 $18.1 million、 员工 51-200 人；Tracxn 显示一家已融 $125 million 的 Series C 公司，但隐藏关键数字；Scamadviser 一边报告信任分为零，
              一边又说网站可能合法。即便 Socket 自己的界面也并非完全一致，About 页面称公司创立于 2021 年，多份融资材料称 2020 年。 收购经济性同样不完整：官方和独立报道都同意 Coana 于 2025
              年 4 月被收购，但收购价格和整合成本未披露； 少数已发布的收入增长或收购价格估算看起来是聚合或投机性质。本章结论因此是建设性但不完整：经常性软件收入看似可信，
