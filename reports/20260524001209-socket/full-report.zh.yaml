  - id: TV005
    title: 打破投资假设与放弃触发项表
    columns:
      - 触发项
      - 阈值
      - 如何传导到投资假设
      - 行动含义
    rows:
      - - ARR 不足
        - 当前 ARR 明显低于 ~$40M
        - 会打破 $1B 可由上市中档以上倍数支撑的逻辑。
        - 重估到悲观区间；除非价格大幅重置，否则放弃。
      - - 付费转化弱
        - 受保护开发者变现率为低个位数，或企业 ACV 偏弱
        - 显示庞大覆盖面更多是漏斗顶部，而非可变现需求。
        - 把本轮从大致合理下调为偏贵。
      - - 打包压力
        - GitHub GHAS / Copilot 在核心企业工作流中替代 Socket
        - 压缩挂载率，并削弱长期席位所有权。
        - 下调目标倍数，把平台风险视为打破投资假设。
      - - 毛利 / 烧钱效率弱
        - 毛利或烧钱效率明显低于高溢价软件常态
        - 把品类故事变成资本强度问题。
        - 收紧估值区间，并要求更强融资条款。
      - - 优先权悬顶
        - 股权结构或结构化条款在 $1B-$1.2B 结果附近吞掉价值
        - 可辩护的企业价值仍可能带来糟糕股权回报。
        - 没有清算瀑布清晰度或更优结构，就不要投。
    notes: 触发项是可衡量的经营或结构事件，不是泛泛风险。
    claimRefs:
      - CV048
      - CV056
      - CV058
      - CV059
      - CV060
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前 ARR / 增长
        - 最新 ARR、增长率，以及按产品和套餐拆分的收入桥
        - 这是区分合理和偏贵的最大变量。
        - CFO 看板、董事会材料或经审计管理账。
      - - 客户质量
        - 付费客户数、席位数、ACV 区间，以及按队列拆分的净留存
        - 把已披露覆盖面转成真实变现证据。
        - 销售 / FP&A 队列切片和前 50 大客户复核。
      - - 单位经济
        - 毛利、烧钱、销售效率和云托管成本结构
        - 决定高溢价私营倍数能否持续。
        - 财务尽调和经营计划复核。
      - - 竞争证据
        - 相对 GHAS、GitLab、JFrog 及其他打包替代方案的赢单 / 输单和续约数据
        - 检验工作流所有权是持久还是暂时。
        - 销售运营分析，加客户背调电话。
      - - 资本结构
        - 完全稀释股权表、优先权条款，以及任何老股或要约收购经济性
        - 把企业价值转成投资人实际回报数学。
        - 法务 + 财务复核股权表、融资文件和 409A 材料。
    notes: 这些问题是把 $1B 当成高信念进入点前必须拿到的最低材料包。
    claimRefs:
      - CV049
      - CV052
      - CV060
      - CV061
      - CV062
