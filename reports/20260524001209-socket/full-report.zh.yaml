  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-relevant public and private cyber/devtools valuation anchors with retained May 2026 or
        latest available revenue evidence. Private comparables remain partial because most do not disclose current ARR
