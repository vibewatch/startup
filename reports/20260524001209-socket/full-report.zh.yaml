      - number: '3.2'
        title: 直接专业厂商与既有平台
        blocks:
          - type: paragraph
            body: >-
              Snyk、Mend、Endor Labs、JFrog Xray 和 FOSSA 是最接近的直接竞争对手，因为每一家都有可能赢下同一笔开源风险降低预算， 尽管解决方式并不相同。Snyk
              销售的是保留集合里最广的开发者优先平台，覆盖 SCA、代码、容器、IaC、API 和 AI 工作流， 并带有可达性感知优先级和自动修复 PR。Mend 同样推更大的平台逻辑，在按贡献开发者计费模型下加入可达性驱动
              SCA、 AI 代码控制和 Renovate 式依赖自动化。Endor Labs 对 Socket 的分流叙事压力最大：它营销横跨一方代码、依赖和容器镜像的全栈可达性， 其竞争页面则攻击 Socket
              在策略上不够透明、可定制性较弱。

              JFrog Xray 和 FOSSA 重要，但原因不同。Xray 最强的场景是控制点在制品流水线而不只是代码库，因为它会在 JFrog Platform 内持续扫描代码库、 构建包、镜像和已存制品。FOSSA
              更少关注抓住下一轮 npm 恶意软件活动，更多关注合规运营、SBOM、代码片段扫描和二进制扫描。 这些直接对手合在一起说明，Socket
              的竞争并不只是「另一个扫描器」：有的供应商拼开发者工作流广度，有的拼可达性深度， 还有的拼合规或制品治理成熟度。
