      nodes:
        - label: 发现与轻量评估
          description: 安全或平台负责人通过威胁研究、应用市场列表、同行推荐，或安全事件带来的紧迫性发现 Socket。
          actors: CISO, Head of Security, Security Engineering lead
          examples: GitHub Marketplace copy, Vercel evaluation, Render peer recommendation
        - label: GitHub 原生初始落地
          description: 客户启用 GitHub App 或 GitHub 检查，让开发者在 PR 里收到依赖反馈，流程改动很小。
          actors: Security engineer, application developers, platform engineers
          examples: Replit, Cedar, JumpCloud, SHI, Render
        - label: 策略调校与精度控制
          description: 客户加入阈值、可达性、分阶段上线或 API 驱动审批逻辑，以降噪并自动判断哪些依赖可以接受。
          actors: Security engineering, AppSec, platform team
          examples: Anthropic API workflow, Vercel phased rollout, JupiterOne CI policy
        - label: 嵌入治理与合规
          description: Socket 进入 SBOM、许可证、审计或合规证据流程，并为客户信任和内部控制流程供数。
          actors: Security, compliance, legal, audit stakeholders
          examples: JumpCloud SBOMs, Replit Vanta flow, Doctolib audits
        - label: 覆盖面扩张与平台化
          description: 客户从仓库扫描扩展到依赖搜索、防火墙、浏览器扩展，或覆盖工程体系的开发者端点保护。
          actors: Security leadership, developer platform, IT / endpoint security
          examples: MetaMask historical dependency search, JumpCloud Firewall, Secure Annex roadmap
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU012
      - CU016
      - CU018
      - CU031
      - CU041
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开扩张路径从 PR 时扫描开始，再深化到策略、合规和端点覆盖。
    approximationNotes: 这是定性的部署流程，不是量化转化漏斗。公开资料没有披露赢单率或各阶段数量。
    data:
      nodes:
        - id: f1
          label: 评估风险缺口
          detail: 买方发现，只看 CVE 的工具会漏掉恶意包和传递依赖风险。
        - id: f2
          label: 安装 GitHub App / 检查
          detail: Socket 在 GitHub 中落地，设置成本低，PR 可见性马上到位。
        - id: f3
          label: 降噪并自动决策
          detail: 可达性、阈值或 API 评分降低人工审查成本和误报。
        - id: f4
          label: 嵌入合规与 SDLC 控制
          detail: 许可证检查、SBOM、Vanta 同步或 CI 策略门禁成为日常治理的一部分。
        - id: f5
          label: 扩展开发者触点
          detail: 客户采用依赖搜索、防火墙、浏览器扩展或相邻防护层。
      edges:
        - from: f1
          to: f2
          label: 初始切入点
        - from: f2
          to: f3
          label: 证明信号质量
        - from: f3
          to: f4
          label: 支撑治理用途
        - from: f4
          to: f5
          label: 落地后扩张
    claimRefs:
      - CU007
      - CU011
      - CU031
      - CU032
      - CU033
      - CU041
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 公开证据质量差异很大：既有量化案例，也有几乎没有部署深度披露的标杆客户标识。
    approximationNotes: 评级是对公开证据深度的定性评估。强表示具名部署加具体工作流或结果细节；弱表示仅有客户标识提及，部署细节很少或没有。
    data:
      columns:
        - 结果具体度
        - 部署细节
        - 扩张信号
        - 独立佐证
      rows:
        - label: Anthropic
          values:
            - 强 — 减少 95%，每周节省 >5 小时
            - 强 — 详细披露 API 驱动审批管线
            - 中 — 适配扩张中的研究和基础设施团队
            - 中 — 投资人与新闻引语佐证客户标识
        - label: Replit
          values:
            - 中 — 披露降误报和合规价值，但未量化
            - 强 — 描述 GitHub 检查工作流
            - 中 — 与 Vanta 和合规挂钩
            - 中 — 官方引语在融资材料中重复出现
        - label: Vercel
          values:
            - 中 — 改善依赖蔓延和认知负担
            - 强 — 披露 pnpm / monorepo 和分阶段落地细节
            - 中 — 基础治理和落地深度暗示更广平台使用
            - 中 — 官方引语在融资材料中重复出现
        - label: Cedar
          values:
            - 强 — 告警减少 70%，月度工作量变化有披露
            - 强 — 描述 GitHub 加可达性工作流
            - 中 — 评分卡路线图暗示更深嵌入
            - 弱 — 未看到独立客户侧文章
        - label: Chia / JumpCloud / JupiterOne
          values:
            - 中 — 运营细节强，量化程度不一
            - 强 — GitHub、SBOM、CI 策略和端点细节
            - 强 — 治理和合规扩张清晰可见
            - 弱 — 佐证主要来自供应商主导的案例材料
        - label: xAI / Cursor / Figma / Gusto / Mercado Libre 等客户
          values:
            - 弱 — 未看到公开 KPI 或结果细节
            - 弱 — 所审语料仅有客户标识提及
            - 弱 — 未看到公开模块或落地细节
            - 中 — 官方和新闻来源反复出现，但仍停留在客户标识级别
    claimRefs:
      - CU002
      - CU009
      - CU010
      - CU012
      - CU014
      - CU015
      - CU018
      - CU023
      - CU039
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 以可能性和影响力两维呈现 Socket 截至 2026-05-24 的主要风险。
    claimRefs:
      - CR020
      - CR023
      - CR030
      - CR036
      - CR045
      - CR046
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
        - 关键影响
      rows:
        - label: 低可能性
          values:
            - ''
            - 公开 FTC 执法事件
            - 合同责任意外暴露
            - N/A
        - label: 中可能性
          values:
            - ''
            - Vanta / 令牌集成失效
            - 隐私文档滞后
            - Coana 团队流失
        - label: 高可能性
          values:
            - ''
            - 边缘生态覆盖缺口
            - GitHub 工作流依赖
            - 告警精度回退
        - label: 极高可能性
          values:
            - 基线功能压缩
            - 生态支持复杂度
            - 持久性证据缺口
            - GitHub 原生竞争打包
    approximationNotes: 影响力和可能性分桶是分析师定性判断，锚定产品、市场和披露证据，而不是管理层给出的概率。
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 展示平台竞争、精度风险和披露缺口如何传导到收入质量与估值信心。
    claimRefs:
      - CR020
      - CR023
      - CR028
      - CR036
      - CR040
      - CR046
    data:
      nodes:
        - id: github-bundling
          label: GitHub 安全能力打包扩张
        - id: snyk-reachability
          label: Snyk 可达性竞争
        - id: ecosystem-baseline
          label: 可信发布 / 来源证明基线抬升
        - id: precision-risk
          label: 精度优势收窄或滑坡
        - id: pricing-pressure
          label: 定价权走弱
        - id: procurement-friction
          label: 采购与续约摩擦
        - id: durability-gap
          label: 持久性指标仍未披露
        - id: revenue-quality
          label: 收入质量信心下降
        - id: valuation-risk
          label: 估值支撑走弱
      edges:
        - from: github-bundling
          to: pricing-pressure
          label: 原生工作流降低附加采购必要性
        - from: snyk-reachability
          to: precision-risk
          label: 可达性不再那么独特
        - from: ecosystem-baseline
          to: precision-risk
          label: 功能新鲜度被压缩
        - from: precision-risk
          to: procurement-friction
          label: 噪音伤害信任
        - from: pricing-pressure
          to: revenue-quality
          label: 续约压力和折扣
        - from: procurement-friction
          to: revenue-quality
          label: 扩张变慢，审查更严
        - from: durability-gap
          to: valuation-risk
          label: 更难判断留存质量
        - from: revenue-quality
          to: valuation-risk
          label: 高溢价倍数信心下降
    approximationNotes: 传导路径代表分析上的因果关系，并非管理层披露的内部评分卡。
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 梳理影响 Socket 产品交付和企业销售动作的关键外部平台与提供商。
    claimRefs:
      - CR016
      - CR018
      - CR032
      - CR033
      - CR035
      - CR038
      - CR041
      - CR042
    data:
      nodes:
        - id: socket
          label: Socket 平台
        - id: github
          label: GitHub / Microsoft
        - id: npm
          label: npm 注册表 + OIDC / 来源证明
        - id: aws
          label: AWS S3
        - id: render
          label: Render
        - id: workos
          label: WorkOS
        - id: vanta
          label: Vanta
        - id: coana
          label: Coana 团队 / 可达性引擎
        - id: eu
          label: EU 监管机构 / CRA / GDPR
        - id: gitlab-azure
          label: GitLab / Azure DevOps / 自托管 SCMs
      edges:
        - from: socket
          to: github
          label: 默认部署与 PR 工作流触点
        - from: socket
          to: npm
          label: 注册表信号、可信发布、来源证明
        - from: socket
          to: aws
          label: 报告存储
        - from: socket
          to: render
          label: 托管 Web 服务
        - from: socket
          to: workos
          label: 企业 SSO 编排
        - from: socket
          to: vanta
          label: 借助刷新令牌同步合规
        - from: socket
          to: coana
          label: 精度与可达性差异化
        - from: eu
          to: socket
          label: 传输、报告和生命周期义务
        - from: socket
          to: gitlab-azure
          label: GitHub 之外的高阶套餐扩张
    approximationNotes: 本图强调会实质影响采用、可靠性或合规姿态的外部依赖。
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 可观察证据真实存在，但经济性缺口仍让轮次价格下的买入结论不够干净。
    data:
      nodes:
        - label: 轮次证据
          value: $60M Series C at $1B; $125M raised total
        - label: 规模证据
          value: 27K+ orgs; 1.5M developers; blue-chip customers
        - label: 战略证据
          value: Coana + reachability + rapid 2025-2026 product expansion
        - label: 可比公司桥接
          value: $1B needs ~mid-tens ARR at premium multiples
        - label: 关键缺口
          value: No public ARR / NRR / gross margin / cap table
        - label: 决策
          value: Track / research-more; conditionally fair, slightly stretched on public evidence
    approximationNotes: 流程把定性的 IC 决策链压缩为六个节点。
    claimRefs:
      - CV001
      - CV006
      - CV012
      - CV045
      - CV049
      - CV057
      - CV058
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: $1B 估值需要多少 ARR，取决于投资人认为 Socket 应拿到哪一档倍数，差异很大。
    data:
      items:
        - label: $1B 按 6x
          value: 166.7
          unit: USD M
          note: 接近 SentinelOne 式公开市场倍数
        - label: $1B 按 10x
          value: 100
          unit: USD M
          note: 通用优质软件门槛
        - label: $1B 按 15x
          value: 66.7
          unit: USD M
          note: 接近 JFrog 式公开市场溢价
        - label: $1B 按 20x
          value: 50
          unit: USD M
          note: 十几倍高段 / 二十倍低段的增长溢价区间
        - label: $1B 按 23x
          value: 43.5
          unit: USD M
          note: 接近 PANW 式优质平台倍数
        - label: $1B 按 35x
          value: 28.6
          unit: USD M
          note: 接近 Wiz / Chainguard 优质私有公司区间
        - label: 8% 变现 @ $35 / dev / mo
          value: 50.4
          unit: USD M
          note: 从 1.5M 受保护开发者粗略推得 ARR 代理值
    approximationNotes: 敏感性同时使用公开可比公司倍数和一个已披露覆盖面的变现代理值；它只是示意，不是管理层预测。
    claimRefs:
      - CV027
      - CV030
      - CV033
      - CV036
      - CV039
      - CV045
      - CV046
      - CV047
