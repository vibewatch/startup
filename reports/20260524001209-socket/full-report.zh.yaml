      - number: '1.2'
        title: 创始人杠杆、技术班底与客户验证
        blocks:
          - type: paragraph
            body: >-
              领导结构明显偏创始人中心。Feross Aboukhadijeh 仍是 About 页面、融资帖子、技术叙事和招聘材料里的公开主角； 他作为高产开源维护者、Node.js 治理参与者和 Stanford
              讲师的经历，也正好贴合 Socket 要解决的问题。 这种创始人与市场的匹配是真实战略资产：客户和投资人反复把开发者可信度列为 Socket 能替代传统 SCA 产品的原因。 代价是集中度。已审阅的公开材料把
              Feross 展示得很清楚，却没有对成熟高管班底、正式董事会结构或投资人治理权给出同等细节。


              客户证据比治理披露更强。2024 年和 2026 年官方材料反复点名 Anthropic、xAI、Replit、Cursor、Figma、Vercel、 Gusto、Mercado Libre 和
              Cribl；文档和更早的客户引语又分别印证 Brave、MetaMask 以及更广 JavaScript 生态开源项目的使用。 这个模式说明，Socket 已经最能打动高速推进、最暴露于依赖风险的 AI
              原生和开发者基础设施团队。Coana 和 Secure Annex 收购在组织上也重要： 它们等于把专业技术负责人带进公司，并把覆盖范围从经典软件包扫描向外拓宽。
