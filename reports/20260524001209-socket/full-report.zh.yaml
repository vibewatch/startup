      - number: '7.5'
        title: 人员、执行与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Socket 的公开势头是真实的：Series C、具名客户和广泛案例库足以证明市场牵引力。但证明市场被需要，不等于证明可持续。公开材料展示了许多 logo
              层面和案例层面的胜利，尤其集中在减少告警和提升工作流效率；但在 $1 billion
              估值轮之后，投资人通常需要的年经常性收入（ARR）、净留存率（NRR）、流失率或集中度，公开材料并没有给到足够具体的披露。广度放大了执行风险。SecurityWeek 报道 Series C 时 Socket
              大约有 100 名员工，而 Socket 同时在营销或文档中覆盖 GitHub、GitLab、Azure DevOps、AI 模型扫描、浏览器扩展、firewall、certified
              patches、可达性、企业治理等更多方向。创始人驱动的可信度是优势——Feross Aboukhadijeh 和顾问网络显然有助于信任与招聘——但这种公开定位也集中了承载声誉和产品原创叙事的风险。收购
              Coana 缓解了一部分技术缺口，却也带来对新整合、研究属性强团队的留任依赖，同时还要把这些专长转成可复制的企业产品结果。
