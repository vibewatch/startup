      - number: '1.4'
        title: 执行风险、披露缺口与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              第一章的主要风险，并不是公开可见的诉讼或融资短缺，而是精度、披露和信任。Socket 的卖点取决于实时、AI 辅助的安全判断：
              它要早到足以拦截坏软件包，又不能变成另一个噪声扫描器。公司自己承认这种权衡：Firewall Free 在纯 AI 信号上只做警告， 因为可能出现误报。关于 Firewall
              发布的独立报道重复了同样限制；2026 年 3 月的一条 GitHub issue 还显示，有用户把一个良性软件包告警质疑为误报。 这些证据不否定产品，但确实强调，检测质量是用户信任和留存的核心。


              第二个风险是信息不对称。公开材料在客户、投资人、收购和产品发布上信息丰富，但 ARR、客户集中度、董事会组成、债务和任何老股流动性活动都很薄。
              这意味着后续尽调章节可以有信心复用这里的身份、客户和资本事实，但不能假设经济质量或治理也有同样能见度。眼下的关键要求是： 校准 2020/2021 创立年份冲突，拿到干净的董事会和股权结构表，量化 ARR
              与净留存，并测试 Coana 时代的精度改进是否在生产账号里可衡量地降低告警疲劳。
