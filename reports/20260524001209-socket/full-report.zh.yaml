  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Socket 应被界定为软件供应链安全公司，而不是整个应用安全的替身。直接采购问题是判断第三方软件包或更新是否足够安全， 能否进入代码库、CI 流水线或生产发布。Socket
              自己的产品界面强调脆弱和恶意依赖、PR 门禁，以及拼写仿冒、安装脚本、 混淆、shell 访问、网络访问和环境变量访问等风险信号。这意味着纳入支出包括依赖审查、恶意软件包检测、支持 SBOM 的资产清单、
              安全公告监控，以及同软件交付绑定的策略或分流工作流。排除支出则是多数独立 SAST、DAST、API 测试和一般云安全， 除非买方重开更大的 AppSec 平台合同。替代品集合异常深。Dependabot、npm
              audit、OSV、Dependency-Check、 Dependency-Track 和 Renovate 为更新、CVE 匹配或资产清单提供低成本或免费基线；GitHub、GitLab、Snyk 和
              Black Duck 则把依赖控制打包进更广平台。尽调时，市场边界应当是依赖准入和软件供应链控制这个经常性工作流，而不是所有贴着 AppSec 标签的支出。
