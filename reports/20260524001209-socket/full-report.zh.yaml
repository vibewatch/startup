      - number: '8.2'
        title: 可比公司集合与收入代理
        blocks:
          - type: paragraph
            body: >-
              公开可比公司给不出一个干净答案，但它们界定了 Socket 在 $1 billion 定价之下必须跑出的经济性。GitLab 的收入倍数约 4.7x，SentinelOne 约
              6.4x；若按这个区间，Socket 需要 ARR 已经大约达到 $150 million-plus，才能支撑本轮。JFrog 是更相关的软件供应链和 DevSecOps 平台，按 FY2026
              收入指引的倍数更接近 14x，意味着 Socket 大约需要 $70 million ARR。Palo Alto Networks、CrowdStrike 等高溢价 cyber 平台，以及 Wiz
              等高溢价私有可比公司，可以支持高得多的倍数，但前提是规模大得多，或披露收入清楚得多。Chainguard 显示了市场愿意给高增长软件供应链安全多高定价，但它披露的倍数是离群值，不是中位数。


              Socket 自己的公开足迹能拼出一个粗略代理。公司披露 1.5 million 受保护开发者，Team 和 Business 的标价分别是每名开发者每月 $25 和 $50；若按 $35 混合价格，每 1%
              开发者变现大约对应 $6.3 million ARR。这意味着，要用 20x 倍数支撑 $1 billion 估值，需要披露开发者基数约 8%
              变现，或者规模更小的企业客户群通过可达性、firewall、certified patches 和更广企业控制项支付高得多的有效 ARPU。由于 Socket 对开源免费，并且有 $0
              入门层，受保护用户数是噪音很大的收入代理，而不是收入披露。所以这座可比桥只能说明「可能」，不能说明「已证明」。
