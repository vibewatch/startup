      - 定价 / 打包信号
      - 最适合买方
      - 相比 Socket 的关键短板
    rows:
      - - Socket
        - 依赖与供应链安全专精厂商
        - 基于行为的包风险识别、防火墙和可达性主导分流
        - Free '$0'、Team '$25'、Business '$50'；Enterprise 按开发者定制
        - 希望拦截恶意包并降低 CVE 噪音的开发者优先团队
        - 代码、云和运行时覆盖比平台整合型厂商窄
      - - Snyk
        - 广义 AppSec / SCA 平台
        - 依赖，加上代码、容器、IaC、API/web 和 AI 工作流
        - Free、Team、Ignite 和 Enterprise 层级，按贡献开发者定价
        - 希望整个 SDLC 用一个供应商统一的多语言开发组织
        - 安装时恶意软件拦截叙事不如 Socket 专精
      - - Mend
        - 企业 AppSec 加 Renovate 式自动化
        - 可达性驱动 SCA、AI 代码控制和依赖自动更新
        - 报价主导、按贡献开发者计费
        - 希望一个供应商覆盖代码、依赖和修复自动化的大型 AppSec 项目
        - 公开价格透明度较低，围绕包行为的 Socket 式专精品牌也较弱
      - - Endor Labs
        - 可达性优先 / AI 原生 AppSec
        - 全栈可达性、有证据支撑的发现和策略定制
        - 免费开发者工具；企业平台按演示 / 报价
        - 被误报和优先级噪音淹没的企业
        - 公开价格透明度较低，安装时拦截叙事也不如 Socket 聚焦
      - - JFrog Xray
        - 以 artifact 和 registry 为中心的 SCA 老牌厂商
        - JFrog Platform 内的 repo、构建、容器、SBOM、许可证和恶意包扫描
        - 打包进 Pro X、Enterprise X 和 Enterprise+ 平台层级
        - 围绕 Artifactory 和 artifact 治理标准化的 DevOps 与平台团队
        - registry 是控制点时更强；repo 原生开发者工作流中不如 Socket
      - - FOSSA
        - 合规与许可证平台
        - SBOM、许可证、代码片段和二进制扫描，带安全附加能力
        - Free、'$20 per project per month' Business、Enterprise 定制
        - 法务、合规和审计负担重的组织
        - 对安装前恶意包拦截的强调弱于 Socket
      - - GitHub Dependabot + GHAS
        - GitHub 原生替代
        - repo 工作流里的已知漏洞告警、代码安全和密钥保护
        - Dependabot 内置；GHAS 附加项为每活跃提交者每月 '$19' 和 '$30'
        - 以 GitHub 为中心、想要最低摩擦默认项的团队
        - 依赖行为专业深度不如 Socket，但更原生、更方便
      - - Apiiro
        - ASPM 与软件供应链平台
        - 风险图、上下文 SCA、安全内建和 XBOM 生成
        - 演示主导的平台销售
        - 需要深应用上下文和程序化工作流的安全团队
        - 间接替代，而非纯依赖安全专精厂商
      - - Aikido
        - 统一的开发者到运行时安全平台
        - 一个平台覆盖 SCA、SAST、IaC、DAST、容器、云、运行时和恶意软件检测
        - 公开定价，含免费层和企业附加项
        - 希望用一份合同整合多个单点工具的团队
        - 覆盖更宽，但不如 Socket 聚焦包行为这一细分场景
      - - OX Security
        - 代码到云 AppSec 平台
        - 一份许可证覆盖 SAST、SCA、SBOM、CI/CD 安全、运行时和渗透测试
        - 一个平台、一个价格，按开发者定价
        - 正在整合扫描器和交付栈控制的成熟 AppSec 项目
        - 在依赖安全专精采购中，品类心智不如 Socket 直接
      - - Chainguard / Upwind
        - 相邻供应链和运行时替代品
        - 可信镜像和库，或以运行时为先的云与 AI 安全，并带 SCA/SBOM
        - Chainguard 的 10 人 Catalog 团队起价 '$19K'；Upwind 演示主导
        - 受监管且容器负载重的团队，或向左扩展的云安全买方
        - 替代价值来自不同控制点，而非 Socket 以 repo 为中心的工作流
    notes: 公开定价和打包单元格只使用已保留的现行供应商页面；报价主导类别直接标注，不做估算。
