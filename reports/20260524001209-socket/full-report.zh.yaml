      - - 编码时检查 manifest
        - 在 VS Code 中编辑包文件
        - VS Code 扩展
        - 开发者不离开编辑器就能看到包级风险
        - 不是每条分析路径都完全离线或本地化
      - - 安装时阻止恶意下载
        - 运行 npm、pip、cargo 或类似安装命令
        - Socket Firewall
        - 在笔记本或 CI runner 执行前阻断高风险包
        - 包管理器路径必须接入安装拦截
      - - 降低 CVE 分诊噪音
        - 审查某项服务的漏洞积压
        - 可达性层级
        - 剔除不可达发现，优先处理可利用路径
        - 更高精度层级需要更多配置和计算
      - - 自动化组织专属检查
        - 搭建定制安全或报告工作流
        - REST API 和 SDKs
        - 让团队把 Socket 嵌入内部工具和策略流程
        - 需要工程投入，小团队未必愿意承担
      - - 跨生态跟踪供应链攻击行动
        - 跟进新发布的攻击研究和检测更新
        - Socket 研究信息流和包情报
