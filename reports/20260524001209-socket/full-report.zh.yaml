  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与买方画像
        blocks:
          - type: paragraph
            body: >-
              Socket 的客户证据指向一种以开发者为中心、但由安全预算牵引的购买动作。最强公开背书集中在 AI 原生、云、身份、合规和安全意识较强的软件组织， 而不是广泛线下企业 [CU002, CU004]。2026 年
              5 月官方材料称，Socket 保护超过 27,000 个组织、1.5 million 个代码库和每月 11.6 million 次提交，但这些是平台足迹指标，不是已披露的付费客户数 [CU001, CU024,
              CU026]。Socket 融资公告和新闻稿突出展示的具名客户标识 包括 Anthropic、xAI、Replit、Cursor、Vercel、Figma、Gusto、Mercado Libre 和
              Cribl，另有金融服务和全球媒体中的未具名 Fortune 100 公司 [CU002]。


              从案例研究看，预算所有者通常是 CISO、安全负责人、安全工程负责人或平台安全负责人；日常用户则是开发者和平台工程师， 他们直接在现有工作流里收到 PR 评论、GitHub 检查或 API 驱动的批准结果
              [CU005, CU006]。部署动作明显轻量： Replit、JumpCloud、SHI、Render 和 GitHub Marketplace 材料都把 GitHub App 或 GitHub
              检查推出描述为初始切口， 变更管理负担很小 [CU007, CU041]。这种低摩擦动作似乎尤其匹配高速推进的工程团队：它们在意供应链风险，却负担不起大型手工审查队列。


              因此，公开分层与其说按公司规模，不如说按代码强度和治理压力。AI 实验室需要更快依赖批准，云平台想要更低噪声的依赖卫生， 合规供应商需要审计证据，开源或加密项目则需要能处理大型依赖树和贡献者规模的审查工具
              [CU008, CU012, CU016, CU021, CU042]。
