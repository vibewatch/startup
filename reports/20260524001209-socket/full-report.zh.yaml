  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 从开发者入口到分析和执行层的代表性技术栈。
    approximationNotes: 这是基于官方文档和发布说明拼出的公开运营架构，不是内部服务图。
    claimRefs:
