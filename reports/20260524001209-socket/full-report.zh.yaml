  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重程度排序
        blocks:
          - type: paragraph
            body: >-
              Socket 最实质的风险集中在差异化能否守住，而不是公司能不能活下去。公司刚拿到新资金，也有看得见的客户证据；但核心投资问题是，Socket
              的检测和优先级排序能否持续明显好过大型平台逐步打包进现有开发者工作流的功能。GitHub 现在已经提供 dependency review、Dependabot、malware alerts、SBOM
              支持、advisory data 和 artifact attestations，Snyk 也有自己的可达性分析。Socket 的回应是更宽的恶意包检测、Coana
              带来的可达性分析和人工验证分析；但这个回应也抬高了执行门槛：客户一旦为了降低噪音而购买
              Socket，精准度回退或工作流摩擦上升，都会很快削弱付费意愿。公开可见的最强缓释因素，是公司的不上传源代码模型、透明状态页、企业控制项，以及能降低近期融资压力的 Series
              C。公开证据最弱的地方仍是可持续性：客户材料展示了广度和案例胜利，却没有展示留存、集中度或队列经济性。
