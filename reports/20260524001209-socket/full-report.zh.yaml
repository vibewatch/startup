  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 公开案例显示，Socket 的可复制路径是从 GitHub 原生试点切入，再扩展到治理和合规。
    approximationNotes: 阶段来自公开案例研究、应用市场和文档材料的综合梳理。公开资料没有披露时长和内部采购步骤；本图展示顺序，不表示耗时。
