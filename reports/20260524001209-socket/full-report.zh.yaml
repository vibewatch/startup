      - number: '2.3'
        title: 买方、用户、付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              初始用户通常是开发者、平台工程师或构建负责人；一旦治理变重要，最终付款方往往会切换。Socket 围绕过去 90 天向被扫描代码库提交代码的开发者计价； GitHub 对 Code Security 和
              Secret Protection 按活跃提交者收费；GitLab 把更强的依赖安全放入 Ultimate； Snyk
              则从免费个人使用一路爬升到团队和企业计划。这些包装方式指向一种常见市场结构：工具先自下而上落进代码库工作流， 等
              AppSec、平台或合规负责人需要集中策略、报告和支持时再变现。免费和开源工具对采用路径至关重要，因为它们设定了团队不付费也能拿到什么能力的基线。 Dependabot、npm
              audit、OSV、Dependency-Check、Dependency-Track 和 Renovate 能处理基本更新自动化、CVE 可见性或 SBOM 清单。
              买方只有在相信内置选项漏掉恶意行为、告警噪声过高，或无法满足采购和审计要求时才会升级。对 Socket 而言，最适配的细分市场是： 组织已经感到免费或打包工具的边界，但仍想要比完整 AppSec
              套件更轻、更准的东西。
