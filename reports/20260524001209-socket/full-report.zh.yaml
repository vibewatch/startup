  - id: TU001
    title: 客户分群表
    columns:
      - 分群
      - 买方 / 用户 / 付款方
      - 代表性证据
      - 主要用例
      - 战略价值
      - 关键缺口
    rows:
      - - AI 研究实验室和智能体构建者
        - 买方：CISO / 安全工程；用户：研究员和基础设施工程师；付款方：中央安全预算
        - Anthropic、xAI 与 Cursor
        - 更快批准新依赖，同时不丢失零日供应链可见性
        - 战略价值高，因为 AI 编码和研究速度会放大第三方代码风险
        - xAI 和 Cursor 在公开证据中只有 logo；没有合同或部署细节
      - - 开发者工具和云平台
        - 买方：安全负责人 / 安全主管；用户：平台和应用开发者；付款方：平台工程或安全
        - Replit, Vercel, Render
        - 内嵌 PR 阶段防护、依赖卫生、monorepo 控制、开发者友好上线
        - 契合度强，因为 GitHub 原生部署能把快速发布周期的阻力降到最低
        - 合同规模或续约经济性的公开证据很少
      - - 合规、身份和安全平台
        - 买方：CISO / 安全工程总监；用户：AppSec、DevSecOps、开发者；付款方：安全 / 合规
        - JumpCloud, Drata, JupiterOne
        - 可达性、许可证策略、SBOM、CI/CD 执行、审计证据
        - 重要性在于 Socket 从扫描扩展到治理和客户保证工作流
        - 多数证据是筛选过的案例研究内容，而非独立采购证据
      - - 受监管软件和医疗健康平台
        - 买方：产品安全 / 安全运营；用户：开发者和合规利益相关方；付款方：安全或平台组织
        - Cedar, Doctolib, Gusto
        - 低噪音依赖安全，加合规支持和审计友好证据
        - 在重视可审计性和患者 / 金融数据控制的场景中显示契合
        - Gusto 只有 logo；公开证据远薄于 Cedar 或 Doctolib
      - - 开源、加密和 web3 生态
        - 买方：平台 / 安全负责人；用户：OSS 维护者和资深审查者；付款方：平台 / 安全
        - Chia, MetaMask
        - 审核社区贡献依赖和大型依赖树，不被人工审查卡住
        - 有助证明 Socket 能在高度公开、贡献者众多的代码库中运行
        - 公开记录仍集中在 JavaScript 占比较高的环境
      - - 大型互联网平台和企业技术集团
        - 买方：安全、平台或产品领导层；用户：开发者和审查团队；付款方：中央工程或安全
        - Mercado Libre、SHI、Fortune 100 金融 / 媒体 logo
        - 集中式依赖筛查、最小权限上线和早期威胁阻断
        - 暗示 Socket 能越过创业公司规模，卖进大型工程组织
        - Mercado Libre 和未具名 Fortune 100 缺少公开部署深度或量化结果
    notes: 行按购买语境和工作流分组，而不是按披露 ARR，因为 Socket 不公布分群收入结构。只有 logo 的账户与有案例深度的账户分开处理。
