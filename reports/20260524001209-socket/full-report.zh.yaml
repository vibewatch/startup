      - number: '3.3'
        title: 打包替代品与相邻替代品
        blocks:
          - type: paragraph
            body: >-
              GitHub 是最重要的打包替代品，因为许多团队已经在它拥有的工作流里审查依赖、PR、告警和修复工单。 GitHub Advanced Security
              明确营销内置密钥保护、代码安全和依赖监控，Dependabot 告警则直接在代码库中覆盖已知脆弱依赖。 这种原生位置创造了 Socket 单靠自己难以匹配的分发力量：即使 GitHub 的依赖覆盖没有
              Socket 的行为模型那么专业，采购和工作流摩擦也更低， GitHub 公开的按活跃提交者计价还给买方提供了「足够好」防护的清晰基线。

              相邻平台带来另一种风险。Apiiro、Aikido、OX Security 和 Upwind 都在营销比 Socket 更广的上下文：基于图的或 code-to-cloud 可见性、 安全内建策略、API
              与运行时覆盖，或者用一个平台替换多个扫描器。Chainguard 则从另一个角度竞争， 把控制点移到带有合同化 CVE 修复 SLA 的加固镜像和库上。它们不是一对一的 Socket 克隆，但只要买方偏好整合、
              云 / 运行时上下文或制品来源，而不是专业依赖安全工具，它们就是可信替代。因此，Socket 的真实竞争越来越包括想吸收供应链支出的平台， 而不只是看起来像 Socket 的对手工具。
