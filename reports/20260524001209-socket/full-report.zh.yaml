      - number: '7.3'
        title: 产品质量、覆盖与运营风险
        blocks:
          - type: paragraph
            body: >-
              Socket 的产品承诺是在真实开发者约束下保持精准，因此即便收购 Coana 之后，误报和漏报风险仍是核心。Coana 的可达性引擎和 Socket
              的定价主张都指向大幅降噪；但正是这些主张，会让动态环境或覆盖不完整环境里的精准度下滑变得更昂贵。Socket 的不上传源代码架构是采购优势，却也带来盲区：公司自己的 known-issues 页面称，私有 npm
              packages 会被跳过，除非客户另行启用私有仓库，或把 package 重构为 workspace。不同生态和界面的覆盖也不均衡。公开矩阵里，GitHub Actions 缺少可达性和自动修复；Swift
              仍停留在 CVE-only；若干生态仍处于计划中或不支持。Socket 加入浏览器扩展、AI 模型扫描、GitHub Actions
              分析和更多语言引擎后，运营复杂度还在升高。状态页展示了多少离散组件必须保持健康，CI/CD 集成指南也显示，客户仍要正确管理 API keys、tokens 和 branch-protection
              细节。Vanta 集成进一步说明，当第三方 token 行为不稳定时，合规自动化会在运营上变脆。
