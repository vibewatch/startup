            body: >-
              Socket 的资本故事现在是最清楚的外部验证信号。2024 年 10 月 Series B 融入 $40 million，由 Abstract Ventures 领投， 累计融资增至 $65
              million；2026 年 5 月 Series C 又以 $1 billion 估值新增 $60 million，累计融资升至 $125 million。 C 轮由 Thrive Capital
              领投，a16z、Abstract Ventures 和 Capital One Ventures 参投，让公司的股权结构叙事同时包含风投品牌、
              安全可信度和企业分发可选项。公司自己的投资人页面也强化了这个故事：支持者来自安全运营者、开源领袖和高知名度技术创始人。


              两轮之间的里程碑不只是融资通胀。2024 年 10 月，Socket 公开报告 7,500 个受保护组织和 300,000 个 GitHub 代码库。 到 2025 年 4 月，Coana
              收购与可达性分析主张绑定，指向传统 SCA 的误报疲劳。到 2025 年 9 月，Socket 推出 Socket Firewall Free，把防护前移到安装点。到 2026 年 5 月，公司引用
              27,000+ 个组织、1.5 million 个代码库、 每月 11.6 million 次受保护提交以及超过 100 名员工。即便收入等关键商业指标仍未披露，这仍是快速执行，而不只是纯风投叙事。
