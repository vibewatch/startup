      - number: '6.4'
        title: 扩张循环与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开资料里，Socket 最可信的扩张路径不是披露更多席位数，而是低门槛初始落地之后继续扩产品面。案例显示了反复出现的路径：客户先从 GitHub App 或 PR 阶段依赖扫描起步，再延伸到 API
              审批、可达性分析、许可证和 SBOM 工作流、CI/CD 卡点、Vanta 同步、依赖搜索或开发者端点防护 [CU007, CU031,
              CU041]。这条路径把一个战术型依赖扫描器，变成更大治理与合规栈的一部分。所以 JumpCloud、JupiterOne、Replit、Doctolib、MetaMask 等客户谈的是 SBOM、CI
              策略、历史依赖搜索、审计证据和开发者机器防护，而不只是一次性告警 [CU011, CU016, CU018, CU021, CU031]。


              集中度风险在于，这套扩张逻辑仍建立在偏窄的公开客户画像上。Socket 最知名的公开背书仍集中在 AI 实验室、开发者工具、开源占比较高的平台、合规厂商以及云 / 安全团队 [CU034, CU037]。2026
              年，AI 驱动开发正在放大依赖风险，这是一组有吸引力的客户；但也意味着公开客户品牌集中在已经很成熟、而且往往以 GitHub 为中心的组织 [CU037, CU038]。评论和反向 Java
              测试从另一个角度强化了同一点：Socket 在 npm/Python 和 GitHub 中心工作流里看起来最强，放到更复杂的企业异质环境，公开证据还没充分跑通 [CU028, CU029, CU038]。


              外部佐证能帮 Socket 提升认知度，但不能证明经济性。新闻报道大多复述 Socket 的客户名单和使用指标，而不是披露采购细节、留存队列或收入集中度
              [CU039]。因此，公开尽调仍需要管理层回答付费客户结构、头部客户暴露，以及 AI 原生 logo 组合究竟是代表性客户基础，还是精心挑选的领导客户切入口 [CU036, CU039]。
