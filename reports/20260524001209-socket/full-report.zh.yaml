      - number: '7.2'
        title: 竞争与平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              Socket 在战略上缠在一批也会压缩品类的平台上。它自己的入门指南把 Socket for GitHub 称为最容易、也最强的部署路径；从获客角度这很合理，但风险在于 GitHub 同时控制 PR
              界面、安全公告图谱、dependency review，以及塑造买方预期的捆绑安全功能。Dependabot 和 dependency review
              已经覆盖许多工程组织在已知漏洞策略执行上的一大块需求，GitHub 还能把这些控制项变成工作流默认预期。Snyk 的可达性工作削弱了另一个历史差异点：Coana
              之后，可达性比以往更重要，却不再独特。与此同时，npm 和 GitHub 正靠可信发布、来源证明和 attestations 持续抬高安全基线。这些变化不会消灭恶意包风险，但会让 Socket
              的长期护城河更依赖精准度、策略能力、响应速度和企业工作流适配。Socket 有机会在 GitHub 之外扩企业客户，但定价和文档显示，很多广度——GitLab、Azure
              DevOps、自托管仓库、SCIM、审计日志和 IP 控制——都留给了更高阶套餐。
