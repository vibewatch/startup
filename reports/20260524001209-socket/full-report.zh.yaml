  - id: TP005
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - Socket 护城河 / 风险
      - 为什么重要
      - 主要威胁
      - 严重程度
      - 缓释动作 / 尽调问题
    rows:
      - - 基于行为的恶意包检测
        - 让 Socket 区别于只围绕已知漏洞时效性做文章的工具
        - 不把包行为风险放在优先级的买家，可能觉得 GitHub、Snyk 或平台厂商已经够用
        - 高
        - 量化恶意包担忧有多常成为 Socket 赢单的明确原因
      - - 安装时防火墙
        - 把控制点前移到合并后或扫描后补救之前
        - 买家可能偏好更少代理，或改用注册表、镜像、工作流控制
        - 高
        - 验证 Firewall 相比单独核心扫描的加购率和续约影响
      - - 可达性牵引的噪音压降
        - 帮 Socket 走出纯恶意软件检测，进入分诊效率
        - Endor Labs 和 Snyk 在可利用性上下文与平台广度上的公开叙事更强
        - 高
