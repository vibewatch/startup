  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与开发者工作流
        blocks:
          - type: paragraph
            body: >-
              Socket 最好理解为开发者工作流安全平台，而不是单一静态扫描器。公开入口是一个 GitHub 应用，会监控 PR 中的依赖变更、
              在合并前评论，并围绕新软件包产出项目健康度式结果。但这只是一个表面。同一产品族还包括 CLI，用于更自定义或非 GitHub 工作流； VS Code 扩展，把清单文件扫描带进编辑器；以及 Socket
              Firewall，它位于软件包管理器和注册表之间，把执行点移到安装时。 结果是，产品能在多个时刻看到依赖风险：代码编辑时、PR 提出依赖时，以及软件包真正下载到开发者电脑或 CI 运行器时。
              这种多表面设计重要，因为 Socket 销售的是嵌入正常开发者工具链的防护，而不是要求安全团队运行一份孤立的事后报告。
