      - number: '2.4'
        title: 增长驱动、采用约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              这个品类有真实结构性顺风。EO 14028 要求 NIST 推进软件供应链安全；NIST 的 SSDF 明确给采购方和使用方一套可用于采购的框架； CISA 把 SBOM 称为软件供应链风险管理的关键构件；EU
              Cyber Resilience Act 则创造了生命周期网络安全义务， 并从 2026 年 9 月开始启动报告要求。安全事件持续强化政策压力。XZ 证明，上游软件包可以被植入后门，并触达 ssh 生产路径；
              Apache 的 Log4j 安全页面仍证明，高严重性事件之后，传递依赖响应可能拖很久。威胁遥测仍然强烈：Sonatype 描述了工业化代码库滥用和开发者或 CI 环境中的密钥外泄， Veracode 则显示恶意
              URL、混淆和拼写仿冒激增。约束同样真实。买方面对误报疲劳、技能短缺和工具蔓延； GitHub、GitLab、Snyk 及其他打包产品又压缩独立定价。因此，Socket 的上行空间不那么取决于市场是否增长，
              更取决于其行为优先检测能否比免费和打包替代品带来显著更好的结果。
