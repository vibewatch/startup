companyProfile:
  summary: >
    Socket 是一家位于 San Francisco 的软件供应链安全公司，由创始人兼 CEO Feross Aboukhadijeh 领导。Socket 的 About 页面称公司创立于 2021 年，但若干 2026
    年融资材料称为 2020 年。公司销售开发者优先的平台， 覆盖 GitHub、CLI、VS Code、Firewall、API 和 SDK 工作流，用于拦截恶意软件包，在合并或安装前暴露依赖风险， 现在还借助源自 Coana
    的可达性分析分流 CVE。2026 年 5 月公开材料称，Socket 保护超过 27,000 个组织、 1.5 million 个代码库和每月 11.6 million 次提交，客户包括
    Anthropic、xAI、Replit、Cursor、Figma、Vercel、 Gusto、Mercado Libre 和 Cribl。2026 年 5 月 Series C 将 Socket 估值推至 $1
    billion，累计已披露融资达到 $125 million。公开披露仍未给出 ARR、毛利率、NRR、烧钱速度或付费席位转化。
