  - id: TP004
    title: 分发 / 切换成本 / 替代方案对比
    columns:
      - 替代类别
      - 默认控制点
      - 买方为何留在原位
      - Socket 反向定位
      - 切换 / 多归属动态
    rows:
      - - GitHub 原生基线
        - 仓库、pull request 和安全标签页
        - 已嵌入日常开发工作流，并有公开附加项定价
        - 专精恶意包检测和更深的依赖风险信号
        - GitHub 分发优势高；Socket 可以叠加，但必须证明额外支出合理
      - - 广义 AppSec 平台
        - 现有 SAST 或平台安全合同
        - 一家厂商可覆盖依赖、代码、容器和策略
        - 专精厂商在供应链攻击和安装时拦截上的叙事更清晰
        - 多家并用很容易，Socket 可能拿到一个席位，不必替换平台厂商
      - - 可达性优先的专精厂商
        - 漏洞积压和减少误报的采购动机
        - 买家更想要可利用性上下文和修复工作流，而不是新的扫描器
        - Socket 可把行为信号与自身可达性能力配在一起，但必须证明工作流影响相当
        - 噪声高的企业环境里，竞争重叠最高
      - - 合规 / 审计权重高的既有厂商
        - SBOM、许可证或制品治理流程
        - 法务和监管结果可能主导购买标准
        - 当供应链恶意软件风险比文档和归因工作流更重要时，Socket 更容易赢
        - 切换意愿通常较低，除非合规成为首要用例
      - - 代码到云平台
        - 一个控制台覆盖 AppSec、CI/CD、云、API 和运行时可见性
        - 整合会降低控制台疲劳和采购负担
        - Socket 提供更深的专精依赖能力，不提供全栈覆盖
        - 专精厂商最难打的账户，往往明确要削减工具数量
      - - 内部自建 / 维持现状
        - Dependabot 式告警加内部包审查政策
        - 够用的基线免费，或团队已经有人维护
        - Socket 减少基于行为的攻击和安装前拦截盲区
        - 切换成本最低，但购买紧迫性也最低
    notes: 本表比较的是控制点和购买惯性，不单独评价产品质量；目的在于看清哪些场景里 Socket 要对抗既有厂商的天然占位，哪些场景可以叠加切入。
