  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Socket is a San Francisco software supply chain security company led by founder-CEO Feross Aboukhadijeh; official 2026 materials show 27,000+ organizations, 1.5 million repositories, and blue-chip customers including Anthropic, xAI, Replit, Cursor, Figma, Vercel, Gusto, and Mercado Libre. In May 2026 Thrive Capital led a $60 million Series C that valued the company at $1 billion and brought total funding to $125 million, while earlier product and M&A milestones show a rapid move from dependency scanning into reachability analysis and install-time blocking. The main overview risk is not a visible public legal overhang but an execution-quality tradeoff: Socket itself warns that AI-assisted detection can create false positives, and public GitHub feedback shows at least some benign packages still get flagged."
  },
  "sections": [
    {
      "id": "identity-product-and-scale",
      "title": "Identity, product thesis, and current scale",
      "body": "Socket’s public materials consistently frame the company as a developer-first software supply chain security platform built to stop malicious or high-risk open-source dependencies before they reach production. The core product thesis is behavioral rather than database-first: Socket says it analyzes dependency behavior in real time, then exposes those findings through GitHub, CLI, docs, and install-time Firewall workflows instead of waiting for a CVE to be catalogued after disclosure. The docs and pricing materials sharpen that positioning commercially: open-source projects get a free path, enterprise buyers pay for policy depth and support, and Socket says source code itself stays local while only dependency metadata is transmitted upstream.\n\nThe identity layer is mostly clear but not perfectly clean. Current official and independent materials place Socket in San Francisco, yet public sources disagree on the founding year: the official About page says 2021 while several 2026 funding materials say 2020. That mismatch does not change the operating story, but it is a reminder that the company’s public chronology still needs a documentary reconciliation. What is well supported is scale. By May 2026 Socket said it was protecting more than 27,000 organizations, 1.5 million repositories, and 11.6 million commits per month while blocking more than 10,000 attacks every week.",
