    {
      "id": "capital-formation-and-milestones",
      "title": "Capital formation, investor map, and milestone execution",
      "body": "Socket’s capital story is now the clearest external validation signal. The October 2024 Series B brought in $40 million led by Abstract Ventures and took total funding to $65 million, while the May 2026 Series C added $60 million at a $1 billion valuation and lifted cumulative funding to $125 million. Thrive Capital led the C round, with a16z, Abstract Ventures, and Capital One Ventures participating, giving the company a cap-table narrative that mixes venture brand, security credibility, and enterprise-distribution optionality. The company’s own investor page reinforces that story by highlighting a backer set drawn from security operators, open-source leaders, and high-profile technology founders.\n\nThe milestones between those rounds show more than financing inflation. In October 2024 Socket was publicly reporting 7,500 protected organizations and 300,000 GitHub repositories. By April 2025 it paired the Coana acquisition with reachability-analysis claims targeted at false-positive fatigue in legacy SCA. By September 2025 it launched Socket Firewall Free to move protection to the point of install. By May 2026 it was citing 27,000+ organizations, 1.5 million repositories, 11.6 million commits secured monthly, and more than 100 employees. That is rapid execution rather than pure venture storytelling, even if key commercial metrics such as revenue remain undisclosed.",
