  - id: TV005
    title: 推翻投资论点与止损触发器
    columns:
      - 触发器
      - 可观察阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - HKC 订单取消或采购量大幅下调
        - 正式通知或单位数较 1,000 台减少 ≥30%
        - 唯一有约束力的收入锚消失；牛市和基准情形失去依据
        - 立即退出或不投资；6 个月内大概率下轮估值下调
      - - Unitree Robotics STAR IPO 定价低于过去十二个月收入的 10x
        - Unitree IPO 招股书披露上市时 P/S <10x
        - 公开市场的逐日盯市基准出现，压缩 AI² 同业隐含估值至 ≤$700M
        - 标记为重大估值风险；IPO 后按行业倍数重新评估
      - - Physical Intelligence 或 AgiBot 达到可验证的 GOVLA 等效或更优水平
        - 独立基准显示，在 AI² 目标垂直场景上任务成功率领先 ≥5%
        - 技术护城河叙事被击穿；AI² 只剩执行型投资
        - 任何新增资本投入之前，必须先完成独立 GOVLA 审计
      - - CAC 生成式 AI 合规失败或遭遇执法
        - CAC 对 AI² 的 GOVLA 嵌入层发起正式检查、服务暂停或执法通知
        - 监管风险落地；修复前部署停摆；可能触发客户取消
        - 立即尽调合规备案状态；持续跟踪 CAC 注册更新
      - - 到 2026 年 Q4 仍无新的有约束力客户
        - 截至 2026 年 12 月 31 日，未公开宣布来自全新企业客户的有约束力采购订单
        - 证明 HKC 是一次性个案，不是可复制的企业销售动作；投资论点退化为单客户押注
        - 不投资；若已持仓，则以下一轮定价为严格止损点
    notes: 触发阈值由分析师定义；AI² 未披露内部指引。行动含义仅用于示例性尽调。
