          - type: callout
            title: Unitree UniStore 应用生态长期威胁 AI² 平台层
            body: >
              Unitree 推出 UniStore，并称其为全球首个人形机器人应用商店，显示其意图不只是拥有硬件， 还要掌控软件和应用分发层。如果第三方开发者为 Unitree
              生态开发应用，企业买方的切换成本会从硬件转向软件， AI² 若不能建立可比开发者生态，将处于劣势。AI² 开源 FIS-VLA 提供了一些开发者可信度，但并不等于已部署的应用平台。
              这一动态类似手机市场从硬件差异化转向平台锁定；它能否在人形机器人领域兑现，取决于软件成熟度和企业部署规模， 而截至 2026 年中，两者都未被证明。
            calloutType: insight
            claimRefs:
              - CP007
              - CP040
              - CP041
          - type: callout
            title: AI² 开源 FIS-VLA 提供开发者可信度和差异化信号
            body: >
              AI² 决定在 GitHub 开源 FIS-VLA，并获得 Yann LeCun 公开背书，在全球 AI / 机器人研究社区内形成可见差异化信号。
              这是一道竞品不易复制的护城河，除非它们具备同等模型质量和透明度——UBTECH 和传统工业玩家都没有可比的开源 VLA 贡献。 Meta 首席 AI
              科学家的背书也以营销话术无法替代的方式验证了技术架构，可能加速企业采购信任。 这道护城河的耐久性取决于 AI² 能否持续产出研究级 VLA 成果并维持活跃开发者社区；两点都无法从公开数据确认。
