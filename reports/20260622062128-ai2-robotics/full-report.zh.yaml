          description: 估值与收入错配；Unitree IPO 带动行业倍数重置
        - id: n9
          label: PIPL / AI 监管不合规
          description: CAC 或 MIIT 执法行动；罚款或产品暂停令
        - id: n10
          label: 治理不透明
          description: 除 CEO 外没有具名高管；未披露董事会构成
        - id: n11
          label: 投资假设破裂
          description: 投资回报受到实质损害；退出估值等于或低于进入估值
      edges:
        - from: n1
          to: n3
          label: 收紧 → 中断
        - from: n2
          to: n3
          label: 单一平台依赖
        - from: n3
          to: n4
          label: 迫使重设计
        - from: n4
          to: n7
          label: 停产 → 收入不达预期
        - from: n5
          to: n7
          label: 集中度 → 收入脆弱
        - from: n6
          to: n7
          label: 管线持续偏薄
        - from: n7
          to: n8
          label: 不达预期 → Series C 更难
        - from: n8
          to: n11
          label: 下调轮或无新一轮
        - from: n9
          to: n7
          label: 执法扰动部署
        - from: n10
          to: n8
          label: 治理折价压低估值
