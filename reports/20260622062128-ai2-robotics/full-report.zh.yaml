  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与融资轮结构
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 于 2026 年 2 月完成 Series B，分多批筹集超过 RMB 1 billion（约 USD 145 million）。两个独立来源——Crunchbase 的 2026 年
              2 月独角兽 cohort 报告和 Yicai Global 同期报道——分别给出 USD 1.4 billion 和 CNY 10 billion+ 的投后估值；差异不大，主要来自 USD/CNY
              汇率假设，而非对企业价值的实质分歧。轮次层面，Baidu Venture 作为战略投资方领投，CRRC Capital（首个进入中国人形机器人赛道的国有重工业资本平台）、Guotai Haitong
              Securities、Yusys Technologies（STAR market，688317）、Cedarlake Capital、Sentury Tire 以及一家未具名 Tesla
              供应链企业参投。2026 年 2 月融资是约 12 个月、12 轮融资活动中的最后一批；其中 2025 年上半年包含 7 批。该节奏并不典型，暗示公司要么资本消耗高，要么采用结构化资本 drawdown
              工具；两者都意味着复杂优先权栈和未知稀释悬置。基于公司自身十二轮融资披露，累计融资估计超过 RMB 2 billion（约 USD 290 million），但 Series B
              之前每轮具体规模均未公开确认。公司没有披露任何收入、ARR 或单位经济数据，传统财务倍数无法锚定该估值；估值支撑主要来自投资者 syndicate 质量、HKC 1,000 台约束性采购订单，以及 AI²
              机器人市场叙事。
