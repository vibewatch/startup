      - number: '5.5'
        title: 制造栈与现场部署就绪度
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 于 2025 年 9 月启用自有产线，额定年产能 1,000 台。公司目标是在 2026 年底扩至年产 10,000 台，相当于 12 个月内放大 10×。2025 年 4
              月的早期公开表述曾把 10K/年目标放在 2028 年，说明 Series B 融资后计划提速。公司把制造野心描述为打造「机器人 OEM」，类似电动车里的 BYD——控制硬件设计、制造和交付集成。到 2026
              年中，商业部署覆盖四个工业垂直：汽车制造装配线、半导体晶圆厂（Geely Technology 旗下 JingBo Micro）、生物科技洁净室（HuaXi
              Biotech），以及一线城市机场行李车管理等公共服务场所。锚定合同是与 HKC（华科，全球第三大显示面板制造商）签署的 1,000
              台、三年框架协议；管理层称其为中国规模最大的非展示型商业人形机器人订单。Peking University–AI² Robotics 具身 AI 联合实验室于 2025 年 4
              月成立，为公司提供研究管线和人才入口。部署就绪度在结构化工业环境中最强：机器人 0–5° 的坡度限制和轮式底盘排除了非结构化楼梯或户外使用；当前商业 SLA 和保修结构也未公开披露。
