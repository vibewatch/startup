      - number: '6.3'
        title: 市场位置、竞争压力与反向信号
        blocks:
          - type: paragraph
            body: >
              TrendForce 2026 年 4 月数据显示，Unitree Robotics 和 AgiBot 合计约占中国人形机器人产量市场 80%，AI² Robotics
              与其他小型同行一起落在竞争激烈的少数份额区间。CEO Guo Yandong 在 2026 年 2 月署名文章中承认「行业洗牌已开始」，罕见地坦承公司层面已感受到竞争压力。TheRobotReport 的
              2026 年中国机器人展望也明确把「显著竞争压力」列为当年主导主题。


              IFR 报告称，中国 2024 年安装 295,000 台工业机器人，占全球市场
              54%；这一宏观指标说明底层工厂自动化市场规模大，也从结构上接纳下一代人形机器人部署。但这股广义顺风会同样惠及所有机器人竞争者。Crunchbase 数据显示，仅 2026 年 3 月就有 6
              家中国机器人独角兽诞生，反映资本充足的竞争者激增和投资者热情；它既验证赛道，也让赛道更拥挤。


              HKC 客户集中度是当前客户画像中最大的收入风险。如果 1,000 台 HKC 订单代表 AI² 已确认早期收入的大部分，任何交付失败、验收争议或客户流失都会构成重大影响。五个具名账户中有三个只是合作
              MOU，没有承诺单位数量，意味着 HKC 之外的收入基础尚未确认。MOU 转化为采购订单的比例，是需要跟踪的关键前瞻指标。
