      - number: '8.2'
        title: 可比估值分析——私募与公开市场基准
        blocks:
          - type: paragraph
            body: >-
              理解 AI² 的 USD 1.4 billion 入场价格，需要两副镜头：一是人形和具身 AI
              机器人公司的私募市场类比，二是成熟工业自动化和机器人公司的公开市场倍数。私募侧，最直接可比的西方公司估值跨度很大。Figure AI 于 2024 年 2 月以约 USD 2.6 billion 隐含估值融资
              USD 675 million——约为 AI² 当前估值的 1.9x，尽管当时同样没有公开披露收入。Physical Intelligence（pi.website）在 2026 年 4 月发布的 π0.7
              通用策略模型代表当前 VLA 操作前沿；该公司于 2024 年底以约 USD 2.4 billion 估值融资 USD 400 million，PI 博客也确认通过「The Physical
              Intelligence Layer」（2026 年 2 月文章）推进商业合作，但未披露收入。Apptronik 2025 年 Series A 融资约 USD 350
              million，用于制造业人形机器人部署；1X Technologies 累计融资超过 USD 135 million。公开市场侧，工业自动化和机器人可比公司——ABB（约 2.2x trailing
              revenue）、Teradyne（约 3.5x）、Cognex（约 6x）、Symbotic（约 3.5x）和 Rockwell Automation（约 3x，其 IR 材料称其为全球最大 pure-play
              工业自动化公司）——收入倍数区间在 2–6x。AI² 没有披露收入，应用这些倍数只能先从 HKC 订单外推远期收入。HKC 三年 1,000 台合同按估计 ASP RMB 200,000–500,000
              计算，隐含年化收入 RMB 67–167 million，使 USD 1.4 billion 估值达到年化订单价值的 60–150x——这是很深的成长阶段溢价，需要订单簿快速扩张才守得住。CB Insights
              2026 年 6 月制造业机器人市场地图识别出 14 个细分市场中的 116 家创业公司，确认赛道拥挤，会压低 Series C 阶段继续享受高于 cohort 估值溢价的概率。
