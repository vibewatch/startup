      - number: '4.4'
        title: 财务证据缺口与承销阻断点
        blocks:
          - type: paragraph
            body: >
              本章记录的是一幅结构性不完整的财务图景。AI² Robotics 是中国私营公司，没有发布财务报表的法定义务， 除 Series B
              交易条款外，也没有主动披露任何量化财务信息。传统创业公司承销所需的每一项指标——收入（当前或往绩）、 毛利率、EBITDA、现金余额、现金消耗率和资金续航——都不在公开记录中。对投资者的结果是，
              资本充足性分析完全建立在以下估计之上：（a）假设月现金消耗为 RMB 30–80 million（USD 4–11 million）， USD 145 million Series B 意味着自 2026 年 2
              月起 13–36 个月资金续航，指向 2027–2028 年潜在 Series C 窗口； （b）HKC 订单提供了有订单背书的收入代理指标，但单台合同价格和总合同金额均未披露； （c）由于 Pre-Series
              B 轮次规模未披露，累计生命周期资本无法验证。商业牵引信号（四个具名企业客户、机场试点、 模块化空间部署）显示部署活动活跃，但没有定价数据就无法转化为收入。Unitree 和 AgiBot 合计约 80%
              市场份额， 限制 AI² 近期可触达订单池；CEO 本人在 2026 年 2 月承认「行业洗牌已经开始」， 又进一步放大市场风险——在下一轮融资前建立商业规模的窗口正在收窄。尽调路径很直接，但必须直接推进：
              经审计财务、管理层编制收入模型、含定价的已签商业合同，以及 CFO 证明的现金消耗 / 资金续航声明。
