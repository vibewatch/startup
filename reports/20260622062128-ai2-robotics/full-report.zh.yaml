      - number: '7.4'
        title: 资本强度、估值错配与治理风险
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 在 2026 年 2 月完成超过 RMB 1 billion（约 USD 145 million）的 Series B 后，投后估值达到 RMB 10 billion+ ——这是公司约
              12 个月内披露的第十二次融资。这样的融资节奏并不常见：一年内完成十二次 close（包括 2025 年上半年七次，以及 Series B 自身五个 tranche），说明公司要么采用高稀释频率的结构化资本
              draw-down，要么现金消耗速度需要近乎连续的资本市场支持。对照 RMB 10B+ 估值，隐含收入倍数在尚未商业化状态下几乎没有意义；若用 HKC 订单价值代理（1,000 台，估计 ASP RMB
              200,000–500,000 = 三年 RMB 200M–500M，年化约 RMB 67M–167M），则为年化订单价值的 60x 至 150x。对高增长硬件 AI
              公司而言，这不必然致命，但它要求近乎完美的商业化轨迹：HKC 交付延迟、MOU 转化失败或竞争压缩利润率，都会让很可能在 2027–2028 年需要的 Series C 更难合理定价。Unitree
              Robotics 已获受理的 STAR-market IPO 申请（TrendForce 2026 年 4 月披露）可能为行业设定公开市场可比标尺；Unitree 披露的 60% 毛利率和人形机器人占收入
              51%，会让 AI² 未披露且在小规模生产下可能更低的毛利率显得不利，从而迫使整个赛道估值重置。


              治理透明度缺口很大。截至报告日期，AI² 整个领导团队中只有 CEO Guo Yandong 公开具名。公司未公开披露联合创始人、CTO、VP Engineering、Chief Financial
              Officer 或独立董事。团队页面称核心团队来自 Microsoft、OPPO 和 Xpeng，但除 CEO 外没有列出任何个人。这带来关键人集中风险：如果 CEO Guo Yandong 无法履职，AI²
              将面临领导连续性危机，且没有公开可识别的二号人物。它也限制投资者尽调——缺少具名高管，外部无法核实公司声称的专业能力、评估组织厚度，也无法判断团队成员前雇主带来的利益冲突。2025 年 5
              月针对一家武汉实体使用混淆性相似公司名的品牌冒用法律声明，确认 AI² 品牌既有价值也被争夺，但也暴露了 IP 执法成本；在这个阶段，资本本应优先投向 R&D 和产能扩张。


              产能爬坡在多个层面引入执行风险。从 1,000 台 / 年提升到 10,000 台 / 年——AI² 的 2026 年目标——需要同时扩张供应链、认证执行器供应商、以 10× 数据吞吐部署 GOVLA
              模型、扩建工厂车间，并以 AI² 运营历史中从未出现过的速度导入企业客户。2033 年达到 100 万台 / 年的目标相当于当前产能的
              1,000×；即便可实现，也意味着当前任何一轮融资都无法覆盖到终点的资本需求和组织复杂度。
