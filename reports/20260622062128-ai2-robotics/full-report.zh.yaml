  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与垂直行业策略
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 采取明确的企业优先、仅 B2B 的 go-to-market 策略。CEO Guo Yandong 在 2026 年 2
              月公开署名文章中明确表示，消费级人形机器人需求尚未成熟，至少未来五年不会可行，因此公司近期收入模型完全锚定工厂和商业服务合同。公司已公开识别六个垂直行业：半导体制造、汽车制造、生物科技 /
              制药、电子制造、公共服务和新零售。其中前五个已有具名客户证据。


              半导体制造由 Jingneng Microelectronics（晶能微电子）锚定，这是一家 Geely Technology Group 旗下芯片公司，2025 年 3 月签署合作协议。汽车制造由
              Dongfeng Liuzhou Motor（东风柳州汽车）代表，这是 Dongfeng group 旗下品牌，双方 2025 年 6 月签署战略合作，覆盖整车装配贴标、零部件装配和工厂物流。生物科技 / 制药由
              Huaxi Biotech（华熙生物）锚定；它是中国最大的透明质酸生产生物科技公司之一，合作在 2025 年 4 月 AlphaBot 2
              发布会上宣布。无菌物料搬运、视觉检测和无菌室操作等用例，切中污染控制痛点，也更适合机器人自动化。LCD / 显示制造垂直由全球第三大 LCD 面板制造商 HKC 锚定，后者下达了具约束力的三年 1,000
              台采购订单。公共服务由 ZhiMofang（智魔方）代表，在北京和深圳场所部署 AlphaBot 2 做行李车回收和大堂服务。


              尽管公司材料出现了零售垂直行业，但尚无具名零售客户公布。所有已确认客户的地理足迹均在中国境内；截至本次报告日期，未披露任何国际试点、出口或跨境分销。KR Asia
              分析记录了至少十家中国芯片创业公司瞄准汽车半导体供应链——随着国产芯片生产放量，每家公司都可能成为未来机器人客户。SP Global 分析进一步指出，半导体供应链本地化会推动中国汽车工厂的自动化投资，为 AI²
              的核心垂直行业提供需求侧顺风。
