  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 商业化风险与客户集中
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 最直接的投资风险，在于公司宣称的商业牵引力与可独立验证的约束性承诺之间存在缺口。五个公开具名锚定客户中，只有 HKC（惠科股份）协议是具约束力的多年采购订单——三年 1,000 台
              AlphaBot 2。Dongfeng Liuzhou Motor、Huaxi Biotech、Jingneng Microelectronics 和 ZhiMofang
              都被描述为「战略合作」MOU；数量、定价和交付排期未公开。因此客户集中度极高：HKC 可能代表 AI² 全部已确认订单积压，而 AI² 自有首发产线的年产能 1,000 台也恰好匹配 HKC 承诺。如果 HKC
              推迟、取消或重谈订单，或公司未来 12–18 个月无法把剩余三个 MOU 转化为约束性合同，收入将受到实质损害。


              竞争整合会放大该风险。TrendForce（2026 年 4 月）预计 Unitree Robotics 和 AgiBot 将在 2026 年合计拿下中国人形机器人总出货量约 80%。AI² CEO Guo
              Yandong 在 2026 年 2 月发表于 Sina Finance 的署名文章中公开承认「行业洗牌已开始」——创业公司 CEO 罕见承认竞争压力真实且尖锐。AgiBot 2026 年在 Longcheer
              Technology 现役产线部署真实世界强化学习，说明至少一个直接竞争对手已经从试点推进到生产部署；AI² 尚未公开验证同等规模的里程碑。CEO 对 2026 年底和 2028 年分别达到 10,000 台 /
              年产能、2033 年达到 1,000,000 台的预测，带有当前证据基础无法支撑的执行风险。


              公司 go-to-market 完全集中在中国大陆企业 B2B；截至报告日期，未披露任何国际试点、出口合作或跨境分销协议。地理集中把 AI²
              的收入轨迹绑定在中国国内工业自动化投资周期上，而该周期又受汽车、半导体和生物制造下游需求影响。企业客户采用人形机器人的 ROI 在全行业仍未被规模化证明：AI²
              五个具名客户部署均没有第三方审计、案例研究或生产率测量公开发布。合作 MOU 转成约束性合同，再转成收入，是投资者近期最需要盯住的风险信号。
