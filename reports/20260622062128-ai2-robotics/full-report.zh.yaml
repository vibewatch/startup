  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 收入与毛利率披露
        - AlphaBot 2 商业规模下的任何收入数字、ARR、毛利率或 COGS
        - 没有财务基线，就无法验证估值倍数或可持续性；全部可比公司分析都依赖代理收入
        - 要求进入数据室；对照 Unitree STAR 市场 IPO 招股书披露的 60% 毛利率做基准
      - - HKC 交付时间表和里程碑
        - 1,000 台合同的 2026 年 Q3 交付里程碑、验收标准、付款安排和单价
        - HKC 订单是唯一估值锚；交付失败或争议会压垮基准情形
        - 直接与 HKC 采购做客户访谈；要求数据室提供合同摘要
      - - 股权结构和优先权栈
        - 完整股本结构表、清算优先权、反稀释条款，以及全部 12 轮投资者的 pro-rata 权利
        - 12 轮融资节奏叠加各轮条款未知，可能形成优先权悬顶风险；标题估值看不见这一点
        - 向公司索取股权结构表；聘请法律顾问建模瀑布分配情景
      - - GOVLA/Alpha Brain 独立基准
        - 第三方评估四个目标垂直场景（半导体、汽车、制药、物流）的任务成功率、泛化能力和安全性
        - 自报 GOVLA 基准是主要技术差异点；目前没有独立验证
        - 委托独立技术评估；在等价任务集上与 PI π0.7 和 AgiBot WorkGPT 对比
      - - 客户管线和转化时间线
        - 合格管线总量（处于活跃 POC 或 MOU 的公司）、预期转化时间线，以及非 HKC 潜在客户的平均合同价值
        - 收入模型取决于转化 4 个现有 MOU 并新增客户；管线质量未知
        - CEO 管线简报；要求 CRM 数据，或至少给出具名管线公司及其阶段
      - - CAC 生成式 AI 合规状态
        - GOVLA 嵌入式语言指令层的任何 CAC 注册或安全评估备案副本
        - 《生成式人工智能服务管理暂行办法》（2023）适用于商业部署；不合规是重大运营风险
        - 法律审查 AI 监管备案；直接询问 AI² 法务 / 合规团队
    notes: 尽调问题清单仅基于公开可观察缺口。数据室审阅后，大概率还会出现更多事项。
    claimRefs:
      - CV004
      - CV005
      - CV009
