      - number: '7.5'
        title: 图表要点
        blocks:
          - type: callout
            title: NVIDIA Orin 出口管制风险——对美国原产芯片的存在性依赖
            body: >
              AlphaBot 2 的 GOVLA / Alpha Brain 模型运行在 NVIDIA Jetson AGX Orin 64GB 上，这是一块美国原产先进集成电路，已经受 BIS EAR 对 Country
              Group D:5（中国）的出口管制。2026 年 5 月发布的 BIS 指引重申，向 D:5 总部实体运送先进计算物项需要许可证，并且只把授权 IC 设计师时间线延长至 2026 年 12 月 31
              日——释放的是持续收紧信号，而非问题解决。AI² 未披露国产计算替代方案（Huawei Ascend、CIXAI、Zhaoxin 或同等平台）。一旦管制升级切断 Orin
              供应，公司将需要完整硬件重设计和模型重新验证，过程以数月到数年计。这是 AI² Robotics 投资论证中严重度最高、近期概率也最高的风险，应成为向管理层提出的第一个尽调问题。
