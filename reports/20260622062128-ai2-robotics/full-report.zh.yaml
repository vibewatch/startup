  - id: FR003
    title: AI² Robotics 关键依赖图
    type: dag
    layout: standard
    summary: |
      公司关键外部依赖的有向无环图，按来源、类型和单点故障风险映射。计算层的美国来源依赖和中国政策 / 监管节点被标为最高风险。
    data:
      nodes:
        - id: d1
          label: NVIDIA（美国）
          description: Jetson AGX Orin 64GB 计算；美国来源；受 BIS EAR 约束
        - id: d2
          label: DeepSeek（中国）
          description: 已集成进 GOVLA 管线的推理模型（据 36kr / 新闻报道）
        - id: d3
          label: BIS / US DOC
          description: 控制先进计算出口至中国的监管机构
        - id: d4
          label: HKC 惠科股份（中国）
          description: 唯一有约束力采购订单客户；锚定收入
        - id: d5
          label: CRRC Capital（中国）
          description: 具有国资关联的 Series B 投资方；暗示战略共研
        - id: d6
          label: Baidu Ventures（中国）
          description: Series B 投资方；可能带来 AI 模型平台依赖
        - id: d7
          label: MIIT / CAC（中国监管机构）
          description: 人形机器人安全标准；生成式 AI 监管；PIPL 执法
        - id: d8
          label: AlphaBot 2 产线（深圳）
          description: 单一制造设施；1,000 台/年产能；唯一生产资产
        - id: d9
          label: AI² Robotics（主体）
          description: 中央节点；依赖上述所有节点
        - id: d10
          label: MOU 客户（Dongfeng、Huaxi、Jingneng）
          description: 无约束力；代表潜在但未确认的管线
      edges:
        - from: d3
          to: d1
          label: 出口管制权
        - from: d1
          to: d9
          label: 计算供应（单一来源）
        - from: d2
          to: d9
          label: 推理模型集成
        - from: d4
          to: d9
          label: 唯一已确认收入
        - from: d5
          to: d9
          label: 资本 + 治理影响
        - from: d6
          to: d9
          label: 资本 + 模型平台风险
        - from: d7
          to: d9
          label: 监管合规义务
        - from: d8
          to: d9
          label: 唯一生产资产
        - from: d10
          to: d9
          label: 有条件的未来收入
