        - ~$2.7B 收入
        - ~3.5x 收入
        - 聚焦工业自动化；在公开市场结构上最接近 AI² 的企业客户目标
        - 已盈利且多元化；AI² 仍处于收入前阶段
      - - 'Cognex (Nasdaq: CGNX)'
        - 上市 — 机器视觉
        - ~$5.5B 市值
        - ~$900M 收入
        - ~6.1x 收入
        - 工业场景专用 AI 的最近似类比；IP 护城河支撑溢价
        - 仅限机器视觉；没有运动或 VLA 组件
      - - 'Symbotic (Nasdaq: SYM)'
        - 上市 — 仓储机器人 AI
        - ~$7B 市值
        - ~$2B 收入
        - ~3.5x 收入
        - 已规模化的 AI 原生机器人；场景是仓储而非人形机器人
        - 收入来自仓储部署；终端市场不同
    notes: >-
      非 AI² 私营公司的估值是分析师基于已披露轮次规模和行业可比公司作出的估算；公司并未确认。上市公司市值和收入为截至 2026 年年中的过去十二个月近似值，依据公开文件和 SEC EDGAR 数据。与 AI²
