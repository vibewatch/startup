    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 的完整法定名称为智平方（深圳）科技股份有限公司，统一社会信用代码 91440300MA5HTHDC7C，2023 年 4 月成立，总部位于深圳南山区——中国高科技硬件创业最密集的区域。
              公司在北京另设研发办公室。AI² 这个品牌名表达的核心命题是：人工智能叠加具身能力之后， 机器人能力会出现质变；公司将其包装为「AI × Embodiment」。商业模式走垂直整合路线： AI²
              自研机器人硬件，内部开发专有视觉-语言-动作（VLA）AI 模型栈，并通过多年期商业合同直接向企业客户销售机器人。 目标市场包括工厂自动化（汽车、半导体、电子制造）、物流和医疗健康。与授权使用第三方 AI
              模型的同行不同， AI² 声称自己的差异化来自专有 GOVLA / Alpha Brain 模型层。收入来源包括硬件机器人销售、 AI 模型层潜在软件授权，以及多年期企业客户合同。2025 年 5
              月，公司向一家注册名称近似 AI² 品牌的武汉实体发布正式法律声明， 由此留下可独立验证的公开记录，包含完整法定名称、信用代码和注册地址——对这家其余信息高度私密的公司而言， 这是最清晰的治理透明度窗口之一。
