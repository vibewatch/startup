              CEO Guo Yandong 在 2026 年 2 月 Sina Finance 公开署名文章中写道：「展望2026年，行业洗牌已开始」。这句话来自公司创始人本人，直接承认竞争整合压力真实且在加速。叠加
              TrendForce 2026 年 4 月数据显示 Unitree 和 AgiBot 拿下约 80% 中国人形机器人出货量，AI² 从少数份额位置面对 winner-takes-most
              格局。洗牌表态是重大反向信号，值得对 AI² 收入预测做明确的概率调整折价。
