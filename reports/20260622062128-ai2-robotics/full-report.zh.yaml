  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              与 AI² Robotics 相关的市场，最适合定义为中国企业级通用人形机器人市场——这类机器人能在非结构化工业环境中执行多步骤灵巧任务， 由视觉-语言-动作（VLA）AI
              模型驱动，而不是依赖固定编程。该细分市场位于更广义中国工业机器人市场和新兴具身 AI 品类的交汇处。 纳入的支出包括人形机器人硬件单元、专有 AI 软件栈、系统集成和部署服务、多年期商业运营合同及维护。
              排除的支出包括：面向特定刚性任务编程的传统固定臂工业机器人（FANUC、ABB、KUKA、Yaskawa、SIASUN、GSK 等同类产品）； 用于厂内物流运输但不具备操作能力的 Autonomous
              Mobile Robots（AMRs）和 AGVs； 缺少灵巧操作和通用 AI 的协作机器人（cobots）；以及没有商业级可靠性的消费或娱乐机器人。 AI²
              价值主张的现状替代方案包括按中国工厂工资率计价的人力、配套定制工装的固定臂机器人工作站、 面向特定 SKU 抓取放置的 cobots，以及把波动性制造任务外包给具备劳动力弹性的供应商。
              「humanoid」这一描述本身存在争议：Galaxea Dynamics 和 X Square Robot 部署的是轮式双臂系统，而非双足机器人， 使品类边界与 cobots 和 AMR +
              机械臂组合变得模糊。AI² 的 AlphaBot 2 是 22 DOF 双足形态， 在形态上形成差异化，但相较轮式替代方案也提高了部署复杂度。相邻领域包括工业 IoT 编排平台、仿真和数字孪生环境，
              以及用于预训练和微调 VLA 模型的云机器人服务。
