      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 中国「十五五」规划与自动化密度空间共同造就结构性有利市场
            body: >-
              中国「十五五」规划（2026–2030）明确把机器人列为现代工业体系的核心驱动力，并将 AI 研究引向实体应用。 叠加中国每 10,000 名制造业工人仅 166 台机器人的密度，相比韩国 1,220 台存在
              7× 结构性差距， 中国人形机器人市场的宏观顺风处于全球最强梯队。至少五家中国具身 AI 公司各自融资超过 USD 210 million， 市场也已出现首批工业规模公开商业合同（AI² 的 HKC
              订单；AgiBot 的 Longcheer 部署）。 技术能力推进速度快于企业销售周期，单次部署中的操作成功率已从 8% 加速到 60%。对 AI² 而言， 已披露客户垂直领域（汽车、半导体、制药）与 ROI
              最高的人形机器人部署用例相匹配，商业逻辑自洽。
