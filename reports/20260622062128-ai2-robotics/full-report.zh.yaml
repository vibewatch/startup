      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              中国人形机器人市场的增长叙事建立在政策强化的结构性宏观驱动和快速成熟的技术能力之上， 但几项实质约束会限制短期采用速度，并给前两强双寡头之外的玩家带来风险。关键增长驱动因素：
              （1）政策指令——中国「十五五」规划（2026–2030）把机器人置于现代工业体系核心， 引导 AI 研究走向实体应用，并把机器人定位为主要经济驱动力；这为国资关联买方降低采用摩擦。
              （2）自动化密度空间——中国机器人密度为每 10,000 名制造业工人 166 台，低于韩国 1,220 台、德国 449 台、日本 446 台和美国 307 台， 相比最佳实践自动化强度存在结构性 7×
              差距，增量采用需求空间很长。（3）资本集中——至少五家中国具身 AI 公司各自融资超过 USD 210 million； 中国机器人投资约为欧洲同行的
              5–6×，支撑研发和商业化吞吐。（4）技术栈成熟——AgiBot 的真实世界强化学习系统在复杂操作任务上， 成功率从约 8% 加速至 60%，正在缩小可靠性缺口。（5）EV 制造顺风——过去两年，中国 EV
              生产中的 cobot 采用快于大盘， 让企业采购先进机器人流程变得更常态化，人形机器人厂商可以借力。关键约束：（1）ROI 不透明——没有公开平均售价或生命周期成本数据，
              企业买方无法独立建模回本周期。（2）市场集中——Unitree 和 AgiBot 预计将拿下 2026 年中国人形机器人出货量约 80%， 小玩家面临结构性收入和规模劣势。（3）可靠性底线——60%
              任务成功率远低于工业规模无人监督生产部署所需的 99%+。 （4）竞品升级——Tesla Optimus Gen 3 可能在 2026 年下半年量产，Boston Dynamics Atlas 开始商业部署，
              都构成全球竞争压力。（5）标准缺口——截至 2026 年 6 月，中国尚无用于生产环境的全尺寸双足人形机器人正式国家安全认证标准， 给企业采购方带来监管不确定性。（6）行业洗牌风险——CEO 郭彦东在 2026
              年 2 月承认「行业洗牌已经开始」。
