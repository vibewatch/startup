  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 中国直接竞争格局
        blocks:
          - type: paragraph
            body: >
              2026 年中国人形机器人赛道由 Unitree Robotics 和 AgiBot（Zhiyuan Robotics，智元机器人）主导； 根据 TrendForce 2026 年 4
              月预测，两者合计占国内人形机器人出货量约 80%。Unitree Robotics 2016 年成立， 总部位于杭州，靠激进的硬件商品化建立地位：G1 人形机器人（132 cm，约 35 kg，23–43
              DOF，取决于配置） 起售价约 $16,000，是全球价格最亲民的全能力人形机器人。H1 和 H1-2 则延伸到要求更高的工业场景 （H1 约 180 cm、约 47 kg、3.3 m/s 行走速度；H1-2 约
              178 cm、约 70 kg、27 DOF）。 Unitree 还提交了境内 IPO 申请，推出 UniStore 应用生态平台并称其为全球首个人形机器人应用商店， 又发布起售价 $3,930 的双臂上半身 R1
              单元，以覆盖更低成本的操作用例。AgiBot（Zhiyuan Robotics）2023 年在上海成立， 路线相反：在五个产品平台上深投 AI 架构。全尺寸人形 A2（175 cm、55 kg、49+
              DOF、200 TOPS AI 算力、 350 N.m 峰值关节扭矩、7 km/h 行走速度）和工业 G2（搭载 NVIDIA Jetson Thor T5000，端侧算力 2,070 TFLOPS， 配备自研
              WorkGPT 任务模型和 GO-1 / GE-1 任务 / 世界执行模型）代表中国算力最密集的人形机器人平台。 AgiBot 公开目标是 2027 年收入超过 RMB 10 billion（约 USD 1.46
              billion），并已在 Longcheer Technology 的消费电子制造线上部署真实世界强化学习系统。 UBTECH Robotics（优必选）是国内最早一批玩家，也是唯一上市公司（HKEX:
              9880）， 与 Hitachi 合作将 Walker S2 工业人形机器人部署到制造场景，并推出消费品牌 Uworld，显示其多元化意图。 Galbot（银河通用机器人）和 Galaxea AI
              是阶段更早的国内创业公司，公开记录中的商业部署仍有限且未经验证。
