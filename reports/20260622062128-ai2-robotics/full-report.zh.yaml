      - number: '4.2'
        title: 资本结构、融资历史与投资方图谱
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 于 2026 年 2 月完成 Series B，募资超过 RMB 1 billion（约 USD 145 million）， 投后估值超过 RMB 10 billion（约 USD
              1.4–1.5 billion）。该轮由 Yicai Global、CnTechPost、Crunchbase News 和 Robotics & Automation News
              独立佐证，是本报告中置信度最高的数据点之一。Crunchbase 将估值列为 USD 1.4 billion， Yicai 报道为 USD 1.5 billion；小幅差异来自汇率换算时点。公司称约 12
              个月内完成约 12 笔融资—— 2025 年上半年 7 笔，另有 5 笔构成 Series B 集群——但 Series B 之前单轮金额未披露，无法精确估算 Pre-B 累计融资。 Series B 投资方包括
              Baidu Venture（Baidu 战略 AI VC 平台）、CRRC Capital（CRRC Group 子公司，后者为全球最大轨道交通装备制造商，
              也是中国人形机器人领域首个国有重工业投资方）、Cedarlake Capital（成长期 VC）、Guotai Haitong Securities（中国大型投行）、 Yusys
              Technologies（金融科技，A 股上市，SSE 688317）、Sentury Tire，以及一家未具名 Tesla 供应链企业。 Yicai 确认了战略逻辑：Baidu 带来 AI / LLM
              生态协同；CRRC 提供大规模制造测试环境。 Series B 资金将用于 GOVLA 模型开发和迭代、AlphaBot 硬件升级，以及把生产线扩张至 10,000 台年产能目标。 按 12
              轮披露估算，累计生命周期融资超过 RMB 2 billion（约 USD 290M+），但由于 Pre-Series B 轮次规模缺失， 该估算置信度较低。公司未公开披露债务融资或项目融资义务。
