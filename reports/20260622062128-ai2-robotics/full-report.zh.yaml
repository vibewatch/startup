  - id: TM001
    title: 市场定义与边界
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出 / 相邻领域
      - 现状替代方案
      - 与 AI² Robotics 的关系
    rows:
      - - 企业级 AI 原生人形机器人（双足或轮式）
        - 机器人硬件单元；自研 AI/VLA 软件栈；系统集成；多年商业合同；维护与支持
        - 传统固定臂工业机器人；AGV；消费 / 娱乐机器人
        - 工厂人工；带工装夹具的固定臂机器人单元；外包制造
        - 核心目标细分；AI² AlphaBot 2（双足，22 DOF）在这里直接竞争
      - - 协作机器人（cobots）
        - 协作机器人以更低成本处理重复性抓取 / 放置；采购方越来越多与人形机器人企业买家重合
        - 从人形机器人 SAM 中剔除；买方决策流程和用例不同
        - 在更简单、结构化任务上，协作机器人本身就是人形机器人的替代品
        - 相邻竞争压力；协作机器人普及让企业采购先进机器人更常态化
      - - 工业 AI 软件平台与机器人编排
        - 与人形硬件配套销售的 AI 推理、仿真、数字孪生和车队管理软件
        - 不带硬件销售的独立工业软件（ERP、MES 系统）
        - 传统工厂自动化软件；人工监督
        - 相邻赋能层；AI² 将 Alpha Brain 模型与硬件打包，可能成为 SaaS 加售向量
      - - 具身 AI 通用移动操作平台（轮式）
        - Galaxea G0 Plus、X Square Robot 等轮式双臂平台；属于同一批企业买家的讨论范围
        - 仅限严格双足机器人；轮式平台服务重叠但不同的细分场景
        - 单臂协作机器人；灵巧装配人工
        - 厂内物流和简单装配中的直接形态竞争者；部署复杂度低于双足
      - - 服务与物流机器人（非操作型）
        - 用于运输、但不具备灵巧操作的 AMR 和 AGV
        - 从人形机器人 SAM 中剔除
        - 传送带；人工叉车司机；自动叉车
        - 不属于 AI² 范围；纳入此处是为了明确划定边界
      - - 人工（现状基线）
        - 按中国工厂工资率计算的人工成本；灵活、灵巧、无需前期 capex
        - 不是机器人支出类别；作为参考基线纳入
        - 人工是所有机器人部署的主要替代品，也是 ROI 基线
        - 半导体洁净室、电子装配和汽车白车身车间替代人工的经济性，决定 AI² 的企业销售周期长度和合同规模
    notes: >-
      分析师来源对范围定义不一：MarketsandMarkets 的人形机器人市场数字可能包含轮式移动操作平台，TrendForce 的产量数据覆盖全部 AI 赋能双臂平台。IFR World Robotics
      数据只覆盖传统工业机器人，未单独拆分人形机器人类别。本边界把 AI² 的 SAM 视为企业级、AI 原生细分，而非整个中国工业机器人市场。现状替代方案因工厂而异，并决定每个企业垂直场景的销售周期动态。
    claimRefs:
