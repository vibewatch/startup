        - ~$2.6B（2024 年 2 月）
        - $675M 融资 / 未披露收入
        - AI² 当前估值的 1.9x
        - 同阶段西方可比公司；用美国资本市场标尺校准 AI²
        - 估值来自 2024 年 2 月；后续轮次未披露；无收入
      - - Physical Intelligence (π)
        - 私营 — 美国具身 AI
        - ~$2.4B（2024 年末估计）
        - $400M Series B / 未披露收入
        - AI² 当前估值的 1.7x
        - 直接 VLA 技术可比；π0.7 模型代表前沿水平
        - 聚焦操作能力，不是完整人形机器人；美国市场
      - - Apptronik
        - 私营 — 美国人形机器人
        - ~$1.2–1.5B 估计（2025 年）
        - $350M Series A / 未披露收入
        - 约为 AI² 当前估值的 1.0x
        - 阶段相近；重点推进制造业商业部署
        - 未披露估值；估算基于已披露轮次规模和可比倍数
      - - 1X Technologies
        - 私营 — 挪威人形机器人
        - ~$500M–$1.0B 估计
        - 已融资 $135M+ / 未披露收入
        - 约为 AI² 当前估值的 0.5–0.7x
        - Bezos 背书；较低倍数反映地域和融资规模更小
        - 私营估值未披露；与中国市场可比性较低
      - - AgiBot (未来机器人)
        - 私营 — 中国人形机器人
        - 未披露 / 估计 USD 1–2B
        - 大额轮次 / 未披露收入
        - 约为 AI² 当前估值的 0.7–1.4x
        - 最直接的中国可比公司；WorkGPT/GO-1/GE-1 技术栈；目标 2027 年收入达 RMB 10B
        - 估值未获公开确认；市场份额数据仅来自 TrendForce
      - - 'ABB Ltd (NYSE: ABB)'
        - 上市 — 全球自动化
        - ~$70B 市值
        - ~$32B 收入
        - ~2.2x 收入
        - 成熟自动化公司；给 AI² 长期倍数设定上限
        - 规模和成熟度不可比；收入基数是 AI² 隐含收入的 200x+
      - - 'Teradyne (Nasdaq: TER)'
