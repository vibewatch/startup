      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: Unitree + AgiBot 双寡头把 AI² 挤进 <20% 残余市场
            body: >
              TrendForce 2026 年 4 月预测将 Unitree 和 AgiBot 置于中国人形机器人出货量约 80% 的位置， AI² 和所有其他竞争者最多只能争夺一个仍然很小的市场的 20%。Unitree
              的量产规模和 $16,000 G1 定价设定了成本地板， AI² 以 1,000 台 / 年产能和未披露定价，当前无法匹配。AgiBot 的五平台组合和 VLA AI 深度， 基本镜像了 AI²
              最强的差异化主张。CEO 本人公开承认「洗牌」，说明在低于 20% 的细分空间里活下来， 需要一个清晰楔子；单靠纯硬件或纯 AI 差异化未必撑得住。
            calloutType: risk
