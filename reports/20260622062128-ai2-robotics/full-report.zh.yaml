      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              中国企业级人形机器人需求呈现清晰的三分结构。买方和付款方通常是大型工业企业中负责制造运营、供应链或资本开支规划的负责人，
              具备批准多年期、数百万元级资本支出的权限。用户是工厂一线自动化团队——自动化工程师、机器人操作员和维护技术员， 他们负责把机器人接入生产单元，并每天与机器人互动。付款方多数情况下与买方是同一家企业， 因为 AI²
              的商业合同是多年期供货协议，而非 as-a-service 模式；HKC 三年、1,000 台合同和 Dongfeng Liuzhou Motor 试点都能佐证。 从 AI²
              已披露客户群和行业轨迹看，主要买方分层包括：汽车 OEM 和 Tier-1 供应商（Dongfeng Liuzhou Motor）、 显示和半导体制造（HKC、JingNeng
              Microelectronics）、制药和生物科技（Huaxin Bio）， 以及更广义的先进制造，包括消费电子、新能源电池和物流。CRRC Capital 的投资也暗示未来可能进入基础设施和维护密集型工业场景。
              企业买方的采用触发点主要由 ROI 驱动：当人形机器人全生命周期成本（资本 + 集成 + 维护 + 停机风险）分摊到单项任务后， 低于规模化等效人力成本，采购才成立。按 2025–2026 年通用人形机器人
              USD 50–150K / 台的当前基准定价看， 没有公开单位经济性披露，回本周期仍不清楚。CRRC Capital 参与和中国「十五五」规划指令所显示的国有及准国有企业买方，
              可能受到采购国产人形机器人的政策引导，形成一个或许独立于纯 ROI 分析的需求底座。
