  - id: FV001
    title: 投资建议逻辑链
    type: flow
    layout: standard
    summary: 决策链从最强证据支柱出发，穿过已识别风险和估值溢价评估，最后落到 RESEARCH_MORE 建议。
    data:
      nodes:
        - id: n1
          label: HKC 1,000 台绑定订单 + 战略投资方组合（Baidu、CRRC）
        - id: n2
          label: 收入 / 利润率披露为零；绑定客户只有一个；12 轮股本结构复杂
        - id: n3
          label: 私人可比公司同业中位数（$1.4B vs 西方 $2.4–2.6B、中国同组约 $1.5B）
        - id: n4
          label: 订单价值倍数 60–150x；要撑住估值，订单簿必须快速扩张
        - id: n5
          label: VLA 护城河未经审计；Physical Intelligence π0.7 与 AgiBot 构成可信技术可比威胁
        - id: n6
          label: 结论：估值偏紧 — RESEARCH_MORE，待完成 5 个尽调触发项
    approximationNotes: 该流程逻辑呈现分析师的推理链，并非正式决策树模型。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV011
      - CV027
      - CV032
      - CV033
      - CV044
  - id: FV002
    title: 估值敏感性 — 关键价值驱动因素及影响
    type: bar
    layout: standard
    summary: 以当前 $1.4B 基准为参照，五个关键价值驱动情形下的隐含估值区间（百万美元）。正向驱动会抬高隐含估值，负向驱动会压低估值。
    data:
      items:
        - label: HKC 交付成功 + 第二个绑定客户
          value: 2100
        - label: 收入透明度（任何公开毛利率）
          value: 1800
        - label: 基准（当前 $1.4B；无新增信息）
          value: 1400
        - label: Unitree IPO 引发板块倍数压缩（<15x 收入）
          value: 900
        - label: 熊市：HKC 纠纷 + 无新增客户
          value: 750
    approximationNotes: 敏感性取值是分析师估算：用板块倍数框架套在代理收入上得出，并非来自 AI² 内部预测或折现现金流模型。
    claimRefs:
      - CV008
      - CV021
      - CV022
      - CV023
      - CV025
      - CV038
      - CV050
  - id: FV003
    title: 估值与回报区间 — 牛市 / 基准 / 熊市结果
    type: range
    layout: standard
    summary: 每个情形在预期 Series C / 下一次流动性事件窗口（18–36 个月）的估值低高区间（百万美元），显示当前 $1.4B 入场价下，下行相对上行更不对称。
    data:
      items:
        - label: 熊市情形（30%）：降估值融资
          low: 700
          high: 1000
        - label: 基准情形（55%）：温和增长
          low: 1400
          high: 2100
        - label: 牛市情形（15%）：规模突破
          low: 2800
          high: 4200
    approximationNotes: 区间代表预期下一轮估值标记，不是终值估算。当前 $1.4B 入场价位于基准情形区间低端；预期回报小幅为正，但在现有证据下，分布偏向下行。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV039
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI 评分卡 — 可提交 IC 的结论
    type: kpi
    layout: standard
    summary: IC 框架按 1–5 分评估七个投资维度；总分 17/35，说明公司确有市场机会和产品验证，但财务透明度与估值纪律不足，在当前条款下难以支撑买入信念。
    data:
      items:
        - label: 市场机会
          value: 3
          target: 5
        - label: 产品与技术验证
          value: 3
          target: 5
        - label: 竞争护城河
          value: 2
          target: 5
        - label: 财务透明度
          value: 1
          target: 5
        - label: 团队质量
          value: 4
          target: 5
        - label: 估值纪律
          value: 2
          target: 5
        - label: 证据质量
          value: 2
          target: 5
    approximationNotes: 评分是分析师基于 1-5 分尺度作出的判断。1 分 = 明显不足；3 分 = 中位水平；5 分 = 同类最佳。截至 2026 年 6 月，公司收入、利润率或管线披露均为零，因此财务透明度得 1 分。
    claimRefs:
      - CV004
      - CV006
      - CV009
      - CV027
      - CV031
      - CV037
      - CV043
      - CV044
      - CV045
      - CV049
