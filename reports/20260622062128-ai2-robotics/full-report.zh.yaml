      - number: '5.6'
        title: 技术护城河与薄弱点
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 的主要护城河包括：（1）全栈 VLA 的时间领先——它是首批追求端到端 VLA 架构的中国创业公司，并在多数竞争对手尚无可比基准前，开源了一个比西方同行高出 30%
              的模型；（2）数据—业务飞轮——每次商业部署都会生成难以大规模复制的专有机器人示教数据，模型优势可复利累积；（3）软硬一体系统——Alpha Brain 模型与 AlphaBot
              硬件协同设计，可做硬件感知的模型优化，纯软件竞争者难以轻易复制；（4）Peking University 联合实验室带来的机构研发入口，以及来自 Microsoft Research、OPPO、Xpeng
              的核心团队。实质薄弱点包括：GitHub 主页封闭（截至 2026
              年中公开仓库为零），限制第三方验证、社区信任和开发者采用，相比开放生态竞争者处于劣势；轮式底盘限制地形适应能力，与完全双足的竞争者（Unitree H1/G1、AgiBot
              A2）相比可部署场景更窄；尚无公开确认的 CE、ISO 10218 或同等安全认证，进入受监管环境会受阻；GOVLA 依赖 NVIDIA Orin AGX 64GB
              计算平台，若美国出口管制或供给受限，生产会直接受损。CEO 在 2026 年 2
              月的署名文章中坦率写道，行业「洗牌已开始」，消费市场进入「还不成熟也不现实——还需要五年」。这份自评可信，也等于披露了隐含竞争风险：如果消费市场继续被门槛挡住，AI² 就必须与
              Unitree、AgiBot、UFACTORY 以及数十家中国人形机器人创业公司争夺同一个结构性有限的工业订单池。
