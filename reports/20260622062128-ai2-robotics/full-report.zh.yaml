            title: 中国最快跻身独角兽的人形机器人公司
            body: >-
              AI² Robotics 从成立到达到独角兽估值（>RMB 10 billion）不到 3 年——这是全球人形机器人行业最快的路径之一。 垂直整合的硬件 + AI 模型栈、Baidu Venture 和 CRRC
              Capital 等高曝光机构股东， 再加上公司口径中中国最大的非展示型商业机器人订单（HKC 1,000 台），让 AI² 成为国内市场可信的挑战者。 开源 FIS-VLA 模型和 Yann LeCun
