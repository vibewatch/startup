      - number: '3.4'
        title: AI² 比较评估与护城河耐久性
        blocks:
          - type: paragraph
            body: >
              AI² 的竞争位置建立在三项声称的护城河上。第一，专有 GOVLA / Alpha Brain 视觉-语言-动作模型栈， 公司内部基准称其任务成功率比 Physical Intelligence 的 π₀ 高
              30%——这是未获独立复现的自报数字。 第二，早期企业部署牵引：HKC 订单（三年 1,000 台）被公司描述为中国最大的非展示型商业人形机器人订单， 另有 Dongfeng Liuzhou
              Motor、Huaxin Bio 和 JingNeng Microelectronics 等具名客户。第三， 全尺寸（1,800 mm、135
              kg）形态，面向需要桌面高度操作和承重的工业环境设计。相对这些护城河， AI² 在多个维度承压：已确认产能只有 1,000 台 / 年（目标 2026 年底 10,000 台），而 Unitree
              的定价纪律暗示其制造规模大得多。 AlphaBot 2 商业标价未公开，企业买方面临 ROI 不透明。Unitree 的 UniStore 应用生态策略如果成功， 可能把 AI²
              用于差异化的平台层商品化。AgiBot 在 AI 栈上的并行投入（NVIDIA Thor T5000 上的 WorkGPT / GO-1 / GE-1、 五个产品平台）以及在 Longcheer
              Technology 和汽车零部件工厂的制造试点，从侧面包抄 AI² 的单平台策略。 AI² 在 GitHub 开源 FIS-VLA，加上 Yann LeCun 公开背书，确实带来了开发者社区可信度和品牌认知，
              可能吸引人才和合作伙伴。中国人形机器人 IPO 浪潮逼近——Unitree 预计 IPO，Deep Robotics 已提交申请—— 显示头部玩家正通过公开股权市场巩固市场位置，可能进一步拉大与 AI²
              这类中游公司的资金和规模差距。 总体看，AI² 的位置真实但脆弱：一个新兴市场中至多 20% 的残余空间、自报 AI 基准、未披露定价， 以及一位公开承认整合将至的 CEO。
