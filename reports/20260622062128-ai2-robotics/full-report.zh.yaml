companyProfile:
  summary: >-
    AI² Robotics（智平方科技）是一家中国具身 AI 机器人公司，由 CEO 郭彦东博士于 2023 年 4 月创立。 公司把自研视觉-语言-动作模型栈（Alpha Brain /
    GOVLA）、全栈人形机器人硬件和企业端直接部署结合起来， 切入工厂自动化和公共服务流程。旗舰产品 AlphaBot 2 已面向汽车、半导体、生物科技、零售和服务场景营销， 公司称已建成生产线，并拿下 HKC 为期三年、1,000
    台机器人的标志性订单。 AI² 于 2026 年 2 月完成 Series B，估值约 USD 1.4 billion，但仍未披露收入、利润率或现金消耗数据， 商业规模和单位经济性因此成为尽调的核心缺口。
