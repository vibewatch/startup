      - number: '1.3'
        title: 融资历史与投资方构成
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 于 2026 年 2 月完成 Series B 融资，募资超过 RMB 1 billion（约 USD 145 million）。 公司公开称约 12 个月内完成约 12
              轮融资——公司口径包括 2025 年上半年 7 笔融资和 Series B 集群中的 5 笔追加融资—— 但这些数字来自公司陈述，无法从公开备案中独立验证。Yicai Global 报道 Series B
              后估值超过 CNY 10 billion（约 USD 1.5 billion）， Crunchbase 的 2026 年 2 月独角兽同批公司分析则把公司估值列为 USD 1.4
              billion；两者的小幅差异最可能来自汇率换算时点或四舍五入规则， 而非实质分歧。Series B 财团具有战略意义：Baidu Venture（Baidu 旗下聚焦 AI 的战略 VC）、 CRRC
              Capital（中国中车旗下资本平台，中国中车是全球最大轨道交通装备制造商）、Cedarlake Capital（成长期 VC）、 Guotai Haitong Securities（中国大型投行）、Yusys
              Technologies、Sentury Tire，以及一家未具名 Tesla 供应链企业均参与投资。 CRRC Capital 背靠国有重工业巨头，它的入局显示机构对人形机器人商业化时间表有信心，
              也是中国人形机器人行业首次获得国有重工业企业投资。
