  - id: TV002
    title: 投资逻辑 vs. 反向逻辑
    columns:
      - 投资逻辑
      - 强度
      - 反向逻辑
      - 解决条件
    rows:
      - - HKC 1,000 台订单是中国最大具约束力人形机器人商业合同
        - 强——有约束力、多年期
        - 唯一有约束力合同；HKC 交付里程碑、ASP 和验收条款未披露
        - 确认 HKC 2026 年 Q3 交付里程碑
      - - Baidu Venture 领投 + CRRC Capital 传递战略分销深度信号
        - 中等——高质量投资团
        - 相比财务投资者，战略投资者可能拥有优先权和信息优势
        - 披露股权结构和优先权栈
      - - GOVLA/Alpha Brain 是拥有专有数据集的差异化 VLA 模型
        - 中等——公司声称，未验证
        - Physical Intelligence π0.7 和 AgiBot WorkGPT 分别代表西方和中国的 VLA 替代方案；GOVLA 基准由公司自报
        - 独立第三方基准审计
      - - 中国“十五五”规划要求机器人产业规模化部署
        - 强——政策支撑需求
        - 政策支持市场形成，但不会把市场份额分配给 AI²；Unitree 和 AgiBot 拥有同等进入机会
        - AI² 在政策指引中被明确列为优选供应商
      - - $108B 全球机器人市场到 2035 年增长至 $416B，形成结构性顺风
        - 强——宏观背景
        - 人形机器人子赛道只占整个机器人市场很小一部分；结构性顺风同样惠及 20 多家已融资竞争对手
        - AI² 证明其 SAM 获取高于行业平均
      - - CRRC Capital 入局，标志着首家国企重工业 VC 投入中国人形机器人
        - 中等——暗示铁路和基础设施部署路径
        - 铁路 / 基础设施垂直部署仍是推测；未宣布与 CRRC 的 MOU 或试点
        - CRRC 试点公告或部署 MOU
      - - 12 个月内 12 轮融资反映投资者需求持续
        - 弱——也可能反映快速稀释周期
        - 异常节奏更像高烧钱或结构性资本提款，而不是有机里程碑
        - 披露每轮规模和资金用途
    notes: 投资逻辑强度仅基于公开可验证证据。反向逻辑假设没有非公开数据可用。
    claimRefs:
      - CV003
      - CV005
