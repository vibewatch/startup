      - number: '3.3'
        title: 替代方案与现状选择
        blocks:
          - type: paragraph
            body: >
              AI² 人形机器人产品的主要竞争替代项不是其他人形机器人，而是已经在中国工厂规模化部署的现有自动化方案。 ABB、KUKA、FANUC、Yaskawa 和中国本土集成商的传统工业机器人，以已验证
              ROI、可忽略的任务失败风险和成熟服务生态主导工厂自动化。 IFR 记录显示，2024 年中国约安装 295,000 台工业机器人，占全球 54% 市场份额；这一装机基础构成人形机器人必须撬动的核心在位优势。
              协作机器人（cobots）份额正在提高，也越来越多加入智能功能——Robot Report 2026 年 1 月中国机器人展望称， cobots 正「趋向更智能化的解决方案」，并把智能化作为差异化，直接侵入
              AI² 的目标应用。 Autonomous Mobile Robots 和 Automated Guided Vehicles 已在物流和仓储中证明 ROI。固定自动化产线和输送系统在重复性、
              大批量生产中成本更低、吞吐更高，人形机器人尚无法在经济性上匹配。中国轻制造装配任务的主要替代方案仍是人力， 按当前机器人价格点，单任务成本显著更低。内部自建路径同样相关：大型企业买方（汽车
              OEM、半导体晶圆厂）可以与系统集成商开发专有自动化， 完全绕开第三方人形机器人供应商。AI² CEO 在 2026 年 2 月承认「行业洗牌已经开始」， 也等于承认企业买方会基于已展示 ROI 在这些替代方案和
              AI² 产品之间选择——而这一门槛尚未在公开领域获得独立验证。
