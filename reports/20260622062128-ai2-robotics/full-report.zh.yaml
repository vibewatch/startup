      - number: '2.2'
        title: 市场规模——多重视角与矛盾
        blocks:
          - type: paragraph
            body: >
              中国人形机器人子市场没有单一权威规模数据；公开估算使用的范围定义、方法论和地域切分彼此不一致， 直接比较并不合适。四个规模视角呈现不同侧面。（1）出货量展望：TrendForce（2026 年 4 月）预测，
              2026 年中国人形机器人产量将同比激增 94%，Unitree 和 AgiBot 合计获得约 80% 总出货量——意味着其余所有玩家最多只能争夺 20% 产量。
              （2）收入预测：MarketsandMarkets 将 2025 年中国人形机器人市场规模估为 USD 0.40 billion， 到 2030 年增长至 USD 2.80 billion，CAGR 为
              47.6%。其全球市场估计从 2025 年 USD 2.92 billion 增至 2030 年 USD 15.26 billion， CAGR 39.2%，按该来源定义，中国约占 2025
              年全球人形机器人收入的 14%。（3）整体工业机器人背景：IFR 报告称， 中国 2024 年安装 295,000 台工业机器人，占全球 54% 市场份额——主体仍是传统机械臂，人形机器人未单独拆分。
              如果人形机器人占装机基数不足 1%，2025 年 USD 0.40 billion 收入对应的就是数千台、 单台平均售价 USD 50–150K 的规模，这一区间与可得竞品定价信号相符。（4）投资信号视角：
              至少五家中国具身 AI 公司迄今各自融资超过 USD 210 million，其中 X Square Robot 两年内融资总额单独超过 USD 400 million—— 这说明 VC
              预期三到五年内市场会显著扩大，但也提示相对当前单位经济性可能存在过度融资。矛盾很多： TrendForce 的产量口径很可能统计所有 AI 赋能的轮式和双足机器人；MarketsandMarkets
              可能使用更窄定义； IFR 完全没有拆分人形机器人。AI² Robotics 的 SAM 和 SOM 都无法从现有公开数据中可靠剥离， 任何单点 TAM 估计都只能视为方向性指标，而非精确分析结果。
