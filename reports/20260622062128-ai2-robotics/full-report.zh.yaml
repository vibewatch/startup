        title: 情景分析与概率加权估值区间
        blocks:
          - type: paragraph
            body: >-
              面向未来 18–36 个月的 Series C 或二级流动性事件，三种情景可框定 AI² 估值轨迹。多头情景（15% 概率）假设 HKC 按计划交付，至少三家新企业客户在 2026
              年底前下达约束性采购订单，AI² 到 2027 年初年化收入达到 RMB 300 million 或以上，从而以 10–15x forward revenue 支撑 USD 3–4 billion 的
              Series C。基准情景（55%）假设 HKC 大体按计划执行但有一个或多个批次延迟，两份 MOU 转成约束性订单，到 2027 年中总年化收入 RMB 100–200 million，Series C
              估值持平到小幅上升，区间为 USD 1.4–2.1 billion。熊市情景（30%）包括 HKC 交付出现重大争议或减量、没有新增约束性客户，以及因 Unitree Robotics STAR market
              IPO（TrendForce 称申请已于 2026 年 4 月获受理）按低于 AI² 隐含估值的行业倍数定价，引发中国人形机器人 cohort 下行 mark-to-market 压力，估值降至 USD 700
              million 至 USD 1 billion。概率加权预期估值约为 USD 1.7 billion，略高于当前 USD 1.4 billion 入场价，但分布偏斜：30% 熊市情景的绝对下行大于 15%
              多头上行，55% 基准情景的升值空间有限。Unitree IPO 若以不高于 15x trailing revenue 定价，将是触发赛道重估最强的外部催化剂。
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV038
              - CV039
              - CV040
              - CV041
          - type: table
            tableRef: TV003
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV034
      - number: '8.5'
        title: 最终结论与尽调问题
        blocks:
          - type: paragraph
            body: >-
              对 AI² 的 USD 1.4 billion 估值，总体判断是偏高但并非不理性。入场价格处在 2026 年 2 月中国人形机器人独角兽 cohort
              中位，且低于可比西方私募估值。然而，公司没有任何财务披露——无收入、无毛利率、无单位经济、无 ARR——再叠加唯一约束性合同代表全部已确认商业需求，风险调整后回报预期不足以支撑「买入」信心。建议投资者立场为
              RESEARCH_MORE：若以下五个关键尽调触发项中至少三个得到正面解决，可在 Series C 重新评估；若估值在 down-round 情景中压缩至 USD 1.0 billion
              以下、风险回报明显改善，也可重新评估。任何能接触 data room 材料的投资者（未披露 cap table、GOVLA 基准来源、HKC
              交付排期、分业务毛利、客户管线），都应结合非公开证据独立重估该结论。地缘政治风险——美中科技脱钩把退出选项限制在中国战略买家和境内 STAR/HKEX IPO
              路径——形成结构性估值天花板，无论运营表现如何都适用，而同行倍数分析并未捕捉这一点。
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV041
              - CV042
              - CV045
              - CV046
              - CV047
              - CV048
              - CV049
