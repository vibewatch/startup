  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与商业牵引
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 主要通过多年期商业合同，向企业直接销售 AlphaBot 2 机器人硬件来变现。 公司尚未公开确认纯软件、SaaS 或轻资产收入流，尽管官方产品资料把 GOVLA / Alpha
              Brain 列为潜在授权层。 按硬件销售惯例，收入预计在机器人交付并验收时确认；经常性服务收入（维护、模型更新）尚未披露。 公司不公布标价。基于商业上相近的企业部署——西方市场 Agility Robotics
              的 Digit 约 USD 150,000 / 台， 以及 Unitree G1 这种轻得多、简单得多的研究级平台 USD 13,500——AlphaBot 2 企业 ASP 估计为 RMB
              200,000–500,000 / 台 （约 USD 28,000–70,000），但该区间未获确认。最强公开商业信号是 HKC（惠科，全球第三大 LCD 面板制造商） 为期三年的 1,000 台
              AlphaBot 2 合同，公司称其为中国最大的非展示型商业人形机器人订单。 其他已确认客户关系包括 Dongfeng Liuzhou Motor（汽车，2025 年 6 月以来战略合作）、Huaxin
              Bio（生物技术， 2025 年 4 月宣布战略合作）和 JingNeng Microelectronics（半导体制造）。一线中国城市机场行李车搬运试点， 以及北京、深圳的「智魔方」模块化 AI
              空间部署，代表公司在公共服务领域的探索。公司官方 about 页面称其 「订单量和场景覆盖领先」——这是公司自述，缺少对订单数量或收入金额的独立佐证。ARR、GMV 或单位出货量均未披露。
