      - number: '5.4'
        title: 遥操作、训练数据与学习管线
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 提供两类遥操作设备，用于采集示教数据和支持远程作业。VR Teleoperation 系统靠末端执行器逆运动学驱动机器人：操作员佩戴 VR
              头显，用手柄指定手部姿态，机器人逆运动学求解器再求出关节解。该方案便携、搭建快、成本较低，但运动学奇异点会带来解不稳定，长时间操作也容易眼疲劳。适用场景偏向示教、展演和简单移动任务。Exoskeleton
              Teleoperation 系统使用与 AlphaBot
              手臂结构一致的可穿戴机械臂（关节空间驱动），直接映射操作员关节角度。它精度高、力反馈自然，也不会出现无解动作，但硬件重、调试复杂、成本更高。更适合固定场地的高精度数据采集、PCB
              上料和安全关键环境。数据—业务双闭环是 AI² Robotics 迭代策略的底座：每次商业部署都会生成真实世界示教片段，这些数据进入公司自有增量训练管线，在 1,000-GPU 集群上持续微调
              GOVLA，进而提升同场景和相邻场景的模型表现。按下绿色拖动示教按钮后，机械臂也可直接做动觉示教，无需遥操作配置即可快速现场编程技能。AI² Robotics
              明确把搜索引擎级互联网公司的数据飞轮作为数据基础设施灵感来源，上述闭环与之类似。
