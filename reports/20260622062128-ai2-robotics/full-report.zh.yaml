      - number: '3.2'
        title: 西方基准同行
        blocks:
          - type: paragraph
            body: >
              西方人形机器人公司定义了全球技术和商业化参照系，但受出口管制、本地化要求和供应链分离影响， 目前并不直接与 AI² Robotics 在中国企业市场竞争。Figure AI 的 Figure 03
              转向消费者家庭市场，搭载 Helix AI 系统， 用例画像不同于 AI² 的企业端工业聚焦。Agility Robotics 是商业成熟度最高的西方人形机器人公司： 公司称 Digit
              平台是首个进入生产部署的人形机器人，通过 Arc 云平台运行，并作为 Amazon 供应链伙伴部署在物流场景； Agility 在 Oregon 州 Salem 制造，约 80%
              零部件来自美国，强调供应链韧性。Apptronik 的 Apollo （172 cm、72 kg、55 lbs / 25 kg 载荷、每块电池 4 小时续航）由曾打造 NASA Valkyrie
              机器人的团队开发， 采用 Robot-as-a-Service 商业模式，面向仓储和制造客户。Boston Dynamics 的 Atlas 是全球技术最先进的商业人形机器人—— 1.9 m、90 kg、56
              DOF、IP67 等级，可在 −20°C 至 40°C 运行，具备连续关节运动范围、50 kg 瞬时载荷， 并通过 Orbit 平台接入企业级机队管理。1X Technologies（Norway /
              US）聚焦家庭机器人。 这些西方公司目前都不对 AI² 在中国本土企业买方群体内构成直接采购威胁，但它们设定了能力天花板， 也是成熟中国企业买方和全球投资者使用的基准；其 RaaS /
              机队管理模式也为国内玩家提供了商业化模板。
