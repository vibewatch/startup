              - CV049
      - number: '8.6'
        title: 图表要点
        blocks:
          - type: callout
            title: 结论：估值偏高——继续研究
            body: >-
              AI² 2026 年 2 月 USD 1.4 billion 估值处在同业中位，但没有财务披露作锚。建议立场为 RESEARCH_MORE：在没有 data-room 访问、无法解决至少三项尽调问题（收入 /
              毛利、HKC 交付里程碑、cap table、GOVLA 审计、客户管线）前，不应按当前条款投资。若估值压缩到 USD 1.0B 以下，或 Series C 披露收入并可用传统倍数分析定价，可更积极地重新评估。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV034
              - CV041
          - type: callout
            title: 反向信号：VLA 训练数据稀缺与 Physical Intelligence 前沿威胁
            body: >-
              CB Insights 2026 年 6 月对 YC Winter 2026 cohort 的分析，把 physical AI 训练数据稀缺列为人形机器人部署的首要系统性瓶颈。这不是 AI²
              特有风险——Physical Intelligence、AgiBot 和所有 VLA 竞争者都会受影响——但它会直接削弱多头情景里的时间线假设，也削弱 GOVLA
              作为护城河的持久性，因为该护城河依赖在生产环境中累积专有具身数据，而规模化生产部署尚未确认。
            calloutType: risk
            claimRefs:
              - CV027
              - CV031
              - CV044
          - type: callout
            title: 关键假设：以 HKC 订单价值作为收入代理指标
            body: >-
              整个估值分析只拿 HKC 的 1,000 台、三年采购订单作为 AI² 的唯一收入代理。假设 ASP 区间（每台 RMB 200K–500K）由分析师根据同业定价数据估算，AI² 或 HKC 均未确认。只要
              ASP、交付节奏或收入确认出现重大差异，上述所有倍数测算都会直接改写。
            calloutType: assumption
            claimRefs:
              - CV003
              - CV008
              - CV050
