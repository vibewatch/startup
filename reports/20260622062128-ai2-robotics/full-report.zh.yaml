      - number: '5.2'
        title: GOVLA 架构与 Alpha Brain 软件栈
        blocks:
          - type: paragraph
            body: >-
              Alpha Brain 是 AI² Robotics 自研具身基础模型的产品品牌，底层模型架构名为 GOVLA（Global & Omni-body Vision-Language-Action）。GOVLA
              的核心新意在于输出完整的全身运动学控制和移动轨迹，而不是像早期 VLA 模型那样只输出机械臂末端动作。架构由三个耦合模块拼成。第一，Spatial Interaction Foundation Model 把实时
              3D 物体位置、空间关系和环境动态编码成世界模型表征。第二，Slow System（System 2）负责复杂逻辑推理、多步骤任务拆解和自然语言对话输出；它引入 DeepSeek
              推理技术，拉长长周期规划能力。第三，Fast System（System 1）把 Slow System
              的计划翻译成连续的全身关节轨迹和底盘运动指令，并以控制环频率执行，让机器人能实时响应，不必等推理周期结束。AI² Robotics 是中国最早推进 VLA 的公司之一：GOVLA 0.0（2024 年 6
              月）是中国创业公司首个开源 VLA，参数量只有 Google RT-2 系列的 1/20，性能却高出 80% 以上。GOVLA 0.5（FiS-VLA，2025 年 6 月）开源后，在权威基准上比
              Physical Intelligence 的 π0 高出 30%，并获得图灵奖得主 Yann LeCun 背书。到 2026 年中，GOVLA 1.0 仍在研发，尚未发布。训练基础设施包括一座
              1,000-GPU 算力集群。模型在 Orin AGX 64GB 模块端侧运行，不依赖云端，在工厂环境中可守住低于 100 ms 的推理延迟，并保护数据隐私。
