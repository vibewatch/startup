      - number: '7.2'
        title: 技术、供应链与具身模型风险
        blocks:
          - type: paragraph
            body: >
              AlphaBot 2 的计算骨干是 NVIDIA Jetson AGX Orin 64GB，这是一块 275-TOPS 系统级模块，由美国 NVIDIA 制造。NVIDIA Jetson AGX Orin
              被归类为先进计算物项，向 Country Group D:5 实体出口时受 BIS Export Administration Regulations（EAR）管制，中国包含在 D:5 内。Bureau of
              Industry and Security 已发布指引，重申向 D:5 总部实体或拥有 D:5 母公司的实体运送先进计算物项需要许可证，并把授权 IC 设计师项目时间线延长至 2026 年 12 月 31
              日——这更像是监管继续收紧，而非问题解决。如果 BIS 进一步收紧管制、限制 NVIDIA 向中国终端用户供应 Orin 模块，或 NVIDIA 因美国政府压力自行限制供应，AI²
              将遭遇关键依赖失效，且公开记录中没有已确认的国产替代计算平台。规模化替换 Orin 将需要硬件重设计、模型重新验证，并可能重谈客户合同，周期以数月到数年计，也很可能显著压缩毛利。鉴于 GOVLA / Alpha
              Brain 模型与 NVIDIA 嵌入式平台绑定程度很高，作者将其归类为近期存在性供应链风险。


              芯片之外，AlphaBot 2 的 22+
              自由度执行器和关节模块供应链并未公开记录。机器人硬件架构文档列出严格运行要求——不得有严重粉尘、爆炸性或有害气体、强电磁干扰——这些条件会限制可服务部署环境；若设备进入不合规环境，也可能触发保修和责任索赔。电池热管理是中国机器人公司普遍面临的已知风险向量；硬件文档列出
              −20°C 至 65°C 的工作温度限制，以及具体湿度和气压范围，但没有引用热失控缓释方案或电池认证标准。


              GOVLA / Alpha Brain VLA 模型带来与硬件不同的模型层技术风险。学术研究（RT-2、OpenVLA）持续记录：VLA
              模型在训练分布内任务上泛化较好，但遇到训练分布外的新物体、光照变化或表面纹理时，表现会显著下降。公司关于核心硬件部件「50,000 小时 MTBF」的主张，尚无任何独立安全评估验证。AgiBot
              在生产中部署真实世界强化学习，展示了一种可更快适应工厂现场变化的竞争训练范式；这意味着 AI² 较慢的批量模仿学习管线可能被赶超。支撑 GOVLA 的数据飞轮需要持续、部署级数据采集；如果 MOU
              客户无法转成生产部署，相比部署单位更多的竞争对手，模型改进周期会停摆。
