      - number: '4.3'
        title: 成本结构、单位经济性与生产资本开支
        blocks:
          - type: paragraph
            body: >
              AlphaBot 2 的 BOM 由 NVIDIA Jetson AGX Orin 64GB 计算模组、三台 Intel RealSense D435 RGB-D 摄像头、 两台 D405 近距摄像头、2D
              LiDAR、22-DOF 精密执行器系统（膝关节峰值扭矩 436 Nm、腰部俯仰 207 Nm）、 48V / 30Ah 电池包和两轮差速底盘构成。基于嵌入式 AI 模组和精密执行器的商业组件定价基准， 总
              BOM 估计为 RMB 100,000–200,000 / 台（约 USD 14,000–28,000）——如果企业定价不足以覆盖直接材料和组装成本， 毛利率会受到压缩。AI² 称核心组件 MTBF 为
              50,000 小时，这项可靠性工程投入本身也提高了组件质量门槛和成本。 研发成本方面，公司运营一个用于 GOVLA 模型训练的「千卡 GPU 算力集群」——这是显著的持续基础设施成本，
              在小装机基数上会推高单台摊销研发费用。公司还在 GOVLA VLA 模型构建中使用 DeepSeek 技术， 表明存在可能带来授权或算力开销的外部模型依赖。从 1,000 台 / 年扩至 10,000 台 /
              年， 意味着工厂工装、质量控制自动化和精密组件供应链锁定都需要大量资本开支。AgiBot 的轨迹——2026 年初约三个月内从 1,000 台扩至 5,000 台再到 10,000
              台——展示了人形机器人快速爬坡的运营形态，尽管 AgiBot 的生产模式可能不同。 TrendForce 2026 年 4 月引用的 Unitree STAR market IPO 招股书披露，2025
              年人形和四足机器人综合毛利率为 60%， 说明规模足够时硬件毛利可以健康；但 Unitree 成本更低的 G1（$13,500）有利于抬高混合毛利， 与 AI² 更高规格产品组合并不可直接比较。CEO
              明确提醒，消费机器人市场至少未来五年不可行， 这把收入预期牢牢锚定在企业段：合同价值更大，但周期也更长。
