      - number: '5.3'
        title: 硬件平台与部件规格
        blocks:
          - type: paragraph
            body: >-
              AlphaBot 2 的机械设计围绕三关节折叠升降腿、腰部偏航和两轮差速驱动展开，腿部 / 腰部合计 7 个执行器。每条手臂从肩到腕提供 7 DOF，关节范围从肩部 ±178° 到 J7 的 -26° 至
              120° 不等。单臂额定载荷为 4 kg，工作半径 723 mm；重复定位精度 ±0.1 mm，足以对标中端协作机械臂。每条手臂内置六轴力 / 力矩传感器（200 N 力、7 Nm
              力矩量程），支撑柔顺控制和碰撞检测，便于人机安全协作。关节峰值力矩从颈部俯仰的 3.3 Nm 到膝关节的 436 Nm 不等，接近工业机器人执行器的选型口径。计算栈运行在 NVIDIA Orin AGX 64GB
              上：2,048 核 Ampere GPU、12 核 ARM Cortex-A78AE CPU、2× NVDLA v2 深度学习加速器、64 GB LPDDR5、204.8 GB/s 内存带宽，以及最高 275
              TOPS AI 性能。连接接口包括 Ethernet、RS485 和 CAN bus。开发者可通过 AlphaBotCore SDK 使用 Python、C 和 C++ 接入。电池为 48V/30
              Ah，额定连续运行 4–6 小时。核心部件标称 MTBF 为 50,000 小时，按工业级可靠性设计。运行环境为 5–40°C、10–80% RH。
