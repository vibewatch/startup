      - number: '7.3'
        title: 监管、政策、安全与责任风险
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 尚未公开披露 AlphaBot 2 的任何产品安全认证。截至报告日期，公司官方文档和新闻稿均未引用中国 GB/T 机器人安全标准备案、ISO 10218（工业机器人安全）、CE
              标志或同等国际认可安全评估。以 AI² 当前阶段看，这不一定构成否决项——中国人形机器人专项安全标准仍在 MIIT 2023 年《人形机器人创新发展指导意见》框架下起草——但它留下了潜在责任缺口：任何
              AlphaBot 2 造成工厂工人身体伤害的事件，都可能引发产品责任索赔、监管调查和声誉损害；在缺乏认证安全框架的背景下，损害可能与事故严重度不成比例。


              数据治理形成另一条监管风险。AlphaBot 2 实时感知视觉和环境；GOVLA 模型摄取工厂现场视频、空间数据，并可能采集人类工人的生物特征接近数据。中国《个人信息保护法》（PIPL，2021 年 11
              月生效）监管个人信息的收集、处理和跨境传输。如果 AlphaBot 2
              的数据采集管线捕捉工人生物特征、人脸识别或行为数据——考虑到机器人全身视觉栈，这很可能发生——合规需要有记录的同意机制、数据影响评估，并可能需要个人信息保护负责人。公司官方文档未说明这些义务。中国《生成式人工智能服务管理暂行办法》（2023）还监管嵌入式
              LLM 的训练数据和输出安全，覆盖 GOVLA 模型的语言指令层。若无法维护合规的生成式 AI 服务备案，AI² 可能面临中国 Cyberspace Administration（CAC）的监管行动。


              出口管制和军民两用风险是双向的。AI² 一方面面临美国 BIS 管制造成的上游芯片供应风险（见第 2 节），另一方面若向非中国司法辖区出口 AlphaBot 2 或 GOVLA
              模型权重，机器人一旦被归类为两用物项，可能受中国《出口管制法》（2020）约束；鉴于含有 NVIDIA Orin 内容，也可能触发美国再出口管制。到 2026
              年，两条出口路径的法律边界仍不清晰，可能形成合规陷阱，让国际扩张在未做法律结构设计前被冻结。政府政策支持——MIIT 将人形机器人列为战略性新兴产业、CRRC
              联合投资、深圳地方补贴——目前有利，但也自带风险：政策重点会变化，补贴会撤回，国资背景投资者（CRRC、Guotai Haitong）可能带来治理影响，复杂化未来国际融资或 M&A 交易。
