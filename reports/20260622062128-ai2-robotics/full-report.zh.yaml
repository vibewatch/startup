      - number: '1.4'
        title: 产品、技术与竞争位置
        blocks:
          - type: paragraph
            body: >
              AI² 的旗舰产品是 AlphaBot 2，一款全尺寸人形机器人，于 2025 年 4 月发布，拥有 22 个自由度， 身高 1,800 mm，重量 135 kg。机器人搭载 NVIDIA Jetson Orin
              AGX 模组，端侧内存 64 GB， 单次充电可运行 4–6 小时。核心 AI 差异化来自 GOVLA 模型（市场名 Alpha Brain），这是公司自研的专有视觉-语言-动作架构。 2025 年 6
              月，公司在 GitHub 开源名为 FIS-VLA 的研究版本；Meta 首席 AI 科学家 Yann LeCun 公开背书该模型。 AI² 的内部基准称，GOVLA 的任务成功率比 Physical
              Intelligence 的 π₀ 模型高 30%——这是公司自报数字，截至本报告尚未被独立复现。 公司 2025 年 9 月建成生产线，初始产能 1,000 台 / 年，并公开称目标是在 2026 年底达到
              10,000 台 / 年。 从竞争格局看，TrendForce（2026 年 4 月）估计 Unitree Robotics 和 AgiBot 合计占中国人形机器人市场约 80%， AI²
              等其他所有国内玩家只能争夺剩余 20%。AI² 将 HKC 为期 3 年、1,000 台机器人的商业订单视为牵引力证据， 并称其为中国最大的非展示型商业人形机器人订单。其他具名客户包括 Dongfeng
              Liuzhou Motor（汽车工厂自动化）、 Huaxin Bio（制药）和 JingNeng Microelectronics（半导体）。
