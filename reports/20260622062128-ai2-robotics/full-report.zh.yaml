          - type: callout
            title: 市场集中、ROI 不透明和标准缺口是短期采用的实质约束
            body: >-
              三项约束正在结构性限制中国人形机器人的短期采用。第一，市场集中：Unitree Robotics 和 AgiBot 预计合计拿下 2026 年中国人形机器人出货量约 80%，AI²
              和所有其他厂商最多只能争夺一个当前估计 USD 0.40 billion 市场的 20%—— 这意味着 AI² 在 2025–2026 年的收入天花板至多是数千万美元级。第二，ROI
              不透明：中国没有一家人形机器人厂商披露平均售价、 生命周期成本结构或企业回本数据，大规模企业采购很难论证。第三，监管缺口：截至 2026 年 6 月，
              中国没有用于生产环境中全尺寸双足人形机器人的正式国家安全和认证标准，企业采购方面临责任敞口。 CEO 郭彦东本人在 2026 年 2 月署名文章中承认「行业洗牌已经开始」，说明 2026–2027
              年竞争整合会加速。
