company:
  name: AI² Robotics
  website: https://ai2robotics.com
chapter:
  number: 6
  title: Customers
  summary: >
    As of June 2026, AI² Robotics has five publicly named anchor customers: HKC (惠科股份, world's
    3rd-largest LCD panel maker, 3-year/1,000-unit AlphaBot 2 purchase order), Dongfeng Liuzhou
    Motor (automotive, strategic cooperation MOU June 2025), Huaxi Biotech (华熙生物, biotech/pharma,
    strategic cooperation MOU April 2025), Jingneng Microelectronics (晶能微电子, Geely-affiliated
    semiconductor, strategic cooperation March 2025), and ZhiMofang (智魔方, public services,
    airport/community deployment). All commercial relationships are enterprise B2B; CEO Guo Yandong
    stated in February 2026 that the consumer market is not viable for at least five years. The HKC
    contract is the sole confirmed binding multi-year commitment; the three remaining enterprise
    accounts are cooperation MOUs with undisclosed volumes. NRR, GRR, churn, and renewal data are
    not publicly disclosed. TrendForce (April 2026) shows Unitree and AgiBot hold approximately 80%
    of China's humanoid robot output market, placing AI² in the contested minority bracket. Customer
    concentration in HKC is a material risk if that account represents a majority of early revenue.

sections:
  - id: s1
    title: Customer Segments and Vertical Strategy
    body: >
      AI² Robotics pursues a deliberate enterprise-first, B2B-only go-to-market strategy. CEO Guo
      Yandong stated explicitly in a February 2026 public op-ed that consumer humanoid robot demand
      is not mature and will not be viable for at least five more years, anchoring the company's
      entire near-term revenue model in factory and commercial-service contracts. Six verticals have
      been publicly identified by the company: semiconductor manufacturing, automotive manufacturing,
      biotech/pharmaceutical, electronics manufacturing, public services, and new retail. Of these,
      the first five have named customer evidence.


      Semiconductor manufacturing is anchored by Jingneng Microelectronics (晶能微电子), a chip
      company within the Geely Technology Group that signed a cooperation agreement in March 2025.
      Automotive manufacturing is represented by Dongfeng Liuzhou Motor (东风柳州汽车), a brand of
      the Dongfeng group, whose strategic cooperation was signed in June 2025 covering vehicle
      assembly labeling, part assembly, and factory logistics. Biotech/pharmaceutical is anchored
      by Huaxi Biotech (华熙生物), one of China's largest biotech companies by hyaluronic acid
      production, with cooperation announced at the AlphaBot 2 launch event in April 2025. The use
      cases — aseptic material handling, visual inspection, and sterile room operations — address a
      genuine contamination-control pain point that favors robotic automation. The LCD/display
      manufacturing vertical is anchored by HKC, the world's third-largest LCD panel maker, which
      placed a binding 3-year, 1,000-unit purchase order. Public services are represented by
      ZhiMofang (智魔方), which deploys AlphaBot 2 for baggage cart collection and lobby service
      at Beijing and Shenzhen locations.


      No named retail customer has been announced despite the retail vertical appearing in company
      materials. The geographic footprint of all confirmed customers is exclusively domestic China;
      no international pilot, export, or cross-border distribution has been disclosed as of the
      run date. KR Asia analysis documents at least ten Chinese chip startups targeting automotive
      semiconductor supply chains — each represents a potential future robotics customer as domestic
      chip production scales. SP Global analysis further identifies semiconductor supply chain
      localization as a driver of automation investment in Chinese automotive plants, providing
      demand-side tailwind for AI²'s primary verticals.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU019
      - CU020
      - CU026
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: s2
    title: Named Customer Evidence and Deployment Cases
    body: >
      The quality and specificity of customer evidence varies significantly across the five named
      accounts. HKC (惠科股份) is the most commercially significant: Yicai Global and CnTechPost
      independently report a three-year, 1,000-unit AlphaBot 2 purchase order — the only
      confirmed binding multi-year contract in AI²'s public record. AI² characterizes this as the
      largest non-showcase commercial humanoid robot order in China to date. As the world's
      third-largest LCD panel maker, HKC is a credible anchor customer for an early-stage robotics
      company. The annual delivery schedule, payment milestones, and acceptance criteria are not
      publicly disclosed. AI² launched its production line in September 2025 at 1,000 units per
      year capacity, a figure that exactly matches the HKC commitment — suggesting HKC may absorb
      the full initial production run.


      Dongfeng Liuzhou Motor signed a strategic cooperation agreement in June 2025 covering
      automated labeling, assembly, and factory logistics. This is classified as a cooperation MOU
      rather than a purchase order; unit volume and contract value are undisclosed. Huaxi Biotech
      (华熙生物) signed a strategic cooperation at the AlphaBot 2 April 2025 launch event for sterile
      material handling, visual inspection, and clean-room operations. Jingneng Microelectronics
      (晶能微电子, Geely-affiliated) signed cooperation in March 2025 for semiconductor factory tasks.
      ZhiMofang (智魔方) is referenced as an active deployment in the CEO's February 2026 op-ed;
      the relationship type is described as a public-service deployment rather than a formal MOU.
      No customer has publicly reported outcomes, NPS scores, or reference performance metrics as
      of June 2026. The AlphaBot 2 documentation lists supported use cases across these verticals,
      confirming technical readiness, but no third-party verification of operational outcomes exists.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU034
      - CU037
