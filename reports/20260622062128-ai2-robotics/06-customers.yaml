      - TU002
      - TU003
    figureRefs:
      - FU002

  - id: s3
    title: Market Position, Competitive Pressure, and Adverse Signals
    body: >
      TrendForce data from April 2026 shows Unitree Robotics and AgiBot collectively hold
      approximately 80% of China's humanoid robot output market, leaving AI² Robotics in the
      contested minority bracket alongside smaller peers. CEO Guo Yandong acknowledged in his
      February 2026 op-ed that "the industry shake-out has already begun," a candid admission that
      competitive pressure is already being felt at the company level. TheRobotReport's 2026 China
      robotics outlook explicitly cites "significant competitive pressure" as a dominant theme for
      the year.


      The IFR reports that China installed 295,000 industrial robots in 2024, commanding 54% of
      the global market — a macro indicator that the underlying factory automation market is large
      and structurally receptive to next-generation humanoid deployments. However, this broad market
      tailwind benefits all robotics competitors equally. Crunchbase data shows 6 new Chinese
      robotics unicorns emerged in March 2026 alone, reflecting a surge of well-funded competitors
      and investor appetite that simultaneously validates and crowds the space.


      HKC customer concentration is the single largest revenue-risk factor in the current customer
      profile. If the 1,000-unit HKC order represents the majority of AI²'s confirmed early
      revenue, any delivery failure, acceptance dispute, or customer defection would be material.
      Three of five named accounts are cooperation MOUs without committed unit volumes, meaning
      the revenue base beyond HKC is not yet confirmed. The MOU-to-purchase-order conversion rate
      is a key forward indicator to watch.
    claimRefs:
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
      - CU027
      - CU028
      - CU029
      - CU030
    tableRefs:
      - TU005
    figureRefs:
      - FU003

  - id: s4
    title: Retention, Expansion, and Evidence Gaps
    body: >
      Net Revenue Retention (NRR), Gross Retention Rate, and churn are not publicly disclosed, as
      is typical for early-stage Chinese robotics companies that have not yet filed for any public
      offering. The earliest possible renewal event is the HKC contract at approximately April 2028,
      three years from signing. No customer satisfaction proxies, NPS data, or independent reference
      quotes appear in any public source reviewed as of June 2026.


      The multi-vertical footprint — LCD manufacturing, automotive, biotech, semiconductor, and
      public services — suggests a deliberate land-and-expand strategy, though depth per vertical
      remains shallow with a single named account in each. The CRRC Capital and Baidu Ventures
      investor relationships may function as strategic referral channels into rail/infrastructure
      and internet/platform verticals respectively, though channel contribution to the customer
      pipeline is not publicly quantified. Domestic semiconductor localization trends (per KR Asia
      analysis) may reduce hardware procurement friction for customers in the automotive supply
      chain segment. If only the HKC order is revenue-recognized (others being MOUs), the current
      revenue base is highly concentrated. The website and technical documentation do not disclose
      total customer count, active deployment figures, or utilization metrics.
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU035
      - CU036
      - CU038
      - CU039
      - CU040
    tableRefs:
      - TU004
    figureRefs:
      - FU004

