  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer retention and NRR metrics
      missingEvidence: >
        Net Revenue Retention, Gross Retention Rate, churn rate, and customer satisfaction scores
        for all AI² Robotics enterprise customers; total signed customer count beyond the five
        publicly named accounts; total estimated pipeline revenue.
      whyItMatters: >
        Without NRR or churn data it is not possible to assess whether the cooperation MOUs are
        converting to revenue-generating deployments or if customer satisfaction supports renewal.
        The total pipeline estimate (QU010) and NRR gap (QU017) are unresolvable without private data.
      diligencePath: >
        Request investor data room access or direct management disclosure in Series C due diligence;
        ask for a full customer reference list, signed contract values, and any available NPS or
        deployment acceptance data.
      relatedQuestionRefs: [QU010, QU017]

    - type: private-evidence-only
      severity: material
      topic: HKC delivery progress and contract milestones
      missingEvidence: >
        Current status of the HKC 1,000-unit delivery — how many units have been delivered,
        whether delivery is on schedule, and whether any acceptance criteria have been met or
        disputed as of June 2026.
      whyItMatters: >
        The HKC contract is the primary commercial durability signal; delivery progress
        determines whether the 3-year commitment translates into actual recognized revenue
        and whether production capacity is being utilized as planned.
      diligencePath: >
        Request delivery milestone status from management; seek any HKC-issued press release
        or annual report reference to the AI² Robotics deployment; check AI² production line
        utilization data if made available.
      relatedQuestionRefs: [QU023]

