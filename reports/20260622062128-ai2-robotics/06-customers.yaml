      whyItMatters: >
        Adoption friction determines whether cooperation MOUs convert to production orders and
        whether early deployments scale. Without evidence on pricing or operational barriers it
        is not possible to assess whether the MOU-to-order conversion pipeline is realistic.
      diligencePath: >
        Interview customers or channel partners; request case studies or pilot outcomes from
