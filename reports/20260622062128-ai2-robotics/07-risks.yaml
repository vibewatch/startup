callouts:
- calloutType: risk
  title: NVIDIA Orin Export-Control Risk — Existential Dependency on US-Origin Chip
  body: 'AlphaBot 2''s GOVLA/Alpha Brain model runs on the NVIDIA Jetson AGX Orin 64GB, a US-origin advanced integrated circuit
    already subject to BIS EAR export controls to Country Group D:5 (China). BIS guidance issued in May 2026 reaffirmed license
    requirements for advanced computing items shipped to D:5-headquartered entities and extended the authorized IC designer
    timeline only to December 31, 2026 — signaling ongoing tightening rather than resolution. AI² has not disclosed a domestic
    compute alternative (Huawei Ascend, CIXAI, Zhaoxin, or equivalent). A control escalation that cuts Orin supply would require
    a full hardware redesign and model revalidation, a process measured in months to years. This is the highest-severity,
    highest-near-term probability risk in the AI² Robotics investment thesis and should be the first diligence question asked
    of management.

    '
  claimRefs:
  - CR011
  - CR012
  - CR013
- calloutType: risk
  title: Adverse Signal — CEO Acknowledges Industry Shake-Out Has Begun
  body: 'In a February 2026 public op-ed on Sina Finance, CEO Guo Yandong wrote: "展望2026年，行业洗牌已开始" ("Looking ahead to 2026,
    industry shake-out has already begun"). This statement, from the company''s own founder, directly acknowledges that competitive
    consolidation pressure is real and accelerating. Combined with TrendForce''s April 2026 data showing Unitree and AgiBot
    capturing ~80% of Chinese humanoid robot shipments, AI² faces a winner-takes-most dynamic from a position of market minority.
    The shake-out acknowledgment is a materially adverse signal that warrants explicit probability-adjusted discounting of
    AI²''s revenue forecasts.

    '
  claimRefs:
  - CR004
  - CR005
  - CR006
