    type: verification
    question: Does China’s Data Security Law (DSL 2021) create compliance obligations for AI² Robotics’ field-deployed AlphaBot
      2 units collecting factory sensor and camera data?
    status: answered
    finding: Yes. The DSL (effective Sep 2021) obliges data processors handling “important data” (which industrial production
      and supply-chain data may qualify as) to conduct security assessments and obtain approval before cross-border transfer.
      No DSL compliance statement or data-classification policy has been published by AI² Robotics as of Jun 2026. This is
      an execution risk for international customer deployments.
    sourceRefs:
    - SR017
    - SR020
    relatedClaimRefs:
    - CR009
    - CR010
    targets:
    - contentRequirements/1
    - plannedTables/regulatory-legal-risk-register
  - id: QR030
    type: comparison
    question: What is the gap between ISO 10218 international industrial-robot safety certification and China’s domestic GB/T
      36008 standard, and which certification path is AI² Robotics most likely to pursue?
    status: answered
    finding: GB/T 36008-2018 closely mirrors ISO 10218-1:2011 for industrial robots; domestic CQC certification via this standard
      is typically required for Chinese factory customers and is faster than ISO. IEC 62061 functional-safety certification
      (required for EU or US customers) would require substantially more engineering work. No certification roadmap has been
      publicly disclosed by AI² Robotics. The GB/T path is likely near-term; IEC/ISO is a multi-year exercise.
    sourceRefs:
    - SR007
    - SR038
    relatedClaimRefs:
