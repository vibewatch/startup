chapter:
  number: 7
  title: Risks
  summary: 'AI² Robotics faces a mutually reinforcing set of risks that are characteristic of capital-intensive, pre-revenue,
    hardware-AI startups competing in a Chinese market undergoing active shake-out. Five risk clusters stand out as investment-thesis-relevant.
    First, commercialization and customer concentration: the only binding multi-year purchase order is HKC (1,000 units /
    three years); the three remaining named enterprise accounts are cooperation MOUs with undisclosed volumes, and the CEO
    explicitly acknowledged "industry shake-out has begun" in February 2026. Second, supply-chain and technical risk: AlphaBot
    2''s compute is anchored on the NVIDIA Jetson AGX Orin 64GB, a US-origin advanced integrated circuit subject to BIS export
    controls on Country Group D:5 entities; no confirmed domestic alternative has been disclosed, and a further tightening
    of controls would be materially disruptive. Third, regulatory and safety risk: no product safety certification has been
    publicly filed, humanoid-robot safety standards in China are still being drafted, and China''s Personal Information Protection
    Law (PIPL 2021) and Interim Measures for Generative AI (2023) create compliance obligations for AlphaBot 2''s camera and
    LLM layers. Fourth, capital-intensity and valuation-mismatch: the company completed twelve funding rounds in roughly twelve
    months, targets a 10× production capacity ramp by end-2026, and carries a RMB 10 billion+ valuation against undisclosed,
    likely sub-commercial revenue — requiring a Series C at a moment when Unitree''s STAR-market IPO application, if successful,
    could materially reset sector multiples. Fifth, governance and execution risk: only the CEO is publicly named among the
    entire leadership team, the management''s production-volume targets (1M units by 2033) dramatically outpace current evidence,
    and twelve simultaneous funding closes in one year introduces organizational complexity disproportionate to a 30-month-old
    company. Unresolved gaps include: any disclosed safety certification or product liability insurance; confirmation of chip-sourcing
    continuity under tightening BIS rules; NRR or contract renewal data for any customer; and an audited balance sheet.

    '
sections:
- id: s1
  title: Commercialization Risk and Customer Concentration
  body: 'The most immediate investment risk for AI² Robotics is the gap between stated commercial traction and independently
    verifiable binding commitments. Of the five publicly named anchor customers, only the HKC (惠科股份) agreement is a binding
    multi-year purchase order — 1,000 AlphaBot 2 units over three years. Dongfeng Liuzhou Motor, Huaxi Biotech, Jingneng Microelectronics,
    and ZhiMofang are described as "strategic cooperation" MOUs; volumes, pricing, and delivery schedules are not publicly
    disclosed. Customer concentration is therefore extreme: HKC may represent the entirety of AI²''s confirmed order backlog,
    and AI²''s own production capacity of 1,000 units per year at launch precisely matches the HKC commitment. If HKC delays,
    cancels, or renegotiates the order — or if the company fails to convert the three remaining MOUs to binding contracts
    within the next 12–18 months — revenue would be materially impaired.


    Competitive consolidation compounds this risk. TrendForce (April 2026) projects that Unitree Robotics and AgiBot together
    will capture approximately 80% of total Chinese humanoid robot shipments in 2026. AI²''s CEO, Guo Yandong, publicly acknowledged
    in a February 2026 op-ed published on Sina Finance that "industry shake-out has already begun" — a rare admission from
    a startup CEO that competitive pressure is real and acute. AgiBot''s deployment of real-world reinforcement learning on
    an active Longcheer Technology production line in 2026 demonstrates that at least one direct competitor has already moved
    from pilot to production deployment, a milestone AI² has not yet publicly verified at equivalent scale. The CEO''s own
    forecast of 10,000-unit-per-year capacity by end-2026 and 2028 respectively, and 1,000,000 units by 2033, carries execution
    risk that no current evidence base supports.


    The company''s go-to-market strategy is entirely enterprise B2B within mainland China; no international pilot, export
    partnership, or cross-border distribution agreement has been disclosed as of the run date. This geographic concentration
    ties AI²''s revenue trajectory to domestic Chinese industrial automation investment cycles, which are in turn sensitive
    to downstream demand conditions in automotive, semiconductor, and biomanufacturing sectors. Humanoid robot ROI for enterprise
    customers remains unproven at scale industry-wide: no third-party audit, case study, or productivity measurement has been
    published for any of AI²''s five named customer deployments. The conversion of cooperation MOUs into binding contracts
    and then into revenue is therefore the most pressing near-term risk signal for investors to monitor.

    '
