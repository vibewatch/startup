companyProfile:
  summary: "AI² Robotics (智平方科技) is a Chinese embodied-AI robotics company founded in April 2023 by CEO Dr. Guo Yandong. The company combines a proprietary vision-language-action model stack (Alpha Brain / GOVLA), full-stack humanoid robot hardware, and direct enterprise deployment to target factory automation and public-service workflows. Its flagship AlphaBot 2 robot has been marketed into automotive, semiconductor, biotech, retail, and service scenarios, and the company says it has established a production line plus a landmark three-year HKC order for 1,000 robots. AI² closed a Series B in February 2026 at roughly a USD 1.4 billion valuation, but it still discloses no revenue, margin, or cash-burn data, leaving commercial scale and unit economics as the central diligence gap."
