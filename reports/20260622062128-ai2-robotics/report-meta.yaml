  topStrengths:
    - "AI² pairs a proprietary embodied AI stack with full-stack robot hardware and has shipped a coherent AlphaBot 2 product narrative into real enterprise scenarios."
    - "The investor base mixes strategic AI and industrial backers such as Baidu Venture and CRRC Capital, which can matter more than purely financial sponsors in Chinese robotics scale-up."
    - "The HKC three-year 1,000-unit order provides stronger commercialization evidence than most early humanoid peers have publicly shown."
  topRisks:
    - "Commercial concentration is extreme because HKC appears to be the only publicly confirmed binding multi-year contract, while other named accounts remain cooperation agreements or pilots."
    - "No public revenue, margin, or cash-burn disclosure exists, so the $1.4B valuation cannot be anchored to audited operating performance or unit economics."
    - "The product stack depends on rapid production ramp, VLA reliability, and imported compute components in a market already consolidating around larger Chinese competitors."
  unresolvedGaps:
    - "Audited revenue, gross margin, cash burn, and backlog-conversion data remain undisclosed."
    - "Customer acceptance criteria, payment terms, and realized economics for the HKC order are not public."
    - "Leadership depth beyond founder/CEO Guo Yandong and the detailed post-Series B cap table are not publicly disclosed."
