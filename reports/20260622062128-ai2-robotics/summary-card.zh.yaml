  topStrengths:
    - AI² 将自研具身 AI 栈与全栈机器人硬件捆在一起，围绕 AlphaBot 2 拼出连贯的产品叙事，并已落到真实企业场景。
    - 投资人同时覆盖 Baidu Venture、CRRC Capital 等战略 AI 与产业资本；在中国机器人规模化阶段，这类背书可能比纯财务资本更关键。
    - HKC 三年 1,000 台订单提供的商业化证据，比多数早期人形机器人同行公开展示的更硬。
  topRisks:
    - 商业集中度极高：HKC 似乎是唯一公开确认、有约束力的多年合同，其他具名客户仍停留在合作协议或试点。
    - 公司没有公开收入、利润率或现金消耗数据，$1.4B 估值无法用经审计经营表现或单位经济性锚定。
    - 产品栈要同时顶住快速量产爬坡、VLA 可靠性和进口算力组件依赖；市场也已向更大的中国竞争者集中。
  unresolvedGaps:
    - 经审计收入、毛利率、现金消耗和积压订单转化数据仍未披露。
    - HKC 订单的客户验收标准、付款条款和实际经济性未公开。
    - 创始人 / CEO Guo Yandong 之外的管理层厚度，以及 Series B 后的详细股权结构未公开。
