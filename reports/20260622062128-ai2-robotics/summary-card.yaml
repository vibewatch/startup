summary:
  headline: >-
    AI² Robotics is a credible Chinese embodied-AI contender with real strategic backing and an unusually large early
    customer contract, but the February 2026 unicorn valuation still runs ahead of disclosed fundamentals and keeps the
    company in research-more territory.
