companyProfile:
  summary: >-
    Articulate Global was founded in 2002 by Adam Schwartz in New York City and built a category-leading
    workplace-learning platform before taking outside capital. Its flagship Articulate 360 suite combines
    Rise, Storyline, Review, Reach, and Localization into a single workflow spanning course creation,
    collaboration, translation, and distribution. The company says it serves more than 125,000 organizations,
    reaches 133M learners across 187 countries, and is used by all Fortune 100 companies. After nearly
    two decades of bootstrapping, Articulate raised a single $1.5B Series A in 2021 at roughly a $3.75B
    valuation from General Atlantic, Blackstone Growth, and ICONIQ Growth.
  foundedDate: '2002-01-01'
  founders:
    - name: Adam Schwartz
      role: Founder, CEO, and Executive Chairman
      background: >-
        Bootstrapped Articulate from its 2002 founding through the 2021 Series A and still holds combined
        founder, CEO, and executive-chair authority.
      claimRefs:
