  foundingLocation: New York City
  headquarters: New York, NY
  productSummary: >-
    Articulate sells the Articulate 360 platform: Rise for browser-based authoring, Storyline for advanced
    interactive authoring, Review for stakeholder collaboration, Reach for training distribution, and
    Localization for multilingual deployment, with AI Assistant and a large content library layered across
    the suite.
  customerFocus: >-
    Primary buyers are L&D, enablement, compliance, and customer-training teams at mid-market and enterprise
    organizations; end users are instructional designers, subject-matter experts, and business teams that
    need to publish and localize digital training quickly.
  businessModel: >-
    Recurring annual SaaS sold mainly per author seat, with published Articulate 360 list pricing at
    $1,449-$1,749 per user per year and separate upsell modules such as Localization and Reach.
  stage: Late-stage private growth-equity-backed company
  fundingStatus: >-
