callouts:
  - calloutType: strength
    title: Articulate's Community Flywheel Is Structurally Differentiated
    body: >
      The E-Learning Heroes community (1.5M members) creates a self-reinforcing content and support ecosystem that rivals cannot replicate at speed. Templates, tutorials, and peer support lower the cost of Articulate skill development, reinforce platform specialization among professional IDs, and make switching costs non-monetary as well as technical.
    claimRefs:
      - CP002
      - CP022

  - calloutType: risk
    title: AI Commoditization Threatens the Storyline Complexity Moat
    body: >
      If generative AI can convert documents to deployable courses with embedded branching at near-zero marginal cost, Storyline's complexity ceiling—the primary source of its switching cost—erodes. Articulate's AI Assistant is a defensive response, but parity among AI-enabled authoring tools would shift competition to price, brand, and community. All three authoring rivals (iSpring, Captivate, Easygenerator) have launched parallel AI features as of 2025–2026, compressing Articulate's first-mover advantage.
    claimRefs:
      - CP026
      - CP027
      - CP028

  - calloutType: risk
    title: SME-as-Author Trend Shifts Buyer Profile and Price Sensitivity
    body: >
      Easygenerator's explicit positioning ("anyone in your organization can share knowledge without adding to L&D's workload") and Docebo Creator's AI-generation capability signal a structural shift: buyers may increasingly democratize authoring across subject-matter experts rather than concentrating it in specialist IDs. This compresses the per-seat willingness to pay for Articulate's premium authoring feature set.
    claimRefs:
      - CP008
      - CP016
      - CP027

  - calloutType: insight
    title: Pricing Discipline Is a Key Diligence Focus
    body: >
      Articulate lists $1,449–$1,749/user/year with no monthly option, while iSpring prices from $970/user/year and Adobe Captivate at ~$408/user/year (monthly). Whether Articulate achieves its list price in enterprise contracts—or discounts to win competitive bids—is an unresolved financial question. The realized average selling price (ASP) relative to list is a critical input for revenue-quality assessment in Chapter 4.
    claimRefs:
      - CP011
      - CP012
      - CP013

