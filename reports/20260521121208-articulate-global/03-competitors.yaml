company:
  name: Articulate Global
chapter:
  number: 3
  title: Competitors
  summary: >
    Articulate 360 commands an entrenched position in corporate e-learning authoring, with 125,000+ organizations and every Fortune 100 company as customers, reinforced by deep switching costs from Storyline file formats, a 1.5M-member community, and full-suite integration. Direct authoring rivals—iSpring, Adobe Captivate, Easygenerator, Elucidat, dominKnow, and Lectora/Trivantis—are smaller, more narrowly focused, and priced below Articulate's AI-tier list rate of $1,749/user/year. Adjacent LMS players (Docebo) and digital-adoption-platform substitutes (Whatfix) address adjacent job-to-be-done slices without directly displacing Articulate's authoring dominance. The primary threat is AI commoditization: generative tools that can auto-generate courses from documents may erode the complexity barrier that anchors Storyline lock-in.

sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: >
      Articulate operates in the e-learning authoring software segment, a corner of corporate L&D that sits above pure LMS delivery platforms and below bespoke custom-development agencies. The competitive map splits into four bands: (1) direct authoring rivals that compete head-to-head for the same instructional designer seat, (2) simplified-authoring entrants targeting subject-matter experts (SMEs) rather than professional IDs, (3) adjacent LMS and digital-adoption platforms (DAPs) that substitute for portions of Articulate's value chain, and (4) AI-native tools emerging from productivity and generative-AI stacks that threaten to commoditize basic course creation.

      Within the direct authoring band, iSpring Suite (60,000+ teams, PowerPoint-native), Adobe Captivate (part of the Creative Cloud ecosystem), Easygenerator (50,000+ authors in 2,000+ companies, SME-focused), Elucidat (enterprise-scale, team-centric), dominKnow ONE (centralized workflow, US federal contractor), and Lectora/Trivantis (~$11.6M estimated revenue, Section 508 focus) are the most relevant named rivals. TechSmith Camtasia is an adjacent tool for video-based training that overlaps on screen-simulation use cases but lacks multi-module course architecture. None match Articulate's breadth—Storyline + Rise + Review + Reach + Content Library + AI Assistant in a single subscription—nor its community flywheel.

      Growjo's competitive table estimates Articulate's nearest authoring peer by revenue as Captivate (~$57.8M estimated), Easygenerator (~$35.4M estimated), and IMC AG (~$90.8M estimated, broader scope). These are estimates from third-party aggregators and carry significant uncertainty; none of the rivals have disclosed audited revenue figures. At $111.7M in 2024 revenue (Latka-reported), Articulate appears to lead the authoring-tool segment by a meaningful margin.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
    tableRefs:
      - TP001

  - id: direct-authoring-rivals
    title: Direct Authoring Rivals
    body: >
      iSpring Suite is the closest apples-to-apples rival in the professional-ID authoring market. It runs inside Microsoft PowerPoint, claims 60,000+ teams, is priced from $970/user/year (vs. Articulate's $1,449–$1,749 range), and is recognized by eLearning Industry as the top authoring tool for 2025. Its PowerPoint-native architecture lowers the technical barrier but limits the sophisticated timeline, branching, and variable logic that professional IDs use in Storyline. iSpring's AI features (AI text-to-speech, AI translation, AI course generation from materials) directly parallel Articulate's AI Assistant. iSpring also offers an LMS add-on (iSpring Learn), which deepens its substitutability.

      Adobe Captivate competes on software simulation and VR/360 scenarios—use cases where Storyline's fixed-layout approach is a disadvantage. Captivate is priced at approximately $33.99/user/month billed monthly (approximately $408/user/year), significantly cheaper than Articulate on a per-user basis but historically rated lower on ease-of-use by reviewers. Captivate benefits from Adobe Creative Cloud ecosystem gravity (Firefly image generation, integration with Premiere/Illustrator) and Adobe's enterprise relationships, but has a steeper learning curve that limits SME adoption. SelectHub ranked Articulate Storyline #3 in its authoring-tool index and Captivate adjacent, with Articulate pricing listed at $1,149/user annually in that comparison.

      Easygenerator targets the SME-as-author use case: 50,000+ authors at 2,000+ companies create content without L&D expertise. Its AI coaching, video creation, and localization suite (75 languages) are Articulate-comparable in breadth, but it lacks the advanced interaction engine (branching scenarios, variable triggers) that makes Storyline indispensable for enterprise compliance and simulation. Easygenerator was acquired by Spekit (per eLearning industry tracking), which may affect its strategic direction. Pricing is from $116/user/month (approximately $1,392/user/year), placing it just below Articulate's AI-tier Teams price.

      Elucidat positions itself for large L&D teams managing high-volume, branded production workflows. Its differentiators are centralized asset governance, real-time team collaboration, and enterprise brand controls—features Rise 360 partially replicates in Articulate's ecosystem. Elucidat does not publish pricing (custom quote). dominKnow ONE emphasizes single-source authoring for multi-format output (training content, performance support, mobile job aids), competes on US Federal contractor registrations, and supports Fortune 500 customers. Lectora/Trivantis (~$11.6M Growjo estimate) is the oldest rival and retains a niche in Section 508 accessibility-first workflows and SCORM-heavy government/regulated-industry deployments. TechSmith Camtasia competes specifically on screen-recording and video-based training with AI avatar and text-to-speech capabilities, overlapping Articulate's Peek 360 and Replay 360 products but lacking Rise/Storyline-style multi-module architecture.
