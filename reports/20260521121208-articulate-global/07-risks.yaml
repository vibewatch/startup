callouts:
  - calloutType: risk
    title: "AI Disruption Is a Near-Term Structural Threat, Not a Long-Term Possibility"
    body: >
      The 58% reduction in course development time from AI, combined with the launch of AI Course
      Drafts across multiple platforms and DAPs displacing authoring for in-app use cases, makes
      AI substitution a present-tense competitive threat. Articulate has integrated AI into its
      suite but has not disclosed roadmap differentiation that would structurally defend its
      premium per-seat pricing against free or near-free AI-native alternatives.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]

  - calloutType: risk
    title: "Stale Valuation at 33.6x ARR Is the Dominant Financial Risk"
    body: >
      The $3.75B July 2021 valuation implies ~33.6x 2024 ARR. Current public eLearning SaaS peers
      trade at 3–7x revenue and private SaaS non-AI transactions clear at 4–8x ARR. Any secondary
      transaction or exit event at market-rate multiples would imply a valuation of $450M–$900M—
      a 76–88% discount to the 2021 mark. This is the largest single risk in the investment profile.
    claimRefs: [CR026, CR027, CR028]

  - calloutType: recommendation
    title: "Diligence Must Obtain Audited Financials and NRR Before Underwriting Any Price"
    body: >
      All revenue, customer count, and growth metrics are sourced from third-party estimators or
      company-controlled communications. No investment decision at any price point should be made
      without audited P&L, balance sheet, NRR/GRR by cohort, and a cap table reflecting the
      2021 investor preference stack. The absence of audited disclosure is a blocking gap.
    claimRefs: [CR030, CR031, CR032, CR033]

