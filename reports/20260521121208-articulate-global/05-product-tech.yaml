callouts:
  - calloutType: strength
    title: "Integrated Suite Is the Moat"
    body: >-
      Articulate 360's defensibility comes from workflow integration, not a single best-of-breed module.
      Competitors can match individual slices of the stack, but few combine advanced authoring,
      responsive authoring, review, localization, delivery, bundled assets, community scale, and
      enterprise trust documentation inside one subscription.
    claimRefs: [CE001, CE020, CE021]

  - calloutType: risk
    title: "Storyline Mac Gap and Offline Limitations"
    body: >-
      Storyline's Windows-only desktop architecture means the suite's most powerful authoring surface is
      unavailable to Mac-primary teams, while Rise's browser-first design leaves offline authoring
      support unclear. For enterprises migrating large legacy libraries, review-site complaints about
      batch-conversion friction increase implementation risk.
    claimRefs: [CE032, CE033]

