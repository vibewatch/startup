chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Articulate 360 is a vertically integrated e-learning authoring and delivery suite combining Rise,
    Storyline, Review, Reach, Localization, AI Assistant, and Content Library inside a single
    subscription used by 125,000 organizations and every Fortune 100 company. The product architecture
    mixes cloud SaaS collaboration and delivery services with a Windows desktop authoring client,
    creating both a durable workflow moat and a clear OS-dependency risk; enterprise trust posture is
    reinforced by SOC 2, ISO 27001, ISO 42001, FedRAMP, GDPR controls, and published accessibility
    reports.

