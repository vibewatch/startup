sections:
  - id: SE-product-suite
    title: Product Suite and Customer Workflow
    body: |
      Articulate 360 is sold as a bundled authoring-and-delivery subscription rather than a single-point
      tool. The suite combines Rise 360 for fast browser-based authoring, Storyline 360 for richer
      interactions, Review 360 for stakeholder feedback, Reach 360 for LMS-style distribution,
      Localization for multilingual rollouts, AI Assistant for embedded generation workflows, and
      Content Library 360 for ready-made assets. Articulate says the platform serves 125,000
      organizations, 133 million learners, every Fortune 100 company, and users in 187 countries,
      which indicates that the product is already operating at meaningful enterprise scale rather than
      as a niche authoring product.

      For a large L&D team, the practical workflow is straightforward: source material enters Rise or
      Storyline, AI Assistant accelerates drafting, Review gathers SME comments in context, Localization
      translates and routes validator review where needed, and Reach or LMS export handles distribution.
      Rise is the speed layer for responsive courses and SMEs, while Storyline remains the high-control
      layer for branching, variables, and simulation-heavy content. Content Library reduces blank-page
      friction with 20M+ assets, so the value proposition is the combined workflow, not any single
      module in isolation.

      The case-study record shows that buyers actually use the suite in that modular way. Questrade uses
      Rise for a 100+ course internal library while relying on Storyline for more complex software
      training. Forteorigen uses Rise, Storyline, Reach, and Review together and says Articulate sped up
      production and delivery by more than 50%. Tamr's customer-training program used Rise and Reach to
      expand enrollments by more than 30% while reducing LMS administration effort. Those examples matter
      because they show Articulate functioning as a workflow system rather than a single authoring app.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE037, CE038, CE039, CE040, CE042]
    tableRefs: [TE001, TE002]
    figureRefs: [FE002]

  - id: SE-architecture
    title: Architecture and Operating Model
    body: |
      Articulate runs a deliberately hybrid architecture. Rise 360 is fully cloud-based and browser
      delivered, which makes it easy to adopt across distributed teams and supports responsive output.
      Storyline 360 is the opposite: a Windows desktop application optimized for deep interactivity,
      animation timing, triggers, variables, and states. Review 360, Reach 360, and Localization are
      all SaaS services layered around those authoring surfaces, giving Articulate a shared cloud
      collaboration and delivery plane while preserving Storyline's native desktop authoring model.

      Interoperability is strong at the course-output layer. Storyline publishes SCORM, Tin Can API
      1.0, and AICC packages, while Reach adds built-in hosting, analytics, and enterprise controls such
      as SSO and bulk enrollment. G2's profile also lists 55 integrations, and Reach explicitly names
      Slack, Microsoft Teams, Zapier, and API-based connections, which is enough for most enterprise
      workflow automation even though Articulate does not present itself as a general-purpose developer
      platform. The public developer signal is correspondingly thin: there is no major open-source or
      package ecosystem, so the E-Learning Heroes community, review depth, and engineering hiring pages
      are the best public proxies for technical vitality.
    claimRefs: [CE006, CE021, CE022, CE029, CE030, CE031, CE033, CE034]
    tableRefs: [TE003]
    figureRefs: [FE001, FE003]

  - id: SE-ai-roadmap
    title: AI Features and Release Cadence
    body: |
      Articulate's AI strategy is notable because it is embedded into the existing authoring workflow
      instead of being sold as a separate add-on platform. Q1 2025 introduced AI Writer improvements and
      AI-generated assessment items, extending AI from drafting assistance into interactive question
      creation. Q2 2025 moved into narration and accessibility with AI text-to-speech, richer voice
      selection, and transcript generation. Q3 2025 expanded the scope again with AI Course Drafts,
      letting users generate course structure from prompts or source material, plus Custom Block and
      localization improvements.

      The cadence continued in Q4 2025 with text-to-speech translation and better Review collaboration,
      then in Q1 2026 with AI image editing in Storyline, Sync Timelines with Audio, AI-generated theme
      colors, localizable timelines, and custom-block localization. Customer proof mirrors that roadmap:
      Toro says AI Assistant now saves multiple hours per course and improves SME collaboration, while
      Forbes Travel Guide and Mondelēz both show Localization operating at real enterprise scale with
      large multilingual course libraries. This pattern matters because it shows regular product investment
      across authoring, media, localization, and accessibility rather than a one-off AI marketing launch.
      The tradeoff is roadmap opacity: the company clearly ships quarterly, but it does not publish a
      detailed forward-looking public roadmap beyond the releases already on the site, so future AI/LMS
      evolution remains a diligence ask rather than a disclosed commitment.
    claimRefs: [CE007, CE008, CE015, CE016, CE017, CE018, CE019, CE036, CE041, CE043]
    tableRefs: [TE005]
    figureRefs: []

  - id: SE-trust-compliance
    title: Trust, Security, and Compliance
    body: |
      Articulate has a stronger trust posture than many authoring-tool peers. Its trust center lists SOC
      2, ISO 27001, ISO 42001, and FedRAMP alongside a bridge letter, NIST 800-171 assessment,
      architecture diagram, SDLC policy, data hosting policy, and AI security/privacy materials. That is
      a meaningful signal for enterprise buyers evaluating an L&D platform that may hold employee
      training records, assessments, and localized content across regulated environments.

      The privacy model is also relatively clear. Articulate's privacy notice describes privacy by design
      and distinguishes between Articulate's processor role for customer-managed content and the customer
      organization's controller role under GDPR-style regimes. Accessibility is addressed through
      published Accessibility Conformance Reports for both Rise 360 and Storyline 360 tied to WCAG 2.1
      AA support statements. The Microsoft Localization case study adds a useful customer-proof layer:
      Microsoft's CSS organization reviewed Articulate's certifications and data handling before rollout,
      indicating that the company's trust documentation can clear a sophisticated enterprise diligence
      process.
    claimRefs: [CE011, CE012, CE013, CE014, CE028]
    tableRefs: [TE004]
    figureRefs: []

  - id: SE-differentiation
    title: Differentiation and Technology Risks
    body: |
      Articulate's moat is integration plus installed base. The suite spans rapid authoring, advanced
      desktop authoring, review, localization, delivery, AI assistance, and an asset library inside one
      commercial relationship. That is reinforced by the E-Learning Heroes community, high G2 standing,
      and a customer base large enough to make Storyline file formats and author familiarity sticky. In
      direct comparisons, Easygenerator is smaller and more SME-oriented, iSpring is more PowerPoint
      dependent, and Elucidat leans toward enterprise workflow control rather than Storyline-style depth
      of interactivity.

      The risks are mostly architectural and operational. Storyline's Windows-only client is a genuine
      constraint for Mac-heavy organizations. SoftwareAdvice reviewers also flag slow feature-request
      response, batch-conversion friction, and template-size limitations. Rise's cloud-native model is
      convenient, but it also means offline authoring is not clearly supported; Reach offers fast
      distribution for many use cases, yet it is not positioned as a full analytics-heavy enterprise LMS.
      AI adds another diligence angle: Articulate clearly ships practical generation features, but public
      terms do not fully clarify licensing and ownership scope for AI-generated media assets.
    claimRefs: [CE020, CE023, CE024, CE025, CE026, CE027, CE032, CE033, CE035]
    tableRefs: []
    figureRefs: [FE004]

