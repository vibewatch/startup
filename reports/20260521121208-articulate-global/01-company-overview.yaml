callouts:
  - calloutType: strength
    title: Exceptional bootstrapped track record and premium brand moat
    body: >-
      Articulate reached 125,000 organizational customers and all Fortune 100 before taking a single dollar of
      institutional capital. The 19-year bootstrap is evidence of genuine product-market fit and disciplined capital
      allocation. The E-Learning Heroes community (1.5M+ members) is a durable, low-cost flywheel that competitors
      cannot easily replicate.
    claimRefs:
      - CO003
      - CO006
      - CO008
      - CO014
      - CO039
  - calloutType: risk
    title: Private-company opacity and conflicting third-party financial data
    body: >-
      Revenue estimates across Latka ($111.7M) and Growjo ($89.1M) differ by more than $22 million for the same
      period. Headcount estimates range from 400 (TrueUp) to 633 (Latka). Audited financials and the cap table
      are not publicly available. Any underwriting model must treat all current financial figures as directional until
      primary data room access is granted.
    claimRefs:
      - CO030
      - CO031
      - CO032
      - CO033
  - calloutType: risk
    title: Key-person concentration in founder-CEO-Executive Chairman
    body: >-
      Adam Schwartz holds Founder, CEO, and Executive Chairman titles simultaneously. No public succession plan
      or co-founder structure exists. Board composition following the Series A has not been disclosed. For investors
      underwriting a $3.75–3.8B valuation, governance structure and succession planning are first-order diligence
      requirements.
    claimRefs:
      - CO013
      - CO014
      - CO020
      - CO040
