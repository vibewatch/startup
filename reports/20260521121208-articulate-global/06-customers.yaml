callouts:
  - calloutType: strength
    title: "125K Organizations and Fortune 100 Sweep"
    body: >-
      Articulate's 125,000-organization install base and all-100 Fortune 100 penetration are company-asserted
      but directionally reinforced by strong review-platform standing and breadth of named case studies across
      major verticals. That scale likely creates network effects through community familiarity and raises
      workflow switching costs for enterprise L&D teams.
    claimRefs: [CU001, CU002]

  - calloutType: risk
    title: "No Channel Network and Adverse Service Reviews"
    body: >-
      Articulate appears to sell primarily through a direct model with no publicly confirmed reseller network,
      while SoftwareAdvice contains at least one sharply negative customer-service review and a lower value-for-money
      sub-score. Together, those signals suggest concentration in direct renewals and a support-quality gap that
      could matter more in price-sensitive or under-served segments.
    claimRefs: [CU023, CU026, CU029]

