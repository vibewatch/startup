sections:
  - id: SU-segmentation
    title: Customer Base Segmentation
    body: |-
      Articulate sells primarily to learning-and-development teams inside enterprises and mid-market organizations,
      but the actual user and payer mix is broader than a simple software-seat sale. In most public examples, the
      buyer is a CHRO, VP of L&D, training leader, or instructional-design manager; the users are employees,
      customers, partners, or frontline caregivers consuming training; and the payer is a corporate HR, training,
      or IT budget. The visible vertical mix is wide: Intermountain Health represents healthcare, Microsoft and
      Databricks represent technology, Questrade and Berkadia represent financial and real-estate services,
      Mondelēz represents global CPG, Toro represents industrial distribution and manufacturing, Forbes Travel
      Guide represents hospitality, The Global Fund represents NGO/public-health deployment, and Forteorigen
      represents professional-services agencies. Articulate also exposes a Personal plan for freelance
      instructional designers while positioning Teams for organizational deployment. Combined with the company’s
      claim of 125,000 organizations and full Fortune 100 penetration, that mix implies a customer base anchored
      in enterprise and upper-mid-market L&D rather than small-business hobby usage.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU009, CU026, CU034]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: SU-adoption
    title: Adoption Trajectory and Scale Evidence
    body: |-
      Articulate publishes unusually large top-line customer metrics for a private learning-software vendor. As of
      May 2026, official surfaces say the platform serves 125,000 organizations, reaches 133 million learners,
      operates across 187 countries, has delivered more than 140 million lessons, and supported creation of more
      than 4 million courses in the last 12 months. The company’s G2-linked materials also point to a 1.5 million
      member E-Learning Heroes community, which matters because it expands the practitioner ecosystem around the
      product and likely reduces onboarding friction for new authors.

      Named customer proof suggests these are not vanity counts alone. Intermountain Health reports 1,000+ active
      Reach users tied to a 70,000-caregiver system; Toro cites 9,500 learners and 35% user-base growth; Mondelēz
      trained 30,000+ employees in a localization rollout; Databricks supports 30+ internal creators across an
      8,000+ employee company; and The Global Fund deploys training into 100+ countries. The caveat is that all of
      the aggregate top-line customer counts are company-claimed, with no independent audit of unique learners,
      paying organizations, or account activity levels.
    claimRefs: [CU001, CU002, CU006, CU007, CU008, CU012, CU013, CU015, CU016, CU019, CU025, CU032]
    tableRefs: [TU002]
    figureRefs: [FU002]

  - id: SU-named-proof
    title: Named Customer Proof
    body: |-
      Articulate’s customer-proof set is stronger than its retention disclosure. The company hosts eleven official
      case studies on articulate.com/resources/case-studies, spanning at least eight verticals and multiple product
      combinations including Rise, Storyline, Reach, Localization, Review, and AI Assistant. The named references
      are not anonymous logos: Microsoft, Mondelēz International, Intermountain Health, Databricks, Toro,
      Questrade, Berkadia, Forbes Travel Guide, The Global Fund, Tamr, and Forteorigen are all identified directly,
      and most include concrete outcome metrics rather than generic testimonials.

      The deployments read as production uses rather than pilots. Microsoft localized 200+ courses into five
      languages; Intermountain used Reach as a core LMS workflow; Toro has used Articulate since 2010; Databricks
      made Product Fundamentals mandatory for all hires; and Questrade built a 100+ course library. The limitations
      are equally important: all case studies are first-party, outcomes are self-reported, and Articulate’s own
      case-study framework includes a disclaimer that results may vary substantially by customer. Evidence freshness
      is still decent, though, with recent items for Berkadia, Mondelēz, Microsoft, and Intermountain supporting
      that the reference set is current rather than purely archival.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU033, CU034, CU035]
    tableRefs: [TU003]
    figureRefs: []

  - id: SU-retention
    title: Retention, Satisfaction, and Durability
    body: |-
      Public retention disclosure is materially thinner than public adoption disclosure. Articulate does not publish
      NRR, GRR, logo churn, renewal rates, contract length, or cohort behavior, so durability must be inferred from
      proxies rather than underwritten directly. Those proxies are directionally positive: Toro says it has used
      Articulate since 2010, Forteorigen reports a 10+ year relationship, and independent review platforms show large
      enough sample sizes to suggest sustained installed-base engagement rather than a thin review pool.

      Satisfaction evidence is generally strong but not uniformly clean. G2 and SoftwareAdvice both show 4.7/5
      overall scores at large review counts, while GetApp also reports 4.7/5 overall and 4.6/5 for customer support.
      TrustRadius contributes enterprise-oriented, multi-year usage testimony. The adverse signal comes from
      SoftwareAdvice, where value-for-money scores trail the overall average and at least one reviewer describes
      customer service as the worst around, while others cite batch-conversion limits and slow feature-request
      implementation. The practical read is high overall satisfaction with visible pockets of support and pricing
      dissatisfaction that could matter more in cost-sensitive cohorts.
    claimRefs: [CU007, CU008, CU020, CU021, CU022, CU023, CU024, CU025]
    tableRefs: [TU004]
    figureRefs: [FU003]

  - id: SU-expansion-risk
    title: Expansion, Concentration, and Channel Risks
    body: |-
      The most credible expansion pattern in Articulate’s customer base is land-and-expand inside existing accounts.
      Customers often begin with authoring, then add collaboration, delivery, or multilingual workflows as usage
      matures. Toro’s long-term account history and 35% user-base growth, Databricks’ expansion to 30+ creators,
      Intermountain’s move into Reach, and Microsoft, Mondelēz, and Forbes Travel Guide adopting Localization all
      point to increasing ACV through module expansion rather than single-product persistence. Articulate’s direct web
      distribution and Teams packaging likely make that motion operationally straightforward.

      The main risk is that the public record does not reveal how concentrated that expansion is. Articulate names
      impressive enterprise accounts and claims every Fortune 100 company as a customer, but it does not disclose
      whether those logos represent broad enterprise rollouts or narrow departmental footprints. No major reseller,
      distributor, or channel network is publicly confirmed, implying a direct-to-buyer go-to-market model. That can
      be efficient, but it also concentrates commercial execution risk in direct renewals and upsells while leaving
      top-customer revenue concentration opaque.
    claimRefs: [CU009, CU026, CU027, CU028, CU029, CU030, CU031, CU032, CU034, CU036]
    tableRefs: [TU005, TU006]
    figureRefs: []

