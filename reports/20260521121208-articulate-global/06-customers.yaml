company:
  name: Articulate Global
chapter:
  number: 6
  title: Customers
  summary: >-
    Articulate Global's customer evidence is strongest on breadth and named deployment proof: official pages
    claim 125,000 organizations, 133 million learners, every Fortune 100 company, and coverage across 187
    countries, while eleven first-party case studies show production use in healthcare, technology,
    financial services, manufacturing, hospitality, NGO/public-health, and professional-services settings.
    Independent review platforms broadly support satisfaction, but the main underwriting gaps are private-company
    omissions—no public NRR, GRR, churn, or customer-concentration disclosure, plus mixed signals on support quality.

