  topStrengths:
    - >-
      Large installed base and brand credibility: 125,000+ organizations, 133M+ learners, and all Fortune 100 companies
      cited by the company.
    - >-
      Workflow lock-in across Storyline, Rise, Review, Reach, and Localization creates more durable switching costs than
      a single-point authoring tool.
    - >-
      Strong enterprise trust and product proof, including SOC 2 / ISO / FedRAMP claims, high G2 rankings, and multiple
      named case studies with quantified ROI.
    - >-
      Continued quarterly AI, accessibility, and localization releases show active product investment rather than a
      one-time AI rebrand.
  topRisks:
    - >-
      The 2021 $3.75B valuation is stale and materially above a public-evidence 2026 range derived from current SaaS and
      learning-software comps.
    - >-
      Audited financials, gross margin, cash flow, NRR, and cap-table terms are not publicly disclosed, limiting
      confidence in revenue quality and downside protection.
    - >-
      AI-assisted content generation and adjacent workflow tools can commoditize parts of the authoring stack and
      pressure pricing over time.
    - >-
      Key-person concentration remains high because Adam Schwartz still combines founder, CEO, and executive-chair
      authority.
    - >-
      Corporate training budgets are cyclical and seat-based pricing can compress if enterprise buyers cut L&D headcount
      or negotiate harder on renewals.
  unresolvedGaps:
    - Audited 2024-2025 financial statements, including ARR bridge, gross margin, EBITDA, cash flow, and cash balance.
    - Current NRR, GRR, logo retention, and attach rates for Reach and Localization.
    - Any post-2021 409A, secondary tender pricing, or updated board-approved fair-value work.
    - Full cap table, liquidation preferences, and investor rights created by the 2021 financing.
    - Customer concentration, realized enterprise discounting, and cohort-level churn data.
