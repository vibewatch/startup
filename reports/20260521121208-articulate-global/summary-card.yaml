summary:
  headline: >-
    Articulate is a scaled, high-quality corporate learning platform, but the stale $3.75B 2021 mark and major
    disclosure gaps keep the investment case in research-more territory rather than buy territory.
  overallScore: 6.1
  recommendation: research-more
