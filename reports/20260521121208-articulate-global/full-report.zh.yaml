            title: 第三方收入数字未经审计——主要财务数据缺口
            body: >
              Articulate 的整套收入叙事（2024 年 $111.7M、增长 33%）建立在 GetLatka 估计和公司自报数据上——二者都没有经过独立审计。在 Articulate 提供经审计财务报表之前（通过
              IPO S-1、投资者数据室或监管文件），所有基于收入的估值和增长率都带有显著不确定性。这是最大的单一财务尽调阻碍。
            calloutType: risk
