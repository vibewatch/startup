    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Articulate Global, LLC 是一家软件公司，总部位于 244 5th Avenue, Suite 2960, New York, NY 10001。公司实行 100% 远程优先组织，自 2002
              年创立起就维持分布式团队——比远程办公成为主流早了近二十年。公司自己的隐私声明中出现的法律实体名是 Articulate Global, LLC，与面向消费者的品牌 Articulate
              区分开来。公司把使命表述为：借助可访问、高质量的职场学习技术，帮助人们过上更好的生活。

              核心产品是 Articulate 360，这是一套订阅制平台，把创作、协作、分发和翻译工具打包在一起。它包括用于响应式模块化课程创作的 Rise、用于定制交互内容创作的
              Storyline、用于利益相关方协作和反馈管理的 Review、作为集成轻量 LMS 的 Reach，以及用 AI 驱动、可翻译成 80+ 种语言的 Localize。截至 2026 年 5 月，Teams
              计划公开价格为每用户每年 $1,749，Personal 计划为每用户每年 $1,449，使产品处于学习创作工具的高端 SaaS 档位。无需信用卡的 30
              天免费试用降低了获客摩擦。社区网络效应继续加固产品：E-Learning Heroes Community 已增长到超过 1.5M 名成员，既是支持渠道，也是低成本获客渠道。

              按公司最新官方口径，Articulate 服务超过 125,000 家组织，在 187 个国家触达 133M 名学习者，并拥有所有 100 家 Fortune 100 公司客户。基于 2025
              日历年经验证客户评价，G2 在 2026 Best Software Awards 中把 Articulate 评为企业软件第一名；在 G2 Winter 2026 Report 中，Articulate 360
              在全球 180,000 个产品中排名第九，得分 97.29/100。AI Assistant 已集成到 Rise 和 Storyline，宣称相比手工工作流，课程创作速度最高可提升 9 倍。
