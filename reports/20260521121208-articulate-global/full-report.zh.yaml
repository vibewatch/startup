figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Articulate 的公开轨迹包括 19 年自力更生、2021 年标志性融资，以及持续产品创新周期；第三方收入口径不一致，是最大的未解反向项。
    data:
      items:
        - date: '2002'
          label: 成立；从第一天起远程优先
          detail: Adam Schwartz 在纽约创立 Articulate Global；没有机构资本；成立之初就是全分布式团队。
          tone: positive
        - date: ~2012
          label: Storyline 发布
          detail: 定制化交互创作工具成为 L&D 行业复杂课程制作标准。
          tone: positive
        - date: ~2019
          label: Rise.com 发布
          detail: 区块式响应式创作把平台扩展到更简单、更快速的课程制作，非专业人员也能使用。
          tone: positive
        - date: 2021-08
          label: $1.5B Series A，估值 ~$3.75–3.8B
          detail: General Atlantic 领投；Blackstone Growth 和 ICONIQ Growth 共同投资。经历 19 年自力更生后首次引入机构资本。
          tone: positive
        - date: '2021'
          label: E-Learning Heroes 社区成员超过 100 万
          detail: 自然社区达到规模，可作为免费获客和留存渠道。
          tone: positive
        - date: '2022'
          label: 获得 FedRAMP 授权
          detail: 监管里程碑使其可直接销售给美国联邦政府机构。
          tone: positive
        - date: '2023'
          label: 收入 $84.2M（第三方，Latka）
          detail: 第三方未经审计估计；隐含较 2021 年 $29.4M 增长 186%。
          tone: neutral
        - date: '2024'
          label: 收入 $111.7M（Latka） vs $89.1M（Growjo）——估计冲突
          detail: 第三方来源差异重大；两项数字均未经审计；该区间就是尽调索取项。
          tone: warning
        - date: '2025'
          label: 全平台集成 AI（AI Course Drafts；AI Chat；AI Image）
          detail: 截至 2025 年的季度发布把生成式 AI 深度嵌入 Rise 和 Storyline。
          tone: positive
        - date: 2026-Q1
          label: G2
          detail: 在全球最大软件评测平台上获评全球最佳企业软件；得分 97.29/100。
          tone: positive
