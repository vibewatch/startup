      - number: '5.4'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >
              与许多创作工具同业相比，Articulate 的信任姿态更强。其信任中心列出 SOC 2、ISO 27001、ISO 42001 和 FedRAMP，同时提供桥接函、NIST 800-171
              评估、架构图、SDLC 政策、数据托管政策，以及 AI 安全 / 隐私材料。企业买方评估 L&D 平台时，这些是有意义信号，因为平台可能在受监管环境中保存员工培训记录、评估和本地化内容。


              隐私模型也相对清晰。Articulate 的隐私通知描述了隐私设计原则，并区分 Articulate 对客户管理内容的处理者角色，以及客户组织在 GDPR 式制度下的控制者角色。无障碍方面，公司发布 Rise
              360 和 Storyline 360 的无障碍合规报告，并与 WCAG 2.1 AA 支持声明绑定。Microsoft Localization 案例研究补上了一层有用的客户证据：Microsoft 的 CSS
              组织在上线前审查了 Articulate 的认证和数据处理方式，说明公司的信任文件能通过成熟企业的尽调流程。
            claimRefs:
