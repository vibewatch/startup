      - number: '2.2'
        title: TAM、SAM 与市场规模证据
        blocks:
          - type: paragraph
            body: >-
              已发布的规模证据在不同来源之间明显不一致。两份分析师报告名义上覆盖同一年（2025）的同一产品品类，却给出 $807.7M（Global Growth Insights）和 $8,900.75M（Future
              Market Report）两个估计。至少其中一个估计是错的，或者使用了不可比的边界定义。Research and Markets 提供第三个数据点（仅有目录——抓取中未拿到数值估计），对应一份覆盖
              2020–2035 年的 “E-learning Authoring Tools Market” 报告。Global Growth Insights 和 Future Market Report
              都没有披露其一手研究方法、样本框或收入归因规则，因此无法用公开来源完成调和。

              可以用公开可比公司交叉检查相邻 LMS 赛道：Docebo（LMS，不是创作）报告 TTM 收入 $230M（2025）；Udemy（内容市场加创作相邻）TTM
              $790M（2025）；Skillsoft（企业学习套件）TTM $510M（下滑中）。这些平台更宽，包含服务、内容和交付，因此会高估纯创作软件 TAM，但能框住 Articulate
              的竞争空间。Articulate 隐含收入 $89–$112M（第三方估计）意味着它大约占窄口径创作工具市场的 10–14%，占更广 e-learning 软件 TAM 的比例低于 2%。

              SAM——拥有 100+ 名员工、专门 L&D 职能和 LMS 驱动数字培训工作流的组织——无法直接从公开来源估计，但可以推断：Global Growth Insights 报告称，63%
              的公司使用创作工具做内部培训，北美占创作工具市场份额的 38%。Articulate 披露的 125,000 家客户组织遍布 187 个国家，说明全球渗透有一定规模；但 Fortune 500
              企业账户集中度（公司称所有 Fortune 100 都是客户）意味着 SOM 更偏向按 $1,749/user/year 价格点付费的大型企业。
            claimRefs:
              - CM006
