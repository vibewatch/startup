      - number: '1.2'
        title: 治理、领导层与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Articulate 由 Adam Schwartz 掌舵，他同时担任 Founder、CEO 和 Executive
              Chairman——这套配置把产品愿景、对外代表和董事会层面的权力集中到一个人手里。Schwartz 从 2002 年创立起一直自举经营公司，直到 2021 年 Series A 前都没有机构融资；Series
              A 公告、General Atlantic
              评论和多家第三方数据源都印证了这一点。这段历史既是信誉信号——在竞争激烈的品类里长期自我造血——也是依赖风险，因为关键增长年份里，没有公开的联合创始人或机构搭档一起牵引战略。

              官方 about 页面列出的领导团队在职能覆盖上较完整。Lucy Suros 担任 Vice Chair，早前报道中曾被称为 President。Edwin Scholte 同时担任 President 和
              CFO，把运营与财务监督合并在一名高管身上；这种双重角色值得标记为治理集中。其他 C-suite 成员包括 Brian Gil（COO）、Angela Kiniry（Chief People and
              Culture Officer）、Tom Kuhlmann（Chief Learning Architect——对一家学习工具公司而言少见但与产品高度相关）、James Welle（CTO）、Marie
              Ma（Chief Legal Officer）和 Monika Saha（Chief Commercial Officer）。Trevor Renfield 担任 SVP Finance 和 Chief
              Accounting Officer。

              Articulate 不公开董事会构成。三家 Series A 投资方——General Atlantic、Blackstone Growth 和 ICONIQ Growth——通常会在 $1.5B
              成长股权轮后获得董事席位，但已抓取来源中没有任何确认。Schwartz 的关键人依赖仍是重大尽调项：公司没有公开描述接班路径或 co-CEO 安排，而 CEO-Executive Chairman
              合一使他同时掌握运营和治理权。
