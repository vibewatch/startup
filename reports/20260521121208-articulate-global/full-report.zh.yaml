            title: 规模下收入交付效率异常高
            body: >
              $111.7M 收入只对应 633 名员工（每名员工收入 $176K）和 53 名带配额销售代表（每名代表收入 $2.1M），明显高于中端市场 SaaS
              平均水平。这种效率符合以留存优先、社区飞轮驱动的模式：高切换成本压低了由流失驱动的销售开销。如果经审计数据能够确认，这种效率将支撑估值溢价。
