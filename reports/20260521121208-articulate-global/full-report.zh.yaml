      - number: '7.3'
        title: 监管、隐私与无障碍暴露
        blocks:
          - type: paragraph
            body: >
              Articulate 覆盖 187 个国家，并大规模处理学习者和管理员数据，形成很大的监管暴露面。其隐私通知确认收集使用数据、设备标识符、cookies
              和遥测数据；与第三方营销合作伙伴和子处理商共享数据；并从数据丰富供应商购买商业联系信息。最后一项做法会带来潜在 CCPA 和 GDPR
              执法风险，因为购买的第三方联系数据需要有记录的法律依据和退出机制，而这些机制跨数据经纪商可能很难验证。Articulate 的 GDPR 合规建立在自披露的隐私内建要求和 Data Processing
              Agreement 上，但没有公开披露第三方 GDPR 审计。公司还集成 Google reCAPTCHA Enterprise，并根据 Google 自身隐私政策与 Google
              共享设备和行为数据，把数据共享暴露面延伸到 Articulate 直接控制之外。监管认证方面，Articulate 持有 SOC 2、ISO 和 FedRAMP 授权；FedRAMP
              支持美国联邦政府客户，但具体授权级别（Moderate 或 High）没有公开记录，限制了验证政府访问范围的能力。ADA / WCAG 方面，更广泛 SaaS 市场仅在 2026 年 4 月就出现 478 起
              ADA 数字无障碍诉讼，其中 103 名被告曾有既往诉讼。Articulate 发布了针对 Rise（2025 年 9 月）和 Storyline（2025 年 8 月）的无障碍合规报告，目标是 WCAG 2.1
              AA，并在 2025 年 Q2 为 Storyline 添加 Accessibility Checker。主动无障碍工具和认证组合降低了诉讼风险；但如果客户通过 Articulate 平台交付的自制内容不符合
              WCAG 要求，风险并未消失。
