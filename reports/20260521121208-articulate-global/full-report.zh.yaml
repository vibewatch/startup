      - number: '5.3'
        title: AI 功能与发布节奏
        blocks:
          - type: paragraph
            body: >
              Articulate 的 AI 策略值得注意：它把 AI 嵌入现有创作工作流，而不是作为单独附加平台出售。2025 年 Q1 推出 AI Writer 改进和 AI 生成评估题目，把 AI
              从写作辅助延伸到互动题目创建。2025 年 Q2 进入旁白和无障碍场景，加入 AI 文本转语音、更丰富的语音选择和转录生成。2025 年 Q3 继续扩大范围，推出 AI Course
              Drafts，让用户从提示词或源材料生成课程结构，并改进 Custom Block 与本地化。


              这一节奏在 2025 年 Q4 延续到文本转语音翻译和更好的 Review 协作，随后在 2026 年 Q1 推出 Storyline 中的 AI 图片编辑、Sync Timelines with
              Audio、AI 生成主题色、可本地化时间线和 Custom Block 本地化。客户证据也贴合这条路线图：Toro 称 AI Assistant 现在每门课程节省数小时，并改善 SME 协作；Forbes
              Travel Guide 和 Mondelēz 都显示 Localization 已在大型多语言课程库中以真实企业规模运行。这一模式重要，因为它说明公司在创作、媒体、本地化和无障碍上持续投入产品，而不是一次性的
              AI 营销发布。代价是路线图不透明：公司显然按季度发版，但除网站已发布功能外，不公布详细前瞻性公开路线图，因此未来 AI / LMS 演进仍是尽调问题，而不是已披露承诺。
