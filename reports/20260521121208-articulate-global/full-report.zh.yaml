      - number: '1.4'
        title: 规模里程碑、产品动能与反向记录
        blocks:
          - type: paragraph
            body: >-
              Articulate 的公开记录能串出一条清晰时间线：从创立，到 2021 年资本事件，再到持续产品迭代。公司 2002 年创立时就采用完全远程团队模式，在机构融资前积累了 19 年有机增长记录。第三方来源
              Latka 追踪收入从 2021 年 $29.4M 增至 2023 年 $84.2M 和 2024 年 $111.7M——未经审计口径下，三年约增长 3.8 倍。Growjo 的冲突估计则把收入放在约
              $89.1M，使 2024 年数字存在 $22M 不确定区间；对财务模型而言，这一冲突重要，也是任何基金做一手尽调时的首要问题。

              第三方来源之间的员工数差异同样明显：Latka 报 633 名员工（2025 年 11 月），Growjo 报 509，TrueUp 报约 400。估计值之间约 1.6
              倍差距说明这些数字都不是来自经审计薪酬数据。在用内部 HR 记录核实前，所有数字都应作为方向性指标，而不是确定员工数。公司的 Glassdoor 和文化信号为正面——Inc. Magazine 将
              Articulate 列入 Best Workplaces 2024——但文化奖项不能替代运营数据室访问。

              产品动能方面，2025 年至 2026 年 Q1 的季度功能发布显示 AI 持续集成（Magic Import、AI Course Drafts、AI Image Generation、AI
              Chat）、可访问性改进（Likert Scale Accessibility、equation editor）和本地化增强（Custom Block Localization、Text-to-Speech
              Translation）。信任认证包括 SOC 2、ISO、FedRAMP 和 GDPR。FedRAMP
              认证是企业和政府销售的重要助推器。研究缓存中未发现公开诉讼、制裁、监管令或重大治理事件；但公司私营结构降低了披露义务，所以没有证据并不等于不存在问题。
