      - number: '1.3'
        title: 资本基础与投资者图谱
        blocks:
          - type: paragraph
            body: >-
              Articulate 于 2021 年 8 月完成 $1.5B Series A；多个来源都一致称其为软件公司史上最大 Series A 之一。该轮由 General Atlantic 领投，Blackstone
              Growth 和 ICONIQ Growth 共同参与。American Entrepreneurship 报道投后估值为 $3.75B；Latka、Growjo、Tracxn 和 TrueUp 分别报
              $3.8B——这点差异（$3.75B vs $3.8B）很可能只是四舍五入。Latka 估计交易中约 40% 股权被出售，意味着稀释幅度显著，而非小额少数股权安排。

              融资背景很特殊：Articulate 在 2021 年融资前自举约十九年，没有机构资本。General Atlantic 联席总裁兼全球技术投资主管 Anton Levy
              曾表示：“一家公司在没有任何机构资本支持的情况下取得 Articulate 这样的成功程度，非常罕见。无论是行业领导力、变革性技术、客户 NPS、员工幸福度，还是持续增长等关键指标，Articulate
              都已经确立了领导者和创新者地位。” Adam Schwartz 表示，公司选择这些投资者，是看重其“综合优势，包括深厚的运营专长、帮助云端 SaaS 公司成长的成熟经验，以及可帮助我们快速扩张的广泛资源网络。”

              General Atlantic、Blackstone Growth 和 ICONIQ Growth 都是顶级成长股权机构。General Atlantic 在全球管理超过 $70B 资产，并拥有大量 SaaS
              组合公司经验。Blackstone Growth 是全球最大另类资产管理人的成长股权平台。ICONIQ Growth 以全球最富有的个人和机构出资投资科技公司。2021 年 Series A
              之后，已抓取来源没有显示任何追加融资，累计融资额因此为 $1.5B。
