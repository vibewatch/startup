      - number: '3.2'
        title: 直接创作竞争对手
        blocks:
          - type: paragraph
            body: >
              iSpring Suite 是专业教学设计创作市场中最接近的同类竞争对手。它运行在 Microsoft PowerPoint 内，宣称拥有 60,000+ 团队，起价 $970/user/year（低于
              Articulate 的 $1,449–$1,749 区间），并被 eLearning Industry 评为 2025 年最佳创作工具。PowerPoint 原生架构降低了技术门槛，但限制了专业教学设计师在
              Storyline 中使用的复杂时间线、分支和变量逻辑。iSpring 的 AI 功能（AI 文本转语音、AI 翻译、从材料生成 AI 课程）与 Articulate 的 AI Assistant
              直接平行。iSpring 还提供 LMS 附加产品（iSpring Learn），进一步提高了可替代性。

              Adobe Captivate 以软件模拟和 VR/360 场景竞争——这些用例里，Storyline 的固定布局方法反而处于劣势。Captivate 月付价格约 $33.99/user/month（约
              $408/user/year），按用户算显著便宜于 Articulate，但历史上在易用性上被评价者打分更低。Captivate 受益于 Adobe Creative Cloud 生态引力（Firefly
              图像生成、与 Premiere/Illustrator 集成）和 Adobe 的企业关系，但学习曲线更陡，限制了 SME 采用。SelectHub 在其创作工具指数中把 Articulate Storyline
              排名第三、Captivate 列为相邻，并在该比较中把 Articulate 定价列为每用户每年 $1,149。

              Easygenerator 瞄准“SME 即作者”的用例：2,000+ 家公司里的 50,000+ 名作者无需 L&D 专业能力即可创建内容。它的 AI 辅导、视频创作和本地化套件（75 种语言）在广度上可与
              Articulate 比较，但缺少高级交互引擎（分支场景、变量触发器），而这正是 Storyline 对企业合规和模拟场景不可或缺的原因。按 eLearning 行业追踪，Easygenerator 已被
              Spekit 收购，这可能影响其战略方向。其价格起于 $116/user/month（约 $1,392/user/year），略低于 Articulate 的 AI-tier Teams 价格。

              Elucidat 面向管理高产量、品牌化生产工作流的大型 L&D 团队。差异点是集中式资产治理、实时团队协作和企业品牌控制——Articulate 生态中的 Rise 360 部分复制了这些功能。Elucidat
              不公布价格（定制报价）。dominKnow ONE 强调一次创作、多格式输出（培训内容、绩效支持、移动端岗位辅助），凭美国联邦承包商注册资质竞争，并支持 Fortune 500
              客户。Lectora/Trivantis（Growjo 估计约 $11.6M）是最老牌的竞争对手，在 Section 508 可访问性优先工作流以及 SCORM 重度的政府 /
              受监管行业部署中保留了小众阵地。TechSmith Camtasia 专门以屏幕录制和视频培训竞争，具备 AI avatar 和文本转语音能力，与 Articulate 的 Peek 360 和 Replay
              360 产品有重叠，但缺少 Rise/Storyline 式多模块架构。
