            - GDPR 合规姿态
            - 无障碍报告
          detail: 企业信任控制与隐私 / 无障碍文档，支撑完整的创作—交付工作流。
  - id: FE002
    title: 客户工作流 / 运营流
    type: flow
    layout: wide
    summary: 典型企业工作流：从源内容进入 AI 辅助创作、评审、本地化、分发，再到学员追踪。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
    data:
      nodes:
        - id: N1
          label: 内容输入
          detail: 作者从文档、幻灯片或源材料开始，在 Rise、Storyline 或 AI Course Drafts 中创作。
        - id: N2
          label: AI 辅助创作
          detail: AI Assistant 帮助生成大纲、内容块、问题、旁白、字幕、图像和草稿。
        - id: N3
          label: 课程评审
          detail: Review 360 在上下文中收集 SME 和利益相关方评论，不要求评审者订阅。
        - id: N4
          label: 本地化（可选）
          detail: Localization 将课程翻译成 80+ 种语言，并在发布前走验证者评审。
        - id: N5
          label: 分发
          detail: 发布到 Reach 360，或向外部 LMS 导出基于标准的包。
        - id: N6
          label: 学员访问与追踪
          detail: 学员在任意设备上完成培训，管理员通过 Reach 仪表盘或外部 LMS 分析监控。
      edges:
        - from: N1
          to: N2
          label: 起草
        - from: N2
          to: N3
          label: 评审
        - from: N3
          to: N4
          label: 按需翻译
        - from: N4
          to: N5
          label: 发布本地化版本
        - from: N3
          to: N5
          label: 发布原始版本
        - from: N5
          to: N6
          label: 交付
  - id: FE003
    title: 关键依赖地图
    type: dag
    layout: wide
    summary: Articulate 平台依赖云运行时、Storyline 的 Windows 桌面执行环境、企业身份系统、翻译服务和内容交付基础设施。
    claimRefs:
      - CE006
      - CE007
      - CE022
      - CE029
      - CE030
      - CE033
    data:
      nodes:
        - id: D1
          label: Articulate 360 平台
          type: output
        - id: D2
          label: 云基础设施
          type: dependency
        - id: D3
          label: 浏览器运行时
          type: dependency
        - id: D4
          label: Windows 桌面运行时
          type: dependency
        - id: D5
          label: SSO / 身份提供商
          type: dependency
        - id: D6
          label: 翻译 / AI 服务
          type: dependency
        - id: D7
          label: Slack / Teams / Zapier
          type: dependency
        - id: D8
          label: 外部 LMS（可选）
          type: dependency
        - id: D9
          label: Content Library 交付
          type: dependency
      edges:
        - from: D2
          to: D1
          label: 托管 SaaS 服务
        - from: D3
          to: D1
          label: Rise / Review / Reach 必需
        - from: D4
          to: D1
          label: Storyline 创作必需
        - from: D5
