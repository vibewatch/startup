      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              情景分析把估值重置具体化。以 2024 年 ARR $111.7M 为锚，悲观情景采用 4x 倍数，落在约 $446.8M。该结果假设明显放缓、留存疲弱，或市场把 Articulate
              视作成熟创作套件，而不是高端工作流平台。基准情景采用 7x ARR，落在约 $781.9M。该情景假设 Articulate 继续保持 20%-30% 增长，本地化和 AI
              客户证据转化为健康扩张，并且即使没有公开市场流动性，公司仍对买方有吸引力。乐观情景采用 12x ARR，达到约 $1.34B。该结果要求管理层证明 Articulate 值得 AI
              溢价倍数，而不只是品类溢价倍数。

              这些情景在一个方面刻意保守，在另一个方面又偏慷慨。保守之处在于，它们锚定已披露 2024 年 ARR，而不是管理层内部的 2025 或 2026
              年运行率。慷慨之处在于，即便乐观情景也假设买方会为品牌、工作流锁定和客户结果支付高于主流 SaaS 中位数的价格。两者组合成一个有用的投资测试：如果公司不能用私有尽调通过基准情景，2021
              年估值很可能高得过头；如果公司拿不出与乐观情景一致的证据，投资人就不应按 2021 年溢价仍然成立来给业务定价。

              关键实际结论是，即便低于 2021 年标记，每个情景仍把 Articulate
              视为有价值、有战略相关性的软件资产。问题不是生存。问题是，今天的投资人是在承保一个防御充分的溢价，还是只是在继承五年前的周期高点。基于当前公开证据，基准情景是最可信的锚点。
            claimRefs:
              - CV027
              - CV028
              - CV029
