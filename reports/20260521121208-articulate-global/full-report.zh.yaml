  - id: FM004
    title: 采用漏斗 / 价值链地图
    type: funnel
    layout: standard
    summary: Articulate 360 的企业采用漏斗从认知到续约分为四个阶段。主要流失风险出现在集成（LMS 兼容摩擦）和续约（中端市场价格敏感）。该漏斗反映 $1,749/user/year 价位下典型企业 SaaS 采购路径。
    data:
      items:
        - label: 认知与发现
          value: 100
          note: >-
            发现路径：E-Learning Heroes 社区（1.5M+ 成员）；G2（180K 产品中第 9；97.29/100）；eLearning Industry 榜单；口碑传播。63%
            的公司报告使用创作工具，因此多数会在某个阶段评估 Articulate。
        - label: 试用与评估（30 天免费试用）
          value: 65
          note: Articulate 360 提供 30 天免费试用。SMB 会在试用结束时因价格冲击流失；Storyline 高级功能也会造成流失，49% 的首次用户报告使用困难。
        - label: 采购与签约
          value: 40
          note: 企业采购需要 IT 安全审查（SOC 2；ISO；政府场景需 FedRAMP）、供应商风险评估以及多席位合同谈判。中端市场常在这里转向更低成本替代品。
        - label: LMS 集成与上线
          value: 30
          note: >-
            39% 的组织遇到 LMS 集成挑战。Articulate 发布 SCORM/xAPI/cmi5 导出；与旧版 LMS（Cornerstone；SAP SuccessFactors）兼容需要 IT
            资源。价值实现时间是关键上线指标。
        - label: 活跃使用与席位扩张
          value: 25
          note: Databricks 模式：跨部门 30+ 名员工担任作者。扩张是关键收入驱动。企业席位扩张是这一价格层级 SaaS 的主要增长动作。
        - label: 续约与留存
          value: 20
          note: 雇主投资培训时，94% 的员工会留得更久——这带来组织粘性。企业留存因内容锁定（既有 SCORM 库）而结构性较高。中端市场续约时受预算压力影响，流失风险更高。
    claimRefs:
      - CM009
      - CM018
      - CM022
      - CM023
      - CM025
      - CM027
    approximationNotes: >-
      漏斗阶段值是相对指数分数（100 = 完整认知池），不是实际交易数。Articulate 不披露漏斗转化率；这些数值由行业基准（SaaS 企业转化率 1–5%、试用转付费率）和案例研究证据推断。SMB
      漏斗在试用转付费阶段会出现更陡的流失。
