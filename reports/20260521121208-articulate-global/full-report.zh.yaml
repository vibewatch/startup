          - type: callout
            title: 2021 年 34x 收入估值存在倍数压缩风险
            body: >
              2021 年定下的 $3.8B 估值，按当时收入运行率约为 34x。经历修正后，截至 2026 年 5 月，SaaS 倍数为上市公司中位数 6–7x，高增长且集成 AI 的 SaaS 为
              7–12x。按当前收入，在 2026 年倍数下 Articulate 的隐含合理价值区间（基准情景 $782M–$1.3B）明显低于 2021 年融资价格——这可能给 2021
              年投资人带来按市值重估减值，并推迟或压低 IPO 定价。
