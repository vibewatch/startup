        - label: 悲观
          low: 400
          high: 560
        - label: 基准
          low: 670
          high: 780
        - label: 乐观
          low: 1100
          high: 1400
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: KPI 仪表盘突出增长、倍数压缩和投资建议取向，供投资委员会审阅。
    data:
      items:
