  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Articulate
              位于两个嵌套市场的交汇处：一是在线学习创作工具软件细分市场，公司在其中是品类龙头；二是更广义的企业学习与发展（L&D）市场，它构成主要买方池。边界定义对分析至关重要，因为第三方对“创作工具”市场的估计从
              $807.7M（Global Growth Insights，2025）到 $8.9B（Future Market Report，2025）不等——相差 11
              倍，反映的是范围定义根本不同，而不是对同一市场的不同看法。

              较窄定义（Global Growth Insights）覆盖专用课程创作软件：用于创建、组装和发布数字学习内容的工具，通常符合 SCORM/xAPI，并通过 LMS 交付。Articulate
              360（Storyline、Rise、Review、Reach、Localization）正好落在这一范围内。较宽定义（Future Market Report）把创作软件与相邻的 eLearning
              服务、LMS 平台、内容库和专业服务汇总在一起——这是一个大得多的可寻址池，Articulate 只触达其中的软件层。

              从估值和测算出发，一个可辩护的方法是把纯创作工具 TAM 放在约 $800M–$1B（2025），CAGR 为 7–9%；同时把可寻址的企业 L&D 软件支出——现实中可能用 Articulate 替代其他创作或
              LMS 产品的组织集合——放在 $5–10B。全球企业培训市场整体更大（$367–$434B），但 Articulate 只瞄准其中的技术层，而不是人力或服务部分。
