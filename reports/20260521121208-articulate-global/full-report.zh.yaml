      - number: '8.6'
        title: 投资前最后一轮尽调问题
        blocks:
          - type: paragraph
            body: >-
              剩下的尽调问题不是形式检查，而是决定 Articulate 应落在基准情景、乐观情景，还是低于两者。第一，投资人需要 2024 年和 2025 年经审计财务，包括 ARR
              变动桥、毛利率、EBITDA、经营现金流和现金余额。第三方收入估计可以用来交叉校验，但不能作为后期估值决策的可投资基础。第二，管理层必须披露留存质量：净留存率（NRR）、总留存率（GRR）、客户数留存、队列扩张，以及
              Localization、Reach 等产品的附加率数据。这些指标决定 Articulate 真的配得上溢价倍数，还是只是收入增长看起来好。

              第三，投资人需要最新股权结构表和定价证据：2021 年以来完成的任何 409A、老股要约或董事会估值工作，以及清算优先权和投资人权利。没有这些输入，就无法建模真实入场经济性或下行保护。第四，2021
              年融资后的资本使用必须解释清楚。如果公司资产负债表仍有充足弹性，选择权就更大；如果现金已经消耗殆尽，未来融资事件带来的下行风险就更高。第五，管理层应给出融资和退出计划，把经营里程碑接到一条 2-4 年路径上，通向
              IPO 准备、老股流动性或战略出售。

              这些问题正说明为什么建议是继续研究，而不是放弃。公开材料已经足够强，值得继续深挖；但公开论证还不完整，无法完成投资决策。尽调拿到这些数据之前，Articulate 应被视为一家高质量公司，但价格尚未充分验证。
            claimRefs:
              - CV042
              - CV043
              - CV044
              - CV045
