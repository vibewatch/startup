  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Articulate 所在的是 e-learning 创作软件细分市场，这是企业 L&D 中介于纯 LMS
              交付平台与定制开发机构之间的一角。竞争图谱可分成四档：（1）直接创作竞争对手，争夺同一个教学设计师席位；（2）简化创作新进入者，瞄准主题专家（SME）而非专业教学设计师；（3）相邻的 LMS
              和数字化采用平台（DAP），可替代 Articulate 价值链中的部分环节；（4）从生产力和生成式 AI 栈中冒出的 AI 原生工具，威胁把基础课程创作商品化。

              在直接创作档，iSpring Suite（60,000+ 团队、PowerPoint 原生）、Adobe Captivate（Creative Cloud 生态一部分）、Easygenerator（2,000+
              家公司中的 50,000+ 作者、SME 导向）、Elucidat（企业级、团队中心）、dominKnow ONE（集中式工作流、美国联邦承包商）和 Lectora/Trivantis（估计收入约
              $11.6M、聚焦 Section 508）是最相关的具名对手。TechSmith Camtasia 是基于视频的培训相邻工具，在屏幕模拟用例上有重叠，但缺少多模块课程架构。没有一家能匹配 Articulate
              的广度——Storyline + Rise + Review + Reach + Content Library + AI Assistant 打包在一个订阅里——也没有它的社区飞轮。

              Growjo 的竞争表把 Articulate 按收入最接近的创作同业估计为 Captivate（约 $57.8M）、Easygenerator（约 $35.4M）和 IMC AG（约
              $90.8M，范围更宽）。这些都是第三方聚合器估计，不确定性很高；没有任何竞争对手披露经审计收入。按 Latka 报告的 2024 年收入 $111.7M，Articulate
              似乎以明显优势领先创作工具细分市场。
