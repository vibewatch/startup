      - number: '7.5'
        title: 治理、披露不透明与执行风险
        blocks:
          - type: paragraph
            body: >
              Articulate 的私人公司身份意味着，投资判断几乎完全建立在公司控制的信息发布、第三方估计和客户案例研究上，而不是经审计 SEC 或 GAAP 文件。Latka（2024 年 ARR
              $111.7M）、Growjo（$89.1M）和 Trueup（估值 $3.8B）的收入数字彼此分歧，说明依赖私人数据聚合器自带估计风险。所有客户指标——125K 个组织、1.33 亿学习者、187
              个国家——都是公司陈述且未经审计。这样的披露画像在 Articulate 管理层与外部投资人之间制造系统性信息不对称。治理方面，Adam Schwartz 同时担任创始人、CEO
              和执行董事长，形成关键人集中；董事会构成和少数股东保护未披露。A 轮后，公司大幅重建管理团队（新增总裁 / CFO、COO、CPO、首席法务官），带来整合和文化凝聚风险。员工数从 2021 年 1 月约 349
              人增至 2025 年末约 633 人；快速远程优先扩张会稀释管理注意力和产品质量。估值方面，2021 年 7 月确定的 $3.75B 标记意味着约 33.6x 2024 ARR，而同期上市 SaaS
              EV/Revenue 倍数已压缩至 6–7x，非 AI 私人 SaaS 交易则在 4–8x ARR 清算。没有二级市场标记、要约收购或 IPO 准备披露，2021
              年估值成了唯一可用锚点，且没有独立确认其当前有效性。
