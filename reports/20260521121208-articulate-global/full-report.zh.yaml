      - number: '3.3'
        title: 相邻替代品与 LMS/DAP 重叠
        blocks:
          - type: paragraph
            body: >
              两类替代品从相邻角度威胁 Articulate，但并非正面对抗的创作竞争者。Docebo（TSX: DCBO）是云 LMS，2024 年收入 $210M，并具备 AI 原生内容创作（Docebo
              Creator）。入门价格为 $9/user，最低 250 用户。Docebo 占据学习管理与交付层；如果买方标准化使用 Docebo 内置内容创作和市场（约 30,000 门课程），就没那么需要再单独购买
              Articulate 360 创作订阅。不过，Docebo 没有复制 Storyline 的交互引擎或 Rise 的创作速度——Articulate 把自身平台定位为可补充任何 LMS，包括 Docebo。

              Whatfix 是数字化采用平台（DAP），在分析师比较列表中会作为 Storyline 竞争对手出现。DAP（包括
              Whatfix、WalkMe、Pendo）在任务执行点提供应用内引导叠层和工作流支持，这与基于课程的学习是不同的任务场景。不过，企业采购团队有时会把 DAP 与 Articulate
              放在一起比较，用于员工入职、软件培训和合规用例——尤其当业务更看重实时应用内引导，而不是按席位完成课程时。Whatfix 明确围绕 Articulate 的 Storyline
              局限来营销：内容维护负担高、无法交付培训后的应用内引导、语言管理需要手工重新录制，以及屏幕与引导集成中的敏感数据挑战。Whatfix 的 G2 评分为 4.6/5（367+ 条评价）。

              6sense 数据显示，在 Other Education Tech 类别中，Canvas LMS 市占率 8.17%，其后是 Finalsite（6.32%）和 Articulate
              Storyline（6.09%），说明 Articulate 竞争的是一个宽泛、碎片化市场，而不是一个按份额由它主导的品类。不过，社区和分发优势无法从域名数量指标中体现。
            claimRefs:
              - CP016
              - CP017
