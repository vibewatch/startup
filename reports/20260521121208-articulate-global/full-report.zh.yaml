    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在悲观、基准和乐观的 2024 ARR 倍数情景下，隐含估值都远低于 2021 估值标记。
    data:
      items:
        - label: 悲观 4x
          value: 447
        - label: 基准 7x
          value: 782
        - label: 乐观 12x
          value: 1340
    claimRefs:
