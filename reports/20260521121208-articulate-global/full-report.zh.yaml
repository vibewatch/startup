  - id: FR001
    title: 风险热力图 —— Articulate Global
    type: matrix
    layout: standard
    summary: |
      影响 × 可能性矩阵定位 Articulate 的十项主要风险；AI 冲击和估值过时落在高影响、高可能性象限。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
      rows:
        - label: 低可能性
          values:
            - 平台宕机
            - 定价可及性缺口
            - AI 原生替代
        - label: 中等可能性
          values:
            - ADA 诉讼（针对 Articulate）
            - 产品复杂度 / UX 摩擦
            - 过时的 $3.75B 估值
        - label: 高可能性
          values:
            - 社区平台迁移
            - 企业预算收缩
            - PE 退出时间压力
    approximationNotes: 可能性等级（行：低 / 中 / 高可能性，自上而下）和影响等级（列：低 / 中 / 高）来自公开证据的定性评估；未使用定量概率模型。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR026
      - CR027
      - CR044
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: |
      因果链显示，AI 冲击、预算收缩、隐私泄露和估值滞后等主要风险驱动因素，如何传导到收入、客户和融资结果。
    data:
      nodes:
        - id: ai-disruption
          label: AI 原生创作 / DAP 替代
        - id: budget-contraction
          label: 企业培训预算削减
        - id: privacy-breach
          label: 隐私执法 / 泄露
        - id: valuation-staleness
          label: 过时的 $3.75B 估值标记
        - id: pe-exit-pressure
          label: PE 基金到期（GA / Blackstone）
        - id: arr-deceleration
          label: ARR 增长放缓
        - id: customer-churn
          label: 客户 / 席位流失
        - id: brand-damage
          label: 品牌和社区受损
        - id: down-round-risk
          label: 降价轮或退出折价
        - id: financing-constraint
          label: 后续融资受限
      edges:
        - from: ai-disruption
          to: arr-deceleration
          label: 压低新增 ARR
        - from: budget-contraction
          to: customer-churn
          label: 触发不续约
        - from: customer-churn
          to: arr-deceleration
          label: 压低基础 ARR
        - from: privacy-breach
          to: brand-damage
          label: 削弱社区信任
        - from: brand-damage
          to: customer-churn
          label: 加速流失
        - from: arr-deceleration
          to: down-round-risk
          label: 压低隐含倍数
        - from: valuation-staleness
          to: down-round-risk
          label: 缺少新的盯市锚点
        - from: pe-exit-pressure
          to: financing-constraint
          label: 限制老股融资选择
        - from: down-round-risk
          to: financing-constraint
          label: 收紧新资金条款
    approximationNotes: 因果关系基于公开证据和行业常态推断；未量化传导幅度。
    claimRefs:
      - CR001
      - CR003
      - CR025
      - CR026
      - CR027
      - CR028
      - CR044
      - CR045
  - id: FR003
    title: 依赖关系图 —— 关键平台与财务依赖
    type: dag
    layout: wide
    summary: |
      关键结构性依赖显示，Articulate 依赖第三方 LMS、云基础设施、PE 投资者和监管框架。
    data:
      nodes:
        - id: articulate
          label: Articulate Global（SaaS 平台）
        - id: third-party-lms
          label: 第三方 LMS（Cornerstone、Workday、SAP，55+ 个集成）
        - id: cloud-infra
          label: 云基础设施提供商（未披露）
        - id: google-recaptcha
          label: Google reCAPTCHA Enterprise 风控服务
        - id: pe-sponsors
          label: PE 投资方（General Atlantic、Blackstone、ICONIQ）
        - id: data-enrichment
          label: 第三方数据补全供应商
        - id: fedramp
          label: FedRAMP 授权（美国联邦）
        - id: elearning-heroes
          label: E-Learning Heroes 社区（1.5M+ 成员）
        - id: enterprise-customers
          label: 企业客户（Fortune 100、120K+ 组织）
      edges:
        - from: enterprise-customers
          to: third-party-lms
          label: 通过其部署课程
        - from: articulate
          to: third-party-lms
          label: 将 SCORM/xAPI 导出至
        - from: articulate
          to: cloud-infra
          label: 托管于
        - from: articulate
          to: google-recaptcha
          label: 反欺诈依赖
        - from: pe-sponsors
          to: articulate
          label: 持有约 40%；退出压力
        - from: articulate
          to: data-enrichment
          label: 从其购买联系人数据
        - from: articulate
          to: fedramp
          label: 基于其授权
        - from: elearning-heroes
          to: articulate
          label: 社区护城河和自然获客
        - from: enterprise-customers
          to: articulate
          label: 支付按席位订阅费
    approximationNotes: 依赖关系图基于公开披露推断；云基础设施提供商身份尚未公开确认。
    claimRefs:
      - CR037
      - CR038
      - CR039
      - CR044
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 决策树从规模和客户验证出发，经由估值重置和披露缺口，落到继续研究的结论。
    data:
      nodes:
        - id: n1
          label: 规模：ARR $111.7M，增长 32.7%
        - id: n2
          label: 验证：企业客户 ROI 和产品覆盖面
        - id: n3
          label: 重置：2021 估值标记仍相当于 2024 ARR 的 33.6x
        - id: n4
          label: 缺口：无经审计财务 / NRR / 当前估值标记
        - id: n5
          label: 结论：高风险，低至中等信心
        - id: n6
          label: 建议：继续研究
    claimRefs:
      - CV001
      - CV015
      - CV016
      - CV039
      - CV040
      - CV041
