      - number: '4.4'
        title: 单位经济与利润率未知项
        blocks:
          - type: paragraph
            body: >
              Articulate 的毛利率、EBITDA、净利润、CAC 和 LTV 都未公开，无法用公开来源独立验证。不过，现有证据仍能给出若干代理指标和推断。

              毛利率：SaaS 创作工具以纯软件交付为主，除云托管外基础设施成本很低。Articulate 所在规模（$100M–$150M ARR）的 SaaS 公司，行业基准通常落在 70–80%
              毛利率。Articulate 的产品几乎全部托管在云端（Rise 360、Review 360、Reach），另有一个桌面应用组件（Storyline 360）。Storyline 360
              可能带来略高于纯云产品的支持成本，但整体组合仍以 SaaS 为主。因此，70–80% 的毛利率假设合理，但尚未验证。

              经营杠杆：员工数从 2021 年 1 月的 349 人增至 2025 年的 633 人（增长 81%），收入则从约 $29.4M（2021 年）增至 $111.7M（2024 年），增长
              280%。如果这一关系成立，Articulate 的收入扩张速度约为员工数增长的 3.4 倍，说明这段时期经营杠杆已有明显改善。

              获客成本（CAC）：Articulate 提供 60 天免费试用，这是主要的新客户获取漏斗。公司有 53 名带配额销售代表，以及约 125,000 个客户组织；这些销售大概率更专注于企业增购 / 扩张，而不是
              SMB 新客获取。SMB / 自助式获客的 CAC 可能相对较低（试用转付费漏斗、社区 SEO 带来的入站流量），但这一点尚未验证。

              净留存率（NRR）：公司未披露。Articulate 的切换成本很强（Storyline 文件格式锁定、社区飞轮、全套件集成），因此 NRR 可能高于 100%，但没有数据确认。公开 LMS 同业 Docebo
              报告 2024 年 NRR 约为 109%，可作为该品类的合理基准；不过 Articulate 的模式不同。

              40 法则：没有 EBITDA 利润率，无法计算。如果 Articulate 增长 33%，且经营接近盈亏平衡，40 法则 ≈ 33。如果 EBITDA 利润率超过 10%，40 法则 >
              40，将支撑更高的估值倍数。
            claimRefs:
              - CI017
              - CI018
              - CI019
              - CI020
              - CI021
