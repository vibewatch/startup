  - id: TR005
    title: 缓释质量与否决标准
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - AI 替代 / DAP 挤出
        - ARR 增速放缓；AI 原生创作竞品完成融资
        - ARR 同比增速跌破 15%，或大型企业 LMS 原生捆绑创作功能
        - 投资逻辑破裂：重估护城河；加快核查 Articulate AI 路线图的差异化
      - - 估值陈旧 / 估值下调风险
        - 老股交易隐含估值低于 $2B；上市 SaaS 可比公司倍数收缩至 4x 以下
        - 任何披露的低于 $2B 老股交易，或上市可比公司（Docebo、Udemy）平均倍数跌破 3x 收入
        - 大幅调整隐含入场价；按当前可比倍数重新承销
      - - 隐私 / 监管执法
        - GDPR 执法行动，或美国州隐私总检察长调查点名 Articulate
        - 任何点名 Articulate 的监管调查通知或民事诉状
        - 暂停新增承诺；取得关于影响范围和整改成本的法律意见
      - - 企业培训预算收缩
        - 美国企业裁员公告超过员工数 5%；Fortune 500 在财报电话会中削减 L&D 预算
        - Articulate 滚动 ARR 增速跌破 10%，或客户数增长转负
        - 监控席位续约率；提前触发 NRR 尽调索取
      - - 关键人离职（Schwartz）
        - Adam Schwartz 离职公告，或高管角色发生重大变化
        - 任何关于 CEO 或执行董事长交接的公开公告
        - 全面暂停投资；必须审查董事会构成和继任计划
      - - PE 退出压力
        - General Atlantic 或 Blackstone 基金到期触发被迫退出窗口
        - 基金年份自 2021 年 7 月交割起满 7 年（2028 年 7 月）
        - 评估 IPO 准备度、老股市场流动性或战略买家格局
    notes: 否决标准和监控触发项是投资分析框架，并非公司正式披露的否决标准。阈值基于对成长型股权支持 SaaS 公司的市场常规推断。
