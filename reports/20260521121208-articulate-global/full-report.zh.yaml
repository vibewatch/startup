              Localization（$5,000+/year）和 Reach Pro（$3,600+/year）附加模块，把单账户 ARR 拉到远高于 $1,449–$1,749/seat
              的基础价格地板。对拥有全球员工和大量学习者的企业客户而言，这些附加模块可能每个账户增加 $10,000–$50,000+
              的年度合同价值。公司没有披露客户采用这些附加模块的比例，因此没有一手数据就无法确认平台增购逻辑。
