      - number: '3.5'
        title: 用户评价中的优势与弱点
        blocks:
          - type: paragraph
            body: >
              在 G2、TrustRadius、SoftwareAdvice 和 GetApp 上，Articulate 360 长期获得 4.5–4.7/5 评分（G2：4.7/5，479
              条评价；SoftwareAdvice：4.7/5，460 条结果；GetApp：评分强劲；TrustRadius 同样偏高）。客户是 1,000+ 名员工企业中的教学设计师，赞誉集中在 Storyline
              的创作深度、Rise 的快速发布、Review 360 协作工作流，以及 E-Learning Heroes 社区。

              评价中反复出现的抱怨包括：（1）Storyline
              使用固定布局，无法对所有屏幕尺寸自适应；（2）工具的完整能力需要掌握触发器和变量的技术知识，给经验较少的创作者带来学习曲线；（3）协作是串行而非同步（单个文件内没有实时共同创作）；（4）在 Rise
              中管理大量课程可能很笨重；（5）颜色选择 bug 和功能请求积压受到具体批评。iSpring 替代方案比较明确指出，Articulate 的按席位定价对“个人或小团队可能难以证明合理”，并且没有月付选项。

              Whatfix 对 Storyline 的编辑性批评指出了维护负担（屏幕和引导嵌在同一个幻灯片层）、缺少应用内引导能力，以及保护敏感数据困难等相对 DAP
              替代品的结构性弱点。这些是真实的技术限制，但反映的是不同任务场景，而不是 Articulate 核心创作市场中的正面缺陷。

              G2 将 Articulate 评为 2026 年企业软件第一名，并把它列入 Winter 2026 Top 10 Products；这提供了第三方社会证明，可抵消用户层面的抱怨。
