      - number: '2.3'
        title: 买方分层与采用动态
        blocks:
          - type: paragraph
            body: >-
              Articulate 服务三类主要组织客群，采购动态各不相同：拥有集中 L&D
              职能的大型企业（主要收入驱动）、正在建设内部培训能力的中型市场组织，以及教学设计预算有限的中小企业（SMB）。公司的客户案例组合——Microsoft（220,000 名员工）、Intermountain
              Health（70,000）、Mondelēz International、Databricks、Berkadia、Forbes Travel Guide、The Toro
              Company、Questrade——明显偏向大型企业，印证其企业优先的商业动作。

              在大型企业里，购买单元通常是 L&D 或 HR 团队，他们既是最终用户也是评估者；IT 是合规和集成守门人；C-suite（CHRO 或
              CFO）负责企业许可预算审批。采用触发点通常是课堂培训转向数字培训（远程办公加速）、合规驱动的培训要求（医疗、金融服务、政府），或一个可扩展性瓶颈，使企业愿意用专用创作软件替代手工制作。医疗（Intermountain
              Health）、金融服务（Berkadia、Questrade）、科技（Microsoft、Databricks）、消费品（Mondelēz、The Toro Company）、酒店旅游（Forbes
              Travel Guide）以及政府 / 非营利（The Global Fund）都是已发布案例集中确认活跃的垂直行业。

              SMB 客群价格敏感，并被 Articulate 的按用户定价结构性压制（高端档为 $1,749/user/year）。Global Growth Insights 的第三方数据确认，43%
              买方把价格列为主要阻力，39% 的中小企业会因团队规模波动而在订阅模式上遇到挑战。这给 SMB 采用率设下结构性天花板，也让 100 席以下市场在 Articulate
              当前商业模式下服务不足；iSpring（起价 $720/year）和 EasyGenerator 等竞争对手正瞄准这块市场。
