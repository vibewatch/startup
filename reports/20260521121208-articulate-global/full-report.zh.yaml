        - from: D6
          to: D1
          label: 驱动翻译 / 生成
        - from: D7
          to: D1
          label: 工作流自动化
        - from: D8
          to: D1
          label: 基于标准的交付路径
        - from: D9
          to: D1
          label: 素材交付
  - id: FE004
    title: 产品成熟度 / 能力地图
    type: matrix
    layout: wide
    summary: 历史更久的核心创作工具在成熟度和企业匹配度上最强；Reach、Localization 和 AI Assistant 推出更晚，但具有战略重要性。
    claimRefs:
      - CE001
      - CE020
      - CE025
      - CE026
      - CE027
      - CE033
    data:
      columns:
        - 成熟度
        - 企业匹配度
        - 关键差异点
      rows:
        - label: Rise 360
          values:
            - 高
            - 强
            - 快速云端响应式创作
        - label: Storyline 360
          values:
            - 高
            - 强
            - 借变量和分支实现深度交互
        - label: Review 360
          values:
            - 高
            - 强
            - 低摩擦利益相关方反馈
        - label: Reach 360
          values:
            - 中高
            - 增长中
            - 内置 LMS 替代方案，发布快
        - label: Localization
          values:
            - 中
            - 增长中
            - AI 翻译 + 验证者工作流
        - label: AI Assistant
          values:
            - 中高
            - 高
            - AI 嵌入创作和媒体任务
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 发现通常始于社区和同行认知，之后进入低摩擦评估、创作采用、更广的协作与交付工作流，最后扩张到 Reach 或 Localization 模块。
    data:
      nodes:
        - id: stage1
          label: 发现
          description: L&D 团队通过同行推荐、G2 评论、E-Learning Heroes 社区或网页搜索接触 Articulate。
        - id: stage2
          label: 试用
          description: 30 天免费试用且无需信用卡，降低作者和团队的评估摩擦。
        - id: stage3
          label: 采用
          description: 团队购买席位，在 Rise 或 Storyline 中搭建初始课程，并用 Review 收集利益相关方反馈。
        - id: stage4
          label: 扩展
          description: 新增作者，Review 使用扩大，Reach 可能替代或补充外部 LMS。
        - id: stage5
          label: 全球扩张
          description: 多语言项目采用 Localization，把同一份内容扩展到 80+ 种语言工作流。
    claimRefs:
      - CU004
      - CU025
      - CU027
      - CU028
      - CU032
  - id: FU002
    title: 采用漏斗
    type: funnel
    layout: wide
    summary: 公开证据显示，漏斗从从业者认知和低摩擦评估开始，随后扩展到组织部署和更高价值的模块扩张。
    data:
      items:
        - id: F1
          label: 从业者社区
          value: 1500000
          description: 1.5M 成员的 E-Learning Heroes 社区——自然品牌认知和同行赋能。
        - id: F2
          label: 付费组织
          value: 125000
          description: 125,000 家组织在 187 个国家使用 Teams 或 Personal 方案。
        - id: F3
          label: Fortune 100 渗透
          value: 100
          description: 全部 100 家 Fortune 100 公司使用 Articulate 产品做员工培训。
        - id: F4
          label: 具名公开案例研究
          value: 11
          description: 11 个第一方案例研究，覆盖医疗健康、科技、金融、CPG、酒店、NGO 和 L&D 代理等垂直行业。
        - id: F5
          label: 有量化 ROI 的案例研究
          value: 6
          description: 6 个具名账户报告具体结果：节省 $100K、成本下降 75%、投入下降 50%、用户增长 35%、节省 90% 时间或类似效果。
    claimRefs:
      - CU001
      - CU004
      - CU017
      - CU025
      - CU028
      - CU032
