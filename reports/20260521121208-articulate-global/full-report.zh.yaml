      - number: '3.6'
        title: 证据展项
        blocks:
          - type: callout
            title: Articulate 的社区飞轮具备结构性差异
            body: >
              E-Learning Heroes 社区（1.5M 名成员）形成自我强化的内容和支持生态，竞争对手无法快速复制。模板、教程和同侪支持降低了 Articulate
              技能养成成本，强化专业教学设计师的平台专精，也让切换成本不仅是技术问题，还带有非货币属性。
            calloutType: strength
            claimRefs:
              - CP002
              - CP022
          - type: callout
            title: AI 商品化威胁 Storyline 的复杂度护城河
            body: >
              如果生成式 AI 能以近零边际成本把文档转成可部署、带内嵌分支的课程，Storyline 的复杂度天花板——也是其切换成本的主要来源——就会被侵蚀。Articulate 的 AI Assistant
              是防御性回应，但 AI 化创作工具之间一旦能力趋同，竞争就会转向价格、品牌和社区。截至 2025–2026 年，三家创作竞争对手（iSpring、Captivate、Easygenerator）都已推出平行 AI
              功能，压缩 Articulate 的先发优势。
            calloutType: risk
            claimRefs:
              - CP026
              - CP027
              - CP028
          - type: callout
            title: “SME 即作者”趋势改变买方画像和价格敏感度
            body: >
              Easygenerator 的明确定位（“组织里的任何人都可以分享知识，而不会增加 L&D 的工作量”）和 Docebo Creator 的 AI
              生成能力指向一个结构性转变：买方可能越来越多地把创作能力下放给主题专家，而不是集中在专业教学设计师手里。这会压缩企业愿意为 Articulate 高端创作功能集支付的按席位价格。
            calloutType: risk
            claimRefs:
              - CP008
              - CP016
              - CP027
          - type: callout
            title: 价格纪律是关键尽调重点
            body: >
              Articulate 标价为 $1,449–$1,749/user/year，且没有月付选项；iSpring 起价 $970/user/year，Adobe Captivate 约
              $408/user/year（月付）。Articulate 在企业合同中能否拿到标价——还是需要折扣赢下竞标——仍是未解的财务问题。实际平均销售价格（ASP）相对标价的水平，是第 4 章评估收入质量的关键输入。
            calloutType: insight
            claimRefs:
              - CP011
              - CP012
              - CP013
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价结构
        blocks:
          - type: paragraph
            body: >
              Articulate 的收入模式很直接：按作者席位收取 SaaS 订阅费。主产品是 Articulate 360，分两档销售：Personal 为 $1,449/user/year，Teams（AI-tier）为
              $1,749/user/year。公司不提供月付；所有计划都要求年度承诺。定价页确认有用于多席位报价的 Pricing Calculator UI，说明销售渠道可提供数量折扣，但公开标价是基准。

              核心订阅之外，两条重要附加收入流单独定价：（1）Articulate Localization，起价 $5,000/year，按年度翻译量计价，并提供自定义术语表和 80+ 种语言的上下文验证；（2）Reach
              Pro，Articulate 的集成 LMS 分发层，1,200 名活跃学习者起价 $3,600/year，且只能通过销售联系购买。这些附加模块把纯创作订阅客户转为依赖分发的平台用户，是能提高单账户 ARR
              的重要增购机制。

              官方客户证据显示，附加模块和 AI 档位为买方创造的是真实经济价值，而不是装饰性增购。Tamr 称 Reach 360 将 LMS 管理工作量至少降低 50%，同时帮助其注册学习者基数扩大 30%
              以上，支持分发功能可证明增量支出的论点。Berkadia 称 AI Assistant 将高质量初稿开发时间缩短 50%，并把大纲创建从数周缩短到数分钟，说明企业团队为什么可能接受为 AI 席位支付更高 ASP。

              核心订阅、Localization 附加和 Reach Pro 附加之间的收入组合未披露。Articulate 报告 125,000+ 家客户组织；若假设每家组织平均 1–3 个作者席位，则对应
              125,000–375,000 个计费席位，按标价隐含的平均合同价值（ACV）约为每组织每年 $1,449–$5,247——远低于企业 SaaS 常见的 $20K–$100K+ ACV。这意味着
              Articulate 的定价策略更偏 SMB / 中型市场规模化，而非企业大合同驱动；这与 Latka 报告的 $111.7M 收入下只有 53 名背配额销售相一致。

              Whatfix 的竞品比较（立场偏反向）也把 Articulate 的价格记录为“入门价格为每个作者席位 $1,500，适合拥有多名内容创作者的企业”——这印证了公开标价，并暗示基础档实际价格接近标价。
