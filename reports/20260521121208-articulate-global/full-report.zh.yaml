      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >
              Articulate 有意采用混合架构。Rise 360 完全基于云并通过浏览器交付，便于分布式团队采用，也支持响应式输出。Storyline 360 则相反：它是 Windows
              桌面应用，针对深度交互、动画时序、触发器、变量和状态做了优化。Review 360、Reach 360 和 Localization 都是围绕这些创作界面叠加的 SaaS 服务，让 Articulate 在保留
              Storyline 原生桌面创作模式的同时，拥有共享的云端协作与交付层。


              课程输出层的互操作性很强。Storyline 可发布 SCORM、Tin Can API 1.0 和 AICC 包，Reach 则增加内置托管、分析以及 SSO、批量注册等企业控制。G2 档案还列出 55
              个集成，Reach 明确点名 Slack、Microsoft Teams、Zapier 和基于 API 的连接。即便 Articulate
              并不把自己定位成通用开发者平台，这些能力也足以覆盖大多数企业工作流自动化。对应地，公开开发者信号偏弱：没有大型开源或软件包生态，因此 E-Learning Heroes
              社区、评论深度和工程招聘页面，是公开判断技术活力的最好代理。
