  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: AI 颠覆与市场替代风险
        blocks:
          - type: paragraph
            body: >
              Articulate 的核心价值主张——让教学设计师创建有吸引力、互动性强的在线学习课程——面临两股正在汇合的替代威胁。第一，生成式 AI 正大幅压缩课程开发时间：行业数据表明，AI
              最多可将企业培训课程创建时间减少 58%，开发成本降低 40%，侵蚀支撑 Articulate 360 按席位定价的生产力溢价。随着 AI Course Drafts 和 AI Assistant
              成为全市场标准功能，Articulate 与更低成本或免费 AI 原生创作工具之间的差异会明显收窄。第二，Whatfix
              等数字采用平台（DAP）在真实软件工作流内提供实时应用内指引，直接训练员工；Articulate Storyline 在结构上并不适合这一用例。Whatfix 明确把 Articulate
              定位为不足以满足现代企业对可扩展、低维护应用内培训的需求。eLearning Industry 2025-2026 年权威创作工具排名把 iSpring Suite 放在第 1 位，取代 Articulate
              的榜首位置——这是高端市场竞争地位走弱的信号。AI 企业培训市场估值为 $2.5B，并预计增长至五倍，说明市场增长最快的部分正在转向 AI 原生体验，可能完全绕开课程创建。Articulate 已在
              2025-2026 年把 AI 集成进 Rise 和 Storyline，但围绕幻灯片式和区块式创作构建的平台架构，未必足以防御从一开始就围绕 AI 构建的平台。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
