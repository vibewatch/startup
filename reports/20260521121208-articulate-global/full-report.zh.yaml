  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与客户工作流
        blocks:
          - type: paragraph
            body: >
              Articulate 360 以捆绑式创作与交付订阅销售，而不是单点工具。套件包括：用于快速浏览器创作的 Rise 360、用于更丰富交互的 Storyline 360、用于利益相关方反馈的 Review
              360、用于 LMS 式分发的 Reach 360、用于多语言上线的 Localization、用于嵌入式生成工作流的 AI Assistant，以及提供现成资产的 Content Library
              360。Articulate 称平台服务 125,000 个组织、1.33 亿学习者、所有 Fortune 100 公司，并覆盖 187 个国家。这说明该产品已经在有意义的企业规模上运行，而不是一个小众创作产品。


              对大型 L&D 团队来说，实际工作流很直接：源材料进入 Rise 或 Storyline，AI Assistant 加速初稿，Review 在上下文中收集 SME 评论，Localization
              按需翻译并流转给校验者审阅，Reach 或 LMS 导出负责分发。Rise 是响应式课程和 SME 的速度层，Storyline 则仍是分支、变量和仿真重内容的高控制层。Content Library 用
              20M+ 资产降低空白页摩擦，因此价值主张来自组合工作流，而不是某个孤立模块。


              案例研究记录显示，买方确实按这种模块化方式使用套件。Questrade 用 Rise 搭建 100+ 门课程的内部库，同时依赖 Storyline 做更复杂的软件培训。Forteorigen 把
              Rise、Storyline、Reach 和 Review 一起使用，并称 Articulate 将制作和交付速度提高了 50% 以上。Tamr 的客户培训项目用 Rise 和 Reach 将报名人数扩大 30%
              以上，同时减少 LMS 管理工作量。这些例子重要，因为它们说明 Articulate 发挥的是工作流系统作用，而不是单一创作应用。
