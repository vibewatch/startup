callouts:
  - calloutType: risk
    title: Third-Party Revenue Figures Are Unaudited — Primary Financial Data Gap
    body: >
      Articulate's entire revenue narrative ($111.7M in 2024, 33% growth) rests on GetLatka estimates and self-reported company data—neither of which is independently audited. Until Articulate provides audited financial statements (via an IPO S-1, investor data room, or filing), all revenue-based valuations and growth rates carry significant uncertainty. This is the single largest financial diligence blocker.
    claimRefs:
      - CI006
      - CI007
      - CI027

  - calloutType: risk
    title: 2021 Valuation at 34x Revenue Carries Compression Risk
    body: >
      The $3.8B valuation set in 2021 implied approximately 34x on the then-current revenue run rate. Post-correction SaaS multiples as of May 2026 are 6–7x for the median public company, and 7–12x for high-growth AI-integrated SaaS. At current revenue, Articulate's implied fair value range under 2026 multiples ($782M–$1.3B for base case) is materially below the 2021 raise price—a potential mark-to-market impairment for 2021 investors that may delay or pressure IPO pricing.
    claimRefs:
      - CI022
      - CI023
      - CI024

  - calloutType: strength
    title: Unusually Efficient Revenue Delivery for Scale
    body: >
      $111.7M in revenue with only 633 employees ($176K revenue/employee) and 53 quota-carrying sales reps ($2.1M revenue/rep) is well above mid-market SaaS averages. This efficiency is consistent with a retention-first, community-flywheel model where high switching costs minimize churn-driven selling overhead. If confirmed by audited data, this efficiency would support premium valuations.
    claimRefs:
      - CI009
      - CI010
      - CI011

  - calloutType: insight
    title: Localization and Reach Add-Ons Are the Primary Upsell Lever
    body: >
      The Localization ($5,000+/year) and Reach Pro ($3,600+/year) add-ons extend per-account ARR well above the base $1,449–$1,749/seat floor. For enterprise customers with global workforces and high learner populations, these add-ons could add $10,000–$50,000+ in annual contract value per account. The proportion of customers on these add-ons is undisclosed, making it impossible to confirm the platform upsell thesis without primary data.
    claimRefs:
      - CI002
      - CI003
      - CI004

