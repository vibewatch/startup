  - id: unit-economics-and-margin-unknowns
    title: Unit Economics and Margin Unknowns
    body: >
      Articulate's gross margin, EBITDA, net income, CAC, and LTV are all private and cannot be independently verified from publicly available sources. However, several proxies and inferences are possible from the evidence base.

      Gross margin: SaaS authoring tools are software-only delivery with minimal infrastructure cost beyond cloud hosting. Industry benchmarks for SaaS companies at Articulate's scale ($100M–$150M ARR) typically show 70–80% gross margins. Articulate's product is entirely cloud-hosted (Rise 360, Review 360, Reach) with one desktop-app component (Storyline 360), which may carry slightly higher support costs than pure cloud, but the mix is SaaS-dominant. A 70–80% gross margin assumption is reasonable but unverified.

      Operating leverage: Headcount grew from 349 employees in January 2021 to 633 in 2025 (81% increase), while revenue grew from approximately $29.4M (2021) to $111.7M (2024)—a 280% increase. If this holds, Articulate has been scaling revenue at roughly 3.4x the pace of headcount, implying meaningful operating leverage improvement over the period.

      Customer acquisition cost (CAC): Articulate offers a 60-day free trial, which is the primary new-customer acquisition funnel. With 53 quota-carrying reps and approximately 125,000 customer organizations, the reps likely focus on enterprise upsell/expansion rather than SMB new-customer acquisition. CAC for SMB/self-serve acquisition may be relatively low (trial-to-paid funnel, inbound via community SEO), but this is unverified.

      Net revenue retention (NRR): Not disclosed. The strength of Articulate's switching costs (Storyline file format lock-in, community flywheel, full-suite integration) suggests NRR above 100% is likely, but no data confirms it. Docebo, a public LMS peer, reported NRR of approximately 109% in 2024—a plausible benchmark for the category, but Articulate's model is different.

      Rule of 40: Cannot be calculated without EBITDA margin. If Articulate is growing at 33% and operating near breakeven, Rule of 40 ≈ 33. If it has 10%+ EBITDA margin, Rule of 40 > 40, which would support premium valuation multiples.
