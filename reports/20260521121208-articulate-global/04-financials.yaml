  - id: valuation-context-and-diligence-verdict
    title: Valuation Context and Financial Diligence Verdict
    body: >
      Articulate's 2021 valuation of $3.8B implies a forward revenue multiple of approximately 34x on its 2024 reported revenue of $111.7M (EV/Revenue at the close year's forward estimate). At the time of the raise (2021), the SaaS market was at peak multiples (median public SaaS EV/Revenue ~18x); Articulate commanded a premium for its bootstrapped profitability, dominant market position, and atypical growth trajectory.

      As of May 2026, the public SaaS index stands at approximately 6–7x EV/Revenue (Windsor Drake, February 2026 update). Top-quartile public SaaS companies trade at 13–14x. For a private company with Articulate's characteristics—strong brand moat, 33% revenue growth, estimated high retention—a 2026 private market multiple in the 8–15x ARR range (Acquiry's range for AI-integrated SaaS with 20–50% growth) would imply a fair value range of approximately $893M–$1.68B on 2024 revenue. This is a significant discount to the 2021 valuation of $3.8B, reflecting the post-2022 multiple compression across SaaS. Investors who entered in 2021 at 34x may face a mark-to-market impairment; whether they have already reflected this in their reported NAV is unknown.

      However, the 2026 valuation case can be rebuilt: if Articulate's 2025–2026 revenue has continued growing at 25–33% (consistent with 2022–2024 trajectory), 2026 ARR could be approximately $140–$185M. At a 12–15x ARR multiple (premium AI-tier SaaS), the implied valuation range is $1.68B–$2.78B—below the 2021 price but potentially above the current impairment nadir. Whether Articulate is on a path to IPO, secondary sale, or continued private operation is the central capital-event question that remains unresolved.

      Key diligence blockers: (1) No audited revenue, gross margin, or EBITDA; (2) No confirmed NRR cohort data; (3) No disclosed capital adequacy post-2021 raise; (4) No confirmed IPO timeline or secondary event; (5) Revenue figures sourced exclusively from third-party aggregators with no regulatory filing corroboration.

      The adverse risk in the financial picture: Articulate's pricing is list-only with no monthly option, creating a structural incentive for buyers to negotiate multi-year enterprise deals with significant discounts. If realized ASP is materially below list ($1,449–$1,749/seat), reported revenue may overstate true contract value. The Acquiry report notes that "Traditional SaaS (<15% growth) trades at 1.5–3x ARR," signaling that if Articulate's growth decelerates, its multiple would compress sharply.
