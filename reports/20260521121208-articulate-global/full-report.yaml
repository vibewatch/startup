  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: AI Disruption and Market Substitution Risks
        blocks:
          - type: paragraph
            body: >
              Articulate's core value proposition—enabling instructional designers to create engaging, interactive
              eLearning courses—faces two converging substitution threats. First, generative AI is dramatically
              compressing course development time: industry data suggests AI cuts corporate training course creation
              time by up to 58% and reduces development costs by 40%, eroding the productivity premium that justified
              Articulate 360's per-seat pricing. As AI Course Drafts and AI Assistant become standard features across
              the market, the differentiation between Articulate and lower-cost or free AI-native authoring tools will
              narrow materially. Second, Digital Adoption Platforms (DAPs) such as Whatfix deliver real-time, in-app
              guidance that trains employees within live software workflows—a use case for which Articulate Storyline is
              structurally unsuited. Whatfix explicitly positions Articulate as insufficient for modern enterprise needs
              requiring scalable, low-maintenance in-app training. eLearning Industry's authoritative authoring tool
              ranking for 2025-2026 placed iSpring Suite at #1, displacing Articulate from the top position—a signal
              that competitive positioning is weakening at the premium end. The AI corporate training market was valued
              at $2.5B and is projected to quintuple, suggesting that the fastest-growing part of the market is shifting
              toward AI-native experiences that may bypass course creation entirely. Articulate has responded by
              integrating AI into Rise and Storyline throughout 2025-2026, but a platform architecture built around
              slide-based and block-based authoring may not be sufficient to defend against platforms built AI-first.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
