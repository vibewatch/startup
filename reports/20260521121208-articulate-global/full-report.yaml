      - number: '3.5'
        title: User Review Strengths and Weaknesses
        blocks:
          - type: paragraph
            body: >
              Across G2, TrustRadius, SoftwareAdvice, and GetApp, Articulate 360 consistently earns 4.5–4.7/5 ratings
              (G2: 4.7/5, 479 reviews; SoftwareAdvice: 4.7/5, 460 results; GetApp: strong ratings; TrustRadius similarly
              high). Customers are instructional designers at enterprises with 1,000+ employees, and the praise
              concentrates on Storyline's creative depth, Rise's speed-to-publish, the Review 360 collaboration
              workflow, and the E-Learning Heroes community.

              Recurring complaints in reviews include: (1) Storyline uses fixed layouts that do not adapt responsively
              to all screen sizes; (2) the tool's full power requires technical knowledge of triggers and variables,
              creating a learning curve for less-experienced creators; (3) collaboration is sequential rather than
              simultaneous (no real-time co-authoring inside a single file); (4) managing large numbers of courses in
              Rise can be cumbersome; (5) color selection bugs and feature-request backlogs draw specific criticism. The
              iSpring alternative comparison explicitly notes that Articulate's per-seat pricing can be "hard to justify
              for individuals or small teams" and that there is no monthly billing option.

              Whatfix's editorial critique of Storyline surfaces maintenance burden (screen and guidance are embedded in
              the same slide layer), lack of in-app guidance capability, and difficulty protecting sensitive data as
              structural weaknesses vs. DAP alternatives. These are genuine technical limitations but reflect different
              job-to-be-done use cases rather than head-on deficiencies in Articulate's core authoring market.

              G2 named Articulate the #1 Enterprise Software of 2026 and included it in the Top 10 Products for Winter
              2026, providing third-party social proof that counters user-level complaints.
