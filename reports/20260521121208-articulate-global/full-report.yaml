          label: Discovery
          description: >-
            L&D teams encounter Articulate through peer recommendation, G2 reviews, the E-Learning Heroes community, or
            web search.
        - id: stage2
          label: Trial
          description: A 30-day free trial with no credit card lowers evaluation friction for authors and teams.
        - id: stage3
          label: Adoption
          description: Teams purchase seats, build initial courses in Rise or Storyline, and use Review for stakeholder feedback.
        - id: stage4
          label: Scale
          description: Additional authors are added, Review usage expands, and Reach may replace or supplement an external LMS.
        - id: stage5
          label: Global Expansion
          description: Localization is adopted for multilingual programs, extending the same content into 80+ language workflows.
