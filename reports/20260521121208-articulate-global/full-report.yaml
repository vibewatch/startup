      - number: '7.5'
        title: Governance, Disclosure Opacity, and Execution Risks
        blocks:
          - type: paragraph
            body: >
              Articulate's private-company status means the investment case rests almost entirely on company-controlled
              communications, third-party estimates, and customer case studies rather than audited SEC or GAAP filings.
              Revenue figures from Latka ($111.7M 2024 ARR), Growjo ($89.1M), and Trueup (valuation $3.8B) diverge,
              illustrating the estimation risk inherent in relying on private data aggregators. All customer
              metrics—125K organizations, 133M learners, 187 countries—are company-stated and unaudited. The disclosure
              profile creates a systematic information asymmetry between Articulate management and outside investors. On
              governance, Adam Schwartz holds both Founder, CEO, and Executive Chairman roles, creating key-person
              concentration; board composition and minority investor protections are undisclosed. The company's
              leadership team was substantially rebuilt post-Series A (President/CFO, COO, CPO, Chief Legal Officer
              added), raising integration and cultural cohesion risk. Headcount grew from ~349 employees in January 2021
              to ~633 by late 2025; rapid remote-first scaling can dilute management attention and product quality. On
              valuation, the $3.75B mark set in July 2021 implies ~33.6x 2024 ARR, against a backdrop where public SaaS
              EV/Revenue multiples have compressed to 6–7x and non-AI private SaaS transactions are clearing at 4–8x
              ARR. No secondary market mark, tender offer, or IPO preparation has been disclosed, leaving the 2021
              valuation as the only available anchor—with no independent confirmation of its current validity.
