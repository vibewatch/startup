  - id: TV005
    title: Thesis-break and Kill Triggers Table
    type: simple
    notes: Triggers are designed to be monitorable and tied directly to valuation support rather than generic company health.
    claimRefs:
      - CV032
      - CV033
      - CV039
      - CV040
      - CV041
    columns:
      - Trigger
      - Threshold
      - Why it breaks thesis
      - Monitoring indicator
      - Action implication
    rows:
      - - Growth reset
        - Sustained ARR growth below 15%
        - Premium multiple compresses toward mature-SaaS band
        - Management budget, quarterly board pack, new pricing marks
        - Move underwriting toward bear case
      - - Retention disappointment
        - NRR at or below 100%
        - Customer proof no longer supports expansion premium
        - Cohort data, renewal rates, add-on attach rates
        - Reject bull-case multiple
      - - Fresh down-round / secondary
        - New price below ~$1.5B
        - Confirms 2021 mark was materially too high
        - 409A, tender, or financing documents
        - Rebase valuation framework around new mark
      - - Weak enterprise proof
        - Top case studies fail to translate into broader renewal or upsell
        - Curated references no longer justify premium positioning
        - Reference calls and cohort expansion data
        - Treat customer-proof moat as overstated
      - - Exit slippage
        - No credible path to liquidity within 2-4 years
        - Return profile weakens even if operations remain solid
        - Board planning, banker engagement, audit readiness
        - Require deeper discount or stand down
  - id: TV006
    title: Final Diligence Asks Table
    type: simple
    notes: >-
      These asks are framed as gating items; they are the minimum package required to move from public-range analysis to
      an investable price.
    claimRefs:
      - CV042
      - CV043
      - CV044
      - CV045
    columns:
      - Ask
      - Data requested
      - Why it matters
      - Primary source / owner
      - Priority
    rows:
      - - Audited financial package
        - 2024-2025 audited P&L, balance sheet, cash flow, ARR bridge
        - Replaces third-party revenue proxies with investable evidence
        - CFO / data room
        - Critical
      - - Retention cohorts
        - NRR, GRR, logo retention, expansion by cohort
        - Determines whether Articulate deserves premium SaaS multiples
        - Finance + RevOps
        - Critical
      - - Monetization mix
        - Core-seat ARR versus Localization, Reach, and AI add-ons
        - Shows whether premium growth is broad-based or concentrated
        - Finance + Product
        - High
      - - Current valuation evidence
        - 409A, any secondary tender, board valuation materials
        - Tests whether public stale mark matches internal reality
        - CFO / Board
        - High
      - - Cap table and preferences
        - Investor rights, liquidation stack, employee dilution, option pool
        - Needed to model real return outcomes
        - Legal + CFO
        - High
      - - Exit plan
        - 2-4 year roadmap to IPO readiness, secondary, or strategic sale
        - Links valuation entry to realizable liquidity
        - CEO + CFO + Board
        - Medium
