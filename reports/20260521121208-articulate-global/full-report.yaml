      - number: '7.4'
        title: Financial, Dependency, and Corporate Budget Risks
        blocks:
          - type: paragraph
            body: >
              Articulate's entire revenue base is subscription-based and corporate-facing, creating concentrated
              exposure to corporate L&D budget cycles. L&D spending increased for 42% of professionals in 2023 versus
              2022, and global L&D spending reached $434B in 2023—but 29% of employees report that their company's
              training programs feel irrelevant, a statistic that informs budget-cutting decisions in downturns.
              Articulate's growth from $29.4M ARR in 2021 to $84.2M in 2023 and $111.7M in 2024 is impressive, but these
              figures derive from third-party estimates (Latka, Growjo) and are not audited; the absence of audited
              financials makes verification impossible. The platform integrates with 55+ third-party tools per G2, and
              Articulate's own Reach LMS competes with the broader LMS ecosystem it must also integrate with—a
              structural tension. Enterprise customers running on third-party LMSs have lower switching costs since they
              can swap authoring tools without changing their training infrastructure. A large proportion of
              Articulate's installed base relies on SCORM/xAPI exports to external LMSs, meaning LMS vendors could
              bundle basic authoring capabilities and reduce Articulate's value proposition. The E-Learning Heroes
              community of 1.5M+ members is a meaningful moat and brand amplifier, but this community is tightly coupled
              to Articulate's brand equity; a sustained product quality decline or privacy incident could accelerate
              community defection. Investors including General Atlantic, Blackstone, and ICONIQ Growth received
              approximately 40% equity for $1.5B, implying a fund-cycle timeline pressure beginning in 2021 and maturing
              by 2026–2028 for exits via IPO, secondary sale, or strategic acquisition—none of which has been publicly
              signalled.
            claimRefs:
