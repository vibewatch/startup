      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis makes the valuation reset concrete. Using 2024 ARR of $111.7M as the anchor, the bear
              case applies a 4x multiple and lands at about $446.8M. That outcome assumes meaningful deceleration, weak
              retention, or a market environment that treats Articulate as a mature authoring suite instead of a premium
              workflow platform. The base case applies 7x ARR, landing at roughly $781.9M. This scenario assumes
              Articulate keeps growing in the 20%-30% range, that customer proof on localization and AI translates into
              healthy expansion, and that the company remains attractive to buyers even without public-market liquidity.
              The bull case applies 12x ARR and reaches roughly $1.34B. That outcome requires management to prove that
              Articulate deserves an AI-premium multiple, not merely a category-premium multiple.

              The scenarios are intentionally conservative in one way and generous in another. They are conservative
              because they anchor on disclosed 2024 ARR rather than management's internal 2025 or 2026 run-rate. They
              are generous because even the bull case assumes that buyers will pay above mainstream SaaS medians for
              brand, workflow lock-in, and customer outcomes. The combination is a useful investment test: if the
              company cannot clear the base case with private diligence, the 2021 valuation was likely far too high; if
              it cannot present evidence consistent with the bull case, investors should not price the business as
              though the 2021 premium still stands.

              The key practical takeaway is that every scenario below the 2021 mark still leaves Articulate as a
              valuable, strategically relevant software asset. The question is not survival. The question is whether
              investors today are underwriting a well-defended premium or simply inheriting a five-year- old cycle top.
              On current public evidence, the base case is the most credible anchor.
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
          - type: table
            tableRef: TV003
            claimRefs:
              - CV027
              - CV028
