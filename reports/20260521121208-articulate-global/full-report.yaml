              Post-correction SaaS multiples as of May 2026 are 6–7x for the median public company, and 7–12x for
              high-growth AI-integrated SaaS. At current revenue, Articulate's implied fair value range under 2026
              multiples ($782M–$1.3B for base case) is materially below the 2021 raise price—a potential mark-to-market
              impairment for 2021 investors that may delay or pressure IPO pricing.
