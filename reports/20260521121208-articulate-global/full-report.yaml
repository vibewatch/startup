      - number: '3.4'
        title: Switching Costs, Lock-in, and Moat Durability
        blocks:
          - type: paragraph
            body: >
              Articulate's moat rests on three reinforcing mechanisms: (1) proprietary file formats (Storyline's .story
              files are not portable to rival tools), (2) community gravity (1.5M E-Learning Heroes members, 705,000+
              cited by Growjo, consuming Articulate-specific templates and community support), and (3) the full-suite
              integration premium (authoring + review + LMS + localization + AI in one subscription removes multi-vendor
              complexity).

              Switching costs from Storyline are high and concrete. An enterprise with hundreds of Storyline courses
              cannot migrate to iSpring or Captivate without rebuilding from source files; only SCORM output packages
              are portable, and those cannot be edited in rival tools. Review 360's stakeholder workflow and Reach LMS
              compound the lock-in—once clients integrate Reach into their distribution stack, replacing the authoring
              layer alone is insufficient.

              The 60-day free trial policy lowers entry barriers for new users but also means Articulate's renewal
              stickiness must come from deployment depth, not trial friction. Revenue per employee at $111.7M / ~633
              employees ≈ $176K is consistent with high-retention SaaS at modest sales headcount (Latka reports 53
              quota-carrying reps), suggesting the business is largely retention-driven rather than
              new-logo-acquisition-driven.

              The primary displacement risk is AI commoditization. If generative AI models can convert a slide deck or
              PDF into a structured, on-brand course with branching logic at near-zero marginal cost, the complexity
              ceiling that makes Storyline indispensable erodes. Articulate is addressing this directly with AI
              Assistant (outline generation, quiz creation, image/audio generation, slide generation) and claims 9x
              faster course development. However, new entrants—including vertical AI authoring tools and LMS-native AI
              generation (Docebo Creator)—are building similar capabilities. The risk is that AI assistance becomes
              table-stakes, eliminating Articulate's feature moat and concentrating competition on price, brand, and
              community alone.

              Multi-homing risk is moderate. Professional instructional designers typically specialize in one authoring
              platform and do not switch tools frequently; however, enterprise clients that use a primary LMS with
              native authoring can reduce their Articulate seat count incrementally. The SME-as-author trend (championed
              by Easygenerator, Docebo Creator) is the structural threat: if organizations shift course creation from
              specialist IDs to subject-matter experts, Articulate's premium per-seat pricing may not survive against
              simpler, cheaper, or LMS-bundled alternatives.
