  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition and boundary
        blocks:
          - type: paragraph
            body: >-
              Articulate operates at the intersection of two nested markets: the e-learning authoring tools software
              segment, where it is the category leader, and the broader corporate Learning and Development (L&D) market,
              which constitutes the primary buyer pool. Defining the boundary is analytically critical because
              third-party estimates for the "authoring tools" market range from $807.7 million (Global Growth Insights,
              2025) to $8.9 billion (Future Market Report, 2025) — an 11-fold divergence that reflects fundamentally
              different scope definitions, not different views of the same market.

              The narrower definition (Global Growth Insights) covers dedicated course-authoring software: tools used to
              create, assemble, and publish digital learning content, typically SCORM/xAPI-compliant, for delivery
              through an LMS. Articulate 360 (Storyline, Rise, Review, Reach, Localization) maps directly to this scope.
              The broader definition (Future Market Report) aggregates authoring software with adjacent eLearning
              services, LMS platforms, content libraries, and professional services — a substantially larger addressable
              pool that Articulate touches only at the software layer.

              For valuation and sizing purposes, a defensible approach places the authoring-tools-only TAM at
              approximately $800 million–$1 billion (2025) with a 7–9% CAGR, and the addressable corporate L&D software
              spend — the realistic universe of organizations that could substitute Articulate for competing authoring
              or LMS products — at $5–10 billion. The global corporate training market overall is far larger ($367–$434
              billion) but Articulate targets only the technology layer of it, not the labor or services component.
            claimRefs:
