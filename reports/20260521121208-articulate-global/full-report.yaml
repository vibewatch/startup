      - number: '1.4'
        title: Scale milestones, product momentum, and adverse notes
        blocks:
          - type: paragraph
            body: >-
              Articulate's public record supports a clear chronology from founding through the 2021 capital event and
              into ongoing product development. The company was founded in 2002 with a fully remote workforce model from
              inception, building a 19-year organic growth record before institutional funding. Third-party source Latka
              traces revenue from $29.4 million in 2021 to $84.2 million in 2023 and $111.7 million in 2024—a roughly
