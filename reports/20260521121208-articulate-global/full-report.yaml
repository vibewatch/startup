  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-thesis, and Recommendation
        blocks:
          - type: paragraph
            body: >-
              The valuation question for Articulate is not whether this is a real software company; it is whether the
              existing price anchor is still defendable. The bull case starts with unusually strong operating scale for
              an e-learning authoring platform. Latka reports $111.7M of 2024 ARR, up from $84.2M in 2023, while
              Articulate continues to claim 125,000 organizations, all Fortune 100 companies, and broad global usage.
              That scale is reinforced by a large installed base, deep workflow lock-in around Storyline and Rise, and a
              product suite that now extends beyond authoring into localization, review, and distribution. Customer
              proof from Berkadia, Forbes Travel Guide, Intermountain Health, Questrade, Mondelez, Toro, and Forteorigen
              shows that the platform can save time, cut translation cost, and support enterprise training rollouts at
              scale. Those outcomes matter because they support renewal durability and justify some premium to slower,
              more commoditized learning-software peers.

              The anti-thesis is valuation and disclosure. The July 2021 round priced Articulate at roughly $3.75B,
              which now equates to about 33.6x 2024 ARR and roughly 127.6x 2021 ARR. Even at the 2021 SaaS peak, that
              was extraordinary; against 2026 private-market benchmarks of roughly 3x-7x for mainstream SaaS and 8x-15x
              only for clearly AI-native names, it is difficult to defend without audited retention, profitability, and
              cash-generation evidence. Public learning-software peers are far less forgiving: Docebo trades around
              mid-3x revenue, Udemy reflects near-flat growth, and Skillsoft trades like a stressed asset. Articulate
              likely deserves a premium to those names, but the premium should be measured in a few turns of ARR, not
              tens of turns.

              The result is a research-more recommendation. This is not a pass because the company has enough scale,
              brand, and customer proof to remain strategically valuable. It is also not a track call in the abstract
              because the principal debate is valuation support, not product quality. The right posture is
              price-sensitive and diligence-sensitive: underwrite a fresh range, insist on private financial evidence,
              and only move to buy if management can prove that growth quality, retention, and capital structure support
              a value meaningfully above the base case. Until then, the 2021 mark should be treated as a stale reference
              point rather than a current fair value.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
