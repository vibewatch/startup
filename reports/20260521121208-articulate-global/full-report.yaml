  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              Articulate operates in the e-learning authoring software segment, a corner of corporate L&D that sits
              above pure LMS delivery platforms and below bespoke custom-development agencies. The competitive map
              splits into four bands: (1) direct authoring rivals that compete head-to-head for the same instructional
              designer seat, (2) simplified-authoring entrants targeting subject-matter experts (SMEs) rather than
              professional IDs, (3) adjacent LMS and digital-adoption platforms (DAPs) that substitute for portions of
              Articulate's value chain, and (4) AI-native tools emerging from productivity and generative-AI stacks that
              threaten to commoditize basic course creation.

              Within the direct authoring band, iSpring Suite (60,000+ teams, PowerPoint-native), Adobe Captivate (part
              of the Creative Cloud ecosystem), Easygenerator (50,000+ authors in 2,000+ companies, SME-focused),
              Elucidat (enterprise-scale, team-centric), dominKnow ONE (centralized workflow, US federal contractor),
              and Lectora/Trivantis (~$11.6M estimated revenue, Section 508 focus) are the most relevant named rivals.
              TechSmith Camtasia is an adjacent tool for video-based training that overlaps on screen-simulation use
              cases but lacks multi-module course architecture. None match Articulate's breadth—Storyline + Rise +
              Review + Reach + Content Library + AI Assistant in a single subscription—nor its community flywheel.

              Growjo's competitive table estimates Articulate's nearest authoring peer by revenue as Captivate (~$57.8M
              estimated), Easygenerator (~$35.4M estimated), and IMC AG (~$90.8M estimated, broader scope). These are
              estimates from third-party aggregators and carry significant uncertainty; none of the rivals have
              disclosed audited revenue figures. At $111.7M in 2024 revenue (Latka-reported), Articulate appears to lead
              the authoring-tool segment by a meaningful margin.
