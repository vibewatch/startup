  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Discovery tends to begin with community and peer awareness, then move through low-friction evaluation, authoring
      adoption, broader collaboration and delivery workflows, and finally module expansion into Reach or Localization.
    data:
      nodes:
