              - CV028
              - CV039
      - number: '8.6'
        title: Final Diligence Asks Before Committing Capital
        blocks:
          - type: paragraph
            body: >-
              The remaining diligence asks are not cosmetic. They determine whether Articulate belongs near the base
              case, the bull case, or below both. First, investors need audited 2024 and 2025 financials, including an
              ARR bridge, gross margin, EBITDA, operating cash flow, and cash balance. Third-party revenue estimates are
              useful for triangulation, but they are not an investable foundation for a late-stage valuation decision.
              Second, management must disclose retention quality: NRR, GRR, logo retention, cohort expansion, and
              attach-rate data for products like Localization and Reach. Those metrics determine whether Articulate
              truly deserves a premium multiple or merely looks attractive on top-line growth.

              Third, investors need current cap-table and pricing evidence: any 409A, secondary tender, or board
              valuation work completed since 2021, plus liquidation preferences and investor rights. Without those
              inputs, it is impossible to model real entry economics or downside protection. Fourth, capital deployment
              from the 2021 raise must be explained. If the business still has substantial balance-sheet flexibility,
              that supports optionality; if the cash has already been consumed, the downside from a future financing
              event is larger. Fifth, management should provide a financing and exit plan that ties operating milestones
              to a 2-4 year path toward IPO readiness, secondary liquidity, or strategic sale.

              These asks are exactly why the recommendation is research-more instead of pass. The public case is strong
              enough to justify deeper work, but the public case is not complete enough to close an investment decision.
              Until these data are produced under diligence, Articulate should be viewed as a high-quality company with
              an insufficiently verified price.
            claimRefs:
              - CV042
              - CV043
              - CV044
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV042
              - CV043
              - CV044
              - CV045
