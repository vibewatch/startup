      - number: '3.3'
        title: Adjacent Substitutes and LMS/DAP Overlap
        blocks:
          - type: paragraph
            body: >
              Two substitute categories threaten Articulate from adjacent angles without being head-on authoring
              competitors. Docebo (TSX: DCBO) is a cloud LMS with $210M in 2024 revenue and AI-native content creation
              (Docebo Creator). Its entry-level pricing is $9/user with a 250-user minimum. Docebo occupies the learning
              management and delivery layer; buyers who standardize on Docebo's built-in content creation and
              marketplace (~30,000 courses) face less reason to add Articulate 360 as a separate authoring subscription.
              However, Docebo does not replicate Storyline's interaction engine or Rise's authoring speed—Articulate
              positions its platform as complementary to any LMS, including Docebo.

              Whatfix is a digital adoption platform (DAP) that surfaces as a Storyline competitor in analyst comparison
              lists. DAPs (including Whatfix, WalkMe, and Pendo) deliver in-app guidance overlays and workflow support
              at the point of task execution, which is a different job-to-be-done from course-based learning. However,
              enterprise procurement teams sometimes pit DAPs against Articulate for onboarding, software training, and
              compliance use cases—especially when the business values real-time in-app guidance over seat-based course
              completion. Whatfix explicitly markets against Articulate's Storyline limitations: high content
              maintenance burden, inability to deliver post-training in-app guidance, language management requiring
              manual re-recording, and sensitivity data challenges in screen-and-guidance integration. Whatfix's G2
              rating is 4.6/5 (367+ reviews).

              6sense data shows Canvas LMS with 8.17% market share in the Other Education Tech category, followed by
              Finalsite (6.32%) and Articulate Storyline (6.09%), suggesting Articulate competes in a broad fragmented
              market rather than a category it dominates by share. The community and distribution advantages, however,
              are not captured in domain-count metrics.
