      - number: '1.2'
        title: Governance, leadership, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Articulate is led by Adam Schwartz, who holds the combined title of Founder, CEO, and Executive Chairman—a
              configuration that concentrates product vision, external representation, and board-level authority in a
              single person. Schwartz bootstrapped the company from its 2002 founding through the 2021 Series A without
              any prior institutional funding, a fact corroborated by the Series A announcement, General Atlantic's
              commentary, and multiple third-party data sources. This history presents both a credibility signal—a long
              self-sustaining track record in a competitive category—and a dependency risk, since no public co-founder
              or institutional co-pilot guided strategy through the critical growth years.

              The leadership team listed on the official about page is broad by functional coverage. Lucy Suros serves
              as Vice Chair and was previously named President in earlier coverage. Edwin Scholte holds the combined
              President and CFO role, which merges operational and financial oversight in one executive; this dual role
              is worth flagging as a governance concentration. Other C-suite members include Brian Gil (COO), Angela
              Kiniry (Chief People and Culture Officer), Tom Kuhlmann (Chief Learning Architect—an unusual but
              product-relevant role for a learning tools company), James Welle (CTO), Marie Ma (Chief Legal Officer),
              and Monika Saha (Chief Commercial Officer). Trevor Renfield serves as SVP Finance and Chief Accounting
              Officer.

              Articulate does not publicly disclose its board composition. The three Series A investors—General
              Atlantic, Blackstone Growth, and ICONIQ Growth—would customarily hold board representation following a
              $1.5 billion growth equity round, but this has not been confirmed in any fetched source. Key-person
              dependence on Schwartz remains a material diligence item: no succession path or co-CEO arrangement has
              been publicly described, and the combined CEO-Executive Chairman title gives him both operational and
              governance authority.
