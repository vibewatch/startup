      - number: '2.3'
        title: Buyer segmentation and adoption dynamics
        blocks:
          - type: paragraph
            body: >-
              Articulate serves three primary organizational segments with distinct purchasing dynamics: large
              enterprises with centralized L&D functions (primary revenue driver), mid-market organizations building
              internal training capability, and small-to-medium businesses (SMBs) with limited instructional design
              budgets. The company's case study portfolio — Microsoft (220,000 employees), Intermountain Health
              (70,000), Mondelēz International, Databricks, Berkadia, Forbes Travel Guide, The Toro Company, Questrade —
              skews overwhelmingly toward large enterprise, corroborating the enterprise-first commercial motion.

              Within large enterprises, the buying unit is typically the L&D or HR team, who are end users and
              evaluators; IT is the compliance and integration gatekeeper; and the C-suite (CHRO or CFO) owns budget
              approval for enterprise licensing. The adoption trigger is most often a shift from classroom to digital
              training (remote work acceleration), a compliance-driven training mandate (healthcare, financial services,
              government), or a scalability bottleneck that justifies purpose-built authoring software over manual
              production. Healthcare (Intermountain Health), financial services (Berkadia, Questrade), technology
              (Microsoft, Databricks), consumer goods (Mondelēz, The Toro Company), hospitality (Forbes Travel Guide),
              and government/nonprofit (The Global Fund) are all confirmed active verticals in the published case study
              set.

              The SMB segment is price-sensitive and structurally disadvantaged by Articulate's per-user pricing model
              ($1,749/user/year at the premium tier). Third-party data from Global Growth Insights confirms that 43% of
              buyers cite pricing as the primary deterrent, and 39% of SMEs face challenges from subscription models
              with fluctuating team sizes. This creates a structural ceiling on SMB adoption and leaves the sub-100-seat
              market underserved by Articulate's current commercial model, which competitors such as iSpring (starting
              at $720/year) and EasyGenerator are targeting.
