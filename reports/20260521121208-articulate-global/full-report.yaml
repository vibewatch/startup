      - number: '7.3'
        title: Regulatory, Privacy, and Accessibility Exposure
        blocks:
          - type: paragraph
            body: >
              Articulate operates across 187 countries and processes learner and administrator data at scale, creating a
              substantial regulatory surface. Its privacy notice confirms the collection of usage data, device
              identifiers, cookies, and telemetry; the sharing of data with third-party marketing partners and
              sub-processors; and the purchase of business contact information from data enrichment vendors. The last
              practice creates potential CCPA and GDPR enforcement risk, as purchased third-party contact data requires
              documented legal basis and opt-out mechanisms that may be difficult to verify across data brokers.
              Articulate's GDPR compliance rests on a self-disclosed privacy-by-design mandate and a Data Processing
              Agreement, but no third-party GDPR audit has been publicly disclosed. The company also integrates Google
              reCAPTCHA Enterprise, sharing device and behavioral data with Google under Google's own privacy
              policy—extending the data-sharing surface beyond Articulate's direct control. On regulatory
              certifications, Articulate holds SOC 2, ISO, and FedRAMP authorizations; FedRAMP enables US federal
              government customers, but the specific authorization level (Moderate or High) has not been publicly
              documented, limiting the ability to verify the scope of government access. On ADA/WCAG, the broader SaaS
              landscape saw 478 ADA digital accessibility lawsuits filed in April 2026 alone, with 103 defendants having
              a prior lawsuit. Articulate publishes accessibility conformance reports for Rise (September 2025) and
              Storyline (August 2025) targeting WCAG 2.1 AA, and added an Accessibility Checker to Storyline in Q2 2025.
              The combination of proactive accessibility tooling and certifications reduces—but does not eliminate—
              litigation risk if customer-created content delivered through Articulate platforms fails WCAG
              requirements.
