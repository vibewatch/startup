      - number: '2.2'
        title: TAM, SAM, and market sizing evidence
        blocks:
          - type: paragraph
            body: >-
              The published sizing evidence is materially inconsistent across sources. Two analyst reports that
              ostensibly cover the same product category in the same year (2025) produce estimates of $807.7 million
              (Global Growth Insights) and $8,900.75 million (Future Market Report). At minimum one of these estimates
              is wrong or uses a non-comparable boundary definition. Research and Markets provides a third data point
              (table of contents only — no numeric estimate retrieved from the fetch) for an "E-learning Authoring Tools
              Market" report covering 2020–2035. Neither Global Growth Insights nor Future Market Report discloses its
              primary research methodology, sample frame, or revenue-attribution rules, which makes reconciliation
              impossible from public sources.

              A cross-check against public comparables is feasible for the LMS-adjacent segment: Docebo (LMS, not
              authoring) reports $230 million TTM revenue (2025); Udemy (content marketplace plus authoring-adjacent)
              $790 million TTM (2025); Skillsoft (enterprise learning suite) $510 million TTM (declining). These are
              broader platforms that include services, content, and delivery, so they overstate the pure authoring
              software TAM but bracket Articulate's competitive space. Articulate's implied revenue of $89–$112 million
              (third-party estimates) suggests it holds approximately 10–14% of the narrow authoring-tools market and
              less than 2% of the broader e-learning software TAM.

              The SAM — organizations with 100+ employees, a dedicated L&D function, and an LMS-driven digital training
              workflow — is not directly estimable from public sources but can be inferred: Global Growth Insights
              reports that 63% of companies use authoring tools for internal training, and North America holds 38% of
              the authoring-tools market share. Articulate's reported 125,000 customer organizations across 187
              countries imply meaningful global penetration, but customer concentration in Fortune 500 enterprise
              accounts (all Fortune 100 are customers per company claim) suggests the SOM is weighted toward large
              enterprises paying at the $1,749/user/year price point.
