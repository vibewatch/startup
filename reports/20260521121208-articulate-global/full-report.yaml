      - number: '8.2'
        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Articulate's financing history is unusually simple and unusually consequential. After almost two decades
              of bootstrapping, the company raised a single institutional round in July 2021: a $1.5B Series A led by
              General Atlantic with Blackstone Growth and ICONIQ Capital participation. Tracxn and contemporaneous
              reporting converge on an approximately $3.75B post-money valuation. Latka's 2021 ARR proxy of roughly
              $29.4M implies that the round was struck at about 127.6x ARR, a multiple that only made sense in the most
              euphoric part of the 2021 software market and only if investors believed Articulate could sustain
              extraordinary compounding while preserving the capital efficiency of a bootstrapped business. Using the
              same post-money value against Latka's 2024 ARR series still leaves Articulate at roughly 33.6x current
              ARR.

              That matters because there has been no public re-pricing event since 2021. No new round, secondary tender,
              IPO filing, or public mark has surfaced in fetched evidence through the report date. Growjo and TrueUp
              continue to repeat the old valuation anchor, but those references appear to be database carry-forwards
              rather than fresh price discovery. In valuation terms, Articulate sits in a five-year information gap:
              investors still have the 2021 mark, but the market context beneath that mark has changed radically.
              Aventis pegs the 2021 public SaaS peak near 18.6x, while Windsor Drake and related 2026 benchmark sources
              place current public SaaS closer to 6x-7x and private middle-market SaaS closer to 3x-7x. Even if
              Articulate deserves a quality premium, the 2021 valuation no longer clears against public evidence
              automatically.

              There is, however, a reason not to dismiss the business. Articulate still looks like a scaled platform
              with strategic relevance: official pages show a broad leadership bench, enterprise distribution products,
              localization upsell, and a large customer footprint. Those are the kinds of attributes that can preserve
              exit optionality even after a multiple reset. But absent audited financial statements, retention
              disclosure, or a current 409A or secondary mark, the correct analytical stance is to separate company
              quality from price anchor. The financing history tells investors one thing very clearly: Articulate was
              financed at a peak-cycle premium, and every valuation conclusion in 2026 must test whether that premium
              still deserves to exist.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Comparable Valuation Analysis
        blocks:
          - type: paragraph
            body: >-
              Public comparables show why Articulate should trade above distressed and decelerating peers, but also why
              the 2021 mark is very difficult to justify. Docebo is the cleanest public reference because it remains a
              scaled, enterprise-facing learning platform with public financial disclosure. Macrotrends and
              CompaniesMarketCap imply roughly $0.77B of market capitalization against roughly $0.23B of TTM revenue, or
              about 3.35x EV/revenue, while growth has slowed meaningfully from its 2024 pace. Udemy is larger in
              revenue terms at roughly $0.79B, but its growth profile is barely positive; the public market is not
              rewarding size without durable expansion. Skillsoft is the negative control: meaningful revenue, negative
              growth, heavy leverage, and a market value that implies a distressed sub-1x revenue multiple. Together,
              those comps show that learning-software assets are no longer valued on category membership alone.

              Private-market benchmark sources tell a similar story. Windsor Drake, Livmo, and Aventis all put
              mainstream private SaaS somewhere in the 3x-7x zone, often centering around the mid-4x range. Acquiry
              argues that AI-native software can command 8x-15x ARR, but that premium is conditional on genuine AI
              differentiation and clear growth support. Articulate has enough evidence to argue for a premium over the
              public peer set: 32.7% growth is superior to Docebo, far stronger than Udemy, and dramatically better than
              Skillsoft; customer proof on localization, AI-assisted drafting, and training deployment suggests the
              product creates measurable enterprise ROI; and the suite spans authoring, review, localization, and
              distribution. Even so, nothing in public evidence supports a 30x-plus ARR multiple. A premium to peers is
              defensible; a 2021-style scarcity multiple is not.

              The most defensible comparable range for Articulate today is therefore a disciplined premium band, not a
              nostalgia band. A 6x-12x ARR range captures both sides of the evidence: the low end reflects what the
              market pays for scaled SaaS without exceptional proof, and the high end reflects what a well-positioned,
              still-growing platform might deserve if retention and monetization quality prove stronger than public
              learning peers. That range is materially below the 2021 mark, but it still supports a meaningful
              enterprise value if management can validate the missing inputs.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
