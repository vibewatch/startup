  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Articulate's architecture stacks learner delivery and trust controls above a hybrid authoring base: browser-native
      Rise plus desktop Storyline, surrounded by SaaS collaboration, localization, and distribution services.
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE007
      - CE029
      - CE030
    data:
      layers:
        - label: Learner Experience Layer
          modules:
            - Responsive browser course player
            - Mobile-friendly Rise output
            - Reach learner portal
          detail: >-
            Learners consume training on web/mobile surfaces; delivery can occur through Reach or exported packages in
            external LMS environments.
        - label: Distribution Layer
          modules:
            - Reach 360
            - SCORM export
            - Tin Can / xAPI export
            - AICC export
            - Slack/Teams/Zapier workflows
          detail: >-
            Distribution is either built in through Reach or handed off through standards-based export plus workplace
            integrations.
        - label: Collaboration Layer
          modules:
            - Review 360
            - Folder organization
            - Annotated screenshots
          detail: Stakeholders review drafts in context without paid reviewer seats, reducing approval friction.
        - label: Authoring Layer
          modules:
            - Rise 360
            - Storyline 360
            - Content Library 360
          detail: >-
            Rise handles fast cloud authoring while Storyline handles complex desktop interactions and timeline-driven
            behavior.
        - label: AI Services Layer
          modules:
            - AI Assistant
            - AI Course Drafts
            - AI narration
            - AI image editing
            - Localization AI
          detail: >-
            AI is embedded across drafting, media generation, translation, and editing instead of being a separate
            platform.
        - label: Trust & Compliance Layer
          modules:
            - SOC 2
            - ISO 27001
            - ISO 42001
            - FedRAMP
            - GDPR posture
            - Accessibility reports
          detail: >-
            Enterprise trust controls and privacy/accessibility documentation sit underneath the full authoring-delivery
            workflow.
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      Typical enterprise workflow from source content through AI-assisted authoring, review, localization, distribution,
      and learner tracking.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
    data:
      nodes:
        - id: N1
          label: Content input
          detail: Author starts from documents, slides, or source material in Rise, Storyline, or AI Course Drafts.
        - id: N2
          label: AI-assisted authoring
          detail: AI Assistant helps generate outlines, content blocks, questions, narration, captions, images, and drafts.
        - id: N3
          label: Course review
          detail: Review 360 gathers SME and stakeholder comments in context without requiring reviewer subscriptions.
        - id: N4
          label: Localization (optional)
          detail: Localization translates courses into 80+ languages and routes validator review before release.
        - id: N5
          label: Distribution
          detail: Publish to Reach 360 or export standards-based packages to an external LMS.
        - id: N6
          label: Learner access & tracking
          detail: Learners complete training on any device while admins monitor Reach dashboards or external LMS analytics.
      edges:
        - from: N1
          to: N2
          label: draft
        - from: N2
          to: N3
          label: review
        - from: N3
          to: N4
          label: translate when needed
        - from: N4
          to: N5
          label: publish localized version
        - from: N3
          to: N5
          label: publish original version
        - from: N5
          to: N6
          label: deliver
