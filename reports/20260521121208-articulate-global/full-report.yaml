            body: |
              Articulate's AI strategy is notable because it is embedded into the existing authoring workflow
              instead of being sold as a separate add-on platform. Q1 2025 introduced AI Writer improvements and
              AI-generated assessment items, extending AI from drafting assistance into interactive question
              creation. Q2 2025 moved into narration and accessibility with AI text-to-speech, richer voice
              selection, and transcript generation. Q3 2025 expanded the scope again with AI Course Drafts,
              letting users generate course structure from prompts or source material, plus Custom Block and
              localization improvements.

              The cadence continued in Q4 2025 with text-to-speech translation and better Review collaboration,
              then in Q1 2026 with AI image editing in Storyline, Sync Timelines with Audio, AI-generated theme
              colors, localizable timelines, and custom-block localization. Customer proof mirrors that roadmap:
