chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and business model
        blocks:
          - type: paragraph
            body: >-
              Articulate Global, LLC is a software company headquartered at 244 5th Avenue, Suite 2960, New York, NY
              10001, operating as a 100% remote-first organization that has maintained a distributed workforce since its
              2002 founding— nearly two decades before remote work became mainstream. The company's legal entity name,
              Articulate Global, LLC, appears in its own privacy notice and contrasts with the consumer-facing brand
              Articulate. The company describes its mission as empowering people to live better lives through
              accessible, high-quality workplace learning technology.

              The core product is Articulate 360, a subscription-based platform that bundles authoring, collaboration,
              distribution, and translation tools. It includes Rise for responsive block-based course authoring,
              Storyline for custom interactive content creation, Review for stakeholder collaboration and feedback
              management, Reach as an integrated lightweight LMS, and Localize for AI-powered translation into 80+
              languages. Pricing as of May 2026 is published at $1,749 per user per year for the Teams plan and $1,449
              per user per year for the Personal plan, placing the product in the premium-SaaS tier for learning
              authoring tools. A 30-day free trial with no credit card required lowers acquisition friction. Community
              network effects reinforce the product: the E-Learning Heroes Community has grown to over 1.5 million
              members and serves as both a support and low-cost acquisition channel.

              By the most recent official company counts, Articulate serves more than 125,000 organizations, 133 million
              learners across 187 countries, and counts all 100 Fortune 100 companies as customers. G2 rated Articulate
              the #1 Best Software for Enterprise Businesses in its 2026 Best Software Awards, based on verified
              customer reviews from calendar year 2025, and ranked Articulate 360 ninth globally out of 180,000 products
              in the G2 Winter 2026 Report with a score of 97.29 out of 100. The AI Assistant is integrated across Rise
              and Storyline and claims course creation speeds up to nine times faster versus manual workflows.
