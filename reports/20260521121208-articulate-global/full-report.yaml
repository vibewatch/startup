      - number: '8.5'
        title: Exit Readiness and Final Recommendation
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is good enough to matter but not good enough to underwrite an immediate premium liquidity
              event. Articulate has genuine strategic attributes: a large installed base, strong brand recognition in
              corporate learning, a broader suite than point authoring tools, and customer proof across enterprise
              training, localization, and customer education. Those ingredients support three realistic paths. First, a
              delayed IPO remains possible if management can produce audited financials, durable retention metrics, and
              a cleaner public governance story. Second, a sponsor-to-sponsor secondary is plausible given the 2021
              investor base and the age of the current mark. Third, strategic acquirers in the learning, HCM, and
              enterprise-software stack could find Articulate attractive because it brings content creation,
              localization, and training distribution into one asset. Names such as Microsoft, SAP SuccessFactors,
              Cornerstone, or Degreed fit the profile, even if no transaction evidence points to an active process
              today.

              The limiting factor is opacity. Public sources do not provide audited revenue, gross margin, EBITDA, NRR,
              or clear board-level governance detail. Without those, an IPO argument is incomplete, and even a strategic
              buyer would likely value the asset with more caution than the 2021 round did. That is why the
              recommendation remains research-more rather than buy. The company is too strong to dismiss, but the
              valuation case is too indirect to underwrite confidently. Risk should be treated as high because a stale
              mark, absent financial disclosure, and possible down-round dynamics can all impair returns even if the
              operating business remains healthy. Confidence should be treated as low-medium because the public evidence
              base supports a range, not a precise number.

              For an investment committee, the actionable interpretation is straightforward: do not anchor on the 2021
              post-money value, do not confuse product quality with price support, and do not advance to a buy
              recommendation until management closes the core evidence gaps. A smaller but still premium value can be
              defended; the historic price cannot.
            claimRefs:
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
          - type: table
            tableRef: TV005
            claimRefs:
              - CV032
              - CV033
              - CV039
              - CV040
              - CV041
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV001
