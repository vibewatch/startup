      - number: '1.3'
        title: Capital base and investor map
        blocks:
          - type: paragraph
            body: >-
              Articulate closed a $1.5 billion Series A in August 2021—consistently described across multiple sources as
              one of the largest Series A rounds ever for a software company. The round was led by General Atlantic with
              co-participation from Blackstone Growth and ICONIQ Growth. American Entrepreneurship reported the
              post-money valuation at $3.75 billion; Latka, Growjo, Tracxn, and TrueUp independently report $3.8
              billion—the slight variance ($3.75B vs $3.8B) is likely rounding. Latka estimates approximately 40% of
              equity was sold in the transaction, implying a significant dilution rather than a minority-stake
              arrangement.

              The funding backstory is exceptional: Articulate bootstrapped for approximately nineteen years with no
              institutional capital before the 2021 round. Anton Levy, Co-President and Global Head of Technology
              Investing at General Atlantic, was quoted as saying: "It's rare that a company achieves the level of
              success Articulate has without any prior institutional backing. On key measures including industry
              leadership, transformative technology, customer NPS, employee happiness, and sustained growth, Articulate
              has established itself as a leader and innovator." Adam Schwartz stated the company selected its investors
              for their "combined strengths, including deep operational expertise, proven experience growing cloud-based
              SaaS companies, and an extensive network of resources to help us scale rapidly."

              General Atlantic, Blackstone Growth, and ICONIQ Growth represent premier growth equity franchises. General
              Atlantic manages over $70 billion in assets globally and has extensive SaaS portfolio experience.
              Blackstone Growth is the growth equity vehicle of the world's largest alternative asset manager. ICONIQ
              Growth invests in technology companies with capital from some of the world's wealthiest individuals and
              institutions. No additional funding rounds are evidenced after the 2021 Series A in any fetched source,
              placing total lifetime funding at $1.5 billion.
