              conflict is material for financial modeling and is a first-order diligence ask for any fund doing primary
              work.

              Headcount discrepancies across third-party sources are equally notable: Latka reports 633 employees
              (November 2025), Growjo reports 509, and TrueUp reports approximately 400. The roughly 1.6x variance
              between estimates signals that none of these figures is derived from audited payroll data. All should be
              treated as directional indicators rather than definitive counts until verified with internal HR records.
              The company's Glassdoor and culture signals are positive—Inc. Magazine named Articulate to its Best
              Workplaces 2024 list—but culture recognition does not substitute for operational data room access.

              On product momentum: quarterly feature releases through 2025 and Q1 2026 show continuous AI integration
              (Magic Import, AI Course Drafts, AI Image Generation, AI Chat), accessibility improvements (Likert Scale
              Accessibility, equation editor), and localization enhancements (Custom Block Localization, Text-to-Speech
              Translation). Trust certifications include SOC 2, ISO, FedRAMP, and GDPR. The FedRAMP certification is a
              meaningful enterprise and government sales enabler. No public lawsuits, sanctions, regulatory orders, or
              material governance incidents have been identified in the research cache; the company's private structure
              limits disclosure obligations, so absence of evidence is not evidence of absence.
