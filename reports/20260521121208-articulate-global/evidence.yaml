evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: Audited financial statements or SEC-equivalent filings for Articulate Global, LLC
    whyItMatters: >-
      Third-party revenue estimates range from $89.1M (Growjo) to $111.7M (Latka) for the same period—a 25% variance. No
      underwriting model can rely on this range without primary data room access. Revenue recognition policy, contract
      structure, and gross margin are all unknown.
    diligencePath: >-
      Request audited P&L statements for FY2022–FY2024; if unavailable, obtain unaudited management accounts with
      revenue breakdown by product line and geography.
    relatedQuestionRefs:
      - QO006
      - QO018
      - QO019
  - type: private-evidence-only
    severity: blocking
    topic: governance
    missingEvidence: Post-Series A cap table, board composition, investor governance rights, and consent provisions
    whyItMatters: >-
      The board composition after a $1.5B growth equity round materially affects decision-making authority, exit
      flexibility, and downside protections. None of this is publicly disclosed. The Schwartz CEO-Executive Chairman
      title may conflict with standard investor governance norms.
    diligencePath: >-
      Obtain board composition, shareholder agreement summary, investor rights agreement, and any drag-along or ROFR
      provisions from the company directly.
    relatedQuestionRefs:
      - QO020
      - QO028
  - type: missing-source
    severity: material
    topic: adverse events
    missingEvidence: >-
      Independent investigative journalism, court records, or regulatory filings referencing Articulate Global in an
      adverse context
    whyItMatters: >-
      No adverse events have been identified, but Articulate's private status means it has no public reporting
      obligation. A structured adverse-search (court records, PACER, FOIA, employment databases) is needed before
      concluding a clean record.
    diligencePath: >-
      Run PACER search for "Articulate Global LLC"; check EEOC public complaint data; query state employment commission
      records in New York.
    relatedQuestionRefs:
      - QO020
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Verified payroll headcount from HR system or audited employer records for Articulate Global, LLC
    whyItMatters: >-
      Headcount estimates span 400–633 across three sources, a 58% variance. Headcount is an input to revenue-
      per-employee multiples and operational capacity modeling; the uncertainty materially affects those models.
    diligencePath: Request HR system export (active full-time employees) and contractor count as of the most recent quarter.
    relatedQuestionRefs:
      - QO008
      - QO023
  - type: private-evidence-only
    severity: material
    topic: leadership completeness
    missingEvidence: >-
      Full board composition, tenure history, compensation disclosures, and biographies for all VP-level and above
      executives at Articulate Global, LLC
    whyItMatters: >-
      The leadership table (TO002) is partial: VP-level and above staff visible on the official About page are included,
      but no board roster, governance committee membership, or executive departure history is publicly disclosed.
      Key-person dependence and succession planning cannot be assessed without this data.
    diligencePath: >-
      Request an org chart of all VP+ executives; ask for board composition and any investor board-seat agreements from
      the Series A; check LinkedIn tenure data for leadership stability signals.
    relatedQuestionRefs:
      - QO001
      - QO021
      - QO028
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: investor cap table completeness
    missingEvidence: >-
      Full cap table including all investors, ownership percentages, share classes, investor-rights provisions, and any
      secondaries or co-investment vehicles associated with the 2021 Series A round
    whyItMatters: >-
      The stakeholder-or-investor-map table (TO003) is partial: investor identities are drawn from press coverage and
      third-party databases but ownership stakes, governance rights, and any secondary transactions are undisclosed.
      Material board-consent provisions and anti-dilution terms are unknown.
    diligencePath: >-
      Request cap table as of the most recent quarter from the company; obtain the Series A term sheet or shareholder
      agreement summary; check SEC EDGAR for any related entities that may have reporting obligations.
    relatedQuestionRefs:
      - QO002
      - QO013
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: milestone completeness
    missingEvidence: >-
      Official contemporaneous records of exact product launch dates, contract signing dates with named Fortune 500
      customers, and private financing details for Articulate Global
    whyItMatters: >-
      The milestone table (TO004) relies on secondary sources and inferred dates for several key events (Rise 360 launch
      date, Storyline 2 launch, early customer wins). Without official records, the chronology cannot be verified, and
      key adverse or confidential events (litigation, leadership changes, failed partnerships) may be absent.
    diligencePath: >-
      Request official product release notes and dated blog posts from the company; obtain press release archive and
      investor updates; use PACER and state court records to check for undisclosed adverse events.
    relatedQuestionRefs:
      - QO005
      - QO016
      - QO022
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: net revenue retention
    missingEvidence: Net revenue retention (NRR), gross revenue retention, and customer cohort data for Articulate 360
    whyItMatters: >-
      NRR is the single most important SaaS quality metric. At $1,749/user/year premium pricing, expansion within
      existing accounts could be the primary growth driver—but this is entirely unknown from public sources.
    diligencePath: Request cohort analysis by ARR and customer segment; ask for NRR by SMB vs enterprise cohort and by geography.
  - type: missing-source
    severity: blocking
    topic: SAM and SOM sizing
    missingEvidence: >-
      No published analyst report in the fetched source set provides a SAM (Serviceable Addressable Market) or SOM
      (Serviceable Obtainable Market) estimate for the authoring-tools segment with disclosed methodology. The TAM
      estimates ($807.7M vs. $8.9B) are irreconcilable without a clear scope definition.
    whyItMatters: >-
      Without a credible SAM estimate, Articulate's implied market penetration and headroom cannot be quantified from
      public sources. Valuation models that rely on TAM × penetration assumptions are sensitive to which TAM estimate is
      used; the 11× discrepancy creates a 11× sensitivity in any growth-multiple model.
    diligencePath: >-
      Commission or obtain a market research report with explicit scope definitions and primary survey data;
      alternatively, build a bottom-up SAM from Articulate's disclosed customer count (125K orgs) × industry average
      seat count × average ACV.
    relatedQuestionRefs:
      - QM001
      - QM002
      - QM027
      - QM028
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: blocking
    topic: market sizing methodology
    missingEvidence: >-
      Neither Global Growth Insights nor Future Market Report discloses primary research methodology, sample frame, or
      how revenue is attributed for the authoring tools category. The scope overlap between authoring tools and
      LMS/content platforms is undefined in both reports.
    whyItMatters: >-
      The TAM discrepancy ($807.7M vs. $8.9B) is unresolvable from public sources. Any investor model that anchors on
