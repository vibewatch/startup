  - id: TM004
    title: Growth drivers and constraints table
    description: >-
      Catalogs the key drivers and constraints for eLearning authoring tool adoption, with direction,
      timing, implication for Articulate, and the diligence ask.
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication for Articulate
      - Diligence ask
    rows:
      - - AI integration in course authoring (AI Course Drafts; AI Image; AI Chat)
        - driver
        - current (2024–2026; active)
        - 42% of authoring tool providers integrate AI; 34% of new tools added AI modules; direct product differentiation lever; Articulate Q1–Q4 2025 AI releases respond directly
        - How many Articulate 360 users have activated AI features? Does AI feature usage correlate with renewal or expansion rates?
      - - Remote and hybrid work structural shift
        - driver
        - current (structural since 2020)
        - Replaces classroom training with digital content; benefits all authoring tool vendors; Articulate cloud-first model aligns structurally
        - What share of Articulate new customer additions since 2020 are greenfield vs. competitive win?
      - - Digital upskilling imperative (68% orgs upskill over hire)
        - driver
        - medium-term (2024–2028)
        - Increases enterprise L&D budget allocation; benefits authoring market broadly; favorable for Articulate enterprise pricing tier
        - Is there revenue correlation between Articulate customer ACV and L&D budget size by segment?
      - - Regulatory and compliance training mandates
        - driver
        - current and ongoing
        - Healthcare (HIPAA); financial services (FINRA; AML); government (FedRAMP) all require digital audit trails; Articulate Reach analytics and FedRAMP status are direct competitive advantages
        - What percentage of Articulate revenue comes from regulated-sector customers?
      - - E-learning CAGR 11.2% in corporate training sub-segment (Wifitalents)
        - driver
        - medium-term (2023–2030)
        - Industry tailwind benefits all vendors; magnitude supports premium pricing sustainability
        - Does Articulate revenue growth track or exceed the e-learning sub-segment CAGR?
      - - High per-user pricing ($1,749/user/year)
        - constraint
        - current (structural)
        - Primary deterrent for 43% of buyers; SMB ceiling; creates competitive opening for iSpring ($720/year) and open-source tools; affects international markets
        - What is Articulate SMB churn rate vs. enterprise? Is there a lower-priced tier in roadmap?
      - - LMS integration complexity (39% face issues)
        - constraint
        - current (ongoing)
        - Integration friction with legacy LMS increases time-to-value and churn risk; affects 39% of deployments per GGI data
        - What is Articulate average time-to-value by LMS type? Which LMS integrations drive the most support tickets?
      - - Learning curve for advanced features (49% first-time users report difficulty)
        - constraint
        - current (structural)
        - Storyline script-based interactivity has a known steeper learning curve; 28% of training teams report reduced productivity; affects SMB and first-time L&D buyers
        - What is Articulate trial-to-paid conversion rate by user experience level?
      - - iSpring ranked above Articulate by eLearning Industry; priced at $720/year
        - constraint
        - current (active competitive threat)
        - Price gap creates substitution risk especially for cost-sensitive mid-market buyers; iSpring serves 61,000+ clients
        - What is Articulate win/loss rate vs. iSpring in head-to-head evaluations?
      - - Skillsoft revenue declining (−2.9% YoY); Udemy growth slowing (1.2% YoY)
        - constraint (adverse market signal)
        - current
        - Enterprise e-learning adjacent market shows pricing pressure and substitution; may signal budget reallocation away from learning tools broadly
        - Is Articulate pipeline for 2025–2026 expanding or contracting vs. prior year?
      - - SME subscription challenges (39% of SMEs report difficulties with fluctuating team sizes)
        - constraint
        - current (structural)
        - Per-seat pricing model creates cancellation and downgrade pressure at renewal for small customers
        - What percentage of Articulate ARR is at risk from SMB tier downgrades at renewal?
    notes: >-
      Driver and constraint magnitudes are sourced from Global Growth Insights, WorldMetrics, Wifitalents,
      and Gitnux — all third-party statistics aggregators without disclosed primary research methodology.
      Treat all percentage figures as directional indicators. iSpring pricing is from iSpring's own marketing
      page and eLearning Industry ranking is from that publication's editorial list — both promotional.
    claimRefs:
      - CM021
      - CM022
      - CM023
      - CM024
      - CM025
      - CM026
      - CM027
      - CM028
      - CM029
      - CM030
    enumerationScope:
      coverage: partial
      basis: >-
        Driver and constraint rows are synthesized from multiple third-party sources; no single authoritative
        source covers all factors. The regulatory mandates row is inferred from Articulate FedRAMP status
        and case study evidence from regulated sectors.

figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    layout: standard
    summary: >-
      Three nested market layers show Articulate's positioning: the narrow authoring-tools software market
      (~$800M–$1B) as the core addressable market, the corporate L&D software market as the mid-layer context,
      and the total corporate training market ($367–$434B) as the outer industry frame. Articulate competes
      only at the authoring-software layer.
    data:
      nodes:
        - id: N1
          label: Total corporate training market (outer frame)
          value: $367–$434B (2022–2023)
          sublabel: All spend including labor; services; facilities; digital tools
          note: 'Sources: Wifitalents ($367B 2022); WorldMetrics ($434B 2023). Authoring software is a small fraction.'
        - id: N2
          label: Corporate L&D software (SAM context)
          value: $5–10B (estimated)
          sublabel: 'Docebo $230M + Udemy $790M + Skillsoft $510M + authoring ~$1B; includes services'
          note: Public-company comparable bracket; Articulate competes at authoring layer only.
        - id: N3
          label: E-learning authoring tools software (narrow TAM)
          value: $800M–$1B (2025)
          sublabel: Dedicated SCORM/xAPI/HTML5 authoring software; Global Growth Insights $807.7M
          note: 'GGI: $807.7M (2025; 7% CAGR 2026–2035). FMR upper bound $8.9B likely includes services.'
        - id: N4
          label: Articulate Global estimated revenue
          value: $89–$112M (2024; third-party estimates)
          sublabel: Implied 10–14% share of narrow authoring TAM
          note: 'Latka: $111.7M; Growjo: $89.1M — unaudited; range reflects third-party conflict.'
    claimRefs:
      - CM001
      - CM002
      - CM004
      - CM005
      - CM010
    approximationNotes: >-
      The SAM layer value is a derived estimate using public-company revenue as brackets, not a published
      market estimate. The pyramid apex-to-base order is Articulate (smallest) to total training (largest).
      FM001 uses a different claim subset from TM002 to provide a distinct nested lens (outer industry
      frame vs. sizing estimates table).

