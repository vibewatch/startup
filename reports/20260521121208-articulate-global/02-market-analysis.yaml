      Fit ratings are qualitative assessments based on case study evidence and pricing analysis.
      Budget sensitivity is inferred from publicly available pricing and buyer behavior data.
      FM003 includes additional constraint claims (CM025, CM029) not in TM003 to provide a distinct
      risk-and-fit lens on the same segments.

  - id: FM004
    title: Adoption funnel or value-chain map
    type: funnel
    layout: standard
    summary: >-
      The enterprise adoption funnel for Articulate 360 shows four stages from awareness to renewal.
      Primary drop-off risk occurs at integration (LMS compatibility friction) and renewal (price sensitivity
      in mid-market). The funnel reflects the typical enterprise SaaS buying motion at $1,749/user/year.
    data:
      items:
        - label: Awareness and discovery
          value: 100
          note: 'Discovery paths: E-Learning Heroes community (1.5M+ members); G2 (#9 of 180K products; 97.29/100); eLearning Industry top lists; word-of-mouth. 63% of companies report using authoring tools — most evaluate Articulate at some point.'
        - label: Trial and evaluation (30-day free trial)
          value: 65
          note: 'Articulate 360 offers a 30-day free trial. Drop-off occurs for SMB (price shock at end of trial) and for Storyline advanced features (49% of first-time users report difficulty).'
        - label: Procurement and contracting
          value: 40
          note: 'Enterprise procurement requires IT security review (SOC 2; ISO; FedRAMP for government); vendor risk assessment; and multi-seat contract negotiation. Mid-market often exits here to lower-cost alternatives.'
        - label: LMS integration and onboarding
          value: 30
          note: '39% of organizations face LMS integration challenges. Articulate publishes SCORM/xAPI/cmi5 export; compatibility with legacy LMS (Cornerstone; SAP SuccessFactors) requires IT resources. Time-to-value is the key onboarding metric.'
        - label: Active use and seat expansion
          value: 25
          note: 'Databricks model: 30+ employees across departments as authors. Expansion is the key revenue driver. Enterprise seat expansion is the primary growth motion for SaaS at this price tier.'
        - label: Renewal and retention
          value: 20
          note: '94% of employees stay longer when employers invest in training — creates organizational stickiness. Enterprise retention is structurally high due to content lock-in (existing SCORM library). Mid-market churn risk is higher at renewal due to budget pressure.'
    claimRefs:
      - CM009
      - CM018
      - CM022
      - CM023
      - CM025
      - CM027
    approximationNotes: >-
      Funnel stage values are relative index scores (100 = full awareness pool), not actual deal counts.
      Articulate does not disclose funnel conversion rates; values are inferred from industry benchmarks
      (SaaS enterprise conversion 1–5%, trial-to-paid rates) and case study evidence. SMB funnel would
      show steeper drop-off at trial-to-paid stage.

