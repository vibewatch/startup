    rows:
      - - Large Enterprise (>1,000 employees)
        - L&D Director / Instructional Design Manager
        - Instructional designers; L&D specialists
        - HR / L&D budget; sometimes IT
        - CHRO / VP of People
        - Scale of digital training program; compliance mandate; remote-first workforce
        - Strong — all Fortune 100 are customers
      - - Mid-Market (100–1,000 employees)
        - HR Manager / L&D Lead
        - HR generalists; subject-matter experts as course creators
        - HR operational budget
        - CEO / COO (cost efficiency)
        - Replacing classroom training; onboarding automation; headcount growth
        - Moderate — price gap vs. iSpring creates churn risk
      - - Healthcare and Life Sciences
        - Clinical Education Director; Compliance Officer
        - Clinical trainers; compliance teams
        - Hospital system IT and HR budget
        - CIO / CHRO
        - Regulatory compliance (HIPAA, clinical protocols); multi-site staff training
        - Strong — Intermountain Health case study; FedRAMP authorization
      - - Financial Services
        - Compliance Officer; L&D Manager
        - Risk and compliance teams; new hire trainers
        - Compliance and HR budget
        - CCO / CHRO
        - Regulatory mandate (SEC, FINRA, AML); digital audit trail requirements
        - Strong — Berkadia; Questrade case studies confirmed
      - - Technology and Software
        - L&D Manager; Customer Success Lead
        - Instructional designers; CS team members
        - L&D and Customer Success budget
        - VP of Engineering / VP of CS
        - 'Scale training without scaling L&D headcount (Databricks: 30+ dept. authors)'
        - Strong — Databricks; Microsoft case studies confirmed
      - - Consumer Goods and Manufacturing
        - Director of Training; Operational Excellence Lead
        - Field trainers; plant managers; distributors
        - Operations or HR budget
        - COO / VP of Operations
        - Distributed workforce; franchise/distributor training at scale (Toro; Mondelēz)
        - Strong — Toro Company; Mondelēz case studies confirmed
      - - Government and Nonprofit
        - Training Director; Program Officer
