    rows:
      - - E-learning authoring software (narrow TAM)
        - Standalone and cloud-based authoring tools; SCORM/xAPI/HTML5 course creation software
        - LMS platforms; content libraries; L&D services; instructional design labor
        - L&D team (buyer and user); HR / CHRO (budget approver)
        - Core addressable market; Articulate 360 competes directly; ~$800M–$1B (2025)
      - - Corporate L&D software (mid-layer SAM context)
        - Authoring tools + LMS platforms + content marketplaces + LXP platforms
        - L&D staffing; external training vendors; classroom facilitation
        - HR / L&D; IT (security and integration); CFO (budget)
        - Articulate competes at authoring layer; Docebo/Udemy cover LMS/content; SAM overlap
      - - Global corporate training (broad context)
        - All employee training spend including digital tools; content; services; labor; facilities
        - General HR software; recruiting; performance management
        - CHRO; line-of-business leaders; procurement
        - Total industry context only; Articulate captures only the software sub-slice ($367–$434B overall)
      - - AI training and content automation
        - AI-powered course generation; adaptive learning; simulation authoring; AI coaching tools
        - AI-enhanced LMS delivery; HR analytics platforms
        - L&D teams adopting AI authoring tools; IT gatekeeping AI data governance
        - Adjacent fast-growing layer; Articulate AI Course Drafts and AI Image Generation enter this space
      - - Government and regulated-sector e-learning
        - FedRAMP-authorized authoring and delivery platforms for US federal agencies
        - Unclassified training content creation by external vendors
        - Federal IT security officers; agency HR; procurement officers
        - FedRAMP authorization unlocks this segment; differentiated from most competitors
    notes: >-
      The "narrow" authoring-tools scope is most directly comparable to Global Growth Insights ($807.7M 2025)
      and excludes the LMS/content/services components that inflate the Future Market Report estimate to $8.9B.
      Articulate's TAM for valuation purposes should use the narrow definition unless blended revenue sources
