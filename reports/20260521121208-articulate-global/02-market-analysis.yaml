  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: SAM and SOM sizing
      missingEvidence: >-
        No published analyst report in the fetched source set provides a SAM (Serviceable Addressable Market)
        or SOM (Serviceable Obtainable Market) estimate for the authoring-tools segment with disclosed
        methodology. The TAM estimates ($807.7M vs. $8.9B) are irreconcilable without a clear scope
        definition.
      whyItMatters: >-
        Without a credible SAM estimate, Articulate's implied market penetration and headroom cannot be
        quantified from public sources. Valuation models that rely on TAM × penetration assumptions are
        sensitive to which TAM estimate is used; the 11× discrepancy creates a 11× sensitivity in any
        growth-multiple model.
      diligencePath: >-
        Commission or obtain a market research report with explicit scope definitions and primary survey
        data; alternatively, build a bottom-up SAM from Articulate's disclosed customer count (125K orgs)
        × industry average seat count × average ACV.
      relatedQuestionRefs:
        - QM001
        - QM002
        - QM027
        - QM028
      relatedTableRefs:
        - TM002

    - type: conflicting-data
      severity: blocking
      topic: market sizing methodology
      missingEvidence: >-
        Neither Global Growth Insights nor Future Market Report discloses primary research methodology,
        sample frame, or how revenue is attributed for the authoring tools category. The scope overlap
        between authoring tools and LMS/content platforms is undefined in both reports.
      whyItMatters: >-
        The TAM discrepancy ($807.7M vs. $8.9B) is unresolvable from public sources. Any investor model
        that anchors on one estimate without noting the 11× spread creates material valuation risk.
      diligencePath: >-
        Obtain primary analyst reports from Mordor Intelligence, Grand View Research, or MarketsandMarkets
        with disclosed methodology; cross-check against publicly disclosed revenue from Docebo, Udemy,
        and Skillsoft.
      relatedQuestionRefs:
        - QM001
        - QM002
        - QM003
      relatedTableRefs:
        - TM002

    - type: private-evidence-only
      severity: material
      topic: Articulate revenue by segment
      missingEvidence: >-
        Revenue breakdown by buyer segment (enterprise vs. mid-market vs. SMB), by geography, and by
        product line (Storyline vs. Rise vs. Reach vs. Localization) is not publicly disclosed by Articulate.
      whyItMatters: >-
        Without segment-level revenue data, it is impossible to determine whether Articulate's growth is
        driven by enterprise seat expansion (high-NRR, high-quality growth) or mid-market new-logo acquisition
        (higher churn risk). Pricing constraint analysis and competitive risk assessment are both impaired.
      diligencePath: >-
        Request ARR by customer cohort (enterprise vs. SMB), NRR by segment, and ACV distribution from
        the data room.
      relatedQuestionRefs:
        - QM010
        - QM014
        - QM015
      relatedTableRefs:
        - TM003

    - type: missing-source
      severity: material
      topic: win-loss data
      missingEvidence: >-
        No independent published source provides Articulate win-loss data against specific competitors
        (iSpring, EasyGenerator, Adobe Captivate, Elucidat) in enterprise evaluations.
      whyItMatters: >-
        iSpring being ranked above Articulate by eLearning Industry, combined with a 58% lower price
        point, suggests competitive pressure is real. Without win-loss data, the actual share of
        evaluations where price or feature gaps cause Articulate to lose cannot be estimated.
      diligencePath: >-
        Request from Articulate: win-loss rate by competitor name, deal count, and ACV for the last 12
        months; supplement with third-party surveys (G2 buyer intent data, TrustRadius peer comparisons).
      relatedQuestionRefs:
        - QM017
        - QM018
        - QM026
      relatedTableRefs:
        - TM004

    - type: private-evidence-only
      severity: material
      topic: net revenue retention
      missingEvidence: >-
        Articulate's NRR, gross revenue retention, and customer churn rate are not publicly disclosed.
        These are the essential SaaS quality metrics for assessing whether growth is driven by retention
        and expansion or primarily by new-logo acquisition.
      whyItMatters: >-
        At $1,749/user/year, enterprise content lock-in (existing SCORM library) should produce high NRR.
        But mid-market churn sensitivity to pricing and feature gaps could offset enterprise stickiness.
        Without NRR data, growth quality cannot be assessed from public sources.
      diligencePath: >-
        Request NRR, GRR, logo churn, and seat expansion rates segmented by customer size (enterprise vs.
        SMB) and vintage cohort from the data room.
      relatedQuestionRefs:
        - QM015
        - QM026
