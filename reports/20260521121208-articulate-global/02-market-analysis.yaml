  - id: FM003
    title: Buyer / segment map
    type: matrix
    layout: standard
    summary: >-
      A matrix of buyer segments against key purchasing dimensions reveals that Articulate is strongly
      positioned in large enterprise and regulated sectors but structurally disadvantaged in SMB due to
      price point, and faces competitive risk in mid-market from iSpring and EasyGenerator.
    data:
      columns:
        - label: Budget sensitivity
          key: budget
        - label: Compliance driver
          key: compliance
        - label: AI readiness
          key: ai
        - label: Articulate fit
          key: fit
        - label: Key competitive risk
          key: risk
      rows:
        - label: Large Enterprise (>1,000 emp.)
          values:
            - Low (ample L&D budget)
            - High (HIPAA; FINRA; FedRAMP; ADA)
            - High (early AI feature adopters)
            - Strong — all Fortune 100 are customers
            - Content lock-in reduces but embedded LMS pressure grows
        - label: Mid-Market (100–1,000 emp.)
          values:
            - Medium (per-seat pricing sensitive)
            - Medium (varies by sector)
            - Medium (willing; slower IT approval)
            - Moderate — price gap vs. iSpring creates churn risk
            - iSpring ($720/yr) and EasyGenerator win on price
        - label: Healthcare and Life Sciences
          values:
            - Medium-High (compliance justifies spend)
            - Very High (HIPAA; clinical; EHR)
            - Low-Medium (data governance slows AI)
            - Strong — Intermountain Health; FedRAMP authorized
            - Data sovereignty and AI compliance approval delays
        - label: Financial Services
          values:
            - High (compliance mandated)
            - Very High (SEC; FINRA; AML; audit trail)
            - Medium (regulated AI use)
            - Strong — Berkadia; Questrade case studies
            - Regulatory scrutiny of AI-generated compliance content
        - label: Technology / Software
          values:
            - Medium-High (CS and L&D budget)
            - Low-Medium (SOC 2; GDPR)
            - High (AI-native culture)
            - Strong — Databricks (30+ authors); Microsoft
            - Build-vs-buy tension; internal tooling preference
        - label: Government / Nonprofit
          values:
            - Fixed (appropriation-based; long cycles)
            - Very High (FedRAMP; Section 508; multilingual)
            - Low (restrictive AI policy)
            - Strong (FedRAMP; Reach analytics; Global Fund)
            - Long sales cycles; budget cuts; political risk
        - label: SMB (<100 employees)
          values:
            - Very Low (direct purchase; cancel on pressure)
            - Low
            - Low (limited tech staff)
            - Weak — $1,749/user/year prohibitive at small seat counts
            - High churn; underserved by current pricing model
