    {
      "id": "traction-proxies-and-public-gaps",
      "title": "Growth proxies, channel economics, and the limits of public visibility",
      "body": "Creatio’s public traction story is directionally strong but structurally incomplete. Partner and investor announcements describe a company with years of 50% revenue growth, thousands of customers, more than 100 countries of reach, and a large partner ecosystem that contributes roughly half of the business. Those are meaningful indicators of distribution efficiency and market relevance. The problem is that they are still proxies rather than underwritable unit economics. Tracxn’s database places total disclosed funding at $273 million and even lists a small 2025 follow-on entry, while official partner announcements substantiate the larger 2021 and 2024 rounds without explaining that extra record. Review sources add another useful but imperfect angle: users see flexibility and business impact, yet they also complain about pricing fit for smaller enterprises, setup effort, and performance or scalability friction. Those adverse signals matter because they hint at implementation cost and support burden, but they still do not produce ARR, CAC, or gross-margin math. Even paid data platforms such as CB Insights and PitchBook expose only profile-style financial coverage, not audited statements. The result is a chapter with credible growth proxies, but still a material disclosure gap where the core underwriting numbers should be.",
