evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-detail
    missingEvidence: >-
      A current board pack, committee structure, and investor-rights summary that shows how decision rights actually
      work inside the company.
    whyItMatters: >-
      Publicly named board participants are visible, but without committee, ownership, and consent-right details it is
      impossible to fully assess governance durability or founder control.
    diligencePath: >-
      Request the current board list, board observer list, committee charters, and key investor-rights terms in
      diligence.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: founding-year
    missingEvidence: A primary source that states the exact founding date or original incorporation date for Creatio/bpm'online.
    whyItMatters: >-
      Founding year is a basic company-overview fact, and the retained external databases currently disagree between
      2013 and 2014.
    diligencePath: >-
      Request an official company fact sheet or incorporation record and reconcile it against historical brand
      materials.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: exact-customer-count
    missingEvidence: >-
      A current official customer-count disclosure or KPI deck that states active customers, paying accounts, and
      major-customer concentration.
    whyItMatters: >-
      Official sources support only "thousands of clients" while a third-party sales-data vendor gives an estimate,
      leaving later commercial and valuation analysis without a canonical figure.
    diligencePath: Request a current KPI sheet covering active customers, net adds, churn, and the internal definition of customer.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sam-som-precision
    missingEvidence: >-
      A management-level market model that translates category overlap into Creatio-relevant SAM, current product-mix
      revenue, and market-share math.
    whyItMatters: >-
      Public market reports bracket large adjacent categories, but none isolate the exact spend pool that matches
      Creatio’s combined CRM + workflow + no-code suite, so precise SAM and SOM remain unavailable.
    diligencePath: >-
      Request management’s TAM/SAM/SOM model, current ARR by product family, and win/loss share assumptions by target
      segment.
    relatedQuestionRefs:
      - QM022
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-economics
    missingEvidence: >-
      Segment-level data on budget owner, average contract value, implementation effort, services attach rate, and
      payback by use case.
    whyItMatters: >-
      Without deployment economics, it is difficult to judge whether category growth converts into efficient, repeatable
      sales motion across the buyer segments identified here.
    diligencePath: >-
      Request cohort-level go-to-market metrics by segment, including ACV, CAC, implementation duration, services mix,
      and renewal/expansion patterns.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
      - TM004
  - type: conflicting-data
    severity: minor
    topic: category-scope-drift
    missingEvidence: >-
      A company-approved explanation of which external market lens it uses internally when discussing category size and
      competitive position.
    whyItMatters: >-
      Low-code, CRM, workflow automation, DPA, and BPA studies each use different boundaries, so reported market sizes
      can appear contradictory even when individually credible.
    diligencePath: >-
      Ask management which external category definitions it maps to pipeline planning, investor messaging, and
      compensation models.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - id: EGP001
    type: enumeration-incomplete
    severity: material
    topic: competitor-scale-disclosure
    missingEvidence: >-
      Exact current customer-count, ACV, or ARR-like scale measures for Creatio and several quote-led competitors,
      especially where vendors publish platform breadth but not comparable commercial scale.
    whyItMatters: >-
      The competitor profile table can show strategic positioning and public reach, but it cannot normalize scale the
      way a public-company comp sheet would.
    diligencePath: >-
      Request current customer-count, ACV, retention, and product-mix disclosures from management or investor materials
