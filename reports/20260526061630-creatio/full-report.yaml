  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and platform packaging
        blocks:
          - type: paragraph
            body: >-
              Creatio’s current product story is built around one agentic no-code platform rather than a loose bundle of
              disconnected point products. The retained official pages consistently describe Studio Creatio as the
              design surface for building applications and AI agents with natural language and visual tools, while
              Sales, Marketing, and Service Creatio remain packaged CRM applications that sit on the same platform. That
              matters for diligence because Creatio is not only selling workflow tooling to developers; it is also
              selling department-ready operating applications to revenue and support teams. The AI layer is now embedded
              in that packaging: Creatio.ai is framed as a native capability with pre-built agents for sales, marketing,
              service, and general workflows, not as a bolt-on assistant. Official pages also emphasize composable
              architecture, reusable components, and value-based pricing that lets buyers add apps and components over
              time. In customer terms, the platform promise is straightforward: business teams can automate
              customer-facing and operational workflows, while technical teams retain an escape hatch for deeper
              extension. Official materials support the company’s claims around AI-native positioning, Studio Creatio,
              CRM apps, and 20 vertical workflow templates, but current pages use the broader phrasing "thousands of
              clients" rather than restating an exact public customer-count figure. That gap does not undermine product
              breadth, but it does limit how precisely platform scale can be benchmarked from public materials alone.
