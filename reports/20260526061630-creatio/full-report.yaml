  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, thesis, and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case for Creatio is straightforward. The company raised $200 million at a $1.2 billion
              valuation in 2024, attracted Sapphire Ventures and other growth investors, and continues to market itself
              as an AI-native, no-code CRM and workflow platform rather than a narrow feature tool. Official pages and
              customer references support the scale story: thousands of customers, workflows running daily in 100
              countries, and a partner footprint spanning 100 countries. TechCrunch’s competitive framing also cuts both
              ways in a useful way. It confirms that Creatio is operating in enterprise-grade categories—sales, service,
              marketing, and workflow—but it also clarifies that the real benchmark is not a small private peer set. The
              company must compete against Oracle, Salesforce, Microsoft, and SAP, which means valuation has to reflect
              both genuine category relevance and the risk that larger platforms use bundling, installed-base leverage,
              and AI add-ons to slow Creatio’s commercial momentum. That combination leads to a cautious but not
              dismissive call: research-more rather than avoid. The product and category proof are strong enough to stay
              engaged; the public evidence on price support is not yet strong enough to underwrite aggressively.
