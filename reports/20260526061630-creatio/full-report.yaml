chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, roots, and product scope
        blocks:
          - type: paragraph
            body: >-
              Creatio's current public identity is coherent even if some legacy metadata still trails the old brand. The
              official website consistently presents the company as an agentic CRM and workflow platform with no-code
              and AI at its core, while the studio and no-code pages describe a visual development environment for
              applications, AI agents, workflows, integrations, analytics, and UI configuration. The product set is
              broader than a classic CRM SKU: Creatio markets Studio for building applications and automations, CRM
              capabilities across marketing, sales, and service, marketplace add-ons, and industry workflows across
              roughly twenty verticals. The strongest historical anchor for the corporate identity shift is the October
              2019 PR Newswire announcement that bpm'online changed its corporate and product names to Creatio and moved
              its website to creatio.com. That rebrand matters because later chapters should treat Creatio as a
              workflow-and-CRM platform company whose current AI-native messaging extends an older no-code/BPM narrative
              rather than replacing it with a wholly new product thesis.
