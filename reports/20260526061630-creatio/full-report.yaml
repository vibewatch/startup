        title: Customer base, segments, and adoption footprint
        blocks:
          - type: paragraph
            body: >-
              The strongest current public evidence suggests that Creatio serves a broad but not precisely quantified
              installed base. Official pages repeatedly say the platform supports thousands of clients in 100 countries,
              while the about page adds 550 partners in 100 countries and 25 countries of local presence. The evidence
              is more detailed by segment than by exact logo count. Customer-proof pages show usage across distribution
              and field sales (BSN Sports), real estate (Purplebricks), manufacturing (Altro), public sector and citizen
              services (Boston, Pittsburgh, Maryland), utilities and resident services (Sureserve), and healthcare or
              behavioral health (Guided Care and Lucas County's mental-health board). This breadth matters because it
              shows Creatio is selling beyond a narrow sales-CRM niche into operational workflows with strong governance
              and case-management needs. The benchmark customer-success page further frames the customer value
              proposition around 70% faster implementation, 37% lower TCO, and 90%+ adoption inside complex
              organizations. What remains missing is exact 2026 customer count precision: retained official sources
              validate thousands of clients, but they do not directly restate the commonly cited 7,000+ figure, so
              current scale should be treated as directionally strong but not numerically pinned down in public
              materials. Public breadth is therefore easier to verify than exact scale. Buyer reach is broad across both
              commercial and public workflows.
