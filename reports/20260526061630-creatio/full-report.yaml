      - number: '3.3'
        title: Switching costs, multi-homing, and what moat Creatio can honestly claim
        blocks:
          - type: paragraph
            body: >-
              Creatio’s moat is real, but it is mostly executional rather than structural. Buyers do incur real
              switching costs once they have modeled workflows, assigned permissions, connected data sources, and
              extended the system through partners or internal admins. That creates meaningful inertia. But the market
              is also highly multi-homed: Microsoft can answer with Power Apps and Dynamics, Salesforce with Agentforce
              and platform tooling, ServiceNow with App Engine and CSM, Appian with process automation depth, and Pega
              with orchestrated case management. None of those substitutes makes Creatio irrelevant, but all of them
              limit winner-take-most outcomes. The strongest public moat claim Creatio can defend today is not an
              exclusive capability. It is the combination of unified CRM plus workflow automation plus AI agents plus a
              newly seatless Unlimited pricing model. That package is differentiated enough to matter in enterprise
              deals, especially where buyers want fewer vendors and faster adoption. What public evidence still does not
              prove is whether that differentiation converts into superior win rates, lower churn, or durable pricing
              power once large incumbents mobilize broader suite economics. In other words, Creatio looks strategically
              well-positioned, but the moat case still needs internal operating proof. The next diligence step is
              therefore commercial proof: where Unlimited pricing, partner leverage, and cross-workflow bundling
              actually change the outcome of competitive bake-offs.
