companyProfile:
  summary: >-
    Creatio is a late-stage private enterprise-software company built around no-code workflow automation and CRM. Public
    evidence supports a Boston-headquartered company led by founder-CEO Katherine Kostereva, with visible Ukrainian
    roots, a 2019 rebrand from bpm'online, and a product stack spanning Studio Creatio, packaged CRM applications,
    industry workflows, marketplace extensions, and newer AI-native capabilities. The company bootstrapped for years
    before taking a $68 million 2021 round and a $200 million 2024 round at a publicly promoted $1.2 billion valuation.
    Public proof on customers, partners, and deployments is strong enough to show real category relevance, but public
    disclosure remains thin on exact founding chronology, consolidated financials, retention, and cap-table detail.
  founders:
    - name: Katherine Kostereva
