  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Decision chain from category strength and fresh financing to public-comp discipline and the final research-more
      call.
    data:
      nodes:
        - id: n1
          label: Category strength
          description: AI-native CRM + workflow positioning, thousands of customers, and global partner reach.
        - id: n2
          label: Fresh private mark
          description: 2024 $200M raise at $1.2B with strong institutional backers.
        - id: n3
          label: Public-comp discipline
          description: Closest public peers cluster around roughly 2.2x-3.5x revenue; ServiceNow is the 7.5x outlier.
        - id: n4
          label: Disclosure gap
          description: No audited current revenue, margin, retention, or cap-table detail in public evidence.
        - id: n5
          label: Recommendation = research-more
          description: Stay engaged, but do not underwrite aggressively until the denominator is visible.
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
    approximationNotes: null
