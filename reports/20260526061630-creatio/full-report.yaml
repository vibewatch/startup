      - number: '8.4'
        title: Decision triggers and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The honest end-state is a disciplined wait. If Creatio can eventually show revenue support above the
              premium-support floor, sustain something close to the publicly claimed 50% growth rate, and translate its
              customer footprint into durable margins and retention, the current mark could move from stretched toward
              fair. But that is a future proof burden, not a present public fact. Today the right committee posture is
              research-more with medium confidence, high risk, and explicit diligence gates. A buyer should want audited
              financials, verified retention and gross margin, cap-table and preference detail, and any secondary or
              fund-mark evidence that triangulates the 2024 round. The thesis-break triggers are equally concrete: a
              discounted new round or secondary, visible commercial slowing against large platform competitors, or
              operational issues that undermine deployment credibility or geographic continuity. Those asks are not
              extra-credit diligence items; they are the items that determine whether the company’s category position
              translates into an investable entry price. Without them, the valuation debate is still mostly about what
              could be true, not what the public evidence proves today.
