              downstream portal users or frustrated implementation contexts. For retention and concentration, public
              visibility is much weaker. Retained sources do not disclose NRR, GRR, renewal rates, contract length, or
              top-customer concentration. Even the very strong customer-proof pages emphasize rollout speed, TCO,
              adoption, and workflow outcomes rather than long-horizon durability. That creates a meaningful diligence
              gap. In addition, the 2024 capital-raise release says 50% of business comes through channel partners,
              which helps expansion but also means customer acquisition and delivery quality remain partly dependent on
              partner performance. The overall customer picture is favorable on adoption and proof of use, but
              incomplete on renewal quality and concentration risk. That missing durability layer is the central
