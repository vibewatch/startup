      - number: '4.3'
        title: Capital adequacy, filing evidence, and the financial verdict
        blocks:
          - type: paragraph
            body: >-
              The most defensible capital-adequacy conclusion is mixed. On the positive side, the June 2024 $200 million
              minority round at a $1.2 billion valuation materially reduced immediate financing risk; there is no public
              sign of an urgent bridge or rescue scenario. On the negative side, the only true filing-grade financial
              evidence in the retained source set is the UK statutory record for Creatio Limited, and that record is not
              a substitute for consolidated group financials. The 2025 UK accounts show a small operating entity with
              £89,795 of cash, £1.24 million of debtors, £522,634 of current creditors, £6,965 of longer-dated
              creditors, £870,263 of net assets, and 16 average employees. The filing note about an HMRC deferred-VAT
              plan matters because it shows active working-capital management, while the November 2025 satisfaction of
              charge suggests at least one secured obligation was cleared at the entity level. None of that answers the
              core group questions on revenue quality, margin path, or runway. The UK cash balance is obviously too
              small to proxy group liquidity after a $200 million growth round. The practical verdict is therefore that
              capital adequacy looks acceptable directionally, but still not fully underwritable until management
              supplies consolidated cash, burn, debt, and renewal economics.
