  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing architecture, and what is actually monetized
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial evidence for Creatio is not a revenue number; it is the way the company now
              packages the product. Creatio’s 2026 pricing model makes clear that the business is built around recurring
              software subscriptions rather than transactional usage alone. Growth and Enterprise preserve per-user
              logic, while Unlimited shifts the commercial story toward organization-scale adoption with no limits on
              users, custom agents, workflows, or applications. AI Studio also became mandatory by default alongside
              Business Studio, which suggests a deliberate move to raise bundled platform value rather than sell AI only
              as an optional add-on. Support is monetized separately and explicitly: the published support packages cost
              0%, 10%, or 20% of subscription cost, support purchase is mandatory throughout the subscription period,
              and minimum duration is one year. That is unusually useful because it shows a real support-attach layer
              even though the company does not disclose revenue mix. What remains unclear is how much marketplace,
              implementation, or partner-delivered value accrues to Creatio itself. The public record therefore supports
              a subscription-led software model with monetized support attachment, but it does not yet reveal realized
              pricing, direct services contribution, or gross margin by stream. That distinction is crucial because
              packaging visibility is stronger than realized financial transparency.
