      - number: '1.4'
        title: External feedback is mixed, and a few core facts remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              Public user-feedback sources make it clear that Creatio should not be presented as a risk-free no-code
              story. Trustpilot is materially negative in the current fetch, with a poor 2.4 rating and multiple
              complaints that advanced work still requires code, documentation is confusing, and the product can freeze
              or crash under load. Capterra and G2 are more balanced: both show users valuing flexibility, breadth, and
              automation outcomes, but they also preserve recurring complaints around reporting friction, setup
              complexity, version-control issues, steep learning curves, and performance under heavy usage. TrustRadius
              leans more positive on time-to-value and adaptability while still surfacing pricing, performance, and
              product-gap complaints. These review signals do not invalidate Creatio's enterprise traction, but they do
              constrain any simplistic claim that no-code alone erases implementation difficulty. Public disclosure also
              remains incomplete on exact founding year, exact current customer count, and the real governance and
              cap-table mechanics behind the visible board names.
