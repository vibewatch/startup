  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Discounted new round or secondary
        - Any clear pricing below the 2024 mark
        - Shows the market will not validate the last primary price without a reset
        - Re-underwrite from the new print, not from the old headline valuation
      - - Commercial slowing
        - Visible win-rate compression or materially longer sales cycles versus platform incumbents
        - Undermines the premium growth case
        - Move the stance from research-more toward avoid unless price also resets
      - - Disclosure disappointment
        - Audited revenue, margin, or retention metrics come in materially below what premium multiples imply
        - Confirms denominator risk rather than just disclosure delay
        - Use public workflow comp bands, not premium outlier bands
      - - Operational / geopolitical disruption
        - A material continuity event hits deployment or support credibility
        - Turns an already opaque valuation into a quality-risk story
        - Demand a steeper discount and higher proof burden
      - - AI premium fails to show up in economics
        - Strong narrative but no measurable AI attach, margins, or retention lift
        - Removes the main argument for paying above public workflow peers
        - Hold off on entry until evidence catches up
    notes: These are practical breakpoints for underwriting discipline rather than point forecasts.
    claimRefs:
      - CV041
      - CV042
      - CV045
      - CV046
      - CV048
      - CV049
      - CV050
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited financials
        - Current revenue or ARR, gross margin, and cash-flow bridge
        - Converts the headline valuation into a testable multiple
        - Management data room or banker materials
      - - Retention / cohort quality
        - NRR, churn, customer concentration, and cohort retention
        - Determines whether premium multiples are sustainable rather than narrative-only
        - Customer analytics export plus cohort pack
      - - Cap table and preferences
        - Liquidation waterfall, dilution terms, and any ratchets from the 2024 round
        - Headline post-money can overstate common-equivalent value
        - Counsel review of financing documents
      - - Secondary price discovery
        - Executed secondary trades or fund marks after 2024
        - Fresh market-clearing data would triangulate the private mark
        - Secondary brokers, fund disclosures, or banker checks
      - - Ukraine / partner concentration
        - Functional headcount by geography and partner-sourced ARR
        - Operational and channel concentration can widen downside even if revenue looks healthy
        - Ops review plus board-level KPI pack
    notes: >-
      The diligence asks focus on denominator proof and downside structure, because those are the current valuation
      bottlenecks.
    claimRefs:
      - CV036
      - CV039
      - CV045
