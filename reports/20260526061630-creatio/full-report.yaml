      - number: '5.3'
        title: Trust, security, support, and practical constraints
        blocks:
          - type: paragraph
            body: >-
              Creatio’s trust posture is one of the stronger parts of the retained source set. The company explicitly
              claims separate customer databases, encryption in transit and at rest, SAML 2.0/WebSSO, granular roles and
              permissions, audit logs, and a compliance stack that references GDPR, ISO 27001, HIPAA, SOC 1, and SOC 2.
              The cloud and AI privacy materials reinforce that story by describing tenant-isolated storage,
              Azure-hosted approved LLM instances, in-region deployment, and customer-data restrictions for Creatio.ai.
              Support is also productized rather than ad hoc: the support page advertises four support lines, 24/7
              availability, security-update notifications, early release testing, onboarding guidance, and
              resolution-time commitments at paid tiers. That said, the external review surface highlights a real
              caveat. Third-party reviewers still describe a meaningful learning curve, the need for dedicated technical
              ownership, occasional slowness during setup or page loading, and practical limits to the marketing claim
              that everything important is "no-code" in production. For diligence, the conclusion is not that the trust
              stack is weak; rather, it is that governance and security appear enterprise-ready on paper, while
              ease-of-adoption depends heavily on implementation discipline, process ownership, and how much buyers
              expect business users to customize without technical backup. For customers that equate no-code with no
              technical ownership whatsoever, the review layer is a useful corrective.
