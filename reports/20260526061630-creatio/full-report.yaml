  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and AI-governance risk
        blocks:
          - type: paragraph
            body: >-
              Creatio’s first-order risk is that its product ambition is expanding faster than its public legal detail.
              The company markets an agentic CRM and workflow platform, says customers run millions of workflows daily
              in 100 countries, and explicitly positions itself as a GDPR processor for customer data. That creates a
              broad privacy and model-governance surface before any customer-specific sector rules are layered on top.
              The reviewed public materials show that Creatio has updated its 2026 master subscription agreement,
              SLA/support policy, capabilities annexes, and AI services annex, while also publishing AI-trust language
              built around human-in-the-loop controls, zero-trust security, and dedicated privacy layers. Those are real
              mitigations, but they do not answer the core diligence questions: what liabilities sit in the AI annex,
              what subprocessors are permitted, how model-output risk is allocated, and how quickly the company must
              notify customers after an AI or privacy incident. The external regulatory context is tightening rather
              than loosening: GDPR remains foundational, the EU AI Act raises the burden on AI-enabled enterprise
              workflows, ICO guidance expects rights-and-freedoms risk assessments, and EDPB Opinion 28/2024 pushes
              lawful-basis, anonymity, and mitigation analysis deeper into model operations.
