      - number: '7.3'
        title: Dependency, competition, and commercial-execution risk
        blocks:
          - type: paragraph
            body: >-
              The commercial risk case is a compound one: Creatio depends on outside infrastructure, outside models,
              outside partners, and a crowded enterprise buying environment at the same time. Hosting dependency is
              explicit—AWS and Azure run the platform—and Creatio.ai materials point users to Azure OpenAI
              documentation, implying present model-provider dependency on Microsoft’s AI stack. Partner dependency is
              also structural rather than incidental: the company says it has partners in 100 countries and frames joint
              go-to-market as central to customer value delivery. That means sales execution, deployment quality, and
              renewals can all degrade if channel performance slips even when the underlying product remains
              competitive. At the same time, independent coverage says the company competes with Oracle, Salesforce,
              Microsoft, and SAP in front-office workflows. Those are not edge-case rivals; they are platform incumbents
              with the ability to bundle CRM, workflow, analytics, identity, and AI into existing enterprise
              relationships. Creatio’s 2024 round and public 50% growth claim reduce tolerance for slip-ups because a
              $1.2B mark implies investors are already underwriting sustained execution. In practice, that makes long
              enterprise sales cycles, more complex permissions design, and heavier customer-compliance customization
              real valuation risks, not just operating nuisances.
