  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue-denominator
    missingEvidence: Current recognized revenue or ARR for Creatio, plus a bridge from the 2024 financing to current scale.
    whyItMatters: Without a denominator, investors cannot tell whether $1.2B is fair, stretched, or already conservative.
    diligencePath: Request audited FY2024-FY2025 revenue, ARR, and deferred-revenue bridges from management or a data room.
    relatedQuestionRefs:
    - QV007
    - QV027
  - type: private-evidence-only
    severity: material
    topic: economics-quality
    missingEvidence: Gross margin, net retention, cohort retention, and free-cash-flow detail for the current product mix.
    whyItMatters: The comp set prices durability and efficiency, not only headline growth.
    diligencePath: Request audited margin and retention metrics and reconcile them to the company’s AI-native expansion narrative.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: material
    topic: cap-table-waterfall
    missingEvidence: Preference stack, liquidation rights, anti-dilution terms, and post-2024 ownership dilution.
    whyItMatters: Headline post-money valuation can overstate common-equivalent value when late-stage preferences are heavy.
    diligencePath: Obtain the 2024 round term sheet and fully diluted cap table with preference waterfall modeling.
    relatedQuestionRefs:
    - QV029
  - type: missing-source
    severity: material
    topic: secondary-price-discovery
    missingEvidence: Executed secondary transactions, mutual-fund marks, or other post-2024 third-party pricing signals.
    whyItMatters: A fresh secondary print would triangulate whether the 2024 mark still clears the market.
    diligencePath: Query secondary brokers, specialist funds, and any public fund-mark disclosures for Creatio holdings or trades.
    relatedQuestionRefs:
    - QV026
    - QV030
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-coverage
    missingEvidence: Additional private comps and more direct low-code platform peers beyond the selected public workflow set.
    whyItMatters: The current table is sufficient for discipline, but it is not the entire universe of possible comparables.
    diligencePath: Extend the comp set with private secondary data and a wider low-code / CRM peer basket if fresh pricing becomes available.
    relatedQuestionRefs:
    - QV008
    relatedTableRefs:
    - TV004
