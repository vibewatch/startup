company:
  name: Creatio
chapter:
  number: 8
  title: Valuation
  summary: 'Creatio has real category strength: a fresh 2024 institutional round, a stated $1.2B valuation, thousands of customers, and a credible AI-native workflow narrative. The problem is denominator opacity. Public workflow and automation comps mostly trade around 2.2x-3.5x market-cap-to-revenue, with ServiceNow the premium outlier at 7.5x, implying that the latest mark still needs roughly $0.34B-$0.38B of revenue support even before a buyer demands margin or retention proof. That keeps the recommendation at research-more, confidence medium, risk high, and valuation stance stretched until audited financials or secondary price discovery close the gap.'
sections:
- id: recommendation-thesis-and-anti-thesis
  title: Recommendation, thesis, and anti-thesis
  body: 'The positive case for Creatio is straightforward. The company raised $200 million at a $1.2 billion valuation in 2024, attracted Sapphire Ventures and other growth investors, and continues to market itself as an AI-native, no-code CRM and workflow platform rather than a narrow feature tool. Official pages and customer references support the scale story: thousands of customers, workflows running daily in 100 countries, and a partner footprint spanning 100 countries. TechCrunch’s competitive framing also cuts both ways in a useful way. It confirms that Creatio is operating in enterprise-grade categories—sales, service, marketing, and workflow—but it also clarifies that the real benchmark is not a small private peer set. The company must compete against Oracle, Salesforce, Microsoft, and SAP, which means valuation has to reflect both genuine category relevance and the risk that larger platforms use bundling, installed-base leverage, and AI add-ons to slow Creatio’s commercial momentum.
    That combination leads to a cautious but not dismissive call: research-more rather than avoid. The product and category proof are strong enough to stay engaged; the public evidence on price support is not yet strong enough to underwrite aggressively.'
