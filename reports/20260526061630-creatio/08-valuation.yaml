- id: public-comparables-and-scenario-logic
  title: Public comparables and scenario logic
  body: The public comp picture is much more disciplining than the private press around the 2024 round. The closest workflow and automation names—HubSpot, Pegasystems, Freshworks, Appian, UiPath, and even Salesforce—cluster around roughly 2x-4x market-cap-to-revenue, while ServiceNow sits far above the pack at roughly 7.5x as the premium scaled outlier. That comp set does not prove Creatio is overpriced, because public evidence still lacks Creatio’s own revenue denominator. What it does prove is that the 2024 mark already needs meaningful revenue support. At peer-like bands around the low-to-mid 3x range, $1.2 billion implies roughly $0.34B-$0.40B of revenue support. Even if an investor grants Creatio ServiceNow-like premium treatment, the company would still need about $0.16B of revenue support. That is why the 2026 market-data overlays matter. Multiples.vc highlights wide AI-driven dispersion and “creative destruction” across horizontal SaaS, while Sapphire’s 2026 report calls out valuation
    volatility and elongated exit timelines. In other words, the market is willing to reward AI-native winners, but only with a denominator investors can trust. Until Creatio supplies that denominator, the scenario table has to stay conservative.
