  - - Confidence
    - medium
    - Comp and market-data signals are strong; Creatio-specific financial disclosure is still thin.
  - - Risk rating
    - high
    - Opacity, heavyweight competitors, partner dependency, and Ukraine-linked continuity widen the outcome range.
  - - Valuation stance
    - stretched
    - Most relevant public workflow peers cluster near 2x-4x revenue while the latest private mark lacks a public revenue base.
  - - Entry discipline
    - Require fresh disclosure
    - Audited revenue, margins, and secondary-price signals matter more than another product launch headline.
  - - Decision implication
    - Stay engaged, do not force entry
    - Keep the company on the active list, but wait for proof that the mark is underwritten by current economics.
