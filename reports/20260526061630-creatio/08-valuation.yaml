- id: financing-context-and-disclosure-quality
  title: Financing context and disclosure quality
  body: The funding history is helpful but incomplete as a valuation anchor. The 2021 $68 million Series A is meaningful mainly because it shows Creatio reached institutional financing later than many software peers, after building a meaningful business first. The more relevant anchor is the 2024 $200 million raise at $1.2 billion, because it is fresh and institutionally led. However, public validation stops there. None of the public official pages reviewed here provide audited revenue, gross margin, retention, free cash flow, or a current ARR bridge. Independent coverage fills in some operating color—Research.com cites roughly 850 employees, 10 offices, and 500 partners—but not the denominator needed to convert the 2024 price into a clean underwriting multiple. That is the central valuation handicap. Unlike public peers, Creatio does not yet provide routine disclosure infrastructure. The Salesforce, ServiceNow, and Pega investor-relations pages and SEC filing records are useful not because
    they say anything about Creatio directly, but because they show the disclosure baseline that the public market expects from software issuers. Creatio has a fresh mark but still private-company opacity, which makes entry discipline more important than storytelling.
