- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Category position
    - Creatio is a credible AI-native CRM and workflow platform rather than a marginal tool.
    - Category credibility does not override price discipline when revenue and margin disclosure are absent.
    - Audited KPIs that show premium economics relative to workflow peers.
  - - Scale proof
    - Thousands of customers, workflows in 100 countries, and blue-chip investors support seriousness.
    - Scale claims are broad, but they still do not reveal the revenue denominator or retention quality.
    - Verified ARR bands, customer concentration, and cohort retention.
  - - Competitive context
    - Competing with Microsoft, Salesforce, SAP, and Oracle implies category relevance.
    - The same incumbents can bundle more functionality and squeeze win rates or pricing.
    - Win-rate evidence and customer references showing durable displacement at scale.
  - - 2024 financing
    - A fresh 2024 round is stronger evidence than relying on a stale 2021 mark.
    - A fresh round is still only one price point if the denominator stays private.
    - Secondary or mutual-fund marks that confirm the round still clears the market.
  - - AI narrative
    - AI-native positioning could justify some premium versus slower legacy workflow peers.
    - 2026 public software multiples are split by AI winner-versus-disruption risk, not by narrative alone.
    - Measured AI attach rates, margins, and verified customer production usage.
  notes: The anti-thesis is aimed at price formation and disclosure quality, not at whether Creatio is strategically relevant.
