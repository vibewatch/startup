- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Revenue support is at least about $0.16B and growth stays near the company-claimed 50% range while AI differentiation holds.
    - The 2024 mark can prove fair and possibly conservative if premium economics look more like an outlier than a peer median.
    - Requires premium growth, strong margins, and proof that large-platform competition is manageable.
    - Possible, but unsupported by public financial disclosure today.
  - - Base
    - Public multiple discipline stays near the 3.13x cluster and investors demand fresh disclosure before paying up.
    - The business may still be good, but entry should wait until revenue, margin, and cap-table facts are known.
    - Opacity, AI multiple dispersion, and long enterprise proof cycles keep the mark hard to validate.
    - Most defensible posture on public evidence.
  - - Bear
    - Revenue support is materially below about $0.34B-$0.38B and public peers keep trading around 2x-4x.
    - The 2024 mark looks rich and new money would likely demand a discount or tougher terms.
    - Competitive pressure, deployment friction, or geopolitical disruption can accelerate the reset.
    - Material downside if denominator quality disappoints.
  - - Decision posture
    - Strong company, weak denominator.
    - Stay engaged but insist on proof before underwriting the existing sticker.
    - The risk is paying premium-private pricing for a business the public market would price more conservatively.
    - Supports research-more, not buy.
  notes: The scenarios are underwriting frames anchored on public-comp multiple regimes and required revenue support, not on a claimed current Creatio revenue number.
