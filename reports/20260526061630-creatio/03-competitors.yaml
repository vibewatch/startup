  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "Creatio competes in a broad buyer decision set that spans CRM incumbents, workflow specialists, and internal-build substitutes. Its clearest public differentiators are the unified CRM-plus-workflow stack and the 2026 Unlimited pricing model, while the strongest counter-pressure comes from Microsoft, Salesforce, ServiceNow, Appian, and Pega all marketing overlapping AI, automation, and governance capabilities. Public evidence supports a credible competitive position, but not a fully underwritten moat."
  },
  "sections": [
    {
      "id": "landscape-and-peer-set",
      "title": "Direct peers, incumbents, adjacencies, and the real buyer decision set",
      "body": "Creatio sits in a crowded intersection rather than a neatly isolated category. The company sells a unified CRM plus workflow-automation platform, so its real decision set includes CRM incumbents, workflow specialists, and internal-build substitutes at the same time. Salesforce and Microsoft matter because many buyers already standardize on CRM or productivity suites and can extend those systems with AI, automation, and custom apps before adding a separate vendor. ServiceNow matters because it has moved beyond IT workflows into customer-service and enterprise application building, which overlaps with Creatio’s promise to orchestrate cross-functional customer journeys. Appian and Pega matter because they anchor the process-automation and case-management side of the market and compete most directly on enterprise workflow depth, governance, and transformation programs. Power Apps is especially important because it turns “we will build it ourselves on our existing Microsoft stack” into a plausible status-quo answer. The practical implication is that Creatio does not win by being merely low-code or merely CRM; it wins only when buyers value a single packaged platform for CRM, workflow, and AI agents more than they value incumbent suite gravity or internal-build flexibility. That breadth also means each procurement motion can start from a different incumbent beachhead—CRM, IT workflow, or custom app tooling—before Creatio even enters the shortlist.",
