      "id": "evidence-constrained-market-sizing",
      "title": "Evidence-constrained market sizing requires multiple lenses, not one TAM slogan",
      "body": "The retained public market data supports a large addressable landscape, but not a single clean spend pool that maps one-for-one to Creatio. Gartner forecast worldwide low-code development technologies at $31.9B for 2024, with low-code application platforms alone at $12.35B; Grand View estimated the low-code platform market at $6.78B in 2022 growing to $35.22B by 2030; Straits put the category at $30.74B in 2026; and Fortune Business Insights projected $48.91B in 2026. On the CRM side, Grand View valued the global market at $73.4B in 2024, while Fortune put it at $126.17B in 2026. Workflow/DPA/BPA studies add another lens: Mordor estimates digital process automation at $17.16B in 2026, Global Market Insights puts workflow automation at $20.3B in 2023, and MarketsandMarkets projects BPA at $19.6B by 2026. These figures are all useful, but they are not additive. The defensible conclusion is that Creatio plays inside overlapping software pools where exact SAM and SOM cannot be isolated from public data without management-level revenue, win-rate, and product-mix disclosures.",
