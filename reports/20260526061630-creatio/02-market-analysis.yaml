    {
      "id": "growth-drivers-and-adoption-constraints",
      "title": "Growth drivers are strong, but adoption still breaks on governance, integration, and execution",
      "body": "The category tailwinds are real. Gartner ties low-code growth to business technologists, hyperautomation, and composability; CRM research points to AI-enabled personalization, multichannel engagement, and customer-retention pressure; and workflow/DPA research highlights digital transformation, cloud adoption, and the need to remove manual work. Creatio's own messaging fits directly inside those currents by emphasizing AI agents, natural-language design, marketplace add-ons, and faster time-to-value. But the same sources also preserve the drag factors that matter in diligence. External studies warn about integration limits, implementation cost, skills gaps, and customization ceilings. Review pages say Creatio can reduce development effort and speed deployment, yet they also record performance issues, version-control problems, UI roughness, pricing pressure on smaller buyers, and complexity when scaling beyond simpler use cases. Those frictions matter because the incumbent alternatives already own adjacent architectures in many enterprises. Switching cost, governance, and the capacity to integrate legacy systems therefore matter at least as much as low-code ease-of-use in determining whether Creatio can turn category growth into durable share gains.",
