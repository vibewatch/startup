  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Creatio does not fit a single neat software bucket: the retained evidence places it in the overlap of enterprise low-code platforms, CRM suites, and workflow/BPA software. Public market-data sources support large and still-growing adjacent markets, but they disagree enough on category scope that an evidence-constrained multi-lens view is more defensible than one headline TAM. The clearest buying pattern is enterprise and upper-midmarket teams that need configurable customer-facing and operational workflows, with business technologists and citizen developers increasingly part of the adoption path."
  },
  "sections": [
    {
      "id": "market-boundary-and-status-quo-substitutes",
      "title": "Market boundary and status-quo substitutes",
      "body": "Creatio's own messaging makes the market boundary broader than a classic CRM comparison and narrower than the entire business software universe. The product story combines an agentic CRM suite, workflow automation, AI agents, marketplace add-ons, industry workflows, and no-code application building. That places the company in an overlap zone between enterprise low-code application platforms, CRM suites, and workflow/BPA platforms. The practical substitute set is therefore not just other CRM vendors but broader automation suites that can own the same front-office and operations workflows. Salesforce markets AI agents, Customer 360, and enterprise automation on one trusted platform; ServiceNow sells one enterprise automation platform with low-code, integrations, process mining, and RPA; Appian centers enterprise low-code on process orchestration and governance-heavy work; Microsoft Power Apps emphasizes governed employee-built apps; and Pega combines workflow automation, customer journeys, and low-code development. For diligence purposes, the included spend is software and services that help enterprises design, automate, govern, and operate customer-facing or operational processes with low-code or adjacent workflow tooling. Excluded spend should be pure collaboration tools, generic BI, or isolated RPA-only categories that do not compete for the same front-office workflow standardization budget.",
