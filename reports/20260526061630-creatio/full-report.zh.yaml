      - number: '7.2'
        title: 运营、安全与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Creatio 比早期 AI 厂商成熟，但剩余盲点仍重要，因为平台触达的是客户工作流，而不是可丢弃的边缘工具。公开安全材料强调多层监控、TLS 1.2、ISO 27001 续期、面向 AI
              上传文件的客户专用存储，以及最小权限 RBAC。云材料称平台运行在 AWS 和 Azure 上，客户可以选择区域数据中心，以支持性能和当地法律对齐。这是可信的控制基线，但本次审阅证据集仍没有量化宕机历史、区域层级
              SLA 达成情况，或 AI 专属事件处理。公司也保留可见的乌克兰暴露。Creatio 联系页面仍列出基辅，2024
              年融资后的独立报道称，尽管总部在波士顿、国际存在更广，公司仍由乌克兰人创立，且基辅仍有研发。管理层公开支持乌克兰，在文化上是强项，但也确认地缘政治连续性是一个仍在发生的运营问题，而不是已经结束的历史脚注。对投资人而言，问题不是
              Creatio 今天能否全球运营；问题是工程、支持和安全能力是否仍有足够比例集中在基辅，以至于在局势升级或基础设施中断时形成重大的单一区域连续性风险。
