      - number: '8.4'
        title: 决策触发条件与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              诚实的终点是有纪律地等待。如果 Creatio 最终能够证明收入支撑高于溢价支撑底线，维持接近公开声称的 50%
              增长率，并把客户足迹转化为持久利润率和留存，那么当前标记可能从偏高走向合理。但这是未来的证明负担，不是当下的公开事实。今天正确的委员会姿态，是以中等信心、高风险和明确尽调闸门继续研究。买方应要求审计财务、经验证的留存和毛利率、股权结构表及优先权细节，以及任何能够三角验证
              2024
              年融资的老股交易或基金标记证据。打破投资逻辑的触发条件也同样具体：折价新一轮或老股交易、面对大型平台竞争对手的可见商业放缓，或削弱部署可信度或地域连续性的运营问题。这些要求不是加分项；它们决定公司的品类位置能否转化为可投资入场价格。缺少它们，估值争论仍主要围绕“可能为真”的事情，而不是公开证据今天已经证明的事情。
