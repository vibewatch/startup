      - number: '2.2'
        title: 受证据约束的市场测算需要多重镜头，而不是一句 TAM 口号
        blocks:
          - type: paragraph
            body: >-
              留存的公开市场数据支持一个很大的可触达版图，但并不支持一个可以一比一映射到 Creatio 的干净支出池。Gartner 预测 2024 年全球低代码开发技术市场为 $31.9B，其中低代码应用平台本身为
              $12.35B；Grand View 估计低代码平台市场 2022 年为 $6.78B，到 2030 年增至 $35.22B；Straits 将 2026 年品类规模放在 $30.74B；Fortune
              Business Insights 预测 2026 年为 $48.91B。CRM 侧，Grand View 估计 2024 年全球市场为 $73.4B，Fortune 则给出 2026 年
              $126.17B。工作流 / DPA / BPA 研究提供另一重视角：Mordor 估计 2026 年数字流程自动化为 $17.16B，Global Market Insights 将 2023
              年工作流自动化放在 $20.3B，MarketsandMarkets 预测 BPA 到 2026 年为 $19.6B。这些数字都有用，但不能相加。稳妥结论是，Creatio
              活在多个相互重叠的软件池里；没有管理层级别的收入、胜率和产品组合披露，无法仅靠公开数据拆出精确的 SAM 和 SOM。
