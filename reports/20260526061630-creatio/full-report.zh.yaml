      - number: '2.3'
        title: 买方、使用者和付款方偏向跨职能企业团队
        blocks:
          - type: paragraph
            body: >-
              留存证据里最强的买方模式不是单席位部门软件，而是跨职能采购。Creatio 自己的页面承诺，在不增加人手的情况下提升营销、销售和服务团队产出；CRM 指南也明确称，销售、营销、服务、运营和管理团队使用 CRM
              来整合数据、自动化工作流。无代码页面把非 IT 用户定位为创建者，可以减少 IT
              瓶颈；评价来源则显示，公民开发者、管理员和运营团队会用该平台做案例管理、部门工作流和遗留应用替换。外部市场研究也强化了这个取向：大型企业主导 CRM、DPA 和工作流自动化支出，BFSI
              反复作为领先终端市场出现。实际含义是，同一个账户里，买方、使用者和付款方可能分开。收入或服务负责人可能赞助第一个用例，但
              IT、平台治理或转型团队往往共同拥有集成、访问权限和规模化。因此，预算归属既是工作流现代化决策，也是一条传统 CRM 预算项。
