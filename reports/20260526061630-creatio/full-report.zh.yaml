  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 隐私 / AI 合规
        - 正式问询或执法通知
        - 任何 DPA、ICO 或其他监管机构就 AI、数据权利或传输发起重大调查
        - 暂停投资评估，在责任分配和补救方案清楚前，将风险评级调向危急
      - - AI 模型 / 工作流依赖
        - 模型供应商或 AI 服务中断
        - 当前 LLM 技术栈出现重大功能撤回、价格冲击或长时间宕机
        - 投入新资金前，重审产品毛利率和差异化假设
      - - 云可靠性
        - 严重服务中断
        - 任何区域级宕机或 SLA 赔付事件，且实质扰乱客户工作流
        - 视为公开缓释说法不足的证据；要求提供事故历史和冗余证明
      - - 合作伙伴执行
        - 渠道质量恶化
        - 头部实施伙伴在有意义客户队列中错过上线或续约目标
        - 下调增长信心，并折减合作伙伴驱动的扩张假设
      - - 乌克兰连续性
        - 地区升级或长期扰动影响基辅运营
        - 任何实质损害工程、支持或安全人员连续性的事件
        - 立即升级连续性尽调，并测试其他地区能否吸收工作量
      - - 竞争压力
        - 企业销售摩擦
        - 面对 Microsoft、Salesforce、SAP 或 Oracle 捆绑包，胜率压缩或销售周期拉长
        - 重评估值假设，因为执行风险已传导到商业结果
    notes: 这些是投资评估触发器，不是预测；每一项都用于捕捉可控运营风险何时开始传导到估值。
