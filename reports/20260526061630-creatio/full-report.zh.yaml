  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业、既有巨头、相邻方案与真实买方决策集
        blocks:
          - type: paragraph
            body: >-
              Creatio 所处的是一个拥挤交叉口，而不是边界清晰的独立品类。公司销售统一的 CRM 加工作流自动化平台，因此真实决策集同时包含 CRM 既有厂商、工作流专门厂商和内部自建替代。Salesforce 和
              Microsoft 重要，是因为许多买方已经在 CRM 或生产力套件上标准化，可以先用 AI、自动化和自定义应用扩展这些系统，再考虑新增独立供应商。ServiceNow 重要，是因为它已经从 IT
              工作流走向客户服务和企业应用搭建，与 Creatio 编排跨职能客户旅程的承诺重叠。Appian 和 Pega
              重要，是因为它们锚定流程自动化和案例管理一侧，在企业工作流深度、治理和转型项目上最直接竞争。Power Apps 尤其关键，因为它把“我们就在现有 Microsoft
              栈上自己搭”变成一个可信的现状答案。实际含义是，Creatio 不能只靠低代码或只靠 CRM 取胜；只有当买方认为一个打包平台同时覆盖 CRM、工作流和 AI
              智能体，比既有套件重力或内部自建灵活性更有价值时，它才会赢。这个广度也意味着，每一次采购动议都可能从不同的既有滩头——CRM、IT 工作流或自定义应用工具——出发，在 Creatio 进入候选名单前就已经成形。
