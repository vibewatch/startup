      - number: '1.4'
        title: 外部反馈分化，几个核心事实仍披露不足
        blocks:
          - type: paragraph
            body: >-
              公开用户反馈说明，Creatio 不能被包装成没有风险的无代码故事。当前抓取的 Trustpilot 明显偏负面，评分只有
              2.4，并有多条投诉称高级工作仍需要写代码、文档令人困惑，产品在负载下可能卡死或崩溃。Capterra 和 G2
              更均衡：两者都显示用户认可灵活性、广度和自动化成效，但也保留了围绕报表摩擦、设置复杂、版本控制问题、学习曲线陡峭和高负载性能的重复投诉。TrustRadius
              在实现价值速度和适应性上更正面，但仍浮现定价、性能和产品缺口投诉。这些评价信号不会推翻 Creatio
              的企业端牵引力，但会约束一种过度简化的说法：无代码本身并不能抹平实施难度。围绕准确创立年份、当前客户数，以及可见董事名单背后的真实治理和股权结构机制，公开披露也仍不完整。
