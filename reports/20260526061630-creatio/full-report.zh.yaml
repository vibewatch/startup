  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、根源与产品范围
        blocks:
          - type: paragraph
            body: >-
              即便部分旧元数据仍停留在老品牌上，Creatio 现在的公开身份已经相当一致。官网持续将公司呈现为以无代码和 AI 为核心的智能体 CRM 与工作流平台；Studio
              和无代码页面则描述了一个可视化开发环境，用来配置应用、AI 智能体、工作流、集成、分析和 UI。产品集合已经不只是传统 CRM SKU：Creatio 推广
              Studio，用于搭建应用和自动化；也推广覆盖营销、销售和服务的 CRM 能力、应用市场插件，以及约二十个垂直行业的工作流。企业身份切换最强的历史锚点，是 2019 年 10 月 PR Newswire
              公告：bpm'online 将公司和产品名称改为 Creatio，并把网站迁至 creatio.com。这个更名很关键，因为后续章节应将 Creatio 视为一家工作流加 CRM 平台公司；它当前的 AI
              原生叙事，是在较早的无代码 / BPM 叙事上延展，而不是用一套全新的产品逻辑将其替换。
