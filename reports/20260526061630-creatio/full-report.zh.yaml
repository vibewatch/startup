  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价架构与真正变现的内容
        blocks:
          - type: paragraph
            body: >-
              Creatio 最强的公开财务证据不是收入数字，而是公司现在如何打包产品。Creatio 2026 年定价模型清楚说明，业务围绕经常性软件订阅搭建，而不只是交易式用量。Growth 和 Enterprise
              保留按用户逻辑；Unlimited 则把商业叙事转向组织级采用，并且不限制用户、自定义智能体、工作流或应用。AI Studio 也与 Business Studio
              一起成为默认必选，这暗示公司有意抬高捆绑平台价值，而不是只把 AI 当作可选插件出售。支持服务单独且明确变现：公开的支持套餐价格为订阅费用的 0%、10% 或
              20%，购买支持在整个订阅期内强制执行，最短期限为一年。这一点异常有用，因为它说明存在真实的支持附着层，即便公司不披露收入组合。仍不清楚的是，应用市场、实施或伙伴交付价值有多少归 Creatio
              自己。公开记录因此支持一个订阅主导的软件模型，并带有变现的支持附着；但它还没有揭示实际成交价格、直接服务贡献或分收入流毛利率。这个区分很关键，因为打包可见度强于已实现财务透明度。
