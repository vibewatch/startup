      - number: '5.3'
        title: 信任、安全、支持与现实约束
        blocks:
          - type: paragraph
            body: >-
              Creatio 的信任姿态，是留存来源集里较强的一部分。公司明确声称采用独立客户数据库、传输中和静态加密、SAML 2.0/WebSSO、细粒度角色和权限、审计日志，并列出覆盖 GDPR、ISO
              27001、HIPAA、SOC 1 和 SOC 2 的合规栈。云和 AI 隐私材料进一步强化这个故事，描述了租户隔离存储、Azure 托管的已批准 LLM 实例、区域内部署，以及 Creatio.ai
              对客户数据的限制。支持也产品化了，而不是临时响应：支持页面宣传四条支持线、24/7
              可用性、安全更新通知、早期发布测试、入门指导，以及付费层级的解决时间承诺。话虽如此，外部评价表面提出了一个真实提醒。第三方评论者仍描述了有意义的学习曲线、需要专门技术负责人、设置或页面加载时偶发变慢，以及“生产中一切重要事项都能无代码完成”这一营销说法的现实边界。尽调结论不是信任栈弱；更准确地说，治理和安全在纸面上具备企业级准备度，但采用难易度高度取决于实施纪律、流程归属，以及买方期望业务用户在没有技术备援的情况下完成多少定制。对那些把无代码等同于完全不需要技术归属的客户而言，评价层是有用的纠偏。
