  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与平台打包
        blocks:
          - type: paragraph
            body: >-
              Creatio 当前产品故事围绕一个智能体无代码平台展开，而不是一组松散拼在一起的点产品。留存的官方页面一致描述 Studio Creatio 是用自然语言和可视化工具搭建应用及 AI
              智能体的设计界面；Sales、Marketing 和 Service Creatio 则仍是打包 CRM 应用，运行在同一平台上。这一点对尽调很重要，因为 Creatio
              卖的不只是给开发者用的工作流工具，也在向收入和支持团队销售可直接进部门运营的应用。AI 层现在已经嵌入这种打包方式：Creatio.ai
              被定义为原生能力，带有面向销售、营销、服务和通用工作流的预构建智能体，而不是外挂助手。官方页面还强调可组合架构、可复用组件和价值导向定价，让买方可以逐步添加应用和组件。用客户语言说，平台承诺很直接：业务团队可以自动化面向客户和运营的工作流，技术团队仍保留更深扩展的退路。官方材料支持公司围绕
              AI 原生定位、Studio Creatio、CRM 应用和 20
              个垂直行业工作流模板的主张；但当前页面使用的是更宽泛的“数千客户”，没有重述精确公开客户数。这个缺口不削弱产品广度，但确实限制了仅靠公开材料精确对标平台规模的能力。
