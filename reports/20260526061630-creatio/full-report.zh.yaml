      - number: '3.3'
        title: 切换成本、多栖使用与 Creatio 能诚实主张的护城河
        blocks:
          - type: paragraph
            body: >-
              Creatio
              的护城河是真实的，但更多来自执行，而不是结构性壁垒。买方一旦建模工作流、分配权限、连接数据源，并通过伙伴或内部管理员扩展系统，确实会产生切换成本。这会形成有意义的惯性。但这个市场也高度多栖：Microsoft
              可以用 Power Apps 和 Dynamics 回应，Salesforce 可以用 Agentforce 和平台工具回应，ServiceNow 有 App Engine 和 CSM，Appian
              有流程自动化深度，Pega 有编排式案例管理。这些替代品都不会让 Creatio 失去意义，但都会限制赢者通吃式结果。Creatio 今天能公开捍卫的最强护城河主张，不是某项独占能力，而是统一
              CRM、工作流自动化、AI 智能体，以及新推出的无席位 Unlimited
              定价模型的组合。这个组合在企业交易里足够差异化，尤其适用于买方想减少供应商、加快采用的场景。公开证据仍未证明的是，当大型既有厂商调动更宽的套件经济时，这种差异化能否转化为更高胜率、更低流失或持久定价权。换句话说，Creatio
              的战略位置看起来不错，但护城河案例仍需要内部经营证据。下一步尽调因此是商业证据：Unlimited 定价、伙伴杠杆和跨工作流捆绑，究竟在哪些竞争选型比拼中真正改变了结果。
