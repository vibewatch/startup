      - number: '1.3'
        title: 融资历史、规模与可见运营体量
        blocks:
          - type: paragraph
            body: >-
              融资记录从 2021 年开始最扎实。Volition Capital 2021 年 2 月公告记录了 $68M 融资，并把 Creatio 定位为伙伴主导的低代码流程管理和 CRM
              厂商；后续独立报道也清楚说明，公司在引入外部资本前已经自举多年。2024 年融资证据更强：TechCrunch 报道称 Sapphire Ventures 领投 $200M，StepStone、Volition
              和 Horizon 参投；Forbes 将同一事件描述为公司在六年自举后达到 $1.2B 估值。公开运营规模信号有意义，但并不完全一致。官方 2024 年公司新闻称 Creatio 有 700
              名员工、七个办公室，并在 25 个国家有本地代表；首页展示 550 个伙伴、覆盖 100 个国家、在 25
              个国家有本地存在并拥有十个办公室；面向客户的页面称数千客户每天启动数百万条工作流。一家第三方销售数据供应商追踪到 6,671 家客户公司，这有方向性价值，但弱于官方披露，不应当作权威客户数。
