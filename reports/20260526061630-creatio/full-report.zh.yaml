  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Creatio 的正面逻辑很直接。公司 2024 年以 $1.2 billion 估值融资 $200 million，吸引了 Sapphire Ventures 和其他增长投资人，并继续把自己定位为 AI
              原生、无代码 CRM 和工作流平台，而不是狭窄功能工具。官网页面和客户参考支持规模叙事：数千客户、工作流每天在 100 个国家运行，以及覆盖 100 个国家的伙伴足迹。TechCrunch
              的竞争框架也以一种有用方式同时指向两面。它确认 Creatio 正在经营企业级品类——销售、服务、营销和工作流——但也说明真实基准不是一小组私营同业。公司必须与
              Oracle、Salesforce、Microsoft 和 SAP 竞争，这意味着估值既要反映真实品类相关性，也要反映更大平台用捆绑、安装基础杠杆和 AI 插件拖慢 Creatio
              商业动能的风险。这个组合导向一个谨慎但不轻率否定的判断：继续研究，而不是回避。产品和品类证据足够强，值得保持跟进；但公开价格支撑证据还不足以激进承销。
