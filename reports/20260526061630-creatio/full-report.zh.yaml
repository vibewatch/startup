  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Creatio 自己的叙事让市场边界比传统 CRM 对比更宽，但又没有宽到整个企业软件宇宙。产品故事把智能体 CRM 套件、工作流自动化、AI
              智能体、应用市场插件、行业工作流和无代码应用搭建组合在一起。也就是说，公司处在企业低代码应用平台、CRM 套件和工作流 / BPA 平台的重叠区。实际替代集因此不只是其他 CRM
              厂商，还包括能够拥有同一批前台和运营工作流的更广义自动化套件。Salesforce 在一个可信平台上销售 AI 智能体、Customer 360 和企业自动化；ServiceNow 销售带低代码、集成、流程挖掘和
              RPA 的单一企业自动化平台；Appian 将企业低代码聚焦在流程编排和强治理工作；Microsoft Power Apps 强调受治理的员工自建应用；Pega
              则组合工作流自动化、客户旅程和低代码开发。就尽调口径而言，应纳入的支出，是帮助企业用低代码或相邻工作流工具设计、自动化、治理并运营面向客户或运营流程的软件和服务。应剔除的支出，是纯协作工具、通用 BI，或只做孤立
              RPA、并不争夺同一前台工作流标准化预算的类别。
