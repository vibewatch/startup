  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 收入支撑至少约 $0.16B，增长维持在公司声称的 50% 附近，AI 差异化也能守住。
        - 如果溢价经济性更像离群高值而非同业中位数，2024 年估值可能被证明合理，甚至偏保守。
        - 需要溢价增长、强利润率，并证明大平台竞争可控。
        - 有可能，但今天公开财务披露还不支持。
      - - 基准
        - 公开市场倍数纪律维持在 3.13x 集群附近，投资者加价前要求最新披露。
        - 业务可能仍然不错，但入场应等收入、利润率和股权结构事实清楚后再说。
        - 不透明、AI 倍数分化和企业级客户漫长验证周期，让该估值难以验证。
        - 基于公开证据，最站得住脚的姿态。
      - - 悲观
        - 收入支撑显著低于约 $0.34B-$0.38B，公开同业继续在 2x-4x 附近交易。
        - 2024 年估值显得偏贵，新资金很可能要求折价或更严条款。
        - 竞争压力、部署摩擦或地缘政治扰动可能加速重估。
        - 如果分母质量不及预期，下行空间实质存在。
      - - 决策姿态
        - 公司强，分母弱。
        - 保持跟踪，但在为现有标价背书前坚持要证据。
        - 风险在于，用私募溢价买入一个公开市场可能更保守定价的业务。
        - 支持继续研究，不支持买入。
    notes: 这些情景是投资评估框架，锚定公开可比倍数区间和所需收入支撑，而不是锚定一个公司声称的当前 Creatio 收入数。
