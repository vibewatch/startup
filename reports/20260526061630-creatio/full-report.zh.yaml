  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与 AI 治理风险
        blocks:
          - type: paragraph
            body: >-
              Creatio 的一阶风险，是产品野心扩张速度快于公开法律细节。公司营销智能体 CRM 和工作流平台，称客户每天在 100 个国家运行数百万条工作流，并明确把自己定位为客户数据的 GDPR
              处理者。还没有叠加任何客户特定行业规则时，这已经形成了很宽的隐私和模型治理表面。已审阅公开材料显示，Creatio 更新了 2026 年主订阅协议、SLA/支持政策、能力附件和 AI
              服务附件，同时发布围绕人在回路控制、零信任安全和专用隐私层构建的 AI 信任语言。这些是真实缓释，但没有回答核心尽调问题：AI 附件里承担哪些责任、允许哪些子处理方、模型输出风险如何分配，以及 AI
              或隐私事件后公司必须多快通知客户。外部监管环境是在收紧，而不是放松：GDPR 仍是基础，EU AI Act 提高了 AI 驱动企业工作流的负担，ICO 指南要求评估权利和自由风险，EDPB Opinion
              28/2024 则把合法基础、匿名性和缓释分析更深地推入模型运营。
