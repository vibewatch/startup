      - number: '2.4'
        title: 增长驱动很强，但治理、集成和执行仍会打断采用
        blocks:
          - type: paragraph
            body: >-
              品类顺风是真实的。Gartner 将低代码增长与业务技术人员、超自动化和可组合性相连；CRM 研究指向 AI 驱动的个性化、多渠道互动和客户留存压力；工作流 / DPA
              研究强调数字化转型、云采用以及减少手工劳动的需求。Creatio 自身叙事正好嵌在这些潮流里，重点强调 AI
              智能体、自然语言设计、应用市场插件和更快实现价值。但同一批来源也保留了尽调真正要看的拖累因素。外部研究警告集成限制、实施成本、技能缺口和定制上限。评价页面称 Creatio
              能降低开发工作量并加快部署，但也记录了性能问题、版本控制问题、UI
              粗糙、小型买方的定价压力，以及超出简单用例后扩展复杂度上升。这些摩擦很重要，因为在许多企业里，既有替代方案已经占据相邻架构。切换成本、治理以及集成遗留系统的能力，至少和低代码易用性一样，决定 Creatio
              能否把品类增长转化为持久份额提升。
