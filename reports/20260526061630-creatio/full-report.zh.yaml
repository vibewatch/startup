      - number: '5.2'
        title: 架构、交付模型与开发者界面
        blocks:
          - type: paragraph
            body: >-
              底层看，Creatio 将平台定位为可组合、基于微服务的系统，把无代码设计与传统企业工程混在一起。开发者索引暴露了架构、后端开发、Freedom UI 前端工作、集成和
              API、移动开发以及应用市场应用开发；这意味着即便买方从可视化工具切入，实施方仍面对一个很宽的技术表面。架构页面点名 .NET Core、Angular 和 OpenStreetMap；无代码材料则指向 SOAP
              与 REST 集成，以及 Freedom UI Designer 组件。文档之外，开发者信号也是真实的，而不只是愿景：clio 仓库描述了 CI/CD 集成和页面级 Freedom UI 操作，公开 API
              参考指向 webhooks、认证、OAuth、GraphQL 和 Postman 集合。交付选项同样面向企业。Creatio 称客户可以采用私有云、本地部署或混合模式；云层横跨 AWS 和
              Azure；可靠性材料强调水平扩展、集群和容错。这个组合说明一种务实运营模型：业务用户可以可视化配置典型工作流，但有意义的企业部署仍依赖
              API、部署选择、伙伴实施能力和开发者工具组成的技术生态。净效果是，产品看起来足够可扩展，能支撑严肃企业部署；但买方不能只靠营销文案完成技术尽调。
