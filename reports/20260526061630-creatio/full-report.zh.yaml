        - 无法精确测算当前业务规模或增长效率
        - 合作伙伴来源提到增长和客户覆盖，但没有当前收入线
        - 获取经审计集团收入，以及任何内部 ARR 或订单预订额衔接表
      - - 毛利率和支持业务利润率
        - 无法区分软件质量与服务拖累
        - 支持包可以变现，但没有利润率披露
        - 要求提供软件、支持和服务的毛利率衔接
      - - 现金、烧钱速度和现金跑道
        - 无法验证融资依赖或下一轮触发条件
        - 2024 年融资轮已知；英国实体现金可见，但集团现金不可见
        - 要求提供集团现金流量表、烧钱速度、债务和现金跑道计划
      - - 合作伙伴经济性
        - 渠道主导模型下，无法测算 CAC 或总额到净额效率
        - 据报道 50% 业务来自合作伙伴
        - 提供合作伙伴来源管线、佣金、服务拆分和续约表现
      - - 实际 Unlimited 定价
        - 无法判断新包装是改善利润率，还是只帮助收入线采用
        - 官方包装变更可见
        - 按部署规模收集已签订单和续约条款
      - - 集团杠杆和债务契约
        - 无法评估债务风险或融资弹性
        - 英国备案中可见实体层面的押记清偿
        - 提供债务明细、贷款人协议和债务契约余量
      - - 按队列划分的实施负担
        - 无法给隐藏交付成本或客户回本定价
        - 评论网站提示设置工作量和可扩展性担忧
        - 按客户队列提供实施周期、支持负载和价值实现时间
