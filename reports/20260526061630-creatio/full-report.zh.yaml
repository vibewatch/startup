      - number: '6.3'
        title: 满意度信号、留存可见度与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开满意度证据明显分化，而不是一边倒正面。归档企业评价表面很强：G2 有 311 条评价、评分 4.7/5，Capterra 有 121 条评价、总体
              4.7，重复主题包括灵活性、统一工作流和快速定制。Trustpilot 是主要反重力。其归档页面只有 12 条评价、评分
              2.4/5，并包含关于速度慢、支持质量和无代码承诺夸大的尖锐投诉。这种分裂可能反映了不同用户群：一边是评价平台本身的企业运营者，另一边是下游门户用户或受挫的实施场景。留存和集中度方面，公开可见度弱得多。留存来源没有披露
              NRR、GRR、续约率、合同期限或头部客户集中度。即便很强的客户证明页面，也强调部署速度、TCO、采用率和工作流结果，而不是长周期耐久度。这造成了有意义的尽调缺口。此外，2024 年融资新闻稿称 50%
              业务来自渠道伙伴，这有助于扩张，但也意味着客户获取和交付质量仍部分依赖伙伴表现。整体客户图景在采用和使用证据上有利，但在续约质量和集中度风险上不完整。缺失的耐久度层，是客户尽调中最核心的未解决问题。
