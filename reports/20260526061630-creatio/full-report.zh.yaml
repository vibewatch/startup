        - 更像分阶段内部自建的强替代，而非整体替换
      - - Pega
        - 已审阅产品来源中没有留存的公开标价
        - 定制报价 / 企业销售动作
        - 营销强调 AI 和工作流收益，但商业条款不公开
        - 定价不透明可能拖慢直接竞争归一化比较
