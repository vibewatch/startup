      - number: '7.4'
        title: 缓释因素、监测指标与否决标准
        blocks:
          - type: paragraph
            body: >-
              公开缓释故事足以让 Creatio 不进入回避名单，但还不足以在没有后续跟进的情况下承销。公司有连贯的公开安全叙事、刷新后的合同栈、明确的区域托管语言，以及可见的 AI
              治理信息。这些因素削弱了“立刻出现灾难性失误”的上行情景。它们没有消除投资人专属否决标准的必要性。最干净的监测指标包括：重大隐私或 AI
              合规问询；新的云或模型宕机并可见中断客户工作流；伙伴来源交付质量下滑的证据；AI 或文件处理中的重大安全疏漏；或新的披露显示基辅仍占关键工程或支持岗位的过高比例。核心洞见是，Creatio
              的风险是传导风险。它们不需要变成生死问题才会重要。一次温和的合规失败、一次管理不善的宕机，或一次伙伴执行问题，仍可能拖慢部署、拉长销售周期、提高客户审查强度，并压缩新投资人按 2024
              年标记或更高水平支持下一阶段的意愿。因此，即便承认公司已公开披露的控制措施，剩余暴露仍然偏高。
