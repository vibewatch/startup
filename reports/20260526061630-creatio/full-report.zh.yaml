      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计财务
        - 当前收入或 ARR、毛利率和现金流桥
        - 将名义估值转成可测试倍数
        - 管理层资料室或投行材料
      - - 留存 / 队列质量
        - NRR、流失率、客户集中度和队列留存
        - 判断溢价倍数是否可持续，而不只是叙事支撑
        - 客户分析导出和队列包
      - - 股权结构表和优先权
        - 清算瀑布、稀释条款，以及 2024 年融资中的任何棘轮条款
        - 名义投后估值可能高估普通股等值价值
        - 律师审查融资文件
      - - 老股价格发现
        - 2024 年后的已执行老股交易或基金估值
        - 新的市场出清数据可交叉验证私募估值
        - 老股经纪、基金披露或投行核查
      - - 乌克兰 / 合作伙伴集中度
        - 按地域拆分的职能人数和合作伙伴来源 ARR
