  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 品类位置
        - Creatio 是可信的 AI 原生 CRM 和工作流平台，不是边缘工具。
        - 收入和利润率披露缺位时，品类可信度不能压过价格纪律。
        - 经审计 KPI，显示相对工作流同业的溢价经济性。
      - - 规模证明
        - 数千客户、覆盖 100 个国家的工作流和蓝筹投资者，说明公司不是小玩家。
        - 规模说法很宽，但仍未揭示收入分母或留存质量。
        - 已验证的 ARR 区间、客户集中度和队列留存。
      - - 竞争背景
        - 能与 Microsoft、Salesforce、SAP 和 Oracle 竞争，说明品类相关性成立。
        - 这些既有巨头能捆绑更多功能，挤压胜率或定价。
        - 胜率证据和客户背书，证明公司能在规模上持续替换既有方案。
      - - 2024 年融资
        - 新的 2024 年融资，比依赖过时的 2021 年估值更有证明力。
        - 如果分母仍不公开，新融资也只是一个价格点。
        - 老股交易或共同基金估值，确认该轮价格仍能被市场消化。
      - - AI 叙事
        - 相比更慢的传统工作流同业，AI 原生定位可能支撑一定溢价。
        - 2026 年公开软件倍数分化，取决于 AI 赢家属性还是颠覆风险，不只看叙事。
        - 可量化的 AI 附着率、利润率和经验证的客户生产环境使用。
    notes: 反向逻辑指向价格形成和披露质量，而不是质疑 Creatio 是否具备战略相关性。
