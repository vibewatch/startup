            - 分支机构或部门铺开
            - 数据迁移
            - 初始仪表盘
        - id: adopt
          label: 规模化采用
          actor: 一线用户
          description: 销售、客服坐席或市民服务团队用上共享仪表盘、路由和任务管理后，采用会进一步加深。
