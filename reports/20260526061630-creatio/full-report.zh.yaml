  - id: TP001
    title: 竞争对手画像表
    columns:
      - 厂商
      - 类别
      - 规模 / 融资信号
      - 核心购买任务
      - 公开差异化
      - 公开限制
    rows:
      - - Creatio
        - 统一 CRM + 工作流平台
        - 私营；2024 年以 $1.2B 估值融资 $200M；在 100+ 个国家拥有数千客户
        - 覆盖销售、服务和流程自动化的中端市场到企业级客户工作流
        - 统一 CRM 加无代码工作流加 AI 智能体；Unlimited 定价选项
        - 公开输赢和留存证据偏薄；评论页仍提示配置和可扩展性摩擦
      - - Salesforce
        - CRM 既有巨头
        - 大型上市 CRM 既有厂商，投资者信息披露完整
        - 前台 CRM、销售生产力和 AI 辅助收入工作流
        - 深度 CRM 套件、Agentforce、统一数据、年度合同企业销售
        - 席位和套件复杂度可能推高成本和采购负担，弱于轻量部署
      - - ServiceNow
        - 工作流 / 客户工作既有厂商
        - 大型上市工作流平台，企业覆盖广
        - 跨职能工作流、服务运营和客户服务编排
        - 企业级应用引擎、治理、审计、AI 辅助服务工作流
        - 定价以报价为主，平台宽度也意味着更重的采购和管理动作
      - - Appian
        - 低代码 / 流程自动化专家
        - 上市流程自动化厂商，设有专门 IR 信息披露
        - 案件管理、编排和转型项目
        - 流程深度、治理、分层低代码平台、autoscale 主张
        - 评论证据显示，尽管自动化深度强，实施仍可能更难
      - - Microsoft Power Apps + Dynamics
        - 内部自建 / 既有套件替代
        - 超大规模软件既有厂商，提供免费开发者入口和付费生产阶梯
        - 基于现有 Microsoft 数据构建自定义应用，并扩展 CRM 工作流
        - 低成本试验路径、强扩展性、与 Dataverse 和 Dynamics 原生绑定
        - 可能把工作重新推回内部团队，也不会自动交付打包好的跨职能 CRM 运营模型
      - - Pega
        - 工作流 / 案件管理专家
        - 成熟企业软件专家
        - 复杂旅程、案件管理、客户服务和决策
        - AI 引导编排、低代码规则、强服务旅程定位
        - 定价不透明，买家可能仍依赖专家支持和定制
      - - 现状替代：内部自建 + 单点工具
        - 替代方案
        - 既有技术栈预算和内部人力，而非新增外部融资
        - 扩展现有 CRM、Microsoft 栈、电子表格、门户和自定义集成
        - 不需要新增战略供应商；可贴合现有治理和数据资产
        - 隐性交付负担、割裂 UX，见效慢于购买集成平台
    notes: 画像行混合了直接同业、既有巨头和最可信的现状替代方案，因为企业买家可以用多种方式解决同一个任务。
