      - number: '3.2'
        title: 能力广度、定价姿态与企业采购摩擦
        blocks:
          - type: paragraph
            body: >-
              能力广度已经不再是过去那种干净分隔线。Creatio 平台现在组合了 CRM 应用、无代码开发和 AI 智能体；Salesforce、ServiceNow、Appian、Microsoft 和 Pega
              也都呈现出这些元素的不同组合。更持久的差异在打包方式和采购动作里。Creatio 2026 年 Unlimited
              发布具有战略意义，因为它直接攻击仍塑造许多企业软件交易的按席位逻辑；它告诉买方，采用规模可以扩大，而不增加按用户计费摩擦。相比之下，Salesforce 仍把买方引向年度合同，Appian
              围绕层级和用户授权结构组织权益，Microsoft 保留从免费开发者到付费生产的阶梯，ServiceNow 和 Pega
              仍更偏报价驱动和销售协助。这些差异很重要，因为采购团队比较的不只是功能；他们也比较启动、治理、扩张和长期预测成本的难度。第三方评价表面也强化了一点：产品强并不会消除摩擦，用户仍会抱怨实施投入、规模化性能或定价匹配。结果是，在这个市场里，打包纪律和生态适配对许多交易的影响，不亚于原始功能数量。落到实操，竞争往往取决于买方是现在就想要一个集成打包栈，还是更愿意在既有套件内部逐步拼能力。
