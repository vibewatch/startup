      - number: '7.3'
        title: 依赖、竞争与商业执行风险
        blocks:
          - type: paragraph
            body: >-
              商业风险是复合型的：Creatio 同时依赖外部基础设施、外部模型、外部伙伴和拥挤的企业采购环境。托管依赖是明确的——AWS 和 Azure 运行平台——Creatio.ai 材料还把用户指向 Azure
              OpenAI 文档，暗示当前对 Microsoft AI 栈存在模型供应商依赖。伙伴依赖也不是偶然，而是结构性的：公司称其在 100
              个国家有伙伴，并把联合市场拓展视为客户价值交付的核心。这意味着即便底层产品仍具竞争力，只要渠道表现滑坡，销售执行、部署质量和续约都可能恶化。与此同时，独立报道称公司在前台工作流上与
              Oracle、Salesforce、Microsoft 和 SAP 竞争。这些不是边缘对手，而是平台既有厂商，有能力把 CRM、工作流、分析、身份和 AI 捆进现有企业关系。Creatio 2024 年融资和公开
              50% 增长主张降低了市场对失误的容忍度，因为 $1.2B 标记意味着投资人已经在承销持续执行。实操中，漫长企业销售周期、更复杂权限设计，以及更重的客户合规定制，都是估值风险，而不只是运营噪音。
