      - number: '8.3'
        title: 公开可比公司与情景逻辑
        blocks:
          - type: paragraph
            body: >-
              公开可比公司的图景，比 2024 年融资周围的私募新闻更有约束力。最接近的工作流和自动化公司——HubSpot、Pegasystems、Freshworks、Appian、UiPath，甚至
              Salesforce——市值 / 收入大致聚在 2x-4x；ServiceNow 作为高溢价规模化离群值，约为 7.5x。这个可比组不能证明 Creatio 被高估，因为公开证据仍缺 Creatio
              自己的收入分母。它证明的是，2024 年标记已经需要有意义的收入支撑。在同业式低到中 3x 区间，$1.2 billion 意味着大约需要 $0.34B-$0.40B 收入支撑。即便投资人给予 Creatio
              类似 ServiceNow 的溢价处理，公司仍需要约 $0.16B 收入支撑。这就是 2026 年市场数据叠加层重要的原因。Multiples.vc 强调 AI 驱动的巨大离散度，以及横向 SaaS
              的“创造性破坏”；Sapphire 2026 年报告则点出估值波动和退出时间线拉长。换句话说，市场愿意奖励 AI 原生胜者，但前提是分母能让投资人信任。在 Creatio 提供这个分母前，情景表必须保持保守。
