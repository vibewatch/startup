      - number: '6.2'
        title: 具名客户证据与部署深度
        blocks:
          - type: paragraph
            body: >-
              具名参考质量，是 Creatio 客户章节里最清楚的强项。BSN Sports、Howdens、Purplebricks 和 Altro 都发布了具体工作流结果，而不是泛泛背书。BSN Sports 报告
              100% 采用、每名销售专业人员负责的客户组合大约扩大 50-60%，并且管理员比例很精简。Howdens 将 Creatio 描述为 12 周首个仓库部署、20 个试点仓库、六个月 1,200
              条合格线索和可衡量转化提升背后的引擎。Purplebricks 提供了文件集中最干净的第三方佐证之一：官方和独立来源都指向替换遗留 Salesforce 与自定义 .NET 系统、线索量提升 35%、转化提升
              50%，以及线索响应少于 20 分钟。Altro 展示了另一类客户画像：一家全球制造商把七个国家标准化到一个 CRM 上，交付约 900 项配置变更，其中只有两项需要写代码，并在三个月内达到
              MVP。公共部门页面进一步拓宽证据集，展示 Boston 和 Maryland 的用例：面向客户的工作流是市民服务或融资运营，而非传统 B2B
              账户管理。主要尽调提醒是，公开证据仍是精选样本，不是生产部署的完整名册。新鲜度是强项，完整性不是。
