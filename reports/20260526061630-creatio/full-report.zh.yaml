              Katherine Kostereva 是留存记录里最清楚的个人层面事实：官网称她为 CEO 和创始人，独立数据库重复同一职务，Forbes
              报道还补充了她来自乌克兰的创始人背景。地域信号也具有方向性，尽管不同页面没有完全标准化。Crunchbase 和 Craft 都把总部放在大波士顿 / 波士顿地区；Craft 同时列出乌克兰地点，2021 年
              Forbes 人物报道也称公司总部在波士顿。相比身份披露，治理披露更有限。首页和关于页面可见董事会包含 Sean Cantwell、Rajeev Dham 等与投资方相关的人物，以及 JD Sherman 和
              Roger Hurwitz；官网关于页面还列出更宽的高管梯队，包括 COO Sergey Sorokin 和首席产品官 Ivan
              Malafieiev。公开证据仍缺的，是后期投资人通常会要求看清的完整委员会、投票权和所有权控制图谱，然后才会依赖一个治理叙事。
