  - id: TV005
    title: 投资逻辑破裂与否决触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 折价新一轮融资或老股交易
        - 任何明确低于 2024 年估值的定价
        - 表明市场不会在不重置价格的情况下认可上一轮新股价格
        - 按新成交价重新评估，不按旧的名义估值
      - - 商业放缓
        - 相比平台既有巨头，胜率可见压缩或销售周期显著拉长
        - 削弱溢价增长逻辑
        - 除非价格也重置，否则将立场从继续研究转向回避
      - - 披露不及预期
        - 经审计收入、利润率或留存指标显著低于溢价倍数所隐含的水平
        - 证实分母风险，而不只是披露延迟
        - 使用公开工作流可比区间，而非高溢价离群区间
      - - 运营 / 地缘政治扰动
        - 重大连续性事件打击部署或支持可信度
        - 让本已不透明的估值变成质量风险故事
        - 要求更深折扣和更高证明门槛
      - - AI 溢价未体现在经济性中
        - 叙事强，但没有可衡量的 AI 附着率、利润率或留存提升
        - 拿掉了支付高于公开工作流同业价格的主要理由
        - 证据跟上前暂缓入场
    notes: 这些是投资评估纪律中的实用断点，不是点预测。
