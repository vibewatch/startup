      - number: '4.3'
        title: 资本充足性、备案证据与财务结论
        blocks:
          - type: paragraph
            body: >-
              最稳妥的资本充足性结论是好坏参半。正面看，2024 年 6 月以 $1.2 billion 估值完成的 $200 million
              少数股权融资，显著降低了即时融资风险；公开层面没有紧急过桥或救助场景迹象。负面看，留存来源集中唯一真正接近备案级的财务证据，是 Creatio Limited 的 UK
              法定记录，而它不能替代合并集团财务。2025 年 UK 账目显示的是一个小型经营实体：现金 £89,795、应收债务人 £1.24 million、流动债权人 £522,634、长期债权人 £6,965、净资产
              £870,263、平均员工 16 人。关于 HMRC 延期 VAT 计划的备案注释很重要，因为它说明公司在主动管理营运资本；2025 年 11
              月一项押记解除，则暗示实体层面至少清偿了一项有担保债务。但这些都没有回答集团层面的核心问题：收入质量、利润率路径或现金跑道。UK 现金余额显然太小，不能在 $200 million
              增长轮之后代理集团流动性。实际结论因此是，资本充足性方向上看起来可以接受，但在管理层提供合并现金、烧钱速度、债务和续约经济学前，仍不能完全承销。
