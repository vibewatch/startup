      - number: '8.2'
        title: 融资背景与披露质量
        blocks:
          - type: paragraph
            body: >-
              融资历史对估值锚定有帮助，但不完整。2021 年 $68 million Series A 的意义，主要在于它显示 Creatio 比许多软件同业更晚进入机构融资，在此之前已经先搭出有意义的业务。更相关的锚点是
              2024 年以 $1.2 billion 估值融资 $200 million，因为它新鲜且由机构领投。不过，公开验证到这里就停止了。本次审阅的公开官方页面，没有提供审计收入、毛利率、留存、自由现金流或当前 ARR
              桥接。独立报道补充了一些运营色彩——Research.com 引用约 850 名员工、10 个办公室和 500 个伙伴——但没有给出把 2024
              年价格转换成干净承销倍数所需的分母。这是核心估值障碍。不同于公开同业，Creatio 还没有常规披露基础设施。Salesforce、ServiceNow 和 Pega 的投资者关系页面与 SEC
              备案记录有用，不是因为它们直接说明 Creatio，而是因为它们展示了公开市场对软件发行人的披露基线。Creatio 有一个新近标记，但仍带有私营公司不透明性，这让入场纪律比讲故事更重要。
