companyProfile:
  summary: >-
    Creatio 是一家后期私营企业软件公司，核心是无代码工作流自动化和 CRM。公开证据支持几个关键判断：公司总部在波士顿，由创始人兼 CEO Katherine Kostereva 领导，具有清晰的乌克兰根源，2019 年从
    bpm'online 更名为 Creatio，产品栈覆盖 Studio Creatio、打包 CRM 应用、行业工作流、应用市场扩展以及更新的 AI 原生能力。公司多年自举经营，之后在 2021 年融资 $68 million，并在
    2024 年以公开宣传的 $1.2 billion 估值融资 $200 million。围绕客户、伙伴和部署的公开证据，足以证明公司在品类里确有位置；但准确创立时间、合并财务、留存和股权结构细节，公开披露仍然偏薄。
