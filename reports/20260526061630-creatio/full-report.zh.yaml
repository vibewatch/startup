      - number: '4.2'
        title: 增长代理指标、渠道经济学与公开可见度边界
        blocks:
          - type: paragraph
            body: >-
              Creatio 的公开牵引力故事方向上很强，但结构上不完整。伙伴和投资方公告描述了一家公司：多年收入增长 50%，有数千客户，触达 100
              多个国家，并拥有大型伙伴生态，约一半业务来自该生态。这些都是分发效率和市场相关性的有意义指标。问题在于，它们仍然是代理指标，而不是可承销的单位经济。Tracxn 数据库将已披露累计融资放在 $273
              million，甚至列出一笔小额 2025 年后续记录；官方伙伴公告则证实了更大的 2021 年和 2024
              年融资，但没有解释那条额外记录。评价来源又提供了一个有用但不完美的视角：用户看到了灵活性和业务影响，但也抱怨小型企业定价匹配、设置投入，以及性能或可扩展性摩擦。这些负面信号重要，因为它们暗示实施成本和支持负担，但仍无法推导出
              ARR、CAC 或毛利率公式。即便 CB Insights 和 PitchBook
              这样的付费数据平台，也只暴露档案式财务覆盖，而不是审计报表。结果是，本章拥有可信增长代理指标，但核心承销数字所在的位置仍存在重大披露缺口。
