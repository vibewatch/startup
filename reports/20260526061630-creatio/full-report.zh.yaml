  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础、细分与采用足迹
        blocks:
          - type: paragraph
            body: >-
              当前最强的公开证据显示，Creatio 服务一个广泛但未被精确量化的安装基础。官方页面反复称平台支持 100 个国家的数千客户，关于页面则补充了 100 个国家的 550 个伙伴和 25
              个国家的本地存在。按细分看，证据比按精确客户名单规模更具体。客户证明页面显示，使用场景覆盖分销和外勤销售（BSN
              Sports）、房地产（Purplebricks）、制造业（Altro）、公共部门和市民服务（Boston、Pittsburgh、Maryland）、公用事业和居民服务（Sureserve），以及医疗或行为健康（Guided
              Care 和 Lucas County 的心理健康委员会）。这个广度很重要，因为它显示 Creatio 销售范围已经超出狭窄销售 CRM
              领域，进入具有强治理和案例管理需求的运营工作流。基准客户成功页面进一步把客户价值主张框定为实施速度快 70%、TCO 降低 37%，以及复杂组织内 90%+ 的采用率。仍缺的是 2026
              年客户数的精确度：留存官方来源验证了数千客户，但没有直接重述常被引用的 7,000+
              数字，因此当前规模应被视为方向上很强，而不是在公开材料中已被数值钉死。公开广度比精确规模更容易验证。买方触达横跨商业和公共工作流。
