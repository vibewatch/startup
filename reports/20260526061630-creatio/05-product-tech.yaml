  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Creatio's current product set is best understood as one AI-native no-code platform with Studio Creatio as the design surface and Sales, Marketing, and Service as packaged CRM applications on top. Retained official and technical-doc sources support a real enterprise architecture story—microservices, AWS/Azure or on-prem deployment, API and developer tooling, separate tenant databases, and explicit AI-governance controls—while independent reviews still warn that the no-code promise becomes more technical in complex implementations. The strongest validated differentiators are native AI packaging, composable architecture, and a partner-led extension model rather than a publicly quantified current customer-count claim."
  },
  "sections": [
    {
      "id": "platform-definition",
      "title": "Product scope and platform packaging",
      "body": "Creatio’s current product story is built around one agentic no-code platform rather than a loose bundle of disconnected point products. The retained official pages consistently describe Studio Creatio as the design surface for building applications and AI agents with natural language and visual tools, while Sales, Marketing, and Service Creatio remain packaged CRM applications that sit on the same platform. That matters for diligence because Creatio is not only selling workflow tooling to developers; it is also selling department-ready operating applications to revenue and support teams. The AI layer is now embedded in that packaging: Creatio.ai is framed as a native capability with pre-built agents for sales, marketing, service, and general workflows, not as a bolt-on assistant. Official pages also emphasize composable architecture, reusable components, and value-based pricing that lets buyers add apps and components over time. In customer terms, the platform promise is straightforward: business teams can automate customer-facing and operational workflows, while technical teams retain an escape hatch for deeper extension. Official materials support the company’s claims around AI-native positioning, Studio Creatio, CRM apps, and 20 vertical workflow templates, but current pages use the broader phrasing \"thousands of clients\" rather than restating an exact public customer-count figure. That gap does not undermine product breadth, but it does limit how precisely platform scale can be benchmarked from public materials alone.",
