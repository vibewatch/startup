    {
      "id": "architecture-and-extensibility",
      "title": "Architecture, delivery model, and developer surface",
      "body": "Under the hood, Creatio positions the platform as a composable, microservice-based system that mixes no-code design with conventional enterprise engineering. The developer index exposes architecture, back-end development, Freedom UI front-end work, integrations and API, mobile development, and marketplace app development, which implies a broad technical surface for implementers even when buyers start from visual tooling. The architecture page names .NET Core, Angular, and OpenStreetMap, while the no-code materials point to SOAP and REST integrations and a Freedom UI Designer component. Beyond docs, the developer signal is real rather than purely aspirational: the clio repository describes CI/CD integration and page-level Freedom UI operations, and the public API references point to webhooks, authentication, OAuth, GraphQL, and Postman collections. Delivery options are similarly enterprise-oriented. Creatio says customers can run in private cloud, on-premise, or hybrid mode; the cloud layer spans both AWS and Azure; and the reliability materials emphasize horizontal scaling, clustering, and fault tolerance. This combination suggests a pragmatic operating model: business users can configure typical workflows visually, but meaningful enterprise rollouts still rely on a technical ecosystem of APIs, deployment choices, partner implementation capacity, and developer tooling. The net effect is a product that looks extensible enough for serious enterprise deployment, but not one that buyers can evaluate purely from marketing copy without technical diligence.",
