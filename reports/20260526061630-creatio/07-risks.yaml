  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: legal-disclosure-gap
    missingEvidence: Executed DPA, subprocessor roster, AI-annex liability language, and indemnity caps for current enterprise contracts.
    whyItMatters: Without the contractual allocation, investors cannot verify whether privacy, IP, and model-output liabilities sit with Creatio, customers, or both.
    diligencePath: Request the current MSA, SLA, AI Services Annex, and any subprocessor disclosures under NDA and compare them to the public legal hub.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: sla-transparency
    missingEvidence: Historical uptime, region-specific SLA attainment, outage logs, and post-incident root-cause disclosures.
    whyItMatters: Cloud and AI concentration risk is impossible to calibrate without quantified reliability history.
    diligencePath: Request support dashboards, status-page history, SLA credits paid, and incident-review summaries for the last 24 months.
    relatedQuestionRefs:
    - QR027
  - type: private-evidence-only
    severity: material
    topic: kyiv-concentration
    missingEvidence: Current headcount split by function and geography, especially engineering, support, and security roles in Kyiv.
    whyItMatters: The company’s Ukraine roots are clear, but the operational concentration that still sits there is not.
    diligencePath: Request an org chart and country headcount bridge by function, plus documented business-continuity plans for Ukraine-based teams.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Revenue, bookings, and implementation reliance by partner, region, and customer segment.
    whyItMatters: A broad partner footprint can still conceal concentrated revenue or delivery dependencies.
    diligencePath: Request partner-sourced ARR, top-partner concentration, top-customer concentration, and renewal performance by channel.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: minor
    topic: ai-incident-response
    missingEvidence: Public documentation on model rollback procedures, hallucination escalation, or prompt-abuse incident handling.
    whyItMatters: Human-in-the-loop language is helpful, but investors still need operational evidence that AI failures can be contained quickly.
    diligencePath: Ask product/security leadership for internal incident-response playbooks and customer-notification standards specific to AI automation failures.
    relatedQuestionRefs:
    - QR025
    - QR027
