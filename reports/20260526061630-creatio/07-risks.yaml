- id: mitigations-monitors-and-kill-criteria
  title: Mitigations, monitors, and kill criteria
  body: 'The public mitigation story is good enough to keep Creatio out of the avoid bucket, but not good enough to underwrite without follow-up. The company has a coherent public security narrative, a refreshed contract stack, explicit regional-hosting language, and visible AI-governance messaging. Those mitigate the upside case for an immediate catastrophic miss. What they do not do is remove the need for investor-specific kill criteria. The cleanest monitors are: a material privacy or AI-compliance inquiry; a new cloud or model outage that visibly interrupts customer workflows; evidence that partner-sourced delivery quality is slipping; a meaningful security lapse in AI or file handling; or new disclosure showing that Kyiv still holds an outsized share of critical engineering or support roles. The central insight is that Creatio’s risks are transmission risks. They do not need to become existential to matter. A modest compliance failure, one badly managed outage, or one partner-execution
    problem can still slow deployments, lengthen sales cycles, raise customer scrutiny, and compress the willingness of new investors to fund the next stage at or above the 2024 mark. That is why the residual exposure remains high even after giving credit for the controls the company has disclosed publicly.'
