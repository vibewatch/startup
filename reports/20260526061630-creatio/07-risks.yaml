company:
  name: Creatio
chapter:
  number: 7
  title: Risks
  summary: 'Creatio’s risk profile is investable but materially non-trivial: the company is pushing AI-native workflow automation across a global customer base while its public evidence still leaves contractual allocation, SLA transparency, and Kyiv concentration only partially disclosed. The core risk stack is regulatory/privacy and AI compliance first, then hyperscaler and model dependency, then geopolitical and channel-execution concentration, all against a competitive set led by Salesforce, Microsoft, SAP, and Oracle. Public mitigations exist—ISO renewal, zero-trust language, customer-dedicated storage, human oversight, and shared-responsibility materials—but they narrow rather than eliminate residual exposure.'
sections:
- id: regulatory-legal-and-ai-governance-risk
  title: Regulatory, legal, and AI-governance risk
  body: 'Creatio’s first-order risk is that its product ambition is expanding faster than its public legal detail. The company markets an agentic CRM and workflow platform, says customers run millions of workflows daily in 100 countries, and explicitly positions itself as a GDPR processor for customer data. That creates a broad privacy and model-governance surface before any customer-specific sector rules are layered on top. The reviewed public materials show that Creatio has updated its 2026 master subscription agreement, SLA/support policy, capabilities annexes, and AI services annex, while also publishing AI-trust language built around human-in-the-loop controls, zero-trust security, and dedicated privacy layers. Those are real mitigations, but they do not answer the core diligence questions: what liabilities sit in the AI annex, what subprocessors are permitted, how model-output risk is allocated, and how quickly the company must notify customers after an AI or privacy incident. The
    external regulatory context is tightening rather than loosening: GDPR remains foundational, the EU AI Act raises the burden on AI-enabled enterprise workflows, ICO guidance expects rights-and-freedoms risk assessments, and EDPB Opinion 28/2024 pushes lawful-basis, anonymity, and mitigation analysis deeper into model operations.'
  claimRefs:
