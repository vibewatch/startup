- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privacy / AI compliance
    - Formal inquiry or enforcement notice
    - Any DPA, ICO, or other regulator opens a material investigation tied to AI, data rights, or transfers
    - Pause underwriting and re-cut risk rating toward critical until liability allocation and remediation are clear
  - - AI model / workflow dependency
    - Model-provider or AI-service disruption
    - Material feature withdrawal, price shock, or extended outage from the current LLM stack
    - Revisit product gross-margin and differentiation assumptions before new capital is committed
  - - Cloud reliability
    - Severe service interruption
    - Any region-level outage or SLA-credit event that meaningfully disrupts customer workflows
    - Treat as evidence that public mitigation claims are not enough; demand incident history and redundancy proof
  - - Partner execution
    - Channel quality deterioration
    - Top implementation partners miss go-live or renewal targets across a meaningful customer cohort
    - Reduce growth confidence and haircut partner-led expansion assumptions
  - - Ukraine continuity
    - Regional escalation or prolonged disruption affecting Kyiv operations
    - Any event that materially impairs engineering, support, or security staffing continuity
    - Escalate continuity diligence immediately and test whether other regions can absorb workload
  - - Competitive pressure
    - Enterprise sales friction
    - Win rates compress or sales cycles lengthen against Microsoft, Salesforce, SAP, or Oracle bundles
    - Re-rate valuation assumptions because execution risk is transmitting into commercial outcomes
  notes: These are underwriting triggers rather than forecasts; each is designed to catch when a controllable operating risk starts transmitting into valuation.
