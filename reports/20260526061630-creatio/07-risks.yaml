- id: operational-security-and-geopolitical-risk
  title: Operational, security, and geopolitical risk
  body: Operationally, Creatio looks more mature than an early-stage AI vendor, but the remaining blind spots matter because the platform touches customer workflows rather than disposable edge tooling. Public security materials emphasize multi-level monitoring, TLS 1.2, ISO 27001 renewal, customer-dedicated storage for AI-uploaded files, and least-privilege RBAC. Cloud materials say the platform runs on AWS and Azure and that customers can pick regional data centers to support performance and local-law alignment. That is a credible control baseline, yet the evidence set reviewed here still does not quantify outage history, region-level SLA attainment, or AI-specific incident handling. The company also retains visible Ukraine exposure. Creatio’s contacts page still lists Kyiv, and independent coverage after the 2024 round says the company remains Ukrainian-founded with Kyiv R&D despite its Boston headquarters and broader international presence. Management’s public support for Ukraine is a
    strength culturally, but it also confirms that geopolitical continuity is a live operating issue rather than a closed historical footnote. For investors, the question is not whether Creatio can operate globally today; it is whether enough engineering, support, and security capacity remains concentrated in Kyiv to create a material single-region continuity risk during escalation or infrastructure disruption.
  claimRefs:
