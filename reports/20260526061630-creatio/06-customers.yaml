    {
      "id": "named-customer-proof",
      "title": "Named customer proof and deployment depth",
      "body": "Named reference quality is the clearest strength in Creatio's customer chapter. BSN Sports, Howdens, Purplebricks, and Altro all publish concrete workflow outcomes rather than generic praise. BSN Sports reports 100% adoption, roughly 50-60% larger sales book size per sales professional, and a very lean admin ratio. Howdens frames Creatio as the engine behind a 12-week first-depot rollout, 20 pilot depots, 1,200 qualified leads in six months, and measurable conversion improvement. Purplebricks provides one of the cleanest third-party corroborated proofs in the file set: official and independent sources align on replacement of legacy Salesforce and custom .NET systems, 35% higher lead volume, 50% higher conversions, and sub-20-minute lead response. Altro shows a different customer archetype: a global manufacturer standardizing seven countries on one CRM, delivering about 900 configuration changes with only two requiring code and reaching MVP in three months. Public-sector pages widen the proof set further by showing Boston and Maryland use cases where customer-facing workflows are citizen-service or financing operations, not classic B2B account management. The main diligence caveat is that public proof is still a curated sample, not an exhaustive roster of production deployments. Freshness is a strength, exhaustiveness is not.",
