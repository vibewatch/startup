  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Creatio's public customer evidence is strongest on named deployment outcomes and vertical breadth rather than on exact customer-count precision or renewal durability. Official and independent sources corroborate fresh 2025-2026 wins at BSN Sports, Howdens, Purplebricks, Altro, and public-sector accounts, while review surfaces show a split picture: strong enterprise satisfaction on G2 and Capterra but materially worse open complaints on Trustpilot. The major diligence gap is not whether customers exist or deploy at scale—that is well supported—but whether customer concentration and retention metrics are as strong as the adoption stories imply."
  },
  "sections": [
    {
      "id": "customer-base-and-segmentation",
      "title": "Customer base, segments, and adoption footprint",
      "body": "The strongest current public evidence suggests that Creatio serves a broad but not precisely quantified installed base. Official pages repeatedly say the platform supports thousands of clients in 100 countries, while the about page adds 550 partners in 100 countries and 25 countries of local presence. The evidence is more detailed by segment than by exact logo count. Customer-proof pages show usage across distribution and field sales (BSN Sports), real estate (Purplebricks), manufacturing (Altro), public sector and citizen services (Boston, Pittsburgh, Maryland), utilities and resident services (Sureserve), and healthcare or behavioral health (Guided Care and Lucas County's mental-health board). This breadth matters because it shows Creatio is selling beyond a narrow sales-CRM niche into operational workflows with strong governance and case-management needs. The benchmark customer-success page further frames the customer value proposition around 70% faster implementation, 37% lower TCO, and 90%+ adoption inside complex organizations. What remains missing is exact 2026 customer count precision: retained official sources validate thousands of clients, but they do not directly restate the commonly cited 7,000+ figure, so current scale should be treated as directionally strong but not numerically pinned down in public materials. Public breadth is therefore easier to verify than exact scale. Buyer reach is broad across both commercial and public workflows.",
