    {
      "id": "satisfaction-retention-and-risk",
      "title": "Satisfaction signals, retention visibility, and concentration risk",
      "body": "Public satisfaction evidence is meaningfully mixed rather than uniformly positive. Archived enterprise review surfaces are strong: G2 shows 4.7/5 from 311 reviews and Capterra shows 4.7 overall from 121 reviews, with repeated themes around flexibility, unified workflows, and rapid customization. Trustpilot is the major counterweight. Its archived page shows only 2.4/5 from 12 reviews and includes unusually sharp complaints about slowness, support quality, and overstatement of the no-code promise. This split likely reflects different user populations: enterprise operators evaluating the platform itself versus downstream portal users or frustrated implementation contexts. For retention and concentration, public visibility is much weaker. Retained sources do not disclose NRR, GRR, renewal rates, contract length, or top-customer concentration. Even the very strong customer-proof pages emphasize rollout speed, TCO, adoption, and workflow outcomes rather than long-horizon durability. That creates a meaningful diligence gap. In addition, the 2024 capital-raise release says 50% of business comes through channel partners, which helps expansion but also means customer acquisition and delivery quality remain partly dependent on partner performance. The overall customer picture is favorable on adoption and proof of use, but incomplete on renewal quality and concentration risk. That missing durability layer is the central unresolved issue in customer diligence.",
