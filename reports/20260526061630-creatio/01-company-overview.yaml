  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Creatio enters the 2026 diligence window as a Boston-headquartered private software vendor built around no-code workflow automation and CRM, with founder-CEO Katherine Kostereva still publicly at the center of the story. The best-retained evidence shows a 2019 rebrand from bpm'online, years of bootstrapping before outside capital, a 2021 $68M round, and a 2024 $200M round that took the company to a publicly promoted $1.2B valuation. Public sources also show real scale in partners, geography, and employee count, while leaving exact customer count, founding year, and full governance mechanics only partially disclosed."
  },
  "sections": [
    {
      "id": "identity-roots-and-product-scope",
      "title": "Identity, roots, and product scope",
      "body": "Creatio's current public identity is coherent even if some legacy metadata still trails the old brand. The official website consistently presents the company as an agentic CRM and workflow platform with no-code and AI at its core, while the studio and no-code pages describe a visual development environment for applications, AI agents, workflows, integrations, analytics, and UI configuration. The product set is broader than a classic CRM SKU: Creatio markets Studio for building applications and automations, CRM capabilities across marketing, sales, and service, marketplace add-ons, and industry workflows across roughly twenty verticals. The strongest historical anchor for the corporate identity shift is the October 2019 PR Newswire announcement that bpm'online changed its corporate and product names to Creatio and moved its website to creatio.com. That rebrand matters because later chapters should treat Creatio as a workflow-and-CRM platform company whose current AI-native messaging extends an older no-code/BPM narrative rather than replacing it with a wholly new product thesis.",
