      "id": "leadership-footprint-and-governance-signal",
      "title": "Leadership, footprint, and governance signal",
      "body": "Katherine Kostereva remains the clearest person-level fact in the retained record: the official site names her CEO and founder, independent databases repeat the same role, and Forbes coverage adds the founder background that she is from Ukraine. Public geography signals are also directionally strong even if they are not perfectly standardized across pages. Crunchbase and Craft both place headquarters in the Greater Boston/Boston area, while Craft also lists a Ukraine location and the 2021 Forbes profile describes the company as headquartered in Boston. Governance disclosure is more limited than identity disclosure. The homepage and about page visibly show a board that includes investor-linked figures such as Sean Cantwell and Rajeev Dham plus JD Sherman and Roger Hurwitz, and the official about page also names a broader executive bench including COO Sergey Sorokin and Chief Product Officer Ivan Malafieiev. What is still missing in public evidence is the fuller committee, voting-rights, and ownership-control picture that later-stage investors would typically want before relying on a governance narrative.",
