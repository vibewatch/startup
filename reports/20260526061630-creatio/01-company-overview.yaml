    {
      "id": "capital-history-scale-and-milestones",
      "title": "Capital history, scale, and visible operating scale",
      "body": "The funding record is strongest from 2021 onward. Volition Capital's February 2021 announcement documents a $68M raise and frames Creatio as a partner-led low-code process management and CRM vendor, while later independent coverage makes clear that the company had been bootstrapped for years before that outside capital. The 2024 financing is even better supported: TechCrunch reports a $200M round led by Sapphire Ventures with StepStone, Volition, and Horizon participating, and Forbes describes the same event as taking the company to a $1.2B valuation after six years of bootstrapping. Public operating-scale signals are meaningful but not perfectly uniform. Official 2024 company news says Creatio had 700 employees in seven offices and local representatives in 25 countries, the homepage presents 550 partners in 100 countries with local presence in 25 countries and ten offices, and customer-facing pages say thousands of clients launch millions of workflows daily. A third-party sales-data vendor tracks 6,671 customer companies, which is directionally useful but weaker than official disclosures and should not be treated as the canonical customer count.",
