  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory/legal register
    missingEvidence: Counsel-reviewed jurisdiction-by-jurisdiction legal memo covering import, procurement, data, export, product safety, IP, and standards obligations.
    whyItMatters: The public register is enough to rank risks but not enough to clear investment legal diligence.
    diligencePath: Commission U.S., EU, Middle East, and China counsel memos and map each product SKU and software service to obligations.
    relatedQuestionRefs:
    - QR001
    - QR002
    - QR003
    - QR004
    - QR005
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: unit economics
    missingEvidence: Revenue, ASP, gross margin, bill of materials, warranty reserves, burn, runway, and cohort service-cost data.
    whyItMatters: Capital-intensive hardware can appear attractive until warranty and service costs are visible.
    diligencePath: Review management accounts, board materials, manufacturing yield dashboards, and product cohort P&Ls.
    relatedQuestionRefs:
    - QR019
    - QR020
    - QR021
    - QR027
  - type: private-evidence-only
    severity: blocking
    topic: deployment proof
    missingEvidence: Signed customer contracts, acceptance certificates, deployed units, fleet hours, uptime, and renewal or expansion evidence.
    whyItMatters: The principal commercial risk is mistaking demos and pilots for durable paid deployments.
    diligencePath: Call reference customers, inspect contracts, and reconcile shipped units to invoicing and service logs.
    relatedQuestionRefs:
    - QR012
    - QR017
    - QR026
  - type: missing-source
    severity: material
    topic: safety and reliability
    missingEvidence: Independent safety assessment, recall search, incident log, insurance terms, and third-party product validation for human environments.
    whyItMatters: Humanoid failures can create injury, recall, and reputational liabilities beyond ordinary device defects.
    diligencePath: Obtain test reports, insurance underwriting files, RMA logs, and customer incident reports.
    relatedQuestionRefs:
    - QR006
    - QR011
    - QR013
    - QR025
  - type: private-evidence-only
    severity: material
    topic: cybersecurity and data flows
    missingEvidence: Software bill of materials, data-flow diagrams, penetration tests, vulnerability policy, export-control classification, and remote-update governance.
    whyItMatters: Robots collect sensor data and can operate in sensitive facilities, making security review central to overseas sales.
    diligencePath: Run technical diligence on firmware, cloud, teleoperation, ROS/SDK components, encryption, logging, and update controls.
    relatedQuestionRefs:
    - QR007
    - QR014
    - QR023
    - QR030
  - type: private-evidence-only
    severity: material
    topic: people and execution bench
    missingEvidence: Detailed org chart, second-line engineering/manufacturing leaders, retention data, hiring plan, and succession coverage for founder-critical domains.
    whyItMatters: Founder-linked technical differentiation does not automatically translate into repeatable manufacturing and enterprise execution.
    diligencePath: Interview functional leaders and review operating cadence, hiring pipeline, and equity retention by critical team.
    relatedQuestionRefs:
    - QR028
