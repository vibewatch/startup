- id: regulatory-legal
  title: Regulatory, legal, privacy, and safety risk
  body: 'The canonical adverse evidence sits here: the GUARD Act, the American Security Robotics Act coverage, and broader U.S.-China compliance analysis directly affect how an acquirer or investor should underwrite LimX’s non-China upside. The GUARD Act matters because it would use a national-security review pathway and the FCC Covered List concept; this is broader than routine procurement friction and could impair imports if Chinese robotics platforms are categorized as unacceptable-risk systems. The American Security Robotics Act coverage is narrower but still valuable because it shows federal-procurement risk is now robot-specific, not merely a telecom or drone analogy. In China, HEIS 2026 is a mixed risk: standards, safety, and ethics rules can professionalize the sector, but they also create documentation, conformity, and lifecycle obligations. Privacy and data-security risk is amplified by teleoperation, cameras, ROS/SDK tooling, and COSA’s software autonomy layer. No public litigation
    or recall record found in retained sources should be treated as an evidence gap, not as exoneration.'
  claimRefs:
  - CR001
  - CR002
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR024
  - CR025
