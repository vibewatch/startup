- id: mitigations-monitoring-kill-criteria
  title: Mitigations, monitoring indicators, kill criteria, and diligence asks
  body: 'The correct risk response is not to reject LimX solely because the sector is difficult; it is to make milestones explicit. Legal mitigation requires a jurisdiction map, product-origin analysis, FCC/GUARD scenario plan, data-flow architecture, export-control review, and procurement eligibility counsel before counting U.S. or government-adjacent revenue. Operational mitigation requires a fleet dossier: deployed units, fleet hours, top failure modes, incident severities, warranty reserves, software update controls, penetration testing, and customer acceptance certificates. Commercial mitigation requires signed customer contracts with use cases, pricing, uptime obligations, and renewal terms. Financial mitigation requires a bridge from bill of materials and manufacturing yield to gross margin and cash burn. Thesis-break triggers include enactment of import bans covering Chinese robots, inability to name reference customers, failure to produce reliability logs, sustained Unitree/Agibot
    share dominance without a differentiated LimX niche, or new funding terms that imply valuation support is outrunning deployment evidence.'
