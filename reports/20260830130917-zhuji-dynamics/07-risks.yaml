- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - U.S. import/procurement ban
    - Legislative progress and FCC listing decisions
    - Chinese humanoid robots added to Covered List or federal procurement ban enacted
    - Remove U.S. public-sector/import upside from base case
  - - Deployment proof gap
    - Named paying customers and acceptance certificates
    - No audited reference deployments by next financing diligence window
    - Hold or reprice until commercial proof exists
  - - Reliability and safety gap
    - Fleet hours, incident logs, recalls, warranty reserves
    - Management cannot provide cohort reliability and safety data
    - Treat hardware scaling risk as thesis-breaking
  - - Margin compression
    - BOM, ASP, warranty, service cost, competitor price cuts
    - Negative gross margin persists after pilot-to-production transition
    - Require lower valuation or pass
  - - Competitor dominance
    - Unitree/Agibot shipment share and customer wins
    - Dominant peers retain near-duopoly share while LimX lacks a niche
    - Underwrite as technology option, not category leader
  - - Data-security/export risk
    - SBOM, data map, remote-update controls, export counsel
    - No auditable controls for overseas deployments
    - Block international expansion assumptions
  notes: Kill criteria are investment-process triggers, not predictions; thresholds should be refreshed with private data.
