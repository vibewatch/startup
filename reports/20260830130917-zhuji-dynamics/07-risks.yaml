- id: operational-quality-security
  title: Operational, quality, security, and deployment risk
  body: 'Hardware scaling risk is high because humanoid robots combine locomotion, actuators, batteries, sensors, software updates, human interaction, and after-sales service in one physical product. TRON 2 disclosures include safety-boundary protection and redundant power, which are useful mitigants, but they do not substitute for field failure statistics, recall history, warranty reserves, or production-yield data. LimX’s low-cost modular positioning may be strategically attractive for developer adoption, yet price points in this category invite margin pressure and expose every service call or component defect. Security risk is also operational: ROS tooling, SDKs, teleoperation, cameras, and cloud-connected agentic software create attack surfaces and data-handling obligations for overseas customers. The diligence posture should therefore be evidence-first: request fleet hours, MTBF, incident severity logs, return rates, cybersecurity test reports, software bill of materials, export-control
    review, and customer acceptance criteria before underwriting scaled commercial deployments.'
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR029
  - CR040
  - CR042
  - CR044
  tableRefs:
  - TR003
  figureRefs: []
- id: partners-dependencies-people
  title: Partner, dependency, and key-person risk
  body: 'LimX’s dependencies are broader than a normal software startup’s. It relies on regulators for market access, component supply chains for actuators and compute, strategic investors for capital and channel help, and customers willing to run robots in messy physical environments. Public financing sources identify a mix of automotive, commerce, prior shareholders, and Middle East-linked capital, which can help with distribution but also introduces governance and geopolitical-optics diligence. The customer side remains under-evidenced: expansion articles discuss Middle East and U.S. ambition, yet they do not provide a durable list of signed customers, commercial terms, acceptance milestones, or renewal economics. People risk is also material. Public profiles concentrate the technical narrative around Dr. Wei Zhang’s locomotion and control expertise; the operating bench has some positive signals, but manufacturing leadership depth is not transparent. A real mitigation plan must demonstrate
    institutionalized engineering, quality, sales, compliance, and after-sales capacity rather than founder-led heroics.'
  claimRefs:
  - CR028
  - CR031
  - CR032
  - CR033
  - CR034
  - CR035
  - CR040
  - CR041
  tableRefs:
  - TR004
