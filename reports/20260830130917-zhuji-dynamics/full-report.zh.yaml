  summary: >-
    Zhuji Dynamics 是一家总部位于深圳的具身 AI 与人形机器人公司，2026 年 7 月许多来源仍将其标注为 Zhuji Dynamics（LimX
    Dynamics）。公司开发全尺寸人形机器人、模块化多形态机器人，以及面向制造、工业、 服务和开发者场景的 COSA / 脑-小脑软件栈。到 2026 年 7 月，公司已完成近 $200 million 的 Pre-IPO 轮，
