      - number: '3.3'
        title: 能力、定价、GTM、分销与信任姿态比较
        blocks:
          - type: paragraph
            body: >-
              在模块化、开发者可达性和软件雄心重要的地方，LimX 相对最强。TRON 2 的低价科研平台定位和三种配置让它适合实验室和开发者； Oli 与 COSA 则给 LimX 提供了全尺寸人形机器人和软件叙事。挑战在于
              Unitree 已经定义了低成本参照点：G1 被广泛锚定在约 $16,000，Curionic 报道的 R1 Air 入门价更低，因此 LimX 不能只靠价格。AgiBot 和 UBTECH
              以制造和企业部署信号竞争， Figure 与 Apptronik 则提供与美国一致的企业叙事，能赢下对信任敏感的客户。功能矩阵因此明确标注不受支持的单元格；
              公开证据足以判断产品范围、标价锚点和战略方向，却不足以判断实际企业定价、正常运行时间、保修储备、服务利润率或经审计装机质量。 这些缺口很实质，因为硬件买方承销的是总拥有成本，不是 demo 表现。
