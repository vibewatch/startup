            body: >-
              财务结论是继续研究。LimX 的公开证据足以承销变现假设：低标价、硬件组合、可能的 COSA 软件层、大额战略资本和巨大的中国市场背景。
              但公开证据不足以承销收入质量、毛利率、烧钱速度、现金跑道或资本效率。最大风险包括低 ASP 下硬件毛利为负或偏薄、扩产期间营运资本吃掉现金、
              渠道经济不确定、海外市场监管摩擦，以及估值依赖未来规模而非已披露当前收入。下一步尽调需要管理层数据室证明：发票、ASP 瀑布、 毛利率桥、库存周转、保修计提、客户
