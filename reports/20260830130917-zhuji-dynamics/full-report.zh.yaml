      - number: '7.3'
        title: 运营、质量、安全与部署风险
        blocks:
          - type: paragraph
            body: >-
              硬件规模化风险很高，因为人形机器人把运动、执行器、电池、传感器、软件更新、人机交互和售后服务装进同一个实体产品。TRON 2
              披露了安全边界保护和冗余电源，这些能缓释风险，但不能替代现场故障统计、召回历史、保修准备金或生产良率数据。LimX
              的低成本模块化定位也许能吸引开发者，但这一品类的价位会压缩利润率，并暴露每一次服务呼叫或部件缺陷。安全风险同样落在运营上：ROS
              工具、SDK、远程操控、摄像头和云连接的智能体软件，都会给海外客户带来攻击面和数据处理义务。因此，尽调应先看证据：在承销规模化商业部署前，要求提供机队小时数、MTBF、事故严重度日志、退货率、网络安全测试报告、软件物料清单、出口管制审查和客户验收标准。
