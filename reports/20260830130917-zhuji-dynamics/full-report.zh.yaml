        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本充足性是本章最大缺口。2026 年 2 月的 $200 million Series B 是有意义的现金跑道和扩产输入， 本报告采用的规范累计融资约 $250 million，同时存在一份资料报 $296
              million 的冲突口径。但保留的公开来源都没有披露剩余现金、 月度烧钱、已承诺 capex、债务、租赁、项目融资义务、营运资本工具、客户定金或供应商融资。这意味着现金跑道只能用私有数据做情景建模。
              一个保守的承销触发条件很简单：在 Series B 现金跑道倒逼下一轮融资前，LimX 必须把可见价格、demo 和战略支持转化为可重复付费部署。 申报和登记检查有助于判断披露纪律，但 JD.com
              的申报门户和登记式页面都不能关闭 LimX 的股权经济或现金余额问题。
