            body: >-
              反向竞品证据很直接：LimX 大幅落后于两家出货领导者，公开来源也显示竞品正在同时进攻价格和规模。Unitree 与 AgiBot 共同定义了出货基准； Unitree
              的低价产品阶梯会拉低买方价格预期，AgiBot 的量产信号会让较小对手在大规模部署中显得不够稳妥。监管证据两面都有。 中国 HEIS 2026 能让国内市场更专业，但 GUARD Act
              等美国立法提案也可能把西方及盟友买方推向 Figure、Apptronik、Tesla、1X 或 NEURA。 因此，LimX 的护城河只有在市场围绕更便宜机体加第三方 AI 商品化之前，把 COSA
