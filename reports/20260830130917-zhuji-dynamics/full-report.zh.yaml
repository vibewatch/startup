  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序概览
        blocks:
          - type: paragraph
            body: >-
              LimX 的风险堆栈由几类风险主导，它们可能在产品-市场匹配完全证明前就关上大门：海外法律暴露、国内标准合规、以及残酷的中国竞争。
              最高严重度的问题不是某一起公司特定执法行动，而是一条政策向量。美国立法者正在明确讨论对中国机器人的进口和采购限制， 中国同时加速 HEIS 标准和 MIIT/SASAC
              真实场景部署项目。由此形成一条分裂世界路径：国内政策可能创造需求并澄清标准， 但海外买方可能把中国人形机器人视为联网国家安全硬件。第二层是执行风险：Unitree 和 Agibot 看起来扩张更快时，LimX
              必须证明可靠部署、 制造良率、安全日志和客户 ROI。第三层是财务：公开来源显示融资势头，却没有收入、利润率、烧钱速度或保修经济。 投资含义是保持观察，除非管理层能把 demo
              和融资转化为经审计部署，并配上一套可防守的合规架构。
