            body: >-
              公开牵引力活动密集，但财务指标稀薄。官方新闻中心记录了产品发布和更新；第三方报道描述了 18 台 Oli 的自主部署 demo，
              并称公司有进入中东和美国的扩张雄心。这些点有助于判断产品成熟度和市场叙事，但不等于付费设备、确认收入、利用率、留存或毛利率。 即使多机器人 demo
              也不是客户队列，除非它包含交易对手、价格、验收标准、服务义务和付款时间。同样，据报道数千台交付计划需要已签订单证据，
              才能变成积压订单。尽调文件应保留这一区分：公开牵引力支持需求可信度，私有指标则必须决定收入质量、可重复性和现金转化。
