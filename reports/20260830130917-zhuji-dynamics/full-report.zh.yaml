            body: >-
              可比集应该刻意混合。Figure AI 是上沿标记，不是常态：其 US$39 billion 投后轮次反映了异常可见的投资人和部署叙事。Apptronik、NEURA 和 1X
              是西方私营参照，可用于判断资本强度和高溢价 AI 倍数，但它们的商业化路径和地缘政治环境不同。Unitree 和 Agibot
              是更刺痛的中国校验，因为它们展示了低成本销量领导者夺取份额并压低价格的风险。UBTech
              是关键公开文件锚点，因为它展示了公司上市后，人形机器人收入结构、毛利率和亏损可能长什么样。这个组合支持合理估值立场，而不是精确 DCF。
