  - id: FR003
    title: 依赖图：监管方、资本、部件、软件、客户
    type: dag
    layout: wide
    summary: LimX 依赖横跨监管许可、实体供应链、软件保障、投资人和标杆部署。
    data:
      nodes:
        - id: limx
          label: LimX 运营计划
        - id: regulators
          label: 美国 / 中国监管方
        - id: standards
          label: HEIS / 安全标准
        - id: suppliers
          label: 执行器 / 计算 / 电池供应商
        - id: software
          label: ROS / SDK / COSA 技术栈
        - id: capital
          label: 战略投资人与财务投资人
        - id: customers
          label: 工业 / 科研客户
        - id: service
          label: 售后服务网络
        - id: team
          label: 创始人与执行梯队
      edges:
        - from: regulators
          to: limx
        - from: standards
          to: limx
        - from: suppliers
          to: limx
        - from: software
          to: limx
        - from: capital
          to: limx
        - from: team
          to: limx
        - from: limx
          to: customers
        - from: limx
          to: service
        - from: service
          to: customers
        - from: customers
          to: capital
    approximationNotes: 依赖关系图基于公开证据和尽调缺口，并非完整供应商清单。
    claimRefs:
      - CR029
      - CR031
      - CR032
      - CR033
      - CR034
      - CR035
      - CR040
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 证据从赛道上行空间和产品可信度出发，经风险与价格纪律筛选，最终落到「观察」建议。
    data:
      nodes:
        - id: market
          label: 2026 年中国市场预测空间大
        - id: product
          label: COSA + 模块化机器人支撑技术期权价值
        - id: proof
          label: 客户经济性与利润率仍未披露
        - id: risk
          label: 竞争与地缘政治风险高
        - id: price
          label: US$1,000M 入场锚点合理，但不便宜
        - id: call
          label: 建议：观察
      edges:
        - from: market
          to: call
        - from: product
          to: call
        - from: proof
          to: price
        - from: risk
          to: price
        - from: price
          to: call
    approximationNotes: 定性流程；节点顺序体现投资判断逻辑，不是数学权重。
    claimRefs:
      - CV001
      - CV004
      - CV011
      - CV021
      - CV034
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 入场测算最受商业化验证和估值倍数压缩牵动，融资公告规模反而不是关键。
    data:
      items:
        - label: 收入规模验证
          value: 5
        - label: 毛利率桥接
          value: 5
        - label: 终值倍数
          value: 4
        - label: 故障率 / 保修率
          value: 4
        - label: 监管准入
          value: 4
        - label: 战略投资人牵引力
          value: 3
    approximationNotes: 1-5 分是方向性敏感度权重，由本章证据推导。
    claimRefs:
      - CV028
      - CV029
      - CV037
      - CV041
      - CV043
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 方向性情景区间说明：缺少非公开证据验证时，当前价格合理，但还谈不上有吸引力。
    data:
      items:
        - label: 悲观情景估值结果（US$M）
          low: 300
          high: 700
        - label: 基准情景估值结果（US$M）
          low: 900
          high: 1400
        - label: 乐观情景估值结果（US$M）
          low: 2500
          high: 4000
        - label: 稀释前目标总回报（x）
          low: 3
          high: 5
    approximationNotes: US$M 区间仅作方向性估算；目标回报是倍数，不是美元金额。
    claimRefs:
      - CV005
      - CV038
      - CV039
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: IC 评分卡在市场、产品上行空间，与公开运营证据薄弱、高风险之间做权衡。
    data:
      items:
        - label: 市场拉力
          value: 4
        - label: 产品验证
          value: 3
        - label: 客户验证
          value: 2
        - label: 护城河证据
          value: 3
        - label: 经济性可见度
          value: 1
        - label: 风险负担
          value: 5
        - label: 估值合理性
          value: 3
        - label: 证据质量
          value: 3
    approximationNotes: 分数采用 1-5 的尽调量表；风险负担分越高，表示风险越大，不代表吸引力更高。
    claimRefs:
      - CV002
      - CV003
      - CV011
      - CV024
      - CV030
      - CV034
      - CV045
