              融资背景很强，但应把它理解为谈判约束，而不是估值证明。US$200 million Series B 轮支撑现金跑道和财团质量；而约 US$250 million
              的累计融资代理值，让清算优先权、备考期权池和后续跟投准备金成为核心尽调项。乐观情景中，LimX 把 COSA
              和模块化硬件转化为可重复部署，把下一轮标记抬到当前入场之上。基准情景中，当前轮次大致停在公允价值附近，等待里程碑成熟。悲观情景中，在 LimX
