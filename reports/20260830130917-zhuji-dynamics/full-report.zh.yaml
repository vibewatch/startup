        title: 版图：直接同行、既有厂商、相邻玩家、替代品、现状方案、内部自建与新进入者
        blocks:
          - type: paragraph
            body: >-
              2026 年，LimX 面对的是拥挤市场，买方的备选集远不止“人形机器人对人形机器人”。中国直接同行由 Unitree 和 AgiBot 领跑， UBTECH 是最显眼的上市既有厂商，LimX
              则是规模更小、以创新驱动的挑战者。DEEP Robotics 等相邻足式机器人供应商会争夺巡检、 科研和移动预算，即便它们卖的不是同一种人形形态。Figure、Apptronik、Tesla Optimus、1X
              和 NEURA 等西方人形机器人供应商， 为看重非中国供应、企业信任或美国 AI 与制造生态通道的买方提供了另一条路径。替代集还包括固定自动化、人力，以及工程能力足够的制造商内部自建机器人。
              因此，这个版图不能只按行走 demo 打分：产能规模、部署信任、价格、软件栈和渠道触达，决定 LimX 会成为首选供应商，还是众多试点之一。
