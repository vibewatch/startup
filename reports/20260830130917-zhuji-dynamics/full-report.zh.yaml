  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格判断
        blocks:
          - type: paragraph
            body: >-
              LimX 适合给观察建议，而不是立即买入，因为 Series B 轮带来可信现金跑道和战略背书，但公开证据仍把核心承销变量留在私有范围内。IC 案例对价格敏感：US$1,000 million
              的入场锚点，相比全球人形机器人异常值并不明显过高；但在 LimX
              尚未公开披露收入运行率、利润率、订单积压或付费部署留存时，也谈不上便宜。我会持续跟踪，并且只有在尽调确认客户经济性、股权结构表条款和监管退出路径后，才准备新股或老股交易报价。本章工作判断是中等置信度、高风险、估值合理；进一步稀释前，要求至少三倍总回报路径。
