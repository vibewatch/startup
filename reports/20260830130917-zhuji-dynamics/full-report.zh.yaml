      - number: '1.2'
        title: 领导层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              公开领导层记录支撑了高质量的技术创始故事，但治理图景仍然残缺。Wei Zhang 是核心人物：各来源一致称其为创始人兼 CEO， 拥有 Purdue ECE PhD、UC Berkeley 博士后背景，曾任
              Ohio State 终身教职和 SUSTech 教授；其研究方向与 LimX 主打的全地形运动能力直接匹配。Zhang Li 于 2023 年 11 月从 WeRide
              加入，带来运营和自主系统经验，对机器人走出实验室 demo 有意义。Robot Testers 还将曾任 University of Hong Kong 副教授的 Pan Jia
              标注为首席科学家。治理缺口与人才信号同样重要： 公开来源没有披露董事席位、观察员权利、股权结构控制权、创始人持股或继任机制。技术叙事与 Wei Zhang 绑定很深；在管理层纵深和治理权利经私下证实前，
              投资人应把 LimX 视为创始人-市场匹配很强、同时关键人物依赖显著的公司。
