      - number: '3.4'
        title: 切换成本、锁定效应、多平台并用、供应获取与伙伴权力
        blocks:
          - type: paragraph
            body: >-
              切换成本真实存在，但并不均匀。试点阶段，买方可以在 Unitree、LimX、UBTECH、Apptronik 和其他平台之间多平台并用，
              因为采购可以在承诺前比较形态、开发者工具、远程操作、载荷和价格。规模化部署后，多平台并用会更难：安全案例、备件库存、机队管理工具、 操作员培训、SDK
              集成、维护合同和特定场地工作流都会形成平台锁定。因此，受益的是拥有产能、渠道伙伴、服务网络和零部件供应的厂商， 而不只是单个 demo 最好的厂商。Unitree 的产能扩张信号、AgiBot 的量产表述和
              UBTECH 的广泛商业触面由此构成竞争护城河。 LimX 的公开 GitHub 资产和 TRON 2 科研平台有助于开发者采用，但在 LimX 证明可重复交付、服务覆盖和大得多的装机基础上的零部件经济之前，
              分销权力和供应获取仍是尽调事项。
