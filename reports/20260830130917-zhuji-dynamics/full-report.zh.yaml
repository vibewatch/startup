          - type: paragraph
            body: >-
              本章的核心反向证据在这里：GUARD Act、American Security Robotics Act 的覆盖范围，以及更广泛的美中合规分析，都会直接影响收购方或投资人如何给 LimX
              的非中国增长空间做承销。GUARD Act 重要，是因为它会借助国家安全审查路径和 FCC Covered List
              概念；这不只是常规采购摩擦，若中国机器人平台被归为不可接受风险系统，进口可能受损。American Security Robotics Act
              的覆盖面更窄，但仍有价值，因为它说明联邦采购风险已经具体落到机器人，而不只是电信或无人机类比。在中国，HEIS 2026
              是混合风险：标准、安全和伦理规则能让行业更专业，也会带来文档、一致性和全生命周期义务。远程操控、摄像头、ROS/SDK 工具和 COSA
              的软件自主层，会放大隐私和数据安全风险。留存来源未发现公开诉讼或召回记录，应视为证据缺口，而不是洗清风险。
