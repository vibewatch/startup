      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              go-to-market 证据指向直接企业销售与合作驱动，而不是自助式机器人电商。LimX 暴露了订单咨询、store/cooperate 和企业支持路径，
              融资报道则显示战略支持方可能变成工业渠道或供应链伙伴。这有帮助，但还不足以计算 CAC、回本周期或销售产能。最好的公开代理指标是定性的： 人形机器人仍然试点多、集成重、靠验证推进；在确认付费部署前，demo
              和多年市场进入计划会先出现。战略投资人可能降低接触成本， 但公开记录没有披露转介绍转化、经销商利润、最低采购承诺、伙伴出资部署或客户集中度。因此，销售效率分析应停留在代理指标层面， 并要求按阶段拆分的
              pipeline、已签订单金额、实施成本、销售人数和伙伴经济。
