        - 定金、积压订单、已签试点或转化
      - - 财务
        - US$200M Series B 为产品化提供资金
        - 优先权堆叠和未来融资需求会稀释回报
        - 股权表和清算优先权审查
      - - 竞争
        - 挑战者位置给产品胜出留下上行空间
        - 从销量信号看，Unitree 和 Agibot 更靠前
        - 相对中国龙头的份额提升证据
      - - 风险
        - 国内标准可能为市场增长背书
        - 美国限制会收窄出口和退出路径
        - 覆盖清单暴露的法律备忘录
      - - 估值
        - US$1B 入场价远低于 Figure 的离群估值
        - 营收不透明让同一价格难以自证
        - 经审计营收和毛利证明
      - - 退出
        - 里程碑成熟后，战略出售 / IPO 仍有可选性
        - 现有数据无法支撑公开退出案例
        - 经审计 KPI 和退出买家图谱
    notes: 各行把有证据支撑的上行空间与会改变建议的尽调条件分开。
    claimRefs:
      - CV011
      - CV012
      - CV021
      - CV024
      - CV026
      - CV028
      - CV029
      - CV031
      - CV034
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 牛市
        - 付费部署放量；COSA 改善任务经济性；战略投资人渠道转化
        - 下一阶段估值 US$2.5B–US$4.0B，在重度稀释前可支撑 >3x
        - 具名客户、复购订单、正向毛利桥
        - 部署失败或没有复购订单
      - - 基准
        - 技术可信度仍在，但商业化证明逐步释放
        - 围绕 Series B 入场价守住 US$0.9B–US$1.4B，继续跟踪更合适
        - 更多试点和标准推进，但没有经审计毛利证明
        - 后续轮估值持平或融资条款偏重优先权
      - - 熊市
        - 人形机器人估值倍数压缩；中国龙头主导；出口限制收紧
        - US$0.3B–US$0.7B 结果会让新一级市场入场面临实质亏损风险
        - 不利法律、客户数据偏弱或没有毛利证明
        - 降价轮、禁令扩围或客户流失证据
    notes: 情景区间是方向性的投资测算区间，不是 DCF；它们依赖私有营收和股权表尽调。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV026
      - CV037
      - CV038
      - CV039
      - CV040
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标 / 状态
      - 估值或倍数参考
      - 对 LimX 的启示
      - 局限
    rows:
      - - Figure AI
        - 拥有大型 AI 投资方的私有人形机器人离群样本
        - ~US$39B 投后估值；>US$1B Series C；~US$1.9B 融资额参考
        - 为高溢价 AI 人形机器人叙事划定全球天花板
        - 部署证明和投资人画像强于 LimX 的公开证据
      - - Apptronik
        - 西方私有人形机器人初创公司
        - ~US$5.5B 分析师数据集参考
        - 显示美国人形机器人平台故事的溢价
        - 地域、客户和监管风险不同
      - - NEURA Robotics
        - 欧洲人形 / 认知机器人公司
        - ~US$7B 分析师数据集参考
        - 显示中国以外软硬件结合的溢价
        - 不是中国成本-销量可比样本
      - - 1X Technologies
        - 消费和仓储人形机器人参考
        - ~US$1.1B+ 融资数据集参考
        - 更接近私有人形机器人的绝对估值底部
        - 消费策略和披露画像不同
      - - Unitree
        - 中国低成本机器人销量龙头，IPO 动能明确
        - 低个位数十亿美元估值区间
        - 中国份额和定价压力的最佳基准
        - 私有估算有差异，产品组合也不同
      - - AgiBot
        - 连接 BYD 生态的中国销量挑战者
        - 市场评论中的低于 US$1B 估值区间
        - 显示销量玩家压低市场定价的风险
        - 估值和出货披露仍碎片化
      - - UBTech
        - 港股上市机器人公司
        - 基于申报文件的公开财务和亏损画像
        - 用经审计披露锚定营收、毛利、亏损预期
        - 上市时间更长，产品组合更宽
      - - Zhuji Dynamics (LimX Dynamics)
        - Series B 增长期挑战者
        - 情景测算使用的 US$1,000M 入场锚
        - 标的投资入场价和战略财团
        - 营收、毛利、积压订单和优先权未披露
    notes: 该清单是部分可比估值集合，基于截至 runDate 获取的分析师数据集、公开申报文件和融资报道。
    enumerationScope:
      coverage: partial
      basis: >-
        Major public and private humanoid robotics valuation references fetched for the July 2026 LimX valuation
        chapter.
    claimRefs:
      - CV008
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV036
  - id: TV005
    title: 论点破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 降价轮
        - 下一轮融资低于 Series B 入场锚
        - 证实公开可比公司高估了当前证明
        - 除非条款修复上行空间，否则从跟踪转为回避
      - - 优先权压力
        - 清算权堆叠实质侵蚀普通股上行
        - 新资金回报目标无法达成
        - 要求更低入场价，或放弃
      - - 缺少付费部署证明
        - 没有已签订单、定金或复购客户转化
        - 产品叙事仍由演示驱动
        - 只保留跟踪，不报一级市场价格
      - - 毛利缺口
        - 低机器人价格缺少 BOM、良率、服务成本支撑
        - 规模扩大不是产生经营杠杆，而是加重亏损
        - 要求毛利约束条款或延后
      - - 监管排除
        - 中国机器人限制阻断目标出口渠道
        - 退出买家池和营收 TAM 收缩
        - 施加地缘政治折价或回避
      - - 竞争对手份额挤压
        - Unitree / AgiBot 在中国出货证据上进一步领先
        - LimX 挑战者上行空间收窄
        - 下调情景概率并重审价格
    notes: 触发因素是可监控的尽调关口；确切阈值应结合公司私有数据校准。
    claimRefs:
      - CV012
      - CV023
      - CV026
      - CV033
      - CV037
      - CV041
      - CV042
      - CV043
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 客户证明
        - 已签订单、定金、积压订单、演示转化
        - 验证需求和收入质量
        - 审阅合同、发票并访谈客户
      - - 单位经济性
        - BOM、良率、质保、服务成本、毛利桥
        - 公开低价可能摧毁毛利
        - 在 NDA 下做工厂和财务尽调
      - - 股权表
        - 当前持股结构、清算优先权、期权池、附函
        - 决定入场能否赚到风投回报
        - 由律师牵头审阅融资文件
      - - 部署可靠性
        - 在线率、干预率、安全事故、退货
        - 机器人必须在受控演示之外也能工作
        - 现场走访和客户技术尽调
      - - 监管 / 出口
        - 覆盖清单暴露、数据安全姿态、标准合规
        - 决定非中国收入和退出买家池
        - 法律备忘录和逐渠道审查
      - - 可比校准
        - 营收倍数和上市公司亏损基准
        - 约束合理入场价和下一轮预期
        - 对照 UBTech 申报文件和私有可比公司
      - - 退出图谱
        - 潜在战略买家、IPO 准备度、董事会时间表
        - 决定持有期是否现实
        - 投行访谈和投资人权利审查
    notes: 尽调问题优先追问会改变建议或估值立场的证据。
    claimRefs:
      - CV034
      - CV035
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
