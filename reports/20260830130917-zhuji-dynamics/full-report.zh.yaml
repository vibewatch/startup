      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方分层比单一 TAM 标题更重要。在汽车和物流场景，经济买方通常是运营或工厂负责人，用户是生产或仓储团队，付款方来自运营、自动化或转型预算。 在科研和教育场景，买方是首席研究员、实验室主任或院系，付款方来自
              R&D、资本设备或资助预算。公用事业和公共基础设施场景中，采购可能集中化， 并受到安全、安保和标准团队强烈影响。因此，采用路径通常从 R&D
              评估或受控试点开始，经安全认证和工作流集成后，才转为由运营部门拥有的机队部署。 家庭和养老用例在战略上可能很大，但证据支持把它们视为更晚出现的需求池，而非 2026 年商业核心。
