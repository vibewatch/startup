      - number: '7.4'
        title: 合作方、依赖与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              LimX
              的依赖面比普通软件创业公司宽得多。市场准入要靠监管方，执行器和算力要靠零部件供应链，资本和渠道支持要靠战略投资人，客户还必须愿意把机器人放进混乱的物理环境里跑。公开融资来源显示，投资人混合了汽车、商业、老股东和中东系资本，这能帮助分销，也带来治理和地缘政治观感尽调。客户侧证据仍然不足：扩张文章讨论了中东和美国雄心，却没有给出稳定的签约客户名单、商业条款、验收里程碑或续约经济性。人才风险也很实质。公开画像把技术叙事集中在
              Wei Zhang 博士的运动和控制专长上；运营班底有一些正面信号，但制造领导层深度并不透明。真正的缓释计划必须证明工程、质量、销售、合规和售后能力已经制度化，而不是靠创始人英雄主义支撑。
            claimRefs:
