      - number: '4.3'
        title: 成本结构、单位经济与营运资本
        blocks:
          - type: paragraph
            body: >-
              人形机器人是硬件优先的成本结构，软件带来上行可能。公开来源没有披露 LimX 的物料清单、良率曲线、保修储备、现场支持人员、 组装 capex
              或供应商预付款条款。相关成本驱动项包括执行器、传感器、电池、算力、材料、QA、集成劳动力和现场支持， 以及控制和自主能力上的持续 R&D。同行证据混杂：TrendForce 引用 Unitree
              招股书数据，显示综合毛利率较强； 反向行业分析则强调零部件成本、价格压力和扩产求生挑战。LimX 的低入门价可能扩大开发者需求，但除非零部件成本、良率和 attach rate
              快速改善，否则也会压缩毛利率。营运资本也很可能很重，因为库存和测试现金支出早于验收和回款。
