  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              与其把 LimX 的产品表面理解为单一人形 SKU，不如看成一层层具身 AI 工作流。Luna 把同步表演、访客互动、编舞和自然语言内容创作打包起来， 面向需要可重复演出或导览互动的场馆。Oli
