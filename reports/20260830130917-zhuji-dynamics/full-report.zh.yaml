            body: >-
              正向投资逻辑把几件事叠在一起：中国人形机器人采用曲线很大、创始团队技术可信、模块化产品公开价位相对低、还通过 COSA
              押注软件。这些要素足以支持继续覆盖，因为这个品类可能跑出风险投资级赢家。反向逻辑同样强：从中国销量信号看，LimX 似乎落后于 Unitree 和
              Agibot；公开材料也还没有证明企业需求或单位经济。人形机器人还处在炒作周期，投资人可能在持久利润率出现前就先奖励演示。正确姿态因此是保留期权价值，但不要在证据出现前就为完整商业故事付全价。
