  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流、定价与确认
        blocks:
          - type: paragraph
            body: >-
              LimX 的公开财务表面异常狭窄：公司展示了产品宽度和标价锚点，却没有披露收入、订单、ARR、毛利、积压订单或收入确认政策。 最清晰的收入流是 Oli、TRON 2
              和其他机器人平台的硬件整机销售，COSA、SDK、部署、培训和维护周围可能还有软件与支持层。 Oli 约 RMB 158,000 / $22k 的标价，以及 TRON 2 约 $6.8k-$7.0k
              的入门价，给出了有用的 ASP 数量级边界， 但不是实际折扣、捆绑服务、回款节奏或利润率证据。因此，收入确认仍是尽调事项：预购、定金、试点机和 demo，与验收后的商业交付在会计处理上可能差别很大。
              承销模型应把产品价格视为变现信号，并在管理层提供队列级发票和确认时间表前，将实际收入组合保留为 null。
