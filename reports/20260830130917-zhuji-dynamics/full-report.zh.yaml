chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Zhuji Dynamics（LimX Dynamics）是一家总部位于深圳的足式机器人和人形机器人公司，本报告在后续章节中将其作为规范主体。 可稳定确认的事实包括：2022 年 1
              月成立、总部在深圳、仍处于私营 Series B 阶段，产品范围以全尺寸人形机器人、 多形态足式机器人和具身 AI 开发者工具为中心。官方页面列出 Luna、Oli、TRON 2、TRON 1、COSA
              和开发者支持； 独立报道则把业务与硬件平台、科研和教育销售，以及未来工业或服务部署联系起来。因此，一句话概括其模式： LimX
              向开发者、实验室、制造商和潜在服务运营商销售并支持人形与多形态机器人平台，同时提供软件和仿真资产。
              但这还不是有公开收入、利润率或客户数支撑的财务模型，而是根据产品发布、定价、交付表述和开放开发者栈推断出的商业化路径。 本概览也有意把身份和封面事实集中在这里，便于后续章节引用更窄的证据，不重复或偏离规范口径。
