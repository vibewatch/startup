      - number: '3.2'
        title: 竞品画像：规模、融资、目标客户、产品范围、定价与方向
        blocks:
          - type: paragraph
            body: >-
              画像证据呈现出双层市场。Unitree 和 AgiBot 是中国出货量领导者；TrendForce 预测二者合计接近 80% 的出货份额， 本报告采用的 40% 对 39% 拆分应视为估算，但与产能、IPO
              和量产信号方向一致。UBTECH 份额较小，但机构、教育和商业触面更广。 LimX 借 TRON 2、Oli、COSA 和公开开发者资产展现出可信的产品和软件差异化；但其估计 1% 到 3%
              的份额意味着，在披露可比的出货、 服务和生产指标前，买方仍应把它看作挑战者。中国之外，Figure、Apptronik、Tesla、1X 和 NEURA 较少靠低单价竞争，
              更多靠企业信任、居家协助叙事、机队工具和战略资本竞争。EngineAI、Galbot、Fourier 和 DEEP Robotics 是区域或相邻挑战者； 即使目标客户不同，也会给定价、零部件获取和招聘带来压力。
