      - number: '2.5'
        title: 相互矛盾的预测与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              只有保留预测不确定性，而不是把它平均掉，这个市场才适合投资。Morgan Stanley 的中国对外销售设备口径扎实且具体， 但仍依赖 ASP、产能和买方转化假设。全球市场估算也分化：Axis 和 Fortune
              Business Insights 支持 2026 年约 US$6.2B 的市场， CNBC 对 Barclays 的报道则称当前市场仅 US$2B-US$3B，2035 年可能升至 US$200B；更早的
              Goldman Sachs 工作给出的长期基准情景更低。 这些差异不是噪音，而是在于发布方到底统计收入、台数、产能、原型、劳动替代潜力还是蓝天服务。缺失的尽调包包括：经审计出货、 实际
              ASP、利用小时、续约或复购订单、分板块毛利率，以及人形机器人收入与更广义足式科研平台收入之间的清晰拆分。
