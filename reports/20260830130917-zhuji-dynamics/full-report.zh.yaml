      - number: '2.2'
        title: 受证据约束的 TAM、SAM 与 SOM 视角
        blocks:
          - type: paragraph
            body: >-
              最干净、受证据约束的 TAM 视角，是 2026 年全球人形机器人年收入约 US$6.2B。对一家以中国为中心的人形和足式机器人供应商来说， 最清晰的 SAM 视角是 Morgan Stanley
              对中国的估算：2026 年约 US$2B、出货约 50,000 台，到 2030 年扩大到约 US$15B 和约 446,000
              台。本报告之所以原样使用这些数字，是因为它们在资料包中反复出现，并直接反映在市场报道里。更窄的 SOM 不应被表述为公司事实， 只能作为敏感性处理。若按 2026 年中国收入池 1-3%
              份额测算，一家挑战者在执行、价格、产品组合和监管过滤之前，隐含年收入机会约为 US$20M-US$60M。多家发布方讲出了更大的长期 TAM
              故事，但它们混合了不同终点和方法，因此近期估值工作应优先使用对外销售设备口径。
