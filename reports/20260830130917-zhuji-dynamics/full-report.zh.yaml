            body: >-
              退出准备度仍然有条件。若 LimX 能展示经审计收入增长、毛利率改善、安全合规，以及对演示的依赖下降，中国或香港 IPO
              路径可能变得可行。零售、汽车、工业自动化和中东资本关系带来战略退出可选性，但这些路径需要合同证据。非中国退出需要法律折价，因为针对中国机器人的拟议限制可能缩小买方池和渠道准入。最终尽调包应优先证明客户在付费、机器人可靠、利润率扛得住低价位，以及融资堆叠在优先权之后仍给普通股留下上行空间。任何一项缺失，都应让建议停留在观察。
