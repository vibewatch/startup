      - number: '7.6'
        title: 缓释措施、监测指标、终止标准与尽调问题
        blocks:
          - type: paragraph
            body: >-
              正确的风险应对，不是因为行业困难就直接否决 LimX，而是把里程碑说清楚。法律缓释要有司法辖区地图、产品原产地分析、FCC/GUARD
              情景计划、数据流架构、出口管制审查和采购资格法律意见，然后才把美国或准政府收入计入模型。运营缓释要有机队档案：已部署单元、机队小时数、主要故障模式、事故严重度、保修准备金、软件更新控制、渗透测试和客户验收证书。商业缓释要有带用例、定价、正常运行时间义务和续约条款的已签客户合同。财务缓释要把物料清单和制造良率桥接到毛利率和现金消耗。打破投资逻辑的触发器包括：覆盖中国机器人的进口禁令落地、无法说出可参考客户、拿不出可靠性日志、Unitree/Agibot
              持续主导份额而 LimX 没有差异化利基，或新融资条款显示估值支撑跑在部署证据前面。
