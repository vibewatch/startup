  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              本章把市场界定为对外销售的人形机器人，以及能够执行、测试或加速类人形移动和操作工作流的相邻足式机器人平台。 纳入的支出包括硬件、机载软件、开发者工具、部署支持和机队集成，但前提是这些元素被打包进机器人采购或试点。
              排除的支出包括传统工业机械臂、AMR、协作机器人、纯软件、仅用于原型的设备、内部 demo 机，以及不能代表外部销售的预购试用机。
              这一区分很关键，因为被引用最多的中国预测明确过滤了原型和内部自用设备。相关替代方案不只是竞品人形机器人： 买方也可以继续用人力、安装固定自动化、在较窄任务中使用 AMR
              或协作机器人、依赖远程操作，或自建机器人工具。 足式科研套件处在边界上：它们未必是量产人形机器人，但能培养开发者，并在日后可迁移到人形机器人的工作流中验证运动能力。
