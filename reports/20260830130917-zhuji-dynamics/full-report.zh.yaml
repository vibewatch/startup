      - number: '7.5'
        title: 财务、单位经济与估值模型风险
        blocks:
          - type: paragraph
            body: >-
              仅凭公开材料，财务模型无法承销。融资文章能证明 LimX
              正在投入研发和市场扩张，却没有披露收入、毛利率、烧钱速度、现金跑道、保修准备金、获客成本或产品级单位经济。这种不透明在人形机器人里比纯软件更关键，因为每一台都带着材料、制造良率、库存、物流、安全、安装、服务和潜在召回敞口。更大行业里的
              IPO
              抢跑和竞争对手规模，也制造了融资窗口风险：如果公开市场胃口降温，或头部同行重置价格，挑战者可能在部署成熟前被迫以更弱条款融资。低价机器人作为战略楔子产品时，利润率风险尤其尖锐。因此，投资逻辑应建模下行情景：ASP
              下跌、物料清单节省滞后、保修成本上升，以及出口限制迫使公司为不同司法辖区开发重复产品变体。
            claimRefs:
              - CR017
