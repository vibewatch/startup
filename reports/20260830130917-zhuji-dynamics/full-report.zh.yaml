        title: 打破投资逻辑的触发器与监测节奏
        blocks:
          - type: paragraph
            body: >-
              监测节奏应由里程碑驱动，而不是由新闻驱动。最重要的正面信号，是带付款的具名部署、重复订单、保修表现，以及能解释低机器人价格如何变成可投资毛利率的制造良率。最重要的负面信号，是降价轮、优先权沉重的融资、被目标出口市场监管排除，或演示与客户经济性之间的缺口继续存在。如果
