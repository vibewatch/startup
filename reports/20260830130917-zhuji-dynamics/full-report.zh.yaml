      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求逻辑靠三股力量相互强化：中国生产规模、政策支持的部署压力，以及一条有望让选定工作流中的机器人在经济性上接近人力或固定自动化的降本路径。 TrendForce 和其他来源指向中国产出快速增长，Morgan
              Stanley 相关报道则强调工厂 / 物流商业化和 SOE 采购信号。HEIS 2026 等标准也能为安全、
              接口和评估提供框架，从而加速采用。约束同样实质。执行器仍占物料清单很大一部分，灵巧操作落后于人类表现，ROI 取决于利用率、 集成质量和有效产出。地缘政治限制并不抽象：GUARD Act
              及相关提案可能把中国机器人排除出美国公共部门或敏感基础设施渠道； 即使全球 TAM 扩大，可进入 SAM 也会被压低。
