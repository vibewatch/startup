- id: leadership-governance-and-key-person-risk
  title: Leadership, governance, and key-person risk
  body: 'The public leadership record supports a high-quality technical founding story but only a partial governance view. Wei Zhang is the central figure: sources consistently describe him as founder and CEO, a Purdue ECE PhD, UC Berkeley postdoc, former tenured Ohio State academic, and SUSTech professor whose research focus aligns directly with LimX''s all-terrain locomotion emphasis. Zhang Li’s November 2023 arrival from WeRide adds operating and autonomy-systems credibility that is relevant to scaling robotics beyond lab demos. Robot Testers also identifies Pan Jia, formerly a University of Hong Kong associate professor, as chief scientist. The governance gap is just as important as the talent signal: public sources do not disclose board seats, observer rights, cap-table control, founder ownership, or succession mechanics. Because the technical narrative is closely tied to Wei Zhang, investors should underwrite LimX as a company with strong founder-market fit and meaningful key-person
    dependence until management depth and governance rights are proven privately.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO042
  tableRefs:
  - TO002
- id: funding-valuation-and-stakeholders
  title: Funding, valuation, and stakeholder map
  body: LimX’s funding story is the clearest hard signal in the overview. Multiple outlets and the company announcement support a US$200 million Series B in February 2026, with domestic strategic capital, Middle East-linked capital, and automotive-adjacent backers participating. The canonical total raised for this report is approximately US$250 million; that reconciles the confirmed Series B with earlier rounds while acknowledging conflicting third-party profiles that report US$200 million, roughly US$296 million, or about US$300 million. The canonical valuation is greater than US$1 billion after the Series B, but the precise post-money price, liquidation preferences, and option-pool treatment were not found in public documents. No reviewed source identified debt, venture debt, credit facilities, or secondary transactions. Strategically, JD.com, SAIC/Shangqi, NIO Capital, Zhongding, Stone or Lestone, and Oriental Fortune matter because they point to logistics, automotive manufacturing, EV
    ecosystems, component supply, and Gulf market access rather than passive financial capital alone.
  claimRefs:
  - CO013
