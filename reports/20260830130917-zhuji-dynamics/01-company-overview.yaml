- id: cover-metrics-milestones-and-adverse-context
  title: Cover metrics, milestones, and adverse context
  body: 'The cover should be explicit about what is known, what is estimated, and what is missing. Funding, stage, founding date, headquarters, and product family are supportable. Valuation, total raised, and headcount are useful but caveated; this chapter uses greater than US$1 billion, approximately US$250 million raised, and approximately 300 people as canonical values while preserving conflicts. Revenue, ARR, active customer count, gross margin, burn, runway, and unit economics are undisclosed. Milestones show a compressed 2022–2026 arc: founding, early products, Zhang Li’s governance-relevant hire, earlier financing, Oli pricing and deliveries, TRON 2, COSA, Middle East and U.S. expansion discussions, Series B, Chinese standards, U.S. legislative backlash, and Tokyo summit visibility. The adverse context is not company-specific fraud or litigation; it is sector opacity, intense Unitree/AgiBot competition, unverified deployments, and U.S. policy scrutiny of Chinese connected robots.'
