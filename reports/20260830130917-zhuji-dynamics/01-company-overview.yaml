chapter:
  number: 1
  title: Company Overview
  summary: Zhuji Dynamics (LimX Dynamics) is a Shenzhen-founded humanoid and legged-robotics startup with strong founder-market fit, a US$200 million Series B, and a canonical post-Series-B valuation above US$1 billion. The investability story is compelling on capital, technical pedigree, and product breadth, but still weak on disclosed revenue, named customers, exact headcount, governance rights, and independently verified deployment KPIs.
sections:
- id: identity-stage-and-business-model
  title: Identity, stage, and business model
  body: 'Zhuji Dynamics (LimX Dynamics) is the Shenzhen-based legged-robotics and humanoid company this report will treat as the canonical identity owner for later chapters. The stable facts are January 2022 founding, Shenzhen headquarters, private Series B status, and a product scope centered on full-size humanoids, multi-form legged robots, and embodied-AI developer tooling. Official pages list Luna, Oli, TRON 2, TRON 1, COSA, and developer support, while independent reports tie the business to hardware platforms, research and education sales, and future industrial or service deployments. The one-line model is therefore: LimX sells and supports humanoid and multi-form robot platforms, plus software and simulation assets, to developers, laboratories, manufacturers, and prospective service operators. The caveat is that this is not yet a financial model with public revenue, margin, or customer-count evidence; it is a commercialization path inferred from product releases, pricing, delivery
    comments, and the open developer stack. This overview also intentionally centralizes identity and cover facts here so later chapters can cite their own narrower evidence without restating or drifting the canonical values.'
  claimRefs:
