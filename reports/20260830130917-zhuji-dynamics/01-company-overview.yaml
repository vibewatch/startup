  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Current board roster, investor rights, founder ownership, voting thresholds, and observer seats.
    whyItMatters: Governance rights determine control, exit optionality, and whether strategic investors can constrain customer or geography choices.
    diligencePath: Request the latest cap table, shareholders agreement, board minutes, and financing documents from company counsel.
    relatedQuestionRefs:
    - QO010
    - QO012
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: material
    topic: debt-and-secondaries
    missingEvidence: Disclosure of any venture debt, working-capital lines, equipment financing, guarantees, or secondary share sales.
    whyItMatters: Debt and secondary transactions change runway, liquidation stack, and insider incentives.
    diligencePath: Ask management and lead investors for a debt schedule, side-letter register, and secondary-transfer history.
    relatedQuestionRefs:
    - QO018
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Current employee count by function, location, and contractor status, reconciled against registry/profile ranges.
    whyItMatters: Headcount is a scale proxy for manufacturing readiness and burn; conflicting figures make runway and execution capacity hard to assess.
    diligencePath: Request payroll snapshot, organization chart, and hiring plan dated within 30 days of diligence close.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: customers-and-revenue
    missingEvidence: Active customer count, named deployments, revenue/run-rate, gross margin, backlog, uptime, and intervention-rate data.
    whyItMatters: The company’s valuation depends on whether product releases convert into repeatable customer economics rather than demonstrations.
    diligencePath: Obtain customer contracts, invoices, delivery logs, service records, and references for the largest pilots or production deployments.
    relatedQuestionRefs:
    - QO021
    - QO022
    relatedTableRefs:
    - TO001
    - TO004
  - type: conflicting-data
    severity: minor
    topic: funding-conflict
    missingEvidence: A company-confirmed reconciliation of cumulative capital raised, investor legal names, and exact post-money valuation after Series B.
    whyItMatters: Conflicting public profiles can create metric drift across diligence materials and obscure liquidation preference.
    diligencePath: Request financing ledger, signed press-release investor list, and waterfall model from the company or lead counsel.
    relatedQuestionRefs:
    - QO016
    - QO017
    - QO025
    relatedTableRefs:
    - TO003
