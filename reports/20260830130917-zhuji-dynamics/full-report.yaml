      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Buyer segmentation is more important than a single TAM headline. In automotive and logistics, the economic
              buyer is usually operations or plant leadership, the user is a production or warehouse team, and the payer
              is an operations, automation, or transformation budget. In research and education, the buyer is a
              principal investigator, lab director, or department, and the payer is an R&D, capital equipment, or grant
              budget. In utilities and public infrastructure, procurement may be centralized and heavily influenced by
              safety, security, and standards teams. The adoption path therefore usually begins with R&D evaluation or a
              controlled pilot, proceeds through safety certification and workflow integration, and only then converts
              into operations-owned fleet deployment. Household and elder-care use cases may be strategically large, but
              the evidence supports treating them as later-timed demand pools rather than the 2026 commercial core.
            claimRefs:
