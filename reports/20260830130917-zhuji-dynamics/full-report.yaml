      - number: '7.3'
        title: Operational, quality, security, and deployment risk
        blocks:
          - type: paragraph
            body: >-
              Hardware scaling risk is high because humanoid robots combine locomotion, actuators, batteries, sensors,
              software updates, human interaction, and after-sales service in one physical product. TRON 2 disclosures
              include safety-boundary protection and redundant power, which are useful mitigants, but they do not
              substitute for field failure statistics, recall history, warranty reserves, or production-yield data.
              LimX’s low-cost modular positioning may be strategically attractive for developer adoption, yet price
              points in this category invite margin pressure and expose every service call or component defect. Security
              risk is also operational: ROS tooling, SDKs, teleoperation, cameras, and cloud-connected agentic software
              create attack surfaces and data-handling obligations for overseas customers. The diligence posture should
              therefore be evidence-first: request fleet hours, MTBF, incident severity logs, return rates,
              cybersecurity test reports, software bill of materials, export-control review, and customer acceptance
              criteria before underwriting scaled commercial deployments.
            claimRefs:
