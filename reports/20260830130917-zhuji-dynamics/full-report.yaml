      - number: '7.5'
        title: Financial, unit-economics, and valuation-model risk
        blocks:
          - type: paragraph
            body: >-
              The financial model cannot be underwritten from public materials alone. Funding articles establish that
              LimX is investing into R&D and market expansion, but they do not disclose revenue, gross margin, burn,
              runway, warranty reserves, customer acquisition costs, or product-level unit economics. That opacity
              matters more in humanoid robotics than in pure software because every unit carries materials,
              manufacturing yield, inventory, logistics, safety, installation, service, and potential recall exposure.
              The broader sector’s IPO rush and competitor scale create a financing-window risk: if public-market
              appetite cools or dominant peers reset pricing, a challenger can be forced to raise capital on weaker
              terms before deployments mature. Margin risk is particularly acute where low-cost robots are strategic
              wedge products. The thesis should therefore model downside cases where ASPs fall, bill-of-materials
              savings lag, warranty costs rise, and export restrictions force duplicative product variants for different
              jurisdictions.
            claimRefs:
              - CR017
              - CR018
