      - number: '6.5'
        title: 'Expansion and concentration: broad ambition, narrow verified demand'
        blocks:
          - type: paragraph
            body: >-
              The expansion story is broad but still under-evidenced. January 2026 coverage says Chinese humanoid
              robots, including LimX, are targeting the Middle East and U.S., and other sources describe partnership-led
              internationalization rather than simple capital seeking. That can be strategically sensible: local
              distributors, integrators, and sovereign or enterprise partners can reduce procurement friction and create
              first deployments. Yet the same evidence does not identify the customers that would absorb thousands of
              units, nor does it prove conversion from developer platform to production fleet. Near-term concentration
              risk is therefore qualitative rather than numerical: demand may be clustered in research institutions,
              early adopters, distributors, and strategic-investor ecosystems, while the large industrial accounts that
              would validate the valuation narrative remain unnamed. Diligence should focus on de-anonymizing pipeline
              by geography and vertical, separating paid orders from demos, and testing whether any one partner controls
              access to demand.
