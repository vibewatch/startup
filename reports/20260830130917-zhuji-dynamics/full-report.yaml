        title: Evidence-constrained TAM, SAM, and SOM lenses
        blocks:
          - type: paragraph
            body: >-
              The cleanest evidence-constrained TAM lens is global humanoid robotics annual revenue of approximately
              US$6.2B in 2026. The clearest SAM lens for a China-centered humanoid and legged-robot supplier is Morgan
              Stanley’s China estimate: approximately US$2B in 2026, approximately 50,000 shipped units, and expansion
              to approximately US$15B and approximately 446,000 units by 2030. Those figures are used exactly because
              they are repeated in the dossier and directly reflected in market reporting. A narrower SOM should not be
              asserted as a company fact; it can only be framed as a sensitivity. At 1-3% share of the 2026 China
              revenue pool, a challenger’s implied annual revenue opportunity would be about US$20M-US$60M before
              execution, price, product mix, and regulatory filters. Multiple publishers create wider long-run TAM
              stories, but they mix different endpoints and methods, so near-term valuation work should privilege the
              externally sold-unit lens.
