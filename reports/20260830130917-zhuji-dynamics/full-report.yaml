      - number: '3.3'
        title: Comparison on capability, pricing, GTM, distribution, and trust posture
        blocks:
          - type: paragraph
            body: >-
              LimX is comparatively strongest where modularity, developer accessibility, and software ambition matter.
              TRON 2's low research-platform price and three configurations make it useful for labs and developers,
              while Oli and COSA give LimX a full-size humanoid and software narrative. The challenge is that Unitree
              already defines the low-cost reference point: G1 is widely anchored around $16,000 and Curionic reports an
              even lower R1 Air entry point, so LimX cannot rely on price alone. AgiBot and UBTECH compete with
              manufacturing and enterprise deployment signals, while Figure and Apptronik offer U.S.-aligned enterprise
              narratives that can win trust-sensitive accounts. The feature matrix therefore marks unsupported cells
              explicitly; public evidence is good enough for product scope, list-price anchors, and strategic direction,
              but not good enough for realized enterprise pricing, uptime, warranty reserves, service margins, or
              audited installed-base quality. Those gaps are material because hardware buyers underwrite total cost of
              ownership, not demo performance.
