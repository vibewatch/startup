  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacencies, substitutes, status quo, internal build, and entrants'
        blocks:
          - type: paragraph
            body: >-
              LimX competes in a crowded 2026 landscape where the buyer's alternative set is wider than
              humanoid-versus-humanoid. The direct China peer group is led by Unitree and AgiBot, with UBTECH as the
              most visible listed incumbent and LimX as a smaller innovation-led challenger. Adjacent legged-robot
              suppliers such as DEEP Robotics compete for inspection, research, and mobility budgets even when they are
              not selling the same humanoid form factor. Western humanoid suppliers including Figure, Apptronik, Tesla
              Optimus, 1X, and NEURA create an alternative path for buyers that value non-China supply, enterprise
              trust, or access to U.S. AI and manufacturing ecosystems. The substitute set also includes fixed
              automation, human labor, and internal robotics builds by manufacturers with enough engineering depth. The
              landscape therefore should not be scored only on walking demos: production scale, deployment trust, price,
              software stack, and channel access shape whether LimX is a preferred supplier or one pilot among many.
