            body: >-
              The financial verdict is research-more. LimX has enough public evidence to underwrite monetization
              hypotheses: low list prices, a hardware portfolio, a possible COSA software layer, substantial strategic
              capital and a large China market backdrop. It does not have enough public evidence to underwrite revenue
              quality, gross margin, burn, runway or capital efficiency. The biggest risks are negative or thin hardware
              margins at low ASPs, working-capital absorption during scale-up, uncertain channel economics, regulatory
              friction in overseas markets and valuation dependence on future scale rather than disclosed current
              revenue. The next diligence step is management data-room proof: invoices, ASP waterfall, gross-margin
