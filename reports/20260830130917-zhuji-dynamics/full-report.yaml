      - number: '4.3'
        title: Cost structure, unit economics and working capital
        blocks:
          - type: paragraph
            body: >-
              Humanoid robotics is a hardware-first cost structure with a software upside case. Public sources do not
              disclose LimX’s bill of materials, yield curve, warranty reserve, field-support staffing, assembly capex
              or supplier prepayment terms. The relevant cost drivers are actuators, sensors, batteries, compute,
              materials, QA, integration labor and on-site support, plus continuing R&D on control and autonomy. Peer
              evidence is mixed: TrendForce cites Unitree prospectus data with strong combined gross margin, while
              adverse sector analysis emphasizes component costs, pricing pressure and the survival challenge of scaling
              production. LimX’s low entry pricing may expand developer demand but can also compress gross margin unless
              component cost, yields and attach rates improve quickly. Working capital is also likely material because
              inventory and testing cash precede acceptance and collection.
