      - number: '8.3'
        title: Financing context, entry discipline, and scenarios
        blocks:
          - type: paragraph
            body: >-
              The financing context is strong but should be interpreted as a negotiating constraint, not a valuation
              proof. The US$200 million Series B supports runway and syndicate quality, while the roughly US$250 million
              lifetime financing proxy makes liquidation preferences, pro-forma option pool, and follow-on reserve needs
              central diligence items. In the bull case, LimX converts COSA and modular hardware into repeatable
              deployments, raising the next mark above the current entry. In the base case, the current round remains
              around fair value while milestones mature. In the bear case, category multiples compress before LimX has
              revenue scale, or geopolitical limits reduce exit optionality. The sensitivity work should focus on
              revenue scale, gross margin, failure rates, and terminal multiple rather than headline demos.
            claimRefs:
