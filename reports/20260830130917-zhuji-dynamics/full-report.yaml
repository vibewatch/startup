        title: Revenue streams, pricing and recognition
        blocks:
          - type: paragraph
            body: >-
              LimX’s public financial surface is unusually narrow: the company shows product breadth and list-price
              anchors, but not revenue, bookings, ARR, gross profit, backlog or recognition policy. The clearest revenue
              stream is hardware unit sales across Oli, TRON 2 and other robot platforms, with a possible software and
              support layer around COSA, SDKs, deployment, training and maintenance. Oli’s roughly RMB 158,000 / $22k
              list price and TRON 2’s roughly $6.8k-$7.0k entry price give useful order-of-magnitude ASP bounds, not
              evidence of realized discounts, bundled services, payment timing or margin. Revenue recognition therefore
              remains a diligence item: preorders, deposits, pilot units and demos could have very different accounting
              treatment from accepted commercial deliveries. The underwriting model should treat product prices as
              monetization signals and keep actual revenue mix at null until management provides cohort-level invoices
