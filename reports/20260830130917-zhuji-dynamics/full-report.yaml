        blocks:
          - type: paragraph
            body: >-
              The public customer picture is research-first. LimX’s strongest visible buyer group is universities,
              research labs, RL developers, and AI robotics teams that need a configurable humanoid or legged platform
              rather than a turnkey industrial labor replacement. Oli, TRON 1, and TRON 2 are all described around
              development support, modular configurations, SDK-friendly experimentation, and embodied-AI research
              workflows. The buyer is usually a principal investigator, robotics lab, innovation center, or advanced R&D
