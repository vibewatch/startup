      - number: '8.5'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness remains conditional. A China or Hong Kong IPO path could become viable if LimX can show
              audited revenue growth, gross margin improvement, safety compliance, and reduced reliance on
              demonstrations. Strategic exit optionality exists through retail, automotive, industrial automation, and
              Middle East capital relationships, but those paths need contract evidence. Non-China exits require a legal
              discount because proposed restrictions on Chinese robotics can shrink buyer universes and channel access.
              The final diligence package should prioritize proof that customers are paying, robots are reliable,
              margins can survive low price points, and the financing stack leaves common-equity upside after
              preferences. Missing any of those items should hold the recommendation at track.
