              disclose NRR, GRR, churn, renewal rates, contract length, customer satisfaction, formal references,
              top-account revenue concentration, or repeat purchase behavior. For hardware platforms sold into research
              labs, retention may be less like SaaS renewal and more like follow-on purchases, support contracts,
              upgrades, spare parts, and additional robots for new experiments. For industrial deployments, retention
