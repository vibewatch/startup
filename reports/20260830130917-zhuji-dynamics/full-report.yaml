companyProfile:
  summary: >-
    Zhuji Dynamics is the Shenzhen-based embodied-AI and humanoid robotics company that many July 2026 sources still
    label Zhuji Dynamics (LimX Dynamics). It develops full-size humanoids, modular multi-form robots, and the COSA /
    brain-cerebellum software stack for manufacturing, industrial, service, and developer scenarios. By July 2026 the
    company had completed a nearly $200 million Pre-IPO round at a reported RMB 15 billion valuation and said it was
    already in confidential IPO preparation, but detailed financial and customer disclosures remained private.
