      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis combines a very large China humanoid adoption curve, a technically credible founding
              team, modular products with relatively low public price points, and software ambition through COSA. Those
              elements can justify continued coverage because the category may produce venture-scale winners. The
              anti-thesis is equally strong: LimX appears to be a challenger behind Unitree and Agibot in China volume
              signals, while public materials do not yet prove enterprise demand or unit economics. Humanoid robotics
              also sits in a hype cycle where investors may reward demos before durable margins. The correct posture is
              therefore to preserve option value without paying for a fully proven commercial story before the evidence
              exists.
            claimRefs:
              - CV011
