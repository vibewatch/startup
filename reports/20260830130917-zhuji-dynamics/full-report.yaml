              documents. No reviewed source identified debt, venture debt, credit facilities, or secondary transactions.
              Strategically, JD.com, SAIC/Shangqi, NIO Capital, Zhongding, Stone or Lestone, and Oriental Fortune matter
              because they point to logistics, automotive manufacturing, EV ecosystems, component supply, and Gulf
