              East-linked capital, and automotive-adjacent backers participating. The canonical total raised for this
              report is approximately US$250 million; that reconciles the confirmed Series B with earlier rounds while
              acknowledging conflicting third-party profiles that report US$200 million, roughly US$296 million, or
