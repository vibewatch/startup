      - number: '8.6'
        title: Thesis-break triggers and monitoring cadence
        blocks:
          - type: paragraph
            body: >-
              The monitoring cadence should be milestone-driven rather than news-driven. The most important positive
              signals are named deployments with payments, repeat orders, warranty performance, and manufacturing yields
              that explain how low robot prices become investable gross margins. The most important negative signals are
              a down round, preference-heavy financing, regulatory exclusion from target export markets, or a continued
              gap between demos and customer economics. If LimX cannot provide private operating data under NDA, the
              investment case cannot graduate from track because the valuation would remain anchored in comparables and
              category optimism. A credible next review should ask whether evidence quality has improved enough to
              narrow scenario ranges.
