      - number: '1.2'
        title: Leadership, governance, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              The public leadership record supports a high-quality technical founding story but only a partial
              governance view. Wei Zhang is the central figure: sources consistently describe him as founder and CEO, a
              Purdue ECE PhD, UC Berkeley postdoc, former tenured Ohio State academic, and SUSTech professor whose
              research focus aligns directly with LimX's all-terrain locomotion emphasis. Zhang Li’s November 2023
              arrival from WeRide adds operating and autonomy-systems credibility that is relevant to scaling robotics
              beyond lab demos. Robot Testers also identifies Pan Jia, formerly a University of Hong Kong associate
              professor, as chief scientist. The governance gap is just as important as the talent signal: public
              sources do not disclose board seats, observer rights, cap-table control, founder ownership, or succession
              mechanics. Because the technical narrative is closely tied to Wei Zhang, investors should underwrite LimX
              as a company with strong founder-market fit and meaningful key-person dependence until management depth
              and governance rights are proven privately.
