      - number: '8.4'
        title: Comparable valuation frame
        blocks:
          - type: paragraph
            body: >-
              The comparable set should be deliberately mixed. Figure AI is a ceiling marker, not the normal case: its
              US$39 billion post-money round reflects a uniquely visible investor and deployment narrative. Apptronik,
              NEURA, and 1X are private Western references for capital intensity and premium AI multiples, but their
              go-to-market and geopolitical setting differ. Unitree and Agibot are the more painful China checks because
              they show the risk that low-cost volume leaders capture share and compress pricing. UBTech is the
              essential public filing anchor because it shows how humanoid revenue mix, gross margin, and losses can
              look when the company is listed. This mix supports a fair stance, not a precise DCF.
            claimRefs:
