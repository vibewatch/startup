      - number: '7.4'
        title: Partner, dependency, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              LimX’s dependencies are broader than a normal software startup’s. It relies on regulators for market
              access, component supply chains for actuators and compute, strategic investors for capital and channel
              help, and customers willing to run robots in messy physical environments. Public financing sources
              identify a mix of automotive, commerce, prior shareholders, and Middle East-linked capital, which can help
              with distribution but also introduces governance and geopolitical-optics diligence. The customer side
              remains under-evidenced: expansion articles discuss Middle East and U.S. ambition, yet they do not provide
              a durable list of signed customers, commercial terms, acceptance milestones, or renewal economics. People
              risk is also material. Public profiles concentrate the technical narrative around Dr. Wei Zhang’s
              locomotion and control expertise; the operating bench has some positive signals, but manufacturing
              leadership depth is not transparent. A real mitigation plan must demonstrate institutionalized
              engineering, quality, sales, compliance, and after-sales capacity rather than founder-led heroics.
            claimRefs:
