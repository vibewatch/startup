  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price call
        blocks:
          - type: paragraph
            body: >-
              LimX deserves a track recommendation, not an immediate buy, because the Series B gives credible runway and
              strategic validation while the public evidence still leaves the core underwriting variables private. The
              IC case is price-sensitive: a US$1,000 million entry anchor is not obviously excessive compared with
              global humanoid outliers, yet it is not cheap when LimX has not publicly disclosed revenue run-rate,
              margin, backlog, or paid deployment retention. I would monitor the name and prepare a primary or secondary
              bid only if diligence confirms customer economics, cap-table terms, and regulatory exit paths. The
              chapter’s working judgment is medium confidence, high risk, and fair valuation stance, with a required
              gross return path of at least three times before further dilution.
            claimRefs:
