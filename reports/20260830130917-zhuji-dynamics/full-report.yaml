  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              LimX’s risk stack is dominated by risks that can shut doors before product-market fit is fully proven:
              overseas legal exposure, domestic standards compliance, and brutal China competition. The highest-severity
              issue is not a single company-specific enforcement action; it is a policy vector. U.S. lawmakers are
              explicitly discussing import and procurement restrictions for Chinese robots, while China is
              simultaneously accelerating HEIS standards and MIIT/SASAC real-scene deployment programs. That creates a
              split-world path: domestic policy may create demand and standards clarity, but overseas buyers may treat
              Chinese humanoids as networked national-security hardware. The second tier is execution risk: LimX must
              show reliable deployments, manufacturing yield, safety logs, and customer ROI while Unitree and Agibot
              appear to be scaling faster. The third tier is financial: public sources show financing momentum, yet not
              revenue, margin, burn, or warranty economics. The investment implication is a tracking stance unless
              management can convert demos and funding into audited deployments with a defensible compliance
              architecture.
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR012
              - CR013
              - CR017
