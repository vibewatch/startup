      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The demand case rests on three reinforcing drivers: China production scale, policy-backed deployment
              pressure, and a cost-down path that could make robots economically comparable to labor or fixed automation
              in selected workflows. TrendForce and other sources point to rapid China output growth, while Morgan
              Stanley-linked reporting highlights factory/logistics commercialization and SOE procurement signals.
              Standards such as HEIS 2026 can also accelerate adoption by giving buyers a framework for safety,
              interfaces, and evaluation. The constraints are equally material. Actuators remain a large share of the
              bill of materials, dexterous manipulation lags human performance, and ROI depends on utilization,
              integration quality, and effective output. Geopolitical restrictions are not abstract: the GUARD Act and
              related proposals could remove Chinese robots from U.S. public-sector or sensitive-infrastructure
              channels, lowering accessible SAM even if global TAM expands.
