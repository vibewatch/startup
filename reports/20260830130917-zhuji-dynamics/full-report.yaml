  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              This chapter treats the market as externally sold humanoid robots and closely adjacent legged-robot
              platforms that can perform, test, or accelerate humanoid-style mobility and manipulation workflows.
              Included spend is hardware, onboard software, developer tooling, deployment support, and fleet integration
              when those elements are bundled into a robot purchase or pilot. Excluded spend is conventional industrial
              arms, AMRs, cobots, pure software, prototype-only units, internal demo builds, and preorder trial units
              that do not represent external sales. That distinction matters because the most cited China forecast
              explicitly filters out prototypes and internal-use units. The relevant substitutes are not only rival
              humanoids; buyers can also keep human labor, install fixed automation, use AMRs or cobots for narrower
              tasks, rely on teleoperation, or build internal robotics tooling. Legged research kits sit at the
              boundary: they may not be production humanoids, but they cultivate developers and prove locomotion in
              workflows that can later migrate to humanoids.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
