- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue / ARR / backlog
    - Cannot size current revenue base or growth quality
    - Request monthly recognized revenue, bookings, backlog and deferred revenue by product
  - - Paid customer count and concentration
    - Cannot assess repeatability or channel dependence
    - Customer list, signed contracts, top-10 revenue concentration and renewal status
  - - Units shipped versus demo units
    - Cannot convert demos into revenue or utilization
    - Serial-number shipment log, acceptance certificates and paid-vs-demo classification
  - - Gross margin and COGS
    - Cannot judge low-price sustainability
    - SKU margin bridge, BOM, labor, overhead, warranty and freight by period
  - - Cash balance and burn
    - Cannot compute runway after Series B
    - Bank statements, restricted cash, monthly cash-flow statement and hiring plan
  - - Working capital and deposits
    - Cannot see whether growth consumes or creates cash
    - Inventory aging, supplier payment terms, customer deposits and DSO
  - - Debt, leases and guarantees
    - Cannot assess claims ahead of equity
    - Credit agreements, lease commitments, guarantees and project-finance obligations
  - - Channel economics
    - Cannot model CAC or partner margin
    - Partner contracts, referral fees, reseller discounts and conversion by channel
  notes: 'This is a private-evidence-only gap register: each missing metric changes valuation, runway or margin underwriting.'
