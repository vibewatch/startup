chapter:
  number: 4
  title: Financials
  summary: 'LimX has visible list-price anchors and a large February 2026 financing round, but its private status leaves revenue, margin, burn, cash and runway undisclosed. The financial conclusion is research-more: model monetization hypotheses, but require management data-room evidence before underwriting unit economics or capital adequacy.'
sections:
- id: revenue-streams-pricing-recognition
  title: Revenue streams, pricing and recognition
  body: 'LimX’s public financial surface is unusually narrow: the company shows product breadth and list-price anchors, but not revenue, bookings, ARR, gross profit, backlog or recognition policy. The clearest revenue stream is hardware unit sales across Oli, TRON 2 and other robot platforms, with a possible software and support layer around COSA, SDKs, deployment, training and maintenance. Oli’s roughly RMB 158,000 / $22k list price and TRON 2’s roughly $6.8k-$7.0k entry price give useful order-of-magnitude ASP bounds, not evidence of realized discounts, bundled services, payment timing or margin. Revenue recognition therefore remains a diligence item: preorders, deposits, pilot units and demos could have very different accounting treatment from accepted commercial deliveries. The underwriting model should treat product prices as monetization signals and keep actual revenue mix at null until management provides cohort-level invoices and recognition schedules.'
  claimRefs:
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
  - CI010
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: gtm-sales-efficiency-proxies
  title: GTM motion and sales-efficiency proxies
  body: 'The go-to-market evidence points to a direct enterprise and cooperation-led motion rather than self-serve robotics commerce. LimX exposes order consultation, store/cooperate and enterprise-support routes, while financing reports show strategic backers that could become industrial channels or supply-chain partners. That is helpful, but it is not enough to calculate CAC, payback or sales productivity. The best public proxy is qualitative: humanoid robots remain pilot-heavy, integration-heavy and proof-driven, with demos and multi-year market-entry plans preceding confirmed paid deployments. Strategic investors may reduce access costs, yet the public record does not disclose referral conversion, reseller margin, minimum purchase commitments, partner-funded deployments or customer concentration. Sales-efficiency analysis should therefore stay proxy-based and ask for pipeline by stage, signed order value, implementation cost, sales headcount and partner economics.'
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  tableRefs: []
  figureRefs:
  - FI002
- id: cost-structure-unit-economics
  title: Cost structure, unit economics and working capital
  body: 'Humanoid robotics is a hardware-first cost structure with a software upside case. Public sources do not disclose LimX’s bill of materials, yield curve, warranty reserve, field-support staffing, assembly capex or supplier prepayment terms. The relevant cost drivers are actuators, sensors, batteries, compute, materials, QA, integration labor and on-site support, plus continuing R&D on control and autonomy. Peer evidence is mixed: TrendForce cites Unitree prospectus data with strong combined gross margin, while adverse sector analysis emphasizes component costs, pricing pressure and the survival challenge of scaling production. LimX’s low entry pricing may expand developer demand but can also compress gross margin unless component cost, yields and attach rates improve quickly. Working capital is also likely material because inventory and testing cash precede acceptance and collection.'
  claimRefs:
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  tableRefs:
  - TI003
  figureRefs: []
- id: public-traction-private-metric-gaps
  title: Public traction versus private-metric gaps
  body: 'Public traction is activity-rich but financial-metric poor. The official news center records product launches and updates; third-party coverage describes an 18-Oli autonomous deployment demo and reports expansion ambitions into the Middle East and United States. Those points are useful for product maturity and market narrative, but they are not equal to paid units, recognized revenue, utilization, retention or gross margin. Even a multi-robot demo is not a customer cohort unless it includes counterparty, price, acceptance criteria, service obligations and payment timing. Likewise, reported plans for several thousand deliveries need signed-order evidence before they become backlog. The diligence file should preserve this separation: public traction supports demand plausibility, while private metrics must decide revenue quality, repeatability and cash conversion.'
  claimRefs:
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  tableRefs:
  - TI005
  figureRefs: []
- id: capital-adequacy-financing-dependency
  title: Capital adequacy and financing dependency
  body: 'Capital adequacy is the chapter’s biggest gap. The $200 million February 2026 Series B is a meaningful runway and scale-up input, and the canonical lifetime financing input is approximately $250 million, with a conflicting profile reporting $296 million. But none of the retained public sources discloses cash remaining, monthly burn, committed capex, debt, leases, project-finance obligations, working-capital facilities, customer deposits or supplier financing. That means runway can only be scenario-modeled from private data. A conservative underwriting trigger is simple: LimX must convert visible prices, demos and strategic backing into repeatable paid deployments before the Series B runway forces another round. The filing and registry checks are useful for disclosure discipline, but neither JD.com’s filing portal nor the registry-style page closes LimX’s stake economics or cash balance.'
