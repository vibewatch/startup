  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: Recognized revenue, bookings, ARR, deferred revenue and revenue mix by hardware, software and service line.
    whyItMatters: Revenue quality and repeatability cannot be assessed from list prices or demos.
    diligencePath: Request audited or management monthly revenue schedule and product-level invoice sample.
    relatedQuestionRefs:
    - QI005
    - QI017
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: SKU-level ASP, COGS, gross margin, warranty reserve and service-delivery cost.
    whyItMatters: Low list pricing could be strategic or margin-destructive; public data cannot distinguish.
    diligencePath: Review SKU margin bridge, BOM, supplier quotes, labor allocation and warranty reserve methodology.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash balance, restricted cash, monthly burn, runway model and committed use of Series B proceeds.
    whyItMatters: The $200M round size does not reveal how long capital lasts under manufacturing scale-up.
    diligencePath: Obtain bank statements, board budget, monthly cash-flow forecast and variance-to-plan.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: gtm
    missingEvidence: CAC, funnel conversion, sales headcount productivity, partner economics and payback calculation.
    whyItMatters: Enterprise robotics can consume substantial sales and integration cost before revenue recognition.
    diligencePath: Request CRM export by stage, signed contract values, partner agreements and sales/marketing expense allocation.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: capex
    missingEvidence: Factory capex, tooling commitments, leased production footprint, supplier prepayments and automation plan.
    whyItMatters: Capex and tooling can consume Series B proceeds before gross margin reaches scale.
    diligencePath: Review capex approval packets, lease schedules, supplier MOQs and production capacity plan.
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: debt-obligations
    missingEvidence: Debt, leases, guarantees, credit lines, customer deposits and project-finance obligations.
    whyItMatters: Obligations ahead of equity can reduce true runway and constrain strategic flexibility.
    diligencePath: Request debt schedule, lease commitments, guarantees, bank letters and supplier-finance contracts.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: traction
    missingEvidence: Paid units shipped, demo units, acceptance certificates, utilization and backlog by customer.
    whyItMatters: Public demos and delivery plans are not enough to establish paid commercial traction.
    diligencePath: Reconcile serial-number logs to customer invoices, acceptance documents and service tickets.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI005
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: Cap-table reconciliation explaining why canonical lifetime financing is approximately $250M while Tracxn reports $296M.
    whyItMatters: Round-economics and runway sensitivity depend on gross versus net proceeds, FX and whether undisclosed rounds are included.
    diligencePath: Request full cap table and proceeds schedule by round, currency, fees and secondary-sale treatment.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: regulatory-finance
    missingEvidence: Region-level revenue plan adjusted for U.S. restrictions, HEIS compliance cost and overseas certification timing.
    whyItMatters: Market-access delays can strand GTM spend and reduce the value of international expansion plans.
    diligencePath: Ask management for country-level pipeline, regulatory clearance checklist and compliance budget.
    relatedQuestionRefs:
    - QI024
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: Accounting treatment for preorders, deposits, pilots, demo units, customer acceptance and bundled support.
    whyItMatters: Different recognition policies can materially change revenue timing and gross margin.
    diligencePath: Obtain revenue recognition memo, contract templates and example pilot-to-paid conversion accounting.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs:
    - TI002
