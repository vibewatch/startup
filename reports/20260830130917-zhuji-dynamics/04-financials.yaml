    - Debt schedule, leases, guarantees, supplier financing and customer deposits
  - - Next-round trigger
    - Commercial conversion before Series B runway is consumed
    - Medium
    - Financing dependency remains high unless paid deployments scale
    - Milestones required for Series C or strategic credit facility
