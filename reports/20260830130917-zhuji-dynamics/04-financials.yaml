  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current public value/status
  - Quality
  - Diligence ask
  rows:
  - - Robot hardware sales
    - Oli, TRON 2 and other platforms sold as units or preorders
    - Per robot
    - Oli and TRON 2 have public list-price anchors; actual shipments undisclosed
    - 'Medium: visible products, private volume'
    - Invoices by SKU, booked units, recognized revenue and cancellation terms
  - - Software / COSA layer
    - Agentic OS, SDKs and updates could monetize as license, subscription or bundled support
    - Per robot, seat or deployment
    - COSA is public; pricing and attach rate are not disclosed
    - 'Low: product exists, model private'
    - Contract examples separating hardware, software, upgrades and support
  - - Integration / deployment services
    - Pilot setup, training, safety validation and workflow integration
    - Per project or service package
    - No public service menu or price card
    - 'Low: common robotics pattern, not disclosed'
    - Statement of work samples and gross margin on deployment labor
  - - Maintenance / warranty / spare parts
    - Field support, repairs, battery/components and uptime obligations
    - Per robot per year
    - No warranty reserve or service-level disclosure
    - 'Low: critical economics private'
    - Warranty terms, failure rates, spare-parts margin and service staffing
  - - Strategic / channel programs
    - Investor or partner-led market access, co-development or reseller economics
    - Per partner, territory or project
    - Investors visible; partner economics not public
    - 'Low: channel is only a proxy'
    - Partner contracts, minimum commitments, referral fees and exclusivity
  notes: Rows distinguish public monetization surfaces from private revenue recognition and mix; null-style unknowns require management proof.
