companyProfile:
  summary: Zhuji Dynamics is the Shenzhen-based embodied-AI and humanoid robotics company that many July 2026 sources still label Zhuji Dynamics (LimX Dynamics). It develops full-size humanoids, modular multi-form robots, and the COSA / brain-cerebellum software stack for manufacturing, industrial, service, and developer scenarios. By July 2026 the company had completed a nearly $200 million Pre-IPO round at a reported RMB 15 billion valuation and said it was already in confidential IPO preparation, but detailed financial and customer disclosures remained private.
  foundedDate: '2022-01-01'
  founders:
  - name: Wei Zhang
    role: Co-founder & CEO
    background: Purdue ECE PhD, UC Berkeley postdoc, former tenured associate professor at Ohio State and professor at SUSTech; expert in reinforcement learning and legged locomotion.
    claimRefs:
    - CO007
  - name: Zhang Li
    role: Co-founder & COO
    background: Former COO of autonomous-driving company WeRide; joined LimX Dynamics in November 2023.
    claimRefs:
    - CO009
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: Full-size humanoids including Luna and Oli, multi-form TRON robots, and a full-stack embodied AI software architecture spanning motion generation, VLA/WAM capabilities, and the COSA agent operating system.
  customerFocus: Automotive, industrial, developer, research, commercial-service, and inspection users, with stated expansion across China, the Middle East, Europe, and wider Asia.
  businessModel: Hardware sales plus integration, developer tooling, and software/operating-system enablement for enterprise deployments.
  stage: Pre-IPO
  fundingStatus: Nearly $200 million Pre-IPO round announced in July 2026 at RMB 15 billion post-money valuation; total financing over the preceding six months reportedly exceeded $400 million.
