- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Down round
    - Next financing below the Series B entry anchor
    - Confirms public comps overstated current proof
    - Move from track to avoid unless terms repair upside
  - - Preference overhang
    - Liquidation stack materially impairs common upside
    - New money return target becomes unachievable
    - Demand lower entry or pass
  - - No paid deployment proof
    - No signed orders, deposits, or repeat customer conversion
    - Product narrative remains demo-led
    - Keep track only; no primary bid
  - - Gross margin gap
    - Low robot prices lack BOM/yield/service-cost support
    - Scale worsens losses rather than creates operating leverage
    - Require margin covenant or delay
  - - Regulatory exclusion
    - Chinese robot restrictions block target export channels
    - Exit buyer universe and revenue TAM shrink
    - Apply geopolitical discount or avoid
  - - Competitor share loss
    - Unitree/AgiBot pull further ahead in China shipment evidence
    - LimX challenger upside narrows
    - Lower scenario probabilities and revisit price
  notes: Triggers are monitorable diligence gates; exact thresholds should be calibrated with private company data.
