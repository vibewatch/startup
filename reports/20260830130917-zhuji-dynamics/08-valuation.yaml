- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Probability signal
  - Downside trigger
  rows:
  - - Bull
    - Paid deployments scale; COSA improves task economics; strategic investor channels convert
    - US$2.5B–US$4.0B next-stage valuation can support >3x before heavy dilution
    - Named customers, repeat orders, positive gross margin bridge
    - Deployment failures or no repeat orders
  - - Base
    - Technology credibility persists but commercialization proof is gradual
    - US$0.9B–US$1.4B holds around Series B entry, making track the right stance
    - Additional pilots and standards progress without audited margin proof
    - Flat follow-on mark or preference-heavy financing
  - - Bear
    - Humanoid multiples compress; China leaders dominate; export restrictions tighten
    - US$0.3B–US$0.7B outcome creates material loss risk for new primary entry
    - Adverse laws, weak customer data, or no margin proof
    - Down round, ban expansion, or customer churn evidence
  notes: Scenario ranges are directional underwriting ranges, not a DCF; they depend on private revenue and cap-table diligence.
