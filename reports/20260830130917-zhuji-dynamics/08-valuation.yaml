company:
  name: Zhuji Dynamics
chapter:
  number: 8
  title: Valuation
  summary: 'LimX earns a track recommendation: the Series B and category momentum are real, but public evidence does not yet prove customer economics, margin, or exit readiness at the Series B entry anchor. The valuation stance is fair, confidence medium, and risk high pending private diligence.'
sections:
- id: recommendation-and-price-call
  title: Recommendation and price call
  body: 'LimX deserves a track recommendation, not an immediate buy, because the Series B gives credible runway and strategic validation while the public evidence still leaves the core underwriting variables private. The IC case is price-sensitive: a US$1,000 million entry anchor is not obviously excessive compared with global humanoid outliers, yet it is not cheap when LimX has not publicly disclosed revenue run-rate, margin, backlog, or paid deployment retention. I would monitor the name and prepare a primary or secondary bid only if diligence confirms customer economics, cap-table terms, and regulatory exit paths. The chapter’s working judgment is medium confidence, high risk, and fair valuation stance, with a required gross return path of at least three times before further dilution.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  tableRefs:
  - TV001
  figureRefs:
  - FV001
  - FV004
- id: thesis-and-anti-thesis
  title: Thesis and anti-thesis
  body: 'The positive thesis combines a very large China humanoid adoption curve, a technically credible founding team, modular products with relatively low public price points, and software ambition through COSA. Those elements can justify continued coverage because the category may produce venture-scale winners. The anti-thesis is equally strong: LimX appears to be a challenger behind Unitree and Agibot in China volume signals, while public materials do not yet prove enterprise demand or unit economics. Humanoid robotics also sits in a hype cycle where investors may reward demos before durable margins. The correct posture is therefore to preserve option value without paying for a fully proven commercial story before the evidence exists.'
  claimRefs:
  - CV011
  - CV012
  - CV013
  - CV014
  - CV021
  - CV024
  - CV025
  - CV030
  - CV031
  tableRefs:
  - TV002
- id: financing-context-and-scenarios
  title: Financing context, entry discipline, and scenarios
  body: The financing context is strong but should be interpreted as a negotiating constraint, not a valuation proof. The US$200 million Series B supports runway and syndicate quality, while the roughly US$250 million lifetime financing proxy makes liquidation preferences, pro-forma option pool, and follow-on reserve needs central diligence items. In the bull case, LimX converts COSA and modular hardware into repeatable deployments, raising the next mark above the current entry. In the base case, the current round remains around fair value while milestones mature. In the bear case, category multiples compress before LimX has revenue scale, or geopolitical limits reduce exit optionality. The sensitivity work should focus on revenue scale, gross margin, failure rates, and terminal multiple rather than headline demos.
  claimRefs:
  - CV007
  - CV008
  - CV009
  - CV010
  - CV037
  - CV038
  - CV039
  - CV040
