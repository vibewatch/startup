    severity: minor
    topic: comparable-universe
    missingEvidence: Full private valuation dataset for China and Western humanoid rounds, including undisclosed secondaries.
    whyItMatters: The comparable table is representative rather than exhaustive, which limits precision.
    diligencePath: Commission private-market data pull and banker checks before issuing a bid.
