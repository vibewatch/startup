  - CV042
  - CV043
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Customer proof
    - Signed orders, deposits, backlog, conversion from demos
    - Validates demand and revenue quality
    - Review contracts, invoices, and customer calls
  - - Unit economics
    - BOM, yield, warranty, service cost, gross margin bridge
    - Low public prices can destroy margin
    - Factory and finance diligence under NDA
  - - Cap table
    - Current ownership, liquidation preferences, option pool, side letters
    - Determines whether entry can earn venture returns
    - Counsel-led financing document review
  - - Deployment reliability
    - Uptime, intervention rate, safety incidents, returns
    - Robots must work outside controlled demos
    - Site visits and customer technical diligence
  - - Regulatory/export
    - Covered-list exposure, data security posture, standards compliance
    - Shapes non-China revenue and exit universe
    - Legal memo and channel-by-channel review
  - - Comparable calibration
    - Revenue multiples and public-company loss benchmarks
    - Constrains fair entry price and next-round expectations
    - Benchmark against UBTech filing and private comps
  - - Exit map
    - Likely strategic buyers, IPO readiness, board timeline
    - Determines whether the hold period is realistic
    - Banker calls and investor-rights review
  notes: Diligence asks prioritize evidence that would move the recommendation or valuation stance.
