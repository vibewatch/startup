- id: comparable-valuation-frame
  title: Comparable valuation frame
  body: 'The comparable set should be deliberately mixed. Figure AI is a ceiling marker, not the normal case: its US$39 billion post-money round reflects a uniquely visible investor and deployment narrative. Apptronik, NEURA, and 1X are private Western references for capital intensity and premium AI multiples, but their go-to-market and geopolitical setting differ. Unitree and Agibot are the more painful China checks because they show the risk that low-cost volume leaders capture share and compress pricing. UBTech is the essential public filing anchor because it shows how humanoid revenue mix, gross margin, and losses can look when the company is listed. This mix supports a fair stance, not a precise DCF.'
  claimRefs:
  - CV015
  - CV016
  - CV017
  - CV018
  - CV019
  - CV020
  - CV036
  tableRefs:
  - TV004
- id: exit-readiness-and-diligence-asks
  title: Exit readiness and final diligence asks
  body: Exit readiness remains conditional. A China or Hong Kong IPO path could become viable if LimX can show audited revenue growth, gross margin improvement, safety compliance, and reduced reliance on demonstrations. Strategic exit optionality exists through retail, automotive, industrial automation, and Middle East capital relationships, but those paths need contract evidence. Non-China exits require a legal discount because proposed restrictions on Chinese robotics can shrink buyer universes and channel access. The final diligence package should prioritize proof that customers are paying, robots are reliable, margins can survive low price points, and the financing stack leaves common-equity upside after preferences. Missing any of those items should hold the recommendation at track.
  claimRefs:
  - CV026
  - CV027
  - CV032
  - CV034
  - CV035
  - CV041
  - CV042
  - CV043
  - CV044
