    - China volume leader with low-cost robots and IPO momentum
    - Low-single-digit-billion estimated valuation band
    - Best China share and pricing pressure benchmark
    - Private estimates vary and product mix differs
  - - AgiBot
    - China volume challenger linked to BYD ecosystem
    - Sub-US$1B estimated valuation band in market commentary
    - Shows risk that volume players compress market pricing
    - Valuation and shipment disclosures remain fragmented
  - - UBTech
    - HK-listed public robotics company
    - Filing-based public financials and loss profile
    - Grounds revenue/margin/loss expectations in audited disclosure
    - Older public company with broader product mix
  - - Zhuji Dynamics (LimX Dynamics)
    - Series B growth-stage challenger
    - US$1,000M entry anchor used for scenario work
    - Subject investment entry price and strategic syndicate
    - Revenue, margin, backlog, and preferences undisclosed
