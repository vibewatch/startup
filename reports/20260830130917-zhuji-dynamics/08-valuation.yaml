  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: Signed customer contracts, deposits, backlog, conversion rates, and revenue-recognition policy.
    whyItMatters: These records determine whether the Series B entry is supported by real demand rather than demos.
    diligencePath: Request customer contract pack under NDA and run reference calls with deployment owners.
    relatedQuestionRefs:
    - QV007
    - QV026
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: BOM, manufacturing yield, gross margin bridge, warranty reserve, and service-cost history.
    whyItMatters: Low robot prices can create adoption but destroy margin if hardware economics are weak.
    diligencePath: Review finance model, supplier quotes, factory yields, and field-service records.
    relatedQuestionRefs:
    - QV023
    - QV030
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Current cap table, liquidation preferences, option pool expansion, side letters, and pro-forma ownership.
    whyItMatters: Preference overhang can eliminate venture returns even if the headline valuation is fair.
    diligencePath: Counsel-led review of financing documents and investor-rights agreements.
    relatedQuestionRefs:
    - QV009
  - type: missing-source
    severity: material
    topic: revenue-multiple
    missingEvidence: Comparable forward revenue multiples for LimX and private humanoid peers from primary transaction documents.
    whyItMatters: Without revenue multiples, scenario ranges remain directional and not a precise DCF.
    diligencePath: Request banker materials, investor memos, and audited revenue bridge for peer benchmarking.
    relatedQuestionRefs:
    - QV029
  - type: conflicting-data
    severity: minor
    topic: total-financing
    missingEvidence: Company-confirmed lifetime financing schedule by round, currency, and investor preference.
    whyItMatters: Public profiles vary, so the US$250M financing proxy should be treated as an underwriting assumption.
    diligencePath: Ask company counsel for capitalization history and reconcile with press announcements.
    relatedQuestionRefs:
    - QV008
    - QV030
