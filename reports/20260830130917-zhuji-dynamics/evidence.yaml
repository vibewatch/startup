evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Current board roster, investor rights, founder ownership, voting thresholds, and observer seats.
    whyItMatters: >-
      Governance rights determine control, exit optionality, and whether strategic investors can constrain customer or
      geography choices.
    diligencePath: Request the latest cap table, shareholders agreement, board minutes, and financing documents from company counsel.
    relatedQuestionRefs:
      - QO010
      - QO012
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: debt-and-secondaries
    missingEvidence: Disclosure of any venture debt, working-capital lines, equipment financing, guarantees, or secondary share sales.
    whyItMatters: Debt and secondary transactions change runway, liquidation stack, and insider incentives.
    diligencePath: Ask management and lead investors for a debt schedule, side-letter register, and secondary-transfer history.
    relatedQuestionRefs:
      - QO018
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Current employee count by function, location, and contractor status, reconciled against registry/profile ranges.
    whyItMatters: >-
      Headcount is a scale proxy for manufacturing readiness and burn; conflicting figures make runway and execution
      capacity hard to assess.
    diligencePath: Request payroll snapshot, organization chart, and hiring plan dated within 30 days of diligence close.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customers-and-revenue
    missingEvidence: >-
      Active customer count, named deployments, revenue/run-rate, gross margin, backlog, uptime, and intervention-rate
      data.
    whyItMatters: >-
      The company’s valuation depends on whether product releases convert into repeatable customer economics rather than
      demonstrations.
    diligencePath: >-
      Obtain customer contracts, invoices, delivery logs, service records, and references for the largest pilots or
      production deployments.
    relatedQuestionRefs:
      - QO021
      - QO022
    relatedTableRefs:
      - TO001
      - TO004
  - type: conflicting-data
    severity: minor
    topic: funding-conflict
    missingEvidence: >-
      A company-confirmed reconciliation of cumulative capital raised, investor legal names, and exact post-money
      valuation after Series B.
    whyItMatters: Conflicting public profiles can create metric drift across diligence materials and obscure liquidation preference.
    diligencePath: >-
      Request financing ledger, signed press-release investor list, and waterfall model from the company or lead
      counsel.
    relatedQuestionRefs:
      - QO016
      - QO017
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: diligence-gaps
    missingEvidence: Audited 2026 unit shipments, realized ASP, utilization hours, and repeat orders by buyer segment.
    whyItMatters: These data determine whether the US$2B China market converts into durable revenue rather than pilots or demos.
    diligencePath: >-
      Request signed purchase orders, acceptance certificates, fleet utilization logs, and renewal records from vendors
      and reference buyers.
    relatedQuestionRefs:
      - QM033
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: contradictory-estimates
    missingEvidence: >-
      Publisher-by-publisher reconciliation of whether forecasts count external sales, production, capacity, prototypes,
      or labor-substitution potential.
    whyItMatters: Forecast dispersion can inflate TAM and valuation if incompatible estimates are averaged together.
    diligencePath: >-
      Build a source-methodology bridge using primary analyst notes, disclosed model definitions, and buyer-level
      revenue proof.
    relatedQuestionRefs:
      - QM026
      - QM035
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: humanoid-versus-legged-revenue
    missingEvidence: >-
      Vendor revenue split between full humanoid robots, legged research platforms, software/tooling, and deployment
      services.
    whyItMatters: A clean split is needed to isolate SAM for humanoid deployment versus adjacent developer-platform revenue.
    diligencePath: >-
      Request management revenue cohorts and contract line-item detail; compare against invoice samples and customer
      references.
    relatedQuestionRefs:
      - QM034
    relatedTableRefs:
      - TM001
  - type: private-evidence-only
    severity: material
    topic: installed base
    missingEvidence: >-
      Audited shipped units, active deployed fleets, backlog conversion, and customer cohort retention for LimX and
      private peers.
    whyItMatters: >-
      The key adverse question is whether LimX can move from challenger demos to repeatable deployments against Unitree
      and AgiBot scale.
    diligencePath: >-
      Request management KPI pack with shipped units by model, paying customers, backlog, delivery dates, warranty
      claims, and cancellations.
    relatedQuestionRefs:
      - QP006
      - QP024
      - QP025
    relatedTableRefs:
      - TP001
      - TP004
  - type: missing-source
    severity: material
    topic: realized pricing
    missingEvidence: >-
      Realized ASP, discounts, service attach, warranty terms, and RaaS contract economics across LimX, Unitree, AgiBot,
      UBTECH, and Western peers.
    whyItMatters: Public list pricing can overstate price defensibility or understate total cost of ownership.
    diligencePath: >-
      Collect recent quotes, invoices, channel contracts, warranty schedules, and buyer references for comparable
      configurations.
    relatedQuestionRefs:
      - QP007
      - QP020
      - QP025
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: emerging competitors
    missingEvidence: Full source-backed detail for every regional entrant, including Fourier pricing and Galbot deployment metrics.
    whyItMatters: Long-tail entrants can pressure talent, components, and niches even if they are not current share leaders.
    diligencePath: >-
      Refresh competitor tracker and Chinese-language filings before investment committee, then add row-level updates
      for any entrant with commercial deployments.
    relatedQuestionRefs:
      - QP023
      - QP027
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: Recognized revenue, bookings, ARR, deferred revenue and revenue mix by hardware, software and service line.
    whyItMatters: Revenue quality and repeatability cannot be assessed from list prices or demos.
    diligencePath: Request audited or management monthly revenue schedule and product-level invoice sample.
    relatedQuestionRefs:
      - QI005
      - QI017
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: SKU-level ASP, COGS, gross margin, warranty reserve and service-delivery cost.
    whyItMatters: Low list pricing could be strategic or margin-destructive; public data cannot distinguish.
    diligencePath: Review SKU margin bridge, BOM, supplier quotes, labor allocation and warranty reserve methodology.
    relatedQuestionRefs:
      - QI012
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash balance, restricted cash, monthly burn, runway model and committed use of Series B proceeds.
    whyItMatters: The $200M round size does not reveal how long capital lasts under manufacturing scale-up.
    diligencePath: Obtain bank statements, board budget, monthly cash-flow forecast and variance-to-plan.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: gtm
