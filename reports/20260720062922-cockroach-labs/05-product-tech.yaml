chapter:
  number: 5
  title: Product & Technology
  summary: 'CockroachDB is now a broad transactional platform rather than only a clever distributed-SQL engine: it pairs PostgreSQL compatibility with multi-region locality controls, migration tooling, enterprise trust features, and a growing AI/vector surface. The architecture still looks differentiated where portability, consistency, and geographic control must coexist, but the product is also undeniably complex, and some of the newest capabilities remain better documented by Cockroach than independently validated by customers. The product-tech case is therefore strong, with the main diligence burden shifting from “can this work?” to “which parts are mature enough for the target workload today?”'
sections:
- id: SE001
  title: Product definition and SKU map
  body: |-
    CockroachDB’s product definition is more concrete than “distributed SQL.” Public materials consistently frame it as a transactional system-of-record database for always-on, cloud-native applications that need PostgreSQL familiarity, resilience, and global scale at the same time. That workflow orientation matters because it separates CockroachDB from both pure analytical systems and from document or multi-model platforms that solve different jobs.

    The product surface is also broader than a single engine. Cockroach Labs sells managed cloud, self-hosted enterprise software, migration tooling, and support around the same database core. Basic or serverless-style entry points are there to reduce trial friction, while Standard and Advanced are structured for progressively more demanding production and regulated workloads, procurement paths, and security expectations in enterprise accounts.

    This module map reveals the company’s strategic intent: use familiarity and easy starts to get into the workflow, then expand into higher-value production, compliance, and migration work. The product story is therefore not only about feature count. It is about turning a hard replacement category into a platform decision that can begin small and still scale into a mission-critical control plane.
