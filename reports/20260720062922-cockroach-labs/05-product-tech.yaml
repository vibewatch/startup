- calloutType: strength
  title: The architecture converts complexity into product abstractions
  body: CockroachDB’s real product strength is not just replication; it is the way regions, localities, survival goals, and compatibility are exposed in a form application teams can use without hand-building their own sharding and failover model.
  claimRefs:
  - CE007
  - CE008
  - CE027
  - CE028
