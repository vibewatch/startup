    - Analytics warehouses, search engines, document databases
    - Platform engineering / CTO / CIO
    - Best-fit core market lens for Cockroach Labs.
  - - Broader distributed databases
    - Transactional and some non-transactional distributed data infrastructure
    - Single-node databases and unrelated developer tooling
    - Architecture and infrastructure leadership
    - Useful sanity-check market but broader than company scope.
  - - Cloud database market
    - Managed database services across SQL, NoSQL, and multiple deployment models
    - Pure on-prem legacy support contracts
    - Cloud platform owners and finance sponsors
    - Outer-bound adjacency rather than precise addressable market.
  - - Status-quo PostgreSQL estates
    - Self-managed OLTP, extension-heavy installs, app-side sharding
    - Purpose-built globally consistent distributed SQL features
    - Engineering managers and DBAs
    - Primary do-nothing alternative.
  notes: Defines what is in-scope before using any market-size figure.
