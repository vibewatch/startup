chapter:
  number: 2
  title: Market Analysis
  summary: 'Cockroach Labs plays in a valuable but tightly bounded slice of the database market: distributed SQL for mission-critical transactional systems where resilience, geo-distribution, and PostgreSQL compatibility matter enough to justify migration effort. Public market estimates span a wide range because they use incompatible category boundaries, so the narrow distributed-SQL lens is the best external anchor while SAM and SOM remain unsupported without management data. Adoption depends less on awareness than on concrete pain, executive sponsorship, and trust that the product can handle correctness-sensitive workloads.'
sections:
- id: SM001
  title: Market boundary and category logic
  body: |-
    Cockroach Labs should not be sized against the entire universe of databases. Its product is a distributed SQL database marketed for cloud-native, mission-critical transactional applications that need resilience, multi-region availability, and PostgreSQL familiarity. That means the cleanest category anchor is distributed SQL, with broader cloud-database and distributed-database figures used only as boundary checks.

    The included spend is application-facing transactional data infrastructure: production OLTP clusters, resilience upgrades, cloud database operations, migrations off legacy relational estates, and adjacent compliance-heavy modernization work. Excluded spend includes data warehouses, search engines, pure document stores, and developer tooling categories that do not directly replace a transactional system of record. This boundary matters because a very broad “database TAM” can make the opportunity look gigantic while saying almost nothing about the spend Cockroach Labs can actually win.

    The status-quo alternative is also stronger than in younger software categories. Teams can stay on PostgreSQL, stay on Aurora, use application-level sharding, or select a hyperscaler-native system such as Spanner. The market is therefore not created by awareness alone; it opens when buyers feel enough outage, scale, compliance, or geo-distribution pain to justify migration effort. That framing keeps later valuation work honest: Cockroach Labs is selling into a valuable but highly contested modernization decision, not into unclaimed greenfield demand.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM018
  - CM033
  tableRefs:
  - TM001
  - TM005
  figureRefs: []
- id: SM002
  title: Sizing lenses and where they disagree
  body: |-
    Public sizing evidence spans three nested but non-identical markets. DataIntelo's distributed-SQL estimate is the best narrow fit because it explicitly matches Cockroach Labs' architectural category. Business Research Insights provides a broader distributed-database lens, while Coherent Market Insights captures the much larger cloud-database umbrella. These are useful together precisely because they disagree: the range shows the uncertainty created when category boundaries widen.

    The resulting lesson is that investors should not treat one headline TAM as settled fact. A $26B cloud-database estimate may be directionally helpful for long-run adjacency, but it is not the same as the addressable pool for distributed SQL. Conversely, an estimate below $5B for distributed databases may still miss the specific value premium of globally consistent SQL workloads. Using multiple lenses preserves contradiction rather than laundering it into fake precision.

    This also limits public SAM and SOM work. Without a disclosed customer count, conversion funnel, or region-by-workload mix, an outsider cannot responsibly derive a company-specific serviceable market. The right diligence stance is to preserve the failed sizing path and ask management for segmentation they actually use internally. In other words, market numbers are useful here as boundary conditions, not as a substitute for actual company operating data.
