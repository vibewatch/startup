- id: TM005
  title: Adjacency and substitute map
  columns:
  - option
  - why buyers choose it
  - why it is not the same market
  - implication for Cockroach Labs
  rows:
  - - Self-managed PostgreSQL
    - Familiarity and extension ecosystem
    - Lacks native distributed-SQL posture for multi-region resilience
    - Biggest inertia source and migration starting point.
  - - Amazon Aurora PostgreSQL
    - Managed experience inside AWS
    - Often optimized for one-cloud convenience over cross-cloud portability
    - Competes hardest where buyers want minimal change.
  - - Google Spanner
    - Strong architecture for Google Cloud shops
    - Ties buyers more tightly to hyperscaler and different ecosystem choices
    - Powerful competitor in large strategic deals.
  - - Document or analytics databases
    - May solve adjacent data problems
    - Do not directly replace transactional SQL systems of record
    - Should stay out of core TAM claims.
  notes: Status-quo substitutes matter because most buyers can delay migration by accepting narrower architecture tradeoffs.
