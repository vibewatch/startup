- id: TM006
  title: Sizing contradiction register
  columns:
  - issue
  - evidence
  - why it changes valuation work
  - interim conclusion
  rows:
  - - Category mismatch
    - Cloud database vs distributed SQL vs distributed database estimates diverge sharply
    - Different boundaries can inflate TAM by several multiples
    - Use nested lenses, not one blended estimate.
  - - Methodology opacity
    - Analyst pages summarize results more than methods
    - Hard to verify segment inclusion and deployment assumptions
    - Treat figures as directional, not precise.
  - - Missing public SAM
    - No public workload-fit segmentation from company
    - Cannot isolate capture zone from external data alone
    - Ask management for internal segmentation.
  - - Missing public SOM
    - No customer count or win-rate disclosure
    - Cannot support credible share assumptions
    - Avoid market-share precision in public-only model.
  notes: This register preserves contradictions instead of collapsing them into one headline TAM.
