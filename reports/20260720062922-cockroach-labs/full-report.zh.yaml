  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合：现状、超大规模云厂商与真正的分布式 SQL 同行
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs 并不是在空白市场销售。第一个、也常常是最强的竞争者，就是现状：团队可以继续运行 PostgreSQL，增加副本，并把迁移整体往后推。这一点重要，因为 PostgreSQL
              仍然广受欢迎且可移植。即便 CockroachDB 对全球工作负载来说架构上可能更干净，组织层面采用更重分布式系统的紧迫感也会下降。


              下一层竞争来自超大规模云厂商。Aurora、Spanner 和 AlloyDB 各自提供一条采购捷径：买方可以留在 AWS 或 Google Cloud
              内，复用商业关系，并采用托管服务，而不引入独立数据库厂商。对许多企业账户来说，这种组织便利本身就是功能，甚至早于产品差异进入考虑。


              只有穿过这两层之后，买方才会来到最直接的分布式 SQL 同行集合：YugabyteDB、TiDB，以及部分 CockroachDB 对 Spanner 的决策。PlanetScale、Vitess、Neon 和
              SingleStore 又进一步拓宽决策集合，分别提供更低摩擦的开发者入口、分片 MySQL、serverless Postgres，或交易加分析混合定位。实际结论是，Cockroach Labs
              争夺的不是泛泛的“数据库支出”，而是一类狭窄的、对正确性敏感的工作负载；只有多区域韧性足够痛，迁移才值得。
