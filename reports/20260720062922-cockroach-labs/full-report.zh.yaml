  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格信号指向溢价估值，但公开财务支撑有限
        blocks:
          - type: paragraph
            body: >-
              最具体的估值锚点很直接：Cockroach Labs 上一次一级融资是在 2021 年末，估值 $5 billion；2026 年中二级市场指标暗示更接近 $6.9
              billion。这些价格并非小成就。它们表明，市场仍把 Cockroach 视为严肃的后期基础设施资产，而不是正在褪色的私募轮次。


              问题在于，公开数字到底能支撑什么。最清楚的收入锚点仍来自第三方 2023 年约 $128.3 million 的估算。即便投资者慷慨测试 2025-2026 年 $170-200 million
              的收入区间，隐含收入倍数仍然很高。这意味着当前价格已经假设收入规模、留存或毛利率质量存在有意义的隐藏进展。因此，公开证据支持方向，但精度不足，无法让价格显得保守。


              换句话说，公开市场面对的问题不是 Cockroach
              好不好，而是这家公司是否足够好、足够大、足够高效，能在披露不完整的情况下支撑溢价倍数。这是难得多的问题。因此，投资问题主要是估值纪律，而不是公司识别或简单认知。
