      - number: '5.2'
        title: 核心架构与部署模型
        blocks:
          - type: paragraph
            body: >-
              CockroachDB 的技术身份从架构开始。数据库在任意节点接收 SQL，把这些语句转换成键值操作，再通过分布在集群中的 range 进行协调和复制。数据增长时 range 会拆分，写入通过 Raft
              quorum 流动，本地性元数据加 range 放置让系统在不要求应用自行管理分片的情况下，为韧性和地理位置优化。


              多区域控制不是事后补丁。文档暴露了主区域、表本地性、超级区域、次级区域和生存目标等明确抽象。客户可以用 SQL
              可见的术语在延迟、合规和韧性之间取舍，而不只是看网络拓扑图。集群虚拟化沿着同一方向推进，用系统集群和虚拟集群分离控制平面与数据平面；这对物理集群复制、资源隔离和更可治理的运营模型很重要。


              这一层最难由客户自己重建。PostgreSQL 熟悉度相对容易理解；真正困难的是在一个产品里把这种熟悉度与多区域拓扑、一致复制、可移植性、低接触运营和更新的 AI-ready
              索引结合起来。底层架构的差异化仍在这里。
