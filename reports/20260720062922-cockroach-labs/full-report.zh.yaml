      - number: '6.2'
        title: 最强客户背书显示深度生产采用，而非轻量试点
        blocks:
          - type: paragraph
            body: >-
              具名案例研究异常具体。DoorDash 将 CockroachDB 作为内部服务运行，峰值查询约每秒 1.2 million 次、超过 300 个集群，数据量约 1.9 petabytes。Netflix
              运营超过 380 个集群，并把使用扩展到设备管理、工作流编排和游戏。Route 支撑超过 1 billion 个订单，Booking.com、Form3、Shipt、Riskified 和 Hard Rock
              都描述的是业务关键交易流，而不是边缘项目。


              这很重要，因为它降低了基础设施软件中常见的尽调担忧：纸面上好看的背书，其实只是小试点或非关键影子部署。这里的公开故事指向事实源系统、支付引擎、面向客户的订单流和内部数据库平台。这些工作负载更难赢下、更难治理；一旦成功运行，也更难被替换。


              反复出现的主题是，CockroachDB
              常常从一个困难架构问题切入——全球交易、监管本地性或传统数据库瓶颈——随后逐步变得更核心。多则案例还显示，初始决策之后部署继续扩张，可能是更多集群、更多区域、更多节点，或更广泛的内部自助服务。因此，这些背书不仅表明采用，也表明在高要求环境中采用后的运营信任。客户证据因此有真实分量。
