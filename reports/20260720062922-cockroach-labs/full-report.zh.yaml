  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 所有权信号
      - 目标细分
      - 差异化
      - 局限
    rows:
      - - PostgreSQL
        - 现状方案 / 开源
        - 社区主导的 OSS 生态
        - 通用 OLTP 和广泛开发者使用场景
        - 锁定效应最低，工具熟悉度最广
        - 核心项目没有原生双活多区域写入路径
      - - Amazon Aurora
        - 既有托管关系型服务
        - AWS 原生托管服务
        - 需要托管 PostgreSQL / MySQL 兼容性的 AWS 客户
        - 采购便利、无服务器选项、副本、Global Database
        - 仅 AWS 覆盖，多段式定价
      - - Google Spanner
        - 全球一致性既有方案
        - Google 托管分布式数据库
        - 大型 GCP 优先的全球应用
        - 全球规模强一致性，加上托管运维
        - 锁定效应高，基于副本的定价复杂
      - - AlloyDB
        - 托管 PostgreSQL 性能升级路径
        - Google Cloud 托管产品
        - 希望在 GCP 上获得更高性能和 AI 功能的 PostgreSQL 用户
        - 100% PostgreSQL 兼容定位，配合读取池和 AI 叙事
        - 仍绑定 Google 环境和节点式定价
      - - PlanetScale / Vitess
        - 分片 MySQL / 低摩擦云数据库
        - 构建在 Vitess 之上的商业平台
        - 优化开发速度或 MySQL 横向扩展的团队
        - 低成本进入、HA 集群、BYOC 选项、经过验证的分片控制平面
        - MySQL / Vitess 血统限制与 PostgreSQL 的直接重叠
      - - Neon
        - 无服务器 Postgres
        - 商业化托管 Postgres 平台
        - 需要快速启动、由开发者主导的应用和智能体
        - 缩至零、分支、计算与存储分离
        - 不太主打全球双活事务语义
      - - YugabyteDB
        - 直接分布式 PostgreSQL 对手
        - 开源加商业支持打法
        - 以可移植性为目标的关键任务云原生 OLTP
        - 多主分布式 PostgreSQL 和开源反锁定叙事
        - 叙事高度相似，带来正面替换风险
      - - TiDB
        - 带 HTAP 角度的分布式 SQL
        - PingCAP 托管或自托管
        - 同时需要事务和实时分析的团队
        - MySQL 兼容、计算与存储解耦、HTAP 框架
        - PostgreSQL 迁移叙事较弱
      - - SingleStore
        - 邻近实时数据平台
        - 托管云 DBaaS
        - 融合 SQL、JSON、向量和分析的实时应用
        - 事务与分析混合广度，加上强性能主张
        - 不是每类工作负载都能干净替代 PostgreSQL 记录系统
      - - MongoDB Atlas
        - 邻近现代应用替代方案
        - 托管文档数据库平台
        - 偏好模式灵活性和现代应用工具的构建者
        - 强现代应用和 AI 品牌
        - 文档模型不是关系型数据库的即插即用替代品
    notes: 画像聚焦公开所有权、平台姿态和目标细分，不试图为每个对手还原精确的私募融资情况。
    enumerationScope:
