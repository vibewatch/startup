  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Cockroach Labs 把 PostgreSQL 兼容的分布式 SQL 核心，与托管云交付、合规工具和宕机敏感行业的客户证明连在一起；老股市场定价是投资人最主要的未解信号。
    data:
      nodes:
        - id: product
          label: 分布式 SQL 核心
          detail: 面向韧性和水平扩展打造的 PostgreSQL 兼容事务型数据库。
          tone: positive
        - id: cloud
          label: 托管云 + 企业版
          detail: Basic、Standard、Advanced、BYOC、自托管企业版、支持和迁移服务。
          tone: positive
        - id: compliance
          label: 安全与合规层
          detail: 合规基础覆盖 SOC 2、ISO、PCI、HIPAA 就绪，并配有 CMEK 和身份控制。
          tone: positive
        - id: customers
          label: 关键任务客户
          detail: Booking.com、SumUp、Form3、Netflix 等公司把平台用于始终在线工作负载。
          tone: positive
        - id: secondary
          label: 老股交易价格发现
          detail: Nasdaq Private Market 和 Notice 显示私募市场交易仍在进行，但公司没有公开新的一级融资轮。
          tone: warning
        - id: adverse
          label: 安全公告与事故
          detail: 公开漏洞公告和事故记录显示公司透明，但也证实执行风险。
          tone: warning
      edges:
        - from: product
          to: cloud
          label: 商业化依托
        - from: cloud
          to: compliance
          label: 由其扩展
        - from: cloud
          to: customers
          label: 被采用方为
        - from: customers
          to: secondary
          label: 支撑投资者兴趣
        - from: adverse
          to: customers
          label: 不得削弱信任
        - from: secondary
          to: adverse
          label: 受到折价因素影响
