  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与 SKU 地图
        blocks:
          - type: paragraph
            body: >-
              CockroachDB 的产品定义比“分布式 SQL”更具体。公开材料始终把它描述为面向永久在线、云原生应用的事务记录源数据库；这些应用同时需要 PostgreSQL
              熟悉度、韧性和全球规模。这种工作流取向很重要，因为它把 CockroachDB 同纯分析系统，以及解决不同任务的文档或多模型平台区分开来。


              产品面也比单一引擎更宽。Cockroach Labs 围绕同一个数据库核心，销售托管云、自托管企业软件、迁移工具和支持。Basic 或类似 serverless 的入口用于降低试用摩擦；Standard 和
              Advanced 则面向企业账户中要求逐步提高的生产和受监管工作负载、采购路径与安全预期。


              这张模块地图揭示了公司的战略意图：用熟悉度和低门槛起步进入工作流，再扩张到更高价值的生产、合规和迁移工作。因此，产品故事不只是功能数量，而是把一个困难的替换品类，转成一项可以从小处开始、仍能扩展成关键任务控制平面的平台决策。
