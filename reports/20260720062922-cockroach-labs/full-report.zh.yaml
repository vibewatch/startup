      - number: '8.3'
        title: 正确姿态：认可公司质量，谨慎看待入场价
        blocks:
          - type: paragraph
            body: >-
              估值争论最终落在几个看不见的变量上。如果 Cockroach 收入已经远高于 $200
              million，净留存强，支持成本可控，并且证明基础设施利润率可以长期守住，私有估值区间上沿就说得通。否则，当前老股价格已经走在公开证据能支撑的位置之前。


              因此，建议应是有条件的，而不是二元判断。这个业务看起来具备后期基础设施公司应有的客户质量和技术相关性。但价格已经不再明显早期，也不宽容。当前价格预设了多个尽调问题都有好答案，而这些答案还没有公开披露。纪律严明的投资者仍然可以喜欢这个局面，但在把当前入场点称为有吸引力之前，应坚持看到更强证据。


              因此，最佳投资姿态是保持接触，紧盯当前指标，不要把对产品的欣赏误当成当前估值有吸引力的证明。Cockroach Labs 看起来可投，但还不像便宜。这个区别正是纪律型投资者在现阶段做建议时应遵循的边界。
