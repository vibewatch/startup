        - 中
        - 外部无法量化工具是否实质改变成交率
        - 按迁移路径和部署目标索取管线转化数据
    notes: 风险清单关注的是护城河能否经受真实买方行为检验，而不是单看 CockroachDB 技术上是否足够亮眼。
