  - id: TP003
    title: 定价 / 打包比较
    columns:
      - 竞争对手
      - 入门模式
      - 扩展模式
      - 合同 / 隐性成本信号
      - 给 Cockroach Labs 的启示
    rows:
      - - PostgreSQL
        - 免费 OSS 软件
        - 基础设施 + 人力
        - HA 和工具需另行拼装
        - 仅靠成本最难撬动的现状方案
      - - Aurora
        - 按需或无服务器 ACU
        - 实例 + 存储 + I/O + 副本 + Global DB 成本
        - 特定区域承诺和复制写入 I/O
        - 买方更看重 AWS 便利性而非可移植性时胜出
      - - Spanner
        - 处理单元 / 节点
        - 计算 + 存储 + 备份 + 复制 + 带宽
        - 副本数量和最低计费窗口很重要
        - 强大但企业形态明显的全球扩展选项
      - - AlloyDB
        - 预配置托管集群
        - vCPU + 内存 + 存储 + 备份 + 网络
        - HA 使用两个节点；CUD 可改善经济性
        - 面向已经在 GCP 上的严肃 PostgreSQL 工作负载
      - - PlanetScale
        - Postgres $5/mo 起，或低成本 HA
        - 按资源月度定价，加企业附加项
        - BYOC 将基础设施成本转入买方账户
        - 低成本截流开发者试点
      - - Neon
        - 免费层和付费 CU-hour 用量
        - 按用量计费的计算 + 存储 + 历史存储
        - 自动扩缩和分支会改变实际成本形态
        - 让无服务器 Postgres 试点非常容易
      - - Yugabyte / TiDB
        - 免费 OSS 加托管云产品
        - 随集群规模或托管服务增长
        - 商业支持选择决定真实成本
        - 不靠超大规模云厂商锁定，直接打可移植性
      - - SingleStore
        - 按需用量
        - 积分 + 存储 + 可选 Flow CDC 费用
        - 高摄取量用例会迅速推高成本
        - 实时 AI / 分析覆盖面重要时参与竞争
    notes: 定价行把供应商定价计算器简化成最影响买方行为和获客摩擦的计费原语。
    enumerationScope:
