  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础 logo 面广，但集中在关键任务用例
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs 并不缺具名客户证明。公开客户页面覆盖金融服务、零售、软件、媒体、游戏、制造和博彩；更早的官方披露在 2021 年就已经指向超过 200
              个客户和数万个已部署集群。这个组合很重要，因为它同时说明了广度和时间长度：这不是一个仍在等待第一批严肃背书的产品。


              但更重要的模式不是 logo 数量，而是工作负载类型。在可见客户名单中，CockroachDB 反复用于订单管理、支付、欺诈筛查、设备控制平面、游戏元数据、发货跟踪和 sportsbook
              账本。这些都是运营系统，停机、错误写入或区域故障会立刻伤害收入或客户体验。


              这种集中度有两面性。它强有力地证明，CockroachDB
              找到了有真实痛点和真实预算的买方；也说明产品最适合技术要求高、愿意为了韧性、一致性和拓扑控制承受分布式数据库复杂度的客户。换句话说，这份客户名单更像企业基础设施客户账本，而不是轻量、广谱的 SMB
              工具基础。这个模式有利于 ACV 和留存，但不那么明显支持大众市场规模或无摩擦自助广度。
