      - number: '3.3'
        title: 定价、锁定与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              定价模型说明，竞争危险不止来自一个方向。Aurora、Spanner 和 AlloyDB
              大多通过实例、节点、副本、存储和网络复制等企业式基础设施构件变现。这适合稳态生产工作负载和企业采购习惯，但也会产生多行项目账单和依赖拓扑的成本。相比之下，Neon 和 PlanetScale
              用免费或低成本起点与按量扩张，让入门更便宜、更适合开发者。SingleStore 和部分 TiDB 产品介于两端之间，把托管服务经济性与对工作负载敏感的用量或云打包混在一起。


              这些定价差异强化了锁定格局。PostgreSQL、Vitess、Yugabyte 和 TiDB 等开源或开放生态选项，可以缓解买方对不可逆平台依赖的焦虑。Aurora 和 Google
              技术栈则用其中一部分自由，换取采购便利和相邻云集成。PlanetScale 和 Neon 的强项并不是完美替代 CockroachDB；而是能在买方得出“必须要 Cockroach
              级分布语义”之前，先截获工作负载。


              因此，护城河是有条件的，不是绝对的。Cockroach Labs 并不独占分布式数据库理念、AI 叙事或 PostgreSQL
              熟悉度。它的护城河来自证明：对一部分关键任务应用来说，一个云无关、正确性优先、多区域的 PostgreSQL
              系统，明显优于留在现状或走打包的超大规模云厂商路线。这可以很耐久，但前提是迁移工具、客户证据和销售聚焦能让公司领先 Yugabyte 等直接同行，同时守住 Neon 和 PlanetScale
              提供的更便宜试点体验。
