      - number: '3.2'
        title: 能力重叠：Cockroach 仍突出的地方与对手追赶的地方
        blocks:
          - type: paragraph
            body: >-
              能力重叠真实存在，但并不均匀。CockroachDB 最清楚的主张，仍是把 PostgreSQL 兼容性、分布式 ACID 行为、主动 -
              主动多区域设计，以及跨云或自托管部署自由组合在一起。这套组合仍相对少见，尤其是与标准 PostgreSQL 和 Aurora 相比；后两者更容易采用，但原生分布式能力更弱。


              问题在于，卖点中的重要部分已经不再独一无二。AlloyDB 打着 PostgreSQL 标签，同时在 Google Cloud 上加入托管性能和 AI 功能。Yugabyte 用开源和多云语言销售分布式
              PostgreSQL，叙事非常接近 Cockroach 的核心故事。TiDB 销售强一致性加水平扩展，但走的是 MySQL 兼容口径。PlanetScale、Vitess 和 Neon
              并不在每个正确性或多区域维度上匹配 Cockroach，但它们能靠更低运营摩擦和起步成本赢下早期项目或单团队决策。


              因此，仅靠功能广度不是护城河。买方越来越能组出一张短名单，每个厂商各赢一个取舍切片：可移植性、超大规模云厂商便利、serverless
              开发者速度、避免开源锁定，或多模型数据处理。当工作负载需要全球事务正确性且不愿接受单云锁定时，Cockroach Labs 仍显得最强；但公司现在必须证明这种需求，而不能假设需求自然存在。
