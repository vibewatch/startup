  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最大近期风险是运营正确性和版本纪律
        blocks:
          - type: paragraph
            body: >-
              公开公告记录让一点无法忽视：CockroachDB 的核心挑战不是证明架构在原则上可行，而是在众多版本、工作负载和部署模式中，让一个非常雄心勃勃的分布式数据库保持安全。仅 2026
              年公告就覆盖权限提升、部分索引损坏、实时数据删除，以及静默导入或备份失败场景。即便许多 bug 罕见且很快修复，它们也直接击中客户在记录源系统中最在意的信任假设。


              运营模型会放大这种风险。Cockroach Labs 自己的生产和升级文档强调拓扑纪律、复制健康、备份验证、热点感知 schema
              设计、负载均衡和发布定版意识。这是成熟文档，但也说明韧性取决于客户执行。数据库拿掉了一部分应用层负担，同时在运营工程中创造了另一种负担。


              这让公司暴露在一个经典基础设施挑战下：如果正确性缺陷或升级错误击中旗舰账户，损害会很快从支持负载传导到续约风险和品牌声誉。因此，卓越运营对 Cockroach Labs
              不是可有可无，而就是产品本身。主要风险不是某个灾难性未知，而是许多小运营故障在一个客户预期完全可信的数据库中不断叠加。
