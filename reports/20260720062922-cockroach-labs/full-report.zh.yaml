      - 选项
      - 买方为什么选择
      - 为什么不是同一个市场
      - 给 Cockroach Labs 的启示
    rows:
      - - 自托管 PostgreSQL
        - 使用熟悉，扩展生态成熟
        - 缺少多区域韧性所需的原生分布式 SQL 架构
        - 最大惯性来源，也是迁移起点。
      - - Amazon Aurora PostgreSQL
        - AWS 内托管体验
        - 往往优先优化单云便利性，而不是跨云可移植性
        - 买方希望尽量少改时，它最难打。
      - - Google Spanner
        - Google Cloud 客户可获得强架构
        - 把买方更紧地绑在超大规模云厂商和另一套生态选择上
        - 大型战略交易里的强劲对手。
      - - 文档或分析型数据库
        - 可能解决邻近数据问题
        - 不能直接替代作为记录系统的事务型 SQL
        - 不应纳入核心总可用市场（TAM）主张。
    notes: 现状替代方案很关键，因为多数买方可以接受更窄架构取舍，从而推迟迁移。
    claimRefs:
