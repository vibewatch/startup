      - number: '1.3'
        title: 领导层集中度与治理可见度
        blocks:
          - type: paragraph
            body: >-
              领导层可见度异常集中在 Spencer Kimball 身上。他仍是 2021 年融资材料和 2026 年进展叙事绑定的公开高管，这有利于叙事一致，但也带来关键人物集中度。公司在 2026 年进展更新中任命
              Sailesh Munagala
              为首席财务官，释放了补强管理梯队的信号；这是可访问来源中最显眼的公开高管新增。除此之外，公开治理披露很薄。现成的公司资料和第三方资料并未清楚列出当前董事会名单、保护性条款或详细股权结构表。这不等于治理薄弱，但意味着外部投资者必须从融资财团而不是直接治理文件中推断很多信息。实际含义是，Cockroach
              Labs
              现在像一家创始人主导的后期基础设施公司，拥有可信机构背书，但董事会构成和投资人控制的公开透明度有限。作为私有独角兽可以接受，但仍是尽调缺口，因为当公司开始在二级市场活跃交易，并把自己定位为长期企业平台时，治理强度变得更重要。
