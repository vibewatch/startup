      - number: '8.2'
        title: 公开可比公司支持质量溢价，但不支持无上限溢价
        blocks:
          - type: paragraph
            body: >-
              上市软件和数据库可比公司给出一个不舒服的现实校准。MongoDB 和 Confluent 的收入倍数大约在 10 倍，Snowflake 接近 20 倍，Elastic
              明显更低。放在这个背景下，即使用乐观收入假设去测，Cockroach 隐含的老股交易倍数也偏贵。若当前价格要落入类似 Snowflake 的上市高溢价区间，Cockroach
              的收入必须远高于最近一次公开锚点；若要落入类似 MongoDB 的区间，收入还得大幅更高。


              这不说明估值不理性。Cockroach
              有少见的强客户验证、扎实的技术深度，也有一个围绕韧性、可移植性和全球分布式事务工作负载展开的品类叙事。这些特质配得上高于平均基础设施软件的溢价，也大概率高于较弱数据库资产。优质资产和容易下手的价格是两回事；本章的结论是，公司更明显属于前者，而不是后者。


              但质量再高，也不能取消估值纪律。公司还背负运营复杂度、支持强度和披露不透明，这些都不支持支付无限稀缺性溢价。合理结论是，Cockroach
              值得一定溢价，但当前定价似乎已经吃掉其中很大一部分。投资者应假设，公司需要用更强的私有指标挣回估值，而不是仅靠产品质量让人赞叹。
