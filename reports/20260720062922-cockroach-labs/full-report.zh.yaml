  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类逻辑
        blocks:
          - type: paragraph
            body: >-
              不能把 Cockroach Labs 放进整个数据库宇宙来测算。它的产品是分布式 SQL 数据库，面向云原生、关键任务事务型应用，需求是韧性、多区域可用性和 PostgreSQL
              熟悉度。因此，最干净的品类锚点是分布式 SQL；更宽的云数据库和分布式数据库数字只能作为边界检查。


              应纳入的支出，是面向应用的事务型数据基础设施：生产 OLTP
              集群、韧性升级、云数据库运营、从传统关系型系统迁移，以及相邻的重合规现代化工作。排除项包括数据仓库、搜索引擎、纯文档存储，以及不直接替换事务记录源系统的开发者工具品类。这个边界很重要，因为一个很宽的“数据库
              TAM”会让机会显得巨大，却几乎无法说明 Cockroach Labs 实际能赢下多少支出。


              现状替代方案也比年轻软件品类更强。团队可以留在 PostgreSQL，留在 Aurora，用应用层分片，或选择 Spanner
              这样的超大规模云厂商原生系统。因此，市场不是仅靠认知就能创造出来；只有当买方感受到足够的宕机、规模、合规或地理分布痛点，愿意承担迁移成本时，市场才会打开。这个框架能让后续估值更诚实：Cockroach Labs
              卖的是一个有价值但竞争高度激烈的现代化决策，而不是无人认领的绿地需求。
