  - id: TM006
    title: 市场规模测算矛盾登记表
    columns:
      - 问题
      - 证据
      - 为什么会改变估值工作
      - 暂定结论
    rows:
      - - 品类口径不一致
        - 云数据库、分布式 SQL、分布式数据库的估算差异很大
        - 边界不同，总可用市场（TAM）可能被放大数倍
        - 采用嵌套口径，不用单一混合估算。
      - - 方法论不透明
        - 分析机构页面更多总结结果，而非方法
        - 难以核验纳入哪些细分市场和部署假设
        - 将数字视为方向性参考，不视为精确值。
      - - 缺少公开可服务市场（SAM）
        - 公司未公开按工作负载适配度划分的细分
        - 仅靠外部数据无法隔离可捕获区域
        - 向管理层索取内部细分。
      - - 缺少公开可获取市场（SOM）
        - 未披露客户数或赢率
        - 无法支撑可信的份额假设
        - 公开信息模型不应做精确市场份额假设。
    notes: 本登记表保留矛盾，不把它们压成一个标题式总可用市场（TAM）。
