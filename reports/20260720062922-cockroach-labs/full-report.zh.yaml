        - 工作负载增长或全球化后扩张
        - 跨区域流量和被监控数据可能让买方意外
        - 落地后产生扩张收入
      - - Advanced 节点
        - 按节点计费的计算和存储
        - 企业架构规划和区域设计
        - AWS IOPS 和安全附加项增加复杂度
        - ACV 更高，商业动作也更定制
      - - 企业支持
        - 带云支持附加费的订阅层
        - 运营信任和更快响应预期
        - 服务强度可能随云消费增长
