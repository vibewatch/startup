chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品边界与当前位置
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs
              将自己定位为一家基础设施公司，解决的是一个狭窄但很痛的问题：事务数据库如何在节点、可用区甚至区域故障中仍保持在线，又不逼应用团队手工分片，或围绕脆弱的故障切换模式重做设计。可访问公开资料一致显示，公司位于纽约、成立于
              2015 年；官方产品界面强调的是兼容 PostgreSQL、云原生的分布式 SQL 数据库，而不是专有开发者体验。产品栈已经不再是单一产品。2026 年，公司销售全托管 CockroachDB
              Cloud、自托管 Enterprise、迁移工具和支持，并通过 Basic、Standard、Advanced 云层级变现。分层很关键，因为它说明 Cockroach Labs
              试图用同一平台同时吃下自下而上的试用和受监管生产工作负载。公开信任与安全材料强化了同一条 GTM 信息：韧性、合规和操作简化。因此，最强身份信号不是原始规模，而是公司坚持把事务正确性、多区域韧性和
              PostgreSQL 熟悉度放进同一个现代应用记录源产品。
