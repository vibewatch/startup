      - number: '4.2'
        title: 公开单位经济信号强在定价机制，而非效率披露
        blocks:
          - type: paragraph
            body: >-
              最好的公开财务证据是机制性的，而非完整的。Cockroach Labs 清楚解释 Standard 和 Advanced 客户如何计费、40 percent
              容量缓冲是什么样、跨区域定价何时适用，以及哪些扩张杠杆位于基础计算之外。这很重要，因为它告诉投资者，初始采用之后收入可以从哪里扩张：备份留存、watched-data
              CDC、跨区域传输、额外副本和专用企业支持，都可以叠加在集群本身之上。


              但同样的公开清晰度，也揭示了外部人很难承销单位经济的原因。Standard 按预留容量而非实际用量计费，这有利于收入可预测性，但也可能带来客户闲置或优化压力。Advanced
              更加定制化，定价会受区域、云服务商、安全要求，有时还受 IOPS 影响。这些项目可能在成熟账户里产生有吸引力的净扩张，但也让毛利率对基础设施组合和多区域流量更敏感。


              可见的 GTM 动作进一步放大了这种模糊性。MOLT、迁移服务和顾问式支持帮助 Cockroach 拿下困难的替换项目，但也暗示未单独披露的获客和实施成本。因此，公开证据支持 Cockroach
