companyProfile:
  summary: >-
    Cockroach Labs 是一家总部位于纽约的基础设施公司，成立于 2015 年，围绕 CockroachDB 打造业务。CockroachDB 是兼容 PostgreSQL 的分布式 SQL
    数据库，以全托管云服务和企业软件销售。公开证据显示，公司在支付、订单管理、欺诈、游戏和内部数据库平台工作负载中拿到了罕见强的客户证明，2026
    年二级市场兴趣仍在。核心尽调张力在于：公司质量看起来真实，但当前财务披露仍过于稀疏，难以高置信度承销估值。
