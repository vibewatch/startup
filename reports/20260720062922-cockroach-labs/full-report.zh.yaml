      - number: '1.2'
        title: 融资历程、私募市场信号与规模标记
        blocks:
          - type: paragraph
            body: >-
              最后一轮一级融资仍是 2021 年 12 月 Series F，当时 Cockroach Labs 融资 $278 million、估值 $5 billion，并称累计融资已达 $633
              million。按成长型软件公司的标准，这一轮已经偏旧，但它仍是最干净的官方估值锚点，因为信息直接来自公司，并点名了由 Greenoaks
              领投的一线投资人阵容。此后变化的不是新一级融资，而是更可见的二级市场。Nasdaq Private Market 和 Notice 都显示，2026 年中股价位于高个位数区间；PM Insights
              则披露，2026 年 6 月价格相较 2021 年一轮有溢价，暗示企业标记远高于官方 $5 billion
              头条估值。这些信号确认了流动性和投资人兴趣，但没有解决核心尽调问题：公开收入证据仍然很薄。GetLatka 的 2023 年 ARR 数字为 $128.3 million，2025 年员工数估计约 715
              人，说明公司已有有意义的规模；但公司 2026
              年进展公告仍回避硬财务披露。由此得到的图景是：公司规模已足够重要，显然仍是私有公司，二级市场价格也可能高于最后一轮一级融资；但透明度仍不足，承销方不能把这些标记等同于一轮新定价融资。
