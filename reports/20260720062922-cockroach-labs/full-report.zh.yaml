        - 高
        - 现状方案和托管 Postgres 选项让组织变化维持低位
        - 向管理层索取按来源数据库拆分的具体替换数据
      - - 云中立分布能力具备差异化
        - Spanner、AlloyDB Omni、Yugabyte 和 BYOC 产品会在许多账户中缩小这一差距
        - 高
        - 多个对手现在公开主打可移植性或混合部署叙事
        - 检验买方是否真的需要跨云写入，还是只需要云采购灵活性
      - - 分布式 SQL 构建难度高
        - Yugabyte 和 TiDB 已提供可信的分布式替代方案，Vitess / PlanetScale 也能更早解决许多扩展问题
        - 高
        - 概念独特性已经被削弱
        - 要求提供对 Yugabyte、TiDB、PlanetScale 和 Aurora 的赢单 / 输单明细
      - - AI 时代让数据库重新相关，需求面会变宽
        - AlloyDB、Yugabyte、TiDB、SingleStore 都在讲 AI 和向量能力
        - 中
        - 公开话术显示，AI 定位已是全品类叙事
        - 把真实客户用量和营销叙事拆开看
      - - 企业级证明应能守住定价
