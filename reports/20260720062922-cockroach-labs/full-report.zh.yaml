      - number: '7.3'
        title: 商业风险来自选择性适配、支持强度和有限公开可见度
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs 面临的风险看起来不是简单的“没人需要这个”。更大的商业问题是，真正有吸引力的买方池有多宽。PostgreSQL 仍然免费且极其熟悉，Aurora 和 Spanner
              对接受云锁定的买方来说，运营上可能更简单。这意味着 Cockroach 往往在工作负载特别苛刻时赢单——全球交易、多区域生存能力或合规敏感的可移植性——但在主流关系型机会中可能遇到更多摩擦。


              客户故事显示，许多胜利由迁移驱动且高度依赖支持。这可以形成耐久的记录源部署和强
              ACV，但也会拉长销售周期、抬高服务成本。围绕隐藏实施成本的独立批评，也指向同一方向。如果扩张经济性强，这笔交易仍然成立；公开来源只是没有披露足够信息来证明今天已经成立。


              这种不透明很重要。没有新的留存、集中度、毛利率或现金跑道披露，投资者能看见风险地图的轮廓，却看不见各项权重。正确姿态是选择性乐观，同时硬尽调客户集中度、支持强度和发布相关事故历史。如果这些隐藏指标强，许多可见风险看起来可管理；如果它们弱，同样的可见风险会很快威胁投资逻辑。
