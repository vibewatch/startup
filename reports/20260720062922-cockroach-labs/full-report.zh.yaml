  - id: FP001
    title: 竞争定位图
    type: quadrant
    layout: standard
    summary: 基于证据支持的序位判断，把主要替代方案放在「部署自由度」与「捆绑式运营简便性」两条轴上。
    data:
      xAxis:
        label: 部署自由度 / 低锁定
        low: 捆绑 / 单一云
        high: 可迁移 / 开放
      yAxis:
        label: 采购时的运营简便性
        low: 需要更多组装或迁移工作
        high: 托管 / 易采购
      points:
        - label: PostgreSQL
          x: 0.95
          'y': 0.35
          detail: 可迁移且熟悉，但团队需要自己拼出更多高可用和扩展工具。
          tone: neutral
        - label: Aurora
          x: 0.15
          'y': 0.85
          detail: AWS 买家上手很容易，但形态强绑定 AWS。
          tone: warning
        - label: Spanner
          x: 0.1
          'y': 0.7
          detail: 托管式全球扩展能力强，但高度依赖 Google。
          tone: warning
        - label: AlloyDB
          x: 0.2
          'y': 0.75
          detail: Google Cloud 上的托管 PostgreSQL 路径。
          tone: neutral
        - label: CockroachDB
          x: 0.8
          'y': 0.55
          detail: 比超大规模云厂商更可迁移，但采用仍需要真正决定迁移。
          tone: positive
        - label: YugabyteDB
          x: 0.85
          'y': 0.5
          detail: 可迁移的分布式 PostgreSQL，与 Cockroach 高度重叠。
          tone: warning
        - label: Neon
          x: 0.65
          'y': 0.9
          detail: 无服务器 Postgres 入口摩擦极低。
          tone: positive
        - label: PlanetScale
          x: 0.55
          'y': 0.9
          detail: 带 BYOC 的低摩擦托管数据库，开发者体验强。
          tone: positive
        - label: TiDB / SingleStore
          x: 0.65
          'y': 0.6
          detail: 覆盖面较广的现代数据平台，兼容性取舍不同。
          tone: neutral
    approximationNotes: 轴值是根据公开产品、定价和部署描述得出的序位放置，不是公司披露的基准测试分数。
