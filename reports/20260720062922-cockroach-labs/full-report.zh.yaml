      - number: '2.3'
        title: 买方地图、采用驱动与门槛约束
        blocks:
          - type: paragraph
            body: >-
              CockroachDB 的经济买方很少是单个开发者。能为这个产品证明合理性的数据库改造，通常涉及平台团队、数据库专家、安全 /
              合规负责人，以及愿意用迁移投入换取更低宕机风险或更好地理扩展能力的高管赞助人。日常用户是工程师，但付款方往往是对韧性、云架构或受监管上线计划负责的领导者。


              公开证据中的采用触发点很一致：多区域增长、无法容忍停机、摆脱脆弱分片的迁移需求，以及对合规或本地性控制的需求。PostgreSQL
              兼容性有帮助，因为相比全新数据库模型，它降低了组织切换成本。客户案例反复说明，第一个工作负载通常是很痛的点——支付流、预订路径、欺诈控制服务或其他对延迟敏感的系统——之后才进入更广泛的标准化。


              约束同样重要。迁移成本高，分布式系统中的运营行为变化并不简单，任何正确性公告或公开事故都可能拖慢企业信心。竞争也压缩了紧迫感：Aurora、Spanner、TiDB、YugabyteDB、Neon 和
              PlanetScale 都给买方提供了推迟或重塑问题的办法。这让市场有价值，但并不无摩擦。因此，采用路径不像一次标准软件升级，更像一个董事会可见的可靠性项目，只有痛点足够具体时才拿得到预算。
