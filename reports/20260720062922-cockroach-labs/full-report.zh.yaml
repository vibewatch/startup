      - number: '1.4'
        title: 客户证据、韧性可信度与反向信号
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs 最强的非财务证据，是具名客户集合的质量。Booking.com 将 CockroachDB 用在一个约 20 TB、覆盖多个欧洲区域的订单平台；SumUp 称它迁移了服务超过 4
              million 商户的核心支付系统；Form3 在 AWS、GCP、Azure 之上运行多云支付骨干；Netflix 报告拥有超过 380 个 CockroachDB 集群。这些不是摆门面的
              logo。它们是支付、旅行、媒体里的高可用工作负载，正确性和容灾能力真正重要。这些客户证据支撑公司 2026 年围绕 AI 规模韧性和永久在线运营的定位。与此同时，反向记录并非空白。Cockroach Labs
              公开发布技术公告，2026
              年清单包括权限提升问题、部分索引损坏、实时数据删除边界情况和备份完整性问题。状态页也显示公司愿意公开暴露云事故。合并来看，公司有真实企业证据和异常强的韧性资质，但这些优势与复杂分布式数据库的普通现实并存：产品面很宽，bug
              会发生，信任既靠架构，也靠披露纪律。
