  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 展示高要求企业客户如何从既有数据库痛点出发，走向账户内部扩张的常见路径。
    data:
      nodes:
        - label: 旧数据库痛点显现
          detail: 宕机、单写入瓶颈、分片痛点或监管本地化约束，让既有数据库不再够用。
        - label: 技术评估
          detail: 客户拿 CockroachDB 与 Aurora、Spanner、Cassandra 或自管 PostgreSQL 路线对比测试。
        - label: 生产落点
          detail: 第一个严肃生产部署通常落在支付系统、订单平台、欺诈引擎、博彩账本或内部控制平面服务。
        - label: 拓扑与支持扩张
          detail: 工作负载跑稳后，区域、节点、托管服务使用和客户团队投入都会扩大。
        - label: 内生切换成本
          detail: 数据库成为核心后，迁移难度、运营耦合和业务关键性都会抬高续约概率。
    approximationNotes: 这是分析师基于公开案例研究中反复出现的模式归纳出的客户旅程，不是 Cockroach Labs 披露的生命周期漏斗。
