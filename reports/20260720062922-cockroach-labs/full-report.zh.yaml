  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 变现架构横跨开发者漏斗、生产集群与高接触服务
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs 卖的不是一个干净的 SKU。它的变现栈有意横跨低摩擦开发者漏斗、预置云生产计划，以及一组帮助客户迁移和运营数据库的企业服务层。Basic
              计划是最清楚的自助入口：按请求单元用量计费，并给出有意义的免费额度，降低了无重承诺起步的难度。Standard 和 Advanced 随后把初始漏斗转成明确基础设施支出，Standard 销售预置 vCPU
              容量加用量项目，Advanced 则通过专用节点、存储以及某些情况下的 IOPS 变现。


              一旦把支持和迁移纳入，模型就更有意思。公开支持页面显示，Cockroach Labs 销售分层订阅，对企业云支持收取额外百分比费用，并把技术顾问、具名成功覆盖和根因分析打包进更高层级。迁移文档和 MOLT
              工具也说明，公司预期许多大客户会通过替换项目进入，而不只是通过全新绿地应用进入。


              这对可变现客户深度是好信号，但也意味着业务并非纯软件自动化。相当一部分价值创造似乎绑定了解决方案工程、迁移专长和企业运营信任。从财务上看，Cockroach
              更像云基础设施经常性收入与高接触企业交付的混合体，而不是简单的免费增值数据库工具。
