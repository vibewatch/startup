      - number: '2.2'
        title: 市场规模口径及其分歧
        blocks:
          - type: paragraph
            body: >-
              公开市场规模证据覆盖三个嵌套但并不相同的市场。DataIntelo 的分布式 SQL 估算最贴近窄口径，因为它明确匹配 Cockroach Labs 的架构品类。Business Research
              Insights 给出更宽的分布式数据库口径，Coherent Market Insights
              则覆盖大得多的云数据库大伞。这些口径放在一起有用，正是因为它们彼此不一致：范围本身揭示了品类边界扩张时带来的不确定性。


              因此，投资者不应把单一头条 TAM 当作既定事实。$26B 的云数据库估算也许能为长期相邻市场提供方向感，但它并不等同于分布式 SQL 的可寻址资金池。反过来，低于 $5B 的分布式数据库估算，也可能漏掉全球一致
              SQL 工作负载的特定价值溢价。使用多重口径，是为了保留矛盾，而不是把矛盾洗成虚假的精确。


              这也限制了公开 SAM 和 SOM
              工作。没有披露客户数、转化漏斗或按区域和工作负载拆分的组合，外部人无法负责任地推导公司特定的可服务市场。正确的尽调姿态，是保留这条失败的测算路径，并向管理层索取他们内部真正使用的细分。换句话说，这里的市场数字适合作为边界条件，而不是替代真实公司运营数据。
