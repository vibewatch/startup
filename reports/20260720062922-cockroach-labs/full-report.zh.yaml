      - number: '4.3'
        title: 牵引力与资本背景真实存在，但当前承销输入仍稀疏
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs 不是一家还在等待第一份证明的小公司。2021 年 Series F 公告披露了强劲 ARR 增长、云收入快速加速，以及超过 200 个客户，其中逾半数已在 Dedicated
              上运行。第三方汇总后来披露，2023 年 ARR 或收入数字为 128.3 million dollars，2025 年员工数估计约 715 人。这些数据点支持一种判断：Cockroach
              已经在有意义的后期规模上运营。


              缺的是投资者现在最想要的东西：新收入、烧钱速度、现金余额、毛利率、留存和效率数据。2026 年进展公告强调产品和伙伴进展，却没有发布更新后的财务。二级市场定价显示投资人兴趣仍在，估值高于 2021
              年一级融资；但二级交易不会注入新的运营现金，也不能回答现金跑道问题。


              结果是一条定性信号强、精度弱的财务故事。收入质量看起来有希望，因为产品位于关键任务基础设施，云收入占比早期已有改善，支持或迁移服务似乎可以变现。但缺少当前财务报表意味着，盈利路径和 2021
              年资本基础是否足够，仍只能推断，不能证明。这足以支持继续尽调，但不足以高置信度承销。
