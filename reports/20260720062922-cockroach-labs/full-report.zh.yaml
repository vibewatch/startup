      - number: '7.2'
        title: 受监管客户提高了产品经济价值，也提高了失败严重性
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs 越来越多卖进支付、银行和博彩用例；数据库不只是存信息，还帮助满足法律、运营韧性和位置控制要求。DORA 提高了金融业 ICT
              风险管理、事故报告、测试和第三方监督的门槛；sportsbook 和游戏部署则可能继承州内本地性和 Wire Act 逻辑，迫使客户做定制拓扑决策。


              这在战略上有吸引力，因为这些是高价值工作负载，切换成本大。但也危险，因为失败会被用更高标准审视。受监管行业客户会期待发布纪律、事故透明度、数据处理控制和清晰合同边界的证明。公司自身法律材料也强化了这种共同责任模型：客户必须保护账户、遵循最佳实践，并接受围绕
              beta 服务、服务连续性和补救的实质限制。


              实际上，这意味着 Cockroach
              上探高端市场，也是在进入后果更严重的场景。公司赢下越多关键任务受监管账户，就越没有空间容忍模糊宕机、薄弱文档或草率版本政策。这种不对称尤其重要：在最好客户细分中的成功，也会抬高每一次未来错误的成本。
