- id: SR003
  title: Commercial risk comes from selective fit, support intensity, and limited public visibility
  body: |-
    Cockroach Labs does not appear to face a simple “nobody needs this” risk. The bigger commercial question is how wide the truly attractive buyer pool is. PostgreSQL remains free and deeply familiar, while Aurora and Spanner can look operationally simpler for buyers comfortable with cloud lock-in. That means Cockroach often wins when the workload is especially demanding—global transactions, multi-region survivability, or compliance-sensitive portability—but may face more friction in mainstream relational opportunities.

    Customer stories suggest that many wins are migration-led and support-heavy. That can create durable system-of-record placements and strong ACVs, but it can also lengthen sales cycles and raise service costs. Independent critique around hidden implementation cost points in the same direction. If expansion economics are strong, this trade can still work. Public sources simply do not disclose enough to prove that today.

    That opacity matters. Without fresh retention, concentration, margin, or runway disclosure, investors can see the outline of the risk map but not its exact weights. The right stance is therefore selective optimism paired with hard diligence on customer concentration, support intensity, and release-related incident history. If those hidden metrics are strong, many visible risks look manageable; if they are weak, the same visible risks become thesis-threatening very quickly.
