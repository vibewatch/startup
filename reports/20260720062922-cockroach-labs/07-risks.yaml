- id: SR002
  title: Regulated customers raise the economic value of the product and the severity of failure
  body: |-
    Cockroach Labs increasingly sells into payments, banking, and betting use cases where the database does not merely store information; it helps satisfy legal, operational-resilience, and location-control requirements. DORA raises the bar for financial-sector ICT risk management, incident reporting, testing, and third-party oversight, while sportsbook and gaming deployments can inherit state-locality and Wire Act logic that force bespoke topology decisions.

    That is strategically attractive because these are high-value workloads with large switching costs. But it is also dangerous because failure is judged against a tougher standard. Customers in regulated sectors will expect proof of release discipline, incident transparency, data handling controls, and clear contractual boundaries. The company’s own legal materials reinforce that shared-responsibility model: customers must secure their accounts, follow best practices, and accept meaningful limitations around beta services, service continuity, and remediation.

    In practice, this means Cockroach’s push upmarket is also a push into higher-severity consequences. The more the company wins mission-critical regulated accounts, the less room it has for ambiguous outages, weak documentation, or sloppy version policy. That asymmetry is especially important: success in the best customer segments also raises the cost of every future mistake.
