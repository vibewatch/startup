- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Correctness / security bug risk
    - Severity-1 or widespread advisory pattern
    - Multiple major supported-release defects with real customer impact
    - Escalate technical diligence or pause investment
  - - Version-policy / support drift
    - High installed-base exposure to unsupported or innovation releases
    - Meaningful share of revenue on unsupported paths
    - Demand remediation plan before conviction
  - - Support-intensity risk
    - Rising support burden without margin proof
    - Support costs scaling faster than ARR in enterprise segment
    - Pressure gross-margin assumptions
  - - Customer concentration risk
    - Top-account dependence discovered in diligence
    - Top 10 customers represent outsized revenue share
    - Haircut valuation and seek contract durability proof
  - - Competitive simplification risk
    - Losses to Aurora / Postgres in core ICP
    - Win rates weaken outside extreme use cases
    - Reassess TAM and sales-efficiency assumptions
  - - Regulated-account incident risk
    - High-profile outage in fintech or betting customer
    - Customer-visible service or correctness failure in regulated workflow
    - Treat as thesis-threatening event
  notes: Each row pairs a visible risk with a practical diligence or monitoring threshold.
