- id: SU002
  title: The strongest references show deep production adoption, not lightweight pilots
  body: |-
    The named case studies are unusually concrete. DoorDash runs CockroachDB as an internal service at around 1.2 million peak queries per second, 300-plus clusters, and roughly 1.9 petabytes of data. Netflix operates more than 380 clusters and has expanded usage into device management, workflow orchestration, and gaming. Route powers more than 1 billion orders, while Booking.com, Form3, Shipt, Riskified, and Hard Rock all describe business-critical transaction flows rather than side projects.

    This matters because it reduces a common diligence concern in infrastructure software: references that look impressive on paper but represent small pilots or non-critical shadow deployments. Here, the public stories point to source-of-truth systems, payment engines, customer-facing order flows, and internal database platforms. Those are harder workloads to win, govern, and far harder workloads to displace once running successfully.

    The recurring theme is that CockroachDB often enters through a difficult architectural problem—global transactions, regulatory locality, or legacy database bottlenecks—and then becomes more central over time. Several stories also show deployment expansion after the initial decision, whether through more clusters, more regions, more nodes, or broader internal self-service. The references therefore indicate not only adoption but operational trust after adoption inside demanding environments. That gives the customer evidence real weight.
