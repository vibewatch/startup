figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Shows the recurring path from painful incumbent database problem to expansion inside demanding enterprise accounts.
  data:
    nodes:
    - label: Legacy pain appears
      detail: Outages, single-writer bottlenecks, sharding pain, or regulatory locality constraints make the incumbent database inadequate.
    - label: Technical evaluation
      detail: Customer tests CockroachDB against alternatives such as Aurora, Spanner, Cassandra, or self-managed PostgreSQL paths.
    - label: Production landing zone
      detail: The first serious deployment is usually a payments system, order platform, fraud engine, betting ledger, or internal control-plane service.
    - label: Topology and support expansion
      detail: Regions, nodes, managed service use, and account-team engagement expand as the workload proves durable.
    - label: Embedded switching costs
      detail: Once the database becomes central, migration difficulty, operational coupling, and business criticality increase renewal odds.
  approximationNotes: This is an analyst-synthesized customer journey based on repeated patterns across public case studies, not a disclosed lifecycle funnel from Cockroach Labs.
