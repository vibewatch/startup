chapter:
  number: 6
  title: Customers
  summary: 'Cockroach Labs has one of the stronger public customer-proof sets in private infrastructure software: the named references are not decorative logos but deep production users running payments, order management, fraud, gaming, and internal database-platform workloads at serious scale. That said, the evidence is much stronger on customer quality than on customer count precision, retention cohorts, or independent satisfaction. The right read is therefore positive on account quality and likely switching costs, while remaining cautious on breadth and portfolio economics until private data is shared.'
sections:
- id: SU001
  title: The customer base is broad in logos but concentrated in mission-critical use cases
  body: |-
    Cockroach Labs has no shortage of named customer proof. The public customer page spans financial services, retail, software, media, gaming, manufacturing, and gambling, while legacy official disclosures already pointed to more than 200 customers and tens of thousands of deployed clusters back in 2021. That combination matters because it shows both breadth and age: this is not a product still waiting for first serious references.

    But the more important pattern is not raw logo count. It is workload type. Across the visible roster, CockroachDB is repeatedly used for order management, payments, fraud screening, device control planes, gaming metadata, shipment tracking, and sportsbook ledgers. These are operational systems where downtime, incorrect writes, or regional failure would immediately harm revenue or customer experience.

    That concentration cuts both ways. It is strong evidence that CockroachDB has found buyers with real pain and real budgets. It also suggests the product is best suited to technically demanding customers who value resilience, consistency, and topology control enough to absorb the complexity of a distributed database. In other words, the roster looks more like an enterprise-infrastructure customer book than a broad, lightweight SMB utility base. That pattern is attractive for ACV and retention, but less obviously supportive of mass-market volume or frictionless self-serve breadth.
