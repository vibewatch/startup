- id: SU003
  title: Customer quality looks strong, but count precision and independence remain weaker
  body: |-
    From an investor perspective, the customer story is strongest on quality, not precision. Riskified’s 99+ percent retention, Route’s support ROI, and repeated examples of zero-downtime migrations or multi-region survival all support the idea that CockroachDB can become sticky once embedded. These are good signals for expansion and long-lived revenue.

    What public evidence does not provide is a clean 2026 answer to how many paying customers Cockroach Labs has right now, what net retention looks like, or how customer spend is distributed across self-serve versus large enterprise accounts. Official customer-count disclosures are old, while third-party customer databases are helpful but methodologically weak.

    The prudent conclusion is therefore constructive but not naive. Cockroach Labs appears to have high-value customers with meaningful switching costs and visible post-sale support engagement. However, the public proof set still relies heavily on company-authored success stories, so customer depth is easier to verify than customer breadth, retention quality, or cohort economics. Investors should view the customer chapter as strong evidence of fit in hard accounts, not as a substitute for real cohort disclosure or concentration analysis. The missing inputs are mostly commercial, not technical, which is still a meaningful diligence distinction.
