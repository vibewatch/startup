            title: The sharpest risk is not demand; it is safe execution
            body: >-
              CockroachDB has clear product-market fit in hard workloads. The danger is that correctness bugs, upgrade
              drift, or support-heavy deployments could erode trust faster than the company can operationally mature.
            calloutType: risk
            claimRefs:
              - CR001
              - CR011
              - CR016
              - CR042
          - type: callout
            title: Regulated accounts amplify both upside and downside
            body: >-
              Fintech and gaming customers increase switching costs and ACV, but they also make incident severity and
              compliance burden much higher than in a casual developer-tool sale.
            calloutType: risk
            claimRefs:
              - CR018
              - CR020
              - CR021
              - CR042
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current price signals imply a premium valuation with limited public financial support
        blocks:
          - type: paragraph
            body: >-
              The most concrete valuation anchors are straightforward: Cockroach Labs last raised primary capital at a
              $5 billion valuation in late 2021, and secondary-market indicators in mid-2026 imply something closer to
              $6.9 billion. Those prices are not trivial achievements. They signal that the market continues to view
              Cockroach as a serious late-stage infrastructure asset rather than as a fading private round.


              The problem is what public numbers can actually support. The clearest revenue anchor still comes from a
              third-party 2023 estimate of about $128.3 million. Even if investors generously test a $170-200 million
              revenue range for 2025-2026, the implied revenue multiples remain very high. That means the current price
              already assumes meaningful hidden progress on revenue scale, retention, or margin quality. Public evidence
              therefore supports direction, but not enough precision to make the price feel conservative.


              In other words, the public market is not being asked whether Cockroach is good. It is being asked whether
              the company is good enough, large enough, and efficient enough to justify a premium multiple despite
              incomplete disclosure. That is a much harder question. The investment problem is therefore mostly one of
              valuation discipline rather than of company identification or simple awareness.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
