      - number: '3.2'
        title: 'Capability overlap: where Cockroach still stands out and where rivals are catching up'
        blocks:
          - type: paragraph
            body: >-
              Capability overlap is real, but it is uneven. CockroachDB’s clearest proposition remains the combination
              of PostgreSQL compatibility, distributed ACID behavior, active-active multi-region design, and deployment
              freedom across clouds or self-hosted environments. That package is still relatively unusual, especially
              when compared with standard PostgreSQL and Aurora, which remain easier to adopt but less natively
              distributed.


              The catch is that important parts of the pitch are no longer unique. AlloyDB uses the PostgreSQL label
              while adding managed performance and AI features on Google Cloud. Yugabyte markets distributed PostgreSQL
              with open-source and multi-cloud language very close to Cockroach’s core story. TiDB sells strong
              consistency plus horizontal scale but through a MySQL-compatible lens. PlanetScale, Vitess, and Neon do
              not match Cockroach on every correctness or multi-region dimension, but they can win the early project or
              single-team decision by lowering operational friction and starting cost.


              This means feature breadth alone is not a moat. Buyers can increasingly assemble a shortlist in which each
              vendor wins a different slice of the tradeoff: portability, hyperscaler convenience, serverless developer
              velocity, open-source lock-in avoidance, or multi-model data handling. Cockroach Labs still looks
              strongest when the workload needs global transactional correctness without accepting one-cloud lock-in,
              but the company now has to prove that need rather than assume it.
