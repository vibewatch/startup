      - number: '2.3'
        title: Buyer map, adoption drivers, and gating constraints
        blocks:
          - type: paragraph
            body: >-
              The economic buyer for CockroachDB is rarely a lone developer. Database transformations that justify this
              product usually involve platform teams, database specialists, security/compliance owners, and an executive
              sponsor willing to fund migration work in exchange for lower outage risk or better geographic scale. Daily
              users are engineers, but the payer is often the leader accountable for resilience, cloud architecture, or
              a regulated launch schedule.


              The adoption triggers in public evidence are consistent: multi-region growth, inability to tolerate
              downtime, migration away from brittle sharding, and demand for compliance or locality controls. PostgreSQL
              compatibility helps because it narrows organizational switching cost relative to a net-new database model.
              Customer cases reinforce that the first workload is usually a painful one—a payment flow, booking path,
              fraud-control service, or other latency-sensitive system—before broader standardization follows.


              Constraints are equally important. Migration is expensive, operational behavior changes in distributed
              systems are non-trivial, and any correctness advisory or public incident can slow enterprise conviction.
              Competition also compresses urgency: Aurora, Spanner, TiDB, YugabyteDB, Neon, and PlanetScale all give
              buyers some way to postpone or reshape the problem. That makes the market valuable, but not frictionless.
              The adoption path is therefore less like a standard software upgrade and more like a board-visible
              reliability project that earns budget only when the pain is concrete.
