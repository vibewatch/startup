  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive set: status quo, hyperscalers, and true distributed-SQL peers'
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs does not sell into a blank market. The first and often strongest competitor is the status
              quo: teams can keep running PostgreSQL, add replicas, and postpone a migration altogether. That matters
              because PostgreSQL remains broadly popular and portable, which lowers the organizational urgency to adopt
              a heavier distributed system even when CockroachDB may be architecturally cleaner for global workloads.


              The next layer of competition comes from hyperscalers. Aurora, Spanner, and AlloyDB each offer a
              procurement shortcut: the buyer can stay inside AWS or Google Cloud, reuse commercial relationships, and
              adopt a managed service without introducing a standalone database vendor. For many enterprise accounts
              that organizational convenience is itself a feature, even before product differences are considered.


              Only after those two layers does the buyer get to the most direct distributed-SQL peer set: YugabyteDB,
              TiDB, and in selected cases CockroachDB-versus-Spanner decisions. PlanetScale, Vitess, Neon, and
              SingleStore widen the decision set further by offering lower-friction developer entry, sharded MySQL,
              serverless Postgres, or hybrid transactional-plus-analytical positioning. The practical lesson is that
              Cockroach Labs is competing less for generic “database spend” than for a narrow class of
              correctness-sensitive workloads where multi-region resilience is painful enough to justify migration.
            claimRefs:
              - CP001
              - CP002
              - CP003
