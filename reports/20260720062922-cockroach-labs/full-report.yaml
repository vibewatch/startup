  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization architecture spans developer funnel, production clusters, and high-touch services
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs does not sell one clean SKU. Its monetization stack deliberately spans a low-friction
              developer funnel, provisioned cloud production plans, and a set of enterprise service layers that help
              customers migrate and operate the database. The Basic plan is the clearest self-serve hook: usage-based
              request-unit billing with a meaningful free allowance makes it easy to start without a heavy commitment.
              Standard and Advanced then convert that initial funnel into explicit infrastructure spend, with Standard
              selling provisioned vCPU capacity plus usage line items and Advanced monetizing dedicated nodes, storage,
              and in some cases IOPS.


              The model becomes more interesting once support and migration are included. Public support pages show that
              Cockroach Labs sells tiered subscriptions, charges an additional percentage fee for enterprise cloud
              support, and bundles technical advisory, named success coverage, and root-cause analysis into higher
              tiers. Migration documentation and MOLT tooling make clear that the company expects many large customers
              to arrive through replacement projects, not only through brand-new greenfield applications.


              That is a good sign for monetizable customer depth, but it also means the business is not purely
              software-automatic. A meaningful share of value creation appears tied to solution engineering, migration
              expertise, and enterprise operational trust. Financially, Cockroach looks more like a hybrid of cloud
              infrastructure recurring revenue and high-touch enterprise delivery than like a simple freemium database
              utility.
            claimRefs:
              - CI001
              - CI002
              - CI004
