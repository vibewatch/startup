  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The largest near-term risks are operational correctness and version discipline
        blocks:
          - type: paragraph
            body: >-
              The public advisory record makes one point impossible to ignore: CockroachDB’s core challenge is not
              proving that the architecture works in principle, but keeping a very ambitious distributed database safe
              across many versions, workloads, and deployment patterns. The 2026 advisories alone span privilege
              escalation, partial index corruption, live-data deletion, and silent import or backup failure scenarios.
              Even when many of these bugs are rare and patched quickly, they directly target the trust assumptions
              customers care most about in a system of record.


              The operating model compounds that risk. Cockroach Labs’ own production and upgrade documentation
              emphasizes topology discipline, replication health, backup verification, hotspot-aware schema design, load
              balancing, and release-finalization awareness. This is mature documentation, but it also shows that
              resilience is conditional on customer execution. The database removes some application-layer burden while
              creating a different burden in operations engineering.


              That leaves the company exposed to a classic infrastructure challenge: if correctness defects or upgrade
              mistakes hit a flagship account, the damage can travel quickly from support load into renewal risk and
              brand reputation. Operational excellence is therefore not a nice-to-have for Cockroach Labs. It is the
              product. The main risk is not one catastrophic unknown, but the compounding effect of many small
              operational failures in a database customers expect to trust completely.
            claimRefs:
