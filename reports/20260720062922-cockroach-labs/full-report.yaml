companyProfile:
  summary: >-
    Cockroach Labs is a New York-based infrastructure company founded in 2015 and built around CockroachDB, a
    PostgreSQL-compatible distributed SQL database sold as fully managed cloud and enterprise software. Public evidence
    shows unusually strong customer proof across payments, order management, fraud, gaming, and internal
    database-platform workloads, along with continued secondary-market interest in 2026. The central diligence tension
    is that company quality looks real while current financial disclosure remains too sparse to underwrite valuation
    with high conviction.
