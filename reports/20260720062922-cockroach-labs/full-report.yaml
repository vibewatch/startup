  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category logic
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs should not be sized against the entire universe of databases. Its product is a distributed
              SQL database marketed for cloud-native, mission-critical transactional applications that need resilience,
              multi-region availability, and PostgreSQL familiarity. That means the cleanest category anchor is
              distributed SQL, with broader cloud-database and distributed-database figures used only as boundary
              checks.


              The included spend is application-facing transactional data infrastructure: production OLTP clusters,
              resilience upgrades, cloud database operations, migrations off legacy relational estates, and adjacent
              compliance-heavy modernization work. Excluded spend includes data warehouses, search engines, pure
              document stores, and developer tooling categories that do not directly replace a transactional system of
              record. This boundary matters because a very broad “database TAM” can make the opportunity look gigantic
              while saying almost nothing about the spend Cockroach Labs can actually win.


              The status-quo alternative is also stronger than in younger software categories. Teams can stay on
              PostgreSQL, stay on Aurora, use application-level sharding, or select a hyperscaler-native system such as
              Spanner. The market is therefore not created by awareness alone; it opens when buyers feel enough outage,
              scale, compliance, or geo-distribution pain to justify migration effort. That framing keeps later
              valuation work honest: Cockroach Labs is selling into a valuable but highly contested modernization
              decision, not into unclaimed greenfield demand.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM018
              - CM033
