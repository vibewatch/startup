      - number: '5.2'
        title: Core architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              CockroachDB’s technical identity starts in its architecture. The database accepts SQL on any node,
              converts those statements into key-value operations, and then coordinates them over distributed ranges
              replicated across the cluster. Ranges split as data grows, writes flow through Raft quorum, and locality
              metadata plus range placement lets the system optimize for resiliency and geography without asking the
              application to manage shards itself.


              Multi-region controls are not an afterthought. The documentation exposes explicit abstractions for primary
              regions, table localities, super regions, secondary regions, and survival goals. That gives customers a
              way to trade latency, compliance, and resilience in SQL-visible terms rather than only in network topology
              diagrams. Cluster virtualization extends this direction by separating control and data planes through
              system and virtual clusters, which matters for physical cluster replication, resource isolation, and more
              governable operational models.


              This is the layer that is hardest for customers to recreate themselves. PostgreSQL familiarity is
              relatively easy to understand; what is difficult is combining that familiarity with multi-region topology,
              consistent replication, portability, low-touch operations, and newer AI-ready indexing in one product.
              That is where the underlying architecture still looks differentiated.
