      - number: '1.4'
        title: Customer proof, resilience credibility, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Cockroach Labs’ strongest non-financial proof point is the quality of its named customer set. Booking.com
              uses CockroachDB for a roughly 20 TB order platform spanning multiple European regions; SumUp says it
              migrated a core payments system serving more than 4 million merchants; Form3 runs a multi-cloud payments
              backbone across AWS, GCP, and Azure; and Netflix reports a fleet of more than 380 CockroachDB clusters.
              Those are not vanity logos. They are high-availability workloads in payments, travel, and media where
              correctness and outage tolerance actually matter. This customer evidence supports the company’s 2026
              positioning around AI-scale resilience and always-on operations. At the same time, the adverse record is
              not empty. Cockroach Labs openly publishes technical advisories, and the 2026 list includes
              privilege-escalation issues, partial-index corruption, live-data-deletion edge cases, and backup-integrity
              problems. The status page also shows the company is willing to expose cloud incidents publicly. Netting it
              out, the company has genuine enterprise proof and unusually strong resilience credentials, but those
              strengths coexist with the ordinary reality of operating a complex distributed database: the product
              surface is large, bugs happen, and trust depends on disclosure discipline as much as on architecture.
            claimRefs:
              - CO023
              - CO024
              - CO025
              - CO026
