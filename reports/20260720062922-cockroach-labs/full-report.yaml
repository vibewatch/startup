  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and SKU map
        blocks:
          - type: paragraph
            body: >-
              CockroachDB’s product definition is more concrete than “distributed SQL.” Public materials consistently
              frame it as a transactional system-of-record database for always-on, cloud-native applications that need
              PostgreSQL familiarity, resilience, and global scale at the same time. That workflow orientation matters
              because it separates CockroachDB from both pure analytical systems and from document or multi-model
              platforms that solve different jobs.


              The product surface is also broader than a single engine. Cockroach Labs sells managed cloud, self-hosted
              enterprise software, migration tooling, and support around the same database core. Basic or
              serverless-style entry points are there to reduce trial friction, while Standard and Advanced are
              structured for progressively more demanding production and regulated workloads, procurement paths, and
              security expectations in enterprise accounts.


              This module map reveals the company’s strategic intent: use familiarity and easy starts to get into the
              workflow, then expand into higher-value production, compliance, and migration work. The product story is
              therefore not only about feature count. It is about turning a hard replacement category into a platform
              decision that can begin small and still scale into a mission-critical control plane.
