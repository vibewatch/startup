      - number: '1.2'
        title: Capital formation, private-market signals, and scale markers
        blocks:
          - type: paragraph
            body: >-
              The last primary financing remains the December 2021 Series F, when Cockroach Labs raised $278 million at
              a $5 billion valuation and said lifetime funding had reached $633 million. That round is stale by
              growth-software standards, but it remains the cleanest official valuation anchor because it comes directly
              from the company and names an elite investor roster led by Greenoaks. What changed after that is not a new
              primary round but a more visible secondary market. Nasdaq Private Market and Notice both showed mid-2026
              share prices in the high-single-digit range, and PM Insights surfaced a June 2026 premium to the 2021
              round that implies a much higher enterprise mark than the official $5 billion headline. Those signals
              confirm liquidity and investor interest, but they do not solve the core diligence problem: public revenue
              evidence is still thin. GetLatka’s 2023 ARR figure of $128.3 million and 2025 headcount estimate around
              715 employees suggest a business with meaningful scale, yet the company’s 2026 momentum release still
              avoids hard financial disclosure. The resulting picture is a company large enough to matter, clearly still
              private, and plausibly worth more on secondary desks than in its last primary round, but still not
              transparent enough for underwriters to treat those marks as equivalent to a fresh priced financing.
