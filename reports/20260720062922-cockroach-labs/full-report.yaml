          - type: callout
            title: Admire the company, challenge the entry price
            body: >-
              The right posture is constructive diligence, not reflexive passivity. Cockroach Labs looks like a real
              late-stage winner candidate; it just does not obviously look mispriced from public information alone.
            calloutType: recommendation
