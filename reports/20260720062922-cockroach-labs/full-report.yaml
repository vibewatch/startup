      - number: '2.2'
        title: Sizing lenses and where they disagree
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence spans three nested but non-identical markets. DataIntelo's distributed-SQL estimate
              is the best narrow fit because it explicitly matches Cockroach Labs' architectural category. Business
              Research Insights provides a broader distributed-database lens, while Coherent Market Insights captures
              the much larger cloud-database umbrella. These are useful together precisely because they disagree: the
              range shows the uncertainty created when category boundaries widen.


              The resulting lesson is that investors should not treat one headline TAM as settled fact. A $26B
              cloud-database estimate may be directionally helpful for long-run adjacency, but it is not the same as the
              addressable pool for distributed SQL. Conversely, an estimate below $5B for distributed databases may
              still miss the specific value premium of globally consistent SQL workloads. Using multiple lenses
              preserves contradiction rather than laundering it into fake precision.


              This also limits public SAM and SOM work. Without a disclosed customer count, conversion funnel, or
              region-by-workload mix, an outsider cannot responsibly derive a company-specific serviceable market. The
              right diligence stance is to preserve the failed sizing path and ask management for segmentation they
              actually use internally. In other words, market numbers are useful here as boundary conditions, not as a
              substitute for actual company operating data.
