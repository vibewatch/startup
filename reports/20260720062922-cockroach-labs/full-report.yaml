      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The price already assumes good hidden answers
            body: >-
              Cockroach Labs may well deserve a premium valuation, but the 2026 secondary marker looks as though it
              already prices in strong unseen revenue and retention data. Without that proof, the valuation case is more
              faith-heavy than it should be.
            calloutType: risk
            claimRefs:
              - CV011
