- id: SI003
  title: Traction and capital context are real, but today’s underwriting inputs remain sparse
  body: |-
    Cockroach Labs is not a tiny company waiting for first proof. The 2021 Series F announcement disclosed strong ARR growth, a sharp cloud-revenue acceleration, and more than 200 customers with over half already on Dedicated. Third-party aggregation later surfaced a 2023 ARR or revenue figure of 128.3 million dollars and a 2025 headcount estimate around 715 employees. Those datapoints support the view that Cockroach is operating at meaningful late-stage scale.

    What is missing is what investors most want right now: fresh revenue, burn, cash balance, gross margin, retention, and efficiency data. The 2026 momentum release emphasizes product and partner progress without publishing updated financials. Secondary pricing suggests ongoing investor interest and a valuation above the 2021 primary round, but secondary activity does not inject fresh operating cash or settle the runway question.

    The result is a financial story with strong qualitative signals and weak precision. Revenue quality looks promising because the product sits in mission-critical infrastructure, cloud mix improved early, and support or migration services appear monetizable. Yet the absence of current financial statements means the path to profitability and the adequacy of the 2021 capital base still have to be inferred rather than demonstrated. That is enough to justify continued diligence, not enough to underwrite with high conviction.
