- id: TI002
  title: Pricing / monetization table
  columns:
  - plan / lever
  - public billing mechanic
  - customer behavior encouraged
  - hidden or variable cost signal
  - financial implication
  rows:
  - - Basic
    - Usage-based RUs with free monthly allowance
    - Prototype and bursty trial usage
    - RU bundle absorbs backups and transfer
    - Helpful acquisition funnel, less transparent margin by small account
  - - Standard compute
    - Provisioned vCPU-hours billed on reserved capacity
    - Capacity planning and long-lived production use
    - Overprovisioning buffer can create slack spend
    - Supports predictable recurring revenue
  - - Standard storage / CDC / transfer
    - Usage-based line items
    - Expansion as workloads grow or globalize
    - Cross-region traffic and watched data can surprise buyers
    - Creates post-land expansion revenue
  - - Advanced nodes
    - Per-node compute and storage
    - Enterprise architecture planning and regional design
    - AWS IOPS and security add-ons raise complexity
    - Higher ACV and more bespoke commercial motion
  - - Enterprise support
    - Subscription layer with cloud support surcharge
    - Operational trust and faster response expectations
    - Service intensity can grow with cloud consumption
    - Adds recurring revenue but also service cost
  - - Migration services
    - High-touch engagement around replacement projects
    - Complex cutovers and database consolidation
    - Labor-intensive delivery and sales engineering
    - Raises CAC but also win probability for large deals
  notes: Pricing mechanics are simplified from documentation into the commercial behaviors they most likely drive.
