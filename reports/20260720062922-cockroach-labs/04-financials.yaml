tables:
- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - billing unit
  - customer type
  - what drives expansion
  - implication
  rows:
  - - Basic cloud
    - Request units + storage with free allowance
    - Developers and small workloads
    - More request load and stored data
    - Functions as top-of-funnel and lightweight usage monetization
  - - Standard cloud
    - Provisioned vCPU-hours plus usage line items
    - Production cloud workloads
    - Higher reserved capacity, storage, backups, CDC, transfer
    - Looks like recurring infrastructure revenue with expansion levers
  - - Advanced cloud
    - Per-node compute, storage, IOPS, plus usage items
    - Enterprise and regulated workloads
    - More nodes, larger nodes, replicas, security features, support
    - Highest likely ACV but also most bespoke delivery
  - - Self-hosted enterprise
    - License / subscription style commercial motion
    - Customers needing their own environment
    - More clusters, support, and architectural scope
    - Preserves enterprise monetization outside Cockroach-managed cloud
  - - Support subscriptions
    - Tiered service subscription; cloud enterprise fee percent
    - Operators of production workloads
    - Higher severity coverage and enterprise operations needs
    - Adds sticky service revenue and strengthens retention
  - - Professional services / migration
    - Project or scoped-service engagement
    - Replacement and modernization projects
    - Migration complexity and workload criticality
    - Improves close rates but adds delivery cost
  notes: Rows summarize the public monetization surfaces visible in pricing, support, deployment, and migration materials.
  enumerationScope:
    coverage: partial
    basis: Captures the monetization layers that are publicly described. It does not attempt to infer unpublished contract structures, OEM terms, or bespoke enterprise discounting.
