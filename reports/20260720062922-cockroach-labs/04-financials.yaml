- id: SI002
  title: Public unit-economics signals are strongest on pricing mechanics, not on efficiency disclosure
  body: |-
    The best public financial evidence is mechanical rather than complete. Cockroach Labs explains exactly how Standard and Advanced customers are billed, what a 40 percent capacity buffer looks like, when cross-region pricing applies, and which expansion levers sit outside base compute. That matters because it tells investors where revenue can expand after initial adoption: backup retention, watched-data CDC, cross-region transfer, additional replicas, and dedicated enterprise support all layer on top of the cluster itself.

    But the same public clarity reveals why unit economics are hard to underwrite from outside. Standard bills reserved capacity rather than realized usage, which can be good for revenue predictability but can also create customer slack or optimization pressure. Advanced is even more bespoke, with region-, provider-, security-, and sometimes IOPS-sensitive pricing. Those line items may produce attractive net expansion in mature accounts, yet they also create gross-margin sensitivity to infrastructure mix and multi-region traffic.

    The visible GTM motion reinforces that ambiguity. MOLT, migration services, and consultative support help Cockroach close hard replacement projects, but they also imply customer-acquisition and implementation costs that are not separately disclosed. Public evidence therefore supports a view that Cockroach has multiple monetization levers, but it does not support precise CAC, payback, or margin modeling.
