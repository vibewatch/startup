  rows:
  - - PostgreSQL
    - Status quo / open source
    - Community-led OSS ecosystem
    - General OLTP and broad developer use
    - Lowest lock-in and broadest tooling familiarity
    - No native active-active multi-region write path in core project
  - - Amazon Aurora
    - Incumbent managed relational service
    - AWS-native managed service
    - AWS shops wanting managed PostgreSQL/MySQL compatibility
    - Procurement ease, serverless option, replicas, Global Database
    - AWS-only footprint and multi-part pricing
  - - Google Spanner
    - Global-consistency incumbent
    - Google-managed distributed database
    - Large GCP-first global applications
    - Strong consistency at global scale with managed operations
    - High lock-in and complex replica-based pricing
  - - AlloyDB
    - Managed PostgreSQL performance path
    - Google Cloud managed product
    - PostgreSQL users wanting more performance and AI features on GCP
    - 100% PostgreSQL-compatible positioning with read pools and AI story
    - Still tied to Google environment and node-style pricing
  - - PlanetScale / Vitess
    - Sharded MySQL / low-friction cloud DB
    - Commercial platform on top of Vitess
    - Teams optimizing developer speed or MySQL scale-out
    - Cheap entry, HA clusters, BYOC option, proven sharding control plane
    - MySQL/Vitess lineage limits direct PostgreSQL overlap
  - - Neon
    - Serverless Postgres
    - Commercial managed Postgres platform
    - Developer-led apps and agents needing fast starts
    - Scale-to-zero, branching, separate compute and storage
    - Less about global active-active transactional semantics
  - - YugabyteDB
    - Direct distributed PostgreSQL peer
    - Open-source plus commercial support motion
    - Mission-critical cloud-native OLTP with portability goals
    - Multi-master distributed PostgreSQL and open-source lock-in story
    - Very similar pitch creates head-to-head displacement risk
  - - TiDB
    - Distributed SQL with HTAP angle
    - PingCAP-managed or self-managed
    - Teams combining transactions with real-time analytics
    - MySQL compatibility, decoupled compute and storage, HTAP framing
    - Weaker PostgreSQL migration story
  - - SingleStore
    - Adjacent real-time data platform
    - Managed cloud DBaaS
    - Real-time apps mixing SQL, JSON, vector, and analytics
    - Hybrid transactional plus analytical breadth and strong performance claims
    - Not a clean PostgreSQL system-of-record substitute for every workload
  - - MongoDB Atlas
    - Adjacent modern app substitute
    - Managed document database platform
    - Builders favoring schema flexibility and modern app tooling
    - Strong modern-app and AI brand
    - Document model is not a drop-in relational substitute
