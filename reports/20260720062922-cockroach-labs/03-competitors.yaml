- id: TP003
  title: Pricing / packaging comparison
  columns:
  - competitor
  - entry model
  - scale model
  - contract / hidden-cost signal
  - implication for Cockroach Labs
  rows:
  - - PostgreSQL
    - Free OSS software
    - Infrastructure + labor
    - HA and tooling assembled separately
    - Hardest status-quo option to dislodge on cost alone
  - - Aurora
    - On-demand or serverless ACUs
    - Instance + storage + I/O + replica + Global DB costs
    - Region-specific commitments and replicated write I/O
    - Wins when buyer wants AWS convenience more than portability
  - - Spanner
    - Processing units / nodes
    - Compute + storage + backups + replication + bandwidth
    - Replica counts and minimum billing windows matter
    - Strong but enterprise-shaped global scale option
  - - AlloyDB
    - Provisioned managed cluster
    - vCPU + memory + storage + backup + networking
    - HA uses two nodes; CUDs improve economics
    - Targets serious PostgreSQL workloads already on GCP
  - - PlanetScale
    - Starts at $5/mo Postgres or low-cost HA
    - Resource-based monthly pricing plus enterprise add-ons
    - BYOC shifts infra cost into buyer account
    - Intercepts developer pilots cheaply
  - - Neon
    - Free tier and paid CU-hour usage
    - Usage-based compute + storage + history storage
    - Autoscaling and branching change realized cost shape
    - Makes serverless Postgres pilots very easy
  - - Yugabyte / TiDB
    - Free OSS plus managed cloud offers
    - Cluster-size or managed-service growth
    - Commercial support decisions determine real cost
    - Direct portability pitch without hyperscaler lock-in
  - - SingleStore
    - On-demand usage
    - Credits + storage + optional Flow CDC charges
    - Ingestion-heavy use cases can raise cost quickly
    - Competes where real-time AI/analytics breadth matters
  notes: Pricing rows simplify vendor calculators into the billing primitives most relevant to buyer behavior and acquisition friction.
