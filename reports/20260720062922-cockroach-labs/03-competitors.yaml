    - Test whether buyers actually need cross-cloud writes or just cloud procurement flexibility
  - - Distributed SQL is hard to build
    - Yugabyte and TiDB already offer credible distributed alternatives and Vitess/PlanetScale can satisfy many scale problems earlier
    - high
    - Conceptual uniqueness has already eroded
    - Request win/loss detail against Yugabyte, TiDB, PlanetScale, and Aurora
  - - AI-era database relevance will widen demand
    - AI and vector claims are now common across AlloyDB, Yugabyte, TiDB, and SingleStore
    - medium
    - Public messaging shows AI positioning is category-wide
    - Separate real customer usage from marketing narrative
  - - Enterprise proof should defend pricing
    - Hyperscaler bundling and low-friction serverless pilots can still undercut acquisition cost
    - medium
    - Distribution power and cheap entry matter before architecture does
    - Inspect sales-cycle data by competitor class
  - - Migration tooling creates stickiness
    - Public evidence does not prove exact competitive win rates or conversion economics
    - medium
    - Outsiders cannot quantify whether tooling meaningfully changes close rates
    - Ask for pipeline conversion by migration path and deployment target
  notes: Risk register focuses on whether the moat survives real buyer behavior, not whether CockroachDB is technically impressive in isolation.
