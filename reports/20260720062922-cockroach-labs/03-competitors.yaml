- id: SP003
  title: Pricing, lock-in, and moat durability
  body: |-
    Pricing models show why the competitive danger comes from more than one direction. Aurora, Spanner, and AlloyDB mostly monetize through enterprise-style infrastructure constructs such as instances, nodes, replicas, storage, and network replication. That suits steady-state production workloads and enterprise purchasing norms, but it also produces multi-line-item bills and topology-dependent costs. By contrast, Neon and PlanetScale make entry cheaper and more developer-friendly with free or low-cost starting points and usage-based expansion. SingleStore and some TiDB offers sit between those poles, mixing managed service economics with workload-sensitive usage or cloud packaging.

    These pricing differences reinforce the lock-in landscape. Open-source or open-ecosystem options such as PostgreSQL, Vitess, Yugabyte, and TiDB can calm buyer anxiety about irreversible platform dependence. Aurora and the Google stack trade some of that freedom for procurement ease and adjacent cloud integration. PlanetScale’s and Neon’s strength is not that they are perfect substitutes for CockroachDB; it is that they can intercept workloads before buyers ever conclude they need Cockroach-level distribution semantics.

    The resulting moat is therefore conditional, not absolute. Cockroach Labs does not own distributed-database ideas, AI messaging, or PostgreSQL familiarity by itself. Its moat comes from proving that a cloud-agnostic, correctness-first, multi-region PostgreSQL system is materially better for a subset of mission-critical applications than staying on the status quo or taking the bundled hyperscaler path. That can be durable, but only if migration tooling, customer proof, and sales focus keep the company ahead of direct peers such as Yugabyte while defending against the cheaper pilot experiences offered by Neon and PlanetScale.
