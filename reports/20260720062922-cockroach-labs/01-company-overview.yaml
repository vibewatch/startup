  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, observer seats, liquidation preferences, and reserved-matter controls.
    whyItMatters: Late-stage private governance can shift downside protection and control rights in ways not visible from fundraising headlines alone.
    diligencePath: Request current cap table, board list, and latest financing documents in diligence.
    relatedQuestionRefs:
    - QO006
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: 2024-2026 ARR, revenue mix, gross margin, and cash runway beyond third-party estimates.
    whyItMatters: Secondary-market valuation cannot be underwritten rigorously without updated company-level financial metrics.
    diligencePath: Ask management for ARR bridge, customer mix, and board-approved budget or cash runway materials.
    relatedQuestionRefs:
    - QO024
  - type: missing-source
    severity: minor
    topic: founder-roster
    missingEvidence: A clearly accessible official page naming the full co-founder roster and current roles.
    whyItMatters: Founder continuity influences key-person risk and narrative consistency in a founder-led infrastructure company.
    diligencePath: Confirm founding team composition with management or an official corporate history source.
    relatedQuestionRefs:
    - QO005
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone coverage
    missingEvidence: A fuller internal chronology covering non-public executive changes, customer wins, and incident reviews that do not surface in public releases.
    whyItMatters: The milestone table is the chronology of record for later chapters, so public-only evidence can understate material internal developments.
    diligencePath: Request a management-prepared timeline of financings, launches, leadership changes, and incidents since 2015.
    relatedTableRefs:
    - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 leadership coverage
    missingEvidence: A complete public management roster and founder history with current roles, prior roles, and board committee coverage.
    whyItMatters: Leadership concentration and founder continuity affect key-person risk, but the accessible public record only exposes part of the roster.
    diligencePath: Request an org chart, founder biographies, and current executive roster from management.
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: TO003 investor map coverage
    missingEvidence: A complete cap table including ownership percentages, preferred terms, and any current secondary-liquidity program participants.
    whyItMatters: Public sources name investors but not the exact control and economics that determine downside protection and dilution overhang.
    diligencePath: Request the cap table, financing documents, and any 2026 tender or employee-liquidity materials.
    relatedTableRefs:
    - TO003
