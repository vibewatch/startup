company:
  name: Cockroach Labs
chapter:
  number: 1
  title: Company Overview
  summary: Cockroach Labs is a New York-based distributed-database company founded in 2015 and best known for CockroachDB, a PostgreSQL-compatible distributed SQL system sold as managed cloud and enterprise software. Its last official financing was a $278 million Series F at a $5 billion valuation in December 2021, but secondary-market pricing remained active in mid-2026 even as public financial disclosure stayed sparse. The company’s strongest proof points are customer quality and product relevance in always-on workloads, while governance opacity and the absence of fresh primary financing remain the main diligence gaps.
sections:
- id: identity-and-product
  title: Identity, product scope, and current positioning
  body: 'Cockroach Labs positions itself as an infrastructure company solving a narrow but painful problem: how to run transactional databases that stay online through node, zone, and even regional failures without forcing application teams to manually shard or redesign around brittle failover patterns. Accessible public materials consistently place the company in New York and date the company to 2015, while its official product surfaces emphasize a PostgreSQL-compatible, cloud-native distributed SQL database rather than a proprietary developer experience. The product stack is no longer one thing. In 2026 the company markets fully managed CockroachDB Cloud, self-hosted Enterprise, migration tooling, and support, and it monetizes across Basic, Standard, and Advanced cloud tiers. That tiering matters because it shows Cockroach Labs is trying to capture both bottoms-up experimentation and regulated production workloads from the same platform. The public trust and security materials reinforce
    the same go-to-market message: resilience plus compliance plus operator simplicity. The strongest identity signal is therefore not raw scale; it is the company’s insistence that transactional correctness, multi-region resilience, and PostgreSQL familiarity can coexist in one system-of-record product for modern apps.'
