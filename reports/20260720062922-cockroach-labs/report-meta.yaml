  topStrengths:
    - Strong product and customer proof in mission-critical distributed transactional workloads.
    - Premium reference customers such as DoorDash, Netflix, Route, Riskified, Form3, and Hard Rock support relevance and switching-cost durability.
    - Continued secondary-market interest and a sustained premium narrative suggest the market still views Cockroach as a differentiated late-stage asset.
    - PostgreSQL compatibility plus multi-region resilience and portability create a credible strategic wedge in a large infrastructure category.
  topRisks:
    - Public financial disclosure is too thin to verify current ARR, NRR, gross margin, concentration, or runway at the present price.
    - Distributed-database correctness, upgrade discipline, and support intensity create meaningful operational and execution risk.
    - The customer mix appears high quality but skewed toward sophisticated accounts that may require longer sales cycles and heavier post-sale support.
    - Current implied valuation looks rich relative to public software-infrastructure comp multiples unless hidden metrics are substantially stronger than public anchors.
  unresolvedGaps:
    - Current 2025-2026 ARR or revenue run rate and segmented net retention / gross retention.
    - Gross margin, support-cost intensity, and whether support-heavy deployments dilute operating leverage.
    - Customer concentration and the revenue share of top enterprise accounts.
    - Cash balance, burn, runway, and any primary financing plans beyond secondary liquidity.
