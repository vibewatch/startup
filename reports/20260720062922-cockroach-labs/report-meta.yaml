  foundingLocation: New York, NY
  headquarters: New York, NY
  productSummary: Cockroach Labs sells CockroachDB Cloud, self-hosted CockroachDB Enterprise, and related support and migration capabilities for globally distributed, resilient transactional workloads.
  customerFocus: Enterprises and technically sophisticated software teams running mission-critical, multi-region, compliance-sensitive, or high-availability applications.
  businessModel: Subscription and consumption-based database revenue spanning managed cloud, enterprise software, support, and migration-led expansion.
  stage: late-stage private
