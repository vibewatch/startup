- id: SV002
  title: Public comps support a premium for quality, but not an open-ended premium
  body: |-
    Public software and database comps provide an uncomfortable reality check. MongoDB and Confluent trade around ten times revenue, Snowflake near twenty times, and Elastic meaningfully lower. Against that backdrop, Cockroach’s implied secondary multiple looks rich even under optimistic revenue tests. For the current price to resemble Snowflake-like public premium territory, Cockroach would need revenue well above the last public anchor; for it to resemble MongoDB-like territory, it would need dramatically more.

    That does not mean the valuation is irrational. Cockroach has unusually strong customer proof, real technical depth, and a category story around resilience, portability, and globally distributed transactional workloads. Those qualities deserve a premium to average infrastructure software and likely to weaker database franchises. There is a real difference between a premium asset and an easy entry point, and this chapter argues the company is more clearly the former than the latter.

    But quality alone cannot eliminate the need for discipline. The company also carries operational complexity, support intensity, and disclosure opacity that argue against paying an unlimited scarcity premium. The fair conclusion is that Cockroach deserves some premium, but current pricing already appears to capture a large share of it. Investors should assume the valuation needs to be earned with stronger private metrics, not merely admired from product quality.
