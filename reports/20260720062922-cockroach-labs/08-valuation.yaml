- id: SV003
  title: The right stance is constructive on company quality and cautious on entry price
  body: |-
    The valuation debate therefore comes down to hidden variables. If Cockroach is already well above $200 million in revenue, has strong net retention, contains support cost, and is proving a path toward durable infrastructure margins, the upper end of the private valuation range can make sense. If not, the current secondary price is ahead of what public evidence can underwrite.

    This is why the recommendation should be conditional rather than binary. The business appears to have the type of customer quality and technical relevance that investors want in a late-stage infrastructure company. But the price is no longer obviously early or forgiving. It is a price that expects good answers to diligence questions that have not yet been answered publicly. A disciplined investor can still like the setup while insisting on better evidence before calling the current entry attractive.

    The best investment posture is therefore to stay engaged, press hard on current metrics, and avoid confusing admiration for the product with proof that the current valuation is attractive. Cockroach Labs looks investable. It does not yet look cheap. That distinction is exactly what should govern the recommendation at this stage for disciplined investors.
