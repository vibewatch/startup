- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Revenue well below optimistic private expectations
    - Current ARR / revenue not convincingly above $200M
    - Premium-multiple case weakens sharply
    - Do not underwrite at current secondary price
  - - Weak retention or concentration
    - Subpar NRR or high top-customer dependence
    - Customer-quality thesis partially breaks
    - Apply material discount or pause
  - - Support-heavy economics
    - Gross margin and support cost look worse than expected
    - Operational complexity becomes financial drag
    - Reduce valuation tolerance
  - - Correctness / trust incident
    - Severe advisory or customer-visible failure in core accounts
    - Quality premium compresses fast
    - Reassess thesis immediately
  - - Private-market exuberance fades
    - Secondary demand weakens without new fundamentals
    - Price support disappears before business proof arrives
    - Avoid momentum-driven entry
  notes: Triggers focus on the few hidden variables most likely to change valuation quickly.
