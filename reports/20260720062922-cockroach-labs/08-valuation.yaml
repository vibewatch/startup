- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Current ARR / revenue
    - 2025-2026 actual revenue run rate
    - Determines whether current multiple is merely rich or deeply stretched
    - Finance leadership / board materials
  - - Net retention and gross retention
    - Segmented NRR / GRR
    - Shows whether premium customer proof converts into durable expansion
    - FP&A / RevOps
  - - Gross margin and support cost
    - Support / services intensity and cloud gross margin
    - Tests whether complexity is accretive or margin-dilutive
    - Finance + support leadership
  - - Customer concentration
    - Revenue share of top 10 / top 20 accounts
    - High concentration would raise downside risk materially
    - Finance + sales ops
  - - Cash runway and burn
    - Current cash balance and burn trajectory
    - Secondary price is not new cash
    - Finance / CFO
  - - Contract protections
    - Top-customer negotiated SLA / MSA deltas vs standard cloud terms
    - May reduce some web-term risk assumptions
    - Legal / sales leadership
  notes: These asks are prioritized in the order most likely to change valuation stance, not merely to fill curiosity gaps.
