chapter:
  number: 8
  title: Valuation
  summary: Cockroach Labs looks like a high-quality late-stage infrastructure asset with unusually strong customer proof and category relevance, but the current price signals still look demanding against public evidence. The market may be right that Cockroach deserves a premium; the problem is that public financial disclosure does not yet show enough to prove the current premium is attractive. The right valuation stance is therefore positive on company quality, cautious on entry price, and highly dependent on private diligence around current revenue, retention, margins, and concentration.
sections:
- id: SV001
  title: Current price signals imply a premium valuation with limited public financial support
  body: |-
    The most concrete valuation anchors are straightforward: Cockroach Labs last raised primary capital at a $5 billion valuation in late 2021, and secondary-market indicators in mid-2026 imply something closer to $6.9 billion. Those prices are not trivial achievements. They signal that the market continues to view Cockroach as a serious late-stage infrastructure asset rather than as a fading private round.

    The problem is what public numbers can actually support. The clearest revenue anchor still comes from a third-party 2023 estimate of about $128.3 million. Even if investors generously test a $170-200 million revenue range for 2025-2026, the implied revenue multiples remain very high. That means the current price already assumes meaningful hidden progress on revenue scale, retention, or margin quality. Public evidence therefore supports direction, but not enough precision to make the price feel conservative.

    In other words, the public market is not being asked whether Cockroach is good. It is being asked whether the company is good enough, large enough, and efficient enough to justify a premium multiple despite incomplete disclosure. That is a much harder question. The investment problem is therefore mostly one of valuation discipline rather than of company identification or simple awareness.
