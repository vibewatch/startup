evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, observer seats, liquidation preferences, and reserved-matter controls.
    whyItMatters: >-
      Late-stage private governance can shift downside protection and control rights in ways not visible from
      fundraising headlines alone.
    diligencePath: Request current cap table, board list, and latest financing documents in diligence.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: 2024-2026 ARR, revenue mix, gross margin, and cash runway beyond third-party estimates.
    whyItMatters: Secondary-market valuation cannot be underwritten rigorously without updated company-level financial metrics.
    diligencePath: Ask management for ARR bridge, customer mix, and board-approved budget or cash runway materials.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: minor
    topic: founder-roster
    missingEvidence: A clearly accessible official page naming the full co-founder roster and current roles.
    whyItMatters: Founder continuity influences key-person risk and narrative consistency in a founder-led infrastructure company.
    diligencePath: Confirm founding team composition with management or an official corporate history source.
    relatedQuestionRefs:
      - QO005
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone coverage
    missingEvidence: >-
      A fuller internal chronology covering non-public executive changes, customer wins, and incident reviews that do
      not surface in public releases.
    whyItMatters: >-
      The milestone table is the chronology of record for later chapters, so public-only evidence can understate
      material internal developments.
    diligencePath: Request a management-prepared timeline of financings, launches, leadership changes, and incidents since 2015.
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 leadership coverage
    missingEvidence: >-
      A complete public management roster and founder history with current roles, prior roles, and board committee
      coverage.
    whyItMatters: >-
      Leadership concentration and founder continuity affect key-person risk, but the accessible public record only
      exposes part of the roster.
    diligencePath: Request an org chart, founder biographies, and current executive roster from management.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: TO003 investor map coverage
    missingEvidence: >-
      A complete cap table including ownership percentages, preferred terms, and any current secondary-liquidity program
      participants.
    whyItMatters: >-
      Public sources name investors but not the exact control and economics that determine downside protection and
      dilution overhang.
    diligencePath: Request the cap table, financing documents, and any 2026 tender or employee-liquidity materials.
    relatedTableRefs:
      - TO003
  - type: sizing-missing
    severity: major
    topic: Public SAM and SOM for Cockroach Labs
    missingEvidence: >-
      No management-disclosed segmentation by deployment model, vertical, region, or paid-customer cohort that would
      permit a credible public-only SAM or SOM model.
    whyItMatters: Valuation work will otherwise smuggle unsupported share assumptions into market sizing.
    diligencePath: Request internal TAM/SAM/SOM framework, pipeline segmentation, and customer cohort counts.
    relatedTableRefs:
      - TM002
      - TM006
    relatedClaimRefs:
      - CM031
      - CM032
    relatedQuestionRefs:
      - QM020
      - QM021
  - type: methodology-opaque
    severity: minor
    topic: Third-party market-study methodology opacity
    missingEvidence: The accessible pages summarize results but not enough detail to fully audit market-definition choices and overlap.
    whyItMatters: The range between market studies is partly a methodology issue rather than only a true category difference.
    diligencePath: Obtain the full analyst reports or use public-company filing triangulation for bottom-up sizing.
    relatedTableRefs:
      - TM002
      - TM006
    relatedClaimRefs:
      - CM026
    relatedQuestionRefs:
      - QM019
      - QM025
  - type: buyer-mix-missing
    severity: minor
    topic: Budget-owner and deployment-mix precision
    missingEvidence: >-
      Public customer stories show use cases but not the exact budget owner, sales motion mix, or paid conversion
      funnel.
    whyItMatters: Adoption timing depends on who pays and how much internal change management each deal requires.
    diligencePath: Request sales-cycle data, champion profiles, and cloud-vs-self-hosted mix by ARR.
    relatedTableRefs:
      - TM003
      - TM008
    relatedClaimRefs:
      - CM013
      - CM028
      - CM029
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: Management-level win/loss data by competitor class, especially versus Aurora, Spanner, and Yugabyte.
    whyItMatters: >-
      Without real win-rate data, the moat analysis relies on positioning and customer proof rather than on observed
      conversion economics.
    diligencePath: Request pipeline, displacement, and renewal data segmented by source database and target deployment model.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: minor
    topic: private-rival-scale
    missingEvidence: Comparable current funding, revenue, or customer-scale disclosures for every private direct competitor.
    whyItMatters: >-
      Private-rival scale affects how hard each competitor can spend on GTM and product, but public comparability is
      weak.
    diligencePath: Use management interviews or paid databases to reconcile private competitor funding and commercial scale.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: current-financial-statements
    missingEvidence: Current ARR, growth, gross margin, burn, cash balance, and runway figures from management.
    whyItMatters: Without current operating metrics, the path to profitability and capital adequacy remain inferential.
    diligencePath: Request the latest board deck or operating snapshot with ARR, gross margin, burn, runway, and NRR.
    relatedQuestionRefs:
      - QI017
      - QI022
  - type: private-evidence-only
    severity: material
    topic: gtm-efficiency
    missingEvidence: CAC, payback, services attachment rate, and cloud-plan mix by customer cohort.
    whyItMatters: >-
      The business appears consultative, so GTM efficiency determines whether growth compounds efficiently or
      expensively.
    diligencePath: Request cohort-level CAC, payback, services revenue, and plan-mix disclosure from management.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI023
  - type: missing-source
    severity: material
    topic: independent-performance-benchmarks
    missingEvidence: >-
      Independent, workload-specific benchmarks comparing CockroachDB against direct distributed SQL rivals on the same
      workloads.
    whyItMatters: >-
      The strongest performance claims in the accessible source set are still vendor-authored and therefore insufficient
      for high-confidence technical underwriting.
    diligencePath: Request customer benchmark studies or reproduce representative workloads in a controlled proof-of-concept.
    relatedQuestionRefs:
      - QE024
  - type: private-evidence-only
    severity: minor
    topic: production-feature-adoption
    missingEvidence: >-
      Real customer adoption rates for cluster virtualization, vector indexing, row-level security, and AI-agent
      controls.
    whyItMatters: Public release notes show capability velocity, but not how much of the new surface is already production-proven.
    diligencePath: Request feature-adoption and support-volume data from product leadership.
    relatedQuestionRefs:
      - QE017
      - QE023
  - type: private-evidence-only
    severity: material
    topic: customer-cohort-economics
    missingEvidence: Current 2026 paying-customer count, cohort retention, net revenue retention, and concentration by top accounts.
    whyItMatters: >-
      The public customer story is strong on logos and anecdotes but insufficient for underwriting durability or revenue
      concentration risk.
    diligencePath: Request account-cohort tables, NRR by segment, and top-20 customer concentration from finance or GTM leadership.
    relatedQuestionRefs:
      - QU021
      - QU024
  - type: missing-source
    severity: minor
    topic: independent-customer-satisfaction
    missingEvidence: Independent survey or review coverage tied specifically to large production CockroachDB customers.
    whyItMatters: >-
      Vendor-authored stories can establish use, but they are less reliable for identifying pain points, support burden,
      or churn risk.
    diligencePath: Interview reference customers or obtain third-party satisfaction, support-ticket, and renewal data.
