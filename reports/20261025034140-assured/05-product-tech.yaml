  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Structured data intake", "Capture and validate machine-readable FNOL inputs", "Policy and claimant data plus intake channels", "Incomplete or biased inputs can propagate downstream errors"]
      - ["Claims-tuned models and agents", "Extract, classify, summarize, communicate, and support decisions", "Frontier model providers and quality data", "Model drift, prompt injection, and provider changes require controls"]
      - ["Deterministic rules and guardrails", "Protect coverage, routing, auditability, and escalation outcomes", "Claims rules and policy interpretation", "Rules may be incomplete or conflict with model output"]
      - ["Orchestration and integrations", "Sequence handoffs across systems and modules", "Carrier legacy cores and external data/services", "Integration effort, latency, and failure recovery are not publicly quantified"]
      - ["Monitoring and human oversight", "Evaluate behavior and escalate exceptions", "Claims teams, supervisors, and operational feedback", "Public materials do not disclose SLOs, test results, or override metrics"]
    notes: "This architecture is a synthesis of the company's described workflow and control components, not a disclosed reference architecture; dependency and risk fields identify diligence items."
    claimRefs: [CE005, CE010, CE011, CE012, CE013, CE018]
figures:
  - id: FE001
    title: Assured claims-processing architecture
    type: stack
    summary: A layered view of the publicly described path from structured intake through controlled automation and human escalation.
    data:
      layers:
        - label: "1. Data and intake"
          detail: "Publicly described inputs and evidence capture."
          items:
            - name: "Digital FNOL"
              detail: "Dynamic questions, validation, and structured claim data."
            - name: "Documents and images"
              detail: "Receipts, photos, forms, and other claim evidence."
        - label: "2. Intelligence"
          detail: "Models and rules transform claim data into usable signals."
          items:
            - name: "Claims-tuned agents"
              detail: "Extraction, clarification, summarization, and customer interaction."
            - name: "Deterministic logic"
              detail: "Rules and decision controls for high-stakes workflow steps."
        - label: "3. Orchestration"
          detail: "Workflow services coordinate systems, people, and communications."
          items:
            - name: "Triage and routing"
              detail: "Severity, complexity, coverage, and jurisdiction-based progression."
            - name: "Messaging and service assignment"
              detail: "Cross-channel communication and coordinated next actions."
        - label: "4. Outcomes and oversight"
          detail: "Settlement, fraud support, monitoring, and human review."
          items:
            - name: "Settlement and fraud signals"
              detail: "Automation for selected simple claims and investigation support."
            - name: "Monitoring and human escalation"
              detail: "Evaluations, monitoring, and adjuster review where judgment is required."
        - label: "5. Carrier integration"
          detail: "Existing carrier systems remain a deployment dependency."
          items:
            - name: "Claims core interfaces"
              detail: "The public materials describe fitting around existing systems."
        - label: "6. Governance"
          detail: "Trust, safety, and regulatory evidence remain diligence requirements."
          items:
            - name: "Assurance artifacts"
              detail: "Public evidence does not provide a complete independent control mapping."
    approximationNotes: "Layer ordering represents the workflow described in Assured's public materials; it does not assert a specific deployment topology or causal performance relationship."
    claimRefs: [CE005, CE006, CE007, CE010, CE011, CE012]
callouts:
  - calloutType: strength
    title: "Vertical workflow focus"
    body: "Assured's product surface is unusually specific to P&C claims: it names intake, evidence collection, routing, fraud, messaging, and settlement rather than presenting a generic horizontal AI assistant."
    claimRefs: [CE001, CE002, CE005]
  - calloutType: risk
    title: "Controls are described, not independently demonstrated"
    body: "The public record describes guardrails, evaluations, monitoring, and human oversight, but does not provide independent error, incident, certification, or reliability evidence sufficient to underwrite those controls."
    claimRefs: [CE010, CE011, CE012, CE013, CE018]
  - calloutType: recommendation
    title: "Diligence production boundaries"
    body: "Request a module-by-module production reference set with baseline metrics, exception rates, model and rule change controls, integration scope, audit artifacts, and incident history before treating the platform as mature enterprise infrastructure."
    claimRefs: [CE009, CE014, CE018]
