  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: company-underwriting
      missingEvidence: Current ARR or revenue, growth rate, booked-versus-recognized bridge, GRR, NRR, gross margin, burn, and runway.
      whyItMatters: A financing valuation cannot be tested against a revenue or cash-efficiency denominator without current company financials.
      diligencePath: Obtain monthly management accounts, ARR bridge, cohort retention, gross-margin definition, cash balance, burn, and runway under NDA.
      relatedQuestionRefs: [QV003, QV006]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: capitalization
      missingEvidence: Fully diluted cap table, liquidation preferences, SAFEs, debt, option pool, and investor rights.
      whyItMatters: The $1B post-money headline may not equal common-equity value or investor proceeds in a downside outcome.
      diligencePath: Review the latest cap table, charter, preferred-stock purchase agreement, side letters, debt schedule, and modeled waterfall.
      relatedQuestionRefs: [QV001, QV002]
      relatedTableRefs: [TV001]
    - type: missing-source
      severity: material
      topic: comparable-transactions
      missingEvidence: A current, independently verified private-company transaction or claims-software comparable with disclosed revenue and valuation terms.
      whyItMatters: Guidewire's public market capitalization and the 2025 financing mark do not create a defensible current forward multiple for Assured.
      diligencePath: Request banker or investor market data and triangulate against disclosed claims-software financings, M&A, and secondary transactions.
      relatedQuestionRefs: [QV006, QV007]
      relatedTableRefs: [TV003]
    - type: access-blocked
      severity: minor
      topic: financing
      missingEvidence: The intended Techmeme, Yahoo Finance, and FurtherAI article texts were not substantively available in their assigned fetches.
      whyItMatters: The financing headline is corroborated by Forge but not independently triangulated by the assigned article URLs.
      diligencePath: Obtain a working original publisher or investor announcement and re-check the round amount, valuation, date, and terms.
      relatedQuestionRefs: [QV001, QV002]
