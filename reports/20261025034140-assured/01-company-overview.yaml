company:
  name: Assured
chapter:
  number: 1
  title: Company Overview
  summary: Assured is a Palo Alto-based P&C claims-software company that Tracxn dates to 2019. Independent profiles converge on a $1 billion valuation but conflict on the March 2025 round structure, while current revenue, customer, governance, and primary financing evidence remain unavailable.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Tracxn classifies Assured Insurance Technologies as a Palo Alto seed company founded in 2019 and describes it as a SaaS claims-processing provider for property-and-casualty insurers. Its profile says the product ingests, services, and processes claims through modules that include first notice of loss, messaging, fraud detection, and catastrophe management. That supports a vertical workflow-software identity, not an insurance-risk-bearing business. The commercial problem is credible: JD Power found material use of digital tools across claims touchpoints, while Deloitte found that fragmented claims processes persist despite insurer technology investment. Those market observations explain buyer need but do not verify Assured's own outcomes.
    claimRefs: [CO001, CO004, CO010, CO011, CO012]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, team, and governance
    body: >-
      Tracxn identifies Justin Lewis-Weber as co-founder and CEO and Theo Patt as co-founder and CTO, supporting a founder-led operating picture. Forge's narrative also names Lewis-Weber and a 2019 Palo Alto origin, but the same page's structured details instead show a 2011 Orlando founding and unrelated leaders; those internally inconsistent fields should not be used as corroboration. Tracxn reports 227 employees as of August 31, 2026, versus 74 in a December 31, 2024 legal-entity row, but no assigned source provides a board roster, ownership breakdown, succession plan, or functional headcount mix. The generic RocketReach retrieval did not add Assured-specific evidence.
    claimRefs: [CO002, CO003, CO009, CO016]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Financing, valuation, and stakeholders
    body: >-
      Forge reports $42.09 million of total funding and lists seed financings in 2019 and 2020, followed by four March 4, 2025 financing rows at a $1 billion post-money valuation. Tracxn instead calls the latest and only round an undisclosed seed financing on March 5, 2025, with ICONIQ Capital and Kleiner Perkins participating. Both sources therefore support the valuation headline, but they do not provide a cleanly reconciled financing history: their round dates, labels, amounts, and counts differ. Funding raised is not cash available, and the assigned evidence does not establish current cash, debt, secondary volume, ownership, or fully diluted valuation mechanics.
    claimRefs: [CO005, CO006, CO007, CO008, CO015]
    tableRefs: [TO003]
  - id: scale-and-milestones
    title: Scale signals and milestone record
    body: >-
      Public scale evidence is uneven. Tracxn's 74-to-227 employee series suggests substantial team expansion between year-end 2024 and August 2026, but no current revenue, ARR, customer count, retention, or deployment list is available in the assigned pool. Guidewire's own page claims more than 270 customers in over 30 countries, and Stock Analysis reports an $11.33 billion Guidewire market capitalization as of July 10, 2026. Those are competitor and public-market context, not independent proof of Assured's scale or a valuation benchmark. The dated company record supports founding and financing milestones, but product launches, customer deployments, partnerships, regulatory events, and adverse incidents remain material chronology gaps.
    claimRefs: [CO009, CO013, CO014]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Focused vertical workflow
    body: The retained evidence consistently places Assured in P&C claims workflow software, with product coverage across intake, communication, fraud detection, and catastrophe handling.
    claimRefs: [CO004, CO010, CO011]
  - calloutType: risk
    title: Financing record requires reconciliation
    body: The $1 billion valuation appears in both Forge and Tracxn, but their round dates, labels, amounts, and counts conflict and neither is primary financing documentation.
    claimRefs: [CO006, CO007, CO008]
  - calloutType: recommendation
    title: Underwrite primary operating proof
    body: Treat the valuation and headcount as diligence starting points until management supplies financing documents, a current KPI bridge, customer evidence, and governance materials.
    claimRefs: [CO008, CO009]
