    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Tracxn classifies Assured Insurance Technologies as a Palo Alto seed company founded in 2019 and describes
              it as a SaaS claims-processing provider for property-and-casualty insurers. Its profile says the product
              ingests, services, and processes claims through modules that include first notice of loss, messaging,
              fraud detection, and catastrophe management. That supports a vertical workflow-software identity, not an
              insurance-risk-bearing business. The commercial problem is credible: JD Power found material use of
              digital tools across claims touchpoints, while Deloitte found that fragmented claims processes persist
              despite insurer technology investment. Those market observations explain buyer need but do not verify
              Assured's own outcomes.
