  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Market demand and financing evidence support further diligence, while missing operating and capitalization
      evidence prevents a buy decision.
    data:
      nodes:
        - id: scale
          label: Claims modernization need
          detail: Leakage, legacy systems, cycle time, and customer-experience pressure.
        - id: proof
          label: Financing proof
          detail: $23.35M Series B at a reported $1B post-money valuation.
        - id: gap
          label: Underwriting gaps
          detail: Current revenue, retention, margins, cap table, liquidity, and customer ROI.
        - id: risk
          label: Downside sensitivity
          detail: Illiquidity, preference overhang, slower growth, or a down round.
        - id: action
          label: Diligence action
          detail: Obtain private operating, customer, and capitalization evidence.
        - id: decision
          label: Research-more
          detail: Reassess price only after evidence closes the critical gaps.
      edges:
        - - scale
          - proof
        - - proof
          - gap
        - - gap
          - risk
        - - risk
          - action
        - - action
          - decision
    approximationNotes: Qualitative decision chain; no valuation multiple or probability is inferred from the figure.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV010
      - CV015
