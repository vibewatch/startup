      - number: '4.3'
        title: Public outcomes are value proxies, not unit economics
        blocks:
          - type: paragraph
            body: >-
              The disclosed operating outcomes suggest that Assured can reduce carrier handling effort, but they do not
              reveal Assured's own gross margin or sales efficiency. The forward-deployed model may support enterprise
              adoption while adding implementation labor and customer-specific delivery cost; public evidence cannot
              quantify that tradeoff. Competitor-operated insurance surfaces show the broader economic value of claims
              automation: Lemonade says roughly 40% of claims are handled instantly, while Root says a claim can be
              filed in three minutes. These are not independent benchmarks and do not establish Assured's economics.
              CAC, sales cycle, payback, gross retention, net retention, hosting cost, services mix, and customer
              concentration all remain private diligence items.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI014
              - CI015
