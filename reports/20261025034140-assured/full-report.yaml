        title: Strong operating claims do not resolve revenue quality
        blocks:
          - type: paragraph
            body: >-
              Assured says six of the ten largest US property-and-casualty carriers use the platform and advertises a
              six-day cycle-time reduction, more than five calls eliminated, 70% of interactions handled autonomously,
              and a 4.8 claimant-satisfaction score. These are useful willingness-to-pay signals, but the page does not
