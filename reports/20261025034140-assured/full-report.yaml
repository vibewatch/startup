    summary: >-
      Evidence narrows from a broad AI claims-processing category to observable P&C claims-experience populations,
      without converting samples into unsupported software-spend estimates.
    data:
      items:
        - label: Global AI insurance claims processing category
          value: Scope disclosed; value not disclosed
          valueNote: >-
            Research and Markets page lists global category and segment structure but no accessible numeric market
            value.
        - label: P&C customer-experience evidence
          value: Nearly 4,000 responses
          valueNote: Deloitte analysis across 12 property-and-casualty carriers.
        - label: U.S. property claims evidence
          value: 5,093 customers
          valueNote: JD Power 2026 study of homeowners who filed a property claim.
        - label: Digital FNOL adoption
          value: 38%
          valueNote: Share using digital tools to report first notice of loss in JD Power study.
        - label: Digital photo submission
          value: 49%
          valueNote: Share submitting photos used to estimate or pay a claim in JD Power study.
        - label: Digital claim updates
          value: 45%
          valueNote: Share receiving claim updates digitally in JD Power study.
    approximationNotes: >-
      Items are ordered evidence layers, not comparable currency stages; no conversion rate or proportional market size
      is implied.
