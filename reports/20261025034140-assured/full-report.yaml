            body: >-
              Conflicting aggregate funding totals cannot establish current liquidity. Cash, burn, debt, working
              capital, and committed spend are required before assigning runway.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
          - type: callout
            title: Underwrite from contracts and cohorts, not headline automation
            body: >-
              The next diligence step is a contract-level revenue bridge paired with customer cohorts, delivery labor,
