  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and maturity
        blocks:
          - type: paragraph
            body: >-
              Assured defines its product around the full P&C claims lifecycle rather than a single point task. The
              official product surface lists FNOL, voice AI, first contact, service assignment, messaging, Emma,
              Sidekick, fraud detection, and CAT capabilities, and says modular solutions can be adopted incrementally.
              The company also claims work across tens of millions of claims annually and use by six of the top ten
              carriers, but these are company statements rather than independently audited deployment records. The
              public product evidence therefore supports a coherent platform thesis and enterprise orientation, while
              leaving the customer-by-customer production footprint, service levels, and module attach rates unresolved.
            claimRefs:
              - CE001
              - CE002
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE010
      - number: '5.2'
        title: Claims workflow and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The operating model begins with structured FNOL data and uses automation to move information between
              systems and stakeholders. Assured describes dynamic intake, validation, coverage and eligibility checks,
              documentation collection, triage and routing, fraud signals, omnichannel communications, and an
              auto-settlement path for selected low-severity claims. Its own guide says modular components can fit
              around existing systems, while the implementation model emphasizes pilots and phased expansion. That is a
              plausible integration strategy for carriers with legacy cores, but public materials do not enumerate
              supported APIs, deployment topology, data residency, recovery objectives, or customer-specific integration
              effort. Those omissions matter because claims are high-stakes and regulated.
            claimRefs:
              - CE005
              - CE006
