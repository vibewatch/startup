  - id: FI001
    title: Publicly observable revenue-model bridge
    type: flow
    summary: >-
      Assured discloses the operating chain through customer outcomes, while contract value, recognized revenue, and
      gross profit remain private.
    data:
      nodes:
        - id: structured-intake
          label: Structured claim intake
          detail: FNOL and related workflows collect machine-readable inputs.
        - id: augmented-data
          label: Data augmentation
          detail: The platform says it integrates with more than 50 external data sources.
        - id: workflow-automation
          label: Workflow automation
          detail: Agentic follow-up, messaging, assignment, CAT, and fraud workflows automate carrier tasks.
        - id: operating-outcomes
          label: Carrier operating outcomes
          detail: Company claims include lower cycle time, fewer calls, and autonomous interaction handling.
        - id: contract-value
          label: Contract value
          detail: Pricing unit, discounts, implementation fees, and realized ACV are undisclosed.
        - id: recognized-economics
          label: Recognized revenue and gross profit
          detail: Revenue recognition, services mix, inference cost, and gross margin are undisclosed.
    approximationNotes: Conceptual sequence only; no conversion rates, contract values, revenue amounts, or margins are inferred.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI007
      - CI016
  - id: FE001
    title: Assured claims-processing architecture
    type: stack
    summary: >-
      A layered view of the publicly described path from structured intake through controlled automation and human
      escalation.
    data:
      layers:
        - label: 1. Data and intake
          detail: Publicly described inputs and evidence capture.
          items:
            - name: Digital FNOL
              detail: Dynamic questions, validation, and structured claim data.
            - name: Documents and images
              detail: Receipts, photos, forms, and other claim evidence.
        - label: 2. Intelligence
          detail: Models and rules transform claim data into usable signals.
          items:
            - name: Claims-tuned agents
              detail: Extraction, clarification, summarization, and customer interaction.
            - name: Deterministic logic
              detail: Rules and decision controls for high-stakes workflow steps.
        - label: 3. Orchestration
          detail: Workflow services coordinate systems, people, and communications.
          items:
            - name: Triage and routing
              detail: Severity, complexity, coverage, and jurisdiction-based progression.
            - name: Messaging and service assignment
              detail: Cross-channel communication and coordinated next actions.
        - label: 4. Outcomes and oversight
          detail: Settlement, fraud support, monitoring, and human review.
          items:
            - name: Settlement and fraud signals
              detail: Automation for selected simple claims and investigation support.
            - name: Monitoring and human escalation
              detail: Evaluations, monitoring, and adjuster review where judgment is required.
        - label: 5. Carrier integration
          detail: Existing carrier systems remain a deployment dependency.
          items:
            - name: Claims core interfaces
              detail: The public materials describe fitting around existing systems.
        - label: 6. Governance
          detail: Trust, safety, and regulatory evidence remain diligence requirements.
          items:
            - name: Assurance artifacts
              detail: Public evidence does not provide a complete independent control mapping.
    approximationNotes: >-
      Layer ordering represents the workflow described in Assured's public materials; it does not assert a specific
      deployment topology or causal performance relationship.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: Customer journey from carrier problem to expansion proof
    type: journey-map
    summary: >-
      The available evidence supports a carrier claims workflow value hypothesis, while production proof and expansion
      remain unverified.
    data:
      nodes:
        - id: carrier-need
          label: Carrier claims pressure
          detail: Longer claim cycles and customer-experience pressure are documented at industry level.
          touchpoints:
            - FNOL and claim intake
            - Repair and settlement timing
        - id: evaluation
          label: Enterprise evaluation
          detail: A carrier would need to test workflow fit, integration, governance, and measurable outcomes.
          touchpoints:
            - Claims operations
            - Technology and risk review
        - id: deployment
          label: Production deployment
          detail: Assured's assigned public evidence does not verify a named production carrier deployment.
          touchpoints:
            - Pilot versus production
            - Referenceable customer
        - id: usage
          label: Repeat usage
          detail: No active-account, utilization, renewal, or cohort evidence is retained for Assured.
          touchpoints:
            - Usage and renewal
            - Module or location expansion
        - id: expansion
          label: Expansion proof
          detail: Expansion, concentration, and customer ROI remain open diligence questions.
          touchpoints:
            - NRR or GRR
            - Top-customer share and ROI
        - id: reference
          label: Referenceability
          detail: Permissioned customer references and baseline-to-outcome evidence are not in the assigned pool.
          touchpoints:
            - Customer reference calls
            - Baseline and denominator
