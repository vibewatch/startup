              - CI012
              - CI014
              - CI015
      - number: '4.4'
        title: Capital adequacy cannot be established from public evidence
        blocks:
          - type: paragraph
            body: >-
              Aggregate funding data are internally inconsistent across current third-party surfaces: GetLatka reports
              $32.5 million raised, while Forge reports $42.09 million. The discrepancy may reflect different round
              coverage, instruments, or data quality, but the available pages do not reconcile it. Forge also shows no
              available Forge Price, so the page offers no current observable secondary-price anchor. CCC Intelligent
              Solutions' $4.51 billion public market capitalization supplies sector context, not a direct valuation or
              revenue multiple for Assured. With no disclosed cash balance, monthly burn, debt, working-capital profile,
              capex, committed spend, or runway, funding raised cannot be converted into cash available. The financial
              verdict is therefore research-more: demand signals are credible enough to warrant diligence, but margin
              path and financing dependency are not publicly underwritable.
