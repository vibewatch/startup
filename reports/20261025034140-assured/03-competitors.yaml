      - [Contract model, "Not disclosed", "Not disclosed", "Not disclosed", "Clarify subscription, usage, implementation, and services components"]
      - [Claims workflow breadth, "Intake through orchestration and adjudication are claimed", "Full claims lifecycle and intake are described", "Tractable is damage-assessment focused; Hi Marley is communication focused", "Assured may differentiate on orchestration breadth if verified"]
      - [Integration and APIs, "Integration-free deployment is described in the profile; API detail is unavailable", "Guidewire marketplace and integrations; Duck Creek reports 2,600-plus APIs and 100-plus partner integrations", "Tractable uses open APIs; Hi Marley reports 60-plus APIs and webhooks", "Integration depth and migration effort need technical diligence"]
      - [Implementation support, "Forward Deployed Teams are described by ITC", "Guidewire reports 800-plus consulting partners", "Specialist support varies and is not quantified in retained evidence", "Services capacity may influence time to value and gross margin"]
      - [Customer outcome proof, "No independent outcome evidence retained", "Vendor pages include customer quotations and claimed benefits", "Hi Marley reports call and voicemail reductions; Tractable claims accuracy and speed", "Require reference calls and baseline-to-post-deployment measurements"]
    notes: "No retained source provides comparable public list pricing or realized contract economics. All unknown cells are intentionally preserved as unknown."
    claimRefs: [CP011, CP012, CP013, CP014]
