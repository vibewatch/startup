chapter:
  number: 6
  title: Customers
  summary: Assured targets insurance carriers with automated claims workflows, but the assigned public evidence does not verify a named Assured production customer, retention metric, or customer concentration profile. The evidence supports a credible carrier buying problem and a plausible enterprise go-to-market, while leaving adoption durability and referenceability as material diligence gaps.
sections:
  - id: buyer-and-segment
    title: Buyer, user, and segment
    body: >-
      The assigned evidence positions Assured as a B2B insurance-technology vendor selling into
      large insurance carriers rather than a consumer application. A preserved recruiting page describes
      the product as automated claims software, B2B, early stage, and intended for deployment to some
      of the largest insurance carriers, but it is a company job-market repost rather than customer
      proof. The customer is therefore best segmented as a carrier or claims organization; the buyer
      is likely an enterprise operations, claims, or technology function, while claims handlers and
      policyholders are downstream users. No assigned source discloses payer terms, pricing, contract
      length, geography mix, or revenue by segment, so the commercial segmentation remains directional.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption signals and retention evidence
    body: >-
      Public evidence is stronger on the market need than on Assured's realized adoption. JD Power's
      2024 property-claims study, based on 6,019 homeowner customers, reports a 23.9-day average claim
      cycle, a 34.2-day average for catastrophe claims, and materially different satisfaction outcomes
      for digital users depending on settlement speed. Those are industry benchmarks, not Assured
      outcomes, but they define measurable customer value hypotheses for a claims-automation vendor:
      cycle-time reduction, clearer communication, and fewer handoffs. The assigned pool contains no
      Assured NRR, GRR, churn, renewal, utilization, active-account, or cohort data. A job listing's
      statement that the company planned to deploy to large carriers demonstrates intent, not completed
      production adoption.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: proof-expansion-and-concentration
    title: Proof quality, expansion, and concentration
    body: >-
      The named-customer record is not yet referenceable from the assigned sources. Competitor pages
      show that carrier software vendors commonly publish customer counts, implementations, named
      insurer references, and operational metrics, while Assured's retained evidence does not disclose
      an equivalent list. This asymmetry should not be read as evidence that Assured has no customers;
      it means the public record is insufficient to distinguish pilot from production, logo from usage,
      or initial land from expansion. AI-related deployment also creates procurement and governance
      friction: EIOPA describes insurance-sector responsibilities for providers and deployers, while
      NIST frames AI risk management as a voluntary framework for trustworthy design, development, use,
      and evaluation. The missing commercial proof and governance artifacts make customer durability,
      expansion, and concentration unresolved.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
    figureRefs: [FU001]
figures:
