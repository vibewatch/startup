      - ["Catastrophe claim cycle time", "34.2 days average", "2024 study", "Independent industry study", high, "Shows a difficult operating segment where automation could matter", "Not an Assured result"]
      - ["Digital-user repair cycle time", "15 days average", "2024 study", "Independent industry study", high, "Digital workflow can correlate with faster processing, subject to expectation management", "Not an Assured result or causal estimate"]
      - ["Assured customer count", null, "As of 2026-10-25", "Not disclosed in assigned pool", low, "Cannot assess breadth, repeat usage, or concentration", "Active accounts and definition are missing"]
      - ["Assured retention", null, "As of 2026-10-25", "Not disclosed in assigned pool", low, "Cannot assess durability or expansion", "NRR, GRR, churn, renewals, and cohorts are missing"]
    notes: "The JD Power values are industry benchmarks from a 6,019-customer study, not Assured KPIs. Nulls mean the assigned evidence did not disclose the metric; they are not zeroes."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or proof category, Segment, Deployment or use case, Production versus pilot, Outcome, Limitation]
    rows:
      - ["Named Assured customer", "P&C insurance carrier", "Claims automation", "Not disclosed", null, "No assigned source names a customer or verifies use"]
      - ["Assured customer outcome", "P&C insurance carrier", "Claims intake, orchestration, or settlement", "Not disclosed", null, "No assigned source provides a customer-quoted outcome"]
      - ["Assured expansion reference", "P&C insurance carrier", "Repeat purchase, module attach, or additional locations", "Not disclosed", null, "No assigned source supports expansion or repeat deployment"]
      - ["Industry reference benchmark", "Homeowner insurance customers", "Property claims reporting, estimation, settlement, and repair", "Observed study population", "Cycle time and satisfaction vary by digital use and settlement speed", "JD Power benchmark does not identify Assured"]
      - ["Competitor reference benchmark", "P&C insurance carriers", "Claims-management software implementations", "Vendor-reported customer deployments", "Guidewire reports 270+ customers in more than 30 countries and publishes three insurer references", "Competitor evidence is not Assured evidence"]
    notes: "The first three rows are explicit evidence gaps, not claims that the company has no customers. The last two rows provide context only and must not be used as Assured adoption or retention proof."
    enumerationScope:
      coverage: partial
      basis: "Assigned prefetched sources available for public named-customer and deployment verification as of 2026-10-25"
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
callouts:
  - calloutType: insight
    title: Real customer proof is the gating diligence item
    body: Assured has a plausible carrier use case, but the assigned public evidence cannot distinguish a pilot, production deployment, or repeat expansion. Request referenceable customers, deployment status, quantified outcomes, renewal data, and concentration before underwriting durable adoption.
    claimRefs: [CU003, CU009, CU010, CU012]
  - calloutType: risk
    title: Governance can lengthen enterprise adoption
    body: Insurance AI deployments carry provider and deployer responsibilities, including governance, transparency, data controls, and incident processes. The assigned sources do not establish which controls Assured provides or which obligations its carrier customers retain.
    claimRefs: [CU013, CU014]
