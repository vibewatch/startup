      - [Investigation and service assignment, "Workflow automation across injury, repair, rental, and related services", "Active modules; pricing undisclosed", "Module expansion potential, unverified", "Attach rate, partner economics, and transaction fees"]
      - [CAT and fraud workflows, "Triage and inconsistency detection across the claims lifecycle", "Active modules; utilization undisclosed", "Event-driven or module revenue possible, unverified", "Contract structure, seasonal usage, and loss-cost attribution"]
      - [Forward-deployed delivery, "Embedded product, engineering, and claims experts", "Company-claimed service model", "May accelerate deployment but dilute software margin", "Services revenue, staffing ratio, implementation duration, and gross margin"]
    notes: "Mechanisms and status are from Assured's official pages; every monetization unit and revenue-quality assessment is explicitly unverified pending contracts and financial statements."
    claimRefs: [CI001, CI005, CI007, CI016]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Offer, Public price or unit, List versus realized, What is known, Underwriting implication]
    rows:
      - [Enterprise platform, null, "Neither disclosed", "Six of the top ten US P&C carriers reportedly use Assured", "Adoption is visible, but ACV and concentration are not"]
      - [Modular workflow products, null, "Neither disclosed", "Multiple claims workflows are marketed as modules", "Expansion potential cannot be translated into NRR or revenue mix"]
      - [Implementation and forward-deployed support, null, "Neither disclosed", "Embedded delivery team is described", "Services mix and implementation cost could materially affect gross margin"]
      - [Annual company revenue, "$22M estimate for September 2025", "Third-party estimate, not company-reported", "GetLatka attributes the estimate to Growjo", "Do not treat as ARR, recognized revenue, or current cash generation"]
    notes: "Null means no public price or contract unit was found in the assigned prefetched evidence; the $22 million figure is a third-party annual-revenue estimate, not ARR."
    claimRefs: [CI001, CI002, CI008, CI009, CI016]
  - id: TI003
    title: Unit economics and capital-readiness ledger
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Annual revenue, "$22M estimate, Sep. 2025", "Low", "Only public scale proxy; not ARR or recognized revenue", "Audited monthly revenue, ARR bridge, deferred revenue, and bookings"]
      - [Carrier penetration, "6 of top 10 US P&C carriers", "Medium; company-claimed", "Supports enterprise demand but not customer count or concentration", "Named production deployments, ACV distribution, and top-five concentration"]
      - [Cycle-time impact, "6-day reduction", "Medium; company-claimed", "Potential customer ROI and pricing support", "Baseline, cohort, observation period, and independent customer validation"]
      - [Interaction automation, "70% handled autonomously", "Medium; company-claimed", "Potential labor savings and model-cost leverage", "Escalation rate, inference cost, QA cost, and contribution margin"]
      - [Gross margin, null, "Unavailable", "Determines software versus services economics", "Gross margin by software, implementation, support, and AI-inference cost"]
      - [CAC and payback, null, "Unavailable", "Tests efficiency of enterprise carrier acquisition", "Sales cycle, fully loaded CAC, payback, pipeline conversion, and channel economics"]
      - ["Cash, burn, debt, and runway", null, "Unavailable", "Determines financing dependency and next-round timing", "Cash statement, monthly burn, debt/SAFE schedule, covenants, and 24-month plan"]
    notes: "Values are company claims or labeled third-party estimates; null denotes unavailable public evidence rather than zero."
    claimRefs: [CI002, CI003, CI005, CI008, CI009, CI012, CI014, CI015]
