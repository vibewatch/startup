callouts:
  - calloutType: risk
    title: Funding is not cash available
    body: >-
      Conflicting aggregate funding totals cannot establish current liquidity. Cash, burn, debt,
      working capital, and committed spend are required before assigning runway.
    claimRefs: [CI010, CI011]
  - calloutType: recommendation
    title: Underwrite from contracts and cohorts, not headline automation
    body: >-
      The next diligence step is a contract-level revenue bridge paired with customer cohorts,
      delivery labor, inference cost, retention, and cash planning.
    claimRefs: [CI002, CI005, CI008, CI009, CI016]
