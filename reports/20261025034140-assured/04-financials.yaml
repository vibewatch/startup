company:
  name: Assured
chapter:
  number: 4
  title: Financials
  summary: >-
    Assured publicly demonstrates enterprise adoption and operating outcomes, but it does not
    disclose pricing, recognized revenue, gross margin, burn, or runway. A third-party $22 million
    annual-revenue estimate is therefore a traction proxy rather than an underwritable revenue base,
    while conflicting aggregate funding figures further limit confidence in capital adequacy.
sections:
  - id: revenue-architecture
    title: Revenue architecture is visible, but monetization is not
    body: >-
      Assured presents a modular claims-automation platform spanning intake, first contact, injury
      investigation, service assignment, messaging, catastrophe response, and fraud workflows. The
      commercial logic is plausible: structured claim data is augmented through more than 50
      external data sources, then used to automate carrier work and improve cycle time. Assured also
      describes a forward-deployed team of product, engineering, and claims specialists embedded
      with customers, indicating that deployment includes a material service component. Public
      evidence does not identify whether contracts are priced per carrier, module, claim,
      interaction, implementation, or outcome. It also does not separate recurring software fees
      from implementation or services revenue, so revenue quality and recognition remain open.
    claimRefs: [CI001, CI007, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: traction-and-pricing
    title: Strong operating claims do not resolve revenue quality
    body: >-
      Assured says six of the ten largest US property-and-casualty carriers use the platform and
      advertises a six-day cycle-time reduction, more than five calls eliminated, 70% of
      interactions handled autonomously, and a 4.8 claimant-satisfaction score. These are useful
      willingness-to-pay signals, but the page does not provide cohorts, measurement periods,
      denominators, or realized contract values. GetLatka states that Assured has not published
      revenue and attributes a September 2025 estimate of about $22 million annually to Growjo.
      That figure is neither ARR nor recognized revenue and should not be treated as either.
      No public price list, discount schedule, revenue mix, retention rate, or booked-to-recognized
      bridge was available in the assigned evidence.
    claimRefs: [CI002, CI003, CI004, CI005, CI006, CI008, CI009]
    tableRefs: [TI002]
  - id: unit-economics
    title: Public outcomes are value proxies, not unit economics
    body: >-
      The disclosed operating outcomes suggest that Assured can reduce carrier handling effort, but
      they do not reveal Assured's own gross margin or sales efficiency. The forward-deployed model
      may support enterprise adoption while adding implementation labor and customer-specific
      delivery cost; public evidence cannot quantify that tradeoff. Competitor-operated insurance
      surfaces show the broader economic value of claims automation: Lemonade says roughly 40% of
      claims are handled instantly, while Root says a claim can be filed in three minutes. These are
      not independent benchmarks and do not establish Assured's economics. CAC, sales cycle,
      payback, gross retention, net retention, hosting cost, services mix, and customer
      concentration all remain private diligence items.
    claimRefs: [CI003, CI004, CI005, CI014, CI015, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy cannot be established from public evidence
    body: >-
      Aggregate funding data are internally inconsistent across current third-party surfaces:
      GetLatka reports $32.5 million raised, while Forge reports $42.09 million. The discrepancy may
      reflect different round coverage, instruments, or data quality, but the available pages do
      not reconcile it. Forge also shows no available Forge Price, so the page offers no current
      observable secondary-price anchor. CCC Intelligent Solutions' $4.51 billion public market
      capitalization supplies sector context, not a direct valuation or revenue multiple for
      Assured. With no disclosed cash balance, monthly burn, debt, working-capital profile, capex,
      committed spend, or runway, funding raised cannot be converted into cash available. The
      financial verdict is therefore research-more: demand signals are credible enough to warrant
      diligence, but margin path and financing dependency are not publicly underwritable.
    claimRefs: [CI010, CI011, CI012, CI013]
