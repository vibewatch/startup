        - label: Cloud/model-provider dependency
          values: [medium, high, unverified, high]
        - label: Customer concentration and runway
          values: [unknown, high, unverified, high]
    approximationNotes: "Qualitative risk placement; no numeric probabilities or Assured-specific incident frequencies were disclosed in the assigned evidence."
    claimRefs: [CR001, CR006, CR009, CR013]
callouts:
  - calloutType: risk
    title: High residual exposure is evidence-driven, not incident-claimed
    body: "The high-risk posture reflects the consequence of AI, privacy, cyber, and dependency exposures combined with missing Assured-specific control and resilience evidence; it does not assert that Assured has suffered a disclosed incident."
    claimRefs: [CR003, CR009, CR013]
  - calloutType: assumption
    title: Valuation is not liquidity
    body: "A Forge-reported $1 billion post-money valuation and reported funding history do not establish cash available, runway, gross margin, or the absence of preference and dilution effects."
    claimRefs: [CR014, CR015, CR016]
