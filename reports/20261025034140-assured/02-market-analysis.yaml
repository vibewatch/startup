    claimRefs: [CM005, CM006, CM007, CM008, CM009]
callouts:
  - calloutType: risk
    title: SAM, SOM, pricing, and ROI remain unverified
    body: >-
      Public evidence does not isolate Assured's reachable carrier segment, contract economics,
      implementation burden, realized customer ROI, or expansion behavior. Those gaps limit any
      market-based valuation conclusion.
    claimRefs: [CM009]
