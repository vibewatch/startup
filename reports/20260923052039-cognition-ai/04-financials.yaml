company:
  name: Cognition AI
chapter:
  number: 4
  title: Financials
  summary: "Cognition AI has executed one of the fastest ARR trajectories in enterprise AI history: from $0 to approximately\
    \ $155M combined ARR in under 24 months, fueled by $696M in venture capital across three rounds at valuations from $350M\
    \ to $10.2B. The company is pre-GAAP profit with high ACU unit costs, an unusual usage-based pricing model, and limited\
    \ publicly disclosed financial data. Key uncertainties include gross margin, customer retention, and whether the Windsurf\
    \ ARR is sticky under the Cognition brand. A reported $25B+ valuation as of early 2026 implies a 160x forward ARR multiple\u2014\
    elevated even by hypergrowth standards.\n"
sections:
- id: SI-revenue-model
  title: Revenue Model and ARR Trajectory
  body: "Cognition AI operates a consumption-based SaaS revenue model anchored to Agent Compute Units (ACUs)\u2014a proprietary\
    \ token of compute capacity consumed per autonomous task. Individual developers subscribe at $20 per month (Core plan:\
    \ 5 ACUs), teams at $500 per month (Team plan: 250 ACUs), and enterprises under custom contracts with volume discounts\
    \ and additional ACU pools. The pricing ladder is designed to monetize proportionally to task complexity and volume, making\
    \ it structurally different from seat-based tools like GitHub Copilot or Cursor. However, this model creates lumpy revenue:\
    \ enterprise customers with variable sprint workloads may have uneven monthly consumption patterns, requiring careful\
    \ cohort-level analysis to distinguish durable ARR from one-time expansion.\nCognition's ARR trajectory has been one of\
    \ the most rapid in enterprise AI history. The company exited the first six months of operations with negligible revenue,\
    \ crossed $1M ARR in September 2024, reached $73M ARR by June 2025\u2014a 73x increase in nine months\u2014and then jumped\
    \ to approximately $155M combined ARR following the July 2025 Windsurf acquisition ($82M ARR contributed). The Cognition\
    \ AI blog post from September 2024 (\"Funding, Growth, and the Next Frontier of AI Coding Agents\") confirmed the $73M\
    \ ARR figure and outlined the company's two-product strategy. Post-Windsurf, the combined entity has a bifurcated revenue\
    \ base: Devin's enterprise automation revenue (high ACV, low seat count) and Windsurf's IDE subscription revenue (lower\
    \ ACV, higher seat count). Separating and growing both lines while integrating the teams is a material execution risk.\n\
    As of April 2026, reports suggest the company is in discussions for additional financing at a potential $25B+ valuation,\
    \ implying investors believe ARR will continue growing materially above $155M. However, post-acquisition ARR disclosed\
    \ figures should be interpreted cautiously: the $82M Windsurf ARR contribution was measured at time of acquisition and\
    \ may not reflect post-migration retention rates.\n"
  tableRefs:
  - TI001
  figureRefs:
  - FI001
  claimRefs:
  - CI001
- id: SI-funding-capital
  title: Funding History and Capital Structure
  body: "Cognition AI has raised approximately $696 million in venture capital across three primary rounds in under 18 months,\
    \ making it one of the fastest-funded AI infrastructure companies on record. The seed/Series A in March 2024 raised approximately\
    \ $21 million at a $350 million pre-money valuation from Founders Fund, signaling early conviction in the founding team\
    \ before any product revenue. In April 2024, just weeks after launch, Cognition closed $175 million at a $2 billion post-money\
    \ valuation\u2014again led by Founders Fund\u2014crossing unicorn status within six months of founding. The September\
    \ 2025 Series B raised $400 million at a $10.2 billion post-money valuation, with co-investors including Lux Capital,\
    \ 8VC, Elad Gil, Bain Capital Ventures, D1 Capital, Definition Capital, and Swish Ventures. VentureBeat and TechCrunch\
    \ confirmed this round in September 2025.\nThe company disclosed a remarkably low net cash burn of under $20 million from\
    \ founding through Q3 2025\u2014extraordinary given the fundraising scale\u2014suggesting the bulk of capital was held\
    \ in reserve rather than spent on headcount or infrastructure at a rate typical for similar-stage companies. The Windsurf\
    \ acquisition in July 2025 was estimated at approximately $250 million, funded from existing capital reserves without\
    \ a new primary raise\u2014a sign of financial discipline given the scale of the transaction relative to employee count.\
    \ Post-acquisition headcount reportedly reached approximately 249 before layoffs of 30 employees and the departure of\
    \ Windsurf personnel who accepted the 9-month buyout offer.\n"
  tableRefs:
  - TI002
  claimRefs:
  - CI001
- id: SI-unit-economics
  title: Unit Economics and Margin Structure
  body: "Cognition's unit economics are difficult to model precisely because the company does not disclose gross margins,\
    \ customer acquisition cost (CAC), or cohort-level retention data. However, structural inferences are possible. The ACU\
    \ model implies a cost-of-revenue that is partially variable (inference compute per task) and partially fixed (model hosting,\
    \ sandbox environments, CI/CD infrastructure). Enterprise AI inference at frontier model scale (likely GPT-4 or Claude\
    \ API calls per task) can cost $5\u2013$50 per hour of agent runtime at current cloud spot prices, while enterprise ACU\
    \ packages price at roughly $2.25 per ACU with 250 ACUs per Team plan month\u2014creating a gross margin that depends\
    \ heavily on task length and model call efficiency.\nHigh-value enterprise contracts (Goldman Sachs, Citi, Nubank) likely\
    \ have custom pricing with volume discounts that could improve margin at scale if infrastructure costs are amortized across\
    \ large task volumes. The Nubank case study reporting a 12x efficiency improvement in code migration workflows suggests\
    \ that customers perceive strong value relative to developer hours saved\u2014a favorable indicator for pricing power.\
    \ However, the inherent challenge for fully autonomous coding agents is that task complexity variance is high: simple\
    \ bug fixes cost little to execute but complex multi-week feature builds can consume compute budget disproportionately.\
    \ Unless Cognition gates task scope at the enterprise level, margin management at scale will require sophisticated compute\
    \ forecasting.\nThe company's capital efficiency pre-acquisition (sub-$20M burn on $350M+ raised before revenue scale)\
    \ contrasts sharply with the likely post-acquisition cost structure. Adding 250 employees (Windsurf personnel) to a ~49-person\
    \ team more than quadruples headcount, compressing per-employee revenue significantly in the near term unless post-integration\
    \ synergies materialize quickly.\n"
  tableRefs:
  - TI003
  claimRefs:
  - CI001
- id: SI-public-gaps
  title: Public Financial Data Gaps and Disclosure Limitations
  body: "Cognition AI is a privately held Delaware C-corporation with no public filing obligations, no disclosed GAAP financial\
    \ statements, and no investor day or earnings calls. All financial data in this chapter relies on: (1) company-authored\
    \ blog posts; (2) third-party news reports citing unnamed sources; (3) investor communications and press release summaries;\
    \ and (4) secondary market research estimates. This disclosure posture is typical for pre-IPO AI companies but creates\
    \ material risk for investors and customers attempting to verify sustainability of the ARR trajectory.\nThe most significant\
    \ undisclosed financial metrics are: gross margin by product line (Devin vs. Windsurf), customer churn and net revenue\
    \ retention (NRR), CAC and payback period, enterprise deal sizes and contract lengths (ACV), and post-Windsurf integration\
    \ costs. Without NRR data, it is impossible to distinguish whether the $73M to $155M ARR jump reflects organic customer\
    \ expansion or purely inorganic acquisition contribution. Enterprise AI tool contracts in other companies typically show\
    \ NRR of 100\u2013140% when adoption is strong; if Cognition's NRR is below 100%, the underlying Devin-only ARR may be\
    \ stagnating despite the Windsurf injection. Sacra, CB Insights, and other secondary research platforms provide partial\
    \ revenue and headcount estimates that must be treated as approximations.\nA secondary concern is the reported $25B+ valuation\
    \ discussions in early 2026, which would imply a forward revenue multiple of approximately 160x on $155M ARR. While extreme\
    \ multiples are historically common for hypergrowth AI companies in their early stages, they are sustainable only if ARR\
    \ continues growing at 2x+ annually\u2014a bar that requires substantial new enterprise customer acquisition and retention\
    \ of the Windsurf base. Any deceleration in ARR growth would make the valuation multiple compress significantly.\n"
  claimRefs:
  - CI001
- id: SI-capital-adequacy
  title: Capital Adequacy and Financial Runway
  body: "With approximately $696M raised and sub-$20M cash burn disclosed through Q3 2025, Cognition had substantial financial\
    \ runway heading into 2026 even before any new financing. The Windsurf acquisition consumed an estimated $250M of that\
    \ reserve, leaving approximately $426M available minus ongoing operating expenses. At a conservative 200-employee burn\
    \ rate of $400K per employee-year (blended fully-loaded cost), annual operating costs could be $80M or higher excluding\
    \ compute. If the company is generating $155M ARR with moderate gross margins (estimated 50\u201370% given inference costs),\
    \ gross profit could fund ongoing operations without immediate new capital. However, the $25B+ valuation discussions suggest\
    \ the company is seeking capital to accelerate\u2014not merely to sustain\u2014operations. Expected uses of new capital\
    \ include R&D for Devin next-generation models, enterprise sales force expansion, global data center capacity for inference\
    \ at scale, and potential further acquisitions to consolidate the AI coding infrastructure market.\nThe Founders Fund\
    \ lead investor relationship provides additional runway optionality: Founders Fund has historically shown willingness\
    \ to lead follow-on rounds for breakout portfolio companies, reducing financing risk. The presence of large institutional\
    \ co-investors (D1 Capital, Bain Capital Ventures) signals access to crossover and late-stage capital. Overall capital\
    \ adequacy is rated medium-high: the company has sufficient runway for at least 24 months at current burn estimates, but\
    \ aggressive growth execution and integration costs from Windsurf could accelerate burn faster than current estimates\
    \ suggest.\n"
  claimRefs:
  - CI001
