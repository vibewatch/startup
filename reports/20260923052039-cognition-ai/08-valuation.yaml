    status: answered
    answerSummary: ~$73M ARR (April 2025) per Growjo and Sacra third-party estimates; not confirmed by Cognition in any official
      disclosure. December 2024 GA launch ARR was ~$1M.
  - id: QV002
    question: What is the post-money valuation at each disclosed Cognition AI funding round and what step-ups do they imply?
    type: quantification
    targets:
    - contentRequirements/2
    status: answered
    answerSummary: "Seed ~$100\u2013200M est. (2023); Series A $2B (Jan/Apr 2025); Post-Windsurf round $10.2B (Sep 2025).\
      \ Step-up from Series A to post-Windsurf: 5.1\xD7 in ~9 months."
