company:
  name: Cognition AI
chapter:
  number: 8
  title: Valuation
  summary: "Cognition AI's most recent disclosed valuation is $10.2B (September 2025), anchored by a $400M round post-Windsurf\
    \ acquisition. ARR is estimated at $73M (April 2025) implying a ~140\xD7 ARR multiple\u2014extreme even in the AI-native\
    \ software cohort, where Cursor trades at ~20\xD7 ARR ($9.9B/$500M ARR). The bull thesis rests on a once-in-a-decade market\
    \ transition (autonomous software engineering) with a demonstrated 70\xD7/year ARR growth rate, enterprise lighthouse\
    \ customers, and a uniquely integrated IDE+agent platform post-Windsurf. The bear thesis rests on benchmark commoditization\
    \ (Claude Code Opus 4 at 72.5% SWE-bench Verified vs. Devin's 13.86% Full), an undisclosed customer concentration, security\
    \ overhang, and LLM provider dependency on direct competitors. A conditional watchlist recommendation is appropriate:\
    \ investors should monitor for NRR disclosure, margin improvement, post-Windsurf integration proof, and entry at a valuation\
    \ that prices realistic rather than bull-case execution. Entry at >$10B without NRR/margin data requires high conviction\
    \ in the autonomous engineering market thesis and tolerance for binary risk.\n"
sections:
- id: SV-investment-thesis
  title: Investment Thesis and Anti-Thesis
  body: "The bull thesis for Cognition AI rests on three mutually reinforcing propositions. First, autonomous software engineering\
    \ represents a genuine market category shift\u2014 not an incremental productivity improvement. The total addressable\
    \ market for software development labor exceeds $650B globally; even a 10% displacement of developer time through autonomous\
    \ agents implies a $65B+ revenue opportunity. Cognition's Devin product is the category pioneer, establishing the autonomous\
    \ coding agent as a procurement line item at leading enterprises before most buyers understand the category. First-mover\
    \ brand recognition, lighthouse customer proof (Nubank), and the Windsurf IDE network (250K+ DAU) create a platform moat\
    \ that sustains pricing power beyond pure benchmark performance. Second, the ARR trajectory from $1M (GA, December 2024)\
    \ to an estimated $73M (April 2025) in nine months implies a growth rate that is structurally disconnected from historical\
    \ SaaS benchmarks. At this growth rate, the company could plausibly reach $500M ARR within 18 months of the April 2025\
    \ data point, which would place it in the cohort of fastest-growing enterprise SaaS companies in history and justify a\
    \ $10B+ valuation on forward ARR multiple compression. Third, the co-founders' deep technical backgrounds and Founders\
    \ Fund's conviction investment create a signal that the founding team can sustain the product velocity needed to maintain\
    \ differentiation.\nThe anti-thesis is equally forceful. Benchmark commoditization is the existential risk: Claude Code\
    \ Opus 4's 72.5% SWE-bench Verified score in 2025 versus Devin's 13.86% Full score at launch demonstrates that the performance\
    \ gap is closing at a rate that may eliminate Cognition's technical differentiation by late 2026. The $10.2B valuation\
    \ at ~140\xD7 estimated trailing ARR prices in near-flawless execution on a trajectory that has no published corroboration\
    \ beyond Growjo estimates. Customer concentration risk is unquantified: $73M ARR from an undisclosed number of enterprise\
    \ accounts could mean three to five contracts, where a single defection triggers a material ARR decline. The December\
    \ 2024 prompt-injection security incident\u2014discovered during a live stream\u2014 damaged Cognition's credibility among\
    \ technically sophisticated buyers at a critical early-adoption inflection point. LLM provider dependency on Anthropic\
    \ and OpenAI, both of whom compete directly with Devin, introduces a structural conflict-of-interest that could manifest\
    \ as sudden API pricing increases or feature restrictions that raise Devin's marginal cost of delivery. Without NRR, gross\
    \ margin, or cohort retention data, the financial quality of the reported ARR cannot be independently assessed.\n"
  tableRefs:
  - TV001
  figureRefs:
  - FV001
  claimRefs:
  - CV001
- id: SV-valuation-context
  title: Valuation Context and Financing History
  body: "Cognition has completed three disclosed financing rounds totaling approximately $1.575B. The $21M seed round established\
    \ the founding team in 2023. The $175M Series A (January to April 2025, Founders Fund IX lead) set the initial institutional\
    \ valuation at $2B post-money. SEC EDGAR records confirm Founders Fund IX (CIK 0001971631) as a large institutional vehicle\
    \ that committed capital to Cognition; the Cognition Capital SPV I (CIK 0002072175, Form D filed 2025-06-11) indicates\
    \ a follow-on structured vehicle was established concurrent with or shortly after the Windsurf acquisition close. The\
    \ $400M round (September 2025) valued the company at $10.2B post-money, a 5.1\xD7 step-up from the Series A in approximately\
    \ nine months\u2014one of the steepest step-up trajectories in AI software history. The total financing of ~$1.575B implies\
    \ approximately 15%+ dilution on a $10.2B post-money basis, though exact preference stack and liquidation waterfall are\
    \ not disclosed. At the $10.2B valuation, the primary revenue multiple is approximately 140\xD7 the April 2025 ~$73M ARR\
    \ estimate\u2014a premium to all disclosed AI software peers. Cursor/Anysphere closed its Series D at $9.9B on approximately\
    \ $500M ARR (September 2025), implying a 20\xD7 ARR multiple. Cognition's premium is partially justified by its superior\
    \ growth rate and category-pioneer positioning but represents execution risk priced in for investors entering at $10B+.\
    \ The Windsurf acquisition (July 2025) was completed via Cognition equity and cash for an undisclosed purchase price;\
    \ the Cognition Capital SPV I suggests a structured investor-level vehicle, possibly used to fund the acquisition consideration\
    \ or backstop the combined entity's operating plan. A \"culture reset\" reported by Winbuzzer in August 2025\u2014Cognition\
    \ offering nine-month buyouts to Windsurf staff and reportedly requiring 80-hour workweeks\u2014introduces talent integration\
    \ risk not reflected in the headline valuation. Any new institutional investor at $10.2B would face a meaningful preference\
    \ overhang from the seed, Series A, and $400M round before reaching par on any return calculation below a $10.2B exit\
    \ value.\n"
  tableRefs:
  - TV002
  claimRefs:
  - CV001
- id: SV-scenario-analysis
  title: Bull, Base, and Bear Scenario Analysis
  body: "The bull scenario assumes Devin's ARR continues at a sustained 50% quarterly growth rate through 2027, reaching approximately\
    \ $700M\u2013$800M ARR by end of 2027. At this scale, with improving gross margins from model cost optimization and volume\
    \ contracts, Cognition would likely command an IPO or acquisition valuation of $15\u201325B\u2014a 1.5\u20132.5\xD7 return\
    \ from $10.2B entry. The bull case requires: no material security incidents post- December 2024; successful Windsurf integration\
    \ adding a credible IDE channel; NRR disclosed at \u2265120%; and competitor models failing to commoditize at Devin's\
    \ enterprise workflow integration depth. The base scenario assumes moderate ARR growth (30\u201340% quarterly decay from\
    \ the 2025 sprint) reaching $200\u2013350M ARR by end of 2027, with gross margin improvement to 50\u201360%. At a normalized\
    \ 25\u201335\xD7 forward ARR multiple (consistent with high-growth AI SaaS), this implies a $5\u201312B valuation\u2014\
    at or near flat to entry at $10.2B, suggesting negligible return for investors at that entry. The base case requires no\
    \ major churn events, reasonable Windsurf integration, and sustained AI infrastructure investment by enterprises. The\
    \ bear scenario assumes a material adverse event within 18 months: a second security incident, Nubank churn, or a Devin\
    \ price war triggered by Claude Code or OpenAI Codex commoditization. Under the bear case, ARR plateaus at $80\u2013120M,\
    \ NRR is disclosed below 90%, and the valuation compresses to 10\u201315\xD7 ARR implying an $800M\u2013$1.8B exit value\u2014\
    a 90%+ capital loss for investors entering at $10.2B. The bear trigger probability is estimated at 20\u201330% given the\
    \ concentration of known risk factors, particularly the security overhang and the structural benchmark commoditization\
    \ trend. Return expectations are asymmetric: the bull upside (1.5\u20132.5\xD7 in 3 years) does not adequately compensate\
    \ for a 30%+ probability of severe capital loss at a $10.2B entry valuation. This is the core investment thesis challenge:\
    \ the risk-adjusted return at current entry is unattractive unless the investor has high-conviction, differentiated information\
    \ about NRR and gross margin that the market does not.\n"
  tableRefs:
  - TV003
  claimRefs:
  - CV001
- id: SV-comparable-analysis
  title: Comparable Company Valuation Analysis
  body: "Cognition's peer group for comparables purposes includes AI-native developer productivity tools (Cursor, Replit),\
    \ foundation model providers with coding products (Anthropic/Claude Code, OpenAI/Codex), and broader enterprise AI SaaS\
    \ companies at comparable ARR run-rates. Cursor/Anysphere is the closest comparator: both are AI coding tools targeting\
    \ enterprise developers, both are VC-backed, and both reached their most recent valuations in the second half of 2025.\
    \ Cursor closed its Series D at $9.9B (Bloomberg, November 2025) on approximately $500M ARR\u2014an 18\u201320\xD7 ARR\
    \ multiple. Cognition at $10.2B on ~$73M ARR implies a ~140\xD7 ARR multiple, a 7\u20138\xD7 premium to Cursor on ARR-basis.\
    \ The Cognition premium is partially justified by higher growth rate (Devin grew faster from launch) but is structurally\
    \ unsustainable as Cursor's ARR ($500M) already demonstrates greater revenue quality and breadth. Harvey AI (legal AI,\
    \ $3B valuation, ~$100M ARR, ~30\xD7 ARR) represents a vertical AI SaaS comparator where high-quality NRR justifies premium\
    \ multiples. Glean (enterprise AI search, $4.6B, ~$100M ARR, ~46\xD7 ARR) demonstrates that enterprise AI SaaS can sustain\
    \ 40\u201350\xD7 ARR multiples at $100M ARR, but NRR at Glean is reported above 150%. Replit ($1.16B valuation, 2023,\
    \ development platform with AI pivot) represents the category risk: a pioneer pivot story that lost market share to more\
    \ focused AI-native competitors. The implied IPO entry multiple for AI SaaS companies at or near profitability in 2025\
    \ is approximately 15\u201325\xD7 forward ARR; Cognition at $10.2B and ~$73M ARR would need to reach $400\u2013680M ARR\
    \ before an IPO at standard multiples would preserve the $10.2B entry valuation. No public market comparator exists: GitHub\
    \ Copilot is embedded in Microsoft Azure revenue, Amazon Q in AWS, and Claude Code in Anthropic's API revenue. Private\
    \ market premium over public comps is historically 20\u201340% for growth-stage AI; this suggests a fair-value range for\
    \ Cognition (on base-case assumptions) of $3\u20137B, below the $10.2B last round, implying the current round was priced\
    \ at a 1.5\u20133\xD7 speculative premium to intrinsic value. Entry discipline\u2014waiting for either ARR confirmation\
    \ at $300M+ or valuation correction to $4\u20136B\u2014is the appropriate investor response.\n"
  claimRefs:
  - CV001
- id: SV-exit-readiness
  title: Exit Readiness and Final Diligence Asks
  body: "Cognition is 2\u20134 years from an IPO readiness event given current ARR trajectory and the disclosure gap that\
    \ public markets require. For IPO at $8B+ market capitalization, the company needs approximately $400\u2013500M ARR, positive\
    \ unit economics (40%+ gross margin), disclosed NRR above 120%, and a cleared SOC 2 Type II + GDPR compliance infrastructure.\
    \ M&A exit paths exist: Microsoft (GitHub Copilot/Azure positioning), Alphabet (Google Cloud developer tools), Salesforce\
    \ (developer productivity within Einstein platform), or Snowflake/Databricks (data engineering automation) are logical\
    \ acquirers. The $10.2B valuation makes a strategic acquirer path challenging: Microsoft's prior GitHub acquisition at\
    \ $7.5B (2018) was at scale, and a $10.2B bid for Cognition would be among the largest Microsoft AI acquisitions\u2014\
    requiring board-level conviction. The most likely exit path remains late-stage private equity / pre-IPO crossover participation,\
    \ with an IPO window in 2028\u20132030 if ARR trajectory sustains. Final diligence priorities before investment: (1) NRR\
    \ by cohort\u2014disclosed above 110% is a green flag; below 90% is thesis-break; (2) gross margin at scale\u2014target\
    \ 50%+ gross; (3) penetration test report from post- Devin-2.0 audit; (4) Windsurf integration roadmap with customer retention\
    \ data from the acquired base; (5) LLM provider contract terms including agentic use-case pricing floors; (6) GPAI compliance\
    \ plan and EU regulatory timeline; (7) top-5 customer ARR concentration (>50% from top-5 is a material concentration risk);\
    \ and (8) headcount by function to assess burn relative to ARR coverage ratio. Thesis-break conditions: a second disclosed\
    \ security incident within 12 months, NRR disclosed below 90%, ARR growth rate deceleration to <50% YoY, or a confirmed\
    \ major enterprise customer churn event.\n"
  claimRefs:
  - CV001
