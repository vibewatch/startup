- id: market-sizing
  title: "Market Sizing \u2014 TAM, SAM, and SOM"
  body: "Multiple independent sizing lenses are applied to bound the opportunity and reconcile widely varying analyst estimates.\
    \ The lens approach is preferred over a single top-down estimate given material methodological variation across sources.\n\
    Lens 1 \u2014 AI code tools market (Mordor Intelligence, 2025): The broad AI code tools market is valued at $7.37B in\
    \ 2025 and forecast to reach $23.97B by 2030 at a 26.6% CAGR. This covers all AI-assisted coding tools from IDE plugins\
    \ through full agents. TAM candidate: $7.4B (2025), $24B (2030). Limitation: overly broad; includes low-code tools, documentation\
    \ AI, and testing automation not directly comparable to Devin's buyer profile.\nLens 2 \u2014 Developer seats \xD7 willingness-to-pay:\
    \ 27\u201328.7 million professional developers globally (Evans Data / Statista 2024). GitHub Copilot at $10\u2013$19/month\
    \ captures approximately 1.3 million paid seats from this pool in 2025. Autonomous agent tools targeting enterprise buyers\
    \ at $500\u2013$5,000/month per team are addressable to perhaps 10% of enterprise engineering teams\u2014roughly 500K\u2013\
    1M developer seats \xD7 $2,000/year average contract value = $1B\u2013$2B SAM in 2026, expanding to $5B\u2013$8B by 2030\
    \ as adoption broadens.\nLens 3 \u2014 Enterprise software engineering spend share: Global software spending reached approximately\
    \ $675\u2013 $700B in 2024 (WIPO). Even a 1% shift of software project labor costs to AI tools implies a $6.7B market;\
    \ a 3% shift implies $20B. This is an upper-bound lens corroborating the Mordor $24B 2030 figure.\nLens 4 \u2014 Gartner\
    \ adoption curve: Gartner forecasts 90% of enterprise engineers using AI code assistants by 2028 versus 14% in early 2024.\
    \ Total estimated enterprise engineering headcount globally approximately 15 million. At 90% penetration \xD7 $500/year\
    \ average price = $6.75B enterprise sub-segment alone by 2028. These estimates conflict materially: the narrow Grand View\
    \ Research figure of $92\u201398M by 2030 excludes coding-adjacent AI tools entirely, while the $97.9B ResearchAndMarkets\
    \ figure appears to use an atypically broad scope that inflates the addressable market. Diligence should weight the $1\u2013\
    8B SAM range most heavily.\n"
