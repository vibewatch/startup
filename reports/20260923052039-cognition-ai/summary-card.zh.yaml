summary:
  headline: >-
    Cognition AI 开创了自主软件工程这一新品类，ARR 在 9 个月内从 $1M 增至 $73M；但 $10.2B 估值相当于约 140×
    ARR，已计入近乎完美的执行预期。与此同时，基准成绩正迅速趋同，关键财务数据仍未披露。
