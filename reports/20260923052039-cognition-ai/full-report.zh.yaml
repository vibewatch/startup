chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Cognition AI 是一家总部位于旧金山的 AI 原生软件公司，开发执行端到端软件工程任务的自主智能体。其旗舰产品 Devin 被公司定位为全球首个 AI
              软件工程师：该智能体只需极少人工干预，就能理解工单需求、规划解决方案、编写与调试代码、运行测试并部署至生产环境。公司采取 SaaS 订阅模式：面向个人开发者与小型团队的 Core 方案为 $20/month；包含
              250 个智能体计算单元（ACU）的 Team 方案为 $500/month；企业定制合同则提供 VPC 部署选项。2025 年 7 月收购 AI 原生开发工具 Windsurf 后，Cognition
              拓宽了产品组合，兼顾全自主智能体与交互式 IDE 两类开发者。这套双产品策略让 Cognition 得以同时切入智能体自动化赛道与 GitHub Copilot、Cursor
              主导的传统代码助手市场。公司收入以用量计费为主：超出方案配额的智能体计算单元单价约 $2.25/ACU，按量模式随企业任务量同步扩展。公司仅以官网和博客作为对外公开渠道，从未披露 GAAP
              财务数据，仅经由投资者通报与官方新闻稿发布信息。
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.2'
        title: 创始人与管理团队
        blocks:
          - type: paragraph
            body: >-
              Cognition AI 由三位顶尖竞技编程选手联合创立，三人均获国际信息学奥林匹克竞赛（IOI）金牌，公司从创立之初就有扎实的技术基础。CEO Scott Wu 曾三次摘得 IOI 金牌，是 2011 年全美
              MATHCOUNTS 冠军，并持有哈佛大学经济学学位。在 Codeforces 竞技编程平台上，Wu 拥有最高段位“传奇特级大师”（Legendary Grandmaster），持续保持顶尖算法解题能力。创立
              Cognition 之前，他曾联合创办 AI 职场社交产品 Lunchclub。CTO Steven Hao 同样是 IOI 金牌得主，此前任职于 Scale
              AI、DeepMind、Waymo、Nuro、Modal 和 Cursor，履历横跨前沿 AI 研究与工业级工程系统。CPO Walden Yan 则统领产品，兼备 IOI 级算法功底。公司成立初期约 10
              人的初始团队共手握 10 枚 IOI
              金牌，这种竞技编程人才集中度在早期初创公司中极其罕见。该背景吸引了顶级资方与顶尖人才，但也带来了显著的关键人风险：创始人技术声誉已与公司市场定位深度绑定。截至目前，官方未见公开披露任何董事会构成或独立董事信息。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: 融资历程与投资方
        blocks:
          - type: paragraph
            body: >-
              Cognition AI 的资本聚集速度创下近年风投史纪录。2024 年 3 月，公司在几乎未产生规模收入的情况下完成约 $21M 初始种子/Series A 轮融资，投后估值约
              $350M，显示出投资机构对创始团队执行力的押注。仅数周后的 2024 年 4 月，Cognition 便以 $2B 估值敲定 $175M 融资，成立仅半年便跃升为独角兽。Peter Thiel 旗下的
              Founders Fund 连续领投两轮，既提供资金，也向市场释放了对团队的背书。2025 年 9 月，在收购 Windsurf 且 ARR 快速增长之际，Cognition 按 $10.2B 投后估值完成
              $400M 融资，累计融资额达约 $696M。参与 2025 年 9 月该轮融资的跟投方包括 Lux Capital、8VC、知名天使投资人兼操盘手 Elad Gil、Bain Capital
              Ventures、D1 Capital、Definition Capital 以及 Swish Ventures。截至 2026 年 5 月，据报道公司正就新一轮融资接洽，潜在估值达 $25B+，显示资本对智能体
              AI 编程基础设施的投资热度仍在。值得注意的是，公司披露自创立至 2025 年 Q3 的净现金消耗低于 $20M，表明在收购 Windsurf 前，其快速增长伴随着较高的资金使用效率。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO016
