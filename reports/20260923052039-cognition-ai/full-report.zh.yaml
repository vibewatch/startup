      - number: '7.2'
        title: 安全与技术风险
        blocks:
          - type: paragraph
            body: >
              Cognition 最核心的产品风险，在于 Devin 拥有很高的系统权限——能自主编写、执行、测试甚至部署代码——因此比被动代码补全工具面临更大的攻击面。2024 年 12
              月的一场公开直播演示曝光了一起提示词注入漏洞：攻击者只需在代码仓库的 README 文件中藏入恶意指令，就可能诱使 Devin 窃取密钥、发起未授权 API 调用，甚至在客户代码库中植入后门。Cognition
              承认了这一漏洞并予以修补。然而这起事故暴露了核心短板：其在正式商用上线前，对高居 OWASP 大模型应用十大风险榜首的提示词注入（LLM01）防御加固严重不足。Cognition 安全主页确认其拥有 SOC 2
              Type II 认证（2024 年 3
              月通过审计）、传输与静态数据全加密以及全员多因素认证（MFA）。但其安全信任中心要求签署保密协议（NDA）后方肯公开渗透测试报告、审计范围及第三方评估结论——导致大企业采购团队难以独立检验其控制措施的有效性。当前遗留的核心缺口包括：未建立公开的漏洞悬赏计划（bug-bounty）；缺乏正式的智能体安全框架；尚无公开渗透测试范围或红蓝对抗演练结果；未公布服务可用性协议（SLA）及历史可用率数据。2025
              年 4 月上线的 Devin 2.0 进一步开放了直接合并 PR 以及在客户基础设施上调度智能体的权限，若未来再次发生提示词注入攻击，造成的影响范围将呈指数级扩大。OWASP 生成式 AI
              安全项目已将智能体自主性列为超越传统 LLM 漏洞的独立全新风险类别。随着 VPC 部署扩大至数百家企业，潜伏的 Devin
              漏洞一旦遭到利用，可能同时污染多家跨国企业的底层代码资产——这种系统性供应链极端尾部风险，绝非个别企业自身的安全团队能够独立化解。
            claimRefs:
              - CR001
