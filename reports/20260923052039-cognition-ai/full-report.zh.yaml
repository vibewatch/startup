      - number: '4.3'
        title: 单元经济模型与利润率结构
        blocks:
          - type: paragraph
            body: >
              由于 Cognition 从未披露毛利率、获客成本（CAC）或客户队列留存数据，其单元经济模型难以精确建模，但仍可推断其结构特征。ACU
              计费机制意味着营业成本兼具可变部分（每次任务调用的推理算力）与固定部分（模型托管、沙箱隔离环境及 CI/CD 基础设施）。按现有云端现货价格，前沿模型级别（单次任务调用 GPT-4 或 Claude
              API）的企业 AI 推理成本在每智能体运行小时 $5–$50 不等；而企业 ACU 套包折合单价约 $2.25/ACU，Team 方案每月包含 250 个 ACU——这使毛利率高度依赖任务时长与模型调用效率。

              高客单价企业合同（高盛、Citi、Nubank）很可能享受附带阶梯折扣的定制化定价，若基础设施成本可分摊至海量任务中，规模效应有望改善利润率空间。Nubank 案例报告代码迁移工作流实现 12x
              效率提升，表明客户高度认可其相较于节约工程师工时的经济价值——构成支撑定价权的积极信号。然而，全自主编程智能体固有的挑战在于任务复杂度方差极大：简易 Bug
              修复算力开销极小，而复杂的跨周功能开发则可能不成比例地耗尽算力预算。除非 Cognition 在企业端实施严格的任务边界设卡，否则规模化毛利管理需要极其精细的算力预测体系。

              公司在收购前极高的资金使用效率（在商业化放量前融资 $350M+，现金消耗却低于 $20M）与收购后的成本结构形成鲜明对比。将约 250 名 Windsurf 员工并入原约 49
              人的初创团队，使人员编制翻了四倍有余，若整合协同效应无法迅速兑现，短期内将显著摊薄人均产出创收。
            claimRefs:
              - CI001
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI009
