        - 列入观察名单——入场估值低于 $5B 时考虑有条件投资
        - ARR 增长异常强劲；估值倍数处于 140× ARR 的极端水平；安全与集中度风险尚未解决
        - 中
        - 持续监控 NRR、毛利率与整合进展；入场估值须严守纪律
      - - 风险评级
        - 高
        - 曾发生安全事件；基准评测日趋同质化；依赖外部 LLM；客户集中度未知
        - 高
        - 按 $10.2B 估值入场，一旦执行受挫，本金面临高度减值风险
      - - 估值判断
        - 投机性溢价——当前 $10.2B 估值对应约 140× ARR，达 Cursor 估值倍数的 7×
        - Cursor 为 $9.9B / $500M ARR = 20× ARR；Cognition 为 $10.2B / $73M ARR = 140× ARR
        - 中
        - 基准情景下合理估值区间为 $3–7B；高于 $7B 入场须有乐观情景验证支撑
      - - 乐观情景目标
        - $18–25B 退出估值（持有 3 年，$700M+ ARR，25–35× 远期 ARR）
        - 增速具备可持续性；Windsurf 整合成功；NRR ≥120%
        - 低-中
        - 按 $10.2B 入场对应 1.5–2.5× 回报；仅在接近完美执行下才能满足 VC 的 IRR 要求
      - - 悲观情景目标
        - $800M–$1.8B 退出估值（再次发生安全事件，或客户大幅流失，或竞对降价超 3×）
        - 安全阴霾未散；基准评测日趋同质化；LLM 定价风险
        - 中
        - 按 $10.2B 入场本金损失超 90%；若无更高确定性的 NRR 数据，风险收益严重不对称，难以接受
