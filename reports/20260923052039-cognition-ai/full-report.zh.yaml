      - number: '6.2'
        title: 采用轨迹与增长指标
        blocks:
          - type: paragraph
            body: >
              Cognition AI 最突出的业务指标是年经常性收入（ARR）的快速增长：从正式商业化上线（2024 年 12 月）时的约 $1M ARR，到 2025 年 4 月升至约 $73M ARR——短短四个月增长约
              73x。这一增长趋势与 Sacra 对 2024 年 10 月约 $15M ARR 的估算及 Growjo 当前对 $73M 的估算 相互印证，不过两处数据均为第三方测算，并非经审计或官方正式财报数据。2025
              年 4 月的定价重构（Core 套餐基础费率从 $500/月猛降至 $20/月）引爆了个体开发者的采购热潮，同时靠走量稳住了企业端收入盘子。

              内部实际用量数据也值得关注。截至 2026 年 2 月，Cognition 自身工程团队每周合并 659 个由 Devin 生成的 PR——是 2025 年峰值周（154 个）的 4 倍。Cognition
              的工程师也大量使用 Devin，内部使用反馈可能加快产品改进。PR 合并率从 Devin 上线时的 34% 升至 2025 年 4 月的 67%，可作为输出质量改善的一个指标；但该数据由公司自报，分母口径未说明。

              2026 年上半年接连在伦敦、东京与新加坡扩张分支，反映出管理层对自身现金流支撑多地运营开支的底气。与 Cognizant 的合作是关键的渠道放大器：Cognizant 全球客户盘子覆盖金融、制造、医疗等领域的
              300+ 家大型机构，哪怕只吃下一小部分，也能在不大幅增加 Cognition 自建销售团队的前提下，成倍扩充 Devin 的企业客户基数。但在 ARR
              估算之外，没有公开数据披露活跃付费账户数、平均合同金额（ACV）以及真实的客户留存扩张速度。
