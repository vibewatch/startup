      - number: '8.2'
        title: 估值背景与融资历史
        blocks:
          - type: paragraph
            body: >
              Cognition 迄今完成了三轮公开披露的股权融资，累计金额达约 $1.575B。2023 年完成的 $21M 种子轮初步攒齐了初创团队。2025 年 1 月至 4 月间落地的 $175M Series A
              轮（由 Founders Fund IX 领投）将投后估值一举推高至 $2B。美国证监会（SEC）EDGAR 文件确认，Founders Fund IX（CIK 0001971631）作为核心机构基金向
              Cognition 注入了大额资金；而 Cognition Capital SPV I（CIK 0002072175，2025 年 6 月 11 日提交 Form D 文件）则表明，在收购 Windsurf
              交割前后，公司设立了专门的结构化跟投载体。2025 年 9 月完成的 $400M 新一轮融资将投后估值直接拔至 $10.2B，在短短约九个月内较 Series A 轮跳涨 5.1×——录得 AI
              软件发展史上最为陡峭的估值跃升曲线之一。按 $10.2B 投后估值测算，约 $1.575B 累计融资额对应约 15%+ 的股权稀释比例，不过具体的优先股堆叠（preference
              stack）与清算清偿顺序（liquidation waterfall）未向外界披露。在 $10.2B 估值高位下，其主要营收倍数折合约 2025 年 4 月约 $73M 估算 ARR 的
              140×——远超所有已披露同业 AI 软件公司的倍数水平。相比之下，Cursor/Anysphere 在 2025 年 9 月按约 $500M ARR 以 $9.9B 估值完成 Series D 轮，对应 ARR
              倍数仅约 20×。Cognition 享有的估值溢价，固然能靠更高的增长斜率与品类先驱标签获得部分合理解释，但这要求以 $10B+ 估值入局的投资人，承担近乎完美的执行风险。2025 年 7 月收购
              Windsurf 借助 Cognition 股权加现金方式完成，具体交易作价未予公开；Cognition Capital SPV I
              这套结构化载体，极有可能是为凑齐收购对价或保障合并后实体的运营资金池而设立。Winbuzzer 在 2025 年 8 月报道的“文化大洗牌”——Cognition 向 Windsurf
              原员工开出九个月买断补偿，且据报道推行每周 80 小时高压工时制——埋下了顶尖人才流失与团队磨合风险，这些暗礁均未体现在光鲜亮丽的表层估值中。任何在 $10.2B 价位新入局的机构投资方，在退出估值低于
              $10.2B 的任何回报清算测算中，都将面临来自种子轮、Series A 轮与 $400M 轮庞大优先股清算优先权的沉重挤压。
            claimRefs:
              - CV001
