      - number: '3.2'
        title: 云计算巨头支撑的梯队选手
        blocks:
          - type: paragraph
            body: >
              微软收购 GitHub 后，GitHub Copilot 得以嵌入全球最大开发者平台，分发优势难有对手匹敌。财富 100 强中有 90% 的企业在用 Copilot，活跃开发者超过 20 million
              人，庞大规模也提高了客户切换成本。Copilot 阶梯定价从个人版每月 $10、商业版每月 $19 到企业版每月 $39，对多数研发团队而言是成本较低的入门选择。该平台逐步从行内补全扩展至对话、PR
              摘要乃至工作区级的 Copilot Workspace——一套支持多步规划与执行的智能体系统，正逐渐进入 Devin 的自主任务执行领域。截至 2025 年初，GitHub Copilot 的 ARR 突破 $2
              billion，在纯 AI 编程工具领域居于首位。

              Amazon Q Developer 则面向企业对合规与安全的需求，提供免费版及每用户每月 $19 的 Pro 版。它原生整合 AWS 基础服务，提供 200,000-token 上下文窗口，并具备源自
              Amazon CodeWhisperer 的智能体能力，因此适合已采用 AWS 的企业。Q Developer 拿下了 SOC 2 Type II 认证并支持 VPC
              隔离——多数初创竞品尚难以提供此类安全背书。相比 Cognition，巨头梯队的核心短板在于缺乏全流程闭环的自主任务交付能力：Copilot 与 Q Developer
              均无法在脱离各环节人工确认的前提下，独立完成端到端的规划、编码、测试与部署。这一架构局限留出了 Devin 赖以破局的生态空隙，尽管两大云巨头正加速向智能体前沿拓展。
            claimRefs:
