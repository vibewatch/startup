      - number: '6.3'
        title: 具名客户证明与引用质量
        blocks:
          - type: paragraph
            body: >
              支撑力最强的具名标杆来自 Nubank 案例研究，也是唯一公开披露完整细节与量化成果的生产级落地。拉美最大数字银行 Nubank（服务约 1 亿客户）引入 Devin，把一套拥有 600 万行代码的庞大 ETL
              单体架构拆解迁移为子模块——按原先估算，这项工程需耗费 1,000+ 名工程师苦干 18 个月。借助 Devin，各个业务线（数据、催收、风控）的迁移周期压缩至数周，折算工时效率提升 12x，相较纯人工方案削减了
              20x 成本。尤为关键的是，该案例记录了针对该行特定迁移模式进行模型微调的过程；微调后，任务速度提升 4x（单项任务耗时从 40 分钟降至 10 分钟），内部基准准确率提升 2x。

              官方博客在 2026 年 4 月 27 日点名 Mercedes-Benz，称其“在其全球工程组织内全面部署”Devin 与
              Windsurf，覆盖遗留系统改造、云原生开发与物流板块。但双方未对外公开任何量化指标，仍处于商务合作宣发阶段，尚未沉淀出成熟的事后案例剖析。2026 年 1 月 28 日官宣的
              Cognizant，虽同样“在其工程体系与全球客户中全面部署”Devin 与 Windsurf，但这属于渠道分销合作而非最终买家落地的典型标杆，目前同样缺乏实际生产成果数据。

              此外还有一批匿名客户背书：Fortune 500 巨头的 COBOL 现代化改造（2026 年 4 月 8 日博客，未点名具体企业）、美国联邦政府（2026 年 2 月 25 日推出 Cognition for
              Government，未具名机构名单）、日本企业客户（2026 年 4 月 9 日宣布上线，未点名客户）。证据链的深度与时效性严重割裂：Nubank
              是拥有详尽数字指标的生产级标杆，其余绝大多数仍停留在联合发稿阶段。这暴露出严重的证据质量集中风险——假使 Nubank 的成功只是孤例而非普遍常态，Cognition 的客户证据底盘实际上相当单薄。
            claimRefs:
