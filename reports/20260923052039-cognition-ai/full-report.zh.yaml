      - number: '4.2'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Cognition AI 在不到 18 个月内完成三轮主要股权融资，累计获得约 $696 million 风险投资，是融资速度最快的 AI 基础设施公司之一。2024 年 3 月的种子轮/Series A 轮从
              Founders Fund 筹集约 $21 million，投前估值 $350 million，表明在产生任何产品收入前资方已对创始团队建立强烈信心。2024 年 4 月，即产品发布数周后，Cognition
              再次由 Founders Fund 领投敲定 $175 million 融资，投后估值达 $2 billion，成立半年内即跻身独角兽行列。2025 年 9 月的 Series B 轮按 $10.2
              billion 投后估值融资 $400 million，跟投机构涵盖 Lux Capital、8VC、Elad Gil、Bain Capital Ventures、D1 Capital、Definition
              Capital 以及 Swish Ventures。VentureBeat 和 TechCrunch 均在 2025 年 9 月核实报道了该轮融资。

              公司披露自创立至 2025 年 Q3 的净现金消耗低于 $20 million——拿其融资体量来看控制得极好——表明绝大部分募集资金被沉淀为现金储备，并未像同阶段同类公司那样激进扩张人力或基建支出。2025 年
              7 月对 Windsurf 的收购对价估算约为 $250 million，完全由现有账面资金储备承付而未开展新股增发——对照员工体量与交易规模，展现出较强的财务纪律。收购后员工规模据报道一度达到约 249
              人，随后经历 30 人裁员以及部分 Windsurf 员工接受 9 个月买断补偿离职。
            claimRefs:
              - CI001
