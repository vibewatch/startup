      - number: '2.3'
        title: 客户、用户与买单方画像
        blocks:
          - type: paragraph
            body: >
              Cognition AI 瞄准三类核心客群，各自的预算归属和采购动因不同。第一类也是主力客群：大型企业研发团队，由工程副总裁（VP Engineering）或 CTO 采购，软件工程师使用，IT
              预算承担买单。采纳触发点源于明确的生产力差距——通常以 AI 工具 ROI 对标人力成本得出。高盛（12K 开发者试点）、Citi、Cisco、Dell 和 Nubank 等标杆客户均属此类。企业合同年客单价在
              $100K 至 $2M+ 不等，包含法务与安全审查的销售周期为 3–9 个月。

              第二类是高成长科技初创公司，CTO 或创始工程师既是买方也是用户，费用由创始人从种子资金中支出。采购动因是提速：Devin 让 10 人团队也能承担原本需要 50 人团队的工作量。这类买家通常从
              $20/month 的 Core 方案起步并升级至 Team 方案。代表客户包括 Ramp 以及报告 12× 效率飞跃的 Nubank。客单价偏低，在
              $500–$6,000/year，但客户体量大，且随着企业规模扩张大概率转化为大额企业合同。

              第三类是独立开发者与自由职业者，战略优先级较低。买方和用户是同一人，通常由按小时收费的自雇开发者自行付费。采用动因是竞争压力：AI 工具正成为专业开发者的基本配置。每月 $20 的 Core
              方案面向这一客群；他们对流失更敏感，主要为产品提供反馈并成为潜在线索，而非核心收入来源。金融服务企业构成跨领域的重点客群，高盛推行的 12K 开发者 Devin 试点与 Citi
              部署即为明证——此类买家签署企业合同前，必须满足 SOC 2 Type II、数据驻留及行业合规硬性要求。
            claimRefs:
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs: []
      - number: '2.4'
        title: 增长驱动因素与推广阻力
        blocks:
          - type: paragraph
            body: >
              该市场既享有强劲的结构性红利，也面临制约推广速度与 Cognition 变现节奏的现实阻力。增长驱动因素包括已获实证的开发者生产力提升——GitHub Copilot 用户完成任务速度提高 51–55%，46%
              的代码由 AI 辅助生成，采用 AI 工具的企业组织报告开发者效率提升 3.2×——上述数据验证了投资回报率，降低了采购立项门槛。向智能体 AI 的范式转移尤为关键：企业对智能体 AI 系统的支出预计从 2024
              年的不足 $1B 飙升至 2028 年的 $51B+，复合年增长率约 150%，自主智能体预算正逐步成为企业 IT 组织的标配。

              人力成本高、人才稀缺，凸显了自动化的经济价值。美国软件工程师年薪中位数超过 $130K；即便每月 $500 的工具只能自主解决 10–20%
              的工程工单，其产生的经济回报也能让工具在数周而非数季度内收回成本。Gartner 将 AI 代码助手纳入魔力象限（Magic Quadrant），赋予了企业采购合法性；其预估到 2028 年实现 90%
              企业采纳率，自上而下推动了组织层面的品类预算审批。

              核心阻力集中在信任与治理：企业在部署自主工具前普遍要求基于角色的访问控制（RBAC）、审计追踪、知识产权归属明确及严格的安全审查，拉长企业销售周期 3–9
              个月。模型幻觉与代码质量隐患使得自主智能体可能引入隐蔽缺陷，促使买家坚持设置人工审核节点，限制了全自主运行范围。与遗留工具链集成——本地部署 Git 仓库、物理隔离的 CI/CD 流水线、专有定制
              IDE——拉高了交付成本与复杂性。欧盟《人工智能法案》（EU AI Act）与美国关于 AI 安全的行政令，对关键业务流中的企业 AI 系统提出了文档留存与可解释性要求。市场格局碎片化加剧，GitHub
              Copilot（占 42% 市场份额）、Cursor（估值 $9B）、Windsurf（现已并入 Cognition）与 OpenAI Codex 同台竞技，容易让买家面临选型过载，延缓采购决策。
            claimRefs:
              - CM008
              - CM009
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 论据要点
        blocks:
          - type: callout
            title: TAM 界定决定投资逻辑
            body: >-
              Grand View Research 预测 2030 年狭义市场规模为 $92M，Mordor Intelligence 对广义市场的预测则为
              $24B；两者相差百倍，说明市场规模很大程度上取决于如何界定市场。Cognition 可服务的核心市场在于高端自主智能体，到 2030 年规模约为 $1–8B；只要公司取得 10–20% 的市场份额，便足以支撑
              $10B+ 估值，但这一市场远小于广义 AI 市场。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
          - type: callout
            title: 结构性红利：Gartner 预测 90% 企业采纳率
            body: >-
              Gartner 预测到 2028 年将有 90% 的企业工程师使用 AI 代码助手（2024 年初仅 14%），意味着四年内渗透率提升 6×。这为包括 Cognition 在内的所有 AI
              编程工具厂商提供了品类需求的依据，尤其利好高盛、Nubank 这类能拿出可验证 ROI 证据的头部客户。
            calloutType: strength
            claimRefs:
              - CM008
