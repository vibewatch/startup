      - number: '7.3'
        title: 竞争与市场风险
        blocks:
          - type: paragraph
            body: >
              Cognition 最紧迫的竞争威胁，是曾经确立其领先地位的智能体编程基准正在迅速商品化（commoditization）。2024 年 3 月 Devin 刚发布时，13.86% 的 SWE-bench
              Full 得分石破天惊。然而到了 2025 年中，Claude Code Opus 4 在 SWE-bench Verified 上已轰出 72.5% 的高分——短短约 15 个月暴涨五倍。OpenAI
              Codex 与 GPT-5 同样拿出了旗鼓相当的 Verified 评测表现。这一惊人迭代速度严重威胁着 Devin 的技术护城河：其引以为傲的多步规划、代码执行与自动化测试闭环，极可能在 12–18
              个月内被底层基础大模型厂商彻底吃透并直接抹平。GitHub Copilot（装机量 250M+、坐拥微软全渠道分销能力）、Cursor（ARR 超 $500M+、估值 $9B、低至 $40/月）以及
              Anthropic 的 Claude Code，都在与 Devin（此前 $500/月的 Team 套餐）争夺同一块企业研发效能预算。美国联邦贸易委员会（FTC）已公开表达担忧，认为对底层 AI
              核心生产资料的垄断——包括 Devin 所高度仰仗的基础模型——可能让大模型巨头扭曲下游应用层市场竞争；这对 Cognition 构成难以规避的底层结构性风险。Cognition 虽在 2025 年 7 月收购
              Windsurf 吞下 350+ 家企业客户与 250K+ 日活，但也带来了沉重的业务整合隐患：两套完全独立的 AI 智能体底层代码、模型链路、计费系统与销售打法，必须在维持 ARR
              高速增长的同时全盘磨合重构。Devin 首发阶段引发的极客社区质疑——集中抨击其基准测试水分、封闭式录像 Demo
              以及夸大其词的超越声称——形成了负面口碑包袱，显著加大了技术敏锐型大买家的试用阻力，随着大企业评估门槛不断收紧，这一包袱仍在持续释放阻力。价格战与毛利挤压已现端倪：Devin 2.0 将实际费率骤降约
              3×；未来的竞争压力极可能逼迫其进一步降价，进而蚕食单次会话的创收能力。
            claimRefs:
              - CR001
