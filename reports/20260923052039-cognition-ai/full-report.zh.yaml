      - number: '6.4'
        title: 留存、满意度与耐久性
        blocks:
          - type: paragraph
            body: >
              Cognition AI 公开披露的留存率与满意度数据非常有限。官方从未公布净留存率（NRR）、总留存率（GRR）、客户流失率或客户队列留存分析。外界最容易观察到的满意度替代指标是 PR 合并率（截至 2025
              年 4 月达 67%，高于上线初期的 34%），即人工审核员最终接受 Devin 所提 PR 的比例——这能间接反映产出质量，但并非标准意义上的客户满意度口径。高达 67% 的 PR
              采纳率反过来看，等于整整三分之一的产出被拒收或面临大幅重写；在海量跑批的自主任务中这或许能容忍，但比起人类工程师，质量断层依然扎眼。

              第三方社区的开发者口碑喜忧参半。Hacker News 社区多次指出，Devin 早期 Demo 视频剪得天衣无缝，可在复杂任务下的实测表现，远未达到最初 13.86% SWE-bench
              宣传吊起的胃口。独立测评博主 imseankim.com 在蹲守观察六周生产实操后指出，“独立测试者看到的光景要复杂得多”，并警示 ACU 算力账单在实际使用中累加极快，名义上每月 $20 的 Core
              套餐，稍加调用每月账单就轻松破 $100–200。2024 年 12 月曝光的安全漏洞，也一度挫伤了注重安全合规的企业客户的信任。

              从产品使用耐久性看，Nubank 表现出持续且逐步扩大的使用规模（数据、催收、风控业务线相继接入）。Cognition 内部高频调用 Devin（2026 年 2 月每周合并 659 个
              PR）亦展现出极强的产品驱动留存特征。与 Cognizant 和 Mercedes-Benz
              的合作一旦嵌入企业既有研发流程，便能形成结构性切换成本。但具名大客户的具体合同期限、到期续约率以及落地后的实际满意度，外界至今一无所知。
            claimRefs:
              - CU001
      - number: '6.5'
        title: 扩张与集中风险
        blocks:
          - type: paragraph
            body: >
              Cognition AI 的“小步渗透、逐步增购（land-and-expand）”路径清晰可辨：Nubank 最早从单一业务线的 ETL 迁移起步，随后拓宽至数据、催收和风控三大板块。与 Cognizant
              的合作同样沿袭这一逻辑——先在自身工程团队内部铺开，再向其全球客户网络增购转售。Free 与 Pro
              套餐主打开发者自发渗透：一线工程师以极低门槛尝鲜试用，带动内部采用，最终倒逼企业组织自下而上启动采购。Windsurf IDE 拥有的 250,000+ 日活开发者，则提供了庞大的天然装机盘，持续向 Devin
              付费转化。

              客户集中度风险不容忽视，但公司未披露相关数据。在约 $73M ARR 的收入规模下，已确认的具名大客户为数不多，收入很可能集中在少数几份大额合同中，例如与 Nubank、Mercedes-Benz
              这类客户相关的合同；若少数客户贡献了绝大部分收入，集中风险将进一步上升。倘若 Cognizant 渠道分销进展过猛，收入也可能过度依赖单一转售商，削弱直接客户来源多元化带来的韧性。COBOL
              现代化改造业务主打超大体量工程（服务多年的沉重遗留系统），若未能在首期交付后转签长期运维保障，本质上属于一锤子买卖，初期迁移一旦收尾，面临潜在的断崖式收入下跌。

              严监管行业的企业采购阻力极大。金融、医疗与政府客户普遍对安全认证（SOC 2、FedRAMP）及数据驻留提出硬指标，而 Cognition 尚未公开证实自身满足这些要求。VPC
              模式固然消除了数据出境顾虑，但官方权威合规背书的缺失，直接卡死了其在核心监管行业的市场拓展空间。2026 年 2 月设立政府事业线，表明 Cognition 正在推进等同于 FedRAMP
              的资质认证，但审批进度与当前状态皆未公开。这块合规空白构成了公司挺进头部大企业市场的首要采购壁垒。
            claimRefs:
              - CU001
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险格局
        blocks:
          - type: paragraph
            body: >
              Cognition 身处的外部监管环境正在急剧收紧。三大核心法案在短期内提出了严苛的合规要求。欧盟《人工智能法案》（EU AI Act，条例 2024/1689）定于 2026 年 8
              月对通用人工智能（GPAI）模型提供商正式生效，强制要求提交透明度技术文档、制定版权合规政策并在欧盟 AI 办公室完成备案。由英国信息专员办公室（ICO）统管的英国 GDPR
              涵盖英国及欧盟居民的所有数据处理行为，明确要求高风险 AI 处理必须完成数据保护影响评估（DPIA）——鉴于 Devin 具备自主合并 PR 与部署代码的能力，极大概率触发第 35 条规定。2025 年 1
              月出台的美国白宫行政令废除了此前拜登时期的 AI 安全义务，联邦监管因此放宽，但各部委后续颁布的细则（尤其是政府 AI 采购规范）依然在实质执行。加州原拟针对前沿模型施加问责要求的 SB 1047 法案虽于
              2024 年 9 月遭到否决，但后续替代法案（AB 2013、SB 1235）在 2025 至 2026 年立法期内仍在持续推进。与此同时，加州北区联邦地区法院受理的 Doe v.
              GitHub、Microsoft 与 OpenAI 版权诉讼主张，抓取开源代码仓库训练 AI 编程模型构成版权侵权；Cognition
              从未披露自身模型训练数据的来源血缘，同样埋下了类似的潜在知识产权爆雷点。Cognition 虽在服务条款中明令禁止将其产出用于训练竞品模型，但其上游模型训练数据的版权合规性根本无法独立验证。对照
              Cognition 如今的体量以及在欧盟、日本和新加坡拓展的企业客户盘子，其在合规监控、跨法域数据保护协议（DPA）覆盖以及 GPAI
              透明度文档等板块的资源投入严重脱节。若不尽快组建专职的政策合规团队，Cognition 最快将在 2026 年 Q3 面临监管执法、GPAI
              未备案罚款甚至欧盟准入受限的实质惩处。在当下海外扩张的关键节点，前瞻性的合规体系建设属于生死攸关的核心投资，绝非可有可无的法务后台开销。
            claimRefs:
              - CR001
