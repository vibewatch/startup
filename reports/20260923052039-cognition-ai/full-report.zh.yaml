              - CE006
              - CE007
      - number: '5.3'
        title: 技术架构与智能体运行时
        blocks:
          - type: paragraph
            body: >
              Devin 的核心技术架构立足于一套智能体运行时，在沙箱隔离的云端环境中统管长程规划与多步执行。智能体接收自然语言任务指令后，将其拆解为有序的子步骤序列：仓库探查、环境搭建、代码编写、测试执行与 Pull
              Request（PR）创建。每一步执行中，智能体在隔离的计算容器内调用代码编辑器、Unix 终端与无头浏览器等专用工具，杜绝横向渗透至其他会话或客户数据的可能。这套沙箱机制把 Devin
              的运行环境与客户生产环境彻底隔开，代码变动一律以 PR 形式呈现，合并前必须由人工审核确认。

              DeepWiki 服务构建文件、函数与模块间关系的向量化项目图谱，撑起超大代码库的语义理解。比起单纯依靠 token 长度的上下文窗口，这类基于图谱的表征让 Devin
              穿透数百万行的大型代码库时效率更高。BlockDiff 快照技术在任务执行全程记录增量状态检查点，测试未通过或推翻技术方案时能迅速回滚。DeepWiki 与 BlockDiff 构成 Cognition
              最具差异化的底层硬实力，直接击中基于大语言模型（LLM）的编程智能体两大核心失效场景：超大代码库上下文丢失，以及难以逆转的连环错误级联。

              2025 至 2026 年间发布的自研 SWE-1.5 模型，是 SWE-Check 与 Windsurf Codemaps 的底层底座。该模型针对软件工程专属场景重度训练，有别于竞品普遍采用的通用基础 LLM
              底座。智能体运行时同时兼容模型上下文协议（Model Context Protocol, MCP），Devin 能够借助可扩展的插件市场直连
              Sentry、Datadog、PostgreSQL、MongoDB、Notion 等数百款外部工具与服务。智能体计算单元（ACU）是按任务计费的算力消耗单位，折合约每 ACU
              $2.25，不同套餐内含的预充额度各异。
            claimRefs:
              - CE001
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
      - number: '5.4'
        title: 部署、集成与可靠性
        blocks:
          - type: paragraph
            body: >
              Devin 提供两种主要部署形态：默认的云端托管模式（运行于 Cognition 托管的基础设施）以及面向数据驻留、网络隔离或强合规要求大客户的 VPC 模式。在 VPC 模式下，Devin 直接运行于客户自身的
              AWS、GCP 或 Azure 环境内部，源代码无需回传至 Cognition 服务器。企业级套餐还支持定制训练 Devin 专属实例，客户可基于私有代码库与内部工程规范定向微调智能体。

              平台原生打通各类工程工具链：在代码版本控制上对接 GitHub、GitLab 与 Bitbucket（支持自动建 PR、代码评审自动化与分支管理）；在工单跟踪上对接 Jira 与
              Linear（负责工单分发与进度流转）；在协作沟通上对接 Slack 与 Microsoft Teams（支持在会话频道内直接发起任务并同步状态）。REST API 支持在 CI/CD
              流水线中实现程序化会话管理，研发团队可在特定触发条件（如测试用例跑飞、收到客户 bug 报告）下自动拉起 Devin 会话。MCP
              插件市场进一步将集成边界拓宽至监控平台（Sentry、Datadog、PagerDuty）、数据库（PostgreSQL、MySQL、MongoDB）与文档协作系统（Notion、Confluence）。Windsurf
              IDE 则在本地端集成 Cascade AI 智能体，并支持将复杂任务一键交接至云端“Devin in Windsurf”继续处理。

              Cognition 公开资料中未以服务可用性协议（SLA）或状态页形式正式公布运行可靠性指标。单个会话的任务执行上限设为 45 分钟，若遇超长项目可拆分为多个连续的子会话。Devin 2.0
              引入的置信度仪表盘（confidence meter）可在任务执行前预估成功概率，帮助团队在烧掉 ACU 额度前先行过滤低胜率任务。这类品控机制虽能压降算力浪费，但同样折射出 Devin
              在处理复杂任务时，其可靠性依然带有概率试探属性，尚无法做到确定性交付。
            claimRefs:
              - CE001
      - number: '5.5'
        title: 技术差异化与竞争护城河
        blocks:
          - type: paragraph
            body: >
              Cognition AI 的主要技术差异在于让 Devin 端到端承担任务：它不只是像传统代码补全工具那样给出代码建议，而是自行规划、执行并交付完整成果。Devin 因此直接与 GitHub
              Copilot、Cursor、Claude Code 等代码补全工具竞争，而非仅在这些工具上做小幅改进。2024 年 3 月，Devin 以 13.86% 的 SWE-bench Full
              得分刷新无协助自主智能体行业纪录（SOTA），较此前最佳成绩 1.96% 高出 7x，并超出此前有人协助基准（4.80%）达 3x。一项对比 7,156 个 PR 的学术研究显示（Arxiv,
              2026），Devin 的 PR 采纳率在 32 周内保持每周 +0.77% 的稳步爬升，成为该研究中唯一展现出持续提升轨迹的智能体。

              自研的 SWE-1.5 模型与 SWE-Check 工具，代表 Cognition 在模型训练端拉开垂直整合序幕。绝大多数竞争对手的 AI 编程智能体（GitHub Copilot、Cursor、收购前的
              Windsurf）都套壳于第三方基础大模型（GPT-4、Claude、Gemini），使得上游模型厂商对下游工具厂商拥有结构性议价权。Cognition 针对软件工程专属场景重度训练
              SWE-1.5，正是为了在最专精的业务闭环中摆脱对 OpenAI 或 Anthropic 的 API 定价依赖。收购 Windsurf 带来关键知识产权增益：囊括 Cascade
              智能体工作流引擎、Windsurf IDE 用户盘子以及 350+ 家企业客户，省去数年打磨 IDE 的周期，直接补强了产品全家桶。

              数据飞轮效应虽已形成，但未见公开量化数据。Devin 运行的每一个工程任务都会沉淀完整的执行链路日志，可反哺后续模型迭代训练。随着大企业客户基于私有代码库部署定制版 Devin 实例，Cognition
              积累了海量垂直场景实操数据，这类缺乏深度企业客户黏性的对手难以轻易复制。DeepWiki 代码图谱表征与 BlockDiff 快照技术属于独家工程创新，在纯注意力机制 LLM
              容易“断片”迷失的大型复杂代码库中，提供了实打实的功能优势。
            claimRefs:
              - CE001
      - number: '5.6'
        title: 信任、安全、安保与合规
        blocks:
          - type: paragraph
            body: >
              Devin 的主干安全架构以沙箱算力隔离为基石：每个会话均运行于临时容器内，除非经集成凭据显式授权，否则无法横向访问其他会话或客户的生产环境。所有代码修改均以 PR 形式提交并需人工审批确认，Devin
              执行轨迹则完整记录会话期间每条终端命令、文件改动与 API 调用，留存详尽审计日志。VPC 部署则将源代码死死封锁在客户私有云边界内，筑起额外的隔离防火墙。

              2024 年底发生过一起严重安全事件：一场公开直播演示暴露出 Devin 系统提示词处理机制的重大漏洞——攻击者可利用提示词注入（prompt-injection）直接操纵 Devin 的行为。Cognition
              承认问题并迅速修补；这起事件也凸显了一个固有风险：让智能体依据文本输入执行终端命令，可能带来严重后果。Hacker News
              社区直斥该漏洞“在如此严重级别下显得极为业余”，并强调智能体既然具备终端执行权限，提示词注入防御本该是最高优先级的安全防线。

              截至 2026 年 5 月，Cognition 尚未公开披露 SOC 2 Type II、ISO 27001 或同级别企业安全认证。尽调期间访问其 trust.devin.ai 子域名，公开信息极其有限。虽然采用
              VPC 部署和定制微调模型的企业客户可能签署了独立的保密安全协议，但外界无法独立核验。针对 Devin 会话中执行代码的数据隐私与留存政策，Cognition
              公开文档中未有充分披露，成为阻碍金融与严监管行业客户入场的关键合规短板。Mercedes-Benz 与 Goldman Sachs 的合作表明，双方或已在定制合同中扫清合规障碍，但缺少公开披露，外界无法独立评估。
            claimRefs:
              - CE001
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >
              Cognition AI 瞄准技术先锋型大企业、腰部企业（mid-market）以及开发者导向组织内的专业研发团队。买方画像通常是不愿按人头线性增加预算、希望大幅拔高工程产能的研发负责人或
              CTO；使用者多为一线软件工程师或研发主管，借助 Slack、Jira 或 Devin 网页端直接向智能体派发任务。买单方则是工程研发预算持有者，在大型企业内既可能是业务部门预算，也可能是集中的 IT 采购部门。

              已确认在生产环境中部署的行业包括金融与金融科技（Nubank——拉美最大数字银行）、汽车与先进制造（Mercedes-Benz）、IT 外包与集成服务（Cognizant）、企业软件以及美国联邦政府。官方发布的
              COBOL 现代化技术博客证实，其产品已落地多家仍有沉重 COBOL 历史资产的 Fortune 500 巨头，覆盖金融、保险及公用事业板块。2026 年，Cognition
              专门设立政府业务条线，切入美国联邦机构的遗留系统改造。2026 年 4 月拓展日本与新加坡企业市场，释放出下一步主攻东南亚金融、制造和科技板块的信号。

              美国是主要市场（截至 2026 年初贡献了绝大部分收入与具名客户），欧洲（2026 年 1 月设立伦敦办公室）与亚太（2026 年 4
              月设立东京和新加坡办公室）充当增长极。渠道布局由三股力量支撑：大客户直销、Windsurf IDE 免费转付费漏斗（收购时日活逾 250K+），以及分销伙伴 Cognizant——后者把 Devin 与
              Windsurf 铺进自身工程团队并转售给全球客户。Windsurf 整合完成后，在原有自上而下的企业直销之外，打通了自下而上、由开发者主导的渗透路径。
            claimRefs:
