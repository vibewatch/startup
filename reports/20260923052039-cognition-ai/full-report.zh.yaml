          detail: 默认云端托管，另支持企业 VPC 部署与定制微调实例
        - label: 安全管控
          detail: 提示词注入防御、人工审批卡点与可审计的变更日志
    summary: 分层架构图展现 Cognition AI 的产品入口、编排调度、工具链、部署方式与安全管控。
  - id: FU001
    title: 客户采纳旅程与扩张路径
    type: journey-map
    claimRefs:
      - CU006
      - CU007
    sourceRefs:
      - SU007
      - SU008
    data:
      nodes:
        - label: 认知建立
          note: 工程师通过博客、产品演示或同行推荐了解 Devin 或 Windsurf
        - label: 试用体验
          note: 个人或团队以低门槛入门价格试用 Core/Pro 版本
        - label: 内部验证
          note: 试点团队在真实代码库上评估任务完成率与 PR 合并率
        - label: 企业级扩张
          note: 试点成功后推广至更多研发小组或业务部门
        - label: 渠道与伙伴
          note: 借助 Cognizant 等渠道伙伴与转售合作拓宽市场触达
        - label: 留存与续约
          note: 依托深度融入工作流、合规保障及可衡量的 ROI 驱动续约
    summary: 旅程图展现 Cognition 如何将开发者个人试用转化为企业级规模化采购与多部门采纳。
  - id: FR001
    title: 风险热力图——影响程度 vs 发生概率
    slug: risk-heatmap
    type: matrix
    claimRefs:
      - CR006
      - CR007
      - CR011
    data:
      columns:
        - 低概率
        - 中概率
        - 高概率
      rows:
        - label: 严重影响
          values:
            - LLM 供应商提价冲击
            - 供应链代码污染
            - 竞对加速同质化
        - label: 高度影响
          values:
            - CEO 关键人离职
            - 知识产权与版权诉讼
            - AWS 依赖故障
        - label: 中度影响
          values:
            - SOC 2 审计范围缺口
            - GDPR 与欧盟 AI 法案监管执法
            - NRR 下滑
        - label: 运营影响
          values:
            - 账单超预期引发流失
            - 海外扩张受阻延期
            - 定价承压下行
        - label: 安全影响
          values:
            - 提示词注入漏洞利用
            - 未经授权的代码合并
            - 凭据外泄
        - label: 战略影响
          values:
            - 客户集中度过高
            - Windsurf 整合拖累
            - 人才留存压力
