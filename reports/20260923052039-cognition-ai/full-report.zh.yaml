      - number: '5.2'
        title: 产品与技术全景图
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，Cognition AI 旗下产品线由四大独立单元组成：（1）Devin
              Core/Pro/Max/Enterprise——面向个人、团队与企业客户的云端智能体套餐；（2）Windsurf IDE——搭载 Cascade AI 智能体的桌面 IDE，2025 年 7 月自
              Codeium 收购所得；（3）Devin API——用于程序化创建会话及 CI/CD 流水线自动化的 RESTful API；（4）Windsurf
              Enterprise——配备单点登录（SSO）、集中计费及高级管理权限控制的企业级 IDE 套餐。第五个核心组件 Windsurf Codemaps 则是由 SWE-1.5 与 Claude Sonnet 4.5
              驱动的结构化代码库导图，带 AI 标注，把代码导航精准锚定至具体行号和可视化节点图谱，借此加快新员工上手与代码调试排错。

              2026 年 4 月套餐调整后，公司下线原有的 Core 与 Team 套餐，换为五层梯度架构：Free（受限 ACU 额度）、Pro、Max、Teams 与
              Enterprise。这套调整意在贯彻小步渗透、逐步增购（land-and-expand）策略：Free 层面向个人开发者与编程训练营学员铺开基础认知，Pro 与 Max 承接重度高频用户，Teams 与
              Enterprise 负责锁定企业组织级采购。2026 年 4 月与 Applied Compute 联合推出的 SWE-Check，是一款经强化学习专门训练的代码缺陷检测模型，内部评测表现对齐 Opus
              4.6，运行速度快出约 10x——在 Devin 智能体闭环中充当兼顾成本与效率的质量把关卡点。

              公司自研的 SWE-1.5 模型同时支撑 SWE-Check 与 Windsurf Codemaps，标志着 Cognition 在 Devin
              运行时集成方案之外，首次推出自研专有模型。全线产品均以云原生优先交付，若企业客户对本地部署或隔离云环境有硬性要求，亦可选用 VPC 部署。2026 年上线的 Devin for Terminal
              功能支持开发者直接从本地终端发起智能体任务，一旦任务算力需求超出本地承载，便可平滑切入云端，打通了命令行与云端两种部署形态。
            claimRefs:
              - CE001
          - type: table
            tableRef: TE002
            claimRefs:
