  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局总览
        blocks:
          - type: paragraph
            body: >
              2026 年的 AI 辅助软件工程市场分化为三个清晰的竞争梯队。第一梯队为成熟的工作流协同助手，代表产品包括 GitHub Copilot（微软）与 Amazon Q
              Developer，两者均依托超大规模云厂商的渠道分发网络。截至 2025 年初，GitHub Copilot 凭借 20 百万名用户与超过 $2 billion 的年经常性收入（ARR），占据该品类估计 42%
              的市场份额，深度嵌合于企业级开发工具链。Amazon Q Developer 则针对 AWS 工作负载优化补全与对话体验，依托 SOC 2 Type II 认证与原生 IAM 集成，锁定庞大的 AWS
              企业存量客户群体。

              第二梯队为 IDE 原生 AI 编程助手，领跑者为 Cursor（Anysphere）。Cursor 于 2024 年中推出付费版，到 2026 年 2 月 ARR 突破 $2 billion，当前估值达
              $29.3 billion。Cursor 基于 VS Code 分支开发，能深度集成编辑器，这是插件难以实现的；其多智能体并行架构（最多支持 8 个并发智能体）也越来越多地与 Devin
              的自主编程场景形成重合。Windsurf（前身为 Codeium）在被 Cognition 收购前亦曾是该梯队的有力争夺者。

              第三梯队为全自主 AI 软件工程师，Cognition 旗下的 Devin 直接参与这一梯队的竞争。Claude Code（Anthropic）、OpenAI Codex（重新推出为网页端智能体）以及
              SWE-agent（开源学术基准套件）在此梯队形成不同程度的竞逐。Claude Code 的终端原生架构及其在 SWE-bench 评测中展现的代码质量构成直接威胁；OpenAI Codex
              转向智能体执行环境，直接挑战 Devin 的核心定位。竞争差异正从基准成绩转向企业工作流中的实际表现与可验证的 ROI；Cognition 依托高盛等标杆客户的部署实证，暂握先发优势。
            claimRefs:
              - CP001
              - CP002
              - CP003
