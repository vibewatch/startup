  - id: FP001
    title: Competitive positioning by AI-networking focus and open integration
    type: quadrant
    summary: >-
      Ordinal positioning highlights Nexthop's intended open-integration niche against integrated incumbents, component
      suppliers, and internal build.
    data:
      points:
        - label: Nexthop AI
          x: 5
          'y': 5
          note: >-
            High AI-networking focus from AI-specific platforms and JDM positioning; high open-integration emphasis from
            customer-OS and SONiC claims.
        - label: NVIDIA
          x: 5
          'y': 2
          note: >-
            High AI-networking focus; lower open-integration score because InfiniBand is described as a closed ecosystem
            despite Spectrum Ethernet.
        - label: Broadcom
          x: 4
          'y': 4
          note: >-
            High AI-networking relevance and open Ethernet ecosystem; component supplier rather than turnkey customer
            partner.
        - label: HPE/Juniper
          x: 3
          'y': 3
          note: >-
            Moderate AI focus and integration breadth; open-integration score reflects portfolio and UEC participation,
            not bespoke JDM.
        - label: Cisco/Arista
          x: 3
          'y': 3
          note: >-
            Established Ethernet incumbents are relevant alternatives, but assigned sources do not support a
            company-specific score beyond category evidence.
        - label: Internal build
          x: 4
          'y': 5
          note: >-
            High AI focus and maximum openness/control by definition; carries engineering and supply-chain burden
            described in Nexthop's build-versus-buy discussion.
      xAxis: AI-networking focus (ordinal 1–5)
      yAxis: Open integration / buyer control (ordinal 1–5)
    approximationNotes: >-
      Ordinal scores are analyst synthesis from cited sources, not market share, price, benchmark, or probability
      estimates; exact coordinates are not independently measured.
    claimRefs:
      - CP003
      - CP005
      - CP007
      - CP008
      - CP009
      - CP011
  - id: FI001
    title: Revenue model bridge from customer requirement to monetization
    type: flow
    summary: >-
      The public model connects customer-specific infrastructure requirements to an integrated delivery, but pricing,
      accounting, and gross-profit conversion are undisclosed.
    data:
      nodes:
        - id: customer-requirement
          label: Hyperscaler or NeoCloud requirement
          detail: Customer defines performance, software-stack, power, and deployment constraints.
        - id: joint-development
          label: Joint product development
          detail: Nexthop co-develops and customizes the system with the customer's engineering team.
        - id: hardware-supply
          label: Switch and interconnect supply
          detail: Hardware families and pre-tested optical or electrical interconnects form the physical delivery.
        - id: software-services
          label: NOS, integration, and support
          detail: Customer-selected or Nexthop NOS is hardened, integrated, and supported for deployment.
        - id: negotiated-contract
          label: Negotiated system contract
          detail: Public evidence shows contact-only pricing; contract units and allocation are unavailable.
        - id: recognized-economics
          label: Revenue and gross profit
          detail: Recognition timing, recurring mix, realized price, warranty cost, and margin remain undisclosed.
    approximationNotes: >-
      Ordered qualitative flow only; it does not estimate contract value, conversion, revenue-recognition timing, or
      gross margin.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI008
      - CI011
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Nexthop's public product model spans customer-specific software and interconnects over customized switching
      hardware and an open networking ecosystem.
    data:
      layers:
        - label: Customer operating layer
          detail: Customer-selected operating system and deployment requirements.
          items:
            - label: Customer NOS
              detail: Chosen and enhanced for the hyperscaler deployment.
        - label: NOS integration layer
          detail: Software integration, hardening, and lifecycle ownership.
          items:
            - label: SONiC-powered NeoCloud NOS
              detail: Turnkey supported option described for NeoCloud deployments.
        - label: 4000 Series hardware
          detail: Scale-out, scale-across, and front-end switching.
          items:
            - label: 51.2Tbps platform
              detail: 800G switching with published QoS and load-balancing features.
        - label: 4200 Series hardware
          detail: AI back-end and front-end switching.
          items:
            - label: 102.4Tbps platform
              detail: 1.6T switching with telemetry and high-radix ECMP.
        - label: 5000 Series hardware
          detail: Data-center interconnect and scale-across switching.
          items:
            - label: 25.6Tbps platform
              detail: Deep buffer, VOQ, and line-rate encryption are catalogued.
        - label: Connectivity and ecosystem layer
          detail: Interconnects and open networking community dependencies.
          items:
            - label: Optical and electrical interconnects
              detail: Pre-tested components from the customer's diverse supply chain.
            - label: SONiC and open networking projects
              detail: Linux-based, multi-vendor ecosystem with community validation and tooling.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE011
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence shows a path from co-development and ecosystem integration to hyperscaler shipping or NeoCloud
      turnkey deployment, with retention and expansion still unverified.
    data:
      items:
        - name: Hyperscaler co-development
          label: Hyperscaler co-development
          detail: Customer engineering teams define hardware, NOS, and interconnect requirements.
          touchpoints:
            - Custom hardware specification
            - Open NOS and SAI integration
            - Joint architecture work
          value: Reference signal
        - name: Integration and validation
          label: Integration and validation
          detail: Nexthop integrates switches, optics, silicon, telemetry, and the selected NOS.
          touchpoints:
            - SONiC/FBOSS compatibility
            - Layer 1 and optics monitoring
            - Deployment preparation
          value: Deployment readiness
        - name: Cluster deployment
          label: Cluster deployment
          detail: Coverage reports shipping to leading hyperscalers, but does not name sites or volumes.
          touchpoints:
            - Scale-out and scale-across switching
            - AI cluster rollout
            - Power and density objectives
          value: Commercial signal
        - name: NeoCloud turnkey path
          label: NeoCloud turnkey path
          detail: NeoClouds can receive hardware with supported Nexthop NOS powered by SONiC.
          touchpoints:
            - Turnkey stack
            - Support and services
            - Faster operator deployment
          value: Expansion surface
        - name: Renewal and expansion
          label: Renewal and expansion
          detail: Additional generations, locations, and repeat orders are not publicly evidenced.
          touchpoints:
            - Multi-generation adoption
            - Renewal
            - Cross-sell and repeat purchase
          value: Open diligence question
        - name: Referenceability
          label: Referenceability
          detail: Independent review pages do not provide user outcome evidence.
          touchpoints:
            - Customer reference calls
            - Implementation feedback
            - Satisfaction evidence
          value: Evidence gap
