    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Nexthop AI presents itself as an AI-infrastructure networking company serving hyperscalers and NeoCloud
              operators. Its product model combines purpose-built Ethernet switches, a SONiC-based or customer-selected
              network operating system, optics and interconnects, and joint development with large cloud operators. The
              company says its products are designed for AI traffic patterns and that its JDM approach works as an
              extension of customer engineering teams. Independent coverage describes the company as Santa Clara-based
              and founded in 2024, while the company’s March 2025 launch release identifies additional locations in
              Seattle, Vancouver and Bengaluru. The public record supports the product category and operating model, but
              does not establish customer names, contracted revenue, or the economics of individual deployments.
