      - [Connect GPUs with high bandwidth and low latency, "Use dense switching, optics, and electrical interconnects", "Switch families with 800G/1.6T options and pre-tested interconnects", "Published throughput and features are available; latency and delivered utilization are undisclosed."]
      - [Avoid proprietary NOS lock-in, "Operate an in-house or open-source-derived NOS", "Enhance and ship the customer's NOS; SONiC-powered option for NeoClouds", "Improves stack fit, but increases compatibility and support complexity."]
      - [Operate smaller AI deployment, "NeoCloud assembles hardware, software, and deployment services", "Turnkey supported solution described by Nexthop", "Public sources do not disclose customer count, deployment stage, or service-level results."]
    notes: Workflow benefits combine source-described mechanisms with explicit uncertainty; no row should be read as a verified customer outcome unless separately documented.
    claimRefs: [CE001, CE002, CE007, CE009, CE010]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Switch silicon, "Packet processing and switching capacity", "Merchant silicon partners such as Broadcom", "Supply, roadmap, and silicon errata exposure are not publicly quantified."]
      - [Switch system design, "Board, chassis, cooling, ports, routing, and load balancing", "Nexthop engineering plus customer specifications", "Custom designs raise validation and support complexity."]
      - [Network operating system, "Routing, configuration, telemetry, and lifecycle operations", "Customer NOS; SONiC or FBOSS-derived ecosystems", "Release ownership, regressions, and compatibility responsibilities are unclear."]
      - [Optical/electrical interconnects, "Connect racks and network fabric across the deployment", "Customer supply chain and pre-tested components", "Optics qualification, link-health behavior, and vendor concentration are undisclosed."]
    notes: Architecture is assembled from company, SONiC, and OCP descriptions; dependencies and risks are diligence interpretations, not disclosed failure rates.
    claimRefs: [CE002, CE009, CE011, CE013]
