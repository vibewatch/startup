        - {from: proof, to: disclosure}
        - {from: disclosure, to: mark}
        - {from: mark, to: gaps}
        - {from: gaps, to: risk}
        - {from: risk, to: decision}
    claimRefs: [CV001, CV003, CV006, CV013, CV015]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: "Research-more: the opportunity is credible, but the disclosed operating evidence is insufficient to prove that a $4.2B valuation offers an attractive common-equity return."
    claimRefs: [CV006, CV009, CV013]
  - calloutType: risk
    title: Thesis-break trigger
    body: "Treat the thesis as broken if management cannot substantiate paid deployments, repeat orders, sustainable gross margins, and capitalization terms that leave common equity with credible upside."
    claimRefs: [CV008, CV011, CV013, CV014]
