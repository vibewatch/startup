figures:
  - id: FP001
    title: Competitive positioning by AI-networking focus and open integration
    type: quadrant
    summary: Ordinal positioning highlights Nexthop's intended open-integration niche against integrated incumbents, component suppliers, and internal build.
    data:
      points:
        - {label: Nexthop AI, x: 5, y: 5, note: "High AI-networking focus from AI-specific platforms and JDM positioning; high open-integration emphasis from customer-OS and SONiC claims."}
        - {label: NVIDIA, x: 5, y: 2, note: "High AI-networking focus; lower open-integration score because InfiniBand is described as a closed ecosystem despite Spectrum Ethernet."}
        - {label: Broadcom, x: 4, y: 4, note: "High AI-networking relevance and open Ethernet ecosystem; component supplier rather than turnkey customer partner."}
        - {label: HPE/Juniper, x: 3, y: 3, note: "Moderate AI focus and integration breadth; open-integration score reflects portfolio and UEC participation, not bespoke JDM."}
        - {label: Cisco/Arista, x: 3, y: 3, note: "Established Ethernet incumbents are relevant alternatives, but assigned sources do not support a company-specific score beyond category evidence."}
        - {label: Internal build, x: 4, y: 5, note: "High AI focus and maximum openness/control by definition; carries engineering and supply-chain burden described in Nexthop's build-versus-buy discussion."}
      xAxis: "AI-networking focus (ordinal 1–5)"
      yAxis: "Open integration / buyer control (ordinal 1–5)"
    approximationNotes: "Ordinal scores are analyst synthesis from cited sources, not market share, price, benchmark, or probability estimates; exact coordinates are not independently measured."
    claimRefs: [CP003, CP005, CP007, CP008, CP009, CP011]
callouts:
  - calloutType: insight
    title: Nexthop's credible wedge is the integration model
    body: "The public record supports a differentiated JDM proposition—co-development, customer-selected operating systems, and pre-tested interconnects—more strongly than it supports a durable hardware moat."
    claimRefs: [CP003, CP005, CP010]
  - calloutType: risk
    title: Open standards can enable adoption and commoditization
    body: "Ethernet openness and multi-sourcing are buyer benefits, but they also reduce lock-in and leave Nexthop exposed to incumbent silicon, integrated-platform, and internal-build responses."
    claimRefs: [CP010, CP011, CP012]
