  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or exposure, Jurisdiction, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - ["Export classification, end-use, and re-export controls for AI networking hardware and silicon", "United States / cross-border", "Exposure established; probability unknown", "Critical", "Not publicly disclosed", "High until controls are evidenced", "Obtain ECCN map, license matrix, screening logs, end-user certifications, and audit rights."]
      - ["Diversion through distributors, resellers, or logistics routes", "United States / destination markets", "Exposure established; probability unknown", "High", "Not publicly disclosed", "High", "Test customer diligence, routing red flags, beneficial-owner checks, contractual controls, and escalation records."]
      - ["Open-source and customer-selected software obligations", "United States / deployed markets", "Applicable footprint disclosed; compliance status unknown", "Medium", "Integration approach disclosed; legal controls absent", "Medium-high", "Review software bill of materials, licenses, contributor obligations, security terms, and customer indemnities."]
    notes: >-
      Rows combine JD Supra's 2026 legal guidance with Nexthop's disclosed hardware and software
      footprint; probability is not estimated, and residual exposure is an analytical assessment.
    enumerationScope:
      coverage: partial
      basis: Publicly documented US export-control and sanctions exposures relevant to Nexthop's disclosed AI-networking hardware, silicon, optics, and deployment model as of 2026-10-23.
    claimRefs: [CR001, CR006, CR008, CR009]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Switch or interconnect reliability failure in a live AI cluster", "Not publicly quantified", "High", "Product specifications and pre-testing are disclosed; field data are absent", "High", "No independent RMA, outage, MTBF, or customer-acceptance data."]
      - ["Customer-OS integration bug, reboot, or patch regression", "Not publicly quantified", "High", "Ongoing bug fixing and integration are acknowledged; lifecycle controls are absent", "Medium-high", "Obtain defect backlog, release gates, rollback process, CVE response, and incident log."]
      - ["Portfolio qualification slips across silicon and port configurations", "Not publicly quantified", "High", "Three product families are disclosed; qualification evidence is absent", "Medium-high", "Request qualification plans, schedule variance, thermal testing, and customer sign-off."]
      - ["Security weakness in customized network software", "Not publicly quantified", "High", "Public API/security artifacts are sparse; product assurance is unverified", "Medium-high", "Obtain SBOM, penetration tests, vulnerability-disclosure process, and patch SLAs."]
    notes: >-
      The register separates disclosed capabilities from unverified operating outcomes; no row asserts
      that a listed failure has occurred.
    claimRefs: [CR001, CR003, CR007, CR012, CR014]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Merchant switch silicon", "Broadcom", "Tomahawk 5/6 and Qumran-3D silicon supplier", "Material; product families are named by ASIC", "Supply interruption, allocation change, or roadmap mismatch", "High", "Multi-source plan and alternate silicon qualification", "High until documented."]
      - ["Hyperscaler co-development and qualification", "Undisclosed hyperscaler customers", "Product requirements, validation, and reference path", "Potentially concentrated; shares are undisclosed", "Program delay, dual sourcing, or internal build", "High", "Secure multiple programs and obtain stage-gated purchase and qualification evidence", "High."]
      - ["Customer-selected network operating systems", "Hyperscaler and NeoCloud engineering teams", "Software requirements, integration, and deployment acceptance", "Customer-specific dependency is undisclosed", "Integration delay or changed customer roadmap", "High", "Maintain reusable integration layers, release gates, and contractual acceptance criteria", "Medium-high."]
      - ["External capital and commercial conversion", "Investors and large cloud buyers", "Financing, working capital, and demand conversion", "Financial and customer metrics are undisclosed", "Funding does not convert into revenue, margin, or runway", "High", "Provide revenue, backlog, margin, burn, inventory, and customer-concentration evidence", "High."]
    notes: >-
      Counterparties and roles are drawn from Nexthop and investor materials; concentration is a
      diligence hypothesis where the public record does not disclose customer or supplier shares.
    claimRefs: [CR001, CR002, CR004, CR005, CR006, CR010, CR011, CR013, CR014]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Evidence-backed risks are concentrated in regulatory controls, reliability at scale, and partner or customer dependency.
    data:
      columns: [Likelihood, Impact, Mitigation maturity, Residual exposure]
      rows:
        - label: Export-control diversion or licensing failure
          values: [Unknown, Critical, Not publicly disclosed, High]
        - label: Field reliability or interconnect failure
          values: [Unknown, High, Partial company disclosure, High]
        - label: NOS integration or security regression
          values: [Unknown, High, Partial company disclosure, Medium-high]
        - label: Broadcom silicon supply or roadmap dependency
          values: [Unknown, High, Not publicly disclosed, High]
        - label: Hyperscaler qualification or concentration
          values: [Unknown, High, Not publicly disclosed, High]
        - label: Financial runway and working-capital opacity
          values: [Unknown, High, Not publicly disclosed, High uncertainty]
    approximationNotes: >-
      Impact and residual exposure are qualitative analyst judgments based on the cited disclosures;
      no incident probability, loss distribution, or company financial model is publicly established.
    claimRefs: [CR006, CR007, CR008, CR011, CR013, CR014]
callouts:
  - calloutType: risk
    title: Highest-priority diligence
    body: Export-control controls, production reliability data, customer concentration, and the revenue/backlog bridge are the four evidence gaps most likely to change the risk rating.
    claimRefs: [CR004, CR008, CR011, CR014]
  - calloutType: assumption
    title: No incident inferred
    body: The absence of a recorded public incident in the assigned sources is not evidence that no outage, vulnerability, compliance issue, or customer loss has occurred.
    claimRefs: [CR014]
