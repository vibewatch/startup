  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        Revenue and backlog by customer and product, realized pricing, bill of materials,
        gross margin, warranty reserve, RMA history, support cost, CAC, and payback.
      whyItMatters: >-
        Without these inputs, large deployments cannot be translated into revenue quality,
        contribution margin, operating leverage, or sales efficiency.
      diligencePath: >-
        Obtain audited or management financials, executed contract samples, SKU margin
        schedules, customer cohort data, and warranty and support schedules.
      relatedQuestionRefs: [QI004, QI006, QI010]
      relatedTableRefs: [TI001, TI002, TI003]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: >-
        Current unrestricted cash, burn, runway, debt or credit obligations, purchase
        commitments, inventory working capital, capital expenditure, and next-round trigger.
      whyItMatters: >-
        Funding announcements do not reveal remaining liquidity or the financing required
        to qualify, manufacture, deploy, and support hardware at customer scale.
      diligencePath: >-
        Reconcile financing proceeds to the current balance sheet and review a monthly
        cash forecast with deployment, inventory, downside, and financing scenarios.
      relatedQuestionRefs: [QI007, QI008]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Named customers, deployment scale, customer-level revenue, renewal or expansion
        behavior, backlog cancellation rights, and independent performance validation.
      whyItMatters: >-
        A hyperscaler-focused model may create pricing, timing, and concentration exposure
        that public product and financing announcements cannot quantify.
      diligencePath: >-
        Conduct reference calls and review customer-level revenue, backlog, contract,
        deployment, benchmark, and renewal evidence under confidentiality.
      relatedQuestionRefs: [QI003, QI006, QI010]
      relatedTableRefs: [TI001, TI002, TI003]
