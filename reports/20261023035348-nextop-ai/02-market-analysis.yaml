callouts:
  - calloutType: insight
    title: "The opportunity is credible, but the denominator is unsettled"
    body: "Ethernet share gains, faster switching, and AI-cluster buildout support a large category. The reported $35B, $80B, and $200B figures use different scopes and periods, so a valuation case needs a bottom-up customer and deployment bridge."
    claimRefs: [CM005, CM006, CM007, CM008]
  - calloutType: risk
    title: "Hyperscaler leverage limits pricing certainty"
    body: "Hyperscalers can build internally, multi-source, and use their buying power to pressure suppliers. Nexthop's co-development model may accelerate adoption, but public evidence does not establish contract economics, concentration, or repeatability."
    claimRefs: [CM009, CM012, CM016]
