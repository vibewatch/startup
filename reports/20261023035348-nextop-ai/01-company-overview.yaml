callouts:
  - calloutType: strength
    title: Founder and financing quality
    body: The founder’s prior Arista operating experience and the reported Lightspeed-led financing history are stronger public signals than the company’s still-limited operating disclosure.
    claimRefs: [CO005, CO007, CO008]
  - calloutType: risk
    title: Operating metrics remain unverified
    body: The retained evidence does not verify revenue, backlog, customer concentration, gross margin, or customer renewal performance, while sector analysis warns that infrastructure payback may lag investment by 18–36 months. The $4.2B valuation therefore cannot be tested against operating outcomes.
    claimRefs: [CO006, CO012, CO014]
