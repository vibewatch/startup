evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: A reconciled round-by-round cap table and funding history from management or a filings pack.
    whyItMatters: >-
      Public sources disagree materially on total capital raised, which distorts dilution, preference-stack, and
      valuation interpretation.
    diligencePath: Request the latest cap table, share-class schedule, and board-approved financing summary from management.
    relatedQuestionRefs:
      - QO011
      - QO012
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee map, and clear public executive bench beyond the founders.
    whyItMatters: Late-stage regulated fintechs need stronger governance visibility than the current public record provides.
    diligencePath: Request board composition, observer rights, and succession planning materials.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-map
    missingEvidence: Programme-level economics, revenue-sharing terms, and issuer concentration by partner bank.
    whyItMatters: >-
      The stakeholder map is only directional until the report can show which issuing banks matter most economically and
      operationally.
    diligencePath: Request partner-by-partner active cards, balances, revenue-share terms, and servicing obligations from management.
    relatedQuestionRefs:
      - QO018
      - QO021
    relatedTableRefs:
      - TO003
  - type: stale
    severity: minor
    topic: fy25-revenue
    missingEvidence: A retained FY25 filings-based article or annual filing showing revenue and losses.
    whyItMatters: The current FY25 revenue pointer comes from a database snapshot rather than a verified filings story.
    diligencePath: Refresh MCA-linked financial reporting and compare with later media databases.
    relatedQuestionRefs:
      - QO016
      - QO023
  - type: missing-source
    severity: material
    topic: onecard-som
    missingEvidence: A current official count of active issued OneCard cards, active transactors, and monthly spend throughput.
    whyItMatters: >-
      Without current active-card and usage metrics, public SOM and market-share estimates remain directional rather
      than investment-grade.
    diligencePath: Request active cards, active users, monthly spend, and activation cohorts by issuer partner.
    relatedQuestionRefs:
      - QM011
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: issuer-economics
    missingEvidence: Partner-bank revenue-sharing, interchange splits, and servicing economics by programme.
    whyItMatters: >-
      The buyer-user-payer model cannot be fully underwritten from public sources alone because the economic split sits
      inside issuer contracts.
    diligencePath: Request bank-partner contracts or management summary of economics by issuing partner.
    relatedQuestionRefs:
      - QM012
      - QM014
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: market-forecast
    missingEvidence: A more current 2025 or 2026 public market-study update for premium credit-card segmentation in India.
    whyItMatters: >-
      Most public market studies still speak in broad fintech or digital-lending terms rather than OneCard’s exact
      niche.
    diligencePath: Refresh specialist credit-card and payments market reports before the next valuation update.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Issuer-by-issuer acquisition economics, active-card cohorts, and win-loss data against named competitors.
    whyItMatters: >-
      Public comparison pages describe product features but not whether OneCard is actually winning profitable users
      versus incumbents and fintech peers.
    diligencePath: Request management’s win-loss data, active-card cohorts, and channel economics by competitor set.
    relatedQuestionRefs:
      - QP023
      - QP025
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: private-competitor-metrics
    missingEvidence: >-
      Current disclosed active-user or transaction-scale data for private fintech-card peers such as Scapia, slice, and
      Uni.
    whyItMatters: >-
      Feature comparisons are visible, but scale and retention evidence for peers is thin, which limits confidence in
      competitive ranking.
    diligencePath: Refresh peer databases and public interviews for current user, spend, and funding metrics.
    relatedQuestionRefs:
      - QP010
      - QP025
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, payback, interchange and issuer-share economics, and product-level contribution margin.
    whyItMatters: The company can only be underwritten responsibly once revenue quality is separated from gross volume growth.
    diligencePath: Request channel-level CAC, payback, revenue-share splits, and contribution margins by product and issuer.
    relatedQuestionRefs:
      - QI011
      - QI021
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, and board runway target after the late-2024 round.
    whyItMatters: >-
      Without cash and burn data, capital-adequacy judgment remains indirect and valuation confidence should stay
      capped.
    diligencePath: Request latest management accounts, bank balance, and financing plan.
    relatedQuestionRefs:
      - QI016
      - QI023
    relatedTableRefs:
      - TI004
  - type: conflicting-data
    severity: material
    topic: fy24-conflict
    missingEvidence: A reconciled filing pack that resolves dashboard conflicts on FY24 revenue, loss, and headcount.
    whyItMatters: Conflicting public dashboards can otherwise distort trend analysis and scenario modeling.
    diligencePath: Use MCA filings or audited accounts as the single source of truth on the next refresh.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: technical-transparency
    missingEvidence: >-
      No public API docs, system architecture diagrams, uptime history, or public security documentation for the core
      OneCard platform.
    whyItMatters: >-
      Without technical artifacts, it is hard to judge resilience, integration complexity, and security maturity beyond
      user-facing claims.
    diligencePath: Request internal architecture review, uptime/SLA data, security audit outputs, and incident log.
    relatedQuestionRefs:
      - QE019
      - QE024
    relatedTableRefs:
      - TE003
      - TE004
  - type: private-evidence-only
    severity: important
    topic: feature-adoption
    missingEvidence: Feature-level usage metrics for UPI, EMI conversion, bill pay, offers, and cross-sell adoption.
    whyItMatters: >-
      The difference between “feature exists” and “feature materially changes engagement” is central to underwriting
      product quality.
    diligencePath: Request MAU, WAU, feature adoption funnels, repeat usage, and cross-sell conversion metrics.
    relatedQuestionRefs:
      - QE010
      - QE011
      - QE017
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: important
    topic: security-proof
    missingEvidence: Public proof for certifications, audits, or privacy controls beyond OneScore marketing text.
    whyItMatters: Trust posture is a selling point, but independent evidence remains sparse.
    diligencePath: >-
      Request ISO certificate copies, audit summaries, vulnerability-management process, and DPA/privacy-control
      documentation.
    relatedQuestionRefs:
