company:
  name: FPL Technologies (OneCard)
chapter:
  number: 4
  title: Financials
  summary: 'Public evidence shows OneCard as a real-scale fintech rather than a concept-stage
    card startup: filings-based coverage put FY24 operating revenue at INR 1,425.58
    crore. But the same record still shows weak operating leverage, high promotional
    and miscellaneous expenses, conflicting capital-history dashboards, and a business
    model whose most important issuer-share and reserve economics remain private.
    The chapter verdict is that revenue quality is promising but not yet fully underwriteable,
    especially with issuance continuity exposed to regulatory scrutiny.'
sections:
- id: revenue-model-and-current-signal
  title: Revenue model and current signal
  body: |-
    The current public record says OneCard is no longer a tiny experimental credit-card app. The filings-based Inc42 FY24 story shows revenue rising to INR 1,425.58 crore, but with losses still around INR 401 crore and total expenses near INR 1,866 crore. That combination matters more than the absolute revenue number because it suggests the business found real top-line scale before it found clean operating leverage. The same story also points to a cost base in which promotional and miscellaneous expenses remain very large, which means the revenue model should be viewed as proven in demand terms but not yet fully proven in efficiency terms.

    The company’s user-facing pricing surfaces also help explain the model. OneCard promotes no joining or annual fee, app-led servicing, EMI management, and payments utility rather than an obvious membership-fee model. That implies the core monetization stack likely sits in partner economics, transaction and servicing flows, and adjacent product cross-sell rather than a premium annual-fee stream.
