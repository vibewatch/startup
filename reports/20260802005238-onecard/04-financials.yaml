- id: capital-history-and-financing-dependence
  title: Capital history and financing dependence
  body: |-
    The best-supported late-2024 capital event is the roughly INR 239.4 crore or $28.5 million round reported by Entrackr and Inc42, with ET later framing a realised close closer to $25.5 million. That gap is small enough to preserve the same general conclusion: the company still needed external growth capital in late 2024 and raised a modest amount relative to its unicorn-era headline valuation. Capital-history consistency is weaker. ET cites cumulative equity of $262 million, Inc42 cited more than $111 million, and other dashboards report still different totals. That conflict reduces precision on dilution and historical cash efficiency.

    The practical implication is that financial underwriting should anchor more on latest operating trajectory and current valuation than on any single lifetime-raised figure. Public evidence still supports ongoing institutional backing, but it does not yet prove that the company has escaped financing dependence or can self-fund growth through internally generated profits.
