    - Round was modest relative to scale and prior unicorn mark
  - - Lifetime capital ambiguity
    - Public totals conflict materially
    - Dilution and cash-efficiency analysis stay fuzzy
    - No single reconciled cap-table source
  - - Current valuation band
    - $1.3B-$1.4B late-2024 external range
    - Sets latest private-market context
    - Still below peak-era enthusiasm
  - - Regulatory issuance risk
    - RBI scrutiny reportedly paused new issuance
    - Can disrupt growth and cash-generation timing
    - Resolution timing not fully known
  - - Partner-bank model
    - Issuers hold regulated card relationship
    - May reduce direct balance-sheet burden at FPL
    - Economics and recourse still unclear
  notes: Capital adequacy is judged through fundraising, partner dependence, and regulatory
    continuity because direct cash-balance disclosure is not public.
