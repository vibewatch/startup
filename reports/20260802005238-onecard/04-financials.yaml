  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, payback, interchange and issuer-share economics, and product-level
      contribution margin.
    whyItMatters: The company can only be underwritten responsibly once revenue quality
      is separated from gross volume growth.
    diligencePath: Request channel-level CAC, payback, revenue-share splits, and contribution
      margins by product and issuer.
    relatedQuestionRefs:
    - QI011
    - QI021
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, and board runway target after
      the late-2024 round.
    whyItMatters: Without cash and burn data, capital-adequacy judgment remains indirect
      and valuation confidence should stay capped.
    diligencePath: Request latest management accounts, bank balance, and financing
      plan.
    relatedQuestionRefs:
    - QI016
    - QI023
    relatedTableRefs:
    - TI004
  - type: conflicting-data
    severity: material
    topic: fy24-conflict
    missingEvidence: A reconciled filing pack that resolves dashboard conflicts on
      FY24 revenue, loss, and headcount.
    whyItMatters: Conflicting public dashboards can otherwise distort trend analysis
      and scenario modeling.
    diligencePath: Use MCA filings or audited accounts as the single source of truth
      on the next refresh.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI005
