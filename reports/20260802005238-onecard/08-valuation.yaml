- id: TV003
  title: Bull / base / bear scenario table
  kind: matrix
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Issuance restarts within months, losses narrow, adjacencies help retention
    - Value could move toward $1.8B-$2.2B as risk discount compresses
    - Need proof of governance resolution and margin improvement
    - Possible but currently not yet evidenced
  - - Base
    - Valuation stays anchored near current unicorn zone while diligence gaps persist
    - Roughly $1.1B-$1.5B reflects real scale plus regulatory and opacity discount
    - Range still vulnerable to slower restart or weaker economics
    - Best fit for current public evidence
  - - Bear
    - Issuance pause persists or new marks clear below unicorn threshold
    - Value could compress toward $0.8B-$1.0B despite adoption proof
    - Growth, financing, and brand could all weaken together
    - Plausible if remediation drags
  notes: Ranges are scenario-based estimates, not marked transactions.
