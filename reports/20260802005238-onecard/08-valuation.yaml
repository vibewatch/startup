  figureRefs: []
- id: final-diligence-asks-and-confidence
  title: Final diligence asks and confidence
  body: Confidence should remain medium rather than high because too many core inputs remain private or unresolved. The company may turn out to deserve more than the current valuation zone if audit outcomes are positive, issuer relationships stabilize, and internal risk metrics look better than skeptics fear. But public investors cannot responsibly assume that. The non-negotiable next asks are current issuance status, remediation evidence, cohort loss and retention data, and partner-bank economics before any commitment. Without those, even a seemingly fair private mark can be a trap for impatient investors. With them, OneCard could still become one of the more compelling scaled consumer-fintech stories in India eventually. Until then, valuation confidence should remain medium, scenario ranges should stay wide, and any proposed entry price should be negotiated with the current overhang explicitly in mind.
