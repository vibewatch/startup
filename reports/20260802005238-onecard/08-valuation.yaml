  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-underwriting-pack
    missingEvidence: No management data room for current issuance by bank, risk metrics, active cards, or partner economics.
    whyItMatters: Without those inputs, any valuation remains scenario-heavy and confidence-capped.
    diligencePath: Request current operating dashboard, bank-by-bank issuance status, and commercial model materials.
    relatedQuestionRefs:
    - QV020
    - QV029
    relatedTableRefs:
    - TV003
    - TV006
  - type: conflicting-data
    severity: important
    topic: dashboard-precision
    missingEvidence: Public dashboard sources conflict on revenue, loss, and valuation precision.
    whyItMatters: Conflicting reference points can create false precision in private-market price debates.
    diligencePath: Anchor on audited filings and latest financing docs, then reconcile external trackers against them.
    relatedQuestionRefs:
    - QV020
    - QV027
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: important
    topic: public-comp-multiples
    missingEvidence: The retained source pack does not provide clean live market-cap and multiple tables for all Indian fintech comps.
    whyItMatters: Comparable analysis is directionally useful but less precise than a current-market screen.
    diligencePath: Pull current market-cap and revenue multiple data from exchange filings / market data during live IC work.
    relatedQuestionRefs:
    - QV013
    - QV014
    relatedTableRefs:
    - TV004
