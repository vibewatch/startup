- id: TV004
  title: Comparable valuation table
  kind: enumeration
  enumerationScope:
    coverage: partial
    basis: Rows capture the most decision-useful Indian fintech comparables visible in the retained source pack, mixing private and public references.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - OneCard
    - Current private valuation zone
    - ~$1.3B-$1.4B public-reference zone
    - Direct subject with post-2024 unicorn confirmation
    - Still not a marked, fully transparent price
  - - CRED
    - Private valuation reference
    - ~$4B recent private valuation reference
    - Closest scaled consumer credit-card fintech brand comp
    - Different breadth, member base, and business mix
  - - PB Fintech
    - Public disclosed fintech benchmark
    - Listed company with annual reports and investor-relations disclosure
    - Useful opacity benchmark for Indian fintech valuation discipline
    - Business model differs materially from co-branded cards
  - - slice
    - Regulatory-risk comp
    - Strategic bank-stake move after RBI friction; no clean retained valuation point here
    - Good evidence for how regulation can change fintech value paths
    - Not a clean like-for-like valuation comp
  - - Scapia
    - Growth-stage co-branded-card comp
    - $63M fresh round; $135M total raised
    - Shows category funding appetite persists
    - Much earlier stage and smaller scale than OneCard
  notes: Comparable relevance is stronger than comparable precision; public evidence does not support a pure like-for-like multiple set.
