    - Proof of resolved regulatory overhang and better earnings quality would strengthen the case
  - - 'Anti-thesis: partner-bank and regulatory boundaries can cap growth regardless of product quality'
    - If issuance restarts smoothly and partner economics look durable, the anti-thesis weakens
  - - 'Optionality: OneScore and adjacent products could deepen retention and monetization'
    - Evidence of actual cross-sell conversion and contribution margin would raise value
  notes: Arguments are intentionally evidence-sensitive rather than narrative-complete.
