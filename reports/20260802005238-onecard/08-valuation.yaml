- id: scenario-range-and-thesis-breaks
  title: Scenario range and thesis-breaks
  body: The scenario range should be wide because the main unknown is not market size but execution through regulation. A smooth restart, cleaner governance boundaries, and visible loss improvement can support upside from the current zone. A long remediation cycle or fresh partner hesitation can erase that support quickly. Public evidence therefore justifies a range rather than a point estimate. It also implies that investors should focus less on defending a spreadsheet-decimal valuation today and more on identifying the exact events that would move the business from “promising but constrained” into either “de-risked compounder” or “structurally impaired distributor.” That is a healthier frame for private fintech investing than pretending a single headline mark fully answers the underlying debate. In that sense, the kill criteria are as important as the bull case. Investors who ignore those triggers risk confusing optionality with inevitability, especially in a sector where regulatory boundaries
    can reprice a company faster than raw user growth can save it.
  claimRefs:
  - CV013
  - CV028
  - CV029
  - CV030
  - CV031
  - CV034
  - CV035
  - CV036
  - CV037
  tableRefs:
