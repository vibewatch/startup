- id: TV005
  title: Thesis-break and kill triggers table
  kind: matrix
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Regulatory remediation stalls
    - No clear restart path within two quarters
    - Base case shifts toward bear
    - Pause investment and demand new price or proof
  - - Partner-bank continuity weakens
    - Key issuer exits or materially constrains flow
    - Distribution model loses durability
    - Re-underwrite as structurally weaker platform
  - - Loss quality disappoints
    - Cohort losses / fraud / reserves are materially worse than implied
    - Scale narrative weakens
    - Do not pay unicorn-level price
  - - Cross-sell proves immaterial
    - Adjacency adds little retention or revenue
    - Optionality premium vanishes
    - Keep value anchored near core card economics only
  notes: These triggers define when the recommendation should change, not just when sentiment changes.
  claimRefs:
  - CV012
  - CV013
  - CV029
  - CV031
  - CV032
  - CV034
- id: TV006
  title: Final diligence asks table
  kind: matrix
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current issuance status
    - Exact live status by bank partner
    - Determines whether growth engine is actually back
    - Management + partner bank confirmations
  - - Audit / remediation
    - Audit scope, findings, remediation tracker
    - Main gating factor for risk discount
    - Management + compliance materials
  - - Cohort economics
    - Charge-offs, fraud, retention, active cards, unit economics
    - Separates real scale from expensive scale
    - Finance and risk diligence
  - - Partner economics
    - Revenue share, servicing splits, reserve exposure
    - Needed to convert revenue into valuation quality
    - Commercial diligence with management and issuers
  - - Cross-sell contribution
    - OneScore / adjacency conversion and margin impact
    - Determines whether optionality deserves premium
    - Product / growth diligence
  notes: These are the minimum asks required before moving from tracking interest to conviction.
