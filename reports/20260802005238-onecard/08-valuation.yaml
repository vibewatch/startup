- id: valuation-context-and-comparable-set
  title: Valuation context and comparable set
  body: 'Valuation context is unusually bifurcated. On one side, Hurun still confirms that OneCard remained a unicorn after August 2024, while ET and GetLatka cluster current value around roughly $1.3 billion to $1.4 billion. On the other, Hurun’s reported $2.8 billion markdown versus the peak tells investors that the market has already repriced the company sharply. The best comp set is therefore mixed: CRED as a larger private consumer-credit-card ecosystem, PB Fintech as a listed Indian fintech benchmark with strong public disclosure, slice as a regulatory-risk comp, and Scapia as a newer co-branded-card growth comp. No single comparable is perfect, which is precisely why price discipline matters more than storytelling precision here. The job of the comp set is not to produce a fake exact multiple; it is to show that OneCard sits between better-disclosed public fintechs and less-transparent private consumer-credit brands, and deserves both a scale premium and an opacity discount at the
    same time.'
