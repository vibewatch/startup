- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, monitoring, and kill criteria
  body: There is a path to a more acceptable risk posture, but it is conditional. The encouraging sign is that public reporting frames the situation as audit-and-remediation rather than a publicly disclosed live-book shutdown or confirmed breach. Still, investors should not confuse “resumption is possible” with “risk is solved.” The key is whether OneCard can show durable governance boundaries, bank confidence, grievance improvement, and restored issuance without materially slowing the consumer experience that made the product attractive in the first place. If remediation drags, partners waver, or customer-friction evidence compounds, the current thesis breaks regardless of product quality. Conversely, if OneCard restores issuance, proves cleaner governance boundaries, and shows that complaints stay contained rather than systemic, then the present risk stack can move from thesis-break territory to normal regulated-fintech execution risk. That is the line investors should monitor. In short,
    the public record supports caution, not panic, and it makes risk resolution more important than product narration for the next stage of diligence.
  claimRefs:
