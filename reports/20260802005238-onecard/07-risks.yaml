company:
  name: FPL Technologies (OneCard)
chapter:
  number: 7
  title: Risks
  summary: OneCard’s risk stack is dominated by regulatory/data-governance exposure around its co-branded issuer model. Partner dependence, execution complexity, model opacity, and customer-trust fragility matter too, but mostly as second-order effects of how the company resolves the current compliance and control challenge.
acknowledgedWarnings:
- dimension: paywallRisk
  reason: Several risk-relevant official or review surfaces returned broken states during this run, and keeping them is necessary to document the trust-surface and disclosure gaps themselves.
sections:
- id: regulatory-and-legal-risk-stack
  title: Regulatory and legal risk stack
  body: 'The defining risk in the current public record is not demand, competition, or even headline burn; it is regulatory design. Multiple independent reports say RBI-linked scrutiny interrupted new issuance and focused on how customer data, consent, and responsibility are handled inside the co-branded structure. That matters because OneCard’s model deliberately sits between bank control and fintech UX. If that boundary is judged too porous, remediation can affect onboarding, analytics, servicing, and growth simultaneously. The legal surface is also thinner than ideal for external diligence: issuer-bank terms and key fact statements are visible, but several core OneCard trust pages were unavailable in this run, which weakens external comfort on current consumer-facing legal transparency.'
