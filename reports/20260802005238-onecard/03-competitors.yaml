  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Issuer-by-issuer acquisition economics, active-card cohorts,
      and win-loss data against named competitors.
    whyItMatters: Public comparison pages describe product features but not whether
      OneCard is actually winning profitable users versus incumbents and fintech peers.
    diligencePath: Request management’s win-loss data, active-card cohorts, and channel
      economics by competitor set.
    relatedQuestionRefs:
    - QP023
    - QP025
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: private-competitor-metrics
    missingEvidence: Current disclosed active-user or transaction-scale data for private
      fintech-card peers such as Scapia, slice, and Uni.
    whyItMatters: Feature comparisons are visible, but scale and retention evidence
      for peers is thin, which limits confidence in competitive ranking.
    diligencePath: Refresh peer databases and public interviews for current user,
      spend, and funding metrics.
