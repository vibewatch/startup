- id: durability-and-competitive-risks
  title: Durability and competitive risks
  body: |-
    Public evidence supports a differentiated position, but not a hard moat. OneCard’s strongest attributes—fee simplicity, app control, metal-card branding, and a reasonably wide issuer set—are useful, yet most of them are easier to copy than community lock-in, deep issuer ownership, or proprietary transaction ecosystems. That leaves the company vulnerable to feature convergence, especially as UPI-linked app experiences become normal.

    The market therefore looks crowded where OneCard most wants to play: digitally engaged Indian consumers who care about rewards, travel economics, and clean app UX. A disciplined investor should therefore look less for a static feature win and more for repeated proof that OneCard can keep user engagement high while defending issuer relationships and merchant relevance. The final competitive judgment is that OneCard is well-positioned, but its durability depends more on execution, partner continuity, and brand relevance than on any public evidence of an unassailable structural moat.
