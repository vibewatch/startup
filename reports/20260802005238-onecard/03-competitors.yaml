- id: structure-lock-in-and-substitution
  title: Structure, lock-in, and substitution
  body: |-
    Structure matters as much as rewards. Cards such as Regalia, Atlas, and SimplyCLICK are issuer-owned, which gives their banks cleaner control over economics, servicing, and brand consistency. OneCard instead sits inside a multi-bank co-branded structure. That can broaden distribution, but it also means the company depends on partner alignment and regulatory clarity in ways issuer-owned cards do not. This is one reason competitive durability is difficult to assess from marketing surfaces alone.

    Substitution also happens outside classic bank cards. CRED competes on prime-user identity and community, Scapia on zero-forex travel utility, and slice or Uni on more bundled app-native money experiences. OneCard therefore has to defend not just a rewards schedule, but a reason for the user to open and keep a specialist card app. That retention test is likely won or lost through habitual engagement and partner reliability, not marketing copy alone. Pricing clarity helps, but it will not be sufficient by itself.
