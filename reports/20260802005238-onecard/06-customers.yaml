- id: satisfaction-retention-and-friction
  title: Satisfaction, retention, and friction
  body: The public record shows support for customer satisfaction, but only indirectly. High app ratings and large review counts suggest that enough users find the experience credible to rate it positively. Yet public complaint evidence still matters because a mobile-first financial product can lose trust quickly when money movement or support breaks down. The clearest adverse example in this source pack is the FD-refund complaint, which is especially relevant for secured-card customers whose credit-building journey depends on predictable closure and refund handling. Just as important, there is no public churn, retention, or renewal disclosure. For diligence purposes, that means ratings are proof of existence and broad approval, but not proof of durable customer love or long-term card economics. That distinction is central for consumer-fintech underwriting and should keep investors from overreading app-store enthusiasm as retention truth or loyalty proof.
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU026
  - CU027
  - CU028
  - CU033
  - CU035
  - CU036
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-loops-and-concentration-risks
  title: Expansion loops and concentration risks
  body: 'OneCard’s expansion logic appears to work through two loops. The first is behavioral: once approved, the app pushes customers into recurring actions such as bill payment, EMI management, rent, UPI, and merchant offers, which can raise engagement frequency. The second is portfolio-based: adjacent products like OneScore allow FPL to keep a relationship with users around bureau monitoring and dispute workflows, even when the flagship card is not the only touchpoint. The flip side is concentration. Customer growth still depends on partner-bank issuing capacity, support quality, and regulatory comfort, as shown by the RBI-linked issuance pause. It also means a smooth app experience can still be undermined by external servicing or policy bottlenecks. So the public customer story is attractive on acquisition breadth and engagement surface area, but still incomplete on denominator transparency, concentration, and cohort durability. Those are exactly the metrics that decide whether scale
    compounds efficiently or merely looks impressive at the app layer.'
