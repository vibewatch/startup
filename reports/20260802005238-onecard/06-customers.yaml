- id: adoption-signal-and-customer-proof-depth
  title: Adoption signal and customer-proof depth
  body: 'The strongest public customer proof is aggregate, not logo-based. OneCard’s app-store pages and AppBrain tracking provide evidence of mass-market reach, high review volume, and continued updates, which is more persuasive for a consumer fintech than a few curated testimonials would be. Android evidence is particularly deep: AppBrain shows more than 10 million Play downloads and roughly 32 million cumulative downloads on its own tracking surface, alongside hundreds of thousands of ratings. Apple’s App Store adds another large rating base. Together those signals strongly support that OneCard is not a niche or dormant product. However, they still stop short of answering the investor-grade questions that matter most—how many active funded cards exist, how frequently approved customers transact, and how many remain engaged beyond the first activation period. The result is a chapter with convincing breadth proof but incomplete monetization proof. That still clears the bar for real market
    presence, just not for precise LTV underwriting or clean retention forecasting yet.'
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
