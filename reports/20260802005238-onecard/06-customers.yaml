  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-denominator
    missingEvidence: No public MAU, active cards, repeat spend, churn, or cohort-retention data.
    whyItMatters: Without denominator metrics, customer quality cannot be translated into durable revenue or valuation confidence.
    diligencePath: Request month-1/3/6/12 activation, transacting-user, spend-frequency, and churn cohorts by issuer and product type.
    relatedQuestionRefs:
    - QU019
    - QU022
    - QU024
    relatedTableRefs:
    - TU002
    - TU004
  - type: missing-source
    severity: important
    topic: named-customer-proof
    missingEvidence: No public named customer roster or case studies because OneCard is a consumer card.
    whyItMatters: The chapter must rely on aggregate app-community proof, which is real but less diagnostic than segmented production cohorts.
    diligencePath: Request anonymized cohort studies, NPS by segment, and complaint-rate breakdowns for secured versus unsecured users.
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: important
    topic: concentration
    missingEvidence: Share of customers and receivables by issuer bank, secured-card users, and cross-sell conversion.
    whyItMatters: Customer concentration risk cannot be ranked cleanly without knowing which channels or banks dominate.
    diligencePath: Request customer mix, receivable mix, and acquisition split by bank and product.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
