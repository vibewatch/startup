- id: TU005
  title: Expansion and concentration risk table
  kind: matrix
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Everyday payment utilities
    - If utilities do not convert into habitual card spend, engagement may be shallow
    - Weak monetization and limited LTV uplift
    - Request transaction-frequency cohorts by feature
  - - FD-backed entry point
    - Refund or closure friction can poison trust with credit-builders
    - Reputation damage in a sensitive segment
    - Request secured-card closure metrics and complaint trends
  - - OneScore cross-sell
    - Cross-sell may be broad but not monetizing
    - Overstated ecosystem value
    - Request cross-sell conversion and monetization rates
  - - Partner-bank issuance
    - Growth depends on external issuers and servicing partners
    - Issuance pauses can stop acquisition abruptly
    - Request approval, issuance, and servicing split by bank
  - - Regulatory continuity
    - RBI scrutiny can reduce new-customer flow regardless of app demand
    - Customer growth may stall despite strong app interest
    - Request current issuance status and remediation milestones
  notes: Expansion loops are visible, but the public record lacks the denominators needed to rank their economic importance.
