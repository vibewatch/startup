  topStrengths:
    - FY24 收入规模真实，证据也清楚表明业务早已越过试点阶段。
    - Android 和 iOS 端的应用采用代理指标强，支撑其真实消费者触达。
    - 产品宽度已超出基础信用卡，延伸到 UPI、账单、EMI、优惠和相邻信贷工具。
    - 即使私募市场明显变冷，2024 年末投资人仍继续支持。
    - 2024 年后的独角兽确认性证据仍把公司放在 $1B 门槛之上。
  topRisks:
    - RBI 针对联名发卡模式的审视是主导风险，并直接影响增长。
    - 公开证据仍显示盈利质量偏弱：收入增长的同时，FY24 亏损很大。
    - 对合作银行的依赖带来结构性集中度和执行风险，不完全由 FPL 自身控制。
    - 当前公开尽调对核销、欺诈、准备金、活跃卡和合作银行经济性披露都偏薄。
    - 如果担保卡服务或投诉处理出问题，客户信任仍可能变得脆弱。
  unresolvedGaps:
    - 各银行伙伴的当前发卡状态和整改进度，还没有一手材料验证。
    - 活跃卡队列、留存、流失和重复消费数据仍未披露。
    - 核销、欺诈损失率、准备金政策和分客群信贷表现没有公开。
    - FPL 与发卡银行之间的收入分成和服务经济性仍不透明。
    - 当前股权结构条款、优先权，以及 2024 年后任何刷新过的交易标记价格仍是私有信息。
