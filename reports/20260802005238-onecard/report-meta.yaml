companyProfile:
  summary: OneCard is the consumer credit-card brand operated by FPL Technologies, a Pune-based Indian fintech founded in 2019. The company built a mobile-first co-branded card stack around a premium metal card, virtual-card issuance, rewards, UPI, bill-pay, and issuer-specific servicing, and later expanded into adjacent products such as OneScore and Wizely. Public evidence supports real revenue scale, strong app adoption proxies, and continued investor support, but still leaves core private-market underwriting inputs unresolved.
