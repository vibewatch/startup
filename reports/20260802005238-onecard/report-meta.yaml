  productSummary: Mobile-managed co-branded credit-card platform with premium metal and virtual cards, app-based controls, rewards, EMI, utility payments, UPI-on-credit-card, and adjacent credit-score and savings products.
  customerFocus: Indian consumers spanning new-to-credit applicants, secured-card users, and premium-aspirational spenders who want an app-native card experience.
  businessModel: Consumer credit-card distribution and servicing layer built with regulated issuing-bank partners, complemented by adjacent engagement and cross-sell surfaces such as OneScore.
