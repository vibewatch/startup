      - number: '1.2'
        title: Founders, headquarters, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The current public record is directionally clear on identity but less clean on founder count. ET, Inc42,
              and filings-based coverage repeatedly name Anurag Sinha, Rupesh Kumar, and Vibhav Hathi as the founding
              trio, and Tracxn’s founder profiles reinforce their centrality to the brand. At the same time, Tracxn also
              surfaces Hari Velayudan and Devang Shah in senior founding and risk roles, which means the simplified
              three-name storyline is best treated as the public-facing core rather than the entire operating bench.
              That nuance matters for governance: the company has enough scale and regulatory exposure that investors
              should care about who actually owns product, risk, compliance, and board oversight beyond the visible
              founders.


              Headquarters evidence is stronger than founder-bench depth. Tracxn, YNOS, and the Apple App Store listing
              all anchor the company in Pune, and Tracxn gives a specific Baner registered address. The larger diligence
              takeaway is that public leadership visibility remains founder-heavy even after unicorn status and multiple
              financing rounds. Investors can verify the company’s city, history, and sector quickly, but cannot yet
              build a robust public view of board independence, succession readiness, or institutional governance depth
              from the source pack alone.
