  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and rival set
        blocks:
          - type: paragraph
            body: >-
              OneCard does not face a single obvious opponent; it competes across at least three layers. First are
              premium bank-issued cards such as Regalia, Regalia Gold, and Axis Atlas that own lounge-heavy travel and
              affluent-customer positioning. Second are fintech-led brands such as CRED, Scapia, slice, and Uni that
              compete on app-native behaviour, fee framing, or a more bundled money experience. Third are simpler
              shopping or entry-level cards like SBI SimplyCLICK that can pull price-sensitive or digitally active users
              who do not need a specialist premium-card app.


              That means diligence should not ask whether OneCard “wins the card market.” It should ask whether OneCard
              can keep a differentiated wedge between premium bank cards above it, simplified shopping cards below it,
              and community or app-led fintech alternatives beside it. Tracxn’s tracked set and Card Insider’s
              fintech-card list both show this is a visibly crowded category.
