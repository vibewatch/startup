  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surfaces and user jobs
        blocks:
          - type: paragraph
            body: >-
              OneCard’s public product story is unusually consistent across its own FAQ, app-store pages, and
              partner-bank pages. The core promise is not merely a credit line but a mobile-managed card experience:
              application, instant virtual-card readiness, controls, rewards, repayments, EMI conversion, utility
              payments, and nearby-offer discovery all sit inside the same app shell. That matters because the product
              is not sold as a static bank card; it is sold as a software-guided payments relationship whose premium
              physical token happens to be a metal card. The adjacent surfaces—OneScore for bureau insights and Wizely
              for savings and FDs—also show a broader ambition to own more of the consumer’s credit-and-money interface,
              even when those products are not yet deeply documented as direct in-app modules. That broader wallet
              ambition matters because it can deepen engagement without needing to win a fresh acquisition cycle every
              time the company launches a new money product and can improve retention economics if executed well.
