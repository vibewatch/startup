      - number: '3.2'
        title: Feature and pricing comparisons
        blocks:
          - type: paragraph
            body: >-
              OneCard’s public proposition is strongest where other cards look fussy or fee-heavy: no joining or annual
              fee, low forex, app control, EMI tools, and an offer layer. That is meaningful but not unbeatable. Bank
              premium cards still dominate on lounge and insurance breadth, and travel-first cards such as Scapia and
              Axis Atlas concentrate benefits more aggressively around travel use cases. On the other end, SBI
              SimplyCLICK shows that low-fee, easy-to-explain shopping rewards can pressure OneCard from below without
              pretending to be premium.


              The important competitive takeaway is that OneCard’s public edge is usually a bundle rather than a
              knockout singular feature. Very few rivals combine metal-branding, low explicit fees, app-led control, and
              multi-bank issuance in quite the same way. That bundle can still matter in customer choice because it
              reduces cognitive friction for users who want one card that feels premium without premium-card complexity.
              But each individual element has substitutes, which is why feature copy risk remains real.
