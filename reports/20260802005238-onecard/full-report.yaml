            body: >-
              Public evidence points to a customer base that is broader than a simple “premium metal card” label
              suggests. Paisabazaar frames OneCard as beginner-friendly and relatively relaxed on eligibility, while
              Economic Times and the company’s own product language preserve an aspirational premium angle through the
              metal-card positioning. The result is a mixed segment: new-to-credit consumers, customers seeking a more
              app-native card experience, and spenders attracted by rewards and low-forex positioning. That blend
              matters because it can widen the top of funnel, but it also complicates retention analysis when the public
              record does not break out cohorts by income band, bureau depth, or secured-versus-unsecured mix. The
              digital onboarding story is much clearer: public pages consistently emphasize app-led application, instant
              virtual-card readiness, and issuer-bank optionality at the entry point. That makes the top of funnel look
