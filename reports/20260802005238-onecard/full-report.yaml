          - type: paragraph
            body: >-
              The scenario range should be wide because the main unknown is not market size but execution through
              regulation. A smooth restart, cleaner governance boundaries, and visible loss improvement can support
              upside from the current zone. A long remediation cycle or fresh partner hesitation can erase that support
              quickly. Public evidence therefore justifies a range rather than a point estimate. It also implies that
              investors should focus less on defending a spreadsheet-decimal valuation today and more on identifying the
              exact events that would move the business from “promising but constrained” into either “de-risked
              compounder” or “structurally impaired distributor.” That is a healthier frame for private fintech
              investing than pretending a single headline mark fully answers the underlying debate. In that sense, the
              kill criteria are as important as the bull case. Investors who ignore those triggers risk confusing
              optionality with inevitability, especially in a sector where regulatory boundaries can reprice a company
              faster than raw user growth can save it.
            claimRefs:
              - CV013
              - CV028
              - CV029
              - CV030
              - CV031
              - CV034
              - CV035
              - CV036
              - CV037
          - type: table
            tableRef: TV005
            claimRefs:
              - CV012
              - CV013
              - CV029
              - CV031
              - CV032
              - CV034
      - number: '8.4'
        title: Final diligence asks and confidence
        blocks:
          - type: paragraph
            body: >-
              Confidence should remain medium rather than high because too many core inputs remain private or
              unresolved. The company may turn out to deserve more than the current valuation zone if audit outcomes are
              positive, issuer relationships stabilize, and internal risk metrics look better than skeptics fear. But
              public investors cannot responsibly assume that. The non-negotiable next asks are current issuance status,
              remediation evidence, cohort loss and retention data, and partner-bank economics before any commitment.
              Without those, even a seemingly fair private mark can be a trap for impatient investors. With them,
              OneCard could still become one of the more compelling scaled consumer-fintech stories in India eventually.
              Until then, valuation confidence should remain medium, scenario ranges should stay wide, and any proposed
              entry price should be negotiated with the current overhang explicitly in mind.
            claimRefs:
              - CV020
              - CV024
              - CV026
              - CV027
              - CV032
              - CV033
              - CV038
              - CV039
              - CV040
