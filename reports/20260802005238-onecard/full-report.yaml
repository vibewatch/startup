  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The public record supports interest in OneCard, but only with disciplined pricing and
              incomplete-confidence posture. The strongest positive facts are real revenue scale, obvious consumer
              adoption, continued institutional backing, and still-valid unicorn status in post-2024 evidence. The
              strongest negative facts are equally clear: the regulatory interruption is not hypothetical, the company
              still posts large losses, and the current public record does not resolve underwriting questions around
              loss rates, partner economics, or remediation completeness. That combination makes “buy because it is a
              strong brand” too simplistic and “pass because regulation exists” too blunt. The right starting point is a
              track-or-research-more stance with explicit willingness to move only if price improves materially or
              evidence improves. In other words, OneCard may still be attractive, but the burden of proof now sits on
              underwriting discipline rather than category excitement. A strong brand and obvious app adoption are
              necessary conditions for value, not sufficient ones in this case.
