  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and regulatory frame
        blocks:
          - type: paragraph
            body: >-
              OneCard does not sit in the whole Indian digital-payments market, nor even in the whole credit market. The
              most accurate boundary is the regulated co-branded credit-card layer inside India’s much larger
              digital-payments system. RBI’s card master directions matter because they define what co-branding is,
              require issuer control and disclosure, and explicitly restrict partner access to transaction data. That is
              not a technical detail; it shapes OneCard’s available business model and explains why partner-bank
              relationships and data-sharing rules can directly affect issuance.


              This boundary also clarifies what should be excluded from headline TAM claims. UPI volume, QR-code
              deployment, and all retail digital transactions matter as context because they show how comfortable Indian
              consumers are with digital money movement. But they are not equivalent to OneCard’s realistic opportunity.
              OneCard still requires a regulated issuer, partner approval, app adoption, and a user who wants more than
              a generic payment app. In diligence terms, this is a card-programme and customer-control market nested
              inside a much broader payments system.
            claimRefs:
