  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and current signal
        blocks:
          - type: paragraph
            body: >-
              The current public record says OneCard is no longer a tiny experimental credit-card app. The filings-based
              Inc42 FY24 story shows revenue rising to INR 1,425.58 crore, but with losses still around INR 401 crore
              and total expenses near INR 1,866 crore. That combination matters more than the absolute revenue number
              because it suggests the business found real top-line scale before it found clean operating leverage. The
              same story also points to a cost base in which promotional and miscellaneous expenses remain very large,
              which means the revenue model should be viewed as proven in demand terms but not yet fully proven in
              efficiency terms.


              The company’s user-facing pricing surfaces also help explain the model. OneCard promotes no joining or
              annual fee, app-led servicing, EMI management, and payments utility rather than an obvious membership-fee
              model. That implies the core monetization stack likely sits in partner economics, transaction and
              servicing flows, and adjacent product cross-sell rather than a premium annual-fee stream.
