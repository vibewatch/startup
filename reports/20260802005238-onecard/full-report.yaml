      - number: '6.4'
        title: Expansion loops and concentration risks
        blocks:
          - type: paragraph
            body: >-
              OneCard’s expansion logic appears to work through two loops. The first is behavioral: once approved, the
              app pushes customers into recurring actions such as bill payment, EMI management, rent, UPI, and merchant
              offers, which can raise engagement frequency. The second is portfolio-based: adjacent products like
              OneScore allow FPL to keep a relationship with users around bureau monitoring and dispute workflows, even
              when the flagship card is not the only touchpoint. The flip side is concentration. Customer growth still
              depends on partner-bank issuing capacity, support quality, and regulatory comfort, as shown by the
              RBI-linked issuance pause. It also means a smooth app experience can still be undermined by external
              servicing or policy bottlenecks. So the public customer story is attractive on acquisition breadth and
              engagement surface area, but still incomplete on denominator transparency, concentration, and cohort
              durability. Those are exactly the metrics that decide whether scale compounds efficiently or merely looks
              impressive at the app layer.
