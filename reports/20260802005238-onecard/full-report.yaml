      - number: '4.3'
        title: Unit economics proxies and blind spots
        blocks:
          - type: paragraph
            body: >-
              The public source pack is rich enough to show direction but not enough to underwrite textbook fintech unit
              economics. The strongest negative proxy is simple: revenue grew dramatically, but losses barely improved
              and marketing remained heavy. The strongest positive proxy is that the company appears to have built a
              broader product stack around the base card, with OneScore and Wizely extending the relationship into
              adjacent credit-score and savings use cases. That may improve lifetime value or lower re-acquisition cost,
              but public sources do not quantify those effects.


              Investors should therefore treat public unit economics as an incomplete mosaic. We can see evidence of
              scale, cross-sell ambition, and an app-led servicing engine, but we cannot see CAC, payback, delinquency
              curves, charge-offs, or revenue-share economics with issuing banks. Those missing denominators are exactly
              the variables that determine whether current revenue quality is durable or merely expensive to produce.
