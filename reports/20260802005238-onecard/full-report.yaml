      - number: '7.2'
        title: Operational and customer-trust risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, OneCard looks like a shared machine: issuer-specific support rails, app-based controls,
              repayment flows, statements, and collections or KFS references all sit across FPL and bank surfaces. That
              can work well in normal times, but it also creates handoff risk, accountability blur, and slower problem
              resolution when issues cross organizational boundaries. The clearest adverse public example in this run is
              the FD-refund complaint, where closure and refund handling allegedly broke down for a secured-card
              customer. That single complaint does not prove systemic failure, but it illustrates how quickly trust can
              erode in a mobile-first financial product when money movement or support responsiveness goes wrong. Broken
              official landing pages add a second-order operational concern: not necessarily product failure, but
              incomplete public controls and documentation hygiene. For a consumer-credit product, those softer
              weaknesses can still matter because disclosure reliability, support discoverability, and predictable
              closure flows are part of the trust product, not merely marketing garnish. Investors should therefore
              treat web-surface instability as a weak signal rather than a thesis-break on its own, but it is still
              directionally negative when combined with regulatory scrutiny and complaint evidence.
