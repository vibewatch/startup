    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk stack
        blocks:
          - type: paragraph
            body: >-
              The defining risk in the current public record is not demand, competition, or even headline burn; it is
              regulatory design. Multiple independent reports say RBI-linked scrutiny interrupted new issuance and
              focused on how customer data, consent, and responsibility are handled inside the co-branded structure.
              That matters because OneCard’s model deliberately sits between bank control and fintech UX. If that
              boundary is judged too porous, remediation can affect onboarding, analytics, servicing, and growth
              simultaneously. The legal surface is also thinner than ideal for external diligence: issuer-bank terms and
              key fact statements are visible, but several core OneCard trust pages were unavailable in this run, which
              weakens external comfort on current consumer-facing legal transparency.
