        title: Partner, financial, and execution risks
        blocks:
          - type: paragraph
            body: >-
              The partner model amplifies execution risk because OneCard needs multiple institutions to stay aligned on
              issuance, service, compliance boundaries, and remediation pace. A pause can therefore spread through the
              company faster than at a monoline bank card issuer. Financially, the business still carried heavy losses
              in FY24, so time is not neutral. If compliance work slows acquisition for quarters, the company faces the
              risk of defending both growth and cash efficiency at the same time. The public record also leaves major
              credit-model variables opaque—charge-offs, fraud losses, reserve mechanics, and segment-specific risk—so
              investors cannot assume that revenue scale automatically translates into durable economics once issuance
              resumes. This is especially important because a remediation-heavy period can absorb management time, slow
              product iteration, and shift the company’s focus toward control implementation instead of pure customer
