            body: >-
              The public record shows support for customer satisfaction, but only indirectly. High app ratings and large
              review counts suggest that enough users find the experience credible to rate it positively. Yet public
              complaint evidence still matters because a mobile-first financial product can lose trust quickly when
              money movement or support breaks down. The clearest adverse example in this source pack is the FD-refund
              complaint, which is especially relevant for secured-card customers whose credit-building journey depends
              on predictable closure and refund handling. Just as important, there is no public churn, retention, or
              renewal disclosure. For diligence purposes, that means ratings are proof of existence and broad approval,
              but not proof of durable customer love or long-term card economics. That distinction is central for
              consumer-fintech underwriting and should keep investors from overreading app-store enthusiasm as retention
