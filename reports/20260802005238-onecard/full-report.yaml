      - number: '4.4'
        title: Financial verdict and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Financially, OneCard screens as a scaled but still partially opaque revenue business. The top line is real
              enough to matter, yet public evidence still leaves margin quality, balance-sheet exposure, and partner
              economics unresolved. That uncertainty would matter even in a stable regulatory environment; it matters
              more because new issuance was reportedly paused during RBI scrutiny of the co-branded arrangement. For a
              business still growing through partner-bank distribution, any interruption at the top of the funnel is a
              financial event, not just a compliance footnote.


              The final financial reading is therefore balanced but cautious. OneCard has moved far beyond idea-stage
              fintech economics, and its late-2024 capital raise suggests credible investor support remains. However,
              the absence of public CAC, take-rate, reserve, and issuer-economics disclosure keeps the financial chapter
              in “directionally promising, not yet fully underwriteable” territory. That is enough to keep interest
              alive, but not enough to clear a full investment-committee standard without private data.
