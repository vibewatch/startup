            body: >-
              Public evidence supports a careful architecture reading. Partner banks appear to own the regulated issuing
              perimeter, formal card documents, and at least some portions of collections or servicing, while FPL
              controls the user-facing software, offer discovery, card controls, and much of the service interaction
              design. Federal Bank’s page is especially useful because it documents in-app statements, in-app repayment
              via multiple rails, and swipe2Pay as an authentication flow. Those details suggest that OneCard’s moat is
              less about inventing a new card rail and more about orchestrating issuer, network, repayment, and
              user-interface layers into a single consumer experience. The trade-off is equally visible: the public
              stack is operationally dependent on counterparties and does not expose external APIs or engineering
              documentation that would let outsiders validate deeper internals. As a result, product elegance is easier
