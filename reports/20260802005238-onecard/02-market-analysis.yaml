- id: buyer-user-payer-and-substitutes
  title: Buyer, user, payer, and substitutes
  body: |-
    In OneCard’s core workflow, the user is the consumer, the regulated payer-creditor is the issuing bank, and the app company is the acquisition and engagement layer. That separation makes the market very different from a pure lender or a pure bank-issued premium card. OneCard has to convince users that a specialist app is worth opening, convince banks that the programme economics and compliance are acceptable, and convince regulators that the co-branded structure does not create back-door control problems.

    Substitutes therefore come from several directions. CRED competes for similar premium or prime users with a score-gated membership model. Regalia and Atlas compete as issuer-owned premium cards with stronger lounge and travel positioning. SBI SimplyCLICK competes as a simpler low-fee shopping card, while slice and Uni compete by wrapping credit into broader app-led money experiences. OneCard’s niche is not “all cards”; it is the intersection of app-native control, relaxed enough onboarding to expand beyond elite travel-card users, and enough rewards or fee advantages to keep consumers from defaulting back to issuer apps or larger super-apps.
