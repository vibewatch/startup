- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - User need
  - Default substitute
  - Why OneCard fits
  - Main friction
  rows:
  - - Prime or premium card manager
    - Control over multiple spends, rewards, and travel/forex costs
    - CRED or issuer premium apps
    - OneCard offers app control plus low explicit fees
    - Can defect to richer lounge/travel products
  - - New-to-credit but digitally comfortable user
    - Easy onboarding and starter credit experience
    - Entry-level issuer cards or secured products
    - OneCard markets relaxed eligibility and FD-backed options
    - Approval still depends on partner-bank criteria
  - - Travel and rewards optimiser
    - Low forex and offer discovery
    - Regalia, Atlas, Scapia, airline cards
    - OneCard can win on fee simplicity and app UX
    - Lounge-rich cards may outcompete on premium perks
  - - Generic online shopper
    - Simple rewards on e-commerce
    - SBI SimplyCLICK and cashback cards
    - OneCard offers 5X category rewards and app controls
    - Shopping-only cards can be simpler and cheaper
  - - UPI-first app user
    - Single app for everyday pay and credit extension
    - slice, super-apps, issuer apps
    - OneCard UPI can deepen habit inside the app
    - UPI itself is easy to commoditise
  notes: The segment map focuses on where OneCard is most or least differentiated
    relative to common Indian card substitutes.
