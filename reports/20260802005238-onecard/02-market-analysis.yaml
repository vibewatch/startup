- id: TM002
  title: TAM/SAM/SOM or sizing lens table
  columns:
  - Lens
  - Public datapoint
  - Why it matters
  - What it does not prove
  - Use in diligence
  rows:
  - - India credit-card base
    - ~10.8 crore cards by Dec 2024
    - Best official-style category anchor for card penetration
    - Does not show how many users want a specialist app
    - Use as outer card TAM context
  - - India digital payments throughput
    - 20,787 crore transactions; Rs 2,758 lakh crore in 2024
    - Shows how digital consumer behaviour is now mainstream
    - Does not mean OneCard can monetise most flows
    - Use as broad behaviour context only
  - - Payment-system maturity
    - RBI DPI 445.5 as of Mar 2024
    - Signals strong payment-system enablement
    - Does not isolate cards from UPI or wallets
    - Use as adoption-support context
  - - OneCard wedge
    - App-led, lifetime-free, partner-issued, rewards-led card
    - Defines the narrower app-managed card SAM
    - No current official active-card or active-user total in source pack
    - Use as qualitative SAM definition
  - - Realistic public SOM
    - Evidence-constrained
    - Protects against overprecision in market share claims
    - Cannot estimate share cleanly without active-card data
    - Carry uncertainty into valuation confidence
  notes: This chapter uses sizing lenses rather than a single false-precision TAM
    number because public sources mix cards, transactions, apps, and total fintech
    activity.
