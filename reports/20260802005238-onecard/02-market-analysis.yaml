- id: sizing-and-growth-context
  title: Sizing and growth context
  body: |-
    The category backdrop is attractive. India’s credit-card base reached about 10.8 crore by December 2024, while digital transactions hit 20,787 crore in 2024 and retail digital payments crossed 16,416 crore transactions in FY2023-24. The RBI Digital Payments Index reaching 445.5 by March 2024 and Grant Thornton’s QR and PoS growth series both point to a payment system that is structurally more digital, more instrumented, and more habit-forming than it was five years earlier. OneCard benefits from that change because consumers are increasingly comfortable managing financial products through apps and using cards within a broader digital-payments routine.

    The capital backdrop is less euphoric than the usage backdrop. Tracxn’s 2024 fintech report shows total Indian fintech funding down sharply from prior years, even as digital lending remained the dominant funded category. That combination is important: demand context is getting better, but capital is more selective. OneCard therefore operates in a market with clear long-term adoption drivers but lower tolerance for unproven economics or loosely governed partner models.
