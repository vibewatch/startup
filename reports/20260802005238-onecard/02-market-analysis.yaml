- id: drivers-constraints-and-sizing-gaps
  title: Drivers, constraints, and sizing gaps
  body: |-
    The clearest market drivers are straightforward: rising credit-card penetration, dense digital-payment habits, and the consumer appeal of app-managed visibility over card usage. UPI support inside the OneCard app can deepen engagement by making the app relevant outside monthly billing moments. However, the same UPI-driven convenience also weakens differentiation for any card app that cannot offer enough rewards, trust, or cross-product value to escape commoditisation.

    The biggest constraints are equally clear. RBI’s co-branding rules and later scrutiny around data-sharing make partner-bank governance central. Issuer apps, premium bank cards, and adjacent fintech cards all compete for the same consumer attention. And the current public record still does not provide a clean official number for active OneCard cards or transacting users, which means public SOM calculations remain a bounded lens rather than a precise underwriteable denominator. That is acceptable for a market chapter, but it should carry into later chapters as a valuation-confidence discount.
