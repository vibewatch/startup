- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Evidence basis
  - Why it matters for OneCard
  - Residual risk
  rows:
  - - Credit-card penetration growth
    - Driver
    - RBI-linked 2019-2024 card growth
    - Expands the addressable category for app-managed card products
    - Growth can still accrue to issuer-owned cards
  - - UPI and app-payment familiarity
    - Driver
    - Grant Thornton and app-store evidence
    - Makes app-led card management easier to adopt
    - Also strengthens bigger super-app substitutes
  - - Digital lending and embedded-credit momentum
    - Driver
    - Nexdigm and Tracxn
    - Keeps investors and users open to app-native credit experiences
    - Can shift competition toward broader lending products
  - - RBI co-branding and data rules
    - Constraint
    - RBI master directions and 2025 scrutiny stories
    - Directly govern whether the OneCard model can scale cleanly
    - Rule interpretation can abruptly pause issuance
  - - Issuer dependence
    - Constraint
    - Partner-bank structure in current public record
    - Programme economics and growth depend on bank partners
    - Concentration or re-papering risk is material
  - - Competitive crowding
    - Constraint
    - CRED, bank premium cards, slice, Uni, fintech-card lists
    - Many substitutes can own the same customer attention
    - Differentiation can erode if features converge
  notes: The driver/constraint lens is intentionally balanced; high market digitisation
    does not remove regulatory or substitute pressure.
