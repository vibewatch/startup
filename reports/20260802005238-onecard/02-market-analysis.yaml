tables:
- id: TM001
  title: Market definition table
  columns:
  - Layer
  - Included in OneCard market lens?
  - Why
  - Excluded or adjacent examples
  - Implication
  rows:
  - - India digital payments system
    - Context only
    - Shows consumer digital-payment comfort and rail maturity
    - All UPI, AEPS, IMPS, wallets, and merchant QR payments
    - Useful outer TAM but too broad for underwriting OneCard
  - - India credit-card installed base
    - Yes, as starting category
    - Cards are the regulated instrument OneCard manages
    - Debit cards and non-credit prepaid instruments
    - Best available category-level denominator
  - - Co-branded credit-card programmes
    - Core market
    - OneCard operates through this structure with partner issuers
    - Standalone issuer-bank cards with no co-brand layer
    - RBI co-branding rules directly shape the model
  - - App-led card management and rewards
    - Core market
    - User adoption depends on specialist app utility and rewards
    - Pure statement-only or branch-centric card servicing
    - Engagement layer is where OneCard tries to differentiate
  - - All digital lending and BNPL
    - Adjacent, not core
    - Helpful for understanding investor appetite and substitute journeys
    - Short-tenure personal loans and merchant BNPL products
    - Too broad to use as OneCard’s direct TAM
  notes: The market definition intentionally narrows from all payments to co-branded
    app-led card programmes so later sizing is not inflated by irrelevant rails.
