company:
  name: FPL Technologies (OneCard)
chapter:
  number: 2
  title: Market Analysis
  summary: 'OneCard sits in a structurally attractive Indian market defined by rapid
    digital-payment adoption, a credit-card base that has more than doubled since
    2019, and continued consumer comfort with app-led financial workflows. But its
    realistic market is far narrower than those headline numbers suggest: it is a
    regulated co-branded credit-card programme market constrained by issuer-bank control,
    RBI data-sharing rules, and intense substitute pressure from premium issuer cards,
    CRED, and newer fintech card products.'
sections:
- id: market-boundary-and-regulatory-frame
  title: Market boundary and regulatory frame
  body: |-
    OneCard does not sit in the whole Indian digital-payments market, nor even in the whole credit market. The most accurate boundary is the regulated co-branded credit-card layer inside India’s much larger digital-payments system. RBI’s card master directions matter because they define what co-branding is, require issuer control and disclosure, and explicitly restrict partner access to transaction data. That is not a technical detail; it shapes OneCard’s available business model and explains why partner-bank relationships and data-sharing rules can directly affect issuance.

    This boundary also clarifies what should be excluded from headline TAM claims. UPI volume, QR-code deployment, and all retail digital transactions matter as context because they show how comfortable Indian consumers are with digital money movement. But they are not equivalent to OneCard’s realistic opportunity. OneCard still requires a regulated issuer, partner approval, app adoption, and a user who wants more than a generic payment app. In diligence terms, this is a card-programme and customer-control market nested inside a much broader payments system.
