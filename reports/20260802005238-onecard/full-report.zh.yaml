  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与当前信号
        blocks:
          - type: paragraph
            body: >-
              当前公开记录显示，OneCard 已不再是一个很小的实验性信用卡 app。基于文件的 Inc42 FY24 报道显示，收入升至 INR 1,425.58 crore，但亏损仍约 INR 401
              crore，总费用接近 INR 1,866
              crore。这个组合比绝对收入数字更重要，因为它说明业务先找到了真实收入规模，之后才找到干净的经营杠杆。同一报道还指向一个成本基础：促销和杂项费用仍很大，这意味着收入模型在需求端已经得到验证，但效率端还没有完全跑通。


              公司面向用户的定价界面也有助于解释模型。OneCard 推广的是无入会费或年费、app 驱动服务、EMI
              管理和支付效用，而不是明显的会员费模型。这意味着核心变现栈很可能落在合作伙伴经济性、交易和服务流，以及相邻产品交叉销售上，而不是高端年费收入流。
