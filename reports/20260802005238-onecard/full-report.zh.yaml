      - number: '1.3'
        title: 融资历史、规模与独角兽状态
        blocks:
          - type: paragraph
            body: >-
              OneCard 2024 年末融资和当前估值证据充分，尽管部分细节相互冲突。Entrackr、Inc42、Infomance 和 Tracxn 都支持 2024 年末约 INR 239.4 crore、或
              $28.5 million 的 D 轮融资，Better Tomorrow Ventures、Peak XV、QED 和 Z47 都在交易周边活跃。ET 报道的实际关闭金额更接近 $25.5
              million，说明可能存在分批到账或部分关闭，而不是一张整齐的单笔支票。估值方面，当前外部最有支撑的区间约为 $1.3 billion 至 $1.4 billion，其中 Tracxn 约 $1.37
              billion，Infomance 接近 $1.4 billion。


              更强的长期结论不是 2024 年支票的精确金额，而是公司在 2022 年独角兽轮之后的状态。Venture Intelligence 和 Inc42 都把 OneCard 进入独角兽的时间放在 2022 年 7
              月，融资背后有 Temasek 支持。随后 Hurun 2025 年全球独角兽指数提供了 2024 年后的有价值确认：业务仍筛在 $1 billion 以上，同时也标出相对私募市场峰值下跌 $2.8
              billion。由此，第一章判断比简单的成长故事更微妙：公司仍有重要投资人和真实收入规模，但嵌在当前估值里的公开市场信号，远没有 2022 年叙事那样亢奋。
