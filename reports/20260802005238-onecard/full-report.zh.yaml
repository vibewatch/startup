  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录支持关注 OneCard，但前提是价格有纪律，且保持不完全置信的姿态。最强的正面事实是真实收入规模、明显消费者采用、持续机构背书，以及 2024
              年后证据中仍有效的独角兽状态。最强的负面事实同样清楚：监管中断不是假设，公司仍有大额亏损，当前公开记录也没有解决亏损率、合作伙伴经济性或整改完成度等承销问题。这个组合使“因为品牌强就买入”过于简单，也使“因为存在监管就放弃”过于粗暴。正确起点是观察
              / 继续研究姿态，并明确只有当价格显著改善或证据改善时才愿意推进。换句话说，OneCard 可能仍有吸引力，但现在举证责任落在承销纪律上，而不是品类兴奋感上。强品牌和显而易见的 app
              采用是价值的必要条件，在这个案例里不是充分条件。
