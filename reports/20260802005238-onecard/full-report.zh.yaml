      - number: '3.2'
        title: 功能与定价比较
        blocks:
          - type: paragraph
            body: >-
              其他卡显得繁琐或费用重时，OneCard 的公开主张最强：无入会费或年费、低外汇费、app 控制、EMI 工具和优惠层。这有意义，但并非无法击败。银行高端卡在贵宾厅和保险覆盖上仍占主导，Scapia、Axis
              Atlas 等旅行优先卡则把权益更积极地集中在旅行场景。另一端，SBI SimplyCLICK 表明，低费用、容易解释的购物返利也能从下方挤压 OneCard，而不必假装自己是高端卡。


              关键竞争结论是，OneCard 的公开边缘通常来自一组打包，而不是某个一击制胜的单点功能。很少有竞争对手以完全相同的方式组合金属卡品牌、低显性费用、app
              驱动控制和多银行发行。这个组合在用户选择中仍可能重要，因为它降低了认知摩擦，适合那些想要一张有高端感、又不想承受高端卡复杂度的用户。但每个单项都有替代方案，所以功能文案被复制的风险仍然真实。
