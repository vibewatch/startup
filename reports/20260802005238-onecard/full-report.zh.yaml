chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、运营栈和合作伙伴模式
        blocks:
          - type: paragraph
            body: >-
              分析 OneCard 时，应把它看作 FPL Technologies 的消费者品牌，而不是独立持牌发卡方。当前官方关于页面把 FPL 描述为一家重新想象信用和支付的金融科技公司；app
              商店和申请入口则显示，消费者体验是一款移动优先 app，用户可以在其中申请部分合作银行的卡，管理消费、转换 EMI、支付账单，并开始使用 UPI
              支付。这个架构很关键，因为它解释了为什么公开发卡银行页面如此重要：OneCard 并不把自己呈现为独立银行，而是叠在受监管银行合作伙伴之上的软件驱动型卡项目管理方。


              公司也已经不只是单一卡片。FPL 官方关于页面称，集团运营用于信用评分监测的 OneScore 和面向储蓄产品的 Wizely，说明核心 OneCard 切口之外还有更宽的消费金融栈。Federal
              Bank、South Indian Bank、app 商店页面和 Paisabazaar 反复强调的产品承诺是一致的：一张金属、app 控制、终身免年费的信用卡，外汇费率低，EMI
              处理灵活，积分界面有差异化。概览层面的结论是，OneCard 不是套在银行之上的卡面皮肤；它是软件和分发层，试图掌握客户关系，而银行保留受监管的发卡角色。
