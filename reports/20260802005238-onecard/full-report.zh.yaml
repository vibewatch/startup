      - number: '8.4'
        title: 最终尽调要求与置信度
        blocks:
          - type: paragraph
            body: >-
              置信度应保持中等，而不是高，因为太多核心输入仍是私有或未解决。若审计结果积极、发卡方关系稳定，且内部风险指标好于怀疑者担心，公司最终可能配得上高于当前估值区间的价格。但公开市场投资人不能负责任地直接假设这一点。下一步不可谈判的要求是当前发卡状态、整改证据、队列亏损与留存数据，以及合作银行经济性，然后才能做任何承诺。没有这些，即便看似合理的私募标记也可能成为急躁投资人的陷阱。有了这些，OneCard
              最终仍可能成为印度更有吸引力的有规模消费金融科技故事之一。在此之前，估值置信度应保持中等，情景区间应保持宽，任何拟议入场价都应把当前悬置明确纳入谈判。
