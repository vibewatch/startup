      - number: '4.4'
        title: 财务结论与监管暴露
        blocks:
          - type: paragraph
            body: >-
              从财务上看，OneCard 是一家已经有规模、但仍部分不透明的收入型公司。收入线真实到足以重要，但公开证据仍没有解决利润率质量、资产负债表暴露和合作伙伴经济性。这种不确定性在稳定监管环境下也重要；在 RBI
              审查联名安排期间，新发卡据报道曾暂停，因此更重要。对于仍靠合作银行分发增长的业务，漏斗顶部的任何中断都是财务事件，不只是合规脚注。


              最终财务解读因此是平衡但谨慎的。OneCard 已远远越过创意阶段金融科技公司的经济性，其 2024 年末融资也说明可信投资人支持仍在。不过，公开
              CAC、抽佣率、准备金和发卡方经济性披露缺失，让财务章节停留在“方向上有希望，但尚不足以完全承销”的区域。这足以维持兴趣，但若没有私有数据，还不足以通过完整投资委员会标准。
