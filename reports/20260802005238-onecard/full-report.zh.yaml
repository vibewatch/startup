      - number: '7.3'
        title: 合作伙伴、财务与执行风险
        blocks:
          - type: paragraph
            body: >-
              合作伙伴模式会放大执行风险，因为 OneCard 需要多家机构在发卡、服务、合规边界和整改节奏上保持一致。因此，一次暂停可以比在单线银行发卡方那里更快传导全公司。财务上，业务 FY24
              仍背负较大亏损，时间并不中性。如果合规工作让获客放慢几个季度，公司就面临同时防守增长和现金效率的风险。公开记录也让关键信用模型变量保持不透明——核销、欺诈损失、准备金机制和分层风险——所以投资人不能假设，一旦恢复发卡，收入规模就会自动转化为耐久经济性。这一点尤其重要，因为整改繁重的阶段会占用管理层时间、拖慢产品迭代，并把公司重心从纯客户增长转向控制落地，进而改变利润率和动能。
