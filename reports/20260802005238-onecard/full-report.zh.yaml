      - number: '8.2'
        title: 估值背景与可比集合
        blocks:
          - type: paragraph
            body: >-
              估值背景异常分叉。一边，Hurun 仍确认 OneCard 在 2024 年 8 月后保持独角兽；ET 和 GetLatka 则把当前价值聚在约 $1.3 billion 至 $1.4
              billion。另一边，Hurun 报道的相对峰值 $2.8 billion 下调告诉投资人，市场已经大幅重估公司。最佳可比集合因此是混合的：CRED 是更大的私有消费信用卡生态；PB Fintech
              是披露强的印度上市金融科技基准；slice 是监管风险可比；Scapia 是更新的联名卡增长可比。没有一个可比对象完美，正因为如此，价格纪律在这里比叙事精确更重要。可比集合的任务不是制造一个假的精确倍数；它是说明
              OneCard 介于披露更好的上市金融科技公司和透明度较低的私有消费信用品牌之间，同时应获得规模溢价和不透明折扣。
