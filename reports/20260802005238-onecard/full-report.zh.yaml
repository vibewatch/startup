        - 用来锚定信用卡渗透率，最接近官方口径
        - 不能说明有多少用户想要专业 app
        - 作为外层信用卡 TAM 背景
      - - 印度数字支付吞吐量
        - 2024 年 20,787 crore 笔交易；Rs 2,758 lakh crore
        - 显示数字消费行为已成主流
        - 不代表 OneCard 能从多数流水中变现
        - 仅作宽口径行为背景
      - - 支付系统成熟度
        - 截至 Mar 2024，RBI DPI 445.5
        - 显示支付系统赋能强
        - 不能把信用卡从 UPI 或钱包中拆出来
        - 作为采用支撑背景
      - - OneCard 切入口
        - App 主导、终身免费、合作方发卡、奖励驱动的信用卡
        - 定义更窄的 app 管理型信用卡 SAM
        - 来源包中没有当前官方活跃卡或活跃用户总数
        - 作为定性 SAM 定义
      - - 现实公开 SOM
        - 受证据约束
        - 避免市场份额说法过度精确
        - 没有活跃卡数据，无法干净估算份额
        - 把不确定性带入估值信心
    notes: 本章使用多个规模测算视角，而不是一个带虚假精度的 TAM 数字，因为公开来源混合了卡、交易、app 和整体金融科技活动。
