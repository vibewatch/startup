      - number: '2.4'
        title: 驱动因素、约束与规模缺口
        blocks:
          - type: paragraph
            body: >-
              最清晰的市场驱动因素很直接：信用卡渗透率上升、数字支付习惯密集，以及消费者喜欢用 app 管理并看清用卡情况。OneCard app 内的 UPI 支持可以让 app
              在每月账单时点之外也有用，从而加深互动。不过，同样由 UPI 驱动的便利性，也会削弱任何卡类 app 的差异化，除非它能提供足够的积分、信任或跨产品价值，摆脱商品化。


              最大约束同样清楚。RBI 的联名规则以及随后围绕数据共享的审查，让合作银行治理成为核心。发卡方 app、高端银行卡和相邻金融科技卡，都在争夺同一份消费者注意力。当前公开记录仍没有给出活跃 OneCard
              卡或交易用户的干净官方数字，因此公开 SOM 测算只能作为有边界的视角，而不是可精准承销的分母。放在市场章节里可以接受，但后续章节应把它转化为估值置信度折扣。
