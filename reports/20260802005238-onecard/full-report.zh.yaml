      - number: '2.2'
        title: 规模测算与增长背景
        blocks:
          - type: paragraph
            body: >-
              品类背景有吸引力。截至 2024 年 12 月，印度信用卡基数达到约 10.8 crore；2024 年数字交易达到 20,787 crore；FY2023-24 零售数字支付超过 16,416 crore
              笔。RBI Digital Payments Index 到 2024 年 3 月达到 445.5，Grant Thornton 的 QR 和 PoS
              增长序列也都指向一个比五年前更数字化、更可计量、更能养成习惯的支付系统。OneCard 从这种变化中受益，因为消费者越来越习惯通过 app 管理金融产品，并把卡纳入更广的数字支付日常。


              资本背景没有使用背景那么亢奋。Tracxn 2024
              年金融科技报告显示，印度金融科技总融资较此前年份大幅下降，尽管数字借贷仍是获得融资最多的类别。这个组合很重要：需求环境在变好，但资本更挑剔。因此，OneCard
              所处市场有清晰的长期采用驱动因素，却对未经证明的经济性或治理松散的合作伙伴模式容忍度更低。
