      - number: '3.3'
        title: 结构、锁定与替代
        blocks:
          - type: paragraph
            body: >-
              结构和积分一样重要。Regalia、Atlas、SimplyCLICK 等卡由发卡方自有，因此银行对经济性、服务和品牌一致性的控制更干净。OneCard
              则处在多银行联名结构中。它可以扩大分发，但也意味着公司在合作伙伴协同和监管清晰度上有依赖，而发卡方自有卡没有这种依赖。这也是仅凭营销界面很难评估竞争耐久性的原因之一。


              替代也发生在传统银行卡之外。CRED 竞争的是优质用户身份和社区，Scapia 竞争的是零外汇费旅行效用，slice 或 Uni 竞争的是更打包的 app 原生资金体验。因此，OneCard
              要防守的不只是积分表，还包括一个让用户打开并保留专门卡 app 的理由。这个留存测试大概率由习惯性互动和合作伙伴可靠性决定，而不是只靠营销文案。定价清晰有帮助，但单靠它不够。
