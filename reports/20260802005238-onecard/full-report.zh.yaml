      - number: '4.3'
        title: 单位经济代理指标与盲点
        blocks:
          - type: paragraph
            body: >-
              公开来源包足以显示方向，但还不足以承销教科书式金融科技单位经济。最强的负面代理指标很简单：收入大幅增长，但亏损几乎没有改善，营销仍重。最强的正面代理指标是，公司似乎围绕基础卡搭出更宽的产品栈，OneScore 和
              Wizely 把关系延伸到相邻的信用评分和储蓄场景。这可能提升 LTV 或降低再获客成本，但公开来源没有量化这些效果。


              因此，投资人应把公开单位经济视为一幅不完整拼图。我们能看到规模、交叉销售野心和 app 驱动服务引擎的证据，但看不到
              CAC、回本周期、逾期曲线、核销，或与发卡银行之间的收入分成经济性。正是这些缺失的分母，决定了当前收入质量究竟耐久，还是只是生产成本很高。
