      - number: '2.3'
        title: 买方、用户、付款方和替代品
        blocks:
          - type: paragraph
            body: >-
              在 OneCard 的核心流程中，用户是消费者，受监管的付款方和债权方是发卡银行，app 公司则是获客和互动层。这种分离让市场与纯贷款方或纯银行发行的高端卡很不一样。OneCard 必须说服用户相信一个专门
              app 值得打开，说服银行接受项目经济性和合规性，也说服监管者相信联名结构不会制造后门控制问题。


              因此，替代品来自多个方向。CRED 用按评分准入的会员模式争夺相似的高端或优质用户。Regalia 和 Atlas 是发卡方自有高端卡，在贵宾厅和旅行定位上更强。SBI SimplyCLICK
              是更简单、低费用的购物卡，而 slice 和 Uni 把信用包装进更广的 app 驱动资金体验。OneCard 的定位不是“所有卡”；它处在 app
              原生控制、足够宽松以突破精英旅行卡用户的准入，以及足以让消费者不退回发卡方 app 或更大超级 app 的积分或费用优势之间。
