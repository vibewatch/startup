  - id: TM001
    title: 市场定义表
    columns:
      - 层级
      - 是否纳入 OneCard 市场视角？
      - 原因
      - 排除或相邻案例
      - 含义
    rows:
      - - 印度数字支付系统
        - 仅作背景
        - 显示消费者已熟悉数字支付，支付轨道也更成熟
        - 全部 UPI、AEPS、IMPS、钱包和商户 QR 支付
        - 适合作为外层 TAM，但用于判断 OneCard 过宽
      - - 印度信用卡存量
        - 是，作为起点品类
        - 信用卡是 OneCard 管理的受监管工具
        - 借记卡和非信用预付工具
        - 最可用的品类级分母
      - - 联名信用卡项目
        - 核心市场
        - OneCard 借这套结构与合作发卡行运营
        - 没有联名层的独立发卡行信用卡
        - RBI 联名规则直接塑造该模式
      - - App 主导的卡管理与奖励
        - 核心市场
        - 用户采用取决于专业 app 的实用性和奖励
        - 纯账单型或网点中心型卡服务
        - 互动层是 OneCard 试图差异化的地方
      - - 全部数字借贷和 BNPL
        - 相邻，不是核心
        - 有助于理解投资人兴趣和替代旅程
        - 短期限个人贷款和商户 BNPL 产品
        - 用作 OneCard 直接 TAM 过宽
    notes: 市场定义有意从全部支付收窄到联名、app 主导的卡项目，避免后续规模测算被无关支付轨道虚高。
