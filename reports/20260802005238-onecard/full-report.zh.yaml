            body: >-
              最强的公开客户证明是聚合信号，而不是客户 logo。OneCard 的 app 商店页面和 AppBrain
              跟踪提供了大众市场触达、高评论量和持续更新的证据；对消费金融科技来说，这比几条经过策划的用户证言更有说服力。Android 证据尤其深：AppBrain 在自家跟踪界面显示 Play 下载超过 10
              million，累计下载约 32 million，并伴随数十万评分。Apple App Store 又提供了另一个庞大评分基础。合在一起，这些信号强力支持 OneCard
              不是小众或休眠产品。不过，它们仍无法回答投资人最关心的问题：活跃且已放款的卡有多少，获批客户交易频率如何，首次激活期之后还有多少人保持互动。结果是，本章有令人信服的广度证明，但变现证明不完整。这已经足以证明真实市场存在，却还不足以做精确
              LTV 承销或干净的留存预测。
