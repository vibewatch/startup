        title: 资本历史与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最有支撑的 2024 年末资本事件，是 Entrackr 和 Inc42 报道的约 INR 239.4 crore、或 $28.5 million 融资；ET 随后把实际关闭额描述为更接近 $25.5
              million。这个差距足够小，不改变总体结论：公司在 2024 年末仍需要外部增长资本，且相对独角兽时期的标示估值，募资金额不大。资本历史的一致性较弱。ET 引用累计股权融资 $262
              million，Inc42 曾引用超过 $111 million，其他数据库又给出不同总额。这个冲突降低了对稀释和历史现金效率的判断精度。


              实务含义是，财务承销应更多锚定最新经营轨迹和当前估值，而不是任何单一累计融资数字。公开证据仍支持持续机构背书，但还不能证明公司已经摆脱融资依赖，或能靠内部产生的利润自我资助增长。
