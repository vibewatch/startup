      - number: '3.4'
        title: 耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              公开证据支持差异化位置，但不支持硬护城河。OneCard 最强的属性——费用简单、app 控制、金属卡品牌和相对较宽的发卡方集合——都有用，但大多比社区锁定、深度发卡方所有权或自有交易生态更容易复制。随着 UPI
              关联的 app 体验变成常态，公司尤其容易遭遇功能趋同。


              因此，市场在 OneCard 最想打的地方显得拥挤：关心积分、旅行经济性和干净 app 体验的数字化印度消费者。纪律严格的投资人应少看静态功能胜利，多看 OneCard
              能否反复证明自己既能保持高用户互动，又能防守发卡方关系和商户相关性。最终竞争判断是，OneCard 位置不错，但它的耐久性更多取决于执行、合作伙伴连续性和品牌相关性，而不是任何公开证据显示的不可攻破结构性护城河。
