            body: >-
              公开证据支持一种谨慎的架构解读。合作银行似乎拥有受监管发卡边界、正式卡文件，以及至少部分催收或服务；FPL 则控制面向用户的软件、优惠发现、卡控制和很多服务交互设计。Federal Bank
              页面尤其有用，因为它记录了 app 内对账单、通过多条还款通道在 app 内还款，以及作为认证流程的 swipe2Pay。这些细节说明，OneCard
              的护城河不太在于发明一条新的卡支付轨道，而在于把发卡方、网络、还款和用户界面层编排成单一消费者体验。权衡也同样可见：公开栈在运营上依赖对手方，也没有暴露外部 API
              或工程文档，让外部人士验证更深层内部。因此，产品优雅比基础设施深度、韧性实践或集成复杂度更容易验证。这个不对称应从第一天起塑造尽调重点。
