    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: 公开来源可见的相对成熟度。
    data:
      columns:
        - 公开成熟度
        - 原因
        - 关键不确定性
        - 近期尽调优先事项
      rows:
        - label: 开卡 + 控制
          values:
            - 高
            - 核心产品在官方和合作伙伴页面反复出现
            - 确切开卡审批通过率
            - 要求按发卡行提供审批和激活漏斗
        - label: 信用卡上的 UPI
          values:
            - 中
            - 最近在应用商店中更突出，可能仍在放量
            - 使用该功能的活跃用户占比
            - 要求提供 UPI 绑定信用卡月活用户数
        - label: 商户优惠
          values:
            - 中
            - 有专门入口，合作伙伴页面也提到优惠
            - 商户数和转化
            - 要求提供商户数、核销和重复使用数据
        - label: 交叉销售生态
          values:
            - 中
            - OneScore 和 Wizely 已上线，但联动深度不清楚
            - 跨产品经济性
            - 要求提供交叉销售转化和留存影响
        - label: 对外技术透明度
          values:
            - 低
            - 没有公开 API、状态页、变更日志或安全文档
            - 运营韧性证据
            - 要求提供架构、可用性和安全资料包
    claimRefs:
      - CE010
      - CE019
      - CE021
      - CE024
      - CE027
      - CE031
      - CE035
      - CE036
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: OneCard 可见客户旅程从 App 发现开始，可延伸到日常支付和相邻信用工具。
    data:
      items:
        - label: 发现并评估
          detail: 消费者通过应用商店、合作银行触点以及奖励 / 价值信息接触 OneCard。
          touchpoints:
            - 应用商店
            - 合作银行
            - 金属卡卖点
        - label: 数字申请
          detail: 用户在 App 内申请，并进入各发卡行自己的审批逻辑。
          touchpoints:
            - OneCard App
            - 发卡行标准
            - 虚拟卡准备就绪
        - label: 激活并交易
          detail: 获批用户可通过卡组织轨道消费，并用 App 管理控制项。
          touchpoints:
            - 金属卡 / 虚拟卡
            - 用卡控制
            - 账单
        - label: 提高使用频次
          detail: App 引导用户使用 UPI、账单、EMI、租金、优惠和充值流程。
          touchpoints:
            - UPI
            - 账单
            - 优惠
        - label: 扩展关系
          detail: FPL 可通过相邻 App 交叉销售征信监测或储蓄产品。
          touchpoints:
            - OneScore
            - Wizely / FDs
            - 信用积累
    claimRefs:
      - CU006
      - CU015
      - CU018
      - CU024
      - CU025
      - CU032
