    summary: 创立、跻身独角兽、2024 年资本刷新、Hurun 下调信号，以及随后与 RBI 相关的发卡暂停。
    data:
      items:
        - date: 2019-07
          label: FPL / OneCard 成立
          detail: 当前公开数据库与后续媒体报道都指向 2019 年，创始地点在 Pune。
          tone: positive
        - date: 2022-07
          label: 独角兽里程碑
          detail: Temasek 支持的融资让 OneCard 成为估值十亿美元级的印度金融科技公司。
          tone: positive
        - date: 2023-09
          label: Indian Bank 合作被提及
          detail: 报道强调伙伴银行扩张，以及数字化卡管理的卖点。
          tone: positive
        - date: 2024-11
          label: Series D 轮刷新
          detail: 公司宣布约 INR 239.4 crore / $28.5M 融资，Peak XV、QED、Z47 和 BTV 参与。
          tone: neutral
        - date: 2025-06
          label: Hurun 保留独角兽状态
          detail: OneCard 仍高于 $1B，但报道称其较峰值估值下降 $2.8B。
          tone: warning
        - date: 2025-12
          label: 发卡暂停击中核心闭环
          detail: ET 和 Inc42 报道称，在 RBI 审查数据共享期间，伙伴银行暂停新增发卡。
          tone: negative
    approximationNotes: 融资交割金额取自公开报道，应视为最新外部标记，而不是已签署的条款清单档案。
