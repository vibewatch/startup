      - number: '7.2'
        title: 运营与客户信任风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，OneCard 像一台共享机器：按发卡方区分的支持通道、app 控制、还款流、对账单，以及催收或 KFS 参考，都横跨 FPL
              和银行界面。正常时期这可以运转良好，但一旦问题跨组织边界，就会制造交接风险、责任模糊和更慢的问题解决。本轮最清晰的公开反向例子是 FD
              退款投诉，其中一名担保卡客户据称在销户和退款处理上遭遇断裂。单一投诉不能证明系统性失败，但它说明移动优先金融产品中，资金流动或支持响应一旦出错，信任会多快被侵蚀。官方落地页失效又增加了二阶运营担忧：不一定是产品失败，但说明公开控制和文档卫生不完整。对消费信用产品来说，这些较软弱点仍可能重要，因为披露可靠性、支持可发现性和可预测的销户流程都是信任产品的一部分，不只是营销点缀。因此，投资人应把网页界面不稳定视为弱信号，而不是单独打破投资逻辑的因素；但当它与监管审查和投诉证据放在一起时，方向上仍是负面。
            claimRefs:
              - CR008
