  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险栈
        blocks:
          - type: paragraph
            body: >-
              当前公开记录中的定义性风险，不是需求、竞争，甚至也不是表面烧钱，而是监管设计。多份独立报道称，RBI 相关审查中断了新发卡，并聚焦客户数据、同意和责任在联名结构内如何处理。这很重要，因为 OneCard
              的模式本来就刻意位于银行控制和金融科技用户体验之间。如果这条边界被判断为过于多孔，整改就可能同时影响入门、分析、服务和增长。法律界面也比外部尽调理想状态更薄：发卡银行条款和关键事实声明可见，但本轮多个核心
              OneCard 信任页面无法访问，削弱了外部对当前面向消费者法律透明度的安心程度。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
