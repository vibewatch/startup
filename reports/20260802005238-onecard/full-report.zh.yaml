            body: >-
              公开证据指向的客户基础，比“高端金属卡”这个标签暗示的更宽。Paisabazaar 把 OneCard 描述为适合新手、准入相对宽松；Economic Times
              和公司自身产品语言又通过金属卡定位保留了向往高端的角度。结果是一个混合分层：首次使用信用的消费者、寻找更 app
              原生用卡体验的客户，以及被积分和低外汇定位吸引的消费人群。这种混合很重要，因为它可以拓宽漏斗顶部；但当公开记录不按收入带、征信深度或担保 /
              无担保组合拆分队列时，它也会让留存分析更复杂。数字化入门故事清晰得多：公开页面持续强调 app
              驱动申请、即时虚拟卡可用，以及入口处有发卡银行可选。这让漏斗顶部看起来真正现代，哪怕公开记录今天还无法按分层量化审批转化。
