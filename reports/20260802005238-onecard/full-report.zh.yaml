      - number: '1.2'
        title: 创始人、总部与治理可见度
        blocks:
          - type: paragraph
            body: >-
              当前公开记录在身份上方向清楚，但创始人人数并不完全干净。ET、Inc42 和基于文件的报道反复把 Anurag Sinha、Rupesh Kumar、Vibhav Hathi 称为创始三人组，Tracxn
              的创始人档案也强化了他们对品牌的核心地位。与此同时，Tracxn 还在高级创始和风险岗位中列出 Hari Velayudan 与 Devang
              Shah。这意味着，简化的三人叙事最好被视为公开面对市场的核心，而不是完整运营班底。这个细微差别对治理很重要：公司规模和监管暴露都已经足够大，投资人应关心在可见创始人之外，谁真正负责产品、风险、合规和董事会监督。


              总部证据比创始班底深度更扎实。Tracxn、YNOS 和 Apple App Store 页面都把公司锚定在 Pune，Tracxn 还给出 Baner
              的具体注册地址。更大的尽调结论是，达到独角兽状态、经历多轮融资后，公开领导层可见度仍然偏创始人。投资人可以很快核实公司的城市、历史和赛道，但仅凭这组来源，仍无法建立关于董事会独立性、接班准备或制度化治理深度的稳健公开视图。
