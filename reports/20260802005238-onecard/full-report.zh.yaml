  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与监管框架
        blocks:
          - type: paragraph
            body: >-
              OneCard 不处在整个印度数字支付市场里，甚至也不处在整个信贷市场里。最准确的边界，是印度更大数字支付系统中的受监管联名信用卡层。RBI
              的卡业务主指引很重要，因为它们定义了什么是联名，要求发卡方控制和披露，并明确限制合作伙伴访问交易数据。这不是技术细节；它塑造了 OneCard
              可用的商业模式，也解释了为什么合作银行关系和数据共享规则会直接影响发卡。


              这个边界也厘清了哪些东西应从标题式 TAM 主张中排除。UPI 交易量、QR 码部署，以及所有零售数字交易，都有上下文意义，因为它们显示印度消费者已经多么习惯数字资金流动。但它们并不等同于 OneCard
              的现实机会。OneCard 仍需要受监管发卡方、合作伙伴批准、app 采用，以及一个想要的不只是通用支付 app 的用户。从尽调角度看，这是一个嵌在更广支付系统中的卡项目和客户控制市场。
