companyProfile:
  summary: >-
    OneCard 是 FPL Technologies 运营的消费信用卡品牌；FPL Technologies 是一家总部位于 Pune、成立于 2019
    年的印度金融科技公司。公司围绕高端金属卡、虚拟卡发行、积分、UPI、账单支付和按发卡方区分的服务，搭出移动优先的联名卡栈，之后又扩展到 OneScore、Wizely 等相邻产品。公开证据支持真实收入规模、较强的 app
    采用代理指标和持续投资人支持，但私募市场承销最核心的输入项仍未解决。
