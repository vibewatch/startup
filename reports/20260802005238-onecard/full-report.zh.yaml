      - number: '6.4'
        title: 扩张循环与集中风险
        blocks:
          - type: paragraph
            body: >-
              OneCard 的扩张逻辑似乎通过两条循环运作。第一条是行为循环：一旦获批，app 会把客户推向账单支付、EMI 管理、租金、UPI 和商户优惠等反复动作，从而提高互动频率。第二条基于组合：OneScore
              等相邻产品让 FPL 即便在旗舰卡不是唯一触点时，也能围绕征信监测和争议流程与用户保持关系。反面是集中。客户增长仍依赖合作银行发卡能力、支持质量和监管舒适度，RBI 相关发卡暂停已经说明这一点。这也意味着，顺滑的
              app 体验仍可能被外部服务或政策瓶颈削弱。因此，公开客户故事在获客广度和互动触达面上有吸引力，但在分母透明度、集中度和队列耐久性上仍不完整。这些指标正决定规模到底能高效复利，还是只是在 app 层面看起来漂亮。
            claimRefs:
              - CU022
