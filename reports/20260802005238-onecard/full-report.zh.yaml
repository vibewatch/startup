      - number: '6.3'
        title: 满意度、留存与摩擦
        blocks:
          - type: paragraph
            body: >-
              公开记录支持客户满意度，但只是间接支持。高 app
              评分和大量评论说明，足够多的用户认为体验可信，愿意给出正面评价。不过，公开投诉证据仍重要，因为移动优先的金融产品一旦资金流动或支持出问题，就会很快失去信任。本来源包中最清晰的反向例子是 FD
              退款投诉；它对担保卡客户尤其相关，因为他们的信用建设路径依赖可预测的销户和退款处理。同样重要的是，没有公开流失、留存或续约披露。尽调上，这意味着评分能证明存在感和广泛认可，但不能证明耐久的客户喜爱或长期卡经济性。这个区分是消费金融科技承销的核心，也应阻止投资人把
              app 商店热情过度解读为留存真相或忠诚度证明。
