  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品触点与用户任务
        blocks:
          - type: paragraph
            body: >-
              OneCard 的公开产品叙事在自家 FAQ、app 商店页面和合作银行页面之间异常一致。核心承诺不只是信用额度，而是移动端管理的用卡体验：申请、即时虚拟卡可用、控制、积分、还款、EMI
              转换、公共事业缴费和附近优惠发现，都放在同一个 app 外壳里。这很重要，因为产品销售的不是一张静态银行卡，而是一段由软件引导的支付关系；高端实体载体恰好是一张金属卡。相邻触点——用于征信洞察的
              OneScore，以及用于储蓄和 FD 的 Wizely——也显示，公司有更大野心，想掌握消费者更多信用和资金界面，即便这些产品还没有被深入记录为直接 app
              内模块。这个更大的钱包野心很重要，因为它可以在不必每推出一个新资金产品都重新获客的情况下加深互动；如果执行得好，也能改善留存经济性。
