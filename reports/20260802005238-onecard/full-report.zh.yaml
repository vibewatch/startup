      - number: '1.4'
        title: 财务信号与监管悬置
        blocks:
          - type: paragraph
            body: >-
              当前来源包中最好的基于文件的经营信号，是 Inc42 的 FY24 报告：收入增长 163% 至 INR 1,425.58 crore，但净亏损仍约 INR 401
              crore，促销和杂项成本线上的支出仍重。Inc42 的 2026 年数据库档案指向 FY25 收入超过 INR 1,908.5
              crore，但本次没有保留支持该数字的文件报道或管理层材料，因此它应被当作较软的当前指标，而不是估值工作的主要分母。与此同时，Peak XV、QED 等当前公开支持方仍把 OneCard
              列在其组合中，支撑了持续机构背书。


              最清晰的反向概览事实来自监管。ET 和 Inc42 都报道称，RBI 要求合作银行在澄清联名模式下的数据共享安排时暂停新发 OneCard。由于卡由合作银行发行、FPL
              管理获客和服务，这类干预并非外围问题；它击中核心运营循环。叠加 Hurun
              的估值下调信号和未解决的资本历史不一致，监管暂停降低了任何简单“高端金属卡独角兽”故事的可信度。公司显然仍有相关性和规模，但第一章应把它框定为一个强产品品牌，同时在有意义的监管和治理约束下运营。
