  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与对手集合
        blocks:
          - type: paragraph
            body: >-
              OneCard 面对的不是单一显眼对手；它至少跨三层竞争。第一层是 Regalia、Regalia Gold、Axis Atlas 等银行发行的高端卡，掌握以贵宾厅为重心的旅行和富裕客户定位。第二层是
              CRED、Scapia、slice、Uni 等金融科技驱动品牌，它们在 app 原生行为、费用叙事，或更打包的资金体验上竞争。第三层是 SBI SimplyCLICK
              这类更简单的购物或入门级卡，可以吸走不需要专门高端卡 app 的价格敏感或数字活跃用户。


              因此，尽调不应问 OneCard 是否“赢得卡市场”。它应问 OneCard 能否在其上方的高端银行卡、下方的简化购物卡，以及侧面的社区或 app 驱动金融科技替代品之间，守住差异化楔子。Tracxn
              跟踪的集合和 Card Insider 的金融科技卡名单都显示，这个品类已经明显拥挤。
