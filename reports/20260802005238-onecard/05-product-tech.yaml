    - Spend-active user
    - Mature but opaque
    - Offline discovery and discount surface inside the app
    - No merchant count or redemption metrics
  - - OneScore
    - Broader credit-aware consumer
    - Mature adjacent product
    - Free monthly bureau pulls and score coaching
    - No disclosed cross-sell conversion into OneCard
  - - Wizely
    - Savings / deposit seeker
    - Early adjacent product
    - Adds FDs and digital gold to the consumer wallet
    - Integration depth with OneCard ecosystem is unclear
