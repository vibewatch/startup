company:
  name: FPL Technologies (OneCard)
chapter:
  number: 5
  title: Product & Technology
  summary: OneCard’s public product evidence supports a strong front-end consumer-fintech experience—mobile application, instant virtual-card readiness, issuer-specific servicing, merchant offers, UPI-on-credit-card, and adjacent bureau/savings products—while also showing that the core operating model remains dependent on partner issuers, payment rails, and regulatory comfort. The product looks mature from the user’s perspective, but external technical transparency is limited.
sections:
- id: product-surfaces-and-user-jobs
  title: Product surfaces and user jobs
  body: 'OneCard’s public product story is unusually consistent across its own FAQ, app-store pages, and partner-bank pages. The core promise is not merely a credit line but a mobile-managed card experience: application, instant virtual-card readiness, controls, rewards, repayments, EMI conversion, utility payments, and nearby-offer discovery all sit inside the same app shell. That matters because the product is not sold as a static bank card; it is sold as a software-guided payments relationship whose premium physical token happens to be a metal card. The adjacent surfaces—OneScore for bureau insights and Wizely for savings and FDs—also show a broader ambition to own more of the consumer’s credit-and-money interface, even when those products are not yet deeply documented as direct in-app modules. That broader wallet ambition matters because it can deepen engagement without needing to win a fresh acquisition cycle every time the company launches a new money product and can improve retention
    economics if executed well.'
