- id: TE003
  title: Technology / operating architecture table
  kind: matrix
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Issuer-bank layer
    - Card issuance, formal documents, credit decision perimeter
    - Partner banks and financial institutions
    - Issuance pauses or policy shifts can halt growth
  - - Card-network layer
    - Transaction acceptance and routing
    - Visa / Mastercard / RuPay rails
    - Rule changes and network outages are external
  - - OneCard app layer
    - Onboarding, controls, EMI, offers, servicing UX
    - FPL software and app-store distribution
    - Low external observability on app architecture and uptime
  - - Repayment and collections rails
    - Debit-card, UPI, net-banking repayments and servicing
    - Payment gateways, bank systems, issuer processes
    - Payment failures or collections friction can damage trust
  - - Adjacency layer
    - OneScore bureau insights and Wizely savings products
    - Bureaus, FD partners, gold partner SafeGold
    - Cross-sell may distract if economics or integration are weak
  notes: Architecture is inferred conservatively from official and partner documentation, not from internal engineering materials.
