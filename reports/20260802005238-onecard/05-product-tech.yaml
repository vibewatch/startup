  evidenceGaps:
  - type: missing-source
    severity: material
    topic: technical-transparency
    missingEvidence: No public API docs, system architecture diagrams, uptime history, or public security documentation for the core OneCard platform.
    whyItMatters: Without technical artifacts, it is hard to judge resilience, integration complexity, and security maturity beyond user-facing claims.
    diligencePath: Request internal architecture review, uptime/SLA data, security audit outputs, and incident log.
    relatedQuestionRefs:
    - QE019
    - QE024
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: important
    topic: feature-adoption
    missingEvidence: Feature-level usage metrics for UPI, EMI conversion, bill pay, offers, and cross-sell adoption.
    whyItMatters: The difference between “feature exists” and “feature materially changes engagement” is central to underwriting product quality.
    diligencePath: Request MAU, WAU, feature adoption funnels, repeat usage, and cross-sell conversion metrics.
    relatedQuestionRefs:
    - QE010
    - QE011
    - QE017
    relatedTableRefs:
    - TE001
    - TE002
  - type: missing-source
    severity: important
    topic: security-proof
    missingEvidence: Public proof for certifications, audits, or privacy controls beyond OneScore marketing text.
    whyItMatters: Trust posture is a selling point, but independent evidence remains sparse.
    diligencePath: Request ISO certificate copies, audit summaries, vulnerability-management process, and DPA/privacy-control documentation.
    relatedQuestionRefs:
    - QE014
    relatedTableRefs:
    - TE004
