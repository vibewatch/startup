- id: trust-support-and-compliance-controls
  title: Trust, support, and compliance controls
  body: The trust picture is mixed but usable. On the positive side, OneCard and its adjacent products provide concrete support rails, issuer-specific contacts, documented repayment methods, and recurring statements about security or privacy posture. OneScore’s ISO claim and its “no permissions” positioning help show that the group understands privacy as a selling point. Yet most of those controls are still narrated rather than evidenced with deep public artifacts such as audit reports, public security pages, penetration-test summaries, or uptime history. In other words, the company is not silent on trust, but external technical proof remains lighter than the user-facing confidence language. That gap does not invalidate the product, but it does keep diligence anchored on what can actually be verified from public pages and what still needs private diligence packets.
  claimRefs:
  - CE017
  - CE018
  - CE022
  - CE023
  - CE028
  - CE031
  - CE033
  - CE036
  tableRefs:
  - TE004
  figureRefs: []
- id: maturity-roadmap-and-product-risk
  title: Maturity, roadmap, and product risk
  body: 'Feature breadth and cross-sell expansion make OneCard look mature as a consumer product front end, but the 2025 RBI-driven issuance pause shows that maturity at the UX layer does not eliminate platform risk. The public roadmap is also implicit rather than explicit: UPI now appears as a newly foregrounded feature in store listings, merchant offers are clearly being emphasized, and adjacent products broaden the addressable wallet share. Careers and distribution-platform footprints further imply active iteration. However, because the company does not expose a public changelog or detailed engineering roadmap, outsiders cannot separate experimental features from scaled ones with high precision. The right reading is therefore not “unfinished product,” but rather “mature interface with limited external observability and non-trivial regulatory/partner dependencies.” That is a workable setup for a scaled consumer-fintech product, but it also means product due diligence cannot stop at app
    screenshots and bank landing pages. Investors still need internal metrics, security evidence, and partner-operating maps before they can treat the apparent polish as complete technical proof.'
