  rows:
  - - Get a premium credit card
    - Download app, apply, await issuer decision
    - App-led application with instant virtual-card path
    - Faster time-to-first-use if approved
    - Approval and limits still depend on issuer criteria
  - - Control spend and card settings
    - Use issuer portal or call center
    - Real-time app controls and temporary card locking
    - More software-like control surface
    - Public docs do not show every control or latency SLA
  - - Repay dues
    - Use bank portal or branch
    - Repayment via debit card, UPI, and net banking in app
    - Less friction at bill-pay stage
