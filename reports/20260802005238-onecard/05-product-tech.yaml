  - - Use card for daily payments
    - Card swipe only
    - Adds UPI, bills, recharge, rent, and EMI actions
    - Broader frequency and top-of-wallet potential
    - No public proof of sustained repeat usage
  - - Find savings on spend
    - Search merchant offers elsewhere
    - Dedicated nearby-offers surface and partner promotions
    - Creates a commerce loop inside the app
    - Merchant density and redemption success are undisclosed
