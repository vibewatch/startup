    - Premium physical card with app-led controls and rewards
    - No public active-user or feature-usage breakout
  - - Virtual card issuance
    - Newly approved user
    - Mature
    - Same-day online usability before metal card delivery
    - No fraud-loss or activation-rate data
  - - UPI on RuPay credit card
    - Existing RuPay-linked user
    - Recently foregrounded / live
