- id: funding-scale-and-unicorn-status
  title: Funding history, scale, and unicorn status
  body: |-
    OneCard’s late-2024 financing and current valuation are well evidenced, even if some details conflict. Entrackr, Inc42, Infomance, and Tracxn all support a roughly INR 239.4 crore or $28.5 million Series D round in late 2024, with Better Tomorrow Ventures, Peak XV, QED, and Z47 active around the deal. ET reported a realised close closer to $25.5 million, which suggests tranches or partial closes rather than a single neat cheque. On valuation, the best-supported current external range is about $1.3 billion to $1.4 billion, with Tracxn at roughly $1.37 billion and Infomance near $1.4 billion.

    The stronger long-run conclusion is not the exact 2024 cheque amount but the status of the company after the 2022 unicorn round. Venture Intelligence and Inc42 both place OneCard’s unicorn entry in July 2022 after Temasek-backed financing. Hurun’s 2025 global unicorn index then provides valuable post-2024 confirmation that the business still screens above $1 billion while also highlighting a $2.8 billion drop from peak private-market value. That makes chapter-one judgment more nuanced than a simple growth story: the company still has notable backers and real revenue scale, but the public market signal embedded in its current valuation is far less euphoric than the 2022 narrative.
