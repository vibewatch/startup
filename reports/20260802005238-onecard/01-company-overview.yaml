- id: financial-signal-and-regulatory-overhang
  title: Financial signal and regulatory overhang
  body: |-
    The best filings-based operating signal in the current source pack is the FY24 Inc42 report: revenue up 163% to INR 1,425.58 crore, but net loss still around INR 401 crore and spending still heavy on promotion and miscellaneous cost lines. Inc42’s 2026 database profile points to revenue above INR 1,908.5 crore for FY25, but that figure is not supported here by a retained filings article or management presentation, so it should be treated as a softer current indicator rather than the primary denominator for valuation work. Meanwhile, current public backers such as Peak XV and QED still list OneCard in their portfolios, which supports continued institutional sponsorship.

    The clearest adverse overview fact is regulatory. ET and Inc42 both reported that RBI asked partner banks to pause new OneCard issuance while clarifying data-sharing arrangements in the co-branded model. Because partner banks issue the cards and FPL manages acquisition and servicing, this sort of intervention is not peripheral; it hits the core operating loop. Together with Hurun’s mark-down signal and unresolved capital-history inconsistencies, the regulatory pause reduces confidence in any simplistic “premium metal card unicorn” story. The company remains clearly relevant and scaled, but chapter one should frame it as a strong product brand operating under meaningful regulatory and governance constraints.
