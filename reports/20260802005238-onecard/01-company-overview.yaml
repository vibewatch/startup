  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: A reconciled round-by-round cap table and funding history from
      management or a filings pack.
    whyItMatters: Public sources disagree materially on total capital raised, which
      distorts dilution, preference-stack, and valuation interpretation.
    diligencePath: Request the latest cap table, share-class schedule, and board-approved
      financing summary from management.
    relatedQuestionRefs:
    - QO011
    - QO012
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee map, and clear public executive
      bench beyond the founders.
    whyItMatters: Late-stage regulated fintechs need stronger governance visibility
      than the current public record provides.
    diligencePath: Request board composition, observer rights, and succession planning
      materials.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-map
    missingEvidence: Programme-level economics, revenue-sharing terms, and issuer
      concentration by partner bank.
    whyItMatters: The stakeholder map is only directional until the report can show
      which issuing banks matter most economically and operationally.
    diligencePath: Request partner-by-partner active cards, balances, revenue-share
      terms, and servicing obligations from management.
    relatedQuestionRefs:
    - QO018
    - QO021
    relatedTableRefs:
    - TO003
  - type: stale
    severity: minor
    topic: fy25-revenue
    missingEvidence: A retained FY25 filings-based article or annual filing showing
      revenue and losses.
    whyItMatters: The current FY25 revenue pointer comes from a database snapshot
      rather than a verified filings story.
    diligencePath: Refresh MCA-linked financial reporting and compare with later media
      databases.
