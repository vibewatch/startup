company:
  name: FPL Technologies (OneCard)
chapter:
  number: 1
  title: Company Overview
  summary: 'OneCard is a Pune-based mobile-first co-branded credit-card platform run
    by FPL Technologies, with a premium metal-card proposition delivered through bank
    partners and an app that now spans UPI, EMI, and broader credit management. The
    best-supported FY24 financial signal is strong top-line growth to INR 1,425.58
    crore with losses still near INR 401 crore, while the clearest overview-level
    risk is regulatory: current coverage says RBI asked partner banks to pause new
    issuance while clarifying data-sharing arrangements. Unicorn status is still supported
    by Hurun in 2025, but the same source highlights a roughly $2.8 billion drop from
    peak value.'
sections:
- id: identity-and-stack
  title: Identity, operating stack, and partner model
  body: |-
    OneCard should be analysed as the consumer brand of FPL Technologies rather than as a standalone licensed issuer. The current official about page describes FPL as a fintech company reimagining credit and payments, while the app-store and apply surfaces show that the consumer experience is a mobile-first app from which users can apply for select partner-bank cards, manage spending, convert EMI, pay bills, and now make UPI payments. That architecture matters because it explains why public issuing-bank pages are so important: OneCard does not present itself as an independent bank, but as a software-led card programme manager layered on top of regulated banking partners.

    The company also already looks broader than a single card. FPL’s official about page says the group operates OneScore for credit-score monitoring and Wizely for savings products, suggesting a wider consumer-finance stack around the core OneCard wedge. Across Federal Bank, South Indian Bank, the app-store listing, and Paisabazaar, the recurring product promise is consistent: a metal, app-controlled, lifetime-free credit card with low forex fees, flexible EMI handling, and a differentiated rewards interface. The overview conclusion is that OneCard is not just a card skin on top of a bank; it is a software and distribution layer trying to own the customer relationship while banks keep the regulated issuing role.
