  topStrengths:
    - Real FY24 revenue scale and clear evidence that the business is far beyond pilot stage.
    - Strong app-adoption proxies from Android and iOS surfaces, supporting real consumer reach.
    - Product breadth that extends beyond a basic credit card into UPI, bills, EMI, offers, and adjacent credit tools.
    - Continued investor support in late 2024 despite a much tougher private-market environment.
    - Post-2024 unicorn-confirming evidence still places the company above the $1B threshold.
  topRisks:
    - RBI-linked scrutiny of the co-branded issuing model is the dominant risk and directly affects growth.
    - Public evidence still shows weak earnings quality, with large FY24 losses despite revenue growth.
    - Partner-bank dependence creates structural concentration and execution risk outside FPL alone.
    - Current public diligence is thin on charge-offs, fraud, reserves, active cards, and partner-bank economics.
    - Customer-trust fragility remains possible if secured-card servicing or grievance handling breaks down.
  unresolvedGaps:
    - Current issuance status and remediation progress by bank partner are not yet verified from primary materials.
    - Active-card cohorts, retention, churn, and repeat-spend data remain undisclosed.
    - Charge-offs, fraud-loss rates, reserve policies, and segment-level credit performance are not public.
    - Revenue-share and servicing economics between FPL and issuer banks remain opaque.
    - Current cap-table terms, preferences, and any refreshed post-2024 marked transaction price remain private.
