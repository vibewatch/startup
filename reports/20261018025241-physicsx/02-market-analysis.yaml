callouts:
  - calloutType: "risk"
    title: "Sizing confidence is constrained by missing denominators"
    body: >-
      Company-reported growth supports demand but cannot establish market share or
      penetration without absolute revenue, customer count, pricing, and eligible-account
      denominators. Treat the published category forecasts as diligence leads, not a
      valuation-ready TAM.
    claimRefs: ["CM011", "CM015"]
