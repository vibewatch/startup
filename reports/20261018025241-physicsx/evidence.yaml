    whyItMatters: >-
      The internal-build alternative is named in retained evidence but not economically bounded, leaving the
      make-versus-buy edge case unresolved.
    diligencePath: >-
      Request buyer interviews or implementation case studies that quantify engineering effort, GPU cost, and time to
      first production model.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: revenue-scale
    missingEvidence: >-
