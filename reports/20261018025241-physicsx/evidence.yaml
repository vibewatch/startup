evidenceGaps:
  - type: missing-source
    severity: material
    topic: founding-and-history
    missingEvidence: >-
      A reliable primary or independent source for the founding date, prior financing rounds, and pre-2025 product
      milestones.
    whyItMatters: >-
      The assigned pool cannot establish a complete corporate history or distinguish founding, incorporation, and
      commercial launch dates.
    diligencePath: Obtain incorporation records, a management-approved financing history, and dated product-release documentation.
    relatedQuestionRefs:
      - QO001
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: software-economics
    missingEvidence: Absolute recognized revenue, ARR, gross margin, retention, pricing, contract duration, and customer concentration.
    whyItMatters: >-
      Relative growth without denominators does not establish revenue scale, software quality, cash generation, or
      repeatability.
    diligencePath: >-
      Request audited or management financials, an ARR bridge, cohort retention, gross-margin schedules, and customer
      concentration data.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      A complete executive and board roster, post-Series-C cap table, investor rights, liquidation preferences, debt,
      and secondary-sale details.
    whyItMatters: >-
      Key-person, control, dilution, and downside economics cannot be assessed from named investors and public founder
      roles alone.
    diligencePath: >-
      Review the post-money cap table, financing documents, board materials, debt schedule, and succession plan with
      management and counsel.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-corroboration
    missingEvidence: >-
      Independent confirmation or rebuttal of the claimed six-month demand backlog, incumbent bundling pressure, and
      customer-validation risk.
    whyItMatters: >-
      The pool's only adverse account is a low-reputation editorial profile, so the frequency and operational impact of
      these concerns are unknown.
    diligencePath: >-
      Interview customers and former employees, inspect backlog aging and implementation capacity, and benchmark
      competitive losses.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Original market-study publications with category definitions, geography, sampling, methodology, and forecast
      assumptions for the simulation-software and physics-AI estimates.
    whyItMatters: >-
      Without the underlying studies, the published category figures cannot be reconciled or converted into a defensible
      company-specific TAM, SAM, or SOM.
    diligencePath: >-
      Obtain the cited analyst studies or commissioned market work and reconcile their taxonomies to PhysicsX product
      modules and target accounts.
    relatedQuestionRefs:
      - QM003
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      PhysicsX pricing, absolute recognized revenue and bookings, customer count, eligible-account universe,
      penetration, software-services-compute mix, and customer concentration.
    whyItMatters: >-
      These denominators are required to build a bottom-up SAM and SOM and to distinguish market growth from company
      share gains.
    diligencePath: >-
      Request a management data room extract by product, vertical, geography, deployment type, account cohort, and
      contract value, then reconcile it to audited revenue.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-map
    missingEvidence: >-
      Named procurement authority, budget line, implementation duration, payback period, expansion path, and renewal
      evidence by customer segment.
    whyItMatters: >-
      Public use cases show technical relevance but do not establish repeatable enterprise buying behavior or adoption
      timing.
    diligencePath: >-
      Interview reference customers and review contracts, implementation plans, ROI models, renewal data, and expansion
      histories for representative deployments.
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Public or customer-approved evidence of realized pricing, renewal structure, and post-pilot expansion economics
      for PhysicsX and named competitors.
    whyItMatters: Packaging and price transparency determine whether PhysicsX can defend margins and expand beyond pilot projects.
    diligencePath: >-
      Request price sheets, sample SOW or MSA language, and customer procurement references showing pilot-to-production
      transitions.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: durability
    missingEvidence: >-
      Customer-level retention, expansion, and multi-homing evidence showing whether deployments displace incumbent
      workflows or sit beside them indefinitely.
    whyItMatters: Competitive durability depends on whether PhysicsX becomes the operating layer or remains an optional accelerator.
    diligencePath: >-
      Obtain cohort expansion data, reference calls, and examples of solver budget reallocation after PhysicsX
      deployment.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: internal-build-economics
    missingEvidence: >-
      Source-backed cost or time benchmarks comparing an internal PhysicsNeMo-style build to buying PhysicsX or another
