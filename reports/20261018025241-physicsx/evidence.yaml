    keyQuote: >-
      London, UK — 8 June 2026 — PhysicsX, the physics AI company for industrials, today announced an oversubscribed
      \$300 million Series C financing at a valuation of approximately \$2.4 billion. The round is led by Temasek, with
      participation from new investors M&G Investments and Intrepid Growth Partners, alongside existing investors
      including Applied Materials, Atomico, General Catalyst, July Fund, NGP, NVIDIA, Radius, and Siemens. Temasek first
      invested in PhysicsX in 2025, and has played an instrumental role in supporting the company’s international
      expansion and growth.
