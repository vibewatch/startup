companyProfile:
  summary: >-
    PhysicsX is a founder-led UK industrial-AI company building an AI-native engineering platform around Large Physics
    Models for design, manufacturing, and operations. The public record now anchors the company at a June 2026 $300
    million Series C valued at about $2.4 billion, alongside reported growth in revenue, bookings, customer count, and
    headcount. The business appears to monetize through enterprise projects and long-term contracts wrapped around
    customer-specific deployments, but the public evidence still does not disclose the absolute economics needed to
    underwrite the model with confidence.
