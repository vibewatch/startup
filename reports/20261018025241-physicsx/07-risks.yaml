  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-legal-risk-register coverage
      missingEvidence: >-
        Named licenses, certifications, export-control posture, customer audit
        outcomes, and any litigation or enforcement matters.
      whyItMatters: >-
        Without direct legal and compliance evidence, the regulatory register can
        only show public-source gaps rather than a cleared operating posture.
      diligencePath: >-
        Request counsel-reviewed legal disclosure, security-certification list,
        and buyer qualification documents.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: customer-concentration-and-retention
      missingEvidence: >-
        Top-customer share, renewal rates, contract duration, and named expansion
        proof across programs or sites.
      whyItMatters: >-
        Partner and concentration risk cannot be sized credibly without knowing
        whether growth is diversified and repeatable.
      diligencePath: >-
        Review cohort revenue, top-10 customer concentration, renewal history,
        and procurement references.
      relatedQuestionRefs: [QR004, QR005]
    - type: private-evidence-only
      severity: material
      topic: unit-economics-and-burn
      missingEvidence: >-
        Absolute recognized revenue, software gross margin, burn, runway, and
        compute cost as a percentage of revenue.
      whyItMatters: >-
        Current public percentages do not show whether frontier-model economics
        scale attractively at the current valuation.
      diligencePath: >-
        Request board or investor reporting on revenue mix, gross margin, burn,
        runway, and model-training cost drivers.
      relatedQuestionRefs: [QR005, QR008]
    - type: missing-source
      severity: material
      topic: security-and-incident-history
      missingEvidence: >-
        Named security certifications, incident or outage history, model
        acceptance thresholds, and customer security review outcomes.
      whyItMatters: >-
        Enterprise-readiness claims are difficult to underwrite without evidence
        that the platform has already cleared security and reliability gates.
      diligencePath: >-
        Request security review packets, incident logs, validation metrics, and
        customer reference calls focused on production operations.
      relatedQuestionRefs: [QR003, QR006]
