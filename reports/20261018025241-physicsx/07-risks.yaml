        - label: Impact
          detail: Effect on thesis if realized
        - label: Mitigation maturity
          detail: Strength of disclosed controls
        - label: Residual severity
          detail: Post-mitigation view
      rows:
        - label: Model-validation in mission-critical workflows
          values: [High, High, Medium, High]
        - label: Data governance and security assurance
          values: [Medium, High, Medium, High]
        - label: Integration and delivery complexity
          values: [High, High, Medium, High]
        - label: Strategic partner dependence
          values: [Medium, High, Medium, Medium]
        - label: Capital intensity and undisclosed unit economics
          values: [Medium, High, Low, High]
        - label: Competitive displacement
          values: [Medium, Medium, Low, Medium]
    approximationNotes: >-
      Categorical levels reflect disclosed evidence and explicit public gaps, not
      a probabilistic loss model.
    claimRefs: [CR001, CR002, CR005, CR006, CR007, CR008, CR009, CR011, CR012]
