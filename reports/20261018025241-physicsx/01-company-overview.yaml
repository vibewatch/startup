schemaVersion: report-v2
artifact: company-overview
slug: physicsx
runDate: 2026-10-18
company:
  name: PhysicsX
chapter:
  number: 1
  title: Company Overview
  summary: >-
    PhysicsX is a founder-led UK industrial-AI company whose current public
    anchor is an oversubscribed $300 million Series C announced in June 2026 at
    an approximately $2.4 billion valuation. Public evidence supports strong
    company-reported growth and a team above 300 people, but not founding date,
    absolute revenue, total capital raised, pricing, retention, or governance
    terms.
sections:
  - id: identity-and-platform
    title: Identity, footprint, and business model
    body: >-
      PhysicsX describes itself as the physics AI company for industrials and
      positions its product as an AI-native engineering platform spanning
      design, manufacturing, and operations. The platform combines simulation
      management, development and deployment of Deep Physics Models, and
      engineer-facing applications, with integrations into established CAE
      tools. The June 2026 company announcement places headquarters in the
      United Kingdom, offices in London and New York, and expanding presences
      in the Bay Area and Singapore. This supports a global enterprise-platform
      identity, but the assigned evidence does not establish a founding date,
      legal-entity map, pricing model, or software-versus-services mix.
    claimRefs: [CO001, CO002, CO012, CO013, CO014]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Public leadership evidence centers on two founders. Jacomo Corbo is
      identified as co-founder and CEO, while Robin Tuluie is identified as
      founder and chairman; independent coverage describes the company as
      founded by two former Formula 1 engineers. Their quoted roles create a
      credible founder-market-fit narrative around simulation and industrial
      engineering, but also make key-person dependence a material diligence
      issue. The assigned pool does not identify a broader executive roster,
      board members, investor seats, voting arrangements, or succession plans.
      Those absences are evidence gaps rather than proof that such structures
      do not exist.
    claimRefs: [CO003, CO004]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Financing and stakeholder structure
    body: >-
      On 8 June 2026, PhysicsX announced an oversubscribed $300 million Series C
      at an approximately $2.4 billion valuation. Temasek led the round, with
      M&G Investments and Intrepid Growth Partners joining existing investors
      including Applied Materials, Atomico, General Catalyst, July Fund, NGP,
      NVIDIA, Radius, and Siemens. PhysicsX says Temasek first invested in 2025
      and supported international expansion. The disclosed investor mix offers
      financial and industrial signaling, but funding raised is not cash
      available: the assigned pool does not establish lifetime capital raised,
      secondary participation, debt, liquidation preferences, ownership, or
      investor control rights.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO003]
  - id: scale-milestones-and-risk
    title: Scale, milestones, and contrary signals
    body: >-
      The financing announcement supplies relative rather than absolute
      operating metrics: recognized revenue doubled year over year, booked
      revenue tripled, customer count more than doubled, and headcount rose to
      more than 300 after doubling in twelve months. Those labels are not
      interchangeable with ARR, cash generation, or audited accounts. The
      company also says its platform is deployed across several industrial
      sectors and that models can predict physical behavior in seconds rather
      than hours or days. Simplify's editorial profile supplies the pool's only
      adverse source, flagging incumbent bundling, a claimed six-month demand
      backlog, and customer-validation risk; those signals remain
      uncorroborated in the other assigned sources.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO014, CO015, CO016]
    figureRefs: [FO001]
