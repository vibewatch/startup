      The public record verifies the latest round and company-reported growth
      rates, but not absolute revenue, ARR, gross margin, retention, customer
      concentration, lifetime capital raised, debt, secondaries, or governance
      rights. Simplify's adverse observations are useful diligence prompts, not
      independently corroborated proof of operational failure.
    claimRefs: [CO005, CO008, CO009, CO010, CO016]
