  evidenceGaps:
    - type: missing-source
      severity: material
      topic: durability-gap
      missingEvidence: Public or diligence-room disclosure of NRR, GRR, churn, renewal cadence, and contract length by major customer cohort.
      whyItMatters: Without retention and renewal evidence, growth could reflect early land wins or services-heavy projects rather than durable software expansion.
      diligencePath: Request cohort retention tables, renewal schedules, and contract templates segmented by top vertical and deployment stage.
      relatedQuestionRefs: [QU006]
    - type: private-evidence-only
      severity: material
      topic: named-customer-proof
      missingEvidence: Named production case studies with buyer, deployment scope, timeline, and measurable customer outcomes.
      whyItMatters: Current public proof does not cleanly distinguish paid production programs from pilots, co-development, or partner integrations.
      diligencePath: Obtain three reference calls or case-study packs covering one aerospace, one semiconductor, and one process-industry account.
      relatedQuestionRefs: [QU004, QU005]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer revenue share, share of bookings from strategic investors or partners, and site or program expansion data.
      whyItMatters: Concentration can materially change valuation support, forecast durability, and negotiating leverage even when topline growth is strong.
      diligencePath: Request customer concentration schedule, top-10 account list, and account-expansion bridge from initial deployment to current ARR.
      relatedQuestionRefs: [QU007]
      relatedTableRefs: [TU002]
