    claimRefs: [CU001, CU003, CU004, CU007, CU012, CU013]
callouts:
  - calloutType: strength
    title: Broad sector demand looks credible
    body: >-
      PhysicsX has more than a thematic customer story: official materials, investor messaging, and
      multiple 2026 reports all converge on adoption across several industrial verticals where
      simulation speed has direct economic value.
    claimRefs: [CU001, CU005, CU006, CU009]
  - calloutType: risk
    title: Public customer proof is still underwriting-light
    body: >-
      The weak point is durability evidence. Public sources provide relative growth metrics and a few
      named examples, but they do not disclose retention, concentration, contract length, or enough
      production-vs-pilot detail to underwrite repeatability.
    claimRefs: [CU010, CU011, CU013]
