schemaVersion: "report-v2"
artifact: customers
slug: physicsx
runDate: 2026-10-18
company:
  name: PhysicsX
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports real customer traction for PhysicsX across aerospace, semiconductors,
    automotive, materials, and energy workflows, and 2026 fundraising coverage consistently reports
    sharply higher revenue, bookings, and customer count. The commercial proof is still mostly
    sector-level and relative rather than absolute: named deployments are sparse, retention data is
    absent, and public materials do not disclose customer concentration or program-level expansion.
sections:
  - id: customer-segments
    title: Customer segmentation is broad by industrial workflow, but public detail is mostly sector-level
    body: >-
      PhysicsX positions itself around complex industrial engineering programs rather than SMB or
      self-serve usage. Its own materials frame the platform across the full product lifecycle, from
      design through manufacturing and operations, while third-party coverage and investor materials
      consistently place the company in aerospace and defense, semiconductors, automotive, materials,
      and energy workflows. That suggests a buyer set anchored in engineering, manufacturing, and
      operations leaders at large industrial enterprises. What remains thin is the commercial
      segmentation underneath that story: public sources do not break revenue by vertical, geography,
      buyer persona, account size, or channel, so the breadth is credible but still top-of-funnel in
      analytical value.
    claimRefs: [CU001, CU005, CU009, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption momentum is visible in relative growth metrics, not disclosed customer denominators
    body: >-
      The strongest 2026 adoption evidence is directional rather than absolute. Multiple funding-round
      writeups repeat management's claim that recognized revenue doubled, booked revenue tripled, and
      customer count more than doubled over the prior year, with headcount rising above 300. Those
      are meaningful indicators that commercial adoption is not confined to pilots, especially when
      paired with continued hiring and geographic expansion into the US and Singapore. Still, none of
      the cited sources gives the base customer count, deployment count, utilization, average contract
      value, or vertical mix needed to translate momentum into a durability view.
    claimRefs: [CU002, CU003, CU004, CU006, CU007, CU012, CU013]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named customer proof exists, but most public examples stop short of production-grade disclosure
    body: >-
      Public proof that PhysicsX is embedded in real customer programs is stronger than a mere logo
      wall, but still weaker than a mature enterprise software case-study set. PhysicsX's homepage
      says it works "embedded inside customer programs," and external profiles cite Leonardo
      Aerospace, Rio Tinto, and Siemens-linked workflows as concrete examples. The problem is quality
      and freshness: the named examples are concentrated in lower-reputation profile coverage, while
      higher-profile 2026 sources mostly stay at the sector or investor-validation level. Public
      materials also rarely distinguish whether a named engagement is a paid production deployment, a
      pilot, a co-development relationship, or a strategic partnership.
    claimRefs: [CU001, CU008, CU009, CU010, CU013]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Retention, expansion, and concentration are still the core diligence gaps
    body: >-
      The chapter's main risk is not absence of customer activity; it is absence of durable customer
      economics in public evidence. No source in the assigned pool discloses NRR, GRR, churn, renewal
      rates, contract length, site expansion, top-customer share, or partner/channel mix. That makes
      it difficult to separate a healthy land-and-expand motion from a business driven by a small
      number of strategic programs, services-heavy integrations, or investor-adjacent lighthouse
      accounts. The customer story is therefore commercially encouraging but still incomplete for
      underwriting repeatability, pricing power, and concentration risk at a $2.4 billion valuation.
    claimRefs: [CU004, CU010, CU011, CU013]
