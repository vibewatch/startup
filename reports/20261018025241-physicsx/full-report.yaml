      - number: '1.3'
        title: Financing and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              On 8 June 2026, PhysicsX announced an oversubscribed $300 million Series C at an approximately $2.4
              billion valuation. Temasek led the round, with M&G Investments and Intrepid Growth Partners joining
              existing investors including Applied Materials, Atomico, General Catalyst, July Fund, NGP, NVIDIA, Radius,
              and Siemens. PhysicsX says Temasek first invested in 2025 and supported international expansion. The
              disclosed investor mix offers financial and industrial signaling, but funding raised is not cash
              available: the assigned pool does not establish lifetime capital raised, secondary participation, debt,
              liquidation preferences, ownership, or investor control rights.
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.4'
        title: Scale, milestones, and contrary signals
        blocks:
          - type: paragraph
            body: >-
              The financing announcement supplies relative rather than absolute operating metrics: recognized revenue
              doubled year over year, booked revenue tripled, customer count more than doubled, and headcount rose to
              more than 300 after doubling in twelve months. Those labels are not interchangeable with ARR, cash
              generation, or audited accounts. The company also says its platform is deployed across several industrial
              sectors and that models can predict physical behavior in seconds rather than hours or days. Simplify's
              editorial profile supplies the pool's only adverse source, flagging incumbent bundling, a claimed
              six-month demand backlog, and customer-validation risk; those signals remain uncorroborated in the other
              assigned sources.
