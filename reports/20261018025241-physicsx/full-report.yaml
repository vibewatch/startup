      - number: '6.2'
        title: Adoption momentum is visible in relative growth metrics, not disclosed customer denominators
        blocks:
          - type: paragraph
            body: >-
              The strongest 2026 adoption evidence is directional rather than absolute. Multiple funding-round writeups
              repeat management's claim that recognized revenue doubled, booked revenue tripled, and customer count more
              than doubled over the prior year, with headcount rising above 300. Those are meaningful indicators that
              commercial adoption is not confined to pilots, especially when paired with continued hiring and geographic
              expansion into the US and Singapore. Still, none of the cited sources gives the base customer count,
              deployment count, utilization, average contract value, or vertical mix needed to translate momentum into a
              durability view.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU006
              - CU007
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU012
              - CU013
      - number: '6.3'
        title: Named customer proof exists, but most public examples stop short of production-grade disclosure
        blocks:
          - type: paragraph
            body: >-
              Public proof that PhysicsX is embedded in real customer programs is stronger than a mere logo wall, but
              still weaker than a mature enterprise software case-study set. PhysicsX's homepage says it works "embedded
              inside customer programs," and external profiles cite Leonardo Aerospace, Rio Tinto, and Siemens-linked
              workflows as concrete examples. The problem is quality and freshness: the named examples are concentrated
              in lower-reputation profile coverage, while higher-profile 2026 sources mostly stay at the sector or
              investor-validation level. Public materials also rarely distinguish whether a named engagement is a paid
              production deployment, a pilot, a co-development relationship, or a strategic partnership.
            claimRefs:
              - CU001
              - CU008
              - CU009
              - CU010
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU008
              - CU009
              - CU010
              - CU013
      - number: '6.4'
        title: Retention, expansion, and concentration are still the core diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The chapter's main risk is not absence of customer activity; it is absence of durable customer economics
              in public evidence. No source in the assigned pool discloses NRR, GRR, churn, renewal rates, contract
              length, site expansion, top-customer share, or partner/channel mix. That makes it difficult to separate a
              healthy land-and-expand motion from a business driven by a small number of strategic programs,
              services-heavy integrations, or investor-adjacent lighthouse accounts. The customer story is therefore
              commercially encouraging but still incomplete for underwriting repeatability, pricing power, and
              concentration risk at a $2.4 billion valuation.
            claimRefs:
              - CU004
              - CU010
              - CU011
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad sector demand looks credible
            body: >-
              PhysicsX has more than a thematic customer story: official materials, investor messaging, and multiple
              2026 reports all converge on adoption across several industrial verticals where simulation speed has
              direct economic value.
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU009
          - type: callout
            title: Public customer proof is still underwriting-light
            body: >-
              The weak point is durability evidence. Public sources provide relative growth metrics and a few named
              examples, but they do not disclose retention, concentration, contract length, or enough
              production-vs-pilot detail to underwrite repeatability.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Residual risk ranking centers on validation and execution
        blocks:
          - type: paragraph
            body: >-
              The reviewed sources show real commercial momentum, but they also point to a concentrated set of risks
              that could break the investment case if they are not de-risked in diligence. The core product promise is
              to move engineering decisions from hours or days of simulation into seconds, yet independent coverage also
              flags that aerospace and semiconductor contexts leave little tolerance for model error. That makes
              model-validation risk, not top-of-funnel awareness, the primary thesis-break variable. The second cluster
              is execution: PhysicsX is scaling headcount, geographies, and larger pretrained models at the same time it
              supports bespoke enterprise deployments across complex customer environments. The third cluster is hidden
              financial and concentration risk: public sources repeat strong growth percentages and recent financing,
              but they do not disclose absolute revenue, gross margin, burn, top-customer share, or renewal quality.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR008
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
      - number: '7.2'
        title: Legal posture is opaque while model governance remains customer-critical
        blocks:
          - type: paragraph
            body: >-
              Publicly retained evidence does not show an active litigation, licensing, or enforcement problem, but it
              also does not clear that category; the sources are mostly product and funding materials rather than legal
              or compliance disclosures. That matters because PhysicsX targets high-consequence sectors such as
              aerospace, defence, semiconductors, and energy, where a failure can create export-control, IP, safety, or
              customer acceptance friction long before it becomes a public incident. PhysicsX does describe mitigants
              that matter: customer-specific model training, uncertainty quantification, benchmarking tooling, and
              support for hybrid or on-prem deployment in high-classification environments. Still, the disclosed
              mitigants are design features rather than audit evidence, so the diligence burden is to verify contractual
              data controls, validation thresholds, and named certifications before underwriting the platform as
              enterprise-ready at scale.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
              - CR012
      - number: '7.3'
        title: Scaling risk is amplified by partner dependence and thin unit-economics disclosure
        blocks:
          - type: paragraph
            body: >-
              Operationally, PhysicsX is not shipping a lightweight plug-in; it is integrating with existing CAE stacks,
              deploying across cloud and on-premises environments, and tailoring models to customer-specific data and
              workflows. That implies longer implementation cycles, service load, and dependency on customer data
              quality and internal engineering teams. The partner stack matters too: the company narrative relies
              heavily on Temasek, NVIDIA, Siemens, Applied Materials, and other strategically aligned backers for
              credibility, infrastructure, and market access. Those relationships are strengths today, but they also
              increase roadmap and ecosystem dependence. Financially, the Series C and British Business Bank
              participation reduce immediate funding risk, yet the retained public record still omits absolute revenue,
              margin, burn, and concentration data, so the monitorable kill criteria should focus on deployment proof,
              repeatable renewals, and whether model-training economics scale faster than headcount and compute demand.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
