  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence suggests PhysicsX converts simulation pain into revenue through scoped enterprise deployments,
      then tries to expand that footprint with additional platform and delivery work.
    data:
      nodes:
        - id: pain
          label: High-cost simulation bottleneck
          detail: Target sectors face long design cycles, expensive prototypes, and clear ROI from faster physics iteration.
        - id: scope
          label: Technical scoping + customer data access
          detail: Customer-specific data and engineering context are gathered before deployment.
        - id: build
          label: Model training / tuning
          detail: >-
            PhysicsX tailors model architectures, simulation pipelines, and optimization loops for the customer
            environment.
        - id: deploy
          label: Integrated engineering workflow
          detail: Deployments connect into CAE tools and cloud, hybrid, or on-prem environments.
        - id: commercial
          label: Project or long-term contract revenue
          detail: Public evidence shows project-based work and long-term contracts, not published self-serve pricing.
        - id: margin
          label: Gross profit depends on reuse versus bespoke delivery
          detail: Growth is visible, but public evidence does not disclose gross margin, utilization, or payback.
      edges:
        - from: pain
          to: scope
          label: ROI case opens evaluation
        - from: scope
          to: build
          label: data and workflow definition
        - from: build
          to: deploy
          label: model packaged into customer workflow
        - from: deploy
          to: commercial
          label: commercial relationship formed
        - from: commercial
          to: margin
          label: economics hinge on delivery intensity
    approximationNotes: >-
      This flow is qualitative: public sources describe the customer workflow and contract shape, but they do not
      quantify dollar conversion, attachment rates, or gross profit at each step.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI012
      - CI015
