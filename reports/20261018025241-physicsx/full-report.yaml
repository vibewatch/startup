  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment view remains "research-more" at the current public price
        blocks:
          - type: paragraph
            body: >-
              The clearest public valuation anchor remains the June 2026 Series C that independent coverage places at
              about $2.4 billion for a $300 million round. That is real financing momentum, and it matters that multiple
              outside sources agree on the headline number. The problem is that the public denominator remains thin.
              Multiples records $50 million of revenue or ARR-like deal-time revenue and a 48.0x revenue multiple, but
              its own note says those figures are typically run-rate or LTM values recorded alongside a round. With no
              public disclosure on recognized revenue by cohort, gross margin, or retention, the available evidence
              supports continuing diligence rather than paying through the round headline.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV011
              - CV012
              - CV013
      - number: '8.2'
        title: >-
          Product breadth and industrial credibility are real, but proof of repeatable software economics is still
          incomplete
        blocks:
          - type: paragraph
            body: >-
              The long case is not hard to articulate. PhysicsX presents itself as an AI-native engineering platform
              that spans simulation management, model development, and production workflows across design,
              manufacturing, and operations, and it says the platform already integrates with core engineering tools
              such as ANSYS, CATIA, Siemens NX, OpenFOAM, and Siemens Star CCM+. That breadth, combined with strategic
              investors and customers from advanced industries, creates a plausible foundation for high-value, sticky
              deployments. The anti-thesis is that public proof of durable software economics lags the narrative:
              Dealroom's archived profile describes project-based or long-term-contract services, and a jobs-platform
              profile flags both bundle risk from incumbent simulation vendors and a six-month demand backlog.
              Independent valuation data also does not resolve whether the observed revenue figure is recognized
              revenue, ARR, or a looser round-time run-rate proxy.
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: Scenario underwriting still depends more on proof milestones than on narrative upside
        blocks:
          - type: paragraph
            body: >-
              The bull case requires treating the June 2026 growth signals as the front edge of a repeatable software
              compounding story: customer count more than doubled, booked revenue tripled, and team scale moved past 300
              according to post-round coverage. The base case accepts the quality of the product and investor syndicate
              but assumes the price already anticipates stronger retention, margin, and deployment evidence than is
              publicly visible. The bear case is less about the company failing technically and more about
              commercialization slippage or multiple compression: if backlog persists, implementation cycles stay long,
              or incumbents bundle comparable workflow value into broader CAE suites, the current entry price leaves
              little room for underwriting error.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: The decision should move only with hard diligence on economics, concentration, and terms
        blocks:
          - type: paragraph
            body: >-
              The next diligence step is not another story about industrial AI; it is a reconciliation exercise.
              Management should show the exact revenue definition attached to the public $50 million figure, the
              recognized-versus-booked split around the Series C, and customer concentration, renewal, and gross-margin
              data by major vertical. The investment team also needs the actual Series C preference stack, any secondary
              component, and board-control terms before treating the headline post-money as economically comparable to a
              clean common-equity entry. Without that package, the public record supports watching for proof milestones
              or a better entry point rather than underwriting a buy call from narrative momentum alone.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Entry discipline should tighten around proof, not narrative
            body: >-
              The financing signal is strong, but the public record still does not justify a buy call at the June 2026
              headline price without hard data on recognized revenue, retention, gross margin, and concentration.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV006
          - type: callout
            title: The main downside is execution-plus-multiple compression
            body: >-
              If backlog delays deployments or incumbents bundle alternatives into broader engineering suites, the
              valuation can compress before PhysicsX proves the economics needed to defend a premium software multiple.
            calloutType: risk
            claimRefs:
              - CV002
              - CV011
              - CV012
