chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and business model
        blocks:
          - type: paragraph
            body: >-
              PhysicsX describes itself as the physics AI company for industrials and positions its product as an
              AI-native engineering platform spanning design, manufacturing, and operations. The platform combines
              simulation management, development and deployment of Deep Physics Models, and engineer-facing
              applications, with integrations into established CAE tools. The June 2026 company announcement places
              headquarters in the United Kingdom, offices in London and New York, and expanding presences in the Bay
              Area and Singapore. This supports a global enterprise-platform identity, but the assigned evidence does
              not establish a founding date, legal-entity map, pricing model, or software-versus-services mix.
            claimRefs:
              - CO001
              - CO002
              - CO012
              - CO013
              - CO014
