            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence centers on two founders. Jacomo Corbo is identified as co-founder and CEO,
              while Robin Tuluie is identified as founder and chairman; independent coverage describes the company as
              founded by two former Formula 1 engineers. Their quoted roles create a credible founder-market-fit
              narrative around simulation and industrial engineering, but also make key-person dependence a material
              diligence issue. The assigned pool does not identify a broader executive roster, board members, investor
              seats, voting arrangements, or succession plans. Those absences are evidence gaps rather than proof that
              such structures do not exist.
            claimRefs:
              - CO003
              - CO004
