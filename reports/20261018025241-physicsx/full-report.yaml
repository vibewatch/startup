        title: Commercial model looks enterprise-programmatic, not self-serve
        blocks:
          - type: paragraph
            body: >-
              PhysicsX's public monetization picture looks more enterprise-programmatic than self-serve. Dealroom
              describes revenue as project-based work or long-term contracts, while official product pages emphasize a
              Delivery team that tailors model architectures, simulation pipelines, and optimization loops around each
              customer environment. The same official surfaces highlight integrations with incumbent CAE tools plus AWS,
              Azure, hybrid, and on-prem deployment, which can reduce switching friction for large accounts but also
              imply meaningful onboarding, data, and support work. Sector focus in aerospace, semiconductors,
              automotive, energy, materials, and data-center infrastructure suggests the company is selling into
              high-value engineering budgets where longer cycles can still clear if the throughput and design ROI is
              material.
            claimRefs:
