      - number: '3.2'
        title: Packaging, pricing opacity, and distribution leverage
        blocks:
          - type: paragraph
            body: >-
              Public packaging disclosure is thin. YesPress reports that PhysicsX does not publish a public price list
              and typically starts with a jointly scoped pilot lasting one to three months, which implies a
              consultative, services-assisted enterprise sale rather than transparent self-serve pricing. At the same
              time, independent coverage frames Siemens, NVIDIA, and Applied Materials as strategic investors whose
              ecosystem roles can shorten adoption paths by validating the category, providing compute or channel
              access, and placing PhysicsX closer to industrial buyers. That leverage does not eliminate competition
              because some of the same incumbents still own the incumbent workflow, but it does mean PhysicsX is
              approaching the market with stronger distribution partners than a typical frontier-simulation startup.
            claimRefs:
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP013
      - number: '3.3'
        title: Switching costs, multi-homing, and trust posture
        blocks:
          - type: paragraph
            body: >-
              The retained evidence suggests adoption can begin with relatively low process disruption and then become
              harder to unwind after customer-specific models and workflows are operationalized. PhysicsX says the
              platform connects to ANSYS, CATIA, Siemens NX, OpenFOAM, and Siemens Star CCM+, and official materials
              also emphasize hosted, customer-cloud, and fully air-gapped deployment options plus customer-specific
              model isolation. Those details reduce the need for a buyer to rip out its legacy solver stack on day one
              and support multi-homing with existing tools. Over time, however, the delivery model, pre-trained assets,
              and custom model tuning can raise practical switching costs because the value moves from a single solver
              run toward a broader operating workflow embedded in customer teams.
            claimRefs:
              - CP002
              - CP010
              - CP011
              - CP012
              - CP015
      - number: '3.4'
        title: Durability versus incumbent and peer response
        blocks:
          - type: paragraph
            body: >-
              The moat case is plausible but not settled by the public record. Independent commentary explicitly warns
              that established CAE vendors are adding AI features while AI-native entrants continue to attract large
              financing rounds, including cited 2025 raises by Neural Concept, Rescale, and Luminary Cloud. That matters
              because capital formation and incumbent response can compress the window in which PhysicsX's workflow
              breadth remains unique. The strongest public differentiation is therefore not simply that PhysicsX uses
              AI, but that it tries to combine private deployment, lifecycle coverage, and services-led implementation
              into one governed system. Without public retention, realized pricing, or expansion-cohort evidence,
              commoditization and coopetition risks remain material diligence items rather than closed questions.
            claimRefs:
              - CP005
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fragmented competition is the core market reality
            body: >-
              PhysicsX is competing at once against entrenched solver vendors, narrower AI-native accelerators, cloud
              simulation layers, and internal builds, so buyer evaluation is likely to center on workflow breadth and
              trust rather than a single benchmark.
            calloutType: insight
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP009
          - type: callout
            title: Public commercial durability remains under-disclosed
            body: >-
              The retained public evidence supports a consultative pilot-led motion, but it does not yet show realized
              pricing, renewal behavior, or multi-homing outcomes strongly enough to prove durable lock-in.
            calloutType: risk
            claimRefs:
              - CP006
              - CP013
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue quality is directionally strong but still ratio-only in public
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows strong relative growth but not absolute scale. Independent June 2026 coverage
              consistently reports a $300 million Series C at about a $2.4 billion valuation, and a July follow-on
              report says the British Business Bank added $25 million inside the same financing. Company-linked coverage
              says recognized revenue doubled year over year and booked revenue tripled, while TNW separately reports
              revenue has more than quadrupled over two years. Those metrics are directionally positive, but they are
              ratio-only disclosures; the assigned evidence does not reveal the underlying revenue base, ARR, realized
              pricing, or mix between recurring software and delivery-heavy services.
            claimRefs:
