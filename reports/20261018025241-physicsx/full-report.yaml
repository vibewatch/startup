  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              PhysicsX should not be valued against all industrial software or all generative AI. Its evidenced core is
              enterprise software that combines simulation orchestration, physics-model development, engineering
              applications, and integrations across design, manufacturing, and operations. The company says the platform
              is deployed where physical-system complexity and slow development are costly, including aerospace and
              defense, semiconductors, automotive, energy, materials, industrial machinery, and data centers. Included
              spend therefore begins with budgets for high-fidelity simulation, CAE workflow acceleration, optimization,
              and production deployment of learned physics models. Adjacent spend includes HPC infrastructure,
              engineering data management, digital twins, and process-control applications. The principal substitutes
              are conventional numerical solvers, existing CAE suites, internal simulation pipelines, physical
              prototyping, and engineering labor. Generic enterprise AI, broad product lifecycle management, and
              unrelated automation should be excluded unless they directly replace one of those workflows.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM009
      - number: '2.2'
        title: Sizing evidence and boundary discipline
        blocks:
          - type: paragraph
            body: >-
              The only numeric category sizing in the assigned public evidence is a Nexi Fund article reporting a $26.5
              billion simulation-software market in 2025, rising to $70.7 billion by 2033 at a 13% CAGR, and a much
              narrower physics-AI market of $236 million in 2025 and $683.5 million in 2035. Those figures are useful as
              boundary markers, not as an investable TAM calculation: the fetched article does not identify the original
              publishers, category definitions, geography, or methodology, and the two series use different forecast
              horizons. A bottom-up signal is stronger but still incomplete: PhysicsX reported doubling recognized
              revenue, tripling booked revenue, and more than doubling customer count over the preceding year, without
              publishing absolute values. No source in the assigned pool discloses price, eligible account counts,
              penetration, contract value, or service mix, so a PhysicsX-specific SAM and SOM remain unavailable.
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM015
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The evidenced user base extends beyond specialist simulation teams to engineers, designers, technicians,
              and operators, while the economic buyer is more likely to sit with an enterprise engineering,
              product-development, manufacturing, or operations organization. PhysicsX presents no-code engineering
              applications, uncertainty quantification, simulation and AI workbenches, and integration with tools such
              as ANSYS, CATIA, Siemens NX, OpenFOAM, and Siemens Star-CCM+. That suggests a land-and-expand path:
              validate a bounded high-value workflow, connect customer simulation and real-world data, deploy into the
              existing toolchain, and then reuse models or templates across programs and lifecycle stages. Microsoft
              describes applications in semiconductor equipment prototyping, Surface thermal design, and copper
              extraction, which broadens the plausible user and workflow set. Public evidence does not establish
              procurement authority, implementation duration, payback period, or whether software, services, cloud, and
              compute are purchased from the same budget.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is pulled by slow and expensive conventional simulation, pressure to shorten hardware-development
              cycles, improving GPU economics, and the value of evaluating many more design variants before committing
              to physical prototypes. Multi-cloud and on-premises deployment, CAE connectors, data lineage, and security
              claims are designed to reduce enterprise friction. The same features also reveal the constraints: model
              quality depends on the use case and training data; outputs remain approximations; mission-critical buyers
              require uncertainty evaluation; and integration into customer data, solver, security, and validation
              processes can create switching and implementation cost. An independent account further notes that
              high-fidelity multiphysics training data are expensive and aerospace and semiconductor applications
              tolerate little error. For valuation, category growth and company-reported momentum support demand, but
              they do not prove standardized deployment, durable software margins, or a repeatable enterprise sales
              cycle.
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sizing confidence is constrained by missing denominators
            body: >-
              Company-reported growth supports demand but cannot establish market share or penetration without absolute
              revenue, customer count, pricing, and eligible-account denominators. Treat the published category
              forecasts as diligence leads, not a valuation-ready TAM.
            calloutType: risk
            claimRefs:
              - CM011
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broader than a list of software logos because PhysicsX is trying to insert itself
              into the full engineering loop, not just one solver call. Independent coverage names trusted incumbent
              suites from Siemens, Ansys, Dassault Systemes, and Altair, plus AI-native challengers such as Neural
              Concept, Luminary, Monolith AI, SimScale, and Rescale. The retained official materials argue that PhysicsX
              differs by combining data orchestration, model development, applications, and deployment across the
              product lifecycle, which means the company is selling against status-quo sequential workflows and
              internal-build paths as much as against any one vendor. That makes the category structurally fragmented
              and raises the burden on buyers to compare workflow breadth, trust, and integration quality rather than
              only raw inference speed.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP009
