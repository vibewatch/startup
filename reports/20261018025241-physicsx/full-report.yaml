      - number: '5.2'
        title: Architecture, integration, and deployment model
        blocks:
          - type: paragraph
            body: >-
              Public product pages expose a fairly concrete stack: Simulation Workbench for simulation management and
              orchestration, AI Workbench for developing and deploying deep physics models, engineer-facing
              applications, and platform services covering integrations, security, and deployment. PhysicsX also states
              that models include uncertainty quantification and active learning, that customer data stays ring-fenced
              to the customer environment, and that the platform can run on AWS, Azure, hybrid, or on-premise
              infrastructure to reuse existing HPC capacity and meet higher classification requirements. A CDFAM
              interview with a PhysicsX engineering leader adds an important implementation detail: the product is built
              around inference as a core capability and is integrated into day-to-day workflows by a delivery team. That
              strengthens the product thesis, but it also implies services intensity and domain-expert dependence during
              deployment, especially for customers with bespoke CAD, solver, and validation pipelines.
            claimRefs:
