              - CE010
      - number: '5.3'
        title: Flagship assets, differentiation, and technical underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The most concrete product proof is concentrated in flagship assets rather than broad, module-by-module
              disclosure. Siemens and PhysicsX publicly described LGM-Aero as a pre-trained aerodynamics model built on
              a very large simulation corpus, and Ai.rplane as a public reference application that turns aeroelastic
              exploration into sub-second inference. By March 2026, PhysicsX had also extended the same pattern into
              busway thermal design for AI data centers, where the company says an interactive application can replace
              multi-day simulation cycles with instant predictions. Those assets support the differentiation claim that
              PhysicsX is trying to compress the full simulate-build-test loop rather than just accelerate a narrow
              solver step. The main underwriting gaps are equally clear: retained evidence does not disclose external
              security certifications, uptime or incident statistics, module-level pricing, or enough deployment metrics
              to separate scalable product revenue from expert-services effort inside customer programs.
            claimRefs:
              - CE007
              - CE008
              - CE011
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation is broad by industrial workflow, but public detail is mostly sector-level
        blocks:
          - type: paragraph
            body: >-
              PhysicsX positions itself around complex industrial engineering programs rather than SMB or self-serve
              usage. Its own materials frame the platform across the full product lifecycle, from design through
              manufacturing and operations, while third-party coverage and investor materials consistently place the
              company in aerospace and defense, semiconductors, automotive, materials, and energy workflows. That
              suggests a buyer set anchored in engineering, manufacturing, and operations leaders at large industrial
              enterprises. What remains thin is the commercial segmentation underneath that story: public sources do not
              break revenue by vertical, geography, buyer persona, account size, or channel, so the breadth is credible
              but still top-of-funnel in analytical value.
            claimRefs:
              - CU001
