  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "productization-gap"
      missingEvidence: "Module-level packaging, SKU boundaries, pricing structure, and implementation scoping that separate software subscription economics from expert-services work."
      whyItMatters: "Product margin, scalability, and revenue quality cannot be underwritten from launch narratives alone."
      diligencePath: "Request current packaging and pricing documents, services statements of work, and at least three recent deployment scopes showing standardized versus bespoke effort."
      relatedQuestionRefs: ["QE008"]
      relatedTableRefs: ["TE001"]
    - type: "missing-source"
      severity: "material"
      topic: "security-assurance"
      missingEvidence: "Named third-party certifications, audit reports, uptime commitments, or incident disclosures for production deployments."
      whyItMatters: "Mission-critical positioning is a core product claim, but public evidence does not show external assurance for security, reliability, or operational resilience."
      diligencePath: "Request SOC 2 or ISO artifacts, customer security questionnaires, uptime/SLA language, and any postmortem or incident summaries disclosed to customers."
      relatedQuestionRefs: ["QE008"]
    - type: "private-evidence-only"
      severity: "material"
      topic: "deployment-metrics"
      missingEvidence: "Reference metrics showing time-to-value, accuracy lift, validation pass rates, or retained usage after initial deployment."
      whyItMatters: "Without production metrics, it is difficult to distinguish impressive demonstrations from repeatable, durable engineering adoption."
      diligencePath: "Ask for named customer case studies with baseline-versus-current cycle time, validation method, active users, renewal status, and post-launch expansion."
