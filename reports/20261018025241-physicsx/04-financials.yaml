- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Recognized revenue growth
    - Doubled YoY (company-claimed)
    - Medium
    - Shows traction, but not the absolute revenue base or contribution margin
    - Request monthly and annual recognized revenue with reconciliation to bookings
  - - Booked revenue growth
    - Tripled YoY (company-claimed)
    - Medium
    - Signals pipeline and contract momentum, but bookings can overstate near-term cash generation
    - Request bookings definition, conversion lag, and cancellation/change-order history
  - - Delivery utilization / gross margin
    - null
    - Low
    - Customized deployment makes margin heavily dependent on reuse versus bespoke labor
    - Request software versus services mix, gross margin by offering, and delivery-team utilization
  - - CAC / payback / sales cycle
    - null
    - Low
    - Enterprise industrial selling can create long cycles and heavy pre-sales cost
    - Request funnel conversion, average cycle length, CAC by vertical, and payback by cohort
  - - Cash runway / net burn / debt
    - null
    - Low
    - Capital adequacy cannot be judged from funding headlines alone
    - Request current cash balance, monthly burn, debt facilities, covenants, and next-round trigger
  notes: Null fields reflect undisclosed private metrics in the assigned public evidence and should be treated as diligence blockers rather than zero or immaterial values.
