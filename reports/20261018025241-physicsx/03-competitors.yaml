      - ["Integration with current CAE stack", "Explicit connectors to ANSYS, CATIA, Siemens NX, OpenFOAM, and Star CCM+", "Already embedded in many customer environments", "Not fully specified in the retained pool", "Depends on internal engineering effort or current handoffs"]
      - ["Deployment and control", "Hosted, customer cloud, or fully air-gapped", "Trusted enterprise environments, but deployment detail is limited in this pool", "Deployment detail mostly unavailable in the retained pool", "Highest control for internal build; lowest workflow change for status quo"]
      - ["Human implementation layer", "Delivery team embeds with customer specialists", "Services ecosystem not detailed in retained pool", "Implementation model not clearly disclosed in retained pool", "Internal team bears implementation and change-management load"]
      - ["Trust and data boundary", "Customer-specific models; no cross-client training stated", "Incumbents benefit from established trust but AI boundary detail is sparse here", "Trust boundary detail is sparse in retained evidence", "Customer owns the data boundary but also the governance burden"]
    notes: "Cells marked as sparse or limited reflect gaps in the assigned public evidence set, not proof that the capability is absent."
    claimRefs: [CP001, CP002, CP010, CP011, CP012, CP015]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Solution path
      - Public price / contract model in retained evidence
      - Included capabilities
      - Discounts or unknowns
      - Buyer implication
    rows:
      - [PhysicsX, "No public list price; typically starts with a 1-3 month jointly scoped pilot", "Platform software, integrations, private deployment options, and delivery support", "Realized pricing, renewal terms, and expansion economics remain undisclosed", "Adoption appears enterprise and consultative rather than transactional"]
      - [Incumbent CAE suites, "Not disclosed in the retained pool", "Trusted solver depth and installed workflows", "List pricing, bundling, and AI add-on economics are unresolved here", "Installed base can force bake-offs even when PhysicsX wins a pilot"]
      - [AI-native challengers / cloud tools, "Not disclosed in the retained pool", "Faster exploration or cloud simulation access", "Packaging and discount structure remain unresolved in assigned evidence", "Side-by-side commercial comparability is still incomplete"]
      - [Internal build, "Internal headcount and compute cost rather than vendor list price", "Custom stack built around internal tooling such as PhysicsNeMo", "No public TCO benchmark in retained evidence", "Can appeal where sovereignty matters more than speed to value"]
    notes: "This table preserves what the assigned sources disclose and flags unresolved commercial terms instead of estimating them."
    claimRefs: [CP006, CP007, CP009, CP013]
