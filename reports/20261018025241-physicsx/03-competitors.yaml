  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-opacity
      missingEvidence: Public or customer-approved evidence of realized pricing, renewal structure, and post-pilot expansion economics for PhysicsX and named competitors.
      whyItMatters: Packaging and price transparency determine whether PhysicsX can defend margins and expand beyond pilot projects.
      diligencePath: Request price sheets, sample SOW or MSA language, and customer procurement references showing pilot-to-production transitions.
      relatedQuestionRefs: [QP003]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: durability
      missingEvidence: Customer-level retention, expansion, and multi-homing evidence showing whether deployments displace incumbent workflows or sit beside them indefinitely.
      whyItMatters: Competitive durability depends on whether PhysicsX becomes the operating layer or remains an optional accelerator.
      diligencePath: Obtain cohort expansion data, reference calls, and examples of solver budget reallocation after PhysicsX deployment.
      relatedQuestionRefs: [QP005]
    - type: missing-source
      severity: material
      topic: internal-build-economics
      missingEvidence: Source-backed cost or time benchmarks comparing an internal PhysicsNeMo-style build to buying PhysicsX or another external platform.
      whyItMatters: The internal-build alternative is named in retained evidence but not economically bounded, leaving the make-versus-buy edge case unresolved.
      diligencePath: Request buyer interviews or implementation case studies that quantify engineering effort, GPU cost, and time to first production model.
      relatedQuestionRefs: [QP008]
