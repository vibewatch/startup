      - CV008
      - CV009
      - CV011
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Series C 期间的增长信号延续，积压订单顺利转化，平台表现得更像高粘性的软件，而不是项目驱动的重服务业务。
        - 只有当已确认收入、留存和利润率被证明远强于当前公开证据所显示的水平时，当前价格才站得住。
        - 随着经营层面的验证追上叙事，倍数压缩有限。
        - 客户数翻倍、已签约收入翻三倍、团队规模超过 300 人的趋势延续至 2027 年。
      - - 基准
        - 产品质量和工业相关性确实存在，但已报告的增长兑现速度低于估值假设，公开指标仍不完整。
        - 若分母口径没有变得更清晰，这轮融资对新投资者而言在战略上说得通，但价格仍显得昂贵。
        - 部署周期长、客户群透明度有限，上行空间仍要等尽调验证。
        - 公开证据仍支持技术判断，但对经济性说明不足。
      - - 悲观
        - 积压订单持续存在，现有厂商打包竞争性仿真工作流，融资时点收入质量也被证明弱于投资者预期。
        - 如果 $50 million 代理口径反映的是重服务或非经常性活动，而不是可持续的软件收入，入场估值会迅速下修。
        - 转化阻力、客户集中度和稀释条款会共同放大下行风险。
        - 公开第三方评论中已经能看到打包竞争风险和积压订单警示。
    notes: 情景分析是定性的，因为公开来源没有披露足够的收入、利润率或留存细节，无法支撑精确的 DCF 或公开可比公司估值桥接。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV011
      - CV012
      - CV013
