      - number: '3.2'
        title: 产品打包、定价不透明与分销杠杆
        blocks:
          - type: paragraph
            body: >-
              公开的产品打包信息很少。YesPress 报道称，PhysicsX 没有公开价目表，通常先开展一到三个月、由双方共同界定范围的试点；其销售方式更像咨询式、服务辅助的企业销售，而不是透明的自助定价。同时，独立报道将
              Siemens、NVIDIA 和 Applied Materials 描述为战略投资者；它们的生态角色可以通过验证品类、提供算力或渠道，以及把 PhysicsX
              带到更接近工业买方的位置来缩短采用路径。这种杠杆并不会消除竞争，因为部分同一批既有厂商仍掌握客户的传统工作流；但它确实意味着，PhysicsX 进入市场时拥有比典型前沿仿真初创公司更强的分销伙伴。
            claimRefs:
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP013
      - number: '3.3'
        title: 切换成本、多归属与信任态势
        blocks:
          - type: paragraph
            body: >-
              保留证据显示，采用可以从相对少扰动业务流程开始；客户定制模型和工作流投入运营后，反而更难退出。PhysicsX 表示，平台可连接 ANSYS、CATIA、Siemens NX、OpenFOAM 和 Siemens
              Star
              CCM+；官方材料还强调托管、客户云和完全隔离部署，以及客户专属的模型隔离。这些细节降低了买方第一天就拆除既有求解器栈的必要，也支持与现有工具并行使用。不过，随着交付模式、预训练资产和定制调参深入客户团队，价值会从单次求解转向更广泛的运营工作流，实际切换成本也可能上升。
            claimRefs:
              - CP002
              - CP010
              - CP011
              - CP012
              - CP015
      - number: '3.4'
        title: 相对既有厂商和同业应对的持久性
        blocks:
          - type: paragraph
            body: >-
              护城河逻辑看起来合理，但公开记录尚未给出定论。独立评论明确提醒，既有 CAE 厂商正在增加 AI 功能，AI 原生进入者也在持续吸引大额融资，包括报道中的 Neural Concept、Rescale 和
              Luminary Cloud 2025 年融资。这一点很重要：资本形成和既有厂商的反应，可能压缩 PhysicsX 的工作流覆盖仍保持独特的窗口。因此，最强的公开差异化并不只是 PhysicsX 使用
              AI，而是它试图把私有部署、全生命周期覆盖和服务主导的实施整合进一个受治理的系统。由于缺少公开留存、实际定价和扩张队列证据，商品化和竞合风险仍是重要尽调事项，而不是已经解决的问题。
            claimRefs:
              - CP005
              - CP013
              - CP014
