  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开产品验证和融资势头，抵不过公开估值所用分母质量偏弱及商业化阻力。
    data:
      nodes:
        - id: platform-proof
          label: 平台广度
          detail: 贯穿设计、制造和运营的 AI 原生技术栈
        - id: workflow-embed
          label: 工作流嵌入
          detail: 与核心 CAE 工具集成，可以提高切换成本
        - id: growth-signals
          label: 增长信号
          detail: Series C 期间的报道指向收入、客户和团队更快增长
        - id: valuation-anchor
          label: 估值锚点
          detail: 约 $2.4B 估值对应 $300M Series C；公开分母仍不明确
        - id: downside-signals
          label: 下行信号
          detail: 打包竞争风险和积压订单，带来商业化受阻的风险
        - id: recommendation
          label: 建议
          detail: 继续研究 / 偏高
      edges:
        - from: platform-proof
          to: workflow-embed
        - from: workflow-embed
          to: growth-signals
        - from: growth-signals
          to: valuation-anchor
        - from: downside-signals
          to: valuation-anchor
        - from: valuation-anchor
          to: recommendation
        - from: workflow-embed
          to: recommendation
    approximationNotes: 公开证据不足以建立精确估值模型，因此本流程展示的是方向性的投资判断逻辑，而非数值加权。
    claimRefs:
