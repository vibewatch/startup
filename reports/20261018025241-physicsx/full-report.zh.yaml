  - id: TP001
    title: 按替代方案划分的竞争格局
    columns:
      - 替代方案类别
      - 留存证据点名的具体示例
      - 规模或战略信号
      - 目标细分市场 / 采购场景
      - 相对于 PhysicsX 的差异化
      - 证据支持的局限
    rows:
      - - 现有 CAE 套件
        - Siemens Simcenter; Ansys; Dassault Systemes; Altair
        - 值得信赖的求解器与深度客户工作流
        - 已经围绕成熟 CAE 环境开展工作的企业
        - 作为系统记录的仿真深度与已部署工作流
        - 留存证据把 PhysicsX 定位为覆盖更广生命周期的编排平台，而不是又一个求解器
      - - 原生物理 AI 挑战者
        - Neural Concept; Monolith AI; Luminary
        - 该类别的同业仍在获得大额融资
        - 优先采用更快 AI 辅助设计探索的团队
        - PhysicsX 强调平台广度，而不是只加速某一项仿真任务
        - 留存证据池无法证明同业在部署、服务或生命周期覆盖上能与 PhysicsX 匹敌
      - - 云仿真 / 计算平台
        - Rescale; SimScale
        - 云端规模化访问与编排已是成熟替代方案
        - 把仿真基础设施外包或采用弹性计算的买方
        - 更快接入云资源和仿真工作流
        - 留存证据池未显示它们是端到端的私有 LPM 平台
      - - 内部自建路线
        - 基于 NVIDIA PhysicsNeMo 的内部技术栈
        - 对模型、数据和工作流设计拥有最大控制权
        - 具备 ML 与仿真人才的大型工程组织
        - 定制化程度和自主权最高
        - 实施和治理负担由内部承担，供应商软件则可将其抽象掉
      - - 现状流程
        - 按顺序设计 → 仿真 → 分析 → 迭代
        - 已在现有工程组织内部建立信任
        - 希望保留当前求解器与交接流程的保守型买方
        - 采购时无需组织变革
        - PhysicsX 官方材料称这套流程依然缓慢、割裂且只做局部优化
    notes: 各行汇总留存来源点名的替代方案；比较的是解决路线，不是经审计的收入规模。
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP005
      - CP009
