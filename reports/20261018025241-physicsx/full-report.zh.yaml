  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              PhysicsX 不应拿全部工业软件或全部生成式 AI
              来估值。已有证据显示，其核心是把仿真编排、物理模型开发、工程应用和设计、制造、运营全流程集成在一起的企业软件。公司称平台部署在物理系统复杂、开发缓慢且成本高的场景，包括航空航天与国防、半导体、汽车、能源、材料、工业机械和数据中心。因此，纳入的支出应从高保真仿真、CAE
              工作流加速、优化以及学习型物理模型的生产部署预算开始。相邻支出包括 HPC 基础设施、工程数据管理、数字孪生和过程控制应用。主要替代方案是传统数值求解器、现有 CAE
              套件、内部仿真管线、物理原型和工程人力。通用企业 AI、广义产品生命周期管理和无关自动化，除非直接替代上述工作流，否则都应排除。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM009
      - number: '2.2'
        title: 规模证据与边界纪律
        blocks:
          - type: paragraph
            body: >-
              指定公开证据中唯一的数值化市场规模来自 Nexi Fund 的一篇文章：2025 年仿真软件市场为 $26.5 billion，预计 2033 年达到 $70.7 billion，CAGR 为
              13%；范围窄得多的物理 AI 市场则从 2025 年的 $236 million 增长到 2035 年的 $683.5 million。这些数字可用来标记市场边界，不能直接当作可投资
              TAM：抓取的文章没有说明原始发布方、类别定义、地域或方法论，而且两组数据的预测期限不同。自下而上的信号更强但仍不完整：PhysicsX
              报告确认收入翻倍、已签约收入翻三倍、客户数同比增长超过一倍，却没有公布绝对值。指定证据池没有披露价格、合格账户数量、渗透率、合同金额或服务构成，因此 PhysicsX 的 SAM 和 SOM 仍无法确定。
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM015
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              已有证据显示，用户群不只包括专业仿真团队，还覆盖工程师、设计师、技术人员和运营人员；经济买方更可能来自企业工程、产品开发、制造或运营部门。PhysicsX 提供无代码工程应用、不确定性量化、仿真与 AI
              工作台，并接入 ANSYS、CATIA、Siemens NX、OpenFOAM 和 Siemens Star-CCM+
              等工具。这指向一条“落地—扩张”路径：先验证边界清晰的高价值工作流，连接客户仿真数据与真实世界数据，接入既有工具链，再把模型或模板复用于不同项目和产品生命周期阶段。Microsoft
              描述了其在半导体设备原型、Surface 热设计和铜提取中的应用，进一步扩大了潜在用户和工作流范围。公开证据没有证明采购决策权、实施周期、回本周期，或软件、服务、云和算力是否来自同一预算。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              采用动力来自缓慢且昂贵的传统仿真、缩短硬件开发周期的压力、GPU 经济性的改善，以及在投入物理原型前评估更多设计变体的价值。多云和本地部署、CAE
              连接器、数据血缘及安全方面的主张旨在减少企业摩擦，但也暴露出约束：模型质量取决于使用场景和训练数据；输出仍是近似值；关键任务买方需要评估不确定性；接入客户的数据、求解器、安全和验证流程会带来切换与实施成本。一篇独立报道还指出，高保真多物理场训练数据成本高昂，而航空航天和半导体应用几乎容不得错误。就估值而言，市场增长和公司披露的势头支持需求存在，但不能证明部署已标准化、软件利润率可持续，或企业销售周期可以重复。
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 市场规模判断受缺失分母限制
            body: 公司披露的增长支持需求存在，但如果没有绝对收入、客户数、定价和合格账户分母，就无法证明市场份额或渗透率。已发布的类别预测应作为尽调线索，而不是可直接用于估值的 TAM。
            calloutType: risk
            claimRefs:
              - CM011
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争集合比软件品牌清单更广，因为 PhysicsX 试图嵌入完整的工程闭环，而不只是替代一次求解器调用。独立报道提到 Siemens、Ansys、Dassault Systemes 和 Altair
              等值得信赖的既有厂商套件，以及 Neural Concept、Luminary、Monolith AI、SimScale 和 Rescale 等 AI 原生挑战者。保留的官方材料认为，PhysicsX
              的不同之处在于把数据编排、模型开发、应用和覆盖产品生命周期的部署结合起来；因此，它既在与单个厂商竞争，也在挑战按现状串联的工作流和内部自建路径。这使市场在结构上高度分散，买方需要比较工作流覆盖、可信度和集成质量，而不只是原始推理速度。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP009
