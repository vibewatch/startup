            body: >-
              2026 年 6 月 8 日，PhysicsX 宣布完成超额认购的 $300 million Series C，估值约为 $2.4 billion。Temasek 领投，M&G Investments 和
              Intrepid Growth Partners 加入 Applied Materials、Atomico、General Catalyst、July Fund、NGP、NVIDIA、Radius 和
              Siemens 等现有投资者。PhysicsX 表示，Temasek 于 2025
              年首次投资，并支持其国际扩张。披露的投资人组合带来财务和工业信号，但已募集资金不等于可用现金：指定证据池没有证明累计融资总额、老股交易参与、债务、清算优先权、所有权或投资人控制权。
