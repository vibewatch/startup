  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入质量方向上较强，但公开信息仍只有比例
        blocks:
          - type: paragraph
            body: >-
              公开证据显示相对增长强劲，但没有显示绝对规模。独立的 2026 年 6 月报道一致称，公司完成 $300 million Series C，估值约 $2.4 billion；7 月的一篇后续报道称 British
              Business Bank 在同一轮融资中追加 $25 million。与公司有关联的报道表示，确认收入同比翻倍、已签约收入翻三倍；TNW
