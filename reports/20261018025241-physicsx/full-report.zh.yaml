            body: >-
              看多逻辑并不难表述。PhysicsX 将自己定位为 AI 原生工程平台，覆盖仿真管理、模型开发和贯穿设计、制造与运营的生产工作流，并表示平台已经接入 ANSYS、CATIA、Siemens NX、OpenFOAM
              和 Siemens Star CCM+ 等核心工程工具。这种覆盖面，加上战略投资者和来自先进工业的客户，为高价值、强粘性的部署提供了合理基础。反向逻辑是，公开验证的持久软件经济性落后于这一叙事：Dealroom
              的存档资料将业务描述为项目制或长期合同服务，招聘平台资料则同时提示既有仿真厂商的捆绑风险和六个月需求积压。独立估值数据也没有解决已观察到的收入究竟是确认收入、ARR，还是融资时点较宽泛的运行率代理指标。
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: 情景判断更依赖验证里程碑，而非叙事中的上行空间
        blocks:
          - type: paragraph
            body: >-
              乐观情景成立的前提，是 2026 年 6 月的增长信号最终演化为可重复的软件复利：据融资后报道，客户数增至两倍以上，已签约收入增至三倍，团队规模突破 300
              人。基准情景承认产品和投资人联合体的质量，但假设当前价格已经反映了比公开信息更强的留存、利润率和部署证据。悲观情景不主要是公司技术失败，而是商业化进度落后或倍数压缩：如果积压持续、实施周期仍然很长，或既有厂商把可比工作流捆绑进更广泛的
              CAE 套件，当前入场价格就没有多少空间来承受投资判断错误。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 只有完成对经济性、集中度和条款的硬核尽调，决策才应推进
        blocks:
          - type: paragraph
            body: >-
              下一步尽调不是再讲一个工业 AI 故事，而是做一项对账工作。管理层应展示与公开 $50 million 数字对应的确切收入定义、Series C
              前后的确认收入与签约收入拆分，以及按主要行业划分的客户集中度、续约和毛利率数据。在把公开的投后估值视为可与普通股公平入场价格比较的经济数字之前，投资团队还需要拿到 Series C
              的实际优先股堆叠、任何老股交易安排和董事会控制权条款。没有这套材料，公开记录支持的是等待验证里程碑或更好的入场点，而不是仅凭叙事势头给出买入判断。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 入场纪律应围绕验证收紧，而不是围绕叙事
            body: 融资信号很强，但在缺少确认收入、留存、毛利率和集中度硬数据的情况下，公开记录仍不足以支持按 2026 年 6 月公开价格买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV006
          - type: callout
            title: 主要下行风险是执行失误叠加估值倍数压缩
            body: 如果积压拖慢部署，或既有厂商把替代方案捆绑进更广泛的工程套件，估值可能在 PhysicsX 证明足以支撑溢价软件倍数的经济性之前就被压缩。
            calloutType: risk
            claimRefs:
              - CV002
              - CV011
              - CV012
