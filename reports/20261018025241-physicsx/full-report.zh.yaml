  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 论点
      - 证据
      - 哪些事实会改变判断
    rows:
      - - 投资逻辑
        - PhysicsX 覆盖产品全生命周期的仿真、模型开发和工程应用，因此平台叙事具备可信度。
        - 官方主页和平台材料描述了一套贯穿设计、制造和运营的 AI 原生技术栈。
        - 证明客户群可持续多年扩张，并能重复产生高毛利。
      - - 投资逻辑
        - 与主流 CAE 工具集成工作流，提高了部署从试验性项目变成嵌入式应用的概率。
        - PhysicsX 表示其可与 ANSYS、CATIA、Siemens NX、OpenFOAM 和 Siemens Star CCM+ 集成。
        - 展示已规模化投入生产、且服务投入强度较低的标杆客户。
      - - 反向逻辑
        - Series C 定价背后的公开收入分母过于模糊，不足以支撑明确的估值判断。
        - Multiples 记录了 $50 million 和 48.0x，但表示该数字可能是随融资记录的运行率收入或 LTM 收入。
        - 公布与融资日期对应的已确认收入、ARR、毛利率和留存定义。
      - - 反向逻辑
        - 如果现有厂商把替代方案打包销售，或积压订单迟迟无法转化为部署，商业执行仍可能失速。
        - Simplify 强调了 Siemens Simcenter、Ansys 和 Dassault SIMULIA 的打包竞争风险，以及长达六个月的需求积压。
        - 证明积压订单能转化为持续使用的生产客户，且不拖累利润率或造成流失。
    notes: 本表将官方产品声明与独立的商业化、估值信号放在一起；应把它当作投资判断框架，而不是认为所有项目的证据强度相同。
