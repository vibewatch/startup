    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、覆盖范围与商业模式
        blocks:
          - type: paragraph
            body: >-
              PhysicsX 将自己定位为服务工业企业的物理 AI 公司，并把产品定义为覆盖设计、制造和运营的 AI 原生工程平台。平台整合仿真管理、Deep Physics Models
              的开发与部署，以及面向工程师的应用，并接入既有 CAE 工具。公司 2026 年 6
              月公告称，总部位于英国，在伦敦和纽约设有办公室，并正在扩大湾区和新加坡的布局。这支持其全球化企业平台的定位，但指定证据并未证明成立日期、法律实体图谱、定价模式，或软件与服务的收入构成。
