        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据集中在两位创始人身上。Jacomo Corbo 被认定为联合创始人兼 CEO，Robin Tuluie 被认定为创始人兼董事长；独立报道将公司描述为由两名前 Formula 1
              工程师创立。他们的公开角色为围绕仿真和工业工程的创始人—市场匹配叙事提供了可信度，但也使关键人物依赖成为重要尽调问题。指定证据池没有确认更广泛的高管名单、董事会成员、投资人席位、表决安排或继任计划。这些缺失是证据缺口，并不证明这些结构不存在。
