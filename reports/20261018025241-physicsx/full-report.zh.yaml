  - id: FE001
    title: 产品架构图
    type: stack
    summary: PhysicsX 以客户数据和既有 CAE 工作流为基础，叠加仿真编排、模型开发和面向工程师的应用。
    data:
      layers:
        - label: 客户工程项目
          detail: 航空航天、半导体、汽车、材料、能源和数据中心基础设施项目；这些领域的硬件迭代缓慢且成本高。
          outputs:
            - label: Design decisions
            - label: Manufacturing improvements
            - label: Operational optimization
        - label: 数据与仿真输入
          detail: 仿真结果、物理测量、工艺数据、CAD 几何和运行条件共同用于训练与推理。
          modules:
            - label: 仿真数据
            - label: 物理测量
            - label: 工艺 / 运行数据
        - label: Simulation Workbench
          detail: 面向工程工作流，统一处理编排、转换、标注和数据血缘。
          modules:
            - label: 编排
            - label: 2D / 3D 分析
            - label: 数据血缘
        - label: AI Workbench
          detail: 用于开发和部署 Deep Physics Model，并配套优化、基准测试、不确定性量化和主动学习。
          modules:
            - label: DPM 开发
            - label: 基准测试
            - label: 不确定性量化
        - label: 工程应用
          detail: 面向工程师的应用提供无代码优化、流程控制和交互式预测。
          outputs:
            - label: Ai.rplane
            - label: Busway thermal app
            - label: Custom workflow apps
        - label: 部署与集成服务
          detail: 集成覆盖 CAE/CAD 工具，以及 AWS、Azure、混合和本地 HPC 环境；交付团队负责把系统嵌入生产环境。
          modules:
            - label: ANSYS / CATIA / Siemens NX
            - label: OpenFOAM / Star CCM+
            - label: AWS / Azure / 本地
    approximationNotes: 这套架构是根据已披露层级和具名资产做出的读者版综合，不是内部系统图，也不是完整物料清单。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据指向一条从行业定位走向嵌入式项目扩张的企业客户旅程，但留存的披露很少。
    data:
      items:
        - label: 锁定高复杂度工业领域
          actor: PhysicsX GTM 与工业研发负责人
          touchpoints:
            - 航空航天、半导体、汽车、材料和能源是反复被提及的目标行业
            - 买方叙事聚焦于仿真成本高、且对任务至关重要的工程工作流
        - label: 技术评估与数据范围界定
          actor: 仿真、数据与工程团队
          touchpoints:
            - Simulation Workbench 和 AI Workbench 构成初始评估界面
            - 围绕客户私有数据界定领域专属模型的训练范围
        - label: 工作流集成
          actor: 企业工程用户
          touchpoints:
            - 平台集成 ANSYS、CATIA、Siemens NX、OpenFOAM、AWS、Azure 以及混合 / 本地环境
            - 目标是在既有 CAE 和 HPC 工作流中落地，而不是从零开始替换
        - label: 项目部署
          actor: 客户工程与交付团队
          touchpoints:
            - PhysicsX 表示其在客户项目中嵌入式开展工作
            - 第三方来源提及半导体、热学、矿物加工和航空航天应用案例
        - label: 结果与验证
          actor: 客户运营人员或工程负责人
          touchpoints:
            - 公开说法强调更快的设计周期和更广的设计空间探索
            - 现有来源对具体客户结果的独立验证仍然有限
        - label: 跨客户账户与地区扩张
          actor: 商业化负责人和全球客户团队
          touchpoints:
            - 2026 年的报道显示客户数同比增长超过一倍
            - M&G 和 Nexi 描述了更深的客户关系，以及向美国和新加坡扩张
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU007
      - CU012
      - CU013
