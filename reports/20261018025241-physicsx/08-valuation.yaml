          to: workflow-embed
        - from: workflow-embed
          to: growth-signals
        - from: growth-signals
          to: valuation-anchor
        - from: downside-signals
          to: valuation-anchor
        - from: valuation-anchor
          to: recommendation
        - from: workflow-embed
          to: recommendation
    approximationNotes: >-
      The flow shows directional underwriting logic rather than numeric weighting because public
      evidence is insufficient for a precise valuation model.
    claimRefs: [CV001, CV002, CV008, CV009, CV011, CV012]
callouts:
  - calloutType: recommendation
    title: Entry discipline should tighten around proof, not narrative
    body: >-
      The financing signal is strong, but the public record still does not justify a buy call at the
      June 2026 headline price without hard data on recognized revenue, retention, gross margin, and
      concentration.
    claimRefs: [CV001, CV002, CV006]
  - calloutType: risk
    title: The main downside is execution-plus-multiple compression
    body: >-
      If backlog delays deployments or incumbents bundle alternatives into broader engineering suites,
      the valuation can compress before PhysicsX proves the economics needed to defend a premium
      software multiple.
    claimRefs: [CV002, CV011, CV012]
