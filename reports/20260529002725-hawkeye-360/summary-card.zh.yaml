summary:
  headline: >
    HawkEye 360 的战略真实性可见——差异化 RF GEOINT
    能力、实质政府牵引、积压订单和新的公开市场流动性都摆在台面上；但公共部门集中度高、积压质量有附加条件、资本强度大，经常性经济性仍不透明，因此在当前公开估值下更适合观察，而不是买入。
