callouts:
  - calloutType: strength
    title: Direct RF field is still shallow
    body: HawkEye's most credible live direct RF challenge is Unseenlabs; Kleos currently reads more as evidence that the niche is hard to finance than as a vigorous 2026 commercial threat.
    claimRefs: [CP009, CP016, CP043, CP046]
  - calloutType: risk
    title: Substitutes can capture broader budgets
    body: AIS, SAR, EO, and sovereign-build options are more capitalized and already embedded in many operational workflows, so HawkEye's hardest competition is often adjacent rather than direct.
    claimRefs: [CP022, CP029, CP039, CP041, CP042, CP045]
  - calloutType: insight
    title: HawkEye is likely a layer, not a monopoly stack
    body: 'The evidence consistently points to multi-homing: customers blend RF, AIS, SAR, EO, and internal tools instead of choosing one universal vendor for every maritime or ISR task.'
    claimRefs: [CP037, CP038, CP048]
