- id: V-valuation-context
  title: Valuation lenses and denominator discipline
  body: 'The valuation context is unusually noisy because both numerator and denominator can move depending on which source lens an investor adopts. On the numerator side, the market has already produced at least five public marks: roughly $2.4 billion in Payload, roughly $2.42 billion in Reuters/CNA, roughly $2.84 billion in Seraphim, roughly $3.15 billion on GovConWire''s first-day open framing, and roughly $2.97 billion on CompaniesMarketCap near the run date. On the denominator side, Washington Technology cites $117.6 million of 2025 revenue while Satellite Today cites $98.7 million. The filings reconcile those figures by showing $98.743 million of revenue plus $18.917 million from related parties, but that still leaves investors with an uncomfortable question: should HawkEye be valued on total reported revenue, or on the pre-related-party line that more closely resembles a cleaner third-party operating base? The practical result is a very wide screen. Near the run date HawkEye trades
    at about 25.2x total 2025 revenue or about 30.1x the pre-related-party lens, while the IPO pricing lens was closer to about 20.6x and 24.5x, respectively. That spread is why the IPO price looks more defensible than the post-pop/current zone even though none of the marks are obviously impossible for a strategic RF-intelligence story.'
