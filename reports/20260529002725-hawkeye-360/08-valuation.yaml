- id: V-scenarios-and-diligence
  title: Scenario range, thesis-break triggers, and final diligence asks
  body: 'Scenario work should stay deliberately approximate. The bull case assumes HawkEye converts backlog into clean third-party revenue, broadens beyond a handful of government-heavy customers, and proves that more of the model behaves like recurring data subscriptions than like episodic tasking or program work. Under that outcome the market can keep rewarding the name in the mid-to-high 20s revenue multiple zone, which sustains or modestly exceeds the current public mark. The base case is more modest: the company keeps winning and executing, but investors continue to haircut concentration, backlog quality, and economics opacity, leaving the stock closer to the IPO valuation range than the more optimistic trading marks. The bear case is not exotic. A large backlog step-down, budget disruption, customer concentration shock, or evidence that growth is lower-quality than the market hoped could compress the stock toward a BlackSky-or-Spire-like band. That is why the final diligence asks focus
    on the denominator, not the story. Before a stronger call, investors need a revenue bridge, a funded-backlog waterfall, a cleaner cap-table explanation, and proof that the premium is being earned through durable recurring economics rather than simply being granted to a scarce category narrative.'
