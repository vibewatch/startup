  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: economics-opacity
    missingEvidence: The public record still does not disclose product-level gross margin, contribution margin, or a clean subscription-versus-services revenue mix.
    whyItMatters: That gap is what prevents a stronger conclusion on whether HawkEye deserves a software-like premium or only a project-heavy defense-data multiple.
    diligencePath: Request a 2024-2026 revenue and gross-margin bridge by subscriptions, analytics, sovereign programs, services, and related-party activity.
    relatedQuestionRefs:
    - QV022
  - type: private-evidence-only
    severity: material
    topic: cap-table-opacity
    missingEvidence: Public filings do not give a simple post-IPO fully diluted share-count bridge, lockup cadence, or an investor-friendly explanation of how Series E preference overhang resolves after listing.
    whyItMatters: That missing cap-table detail affects per-share dilution risk, effective float, and whether downside asymmetry remains for new public investors.
    diligencePath: Ask management or IR for a post-IPO fully diluted cap table, lockup schedule, and explicit conversion/preference cleanup mechanics for Series E holders.
    relatedQuestionRefs:
    - QV031
  - type: missing-source
    severity: material
    topic: backlog-quality
    missingEvidence: The company discloses total backlog but does not publish a funded-versus-cancellable bridge, option mix, or customer-level burn schedule.
    whyItMatters: Investors can easily over-credit backlog if a meaningful share is ceiling value or can be terminated without substantial economic penalty.
    diligencePath: Request a backlog waterfall by funded status, cancellation rights, options, customer, and expected recognition timing.
    relatedQuestionRefs:
    - QV021
    - QV032
    relatedTableRefs:
    - TV003
    - TV006
  - type: enumeration-incomplete
    severity: material
    topic: comparable-set-coverage
    missingEvidence: The retained comparable set is directional, but still lacks a true public RF-GEOINT pure-play and lacks enough clean disclosed private transactions to bound the premium tightly.
    whyItMatters: That gap limits confidence in any single “right” multiple and is why the chapter keeps a range-based stance instead of false precision.
    diligencePath: Keep refreshing public peer and transaction screens while asking management for win-rate, recurrence, and margin evidence that would justify selecting the upper or lower end of the range.
    relatedQuestionRefs:
    - QV013
    - QV017
    - QV019
    relatedTableRefs:
    - TV004
