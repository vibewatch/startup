- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'THESIS: RF GEOINT scarcity and strategic government demand justify a real premium'
    - Backlog above $300M, majority-government revenue, and repeated defense traction support strategic relevance
    - Would strengthen if customer concentration falls and recurring third-party revenue becomes easier to underwrite
  - - 'THESIS: The IPO de-risked near-term capital structure'
    - IPO raised $416M gross, acquisition debt was repaid, and a $125M revolver extended liquidity
    - Would strengthen if management shows no meaningful dependence on further equity for near-term execution
  - - 'THESIS: The IPO pricing lens was not obviously irrational'
    - The ~$2.4-$2.42B lens screens rich but still closer to BlackSky/Spire than the later post-pop marks
    - Would improve if investors get a clean 2026 revenue bridge that lowers the implied multiple
  - - 'ANTI-THESIS: The denominator is unstable'
    - Public sources cite both $98.7M and $117.6M for 2025 revenue, and the difference materially changes valuation math
    - Would ease if management standardizes the revenue bridge and clarifies what investors should use for comp purposes
  - - 'ANTI-THESIS: Backlog sounds strong but is not the same as funded hard revenue'
    - Filings say backlog can include cancellable value and unused ceiling on some contracts
    - Would ease if the company publishes funded backlog, cancellation rights, and burn schedule detail
  - - 'ANTI-THESIS: Current public valuation leaves little room for error'
    - At the May 28 market cap HawkEye sits above Spire and BlackSky on trailing multiple without Planet-like recurring-economics disclosure
    - Would ease with either a lower stock price or materially better evidence on margins, recurrence, and diversification
  notes: The anti-thesis is mostly valuation-sensitive rather than existential; the same business can be interesting at a lower price or with better disclosure.
