  - CV021
  - CV037
  - CV040
  - CV046
  - CV047
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue bridge
    - Bridge from $98.743M pre-related-party revenue to $117.660M total 2025 revenue
    - Without a clean denominator, valuation arguments can be manipulated by lens choice
    - 'Management / CFO: provide GAAP and third-party operating revenue bridge'
  - - Backlog waterfall
    - Funded vs cancellable backlog, option content, and recognition timing
    - Investors need to know how much of the $302.7M backlog is truly hard visibility
    - 'Management / contracts: provide backlog waterfall by customer and funding status'
  - - Revenue mix and margin
    - Subscription, analytics, sovereign program, services, and related-party margin split
    - This is the core question behind whether HawkEye deserves a software-like premium
    - 'Management / finance: provide product-line gross margin and recurring mix history'
  - - Cap table and float
    - Fully diluted post-IPO share count, lockup cadence, and Series E cleanup mechanics
    - Public investors need to understand dilution and any leftover downside asymmetry
    - 'IR / counsel: deliver cap-table bridge and lockup schedule'
  - - Customer diversification plan
    - Concrete path to reduce single-customer reliance
    - A premium multiple is fragile if one customer can move the story materially
    - 'Management / sales: show diversification pipeline and renewal schedule'
  - - Budget resilience
    - Sensitivity of revenue and backlog to U.S. budget timing, CRs, and allied procurement delays
    - Government-heavy premium valuations compress quickly when procurement timing slips
    - 'Management / FP&A: provide downside sensitivity and recent procurement-cycle data'
  notes: These asks are intentionally valuation-critical; each one directly affects either the denominator, the multiple, or the downside path.
