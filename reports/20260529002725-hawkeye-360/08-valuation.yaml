- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Backlog quality deterioration
    - Backlog drops sharply without equivalent booked replenishment or funded-detail support
    - Undercuts the argument that visibility justifies a premium public multiple
    - Re-rate immediately toward bear-case valuation band
  - - Concentration remains extreme
    - A single customer stays near dominant share of revenue or receivables with little diversification progress
    - Makes the premium fragile to one procurement decision
    - Keep recommendation at track or downgrade on any operating wobble
  - - Margin / mix disappointment
    - Public results suggest project-heavy or service-heavy economics rather than recurring data economics
    - Breaks the case for paying above BlackSky/Spire-like multiples
    - Cut fair-value band and require new diligence before adding exposure
  - - Liquidity starts tightening again
    - Revolver draws or covenant pressure emerge despite IPO proceeds
    - Signals the IPO did not truly solve funding risk
    - Treat as a thesis break until capital path is reset
  - - Space-data multiple compression returns
    - Public peers de-rate again on weak execution or budget pressure
    - Shows HawkEye is not insulated from broader sector re-pricing
    - Avoid averaging in above disciplined entry ranges
  notes: Each trigger is designed to be monitorable from public reporting or widely covered contract and market signals.
  claimRefs:
