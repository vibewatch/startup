company:
  name: HawkEye 360
chapter:
  number: 8
  title: Valuation
summary: HawkEye 360's public-market valuation is defensible only on a disciplined, contradictory-lens basis. The IPO itself priced at a still-premium but arguable ~$2.4-$2.42 billion range, while post-pop and current public screens moved into a fuller ~$2.97-$3.15 billion zone that implies about 25x-30x 2025 revenue depending on whether investors use total revenue or the pre-related-party lens. Backlog, differentiated RF GEOINT positioning, and strategic government relevance support upside, but concentration, backlog-quality caveats, economics opacity, and hostile public-space precedent keep the recommendation at TRACK / MONITOR rather than BUY on current public evidence.
sections:
- id: V-financing-context
  title: Financing context and recommendation discipline
  body: 'HawkEye 360 has enough public evidence to support a real investment thesis, but not enough to support an unqualified buy recommendation at the current public mark. The thesis starts with differentiated RF GEOINT product positioning, visible government traction, and a backlog base that is large enough to matter. HawkEye also came public from a position of relative strength: the IPO raised $416 million gross, the company used proceeds to clean up acquisition debt, and the new revolver extends liquidity. That combination is better than the balance-sheet stories many recent space listings brought to market. The anti-thesis is what keeps the call price-sensitive. Revenue is already debated in public through two different denominators, customer concentration is high, backlog is not the same thing as funded irrevocable revenue, and the public record still does not cleanly separate software-like subscriptions from project-heavy government work. Those gaps matter because the stock is no
    longer priced like a distressed or experimental space name. At roughly $2.97 billion of market cap near the run date, HawkEye sits above BlackSky and Spire on trailing multiple, even before giving full credit to the harsher core-revenue lens. The right recommendation is therefore TRACK / MONITOR with medium confidence: the business looks strategically real, but the current price leaves little margin for underwriting error without more disclosure or a cheaper entry.'
