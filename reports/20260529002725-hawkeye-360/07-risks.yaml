- id: mitigations-and-thesis-breakers
  title: The thesis survives if diversification outruns concentration and if execution stays ahead of financing pressure
  body: 'The right way to underwrite HawkEye 360 is to treat mitigation quality as dynamic rather than absolute. There are clear positives: a successful IPO, a longer-dated revolver, multiple agency relationships, launches on both SpaceX and Rocket Lab, and acquisitions that deepen the moat around RF sensing and signal processing. None of those, however, make the company low risk. They simply buy time and options. The thesis remains investable only if several monitors hold at once: federal renewals must continue without a sharp concentration shock, launch cadence must stay intact without a visible reliability event, export and debris compliance must remain routine rather than escalatory, and the Maxar and ISA workstreams must improve product performance faster than they increase operating complexity. The clean thesis-break is therefore not a single headline but a combination of events: a renewal or procurement slip that coincides with launch or integration stress, or a regulatory action
    that lands while leverage and capex still matter. If those events cluster, the company’s backlog, margin confidence, and valuation premium can compress quickly.'
