- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Government concentration
    - Top-program disruption or renewal miss
    - Any major program delay, recompete loss, or disclosed drop in government mix without offsetting commercial growth
    - Recut backlog confidence and assume lower valuation multiple until mix improves.
  - - Budget and procurement friction
    - Extended DoD funding instability
    - A new continuing-resolution cycle or evidence of delayed award timing on active HawkEye programs
    - Delay underwriting of near-term growth and demand tighter contract disclosure.
  - - Launch and constellation execution
    - Mission anomaly or elongated commissioning
    - Failed launch, lost spacecraft, or materially delayed commissioning on a new cluster
    - Move to downside case and ask for insurance, spare capacity, and revisit-impact analysis.
  - - Regulatory / export compliance
    - Named enforcement or material licensing friction
    - Export-license denial pattern, sanctions issue, or application delay that affects deployment or sales
    - Lower confidence in international growth and increase execution discount rate.
  - - Leverage and capital intensity
    - Balance-sheet stress
    - Need for new debt or equity earlier than expected, covenant amendment, or materially higher borrowing cost
    - Treat capital structure as a core risk, not a bridge, and re-price dilution risk.
  - - Integration and talent execution
    - Post-acquisition slippage or technical attrition
    - Missed integration milestones, key technical departures, or slower-than-promised product delivery
    - Cut moat confidence and assume margin pressure until platform integration stabilizes.
  notes: Kill criteria are designed to convert the risk chapter into investability discipline, not to restate generic concerns.
