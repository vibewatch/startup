  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: platform-assurance
    missingEvidence: Public uptime history, incident frequency, and service-commitment metrics for the RF platform and analyst tooling.
    whyItMatters: Without resilience metrics, investors cannot tell whether mission-critical workflows are protected by mature operations or by customer tolerance.
    diligencePath: Request incident logs, uptime/SLA history, and customer-facing service credits for the last 24 months.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: launch-insurance
    missingEvidence: Current launch insurance coverage, spare-satellite posture, and reserve plan for failed launches or commissioning losses.
    whyItMatters: Constellation businesses can absorb normal launch cadence risk, but underwriting changes sharply if a failed mission would force emergency capital or reduce revisit quality.
    diligencePath: Request current insurance limits, self-insurance policy, and spare-capacity plan by cluster and orbit.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: agency-concentration
    missingEvidence: Agency-level revenue, renewal timing, option-year schedule, and recompete exposure behind the 61% U.S. revenue mix and reported backlog.
    whyItMatters: Aggregate government mix does not reveal whether one program cliff could reset revenue or covenant confidence in a single year.
    diligencePath: Request 2025 and 2026 revenue by agency/program, top-contract end dates, recompete calendar, and termination-for-convenience exposure.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: minor
    topic: export-license-churn
    missingEvidence: Public disclosure on export-license renewal cadence, denied applications, or screening exceptions.
    whyItMatters: The prospectus frames export infrastructure as a moat, but investors still need to know whether compliance load is increasing or whether license friction is growing.
    diligencePath: Request license inventory aging, denial rate, average processing time, and material country restrictions by program.
    relatedQuestionRefs:
    - QR007
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: integration-retention
    missingEvidence: Post-acquisition integration scorecard covering ISA and Maxar milestone delivery, key-person retention, and unified-platform roadmap dates.
    whyItMatters: The acquisitions are central to product breadth, so missed integration milestones would transmit into delivery risk, margin pressure, and weaker moat claims.
    diligencePath: Request 12-month integration KPI dashboard, key technical leader retention, and delayed-workstream list.
    relatedQuestionRefs:
    - QR017
    - QR027
    relatedTableRefs:
    - TR004
