  rows:
  - - Export controls and sanctions screening
    - United States and allied export markets
    - Live operating requirement
    - medium
    - high
    - Large export-license base, government-oriented compliance posture, and formal screening regimes
    - License friction, screening errors, or country restrictions could slow deals or limit product delivery
    - Request export-license aging, denial rates, and sanctioned-jurisdiction exposure by program.
  - - Government-contract debarment or materially adverse contract action under the revolver
    - United States
    - Embedded in credit-agreement default package
    - low to medium
    - high
    - Public-market liquidity, longer-dated revolver, and visible program diversity
    - A contract action can transmit into financing optics and covenant stress as well as revenue loss
    - Review top-contract terms, cure rights, termination-for-convenience language, and lender amendment flexibility.
  - - Orbital debris and spacecraft application compliance
    - United States
    - Active FCC application gate
    - medium
    - medium to high
    - ODM planning, NASA DAS support, and prior on-orbit experience
    - New satellites still require application work and disclosure packages that can delay launches or mission expansion
    - Review current application pipeline, waiver requests, and timeline variance by mission.
  - - Privacy and legal-process handling obligations
    - United States and website users
    - Public legal policy only
    - low
    - medium
    - Published privacy policy and terms of use
    - The public legal pack is generic and does not reveal product-grade compliance or customer-data assurance boundaries
    - Request product-specific privacy, security, and incident-handling addenda rather than website-only policies.
  - - Public benefit corporation governance alignment
    - Delaware / public markets
    - Live after IPO
    - low to medium
    - medium
    - Clearly disclosed governance model and board oversight
    - Stakeholder-balancing duties can reduce pure shareholder-maximization if strategic and financial interests diverge
    - Review charter language, board process, and any situations where public-benefit duties override investor economics.
  notes: Rows are ordered by residual severity, not by legal category count; the register focuses on public issues most likely to transmit into backlog, financing, or valuation.
