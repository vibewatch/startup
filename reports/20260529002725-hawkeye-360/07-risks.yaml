- id: operational-and-technical-risk
  title: Constellation, launch, and product-performance risk rise as the RF stack gets broader
  body: 'The operating thesis assumes HawkEye 360 can keep a complex space-and-software system reliable while broadening product scope. Public material supports that complexity. The constellation runs in three-satellite clusters, covers a wide RF range, and promises frequent revisit, while the mission pages position the product in GNSS interference and air-defense monitoring workflows where customers care about timeliness, exact geolocation, and confidence under contested conditions. Those requirements make constellation health and on-orbit processing quality economically important. Public disclosures also show that the roadmap is not static: Cluster 14 entered commissioning in 2026, a 2025 Rocket Lab mission carried an experimental satellite, the Maxar RF deal added wideband scanning satellites and archive assets, and ISA brought algorithms, FPGA firmware, and edge and cloud processing into the stack. That broader stack is strategically attractive, but it increases integration and reliability
    burden. SpaceNews’ reporting that intermittent land-based radars remain a harder geolocation problem is therefore important: the next incremental improvement is technically harder than the first.'
