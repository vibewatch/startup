- id: module-integration-and-differentiation
  title: Product integration is increasingly about combining precise geolocation, scanning, processing, and analyst workflow
  body: >-
    The most important product-development story is that HawkEye 360 is broadening from precise geolocation
    into a fuller RF exploitation stack. RFGeo still anchors the commercial surface by converting detections
    into GIS-friendly geolocations, but RFIQ expands collection flexibility with raw I/Q data across a very
    wide frequency range, Mission Space packages collection and analytics into a usable analyst console, and
    the mission suites translate these technical primitives into specific defense workflows. The two recent
    acquisitions sharpen that picture. The Maxar RF Solutions transaction adds regional wideband scanning,
    two on-orbit satellites, and a 1.4-40 GHz archive that complements HawkEye 360's precise geolocation.
    The ISA acquisition adds algorithms, edge and cloud processing, payload design, and FPGA firmware that
    should deepen the processing layer rather than just the orbital layer. Taken together, the public record
    supports differentiation based on stack integration: cluster geolocation, wider-band discovery, analyst
    software, shareable unclassified outputs, and mission-specific automation are being combined into one
    operating model.
