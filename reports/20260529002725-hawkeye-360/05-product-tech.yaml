      label: Space collection layer
      detail: Clusters of three satellites collect RF emissions globally, with payload evolution from Pathfinder to newer cluster designs and experimentation around Kestrel and future concepts.
    - id: payload-and-geolocation
      label: Payload and geolocation layer
      detail: SDR plus RF front-end hardware feeds TDOA, FDOA, and patented blind coherent integration workflows for emitter localization and characterization.
    - id: ground-processing
      label: Ground and cloud processing layer
      detail: Secure cloud processing scales raw collection handling, signal processing, analytics generation, and mission-specific product preparation.
    - id: product-services
      label: Product and mission-services layer
      detail: RFGeo, RFIQ, Mission Space, Maritime Intelligence, Air Defense Monitoring, GNSS Interference Detection, and Communications Mapping sit on top of the common processing stack.
    - id: delivery-integration
      label: Delivery and integration layer
      detail: Daily downloads, direct delivery, cloud-based access, analyst software, GIS outputs, and customer-facing APIs connect products into user workflows.
