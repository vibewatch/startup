company:
  name: HawkEye 360
chapter:
  number: 5
  title: Product & Technology
summary: >-
  HawkEye 360's public product surface supports a real multi-layer RF-intelligence stack rather than a single
  geolocation feed. The company visibly delivers RFGeo geolocation products, RFIQ raw I/Q collection,
  Mission Space analytics software, and mission-specific workflows for maritime, radar, GNSS, and
  communications use cases on top of a tri-satellite constellation, cloud processing, and API-based order
  fulfillment. Differentiation is strongest in combining precise cluster-based geolocation with wider-band
  scanning and analyst tooling, while the main diligence gaps remain reliability metrics, security
  accreditations, current latency SLAs, and how cleanly Maxar RF Solutions and ISA are integrated into one
  operating platform.
sections:
- id: delivered-products-and-commercial-surface
  title: HawkEye 360 delivers a layered RF-intelligence product stack, not a single feed
  body: >-
    HawkEye 360's public product surface is broad enough to support a real platform thesis. The company now
    presents mission-specific offerings for spectrum monitoring, maritime intelligence, air defense radar
    monitoring, GNSS interference detection, and communications mapping, while the older core-product layer
    still matters because RFGeo remains the normalized geolocation product, RFIQ exposes raw I/Q data for
    deeper signal exploitation, Mission Space is the analyst-facing software layer, and Vessel Custody ID adds
    an AI-driven maritime identity thread. The delivery model is also concrete rather than abstract: the
    technology page describes daily downloads, direct delivery, cloud-based access, and customer-facing APIs,
    while the RFGeo launch page says outputs are standardized for GIS tools and the signal-catalog expansion
    page says customers can buy historical archives, new collections, or regional-awareness subscriptions.
    That combination means HawkEye 360 is selling operational RF workflow outcomes in multiple packaging
    modes, not just isolated satellite passes.
