- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Tri-satellite collection clusters
    - Collect simultaneous RF observations that enable geolocation
    - Formation flying, timing synchronization, attitude control, launch cadence
    - Cluster health and geometry are critical; degraded formation degrades precision
  - - RF payload and antenna stack
    - Sense target bands from VHF through higher microwave bands depending on payload path
    - SDR, RF front end, antennas, payload evolution across bus generations
    - Public payload coverage is broad but detailed per-generation support remains incomplete
  - - Geolocation and signal-processing algorithms
    - Convert raw captures into emitter locations and signatures via TDOA, FDOA, BCI, and related analytics
    - Proprietary algorithms, patents, processing infrastructure, and signal models
    - Weak, intermittent, or ambiguous emitters can still be difficult to localize
  - - Ground cloud processing
    - Process raw collections, scale analysis, and generate subscription products
    - Secure cloud environment, compute, storage, and operational pipelines
    - Public architecture omits redundancy topology, recovery targets, and tenancy detail
  - - Analyst software and APIs
    - Visualize, order, and integrate collections through Mission Space and customer-facing APIs
    - Collections API, direct delivery, cloud access, analyst workflows, GIS interoperability
    - No public developer docs or uptime commitments are disclosed
  - - Wideband scanning layer from Maxar RF Solutions
    - Scan gigahertz of bandwidth and map active frequencies regionally
    - Charlie and Delta satellites, acquired IP, archive, and product integration work
    - Integration may be harder than the press release suggests
  - - ISA processing layer
    - Add advanced algorithms, edge processing, cloud processing, payload design, and FPGA expertise
    - Merged teams, software integration, and shared roadmap discipline
    - Integration could introduce latency, product overlap, or execution drag before it adds value
  notes: This table reflects the public operating model rather than an internal systems diagram.
