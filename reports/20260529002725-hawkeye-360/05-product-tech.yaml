tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user / buyer
  - Delivery form
  - Differentiation
  - Diligence gap
  rows:
  - - RFGeo
    - Defense, intelligence, maritime, border, and telecom analysts
    - Geolocated RF analytics in standardized GIS-friendly output plus archive or new collections
    - Converts RF detections into a new geospatial layer instead of only raw sensor data
    - Current per-signal accuracy, latency, and pricing are not public
  - - RFIQ
    - SIGINT, EW, and spectrum analysts who need rawer collection
    - Taskable unprocessed I/Q data with flexible collection modes
    - Extends HawkEye beyond pre-packaged detections into signal discovery and custom analysis
    - Public benchmarks for bandwidth, latency, and tooling interoperability are missing
  - - Mission Space Platform
    - Analyst teams and mission operators
    - Analyst software environment for ingestion, visualization, and workflow automation
    - Bridges data collection and exploitation so non-expert users can work RF GEOINT faster
    - No public API or deployment architecture pack for the platform itself
  - - Spectrum Monitoring
    - Defense, EW, and national-security buyers
    - Taskable space-based I/Q collections for radar, comms, and navigation signals
    - Secure unclassified access to a taskable RF layer without forward ISR deployment
    - Exact tasking queueing rules, revisit commitments, and product SLAs are not public
  - - Maritime Intelligence plus Vessel Custody ID
    - Naval intelligence, coast guard, and maritime-security users
    - RF analytics, AIS correlation, dark-vessel workflows, and AI-driven custody tracking
    - Adds identity continuity and deception exposure rather than only vessel detection
    - False-match rates and custody-confidence calibration are not public
  - - Air Defense Radar Monitoring
    - Air-defense analysts, ISR planners, and EOB teams
    - Continuous radar detections, geolocation, characterization, hotspots, and tasking guidance
    - Turns radar activity into operationally relevant deployment and escalation monitoring
    - Public precision and missed-detection rates for mobile or intermittent radars are absent
  - - GNSS Interference Detection
    - Defense, infrastructure, and transport-security users
    - Recurring detection and geolocation of jammers and spoofers
    - Provides broad-area early warning without customer-owned sensor infrastructure
    - No public sensitivity thresholds or response-time commitments
  - - Communications Mapping
    - Border, intelligence, and counter-smuggling users
    - Detection, classification, and geolocation of PTT radios and satellite phones
    - Uses tri-satellite collection to reduce airborne-ISR dependence for wide-area surveys
    - Public support matrix by waveform family is incomplete
  notes: Public matrix based on mission pages, product launches, and analyst-platform announcements as of the run date.
