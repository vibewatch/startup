- id: product-and-technical-risks
  title: The public record shows real technical differentiation, but also real geolocation, integration, and competition risk
  body: >-
    The strongest adverse product signal is not that HawkEye 360 lacks technology; it is that the next set of
    technical problems are harder than the first set. SpaceNews reports that intermittent land-based radars
    remain a tougher geolocation challenge, exactly the kind of target where revisit geometry, signal
    weakness, and ambiguous emitter behavior can erode confidence. The same article also frames the market as
    a commercial battleground, with growing international RF competitors and even SAR providers moving into
    adjacent maritime-intelligence territory. Internally, HawkEye 360 is also increasing integration risk by
    combining its original cluster-geolocation model with Maxar's scanning mission, ISA's processing and FPGA
    heritage, new maritime AI modules, and experimental downlink and satellite designs. The company looks more
    differentiated precisely because the stack is becoming broader; investors should also assume execution gets
    harder as product breadth, latency expectations, and assurance requirements rise.
