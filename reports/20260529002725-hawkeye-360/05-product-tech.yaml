- id: constellation-ground-and-ai-architecture
  title: The architecture is publicly legible from satellite cluster geometry through cloud processing and AI analytics
  body: >-
    HawkEye 360's official technology page and external technical references together reveal more architecture
    than a normal defense-tech homepage. Officially, the company says more than thirty satellites operate
    about 500 km above Earth in clusters of three, that cluster-based TDOA and FDOA geolocate emitters, that
    raw collections are processed in a secure cloud environment, and that AI-enabled analytics add waveform
    analysis, anomaly detection, and multi-domain fusion before products are delivered by cloud access or API.
    External technical references fill in the hardware picture: eoPortal describes Pathfinder's SDR payload,
    70 MHz to 6 GHz tuning with Ku-band extension to roughly 18 GHz, a NEMO-derived Pathfinder platform near
    13.4 kg in 575 km sun-synchronous orbit, and later evolution toward larger buses. The patent set matters
    because it shows HawkEye 360's differentiation is not only orbital geometry but also blind coherent
    integration methods that aim to geolocate weak or partially unknown signals without relying on classic
    direction-of-arrival assumptions.
