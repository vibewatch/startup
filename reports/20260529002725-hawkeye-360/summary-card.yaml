  topStrengths:
    - >-
      HawkEye 360 has a differentiated RF GEOINT stack built around 30+ satellites in three-satellite clusters,
      cluster-based TDOA/FDOA geolocation, raw I/Q collection, and analyst-facing software/APIs.
    - >-
      Government traction is real, not pilot-only: the company disclosed a $98.8M fourth-year Navy renewal, a 23-month
      NRO expansion, and a European Ministry of Defense award worth up to $75M.
    - >-
      The business now has public-company scale signals, including $117.660M of 2025 total revenue, $2.673M of net
      income, and $302.719M of year-end backlog.
    - >-
      Balance-sheet flexibility improved materially after the IPO via roughly $377.9M of estimated net proceeds and a
      new $125M revolver extending to 2031.
    - >-
      Capability breadth widened further through the Maxar RF assets and ISA acquisition, adding wideband scanning,
      advanced algorithms, payload design, and edge/cloud processing.
  topRisks:
    - >-
      Customer concentration is high: U.S. customers represented 61% of 2025 revenue, one customer represented about 63%
      of revenue for the January-to-September 2025 period, and two customers represented about 74% of receivables at
      September 30, 2025.
    - >-
      Backlog is not equivalent to hard committed revenue because public filings say it includes cancellable value and
      unused ceiling on certain single-award IDIQs.
    - >-
      The company remains capital intensive despite the IPO: 2025 operating cash flow and free cash flow were negative,
      constellation expansion continues, and the revolver adds covenant discipline plus variable-rate exposure.
    - >-
      Public disclosure does not cleanly separate subscription economics from services, sovereign programs, and
      related-party revenue, limiting confidence in recurring-quality underwriting.
    - >-
      Competitive pressure is broadening beyond pure-play RF peers to AIS, SAR, EO, and sovereign-build alternatives
      that can satisfy adjacent mission budgets.
    - >-
      Government procurement timing, export-control compliance, and launch / integration execution can all slow
      conversion even when mission demand is strong.
  unresolvedGaps:
    - >-
      Recurring-revenue bridge: public filings still do not split revenue and margin cleanly across subscriptions,
      services, sovereign programs, and related-party activity.
    - >-
      Backlog quality: investors still need a funded-versus-cancellable backlog waterfall and a clearer view of how much
      IDIQ ceiling is realistically convertible.
    - >-
      Customer concentration after the IPO: the public record does not yet show current top-customer dependence,
      customer-count disclosure, or retention metrics such as NRR / GRR / churn.
    - 'Unit economics: CAC, payback, product-level gross margins, and realized pricing by product remain undisclosed.'
    - >-
      Capital structure / dilution: public materials do not fully bridge fully diluted share count, lockup overhang
      cadence, and final Series E cleanup after listing.
    - >-
      Replacement cadence and long-term capex: the public set still lacks a clean satellite refresh and
      constellation-maintenance capital roadmap.
