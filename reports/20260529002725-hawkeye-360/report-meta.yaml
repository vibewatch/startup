summary:
  headline: >
    HawkEye 360 looks strategically real—differentiated RF GEOINT capability, meaningful government
    traction, backlog, and new public-market liquidity are all visible—but concentrated public-sector
    exposure, backlog-quality caveats, capital intensity, and still-opaque recurring economics justify
    a track stance rather than a buy call at the current public valuation.
