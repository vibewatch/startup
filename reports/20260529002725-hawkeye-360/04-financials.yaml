- id: TI007
  title: Customer Concentration and Contract Quality Table
  columns:
  - Indicator
  - Public Readout
  - Why It Matters
  - Quality Signal
  - Diligence Ask
  rows:
  - - U.S. customer mix
    - 61% of 2025 revenue
    - Confirms core demand but also ties performance to government budget and procurement dynamics
    - Positive demand signal; concentration risk still material
    - Break out U.S. revenue by agency, contract form, and funded status
  - - Japan mix
    - 16% of 2025 revenue
    - Shows the international business is meaningful and not just anecdotal
    - Helpful diversification but still one-country concentration
    - Disclose top Japanese programs, renewal profile, and pricing model
  - - Other non-U.S. mix
    - 23% of 2025 revenue in aggregate
    - Supports allied-market opportunity beyond Japan
    - Diversifies demand somewhat but lacks customer count detail
    - Provide revenue by top five non-U.S. customers and countries
  - - Single-customer concentration
    - ~63% of revenue for Jan-Sep 2025
    - A single program or buyer can materially move results, renewals, and receivables
    - Adverse underwriting signal
    - Identify the customer, contract duration, renewal risk, and replacement pipeline
  - - Backlog definition
    - Includes cancellable value and some single-award IDIQ ceiling
    - Headline backlog overstates hard-committed future revenue if read too literally
    - Mixed quality signal
    - Provide funded backlog, unfunded ceiling, and cancellation sensitivity analysis
  notes: The table combines explicit mix disclosures with filing caveats about concentration and backlog composition.
