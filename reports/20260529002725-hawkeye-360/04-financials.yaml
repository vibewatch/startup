  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: revenue-definition
    missingEvidence: External summaries cite both $98.7M and $117.6M of 2025 revenue because public coverage does not consistently distinguish core revenue from total revenue including related-party revenue.
    whyItMatters: This affects growth comps, gross-margin calculations, and any attempt to benchmark HawkEye 360 against pure-play data or software businesses.
    diligencePath: Ask management for a bridge from non-related-party revenue to total GAAP revenue, including which customers or entities are treated as related parties and whether investors should model them as durable demand.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI013
  - type: private-evidence-only
    severity: blocking
    topic: pricing-realization-and-mix
    missingEvidence: No public source discloses realized pricing by product, customer, or delivery mode, nor the split among subscriptions, services, bespoke sovereign systems, or hardware-linked programs.
    whyItMatters: Without realized pricing and revenue mix, investors cannot determine whether growth is coming from repeatable data products, lower-margin services, or lumpy custom programs.
    diligencePath: Request 2024-2026 revenue mix by product family, top-program realized pricing, average contract duration, and renewal cohorts for subscription or recurring data products.
    relatedQuestionRefs:
    - QI001
    - QI003
    - QI025
    - QI027
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-and-margins
    missingEvidence: Public filings do not disclose CAC, sales efficiency, payback period, churn, product-level gross margins, or D&A allocation between collection infrastructure and operating expense buckets.
    whyItMatters: These metrics are necessary to test whether HawkEye 360 is becoming more software-like as it scales or remains capital- and service-heavy beneath the surface.
    diligencePath: Request cohort retention, sales productivity, win-rate by product, gross margin by major offering, and a bridge from adjusted EBITDA to free cash flow with capex and satellite-refresh assumptions.
    relatedQuestionRefs:
    - QI007
    - QI009
    - QI016
    - QI017
    - QI027
  - type: missing-source
    severity: material
    topic: backlog-quality
    missingEvidence: The filing defines backlog broadly enough to include cancellable value and single-award IDIQ ceiling, but it does not publish a bridge for funded backlog, unfunded ceiling, customer concentration, or renewal assumptions.
    whyItMatters: A $302.7M backlog sounds highly supportive, but its revenue quality could vary materially depending on how much is funded, cancellable, or concentrated in a small set of programs.
    diligencePath: Request a backlog waterfall by customer, product, funded status, cancellation rights, burn-off timing, and options versus base awards.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI026
  - type: private-evidence-only
    severity: material
    topic: post-ipo-runway
    missingEvidence: Public data stops short of disclosing current cash after IPO close, whether any revolver has been drawn, the expected capex profile for constellation and ground infrastructure, and post-IPO runway sensitivity.
    whyItMatters: The IPO and revolver likely removed immediate liquidity stress, but investors still need to know whether future platform expansion or M&A keeps HawkEye 360 financing-dependent.
    diligencePath: Request current cash, revolver draw status, quarterly covenant forecast, planned capex for satellites/ground systems, and a base/upside/downside runway model through 2027.
    relatedQuestionRefs:
    - QI018
    - QI021
    - QI023
    - QI024
    - QI027
