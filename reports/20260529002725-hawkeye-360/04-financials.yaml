- id: TI004
  title: Capital Adequacy and Debt Table
  columns:
  - Item
  - Public Value / Term
  - Date
  - Implication
  - Diligence Ask
  rows:
  - - Year-end cash and working capital
    - $92.686M cash; $127.878M working capital
    - 12/31/2025
    - Shows meaningful liquidity before the IPO, but not enough to make financing irrelevant after the ISA acquisition and planned growth investments
    - Reconcile year-end cash to cash at IPO close and current cash today
  - - Series E preferred equity
    - 5,237,357 shares at $18.86 = $98.8M gross
    - Dec. 2025-Feb. 2026
    - Late-stage private capital funded part of the ISA transaction and bought time to reach the IPO
    - Provide full cap table, liquidation preferences, and any investor rights that survive the IPO
  - - ISA acquisition debt
    - $14.6M senior term loan + $34.0M mezzanine loan
    - Funded 12/18/2025; both due in 2028 before repayment
    - The company used debt tactically to close ISA, then used IPO cash to remove it quickly
    - Disclose all fees, amortization, and any residual obligations from the retired facilities
  - - Additional Series E close
    - Approximately $23M new capital
    - 03/04/2026
    - Bridged liquidity during IPO preparation and signaled continued investor support
    - Clarify whether the additional close changed economics or investor rights relative to the initial Series E issuance
  - - IPO proceeds
    - $416M gross; ~$377.9M estimated net
    - Priced 05/06/2026
    - The IPO was the balance-sheet reset, materially improving liquidity and enabling debt paydown plus working capital capacity
    - Show uses of proceeds actually spent versus planned uses in the prospectus
  - - New revolving credit facility
    - $125M; maturity 05/19/2031; leverage and interest-coverage covenants
    - Entered May 2026
    - Adds flexibility for capex, working capital, and strategic investments, but also reintroduces covenant-driven discipline and potential refinancing risk if performance slips
    - Disclose opening draw, covenant headroom, and base/downside scenarios under the leverage and coverage tests
  notes: Public data is strongest on transaction financing and weakest on current runway after the IPO and revolver became available.
