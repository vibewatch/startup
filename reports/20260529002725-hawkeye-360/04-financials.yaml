sections:
- id: SI-revenue-model
  title: Revenue Model, Pricing Proxies, and Go-to-Market Reality
  body: 'The filings show a more nuanced revenue engine than a simple “satellite data subscription” story. HawkEye 360 sells a mix of data, analytics, training, embedded support, and bespoke sovereign-capability programs to U.S. and allied government buyers, with public contracts suggesting that individual programs can be worth tens of millions of dollars. The company’s own accounting footnote confirms that revenue comes through many contract forms—cost-plus, firm-fixed-price, time-and-materials, subscriptions, and support services—and that recognition timing differs across those forms. That matters because the business can look software-like in one quarter and program-like in another. The strongest public pricing anchors are not list prices but contract awards: a $98.8M Navy firm-fixed-price IDIQ and a European Ministry of Defense program worth up to $75M. Those awards support the idea that HawkEye 360 can monetize high-value mission workflows, but they do not reveal normalized price per
    collection, price per user, or renewal economics. The GTM motion is also government-heavy and slow. The prospectus says relationships often begin with test-and-evaluate work and then expand into operational programs, but it also warns that procurement cycles, continuing resolutions, and multi-layer decision making make closing and scaling deals time consuming and expensive.'
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
  sourceRefs:
  - SI005
  - SI006
  - SI007
  - SI011
  - SI013
- id: SI-growth-margin
  title: Growth, Backlog, and Margin Structure Clues
  body: 'HawkEye 360 is no longer a pre-revenue frontier-space story. The final prospectus supports $117.66M of 2025 total revenue, $2.673M of net income, and $302.719M of backlog, with preliminary first-quarter 2026 revenue already running at $48.2M-$50.2M. The most useful reconciliation in the public record is that the same filing also shows $98.743M of revenue before a separate $18.917M line for revenue from related parties; that bridge plausibly explains why outside write-ups alternately quote roughly $98.7M or $117.6M for 2025. Revenue quality is decent but not pristine. Backlog is large versus current revenue, yet the filing defines backlog broadly enough to include cancellable portions of contracts and unused single-award IDIQ ceiling, so investors should not equate backlog one-for-one with locked recurring ARR. On costs, the company looks more like a scaled defense-data platform than a pure software vendor: direct and indirect cost of sales were relatively modest against revenue,
    but SG&A and R&D together still consumed more than $75M in 2025. Management argues fixed-cost leverage, data reuse, and lower-capital-intensity Block 3 satellites should expand margins over time. That may be directionally true, but the absence of product-level gross margins means the public record still cannot prove whether the most scalable economics sit in subscriptions, analytics, or bespoke programs.'
  tableRefs:
  - TI003
  - TI006
  figureRefs:
  - FI002
  sourceRefs:
  - SI011
  - SI013
  - SI016
  - SI017
  - SI019
- id: SI-capital-adequacy
  title: Capital Adequacy, Debt, and Financing Dependency
  body: 'The capital picture improved sharply between December 2025 and May 2026, but it remains essential to the thesis. Pre-IPO, HawkEye 360 finished 2025 with $92.686M of cash and $127.878M of working capital after financing the ISA acquisition with roughly $98.8M of Series E preferred equity and $48.6M of long-term debt. It then added about $23M in a March 2026 Series E close. The IPO was the true balance-sheet reset: final prospectus estimates put net proceeds at roughly $377.9M, with $49.8M earmarked to retire the acquisition loans and $7.5M reserved for the deferred ISA payment. Days later, the company formally repaid those term and mezzanine facilities and replaced them with a $125M revolver due in 2031. That sequence lowers near-term refinancing risk and gives HawkEye 360 more flexibility for working capital, capex, and strategic investment. It does not eliminate financing dependency. The revolver is covenant-bound, and the prospectus still describes a business that wants to keep
    investing in satellites, analytics, and acquisitions while operating in a concentrated government market. In other words, the company is much better capitalized than it was at the ISA close, but future growth still depends on maintaining both program momentum and lender headroom.'
  tableRefs:
  - TI004
  figureRefs: []
  sourceRefs:
  - SI001
  - SI002
  - SI003
  - SI004
  - SI009
  - SI013
  - SI015
- id: SI-verdict-gaps
  title: Financial Verdict and Remaining Public-Data Gaps
  body: 'The financially grounded view is constructive but not clean. Public filings support a company with real audited revenue, positive 2025 net income, unusually strong backlog growth, and materially improved liquidity after the IPO. They also reveal why the investment case can still disappoint: government concentration is high, one customer represented about 63% of revenue in the first nine months of 2025, backlog is not purely funded recurring demand, and fixed-price work can transfer execution risk back onto HawkEye 360. Most importantly, the public record is still too sparse for a full underwriting model. Investors cannot see ARR, renewal cohorts, realized pricing by product, customer-level gross margins, CAC, payback, or the post-IPO runway after planned capex and any revolver usage. That means the right conclusion is not “the numbers are bad”; it is “the numbers are now credible enough to justify diligence, but not detailed enough to finish diligence in public.” The next diligence
    session should therefore focus less on top-line existence and more on revenue quality, backlog burn profile, product-level margin contribution, and whether future growth is truly cash efficient or simply newly financed.'
  tableRefs:
  - TI005
  - TI007
  figureRefs: []
  sourceRefs:
  - SI011
