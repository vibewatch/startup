tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Stream
  - Mechanism
  - Recognition / Contract Form
  - Public Pricing Proxy
  - Quality / Caveat
  - Diligence Ask
  rows:
  - - RF data subscriptions / licensed products
    - Recurring access to RF data and information products and services for government users
    - Point in time as data is delivered; repetitive monthly subscription arrangements called out in ASC 606 note
    - No public list pricing
    - Looks software-like but price realization and renewal are undisclosed
    - Request ARR, customer count, renewal rate, and average monthly contract value by product
  - - Operational tasking and fixed-price program work
    - Customer-tasked signal collections and mission workflows delivered under fixed-price or level-of-effort contracts
    - Firm-fixed-price, level-of-effort, cost-plus, or cost-reimbursement depending on award form
    - Navy IPMDA renewal at $98.8M firm-fixed-price IDIQ
    - High strategic value but margin can compress if collections fail or costs overrun
    - Request gross margin by major fixed-price program and reprocessing incidence
  - - Training, support, and embedded personnel
    - Enablement, support hours, embedded expertise, and on-site exploitation support
    - Fixed-fee support recognized over time; professional services billed time-and-materials
    - Public value undisclosed
    - Likely lower gross margin than pure data but useful for expansion and lock-in
    - Split services revenue from core data revenue and disclose billable utilization
  - - Sovereign / hybrid systems and dedicated capacity
    - Customized satellite clusters, bespoke algorithms, and in-country infrastructure for allied governments
    - Program-based contracts plus follow-on recurring data purchases
    - European MoD award worth up to $75M; NRO extension discloses 23 months of dedicated funding but no value
    - Potentially large and sticky, but bespoke economics are opaque and capital needs can rise
    - Provide per-program capex, contract duration, and whether HawkEye retains ownership of assets
  - - Reseller / channel and mission integration arrangements
    - Products delivered through reseller arrangements or bundled into broader mission workflows
    - Recognized net of reseller discounts when products are delivered to reseller
    - No public price points
    - Useful for distribution but obscures realized pricing and end-customer economics
    - Disclose channel mix, reseller take rate, and margin by channel
  notes: Public sources confirm revenue mechanisms and a few contract values, but none disclose normalized realized pricing or revenue mix by stream.
