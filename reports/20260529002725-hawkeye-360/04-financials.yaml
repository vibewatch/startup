  rows:
  - - Total revenue ($M)
    - '67.559'
    - 117.660 in FY2025; 48.2-50.2 in Q1 2026 (prelim.)
    - Top-line growth is real and rapid, but quarter timing can be lumpy because delivery and recognition vary by contract type
    - Bridge quarterly revenue by product and customer to separate durable recurring growth from large program timing
  - - Net income / net loss ($M)
    - (28.997)
    - 2.673 in FY2025; (9.5)-(11.9) in Q1 2026 (prelim.)
    - GAAP profitability arrived in 2025 but immediately swung back to quarterly losses during the post-ISA ramp and IPO period
    - Provide normalized EBITDA and net-income bridge excluding warrant fair value, deferred consideration, and one-time IPO costs
  - - Backlog ($M)
    - '44.098'
    - 302.719 at FY2025 end; ~285.0 at 3/31/26 (prelim.)
    - Pipeline visibility improved dramatically, but backlog quality is mixed because cancellable and IDIQ ceiling amounts are included
    - Disclose funded backlog, cancellation rights, and burn-off schedule by customer and product
  - - Cost stack ($M)
    - Direct+indirect cost of sales 20.348; SG&A+R&D 56.712
    - Direct+indirect cost of sales 23.779; SG&A+R&D 75.204
    - Delivery costs scaled more slowly than revenue, but overhead and product investment remain large enough to keep margins opaque
    - Break out gross margin by subscriptions, services, sovereign programs, and hardware-linked offerings
  - - Cash generation ($M)
    - Operating cash flow 11.966; FCF (23.785)
    - Operating cash flow (17.339); FCF (28.406); investing cash outflow 83.3
    - Accounting profitability and EBITDA are not yet translating into positive cash generation because investment and working-capital needs remain high
    - Provide post-IPO cash-flow forecast and capex assumptions for constellation refresh and new sovereign programs
