chapter:
  number: 4
  title: Financials
  summary: 'HawkEye 360 now has enough public filing detail to underwrite a real revenue business, but not enough to fully underwrite unit economics. The key reconciliation is that the prospectus supports both numbers circulating in public coverage: $98.743M appears to be 2025 revenue before related-party revenue, while total 2025 revenue was $117.660M after adding $18.917M from related parties; net income was $2.673M and backlog was $302.719M. Revenue is overwhelmingly government-led, contracts span subscriptions, fixed-price tasking, services, and sovereign-capacity programs, and public award sizes such as the Navy’s $98.8M IDIQ and a European Ministry of Defense award worth up to $75M provide monetization proxies. Post-IPO liquidity improved materially via roughly $377.9M of estimated net IPO proceeds and a new $125M revolver, but public data still lacks product-level margins, realized pricing, renewal rates, CAC/payback, and funded-versus-cancellable backlog detail.'
