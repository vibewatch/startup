- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing Input
  - Why It Matters
  - What Public Data Does Say
  - Exact Diligence Path
  - Blocker Severity
  rows:
  - - Product revenue mix and realized pricing
    - Needed to separate repeatable data economics from lower-margin services or bespoke sovereign programs
    - Public sources only confirm that multiple monetization paths exist and provide a few large contract value proxies
    - Request revenue mix by product, top-program realized pricing, and contract duration / renewal by offering
    - Blocking
  - - CAC, win rates, sales productivity, and payback
    - Required to test whether the long government sales cycle is economically attractive
    - Prospectus confirms the sales cycle is long and costly but provides no unit-economics disclosure
    - Request pipeline conversion, CAC by channel, sales-cycle length by customer type, and payback by cohort
    - Blocking
  - - Product-level gross margins and D&A allocation
    - Determines whether scale improves economics or simply grows overhead
    - Prospectus gives cost-of-sales and opex totals but not segment margin by offering
    - Request gross margin bridge by subscriptions, services, bespoke programs, and hardware / infrastructure components
    - Blocking
  - - Backlog quality and customer concentration bridge
    - Needed to translate headline backlog into credible future cash receipts
    - Backlog is large, but filing definition includes cancellable value and some IDIQ ceiling amounts; one customer concentration is high
    - Request funded backlog waterfall, cancellation rights, top-customer share, and revenue timing assumptions
    - Material
  - - Post-IPO runway and revolver usage
    - Needed to judge whether future growth still depends on external financing
    - Public record shows IPO proceeds and revolver terms but not current cash, current draw, or capex roadmap
    - Request current cash, revolver usage, covenant headroom, and a 2026-2027 liquidity model including capex and M&A assumptions
    - Material
  notes: These gaps are the main reason the chapter recommends focused financial diligence rather than a clean public-only underwriting sign-off.
