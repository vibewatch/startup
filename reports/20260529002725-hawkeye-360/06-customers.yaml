  title: Customers
  summary: 'HawkEye 360''s best public customer proof is concentrated in defense and intelligence: the U.S. Navy renewed for a fourth consecutive year under a $98.8 million IPMDA IDIQ, NRO expanded work with 23 months of dedicated funding on a relationship dating to 2022, and Washington Technology''s S-1 summary says 61% of 2025 sales came from U.S. government work with NRO as the largest federal customer. Allied and adjacent growth exists through a European Ministry of Defense award, a >$100 million unnamed international partner, Australia-backed work for the Pacific Islands Forum Fisheries Agency, and a NASA research contract, but proof quality varies between production contracts, pilots, and partner integrations. The upside is unusually strong public-sector durability; the risk is heavy government concentration, opaque customer counts, and limited disclosure on retention or end-user utilization.'
