  - - Allied ministries & strategic partners
    - 'Buyer: European Ministry of Defense category and unnamed strategic regional partner; users: defense and security operators; payer: allied sovereign budgets'
    - Air-defense monitoring, GPS-interference monitoring, regional RF intelligence
    - Up to $75M Europe program plus >$100M five-year strategic partner agreement
    - Main non-U.S. expansion vector
    - Counterparties remain unnamed, limiting credit and geopolitical diligence
  - - Donor-funded regional security programs
    - 'Buyer/payer: Australia DFAT; users: FFA and Pacific Island members; beneficiaries: fisheries and maritime-enforcement teams'
    - IUU fishing detection, maritime monitoring, training
    - 2023 pilot program publicly confirmed through 2023
    - Shows indirect route into regional security missions
    - No public follow-on or renewal after the pilot period
  - - Civil space agencies
    - 'Buyer/user/payer: NASA Commercial Crew and Commercial LEO Development programs'
    - LEO RF-environment mapping for future space-to-space communications
    - Named 2026 contract but no disclosed value or duration
    - Proof that product can extend beyond defense
