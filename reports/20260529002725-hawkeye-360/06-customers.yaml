  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Company-level NRR, GRR, churn, active customer count, and customer-satisfaction metrics broken out for government, allied, civil, and partner-channel cohorts.
    whyItMatters: Without retention and customer-count disclosure, public evidence can prove repeat procurement in a few named accounts but cannot quantify overall stickiness or logo concentration across the installed base.
    diligencePath: Request board or IPO diligence materials that show gross and net retention, customer counts, renewal cohorts, and any mission-usage KPIs used internally to manage account health.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster
    missingEvidence: A complete roster of top customers and partner channels, including the unnamed European ministry, the unnamed >$100 million international partner, and revenue contribution by account.
    whyItMatters: The public named-customer list is enough to prove traction but not enough to underwrite a full concentration model or verify the credit quality and geopolitical exposure of the largest non-U.S. relationships.
    diligencePath: Request a top-10 customer schedule with customer name, country, contract type, start date, remaining term, and percent of trailing-twelve-month revenue and backlog.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: material
    topic: utilization
    missingEvidence: Operational usage data such as analyst seats, API consumption, mission-tasking volume, refresh cadence, or workflow embed rates for Navy, NRO, Europe, FFA, NASA, and Windward channels.
    whyItMatters: Public awards prove a buyer exists, but utilization data is what distinguishes shelfware or low-touch access from deeply embedded mission workflows that are hard to replace.
    diligencePath: Ask for quarterly business reviews, usage dashboards, renewal memos, or customer success scorecards that show how often data and analytics are consumed after procurement.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU002
    - TU004
  - type: missing-source
    severity: material
    topic: top-customer-concentration
    missingEvidence: Exact revenue share, backlog share, and renewal calendar for NRO, Navy, NGA, and the largest allied accounts.
    whyItMatters: Public evidence already shows heavy government concentration, but underwriting downside requires knowing whether one or two contracts dominate revenue and whether any material renewal cliffs cluster in the same period.
    diligencePath: Request customer concentration schedules, backlog-aging reports, and contract-renewal calendars from management or data room materials.
