figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  summary: Government, donor-funded, and partner-led paths all end in operational workflow adoption, but they differ sharply in procurement friction and ownership of the customer relationship.
  data:
    items:
    - label: Mission trigger
      detail: A security problem such as dark-vessel activity, GPS interference, air-defense monitoring, or future LEO communications risk creates demand for RF intelligence.
      touchpoints:
      - Dark-ship detection need
      - GPS-interference monitoring
      - Air-defense situational awareness
      - Spectrum planning for future spacecraft
    - label: Evaluation
      detail: Prospects test whether commercial RF data adds enough shareable insight versus classified-only or AIS-only workflows, often through pilots, study contracts, or partner demonstrations.
      touchpoints:
      - Pilot or study contract
      - Proof of shareable unclassified data
      - Comparison with existing ISR or AIS feeds
    - label: Contracting
      detail: Buying motion typically runs through defense procurement, donor funding, or partner-channel integration rather than self-serve software purchase.
      touchpoints:
      - IDIQ or option-year contract
      - Sole-source justification
      - Donor-funded pilot
      - Partner platform agreement
    - label: Operational use
      detail: Data flows into analyst tools, mission workflows, or partner platforms for vessel detection, GEOINT, electronic warfare monitoring, or LEO spectrum research.
      touchpoints:
      - Operational-tool integration
      - Analyst workflow embed
      - Training and support
      - API or platform integration
    - label: Expansion or stall
      detail: Relationships expand through renewals, option years, dedicated satellites, or wider geography; they stall when budgets, awareness, or channel ownership remain weak.
      touchpoints:
      - Fourth-year renewal
      - 23-month extension
      - Dedicated 2027 clusters
      - Procurement and budget friction
