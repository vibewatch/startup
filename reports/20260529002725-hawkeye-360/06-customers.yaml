- id: concentration-procurement-and-channel-risk
  title: Concentration, Procurement Friction, and Partner Dependence
  body: 'The adverse reading is straightforward: HawkEye 360 appears to have real customer traction, but that traction is highly concentrated in defense and intelligence budgets and mediated by procurement structures that can both help and hurt. Washington Technology’s public-markets coverage says 61 percent of 2025 sales came from U.S. government work and names NRO as the largest federal customer, which means budget turbulence or a single lost renewal would matter. Procurement data reinforces the point. The NIWC Pacific sole-source notice shows how HawkEye 360 can benefit from incumbency and uniqueness, but it also illustrates how adoption is gated by long-budget-cycle, specialized defense buying processes rather than fast self-serve expansion. SpaceNews adds that even when use cases are compelling, commercial RF providers still face awareness gaps and growing competition from new RF entrants and SAR vendors. Finally, the company’s commercial-maritime reach looks partner-assisted rather
    than direct-logo-heavy in public evidence, with Windward and donor-backed FFA work more visible than named private enterprises. That does not make the business fragile, but it does mean customer durability today likely rests more on government mission entrenchment than on a broad, diversified commercial base.'
