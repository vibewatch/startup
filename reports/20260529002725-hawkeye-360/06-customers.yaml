  - TU001
  figureRefs:
  - FU001
- id: named-customer-proof-and-adoption
  title: Named Customer Proof and Adoption Trajectory
  body: 'The strongest public proof comes from signed or renewed government contracts, not logos on a slide. The U.S. Navy relationship is the cleanest example: a fourth consecutive year under IPMDA with a disclosed $98.8 million ceiling and an explicitly operational maritime-monitoring mission. NRO is the next strongest: HawkEye 360 says the account dates to January 2022 and expanded in December 2025 with 23 months of dedicated funding tied to EUCOM, operational-readiness, and security-assistance needs. NGA provides adjacent proof that the product has moved beyond one agency, with a third option year and a reported $2.5 million task order on top of earlier pilot use. Outside the U.S., the company has two large but partly opaque growth signals: a European Ministry of Defense electronic-warfare award valued at up to $75 million and a five-year strategic international-partner agreement worth more than $100 million. Those wins matter, but they do not identify the customer as precisely as the
    Navy or NRO do. Australia-backed work for FFA and NASA’s RFIQ research award widen the footprint into donor-funded maritime enforcement and civil space, yet both are weaker evidence of recurring production scale than the Navy and NRO renewals. Windward is useful proof of channel integration, but it is still one step removed from direct end-customer ownership.'
