- id: retention-and-durability-signals
  title: Retention, Repeat Usage, and Durability Signals
  body: Public durability evidence is good for a handful of accounts and weak for the overall portfolio. On the positive side, HawkEye 360 can point to a fourth straight Navy year, an NRO relationship that publicly traces back to 2022, and an NGA extension plus task order; those are the kinds of signals that matter more than a generic “customer count” claim. The strategic international-partner agreement also offers contractual visibility via a five-year term and planned dedicated clusters in 2027. But the record still has big holes. The company does not publicly disclose NRR, GRR, churn, active-customer count, satisfaction, or usage intensity by account. Europe is clearly a meaningful new contract, yet public materials do not provide a renewal history or detailed term structure in the extracted text. NASA and FFA are valuable adjacency proofs, but they currently read as research or pilot-style evidence rather than closed-loop proof of broad recurring commercial expansion. So the right reading
    is not “retention is unknown” but “retention is provable in a few public-sector accounts and opaque at the company-wide level.”
