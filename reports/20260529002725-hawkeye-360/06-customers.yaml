  - - Commercial channel partners
    - 'Buyer/user: Windward platform customers; payer: downstream customers via partner workflow'
    - Dark-vessel detection, AIS validation, maritime risk modeling
    - Partner integration announced for select customers
    - Broadens distribution into maritime risk and compliance workflows
    - Direct revenue attribution and partner economics are undisclosed
