callouts:
- calloutType: strength
  title: Mission relevance is backed by repeat government and allied contracts
  body: The public record shows HawkEye 360 is well beyond concept-stage narrative. A fourth consecutive U.S. Navy renewal, a 23-month NRO expansion, and a European Ministry of Defense program worth up to $75 million all point to real mission pull for RF intelligence across maritime, defense, and interference-monitoring workflows. That traction matters because it validates both the constellation and the downstream analytics stack with buyers that care about operational utility rather than novelty.
  claimRefs:
  - CO028
  - CO029
  - CO030
  - CO031
- calloutType: risk
  title: Financial canon and concentration visibility remain imperfect
  body: Overview-level public evidence is weaker on exact numbers than on mission traction. External summaries conflict on 2025 revenue and net income, and only one source in this chapter quantifies U.S. government mix at 61% of sales. That leaves investors with a credible growth story but incomplete clarity on the exact current mix of government, allied, and commercial revenue and on which prospectus numbers should be treated as canonical.
  claimRefs:
  - CO021
  - CO022
  - CO038
- calloutType: insight
  title: Governance depth increased materially around the IPO window
  body: The April board appointments, the refreshed advisory board, and the International Advisory Board together suggest that HawkEye 360 knew the transition to public markets required more visible governance and geopolitical bench strength. The pattern does not remove founder centrality, but it does show intentional institutionalization rather than a static founder-led structure.
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO044
  - CO045
- calloutType: assumption
  title: Exact capital history and holder map need direct prospectus or cap-table review
  body: This chapter can support the December 2025 $150 million financing, the March 2026 $23 million additional close, selected post-IPO investor stakes, and the May 2026 revolving credit facility. It cannot yet reconstruct every historic private round, every lender draw, or the complete post-IPO holder and committee map. Final judgment on ownership leverage should wait for direct prospectus tables or company-provided cap-table detail.
  claimRefs:
  - CO013
  - CO014
  - CO017
  - CO023
