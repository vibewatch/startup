company:
  name: HawkEye 360
chapter:
  number: 1
  title: Company Overview
  summary: 'HawkEye 360 is a Herndon, Virginia-based signals-intelligence company founded in 2015 that now trades on the NYSE as HAWK after a $416 million IPO priced on May 6, 2026. Public evidence supports a differentiated RF-intelligence platform built on a 30-plus-satellite constellation, repeat government and allied contracts, and late-stage financing that included a $150 million ISA-linked Series E/debt close, a $23 million follow-on close, and a later $125 million revolving credit facility. The main overview tension is not product relevance but data cleanliness: public coverage diverges on 2025 revenue and net income and only partially discloses customer and ownership concentration.'
sections:
- id: identity-platform
  title: Identity, Mission, and Product Architecture
  body: 'HawkEye 360 is a Herndon, Virginia-based signals-intelligence company founded in 2015 and now operating as a newly public defense-tech issuer on the NYSE. Public-facing company materials consistently define the product around detecting, geolocating, and characterizing radio-frequency emissions for U.S. government and allied security customers rather than around a generalized geospatial-data narrative. The current operating stack has four linked layers: a constellation of more than thirty satellites, a cloud-based ground architecture, proprietary signal processing, and AI-enabled analytics delivered via subscriptions, direct delivery, and APIs. The technology page says the satellites orbit about 500 km above Earth in clusters of three, while eoPortal separately describes a 30-microsatellite constellation rooted in the December 2018 Pathfinder mission and documents frequency coverage from 70 MHz up to roughly 18 GHz with the RF front end. Public use cases center on maritime tracking,
    GNSS-jamming detection, radar monitoring, and communications mapping, which is consistent with third-party coverage describing demand for dark-vessel and GPS-jammer detection. Overall, the chapter evidence supports a simple one-line description: HawkEye 360 sells space-based RF intelligence data and analytics, not launch services or a pure SaaS abstraction.'
