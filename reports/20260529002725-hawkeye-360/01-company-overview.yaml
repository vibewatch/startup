  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: full-private-funding-history
    missingEvidence: A full round-by-round funding history before the IPO, including amounts, dates, and investors for each pre-2025 private round.
    whyItMatters: Exact lifetime capital raised affects dilution analysis, investor ownership concentration, and how much of HawkEye 360’s current position reflects repeated external financing versus internally funded growth.
    diligencePath: Review the final IPO prospectus capitalization and principal-stockholder tables, then reconcile earlier rounds through investor announcements or direct company investor-relations materials.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-mix-and-count
    missingEvidence: Named-customer count and a clean revenue split across U.S. government, allied-government, and commercial customers for 2025 and early 2026.
    whyItMatters: A 61 percent U.S.-government mix from one external source implies concentration risk, but without customer count, renewal schedule, and the allied-commercial remainder the chapter cannot fully size dependence on any one buyer cohort.
    diligencePath: Pull the final prospectus customer-concentration disclosures or request management commentary that quantifies active customers, top-customer exposure, and the split between U.S., allied, and commercial demand.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO001
    - TO003
  - type: conflicting-data
    severity: material
    topic: 2025-financial-canon
    missingEvidence: The direct prospectus tables or SEC-filed financial statements that reconcile whether 2025 revenue and net income were $117.6M / $2.6M or $98.7M / $2.7M.
    whyItMatters: The contradiction is small on profit but large on revenue, and a company-overview chapter should not force a single metric when external summaries disagree about the same year.
    diligencePath: Fetch and review the filed S-1 prospectus tables directly, then update the chapter to cite the source table rather than external media summaries.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: material
    topic: post-ipo-holder-and-governance-map
    missingEvidence: A full post-IPO beneficial-owner roster, committee assignments, and complete executive roster.
    whyItMatters: Selected investor stakes and two new directors are visible, but complete governance analysis requires committee structure, other directors, and the full list of officers responsible for day-to-day execution.
    diligencePath: Use the final prospectus principal-stockholder section, later proxy filings, and board committee disclosures to build a complete post-IPO ownership and governance map.
