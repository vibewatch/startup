- id: capital-and-financial-snapshot
  title: Funding Path, IPO, and Public Financial Snapshot
  body: 'The clearest financing chronology starts with the December 2025 ISA acquisition, which HawkEye 360 says was supported by $150 million of equity and debt, followed by an additional $23 million Series E close in March 2026. Public sources do not provide a complete round-by-round history for the earlier private years, so the exact lifetime capital base before the IPO remains incomplete in this chapter. The IPO itself is well corroborated across official and external sources: the company filed an S-1 in April 2026, launched a roadshow later that month, and priced 16,000,000 shares at $26 on May 6 for about $416 million of gross proceeds, with a 30-day option for another 2.4 million shares. A subsequent $125 million revolving credit facility added further balance-sheet flexibility. The harder part is the public financial snapshot. Washington Technology reported 2025 revenue of $117.6 million, $2.6 million of net income, $302.6 million of backlog, and a 61% U.S.-government sales mix,
    while Satellite Today summarized the prospectus as showing $98.7 million of revenue and $2.7 million of net income. Because this chapter does not cite a direct prospectus table for those numbers, the contradiction is preserved rather than forced into a single canon. Valuation references also span roughly $2.4 billion, $2.84 billion, and $3.15 billion depending on whether the lens is offer-price math, Seraphim’s framing, or first-day trading.'
