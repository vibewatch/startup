    type: flow
    layout: wide
    summary: 公开工作流从任务派发或环境采集开始，经由地理定位和特征刻画，最后进入分析师行动。
    approximationNotes: 该流程抽象了多个任务套件，展示的是通用作业模式，而不是某个产品的具体 UI 顺序。
    data:
      nodes:
        - id: mission-need
          label: 任务需求
          detail: 用户确定感兴趣区域、信号族或分析问题，例如暗船、GNSS 干扰器、防空雷达或可疑通信活动。
        - id: tasking
          label: 任务派发或订阅请求
          detail: 分析师按地理、时间、频率或带宽请求采集，或消费周期性订阅输出。
        - id: space-collection
          label: 空间采集
          detail: 三星集群在感兴趣区域捕获发射信号及相关信号特征。
        - id: processing
          label: 地理定位与特征刻画
          detail: TDOA、FDOA、专利信号处理方法和 AI 分析，把捕获结果转成探测、地理定位和带上下文的活动。
        - id: analyst-layer
          label: 分析师利用
          detail: Mission Space、RFGeo、RFIQ 和任务套件工作流向分析开放可视化、原始数据或定向产品。
        - id: integration
          label: 集成与行动
          detail: 输出通过 API、云访问、直接下载或 GIS 集成交付，支持跟踪、预警、排序和执法。
      edges:
