      - number: '7.2'
        title: RF 栈越宽，星座、发射和产品性能风险越高
        blocks:
          - type: paragraph
            body: >-
              运营逻辑假设 HawkEye 360 能在扩大产品范围的同时，守住复杂天地一体软件系统的可靠性。公开材料支持这种复杂度：星座以三卫星集群运行，覆盖宽 RF 频段，并承诺高频重访；任务页把产品放进 GNSS
              干扰和防空监测工作流，客户在受争夺环境下重视时效、精确地理定位和置信度。这些要求让星座健康和在轨处理质量具备经济意义。公开披露还显示路线图并非静止：Cluster 14 在 2026 年进入调试，2025 年
              Rocket Lab 任务搭载了一颗实验卫星，Maxar RF 交易增加了宽带扫描卫星和档案资产，ISA 把算法、FPGA 固件、边缘和云处理纳入技术栈。更宽的技术栈有战略吸引力，但也加重集成和可靠性负担。因此
              SpaceNews 关于间歇性陆基雷达仍更难地理定位的报道很重要：下一步增量改进在技术上比第一步更难。
