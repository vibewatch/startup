  - id: TV005
    title: 投资逻辑破裂与否决触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 积压订单质量恶化
        - 积压订单大幅下降，且没有等量新签补充或已获资金细节支撑
        - 削弱「可见性支撑公开市场溢价倍数」的论点
        - 立即按悲观情景估值区间重估
      - - 集中度仍然极高
        - 单一客户仍接近收入或应收账款主导份额，且多元化进展有限
        - 一个采购决定就能让溢价变脆
        - 维持观察建议；任何经营摇摆都应下调
      - - 利润率 / 结构令人失望
        - 公开业绩显示经济性更像项目或服务，而不是经常性数据
        - 打破高于 BlackSky/Spire 式倍数的支付理由
        - 下调公允价值区间；增加敞口前重新尽调
      - - 流动性再次收紧
        - 即便有 IPO 募资，仍出现循环信贷提款或契约压力
        - 说明 IPO 并未真正解决融资风险
        - 在资本路径重置前，视为投资逻辑破裂
      - - 太空数据倍数压缩卷土重来
        - 公开同业因执行疲弱或预算压力再次降估值
        - 显示 HawkEye 并未与更广行业重定价隔绝
        - 避免在纪律性入场区间之上摊低成本
    notes: 每个触发器都设计成可从公开报告或广泛覆盖的合同与市场信号中监测。
    claimRefs:
      - CV015
      - CV017
      - CV021
      - CV037
      - CV040
      - CV046
      - CV047
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入桥
        - 从 $98.743M 不含关联方收入到 $117.660M 2025 年总收入的桥接
        - 没有干净分母，估值论证会被口径选择操纵
        - 管理层 / CFO：提供 GAAP 与第三方经营收入桥
      - - 积压订单瀑布
        - 已获资金支持与可取消积压订单、选项内容和确认时点
        - 投资者需要知道，$302.7M 积压订单中多少是真正硬可见性
        - 管理层 / 合同：按客户和资金状态提供积压订单瀑布
      - - 收入结构和利润率
        - 订阅、分析、主权项目、服务和关联方利润率拆分
        - 这关系到 HawkEye 是否配得上软件化溢价，是核心问题
        - 管理层 / 财务：提供产品线毛利率和经常性结构历史
      - - 股权结构表和流通股
        - IPO 后完全稀释股数、锁定期节奏和 Series E 清理机制
        - 公开市场投资者需要看清稀释，以及是否还有残余下行不对称
        - IR / 法务：交付股权结构桥和锁定期安排
      - - 客户多元化计划
        - 降低单一客户依赖的具体路径
        - 如果一个客户就能实质改变叙事，溢价倍数很脆
        - 管理层 / 销售：展示多元化管线和续约排期
      - - 预算韧性
        - 收入和积压订单对美国预算时点、CRs 及盟友采购延迟的敏感性
        - 政府占比高的溢价估值，在采购时点滑坡时压缩很快
        - 管理层 / FP&A：提供下行情景敏感性和近期采购周期数据
    notes: 这些问题刻意卡住估值关键点；每一项都会直接影响分母、倍数或下行路径。
    claimRefs:
      - CV015
      - CV017
      - CV048
      - CV049
      - CV051
      - CV052
