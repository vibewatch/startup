      - number: '3.2'
        title: 直接 RF 同行与架构取舍
        blocks:
          - type: paragraph
            body: >
              Unseenlabs 是最清晰的在场正面对手。它把自己定位为面向海事监测的 RF GEOINT 公司；截至 2024 年 8 月，ESA 发布其拥有 15 颗卫星；它在 2024 年融资 €85
              million，并推进 2026 年下一代星座，范围从海事扩展到陆地和太空监测。关键架构差异是实质性的，不是表面包装。Unseenlabs 和独立报道强调单星 RF 采集的韧性和成本效率；HawkEye
              则公开强调基于集群的 TDOA/FDOA 地理定位、更丰富的分类和更广的多任务分析。这是同一品类内部真正的设计分叉。


              Kleos 是另一个反复出现的直接 RF 名字，但它更像结构性走弱，而不是激进的 2026 定价竞争者。其网站仍描述通过 API 交付的 RF 情报和此前 NRO 工作，行业报道也显示其 LOCATE
              产品曾提供有用的 RF 提示数据。但 NewSpace Index 记录其状态为已取消 / 破产，并称截至 2024 年 10 月，合同已终止且没有员工。净结论是：纯 RF
              领域存在，但活跃商业集合看起来很浅。HawkEye 当前的直接同行风险，更多在于证明其集群架构相对 Unseenlabs 的单星方案仍有显著优势，而不是在一个同样健康的 RF 供应商拥挤市场中求生。
