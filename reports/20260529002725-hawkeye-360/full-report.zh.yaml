              最清楚的融资时间线始于 2025 年 12 月的 ISA 收购。HawkEye 360 称该交易由 $150 million 股权和债务支持，随后在 2026 年 3 月又完成 $23 million 的
              Series E 追加交割。公开来源没有给出早期私募年份逐轮融资的完整历史，因此本章无法完整确定 IPO 前的生命周期资本基础。IPO 本身得到官方和外部来源充分交叉印证：公司在 2026 年 4 月提交 S-1
