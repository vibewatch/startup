            body: >-
              公开材料足以显示 HawkEye 360 拥有一条可运转的运营管线，但还不足以完整承销任务关键可靠性。C4ISRNet 报道称，公司在 2021 年投资地面基础设施，把从采集到交付的延迟推向约一小时；NOAA
              GOES 案例研究显示，在 Ecuador 上空进行 80 次采集后，约一周内缩小了干扰源范围；SatNow 对 SFL 的报道称 Cluster 8 和 9 达成成功初始通信，Cluster 9
              引入更新后的载荷和平台功能；Via Satellite 称 Cluster 12 正在测试 Ka-band 下行链路，以提高未来吞吐并填补新的 dawn/dusk
              轨道缺口。但安全和合规是公开资料变薄的地方。HawkEye 360 反复使用安全云和安全非涉密访问语言，但所审阅来源没有披露具名产品认证、可用性或服务补偿承诺、公开 API
              模式，或合并软件栈的正式保证边界。对于一个面向情报的平台，缺失这套包很关键。
