  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 政府集中度、杠杆和许可规则构成第一层风险栈
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 的一阶风险不是市场没有需求，而是公司卡在几股力量交汇处：公共部门需求集中、资本开支持续偏重、国家安全工作流受监管。最强披露的集中度事实是，2025 年美国政府收入占比 61%；约 $303
              million 积压订单也强化这一点，但仍取决于预算时点、选项执行和采购连续性。资本端同样还在场：公司把 2026 年首次公开募股（IPO）与 $125 million
              循环信贷额度配套使用，后者的契约条款和政府合同违约触发机制让合同健康度不仅影响收入，也影响融资灵活性。监管姿态同样两面。HawkEye 360 把 200
              多张出口许可证包装成护城河，但这也意味着出口筛查、制裁合规和轨道碎片申请工作不是后台细节，而是增长闸门。缓释确实存在——进入公开市场、更长期的循环信贷额度、多家机构关系——但剩余敞口仍高，因为一次不利监管或采购事件就可能传导到积压订单信心、债务观感和估值。
