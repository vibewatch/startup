            body: >-
              最强的反向产品信号，不是 HawkEye 360 缺技术；而是下一组技术问题比第一组更难。SpaceNews
              报道称，间歇性陆基雷达仍是更艰难的地理定位挑战，正是那类目标会让重访几何、信号弱度和模糊发射源行为侵蚀置信度。同一篇文章也把市场描述为商业战场，越来越多国际 RF 竞争者，甚至 SAR
              供应商，正进入邻接海事情报领域。内部看，HawkEye 360 也在通过合并原始集群地理定位模型、Maxar 的扫描任务、ISA 的处理和 FPGA 传承、新海事 AI
              模块，以及实验性下行链路和卫星设计，增加集成风险。公司看起来更差异化，恰恰因为栈正在变宽；投资者也应假设，随着产品宽度、延迟预期和保证要求上升，执行会更难。
