  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以投委会（IC）视角，从需求、验证、护城河、经济性可见度、风险、估值纪律和证据质量给 HawkEye 360 打分。
    data:
      items:
        - label: 市场需求
          value: 4
          note: 政府和盟友对 RF GEOINT 的需求明确真实，且具有战略粘性
        - label: 产品 / 验证
          value: 4
          note: 差异化 RF GEOINT 平台，积压订单真实，合同可见
        - label: 护城河持久性
          value: 3.5
          note: 稀缺性存在，但替代性地理空间和 ISR 工作流仍会争夺预算
        - label: 经济性可见度
          value: 1.5
          note: 公开披露的利润率和结构仍太薄，无法支撑高置信度溢价承销
        - label: 风险画像
          value: 1.5
          note: 集中度、积压订单限制条件以及公开市场重估风险仍然高
        - label: 估值纪律
          value: 2
          note: IPO 价格尚可辩护；当前公开市场定价让上行空间变薄
        - label: 证据质量
          value: 3
          note: 足以避免放弃，但不足以证明可以按当前报价买入
    approximationNotes: 评分只是方向性判断工具；低分主要反映披露和承销缺口，并不否认公司确有战略价值。
