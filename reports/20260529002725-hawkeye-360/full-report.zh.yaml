              的战略国际合作伙伴协议。这些订单重要，但客户身份不像 Navy 或 NRO 那样清楚。澳大利亚支持的 FFA 工作和 NASA 的 RFIQ 研究奖，把足迹扩到捐助资金支持的海上执法和民用航天，但相比 Navy
