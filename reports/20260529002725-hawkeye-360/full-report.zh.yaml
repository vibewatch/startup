        - RF 分析、AIS 关联、暗船工作流和 AI 驱动的持续跟踪
        - 增加身份连续性和欺骗暴露能力，而不只是探测船只
        - 误匹配率和持续跟踪置信度校准未公开
      - - Air Defense Radar Monitoring
        - 防空分析人员、ISR 规划人员和 EOB 团队
        - 持续雷达探测、地理定位、特征刻画、热点识别和任务指引
