      - number: '7.3'
        title: 对机构、发射商、资本和持证人才的依赖定义执行风险
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 的依赖地图足够宽，即使需求指标不错也值得重视。公司确实有可见的项目多元性——Navy、NGA、NRO 和其他 DoD
              活动都出现在公开记录中——发射也交给不止一家供应商。这些是真缓释。但它们不能抵消核心依赖结构。联邦项目仍主导商业叙事；GAO
              关于持续决议导致合同延迟的证据说明，即使项目保持战略重要性，预算机制也会拖慢供应商。融资依赖同样重要，因为星座业务会以不均匀的节奏消耗资本，而浮动利率债务和契约组合又把政府合同健康度写进资产负债表故事。最后，人才和执行风险对这家公司异常重要。招股书称近半员工持有安全许可；ISA
              收购补上了稀缺的信号处理、载荷和 FPGA 人才，而这类人才很难快速替换。因此投资者应把 HawkEye 360
              当作一个依赖系统来跟踪：客户集中、专业人才、贷款方、监管者和发射节奏，都会汇聚到交付质量和续约可信度上。
