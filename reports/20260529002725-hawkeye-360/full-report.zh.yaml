    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流难点
      - HawkEye 360 方案
      - 可衡量收益
      - 局限
    rows:
      - - 跟踪暗船和 AIS 欺骗
        - 自愿上报的 AIS 可以关闭或伪造
        - Maritime Intelligence 将 RF 与 AIS 关联，Vessel Custody ID 维持跨采集连续性
        - 更快排查可疑船只，减少跨轨次手工拼接
        - 召回率和误报率指标未公开
      - - 制图并监测防空雷达
        - 飞越限制和手工雷达分析会留下盲区
        - Air Defense Monitoring 对雷达活动、热点和机动性做地理定位与特征刻画
        - EOB 更新更及时，ISR 任务聚焦更准
        - 更难处理的间歇式陆基雷达仍是公开承认的挑战
      - - 发现并归因 GNSS 干扰
        - 干扰和欺骗可能在地面团队定位源头前扩散到大范围区域
        - GNSS Interference Detection 提供持续天基地理定位和背景预警
        - 无需新增客户基础设施，也能更早拦截、覆盖更广
        - 未公开误差范围和当前交付 SLA
      - - 在拒止或偏远地区巡查通信活动
        - 机载 ISR 成本高，覆盖不连续
        - Communications Mapping 在大范围内探测并定位 PTT 电台和卫星电话
        - 几分钟的大范围采集可替代数小时机载搜索
        - 公开资料未完整列出支持的波形和地理范围
      - - 发现未知发射源或分析更宽频谱切片
        - 预定义信号目录会漏掉部分目标信号
        - RFIQ 提供原始 I/Q 数据和更宽带采集模式
        - 信号发现和定制利用更灵活
        - 公开工具示例和流水线要求很薄弱
      - - 解决持续性的民用或商业干扰
        - 搜索范围过大时，有害 RF 干扰源容易被藏住
        - RFGeo、RFIQ 和合作伙伴分析工作流缩小了厄瓜多尔一个 GOES 干扰源范围
        - 多次天基采集可在单靠地面搜索很难的地形中隔离源头
        - 案例成功不等于一般性的公开性能保证
