      - number: '3.5'
        title: 差异化耐久性与反向证据
        blocks:
          - type: paragraph
            body: >
              HawkEye 的护城河真实存在，但有条件。耐久部分是基于集群的 RF 地理定位、不断扩宽的任务集合，以及证明其数据可以在美国和盟友防务工作流内部共享。这些比泛泛的“来自太空的
              RF”推介更难快速复制。不耐久的部分是品类排他性和预算所有权。SpaceNews 的反向框架很关键：市场如今是战场，资本更多或产品更宽的邻接供应商，即使不在原生 RF 地理定位上追平
              HawkEye，也能拿下海事和安全预算。直接 RF 领域不是主要危险；事实上，Kleos 的困境降低了近期纯 RF 定价压力。


              更大的风险是替代。如果客户主要需要企业规模的暗船探测、告警或海事监测，AIS 加 SAR 或 EO 工作流可能已经足够好，也更容易在现有预算线里说服内部。类似地，Spire、Capella、ICEYE 或
              Aerospacelab 的主权建设选项，限制了任何供应商管理的数据层对顶级政府的排他性。因此，HawkEye
              的差异化在分析层看起来耐久，但在预算层只部分耐久。公司可以保持特殊，但未必能保持唯一，这是一个微妙但重要的承销区分。
