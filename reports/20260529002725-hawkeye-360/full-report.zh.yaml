      - number: '8.4'
        title: 情景区间、投资逻辑破裂触发器和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              情景分析应刻意保持近似。乐观情景假设 HawkEye 把积压订单转成干净第三方收入，走出少数政府重客户，并证明更多商业模型像经常性数据订阅，而不是一次性任务或项目工作。在这种结果下，市场可以继续给公司 20
              倍中高段收入倍数区间，从而维持或小幅高于当前公开市场标记。基准情景更克制：公司继续赢单和执行，但投资者继续折价客户集中、积压订单质量和经济性不透明，股价更接近 IPO
              估值区间，而不是更乐观的交易标记。悲观情景并不离奇。积压订单大幅下台阶、预算扰动、客户集中度冲击，或证据显示增长质量低于市场希望，都可能把股价压向 BlackSky 或 Spire
              式区间。因此最终尽调问题聚焦分母，而不是故事。在给出更强建议之前，投资者需要收入桥、已资助积压订单瀑布图、更清楚的股权结构解释，以及证据证明溢价来自耐久的经常性经济性，而不只是给了稀缺品类叙事。
