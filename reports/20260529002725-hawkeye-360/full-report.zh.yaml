        - 按 May 28 市值筛选，~25.2x 总 2025 年收入，或 ~30.1x 不含关联方收入
      - - 决策含义
        - 等待披露更清楚，或价格更好
        - 仅凭公开证据，无法在当前报价下给出干净的买入判断
    notes: 评估针对当前公开市场入场决策，不等于认定公司缺乏战略价值。
