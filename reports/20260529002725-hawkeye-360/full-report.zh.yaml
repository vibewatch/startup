          - type: paragraph
            body: >-
              2025 年 12 月到 2026 年 5 月之间，资本图景大幅改善，但它仍是投资逻辑的核心。IPO 前，HawkEye 360 用约 $98.8M Series E 优先股和 $48.6M 长期债务为 ISA
              收购融资后，2025 年末持有现金 $92.686M，营运资本 $127.878M。随后公司在 2026 年 3 月 Series E 交割中又增加约 $23M。IPO
              才是真正的资产负债表重置：最终招股书估计净募资约 $377.9M，其中 $49.8M 指定用于偿还收购贷款，$7.5M 预留给 ISA 递延付款。几天后，公司正式偿还这些定期和夹层融资，并以一笔 2031
              年到期的 $125M 循环贷款替代。这一系列动作降低了近期再融资风险，也给 HawkEye 360
              在营运资本、资本开支（capex）和战略投资上更多弹性。但它没有消除融资依赖。循环贷款受财务约束条款限制，招股书仍描述的是一家想继续投资卫星、分析和收购，同时身处集中政府市场的公司。换句话说，公司资本化水平已远好于
              ISA 交割时，但未来增长仍取决于维持项目动能和贷款人留出的额度空间。
