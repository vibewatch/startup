      - - RFIQ
        - 需要更原始采集数据的 SIGINT、EW 和频谱分析人员
        - 可任务化的未处理 I/Q 数据，采集模式灵活
        - 让 HawkEye 从预打包探测延伸到信号发现和定制分析
        - 缺少带宽、延迟和工具互操作性的公开基准
      - - Mission Space Platform 平台
        - 分析团队和任务操作人员
        - 面向分析人员的软件环境，支持摄取、可视化和工作流自动化
        - 接上数据采集与情报利用，让非专家用户更快处理 RF GEOINT
        - 平台本身没有公开 API 或部署架构包
      - - Spectrum Monitoring
