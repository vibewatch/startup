      - number: '7.4'
        title: 如果多元化跑赢集中度，且执行快于融资压力，投资逻辑仍能成立
        blocks:
          - type: paragraph
            body: >-
              评估 HawkEye 360 的正确方式，是把缓释质量看成动态变量，而不是绝对事实。正面因素清楚：IPO 成功、更长期的循环信贷额度、多家机构关系、SpaceX 和 Rocket Lab 都承接发射，以及加深
              RF
              感知和信号处理护城河的收购。但这些都不能让公司变成低风险。它们只是买来时间和选择权。只有几个监控项同时守住，投资逻辑才仍可投：联邦续约必须继续，不能出现尖锐集中度冲击；发射节奏必须完整，不能出现可见可靠性事件；出口和碎片合规必须保持常规，而不是升级；Maxar
              和 ISA
              工作流提升产品性能的速度，必须快于它们推高运营复杂度的速度。因此，干净的投资逻辑破裂点不是单条新闻，而是一组事件：续约或采购滑坡与发射或集成压力相撞，或在杠杆和资本开支仍重要时出现监管行动。如果这些事件聚集，公司的积压订单、利润率信心和估值溢价都可能迅速压缩。
