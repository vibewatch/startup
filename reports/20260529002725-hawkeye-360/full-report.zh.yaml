  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: HawkEye 360 公开架构以三星采集为底座，上面叠着云处理、产品模块和交付接口。
    approximationNotes: 这套栈根据公开页面、专利和外部技术报道拼出，并非来自官方工程框图。
    data:
      layers:
        - id: space-collection
          label: 空间采集层
          detail: 三星集群在全球采集 RF 发射信号；载荷从 Pathfinder 演进到更新的集群设计，并围绕 Kestrel 和未来概念做实验。
        - id: payload-and-geolocation
          label: 载荷与地理定位层
          detail: SDR 与 RF 前端硬件为 TDOA、FDOA 和专利盲相干积分流程提供输入，用于发射源定位和特征刻画。
        - id: ground-processing
          label: 地面与云处理层
          detail: 安全云处理扩展了原始采集处理、信号处理、分析生成和面向具体任务的产品准备。
        - id: product-services
          label: 产品与任务服务层
          detail: >-
            RFGeo、RFIQ、Mission Space、Maritime Intelligence、Air Defense Monitoring、GNSS Interference Detection 和
            Communications Mapping 都跑在通用处理栈之上。
        - id: delivery-integration
          label: 交付与集成层
          detail: 每日下载、直接交付、云端访问、分析师软件、GIS 输出和面向客户的 API，把产品接入用户工作流。
    claimRefs:
