  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景和建议纪律
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 有足够公开证据支撑真实投资逻辑，但还不足以在当前公开市场标记下支撑无保留买入建议。逻辑起点是差异化 RF GEOINT
              产品定位、可见政府牵引力，以及规模已经足够重要的积压订单基础。HawkEye 还以相对强势状态上市：IPO 募资总额 $416
              million，公司用募集资金清理收购债务，新循环信贷额度延长流动性。这个组合优于许多近期航天上市公司带来的资产负债表故事。反向逻辑让结论必须对价格敏感。收入已在公开市场中因两个不同分母而被争论，客户集中度高，积压订单不等同于已资助且不可撤销的收入，公开记录也还没有清楚区分类软件订阅和项目型政府工作。这些缺口重要，因为股价已不再按困境或实验性航天公司定价。按运行日期附近约
              $2.97 billion 市值计算，HawkEye 的追踪倍数高于 BlackSky 和 Spire，即便还没完全计入更严苛的核心收入口径。因此正确建议是 TRACK /
              MONITOR，中等信心：业务在战略上看起来真实，但若没有更多披露或更便宜的入场价，当前价格给承销误差留下的安全边际很小。
