  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: HawkEye 360 依赖政府项目、监管机构、发射伙伴、贷款方和稀缺技术人才组成的紧密循环，把需求转成可持续收入。
    data:
      nodes:
        - id: d1
          label: 海军 / NGA / NRO / DoD 项目
          detail: 核心合同基础、续约证明和积压订单支撑。
        - id: d2
          label: 预算流程
          detail: 拨款时点决定授予和交付节奏。
        - id: d3
          label: 发射服务商
          detail: 公开来源显示，SpaceX 和 Rocket Lab 是可见部署路径。
        - id: d4
          label: FCC / BIS / OFAC
          detail: 许可、出口和制裁筛查必须保持常规化。
        - id: d5
          label: 贷款方与资本市场
          detail: IPO 流动性和浮动利率循环信贷提供支撑，但也约束业务。
        - id: d6
          label: 具备安全许可的 RF 人才
          detail: 专业工程师和集成负责人支撑交付质量。
        - id: d7
          label: 一体化 RF 平台
          detail: 星座、档案、算法和分析必须像一个系统一样运转。
        - id: d8
          label: 续约可信度
          detail: 客户信任把技术产出转成可持续收入。
      edges:
