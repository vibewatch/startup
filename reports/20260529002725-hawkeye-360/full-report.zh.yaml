  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 改变判断的条件
    rows:
      - - 投资逻辑：RF GEOINT 稀缺性和政府战略需求支撑真实溢价
        - 积压订单超过 $300M、政府收入占多数、国防端反复牵引，支撑其战略相关性
        - 如果客户集中度下降，第三方经常性收入更容易测算，判断会增强
      - - 投资逻辑：IPO 降低了近期资本结构风险
        - IPO 募集 $416M 毛额，收购债务已偿还，$125M 循环信贷延长了流动性
        - 如果管理层证明近期执行不再明显依赖后续股权融资，判断会增强
      - - 投资逻辑：IPO 定价视角并非明显非理性
        - ~$2.4-$2.42B 的口径看起来偏贵，但仍比后续跳涨后的价格更接近 BlackSky/Spire
        - 如果投资者拿到清晰的 2026 年收入桥、压低隐含倍数，判断会改善
      - - 反向逻辑：分母不稳定
        - 公开来源同时引用 $98.7M 和 $117.6M 作为 2025 年收入，差异会实质改变估值计算
        - 如果管理层统一收入桥，并说明投资者做可比时该用哪一口径，担忧会缓解
      - - 反向逻辑：积压订单听起来强，但不等于已获资金支持的硬收入
        - 监管文件称，积压订单可能包含可取消金额，以及部分合同未使用的上限额度
        - 如果公司披露已获资金支持的积压订单、取消权和消耗节奏细节，担忧会缓解
      - - 反向逻辑：当前公开市场估值容错很低
        - 按 May 28 市值，HawkEye 的后向倍数高于 Spire 和 BlackSky，但没有 Planet 式经常性经济性披露
        - 股价更低，或利润率、经常性和多元化证据实质改善，担忧会缓解
    notes: 反向逻辑主要对估值敏感，不是生死问题；价格更低或披露更好时，同一家公司可以变得有吸引力。
    claimRefs:
