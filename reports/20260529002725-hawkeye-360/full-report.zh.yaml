      - number: '5.2'
        title: 架构从卫星集群几何到云处理和 AI 分析都已可从公开资料读出
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 的官方技术页面和外部技术参考加在一起，透露出的架构信息超过一般防务科技官网。官方说法是，三十多颗卫星以三颗为一组在距地约 500 km 运行，基于集群的 TDOA 和 FDOA
              对发射源进行地理定位，原始采集在安全云环境中处理，AI 分析在产品通过云访问或 API 交付前加入波形分析、异常探测和多域融合。外部技术参考补足硬件图景：eoPortal 描述 Pathfinder 的 SDR
              载荷、70 MHz 到 6 GHz 调谐并通过 Ku-band 扩展到约 18 GHz、一个源自 NEMO 的 Pathfinder 平台约 13.4 kg，运行在 575 km
              太阳同步轨道，以及后续向更大卫星平台演进。专利组合很重要，因为它说明 HawkEye 360
              的差异化不只是轨道几何，还包括盲相干积分方法，目标是在不依赖经典到达方向假设的情况下，对弱信号或部分未知信号进行地理定位。
