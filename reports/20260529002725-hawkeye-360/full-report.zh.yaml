  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              不应把 HawkEye 360 放进整个“太空数据”市场，甚至也不应放进整个海事监测市场。官方产品集定义的是一个窄得多的层级：通过天基方式探测、地理定位并刻画 RF
              发射，把情报数据和分析交付到海事情报、频谱监测、GNSS 干扰探测、防空雷达监测和通信测绘中。因此，纳入支出围绕 RF 采集、告警、信号刻画，以及让运营人员把 RF
              探测用于防务和海事情报工作流的集成。排除支出包括发射、作为硬件的卫星、通用地球观测、大多数纯海事 SaaS，以及通用船舶 IoT 跟踪。这个区分很关键，因为现状替代方案已经能用
              AIS、地理围栏、天气或船岸连接解决部分工作流。HawkEye 的差异化从协作系统失灵处开始：暗船可以关闭 AIS
              或伪造位置，雷达和通信发射源可以位于拒止区域，政府用户又希望获得不受飞越限制的非涉密覆盖。技术页面、eoPortal 和 SatNow 的描述也说明，这个品类跨域但并非无限：三卫星 RF 地理定位、AI
              分析、云交付和 API 支持海事、干扰、EW 和边境安全工作流，但只适用于买方重视 RF 原生探测而非通用位置数据的场景。
