      - number: '8.2'
        title: 估值口径和分母纪律
        blocks:
          - type: paragraph
            body: >-
              估值背景异常嘈杂，因为投资者采用不同来源口径时，分子和分母都会移动。分子端，市场至少已经给出五个公开标记：Payload 约 $2.4 billion，Reuters/CNA 约 $2.42
              billion，Seraphim 约 $2.84 billion，GovConWire 首日开盘框架约 $3.15 billion，以及 CompaniesMarketCap 在运行日期附近约 $2.97
              billion。分母端，Washington Technology 引用 2025 年收入 $117.6 million，Satellite Today 引用 $98.7 million。监管文件通过列示
              $98.743 million 收入加 $18.917 million 关联方收入来对齐这些数字，但投资者仍面对一个不舒服的问题：HawkEye
              应该按总报告收入估值，还是按更接近干净第三方运营基础的关联方前口径估值？实际结果是筛选区间非常宽。运行日期附近，HawkEye 约按 2025 年总收入 25.2x 交易，或按关联方前口径约 30.1x
              交易；IPO 定价口径则分别接近 20.6x 和 24.5x。这个差距解释了为什么 IPO 价格比上市后 / 当前区间更站得住，即便对一个战略 RF 情报故事来说，这些标记都不是明显不可能。
