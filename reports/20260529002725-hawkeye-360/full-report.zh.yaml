  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant retained public-market and transaction references for government-adjacent geospatial
        and space-data valuation work; no perfect RF-GEOINT pure-play comparable exists.
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Spire Global
        - May 2026 市值对 FY2025 收入
        - $0.93B 市值，$71.6M 收入（约 13.0x 销售额）
        - 公开上市的太空数据公司，具备国防与 RF 相邻情报野心
        - 海事业务剥离扭曲收入基数，业务组合也比 HawkEye 更宽
      - - BlackSky
        - May 2026 市值对 FY2025 收入和积压订单
        - $1.91B 市值，$106.6M 收入（约 17.9x 销售额）；$345M 积压订单
        - 保留样本中最接近、政府占比较高的公开地理空间情报可比公司
        - 光学影像和 Gen-3 任务解决方案与 RF GEOINT 经济性不同
      - - Planet Labs
        - May 2026 市值对 FY2026 收入和积压订单
        - $18.31B 市值，$307.7M 收入（约 59.5x 销售额）；积压订单 >$900M；98% 经常性 ACV
        - 上沿溢价型地理空间数据平台可比公司，经常性、软件化特征更清楚
        - 平台宽得多，经常性指标也比 HawkEye 公开披露更干净
      - - Maxar 私有化交易
        - 2023 年交易估值对估计 2022 年收入
        - 以 $53/share、约 ~$6.4B 被收购；约为估计 2022 年收入的 ~3.2x
        - 战略地理空间情报底部参照，显示该领域确有买方需求
        - 这是成熟度高得多企业的历史私有化交易，不是当前公开市场倍数
      - - Satellogic SPAC
        - 2021 年股权估值和融资背景
        - $1.1B 股权估值，约 $274M 成长现金
        - 有助于警示：太空情报叙事曾被定价得多激进
        - 历史 SPAC 热潮期亢奋，不是干净的经营可比
    notes: 公开可比公司有助于保持相对估值纪律，但 HawkEye 仍介于低质量、政府占比高的可比公司与更干净的 Planet 溢价案例之间。
