      - number: '3.4'
        title: 切换成本、多供应商并用与分发权力
        blocks:
          - type: paragraph
            body: >
              HawkEye 周围的切换成本中等，而非绝对。HawkEye 销售的是通过订阅、直接交付和 API 接入运营工作流的数据与分析层。买方一旦调好采集模式、建立观察名单、把输出与其他 ISR
              层融合，并让运营工具内部接受 HawkEye 衍生信号，就会产生一定粘性。海军、NRO
              和盟友部委的重复项目强化了这种嵌入式信任。但公开记录也说明多供应商并用很正常。HawkEye、Unseenlabs、Kleos、ICEYE 和 Kpler 都把自己的产品描述为补充其他数据，而不是完全替代它们。


              AIS 仍是协作交通的基线记录系统，SAR 增加视觉确认和不受天气影响的场景证据，EO 提供快速的生活模式和目标探测，主权建设供应商则让大政府能把栈的一部分内化。这意味着客户可以增减
              HawkEye，而不必拆掉所有外围系统。真正的切换壁垒是工作流验证和采购信任，不是深技术锁定或公开标价优势。HawkEye 可以在采用期受益于这种互操作性，但如果更宽的 AIS
              加影像加内部工作流已经满足任务，同样的互操作性也会降低部分替代的成本。
