  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失输入
      - 重要性
      - 公开数据能说明什么
      - 具体尽调路径
      - 阻碍严重性
    rows:
      - - 产品收入结构和实际成交价
        - 需要区分可重复的数据经济性与较低毛利服务或定制主权项目
        - 公开来源只能确认存在多条货币化路径，并提供少数大型合同金额参照
        - 要求按产品披露收入结构、头部项目实际成交价，以及按产品划分的合同期限 / 续约情况
        - 阻塞
      - - 获客成本（CAC）、胜率、销售效率和回本周期
        - 用来检验漫长的政府销售周期在经济上是否有吸引力
        - 招股说明书确认销售周期漫长且成本高，但没有披露单位经济性
        - 要求披露销售管线转化率、按渠道划分的 CAC、按客户类型划分的销售周期长度，以及按队列划分的回本周期
        - 阻塞
      - - 产品层面毛利率和 D&A 分摊
        - 判断规模扩大是在改善经济性，还是只是在推高管理开销
        - 招股说明书给出销售成本和 opex 总额，但没有按产品披露分部利润率
        - 要求按订阅、服务、定制项目和硬件 / 基础设施组件桥接毛利率
        - 阻塞
      - - 在手订单质量和客户集中度桥接
        - 需要将表面在手订单转化为可信的未来现金回款
        - 在手订单规模大，但文件定义包含可取消金额和部分 IDIQ 上限金额；单一客户集中度高
        - 要求提供已获拨款积压订单瀑布、取消权、最大客户占比和收入确认时点假设
        - 重大
      - - IPO 后现金跑道和循环信贷使用情况
        - 需要借此判断未来增长是否仍依赖外部融资
        - 公开记录披露了 IPO 募资和循环信贷条款，但没有披露当前现金、当前提款或资本开支路线图
        - 要求提供当前现金、循环信贷使用情况、契约余量，以及包含资本开支和 M&A 假设的 2026-2027 年流动性模型
        - 重大
    notes: 这些缺口是本章建议聚焦财务尽调、而不是仅凭公开材料就放行投资判断的主要原因。
