  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: HawkEye 360 交付分层 RF 情报产品栈，而不是单一数据流
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 的公开产品面足够宽，可以支撑一个真实平台逻辑。公司如今为频谱监测、海事情报、防空雷达监测、GNSS 干扰探测和通信测绘呈现任务特定产品；较老的核心产品层仍重要，因为 RFGeo
              仍是标准化地理定位产品，RFIQ 暴露原始 I/Q 数据以支持更深信号利用，Mission Space 是面向分析师的软件层，Vessel Custody ID 则增加了一条 AI
              驱动的海事身份线索。交付模型也具体，而非抽象：技术页面描述每日下载、直接交付、云端访问和面向客户的 API；RFGeo 发布页称输出针对 GIS
              工具标准化；信号目录扩展页面称客户可以购买历史档案、新采集或区域态势感知订阅。这个组合意味着 HawkEye 360 在以多种包装模式销售运营 RF 工作流结果，而不只是孤立的卫星过境数据。
