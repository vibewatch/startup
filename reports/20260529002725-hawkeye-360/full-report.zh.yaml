        blocks:
          - type: paragraph
            body: >-
              John Serafini 是 HawkEye 360 最清晰的公众面孔。他的公开履历把创始人身份、军方背景、风险投资经历和长期行业暴露放在一起，支持创始人 -
              市场匹配，但也造成明显的关键人物集中度，因为他的名字反复出现在融资、治理和战略公告材料里。2026 年春季，治理可见度明显提高。4 月 2 日，公司将 Jonathan Shames 和 Frank
              Finelli 加入董事会，引入明确的财务、审计、防务投资和国家安全资历。几天后，HawkEye 360 更新顾问委员会阵容，并组建由 Richard Clarke 主席领导的 International
              Advisory Board，成员包括 Kurt Campbell 和 Mark Montgomery 等资深盟友安全人物。这些补强没有消除对 Serafini 的依赖，但显示公司在 IPO
              前后有意为创始人配置更可见的公共治理厚度。ISA 收购之后，组织规模也大幅抬升：2025 年回顾称合并后公司全球员工超过 400 人。仍不够清晰的是完整高管名单、委员会结构，以及 IPO
              后委员会的具体任命；公开证据能很好支撑头部治理补强，但无法完整还原运营组织图。
