      - number: '2.2'
        title: 买方分群、付款方与工作流所有者
        blocks:
          - type: paragraph
            body: >-
              最可见的买方基础仍是政府。HawkEye 披露的奖项点名美国海军、NRO/CSPO 和一个欧洲国防部；Washington Technology 称美国政府工作占 2025 年销售组合的
              61%。在这些项目里，付款方和使用者并不相同：采购办公室或部委出资，分析师和运营中心消化数据，输出再被融合进指挥工具或情报平台。这种工作流结构更偏好能嵌入现有 multi-INT
              栈的供应商，而不是替换整套系统。最清晰的商业邻接来自 2019 年 Windward 合作和 Windward 的 2026 年预测。两者共同显示第二类买方——海事风险、制裁、合规和保险工作流——在 AIS
              缺失或被操纵时需要 RF 作为验证层。但这些商业用户看起来仍更像嵌入式平台客户，而不是庞大的独立直销中小企业市场。因此，买方图谱从防务和情报预算开始，延伸到执法和盟友海事安全项目，最后才到商业合规平台，以及
              SkyWave 或 ORBCOMM 等替代可见性工具。
