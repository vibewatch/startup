  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 谁付款、谁使用，以及客户基础如何分层
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，HawkEye 360 不是把横向软件席位卖给成千上万企业账户；它是在少数以政府为中心的采购动作中销售任务特定 RF
              情报，并带有一些伙伴主导的商业分发。最清晰的付款方分群是美国防务和情报部门。Washington Technology 对 S-1 的报道将 NRO 点名为最大联邦客户，并把 NGA 和 Space Force
              列为其他关键客户；HawkEye 360 自己的 2025 年回顾称，公司在美国政府和盟友伙伴中扩张。但买方、使用者和受益方并不总是同一方。在 Pacific Islands 案例中，Australia 的
              DFAT 资助工作，Pacific Islands Forum Fisheries Agency 协调用途，岛国渔业和海事运营方从分析和培训中受益。NASA 增加了一个聚焦通信研究的民用机构买方，Windward
              则更适合理解为渠道和工作流集成商，而不是直接终端市场证明。这个区分很重要，因为直接合同客户、伙伴平台和任务用户即便触达同一产品家族，也会创造非常不同的留存和集中度画像。
