        title: 集中度、采购摩擦和伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              反向读法很直接：HawkEye 360 确有客户牵引力，但牵引力高度集中在国防和情报预算里，并受采购结构调节；这种结构能帮它，也能伤它。Washington Technology 的公开市场报道称，2025
              年销售额的 61% 来自美国政府工作，并称 NRO 是最大联邦客户，这意味着预算震荡或单个续约丢失都会有影响。采购数据也强化了这一点。NIWC Pacific 单一来源通知显示，HawkEye 360
              可以从既有地位和独特性中受益，但也说明采用被长预算周期、专业化国防采购流程卡住，而不是快速自助扩张。SpaceNews 补充说，即使用例有吸引力，商业 RF 供应商仍面临认知缺口，以及来自新 RF 进入者和
              SAR 供应商的竞争升温。最后，从公开证据看，公司的商业海事触达更像靠伙伴辅助，而非直接客户 Logo 很多；Windward 和捐助方支持的 FFA
              工作比具名私营企业更显眼。这不说明业务脆弱，但意味着今天的客户耐久性可能更多靠政府任务深嵌，而不是宽而多元的商业基础。
