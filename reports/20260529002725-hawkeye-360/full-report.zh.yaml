  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局概览与竞争框架
        blocks:
          - type: paragraph
            body: >
              HawkEye 360 的竞争集合，比只销售纯 RF 地理定位的那小群公司更宽。直接 RF 同行仍重要，但实际预算战场更大，因为许多买方关心的是任务结果——暗船探测、海事态势感知、EW 提示或战术 ISR
              速度——而不是 RF 这个品类本身。HawkEye 自身材料把公司定位为面向海事情报、GNSS 干扰监测、雷达和通信测绘，以及更广泛防务任务的工作流层；SpaceNews 则把商业 RF
              感知描述为一个战场，正在把 RF 专家、SAR 供应商和新平台建设者都拉进来。


              这个更宽的框架才适合尽调。买方可以用原生 RF 地理定位解决任务，也可以用影像加 AIS 融合，或围绕供应商硬件和内部分析师搭建主权系统。在这个组合里，HawkEye 目前看起来仍拥有最强的纯 RF
              姿态，因为它结合了 30 多颗卫星星座、基于集群的 TDOA/FDOA 地理定位，以及近期海军、NRO 和盟友防务奖项。但这种领先没有消除竞争；它主要改变压力来源。直接 RF
              领域很窄，而替代领域资本更充足，也往往更容易嵌入现有海事或 ISR 工作流。
