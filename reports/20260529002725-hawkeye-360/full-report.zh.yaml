chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与产品架构
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 是一家位于弗吉尼亚州 Herndon 的信号情报公司，成立于 2015 年，如今是 NYSE
              上一家新上市的防务科技发行人。公司面向公众的材料一贯把产品定义为为美国政府和盟友安全客户探测、地理定位并刻画射频发射，而不是讲一个泛化的地理空间数据故事。当前运营栈有四个相连层级：超过三十颗卫星的星座、云端地面架构、自研信号处理，以及通过订阅、直接交付和
              API 交付的 AI 分析。技术页面称卫星以三颗为一组在距地约 500 km 的轨道运行；eoPortal 另行描述了一个源自 2018 年 12 月 Pathfinder 任务的 30 颗微卫星星座，并记录
              RF 前端覆盖从 70 MHz 到约 18 GHz 的频率。公开用例集中在海事跟踪、GNSS 干扰探测、雷达监测和通信测绘，也与第三方报道中对暗船和 GPS
              干扰器探测需求的描述一致。总体看，章节证据支持一句简单描述：HawkEye 360 卖的是天基 RF 情报数据和分析，不是发射服务，也不是纯 SaaS 抽象层。
