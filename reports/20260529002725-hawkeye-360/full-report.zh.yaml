      - number: '5.3'
        title: 产品集成越来越是在组合精确地理定位、扫描、处理和分析师 工作流
        blocks:
          - type: paragraph
            body: >-
              最重要的产品开发故事，是 HawkEye 360 正从精确地理定位扩展为更完整的 RF 利用栈。RFGeo 仍通过把探测结果转为 GIS 友好的地理位置来锚定商业产品面，但 RFIQ 以覆盖极宽频率范围的原始
              I/Q 数据扩展采集灵活性，Mission Space 将采集和分析打包成可用的分析师控制台，任务套件则把这些技术原语转译为具体防务工作流。两笔近期收购让这幅图更清晰。Maxar RF Solutions
              交易增加了区域宽带扫描、两颗在轨卫星，以及一个 1.4-40 GHz 档案，补足 HawkEye 360 的精确地理定位。ISA 收购增加算法、边缘和云处理、载荷设计和 FPGA
              固件，应该加深处理层，而不只是轨道层。合在一起，公开记录支持基于栈集成的差异化：集群地理定位、更宽频段发现、分析师软件、可共享非涉密输出和任务特定自动化，正在被组合成一个运营模型。
