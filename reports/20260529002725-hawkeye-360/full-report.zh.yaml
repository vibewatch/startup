      - number: '2.4'
        title: 需求驱动、采用约束与矛盾
        blocks:
          - type: paragraph
            body: >-
              需求驱动是真实且多线并行的。SpaceNews 称，航运中断和 GPS 干扰暴露盲点后，市场对 RF 监测的兴趣激增；官方任务页面则显示暗船探测、GNSS 干扰响应、防空预警和通信测绘带来直接任务拉力。NOAA
              GOES 干扰案例很重要，因为它把产品放进一个具体民用基础设施问题里，而不仅是营销场景。Windward 的 2026
              年预测又增加了政策和合规驱动：制裁规避、暗船队和更深的公私合作，正在提高多源遥感的价值。采用约束同样清晰。经常性区域订阅的价格不公开，外部买方无法干净对标 ROI。商业 RF 数据通常补充
              AIS、影像和主权采集，而不是替代它们，因此买方必须已有集成路径和分析团队。大多数已披露支出仍由政府主导，这意味着采购时间和任务优先级比经典自下而上的 SaaS
              席位扩张更重要。最后，国际竞争正在扩宽；SpaceNews 还指出，与商业 RF 供应商最先验证的海事用例相比，陆基雷达地理定位在技术上仍更难。
