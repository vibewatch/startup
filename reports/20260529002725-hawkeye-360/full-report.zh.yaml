        title: 增长、在手订单与利润结构线索
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 已不再是收入前的前沿太空故事。最终招股书支持 2025 年总收入 $117.66M、净利润 $2.673M，以及在手订单 $302.719M；2026 年第一季度初步收入已达到
              $48.2M-$50.2M。公开记录中最有用的调和，是同一份文件也显示关联方收入前收入 $98.743M，另有一条 $18.917M 的关联方收入；这个桥接可以合理解释为什么外部文章会交替引用约 $98.7M 或
              $117.6M 作为 2025 年收入。收入质量不错，但并不完美。在手订单相对于当前收入很大，但文件对在手订单的定义足够宽，包含合同中可取消部分和未使用的单一奖项 IDIQ
              上限，因此投资者不应把在手订单与锁定的经常性 ARR 一一等同。成本端，公司更像一个已规模化的防务数据平台，而不是纯软件供应商：直接和间接销售成本相对收入较低，但 SG&A 和 R&D 合计在 2025
              年仍消耗超过 $75M。管理层认为，固定成本杠杆、数据复用和资本强度更低的 Block 3
              卫星会随时间扩张利润率。方向上可能成立，但缺少产品级毛利率，公开记录仍无法证明最可规模化的经济性到底来自订阅、分析还是定制项目。
