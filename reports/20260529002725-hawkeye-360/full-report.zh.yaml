  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 客户集中、预算阻力以及发射或集成延误，都会传导到积压订单信心、融资观感和估值。
    data:
      nodes:
        - id: n1
          label: 政府客户集中
          detail: 联邦需求仍是主要收入锚点。
        - id: n2
          label: 预算 / 采购阻力
          detail: 持续决议和采用缓慢会推迟授予和启动。
        - id: n3
          label: 发射或入役延误
          detail: 任务问题可能削弱重访提升，或迫使资本重新部署。
        - id: n4
          label: 集成与人才压力
          detail: Maxar、ISA 和稀缺的具备安全许可的人才都会抬高执行复杂度。
        - id: n5
          label: 交付 / 信心压力
          detail: 如果产品或节奏低于预期，客户信任会减弱。
        - id: n6
          label: 积压订单 / 续约压力
          detail: 项目时点和续约信心会走弱。
        - id: n7
          label: 利润率与融资压力
          detail: 支持、资本开支和融资需求上升，灵活性下降。
        - id: n8
          label: 估值压缩
          detail: 市场会更激进地折价执行和集中风险。
