  - id: TI001
    title: 收入来源表
    columns:
      - 收入来源
      - 机制
      - 确认方式 / 合同形式
      - 公开定价参照
      - 质量 / 注意事项
      - 尽调要求
    rows:
      - - RF 数据订阅 / 授权产品
        - 面向政府用户，持续提供 RF 数据、信息产品和服务访问
        - 数据交付时按时点确认；ASC 606 附注点名提到重复性月度订阅安排
        - 无公开标价
        - 看起来像软件，但实际成交价和续约情况未披露
        - 要求按产品披露年经常性收入（ARR）、客户数、续约率和平均月合同金额
      - - 运营任务指派和固定价格项目工作
        - 由客户指派的信号采集和任务工作流，按固定价格或工作量级别合同交付
        - 视授标形式而定，可为固定总价、工作量级别、成本加成或成本报销
        - Navy IPMDA 续约，$98.8M 固定总价 IDIQ
        - 战略价值高，但若采集失败或成本超支，利润率会被压缩
        - 要求按主要固定价格项目披露毛利率和返工发生率
      - - 培训、支持和嵌入人员
        - 赋能、支持工时、嵌入式专业能力和现场利用支持
        - 固定费用支持按期间确认；专业服务按工时和材料计费
        - 公开金额未披露
        - 毛利率可能低于纯数据，但有助于扩张和锁定
        - 将服务收入从核心数据收入中拆出，并披露可计费利用率
      - - 主权 / 混合系统和专用容量
        - 为盟国政府定制卫星集群、专属算法和本国境内基础设施
        - 项目制合同，加后续重复性数据采购
        - 欧洲 MoD 授标最高 $75M；NRO 延期披露 23 个月专用资金，但未披露金额
        - 规模和粘性可能很高，但定制经济性不透明，资本需求可能上升
        - 提供每个项目的资本开支、合同期限，以及 HawkEye 是否保留资产所有权
      - - 经销商 / 渠道和任务集成安排
        - 产品通过经销商安排交付，或打包进更宽的任务工作流
        - 产品交付给经销商时，按扣除经销商折扣后的净额确认
        - 无公开价格点
        - 有助于分发，但会遮蔽实际成交价和终端客户经济性
        - 披露渠道结构、经销商抽成率和各渠道利润率
    notes: 公开来源确认了收入机制和少数合同金额，但没有披露按收入来源划分的标准化实际定价或收入结构。
    enumerationScope:
      coverage: partial
      basis: >-
        Based on the 2026 prospectus accounting footnote plus public contract announcements; customer-level pricing is
        not publicly disclosed.
