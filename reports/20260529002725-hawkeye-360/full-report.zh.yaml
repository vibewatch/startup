      - number: '4.4'
        title: 财务结论与剩余公开数据缺口
        blocks:
          - type: paragraph
            body: >-
              基于财务的看法是建设性的，但不干净。公开监管文件支持一家公司拥有真实经审计收入、2025 年正净利润、异常强劲的在手订单增长，以及 IPO
              后显著改善的流动性。文件也揭示了投资案例为何仍可能令人失望：政府集中度高，2025 年前九个月一名客户贡献约 63% 收入；在手订单并非纯粹的已资助经常性需求；固定价格项目会把执行风险转回 HawkEye
              360。最重要的是，公开记录仍太稀疏，无法搭出完整承销模型。投资者看不到 ARR、续约队列、按产品实现的定价、客户级毛利率、获客成本（CAC）、回本周期，也看不到计划资本开支（capex）和任何循环贷款使用之后的
              IPO
              后现金跑道。因此，正确结论不是“数字不好”；而是“这些数字如今足够可信，值得尽调，但还不足以在公开资料里完成尽调。”下一轮尽调应少关注收入是否存在，更多关注收入质量、在手订单消化曲线、产品级利润贡献，以及未来增长究竟是真正现金高效，还是只是刚融到钱。
