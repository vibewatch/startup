  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 战略稀缺性、积压订单支撑、集中度风险和当前公开市场定价，如何共同指向 TRACK / MONITOR 建议。
    data:
      nodes:
        - id: demand
          label: 战略需求：RF GEOINT 稀缺，加上政府客户牵引
          type: input
        - id: backlog
          label: 支撑：$302.7M 积压订单，IPO 后资产负债表更强
          type: input
        - id: concentration
          label: 风险：美国政府占比 61%；2025 年部分时期单一客户贡献约 63% 收入
          type: input
        - id: opacity
          label: 不透明：收入口径冲突，利润率结构未知，股权结构表仍未彻底简化
          type: input
        - id: pricing
          label: 公开价格：接近生成日时约为总收入的 ~25x，或核心收入的 ~30x
          type: process
        - id: decision
          label: TRACK / MONITOR，置信度中、风险高
          type: output
        - id: upgrade
          label: 只有收入分母更清晰，或入场价格明显更便宜，才上调判断
          type: output
      edges:
        - from: demand
          to: pricing
        - from: backlog
          to: pricing
        - from: concentration
          to: pricing
        - from: opacity
          to: pricing
        - from: pricing
          to: decision
        - from: decision
          to: upgrade
    approximationNotes: 这条流程是决策框架，不是确定性模型；它说明公司为何有战略吸引力，但股票估值仍显饱满。
