  productSummary: >
    HawkEye 360 销售天基 RF 情报数据与分析，而不是发射服务或通用地理空间软件。公开产品面包括 RFGeo、RFIQ、Mission Space、Spectrum Monitoring、Maritime
    Intelligence、Air Defense Radar Monitoring、GNSS Interference Detection、Communications Mapping 和 Vessel Custody
    ID，并通过订阅、直接交付、云访问和 API 交付。章节材料最清楚支持的技术差异化，是基于集群的 TDOA/FDOA 地理定位、原始 I/Q 采集、更宽频段扫描、分析师软件，以及可共享的非涉密输出组合在一起。
  customerFocus: |
