companyProfile:
  summary: >
    HawkEye 360 是一家位于弗吉尼亚州 Herndon 的 RF 情报公司，成立于 2015 年，由创始人兼 CEO John Serafini 领导。公司运营一套天基 RF 采集与分析平台，围绕 30
    多颗卫星星座、安全云处理，以及服务海事情报、防空雷达监测、GNSS 干扰探测和通信测绘的任务软件搭建。HawkEye 360 于 2026 年 5 月以每股 $26 定价发行 16,000,000 股，募资总额约 $416
    million，随后以 HAWK 代码在 NYSE 上市。公开证据显示，公司在美国和盟友政府侧有重复采购牵引，包括 $98.8 million 海军续约、23-month NRO 扩展，以及最高 $75 million
    的欧洲防务奖项。公开财务口径仍有些嘈杂：监管文件支持 2025 总收入 $117.660 million、净利润 $2.673 million，而部分报道仍引用关联方收入前的收入线。
  foundedDate: '2015-01-01'
  founders:
