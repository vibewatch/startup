  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 经营假设
      - 估值逻辑
      - 指示性价值区间
      - 概率信号
      - 主要触发器
    rows:
      - - 悲观
        - 积压订单消耗快于补充，客户集中度延续，投资者把更多收入视为项目型而非订阅型
        - 12x-15x 总 2025 年收入，或在质量更低的分母上约低到中十几倍
        - $1.2B-$1.8B
        - ~25%：如果预算时点滑坡或上市后首批季度表现失望，则有可能
        - 积压订单下台阶、集中度冲击或利润率失望
      - - 基准
        - 积压订单合理转化，流动性保持舒适，但集中度和收入结构不透明，让市场难以给出 Planet 式溢价
        - 18x-23x 总 2025 年收入；大致在 IPO 定价附近或略高，但低于上市跳涨后的亢奋价格
        - $2.1B-$2.7B
        - ~50%：最符合当前证据
        - 执行稳定，但披露只部分改善
      - - 乐观
        - HawkEye 证明经常性收入耐久、客户更多元，并维持足够高的战略相关性，获得公开市场溢价待遇
        - 25x-30x 总 2025 年收入；即便政府占比较高，仍能维持溢价倍数
        - $2.9B-$3.6B
        - ~25%：需要更干净的分母和更强执行证据
        - 积压订单转化、经常性更清晰、集中度下降
    notes: 这些区间是方向性筛选，不是 DCF；它们刻意展示：争议大多来自分母选择和倍数容忍度。
    claimRefs:
