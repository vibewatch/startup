  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价代理与真实 GTM
        blocks:
          - type: paragraph
            body: >-
              监管文件呈现的收入引擎，比简单的“卫星数据订阅”故事更细。HawkEye 360
              向美国和盟友政府买方销售数据、分析、培训、嵌入式支持和定制化主权能力项目的组合；公开合同显示，单个项目价值可达数千万美元。公司自身会计脚注确认，收入来自多种合同形态——成本加成、固定总价、工时材料、订阅和支持服务——并且这些形态的收入确认节奏不同。这很重要，因为业务可能在一个季度看起来像软件，在另一个季度又像项目制。最强的公开定价锚不是标价，而是合同奖项：一个
              $98.8M 海军固定总价 IDIQ，以及一个最高 $75M 的欧洲国防部项目。这些奖项支持 HawkEye 360 能把高价值任务工作流变现的判断，但没有揭示标准化的每次采集价格、每用户价格或续约经济性。GTM
              动作也偏政府、节奏慢。招股书称，关系通常从测试评估工作开始，再扩展成运营项目；但它也警告，采购周期、临时拨款决议和多层决策会让成交和扩张耗时且昂贵。
