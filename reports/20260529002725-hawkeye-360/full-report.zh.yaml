      - number: '8.3'
        title: 可比公司组为何只能提供方向感
        blocks:
          - type: paragraph
            body: >-
              可比公司组有方向价值，但并不干净；本章应保留这种模糊，而不是把它洗掉。Spire 和 BlackSky 是最接近的公开警示可比对象，因为它们也把天基数据和分析卖进政府重工作流，但它们当前收入倍数显著低于
              HawkEye。Spire 约为 13x 追踪收入，BlackSky 约为 17.9x；两者仍明确谈国防、积压订单和关键任务用例。Planet 是相反的问题：它是强得多的溢价可比对象，有超过 $900
              million 的积压订单、98% 经常性 ACV，以及约 59.5x 追踪收入倍数，但它也是更宽、更成熟的地理空间数据平台，公开披露的经常性软件特征比 HawkEye 清楚得多。Maxar 以 $6.4
              billion 私有化提供了地理空间情报的战略底价参照，但那是一笔成熟公司收购，估计收入倍数只有约 3.2x，因此反而削弱了“只要战略相关就能支撑很高公开市场倍数”的简单说法。反向历史背景同样重要。CNBC 的
              SPAC 现实检查显示，一旦增长或执行低于预期，航天情报叙事会多快重定价。合起来看，可比组说明 HawkEye 值得高于困境航天桶，但还不能证明 HawkEye 值得 Planet 式溢价。
