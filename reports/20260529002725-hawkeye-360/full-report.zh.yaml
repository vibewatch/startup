      - number: '3.3'
        title: SAR、EO、AIS 与主权自建替代方案
        blocks:
          - type: paragraph
            body: >
              替代方案领域参与者众多，资金往往比直接 RF 领域更足。Spire 仍营销 RF 地理定位和星座服务，但其原海事 URL 如今跳转到 Kpler
              AIS，提醒人们基线船舶跟踪仍是建立在协作应答器和巨大覆盖之上的根深蒂固现状层，而不是建立在发射源归因之上。ICEYE、Capella 和 BlackSky 从相反方向竞争：它们用 SAR 或高重访 EO
              解决邻接 ISR 问题，而不是原生 RF 地理定位。ICEYE 拿出最强的已披露规模信号，2025 年收入超过 €250 million，在手订单达 €1.5
              billion，并明确营销暗船、船对船转运和边境监测工作流。Capella 把全天候 SAR 与客户自有太空系统结合，BlackSky 则销售快速、合同支撑的 EO 任务调度，配合 AI 目标探测和 90
              分钟内交付。


              当买方更重视持久影像、快速任务调度或主权所有权，而不是发射源级归因时，这些供应商可以赢走同一批项目资金。LeoLabs 和 Aerospacelab
              目前更多是预算邻接而非直接竞争，但它们重要，因为它们说明“太空情报”和主权卫星建设预算正在扩宽。Aerospacelab 明确提供 RF 感知载荷和交钥匙星座能力，使未来客户自建 RF
              系统变得合理。因此，HawkEye 的差异化不仅要经受直接 RF 比较，还要顶住更大一批邻接系统；这些系统可能足以满足买方的真实采购目标。
