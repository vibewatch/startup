      - number: '2.3'
        title: 证据约束下的规模测算口径
        blocks:
          - type: paragraph
            body: >-
              把规模证据视为一组口径，而不是单一 TAM 时，结论最稳。最窄、验证度最高的底线，是已披露当前项目价值：海军第四年 IPMDA 续约 $98.8 million，加上欧洲防务奖项最高 $75
              million，在未计入金额未披露的 NRO 扩展前，至少 $173.8 million。再往上一层，美国海事安全和 MDA 预算创造了大得多的邻接池：State Department 称美国自 2017
              年以来已在印太海事安全投入超过 $1.5 billion，其中包括超过 $120 million 的 Quad IPMDA 支持、2020 年以来 $293 million 的 MSI 资金，以及近 $955
              million 的 IMET/FMF 东亚和太平洋海事能力支持。到了最宽的分析师层面，公开报告分歧很大。Technavio 将海事信息描述为约 $2.12 billion 的机会，并到 2030 年有 $1.35
              billion 的增量增长；Mordor 认为 2026 年海事信息市场为 $3.19 billion；TBRC 则把 2026 年海事监测放在 $28.39 billion，因为它纳入传感器、雷达、AIS
              接收器和软件。这些都是有用的背景窗口，不是干净的 HawkEye TAM。
