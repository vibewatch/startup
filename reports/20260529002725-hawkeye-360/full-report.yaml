      The flow abstracts across mission suites and is meant to show the common operating pattern rather than one
      product's exact UI sequence.
    data:
      nodes:
        - id: mission-need
          label: Mission requirement
          detail: >-
            User identifies an area of interest, signal family, or analytic question such as dark vessels, GNSS jammers,
            air-defense radars, or suspicious communications activity.
        - id: tasking
          label: Tasking or subscription request
          detail: >-
            Analysts request collections by geography, time, frequency, or bandwidth or consume recurring subscription
            outputs.
        - id: space-collection
          label: Space collection
          detail: Tri-satellite clusters capture emissions and associated signal characteristics across the area of interest.
        - id: processing
          label: Geolocation and characterization
          detail: >-
            TDOA, FDOA, patented signal-processing methods, and AI analytics convert captures into detections,
            geolocations, and contextualized activity.
        - id: analyst-layer
          label: Analyst exploitation
          detail: >-
            Mission Space, RFGeo, RFIQ, and mission-suite workflows expose visualizations, raw data, or targeted
            products for analysis.
        - id: integration
          label: Integration and action
          detail: >-
            Outputs are delivered by API, cloud access, direct download, or GIS integration to support tracking,
            warning, prioritization, and enforcement.
      edges:
        - from: mission-need
          to: tasking
          label: define collection need
        - from: tasking
          to: space-collection
          label: order or subscribe
        - from: space-collection
          to: processing
          label: capture RF signals
        - from: processing
          to: analyst-layer
          label: produce geolocated analytics
        - from: analyst-layer
          to: integration
          label: deliver workflow output
        - from: integration
          to: tasking
          label: refine next collection
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE017
      - CE018
      - CE026
      - CE027
