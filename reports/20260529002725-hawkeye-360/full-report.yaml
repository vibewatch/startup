  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 should not be placed in the entire 'space data' market or even the entire
              maritime-surveillance market. The official product set defines a much narrower layer: space-based
              detection, geolocation, and characterization of RF emissions delivered as intelligence data and analytics
              across maritime intelligence, spectrum monitoring, GNSS interference detection, air-defense radar
              monitoring, and communications mapping. Included spend therefore sits around RF collections, alerting,
              signal characterization, and the integrations that let operators use RF detections inside defense and
              maritime-intelligence workflows. Excluded spend includes launch, satellites as hardware, general earth
              observation, most pure maritime SaaS, and generic vessel-IoT tracking. That distinction matters because
              status-quo substitutes can already solve parts of the workflow with AIS, geofencing, weather, or
              ship-to-shore connectivity. HawkEye's differentiation begins where cooperative systems break: dark vessels
              can switch off AIS or spoof positions, radar and communications emitters can sit in denied areas, and
              government users want unclassified coverage without overflight constraints. The technology, eoPortal, and
              SatNow descriptions also show why the category is cross-domain but not unlimited: tri-satellite RF
              geolocation, AI analytics, cloud delivery, and APIs support maritime, interference, EW, and
              border-security workflows, but only where the buyer values RF-native detection rather than generic
              location data.
