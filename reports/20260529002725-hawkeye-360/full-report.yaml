      - number: '8.3'
        title: Comparable set and why it is only directionally useful
        blocks:
          - type: paragraph
            body: >-
              The comparable set is directionally useful but not clean, and the chapter should preserve that ambiguity
              rather than wash it out. Spire and BlackSky are the closest public caution comps because they also sell
              space-derived data and analytics into government-heavy workflows, yet their current revenue multiples are
              materially lower than HawkEye's. Spire screens near 13x trailing revenue and BlackSky near 17.9x, while
              both still talk explicitly about defense, backlog, and mission-critical use cases. Planet is the opposite
              problem: it is a much stronger premium comp with over $900 million of backlog, 98% recurring ACV, and a
              roughly 59.5x trailing revenue multiple, but it is also a broader, more mature geospatial data platform
              with much clearer recurring-software characteristics than HawkEye has publicly disclosed. Maxar's $6.4
              billion take-private adds a strategic-floor reference for geospatial intelligence, yet it was a mature
              takeout at only about 3.2x estimated revenue and therefore cuts against any simple claim that strategic
              relevance alone justifies a very high public multiple. The adverse historical context matters too. CNBC's
              SPAC reality check shows how quickly space-intelligence narratives re-rate when growth or execution
              underdeliver. Taken together, the comp set says HawkEye deserves more than a distressed space bucket, but
              it does not yet prove HawkEye deserves a Planet-like premium.
