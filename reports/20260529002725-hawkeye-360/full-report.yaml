      - - Unseenlabs
        - direct RF peer
        - 15 satellites published by ESA; €85M 2024 raise; €120M total funding
        - maritime security plus insurers offshore and trade users
        - Mono-satellite RF geolocation and vessel fingerprinting with maritime-first focus
        - Published scale trails HawkEye and public workflow evidence remains more maritime-centric
      - - Kleos
        - direct RF peer / distressed
        - 16 launched satellites; index lists cancelled-bankrupt status and no employees as of Oct. 2024
        - governments and commercial users needing RF tip-and-cue
        - Four-satellite clusters and API-delivered LOCATE output
        - Corporate continuity risk likely matters more than feature parity in 2026
      - - Spire / Kpler AIS
        - incumbent maritime alternative
        - 745+ Spire customers; 175+ satellites launched; 300k+ vessels tracked daily via Kpler AIS
        - maritime tracking logistics compliance and government awareness
        - Massive cooperative-traffic coverage plus RF and constellation-service heritage
        - AIS depends on cooperative transmissions and says less about emitter identity
      - - ICEYE
        - SAR substitute
        - €250M+ 2025 revenue; €1.5B backlog; 1000+ employees
        - defense-intel border and maritime-security buyers
        - All-weather SAR imagery, multiple daily revisits, sovereign systems
        - No native RF emitter geolocation; usually needs fusion with AIS or other data
      - - Capella Space
        - SAR substitute / sovereign builder
        - Sub-0.25 m SAR; 2-15 revisits/day; IonQ-acquired in 2025
        - defense-intel and maritime-awareness users
        - High-revisit SAR plus fast tasking and customer-owned mission systems
        - Imagery-led workflow is different from RF-native attribution
      - - BlackSky
        - EO / tactical ISR substitute
        - Up to 15 images/day; under-90-minute assured delivery; Gen-3 scaling by end-2026
        - defense-intel teams prioritizing rapid EO
        - Time-diverse EO and AI object detection at operational speed
        - Optical stack does not geolocate emitters and can degrade when visual conditions matter
      - - LeoLabs
        - adjacent orbital-intelligence rival
        - Commercial radar network and orbital analytics platform
        - military space commands civil agencies and commercial operators
        - Adjacent pull on space-intelligence budgets and authoritative LEO catalog
        - Mission set is orbital rather than maritime or terrestrial RF
      - - Aerospacelab
        - entrant / sovereign-build enabler
        - 400+ staff; 500 satellites/year planned; RF sensing payload option
        - governments and primes wanting sovereign infrastructure
        - Turnkey RF-sensing-capable platforms and megafactory scale
        - Not yet an operating RF data brand on HawkEye's level
