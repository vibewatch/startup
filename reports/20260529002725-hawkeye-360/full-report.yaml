  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Backlog quality deterioration
        - Backlog drops sharply without equivalent booked replenishment or funded-detail support
        - Undercuts the argument that visibility justifies a premium public multiple
        - Re-rate immediately toward bear-case valuation band
      - - Concentration remains extreme
        - A single customer stays near dominant share of revenue or receivables with little diversification progress
        - Makes the premium fragile to one procurement decision
        - Keep recommendation at track or downgrade on any operating wobble
      - - Margin / mix disappointment
        - Public results suggest project-heavy or service-heavy economics rather than recurring data economics
        - Breaks the case for paying above BlackSky/Spire-like multiples
        - Cut fair-value band and require new diligence before adding exposure
      - - Liquidity starts tightening again
        - Revolver draws or covenant pressure emerge despite IPO proceeds
        - Signals the IPO did not truly solve funding risk
        - Treat as a thesis break until capital path is reset
      - - Space-data multiple compression returns
        - Public peers de-rate again on weak execution or budget pressure
        - Shows HawkEye is not insulated from broader sector re-pricing
        - Avoid averaging in above disciplined entry ranges
    notes: Each trigger is designed to be monitorable from public reporting or widely covered contract and market signals.
    claimRefs:
      - CV015
      - CV017
      - CV021
      - CV037
      - CV040
      - CV046
      - CV047
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue bridge
        - Bridge from $98.743M pre-related-party revenue to $117.660M total 2025 revenue
        - Without a clean denominator, valuation arguments can be manipulated by lens choice
        - 'Management / CFO: provide GAAP and third-party operating revenue bridge'
      - - Backlog waterfall
        - Funded vs cancellable backlog, option content, and recognition timing
        - Investors need to know how much of the $302.7M backlog is truly hard visibility
        - 'Management / contracts: provide backlog waterfall by customer and funding status'
      - - Revenue mix and margin
        - Subscription, analytics, sovereign program, services, and related-party margin split
        - This is the core question behind whether HawkEye deserves a software-like premium
        - 'Management / finance: provide product-line gross margin and recurring mix history'
      - - Cap table and float
        - Fully diluted post-IPO share count, lockup cadence, and Series E cleanup mechanics
        - Public investors need to understand dilution and any leftover downside asymmetry
        - 'IR / counsel: deliver cap-table bridge and lockup schedule'
      - - Customer diversification plan
        - Concrete path to reduce single-customer reliance
        - A premium multiple is fragile if one customer can move the story materially
        - 'Management / sales: show diversification pipeline and renewal schedule'
      - - Budget resilience
        - Sensitivity of revenue and backlog to U.S. budget timing, CRs, and allied procurement delays
        - Government-heavy premium valuations compress quickly when procurement timing slips
        - 'Management / FP&A: provide downside sensitivity and recent procurement-cycle data'
    notes: >-
      These asks are intentionally valuation-critical; each one directly affects either the denominator, the multiple,
      or the downside path.
    claimRefs:
      - CV015
      - CV017
      - CV048
      - CV049
      - CV051
      - CV052
