  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Government concentration, leverage, and licensing rules are the first-order risk stack
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360’s first-order risk is not that the market lacks need; it is that the company sits at the
              intersection of concentrated public-sector demand, persistent capital intensity, and regulated
              national-security workflows. The strongest disclosed concentration fact is the 61% U.S. government revenue
              mix for 2025, reinforced by a backlog of roughly $303 million that still depends on budget timing, option
              exercises, and procurement continuity. The capital side remains live as well: the company paired a 2026
              IPO with a $125 million revolving credit facility whose covenants and government-contract default triggers
              make contract health relevant to financing flexibility, not just revenue. Regulatory posture is similarly
              double-edged. HawkEye 360 presents more than 200 export licenses as a moat, but that also means export
              screening, sanctions compliance, and orbital-debris application work are not back-office details; they are
              operating gates for growth. The mitigation is real—public-market access, a longer-dated revolver, and
              multiple agency relationships—but the residual exposure remains high because a single adverse regulatory
              or procurement event can cascade into backlog confidence, debt optics, and valuation.
