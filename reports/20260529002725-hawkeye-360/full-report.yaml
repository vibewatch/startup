  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Proxies, and Go-to-Market Reality
        blocks:
          - type: paragraph
            body: >-
              The filings show a more nuanced revenue engine than a simple “satellite data subscription” story. HawkEye
              360 sells a mix of data, analytics, training, embedded support, and bespoke sovereign-capability programs
              to U.S. and allied government buyers, with public contracts suggesting that individual programs can be
              worth tens of millions of dollars. The company’s own accounting footnote confirms that revenue comes
              through many contract forms—cost-plus, firm-fixed-price, time-and-materials, subscriptions, and support
              services—and that recognition timing differs across those forms. That matters because the business can
              look software-like in one quarter and program-like in another. The strongest public pricing anchors are
              not list prices but contract awards: a $98.8M Navy firm-fixed-price IDIQ and a European Ministry of
              Defense program worth up to $75M. Those awards support the idea that HawkEye 360 can monetize high-value
              mission workflows, but they do not reveal normalized price per collection, price per user, or renewal
              economics. The GTM motion is also government-heavy and slow. The prospectus says relationships often begin
              with test-and-evaluate work and then expand into operational programs, but it also warns that procurement
              cycles, continuing resolutions, and multi-layer decision making make closing and scaling deals time
              consuming and expensive.
