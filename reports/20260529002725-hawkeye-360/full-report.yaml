        - id: cloud-api
          label: Cloud and API delivery
          detail: Collections API, direct delivery, and cloud access connect products to customer workflows.
        - id: analyst-tools
          label: Analyst software and mission suites
          detail: Mission Space and mission-specific products translate technical outputs into operational decisions.
