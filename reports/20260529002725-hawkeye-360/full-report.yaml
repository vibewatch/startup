      - number: '4.4'
        title: Financial Verdict and Remaining Public-Data Gaps
        blocks:
          - type: paragraph
            body: >-
              The financially grounded view is constructive but not clean. Public filings support a company with real
              audited revenue, positive 2025 net income, unusually strong backlog growth, and materially improved
              liquidity after the IPO. They also reveal why the investment case can still disappoint: government
              concentration is high, one customer represented about 63% of revenue in the first nine months of 2025,
              backlog is not purely funded recurring demand, and fixed-price work can transfer execution risk back onto
              HawkEye 360. Most importantly, the public record is still too sparse for a full underwriting model.
              Investors cannot see ARR, renewal cohorts, realized pricing by product, customer-level gross margins, CAC,
              payback, or the post-IPO runway after planned capex and any revolver usage. That means the right
              conclusion is not “the numbers are bad”; it is “the numbers are now credible enough to justify diligence,
              but not detailed enough to finish diligence in public.” The next diligence session should therefore focus
              less on top-line existence and more on revenue quality, backlog burn profile, product-level margin
              contribution, and whether future growth is truly cash efficient or simply newly financed.
