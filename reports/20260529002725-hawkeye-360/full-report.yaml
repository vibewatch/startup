  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Product performance depends on orbital geometry, signal processing, acquisitions, and operational delivery
      infrastructure all working together.
    approximationNotes: >-
      This DAG focuses on externally visible dependencies; internal suppliers, classified customers, and unpublished
      components are omitted.
    data:
      nodes:
