      - number: '3.2'
        title: Direct RF peers and architecture trade-offs
        blocks:
          - type: paragraph
            body: >
              Unseenlabs is the clearest live head-to-head peer. It positions itself as an RF GEOINT company for
              maritime monitoring, had 15 satellites published by ESA as of August 2024, raised €85 million in 2024, and
              is pushing a 2026 next-generation constellation that extends beyond maritime into land and space
              surveillance. The key architectural difference is substantive, not cosmetic. Unseenlabs and independent
              coverage emphasize mono-satellite RF collection as resilient and cost-effective, while HawkEye publicly
              emphasizes cluster-based TDOA/FDOA geolocation, richer classification, and broader multi-mission
              analytics. That is a real design fork inside the same category.


              Kleos is the other recurring direct-RF name, but it looks structurally weakened rather than like an
              aggressive 2026 pricing rival. Its site still describes API-delivered RF intelligence and prior NRO work,
              and trade coverage shows that its LOCATE product once delivered useful RF cueing data. Yet NewSpace Index
              records a cancelled/bankrupt status and says contracts had been terminated with no employees as of October
              2024. Net: the pure-play RF field exists, but the live commercial set appears shallow. HawkEye's current
