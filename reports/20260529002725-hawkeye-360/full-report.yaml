    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow challenge
      - HawkEye 360 solution
      - Measurable benefit
      - Limitation
    rows:
      - - Track dark vessels and AIS spoofing
        - Voluntary AIS can be disabled or falsified
        - Maritime Intelligence correlates RF with AIS and Vessel Custody ID maintains continuity across collections
        - Faster prioritization of suspicious vessels and less manual stitching across passes
        - Public recall and false-positive metrics are not disclosed
      - - Map and monitor air-defense radars
        - Overflight limits and manual radar analysis create blind spots
        - Air Defense Monitoring geolocates and characterizes radar activity, hotspots, and mobility
        - Better EOB updates and ISR tasking focus
        - Harder intermittent land radars remain a stated challenge
      - - Find and attribute GNSS interference
        - Jamming and spoofing can spread across large regions before terrestrial teams localize the source
        - GNSS Interference Detection provides recurring space-based geolocation and contextual warning
        - Earlier interdiction and broader coverage without new customer infrastructure
        - Public error bounds and current delivery SLA are not public
      - - Survey communications activity in denied or remote areas
        - Airborne ISR is costly and coverage is patchy
        - Communications Mapping detects and geolocates PTT radios and satellite phones over wide areas
        - Minutes of wide-area collection can replace many hours of airborne search
        - Public waveform and geography support are not exhaustively documented
      - - Discover unknown emitters or analyze a wider spectral slice
        - Predefined signal catalogs miss some signals of interest
        - RFIQ offers raw I/Q data and wider-band collection modes
        - More flexible signal discovery and custom exploitation
        - Public tooling examples and pipeline requirements are thin
      - - Resolve persistent civil or commercial interference
        - A very large search area can hide the source of harmful RF interference
        - RFGeo, RFIQ, and partner analysis workflows narrowed a GOES interference source in Ecuador
        - Multi-pass space collection can isolate a source in terrain where ground search alone is hard
        - Case-study success does not equal a general public performance guarantee
    notes: >-
