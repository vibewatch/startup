        title: Leadership, Governance, and Organizational Depth
        blocks:
          - type: paragraph
            body: >-
              John Serafini is the clearest public face of HawkEye 360. His published biography combines founder status,
              military background, venture-investing experience, and long-standing sector exposure, which supports
              founder-market fit but also creates obvious key-person concentration because his name appears across
              financing, governance, and strategic-announcement surfaces. Governance visibility broadened materially in
              spring 2026. On April 2 the company added Jonathan Shames and Frank Finelli to the board, bringing
              explicit finance, audit, defense-investing, and national-security credentials. Days later, HawkEye 360
              refreshed its advisory-board bench and formed an International Advisory Board chaired by Richard Clarke
              with senior allied-security figures including Kurt Campbell and Mark Montgomery. Those additions do not
              eliminate dependence on Serafini, but they do show a deliberate effort to surround the founder with more
              public governance depth before and after the IPO. Organizational scale also moved up materially after the
              ISA acquisition: the 2025 year-in-review note says the combined company exceeds 400 employees worldwide.
              What remains less visible is the complete executive roster, committee structure, and exact post-IPO
              committee assignments; public evidence is good on headline governance additions but incomplete on the full
              operating chart.
