            body: >-
              The most visible buyer base is still governmental. HawkEye's disclosed awards name the U.S. Navy,
              NRO/CSPO, and a European ministry of defense, while Washington Technology says U.S. government work
              represented 61% of 2025 sales mix. In those programs the payer and the user are not the same: acquisition
              offices or ministries fund the contract, analysts and operations centers consume the data, and the outputs
              are fused into command tools or intelligence platforms. That workflow structure favors vendors that can
              slot into an existing multi-INT stack rather than replace it. The clearest commercial adjacency comes from
              the 2019 Windward partnership and Windward's 2026 forecast. Together they show a second buyer
              class—maritime risk, sanctions, compliance, and insurer workflows—that wants RF as a validation layer when
              AIS is missing or manipulated. But those commercial users still look more like embedded platform customers
              than a large standalone direct-SME market. The buyer map therefore starts with defense and intelligence
              budgets, extends to law-enforcement and allied maritime-security programs, and only then reaches
              commercial compliance platforms and substitute visibility tools such as SkyWave or ORBCOMM.
