      - number: '4.2'
        title: Growth, Backlog, and Margin Structure Clues
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 is no longer a pre-revenue frontier-space story. The final prospectus supports $117.66M of
              2025 total revenue, $2.673M of net income, and $302.719M of backlog, with preliminary first-quarter 2026
              revenue already running at $48.2M-$50.2M. The most useful reconciliation in the public record is that the
              same filing also shows $98.743M of revenue before a separate $18.917M line for revenue from related
              parties; that bridge plausibly explains why outside write-ups alternately quote roughly $98.7M or $117.6M
              for 2025. Revenue quality is decent but not pristine. Backlog is large versus current revenue, yet the
              filing defines backlog broadly enough to include cancellable portions of contracts and unused single-award
              IDIQ ceiling, so investors should not equate backlog one-for-one with locked recurring ARR. On costs, the
              company looks more like a scaled defense-data platform than a pure software vendor: direct and indirect
              cost of sales were relatively modest against revenue, but SG&A and R&D together still consumed more than
              $75M in 2025. Management argues fixed-cost leverage, data reuse, and lower-capital-intensity Block 3
              satellites should expand margins over time. That may be directionally true, but the absence of
              product-level gross margins means the public record still cannot prove whether the most scalable economics
              sit in subscriptions, analytics, or bespoke programs.
