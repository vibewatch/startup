chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Product Architecture
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 is a Herndon, Virginia-based signals-intelligence company founded in 2015 and now operating as
              a newly public defense-tech issuer on the NYSE. Public-facing company materials consistently define the
              product around detecting, geolocating, and characterizing radio-frequency emissions for U.S. government
              and allied security customers rather than around a generalized geospatial-data narrative. The current
              operating stack has four linked layers: a constellation of more than thirty satellites, a cloud-based
              ground architecture, proprietary signal processing, and AI-enabled analytics delivered via subscriptions,
              direct delivery, and APIs. The technology page says the satellites orbit about 500 km above Earth in
              clusters of three, while eoPortal separately describes a 30-microsatellite constellation rooted in the
              December 2018 Pathfinder mission and documents frequency coverage from 70 MHz up to roughly 18 GHz with
              the RF front end. Public use cases center on maritime tracking, GNSS-jamming detection, radar monitoring,
              and communications mapping, which is consistent with third-party coverage describing demand for
              dark-vessel and GPS-jammer detection. Overall, the chapter evidence supports a simple one-line
              description: HawkEye 360 sells space-based RF intelligence data and analytics, not launch services or a
              pure SaaS abstraction.
