  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating assumption
      - Valuation logic
      - Indicative value range
      - Probability signal
      - Main trigger
    rows:
      - - Bear
        - >-
          Backlog burns down faster than it replenishes, customer concentration persists, and investors treat more
          revenue as project-like than subscription-like
        - 12x-15x total 2025 revenue or roughly low-to-mid teens on a lower-quality denominator
        - $1.2B-$1.8B
        - '~25%: plausible if budget timing slips or first public quarters disappoint'
        - Backlog step-down, concentration shock, or margin disappointment
      - - Base
        - >-
          Backlog converts reasonably, liquidity stays comfortable, but concentration and mix opacity keep the market
          from paying Planet-like premiums
        - 18x-23x total 2025 revenue; roughly around or slightly above IPO pricing but below euphoric post-pop marks
        - $2.1B-$2.7B
        - '~50%: most consistent with current evidence'
        - Steady execution but only partial disclosure improvement
      - - Bull
        - >-
          HawkEye proves durable recurring revenue, diversifies customers, and keeps strategic relevance high enough for
          premium public treatment
        - 25x-30x total 2025 revenue; sustained premium multiple despite government-heavy mix
        - $2.9B-$3.6B
        - '~25%: requires a cleaner denominator and stronger execution proof'
        - Backlog conversion, cleaner recurrence, and lower concentration
    notes: >-
      These ranges are directional screens, not a DCF; they intentionally show how much of the debate is denominator
      choice and multiple tolerance.
