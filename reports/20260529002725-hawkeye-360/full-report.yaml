    rows:
      - - HawkEye 360
        - direct benchmark / pure-play RF GEOINT
        - 30+ satellites; Navy $98.8M renewal; NRO 23-month expansion; Europe MOD award up to $75M
        - defense-intel users needing maritime awareness and EW cueing
        - Cluster-based TDOA/FDOA geolocation, AI analytics, multi-mission RF workflows
