      - number: '3.4'
        title: Switching costs, multi-homing, and distribution power
        blocks:
          - type: paragraph
            body: >
              Switching costs around HawkEye look moderate, not absolute. HawkEye sells a data and analytics layer that
              plugs into operational workflows through subscriptions, direct delivery, and APIs. That creates some
              stickiness once a buyer has tuned collection patterns, built watchlists, fused outputs with other ISR
              layers, and socialized HawkEye-derived signals inside operational tools. Repeat Navy, NRO, and allied
              ministry programs reinforce that embedded trust. But the public record also shows why multi-homing is
              normal. HawkEye, Unseenlabs, Kleos, ICEYE, and Kpler each describe products that complement other data
              rather than replace them outright.


              AIS remains the baseline system of record for cooperative traffic, SAR adds visual confirmation and
              weather-immune scene evidence, EO contributes fast pattern-of-life and object detection, and
              sovereign-build providers offer large governments a way to internalize parts of the stack. That means
              customers can add or subtract HawkEye without ripping out every surrounding system. The real switching
              barrier is workflow validation and procurement trust, not deep technical lock-in or public list-price
              advantage. HawkEye can benefit from this interoperability during adoption, but the same interoperability
              also lowers the cost of partial substitution if a broader AIS-plus-imagery-plus-internal workflow
              satisfies the mission.
