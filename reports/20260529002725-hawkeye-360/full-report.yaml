      - number: '3.3'
        title: SAR, EO, AIS, and sovereign-build substitutes
        blocks:
          - type: paragraph
            body: >
              The substitute field is numerous and often better funded than the direct RF field. Spire still markets RF
              geolocation and constellation services, but its former maritime URL now resolves to Kpler AIS, a reminder
              that baseline vessel tracking remains an entrenched status-quo layer built on cooperative transponders and
              massive coverage rather than on emitter attribution. ICEYE, Capella, and BlackSky compete from the
              opposite direction: they solve adjacent ISR questions with SAR or high-cadence EO instead of native RF
              geolocation. ICEYE brings the strongest disclosed scale signal, with more than €250 million of 2025
              revenue and €1.5 billion of backlog, and it explicitly markets dark-vessel, ship-to-ship transfer, and
              border-monitoring workflows. Capella combines all-weather SAR with customer-owned space systems, while
              BlackSky sells rapid, contract-backed EO tasking with AI object detection and under-90-minute delivery.


              Those vendors can win the same program dollars when the buyer values persistent imagery, fast tasking, or
              sovereign ownership more than emitter-level attribution. LeoLabs and Aerospacelab are more budget-adjacent
              than direct today, but they matter because they show how "space intelligence" and sovereign
              satellite-build budgets are broadening. Aerospacelab explicitly offers RF sensing payloads and turnkey
              constellation capacity, which makes future customer-built RF systems plausible. HawkEye's differentiation
              therefore has to survive not only direct RF comparison, but also the much larger set of adjacent systems
              that can be "good enough" for a buyer's real procurement objective.
