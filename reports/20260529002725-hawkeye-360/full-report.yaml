          detail: Tri-satellite geometry, timing, and health drive precise geolocation and revisit quality.
        - id: payloads
          label: Payload and bus evolution
          detail: SDRs, RF front ends, antenna options, and newer bus generations shape frequency coverage and data volume.
        - id: processing
          label: Core geolocation and AI analytics
          detail: >-
            TDOA, FDOA, patented BCI methods, classification, anomaly detection, and mission-specific analytics create
            usable outputs.
        - id: maxar
          label: Maxar RF Solutions assets
          detail: Adds wideband scanning, extra satellites, and large RF archives that must be integrated into the core stack.
        - id: isa
          label: ISA processing expertise
