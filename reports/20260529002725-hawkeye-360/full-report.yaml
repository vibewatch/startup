  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and recommendation discipline
        blocks:
          - type: paragraph
            body: >-
              HawkEye 360 has enough public evidence to support a real investment thesis, but not enough to support an
              unqualified buy recommendation at the current public mark. The thesis starts with differentiated RF GEOINT
              product positioning, visible government traction, and a backlog base that is large enough to matter.
              HawkEye also came public from a position of relative strength: the IPO raised $416 million gross, the
              company used proceeds to clean up acquisition debt, and the new revolver extends liquidity. That
              combination is better than the balance-sheet stories many recent space listings brought to market. The
              anti-thesis is what keeps the call price-sensitive. Revenue is already debated in public through two
              different denominators, customer concentration is high, backlog is not the same thing as funded
              irrevocable revenue, and the public record still does not cleanly separate software-like subscriptions
              from project-heavy government work. Those gaps matter because the stock is no longer priced like a
              distressed or experimental space name. At roughly $2.97 billion of market cap near the run date, HawkEye
              sits above BlackSky and Spire on trailing multiple, even before giving full credit to the harsher
              core-revenue lens. The right recommendation is therefore TRACK / MONITOR with medium confidence: the
              business looks strategically real, but the current price leaves little margin for underwriting error
              without more disclosure or a cheaper entry.
            claimRefs:
              - CV001
              - CV002
