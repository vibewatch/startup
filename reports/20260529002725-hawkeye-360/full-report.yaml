  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who Pays, Who Uses, and How the Customer Base Segments
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows HawkEye 360 is not selling a horizontal software seat into thousands of enterprise
              accounts; it is selling mission-specific RF intelligence into a small number of government-centric buying
              motions with some partner-led commercial distribution. The clearest payer segment is U.S. defense and
              intelligence, where Washington Technology’s S-1 coverage names NRO as the largest federal customer and
              identifies NGA and Space Force as other key clients, while HawkEye 360’s own 2025 review says the company
              expanded across U.S. Government and allied partners. But buyer, user, and beneficiary are not always the
              same party. In the Pacific Islands case, Australia’s DFAT funded the work, the Pacific Islands Forum
              Fisheries Agency coordinated use, and island-country fisheries and maritime operators benefited from the
              analytics and training. NASA adds a civil-agency buyer focused on communications research, while Windward
              is better understood as a channel and workflow integrator than as direct end-market proof. That
              distinction matters because direct contractual customers, partner platforms, and mission users create very
              different retention and concentration profiles even when they touch the same product family.
