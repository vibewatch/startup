      - number: '2.4'
        title: Demand Drivers, Adoption Constraints, and Contradictions
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are real and multi-threaded. SpaceNews says interest in RF monitoring has surged as
              shipping disruptions and GPS jamming expose blind spots, while the official mission pages show direct
              mission pull from dark-vessel detection, GNSS interference response, air-defense warning, and
              communications mapping. The NOAA GOES interference case matters because it demonstrates the product in a
              concrete civil-infrastructure problem, not just a marketing scenario. Windward's 2026 forecast adds a
              policy and compliance driver: sanctions evasion, dark fleets, and deeper public-private cooperation are
              increasing the value of multi-source remote sensing. Still, the adoption constraints are equally visible.
              Pricing for recurring regional subscriptions is not public, so outside buyers cannot benchmark ROI
              cleanly. Commercial RF data usually complements AIS, imagery, and sovereign collection rather than
              replacing them, so a buyer must already have an integration path and analytic team. Most disclosed spend
              is still government-led, which means procurement timing and mission prioritization matter more than
              classic bottoms-up SaaS seat expansion. Finally, competition is widening internationally, and SpaceNews
              notes that land-based radar geolocation remains technically harder than the maritime use cases that
              commercial RF vendors first proved.
