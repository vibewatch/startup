  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape overview and competitive framing
        blocks:
          - type: paragraph
            body: >
              HawkEye 360's competitive set is wider than the small group of companies that sell pure-play RF
              geolocation. Direct RF peers still matter, but the practical budget arena is broader because many buyers
              care about mission outcomes—dark-vessel detection, maritime awareness, EW cueing, or tactical ISR
              speed—rather than about RF as a category. HawkEye's own materials position the company as a workflow layer
              for maritime intelligence, GNSS interference monitoring, radar and communications mapping, and broader
              defense missions, while SpaceNews frames commercial RF sensing as a battleground that now pulls in RF
              specialists, SAR vendors, and new platform builders.


              That broader framing is the right one for diligence. Buyers can solve the job with native RF geolocation,
              with imagery plus AIS fusion, or by building sovereign systems around supplier hardware and internal
              analysts. In that mix, HawkEye still appears to hold the strongest current pure-play RF posture because it
              combines a 30-plus-satellite constellation, cluster-based TDOA/FDOA geolocation, and recent Navy, NRO, and
              allied-defense awards. But that lead does not eliminate competition; it mainly changes where pressure
              comes from. The direct RF field is narrow, while the substitute field is better capitalized and often
              easier to fit into existing maritime or ISR workflows.
            claimRefs:
