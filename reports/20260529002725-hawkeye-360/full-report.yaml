  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant retained public-market and transaction references for government-adjacent geospatial
        and space-data valuation work; no perfect RF-GEOINT pure-play comparable exists.
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Spire Global
        - May 2026 market cap vs FY2025 revenue
        - $0.93B market cap on $71.6M revenue (~13.0x sales)
        - Public listed space-data company with defense and RF-adjacent intelligence ambitions
        - Maritime divestiture distorts the revenue base and the business mix is broader than HawkEye
      - - BlackSky
        - May 2026 market cap vs FY2025 revenue and backlog
        - $1.91B market cap on $106.6M revenue (~17.9x sales); $345M backlog
        - Closest public government-heavy geospatial-intelligence style comp in the retained set
        - Optical imagery and Gen-3 mission solutions differ from RF GEOINT economics
      - - Planet Labs
        - May 2026 market cap vs FY2026 revenue and backlog
        - $18.31B market cap on $307.7M revenue (~59.5x sales); backlog >$900M; 98% recurring ACV
        - Upper-bound premium geospatial data platform comp with clearer recurring software-like traits
        - Much broader platform with cleaner recurring metrics than HawkEye publicly discloses
      - - Maxar take-private
        - 2023 transaction valuation vs estimated 2022 revenue
        - Acquired for ~$6.4B at $53/share; about ~3.2x estimated 2022 revenue
        - Strategic geospatial-intelligence floor reference showing real buyer appetite in the sector
        - Historical take-private for a far more mature business; not a live public multiple
      - - Satellogic SPAC
        - 2021 equity valuation and funding context
        - $1.1B equity valuation with about $274M growth cash
        - Useful caution reference for how aggressively space-intelligence narratives were once priced
        - Historical SPAC-era exuberance, not a clean operating comparable
    notes: >-
      Public comps are useful for relative discipline, but HawkEye still sits between the lower-quality government-heavy
      comps and the much cleaner Planet premium case.
