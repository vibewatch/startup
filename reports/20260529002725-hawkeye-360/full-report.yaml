      - number: '3.5'
        title: Differentiation durability and adverse evidence
        blocks:
          - type: paragraph
            body: >
              HawkEye's moat is real but conditional. The durable pieces are cluster-based RF geolocation, a broadening
              mission set, and proof that its data can be shared inside U.S. and allied defense workflows. Those are
              harder to copy quickly than a generic "RF from space" pitch. The less durable pieces are category
              exclusivity and budget ownership. SpaceNews' adverse framing matters: the market is now a battleground,
              and adjacent vendors with more capital or broader offerings can capture maritime and security budgets
              without matching HawkEye on native RF geolocation. The direct RF field is not the main danger; in fact,
              Kleos' distress reduces near-term pure-play RF price pressure.


              The bigger risk is substitution. If a customer mainly wants dark-vessel detection, alerts, or maritime
              monitoring at enterprise scale, AIS-plus-SAR or EO workflows can be good enough and easier to defend
              inside existing budget lines. Likewise, sovereign-build options from Spire, Capella, ICEYE, or
              Aerospacelab limit how exclusive any vendor-managed data layer can become for top-tier governments. So
              HawkEye's differentiation looks durable at the analytic layer, but only partially durable at the budget
              layer. The company can remain special without remaining singular, which is a subtle but important
              underwriting distinction.
