      - number: '4.3'
        title: Capital Adequacy, Debt, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              The capital picture improved sharply between December 2025 and May 2026, but it remains essential to the
              thesis. Pre-IPO, HawkEye 360 finished 2025 with $92.686M of cash and $127.878M of working capital after
              financing the ISA acquisition with roughly $98.8M of Series E preferred equity and $48.6M of long-term
              debt. It then added about $23M in a March 2026 Series E close. The IPO was the true balance-sheet reset:
              final prospectus estimates put net proceeds at roughly $377.9M, with $49.8M earmarked to retire the
              acquisition loans and $7.5M reserved for the deferred ISA payment. Days later, the company formally repaid
              those term and mezzanine facilities and replaced them with a $125M revolver due in 2031. That sequence
              lowers near-term refinancing risk and gives HawkEye 360 more flexibility for working capital, capex, and
              strategic investment. It does not eliminate financing dependency. The revolver is covenant-bound, and the
              prospectus still describes a business that wants to keep investing in satellites, analytics, and
              acquisitions while operating in a concentrated government market. In other words, the company is much
              better capitalized than it was at the ISA close, but future growth still depends on maintaining both
              program momentum and lender headroom.
