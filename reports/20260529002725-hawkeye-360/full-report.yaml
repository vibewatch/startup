companyProfile:
  summary: >
    HawkEye 360 is a Herndon, Virginia-based RF-intelligence company founded in 2015 and led by founder-CEO John
    Serafini. The company operates a space-based RF collection and analytics platform built around a 30-plus-satellite
    constellation, secure cloud processing, and mission software for maritime intelligence, air-defense radar
    monitoring, GNSS interference detection, and communications mapping. HawkEye 360 became publicly traded on the NYSE
    as HAWK in May 2026 after pricing 16,000,000 shares at $26 for roughly $416 million of gross proceeds. Public
    evidence shows repeat U.S. and allied government traction, including a $98.8 million Navy renewal, a 23-month NRO
    expansion, and a European defense award worth up to $75 million. Public financial lenses remain somewhat noisy: the
    filing supports $117.660 million of total 2025 revenue and $2.673 million of net income, while some coverage still
    quotes the pre-related-party revenue line instead.
  foundedDate: '2015-01-01'
  founders:
    - name: John Serafini
      role: Founder & CEO
      background: >
        Former Army officer and venture investor whose public biography highlights West Point, Harvard Business School,
        and Harvard Kennedy School credentials alongside long-standing defense-technology exposure.
      claimRefs:
        - CO006
  foundingLocation: Herndon, Virginia
  headquarters: Herndon, Virginia
  productSummary: >
    HawkEye 360 sells space-based RF intelligence data and analytics rather than launch or generic geospatial software.
    Its public product surface includes RFGeo, RFIQ, Mission Space, Spectrum Monitoring, Maritime Intelligence, Air
    Defense Radar Monitoring, GNSS Interference Detection, Communications Mapping, and Vessel Custody ID, delivered
    through subscriptions, direct delivery, cloud access, and APIs. The technical differentiation most clearly supported
    in the chapter set is the combination of cluster-based TDOA/FDOA geolocation, raw I/Q collection, wider-band
    scanning, analyst software, and shareable unclassified outputs.
  customerFocus: >
    Primary customers are U.S. defense and intelligence agencies plus allied defense organizations; the visible base
    also includes donor-funded regional security programs, civil research buyers such as NASA, and partner-channel
    maritime workflows.
  businessModel: >
    HawkEye 360 monetizes through data, analytics, subscriptions, APIs, training/support, and selected sovereign or
    hybrid deployments. Public filings show a mix of subscription, fixed-price, professional-services, reseller, and
    government-program contract structures rather than a single pure-SaaS model.
  stage: Public
  fundingStatus: >
    Late private financing accelerated in December 2025 with $150 million of equity and debt tied to the ISA
