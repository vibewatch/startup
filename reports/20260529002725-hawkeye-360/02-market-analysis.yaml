  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Per-region pricing, annual contract value, or seat-equivalent economics for Regional Awareness Subscription and mission-specific subscriptions.
    whyItMatters: Without public pricing or contract-unit detail, it is difficult to convert usage narratives into a defendable commercial ROI model or bottom-up commercial SAM.
    diligencePath: Request procurement line items, customer case studies, or management commentary that discloses annual contract value by product family.
    relatedQuestionRefs:
    - QM022
  - type: missing-source
    severity: material
    topic: core-market-split
    missingEvidence: Independent breakdown of core RF-geolocation demand between government, allied, and commercial or compliance buyers.
    whyItMatters: The best public evidence shows government concentration, but a valuation case depends on whether a meaningful commercial expansion path exists beyond embedded partner workflows.
    diligencePath: Use procurement databases, partner case studies, and management commentary to estimate government versus commercial revenue contribution by workflow.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: material
    topic: undisclosed-program-values
    missingEvidence: Dollar value and service mix of the NRO expansion and any comparable allied renewals beyond the Navy and Europe awards.
    whyItMatters: The chapter can prove a $173.8 million floor, but undisclosed contract values keep the narrow current-demand lens incomplete.
    diligencePath: Look for procurement disclosures, federal budget exhibits, or post-IPO management Q&A that names NRO or allied program value and scope.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: pure-play-tam-definition
    missingEvidence: A third-party market definition for space-based RF geolocation or commercial RF intelligence that cleanly excludes AIS-only, radar-hardware, port-software, and general EO categories.
    whyItMatters: Public TAM figures span from low-single-digit billions to high-twenties billions because category boundaries differ materially; the chapter can only preserve that contradiction, not resolve it.
    diligencePath: Ask analysts or comparable public vendors for category definitions that isolate RF-intelligence data and analytics from broader maritime-information and surveillance buckets.
    relatedTableRefs:
    - TM002
