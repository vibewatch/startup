- id: sizing-lenses
  title: Evidence-Constrained Sizing Lenses
  body: 'The sizing evidence is strongest when treated as a set of lenses rather than a single TAM. The narrowest, best-verified floor is disclosed current program value: $98.8 million from the Navy''s fourth-year IPMDA renewal plus up to $75 million from the European defense award, or at least $173.8 million before counting the NRO expansion whose value was not disclosed. One level up, U.S. maritime-security and MDA budgets create a much larger adjacent pool: the State Department says the United States has invested more than $1.5 billion in Indo-Pacific maritime security since 2017, including more than $120 million of Quad IPMDA support, $293 million of MSI funding since 2020, and nearly $955 million of IMET/FMF maritime capability support to East Asia and the Pacific. At the broadest analyst level, public reports disagree sharply. Technavio frames maritime information as a roughly $2.12 billion opportunity with $1.35 billion of incremental growth to 2030, Mordor puts maritime information
    at $3.19 billion in 2026, and TBRC places maritime surveillance at $28.39 billion in 2026 because it includes sensors, radar, AIS receivers, and software. Those are useful context windows, not a clean HawkEye TAM.'
