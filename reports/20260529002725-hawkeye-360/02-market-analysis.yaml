    - Keeps maritime-security demand tied to RF as a validating layer
    - Measure how often customers buy RF as primary detection vs validation
  - - GNSS jamming and interference
    - Driver
    - Current / episodic
    - GNSS mission page plus NOAA interference case show concrete response value
    - Supports aviation, force-protection, and critical-infrastructure workflows
    - Find public incident volumes and renewal rates for interference-monitoring buyers
  - - Public MDA funding programs
    - Driver
    - Multi-year
    - State Department cites >$1.5B maritime-security pool and >$120M IPMDA support
    - Creates adjacent procurement budgets where commercial RF can fit
    - Map which program lines actually procure commercial data subscriptions
  - - Cloud, subscription, and API delivery
    - Driver
    - Current
    - Technology and RAS pages describe daily downloads, cloud access, and APIs
    - Lowers integration friction versus sovereign buildout
    - Identify average implementation time and renewal behavior by product
  - - Category-definition ambiguity
    - Constraint
    - Current
    - Analyst estimates range from ~$2.12B opportunity to $28.39B surveillance market
    - Raises risk of inflated TAM claims and weak comparability
    - Keep valuation work anchored to narrow, evidence-backed lenses
  - - Government budget concentration
    - Constraint
    - Current
    - Washington Technology says 61% U.S.-government sales mix; most public awards are government
    - Procurement cycles and mission priorities dominate visible demand
    - Measure non-government share of recurring revenue and pipeline
