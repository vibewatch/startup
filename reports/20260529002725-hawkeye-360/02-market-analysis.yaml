  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Nested market layers from the broadest surveillance adjacency to the narrow disclosed demand floor that is directly evidenced for HawkEye-like RF services.
  data:
    items:
    - label: Global maritime surveillance adjacency
      value: $28.39B (2026)
      detail: TBRC's broad maritime-surveillance market includes sensors, radar, AIS receivers, software, and other components well beyond HawkEye 360's pure RF-data layer.
      tone: neutral
    - label: Global maritime information workflows
      value: $3.19B (2026)
      detail: Mordor's maritime-information market is narrower and more software/data oriented, but still includes modules such as weather, port, and general information services.
      tone: neutral
    - label: Indo-Pacific maritime-security budget pool
      value: '>$1.5B since 2017'
      detail: State Department maritime-security, MSI, IMET/FMF, and IPMDA funding show adjacent budget capacity that can contain MDA data procurement, but not all of it is RF-addressable.
      tone: neutral
    - label: Disclosed HawkEye-style demand floor
      value: $173.8M+
      detail: Directly disclosed Navy and Europe award values form the cleanest current floor for HawkEye-like RF-data and subscription demand; NRO value remains undisclosed.
      tone: positive
  approximationNotes: The layers are intentionally not a canonical TAM/SAM/SOM stack. They move from broad adjacent categories to a narrow disclosed-demand floor to show how much the answer changes when category boundaries tighten.
