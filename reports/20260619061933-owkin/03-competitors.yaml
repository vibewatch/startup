  - id: pricing-gtm-positioning
    title: 'Pricing, GTM, and Distribution Power'
    body: >-
      Owkin K Pro is licensed under multi-year enterprise agreements. The AstraZeneca deal (a
      three-year K Pro license plus embedded agent development) and the Sanofi deal (a five-year
      K Pro license plus co-development of purpose-built biopharma agents) establish recurring
      multi-year contract structures, though exact financial terms remain undisclosed. Based on the
      scope of embedded agent delivery, decision-intelligence access, and Owkin Zero biological LLM
      described in official announcements, these contracts are likely mid-to-high seven-figure
      annual arrangements. Publicly available analyst estimates for comparable clinical AI platform
      licenses suggest $150,000–$250,000 per year for single-site deployments; large pharma
      enterprise agreements with bespoke agent development are materially higher.


      Insilico Medicine licenses Pharma.AI to thirteen of the top twenty global pharma companies,
      demonstrating broad distribution penetration. Recursion and Exscientia distribute primarily
      through milestone-based partnerships where upfront payments have averaged approximately 2% of
      headline deal value across the sector—making their revenue more contingent and milestone-gated
      than Owkin's recurring license model. PathAI (pre-acquisition) distributed AISight through
      direct sales to hospital laboratories and pharma clinical trial operations, with BMS and Merck
      as anchor partners. Schrödinger licenses FEP+ on a subscription basis, with disclosed major
      pharma contracts exceeding $50 million annually.


      Owkin's GTM advantage is its academic hospital network, which creates a two-sided flywheel:
      hospitals contribute federated participation in exchange for research insights and data
      access, which deepens Owkin's data moat and strengthens pharma commercial proposals. The key
      risk is revenue concentration—AstraZeneca and Sanofi together are likely two of Owkin's
      largest K Pro clients, and concentration in two or three anchor pharma relationships creates
      vulnerability if either relationship does not renew.
