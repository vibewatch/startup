chapter:
  number: 6
  title: Customers
  summary: >-
    Owkin's commercial base is a concentrated set of large-cap biopharma companies — Sanofi,
    Bristol-Myers Squibb, and AstraZeneca accounting for nearly all verifiable enterprise deal value —
    with a hospital data network of 800+ academic institutions providing the proprietary multimodal
    patient data that underpins K Pro's differentiation. Within seven months of K Pro's October 2025
    commercial launch, Owkin secured multi-year enterprise licenses from Sanofi (5 years) and
    AstraZeneca (3 years), and a named biotech (Micregen) provided a published testimonial; however,
    public retention metrics (NRR/GRR) remain entirely undisclosed, Sanofi's dominance creates
    material concentration risk, and major pharma customers are managing diversified AI vendor
    portfolios, signalling they are not exclusively committed to Owkin.

sections:
  - id: pharma-customer-base
    title: Pharma Partner Base and Customer Segmentation
    body: >-
      Owkin's paying customer base divides into two tiers. The primary commercial tier comprises large-cap
      biopharma companies that sign multi-year enterprise collaboration and SaaS licensing agreements, paying
      through a combination of upfront collaboration fees, recurring K Pro license payments, and milestone-
      triggered R&D payments. As of June 2026, confirmed named partners in this tier include Sanofi,
      Bristol-Myers Squibb, AstraZeneca, Servier, MSD/Merck (via Waiv post-spinout), Amgen, and Johnson &
      Johnson. Together these seven names span the top ranks of global pharma and represent the entirety of
      Owkin's publicly quantified deal value.

      The secondary tier comprises academic research hospitals and cancer centers that participate in
      Owkin's federated learning network. These 18+ equipped academic sites — with the broader data access
      network spanning 800+ institutions — are non-revenue-generating customers. Their contribution is
      providing the privacy-preserving multimodal patient datasets that underpin K Pro's biological reasoning
      credibility; Owkin equips these centers with FL infrastructure in exchange for data access under managed
      research agreements. Hospital network participants are therefore best characterised as strategic
      data-generation partners rather than commercial accounts.

      An emerging third segment — early-stage biotech companies — is visible through the Micregen testimonial
      and other mentions of K Pro being used by biotech researchers for investor pitch preparation and
      scientific literature analysis. This segment lacks published deal size data and is too small to assess
      as a revenue contributor. Geographic mix is primarily EU (France, UK, Germany) and US, consistent with
      Owkin's Paris headquarters, New York office, and European hospital network concentration. Since the
      March 2026 Waiv spinout, AstraZeneca and MSD are customers of the independent Waiv entity, and their
      diagnostic product revenues are no longer consolidated in Owkin's accounts.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
