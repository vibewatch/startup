callouts:
  - calloutType: risk
    title: Sanofi Concentration Dominates Disclosed Deal Economics
    body: >-
      Sanofi contributes the $180 million equity investment, $90 million oncology collaboration,
      immunology expansion, and the June 2026 K Pro five-year license to Owkin's lifetime deal value.
      Without individual customer ARR disclosure, precise concentration cannot be confirmed, but the
      qualitative dominance of a single customer across every revenue channel is a material investment
      risk for a pre-profit company.
    claimRefs:
      - CU035
      - CU036
      - CU038

  - calloutType: strength
    title: K Pro Secured Two Enterprise Pharma Licenses Within 7 Months of Launch
    body: >-
      Sanofi's five-year and AstraZeneca's three-year K Pro enterprise licenses, both announced within
      seven months of the October 2025 commercial launch, validate that Owkin's prior pharma trust
      relationships convert into long-duration platform commitments. The deeply embedded deployment
      model — agents running inside customer IT stacks — creates durable switching costs that should
      support revenue retention once integration is complete.
    claimRefs:
      - CU023
      - CU024
      - CU030

  - calloutType: recommendation
    title: Require NRR, GRR, and Individual Customer ARR in Due Diligence
    body: >-
      No public NRR, GRR, CSAT, or customer cohort data exists for Owkin's enterprise partnerships.
      Investors should require management accounts showing per-customer ARR, annual renewal rates,
      and milestone payment schedules for Sanofi, BMS, and AstraZeneca before any capital commitment.
      The absence of these metrics is the single largest information asymmetry in Owkin's customer
      evidence set.
    claimRefs:
      - CU030
      - CU036

