  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: net revenue retention
      missingEvidence: >-
        Annual NRR and GRR figures for Owkin's enterprise pharma partnerships, ideally broken out by
        cohort year (2021, 2022, 2023, 2024) and by product (K Pro vs. legacy federated learning platform).
      whyItMatters: >-
        Without NRR or GRR, the durability of Owkin's pharma relationships cannot be independently
        assessed; the deepening Sanofi pattern may mask silent non-renewals in smaller accounts.
      diligencePath: >-
        Request annual contract renewal schedules and ARR waterfall from CFO during formal due diligence;
        compare against total disclosed deal value to identify unexplained gaps.
      relatedQuestionRefs:
        - QU006

    - type: private-evidence-only
      severity: material
      topic: individual customer ARR
      missingEvidence: >-
        Per-customer annual recurring revenue figures for Sanofi, BMS, AstraZeneca, Servier, and other
        named pharma accounts, enabling independent concentration analysis.
      whyItMatters: >-
        Sanofi likely dominates total deal value but its share of annual recurring revenue is
        unquantifiable from public data; concentration risk severity cannot be confirmed.
      diligencePath: >-
        Require management accounts (P&L by customer segment) and signed K Pro license fee schedules in
        due diligence data room; cross-check against 2024 disclosed revenue of ~$86M.
      relatedQuestionRefs:
        - QU017

    - type: missing-source
      severity: material
      topic: named customer proof outcomes
      missingEvidence: >-
        Independent case studies, published outcome data, or regulatory filings showing quantified K Pro
        results at Sanofi, BMS, AstraZeneca, or other enterprise customers; named users beyond Micregen
        and the Gustave Roussy testimonial.
      whyItMatters: >-
        All K Pro performance claims are company-asserted; no independent peer-reviewed or regulator-
        verified outcome data for K Pro's enterprise deployments exists as of June 2026.
      diligencePath: >-
        Request pharma customer reference calls; ask Sanofi and AstraZeneca to authorize disclosure of
        internal K Pro pilot KPIs; track ESMO, ASCO, and AACR presentations for Owkin-affiliated data.
      relatedTableRefs:
        - TU002

    - type: missing-source
      severity: material
      topic: competitor retention comparison
      missingEvidence: >-
        Comparable NRR, customer count, and enterprise retention data for AI drug-discovery competitors
        (Recursion, Insilico, Exscientia) to benchmark Owkin's commercial traction.
      whyItMatters: >-
        Without competitive benchmarks, Owkin's customer base size and retention profile cannot be
        calibrated against the sector norm.
      diligencePath: >-
        Review Recursion's public SEC filings and investor day materials for customer count, partnership
