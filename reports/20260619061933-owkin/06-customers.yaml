  - id: named-customer-deployments
    title: Named Customer Deployments and Production Evidence
    body: >-
      Sanofi is Owkin's flagship and oldest commercial partner, with a relationship spanning three
      consecutive phases. In November 2021, Sanofi made a $180 million equity investment alongside a $90
      million oncology collaboration covering non-small cell lung cancer, triple-negative breast cancer,
      mesothelioma, and multiple myeloma. By October 2022, the scope expanded to drug positioning within
      Sanofi's immunology pipeline. In June 2026, the partnership deepened again into a five-year K Pro
      enterprise license under which Owkin will build bespoke agentic AI systems running inside Sanofi's
      own IT stack. Sanofi Chief Digital Officer Emmanuel Frenehard endorsed the arrangement publicly,
      stating that purpose-built agentic systems would enable Sanofi teams "to operate with greater speed,
      depth, and confidence."

      Bristol-Myers Squibb entered a multi-year strategic collaboration in June 2022 covering AI-powered
      clinical trial design for cardiovascular disease, including covariate adjustment and external control
      arms. The deal included $80 million upfront (equity + collaboration fees) plus up to $100 million in
      success-based milestone payments. BMS Senior Vice President Venkat Sethuraman publicly endorsed the
      collaboration as enhancing BMS programs with "high-quality, diverse data from clinical and real world
      sources." No formal K Pro licensing announcement for BMS has been made as of June 2026.

      AstraZeneca progressed from a 2024 diagnostic AI collaboration (BRCAura gBRCA mutation prescreening,
      achieving 93% sensitivity in ESMO-presented results) to signing a three-year K Pro enterprise license
      in May 2026. MSD signed a collaboration in December 2023 to develop MSI-H AI diagnostics for the EU
      market across four cancer types; these assets transferred to Waiv in March 2026. Servier entered a
      multi-year partnership in October 2023 for oncology translational medicine.

      Micregen's MD provided a named testimonial confirming K Pro use for investor pitch preparation,
      describing the task as "nearly impossible" by traditional methods. Institut Gustave Roussy's Head of
      Research Division described K Pro as "a game-changer" for rapid multimodal patient data analysis,
      providing the first independently attributed hospital-sector endorsement of the platform beyond the
      pharmaceutical tier.
