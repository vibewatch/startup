  - id: k-pro-adoption-trajectory
    title: K Pro Commercial Adoption and Adoption Trajectory
    body: >-
      K Pro launched commercially in October 2025, targeting pharmaceutical companies, biotechs, and
      investors via a natural language interface for biomedical research. The platform combines Owkin Zero
      (a fine-tuned biological LLM), multimodal patient data from the MOSAIC consortium and broader hospital
      network, and an agentic AI architecture. At launch, Owkin claimed internal performance benchmarks showing
      drug target identification accelerated by 70% (from 12+ months to approximately 3 months), and at least
      one unnamed pharma collaboration achieving a 35% trial duration reduction through improved patient segment
      identification. These are company-claimed figures without independent validation.

      Within seven months of the October 2025 launch, Owkin secured two announced enterprise license deals:
      the Sanofi five-year agreement (June 2026) and the AstraZeneca three-year agreement (May 2026). Both
      involve Owkin building purpose-built AI agents deployed inside the customer's own IT infrastructure —
      a deeply embedded deployment model that creates institutional switching costs. A survey of over 200 pharma
      executives, conducted by Owkin with STAT Brand Studio ahead of the K Pro launch, found nearly half
      identified overcoming data challenges as the primary agentic AI opportunity. The survey was commissioned
      by Owkin and cannot be treated as independent market validation. Owkin's 2024 revenues of approximately
      $86 million with 83% year-over-year growth are consistent with growing pharma partnership revenues but
      cannot be disaggregated by product or customer.
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
