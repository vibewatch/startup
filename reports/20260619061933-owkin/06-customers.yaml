  - id: retention-durability-expansion
    title: Retention, Durability, and Expansion Signals
    body: >-
      Owkin does not disclose net revenue retention, gross revenue retention, or any structured cohort data
      for its enterprise partnerships. The absence of these metrics is a core diligence gap: without NRR or
      churn data, durable commercial traction cannot be verified independently.

      Indirect retention signals are encouraging. Sanofi's partnership has deepened continuously across five
      years (2021 equity + oncology → 2022 immunology expansion → 2026 K Pro), representing three successive
      value-creation phases with the same flagship customer. AstraZeneca's progression from a diagnostic AI
      pilot (2024 BRCAura) to a K Pro enterprise license (2026) demonstrates a clear cross-sell pattern. No
      pharma customer has publicly announced exiting or declining to renew an Owkin collaboration as of June
      2026, though the MSD/AstraZeneca diagnostics relationship transferred to Waiv rather than lapsing.

      Contract durations in disclosed K Pro deals (5 years for Sanofi, 3 years for AstraZeneca) indicate
      structurally long commitment periods, consistent with high switching costs from deeply embedded agentic
      systems. Owkin's federated learning infrastructure creates durable institutional switching costs at the
      data layer: once a center has integrated Owkin's FL tooling, replacing it requires significant
      re-instrumentation. Pharma enterprise customers face different switching dynamics — Sanofi is
      concurrently working with CytoReason and BMS with Anthropic, indicating customer stickiness is not
      exclusive and parallel vendor evaluation is the norm at the top pharma accounts.
    claimRefs:
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
