  - id: concentration-adverse-signals
    title: Customer Concentration, Adverse Signals, and Risk Assessment
    body: >-
      Sanofi's dominance in Owkin's public deal record is unambiguous. The single Sanofi relationship has
      contributed $180 million in equity investment, $90 million in oncology collaboration payments, an
      immunology expansion (undisclosed value), and the June 2026 K Pro five-year license (undisclosed
      value) — together representing the largest and most sustained commercial commitment of any Owkin
      counterparty. Without individual customer ARR disclosure, the precise revenue concentration cannot
      be quantified, but the qualitative dominance of a single customer across every revenue channel is a
      material investment risk for a pre-profit company that has not yet closed its next funding round.

      On the adverse side, Sifted reported in September 2025 that employees leaving Owkin cited "huge
      managerial issues," a signal that internal delivery capacity may not match the commercial ambition
      of multi-year enterprise AI deployments. The restructuring of approximately 50 positions (~15% of
      French workforce) was framed as an AI-agent pivot, but the coincident internal criticism suggests
      execution risk beyond headcount management. BMS's separate May 2026 AI partnership with Anthropic,
      and Sanofi's parallel collaboration with CytoReason, confirm that major pharma customers are managing
      diversified AI vendor portfolios rather than consolidating exclusively on Owkin. The March 2026 Waiv
      spinout improved Owkin's strategic focus but reduced visible customer diversity by removing two named
      customers from its consolidated accounts. Owkin's geographic mix remains EU- and US-centric, with no
      evidence of material commercial penetration in Asia-Pacific as of June 2026.
    claimRefs:
      - CU037
      - CU038
      - CU039
      - CU040
      - CU041
      - CU042
