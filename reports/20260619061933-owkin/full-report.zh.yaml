      - number: '7.4'
        title: 人员、治理与执行风险
        blocks:
          - type: paragraph
            body: >-
              Thomas Clozel 的关键人集中度，是最严重的治理风险。Clozel 是公司创始人、CEO、与大型药企 CDO 和 CEO 达成交易的主要推动者、投资者关系负责人，也是 Owkin Biological
              Artificial Superintelligence（BASI）愿景的公众面孔。他自 2016 年公司创立以来一直任职。没有公开文件显示继任计划或副 CEO 路径。若 Clozel
              因疾病、离职或被竞争对手招募而离开，由个人信任锚定的 Sanofi 和 BMS 关系将面临风险。

              Gilles Wainrib（CSO）是第二位关键人物，从学术背景出发负责科学战略。他同时担任教授和初创公司 CSO，这种双重角色带来学术创始人公司常见的部分可用性风险。未发现 Wainrib
              离职时已有指定科学继任者的证据。

              2025 年 9 月裁员约 50 人（15%），按法国法下 rupture conventionnelle collective 设计，聚焦新智能体式 AI 核心之外的岗位。Maddyness
              确认了裁员及其财务理由。Sifted 引用的一名消息人士称，当时 Owkin 存在「严重管理问题」， 与公司从诊断转向纯智能体式 AI 所需的组织重塑相符。重组移除了诊断人才（转入 Waiv），并削减了被视为非
              K Pro 核心的职能人数。重组后的工程留存风险尚未验证。同样，2024 年 2 月 Bioptimus 剥离（获 €35M 资金支持的基础模型初创公司）也让一批 AI 研究人员离开 Owkin 直接员工队伍。

              治理不透明是另一项执行风险。Owkin 是法国私营 SAS，不公开董事会构成，没有发布审计委员会或薪酬委员会程序，也没有自愿 ESG 或 DEI
              报告。缺少独立董事会监督信号，使外部难以验证财务控制、数据治理政策和管理决策是否接受独立审查。Sanofi 保留董事会代表席位（作为投资人）提供了一定外部约束，但 Sanofi
              同时作为客户和投资人的利益，可能与少数财务投资人并不完全一致。
