  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 药企合作伙伴基础与客户分层
        blocks:
          - type: paragraph
            body: >-
              Owkin 的付费客户基础分为两层。核心商业层是大型生物制药公司，它们签署多年期企业合作和 SaaS 授权协议，并通过预付合作费、经常性 K Pro 授权付款和里程碑触发的 R&D 付款组合付费。截至 2026
              年 6 月，该层已确认的具名伙伴包括 Sanofi、Bristol-Myers Squibb、AstraZeneca、Servier、MSD/Merck（通过剥离后的 Waiv）、Amgen，以及 Johnson
              & Johnson。这 7 个名字覆盖全球药企头部梯队，也代表了 Owkin 公开量化交易价值的全部。

              次级层由参与 Owkin 联邦学习网络的学术研究医院和癌症中心组成。18+ 个已配备学术站点——更广的数据访问网络覆盖 800+ 家机构——不是创收客户。它们的贡献是提供保护隐私的多模态患者数据集，支撑 K
              Pro 生物学推理可信度；Owkin 为这些中心配备 FL 基础设施，换取受管理研究协议下的数据访问。因此，医院网络参与方更适合被归为战略性数据生成伙伴，而不是商业账户。

              第三类新兴客群是早期生物科技公司，可从 Micregen 证言以及其他 K Pro
              被生物科技研究人员用于投资人推介材料准备和科学文献分析的表述中看到。该客群没有公开交易规模数据，体量也太小，暂无法评估为收入贡献者。地域结构以欧盟（法国、英国、德国）和美国为主，与 Owkin
              巴黎总部、纽约办公室以及欧洲医院网络集中度一致。自 2026 年 3 月 Waiv 剥离后，AstraZeneca 和 MSD 成为独立 Waiv 实体的客户，其诊断产品收入不再并入 Owkin 账户。
