      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >
              Owkin 由 Thomas Clozel, MD 和 Gilles Wainrib, PhD 于 2016 年共同创立。一位临床肿瘤科医生与一位机器学习研究者的组合，体现了公司创立时的判断：生物医学 AI
              需要把临床知识与数据科学深度接合。

              CEO Thomas Clozel 接受过肿瘤学和血液学训练，截至 2026 年 6 月仍留任。他是公司的公开面孔和主要战略权威，也带来显著关键人依赖。联合创始人兼首席科学官 Gilles Wainrib,
              PhD 是机器学习教授，继续负责科学战略。

              公开披露的更广泛 C-suite 包括：Pascal Weinberger（副 CEO）、Graeme Bell（CFO）、Rodrigo Barnes（CTO）、Caroline
              Hoffmann（首席医疗官）、Antonia Trower（首席营销官）、Marie-Alice Tantardini（首席人力官）、Jean-Frédéric Petit-Nivard（首席商务官）、Anna
              Huyghues-Despointes（首席企业发展与运营战略官）以及 Anne-Charlotte Paut（首席法务官）。

              关键人风险集中在 Thomas Clozel 身上：他推动投资者关系、大型药企合作谈判，以及面向 BASI 的战略方向。公开信息中没有继任计划迹象。Gilles Wainrib
              同时担任联合创始人与学术科学家，也形成中等依赖。2025 年 9 月裁员以及随之出现的对 “huge managerial issues” 的内部批评，提示组织执行缺口，需要持续观察。
