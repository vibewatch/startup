      - number: '8.4'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >-
              投资论点靠四根支柱撑住：（1）Owkin 的联邦学习架构接入全球 180+ 家研究型医院，数据访问优势结构性难复制； （2）K Pro 与 Sanofi、AstraZeneca
              签下多年期企业合同，引入经常性收入成分，收入质量明显高于纯里程碑付款； （3）公司在收入同比增长 83% 的同时，一年内把亏损从 $31.3M 收窄至 $5.6M，显示可持续性在改善； （4）二级市场估值约
              ~$1.6B，且公司正在寻求 $200-300M 新一轮融资，使 Owkin 接近 BASI 叙事拐点： 生物医药 agentic AI 的叙事价值可向战略投资者拿到溢价。

              反论点同样有力：（1）$1B 的主融资估值已是五年前的标记，且尚未被新资金检验——自该估值以来，行业倍数已大幅压缩 （峰谷从 15x 到
              4.4x）；（2）毛利率、NRR、详细合同经济性均未披露，投资者无法建模单元经济或回报曲线； （3）Thomas Clozel 关键人集中度高，Sifted 报道的 2025
              年内部管理批评构成真实但未量化的执行风险； （4）Waiv 剥离拿走了一条收入流，也让公司进一步集中在 Sanofi 和 BMS 两个锚定客户的合作上，而这两家客户对 AI
              投资的持续意愿可能受自身战略调整影响；（5）Recursion 即便现金储备充足，市值仍同比下跌 22.6%，说明当价值证明时间线令人失望时， 市场会向下重估整个板块。

              建议为跟踪：K Pro 的商业牵引确实令人鼓舞，但财务不透明使买入结论站不住。若公司完成新一轮主融资并披露条款， 或投资者获得管理账目，才具备上调至买入的门槛条件。
