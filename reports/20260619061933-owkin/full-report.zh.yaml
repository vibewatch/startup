      - number: '4.6'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Owkin 的财务画像是：合作收入潜力高，资本强度高，单位经济模型结构性不透明。Sanofi 五年 K Pro 许可和新的 AstraZeneca
              交易提供多年收入可见性，这是耐久的正面信号。但距上一轮股权融资已有四年，披露交易价值集中在两家伙伴，烧钱和利润率未披露，Sifted 报道中的管理文化信号，以及 Waiv
              拆分导致诊断收入流流失，合在一起形成重大信息赤字。分析师估算收入 $125 million 若正确，对这一阶段公司而言不错；但没有毛利率数据，投资者无法建模单位层面盈利能力，也无法判断下一平台周期所需 R&D
              资本。收入质量混合：里程碑付款天然不平滑且非经常；来自 K Pro 的经常性 SaaS
