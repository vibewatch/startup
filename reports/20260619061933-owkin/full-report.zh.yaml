  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Owkin 的监管暴露横跨三个不同框架：EU AI Act、GDPR Article 9 健康数据义务，以及美国 FDA 对 AI 医疗器械的监管。EU AI Act 分阶段全面生效：2025 年 2
              月适用禁止类 AI 规则，2025 年 8 月适用通用 AI（GPAI）模型义务，2026 年 8 月 2 日法案全面适用。OwkinZero——K Pro 核心的 Owkin 微调生物学大语言模型——属于
              GPAI 模型，因此自 2025 年 8 月起承担透明度、版权合规和系统性风险义务。具体而言，Owkin 必须发布 OwkinZero 训练数据内容摘要，维持版权政策，并评估 OwkinZero
              是否构成系统性风险（高能力阈值）。未找到 OwkinZero 的公开 GPAI Code of Practice 备案或训练数据透明度摘要。European AI Industry Alliance 的 GPAI
              Code of Practice 于 2025 年 7 月发布，是 Owkin 应遵循的自愿合规工具；不采用它并不构成违法，但会失去符合性推定利益。

              对高风险 AI 分类而言，有一个重要缓释因素：EFPIA 立场文件确认，仅用于药物 R&D 的 AI 工具很可能根据 Articles 2.6 和 2.8（科学研究豁免）免于 EU AI Act 高风险分类。K
              Pro 若仅部署在药企 R&D 工作流中，而不进入临床诊断，可能因此避开 CE 标志要求。但该豁免存在争议，且需逐案判断；任何从研究跨入临床决策支持的部署，都可能触发高风险分类。根据 2026 年 5 月 AI
              Omnibus 政治协议，通用领域 AI 系统（生物识别、就业等）的高风险规则将自 2027 年 12 月起适用。

              GDPR 方面，Owkin 根据 Article 9 处理特殊类别健康数据。该条禁止处理，除非适用特定例外（Art.9(2)(j) 下的科学研究，或 Art.9(2)(a) 下的明确同意）。Owkin
              隐私政策最近更新于 2026 年 6 月 8 日，确认 GDPR 合规承诺，以及欧洲数据使用 HDS 认证云基础设施。跨境传输到 Owkin US 使用标准合同条款。法国 CNIL 对 Owkin
              法国实体具有监管权；任何医院节点的数据泄露或同意失败，都可能触发 CNIL 调查，罚款最高为 €20 million 或全球年营业额 4% 二者中较高者。本研究未发现针对 Owkin 的执法行动。

              美国方面，Owkin 的 K Pro 平台定位为药企科学家的研究和决策支持工具，而不是 FDA 监管医疗器械。FDA 的 AI-Enabled Medical Devices 清单确认了临床 AI
              诊断的独立路径（例如 Waiv 现持有的前 MSIntuit CRC 和 RlapsRisk BC 产品）。2026 年 3 月 Waiv 剥离将这些 CE 标志诊断产品移出 Owkin 监管边界。K Pro
              嵌入的开源权重模型组件（Qwen、其他微调模型）带来潜在但尚未量化的 IP 风险，投资前需要完整 IP 审计。
