      - number: '6.4'
        title: 留存、耐久性与扩张信号
        blocks:
          - type: paragraph
            body: >-
              Owkin 不披露净收入留存、总收入留存，也不披露任何结构化队列数据。缺少这些指标是核心尽调缺口：没有 NRR 或流失 数据，就无法独立验证商业牵引力是否耐久。

              间接留存信号偏正面。Sanofi 合作在 5 年里持续加深（2021 股权 + 肿瘤 → 2022 免疫学扩展 → 2026 K Pro），同一旗舰客户连续进入三轮价值创造阶段。AstraZeneca 从诊断
              AI 试点（2024 BRCAura）推进到 K Pro 企业授权（2026），显示清晰的交叉销售模式。截至 2026 年 6 月，没有药企客户公开宣布退出或拒绝续约 Owkin 合作，尽管
              MSD/AstraZeneca 诊断关系转移给 Waiv，而不是自然终止。

              已披露 K Pro 交易的合同期限（Sanofi 5 年、AstraZeneca 3 年）显示承诺周期结构性较长，符合深度嵌入智能体式 系统带来的高切换成本。Owkin
              的联邦学习基础设施在数据层形成持久的机构切换成本：一个中心一旦集成 Owkin 的 FL 工具，替换就需要大量重新布设。药企企业客户面对不同的切换动态——Sanofi 同时与 CytoReason 合作，BMS
              同时与 Anthropic 合作，说明客户粘性并非排他，头部药企账户通常会并行评估多个供应商。
