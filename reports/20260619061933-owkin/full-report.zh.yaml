  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: standard
    summary: 从证据支柱到风险评估、估值纪律，再到 TRACK 建议的端到端链条。
    data:
      nodes:
        - label: 规模
          value: $86M FY2024 revenue, 83% YoY growth, 180+ hospital federated network
        - label: 证明
          value: K Pro 5-yr Sanofi + 3-yr AstraZeneca licenses; multi-year partnership cadence
        - label: 风险
          value: HIGH — partner concentration, 4-yr funding gap, no gross margin data
        - label: 估值
          value: STRETCHED — 11.6x EV/Rev at $1B vs 4.4x sector median
        - label: 证据质量
          value: LOW confidence — no audited accounts, no disclosed K Pro ACV or NRR
        - label: 建议
          value: TRACK — monitor K Pro commercial scale and new round pricing
      edges:
        - - Scale
          - Proof
        - - Proof
          - Risk
        - - Risk
          - Valuation
        - - Valuation
          - Evidence quality
        - - Evidence quality
          - Recommendation
    approximationNotes: 该流程用于示意逻辑链条；节点标签是各章节证据的缩写摘要。
    claimRefs:
      - CV004
      - CV006
      - CV012
      - CV026
      - CV029
  - id: FV002
    title: 估值敏感性：不同收入假设和倍数下的 EV
    type: bar
    layout: wide
    summary: Owkin 企业价值对收入假设（FY2024 实际 $86M，对比分析师估计 $125M）和行业倍数情景（行业底部 4.4x、高溢价平台 11.6x、上市可比公司 22.9x）的敏感性。
    data:
      items:
        - label: $86M 收入 × 4.4x（行业底部）
          value: 379
        - label: $86M 收入 × 11.6x（上一轮估值）
          value: 998
        - label: $86M 收入 × 18.6x（二级市场）
          value: 1600
        - label: $125M 收入 × 4.4x（行业底部）
          value: 550
        - label: $125M 收入 × 11.6x（上一轮估值倍数）
          value: 1450
        - label: $125M 收入 × 18.6x（二级市场倍数）
          value: 2325
        - label: $125M 收入 × 22.9x（RXRX 可比）
          value: 2863
    approximationNotes: >-
      所有 EV 数字均为百万美元。收入假设：$86M 来自 Maddyness 引述的法国监管数据（FY2024）；$125M 来自 Growjo / Compworth 分析师估计（未确认）。倍数来自 Finerva
      行业中位数（4.4x）、Owkin $1B 估值 / $86M 收入（11.6x）、PremierAlts 二级市场估值（18.6x）和 Recursion
      可比公司（22.9x）。这些只是示意性的敏感性点；实际企业价值还取决于现金、优先权和少数股权等这里未纳入的因素。
    claimRefs:
      - CV006
      - CV013
      - CV015
      - CV016
      - CV026
      - CV029
      - CV030
  - id: FV003
    title: 按情景划分的估值与回报区间
    type: range
    layout: standard
    summary: 截至 2026 年中，Owkin 在低位（熊市）、基准和高位（牛市）情景下的隐含企业价值区间，并列明各情景假设。
    data:
      items:
        - label: 熊市情景（$600M–$900M）
          low: 600
          high: 900
          note: 下轮融资估值低于 $1B；行业倍数压缩；合作伙伴减少；低于 2021 年 $1B 估值
        - label: 基准情景（$1.0B–$1.5B）
          low: 1000
          high: 1500
          note: 估值持平至小幅上调；K Pro 增长；$200M 现金支撑资金跑道；未披露财务数据
        - label: 牛市情景（$1.8B–$2.5B）
          low: 1800
          high: 2500
          note: 新一轮融资估值上调；披露 K Pro ARR；毛利率 55%+；新增多个企业客户
    approximationNotes: 所有数字均为百万美元。区间是方向性估计，来自行业倍数分析、上市可比公司交易水平、M&A 参考（PathAI）和二级市场数据。不是正式 DCF，也不是风险调整后 NPV。
    claimRefs:
      - CV005
      - CV009
      - CV022
      - CV023
      - CV029
      - CV030
      - CV036
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的七维评分：市场、证明、护城河、经济性、风险、估值和证据质量。评分 1–10，10 为最佳。
    data:
      items:
        - label: 市场机会
          value: 8
          note: AI 药物发现 TAM 为 $2.6-2.8B（2026），到 2034 年增至 $16.5B；药企研发资金池为 $276-288B
        - label: 临床 / 平台证明
          value: 6
          note: K Pro 已在 Sanofi 和 AstraZeneca 投产；K Pro 本身尚未发布独立临床结果
        - label: 竞争护城河
          value: 7
          note: 联邦学习 + 180+ 医院网络在结构上可防守；受 GDPR 约束的欧盟市场更偏向联邦路径
        - label: 单位经济性
          value: 3
          note: 毛利率未披露；NRR 未知；CAC 和回本周期未公开；收入结构（SaaS vs 里程碑）不清楚
        - label: 风险画像
          value: 3
          note: 合作伙伴集中度高；融资间隔 4 年；没有经审计账目；管理文化有负面报道
        - label: 估值纪律
          value: 4
          note: $1B 估值对应 11.6x EV/Rev，高于行业中位数 4.4x；相对有临床证明的同业（22-29x）偏高但不算极端
        - label: 证据质量
          value: 3
          note: 没有管理层账目；新一轮融资未确认；公开渠道只有来自法国监管数据的财务信息
    approximationNotes: >-
      评分是分析师基于本次报告收集证据作出的定性判断，并非专有评分模型。市场评分使用 Finerva 和 Axis Intelligence 数据。证明评分因缺少 K Pro 已发表结果而扣分。经济性评分因完全没有毛利率 / NRR
      披露而大幅扣分。
    claimRefs:
      - CV004
      - CV006
      - CV012
      - CV014
      - CV026
      - CV037
      - CV039
