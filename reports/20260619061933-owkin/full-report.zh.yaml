      - number: '8.3'
        title: 牛、基准与熊情景
        blocks:
          - type: paragraph
            body: >-
              牛市情形（$1.8B-$2.5B）：2026 年下半年或 2027 年上半年，公司完成一轮新的 $200-300M 主融资，投后估值上调至 $2-2.5B。驱动因素包括 K Pro
              经常性收入指标得到确认、AstraZeneca 交易扩容，以及大型药企战略买家按 PathAI/Roche 模板发起的主动上门 M&A 兴趣。到 2027 年，收入随 K Pro SaaS 放量和里程碑节奏增至
              $130-160M。联邦数据护城河（180+ 家医院站点）让 Owkin 区别于集中式竞争对手。毛利率披露为 50%+， 支撑更高估值倍数。

              基准情形（$1.0B-$1.6B）：2026-2027 年，公司在 $1B 附近完成新一轮融资（平轮），但财务披露不透明、 四年融资空窗压住估值。K Pro 带来温和收入增长；但 NRR
              和毛利率未公开，按披露收入计，倍数压缩至 10-14x。Sanofi 和 BMS 托住收入，但客户集中风险限制新客户赢单带来的上行。现金头寸足够，无需困境融资。

              熊市情形（$600M-$900M）：2027 年，公司以 $800-900M 水平下调估值融资，触发因素可能是 AI 生物科技 整体倍数压缩、Sanofi/AstraZeneca 的 K Pro
              合同未能规模化落地，或药企合作伙伴预算意外收缩。里程碑节奏推迟， 收入停滞在 $100M 以下。Sifted 报道的内部执行问题加速关键人才流失。基本面转弱、交易枯竭后，PremierAlts $1.6B
              的二级市场估值不再可得。
