      - number: '8.2'
        title: 可比公司组：公开交易可比、M&A 退出与行业倍数
        blocks:
          - type: paragraph
            body: >-
              Owkin 的可比位置并不常见：其收入和模型更像 AI 原生药企合作，而不是传统 SaaS。因此，若不调整收入质量（里程碑波动 vs. 经常性 SaaS），单纯收入倍数分析并不充分。

              最好的公开交易可比是 Recursion Pharmaceuticals（RXRX）和 Insilico Medicine（HKEX: 3696）。Recursion 2026 年 6 月市值
              $1.71B，FY2025 收入 $74.7M（隐含 P/S 约 22.9x），但其现金运营支出约 $400M，同时持有 $753.9M 现金——资本结构与 Owkin
              根本不同，且公开流通盘吸收了流动性折价。Insilico Medicine 2025 年 12 月完成香港 IPO，市值约 $2.1B，到 2026 年 6 月增至约 $2.52B，并报告 FY2024 收入
              $85.83M（隐含 P/S 约 29x）——但其收入波动大且由里程碑驱动，2025 年 H1 下降 54%。两家公开可比公司都定价了大量临床管线可选性。

              最相关的 M&A 可比是 PathAI（Roche，$750M 预付款 / $1.05B 总价，2026 年 5 月）和 Paige AI（Tempus，$81.25M，2025 年 8 月）。PathAI
              累计融资 $355-660M，估计收入 $100-250M，隐含收购倍数为收入的 3-7x。Paige AI 以 $81.25M 退出，而此前累计融资
              $220M+，构成显著折价退出，是任何与数字病理相邻平台的警示性可比。Finerva 2026 年 Q1 生物科技中位 EV/Revenue 4.4x 代表行业地板；有临床证明的 AI 平台可达到 6-10x。按
              $1B 估值计算，Owkin 隐含倍数为 11.6x；按 $1.6B 二级估值计算为 18.6x，二者均高于行业中位数，但依赖前瞻叙事（K Pro SaaS 规模化），尚未由披露的收入质量指标支撑。
