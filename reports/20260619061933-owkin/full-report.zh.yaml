      - number: '3.2'
        title: 竞争对手画像：规模、管线与战略方向
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，Insilico Medicine 拥有该领域最重要的临床证明点。其 rentosertib 候选药物——完全由 AI 为特发性肺纤维化设计——在 2025 年 6 月发表于 Nature
              Medicine 的 Phase IIa 结果为阳性，十二周内用药组用力肺活量改善 98.4 mL，而安慰剂组下降 20.3 mL。公司 2025 年完成 $110 million Series E，2025 年
              12 月在港交所上市，FY2025 报告收入 $56.2 million、现金 $393 million，并在 2026 年 3 月与 Eli Lilly 签署 $2.75 billion R&D
              合作，其中首付款 $115 million。其 Pharma.AI 平台覆盖 Biology42（靶点发现）、Chemistry42（生成式化学）和 Medicine42（临床设计）模块。Insilico
              在靶点识别上与 Owkin 争夺药企合作预算；Owkin 的多模态患者数据和联邦访问，与 Insilico 生成式 AI 优先、集中式数据的模型形成对比。


              合并后的 Recursion-Exscientia 实体（RXRX）代表该领域最大的 AI 药物开发操作系统，把 Recursion 由 phenomics 驱动的高通量生物学与 Exscientia
              的精准分子设计整合在一起。这笔 $688 million 全股票合并于 2025 年初完成。与 NVIDIA 共建的 BioHive-2 超级计算机支持跨 60+ PB 数据训练，数据覆盖
              phenomics、转录组学、蛋白质组学和 ADME。合并后实体 2026 年报告现金 $754–850 million，跑道可延至 2028 年初，并持有来自 Roche/Genentech、Sanofi 和
              Bayer 的超过 $20 billion 潜在里程碑付款。Recursion 主要在生物学和化学方向与 Owkin 争夺药企 R&D 预算，而不是在病理 AI 上竞争。


              Isomorphic Labs 于 2026 年 5 月完成由 Thrive Capital 领投的 $2.1 billion Series B，Alphabet、GV、MGX、Temasek、CapitalG
              和 UK Sovereign AI Fund 参投，使累计融资超过 $2.6 billion。其 IsoDDE 平台源自基于 AlphaFold 的 AI，推进肿瘤学、免疫学和心血管疾病药物设计。公司与
              Novartis、Eli Lilly 和 Johnson & Johnson 有合作；首批临床候选药物预计 2026 年底前出现。按累计融资计，Isomorphic 相对 Owkin 的资金优势约为 7
              倍，在算力和基础模型训练投资上形成结构性差距。


              BenevolentAI（Amsterdam: BAI）自 2022 年上市以来反复重组。第一轮裁员 180 人后，又进一步削减 30% 员工、关闭美国办公室，并搁置 SaaS 知识工具。其股价较 2022 年
              IPO 下跌超过 90%，市值降至约 £85 million。公司保留 Phase II 的 BEN-8744（一款用于溃疡性结肠炎的 PDE10 抑制剂）以及 $594 million Merck KGaA
              合作。BenevolentAI 是本章主要负面证据锚点：当发现时间线超过资本市场耐心时，AI 平台公司会面临严峻烧钱挑战。
