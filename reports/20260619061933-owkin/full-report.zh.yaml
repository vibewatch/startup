      - number: '6.2'
        title: 具名客户部署与生产证据
        blocks:
          - type: paragraph
            body: >-
              Sanofi 是 Owkin 的旗舰客户，也是最早的商业伙伴，关系跨越连续三个阶段。2021 年 11 月，Sanofi 投入 $180 million 股权投资，并配套 $90 million
              肿瘤合作，覆盖非小细胞肺癌、三阴性乳腺癌、间皮瘤和多发性骨髓瘤。到 2022 年 10 月，范围扩展到 Sanofi 免疫学管线中的药物定位。2026 年 6 月，合作再次深化为 5 年 K Pro
              企业授权，Owkin 将构建定制智能体式 AI 系统，运行在 Sanofi 自有 IT 栈内。Sanofi 首席数字官 Emmanuel Frenehard 公开背书该安排，称专门构建的 智能体式系统将让
              Sanofi 团队「以更高速度、更深洞察和更强信心运转」。

              Bristol-Myers Squibb 于 2022 年 6 月进入多年期战略合作，覆盖由 AI 驱动的心血管疾病临床试验设计，包括协变量调整和外部对照组。交易包含 $80 million 预付款（股权 +
              合作费），以及最高 $100 million 的成功里程碑付款。BMS 高级副总裁 Venkat Sethuraman 公开背书该合作，称其用「来自临床和真实世界来源的高质量、多样化数据」增强 BMS 项目。截至
              2026 年 6 月，BMS 尚未正式宣布 K Pro 授权。

              AstraZeneca 从 2024 年诊断 AI 合作（BRCAura gBRCA 突变预筛查，在 ESMO 展示结果中达到 93% 敏感性）推进到 2026 年 5 月签署 3 年 K Pro
              企业授权。MSD 于 2023 年 12 月签署合作，为欧盟市场开发跨 4 种癌症类型的 MSI-H AI 诊断；这些资产在 2026 年 3 月转入 Waiv。Servier 于 2023 年 10
              月进入多年期合作，方向是肿瘤转化医学。

              Micregen 的 MD 提供了具名证言，确认使用 K Pro 准备投资人推介材料，并称用传统方法几乎「不可能」。Institut Gustave Roussy 研究部负责人称 K Pro
              是快速多模态患者数据分析的「改变规则的工具」，这是除药企层以外，平台获得的第一份有独立归属的医院领域背书。
