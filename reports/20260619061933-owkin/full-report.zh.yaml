      - number: '2.5'
        title: 规模与采用尽调缺口：相互冲突的分析师估算和未披露的 Owkin SOM
        blocks:
          - type: paragraph
            body: |-
              最重要的市场结论，是公开记录无法支撑什么。抓取证据没有披露 Owkin 自身收入、run-rate、Sanofi 标题之外的合作经济性，以及任何可服务可获取市场数字；因此本章所有美元视角都是自上而下的
              TAM，而不是 Owkin 特定的 SOM。正因为有这个缺口，规模金字塔才把底层留空，后续估值工作也必须要求管理层提供内部切分。

              两个结构性矛盾被保留下来，而不是被平均掉。第一，可信分析机构对 AI 药物发现增长分歧很大，Mordor 的 25.94%
              CAGR 是 Fortune 12.20% 的两倍多，仅这一项就能让 2031-2034 年市场规模相差数十亿美元。第二，诊断商业化路径取决于报销和付款方覆盖，但没有抓取来源确认
              MSIntuit 已获得这些支持，第二条收入通道仍未证明。尽调路径是取得 Owkin 按渠道划分的收入、已签约里程碑时间表、监管申报时间线，以及任何独立检测量或报销数据，再与这里的外部
              TAM 视角对账。在那之前，市场最好被描述为庞大且增长中，但只与 Owkin 已证明的触达松散相连。
