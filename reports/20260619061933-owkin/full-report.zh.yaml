            body: >-
              Owkin 采用混合型药企合作模式，建立在三个相互咬合的收入杠杆上：(1) 签约时收到的预付股权或合作费用，(2) K Pro agentic AI 平台的多年期经常性 SaaS 许可，以及 (3)
              与特定药物发现研究成果挂钩、由里程碑触发的付款。基础性 Sanofi 交易（2021 年 11 月）把 $180 million 股权投资与同期 $90
              million、三年期肿瘤合作付款安排结合在一起——Pharmaphorum 通过独立报道确认了这一结构。Bristol-Myers Squibb 随后在 2022 年 6 月投入 $80 million
              Series B 股权 tranche，并附带最高 $100 million 潜在里程碑付款，用于心血管试验 AI 应用。2026 年，Sanofi 关系通过一份五年期 K Pro
              企业许可进一步加深；AstraZeneca 也在 2026 年 5 月签署独立的三年期 K Pro 许可协议，显示头部十强药企对平台的采用扩大。Owkin 的医院网络——现已覆盖 180+
              家机构——是联邦数据获取资产，而不是直接收入来源；价值在于提供保护隐私的多组学数据，支撑 AI 平台的临床可信度。2026 年 3 月，Owkin 将诊断部门（原 Owkin Dx）拆分为
