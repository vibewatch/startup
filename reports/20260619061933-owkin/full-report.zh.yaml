      - number: '1.5'
        title: 里程碑、合作关系与负面事件
        blocks:
          - type: paragraph
            body: >
              Owkin 的公司时间线从 2016 年获得种子融资创立开始，到 2021 年成为独角兽，随后完成两项重大药企战略交易，在 CE 认证 AI 诊断上取得重要监管里程碑，并在 2025–2026 年加速转向
              agentic AI。

              最重要的近期里程碑包括：2025 年 10 月发布 K Pro（首个商业部署的生物制药 agentic AI 副驾驶，建立在 Owkin Zero 之上）；2026 年 3 月将诊断部门（Owkin Dx）拆分为
              Waiv，并获得 $33 million 新融资；2026 年 6 月与 Sanofi 扩大多年期 K Pro 合作，显示企业 AI 服务关系进一步加深。

              负面一侧，2025 年 9 月公司启动集体裁员计划，削减约 50 名员工。Sifted 报道称，离职与在职员工提到 “huge managerial issues”，CEO Thomas Clozel
              也公开承认，转型期间 HR 执行并不完美。重组明确与重新聚焦纯 AI 的战略有关，Owkin 同时还计划剥离后来成为 Waiv 的诊断部门。2024 年 $5.6 million 净亏损以及仍需
              $200–$300 million 新融资，进一步强化了财务风险画像。截至运行日期，公司本身未发现诉讼、制裁或监管负面事件。Waiv 单独在 2026 年根据 EU IVDR 法规为基于 AI
              的乳腺癌和结直肠癌检测取得双 CE 标志，但 Waiv 现在已是独立实体。
