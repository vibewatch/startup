      - number: '2.3'
        title: 买方、用户与付款方地图：核心由药企 R&D 预算买单，诊断实验室是相邻通道
        blocks:
          - type: paragraph
            body: >-
              主要经济买方是制药 R&D 和业务发展部门。最清晰的证明是 Sanofi 2021 年 12 月投入 USD 180 million

              使 Owkin 成为独角兽，同时配套一项价值 USD 90 million、覆盖四种癌症的三年合作和研究里程碑。这个买方背后是很大的资金池：Evaluate

              数据显示 2024 年全球药企 R&D 接近 USD 288 billion，EFPIA 报告欧洲行业 2023 年 R&D 约

              EUR 50 billion，Nature Reviews Drug Discovery 的一项分析将 2021 年全球生物制药 R&D 定位在 USD

              276 billion。Owkin 累计融资超过 USD 255 million。买方内部的用户，是需要访问孤岛化、多机构数据的数据科学家、生物学家或临床试验设计者。


              第二条通道经过病理实验室和医疗系统，服务于产品化诊断。MSIntuit CRC 是唯一用 H&E 切片做 MSI 检测、带

              CE 标志的 AI 测试，瞄准病理医生短缺和免疫疗法匹配；预算所有者从 R&D
              转向实验室，并最终转向付款方报销。联邦学习的最终用户集中在医疗服务提供方和药企，约占该市场四分之一，北美占主导。Roche、Guardant、Tempus、Caris

              和 Illumina 等精准肿瘤既有玩家，勾勒出 Owkin 最终必须进入的面向付款方竞争格局。
