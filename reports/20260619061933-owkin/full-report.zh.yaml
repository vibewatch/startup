  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：药物发现 AI、病理既有玩家与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，Owkin 位于三个相邻竞争场域的交叉点。第一是 AI 原生药物发现平台，Insilico Medicine、合并后的 Recursion-Exscientia 实体、Isomorphic
              Labs（DeepMind 拆分公司）、BenevolentAI 和 Schrödinger 都试图通过生成式 AI、phenomics、基于物理的模拟或知识图谱方法压缩制药 R&D 周期。第二是数字病理
              AI，Owkin 过去的诊断能力（现归入拆分后的 Waiv）曾与 PathAI 和 Paige AI 竞争；前者正被 Roche 以 $750 million 首付款收购，后者于 2025 年 8 月被
              Tempus 以 $81.2 million 收购。第三是临床数据基础设施与联邦分析，Owkin 的医院网络在这里与 Tempus 的集中式临床数据平台、Flatiron Health（Roche 子公司）以及
              Foundation Medicine 的基因组伴随诊断网络竞争。


              除这些具名对手外，最常见替代方案是药企内部自建：Pfizer、Roche、Novartis、AstraZeneca 和 Sanofi 每年都在内部 AI R&D 基础设施上投入数亿美元，也维持着与
              Schrödinger 等计算化学平台供应商的既有关系。大型药企结构上很容易多栖：公司会并行评估供应商，且常常同时授权多个 AI 平台，从而限制任何单一供应商的定价权。2026
              年要观察的结构性信号是整合——PathAI 进入 Roche、Paige 进入 Tempus，都符合既有玩家收购专业 AI 团队而非自建的模式，压缩了独立病理 AI 供应商的窗口期。AI 药物发现市场 2025
              年估值约 $1.94 billion，预计 2026 年达到 $2.6–2.8 billion；全球目前有超过 173 个 AI 设计药物项目处于临床试验。
