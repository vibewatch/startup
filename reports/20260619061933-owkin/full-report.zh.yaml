      - number: '5.2'
        title: 技术架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Owkin 的技术栈是在联邦数据底座之上叠加生物学基础模型。模型层是 OwkinZero，一个面向生物学领域的大型推理模型，训练数据超过 300,000 对已验证问答，覆盖 8
              类生物医学任务（包括靶点可成药性、模态适配性、药物扰动效应），并利用专有患者数据、空间转录组和 bulk 转录组学。配套 arXiv 论文显示，OwkinZero 模型通过对开源 8B–32B LLM 做
              Reinforcement Learning from Verifiable Rewards 后训练得到；这些专用模型在生物学基准上超过更大的商业 LLM，并展现跨任务泛化能力。2026 年 1 月与
              NVIDIA 的合作使用 Nemotron 开放模型家族和 NVIDIA NeMo RL 框架，扩展驱动 Owkin K 的下一代 OwkinZero。数据层由 MOSAIC
              多模态肿瘤数据集和联邦医院网络组成：Owkin 不集中病历，而是用联邦学习让数据留在医院服务器，站点之间只传递模型更新。Owkin 将这一设计开源为 Substra（现由 Linux Foundation for
              AI & Data 托管，打包在 Kubernetes 中，可审计），并通过 FLamby 做基准测试。病理组织学的计算机视觉基础模型 Phikon（85.8M 参数 ViT-Base，用 iBOT 在 40M
              TCGA 图块上训练）和 Phikon-v2（ViT-Large，用 DINOv2 在 450M 图像 PANCAN-XL 语料上训练）提供切片级表征，输入 ENLIGHT–DeepPT
              框架等生物标志物发现和治疗反应模型。这套多模态、联邦式、模型加数据的架构才是核心运营模式，而不是一个单体应用。
