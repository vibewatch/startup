              Sanofi 5 年和 AstraZeneca 3 年 K Pro 企业授权均在 2025 年 10 月商业发布后 7 个月内宣布，验证了 Owkin
              既有药企信任关系能够转化为长期平台承诺。深度嵌入的部署模式——智能体运行在客户 IT 栈内——会形成持久切换成本，集成完成后应支撑收入留存。
            calloutType: strength
