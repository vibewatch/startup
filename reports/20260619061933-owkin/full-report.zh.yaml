      - number: '3.5'
        title: 壁垒耐久性、转换成本与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Owkin 最耐久的竞争资产，是联邦学习基础设施与 MOSAIC
              数据集的组合。复制这套资产，竞争对手需要跨多个司法辖区与数百家医院签约，在每家机构内部搭建合规的联邦计算基础设施，大规模整理空间组学数据，并等待多年，让所得数据集达到可与 MOSAIC
              相比的临床多样性。Insilico、Recursion 和 Isomorphic Labs 都没有公开披露过可比的联邦医院网络计划；三者都使用集中式专有数据集。Foundation Medicine 和
              Flatiron Health 拥有大型医院网络，但分别聚焦基因组测序和电子健康记录，而不是空间多组学与联邦 AI 训练的结合。


              转换成本不低。把 K Pro 嵌入药物开发工作流的药企伙伴，会面临数据重新集成成本、临床试验场景中 AI 辅助决策的监管再验证，以及科学团队和高管团队再培训。这带来估计 6–18
              个月迁移摩擦和中等锁定。多栖——药企并行运行多个 AI 平台——比直接替换更威胁定价权，因为大型药企通常会同时在 3–5 个 AI 平台关系中分散供应商风险。


              最大的结构性风险在行业层面：截至 2026 年 6 月，没有 AI 设计药物获得监管批准。BenevolentAI 的经历——股价暴跌 90% 以上、反复裁员、SaaS
              业务搁置、美国办公室关闭——说明在没有监管里程碑的漫长时间线上，资本市场耐心有限。AI 支持候选药物的 Phase II 成功率平均约 40%，与传统成功率相当，削弱了临床溢价叙事。Recursion
              合并后搁置了三个项目。如果 AI 药物发现进入持续可信度缺口，药企合作预算可能转向更小的首付款承诺，挤压 Owkin 的经常性许可收入模式。
