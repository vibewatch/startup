            body: >-
              作为私营公司，Owkin 无需提交公开财务报表，也没有自愿披露。由此产生的缺口是结构性且广泛的：毛利率、营业利润率、EBITDA、烧钱率、现金余额、按合同划分的 ARR、NRR、CAC
              和回本期都不在公开记录中。客户收入集中度——Sanofi、BMS、AstraZeneca 与其他客户分别贡献总收入的比例——未被量化。Sifted 2025 年报道称，Owkin 员工在公司转向 agentic
              AI 期间公开批评内部管理，提到裁员、组织透明度不足和战略变化沟通不佳——这是关于转型执行质量的负面信号，并直接影响财务。历史合作价值绝大部分依赖两家锚定伙伴（Sanofi 和
              BMS），形成结构性客户集中风险；若任一伙伴缩小范围或把 AI 能力收归内部，影响可能重大。没有管理账和独立验证财务报表，就无法承销回报资本模型。
