  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Owkin 的商业界面围绕「Owkin K」展开。这是面向生物制药的可互操作智能体式基础设施，旗舰产品 K Pro 则被 Owkin 描述为「由多模态患者数据驱动、帮助生物制药做出更聪明决策的生物学 AI
              智能体」。K Pro 是一个用自然语言查询的企业平台：单一智能编排器会动态选择并组合专用 AI 技能，回答从靶点发现到组合策略的药物开发管线问题，并返回基于多模态患者数据、可用于发表的答案。面向科学家的免费层 K
              Pro FREE（此前品牌为 K Navigator）帮助生物学家写作、查文献、验证假设和可视化数据，并确保结果能追溯到 PubMed 等可信来源。底层资产包括数据和基础设施：MOSAIC
              空间与多组学数据集（11 种肿瘤类型、2,700 个癌症样本）、K Pro 页面称为「全球最大」的患者数据网络（104 家医院），以及 Owkin 的联邦学习工具。曾经支撑受监管产品线的 CE 标志诊断产品
              MSIntuit CRC 和 RlapsRisk BC 已在 2026 年 3 月剥离至 Waiv，因此当前 Owkin 组合集中在 K 平台、OwkinZero
              模型和底层数据网络，而不是已交付的体外诊断设备。客户工作流从药企 R&D 问题开始，进入自然语言 K Pro 查询，再由系统在患者数据上编排生物学推理，最后给出带证据链接、排好优先级的答案，可能改变项目轨迹。
