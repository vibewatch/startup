      - number: '2.2'
        title: 市场规模：多重视角、相互冲突的 AI 估算，以及未披露的 Owkin SOM
        blocks:
          - type: paragraph
            body: |-
              没有单一 TAM 能定义 Owkin，因此本章用多个抓取视角交叉校准。AI 药物发现方面，Mordor Intelligence
              估算市场在 2025 年为 USD 2.58 billion、2026 年为 USD 3.25 billion，并以 25.94% CAGR
              到 2031 年达到 USD 10.29 billion；Fortune Business Insights 则给出 2025 年 USD 4.46
              billion、2026 年 USD 5.00 billion，到 2034 年 USD 12.56 billion，CAGR 只有
              12.20%。两家可信分析机构对增速的判断相差超过两倍，因此诚实读法是 2026 年约 USD 3.25-5.0 billion
              的区间，而不是一个点估计。MarketsandMarkets 又给出 AI 精准医疗视角：2024 年 USD 0.78 billion，以
              30.7% 增长至 2030 年。

              使能技术层面，Precedence Research 将联邦学习市场估为 2026 年 USD 1.59 billion，CAGR
              30.5%，医疗和生命科学约占四分之一。需求侧池子——精准肿瘤——大得多：Mordor 对 2026 年的估算是 USD
              127.68 billion，Precedence 是 USD 146.24 billion，Fortune 是 USD 133.06 billion，集中在
              USD 127-146 billion。Owkin 可服务的切片仍更窄，大致是聚焦肿瘤的药企 R&D 合作加欧洲 MSI 诊断；其真实
              SOM 未公开，因此规模金字塔底层刻意留空。
