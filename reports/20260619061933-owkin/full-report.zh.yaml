      - number: '5.4'
        title: 信任、安全、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              Owkin 的信任基础主要建立在保护隐私的联邦学习上：原始患者数据留在医院服务器，站点间只移动模型参数。这一设计意在尊重多机构网络中的数据所有权、患者隐私和保密性，对其欧洲医院基础下的 GDPR
              合规至关重要。开源 Substra 框架进一步强化了这一点：所有机器学习操作都有可审计、只读日志，并以「定期审计」的 Kubernetes 包形式交付，让 Owkin
              拥有纯集中式竞争者缺少的可追溯叙事。在受监管设备侧，CE 标志诊断产品 MSIntuit CRC（结直肠癌）和 RlapsRisk BC（乳腺癌复发）曾是 Owkin 最清晰的正式监管批准，但二者均在 2026
              年 3 月转入 Waiv 剥离实体，因此 Owkin 自有组合已不再交付带 CE 标志的 IVD。K Pro 本身定位为研究和决策支持副驾驶——没有披露 FDA clearance 或作为医疗器械的 CE
              mark。作为研究工具，这一姿态合理，但也限制了其输出在没有进一步验证前能推动受监管临床决策的程度。Owkin 强调 K Pro「安全、可解释、可互操作」，并称洞见会用真实患者验证；但公开材料没有披露 SOC 2
              / ISO 27001 认证、模型风险管理框架或独立审计结果，安全和模型治理控制仍是开放尽调项。
