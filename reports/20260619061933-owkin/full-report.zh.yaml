      - number: '7.2'
        title: 技术与运营风险
        blocks:
          - type: paragraph
            body: >-
              Owkin 的核心技术风险聚集在三条轴线：模型泛化、智能体式 AI 可靠性、分布式基础设施韧性。

              模型泛化是联邦医疗 AI 中结构性最难的风险。跨 180+ 医院节点训练，会引入来自不同患者群体、影像系统和病理流程的非 IID（non-independently-and-identically
              distributed）数据。联邦学习市场文献确认，数据异质性是限制联邦模型准确率的首要因素，需要专门聚合算法控制漂移。Owkin 已发表联邦学习方法论文，但未找到 K Pro 或 OwkinZero
              在分布外医院数据上表现的独立外部审计。K Pro 声称药物靶点识别加速 70%，该数字由公司披露并出现在自发新闻稿中；截至 2026 年 6 月，尚未被独立复现。

              智能体式 AI 幻觉是第二个关键风险。K Pro 部署自主智能体，围绕生物学文献和多模态患者数据推理，合成假设，并在数小时内生成可用于 IND 的
              资产定位策略。若错误生物学推断以高置信输出呈现，可能误导耗资数亿美元的药企 R&D 项目。Owkin 所称缓释措施——人工审查和「科学家优先」副驾驶
              设计——可以降低但不能消除该风险。公司没有公开披露系统性失败率或错误率。

              跨 180+ 医院节点的基础设施可靠性会带来分布式故障风险。重要枢纽流失——无论来自医院数据协议终止、IT 系统不兼容，还是数据使用面临法律挑战——都可能削弱训练数据多样性和模型质量。Owkin 患者信息页面确认
              HDS 认证云存储和假名化，但未披露 uptime SLA 或冗余架构。联邦学习理论上也容易受到模型反演和成员推断攻击；联邦架构虽减少原始数据暴露，但梯度共享在对抗条件下可能泄露训练记录信息。Owkin
              未披露防御此类攻击的架构。

              此外，Owkin 依赖专有 Qwen（以及其他开源权重 LLM）作为底层推理引擎，会受上游模型提供方决策影响。如果 Qwen 授权条款变化或模型弃用，Owkin 必须在替代基础模型上重新微调，带来成本和时间风险。
