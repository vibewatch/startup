      - number: '1.3'
        title: 融资、投资者与估值
        blocks:
          - type: paragraph
            body: >
              Owkin 自 2016 年种子轮以来累计股权融资约 $304.1 million，这一点由公司自己的 FAQ 确认。资本结构包括 $2.1 million 种子轮（2016 年 11 月）、累计约 $72
              million 的 Series A（2018–2020 年），以及 2021 年 11 月由 Sanofi 领投的 $180 million Series B；后者使公司以 $1 billion
              的投后估值进入独角兽行列。2022 年 6 月，Bristol-Myers Squibb 以 $80 million 战略投资延展 Series B，并附带最高 $100 million 里程碑付款——实际上把
              BMS 合作总价值最高推至 $180 million。

              投资者刻意混合了财务 VC 和战略药企公司投资者。财务支持方包括 GV（Google Ventures）、Bpifrance、Mubadala Investment Company、F-Prime
              Capital、Cathay Innovation、Eight Roads Ventures、NJF Capital、MACSF（法国医疗从业者养老基金）和 Otium Capital。战略公司投资者是
              Sanofi 和 Bristol-Myers Squibb，它们参与 Series B 既是资本背书，也传递了长期采用技术的意图。

              最近披露的 $1 billion 投后估值来自 2021 年 11 月。此后没有公开说明的新一轮一级市场估值。PremierAlts 截至 2026 年的二级市场数据提示估值最高可达 $1.6
              billion，但该数字来自二级交易聚合平台，无法独立核验。截至 2025 年末，据报道 Owkin 正在寻求 $200–$300 million 新融资，这将意味着估值明显上台阶，但截至运行日期尚未宣布交割。
