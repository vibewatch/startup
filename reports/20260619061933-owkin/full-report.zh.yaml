      - number: '5.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 联邦数据护城河叠加已发表生物学模型
            body: >-
              Owkin 最具防御性的资产，是联邦医院网络与已发表技术记录的组合：前者在不集中患者数据的情况下产出专有 MOSAIC 多模态数据集；后者包括 Nature Medicine（三阴性乳腺癌联邦学习）、Nature
              Cancer（ENLIGHT–DeepPT）、开源 Substra/FLamby，以及公开 Phikon 基础模型。难复制的数据入口叠加同行评审、可复现科学，比单纯智能体 UX 更难被通用 LLM 竞争者复制。
            calloutType: strength
            claimRefs:
              - CE008
              - CE012
              - CE017
          - type: callout
            title: K Pro 是研究工具，已获批产品已剥离
            body: >-
              K Pro 没有披露 FDA clearance 或 CE mark，定位为研究 / 决策支持；仅有的 CE 标志诊断产品（MSIntuit CRC、RlapsRisk BC）已在 2026 年 3 月剥离给
              Waiv。平台的核心生产力提升（例如靶点识别快 70%）是单个案例、公司自报数字，没有独立审计；也没有公开 SOC 2 / ISO 27001
              证明来支撑企业数据处理叙事。承销临床或受监管用途的买方必须把当前主张视为未经验证。
            calloutType: risk
            claimRefs:
              - CE022
              - CE030
              - CE031
              - CE036
          - type: callout
            title: 尽调：审计性能、安全与数据权利
            body: >-
              承销 Owkin 技术前，应要求：（1）对 K Pro/OwkinZero 准确率做独立基准测试，超出已发表静态基准；（2）安全和模型治理证据（SOC 2 / ISO
              27001、模型风险管理、企业产品中的审计日志）；（3）产出 MOSAIC 的医院数据共享协议的期限和排他性条款，因为联邦数据护城河是核心差异化。
