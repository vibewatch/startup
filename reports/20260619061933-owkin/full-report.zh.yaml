chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Owkin 是一家法国 - 美国私营 AI 生物技术公司，2016 年创立于巴黎，并按法国法律（SAS）注册。公司总部仍在法国巴黎，同时在美国纽约有重要布局。公司将使命描述为实现 “Biological
              Artificial Superintelligence”（BASI）——一种能够在人类认知之外建模并工程化生物学的 AI，用来加速药物发现和疗法开发。

              核心商业模式是面向大型制药公司的企业 SaaS 和长期 R&D 协作协议。Owkin 将 AI 平台嵌入药企在发现、转化和临床阶段的 R&D 工作流，通过多年期战略合作收费，而不是单纯的交易型授权。关键客户包括
              Sanofi、Bristol-Myers Squibb、AstraZeneca、Amgen、Roche、Ipsen、Johnson & Johnson 等大型生物制药公司，以及参与 Owkin
              联邦数据网络的领先学术医疗中心。

              截至 2026 年 6 月，公司的旗舰产品是 K Pro，一款面向生物制药、于 2025 年 10 月发布的 agentic AI 科学家副驾驶。K Pro 建在 Owkin Zero
              这一自有生物大语言模型之上，并整合多模态患者数据集（包括 MOSAIC 肿瘤数据集），让研究人员能够大规模查询生物学问题。更早的产品线——主要是 MSIntuit CRC 和 RlapsRisk BC，两款基于
              AI、带 CE 标志的结直肠癌和乳腺癌诊断产品——已在 2026 年 3 月拆分到名为 Waiv 的独立公司，使 Owkin 能完全聚焦于药物 R&D 的 agentic AI。Owkin
              的联邦学习基础设施已部署在 18 家领先学术研究医院，支撑其专有数据壁垒和保护隐私的 AI 模型训练。
