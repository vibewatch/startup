      - number: '3.3'
        title: 功能与能力对比：Owkin 领先在哪里，落后在哪里
        blocks:
          - type: paragraph
            body: >-
              Owkin 最强的差异点是联邦学习架构。原始患者数据从不离开成员医院系统；模型在本地训练，只有梯度更新被集中聚合。这让 Owkin 能访问 GDPR 下欧洲医院和学术医疗中心的真实世界临床数据，而
              Insilico、Recursion、Isomorphic Labs 等集中式竞争对手很难这样运作。MOSAIC 空间多组学数据集进一步强化这一点：它覆盖多种癌症类型，整合六类数据模态——空间转录组学、单细胞
              RNA-seq、bulk RNA-seq、全外显子组测序、临床数据和 H&E 病理图像——按公司披露，是全球最大的空间多组学肿瘤数据集，规模比任何可比替代方案大 100
              倍。没有竞争对手公开披露过同等规模、可比的联邦、多机构空间多组学计划。


              Owkin 落后的地方是纯化学设计。K Pro 目前不提供可与 Insilico 的 Chemistry42、Recursion-Exscientia 的整合精准化学或 Schrödinger 基于物理的
              FEP+ 套件相比的从头分子生成能力。Owkin 的主张在上游——靶点识别、患者分层、agentic 研究辅助——而不是下游分子设计和 ADME 预测。这使其在分子设计上与 Recursion 和
              Insilico 更互补，在靶点发现和临床试验优化上重叠更直接。PathAI（被 Roche 收购前）和 Proscia 在临床病理工作流自动化上竞争，而 Owkin 已通过 Waiv
              拆分基本退出该类别。Foundation Medicine 和 Flatiron Health（均属 Roche）是基因组诊断和临床数据既有玩家，拥有深厚医院关系和 FDA 批准产品锚点；Owkin 的 K
              Pro 在监管就绪度上尚未达到同等水平。
