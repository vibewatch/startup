  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Owkin 横跨 AI 药物发现、联邦学习和精准肿瘤诊断
        blocks:
          - type: paragraph
            body: |-
              抓取记录显示，理解 Owkin 最好的方式不是把它归入单一类别，而是看作三个相邻市场的交集。Owkin 自有页面描述了一款自主
              “AI Scientist”（K Pro），用于自动化生物制药 R&D；训练方式是联邦学习，原始患者数据留在医院服务器，只有模型在站点之间流转。Wikipedia
              记录其为一家法国 - 美国公司，2016 年由 Thomas Clozel 和 Gilles Wainrib 创立，产品包括 MSIntuit CRC 和
              RlapsRisk BC，员工约 350 人。这把 Owkin 放进 AI 药物发现软件与服务市场；GMInsights 按组件、技术、应用、治疗领域和最终用户切分该市场。

              边界纪律很重要，因为不应拿整个精准肿瘤池来给 Owkin 定规模。MarketsandMarkets 将更宽泛的 Drug Discovery
              Technologies 市场框定为 2025 年 USD 30.58 billion，但其中大部分支出是仪器、试剂和湿实验室流程，与
              Owkin 的 AI 层无关。Owkin 替代的现状是人工病理审查、集中式数据汇集和传统高通量筛选；这些是应排除的基线，不是
              Owkin 能捕获的收入。可防守的纳入支出是 AI 赋能的生物标志物发现、试验设计、保护隐私的模型训练，以及 MSIntuit
              这类产品化诊断。
