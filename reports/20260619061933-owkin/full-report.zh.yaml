      - number: '6.5'
        title: 客户集中度、反向信号与风险评估
        blocks:
          - type: paragraph
            body: >-
              Sanofi 在 Owkin 公开交易记录中的主导地位非常清楚。单一 Sanofi 关系贡献了 $180 million 股权投资、$90 million 肿瘤合作付款、免疫学扩展（金额未披露），以及 2026
              年 6 月 K Pro 5 年授权（金额未披露）——合计构成任何 Owkin 交易对手中最大且最持续的商业承诺。没有单个客户 ARR
              披露，精确收入集中度无法量化；但单一客户横跨每一条收入渠道的定性主导地位，对一家尚未盈利且尚未完成下一轮融资的公司构成重大投资风险。

              反向信号方面，Sifted 2025 年 9 月报道称，离开 Owkin 的员工提到「严重管理问题」，显示内部交付能力可能跟不上多年期企业 AI 部署的商业野心。约 50 个岗位（约法国员工
              15%）的重组被包装为 AI 智能体转型，但同时出现的内部批评说明，风险不只是人员规模管理。BMS 2026 年 5 月另行与 Anthropic 建立 AI 合作，Sanofi 也与 CytoReason
              并行合作，确认大型药企客户管理的是多元 AI 供应商组合，而不是独家押注 Owkin。2026 年 3 月 Waiv 剥离改善了 Owkin
              的战略聚焦，但因两个具名客户从合并账户移出，也减少了可见客户多样性。截至 2026 年 6 月，Owkin 地域结构仍集中在欧盟和美国，没有证据显示其在亚太有实质商业渗透。
