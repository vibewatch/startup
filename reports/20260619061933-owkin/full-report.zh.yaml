      - number: '8.5'
        title: 退出准备度、止损标准与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Owkin 的退出准备度最多只能算中等。三条退出路径有一定可行性：（1）IPO——2025-2026 年生物科技 IPO 市场回暖 （Eikon $381M、Insilico 港股 IPO）说明，具备临床证明和
              50%+ 收入可见度的公司窗口已开；但 Owkin 缺少公开财务、 审计账目，以及独立于合作伙伴决策之外的临床阶段管线验证。除非加速财务披露，否则未来 12 个月 IPO 概率不高。 （2）战略
              M&A——PathAI/Roche 模板（约 $100-250M 收入对应 $750M 首付款）是 Owkin 近期最可能的退出路径， 估值也与当前标记相符；潜在买家包括
              Sanofi（已深度整合）、Roche（通过 PathAI 在病理 AI 建立布局）和 AstraZeneca；$1B 入场价格为低于上一轮标记的交易设置了障碍。（3）二级交易——PremierAlts
              等平台曾在约 $1.6B 水平提供有限流动性。

              止损标准包括：低于 $800M 的下调估值融资（显示基本面估值重置）、24 个月内未能完成待定的 $200-300M 融资 （资本充足性风险）、Thomas Clozel 离职且没有可信接班方案（关键人风险），或
              Sanofi 或 BMS 合作范围实质收缩。 Waiv 少数股权在诊断业务上提供一点期权缓冲，但对 Owkin 母公司的估值论点并不关键。
