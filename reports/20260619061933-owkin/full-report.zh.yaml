      - number: '3.4'
        title: 定价、GTM 与分销力量
        blocks:
          - type: paragraph
            body: >-
              Owkin K Pro 通过多年期企业协议授权。AstraZeneca 交易（三年 K Pro 许可加嵌入式 agent 开发）和 Sanofi 交易（五年 K Pro 许可加共同开发定制化生物制药
              agents）确立了经常性多年合同结构，但确切财务条款仍未披露。根据官方公告描述的嵌入式 agent 交付范围、决策智能访问和 Owkin Zero 生物
              LLM，这些合同很可能是每年中高个位数百万美元规模的安排。公开可得的可比临床 AI 平台许可分析师估算显示，单站点部署每年 $150,000–$250,000；带定制 agent 开发的大型药企企业协议明显更高。


              Insilico Medicine 已将 Pharma.AI 授权给全球前二十大药企中的十三家，显示广泛分销渗透。Recursion 和 Exscientia
              主要通过基于里程碑的合作分销，整个行业首付款平均约为标题交易价值的 2%——这让它们的收入比 Owkin
              经常性许可模式更依赖后续事项、更受里程碑约束。PathAI（收购前）通过直销进入医院实验室和药企临床试验运营，BMS 和 Merck 是锚定合作伙伴。Schrödinger 以订阅方式授权
              FEP+，披露的大型药企合同年额超过 $50 million。


              Owkin 的 GTM 优势来自学术医院网络，它创造了双边飞轮：医院贡献联邦参与，换取研究洞察和数据访问；这加深 Owkin 的数据壁垒，也增强面向药企的商业提案。关键风险是收入集中——AstraZeneca 和
              Sanofi 合计很可能是 Owkin 最大的两个 K Pro 客户之一，若两三家锚定药企关系过度集中，一旦任何一方不续约，公司会暴露脆弱性。
