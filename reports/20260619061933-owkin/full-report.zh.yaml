  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景：最近已知估值、二级市场与资本头寸
        blocks:
          - type: paragraph
            body: >-
              Owkin 唯一公开确认的投后估值是 $1B，来自 2021 年 11 月 Sanofi 领投的 $180M Series B。2022 年 6 月 $80M Bristol-Myers Squibb
              战略投资延展了 Series B，但没有披露修订后的投后估值。截至 2026 年 6 月——间隔约 4 年——Owkin 没有宣布新的一级股权融资，因此 $1B 是唯一锚定估值。二级市场聚合器
              PremierAlts 引用的 2026 年估值约 $1.6B，但它并非基于已披露交易价格，应被视为方向性信号，而不是独立交易标记。

              Owkin 报告 FY2024 收入约 $86M，同比增长 83%，净财务亏损 $5.6M（较 FY2023 的 $31.3M 显著改善）。公司 2024 年底持有约 $200M 现金，在方向性烧钱假设下提供约
              2-3 年现金续航（470 名员工规模下每月 $3-9M）。截至 2025 年底，Owkin 目标一级融资 $200-300M；截至运行日期，尚未确认交割。2026 年 3 月 Waiv（前 Owkin
              Dx）剥离 单独融资 $33M，将诊断收入流从 Owkin 合并 P&L 中移出。Owkin FAQ 确认，所有投资人累计融资 $304.1M。$200M 现金头寸叠加 Sanofi 和 AstraZeneca
              多年期 K Pro 合同，说明现金续航并非迫在眉睫；但没有确认的新一轮融资，估值仍锚定在 5 年前的价格，造成新一轮相对该锚点如何定价的根本不确定性。
