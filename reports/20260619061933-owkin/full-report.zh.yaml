      - number: '5.5'
        title: 路线图、成熟度与产品风险
        blocks:
          - type: paragraph
            body: >-
              Owkin 宣称的方向是迈向「Biological Artificial Super Intelligence」（BASI）：借助 NVIDIA 扩展 OwkinZero，把 K Pro
              从肿瘤学延伸到相邻治疗领域（Sanofi 关系明确扩展到免疫学药物定位），并构建内部「AI Scientist」，自动发现新疗法和诊断。前瞻路线图由多年期药企承诺锚定——Sanofi 5 年定制智能体项目和
              AstraZeneca 3 年授权——二者同时提供收入可见度和产品方向。组合成熟度并不均衡：已发表科学、开源 FL 基础设施和病理基础模型较成熟，并获得外部验证；智能体式 K Pro 产品仍早期（2025 年
              10 月发布），其核心性能主张由公司自报。主要产品和技术风险包括：K Pro 没有 FDA clearance 或 CE mark，限制其用于受监管临床决策；模型可解释性缺口让监管申报更复杂；Waiv 剥离 将带
              CE 标志的诊断线移出 Owkin 自身护城河；开发者生态（GitHub、Hugging Face）真实存在但相较公司野心仍偏小；Recursion、Insilico、Isomorphic
              等全管线竞争者追逐相邻智能体式 AI 策略，带来复制风险。Owkin 在 2023 年（17% 员工）和 2025 年（约 15% 员工）向智能体式 AI
              转型期间裁员，并伴随员工对内部管理的批评，也给路线图增加执行风险。
