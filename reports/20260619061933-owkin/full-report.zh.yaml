      - number: '6.3'
        title: K Pro 商业采用与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              K Pro 于 2025 年 10 月商业发布，面向药企、生物科技公司和投资人，通过自然语言界面支持生物医学研究。平台结合 Owkin Zero（微调后的生物学 LLM）、来自 MOSAIC
              联盟和更广医院网络的多模态患者数据，以及智能体式 AI 架构。发布时，Owkin 声称内部性能基准显示药物靶点识别加速 70%（从 12+ 个月缩短至约 3
              个月），且至少一个未具名药企合作通过改进患者分群识别将试验周期缩短 35%。这些均为公司主张，未经独立验证。

              2025 年 10 月发布后的 7 个月内，Owkin 拿下两项已宣布企业授权交易：Sanofi 5 年协议（2026 年 6 月）和 AstraZeneca 3 年协议（2026 年 5 月）。二者都涉及
              Owkin 构建专用 AI 智能体，并部署在客户自有 IT 基础设施内——这种深度嵌入的部署模式会形成机构切换成本。K Pro 发布前，Owkin 与 STAT Brand Studio 对 200
              多名药企高管做了一项调查，近半数受访者认为克服数据挑战是智能体式 AI 的主要机会。该调查由 Owkin 委托，不能视为独立市场验证。Owkin 2024 年约 $86 million 收入、同比增长
              83%，与药企合作收入增长相符，但无法按产品或客户拆分。
