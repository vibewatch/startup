      - number: '2.4'
        title: 增长驱动与采用约束：隐私顺风对上验证、监管和执行风险
        blocks:
          - type: paragraph
            body: |-
              多个抓取到的驱动因素支撑长期需求。GDPR 和 HIPAA 等隐私监管把医院和药企推向联邦学习，因为它能在不移动原始数据的情况下训练模型；Precedence
              将其列为市场首要驱动。癌症负担是结构性的：WHO 记录 2022 年癌症死亡接近 1000 万，单是结直肠癌在
              2020 年约 200 万病例中就造成约 100 万死亡。AI 和生物学模型也在成熟，Nature Biotechnology
              对大规模扰动筛选的报道就是例证；FDA 持续批准 AI/ML 赋能医疗器械，也在降低商业诊断路径风险。

              约束同样具体。临床验证很慢：MSIntuit 在获批前需要一项盲法 Nature Communications 研究证明 96%
              敏感性，而报销仍未验证。EU AI Act 和 EMA 反思文件施加基于风险的制度，临床 AI 被视为高风险并需要 CE
              标志，即便仅用于药物 R&D 的 AI 可豁免，这带来双重合规复杂度。联邦学习自身也有技术摩擦，来自 non-IID
              数据异质性和单站点高基础设施成本。公司特定风险也不小：Owkin 在 2023 年裁员，并转向 AI agents
              模式，释放出战略和执行不确定性，单靠市场规模无法消化这一点。
