        title: 图表
        blocks:
          - type: callout
            title: 联邦架构创造可防守的欧洲与多机构数据访问
            body: >-
              在主要 AI 药物发现竞争对手中，Owkin 的联邦学习模式是唯一公开确认、能在医院数据环境内训练模型的方法，原始患者数据从不离开机构控制。这在欧洲市场尤其有价值，因为 GDPR
              执法严格，学术医疗中心也有阻止集中式数据外流的数据治理约束。Insilico Medicine、Recursion- Exscientia 和 Isomorphic Labs
              都没有公开披露同等范围的可比联邦医院网络计划，使 Owkin 的架构成为一种即便有大量资本注入也难以快速复制的结构性差异。
            calloutType: strength
            claimRefs:
              - CP034
              - CP035
          - type: callout
            title: 相比 Isomorphic Labs 的资金缺口带来结构性算力与模型训练风险
            body: >-
              Isomorphic Labs 2026 年 5 月的 $2.1 billion Series B 使其累计融资超过 $2.6 billion——约为 Owkin 披露累计融资约 $354 million 的 7
              倍。虽然 Owkin 的联邦方法资本效率较高（医院承担本地算力成本），但基础模型训练预算差距带来重大风险：未来 18–24 个月内，Isomorphic 的 IsoDDE 或 Recursion
              未来的生物基础模型，可能在生物推理上超过 Owkin Zero。如果来自 Alphabet、Meta 或 NVIDIA BioNeMo 的通用生物 LLM 达到可比生物推理质量，Owkin Zero 相对于商业
              LLM 的差异化将显著收窄。
            calloutType: risk
            claimRefs:
              - CP009
              - CP021
              - CP022
          - type: callout
            title: 病理 AI 整合提前关闭独立供应商窗口
            body: >-
              PathAI 被 Roche 收购（2026 年 5 月宣布）和 Paige AI 被 Tempus 收购（2025 年 8 月）都发生在 12 个月窗口内，遵循同一模式：诊断既有玩家收购专业 AI
              团队，而不是自建。Owkin 在收购周期见顶前先把诊断部门拆分为 Waiv，提前避开这一动态，使核心 Owkin 实体能专注 K Pro 药物发现任务。但 Waiv
              现在作为较小的独立供应商竞争，而市场上最大的两个独立病理 AI 玩家已经被吸收，Waiv 面临的分销和合作环境比 18 个月前更难。
            calloutType: insight
            claimRefs:
              - CP010
              - CP012
              - CP036
