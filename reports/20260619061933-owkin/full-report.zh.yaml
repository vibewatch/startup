      - number: '1.4'
        title: 规模指标与财务表现
        blocks:
          - type: paragraph
            body: >
              Owkin 是私营公司，不公开披露合并财务。可得最细数据来自 Maddyness 引用的法国监管披露和媒体报道。2024 财年收入约 $86 million，较 2023 年同比增长 83%，也是公司首次跨过
              $80 million 门槛。尽管增长迅速，Owkin 仍未盈利，2024 年净财务亏损为 $5.6 million——较 2023 年 $31.3 million 亏损显著改善。

              公司 2024 年末现金约 $200 million，提供了有意义的跑道，短期内没有迫在眉睫的融资危机。2025 年末裁减约 50 名员工（约占员工总数 15%）后，员工数估计约 450–500
              人。确切客户数量未公开；已知企业账户包括 Sanofi、BMS、AstraZeneca、Amgen、Roche、Ipsen 和 Johnson & Johnson，另有 18 家学术研究医院合作伙伴。

              Latka 的第三方数据估计 2023 年 ARR 约 $101 million，相比法国来源报道的 2024 年收入 $86 million 显得偏高。这一差异尚未被调和，应视为尽调缺口。Owkin
              不披露毛利率、净收入留存率或按细分划分的客户数量。公司目标是在五到六年内盈利（2025 年末表述），这意味着在当前水平下仍会继续消耗现金。
