      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 跟踪：需确认新一轮融资或审计账目后再上调
            body: >-
              Owkin 在关键拐点上呈现出一个确实有意思的平台——K Pro SaaS 企业合同相比过去只靠里程碑付款，收入质量有实质升级——
              但五年前的估值标记、缺失的毛利率数据、尚未确认的新融资，以及负面的管理执行信号叠加在一起，使买入结论缺乏支撑。
              需密切跟踪：上调的门槛条件，要么是公司披露一轮新的主融资、确认估值和条款；要么是自愿披露财务信息，包括经审计的 FY2025 账目和 K Pro ACV 指标。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV009
              - CV012
              - CV031
          - type: callout
            title: 反向信号：管理文化与执行风险
            body: >-
              Sifted 2025 年对 Owkin 内部管理批评的报道——包括员工抱怨「严重管理问题」、组织透明度差，以及向 agentic AI
              转向的沟通突兀——构成真实但难以量化的执行风险。公司估值取决于能否按时、按规格交付多年期企业软件合同；文化失灵不只是士气问题， 而是会直接流入收入和留存的交付风险。2025
              年裁员和诊断业务剥离证明公司在重新聚焦战略，但也说明此前模式并未按计划扩张。 这个反向信号本身还不足以支持回避结论，但会抬高上调建议前所需的证据门槛。
            calloutType: risk
            claimRefs:
              - CV031
              - CV032
          - type: callout
            title: 行业倍数压缩给新一轮定价带来逆风
            body: >-
              Biotech/genomics EV/Revenue 倍数从 15.19x 的峰值（2020 年 Q4）降至 4.4x（2026 年 Q1），五年压缩 71%。Owkin 上一轮主融资估值设在 2021 年
              11 月行业高点，并带有显著溢价。即便 Owkin 业务确实改善，宏观倍数环境也比 $1B 标记设定时大约严苛 3 倍。2026 年若以 $1B
              平轮融资，相对于行业而言，隐含倍数实际上上升——这对公司是有利结果， 但要让见过 2022 年以来全行业重估的机构投资者买账，必须靠披露的 K Pro 经济性支撑叙事。
            calloutType: insight
            claimRefs:
              - CV026
              - CV004
              - CV036
