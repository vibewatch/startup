      - number: '7.5'
        title: 否决标准、缓释框架与尽调要求
        blocks:
          - type: paragraph
            body: >-
              Owkin 的投资论点，是对三项相互连接主张的集中押注：（1）OwkinZero/K Pro 相比前沿通用 LLM 能产出真正更优的生物学推理；（2）Sanofi 和 BMS
              会深化而不是退出其平台承诺；（3）Owkin 能在现金吃紧前完成新一轮股权融资，并在约 2030–2031 年实现盈利。每一项都有可衡量的否决标准。

              论点破裂触发器 1（模型差异化失败）：若独立同行评审研究复现 OwkinZero 的基准任务，并显示其表现等于或低于 GPT-4o 或 Claude 3.7，Owkin
              的技术护城河将受到挑战。该风险目前无法从公开数据验证。监控：跟踪 OwkinZero ArXiv 引用、独立生物医学 AI 基准论文，以及 Owkin 2026 年发表管线。

              论点破裂触发器 2（客户集中）：若 Sanofi 在 5 年窗口（2026–2031）内发出不续约或实质降低 K Pro 参与度的通知，或 BMS 宣布战略性 AI 转向，离开 Owkin
              平台，收入将非对称坍塌。监控：跟踪 Sanofi 和 BMS AI 合作公告中的竞争性承诺。

              论点破裂触发器 3（资本）：若 Owkin 以低于 $1B 估值完成融资，或到 2027 年 Q1 仍未宣布新融资（大致对应 $200M 现金加
              $86M/年收入、扣除烧钱后接近关键水平的时间点），应重新评估入场价格和投资论点。监控：跟踪 Owkin 一级资本融资公告。

              论点破裂触发器 4（监管）：若 CNIL 或欧盟监管机构对 Owkin 健康数据处理启动正式调查，或 Owkin 未履行 GPAI 义务并收到 AI Office 执法通知，监管悬置将带来重大风险。监控：CNIL
              执法登记；EU AI Office GPAI 合规数据库（可用后）。

              关键开放尽调要求均需要管理层访问：（a）在公司赞助研究之外，对 OwkinZero 做独立基准验证；（b）按集中度拆分 K Pro 客户收入——尤其是 Sanofi 和 BMS 占总收入比例；（c）截至 2026
              年 Q2 的当前现金头寸和烧钱速度；（d）GPAI Code of Practice 采用状态和 OwkinZero
              训练数据透明度摘要；（e）董事会构成和继任框架；（f）最大医院节点的数据网络合同条款（期限、终止权）。
