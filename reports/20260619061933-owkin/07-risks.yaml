  - id: kill-criteria-mitigations
    title: "Kill Criteria, Mitigation Framework, and Diligence Asks"
    body: >-
      The investment thesis in Owkin is a concentrated bet on three connected claims: (1) that
      OwkinZero/K Pro produces genuinely superior biological reasoning versus frontier general-purpose
      LLMs; (2) that Sanofi and BMS will deepen rather than exit their platform commitments; and
      (3) that Owkin can close a new equity round before cash runs low and reach profitability by
      approximately 2030–2031. Each of these has a measurable kill criterion.

      Thesis-break trigger 1 (model differentiation failure): If an independent peer-reviewed study
      replicates OwkinZero's benchmark tasks and shows performance at or below GPT-4o or Claude
      3.7, Owkin's technical moat is challenged. This risk is currently unverifiable from public
      data. Monitoring: track OwkinZero ArXiv citations, independent biomedical AI benchmark
      publications, and Owkin's publication pipeline in 2026.

      Thesis-break trigger 2 (customer concentration): If Sanofi issues a notice to not renew or
      materially reduce its K Pro engagement during the 5-year window (2026–2031), or if BMS
      announces a strategic AI pivot away from Owkin's platform, revenue would collapse
      asymmetrically. Monitoring: track Sanofi and BMS AI partnership announcements for competing
      commitments.

      Thesis-break trigger 3 (capital): If Owkin closes a funding round below $1B valuation, or
      if no round is announced by Q1 2027 (the approximate point at which $200M cash plus
      $86M/year revenue minus burn would approach critical levels), re-entry pricing and thesis
      should be revised. Monitoring: track Owkin primary capital raise announcements.

      Thesis-break trigger 4 (regulatory): If CNIL or an EU supervisory authority opens a formal
      investigation into Owkin's health data processing, or if Owkin fails to comply with GPAI
      obligations and receives an AI Office enforcement notice, regulatory overhang would create
      material risk. Monitoring: CNIL enforcement registry; EU AI Office GPAI compliance database
      when available.

      Key open diligence asks, all of which require management access: (a) OwkinZero independent
      benchmark validation outside company-sponsored studies; (b) K Pro customer revenue by
      concentration — specifically Sanofi and BMS as percent of total; (c) current cash position
      and burn rate as of Q2 2026; (d) GPAI Code of Practice adoption status and OwkinZero
      training-data transparency summary; (e) board composition and succession framework; (f)
      hospital data network contract terms (duration, termination rights) at largest nodes.
