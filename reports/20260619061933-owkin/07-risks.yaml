callouts:
  - calloutType: "risk"
    title: "Customer Concentration: Sanofi Is a Single-Point-of-Failure"
    body: >-
      Sanofi's simultaneous roles as Owkin's largest equity investor, largest known revenue partner,
      and reputational validator creates a structural single point of failure with no disclosed mitigation
      beyond the 2026–2031 K Pro contract term. A Sanofi strategy shift would simultaneously damage
      revenue, investor confidence, and external credibility. This is the highest-priority risk for
      pre-investment due diligence.
    claimRefs:
      - CR020
      - CR021
      - CR041
      - CR045

  - calloutType: "risk"
    title: "OwkinZero Benchmarks Are Company-Reported — Independent Validation Is Absent"
    body: >-
      Owkin's boldest commercial claim — that K Pro delivers 70% faster drug target identification
      and OwkinZero outperforms GPT-class LLMs on biological reasoning — rests entirely on
      company-published studies with no confirmed independent peer-reviewed replication as of
      June 2026. For an AI company targeting multi-year enterprise contracts with sophisticated pharma
      R&D organizations, the absence of independent external validation is a material evidence gap
      and a diligence prerequisite before capital deployment.
    claimRefs:
      - CR029
      - CR030

  - calloutType: "insight"
    title: "EFPIA Exemption May Protect K Pro from EU AI Act High-Risk Classification"
    body: >-
      EFPIA's position paper confirms that AI tools deployed solely for medicines R&D are likely
      exempt from EU AI Act high-risk classification under Articles 2.6 and 2.8. If K Pro is
      successfully positioned as a pure pharma R&D tool — not a clinical decision-support medical
      device — Owkin avoids the CE-marking and conformity-assessment obligations that would apply
      to high-risk AI. This exemption claim requires legal confirmation and careful boundary
      management as K Pro's deployment scope expands.
    claimRefs:
      - CR031
      - CR032
      - CR004

