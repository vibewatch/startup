chapter:
  number: 7
  title: "Risks"
  summary: >-
    Owkin faces an asymmetric risk profile dominated by severe customer concentration (Sanofi represents
    anchor equity, largest revenue partner, and strategic validator simultaneously), a four-year primary-equity
    gap with an unconfirmed new round, EU AI Act GPAI obligations that took effect in August 2025 for
    OwkinZero, GDPR Article 9 compliance complexity across 180+ hospital data partners in multiple
    jurisdictions, and an internally documented management execution problem that triggered a 15%
    workforce reduction in September 2025. Model performance and independent validation remain unconfirmed
    beyond company-reported benchmarks. No active litigation or enforcement actions are on record, but the
    absence of public financial statements makes burn-rate and covenant risk unverifiable.

sections:
  - id: regulatory-legal-risk
    title: "Regulatory and Legal Risk"
    body: >-
      Owkin's regulatory exposure spans three distinct frameworks: the EU AI Act, GDPR Article 9
      health-data obligations, and US FDA oversight of AI-enabled medical devices. The EU AI Act
      became fully operative in stages: prohibited-AI rules in February 2025, general-purpose AI
      (GPAI) model obligations in August 2025, and full applicability of the Act on 2 August 2026.
      OwkinZero — Owkin's fine-tuned biological large language model at the core of K Pro — is a
      GPAI model and is therefore subject to active transparency, copyright-compliance, and
      systemic-risk obligations as of August 2025. Specifically, Owkin must publish a summary of
      OwkinZero's training data content, maintain a copyright policy, and assess whether OwkinZero
      poses systemic risk (high-capability threshold). No public GPAI Code of Practice filing or
      training-data transparency summary for OwkinZero has been located. The European AI Industry
      Alliance's GPAI Code of Practice, published in July 2025, is the voluntary compliance
      instrument Owkin should follow; failure to adopt it does not constitute a legal violation but
      removes the presumption-of-conformity benefit.

      For high-risk AI classifications, an important mitigant exists: EFPIA's position paper confirms
      that AI tools used solely for medicines R&D are likely exempt from EU AI Act high-risk
      classification under Articles 2.6 and 2.8 (scientific research exemption). K Pro deployed
      purely in pharma R&D workflows — not in clinical diagnostics — may therefore escape CE marking
      requirements. However, this exemption is contested and case-specific; any deployment that
      crosses from research into clinical decision support could trigger high-risk classification.
      The high-risk rules for general-area AI systems (biometrics, employment, etc.) now apply from
      December 2027 under the AI Omnibus political agreement of May 2026.

      On GDPR, Owkin processes special-category health data under Article 9, which prohibits
      processing unless specific exceptions apply (scientific research per Art.9(2)(j), or explicit
      consent per Art.9(2)(a)). Owkin's privacy policy, last updated 8 June 2026, confirms GDPR
      compliance commitments and HDS-certified cloud infrastructure for European data. Cross-border
      transfers to Owkin US use standard contractual clauses. The French CNIL has oversight over
      Owkin's French entity; any data breach or consent failure at a hospital node could trigger a
      CNIL investigation with penalties up to the higher of €20 million or 4% of global annual
      turnover. No enforcement action against Owkin has been identified in this research.

      On the US side, Owkin's K Pro platform is positioned as a research and decision-support tool
      for pharma scientists, not as an FDA-regulated medical device. The FDA's AI-Enabled Medical
      Devices list confirms a distinct pathway for clinical AI diagnostics (such as Waiv's former
      MSIntuit CRC and RlapsRisk BC products, now at Waiv). The March 2026 Waiv spinout removed
      these CE-marked diagnostics from Owkin's regulatory perimeter. IP risk from open-weight model
      components (Qwen, other fine-tuned models embedded in K Pro) is a latent but unquantified risk
      that warrants a full IP audit before investment.
