  - id: thesis-and-recommendation
    title: "Investment Thesis, Anti-Thesis, and Recommendation"
    body: >-
      The investment thesis rests on four pillars: (1) Owkin's federated learning architecture
      creates a structurally hard-to-replicate data access advantage across 180+ research hospitals
      globally; (2) K Pro's multi-year enterprise contracts with Sanofi and AstraZeneca introduce
      recurring revenue components with meaningfully higher quality than pure milestone payments;
      (3) the company has demonstrated rapid loss improvement ($31.3M → $5.6M in one year) while
      growing revenue 83% YoY, suggesting progress toward sustainability; and (4) the secondary
      market valuation of ~$1.6B and the pending $200-300M round search position Owkin near its
      BASI narrative inflection, where the narrative value of agentic AI for biopharma commands
      a premium from strategic investors.

      The anti-thesis is equally compelling: (1) the $1B primary valuation is now five years old
      and has not been tested with new money — sector multiples have compressed dramatically (from
      15x to 4.4x peak-to-trough) since that mark; (2) with no gross margin, NRR, or detailed
      contract economics disclosed, an investor cannot model unit-level economics or return profile;
      (3) key-person concentration in Thomas Clozel is high, and the 2025 internal management
      criticism reported by Sifted represents a real but unquantified execution risk; (4) the
      spinout of Waiv removed a revenue stream and concentrated the company further on partnerships
      with two anchor clients (Sanofi and BMS), whose continued appetite for AI investments could
      be affected by their own strategic shifts; and (5) Recursion's 22.6% year-on-year market cap
      decline despite strong cash reserves illustrates how the sector re-rates downward when
      proof-of-value timelines disappoint.

      Recommendation is TRACK: the K Pro commercial traction is genuinely encouraging, but the
      financial opacity prevents a buy call. A confirmed new primary round with disclosed terms,
      or access to management accounts, would be the gating condition to upgrade to BUY.
