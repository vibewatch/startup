  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: "audited financials"
      missingEvidence: >-
        Last three years of audited P&L, balance sheet, and cash flow statements from Owkin;
        management accounts with gross margin, NRR, ARR by contract, and burn rate.
      whyItMatters: >-
        Without audited financial data, no revenue-quality, unit-economics, or return model can be
        underwritten. The TRACK recommendation cannot be upgraded to BUY without this disclosure.
      diligencePath: >-
        Formal investor data room request to CFO Graeme Bell; or await voluntary disclosure in
        connection with the pending $200-300M primary round.
      relatedQuestionRefs:
        - QV003
        - QV030

    - type: private-evidence-only
      severity: material
      topic: "K Pro contract economics"
      missingEvidence: >-
        Annual contract value (ACV), duration, milestone schedules, and renewal terms for the Sanofi
        5-year K Pro license and the AstraZeneca 3-year K Pro license.
      whyItMatters: >-
        K Pro is the core forward-valuation driver; without disclosed ACV or NRR, investors cannot
        determine the mix of recurring vs. milestone revenue or project future revenue quality.
      diligencePath: >-
        Request redacted term sheets in data room; cross-reference against BMS milestone disclosures
        for benchmark.
      relatedQuestionRefs:
        - QV010
        - QV023

    - type: missing-source
      severity: material
      topic: "gross margin"
      missingEvidence: >-
        Gross margin by product type (K Pro SaaS licensing vs. milestone revenue vs. collaboration
        fees), and EBITDA margin trajectory.
      whyItMatters: >-
        Gross margin is the primary metric distinguishing a scalable SaaS-like platform from a
        services business. An undisclosed margin prevents multiple assessment or DCF model.
      diligencePath: >-
        Audited accounts or management accounts from data room. Cross-reference against Recursion
        (publicly disclosed gross margin for collaboration revenue).
      relatedQuestionRefs:
