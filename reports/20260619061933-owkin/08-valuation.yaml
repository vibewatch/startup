  title: "Valuation"
  summary: >-
    Owkin's last disclosed post-money valuation of $1B (November 2021) implies an 11.6x EV/Revenue
    multiple on FY2024 revenue of ~$86M, a meaningful premium to the 4.4x sector median for
    biotech and genomics companies in Q1 2026 but substantially below public AI drug discovery
    peers Recursion (~22.9x) and Insilico Medicine (~29x). Secondary market data from PremierAlts
    suggests a 2026 mark of ~$1.6B (18.6x), unconfirmed by a new primary round. A four-year gap
    since Owkin's last primary raise, the absence of gross margin and NRR disclosures, and a 15%
    workforce reduction in 2025 create material information risk. The K Pro platform's five-year
    Sanofi license and three-year AstraZeneca license provide multi-year revenue visibility, but no
    financial terms are disclosed. Recommendation is TRACK with LOW confidence until management
    accounts and a confirmed new round pricing are available; valuation stance is STRETCHED.

sections:
  - id: valuation-context
    title: "Valuation Context: Last Known Mark, Secondary Market, and Capital Position"
    body: >-
      Owkin's only publicly confirmed post-money valuation is $1B, established at the November 2021
      $180M Series B led by Sanofi. The June 2022 $80M Bristol-Myers Squibb strategic investment
      extended the Series B but did not disclose a revised post-money mark. As of June 2026 — a gap
      of approximately four years — Owkin has not announced a new primary equity round, making the
      $1B the sole anchor valuation. PremierAlts, a secondary market aggregator, cites an estimated
      2026 valuation of approximately $1.6B, but this is not based on a disclosed transaction price
      and should be treated as a directional signal rather than an arm's-length mark.

      Owkin reported FY2024 revenue of approximately $86M — a year-over-year increase of 83% — and
      a net financial loss of $5.6M (significantly improved from $31.3M in FY2023). The company held
      approximately $200M in cash at end-2024, providing an estimated 2-3 year runway on directional
      burn assumptions ($3-9M per month at 470-employee scale). Owkin targeted a $200-300M primary
      round as of late 2025; no closing had been confirmed as of the run date. The March 2026 spinout
      of Waiv (formerly Owkin Dx), which raised $33M separately, removed the diagnostics revenue
      stream from Owkin's consolidated P&L. The Owkin FAQ confirms total raised of $304.1M from all
      investors. The $200M cash position, combined with multi-year K Pro contracts with Sanofi and
      AstraZeneca, suggests runway is not immediately critical — but the lack of a confirmed round
      leaves valuation anchored to a five-year-old mark, creating fundamental uncertainty about where
      a new round would price relative to that anchor.
