  topStrengths:
    - Sanofi、Bristol-Myers Squibb 和 AstraZeneca 给了深度战略验证，合作是多年平台关系，不是一次性试点。
    - 通过大型医院网络接入联邦学习数据，形成差异化数据护城河，比纯软件 UX 更难复制。
    - 2025-2026 年产品重心收敛到 K Pro 和 Owkin Zero，相比传统诊断业务，可能提高经常性软件收入质量。
  topRisks:
    - 最后一次确认的新股估值仍是 2021 年 $1 billion 标记，投资人缺少转型后业务的当前价格信号。
    - 收入质量、毛利率、烧钱速度和客户集中度仍不透明，无法严谨承销下行情景和现金跑道。
    - Sanofi 同时是 Owkin 的锚定投资人、旗舰客户和声誉背书方，集中度风险过高。
    - 2025 年裁员和员工对管理执行的批评，让人担心高风险战略转型期的运营纪律。
  unresolvedGaps:
    - 当前经审计财务报表、烧钱速度和 24 个月现金流预测未公开。
    - 合同层面的经常性收入、续约条款和按收入计算的客户集中度未披露。
    - 自 2021/2022 年 Series B 轮以来，没有确认的新钱估值发布。
    - 董事会构成、继任规划和治理控制披露仍很薄。
