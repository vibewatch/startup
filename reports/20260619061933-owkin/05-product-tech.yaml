callouts:
  - calloutType: strength
    title: "Federated Data Moat Plus Published Biology Models"
    body: >-
      Owkin's most defensible asset is the combination of a federated hospital network that produces the
      proprietary MOSAIC multimodal dataset without centralizing patient data, and a published technical
      record — Nature Medicine (federated learning in triple-negative breast cancer), Nature Cancer
      (ENLIGHT–DeepPT), open-source Substra/FLamby, and public Phikon foundation models. This pairing of
      hard-to-replicate data access with peer-reviewed, reproducible science is materially harder for a
      generic-LLM competitor to copy than the agent UX alone.
    claimRefs:
      - CE008
      - CE012
      - CE017

  - calloutType: risk
    title: "K Pro Is a Research Tool, and the Cleared Products Left"
    body: >-
      K Pro carries no disclosed FDA clearance or CE mark and is positioned as research/decision support,
      while the only CE-marked diagnostics (MSIntuit CRC, RlapsRisk BC) were spun out to Waiv in March
      2026. The platform's headline productivity gains (e.g. 70% faster target identification) are
      single-instance, company-reported figures with no independent audit, and no public SOC 2 / ISO 27001
      attestation backs the enterprise data-handling story. Buyers underwriting clinical or regulated use
      must treat current claims as unverified.
    claimRefs:
      - CE022
      - CE030
      - CE031
      - CE036

  - calloutType: recommendation
    title: "Diligence: Audit Performance, Security, and Data Rights"
    body: >-
      Before underwriting Owkin's technology, require: (1) independent benchmarking of K Pro/OwkinZero
      accuracy beyond the published static benchmarks; (2) security and model-governance evidence (SOC 2 /
      ISO 27001, model-risk-management, audit logs in the enterprise product); and (3) the durability and
      exclusivity terms of the hospital data-sharing agreements that produce MOSAIC, since the federated
      data moat is the core differentiator.
    claimRefs:
      - CE031
      - CE032
      - CE036

