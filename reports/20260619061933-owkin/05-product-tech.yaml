  - id: trust-safety-compliance
    title: "Trust, Safety, Privacy, and Compliance"
    body: >-
      Owkin's trust posture is built primarily around privacy-preserving federated learning: because
      raw patient data stays on hospital servers and only model parameters move between sites, the
      design is intended to respect data ownership, patient privacy and confidentiality across the
      multi-institution network, which is material for GDPR compliance in its European hospital base.
      The open-source Substra framework reinforces this with an auditable, read-only log of all
      machine-learning operations and Kubernetes packaging described as "regularly audited", giving a
      traceability story that pure-centralized competitors lack. On the regulated-device side, the
      CE-marked diagnostics MSIntuit CRC (colorectal cancer) and RlapsRisk BC (breast cancer relapse)
      represented Owkin's clearest formal regulatory approvals, but both moved to the Waiv spin-out in
      March 2026, so Owkin's own portfolio no longer ships a CE-marked IVD. K Pro itself is positioned
      as a research and decision-support co-pilot — it carries no disclosed FDA clearance or CE mark as
      a medical device, which is the appropriate posture for a research tool but also a ceiling on how
      far its outputs can drive regulated clinical decisions without further validation. Owkin
      emphasizes that K Pro is "secure, interpretable and interoperable" and that insights are
      validated against real patients, but the public surface does not disclose a SOC 2 / ISO 27001
      certification, a model-risk-management framework, or independent audit results, leaving security
      and model-governance controls as open diligence items.
    claimRefs:
