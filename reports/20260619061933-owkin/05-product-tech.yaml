  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: performance-claims
      missingEvidence: >-
        Independent benchmarking or third-party audit of K Pro / OwkinZero accuracy and the headline
        productivity gains (e.g. 70% faster target identification) beyond the published static benchmarks.
      whyItMatters: >-
        The platform's value proposition rests on accuracy and time-savings claims that are currently
        company-reported single instances; without independent verification the ROI cannot be underwritten.
      diligencePath: >-
        Request access to internal validation studies, customer case studies with measured outcomes, and
        commission an independent benchmark on a held-out biological task suite.
      relatedQuestionRefs:
        - QE025
      relatedTableRefs:
        - TE003
    - type: missing-source
      severity: material
      topic: security
      missingEvidence: >-
        Public or contractual evidence of SOC 2 / ISO 27001 certification and a model-risk-management
        framework for the enterprise K Pro platform.
      whyItMatters: >-
        K Pro ingests pharma clients' proprietary datasets; enterprise procurement and regulated buyers
        require attested security and model-governance controls before deployment.
      diligencePath: >-
        Request the security attestation reports, data-processing agreements, and model-governance
        documentation under NDA from Owkin.
      relatedQuestionRefs:
        - QE026
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: material
      topic: data-rights
      missingEvidence: >-
        Durability, renewal, and exclusivity terms of the hospital data-sharing agreements that produce
        the MOSAIC dataset and underpin the federated data moat.
      whyItMatters: >-
        The federated data network is Owkin's core differentiator; if the agreements are short-term,
        non-exclusive, or terminable, the moat is weaker than it appears.
      diligencePath: >-
        Request the master data-sharing agreement templates, the list of participating institutions, and
        consent/governance terms; confirm exclusivity and renewal provisions.
      relatedQuestionRefs:
        - QE027
