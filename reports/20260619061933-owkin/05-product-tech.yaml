  - id: roadmap-limitations-risks
    title: "Roadmap, Maturity, and Product Risks"
    body: >-
      Owkin's stated trajectory is to build toward "Biological Artificial Super Intelligence" (BASI):
      scaling OwkinZero with NVIDIA, expanding K Pro from oncology into adjacent therapeutic areas
      (the Sanofi relationship explicitly extends into immunology drug positioning), and building an
      internal "AI Scientist" to automate discovery of new cures and diagnostics. The forward roadmap
      is anchored by multi-year pharma commitments — the five-year Sanofi bespoke-agent program and the
      three-year AstraZeneca license — which provide both revenue visibility and product direction.
      Maturity is uneven across the portfolio: the published science, open-source FL infrastructure and
      pathology foundation models are mature and externally validated, whereas the agentic K Pro
      product is early (launched October 2025) and its headline performance claims are company-reported.
      Key product and technical risks include: no FDA clearance or CE mark for K Pro, limiting use in
      regulated clinical decisions; a model-interpretability gap that complicates regulatory submission;
      the Waiv spin-out removing the CE-marked diagnostic line from Owkin's own moat; a developer
      ecosystem (GitHub, Hugging Face) that is real but modest relative to the company's ambitions; and
      replication risk as broader-pipeline rivals (Recursion, Insilico, Isomorphic) pursue adjacent
      agentic-AI strategies. Owkin's 2023 (17% of staff) and 2025 (~15% workforce) reductions during the
      pivot to agentic AI, reported alongside staff criticism of internal management, add execution risk
      to the roadmap.
