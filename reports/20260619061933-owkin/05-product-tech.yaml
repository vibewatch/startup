  - id: deployment-differentiation-dependencies
    title: "Deployment, Integration, and Differentiation"
    body: >-
      K Pro is delivered as a secure enterprise platform: Owkin markets it as "secure, interpretable
      and interoperable", lets biopharma and academic clients securely upload proprietary datasets to
      be reasoned over alongside Owkin's own data, and integrates a "patient validation hub" so model
      outputs can be reality-checked against real-world patient data. Integration and adoption are
      validated through enterprise collaborations with AstraZeneca, Bristol Myers Squibb and Sanofi —
      AstraZeneca signed a three-year K Pro licensing deal in May 2026 and Sanofi a multi-year/
      five-year agreement to build bespoke drug-development agents. Owkin's differentiation rests on
      assets competitors cannot trivially replicate: a federated hospital network that yields the
      proprietary MOSAIC multimodal dataset without centralizing patient data; a biology-specific
      reasoning model (OwkinZero) rather than a generic LLM; peer-reviewed validation in Nature
      Medicine and Nature Cancer; and open-source infrastructure (Substra, FLamby) plus public
      foundation models (Phikon, Phikon-v2) that anchor scientific credibility and a developer
      footprint. Self-reported deployment outcomes from the K Pro launch include accelerating internal
      drug-target identification by 70% (from 12+ months to three months), building an IND-ready asset
      positioning strategy in hours, and producing a specialist review in a day that was later
      published. These outcomes are company-reported and not independently audited, and the platform
      depends critically on third parties: hospital data-sharing agreements, NVIDIA compute, open
      foundation models, and the durability of anchor-pharma contracts.
    claimRefs:
      - CE019
