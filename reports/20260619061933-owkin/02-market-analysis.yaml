  - id: buyer-map
    title: "Buyer, user, and payer map: pharma R&D budgets fund the core, diagnostics labs the adjacency"
    body: |-
      The primary economic buyer is pharmaceutical R&D and business development.
      The clearest proof point is Sanofi's December 2021 investment of USD 180
      million that made Owkin a unicorn, paired with a three-year collaboration
      worth USD 90 million plus research milestones across four cancers. That
      buyer pays from a very large pool: Evaluate data put global pharma R&D near
      USD 288 billion in 2024, EFPIA reports European industry R&D of roughly
      EUR 50 billion in 2023, and a Nature Reviews Drug Discovery analysis pegged
      global biopharma R&D at USD 276 billion in 2021. Owkin has raised over
      USD 255 million in total. The user inside that buyer is the data scientist,
      biologist, or clinical-trial designer who needs access to siloed
      multi-institution data.

      A second channel runs through pathology labs and health systems for
      productized diagnostics. MSIntuit CRC, the only CE-marked AI MSI test from
      H&E slides, targets pathologist shortages and immunotherapy matching, and
      the budget owner shifts from R&D to laboratory and, eventually, payer
      reimbursement. Federated learning's end-user base is concentrated in
      healthcare providers and pharma, about a quarter of that market, with North
      America dominant. Precision-oncology incumbents such as Roche, Guardant,
      Tempus, Caris, and Illumina frame the competitive payer-facing landscape
      Owkin must eventually navigate.
    claimRefs:
      - CM021
