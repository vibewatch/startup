company:
  name: Owkin
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Owkin sits at the intersection of three overlapping markets: AI in drug
    discovery, federated learning infrastructure, and precision-oncology
    diagnostics. Fetched analyst lenses size AI in drug discovery at roughly
    USD 3.25-5.0 billion in 2026 with sharply conflicting CAGRs (12% vs 26%),
    the federated-learning market near USD 1.6 billion, and the broader
    precision-oncology pool at USD 127-146 billion. The economic buyer is
    pharmaceutical R&D, funded from a global biopharma R&D pool of roughly
    USD 276-288 billion, with pathology labs and health systems as a secondary
    diagnostics channel. Privacy regulation, cancer burden, and an active FDA
    AI-device pathway are tailwinds; long validation cycles, EU AI Act
    obligations, Owkin's 2023-2025 layoffs and AI-agent pivot, and the absence
    of any disclosed Owkin-specific revenue or SOM are the main constraints.
sections:
  - id: market-boundary
    title: "Market boundary: Owkin straddles AI drug discovery, federated learning, and precision-oncology diagnostics"
    body: |-
      The fetched record shows Owkin is best understood as the overlap of three
      adjacent markets rather than a single category. Owkin's own pages describe
      an autonomous "AI Scientist" (K Pro) that automates biopharma R&D, trained
      through federated learning in which raw patient data stays on hospital
      servers and only models travel between sites. Wikipedia records a
      French-American company founded in 2016 by Thomas Clozel and Gilles
      Wainrib, with products MSIntuit CRC and RlapsRisk BC and around 350 staff.
      That places Owkin inside AI-in-drug-discovery software-and-services, where
      GMInsights segments the market by component, technology, application,
      therapeutic area, and end user.

      Boundary discipline matters because Owkin should not be sized against the
      entire precision-oncology pool. MarketsandMarkets frames a much broader
      Drug Discovery Technologies market at USD 30.58 billion in 2025, but most
      of that spend is instruments, reagents, and wet-lab process unrelated to
      Owkin's AI layer. The status-quo substitutes Owkin displaces are manual
      pathology review, centralized data pooling, and traditional high-throughput
      screening; these are the baseline to exclude, not revenue Owkin captures.
      The defensible included spend is AI-enabled biomarker discovery, trial
      design, and privacy-preserving model training plus productized diagnostics
      such as MSIntuit.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM028
    tableRefs:
      - TM001
  - id: market-sizing
    title: "Market sizing: multiple lenses, conflicting AI estimates, and no disclosed Owkin SOM"
    body: |-
      No single TAM defines Owkin, so the chapter triangulates several fetched
      lenses. For AI in drug discovery, Mordor Intelligence values the market at
      USD 2.58 billion in 2025, USD 3.25 billion in 2026, and USD 10.29 billion
      by 2031 at a 25.94% CAGR, while Fortune Business Insights puts it at
      USD 4.46 billion in 2025, USD 5.00 billion in 2026, and USD 12.56 billion
      by 2034 at only a 12.20% CAGR. Those two reputable analysts disagree by
      more than two times on the growth rate, so the honest read is a 2026 range
      of roughly USD 3.25-5.0 billion, not a point estimate. MarketsandMarkets
      adds an AI-in-precision-medicine lens of USD 0.78 billion in 2024 growing
      30.7% to 2030.

      The enabling-technology layer, federated learning, is sized by Precedence
      Research at USD 1.59 billion in 2026 on a 30.5% CAGR, with healthcare and
      life sciences about a quarter of that. The demand-side pool, precision
      oncology, is far larger: Mordor at USD 127.68 billion, Precedence at
      USD 146.24 billion, and Fortune at USD 133.06 billion for 2026, clustering
      at USD 127-146 billion. Owkin's serviceable slice is narrower still,
      roughly oncology-focused pharma R&D partnerships plus European MSI
      diagnostics, and its true SOM is not publicly disclosed, so the bottom
      pyramid layer is intentionally left null.
    claimRefs:
      - CM008
