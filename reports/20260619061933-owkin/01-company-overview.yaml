  - id: funding-investors-and-valuation
    title: Funding, Investors, and Valuation
    body: >
      Owkin has raised approximately $304.1 million in total equity since its 2016 seed round, as confirmed by the
      company's own FAQ. The capital stack spans a $2.1 million seed (November 2016), a cumulative Series A of
      approximately $72 million (2018–2020), and a $180 million Series B led by Sanofi in November 2021 that conferred
      unicorn status at a $1 billion post-money valuation. The Series B was extended in June 2022 with an $80 million
      strategic investment from Bristol-Myers Squibb, which also carries up to $100 million in milestone payments —
      effectively valuing the BMS collaboration at up to $180 million total.

      The investor base is a deliberate blend of financial VCs and strategic pharma corporate investors. Financial
      backers include GV (Google Ventures), Bpifrance, Mubadala Investment Company, F-Prime Capital, Cathay
      Innovation, Eight Roads Ventures, NJF Capital, MACSF (the French healthcare practitioners' pension fund), and
      Otium Capital. Strategic corporate investors are Sanofi and Bristol-Myers Squibb, whose participation in the
      Series B rounds signals both capital validation and long-term technology adoption intent.

      The last disclosed post-money valuation of $1 billion dates to November 2021. No subsequent primary-round
      valuation has been publicly stated. Secondary market data from PremierAlts as of 2026 suggests a valuation of
      up to $1.6 billion, but this figure is from a secondary transaction aggregator and is not independently
      verifiable. As of late 2025, Owkin was reportedly seeking a new funding round of $200–$300 million, which would
      imply a meaningful step-up valuation, though no closing has been announced as of the run date.
