chapter:
  number: 1
  title: Company Overview
  summary: >-
    Owkin is a French-American AI biotech founded in 2016 by oncologist Thomas Clozel and machine-learning professor
    Gilles Wainrib, headquartered in Paris with offices in New York. The company has raised approximately $304 million,
    achieved unicorn status at a $1 billion valuation in 2021, and in June 2026 expanded its flagship K Pro agentic AI
    platform into a multi-year enterprise deal with Sanofi — but remains unprofitable and completed a painful 15%
    workforce reduction in 2025 as it pivots from diagnostics to pure agentic AI for biopharma.
sections:
  - id: identity-and-business-model
    title: Identity and Business Model
    body: >
      Owkin is a private French-American AI biotech company founded in Paris in 2016 and incorporated under French law
      (SAS). Its headquarters remain in Paris, France, with a significant US presence in New York. The company
      describes its mission as achieving "Biological Artificial Superintelligence" (BASI) — AI capable of modelling and
      engineering biology beyond human cognition to accelerate drug discovery and therapeutic development.

      The core business model is enterprise SaaS and long-term R&D collaboration agreements with large pharmaceutical
      companies. Owkin generates revenue by embedding its AI platform into pharma R&D workflows at the discovery,
      translational, and clinical stages, charging through multi-year strategic partnerships rather than pure
      transactional licensing. Key customers are large-cap biopharma companies including Sanofi, Bristol-Myers Squibb,
      AstraZeneca, Amgen, Roche, Ipsen, and Johnson & Johnson, as well as leading academic medical centers that
      participate in Owkin's federated data network.

      The company's flagship product as of June 2026 is K Pro, an agentic AI scientist co-pilot for biopharma launched
      in October 2025. K Pro is built on Owkin Zero, a proprietary biological large language model, and integrates
      multimodal patient datasets (including the MOSAIC oncology dataset) to enable researchers to query biology at
      scale. Earlier product lines — principally MSIntuit CRC and RlapsRisk BC, AI-based CE-marked diagnostics for
      colorectal and breast cancer — were spun off in March 2026 into a separate company called Waiv, allowing Owkin to
      focus entirely on agentic AI for drug R&D. Owkin's federated learning infrastructure, deployed across 18 leading
      academic research hospitals, underpins its proprietary data moat and privacy-preserving AI model training.
