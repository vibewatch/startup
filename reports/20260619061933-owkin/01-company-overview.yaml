    title: Pharma-anchored capital and strategic depth
    body: >-
      Owkin's two largest investors — Sanofi ($180M Series B) and BMS ($80M strategic deal) — are also its anchor
      commercial customers. This capital-customer alignment provides revenue predictability and reduces churn risk at
      the enterprise layer, a structure unusual in AI SaaS and materially positive for diligence.
    claimRefs:
