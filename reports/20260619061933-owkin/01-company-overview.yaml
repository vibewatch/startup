      - CO021
      - CO024
      - CO025
      - CO038
  - calloutType: risk
    title: Unprofitability, key-person concentration, and post-restructuring culture risk
    body: >-
      Despite $86M in 2024 revenue, Owkin is still loss-making and seeking a $200–$300M round targeting profitability
      in five to six years. CEO Thomas Clozel concentrates investor relationships, strategy, and public credibility in
      one person. The 2025 layoffs drew internal criticism of managerial execution, creating reputational and culture
      risk at a pivotal commercial moment.
