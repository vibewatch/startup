  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: governance
      missingEvidence: >-
        Owkin's board composition, founder control mechanisms (e.g., dual-class shares, protective provisions), and any
        formal succession plan for CEO Thomas Clozel are not publicly disclosed.
      whyItMatters: >-
        Key-person concentration in the founder-CEO is a material governance risk; without knowing board composition or
        investor protective rights, the risk cannot be fully assessed.
      diligencePath: >-
        Request board composition disclosure, shareholder agreement (pacte d'actionnaires), and any drag/tag provisions
        from Owkin's legal counsel in the data room.
      relatedQuestionRefs:
        - QO024
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: >-
        Owkin does not disclose audited annual reports, gross margin, net revenue retention (NRR), or customer count by
        segment. The divergence between Latka's 2023 ARR estimate ($101M) and Maddyness' 2024 revenue figure ($86M)
        has not been reconciled.
      whyItMatters: >-
        Without gross margin and NRR, unit economics and contract health cannot be evaluated. The ARR–revenue
        discrepancy may reflect different accounting treatments (SaaS vs. partnership milestone recognition).
      diligencePath: >-
        Obtain audited French Comptes Annuels filings (Registre du Commerce), data-room P&L with ARR vs. revenue
        bridge, and NRR by cohort from CFO.
      relatedQuestionRefs:
        - QO023
    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: >-
        The last publicly confirmed primary-round valuation is $1 billion from November 2021. No round since then has
        had a disclosed price per share or post-money valuation. Secondary market data from PremierAlts suggests $1.6B
        but this is unverified.
      whyItMatters: >-
        A 4–5 year-old primary valuation anchor cannot be used as a reliable current fair value; the next round at
        $200–$300M may set a new reference price.
      diligencePath: >-
        Monitor close of next funding round announcement. Request cap table and most recent 409A / Fair Market Value
        analysis from CFO for current implied value.
      relatedQuestionRefs: []
    - type: enumeration-incomplete
      severity: minor
      topic: leadership
      missingEvidence: >-
        Owkin's board of directors is not publicly named; only the executive committee is known from official sources.
        Angel investors (Jean-Paul Clozel, Nicole Junkermann, Brent Hoberman) are mentioned in aggregator sources but
        not their current governance role.
      whyItMatters: >-
        Board composition determines investor control rights, audit practices, and the credibility of leadership
        oversight — all material for governance diligence.
      diligencePath: >-
        Request board roster, committee charters, and minutes of most recent board meetings from the company.
      relatedTableRefs:
        - TO002
      relatedQuestionRefs:
        - QO024
    - type: missing-source
      severity: minor
      topic: technology
      missingEvidence: >-
        Detailed technical documentation explaining how Owkin's federated learning architecture operates — including
        the aggregation protocol, threat model, and cryptographic methods — is not publicly available. The blog post
        provides high-level description only.
      whyItMatters: >-
        Understanding the federated learning architecture is important for assessing differentiation from cloud-based
        AI competitors and evaluating data-privacy compliance claims made to pharma partners.
      diligencePath: >-
        Request Owkin's federated learning technical white paper, architecture documentation, and security audit
        reports from the data room; review academic publications from co-founder Gilles Wainrib.
      relatedQuestionRefs:
        - QO012
    - type: missing-source
      severity: minor
      topic: competitive-positioning
      missingEvidence: >-
        No publicly available head-to-head comparison of Owkin's federated learning and agentic AI approach versus
        AI drug discovery competitors (Recursion Pharmaceuticals, Insilico Medicine, Schrodinger, Exscientia) has
        been found. Market positioning claims are from Owkin's own materials.
      whyItMatters: >-
        Competitive differentiation evidence from independent analysts or third-party benchmarks would allow a more
        rigorous assessment of Owkin's technical and commercial moat.
      diligencePath: >-
        Search for analyst reports from Frost & Sullivan, Evaluate, or investment bank healthcare AI coverage;
        review academic literature benchmarking federated learning vs. centralized approaches in pharma AI contexts.
      relatedQuestionRefs:
        - QO017
    - type: private-evidence-only
      severity: minor
      topic: stakeholder or investor map
      missingEvidence: >-
        Exact equity stake percentages, pro-rata rights, liquidation preferences, and protective provisions for each
        investor in the Stakeholder or investor map are not publicly disclosed. Cap table breakdown is private.
      whyItMatters: >-
        Without knowing individual stake sizes and governance rights, it is impossible to assess which investors
        exert meaningful control or whose consent would be needed for a future transaction.
      diligencePath: >-
        Request cap table (fully diluted basis) and shareholder agreement (pacte d'actionnaires) from the company's
        CFO in the data room; confirm whether any investor holds anti-dilution or blocking rights.
      relatedTableRefs:
        - TO003
      relatedQuestionRefs: []
    - type: private-evidence-only
      severity: minor
      topic: milestone table
      missingEvidence: >-
        Key milestones prior to 2018 (early pilots, academic partnerships, pre-seed activities) are not documented
        in public sources. Grant awards, early hospital data network formation, and pre-Series-A regulatory
        interactions are absent from the Milestone table chronology.
      whyItMatters: >-
        A complete founding-to-present chronology helps establish Owkin's operational track record, technology
        maturity, and whether early milestones match the company's current claims about pioneering federated AI in
        biopharma.
      diligencePath: >-
        Request a board-level chronology from company management, review early academic publications by Gilles
        Wainrib and Thomas Clozel, and cross-reference with Bpifrance or EU Horizon grant databases.
      relatedTableRefs:
        - TO004
      relatedQuestionRefs: []
acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TO001 is a snapshot table with mixed sources (official company data, press disclosures, and third-party estimates).
      Notes are included in the table's notes field covering estimation methodology and null meaning.
  - dimension: paywallRisk
    reason: >-
      Seven of 26 sources (27%) are js-only; all are data aggregators (Tracxn, Latka, PremierAlts, Craft, MedCity)
      or one paywalled trade article. Chapter-level rate is 27%, below the 30% report-level ceiling. Replacing these
      sources with equivalent ok-status alternatives would require re-fetching the same information from databases
      that do not offer static HTML access. The critical content for claims is fully backed by ok-status official
      and news sources.
