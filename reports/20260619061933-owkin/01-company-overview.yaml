  - id: scale-metrics-and-performance
    title: Scale Metrics and Financial Performance
    body: >
      Owkin is private and does not disclose consolidated financials publicly. The most detailed data available comes
      from French regulatory disclosures cited by Maddyness and press reporting. Revenue for fiscal year 2024 was
      approximately $86 million, representing 83% year-over-year growth from 2023 and the first time the company
      crossed the $80 million threshold. Despite this growth, Owkin remained unprofitable, posting a net financial
      loss of $5.6 million in 2024 — a significant improvement from a $31.3 million loss in 2023.

      The company's cash position at end of 2024 was approximately $200 million, providing a meaningful runway without
      an immediate near-term funding crisis. Headcount is estimated at approximately 450–500 employees following the
      late-2025 reduction of approximately 50 staff (roughly 15% of the workforce). The exact customer count is not
      publicly disclosed; known enterprise accounts include Sanofi, BMS, AstraZeneca, Amgen, Roche, Ipsen, and
      Johnson & Johnson, plus 18 academic research hospital partners.

      Third-party data from Latka estimated 2023 ARR at approximately $101 million, which appears high relative to the
      2024 revenue figure of $86 million reported in French sources. This discrepancy has not been reconciled and
      should be treated as a diligence gap. Owkin does not disclose gross margin, net revenue retention, or customer
      count by segment. The company targets profitability within five to six years (as stated in late 2025), which
      implies continued cash consumption against current levels.
    claimRefs:
      - CO027
      - CO028
      - CO029
      - CO030
