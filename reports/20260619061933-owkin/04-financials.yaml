  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: burn-rate
      missingEvidence: >-
        Monthly cash burn rate and current cash-and-equivalents balance for Owkin at the parent-company
        level as of the latest available month-end.
      whyItMatters: >-
        Without burn rate and cash position, it is impossible to calculate runway, assess the urgency
        of the next capital event, or model dilution risk for existing shareholders.
      diligencePath: >-
        Request the last 12-month cash flow statement and balance sheet from Owkin management under NDA;
        cross-check with payroll records and cloud-vendor contract disclosures if available in the data room.
      relatedQuestionRefs:
        - QI008

    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: >-
        Gross margin percentage for the full Owkin business and segmented by revenue stream
        (collaboration fees, K Pro recurring license, milestone payments).
      whyItMatters: >-
        Gross margin determines whether the business can sustain R&D investment at scale, whether the
        K Pro SaaS stream is structurally profitable, and how it benchmarks against AI SaaS and
        biotech-services comps.
      diligencePath: >-
        Request audited income statement for FY2023, FY2024, and FY2025 with COGS line items segmented
        by revenue type; benchmark gross margin against publicly traded AI drug-discovery comps.
      relatedQuestionRefs:
        - QI017
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
      severity: blocking
      topic: cash-position
      missingEvidence: >-
        Owkin's current cash and equivalents balance, credit facilities (if any), and whether
        partnership contract revenues are sufficient to cover current burn without additional equity.
      whyItMatters: >-
        The four-year gap since the last primary equity raise makes cash position the single most
        important near-term financial variable; a cash shortage within 12 months would require
        an emergency round or forced covenant.
      diligencePath: >-
        Request current balance sheet; verify cash balance independently with the CFO and auditors.

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Revenue breakdown by individual customer showing Sanofi, BMS, AstraZeneca, and all other
        clients as a percentage of total revenue for FY2023–FY2025.
      whyItMatters: >-
        Without a customer-level revenue split, the concentration risk from Sanofi and BMS is
        unquantifiable, making it impossible to model the scenario where one anchor partner exits
        or reduces spend.
      diligencePath: >-
        Request a customer-level revenue schedule for the last three fiscal years; confirm minimum
        purchase commitments (if any) in the Sanofi and BMS contracts.

    - type: private-evidence-only
      severity: material
      topic: arr-breakdown
      missingEvidence: >-
        Annual recurring revenue (ARR) from K Pro SaaS licensing by client, contract start/end dates,
        and renewal options, segmented from non-recurring collaboration fees and milestone payments.
      whyItMatters: >-
        Recurring SaaS revenue quality is the highest-value component of Owkin's revenue mix, but its
        size and durability are entirely undisclosed; this gap prevents any meaningful LTV or renewal-
        risk modelling.
      diligencePath: >-
        Request K Pro license schedule with contract terms, annual fees, renewal clauses, and
        auto-renew provisions; map against total recognised revenue to isolate recurring fraction.
      relatedTableRefs:
        - TI003
