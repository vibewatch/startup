callouts:
  - calloutType: risk
    title: "Customer Concentration — Two Partners Anchor Disclosed Value"
    body: >-
      Sanofi and BMS together account for the overwhelming majority of Owkin's publicly disclosed
      partnership value. The Sanofi relationship (now spanning equity, oncology collaboration, immunology
      AI, and a five-year K Pro license) and the BMS cardiovascular deal represent a concentration profile
      where a single partner strategy shift or in-house AI build decision could materially reduce Owkin's
      revenue base. The addition of AstraZeneca as a K Pro customer reduces concentration modestly but does
      not eliminate it. Investors should require a customer-level revenue breakdown before underwriting.
    claimRefs:
      - CI031
      - CI037

  - calloutType: strength
    title: "Multi-Year Deal Visibility — Five-Year Sanofi K Pro License"
    body: >-
      The 2026 expansion of the Sanofi relationship into a five-year K Pro platform license represents
      a meaningful improvement in revenue durability relative to milestone-only collaboration contracts.
      A five-year enterprise SaaS commitment from a top-five global pharma partner provides forward
      revenue visibility that is uncommon for early-commercial AI biotech companies and anchors Owkin's
      2026–2031 revenue base with a named, willing counterparty.
    claimRefs:
      - CI005
      - CI036

  - calloutType: recommendation
    title: "Primary Diligence Requirement — Audited Financials and Cash Position"
    body: >-
      Investment underwriting is not possible from public data alone. The core diligence requirements are:
      (1) three years of audited financial statements (FY2022–FY2024), (2) a current balance sheet with
      cash and equivalents, (3) a 24-month forward cash-flow projection with scenario analysis on
      partnership revenue shortfall, (4) an ARR schedule for K Pro licensing with contract start/end dates
      and renewal terms, and (5) a gross-margin bridge by revenue stream. These items are standard
      requests for a Series B+ private company and should not be waived for investor convenience.
    claimRefs:
      - CI038
      - CI030

