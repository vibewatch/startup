company:
  name: "Owkin"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Owkin's revenue is anchored by large-value pharma collaboration contracts (Sanofi, BMS, AstraZeneca)
    combining upfront equity, recurring K Pro SaaS licensing, and milestone-triggered R&D payments;
    the March 2026 Waiv diagnostics spinout concentrated revenue further on platform licensing, and a
    four-year gap since the last primary equity raise raises capital-adequacy questions that only
    management accounts can resolve.

sections:
  - id: revenue-architecture
    title: "Revenue Architecture and Business Model"
    body: >-
      Owkin operates a hybrid pharma-partnership model built on three interlocking revenue levers:
      (1) upfront equity or collaboration fees received at deal signing, (2) multi-year recurring SaaS
      licenses for the K Pro agentic AI platform, and (3) milestone-triggered payments tied to specific
      drug-discovery research achievements. The foundational Sanofi deal (November 2021) combined a
      $180 million equity investment with a concurrent $90 million, three-year oncology collaboration
      payment schedule — a structure Pharmaphorum confirmed through independent reporting. Bristol-Myers
      Squibb followed in June 2022 with an $80 million Series B equity tranche plus up to $100 million
      in potential milestone payments for cardiovascular-trial AI applications. In 2026, the relationship
      with Sanofi deepened further via a five-year enterprise license for K Pro, while AstraZeneca signed
      a separate three-year K Pro licensing agreement in May 2026, signalling growing platform-wide
      adoption by top-ten pharma. Owkin's hospital network — now spanning 180+ institutions — is a
      federated data-acquisition asset rather than a direct revenue source; its value is in providing the
      privacy-preserving multi-omics data that underpins the AI platform's clinical credibility. In
      March 2026, Owkin spun out its diagnostics division (formerly Owkin Dx) as Waiv, a separately
      capitalized entity that raised $33 million; Owkin retains a minority equity stake in Waiv but the
      diagnostics revenue stream is no longer consolidated in Owkin's P&L.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI011
      - CI025
      - CI026
      - CI027
    tableRefs:
      - TI001
    figureRefs:
      - FI001

  - id: pricing-contract-structure
    title: "Pricing and Contract Structure"
    body: >-
      Owkin does not publish a price list for any product. K Pro licensing is structured as a custom,
      multi-year enterprise agreement negotiated directly with C-suite and VP-R&D counterparts at each
      pharma client. The Sanofi K Pro deal is five years; AstraZeneca's is three years. Contract economics
      blend upfront collaboration fees, annual recurring license payments, and milestone tranches triggered
      by verifiable research milestones such as biomarker validation or clinical trial design acceptance.
      Revenue recognition follows IFRS 15 / ASC 606 principles: upfront fees attributable to distinct
      performance obligations are recognised on delivery, recurring license revenue is recognised ratably
      over the contract term, and milestone payments are recognised at the point when the underlying
      achievement is verified and the right to payment is established. Exact deal economics — annual
      license fees, milestone schedules, milestone payment amounts — are confidential in every disclosed
      partnership. The $90 million Sanofi oncology collaboration (2021–2024) and the $80 million BMS
      upfront plus up to $100 million in potential BMS milestones are the only publicly quantified
      contract terms; the 2026 K Pro licenses carry no disclosed financial figures.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
      - CI012
      - CI013
    tableRefs:
      - TI002
    figureRefs: []

  - id: unit-economics-cost-structure
    title: "Unit Economics and Cost Structure"
    body: >-
      Owkin has disclosed no financial statements and no unit-economics metrics. Revenue is estimated at
      approximately $125 million annually by Growjo and Compworth based on workforce and deal scale — an
      analyst estimate that Owkin has not confirmed or denied. At approximately 470 employees (analyst
      workforce intelligence, December 2025), the implied revenue-per-employee is roughly $217K per year,
      consistent with a pre-profit AI services company operating at the validation-to-scale inflection.
      Gross margin is entirely undisclosed; the federated learning architecture distributes computing
      across hospital nodes rather than centralizing it, which may structurally elevate infrastructure
      costs relative to centralized AI competitors. Cost lines include AI research and model development,
      distributed cloud computing, hospital-network integration and maintenance for 180+ sites,
      regulatory and legal compliance for multi-jurisdiction patient-data frameworks, and enterprise
      sales and business development targeting large pharma. CAC, sales cycle length, net revenue
      retention, and payback period are all unconfirmed. Owkin's drug-discovery partnership model
      creates intrinsic revenue-timing risk: pharma R&D cycles typically span five to ten years from
      target identification to regulatory approval, meaning milestone payments are inherently lumpy and
      difficult to model in isolation.
    claimRefs:
      - CI014
      - CI015
      - CI016
      - CI017
      - CI018
      - CI019
      - CI020
      - CI033
    tableRefs:
      - TI003
    figureRefs:
      - FI002
      - FI003

  - id: capital-adequacy-financing
    title: "Capital Adequacy and Financing"
    body: >-
      Owkin has raised approximately $321 million in total financing since founding in 2016. The funding
      history details — Seed ($2.1M, 2016), multiple Series A rounds (2018–2020, ~$59M combined),
      $180M Series B (Sanofi, November 2021), and $80M Series B extension (BMS, June 2022) — are
      documented in the Company Overview chapter. The critical capital-adequacy question as of mid-2026
      is runway: the last primary equity raise at the Owkin parent level closed in June 2022, making
      the gap approximately four years. Premier Alts estimated an implied secondary-market valuation of
      ~$1.6 billion in 2026, versus the $1 billion post-money from the 2021 Series B, suggesting
      secondary-market optimism but no confirmed new equity. The Waiv diagnostics spinout ($33M, March
      2026) added cash to Waiv's balance sheet, not to Owkin's. Owkin has disclosed no cash position,
      monthly burn rate, or runway figure. Burn can be directionally approximated from headcount: at
      ~470 employees and biotech-AI blended compensation benchmarks, monthly cash cost (salary,
      benefits, infrastructure, overhead) plausibly runs $3–9 million per month. Whether partnership
      revenues fully offset this or Owkin is drawing down cash from the 2022 raise is undisclosed.
      No public debt facility or project-finance obligation has been announced.
    claimRefs:
      - CI021
      - CI022
      - CI023
      - CI024
      - CI028
      - CI029
      - CI036
      - CI039
    tableRefs:
      - TI004
    figureRefs:
      - FI004

  - id: financial-gaps
    title: "Financial Data Gaps and Diligence Requirements"
    body: >-
      As a private company, Owkin is not required to file public financial statements and has not
      voluntarily disclosed any. The resulting gaps are structural and pervasive: gross margin,
      operating margin, EBITDA, burn rate, cash balance, ARR by contract, NRR, CAC, and payback period
      are all absent from the public record. Customer-revenue concentration — the share of total revenue
      attributable to Sanofi vs. BMS vs. AstraZeneca vs. other clients — is unquantified. Sifted
      reported in 2025 that Owkin staff publicly criticized the company's internal management during its
      pivot to agentic AI, flagging job cuts, poor organisational transparency, and strategy shifts as
      poorly communicated — an adverse signal on the execution quality of the pivot that has direct
      financial implications. The reliance on two anchor partners (Sanofi and BMS) for the overwhelming
      majority of historical partnership value is a structural customer-concentration risk that could be
      material if either partner reduced scope or brought AI capability in-house. These gaps make it
      impossible to underwrite a return-to-capital model without management accounts and independently
      verified financial statements.
    claimRefs:
      - CI030
      - CI031
      - CI032
      - CI034
      - CI038
    tableRefs:
      - TI005
    figureRefs: []

  - id: financial-verdict
    title: "Financial Verdict"
    body: >-
      Owkin's financial profile is one of high partnership-revenue potential, high capital intensity,
      and structurally opaque unit economics. The five-year Sanofi K Pro license and the new AstraZeneca
      deal provide multi-year revenue visibility, which is a durable positive signal. However, the
      four-year gap since the last equity raise, the concentration of disclosed deal value in two
      partners, undisclosed burn and margin, the management-culture signals from Sifted's reporting,
      and the loss of the diagnostics revenue stream via the Waiv spinout collectively create a material
      information deficit. The $125 million analyst-estimated revenue, if correct, is solid for a
      company of this stage, but without gross margin data investors cannot model unit-level profitability
      or the R&D capital required for the next platform cycle. Revenue quality is mixed: milestone
      payments are lumpy and non-recurring by nature; recurring SaaS licensing from K Pro represents the
      best forward-quality revenue component but is entirely undisclosed in size. The core diligence
      requirement is access to the last three years of audited financial statements, a current balance
      sheet, and a 24-month cash-flow projection with the sensitivity to partnership revenue shortfall.
    claimRefs:
      - CI035
      - CI036
      - CI037
      - CI040
    tableRefs: []
    figureRefs: []

