  productSummary: >-
    Owkin sells AI infrastructure and applications for biopharma R&D, centered on K Pro, Owkin Zero, federated
    learning workflows, and multimodal pathology/genomics tooling. The former diagnostics portfolio (including
    MSIntuit CRC and RlapsRisk BC) was spun out into Waiv in March 2026.
  customerFocus: Large pharmaceutical companies, translational-research teams, and academic medical centers contributing to federated data networks.
  businessModel: >-
    Multi-year enterprise software and research-collaboration model combining pharma platform licenses, milestone-based
    R&D payments, and strategic co-development agreements.
  stage: growth-stage private unicorn
  fundingStatus: >-
    Approximately $304.1 million raised to date; last disclosed parent-company primary round was the $80 million
    June 2022 Series B extension with Bristol-Myers Squibb following the $180 million Sanofi-led Series B in 2021.
    A new $200-300 million raise was reportedly being sought in late 2025, but no closing had been confirmed by
    June 2026.
