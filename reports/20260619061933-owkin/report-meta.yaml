companyProfile:
  summary: >-
    Owkin is a Paris-headquartered AI biotech founded in 2016 by oncologist Thomas Clozel and machine-learning
    scientist Gilles Wainrib. The company built an early moat in privacy-preserving federated learning across
    academic hospital networks, then expanded into multimodal pathology/genomics models and, by 2025-2026, an
    agentic AI platform called K Pro powered by its Owkin Zero biological reasoning model. Owkin has raised
    approximately $304.1 million, reached a $1 billion valuation in 2021, and deepened strategic ties with Sanofi,
    BMS, and AstraZeneca; however, the business remains financially opaque and its newest commercial traction has not
    yet been validated by a fresh primary round.
  foundedDate: '2016-01-01'
  founders:
    - name: Thomas Clozel
      role: Co-Founder and CEO
      background: Former oncologist and hematologist who leads Owkin's strategy, fundraising, and pharma partnerships.
      claimRefs: [CO006, CO008]
    - name: Gilles Wainrib
