  topStrengths:
    - Deep strategic validation from Sanofi, Bristol-Myers Squibb, and AstraZeneca, with multi-year platform relationships rather than one-off pilots.
    - Federated-learning access to a large hospital network creates a differentiated data moat that is harder to replicate than pure software UX.
    - Product focus sharpened in 2025-2026 around K Pro and Owkin Zero, which may improve recurring software revenue quality versus legacy diagnostics.
  topRisks:
    - The last confirmed primary valuation is still the 2021 $1 billion mark, so investors lack a current price signal for the pivoted business.
    - Revenue quality, gross margin, burn, and customer concentration remain opaque, preventing rigorous underwriting of downside and runway.
    - Sanofi is simultaneously Owkin's anchor investor, flagship customer, and reputational validator, creating outsized concentration risk.
    - The 2025 layoffs and employee criticism of managerial execution raise concern about operating discipline during a high-stakes strategy pivot.
  unresolvedGaps:
    - Current audited financial statements, burn rate, and 24-month cash-flow forecast are not public.
    - Contract-level recurring revenue, renewal terms, and customer concentration by revenue are undisclosed.
    - No confirmed new-money valuation has been published since the 2021/2022 Series B rounds.
    - Board composition, succession planning, and governance controls remain thinly disclosed.
