      - number: '1.2'
        title: Founders and Leadership
        blocks:
          - type: paragraph
            body: >
              Owkin was co-founded by Thomas Clozel, MD, and Gilles Wainrib, PhD, in 2016. Their pairing — a clinical
              oncologist and a machine-learning researcher — reflects the company's founding thesis that biomedical AI
              requires deep integration of clinical knowledge and data science.

              Thomas Clozel, CEO, trained as an oncologist and haematologist and retains his position as of June 2026.
              He is the company's public face and primary strategic authority, presenting a significant key-person
              dependency. Gilles Wainrib, PhD, co-founder and Chief Scientific Officer, is a professor of machine
              learning who continues to lead scientific strategy.

              The broader C-suite as publicly disclosed includes: Pascal Weinberger (Deputy CEO), Graeme Bell (CFO),
              Rodrigo Barnes (CTO), Caroline Hoffmann (Chief Medical Officer), Antonia Trower (Chief Marketing Officer),
              Marie-Alice Tantardini (Chief People Officer), Jean-Frédéric Petit-Nivard (Chief Commercial Officer), Anna
              Huyghues-Despointes (Chief Corporate Development and Operations Strategy), and Anne-Charlotte Paut (Chief
              Legal Officer).

              Key-person risk is concentrated in Thomas Clozel, who drives investor relationships, large pharma
              partnership negotiations, and the strategic direction toward BASI. There is no public indication of a
              succession plan. Gilles Wainrib's dual role as co-founder and academic scientist also creates a moderate
              dependency. The September 2025 layoffs and associated internal criticism of "huge managerial issues"
              suggest organizational execution gaps that bear watching.
