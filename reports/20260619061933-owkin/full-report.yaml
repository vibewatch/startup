            body: >-
              Owkin's commercial surface is organized around "Owkin K", an interoperable agentic infrastructure for
              biopharma, and its flagship product K Pro — described by Owkin as "the AI agent for biology, powered by
              multimodal patient data, for smarter biopharma decision making." K Pro is an enterprise platform queried
              in natural language: a single intelligent orchestrator dynamically selects and combines specialized AI
              skills to answer questions across the drug development pipeline, from target discovery to portfolio
              strategy, returning publication-ready answers grounded in multimodal patient data. A free,
              scientist-facing tier — K Pro FREE (formerly branded K Navigator) — assists biologists with scientific
              writing, literature review, hypothesis testing and data visualization, ensuring results are traceable back
              to trusted sources such as PubMed. Underneath sit the data and infrastructure assets: the MOSAIC spatial
              and multiomics dataset (2,700 cancer samples across 11 tumor types), a patient-data network the K Pro page
              describes as the "world-largest" at 104 hospitals, and Owkin's federated-learning tooling. The CE-marked
              diagnostics MSIntuit CRC and RlapsRisk BC that historically anchored the regulated-product line were spun
              out into Waiv in March 2026, so the current Owkin portfolio is concentrated on the K platform, the
              OwkinZero model, and the underlying data network rather than on shipped in-vitro diagnostic devices. The
              customer workflow runs from a pharma R&D question, to a natural-language K Pro query, to orchestrated
              biological reasoning over patient data, to a prioritized, evidence-linked answer that can change a
              program's trajectory.
