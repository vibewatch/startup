      - number: '8.5'
        title: Exit Readiness, Kill Criteria, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Owkin's exit readiness is moderate at best. Three plausible exit paths exist: (1) IPO — the 2025-2026
              biotech IPO market recovery (Eikon $381M, Insilico HK IPO) suggests an IPO window is open to companies
              with clinical proof and 50%+ revenue visibility; Owkin lacks public financials, audited accounts, and
              clinical-stage pipeline validation independent of partner decisions, meaning an IPO in the next 12 months
              is unlikely without accelerated financial disclosure. (2) Strategic M&A — the PathAI/Roche template ($750M
              upfront on ~$100-250M revenue) is the most plausible near-term exit for Owkin at values consistent with
              its current mark; potential acquirers include Sanofi (already deeply integrated), Roche (established in
              pathology AI via PathAI), and AstraZeneca; the $1B entry price creates a hurdle for anything below the
              prior mark. (3) Secondary transactions — PremierAlts and similar platforms have provided limited liquidity
              at roughly the $1.6B level.

              Kill criteria include: a down round below $800M (signals fundamental valuation reset), failure to close
              the pending $200-300M round within 24 months (capital adequacy concern), departure of Thomas Clozel
              without a credible succession plan (key-person risk), or a material reduction in Sanofi or BMS partnership
              scope. The minority Waiv equity stake provides a small optionality buffer on the diagnostics side but is
              not material to the Owkin parent valuation thesis.
