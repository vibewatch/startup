        title: Technical Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Owkin's stack layers a biological foundation model over a federated data substrate. At the model layer
              sits OwkinZero, a domain-specialized biological large reasoning model trained on more than 300,000
              verified question-and-answer pairs spanning eight biomedical tasks (including target druggability,
              modality suitability and drug-perturbation effects), drawing on proprietary patient data and spatial and
              bulk transcriptomics. Per the accompanying arXiv paper, OwkinZero models were produced by post-training
              open-source 8B–32B LLMs with Reinforcement Learning from Verifiable Rewards, and the specialized models
              outperform larger commercial LLMs on the biological benchmarks while showing cross-task generalization. A
              January 2026 collaboration with NVIDIA uses the Nemotron open-model family and the NVIDIA NeMo RL
              framework to scale the next OwkinZero generation that powers Owkin K. The data layer is the MOSAIC
              multimodal oncology dataset and the federated hospital network: rather than centralizing records, Owkin's
              federated learning keeps data on hospital servers while only model updates travel between sites, a design
              Owkin open-sourced as Substra (now hosted by the Linux Foundation for AI & Data, packaged in Kubernetes
              and auditable) and benchmarked via FLamby. Computer-vision foundation models for histopathology — Phikon
              (a 85.8M-parameter ViT-Base trained with iBOT on 40M TCGA tiles) and Phikon-v2 (a ViT-Large trained with
              DINOv2 on the 450M-image PANCAN-XL corpus) — provide the slide-level representations that feed
              biomarker-discovery and treatment-response models such as the ENLIGHT–DeepPT framework. This multimodal,
              federated, model-plus-data architecture is the core operating model rather than a single monolithic
              application.
