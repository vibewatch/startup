      - number: '8.3'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Bull case ($1.8B-$2.5B): A new $200-300M primary round closes at a step-up valuation of $2-2.5B post-money
              in H2 2026 or H1 2027, driven by confirmed K Pro recurring revenue metrics, AstraZeneca deal expansion,
              and inbound M&A interest from large pharma strategic acquirers modeled on the PathAI/Roche template.
              Revenue grows to $130-160M by 2027 on K Pro SaaS scale plus milestone cadence. The federated data moat
              (180+ hospital sites) differentiates against centralized competitors. Gross margin disclosed at 50%+,
              supporting a premium multiple.

              Base case ($1.0B-$1.6B): A new round closes at or near the $1B mark (flat round) in 2026-2027, constrained
              by opaque financials and the four-year fundraising gap. K Pro delivers moderate revenue growth but without
              published NRR or gross margin, multiples compress to the 10-14x range on disclosed revenue. Sanofi and BMS
              anchor revenue but concentration risk limits upside from new customer wins. Cash position sufficient; no
              distressed raise needed.

              Bear case ($600M-$900M): A down round at the $800-900M level in 2027 driven by multiple compression across
              AI biotech, failure to close the Sanofi/AstraZeneca K Pro contracts at scale, or unexpected pharma partner
              budget cuts. Revenue stagnates below $100M as milestone timing slips. Internal execution problems reported
              by Sifted accelerate key-person attrition. The PremierAlts $1.6B secondary estimate becomes unavailable as
              trading dries up on weaker fundamentals.
