            title: Primary Diligence Requirement — Audited Financials and Cash Position
            body: >-
              Investment underwriting is not possible from public data alone. The core diligence requirements are: (1)
              three years of audited financial statements (FY2022–FY2024), (2) a current balance sheet with cash and
              equivalents, (3) a 24-month forward cash-flow projection with scenario analysis on partnership revenue
              shortfall, (4) an ARR schedule for K Pro licensing with contract start/end dates and renewal terms, and
