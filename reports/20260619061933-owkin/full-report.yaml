        - Non-commercial license on released weights; training data is public, not proprietary
      - - Data layer — MOSAIC + hospital network
        - Multimodal oncology data (clinical, pathology, genomics, spatial)
        - Hospital data-sharing agreements; federated nodes
        - Data access depends on renewable institutional partnerships
      - - Federated-learning substrate — Substra / SubstraFL
        - Trains models across sites without moving raw data; auditable log
        - Linux Foundation OSS; Kubernetes; per-site infrastructure
        - Distributed compute is operationally heavier than centralized training
      - - Validation layer — patient validation hub
        - Reality-checks model outputs against real-world patient data
        - Continued clinical data inflow + user feedback
        - Validation methodology and coverage not externally documented
    notes: >-
      Architecture is reconstructed from Owkin's K Pro / OwkinZero pages, the OwkinZero arXiv paper, Substra
