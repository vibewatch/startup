      - number: '3.3'
        title: 'Feature and Capability Comparison: Where Owkin Leads and Where It Lags'
        blocks:
          - type: paragraph
            body: >-
              Owkin's strongest differentiator is its federated learning architecture. Raw patient data never leaves
              member hospital systems; models are trained in situ and only gradient updates are aggregated centrally.
              This enables access to real-world clinical data from European hospitals under GDPR and from academic
              medical centers where centralized competitors such as Insilico, Recursion, and Isomorphic Labs cannot
              readily operate. The MOSAIC spatial multiomics dataset reinforces this: covering multiple cancer types
              with six integrated data modalities—spatial transcriptomics, single-cell RNA-seq, bulk RNA-seq, whole
              exome sequencing, clinical data, and H&E pathology images—it represents the world's largest spatial
              multiomics oncology dataset by company disclosure, and is 100 times larger than any comparable
              alternative. No competitor has publicly disclosed a comparable federated, multi-institutional spatial
              multiomics initiative at equivalent scale.


              Where Owkin lags is pure-chemistry design. K Pro does not currently offer de novo molecule generation
              comparable to Insilico's Chemistry42, Recursion-Exscientia's integrated precision chemistry, or
              Schrödinger's physics-based FEP+ suite. Owkin's proposition is upstream—target identification, patient
              stratification, agentic research assistance—rather than downstream molecule design and ADME prediction.
              This creates a complementary profile with Recursion and Insilico on molecule design, and a more direct
              competitive overlap in target discovery and clinical trial optimization. PathAI (pre-Roche acquisition)
              and Proscia compete on clinical pathology workflow automation, a category Owkin has largely exited via the
              Waiv spinout. Foundation Medicine and Flatiron Health (both Roche) represent the genomic-diagnostics and
              clinical-data incumbents with deep hospital relationships and FDA-cleared product anchors that Owkin's K
              Pro does not yet match in regulatory readiness.
