      - number: '8.2'
        title: 'Comparable Set: Public Trading Comps, M&A Exits, and Sector Multiples'
        blocks:
          - type: paragraph
            body: >-
              Owkin occupies an unusual comparative position: its revenue and model more closely resemble AI-native
              pharma partnerships than traditional SaaS, making pure revenue-multiple analysis insufficient without
              adjusting for revenue quality (milestone-lumpiness vs. recurring SaaS).

              The best public trading comps are Recursion Pharmaceuticals (RXRX) and Insilico Medicine (HKEX: 3696).
              Recursion had a market cap of $1.71B in June 2026 on FY2025 revenue of $74.7M (implied P/S ~22.9x), but
              burned approximately $400M in cash operating expenses while holding $753.9M in cash — a fundamentally
              different capital profile from Owkin, with a public float absorbing the liquidity discount. Insilico
              Medicine completed its December 2025 Hong Kong IPO at ~$2.1B market cap, grew to ~$2.52B by June 2026, and
              reported FY2024 revenue of $85.83M (implied P/S ~29x) — but its revenue is volatile and milestone-driven,
              declining 54% in H1 2025. Both public comps carry substantial clinical pipeline optionality priced in.

              The most relevant M&A comps are PathAI (Roche, $750M upfront / $1.05B total, May 2026) and Paige AI
              (Tempus, $81.25M, August 2025). PathAI had raised $355-660M in total funding and generated estimated
              revenue of $100-250M, implying acquisition multiples of 3-7x revenue. Paige AI's $81.25M exit on $220M+
              raised represents a significant down-exit, a cautionary comp for any digital-pathology-adjacent platform.
              The Finerva Q1 2026 biotech median EV/ Revenue of 4.4x represents the sector floor; AI platforms with
              clinical proof command 6-10x. Owkin's 11.6x implied multiple at $1B and 18.6x at $1.6B secondary are both
              premium to sector median but rely on a forward-looking narrative (K Pro SaaS scale) not yet supported by
              disclosed revenue quality metrics.
