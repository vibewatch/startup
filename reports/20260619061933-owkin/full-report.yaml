  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture and Business Model
        blocks:
          - type: paragraph
            body: >-
              Owkin operates a hybrid pharma-partnership model built on three interlocking revenue levers: (1) upfront
              equity or collaboration fees received at deal signing, (2) multi-year recurring SaaS licenses for the K
              Pro agentic AI platform, and (3) milestone-triggered payments tied to specific drug-discovery research
              achievements. The foundational Sanofi deal (November 2021) combined a $180 million equity investment with
              a concurrent $90 million, three-year oncology collaboration payment schedule — a structure Pharmaphorum
              confirmed through independent reporting. Bristol-Myers Squibb followed in June 2022 with an $80 million
              Series B equity tranche plus up to $100 million in potential milestone payments for cardiovascular-trial
              AI applications. In 2026, the relationship with Sanofi deepened further via a five-year enterprise license
              for K Pro, while AstraZeneca signed a separate three-year K Pro licensing agreement in May 2026,
              signalling growing platform-wide adoption by top-ten pharma. Owkin's hospital network — now spanning 180+
              institutions — is a federated data-acquisition asset rather than a direct revenue source; its value is in
              providing the privacy-preserving multi-omics data that underpins the AI platform's clinical credibility.
              In March 2026, Owkin spun out its diagnostics division (formerly Owkin Dx) as Waiv, a separately
              capitalized entity that raised $33 million; Owkin retains a minority equity stake in Waiv but the
              diagnostics revenue stream is no longer consolidated in Owkin's P&L.
