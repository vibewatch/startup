            body: >-
              Owkin does not publish a price list for any product. K Pro licensing is structured as a custom, multi-year
              enterprise agreement negotiated directly with C-suite and VP-R&D counterparts at each pharma client. The
              Sanofi K Pro deal is five years; AstraZeneca's is three years. Contract economics blend upfront
              collaboration fees, annual recurring license payments, and milestone tranches triggered by verifiable
              research milestones such as biomarker validation or clinical trial design acceptance. Revenue recognition
              follows IFRS 15 / ASC 606 principles: upfront fees attributable to distinct performance obligations are
              recognised on delivery, recurring license revenue is recognised ratably over the contract term, and
              milestone payments are recognised at the point when the underlying achievement is verified and the right
              to payment is established. Exact deal economics — annual license fees, milestone schedules, milestone
              payment amounts — are confidential in every disclosed partnership. The $90 million Sanofi oncology
              collaboration (2021–2024) and the $80 million BMS upfront plus up to $100 million in potential BMS
              milestones are the only publicly quantified contract terms; the 2026 K Pro licenses carry no disclosed
