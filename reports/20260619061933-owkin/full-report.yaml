            title: Customer Concentration — Two Partners Anchor Disclosed Value
            body: >-
              Sanofi and BMS together account for the overwhelming majority of Owkin's publicly disclosed partnership
              value. The Sanofi relationship (now spanning equity, oncology collaboration, immunology AI, and a
              five-year K Pro license) and the BMS cardiovascular deal represent a concentration profile where a single
              partner strategy shift or in-house AI build decision could materially reduce Owkin's revenue base. The
              addition of AstraZeneca as a K Pro customer reduces concentration modestly but does not eliminate it.
              Investors should require a customer-level revenue breakdown before underwriting.
