      - number: '7.2'
        title: Technical and Operational Risk
        blocks:
          - type: paragraph
            body: >-
              Owkin's core technical risks cluster around three axes: model generalization, agentic AI reliability, and
              distributed-infrastructure resilience.

              Model generalization is the most structurally difficult risk in federated healthcare AI. Training across
              180+ hospital nodes introduces non-IID (non-independently-and-identically distributed) data from diverse
              patient populations, imaging systems, and pathology protocols. The federated-learning market literature
              confirms data heterogeneity as the primary restraint on federated model accuracy, requiring specialized
              aggregation algorithms to control drift. Owkin has published federated-learning methodology papers, but no
              independent external audit of K Pro's or OwkinZero's performance on out-of-distribution hospital data has
              been located. K Pro's claim of 70% acceleration in drug target identification is company-reported and
              appears in a self-published press release; it has not been independently replicated as of June 2026.

              Agentic AI hallucination is a second critical risk. K Pro deploys autonomous agents that reason over
              biological literature and multimodal patient data, synthesize hypotheses, and generate IND-ready asset
              positioning strategies in hours. Incorrect biological inferences presented as high-confidence outputs
              could misdirect pharma R&D programs costing hundreds of millions of dollars. Owkin's stated mitigation —
              human review and a "scientist-first" co-pilot design — reduces but does not eliminate this risk. No
              systematic failure-rate or error-rate disclosure has been made public.

              Infrastructure reliability across 180+ hospital nodes creates distributed failure risk. A significant hub
              loss — through hospital data agreement termination, IT system incompatibility, or legal challenge to data
              use — could reduce training data diversity and model quality. Owkin's patient information page confirms
              HDS-certified cloud storage and pseudonymization, but does not disclose uptime SLAs or redundancy
              architecture. Federated learning is also theoretically vulnerable to model inversion and membership
              inference attacks; while federated architectures reduce raw data exposure, gradient-sharing can leak
              information about training records under adversarial conditions. Owkin's architecture for defending
              against such attacks has not been disclosed.

              Additionally, Owkin's reliance on proprietary Qwen (and other open-weight LLMs) as underlying reasoning
              engines creates dependency on upstream model provider decisions. If Qwen's license terms change or the
              model is deprecated, Owkin must re-fine-tune on a replacement base model, incurring cost and timeline
              risk.
