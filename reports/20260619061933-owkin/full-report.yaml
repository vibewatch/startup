      - number: '2.5'
        title: 'Sizing and adoption diligence gaps: conflicting analyst estimates and an undisclosed Owkin SOM'
        blocks:
          - type: paragraph
            body: |-
              The most important market conclusion is what the public record cannot
              support. Owkin's own revenue, run-rate, partnership economics beyond the
              Sanofi headline, and any serviceable-obtainable-market figure are not
              disclosed in the fetched evidence, so every dollar lens in this chapter is
              a top-down TAM rather than an Owkin-specific SOM. That gap is why the
              sizing pyramid leaves its bottom layer null and why valuation work in later
              chapters must demand management's internal segmentation.

              Two structural contradictions are preserved rather than averaged away.
              First, reputable analysts disagree sharply on AI-in-drug-discovery growth,
              with Mordor's 25.94% CAGR more than double Fortune's 12.20%, which alone
              swings the 2031-2034 market by billions. Second, the diagnostics
              commercialization path depends on reimbursement and payer coverage that no
              fetched source confirms for MSIntuit, leaving the second revenue channel
              unproven. The diligence path is to obtain Owkin's channel-level revenue,
              contracted milestone schedules, regulatory submission timelines, and any
              independent test-volume or reimbursement data, then reconcile those against
              the external TAM lenses captured here. Until then, the market is best
              framed as large and growing but only loosely connected to Owkin's proven
              reach.
            claimRefs:
              - CM011
              - CM016
              - CM020
              - CM041
              - CM042
