  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Valuation Context: Last Known Mark, Secondary Market, and Capital Position'
        blocks:
          - type: paragraph
            body: >-
              Owkin's only publicly confirmed post-money valuation is $1B, established at the November 2021 $180M Series
              B led by Sanofi. The June 2022 $80M Bristol-Myers Squibb strategic investment extended the Series B but
              did not disclose a revised post-money mark. As of June 2026 — a gap of approximately four years — Owkin
              has not announced a new primary equity round, making the $1B the sole anchor valuation. PremierAlts, a
              secondary market aggregator, cites an estimated 2026 valuation of approximately $1.6B, but this is not
              based on a disclosed transaction price and should be treated as a directional signal rather than an
              arm's-length mark.

              Owkin reported FY2024 revenue of approximately $86M — a year-over-year increase of 83% — and a net
              financial loss of $5.6M (significantly improved from $31.3M in FY2023). The company held approximately
              $200M in cash at end-2024, providing an estimated 2-3 year runway on directional burn assumptions ($3-9M
              per month at 470-employee scale). Owkin targeted a $200-300M primary round as of late 2025; no closing had
              been confirmed as of the run date. The March 2026 spinout of Waiv (formerly Owkin Dx), which raised $33M
              separately, removed the diagnostics revenue stream from Owkin's consolidated P&L. The Owkin FAQ confirms
              total raised of $304.1M from all investors. The $200M cash position, combined with multi-year K Pro
              contracts with Sanofi and AstraZeneca, suggests runway is not immediately critical — but the lack of a
              confirmed round leaves valuation anchored to a five-year-old mark, creating fundamental uncertainty about
              where a new round would price relative to that anchor.
