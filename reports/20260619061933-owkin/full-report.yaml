      - number: '4.5'
        title: Financial Data Gaps and Diligence Requirements
        blocks:
          - type: paragraph
            body: >-
              As a private company, Owkin is not required to file public financial statements and has not voluntarily
              disclosed any. The resulting gaps are structural and pervasive: gross margin, operating margin, EBITDA,
              burn rate, cash balance, ARR by contract, NRR, CAC, and payback period are all absent from the public
              record. Customer-revenue concentration — the share of total revenue attributable to Sanofi vs. BMS vs.
              AstraZeneca vs. other clients — is unquantified. Sifted reported in 2025 that Owkin staff publicly
              criticized the company's internal management during its pivot to agentic AI, flagging job cuts, poor
              organisational transparency, and strategy shifts as poorly communicated — an adverse signal on the
              execution quality of the pivot that has direct financial implications. The reliance on two anchor partners
              (Sanofi and BMS) for the overwhelming majority of historical partnership value is a structural
              customer-concentration risk that could be material if either partner reduced scope or brought AI
              capability in-house. These gaps make it impossible to underwrite a return-to-capital model without
              management accounts and independently verified financial statements.
