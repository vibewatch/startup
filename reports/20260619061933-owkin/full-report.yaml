      - number: '2.4'
        title: 'Growth drivers and adoption constraints: privacy tailwinds versus validation, regulatory, and execution risk'
        blocks:
          - type: paragraph
            body: |-
              Several fetched drivers support durable demand. Privacy regulation such as
              GDPR and HIPAA pushes hospitals and pharma toward federated learning, which
              trains models without moving raw data, and Precedence cites this as the
              market's leading driver. The cancer burden is structural: the WHO records
              nearly 10 million cancer deaths in 2022, and colorectal cancer alone caused
              about one million deaths from roughly two million cases in 2020. AI and
              biology models are also maturing, as Nature Biotechnology's coverage of
              large-scale perturbation screens illustrates, and the FDA continues to
              clear AI/ML-enabled medical devices, de-risking the path to commercial
              diagnostics.

              The constraints are equally concrete. Clinical validation is slow: MSIntuit
              required a blind Nature Communications study showing 96% sensitivity before
              clearance, and reimbursement remains unproven. The EU AI Act and the EMA's
              reflection paper impose a risk-based regime in which clinical AI is treated
              as high-risk and CE-marked, even though AI used solely for medicines R&D is
              exempt, creating dual-compliance complexity. Federated learning itself
              carries technical friction from non-IID data heterogeneity and high
              per-site infrastructure cost. Company-specific risk is material too: Owkin
              cut staff in 2023 and pivoted toward an AI-agents model, signaling
              strategy and execution uncertainty that sizing alone cannot resolve.
