      - number: '7.4'
        title: People, Governance, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Key-person concentration in Thomas Clozel is the highest-severity governance risk. Clozel is the company's
              founder, CEO, primary deal-closer with large pharma CDOs and CEOs, investor relations lead, and the public
              face of Owkin's Biological Artificial Superintelligence (BASI) vision. He has held the position since the
              company's founding in 2016. No succession plan or deputy CEO path is publicly documented. The loss of
              Clozel to illness, departure, or competitive recruitment would jeopardize the Sanofi and BMS relationships
              that are anchored in personal trust.

              Gilles Wainrib (CSO) is the second key person, leading scientific strategy from an academic background.
              His dual role — professor and startup CSO — creates a partial-availability risk typical of
              academic-founder companies. No evidence of a designated scientific heir in event of Wainrib's departure
              has been found.

              The September 2025 workforce reduction — approximately 50 employees (15%) — was structured as a rupture
              conventionnelle collective under French law and focused on roles outside the new agentic AI core.
              Maddyness confirmed the cuts and the financial rationale. A source cited by Sifted described "huge
              managerial issues" at Owkin around this period, consistent with the strategic pivot from diagnostics to
              pure agentic AI requiring organizational redesign. The restructuring removed talent in diagnostics
              (transferred to Waiv) and reduced headcount in functions considered non-core to K Pro. Engineering
              retention risk post-restructuring is unverified. Similarly, the Bioptimus spin-off in February 2024 (a
              €35M-funded foundation-model startup) removed a cohort of AI researchers from Owkin's direct workforce.

              Governance opacity is an additional execution risk. Owkin is a private French SAS with no public board
              composition disclosure, no published audit committee or compensation committee procedures, and no
              voluntary ESG or DEI reporting. The absence of an independent board oversight signal makes it difficult to
              verify whether financial controls, data governance policies, and management decisions are subject to
              arms-length review. The retention of Sanofi board representation (as an investor) provides some external
              discipline, but Sanofi's interests as a customer and investor may not be fully aligned with minority
              financial investors.
