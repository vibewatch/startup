      - number: '1.5'
        title: Milestones, Partnerships, and Adverse Events
        blocks:
          - type: paragraph
            body: >
              Owkin's corporate chronology runs from a seed-funded founding in 2016 through unicorn status in 2021, two
              major pharma strategic deals, a significant regulatory milestone in CE-certified AI diagnostics, and an
              accelerating pivot to agentic AI in 2025–2026.

              The most significant recent milestones are: the October 2025 launch of K Pro (the first commercially
              deployed agentic AI co-pilot for biopharma, built on Owkin Zero); the March 2026 spin-off of the
              diagnostics division (Owkin Dx) into Waiv with $33 million in new financing; and the June 2026 expanded
              multi-year K Pro collaboration with Sanofi, signaling a deepening enterprise AI services relationship.

              On the adverse side, September 2025 brought a collective redundancy plan cutting approximately 50
              employees. Sifted reported that departing and current staff cited "huge managerial issues," with CEO
              Thomas Clozel publicly acknowledging that HR execution during the pivot had been imperfect. The
              restructuring was explicitly linked to the strategic refocus on pure AI, with Owkin also planning to
              divest the diagnostic unit that became Waiv. The 2024 net loss of $5.6 million and the ongoing need for a
              new funding round of $200–$300 million reinforce the financial risk profile. No litigation, sanctions, or
              regulatory adverse events were identified for the company itself as of the run date. Waiv separately
              achieved dual CE marking under the EU IVDR regulation in 2026 for AI-based breast and colorectal cancer
              testing, but Waiv is now an independent entity.
