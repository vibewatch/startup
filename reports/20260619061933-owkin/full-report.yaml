chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              Owkin is a private French-American AI biotech company founded in Paris in 2016 and incorporated under
              French law (SAS). Its headquarters remain in Paris, France, with a significant US presence in New York.
              The company describes its mission as achieving "Biological Artificial Superintelligence" (BASI) — AI
              capable of modelling and engineering biology beyond human cognition to accelerate drug discovery and
              therapeutic development.

              The core business model is enterprise SaaS and long-term R&D collaboration agreements with large
              pharmaceutical companies. Owkin generates revenue by embedding its AI platform into pharma R&D workflows
              at the discovery, translational, and clinical stages, charging through multi-year strategic partnerships
              rather than pure transactional licensing. Key customers are large-cap biopharma companies including
              Sanofi, Bristol-Myers Squibb, AstraZeneca, Amgen, Roche, Ipsen, and Johnson & Johnson, as well as leading
              academic medical centers that participate in Owkin's federated data network.

              The company's flagship product as of June 2026 is K Pro, an agentic AI scientist co-pilot for biopharma
              launched in October 2025. K Pro is built on Owkin Zero, a proprietary biological large language model, and
              integrates multimodal patient datasets (including the MOSAIC oncology dataset) to enable researchers to
              query biology at scale. Earlier product lines — principally MSIntuit CRC and RlapsRisk BC, AI-based
              CE-marked diagnostics for colorectal and breast cancer — were spun off in March 2026 into a separate
              company called Waiv, allowing Owkin to focus entirely on agentic AI for drug R&D. Owkin's federated
              learning infrastructure, deployed across 18 leading academic research hospitals, underpins its proprietary
              data moat and privacy-preserving AI model training.
