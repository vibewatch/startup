      - number: '3.5'
        title: Moat Durability, Switching Costs, and Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              Owkin's most durable competitive asset is the combination of its federated learning infrastructure and
              MOSAIC dataset. Replicating this requires a competitor to contract with hundreds of hospitals across
              multiple jurisdictions, build compliant federated computing infrastructure within each institution, curate
              spatial omics data at scale, and wait years for the resulting dataset to reach clinical diversity
              comparable to MOSAIC. Neither Insilico, Recursion, nor Isomorphic Labs has publicly disclosed a comparable
              federated hospital network initiative; all three operate from centralized proprietary datasets. Foundation
              Medicine and Flatiron Health have large hospital networks but focus on genomic sequencing and electronic
              health records respectively, not spatial multiomics combined with federated AI training.


              Switching costs are material. A pharma partner that integrates K Pro into drug development workflows faces
              data re-integration costs, regulatory revalidation of AI-assisted decisions in clinical trial contexts,
              and retraining of scientific and executive teams. This creates an estimated 6–18 month migration friction
              and moderate lock-in. Multi-homing—where pharma companies run multiple AI platforms in parallel—is the
              greater threat to pricing power than direct displacement, since large pharma typically diversifies vendor
              risk across 3–5 AI platform relationships simultaneously.


              The most significant structural risk is sector-level: no AI-designed drug has received regulatory approval
              as of June 2026. BenevolentAI's experience—a 90%-plus share-price collapse, repeated workforce reductions,
              shelved SaaS business, and closed US office— demonstrates that capital markets have limited patience for
              extended timelines without regulatory milestones. Phase II success rates for AI-backed candidates average
              approximately 40%, matching traditional rates and undermining the clinical premium narrative. Recursion
              shelved three programs post-merger. If AI drug discovery enters a sustained credibility gap, pharma
              partnership budgets may shift toward smaller upfront commitments, compressing Owkin's recurring license
              revenue model.
