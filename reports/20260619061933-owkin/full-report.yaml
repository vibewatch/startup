      - number: '4.6'
        title: Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              Owkin's financial profile is one of high partnership-revenue potential, high capital intensity, and
              structurally opaque unit economics. The five-year Sanofi K Pro license and the new AstraZeneca deal
              provide multi-year revenue visibility, which is a durable positive signal. However, the four-year gap
              since the last equity raise, the concentration of disclosed deal value in two partners, undisclosed burn
              and margin, the management-culture signals from Sifted's reporting, and the loss of the diagnostics
              revenue stream via the Waiv spinout collectively create a material information deficit. The $125 million
              analyst-estimated revenue, if correct, is solid for a company of this stage, but without gross margin data
              investors cannot model unit-level profitability or the R&D capital required for the next platform cycle.
              Revenue quality is mixed: milestone payments are lumpy and non-recurring by nature; recurring SaaS
              licensing from K Pro represents the best forward-quality revenue component but is entirely undisclosed in
              size. The core diligence requirement is access to the last three years of audited financial statements, a
              current balance sheet, and a 24-month cash-flow projection with the sensitivity to partnership revenue
              shortfall.
            claimRefs:
              - CI035
              - CI036
              - CI037
              - CI040
