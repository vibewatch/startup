  - id: TV005
    title: Thesis-Break and Kill Criteria
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Down round
        - New primary equity round closes below $800M post-money
        - Confirms market re-rating of Owkin's business model and K Pro traction; erodes existing investor returns
        - Exit or reduce exposure; reassess thesis entirely
      - - Round failure (no close)
        - No primary round closed by Q2 2027 despite stated $200-300M target
        - >-
          Signals either market rejection of valuation or undisclosed business deterioration; cash runway shortens
          toward 2027
        - Demand management accounts and monthly financials; press for bridge or structured debt
      - - Key-person departure
        - Thomas Clozel exits CEO role without announced succession
        - >-
          Primary driver of Sanofi, BMS, and AstraZeneca partnership relationships; BASI narrative owner; valuation
          discount immediate
        - Monitor closely; request succession plan as condition of continued investment
      - - Partner concentration event
        - Sanofi or BMS materially reduces or terminates K Pro collaboration scope
        - >-
          Removes anchor revenue accounting for estimated majority of disclosed deal value; revenue collapses toward K
          Pro license recurring only
        - Review capital adequacy; model revenue without anchor partner to assess survivability
      - - Sector multiple compression
        - BioTech/genomics EV/Revenue median drops below 3x for two consecutive quarters
        - Owkin's new round would price at severe discount to current marks; secondary liquidity dries up
        - Adjust base case down to $700-900M; revisit return model
    notes: >-
      Thresholds are quantitative where possible but all triggers require judgment on context. Sector multiple data
      sourced from Finerva Q1 2026 benchmark. Partner concentration risk is informed by Sifted adverse reporting and
      prior chapter customer analysis. Kill criteria are advisory for investment monitoring; they do not substitute for
      legal/contractual rights.
    claimRefs:
      - CV009
      - CV014
      - CV026
      - CV031
      - CV036
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Audited financials
        - Last 3 years of audited P&L, balance sheet, and cash-flow statements
        - Without audited data, gross margin, NRR, and burn rate are unverifiable; cannot underwrite a return model
        - Owkin management / CFO Graeme Bell; formal data room request
      - - K Pro contract economics
        - >-
          Annual contract value (ACV), contract duration breakdown, renewal options, milestone schedules for Sanofi and
          AstraZeneca K Pro licenses
        - >-
          K Pro is the core valuation driver; without pricing clarity, SaaS recurring vs. one-time revenue mix is
          unknown
        - Owkin CFO; any prospective investor should receive Sanofi/AZ redacted term sheets
      - - Gross margin by product line
        - Gross margin split between K Pro SaaS licensing, milestone payments, and legacy collaboration fees
        - Gross margin determines whether the business has a scalable unit-economics profile; currently undisclosed
        - CFO data room; reference to IFRS 15 revenue recognition schedule in management accounts
      - - New round terms and preference stack
        - >-
          Confirmed new primary round price, preference terms, anti-dilution provisions, participating preferred vs.
          common
        - >-
          Four-year-old cap table has undefined liquidation preference layer; new round could significantly dilute
          existing holders
        - Owkin legal / Chief Legal Officer Anne-Charlotte Paut; cap table from existing investor syndicate
      - - Waiv equity stake valuation
        - >-
          Owkin's ownership percentage in Waiv, Waiv's post-$33M-raise valuation, and expected liquidity path for
          Owkin's stake
        - Provides optionality buffer on Owkin parent valuation; Waiv is an independently capitalized vehicle
        - Waiv CEO Meriem Sefta / Owkin corporate development team
      - - Key-person and succession plan
        - Documented CEO succession plan and binding employment agreements for Thomas Clozel and Gilles Wainrib
        - >-
          Key-person concentration is the single largest non-financial risk; Sifted's adverse reporting on management
          culture amplifies the concern
        - Owkin Board; request governance documentation and key-man insurance
    notes: >-
      Diligence priorities ranked by materiality: financial disclosure (blocking without it), K Pro economics
      (material), gross margin (material), preference stack (material), Waiv stake (minor), succession plan (material).
      All items are standard Series B+ institutional investor requests that Owkin should have available in a data room
      if pursuing the stated $200-300M round.
    claimRefs:
      - CV009
      - CV012
      - CV014
      - CV033
