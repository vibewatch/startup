      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'TRACK: Confirmed Round or Audited Accounts Required to Upgrade'
            body: >-
              Owkin presents a genuinely interesting platform at a critical inflection point — K Pro SaaS enterprise
              contracts are a material qualitative upgrade over prior milestone-only revenue — but the combination of a
              five-year-old valuation mark, absent gross margin data, unconfirmed new round, and adverse management
              execution signals makes a BUY call unsupportable. Track closely: the gating condition to upgrade is either
              (a) a disclosed new primary round at a confirmed valuation with stated terms, or (b) voluntary financial
              disclosure including audited FY2025 accounts and K Pro ACV metrics.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV009
              - CV012
              - CV031
          - type: callout
            title: 'Adverse Signal: Management Culture and Execution Risk'
            body: >-
              Sifted's 2025 reporting on Owkin's internal management criticism — including staff complaints about "huge
              managerial issues," poor organisational transparency, and the abrupt communication of the pivot to agentic
              AI — represents a real but difficult-to-quantify execution risk. In a company whose valuation depends on
              delivering multi-year enterprise software contracts on time and to spec, cultural dysfunction is not
              merely a morale issue: it is a delivery risk that flows directly into revenue and retention. The 2025
              layoffs and the diagnostic spinout are evidence of strategic refocusing but also signal that the prior
              model was not scaling as planned. This adverse signal does not alone warrant an avoid, but it elevates the
              evidence bar required before upgrading the recommendation.
            calloutType: risk
            claimRefs:
              - CV031
              - CV032
          - type: callout
            title: Sector Multiple Compression Creates Headwind for New Round Pricing
            body: >-
              Biotech/genomics EV/Revenue multiples fell from a peak of 15.19x (Q4 2020) to 4.4x (Q1 2026) — a 71%
              compression over five years. Owkin's last primary valuation was set at the sector peak in November 2021 at
              a significant premium. Even if Owkin's business has genuinely improved, the macro multiple environment is
              roughly 3x less generous than when the $1B mark was set. A flat round at $1B in 2026 would represent a
              real-terms increase in implied multiple relative to the sector — a favorable outcome for the company, but
              one that requires narrative support from disclosed K Pro economics to sustain with institutional investors
              who have seen sector-wide re-ratings since 2022.
            calloutType: insight
