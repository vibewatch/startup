  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Drug Discovery AI, Pathology Incumbents, and Status-Quo Substitutes'
        blocks:
          - type: paragraph
            body: >-
              Owkin operates at the intersection of three adjacent competitive arenas as of mid-2026. The first is
              AI-native drug discovery platforms, where Insilico Medicine, the merged Recursion-Exscientia entity,
              Isomorphic Labs (a DeepMind spinout), BenevolentAI, and Schrödinger each aim to compress the
              pharmaceutical R&D cycle through generative AI, phenomics, physics-based simulation, or knowledge-graph
              approaches. The second is digital pathology AI, where Owkin's former diagnostic capabilities (now housed
              in the spun-out Waiv entity) competed with PathAI, being acquired by Roche for $750 million upfront, and
              Paige AI, acquired by Tempus for $81.2 million in August 2025. The third is clinical data infrastructure
              and federated analytics, where Owkin's hospital network competes against Tempus's centralized clinical
              data platform, Flatiron Health (a Roche subsidiary), and Foundation Medicine's genomic companion
              diagnostic network.


              Beyond these named rivals, the most common substitute is pharma internal build: Pfizer, Roche, Novartis,
              AstraZeneca, and Sanofi each invest hundreds of millions of dollars annually in internal AI R&D
              infrastructure and also maintain existing relationships with computational chemistry platform vendors such
              as Schrödinger. Multi-homing is structurally easy for large pharma: companies run parallel vendor
              evaluations and often license multiple AI platforms simultaneously, limiting any single vendor's pricing
              power. The structural signal to watch in 2026 is consolidation—PathAI into Roche and Paige into Tempus
              both follow the pattern of incumbents acquiring specialist AI teams rather than building them, compressing
              the independent window for standalone pathology AI vendors. The AI drug discovery market was valued at
              approximately $1.94 billion in 2025 and is projected to reach $2.6–2.8 billion in 2026, with over 173
              AI-designed drug programs currently in clinical trials globally.
