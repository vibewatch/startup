      - number: '3.2'
        title: 'Competitor Profiles: Scale, Pipeline, and Strategic Direction'
        blocks:
          - type: paragraph
            body: >-
              Insilico Medicine holds the most significant clinical proof point in the sector as of mid-2026. Its
              rentosertib drug candidate—designed entirely by AI for idiopathic pulmonary fibrosis—posted positive Phase
              IIa results published in Nature Medicine in June 2025, with a 98.4 mL forced vital capacity improvement
              against a 20.3 mL decline in the placebo group over twelve weeks. The company completed a $110 million
              Series E in 2025, listed on the Hong Kong exchange in December 2025, reported $56.2 million in revenue and
              $393 million in cash for FY2025, and signed a $2.75 billion R&D partnership with Eli Lilly in March 2026
              including $115 million upfront. Its Pharma.AI platform covers Biology42 (target discovery), Chemistry42
              (generative chemistry), and Medicine42 (clinical design) modules. Insilico competes with Owkin for pharma
              partnership budgets in target identification, where Owkin's multimodal patient-data and federated access
              contrast with Insilico's generative-AI-first, centralized-data model.


              The merged Recursion-Exscientia entity (RXRX) represents the sector's largest AI drug development
              operating system, integrating Recursion's phenomics-driven high-throughput biology with Exscientia's
              precision molecular design. The $688 million all-stock merger closed in early 2025. BioHive-2, a
              supercomputer built with NVIDIA, supports training across 60-plus petabytes of data spanning phenomics,
              transcriptomics, proteomics, and ADME. The combined entity reported $754–850 million in cash in 2026 with
              runway to early 2028 and holds over $20 billion in potential milestone payments from Roche/Genentech,
              Sanofi, and Bayer. Recursion competes with Owkin primarily for pharma R&D budgets in biology and
              chemistry, not in pathology AI.


              Isomorphic Labs raised $2.1 billion in a Series B in May 2026 led by Thrive Capital, with participation
              from Alphabet, GV, MGX, Temasek, CapitalG, and the UK Sovereign AI Fund, bringing total funding above $2.6
              billion. Its IsoDDE platform, derived from AlphaFold-based AI, advances drug design across oncology,
              immunology, and cardiovascular disease. Partnerships exist with Novartis, Eli Lilly, and Johnson &
              Johnson; first clinical candidates are expected by end of 2026. Isomorphic's funding advantage over Owkin
              is approximately 7-fold on a total-raised basis, creating a structural gap in compute and foundation-model
              training investment.


              BenevolentAI (Amsterdam: BAI) has undergone repeated restructuring since its 2022 listing. A first round
              of 180 layoffs was followed by a further 30% workforce reduction, the closure of its US office, and the
              shelving of its SaaS knowledge tools. Its share price fell over 90% from the 2022 IPO, reducing market cap
              to approximately £85 million. The company retains BEN-8744 (a PDE10 inhibitor for ulcerative colitis) in
              Phase II and a $594 million Merck KGaA partnership. BenevolentAI serves as the chapter's primary adverse
              evidence anchor: AI platform companies face severe burn challenges when discovery timelines exceed the
              patience of capital markets.
