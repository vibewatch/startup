              (Sanofi, November 2021), and $80M Series B extension (BMS, June 2022) — are documented in the Company
              Overview chapter. The critical capital-adequacy question as of mid-2026 is runway: the last primary equity
              raise at the Owkin parent level closed in June 2022, making the gap approximately four years. Premier Alts
              estimated an implied secondary-market valuation of ~$1.6 billion in 2026, versus the $1 billion post-money
