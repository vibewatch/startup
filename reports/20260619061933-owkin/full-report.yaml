            body: >-
              K Pro is delivered as a secure enterprise platform: Owkin markets it as "secure, interpretable and
              interoperable", lets biopharma and academic clients securely upload proprietary datasets to be reasoned
              over alongside Owkin's own data, and integrates a "patient validation hub" so model outputs can be
              reality-checked against real-world patient data. Integration and adoption are validated through enterprise
