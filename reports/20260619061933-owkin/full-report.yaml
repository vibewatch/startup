        - Market cap ~$2.52B (June 2026); IPO Dec 2025 at ~$2.1B
        - ~29x P/S on FY2024 revenue
        - Similar scale ($86M vs $86M); both AI drug discovery; both relied on pharma partnerships at same revenue level
        - >-
          Has clinical-stage drug (rentosertib Phase IIa); volatile milestone revenue; lumpy seasonality; listed vs.
          private discount
      - - PathAI → Roche
        - M&A exit comp
        - Estimated revenue $100-250M; total funding $355-660M
        - $750M upfront + $300M milestones = $1.05B total (May 2026)
        - 3-7x trailing revenue (wide range due to revenue estimate uncertainty)
        - >-
          Digital pathology AI; overlaps Owkin's former Dx segment (now Waiv); regulatory-grade algorithms; strategic
          acquirer (Roche)
        - >-
          Diagnostics revenue model differs from Owkin's drug discovery focus; Waiv spun out; Owkin K Pro positioned
          differently from AISight
      - - Paige AI → Tempus
        - M&A exit comp
        - Raised $220M+; details limited
        - $81.25M acquisition (Aug 2025)
        - Below prior funding cost; deep down-exit
        - >-
          Digital pathology AI pioneer (first FDA-cleared AI in pathology); cautionary floor for diagnostics-AI
          valuations
        - >-
          Very different strategic context (Tempus AI foundation model play); down-exit reflects market dislocation in
          2024-2025 pathology AI, not a generic comp for K Pro
      - - BioTech & Genomics sector median
        - Sector multiple benchmark
        - Median EV/Revenue for 41-company GNOM ETF constituent set
        - Q1 2026 median EV/Revenue 4.4x (down from 15.19x Q4 2020 peak)
        - 4.4x sector floor
        - >-
