            title: Multi-Year Deal Visibility — Five-Year Sanofi K Pro License
            body: >-
              The 2026 expansion of the Sanofi relationship into a five-year K Pro platform license represents a
              meaningful improvement in revenue durability relative to milestone-only collaboration contracts. A
              five-year enterprise SaaS commitment from a top-five global pharma partner provides forward revenue
              visibility that is uncommon for early-commercial AI biotech companies and anchors Owkin's 2026–2031
              revenue base with a named, willing counterparty.
            calloutType: strength
            claimRefs:
