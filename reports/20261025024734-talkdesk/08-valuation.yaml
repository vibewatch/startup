callouts:
  - calloutType: recommendation
    title: Price before quality
    body: "Talkdesk may be a credible enterprise software company, but the public record cannot determine whether an offered security is attractive without its price, rights, dilution, and senior claims."
    claimRefs: [CV002, CV005, CV009]
