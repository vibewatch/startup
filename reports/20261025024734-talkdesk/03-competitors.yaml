    notes: "Cells summarize assigned evidence; a populated cell means the capability is described, not that performance is independently validated. No unsupported scores are implied."
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Vendor or option, Reported price or model, Included or described scope, Qualification, Competitive implication]
    rows:
