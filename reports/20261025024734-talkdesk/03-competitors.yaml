      - [Talkdesk industry editions, "$225-$270 per user per month", "Industry-specific or government editions are described", "Reported range from comparison sources; government pricing may be custom", "Compliance depth may justify premium but requires ROI proof"]
      - [Genesys Cloud CX, "$75-$240 per user per month", "Voice through omnichannel, WEM, and AI-oriented tiers are listed", "Competitor-authored comparison; verify current quote and contract terms", "A direct enterprise substitute with overlapping scope"]
      - ["Realized enterprise deployment", "Not established", "Seats, channels, AI usage, telecom, integrations, and services", "Requires matched vendor quotes and contracts", "List prices do not establish total cost of ownership"]
    notes: "Prices are reported list or package figures from assigned sources, not realized revenue, ARR, margin, or total cost of ownership; currency is USD per user per month where stated."
    claimRefs: [CP002, CP010, CP011, CP014]
