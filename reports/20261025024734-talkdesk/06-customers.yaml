  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: "Current NRR, GRR, logo churn, renewal rates, contract duration, and cohort retention by segment."
      whyItMatters: "Named deployments and reported outcomes do not establish recurring durability or net expansion."
      diligencePath: "Request a monthly customer bridge for the latest eight quarters, with gross and net retention reconciled to contracts and revenue."
      relatedQuestionRefs: [QU002, QU007]
      relatedTableRefs: [TU002]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: "Top-10 and top-20 account revenue share, vertical concentration, geographic concentration, and partner-sourced share."
      whyItMatters: "A broad logo set can coexist with material dependence on a few enterprise accounts or channels."
      diligencePath: "Obtain anonymized customer revenue bands, account concentration, channel attribution, and renewal status under NDA."
      relatedQuestionRefs: [QU010]
      relatedTableRefs: [TU001]
    - type: enumeration-incomplete
      severity: minor
      topic: named-deployment
      missingEvidence: "A complete, current inventory of production customers versus pilots with independently verified outcomes."
      whyItMatters: "The public record is selective and company-led, so it may overrepresent successful deployments."
      diligencePath: "Sample customer cohorts across verticals and independently contact references to verify production scope, duration, and measured outcomes."
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
