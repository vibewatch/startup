        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Tiago Paiva is consistently identified as Talkdesk’s founder and chief executive officer. Cristina Fonseca
              is identified as a former co-founder, while Sydney Carey was appointed as the company’s first chief
              financial officer in 2021 after leading Sumo Logic through an initial public offering. Tracxn reports two
              active board members, Josh Stein and Tiago Paiva, but the available public record does not provide a
              complete governance roster, committee structure, or current executive succession plan. The 2021 financing
              coverage described a 50% women executive team, but that historical diversity statement should not be
              treated as a current workforce measure. Leadership continuity therefore appears visible at the CEO level,
              with broader key-person and governance dependence still requiring direct diligence.
