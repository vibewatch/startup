        title: Financing, scale, and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              Talkdesk raised a $230 million Series D in August 2021 at a reported $10 billion valuation, with
              TechCrunch and Crunchbase News describing the financing as opportunistic and bringing cumulative funding
              to approximately $498 million. Tracxn’s later profile reports $501 million across nine rounds, so the
