chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Talkdesk was founded in 2011 and provides cloud contact-center software and customer-experience automation
              for mid-market and enterprise organizations. The platform spans omnichannel engagement, workforce
              management, interaction analytics, quality management, AI-assisted agents, and industry-specific
              workflows. Current product messaging emphasizes Customer Experience Automation, in which agentic AI, human
              employees, customer data, and enterprise systems are orchestrated across customer-service, sales, and
              support workflows. A 2026 product announcement describes a CXA Operations Center for managing AI agents in
              production, with observability, evaluation, and analytics intended to bring human and AI workforces under
              one operational lens. Public sources place headquarters in either Palo Alto or San Francisco, so the
              location is treated as conflicting rather than silently normalized.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
