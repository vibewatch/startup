  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation moves from demonstrated scale through evidence gaps and price uncertainty to a conditional
      research-more decision.
    data:
      nodes:
        - id: scale-proof
          label: Scale proof
          detail: Historical customer scale and current enterprise deployment support product relevance.
        - id: product-position
          label: Product position
          detail: Company-issued analyst recognition adds commercial credibility but is not independent validation.
        - id: operating-uncertainty
          label: Operating uncertainty
          detail: Public revenue estimates are unaudited and retention, margins, and cash flow are unavailable.
        - id: capital-structure-gap
          label: Capital-structure gap
          detail: Debt terms, preferences, dilution, and current liquidity are undisclosed.
        - id: price-gap
          label: Price gap
          detail: The 2021 valuation is a historical financing mark, not a current executable price.
        - id: recommendation
          label: Research more
          detail: Proceed only after audited operating data and transaction-specific ownership economics are available.
    approximationNotes: This is an ordered decision chain, not a quantitative conversion funnel or probability model.
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV009
      - CV015
      - CV016
