    title: Residual risk heatmap
    type: matrix
    summary: Reliability, AI-control, and private-company disclosure risks combine high impact with incomplete public mitigation evidence.
    data:
      columns:
        - "Residual exposure"
        - "Low impact"
        - "Medium impact"
        - "High impact"
        - "Critical impact"
        - "Extreme impact"
      rows:
        - {label: "Low likelihood", values: ["Monitoring", "Monitoring", "Diligence", "Diligence", "Diligence", "Diligence"]}
        - {label: "Medium likelihood", values: ["Monitoring", "Diligence", "High priority", "High priority", "Escalate", "Escalate"]}
        - {label: "High likelihood", values: ["Diligence", "High priority", "High priority", "Thesis break", "Escalate", "Escalate"]}
        - {label: "Critical likelihood", values: ["Diligence", "High priority", "Thesis break", "Thesis break", "Escalate", "Escalate"]}
    approximationNotes: "Likelihood and impact are qualitative analyst classifications from the cited public signals; the matrix does not imply measured probabilities or benchmark thresholds."
    claimRefs: [CR001, CR003, CR006, CR012, CR014]

callouts:
  - calloutType: risk
    title: Reliability is the immediate operating diligence item
    body: Gartner review evidence and a competitor-authored review both surface peak-time, support, dropped-call, freeze, or dashboard concerns. Request incident rates, SLA exclusions, severity-one history, and customer-level remediation evidence before underwriting low residual operational risk.
    claimRefs: [CR001, CR002, CR004]
  - calloutType: assumption
    title: Certification is a control signal, not a clean bill of health
    body: The reported ISO/IEC 42001 certification is a positive governance signal, but public evidence does not establish model accuracy, data-use boundaries, escalation performance, or regulatory outcomes across customer deployments.
    claimRefs: [CR005, CR006, CR008]
  - calloutType: recommendation
    title: Treat current risk confidence as medium
    body: Preserve a research-more posture until Talkdesk supplies current financial, retention, incident, legal, and AI-control evidence. Do not infer cash runway from funding raised or infer absence of incidents from the assigned public record.
    claimRefs: [CR009, CR010, CR012, CR014]

