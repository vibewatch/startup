callouts:
  - calloutType: insight
    title: Market opportunity is real but not yet company-sized
    body: "Two independent market publishers describe a growing global CCaaS category, but neither source establishes Talkdesk's serviceable scope, market share, or realized pricing. The valuation-relevant question remains penetration and economics within the defined buyer segments."
    claimRefs: [CM005, CM006, CM009]
  - calloutType: risk
    title: Adoption depends on trust and integration
    body: "Cloud migration and AI automation can reduce infrastructure and workflow friction, but security concerns, integration work, compliance requirements, and support quality can delay deployment or limit expansion."
    claimRefs: [CM003, CM012, CM013, CM014]
