company:
  name: Talkdesk
chapter:
  number: 1
  title: Company Overview
  summary: Talkdesk is a private cloud contact-center and customer-experience automation company founded in 2011 by Tiago Paiva and Cristina Fonseca. The evidence shows a scaled enterprise software platform, a $10 billion Series D valuation in 2021, and a continuing shift toward agentic AI, while current audited financials and capital-structure detail remain unavailable.
sections:
  - id: identity-and-platform
    title: Identity, product, and operating footprint
    body: Talkdesk was founded in 2011 and provides cloud contact-center software and customer-experience automation for mid-market and enterprise organizations. The platform spans omnichannel engagement, workforce management, interaction analytics, quality management, AI-assisted agents, and industry-specific workflows. Current product messaging emphasizes Customer Experience Automation, in which agentic AI, human employees, customer data, and enterprise systems are orchestrated across customer-service, sales, and support workflows. A 2026 product announcement describes a CXA Operations Center for managing AI agents in production, with observability, evaluation, and analytics intended to bring human and AI workforces under one operational lens. Public sources place headquarters in either Palo Alto or San Francisco, so the location is treated as conflicting rather than silently normalized.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership, and governance
    body: Tiago Paiva is consistently identified as Talkdesk’s founder and chief executive officer. Cristina Fonseca is identified as a former co-founder, while Sydney Carey was appointed as the company’s first chief financial officer in 2021 after leading Sumo Logic through an initial public offering. Tracxn reports two active board members, Josh Stein and Tiago Paiva, but the available public record does not provide a complete governance roster, committee structure, or current executive succession plan. The 2021 financing coverage described a 50% women executive team, but that historical diversity statement should not be treated as a current workforce measure. Leadership continuity therefore appears visible at the CEO level, with broader key-person and governance dependence still requiring direct diligence.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-scale-and-disclosure
    title: Financing, scale, and disclosure limits
    body: Talkdesk raised a $230 million Series D in August 2021 at a reported $10 billion valuation, with TechCrunch and Crunchbase News describing the financing as opportunistic and bringing cumulative funding to approximately $498 million. Tracxn’s later profile reports $501 million across nine rounds, so the precise lifetime total differs by source and should remain a range rather than a single reconciled number. Historical coverage reported more than 1,800 customers and a planned workforce near 2,000, while later sources report 1,372 employees in March 2026, 1,406 employees in a Tracxn snapshot, or 1,500 employees in Forbes’s September 2025 profile. These differences may reflect dates, definitions, or source methodology; current revenue quality, cash generation, retention, debt, and valuation are not independently disclosed in this pool.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: milestones-and-open-questions
    title: Milestones and unresolved diligence
    body: Talkdesk’s public trajectory runs from its 2011 founding through a 2021 financing and valuation peak, then a restructuring and product repositioning toward agentic AI and Customer Experience Automation. The 2026 record includes a CXA Operations Center launch, a sixth Gartner CCaaS Leader recognition as described by a company-issued release, and a Villeroy & Boch deployment intended to consolidate market-specific service tools. These milestones demonstrate product and commercial activity but do not establish profitability, customer retention, or the durability of the $10 billion mark. The principal overview gaps are current audited financial statements, a verified headcount and customer denominator, complete governance disclosures, current valuation, and independently measured AI reliability and compliance outcomes.
    claimRefs: [CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Enterprise platform with a visible AI transition
    body: Talkdesk combines an established cloud contact-center base with a documented move into agentic AI orchestration and operational controls.
    claimRefs: [CO002, CO003, CO014]
  - calloutType: risk
    title: Historical valuation remains easier to verify than current economics
    body: The 2021 $10 billion valuation and financing are well documented, but the pool does not establish a current mark, audited revenue, cash generation, or debt profile.
    claimRefs: [CO009, CO010, CO013]
