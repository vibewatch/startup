      - [Industry Experience Clouds, "Premium vertical software and workflows", "User/month", "Generally $225; government is custom-priced", "Published list price; configuration-dependent", "Separate recurring license, implementation, and vertical-integration revenue"]
      - [Usage and AI services, "Telephony, messaging, transcription, AI and related consumption", "Usage units", "Additional fees may apply; no public revenue mix", "Public mechanism; amount unavailable", "Provide usage-rate card, attach rate, gross-to-net treatment, and cloud/telecom cost"]
      - [Services and ecosystem, "Professional services, support, integrations and marketplace apps", "Project, account or recurring add-on", "Additional charges may apply", "Public mechanism; amount unavailable", "Reconcile services revenue, partner share, support cost and contribution margin"]
    notes: "List prices and mechanisms come from public pricing pages; null or unavailable revenue-mix fields are not zero and require company data."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization terms
    columns: [Offer, Starting price, Included scope, Exclusions or uncertainty, Financial implication]
    rows:
      - [Digital Essentials, "$85/user/month", "Digital engagement, routing, API access, dashboards", "Voice is not included; usage and add-ons may apply", "Entry price understates an omnichannel deployment"]
      - [Voice Essentials, "$105/user/month", "Voice engagement, routing, speech recognition, reporting", "Digital and advanced workforce features may require higher tier", "Channel mix changes effective ARPU"]
      - [Elite, "$165/user/month", "Omnichannel, workforce management, reporting and performance tools", "Some premium modules and consumption remain configuration-dependent", "Potential expansion tier, but realized discount is unknown"]
      - [Industry Experience Clouds, "$225/user/month generally", "Elite plus vertical integrations and workflows", "Government custom pricing; contract terms need confirmation", "Vertical complexity can raise both price and delivery cost"]
    notes: "Prices are advertised starting/list prices from a third-party 2026 pricing guide, not evidence of booked revenue, margin, or customer-level realized pricing."
    claimRefs: [CI001, CI002, CI003]
  - id: TI003
    title: Unit economics and underwriting status
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, "$420.1M in 2024 (estimate)", "Medium", "Indicates scale but not audited recognized revenue", "Provide audited revenue bridge and recognition policy"]
      - [Lifetime funding, "$508.5M across eight rounds (third-party profile)", "Medium", "Sets historical capital context, not current cash", "Provide cap table, cash balance and preferred terms"]
      - [Gross margin, null, "Unavailable", "Determines whether AI, telephony and support can scale profitably", "Provide GAAP/non-GAAP gross margin by product and cohort"]
      - [Net revenue retention, null, "Unavailable", "Tests expansion, churn and pricing power", "Provide NRR/GRR by segment, cohort and contract vintage"]
      - [CAC payback, null, "Unavailable", "Tests whether growth consumes or creates cash", "Provide fully loaded CAC, bookings, ramp and payback by channel"]
      - [Runway and debt covenants, null, "Unavailable", "Determines financing dependency and downside risk", "Provide cash-flow forecast, debt schedule and covenant headroom"]
    notes: "Unavailable fields are explicit diligence gaps. The revenue and funding figures are third-party reported or estimated and should not be treated as audited or as cash available."
    claimRefs: [CI010, CI011, CI012, CI013]

