callouts:
  - calloutType: strength
    title: "Visible monetization ladder"
    body: "Talkdesk exposes a tiered per-user model with a path from digital or voice entry plans to omnichannel and vertical bundles, which makes the commercial mechanism legible even though realized pricing is not public."
    claimRefs: [CI001, CI002, CI003]
  - calloutType: risk
    title: "Liquidity is not underwritable from funding history"
    body: "Historical funding and valuation do not reveal current cash, burn, debt, runway, or profitability; these remain material diligence blockers for a private-company investment case."
    claimRefs: [CI010, CI011, CI013]
  - calloutType: recommendation
    title: "Request cohort-level economics before underwriting"
    body: "The next diligence step should reconcile ARR and recognized revenue with discounts, usage, retention, implementation cost, gross margin, CAC payback, and a downside runway case."
    claimRefs: [CI004, CI009, CI012, CI013]

