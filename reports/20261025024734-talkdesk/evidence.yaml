evidenceGaps:
  - type: missing-source
    severity: material
    topic: disclosure
    missingEvidence: Current audited income statement, balance sheet, cash-flow statement, and recurring-revenue reconciliation.
    whyItMatters: >-
      A historical valuation cannot be underwritten against current economics without audited profitability and
      cash-generation evidence.
    diligencePath: Request the latest audited financial statements, ARR bridge, gross margin, burn, and liquidity schedule under NDA.
    relatedQuestionRefs:
      - QO008
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated employee count with a consistent definition and geography.
    whyItMatters: Conflicting headcount figures change the interpretation of scale, operating leverage, and restructuring impact.
    diligencePath: Obtain a current payroll-based headcount by function, geography, contractor status, and reporting date.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: Current active customers, retention, concentration, and cohort expansion data.
    whyItMatters: The only explicit customer count is historical and does not show present commercial durability.
    diligencePath: Request customer cohort tables, gross and net retention, top-account concentration, and renewal evidence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current executive roster, board roster, committee structure, and succession plan.
    whyItMatters: Leadership dependence and governance quality cannot be assessed from a partial historical roster.
    diligencePath: Obtain the current board and executive register, governance documents, and key-person coverage plan.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Current preferred-share price, cap table, secondary transactions, and debt or credit agreements.
    whyItMatters: The 2021 $10 billion mark may not represent current equity value or available liquidity.
    diligencePath: Request the latest financing or 409A materials, cap table, secondary history, and debt covenant package.
    relatedQuestionRefs:
      - QO003
      - QO008
  - type: access-blocked
    severity: minor
    topic: AI
    missingEvidence: Independent production accuracy, escalation, safety, and compliance metrics for deployed AI agents.
    whyItMatters: >-
      Product launches and analyst recognition do not independently validate production reliability or regulatory
      controls.
    diligencePath: >-
      Request anonymized production evaluation results, incident logs, human-escalation rates, and compliance
      attestations.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: company-sizing
    missingEvidence: >-
      A current Talkdesk-specific market model separating serviceable segments, geographic coverage, penetration, share,
      win rates, and expansion potential.
    whyItMatters: >-
      Global CCaaS forecasts are not a defensible SAM or SOM and cannot support company-specific valuation without
      penetration and economics.
    diligencePath: >-
      Request management's current market model, bookings by segment, win-loss data, installed-base penetration, and
      expansion assumptions under NDA.
    relatedQuestionRefs:
      - QM004
      - QM009
