  evidenceGaps:
    - type: missing-source
      severity: material
      topic: AI-validation
      missingEvidence: Independent production metrics for AI resolution, escalation accuracy, hallucination rates, rollback behavior, and human handoff quality by workflow.
      whyItMatters: Agentic automation can increase the impact of a routing or decision error, so product availability and analyst recognition do not establish safe production performance.
      diligencePath: Request customer-level evaluation reports, sampled conversation audits, model-change logs, escalation thresholds, and incident postmortems under NDA.
      relatedQuestionRefs: [QE005]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: A public developer signal such as current API documentation depth, package or repository activity, release cadence, or practitioner-community usage.
      whyItMatters: Integration breadth is important to a cloud contact-center platform, but the assigned evidence does not independently show developer adoption or maintenance velocity.
      diligencePath: Obtain Talkdesk API documentation, release notes, SDK or marketplace activity, and technical references from implementation partners or customer engineers.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: A longitudinal service-status, outage, SLA-credit, and support-resolution record for the relevant Talkdesk editions.
      whyItMatters: External reviews identify dropped calls, reporting delays, and support friction, but their frequency and severity cannot be estimated from the assigned texts.
      diligencePath: Request 24-month status history, incident reports, SLA definitions, support-response distributions, and representative customer references.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: compliance
      missingEvidence: Customer-specific evidence of certifications, BAA terms, data residency, retention, access controls, and breach-response responsibilities.
      whyItMatters: HHS rules place obligations on both the customer and a cloud service handling ePHI; a generic product claim cannot establish deployment compliance.
      diligencePath: Review the current trust center, SOC reports, certifications, BAA, subprocessors, data-flow diagrams, and healthcare customer control matrices.
      relatedQuestionRefs: [QE008]
