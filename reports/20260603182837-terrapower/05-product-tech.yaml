  - type: private-evidence-only
    severity: material
    topic: commercial-operating-metrics
    missingEvidence: Plant-level EPC budget, expected O&M profile, outage assumptions, target availability, and any internally modeled delivered-cost ranges for Kemmerer.
    whyItMatters: Without cost and uptime detail, the investment case still relies on milestone progress and partner announcements rather than on commercial performance underwriting.
