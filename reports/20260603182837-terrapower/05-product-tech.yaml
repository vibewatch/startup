  title: Product architecture map
  type: stack
  layout: wide
  summary: Publicly evidenced layers of TerraPower’s product stack from utility use case through fuel chain and innovation pipeline.
  data:
    layers:
    - label: Customer / grid outcome layer
      detail: Coal-site replacement, grid stability, and renewable-heavy peak support for utility buyers.
    - label: Natrium nuclear island
      detail: 345 MWe sodium fast reactor producing constant thermal output inside the nuclear island.
    - label: Energy island and thermal storage
      detail: Molten-salt storage shifts delivered power up to 500 MWe for more than 5.5 hours when needed.
    - label: Supporting site infrastructure
      detail: Sodium Test and Fill Facility plus Kemmerer Training Center prepare handling, commissioning, and workforce readiness.
    - label: Fuel supply chain
      detail: Centrus enrichment, Framatome metallization, and GNF fuel fabrication form the HALEU path.
    - label: Innovation pipeline
      detail: MCFR, IET, and MCRE extend TerraPower toward industrial heat and future molten-salt reactors.
  approximationNotes: The stack maps only layers that are explicitly disclosed in public sources; it does not imply a full internal software or plant-controls architecture.
