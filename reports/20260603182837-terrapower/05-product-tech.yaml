- id: trust-quality-and-open-technical-gaps
  title: Trust, quality, and open technical gaps
  body: The trust case around TerraPower is stronger on regulatory process and quality surfaces than on operating outcomes. The NRC Natrium record shows the company is not hand-waving quality assurance, emergency planning, design interfaces, fuel qualification, or control-architecture questions; those workstreams exist in named submittals. Southern’s IET disclosures and INL’s MCRE work add real hardware and lab proof for the MCFR line. TerraPower’s own hiring signals also point toward a manufacturing-heavy quality regime, with supplier surveillance, NQA-1, Appendix B, and export-control obligations built into current roles. Even so, the public evidence stops before the questions an investor would want answered in a full technical diligence room. No reviewed source discloses final OT cybersecurity architecture, control-system vendors, achieved uptime, settled plant economics, or vendor-quality outcomes at fleet scale. The result is a chapter with unusually strong program-definition clarity
    for an advanced-reactor company, but still material blind spots around commercial performance and digital-control assurance.
