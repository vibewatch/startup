- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / process / component
  - role
  - current evidence
  - dependency
  - main risk
  rows:
  - - Sodium fast reactor core
    - Generates constant thermal output for the Natrium plant
    - NRC and TerraPower both describe a 345 MWe sodium fast reactor
    - Fuel qualification and sodium-system readiness
    - Non-LWR licensing and fuel novelty versus incumbent reactor classes
  - - Energy island / molten-salt storage
    - Stores thermal energy and boosts delivered electric output during peak demand
    - TerraPower fact sheet and Natrium page disclose 500 MWe peak for 5.5+ hours
    - Heat-transfer integration and balance-of-plant execution
    - No public operating proof yet for utility-scale cycling behavior
  - - Heat and steam output layer
    - Extends the plant beyond electricity into thermal services
    - TerraPower PDF cites >500°C heat plus steam capability
    - Industrial offtake design and site-specific integration
    - No named industrial offtaker workflow in current source pack
  - - Fuel enrichment and metallization path
    - Converts HALEU from enriched material into metal feedstock for Natrium fuel
    - Centrus and Framatome disclose separate enrichment and metallization steps
    - Domestic HALEU scaling and DOE support
    - A delay in any one step can block first-core timing
  - - Fuel fabrication layer
    - Turns prepared HALEU into usable Natrium fuel assemblies
    - GNF-A facility plan near Wilmington is specific to Natrium fuel
    - Construction and qualification of dedicated manufacturing line
    - Public status after 2022 announcement is limited
  - - MCFR test stack
    - Uses IET and MCRE to move from materials knowledge to reactor-relevant proof
    - Southern, DOE, and INL disclose IET and MCRE roles clearly
    - Southern, INL, and NRC progression
    - MCFR still lacks Natrium-level licensing maturity
  - - Digital delivery and controls boundary
    - Coordinates design, procurement, construction, and eventual plant control surfaces
    - Bechtel discloses BIM and digital delivery, but public plant-control detail is absent
    - EPC tooling, control vendors, and cybersecurity architecture
    - Digital or OT architecture cannot be cleanly underwritten from current public evidence
  notes: This architecture table distinguishes what public sources actually disclose from what remains hidden behind vendor or regulator detail not available in the source pack.
