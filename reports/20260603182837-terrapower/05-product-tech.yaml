- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow pain
  - TerraPower product / asset
  - disclosed benefit
  - current limitation
  rows:
  - - Retire coal and keep dispatchable capacity
    - Utilities need replacement capacity, local jobs, and grid reliability after coal retirement
    - Natrium plant at Kemmerer plus training and support facilities
    - Coal-site replacement narrative with local workforce infrastructure
    - First-plant economics and operating availability remain undisclosed
  - - Support renewable-heavy grid peaks
    - Renewables create mismatch between steady generation and peak demand
    - Natrium reactor plus molten-salt storage
    - 345 MWe base output can boost to 500 MWe for more than 5.5 hours
    - Claim is vendor-stated rather than operating proof
  - - Provide high-temperature industrial energy
    - Industrial decarbonization often needs heat, not only electricity
    - MCFR program
    - MCFR targets process heat, electricity, and thermal storage for heavy industry
    - MCFR is still in test and experiment stage, not commercial deployment
  - - Secure fuel for advanced-reactor startup
    - Advanced reactors need HALEU enrichment, deconversion, metallization, and fabrication
    - Centrus + Framatome + GNF chain
    - Public evidence covers three distinct supply-chain steps
    - End-to-end commercial readiness is still unproven
  - - Validate chloride-salt reactor behavior
    - Molten-salt designs need data before licensing and scale-up
    - IET plus MCRE
    - Hardware test loop and planned reactor experiment create staged learning path
    - Regulatory maturity for MCFR still trails Natrium substantially
  - - Stand up qualified operations workforce
    - New reactor classes need training and supplier qualification before startup
    - Kemmerer Training Center plus supplier quality program
    - Training center and QA hiring show readiness work outside reactor design
    - No public data on throughput, pass rates, or supplier audit outcomes
  notes: The table is organized around customer or program jobs rather than around scientific subsystems so the public product definition stays tied to delivery workflow.
