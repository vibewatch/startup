  - type: missing-source
    severity: material
    topic: digital-controls-transparency
    missingEvidence: A public or diligence-room architecture package naming control-system vendors, OT cyber boundaries, software stack, and how reactor and storage controls are partitioned.
    whyItMatters: The public product story is strong on reactor hardware but weak on control and cybersecurity details that matter for plant safety, grid integration, and execution risk.
    diligencePath: Request system architecture documents, cyber assurance materials, control-vendor disclosures, and any regulator-facing digital or OT design summaries.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
