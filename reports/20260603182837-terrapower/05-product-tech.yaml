tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - asset / module
  - user or buyer job
  - status / maturity
  - key evidence
  - differentiation
  - diligence gap
  rows:
  - - Natrium reactor + storage plant
    - Utility or regulated power buyer needing firm low-carbon capacity
    - Commercial demonstration under construction
    - 345 MWe reactor with 500 MWe peak output through storage
    - Pairs utility-scale fast reactor output with thermal storage for peak support
    - No plant-level operating proof or settled delivered-cost disclosure
  - - Sodium Test and Fill Facility
    - Site operations and sodium-system readiness
    - Supporting facility in early construction path
    - Bechtel cites foundation, steel, and dedicated site work
    - De-risks sodium handling before reactor operations
    - No public commissioning metrics or completion date certainty
  - - Kemmerer Training Center
    - Operator training and workforce transition
    - Supporting facility under construction
    - Bechtel says KTC broke ground as part of early works
    - Embeds local workforce readiness into product delivery
    - Training curriculum and staffing throughput are undisclosed
  - - Natrium Fuel Facility (GNF-A)
    - Fuel fabrication for Natrium fleet buildout
    - Announced / buildout pathway
    - More-than-$200M facility plan near Wilmington, NC
    - Creates dedicated Natrium fuel-fabrication path instead of generic fuel outsourcing
    - Current public status after announcement is thin
  - - Centrus HALEU enrichment path
    - Commercial enrichment for first core and future fleet
    - Scaling partner dependency
    - 2030 milestone-oriented MOU around NRC-licensed Piketon facility
    - Anchors domestic enrichment rather than foreign supply
    - Volume, timing, and price commitments remain undisclosed
  - - Framatome HALEU metallization line
    - Metal feedstock conversion for advanced-reactor fuel
    - Pilot line under construction
    - Richland pilot line converts uranium oxide into HALEU metal
    - Covers a specialized fuel-prep step many reactor narratives omit
    - Commercial-scale yield and timing are not yet public
  - - MCFR Integrated Effects Test
    - Technology-risk reduction for future industrial-heat reactor line
    - Operating nonnuclear test asset
    - Up-to-1 MW multiloop chloride-salt system now in salt operations
    - Real hardware proof for molten-chloride behavior and control logic
    - Still a test asset, not a sellable commercial plant
  - - MCRE at INL
    - Experimental reactor proving fast-spectrum molten-salt behavior
    - Pre-operational experiment
    - INL says first fast-spectrum, salt-fueled reactor test could operate as soon as 2028
    - Critical bridge between nonnuclear loops and future MCFR licensing
    - No commercial customer, economics, or final licensing path yet
  notes: Rows mix commercial-facing assets with enabling infrastructure because TerraPower’s public product surface is a delivery stack, not a single sellable reactor package.
