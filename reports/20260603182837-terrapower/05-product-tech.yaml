- id: TE004
  title: Trust / quality / compliance table
  columns:
  - control or quality mechanism
  - status
  - scope
  - why it matters
  - public gap
  rows:
  - - NRC Quality Assurance Topical Report
    - Pre-application record exists
    - Program-level QA approach for Natrium
    - Shows the product is being built under documented nuclear QA methods, not only marketing claims
    - Public page lists the workstream but not full implementation detail
  - - EPZ methodology and safety-method topical work
    - Pre-application record exists
    - Emergency planning and accident methodology for Natrium
    - Relevant to siting and safety case differentiation claims
    - Public summary does not replace full adjudicated licensing outcome
  - - Design-interface and I&C architecture submissions
    - Pre-application record exists
    - Manages boundaries between nuclear island, energy island, and instrumentation layers
    - Critical because Natrium’s value proposition depends on coupled reactor-plus-storage operation
    - Named control vendors and cyber segmentation remain undisclosed
  - - Supplier quality surveillance and NQA-1 controls
    - Active hiring signal
    - Procurement and fabrication oversight for first-of-a-kind components
    - Implies TerraPower is treating component quality as a core product risk
    - No public vendor scorecards, defect rates, or audit-closeout metrics
  - - Export-control and controlled-technology screening
    - Active hiring signal
    - Personnel and access controls for sensitive work
    - Shows that product delivery is constrained by regulatory staffing requirements as well as engineering
    - The source pack does not quantify hiring friction or delay from these controls
  - - DOE cost-share oversight
    - Active program governance
    - Capital, milestone, and demonstration governance under ARDP
    - Creates external discipline around schedule and demonstration scope
    - Does not reveal commercial economics after demonstration funding
  - - Safeguards-by-design burden for liquid-fuel MCFR
    - Technical finding
    - Material accountancy and verification complexity for molten-salt fuel systems
    - Raises future compliance work beyond normal plant QA and support
    - Public report is conceptual and not a final licensing package
  notes: Trust here means demonstrable quality, regulatory, and control surfaces; it does not imply that every risk is solved or that public evidence substitutes for a data room.
