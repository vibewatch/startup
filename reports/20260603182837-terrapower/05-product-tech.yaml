- calloutType: risk
  title: HALEU remains the binding technical-commercial bottleneck
  body: The public stack still depends on three separate HALEU steps across Centrus, Framatome, and GNF, so fuel-chain timing can dominate first-plant readiness even if site work advances.
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE033
- calloutType: insight
  title: MCFR is real, but still earlier than the Natrium business
  body: IET and MCRE show that TerraPower has a genuine second technology branch, yet the NRC record and customer evidence still place MCFR in research-pipeline territory rather than near-term commercial product territory.
  claimRefs:
  - CE019
  - CE021
  - CE022
  - CE037
