- id: TI004
  title: Capital adequacy table
  columns:
  - capital item
  - public value / status
  - confidence
  - implication
  - diligence ask
  rows:
  - - Disclosed private equity since 2022
    - At least $1.4B across the 2022 minimum $750M raise and the 2025 $650M raise
    - High
    - Large by startup standards, but still must be mapped against project uses and remaining cash
    - Request cap table by round, proceeds schedule, and current unrestricted cash
  - - Federal cost-share support
    - Up to $2B authorized under ARDP with required matching capital
    - High
    - Powerful funding lever, but not a substitute for non-federal capital or reimbursement timing
    - Request awarded-to-date reimbursements, remaining eligibility, and timing mismatch analysis
  - - Cash on hand
    - Not publicly disclosed for TerraPower
    - Medium
    - Runway cannot be underwritten from public sources
    - Request latest balance sheet, restricted cash schedule, and board-approved liquidity plan
  - - Monthly burn
    - Not publicly disclosed for TerraPower
    - Medium
    - Makes runway and dilution timing unknowable from public evidence
    - Request trailing-12-month cash burn by Natrium, fuel, and adjacent programs
  - - Runway months
    - Not computable from public sources
    - Medium
    - Investors cannot tell whether 2025 financing bridges to first power or only to the next capital event
    - Request management runway model under base, delay, and cost-overrun scenarios
  - - Planned use of funds
    - 2022 raise explicitly supported ARDP matching; 2025 use of proceeds was not publicly itemized
    - High
    - Public disclosures show capital purpose only at a high level
    - Request use-of-proceeds waterfall and ring-fencing by program
  - - Next-round or refinancing trigger
    - Not publicly disclosed; likely linked to construction progression, HALEU readiness, and follow-on deployment conversion
    - Medium
    - The next financing event could arrive before commercial cash flow if fuel or schedule slips persist
    - Request financing milestones, covenant triggers, and minimum liquidity thresholds
  - - Debt / project-finance obligations
    - No reviewed public source disclosed project-finance structure, debt facilities, or take-or-pay commitments beyond HALEU indications
    - Medium
    - Hidden leverage or purchase commitments could materially change risk
    - Request debt agreements, project-finance memoranda, and all long-term fuel obligations
  notes: Capital adequacy can be framed directionally from raises and DOE support, but current liquidity, burn, and obligations remain private; public values should be treated as capital-stack signposts, not a runway model.
