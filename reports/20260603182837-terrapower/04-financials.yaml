company:
  name: TerraPower
chapter:
  number: 4
  title: Financials
  summary: 'TerraPower’s public financial case is a capital stack, not an operating ledger: at least $1.4 billion of disclosed equity since 2022 plus up to $2 billion of ARDP support sit against a roughly $4 billion first-plant framing, fuel-infrastructure buildout, and still-undisclosed cash, burn, and pricing data. The visible monetization path runs through Natrium deployment, fuel and service attachments, and follow-on utility units, but public evidence still supports financing dependence and material underwriting gaps more strongly than it supports revenue quality or margin visibility.'
sections:
- id: SI001
  title: Revenue model and monetization
  body: |-
    TerraPower’s public financial story still starts with what the company is trying to sell, not what it has already recognized as revenue. The reviewed official materials support a project-based monetization model built around Natrium deployment, associated engineering and licensing work, fuel-fabrication and supply-chain enablement, and long-cycle services attached to reactor rollouts. They do not support a disclosed recurring top line, published reactor price sheet, power-purchase tariff, or license-fee schedule. That distinction matters because the visible cash inflows today are fundraising and federal cost share, while the visible customer-side signals are still development-stage indicators such as PacifiCorp studies, IRP inclusion, and international MOUs rather than signed contracts with disclosed economics.

    The most credible forward revenue path is therefore a staged infrastructure commercialization arc: first demonstrate Kemmerer, then convert utility and sovereign-interest signals into follow-on deployments, and only then layer fuel, service, and fleet-style economics on top. Public evidence suggests TerraPower is already building some of the prerequisites for that model—fuel facilities, HALEU partnerships, and utility planning studies—but the company has not published the contract mechanics that would let an investor separate technology fees, construction pass-throughs, fuel margin, or long-term O&M value. Financially, this chapter should be read as an analysis of monetization architecture and financing dependence, not as proof of current operating traction.
