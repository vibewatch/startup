- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on underwriting
  - exact diligence path
  rows:
  - - Recognized revenue, bookings, and backlog value
    - Cannot separate narrative demand from monetized commercial traction
    - Request signed customer contracts, backlog rollforward, and revenue-recognition memo
  - - Current cash balance, restricted cash, and monthly burn
    - Cannot assess runway, dilution timing, or downside financing risk
    - Request latest monthly management accounts and treasury schedule
  - - Project-level budget by owner, contractor, and federal reimbursement bucket
    - Cannot test whether public capital stack actually closes on Kemmerer economics
    - Request detailed project budget with committed versus forecast spend
  - - Realized pricing for reactor delivery, engineering services, and fuel
    - Cannot model gross margin or revenue mix
    - Request price schedules, term sheets, and margin bridge by stream
  - - Fuel procurement obligations and minimum purchase commitments
    - Cannot size balance-sheet exposure from HALEU strategy
    - Request definitive fuel agreements, prepayment schedules, and take-or-pay clauses
  - - Debt, project-finance, and partner-capital structure
    - Cannot know whether non-equity capital already fills part of the gap or adds hidden leverage
    - Request financing term sheets and source-and-use schedule
  - - LCOE, power-price, and customer-payback assumptions
    - Cannot test whether Natrium wins on economics or only on strategic narrative
    - Request internal project model and customer savings analysis
  - - Capital allocation between Natrium and adjacent programs such as MCFR or isotopes
    - Cannot determine how much prior equity is still available for the flagship commercialization path
    - Request board-approved capital allocation plan and program-level budgets
  notes: Each missing metric names the concrete document or model needed to clear the gap; these are not generic asks but the minimum financial diligence package for underwriting TerraPower.
