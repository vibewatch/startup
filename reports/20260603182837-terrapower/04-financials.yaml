- id: SI002
  title: Cost structure and unit-economics proxies
  body: |-
    TerraPower’s public cost picture is dominated by first-of-a-kind reactor economics rather than software-style margins. The clearest hard anchors are that ENR framed Kemmerer as roughly a $4 billion project, TerraPower says the ARDP framework authorizes a 50/50 cost share up to $2 billion, and Natrium’s first-plant budget includes not only reactor design and licensing but fuel development, qualification work, and two supporting facilities. Additional public disclosures widen the spend perimeter further: TerraPower and Global Nuclear Fuel described a Natrium Fuel Facility investment of more than $200 million, while phased construction and workforce materials point to long-duration site and training buildout before commercial operation.

    Because TerraPower does not disclose realized pricing, gross margin, or project-level cost allocation, public comps are the best available proxy for economic difficulty rather than for exact comparability. NuScale’s public filings show meaningful revenue but very large losses, and Oklo’s filing shows substantial liquidity paired with heavy expected operating and investing cash use. Those comps do not tell us TerraPower’s future margin, but they do show that advanced-nuclear developers can attract capital long before they prove durable operating economics. In TerraPower’s case, the underwriting gap is specific: investors still cannot see LCOE assumptions, fuel cost per unit of output, EPC-versus-technology margin split, or how much project cost will ultimately sit with TerraPower rather than utilities, contractors, or federal partners.
