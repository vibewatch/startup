- id: TI002
  title: Pricing / monetization table
  columns:
  - price / contract element
  - list vs realized pricing
  - public evidence
  - current implication
  - source / diligence ask
  rows:
  - - Natrium reactor or project sale price
    - Undisclosed
    - No reviewed TerraPower or partner page publishes a reactor sale price or turnkey project price
    - Cannot model revenue per unit or gross margin from public sources
    - Obtain customer contract schedules, EPC split, and internal pricing deck
  - - Electricity price / PPA economics
    - Undisclosed
    - PacifiCorp and ENEC materials discuss deployment but not power price or offtake tariff
    - Cannot test customer savings, payback, or LCOE realization
    - Request PPA, tolling, or regulated-rate assumptions tied to Natrium output
  - - Technology-license fee or engineering-services fee
    - Undisclosed
    - Public sources frame deployment collaboration but not fee mechanics
    - Possible revenue stream, but unpriced
    - Request fee schedule, milestone billing, and whether work is reimbursable or equity-supported
  - - Fuel supply / HALEU offtake economics
    - Undisclosed and potentially obligation-heavy
    - Public HALEU announcements show strategic agreements and potential take-or-pay style commitments, not unit pricing
    - Fuel can be both a revenue stream and a financing burden
    - Request unit fuel price, floor-volume commitments, and balance-sheet treatment
  - - Federal ARDP support
    - Not customer pricing; support linked to cost-share rules
    - Public materials disclose 50/50 cost-share mechanics and up to $2B authorization
    - Should be treated as financing support, not product pricing
    - Reconcile grant reimbursement timing against project cash needs
  - - AI-driven strategic capital narrative
    - Equity financing signal, not operating pricing
    - Independent funding coverage ties the 2025 raise to AI/data-center power demand rather than published customer economics
    - Supports fundraising appetite but not monetization proof
    - Request customer pipeline tied to data-center demand and contract value by counterparty
  notes: This table separates disclosed financing mechanics and demand signals from missing realized customer pricing; no public list price should be mistaken for monetized unit economics.
