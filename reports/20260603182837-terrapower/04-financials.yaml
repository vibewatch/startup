tables:
- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - mechanism
  - unit
  - current status
  - quality
  - diligence ask
  rows:
  - - Natrium first-plant commercialization
    - Project-based reactor deployment with engineering, licensing, and delivery milestones
    - project / milestone
    - Construction and permitting progress are public; revenue recognition terms are not disclosed
    - 'Medium-low: real pathway, but no disclosed contract economics'
    - Request executed PacifiCorp or EPC-related commercial agreements, revenue-recognition policy, and milestone payment schedule
  - - Follow-on utility units
    - Conversion of PacifiCorp studies and IRP inclusion into future reactor projects
    - reactor unit / project
    - Utility planning evidence exists; no priced backlog disclosed
    - 'Medium-low: demand signal is visible, booked revenue is not'
    - Request IRP-linked offtake status, exclusivity, and any letters of intent or capacity reservations
  - - Fuel supply and fabrication participation
    - Fuel-facility, HALEU offtake, fabrication, and related services attached to Natrium deployments
    - fuel load / long-term supply agreement
    - Fuel-chain partnerships are public; TerraPower margin capture is not
    - 'Low-medium: strategically important, but pricing and allocation unknown'
    - Request fuel-margin assumptions, counterparties, pass-through terms, and minimum purchase obligations
  - - International deployment and licensing
    - Potential monetization through ENEC and other overseas deployment pathways
    - license / study / project
    - MOUs are public; commercial terms are not
    - 'Low: option value only until fees and scope are disclosed'
    - Request term sheets, feasibility-study fees, and who funds localization, licensing, and supply-chain work
  - - Government cost-share and program funding
    - ARDP and related program support that offsets development cost but is not ordinary customer revenue
    - grant / cost-share reimbursement
    - Publicly visible and strategically important
    - 'Low as revenue quality: financing support, not recurring customer demand'
    - Separate grant accounting from customer revenue in diligence materials
  - - Adjacent MCFR and isotope program activity
    - Non-Natrium programs that may attract funding but also consume capital and management bandwidth
    - program funding / development support
    - Technical milestones are public; monetization is not
    - 'Low: supportive to platform narrative, not underwritten revenue'
    - Request program budgets, external funding mix, and whether Natrium investors subsidize adjacent programs
  notes: Rows cover the publicly evidenced monetization paths only; no reviewed source discloses realized reactor pricing, recurring revenue mix, or revenue-recognition treatment.
