- id: TI003
  title: Unit economics table
  columns:
  - metric
  - value / status
  - confidence
  - why it matters
  - diligence ask
  rows:
  - - First-plant capex anchor
    - Roughly $4B Kemmerer project framing
    - Medium
    - Sets the scale of capital that must be recovered across financing and future deployments
    - Obtain current project budget, contingency assumptions, and owner-vs-contractor cost split
  - - Federal support ceiling
    - Up to $2B under ARDP with 50/50 match
    - High
    - Caps how much direct federal support can offset FOAK economics
    - Obtain reimbursement cadence, eligible cost categories, and matched-capital schedule
  - - Supporting-facility burden
    - Fuel development plus Sodium Test and Fill Facility and Natrium Fuel Facility are part of the economic package
    - High
    - Shows that site economics extend beyond the reactor island
    - Request separate budgets for supporting facilities and fuel qualification
  - - Fuel-facility investment proxy
    - More than $200M for Natrium Fuel Facility
    - High
    - Adds evidence that fuel readiness is a non-trivial capital line item
    - Request TerraPower’s direct capital share and expected return profile
  - - Peak construction scale proxy
    - About 1,600 workers during peak construction; about 250 once operating
    - High
    - Labor scale is a useful proxy for construction intensity and fixed operating cost footprint
    - Request labor cost assumptions and O&M staffing model
  - - Public peer revenue proxy
    - NuScale TTM revenue of $31.47M with lower 2025 revenue than 2024
    - Medium
    - Shows that even public advanced-nuclear peers can have modest top lines relative to capital needs
    - Benchmark TerraPower’s near-term revenue expectations against actual peer disclosures
  - - Public peer loss / cash-use proxy
    - NuScale net loss of $664.5M in 2025; Oklo net loss of $105.7M and 2026 total cash-use guidance of $430M-$550M
    - Medium
    - Suggests public peers still consume large capital before steady commercial economics emerge
    - Request TerraPower’s burn bridge to first power and first follow-on order
  - - TerraPower realized gross margin, fuel cost, and LCOE
    - Unavailable publicly
    - Low
    - These are the core variables needed to underwrite revenue quality and margin path
    - Request project model including LCOE, fuel assumptions, and owner economics by phase
  notes: Public unit-economics evidence is mostly indirect; where TerraPower data is absent, the table uses source-backed capital anchors or public-peer proxies and labels the missing variables explicitly.
