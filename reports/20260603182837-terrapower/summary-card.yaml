summary:
  headline: >-
    TerraPower is one of the most credible US advanced-nuclear commercialization stories approaching market entry, but
    public-only evidence still cannot support a clean underwriting call because valuation, economics, and fuel-chain
    details remain opaque.
  overallScore: 7.2
  recommendation: research-more
