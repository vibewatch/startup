  - id: TR004
    title: People / execution risk register
    columns:
      - role / function
      - dependency or gap
      - likelihood
      - severity
      - mitigation
      - diligence path
    rows:
      - - Supplier quality leadership
        - Requires deep Appendix B, NQA-1, audit, welding, and surveillance capability across first-of-a-kind procurements
        - Medium
        - High
        - TerraPower is visibly hiring experienced supplier-quality staff and formalizing surveillance processes
        - Request current team size, open requisitions, supplier-audit cadence, and top unresolved quality findings
      - - Export-control and talent access
        - Foreign-national review can slow or limit hiring for technical roles
        - Medium
        - Medium-high
        - TerraPower discloses case-by-case export-control review and approval workflow
        - Request average approval times, blocked roles, and countries/functions with the longest staffing friction
      - - Program integration and vendor management
        - More than 80 collaborators plus long-lead suppliers raise coordination burden
        - Medium-high
        - High
        - Procurement closeout, early works, and supplier-surveillance framework are visible mitigations
        - Ask for critical-path supplier dashboard, expediting metrics, and red/yellow vendor list
      - - Leadership allocation across Natrium and MCFR
        - Public sources show meaningful activity in both programs but not resource split
        - Medium
        - Medium-high
        - Southern-backed MCFR milestones suggest partner help absorbs some burden
        - Request org structure, executive ownership, and resource-allocation rules between programs
      - - Construction and operations workforce buildout
        - FOAK site ramp requires roughly 1,600 peak workers and later permanent operating staff
        - Medium
        - High
        - Training-center buildout and Wyoming workforce narrative are established
        - Request staffing plan, craft availability, training throughput, simulator readiness, and retention assumptions
    notes: This register emphasizes execution roles that can break schedule or quality even when reactor physics and policy support remain intact. The public mitigation evidence is real, but it is mostly process evidence rather than outcome evidence.
