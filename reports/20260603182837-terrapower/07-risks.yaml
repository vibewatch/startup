    title: Regulatory / legal risk register
    columns:
      - rule / license / case
      - jurisdiction
      - status
      - likelihood
      - severity
      - mitigation
      - residual exposure
      - diligence path
    rows:
      - - NRC Part 50 permit completed; separate operating license still required
        - U.S. Nuclear Regulatory Commission
        - Construction permit issued in March 2026; operating license outstanding
        - Medium
        - Critical
        - Historic permit, FEIS completion, and sustained NRC engagement reduce first-gate risk
        - High — no commercial operations until TerraPower files and wins the operating license
        - Request OL submission plan, issue matrix, hearing strategy, and critical-path assumptions through fuel load
      - - Wyoming industrial siting and water-supply findings
        - Wyoming Industrial Siting Council / State Engineer
        - State siting and water analysis approved for non-nuclear and water-supply path
        - Low-medium
        - High
        - State Engineer final opinion and state permit already in hand
        - Medium — water demand, permit conditions, and non-NRC compliance still need disciplined execution
        - Obtain final permit conditions, monitoring requirements, and any post-approval amendments or compliance notices
      - - Prohibiting Russian Uranium Imports Act and DOE waiver regime
        - U.S. federal law / DOE / Commerce / State
        - In force with limited waiver authority through 2027
        - High
        - Critical
        - Domestic and allied-country HALEU buildout plus waiver process if no viable alternative exists
        - High — legal fallback to Russian supply is intentionally constrained and temporary
        - Confirm whether TerraPower or key suppliers expect any waiver reliance, and on what volume/timing assumptions
      - - FEIS, hearing, and record-of-decision durability
        - NRC / federal environmental review
        - FEIS issued and hearing completed before permit decision
        - Low-medium
        - High
        - Extensive review record already compiled under NUREG-2268 and the permit docket
        - Medium — litigation, remand, or follow-on environmental disputes could still burden schedule
        - Review docket history, any petitions or adjudicatory challenges, and unresolved environmental commitments
      - - Export-control and international deployment constraints
        - U.S. export-control regime / allied deployment context
        - Ongoing compliance obligation
        - Medium
        - Medium-high
        - Dedicated export-control screening and allied-partner positioning
        - Medium — staffing and future international deployment can still slow if approvals lag
        - Request export-control governance, average approval lead times, and any role-specific staffing delays
    notes: Rows are ordered by residual severity. The highest legal/regulatory risk is no longer permit issuance itself but the combination of operating-license completion and HALEU-law constraints on fallback fuel options.
    enumerationScope:
      coverage: partial
      basis: Publicly reviewable federal, Wyoming, and company-disclosed regulatory surfaces that materially affect Kemmerer as of 2026-06-03; private legal advice and nonpublic agency correspondence are not accessible.
