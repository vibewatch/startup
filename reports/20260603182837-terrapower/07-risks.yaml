  - id: SR002
    title: HALEU and first-core fuel-chain execution remain the clearest schedule breaker
    body: |-
      The strongest disconfirming evidence in the entire TerraPower file is that the market already saw the key risk once: fuel availability moved the schedule. Nuclear Engineering International reported in 2023 that TerraPower expected at least a two-year delay because its original first-core plan depended on Russian HALEU, and WyoFile later tied the shift from a 2028 operating target to 2030 to the company's decision to cut ties with TENEX after the invasion of Ukraine. That history matters because it demonstrates that HALEU is not a hypothetical risk factor copied from peer filings; it is a proven schedule governor for Natrium. The company has built a visible mitigation stack around that problem. TerraPower and Centrus expanded their collaboration around domestic enrichment milestones for 2030 operation, Framatome is building a metallization pilot line in Richland, and GNF-A announced a dedicated Natrium fuel facility near Wilmington. DOE's HALEU Availability Program exists to support exactly this type of bottleneck. Yet the same public sources show why the risk still ranks near the top. Each mitigation sits at a different industrial step, under a different counterparty, with different timing and economics. Centrus's own cautionary language says commercialization still depends on funding, contracts, regulatory decisions, and scale-up. Framatome's announcement describes a pilot line, not a fully commercial metal-feedstock plant. GNF-A's 2022 announcement established intent and capex, but public status after that announcement is comparatively thin. The NRC dashboard makes the dependency even sharper by specifying metallic uranium-zirconium HALEU fuel rather than generic LEU. The right reading is that TerraPower has the most explicit domestic-fuel buildout in the cohort, but it still does not have a publicly demonstrated end-to-end commercial chain.
