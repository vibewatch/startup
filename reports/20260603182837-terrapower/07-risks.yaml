  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - risk
      - monitorable trigger
      - threshold / event
      - action implication
    rows:
      - - First-core fuel shortfall
        - Centrus, Framatome, GNF-A, and DOE milestone updates
        - Any material evidence that commercial first-core volumes slip beyond the 2030 plant target
        - Thesis break unless TerraPower shows an equivalent non-Russian supply path with volumes, timing, and regulator acceptance
      - - Operating-license slippage
        - NRC docket filings and TerraPower public guidance
        - No clear operating-license filing path after permit issuance or a visible multi-quarter slip in OL milestones
        - Re-underwrite regulatory timing, capital needs, and customer confidence assumptions
      - - FOAK cost or schedule overrun
        - Project milestone reporting, vendor announcements, and fundraising cadence
        - Schedule moves meaningfully beyond 2030 or cost transparency deteriorates while new capital is still needed
        - Treat as a financing-pressure event; request cost-to-complete and contingency drawdown before further conviction
      - - PacifiCorp concentration failure
        - Utility planning documents, joint-study updates, or adverse utility commentary
        - PacifiCorp steps back from Kemmerer transfer/ownership logic or repeat-unit planning
        - Thesis weakens materially because TerraPower's public customer proof is still concentrated in one utility path
      - - Supplier-quality failure on long-lead components
        - Vendor rework, surveillance findings, or manufacturing slips on critical systems
        - Repeated quality escapes or late component delivery on nuclear or fuel critical path
        - Escalate diligence on QA governance and assume higher cost and timing risk
      - - Capital sufficiency deterioration
        - Fundraise activity, DOE support continuity, and peer-market conditions
        - Need for new capital before key regulatory and fuel milestones are credibly de-risked
        - Move valuation posture toward downside-case capital intensity and dilution risk
    notes: These triggers are designed to be monitorable from public sources because TerraPower remains private and publishes far less financial detail than public peers. A trigger does not automatically invalidate the company; it does force a fresh underwriting pass.
