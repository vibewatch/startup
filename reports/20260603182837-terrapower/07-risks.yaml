company:
  name: TerraPower
chapter:
  number: 7
  title: Risks
summary: >
  TerraPower's highest-severity risks are no longer about whether Natrium is a serious project; they are about whether the company can clear the remaining regulatory path, assemble commercial HALEU on time, and execute a multi-billion-dollar first-of-a-kind build without losing customer, capital, or policy support. The public record is unusually rich on mitigations and milestone progress, but it is also unusually clear that fuel, licensing completion, partner coordination, and single-customer concentration still create multiple thesis-break paths.
sections:
  - id: SR001
    title: Regulatory and legal gating remains a top-tier risk even after the permit win
    body: |-
      TerraPower's risk profile starts with a paradox: the company now has one of the strongest regulatory stories in advanced nuclear, but that does not mean the regulatory risk is gone. DOE's March 2026 summary and the NRC's Kemmerer dashboard both confirm that the NRC granted a construction permit for Kemmerer Power Station Unit 1 after TerraPower's March 2024 application, May 2024 docketing, environmental review, hearing, and March 2026 decision. That progress matters because it makes TerraPower much more real than paper-reactor peers. But the same official sources also make clear that the permit is not an operating license. TerraPower still needs a separate operating-license application and approval before the plant can run. The public record also shows how many technical and legal surfaces had to be cleared to reach this point: FEIS work under NUREG-2268, state-level industrial siting and water-supply analysis in Wyoming, and NRC scrutiny of PRA use, materials qualification, seismic treatment, and safety-significant structures. In other words, TerraPower has de-risked the first major gate, not finished the course. The legal overlay worsened after the Prohibiting Russian Uranium Imports Act. Public-law text, DOE waiver guidance, and the White House statement all show that the United States intentionally narrowed the most convenient historical HALEU fallback, with only limited waiver flexibility. For a developer whose first-core path was already disrupted by Russia's invasion of Ukraine, that makes legal and regulatory completion inseparable from supply-chain execution.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
