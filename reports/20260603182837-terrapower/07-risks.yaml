  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: commercial-fuel-contracts
      missingEvidence: Public sources do not disclose committed commercial HALEU volumes, pricing, delivery schedules, fallback provisions, or take-or-pay terms across Centrus, Framatome, and GNF-A for Kemmerer first-core and follow-on units.
      whyItMatters: The largest residual schedule risk in the public record is fuel availability; without contract detail, investors cannot judge whether mitigation has moved from intent to bankable supply.
      diligencePath: Request executed fuel-supply agreements, milestone schedules, delivery dependencies, and any waiver assumptions tied to Russian-origin or other emergency supply.
      relatedQuestionRefs:
        - QR010
        - QR028
      relatedTableRefs:
        - TR002
        - TR003
    - type: private-evidence-only
      severity: material
      topic: epc-contingency-and-cost-sharing
      missingEvidence: TerraPower has not publicly disclosed the detailed cost-to-complete, contingency sizing, EPC risk-sharing terms, or overrun-allocation structure for Kemmerer.
      whyItMatters: FOAK nuclear-project returns can change dramatically when cost growth is borne by the developer or the customer rather than by a sponsor or contractor.
      diligencePath: Request cost-to-complete model, contingency drawdown rules, major fixed-vs-variable EPC assumptions, and current estimate-at-completion versus budget.
      relatedQuestionRefs:
        - QR028
      relatedTableRefs:
        - TR002
        - TR005
    - type: private-evidence-only
      severity: material
      topic: pacificorp-transfer-and-offtake-economics
      missingEvidence: Public sources do not disclose PacifiCorp's final ownership, transfer, tariff, or offtake economics for Kemmerer or any follow-on Natrium units.
      whyItMatters: TerraPower's visible customer proof is concentrated around PacifiCorp, so undisclosed economics make it hard to judge durability if schedule or cost changes.
      diligencePath: Request definitive commercial agreements, transfer conditions at COD, utility approval milestones, and downside scenarios if PacifiCorp slows or declines expansion.
      relatedQuestionRefs:
        - QR015
        - QR028
      relatedTableRefs:
        - TR003
        - TR005
    - type: private-evidence-only
      severity: material
      topic: natrium-vs-mcfr-resource-allocation
      missingEvidence: Public materials show meaningful MCFR partner activity but do not quantify how much leadership, engineering, or capital attention is being allocated away from Natrium.
      whyItMatters: Parallel platform development can be a hidden execution drag if senior technical or managerial bandwidth is more constrained than public milestone reporting implies.
      diligencePath: Request program-level org charts, budget allocations, executive ownership, and resource-ringfencing rules between Natrium and MCFR.
      relatedQuestionRefs:
        - QR018
      relatedTableRefs:
        - TR003
        - TR004
    - type: private-evidence-only
      severity: minor
      topic: operating-license-plan-detail
      missingEvidence: Public sources confirm the need for a separate operating license but do not publish the full filing strategy, content maturity, or expected issue list for TerraPower's OL application.
      whyItMatters: Investors need to know whether the remaining licensing path is a routine extension of current work or a fresh source of timeline risk.
      diligencePath: Request OL filing roadmap, outstanding topical reports, hearing expectations, and the internal owner for each remaining licensing workstream.
      relatedQuestionRefs:
        - QR002
        - QR003
        - QR030
      relatedTableRefs:
        - TR001
