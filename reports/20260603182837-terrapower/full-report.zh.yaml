      - number: '4.4'
        title: 公开财务缺口与承销障碍
        blocks:
          - type: paragraph
            body: >-
              核心承销问题不是 TerraPower 缺少可信收入模型，而是公开记录仍缺少评估该模型所需的真实运营数字。已审阅的 TerraPower
              材料和独立报道都没有披露已确认收入、订单、手头现金、月度烧钱、债务契约、项目融资条款、已实现电价或项目级毛利率。因此，最好的公开信息是间接的：融资规模、DOE 成本分担机制、燃料伙伴公告、项目成本口径，以及
              NuScale 和 Oklo 的公开可比公司文件。这足以得出 TerraPower 资本密集且依赖融资的结论，但不足以估计稀释风险、下行现金跑道或单个 Natrium 部署的经济性。


              可比公司集合进一步凸显这一点。NuScale 和 Oklo 至少公布经审计的资产负债表和现金使用数据；TerraPower
              没有。但即便这些公开同业，也显示该行业要以有吸引力的利润率商业化有多难。因此，TerraPower
              的财务结论是混合的。公司拥有可信资本渠道、多重外部需求信号，以及异常严肃的联邦和公用事业交易对手。但在管理层披露或私下分享当前现金余额、隔离项目预算、客户经济性和燃料承诺之前，投资逻辑仍依赖对执行的信心，而不是可承销的财务模型。这适合叙事尽调，不适合最终承销。
