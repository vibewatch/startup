      - number: '7.4'
        title: 资本、人员和监控纪律决定故事能否继续具备投资性
        blocks:
          - type: paragraph
            body: >-
              TerraPower 的资本和组织能力强于许多先进反应堆同行，但剩余风险仍是信息不透明下的执行。TerraPower 2025 年融资公告和 POWER 2026 年项目时间线都表明，公司在 ARDP
              支持之外已拼出可观私人资本，足以让项目继续推进。公开投资者仍看不清的是：完工总成本、应急缓冲规模、燃料商业条款，以及与 PacifiCorp
              的电站转让经济性。这也是本章如此看重人员和流程的原因。TerraPower 自己的招聘信号显示，公司正在搭建严肃的供应商质量体系：供应商质量代表岗位要求 10 年以上 NRC/DOE 供应商质量经验、熟悉
              Appendix B 和 NQA-1、审计、焊接监督、驻场监督，以及首台套部件经验。同一招聘信息还说，外籍员工招聘可能受出口管制审批时长限制。这是真实的缓释信号，也暴露出稀缺人才瓶颈。MCFR
              项目的公开证据又加了一层：Southern Company 里程碑显示，TerraPower 能和可信伙伴推进第二条先进反应堆路线，但没有说明管理层产能如何在 MCFR 和 Natrium
              之间分配。NuScale 和 Oklo 的同行文件提醒投资者，即便资金充足，先进核能公司也可能背负大额亏损和现金消耗。实际结论是，监控 TerraPower
              时，不应把它当作早期科学实验，而应把它当作复杂工业项目；项目能否继续具备投资性，取决于监管能否按时完成、燃料链商业证明能否跑通、供应商质量能否守住，以及公用事业和资本支持能否持续。
