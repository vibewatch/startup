      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              TerraPower 的资本化程度好于许多私营反应堆开发商，但可见资本结构仍像一条依赖链，而不是自我维持的运营模型。公司官方公告支持一个判断：自 2022 年以来，已披露股权融资至少 $1.4
              billion；DOE 支持又提供了以数十亿美元计的联邦锚点。即便如此，简单的公开算术仍很吃紧。首座电厂约 $4
              billion、非联邦配套资金要求、燃料循环基础设施和相邻项目工作，留给自满的空间很小；尤其是公开材料没有披露此前融资中有多少仍未花、未受限，或专门用于 Natrium。换句话说，TerraPower
              已经融到很多钱，但公开证据仍没有显示它已完全闭合商业资本回路。


              反向证据强化了这一担忧。Nuclear Engineering International 报道 HALEU 造成进度滑坡，World Nuclear News 则描述了一份条款清单：TerraPower
              将帮助出资建设 HALEU 生产设施，并承诺十年期承购。这些事实重要，因为它们把融资依赖从反应堆建设本身，推向燃料可得性、交易对手执行和长期采购义务。PacifiCorp
              的额外反应堆规划作为需求信号在财务上是正面的，但它不能替代已披露积压订单、项目融资结构或当前现金跑道。实际判断是：TerraPower
              看起来可融资，但公开数据还不足以证明它在首电和后续部署之前具备资本充足性；要证明这一点，需要管理账目和项目协议。
