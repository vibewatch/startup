      - number: '7.2'
        title: HALEU 与首炉芯燃料链执行仍是最清晰的进度杀手
        blocks:
          - type: paragraph
            body: >-
              整个 TerraPower 文件中最强的证伪证据，是市场已经看过关键风险发生一次：燃料可得性推动了进度变化。Nuclear Engineering International 在 2023
              年报道，TerraPower 预计至少延误两年，因为其原始首炉芯计划依赖俄罗斯 HALEU；WyoFile 后来把运营目标从 2028 年调整到 2030 年，与公司在乌克兰被入侵后决定切断与 TENEX
              的联系相连。这段历史重要，因为它证明 HALEU 不是从同业文件复制来的假设性风险因素，而是 Natrium 已被验证的进度调速器。公司围绕这个问题搭建了可见的缓释栈。TerraPower 与 Centrus
              围绕 2030 年运营所需的国内浓缩里程碑扩大合作，Framatome 正在 Richland 建设金属化试验线，GNF-A 宣布在 Wilmington 附近建设专用 Natrium 燃料设施。DOE 的
              HALEU Availability Program 正是为支持这类瓶颈而设。不过，同一批公开来源也说明为什么这一风险仍位居前列。每项缓释都处在不同工业环节、由不同交易对手承担，时间和经济性也不同。Centrus
              自己的警示语言称，商业化仍依赖资金、合同、监管决定和规模化。Framatome 公告描述的是试验线，不是完全商业化的金属原料工厂。GNF-A 2022 年公告确立了意图和资本开支，但此后公开状态相对稀薄。NRC
              仪表板进一步把依赖关系说得更尖锐：它指定的是金属铀锆 HALEU 燃料，而不是普通 LEU。正确读法是：TerraPower 拥有同业中最明确的国内燃料建设路径，但仍没有公开证明端到端商业链条已经跑通。
