chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与产品范围
        blocks:
          - type: paragraph
            body: >-
              TerraPower 自有材料把公司锚定为一家 2008 年成立的核能创新公司，由 Bill Gates、Nathan Myhrvold 和 John Gilleland
              创办，目标是推进更安全、可扩展性更强的先进反应堆。官方描述比单一反应堆项目更宽：TerraPower 称自己从事先进核能和同位素应用，但 Natrium 显然是旗舰商业化路径。公司网站、2024 年
              Natrium 技术 PDF 和多篇新闻稿都把 Natrium 描述为一座 345 MW 钠冷快堆，搭配熔盐储能，可在峰值时段灵活拉升到 500 MW。这个定位很关键：TerraPower
              不是纯科学项目，而是一家面向电网的基础设施公司，试图把首台同类反应堆做成可复制的商业产品。公开地点证据一致指向 Bellevue, Washington 作为公司总部；新闻稿电头和第三方报道也指向 Everett
              的研究活动，以及 Wyoming 的项目执行。
