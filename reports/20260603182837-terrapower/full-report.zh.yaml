      - number: '6.2'
        title: 具名部署证明在 PacifiCorp 上最强，其他地方仍未商业化
        blocks:
          - type: paragraph
            body: >
              PacifiCorp 是最清晰的公开证明，说明 TerraPower 已从抽象先进反应堆营销跨入公用事业牵头的商业化路径。TerraPower 自己 2023 年公告称，PacifiCorp 的综合资源计划选择到
              2033 年新增两台 Natrium 机组；PacifiCorp 面向客户的新闻稿则把 Natrium 描述为 PacifiCorp
              客户的潜在可靠电源，并明确描述最多五台额外反应堆的联合研究。这种客户侧语言比只有初创公司发新闻稿更有分量，因为它显示公用事业公司本身愿意把 Natrium
              描述为未来服务费率支付者的一部分。不过，即便最好的证明仍是投运前证明。Kemmerer 示范项目正在建设，并得到 WyoFile、SVI News、POWER 和 NRC
              里程碑报道的独立印证，但公开证据仍没有交付电力、电厂转让经济性或商业表现。离开 PacifiCorp 后，证明进一步变弱。ENEC 是探索性 MOU，Gyeongsangnam-do
              是供应链协议，Southern Company 的 MCFR 工作是面向工业和近海事应用的技术与未来市场合作，而不是 Natrium 电厂订单。因此，TerraPower
