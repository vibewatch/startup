              TerraPower 的采用轨迹更适合通过部署里程碑理解，而不是通过经典客户指标理解。DOE 于 2020 年在 ARDP 下选择 Natrium；PacifiCorp 与 TerraPower 从
              Wyoming 选址工作推进到多反应堆研究；PacifiCorp 2023 年 IRP 纳入两台额外 Natrium 机组；Kemmerer 项目随后积累州级许可、建设、培训和 NRC
              里程碑，让这条路径比多数先进反应堆概念更具体。这是有意义的采用证据，因为公用事业公司和监管方正把真实规划和执行资源投入 Natrium。但这不等于重复商业销售。已审阅公开来源没有披露客户数、已签 PPA
              积压订单，或 Natrium 的在运工业与 hyperscaler 买方名单。AI 驱动电力需求显然改善了市场背景：DatacenterDynamics 和 NucNet 把 TerraPower 2025
              年融资与 AI 需求相连，Sabey Data Centers 围绕 TerraPower 微反应堆签署探索性 MOU，CNBC 以及 Kairos 的 Google
              协议则显示科技买方如今愿意签署明确核电安排。但这个对比有两面性。Kairos 可以指向 Google 作为具名多电厂客户路径；TerraPower 的公开数据中心故事仍是探索性、相邻性的，而不是已披露在运
