      - number: '7.3'
        title: 首台同类建设、伙伴集中和客户集中相互交织
        blocks:
          - type: paragraph
            body: >-
              TerraPower 的 FOAK 执行风险不只是施工风险，而是系统级协同风险：监管机构、DOE 成本分担、PacifiCorp 的公用事业落地路径、Bechtel 的 EPC
              工作，以及从重型反应堆部件到钠系统和控制系统的长供应商名单，都必须同时咬合。ENR 和 POWER 将项目全口径成本放在约 $4 billion，现场高峰用工约 1,600 人。POWER
              的里程碑报道列出了一张覆盖长周期供应商的宽网络，也说明 TerraPower 为了守住进度，一直在有意识地关闭采购轮次。TerraPower 自己的供应商页面称，公司已在全球对接超过 80
              家公司、大学和政府机构。这些迹象说明项目严肃推进，但也解释了为什么合作伙伴风险仍然高：任何滑期、不合规或合同争议，都可能迫使项目重排。客户集中又把问题放大。PacifiCorp 仍是唯一公开点名、对特定场址
              Natrium 部署有意向的公用事业锚点；额外机组的公开证据仍是规划证明，而不是运行需求。这比泛泛的市场叙事强得多，但也意味着一旦公用事业路径走弱，TerraPower
              看得见的商业案例会急剧收窄。最合适的反向可比案例是 NuScale 的 Carbon Free Power Project。NuScale 和 UAMPS 最终终止了 CFPP，World Nuclear
              News 报道称，Idaho SMR 项目在认购不足和成本压力后结束。TerraPower 处于比 CFPP 当年更强的位置，因为 Kemmerer 现在已有 DOE 成本分担、州级许可、联邦许可和实体施工。但
              CFPP 仍给出了关键负面教训：即便有公用事业背书，先进核能项目也可能在后期因为经济性、认购或执行信心恶化而失败。
