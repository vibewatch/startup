  - id: TV005
    title: 投资逻辑破裂与退出触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 燃料路径失败
        - HALEU 或制造准备度再次造成重大进度延误
        - 打破最强的后期执行论据，并把价值推向悲观区间
        - 暂停推进，或只在估值大幅降低后重新承销
      - - 融资定价过高
        - 新一轮隐含估值高于 Oklo 公开市值，但没有匹配的新披露或合同
        - 把一家强公司变成风险调整后不划算的入场点
        - 回避，或坚持估值重置 / 更强保护条款
      - - 客户选择权停滞
        - PacifiCorp 或其他买方没有披露经济性，也没有明确后续承诺
        - 抹掉相对 NuScale 的关键溢价来源
        - 降为观察名单状态
      - - 完工成本意外
        - 管理层无法证明预备金、DOE 拨款时点和非联邦资金覆盖
        - 推高稀释风险并压缩上行空间
        - 等融资方案清晰后再投资
      - - 披露失败
        - 即使流程后期仍不披露股权结构表、优先股堆叠或估值
        - 无法真正承销下行风险
        - 不要推进到「继续研究」之外
    notes: 这些退出触发因素必须可跟踪，并直接对应估值压缩，而不只是公司质量低于预期。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前轮融资价格
        - 股价、投后估值和近期任何老股交易定价
        - 没有实际入场价，任何估值判断都站不住
        - 索取最新融资材料、认购文件以及董事会批准的估值备忘录
      - - 资本结构
        - 清算优先权、认股权证、期权池和优先级瀑布
        - 下行回报可能与表面投后估值明显不同
        - 向法务或 CFO 索取完整股权结构表和权利摘要
      - - 完工成本
        - 更新后的 Kemmerer 完工成本、预备金、DOE 拨款时点和非联邦资金来源
        - 决定稀释风险，也决定下一轮融资是否防守性
        - 索取项目融资模型、预算与实际支出对比，以及 ARDP 里程碑排期
      - - 客户经济性
        - PacifiCorp 商业结构、定价假设，以及新增机组的所有权 / 运营方分工
        - 规划价值不等于可变现需求
        - 索取公用事业条款清单、IRP 支持材料和任何商业原则文件
      - - 燃料经济性
        - 已承诺的 HALEU 数量、价格、制造里程碑和交易对手备选方案
        - 燃料不确定性是估值下行最清晰的路径
        - 索取 TerraPower / Centrus / Framatome / GNF-A 里程碑看板和供应协议
    notes: 这些问题按对入场价格或下行保护的直接影响排序，而不是按一般好奇心排序。
    claimRefs:
      - CV007
      - CV008
      - CV011
      - CV039
      - CV044
