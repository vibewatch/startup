  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与同业类别
        blocks:
          - type: paragraph
            body: >-
              TerraPower 并不在一个单一、干净的同业集合中竞争。直接的先进反应堆领域已经覆盖钠快堆、高温气冷堆、氟盐冷却设计、轻水 SMR、微反应堆叙事和熔盐概念。实践中，买方面临的竞争问题不太是“哪个 SMR
              最好？”，而是“哪条路径最匹配我的负荷、场址、燃料容忍度和融资结构？”因此，TerraPower 位于多组重叠比较的中间。相对 X-energy 和 Kairos，它争夺美国第一波先进反应堆部署和临近
              hyperscaler 的注意力。相对 NuScale，它争夺想要监管上可信的模块化核能路径的买方。相对 Oklo，它争夺资本市场心智和数据中心邻近叙事。相对 Terrestrial Energy
              及其他相邻新进入者，它争夺一个更宽泛的叙事：先进反应堆可以替代化石基荷或工业热。大型反应堆既有厂商和燃气支撑的现状方案仍是重要替代品，因为全球核电建设基础仍由大型项目主导，而不是已验证的先进反应堆机队。
