companyProfile:
  summary: >-
    TerraPower 是一家先进核能公司，正在开发 Natrium 钠冷快堆：它把 345 MWe 核电出力与熔盐储能结合，峰值需求时可把输出拉到 500 MWe。公司也在推进面向工业热和电力用途的 MCFR 技术。公开证据显示，在
    DOE 支持和 PacifiCorp 参与下，Wyoming 的商业化推进确实有动量；但 TerraPower 仍是一家未商业化的私营公司，对估值和经济性披露有限。
