      - number: '2.3'
        title: 买方、预算所有者与需求驱动因素
        blocks:
          - type: paragraph
            body: >-
              买方地图比“公用事业公司”更宽。公用事业公司仍是最具体的近期买方，因为它们掌握综合资源计划、煤电退役决策、并网权和长期受监管资本预算。但终端用户逻辑正在扩展。TerraPower 自己的 Natrium
              材料强调可再生能源占比较高电网中的灵活输出；MCFR 材料和 DOE 文章则明确指向工业热、炼厂、化工处理、水处理及其他高能耗行业。同业材料强化了这一点：这不是 TerraPower 独有的口径。X-energy
              主打重工业蒸汽和面向数据中心的可靠性，Kairos 把商业化与 Google 支持的清洁电力需求连接，NuScale 则营销煤电替代、AI 负荷、氢能、工艺热和海水淡化。Data Center Dynamics
              与 NucNet 都把 TerraPower 2025 年融资放在 AI 驱动电力需求背景下，说明 hyperscaler
              负荷增长已经影响先进核能周边的资本形成。实践中，预算所有者因细分市场而异：公用事业资源规划者、独立电力发起方、工业脱碳团队、主权能源项目，以及最终通过 PPA 或结构化项目融资工具采购的大型电力买方。
