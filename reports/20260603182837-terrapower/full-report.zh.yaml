      - number: '2.4'
        title: 采用约束与未解决市场问题
        blocks:
          - type: paragraph
            body: >-
              最强市场顺风也伴随最明显瓶颈。World Nuclear Association、DOE 和 NRC 材料都指向 HALEU 供应这一结构性约束：超过一半 SMR 设计需要
              HALEU，美国国内可得性仍不足，俄罗斯铀进口禁令又进一步加大替代供应路径压力。TerraPower 与 ASP Isotopes、Framatome、GNF
              以及其他燃料循环参与者的合作公告，实际上确认这个市场既是反应堆销售市场，也是供应链建设市场。资本强度是第二个约束。ENR 把 Kemmerer 描述为约 $4 billion 项目，而 NuScale 的
              CFPP 终止也提醒市场：即便许可进展强，也不保证承购或经济闭环。最后，TerraPower 专属经济性仍有重大数据缺口。公开证据支撑需求方向，但不支撑精确的 Natrium LCOE、已实现电价或
              TerraPower 专属市场份额模型。结论是，这个市场战略上有吸引力、方向上很大，但仍难以用传统成长股权的精度承销。
