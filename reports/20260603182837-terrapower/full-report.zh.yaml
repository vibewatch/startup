        title: 成本结构与单位经济性代理
        blocks:
          - type: paragraph
            body: >-
              TerraPower 的公开成本图景由首台同类反应堆经济性主导，而不是软件式利润率。最清晰的硬锚点是：ENR 把 Kemmerer 描述为约 $4 billion 项目；TerraPower 称 ARDP
              框架授权 50/50 成本分担，最高 $2 billion；Natrium 首座电厂预算不仅包括反应堆设计和许可，还包括燃料开发、鉴定工作和两个配套设施。额外公开披露进一步扩大了支出边界：TerraPower 与
              Global Nuclear Fuel 描述的 Natrium Fuel Facility 投资超过 $200 million；分阶段建设和劳动力材料则指向商业运行前长期场址与培训建设。


              由于 TerraPower 不披露已实现定价、毛利率或项目级成本分摊，公开可比公司是当前判断经济难度的最佳代理，而不是精确可比性的代理。NuScale 公开文件显示公司有实质收入但亏损巨大，Oklo
              文件则显示其拥有大量流动性，同时预计运营和投资现金消耗很重。这些可比公司不能告诉我们 TerraPower 的未来利润率，但确实说明先进核能开发商可以在证明耐久运营经济性之前很久就吸引资本。对
              TerraPower 而言，承销缺口很具体：投资人仍看不到 LCOE 假设、单位出力燃料成本、EPC 与技术利润率拆分，也看不到最终有多少项目成本会留在
              TerraPower，而不是由公用事业公司、承包商或联邦伙伴承担。
