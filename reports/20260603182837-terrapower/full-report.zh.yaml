              TerraPower 的产品最容易理解为一套交付栈，而不是单个反应堆 SKU。对近期买方而言，公司销售的是 Natrium
              电厂结果：为需要稳定输出和峰值支撑的公用事业或煤电替代场址提供可调度清洁容量。公开材料明确说明，这个承诺不只依赖钠快堆本身。TerraPower
              打包了核岛、熔盐储能系统、配套钠处理和培训设施，以及通过外部伙伴建设的燃料链。这让客户工作流更像程序化基础设施替换，而不是标准设备订单。同一公开记录也显示，MCFR、IET 和 MCRE
              构成第二个更早期的资产家族。这些资产把 TerraPower 延伸到工业热和未来熔盐应用，但应被视为创新管线产品，而不是当前可与 Natrium 对等的商业产品。承销要点是：TerraPower
              的产品表面已经横跨电厂、劳动力、供应链和实验层。
