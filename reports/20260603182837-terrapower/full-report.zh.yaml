      - number: '3.2'
        title: 按买方任务划分的能力与商业适配
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，当买方想要大型煤电场址替代，或带调度灵活性的公用事业规模清洁容量块时，TerraPower 最强。Natrium 披露的 345 MWe 基准额定功率和 500 MW 峰值输出，让它与
              X-energy 80 MWe 的 Xe-100 模块、Kairos 50 MW 的 Hermes 2 电厂、NuScale 77 MW
              模块处在不同的近期规模类别。这个规模优势对受监管公用事业和退役煤电改造很重要，但并不是处处胜出。X-energy 在卖工业蒸汽和多机组模块化，Kairos 在卖带明确 Google
              关联部署路径的分阶段学习曲线，Oklo 在卖由高额公开市场估值支撑的紧凑快堆可选性，NuScale
              在卖最强的正式许可背书。所有玩家的公开定价大多缺失，因此当前竞争比较更多取决于规模、架构、客户路径和交付证明，而不是透明的每兆瓦时美元经济性。结果是一个碎片化市场：TerraPower
              可以在某个买方任务上领先，也可能在另一个任务上落后。
