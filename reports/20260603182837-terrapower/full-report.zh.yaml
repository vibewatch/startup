  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现
        blocks:
          - type: paragraph
            body: >-
              TerraPower 的公开财务故事仍从公司试图销售什么开始，而不是已经确认了什么收入。审阅过的官方材料支持一种项目型变现模型：围绕 Natrium
              部署、配套工程和许可工作、燃料制造与供应链赋能，以及反应堆推广附带的长周期服务来构建。它们不支持已披露的经常性收入、公开反应堆价格表、电力购买电价，或许可费时间表。这个差异很重要，因为今天可见的现金流入是融资和联邦成本分担，而客户侧可见信号仍是开发阶段指标，比如
              PacifiCorp 研究、IRP 纳入和国际 MOU，不是带披露经济性的已签合同。


              因此，最可信的前瞻收入路径是一条分阶段基础设施商业化弧线：先示范 Kemmerer，再把公用事业和主权兴趣信号转化为后续部署，之后才在其上叠加燃料、服务和机队式经济性。公开证据显示，TerraPower
              已在建设部分前置条件——燃料设施、HALEU 合作和公用事业规划研究——但公司还没有公布合同机制，投资人无法拆分技术费、建设转嫁、燃料利润率或长期 O&M
              价值。从财务角度看，本章应被理解为对变现架构和融资依赖的分析，而不是当前运营牵引力的证明。
