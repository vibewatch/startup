      - number: '8.4'
        title: 投资逻辑破裂触发点和最终尽调：这是条款驱动的决策，不是氛围驱动
        blocks:
          - type: paragraph
            body: >-
              TerraPower
              仍可能成为有吸引力的投资，但前提是缺失项用硬文件补齐，而不是靠叙事。第一道硬门槛是估值披露：投资者需要当前股价、投后估值、清算优先权和稀释结构，才能理解有效入场价格。第二道门槛是工业执行：完工总成本、应急缓冲、DOE
              拨款节奏和非联邦资本承诺，将决定下一轮融资是可选还是被迫。第三道门槛是商业化：PacifiCorp 的后续需求和燃料链都能创造上行空间，但目前都缺少公开经济条款，无法测算上行规模。如果 TerraPower
              再次因燃料导致进度滑期、在没有新增披露的情况下以高于最贵公开同行的隐含估值融资，或无法把额外机组规划转化为可融资的商业承诺，投资逻辑就会破裂。在这些问题得到回答之前，唯一有纪律的建议就是继续研究，并明确表示：如果价格和条款进入公开证据能真正支撑的区间，就愿意重新评估。
