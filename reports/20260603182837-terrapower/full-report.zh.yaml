      - number: '5.3'
        title: 部署、依赖与差异化
        blocks:
          - type: paragraph
            body: >-
              关于 TerraPower，最有说服力的公开证据不是单张规格表，而是 DOE 成本分担、NRC 工作流、Bechtel 场址执行和伙伴建设燃料链的汇合。这个组合让 Natrium
              看起来比许多概念浓厚的同业更接近部署，但也暴露了产品可能出问题的位置。TerraPower 并不自己控制整条 HALEU
              链，公开来源包显示，浓缩、金属化和制造分别依赖不同机构，时间线也不同。公司相对同业的差异化因此是混合的。相对 X-energy，TerraPower
              强调更大的单场址公用事业规模，以及储能辅助调度，而不是先做模块化工业蒸汽。相对 Kairos，它强调大型旗舰建设，而不是迭代式示范阶梯。相对 NuScale，它提供更有新意的“反应堆 +
              储能”概念，但接受更难的燃料和许可问题。Bechtel 的公开角色表明，执行护城河既来自 EPC 能力和配套设施交付，也来自反应堆物理。这有价值，但也意味着 TerraPower
              的边缘优势取决于多方协调质量，而不是孤立的自研模块。
