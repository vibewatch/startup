      - number: '8.3'
        title: 情景逻辑和可比锚点：可辩护区间位于 NuScale 和 Oklo 之间
        blocks:
          - type: paragraph
            body: >-
              公开可比公司更能说明市场心理，而不是给出精确 DCF。NuScale 当前市值远低于 Oklo，尽管 NuScale 的监管历史更丰富、也披露收入，因为市场正在奖励可选性、AI
              相关能源需求和资产负债表强度，而不是近期反应堆交付。TerraPower 处在两端之间。它比 Oklo 有更强的特定场址项目证明，比许多同行有更清晰的战略和联邦背书，也比 NuScale 被取消的 CFPP
              路径展现出更真实的首座电站基础。但 TerraPower 仍是私营公司、仍处于商业化前、在价格、利润率和下行条款上仍不透明。因此，本章使用估值区间，而不是点估值。悲观情景假设燃料或资本继续滑坡，把
              TerraPower 拉回较低的公开锚点附近。基准情景假设 Kemmerer 按轨推进，后续需求真实存在但尚未签约。只有当 TerraPower
              开始把稀缺性、项目进展和额外机组可选价值转化为明确商业证据，而不只是规划信号和融资标题时，乐观情景才可信。
