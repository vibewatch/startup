      - number: '2.2'
        title: 受证据约束的市场规模视角
        blocks:
          - type: paragraph
            body: >-
              公开证据不足以支撑一个干净、以美元计的 TerraPower 专属全球 TAM，因此本章改用容量和部署视角来测算市场。全球背景仍然很大：IEA 称，截至 2025 年底，在运核电容量维持在 420 GW，15
              个国家有 78 GW 在建，尽管这条管线几乎仍全是大型反应堆容量，而非 SMR。对 TerraPower 而言，最具体的可服务市场信号来自公开且有伙伴背书的兆瓦数。一台 Natrium 机组基准输出 345
              MWe，峰值最高 500 MWe。PacifiCorp 2023 年 IRP 选择了两套额外 Natrium 系统，以峰值输出计，三台反应堆合计 1,500 MW。如果首台 Kemmerer 机组加上
              PacifiCorp 研究的五台额外 Natrium 机组都推进，可见且由伙伴背书的机会将约等于 2,070 MW 基准容量、最高 3,000 MW 峰值容量。这不等于 TAM，但它是一个可支撑的近期 SAM
              视角，根基是具名交易对手，而不是泛泛的市场材料。
