      - number: '6.4'
        title: 耐久性和集中度仍是主要承销缺口
        blocks:
          - type: paragraph
            body: >
              核心尽调问题不是 TerraPower 是否拥有有意义的交易对手，而是公开证据是否足以承销耐久、分散的客户经济性。没有已审阅来源披露
              NRR、GRR、流失、合同期限、续约节奏、客户满意度或头部客户收入集中度。这很重要，因为今天的公开记录高度集中在 PacifiCorp 周围。如果 PacifiCorp
              放慢、重新排序，或改变资源规划假设，TerraPower 公开可见的公用事业客户故事会明显变薄。更宽行业记录说明，这不是理论风险。NuScale 的 CFPP 因认购水平不足被终止，CATF
              明确认为，除非商业结构和风险分担异常强，否则公用事业公司往往不是 FOAK 先进反应堆的好首批推动者。TerraPower 确实拥有比 CFPP 更好的要素：DOE
              成本分担、煤电场址再供能叙事，以及规模更大、垂直整合程度更高的公用事业伙伴。但 TerraPower 也仍有可见的 HALEU 和进度依赖，其国际 MOU
              也仍不具约束力。正确结论不是客户耐久性弱，而是客户耐久性在公开层面仍大多未被测量。公开证明足以支撑一个严肃的公用事业牵头商业化故事；但还不足以扫清集中度和留存风险。
