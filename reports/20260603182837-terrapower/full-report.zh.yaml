      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              Natrium 的公开架构比多数先进反应堆营销材料更具体，因为 TerraPower 披露了不同的核岛和能源岛、345 MWe 钠快堆，以及一个可在超过五个半小时内把交付输出抬升至 500 MWe
              的储能系统。这个组合很重要，因为它解释了为什么 TerraPower
              把电厂定位为灵活电网基础设施，而不只是基荷核电。公开技术说明还把主张延伸到热和蒸汽，尽管目前还没有具名公开工业承购。这个前端承诺背后，是一个可见度较低但同样重要的运营模型：Centrus
              负责浓缩，Framatome 负责金属化，GNF 负责制造，合格供应商负责质量受控部件交付。MCFR 又采用另一套运营模型。它的验证路径经过 Integrated Effects Test，再到
              MCRE；公开重点是高温工业用途，而不是煤电场址公用事业替代。因此，架构是清晰的，但隐藏的数字控制和电厂软件边界在公开记录中仍相当稀疏。
