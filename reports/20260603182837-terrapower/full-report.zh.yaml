      - number: '1.4'
        title: 里程碑、监管进展与未解决尽调问题
        blocks:
          - type: paragraph
            body: >-
              里程碑记录如今已经足够厚，后续章节可以把 TerraPower 当作真实部署案例，而不是假设设计。时间线从 ARDP 入选和早期燃料供应合作开始，经过 2022–2025 年融资，到 2024 年破土、2026
              年建设许可证获批和正式开工。监管证据尤其重要，因为 NRC 预申请记录、ANS 报道、TechCrunch 报道以及 POWER
              的详细时间线合在一起，显示项目已经远远越过概念阶段。不过，同一组记录也暴露了最重要的未解问题。Nuclear Engineering International 明确指出 HALEU 短缺导致进度滑坡；ENR 把
              Kemmerer 描述为约 $4 billion 项目；公开材料仍未披露当前估值、收入、确切员工数，也没有披露 DOE
              支持附带的详细条款和里程碑。因此，公司概况足以支撑一条进展叙事的投资分析，但还不够透明，不能替代融资数据室。
