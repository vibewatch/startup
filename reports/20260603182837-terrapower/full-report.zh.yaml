      - CV034
      - CV035
      - CV040
      - CV041
      - CV042
      - CV043
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - TerraPower（仅公开信息代理）
        - 私有先进核能开发商
        - 当前投后估值未披露；仅公开信息基准区间 $6B-$9B
        - 标的公司在本组私有公司中项目验证最强
        - 没有公开股权结构表、现金或定价披露
      - - Oklo
        - 上市先进核能开发商
        - 2026 年 6 月市值 $11.52B；CompaniesMarketCap 显示 TTM 收入 N/A
        - AI 电力和战略稀缺性叙事溢价的当前最佳证据
        - 商业化前状态和公开市场动量可能高估公允私有价值
      - - NuScale
        - 上市先进核能开发商
        - 2026 年 6 月市值 $4.33B；CompaniesMarketCap 显示 TTM 收入 $31.47M
        - NuScale 披露收入、现金和亏损，是有用的下沿锚点
        - CFPP 终止和商业模式差异让直接外推变得复杂
      - - Centrus
        - 上市 HALEU 供应商 / 燃料链基准
        - 燃料供应业务已盈利，并有 DOE 支持的 HALEU 工作；不能套用反应堆开发商估值倍数
        - 说明燃料链融资和监管方式不同于反应堆股权
        - 商业模式不同，因此只能作背景参照，不是估值可比公司
    notes: 该可比组既包括直接相关的上市反应堆开发商，也包括一个燃料链背景基准，因为 TerraPower 的价值同时受反应堆执行和燃料可得性约束。
