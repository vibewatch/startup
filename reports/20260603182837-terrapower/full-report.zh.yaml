  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：公司看起来真实，但价格仍然不清楚
        blocks:
          - type: paragraph
            body: >-
              TerraPower 已经跨过概念公司讲故事阶段，进入真实项目执行。自 2022 年以来，公司披露的股权融资至少 $1.4 billion，Natrium 背后有最高 $2 billion 的 ARDP
              成本分担支持，现在又有「施工许可 + 开工」的故事，而许多先进核能同行仍没有这些进展。这些事实原则上让 TerraPower
              具备投资性。问题在于，估值不等于公司质量。本章审阅的公开来源仍未披露当前投后估值、股价、清算优先权、稀释结构，或按资金来源拆分的完工总成本。也就是说，市场能看出 TerraPower
              很强，却不知道理性投资者今天该付什么价格。因此，正确结论既不是买入，也不是回避，而是在明确入场纪律下继续研究。仅基于公开证据，TerraPower 的认真私募估值讨论可以高于 NuScale
              当前公开市值，但不能只因为 TerraPower 具备战略稀缺性、且比许多私营同行推进得更远，就盲目接受 Oklo 式溢价。
