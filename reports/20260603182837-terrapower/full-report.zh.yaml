  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层与客户证明的口径
        blocks:
          - type: paragraph
            body: >
              TerraPower 的公开客户表面是真实的，但不像成熟软件或设备供应商客户名单那样宽。唯一具名、且明确像潜在买方、业主或公用事业承购方一样行动的交易对手，是 PacifiCorp；它通过 Rocky
              Mountain Power 围绕 Kemmerer Natrium 项目，以及其资源组合中的额外 Natrium
              规划来推进。围绕这个锚点，还有第二层公共部门或战略参与者：它们在商业上重要，但不等同于收入客户。DOE 是为首台同类部署去风险的示范赞助方；Southern Company 是另一条 MCFR 线上的公用事业和
              R&D 伙伴；ENEC 与 Gyeongsangnam-do 代表国际部署和供应链兴趣，而不是已签 Natrium 订单。最后一层是纯终端市场需求叙事：TerraPower 越来越多出现在 AI
              电力和数据中心报道中，但已审阅公开来源没有点名任何 hyperscaler、工业热买方或其他终端用户正在购买 TerraPower
              输出。对承销而言，这意味着本章必须区分公用事业规划证明、试点和示范伙伴、战略市场开发交易对手，以及尚未转化的需求叙事，不能把每个 logo 都当作活跃客户。
