  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 即便许可证到手，监管和法律关口仍是顶级风险
        blocks:
          - type: paragraph
            body: >-
              TerraPower 的风险画像从一个悖论开始：公司如今拥有先进核能领域最强的监管故事之一，但这不意味着监管风险已经消失。DOE 2026 年 3 月摘要和 NRC Kemmerer 仪表板都确认，在
              TerraPower 2024 年 3 月申请、2024 年 5 月受理、环境审查、听证和 2026 年 3 月决定之后，NRC 向 Kemmerer Power Station Unit 1
              授予建设许可证。这个进展很重要，因为它让 TerraPower 比纸面反应堆同业真实得多。但同一批官方来源也明确说明，许可证不是运营牌照。电厂运行前，TerraPower
              仍需要单独提交运营牌照申请并获批。公开记录还显示，为走到这一步，必须清理多少技术和法律表面：NUREG-2268 下的 FEIS 工作，Wyoming 州级工业选址和供水分析，以及 NRC 对 PRA
              使用、材料鉴定、抗震处理和安全重要结构的审查。换句话说，TerraPower 已经降低了第一道重大关口的风险，但还没有跑完全程。Prohibiting Russian Uranium Imports Act
              之后，法律叠加风险加重。公法文本、DOE 豁免指引和 White House 声明都显示，美国有意收窄历史上最方便的 HALEU
              退路，只保留有限豁免弹性。对一家首炉芯路径已经被俄罗斯入侵乌克兰打断的开发商而言，这让法律和监管完结与供应链执行密不可分。
