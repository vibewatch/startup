      - number: '1.3'
        title: 资本基础、合作伙伴与商业化利益相关方
        blocks:
          - type: paragraph
            body: >-
              对一家尚未产生收入的反应堆开发商而言，TerraPower 的融资画像异常强。官方公告确认，2022 年至少完成 $750 million 股权融资，2025 年 6 月又完成 $650 million
              轮融资；第三方报道也强化了一个事实：Natrium 获得的 DOE 支持以数十亿美元计。这套资本结构具有战略意义：Bill Gates 持续参与，SK 锚定早期融资，NVentures 于 2025 年加入，HD
              Hyundai 也在 TerraPower 迈向建设和供应链扩张时作为现有投资人出现。这个投资人组合让 TerraPower 不像一家风投注资的实验室公司，更像一个跨气候、重工业、造船和 AI
              相关电力需求的多部门联盟。利益相关方地图也不限于出资人。PacifiCorp 是 Wyoming 的公用事业部署伙伴，也是额外资源研究伙伴；GE Hitachi 是 Natrium 技术伙伴；DOE
              是不可或缺的成本分担赞助方；Centrus 以及其他燃料和制造伙伴则是 HALEU 与供应链叙事的核心。公开层面看，TerraPower
              已有足够支持来尝试首座电厂商业化，但披露还不足以精确承销稀释、优先权或项目融资义务。
