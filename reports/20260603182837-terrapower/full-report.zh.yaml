              TerraPower 最强的公开护城河不是单一反应堆特征，而是首座电厂周围的生态系统。DOE 成本分担、NRC 接触、PacifiCorp 机队扩张研究，以及可见的 Kemmerer
              建设时间线，加在一起构成了比多数同业披露更具体的公用事业级部署路径。话虽如此，护城河并非独占。Kairos 强调垂直整合、迭代测试和建设学习；X-energy 正在推进燃料许可、IPO 定位和工业合作；Oklo
              与 NuScale 具备公开市场可见度，这可能影响合作、招聘和战略关注。最大的共同竞争瓶颈是 HALEU 以及相关供应链就绪度。这个暴露削弱了任何“TerraPower
              只要资本更充足、政治关系更强就能赢”的说法，因为几家直接同业都在争夺重叠的燃料、监管和客户资源。只有当买方承诺走技术专属的许可、燃料和场址设计路径后，切换成本才可能变高；在此之前，多栖选择和买方比较仍是
