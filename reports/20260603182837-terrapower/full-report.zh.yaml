  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 首炉芯燃料短缺
        - Centrus、Framatome、GNF-A 和 DOE 里程碑更新
        - 任何实质证据显示商业化首炉芯供应量滑出 2030 年电厂目标
        - 除非 TerraPower 拿出等效的非俄罗斯供应路径，并说明数量、时间和监管接受度，否则投资逻辑断裂
      - - 运营许可证滑坡
        - NRC 案卷提交和 TerraPower 公开指引
        - 许可发放后仍没有清晰运营许可证申请路径，或 OL 里程碑出现可见的多季度滑坡
        - 重新评估监管时间、资本需求和客户信心假设
      - - FOAK 成本或进度超支
        - 项目里程碑报告、供应商公告和融资节奏
        - 进度明显滑出 2030 年，或在仍需要新资本时成本透明度恶化
        - 按融资压力事件处理；进一步提高确信度前，先要求完工成本和应急预算消耗情况
      - - PacifiCorp 集中度失效
        - 公用事业规划文件、联合研究更新或负面公用事业评论
        - PacifiCorp 从 Kemmerer 转让 / 所有权逻辑或后续机组规划后退
        - 投资逻辑明显转弱，因为 TerraPower 的公开客户证明仍集中在一条公用事业路径
      - - 长交期部件供应商质量失败
        - 关键系统的供应商返工、监督发现或制造滑坡
        - 核能或燃料关键路径上重复出现质量逃逸或部件交付延迟
        - 升级 QA 治理尽调，并假设更高成本和时间风险
      - - 资本充足性恶化
        - 融资活动、DOE 支持连续性和同行市场环境
        - 关键监管和燃料里程碑可信去风险前就需要新资本
        - 估值口径转向下行情景，重点计入资本强度和稀释风险
    notes: 这些触发因素设计成可通过公开资料监测，因为 TerraPower 仍为私有公司，披露的财务细节远少于上市同行。触发因素不会自动否定公司；它会迫使投资人重新做一次承销。
    claimRefs:
