      - number: '8.2'
        title: 投资逻辑和融资背景：里程碑进展真实，但不透明仍然昂贵
        blocks:
          - type: paragraph
            body: >-
              正向投资逻辑很容易讲清楚。TerraPower 比大多数私营反应堆开发商更接近商业相关性，因为它同时拥有政策支持、实体场址、公用事业关系，以及一个已经越过施工许可关口的首台套项目。PacifiCorp
              对额外机组的规划工作也重要，因为它给 TerraPower 带来比一次性示范项目更清晰的机队可选价值。但反向逻辑对估值同样重要。TerraPower 仍未披露已确认收入、现金余额、项目级利润率，或
              PacifiCorp 可选性的经济条款。燃料仍是最尖锐的价值流失点，因为公开记录已经显示 HALEU 约束会移动进度，而供应链解决方案仍取决于交易对手能否按时扩产。换句话说，TerraPower
              或许因项目成熟度高于弱同行而应享有溢价，但在披露资本结构和商业条款之前，也应相对最热的公开市场倍数打私营公司折扣；公开可比公司每个季度都会披露这些信息。
