    title: 团队 / 执行风险登记表
    columns:
      - 角色 / 职能
      - 依赖或缺口
      - 可能性
      - 严重性
      - 缓释
      - 尽调路径
    rows:
      - - 供应商质量负责人
        - 首创采购需要扎实的 Appendix B、NQA-1、审计、焊接和监督能力
        - 中
        - 高
        - TerraPower 已公开招聘资深供应商质量人员，并把监督流程规范化
        - 索取当前团队规模、开放岗位、供应商审计频次，以及最关键的未解决质量问题
      - - 出口管制与人才获取
        - 外籍员工审查可能放慢或限制技术岗位招聘
        - 中
        - 中高
        - TerraPower 披露按个案开展出口管制审查和审批流程
        - 索取平均审批时间、被卡住的岗位，以及招聘摩擦最长的国家 / 职能
      - - 项目集成与供应商管理
        - 80 多家协作者加上长交期供应商抬高协调负担
        - 中高
        - 高
        - 采购收尾、早期工程和供应商监督框架都是可见缓释
        - 索取关键路径供应商看板、催交指标和红 / 黄供应商清单
      - - Natrium 与 MCFR 之间的领导层分配
        - 公开资料显示两个项目都有实质进展，但没有披露资源拆分
        - 中
        - 中高
        - Southern 支持的 MCFR 里程碑说明伙伴能分担部分负担
        - 索取组织架构、执行层负责人，以及两个项目之间的资源分配规则
      - - 建设和运营人员爬坡
        - FOAK 场址爬坡需要大约 1,600 名峰值工人，之后还需要永久运营人员
        - 中
        - 高
        - 培训中心建设和 Wyoming 劳动力叙事已经成形
        - 索取人员计划、技工供给、培训吞吐、仿真器就绪度和留任假设
    notes: 本登记表聚焦会打断进度或质量的执行岗位，即便反应堆物理和政策支持仍在，也可能出问题。公开缓释证据真实存在，但多数是流程证据，不是结果证据。
