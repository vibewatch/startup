      - CR012
      - CR020
      - CR029
      - CR033
      - CR034
      - CR040
      - CR041
      - CR042
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 公开证据基础
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 公司质量信号强，但当前估值条款仍未披露
        - 价格和条款披露前，不投入资本
      - - 置信度
        - 中
        - 战略和项目事实真实存在，但定价事实仍缺失
        - 把本章当成承销筛选，不是公允性意见
      - - 风险评级
        - 高
        - 资本强度、燃料依赖和私有公司不透明度仍很高
        - 要求下行保护，并采用里程碑驱动的投资备忘录
      - - 估值姿态
        - Unknown
        - 公开可比公司能锚定区间，但没有公开来源披露 TerraPower 当前投后估值
        - 当前交易若高于基准区间，在证伪前都应视为偏高
      - - 仅基于公开信息的指示性基准区间
        - $6B-$9B
        - 区间介于 NuScale 当前公开市值与 Oklo 更高叙事溢价之间
        - 若进入价格明显更低，尽调后可上调为观察
      - - 实际 IC 姿态
        - 条款驱动的观察名单
        - 公司质量可投，但当前定价证据不可投
        - 只有数据室材料补足估值和完工成本缺口后，才继续推进
    notes: 本表基于截至 2026-06-03 的公开信息总结建议；它不是经谈判得出的估值意见。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV033
      - CV036
      - CV044
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 当前判断
      - 证据
      - 何种情况会改变判断
    rows:
      - - 稀缺性投资逻辑
        - 正向
        - TerraPower 已披露大额股权支持、ARDP 支持、许可和建设进展
        - 持续按期执行和干净估值条款会强化投资判断
      - - 公用事业期权价值逻辑
        - 正向，但尚未定价
        - PacifiCorp 规划包含 Utah 两座增量反应堆，以及更广泛的五机组研究工作
        - 披露经济性或确定性承诺后，期权价值才可投资
      - - 不透明反向逻辑
        - 实质负面
        - 没有公开的投后估值、清算优先权、收入、现金或利润率披露
        - 管理层披露股权结构表、价格、现金和单位经济后，可降低折价
      - - 燃料链反向逻辑
        - 实质负面
        - 项目已经因为 HALEU 未能按原时间表到位而延期一次
        - 商业化燃料数量、定价和制造就绪度得到证明后，下行空间会收窄
      - - 公开市场倍数反向逻辑
        - 实质负面
        - Oklo 的溢价倍数说明板块可以按叙事定价，但 TerraPower 不应在缺少披露时继承该溢价
        - 更低进入估值或明显更好的披露，会让溢价更有说服力
    notes: 各论点按当前对投资判断的重要性排序；本表把公司质量和价格纪律分开看。
    claimRefs:
      - CV012
      - CV013
      - CV028
      - CV031
      - CV032
      - CV038
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 指示性股权价值区间
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - 燃料或资本再次滑坡；后续公用事业需求仍停留在非合同状态；私募融资落在惩罚性条款上
        - $3B-$5B
        - 价值回落到较低公开锚点和战略期权价值底部附近
        - HALEU 延迟、融资压力、客户转化失败
        - 公开证据已包含一次真实的燃料驱动进度滑坡
      - - 基准
        - Kemmerer 继续推进；后续需求可信但尚未签约；披露小幅改善
        - $6B-$9B
        - 价值位于 NuScale 公开水平和 Oklo 更高叙事溢价之间
        - 不透明股权资本结构、完工成本不确定、燃料商业条款
        - 最符合当前公开记录
      - - 乐观
        - Kemmerer 按计划走向首次发电，燃料链去风险，增量机组规划转化为可融资部署
        - $10B-$14B
        - 相对当前上市同行的溢价变得可辩护，因为 TerraPower 同时具备稀缺性、规模和执行证明
        - 执行失误、燃料就绪延迟、下一轮定价过高
        - 需要多个公开记录尚未证明的里程碑
    notes: 情景区间是仅基于公开信息的指示性股权代理，不是模型推导的公允价值；设置区间是为了在私有公司输入缺失时守住价格纪律。
    claimRefs:
