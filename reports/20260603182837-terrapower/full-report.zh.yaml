  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              界定 TerraPower 市场，最站得住脚的方式不是“所有清洁能源”，甚至也不是“所有核能”，而是更窄的一组需求池：可调度无碳电力或高温工艺热在这些场景里格外值钱。World Nuclear
              Association 材料把 SMR 定义为通常约 300 MWe 或以下的模块化反应堆，同时也承认更宽泛的中型口径可到 600 MWe。这一点重要，因为 Natrium 345 MWe
              的基准额定功率略高于经典小型反应堆简称，但在商业上仍与同一批先进反应堆竞争：公用事业公司、政府和工业买方都在评估模块化核能选项。因此，纳入的市场包括煤电替代和电网容量投资、工业蒸汽与热用途、可再生能源占比较高系统中的灵活清洁容量，以及一批不断增长、靠近数据中心的可靠电力买方。排除的市场同样重要：TerraPower
              目前并不以纯前期资本开支逻辑切入屋顶光伏、短时储能或大宗尖峰燃气轮机。它可信的替代品是联合循环燃气、大型轻水堆、其他先进反应堆平台，以及监管允许时对煤电或燃气资产做现状延寿。
