      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据并不均衡，但仍有用。Chris Levesque 是当前公司在融资、合作和项目里程碑公告中的运营面孔；Bill Gates 仍是最能代表 TerraPower
              信誉和长期资本支持的创始人兼董事长。官方 About 页面还强调创始人 John Gilleland 延续的技术角色，并列出 Kristine Svinicki、Ralph Izzo 等 TerraPower
              董事，二者带来核政策或公用事业规模治理经验。因此，TerraPower 的董事会质量强于典型依赖创始人的气候科技初创公司，但公开记录仍显示关键人物集中度不低。Gates 仍是最知名的战略支持者，Levesque
              是商业化叙事核心，而 Natrium 项目仍处早期，执行可信度高度依赖一小组能同时协调资本、监管、工程和州级政治的领导者。本章证据没有给出完整披露的股权结构表、完整董事名单，也没有按投资人类别披露详细治理权利。
