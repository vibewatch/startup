    {
      "id": "buyers-and-drivers",
      "title": "Buyers, budget owners, and demand drivers",
      "body": "The buyer map is broader than “utilities.” Utilities remain the most concrete near-term buyer because they own integrated resource plans, coal-retirement decisions, interconnection rights, and long-lived regulated capital budgets. But the end-user logic is expanding. TerraPower’s own Natrium materials emphasize flexible output in renewable-rich grids, while MCFR materials and DOE articles explicitly point toward industrial heat, refineries, chemical processors, water treatment, and other high-energy-consumption sectors. Peer materials reinforce that this is not a TerraPower-only framing: X-energy markets heavy-industry steam and data-center-ready reliability, Kairos links commercialization to Google-backed clean-power demand, and NuScale markets coal replacement, AI loads, hydrogen, process heat, and desalination. Data Center Dynamics and NucNet both framed TerraPower’s 2025 financing against AI-driven electricity demand, suggesting that hyperscaler load growth is already influencing capital formation around advanced nuclear. In practice, the budget owner varies by segment: utility resource planners, independent power sponsors, industrial decarbonization teams, sovereign energy programs, and eventually large power buyers using PPAs or structured project-finance vehicles.",
