    {
      "id": "sizing-lenses",
      "title": "Evidence-constrained sizing lenses",
      "body": "Public evidence does not support a clean, TerraPower-specific global TAM in dollars, so this chapter sizes the market using capacity and deployment lenses instead. The global backdrop remains large: IEA says nuclear capacity in operation stayed at 420 GW at the end of 2025 and 78 GW was under construction in 15 countries, even though almost all of that pipeline is still large reactor capacity rather than SMRs. For TerraPower specifically, the most concrete serviceable market signal comes from public partner-backed megawatts. One Natrium unit delivers 345 MWe at base and up to 500 MWe at peak. PacifiCorp’s 2023 IRP selected two additional Natrium systems, implying 1,500 MW across three total reactors when measured at peak output. If the first Kemmerer unit plus the five additional Natrium units studied by PacifiCorp were all pursued, the visible partner-backed opportunity would equal about 2,070 MW of base capacity and up to 3,000 MW of peak capacity. That does not equal TAM, but it is a supportable near-term SAM lens grounded in named counterparties rather than generic market decks.",
