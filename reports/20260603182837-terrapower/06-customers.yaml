schemaVersion: report-v2
artifact: customers
slug: terrapower
runDate: '2026-06-03'
company:
  name: TerraPower
chapter:
  number: 6
  title: Customers
  summary: >
    TerraPower's public customer base is still concentrated around one utility-led commercialization path:
    PacifiCorp and its Rocky Mountain Power division around the Kemmerer Natrium project. Everything
    else in the reviewed record is weaker proof of future demand rather than present production revenue:
    DOE is a demonstration sponsor, Southern Company is an MCFR development partner, ENEC and
    Gyeongsangnam-do are MOU-stage strategic counterparts, and AI-linked load growth is a market
    tailwind without a named TerraPower hyperscaler customer.
sections:
  - id: customer-base-segmentation
    title: Customer base segmentation and what counts as customer proof
    body: |
      TerraPower's public customer surface is real, but it is not broad in the way a mature software or equipment vendor's customer roster would be. The only named counterparty that clearly behaves like a prospective buyer, owner, or utility off-taker is PacifiCorp, operating through Rocky Mountain Power around the Kemmerer Natrium project and additional Natrium planning in its resource mix. Around that anchor sits a second layer of public-sector or strategic actors that matter commercially without being equivalent to revenue customers: DOE is the demonstration sponsor that de-risks first-of-a-kind deployment, Southern Company is a utility and R&D partner on the separate MCFR line, and ENEC plus Gyeongsangnam-do represent international deployment and supply-chain interest rather than signed Natrium orders. A final layer is pure end-market demand narrative: TerraPower is increasingly discussed in AI-power and data-center coverage, but no reviewed public source names a hyperscaler, industrial heat buyer, or other end user actually purchasing TerraPower output today. For underwriting, that means this chapter must separate utility planning proof, pilot and demonstration partners, strategic market-development counterparts, and unconverted demand narrative instead of treating every logo as an active customer.
    claimRefs:
      - CU001
      - CU005
      - CU007
      - CU008
      - CU010
      - CU012
      - CU013
      - CU015
      - CU022
      - CU023
      - CU037
      - CU039
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: named-deployment-proof
    title: Named deployment proof is strongest with PacifiCorp and still pre-commercial elsewhere
    body: |
      PacifiCorp is the clearest public proof that TerraPower has crossed from abstract advanced-reactor marketing into a utility-led commercialization path. TerraPower's own 2023 release says PacifiCorp's integrated resource plan selected two additional Natrium units by 2033, while PacifiCorp's customer-facing news release frames Natrium as a potential reliable power source for PacifiCorp customers and explicitly describes the joint study for up to five additional reactors. That customer-side language is materially stronger than a startup-only press release because it shows the utility itself is willing to describe Natrium as part of future service to ratepayers. However, even the best proof remains pre-operation proof. The Kemmerer demonstration is under construction and independently corroborated by WyoFile, SVI News, POWER, and NRC-milestone reporting, but there is still no public evidence of delivered electricity, plant transfer economics, or commercial performance. Outside PacifiCorp, the proof weakens further. ENEC is an exploration MOU, Gyeongsangnam-do is a supply-chain agreement, and Southern Company's MCFR work is a technology and future-market partnership for industrial and marine-adjacent applications rather than a Natrium plant order. TerraPower therefore has named counterparties, but only one named utility path that currently resembles underwritable customer adoption.
    claimRefs:
      - CU001
      - CU002
      - CU003
