  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-counterparty-completeness
      missingEvidence: A full current list of TerraPower commercialization counterparties split by utility customer, sponsor, partner, and international development lead.
      whyItMatters: Public proof is currently dominated by a few visible logos, so investors cannot tell whether TerraPower has genuine breadth or only a narrow set of showcase relationships.
      diligencePath: Request management's live CRM-style customer and partner pipeline with stage labels, commercial owner, expected decision date, and whether each entry is utility, corporate offtake, industrial heat, or supply-chain support.
      relatedQuestionRefs:
        - QU002
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: retention-and-renewal-data
      missingEvidence: Contract duration, renewal structure, repeat-order status, and customer-quality metrics such as NRR, churn, and satisfaction.
      whyItMatters: Without retention and renewal data, TerraPower's current customer proof can only establish adoption intent, not durable commercialization economics.
      diligencePath: Request executed term sheets, PPA or ownership-transfer framework, renewal milestones, and any existing customer reference calls or satisfaction tracking for PacifiCorp and other named counterparties.
      relatedQuestionRefs:
        - QU010
        - QU022
        - QU025
    - type: missing-source
      severity: material
      topic: concentration-and-pricing
      missingEvidence: Public disclosure or private diligence evidence on top-customer exposure, pricing, transfer economics, and who pays TerraPower across build, transfer, and operation.
      whyItMatters: The public record suggests high concentration on PacifiCorp, but no denominator exists to tell whether that concentration is temporary or structural.
      diligencePath: Request commercialization waterfall by counterparty, expected revenue timing, transfer mechanics for Kemmerer, and concentration analysis for the top five counterparties.
      relatedQuestionRefs:
        - QU011
        - QU012
    - type: missing-source
      severity: material
      topic: named-corporate-offtakers
      missingEvidence: A named hyperscaler, data-center operator, industrial heat buyer, or other corporate offtaker directly tied to TerraPower output.
      whyItMatters: AI demand is becoming the sector's strongest new customer signal, and TerraPower could be disadvantaged in perception if peers can show named corporate buyers while TerraPower cannot.
      diligencePath: Request NDA-safe disclosure of active corporate offtake discussions, stage counts, and whether any commercial structure resembles a PPA, capacity reservation, or joint-development agreement.
      relatedQuestionRefs:
        - QU013
        - QU014
        - QU023
    - type: stale
      severity: material
      topic: fuel-and-schedule-durability
      missingEvidence: Updated public schedule, first-core fuel plan, and customer communications reflecting post-HALEU-delay confidence.
      whyItMatters: Fuel-driven schedule movement can test customer patience and make repeat-unit planning look less durable than headline announcements imply.
      diligencePath: Request latest integrated schedule, first-core supply plan, and any counterparty-facing schedule revisions shared with PacifiCorp or other named commercialization counterparts.
      relatedQuestionRefs:
        - QU017
