  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - milestone
      - date / horizon
      - public signal
      - what it proves
      - limitation
    rows:
      - - ARDP selection
        - '2020'
        - DOE chose Natrium as a flagship advanced-reactor demonstration
        - Natrium entered a sponsored commercialization pathway rather than remaining a paper concept
        - Sponsor backing is not the same as a recurring customer base
      - - Joint study for up to five more Natrium units
        - 2022-2035 horizon
        - PacifiCorp and TerraPower announced a study for additional reactors in PacifiCorp territory
        - Utility customer interest expanded beyond one demo site
        - Study language stops short of binding orders or final sites
      - - PacifiCorp IRP selects two additional units
        - '2023'
        - TerraPower said the IRP included three total Natrium reactors / 1,500 MW advanced nuclear
        - Repeat-order logic entered formal resource planning
        - IRP selection is still planning evidence, not commercial operation
      - - International MOUs broaden surface area
        - 2023-2024
        - ENEC and Gyeongsangnam-do agreements added export and supply-chain pathways
        - TerraPower can show demand interest outside Wyoming
        - Neither agreement discloses a purchase commitment
      - - Kemmerer permitting and construction path
        - 2024-2026
        - State permit, groundbreaking, NRC permit, and construction start milestones accumulated
        - Customer adoption is progressing from siting into execution
        - No electricity has yet been delivered to end users
      - - AI-linked demand backdrop
        - 2025-2026
        - Fundraise coverage tied TerraPower and peers to AI-related power demand growth
        - End-market appetite for firm clean power is improving
        - TerraPower still lacks a named data-center customer in the reviewed public pack
    notes: Milestones are adoption proxies, not reported customer metrics. They show movement from demonstration selection toward commercial execution, while still leaving customer count and revenue durability undisclosed.
