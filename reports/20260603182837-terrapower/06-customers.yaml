  - id: TU003
    title: Named customer proof table
    columns:
      - counterparty
      - segment
      - deployment / use case
      - production vs pilot
      - strongest public outcome
      - limitation
    rows:
      - - PacifiCorp / Rocky Mountain Power
        - Regulated utility / anchor counterparty
        - Kemmerer Natrium deployment near retiring Naughton coal plant
        - Commercial demonstration under construction
        - Customer-side statements describe reliable power for PacifiCorp customers and repeat-unit study
        - No public transfer, tariff, or plant-ownership economics disclosed
      - - PacifiCorp additional Natrium units
        - Regulated utility expansion path
        - Two additional Natrium units in 2023 IRP and broader study for up to five by 2035
        - Utility planning / pre-procurement
        - Shows land-and-expand logic rather than a single-site demo only
        - Final sites, approvals, and commercial commitments remain open
      - - ENEC
        - International nuclear operator / deployment counterparty
        - MOU to explore commercialization and global deployment of Natrium
        - Strategic deployment exploration
        - Adds state-backed nuclear operator interest outside the U.S.
        - Non-binding MOU with no plant count, site, or economics
      - - Gyeongsangnam-do Province
        - Supply-chain and industrial ecosystem partner
        - Agreement to evaluate manufacturing and nuclear-component capabilities
        - Strategic industrial partnership
        - Broadens TerraPower's commercialization ecosystem in Korea
        - Not evidence of reactor purchase or electricity demand
      - - Southern Company
        - Utility / R&D partner on MCFR
        - IET and MCFR development for industrial and marine-adjacent applications
        - Pilot / demonstration partner
        - Demonstrates utility-backed development interest beyond Natrium
        - Separate reactor line and no paying MCFR customer named
      - - DOE / ARDP
        - Public-sector commercialization sponsor
        - Cost-shared path for first Natrium plant and MCFR-related development support
        - Demonstration sponsor
        - Makes first-customer adoption financially and institutionally more credible
        - Sponsor proof does not substitute for recurring customer revenue
    notes: This is a partial enumeration of named public counterparties reviewed through 2026-06-03. It mixes direct utility customer proof with sponsor and partner proof because TerraPower has not yet publicly disclosed a broader roster of paying reactor customers.
