  - id: durability-concentration-and-open-gaps
    title: Durability and concentration remain the main underwriting gap
    body: |
      The central diligence problem is not whether TerraPower has meaningful counterparties; it is whether public evidence is strong enough to underwrite durable, diversified customer economics. No reviewed source discloses NRR, GRR, churn, contract length, renewal cadence, customer satisfaction, or top-customer revenue concentration. That matters because today's public record is heavily concentrated around PacifiCorp. If PacifiCorp slows, reprioritizes, or changes resource-planning assumptions, TerraPower's publicly visible utility customer story would thin dramatically. The broader sector record shows this is not a theoretical risk. NuScale's CFPP was terminated because subscription levels were insufficient, and CATF explicitly argues that utilities are often poor first movers for FOAK advanced reactors unless commercial structure and risk-sharing are unusually strong. TerraPower does have better ingredients than CFPP had: DOE cost share, a coal-site repowering narrative, and a larger vertically integrated utility partner. But TerraPower also still carries a visible HALEU and schedule dependency, and its international MOUs remain non-binding. The correct conclusion is therefore not that customer durability is weak, but that customer durability is still largely unmeasured in public. Public proof is good enough to support a serious utility-led commercialization story; it is not yet good enough to clear concentration and retention risk.
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU032
      - CU033
      - CU034
      - CU035
      - CU040
