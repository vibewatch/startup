  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - driver / risk
      - current evidence
      - impact
      - mitigant
      - diligence path
    rows:
      - - PacifiCorp concentration
        - PacifiCorp is the only named utility path with site-specific operational intent
        - High concentration risk in the visible customer base
        - Additional-unit study and international interest create optionality
        - Request top-customer exposure and commercialization plan by segment
      - - DOE / policy dependence
        - ARDP cost share remains central to first-unit economics and execution credibility
        - Sponsor dependence can distort what counts as customer traction
        - Federal support helps absorb FOAK risk
        - Request cost-share schedule and commercialization assumptions without incremental subsidy
      - - HALEU and schedule risk
        - NEI reported fuel delays could push timing while TerraPower still framed expansion with PacifiCorp
        - Delays can weaken customer patience and procurement confidence
        - Multiple fuel-supply workstreams are being pursued
        - Request updated first-core fuel plan and contingency schedule with customers
      - - International MOU non-binding risk
        - ENEC and Gyeongsangnam-do broaden proof but remain exploratory or supply-chain oriented
        - International breadth may overstate booked demand
        - They still help validate export relevance and manufacturing scale
        - Request signed follow-on work packages, site studies, or commercial option terms
      - - Data-center off-take gap
        - AI power demand is rising fast, but no reviewed source names a TerraPower hyperscaler buyer
        - TerraPower may lose narrative ground to peers with named corporate PPAs
        - Strong utility path could still support future corporate demand indirectly
        - Request named pipeline, NDA-safe funnel counts, and data-center commercial structure
      - - MCFR customer-path separation
        - Southern proof helps the innovation branch but does not deepen Natrium utility diversification
        - Product-line complexity can obscure which customer path is monetizing first
        - MCFR could eventually open industrial and marine markets
        - Request product-level commercialization plans and counterparty ownership by reactor line
    notes: Risk levels describe public-proof concentration and commercial-structure uncertainty, not a conclusion that counterparties are weak. The main public problem is denominator opacity rather than evidence of customer churn.
    claimRefs:
      - CU028
      - CU029
      - CU033
      - CU034
      - CU035
      - CU040
  - id: TU006
    title: Peer benchmark for customer-proof durability
    columns:
      - program
      - named buyer / counterparty
      - public commercial structure
      - maturity
      - implication for TerraPower
    rows:
      - - TerraPower Natrium
        - PacifiCorp / Rocky Mountain Power
        - Utility planning, construction path, and possible future plant transfer
        - Strong utility proof but still pre-operation
        - Best current TerraPower proof; still missing economics and retention data
      - - TerraPower international expansion
        - ENEC and Gyeongsangnam-do
        - Strategic MOUs for deployment exploration and supply chain
        - Early-stage
        - Broadens demand narrative but should not be counted as booked customers
      - - TerraPower MCFR
        - Southern Company and CORE POWER ecosystem
        - Pilot / demonstration partnership
        - Early-stage technical validation
        - Useful for future industrial markets, not near-term customer diversification
      - - Kairos fleet pathway
        - Google
        - Multi-plant development agreement with PPAs plus Hermes 2 first delivery path
        - Stronger named corporate off-take proof
        - Highlights what TerraPower lacks in public hyperscaler naming
      - - NuScale CFPP
        - UAMPS member utilities
        - Subscription-based FOAK utility project that was terminated
        - Negative durability case
        - Shows why TerraPower's PacifiCorp path still needs close scrutiny on commitment strength
    notes: This benchmark is not a competitor scorecard. It is a proof-quality comparison showing where TerraPower's public customer evidence is stronger than generic demand narrative yet weaker than a named multi-plant corporate PPA pathway.
    claimRefs:
      - CU024
      - CU025
      - CU026
      - CU028
      - CU036
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: TerraPower's current customer journey runs from utility need identification through sponsor-backed development, regulatory derisking, and only then toward commercial operation and fleet expansion.
    data:
      items:
        - stage: grid need and counterparty screening
          label: Grid need and counterparty screening
          actors:
            - Utility planner
            - State / community host
            - TerraPower business development
          touchpoints:
            - Coal-retirement site screen
            - Reliability need
            - Decarbonization target
          emotion: Interest is highest where a utility needs firm clean capacity and already controls retiring thermal assets.
        - stage: sponsor-backed feasibility
          label: Sponsor-backed feasibility
          actors:
            - DOE
            - TerraPower
            - Utility counterpart
          touchpoints:
            - ARDP selection
            - Siting studies
            - Cost-share structure
          emotion: FOAK risk becomes tolerable only when public sponsorship and utility participation move together.
        - stage: resource planning and siting
          label: Resource planning and siting
          actors:
            - PacifiCorp / Rocky Mountain Power
            - Regulators
            - Local communities
          touchpoints:
            - IRP modeling
            - Joint study
            - Site evaluation
          emotion: The customer relationship deepens only after the utility is willing to embed the technology in planning documents.
        - stage: construction and ecosystem buildout
          label: Construction and ecosystem buildout
          actors:
            - EPC and suppliers
            - Training and workforce system
            - Customer-side utility teams
          touchpoints:
            - NRC permit
            - State permit
            - Training center
            - Support facilities
          emotion: Trust shifts from slideware to execution once permits, concrete, and workforce commitments are visible.
        - stage: commercial operation and fleet expansion
          label: Commercial operation and fleet expansion
          actors:
            - Operating utility
            - Ratepayers / end users
            - Future buyers
          touchpoints:
            - First power
            - Performance proof
            - Follow-on unit commitments
          emotion: This is the phase TerraPower has not reached publicly yet, which is why repeat-customer durability remains unproven.
    claimRefs:
      - CU007
      - CU013
      - CU018
      - CU038
