tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - segment
      - buyer / user / payer
      - public proof surface
      - current status
      - strategic value
      - main gap
    rows:
      - - PacifiCorp / Rocky Mountain Power
        - Regulated utility planner, prospective owner/off-taker, and ratepayer-serving user
        - Kemmerer project, joint study, and IRP inclusion for additional Natrium units
        - Strongest named utility customer proof
        - Anchors first commercial deployment and repeat-site logic
        - No public pricing, transfer, or renewal economics
      - - DOE / ARDP
        - Public-sector sponsor and cost-share enabler rather than power buyer
        - ARDP award and DOE commercialization pathway
        - Demonstration sponsor
        - De-risks first-unit financing and execution
        - Does not prove recurring demand from end customers
      - - ENEC
        - International nuclear operator and potential deployment counterparty
        - COP28 MOU to explore commercialization and global deployment
        - Strategic market-development proof
        - Extends TerraPower into state-backed export and deployment discussions
        - Non-binding and no plant count, pricing, or site commitment disclosed
      - - Gyeongsangnam-do Province
        - Regional manufacturing and supply-chain counterpart
        - Strategic agreement to evaluate nuclear equipment capabilities
        - Supply-chain partner proof
        - Supports scale and future deployment readiness
        - Not a reactor purchaser or electricity off-taker
      - - Southern Company / MCFR program
        - Utility and R&D partner on industrial-heat-adjacent MCFR pathway
        - IET installation and salt-operations milestones
        - Pilot / demonstration partner proof
        - Opens future heavy-industry and marine-adjacent demand narrative
        - Separate product line from Natrium and no paying customer named
      - - AI / data-center and industrial-load buyers
        - Prospective end-market demand rather than named TerraPower accounts
        - AI-driven fundraise coverage and sector-wide nuclear procurement signals
        - Market tailwind only
        - Could support future land-and-expand outside regulated utility demand
        - No reviewed source names a TerraPower hyperscaler or industrial offtaker
    notes: This table separates true customer proof from sponsor, pilot-partner, and market-demand evidence because TerraPower remains pre-commercial on reactor operations and the logos do not all represent the same commercial relationship.
