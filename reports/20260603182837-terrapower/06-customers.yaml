  - id: TU004
    title: Retention / repeat usage / satisfaction table
    columns:
      - metric / signal
      - public value / status
      - segment
      - confidence
      - diligence ask
    rows:
      - - NRR / GRR / churn
        - Not publicly disclosed
        - All TerraPower counterparties
        - High that disclosure is absent
        - Request customer cohort retention, renewal, and churn by counterparty class
      - - Contract length and renewal schedule
        - Not publicly disclosed
        - PacifiCorp anchor relationship
        - High that disclosure is absent
        - Request PPA, ownership-transfer, or service-contract term sheet for Kemmerer
      - - Repeat-order evidence
        - Two additional Natrium units appear in PacifiCorp IRP, but no executed repeat order is public
        - Utility expansion path
        - Medium
        - Request board-approved commitment status and gating milestones for follow-on units
      - - Satisfaction / SLA / reference quality
        - No public customer reference metrics or operating-performance surveys found
        - All named counterparties
        - High that disclosure is absent
        - Request formal customer references, NPS-style feedback, and performance guarantees
      - - Workforce and community stickiness
        - Worker-transfer promises and training-center buildout support local adoption, not revenue retention
        - Kemmerer site ecosystem
        - Medium
        - Request accepted-offer rates, training throughput, and turnover targets
    notes: Null-style rows here represent missing public disclosure rather than zero performance. The table distinguishes repeat-order signals from true retention metrics because TerraPower does not yet operate reactors for paying end customers.
    claimRefs:
