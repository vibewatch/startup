evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: Current post-money valuation, liquidation preferences, and any 2025-round structure details.
    whyItMatters: >-
      Without pricing and preference data, it is impossible to assess whether TerraPower's quality is already fully
      priced into private-market terms.
    diligencePath: Request the 2025 financing deck, cap table, term sheet summary, and any board materials approving the round.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capital-structure-gap
    missingEvidence: Full cap table, debt facilities, secondaries, and investor governance rights.
    whyItMatters: These items determine dilution risk, control dynamics, and downside protection for any new investor.
    diligencePath: Obtain the capitalization table, stockholder rights agreements, debt schedules, and any side-letter summary.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: headcount-gap
    missingEvidence: A verified current employee count and official office-footprint disclosure.
    whyItMatters: Scale of staffing is a key signal for execution readiness, fixed-cost burden, and organizational depth.
    diligencePath: >-
      Request the latest org/headcount report or confirm current employee count through management and payroll/HR
      documentation.
    relatedQuestionRefs:
      - QO019
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: doe-support
    missingEvidence: Exact DOE ARDP milestone-payment history, reimbursement cadence, and remaining conditions.
    whyItMatters: Cash timing and milestone risk directly affect capital adequacy for a first-of-a-kind reactor project.
    diligencePath: >-
      Request the DOE project agreement, milestone schedule, and internal cash-flow forecast tied to ARDP
      reimbursements.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: governance
    missingEvidence: A complete and current board roster with committee structure and investor nomination rights.
    whyItMatters: Governance quality is central to judging founder dependence and how strategic investors influence key decisions.
    diligencePath: Request the current board deck, governance guidelines, and stockholder-rights summary.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: milestone-chronology-gap
    missingEvidence: Private board, financing, and contracting milestones that do not appear in public chronology.
    whyItMatters: >-
      The public milestone table is useful but incomplete for understanding exactly how financing and engineering
      decisions sequenced internally.
    diligencePath: >-
      Request the internal project chronology covering board approvals, EPC milestones, financing closes, and DOE
      reimbursement gates.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: tAM-dollar-gap
    missingEvidence: >-
      A supportable TerraPower-specific TAM in dollars based on disclosed buyer economics rather than generic sector
      forecasts.
    whyItMatters: Without a company-specific revenue TAM, valuation and penetration assumptions become too easy to overstate.
    diligencePath: >-
      Build a bottoms-up model from named utility, industrial, and sovereign opportunities with MW-to-revenue
      assumptions validated by management.
    relatedQuestionRefs:
      - QM018
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Target LCOE, modeled tariff ranges, or expected PPA pricing for first and nth-of-a-kind Natrium plants.
    whyItMatters: >-
      Pricing determines whether the market is only strategically interesting or also economically competitive against
      alternatives.
    diligencePath: >-
      Request internal economics models, customer proposals, and sensitivity analyses by site type and financing
      structure.
    relatedQuestionRefs:
      - QM019
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: hyperscaler-demand-gap
    missingEvidence: Named TerraPower-specific hyperscaler offtakes or public letters of intent for power purchases.
    whyItMatters: >-
      AI demand is a useful narrative tailwind, but market confidence improves materially if TerraPower itself has
      signed demand-side proof.
    diligencePath: >-
      Ask management for signed PPAs, MOUs, or structured procurement discussions with hyperscalers or data-center
      developers.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: utility-pipeline-gap
    missingEvidence: A utility procurement pipeline beyond PacifiCorp with named stages, counterparties, and timing.
    whyItMatters: One utility relationship is helpful but does not by itself prove broad market acceptance.
    diligencePath: Request the current pipeline by utility, geography, status, and next milestone.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: contradictory-sizing-paths
    missingEvidence: Consistent public TAM/SAM/SOM definitions across the advanced-reactor market.
    whyItMatters: >-
      Different sources mix global nuclear context, design counts, and MW pipelines, which can create false
      comparability if merged carelessly.
    diligencePath: >-
      Preserve capacity-based and demand-driver lenses separately until management provides a standard market-definition
      framework.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: peer-pricing
    missingEvidence: >-
      Comparable public delivered-cost, EPC, or PPA economics across TerraPower, X-energy, Kairos, Oklo, NuScale, and
      Terrestrial Energy.
    whyItMatters: >-
      Without comparable economics, competitive ranking remains architecture- and readiness-heavy rather than truly
      underwriting buyer value.
    diligencePath: >-
      Request project-level cost decks, PPA term sheets, or management guidance that normalizes capex, fuel, and
      dispatch assumptions across peers.
    relatedQuestionRefs:
      - QP016
      - QP023
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: order-book-quality
    missingEvidence: >-
      Backlog conversion, reservation quality, subscription durability, and customer-commitment detail across TerraPower
      and peers.
    whyItMatters: >-
      Competitive moat depends on who can turn announcements into bankable repeat orders, not just who can generate
      headlines.
    diligencePath: >-
      Ask for order-book aging, contract stage definitions, cancellation rights, and conversion history by customer and
      project.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: terrestrial-underwriting
    missingEvidence: Current financing scale, named counterparties, milestone schedule, and deployment pipeline for Terrestrial Energy.
    whyItMatters: >-
      Terrestrial Energy is visible enough to remain in the landscape, but too opaque to score accurately as a direct
      threat without more evidence.
    diligencePath: >-
      Fetch current investor, project, and regulatory materials or request a direct company briefing with milestone
      documentation.
    relatedQuestionRefs:
      - QP022
  - type: missing-source
    severity: material
    topic: hyperscaler-contract-economics
    missingEvidence: >-
      Economic terms behind Google-Kairos, Amazon-linked X-energy announcements, and PacifiCorp-TerraPower follow-on
      deployment.
    whyItMatters: >-
      The strategic narrative around AI load and utility adoption can only be underwritten if real pricing, duration,
      and risk allocation terms are known.
    diligencePath: >-
      Obtain offtake summaries, contract structures, minimum-delivery obligations, and milestone-based payment mechanics
      from counterparties or filings.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: revenue-streams-completeness
    missingEvidence: >-
      Signed deployment contracts showing how TerraPower monetizes reactor delivery, engineering, and follow-on fleet
      work.
    whyItMatters: >-
      Without executed commercial terms, the revenue-stream table can only describe pathways, not revenue quality or
      recognition timing.
    diligencePath: Request customer agreements, milestone schedules, and revenue-recognition memo from TerraPower.
    relatedQuestionRefs:
      - QI001
      - QI024
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: Exact reactor price, PPA or tariff economics, technology-license fees, and fuel pricing for Natrium pathways.
    whyItMatters: Pricing opacity prevents any serious test of margin, customer payback, or competitive economics.
    diligencePath: Obtain pricing schedules, project term sheets, and internal LCOE / customer-savings model.
    relatedQuestionRefs:
      - QI002
      - QI006
      - QI024
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics-model
    missingEvidence: Project-level LCOE, fuel cost assumptions, EPC split, gross margin bridge, and owner-versus-vendor economics.
    whyItMatters: These inputs determine whether Natrium is commercially attractive or merely strategically interesting.
    diligencePath: Request the current Kemmerer financial model and sensitivity cases for fuel, schedule, and capital cost.
    relatedQuestionRefs:
      - QI017
      - QI020
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy-runway
    missingEvidence: Current cash balance, monthly burn, restricted cash, debt terms, and financing triggers after the 2025 raise.
    whyItMatters: Without current liquidity data, investors cannot judge runway, dilution timing, or going-concern risk.
    diligencePath: Request latest monthly management accounts, treasury schedule, and source-and-use waterfall approved by the board.
    relatedQuestionRefs:
      - QI021
      - QI025
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: underwriting-package
    missingEvidence: >-
      A complete diligence package tying backlog, pricing, unit economics, and capital allocation into a single
      underwritable model.
    whyItMatters: The public record is rich enough for narrative diligence but not for final underwriting or downside-case modeling.
    diligencePath: >-
      Require data-room access to contracts, project budgets, fuel agreements, and management forecasts before
      investment committee review.
    relatedQuestionRefs:
      - QI024
      - QI025
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: digital-controls-transparency
    missingEvidence: >-
      A public or diligence-room architecture package naming control-system vendors, OT cyber boundaries, software
      stack, and how reactor and storage controls are partitioned.
    whyItMatters: >-
      The public product story is strong on reactor hardware but weak on control and cybersecurity details that matter
      for plant safety, grid integration, and execution risk.
    diligencePath: >-
      Request system architecture documents, cyber assurance materials, control-vendor disclosures, and any
      regulator-facing digital or OT design summaries.
    relatedQuestionRefs:
      - QE023
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: commercial-operating-metrics
    missingEvidence: >-
      Plant-level EPC budget, expected O&M profile, outage assumptions, target availability, and any internally modeled
      delivered-cost ranges for Kemmerer.
    whyItMatters: >-
      Without cost and uptime detail, the investment case still relies on milestone progress and partner announcements
      rather than on commercial performance underwriting.
    diligencePath: >-
      Request internal project economics, operations assumptions, reliability targets, and sensitivity analyses for
      construction, fuel, and storage performance.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE005
  - type: missing-source
    severity: material
    topic: haleu-chain
    missingEvidence: >-
      Binding public volume, timing, pricing, and contingency commitments across enrichment, metallization, and fuel
      fabrication for first-core and follow-on Natrium units.
    whyItMatters: >-
      The chapter can identify each HALEU step, but cannot verify that the full chain clears first-plant and fleet
      timelines under commercial terms.
    diligencePath: >-
      Request executed offtake, tolling, or supply agreements plus milestone schedules and fallback plans across
      Centrus, Framatome, GNF, and DOE support mechanisms.
    relatedQuestionRefs:
      - QE009
      - QE021
    relatedTableRefs:
      - TE001
      - TE005
  - type: missing-source
    severity: minor
    topic: mcfr-maturity
    missingEvidence: >-
      A clearer public MCFR commercialization package covering target customer, site pathway, licensing sequence, and
      economics beyond IET and MCRE milestones.
    whyItMatters: >-
      MCFR expands TerraPower’s optionality into industrial heat, but the current public record is still better at
      proving technical experimentation than near-term productization.
    diligencePath: >-
      Request MCFR program roadmap, target-customer materials, commercialization milestones, and any regulator-facing
      submission calendar beyond planned pre-application contact.
    relatedQuestionRefs:
      - QE026
    relatedTableRefs:
      - TE001
      - TE005
  - type: enumeration-incomplete
    severity: material
    topic: named-counterparty-completeness
    missingEvidence: >-
      A full current list of TerraPower commercialization counterparties split by utility customer, sponsor, partner,
      and international development lead.
    whyItMatters: >-
      Public proof is currently dominated by a few visible logos, so investors cannot tell whether TerraPower has
      genuine breadth or only a narrow set of showcase relationships.
    diligencePath: >-
      Request management's live CRM-style customer and partner pipeline with stage labels, commercial owner, expected
      decision date, and whether each entry is utility, corporate offtake, industrial heat, or supply-chain support.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal-data
    missingEvidence: >-
      Contract duration, renewal structure, repeat-order status, and customer-quality metrics such as NRR, churn, and
      satisfaction.
    whyItMatters: >-
      Without retention and renewal data, TerraPower's current customer proof can only establish adoption intent, not
      durable commercialization economics.
    diligencePath: >-
      Request executed term sheets, PPA or ownership-transfer framework, renewal milestones, and any existing customer
      reference calls or satisfaction tracking for PacifiCorp and other named counterparties.
    relatedQuestionRefs:
      - QU010
      - QU022
