- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - TerraPower (public-only proxy)
    - Private advanced-nuclear developer
    - Current post-money undisclosed; base public-only band $6B-$9B
    - Subject company has the strongest private project-proof profile in this pack
    - No public cap-table, cash, or pricing disclosure
  - - Oklo
    - Public advanced-nuclear developer
    - $11.52B market cap in June 2026; TTM revenue N/A on CompaniesMarketCap
    - Best evidence for current sector narrative premium around AI power and strategic scarcity
    - Pre-commercial profile and public-market momentum may overstate fair private value
  - - NuScale
    - Public advanced-nuclear developer
    - $4.33B market cap in June 2026; $31.47M TTM revenue on CompaniesMarketCap
    - Useful lower anchor because NuScale discloses revenue, cash, and losses
    - CFPP termination and business-model differences complicate direct read-through
  - - Centrus
    - Public HALEU supplier / fuel-chain benchmark
    - Profitable fuel-supply business with DOE-backed HALEU work; not a reactor-developer multiple
    - Shows the fuel chain is financed and regulated differently from reactor equity
    - Different business model means it is a contextual reference, not a valuation comp
  notes: The comp set mixes direct public reactor developers with one fuel-chain contextual benchmark because TerraPower's value is constrained by both reactor execution and fuel availability.
