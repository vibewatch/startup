  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-valuation
    missingEvidence: Current share price, post-money valuation, recent secondary marks, and any internal valuation memo for the latest financing.
    whyItMatters: Without the actual entry price, the chapter can only provide a proxy range and cannot test whether the deal is fair or stretched.
    diligencePath: Request the latest financing deck, subscription documents, board valuation materials, and any recent 409A or secondary reference points.
    relatedQuestionRefs:
    - QV002
    - QV024
    - QV028
    relatedTableRefs:
    - TV001
    - TV006
  - type: missing-source
    severity: blocking
    topic: cost-to-complete
    missingEvidence: Updated Kemmerer cost-to-complete, contingency, DOE draw schedule, and non-federal sources of funds by year.
    whyItMatters: The bear and base cases depend heavily on whether the next capital raise is optional or whether project finance needs are larger than the public record suggests.
    diligencePath: Request project-finance materials, budget-vs-actuals, ARDP milestone documentation, and management's downside funding plan.
    relatedQuestionRefs:
    - QV003
    - QV024
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: follow-on-unit-economics
    missingEvidence: PacifiCorp ownership, operator, power-price, and cost-allocation assumptions for additional Natrium units.
    whyItMatters: Planning optionality does not deserve the same value as contracted demand, and that distinction drives the premium over NuScale.
    diligencePath: Request IRP support materials, any commercial term sheets, and the utility's internal assumptions on follow-on unit economics.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: fuel-commercial-terms
    missingEvidence: Committed HALEU volumes, pricing, fabrication milestones, and step-up capex obligations across Centrus, Framatome, and GNF-A.
    whyItMatters: Fuel remains the clearest path to schedule and valuation downside, and public statements do not reveal whether the commercial terms are financeable.
    diligencePath: Request milestone dashboards, supply agreements, and management's fallback plan if domestic fuel facilities scale more slowly than expected.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-table
    missingEvidence: A broader private-round and secondary-market set for advanced nuclear developers, including reliable pricing references for private peers.
    whyItMatters: The current comparable table is intentionally partial because the best public valuation data are concentrated in Oklo and NuScale rather than across the full private peer set.
    diligencePath: Use paid databases or direct diligence to add current private marks, secondary prices, and recent round terms for TerraPower and other private reactor developers.
    relatedQuestionRefs:
    - QV019
    - QV024
    relatedTableRefs:
    - TV004
