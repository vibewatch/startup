- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - case
  - core assumptions
  - indicative equity value band
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bear
    - Fuel or capital slips again; follow-on utility demand stays non-contractual; private financing arrives on punitive terms
    - $3B-$5B
    - Value falls back toward lower public anchors and a strategic-optionality floor
    - HALEU delay, financing strain, customer-conversion failure
    - Public evidence already contains one real fuel-driven schedule slip
  - - Base
    - Kemmerer continues progressing; follow-on demand remains credible but not yet contracted; disclosure improves modestly
    - $6B-$9B
    - Value sits between NuScale's public level and Oklo's richer narrative premium
    - Opaque cap stack, uncertain cost-to-complete, fuel commercial terms
    - Best fit for the current public record
  - - Bull
    - Kemmerer stays on track to first power, fuel chain de-risks, and additional-unit planning converts into financeable deployments
    - $10B-$14B
    - A premium to current public peers becomes defendable because TerraPower combines scarcity, scale, and execution proof
    - Execution miss, delayed fuel readiness, overpricing of the next round
    - Requires multiple milestones that the public record has not yet proven
  notes: Scenario bands are indicative public-only equity proxies, not model-derived fair values; they are designed to enforce price discipline under missing private-company inputs.
