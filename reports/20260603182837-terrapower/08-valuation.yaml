- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Fuel-path failure
    - Another material schedule slip caused by HALEU or fabrication readiness
    - Breaks the strongest late-stage execution argument and pushes value toward the bear band
    - Pause the process or re-underwrite only at a materially lower valuation
  - - Overpriced capital raise
    - New round implied above the Oklo public cap without matching new disclosure or contracts
    - Turns a strong company into a weak risk-adjusted entry
    - Avoid or insist on a valuation reset / stronger protections
  - - Customer optionality stall
    - No disclosed economics or firm follow-on commitments from PacifiCorp or other buyers
    - Removes a key source of premium over NuScale
    - Reduce to watchlist status
  - - Cost-to-complete surprise
    - Management cannot evidence contingency, DOE draw timing, and non-federal funding coverage
    - Increases dilution risk and compresses upside
    - Delay investment until financing package is visible
  - - Disclosure failure
    - No cap-table, preference-stack, or valuation disclosure even late in process
    - Prevents real downside underwriting
    - Do not proceed beyond research-more
  notes: Kill triggers are designed to be monitorable and directly tied to valuation compression, not just company-quality disappointment.
  claimRefs:
  - CV040
  - CV041
  - CV042
  - CV043
  - CV044
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Current round price
    - Share price, post-money valuation, and any recent secondary marks
    - No valuation opinion is credible without the actual entry price
    - Request latest financing deck, subscription documents, and any board-approved valuation memos
  - - Capital structure
    - Liquidation preferences, warrants, option pool, and seniority waterfall
    - Downside returns can differ materially from headline post-money value
    - Request full cap table and rights summary from counsel or CFO
  - - Cost to complete
    - Updated Kemmerer cost-to-complete, contingency, DOE draw timing, and non-federal sources of funds
    - Determines dilution risk and whether the next raise is defensive
    - Request project-finance model, budget vs. actuals, and ARDP milestone schedule
  - - Customer economics
    - PacifiCorp commercial structure, pricing assumptions, and ownership / operator split for additional units
    - Planning value is not equal to monetizable demand
    - Request utility term sheets, IRP support materials, and any commercial principles
  - - Fuel economics
    - Committed HALEU volumes, pricing, fabrication milestones, and counterparty fallback plans
    - Fuel uncertainty is the clearest path to valuation downside
    - Request TerraPower / Centrus / Framatome / GNF-A milestone dashboard and supply agreements
  notes: These asks are ranked by how directly they change the entry price or downside protection rather than by general curiosity value.
