- id: SV003
  title: 'Scenario logic and comparable anchors: the defensible band sits between NuScale and Oklo'
  body: The public comp set says more about market psychology than about discounted cash flow precision. NuScale's current market value is far below Oklo's even though NuScale has a richer regulatory history and disclosed revenue, because the market is rewarding optionality, AI-linked energy demand, and balance-sheet strength more than near-term reactor delivery. TerraPower sits between those poles. It has stronger site-specific project proof than Oklo, more visible strategic and federal backing than many peers, and a better first-plant reality than the canceled CFPP path demonstrated for NuScale. But TerraPower is still private, still pre-commercial, and still opaque on price, margins, and downside terms. That combination is why this chapter uses a valuation range, not a point estimate. The bear case assumes more fuel or capital slippage and pulls TerraPower back toward lower public anchors. The base case assumes Kemmerer stays on track and follow-on demand remains real but not yet contracted.
    The bull case only becomes credible if TerraPower starts converting its scarcity, project progress, and additional-unit option value into commercially explicit evidence rather than planning signals and financing headlines.
