- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - current read
  - evidence
  - what would change the view
  rows:
  - - Scarcity thesis
    - Positive
    - TerraPower has disclosed large equity backing, ARDP support, a permit, and active construction progress
    - Sustained schedule execution and clean valuation terms would strengthen the case
  - - Utility option value thesis
    - Positive but unpriced
    - PacifiCorp planning includes two additional reactors in Utah and broader five-unit study work
    - Disclosed economics or firm commitments would make the option value investable
  - - Opacity anti-thesis
    - Material negative
    - No public post-money valuation, liquidation preference, revenue, cash, or margin disclosures are available
    - Management disclosure of cap table, price, cash, and unit economics would reduce the discount
  - - Fuel-chain anti-thesis
    - Material negative
    - The project already slipped once because HALEU was not available on the original timeline
    - Commercial proof of fuel volumes, pricing, and fabrication readiness would narrow the downside
  - - Public-multiple anti-thesis
    - Material negative
    - Oklo's premium multiple shows the sector can price on narrative, but TerraPower should not inherit that premium without disclosure
    - A lower entry valuation or materially better disclosure would make a premium more defensible
  notes: Arguments are ranked by current importance to the investment call; the table separates company quality from price discipline.
