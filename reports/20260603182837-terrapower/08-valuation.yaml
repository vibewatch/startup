chapter:
  number: 8
  title: Valuation
summary: TerraPower looks like one of the highest-quality private advanced-nuclear platforms in the market, but the public record still does not reveal the current price, cap stack, or project-finance detail needed for a clean underwriting decision. Disclosed raises, ARDP support, Kemmerer progress, and PacifiCorp option value justify a serious valuation effort, yet the most supportable public-only band still sits as a wide proxy between NuScale's current public valuation and Oklo's richer narrative premium. The recommendation therefore stays research-more, with a base public-only range of roughly $6 billion to $9 billion and a refusal to underwrite an Oklo-like premium without much better disclosure.
sections:
- id: SV001
  title: 'Recommendation: the company looks real, but the price still is not'
  body: TerraPower has crossed the line from concept-company storytelling into real project execution. The company has disclosed at least $1.4 billion of equity financing since 2022, has up to $2 billion of ARDP cost-share support behind Natrium, and now has a construction-permit-plus-construction-start story that many advanced-nuclear peers still do not have. Those facts make TerraPower investable in principle. The problem is that valuation is not the same thing as company quality. The public sources reviewed for this chapter still do not disclose the current post-money valuation, share price, liquidation preferences, dilution stack, or cost-to-complete by funding source. That means the market can tell that TerraPower is strong, but not what a rational investor should pay today. The right conclusion is therefore not buy and not avoid. It is research-more with explicit entry discipline. Public-only evidence supports a serious private valuation discussion somewhere above NuScale's current
    public market cap, but not a blind willingness to pay an Oklo-like premium simply because TerraPower is strategically scarce and better advanced than many private peers.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
