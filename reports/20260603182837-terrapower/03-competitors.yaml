chapter:
  number: 3
  title: Competitors
  summary: 'TerraPower competes most directly with X-energy, Kairos Power, Oklo, NuScale, and a thinnerly disclosed Terrestrial Energy, but the sharper commercial divide is by buyer job: utility-scale coal replacement, industrial heat, staged hyperscaler-backed deployment, and smaller public-market-backed reactor bets. Public evidence suggests TerraPower leads on first-plant grid scale and utility-partner depth, while Kairos and X-energy crowd the hyperscaler and industrial narratives, NuScale retains the strongest formal regulatory credential, and HALEU scarcity plus opaque pricing keep moat claims provisional.'
sections:
- id: landscape-and-peer-classes
  title: Landscape and peer classes
  body: TerraPower is not competing in a single clean peer set. The direct advanced-reactor field already spans sodium fast reactors, high-temperature gas-cooled reactors, fluoride-salt-cooled designs, light-water SMRs, microreactor narratives, and molten-salt concepts. In practice, the competitive question for a buyer is less “which SMR is best?” than “which pathway best matches my load, site, fuel tolerance, and financing structure?” TerraPower therefore sits in the middle of several overlapping comparisons. Against X-energy and Kairos, it competes for first-wave U.S. advanced-reactor deployment and hyperscaler-adjacent attention. Against NuScale, it competes for buyers who want a regulatorily credible modular nuclear path. Against Oklo, it competes for capital-market mindshare and data-center adjacency. Against Terrestrial Energy and other adjacent entrants, it competes for the broader narrative that advanced reactors can replace fossil baseload or industrial heat. Incumbent large-reactor
    and gas-backed status-quo solutions still matter as substitutes because the global nuclear construction base remains dominated by large projects rather than a proven advanced-reactor fleet.
