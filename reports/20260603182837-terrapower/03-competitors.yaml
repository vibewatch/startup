- id: TP004
  title: Moat durability and competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - current mitigation or offset
  - diligence ask
  rows:
  - - Utility-grade first-plant scale
    - Smaller staged rivals can win early customer commitments before Natrium reaches fleet repetition
    - High
    - PacifiCorp study, DOE support, and active construction path partially offset this risk
    - Validate how soon Kemmerer translates into bankable repeat orders
  - - Integrated storage and peak flexibility
    - Gas-plus-storage or cheaper flexible alternatives may undercut Natrium if delivered economics disappoint
    - Medium-High
    - Storage-coupled public positioning is differentiated, but price proof is absent
    - Request side-by-side delivered-cost and dispatch-value models
  - - Partner-led distribution
    - Kairos Google alignment and X-energy hyperscaler-linked signaling dilute any unique TerraPower demand narrative
    - High
    - TerraPower still has PacifiCorp, DOE, and financing momentum
    - Map which counterparties are exploratory versus contractually committed
  - - Fuel and supply-chain coalition
    - HALEU scarcity is shared across multiple advanced-reactor pathways and can slow everyone, including TerraPower
    - High
    - DOE HALEU program and vendor-specific fuel work are real but incomplete
    - Audit allocations, fabrication milestones, and fallback fuel scenarios
  - - Private-company patience and capital access
    - Public-market peers can use valuation, liquidity, and visibility as strategic currency
    - Medium
    - TerraPower still has deep private backers and public-sector support
    - Compare recruiting, partner leverage, and financing speed versus public peers
  notes: Severity ratings are analytical judgments based on cited competitive facts, while mitigation and diligence asks are framed as investment workstreams rather than claims of resolution.
