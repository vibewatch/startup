- id: adverse-evidence-and-open-questions
  title: Adverse evidence and open questions
  body: 'The disconfirming evidence in this chapter matters. NuScale’s CFPP termination shows that even a vendor with an unusually strong regulatory milestone can fail to hold together subscription and project economics. Nuclear Engineering International’s reporting on TerraPower’s HALEU-driven delay shows that advanced-reactor competition is still constrained by fuel geopolitics and execution, not only technology. The Terrestrial Energy materials are also a warning of a different kind: some competitors remain visible enough to stay in the landscape but too opaque to underwrite cleanly from public evidence. More broadly, none of the reviewed sources provide a durable apples-to-apples price sheet, delivered-cost model, backlog conversion table, or disclosed contract economics for Google, Amazon-linked projects, PacifiCorp, or other likely buyers. That leaves the chapter’s bottom line clear but incomplete: TerraPower looks comparatively strong in utility-scale deployment readiness, yet its
    moat remains vulnerable wherever smaller, staged, or more clearly commercialized rivals convert customers faster than a first-of-a-kind 345 MWe-class plant can.'
