- id: capability-and-commercial-fit
  title: Capability and commercial fit by buyer job
  body: Public evidence suggests TerraPower is strongest where the buyer wants a large coal-site replacement or a utility-scale clean-capacity block with dispatch flexibility. Natrium’s disclosed 345 MWe base rating and 500 MW peak output put it in a different near-term scale class from X-energy’s 80 MWe Xe-100 module, Kairos’s 50 MW Hermes 2 plant, and NuScale’s 77 MW module. That scale advantage matters for regulated utilities and retired-coal conversions, but it is not a universal win. X-energy is selling industrial steam and multi-unit modularity, Kairos is selling a staged learning curve with an explicit Google-linked deployment path, Oklo is selling compact fast-reactor optionality backed by a rich public-market valuation, and NuScale is selling the strongest formal licensing credential. Public pricing is mostly absent across all of them, so the competitive comparison currently depends more on scale, architecture, customer route, and proof of delivery than on transparent dollar-per-megawatt-hour
    economics. The result is a fragmented market in which TerraPower can lead on one buyer job while losing on another.
