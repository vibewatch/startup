  rows:
  - - TerraPower Natrium
    - direct peer / benchmark
    - 345 MWe base / 500 MW peak; DOE cost share; PacifiCorp follow-on study
    - regulated utilities, coal-site replacement, large clean-load growth
    - grid-scale sodium fast reactor with integrated storage and coal-retirement siting story
    - HALEU dependency and public pricing remain opaque
  - - X-energy Xe-100
    - direct peer
    - 80 MWe module; 4-12 units per site; 11 GW pipeline and 2026 IPO activity on news page
    - industrial heat, utilities, large industrial campuses
    - high-temperature steam, modular multi-unit siting, TRISO fuel positioning
    - no equivalent plant-construction milestone in this source pack and HALEU exposure remains material
  - - Kairos Power KP-FHR / Hermes
    - direct peer
    - multi-site U.S. footprint; Hermes 2 up to 50 MW; Google-linked fleet path
    - hyperscalers, TVA-style utilities, staged early adopters
    - iterative build-test-learn model and vertical integration around commercialization
    - smaller near-term plant scale than Natrium and commercial-fleet economics remain unproven
  - - Oklo Aurora
    - adjacent direct peer / microreactor
    - June 2026 market cap $11.52B; active newsroom and fast-reactor messaging
    - data centers, remote or industrial loads, high-optionality buyers
    - compact fast-reactor narrative, recycling claims, strong public-market attention
    - current pack lacks TerraPower-style utility-partner and construction-readiness proof
  - - NuScale NPM
    - licensed SMR peer
    - 77 MW module; 924 MWe 12-module configuration; June 2026 market cap $4.33B
    - utilities, public power, industrial users, off-grid and process-heat buyers
    - first and only SMR in the pack claiming NRC design approval
    - CFPP termination demonstrates customer-subscription and project-packaging risk
  - - Terrestrial Energy IMSR
    - adjacent peer
    - official IMSR plant and technology pages remain live, but current fetched detail is sparse
    - industrial heat, cogeneration, adjacent utility buyers
    - molten-salt brand positioning keeps it in the buyer menu
    - public funding scale, project timing, and delivery proof are thin in the current source pack
  notes: 'Public scale and capital signals are heterogeneous across peers: some rows reflect power ratings, some market-cap signals, and some project-path disclosures because comparable realized pricing is not publicly available.'
