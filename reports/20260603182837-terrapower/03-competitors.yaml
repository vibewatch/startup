  - - Kairos
    - No public plant-level price sheet in current pack
    - iterative demo-to-fleet path with Google-linked power-purchase route
    - 50 MW Hermes 2 demonstration plant and construction-learning story
    - commercial fleet economics after demonstration sequence
    - Strong where buyers value staged risk reduction and hyperscaler alignment
  - - Oklo
    - No public comparable contract economics in reviewed sources
    - compact fast-reactor commercialization narrative supported by public-market attention
    - small fast-reactor positioning and fuel-recycling claims
    - site-level economics and customer conversion detail
    - Competes for option value and speed narrative more than disclosed utility-grade economics
  - - NuScale
    - CFPP showed project economics were insufficient to sustain subscription, but no fresh apples-to-apples price is disclosed here
    - module licensing / project development around design-approved SMR path
    - 77 MW module and broad end-use menu
    - updated cost and subscription credibility after CFPP
    - Regulatory strength is tangible, but commercial packaging remains a live risk
  - - Terrestrial Energy
    - No usable public pricing evidence in current pack
    - current deployment model is not transparent in cited pages
    - IMSR plant and technology branding
    - funding scale, timing, counterparties, and delivered economics
    - Visible enough to stay in the landscape, but hard to underwrite cleanly
