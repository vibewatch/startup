  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "TerraPower is a Bellevue-based advanced nuclear developer founded in 2008 by Bill Gates, Nathan Myhrvold, and John Gilleland. Public evidence shows a well-capitalized, DOE-backed Natrium commercialization effort with real regulatory and construction momentum in Wyoming, but still little visibility into private valuation, revenue, exact headcount, and the full cap table."
  },
  "sections": [
    {
      "id": "identity-and-scope",
      "title": "Identity, founding, and product scope",
      "body": "TerraPower’s own materials anchor the company as a 2008-founded nuclear innovation company created by Bill Gates, Nathan Myhrvold, and John Gilleland to pursue safer and more scalable advanced reactors. The official description is broader than a single reactor program: TerraPower says it works on advanced nuclear energy and isotope applications, but Natrium is clearly the flagship commercialization path. Across the company website, the 2024 Natrium technology PDF, and multiple press releases, Natrium is presented as a 345 MW sodium-cooled fast reactor paired with molten-salt energy storage that can flex to 500 MW during peak periods. That positioning matters because it frames TerraPower not as a pure science project, but as a grid-facing infrastructure company trying to turn a first-of-a-kind reactor into a repeatable commercial product. Public location evidence consistently points to Bellevue, Washington as the corporate base, with press-release datelines and third-party reporting also pointing to Everett research activity and Wyoming project execution.",
