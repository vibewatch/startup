    {
      "id": "milestones-and-open-questions",
      "title": "Milestones, regulatory progress, and unresolved diligence questions",
      "body": "The milestone record is now substantial enough that later chapters can treat TerraPower as a real deployment case rather than a hypothetical design. The sequence runs from ARDP selection and early fuel-supply partnerships, through 2022–2025 fundraising, to 2024 groundbreaking and 2026 construction-permit approval and official construction start. Regulatory evidence is especially important because the NRC pre-application record, ANS coverage, TechCrunch reporting, and POWER’s detailed timeline collectively show a project that has moved well beyond concept. Even so, the same record also surfaces the most important unresolved issues. Nuclear Engineering International explicitly flagged HALEU shortages as a cause of schedule slippage, ENR framed Kemmerer as a roughly $4 billion project, and the public materials still do not disclose current valuation, revenue, exact headcount, or the detailed terms and milestones attached to DOE support. The company overview, therefore, is investable as a narrative of progress, but not yet transparent enough to substitute for a financing data room.",
