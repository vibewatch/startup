  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and asset map
        blocks:
          - type: paragraph
            body: >-
              TerraPower’s product is easiest to understand as a delivery stack, not a single reactor SKU. For the
              near-term buyer, the company is selling a Natrium plant outcome: dispatchable clean capacity for a utility
              or coal-replacement site that needs both steady output and peak support. The public materials are explicit
              that this promise relies on more than the sodium fast reactor itself. TerraPower bundles the nuclear
              island, the molten-salt storage system, supporting sodium-handling and training facilities, and a
              fuel-chain buildout through external partners. That makes the customer workflow look closer to a
              programmatic infrastructure replacement than a standard equipment order. The same public record also shows
              a second, clearly earlier asset family in MCFR, IET, and MCRE. Those assets extend TerraPower into
              industrial heat and future molten-salt applications, but they should be treated as innovation-pipeline
              products rather than current commercial equivalents to Natrium. The key takeaway for underwriting is that
              TerraPower’s product surface already spans plant, workforce, supply chain, and experimentation layers.
