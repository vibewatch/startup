        - label: Medium impact
          values:
            - Export-control hiring delay
            - MCFR management distraction
            - ''
    approximationNotes: >-
      Matrix placement is qualitative and based on residual exposure after visible mitigations, not on a probabilistic
      Monte Carlo model. Empty cells indicate no priority risk was intentionally mapped there.
    claimRefs:
      - CR003
      - CR012
      - CR018
      - CR021
      - CR026
      - CR029
      - CR040
      - CR042
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The main risk channels run from law and fuel availability through schedule and cost, then into utility confidence,
      financing pressure, and overall investability.
    data:
      nodes:
        - id: n1
          label: Russian uranium law
          detail: Legal restriction on prior fallback fuel path
          type: risk
        - id: n2
          label: HALEU commercialization gap
          detail: Enrichment, metallization, or fabrication misses target timing
          type: risk
        - id: n3
          label: Operating-license delay
          detail: Permit win does not yet authorize operation
          type: risk
        - id: n4
          label: FOAK schedule slip
          detail: Construction or supplier milestone moves beyond plan
          type: impact
        - id: n5
          label: Cost overrun
          detail: More capital required for Kemmerer or follow-on units
          type: impact
        - id: n6
          label: PacifiCorp confidence loss
          detail: Utility concentration weakens public customer proof
          type: impact
        - id: n7
          label: Financing pressure
          detail: New capital required before major derisking events
          type: impact
        - id: n8
          label: Valuation impairment
          detail: Lower underwriting confidence and more dilution risk
          type: impact
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n4
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n4
          to: n6
        - from: n5
          to: n7
        - from: n6
          to: n7
        - from: n7
          to: n8
        - from: n5
          to: n8
    approximationNotes: >-
      The graph is directional and explanatory rather than quantitative. It intentionally omits lower-order secondaries
      so the main investment transmission channels remain readable.
    claimRefs:
      - CR010
      - CR012
      - CR020
      - CR029
      - CR033
      - CR034
      - CR040
      - CR042
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      TerraPower's commercial path depends on a utility anchor, federal sponsors and regulators, and a three-step fuel
      chain that no single partner controls end to end.
    data:
      nodes:
        - id: d1
          label: NRC
          detail: Permit and operating-license authority
          type: regulator
        - id: d2
          label: DOE / ARDP
          detail: Cost share and commercialization support
          type: regulator
        - id: d3
          label: PacifiCorp
          detail: Utility anchor and likely operating path
          type: customer
        - id: d4
          label: Centrus
          detail: HALEU enrichment
          type: supplier
        - id: d5
          label: Framatome
          detail: HALEU metallization
          type: supplier
        - id: d6
          label: GNF-A
          detail: Natrium fuel fabrication
          type: supplier
        - id: d7
          label: Bechtel and long-lead vendors
          detail: EPC and major component execution
          type: supplier
        - id: d8
          label: TerraPower execution
          detail: Central program integration and financing case
          type: company
      edges:
        - from: d1
          to: d8
        - from: d2
          to: d8
        - from: d3
          to: d8
        - from: d4
          to: d8
        - from: d5
          to: d8
        - from: d6
          to: d8
        - from: d7
          to: d8
        - from: d4
          to: d6
        - from: d5
          to: d6
    approximationNotes: >-
      The map shows the most underwriting-relevant external dependencies only. It does not attempt to represent every
      subcontractor or every MCFR counterparty.
