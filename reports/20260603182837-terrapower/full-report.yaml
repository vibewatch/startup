  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The most defensible way to frame TerraPower’s market is not “all clean energy” or even “all nuclear,” but
              a narrower set of demand pools where dispatchable carbon-free power or high-temperature process heat is
              unusually valuable. World Nuclear Association materials define SMRs as modular reactors generally around
              300 MWe or below, while also acknowledging broader medium-sized interpretations up to 600 MWe. That
              matters because Natrium’s 345 MWe base rating sits slightly above classic small-reactor shorthand, yet
              competes commercially against the same advanced-reactor set as utilities, governments, and industrial
              buyers evaluate modular nuclear options. The included market therefore spans coal-replacement and
              grid-capacity investments, industrial steam and heat uses, flexible clean capacity for renewable-rich
              systems, and a growing cohort of data-center-adjacent buyers who need reliable electricity. The excluded
              market is equally important: TerraPower is not currently addressing rooftop solar, short-duration
              batteries, or commodity peaker turbines on pure upfront capex terms. Its credible substitutes are instead
              combined-cycle gas, large light-water nuclear, other advanced-reactor platforms, and status-quo life
              extension of coal or gas assets where regulation permits.
            claimRefs:
