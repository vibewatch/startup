        title: Named deployment proof is strongest with PacifiCorp and still pre-commercial elsewhere
        blocks:
          - type: paragraph
            body: >
              PacifiCorp is the clearest public proof that TerraPower has crossed from abstract advanced-reactor
              marketing into a utility-led commercialization path. TerraPower's own 2023 release says PacifiCorp's
              integrated resource plan selected two additional Natrium units by 2033, while PacifiCorp's customer-facing
              news release frames Natrium as a potential reliable power source for PacifiCorp customers and explicitly
              describes the joint study for up to five additional reactors. That customer-side language is materially
              stronger than a startup-only press release because it shows the utility itself is willing to describe
              Natrium as part of future service to ratepayers. However, even the best proof remains pre-operation proof.
              The Kemmerer demonstration is under construction and independently corroborated by WyoFile, SVI News,
              POWER, and NRC-milestone reporting, but there is still no public evidence of delivered electricity, plant
              transfer economics, or commercial performance. Outside PacifiCorp, the proof weakens further. ENEC is an
              exploration MOU, Gyeongsangnam-do is a supply-chain agreement, and Southern Company's MCFR work is a
              technology and future-market partnership for industrial and marine-adjacent applications rather than a
              Natrium plant order. TerraPower therefore has named counterparties, but only one named utility path that
