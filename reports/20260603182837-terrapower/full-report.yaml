      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Natrium’s public architecture is more concrete than most advanced-reactor marketing because TerraPower
              discloses a distinct nuclear island and energy island, a 345 MWe sodium fast reactor, and a storage system
              that can lift delivered output to 500 MWe for more than five and a half hours. That combination matters
              because it explains why TerraPower frames the plant as flexible grid infrastructure rather than only
              baseload nuclear generation. The public technical sheet also extends the proposition into heat and steam,
              although there is not yet a named public industrial offtake. Behind that front-end promise sits a less
              visible but equally important operating model: enrichment through Centrus, metallization through
              Framatome, fabrication through GNF, and quality-controlled component delivery through qualified suppliers.
              MCFR uses a different operating model again. Its proof path runs through the Integrated Effects Test and
              then MCRE, with public emphasis on high-temperature industrial use rather than coal-site utility
              replacement. The architecture is therefore legible, but the hidden digital controls and plant software
