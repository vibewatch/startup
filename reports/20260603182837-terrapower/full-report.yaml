  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation and what counts as customer proof
        blocks:
          - type: paragraph
            body: >
              TerraPower's public customer surface is real, but it is not broad in the way a mature software or
              equipment vendor's customer roster would be. The only named counterparty that clearly behaves like a
              prospective buyer, owner, or utility off-taker is PacifiCorp, operating through Rocky Mountain Power
              around the Kemmerer Natrium project and additional Natrium planning in its resource mix. Around that
              anchor sits a second layer of public-sector or strategic actors that matter commercially without being
              equivalent to revenue customers: DOE is the demonstration sponsor that de-risks first-of-a-kind
              deployment, Southern Company is a utility and R&D partner on the separate MCFR line, and ENEC plus
              Gyeongsangnam-do represent international deployment and supply-chain interest rather than signed Natrium
              orders. A final layer is pure end-market demand narrative: TerraPower is increasingly discussed in
              AI-power and data-center coverage, but no reviewed public source names a hyperscaler, industrial heat
              buyer, or other end user actually purchasing TerraPower output today. For underwriting, that means this
              chapter must separate utility planning proof, pilot and demonstration partners, strategic
              market-development counterparts, and unconverted demand narrative instead of treating every logo as an
              active customer.
