            body: >-
              The most persuasive public evidence around TerraPower is not a single spec sheet; it is the convergence of
              DOE cost share, NRC workstreams, Bechtel site execution, and a partner-built fuel chain. That combination
              makes Natrium look more deployment-ready than many concept-heavy peers, but it also exposes where the
              product can break. TerraPower does not control the entire HALEU chain itself, and the public source pack
              shows enrichment, metallization, and fabrication as separate dependencies with different institutions and
              timelines. The company’s differentiation versus peers is therefore mixed. Against X-energy, TerraPower
              emphasizes larger single-site utility scale and storage-assisted dispatch instead of modular industrial
              steam first. Against Kairos, it emphasizes a large flagship build instead of an iterative demo ladder.
              Against NuScale, it offers a more novel reactor-plus-storage concept but accepts a harder fuel and
              licensing problem. Bechtel’s public role suggests the execution moat is as much EPC capability and
              support-facility delivery as reactor physics. That is valuable, but it also means TerraPower’s edge
              depends on coordination quality across many parties rather than on an isolated proprietary module.
