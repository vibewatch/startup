        title: Adoption trajectory is milestone-rich but still missing a named corporate off-taker
        blocks:
          - type: paragraph
            body: >
              TerraPower's adoption trajectory is better understood through deployment milestones than through classic
              customer metrics. DOE selected Natrium under ARDP in 2020, PacifiCorp and TerraPower moved from Wyoming
              siting work into a multi-reactor study, PacifiCorp's 2023 IRP incorporated two additional Natrium units,
              and the Kemmerer project then accumulated state permitting, construction, training, and NRC milestones
              that make the path look more concrete than most advanced-reactor concepts. This is meaningful adoption
              evidence because utilities and regulators are devoting real planning and execution resources to Natrium.
              But it is not the same thing as repeated commercial sales. The reviewed public sources do not disclose a
              customer count, a backlog of signed PPAs, or a list of operating industrial or hyperscaler buyers for
              Natrium. AI-driven power demand clearly helps the market backdrop: DatacenterDynamics and NucNet tie
              TerraPower's 2025 fundraise to AI demand, Sabey Data Centers signed an exploration MOU around TerraPower
              microreactors, and CNBC plus Kairos's Google agreement show that tech buyers are now willing to sign
              explicit nuclear power arrangements. Yet that comparison cuts both ways. Kairos can point to Google as a
              named multi-plant customer path, while TerraPower's public data-center story remains exploratory and
              adjacent rather than a disclosed operating Natrium offtake agreement.
