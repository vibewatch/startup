      - number: '4.4'
        title: Public financial gaps and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The central underwriting problem is not that TerraPower lacks a plausible revenue model; it is that the
              public record still omits the actual operating numbers needed to evaluate that model. None of the reviewed
              TerraPower materials or independent coverage discloses recognized revenue, bookings, cash on hand, monthly
              burn, debt covenants, project-finance terms, realized power pricing, or project-level gross margin. The
              best public information is therefore indirect: fundraising size, DOE cost-share mechanics, fuel-partner
              announcements, project-cost framing, and public-comp filings from NuScale and Oklo. That is enough to
              conclude TerraPower is capital-intensive and financing-dependent, but not enough to estimate dilution
              risk, downside runway, or the economics of a single Natrium deployment.


              The comp set sharpens the point. NuScale and Oklo at least publish audited balance-sheet and cash-use
              data; TerraPower does not. Yet even those public peers show how hard this sector is to commercialize at
              attractive margins. That leaves TerraPower’s financial verdict mixed. The company has credible capital
              access, multiple external demand signals, and unusually serious federal and utility counterparts. But
              until management discloses or privately shares current cash balances, ring-fenced project budgets,
              customer economics, and fuel commitments, the investment case remains dependent on faith in execution
              rather than an underwritten financial model. That is acceptable for narrative diligence, not for final
              underwriting.
