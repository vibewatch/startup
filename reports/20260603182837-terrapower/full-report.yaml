      - number: '2.4'
        title: Adoption constraints and unresolved market questions
        blocks:
          - type: paragraph
            body: >-
              The strongest market tailwinds are also paired with the most obvious bottlenecks. World Nuclear
              Association, DOE, and NRC materials all point to HALEU supply as a structural constraint: more than half
              of SMR designs require it, domestic availability remains insufficient, and the Russian uranium import ban
              further increases pressure on alternate supply pathways. TerraPower’s own partnership announcements with
              ASP Isotopes, Framatome, GNF, and other fuel-cycle actors effectively confirm that the market is as much a
              supply-chain buildout as a reactor-sales market. Capital intensity is the second constraint. ENR described
              Kemmerer as a roughly $4 billion project, and NuScale’s CFPP termination remains a reminder that even
              strong licensing progress does not ensure offtake or economic closure. Finally, there is still a major
              data gap around TerraPower-specific economics. Public evidence supports the direction of demand, but not a
              precise Natrium LCOE, realized power price, or TerraPower-specific market-share model. The result is a
              market that looks strategically attractive and directionally large, but still hard to underwrite with
              conventional growth-equity precision.
