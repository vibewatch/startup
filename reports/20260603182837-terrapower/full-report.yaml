  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and peer classes
        blocks:
          - type: paragraph
            body: >-
              TerraPower is not competing in a single clean peer set. The direct advanced-reactor field already spans
              sodium fast reactors, high-temperature gas-cooled reactors, fluoride-salt-cooled designs, light-water
              SMRs, microreactor narratives, and molten-salt concepts. In practice, the competitive question for a buyer
              is less “which SMR is best?” than “which pathway best matches my load, site, fuel tolerance, and financing
              structure?” TerraPower therefore sits in the middle of several overlapping comparisons. Against X-energy
              and Kairos, it competes for first-wave U.S. advanced-reactor deployment and hyperscaler-adjacent
              attention. Against NuScale, it competes for buyers who want a regulatorily credible modular nuclear path.
              Against Oklo, it competes for capital-market mindshare and data-center adjacency. Against Terrestrial
              Energy and other adjacent entrants, it competes for the broader narrative that advanced reactors can
              replace fossil baseload or industrial heat. Incumbent large-reactor and gas-backed status-quo solutions
              still matter as substitutes because the global nuclear construction base remains dominated by large
              projects rather than a proven advanced-reactor fleet.
