      - number: '8.4'
        title: 'Thesis-break triggers and final diligence: this is a terms-driven decision, not a vibes-driven one'
        blocks:
          - type: paragraph
            body: >-
              TerraPower can still become a compelling investment, but only if the missing pieces are addressed with
              hard documents rather than narratives. The first hard blocker is valuation disclosure: the investor needs
              the current share price, post-money, liquidation preferences, and dilution structure to understand
              effective entry. The second blocker is industrial: cost-to-complete, contingency buffers, DOE draw timing,
              and non-federal capital commitments determine whether the next raise is optional or compulsory. The third
              blocker is commercial: PacifiCorp's follow-on demand and the fuel chain both create upside, but neither
              currently comes with the disclosed economics needed to size that upside. The thesis breaks if TerraPower
              experiences another fuel-driven schedule slide, raises capital at an implied value above the richest
              public peer without new disclosure, or fails to convert additional-unit planning into financeable
              commercial commitments. Until those questions are answered, the only disciplined recommendation is
              research-more with a clear willingness to revisit if price and terms move into a range the public evidence
              can actually support.
