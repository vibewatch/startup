  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: the company looks real, but the price still is not'
        blocks:
          - type: paragraph
            body: >-
              TerraPower has crossed the line from concept-company storytelling into real project execution. The company
              has disclosed at least $1.4 billion of equity financing since 2022, has up to $2 billion of ARDP
              cost-share support behind Natrium, and now has a construction-permit-plus-construction-start story that
              many advanced-nuclear peers still do not have. Those facts make TerraPower investable in principle. The
              problem is that valuation is not the same thing as company quality. The public sources reviewed for this
              chapter still do not disclose the current post-money valuation, share price, liquidation preferences,
              dilution stack, or cost-to-complete by funding source. That means the market can tell that TerraPower is
              strong, but not what a rational investor should pay today. The right conclusion is therefore not buy and
              not avoid. It is research-more with explicit entry discipline. Public-only evidence supports a serious
              private valuation discussion somewhere above NuScale's current public market cap, but not a blind
              willingness to pay an Oklo-like premium simply because TerraPower is strategically scarce and better
              advanced than many private peers.
            claimRefs:
              - CV001
              - CV002
              - CV003
