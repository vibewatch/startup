      - number: '3.3'
        title: Distribution, supply, and moat durability
        blocks:
          - type: paragraph
            body: >-
              TerraPower’s strongest public moat is not a single reactor feature; it is the ecosystem around the first
              plant. DOE cost share, NRC engagement, PacifiCorp’s fleet-expansion study, and the visible Kemmerer
              construction timeline together create a more concrete utility-grade deployment path than most peers have
              disclosed. That said, the moat is not exclusive. Kairos emphasizes vertical integration, iterative
              testing, and construction learning. X-energy is moving on fuel licensing, IPO positioning, and industrial
              partnerships. Oklo and NuScale have public-market visibility that can matter for partnerships, recruiting,
              and strategic attention. The biggest shared competitive bottleneck is HALEU and related supply-chain
              readiness. That exposure weakens any claim that TerraPower can win simply by being better capitalized or
              more politically connected, because several direct peers are racing for overlapping fuel, regulatory, and
              customer resources. Switching costs are likely to become high only after a buyer commits to a
              technology-specific licensing, fuel, and site-design path; before that point, multi-homing and buyer
              comparison remain active threats to TerraPower’s moat.
