    title: Market definition table
    columns:
      - segment/category
      - included spend
      - excluded spend
      - buyer/payer
      - relevance
    rows:
      - - Coal replacement / utility resource planning
        - New dispatchable clean capacity, site reuse, transmission reuse, long-duration reliability
        - Retail rooftop solar and merchant-only battery projects without firm-capacity need
        - Utilities, regulated rate base, public power sponsors
        - Most concrete near-term Natrium use case because PacifiCorp already models the asset in planning.
      - - Renewable-rich grid balancing
        - Firm clean power and peak-capacity support in high-renewables systems
        - Stand-alone short-duration batteries and demand-response-only products
        - Utilities, ISOs, reliability buyers
        - Natrium's storage and flexible output are explicitly marketed into this need.
      - - Industrial heat and steam
        - High-temperature steam, process heat, refinery and chemical decarbonization
        - Low-temperature commercial heating or purely residential energy services
        - Industrial operators, project sponsors, sovereign energy programs
