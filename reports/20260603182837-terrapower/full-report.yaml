      - number: '8.2'
        title: 'Thesis and financing context: milestone progress is real, but opacity is still expensive'
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is easy to articulate. TerraPower has a more tangible path to commercial relevance
              than most private reactor developers because it pairs policy support, a physical site, a utility
              relationship, and a first-of-a-kind project that is already through the construction-permit gate.
              PacifiCorp's planning work on additional units also matters because it gives TerraPower more visible fleet
              optionality than a one-off demo story would justify. But the anti-thesis is just as important for
              valuation. TerraPower still does not disclose recognized revenue, cash balance, project-level margin, or
              the economic terms behind PacifiCorp's optionality. Fuel remains the sharpest value leak because the
              public record already shows that HALEU constraints can move the schedule, and the supply-chain solution
              still depends on counterparties scaling on time. In other words, TerraPower may deserve a premium to
              weaker peers on project maturity, but it also deserves a private-company discount to the hottest public
              multiple until it reveals the capital structure and commercial terms that public comps disclose every
              quarter.
