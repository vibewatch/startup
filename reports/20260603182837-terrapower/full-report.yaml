      - number: '7.4'
        title: Capital, people, and monitoring discipline determine whether the story stays investable
        blocks:
          - type: paragraph
            body: >-
              TerraPower is better capitalized and better organized than many advanced-reactor peers, but the remaining
              risk is still execution under opacity. TerraPower's 2025 fundraise announcement and POWER's 2026 project
              timeline both indicate that the company has assembled meaningful private capital alongside ARDP support,
              which is enough to keep the project moving. What public investors still cannot see clearly is the exact
              cost-to-complete, the size of contingency buffers, the commercial terms on fuel, or the plant-transfer
              economics with PacifiCorp. That is why people and process matter so much in this chapter. TerraPower's own
              hiring signals show it is building a serious supplier-quality regime: the Supplier Quality Representative
              posting calls for 10-plus years in NRC/DOE supplier quality, Appendix B and NQA-1 familiarity, auditing,
              welding oversight, surveillance, and first-of-a-kind component experience. The same posting says
              foreign-national hiring can be constrained by export-control approval times. That is a real mitigation
              signal, but it also reveals a scarce-talent bottleneck. Public evidence on the MCFR program adds another
              layer: Southern Company milestones show TerraPower can prosecute a second advanced-reactor pathway with
              credible partners, but they do not show how management capacity is allocated between MCFR and Natrium.
              Peer filings from NuScale and Oklo remind investors that even well-funded advanced-nuclear companies can
              carry large losses and cash-use profiles. The practical conclusion is that TerraPower should be monitored
              less like an early-stage science experiment and more like a complex industrial program whose investability
              depends on on-time regulatory completion, fuel-chain commercial proof, disciplined supplier quality, and
              continued utility and capital support.
