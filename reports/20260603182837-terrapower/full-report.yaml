  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              TerraPower’s public financial story still starts with what the company is trying to sell, not what it has
              already recognized as revenue. The reviewed official materials support a project-based monetization model
              built around Natrium deployment, associated engineering and licensing work, fuel-fabrication and
              supply-chain enablement, and long-cycle services attached to reactor rollouts. They do not support a
              disclosed recurring top line, published reactor price sheet, power-purchase tariff, or license-fee
              schedule. That distinction matters because the visible cash inflows today are fundraising and federal cost
              share, while the visible customer-side signals are still development-stage indicators such as PacifiCorp
              studies, IRP inclusion, and international MOUs rather than signed contracts with disclosed economics.


              The most credible forward revenue path is therefore a staged infrastructure commercialization arc: first
              demonstrate Kemmerer, then convert utility and sovereign-interest signals into follow-on deployments, and
              only then layer fuel, service, and fleet-style economics on top. Public evidence suggests TerraPower is
              already building some of the prerequisites for that model—fuel facilities, HALEU partnerships, and utility
              planning studies—but the company has not published the contract mechanics that would let an investor
              separate technology fees, construction pass-throughs, fuel margin, or long-term O&M value. Financially,
              this chapter should be read as an analysis of monetization architecture and financing dependence, not as
              proof of current operating traction.
