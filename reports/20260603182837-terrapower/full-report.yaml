      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence is uneven but still useful. Chris Levesque is the current operating face of the
              company in fundraising, partnership, and project milestone announcements, while Bill Gates remains the
              founder-chairman figure most associated with TerraPower’s credibility and long-horizon capital support.
              The official About page also highlights founder John Gilleland’s continuing technical role and identifies
              TerraPower directors including Kristine Svinicki and Ralph Izzo, both of whom bring nuclear-policy or
              utility-scale governance experience. TerraPower therefore looks stronger than a typical founder-dependent
              climate startup on board quality, but the public record still implies meaningful key-person concentration.
              Gates remains the best-known strategic backer, Levesque is central to commercialization messaging, and the
              Natrium program is still sufficiently early that execution credibility depends heavily on a small set of
              leaders who can align capital, regulation, engineering, and state-level politics. The chapter evidence
              does not provide a fully disclosed cap table, full board roster, or detailed governance rights by investor
              class.
