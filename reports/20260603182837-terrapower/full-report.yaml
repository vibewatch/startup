      - number: '7.3'
        title: First-of-a-kind construction, partner concentration, and customer concentration are intertwined
        blocks:
          - type: paragraph
            body: >-
              TerraPower's FOAK execution risk is not just a construction risk. It is a system-level coordination risk
              across regulators, DOE cost share, PacifiCorp's utility pathway, Bechtel's EPC work, and a long supplier
              list that stretches from heavy reactor components to sodium systems and controls. ENR and POWER place the
              all-in program around $4 billion and peak site labor around 1,600 workers. POWER's milestone reporting
              lists a broad network of long-lead suppliers and makes clear that TerraPower has been intentionally
              closing procurement rounds to preserve schedule. TerraPower's own suppliers page says the company has
              engaged more than 80 corporations, universities, and government agencies globally. Those are signs of
              seriousness, but they also show why partner risk remains high: there are many points where a slip,
              nonconformance, or contracting dispute can force replanning. Customer concentration compounds the problem.
              PacifiCorp is still the only named utility anchor with site-specific Natrium deployment intent, and the
              public evidence for additional units remains planning-proof rather than operating demand. That is much
              better than generic market narrative, but it still means TerraPower's visible commercial case narrows
              sharply if the utility path weakens. The best adverse comparator is NuScale's Carbon Free Power Project.
              NuScale and UAMPS ultimately terminated CFPP, and World Nuclear News reported the Idaho SMR project ended
              after subscription shortfalls and cost pressure. TerraPower is in a stronger position than CFPP ever was
              because Kemmerer now has DOE cost share, state permitting, federal permitting, and physical construction.
              But CFPP still demonstrates the important negative lesson: utility-backed advanced nuclear projects can
              fail late when economics, subscriptions, or execution confidence deteriorate.
