      - CR018
      - CR022
      - CR023
      - CR024
      - CR029
      - CR038
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays research-more because company quality is strong, but the current price-setting variables
      are still private.
    data:
      nodes:
        - id: n1
          label: Late-stage strategic asset
          description: >-
            Large disclosed equity backing, ARDP support, permit progress, and active construction differentiate
            TerraPower from most private peers.
        - id: n2
          label: Visible demand option
          description: PacifiCorp's planning for additional units gives TerraPower more than a one-reactor demo story.
        - id: n3
          label: Fuel and capital drag
          description: >-
            HALEU constraints already moved the schedule once, and cost-to-complete still sits behind opaque private
            financing data.
        - id: n4
          label: Public comp band
          description: NuScale provides a lower public anchor while Oklo represents the current narrative ceiling.
        - id: n5
          label: 'Current call: research-more'
          description: Public evidence can support a range, but not a clean entry price or downside case.
        - id: n6
          label: Upgrade gate
          description: Move toward track only if terms, cap stack, and fuel / project milestones become documentable.
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
      - CV031
      - CV032
      - CV036
      - CV040
      - CV043
  - id: FV002
    title: Valuation sensitivity
    type: bar
    summary: >-
      The midpoint moves materially depending on whether the market applies a NuScale-like anchor, a TerraPower
      execution premium, or an Oklo-style narrative premium.
    data:
      items:
        - label: NuScale public anchor
          value: 4.33
          unit: $B
        - label: Bear midpoint after renewed slip
          value: 4
          unit: $B
        - label: Base underwriting midpoint
          value: 7.5
          unit: $B
        - label: Base + follow-on-unit premium
          value: 9
          unit: $B
        - label: Oklo narrative ceiling
          value: 11.52
          unit: $B
    claimRefs:
      - CV015
      - CV016
      - CV030
      - CV031
      - CV032
      - CV033
  - id: FV003
    title: Valuation / return range
    type: range
    summary: >-
      The public-only range is deliberately wide because the current private entry price is undisclosed and the downside
      terms are not public.
    data:
      items:
        - label: Bear
          low: 3
          mid: 4
          high: 5
          unit: $B
        - label: Base
          low: 6
          mid: 7.5
          high: 9
          unit: $B
        - label: Bull
          low: 10
          mid: 12
          high: 14
          unit: $B
    approximationNotes: >-
      Ranges are indicative equity-value proxies inferred from public comps, disclosed financing, milestone progress,
      and execution risk; they are not DCF outputs.
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV041
  - id: FV004
    title: Investment KPIs
    type: kpi
    summary: >-
      The KPI set shows why TerraPower is strategically important while also highlighting that the crucial pricing
      fields remain private.
    data:
      items:
        - label: Disclosed equity raised since 2022
          value: $1.4B+
          status: confirmed
          note: $650M in 2025 plus minimum $750M in 2022
        - label: ARDP federal support ceiling
          value: $2.0B
          status: confirmed
          note: 50/50 cost-share framework
        - label: First-plant public cost proxy
          value: ~$4.0B
          status: confirmed
          note: ENR project framing
        - label: Additional-unit planning
          value: 2 in IRP; up to 5 studied
          status: confirmed
          note: PacifiCorp and TerraPower planning signal
        - label: Current post-money valuation
          value: Undisclosed
          status: unconfirmed
          note: Public sources reviewed do not reveal pricing terms
        - label: Public comp band
          value: $4.33B-$11.52B
          status: confirmed
          note: NuScale to Oklo market-cap band
        - label: Recommendation
          value: research-more
          status: confirmed
          note: Strong company, incomplete pricing evidence
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV010
      - CV015
      - CV016
      - CV036
