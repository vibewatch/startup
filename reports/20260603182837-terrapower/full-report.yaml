      - number: '4.3'
        title: Capital adequacy and financing dependence
        blocks:
          - type: paragraph
            body: >-
              TerraPower is better capitalized than many private reactor developers, but the visible capital stack still
              reads as a dependency chain rather than a self-sustaining operating model. Official company releases
              support at least $1.4 billion of disclosed equity financing since 2022, and DOE support adds a federal
              anchor measured in billions. Even so, the simple public math remains demanding. A roughly $4 billion first
              plant, a required non-federal match, fuel-cycle infrastructure, and adjacent program work leave little
              room for complacency, especially because public materials do not disclose what portion of prior raises
              remains unspent, unrestricted, or dedicated solely to Natrium. In other words, TerraPower has raised a lot
              of money, but public evidence still does not show that it has fully closed the commercial-capital loop.


              The adverse evidence reinforces that concern. Nuclear Engineering International reported a HALEU-driven
              schedule slip, and World Nuclear News described a term sheet that would have TerraPower help fund a HALEU
              production facility and commit to a ten-year offtake. Those facts matter because they shift financing
              dependence beyond reactor construction alone and into fuel availability, counterparty execution, and
              long-dated procurement obligations. PacifiCorp’s additional-reactor planning is financially positive as a
              demand signal, but it is not a substitute for disclosed backlog, project-finance structure, or current
              cash runway. The practical verdict is that TerraPower appears financeable, but public data is not yet
              enough to prove capital adequacy through first power and follow-on deployment without access to management
              accounts and project agreements.
