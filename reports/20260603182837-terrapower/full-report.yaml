      - number: '1.3'
        title: Capital base, partners, and commercialization stakeholders
        blocks:
          - type: paragraph
            body: >-
              TerraPower’s financing profile is unusually strong for a pre-revenue reactor developer. Official releases
              confirm a minimum $750 million equity raise in 2022 and a further $650 million round in June 2025, while
              third-party coverage reinforces that DOE support on Natrium is measured in the billions. The capital stack
              is strategically notable: Bill Gates kept participating, SK anchored the earlier raise, NVentures joined
              in 2025, and HD Hyundai appeared as a current investor as TerraPower pushed toward construction and
              supply-chain scale-up. That investor mix makes TerraPower look less like a venture-backed lab company and
              more like a cross-sector coalition spanning climate, heavy industry, shipbuilding, and AI-related power
              demand. The stakeholder map also extends beyond financiers. PacifiCorp is the utility deployment partner
              in Wyoming and in additional-resource studies, GE Hitachi is the Natrium technology partner, DOE is the
              indispensable cost-share sponsor, and Centrus plus other fuel and manufacturing partners are central to
              the HALEU and supply-chain story. Publicly, TerraPower has enough backing to attempt first-plant
              commercialization, but not enough disclosure to underwrite dilution, preferences, or project-finance
              obligations with precision.
