      terms.
    - Named paying-customer roster, contracts, renewal and retention cohorts, concentration, and reference calls.
    - Independent reliability benchmarks, uptime and incident history, manufacturing yield, and fault-tolerance roadmap.
    - Counsel-reviewed export-control, licensing, IP, privacy, and cross-border delivery assessment.
