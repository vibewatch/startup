company:
  name: Origin Quantum
chapter:
  number: 5
  title: Product & Technology
  summary: Origin Quantum presents a vertically integrated superconducting-quantum stack spanning chips, measurement and control, environment support, operating systems, cloud access, simulators, applications, and education. The product surface is unusually broad and recent Wukong-180 launch claims indicate continuing hardware progression, but public evidence does not yet establish independent performance benchmarks, reliability SLAs, security controls, or production customer outcomes.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      Origin Quantum's product is best understood as a workflow rather than a single
      processor. Its cloud surface combines access to quantum computers, hybrid quantum
      and classical resources, dedicated cloud deployments, development tools, one-click
      applications, and learning resources. This lets a researcher or enterprise team
      move from education and algorithm development to simulator testing and execution on
      a remote superconducting system. The official cloud page also describes practical
      implementation guidance and technical support, suggesting a services layer around
      compute access rather than a bare hardware rental. Public materials do not disclose
      contract terms, realized pricing, support response targets, or a customer-level
      conversion from cloud use to paid production workloads.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-maturity
    title: Architecture and maturity
    body: >-
      The architecture is vertically integrated across four core systems: the quantum
      chip, measurement and control, environment support, and quantum-computer operating
      system. Origin Quantum says all four are self-developed, while its broader product
      catalog adds dilution refrigerators, control systems, programming frameworks,
      developer tools, simulators, application software, and post-quantum security
      products. The company says Wukong-180 is a fourth-generation superconducting system
      and the People’s Daily English report describes a single-core 180-qubit chip with
      100-qubit-level computing capability. Earlier Wukong operation claims provide usage
      evidence, but they are company-reported and do not substitute for independently
      reproduced fidelity, error-rate, yield, uptime, or logical-qubit evidence.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-risk
    title: Differentiation, controls, and diligence gaps
    body: >-
      The strongest differentiator visible in public evidence is domestic full-stack
      control: Origin Quantum links chip development, fabrication capability, control
      electronics, cryogenic environment support, software, cloud delivery, applications,
      and education. That breadth can reduce integration dependence and support a
      repeatable deployment model, but it also creates a large reliability and capital
      surface. The public product pages list simulators and global access, yet do not
      provide a dated SLA, incident history, security architecture, privacy terms,
      independent benchmark methodology, or customer-specific production outcomes. A
      practitioner-facing profile also notes that international access is limited by
      geopolitics and that transparency is lower than for public Western competitors.
      Underwriting therefore requires technical diligence on reproducibility, lifecycle
      support, supply-chain resilience, and the boundary between announced roadmap
      capabilities and generally available production service.
    claimRefs: [CE010, CE011, CE012, CE013]

