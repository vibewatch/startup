      - ["Environment support", "Supplies operating conditions for superconducting hardware", "Dilution refrigeration and related hardware", "Thermal stability, maintenance, and field-service evidence are limited"]
      - ["Quantum computer operating system", "Coordinates hardware access and software execution", "Chip and control interfaces", "Download availability is described but security, update policy, and compatibility are not documented"]
      - ["Cloud and simulator layer", "Exposes compute, hybrid resources, simulators, and tools", "Network, scheduling, software, and support operations", "No public SLA, incident history, or queue-performance series"]
      - ["Applications and education", "Converts platform capabilities into industry and learning workflows", "Domain software, partners, and institutional users", "Production ROI and repeat usage remain unverified"]
    notes: >-
      Architecture roles follow the company's stated full-stack model. Dependency and risk
      cells are diligence interpretations; they are not claims that a failure has occurred.
    claimRefs: [CE005, CE006, CE010, CE011, CE012, CE013]

