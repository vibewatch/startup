callouts:
  - calloutType: strength
    title: Full-stack control is the clearest product differentiator
    body: Origin Quantum's public materials consistently connect chip, control, environment, operating system, cloud, applications, and education rather than presenting only a processor.
    claimRefs: [CE005, CE010]
  - calloutType: risk
    title: Public product breadth exceeds public proof of production maturity
    body: The assigned sources do not establish independent performance benchmarks, uptime, security controls, pricing realization, or customer-level production outcomes.
    claimRefs: [CE011, CE012, CE013]
  - calloutType: recommendation
    title: Gate technical underwriting on reproducible operations evidence
    body: Before treating the platform as production infrastructure, request benchmark methodology, error and yield series, SLA and incident records, security documentation, and referenceable paid deployments.
    claimRefs: [CE011, CE012, CE013]

