callouts:
  - calloutType: insight
    title: Market opportunity is real but not yet measurable at Origin level
    body: "Sector revenue and commercial-use-case evidence support an investable category, but no retained source discloses Origin's pricing, recurring revenue, utilization, or market share. Valuation work should therefore use scenario-based adoption assumptions rather than a headline quantum TAM."
    claimRefs: [CM005, CM008, CM009]
  - calloutType: risk
    title: Technical and geopolitical friction can defer conversion
    body: "Fault-tolerance uncertainty and export controls can delay enterprise production adoption even as research access expands. The near-term buyer is more likely to fund experimentation or co-development than guaranteed production capacity."
    claimRefs: [CM010, CM012, CM013, CM014]
