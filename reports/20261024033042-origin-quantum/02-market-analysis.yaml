    title: Segment and buyer map
    columns: [segment, buyer, user, payer, workflow, budget owner, adoption trigger]
    rows:
      - [Academic research, "University research lead or lab", Researchers and students, Grant or university research budget, "Algorithm and hardware experiments", Principal investigator or institution, "Access to real hardware and research incentive"]
      - [Enterprise R&D, "Innovation or advanced-computing executive", Quantum/application engineers, Enterprise R&D budget, "Proof-of-concept and co-development", CTO or R&D leader, "Credible advantage on a defined workload"]
      - [Government and strategic programs, "Public-sector program manager", Research teams and contractors, Government program budget, "National capability and secure infrastructure", Ministry or agency, "Domestic control and strategic resilience"]
      - [Education and workforce, "University administrator or program director", Students and instructors, Education budget, "Teaching, curriculum, and skills development", Institution or department, "Integrated platform and content"]
      - [Application partners, "Software or industry partner", Joint technical teams, Partner innovation budget, "Domain application integration", Product or engineering leader, "Hybrid services and distribution access"]
    notes: "Buyer roles are an evidence-constrained operating model based on the retained product, cloud, education, and market sources; public sources do not disclose Origin's actual customer concentration or contract terms."
    claimRefs: [CM002, CM003, CM004, CM010, CM011]
