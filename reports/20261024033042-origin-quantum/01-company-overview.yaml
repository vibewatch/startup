artifact: company-overview
slug: origin-quantum
runDate: 2026-10-24
company:
  name: Origin Quantum
chapter:
  number: 1
  title: Company Overview
  summary: Origin Quantum is a Hefei-based full-stack quantum-computing company founded in 2017 and built around superconducting hardware, control systems, software, and cloud access. The evidence supports meaningful technical and ecosystem milestones, but private-company disclosure leaves audited financials, customer economics, cap-table terms, and governance depth unresolved.
sections:
  - id: identity-and-platform
    title: Identity, product scope, and operating footprint
    body: "Origin Quantum identifies itself as a company established in Hefei High-Tech Zone in 2017, with technology originating in the CAS Key Laboratory of Quantum Information. Its stated scope spans independently controllable engineering-oriented quantum computers, full-stack development, and industrialization. The product surface is unusually broad for a private specialist: the official site describes superconducting systems, quantum chips, dilution refrigerators, control systems, operating systems, developer tools, industry applications, security products, and education services. The cloud subsidiary describes quantum-computing, hybrid-computing, and dedicated-cloud services, plus simulators and learning resources. This supports a platform thesis rather than a single-machine thesis, but it also increases execution surface area and makes product-level revenue mix impossible to infer from the available sources."
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: people-and-governance
    title: Founders, leadership, and governance visibility
    body: "The official leadership page names Guo Guangcan as co-founder and chief technology consultant and Guo Guoping as chief scientist and founder, linking the company to Chinese quantum-information research. It also names Kong Weicheng as chairman-in-office and director of the quantum measurement and control center, Zhang Hui as general manager and legal representative, and functional leaders for chips, software, cloud, and intellectual property. This shows coverage across core technical and commercial functions and indicates that the founders remain connected to the scientific and technical narrative. However, the assigned evidence does not identify a board roster, shareholder control rights, independent directors, executive turnover, or succession arrangements. Key-person dependence therefore remains a material diligence question even though functional coverage appears broad."
    claimRefs: [CO004, CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: capital-milestones-and-disclosure
    title: Financing, milestones, and evidence limits
    body: "Current secondary sources do not reconcile the capital history. Quantum Market Cap reports more than $800 million of cumulative backing and a nearly ¥3 billion June 2026 pre-IPO financing at an approximately ¥21 billion pre-money valuation, while PostQuantum reports approximately $150–165 million raised and a 2025 secondary valuation of about ¥6.88 billion. Different dates may explain part of the valuation change, but not the funding-total gap. None of these figures is reconciled to audited statements, a term sheet, or a public filing in the assigned pool, so they are financing context rather than cash available, revenue, or definitive equity value. The milestone record is stronger: official and independent sources document the 2017 founding, 2024 Wukong availability, and 2026 Wukong-180 launch."
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: diligence-implications
    title: Ground truth for downstream diligence
    body: "The evidence establishes a credible identity, a vertically integrated technical ambition, and a visible sequence of product and ecosystem milestones. It does not establish audited revenue, ARR, gross margin, cash burn, runway, named paying customers, retention, customer concentration, or a complete investor and board map. Employee estimates also diverge materially: PostQuantum reports more than 200 people while Quantum Market Cap reports approximately 600, so neither is used as a canonical headcount. The company’s public narrative emphasizes access counts, qubit counts, and partnerships more than contract-backed economics or reliability disclosures. Downstream analysis should validate financing against primary transaction evidence, separate remote accesses from paying customers, and request operating metrics before treating platform breadth as commercial scale."
    claimRefs: [CO012, CO013, CO015, CO016]
callouts:
  - calloutType: strength
    title: Full-stack scope is evidenced
    body: Official materials describe hardware, control, operating-system, cloud, application, security, and education layers rather than a single research prototype.
    claimRefs: [CO002, CO003]
  - calloutType: risk
    title: Private-company disclosure remains thin
    body: The assigned evidence does not provide audited financial statements, a named paying-customer roster, cap-table terms, or a board and succession record.
    claimRefs: [CO015, CO016]
