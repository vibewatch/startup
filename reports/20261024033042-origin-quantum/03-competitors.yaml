company:
  name: Origin Quantum
chapter:
  number: 3
  title: Competitors
  summary: Origin Quantum competes as a vertically integrated superconducting quantum platform, combining hardware, control systems, software, cloud access, and applications. Its public differentiation is strongest in domestic full-stack control and ecosystem reach, while the main underwriting limitations are sparse independent benchmarking, undisclosed commercial scale, and intense competition from global cloud and hardware providers.
sections:
  - id: competitive-landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      Origin Quantum's addressable competitive set is broader than superconducting hardware alone. The company's own materials describe a stack spanning superconducting systems, chips, dilution refrigerators, control systems, software, cloud services, applications, security, and education. That makes IBM Quantum, Rigetti, Google Quantum AI, Quantinuum, IonQ, IQM, and Oxford Quantum Circuits relevant technology peers, while cloud aggregators and internal research teams are substitutes for some buyers. An independent profile similarly describes Origin as a full-stack vendor, but the comparison is not an independent benchmark of performance. For a buyer, the practical alternatives are (i) buying or accessing a complete platform, (ii) using a multi-vendor cloud, (iii) selecting another modality, or (iv) retaining classical simulation and research workflows until quantum utility is demonstrated. The competitive question is therefore not simply qubit count; it is whether a provider can deliver reliable, usable workloads with acceptable access, software, support, and supply-chain risk.
    claimRefs: [CP001, CP002, CP003, CP004, CP014, CP015]
    tableRefs: [TP001]
  - id: capability-and-commercial-comparison
    title: Capability, packaging, and commercial comparison
    body: >-
      Origin Quantum's differentiation is a control-plane proposition: its official site presents hardware, software, cloud, industry applications, security, and education as one ecosystem, while the cloud site offers quantum, hybrid, and dedicated cloud services plus simulators and learning resources. This packaging can reduce integration friction for Chinese universities, public-sector users, and early industrial pilots, but it also puts the company in competition with global platforms that aggregate multiple hardware modalities. Public evidence does not establish realized pricing, contract terms, uptime, customer concentration, or a like-for-like benchmark against IBM, Rigetti, IonQ, Quantinuum, or Google. The comparison below therefore marks unknowns rather than filling them with estimates. The relevant buying criteria are access model, modality, software portability, application support, procurement and geopolitical fit, and evidence of repeat commercial use.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002, TP003]
  - id: moat-and-displacement
    title: Moat durability and displacement risks
    body: >-
      Vertical integration may create a local moat by concentrating hardware, control electronics, software, cloud delivery, and application know-how, and Origin's official history records a broad ecosystem of products, alliances, university activity, and domestic manufacturing milestones. That moat is not yet durable by default. The strongest adverse evidence in the assigned pool is comparative: public pure-play peers remain loss-making and volatile, with revenue concentrated in small or lumpy contracts, while independent commentary warns that quantum equity valuations are driven by milestones rather than earnings. Those observations do not prove Origin has the same financial profile, because Origin is private and does not publish comparable accounts; they do show that the sector's commercial model remains unproven. Displacement risk comes from better-performing foreign or domestic systems, multi-vendor cloud aggregation, classical alternatives, export controls, and customer reluctance to commit before useful workloads and service levels are demonstrated.
    claimRefs: [CP009, CP010, CP011, CP012, CP013, CP014, CP015, CP016]
    figureRefs: [FP001]
tables:
  - id: TP001
    title: Competitor and substitute landscape
    columns: [Alternative, Category, Scale / funding evidence, Target customer or job, Product scope / differentiation, Limitation or direction]
    rows:
      - [Origin Quantum, Direct full-stack provider, "Private; audited revenue, customer count, and current funding are not disclosed in assigned evidence.", "Chinese research, education, government-linked, and early industrial workloads.", "Superconducting systems plus chips, control, cryogenics, software, cloud, applications, security, and education.", "Full-stack breadth is visible; pricing and independent benchmark evidence are not."]
      - [IBM Quantum / Google Quantum AI, Diversified incumbents, "Quantum-specific revenue or funding is not isolated in assigned evidence.", "Global research and enterprise developers.", "Independent company-profile evidence names both as material superconducting peers.", "Assigned evidence lacks like-for-like commercial pricing and workload comparisons."]
      - [Rigetti Computing, Public direct superconducting peer, "$4.4 million Q1 2026 revenue and about $569 million cash and equivalents were reported.", "QPU system buyers, cloud users, and research organizations.", "Superconducting QPUs and Novera system sales provide the closest public modality comparison.", "Q1 operating expenses of $27.3 million materially exceeded revenue."]
      - [IonQ, Public alternative-modality peer, "$130 million FY2025 revenue and a $510.4 million FY2025 net loss were reported.", "Commercial, international, research, networking, sensing, and security buyers.", "Trapped-ion platform with acquisitions extending its product scope.", "Different modality; losses and high valuation limit direct economic comparability."]
      - [Quantinuum, Private / IPO alternative-modality peer, "$30.9 million 2025 revenue and a $14.3 billion June 2026 IPO target valuation were reported.", "Institutional and enterprise users of trapped-ion hardware and software.", "Honeywell lineage and integrated trapped-ion platform.", "AInvest calculated about 463 times 2025 revenue at the target valuation."]
      - [D-Wave, Public adjacent quantum provider, "$24.6 million FY2025 revenue from more than 135 customers was reported.", "Enterprise optimization buyers using QCaaS or systems.", "Annealing plus gate-model expansion and recurring QCaaS.", "System-sale timing can make quarterly revenue lumpy; FY2025 remained loss-making."]
      - [PsiQuantum / neutral-atom private entrants, Likely entrants / architecture alternatives, "Lambda Finance listed PsiQuantum at about $6 billion and Atom, Pasqal, and QuEra at roughly $500 million-$700 million.", "Future fault-tolerant and specialized quantum workloads.", "Photonic and neutral-atom approaches could change scaling economics.", "Timelines, modality, and private valuations are not comparable to Origin operating performance."]
      - [Internal build / classical simulation, Status quo substitute, "No external vendor funding or spend is required in assigned evidence.", "Buyers validating algorithms or delaying quantum commitment.", "Origin itself offers full-, partial-, single-amplitude, and noise-inclusive simulators.", "Can defer paid hardware usage; buyer cost and switching data remain unavailable."]
    notes: "Landscape is evidence-bounded and non-exhaustive; competitor comparisons use named sources, while unsupported commercial terms remain unknown."
    enumerationScope:
      coverage: sample
      basis: "Publicly named peers and substitutes in assigned company, cloud, and independent comparison sources as of the 2026-10-24 run date."
    claimRefs: [CP001, CP003, CP004, CP009, CP011, CP013, CP014, CP015]
  - id: TP002
    title: Capability and buying-criteria matrix
    columns: [Buying criterion, Origin Quantum, Global / public peers, Buyer implication]
    rows:
      - [Hardware modality, "Superconducting; Wukong 180 is described as fourth-generation.", "Peers span superconducting, trapped-ion, neutral-atom, and photonic approaches.", "Modality choice changes benchmark, workload, and roadmap assumptions."]
      - [Vertical integration, "Official materials cover chips, control, cryogenic hardware, software, cloud, applications, and education.", "Some peers specialize in hardware or aggregate third-party systems.", "Integration may reduce local deployment friction but raises execution breadth."]
      - [Cloud access, "Quantum, hybrid, and dedicated cloud services are offered; pricing is not disclosed.", "Cloud access is also a stated route for IBM and other named peers.", "Access lowers upfront hardware commitment; realized usage and SLA evidence are missing."]
      - [Software and applications, "Origin Pilot, QPanda3, VQNet, ChemiQ, QCFD and application support are described.", "Peers have their own SDKs, cloud tools, or application layers; direct feature parity is unverified.", "Portability and developer adoption require diligence."]
      - [Trust / procurement posture, "Domestic control and Chinese ecosystem positioning are emphasized.", "Global providers may offer different jurisdiction, export-control, and procurement profiles.", "Buyer selection can be constrained by data, policy, or supply-chain requirements."]
      - [Independent performance proof, "Public performance figures are company-reported in the assigned evidence.", "Cross-provider methods and workloads are not standardized in the assigned evidence.", "Require workload-specific benchmark and service-level evidence."]
    notes: "Cells marked as descriptions are source-backed; cells without a named fact are intentionally not scored."
    claimRefs: [CP002, CP005, CP006, CP008, CP010]
  - id: TP003
    title: Pricing, packaging, and commercial evidence
    columns: [Provider / route, Price or contract model, Included capability, Evidence status, Competitive implication]
    rows:
      - [Origin Quantum Cloud, null, "Quantum, hybrid, and dedicated cloud services; tools, simulators, learning, and application support.", "List price and realized price not disclosed in assigned sources.", "Packaging may support pilots, but economics cannot be underwritten."]
      - [Origin Quantum systems, null, "Superconducting computers, chips, dilution refrigerators, control systems, and related hardware.", "System pricing, backlog, margins, and contract terms not disclosed.", "Hardware sales could be lumpy and capital intensive."]
      - [Rigetti Novera, "$4.4 million Q1 2026 revenue is reported, not a product list price.", "Novera QPU system sales are cited by independent reporting.", "Revenue evidence is peer-level and does not establish Origin pricing.", "Shows a public peer's commercial signal while underscoring low sector scale."]
      - [D-Wave systems / QCaaS, "$2.9 million Q1 2026 revenue is reported, not a product or service list price.", "System sales and recurring quantum-computing-as-a-service are described by independent reporting.", "No comparable Origin recurring-revenue disclosure.", "Large system timing can make period revenue lumpy."]
      - [Quantinuum contracts, null, "AInvest cites multi-year contracts and reported 2025 revenue of $30.9 million.", "The assigned source does not provide comparable unit pricing or Origin terms.", "Contract timing can make revenue uneven and weakens simple period comparisons."]
      - [Internal build / simulator, null, "Classical or simulator workflows avoid external quantum access fees.", "No buyer cost data in assigned sources.", "Status quo can delay paid quantum adoption."]
    notes: "Null prices are evidence gaps, not zero prices; peer revenue and QCaaS observations are not Origin revenue or ARR."
    claimRefs: [CP006, CP008, CP011, CP012, CP013]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Origin's public evidence supports high vertical integration and domestic ecosystem fit, but its independent commercial proof remains limited relative to the breadth of its stated platform.
    data:
      xAxis: "Independent commercial proof (ordinal; 1=limited, 5=strong)"
      yAxis: "Vertical integration / platform breadth (ordinal; 1=focused, 5=full-stack)"
      points:
        - {label: Origin Quantum, x: 2, y: 5, note: "Official full-stack claims; private-company disclosure limits independent commercial proof.", claimRefs: [CP001, CP002, CP010]}
        - {label: IBM Quantum, x: 4, y: 4, note: "Named global direct peer; no like-for-like metrics in assigned evidence.", claimRefs: [CP003]}
        - {label: Rigetti Computing, x: 3, y: 3, note: "Independent Q1 2026 revenue evidence, but small scale and losses.", claimRefs: [CP009]}
        - {label: IonQ, x: 3, y: 3, note: "Independent sources describe public revenue and losses, but modality differs.", claimRefs: [CP003, CP011]}
        - {label: Internal build / simulator, x: 1, y: 2, note: "Status quo substitute; no vendor commercial proof.", claimRefs: [CP006, CP012]}
        - {label: Quantinuum, x: 3, y: 4, note: "Revenue and IPO valuation are reported, but assigned evidence does not provide a full operating benchmark.", claimRefs: [CP003, CP013]}
    approximationNotes: "Ordinal coordinates are analyst classifications from the cited evidence, not measured market-share or performance scores."
    claimRefs: [CP001, CP003, CP009, CP010, CP011, CP012, CP013, CP014, CP015]
callouts:
  - calloutType: strength
    title: Full-stack domestic control
    body: Origin Quantum's strongest defensible differentiator in the assigned evidence is the combination of hardware, control, software, cloud, application, security, and education surfaces.
    claimRefs: [CP001, CP002, CP005]
  - calloutType: risk
    title: Commercial proof remains thin
    body: The pool does not establish Origin's realized pricing, recurring revenue, customer concentration, uptime, or independent benchmark against named peers.
    claimRefs: [CP007, CP008, CP010]
  - calloutType: recommendation
    title: Underwrite workload economics, not qubit count
    body: Competitive diligence should request workload-specific benchmarks, access and SLA terms, repeat-customer evidence, and comparable economics before treating platform breadth as a durable moat.
    claimRefs: [CP006, CP008, CP012, CP013]
