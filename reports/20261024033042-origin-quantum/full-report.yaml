      - number: '5.3'
        title: Differentiation, controls, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest differentiator visible in public evidence is domestic full-stack control: Origin Quantum
              links chip development, fabrication capability, control electronics, cryogenic environment support,
              software, cloud delivery, applications, and education. That breadth can reduce integration dependence and
              support a repeatable deployment model, but it also creates a large reliability and capital surface. The
              public product pages list simulators and global access, yet do not provide a dated SLA, incident history,
              security architecture, privacy terms, independent benchmark methodology, or customer-specific production
              outcomes. A practitioner-facing profile also notes that international access is limited by geopolitics and
              that transparency is lower than for public Western competitors. Underwriting therefore requires technical
              diligence on reproducibility, lifecycle support, supply-chain resilience, and the boundary between
              announced roadmap capabilities and generally available production service.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Full-stack control is the clearest product differentiator
            body: >-
              Origin Quantum's public materials consistently connect chip, control, environment, operating system,
              cloud, applications, and education rather than presenting only a processor.
            calloutType: strength
            claimRefs:
              - CE005
              - CE010
          - type: callout
            title: Public product breadth exceeds public proof of production maturity
            body: >-
              The assigned sources do not establish independent performance benchmarks, uptime, security controls,
              pricing realization, or customer-level production outcomes.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE013
          - type: callout
            title: Gate technical underwriting on reproducible operations evidence
            body: >-
              Before treating the platform as production infrastructure, request benchmark methodology, error and yield
              series, SLA and incident records, security documentation, and referenceable paid deployments.
            calloutType: recommendation
            claimRefs:
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying surfaces
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum presents a multi-sided customer model rather than a single software buyer. Its public site
              names researchers, developers, businesses, universities, and students as users of hardware, cloud access,
              programming tools, simulators, applications, and education products. The company says its stack spans
              quantum computers, quantum cloud, programming software, simulators, QPanda3, VQNet, application packages,
              and industry solutions; these are company-described offerings, not independent measures of adoption. The
              cloud surface separates computing access, hybrid quantum-classical computing, dedicated deployments,
              learning resources, development tools, and application support, which suggests distinct self-serve,
              institutional, and enterprise procurement paths. The Quantum Insider profile independently describes the
              business as B2B with subscription and usage-based revenue, but its detailed customer and QCaaS fields are
              paywalled. No source supplies a reconciled active account count, payer mix, average contract value, or
              revenue by segment.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU008
      - number: '6.2'
        title: Adoption trajectory and named deployment proof
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption signals are usage and deployment claims, not contracted revenue. Origin's
              company history reports that Origin Wukong global visits exceeded 40 million in January 2026, while the
              independent Q-Day is Coming article reports more than 50 million remote visits, users in more than 160
              countries, and over 900,000 completed tasks for the predecessor Wukong; these figures differ in date,
              scope, and provenance and should not be combined into one KPI. A Spain collaboration reported by Global
              Construction Review and Xinhua describes a proposed integrated center combining supercomputing, quantum,
              AI, and cloud computing, with a planned 1,000-megawatt capacity; the reports describe an agreement and
              plans, not an operating customer deployment or realized capacity. The official site also lists university
              education, research, and industry application surfaces. These signals support reach and partner interest,
              but they do not prove paid production use, utilization, renewal, or outcome economics.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU008
              - CU010
              - CU012
              - CU015
      - number: '6.3'
        title: Retention, expansion, and concentration evidence
        blocks:
          - type: paragraph
            body: >-
              The public record is materially weaker on durability than on reach. Neither the official customer-facing
              pages nor the independent profile discloses NRR, GRR, churn, renewal rates, contract duration, cohort
              retention, customer concentration, or customer-level revenue. The Spain agreement could create an
              international expansion path, but the independent report frames it as a collaboration to explore
              construction and applications, while company-linked reporting describes planned exports and hybrid-cloud
              support; neither establishes a signed recurring commercial contract or production SLA. The company says
              its platform supports learning, tools, computing power, and application development, which could
              facilitate expansion from education or experimentation into enterprise workloads, but no source
              demonstrates conversion between those stages. Investors should therefore treat usage totals, logos, and
              announced collaborations as leading indicators only. A paying-customer roster, contract-backed references,
              renewal data, service-level history, and concentration schedule are required before underwriting durable
              revenue.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Customer diligence implications
        blocks:
          - type: paragraph
            body: >-
              Customer quality is promising but opaque. The breadth of the product surface may widen the funnel across
              researchers, universities, developers, and enterprises, while the proposed Spain center offers a concrete
              cross-border partner route. Conversely, the same breadth can conceal whether activity is educational, free
              research access, grant-supported use, pilot work, or recurring paid production workloads. The public
              evidence also does not identify customer-level dependence on Origin's cloud, uptime commitments,
              procurement friction, or the realized performance of industry applications. Before assigning a stronger
              commercial view, diligence should reconcile Wukong visit/task definitions, separate unique users from
              sessions, obtain paid-account and cohort exports, sample named reference calls, verify the Spain project's
              contractual and operational status, and review SLA, utilization, churn, and top-account concentration
              data.
            claimRefs:
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad access funnel
            body: >-
              Origin Quantum exposes learning, development, cloud, hardware, and application surfaces that can support
              progression from experimentation to institutional or enterprise workloads.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
          - type: callout
            title: Reach is not retention
            body: >-
              Public visit and task counts do not disclose paid conversion, renewal, cohort retention, utilization, or
              concentration; these are material underwriting gaps.
            calloutType: risk
            claimRefs:
              - CU006
              - CU007
              - CU011
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Strategic, regulatory, and geopolitical exposure
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum's stated objective is an independently controllable, full-stack quantum ecosystem, and
              public third-party coverage describes the company as pursuing a sovereign supply chain. That positioning
              can reduce dependence on foreign components, but it also embeds the business in state-priority spending,
              export-control divergence, and a fragmented international technology market. Entangled Future reports that
              controls introduced from 2022 restrict transfers of certain quantum technologies, components, and software
              to Chinese entities, while CNAS describes foreign dependence, insufficient capacity, and performance or
              scalability gaps as separate supply-chain vulnerabilities. These sources do not establish a violation by
              Origin Quantum. They do establish a diligence risk: map component provenance, licensing, customer
              jurisdictions, and the effect of cross-border controls before treating international cloud access or
              partner growth as durable.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operating, reliability, and technical execution risk
        blocks:
          - type: paragraph
            body: >-
              The company presents hardware, control systems, software, cloud access, applications, and post-quantum
              security as an integrated portfolio. Integration may improve control over the stack, but it increases
              execution surface area: cryogenic and control components, fabrication, software, cloud operations, and
              application support must scale together. CNAS warns that quantum-grade inputs can face thin supply, high
              cost, long lead times, and supplier consolidation; MIT's summary likewise notes sparse and
              difficult-to-gather data in this new field. Origin's public pages describe products and a 180-qubit system
              but do not disclose uptime, SLA performance, yield, error-rate distributions, incident history, or
              fault-tolerance milestones. The risk therefore remains an evidence gap rather than an asserted outage or
              defect. Require system-level reliability logs, independent benchmark protocols, and customer reference
              calls before assigning high confidence to production readiness.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR007
              - CR009
              - CR012
      - number: '7.3'
        title: Partner, financial, and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum's ecosystem model spans universities, research institutions, industry alliances, cloud
              users, suppliers, and public-sector or strategic capital. The official company history records alliances
              and collaborations, while the Quantum Insider profile confirms that substantial operating detail remains
              behind a premium access boundary. This leaves uncertainty about counterparty concentration, contract
              economics, recurring revenue, cash runway, and the share of activity that is research, education, pilot,
              or production. A failure of a key supplier, capital provider, cloud customer, or public program could
              therefore affect both revenue conversion and technical roadmaps. No assigned source verifies a current
              default, fraud, litigation, or customer loss; those absences are not evidence that the risks are absent.
              The appropriate stance is to monitor measurable breakpoints and demand primary documentation rather than
              infer resilience from logos, visits, or ecosystem claims.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis risk
            body: >-
              The central risk is an evidence gap around repeatable, reliable, economically meaningful deployments:
              public materials describe a broad stack, but do not provide the operating denominators needed to test
              production resilience.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR011
          - type: callout
            title: What would change the view
            body: >-
              A current export-control map, audited financial and runway package, independent reliability benchmarks,
              and named paying-customer references would materially reduce residual exposure.
            calloutType: assumption
            claimRefs:
              - CR004
              - CR007
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is strategic and technical rather than financial. Origin Quantum describes a full-stack
              offering spanning superconducting systems, chips, control systems, software, applications, cloud access,
              education, and post-quantum security. Its official history also records a 180-bit Wukong launch in 2026
              and cloud access for users worldwide. Those facts support a platform thesis, but they are
              company-described capabilities, not audited demand or profitability. The anti-thesis is therefore
              decisive: no retained source supplies Origin Quantum revenue, margin, cash, customer concentration, or a
              priced financing valuation. A quality business may still be an unattractive security at an undisclosed
              price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV012
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV013
              - CV014
      - number: '8.2'
        title: Price discipline and comparable signals
        blocks:
          - type: paragraph
            body: >-
              Caplight records a historical fundraising sequence from seed through Series B and names investors, but
              leaves the amount-raised and valuation cells blank on the accessible page. That is useful chronology, not
              a mark-to-market valuation. Public quantum comparables show why a direct multiple would be unsafe: Lambda
              Finance describes pure-play prices as narrative-sensitive and reports large drawdowns, while Yahoo Finance
              shows QUBT with a $1.81 billion market cap, $9.82 million trailing revenue, negative trailing operating
              cash flow, and a 191.79 price-to-sales ratio as of its displayed dates. These are sector reference points,
              not Origin Quantum comps, and should inform downside discipline rather than create a fabricated range.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              A bull case requires verified paid usage, repeatable cloud or system revenue, improving hardware
              economics, and a financing price that recognizes technical progress without assuming fault-tolerant
              commercialization. A base case is continued engineering and ecosystem expansion with private-company
              opacity, making a track or research-more call rational until terms are available. A bear case combines
              high capital intensity, delayed commercial advantage, a down round, or dilution before audited traction;
              the retained sector evidence explicitly flags runway, burn, and dilution as material considerations. Exit
              readiness is not established: diligence still needs the latest term sheet, cap table and preferences,
              audited financials, customer contracts, cash runway, and independent technical validation.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV013
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              Research-more is the strongest supportable recommendation: technical breadth is visible, but no current
              price, audited economics, or financing terms are retained. A buy call should wait for those primary
              documents.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV012
              - CV016
          - type: callout
            title: Main valuation risk
            body: >-
              The key risk is not merely technology failure; it is paying an unknowable private-market price before cash
              needs, dilution, liquidation preferences, and customer economics can be tested.
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
              - CV015
