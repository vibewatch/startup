              - CI003
              - CI004
      - number: '4.2'
        title: Pricing, GTM, and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The public cloud page exposes service categories and application access but no list price, usage tariff,
              minimum commitment, discount schedule, or contract term. That absence prevents a conventional CAC-payback
              or net-revenue-retention calculation. The most credible GTM proxy is product breadth plus distribution:
              cloud access lowers initial deployment friction, while dedicated cloud and application support can support
              higher-value enterprise or institutional engagements. A reported Spain arrangement indicates an
              international channel or project route, but the available description says technical and commercial
              details remain undisclosed. Underwriting should treat the current evidence as a monetization hypothesis
              and request contracts, invoices, cohort retention, sales-cycle data, and channel economics before
              assigning efficiency.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Cost structure and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum's stated scope implies meaningful fixed and variable costs: chip and control-system R&D,
              dilution-refrigerator and hardware engineering, cloud infrastructure, application support, and potentially
              pilot manufacturing. A Dealroom report says a nearly three-billion-yuan Series D is intended for pilot
              production lines on 12-inch wafers, next-generation superconducting R&D, and commercialization. That is
              evidence of planned capital use, not evidence of cash on hand or operating burn. Independent coverage also
              describes quantum computing as a nascent industry with modest near-term revenues, while an adverse
              European policy analysis highlights dual-use export controls and dependency concerns. No assigned source
              supplies audited statements, gross margin, working capital, capex, debt, cash runway, or financing
              trigger; those omissions are material to solvency underwriting.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial picture is strategically well funded but commercially unproven in the public record. A
              reported Series D valuation above 20 billion yuan and roughly 410 million dollars would provide a strong
              financing signal if verified, yet the same source describes a company still operating in a pre-commercial
              market and dependent on state-backed capital. A separate market-intelligence article presents older and
              conflicting funding and valuation figures, including a 165.7 million dollar total-funding figure and a
              1-billion-dollar-plus valuation; these discrepancies should not be reconciled by averaging them.
              Public-market quantum comparables show that investor pricing can be volatile, while export-control
              analysis creates a route, supply, and partnership risk for international expansion. The investment stance
              is research-more until management supplies audited financials, unit economics, cash and debt schedules,
              customer-level revenue evidence, and terms for the latest financing.
            claimRefs:
