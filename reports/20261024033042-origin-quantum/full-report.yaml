              - CP003
              - CP004
              - CP009
              - CP011
              - CP013
              - CP014
              - CP015
      - number: '3.2'
        title: Capability, packaging, and commercial comparison
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum's differentiation is a control-plane proposition: its official site presents hardware,
              software, cloud, industry applications, security, and education as one ecosystem, while the cloud site
              offers quantum, hybrid, and dedicated cloud services plus simulators and learning resources. This
              packaging can reduce integration friction for Chinese universities, public-sector users, and early
              industrial pilots, but it also puts the company in competition with global platforms that aggregate
              multiple hardware modalities. Public evidence does not establish realized pricing, contract terms, uptime,
              customer concentration, or a like-for-like benchmark against IBM, Rigetti, IonQ, Quantinuum, or Google.
              The comparison below therefore marks unknowns rather than filling them with estimates. The relevant buying
              criteria are access model, modality, software portability, application support, procurement and
              geopolitical fit, and evidence of repeat commercial use.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP008
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP011
              - CP012
              - CP013
      - number: '3.3'
        title: Moat durability and displacement risks
        blocks:
          - type: paragraph
            body: >-
              Vertical integration may create a local moat by concentrating hardware, control electronics, software,
              cloud delivery, and application know-how, and Origin's official history records a broad ecosystem of
              products, alliances, university activity, and domestic manufacturing milestones. That moat is not yet
              durable by default. The strongest adverse evidence in the assigned pool is comparative: public pure-play
              peers remain loss-making and volatile, with revenue concentrated in small or lumpy contracts, while
              independent commentary warns that quantum equity valuations are driven by milestones rather than earnings.
              Those observations do not prove Origin has the same financial profile, because Origin is private and does
              not publish comparable accounts; they do show that the sector's commercial model remains unproven.
              Displacement risk comes from better-performing foreign or domestic systems, multi-vendor cloud
              aggregation, classical alternatives, export controls, and customer reluctance to commit before useful
              workloads and service levels are demonstrated.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
