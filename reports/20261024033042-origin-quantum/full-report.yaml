      - number: '1.3'
        title: Financing, milestones, and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Current secondary sources do not reconcile the capital history. Quantum Market Cap reports more than $800
              million of cumulative backing and a nearly ¥3 billion June 2026 pre-IPO financing at an approximately ¥21
              billion pre-money valuation, while PostQuantum reports approximately $150–165 million raised and a 2025
              secondary valuation of about ¥6.88 billion. Different dates may explain part of the valuation change, but
              not the funding-total gap. None of these figures is reconciled to audited statements, a term sheet, or a
              public filing in the assigned pool, so they are financing context rather than cash available, revenue, or
              definitive equity value. The milestone record is stronger: official and independent sources document the
              2017 founding, 2024 Wukong availability, and 2026 Wukong-180 launch.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO009
              - CO011
              - CO012
      - number: '1.4'
        title: Ground truth for downstream diligence
        blocks:
          - type: paragraph
            body: >-
              The evidence establishes a credible identity, a vertically integrated technical ambition, and a visible
              sequence of product and ecosystem milestones. It does not establish audited revenue, ARR, gross margin,
              cash burn, runway, named paying customers, retention, customer concentration, or a complete investor and
              board map. Employee estimates also diverge materially: PostQuantum reports more than 200 people while
              Quantum Market Cap reports approximately 600, so neither is used as a canonical headcount. The company’s
              public narrative emphasizes access counts, qubit counts, and partnerships more than contract-backed
              economics or reliability disclosures. Downstream analysis should validate financing against primary
              transaction evidence, separate remote accesses from paying customers, and request operating metrics before
              treating platform breadth as commercial scale.
            claimRefs:
