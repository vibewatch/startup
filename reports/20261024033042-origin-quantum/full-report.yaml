      - number: '5.2'
        title: Architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The architecture is vertically integrated across four core systems: the quantum chip, measurement and
              control, environment support, and quantum-computer operating system. Origin Quantum says all four are
              self-developed, while its broader product catalog adds dilution refrigerators, control systems,
              programming frameworks, developer tools, simulators, application software, and post-quantum security
              products. The company says Wukong-180 is a fourth-generation superconducting system and the People’s Daily
              English report describes a single-core 180-qubit chip with 100-qubit-level computing capability. Earlier
              Wukong operation claims provide usage evidence, but they are company-reported and do not substitute for
              independently reproduced fidelity, error-rate, yield, uptime, or logical-qubit evidence.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
