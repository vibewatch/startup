chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum identifies itself as a company established in Hefei High-Tech Zone in 2017, with technology
              originating in the CAS Key Laboratory of Quantum Information. Its stated scope spans independently
              controllable engineering-oriented quantum computers, full-stack development, and industrialization. The
              product surface is unusually broad for a private specialist: the official site describes superconducting
              systems, quantum chips, dilution refrigerators, control systems, operating systems, developer tools,
              industry applications, security products, and education services. The cloud subsidiary describes
              quantum-computing, hybrid-computing, and dedicated-cloud services, plus simulators and learning resources.
              This supports a platform thesis rather than a single-machine thesis, but it also increases execution
              surface area and makes product-level revenue mix impossible to infer from the available sources.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
