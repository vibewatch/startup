  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer economics
        blocks:
          - type: paragraph
            body: >-
              The relevant market is quantum-computing infrastructure and access: superconducting hardware, control and
              cryogenic systems, operating software, cloud execution, hybrid classical-quantum services, education, and
              application support. This boundary includes spend by research institutions, universities, public-sector
              programs, and enterprises testing or deploying quantum workflows. It excludes broad quantum
              communications, sensing, unrelated post-quantum cybersecurity, and speculative value attributed to future
              fault-tolerant machines. Origin's own product surface spans hardware, software, applications, cloud
              access, and education, while its cloud page separates computing, hybrid, and dedicated services. That
              breadth gives the company multiple budget owners, but it also makes current revenue mix and repeat paid
              demand difficult to infer from public material. The practical substitute for many buyers remains classical
              HPC, simulation, or continued research rather than a quantum purchase.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM010
              - CM011
      - number: '2.2'
        title: Sizing lenses and adoption path
        blocks:
          - type: paragraph
            body: >-
              A defensible market view needs more than one headline total. McKinsey reports that quantum-computing
              companies generated more than $1 billion of revenue in 2025 and estimates $3.2 billion to $4.4 billion in
              2028, while its broader quantum-technology value-at-stake range reaches $1.3 trillion to $2.7 trillion by
              2035. These are different populations and concepts: company revenue is an observable market-flow measure,
              whereas value at stake is potential economic impact across quantum technologies. Origin's addressable
              slice is narrower and should be modeled from cloud usage, system sales, control hardware, education, and
              application work, not assigned the entire sector total. The adoption path is typically research access,
              proof-of-concept or co-development, then paid implementation and scaled workflow. Public evidence
              establishes access and use cases, but does not isolate Origin's serviceable market, pricing, utilization,
              or conversion rates. A separate, comparable McKinsey scenario series estimates the global
              quantum-computing market at $25 billion to $34 billion in 2030, $43 billion to $71 billion in 2035, and
              $77 billion to $148 billion in 2040.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM015
      - number: '2.3'
        title: Drivers, constraints, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by strategic government investment, expanding industrial experimentation, cloud-based
              access, and the search for use cases in optimization, simulation, chemistry, finance, and machine
              learning. Origin reports global access and its Wukong systems provide a concrete entry point for users
              that cannot build cryogenic hardware themselves. However, buyer willingness to pay depends on useful
              advantage, reliability, workflow integration, and a credible path beyond noisy intermediate-scale systems.
              McKinsey identifies fault tolerance as an inflection point for private investment, and the independent
              launch coverage notes that Wukong-180 is not fault tolerant. Export controls covering quantum computers,
              components, software, and technology add a cross-border constraint, especially for supply chains and
              international customers. The central market risk is therefore not lack of interest; it is delayed
              conversion from experiments to repeatable, budgeted production workloads.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits preserve separate market lenses and buyer roles rather than combining unlike populations into
              a single funnel. Values are reported as published and should not be read as Origin-specific revenue, ARR,
              or market share. Where public material does not disclose a number, the gap is explicit. The buyer map is a
              diligence hypothesis grounded in disclosed product surfaces, not a verified customer roster or contract
              segmentation. The sizing exhibit likewise distinguishes observed sector revenue from potential economic
              impact and leaves Origin-specific conversion inputs unresolved.
            claimRefs:
              - CM005
              - CM007
              - CM011
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market opportunity is real but not yet measurable at Origin level
            body: >-
              Sector revenue and commercial-use-case evidence support an investable category, but no retained source
              discloses Origin's pricing, recurring revenue, utilization, or market share. Valuation work should
              therefore use scenario-based adoption assumptions rather than a headline quantum TAM.
            calloutType: insight
            claimRefs:
              - CM005
              - CM008
              - CM009
          - type: callout
            title: Technical and geopolitical friction can defer conversion
            body: >-
              Fault-tolerance uncertainty and export controls can delay enterprise production adoption even as research
              access expands. The near-term buyer is more likely to fund experimentation or co-development than
              guaranteed production capacity.
            calloutType: risk
            claimRefs:
              - CM010
              - CM012
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum's addressable competitive set is broader than superconducting hardware alone. The company's
              own materials describe a stack spanning superconducting systems, chips, dilution refrigerators, control
              systems, software, cloud services, applications, security, and education. That makes IBM Quantum, Rigetti,
              Google Quantum AI, Quantinuum, IonQ, IQM, and Oxford Quantum Circuits relevant technology peers, while
              cloud aggregators and internal research teams are substitutes for some buyers. An independent profile
              similarly describes Origin as a full-stack vendor, but the comparison is not an independent benchmark of
              performance. For a buyer, the practical alternatives are (i) buying or accessing a complete platform, (ii)
              using a multi-vendor cloud, (iii) selecting another modality, or (iv) retaining classical simulation and
              research workflows until quantum utility is demonstrated. The competitive question is therefore not simply
              qubit count; it is whether a provider can deliver reliable, usable workloads with acceptable access,
              software, support, and supply-chain risk.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
