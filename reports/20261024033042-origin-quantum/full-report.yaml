      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The official leadership page names Guo Guangcan as co-founder and chief technology consultant and Guo
              Guoping as chief scientist and founder, linking the company to Chinese quantum-information research. It
              also names Kong Weicheng as chairman-in-office and director of the quantum measurement and control center,
              Zhang Hui as general manager and legal representative, and functional leaders for chips, software, cloud,
              and intellectual property. This shows coverage across core technical and commercial functions and
              indicates that the founders remain connected to the scientific and technical narrative. However, the
              assigned evidence does not identify a board roster, shareholder control rights, independent directors,
              executive turnover, or succession arrangements. Key-person dependence therefore remains a material
              diligence question even though functional coverage appears broad.
