        - Trapped-ion platform with acquisitions extending its product scope.
        - Different modality; losses and high valuation limit direct economic comparability.
      - - Quantinuum
        - Private / IPO alternative-modality peer
        - $30.9 million 2025 revenue and a $14.3 billion June 2026 IPO target valuation were reported.
        - Institutional and enterprise users of trapped-ion hardware and software.
        - Honeywell lineage and integrated trapped-ion platform.
        - AInvest calculated about 463 times 2025 revenue at the target valuation.
      - - D-Wave
        - Public adjacent quantum provider
        - $24.6 million FY2025 revenue from more than 135 customers was reported.
        - Enterprise optimization buyers using QCaaS or systems.
        - Annealing plus gate-model expansion and recurring QCaaS.
        - System-sale timing can make quarterly revenue lumpy; FY2025 remained loss-making.
      - - PsiQuantum / neutral-atom private entrants
        - Likely entrants / architecture alternatives
        - >-
          Lambda Finance listed PsiQuantum at about $6 billion and Atom, Pasqal, and QuEra at roughly $500 million-$700
          million.
        - Future fault-tolerant and specialized quantum workloads.
        - Photonic and neutral-atom approaches could change scaling economics.
        - Timelines, modality, and private valuations are not comparable to Origin operating performance.
      - - Internal build / classical simulation
        - Status quo substitute
        - No external vendor funding or spend is required in assigned evidence.
        - Buyers validating algorithms or delaying quantum commitment.
        - Origin itself offers full-, partial-, single-amplitude, and noise-inclusive simulators.
        - Can defer paid hardware usage; buyer cost and switching data remain unavailable.
