  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and observable traction
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum presents a vertically integrated offer spanning superconducting quantum computers, quantum
              hardware, software, industry applications, post-quantum security, education, and cloud access. Its cloud
              surface separates quantum-computing access, hybrid quantum/classical services, and dedicated cloud
              platforms, which suggests multiple contract shapes rather than one uniform SaaS stream. The company also
              describes application support and technical guidance, so services may be bundled with compute access.
              Public evidence confirms the offer architecture, not revenue recognition, realized price, customer
              concentration, or recurring versus project revenue. An investment analysis reports 50 million-plus global
              cloud visits and 500,000-plus tasks, while the company site describes worldwide access; these are activity
              indicators, not paid-user, billable-usage, ARR, or revenue measures.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
