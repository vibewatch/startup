            title: Underwrite workload economics, not qubit count
            body: >-
              Competitive diligence should request workload-specific benchmarks, access and SLA terms, repeat-customer
              evidence, and comparable economics before treating platform breadth as a durable moat.
            calloutType: recommendation
            claimRefs:
