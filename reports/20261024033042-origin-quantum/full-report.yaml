  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Origin Quantum's product is best understood as a workflow rather than a single processor. Its cloud
              surface combines access to quantum computers, hybrid quantum and classical resources, dedicated cloud
              deployments, development tools, one-click applications, and learning resources. This lets a researcher or
              enterprise team move from education and algorithm development to simulator testing and execution on a
              remote superconducting system. The official cloud page also describes practical implementation guidance
              and technical support, suggesting a services layer around compute access rather than a bare hardware
              rental. Public materials do not disclose contract terms, realized pricing, support response targets, or a
              customer-level conversion from cloud use to paid production workloads.
            claimRefs:
