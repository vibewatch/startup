schemaVersion: "report-v2"
artifact: valuation
slug: origin-quantum
runDate: 2026-10-24
company:
  name: Origin Quantum
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a credible full-stack quantum platform and a widening
    product surface, but it does not disclose a current Origin Quantum valuation,
    revenue base, cash position, or cap table. The appropriate stance is
    research-more: preserve upside exposure only after financing terms and
    commercial proof are verified.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive case is strategic and technical rather than financial. Origin
      Quantum describes a full-stack offering spanning superconducting systems,
      chips, control systems, software, applications, cloud access, education, and
      post-quantum security. Its official history also records a 180-bit Wukong
      launch in 2026 and cloud access for users worldwide. Those facts support a
      platform thesis, but they are company-described capabilities, not audited
      demand or profitability. The anti-thesis is therefore decisive: no retained
      source supplies Origin Quantum revenue, margin, cash, customer concentration,
      or a priced financing valuation. A quality business may still be an
      unattractive security at an undisclosed price.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV001, TV002]
  - id: price-discipline
    title: Price discipline and comparable signals
    body: >-
      Caplight records a historical fundraising sequence from seed through Series B
      and names investors, but leaves the amount-raised and valuation cells blank on
      the accessible page. That is useful chronology, not a mark-to-market
      valuation. Public quantum comparables show why a direct multiple would be
      unsafe: Lambda Finance describes pure-play prices as narrative-sensitive and
      reports large drawdowns, while Yahoo Finance shows QUBT with a $1.81 billion
      market cap, $9.82 million trailing revenue, negative trailing operating cash
      flow, and a 191.79 price-to-sales ratio as of its displayed dates. These are
      sector reference points, not Origin Quantum comps, and should inform downside
      discipline rather than create a fabricated range.
    claimRefs: [CV007, CV008, CV009, CV010, CV011]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence asks
    body: >-
      A bull case requires verified paid usage, repeatable cloud or system revenue,
      improving hardware economics, and a financing price that recognizes technical
      progress without assuming fault-tolerant commercialization. A base case is
      continued engineering and ecosystem expansion with private-company opacity,
      making a track or research-more call rational until terms are available. A
      bear case combines high capital intensity, delayed commercial advantage, a
      down round, or dilution before audited traction; the retained sector evidence
      explicitly flags runway, burn, and dilution as material considerations. Exit
      readiness is not established: diligence still needs the latest term sheet,
      cap table and preferences, audited financials, customer contracts, cash
      runway, and independent technical validation.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Evidence-based view, Decision implication]
    rows:
      - [Recommendation, research-more, Do not underwrite a buy without price and traction evidence]
      - [Confidence, medium-low, The platform evidence is stronger than the financial evidence]
      - [Risk rating, high, Capital intensity and opacity leave material downside unmeasured]
      - [Valuation stance, unknown, No current Origin Quantum valuation or priced round is disclosed in the retained sources]
    notes: >-
      Qualitative assessment based on retained public sources; no current security
      price, cap table, or audited financial statements were available.
    claimRefs: [CV001, CV007, CV012, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Full-stack differentiation, Official materials describe hardware software cloud and applications, Independent customer revenue and renewal evidence]
      - [Engineering momentum, Official history records Wukong-180 launch and prior product releases, Third-party benchmark and reliability data]
      - [Commercialization potential, Cloud and industry-application offerings are described, Audited revenue mix and paid usage by cohort]
      - [Price opacity, Accessible financing chronology omits amount and valuation cells, Signed term sheet cap table and preference schedule]
      - [Downside exposure, Sector sources emphasize burn volatility and dilution risk, Cash runway and financing plan through the next milestone]
    notes: >-
      Company-issued product claims are separated from the independent evidence
      needed to convert them into an investable valuation thesis.
    claimRefs: [CV002, CV003, CV007, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Trigger]
    rows:
      - ["Bull", "Paid cloud and system demand is verified; technical milestones translate into repeatable revenue", "Upside is possible but no defensible numeric range can be set", "Low-to-medium", "Signed contracts and audited growth with stable or improving margins"]
      - ["Base", "Engineering and ecosystem expansion continue while financing and customer data remain private", "Track or research-more until price discovery", "Medium", "Current opacity persists but no adverse financing event occurs"]
      - ["Bear", "Commercial advantage is delayed and capital needs force dilution or a down round", "Downside cannot be bounded without preferences and cash runway", "Medium", "Missed milestones, weak renewals, short runway, or punitive terms"]
      - ["Exit readiness", "An IPO or strategic exit requires disclosure and market validation beyond the retained sources", "No exit multiple or target return is supportable", "Unknown", "Filing, audited statements, or signed transaction materials"]
    notes: >-
      Scenarios are qualitative because the retained pool contains no Origin Quantum
      revenue, cash, share-count, preference, or current valuation evidence.
    claimRefs: [CV010, CV011, CV013, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      A credible platform thesis reaches a research-more recommendation because
      price and commercial proof remain unresolved.
    data:
      nodes:
        - {id: scale, label: "Full-stack scale", value: "Hardware, software, cloud, applications"}
        - {id: proof, label: "Technical proof", value: "Wukong-180 and product history"}
        - {id: demand, label: "Commercial proof", value: "Revenue and paid usage not disclosed"}
        - {id: price, label: "Price discovery", value: "Current valuation not disclosed"}
        - {id: risks, label: "Downside checks", value: "Runway, dilution, preferences unresolved"}
        - {id: call, label: "Recommendation", value: "Research-more"}
      edges:
        - {from: scale, to: proof}
        - {from: proof, to: demand}
        - {from: demand, to: price}
        - {from: price, to: risks}
        - {from: risks, to: call}
    claimRefs: [CV001, CV003, CV007, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive call
    body: >-
      Research-more is the strongest supportable recommendation: technical breadth
      is visible, but no current price, audited economics, or financing terms are
      retained. A buy call should wait for those primary documents.
    claimRefs: [CV007, CV012, CV016]
  - calloutType: risk
    title: Main valuation risk
    body: >-
      The key risk is not merely technology failure; it is paying an unknowable
      private-market price before cash needs, dilution, liquidation preferences,
      and customer economics can be tested.
    claimRefs: [CV013, CV014, CV015]
