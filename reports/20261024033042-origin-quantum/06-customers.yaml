schemaVersion: report-v2
artifact: customers
slug: origin-quantum
runDate: 2026-10-24
company:
  name: Origin Quantum
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows a broad developer-and-researcher access model around Origin Quantum's
    cloud, education, and application stack, plus a named Spain collaboration that may become a
    major international deployment. Evidence does not establish paying-customer counts, renewal,
    retention, concentration, or realized outcomes, so commercial durability remains unproven.
sections:
  - id: customer-segments
    title: Customer segments and buying surfaces
    body: >-
      Origin Quantum presents a multi-sided customer model rather than a single software buyer.
      Its public site names researchers, developers, businesses, universities, and students as
      users of hardware, cloud access, programming tools, simulators, applications, and education
      products. The company says its stack spans quantum computers, quantum cloud, programming
      software, simulators, QPanda3, VQNet, application packages, and industry solutions; these
      are company-described offerings, not independent measures of adoption. The cloud surface
      separates computing access, hybrid quantum-classical computing, dedicated deployments,
      learning resources, development tools, and application support, which suggests distinct
      self-serve, institutional, and enterprise procurement paths. The Quantum Insider profile
      independently describes the business as B2B with subscription and usage-based revenue, but
      its detailed customer and QCaaS fields are paywalled. No source supplies a reconciled active
      account count, payer mix, average contract value, or revenue by segment.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption trajectory and named deployment proof
    body: >-
      The strongest public adoption signals are usage and deployment claims, not contracted
      revenue. Origin's company history reports that Origin Wukong global visits exceeded 40
      million in January 2026, while the independent Q-Day is Coming article reports more than
      50 million remote visits, users in more than 160 countries, and over 900,000 completed
      tasks for the predecessor Wukong; these figures differ in date, scope, and provenance and
      should not be combined into one KPI. A Spain collaboration reported by Global Construction
      Review and Xinhua describes a proposed integrated center combining supercomputing, quantum,
      AI, and cloud computing, with a planned 1,000-megawatt capacity; the reports describe an
      agreement and plans, not an operating customer deployment or realized capacity. The official
      site also lists university education, research, and industry application surfaces. These
      signals support reach and partner interest, but they do not prove paid production use,
      utilization, renewal, or outcome economics.
    claimRefs: [CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion
    title: Retention, expansion, and concentration evidence
    body: >-
      The public record is materially weaker on durability than on reach. Neither the official
      customer-facing pages nor the independent profile discloses NRR, GRR, churn, renewal rates,
      contract duration, cohort retention, customer concentration, or customer-level revenue.
      The Spain agreement could create an international expansion path, but the independent report
      frames it as a collaboration to explore construction and applications, while company-linked
      reporting describes planned exports and hybrid-cloud support; neither establishes a signed
      recurring commercial contract or production SLA. The company says its platform supports
      learning, tools, computing power, and application development, which could facilitate
      expansion from education or experimentation into enterprise workloads, but no source
      demonstrates conversion between those stages. Investors should therefore treat usage totals,
      logos, and announced collaborations as leading indicators only. A paying-customer roster,
      contract-backed references, renewal data, service-level history, and concentration schedule
      are required before underwriting durable revenue.
    claimRefs: [CU011, CU012, CU013, CU014]
  - id: customer-risks
    title: Customer diligence implications
    body: >-
      Customer quality is promising but opaque. The breadth of the product surface may widen the
      funnel across researchers, universities, developers, and enterprises, while the proposed
      Spain center offers a concrete cross-border partner route. Conversely, the same breadth can
      conceal whether activity is educational, free research access, grant-supported use, pilot
      work, or recurring paid production workloads. The public evidence also does not identify
      customer-level dependence on Origin's cloud, uptime commitments, procurement friction, or
      the realized performance of industry applications. Before assigning a stronger commercial
      view, diligence should reconcile Wukong visit/task definitions, separate unique users from
      sessions, obtain paid-account and cohort exports, sample named reference calls, verify the
      Spain project's contractual and operational status, and review SLA, utilization, churn, and
      top-account concentration data.
    claimRefs: [CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation and buying surfaces
    columns: [Segment, Buyer/user, Public use case or surface, Scale/revenue evidence, Diligence gap]
    rows:
      - ["Researchers and developers", "Researcher/developer", "Cloud quantum computing, simulators, QPanda3, VQNet", "Company says it serves thousands of researchers, developers, and businesses; no paid-account denominator", "Separate registered users, active users, and paying users"]
      - ["Universities and education", "University/student/instructor", "Education platforms, learning resources, teaching systems", "Official site describes education solutions and learning products; no education contract or revenue disclosure", "Obtain institution list, contract type, renewal, and usage"]
      - ["Enterprise industry users", "Business application owner", "Finance, chemistry, biomedicine, AI, and other industry applications", "Company lists applications and support; no customer-level outcome or recurring revenue evidence", "Verify production deployment, ROI, workload volume, and buyer"]
      - ["Dedicated infrastructure customers", "IT/procurement/innovation team", "Dedicated quantum cloud and customized hybrid cloud", "Cloud page describes dedicated services; no disclosed deployment count or ACV", "Confirm signed commitments, SLA, utilization, and concentration"]
      - ["International partners", "Partner/infrastructure sponsor", "Spain integrated computing center and quantum-resistant encryption collaboration", "Announced project with planned 1,000 MW center; not proof of operating revenue", "Verify contract, financing, milestones, and Origin's delivery scope"]
    notes: >-
      Segments are reconstructed from official product and education descriptions plus independent
      profile and partner reporting. Public sources do not provide a reconciled customer or revenue
      denominator; company statements are not treated as independent customer verification.
    claimRefs: [CU001, CU002, CU003, CU004, CU008]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date or period, Source posture, Confidence, Implication, Missing denominator]
    rows:
      - [Global Origin Wukong visits, "More than 40 million", "January 2026 company history", company-claimed, medium, "Indicates broad reach or traffic", "Unique users, sessions, geography, and paid share"]
      - [Origin Wukong remote visits, "More than 50 million", "Reported in 2026 article; predecessor scope", third-party-reported, medium, "Independent corroboration of material remote reach", "Definition, deduplication, period, and paid share"]
      - [Countries reached, "More than 160 countries", "Reported in 2026 article; predecessor scope", third-party-reported, medium, "Indicates international accessibility", "Active users, workloads, and revenue by geography"]
      - [Completed quantum tasks, "Over 900,000", "Reported in 2026 article; predecessor scope", third-party-reported, medium, "Indicates workload activity", "Task success, customer identity, compute mix, and revenue"]
      - [Spain center planned capacity, "1,000 MW", "March 2025 agreement reporting", third-party-reported, low, "Signals partner ambition and potential expansion", "Financing, construction status, quantum allocation, and operating date"]
    notes: >-
      Values are not directly comparable: visits, countries, tasks, and planned facility capacity
      use different units, scopes, and time bases. No conversion rate, revenue linkage, or active
      customer denominator is inferred.
    claimRefs: [CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Counterparty, Segment, Deployment or use case, Production vs pilot, Outcome evidence, Limitation]
    rows:
      - ["ChinaLink ESGt", "International infrastructure partner", "Proposed Spain integrated center combining supercomputing, quantum, AI, and cloud", "Agreement / planned collaboration", "Parties describe joint development and application exploration", "No operating center, signed recurring contract, or realized capacity shown"]
      - [Anhui University, University / research partner, Quantum detector for AI-generated image detection, "Company-reported partnership", "Official history names the partnership and application", "No independent outcome, procurement value, or usage disclosed"]
      - [Ping An Bank, Financial-services research partner, Joint quantum-algorithm research in finance, "Company-reported research collaboration", "Official history records the research activity", "No production deployment, commercial terms, or measured benefit disclosed"]
      - [China Unicom, Telecom partner, Strategic cooperation agreement, "Agreement", "Official history records strategic cooperation", "No customer status, workload, revenue, or renewal evidence"]
      - [China Mobile, Telecom partner, Cooperation and quantum-industry-alliance relationship, "Agreement / alliance relationship", "Official history records cooperation", "No contract scope, usage, or commercial outcome disclosed"]
    enumerationScope:
      coverage: sample
      basis: >-
        Publicly named counterparties found in the assigned official company history and independent
        Spain collaboration reports through the 2026-10-24 run date; this is not a complete roster.
    notes: >-
      Enumeration is a public-evidence sample, not an exhaustive customer list. Several entries
      are partners or research relationships rather than verified paying production customers.
    claimRefs: [CU010, CU012, CU013, CU014]
figures:
  - id: FU001
    title: Customer journey from access to expansion
    type: journey-map
    summary: Public evidence supports a reach-to-partner journey, but not conversion or retention rates.
    data:
      nodes:
        - id: discovery
          label: Learn and discover
          touchpoints: [Learning resources, education products, quantum simulators]
        - id: development
          label: Build and test
          touchpoints: [QPanda3, VQNet, graphical programming, application tools]
        - id: compute
          label: Run workloads
          touchpoints: [Origin Wukong, quantum cloud, hybrid cloud, dedicated cloud]
        - id: application
          label: Apply to industry
          touchpoints: [Finance, chemistry, biomedicine, AI, quantum-resistant encryption]
        - id: expansion
          label: Expand through institution or partner
          touchpoints: [University programs, alliances, Spain integrated computing center proposal]
        - id: renewal
          label: Renew and scale
          touchpoints: ["Renewal, retention, and concentration evidence not publicly disclosed"]
    claimRefs: [CU001, CU003, CU008, CU010, CU012, CU015]
callouts:
  - calloutType: strength
    title: Broad access funnel
    body: >-
      Origin Quantum exposes learning, development, cloud, hardware, and application surfaces that
      can support progression from experimentation to institutional or enterprise workloads.
    claimRefs: [CU001, CU003]
  - calloutType: risk
    title: Reach is not retention
    body: >-
      Public visit and task counts do not disclose paid conversion, renewal, cohort retention,
      utilization, or concentration; these are material underwriting gaps.
    claimRefs: [CU006, CU007, CU011, CU015]
