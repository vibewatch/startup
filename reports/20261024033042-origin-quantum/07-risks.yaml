schemaVersion: "report-v2"
artifact: risks
slug: origin-quantum
runDate: 2026-10-24
company:
  name: Origin Quantum
chapter:
  number: 7
  title: Risks
  summary: >-
    Origin Quantum's vertically integrated superconducting stack and state-linked ecosystem create
    strategic resilience, but public evidence leaves material uncertainty around supply-chain scale,
    commercialization, reliability, security, and geopolitical access. The principal investment risk
    is not a documented incident; it is the inability to verify whether engineering claims translate
    into repeatable, economically durable deployments.
sections:
  - id: strategic-and-regulatory
    title: Strategic, regulatory, and geopolitical exposure
    body: >-
      Origin Quantum's stated objective is an independently controllable, full-stack quantum
      ecosystem, and public third-party coverage describes the company as pursuing a sovereign
      supply chain. That positioning can reduce dependence on foreign components, but it also
      embeds the business in state-priority spending, export-control divergence, and a fragmented
      international technology market. Entangled Future reports that controls introduced from 2022
      restrict transfers of certain quantum technologies, components, and software to Chinese
      entities, while CNAS describes foreign dependence, insufficient capacity, and performance or
      scalability gaps as separate supply-chain vulnerabilities. These sources do not establish a
      violation by Origin Quantum. They do establish a diligence risk: map component provenance,
      licensing, customer jurisdictions, and the effect of cross-border controls before treating
      international cloud access or partner growth as durable.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operating-and-technical
    title: Operating, reliability, and technical execution risk
    body: >-
      The company presents hardware, control systems, software, cloud access, applications, and
      post-quantum security as an integrated portfolio. Integration may improve control over the
      stack, but it increases execution surface area: cryogenic and control components, fabrication,
      software, cloud operations, and application support must scale together. CNAS warns that
      quantum-grade inputs can face thin supply, high cost, long lead times, and supplier
      consolidation; MIT's summary likewise notes sparse and difficult-to-gather data in this new
      field. Origin's public pages describe products and a 180-qubit system but do not disclose
      uptime, SLA performance, yield, error-rate distributions, incident history, or fault-tolerance
      milestones. The risk therefore remains an evidence gap rather than an asserted outage or
      defect. Require system-level reliability logs, independent benchmark protocols, and customer
      reference calls before assigning high confidence to production readiness.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependencies-and-thesis-breaks
    title: Partner, financial, and thesis-break conditions
    body: >-
      Origin Quantum's ecosystem model spans universities, research institutions, industry
      alliances, cloud users, suppliers, and public-sector or strategic capital. The official
      company history records alliances and collaborations, while the Quantum Insider profile
      confirms that substantial operating detail remains behind a premium access boundary. This
      leaves uncertainty about counterparty concentration, contract economics, recurring revenue,
      cash runway, and the share of activity that is research, education, pilot, or production.
      A failure of a key supplier, capital provider, cloud customer, or public program could
      therefore affect both revenue conversion and technical roadmaps. No assigned source verifies
      a current default, fraud, litigation, or customer loss; those absences are not evidence that
      the risks are absent. The appropriate stance is to monitor measurable breakpoints and demand
      primary documentation rather than infer resilience from logos, visits, or ecosystem claims.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
