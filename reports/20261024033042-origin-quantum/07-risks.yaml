      - ["Security and application claims outpace validated use", "Medium", "Medium-high", "Unclear", "Medium-high", "No assigned source verifies security outcomes or production workload economics"]
      - ["Talent and data scarcity constrain execution", "Medium", "Medium", "Unclear", "Medium", "No public staffing, retention, or operating-capacity evidence"]
    notes: "Likelihood and severity are risk-register judgments anchored to the cited supply-chain and data-quality evidence; they are not measured incident frequencies. Unresolved gaps are explicitly not findings of failure."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration signal, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
