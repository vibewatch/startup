callouts:
  - calloutType: risk
    title: Primary thesis risk
    body: "The central risk is an evidence gap around repeatable, reliable, economically meaningful deployments: public materials describe a broad stack, but do not provide the operating denominators needed to test production resilience."
    claimRefs: [CR006, CR007, CR011]
  - calloutType: assumption
    title: What would change the view
    body: "A current export-control map, audited financial and runway package, independent reliability benchmarks, and named paying-customer references would materially reduce residual exposure."
    claimRefs: [CR004, CR007, CR011, CR012]
