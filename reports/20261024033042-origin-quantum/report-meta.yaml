  topStrengths:
    - Broad full-stack platform spanning hardware, control, software, cloud, applications, security, and education.
    - Current product momentum includes the reported 2026 launch of the 180-qubit Wukong-180 system.
    - Domestic ecosystem reach and strategic financing can support long-duration engineering and commercialization.
  topRisks:
    - Audited revenue, margins, cash, burn, runway, and segment economics are not publicly disclosed.
    - Paying-customer counts, contract values, renewals, retention, and concentration remain unverified.
