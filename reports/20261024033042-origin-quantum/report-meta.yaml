companyProfile:
  summary: >-
    Origin Quantum is a Hefei-based private quantum-computing company founded in 2017. Its public product scope spans
    superconducting systems, chips, measurement and control, operating systems, cloud services, developer tools,
    applications, security, and education. Current evidence supports meaningful technical and ecosystem progress but not
    audited commercial scale.
