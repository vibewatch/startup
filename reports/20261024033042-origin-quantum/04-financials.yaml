        - [applications, contracts]
        - [contracts, financials]
    claimRefs: [CI001, CI002, CI013, CI016]
callouts:
  - calloutType: strength
    title: Strategic financing capacity
    body: A reported nearly three-billion-yuan Series D, led by state-owned investment vehicles, would materially extend development and commercialization capacity if confirmed in primary financing documents.
    claimRefs: [CI009, CI013]
  - calloutType: risk
    title: Commercial conversion remains unverified
    body: Cloud visits and completed tasks demonstrate activity but do not establish paid usage, recurring revenue, margin, customer concentration, or cash runway.
    claimRefs: [CI004, CI011, CI012]
  - calloutType: recommendation
    title: Underwrite only after financial disclosure
    body: Keep the financial stance at research-more until audited statements, pricing and contract evidence, unit economics, and the latest financing terms are available.
    claimRefs: [CI014, CI016]
