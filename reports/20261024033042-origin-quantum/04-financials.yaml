        - id: cloud
          label: "Cloud access"
          detail: "Quantum, hybrid, and dedicated cloud services"
        - id: applications
          label: "Applications and support"
          detail: "Industry applications, development tools, implementation guidance, and technical support"
        - id: contracts
          label: "Contracts and usage"
          detail: "Pricing, utilization, renewals, and customer concentration are not disclosed"
        - id: financials
          label: "Recognized revenue and gross profit"
          detail: "Not disclosed in assigned evidence; requires audited statements and contract data"
      edges:
        - [capital, hardware]
