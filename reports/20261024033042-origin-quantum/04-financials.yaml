company:
  name: Origin Quantum
chapter:
  number: 4
  title: Financials
  summary: Origin Quantum has a multi-product monetization surface and substantial strategic financing support, but public evidence does not disclose audited revenue, realized pricing, gross margin, cash, burn, or runway. The underwriting case therefore depends on validating whether cloud usage, hardware and services can convert technical reach into repeatable commercial revenue without continued financing dependence.
sections:
  - id: revenue-model
    title: Revenue model and observable traction
    body: Origin Quantum presents a vertically integrated offer spanning superconducting quantum computers, quantum hardware, software, industry applications, post-quantum security, education, and cloud access. Its cloud surface separates quantum-computing access, hybrid quantum/classical services, and dedicated cloud platforms, which suggests multiple contract shapes rather than one uniform SaaS stream. The company also describes application support and technical guidance, so services may be bundled with compute access. Public evidence confirms the offer architecture, not revenue recognition, realized price, customer concentration, or recurring versus project revenue. An investment analysis reports 50 million-plus global cloud visits and 500,000-plus tasks, while the company site describes worldwide access; these are activity indicators, not paid-user, billable-usage, ARR, or revenue measures.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: monetization-and-sales
    title: Pricing, GTM, and sales-efficiency proxies
    body: "The public cloud page exposes service categories and application access but no list price, usage tariff, minimum commitment, discount schedule, or contract term. That absence prevents a conventional CAC-payback or net-revenue-retention calculation. The most credible GTM proxy is product breadth plus distribution: cloud access lowers initial deployment friction, while dedicated cloud and application support can support higher-value enterprise or institutional engagements. A reported Spain arrangement indicates an international channel or project route, but the available description says technical and commercial details remain undisclosed. Underwriting should treat the current evidence as a monetization hypothesis and request contracts, invoices, cohort retention, sales-cycle data, and channel economics before assigning efficiency."
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: cost-structure-and-capital
    title: Cost structure and financing dependency
    body: "Origin Quantum's stated scope implies meaningful fixed and variable costs: chip and control-system R&D, dilution-refrigerator and hardware engineering, cloud infrastructure, application support, and potentially pilot manufacturing. A Dealroom report says a nearly three-billion-yuan Series D is intended for pilot production lines on 12-inch wafers, next-generation superconducting R&D, and commercialization. That is evidence of planned capital use, not evidence of cash on hand or operating burn. Independent coverage also describes quantum computing as a nascent industry with modest near-term revenues, while an adverse European policy analysis highlights dual-use export controls and dependency concerns. No assigned source supplies audited statements, gross margin, working capital, capex, debt, cash runway, or financing trigger; those omissions are material to solvency underwriting."
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: The financial picture is strategically well funded but commercially unproven in the public record. A reported Series D valuation above 20 billion yuan and roughly 410 million dollars would provide a strong financing signal if verified, yet the same source describes a company still operating in a pre-commercial market and dependent on state-backed capital. A separate market-intelligence article presents older and conflicting funding and valuation figures, including a 165.7 million dollar total-funding figure and a 1-billion-dollar-plus valuation; these discrepancies should not be reconciled by averaging them. Public-market quantum comparables show that investor pricing can be volatile, while export-control analysis creates a route, supply, and partnership risk for international expansion. The investment stance is research-more until management supplies audited financials, unit economics, cash and debt schedules, customer-level revenue evidence, and terms for the latest financing.
    claimRefs: [CI013, CI014, CI015, CI016]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism described in sources, Public value/status, Quality and underwriting implication]
    rows:
      - [Quantum compute cloud, "Access to real quantum computers and development tools", "Available to users worldwide; no price disclosed", "Company-described offer; validate billable usage and recurring revenue"]
      - [Hybrid and dedicated cloud, "Quantum, classical, and intelligent computing; customized dedicated platform", "Three service categories; no contract terms disclosed", "Company-described offer; request bookings, utilization, and gross margin by service"]
      - [Hardware and systems, "Superconducting computers, chips, dilution refrigerators, and control systems", "Product portfolio described; no shipment or revenue disclosure", "Potential project or product revenue; request backlog, delivery cost, and warranty terms"]
      - [Applications and support, "Industry applications, algorithms, implementation guidance, and technical support", "Use cases described; no paid-customer or renewal data", "May be services or bundled value; separate software, services, and compute revenue"]
    notes: Public company and third-party descriptions identify mechanisms, not recognized revenue; null financial values mean the assigned evidence did not disclose them.
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Offer, List or contract price, Realized pricing / discount, Diligence ask]
    rows:
      - [Quantum computing cloud, null, null, "Obtain tariff, billing unit, minimum commitment, and usage cohort data"]
      - [Hybrid computing cloud, null, null, "Obtain allocation rules, customer contracts, and gross margin by workload"]
      - [Dedicated quantum cloud, null, null, "Obtain implementation fee, recurring fee, term, and renewal schedule"]
      - [International center / partner route, null, null, "Obtain signed agreement, revenue share, capex responsibility, and export-control obligations"]
    notes: No assigned source publishes list or realized prices; nulls are evidence gaps, not zero prices or free service.
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI003
    title: Unit economics and capital-adequacy checklist
    columns: [Metric, Public value, Confidence, Why it matters / diligence ask]
    rows:
      - ["Revenue or ARR", null, Low, "Cannot test recurring quality; request audited revenue bridge and contract-backed ARR definition"]
      - ["Gross margin", null, Low, "Hardware, cloud, and services may have different cost curves; request segment margin and hosting costs"]
      - ["Cash, burn, and runway", null, Low, "Cannot assess financing dependency; request latest balance sheet, monthly burn, and runway case"]
      - ["CAC, payback, and retention", null, Low, "Cannot assess sales efficiency; request cohort bookings, CAC by channel, payback, churn, and renewals"]
    notes: All quantitative unit-economics fields are unavailable in the assigned public evidence; each null requires the named management diligence package.
    claimRefs: [CI009, CI010, CI011, CI012]
