      - number: '5.3'
        title: Maturity, differentiation, and roadmap evidence
        blocks:
          - type: paragraph
            body: >-
              Scale and deployment evidence are stronger than product-roadmap evidence. Sagard says the offering is
              supported across three continents, and Oakley's 2024 annual report identifies 700 cybersecurity experts.
              The same annual report says I-TRACING acquired more than 70 new customers from a base of about 250 during
              2024 and launched a dedicated mid-market sales stream, indicating that the delivery model had moved beyond
              a narrow large-enterprise posture. Differentiation appears to rest on service breadth, specialist
              staffing, integration capability, and orchestration of established platforms rather than on publicly
              demonstrated proprietary software. The December 2025 fusion of I-Tracing Group into I-TRACING and the
              earlier APALIA absorption may simplify the legal operating perimeter, but the retained evidence does not
              show a current module roadmap, release cadence, end-of-life policy, or integration plan for acquired
              capabilities.
            claimRefs:
              - CE005
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Trust, compliance, and technical-risk posture
        blocks:
          - type: paragraph
            body: >-
              I-TRACING's privacy statement defines the group as a processor when handling client-entrusted personal
              data and names technical and organizational safeguards including firewalls, network segmentation, physical
              hosting, named access controls, procedures, and security policies. These are useful control assertions,
              but they are company-issued and do not substitute for independent certification scope, penetration-test
              results, SOC reports, availability history, or breach disclosure. NIS2 raises the compliance burden for
              many target customers through risk-management and significant-incident reporting obligations, which can
              support demand while also increasing the evidence customers will expect from their MSSP. No retained
              source exposes a public repository, package, API forum, release history, status page, or
              practitioner-community signal attributable to I-TRACING; developer adoption and operational reliability
              therefore remain unverified rather than assumed absent.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad service coverage has external operating proof
            body: >-
              Investor reporting, independent coverage, registry data, and procurement records collectively support a
              services platform that spans design, integration, and managed operations rather than a marketing-only
              catalog.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE009
              - CE010
              - CE011
          - type: callout
            title: Reliability and proprietary technology remain opaque
            body: >-
              Public evidence does not quantify availability, response times, detection quality, customer deployment
              effort, certification coverage, or the share of value delivered by proprietary technology versus
              third-party platforms.
            calloutType: risk
            claimRefs:
              - CE004
              - CE007
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying centers
        blocks:
          - type: paragraph
            body: >-
              I-TRACING serves a broad enterprise-security buying center rather than a single end user. The addressable
              buyer set includes CISOs, security operations leaders, identity teams, infrastructure and cloud owners,
              risk functions, and public procurement teams. Its public positioning spans consulting, implementation,
              managed detection and response, identity and access management, cloud security, and data protection, which
              supports both project-led and recurring managed-service entry points. Company materials emphasize large
              enterprises, while Oakley's 2024 report says a dedicated mid-market sales stream was added to the
              historical large-enterprise focus. Public awards further show demand from transport, housing, media, and
              regional institutional buyers. These categories establish buyer breadth, but no public source allocates
              customers or revenue by segment, geography, service line, or contract type.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU011
              - CU012
              - CU013
      - number: '6.2'
        title: Adoption trajectory and operating scale
        blocks:
          - type: paragraph
            body: >-
              The strongest historical adoption disclosure is Oakley's report that I-TRACING acquired more than 70 new
              customers during 2024 from a base of approximately 250. The company's current homepage separately claims
              more than 600 enterprise customers, 2.3 million protected users, 25 terabytes of logs processed per day,
              and 400 million events processed per day. Together these figures indicate materially larger reach and
              workload than the historical standalone base. They do not, however, form a clean cohort bridge: the
              current count may reflect acquisitions, partner combinations, scope changes, and different definitions of
              an enterprise customer. Workload figures also lack customer-level distributions, so they cannot
              demonstrate average deployment depth or retention. The trajectory is therefore positive but only
              directionally comparable.
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
              - CU008
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU015
              - CU016
      - number: '6.3'
        title: Named customer and procurement proof
        blocks:
          - type: paragraph
            body: >-
              Public proof goes beyond an undifferentiated logo wall, but its evidentiary strength varies. Matmut's
              identity leader describes an IAM and cybersecurity relationship built over years, and Motul's CIO
              describes I-TRACING as raising the company's cybersecurity level; both are customer quotations hosted by
              I-TRACING and therefore confirm named relationships without independently quantifying outcomes. Public
              procurement records are firmer on commercial structure: Pappers lists a five-year, EUR13 million
              COMUTITRES award, a four-year, EUR2.02575 million Action Logement CIAM SaaS award, and a four-year,
              EUR280,000 CCI Paris Ile-de-France security-audit and incident-response award. Award records still do not
              prove full deployment, realized value, renewal, or current utilization.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The evidence supports multi-surface expansion potential: customers can enter through assessment or
              implementation work and extend into identity, cloud, data protection, or continuous managed detection.
              External requirements reinforce the mechanism. Swift's Customer Security Programme describes mandatory
              controls, independent assessment, and attestation workflows, while ENISA's NIS2 guidance maps regulatory
              requirements to implementation evidence; both can create recurring compliance and assurance work for
              security providers. Durability remains unverified. No assigned source discloses NRR, GRR, churn, renewals,
              contract backlog, customer-level revenue, or top-customer concentration. Pappers' reported 112-day client
              payment period for 2023 also indicates procurement and working-capital friction, not churn. The
              underwriting case should therefore treat expansion as plausible and retention quality as an open diligence
              item.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof extends beyond logos
            body: >-
              Named customer quotations and multi-year public awards show identifiable users, use cases, and contract
              periods, although realized outcomes remain largely undisclosed.
            calloutType: strength
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: callout
            title: Retention and concentration remain opaque
            body: >-
              Public customer counts cannot substitute for cohort retention, recurring-revenue mix, renewal behavior, or
              customer-level revenue concentration.
            calloutType: risk
            claimRefs:
              - CU003
              - CU004
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity ranking and investment implication
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is acquisition integration rather than a demonstrated legal breach. Eurazeo
              describes several identified acquisitions and follow-on financing capacity, while I-TRACING describes a
              24/7 operating model spanning nine subsidiaries and more than 1,000 experts. Those facts create a material
              control-consistency, service-quality, and management-bandwidth test as the perimeter expands. Severity in
              the exhibits is therefore an evidence-based qualitative judgment: impact reflects the breadth of customer
              and operating exposure; likelihood reflects an active transaction or regulatory condition; mitigation
              maturity reflects only controls visible in the allocated public sources, not management's undisclosed
              internal controls. A clean investment decision requires integration KPIs, incident and SLA history, and
              current group financials rather than extrapolation from promotional scale claims.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
