  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis evidence
      - Anti-thesis or uncertainty
      - What changes the view
    rows:
      - - Scale
        - The company presents more than EUR230M of revenue.
        - Period, accounting basis, and group perimeter are not stated.
        - Audited post-merger revenue bridge.
      - - Growth
        - >-
          The homepage presents more than 30% annual growth; Oakley reported 20% revenue growth for the 12 months to
          December 2024.
        - The two growth statements use different disclosures and may use different perimeters.
        - Like-for-like organic and acquired growth bridge.
      - - Profitability
        - >-
          Pappers displays EUR15.4M of 2023 EBITDA for the French legal entity; Oakley reported 23% adjusted-EBITDA
          growth in 2024.
        - Current combined EBITDA, adjustments, margin, and cash conversion are absent.
        - Audited consolidated EBITDA and free-cash-flow bridge.
      - - Sponsor support
        - A EUR180M continuation fund and broad management reinvestment were reported.
        - Fund size is neither company cash nor a disclosed valuation.
        - Executed transaction sources-and-uses and capitalization table.
      - - Valuation mark
        - OCI marked its attributable I-TRACING holding at GBP35.6M at 31 December 2024.
        - The mark equals OCI's residual cost and is not company enterprise value.
        - Current independent valuation and ownership percentage.
      - - Corporate perimeter
        - INPI records the December 2025 absorption of I-Tracing Group into I-TRACING.
        - Public financial evidence predates the reorganized perimeter.
        - Post-merger audited accounts and legal-entity schedule.
    notes: >-
      The table separates issuer claims, historical legal-entity data, sponsor marks, and company-level valuation; none
      is substituted for another.
