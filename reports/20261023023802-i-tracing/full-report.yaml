      - number: '5.2'
        title: Operating architecture and delivery model
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture is human-led managed security layered over third-party control and telemetry
              platforms. TechFundingNews reports that I-TRACING builds programs on Google Security Operations and uses
              Mandiant threat intelligence, while the broader evidence places consulting and integration ahead of 24/7
              SOC, CERT, and MDR operations. The French registry also records an Annecy establishment whose activity
              includes cloud-application design, development, hosting, maintenance, and systems work following the
              APALIA merger. This supports technical delivery capability, but it does not prove that I-TRACING owns a
              proprietary detection engine or unified software platform. Public evidence also omits data-flow diagrams,
              supported integrations, tenancy boundaries, deployment lead times, and recovery procedures, so the
              architecture map below is a sourced operating-model synthesis rather than a verified implementation
              blueprint.
