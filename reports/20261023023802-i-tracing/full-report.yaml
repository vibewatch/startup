              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and security-control exposure
        blocks:
          - type: paragraph
            body: >-
              NIS2 expands the population of covered entities and introduces implementation evidence requirements for
              relevant digital and ICT-service sectors. This can support demand for I-TRACING, but it also raises the
              standard of proof customers may require from a security-services provider. ANSSI's PAMS page has an
              important visibility limitation: only qualification projects whose providers consent to publication
              appear, and suspended projects are removed. Consequently, a public-listing check cannot by itself
              establish I-TRACING's qualification status. Pappers displays no collective proceeding, litigation, or
              sanction in its own coverage, but that is not proof that no dispute, enforcement action, incident, or
              foreign-jurisdiction matter exists. The correct mitigation is document-level verification across operating
              jurisdictions.
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Operational, integration, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              The operating perimeter combines a company-reported global follow-the-sun service with a sponsor-backed
              acquisition plan. Maintaining common detection, escalation, identity, change-management, and recovery
              controls across acquired teams is therefore a core execution dependency, not a generic cyber-sector
              concern. The December 2025 fusion-absorption of I-Tracing Group into I-TRACING and the holding-company
              presidency add legal-entity and governance changes that should be reconciled to contracts, insurance,
              customer consents, and accountability maps. Sponsor follow-on capacity is a mitigation, but the EUR180
              million figure is capital committed to the continuation vehicle, not cash proven to be available to
              I-TRACING. Key-person, platform, supplier, and customer concentration remain unquantified in the allocated
              evidence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Financial/model risk and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Public financial evidence is not current enough to size downside at the combined group. Pappers reports
              2023 standalone I-TRACING revenue, EBITDA, cash, and financial debt, while the current company page
              reports a much larger consolidated revenue perimeter. Oakley's 4.1x average portfolio net-debt-to-EBITDA
              ratio is explicitly a portfolio statistic and cannot be assigned to I-TRACING. The resulting gap is
              material because an acquisition-led strategy can convert integration slippage into covenant, liquidity, or
              equity-support risk. Thesis-break triggers should include missed acquisition synergy milestones, repeated
              material SLA failures, a reportable control failure, loss of a required qualification, or leverage and
              cash conversion outside underwritten limits. Those limits cannot be set responsibly until audited
              combined-group statements, debt terms, and working-capital data are reviewed.
            claimRefs:
              - CR006
              - CR007
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence does not quantify combined-group downside
            body: >-
              The retained sources do not disclose current I-TRACING group leverage, covenant headroom, cash conversion,
              incident frequency, customer concentration, or supplier concentration. Treat each as a material diligence
              condition rather than assuming that historical standalone profitability or sponsor capital eliminates the
              exposure.
            calloutType: risk
            claimRefs:
              - CR001
              - CR007
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Evidence-led recommendation
        blocks:
          - type: paragraph
            body: >-
              I-TRACING has credible operating proof, but the evidence is not yet sufficient for a price-sensitive
              investment call. Its current homepage presents more than EUR230 million of revenue and more than 30%
              annual growth without stating the measurement period, accounting basis, or consolidation perimeter. Its
              Google Cloud page adds a company-issued operating signal: a certified MSSP partnership and a 24/7
              follow-the-sun CyberSOC across three continents. Historical third-party and sponsor disclosures strengthen
              the operating case: Pappers displays EUR112 million of revenue and EUR15.4 million of EBITDA for the 2023
              French legal entity, while Oakley reported 20% revenue growth and 23% adjusted-EBITDA growth for the 12
              months to December 2024. These metrics differ in vintage and perimeter, so they support platform quality
              rather than a current group valuation. The recommendation is therefore track and research-more, with
              medium confidence, high underwriting risk, and an unknown valuation stance.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV016
      - number: '8.2'
        title: Financing and price context
        blocks:
          - type: paragraph
            body: >-
              The November 2024 sponsor transaction demonstrates capital support but does not disclose I-TRACING's
              equity value or cash available to the company. Tech Funding News reported that Eurazeo raised a EUR180
              million continuation fund and that more than 80 managers and employees reinvested; the EUR180 million
              amount is the fund size, not company funding or valuation. Oakley Capital Investments' 2024 annual report
              provides a narrower mark: its look-through Fund V holding in I-TRACING had a GBP35.6 million residual cost
              and GBP35.6 million fair value at 31 December 2024. That is OCI's attributable investment value, not
              I-TRACING's enterprise value. The same audited report identifies subjective and complex valuation risk for
              unquoted investments. INPI then records the absorption of I-Tracing Group into I-TRACING effective 26
              December 2025, making a current post-merger perimeter, capitalization table, net-debt bridge, and
              preference schedule prerequisites to pricing.
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV016
      - number: '8.3'
        title: Benchmark and scenario discipline
        blocks:
          - type: paragraph
            body: >-
              Independent references define a broad valuation vocabulary, not a direct comp answer. Aventis reports an
              approximately 8.9x median EV/EBITDA multiple across 120 disclosed private MSP transactions with a USD38.5
              million median transaction size. For selected listed MSPs, it reports H2 2024 medians of 11.4x EV/EBITDA
              and 1.3x EV/revenue, while explicitly warning that pure-play listed MSPs are rare and diversified revenue
              streams impair comparison. Greenwich's managed-security precedent table shows three-year medians of 13.7x
              EV/EBITDA and 1.5x EV/revenue. These datasets vary by deal size, business mix, public/private status, and
              period; none supplies an I-TRACING transaction price. A bull case can justify testing the upper end only
              after recurring revenue, retention, normalized combined EBITDA, and low leverage are verified. A base case
              treats the 8.9x private-MSP median as a cross-check, not an answer. A bear case requires a discount for
              weak cash conversion, integration risk, customer concentration, or senior claims. No company-value range
              or return probability is supportable from the assigned public evidence.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV011
              - CV016
      - number: '8.4'
        title: Diligence, exit, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Entry discipline should focus on the variables that convert operating quality into equity returns.
              Management and sponsors should provide audited post-merger consolidated accounts; normalized EBITDA and
              cash conversion; net debt and debt maturities; recurring versus project revenue; gross and contribution
              margins; customer concentration, renewal, and churn cohorts; acquisition purchase-price accounting; and
              the complete capitalization and preference stack. Exit readiness also requires a credible
              sponsor-liquidity path, evidence that the combined platform can be separated or sold cleanly, and a buyer
              set that values services rather than software economics. The thesis improves if current revenue reconciles
              across entities, retention proves durable, EBITDA converts to cash, and acquired operations integrate
              without leverage expansion. It breaks if the continuation structure embeds an entry price above
              supportable service-company multiples, if combined EBITDA materially trails the historical French entity
              margin, if churn or concentration undermines recurring revenue, or if senior claims absorb plausible exit
              proceeds. Until those tests clear, target return, hold period, and exit value remain material gaps rather
              than estimable outputs.
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              Operating evidence is investable context, but a buy call requires a current price, audited combined
              earnings, and complete debt and preference terms.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV009
              - CV016
          - type: callout
            title: Do not convert sponsor marks into company value
            body: >-
              The EUR180 million continuation fund is a fund amount, and OCI's GBP35.6 million mark is its attributable
              holding value; neither is I-TRACING enterprise value.
            calloutType: risk
            claimRefs:
              - CV004
              - CV010
