  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Required assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Recurring revenue and retention are strong; combined EBITDA and cash conversion reconcile; leverage and senior
          claims are modest.
        - >-
          Test the upper end of relevant MSP/MSSP EV/EBITDA references only after company-specific normalization; no
          company value is presently calculable.
        - Unsupported until private evidence confirms every assumption.
        - Integration slippage, margin dilution, or senior-claim leakage.
      - - Base
        - >-
          Historical profitability remains directionally representative, but current perimeter and quality metrics
          require verification.
        - >-
          Use the 8.9x private-MSP median as a cross-check, with explicit discounts or premiums for size, mix,
          retention, and leverage; no return estimate is supportable.
        - Best-supported analytical posture, not a probability percentage.
        - Entry price is set before audited combined earnings and net debt are known.
      - - Bear
        - >-
          Cash conversion is weak, growth is acquisition-dependent, concentration or churn is material, or the
          preference stack is senior-heavy.
        - >-
          Value below broad MSP references and test equity proceeds after debt and preferences; no public evidence
          supports a numeric floor.
        - Material and unquantified.
        - Combined EBITDA misses, leverage rises, or commercialization and integration stall.
    notes: >-
      Multiple references come from different datasets and periods; scenarios are conditional frameworks, not forecasts,
      company valuation ranges, or probability assignments.
    claimRefs:
      - CV011
      - CV013
      - CV014
      - CV015
      - CV016
