      - [IAM / cloud security / data protection, "Specialist security services and implementation", "Offered; no public stream-level revenue", "Company and sponsor materials", "Revenue mix, attach rates, and customer concentration"]
      - [Acquired service platforms, "Geographic and capability expansion through acquisitions", "doIT solutions reported €12 million 2024 turnover; combined company reported >€210 million 2024 revenue", "Company-issued figures with changed perimeter", "Audited acquisition contribution, synergies, and integration costs"]
    notes: Revenue mechanisms and values are drawn from assigned company, investor, registry, and news sources; undisclosed fields are null in substance, not zero.
    claimRefs: [CI001, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric or lever, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [List pricing, null, low, "No public price card or standard rate was found in the assigned pool", "Obtain current rate cards, discount policy, and realized price waterfall"]
      - [Recurring contract visibility, "Ardian describes long-term contracts and high revenue visibility", medium, "Supports predictability but is lender/investor characterization", "Test renewal, termination, indexation, and concentration by cohort"]
      - [Organic growth, "c.30% per annum described for the 2021-2024 period", medium, "Signals demand and execution, but does not equal recurring growth", "Reconcile organic versus acquired growth from audited segment data"]
      - [Revenue quality, "Mix of managed services, consulting, integration, and support not disclosed", low, "Project mix can change margin and working-capital needs", "Provide recurring versus project revenue, backlog, and deferred-revenue schedules"]
    notes: Null denotes unavailable public evidence, not zero; the c.30% growth statement is attributed to Oakley and related transaction materials.
    claimRefs: [CI001, CI003, CI007, CI008]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [2023 operating-company revenue, "€112m", high, "Provides a filed-account-style operating baseline", "Confirm entity scope and reconcile to group reporting"]
      - [2023 operating-company EBITDA margin, "13.7%", high, "Shows historical operating profitability at the reported entity", "Obtain combined-group adjusted EBITDA bridge and accounting policy"]
      - [Cash, "€23m for I-TRACING; €2.1m for I-TRACING GROUP", medium, "Liquidity appears perimeter-sensitive", "Deliver current consolidated cash, restricted cash, and debt maturity schedule"]
      - [Financial debt, "€3.75m for I-TRACING; €75.2m for I-TRACING GROUP", medium, "Leverage and refinancing risk cannot be assessed from one scope", "Provide current debt, covenants, acquisition facilities, and net-debt bridge"]
      - [CAC / payback / sales cycle, null, low, "No assigned source reports a comparable unit-economics measure", "Provide cohort CAC, sales expense, cycle length, payback, and retention"]
    notes: Entity-level figures are not combined-group figures; no cash-burn or runway estimate is calculated because the assigned evidence does not support one.
    claimRefs: [CI002, CI005, CI009, CI010, CI013]
