company:
  name: I-TRACING
chapter:
  number: 4
  title: Financials
  summary: I-TRACING has public evidence of a growing managed-security services model with reported 2023 revenue of €112 million at the operating-company level and €115 million turnover in an investor case study, while later company communications target nearly €150 million for 2024 and report consolidated 2024 revenue above €210 million after acquisitions. The evidence supports growth and operating profitability, but perimeter changes, sponsor-issued claims, and missing current cash-flow disclosure constrain underwriting confidence.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      I-TRACING monetizes a broad cybersecurity-services portfolio rather than a single
      software subscription: CyberDefence, managed detection and response, identity and
      access management, cloud security, data protection, audit, consulting, integration,
      and 24/7 SOC services are described across investor and company materials. That mix
      implies a blend of recurring managed-service revenue and project or integration
      revenue, but the assigned evidence does not disclose the split, contract duration,
      renewal rate, or realized price by service line. Pappers reports I-TRACING operating
      company revenue of €112 million in 2023, up from €81.6 million in 2022, while Ardian
      reports €115 million turnover for 2023. The small difference is not reconciled in the
      sources and should not be treated as a restatement. Later company material reports
      consolidated 2024 revenue above €210 million after acquisitions, a changed perimeter.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: economics-and-cost-drivers
    title: Economics and cost drivers
    body: >-
      The operating-company accounts presented by Pappers show improving profitability
      through 2023: EBITDA rose from €10.1 million in 2022 to €15.4 million in 2023, while
      EBITDA margin increased from 12.4% to 13.7%; net margin was 8.6% in 2023. These
      figures are useful operating evidence, but they are entity-level figures and do not
      establish current combined-group margins after Bridewell, doIT solutions, and other
      perimeter changes. The commercial model is labor intensive: Oakley describes around
      700 cybersecurity experts in 2024, and the company describes more than 1,000 experts
      after the doIT combination. Acquisitions can add capability and geographic coverage,
      but integration, hiring, utilization, and delivery quality can pressure margins.
      No assigned source supplies CAC, sales cycle, payback, gross-margin bridge, service
      delivery cost by line, or working-capital detail, so those inputs remain underwriting
      blockers rather than estimates.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      Financing evidence indicates meaningful sponsor and lender support but does not
      establish current liquidity. Ardian describes a €60 million 2021 debt financing,
      comprising €40 million drawn at closing and a committed €20 million acquisition line.
      The 2023 operating-company profile separately reports €23 million of cash and €3.75
      million of financial debt, whereas the group profile reports €2.1 million of cash and
      €75.2 million of financial debt for 2023; the different entities and perimeters make
      these figures non-comparable without a group bridge. The 2024 transaction included a
      €180 million Eurazeo continuation fund, but that is financing raised by the sponsor
      structure, not disclosed cash available to I-TRACING. Acquisition-led expansion and
      planned hiring increase the need for a current cash, debt, covenant, and integration
      bridge. Financially, the evidence supports a growing and historically profitable
      platform, but not a fully underwritten current cash-generation or valuation case.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
    figureRefs: [FI001]
callouts:
  - calloutType: risk
    title: Perimeter risk dominates comparability
    body: The operating-company 2023 accounts, group 2023 accounts, 2024 target, and post-acquisition 2024 consolidated figure describe different scopes; underwriting should require audited combined statements and a bridge from standalone I-TRACING to the current group.
    claimRefs: [CI002, CI003, CI004, CI012]
