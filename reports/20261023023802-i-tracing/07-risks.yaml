        - id: likelihood
          label: Likelihood
        - id: impact
          label: Impact
        - id: mitigation
          label: Visible mitigation maturity
      rows:
        - id: integration
          label: Acquisition integration
          values: [High, High, Developing]
        - id: service-continuity
          label: Global service continuity
          values: [Medium, Critical, Unknown]
        - id: regulatory-assurance
          label: NIS2 and qualification assurance
          values: [High, High, Developing]
        - id: financial-disclosure
          label: Leverage and cash-flow opacity
          values: [High, High, Unknown]
        - id: partner-governance
          label: Sponsor and governance dependency
          values: [Medium, High, Developing]
        - id: concentration
          label: Customer, supplier, and platform concentration
          values: [Unknown, High, Unknown]
    approximationNotes: >-
      Categories are qualitative evidence assessments, not probabilities or measured control
      scores; unknown means the assigned public evidence did not provide the required metric.
    claimRefs: [CR001, CR002, CR003, CR005, CR006, CR010, CR011, CR013, CR014, CR015, CR016]
