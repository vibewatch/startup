schemaVersion: "report-v2"
artifact: risks
slug: i-tracing
runDate: 2026-10-23
company:
  name: I-TRACING
chapter:
  number: 7
  title: Risks
  summary: >-
    I-TRACING's principal public-evidence risks are executional: integrating an active
    European buy-and-build program while maintaining consistent 24/7 delivery across nine
    subsidiaries, and proving controls against an expanding NIS2 compliance burden. The
    investment case also lacks current group-level leverage, cash-flow, incident, and
    concentration disclosures, so financial and operational downside cannot be quantified
    from the retained evidence.
sections:
  - id: risk-ranking
    title: Severity ranking and investment implication
    body: >-
      The highest residual exposure is acquisition integration rather than a demonstrated
      legal breach. Eurazeo describes several identified acquisitions and follow-on financing
      capacity, while I-TRACING describes a 24/7 operating model spanning nine subsidiaries
      and more than 1,000 experts. Those facts create a material control-consistency,
      service-quality, and management-bandwidth test as the perimeter expands. Severity in
      the exhibits is therefore an evidence-based qualitative judgment: impact reflects the
      breadth of customer and operating exposure; likelihood reflects an active transaction
      or regulatory condition; mitigation maturity reflects only controls visible in the
      allocated public sources, not management's undisclosed internal controls. A clean
      investment decision requires integration KPIs, incident and SLA history, and current
      group financials rather than extrapolation from promotional scale claims.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR013, CR015, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory, legal, and security-control exposure
    body: >-
      NIS2 expands the population of covered entities and introduces implementation evidence
      requirements for relevant digital and ICT-service sectors. This can support demand for
      I-TRACING, but it also raises the standard of proof customers may require from a
      security-services provider. ANSSI's PAMS page has an important visibility limitation:
      only qualification projects whose providers consent to publication appear, and
      suspended projects are removed. Consequently, a public-listing check cannot by itself
      establish I-TRACING's qualification status. Pappers displays no collective proceeding,
      litigation, or sanction in its own coverage, but that is not proof that no dispute,
      enforcement action, incident, or foreign-jurisdiction matter exists. The correct
      mitigation is document-level verification across operating jurisdictions.
    claimRefs: [CR008, CR010, CR011, CR012]
    tableRefs: [TR001]
  - id: operational-dependencies
    title: Operational, integration, and partner dependencies
    body: >-
      The operating perimeter combines a company-reported global follow-the-sun service with
      a sponsor-backed acquisition plan. Maintaining common detection, escalation, identity,
      change-management, and recovery controls across acquired teams is therefore a core
      execution dependency, not a generic cyber-sector concern. The December 2025
      fusion-absorption of I-Tracing Group into I-TRACING and the holding-company presidency
      add legal-entity and governance changes that should be reconciled to contracts,
      insurance, customer consents, and accountability maps. Sponsor follow-on capacity is a
      mitigation, but the EUR180 million figure is capital committed to the continuation
      vehicle, not cash proven to be available to I-TRACING. Key-person, platform, supplier,
      and customer concentration remain unquantified in the allocated evidence.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR009, CR015]
    tableRefs: [TR002, TR003]
  - id: financial-kill-criteria
    title: Financial/model risk and thesis-break triggers
    body: >-
      Public financial evidence is not current enough to size downside at the combined group.
      Pappers reports 2023 standalone I-TRACING revenue, EBITDA, cash, and financial debt,
      while the current company page reports a much larger consolidated revenue perimeter.
      Oakley's 4.1x average portfolio net-debt-to-EBITDA ratio is explicitly a portfolio
      statistic and cannot be assigned to I-TRACING. The resulting gap is material because an
      acquisition-led strategy can convert integration slippage into covenant, liquidity, or
      equity-support risk. Thesis-break triggers should include missed acquisition synergy
      milestones, repeated material SLA failures, a reportable control failure, loss of a
      required qualification, or leverage and cash conversion outside underwritten limits.
      Those limits cannot be set responsibly until audited combined-group statements, debt
      terms, and working-capital data are reviewed.
    claimRefs: [CR006, CR007, CR014, CR016]
callouts:
  - calloutType: risk
    title: Public evidence does not quantify combined-group downside
    body: >-
      The retained sources do not disclose current I-TRACING group leverage, covenant
      headroom, cash conversion, incident frequency, customer concentration, or supplier
      concentration. Treat each as a material diligence condition rather than assuming that
      historical standalone profitability or sponsor capital eliminates the exposure.
    claimRefs: [CR001, CR007, CR014, CR016]
