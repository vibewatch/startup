  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-legal-register-completeness
      missingEvidence: >-
        Exhaustive litigation, enforcement, sanctions, data-protection, security-incident,
        qualification, and license records across every operating jurisdiction.
      whyItMatters: >-
        A French registry aggregator and visibility-limited qualification page cannot prove
        the absence of adverse matters or establish authorization status abroad.
      diligencePath: >-
        Obtain management's legal and regulatory schedule, external-counsel confirmations,
        regulator correspondence, insurance claims, and jurisdiction-by-jurisdiction
        certification register, then reconcile them to primary court and regulator records.
      relatedQuestionRefs: [QR002, QR003, QR008]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure-gap
      missingEvidence: >-
        Audited combined-group revenue, EBITDA, cash flow, debt, covenant, working-capital,
        acquisition consideration, and sponsor-equity data after the current perimeter was formed.
      whyItMatters: >-
        Historical standalone accounts and portfolio-level sponsor statistics cannot quantify
        liquidity, leverage, or downside under the acquisition plan.
      diligencePath: >-
        Review audited consolidated statements, quality-of-earnings work, debt agreements,
        covenant models, monthly cash conversion, acquisition bridges, and board-approved
        downside cases.
      relatedQuestionRefs: [QR006, QR007]
      relatedTableRefs: [TR003]
    - type: private-evidence-only
      severity: material
      topic: service-continuity
      missingEvidence: >-
        Three-year severity-one incident history, customer-impact record, SLA attainment,
        mean-time-to-detect, mean-time-to-recover, control-audit findings, and cyber-insurance claims.
      whyItMatters: >-
        The 24/7 operating description establishes exposure and service scope but does not
        measure reliability, resilience, or realized security losses.
      diligencePath: >-
        Review incident and problem-management exports, SOC performance dashboards,
        independent assurance reports, penetration-test summaries, recovery exercises, and
        sampled customer SLA credits.
      relatedQuestionRefs: [QR003, QR004, QR007]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: >-
        Revenue concentration by customer, platform, supplier, geography, service line, and
        acquired entity, plus renewal and termination rights.
      whyItMatters: >-
        Reported geographic and customer scale does not quantify dependency or the margin
        effect of a counterparty loss, outage, or repricing event.
      diligencePath: >-
        Obtain top-20 customer and vendor schedules, platform spend, gross-margin contribution,
        renewal dates, churn, termination rights, and stressed replacement-cost analysis.
      relatedQuestionRefs: [QR005, QR007]
      relatedTableRefs: [TR003]
