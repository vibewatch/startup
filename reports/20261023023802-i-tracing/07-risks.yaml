      - Failure scenario
      - Severity
      - Visible mitigation
      - Residual exposure
    rows:
      - - Acquisition capital and governance
        - Eurazeo, Oakley Capital, and continuation-fund investors
        - No company-level funding allocation disclosed
        - Capital timing, governance conflict, or return pressure constrains execution
        - High
        - EUR180 million of vehicle commitments and stated follow-on capacity
        - High until allocation, debt, and governance rights are reviewed
      - - Acquisition pipeline and integration capacity
        - Sellers, acquired management teams, and integration leaders
        - Several acquisitions were identified; pipeline economics were not disclosed
        - Overpayment or integration delay erodes service quality and cash conversion
        - High
        - Sponsor-backed buy-and-build experience and a broad cyber M&A market
        - High because synergy and retention thresholds are undisclosed
      - - Customer, supplier, and technology dependencies
        - Large customers, cloud/security platforms, and key vendors
        - No concentration percentages in assigned evidence
        - Loss, outage, repricing, or platform restriction impairs delivery or margins
        - High
        - Diversified geography and reported customer scale may reduce single-market exposure
        - Unknown until revenue and supplier concentration are produced
    notes: >-
      Counterparty roles are public, but company-specific capital allocation, contractual
      rights, customer concentration, supplier concentration, and platform dependency were
      not disclosed in the assigned sources.
    claimRefs: [CR001, CR002, CR003, CR004, CR009, CR013, CR014, CR015, CR016]
