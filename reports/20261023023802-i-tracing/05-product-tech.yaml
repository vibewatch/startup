      - ["Integration and control plane", "Implement IAM, cloud, network, application, and data controls", "Software integration and broad security domains are named", "Third-party product compatibility and customer change windows", "No public integration catalog, version policy, or reference architecture"]
      - ["Telemetry and analytics", "Aggregate and analyze security events", "Google Security Operations is reported as a platform foundation", "Google platform availability, licensing, connectors, and data quality", "Proprietary versus third-party capability is not separated"]
      - ["Threat intelligence and orchestration", "Prioritize alerts and coordinate response", "Mandiant intelligence and orchestrated security tools are reported", "Third-party intelligence quality and customer playbook maturity", "No public precision, recall, false-positive, or automation-effectiveness metrics"]
      - ["Managed operations and governance", "Operate SOC/CERT/MDR services and protect entrusted data", "24/7 monitoring, international staffing, processor role, and stated safeguards", "Skilled staffing, access governance, and service continuity", "No public SLA attainment, status history, certification scope, or incident ledger"]
    notes: "This is an evidence-bounded operating-model synthesis; it is not a representation of undisclosed network topology, proprietary software, or customer-specific implementation."
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE011, CE013]
