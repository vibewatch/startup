company:
  name: I-TRACING
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    I-TRACING is best understood as a broad cybersecurity-services platform: public evidence supports
    advisory and integration, MDR/SOC/CERT operations, IAM, cloud security, data protection, and audit,
    with Google Security Operations identified as one delivery component. The service breadth and
    documented public-sector use cases indicate operating maturity, but public evidence does not disclose
    SLAs, incident history, detailed integration architecture, product roadmap, or a developer ecosystem.
sections:
  - id: product-and-customer-workflow
    title: Product surface and customer workflow
    body: >-
      The public product surface is a services portfolio rather than a single software SKU. Oakley describes
      a one-stop shop spanning cybersecurity, managed detection and response, identity and access
      management, cloud security, data protection, and audit; Sagard separately describes auditing,
      consulting, 24/7 monitoring, and software integration. A RevenueBase profile sourced from the
      company's public LinkedIn description adds SOC, CERT, vulnerability and threat management, network
      and application security, governance, risk and compliance, and industrial/IoT security. Procurement
      records provide stronger workflow evidence than marketing taxonomy: they list CIAM for extranets,
      Active Directory/PKI work, security audits, vulnerability detection, and incident-response services.
      Together, these sources indicate that I-TRACING participates from assessment and control design
      through implementation and continuous operations, although no retained source discloses realized
      performance outcomes for these engagements.
    claimRefs: [CE001, CE002, CE003, CE009, CE010]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating architecture and delivery model
    body: >-
      The disclosed architecture is human-led managed security layered over third-party control and
      telemetry platforms. TechFundingNews reports that I-TRACING builds programs on Google Security
      Operations and uses Mandiant threat intelligence, while the broader evidence places consulting and
      integration ahead of 24/7 SOC, CERT, and MDR operations. The French registry also records an Annecy
      establishment whose activity includes cloud-application design, development, hosting, maintenance,
      and systems work following the APALIA merger. This supports technical delivery capability, but it
      does not prove that I-TRACING owns a proprietary detection engine or unified software platform.
      Public evidence also omits data-flow diagrams, supported integrations, tenancy boundaries,
      deployment lead times, and recovery procedures, so the architecture map below is a sourced
      operating-model synthesis rather than a verified implementation blueprint.
    claimRefs: [CE002, CE004, CE005, CE011, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-differentiation
    title: Maturity, differentiation, and roadmap evidence
    body: >-
      Scale and deployment evidence are stronger than product-roadmap evidence. Sagard says the offering
      is supported across three continents, and Oakley's 2024 annual report identifies 700 cybersecurity
      experts. The same annual report says I-TRACING acquired more than 70 new customers from a base of
      about 250 during 2024 and launched a dedicated mid-market sales stream, indicating that the delivery
      model had moved beyond a narrow large-enterprise posture. Differentiation appears to rest on service
      breadth, specialist staffing, integration capability, and orchestration of established platforms
      rather than on publicly demonstrated proprietary software. The December 2025 fusion of I-Tracing
      Group into I-TRACING and the earlier APALIA absorption may simplify the legal operating perimeter,
      but the retained evidence does not show a current module roadmap, release cadence, end-of-life
      policy, or integration plan for acquired capabilities.
    claimRefs: [CE005, CE011, CE012, CE013, CE014, CE015]
  - id: trust-compliance-and-technical-risk
    title: Trust, compliance, and technical-risk posture
    body: >-
      I-TRACING's privacy statement defines the group as a processor when handling client-entrusted
      personal data and names technical and organizational safeguards including firewalls, network
      segmentation, physical hosting, named access controls, procedures, and security policies. These are
      useful control assertions, but they are company-issued and do not substitute for independent
      certification scope, penetration-test results, SOC reports, availability history, or breach
      disclosure. NIS2 raises the compliance burden for many target customers through risk-management and
      significant-incident reporting obligations, which can support demand while also increasing the
      evidence customers will expect from their MSSP. No retained source exposes a public repository,
      package, API forum, release history, status page, or practitioner-community signal attributable to
      I-TRACING; developer adoption and operational reliability therefore remain unverified rather than
      assumed absent.
    claimRefs: [CE006, CE007, CE008, CE016]
