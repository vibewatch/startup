callouts:
  - calloutType: strength
    title: Broad service coverage has external operating proof
    body: >-
      Investor reporting, independent coverage, registry data, and procurement records collectively support
      a services platform that spans design, integration, and managed operations rather than a marketing-only
      catalog.
    claimRefs: [CE001, CE004, CE009, CE010, CE011]
  - calloutType: risk
    title: Reliability and proprietary technology remain opaque
    body: >-
      Public evidence does not quantify availability, response times, detection quality, customer deployment
      effort, certification coverage, or the share of value delivered by proprietary technology versus
      third-party platforms.
    claimRefs: [CE004, CE007, CE016]
