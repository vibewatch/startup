callouts:
  - calloutType: strength
    title: Breadth plus operating scale
    body: The strongest competitive evidence is the combination of a broad managed-services scope, more than 700 experts, international subsidiaries, and a fully owned follow-the-sun organization described in the Eurazeo materials.
    claimRefs: [CP005, CP006]
  - calloutType: risk
    title: Platform consolidation risk
    body: Sector evidence points to platformization and high switching costs as advantages for scaled product vendors; I-TRACING must show that managed accountability and integration create equal or better buyer value.
    claimRefs: [CP014, CP015]
  - calloutType: insight
    title: Pricing is an underwriting gap
    body: The assigned evidence contains no comparable I-TRACING price card, realized contract pricing, renewal rate, or service-line margin, so competitive pricing power cannot be inferred from breadth or funding.
    claimRefs: [CP009, CP010, CP017]
  - calloutType: recommendation
    title: Diligence the win-loss engine
    body: The next evidence request should compare wins, losses, renewals, migrations and service-level outcomes against platform vendors, MDR specialists, global integrators, and internal-build alternatives.
    claimRefs: [CP008, CP014, CP017]
