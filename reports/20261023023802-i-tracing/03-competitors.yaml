      - ["Compliance, skills and trust", "ENISA frames MSS around compliance, skills certification, threats, incidents and requirements", "Tool vendors may provide controls and evidence but not necessarily managed accountability", "Internal teams retain control but bear staffing and operational burden", "Obtain certifications, audit reports, contractual SLAs and referenceable outcomes"]
      - ["Tooling and automation", "TFN reports I-TRACING solutions are built on Google Security Operations and use Mandiant threat intelligence", "Platform vendors own core telemetry and product roadmap", "Status quo may be fragmented across tools", "Clarify dependency, gross margin impact, portability and customer ownership of telemetry"]
      - ["Distribution and sponsor support", "Eurazeo reports a €180m continuation fund with follow-on financing capabilities and an active European buy-and-build roadmap", "Large vendors have established channels and platform budgets", "Integrators can win via existing transformation contracts", "Separate fund commitments from company cash, proven integration returns and organic win rate"]
    notes: "Cells marked as implications are analyst interpretation of the cited evidence; unsupported relative capabilities remain qualitative or unknown rather than scored."
    claimRefs: [CP005, CP006, CP007, CP008, CP010, CP011]
  - id: TP003
    title: Pricing and moat diligence comparison
    columns: [Dimension, I-TRACING evidence, Competitive pressure, Current conclusion, Required evidence]
    rows:
      - ["Price basis", "No public I-TRACING price card appears in the assigned pool", "Product peers may quote seats, workloads or modules; MSSPs may bundle labor and tooling", "Unknown; do not compare list prices", "Anonymized quotes and realized ARR / contract scope by service line"]
      - ["Switching cost", "Managed response and integrated operations plausibly create migration burden", "Multi-homing and modular security stacks can reduce single-vendor dependence", "Potentially material but unquantified", "Churn reasons, migration timelines, data portability and termination terms"]
      - ["Platformization", "I-TRACING is positioned as an end-to-end services pure-player", "Clipperton says cyber-platform status and high switching costs support resilience", "Adverse structural pressure is credible, not company-specific proof", "Win/loss data against Palo Alto, CrowdStrike, Fortinet and integrators"]
      - ["Buy-and-build", "Eurazeo describes a €180m continuation-fund vehicle, follow-on financing capabilities and identified acquisitions", "Integration failure or service inconsistency can erode trust", "Sponsor financing intent is evidenced; company cash available and returns are unproven", "Post-acquisition revenue, margin, retention and integration milestones"]
      - ["Valuation context", "No current I-TRACING valuation is disclosed in assigned evidence", "Finro reports 7.8x public, 15.2x private and 16.3x M&A average revenue multiples", "Sector context only; cannot apply a multiple to I-TRACING", "Current enterprise value, perimeter, revenue quality and EBITDA / cash flow"]
    notes: "This table deliberately separates disclosed company facts, sector-level pressure, and open underwriting questions; Finro's averages cover heterogeneous public, private and M&A observations and are not a company valuation."
    claimRefs: [CP009, CP010, CP012, CP014, CP015, CP016, CP017]
