    notes: "Values are publisher-specific and not additive or interchangeable. The table preserves different forecast horizons and methodologies; no SAM or SOM is inferred."
    claimRefs: [CM005, CM006, CM007, CM008]
  - id: TM003
    title: Buyer segments and adoption path
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow, Adoption trigger]
    rows:
      - [Large regulated enterprise, CISO and CIO, SOC and incident teams, Security and compliance budget, Continuous monitoring and response, NIS2/GDPR obligations plus threat exposure]
      - [Midmarket enterprise, CIO or security lead, IT operations and security users, IT or outsourced-services budget, Co-managed monitoring and response, Lack of specialist talent and need for 24/7 coverage]
      - [Critical infrastructure or digital provider, CISO and operational risk owner, Security operations and engineering, Resilience and regulatory budget, Evidence-driven control implementation, Expanded NIS2 perimeter and technical requirements]
      - [Cloud-first or distributed enterprise, CISO, cloud and identity administrators, Cloud/security transformation budget, Hybrid-cloud visibility and identity control, Cloud migration and remote-work complexity]
      - [Internal security team seeking augmentation, CISO, Existing SOC and responders, Existing security headcount plus services budget, Co-managed threat hunting or overflow response, Capacity constraints without full outsourcing]
    notes: "Segments synthesize source-described end users, regulatory scope, service categories, and outsourcing constraints; individual I-TRACING customer budgets and conversion rates remain undisclosed."
    claimRefs: [CM010, CM011, CM012, CM013, CM014, CM015]
