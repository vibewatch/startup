callouts:
  - calloutType: insight
    title: Demand is structurally supported
    body: Regulatory expansion, cyber-threat complexity, cloud adoption, and scarce specialist labor all support outsourced security demand, but buyer governance and third-party control concerns can slow conversion.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
  - calloutType: risk
    title: Market size is not obtainable share
    body: Public sizing reports do not disclose I-TRACING's serviceable geography, service-line revenue, win rates, capacity, or customer concentration; valuation should not translate global TAM directly into company value.
    claimRefs: [CM008]
