company:
  name: I-TRACING
chapter:
  number: 6
  title: Customers
  summary: >-
    I-TRACING reports more than 600 enterprise customers and large managed-security workloads,
    while Oakley reported more than 70 customer additions from a roughly 250-customer base in
    2024. Named testimonials and public procurement awards show real use, but public evidence
    does not disclose retention, cohort durability, revenue concentration, or a perimeter-consistent
    bridge between historical and current customer counts.
sections:
  - id: customer-segments
    title: Customer segments and buying centers
    body: >-
      I-TRACING serves a broad enterprise-security buying center rather than a single end user.
      The addressable buyer set includes CISOs, security operations leaders, identity teams,
      infrastructure and cloud owners, risk functions, and public procurement teams. Its public
      positioning spans consulting, implementation, managed detection and response, identity and
      access management, cloud security, and data protection, which supports both project-led and
      recurring managed-service entry points. Company materials emphasize large enterprises,
      while Oakley's 2024 report says a dedicated mid-market sales stream was added to the
      historical large-enterprise focus. Public awards further show demand from transport,
      housing, media, and regional institutional buyers. These categories establish buyer breadth,
      but no public source allocates customers or revenue by segment, geography, service line, or
      contract type.
    claimRefs: [CU001, CU002, CU003, CU005, CU011, CU012, CU013]
    tableRefs: [TU001]
  - id: adoption-and-scale
    title: Adoption trajectory and operating scale
    body: >-
      The strongest historical adoption disclosure is Oakley's report that I-TRACING acquired
      more than 70 new customers during 2024 from a base of approximately 250. The company's
      current homepage separately claims more than 600 enterprise customers, 2.3 million protected
      users, 25 terabytes of logs processed per day, and 400 million events processed per day.
      Together these figures indicate materially larger reach and workload than the historical
      standalone base. They do not, however, form a clean cohort bridge: the current count may
      reflect acquisitions, partner combinations, scope changes, and different definitions of an
      enterprise customer. Workload figures also lack customer-level distributions, so they cannot
      demonstrate average deployment depth or retention. The trajectory is therefore positive but
      only directionally comparable.
    claimRefs: [CU003, CU004, CU006, CU007, CU008]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-customer-proof
    title: Named customer and procurement proof
    body: >-
      Public proof goes beyond an undifferentiated logo wall, but its evidentiary strength varies.
      Matmut's identity leader describes an IAM and cybersecurity relationship built over years,
      and Motul's CIO describes I-TRACING as raising the company's cybersecurity level; both are
      customer quotations hosted by I-TRACING and therefore confirm named relationships without
      independently quantifying outcomes. Public procurement records are firmer on commercial
      structure: Pappers lists a five-year, EUR13 million COMUTITRES award, a four-year,
      EUR2.02575 million Action Logement CIAM SaaS award, and a four-year, EUR280,000 CCI Paris
      Ile-de-France security-audit and incident-response award. Award records still do not prove
      full deployment, realized value, renewal, or current utilization.
    claimRefs: [CU009, CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: durability-expansion-and-risk
    title: Durability, expansion, and concentration risk
    body: >-
      The evidence supports multi-surface expansion potential: customers can enter through
      assessment or implementation work and extend into identity, cloud, data protection, or
      continuous managed detection. External requirements reinforce the mechanism. Swift's
      Customer Security Programme describes mandatory controls, independent assessment, and
      attestation workflows, while ENISA's NIS2 guidance maps regulatory requirements to
      implementation evidence; both can create recurring compliance and assurance work for
      security providers. Durability remains unverified. No assigned source discloses NRR, GRR,
      churn, renewals, contract backlog, customer-level revenue, or top-customer concentration.
      Pappers' reported 112-day client payment period for 2023 also indicates procurement and
      working-capital friction, not churn. The underwriting case should therefore treat expansion
      as plausible and retention quality as an open diligence item.
    claimRefs: [CU014, CU015, CU016]
callouts:
  - calloutType: strength
    title: Commercial proof extends beyond logos
    body: >-
      Named customer quotations and multi-year public awards show identifiable users, use cases,
      and contract periods, although realized outcomes remain largely undisclosed.
    claimRefs: [CU009, CU010, CU011, CU012, CU013]
  - calloutType: risk
    title: Retention and concentration remain opaque
    body: >-
      Public customer counts cannot substitute for cohort retention, recurring-revenue mix,
      renewal behavior, or customer-level revenue concentration.
    claimRefs: [CU003, CU004, CU014]
