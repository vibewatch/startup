figures:
  - id: FU001
    title: Enterprise customer journey and expansion surfaces
    type: journey-map
    summary: >-
      Regulatory and operational needs can lead from assessment into implementation and continuous
      managed security, but public evidence does not quantify conversion or retention between stages.
    data:
      items:
        - label: Risk and compliance trigger
          detail: Security incidents, NIS2 obligations, or sector control frameworks create a need to assess gaps.
          touchpoints: ["CISO and risk review", "Control mapping", "Procurement scoping"]
        - label: Consulting and audit
          detail: Teams assess architecture, controls, identity, data protection, and remediation priorities.
          touchpoints: ["Security audit", "Strategy", "Implementation plan"]
        - label: Integration and remediation
          detail: Buyers deploy or improve IAM, cloud security, data controls, and supporting security tooling.
          touchpoints: ["IAM", "Cloud security", "Data protection"]
        - label: Managed operations
          detail: Eligible workloads transition to continuous monitoring, detection, response, and incident support.
          touchpoints: ["CyberSOC", "MDR", "CERT / CSIRT"]
        - label: Evidence and attestation
          detail: Regulated customers maintain assessment evidence, attestations, remediation dates, and audit support.
          touchpoints: ["Independent assessment", "Attestation", "Remediation tracking"]
        - label: Scope expansion
          detail: A successful relationship can extend across services, locations, business units, and technology partners.
          touchpoints: ["Cross-sell", "Geographic rollout", "Continuous optimization"]
    approximationNotes: "Conceptual journey only; no conversion rates, stage populations, or retention rates are publicly disclosed."
    claimRefs: [CU015, CU016]
