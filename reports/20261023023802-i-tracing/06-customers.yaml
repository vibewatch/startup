  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: Cohort-level NRR, GRR, logo churn, renewal rates, contract duration, and recurring-revenue retention by service line.
      whyItMatters: Customer-count growth cannot establish durable recurring revenue or distinguish acquisition-driven perimeter expansion from organic retention.
      diligencePath: Request three years of monthly customer cohorts, gross and net retention bridges, renewal schedules, churn reasons, and recurring-revenue definitions.
      relatedQuestionRefs: [QU005]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-1, top-5, and top-10 customer revenue shares, channel contribution, contract backlog, and exposure to public-sector procurement.
      whyItMatters: Large multi-year awards and enterprise relationships could coexist with meaningful revenue concentration or renewal cliffs.
      diligencePath: Obtain anonymized customer-level revenue, gross margin, contract dates, renewal status, channel attribution, and concentration trends for the last three years.
      relatedQuestionRefs: [QU007]
    - type: conflicting-data
      severity: material
      topic: customer-count
      missingEvidence: A perimeter-consistent reconciliation from the approximately 250-customer 2024 base to the current 600-plus enterprise-customer claim.
      whyItMatters: The observed increase may include acquisitions, different customer definitions, or combined-group scope rather than comparable organic additions.
      diligencePath: Request a customer-count bridge separating gross additions, churn, acquired customers, dormant accounts, and definition changes by legal entity.
      relatedQuestionRefs: [QU010]
      relatedTableRefs: [TU002]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: A complete current customer list with deployment status, production scope, outcomes, contract value, and permission to reference.
      whyItMatters: The named-customer table is a sample and cannot establish prevalence, average deployment depth, or representative outcomes.
      diligencePath: Reconcile CRM and billing records to a referenceable customer schedule and validate a sample directly with customer references.
      relatedQuestionRefs: [QU003, QU004]
      relatedTableRefs: [TU003]
