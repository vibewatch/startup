company:
  name: I-TRACING
chapter:
  number: 1
  title: Company Overview
  summary: I-TRACING is a French managed cybersecurity services provider founded in 2005, with a Courbevoie headquarters, a broad international operating footprint, and sponsor-backed expansion. Current evidence supports a growing and profitable operating company, but the latest combined-group valuation, perimeter, and post-2024 financial disclosures remain incomplete.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: "I-TRACING is legally registered as I - TRACING, a French SAS with SIREN 484 841 127 and headquarters at 25 Quai du Président Paul Doumer in Courbevoie. INPI records the company’s activity start as 14 October 2005 and its principal activity as information-technology and telecommunications consulting, services, and products. The 2024 investor release describes the operating business more specifically as a managed-security-services pure player serving enterprise and midmarket customers, with SOC, CERT, incident-response, and related end-to-end services. That distinction matters: the legal entity description is broad, while the commercial proposition is specialized. The release says the group has subsidiaries across Europe, Asia, and North America, but the exact current consolidated perimeter after later mergers is not fully disclosed in the retained sources."
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, ownership, and governance
    body: "The strongest named leadership evidence identifies Théodore-Michel Vrangos as co-founder and president and Laurent Charvériat as co-founder. The 2024 transaction preserved meaningful management ownership: more than 80 managers and employees reinvested alongside Eurazeo, Oakley Capital, Sagard NewGen, Five Arrows Secondary Opportunities, and TPG GP Solutions. French registry evidence records I-Tracing Holding as president of the operating company and identifies two statutory auditors, while Pappers records a president change effective 4 November 2025. These facts show sponsor and management alignment, but they do not establish the full current board, voting rights, preference stack, or the extent to which founder operating authority remains concentrated. Key-person dependence therefore remains a diligence question rather than a quantified conclusion."
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: funding-scale-and-milestones
    title: Funding, scale, and milestone record
    body: The November 2024 transaction created a €180 million continuation fund with Eurazeo continuing as anchor investor and Oakley Capital joining in co-control; the release also names Sagard NewGen, Five Arrows Secondary Opportunities, and TPG GP Solutions. This is a financing commitment to the continuation vehicle, not a disclosed company valuation or cash balance. The same source reported more than 700 cybersecurity experts, more than 450 blue-chip customers, and approximately €150 million of expected 2024 revenue, while Mandos later reported 682 employees and $537 million of priced equity across two rounds. French company-data records show 2023 revenue of €112 million and EBITDA of €15.4 million for the registered entity, plus a December 2025 merger with I-Tracing Group. The figures are not directly interchangeable because they have different dates, perimeters, and issuers; current consolidated revenue, valuation, leverage, and customer concentration remain open.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
