  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Lens, Thesis evidence, Anti-thesis or uncertainty, What changes the view]
    rows:
      - ["Scale", "The company presents more than EUR230M of revenue.", "Period, accounting basis, and group perimeter are not stated.", "Audited post-merger revenue bridge."]
      - ["Growth", "The homepage presents more than 30% annual growth; Oakley reported 20% revenue growth for the 12 months to December 2024.", "The two growth statements use different disclosures and may use different perimeters.", "Like-for-like organic and acquired growth bridge."]
      - ["Profitability", "Pappers displays EUR15.4M of 2023 EBITDA for the French legal entity; Oakley reported 23% adjusted-EBITDA growth in 2024.", "Current combined EBITDA, adjustments, margin, and cash conversion are absent.", "Audited consolidated EBITDA and free-cash-flow bridge."]
      - ["Sponsor support", "A EUR180M continuation fund and broad management reinvestment were reported.", "Fund size is neither company cash nor a disclosed valuation.", "Executed transaction sources-and-uses and capitalization table."]
      - ["Valuation mark", "OCI marked its attributable I-TRACING holding at GBP35.6M at 31 December 2024.", "The mark equals OCI's residual cost and is not company enterprise value.", "Current independent valuation and ownership percentage."]
      - ["Corporate perimeter", "INPI records the December 2025 absorption of I-Tracing Group into I-TRACING.", "Public financial evidence predates the reorganized perimeter.", "Post-merger audited accounts and legal-entity schedule."]
    notes: "The table separates issuer claims, historical legal-entity data, sponsor marks, and company-level valuation; none is substituted for another."
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV012, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Required assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Recurring revenue and retention are strong; combined EBITDA and cash conversion reconcile; leverage and senior claims are modest.", "Test the upper end of relevant MSP/MSSP EV/EBITDA references only after company-specific normalization; no company value is presently calculable.", "Unsupported until private evidence confirms every assumption.", "Integration slippage, margin dilution, or senior-claim leakage."]
      - [Base, "Historical profitability remains directionally representative, but current perimeter and quality metrics require verification.", "Use the 8.9x private-MSP median as a cross-check, with explicit discounts or premiums for size, mix, retention, and leverage; no return estimate is supportable.", "Best-supported analytical posture, not a probability percentage.", "Entry price is set before audited combined earnings and net debt are known."]
      - [Bear, "Cash conversion is weak, growth is acquisition-dependent, concentration or churn is material, or the preference stack is senior-heavy.", "Value below broad MSP references and test equity proceeds after debt and preferences; no public evidence supports a numeric floor.", "Material and unquantified.", "Combined EBITDA misses, leverage rises, or commercialization and integration stall."]
    notes: "Multiple references come from different datasets and periods; scenarios are conditional frameworks, not forecasts, company valuation ranges, or probability assignments."
    claimRefs: [CV011, CV013, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Operating and sponsor evidence establish a credible platform, while unreconciled perimeter, price, and capital structure keep the call at track.
    data:
      nodes:
        - id: scale
          label: Operating scale
          detail: "Company presents >EUR230M revenue and >30% annual growth."
        - id: proof
          label: Historical proof
          detail: "2023 legal-entity revenue and EBITDA plus 2024 sponsor-reported growth."
        - id: sponsor
          label: Sponsor continuity
          detail: "EUR180M continuation fund reported; amount is not company cash."
        - id: benchmark
          label: Comparable filter
          detail: "Private MSP and MSSP multiples require business-mix and size adjustments."
        - id: gaps
          label: Gating gaps
          detail: "Current EV, combined EBITDA, net debt, retention, and preferences are absent."
        - id: decision
          label: Decision
          detail: "Track / research-more pending price and private diligence."
      edges:
        - {from: scale, to: proof}
        - {from: proof, to: sponsor}
        - {from: sponsor, to: benchmark}
        - {from: benchmark, to: gaps}
        - {from: gaps, to: decision}
    approximationNotes: "The flow is qualitative and does not assign value weights, probabilities, or conversion rates."
    claimRefs: [CV003, CV005, CV011, CV016]
callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: Operating evidence is investable context, but a buy call requires a current price, audited combined earnings, and complete debt and preference terms.
    claimRefs: [CV008, CV009, CV016]
  - calloutType: risk
    title: Do not convert sponsor marks into company value
    body: The EUR180 million continuation fund is a fund amount, and OCI's GBP35.6 million mark is its attributable holding value; neither is I-TRACING enterprise value.
    claimRefs: [CV004, CV010]
