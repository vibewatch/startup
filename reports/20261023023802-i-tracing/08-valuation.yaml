company:
  name: I-TRACING
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a scaled, growing cybersecurity-services platform, but it does not establish a current company-level enterprise value, combined-group earnings base, or investor entry price. The resulting stance is track and research-more rather than buy, with valuation contingent on audited perimeter, leverage, preference, retention, and cash-conversion evidence.
sections:
  - id: evidence-led-recommendation
    title: Evidence-led recommendation
    body: >-
      I-TRACING has credible operating proof, but the evidence is not yet sufficient
      for a price-sensitive investment call. Its current homepage presents more than
      EUR230 million of revenue and more than 30% annual growth without stating the
      measurement period, accounting basis, or consolidation perimeter. Its Google
      Cloud page adds a company-issued operating signal: a certified MSSP partnership
      and a 24/7 follow-the-sun CyberSOC across three continents. Historical third-party
      and sponsor disclosures strengthen the operating case: Pappers displays EUR112
      million of revenue and EUR15.4 million of EBITDA for the 2023 French legal entity,
      while Oakley reported 20% revenue growth and 23% adjusted-EBITDA growth for the
      12 months to December 2024. These metrics differ in vintage and perimeter, so
      they support platform quality rather than a current group valuation. The
      recommendation is therefore track and research-more, with medium confidence,
      high underwriting risk, and an unknown valuation stance.
    claimRefs: [CV001, CV002, CV003, CV006, CV007, CV008, CV009, CV016]
    tableRefs: [TV001]
  - id: financing-and-price-context
    title: Financing and price context
    body: >-
      The November 2024 sponsor transaction demonstrates capital support but does not
      disclose I-TRACING's equity value or cash available to the company. Tech Funding
      News reported that Eurazeo raised a EUR180 million continuation fund and that
      more than 80 managers and employees reinvested; the EUR180 million amount is the
      fund size, not company funding or valuation. Oakley Capital Investments' 2024
      annual report provides a narrower mark: its look-through Fund V holding in
      I-TRACING had a GBP35.6 million residual cost and GBP35.6 million fair value at
      31 December 2024. That is OCI's attributable investment value, not I-TRACING's
      enterprise value. The same audited report identifies subjective and complex
      valuation risk for unquoted investments. INPI then records the absorption of
      I-Tracing Group into I-TRACING effective 26 December 2025, making a current
      post-merger perimeter, capitalization table, net-debt bridge, and preference
      schedule prerequisites to pricing.
    claimRefs: [CV004, CV005, CV010, CV011, CV012, CV016]
    tableRefs: [TV002]
  - id: benchmark-and-scenario-discipline
    title: Benchmark and scenario discipline
    body: >-
      Independent references define a broad valuation vocabulary, not a direct comp
      answer. Aventis reports an approximately 8.9x median EV/EBITDA multiple across
      120 disclosed private MSP transactions with a USD38.5 million median transaction
      size. For selected listed MSPs, it reports H2 2024 medians of 11.4x EV/EBITDA
      and 1.3x EV/revenue, while explicitly warning that pure-play listed MSPs are rare
      and diversified revenue streams impair comparison. Greenwich's managed-security
      precedent table shows three-year medians of 13.7x EV/EBITDA and 1.5x EV/revenue.
      These datasets vary by deal size, business mix, public/private status, and
      period; none supplies an I-TRACING transaction price. A bull case can justify
      testing the upper end only after recurring revenue, retention, normalized
      combined EBITDA, and low leverage are verified. A base case treats the 8.9x
      private-MSP median as a cross-check, not an answer. A bear case requires a
      discount for weak cash conversion, integration risk, customer concentration, or
      senior claims. No company-value range or return probability is supportable from
      the assigned public evidence.
    claimRefs: [CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence-exit-and-thesis-breaks
    title: Diligence, exit, and thesis breaks
    body: >-
      Entry discipline should focus on the variables that convert operating quality
      into equity returns. Management and sponsors should provide audited post-merger
      consolidated accounts; normalized EBITDA and cash conversion; net debt and debt
      maturities; recurring versus project revenue; gross and contribution margins;
      customer concentration, renewal, and churn cohorts; acquisition purchase-price
      accounting; and the complete capitalization and preference stack. Exit readiness
      also requires a credible sponsor-liquidity path, evidence that the combined
      platform can be separated or sold cleanly, and a buyer set that values services
      rather than software economics. The thesis improves if current revenue reconciles
      across entities, retention proves durable, EBITDA converts to cash, and acquired
      operations integrate without leverage expansion. It breaks if the continuation
      structure embeds an entry price above supportable service-company multiples,
      if combined EBITDA materially trails the historical French entity margin, if
      churn or concentration undermines recurring revenue, or if senior claims absorb
      plausible exit proceeds. Until those tests clear, target return, hold period, and
      exit value remain material gaps rather than estimable outputs.
    claimRefs: [CV006, CV007, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
