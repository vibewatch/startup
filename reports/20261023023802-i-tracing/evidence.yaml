evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      A current company-level valuation, transaction multiple, or secondary-clearing price for the November 2024
      continuation transaction.
    whyItMatters: The continuation-fund size is not a valuation and cannot support an investment-price conclusion.
    diligencePath: Request the latest sponsor transaction memo, cap table, valuation report, or lender package under NDA.
    relatedQuestionRefs:
      - QO009
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      A reconciled consolidated perimeter linking the 2023 registered-entity accounts to the international group and
      post-December-2025 merger.
    whyItMatters: Reported revenue, headcount, and customer figures use different issuers, dates, and scopes.
    diligencePath: Obtain audited consolidated accounts and a legal-entity-to-group perimeter bridge.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: The current board, voting rights, preference stack, and founder and management ownership percentages.
    whyItMatters: Public announcements establish participants but not control mechanics or key-person exposure.
    diligencePath: Request the current articles, shareholders agreement, board composition, and capitalization table.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: minor
    topic: adverse-events
    missingEvidence: >-
      A current, systematic review of litigation, sanctions, cyber incidents, layoffs, and material leadership
      departures.
    whyItMatters: The assigned pool contains registry and market context but no comprehensive adverse-event dataset.
    diligencePath: Run a documented legal, regulatory, and adverse-news search in the next refresh.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: company-sizing
    missingEvidence: I-TRACING revenue by managed service line, geography, customer segment, and recurring versus project work.
    whyItMatters: >-
      Global market estimates cannot be translated into a company-specific SAM, SOM, or valuation without a revenue and
      perimeter bridge.
    diligencePath: >-
      Request audited segment reporting, service-line revenue, geographic revenue, backlog, and recurring-revenue
      definitions from management.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: buyer-segments
    missingEvidence: Customer-level budget ownership, renewal, expansion, win/loss, and concentration evidence.
    whyItMatters: >-
      Demand drivers do not establish repeatable conversion, pricing power, or the durability of I-TRACING's obtainable
      share.
    diligencePath: >-
      Review CRM cohort data, renewal schedules, customer concentration, win/loss notes, and representative procurement
      decisions.
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: A reconciled definition and methodology bridge across the three published MSS market estimates.
    whyItMatters: Forecast dispersion changes the implied growth and valuation narrative even though all sources indicate expansion.
    diligencePath: >-
      Obtain the full methodologies or analyst notes and normalize included services, geographies, currency, and
      forecast periods.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: private-evidence-only
    severity: material
    topic: adoption-constraints
    missingEvidence: Evidence of I-TRACING's service-level performance, response times, compliance outcomes, and customer references.
    whyItMatters: >-
      Outsourcing concerns around visibility, control, and third-party risk require operational proof to support a
      durable buyer proposition.
    diligencePath: >-
      Request anonymized SLA performance, incident-response metrics, audit attestations, customer references, and churn
      analysis.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable current quotes and realized contract economics for I-TRACING and its direct MSSP, platform, and
      integrator alternatives.
    whyItMatters: Without price and scope normalization, breadth cannot be translated into win rate, margin, or pricing power.
    diligencePath: Collect anonymized bids, renewals, service-level schedules, and realized revenue by customer and service line.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Customer concentration, renewal, expansion, churn, and win-loss evidence against named alternatives.
    whyItMatters: >-
      Managed-service durability depends on recurring customer trust and switching friction that public sources do not
      quantify.
    diligencePath: Request cohort retention, renewal rates, churn reasons, reference calls, and competitive win-loss analyses.
    relatedQuestionRefs:
      - QP006
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: material
    topic: integration
    missingEvidence: Post-acquisition revenue, margin, staffing, and service-quality outcomes for the European buy-and-build roadmap.
    whyItMatters: Expansion capital supports optionality but does not prove that integration strengthens the moat.
    diligencePath: >-
      Review acquisition scorecards, integration milestones, customer retention, and service-level incidents by acquired
      perimeter.
    relatedQuestionRefs:
      - QP006
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Current realized pricing, revenue mix, customer concentration, renewal, CAC, sales cycle, payback, gross margin,
      and cash conversion by service line.
    whyItMatters: >-
      Without these measures, reported growth and historical EBITDA cannot be translated into durable recurring revenue
      quality or forward unit economics.
    diligencePath: >-
      Request audited segment reporting, cohort retention, contract schedules, price realization, sales funnel metrics,
      and service-line contribution margins.
    relatedQuestionRefs:
      - QI001
      - QI003
      - QI004
  - type: conflicting-data
    severity: material
    topic: perimeter
    missingEvidence: >-
      A current audited bridge reconciling I-TRACING operating-company, I-TRACING GROUP, acquired entities, and the
      post-December-2025 legal perimeter.
    whyItMatters: >-
      Revenue, cash, debt, and margin figures differ materially by entity and cannot support leverage or liquidity
      underwriting without a common scope.
    diligencePath: >-
      Obtain consolidated 2024-2025 accounts, acquisition accounting, debt schedule, covenant package, cash bridge, and
      integration-cost ledger.
    relatedQuestionRefs:
      - QI002
      - QI006
      - QI008
      - QI009
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public repository, package registry, API forum, technical talk, practitioner-community discussion, or other
      attributable developer-engagement signal.
    whyItMatters: >-
      Without a developer or practitioner signal, external reviewers cannot assess technical adoption, release activity,
      contributor depth, or integration friction.
    diligencePath: >-
      Request the current developer portal, API documentation, release history, public engineering talks, repository
      list, and partner-developer activity metrics.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: product-roadmap
    missingEvidence: >-
      A dated product and platform roadmap showing owned versus third-party components, acquired-capability integration,
      release milestones, and end-of-life policy.
    whyItMatters: >-
      The roadmap determines whether acquisitions and service breadth become a coherent scalable platform or remain
      operationally fragmented.
    diligencePath: >-
      Review the board-approved 24-month roadmap, architecture decision records, integration milestones, product
      ownership map, and delivery dependencies.
    relatedQuestionRefs:
      - QE010
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      Service-level objectives and attainment, severity-based response times, incident and outage history, recovery-test
      results, and customer-specific availability reporting.
    whyItMatters: A 24/7 managed-security claim cannot be underwritten without measured service continuity and response performance.
