evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-and-headcount-disclosure
    missingEvidence: Current customer count, deployment count, and employee headcount as of 2026.
    whyItMatters: >-
      These metrics are standard scale signals for a venture-backed hardware company and materially affect diligence on
      traction and operating leverage.
    diligencePath: Request current board deck KPI pages, customer deployment summaries, and HR headcount by function and geography.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-and-cap-table
    missingEvidence: Current board composition, committee roles, investor-director seats, and ownership percentages.
    whyItMatters: >-
      Governance rights, cap-table concentration, and founder versus investor control determine financing flexibility
      and downside governance risk.
    diligencePath: >-
      Obtain the latest cap table, board observer list, and post-Series C governance documents directly from the company
      or lead investors.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: absolute-revenue-disclosure
    missingEvidence: Audited 2024 and 2025 revenue, gross margin, backlog conversion, and 2026 run-rate detail.
    whyItMatters: >-
      The company discloses growth direction and 2024 revenue, but absolute 2025-2026 revenue and margin quality remain
      too thin for valuation work.
    diligencePath: Request management accounts, auditor-prepared statutory statements, and sales pipeline-to-revenue conversion data.
    relatedQuestionRefs:
      - QO017
  - type: missing-source
    severity: material
    topic: capital-structure-terms
    missingEvidence: >-
      Debt facilities, liquidation preferences, secondaries, per-share pricing, and any side letters for the 2025 and
      2026 rounds.
    whyItMatters: >-
      Headline funding totals and valuation do not reveal preference stack, dilution burden, or whether insiders
      required rescue protections.
    diligencePath: Review transaction documents, shareholder agreements, and the post-closing capitalization table.
    relatedQuestionRefs:
      - QO028
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: public-adverse-screening
    missingEvidence: Comprehensive legal, sanctions, safety, and enforcement search results beyond open-web source discovery.
    whyItMatters: >-
      Open-web review found funding stress and permitting documents but cannot conclusively rule out private litigation
      or non-indexed incidents.
    diligencePath: >-
      Run paid legal database checks, sanctions screening, and insurance or incident-history diligence before investment
      committee.
    relatedQuestionRefs:
      - QO026
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-chronology
    missingEvidence: >-
      Internal customer launches, manufacturing ramp dates, and undisclosed financing-side events not covered by public
      announcements.
    whyItMatters: >-
      The public timeline is sufficient for overview work, but misses internal execution markers needed to underwrite
      scale-up timing.
    diligencePath: >-
      Request a management-prepared operating timeline covering pilot deployments, factory milestones, and
      board-approved financing events.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: warehouse-attach-rate
    missingEvidence: >-
      Public deployment budgets showing how much of warehouse automation spend is actually battery or power-system
      content.
    whyItMatters: >-
      Without subsystem attach rates, the warehouse automation TAM can only be used as contextual adjacency and not as a
      direct Nyobolt SAM.
    diligencePath: >-
      Request BOM-level budgets or battery-share disclosures from Symbotic, Geekplus, and at least two system
      integrators.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: missing-source
    severity: material
    topic: rack-level-ups-share
    missingEvidence: A public breakdown of rack-level or distributed AI power modules within total data-centre UPS spend.
    whyItMatters: >-
      Nyobolt is selling a narrower power layer than whole-facility UPS, so total UPS figures overstate the addressable
      opportunity unless the rack-level share is known.
    diligencePath: >-
      Request design-partner budgets, rack-level pilot scopes, or vendor quotes that isolate module spend per MW or per
      rack.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: private-evidence-only
    severity: blocking
    topic: pricing-and-pipeline
    missingEvidence: Nyobolt ASPs, segment gross margins, qualified pipeline, retrofit installed-base counts, and segment win rates.
    whyItMatters: A defensible SOM model requires management data on pricing and conversion, not only top-down market reports.
    diligencePath: >-
      Ask management for top-20 opportunity funnel detail by segment, installed-base retrofit counts, and pricing by
      module or pack.
    relatedQuestionRefs:
      - QM025
      - QM026
  - type: conflicting-data
    severity: material
    topic: boundary-drift
    missingEvidence: >-
      An apples-to-apples third-party market cut that bridges warehouse automation, ACR/picking automation, industrial
      motive power, and rack-level UPS.
    whyItMatters: Current sources all measure different market layers, so using one number for valuation creates false precision.
    diligencePath: >-
      Commission a single analyst or banking work-up that normalizes unit, year, geography, and system-boundary
      assumptions across the served segments.
    relatedQuestionRefs:
      - QM023
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Realized selling prices, quote ranges, or customer payback data for Nyobolt and the closest substitutes.
    whyItMatters: >-
      Without price and payback evidence, the public record cannot verify whether Nyobolt's performance edge clears
      procurement thresholds versus UPS, wireless-charging, or battery-swap alternatives.
    diligencePath: >-
      Request recent proposals, customer ROI decks, and realized ASP / gross-margin bridges by segment, then benchmark
      them against incumbent UPS and charging-architecture bids.
    relatedQuestionRefs:
      - QP019
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: deployment-breadth
    missingEvidence: Named live deployments, renewal rates, and fleet counts outside the Symbotic relationship.
    whyItMatters: One strong partner can prove feasibility, but it does not prove a diversified or durable competitive position.
    diligencePath: >-
      Request a customer list by segment, unit counts, installation dates, and case studies for at least three
      non-Symbotic deployments.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: niobium-advantage
    missingEvidence: >-
      Side-by-side cost, sourcing, and qualification economics for Nyobolt versus Echion and versus incumbent LFP or UPS
      substitutes.
    whyItMatters: >-
      Public evidence shows Echion can also scale niobium fast-charge materials, so the uniqueness of Nyobolt's niobium
      position is still unproven from open sources.
    diligencePath: >-
      Request BOM-level chemistry economics, supplier concentration data, and customer qualification outcomes for
      Nyobolt and the closest niobium alternatives.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Signed customer contracts or invoice-level ASP by robotics, data-centre, and vehicle program.
    whyItMatters: >-
      Without realized pricing, it is impossible to separate performance marketing from actual monetization power or to
      evaluate discounting discipline.
    diligencePath: Request contract schedules, order forms, and any standard pricing architecture used by sales teams.
    relatedQuestionRefs:
      - QI002
      - QI024
    relatedTableRefs:
      - TI002
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-and-unit-cost
    missingEvidence: Gross margin by product family, BOM cost per kWh or system, service margin, and warranty reserve assumptions.
    whyItMatters: >-
      The company is hardware-heavy and capital-intensive, so gross margin and reserve quality are central to whether
      the business can ever fund itself.
    diligencePath: Request management accounts, gross-margin bridge by product family, and warranty / replacement reserve policy.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, minimum liquidity threshold, and a 12-month cash plan.
    whyItMatters: >-
      Recent fundraising removes the immediate crisis narrative, but capital adequacy cannot be underwritten from
      fundraising cadence alone.
    diligencePath: Request monthly cash bridge, forecast burn, and board runway materials covering 2026-2027.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: project-finance-and-customer-concentration
    missingEvidence: >-
      Symbotic revenue share plus the financing structure, milestone schedule, and counterparties behind Rajasthan or
      any similar infrastructure deals.
    whyItMatters: >-
      The best positive signal and the most important concentration risk both sit around named counterparties that are
      only lightly disclosed publicly.
    diligencePath: >-
      Request top-customer concentration analysis and any project-finance, SPV, or milestone payment documents tied to
      infrastructure programs.
    relatedQuestionRefs:
      - QI018
    relatedTableRefs:
      - TI001
      - TI004
      - TI005
  - type: access-blocked
    severity: material
    topic: audited-accounts-detail
    missingEvidence: >-
      Machine-readable 2024 Companies House accounts line items or management accounts that bridge 2023 losses to 2024
      revenue inflection.
    whyItMatters: >-
      The public filing confirms accounts exist, but the image-only document available through public fetch does not
      expose usable line-item statement data for financial analysis.
    diligencePath: >-
      Obtain machine-readable statutory accounts, OCR'd statements verified by management, or internal management
      accounts for 2024 and 2025 YTD.
    relatedQuestionRefs:
      - QI003
      - QI017
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: ai-data-centre-customers
    missingEvidence: >-
      Named AI data-centre customers, live installation locations, uptime results, and rack-level deployment
      architecture for the Dynamic Response System or Rajasthan-related programs.
    whyItMatters: >-
      Without named installations and operating results, the AI data-centre product line remains more of a roadmap and
      problem statement than a fully verified deployment business.
    diligencePath: >-
      Request named customer references, paid pilot counts, site diagrams, uptime metrics, and whether Rajasthan is a
      binding project, staged pilot, or exploratory MOU.
    relatedQuestionRefs:
      - QE017
    relatedTableRefs:
      - TE001
      - TE002
      - TE005
  - type: missing-source
    severity: material
    topic: commercial-vehicle-deployments
    missingEvidence: >-
      Named commercial-vehicle customers, production start dates, duty-cycle test results, and field service data for
      buses, trucks, forklifts, or port equipment.
    whyItMatters: >-
      Vehicle product maturity cannot be underwritten from marketing use cases alone because fast-charge economics and
      thermal demands vary sharply by fleet profile.
    diligencePath: >-
      Ask for named fleet programs, SOP calendars, route-duty-cycle data, charger compatibility details, and customer
      references segmented by vehicle class.
    relatedQuestionRefs:
      - QE018
    relatedTableRefs:
      - TE001
      - TE002
  - type: private-evidence-only
    severity: material
    topic: pack-production-and-reliability
    missingEvidence: >-
      Pack-level production throughput, yield, warranty terms, failure rates, service intervals, and replacement
      economics across robotics, rack-power, and vehicle programs.
    whyItMatters: >-
      The commercial attractiveness of fast-charge hardware depends not just on chemistry but on pack reliability, field
      service burden, and whether yields hold as volumes scale.
    diligencePath: >-
      Request manufacturing dashboards, first-pass yield data, warranty reserve assumptions, failure-mode analyses, and
      customer-return statistics by product line.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE003
      - TE004
      - TE005
  - type: private-evidence-only
    severity: material
    topic: third-party-performance-validation
    missingEvidence: >-
      Full third-party validation packages for 4 minute 37 second charging, 4,000 plus fast-charge cycles, 20,000 rapid
      cycles in grid use, and Symbotic field-performance deltas.
    whyItMatters: >-
      The main technical value proposition is speed plus durability; without public protocols and long-duration field
      results, headline numbers remain strong but not fully auditable.
    diligencePath: >-
      Request independent lab reports, partner test protocols, field telemetry, degradation curves, and failure
      thresholds for the quoted cycle-life and charging-speed claims.
    relatedQuestionRefs:
