  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue conversion miss
        - Verified 2025-2026 revenue lands materially below a ~$30M-$40M base range
        - Current unicorn pricing loses support immediately because the public denominator stays too small.
        - Re-underwrite from the bear range and assume down-round risk is live.
      - - Partner concentration persists
        - Symbotic remains the dominant proof point and other robotics / data-centre customers do not become material
        - The thesis shrinks from a platform opportunity to a concentrated supplier relationship.
        - Apply a steeper customer-concentration discount and pause any aggressive entry.
      - - Preference overhang emerges
        - >-
          Series C terms include participating preferred, ratchets, or other rights that materially subordinate common
          holders
        - Headline valuation stops representing true entry economics.
        - Do not use the $1B mark as a fair-value anchor until the waterfall is understood.
      - - Manufacturing or supply-chain setback
        - Yield, warranty, or niobium-input bottlenecks delay volume delivery
        - Battery-scale-up peers show that commercialization delays compress valuation fast.
        - Move to a lower multiple band and reassess capital needs.
      - - Data-centre optionality stays conceptual
        - No signed, revenue-bearing AI power contracts beyond MOUs and narrative positioning
        - One of the biggest drivers of the bull case disappears, leaving the mark dependent on robotics alone.
        - Treat the current round as a robotics-only case until contract proof exists.
    notes: Each trigger is meant to be monitorable in diligence or in the next financing cycle, not an abstract macro risk.
    claimRefs:
