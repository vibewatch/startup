companyProfile:
  summary: >-
    Nyobolt is a Cambridge-headquartered battery systems company legally incorporated in 2019 after earlier University
    of Cambridge research work. It was co-founded by Sai Shivareddy and Clare Grey, and sells high-power integrated
    energy systems that combine proprietary niobium-based anode chemistry with cells, modules, battery-management
    systems, power electronics, and chargers for uptime-critical applications such as warehouse robotics, AI data
    centres, commercial vehicles, and industrial fleets. The company is a private Series C-stage business: it raised
    $60M in May 2026 at a valuation above $1B after a $30M April 2025 round, with disclosed capital now at least about
    $160M. Public traction improved into 2026, including more than $9M of 2024 revenue, more than $150M of contract
    value, UN38.3-certified cells, and live Symbotic production use, but customer count, headcount, gross margin, and
    financing terms remain undisclosed.
