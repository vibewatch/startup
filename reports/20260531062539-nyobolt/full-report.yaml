  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - >-
          Strategic validation from Symbotic, materially better robot battery performance, a new $60M round, and public
          support for industrial scaling suggest Nyobolt is solving a real uptime problem in robotics and power
          infrastructure.
        - >-
          Audited revenue above the upper public range, visible gross-margin progress, and meaningful multi-customer
          wins outside Symbotic would make the current mark easier to defend.
      - - Anti-thesis
        - >-
          Absolute revenue is still thinly disclosed, margin and cap-table terms are private, peer battery scale-up
          still consumes heavy capital, and adverse sector outcomes show how quickly sentiment can reverse.
        - >-
          If diligence finds weak backlog conversion, structured downside protection ahead of new investors, or
