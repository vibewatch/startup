  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Nyobolt's public materials describe an application-led power-systems business, not a commodity battery SKU
              catalog. Across warehouse robotics, AI data centres, and commercial vehicles, the company markets
              integrated high-power systems built from proprietary anodes, cells, packs, battery-management software,
              and power electronics. The monetization pattern also looks enterprise-led and bespoke rather than
              list-priced: the data-centre and vehicle pages route buyers into lead forms or get-in-touch workflows and
              focus on uptime and total-cost-of-ownership claims instead of advertising per-kWh or per-system tariffs.
              That suggests application-specific quoting by customer, duty cycle, and integration scope. Revenue quality
              is nevertheless stronger than a generic pilot-stage hardware story because Symbotic is already using
              Nyobolt batteries in live warehouse deployments and then led the 2026 round. Public commercial numbers
              remain company-claimed, but they are directionally meaningful: April 2025 materials said 2024 revenue
              exceeded $9 million and contract value exceeded $150 million, while May 2026 materials claimed 5x
              year-on-year revenue growth. Those signals support real demand, but realized ASP, contract duration,
              revenue-recognition timing, and mix by robotics versus data-centre programs remain private.
