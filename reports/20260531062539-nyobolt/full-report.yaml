      - number: '5.4'
        title: Dependencies, limits, and technical judgment
        blocks:
          - type: paragraph
            body: >-
              Nyobolt's product case is strongest where uptime economics are obvious and the duty cycle is brutal. That
              is why warehouse robotics currently looks like the company's best disclosed wedge: Symbotic gives named
              proof that the chemistry plus pack and charger integration can outperform ultracapacitors in a real fleet
              context, and Nyobolt's own workflow materials explain why short opportunity charging matters. Highways
              Today's 2026 industrial-AI framing points in the same direction by treating energy infrastructure, not
              only software, as the bottleneck for autonomous systems at scale. The harder challenge is extending that
              story into broader platforms without overselling it. AI data-centre and commercial-vehicle pages clearly
              describe legitimate problems, but named customer proof, public field metrics, and operating references
              remain thin. Supply and physics also impose limits. The Haverhill permit shows Nyobolt depends on niobium
              pentoxide and tungsten trioxide inputs, while SFA's niobium market work highlights how concentrated
              niobium supply remains around Brazil and CBMM. SFA also notes the core trade-off of niobium-based anodes:
              high charging speed and long cycle life can come with lower energy density than graphite or silicon, which
              is acceptable in uptime-first robots and power-buffering systems but harder to generalize across all EV
              use cases. The underwriting conclusion is therefore technical but cautious. Nyobolt appears to have real
              product and process substance, not just lab IP, yet much of the headline performance narrative is still
              anchored in company or partner disclosures. Investors should treat the robotics proof as strongest, the
              manufacturing path as credible but not fully disclosed, and the broader AI data-centre and vehicle
              platform claims as promising but not yet independently validated at the same depth.
