        title: Public gaps and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Public filings confirm that Nyobolt is still relying on equity issuance and increasingly complex share
              rights rather than showing self-funded scale. Companies House records show repeated allotments through
              2025 and 2026, a February 2026 confirmation statement with ordinary, A ordinary, and B ordinary shares
              totaling 4,528,292 shares, and an April 2026 SH01 that added C ordinary shares plus anti-dilution language
              and lifted total shares to 4,868,654. That does not by itself imply distress, but it does confirm
              financing complexity and investor-protection mechanics that press releases largely omit. The overall
              underwriting conclusion is therefore mixed. Nyobolt has clearly crossed from research project to real
              commercial deployment, and the Symbotic relationship materially improves revenue credibility. But the $1
              billion valuation still rests on evidence gaps around realized pricing, gross margin, customer
              concentration, and liquidity. The next diligence step should focus less on whether the chemistry works and
              more on contract schedules, gross-margin build, working-capital requirements, and whether data-centre
