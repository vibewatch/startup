      - number: '1.2'
        title: Founders, Leadership, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              Nyobolt's founder narrative is unusually central to the company's current commercial positioning. Sai
              Shivareddy remains the CEO and outward-facing operator, while Clare Grey remains the chief scientist and
              scientific anchor for the chemistry and materials story. The official leadership page adds an operating
              bench that includes CTO Brian Barnett, EVP/CCO/CFO Ramesh Narasimhan, and VP Finance Rajganesh
              Ramachandran, which suggests the company has built a more functional management layer than many battery
              deep-tech peers at similar disclosure levels. Governance visibility is still incomplete, however.
              Companies House shows 13 officers and three resignations, so the governance perimeter is broader than the
              website implies, yet public sources still do not give a full board committee map, investor seat
              allocation, or ownership percentages. The PSC page is also notable because it currently says there is no
              active registrable person or legal entity with significant control, which means outside observers cannot
              infer control from PSC filings alone. For diligence purposes, that makes Sai Shivareddy a key-person
              commercial dependency and Clare Grey a key-person scientific dependency, while exact investor governance
              influence remains a material open question.
