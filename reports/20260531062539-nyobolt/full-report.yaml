chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origin, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Nyobolt is the trading identity of NYOBOLT LIMITED, an active UK private company incorporated on 5 March
              2019 and still registered at Evolution Business Park in Impington, Cambridge. The company's public story
              needs one important distinction: its academic origin predates its legal incorporation. Cambridge
              Enterprise says the technology spun out of the Yusuf Hamied Department of Chemistry in 2016, Nyobolt's own
              about page highlights a 2018 technical breakthrough by Clare Grey's team, and the legal company was
              launched in 2019 by Clare Grey and Sai Shivareddy. Commercially, Nyobolt is not presenting itself as a
              commodity cell vendor. Its homepage and solutions pages consistently market high-power, integrated energy
              systems for mission-critical uptime, combining chemistry, cells, packs, power electronics, and software
              into enterprise deployments. The current application set spans warehouse robotics and humanoids, AI data
              centre rack support, commercial vehicles, and other uptime-critical industrial fleets. Public materials
              also show an operating footprint beyond Cambridge, with facilities or offices in Bedford, Haverhill, Bad
              Duerkheim, and Tokyo, which suggests the company is organizing around R&D, manufacturing, and go-to-market
              coverage rather than a single-lab startup profile.
