  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Nyobolt (implied)
        - Private valuation against sparse public revenue anchors
        - >-
          $1.0B valuation; >100x on disclosed 2024 revenue, ~37x on a simple tripled-revenue case, and still ~22x on a
          generous ~$45M directional case
        - Shows how much future robotics and data-centre success investors are already capitalizing.
        - >-
          The denominator is uncertain because public disclosures do not provide a single clean 2025-2026 revenue
          bridge.
      - - Symbotic
        - Public warehouse-automation platform
        - About $28.0B market cap; roughly ~10x market-cap-to-annualized Q2 FY26 revenue
        - Best public proof that AI-enabled warehouse automation can sustain premium valuations when scale is real.
        - >-
          Much larger systems integrator with software, services, and public-market liquidity that Nyobolt does not yet
          have.
      - - AutoStore
        - Public warehouse-automation benchmark
        - 44.22B NOK market cap; 7.67x price/sales and 7.92x EV/revenue
        - Useful anchor for a profitable automation company serving similar warehouse customers.
        - >-
          AutoStore is a mature public automation vendor, not a private battery company, so its discount rate should be
          lower.
      - - Amprius
        - Public high-growth battery technology peer
        - $2.87B market cap; 29.43x price/sales and 31.59x EV/revenue
        - >-
          Closest retained public comp for an advanced battery company still being valued on growth narrative and
          technical upside.
        - End-market mix differs and public-market trading can exaggerate sentiment both positively and negatively.
      - - Sila
        - Private battery-material scale-up financing
        - $375M Series G in 2024 to finish Moses Lake plant and support auto deliveries
        - Shows how much capital credible battery-material scaling can consume before revenue maturity.
        - >-
          No retained source discloses a contemporaneous valuation multiple, so it is a capital-history reference rather
          than a true multiple comp.
      - - Group14
        - Private silicon-battery capital history
        - $463M Series D in 2025 and over $1B total equity raised
        - >-
          Relevant for understanding how large battery-material leaders still require repeated rounds and factory
          control to industrialize.
        - Valuation is undisclosed and recent furloughs show that capital raised does not eliminate execution risk.
      - - Echion
        - Private niobium-anode peer capital history
        - Further £10M funding with a 1 GWh equivalent XNO scale-up path
        - Closest retained chemistry-adjacent reference for niobium-based fast-charge positioning.
        - Much smaller company and undisclosed valuation make it a strategic reference, not a direct pricing comp.
    notes: >-
      This is a decision-useful comparable set, not an exhaustive list of every battery, robotics, or industrial-tech
      company.
