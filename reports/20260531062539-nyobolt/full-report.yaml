  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Exclusions
        blocks:
          - type: paragraph
            body: >-
              Nyobolt should not be analyzed as a generic battery company or as a claim on all electrification spend.
              Its official positioning is narrower and more useful: high-power, integrated energy systems for
              critical-uptime use cases where downtime, charging latency, or transient power instability impose real
              operating cost. In practice that puts three market families in scope for this chapter: warehouse robotics
              and AMR fleets, industrial motive-power and other uptime-critical battery applications, and AI data-centre
              power modules that sit closer to rack-level backup or power-quality management than to whole-facility
              electrical systems. The same sources also make the exclusions clear. Broad warehouse automation numbers
              include conveyors, AS/RS, software, and integration services; industrial battery numbers include telecom
              backup, grid storage, and general-purpose motive power; and data-centre narratives often blur rack-level
              power modules with total build-out capex. Passenger EV packs, consumer electronics, and generic warehouse
              software are therefore outside Nyobolt's realistic served market even if they sit inside broader battery
              or automation categories. The right analytical move is to separate adjacency from truly addressable spend
              before using any TAM headline in valuation work.
