      - number: '8.2'
        title: Thesis, anti-thesis, and scenario logic
        blocks:
          - type: paragraph
            body: >-
              The thesis is easy to see. Nyobolt has a credible technology narrative, a strategic customer-investor in
              Symbotic, concrete performance proof in warehouse robots, and public support for manufacturing scale-up.
              Symbotic said the new power pack brings six times more energy, 40% lower weight, and at least ten times
              the cycle life of traditional lithium-ion approaches in its robot fleet, while Nyobolt says it is also
              targeting data-centre power and heavy-duty electrification. The anti-thesis matters just as much. Public
              disclosures still do not show gross margin, EBITDA, customer concentration, backlog conversion, warranty
              costs, or the post-Series C preference stack. Hardware battery peers also keep demonstrating how
              capital-intensive commercialization remains: Sila and Group14 raised hundreds of millions to keep building
              capacity, while Natron shut down after failing to secure enough funding. That mix means the bull case
              needs proof that Nyobolt is converting strategic validation into repeatable revenue at attractive unit
              economics, whereas the bear case appears quickly if Symbotic stays the main proof point, if AI-data-centre
              programs remain mostly narrative, or if financing terms subordinate new common investors more than the
