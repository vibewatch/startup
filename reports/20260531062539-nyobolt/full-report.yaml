      - number: '5.3'
        title: Manufacturing, quality, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Nyobolt's manufacturing and compliance record is more advanced than a pre-product deep-tech company but
              still well short of full industrial transparency. The clearest hard proof is the January 2024 UN38.3
              announcement for two production-ready pouch cells, which moved the company from lab narrative into
              certifiable shippable hardware. The other major technical proof point is the July 2024 BAT assessment for
              the Haverhill pilot facility. That document shows Nyobolt pursuing an environmental permit for
              anode-material production at up to 900 tonnes per year, using niobium pentoxide and tungsten trioxide,
              with HEPA-captured particulate controls, water monitoring, waste-handling procedures, and a formal
              accident-management path. The sustainability page adds an ISO 9001 quality-management claim for
              battery-cell manufacture and a responsible-sourcing framework tied to OECD and UN guidance. Public
              scale-up support from UKRI and UKBIC, plus Cambridge Enterprise's description of supply,
              manufacturing-scale-up, and recycling collaboration with H.C. Starck Tungsten Powders, further suggest
              that Nyobolt has been solving industrialization problems rather than remaining in pure R&D. Additional
              maturity signals come from Nyobolt's own 2026 Sunday Times hardware ranking, a Cambridge chemistry
              department note describing research translated into real deployments, and a recruit post showing
              software-and-controls leadership being hired to push battery systems into customer projects. The roadmap
              is directionally clear: from certified pouch cells to modules, packs, chargers, robotics deployments, and
              data-centre power systems. But the make-versus-partner model is still only partially disclosed. Nyobolt
              openly says battery-cell manufacturing is volume dependent while highlighting in-house design, pilot
              manufacturing, and pack/software IP. That supports a hybrid operating model, yet public sources still do
              not disclose pack yield, failure rates, warranty reserves, or the exact path from pilot volumes to scaled
              commercial throughput.
