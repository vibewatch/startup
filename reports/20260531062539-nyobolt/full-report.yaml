      - number: '2.2'
        title: Broad TAM Context Versus Constrained Near-Term SAM
        blocks:
          - type: paragraph
            body: >-
              Public market data easily supports a very large contextual opportunity, but it does not support a single
              clean Nyobolt TAM number. Mordor places warehouse automation at $34.17 billion in 2026 and the industrial
              battery market at $41.93 billion in 2026, while Grand View Research estimates the data-centre UPS market
              at $4.04 billion in 2024, growing to $6.27 billion by 2030. Those figures together create an $80
              billion-plus gross adjacency ceiling, but the ceiling is mixed-vintage, non-additive, and badly overstates
              what Nyobolt can actually sell into. The more useful lens comes from narrowing toward battery and power
              subsystems inside those markets. Geekplus's Hong Kong filing shows how much smaller subsegments become
              once the boundary tightens: global ACR solutions were only RMB4.4 billion in 2024 even though the broader
              warehouse-picking automation market was much larger. Using explicit attach-rate assumptions for warehouse
              battery content, a haircuted share of motive-power battery spend, and a rack-level slice of UPS budgets
              produces a constrained SAM range of roughly $4 billion to $15 billion. That range is still low-confidence,
              but it is far more decision-useful than treating every warehouse system, industrial battery, or
              data-centre build as direct Nyobolt revenue opportunity.
