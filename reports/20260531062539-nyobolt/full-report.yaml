  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / funding signal
      - Target segment
      - Differentiation
      - Limitation versus Nyobolt
    rows:
      - - Nyobolt
        - Integrated high-power battery systems
        - Private; one named scaled robotics partner; pricing undisclosed
        - Warehouse robots, AI data centres, industrial uptime
        - Fast-charge integrated system; retrofit-compatible Symbotic proof
        - Public deployment breadth and pricing remain thin
      - - Echion
        - Direct niobium-anode chemistry peer
        - £10M new funding; 2,000 t/year XNO scale claimed
        - AI data centres, robotics, industrial ESS, heavy-duty transport
        - 6-minute charge, >50,000 cycles, drop-in anode material
        - Sells through partner cell makers rather than a full uptime stack
      - - Amprius
        - Adjacent silicon-anode cell supplier
        - Public-company filer with 2026 ARS and 10-K availability
        - High-performance mobility and power-intensive applications
        - Up to 450 Wh/kg and 0-80% charge in six minutes
        - More energy-density-centric and less system-integrated than Nyobolt
      - - StoreDot
        - Adjacent XFC cell / chemistry platform
        - ~$200M raised, 100+ patents, 15 OEM evaluations per 2024 deck
        - EV OEMs and battery manufacturers
        - Under-10-minute XFC on standard production lines
        - Automotive-first GTM rather than warehouse or rack-level uptime
      - - Sila
        - Adjacent silicon-anode material supplier
        - $375M Series G; Moses Lake scale-up; Mercedes and Panasonic named
        - Automotive and broader cell-manufacturing customers
        - Drop-in Titan Silicon with 20-25% density gain today
        - Upstream material model competes indirectly on buyer economics
      - - Group14
        - Adjacent silicon-anode material supplier
        - 10 GWh online, >$1B equity raised, 100+ customers claimed
        - EV, consumer, data-centre, grid and device batteries
        - SCC55 with EV-scale supply and broad chemistry compatibility
        - Execution risk persists despite larger scale and capital
      - - Natron
        - Historical high-power substitute chemistry
        - 250/500 kW cabinet launch; later shutdown after failed funding
        - Mission-critical power, industrial power, EV fast charging
        - Nonflammable sodium-ion with 5-15 minute recharge and 50k cycles
        - Failure shows product edge can lose to capital and scale risk
      - - BYD Blade Battery
        - Incumbent LFP substitute
        - Millions of deployed vehicles and 8-year battery warranty
        - EV and broader LFP battery buyers
        - Safer mature LFP architecture with >5,000 cycles
        - Not purpose-built around robot uptime or rack integration
      - - Vertiv Liebert APM2
        - UPS incumbent / system substitute
        - Global mission-critical supplier with modular UPS product family
        - Data centres and mission-critical facilities
        - 10-600 kVA/kW UPS, Li-ion/VRLA, DCIM and service stack
        - Competes through architecture breadth rather than battery chemistry
      - - WiBotic / Wiferion / Ocado
        - Charging or swap architecture substitutes
        - Commercial wireless and swap products with fleet-level packaging
        - Warehouse robots, AGVs, AMRs
        - Solve uptime via orchestration, wireless charging, or swapping
        - Do not create Nyobolt-like high-power battery IP
    notes: >-
      Scale cells mix disclosed funding, capacity, filing visibility, or named deployment proof. Public list pricing is
      largely unavailable, so the table centers on packaging and commercialization signals rather than realized ASPs.
