  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk landscape
        blocks:
          - type: paragraph
            body: >-
              Nyobolt now has enough evidence to take seriously but not enough to underwrite casually. The strongest
              proof remains warehouse robotics through Symbotic, yet that same relationship is the company's biggest
              structural risk because it concentrates customer proof, commercialization timing, and capital support into
              one counterparty that is itself highly exposed to Walmart and GreenBox. The second risk is
              industrialization depth: Haverhill and the public certification record show real movement beyond lab work,
              but the retained record still lacks yield, scrap, warranty, and broad certification matrices. The third
              risk is strategic dependence on scarce inputs and fast-moving competition: niobium supply is concentrated,
              and better-funded silicon or alternative-anode peers continue to build factories, ship products, or at
              least set customer expectations. The fourth risk is execution drift from a story that now spans robotics,
              commercial vehicles, and AI data centres even though public production proof remains narrow. The fifth is
              governance opacity: filings show complex share rights and a wider officer perimeter than the website
              reveals, but not enough transparency to see control, downside protections, or exact investor influence.
              Investors should therefore treat Nyobolt as a promising but still load-bearing-risk story whose upside
              depends on diversification, certification expansion, and production metrics appearing faster than new
              capital demands.
