  - id: TM003
    title: Segment / Buyer Map
    columns:
      - Segment
      - Buyer
      - User
      - Payer / budget owner
      - Workflow
      - Adoption trigger
    rows:
      - - Warehouse AMR / AGV OEM channel
        - Robot OEM or platform owner
        - Warehouse automation operators and maintenance teams
        - Platform capex and product-refresh budget
        - Battery integrated into robot platform before deployment
        - Higher uptime and lower swap burden versus incumbent power system
      - - Warehouse brownfield retrofit
        - OEM plus existing end customer
        - Site operations and reliability teams
        - Maintenance / upgrade capex
        - Retrofit into installed robot base during refresh cycles
        - More runtime per robot without rebuilding charging infrastructure
      - - Integrator-led greenfield warehouse automation
        - Systems integrator with operator sign-off
        - Distribution-centre managers and automation engineers
        - Project capex owned by operator
        - Battery choice embedded in multi-vendor warehouse design
        - Faster ROI, fewer charging bottlenecks, and less floor space lost to swaps
      - - Industrial motive-power fleet
        - Fleet OEM or asset owner
        - Operations manager and maintenance team
        - Fleet electrification or replacement budget
        - Pack sold as part of a duty-cycle upgrade or new vehicle build
        - Shorter dwell time and lower downtime-driven TCO
      - - AI data-centre rack power
        - Data-centre operator or hyperscaler
        - Infrastructure and power engineers
        - Electrical resilience / uptime capex
        - Module sits near rack to smooth spikes and cover grid drops
        - Protect GPU utilization and avoid outage-driven ROI destruction
      - - Off-grid or power-constrained AI infrastructure
        - Infrastructure developer or site operator
        - Power engineering and operations teams
        - Project capex tied to site power architecture
        - Energy storage paired with grid constraints or renewable integration
        - Bring compute online where grid quality or peak demand is the gating factor
    notes: >-
      Buyer and payer roles differ by segment because Nyobolt often reaches end users through OEMs, integrators, or
      infrastructure programs rather than direct battery sales alone.
