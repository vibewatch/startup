            body: >-
              Nyobolt's dependency stack is unusually tight. Symbotic is the clearest example: it validates the product,
              funds the company, and offers the best visible route to scaled volume, but that channel inherits Walmart
              and GreenBox concentration from Symbotic's own business mix. Upstream, the chemistry depends on niobium, a
              strategically concentrated input still dominated by Brazil and shaped by CBMM's market power. Competitive
              dependencies matter too. Customers deciding whether Nyobolt deserves premium pricing are not comparing it
              with a static graphite world; they are watching Sila, Group14, StoreDot, Amprius, and Echion pursue their
              own fast-charge, silicon, or alternative-anode narratives, often with large capital programs or different
              go-to-market structures. These peers create two-sided evidence. On one side, they prove the opportunity is
              real and strategically important. On the other, their factory raises, furloughs, shutdowns, and
              post-mortems show how narrow the execution path can be. Nyobolt therefore faces a mix of commercial
              concentration risk, raw-material concentration risk, and competitive compression risk that could all
              transmit into revenue timing, gross margin, and future financing terms faster than the chemistry story can
