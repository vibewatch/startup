  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue bridge
        - >-
          Audited 2025 revenue, 2026 exit run-rate, and a reconciliation between 2024 disclosed revenue, the “triple”
          statement, and the later 5x YoY language
        - The valuation denominator is still too soft for price-sensitive underwriting.
        - Request CFO bridge, board materials, and customer shipment-to-revenue reconciliation.
      - - Gross margin and warranty economics
        - Gross margin, contribution margin, pack-level BOM, warranty reserves, and service mix
        - Battery-plus-systems businesses can look great on growth and still destroy value on unit economics.
        - Request product-family P&L, reserve policy, and returns data.
      - - Cap-table and rights terms
        - Series C preference stack, participation terms, ratchets, and an explanation of the May 2026 SH10 filing
        - Common-equity value can diverge sharply from headline post-money valuation.
        - Review financing documents, cap table waterfall, and Companies House supporting documents.
      - - Customer concentration
        - Symbotic revenue share, top-10 accounts, renewal / expansion mechanics, and any signed data-centre customers
        - A concentrated book deserves a lower multiple even when the flagship customer is strong.
        - Request cohort/customer schedule plus signed contract summary for the next five largest programs.
      - - Manufacturing readiness
        - Yield, throughput, scrap, outsource/in-house split, and niobium input security
        - Factory and supply-chain risk can force new capital before scale economics arrive.
        - Request plant KPI dashboard, supplier concentration map, and quality history.
      - - Exit path and financing dependence
        - Secondary liquidity history, likely next financing timing, and credible IPO/M&A readiness milestones
        - Without a visible exit path, investors may be paying today for a very long duration asset.
        - Ask management and lead investors for scenario planning around next round, strategic exit, and IPO readiness.
    notes: >-
      These asks focus on the few missing data points most likely to move the recommendation or the acceptable entry
      price.
