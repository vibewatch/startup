        title: Thesis-break triggers, exit readiness, and what still blocks underwriting
        blocks:
          - type: paragraph
            body: >-
              The key underwriting blockers are specific. First, public evidence still does not reconcile 2024 disclosed
              revenue, management’s “triple” ambition, and the later “five-times year-on-year” statement into one hard
              number, so a price-sensitive investor cannot yet pin down a dependable revenue denominator. Second, the
              Companies House filing trail shows post-round rights activity but not the preference, participation, or
              ratchet details that determine common-equity economics. Third, Nyobolt’s manufacturing case is promising
              but not fully de-risked: battery peers still need large rounds and sometimes still stumble, while niobium
              supply remains concentrated. Fourth, there is no public IPO-style disclosure package or obvious near-term
              exit process; the company still looks like a business moving through continued private financing rather
              than imminent liquidity. That means entry discipline matters. A lower price, or audited evidence that
              2025-2026 revenue and margin quality already justify the bull case, could move the recommendation toward
              track. At the current mark, public evidence supports caution and a diligence-first posture.
