      - number: '2.5'
        title: Contradictory Estimates and the Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The main contradiction in Nyobolt's market work is not that sources disagree wildly on whether these
              sectors are growing; it is that they measure different layers of the stack. Broad warehouse automation
              figures, industrial battery totals, UPS market estimates, and ACR-specific filings can all be true at once
              while implying very different opportunity sizes for Nyobolt. Averaging them would be analytically wrong
              because the units, system boundaries, and spend layers do not match. That leaves three diligence gaps
              standing. First, public evidence does not isolate battery or power attach rates inside warehouse
              automation budgets. Second, public evidence does not break out rack-level AI power modules from total UPS
              or facility electrical spend. Third, there is no public disclosure of Nyobolt pricing, qualified pipeline,
              installed-base retrofit counts, or segment win rates—so a true bottom-up SOM cannot be defended from open
              sources alone. The implication for diligence is practical: treat the company as operating in attractive
              and growing adjacent markets, but do not underwrite a precision market model until management provides
              BOM-level spend shares, customer concentration by segment, and a pipeline conversion view for retrofits,
              industrial fleets, and rack-level data-centre power.
            claimRefs:
              - CM014
              - CM045
              - CM046
              - CM047
              - CM048
              - CM052
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct chemistry peers versus adjacent material suppliers
        blocks:
          - type: paragraph
            body: >-
              Nyobolt should not be compared to every battery startup in the same way. The closest direct public peer on
              Nyobolt’s stated warehouse-robotics, industrial-power, and AI-data-centre wedge is Echion, because Echion
              also frames its niobium-anode chemistry around six-minute charging, long cycle life, robotics, industrial
              ESS, and AI data centres. Echion’s public packaging is different, however: it sells XNO as a drop-in anode
              material to cell manufacturers and routes end users through a “Powered by XNO” ecosystem. That means
              Echion competes with Nyobolt on the underlying fast-charge story while asking the buyer to change less of
              the surrounding system architecture.


              Amprius, StoreDot, Sila, and Group14 are adjacent rather than perfectly direct, but they still matter
              because they promise faster charging or higher power without forcing OEMs to buy an integrated
              Nyobolt-style stack. Amprius emphasizes silicon-anode cells with up to 450 Wh/kg, 0-80% charging in six
              minutes, and 1,300-cycle performance; that is a stronger energy-density story than Nyobolt’s
              uptime-centric pitch. StoreDot pushes silicon-dominant XFC cells as the only production-ready ten-minute
              EV charging platform, tested by large OEMs and built on standard lines. Sila and Group14 go one layer
              further upstream: both sell drop-in silicon anode materials that fit incumbent gigafactory workflows, and
              both present scale, patent, and customer evidence that suggests their GTM friction is lower than Nyobolt’s
              when a buyer already has cell manufacturing relationships.


              The practical read-through is that Nyobolt’s chemistry moat is not simply “fast charge.” Fast charge now
              exists in several public narratives. Nyobolt’s differentiator is instead the combination of fast charge,
              high cycle life, and integrated uptime outcomes in robots or rack-level power systems. That makes
              chemistry peers important, but it also means the most dangerous competitors are often the ones that let
              customers keep more of their existing manufacturing or power architecture unchanged.
