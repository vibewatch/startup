      - number: '1.3'
        title: Funding History, Valuation, and Traction Signals
        blocks:
          - type: paragraph
            body: >-
              Nyobolt now reads as a venture-backed growth company rather than a pre-commercial science project. The
              company raised a $10 million Series A in February 2021, a £50 million initial-close Series B in 2022 to
              fund manufacturing scale-up, a $30 million round in April 2025 led by IQ Capital and Latitude, and then a
              May 2026 Series C led by Symbotic for $60 million at a valuation above $1 billion. Using the company's own
              April 2025 statement that total raised had reached $100 million, disclosed financing appears to total at
              least about $160 million after Series C, before accounting for grants or any undisclosed seed capital. The
              investor map blends financial, strategic, and industrial relationships: IQ Capital has persisted across
              multiple rounds, Symbotic is both a strategic investor and deployment partner, and industrial names such
              as Scania Invest, Takasago Industry, H.C. Starck or Masan, and CBMM tie capital to supply-chain or
              application relevance. Public traction signals improved sharply over the same period. Nyobolt said 2024
              revenue exceeded $9 million, contract value exceeded $150 million by April 2025, and May 2026 materials
              claimed fivefold year-on-year revenue growth. Those are meaningful positive signals, but precise 2025-2026
              revenue, customer count, headcount, and preference-stack details remain outside the public record.
