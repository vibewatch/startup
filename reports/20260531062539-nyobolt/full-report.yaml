      - number: '7.3'
        title: Operational, quality, and scale-up risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, Nyobolt has crossed the line from pure R&D to real system delivery, but the hardest work
              still sits ahead. Public sources show a company trying to control more of the stack, from materials and
              cells to packs, battery software, and customer integration. That ambition is exactly what can create
              differentiated uptime economics in warehouses or at the rack level in AI infrastructure, but it also
              multiplies the number of things that can fail during scaling. Haverhill is a meaningful pilot asset, yet
              pilot capacity is not the same as repeatable production economics. The retained record does not disclose
              yield, scrap, throughput stability, warranty cost, or field-failure rates. The data-centre push is even
              earlier; the Rajasthan MoU is strategically interesting, but public evidence still looks like
              pre-production intent rather than live, referenceable deployment. External post-mortems across the battery
              sector underline how dangerous that gap can be. Projects fail not because the chemistry is irrelevant, but
              because certification, process control, operational readiness, and funding must all line up at once.
              Nyobolt's mitigation posture is real but still partial, so scale-up should be treated as a monitored
              execution program rather than a risk already cleared by one good robot deployment.
