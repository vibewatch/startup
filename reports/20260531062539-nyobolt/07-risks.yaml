    {
      "id": "people-governance-and-kill-criteria",
      "title": "People, governance, mitigation, and kill criteria",
      "body": "The last risk cluster is human and informational. Nyobolt still looks founder-led in the ways that matter most: Sai Shivareddy is central to commercial execution, Clare Grey is central to scientific legitimacy, and newer operating hires are still expanding the delivery bench needed to turn battery science into customer uptime. That can work well while the company is small and narrative momentum is strong, but it becomes a vulnerability once multiple verticals, factories, and financing rounds must be managed at once. Companies House records also show that the governance perimeter is wider and more complex than the website alone suggests, with numerous officers, recent share-rights activity, and limited public control visibility through PSC filings. None of that is disqualifying by itself, but together it means the correct mitigation posture is milestone-driven. A second named production customer, broader certification coverage, explicit supply diversification, disclosed manufacturing KPIs, and cleaner governance visibility would all reduce residual risk. Conversely, if customer concentration persists, data-centre proof stays at MoU stage, or new capital is required before operations become legible, investors should treat that as a thesis break rather than a temporary inconvenience.",
