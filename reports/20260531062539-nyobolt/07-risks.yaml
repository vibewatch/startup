    {
      "id": "legal-regulatory-and-certification-risks",
      "title": "Legal, regulatory, and certification risks",
      "body": "Nyobolt's legal and regulatory picture is credible enough to matter but still incomplete enough to constrain underwriting. On the positive side, the company is not hand-waving around manufacturing: the Haverhill facility appears in a real environmental-permit process with a BAT assessment, risk analysis, and operating-techniques package. The public record also shows UN38.3 certification for two production-ready pouch-cell formats and ISO 9001 quality-system work that began before commercial production. Those are meaningful mitigants. The problem is breadth. Public evidence is still concentrated in a small set of disclosed approvals and process documents, while Nyobolt now markets products into robotics, heavy-duty vehicles, and data-centre environments that typically require wider certification and customer-specific compliance packages. The IP picture is similar. A published patent application exists, which is better than an unprotected science story, but the public record does not show a fuller freedom-to-operate package, litigation schedule, or broad patent-family map. That does not prove weakness; it means the residual legal risk is disclosure-driven and should be treated as unclosed rather than solved. This is why the regulatory and legal register remains a first-pass diligence artifact, not a final comfort blanket.",
