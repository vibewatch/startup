- id: comp-context
  title: Comparable context, market sentiment, and fair-value discipline
  body: 'Current market sentiment is not irrationally closed to Nyobolt’s story. Public investors still reward selective AI automation and battery names: Symbotic is valued around $28 billion with quarterly revenue above $676 million, AutoStore trades around 7.9x EV/revenue with strong margins, and Amprius trades around 31.6x EV/revenue despite remaining sub-scale and loss-making. Private capital has also stayed available for battery-material scale-up: Sila raised $375 million in 2024 and Group14 closed a $463 million round in 2025. But fair-value reasoning should be stricter than sentiment. Nyobolt is earlier than the automation comps and less disclosed than the speculative battery comps. The most defensible read is that $1 billion sits above a public-comps-based base case and only fits a bull case where disclosed growth converts into a $50 million-plus run-rate with credible margin expansion and multi-customer proof beyond Symbotic. Without that, today’s mark looks like investors are pre-paying
    for future data-centre and robotics optionality rather than buying into already-proven economics.'
