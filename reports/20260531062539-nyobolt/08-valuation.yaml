- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - 2026 revenue run-rate is already above ~$50M, Symbotic becomes one of several scaled customers, AI data-centre projects convert into signed revenue, and gross-margin evidence is acceptable for a hardware-plus-systems business.
    - Supportable range roughly $1.0B-$1.4B; the current mark can work, but only if diligence confirms strong conversion and clean terms.
    - Even this case still depends on manufacturing execution and customer diversification.
    - Requires evidence that is not yet public, so it should be treated as diligence-contingent rather than base-case fact.
  - - Base
    - Revenue is closer to a $27M-$45M range implied by disclosed anchors, growth remains strong, but margins and customer mix are still only partly proven.
    - Supportable range roughly $0.6B-$0.9B; the current round looks full and better suited to monitoring than buying.
    - Limited room for error if backlog conversion or financing terms disappoint.
    - 'Best fit with the current public record: real traction, but not enough disclosed economics for a clean unicorn underwrite.'
  - - Bear
    - Commercial conversion stalls near the older disclosed revenue anchors, Symbotic concentration persists, or hidden preferences / manufacturing setbacks widen the discount rate.
    - Supportable range roughly $0.25B-$0.5B; downside would be severe because a down-round reset would start from a thin public denominator.
    - Battery-sector capital markets stay selective and hardware investors demand cleaner economics.
    - Triggered by weak diligence, delayed customer ramps, or evidence that the headline valuation is not the real common-equity price.
  notes: Ranges are intentionally broad because Nyobolt does not publicly disclose audited revenue, gross margin, or financing terms.
