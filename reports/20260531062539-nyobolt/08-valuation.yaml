  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-revenue-bridge
    missingEvidence: Audited 2025 revenue, 2026 exit run-rate, backlog conversion, and a bridge reconciling the 2024 base, the 2025 triple statement, and the later 5x YoY claim.
    whyItMatters: Without a dependable revenue denominator, every implied multiple and scenario range is too soft for a firm underwriting call.
    diligencePath: Request audited accounts, board materials used in the Series C, and a monthly shipment-to-revenue bridge.
    relatedQuestionRefs:
    - QV003
    - QV004
    - QV005
    - QV023
    - QV025
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-unit-economics
    missingEvidence: Gross margin, contribution margin, warranty reserve assumptions, replacement costs, and product-family unit economics.
    whyItMatters: Battery and systems businesses can sustain high valuation narratives only if gross margin and reliability economics hold up at scale.
    diligencePath: Request product-family P&L, reserve schedules, and customer support / service-cost data.
    relatedQuestionRefs:
    - QV023
    - QV028
    - QV030
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: preference-stack
    missingEvidence: Series C preference terms, ratchets, participation rights, liquidation waterfall, and the documentation supporting the May 2026 SH10 filing.
    whyItMatters: The headline valuation may overstate common-equity value if downside protection sits ahead of new investors.
    diligencePath: Review financing documents, cap-table waterfall, and any Companies House attachments or counsel summaries.
