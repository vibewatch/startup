company:
  name: Nyobolt
chapter:
  number: 8
  title: Valuation
  summary: Nyobolt has real strategic proof and clear commercial momentum, but the public evidence still does not fully support paying the May 2026 $1 billion mark with conviction. The strongest disclosed positives are the $60 million Symbotic-led Series C, five-times year-on-year revenue growth language, and warehouse-robotics proof; the strongest negatives are sparse absolute revenue disclosure, no public margin stack, and unknown preference terms.
sections:
- id: recommendation-anchor
  title: Recommendation and present valuation anchor
  body: 'Nyobolt is not a low-quality story; it is a price-discipline problem. The May 2026 Series C put a $1 billion valuation on a company that publicly disclosed only $9 million-plus of 2024 revenue in its April 2025 round announcement, then described itself as positioned to triple that figure and later said revenue was growing five times year-on-year. Those are encouraging signals, but they are not the same thing as a clean audited revenue bridge. Depending on which public anchor an investor uses, the current mark can look like more than 100x trailing revenue, roughly 37x a simple “tripled from 2024” case, or still above 20x even under a much more generous directional growth mapping. That puts Nyobolt at or above the speculative end of public battery multiples while the company remains private, hardware-heavy, and opaque on margins and terms. The right public-evidence call is research-more with a stretched valuation stance: there is enough proof to stay engaged, but not enough disclosed
    economics to underwrite the unicorn price as obviously fair.'
  claimRefs:
