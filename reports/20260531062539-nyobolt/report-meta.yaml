summary:
  headline: >-
    Research-more: Nyobolt has credible product proof, strategic validation from Symbotic, and
    clear commercial momentum, but the May 2026 $1B valuation still looks stretched until
    diligence closes the revenue, margin, concentration, and preference-term gaps.
  overallScore: 5.8
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
