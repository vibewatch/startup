    "number": 5,
    "title": "Product & Technology",
    "summary": "Nyobolt's public product story is strongest where the company couples niobium-based fast-charge chemistry with full system integration for uptime-critical robots: the reviewed record shows in-house anode and cell know-how, pack/BMS/power-electronics integration, UN38.3-certified pouch cells, a Haverhill anode-material pilot facility, and named Symbotic deployment proof. The weaker parts of the product story are breadth and auditable performance: AI data-centre and commercial-vehicle offerings are well articulated but still light on named live installations, while many marquee cycle-life and fast-charge figures remain directionally credible yet largely self-reported rather than backed by public third-party test reports."
  },
