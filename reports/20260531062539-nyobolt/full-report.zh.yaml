      - number: '2.3'
        title: 各细分市场的买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图按细分市场差异很大，这很重要，因为 Nyobolt 往往卖进平台渠道，而不是直接卖给最终资产运营方。在仓储机器人里，用户通常是现场运营或自动化团队，但直接买方可能是掌握平台设计、质保和改造项目的 OEM
              或系统集成商。Symbotic 关系是最清楚的验证：Nyobolt 电池被定位为 SymBot 机器人的升级件，并明确设计为可改造进现有客户系统，意味着存量装机基础可能和新建仓库同样重要。Geekplus 和
              Dematic-Hai 合作的公开文件指向同一个方向——仓储自动化买家偏好带服务、文档、备件和多阶段上线路径的集成方案。在工业电池里，经济买方更可能是优化总拥有成本和停机时间的车队、OEM 或资产所有者。在 AI
              数据中心电源里，核心用户是基础设施或电力工程团队，经济买方则是要守住 GPU 利用率和可用性承诺的运营商、托管服务商或超大规模云厂商。三个细分市场里，Nyobolt
              的采用都取决于技术适配、资格认证和预算签批串起来的链条，而不是一次简单的电芯采购。
