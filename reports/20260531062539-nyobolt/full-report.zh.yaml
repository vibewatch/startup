          label: 买家把问题定义为正常运行时间或电能质量
        - from: eval
          to: pilot
          label: 工程验证放行首个上线部署
        - from: pilot
          to: rollout
          label: 运营成功支撑更大范围生产使用
        - from: rollout
          to: retrofit
          label: 存量兼容性带来重复使用潜力
        - from: eval
          to: adjacent
          label: 其他垂直领域可能沿另一条更早期验证路径推进
