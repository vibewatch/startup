          - type: paragraph
            body: >-
              公开资料能证明一定的客户韧性，但大多只是代理指标，不是 SaaS 式留存硬指标。最具体的复用信号来自架构：Symbotic 称，新电池包可改装进上一代 SymBot
              机器人，也向后兼容已安装的充电底座。这带来一条清晰的装机基数扩张路径，而不是一次性的电池替换项目。第二个代理信号是商业动作。Symbotic 不只是发了新闻稿；它领投了 Nyobolt 的 Series
              C，并公开把这项技术描述为提升自身客户正常运行时间和效率的关键抓手。第三个代理信号来自合作伙伴层面的运营规模：Symbotic 称，FY2026 Q2 部署中的系统总数升至 70
              套，多个垂直行业的客户正在从其自动化系统中获得价值。这些都是有用迹象，但不能替代续约、合同期限、NRR、GRR、流失率、附加率或分客群扩张支出。本文审阅的公开来源没有披露这些指标。因此，本章能看到真实的客户满意度定性证据，但客户持续性仍要靠部署进展、兼容性和战略再投资来推断，而不是直接的留存披露。
