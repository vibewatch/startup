  - id: TM003
    title: 细分市场 / 买方图谱
    columns:
      - 细分市场
      - 买方
      - 用户
      - 付款方 / 预算负责人
      - 工作流
      - 采用触发因素
    rows:
      - - 仓库 AMR / AGV OEM 渠道
        - 机器人 OEM 或平台方
        - 仓库自动化运营方和维护团队
        - 平台资本开支和产品更新预算
        - 部署前将电池集成进机器人平台
        - 相比现有供电系统，正常运行时间更长，换电负担更低
      - - 仓库存量改造
        - OEM 加现有终端客户
        - 现场运营和可靠性团队
        - 维护 / 升级资本开支
        - 在更新周期内改造已部署机器人存量
        - 不重建充电基础设施，也能提高单台机器人续航
      - - 集成商主导的新建仓库自动化
        - 系统集成商，运营方签字确认
        - 配送中心经理和自动化工程师
        - 运营方承担的项目资本开支
        - 电池选择嵌入多供应商仓库设计
        - ROI 更快、充电瓶颈更少、换电占用面积更小
      - - 工业牵引动力车队
        - 车队 OEM 或资产所有者
        - 运营经理和维护团队
        - 车队电动化或更换预算
        - 电池包随工况升级或新车制造一起销售
        - 停留时间更短，停机推高的 TCO 更低
      - - AI 数据中心机架级电力
        - 数据中心运营商或超大规模云厂商
        - 基础设施和电力工程师
        - 电力韧性 / 正常运行时间资本开支
        - 模块靠近机架，平滑峰值并兜住电网掉电
        - 保护 GPU 利用率，避免停电摧毁 ROI
      - - 离网或电力受限 AI 基础设施
        - 基础设施开发商或站点运营方
        - 电力工程和运营团队
        - 与站点电力架构绑定的项目资本开支
        - 储能与电网约束或可再生能源接入配套
        - 在电网质量或峰值需求卡住进度的地方，让算力上线
    notes: 各细分市场的买方和付款方角色不同，因为 Nyobolt 往往通过 OEM、集成商或基础设施项目触达 终端用户，而不只是直接卖电池。
