            body: >-
              审阅记录里唯一高置信的具名生产验证是 Symbotic。Nyobolt 2024 年 4 月公告已声称在 AI 仓库和重型车辆中部署，并有超过 $150 million 合同价值，但这些披露没有点名客户。2025
              年 9 月，Nyobolt 和 Symbotic 均表示 Symbotic 自 2025 年 6 月以来已在小批量生产中使用该技术，并预计从 9 月起更广泛纳入新的 SymBot
              生产，证据质量由此大幅提升。这些公告还披露了有运营意义的变化：能量容量提高六倍、重量降低 40%、循环寿命至少提高十倍。2026 年 5 月独立报道也一致强化同一验证层级：Symbotic
              是支撑本轮融资的客户关系；接下来披露的扩张信号，是一个领先但未具名的人形机器人开发商，以及已宣布的 Rajasthan 数据中心
              MoU。这意味着采用轨迹是真实的，但仍高度锚定于一个具名客户关系和少数相邻、较早期的验证点，而不是一组拥有可比部署细节的公开客户标识。
