chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起源与运营模式
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 是 NYOBOLT LIMITED 的经营身份。这是一家活跃的英国私营公司，2019 年 3 月 5 日注册成立，目前仍登记在 Cambridge Impington 的 Evolution
              Business Park。公司的公开叙事需要区分一个关键点：学术起源早于法律注册。Cambridge Enterprise 称，该技术 2016 年从 Yusuf Hamied Department of
              Chemistry 剥离出来；Nyobolt 自己的关于页面强调 Clare Grey 团队在 2018 年取得技术突破；法律实体则由 Clare Grey 和 Sai Shivareddy 于 2019
              年创办。商业上，Nyobolt
              并不把自己包装成大宗电芯供应商。它的主页和方案页一贯销售面向任务关键型可用性的高功率集成能源系统，把化学材料、电芯、电池包、电力电子和软件组合进企业部署。当前应用覆盖仓储机器人和人形机器人、AI
              数据中心机架支撑、商用车，以及其他停机敏感的工业车队。公开材料还显示，Nyobolt 的运营足迹已超出 Cambridge，在 Bedford、Haverhill、Bad Duerkheim 和 Tokyo
              有设施或办公室，说明公司围绕研发、制造和市场拓展覆盖来组织，而不再是单一实验室创业公司的形态。
