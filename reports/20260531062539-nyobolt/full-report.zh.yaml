  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Nyobolt 的相关性
    rows:
      - - 广义仓储自动化
        - 移动机器人、AS/RS、输送机、分拣机、控制软件和集成系统
        - 纯仓库劳动力、仓库外包裹运输和建筑外壳资本开支
        - 仓库运营商、集成商、零售商、3PL
        - 仅作背景；多数支出不是电池内容
      - - 仓储拣选 / ACR / AMR 子细分
        - 用于自动拣选和搬运的机器人硬件、工作站、调度软件和部署服务
        - 非机器人仓储软件和无关固定自动化
        - OEM、集成商和大型配送运营商
        - 更接近 Nyobolt，因为电池正常运行时间直接影响机器人生产率
      - - 工业电池市场
        - 叉车和牵引动力、电信备电、UPS、电力与公用事业电池、制造应用
        - 乘用 EV 电池包和消费电子
        - 车队所有者、OEM、公用事业、工业运营商
        - 有用邻近市场，但比 Nyobolt 的高功率楔子更宽
      - - AI 数据中心电力 / UPS
        - 机架级和机房级备电、模块化 UPS、分布式电能质量和故障切换
        - 整体数据中心建设成本、服务器、冷却、网络
        - 超大规模云厂商、托管数据中心运营商、企业数据中心
        - Nyobolt 销售机架级稳压和备电时直接相关
      - - Nyobolt 纳入的 SAM 楔子
        - 高正常运行时间 AMR 电池、棕地改装、工业牵引动力电池包、机架级 AI 电源模块
        - 通用仓储软件、低工况电池、整设施电气系统
        - OEM 渠道、集成商、车队所有者、数据中心电力团队
        - 当前尽调下现实可服务市场
      - - Nyobolt 排除的邻近市场
        - 乘用 EV、消费电子、没有正常运行时间关键差异化的通用固定储能
        - 这些类别中的所有支出
        - 汽车 OEM、手机 OEM、通用储能开发商
        - 即使技术日后可改用，本章也不纳入范围
