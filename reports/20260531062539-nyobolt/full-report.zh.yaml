  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与当前估值锚点
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 不是低质量故事；它是价格纪律问题。2026 年 5 月的 Series C 给公司打上了 10 亿美元估值，而公司在 2025 年 4 月融资公告中仅公开披露 2024 年收入超过 900
              万美元，随后称自己有望把该数字翻三倍，后来又称收入同比增长 5 倍。这些信号令人鼓舞，但不等于一条干净、经审计的收入桥。取决于投资人采用哪一个公开锚点，当前估值可能看起来超过过去收入的 100 倍；若简单假设“较
              2024 年翻三倍”，约为 37 倍；即便用更慷慨的方向性增长映射，也仍高于 20 倍。这让 Nyobolt
              处在或高于公开电池公司倍数的投机端，而公司仍是私营、重硬件，并且毛利率与条款不透明。基于公开证据，正确结论是“继续研究”，估值立场偏高：证据足以保持跟进，但披露的经济性还不足以证明独角兽价格显然合理。
