      - number: '1.3'
        title: 融资历史、估值与牵引力信号
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 现在更像一家有风投支持的成长期公司，而不是商业化前的科研项目。公司 2021 年 2 月完成 $10 million A 轮；2022 年完成 £50 million B
              轮首关，用于制造扩产；2025 年 4 月完成由 IQ Capital 和 Latitude 领投的 $30 million 融资；随后 2026 年 5 月由 Symbotic 领投 C 轮，融资 $60
              million，估值超过 $1 billion。按公司 2025 年 4 月“累计融资已达 $100 million”的说法，C 轮之后已披露融资至少约 $160
              million，尚未计入补助或任何未披露种子资本。投资人图谱混合了财务、战略和工业关系：IQ Capital 多轮持续跟投，Symbotic 既是战略投资人也是部署伙伴，Scania
              Invest、Takasago Industry、H.C. Starck 或 Masan、CBMM 等工业名字把资本与供应链或应用场景挂钩。同一时期，公开牵引力信号大幅改善。Nyobolt 称 2024
              年收入超过 $9 million，截至 2025 年 4 月合同价值超过 $150 million，2026 年 5 月材料称收入同比增长五倍。上述都是有意义的正面信号，但精确的 2025-2026
              年收入、客户数、员工数和优先股堆叠细节仍未进入公开记录。
