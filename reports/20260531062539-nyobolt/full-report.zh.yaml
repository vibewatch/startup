  - id: FI002
    title: 单位经济性桥
    type: flow
    layout: wide
    summary: Nyobolt 公开的单位经济性叙事，靠把快充和长循环寿命转化为更高在线时间、更少备用资产需求和更低更换成本。
    data:
      nodes:
        - id: fastcharge
          label: 超快充
          detail: 少于五分钟，或 10-80% 仅用 4m37s 的证明点。
        - id: cyclelife
          label: 长循环寿命
          detail: 在 Symbotic 场景中是传统 Li-ion 的 10x，且有 20,000 次循环的电网场景宣称。
        - id: uptime
          label: 更高在线时间
          detail: 反复充电的机器停留时间更短、换电次数更少。
        - id: spares
          label: 更少备用资产
          detail: 可能减少机器人冗余配置或中期电池更换。
        - id: tco
          label: 客户 TCO 节省
          detail: 停机时间更低、更换更少，假负载 / 维护负担更轻。
        - id: pricing
          label: 溢价潜力
          detail: 如果节省可测且持续，性能可能支撑溢价。
        - id: margin
          label: 毛利未知
          detail: 公开来源未披露 BOM、质保准备或服务成本吸收。
      edges:
        - from: fastcharge
          to: uptime
          label: 充电时间更短
        - from: cyclelife
          to: spares
          label: 更换更少
        - from: uptime
          to: tco
          label: 资产产出更高
        - from: spares
          to: tco
          label: 资本开支和维护成本更低
        - from: tco
          to: pricing
          label: 支撑支付意愿
        - from: pricing
          to: margin
          label: 没有成本数据仍不可见
    approximationNotes: 该桥使用公开代理宣称，不是已披露毛利率测算；应读作经济逻辑，而非已验证的单位贡献。
