  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入桥
        - 经审计的 2025 年收入、2026 年退出收入运行率，以及 2024 年披露收入、“triple” 表述和后续 5x YoY 说法之间的勾稽
        - 估值分母对价格敏感型承销来说仍太虚。
        - 要求 CFO 提供收入桥、董事会材料，以及客户出货到收入的勾稽。
      - - 毛利率和质保经济性
        - 毛利率、贡献毛利、电池包级 BOM、质保准备金和服务组合
        - 电池加系统业务在增长上可以很好看，但仍可能被单位经济性毁掉价值。
        - 要求按产品族拆分的 P&L、准备金政策和退货数据。
      - - 股权结构表和权利条款
        - Series C 优先股堆叠、参与条款、反稀释棘轮，以及 2026 年 5 月 SH10 文件说明
        - 普通股价值可能与名义投后估值大幅背离。
        - 审查融资文件、股权结构瀑布表和 Companies House 支持文件。
      - - 客户集中度
        - Symbotic 收入占比、前 10 大账户、续约 / 扩张机制，以及任何已签约数据中心客户
        - 即使旗舰客户强，集中账簿也应匹配更低倍数。
        - 要求客户队列 / 客户明细表，以及未来五个最大项目的已签约合同摘要。
      - - 制造准备度
        - 良率、吞吐、报废率、外包 / 内制拆分和铌输入安全
        - 工厂和供应链风险可能在规模经济到来前迫使公司再融资。
        - 要求工厂 KPI 看板、供应商集中度地图和质量历史。
      - - 退出路径和融资依赖
        - 老股流动性历史、下一轮融资可能时间，以及可信的 IPO/M&A 准备里程碑
        - 如果退出路径不可见，投资人今天可能是在为非常长久期资产买单。
        - 向管理层和领投方询问围绕下一轮、战略退出和 IPO 准备度的情景规划。
    notes: 这些问题聚焦少数缺失数据点，最可能改变建议或可接受入场价格。
