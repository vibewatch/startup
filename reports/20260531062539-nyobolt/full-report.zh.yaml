      - number: '2.5'
        title: 相互矛盾的估计与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 市场工作里的主要矛盾，不是来源对这些行业是否增长意见相差巨大；而是它们测量的是技术栈的不同层。宽口径仓储自动化数字、工业电池总量、UPS 市场估计和 ACR 专项申报可以同时为真，却暗示对
              Nyobolt 完全不同的机会规模。把它们平均在分析上是错的，因为单位、系统边界和支出层级都不匹配。因此还留下三个尽调缺口。第一，公开证据没有隔离仓储自动化预算中的电池或电源附着率。第二，公开证据没有把机架级
              AI 电源模组从总 UPS 或设施电气支出中拆出。第三，Nyobolt 的定价、已认证销售管线、存量改造数量或细分市场赢单率均无公开披露——所以真正的自下而上 SOM
              不能只靠公开来源来支撑。对尽调的实际含义是：可以把公司视为处在有吸引力、仍在增长的相邻市场里，但在管理层提供 BOM
              级支出份额、按细分市场划分的客户集中度，以及改造、工业车队和机架级数据中心电源的销售管线转化视图之前，不要承销一个精确市场模型。
