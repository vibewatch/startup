      - number: '3.2'
        title: 系统级替代品不复制 Nyobolt 化学，也在攻击同一个可用性问题
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 最强的竞争压力不只来自其他新型负极。能在系统层解决停机问题的架构同样构成压力。Symbotic 的公开公告很有启发，因为它显示 Nyobolt 在真实仓储车队里替代了什么：超级电容。Nyobolt
              在这组比较里胜出，原因是能量容量提高六倍、重量降低 40%，并兼容现有 SymBot 充电基础设施改造。但同一公告也证明，仓储自动化里的真实比较集合包括非电池或混合电源方案。


              公开来源里还明确列出其他替代路径。Ocado 的自动化换电站最多支持 100 台机器人，机器人利用率超过
              99%，并可在一分钟内完成换电，意味着仓库运营商可以靠换电编排来购买可用性，而不是购买快充化学。WiBotic 和 Wiferion
              销售无线充电加控制软件或电池选项，同样把问题从电芯化学转向充电物流和车队编排。Wiferion 甚至同时打包感应充电和 LFP/LTO
              电池选项，这在战略上重要：它说明替代方案可以把充电基础设施与既有化学体系组合起来，而不是二选一。


              在关键电源里，系统级比较更明显。Eaton 的 LFP UPS 故事讲的是安全和 BMS 管理的备电；Vertiv 则销售完整模块化 UPS 栈，带热插拔 Li-ion 或 VRLA 电池、DCIM/BMS
              集成和服务基础设施。BYD 的 Blade Battery 展示了化学侧既有 LFP 替代路径；Natron 历史上的 Blue Rack 说明高功率钠离子也能瞄准任务关键型电源。Skeleton 的
              SkelGrid 又突出另一类替代品：基于超级电容的短时备电和电能质量系统。对 Nyobolt 来说，这意味着买家常常能通过多条架构路径买到同一个结果——可用性、削峰、短时备电或车队利用率。
