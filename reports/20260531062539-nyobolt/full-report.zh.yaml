companyProfile:
  summary: >-
    Nyobolt 是一家总部在 Cambridge 的电池系统公司，早期 University of Cambridge 研究工作之后，于 2019 年完成法律注册。公司由 Sai Shivareddy 与 Clare Grey
    联合创办，销售高功率集成能源系统：自研铌基负极化学与电芯、模组、电池管理系统、电力电子和充电器组合在一起，服务仓储机器人、AI 数据中心、商用车、工业车队等停机成本高的场景。公司仍是 C 轮阶段的私营企业：2026 年 5 月以超过
    $1B 估值融资 $60M，此前 2025 年 4 月融资 $30M，已披露资本目前至少约 $160M。到 2026 年，公开牵引力明显增强，包括 2024 年收入超过 $9M、合同价值超过 $150M、通过 UN38.3
    认证的电芯，以及 Symbotic 的真实生产使用；但客户数、员工数、毛利率和融资条款仍未披露。
