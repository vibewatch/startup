      - number: '4.3'
        title: 资本密集度与充足性
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 的资本需求显然真实存在。2024 年 7 月 BAT 评估显示，公司在为 Haverhill 试点设施申请环境许可，该设施每年可生产最高 900 吨负极材料，或每天 2.5
              吨，原料包括五氧化二铌和三氧化钨，并配套专用过滤、水管理和废弃物处理。2024 年 1
              月认证公告把公司推进到生产就绪软包电芯和面向客户项目的电池包生产，因此资本需求覆盖材料处理、电芯认证、电池包和应用特定集成，而不只是授权一项化学技术。这种运营画像也解释了 2025 年 1
              月的压力信号：electrive 和 BusinessCloud 均报道称，Nyobolt 曾警告可能在 2025 年第一季度末耗尽现金；electrive 还引用 2023 年账目，显示收入只有
              £67,000、亏损 £20 million。后续融资似乎稳定了公司：2025 年 4 月官方材料宣布 $30 million 融资，2026 年 5 月官方材料宣布 $60 million C
              轮。但当前公开记录仍未披露现有现金、月度烧钱速度、债务、营运资本波动或现金跑道月数，因此资本充足性只能从融资节奏推断，不能直接承销。
