      - number: '7.3'
        title: 运营、质量与规模化风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Nyobolt 已经越过纯研发阶段，进入真实系统交付，但最难的工作仍在前面。公开来源显示，公司试图控制更多技术栈，从材料、电芯到电池包、电池软件和客户集成。这种野心正是其在仓储或 AI
              基础设施机架层面拼出差异化正常运行时间经济性的来源，但也会放大规模化过程中可能出错的环节。Haverhill
              是一个有意义的试点资产，但试点产能不等于可重复的生产经济性。留存资料没有披露良率、报废率、吞吐稳定性、质保成本或现场故障率。数据中心推进更早期；Rajasthan MoU
              具备战略意义，但公开证据仍像投产前意向，而不是已上线、可背书的部署。电池行业外部复盘也凸显了这个缺口的危险。项目失败不是因为化学体系无关紧要，而是因为认证、工艺控制、运营准备度和资金必须同时对齐。Nyobolt
              的缓释姿态是真实的，但仍不完整；因此，规模化应被视为一个需要持续监控的执行项目，而不是被一次优秀机器人部署清除掉的风险。
