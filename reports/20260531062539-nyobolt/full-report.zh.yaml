      - number: '8.3'
        title: 可比公司背景、市场情绪与公允价值纪律
        blocks:
          - type: paragraph
            body: >-
              当前市场情绪并未非理性地拒绝 Nyobolt 的故事。公开市场投资人仍会选择性奖励 AI 自动化和电池标的：Symbotic 估值约 280 亿美元，季度收入超过 6.76 亿美元；AutoStore 约以
              7.9 倍 EV/收入交易，且利润率强；Amprius 尽管仍未规模化且亏损，仍约以 31.6 倍 EV/收入交易。电池材料规模化仍能拿到私募资本：Sila 2024 年融资 3.75 亿美元，Group14 在
              2025 年完成 4.63 亿美元融资。但公允价值推理应比市场情绪更严格。Nyobolt 比自动化可比公司更早期，披露也少于投机型电池可比公司。最站得住脚的判断是，10
              亿美元估值高于基于公开可比公司的基准情景；只有在披露增长转化为超过 5000 万美元收入运行率、且毛利扩张可信、Symbotic
              之外有多客户证明的乐观情景下才合理。否则，今天的估值更像是在为未来数据中心和机器人可选性提前付费，而不是买入已经证明的经济性。
