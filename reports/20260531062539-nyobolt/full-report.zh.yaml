      - number: '8.4'
        title: 投资逻辑破裂触发点、退出准备度与仍阻碍承销的事项
        blocks:
          - type: paragraph
            body: >-
              关键承销障碍很具体。第一，公开证据仍无法把 2024 年披露收入、管理层“翻三倍”目标和后来的“同比增长 5 倍”表述对齐成一个硬数字，因此对价格敏感的投资人还无法锁定可靠的收入分母。第二，Companies
              House 备案轨迹显示轮后权利活动，但没有披露决定普通股经济性的优先权、参与权或反稀释细节。第三，Nyobolt
              的制造案例有前景，但尚未完全去风险：电池同行仍需要大额融资，有时仍会失足，而铌供应仍然集中。第四，没有公开的 IPO
              式披露包，也看不到明确的近期退出流程；公司仍像是在持续私募融资中推进，而不是临近流动性。因此，进入价格纪律很重要。更低价格，或经审计证据证明 2025–2026
              年收入与利润率质量已经支撑乐观情景，可能把建议推向“观察”。以当前估值看，公开证据支持谨慎和尽调优先。
