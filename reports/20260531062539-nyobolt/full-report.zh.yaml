  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 哪些情况会改变判断
    rows:
      - - 投资逻辑
        - Symbotic 的战略背书、明显更好的机器人电池性能、新一轮 $60M 融资，以及面向工业规模化的公开支持，说明 Nyobolt 正在解决机器人和电力基础设施里真实存在的稼动率问题。
        - 若经审计收入高于公开区间上沿、毛利率进展可见，并且在 Symbotic 之外拿下有分量的多客户订单，当前估值会更容易站住。
      - - 反向逻辑
        - 绝对收入披露仍很薄，毛利率和股权结构条款仍未公开；同业电池规模化仍要吃掉大量资本，行业里的反向案例也说明情绪可以很快翻转。
        - 如果尽调发现积压订单转收入偏弱、新投资人前面存在结构化下行保护，或对单一客户持续依赖，建议应转向回避。
    notes: 反向逻辑针对的是价格和披露质量，不是否定 Nyobolt 已有产品验证。
