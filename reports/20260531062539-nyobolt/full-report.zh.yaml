            body: >-
              公司的公开时间线显示，它已经从化学突破清晰转向商业化。学术根源至少可追溯到 2016 年，公司把核心电池突破归于 2018 年，法律注册随后在 2019 年完成。融资里程碑出现在 2021、2022、2025 和
              2026 年；产品与制造节点则包括 2023 年 7 月基于 Lotus Elise 的演示、2024 年 1 月生产就绪电芯通过 UN38.3 认证，以及 2024 年 7 月针对 Haverhill
              负极材料试点设施的 BAT 评估，目标产能最高每年 900 吨。2025 年 9 月，Symbotic 和 Nyobolt 披露用于 SymBot 自主移动机器人的升级电池硬件，商业验证再次加速；2026 年 C
              轮公告又加入 Rajasthan 备忘录，覆盖超过 100MW 的离网 AI 数据中心基础设施。公开记录中最清晰的负面项，是 2025 年初现金跑道惊魂：BusinessCloud 和 electrive
              均报道称 Nyobolt 曾警告可能在 2025 年第一季度末耗尽现金，electrive 还引用 2023 年账目，显示公司收入只有 £67,000、亏损 £20 million。后续融资和 C
              轮说明公司已恢复过来，但这一事件仍重要，因为它说明 Nyobolt 仍是资本密集型扩产公司，而不是已经完全自我供血的平台。
