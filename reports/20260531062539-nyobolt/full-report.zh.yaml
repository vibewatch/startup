  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 2026 年收入运行率已高于约 $50M；Symbotic 只是多个规模化客户之一；AI 数据中心项目转化为签约收入；毛利率证据对硬件加系统业务而言可接受。
        - 可支撑区间约 $1.0B-$1.4B；当前估值可以跑通，但前提是尽调确认转化强劲且条款干净。
        - 即便在这种情景下，结论仍取决于制造执行和客户多元化。
        - 需要尚未公开的证据，因此应视为取决于尽调，而不是基准事实。
      - - 基准
        - 收入更接近披露锚点所隐含的 $27M-$45M 区间，增长仍强，但利润率和客户组合只得到部分验证。
        - 可支撑区间约 $0.6B-$0.9B；当前轮估值偏满，更适合观察而非买入。
        - 如果积压订单转化或融资条款不及预期，容错空间有限。
        - 最符合当前公开记录：牵引力真实，但披露的经济性还不足以支撑干净的独角兽承销。
      - - 悲观
        - 商业转化停留在较早披露的收入锚点附近，Symbotic 集中度持续存在，或隐藏优先权 / 制造挫折推高折现率。
        - 可支撑区间约 $0.25B-$0.5B；下行会很重，因为降价轮重置会从很薄的公开收入分母开始。
        - 电池行业资本市场保持选择性，硬件投资人要求更干净的经济性。
        - 如果尽调偏弱、客户放量延迟，或有证据显示名义估值不代表普通股真实价格，该情景就会触发。
    notes: 区间有意拉宽，因为 Nyobolt 未公开披露经审计收入、毛利率或融资条款。
