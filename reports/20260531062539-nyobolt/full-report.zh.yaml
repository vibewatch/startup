        title: 合作伙伴、供应与市场依赖
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 的依赖链异常紧。Symbotic 是最清晰的例子：它验证产品、出资支持公司，并提供最可见的规模化放量路径，但这一渠道继承了 Symbotic 自身业务结构中对 Walmart 和 GreenBox
              的集中暴露。上游看，化学体系依赖铌；铌是战略上集中的投入品，仍由巴西主导，并受到 CBMM 市场力量影响。竞争依赖同样重要。客户判断 Nyobolt
              是否值得支付溢价时，并不是在和一个静态的石墨世界比较；他们还在看 Sila、Group14、StoreDot、Amprius 和 Echion
              各自推进快充、硅负极或替代负极叙事，这些同行往往有大额资本计划或不同的商业化路径。这些同行提供了双向证据。一方面，它们证明机会真实且具有战略重要性。另一方面，它们的建厂融资、休假、停产和复盘显示执行路径有多窄。因此，Nyobolt
              同时面对商业集中、原材料集中和竞争压缩风险，这些风险可能比化学故事更快传导到收入时点、毛利率和未来融资条款中。
