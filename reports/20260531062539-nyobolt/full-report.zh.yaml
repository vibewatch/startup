  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接化学路线同行与相邻材料供应商
        blocks:
          - type: paragraph
            body: >-
              不应把 Nyobolt 与所有电池创业公司按同一种方式比较。在 Nyobolt 所说的仓储机器人、工业电源和 AI 数据中心切入口上，最接近的公开直接同行是 Echion，因为 Echion
              也围绕六分钟充电、长循环寿命、机器人、工业 ESS 和 AI 数据中心来包装其铌负极化学。不过，Echion 的公开包装不同：它把 XNO 作为可直接替换的负极材料卖给电芯制造商，再通过 “Powered by
              XNO” 生态触达终端用户。这意味着 Echion 在底层快充故事上与 Nyobolt 竞争，同时要求买家改变的周边系统架构更少。


              Amprius、StoreDot、Sila 和 Group14 属于相邻竞争者，不是完全直接，但仍然重要，因为它们承诺更快充电或更高功率，而不迫使 OEM 购买 Nyobolt 式的集成栈。Amprius
              强调硅负极电芯，最高 450 Wh/kg、六分钟完成 0-80% 充电、循环 1,300 次；这比 Nyobolt 以可用性为中心的说法更偏能量密度。StoreDot 推动硅主导 XFC
              电芯，称其是唯一量产就绪的十分钟 EV 充电平台，已由大型 OEM 测试，并可在标准产线生产。Sila 和 Group14
              再向上游走一层：二者都销售可直接替换、适配既有超级工厂流程的硅负极材料，也都展示规模、专利和客户证据，说明当买家已有电芯制造关系时，它们的市场进入摩擦可能低于 Nyobolt。


              实际读数是，Nyobolt 的化学护城河不只是“快充”。快充已经存在于多个公开叙事里。Nyobolt
              的差异点反而是把快充、高循环寿命和集成可用性结果组合进机器人或机架级电源系统。因此，化学路线同行重要；但最危险的竞争者往往是那些能让客户保留更多既有制造或电力架构不变的公司。
