        title: 人员、治理、缓释与放弃条件
        blocks:
          - type: paragraph
            body: >-
              最后一组风险来自人和信息。Nyobolt 在最关键的地方仍像一家创始人主导的公司：Sai Shivareddy 是商业执行核心，Clare Grey
              是科学可信度核心，较新的运营招聘仍在扩充交付班底，把电池科学转化为客户正常运行时间。公司规模小、叙事动能强时，这种结构可以运转良好；但一旦多个垂直行业、工厂和融资轮次需要同时管理，它就会变成脆弱点。Companies
              House 记录还显示，治理边界比官网呈现的更宽、更复杂：有大量公司官员、近期股权权利活动，并且 PSC
              备案下公开控制权能见度有限。单看这些都不足以否定公司，但合在一起意味着正确的缓释姿态应以里程碑为中心。第二个点名生产客户、更广认证覆盖、明确的供应多元化、披露制造
              KPI、更清晰的治理能见度，都会降低剩余风险。反过来，如果客户集中持续存在、数据中心证据停留在 MoU 阶段，或运营变得可读之前就需要新资本，投资人应把这视为投资逻辑破裂，而不是暂时不便。
