      - number: '7.2'
        title: 法律、监管与认证风险
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 的法律与监管图景已经足够可信，值得纳入判断；但信息仍不完整，会约束投资承销。正面看，公司没有在制造环节空喊：Haverhill 工厂进入了真实的环境许可流程，包含 BAT
              评估、风险分析和运营技术文件。公开记录还显示，两种可量产软包电芯已取得 UN38.3 认证，ISO 9001
              质量体系工作也早于商业化生产启动。这些都是有意义的缓释因素。问题在于覆盖面。公开证据仍集中在少数披露的批准和流程文件上，而 Nyobolt
              现在把产品推向机器人、重型车辆和数据中心环境，这些场景通常需要更宽的认证和客户定制合规包。IP
              图景也类似。已公开的专利申请好过毫无保护的科学故事，但公开记录还看不到更完整的自由实施包、诉讼清单或广泛专利族地图。这不能证明公司薄弱；它意味着剩余法律风险由披露不足驱动，应视为未关闭，而不是已解决。因此，监管与法律登记表仍只是第一轮尽调材料，不是最终安慰剂。
