      - number: '6.4'
        title: 集中度风险与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最大的客户风险不是 Nyobolt 完全没有真实客户证据，而是证据太窄。Symbotic 看起来真实且具有战略重要性，但公开可点名的客户广度在这段关系之外仍很稀薄。这已经在 Nyobolt
              层面形成明显的单一客户集中风险。风险往下游再叠一层：第三方报道称，Symbotic 2025 财年超过 84% 的收入来自 Walmart，225 亿美元积压订单的绝大部分也与 Walmart 和
              GreenBox 相关。Symbotic 自己与 Walmart 的协议同样指向很大的 APD 和积压订单机会，这对放量潜力是好事，但也确认 Nyobolt
              最清晰的规模化路径绑定在一个本身高度集中的客户关系上。换句话说，Nyobolt
              最强的公开证据点是真实的，但既不广，也不分散。因此，投资人应把客户章节视为一个强单一参照案例，叠加令人鼓舞的扩张代理指标；不能把它当作广泛装机基础的证据。关键尽调问题很直接：准确客户数、按客户和细分市场拆分的收入结构、合同期限、Symbotic
              的出货或改装量、人形机器人开发者项目的身份与阶段，以及 Rajasthan 或其他数据中心部署的已签商业条款。
