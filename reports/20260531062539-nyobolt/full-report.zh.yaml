  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 的公开材料描述的是应用牵引的电力系统业务，而不是大宗电池 SKU 目录。横跨仓储机器人、AI
              数据中心和商用车，公司销售由自研负极、电芯、电池包、电池管理软件和电力电子组成的集成高功率系统。变现模式看起来也更偏企业驱动和定制化，而不是标价销售：数据中心和车辆页面把买家导向销售线索表单或联系流程，重点放在可用性和总拥有成本主张，而非公布每
              kWh 或每套系统价格。这说明报价可能按客户、工况和集成范围来定。尽管如此，收入质量强于普通试点阶段硬件故事，因为 Symbotic 已在真实仓储部署中使用 Nyobolt 电池，并随后领投 2026
              年融资。公开商业数字仍是公司口径，但方向上有意义：2025 年 4 月材料称 2024 年收入超过 $9 million、合同价值超过 $150 million；2026 年 5 月材料称收入同比增长
              5x。这些信号支撑真实需求，但实际 ASP、合同期限、收入确认时点，以及机器人与数据中心项目的收入组合仍未公开。
