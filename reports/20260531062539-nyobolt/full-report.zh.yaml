  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与需求界面
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 的公开客户地图远宽于其具名客户名单。审阅过的官方页面描述了三类主要购买界面。第一是实体 AI 和仓储自动化，公司向关心可用性、避免换电和吞吐量的机器人 OEM、集成商和仓库运营商销售电池。第二是
              AI
              数据中心电源，买方不像是在采购电池，而更像是需要机架级浪涌稳定、削峰和备电的数据中心运营商、基础设施开发商或面向电网的能源管理者。第三是移动和重型工业，覆盖公交、配送车队、卡车、叉车、港口设备、工程设备、矿用自卸车，以及相邻自动驾驶项目。市场背景说明这些界面为什么重要：仓储自动化已经是一个由
              North America 引领、持续几十年的增长市场；随着 GPU
              密集型设施给电网施压，数据中心备电和电源管理需求也在扩大。承销时的限制条件是，营销界面的广度不等于已验证客户的广度。公开证据在仓储机器人上最强，数据中心明显更薄，商用车和非公路细分则大多仍由营销材料支撑。
