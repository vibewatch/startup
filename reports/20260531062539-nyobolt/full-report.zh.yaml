  - id: TP003
    title: 定价 / 封装对比
    columns:
      - 竞争对手 / 替代方案
      - 公开封装或合同模式
      - 公开价格可见度
      - 包含能力
      - 对 Nyobolt 的含义
    rows:
      - - Nyobolt
        - 面向机器人和机架级电力的集成电池系统；企业部署模式
        - 所审查来源没有公开标价
        - 电池、电力电子和围绕正常运行时间的封装
        - 必须证明 TCO，而不只是快充化学体系
      - - Echion
        - XNO 负极卖给电芯厂；面向终端用户的 Powered-by-XNO 路径
        - 所审查来源没有公开标价
        - 可直接导入的负极材料加生态支持
        - 摩擦更低的采用路径可能压缩 Nyobolt 的化学体系溢价
      - - Amprius
        - 电芯供应商 / 上市公司商业模式
        - 已审阅来源未见公开标价
        - 高能量 / 高功率硅负极电芯
        - 买方更看重电芯性能而非集成系统设计时构成竞争
      - - StoreDot
        - XFC 化学体系可在标准产线上生产，并有 OEM 部署路线图
        - 已审阅来源未见公开标价
        - 硅主导快充电芯技术
        - OEM 无需采用 Nyobolt 全栈也能追求快充
      - - Sila / Group14
        - 上游负极材料供应，接入现有电芯产线
        - 已审阅来源未见公开标价
        - 可直接导入的硅负极材料，配套规模化工厂
        - 材料供应商可降低大型制造商的切换摩擦
      - - Natron Blue Rack
        - 250/500 kW 钠离子机柜，预购 / 项目销售
        - 已审阅来源未见公开标价
        - 具备 5-15 分钟充电能力的关键任务电源柜
        - 买方可把 Nyobolt 与完整关键电源柜直接比较
      - - Vertiv APM2 / Eaton UPS
        - 基于报价的企业硬件与服务销售
        - 已审阅来源未见公开标价
        - UPS 机柜、Li-ion 或 LFP 电池选项、控制、服务、监控
        - 既有厂商卖的是完整运营包，而不只是储能
      - - WiBotic / Wiferion
        - 充电基础设施、软件和可选电池包
        - 已审阅来源未见公开标价；Wiferion 宣称定价透明，但未公布价格表
        - 无线充电、API、车队控制、可选 LFP/LTO 电池包
        - 它靠充电架构解决在线率，而非专有电芯
      - - Ocado 换电
        - 基于项目的自动化系统销售
        - 已审阅来源未见公开标价
        - 面向 100 台机器人换电、同时为 10 块电池充电的换电站
        - 换电无需 Nyobolt 化学体系，也能打出很高利用率
