      - number: '5.3'
        title: 制造、质量与路线图
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 的制造和合规记录比尚未出产品的深科技公司更成熟，但离完整工业透明度仍有距离。最清楚的硬证据，是 2024 年 1 月两款生产就绪软包电芯通过 UN38.3
              的公告，这把公司从实验室叙事推向可认证、可发货硬件。另一个重要技术验证点，是 2024 年 7 月 Haverhill 试点设施的 BAT 评估。该文件显示，Nyobolt
              正在为负极材料生产申请环境许可，年产能最高 900 吨，使用五氧化二铌和三氧化钨，并配备 HEPA 捕集颗粒控制、水监测、废弃物处理流程和正式事故管理路径。可持续发展页面又加入电池电芯制造的 ISO 9001
              质量管理主张，以及与 OECD 和 UN 指引挂钩的负责任采购框架。UKRI 与 UKBIC 的公开扩产支持，加上 Cambridge Enterprise 对其与 H.C. Starck Tungsten
              Powders 在供应、制造扩产和回收上的合作描述，进一步说明 Nyobolt 一直在解决工业化问题，而不是停留在纯研发。其他成熟度信号包括 Nyobolt 自己的 2026 Sunday Times
              硬件排名、Cambridge
              化学系称研究已转化为真实部署的说明，以及一则招聘帖显示公司正在招聘软件和控制负责人，把电池系统推入客户项目。路线图方向明确：从认证软包电芯，到模组、电池包、充电器、机器人部署和数据中心电源系统。但自制还是合作的模式仍只披露了一部分。Nyobolt
              明说电池电芯制造取决于产量，同时强调内部设计、试点制造和电池包 / 软件知识产权。这支持一种混合运营模式，但公开来源仍未披露电池包良率、故障率、质保准备金，或从试点产量走向规模化商业吞吐的精确路径。
