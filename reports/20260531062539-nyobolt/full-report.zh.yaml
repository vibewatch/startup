        - id: eval
          label: 技术评估
          detail: 客户团队评估工况循环、热表现、充电速度和基础设施适配。
        - id: pilot
          label: 有限量产 / 试点
          detail: 只有电池进入真实运营，公开证明才有分量；Symbotic 在 2025 年 6 月披露的有限量产就是这一类。
        - id: rollout
          label: 量产推广
          detail: 如果试点或有限量产阶段足够耐用，后续才会进入更大范围的新生产部署。
        - id: retrofit
          label: 存量设备扩张
          detail: 向后兼容和改装路径能扩大同一客户关系内的出货潜力。
        - id: adjacent
          label: 相邻垂直领域扩张
          detail: 人形机器人和 Rajasthan 式电力项目，是核心仓储切入点之外的公开扩张信号。
      edges:
        - from: pain
