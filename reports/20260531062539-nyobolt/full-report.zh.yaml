      - number: '4.2'
        title: 牵引力与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              公开单位经济证据仍只是代理层，但这组代理指标有商业相关性。最清楚的买方价值驱动，是省下的分钟数、保住的可用性、避免配置的备用资产，以及推迟的更换周期。Symbotic 称，Nyobolt 升级让 SymBot
              机器人的能量容量提高六倍，电源单元减重 40%，循环寿命至少达到传统锂离子的 10x；Nyobolt
              自己的电网和车辆页面也反复把快充与长循环寿命同减少换电、降低假负载损耗、缩小车队规模和降低总拥有成本联系起来。Nyobolt 还称，在 350kW 基础设施上可 4 分 37 秒完成 10-80%
              充电，原型车完成超过 4,000 次快速循环；电网页面则称 20,000 次快速循环后容量保持率超过
              80%。对每天多次充电的机器人、电网和车队来说，这些都是有意义的商业信号。但它们不能替代已披露单位毛利。公开信息中仍没有按垂直领域划分的 ASP、BOM
              披露、质保准备金数据、毛利率桥接分析、CAC/回本周期计算或客户集中度披露。外部市场背景也混杂：大型终端市场存在，但工业电池包价格下降意味着未来定价压力，除非 Nyobolt 的性能溢价能在真实部署中证明持久。
