        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人叙事在 Nyobolt 当前商业定位里异常核心。Sai Shivareddy 仍是 CEO，也是面向外部的经营者；Clare Grey
              仍任首席科学家，为化学和材料故事提供科学锚点。官方领导层页面还列出一组运营班底，包括 CTO Brian Barnett、EVP/CCO/CFO Ramesh Narasimhan 和 VP Finance
              Rajganesh Ramachandran，说明在披露水平相近的电池深科技同行里，Nyobolt 已搭出更职能化的管理层。不过，治理可见度仍不完整。Companies House 显示有 13 名
              officers 和 3 次辞任，治理边界比官网呈现更宽；但公开来源仍未给出完整董事会委员会地图、投资人席位分配或持股比例。PSC
              页面也值得注意，因为当前显示没有活跃、可登记的重大控制自然人或法人实体，外部观察者无法仅靠 PSC 文件推断控制权。用于尽调时，这使 Sai Shivareddy 成为关键人商业依赖，Clare Grey
              成为关键人科学依赖，而投资人治理影响的精确程度仍是重大开放问题。
