  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序全景
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 现在已有足够证据值得认真研究，但还不足以让投资人轻松下注。最强证据仍是通过 Symbotic
              进入仓储机器人；但同一段关系也是公司最大的结构性风险，因为客户证据、商业化节奏和资本支持都集中在一个交易对手身上，而该交易对手本身又高度暴露于 Walmart 和
              GreenBox。第二项风险是工业化深度：Haverhill
              和公开认证记录显示，公司确实走出了实验室，但留存资料仍缺少良率、报废率、质保和广泛认证矩阵。第三项风险是对稀缺投入品和快速竞争的战略依赖：铌供应集中，资金更充足的硅负极或替代负极同行还在建厂、出货，或至少抬高客户预期。第四项风险是执行焦点漂移：故事已经横跨机器人、商用车和
              AI 数据中心，但公开量产证据仍很窄。第五项风险是治理不透明：备案文件显示复杂的股权权利和比官网更宽的高管 / 董事边界，但仍不足以看清控制权、下行保护或投资人的准确影响力。因此，投资人应把 Nyobolt
              视为一个有前景、但仍由关键风险承重的项目；其上行空间取决于客户多元化、认证扩展和生产指标能否比新资本需求更快出现。
