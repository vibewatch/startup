      - number: '4.4'
        title: 公开缺口与财务判断
        blocks:
          - type: paragraph
            body: >-
              公开文件确认，Nyobolt 仍在依赖股权发行和日益复杂的股份权利，而不是展示自我供血的规模化。Companies House 记录显示，2025 和 2026 年多次配股；2026 年 2
              月确认声明列出普通股、A 普通股和 B 普通股，合计 4,528,292 股；2026 年 4 月 SH01 又新增 C 普通股及反稀释语言，并把总股数提高至 4,868,654
              股。这本身不意味着困境，但确实确认了新闻稿基本省略的融资复杂性和投资人保护机制。因此，整体承销结论是混合的。Nyobolt 显然已经从研究项目跨入真实商业部署，Symbotic 关系也实质提高了收入可信度。但
              $1 billion
              估值仍建立在实际定价、毛利率、客户集中度和流动性等证据缺口上。下一步尽调不应再主要问化学是否有效，而应聚焦合同排期、毛利率构成、营运资本要求，以及数据中心机会到底是已有资金的项目，还是仍处于收入前的期权价值。
