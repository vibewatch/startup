  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资信号
      - 目标细分市场
      - 差异化
      - 相比 Nyobolt 的局限
    rows:
      - - Nyobolt
        - 集成式高功率电池系统
        - 私营；已公开一个具名规模化机器人合作伙伴；定价未披露
        - 仓库机器人、AI 数据中心、工业正常运行时间
        - 快充集成系统；Symbotic 案例证明可兼容改造
        - 公开部署广度和定价证据仍薄
      - - Echion
        - 直接的铌负极化学体系同行
        - £10M 新融资；声称 XNO 达 2,000 t/year 规模
        - AI 数据中心、机器人、工业 ESS、重型运输
        - 6 分钟充电、>50,000 次循环、可直接导入的负极材料
        - 通过合作电芯厂销售，而不是完整正常运行时间栈
      - - Amprius
        - 相邻硅负极电芯供应商
        - 有 2026 ARS 和 10-K 可查的上市公司申报主体
        - 高性能移动和高功率应用
        - 最高 450 Wh/kg，六分钟充至 0-80%
        - 比 Nyobolt 更偏能量密度，系统集成度更低
      - - StoreDot
        - 相邻 XFC 电芯 / 化学体系平台
        - 融资 ~$200M，100+ 项专利，2024 年材料称有 15 家 OEM 评估
        - EV OEM 和电池制造商
        - 标准产线上实现 10 分钟内 XFC
        - GTM 先打汽车市场，而不是仓库或机架级正常运行时间
      - - Sila
        - 相邻硅负极材料供应商
        - $375M G 轮；Moses Lake 扩产；Mercedes 和 Panasonic 具名
        - 汽车和更广泛的电芯制造客户
        - 可直接导入的 Titan Silicon，目前密度提升 20-25%
        - 上游材料模式在买方经济性上间接竞争
      - - Group14
        - 相邻硅负极材料供应商
        - 10 GWh 已上线，股权融资 >$1B，声称 100+ 客户
        - EV、消费类、数据中心、电网和设备电池
        - SCC55 具备 EV 级供应规模和广泛化学体系兼容性
        - 即使规模和资本更大，执行风险仍在
      - - Natron
        - 曾经的高功率替代化学体系
        - 推出 250/500 kW 机柜；后因融资失败关闭
        - 关键任务电力、工业电力、EV 快充
        - 不可燃钠离子，5-15 分钟再充，50k 次循环
        - 失败说明产品优势可能输给资本和规模风险
      - - BYD Blade Battery
        - 既有 LFP 替代方案
        - 数百万辆已部署车辆和 8 年电池质保
        - EV 和更广泛 LFP 电池买方
        - 更安全成熟的 LFP 架构，>5,000 次循环
        - 并非围绕机器人正常运行时间或机架集成专门打造
      - - Vertiv Liebert APM2
        - UPS 既有厂商 / 系统替代方案
        - 全球关键任务供应商，拥有模块化 UPS 产品家族
        - 数据中心和关键任务设施
        - 10-600 kVA/kW UPS、Li-ion / VRLA、DCIM 和服务栈
        - 靠架构广度竞争，而不是电池化学体系
      - - WiBotic / Wiferion / Ocado
        - 充电或换电架构替代方案
        - 商用无线充电和换电产品，带车队级打包方案
        - 仓库机器人、AGV、AMR
        - 靠编排、无线充电或换电解决正常运行时间
        - 不创造 Nyobolt 式高功率电池 IP
    notes: 规模单元格混合了已披露融资、产能、监管文件可见度或具名部署证明。公开标价大多不可得， 因此本表聚焦封装和商业化信号，而非已实现平均售价（ASP）。
