  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Nyobolt（隐含）
        - 基于稀疏公开收入锚点的私募估值
        - $1.0B 估值；按披露的 2024 年收入计算超过 100x，按简单三倍收入情景约 37x，即使按慷慨的约 $45M 方向性情景仍约 22x
        - 投资人已经把相当多未来机器人和数据中心成功资本化进价格。
        - 分母不确定，因为公开披露没有给出一条干净的 2025-2026 年收入桥。
      - - Symbotic
        - 上市仓储自动化平台
        - 约 $28.0B 市值；约 ~10x 市值 / 年化 2026 财年 Q2 收入
        - AI 赋能的仓储自动化一旦规模真实，可以维持高溢价估值；Symbotic 是最好的上市证据。
        - 它是规模大得多的系统集成商，拥有软件、服务和二级市场流动性，Nyobolt 还没有。
      - - AutoStore
        - 上市仓储自动化基准
        - 44.22B NOK 市值；7.67x 市销率和 7.92x EV/revenue
        - 可作为盈利型自动化公司服务相似仓储客户的估值锚。
        - AutoStore 是成熟上市自动化厂商，不是私营电池公司，因此折现率应更低。
      - - Amprius
        - 上市高增长电池技术同行
        - $2.87B 市值；29.43x 市销率和 31.59x EV/revenue
        - 保留下来的上市可比中最接近的先进电池公司，市场仍按增长叙事和技术上行空间定价。
        - 终端市场组合不同，二级市场交易会在正负两端放大情绪。
      - - Sila
        - 私营电池材料规模化融资
        - 2024 年 $375M Series G 轮，用于完成 Moses Lake 工厂并支持车企交付
        - 可信的电池材料规模化在收入成熟前会吃掉大量资本，Sila 展示了这种资本强度。
        - 保留来源未披露同期估值倍数，因此它是资本历史参考，不是真正的倍数可比。
      - - Group14
        - 私营硅电池资本历史
        - 2025 年 $463M Series D 轮，累计股权融资超过 $1B
        - 有助于理解大型电池材料龙头仍需要反复融资和工厂控制才能工业化。
        - 估值未披露，近期停薪休假也显示，已融资本不能消除执行风险。
      - - Echion
        - 私营铌负极同行资本历史
        - 追加 £10M 融资，配套 1 GWh 等效 XNO 规模化路径
        - 对铌基快充定位而言，这是保留下来最接近、化学体系相邻的参考。
        - 公司规模小得多且估值未披露，因此是战略参考，不是直接定价可比。
    notes: 这是一组对决策有用的可比对象，不是所有电池、机器人或工业科技公司的穷尽清单。
    enumerationScope:
      coverage: partial
      basis: >-
        The table focuses on the most decision-relevant public comps and private capital histories retained in this
        chapter, rather than every adjacent battery or automation name.
