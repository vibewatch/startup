      - number: '5.4'
        title: 依赖、限制与技术判断
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 的产品逻辑在可用性经济性明显、工况严苛的地方最强。这也是为什么仓储机器人目前看起来像公司披露最充分的切口：Symbotic
              具名证明，化学、电池包和充电器集成能在真实车队环境中跑赢超级电容；Nyobolt 自己的工作流材料也解释了短机会充电为什么重要。Highways Today 2026 年的工业 AI
              框架也指向同一方向，把能源基础设施，而不只是软件，视为自动系统规模化的瓶颈。更难的挑战，是把这个故事延展到更广平台时不过度销售。AI
              数据中心和商用车页面确实描述了真实问题，但具名客户验证、公开现场指标和运营参考仍然稀薄。供应和物理也施加限制。Haverhill 许可显示 Nyobolt 依赖五氧化二铌和三氧化钨投入；SFA
              的铌市场研究则强调铌供应仍高度集中在 Brazil 和 CBMM 周边。SFA
              还指出铌基负极的核心权衡：高充电速度和长循环寿命可能伴随低于石墨或硅的能量密度，这在可用性优先的机器人和电源缓冲系统中可以接受，但很难泛化到所有 EV 用例。承销结论因此是技术性但谨慎的。Nyobolt
              看起来确有产品和工艺实质，不只是实验室 IP；但大量头部性能叙事仍锚定在公司或伙伴披露上。投资人应把机器人验证视为最强，把制造路径视为可信但未充分披露，把更宽的 AI
              数据中心和车辆平台主张视为有潜力但尚未以同等深度独立验证。
