  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 如何传导到投资逻辑
      - 行动含义
    rows:
      - - 收入转化落空
        - 经核验的 2025-2026 年收入明显低于约 $30M-$40M 的基准区间
        - 当前独角兽定价立即失去支撑，因为公开分母仍太小。
        - 按悲观区间重新承销，并假设降价轮风险已经出现。
      - - 合作伙伴集中度持续
        - Symbotic 仍是主导验证点，其他机器人 / 数据中心客户未形成实质规模
        - 投资逻辑从平台机会缩成集中供应商关系。
        - 采用更高的客户集中度折价，并暂停任何激进入场。
      - - 优先权压力浮现
        - Series C 条款包含参与型优先股、反稀释棘轮或其他实质性压低普通股持有人权益的权利
        - 名义估值不再代表真实入场经济性。
        - 在理解瀑布分配前，不要把 $1B 标记作为公允价值锚。
      - - 制造或供应链挫折
        - 良率、质保或铌供应瓶颈推迟规模交付
        - 电池规模化同行表明，商业化延迟会迅速压缩估值。
        - 切到更低倍数区间，并重新评估资本需求。
      - - 数据中心可选项仍停留在概念
        - 除 MOU 和叙事定位外，没有已签约、贡献收入的 AI 电力合同
        - 乐观情景最大驱动之一消失，估值只能依赖机器人业务。
        - 在出现合同证据前，把当前轮当作纯机器人情景处理。
    notes: 每个触发项都应能在尽调或下一轮融资周期中监测，而不是抽象宏观风险。
    claimRefs:
      - CV006
      - CV009
      - CV035
