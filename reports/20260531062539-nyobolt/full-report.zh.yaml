        title: 投资逻辑、反向逻辑与情景框架
        blocks:
          - type: paragraph
            body: >-
              投资逻辑很容易看见。Nyobolt 有可信的技术叙事，有 Symbotic 这个战略客户兼投资人，有仓储机器人中的具体性能证明，也有制造规模化的公开支持。Symbotic
              称，新电源包在其机器人队列中，相比传统锂离子方案带来 6 倍能量、重量降低 40%，循环寿命至少提升 10 倍；Nyobolt
              也称自己正在瞄准数据中心电力和重型电动化。反向逻辑同样重要。公开披露仍看不到毛利率、EBITDA、客户集中度、积压订单转化、质保成本或 Series C
              后的优先股堆叠。硬件电池同行也不断证明商业化仍然高度耗资：Sila 和 Group14 为继续建设产能各自融资数亿美元，而 Natron 在未能获得足够资金后关闭。这个组合意味着，乐观情景需要证明 Nyobolt
              正把战略验证转化为具备吸引力单位经济性的可重复收入；悲观情景则会很快出现：如果 Symbotic 仍是主要证据点，AI 数据中心项目仍主要停留在叙事，或融资条款对新普通股投资人的压制超过表面估值所暗示。
