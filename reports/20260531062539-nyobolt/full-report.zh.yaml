        - 下一次重大融资前，或下一轮刷新周期前，没有第二个具名量产客户
        - 不要仅凭伙伴集中押注高溢价倍数扩张
      - - 下游 Walmart / GreenBox 依赖
        - 穿透式集中度披露
        - 管理层无法量化与 Symbotic 绑定的收入敞口或配套率
        - 将收入质量上行视为未证实，并放宽下行情景
      - - 认证广度与产品准备度
        - 按产品线划分的认证矩阵
        - 电池包、车辆或数据中心系统没有可见路径取得更广批准
        - 暂停任何快速垂直扩张假设
      - - 试点到规模化转换
        - 良率、报废、保修和吞吐 KPI
        - 没有披露制造 KPI 包，或没有稳定商业产出的证据
        - 从增长承销转为仅尽调 / 回避
      - - 铌供应集中
        - 供应多元化
        - 铌投入没有第二来源认证、长期协议或库存策略
        - 下调与快速规模化绑定的产能和利润率假设
      - - 数据中心转向执行
        - 付费部署证据
        - Rajasthan 或同等项目仍停留在 MoU 阶段，没有已投运、与收入绑定的部署
        - 从基准情景剔除数据中心上行
    notes: 这些是投资否决标准，不是公司运营目标；它们聚焦于在承销激进上行前，需要看到的最低公开或仅尽调证据。
