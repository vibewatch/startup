      - number: '2.2'
        title: 宽口径 TAM 背景与受限近期 SAM
        blocks:
          - type: paragraph
            body: >-
              公开市场数据足以支撑一个很大的背景性机会，但支撑不了一个干净的 Nyobolt TAM 数字。Mordor 预计 2026 年仓储自动化市场为 $34.17 billion，工业电池市场为 $41.93
              billion；Grand View Research 估计数据中心 UPS 市场 2024 年为 $4.04 billion，到 2030 年增至 $6.27 billion。这些数字合起来形成超过 $80
              billion 的总相邻天花板，但口径年份混杂、不能相加，而且严重夸大 Nyobolt 实际能销售进去的范围。更有用的视角，是收窄到这些市场内部的电池和电源子系统。Geekplus 的 Hong Kong
              申报文件说明边界一收紧，细分市场会小很多：尽管更宽的仓储拣选自动化市场大得多，2024 年全球 ACR 解决方案也只有 RMB4.4
              billion。用明确的仓储电池内容附着率假设、对牵引动力电池支出打折后的份额，以及 UPS 预算中的机架级切片，得到的受限 SAM 大约在 $4 billion 到 $15
              billion。这个区间置信度仍低，但比把每套仓储系统、每个工业电池项目或每座数据中心建设都当成 Nyobolt 直接收入机会更能支持决策。
