  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调事项
    rows:
      - - 电商和劳动力压力让仓库自动化需求保持高位
        - 驱动因素
        - 当前-2031
        - 正常运行时间和吞吐量决定 ROI 的场景，会支撑 AMR 电池需求
        - 验证哪些客户垂直行业会为正常运行时间提升付费升级电池
      - - 机会充电和取消电池室改善仓库经济性
        - 驱动因素
        - 当前
        - 如果部署说法在生产中站得住，会强化 Nyobolt 的仓库切入点
        - 要求按客户提供部署前后吞吐量、车队规模和充电器数量数据
      - - 工业电动化和锂离子成本下降扩大牵引动力预算
        - 驱动因素
        - 当前-2031
        - 即便脱离 EV 热潮，工业电池切入点仍有投资价值
        - 测试 Nyobolt 相比标准锂离子电池包能否守住溢价
      - - 更高密度 AI 机架需要稳定电能质量和备份
        - 驱动因素
        - 当前-2030
        - 瞬态电力事件痛点清晰，会创造愿意付高价的预算方
        - 要求看到付费试点证据，而不只是 MOU 或设计定点
      - - 电池消防安全和认证标准拖慢采用
        - 约束
        - 持续
        - 即使 ROI 有吸引力，也会给仓库和数据中心部署增加阻力
        - 审核认证、责任分配和客户认证周期
      - - 铌供应集中度和成本结构很关键
        - 约束
        - 持续
        - 如果需求快速放大，可能压住利润率或带来采购风险
        - 梳理铌采购、加工和长期供应协议
      - - 替代快充化学体系也在放量
        - 约束
        - 当前-2028
        - Nyobolt 必须靠系统性能竞争，不能只靠化学体系新颖
        - 对标 Echion、StoreDot、Sila、Group14 以及现有锂离子方案
      - - 新型电池规模化仍然烧钱且容易失败
        - 约束
        - 当前
        - 即使终端市场有吸引力，也会抬高执行风险
        - 检查各细分市场的现金需求、制造路线图和有客户背书的需求
    notes: 本表把有来源支撑的市场驱动因素与执行约束放在一起；关键尽调问题是哪些细分市场能最快把 技术优势转成可重复的付费部署。
