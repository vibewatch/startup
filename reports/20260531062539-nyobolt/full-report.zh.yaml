  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与排除项
        blocks:
          - type: paragraph
            body: >-
              不应把 Nyobolt
              当成通用电池公司，也不应把它视为押注所有电气化支出。它的官方定位更窄，也更有分析价值：为关键可用性场景提供高功率集成能源系统；在这些场景里，停机、充电延迟或瞬态电力不稳定都会带来真实运营成本。落到本章，范围包括三类市场：仓储机器人和
              AMR 车队、工业牵引电源和其他停机敏感电池应用，以及更接近机架级备电或电能质量管理、而非整座设施电气系统的 AI
              数据中心电源模组。同一批来源也把排除项说清楚了。宽口径仓储自动化数字包括输送机、AS/RS、软件和集成服务；工业电池数字包括电信备电、电网储能和通用牵引动力；数据中心叙事又常把机架级电源模组与总建设资本开支混在一起。因此，即便乘用
              EV 电池包、消费电子和通用仓储软件落在更宽的电池或自动化类别里，也不属于 Nyobolt 现实可服务市场。估值时正确的分析动作，是先把相邻市场和真正可触达支出拆开，再使用任何 TAM 标题。
