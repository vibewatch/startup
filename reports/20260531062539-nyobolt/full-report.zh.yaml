  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Nyobolt 公开客户旅程是一种问题驱动的工程销售：从在线时间痛点开始，进入工况周期验证，之后才变成生产或改造项目。
    data:
      items:
        - label: 识别在线时间痛点
          stage: 问题定义
          actors:
            - OEM / 集成商
            - 仓库运营商或基础设施买方
            - 采购 / 战略
          touchpoints:
            - 细分市场页面
            - 行业文章
            - 销售触达
          emotion: 买方兴趣由高昂停机成本、换电摩擦或电网不稳触发，而不只是化学体系新颖。
        - label: 技术评估
          stage: 资格验证
          actors:
            - 应用工程师
            - 客户工程团队
            - 站点运营
          touchpoints:
            - 工况周期建模
            - 电芯 / 电池包集成
            - 电力和热验证
          emotion: 销售变得证据密集，因为在线时间关键系统需要真实运行证据，不能只靠实验室指标。
        - label: 生产或试点部署
          stage: 初始上线使用
          actors:
            - 现场运营
            - 制造 / 仓储团队
            - 维护
          touchpoints:
            - 有限量产
            - 现场调试投运
            - 性能监控
          emotion: 只有电池扛过真实工作流压力、并拿出清晰运营结果后，具名证明才会出现。
        - label: 扩张和重复使用
          stage: 规模化
          actors:
            - 采购
            - 财务
            - 客户战略负责人
          touchpoints:
            - 改装路径
            - 新生产部署
            - 相邻垂直领域扩张
          emotion: 即使续约指标仍未公开，只要客户加深投入，或扩大存量设备兼容范围，重复使用信心就能看见。
