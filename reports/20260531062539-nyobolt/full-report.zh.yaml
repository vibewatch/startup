  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与用户工作流
        blocks:
          - type: paragraph
            body: >-
              Nyobolt 展示的不是单一电池
              SKU，更像是为高耗电机器打造的分层可用性平台。从主页、方案页到产品页，公司一贯描述集成能源系统，覆盖自研负极材料、电芯、电池包、电池管理软件、电力电子、充电器和应用工程。可见商业界面分成三个主要产品家族。第一，仓储机器人和人形机器人项目围绕机会充电和连续运行销售，最强公开验证来自
              Symbotic 的仓储机器人。第二，AI 数据中心产品是机架级 Dynamic Response System，定位为 GPU
              机架和电网瞬态的浪涌稳定器加内置备电储备。第三，商用车页面瞄准公交、配送车队、重卡、叉车、港口或工程设备等停机和更换周期主导经济性的场景。工作流逻辑可信，因为它从用户任务出发，而不是抽象化学：机器人需要短充电窗口且无需换电，数据中心需要毫秒级响应和桥接电源，车队需要在不牺牲循环寿命的情况下补能。即便如此，披露深度并不均衡。机器人通过
              Symbotic
              拿到了具名部署验证和充电器向后兼容主张。数据中心和车辆页面更偏营销，问题定义清楚，但具名真实项目很少。这种不对称很重要，因为它意味着最具体的产品成熟度仍在工业机器人，而数据中心和商用车的更宽平台叙事领先于公开运营证据。
