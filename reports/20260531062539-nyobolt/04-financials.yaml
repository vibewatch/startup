      "id": "traction-and-unit-economics-proxies",
      "title": "Traction and unit-economics proxies",
      "body": "Public unit-economics evidence is still proxy-level, but the proxy set is commercially relevant. The clearest buyer value drivers are minutes saved, uptime preserved, spare assets avoided, and replacement cycles deferred. Symbotic said the Nyobolt upgrade gives SymBot robots six times more energy capacity, a 40% lighter power unit, and at least 10x the cycle life of traditional lithium-ion, while Nyobolt's own grid and vehicle pages repeatedly tie fast charge and long cycle life to fewer swaps, lower dummy-load losses, lower fleet size, and lower total cost of ownership. Nyobolt also cites 10-80% charging in 4 minutes 37 seconds on 350kW infrastructure and over 4,000 rapid cycles on its prototype, while the grid page claims over 80% capacity retention after 20,000 rapid cycles. Those are meaningful commercial signals for robots, grids, and fleets that charge many times per day. They do not, however, substitute for disclosed unit margin. There is still no public ASP by vertical, bill-of-materials disclosure, warranty-reserve data, gross-margin bridge, CAC/payback math, or customer concentration disclosure. The external market context is also mixed: large end markets exist, but falling industrial battery pack prices imply future pricing pressure unless Nyobolt's performance premium proves durable in real deployments.",
