    "number": 4,
    "title": "Financials",
    "summary": "Nyobolt's public financial picture has improved from a January 2025 cash-crunch scare to an April 2025 $30 million raise and a May 2026 $60 million Series C at a $1 billion valuation, with official claims of more than $9 million of 2024 revenue, more than $150 million of contracted value, and 5x year-on-year revenue growth. Revenue quality is better than a typical lab-stage battery startup because Symbotic is both a deployer and investor, but the business still looks capital-intensive: public sources show manufacturing scale-up, recurring equity issuance, and material disclosure gaps around realized pricing, gross margin, burn, and customer concentration."
  },
  "sections": [
