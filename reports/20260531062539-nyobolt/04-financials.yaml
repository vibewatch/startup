      "id": "capital-intensity-and-adequacy",
      "title": "Capital intensity and adequacy",
      "body": "Nyobolt's capital needs are plainly real. The July 2024 BAT assessment shows the company seeking an environmental permit for a Haverhill pilot facility that can make up to 900 tonnes of anode material per year, or 2.5 tonnes per day, using niobium pentoxide and tungsten trioxide with dedicated filtration, water management, and waste handling. The January 2024 certification release moved the company into production-ready pouch cells and pack production for customer programs, so capital demands span materials processing, cell qualification, packs, and application-specific integration rather than just licensing a chemistry. That operating profile helps explain the January 2025 stress signal: both electrive and BusinessCloud reported that Nyobolt had warned it could run out of cash by late Q1 2025, and electrive cited 2023 accounts showing a £20 million loss on only £67,000 of revenue. Subsequent financings appear to have stabilized the company: April 2025 official materials announced a $30 million round, and May 2026 official materials announced a $60 million Series C. But the current public record still does not disclose current cash on hand, monthly burn, debt, working-capital swing, or runway months, so capital adequacy can only be inferred from fundraising cadence rather than underwritten directly.",
