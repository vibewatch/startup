    {
      "id": "contradictions-and-gaps",
      "title": "Contradictory Estimates and the Remaining Diligence Gaps",
      "body": "The main contradiction in Nyobolt's market work is not that sources disagree wildly on whether these sectors are growing; it is that they measure different layers of the stack. Broad warehouse automation figures, industrial battery totals, UPS market estimates, and ACR-specific filings can all be true at once while implying very different opportunity sizes for Nyobolt. Averaging them would be analytically wrong because the units, system boundaries, and spend layers do not match. That leaves three diligence gaps standing. First, public evidence does not isolate battery or power attach rates inside warehouse automation budgets. Second, public evidence does not break out rack-level AI power modules from total UPS or facility electrical spend. Third, there is no public disclosure of Nyobolt pricing, qualified pipeline, installed-base retrofit counts, or segment win rates—so a true bottom-up SOM cannot be defended from open sources alone. The implication for diligence is practical: treat the company as operating in attractive and growing adjacent markets, but do not underwrite a precision market model until management provides BOM-level spend shares, customer concentration by segment, and a pipeline conversion view for retrofits, industrial fleets, and rack-level data-centre power.",
