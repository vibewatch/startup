    "number": 2,
    "title": "Market Analysis",
    "summary": "Nyobolt operates across three adjacent but non-identical markets: warehouse robotics and AMR power systems, industrial high-power batteries, and rack-level AI data-centre power. Public sources support a very large contextual ceiling above $80 billion, but a more decision-useful constrained SAM is closer to roughly $4 billion-$15 billion once non-addressable spend, buyer channels, and product form factor are stripped out. The chapter's biggest diligence gap is not market growth but the lack of public attach-rate, pricing, and pipeline data needed to translate those markets into a credible bottom-up SOM."
  },
