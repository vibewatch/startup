    {
      "id": "buyers-budget-owners",
      "title": "Buyer, User, Payer, and Adoption Path by Segment",
      "body": "The buyer map differs sharply by segment, and that matters because Nyobolt often sells into platform channels rather than directly to the final asset operator. In warehouse robotics, the user is typically a site operations or automation team, but the immediate buyer can be an OEM or systems integrator that owns platform design, warranties, and retrofit programs. The Symbotic relationship is the clearest proof point: Nyobolt's batteries were positioned as an upgrade for SymBot robots and explicitly designed for retrofit into existing customer systems, which means brownfield installed bases can matter as much as new greenfield warehouses. Public filings from Geekplus and the Dematic-Hai partnership point in the same direction—warehouse automation buyers prefer integrated solutions with service, documentation, spare-parts, and multi-phase rollout paths. In industrial batteries, the economic buyer is more likely a fleet, OEM, or asset owner optimizing total cost of ownership and downtime. In AI data-centre power, the core user is infrastructure or power engineering, while the economic buyer sits with the operator, colocation provider, or hyperscaler protecting GPU utilization and uptime commitments. Across all three segments, Nyobolt adoption depends on a chain of technical fit, qualification, and budget sign-off rather than a simple cell purchase.",
