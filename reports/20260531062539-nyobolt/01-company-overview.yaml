- "id": "milestones-and-adverse"
  "title": "Milestones, Manufacturing Progress, and Adverse Signals"
  "body": "The company's public chronology shows a clear shift from chemistry breakthrough to commercialization. Academic roots stretch back to at least 2016, the company ties a core battery breakthrough to 2018, and legal incorporation followed in 2019. Financing milestones came in 2021, 2022, 2025, and 2026, while product and manufacturing markers include the July 2023 Lotus Elise-based demo, January 2024 UN38.3 certification for production-ready cells, and a July 2024 BAT assessment for a Haverhill anode-material pilot facility targeting up to 900 tonnes per year. Commercial proof accelerated again in September 2025 when Symbotic and Nyobolt disclosed upgraded battery hardware for SymBot autonomous mobile robots, and the 2026 Series C announcement added a Rajasthan memorandum covering more than 100MW of off-grid AI data-centre infrastructure. The clearest adverse item in the public record is the early-2025 cash-runway scare: BusinessCloud and electrive both reported that Nyobolt had warned\
    \ it could run out of cash by late Q1 2025, and electrive cited 2023 accounts showing a £20 million loss on only £67,000 of revenue. The follow-on financings and Series C suggest the company recovered, but that episode matters because it shows this is still a capital-intensive scale-up rather than a fully self-funding platform."
