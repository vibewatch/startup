summary:
  headline: 继续研究：Nyobolt 已有可信产品验证、Symbotic 战略背书和明确商业动能；但在收入、毛利、客户集中度和优先股条款缺口补齐之前，2026 年 5 月的 $1B 估值仍显偏高。
