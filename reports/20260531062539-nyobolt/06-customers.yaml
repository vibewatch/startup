    {
      "id": "concentration-risk-and-underwriting-gaps",
      "title": "Concentration risk and underwriting gaps",
      "body": "The biggest customer risk is not that Nyobolt lacks any real customer proof; it is that the proof is narrow. Symbotic appears genuine and strategically important, but public named-customer breadth beyond that relationship remains sparse. That already creates obvious single-customer concentration risk at Nyobolt’s level. The risk intensifies one level downstream because third-party coverage says more than 84% of Symbotic’s fiscal 2025 revenue came from Walmart and that the vast majority of its $22.5 billion backlog was tied to Walmart and GreenBox. Symbotic’s own Walmart agreement also points to very large APD and backlog opportunity, which is positive for volume potential but confirms that Nyobolt’s most visible route to scale is linked to one customer relationship that is itself highly concentrated. In other words, Nyobolt’s strongest public proof point is real, but it is neither broad nor diversified. Investors should therefore underwrite the customer chapter as a strong single-reference case with encouraging expansion proxies, not as evidence of a broad installed base. The critical diligence asks are straightforward: exact customer count, revenue mix by customer and segment, contract duration, shipped or retrofit volumes at Symbotic, the identity and stage of the humanoid developer program, and signed commercial terms for Rajasthan or any other data-centre deployments.",
