    {
      "id": "repeat-usage-retention-proxies-and-satisfaction",
      "title": "Repeat-usage, retention proxies, and satisfaction",
      "body": "Public durability evidence exists, but mostly as proxy rather than as hard SaaS-style retention metrics. The most concrete repeat-use signal is architecture-related: Symbotic said the new battery pack is retrofit-compatible with previous-generation SymBot robots and backward-compatible with the installed charging base, which creates a visible installed-base expansion path rather than a single-program battery swap. The second proxy is commercial behavior. Symbotic did not merely issue a press release; it led Nyobolt’s Series C and publicly described the technology as a key enabler of uptime and efficiency for Symbotic’s own customers. The third proxy is operating scale at the partner level: Symbotic said total systems in deployment rose to 70 in Q2 FY2026 and that customers across several verticals are realizing value from its automation systems. Those are useful signs, but they are not substitutes for renewals, contract duration, NRR, GRR, churn, attach rates, or segment-level expansion spend. No public source reviewed here discloses those metrics. The result is a chapter where customer satisfaction has real qualitative proof, while customer durability still depends on inference from deployment progression, compatibility, and strategic reinvestment rather than direct retention disclosure.",
