    "number": 6,
    "title": "Customers",
    "summary": "Nyobolt’s customer story is strongest where warehouse-automation proof becomes concrete: Symbotic publicly disclosed limited production from June 2025, broader rollout intent from September 2025, retrofit compatibility, and later led Nyobolt’s 2026 Series C. The weakness is breadth and durability disclosure: outside Symbotic the main public signals are an unnamed humanoid developer and a Rajasthan MoU, while customer count, renewal metrics, and revenue mix remain undisclosed, leaving concentration risk materially higher than the broad segment narrative implies."
