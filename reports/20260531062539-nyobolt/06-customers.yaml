      "id": "adoption-trajectory-and-named-proof",
      "title": "Adoption trajectory and named proof",
      "body": "The only high-confidence named production proof in the reviewed record is Symbotic. Nyobolt’s April 2024 release already claimed deployments in AI warehouses and heavy-duty vehicles plus more than $150 million of contract value, but those disclosures did not name customers. The evidence quality improves sharply in September 2025, when both Nyobolt and Symbotic said Symbotic had been using the technology in limited production since June 2025 and expected to incorporate it more broadly into new SymBot production from September. Those releases also disclosed operationally meaningful deltas: six times more energy capacity, 40% lighter weight, and at least ten times the cycle life. Independent May 2026 coverage consistently reinforces the same hierarchy of proof: Symbotic is the customer relationship that underwrites the round, while the next disclosed expansion signals are a leading but unnamed humanoid developer and an announced Rajasthan data-centre MoU. That means the adoption trajectory is real, but it is still heavily anchored on one named customer relationship and a small number of adjacent, earlier-stage proof points rather than a broad roster of public customer logos with comparable deployment detail.",
