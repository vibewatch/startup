      "id": "customer-segmentation-and-demand-surfaces",
      "title": "Customer segmentation and demand surfaces",
      "body": "Nyobolt’s public customer map is much broader than its named-customer list. The reviewed official pages describe three primary buying surfaces. First is physical AI and warehouse automation, where the company pitches batteries to robot OEMs, integrators, and warehouse operators that care about uptime, swap avoidance, and throughput. Second is AI data-centre power, where the buyer is less a battery purchaser than a data-centre operator, infrastructure developer, or grid-facing energy manager that needs rack-level surge stabilisation, peak shaving, and backup power. Third is mobility and heavy-duty industry, spanning buses, delivery fleets, trucks, forklifts, port equipment, construction equipment, mining haul trucks, and adjacent autonomous-vehicle programs. Market context supports why these surfaces matter: warehouse automation is already a multi-decade growth market led by North America, while data-centre backup and power-management demand is expanding as GPU-heavy facilities stress the grid. The underwriting caveat is that breadth of marketed surfaces is not the same as breadth of proven customers. Public evidence is strongest for warehouse robotics, materially thinner for data centres, and largely marketing-led for commercial vehicles and off-highway segments.",
