summary:
  headline: >-
    Research-more: Nyobolt has credible product proof, strategic validation from Symbotic, and clear commercial
    momentum, but the May 2026 $1B valuation still looks stretched until diligence closes the revenue, margin,
    concentration, and preference-term gaps.
