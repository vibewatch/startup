      missingEvidence: "No MLPerf Inference Datacenter submission from Rebellions as of May 2026; no public benchmark comparing REBEL-Quad or ATOM-Max against H100, MI300X, or Gaudi 3 under a shared independent methodology."
      whyItMatters: "MLPerf is the primary independent benchmark for enterprise AI hardware purchasing decisions. The absence prevents meaningful third-party performance comparison and may signal that Rebellions' results under standard conditions are not yet competitive with leading GPU alternatives."
      diligencePath: "Request NDA benchmark package from Rebellions: MLPerf-format results or equivalent. Commission independent throughput and latency testing against H100 SXM5 on representative LLM workloads (LLaMA 3.1 70B, LLaMA 3.1 405B, Mixtral 8x22B)."
