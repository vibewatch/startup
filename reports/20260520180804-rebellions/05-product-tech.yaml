callouts:
  - id: KE001
    calloutType: strength
    title: "UCIe-Advanced Chiplet Architecture — First Public Production AI Chip"
    body: >
      The REBEL-Quad's use of UCIe-Advanced die-to-die interconnect at 16 Gbps, independently confirmed by ServeTheHome
      at Hot Chips 2025, positions Rebellions as the first AI chip company to publicly market and demonstrate running
      silicon using UCIe-Advanced packaging. This is a genuine architectural first-mover claim, not a roadmap item.
      The ISSCC 2026 peer-reviewed paper provides credible performance anchoring at 56.8 TPS on LLaMA v3.3 70B —
      the strongest form of performance evidence a hardware startup can provide.
    claimRefs:
      - CE008
      - CE010
      - CE011

  - id: KE002
    calloutType: strength
    title: "Software Integration Tier — vLLM Official Support and Red Hat Certification"
    body: >
      Rebellions' NPU is listed in the official vLLM documentation alongside Google Cloud TPU, Intel Gaudi, and AMD
      Instinct, granting it the same first-class integration tier as more established alternatives. The Red Hat
      OpenShift AI certification of NPU Operator v0.4.0 enables enterprise Kubernetes deployments without custom
      integration work. The availability of vllm-rbln on the public PyPI index (not just a proprietary mirror) lowers
      the barrier for developer adoption and signals supply-side confidence in the software product.
    claimRefs:
      - CE018
      - CE021
      - CE017

  - id: KE003
    calloutType: risk
    title: "Single-Vendor Samsung Supply Chain — Logic, HBM, and Packaging"
    body: >
      Rebellions' REBEL-Quad product is entirely dependent on Samsung for all three critical supply inputs: 4nm SF4X
      logic fabrication, HBM3E memory stacks, and CoWoS-S advanced packaging. This single-vendor concentration is
      structurally unusual even by fabless semiconductor standards, where most companies use at least two suppliers
      across memory and logic. Any Samsung-side capacity disruption, yield crisis, or commercial dispute would halt
      REBEL-Quad supply with no disclosed alternative. The fact that Samsung is also a strategic investor creates
      alignment but does not eliminate supply risk, and could impede Rebellions' ability to negotiate at arm's length
      on pricing or capacity allocation.
    claimRefs:
      - CE026

  - id: KE004
    calloutType: risk
    title: "No MLPerf Submission — Benchmark Transparency Gap"
    body: >
      As of May 2026, Rebellions has not submitted results to MLCommons MLPerf Inference Datacenter benchmarks —
      the primary independent AI inference benchmark used by hyperscalers and enterprise buyers for competitive
      evaluation. All major accelerator competitors (NVIDIA, AMD, Intel, Google, Qualcomm) participate. The absence
      of MLPerf data means that investors and prospective customers cannot independently compare Rebellions'
      performance against H100, MI300X, or Gaudi 3 using a shared methodology. Company-cited perf/watt numbers
      and TTA certifications (a Korean national body) do not substitute for the reproducible, third-party scrutiny
      of MLPerf. This gap is a diligence priority and a potential signal that REBEL-Quad benchmark results under
      standard MLPerf conditions may not yet be competitive.
    claimRefs:
      - CE024
      - CE025

  - id: KE005
    calloutType: risk
    title: "RebelRack/RebelPOD Availability Discrepancy"
    body: >
      The March 30, 2026 press release and investor communications announced RebelRack and RebelPOD as "available
      now" for customer deployment. However, as of the May 2026 research date, the Rebellions website shows both
      products as "Coming Soon" in the navigation. This discrepancy is an adverse signal on production readiness:
      either the products were announced before supply was confirmed, or the website was not updated to reflect
      availability. Either interpretation warrants diligence attention — specifically confirming with Rebellions
      whether any customer has taken delivery of a RebelRack or RebelPOD system.
    claimRefs:
      - CE014
      - CE015

  - id: KE006
    calloutType: recommendation
    title: "Priority Diligence Items for Technical Due Diligence"
    body: >
      Key technical diligence items: (1) Request MLPerf Inference Datacenter submission roadmap and any NDA
      benchmark data for REBEL-Quad vs H100/MI300X under standard workloads. (2) Confirm RebelRack/RebelPOD
      delivery status — obtain customer purchase orders or delivery confirmations. (3) Commission independent
      benchmark testing of ATOM-Max vs GPU baseline using a shared methodology, not TTA or company collateral.
      (4) Review vllm-rbln roadmap for speculative decoding and distributed KV cache — timeline and gating
      dependencies matter for enterprise multi-node serving viability. (5) Assess Samsung supply contract terms:
      capacity reservation, pricing, and alternate supplier exploration.
    claimRefs:
      - CE015
      - CE024
      - CE026
      - CE019

