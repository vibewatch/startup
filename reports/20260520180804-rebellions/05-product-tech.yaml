  - id: performance-benchmarks-risks
    title: Performance Evidence, Benchmark Gaps, and Technology Risks
    body: >
      The strongest independent performance evidence for Rebellions hardware is the ISSCC 2026 peer-reviewed paper
      for REBEL-Quad (56.8 TPS on LLaMA v3.3 70B at 2k/2k sequences), supplemented by the Hot Chips 2025 live
      demo observed by trade press including ServeTheHome. For ATOM Gen 1, all performance-per-watt claims are
      company-cited or certified by TTA (Telecommunications Technology Association, a Korean certification body):
      the 2.7× TPS/Watt advantage over GPU at Mongolia customs and the 2× performance-per-watt at UAE ECOPEACE
      are presented by Rebellions without independently published benchmark methodology. As of May 2026, Rebellions
      has made no submission to MLPerf Inference Datacenter benchmarks on mlcommons.org. MLPerf is the industry's
      primary third-party inference benchmark and is published by all major competitors (NVIDIA, AMD, Google,
      Intel). The absence of MLPerf data makes independent performance comparison to H100, MI300X, and Gaudi 3
      impossible from public sources.


      The REBEL-Quad's dual PCIe Gen5 x16 host interface is noted as potentially lagging NVIDIA's GB300, which
      targets PCIe Gen6 connectivity, representing a generational difference in host I/O bandwidth if customer
      workloads are bottlenecked at the host interface. On the software side, vllm-rbln lacks speculative
      decoding, distributed KV cache, and prefill/decode disaggregation — features now standard in GPU vLLM
      deployments that enable cost-optimised hybrid serving architectures at scale. The RebelRack and RebelPOD
      systems were announced as "available now" in a March 30, 2026 press release and investor communication,
      yet the Rebellions website navigation shows these products as "Coming Soon" as of the May 2026 research
      date, creating an unresolved discrepancy that constitutes an adverse signal on production readiness. The
      RSD (Rebellions Scalable Design) framework enables tensor-parallel inference across configurations from
      a single card (128 TFLOPS FP16 / 64 GB) to a configurable rack system (512–7168 TFLOPS FP16, 256 GB–
      3.5 TB GDDR6), supporting Ubuntu, RHEL, Kubernetes, and OpenStack.
