  - id: manufacturing-supply-chain
    title: Manufacturing, Supply Chain, and Strategic Partnerships
    body: >
      Rebellions' silicon supply chain is concentrated at Samsung. The REBEL-Quad uses Samsung Foundry's 4nm SF4X
      process for logic, Samsung's HBM3E for memory (four 36 GB stacks per package), and Samsung's CoWoS-S
      interposer for advanced packaging. This single-vendor arrangement for all three critical supply inputs
      (logic, memory, packaging) represents a structural concentration risk: any Samsung Foundry capacity
      disruption, HBM3E yield problem, or packaging bottleneck directly constrains Rebellions' product supply
      with no disclosed alternative source. The ATOM-Max product family uses GDDR6 memory (sourced separately),
      which reduces this risk for the Gen 1 product line, but the full REBEL-Quad supply chain is Samsung-only.


      The UCIe-Advanced chiplet interconnect IP in REBEL-Quad is supplied by Alphawave Semi, a Canadian
      semiconductor IP company that specialises in high-speed wired connectivity. The Alphawave IP enables
      16 Gbps per-lane die-to-die bandwidth within the REBEL-Quad package. Rebellions joined Arm's Total Design
      ecosystem in October 2025, signalling planned integration of Arm's Neoverse compute subsystem (CSS) into
      a future Rebellions AGI CPU product. Arm also made a strategic investment in Rebellions' $250M Series C
      (December 2024). Red Hat became an ecosystem partner in December 2025 with the OpenShift AI certification,
      enabling enterprise Kubernetes deployments on Rebellions hardware. SK Telecom is engaged in sovereign AI
      datacenter validation and co-development announced in April 2026. Samsung is co-investor (via Samsung
      Securities) and foundry, creating a tight alignment between supply chain and strategic capital but
      concentrating leverage at a single counterparty.
