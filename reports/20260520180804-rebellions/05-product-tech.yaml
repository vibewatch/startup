chapter:
  number: 5
  title: Product and Technology
  summary: >-
    Rebellions delivers a two-generation AI inference accelerator portfolio: the ATOM Gen 1 (shipping since H1 2024),
    a GDDR6-based multi-die-package NPU card rated 128 TFLOPS FP16 / 512 TOPS INT8 per 350 W card, deployed in UAE,
    Mongolia, Saudi Arabia, and Japan; and the REBEL Gen 2 / REBEL-Quad, a quad-chiplet 4nm Samsung Foundry part with
    144 GB HBM3E at 4.8 TB/s and UCIe-Advanced die-to-die interconnect, peer-reviewed at ISSCC 2026 at 56.8 TPS on
    LLaMA v3.3 70B. The software layer (RBLN SDK v0.10.3, May 2026) integrates with vLLM v0.18.0 via a published PyPI
    package and is listed as supported hardware in the official vLLM documentation. Key strengths include the
    peer-reviewed ISSCC performance result, the UCIe-Advanced chiplet architecture (first production AI chip to market
    it publicly), and Red Hat OpenShift AI certification. Key risks include single-vendor foundry dependence on Samsung
    for logic, HBM3E, and packaging; absence of MLPerf benchmark submissions as of May 2026; missing GPU-parity
    features in vllm-rbln (speculative decoding, distributed KV cache, prefill/decode disaggregation); and a
    documented discrepancy between the March 2026 "available now" press release for RebelRack/RebelPOD and the website
    "Coming Soon" tag.

sections:
  - id: product-portfolio-overview
    title: Product Portfolio and Customer Workflow Overview
    body: >
      Rebellions offers two generations of AI inference accelerator hardware, sold as cards, servers, and rack-scale
      systems, supported by a proprietary software stack. The first generation (ATOM) is based on a custom inference
      NPU SoC fabricated on a legacy process node, packaged in a multi-die configuration with GDDR6 memory. The second
      generation (REBEL / REBEL-Quad) is fabricated on Samsung 4nm SF4X, uses a quad-chiplet architecture with
      UCIe-Advanced die-to-die interconnect, and mounts HBM3E memory via Samsung CoWoS-S advanced packaging. Products
      are sold at four form factors: accelerator card (PCIe-attached), accelerator server (rack-mount server with
      multiple cards), mini-POD (multi-server cluster), and rack-scale system (RebelRack/RebelPOD). Rebellions also
      produces two single-chip ATOM variants for lower-power deployments: the RBLN-CA21 (<75 W, no external power
      connector) and the RBLN-CA22 (up to 90 W).


      The customer workflow begins with model preparation using the RBLN Compiler (part of the RBLN SDK), which
      converts PyTorch or TensorFlow models to the Rebellions runtime format. Models are then deployed on ATOM-Max
      or RebelServer hardware, either directly via the RBLN Runtime API or through a vLLM-compatible interface using
      the vllm-rbln Python package. Kubernetes integration is provided via the Rebellions NPU Operator (certified for
      Red Hat OpenShift AI as of December 2025) and Helm charts distributed via OCI registry. The Rebellions model
      zoo lists 300+ supported PyTorch/TensorFlow models, spanning LLMs, vision transformers, and classical inference
      workloads. For enterprise customers, workloads run on the ATOM-Max Server (4U, 8-card, Ubuntu/RHEL/AlmaLinux)
      or RebelServer (5U, 8-card, AMD EPYC 9355 host CPUs, 400G networking). Rack-scale customers can use the
      ATOM-Max POD (8-server mini-cluster, 400 GB/s RDMA fabric) or the newly launched RebelRack/RebelPOD
      announced in March 2026.
