  - id: section-korean-sovereign-ai
    title: Korean sovereign AI market — policy, telco procurement, and Rebellions' domestic positioning
    body: >
      Korea's sovereign AI chip initiative is the most important near-term demand vector for Rebellions.
      The policy context is explicit: Korea's government identified domestic AI semiconductor development as
      a national strategic priority, with Ministry of Science and ICT backing. SK Telecom formalized this
      policy into a commercial contract by partnering with Rebellions and Arm to co-develop sovereign AI
      inference chips targeting SKT's own data center infrastructure. The HPCwire and Convergedigest coverage
      of this initiative describes it as positioning Rebellions silicon as the inference layer for Korean
      sovereign AI telco data centers. SKT filed a formal press release confirming the partnership.


      The Korean market's structural advantage for Rebellions is vertical integration: Samsung Electronics
      serves as both foundry partner (manufacturing Rebellions' chips) and strategic investor, while Samsung
      SDS is the dominant Korean cloud provider. SK Telecom is the strategic AI chip customer. This creates
      an unusually tight loop between chip design, manufacturing, cloud deployment, and AI workload owners
      that most AI chip startups outside the US do not have access to. NTT Docomo's participation extends
      this network to Japan, the second-largest AI chip market in Asia after China.


      The key diligence risk in the Korean sovereign AI segment is procurement pace. Policy announcements
      often precede actual hardware procurement by 12–24 months, and Korea's government AI investment
      timeline (planning versus committed contracts) is not fully disclosed in public sources reviewed.
      Rebellions has produced and shipped ATOM, REBEL, and REBELRACE chips, establishing production
      credibility, but the scale of sovereign AI chip orders actually placed by SKT versus announced
      as aspirational targets requires primary-source verification. The $250 million raise backed by Arm
      and Samsung (2025) and the $400 million pre-IPO round (2026) suggest investors believe revenue
      scale is achievable, but confirmed annual recurring revenue from sovereign AI contracts is not
      publicly disclosed.

