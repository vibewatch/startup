  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-size
      missingEvidence: "Independent analyst-published AI inference chip market size estimates (Gartner, IDC, McKinsey, Grand View Research) covering 2025–2028 with distinct inference vs. training market splits."
      whyItMatters: "Current sizing relies primarily on Nvidia's own revenue as a market proxy, which overstates the inference-specific TAM, includes non-inference revenue, and carries optimism bias. Multiple independent estimates would triangulate the market size and de-risk the sizing assumption."
      diligencePath: "Procure Gartner Magic Quadrant for AI Accelerators or Grand View Research AI Chip Market report; alternatively mine IDC press releases on AI chip market share accessible via prnewswire.com or idc.com public blog."
      relatedQuestionRefs:
        - QM003

    - type: access-blocked
      severity: material
      topic: sovereign-ai
      missingEvidence: "Korean Ministry of Science and ICT (MSIT) official budget, procurement timeline, and committed contract values for the National AI Semiconductor Initiative that underpins SKT's sovereign AI chip procurement mandate."
      whyItMatters: "The sovereign AI market is Rebellions' most important near-term revenue opportunity. Without confirmed government procurement budgets and timelines, the SOM estimate for Korean sovereign AI remains a first-order approximation rather than a contract-backed revenue forecast."
      diligencePath: "Access MSIT.go.kr official announcements; Korea.kr policy news; review SKT investor day materials or quarterly earnings calls for committed AI infrastructure investment data. Korean-language sources would be primary."
      relatedQuestionRefs:
        - QM012

    - type: private-evidence-only
      severity: material
      topic: competitive-dynamics
      missingEvidence: "Confirmed evidence of customer losses, failed pilot programs, or competitive displacement of Rebellions by other inference chip vendors (AMD, Intel, custom ASIC) in the Korean market."
      whyItMatters: "All publicly available information is Rebellions' own announcements (partnerships won, rounds raised). Disconfirming evidence about competitive setbacks — if any — is not disclosed. Investor due diligence should include primary interviews with Korean telco procurement teams and industry analysts familiar with the competitive landscape."
      diligencePath: "Primary interviews with SKT infrastructure team, KT cloud team, and Korean industry analysts. Review of SAPEON Korea's market position post-merger for any lost customer evidence."
      relatedQuestionRefs:
        - QM010

    - type: stale
      severity: minor
      topic: market-dynamics
      missingEvidence: "Current (2025–2026) split of AI compute workload between training and inference as a percentage of total AI chip revenue, and the trajectory of this split as generative AI scales."
      whyItMatters: "The inference vs. training workload split directly determines the serviceable addressable market for inference-only NPU vendors like Rebellions. If training remains dominant, Rebellions' SAM is smaller than assumed; if inference has crossed 50% of workload, the SAM is larger."
      diligencePath: "Seek SemiAnalysis, Bernstein, or Morgan Stanley AI chip reports; alternatively, use cloud provider AI service revenue growth as a proxy for inference scale vs. hyperscaler capex (training-dominated) data."
