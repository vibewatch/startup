chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The global AI accelerated compute market—proxied by Nvidia's FY2026 Compute & Networking revenue of $193.5
    billion (+67% YoY)—is the largest and fastest-growing segment in semiconductor history, driven by inference
    demand as generative AI shifts from training to production deployment. Rebellions targets the AI inference
    NPU sub-segment, where its Korean sovereign AI ecosystem (SK Telecom, Samsung Electronics, Arm, NTT Docomo)
    provides a uniquely integrated supply-chain, procurement, and policy-backed demand pathway unavailable to
    most non-US AI chip challengers, while CUDA lock-in and lack of third-party benchmarks remain the primary
    adoption constraints to watch.

sections:
  - id: section-market-boundary
    title: AI inference chip market — boundary, adjacencies, and status-quo substitutes
    body: >
      The market under analysis is the AI inference accelerator chip market: purpose-built silicon—NPUs, ASICs, and
      inference-optimized GPUs—deployed in data centers and edge environments to run trained neural networks at
      production scale. Included spend encompasses chip procurement, associated server platforms, and inference-
      specific software licensing. Excluded from this market boundary are: (a) general-purpose CPUs performing
      inference without AI acceleration, (b) training-dominated accelerators (Nvidia H100/H200 in training-only
      deployments), (c) AI networking chips (NVLink, InfiniBand), and (d) consumer-facing edge inference silicon
      (smartphone NPUs). The adjacent market—AI training accelerators—is the dominant spend category today but
      is tracked separately because Rebellions explicitly does not compete there.


      Nvidia's Compute & Networking segment revenue provides the best available proxy for the global AI accelerated
      compute market. In FY2026 (year ended January 25, 2026), Nvidia reported $193.5 billion in Compute &
      Networking revenue, up 67% from $115.9 billion in FY2025. Total Nvidia revenue was $215.9 billion (+65% YoY).
      While these figures span both training and inference workloads, industry consensus and Nvidia's own product
      roadmap indicate inference is the fastest-growing component: the launch of Blackwell Ultra for agentic AI
      and the Rubin successor platform (expected production H2 FY2027) both target inference efficiency and token
      throughput. The status-quo substitute for dedicated inference silicon is GPU-based inference on multi-purpose
      data center GPUs—still the dominant deployment mode in 2026—which Rebellions must displace on TCO and
      power-efficiency grounds. A second substitute is CPU-only inference for low-throughput workloads, which
      remains competitive at small batch sizes. The global AI inference chip market in CY2023 was approximately
      $34.3 billion (largely Nvidia GPU revenue), with Nvidia holding approximately 94% market share at that time.
      The market has expanded dramatically: Nvidia's FY2025 C&N revenue of $115.9 billion implies CY2024 total
      accelerated compute of $120–130 billion, dominated by Nvidia but with AMD MI300X and custom hyperscaler
      ASICs (Google TPUs, AWS Trainium/Inferentia) capturing growing fractions.

