  - id: section-buyer-segmentation
    title: Buyer, user, and payer segmentation — budget ownership and adoption path
    body: >
      The AI inference chip market segments along four primary buyer archetypes with distinct procurement
      patterns, budget authority, and AI chip adoption triggers.


      Hyperscalers (CSPs — AWS, Azure, GCP, plus emerging AI-native clouds) represent the largest procurement
      volume. They own or lease compute infrastructure and make multi-billion-dollar capex commitments annually
      to GPU and ASIC vendors. Nvidia explicitly identifies CSPs as its primary data center customers, with all
      major cloud providers using its platforms. Hyperscaler procurement is driven by model inference demand from
      enterprise API customers and consumer AI products. Budget authority sits with infrastructure/platform
      engineering divisions. Adoption trigger for alternative silicon is TCO and power-efficiency at scale.


      Telco operators (SK Telecom, KT, NTT Docomo, and international equivalents) constitute a strategically
      important segment for Rebellions. Telcos are building AI-native networks and deploying inference at the
      edge and in regional data centers. SK Telecom partnered with Rebellions and Arm to develop sovereign AI
      inference chips, establishing a formal telco procurement pathway. NTT Docomo innovations joined the
      Rebellions/SKT infrastructure partnership, signaling broader Asian telco interest. Telco AI chip budgets
      are typically governed by network technology and infrastructure procurement, with sovereign-AI policy
      creating a policy-linked budget category in Korea.


      Enterprise buyers (banks, healthcare, government agencies, manufacturing) adopt AI inference chips
      indirectly through cloud APIs or on-premises server procurement. Red Hat OpenShift AI certified
      Rebellions' NPU, opening a channel for enterprise on-premises inference deployment. Samsung Electronics'
      strategic investment and co-development partnership creates a pathway to Samsung affiliates as enterprise
      inference buyers.


      Korean domestic cloud providers (Samsung SDS, KT Cloud, NAVER Cloud) represent an important SAM segment.
      IDC data confirms Samsung SDS as the top Korean managed cloud provider (23.9% MSP share) and second-
      largest domestic CSP (11.0% share), making Samsung Group the dominant cloud buyer in Korea—with Samsung's
      investment in Rebellions creating a potential captive procurement relationship.

