  - id: section-drivers-constraints
    title: Growth drivers and adoption constraints — timing, budget, and valuation implications
    body: >
      The dominant AI inference market driver is hyperscaler capital expenditure commitments. Nvidia's 67%
      year-over-year C&N revenue growth in FY2026 confirms that cloud infrastructure buildout is the defining
      market engine. Training workloads initiated the GPU spending surge, but inference—running AI models for
      billions of end users—is driving the next leg of capex as generative AI shifts from development to
      production deployment. Epoch AI research documents that ML training costs grew at 0.49 orders of magnitude
      per year from 2009 to 2022, driving demand for more efficient inference silicon as models scale.


      A second structural driver is geopolitical supply risk. US export controls effectively foreclosed Nvidia
      from China's data center compute market by FY2026, per Nvidia's own 10-K filing. This creates demand for
      alternative chip suppliers in markets that prioritize AI supply-chain independence—including Korea and
      broader Asia-Pacific. Korea's sovereign AI chip policy, led by the Ministry of Science and ICT and
      reflected in SKT's procurement strategy with Rebellions, is a direct policy response to this dynamic.


      The primary adoption constraint is CUDA ecosystem lock-in. Nvidia's CUDA developer platform accumulated
      over a decade of model optimization, toolchain integration, and developer familiarity. Switching costs
      for existing GPU-inference workloads to an NPU alternative are material: teams must port model code,
      validate accuracy, and rebuild MLOps pipelines. Rebellions' RBLN SDK and Red Hat OpenShift AI integration
      address this constraint but have not yet demonstrated wide production migration at hyperscaler scale.
      A secondary constraint is power availability: data center power constraints are cited by Nvidia as a
      demand headwind, which paradoxically favors power-efficient alternatives like Rebellions' chiplets in
      constrained deployments. A third constraint is benchmark opacity: Rebellions' REBEL Quad chiplet (Hot
      Chips 2025) claimed breakthrough TPS/W performance but has not yet published independent third-party
      benchmark results as of the research date.

