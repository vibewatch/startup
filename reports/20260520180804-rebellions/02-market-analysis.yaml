callouts:
  - calloutType: strength
    title: "Vertically integrated Korean ecosystem support"
    body: >-
      Rebellions has achieved a rare combination: Samsung Electronics as foundry partner and strategic investor,
      SK Telecom as sovereign AI customer, Arm as co-development partner, NTT Docomo as an additional telco
      partner, and Red Hat for enterprise software integration. This multi-party ecosystem reduces key adoption
      risks (manufacturing, procurement, software) simultaneously — a structural advantage over most AI chip
      challengers outside the US.
    claimRefs:
      - CM015
      - CM026
      - CM030

  - calloutType: strength
    title: "Confirmed primary-tier revenue catalyst: SKT sovereign AI chip partnership"
    body: >-
      The SK Telecom / Rebellions / Arm sovereign AI chip partnership is the most concrete near-term revenue
      pathway disclosed. It converts Korean policy intent into a procurement relationship with Korea's largest
      telco, backed by Arm's technical co-development. This avoids the typical "policy announced but not
      funded" problem by embedding Rebellions in SKT's infrastructure roadmap.
    claimRefs:
      - CM012
      - CM024
      - CM026

  - calloutType: risk
    title: "CUDA switching-cost moat constrains hyperscaler adoption timeline"
    body: >-
      Nvidia's CUDA ecosystem represents a persistent adoption barrier for inference-only NPU vendors.
      Enterprise and hyperscaler customers have extensive model optimization pipelines built on CUDA that
      require significant re-engineering to migrate. Until Rebellions demonstrates production migrations at
      scale beyond the sovereign-AI telco segment, the TAM-to-SOM conversion rate will remain uncertain.
    claimRefs:
      - CM017
      - CM032

  - calloutType: risk
    title: "Market size and growth evidence is dominated by a single vendor (Nvidia)"
    body: >-
      The primary source for AI chip market sizing is Nvidia's own financial disclosures (SEC 10-K).
      Independent analyst estimates (Gartner, IDC, McKinsey) were inaccessible during the research period
      (paywall/403 barriers). Relying on the market leader's revenue as a market proxy introduces optimism
      bias — competitor revenues (AMD, Google, Amazon custom ASICs) are not separately disclosed, and
      Nvidia's definition of "Compute & Networking" includes training, networking, and automotive revenue
      beyond pure AI inference chips.
    claimRefs:
      - CM001
      - CM003

  - calloutType: insight
    title: "Inference market is growing faster than training within AI chip spend"
    body: >-
      Nvidia's product roadmap and public communications (Blackwell Ultra for agentic inference, Dynamo
      inference software) confirm that inference — running models at production scale — is now the primary
      growth driver within AI compute. This shift from training-dominated to inference-dominated spend is
      structurally advantageous for inference-only NPU vendors like Rebellions over a 3-5 year horizon.
    claimRefs:
      - CM006
      - CM018

