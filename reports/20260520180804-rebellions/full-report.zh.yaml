      - number: '5.3'
        title: REBEL 代际：四芯粒架构、HBM3E 与 ISSCC 结果
        blocks:
          - type: paragraph
            body: >
              REBEL Gen 2 芯片在量产形态中命名为 REBEL-Quad，采用 Samsung Foundry 4nm SF4X 制程制造。其定义性架构特征是四芯粒设计：四颗 REBEL compute ASIC
              通过 UCIe-Advanced die-to-die 链路互连，单 lane 速率 16 Gbps，IP 由 Alphawave Semi 提供。封装在 Samsung CoWoS-S substrate
              上组装，带四组 HBM3E memory stack（每组 36 GB、9.6 GT/s），提供 144 GB HBM3E 总容量和 4.8 TB/s 聚合内存带宽。四个集成硅电容（ISC）完成封装。Host
              interface 为双 PCIe Gen5 x16。在已出货 AI 芯片中使用 UCIe-Advanced 很值得注意，因为这是首个公开营销的量产 AI 加速器 UCIe 芯粒互连案例，ServeTheHome
              在 Hot Chips 2025 的独立评测也予以佐证。


              性能数据由 ISSCC 2026 同行评审论文（IEEE Xplore document 11409003）锚定："A Quad-Chiplet AI SoC with Full-Chip Scalable
              Mesh Over 16Gb/s UCIe-Advanced Die-to-Die Interface for Large-Scale AI Inferencing." 论文报告，在 LLaMA v3.3 70B
              上，输入 2,048 token、输出 2,048 token 序列时达到 56.8 tokens per second。这是目前可信度最高的性能数据点，来自同行评审的 IEEE 会议论文，而非厂商宣传材料。在
              Hot Chips 2025（2025 年 8 月），Rebellions 现场演示 LLaMA 3.3 70B 运行，并展示了执行 Qwen3 235B MoE 的能力。RebelServer 系统（5U、8x
              RebelCard）标称最高 2 PFLOPS FP8，配双 AMD EPYC 9355 host CPU、1.5 TB DDR5 host memory 和 4× 400G 网络端口，典型功耗 4–6
              kW、最高 7 kW。
