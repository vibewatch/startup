      - number: '1.3'
        title: 融资历史、投资方与估值轨迹
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 3 月 30 日，Rebellions 已累计融资 $850 million，在韩国 AI 半导体创业公司中遥遥领先。资本轨迹在截至 2026 年 3
              月的六个月内急剧加速：公司仅在这一窗口就融资 $650 million（超过累计融资的 75%），说明计划 IPO 前投资人信心很强。


              融资历史早于 Series B。公司 2024 年 1 月 Series B 新闻稿披露，当时累计融资「超过 $200 million」，意味着 Series B 之前的种子轮和 Series A 约为 $76
              million；这些更早轮次没有在公开来源中单独公告。Series B 于 2024 年 1 月 30 日完成，金额 $124 million，由 KT（韩国主要数据中心运营商）领投，Temasek 旗下
              Pavilion Capital（跟投）、KDB（Korea Development Bank）、Mirae Asset Venture Investment、IMM Investment、KT
              Investment、SV Investment、Korelya Capital（法国）、DGDV（日本）和多家韩国机构投资方参与。2024 年 7 月 23 日，公司又完成 $15 million 的
              Series B 延展轮，全部来自 Saudi Aramco 旗下风险投资机构 Wa'ed Ventures——这是该基金首次投资韩国创业公司。


              2025 年 9 月 30 日的 Series C 融资 $250 million，投后估值 $1.4 billion；Arm 成为战略财务伙伴，Samsung Ventures、Pegatron
              VC、KDB（跟投）和 Korelya Capital（跟投）也参与。2025 年 11 月，Kindred Ventures 和 Top Tier Capital Partners 加入 Series C
              延展轮，硅谷风险资本首次进入股权结构表。


              2026 年 3 月 30 日，Mirae Asset Financial Group 和 Korea National Growth Fund 领投 $400 million pre-IPO 轮，投后估值约
              $2.34 billion。本轮融资确认，2024 年 12 月合并后达到的独角兽估值里程碑（合并公司企业价值超过 1 trillion Korean won）到 pre-IPO 时已大幅抬升。截至 2026 年
              5 月，IPO 交易所、申报日期和价格区间均未公开确认。
