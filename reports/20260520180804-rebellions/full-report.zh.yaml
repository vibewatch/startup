          label: 封装：Multi-Die Package（ATOM MDP）| CoWoS-S + UCIe-Advanced（REBEL-Quad）
          detail: ATOM：MDP 内 4 颗裸片。REBEL：Samsung CoWoS-S 先进封装；Alphawave UCIe-Advanced SerDes， 16 Gbps/lane。
        - id: board-layer
          label: 板卡：RBLN-CA*（ATOM，PCIe Gen5 x16）| RBLN-CR*（REBEL，双 PCIe Gen5 x16）
          detail: ATOM-Max：350 W FHFL 双槽卡。REBEL-Quad 卡：双 PCIe Gen5 x16，具体 TDP 未披露。
        - id: server-layer
          label: 服务器：ATOM-Max Server（4U，8× ATOM 卡）| RebelServer（5U，8× RebelCard，AMD EPYC 9355）
          detail: >-
            ATOM-Max Server：1024 TFLOPS FP16、512 GB GDDR6、3.4 kW 典型值。RebelServer：2 PFLOPS FP8 （标称）、1.5 TB DDR5 主机、4×
            400G。
        - id: cluster-layer
          label: 集群：ATOM-Max POD（8 台服务器 / 64 个 NPU，400 GB/s RDMA）| RebelRack / RebelPOD（多机柜）
          detail: ATOM POD：400 GB/s RDMA 网络。RebelRack/POD：机柜级 REBEL-Quad，状态不明（见 CE015）。
        - id: software-layer
          label: 软件：RBLN SDK v0.10.3 | vllm-rbln v0.10.3.post1 | NPU Operator v0.4.0 | 300+ 模型库
          detail: rebel-compiler、optimum-rbln、vllm-rbln 在 pypi.org；兼容 vLLM v0.18.0；已获 Red Hat OpenShift AI 认证。
  - id: FE002
    title: 客户部署工作流
    type: flow
    layout: standard
    description: 客户在 Rebellions 硬件上部署 LLM 推理的端到端工作流，从模型准备到生产服务。
    approximationNotes: 工作流来自 RBLN SDK 文档和 vLLM 集成指南。内部 CI/CD 步骤可能因客户环境而异。
    claimRefs:
      - CE016
      - CE017
      - CE018
      - CE020
      - CE021
    data:
      nodes:
        - id: model-selection
          label: 从模型库选择模型（支持 300+）
          type: input
          note: PyTorch / TensorFlow；LLM、视觉模型、传统推理
        - id: compile
          label: 用 rebel-compiler 编译模型（RBLN AOT 编译器）
          type: process
          note: 量化到 FP8/FP4/INT8 目标精度；输出：RBLN 二进制文件
        - id: validate
          label: 在开发硬件上用 RBLN Runtime 验证已编译模型
          type: process
          note: 在 RBLN-CA*（ATOM）或 RBLN-CR*（REBEL）设备上运行单元测试
        - id: deploy-vllm
          label: 通过 vllm-rbln 部署到 RebelServer / ATOM-Max Server
          type: process
          note: 分页注意力 + 连续批处理；vLLM v0.18.0 API
        - id: k8s-operator
          label: 用 Rebellions NPU Operator v0.4.0 将 NPU 注册到 Kubernetes
          type: process
          note: rebellions.ai/REBEL 或 rebellions.ai/ATOM 设备资源；已获 OpenShift 认证
        - id: inference-request
          label: 应用通过 OpenAI 兼容 API 发送推理请求
          type: process
          note: vLLM OpenAI API 端点；支持 token 流式输出
        - id: npu-execute
          label: NPU 在片上执行推理（RBLN Runtime）
          type: process
          note: LLaMA 70B 在 2k/2k 下 56.8 TPS（ISSCC 2026）；HBM3E 或 GDDR6 KV 缓存
        - id: response
          label: 返回响应；通过 k8s metric exporter 导出指标
          type: output
          note: 用于监控的 Prometheus 兼容指标；VFIO manager 负责隔离
        - id: scale-out
          label: 通过 RebelRack / RebelPOD 横向扩展（多服务器、RDMA 网络）
          type: output
          note: 借助 RSD framework 做张量并行；节点间 RDMA 400 GB/s
      edges:
        - from: model-selection
          to: compile
          label: 模型下载
        - from: compile
          to: validate
          label: RBLN 二进制文件
        - from: validate
          to: deploy-vllm
          label: 模型就绪
        - from: deploy-vllm
          to: k8s-operator
          label: 服务器注册
        - from: k8s-operator
          to: inference-request
          label: API 端点上线
        - from: inference-request
          to: npu-execute
          label: 请求分发
        - from: npu-execute
          to: response
          label: token 输出
        - from: response
          to: scale-out
          label: 负载触发扩容
