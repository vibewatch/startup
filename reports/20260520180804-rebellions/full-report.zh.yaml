chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部、创立与产品模式
        blocks:
          - type: paragraph
            body: >
              Rebellions 是一家无晶圆厂 AI 半导体公司，总部位于韩国 Gyeonggi Province Seongnam（Bundang district）。公司由五名韩国工程师在 2020 年共同创立，CEO
              Sunghyun Park 是公开资料中确认的领导者。公司正式注册地址为 3F, 6 Jeongjail-ro 156beon-gil, Bundang-gu, Seongnam-si, Gyeonggi-do,
              Korea。公司只做 AI 推理——把训练好的神经网络放到生产规模运行——而不进入 Nvidia 和 AMD 主导的训练市场。


              Rebellions 自称在打造「面向特定用途的 AI 加速器，以重塑大规模 AI 时代的能效和扩展能力」。它的 chiplet、互连和软件栈面向超大规模部署设计。公司向云运营商、电信运营商和主权 AI
              项目销售硬件（NPU 芯片、服务器系统）及配套软件（Rebellions SDK）。商业模式是硬件 + 软件销售：芯片由 Samsung 以先进制程代工，组装成服务器平台（ATOM-Max
              Server、RebelServer、RebelRack、RebelPOD），并随 SDK 一起用于模型部署。


              2024 年 12 月合并后，法律上的存续主体是 SK Telecom 子公司 SAPEON Korea，但公司完全以 Rebellions 名称和领导层运营。因此，SK Telecom、SK Square 和
              SK Hynix 通过其 SAPEON 持股成为合并后实体的战略投资方。截至 2026 年 5 月，Rebellions 已在日本（2025 年 2 月设立）和沙特阿拉伯（2025 年 8
              月设立）运营子公司，并设立由首席商务官 Marshall Choy 领导的美国实体，以支撑北美扩张。


              公司的产品路径从 ATOM 开始：第一代基于 GDDR6 的推理加速器，2022 年 6 月流片，2023 年 5 月首次出货；随后是 REBEL，一款采用 HBM3E 内存的 UCIe-Advanced AI
              chiplet，2024 年 11 月流片，公司称其为全球首款同类产品；再到当前的 Rebel100 平台、RebelCard 加速卡，以及新推出的 RebelRack 和 RebelPOD
              集成机架级系统。2025 年 12 月与 Red Hat OpenShift AI 的软件集成，把可触达的企业客户基础从亚洲扩展出去。
