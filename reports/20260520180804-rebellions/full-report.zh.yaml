          - type: callout
            title: 没有公开财务披露——收入、ARR、毛利率均未知
            body: >-
              在本报告审阅的任何公开沟通中，Rebellions 都没有披露收入、ARR、毛利率、客户数或烧钱速度。对一家已融资 $850M 且准备 IPO
              的公司来说，这造成信息不对称，使公开来源下的财务尽调无法完成。后续章节会把它作为阻塞性证据缺口处理。
            calloutType: risk
            claimRefs:
              - CO052
          - type: callout
            title: 与 SAPEON 合并具有战略必要性——为竞争规模而非有机增长
            body: >-
              Park Sung-hyun 曾公开表示，在 SKT 来电之前，「合并是唯一的生存方式」。这不是强势增长中的收购，而是在竞争压力下的整合。合并后实体把人才、IP
              和投资方关系放到一起，但也带来整合风险，以及更复杂的治理结构；SKT 作为战略投资方，对战略拥有真实影响力。
            calloutType: insight
            claimRefs:
              - CO015
              - CO016
              - CO031
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: AI 推理芯片市场——边界、相邻市场与现状替代品
        blocks:
          - type: paragraph
            body: >
              本报告分析的市场是 AI 推理加速芯片市场：面向特定用途的芯片——NPU、ASIC 和针对推理优化的
              GPU——部署在数据中心和边缘环境中，用于在生产规模运行训练好的神经网络。纳入支出的范围包括芯片采购、配套服务器平台和推理专用软件授权。排除在市场边界外的是：（a）未使用 AI 加速的通用 CPU
              推理，（b）以训练为主的加速器（仅用于训练部署的 Nvidia H100/H200），（c）AI 网络芯片（NVLink、InfiniBand），以及（d）面向消费者的边缘推理芯片（智能手机
              NPU）。相邻市场——AI 训练加速器——目前是主要支出类别，但 Rebellions 明确不参与，因此单独跟踪。


              Nvidia 的 Compute & Networking 分部收入，是全球 AI 加速计算市场最好的可用代理指标。FY2026（截至 2026 年 1 月 25 日的年度），Nvidia 披露 Compute
              & Networking 收入 $193.5 billion，较 FY2025 的 $115.9 billion 增长 67%。Nvidia 总收入为 $215.9 billion（同比
              +65%）。尽管这些数字横跨训练和推理负载，行业共识和 Nvidia 自身产品路线图都表明，推理是增长最快的组成部分：面向智能体 AI 的 Blackwell Ultra，以及 Rubin 后续平台（预计 H2
              FY2027 投产），都瞄准推理效率和 token 吞吐。专用推理芯片的现状替代品，是在多用途数据中心 GPU 上做基于 GPU 的推理——2026 年仍是主流部署方式——Rebellions 必须在 TCO
              和能效上将其替代。第二个替代品是面向低吞吐负载的 CPU-only 推理，在小 batch size 下仍有竞争力。CY2023 全球 AI 推理芯片市场约为 $34.3 billion（主要是 Nvidia
              GPU 收入），当时 Nvidia 约占 94% 市场份额。此后市场大幅扩张：Nvidia FY2025 C&N 收入 $115.9 billion，意味着 CY2024 总加速计算约 $120–130
              billion，仍由 Nvidia 主导，但 AMD MI300X 和超大规模云厂商自研 ASIC（Google TPU、AWS Trainium/Inferentia）正在拿到更大比例。
