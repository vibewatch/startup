      - - 美国出口管制推动 AI 供应链地缘政治化
        - 驱动因素 - 上行（利好替代芯片）
        - 当前（按 Nvidia 10-K，FY2026 生效）
        - 在韩国、日本及重视主权的市场，催生非美国供应链需求
        - 确认韩国政府政策是否明确偏向本土芯片厂商而非进口产品
      - - 韩国主权 AI 政策（MSIT 和 SKT 要求）
        - 驱动因素 - 上行
        - 近期（2025-2026 正式化）
        - 提供政策托底需求；降低首批电信运营商订单的获客成本
        - 韩国 AI 半导体计划已承诺的预算和时间表是什么？
      - - CUDA 生态锁定效应（Nvidia 开发者护城河）
        - 约束 - 下行
        - 持续存在（多年开发者切换成本）
        - 将 Rebellions 限在绿地推理部署，或需要大量开发者投入的迁移
        - 已有多少生产工作负载从 CUDA 迁移到 Rebellions RBLN SDK？
      - - 数据中心电力约束
        - 混合（短期约束；中期利好高效芯片）
