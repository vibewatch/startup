  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户工作流概览
        blocks:
          - type: paragraph
            body: >
              Rebellions 提供两代 AI 推理加速硬件，以加速卡、服务器和机架级系统销售，并由自研软件栈支撑。第一代（ATOM）基于定制推理 NPU SoC，采用成熟制程节点制造，以多 die 配置封装并配备
              GDDR6 内存。第二代（REBEL / REBEL-Quad）采用 Samsung 4nm SF4X 制造，使用带 UCIe-Advanced die-to-die 互连的四芯粒架构，并通过 Samsung
              CoWoS-S 先进封装搭载 HBM3E 内存。产品有四种形态：加速卡（PCIe
              接入）、加速服务器（多卡机架式服务器）、mini-POD（多服务器集群）和机架级系统（RebelRack/RebelPOD）。Rebellions 还为低功耗部署提供两款单芯片 ATOM
              变体：RBLN-CA21（<75 W，无外接电源接口）和 RBLN-CA22（最高 90 W）。


              客户工作流从模型准备开始，使用 RBLN Compiler（RBLN SDK 的一部分）把 PyTorch 或 TensorFlow 模型转换为 Rebellions 运行时格式。模型随后部署在 ATOM-Max
              或 RebelServer 硬件上，可直接通过 RBLN Runtime API，也可借助 vllm-rbln Python 包走 vLLM 兼容接口。Kubernetes 集成由 Rebellions NPU
              Operator 提供；截至 2025 年 12 月，该 Operator 已获 Red Hat OpenShift AI 认证，Helm chart 通过 OCI registry 分发。Rebellions
              model zoo 列出 300+ 个受支持的 PyTorch/TensorFlow 模型，覆盖 LLM、视觉 transformer 和经典推理工作负载。企业客户的工作负载运行在 ATOM-Max
              Server（4U、8 卡、Ubuntu/RHEL/AlmaLinux）或 RebelServer（5U、8 卡、AMD EPYC 9355 host CPU、400G 网络）上。机架级客户可使用
              ATOM-Max POD（8 服务器 mini-cluster、400 GB/s RDMA fabric）或 2026 年 3 月新发布的 RebelRack/RebelPOD。
