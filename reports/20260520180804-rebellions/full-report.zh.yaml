      - number: '1.5'
        title: 反向因素、竞争与证据缺口
        blocks:
          - type: paragraph
            body: >
              根据 The Investor 在 SAPEON 合并公告时的报道，2023 年 Nvidia 约占 AI 芯片市场 94%
              份额。这个竞争现实是最核心的反向因素：每一次产品决策、客户赢单和融资，都必须放在一个根基极深的市场领导者面前评估；后者在软件生态（CUDA）、规模和品牌认知上都占优。Rebellions
              只做推理、刻意避开训练市场，这既是聚焦式差异化，也是在押注推理负载会足够大、足够独立，让专业厂商拿到有意义份额。


              公司没有公开发布收入、年经常性收入（ARR）、毛利率或客户数。披露只停留在定性部署状态（SKT 测试、kt cloud
              上线、进入沙特阿拉伯和日本市场）。仅靠公开来源无法做财务尽调，这是本报告最重要的证据缺口。没有披露财务数据符合私人公司常态，但考虑到公司已表示准备 IPO，这一点尤其值得关注——投资人应预期 IPO
              关闭前会看到正式申报文件或招股书。


              合并后的整合风险不小。把 Rebellions 和 SAPEON Korea 两支芯片开发团队、各自工程文化和重叠投资方放进同一公司结构，是复杂的组织挑战。法律存续主体是 SAPEON Korea（重组为
              Rebellions），这可能在 IP 所有权、团队留任和文化磨合上带来摩擦。公司没有披露合并后的任何人员流失数据。


              Park Sung-hyun 的关键人物集中，是首要领导层风险。公开记录中的每一轮融资和谈判，Park 都是核心人物；计划 IPO
              能否推进，取决于他能持续投入。董事会构成和继任计划没有公开文件记录。治理缺口叠加收入披露缺失、IPO 时间表不明确，构成本章为后续分析标出的剩余尽调负担。
