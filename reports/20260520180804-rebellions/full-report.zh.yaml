              CEO Park Sung-hyun 是唯一被公开文件记录的战略决策者。其他四名联合创始人在所有公开来源中均未具名，合并后的董事会构成没有披露，也没有公开记录任何继任计划。IPO
              前若发生领导层扰动，将带来显著执行风险。
