  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与建议
        blocks:
          - type: paragraph
            body: >
              Rebellions 值得进入严肃投资讨论，不是因为它又是一家同质化 AI 芯片初创公司。作为韩国半导体创业公司，它融资规模异常大，与 Samsung 的制造体系深度绑定，也站在主权 AI
              叙事里，因此本土需求路径比许多西方推理芯片同行更受保护。2026 年 3 月官方 Pre-IPO 公告还显示，公司正从单卡硅片走向 RebelRack、RebelPOD
              这类系统级产品；这一点有战略意义，因为客户买的是可部署的推理容量，不是独立裸片。

              但在当前价格下，反向逻辑更关键。公开披露的最近收入基线仍只是 FY2023 的 2.7 billion KRW，且净亏损 13.7 billion KRW；本章审阅的公开记录仍未披露 FY2024 或
              FY2025 实际收入、毛利率、积压订单、客户数或复购指标。也就是说，当前估值不是由可见商业规模支撑，而是由可选性支撑。估值已经计入成功商业化和最终 IPO
              路径，因此正确立场是继续研究，不是买入。审计级或招股书级财务披露追上融资故事之前，置信度应保持低、风险保持高，入场纪律也要严格。
