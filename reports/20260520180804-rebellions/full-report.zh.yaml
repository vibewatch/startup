      - number: '2.2'
        title: 买方、用户与付款方分层——预算归属与采用路径
        blocks:
          - type: paragraph
            body: >
              AI 推理芯片市场可按四类主要买方划分，它们的采购模式、预算权和 AI 芯片采用触发点各不相同。


              超大规模云厂商（CSP——AWS、Azure、GCP，加上新兴 AI 原生云）代表最大采购量。它们拥有或租赁计算基础设施，每年向 GPU 和 ASIC 供应商投入数十亿美元 capex。Nvidia 明确将
              CSP 视为其主要数据中心客户，所有主要云服务商都在使用其平台。超大规模云厂商采购由企业 API 客户和消费者 AI 产品带来的模型推理需求驱动。预算权在基础设施 /
              平台工程部门。替代芯片的采用触发点，是规模化场景下的 TCO 和能效。


              电信运营商（SK Telecom、KT、NTT Docomo 及国际同类公司）构成 Rebellions 的战略重要客群。电信运营商正在建设 AI 原生网络，并在边缘和区域数据中心部署推理。SK Telecom
              与 Rebellions 和 Arm 合作开发主权 AI 推理芯片，建立了正式的电信采购路径。NTT Docomo Innovations 加入 Rebellions/SKT
              基础设施合作，说明亚洲电信运营商兴趣正在扩大。电信 AI 芯片预算通常由网络技术和基础设施采购管理；在韩国，主权 AI 政策又创造出一个与政策挂钩的预算类别。


              企业买方（银行、医疗、政府机构、制造业）通常通过云 API 或本地服务器采购间接采用 AI 推理芯片。Red Hat OpenShift AI 认证 Rebellions
              NPU，打开了企业本地推理部署渠道。Samsung Electronics 的战略投资和共同开发合作，为 Samsung 关联公司成为企业推理买方创造路径。


              韩国本土云服务商（Samsung SDS、KT Cloud、NAVER Cloud）是重要的可服务市场（SAM）细分。IDC 数据确认，Samsung SDS 是韩国第一大托管云服务商（MSP 份额
              23.9%）和第二大本土 CSP（份额 11.0%），使 Samsung Group 成为韩国主导性云买方；而 Samsung 对 Rebellions 的投资，又创造出潜在的锁定采购关系。
