      - number: '8.3'
        title: 乐观、基准、悲观情景与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >
              公司尚未向公开市场投资人提供足以搭建清晰收入或 EBITDA 框架的经营披露，因此情景分析比点估式倍数更站得住。在悲观情景下，Rebellions 仍有战略吸引力，但商业证据不足：FY2024-FY2025
              收入仍未披露，IPO 延后，公开财务显示业务规模明显低于当前价格要求。该情景支撑约 $0.8 billion-$1.2 billion 区间。基准情景下，公司拿出足够的经审计规模，客户集中度看起来可控，IPO
              路径仍可行，对应约 $1.5 billion-$2.5 billion。乐观情景下，主权 AI 部署转化为可见商业化、全球设计赢单和强 IPO 需求，可支撑约 $3 billion-$5 billion。

              新投资人的问题在于，当前 $2.34 billion 标记已经接近基准情景区间的上半段。因此，下一个重大披露节点分量很重。最清晰的投资逻辑破裂触发点，是经审计或 IPO 申报收入明显低于 $2.34
              billion 价格隐含的水平。第二个触发点来自流程：如果 IPO 延迟或撤回，又没有规模化部署证据抵消，稀缺性溢价应会迅速压缩。因此，下行不是理论风险，而是集中在少数几个高度可监测的披露上。
