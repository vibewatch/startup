  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值区间
      - 概率信号
      - 关键风险或解锁项
    rows:
      - - 悲观
        - FY2024-FY2025 实际收入仍然疲弱或令人失望，IPO 延后，公开披露显示规模有限。
        - $0.8B-$1.2B
        - 若当前不透明最终揭晓为负面结果，风险重大。
        - 下行由稀缺性溢价压缩和商业化证据薄弱驱动。
      - - 基准
        - Rebellions 展示可信但仍有限的商业规模，推进 IPO 申报，并维持主权 AI 定位。
        - $1.5B-$2.5B
        - 按当前证据，这是概率最高区间。
        - 需要披露质量足以维持 IPO 路径。
      - - 乐观
        - 经审计增长、强劲主权 AI 部署和旺盛 IPO 需求，共同验证 Rebellions 是稀缺 AI 芯片资产。
        - $3.0B-$5.0B
        - 需要多项有利披露，而不只是叙事继续升温。
        - 上行取决于证明规模，而不只是保住可选性。
    notes: 情景区间是分析师估计，锚定融资背景、披露质量和 AI 芯片同行结果，而不是干净的收入倍数。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 状态 / 最新估值结果
      - 最近披露收入
      - 倍数 / 信号
      - 与 Rebellions 的相关性
      - 局限
    rows:
      - - Cerebras
        - 已上市；申报并上市后，2026 年 5 月市值大约在 $8B 以上
        - 收入：FY2025 $510M（SEC S-1/A）
        - 约十几倍中段的收入倍数（估计）
        - 最佳收入支撑型 AI 芯片锚点，显示披露能在公开市场解锁什么价值
        - 公开可比公司，披露远好于 Rebellions，已证明规模也明显更高
      - - Groq
        - 私有；完成 $750M 融资后估值 $6.9B（据报道）
        - 未公开披露
        - 可选性锚点；没有干净的收入倍数
        - 显示投资者仍会为推理芯片可选性支付高额溢价
        - 收入不透明，无法逐项对比
      - - SambaNova
        - 私有；据报道融资困难后探索出售
        - 未公开披露
        - 困境信号，不是干净倍数
        - 资本密集型 AI 芯片初创公司的重要下行先例
        - 结果由交易流程驱动，不是已确定的估值标记
      - - Graphcore
        - 2024 年被 SoftBank 收购
        - 所审阅来源未公开披露退出时收入
        - 战略结果信号，不是干净倍数
        - 显示独立 AI 芯片公司可能以战略吸收告终，而不是 IPO
        - 退出条款不是透明的公开市场估值基准
      - - FuriosaAI
        - 私有；2025 年完成 $125M 融资，据报道还计划更大规模融资
        - 未公开披露
        - 韩国同行估值信号；无收入倍数
        - 韩国推理芯片在地域和品类上最接近的同行
        - 收入不透明度仍高
      - - Tenstorrent
        - 私有；据报道 2024 年底融资 $693M 并成为独角兽
        - 未公开披露
        - 平台可选性估值信号；无收入倍数
        - 说明投资者对非 Nvidia AI 计算平台仍有胃口
        - 产品宽度不同，且没有公开收入披露
      - - Rebellions
        - 私有；2026 年 3 月 IPO 前融资后投后估值 $2.34B
        - 最后披露为 FY2023 收入 $2.7B KRW（约 $2.1M）
        - 按最后披露收入基线隐含 >1,100x（估计）
        - 本报告标的；估值落在私有可比公司区间内，但缺少收入支撑
        - FY2024-FY2025 实际收入仍未披露，基线已经陈旧
    notes: 表中混合了公开、私有和结果型可比对象；私有公司估值来自第三方报道，且多数缺少收入披露，所以更适合方向性使用，而不是机械套用。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the highest-signal AI-chip valuation references available from reviewed 2024-2026 public sources: one
        revenue-backed public comp, four private/funding or strategic-outcome comps, and the closest Korean peer.
        Coverage is partial because several private peers do not disclose revenue or current marks consistently.
