      - number: '5.2'
        title: ATOM 代际：架构、规格与部署
        blocks:
          - type: paragraph
            body: >
              ATOM SoC 是 Rebellions 第一代 AI 推理芯片，2022 年 6 月完成流片，并自 2024 H1 起在 ATOM-Max 产品家族中出货。每颗 ATOM 芯片标称 32 TFLOPS
              FP16、128 TOPS INT8 和 256 TOPS INT4，配备 16 GB GDDR6 内存，单芯片带宽 256 GB/s（128-bit bus 上 16 Gbps）。旗舰 ATOM-Max
              卡（型号 RBLN-CA25）在一个多 die 封装中集成四颗 ATOM 芯片，在 350 W TDP 下提供 128 TFLOPS FP16、512 TOPS INT8 和 1024 TOPS INT4，总计
              64 GB GDDR6，聚合内存带宽 1024 GB/s。该卡使用 PCIe Gen5 x16 host interface，占用全高全长双槽形态。Chips and Cheese 在
              Supercomputing 2024 独立确认了这一架构。


              ATOM-Max Server 在 4U 机箱中集成八张 ATOM-Max 卡，合计 1024 TFLOPS FP16、512 GB GDDR6 和 8 TB/s 总内存带宽。服务器典型功耗 3.4 kW、最高
              4.3 kW，落在标准 5 kW 机架供电包络内。服务器运行 Ubuntu、RHEL、AlmaLinux 和 Rocky Linux，并开箱支持 vLLM、Triton、Kubernetes 和
              Docker。ATOM-Max POD 扩展到机架级：一个 8 服务器 mini-POD 提供 64 个 NPU、512 GB GDDR6（8 TB/s）和用于节点间通信的 400 GB/s RDMA
              fabric，可支撑分布式张量并行推理。ATOM 在 ISSCC 2024 与 AMD、Intel 论文同场亮相，并被描述为已具备量产条件。实地部署上，ATOM 卡已部署在阿联酋 ECOPEACE（相对 GPU
              基线每瓦性能 2×，TTA 认证）和蒙古海关（相对 GPU TPS/Watt 2.7×，公司引用），公司也报告了沙特阿拉伯和日本部署。
