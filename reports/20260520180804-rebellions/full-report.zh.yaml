  - id: TP004
    title: 护城河耐久性与竞争风险登记表
    columns:
      - 护城河或风险
      - 方向
      - 严重性
      - 缓释措施 / 尽调追问
    rows:
      - - Nvidia CUDA 软件生态锁定效应
        - 风险（所有挑战者）
        - 高
        - Rebellions SDK 必须实现 CUDA 兼容，或让迁移几乎无摩擦；Red Hat OpenShift AI 集成只能部分缓释，距离 CUDA 对等能力仍有多年差距
      - - FuriosaAI 争夺韩国主权 AI 预算
        - 风险（直接）
        - 高
        - 两家公司瞄准同一批韩国电信 / 政府客户；Rebellions 的 SK Telecom 战略投资者股权是一道护城河，但 FuriosaAI 的 LG CNS 合作也打出一条平行渠道
      - - Groq-Nvidia 授权信号：初创公司人才 / IP 向 Nvidia 迁移
        - 风险（生态）
        - 中高
        - Groq 创始人 Jonathan Ross 和总裁 Sunny Madra 加入 Nvidia（Dec 2025）；Nvidia 可以系统性收购初创公司的技术和人才，作为竞争防御机制
      - - Samsung 制造资源（Rebellions）
        - 护城河
        - 中
        - Rebellions 的 Samsung Foundry 晶圆厂和共同开发协议，提供西方竞争者拿不到的韩国本土晶圆厂资源；但 Samsung 也可能为 FuriosaAI 和其他韩国公司代工
      - - 韩国 MSIT 主权 AI 要求
        - 护城河
        - 中
        - 韩国政府偏好国产 AI 芯片的政策，给 Rebellions（和 FuriosaAI）一个受保护的本土市场；风险在于政策反转，或授权范围扩大到 FuriosaAI
      - - Tenstorrent 与 Samsung/LG 投资方重叠
        - 风险
        - 中
        - Tenstorrent 融资 $693M，由 Samsung Securities 和 LG Electronics 领投——这套机构生态也包括 Rebellions 的 Samsung 晶圆厂伙伴；可能造成机构渠道冲突
      - - Nvidia 硬件路线图压缩（Rubin 下一代）
        - 风险
        - 高
        - 每一代 Nvidia（A100→H100 30x；H100→GB200 30x）都会重置 NPU 性能 / TCO 价值主张；Rebellions 的 REBEL 必须保持领先一代的效率优势，否则可能在量产前就被超越
      - - AMD ROCm 生态成熟
        - 风险
        - 中
        - AMD ROCm 与 PyTorch/HuggingFace 的兼容性越来越高；如果 ROCm 接近 CUDA 兼容，买家可能更偏好熟悉的 AMD GPU 模式，而不是新型 NPU
      - - SK Telecom 战略投资者治理
        - 风险（治理）
        - 中低
        - 合并后 SK Telecom 仍是战略投资者；其董事会影响力范围，以及与全球扩张方向冲突的可能性，尚未公开披露
      - - 客户多宿主 / 混合 NPU+GPU 集群
        - 风险
        - 中
        - 企业和云客户可能运行混合集群（Nvidia H100 + NPU 补充）；这会把 Rebellions 限在次级工作负载，而不是替代主力推理集群
    notes: 严重性评级是作者基于公开证据作出的分析判断；没有公司确认或排序这些风险。“方向”指该因素是利好 Rebellions（护城河）还是威胁 Rebellions（风险）。缓释路径是尽调建议，不是已确认的公司计划。
    claimRefs:
      - CP004
      - CP008
      - CP040
      - CP041
      - CP042
