      - number: '7.4'
        title: 整合、领导力与否决条件
        blocks:
          - type: paragraph
            body: >-
              SAPEON 合并通过打造更大的韩国 AI 芯片冠军，解决了一个战略问题，但也增加了整合、治理和领导力集中度。合并后的公司在公开层面与 Sunghyun Park 深度绑定；他仍是具名
              CEO，也是主要技术和外部代表。公开资料没有找到继任计划、协同评分卡或合并后治理框架。这很重要，因为未来十二个月挤满了执行事件：证明基准可信度，把 pre-IPO 资金转化为可审计增长，处理出口管制暴露，并管理
              IPO 流程。正确的投资人姿态不是假设失败，而是坚持可衡量的投资逻辑失效触发条件。如果经审计 FY2025 结果远低于目标，如果 KRX 审查显著滑坡，如果 Samsung 或 HBM 分配约束发布量，或者
              Park 或合并整合让领导团队不稳，剩余风险画像会很快从高风险变成投资逻辑失效。资本实力存在，但证据和控制仍落后于野心。
