      - number: '5.6'
        title: 性能证据、基准缺口与技术风险
        blocks:
          - type: paragraph
            body: >
              Rebellions 硬件最强的独立性能证据，是 REBEL-Quad 的 ISSCC 2026 同行评审论文（LLaMA v3.3 70B、2k/2k sequence 下 56.8 TPS），以及包括
              ServeTheHome 在内的行业媒体观察到的 Hot Chips 2025 现场演示。对 ATOM Gen 1 来说，所有每瓦性能说法都来自公司引用或 TTA（Telecommunications
              Technology Association，韩国认证机构）认证：蒙古海关相对 GPU 的 2.7× TPS/Watt 优势，以及阿联酋 ECOPEACE 的 2× 每瓦性能，均由 Rebellions
              呈现，没有独立公开的基准方法。截至 2026 年 5 月，Rebellions 没有在 mlcommons.org 向 MLPerf Inference Datacenter benchmark
              提交结果。MLPerf 是行业最主要的第三方推理基准，所有主要竞争对手（NVIDIA、AMD、Google、Intel）都会发布。缺少 MLPerf 数据，使外部无法基于公开来源独立比较 Rebellions 与
              H100、MI300X、Gaudi 3 的性能。


              REBEL-Quad 的双 PCIe Gen5 x16 host interface 可能落后于 NVIDIA GB300；后者目标是 PCIe Gen6 连接。如果客户工作负载卡在 host
              interface，二者会形成代际 I/O 带宽差异。软件端，vllm-rbln 缺少 speculative decoding、distributed KV cache 和 prefill/decode
              disaggregation——这些已经是大规模 GPU vLLM 部署中的标准功能，用来支持成本优化的混合 serving 架构。RebelRack 和 RebelPOD 系统在 2026 年 3 月 30
              日新闻稿和投资人沟通中被宣布为“现已可用”，但截至 2026 年 5 月研究日期，Rebellions
              网站导航仍显示这些产品“即将推出”。这种不一致是生产就绪度的反向信号：要么产品在供应确认前就被宣布，要么网站没有更新可用状态。RSD（Rebellions Scalable Design）框架支持从单卡（128
              TFLOPS FP16 / 64 GB）到可配置机架系统（512–7168 TFLOPS FP16，256 GB– 3.5 TB GDDR6）的张量并行推理，并支持 Ubuntu、RHEL、Kubernetes
              和 OpenStack。
