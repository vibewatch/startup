      - number: '3.2'
        title: 直接推理 NPU 竞争对手
        blocks:
          - type: paragraph
            body: >
              Rebellions 最接近的对手，是一批同样聚焦推理的芯片公司；它们和 Rebellions 一样，把自己定位成 Nvidia 通用 GPU 架构之外的专用替代方案。


              **Groq**（2016 年成立，Mountain View, CA）首创 LPU（Language Processing Unit），即专为推理构建的芯片架构。截至 2026 年 5 月，Groq
              已在多轮融资中募集超过 $1.39B，最近一次是 2025 年 9 月以 $6.9B 投后估值融资 $750M，支持方包括 Samsung、Cisco 和 Disruptive。Groq
              在北美、欧洲和中东运营数据中心，通过 GroqCloud 服务 2M+ 开发者。其沙特阿拉伯布局以 $1.5B 主权 AI 承诺为锚点，与 Rebellions 的中东扩张目标形成地理重叠。2025 年 12
              月，Groq 与 Nvidia 签订非独家授权协议；关键在于，Groq 创始人 Jonathan Ross 和总裁 Sunny Madra 作为该安排的一部分离开 Groq、加入
              Nvidia。这是迄今为止最强的反向信号，指向独立推理芯片公司面对 Nvidia 软硬件生态时的生存难度。


              **FuriosaAI**（首尔，韩国）是 Rebellions 在韩国和亚洲市场最直接的竞争威胁。FuriosaAI 的 RNGD（Renegade）芯片提供 512 TFLOPS（8 个处理单元，每个 64
              TFLOPS FP8）、48 GB HBM3 内存和 180W TDP，瞄准风冷数据中心；这与 Rebellions 的目标热设计包络相似。FuriosaAI 于 2026 年 1 月开始出货 RNGD，2026
              年 2 月拿下 LG CNS 企业 AI 合作，并计划在自身 IPO 前融资 $500M。两家公司都来自韩国，都尚未实现规模化收入，也都瞄准同一批韩国电信和主权 AI
              客户。至少在早期韩国数据中心采购中，二者竞争是零和的。


              **SambaNova**（Palo Alto, CA）用 Reconfigurable Dataflow
              Unit（RDU）架构形成差异化；该架构把模型执行直接映射到处理器上，以减少数据移动——这种推理效率思路与 Rebellions 的 NPU 聚焦在理念上相近，但架构不同。SambaNova 的 SN50（第 5
              代）支持智能体 AI 负载，并可同时运行多个模型。SambaCloud 报告其在 API 层上 MiniMax M2.7 达到 435 tokens/second，DeepSeek-V3.1 达到 200
              tokens/second。SambaNova 主要在云 API 层竞争，而不是裸芯片供应商；这意味着它与 Rebellions 在企业 AI 上重叠，但商业化模式不同。


              **Cerebras**（Sunnyvale, CA）采用晶圆级路线：WSE-3 在单片晶圆上集成 4 trillion 个晶体管，提供 125 petaflops。截至 2026 年 5 月，Cerebras
              已完成 IPO。Cerebras 同时瞄准训练和推理，但晶圆级架构需要液冷，目标性能 / 功耗包络也不同于 Rebellions 的 chiplet 路线；在多数数据中心部署中，它们更多是间接竞争而非直接竞争。


              **Tenstorrent**（Toronto/Austin）已完成由 Samsung Securities 和 LG Electronics 领投的 $693M Series D，并以开源 RISC-V
              路线定位 Wormhole AI 加速器，试图建立比专有 NPU 公司更广的开发者生态。Tenstorrent 同时瞄准训练和推理；Samsung/LG 背书让它与 Rebellions 自身 Samsung
              制造和 LG 生态关系产生潜在重叠。
