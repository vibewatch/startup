      - number: '2.4'
        title: 韩国主权 AI 市场——政策、电信采购与 Rebellions 本土定位
        blocks:
          - type: paragraph
            body: >
              韩国主权 AI 芯片计划，是 Rebellions 近期最重要的需求向量。政策语境很明确：韩国政府在 Ministry of Science and ICT 支持下，把本土 AI
              半导体发展列为国家战略优先事项。SK Telecom 通过与 Rebellions 和 Arm 合作共同开发面向 SKT 自身数据中心基础设施的主权 AI 推理芯片，把政策转成商业合同。HPCwire 和
              Convergedigest 对该计划的报道，将其描述为把 Rebellions 芯片定位成韩国主权 AI 电信数据中心的推理层。SKT 已发布正式新闻稿确认合作。


              对 Rebellions 来说，韩国市场的结构性优势是垂直整合：Samsung Electronics 既是代工伙伴（制造 Rebellions 芯片），也是战略投资方；Samsung SDS
              又是韩国主导性云服务商。SK Telecom 是战略 AI 芯片客户。这形成了芯片设计、制造、云部署和 AI 负载拥有者之间异常紧密的闭环；美国以外的大多数 AI 芯片创业公司无法接触这种结构。NTT
              Docomo 的参与把网络延伸到日本，这是中国之外亚洲第二大 AI 芯片市场。


              韩国主权 AI 细分里的关键尽调风险，是采购节奏。政策公告往往比实际硬件采购早 12–24 个月；本报告审阅的公开来源没有完全披露韩国政府 AI 投资时间表中哪些仍是规划、哪些已变成承诺合同。Rebellions
              已生产并出货 ATOM、REBEL 和 REBELRACE 芯片，建立了生产可信度，但 SKT 实际下单的主权 AI 芯片规模与宣示性目标之间的差距，需要一手来源核验。Arm 和 Samsung 支持的 $250
              million 融资（2025 年）以及 $400 million pre-IPO 轮（2026 年）说明投资人相信收入规模可以达成，但来自主权 AI 合同的确认年经常性收入没有公开披露。
