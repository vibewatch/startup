      - number: '4.4'
        title: 资本充足性、现金跑道与 IPO 路径
        blocks:
          - type: paragraph
            body: >
              基于公开信息，Rebellions 未来 18–24 个月的资本充足性看起来相对稳健，核心锚点是 2026 年 3 月 30 日完成的 $400 million pre-IPO
              轮。不过，公司没有公开披露实际现金余额、月度烧钱速度和预计现金跑道；没有内部财务数据，就无法做出精确的充足性判断。


              定性信号偏正面：公司在六个月内（2025 年 9 月至 2026 年 3 月）募集 $650 million，说明投资人相信近期收入增长。Korea National Growth Fund 把
              Rebellions 定为其首个 K-Nvidia 投资，意味着公司可能与韩国政府支持计划有所对齐，并获得额外补贴或软贷款入口。Mirae Asset 自 Series A
              起支持公司，也说明投资人延续性较强，不是可能快速退出的新进入者。


              计划中的 IPO 是最关键的前瞻资本事件。新闻稿提到“为未来 IPO 做准备”，但截至报告日期，没有披露交易所、申报日期、价格区间或承销商细节。若 2026 年
              IPO，公司需要披露财务报表——通常是两到三年的审计结果——IPO 流程本身会暴露目前公开来源缺失的收入、毛利率和烧钱数据。在此之前，公司仍按私募市场披露规范运作。


              首要资本风险是执行缺口：如果 $68 million 的 2025 年收入目标大幅落空，$2.34 billion 投后估值隐含的倍数就会显得偏高，进而可能拖累 IPO 定价。Fabless 芯片公司通常需要
              3–5 年收入增长，才能支撑接近软件公司的估值倍数；Rebellions 仍处在这条收入曲线的早期。次要风险包括 REBEL-Quad 量产潜在延迟、HBM3E 供应约束，以及美国市场渗透慢于预期。
