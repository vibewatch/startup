      - number: '7.3'
        title: 供应链与生态依赖
        blocks:
          - type: paragraph
            body: >-
              Rebellions 正试图扩张并走向公开上市，但运营模式的集中度异常高。Samsung 不只是供应商，也是路线图锚点：下一代 REBEL 项目宣布基于 Samsung 4nm 和 Samsung
              HBM3E，独立 Hot Chips 报道也仍显示 REBEL-Quad 集中在 Samsung 制程和 HBM 上。Park 对 foundry 产能和 HBM
              短缺的表述，把这种依赖变成一阶风险，而不是泛泛的半导体 caveat。需求和渠道侧也有同样集中度。SK Telecom 和 Arm 提供了醒目的主权 AI
              验证，但也把商业化绑定到一小组政策对齐项目和交易对手。公开市场时点又是另一项依赖，而不只是一个里程碑，因为 KRX 和韩国 IPO 窗口现在夹在 Rebellions
              与下一次估值重置之间。没有披露第二供应来源计划、产能预留或出货量时，内存分配、封装或主权项目时点的任何滑坡，都可能传导为交付延迟、基准变弱，以及更脆弱的 IPO 故事。
