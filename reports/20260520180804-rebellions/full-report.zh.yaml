      - number: '5.5'
        title: 制造、供应链与战略合作
        blocks:
          - type: paragraph
            body: >
              Rebellions 的硅供应链集中在 Samsung。REBEL-Quad 的逻辑采用 Samsung Foundry 4nm SF4X 制程，内存使用 Samsung HBM3E（每个封装四组 36 GB
              stack），先进封装采用 Samsung CoWoS-S interposer。逻辑、内存、封装三项关键供应输入都由单一供应商承担，构成结构性集中风险：Samsung Foundry 的任何产能中断、HBM3E
              良率问题或封装瓶颈，都会直接约束 Rebellions 产品供应，且没有披露替代来源。ATOM-Max 产品家族使用 GDDR6 内存（另行采购），因此 Gen 1 产品线风险较低；但 REBEL-Quad
              的完整供应链只有 Samsung。


              REBEL-Quad 中的 UCIe-Advanced 芯粒互连 IP 由 Alphawave Semi 提供；这是一家加拿大半导体 IP 公司，专注高速有线连接。Alphawave IP 让
              REBEL-Quad 封装内部实现 16 Gbps per-lane die-to-die 带宽。Rebellions 于 2025 年 10 月加入 Arm Total Design 生态，显示其计划把 Arm
              Neoverse compute subsystem（CSS）集成到未来的 Rebellions AGI CPU 产品中。Arm 也对 Rebellions 的 $250M Series C（2024 年 12
              月）进行了战略投资。Red Hat 于 2025 年 12 月通过 OpenShift AI 认证成为生态伙伴，支持企业在 Rebellions 硬件上进行 Kubernetes 部署。SK Telecom 参与
              2026 年 4 月宣布的主权 AI 数据中心验证和联合开发。Samsung 既是共同投资方（通过 Samsung Securities），也是
              foundry，供应链与战略资本高度一致，但议价筹码集中在单一交易对手手中。
