  - id: TV005
    title: 投资逻辑破坏和否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入披露不及预期
        - IPO 申报或审计结果显示，收入远低于 $2.34B 估值所隐含水平
        - 可选性溢价失去核心支撑，估值必须向悲观情景压缩
        - 立即重新测算；在出现新的价格发现前，假设估值偏高
      - - IPO 延误且无补偿
        - KOSPI 流程延期或消失，且没有合同或收入披露来抵消
        - 信息风险仍高，稀缺性和流动性溢价同步压缩
        - 下调任何建设性立场，完全转为观望
      - - 毛利率披露偏弱
        - 首次审计披露显示硬件经济性结构性偏弱
        - 削弱从增长叙事走向公开市场半导体倍数支撑的路径
        - 用更低的基准和乐观区间重做情景表
      - - 客户集中度冲击
        - 审计披露显示极度依赖一两个锚定客户
        - 收入质量变弱，可重复性假设下降
        - 将增长视为更不耐久，并上调悲观情景概率
      - - 没有重复部署证据
        - 新披露确认只是试点或一次性项目，而不是可重复的规模化铺开
        - 系统级产品故事没有转化为商业复利
        - 从投资测算中剔除 IPO 准备度溢价
    notes: 触发项定义聚焦可观察披露事件，而不是叙事情绪，因为这个估值取决于少数可监控的公开证明。
    claimRefs:
      - CV049
      - CV050
      - CV051
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计的 FY2024-FY2025 财务数据
        - FY2023 之后两年的收入、毛利率、经营亏损和烧钱速度桥接
        - 这是当前估值只能按期权价值处理的最大障碍
        - KOSPI 申报文件、经审计招股书，或公司 / 投资方数据室直接披露
      - - 优先股堆叠与股权结构条款
        - 清算优先权、反稀释条款、老股交易权利，以及任何结构化 IPO 前保护
        - 如果优先股堆叠很重，回报结果会与名义投后估值显著不同
        - 律师审阅融资文件，或投资方股权结构包
      - - 客户集中度与积压订单
        - 具名客户、收入集中度、复购节奏和已承诺积压订单
        - 要支撑 IPO 和下行保护，收入质量与收入规模同样关键
        - 招股书客户风险章节、尽调访谈，或经审计附注披露
      - - 产品层面单位经济
        - 芯片卡、服务器和机柜级系统的毛利率与定价证据
        - 即使有商业规模，硬件经济性不健康，也撑不起稳健的公开市场倍数
        - 管理层指引、经审计分部披露，或 NDA 下的投行材料
      - - IPO 准备度与投行流程
        - 交易所时间表、承销商阵容、申报状态和治理准备度
        - 当前价格含有 IPO 前溢价，不能盲目支付
        - 持续跟踪 KOSPI 流程披露，以及公司 / 投资方直接确认
      - - 战略退出证据
        - 真实战略兴趣信号，而非理论上的并购契合
        - 没有真实交易对手意愿证据前，不应把并购计入估值支撑
        - 董事会或投行尽调，而不是公共叙事外推
    notes: 各项按承销重要性排序；前三项会阻断任何高于继续研究的动作。
    claimRefs:
      - CV048
      - CV051
      - CV052
