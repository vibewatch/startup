      - number: '5.4'
        title: 软件生态：RBLN SDK、vLLM 集成与模型库
        blocks:
          - type: paragraph
            body: >
              Rebellions 软件平台（RBLN SDK）在 2026 年 5 月达到 0.10.3 版本，通过公司自有 PyPI mirror（pypi.rbln.ai）分发，也发布在公共 Python Package
              Index（pypi.org）上。SDK 包含三个包：rebel-compiler==0.10.3（把 PyTorch/TensorFlow 模型转换为 RBLN 二进制格式的 ahead-of-time
              compiler）、optimum-rbln==0.10.3（用于 LLM 模型准备的 HuggingFace Optimum 集成）和 vllm-rbln==0.10.3.post1（面向 Rebellions
              NPU 的 vLLM backend plugin）。vllm-rbln 包于 2026 年 5 月 18 日发布在 pypi.org，支持 vLLM v0.18.0。vllm-rbln 已实现 paged
              attention 和 continuous batching，能够支撑生产级 LLM serving。官方 vLLM 文档把 Rebellions NPU 列为受支持硬件后端，与 Google Cloud
              TPU、Intel Gaudi、AMD Instinct 和其他加速器并列，使其获得与成熟 NPU 厂商相同的一线集成层级。


              SDK 精度支持覆盖 FP32、FP16、FP8、FP6 和 FP4，覆盖领先 LLM 使用的完整范围。Kubernetes 中的设备命名遵循 rebellions.ai/ATOM（用于 RBLN-CA*
              ATOM 设备）和 rebellions.ai/REBEL（用于 RBLN-CR* REBEL 设备）模式。NPU Operator v0.4.0 于 2025 年 12 月获得 Red Hat
              OpenShift AI 认证，其 Helm chart 通过 OCI registry 分发，方便企业部署。Rebellions model zoo 包含 300+ 个受支持模型，覆盖 PyTorch 和
              TensorFlow 框架。不过，vllm-rbln 仍缺少若干 GPU 对齐功能：speculative decoding、distributed KV cache（支持跨节点内存共享）和
              prefill/decode disaggregation（支持异构 serving 架构）被列为开发中，而非已可用。截至 2026 年 5 月，GitHub
              organization（rebellions-sw）只包含 archived 或 internal repository，没有公开模型代码或 SDK 源码。
