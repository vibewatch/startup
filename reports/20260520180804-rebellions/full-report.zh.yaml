      - number: '3.5'
        title: 护城河耐久度与被替代风险
        blocks:
          - type: paragraph
            body: >
              Rebellions 的竞争护城河若存在，主要是地理和关系层面的，而不是技术层面的。Samsung 制造合作让它能以本土条件获得先进制程，外国芯片创业公司很难在韩国复制；SK Telecom 战略投资方关系为电信
              AI 部署提供优先首客路径；韩国 MSIT 的 AI 芯片政策要求（在主权 AI 项目中部署本土芯片）给了 Rebellions 一个事实上的受保护细分市场。上述护城河都不是永久的：Samsung 也可以为
              FuriosaAI 代工；SK Telecom 的持股可能被稀释或转让；政策要求也会变化。但在韩国市场，它们能提供 2–4 年竞争隔离期。


              被替代风险真实存在，且来自多个方向。Nvidia 永不停步的硬件路线图（H100 → H200 → GB200 → Rubin，每一代都压缩与 NPU 挑战者的性能差距）是主要风险。如果 Nvidia
              能以有竞争力的总拥有成本同时交付更高性能和更好能效，NPU 的价值主张就会收窄。2025 年 12 月 Groq-Nvidia 交易——Groq 创始人加入
              Nvidia——是最直接证据，说明即使不进行完整收购，Nvidia 也能通过吸收关键人才和技术来中和 NPU 挑战者。AMD 带来的商品化风险（ROCm 成熟、MI300X 部署）也会侵蚀「NPU
              是独特高效替代方案」的叙事。最后还存在多归属风险：云运营商和企业可以运行混合机群（Nvidia + NPU），这会降低采用 NPU 的紧迫性，并限制合同规模。Rebellions 与 Red Hat
              OpenShift AI 的集成（2025 年 12 月）是降低迁移摩擦的相关一步，但任何 NPU 挑战者要达到 CUDA 生态平价，仍需数年。
