  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引力可见度
        blocks:
          - type: paragraph
            body: >
              Rebellions 采用硬件加软件的收入模式。芯片（ATOM、REBEL-Quad/Rebel100）由内部设计，交由 Samsung Foundry
              在先进制程节点制造，并以独立加速卡（RebelCard）、整机服务器（RebelServer）和机架级系统（RebelRack、RebelPOD）销售。软件层是一个贴近开源生态的 SDK，支持
              vLLM、PyTorch、Triton、Hugging Face 和 Red Hat OpenShift AI；截至本次评审时点，公司把它随硬件打包提供，而不是单独变现。


              公开收入证据很少。Forbes Asia 2025 年 4 月人物稿审阅的韩国公司登记文件显示，FY2023 收入约 2.7 billion KRW（按 2023 年当时平均汇率约 1,300 KRW/USD，约
              $2.1 million）。这代表 ATOM 芯片带来的早期商业牵引；该芯片 2023 年 5 月进入量产，并已部署给 SK Telecom 数据中心部门、Kakao、Naver
              等客户。截至本报告日期，公司没有公开披露 FY2024 或 FY2025 收入；ARR、GMV 或芯片出货量也没有发布。


              CEO Sunghyun Park 在 2025 年 4 月 Forbes 人物稿中给出 2025 年收入目标 100 billion KRW（约 $68 million），意味着相对最后一个已知公开基线约跳升
              37×。本章审阅的任何来源都没有确认该目标是否达成。Series C 和 pre-IPO 新闻稿提到公司在日本、沙特阿拉伯和美国面向“企业和政府”部署，并称基于 ATOM 的芯片“支撑韩国最大的商业 AI
              服务”——这些表述能佐证客户牵引，但没有量化收入。


              定价没有公开价目表。公司把价值主张表述为推理工作负载下，相比 Nvidia H100 有更好的每瓦性能和总拥有成本；这意味着公司主打性价比定位，而不是公开标价模型。与 Samsung 的 turnkey
              合作覆盖芯片制造、HBM3E 内存和封装，Pegatron 与 Penguin Solutions 负责系统组装合作，说明渠道和伙伴经济性已经嵌进成本结构，但没有可用的利润分成数据。
