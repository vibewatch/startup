              对只做推理的 NPU 供应商来说，Nvidia 的 CUDA 生态是持续存在的采用门槛。企业和超大规模云客户已经在 CUDA 上搭建大量模型优化流水线，迁移需要显著重做工程。除非 Rebellions
              证明自己能在主权 AI 电信细分之外实现规模化生产迁移，否则 TAM 到 SOM 的转化率仍不确定。
