            title: 市场规模和增长证据由单一供应商 Nvidia 主导
            body: >-
              AI 芯片市场规模测算的主要来源，是 Nvidia 自身财务披露（SEC 10-K）。研究期间无法访问独立分析机构估计（Gartner、IDC、McKinsey，受 paywall/403
              限制）。用市场领导者收入作为市场代理，会引入乐观偏差——竞争对手收入（AMD、Google、Amazon 自研 ASIC）未单独披露，而 Nvidia 对「Compute &
