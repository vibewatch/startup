      - number: '4.2'
        title: 融资历史、投资人结构与资本基础
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 3 月 30 日，Rebellions 已通过五轮融资累计募集 $850 million，成为韩国融资额最高的 AI 芯片创业公司，也是韩国芯片行业首个独角兽。融资节奏尤其压缩：2025 年
              9 月至 2026 年 3 月的六个月里，公司募集 $650 million，占累计融资超过 75%。


              逐轮来看，最早是未披露金额的种子轮和 Series A，合计约 $76 million（根据 2024 年 1 月披露的“已融资超过 $200 million”，扣除 $124 million Series B
              推算）。$124 million Series B 于 2024 年 1 月 30 日完成，由 KT Corporation 领投；KT 是韩国主要数据中心运营商，也是战略客户。Korelya
              Capital（法国）、Korea Development Bank、Samsung Ventures 等参投。2024 年 7 月 23 日，公司又获得 $15 million Series B
              延展轮，投资方为 Saudi Aramco 旗下风险投资机构 Wa'ed Ventures；这是 Wa'ed 对韩国创业公司的首笔投资，也直接打开了沙特市场关系。


              $250 million Series C 于 2025 年 9 月 30 日完成，投后估值 $1.4 billion。Arm 以战略投资人身份领投——这一点重要，因为它带来 ARM
              架构路线图和生态关系入口——Samsung Ventures 与 Pegatron VC 也参与其中；后者总部在台湾，是关键制造伙伴。老股东 Korea Development Bank 和 Korelya
              Capital 继续跟投。2025 年 11 月 10 日，Series C 又获得延展，Kindred Ventures（首次投资韩国创业公司）和 Top Tier Capital Partners 加入，为
              IPO 前增加美国风险资本背书。


              $400 million pre-IPO 轮于 2026 年 3 月 30 日完成，投后估值 $2.34 billion。Mirae Asset Financial Group 领投；它是韩国最大资产管理机构，自
              Series A 起支持 Rebellions。Korea National Growth Fund 也参投，这是其在 K-Nvidia 国家 AI
              半导体计划下的首笔投资。本轮释放出强机构信心和隐性政府背书，但也带来公共基金投资常见义务，包括报告要求和募资用途的战略约束。


              投资人结构横跨战略半导体伙伴（Arm、Samsung、通过 SAPEON 股份进入的 SK Telecom）、电信 / 数据中心客户（KT）、主权能源资本（Wa'ed/Aramco）、韩国本土金融机构（Korea
              Development Bank、Mirae Asset、Korea National Growth Fund）和美国风投（Kindred、Top Tier Capital
              Partners）。这种广度降低了对单一资本方的依赖，也减少下一轮 rollover 风险；但战略和政府关联资本占比较高，可能带来纯财务投资人不会施加的治理或市场准入义务。
