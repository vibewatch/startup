      - number: '8.2'
        title: 当前价格支撑、融资背景与可比估值锚
        blocks:
          - type: paragraph
            body: >
              当前价格支撑首先来自融资势能，而不是经营披露。Rebellions 从 2025 年 9 月 $1.4 billion 的 Series C 估值，升至 2026 年 3 月约 $2.34 billion
              的投后估值，约六个月抬升约 67%。2026 年 4 月媒体将公司描述为正准备 KOSPI
              IPO，但本章审阅的来源中，没有可见的公开申报、价格区间或经审计招股书。换句话说，通常由公开市场尽调包强制披露的信息尚未打开，投资人已经在为 Pre-IPO 期权付费。

              可比分析同时强化了上行叙事和谨慎理由。Cerebras 说明，只要财务披露真实、增长可见，有收入支撑的 AI 芯片公司可以获得很高的公开市场估值。Groq、Tenstorrent 和 FuriosaAI
              说明，私人投资人仍愿意为 AI 硅片可选性支付数十亿美元估值。但 SambaNova 据报道探索出售、Graphcore 被 SoftBank 吸收，同样提醒我们：一旦资本强度、商业化或战略定位打破故事，独立
              AI 芯片公司的结局会突然压缩。相对于这组同行，Rebellions 仅看私人估值并不荒谬；真正紧绷的是，它披露的收入基础远薄于价格已经隐含的规模。
