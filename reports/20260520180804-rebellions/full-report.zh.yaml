      - number: '4.5'
        title: 财务缺口、披露限制与尽调阻碍
        blocks:
          - type: paragraph
            body: >
              Rebellions 是韩国私营公司，在提交 IPO 招股说明书之前，收入、毛利率、经营亏损、现金余额、烧钱速度、客户数和 ARR
              等重要财务指标没有公开披露义务。公司选择不披露任何财务数据，除韩国公司登记文件中的内容，以及个别高管在媒体采访中分享的信息之外。


              这给依赖公开来源的投资人或分析师制造了结构性尽调缺口。最后一个确认收入数字是 FY2023 的 2.7 billion KRW，早于 SAPEON 合并（2024 年 12 月）、REBEL-Quad
              发布（2025 年 8 月）、Series C（2025 年 9 月）和 pre-IPO 轮（2026 年 3 月）。公司最关键增长阶段的整整两个财年完全不透明。即便已披露的估值路径（2025 年 9 月
              $1.4 billion，2026 年 3 月 $2.34 billion），也无法用外部收入或利润倍数验证。


              客户数量和客户集中度缺失是一项具体风险：如果公司只有一两个大客户（韩国的 SK Telecom/Kakao/Naver，或海湾地区的 Saudi
              Aramco），收入增长可能夸大了可服务市场中的真实牵引。Series C 新闻稿称 ATOM 芯片“支撑韩国最大的商业 AI 服务”但没有点名，暗示单一锚定客户可能主导早期收入。


              对尽调而言，填补这些缺口的主要路径是：（1）直接索取 FY2024–2025 审计财务报表；（2）要求披露客户集中度（前 3 大客户收入贡献占比）；（3）获得 ATOM 和 REBEL-Quad
              芯片出货量；（4）审阅 Samsung Foundry 供应协议，确认 take-or-pay 承诺或最低采购量要求；（5）取得 IPO 准备时间表和承销商选择状态。
