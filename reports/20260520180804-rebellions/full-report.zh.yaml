      - number: '8.4'
        title: 退出准备度、证据缺口与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              现有公开证据支持 IPO 可能性，但不支持 IPO 已准备就绪。Seoul Economic Daily 的报道把 Rebellions 放进韩国 AI 芯片上市竞赛，KOSPI
              这一上市地点也意味着，一旦最终申报，公司必须给出丰富得多的披露。但当前公开记录仍没有披露经审计的 FY2024 或 FY2025
              收入、毛利率、积压订单、集中度或股权结构经济条款。公司因此处在披露真空地带：定价像后期 Pre-IPO 资产，文件透明度却更像风投支持的私营初创公司。

              这也限制了退出分析。从本章审阅来源看，KOSPI 上市仍是唯一可支撑的公开退出路径。战略收购方角度理论上可能存在，尤其在主权 AI 基础设施和非 Nvidia 供应链增值的世界里，但公开证据不足以让 M&A
              成为今天的估值支柱。正确做法不是在证据之外强行给出明确看多或看空结论，而是列出会改变判断的缺失文件。经审计 FY2024-FY2025
              财务、优先股堆叠细节、积压订单和客户集中度披露、经验证的复购部署数据，是从继续研究转向更建设性立场前所需的最低材料包。
