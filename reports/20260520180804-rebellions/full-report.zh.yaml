      - number: '3.3'
        title: GPU 在位者与超大规模云厂商自研 ASIC
        blocks:
          - type: paragraph
            body: >
              Nvidia 和 AMD 占据 GPU 在位者层。Nvidia 的优势同时来自硬件和软件：H100 的 LLM 推理速度相对 A100 提升 30x，GB200 NVL72 又在 H100 基础上再提升
              30x，这意味着 Nvidia 每一代都会重置性能基线。CUDA 软件生态约在 2006 年建立，拥有 4M+ 开发者和 3,800+ GPU
              加速应用，形成结构性切换成本；目前还没有挑战者在规模上系统性突破。每一家推理芯片创业公司，包括 Rebellions，都必须提供的不只是更好硬件，还包括迁移工具、运维支持和模型兼容性，足以匹配 CUDA
              用户已经拥有的能力。


              AMD Instinct MI325X（CDNA3 架构）提供 256 GB HBM3E 和 6 TB/s 带宽；AMD 声称其 AI 性能是竞争加速器的 1.3x。AMD 的 ROCm
              开源软件栈已经成熟，并越来越兼容 PyTorch 和主流 LLM 框架。对不想依赖 Nvidia 的云运营商和企业来说，AMD 是摩擦最低的替代方案：熟悉的 GPU 编程模型、广泛生态和多供应商采购。AMD 对
              Rebellions 的威胁不一定是取代 Nvidia，而是填补可信 GPU 替代品的角色，从而挤出推理 NPU 评估周期。


              超大规模云厂商自用 ASIC——Google Cloud TPU（Ironwood，第 7 代，每 pod 42.5 ExaFlops）和 AWS Trainium（Trainium3，3nm 制程，2.52
              PFLOPS FP8，相比 Trainium2 能效 4x）——是大型云部署中最强的替代威胁：这些芯片不对外销售，只会缩小 Rebellions 和其他外部芯片供应商可触达的云推理市场。Google TPU 支撑
              Gemini 和 1B+ 终端用户；AWS Trainium3 在 EC2 上支持 Anthropic 和其他主要 AI 客户。二者不算 Rebellions
              的直接竞争对手，因为它们不争夺同一个采购决策，但都会降低任何外部 AI 芯片供应商争取超大规模云客户时的可服务市场（SAM）。
