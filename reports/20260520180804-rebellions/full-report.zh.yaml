  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 投资逻辑
      - 支撑程度
      - 反向逻辑
      - 改变判断的证据
    rows:
      - - 主权 AI 定位让 Rebellions 拿到一个受保护的韩国需求切入口，许多西方同行没有这个位置。
        - 中
        - 主权 AI 需求具备战略意义，但不等于已经披露且可重复的收入。
        - 披露与主权或电信部署绑定的经审计国内合同收入和积压订单。
      - - 接入 Samsung 生态改善可制造性和战略可信度。
        - 中
        - 制造资源本身不能证明商业需求，也不能证明健康的单位经济性。
        - 按产品代际提供出货规模、重复订单和毛利率的第三方证据。
      - - RebelRack、RebelPOD 等系统级发布把变现面从单颗芯片拓宽到系统。
        - 中
        - 发布公告没有量化客户转化、利用率或定价权。
        - 具名生产部署，并披露规模、性能和商业条款。
      - - 非美国 AI 芯片资产稀缺，可能支撑 IPO 前估值溢价。
        - 中
        - 一旦披露不及预期或退出时点延后，稀缺性溢价会迅速反转。
        - 招股书级披露显示收入规模足以支撑溢价，而不只是靠稀缺性。
      - - 私有 AI 芯片同行显示，投资者仍愿为可选性付费。
        - 低
        - SambaNova 和 Graphcore 表明，商业化卡住后，可选性可能坍塌。
        - 证据显示 Rebellions 正走向 Cerebras 式收入披露，而不是 SambaNova/Graphcore 式不透明。
    notes: 投资逻辑真实存在，但主要是战略性的；反向逻辑是，公开财务证据仍大幅落后于估值。
