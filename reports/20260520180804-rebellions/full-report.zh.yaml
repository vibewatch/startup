      - number: '1.4'
        title: 产品演进、合作伙伴与公司里程碑
        blocks:
          - type: paragraph
            body: >
              Rebellions 的里程碑时间线，是后续章节可以直接复用、无需反复论证的事实主轴。公司在 2020 年创立时押注：AI
              推理——在生产规模运行训练好的模型——会从训练中分化成独立硬件市场；能效更高、面向特定用途的 NPU 可以在推理负载上胜过 Nvidia 的通用 GPU。ATOM 的商业成功和 2024
              年以来快速累积的资本，已经验证了这一判断。


              关键产品里程碑：ATOM 于 2022 年 6 月流片（Samsung 基于 GDDR6 的制程）；2023 年 5 月首次出货给 kt cloud，成为首款投入实时数据中心使用的韩国自研推理芯片；目标是在
              2024 年上半年采用 Samsung 5nm 量产。Samsung Electronics 于 2023 年 10 月成为正式共同开发伙伴，承诺以 Samsung 4nm 制程并集成 HBM3E 生产
              REBEL。REBEL SoC 于 2024 年 11 月流片，被称为全球首款采用 144GB HBM3E 的 UCIe-Advanced AI chiplet。REBEL-Quad 在 Hot Chips
              2025（2025 年 8 月）亮相，目标是 Blackwell 级性能。Rebel100 平台、RebelCard 加速器、RebelRack 和 RebelPOD 随 2026 年 3 月 pre-IPO
              轮一同发布，标志着 Rebellions 从只卖芯片转向集成 AI 基础设施系统。


              关键合作里程碑：SKT-Arm-Rebellions MOU（2026 年 4 月）约定共同开发主权 AI 推理基础设施，把 Arm 的 AGI CPU 与 Rebellions 的 RebelCard
              结合，先在 SKT 数据中心验证，再推向全球商业化。Red Hat 合作（2025 年 12 月）围绕由 Rebellions NPU 驱动的 Red Hat OpenShift AI 展开。NTT DOCOMO
              Innovations（DOCOMO）合作（2025 年 4 月）用于 AI 加速验证。SAPEON 合并公告（2024 年 6 月）、最终协议（2024 年 8 月）和交割（2024 年 12
              月）共同造就韩国首个 AI 芯片独角兽。日本子公司（2025 年 2 月）和沙特阿拉伯子公司（2025 年 8 月）构成区域落点。


              SKT 正在核心 AI 服务中测试配备 Rebellions NPU 的服务器，包括 A.Dot 通话摘要、PASS 垃圾信息过滤、PASS 金融助手和 X Caliber 服务。这是 ATOM
              在生产规模获得商业验证的主要证据。kt cloud 是最早投入使用的客户。Wa'ed Ventures 的投资打开了沙特阿拉伯市场。根据 REBEL-Quad Hot Chips 演示（2025 年 8
              月），ATOM 也已在日本和沙特阿拉伯部署，但部署规模没有公开量化。
