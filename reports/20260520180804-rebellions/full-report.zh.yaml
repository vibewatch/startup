      - number: '2.3'
        title: 增长驱动与采用约束——时点、预算和估值含义
        blocks:
          - type: paragraph
            body: >
              AI 推理市场最主要的驱动因素，是超大规模云厂商的资本开支承诺。Nvidia FY2026 C&N 收入同比增长 67%，确认云基础设施建设是市场的定义性引擎。训练负载启动了 GPU 支出浪潮，但随着生成式 AI
              从开发走向生产部署，面向数十亿终端用户运行 AI 模型的推理，正在推动下一段 capex。Epoch AI 研究显示，2009 年至 2022 年，ML 训练成本每年增长 0.49
              个数量级；随着模型规模扩大，市场对更高效推理芯片的需求被推高。


              第二个结构性驱动是地缘政治供应风险。根据 Nvidia 自身 10-K 文件，美国出口管制到 FY2026 已实质上让 Nvidia 退出中国数据中心计算市场。这会在重视 AI
              供应链独立性的市场中创造替代芯片供应商需求，包括韩国和更广泛的亚太市场。韩国由 Ministry of Science and ICT 牵头的主权 AI 芯片政策，并体现在 SKT 与 Rebellions
              的采购策略中，是对这一动态的直接政策回应。


              主要采用约束是 CUDA 生态锁定。Nvidia 的 CUDA 开发者平台已经积累十多年模型优化、工具链集成和开发者熟悉度。把现有 GPU 推理负载切换到 NPU
              替代方案，成本实质存在：团队必须迁移模型代码、验证准确率，并重建 MLOps 流水线。Rebellions 的 RBLN SDK 和 Red Hat OpenShift AI
              集成在应对这一约束，但还没有证明能在超大规模云厂商尺度上支撑广泛生产迁移。第二个约束是电力可得性：Nvidia 将数据中心电力约束列为需求逆风，这反过来有利于 Rebellions chiplet
              这样的高能效替代方案在受限部署中胜出。第三个约束是 benchmark 不透明：Rebellions 的 REBEL Quad chiplet（Hot Chips 2025）声称 TPS/W
              有突破，但截至研究日期尚未发布独立第三方 benchmark 结果。
