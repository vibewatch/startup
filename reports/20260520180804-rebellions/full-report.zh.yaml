  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Rebellions 所在的赛道，是半导体行业竞争最激烈的细分之一：面向数据中心部署的专用 AI 推理加速器。竞争格局至少分四层。第一层也是主导层是 Nvidia，其 Blackwell 架构（GB200
              NVL72）的 LLM 推理速度比上一代 H100 快 30x，每瓦性能高 25x，为所有挑战者设下必须追上、或在总拥有成本上可信压低的标杆。Nvidia H100 相比 A100 已经把 LLM 推理提升
              30x；连续的阶跃变化意味着每一代都会重置竞争门槛。


              第二层是 GPU 通才：AMD Instinct MI300/MI325X 系列以 256 GB HBM3E 内存和 6 TB/s 带宽，提供 Nvidia H100/H200 的直接替代方案，并由 ROCm
              开源软件栈支撑。AMD 同时瞄准训练和推理，竞争面很宽，这一点是 Rebellions 只做推理的产品无法匹配的。


              第三层——与 Rebellions 最直接竞争——由 AI 推理芯片创业公司组成：Groq（LPU/GroqCloud，$750M 融资后估值 $6.9B）、SambaNova（Dataflow
              RDU、SambaCloud）、Cerebras（Wafer Scale Engine 3）、Tenstorrent（Wormhole，开源 RISC-V）和
              FuriosaAI（RNGD/Renegade，512 TFLOPS，180W）。其中 FuriosaAI 是韩国市场最直接竞争对手，用相似的 180W 风冷形态瞄准同一批电信 / 主权 AI 客户。Groq
              已展示最大商业牵引力，但在 2025 年 12 月转向授权 Nvidia 技术，创始人兼总裁加入 Nvidia——这是该领域创业公司独立性遭遇的重大反向信号。


              第四层是会压缩 Rebellions 可服务市场的替代方案：Google Cloud TPU（Ironwood，每 pod 42.5 ExaFlops）和 AWS
              Trainium（Trainium3，3nm，相比上一代效率 4x）是超大规模云厂商自用芯片，不对外销售，但会限制 Rebellions 进入超大规模云客户。Hailo
              是边缘加速器公司，不参与数据中心推理竞争。内部自研（超大规模云厂商超出上述清单的自研 ASIC）是第五类，是最大 AI 支出方的现状选择。
