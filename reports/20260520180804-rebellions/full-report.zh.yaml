      - number: '3.4'
        title: 地理与相邻动态
        blocks:
          - type: paragraph
            body: >
              Hailo（以色列无晶圆厂半导体公司）处在边缘 AI 层，不与 Rebellions 在数据中心推理竞争。Hailo 的 Hailo-8、Hailo-10H 和 Hailo-15
              处理器瞄准嵌入式边缘平台——摄像头、汽车 ECU、机器人割草机、工业视觉系统——功耗区间为 1–10W。随着 AI 模型变小，边缘市场可能增长；但在 2026 年，Hailo 和 Rebellions
              服务的是完全不同的买方和负载。


              地理维度更关键。Rebellions 身处韩国主权 AI 生态，Samsung、SK Telecom 和国家政策要求带来西方竞争者难以复制的优先准入。FuriosaAI
              是这一韩国语境中唯一可信的同类对手。Groq 在沙特阿拉伯的存在，以及 Rebellions 2025 年与 SK Telecom 和 Arm 围绕 Saudi/MENA 主权 AI
              基础设施的合作，构成了一个高增长地区里的真实重叠。Tenstorrent 的 Samsung Securities 和 LG Electronics 支持方，与 Rebellions 自身的 Samsung
              代工和 SK Telecom 战略投资方共享机构关系——这可能让两家公司竞标同一批韩国企业 AI 合同。


              很多潜在 Rebellions 客户的现状替代方案，是继续依赖 Nvidia GPU：已经集成 H100 集群的 CSP 和企业，在 CUDA 软件、运维工具和应用兼容性上投入了大量沉没成本。从任何供应商切换到
              NPU——不只是 Rebellions——都会产生迁移成本，拖慢采用周期，并给 Nvidia 带来复利式先发优势。内部自研（定制 ASIC 开发）主要是超大规模云厂商的替代方案；Rebellions
              的目标客户（电信运营商、主权 AI 项目、中型 CSP）通常没有自研芯片所需的工程能力和规模，这为 Rebellions 等外部 NPU 供应商保留了位置。
