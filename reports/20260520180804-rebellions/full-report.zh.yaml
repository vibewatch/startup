  - id: FE004
    title: 产品成熟度与能力评估
    type: matrix
    layout: wide
    description: 评估 Rebellions 在关键硬件和软件维度上的产品成熟度、证据质量和竞争定位。
    approximationNotes: 成熟度评级是分析师判断，依据截至 2026 年 5 月公开产品数据、经同行评审的基准测试和独立评测。
    claimRefs:
      - CE001
      - CE010
      - CE024
      - CE025
      - CE031
      - CE037
    data:
      columns:
        - ATOM-Max 卡 / 服务器
        - REBEL-Quad / RebelServer
        - RBLN SDK（vllm-rbln）
        - 基准测试证据
        - ISV / 生态
      rows:
        - label: 出货状态
          values:
            - 2024 H1 起出货
            - 2026 年已出货
            - pypi.org 上 v0.10.3（2026 年 5 月）
            - ISSCC 2024 + ISSCC 2026 论文
            - Red Hat OpenShift AI 认证（2025 年 12 月）
        - label: 计算 / 容量
          values:
            - 每卡 128 TFLOPS FP16 / 64 GB GDDR6
            - 每卡 PFLOPS 级 FP8 / 144 GB HBM3E
            - FP32/FP16/FP8/FP6/FP4 精度
            - LLaMA 70B 56.8 TPS（ISSCC 2026）
            - 模型库 300+ 个模型
        - label: 证据质量
          values:
            - 公司声称 + TTA 认证（韩国）
            - IEEE 同行评审论文（高）
            - 公开 PyPI 包 + vLLM 文档
            - 未提交 MLPerf（反向）
            - NPU Operator v0.4.0（已认证）
        - label: 关键限制
          values:
            - 无 MLPerf；第三方认证仅限韩国
            - PCIe Gen5 对比 Nvidia Gen6；公开系统规格有限
            - 无投机解码 / 分布式 KV 缓存
            - 所有性能 / 瓦声明只来自公司或 TTA
            - GitHub 组织：无公开 SDK 源代码
        - label: 竞争风险
          values:
            - H100/MI300X 主导 CSP；无公开 H100 对比
            - 新进入者采用风险；亚洲之外客户基础有限
            - GPU vLLM 对等能力差距收窄，削弱差异化
            - 与 Nvidia/AMD 已发布 MLPerf 数据存在基准差距
            - 缺少更多 ISV 认证时，韩国 / 亚洲之外企业触达有限
        - label: 优势
          values:
            - 产品已出货；有真实客户部署（阿联酋、蒙古）
            - 首个公开的 UCIe-Advanced AI chiplet；HBM3E 容量
            - vLLM 一等集成层级；OpenAI 兼容 API
            - ISSCC 2026 同行评审结果在创业公司同类中最强
            - Arm + Samsung + Red Hat 生态覆盖
        - label: 尽调动作
          values:
            - 要客户性能日志，不要 TTA 摘要
            - 索取 MLPerf 提交路线图和 NDA 规格
            - 测试投机解码路线图；对标 GPU vLLM 做基准测试
            - 委托独立基准测试，对比 H100/MI300X
            - 跟踪 ISV 认证管线；索取企业销售管线 CRM 数据
