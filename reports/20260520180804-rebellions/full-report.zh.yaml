  - id: TM001
    title: 市场定义表
    description: >-
      Taxonomy of AI inference and adjacent chip market segments, included/excluded spend, buyers, and strategic
      relevance for Rebellions.
    notes: 细分市场和边界基于 Nvidia FY2026 10-K 的产品分部描述，以及 Rebellions 对 AI 推理的产品聚焦来界定。训练和网络分部相邻，但不属于可服务市场。
    sourceRefs:
      - SM001
      - SM003
      - SM009
    claimRefs:
      - CM001
      - CM003
      - CM006
    columns:
      - 细分市场 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 对 Rebellions 的意义
    rows:
      - - AI 推理芯片（NPU、推理优化 GPU、自定义 ASIC）
        - NPU/ASIC 硬件、推理服务器平台、推理 SDK 授权
        - 仅训练计算、通用 CPU 推理、消费级移动 NPU
        - CSP、电信运营商、企业数据中心、主权 AI 项目
        - 核心目标市场——Rebellions ATOM、REBEL、REBELRACE 都是专为推理打造的 NPU
      - - AI 训练加速器（Nvidia H100/H200、AMD MI300X、Google TPU）
        - 用于模型训练的 GPU/TPU 硬件、训练云实例
        - 仅推理部署（即便同一硬件也可能被使用）
        - AI 模型开发者、超大规模云厂商（Google、Amazon、Microsoft、Meta）
        - 相邻市场——Rebellions 明确不在这里竞争；不计入 SAM
      - - AI 网络和互连（NVLink、InfiniBand、自定义 fabric）
        - GPU 集群高带宽网络、交换芯片、DPU
        - 计算芯片；网络是支撑基础设施，不是 Rebellions 可服务市场
        - 与计算相同的 CSP 买方；通常与 Nvidia GPU 系统一起打包
        - 排除——Rebellions 的 NPU 产品线无法服务
      - - 消费级和移动边缘推理芯片（智能手机 NPU、IoT）
        - 嵌入移动设备和边缘摄像头的 SoC 推理引擎
        - 数据中心推理芯片；设计点不同（功耗、形态）
        - 消费电子 OEM（Apple、Qualcomm、Samsung Mobile）
        - 排除——Rebellions 面向数据中心规模工作负载，不是移动边缘
      - - 韩国主权 AI 基础设施（SKT、KT Cloud、Samsung SDS）
        - 本土 AI 芯片采购、云推理容量、主权 AI 计算
        - 不符合主权 AI 条件的全球来源 GPU 计算
        - 韩国科学技术信息通信部、SKT、KT、Samsung SDS、NAVER Cloud
        - 最高优先级 SAM 细分市场——Rebellions 拥有正式 SKT 合作和 Samsung 支持
