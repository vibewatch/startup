            title: FuriosaAI 是 Rebellions 在韩国最直接的竞争威胁
            body: >-
              FuriosaAI 和 Rebellions 共享同一本土市场、同样的 Samsung 制造准入、同样的 180W 风冷推理形态，以及同样的目标客户（韩国电信运营商、主权 AI 项目、LG
              生态企业）。FuriosaAI 于 2026 年 1 月开始出货 RNGD，2026 年 2 月拿下 LG CNS 合作，并计划 $500M pre-IPO 轮。在主权 AI
              采购预算有限且受政策驱动的市场中，两家公司可能瓜分可得的早期收入。Rebellions 的 SK Telecom 战略投资方位置是一道有意义的护城河，但不能排除 FuriosaAI 赢下竞争性韩国企业客户。
