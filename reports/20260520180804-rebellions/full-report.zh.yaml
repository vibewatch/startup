          - type: callout
            title: 韩国主权 AI 要求与 Samsung 代工准入具备结构性差异
            body: >-
              西方推理芯片创业公司（Groq、SambaNova、Cerebras、Tenstorrent）无法触达韩国主权 AI 项目要求，也没有 Samsung Foundry 作为本土代工伙伴，或 SK
              Telecom/SK Hynix 战略关系。在韩国以及部分亚洲市场，主权 AI 政策要求优先采购本土芯片，这些制度优势让 Rebellions 免受美国创业公司直接竞争。护城河耐久度取决于韩国 AI
