      - number: '5.7'
        title: 证据项
        blocks:
          - type: callout
            title: UCIe-Advanced 芯粒架构：首个公开量产 AI 芯片案例
            body: >
              REBEL-Quad 使用 16 Gbps 的 UCIe-Advanced die-to-die 互连，ServeTheHome 在 Hot Chips 2025 独立确认了这一点；这使 Rebellions
              成为首家公开营销并演示使用 UCIe-Advanced 封装的运行硅片的 AI 芯片公司。这是真正的架构先发主张，不是路线图事项。ISSCC 2026 同行评审论文以 LLaMA v3.3 70B 上 56.8
              TPS 给出可信性能锚点——这是硬件创业公司能提供的最强形式性能证据。
            calloutType: strength
            claimRefs:
              - CE008
              - CE010
              - CE011
          - type: callout
            title: 软件集成层级：vLLM 官方支持与 Red Hat 认证
            body: >
              Rebellions NPU 被列入官方 vLLM 文档，与 Google Cloud TPU、Intel Gaudi 和 AMD Instinct 并列，获得与更成熟替代方案相同的一线集成层级。NPU
              Operator v0.4.0 的 Red Hat OpenShift AI 认证让企业无需定制集成即可完成 Kubernetes 部署。vllm-rbln 出现在公共 PyPI index（不只是自有
              mirror）上，降低了开发者采用门槛，也显示供给侧对软件产品有信心。
            calloutType: strength
            claimRefs:
              - CE018
              - CE021
              - CE017
          - type: callout
            title: Samsung 单一供应链：逻辑、HBM 与封装
            body: >
              Rebellions 的 REBEL-Quad 产品在三项关键供应输入上完全依赖 Samsung：4nm SF4X 逻辑制造、HBM3E memory stack 和 CoWoS-S 先进封装。即使按
              Fabless 半导体标准看，这种单一供应商集中度也不常见；多数公司至少会在内存和逻辑之间使用两个供应商。Samsung 侧任何产能中断、良率危机或商业争议，都会在没有已披露替代方案的情况下叫停
              REBEL-Quad 供应。Samsung 同时是战略投资人，这带来对齐，但不能消除供应风险，也可能阻碍 Rebellions 在价格或产能分配上进行 arm's-length 谈判。
            calloutType: risk
            claimRefs:
              - CE026
          - type: callout
            title: 未提交 MLPerf：基准透明度缺口
            body: >
              截至 2026 年 5 月，Rebellions 尚未向 MLCommons MLPerf Inference Datacenter benchmark
              提交结果；这是超大规模云厂商和企业买家做竞争评估时使用的主要独立 AI 推理基准。所有主要加速器竞争对手（NVIDIA、AMD、Intel、Google、Qualcomm）都参与。没有 MLPerf
              数据，意味着投资人和潜在客户无法用统一方法独立比较 Rebellions 与 H100、MI300X 或 Gaudi 3 的性能。公司引用的 perf/watt 数字和 TTA 认证（韩国国家机构）不能替代
              MLPerf 可复现的第三方审查。这个缺口是尽调优先项，也可能说明 REBEL-Quad 在标准 MLPerf 条件下的基准结果尚未具备竞争力。
            calloutType: risk
            claimRefs:
              - CE024
              - CE025
          - type: callout
            title: RebelRack/RebelPOD 可用性表述不一致
            body: >
              2026 年 3 月 30 日新闻稿和投资人沟通称 RebelRack 与 RebelPOD 已“现已可用”，可供客户部署。但截至 2026 年 5 月研究日期，Rebellions
              网站导航仍把两款产品显示为“即将推出”。这种不一致是生产就绪度的反向信号：要么产品在供应确认前就被宣布，要么网站没有更新可用状态。两种解释都值得尽调关注——尤其要向 Rebellions 确认是否已有任何客户收到
              RebelRack 或 RebelPOD 系统。
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
          - type: callout
            title: 技术尽调优先事项
            body: >
              关键技术尽调事项：（1）索取 MLPerf Inference Datacenter 提交路线图，以及 REBEL-Quad 在标准工作负载下相对 H100/MI300X 的任何 NDA benchmark
              数据。（2）确认 RebelRack/RebelPOD 交付状态——取得客户采购订单或交付确认。（3）委托独立 benchmark 测试，用统一方法比较 ATOM-Max 与 GPU 基线，而不是依赖 TTA
              或公司材料。（4）审阅 vllm-rbln 关于 speculative decoding 和 distributed KV cache 的路线图——时间表和 gating dependency 会影响企业多节点
              serving 的可行性。（5）评估 Samsung 供应合同条款：产能预留、定价和替代供应商探索。
