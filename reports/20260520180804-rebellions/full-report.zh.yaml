      - number: '1.2'
        title: 创始人、领导层、关键人物风险与治理
        blocks:
          - type: paragraph
            body: >
              CEO Sunghyun Park（截至 2025 年 4 月 Forbes 画像为 40 岁）是公司最主要的公开人物，也是被引用最多的创始人。Park 拥有 MIT Computer Science and
              Artificial Intelligence Laboratory（CSAIL）的硕士和博士学位；在创办 Rebellions 前，他先后在 Intel（芯片工程）、SpaceX（系统工程）和 Morgan
              Stanley（金融行业）工作。他带领 Rebellions 完成五轮融资，并亲自谈判 SAPEON 合并。深科技硬件创始人通常难以同时具备技术深度和资本市场经验，Park
              的履历正是公司关键人物集中风险的主要来源。


              本章审阅的公开资料没有逐一披露另外四名联合创始人的姓名；这是一个尽调缺口，后续章节应当标出，因为更广泛创始团队的治理和继任安排仍未知。2024 年 12 月合并后，Park 被确认为合并后实体的 CEO。2025
              年 11 月，公司任命 Marshall Choy 为首席商务官，常驻硅谷；他拥有二十多年企业 AI 和系统经验，负责 Rebellions 新设美国实体和全球商业化拓展。


              公司仍是私人公司，治理透明度有限。合并后的董事会构成没有公开披露。SK Telecom 具备战略投资方身份，并可能拥有董事会席位，但公开材料没有确认确切董事会构成和投票权。这是重要尽调缺口：如果 SKT
              拥有董事会控制权或重大否决权，Rebellions 在韩国以外全球市场的战略决策独立性就会受到影响。合并条款规定，SKT、SK Square 和 SK Hynix 在交割前出售其 SAPEON 持股的
              3%，以确保 Rebellions 管理层成为合并后实体的多数股东；这部分缓解了治理被俘获的风险，但剩余持股分布没有披露。
