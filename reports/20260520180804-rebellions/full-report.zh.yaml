      - number: '3.6'
        title: 证据要点
        blocks:
          - type: callout
            title: Groq-Nvidia 授权交易是推理创业公司竞赛中最强反向信号
            body: >-
              2025 年 12 月，Groq 与 Nvidia 签署非独家授权协议，Groq 创始人 Jonathan Ross 和总裁 Sunny Madra 也离开 Groq 加入
              Nvidia；这是迄今最具体的证据，说明 Nvidia 可以在不完整收购的情况下中和领先的推理芯片挑战者。Groq 曾达到 $6.9B 估值、运营 2M+ 开发者账户，并从沙特阿拉伯拿到 $1.5B 主权 AI
              承诺；但其创始人仍判断，与 Nvidia 的关系在战略上优于继续独立竞争。对 Rebellions 和其他所有推理 NPU 创业公司来说，这笔交易意味着芯片创业公司的可持续结局，可能是授权给 Nvidia 或被
              Nvidia 收购，而不是持续拿到独立市场份额。
