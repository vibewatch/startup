      - number: '4.3'
        title: 成本结构、资本强度与 Fabless 模式经济性
        blocks:
          - type: paragraph
            body: >
              Rebellions 是一家 Fabless 半导体公司。该模式省掉了 Samsung 或 Intel 这类 IDM 需要投入的数十亿美元制造资本开支，但换来另一种资本强度：每次流片都要向 Samsung
              Foundry 支付反复发生的 NRE（一次性工程）和掩膜版成本，还要为芯片设计中使用的第三方 IP 持续支付版税或许可费。


              Samsung Foundry 在先进制程节点上制造 Rebellions 芯片。ATOM 芯片采用领先制程并配 GDDR6 内存；REBEL-Quad 使用芯粒架构和 HBM3E 内存。Samsung
              Foundry 公开能力覆盖 14/10/8/5/4nm FinFET 和 3nm GAA，5nm 起使用 EUV，并提供适配 Rebellions 芯粒路线的 3D/2.5D 集成封装方案。在带 EUV 的
              sub-5nm 节点上，单次流片仅掩膜版成本就可能达到 $20–80 million（行业分析师估计，并非 Rebellions 专属数据），意味着每一代新芯片在首片晶圆出货前，就会消耗一轮融资的相当大一部分。


              与 Samsung 的 turnkey 关系覆盖硅片制造、HBM3E 内存供应（通过 SK Hynix 和 Samsung Electronics
              获取）和封装，简化了供应商管理，但也集中供应链风险。Samsung Foundry 的任何良率问题、产能分配变化或 HBM3E 供应约束，都会直接影响 Rebellions 履约客户订单的能力。Forbes
              报道称，Park 承认“foundry 产能短缺”和“HBM 短缺”是结构性风险。这些是全行业约束，并非 Rebellions 独有；但相较 TSMC 或 Samsung
              的超大规模客户，小客户在产能优先级上的议价能力更弱。


              成本端看，Rebellions 这一阶段的 Fabless AI 芯片创业公司通常承担三类成本：（1）研发是最大运营费用，由芯片设计工程师人数驱动；（2）销货成本（COGS）包括晶圆、内存、封装，以及
              Pegatron 带来的系统组装成本；（3）销售与营销似乎正在增加，因为 Chief Business Officer Marshall Choy
              领导下的美国团队在扩张，日本和沙特阿拉伯子公司也已开设。FY2023 净亏损 13.7 billion KRW（约 $10.5M），对应收入 2.7 billion
              KRW，说明当时经营利润率深度为负；此后的扩张——尤其是 SAPEON 合并（2024 年 12 月）和 REBEL-Quad 量产——应当显著推高收入和支出，但没有 FY2024–2025 财务数据可验证。


              成本结构的反向情景是：AI 芯片创业公司在硬件销售毛利转正所需规模到来前，需要持续融资来支撑反复流片周期、设计团队扩张和 go-to-market 投入。公司未公开披露毛利率，外部无法确认 ATOM
              芯片是否跑通正向单机经济性。公司强调总拥有成本定位，意味着硬件毛利可能很薄，或者未来需要软件 / 服务补贴。
