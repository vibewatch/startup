            title: 韩国数据中心规模化推理 NPU 的先发者
            body: >-
              ATOM 是唯一确认已在实时数据中心部署的韩国自研推理 NPU（kt cloud 自 2023 年 5 月使用，SKT 截至 2025 年中在测试），让 Rebellions
              在任何本土竞争对手之前拥有经过商业验证的产品。与 Samsung 在 5nm 和 4nm 上的代工关系，是有意义的供应链优势，新进入者很难快速复制。
