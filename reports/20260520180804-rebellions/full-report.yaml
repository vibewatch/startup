      - number: '8.4'
        title: Exit readiness, evidence gaps, and final diligence asks
        blocks:
          - type: paragraph
            body: >
              Public evidence today supports an IPO possibility, not IPO readiness. Coverage in Seoul Economic Daily
              places

              Rebellions in the Korean AI-chip listing race, and the existence of the KOSPI venue means an eventual
              filing

              would force a much richer disclosure set. But the current public record still does not reveal audited
              FY2024

              or FY2025 revenue, gross margin, backlog, concentration, or cap-table economics. That leaves the company
              in a

              disclosure no-man's-land: priced like a late-stage pre-IPO asset, but documented more like a
              venture-backed

              private startup.


              That also limits exit analysis. A KOSPI listing remains the only supportable public exit path visible from

              sources reviewed here. A strategic-acquirer angle may exist in theory, especially in a world where
              sovereign-AI

              infrastructure and non-Nvidia supply chains gain value, but public evidence does not justify using M&A as
              a

              valuation pillar today. The correct response is not to force a hard bullish or bearish call beyond the
              evidence;

              it is to specify the missing documents that would change the view. Audited FY2024-FY2025 financials,

              preference-stack details, backlog and customer concentration disclosure, and validated repeat deployment
              data are

              the minimum set required before moving from research-more to a more constructive stance.
