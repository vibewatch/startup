      - number: '4.5'
        title: Financial Gaps, Disclosure Limits, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >
              Rebellions' status as a private Korean company means that material financial metrics—revenue, gross
              margin, operating loss, cash on hand, burn rate, customer count, and ARR—are not required to be publicly
              disclosed until an IPO prospectus is filed. The company has chosen not to release any financial data
              beyond what appears in Korean corporate registry filings and what individual executives have shared in
              media interviews.


              This creates a structural diligence gap for any investor or analyst relying on public sources. The last
              confirmed revenue figure is FY2023's 2.7 billion KRW, which predates the SAPEON merger (December 2024),
              the REBEL-Quad launch (August 2025), the Series C (September 2025), and the pre-IPO round (March 2026).
              Two full fiscal years of the company's most critical growth phase are opaque. Even the disclosed valuation
              trajectory ($1.4 billion in September 2025, $2.34 billion in March 2026) cannot be validated against
              revenue or earnings multiples from external data.


              The absence of customer count and customer concentration data is a specific risk: a company with one or
              two large customers (SK Telecom/Kakao/Naver in Korea, Saudi Aramco in the Gulf) could show revenue growth
              that overstates addressable traction. The Series C press release notes ATOM chips "power Korea's largest
              commercial AI service" without identifying it, suggesting a single anchor customer may dominate early
              revenue.


              For diligence, the primary path to closing these gaps is to: (1) request audited FY2024–2025 financial
              statements directly; (2) ask for customer concentration disclosure (top-3 revenue contribution as a
              percentage); (3) obtain chip unit shipment figures for ATOM and REBEL-Quad; (4) review the Samsung Foundry
              supply agreement for take-or-pay commitments or minimum volume requirements; and (5) obtain the IPO
              readiness timeline and underwriter selection status.
