        - id: package-layer
          label: 'Package: Multi-Die Package (ATOM MDP) | CoWoS-S + UCIe-Advanced (REBEL-Quad)'
          detail: >-
            ATOM: 4 dies in MDP. REBEL: Samsung CoWoS-S advanced package; Alphawave UCIe-Advanced SerDes at 16
            Gbps/lane.
