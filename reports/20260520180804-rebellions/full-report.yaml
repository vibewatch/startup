  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >
              Rebellions can support a serious investment conversation because it is not just another undifferentiated
              AI

              chip startup. The company has raised unusually large capital for a Korean semiconductor venture, has deep

              alignment with Samsung's manufacturing stack, and sits inside a sovereign-AI narrative that gives it a
              more

              protected domestic demand path than many Western inference-chip peers. The official March 2026 pre-IPO

              announcement also shows the company is trying to move from single-card silicon toward system-level
              products

              such as RebelRack and RebelPOD, which is strategically important because customers buy deployable
              inference

              capacity rather than standalone dies.


              The anti-thesis is more important at today's price. The last publicly disclosed revenue baseline is still
              only

              2.7 billion KRW for FY2023, paired with a 13.7 billion KRW net loss, and the public record reviewed for
              this

              chapter still does not disclose FY2024 or FY2025 actual revenue, gross margin, backlog, customer count, or

              repeat-order metrics. That means the current mark is not underwritten by visible commercial scale; it is

              underwritten by optionality. Because the valuation already embeds successful commercialization and an
              eventual

              IPO path, the right stance is research-more, not buy. Confidence should be low, risk high, and entry

              discipline strict until audited or prospectus-grade financial disclosure catches up to the financing
              story.
            claimRefs:
