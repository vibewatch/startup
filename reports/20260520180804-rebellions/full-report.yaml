      - CM001
      - CM003
      - CM006
    columns:
      - Segment / Category
      - Included Spend
      - Excluded Spend
      - Buyer / Payer
      - Relevance to Rebellions
    rows:
      - - AI inference chips (NPUs, inference-optimized GPUs, custom ASICs)
        - NPU/ASIC hardware, inference server platforms, inference SDK licensing
        - Training-only compute, general-purpose CPU inference, consumer mobile NPUs
        - CSPs, telcos, enterprise data centers, sovereign AI programs
        - Core target market — Rebellions ATOM, REBEL, REBELRACE are purpose-built inference NPUs
      - - AI training accelerators (Nvidia H100/H200, AMD MI300X, Google TPUs)
        - GPU/TPU hardware for model training, training cloud instances
        - Inference-only deployments (though same hardware may be used)
        - AI model developers, hyperscalers (Google, Amazon, Microsoft, Meta)
        - Adjacent market — Rebellions explicitly does NOT compete here; excluded from SAM
      - - AI networking and interconnect (NVLink, InfiniBand, custom fabrics)
        - High-bandwidth networking for GPU clusters, switch chips, DPUs
        - Compute chips; networking is enabling infrastructure, not addressable for Rebellions
        - Same CSP buyers as compute; often bundled with Nvidia GPU systems
        - Excluded — not addressable by Rebellions' NPU product line
      - - Consumer and mobile edge inference silicon (smartphone NPUs, IoT)
        - SoC inference engines embedded in mobile devices, edge cameras
        - Data center inference chips; different design point (power, form factor)
        - Consumer electronics OEMs (Apple, Qualcomm, Samsung Mobile)
        - Excluded — Rebellions targets data-center-scale workloads, not mobile edge
      - - Korean sovereign AI infrastructure (SKT, KT Cloud, Samsung SDS)
        - Domestic AI chip procurement, cloud inference capacity, sovereign AI compute
        - Globally-sourced GPU compute not qualifying as sovereign AI
        - Korean Ministry of Science and ICT, SKT, KT, Samsung SDS, NAVER Cloud
        - Highest-priority SAM segment — Rebellions has formal SKT partnership and Samsung backing
