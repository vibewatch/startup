      - number: '5.4'
        title: Software Ecosystem — RBLN SDK, vLLM Integration, and Model Zoo
        blocks:
          - type: paragraph
            body: >
              The Rebellions software platform (RBLN SDK) reached version 0.10.3 in May 2026, distributed on the
              company's proprietary PyPI mirror (pypi.rbln.ai) and also on the public Python Package Index (pypi.org).
              The SDK comprises three packages: rebel-compiler==0.10.3 (the ahead-of-time compiler that converts
              PyTorch/TensorFlow models to the RBLN binary format), optimum-rbln==0.10.3 (HuggingFace Optimum
              integration for LLM model prep), and vllm-rbln==0.10.3.post1 (the vLLM backend plugin for the Rebellions
              NPU). The vllm-rbln package was released on pypi.org on May 18, 2026, and supports vLLM v0.18.0. Both
              paged attention and continuous batching are implemented in vllm-rbln, enabling production-quality LLM
              serving. Rebellions' NPU is listed as a supported hardware backend in the official vLLM documentation
              alongside Google Cloud TPU, Intel Gaudi, AMD Instinct, and other accelerators, giving it the same
              first-class integration tier as established NPU players.


              The SDK's precision support spans FP32, FP16, FP8, FP6, and FP4, covering the full range used by leading
              LLMs. Device naming in Kubernetes follows the patterns rebellions.ai/ATOM (for RBLN-CA* ATOM devices) and
              rebellions.ai/REBEL (for RBLN-CR* REBEL devices). The NPU Operator v0.4.0 was certified for Red Hat
              OpenShift AI in December 2025, and its Helm chart is distributed via OCI registry for streamlined
              enterprise deployment. The Rebellions model zoo includes 300+ supported models covering PyTorch and
              TensorFlow frameworks. However, several GPU-parity features remain absent in vllm-rbln: speculative
              decoding, distributed KV cache (enabling cross-node memory sharing), and prefill/decode disaggregation
              (enabling heterogeneous serving architectures) are listed as in-development rather than available. The
              GitHub organization (rebellions-sw) contains only archived or internal repositories with no public model
              code or SDK source as of May 2026.
