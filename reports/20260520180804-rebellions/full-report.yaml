      - number: '3.3'
        title: GPU Incumbents and Hyperscaler ASICs
        blocks:
          - type: paragraph
            body: >
              Nvidia and AMD occupy the GPU incumbent tier. Nvidia's dominance is reinforced by both hardware and
              software: the H100's 30x LLM inference speedup over A100, and the GB200 NVL72's further 30x improvement
              over H100, mean that successive Nvidia generations each reset the performance baseline. The CUDA software
              ecosystem—established circa 2006, with 4M+ developers and 3,800+ GPU-accelerated applications—creates
              structural switching costs that no challenger has systematically overcome at scale. Every inference chip
              startup, including Rebellions, must offer not just better hardware but migration tooling, operator
              support, and model compatibility that matches what CUDA users already have.


              AMD's Instinct MI325X (CDNA3 architecture) offers 256 GB HBM3E and 6 TB/s bandwidth, and AMD claims 1.3x
              AI performance versus competitive accelerators. AMD's ROCm open-source software stack is mature and
              increasingly compatible with PyTorch and popular LLM frameworks. For cloud operators and enterprises that
              prefer not to depend on Nvidia, AMD represents the lowest-friction alternative: familiar GPU programming
              model, broad ecosystem, and multi-vendor sourcing. AMD's threat to Rebellions is not necessarily replacing
              Nvidia but filling the role of a credible GPU alternative, which can crowd out inference NPU evaluation
              cycles.


              Hyperscaler captive ASICs—Google Cloud TPU (Ironwood, 7th generation, 42.5 ExaFlops per pod) and AWS
              Trainium (Trainium3, 3nm process, 2.52 PFLOPS FP8, 4x energy efficiency vs Trainium2) represent the
              strongest substitute threat among large cloud deployments: these chips are not available externally and
              serve only to shrink the cloud inference market addressable by Rebellions and other external chip vendors.
              Google TPU powers Gemini and 1B+ end users; AWS Trainium3 supports Anthropic and other major AI customers
              on EC2. Neither is a direct competitor to Rebellions in the sense of competing for the same purchase
              decision, but both reduce the SAM for any external AI chip vendor seeking hyperscaler accounts.
