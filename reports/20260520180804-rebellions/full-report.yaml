  - id: FE004
    title: Product Maturity and Capability Assessment
    type: matrix
    layout: wide
    description: >-
      Assessment of Rebellions' product maturity, evidence quality, and competitive positioning across key hardware and
      software dimensions.
    approximationNotes: >-
      Maturity ratings are analyst judgments based on publicly available product data, peer-reviewed benchmarks, and
      independent reviews as of May 2026.
    claimRefs:
      - CE001
      - CE010
      - CE024
      - CE025
      - CE031
      - CE037
    data:
      columns:
        - ATOM-Max Card/Server
        - REBEL-Quad / RebelServer
        - RBLN SDK (vllm-rbln)
        - Benchmark evidence
        - ISV / ecosystem
      rows:
        - label: Shipping status
          values:
            - Shipping since H1 2024
            - Shipping as of 2026
            - v0.10.3 on pypi.org (May 2026)
            - ISSCC 2024 + ISSCC 2026 papers
            - Red Hat OpenShift AI certified (Dec 2025)
        - label: Compute / capacity
          values:
            - 128 TFLOPS FP16 / 64 GB GDDR6 per card
            - PFLOPS-class FP8 / 144 GB HBM3E per card
            - FP32/FP16/FP8/FP6/FP4 precision
            - 56.8 TPS LLaMA 70B (ISSCC 2026)
            - 300+ models in model zoo
        - label: Evidence quality
          values:
            - Company claims + TTA cert (Korea)
            - Peer-reviewed IEEE paper (high)
            - Public PyPI package + vLLM docs
            - No MLPerf submission (adverse)
            - NPU Operator v0.4.0 (certified)
        - label: Key limitation
          values:
            - No MLPerf; Korea-only 3rd-party cert
            - PCIe Gen5 vs Nvidia Gen6; limited public system specs
            - No speculative decoding / dist. KV cache
            - All perf/watt claims company or TTA only
            - 'GitHub org: no public SDK source code'
        - label: Competitive risk
          values:
            - H100/MI300X dominate CSP; no public H100 comparison
            - New-entrant adoption risk; limited customer base outside Asia
            - GPU vLLM parity gap narrows differentiator
            - Benchmark gap vs Nvidia/AMD published MLPerf data
            - Enterprise reach limited outside Korea/Asia without more ISV certs
        - label: Strength
          values:
            - Shipping product; real customer deployments (UAE, Mongolia)
            - First public UCIe-Advanced AI chiplet; HBM3E capacity
            - First-class vLLM integration tier; OpenAI-compatible API
            - ISSCC 2026 peer-reviewed result is strongest in class for startup
            - Arm + Samsung + Red Hat ecosystem coverage
        - label: Diligence action
          values:
            - Request customer performance logs, not TTA summaries
            - Request MLPerf submission roadmap and NDA specs
            - Test speculative decoding roadmap; benchmark vs GPU vLLM
            - Commission independent benchmark vs H100/MI300X
            - Track ISV cert pipeline; request enterprise pipeline CRM data
