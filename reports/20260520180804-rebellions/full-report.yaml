      - number: '8.3'
        title: Bull, base, and bear scenarios plus thesis-break triggers
        blocks:
          - type: paragraph
            body: >
              Scenario analysis is more defensible than point-estimate multiple work because the company does not yet
              give

              public investors the operating disclosure needed for a clean revenue or EBITDA framework. In the bear
              case,

              Rebellions remains strategically interesting but commercially under-evidenced: FY2024-FY2025 revenue still
              is

              not disclosed, the IPO slips, and public financials reveal a business much smaller than the current price

              requires. That supports a roughly $0.8 billion-$1.2 billion range. In the base case, the company shows
              enough

              audited scale, customer concentration looks manageable, and the IPO path remains viable, which supports
              roughly

              $1.5 billion-$2.5 billion. In the bull case, sovereign-AI deployments translate into visible
              commercialization,

              global design wins, and strong IPO demand, supporting roughly $3 billion-$5 billion.


              The problem for a new investor is that the current $2.34 billion mark already sits near the upper half of
              that

              base-case band. That means the next major disclosure event matters a great deal. The cleanest thesis-break

              trigger is audited or IPO-filed revenue that lands materially below what a $2.34 billion price implies. A

              second trigger is process-based: if the IPO is delayed or withdrawn without offsetting evidence of scaled

              deployments, the scarcity premium should compress quickly. This is why the downside is not theoretical —
              it is

              concentrated in a small number of highly monitorable disclosures.
