      - number: '3.5'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >
              Rebellions' competitive moats—to the extent they exist—are primarily geographic and relational rather than
              technical. The Samsung manufacturing partnership provides leading-edge process access on domestic terms
              that foreign chip startups cannot easily replicate in Korea; the SK Telecom strategic investor
              relationship provides a preferential first-customer pathway for telco AI deployments; and the Korean MSIT
              AI chip policy mandate (requiring domestic chip deployment in sovereign AI programs) gives Rebellions a de
              facto protected market segment. None of these moats are permanent: Samsung could also manufacture for
              FuriosaAI; SK Telecom's stake could dilute or be transferred; and policy mandates can change. But they
              provide a 2–4 year runway of competitive insulation in the Korean market.


              The displacement risks are real and multi-directional. Nvidia's relentless hardware roadmap (H100 → H200 →
              GB200 → Rubin, each iteration compressing the performance gap with NPU challengers) is the primary risk.
              If Nvidia can deliver both higher performance AND better power efficiency at competitive total cost of
              ownership, the NPU value proposition narrows. The December 2025 Groq-Nvidia deal—where Groq's founders
              joined Nvidia—is the most direct evidence that Nvidia can neutralize NPU challengers through acquisition
              of their key talent and technology, even without a full acquisition. Commoditization risk from AMD (ROCm
              maturation, MI300X deployment) also erodes the narrative of NPUs as uniquely efficient alternatives.
              Finally, multi-homing risk exists: cloud operators and enterprises can run mixed fleets (Nvidia + NPU),
              which reduces the urgency of NPU adoption and limits contract sizes. Rebellions' Red Hat OpenShift AI
              integration (December 2025) is a relevant step toward reducing migration friction, but CUDA ecosystem
              parity remains years away for any NPU challenger.
