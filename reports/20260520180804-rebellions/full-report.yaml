      - number: '5.2'
        title: ATOM Generation — Architecture, Specifications, and Deployments
        blocks:
          - type: paragraph
            body: >
              The ATOM SoC is Rebellions' first-generation AI inference chip, taped out June 2022 and shipping since H1
              2024 in the ATOM-Max product family. Each ATOM chip is rated at 32 TFLOPS FP16, 128 TOPS INT8, and 256
              TOPS INT4, with 16 GB of GDDR6 memory at 256 GB/s bandwidth per chip (16 Gbps on a 128-bit bus). The
              flagship ATOM-Max card (model RBLN-CA25) integrates four ATOM chips in a multi-die package, delivering 128
              TFLOPS FP16, 512 TOPS INT8, and 1024 TOPS INT4 at 350 W TDP, with a total of 64 GB GDDR6 at 1024 GB/s
              aggregate memory bandwidth. The card uses a PCIe Gen5 x16 host interface and occupies a full-height,
              full-length dual-slot form factor. This architecture was independently confirmed by Chips and Cheese at
              Supercomputing 2024.


              The ATOM-Max Server integrates eight ATOM-Max cards in a 4U chassis, yielding 1024 TFLOPS FP16 aggregate,
              512 GB GDDR6, and 8 TB/s total memory bandwidth. Server power draw is 3.4 kW typical and 4.3 kW maximum,
              within a standard 5 kW rack power envelope. The server runs Ubuntu, RHEL, AlmaLinux, and Rocky Linux, with
              out-of-box support for vLLM, Triton, Kubernetes, and Docker. The ATOM-Max POD extends to rack scale: an
              8-server mini-POD provides 64 NPUs, 512 GB of GDDR6 (8 TB/s), and 400 GB/s RDMA fabric for inter-node
              communication, enabling distributed tensor-parallel inference. ATOM was presented at ISSCC 2024 alongside
              AMD and Intel papers and described as mass-production ready. In the field, ATOM cards are deployed at
              ECOPEACE in the UAE (2× performance-per-watt versus GPU baseline, TTA-certified) and at Mongolia customs
              (2.7× TPS/Watt versus GPU, company-cited), with deployments also reported in Saudi Arabia and Japan.
