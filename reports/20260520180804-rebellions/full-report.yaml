      - number: '8.2'
        title: Current price support, financing context, and comparable valuation anchors
        blocks:
          - type: paragraph
            body: >
              The current price support case starts with financing momentum rather than operating disclosure. Rebellions

              moved from a $1.4 billion Series C valuation in September 2025 to an approximately $2.34 billion
              post-money

              valuation in March 2026, a roughly 67% step-up in about six months. Media coverage in April 2026 framed
              the

              company as gearing up for a KOSPI IPO, but no public filing, price range, or audited prospectus was
              visible in

              the sources reviewed for this chapter. In other words, investors are paying for a pre-IPO option before
              the

              usual public-market diligence package has been forced into the open.


              Comparable analysis reinforces both the upside narrative and the caution. Cerebras shows that
              revenue-backed

              AI chip companies can earn large public-market valuations when financial disclosure is real and growth is

              visible. Groq, Tenstorrent, and FuriosaAI show that private investors will still pay multibillion-dollar
              marks

              for AI silicon optionality. But SambaNova's reported sale exploration and Graphcore's absorption by
              SoftBank

              are equally important reminders that independent AI-chip outcomes can compress abruptly when capital
              intensity,

              commercialization, or strategic positioning break the story. Relative to this peer set, Rebellions is not
              an

              absurd outlier on private valuation alone; it is stretched because its disclosed revenue base is far
              thinner

              than the price already implies.
            claimRefs:
