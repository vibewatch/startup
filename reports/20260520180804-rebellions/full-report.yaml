            body: >-
              Rebellions' customer story is easiest to understand by buyer workflow rather than by a simple logo count.
              Official solutions and product pages show the company selling inference infrastructure into telecom,
              sovereign AI, enterprise AI, and data-center environments, which means the economic buyer is usually a
              cloud or infrastructure operator rather than an application team. The public record then splits into three
              evidence tiers. First, there is direct production proof in Korea through KT/kt cloud and SK Telecom.
              Second, there is third-party reported roster evidence for other Korean cloud divisions plus Saudi-linked
              demand. Third, there is broader but thinner expansion evidence across Japan, the United States, and
              Thailand.


              This distinction matters because public customer depth is uneven. KT and SKT are supported by direct
              company statements or customer-adjacent proof, while Kakao, Naver, Saudi Aramco, and the
              U.S./Japan/Thailand geographies are mainly supported by Forbes and company fundraising announcements. That
              is enough to conclude Rebellions has moved beyond a single-customer story, but not enough to underwrite
              broad commercial breadth with high confidence.
