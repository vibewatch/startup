  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat or risk
      - Direction
      - Severity
      - Mitigation / diligence ask
    rows:
      - - Nvidia CUDA software ecosystem lock-in
        - Risk (for all challengers)
        - High
        - >-
          Rebellions SDK must achieve CUDA compatibility or offer friction-free migration; Red Hat OpenShift AI
          integration is a partial mitigation but CUDA parity is years away
      - - FuriosaAI competition for Korean sovereign AI budget
        - Risk (direct)
        - High
        - >-
          Both companies target the same Korean telco/government customers; Rebellions' SK Telecom investor stake is a
          moat but FuriosaAI's LG CNS partnership creates a parallel channel
      - - 'Groq-Nvidia licensing signal: startup talent/IP migration to Nvidia'
        - Risk (ecosystem)
        - Medium-High
        - >-
          Groq founder Jonathan Ross and president Sunny Madra joined Nvidia (Dec 2025); Nvidia can systematically
          acquire startup technology and talent as a competitive defense mechanism
      - - Samsung manufacturing access (Rebellions)
        - Moat
        - Medium
        - >-
          Rebellions' Samsung Foundry fab and co-development agreement provide domestic fab access unavailable to
          Western competitors; however, Samsung could also manufacture for FuriosaAI and other Korean companies
      - - Korean MSIT sovereign AI mandate
        - Moat
        - Medium
        - >-
          Korean government policy preferring domestic AI chips gives Rebellions (and FuriosaAI) a protected home
          market; risk is policy reversal or mandate expansion to FuriosaAI
      - - Tenstorrent Samsung/LG investor overlap
        - Risk
        - Medium
        - >-
          Tenstorrent raised $693M with Samsung Securities and LG Electronics as lead investors—the same institutional
          ecosystem that includes Rebellions' Samsung fab partner; creates potential for institutional channel conflict
      - - Nvidia hardware roadmap compression (Rubin next gen)
        - Risk
        - High
        - >-
          Each Nvidia generation (A100→H100 30x; H100→GB200 30x) resets the NPU performance/TCO value proposition;
          Rebellions' REBEL must maintain a generation-ahead efficiency advantage to avoid being outperformed before
          reaching volume production
      - - AMD ROCm ecosystem maturation
        - Risk
        - Medium
        - >-
          AMD ROCm increasingly compatible with PyTorch/HuggingFace; if ROCm achieves near-CUDA compatibility, buyers
          may prefer AMD's familiar GPU model over a novel NPU
      - - SK Telecom strategic investor governance
        - Risk (governance)
        - Low-Medium
        - >-
          SK Telecom holds strategic investor status post-merger; extent of board influence and potential for direction
          conflicts with global expansion not publicly disclosed
      - - Customer multi-homing / mixed NPU+GPU fleets
        - Risk
        - Medium
        - >-
          Enterprise and cloud customers may run mixed fleets (Nvidia H100 + NPU supplement); this limits Rebellions to
          secondary workloads rather than primary inference fleet replacement
    notes: >-
      Severity ratings are the author's analytical judgment based on publicly available evidence; no company has
      confirmed or ranked these risks. "Direction" refers to whether the factor benefits Rebellions (Moat) or threatens
      it (Risk). Mitigation paths are prescriptive diligence suggestions, not confirmed company plans.
