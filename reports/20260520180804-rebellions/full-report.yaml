  - id: FE002
    title: Customer Deployment Workflow
    type: flow
    layout: standard
    description: >-
      End-to-end deployment workflow for a customer deploying LLM inference on Rebellions hardware, from model
      preparation through production serving.
    approximationNotes: >-
      Workflow derived from RBLN SDK documentation and vLLM integration guides. Internal CI/CD steps may differ per
      customer environment.
    claimRefs:
      - CE016
      - CE017
      - CE018
      - CE020
      - CE021
    data:
      nodes:
        - id: model-selection
          label: Select model from Model Zoo (300+ supported)
          type: input
          note: PyTorch / TensorFlow; LLMs, vision models, classical inference
        - id: compile
          label: Compile model with rebel-compiler (RBLN ahead-of-time compiler)
          type: process
          note: 'Quantise to FP8/FP4/INT8 target precision; output: RBLN binary'
        - id: validate
          label: Validate compiled model via RBLN Runtime on dev hardware
          type: process
          note: Unit test on RBLN-CA* (ATOM) or RBLN-CR* (REBEL) device
        - id: deploy-vllm
          label: Deploy via vllm-rbln on RebelServer / ATOM-Max Server
          type: process
          note: Paged attention + continuous batching; vLLM v0.18.0 API
        - id: k8s-operator
          label: Register NPU with Kubernetes via Rebellions NPU Operator v0.4.0
          type: process
          note: rebellions.ai/REBEL or rebellions.ai/ATOM device resources; OpenShift-certified
        - id: inference-request
          label: Application sends inference request via OpenAI-compatible API
          type: process
          note: vLLM OpenAI API endpoint; token streaming supported
        - id: npu-execute
          label: NPU executes inference (RBLN Runtime, on-chip)
          type: process
          note: 56.8 TPS on LLaMA 70B at 2k/2k (ISSCC 2026); HBM3E or GDDR6 KV cache
        - id: response
          label: Response returned; metrics exported via k8s metric exporter
          type: output
          note: Prometheus-compatible metrics for monitoring; VFIO manager for isolation
        - id: scale-out
          label: Scale out via RebelRack / RebelPOD (multi-server, RDMA fabric)
          type: output
          note: Tensor parallelism via RSD framework; 400 GB/s RDMA inter-node
      edges:
        - from: model-selection
          to: compile
          label: Model download
        - from: compile
          to: validate
          label: RBLN binary
        - from: validate
          to: deploy-vllm
          label: Model ready
        - from: deploy-vllm
          to: k8s-operator
          label: Server registration
        - from: k8s-operator
          to: inference-request
          label: API endpoint live
        - from: inference-request
          to: npu-execute
          label: Request dispatch
        - from: npu-execute
          to: response
          label: Token output
        - from: response
          to: scale-out
          label: Load triggers scale
