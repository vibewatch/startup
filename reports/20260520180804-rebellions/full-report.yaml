              The December 2025 non-exclusive licensing agreement between Groq and Nvidia—in which Groq's founder
              Jonathan Ross and president Sunny Madra departed Groq to join Nvidia—is the most concrete evidence yet
              that Nvidia can neutralize the leading inference chip challenger without a full acquisition. Groq had
              raised $6.9B in valuation, operated 2M+ developer accounts, and secured a $1.5B sovereign AI commitment
              from Saudi Arabia; yet its founders judged the Nvidia relationship strategically superior to continued
