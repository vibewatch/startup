      - number: '1.4'
        title: Product evolution, partnerships, and corporate milestones
        blocks:
          - type: paragraph
            body: >
              Rebellions' milestone chronology is the single factual spine that later chapters should reuse without
              re-litigating. The company was founded in 2020 around the thesis that AI inference—running trained models
              at production scale—would become a distinct hardware market from training, and that energy-efficient,
              purpose-built NPUs could outcompete Nvidia's general-purpose GPUs on the inference workload. That thesis
              has been validated by the commercial success of ATOM and the rapid capital accumulation since 2024.


              Key product milestones: ATOM taped out June 2022 (Samsung GDDR6-based process); first shipped to kt cloud
              in May 2023, making it the first Korean-developed inference chip in live data-center use; targeted for
              mass production on Samsung 5nm in the first half of 2024. Samsung Electronics became a formal
              co-development partner in October 2023, committing to produce REBEL on Samsung's 4nm process with HBM3E
              integration. REBEL SoC taped out November 2024, described as the world's first UCIe-Advanced AI chiplet
              with 144GB HBM3E. REBEL-Quad was unveiled at Hot Chips 2025 (August 2025), targeting Blackwell-grade
              performance. The Rebel100 platform, RebelCard accelerator, RebelRack, and RebelPOD were announced with the
              March 2026 pre-IPO round, representing Rebellions' shift from chip-only to integrated AI infrastructure
              systems.


              Key partnership milestones: SKT-Arm-Rebellions MOU (April 2026) for joint development of sovereign AI
              inference infrastructure combining Arm's AGI CPU and Rebellions' RebelCard, to be validated in SKT's data
              centers before global commercialization. Red Hat partnership (December 2025) for Red Hat OpenShift AI
              powered by Rebellions NPUs. NTT DOCOMO Innovations (DOCOMO) partnership (April 2025) for AI acceleration
              validation. SAPEON merger announcement (June 2024), definitive agreement (August 2024), and completion
              (December 2024), creating Korea's first AI chip unicorn. Japan subsidiary (February 2025) and Saudi Arabia
              subsidiary (August 2025) establish the regional footprint.


              SKT is testing Rebellions' NPU-equipped servers in core AI services including A.Dot call summarization,
              PASS spam filtering, PASS financial assistant, and X Caliber services. This constitutes the primary
              commercial validation evidence for ATOM at production scale. kt cloud is the earliest live customer. Wa'ed
              Ventures' investment opened the Saudi Arabia market. ATOM has also been deployed in Japan and Saudi Arabia
              according to the REBEL-Quad Hot Chips presentation (August 2025), though deployment scale is not publicly
              quantified.
