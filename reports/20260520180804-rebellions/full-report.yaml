  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              Rebellions operates in one of the most intensely contested segments of the semiconductor industry:
              purpose-built AI inference accelerators for data-center deployment. The competitive landscape spans at
              least four distinct tiers. The first and dominant tier is Nvidia, whose Blackwell architecture (GB200
              NVL72) delivers 30x faster LLM inference than the prior-generation H100 and 25x better performance per
              watt, setting a benchmark that all challengers must match or credibly undercut on total cost of ownership.
              Nvidia's H100 already represented a 30x improvement over A100 for LLM inference; the successive
              step-changes mean each generation resets the competitive bar.


              The second tier consists of GPU generalists: AMD's Instinct MI300/MI325X series offers a direct
              alternative to Nvidia H100/H200 with 256 GB HBM3E memory and 6 TB/s bandwidth, supported by the ROCm
              open-source software stack. AMD targets both training and inference, giving it a broad competitive surface
              that Rebellions' inference-only product does not match.


              The third tier—most directly competitive with Rebellions—comprises AI inference chip startups: Groq
              (LPU/GroqCloud, $6.9B valuation post $750M raise), SambaNova (Dataflow RDU, SambaCloud), Cerebras (Wafer
              Scale Engine 3), Tenstorrent (Wormhole, open-source RISC-V), and FuriosaAI (RNGD/Renegade, 512 TFLOPS,
              180W). Of these, FuriosaAI is the most direct Korean-market competitor, targeting the same
              telco/sovereign-AI customers with a similar 180W air-cooled profile. Groq has demonstrated the largest
              commercial traction but pivoted to licensing Nvidia technology in December 2025, with its founder and
              president joining Nvidia—a significant adverse signal for startup independence in this space.


              The fourth tier consists of substitute solutions that reduce Rebellions' addressable market: Google Cloud
              TPU (Ironwood, 42.5 ExaFlops per pod) and AWS Trainium (Trainium3, 3nm, 4x efficiency vs prior gen) are
              captive hyperscaler silicon unavailable externally, but they constrain Rebellions' access to hyperscaler
              accounts. Hailo is an edge-focused accelerator company and does not compete in data-center inference.
              Internal build (hyperscaler in-house ASICs beyond those listed) is the fifth category, representing the
              status quo for the largest AI spenders.
