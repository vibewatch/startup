  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Profile and Proof Gaps
        blocks:
          - type: paragraph
            body: >-
              Rebellions’ risk stack is led by proof, revenue, and commercialization gaps rather than by a lack of
              technical ambition. Public technical evidence shows that REBEL-Quad can run frontier-size models, and
              official launches describe rack-scale systems, but the company still lacks the kind of independent
              benchmark package a public-market investor would expect when underwriting against Nvidia or AMD. MLPerf
              Datacenter has no Rebellions submission, while Forbes and Korea JoongAng Daily both frame non-Nvidia
              procurement as unusually hard. That proof gap matters because valuation ambition has already outrun public
              revenue disclosure: the only hard revenue baseline in reviewed sources is FY2023 revenue of roughly 2.7
              billion KRW, while Park’s 100 billion KRW 2025 revenue target and the roughly $2.34 billion pre-IPO
              valuation are not bridged by audited FY2025 figures. The broader sector context is not forgiving either.
              Graphcore ended in a SoftBank acquisition, SambaNova reportedly explored a sale, and FuriosaAI continues
              to raise capital inside Korea. Together these signals make benchmark opacity, revenue execution, and
              survival pressure the top three residual risks.
