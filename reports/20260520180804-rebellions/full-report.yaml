  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Public Traction Visibility
        blocks:
          - type: paragraph
            body: >
              Rebellions operates a hardware-plus-software revenue model. Chips (ATOM, REBEL-Quad/Rebel100) are designed
              in-house, manufactured by Samsung Foundry on advanced process nodes, and sold as standalone accelerator
              cards (RebelCard), complete server units (RebelServer), and rack-scale systems (RebelRack, RebelPOD). The
              software layer—an open-source-aligned SDK supporting vLLM, PyTorch, Triton, Hugging Face, and Red Hat
              OpenShift AI—is bundled rather than independently monetized at the time of this review.


              Public revenue evidence is minimal. Korean corporate registry filings reviewed in the Forbes Asia April
              2025 profile show FY2023 revenue of approximately 2.7 billion KRW (~$2.1 million at the prevailing 2023
              average exchange rate of roughly 1,300 KRW/USD). This represents early commercial traction from the ATOM
              chip, which entered mass production in May 2023 and was deployed with customers including SK Telecom's
              data center division, Kakao, and Naver. The company did not publicly disclose FY2024 or FY2025 revenue
              ahead of this report date; no ARR, GMV, or unit shipment figures have been released.


              CEO Sunghyun Park stated in the April 2025 Forbes profile a 2025 revenue target of 100 billion KRW (~$68
              million), implying an approximately 37× jump from the last known public baseline. Whether this was
              achieved is not confirmed in any source reviewed for this chapter. Series C and pre-IPO press releases
              reference deployments with "enterprises and governments" across Japan, Saudi Arabia, and the United
              States, and note that ATOM-based chips "power Korea's largest commercial AI service"—statements that
              corroborate customer traction but do not quantify revenue.


              Pricing is not publicly listed. The company describes its value proposition as superior
              performance-per-watt and total cost of ownership versus Nvidia H100 for inference workloads, which implies
              a price-to-performance positioning rather than a list-price model. The turnkey partnership with Samsung
              (covering chip manufacture, HBM3E memory, and packaging) and system-assembly partnerships with Pegatron
              and Penguin Solutions suggest channel and partner economics are embedded in the cost structure, but no
              margin split data is available.
