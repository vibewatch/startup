              Park Sung-hyun stated publicly that "merging was the only way to survive" before SKT's call. The merger
              was not a growth-from-strength acquisition but a consolidation under competitive pressure. The merged
              entity combines talent, IP, and investor relationships—but also integration risk and a more complex
              governance structure with SKT as a strategic investor holding real influence over strategy.
