        SambaNova, Cerebras, Tenstorrent, FuriosaAI), both GPU incumbent majors (Nvidia, AMD), and the two largest
        hyperscaler captive ASICs (Google TPU, AWS Trainium). Hailo included as the most prominent edge-tier adjacent
        player. Excludes dozens of smaller edge AI chip vendors, early-stage startups, and domestic Chinese accelerators
        (Biren, Cambricon) where English-language public evidence is limited.
