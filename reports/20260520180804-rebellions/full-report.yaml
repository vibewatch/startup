chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, founding, and product model
        blocks:
          - type: paragraph
            body: >
              Rebellions is a fabless AI semiconductor company headquartered in Seongnam (Bundang district), Gyeonggi
              Province, South Korea. The company was co-founded in 2020 by five Korean engineers, with CEO Sunghyun Park
              as the publicly identified leader. The formal registered address is 3F, 6 Jeongjail-ro 156beon-gil,
              Bundang-gu, Seongnam-si, Gyeonggi-do, Korea. The company focuses exclusively on AI inference—the workload
              of running trained neural networks at production scale—rather than the training segment dominated by
              Nvidia and AMD.


              Rebellions describes itself as building "purpose-engineered AI accelerators to redefine energy-efficiency
              and scale in the age of large-scale AI." Its chiplets, interconnect, and software stack are designed for
              hyperscale deployments. The company sells hardware (NPU chips, server systems) and associated software
              (Rebellions SDK) to cloud operators, telcos, and sovereign AI programs. The business model is a
              hardware-plus-software sale: chips are fabbed by Samsung on leading-edge processes, assembled into server
              platforms (ATOM-Max Server, RebelServer, RebelRack, RebelPOD), and sold with an SDK for model deployment.


              Post-merger (December 2024), the legal surviving entity is SAPEON Korea—an SK Telecom subsidiary—but the
              company operates entirely under the Rebellions name and leadership. This structure means SK Telecom, SK
              Square, and SK Hynix became strategic investors in the merged entity through their SAPEON shareholdings.
              As of May 2026, Rebellions operates subsidiaries in Japan (established February 2025) and Saudi Arabia
              (August 2025), and has established a U.S. entity led by Chief Business Officer Marshall Choy to support
              North America expansion.


              The company's product arc runs from ATOM (its first-generation GDDR6-based inference accelerator, taped
              out June 2022, first shipped May 2023) through REBEL (a UCIe-Advanced AI chiplet with HBM3E memory, taped
              out November 2024 and described as the world's first of its kind) to the current Rebel100 platform,
              RebelCard accelerator card, and the newly launched RebelRack and RebelPOD integrated rack-scale systems.
              Software integration with Red Hat OpenShift AI (December 2025 partnership) extends the addressable
              enterprise customer base beyond Asia.
