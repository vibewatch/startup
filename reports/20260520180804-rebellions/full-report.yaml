      - number: '1.3'
        title: Funding history, investors, and valuation trajectory
        blocks:
          - type: paragraph
            body: >
              Rebellions has raised $850 million in total capital as of March 30, 2026, making it the most-funded AI
              semiconductor startup in South Korea by a substantial margin. The capital trajectory accelerated
              dramatically in the six months ending March 2026: the company raised $650 million (over 75% of its total
              lifetime capital) in that window alone, pointing to strong investor conviction ahead of the planned IPO.


              The funding history begins before Series B. The company's January 2024 Series B press release disclosed a
              total raise of "more than $200 million" at that time, implying roughly $76 million in seed and Series A
              rounds prior to Series B—those earlier rounds are not individually announced in public sources. The Series
              B closed at $124 million on January 30, 2024, led by KT (Korea's premier data-center operator) with
              participation from Temasek's Pavilion Capital (follow-on), KDB (Korea Development Bank), Mirae Asset
              Venture Investment, IMM Investment, KT Investment, SV Investment, Korelya Capital (France), DGDV (Japan),
              and several Korean institutional investors. The Series B extension of $15 million followed on July 23,
              2024, entirely from Wa'ed Ventures, the venture capital arm of Saudi Aramco—marking the first Korean
              startup investment from that fund.


              The September 30, 2025 Series C raised $250 million at a $1.4 billion post-money valuation, with Arm
              becoming a strategic financial partner and Samsung Ventures, Pegatron VC, KDB (follow-on), and Korelya
              Capital (follow-on) also participating. The Series C was extended in November 2025 with Kindred Ventures
              and Top Tier Capital Partners, bringing Silicon Valley venture capital into the cap table for the first
              time.


              The pre-IPO round of $400 million closed March 30, 2026, led by Mirae Asset Financial Group and the Korea
              National Growth Fund, at a post-money valuation of approximately $2.34 billion. This round confirmed the
              unicorn valuation milestone reached after the December 2024 merger (when the combined company exceeded 1
              trillion Korean won in corporate value) had substantially expanded by the time of the pre-IPO. No IPO
              exchange, filing date, or price range has been publicly confirmed as of May 2026.
