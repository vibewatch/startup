        - $3T+ market cap; FY2026 C&N revenue ~$193B
        - All AI workloads; data center; enterprise; HPC
        - CUDA ecosystem moat; H100/GB200 performance leadership; full-stack (DGX, networking, software)
        - Dominant incumbent; every NPU startup benchmarks against CUDA; Blackwell resets performance bar
      - - AMD
        - GPU generalist
        - Large-cap public; Instinct MI300/MI325X in production
        - Data-center AI training and inference; cloud CSPs; HPC
        - ROCm open-source; 256GB HBM3E (MI325X); broad CDNA3 ecosystem
        - Lower switching cost from Nvidia than NPU; GPU-first engineering teams favor AMD over NPU re-integration
      - - Groq
        - Inference startup (LPU)
        - ~$1.39B+ raised; $6.9B valuation (Sept 2025); Samsung, Cisco investors
        - Developers; API-first cloud inference; sovereign AI (MENA)
        - LPU purpose-built for inference; GroqCloud API with 2M+ developers; ultra-low latency per token
        - Founder and president left to join Nvidia (Dec 2025); GroqCloud is API-layer, not hardware sale competitor
      - - SambaNova
        - Inference startup (RDU)
        - Private; raised $676M+ as of 2023; SambaCloud
        - Enterprise AI; agentic workflows; cloud inference API
        - Dataflow architecture; multi-model simultaneous execution; 435 tok/s on MiniMax M2.7
        - Cloud API model; hardware not sold externally in volume; US-focused go-to-market
      - - Cerebras
        - Inference/training startup (WSE)
        - Public (IPO 2025/2026); Sunnyvale, CA
        - Large-model training and inference; research; enterprise
        - 'Wafer Scale Engine 3: 4T transistors, 125 petaflops; no memory bandwidth bottleneck'
        - Liquid cooling requirement; different power/thermal envelope than Rebellions; training-heavy focus
      - - Tenstorrent
        - Training/inference startup
        - $693M Series D (Samsung, LG investors)
        - Research; cloud training; inference; open-source AI
        - Open-source RISC-V; broad ecosystem strategy; Samsung/LG backing
        - Western-market focus; open-source model may reduce per-chip margin; same Samsung investor overlap
      - - FuriosaAI
        - Korean inference startup (NPU)
        - Plans $500M IPO round (Jan 2026); LG CNS partner
        - Korean telco; enterprise AI; sovereign AI; Asian data centers
        - 'RNGD: 512 TFLOPS, 48GB HBM3, 180W air-cooled; shipping since Jan 2026; Tensor Contraction Processor'
        - Direct Korean peer and near-identical target customer; IPO-bound competitor for same sovereign AI budget
      - - Google Cloud TPU
        - Hyperscaler captive ASIC
        - Internal Google investment; Ironwood GA May 2026
        - Google internal AI (Gemini, Search, Maps); Google Cloud customers only
        - 'Ironwood 7th gen: 42.5 ExaFlops/pod; purpose-built agentic AI; 1B+ user scale'
        - Not available outside Google Cloud; no external chip sales; substitute threat, not direct competitor
      - - AWS Trainium
        - Hyperscaler captive ASIC
        - Internal AWS investment; Trainium3 3nm (2026)
        - Amazon internal; AWS EC2 Trn3 customers; Anthropic partnership
        - 'Trainium3: 3nm, 2.52 PFLOPS FP8, 4x energy efficiency vs Trn2; Neuron SDK ecosystem'
        - AWS-only; not sold externally; constrains Rebellions' hyperscaler addressable market
