  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue disclosure miss
        - IPO filing or audited results show revenue far below what a $2.34B mark implies
        - Optionality premium loses its core support and the valuation must compress toward bear case
        - Re-underwrite immediately; assume stretched valuation until new price discovery occurs
      - - IPO delay without compensation
        - KOSPI process slips or disappears without offsetting contract or revenue disclosure
        - Scarcity and liquidity premium compresses while information risk stays high
        - Downgrade any constructive stance and move fully to wait-and-see
      - - Weak gross-margin reveal
        - First audited disclosure shows structurally weak hardware economics
        - Undercuts the path from growth narrative to public-market semiconductor multiple support
        - Rework scenario table with lower base and bull ranges
      - - Customer concentration shock
        - Audited disclosure reveals extreme dependence on one or two anchor customers
        - Revenue quality weakens and repeatability assumptions fall
        - Treat growth as less durable and raise bear-case probability
      - - No evidence of repeat deployments
        - New disclosure confirms pilots or one-off programs rather than repeatable scaled rollouts
        - System-level product story does not translate into commercial compounding
        - Remove IPO-readiness premium from underwriting
    notes: >-
      Trigger definitions focus on observable disclosure events rather than narrative sentiment, because this valuation
      hinges on a small set of monitorable public proofs.
    claimRefs:
      - CV049
      - CV050
      - CV051
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited FY2024-FY2025 financials
        - Revenue, gross margin, operating loss, and cash-burn bridge for the two years after FY2023
        - This is the single biggest blocker to underwriting the current mark on anything other than optionality
        - KOSPI filing, audited prospectus, or direct company/investor data-room disclosure
      - - Preference stack and cap-table terms
        - Liquidation preferences, anti-dilution terms, secondary rights, and any structured pre-IPO protections
        - Return outcomes can differ materially from headline post-money valuation if the preference stack is heavy
        - Counsel review of financing documents or investor-side cap-table package
      - - Customer concentration and backlog
        - Named customers, revenue concentration, repeat-order cadence, and committed backlog
        - Revenue quality matters as much as revenue size for IPO support and downside protection
        - Prospectus customer-risk section, diligence calls, or audited note disclosure
      - - Product-level unit economics
        - Gross margin and pricing evidence for card, server, and rack-level systems
        - Commercial scale without healthy hardware economics still does not justify a robust public-market multiple
        - Management guidance, audited segment disclosure, or banker deck under NDA
      - - IPO readiness and banker process
        - Exchange timeline, underwriter lineup, filing status, and governance readiness
        - The current price carries a pre-IPO premium that should not be paid blindly
        - Monitor KOSPI process disclosures and direct company/investor confirmations
      - - Strategic exit evidence
        - Any actual strategic-interest signals rather than theoretical M&A fit
        - M&A should not be counted in valuation support without evidence of real counterparty appetite
        - Board or banker diligence, not public narrative extrapolation
    notes: Items are ordered by underwriting importance; the first three are blocking for any move above research-more.
    claimRefs:
      - CV048
      - CV051
      - CV052
