      - number: '5.3'
        title: REBEL Generation — Quad-Chiplet Architecture, HBM3E, and ISSCC Results
        blocks:
          - type: paragraph
            body: >
              The REBEL Gen 2 chip, branded as REBEL-Quad in its production form, is fabricated on Samsung Foundry's 4nm
              SF4X process. Its defining architectural feature is a quad-chiplet design: four REBEL compute ASICs are
              interconnected using UCIe-Advanced die-to-die links operating at 16 Gbps per lane, supplied by Alphawave
              Semi IP. The package is assembled on Samsung's CoWoS-S substrate with four HBM3E memory stacks (each 36 GB
              at 9.6 GT/s), providing 144 GB total HBM3E capacity and 4.8 TB/s aggregate memory bandwidth. Four
              integrated silicon capacitors (ISC) complete the package. The host interface is dual PCIe Gen5 x16. The
              use of UCIe-Advanced in a shipping AI chip is notable as the first publicly marketed example of UCIe
              chiplet interconnect in a production AI accelerator, corroborated by an independent review at Hot Chips
              2025 from ServeTheHome.


              Performance data is anchored by an ISSCC 2026 peer-reviewed paper (IEEE Xplore document 11409003): "A
              Quad-Chiplet AI SoC with Full-Chip Scalable Mesh Over 16Gb/s UCIe-Advanced Die-to-Die Interface for
              Large-Scale AI Inferencing." The paper reports 56.8 tokens per second on LLaMA v3.3 70B with 2,048-token
              input and 2,048-token output sequences. This is the highest-credibility performance data point available,
              sourced from a peer-reviewed IEEE conference paper rather than vendor collateral. At Hot Chips 2025
              (August 2025), Rebellions demonstrated LLaMA 3.3 70B running live and showed Qwen3 235B MoE execution
              capability. The RebelServer system (5U, 8x RebelCard) is rated up to 2 PFLOPS FP8, with dual AMD EPYC 9355
              host CPUs, 1.5 TB DDR5 host memory, and 4× 400G networking ports, consuming 4–6 kW typical and 7 kW
              maximum.
