        - Low
        - Do not treat the March 2026 mark as a clean buy point without new audited financial disclosure.
      - - Risk rating
        - High
        - Medium
        - Position size, if any, should assume binary pre-IPO disclosure risk and commercialization risk.
      - - Valuation stance
        - Stretched
        - Medium
        - The current price already discounts material execution progress before that progress is publicly disclosed.
      - - Entry discipline
        - Prefer lower entry or better evidence
        - Medium
        - Underwrite only after audited revenue, backlog, and gross-margin evidence improves or the price resets.
      - - Target return / hold logic
        - '>2x is hard to justify from the current mark without bull-case evidence'
        - Low
        - A venture-style return now likely requires either a lower price or a materially stronger commercialization proof set.
      - - Most important upgrade trigger
        - Audited FY2024-FY2025 scale plus credible IPO filing
        - Medium
        - Upgrade only when financial disclosure starts to validate the strategic narrative.
    notes: >-
      Recommendation reflects public evidence as of 2026-05-20; current financing support is strong, but audited
      operating support is still missing.
