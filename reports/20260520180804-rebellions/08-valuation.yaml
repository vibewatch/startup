company:
  name: Rebellions
chapter:
  number: 8
  title: Valuation
  summary: >-
    Rebellions closed a $400 million pre-IPO round in March 2026 at an approximately $2.34 billion post-money
    valuation and $850 million total raised, but the last disclosed operating baseline remains FY2023 revenue of
    2.7 billion KRW (~$2.1 million) and a 13.7 billion KRW net loss, with FY2024-FY2025 actual revenue still
    undisclosed. That makes the current mark look supported primarily by sovereign-AI optionality, Samsung-linked
    ecosystem access, and IPO scarcity rather than public evidence of commercial scale. The recommended stance is
    research-more with low confidence, high risk, and a stretched valuation view; base-case support clusters around
    roughly $1.5 billion-$2.5 billion, so the current price leaves limited room for execution misses.
sections:
  - id: thesis-and-recommendation
    title: Investment thesis, anti-thesis, and recommendation
    body: |
      Rebellions can support a serious investment conversation because it is not just another undifferentiated AI
      chip startup. The company has raised unusually large capital for a Korean semiconductor venture, has deep
      alignment with Samsung's manufacturing stack, and sits inside a sovereign-AI narrative that gives it a more
      protected domestic demand path than many Western inference-chip peers. The official March 2026 pre-IPO
      announcement also shows the company is trying to move from single-card silicon toward system-level products
      such as RebelRack and RebelPOD, which is strategically important because customers buy deployable inference
      capacity rather than standalone dies.

      The anti-thesis is more important at today's price. The last publicly disclosed revenue baseline is still only
      2.7 billion KRW for FY2023, paired with a 13.7 billion KRW net loss, and the public record reviewed for this
      chapter still does not disclose FY2024 or FY2025 actual revenue, gross margin, backlog, customer count, or
      repeat-order metrics. That means the current mark is not underwritten by visible commercial scale; it is
      underwritten by optionality. Because the valuation already embeds successful commercialization and an eventual
      IPO path, the right stance is research-more, not buy. Confidence should be low, risk high, and entry
      discipline strict until audited or prospectus-grade financial disclosure catches up to the financing story.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV011
      - CV012
      - CV018
      - CV021
      - CV023
      - CV044
      - CV045
      - CV046
      - CV047
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
  - id: current-price-support-and-comparables
    title: Current price support, financing context, and comparable valuation anchors
    body: |
      The current price support case starts with financing momentum rather than operating disclosure. Rebellions
      moved from a $1.4 billion Series C valuation in September 2025 to an approximately $2.34 billion post-money
      valuation in March 2026, a roughly 67% step-up in about six months. Media coverage in April 2026 framed the
      company as gearing up for a KOSPI IPO, but no public filing, price range, or audited prospectus was visible in
      the sources reviewed for this chapter. In other words, investors are paying for a pre-IPO option before the
      usual public-market diligence package has been forced into the open.

      Comparable analysis reinforces both the upside narrative and the caution. Cerebras shows that revenue-backed
      AI chip companies can earn large public-market valuations when financial disclosure is real and growth is
      visible. Groq, Tenstorrent, and FuriosaAI show that private investors will still pay multibillion-dollar marks
      for AI silicon optionality. But SambaNova's reported sale exploration and Graphcore's absorption by SoftBank
      are equally important reminders that independent AI-chip outcomes can compress abruptly when capital intensity,
      commercialization, or strategic positioning break the story. Relative to this peer set, Rebellions is not an
      absurd outlier on private valuation alone; it is stretched because its disclosed revenue base is far thinner
      than the price already implies.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV016
      - CV024
      - CV025
      - CV026
      - CV027
      - CV029
