  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key assumptions
      - Valuation range
      - Probability signal
      - Key risk or unlock
    rows:
      - - Bear
        - FY2024-FY2025 actual revenue remains weak or disappointing, IPO slips, and public disclosure shows limited scale.
        - $0.8B-$1.2B
        - Material risk if current opacity resolves negatively.
        - Downside is driven by scarcity-premium compression and weak commercialization evidence.
      - - Base
        - Rebellions shows credible but still modest commercial scale, files toward IPO, and maintains sovereign-AI positioning.
        - $1.5B-$2.5B
        - Highest-probability band on current evidence.
        - Requires disclosure good enough to keep the IPO path alive.
      - - Bull
        - Audited growth, strong sovereign-AI deployments, and robust IPO demand validate Rebellions as a scarce AI-chip asset.
        - $3.0B-$5.0B
        - Requires several favorable disclosures, not just continued narrative momentum.
        - Upside depends on proving scale, not just preserving optionality.
    notes: >-
      Scenario ranges are analyst estimates anchored on financing context, disclosure quality, and AI-chip peer outcomes rather than clean revenue multiples.
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Status / latest valuation outcome
      - Last disclosed revenue
      - Multiple / signal
      - Relevance to Rebellions
      - Limitation
    rows:
      - - Cerebras
        - Public; roughly $8B-plus market cap in May 2026 after filing and listing sequence
        - $510M FY2025 (SEC S-1/A)
        - ~mid-teens revenue multiple (estimated)
        - Best revenue-backed AI-chip anchor showing what disclosure can unlock in public markets
        - Public comp with far better disclosure and materially higher proven scale than Rebellions
      - - Groq
        - Private; $6.9B valuation after $750M round (reported)
        - Not publicly disclosed
        - Optionality anchor; no clean revenue multiple
        - Shows investors still pay large premiums for inference-chip optionality
        - Revenue opacity prevents apples-to-apples comparison
      - - SambaNova
        - Private; reported sale exploration after funding difficulty
        - Not publicly disclosed
        - Distress signal, not a clean multiple
        - Important downside precedent for capital-intensive AI-chip startups
        - Outcome is process-driven and not a settled valuation mark
      - - Graphcore
        - Acquired by SoftBank in 2024
        - Not publicly disclosed at exit in reviewed sources
        - Strategic-outcome signal, not a clean multiple
        - Shows standalone AI-chip companies can end in strategic absorption rather than IPO
        - Exit terms are not a transparent public-market valuation benchmark
      - - FuriosaAI
        - Private; $125M round closed in 2025, with larger raise ambitions also reported
        - Not publicly disclosed
        - Korean peer valuation signal; revenue multiple unavailable
        - Closest geographic and category peer for Korean inference silicon
        - Revenue opacity remains high
      - - Tenstorrent
        - Private; $693M raised and unicorn status reported in late 2024
        - Not publicly disclosed
        - Platform-optional valuation signal; revenue multiple unavailable
        - Demonstrates continued investor appetite for non-Nvidia AI compute platforms
        - Different product breadth and no public revenue disclosure
      - - Rebellions
        - Private; $2.34B post-money after March 2026 pre-IPO
        - $2.7B KRW (~$2.1M) FY2023 last disclosed
        - Implied >1,100x on last disclosed revenue baseline (estimated)
        - Current subject company; valuation sits within private comp band but without revenue-backed support
        - FY2024-FY2025 actual revenue remains undisclosed, making the baseline stale
    notes: >-
      Mixes public, private, and outcome-based comparables; private-company valuations are third-party-reported and most lack disclosed revenue, so the table is best used directionally rather than mechanically.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the highest-signal AI-chip valuation references available from reviewed 2024-2026 public sources:
        one revenue-backed public comp, four private/funding or strategic-outcome comps, and the closest Korean peer.
        Coverage is partial because several private peers do not disclose revenue or current marks consistently.
