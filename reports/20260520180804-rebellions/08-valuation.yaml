      - CV038
      - CV039
    tableRefs:
      - TV004
    figureRefs:
      - FV002
  - id: scenarios-and-kill-triggers
    title: Bull, base, and bear scenarios plus thesis-break triggers
    body: |
      Scenario analysis is more defensible than point-estimate multiple work because the company does not yet give
      public investors the operating disclosure needed for a clean revenue or EBITDA framework. In the bear case,
      Rebellions remains strategically interesting but commercially under-evidenced: FY2024-FY2025 revenue still is
      not disclosed, the IPO slips, and public financials reveal a business much smaller than the current price
      requires. That supports a roughly $0.8 billion-$1.2 billion range. In the base case, the company shows enough
      audited scale, customer concentration looks manageable, and the IPO path remains viable, which supports roughly
      $1.5 billion-$2.5 billion. In the bull case, sovereign-AI deployments translate into visible commercialization,
      global design wins, and strong IPO demand, supporting roughly $3 billion-$5 billion.

      The problem for a new investor is that the current $2.34 billion mark already sits near the upper half of that
      base-case band. That means the next major disclosure event matters a great deal. The cleanest thesis-break
      trigger is audited or IPO-filed revenue that lands materially below what a $2.34 billion price implies. A
      second trigger is process-based: if the IPO is delayed or withdrawn without offsetting evidence of scaled
      deployments, the scarcity premium should compress quickly. This is why the downside is not theoretical — it is
      concentrated in a small number of highly monitorable disclosures.
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV049
      - CV050
      - CV053
    tableRefs:
      - TV003
      - TV005
    figureRefs:
      - FV003
  - id: exit-readiness-and-diligence
    title: Exit readiness, evidence gaps, and final diligence asks
    body: |
      Public evidence today supports an IPO possibility, not IPO readiness. Coverage in Seoul Economic Daily places
      Rebellions in the Korean AI-chip listing race, and the existence of the KOSPI venue means an eventual filing
      would force a much richer disclosure set. But the current public record still does not reveal audited FY2024
      or FY2025 revenue, gross margin, backlog, concentration, or cap-table economics. That leaves the company in a
      disclosure no-man's-land: priced like a late-stage pre-IPO asset, but documented more like a venture-backed
      private startup.

      That also limits exit analysis. A KOSPI listing remains the only supportable public exit path visible from
      sources reviewed here. A strategic-acquirer angle may exist in theory, especially in a world where sovereign-AI
      infrastructure and non-Nvidia supply chains gain value, but public evidence does not justify using M&A as a
      valuation pillar today. The correct response is not to force a hard bullish or bearish call beyond the evidence;
      it is to specify the missing documents that would change the view. Audited FY2024-FY2025 financials,
      preference-stack details, backlog and customer concentration disclosure, and validated repeat deployment data are
      the minimum set required before moving from research-more to a more constructive stance.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV048
      - CV051
      - CV052
      - CV053
