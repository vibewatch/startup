  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: preference-stack
      missingEvidence: Pre-IPO cap table, liquidation preferences, anti-dilution terms, and any secondary-liquidity or structured-investor protections.
      whyItMatters: Headline post-money valuation can overstate actual common-equity value when late-stage terms are investor-favorable.
      diligencePath: Request financing documents or investor-side cap-table materials under NDA before underwriting returns.
      relatedQuestionRefs: [QV013]
    - type: missing-source
      severity: material
      topic: strategic-exit-evidence
      missingEvidence: Actual banker, board, or counterparty evidence that strategic acquirers are actively evaluating Rebellions.
      whyItMatters: An M&A premium should not be counted in valuation support without real buyer evidence.
      diligencePath: Treat strategic exit as a diligence topic and request board or adviser process evidence rather than inferring from ecosystem relationships.
      relatedQuestionRefs: [QV028]
    - type: enumeration-incomplete
      severity: material
      topic: comparable valuation table coverage
      missingEvidence: Consistent current-revenue disclosure and up-to-date valuation marks for private AI-chip peers such as Groq, FuriosaAI, and Tenstorrent.
      whyItMatters: The comparable set is directionally useful, but missing peer revenue data prevents a clean apples-to-apples multiple framework.
      diligencePath: Refresh private-market databases, prospectus filings, and company disclosures before converting the comp set into a harder valuation model.
      relatedQuestionRefs: [QV031]
      relatedTableRefs: [TV004]
    - type: stale
      severity: material
      topic: fy2025-actual-revenue
      missingEvidence: Audited FY2024 and FY2025 financial statements, including revenue, gross margin, and operating-loss detail.
      whyItMatters: The latest confirmed baseline is FY2023, so the most important operating period behind the current pre-IPO mark remains opaque.
      diligencePath: Wait for KOSPI filing materials or obtain audited private-company financials directly from management or lead investors.
      relatedQuestionRefs: [QV033]
