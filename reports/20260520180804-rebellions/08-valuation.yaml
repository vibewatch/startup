  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Thesis
      - Support level
      - Anti-thesis
      - What would change the view
    rows:
      - - Sovereign-AI positioning gives Rebellions a protected Korean demand wedge unavailable to many Western peers.
        - Medium
        - Sovereign-AI demand is strategically important but still not the same thing as disclosed, repeatable revenue.
        - Audited domestic contract revenue and backlog disclosure tied to sovereign or telco deployments.
      - - Samsung ecosystem access improves manufacturability and strategic credibility.
        - Medium
        - Manufacturing access does not by itself prove commercial demand or healthy unit economics.
        - Third-party evidence of shipment scale, repeat orders, and gross margin by product generation.
      - - System-level launches such as RebelRack and RebelPOD widen the monetization surface beyond chips alone.
        - Medium
        - Launch announcements do not quantify customer conversion, utilization, or pricing power.
        - Named production deployments with disclosed scale, performance, and commercial terms.
      - - Scarcity of non-US AI-chip assets can support a premium pre-IPO valuation.
        - Medium
        - Scarcity premiums reverse quickly when disclosure disappoints or exit timing slips.
        - Prospectus-grade disclosure that shows revenue scale can support a premium instead of mere scarcity.
      - - Private AI-chip peers show investors still pay for optionality.
        - Low
        - SambaNova and Graphcore show optionality can collapse when commercialization stalls.
        - Evidence that Rebellions is following Cerebras-like revenue disclosure and not SambaNova/Graphcore-like opacity.
    notes: >-
      The thesis is real but mostly strategic; the anti-thesis is that public financial evidence still lags the valuation by a wide margin.
