- id: supply-chain-and-ecosystem-dependencies
  title: Supply Chain and Ecosystem Dependencies
  body: 'Rebellions’ operating model is unusually concentrated for a company trying to scale into a public listing. Samsung is not just a supplier but a roadmap anchor: the next-generation REBEL program was announced on Samsung 4nm with Samsung HBM3E, and independent Hot Chips coverage still shows Samsung-process and HBM concentration in REBEL-Quad. Park’s own comments about foundry capacity and HBM shortages turn that dependency into a first-order risk rather than a generic semiconductor caveat. The same concentration appears on the demand and channel side. SK Telecom and Arm provide marquee sovereign-AI validation, but they also tie commercialization to a narrow set of policy-aligned programs and counterparties. Public-market timing is another dependency rather than a mere milestone, because KRX and the Korean IPO window now sit between Rebellions and its next valuation reset. Without disclosed second-source plans, capacity reservations, or shipment volumes, any slip in memory allocation,
    packaging, or sovereign-program timing can propagate into delivery delays, weaker benchmarks, and a more fragile IPO story.'
