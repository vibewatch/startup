- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Benchmark proof gap
    - Independent benchmark or MLPerf participation
    - Still no third-party benchmark package by first public filing
    - Treat as thesis-breaker for valuation support; require customer-side proof before adding capital
  - - Revenue / audited disclosure gap
    - Audited FY2025 revenue and gross-margin disclosure
    - Results remain undisclosed or land far below management narrative
    - Reprice underwriting assumptions and delay any public-market-style valuation
  - - Export-control / market-access risk
    - Classification, license, or screening event
    - New rule, license denial, or shipment halt affects a target market
    - Pause expansion assumptions and require counsel-backed remediation
  - - Samsung / HBM concentration
    - Production allocation and delivery cadence
    - Meaningful launch slip or supply constraint pushes systems back more than one quarter
    - Assume slower revenue conversion and higher working-capital stress
  - - IPO process risk
    - KRX preliminary review and valuation messaging
    - Review slips materially or expected valuation resets by more than 25%
    - Move from IPO optionality to financing-risk framework
  - - Leadership / integration risk
    - Executive turnover and merger milestones
    - Park departure or repeated top-team churn before audited bridge is public
    - Escalate to governance red flag and reassess execution confidence
  notes: Thresholds are monitorable proxies rather than contractual covenants; they are designed to turn today’s narrative risks into explicit diligence gates for a future investor or refresh cycle.
