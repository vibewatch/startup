- id: integration-leadership-and-kill-criteria
  title: Integration, Leadership, and Kill Criteria
  body: 'The SAPEON merger solved one strategic problem by creating a larger Korean AI-chip champion, but it created another by increasing integration, governance, and leadership concentration. The combined company is publicly identified with Sunghyun Park, who remains the named chief executive and the main technical and external face. No public succession plan, synergy scorecard, or post-merger governance framework was found. That matters because the next twelve months are packed with execution events: proving benchmark credibility, converting pre-IPO funding into auditable growth, navigating export-control exposure, and managing an IPO process. The right investor posture is not to assume failure, but to insist on measurable thesis-break triggers. If audited FY2025 results fall far short of target, if KRX review slips materially, if Samsung or HBM allocation constrains launch volumes, or if Park or merger integration destabilizes the leadership team, the residual risk profile would move
    from high to thesis-breaking quickly. Capital strength exists, but proof and controls still lag ambition.'
