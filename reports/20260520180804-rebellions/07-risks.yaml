  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: Product classification letters, destination matrices, counsel memos, and board-approved export-screening controls for sovereign and international sales.
    whyItMatters: The legal risk register can only be partial without proof of how Rebellions classifies products, routes sensitive deals, and documents market-access controls.
    diligencePath: Obtain export-control counsel memo, reseller screening SOPs, denied-party workflow, and any internal market-access restrictions by jurisdiction.
    relatedQuestionRefs:
    - QR011
    - QR012
    - QR013
    - QR015
    - QR033
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-bridge
    missingEvidence: Audited FY2024-FY2025 revenue, gross margin, burn, cash balance, backlog conversion, and customer concentration metrics.
    whyItMatters: The current valuation and IPO narrative cannot be underwritten on public information alone; revenue execution and runway remain the central financial unknowns.
    diligencePath: Request audited financial statements, monthly management accounts, revenue-recognition policy, cash bridge, and top-customer revenue schedule.
    relatedQuestionRefs:
    - QR006
    - QR007
    - QR020
    - QR032
  - type: missing-source
    severity: material
    topic: independent-benchmark-comparison
    missingEvidence: Independent apples-to-apples latency, throughput, power, and TCO comparisons against Nvidia and AMD on comparable deployment settings.
    whyItMatters: Benchmark opacity is the main reason the technology story has not yet converted into a public-market-quality proof package.
    diligencePath: Obtain third-party benchmark report, customer-side deployment metrics, and repeatable test methodology against named incumbent alternatives.
    relatedQuestionRefs:
    - QR001
    - QR004
    - QR021
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: supply-agreements-and-second-source
    missingEvidence: Samsung capacity commitments, HBM allocation terms, packaging partners, and any second-source or contingency manufacturing roadmap.
    whyItMatters: Without supply-side evidence, investors cannot distinguish a manageable semiconductor bottleneck from a true launch-capacity ceiling.
    diligencePath: Review supply agreements, quarterly allocation forecasts, safety-stock policy, and board materials on second-source planning.
    relatedQuestionRefs:
    - QR017
    - QR018
    - QR019
    - QR020
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: post-merger-governance-and-succession
    missingEvidence: Board composition, committee structure, quantified synergy targets, top-team retention plan, and formal succession arrangements for Park.
    whyItMatters: Merger integration and key-person concentration are central execution risks during an IPO cycle, yet public evidence on control maturity is thin.
    diligencePath: Request post-merger org chart, board materials, synergy tracker, succession memo, and executive-retention plan.
    relatedQuestionRefs:
    - QR029
    - QR031
    - QR034
    relatedTableRefs:
    - TR004
