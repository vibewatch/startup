callouts:
- calloutType: risk
  title: Benchmark proof and valuation support are the same problem here
  body: Because public revenue disclosure is thin, Rebellions needs unusually strong third-party proof to justify a public-market-style valuation. The company has technical evidence and launch announcements, but not yet an independent benchmark package that closes the gap versus Nvidia or AMD.
  claimRefs:
  - CR001
  - CR004
  - CR007
  - CR010
  - CR012
- calloutType: insight
  title: Samsung alignment is both moat and bottleneck
  body: Samsung gives Rebellions process, memory, and industrial-credibility advantages, but it also concentrates execution risk into a single roadmap and allocation stack. Park’s own comments on foundry and HBM shortages make that concentration explicit rather than theoretical.
  claimRefs:
  - CR025
  - CR026
  - CR027
  - CR028
- calloutType: risk
  title: SAPEON scale does not remove Park concentration
  body: The merger improved scale inside Korea, but reviewed public sources still show the company through Park’s leadership and do not disclose a public succession or quantified synergy framework. In an IPO cycle, that makes key-person and integration risk mutually reinforcing.
  claimRefs:
  - CR031
  - CR032
  - CR033
  - CR035
