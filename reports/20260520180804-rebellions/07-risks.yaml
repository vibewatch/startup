- id: regulatory-listing-and-policy-exposure
  title: Regulatory, Listing, and Policy Exposure
  body: 'The legal and regulatory risk here is mainly exposure and disclosure risk, not a known active lawsuit. Rebellions’ current expansion narrative spans Korea, Saudi Arabia, Japan, and the United States, while the 2025–2026 legal and regulatory materials reviewed for this chapter all point in the same direction: advanced-computing and AI-model export rules remain active, evolving, and material to chip vendors. The law-firm alerts characterize recent BIS actions as sweeping, while CSIS highlights uneven allied implementation that can complicate distribution through partners. Even if Rebellions itself is not publicly accused of a violation, the absence of public classification letters or screening disclosures means investors cannot verify compliance readiness. IPO risk sits in the same bucket. Seoul Economic Daily reported a target of KOSPI preliminary review in August 2026, but no preliminary approval, prospectus, or audited public filing was identified in reviewed sources. Because National
    Growth Fund support and K-Nvidia framing tie financing to a policy narrative, disclosure gaps can become both regulatory and reputational problems.'
