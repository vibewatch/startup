callouts:
  - calloutType: risk
    title: Groq-Nvidia Licensing Deal Is the Strongest Adverse Signal in the Inference Startup Race
    body: >-
      The December 2025 non-exclusive licensing agreement between Groq and Nvidia—in which Groq's
      founder Jonathan Ross and president Sunny Madra departed Groq to join Nvidia—is the most
      concrete evidence yet that Nvidia can neutralize the leading inference chip challenger without
      a full acquisition. Groq had raised $6.9B in valuation, operated 2M+ developer accounts, and
      secured a $1.5B sovereign AI commitment from Saudi Arabia; yet its founders judged the Nvidia
      relationship strategically superior to continued independent competition. For Rebellions and every
      other inference NPU startup, this deal signals that the sustainable outcome for a chip startup
      may be licensing to or acquisition by Nvidia rather than sustained independent market share.
    claimRefs:
      - CP002
      - CP004
      - CP041

  - calloutType: insight
    title: FuriosaAI Is Rebellions' Most Direct Competitive Threat in Korea
    body: >-
      FuriosaAI and Rebellions share the same home market, the same Samsung manufacturing access, the
      same 180W air-cooled inference profile, and the same target customers (Korean telcos, sovereign
      AI programs, LG-ecosystem enterprises). FuriosaAI began shipping RNGD in January 2026, secured
      the LG CNS partnership in February 2026, and is planning a $500M pre-IPO round. In a market
      where sovereign AI procurement budgets are finite and policy-driven, the two companies may split
      the available early revenue. Rebellions' SK Telecom strategic investor position is a meaningful
      moat, but it does not preclude FuriosaAI from winning competing Korean enterprise accounts.
    claimRefs:
      - CP021
      - CP022
      - CP023
      - CP024
      - CP037
      - CP042

  - calloutType: strength
    title: Korean Sovereign AI Mandate and Samsung Fab Access Are Structurally Differentiated
    body: >-
      Western inference chip startups (Groq, SambaNova, Cerebras, Tenstorrent) do not have access to
      Korea's sovereign AI program mandates, Samsung Foundry as a domestic fab partner, or the SK
      Telecom/SK Hynix strategic relationship. These institutional advantages insulate Rebellions from
      direct US-based startup competition in the Korean and certain Asian markets where sovereign AI
      policy mandates preferential domestic chip sourcing. The durability of this moat depends on
      Korea's AI chip policy remaining stable and Samsung continuing to prioritize Rebellions as a
      domestic champion.
    claimRefs:
      - CP042
      - CP043

