  - id: section-adjacent
    title: Geographic and Adjacent Dynamics
    body: >
      Hailo (Israeli fabless semiconductor company) occupies the edge AI tier and does not compete
      with Rebellions in data-center inference. Hailo's Hailo-8, Hailo-10H, and Hailo-15 processors
      target embedded edge platforms—cameras, automotive ECUs, robotic lawn mowers, industrial vision
      systems—with power profiles in the 1–10W range. The edge market may grow as AI models shrink,
      but in 2026, Hailo and Rebellions serve categorically different buyers and workloads.


      The geographic dimension is more material. Rebellions operates in a Korean sovereign-AI ecosystem
      where Samsung, SK Telecom, and national policy mandates create preferential access that Western
      competitors cannot easily replicate. FuriosaAI is the sole credible peer in this Korean context.
      Groq's presence in Saudi Arabia and Rebellions' 2025 partnership with SK Telecom and Arm for
      Saudi/MENA sovereign AI infrastructure represent genuine overlap in one high-growth geography.
      Tenstorrent's Samsung Securities and LG Electronics backers share institutional relationships
      with Rebellions' own Samsung fab and SK Telecom strategic investors—creating a scenario where
      both companies may bid for the same Korean enterprise AI contracts.


      The status-quo alternative for many potential Rebellions customers is continued reliance on
      Nvidia GPUs: CSPs and enterprises that have already integrated H100 clusters have significant
      sunk costs in CUDA software, operator tooling, and application compatibility. Switching to an
      NPU from any vendor—not just Rebellions—incurs migration costs that slow adoption cycles and
      give Nvidia a compounding first-mover advantage. Internal build (custom ASIC development) is a
      substitute primarily for hyperscalers; Rebellions' target customers (telcos, sovereign AI
      programs, mid-tier CSPs) generally lack the engineering capacity and scale to build custom
      silicon, which preserves a role for external NPU vendors including Rebellions.
