  - id: section-direct-peers
    title: Direct Inference NPU Competitors
    body: >
      Among Rebellions' most proximate rivals are the inference-focused chip companies that, like
      Rebellions, have positioned themselves as purpose-built alternatives to Nvidia's general-purpose
      GPU architecture.


      **Groq** (founded 2016, Mountain View, CA) pioneered the LPU (Language Processing Unit) as a chip
      architecture built specifically for inference. By May 2026, Groq has raised $1.39B+ across multiple
      rounds, most recently $750M at a $6.9B post-money valuation in September 2025, with backers
      including Samsung, Cisco, and Disruptive. Groq operates data centers in North America, Europe, and
      the Middle East, powering 2M+ developers via GroqCloud. Its Saudi Arabia presence—anchored by a
      $1.5B sovereign AI commitment—creates a geographic overlap with Rebellions' Middle East ambitions.
      In December 2025, Groq entered a non-exclusive licensing agreement with Nvidia; critically, Groq's
      founder Jonathan Ross and president Sunny Madra left Groq to join Nvidia as part of this
      arrangement. This is the most adverse signal to date for the viability of independent inference
      chip businesses against Nvidia's combined hardware/software ecosystem.


      **FuriosaAI** (Seoul, South Korea) is the most direct competitive threat to Rebellions in Korean
      and Asian markets. FuriosaAI's RNGD (Renegade) chip delivers 512 TFLOPS (8 processing elements at
      64 TFLOPS FP8 each), 48 GB HBM3 memory, and a 180W TDP targeting air-cooled data centers—a
      similar thermal envelope to Rebellions' target. FuriosaAI started shipping RNGD in January 2026,
      secured an LG CNS enterprise AI partnership in February 2026, and is planning a $500M funding
      round before its own IPO. Both companies are Korean, both are pre-revenue at scale, and both target
      the same Korean telco and sovereign AI customers. The competitive dynamic between them is
      zero-sum at least for early Korean data-center procurement.


      **SambaNova** (Palo Alto, CA) differentiates with its Reconfigurable Dataflow Unit (RDU) architecture,
      which maps model execution directly onto the processor to minimize data movement—an inference
      efficiency approach that is philosophically similar to Rebellions' NPU focus but architecturally
      distinct. SambaNova's SN50 (5th generation) supports agentic AI workloads and can run multiple
      models simultaneously. SambaCloud reports 435 tokens/second on MiniMax M2.7 and 200 tokens/second
      on DeepSeek-V3.1 at the API layer. SambaNova competes primarily at the cloud API layer rather than
      as a bare chip vendor, which means it overlaps with Rebellions in enterprise AI but through a
      different go-to-market model.


      **Cerebras** (Sunnyvale, CA) uses a wafer-scale approach: the WSE-3 integrates 4 trillion
      transistors and delivers 125 petaflops on a single wafer. As of May 2026, Cerebras has completed
      its IPO. Cerebras targets both training and inference but its wafer-scale architecture requires
      liquid cooling and targets a different performance/power envelope than Rebellions' chiplet
      approach—making them indirect rather than direct competitors in most data-center deployments.


      **Tenstorrent** (Toronto/Austin) has raised $693M in Series D led by Samsung Securities and LG
      Electronics, and positions its Wormhole AI accelerators with an open-source RISC-V approach that
      aims to build a broader developer ecosystem than proprietary NPU companies. Tenstorrent targets
      both training and inference, and its Samsung/LG backing creates a potential overlap with
      Rebellions' own Samsung manufacturing and LG ecosystem relationships.
