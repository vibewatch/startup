evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Revenue, ARR, gross margin, burn rate, customer count, and pricing data for any period
    whyItMatters: >-
      Without financial metrics, valuation diligence ($2.34B pre-IPO) cannot be independently assessed; all valuation
      claims rest on company-disclosed round prices
    diligencePath: Obtain a prospectus or investor data room; IPO filing will be the earliest public access point
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: leadership
    missingEvidence: >-
      Names, backgrounds, and roles of the four unnamed Rebellions co-founders; post-merger board composition and
      independent director identities
    whyItMatters: Governance and succession risk cannot be assessed without knowing the full founding team and board structure
    diligencePath: Request corporate registry filings (Korean Fair Trade Commission, DART) or pre-IPO prospectus for board disclosure
    relatedQuestionRefs:
      - QO001
      - QO004
      - QO022
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: investors
    missingEvidence: Exact equity stakes (%) for SKT, SK Hynix, SK Square, and all other post-merger shareholders
    whyItMatters: >-
      Cannot assess control risk, strategic constraints, or SKT's effective governance influence without cap-table
      detail
    diligencePath: Korean corporate registry (DART) or IPO prospectus; request direct from Rebellions in a diligence process
    relatedQuestionRefs:
      - QO007
      - QO019
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: ipo
    missingEvidence: IPO exchange, timeline, minimum public float, estimated price range, and any pre-IPO investor lock-up terms
    whyItMatters: Pre-IPO investors and potential participants cannot underwrite risk without understanding IPO structure and timing
    diligencePath: >-
      Monitor KRX or NASDAQ filings; engage underwriters listed when announced; track Korean Financial Supervisory
      Service announcements
    relatedQuestionRefs:
      - QO008
      - QO021
      - QO023
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: >-
      Comprehensive customer list, deployment volumes, contract values, and revenue contribution per customer beyond SKT
      and kt cloud
    whyItMatters: >-
      Customer concentration with related parties (KT, SKT) creates revenue quality risk that cannot be assessed without
      independent customer data
    diligencePath: >-
      Customer reference calls; commercial contract disclosure in IPO prospectus; public procurement records in Korea,
      Japan, Saudi Arabia
    relatedQuestionRefs:
      - QO014
      - QO028
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: competition
    missingEvidence: >-
      Third-party independent benchmark data comparing Rebellions ATOM or REBEL to Nvidia A100/H100 on standard
      inference workloads
    whyItMatters: >-
      Performance and energy-efficiency claims are company-asserted; no independent benchmarks from MLCommons, MLPerf,
      or equivalent bodies have been reviewed
    diligencePath: >-
      MLPerf inference benchmark submissions; third-party data-center operator technical reviews; academic benchmarking
      publications
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: minor
    topic: merger
    missingEvidence: Post-merger integration status, employee attrition rates, and any reported team conflicts or culture challenges
    whyItMatters: >-
      The December 2024 merger combined two distinct engineering teams; integration quality affects product delivery
      timelines
    diligencePath: >-
      Employee review platforms (Glassdoor Korea, Blind); news coverage of team changes; job postings signaling
      attrition
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: >-
      Independent analyst-published AI inference chip market size estimates (Gartner, IDC, McKinsey, Grand View
      Research) covering 2025–2028 with distinct inference vs. training market splits.
    whyItMatters: >-
      Current sizing relies primarily on Nvidia's own revenue as a market proxy, which overstates the inference-specific
      TAM, includes non-inference revenue, and carries optimism bias. Multiple independent estimates would triangulate
      the market size and de-risk the sizing assumption.
    diligencePath: >-
      Procure Gartner Magic Quadrant for AI Accelerators or Grand View Research AI Chip Market report; alternatively
      mine IDC press releases on AI chip market share accessible via prnewswire.com or idc.com public blog.
    relatedQuestionRefs:
      - QM003
  - type: access-blocked
    severity: material
    topic: sovereign-ai
    missingEvidence: >-
      Korean Ministry of Science and ICT (MSIT) official budget, procurement timeline, and committed contract values for
      the National AI Semiconductor Initiative that underpins SKT's sovereign AI chip procurement mandate.
    whyItMatters: >-
      The sovereign AI market is Rebellions' most important near-term revenue opportunity. Without confirmed government
      procurement budgets and timelines, the SOM estimate for Korean sovereign AI remains a first-order approximation
      rather than a contract-backed revenue forecast.
    diligencePath: >-
      Access MSIT.go.kr official announcements; Korea.kr policy news; review SKT investor day materials or quarterly
      earnings calls for committed AI infrastructure investment data. Korean-language sources would be primary.
    relatedQuestionRefs:
      - QM012
  - type: private-evidence-only
    severity: material
    topic: competitive-dynamics
    missingEvidence: >-
      Confirmed evidence of customer losses, failed pilot programs, or competitive displacement of Rebellions by other
      inference chip vendors (AMD, Intel, custom ASIC) in the Korean market.
    whyItMatters: >-
      All publicly available information is Rebellions' own announcements (partnerships won, rounds raised).
      Disconfirming evidence about competitive setbacks — if any — is not disclosed. Investor due diligence should
      include primary interviews with Korean telco procurement teams and industry analysts familiar with the competitive
      landscape.
    diligencePath: >-
      Primary interviews with SKT infrastructure team, KT cloud team, and Korean industry analysts. Review of SAPEON
      Korea's market position post-merger for any lost customer evidence.
    relatedQuestionRefs:
      - QM010
