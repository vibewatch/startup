  foundingLocation: "Seongnam, Gyeonggi Province, South Korea"
  headquarters: "Seongnam, Gyeonggi Province, South Korea"
  productSummary: >-
    AI inference accelerators and systems: ATOM and ATOM-Max products for live data-center deployment; REBEL chiplet,
    Rebel100 platform, RebelCard accelerator card, RebelServer, and RebelRack/RebelPOD rack-scale systems; plus the
    Rebellions SDK and OpenShift AI integration layer.
  customerFocus: >-
    Telecom operators, cloud/data-center operators, sovereign AI infrastructure programs, and enterprises adopting
    large-model inference systems.
  businessModel: >-
