companyProfile:
  summary: >-
    Rebellions is a Seongnam-based fabless AI semiconductor company founded in 2020 and now operating as the merged
    successor to SAPEON Korea after a December 2024 combination that created Korea's first AI chip unicorn. The
    company sells AI inference hardware and software, spanning the first-generation ATOM accelerator, the REBEL
    chiplet platform, Rebel100/RebelCard, and rack-scale RebelRack/RebelPOD systems, with Samsung as the core
    manufacturing partner and Red Hat as an enterprise software ecosystem partner. Rebellions has raised $850M through
    March 2026 and is pushing into Japan, Saudi Arabia, and the United States, but public disclosure on revenue,
    customer count, and margins remains sparse.
  foundedDate: "2020-01-01"
  founders:
    - name: Sunghyun Park
      role: Co-founder and CEO
      background: >-
        MIT CSAIL-trained engineer; previously worked at Intel, SpaceX, and Morgan Stanley before co-founding
        Rebellions.
