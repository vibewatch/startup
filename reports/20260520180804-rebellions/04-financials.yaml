  - id: funding-and-capital
    title: Funding History, Investor Mix, and Capital Base
    body: >
      Rebellions has raised $850 million in total capital across five rounds as of March 30, 2026, making
      it the most-funded AI chip startup in Korea and the first to reach unicorn status in the domestic
      chip sector. The funding cadence is notable for its compression: $650 million—over 75% of lifetime
      capital—was raised in the six months between September 2025 and March 2026.


      The round-by-round chronology begins with an undisclosed seed and Series A totaling approximately
      $76 million in aggregate (inferred from the January 2024 disclosure that "more than $200 million"
      had been raised at that point, less the Series B of $124 million). The Series B of $124 million
      closed January 30, 2024, led by KT Corporation (Korea's primary data-center operator and a
      strategic customer), with participation from Korelya Capital (France), Korea Development Bank,
      Samsung Ventures, and others. A $15 million Series B extension followed July 23, 2024, from Wa'ed
      Ventures—Saudi Aramco's venture arm—its first investment in a Korean startup, directly opening the
      Saudi market relationship.


      The $250 million Series C closed September 30, 2025, at a $1.4 billion post-money valuation. Arm
      led as a strategic investor—relevant because it provides access to ARM architecture roadmaps and
      ecosystem relationships—alongside Samsung Ventures and Pegatron VC (Taiwan-based, a critical
      manufacturing partner). Existing investors Korea Development Bank and Korelya Capital followed on.
      The Series C was extended November 10, 2025, with Kindred Ventures (first Korean startup
      investment) and Top Tier Capital Partners, adding US venture credibility ahead of the IPO.


      The pre-IPO round of $400 million closed March 30, 2026, at a $2.34 billion post-money valuation.
      Mirae Asset Financial Group (Korea's largest asset manager, which has backed Rebellions since
      Series A) led the round, with the Korea National Growth Fund participating—its first investment
      under the K-Nvidia national AI semiconductor initiative. The round signals strong institutional
      conviction and implicit government backing but also introduces obligations typical of public-fund
      investments (reporting requirements, strategic use-of-proceeds constraints).


      The investor mix spans strategic semiconductor partners (Arm, Samsung, SK Telecom via SAPEON
      shares), telco/data-center customers (KT), sovereign energy capital (Wa'ed/Aramco), domestic
      financial institutions (Korea Development Bank, Mirae Asset, Korea National Growth Fund), and US
      venture firms (Kindred, Top Tier Capital Partners). This breadth limits reliance on any single
      capital provider and reduces rollover risk for the next round, but the high proportion of strategic
      and government-aligned capital may create governance or market-access obligations that pure
      financial investors would not impose.
