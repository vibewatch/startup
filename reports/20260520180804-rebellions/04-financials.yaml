  - id: capital-adequacy
    title: Capital Adequacy, Runway, and IPO Path
    body: >
      Based on public information, Rebellions' capital adequacy position appears reasonably strong for
      its next 18–24 months of operations, anchored by the $400 million pre-IPO round closed March 30,
      2026. However, the actual cash on hand, monthly burn rate, and projected runway are not publicly
      disclosed, making a precise adequacy assessment impossible without access to internal financials.


      Qualitative signals are constructive: the company raised $650 million in six months (September
      2025–March 2026), suggesting investor conviction in near-term revenue growth. The Korea National
      Growth Fund's designation of Rebellions as its first K-Nvidia investment implies some alignment
      with Korean government support programs, which may provide additional grant or soft-loan access.
      Mirae Asset has backed the company since Series A, indicating long-term investor continuity rather
      than a new entrant who might exit quickly.


      The planned IPO is the central forward capital event. Press releases reference "preparation for a
      future IPO" but provide no exchange, filing date, price range, or underwriter details as of the
      report date. An IPO in 2026 would require disclosed financial statements—typically two to three
      years of audited results—meaning the IPO process itself would surface the revenue, margin, and burn
      data currently absent from public sources. Until then, the company operates under private-market
      disclosure norms.


      The primary capital risk is execution gap: if the $68 million 2025 revenue target was missed
      significantly, the implied valuation multiple at $2.34 billion post-money would look stretched,
      potentially complicating the IPO pricing. Fabless chip companies historically need 3–5 years of
      revenue growth to justify valuation multiples comparable to software companies; Rebellions is at an
      early stage of that revenue trajectory. Secondary risks include potential delays in REBEL-Quad
      mass production, HBM3E supply constraints, and slower-than-expected US market penetration.
