  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue FY2024-FY2025
      missingEvidence: >-
        Audited income statements for FY2024 and FY2025 showing revenue, COGS, gross margin, and net
        operating loss for the combined Rebellions/SAPEON entity.
      whyItMatters: >-
        The $2.34 billion valuation cannot be assessed against revenue or earnings multiples without
        at least two full fiscal years of post-merger financial data.
      diligencePath: >-
        Request directly from CFO Sungkyue Shin; or await IPO prospectus which must include two to three
        years of audited financials.
      relatedQuestionRefs:
        - QI003
        - QI018
        - QI030
      relatedTableRefs:
        - TI003
        - TI008

    - type: private-evidence-only
      severity: blocking
      topic: gross margin COGS
      missingEvidence: >-
        COGS breakdown including wafer costs from Samsung Foundry, HBM3E memory costs from SK Hynix,
        system assembly costs from Pegatron, and resulting gross margin per product line.
      whyItMatters: >-
        Without gross margin data, it is impossible to assess whether hardware unit economics are positive
        or whether the company is subsidizing chip sales. This is the core underwriting question for a
        hardware-first AI chip startup.
      diligencePath: >-
        Request management accounts showing COGS by component for at least ATOM and REBEL-Quad; review
        Samsung Foundry supply agreement for wafer pricing.
      relatedQuestionRefs:
        - QI005
        - QI011
        - QI019
      relatedTableRefs:
        - TI003
        - TI007

    - type: private-evidence-only
      severity: blocking
      topic: cash burn and runway
      missingEvidence: >-
        Monthly operating cash burn for the last four to six quarters, and confirmed cash on hand as of
        March 31, 2026, following the $400 million pre-IPO close.
      whyItMatters: >-
        Runway calculation is impossible without burn. Given global expansion, REBEL-Quad production
        scale-up, and IPO preparation, burn may be substantially higher than FY2023 data implies.
      diligencePath: >-
        Request management accounts; treasury reports; bank statements as of Q1 2026 close.
      relatedQuestionRefs:
        - QI009
        - QI012
      relatedTableRefs:
        - TI004

    - type: private-evidence-only
      severity: material
      topic: customer concentration
      missingEvidence: >-
        Customer count, top-3 customer revenue share, and geographic revenue mix (Korea vs international).
      whyItMatters: >-
        Press release language ("Korea's largest commercial AI service", Saudi Aramco, NTT DOCOMO)
        suggests a small number of large customers may dominate revenue, creating concentration risk that
        cannot be quantified from public data.
      diligencePath: >-
        Request customer concentration schedule; identify top-3 customers by revenue contribution;
        obtain contract duration and renewal terms.
      relatedQuestionRefs:
        - QI008
        - QI023
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: material
      topic: IPO readiness timeline
      missingEvidence: >-
        Target IPO exchange (KRX, NASDAQ, or dual listing), underwriter mandate, expected filing date,
        and price range guidance from the pre-IPO roadshow.
      whyItMatters: >-
        The IPO is the stated primary next capital event. Execution risk is high: if revenue does not
        support the $2.34 billion valuation in public markets, a down-round IPO or IPO withdrawal could
        trigger investor distress.
      diligencePath: >-
        Request IPO timeline memorandum; identify lead underwriter from Mirae Asset Venture Investment
        relationship; confirm target exchange preference from CEO/CFO.
      relatedQuestionRefs:
        - QI010
        - QI025
      relatedTableRefs:
        - TI004
