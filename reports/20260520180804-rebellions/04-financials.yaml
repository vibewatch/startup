  - id: cost-structure
    title: Cost Structure, Capital Intensity, and Fabless Model Economics
    body: >
      Rebellions operates as a fabless semiconductor company. This model eliminates the billions of
      dollars in manufacturing capex required by integrated device manufacturers (IDMs) such as Samsung
      or Intel, but replaces it with a different form of capital intensity: recurring non-recurring
      engineering (NRE) and mask set costs paid to Samsung Foundry for each tape-out, plus ongoing
      royalties or license fees for any third-party IP used in the chip design.


      Samsung Foundry manufactures Rebellions' chips on advanced process nodes. The ATOM chip was
      produced on a leading-edge process with GDDR6 memory; the REBEL-Quad uses a chiplet architecture
      with HBM3E memory. Samsung Foundry's published capability includes 14/10/8/5/4nm FinFET and 3nm
      GAA with EUV from 5nm, and it offers integrated packaging solutions (3D/2.5D) relevant for
      Rebellions' chiplet approach. The cost of a single tape-out on a sub-5nm node with EUV can range
      from $20–80 million for the mask set alone (industry analyst estimates; not Rebellions-specific),
      meaning each new chip generation consumes a significant fraction of a funding round before the
      first wafer is shipped.


      The turnkey relationship with Samsung—covering silicon manufacturing, HBM3E memory supply (sourced
      through SK Hynix and Samsung Electronics), and packaging—simplifies vendor management but
      concentrates supply-chain risk. Any Samsung Foundry yield issues, capacity allocation changes, or
      HBM3E supply constraints would directly impact Rebellions' ability to fulfill customer orders.
      Forbes reported that Park acknowledged "shortage in foundry capacity" and "shortage of HBM" as
      structural risks. These are industry-wide constraints, not unique to Rebellions, but a smaller
      customer has less negotiating power over allocation priorities than hyperscale customers of TSMC or
      Samsung.


      On the cost side, fabless AI chip startups at Rebellions' stage typically carry: (1) R&D as the
      dominant operating expense, driven by chip design engineering headcount; (2) Cost of goods sold
      (COGS) comprising wafer costs, memory, packaging, and any system-assembly costs from Pegatron; and
      (3) sales and marketing, which appears to be growing given the expansion of the US team under
      Chief Business Officer Marshall Choy and the opening of subsidiaries in Japan and Saudi Arabia. The
      FY2023 net loss of 13.7 billion KRW (~$10.5M) against revenue of 2.7 billion KRW implies a deeply
      negative operating margin at that stage; the scale-up since—particularly the SAPEON merger
      (December 2024) and mass production of REBEL-Quad—would have materially increased both revenue
      and expenditures, but no FY2024–2025 financials are available to verify.


      The adverse case on cost structure: AI chip startups require sustained capital to fund repeated
      tape-out cycles, design team expansion, and go-to-market investments, before achieving the scale
      needed to generate positive gross margins on hardware sales. The absence of publicly disclosed
      gross margin data makes it impossible to confirm whether the ATOM chip achieved positive unit
      economics. The company's stated focus on total cost of ownership positioning implies hardware
      margins may be thin or subsidized by software/services over time.
