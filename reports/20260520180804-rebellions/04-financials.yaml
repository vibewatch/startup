      - - HBM3E Memory (SK Hynix / Samsung)
        - Per unit; industry supply constrained
        - High — HBM3E is scarce and expensive
        - 'Forbes quotes Park: "shortage of HBM"'
        - Supply constraint limits production ceiling
      - - System Assembly (Pegatron)
        - Per system; variable COGS
        - Unknown — not disclosed
        - Partnership announced November 2025; no margin data
        - Partner margin reduces Rebellions system-level gross margin
      - - Sales, Marketing, and Global Expansion
        - Growing; US team under Marshall Choy; subsidiaries in Japan, Saudi Arabia
        - Rising OpEx; headcount-driven
        - Pre-IPO press release; executive appointments release
        - Customer acquisition costs for non-Korea markets unknown
      - - IPO Preparation Costs
