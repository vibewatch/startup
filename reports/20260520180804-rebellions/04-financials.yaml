callouts:
  - calloutType: risk
    title: No Public Revenue for Two Full Years Post-Merger
    body: >-
      The last confirmed Rebellions revenue figure is FY2023's 2.7 billion KRW (~$2.1 million), predating
      the SAPEON merger, the REBEL-Quad launch, and all rounds from September 2025 onward. Two full fiscal
      years of the company's most critical growth phase—including the first full year post-merger—are
      entirely opaque. A $2.34 billion valuation anchored in private-market rounds cannot be validated
      against revenue multiples without FY2024–2025 actuals.
    claimRefs:
      - CI037
      - CI009

  - calloutType: risk
    title: Capital Intensity Risk of Fabless AI Chip Model
    body: >-
      Each new chip generation at sub-5nm processes requires NRE/mask costs in the range of $20–80
      million per tape-out, paid to Samsung Foundry before the first wafer is produced. Combined with
      HBM3E supply constraints (acknowledged by CEO Park), the fabless model concentrates risk in
      recurring lumpy capital events that are invisible in public fundraising announcements but
      significantly reduce effective cash runway relative to the headline raise amount.
    claimRefs:
      - CI022
      - CI023
      - CI024
      - CI025

  - calloutType: insight
    title: Pre-IPO Investor Mix Signals Near-Term IPO Path But Adds Governance Complexity
    body: >-
      Mirae Asset (Korea's largest asset manager, backer since Series A) and the Korea National Growth Fund
      (government-backed, first K-Nvidia investment) anchoring the pre-IPO round signals strong institutional
      and sovereign conviction. However, the presence of public-fund capital typically introduces governance
      obligations—reporting requirements, use-of-proceeds restrictions, or sector alignment conditions—that
      pure financial VCs would not impose. These obligations are not publicly disclosed and represent a
      diligence inquiry for any prospective follow-on investor.
    claimRefs:
      - CI017
      - CI018
      - CI019
      - CI034

  - calloutType: assumption
    title: Revenue Target Achievability Is Unverified
    body: >-
      CEO Park's stated 2025 revenue target of approximately 100 billion KRW (~$68 million) implies a
      roughly 37-fold increase from FY2023's 2.7 billion KRW baseline. This growth rate is not inherently
      impossible for a chip company launching a second-generation product into a rapidly expanding market,
      but it remains unverified as of the report date. The IPO pricing and valuation sustainability will
      depend critically on whether FY2025 actuals approach this level.
    claimRefs:
      - CI004
      - CI009
      - CI038

