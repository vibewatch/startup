        - Industry analogue; Forbes notes stringent hiring standards; ~400+ post-merger headcount
        - Talent attrition post-merger integration risk
      - - NRE / Mask Set Costs (Samsung Foundry)
        - Per tape-out; lumpy capital event
        - "High: industry range $20–80 M for sub-5 nm EUV node"
        - Samsung Foundry disclosed capability (3 nm GAA, 5 nm FinFET EUV); industry analyst proxies
        - Yield-risk; foundry capacity allocation risk
      - - Wafer / COGS (per unit)
        - Variable; tied to unit volume
        - Unknown — not disclosed
        - No COGS data available
