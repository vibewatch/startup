  - id: section-leadership
    title: Founders, leadership, key-person risk, and governance
    body: >
      CEO Sunghyun Park (age 40 as of the April 2025 Forbes profile) is the company's dominant public figure and
      most-cited founder. Park holds a master's and doctorate from MIT's Computer Science and Artificial Intelligence
      Laboratory (CSAIL) and built his pre-Rebellions career across Intel (chip engineering), SpaceX (systems
      engineering), and Morgan Stanley (financial sector). He led Rebellions through five funding rounds and personally
      negotiated the SAPEON merger. His background spans both technical depth and capital markets, which is unusual for
      a deep-tech hardware founder and is the primary source of the company's key-person concentration risk.


      The other four co-founders are not individually named in public sources reviewed for this chapter; this is a
      diligence gap that later chapters should flag, as governance and succession plans are unknown for the broader
      founding team. Following the December 2024 merger, Park was confirmed as CEO of the merged entity. In
      November 2025, the company appointed Marshall Choy as Chief Business Officer, based in Silicon Valley, with
      over two decades of enterprise AI and systems experience. Choy leads Rebellions' newly established U.S. entity
      and global go-to-market.


      Governance transparency is limited by the company's private status. The board composition post-merger has not
      been disclosed publicly. SK Telecom holds strategic investor status and presumably has board representation, but
      exact board composition and voting rights are not confirmed in public materials. This is a material gap for
      diligence: if SKT has board control or significant veto rights, that affects how independent Rebellions'
      strategic decisions are in global markets outside Korea. The merger terms specified that SKT, SK Square, and
      SK Hynix sold 3% of their SAPEON shares prior to closing to ensure Rebellions' management became the majority
      shareholders of the merged entity, which partially mitigates governance capture risk—but the residual stake
      distribution has not been disclosed.
