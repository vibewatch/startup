callouts:
  - calloutType: strength
    title: "First-mover inference NPU at scale in Korean data centers"
    body: >-
      ATOM is the only Korean-developed inference NPU with confirmed live data-center deployment (kt cloud since
      May 2023 and SKT testing as of mid-2025), giving Rebellions a commercially validated product ahead of any
      domestic competitor. The Samsung foundry relationship at 5nm and 4nm is a meaningful supply-chain advantage
      that would be difficult for a new entrant to replicate quickly.
    claimRefs:
      - CO025
      - CO026
      - CO032

  - calloutType: risk
    title: "Key-person concentration and undisclosed board governance"
    body: >-
      CEO Park Sung-hyun is the sole publicly documented strategic decision-maker. The four other co-founders
      are unnamed in all public sources, the board composition post-merger is not disclosed, and no succession
      plan is publicly documented. Any leadership disruption ahead of IPO would carry significant execution risk.
    claimRefs:
      - CO004
      - CO006
      - CO007

  - calloutType: risk
    title: "No public financial disclosure — revenue, ARR, margins all unknown"
    body: >-
      Rebellions has not disclosed revenue, ARR, gross margin, customer count, or burn rate in any public
      communication reviewed. For a company raising $850M and preparing for an IPO, this creates an information
      asymmetry that makes financial diligence from public sources impossible. Later chapters will carry this
      as a blocking evidence gap.
    claimRefs:
      - CO052

  - calloutType: insight
    title: "Merger with SAPEON was strategically necessary — competitive scale, not organic growth"
    body: >-
      Park Sung-hyun stated publicly that "merging was the only way to survive" before SKT's call. The merger
      was not a growth-from-strength acquisition but a consolidation under competitive pressure. The merged
      entity combines talent, IP, and investor relationships—but also integration risk and a more complex
      governance structure with SKT as a strategic investor holding real influence over strategy.
    claimRefs:
      - CO015
      - CO016
      - CO031

