  - id: section-adverse
    title: Adverse considerations, competition, and evidence gaps
    body: >
      Rebellions operates in a market where Nvidia held approximately 94% share of the AI chip market as of 2023,
      according to The Investor's reporting at the time of the SAPEON merger announcement. This competitive reality
      is the central adverse factor: every product decision, customer win, and capital raise must be assessed
      against a deeply entrenched market leader with advantages in software ecosystem (CUDA), scale, and brand
      recognition. Rebellions' inference-only strategy—deliberately avoiding the training market—is both a
      focused differentiation and a bet that inference workloads will be large enough and distinct enough for a
      specialist to win meaningful share.


      No public revenue figures, ARR, gross margins, or customer count data have been released. The company
      disclosed only qualitative deployment status (SKT testing, kt cloud live, Saudi Arabia and Japan markets
      entered). This makes financial diligence impossible from public sources alone and is the most material
      evidence gap for this report. The absence of disclosed financials is consistent with private-company
      norms but is a specific concern given the company's stated IPO preparation—investors should expect formal
      filings or a prospectus before any IPO close.


      Post-merger integration risk is non-trivial. Combining two separate chip development teams (Rebellions and
      SAPEON Korea), their respective engineering cultures, and their overlapping investor bases under a single
      corporate structure is a complex organizational challenge. The surviving legal entity is SAPEON Korea
      (restructured as Rebellions), which introduces potential friction around IP ownership, team retention, and
      cultural alignment. The company has not disclosed any attrition data post-merger.


      Key-person concentration in Park Sung-hyun is the primary leadership risk. Park was the central figure in
      every fundraise and negotiation on record; his continued availability is a prerequisite for the planned IPO.
      Board composition and succession planning are not publicly documented. These governance gaps—combined with
      the lack of revenue disclosure and an unspecified IPO timeline—constitute the residual diligence burden
      that this chapter flags for later analysis.
