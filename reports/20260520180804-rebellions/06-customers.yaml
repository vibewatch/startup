  - id: durability-and-concentration-risk
    title: Durability and concentration risk
    body: |-
      Durability is where the public record gets materially weaker. This chapter found no disclosed public customer count, no NRR or GRR, no churn rate, no contract-length disclosure, and no account-level expansion data. That does not mean the customer base is weak; it means the underwriting burden shifts from public metrics to qualitative judgment. Public sources are good enough to show real adoption, but not good enough to show how sticky or diversified that adoption is.

      The most important risk is concentration. KT/kt cloud and SK Telecom are the clearest production anchors, while international demand is often expressed through unnamed orders, geography-level deployment claims, or partner-led go-to-market. Forbes and Korea JoongAng Daily both sharpen the adverse case: winning data-center buyers away from Nvidia is hard, and Rebellions still has not disclosed the denominator data needed to prove breadth. The practical read is a customer story with credible flagship accounts and credible expansion vectors, but still too much opacity to dismiss concentration and renewal risk.
    claimRefs:
