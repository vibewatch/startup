  - id: channels-and-expansion-loops
    title: Channels and expansion loops
    body: |-
      Rebellions is not relying only on direct Korean enterprise selling. The company has built a channel and ecosystem layer around customer acquisition, most visibly through Red Hat, Marshall Choy's commercial hire, and U.S. entity formation. The Red Hat OpenShift AI launch matters because it gives Rebellions a procurement-friendly enterprise path: instead of every prospect underwriting a standalone hardware stack, buyers can encounter the product through an established enterprise AI platform and channel relationship. Independent trade coverage picked up that announcement, which improves confidence that the launch was more than a single-house press release.

      The expansion loop also runs through sovereign and telecom infrastructure partnerships. The Wa'ed-backed Middle East bridgehead, the SKT/Arm sovereign AI collaboration, and Japan-facing validation with DOCOMO Innovations all create customer-adjacent access points. Still, these mechanisms are mostly path-opening evidence, not disclosed proof of repeat revenue. The commercial upside is real, but investors should separate partner leverage from proven end-customer durability.
    claimRefs:
      - CU008
      - CU009
