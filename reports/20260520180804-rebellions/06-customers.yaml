chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer proof for Rebellions is strongest in Korean telecom infrastructure, where KT/kt cloud and SK Telecom are the clearest named production anchors. Outside Korea, public evidence supports Saudi, Japan, U.S., and Thailand demand plus a meaningful enterprise channel through Red Hat, but much of that proof is still validation-grade, third-party reported, or unnamed, leaving concentration and durability as the chapter's central risks.
sections:
  - id: customer-base-and-segment-mix
    title: Customer base and segment mix
    body: |-
      Rebellions' customer story is easiest to understand by buyer workflow rather than by a simple logo count. Official solutions and product pages show the company selling inference infrastructure into telecom, sovereign AI, enterprise AI, and data-center environments, which means the economic buyer is usually a cloud or infrastructure operator rather than an application team. The public record then splits into three evidence tiers. First, there is direct production proof in Korea through KT/kt cloud and SK Telecom. Second, there is third-party reported roster evidence for other Korean cloud divisions plus Saudi-linked demand. Third, there is broader but thinner expansion evidence across Japan, the United States, and Thailand.

      This distinction matters because public customer depth is uneven. KT and SKT are supported by direct company statements or customer-adjacent proof, while Kakao, Naver, Saudi Aramco, and the U.S./Japan/Thailand geographies are mainly supported by Forbes and company fundraising announcements. That is enough to conclude Rebellions has moved beyond a single-customer story, but not enough to underwrite broad commercial breadth with high confidence.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU006
      - CU012
      - CU014
      - CU015
      - CU027
      - CU036
    tableRefs:
      - TU001
      - TU002
    figureRefs:
      - FU001
  - id: named-customer-proof-and-classification
    title: Named customer proof and proof classification
    body: |-
      The strongest named customer proof remains in Korea. Rebellions said in its Series B release that KT and kt cloud were lead investors and first customers, and Korea JoongAng Daily separately reported that Rebellions had delivered ATOM chips into KT's data center to run cloud services. Rebellions' own about page then adds the clearest SK Telecom production statement, carrying a quote from SKT's Tony Ha that SKT is deploying Rebellions NPUs in A., which the page describes as Korea's largest LLM service.

      Outside those anchors, the roster becomes less direct and must be classified carefully. Forbes reported blue-chip cloud-division customers at SK, Kakao, and Naver, a first Saudi Aramco deal, and orders from the United States, Japan, and Thailand by year-end 2024. Rebellions' 2025 and 2026 announcements then added geography-level deployment language, but still left most non-Korean customer names undisclosed. Separately, the Rebellions/SKT/DOCOMO and SKT/Arm/Rebellions announcements are valuable validation evidence, yet they should not be mistaken for the same thing as a broad, named paying-customer roster.
