evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Public board composition, committee structure, and any independent-governance disclosures.
    whyItMatters: >-
      The retained source set names only the two founders, so investors cannot assess oversight depth, succession
      resilience, or who constrains management after the reported unicorn valuation step-up.
    diligencePath: Request the current board list, observer rights, and governance pack from the company or lead investor.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: Revenue, ARR, gross margin, CAC, payback, and current headcount by function.
    whyItMatters: >-
      The company can be identified and its financing can be described, but no retained public evidence supports the
      operating economics needed to evaluate whether the valuation is justified.
    diligencePath: Request a current board deck or KPI pack with revenue quality, margin bridge, and hiring plan.
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Investor names, check sizes, liquidation preferences, pro rata rights, and any debt or secondary activity around
      the Series A.
    whyItMatters: >-
      Public coverage confirms the round and valuation but not who controls the company economically or what downside
      protections exist for the new money.
    diligencePath: Request the financing summary, cap table, and main transaction documents from management or counsel.
    relatedTableRefs:
      - TO001
      - TO003
  - type: stale
    severity: minor
    topic: clinical-study-results
    missingEvidence: The actual results of the female-focused GLP-1 study the company said it would publish later in October 2025.
    whyItMatters: >-
      If the study was completed and favorable, it could materially strengthen the product-differentiation case; if it
      was delayed or inconclusive, that also matters.
    diligencePath: >-
      Search for the released study, preprint, poster, or press summary and reconcile it to the blood-test-led care
      narrative.
  - type: missing-source
    severity: material
    topic: market-sizing-sam-som
    missingEvidence: >-
      A segmented count of UK women eligible for SheMed-style clinician-screened GLP-1 treatment plus adjacent
      symptom-testing pathways.
    whyItMatters: >-
      Without an eligible-population denominator, this chapter can only bound demand using rollout cohorts, pricing, and
      member disclosures rather than produce a defensible SAM or SOM.
    diligencePath: >-
      Request management's cohort-definition deck and pair it with third-party prescription-volume or claims data split
      by diagnosis, payer, and channel.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: cohort-economics
    missingEvidence: >-
      Active paying-member counts, continuation by medication, repeat-purchase cadence, CAC by channel, payback period,
      and gross-margin bridge.
    whyItMatters: >-
      Valuation depends on whether early member growth translates into durable subscription economics rather than
      one-time curiosity or low-retention acquisition.
    diligencePath: >-
      Obtain cohort retention tables, prescribing continuation by dose and brand, and contribution-margin reporting from
      the company or lead investor materials.
    relatedQuestionRefs:
      - QM002
      - QM003
  - type: conflicting-data
    severity: minor
    topic: member-count-definition
    missingEvidence: >-
      A precise reconciliation between the homepage's 50,000-plus disclosure and press references to more than 60,000
      members in under a year.
    whyItMatters: >-
      The public signals are directionally supportive but do not yet establish whether the metric is sign-ups, total
      members, or currently active paying customers.
    diligencePath: >-
      Ask management to define the member KPI, its as-of date, and the split between registered users, screened users,
      and paying active members.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: shemed-pricing
    missingEvidence: A current SheMed public pricing page or checkout example showing medication, dose, and contract terms.
    whyItMatters: >-
      Without SheMed's own list pricing, the chapter cannot make an apples-to-apples pricing or packaging comparison
      against pharmacy incumbents.
    diligencePath: Retain a current SheMed pricing URL or a publicly reviewable checkout example in the next refresh.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: outcomes-and-retention
    missingEvidence: Public retention, refill continuation, adverse-event, and outcome benchmarks versus other providers.
    whyItMatters: >-
      Moat durability depends on whether the higher-friction workflow improves outcomes or willingness to pay, not just
      whether it sounds safer.
    diligencePath: Request cohort retention, refill continuation, and safety-outcome dashboards or independent comparative studies.
    relatedQuestionRefs:
      - QP007
  - type: enumeration-incomplete
    severity: minor
    topic: competitive-landscape
    missingEvidence: >-
      A complete UK direct-peer census and provider-by-provider audit of every capability shown in the landscape and
      feature tables.
    whyItMatters: >-
      Partial coverage may omit direct specialists, internal-build pathways, or capabilities that change the apparent
      competitive position.
    diligencePath: >-
      Cross-check GPhC and CQC registers, provider sites, payer procurement records, and current employer-benefit
      offerings.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: material
    topic: disclosure-gap
    missingEvidence: Revenue, ARR or GMV, active paying members, and product-level revenue mix by medication and dose.
    whyItMatters: >-
      Without top-line and mix disclosure, it is impossible to test whether the care-heavy bundle converts demand into
      durable revenue quality.
    diligencePath: >-
      Request monthly management reporting that splits active paying members, realized ASP, refunds, and revenue by drug
      and dose.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin bridge, lab and fulfilment cost, clinician minutes, CAC, and payback by acquisition channel.
    whyItMatters: >-
      These inputs determine whether SheMed's differentiation creates attractive contribution margin or simply higher
      service cost.
    diligencePath: >-
      Request cohort P&Ls or unit-economics packs showing cost to serve, CAC, contribution margin, and retention by
      cohort.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: runway
    missingEvidence: Cash on hand after the Series A, monthly burn, debt or credit facilities, and next-round trigger metrics.
    whyItMatters: Capital raised is not cash runway, so financing dependency cannot be underwritten from the round size alone.
    diligencePath: Obtain the latest board pack or management accounts with liquidity, burn, covenant, and fundraising-planning data.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: minor
    topic: investor-terms
    missingEvidence: Investor identities, cap-table detail, and any preference or governance terms attached to the Series A.
    whyItMatters: >-
      Terms and counterparties affect downside protection and future financing flexibility even when the headline round
      size is known.
    diligencePath: Request the financing summary, cap table, and key term sheet provisions from management or lead counsel.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: technical-disclosure-gap
    missingEvidence: Public API documentation, system architecture detail, security certifications, or uptime/status disclosures.
    whyItMatters: >-
      Without public technical proof, investors can see the care workflow but cannot assess platform defensibility,
      integration burden, or operational resilience.
    diligencePath: >-
      Request architecture diagrams, vendor map, incident history, security/compliance certifications, and current
      uptime/support dashboards.
    relatedQuestionRefs:
      - QE003
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: outcome-proof
    missingEvidence: >-
      Independent or company-published evidence that blood-test-first personalization improves safety, retention,
      outcomes, or monetization versus simpler telehealth prescribing.
    whyItMatters: >-
      This is the core differentiation claim, and without outcome proof it is hard to know whether the extra operational
      complexity creates durable value.
    diligencePath: >-
      Request cohort retention and outcomes by treatment plan, adverse-event rates, lab-detected intervention examples,
      and any published protocol or study results.
    relatedQuestionRefs:
      - QE005
  - type: private-evidence-only
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public developer or practitioner-community proxy showing technical adoption, integration activity, release
