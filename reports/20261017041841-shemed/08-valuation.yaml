callouts:
  - calloutType: recommendation
    title: Public-evidence verdict
    body: >-
      The right public-evidence call is research-more, not buy: the model looks differentiated, but
      the current price signal is ahead of the disclosed proof on revenue quality, retention, and
      cap-table terms.
    claimRefs:
      - CV005
      - CV013
      - CV015
      - CV016
  - calloutType: risk
    title: Down-round trigger
    body: >-
      A combination of price transparency, tighter prescribing safeguards, and weak cohort economics
      would turn the current unicorn headline from a proof point into a reference for future
      compression.
    claimRefs:
      - CV012
      - CV014
      - CV015
