        max: 5
        low: Questionnaire-led / generic
        high: Independent verification + lab workflow
        description: Ordinal 1-5 score from retained evidence
        scale: ordinal
      yAxis:
        label: Women-specific care focus
        min: 1
        max: 5
        low: Generic weight-loss proposition
        high: Women-specific metabolic care
        description: Ordinal 1-5 score from retained evidence
        scale: ordinal
      points:
        - label: SheMed
          x: 5
          y: 5
          detail: Lab-first onboarding plus explicit women-focused positioning.
        - label: NHS England pathway
          x: 4
          y: 2
          detail: High clinical gating and wraparound support, but general obesity pathway.
        - label: LloydsPharmacy Online Doctor
          x: 3
          y: 1
          detail: Clear price anchor and pharmacy infrastructure; generic positioning.
        - label: Superdrug Online Doctor
          x: 3
          y: 1
          detail: Retail distribution and visible starting price; generic positioning.
        - label: Boots Online Doctor
          x: 3
          y: 1
          detail: National retail trust and ongoing support; generic positioning.
        - label: Numan
          x: 2
          y: 3
          detail: Adjacent digital-health platform expanding into female health.
    approximationNotes: >-
      Ordinal 1-5 positions synthesize retained evidence on verification depth
      and women-specific focus; they are not measured market shares or outcome
      scores.
    claimRefs: [CP001, CP005, CP007, CP008, CP009, CP010, CP011, CP013, CP015]
