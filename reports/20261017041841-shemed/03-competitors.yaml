company:
  name: SheMed
chapter:
  number: 3
  title: Competitors
  summary: >-
    SheMed competes less against one lookalike startup than against three buyer
    routes: the NHS obesity pathway, large UK online-pharmacy incumbents with
    transparent GLP-1 pricing, and adjacent women-focused digital-health
    platforms that could move closer to prescribing. The retained evidence
    suggests SheMed's current differentiation is a higher-friction but more
    trust-oriented workflow - blood testing, identity verification, and
    women-specific positioning - while incumbents still hold price transparency
    and distribution reach.
sections:
  - id: competitive-landscape
    title: Competitive landscape spans public care, pharmacy incumbents, and funded adjacencies
    body: >-
      The retained pool shows that buyers can solve the same obesity-care job
      through at least three channels. First, the NHS remains the status-quo
      incumbent: NHS England says weight-loss medicines are prescribed only to
      patients living with obesity who meet specific criteria, and tirzepatide
      rollout is being phased across a 12-year timetable with only 220,000
      patients prioritised in the first three years, so the public pathway
      remains clinically credible but capacity constrained. Second, private
      pharmacy-led competitors already advertise transparent starting prices and
      broad distribution; WhichWeightMeds lists LloydsPharmacy Online Doctor,
      Superdrug Online Doctor, and Boots Online Doctor with visible Mounjaro
      entry prices and common consultation-plus-delivery workflows. Third,
      adjacent digital-health platforms are still being funded around women's
      health, with EU-Startups reporting fresh capital for Numan's move into
      female health, which means SheMed is not defending only against current
      GLP-1 dispensers but also against adjacent platforms that can add
      prescribing over time. The retained evidence does not show a standalone
      "internal build" vendor, but it does show a practical self-assembly
      substitute: a patient can combine NHS guidance, a regulated pharmacy, and
      generic lifestyle support rather than buy SheMed's all-in-one workflow.
    claimRefs: [CP011, CP012, CP007, CP008, CP009, CP010, CP015]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: differentiation-and-trust
    title: SheMed differentiates on verification depth and women-specific positioning
    body: >-
      SheMed's strongest visible differentiation is not lowest-price
      distribution but a more managed clinical workflow. On its official "How
      it works" page, the company shows a sequence of questionnaire, weight and
      ID verification, at-home blood testing, and then treatment shipment with
      a side-effect care kit. Third-party coverage points in the same direction:
      Pharmacy UK says SheMed is built around women's hormonal and metabolic
      needs and reports that SheMed uses laboratory-based blood tests rather
      than self-reported BMI alone, while Digital Health reported a Tasso blood
      test integration. This matters because the GPhC now says prescribers of
      weight-management medicines cannot rely on a questionnaire alone and must
      independently verify weight, height, and-or BMI, so SheMed's higher-touch
      process is directionally aligned with the stricter trust and compliance
      bar rather than obviously ahead of it by default. The trade-off is buyer
      friction: a workflow with blood tests and verification can justify trust,
      but it can also slow conversion compared with generic pharmacy funnels
      that already surface clear monthly price anchors.
    claimRefs: [CP001, CP002, CP005, CP006, CP014, CP015]
    tableRefs: [TP002]
  - id: pricing-distribution-and-switching
    title: Incumbents still own price transparency and easy multi-homing
    body: >-
      The private-competitor set in retained evidence competes on visible price
      anchors and distribution convenience. WhichWeightMeds shows Lloyds,
      Superdrug, and Boots with published starting prices, while the same page
      emphasizes collection-or-delivery convenience, existing retail networks,
      and ongoing support. By contrast, the retained pool for this chapter does
      not include a current SheMed public pricing page or checkout flow, so the
      company cannot yet be shown beating pharmacy incumbents on cash-pay
      transparency. That asymmetry matters for switching cost. When major
      alternatives share the same medication class, advertise visible entry
      prices, and route through GPhC-registered pharmacy infrastructure, buyers
      can compare and re-route relatively easily; SheMed's main potential lock
      in the retained evidence is its testing cadence, monitoring workflow, and
      women-specific support narrative rather than proprietary distribution.
      NHS England's wraparound-care requirement also means the public pathway is
      more than drug access alone, so the status quo alternative is stronger
      than a simple "slow waiting list" caricature.
    claimRefs: [CP007, CP008, CP009, CP010, CP013, CP016]
    tableRefs: [TP003]
  - id: moat-durability-and-displacement
    title: Moat durability depends on outcome proof, not just better onboarding
    body: >-
      The chapter's evidence supports a real but still provisional moat. SheMed
      has a differentiated operating pattern - verification, blood testing, and
      women-centered positioning - and that should matter more if regulation
      keeps tightening around online prescribing. But the same evidence also
      highlights how commoditization can arrive from two sides. Pharmacy-led
      incumbents can compress differentiation through transparent pricing and
      convenient fulfillment, while adjacent digital-health platforms with fresh
      capital can add women-focused positioning without starting from zero.
      SheMed therefore looks more durable on trust posture than on distribution
      power. The unresolved question is whether its added workflow creates
      superior retention, outcomes, or willingness to pay; without public price
      disclosure and cohort-quality proof, the company can be described as
      clinically better packaged than generic pharmacy options, but not yet as
      competitively unassailable.
    claimRefs: [CP005, CP007, CP014, CP015, CP016]
