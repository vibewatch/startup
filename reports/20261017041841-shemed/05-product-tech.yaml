chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    SheMed's public product is a women-focused GLP-1 care workflow that starts with
    app-based eligibility and identity checks, requires an at-home blood test before
    prescribing, and then wraps medication delivery with remote monitoring and support.
    The strongest externally corroborated differentiator is the Tasso-enabled blood-test-first
    model, but public technical disclosure remains thin: the assigned evidence does not show
    public APIs, uptime metrics, security certifications, or published outcome data proving
    that personalization materially outperforms simpler telehealth prescribing flows.
sections:
  - id: "care-model"
    title: "Care model: remote prescribing built around baseline diagnostics"
    body: >-
      In customer-workflow terms, SheMed is not just a generic online prescription form. Its
      published flow starts with a questionnaire, moves into app-based weight and ID
      verification, then requires an at-home blood test before a clinician-reviewed plan and
      first prescription are issued. The same page says the first shipment includes treatment,
      a side-effect care kit, a disposal bin, and starter materials, which means the product is
      sold as a bundled care journey rather than a single medication transaction. The blood-test-first
      structure is more specific than the typical "consult then ship" telehealth pitch, but the
      public evidence still describes the workflow more clearly than the underlying software or
      operating systems that support it.
    claimRefs: ["CE001", "CE002", "CE003"]
    tableRefs: ["TE001", "TE002"]
  - id: "architecture"
    title: "Operating architecture is workflow-defined, with Tasso as the clearest disclosed dependency"
    body: >-
      The assigned evidence supports a practical operating architecture rather than a detailed
      software-stack disclosure. SheMed's official page shows intake, verification, baseline
      diagnostics, prescription, and repeat monitoring; the partner release adds the concrete
      diagnostic component by naming Tasso+ as the blood-collection device and describing
      comprehensive lab screening before GLP-1 treatment starts. Publicly, that makes the
      architecture legible as a care workflow with remote diagnostics, clinician review, and
      repeat monitoring, not as a documented API or developer platform. Digital Health's coverage
      reinforces that the company presents itself as a digital platform with medical advice, data
      insights, and support, while also noting that fresh capital is meant to expand medical and
      technology teams and clinical infrastructure.
    claimRefs: ["CE003", "CE004", "CE005", "CE006", "CE010"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "differentiation"
    title: "Differentiation is clinically framed personalization, but proof of outcome advantage is still limited"
    body: >-
      SheMed's differentiation case rests on combining GLP-1 prescribing with biomarker-led
      personalization and ongoing support aimed specifically at women. The Tasso release says
      the blood test is central to the model and that results are used to personalize treatment
      and track progress over time; the official journey page lists diabetes-risk, thyroid,
      cardiovascular, and liver markers as inputs. That is a more concrete product story than
      many consumer GLP-1 brands offer. Still, the evidence remains largely company- or partner-issued.
      The assigned pool does not include a public study result, benchmark, API ecosystem, or
      other independent technical proof showing that this extra diagnostic layer improves
      retention, safety, or monetization relative to a simpler telehealth flow.
    claimRefs: ["CE002", "CE004", "CE005", "CE010"]
  - id: "controls-and-risks"
    title: "UK GLP-1 controls raise the operating bar, and SheMed's public trust surface is narrower than its care claims"
    body: >-
      The regulatory context matters because UK weight-management prescribing is increasingly
      explicit about identity verification, independent checking of clinical information,
      legitimate pharmacy supply, and wraparound care. NHS England describes obesity medicines
      as part of a reduced-calorie-diet and behavioral-support pathway, the GPhC says an online
      questionnaire or phone call alone is not enough, and GOV.UK emphasizes that private GLP-1
      supply still requires a consultation and should come only from legitimate pharmacies. Those
      expectations fit SheMed's public emphasis on screening and monitoring, but they also create
      execution risk: the company must keep verification, clinical review, supply integrity, and
      support quality working in tandem at scale. The current public surface does not show status
      metrics, security certifications, escalation SLAs, or published study results that would let
      an investor test whether the workflow is as reliable and defensible as the marketing narrative.
    claimRefs: ["CE007", "CE008", "CE009", "CE011", "CE012"]
