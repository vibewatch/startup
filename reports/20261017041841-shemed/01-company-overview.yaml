    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: Public board composition, committee structure, and any independent-governance disclosures.
      whyItMatters: The retained source set names only the two founders, so investors cannot assess oversight depth, succession resilience, or who constrains management after the reported unicorn valuation step-up.
      diligencePath: Request the current board list, observer rights, and governance pack from the company or lead investor.
      relatedQuestionRefs: [QO009]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: economics
      missingEvidence: Revenue, ARR, gross margin, CAC, payback, and current headcount by function.
      whyItMatters: The company can be identified and its financing can be described, but no retained public evidence supports the operating economics needed to evaluate whether the valuation is justified.
      diligencePath: Request a current board deck or KPI pack with revenue quality, margin bridge, and hiring plan.
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: Investor names, check sizes, liquidation preferences, pro rata rights, and any debt or secondary activity around the Series A.
