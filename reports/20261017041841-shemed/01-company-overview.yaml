company:
  name: SheMed
chapter:
  number: 1
  title: Company Overview
  summary: SheMed presents itself as a UK women-focused metabolic-health platform that combines clinician-led GLP-1 care, at-home blood testing, and subscription support. Publicly retained evidence now supports its 2024 founding, named founders, blood-test-led care path, and a reported $50 million Series A at a $1 billion valuation, but leaves core diligence items such as board composition, investor names, revenue, ARR, headcount, and exact headquarters undisclosed.
sections:
  - id: identity-and-offer
    title: Identity and current offer
    body: >-
      SheMed positions itself as a women-focused UK metabolic-health platform
      centered on clinician-led weight management, GLP-1 treatment, and
      blood-test-informed care. The current homepage markets plans from £59 per
      month, 100k-plus members, and a regulated stack that includes a
      CQC-registered provider, GMC-registered clinicians, and a GPhC
      registered pharmacy. The operating model looks more clinically involved
      than a questionnaire-only telehealth flow because the company says
      members complete an at-home blood test before treatment and repeat
      testing over time. That supports a more defensible care narrative, but
      the retained public sources still do not disclose revenue, ARR,
      headcount, or an exact headquarters city.
    claimRefs: [CO002, CO004, CO005, CO006, CO015]
    tableRefs: [TO001]
  - id: leadership-funding-and-stakeholders
    title: Leadership, funding, and stakeholder visibility
    body: >-
      The named public leadership surface is narrow. Retained sources
      consistently identify sisters Olivia Ferro and Chloe Ferro as founders,
      with Olivia named CEO and Chloe named president, which creates obvious
      key-person concentration around two public operators. Funding visibility
      is stronger than economics visibility: company-controlled and
      independent coverage both say SheMed announced a $50 million Series A at
      a $1 billion valuation, and management described the proceeds as capital
      for UK expansion, team growth, clinical infrastructure, and research.
      Even so, independent coverage also says investor names were not
      disclosed, and the retained chapter evidence does not reveal the board,
      cap-table terms, secondary activity, debt, or ownership concentration.
    claimRefs: [CO001, CO003, CO007, CO008, CO011, CO012]
    tableRefs: [TO002, TO003]
  - id: milestones-and-constraints
    title: Milestones and operating constraints
    body: >-
      The dated evidence is enough to anchor a directional timeline, though
      several milestones remain company-described rather than independently
      detailed. By October 2025, independent coverage said SheMed had been
      founded in April 2024, had cared for more than 60,000 members, had
      partnered with Tasso in August, and had reached unicorn status on the
      back of the reported Series A. Current owned surfaces now market
      100k-plus trusted women, implying continued growth, but without a public
      definition of paid members, active members, or retention. The most
      concrete adverse evidence in the retained pool is regulatory rather than
      company-specific: the GPhC tightened online-pharmacy safeguards for
      weight-management medicines, increasing the compliance burden on models
      like SheMed that depend on remote prescribing and ongoing monitoring.
    claimRefs: [CO004, CO007, CO009, CO010, CO013, CO014, CO016]
    figureRefs: [FO001]
