      - ["Clinicians and pharmacy operations", "Prescribing, monitoring, and safety execution", "High; care quality and regulatory compliance depend on these functions.", "SheMed markets clinician-led care, GMC-registered clinicians, and a GPhC registered pharmacy.", "Request staffing model, prescriber oversight, and incident/escalation metrics."]
