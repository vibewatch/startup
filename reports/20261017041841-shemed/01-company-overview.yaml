figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: The retained evidence shows a fast sequence from 2024 founding to a 2025 unicorn-marked financing, with regulation becoming more demanding at the same time.
    data:
      items:
        - period: "2024"
          label: "SheMed is founded by Chloe and Olivia Ferro"
          detail: "Company and later coverage say the sisters founded SheMed in 2024 to build women-focused metabolic-health care."
          claimRefs: [CO001]
        - period: "2024"
          label: "Initial care model centers on clinician-led GLP-1 and blood-test-led intake"
          detail: "Owned surfaces frame the offer around female metabolic health, clinician-led treatment, and blood-test-informed personalization."
          claimRefs: [CO002, CO006]
        - period: "Sep-Oct 2024"
          label: "GPhC consults on stronger remote-prescribing safeguards"
          detail: "The regulator later said the updated guidance responded to safety concerns around medicines supplied online."
          claimRefs: [CO013, CO014]
        - period: "Dec 2024"
          label: "NICE recommendation expands category legitimacy for obesity medicines"
          detail: "Digital Health linked later GLP-1 demand to NICE's December 2024 tirzepatide recommendation for eligible adults."
          claimRefs: [CO009]
        - period: "Jan 2025"
          label: "NHS-adjacent demand response highlights category acceleration"
          detail: "Digital Health said Inhealthcare launched a self-referral service to help NHS organizations handle anticipated weight-loss-medication demand."
          claimRefs: [CO009]
        - period: "Aug 2025"
          label: "SheMed partners with Tasso on blood testing"
          detail: "Independent coverage said the company partnered with Tasso to integrate a blood test into its offering."
          claimRefs: [CO010]
        - period: "Oct 2025"
          label: "Series A announcement reports $50 million raised at a $1 billion valuation"
          detail: "Company-controlled and independent sources align on the round size, unicorn valuation, and use of proceeds."
          claimRefs: [CO007, CO008]
        - period: "Oct 2025"
          label: "Independent coverage reports 60,000+ members and planned female-focused GLP-1 study results"
          detail: "Digital Health said SheMed had cared for more than 60,000 members and expected study results later that month."
          claimRefs: [CO009, CO016]
        - period: "2026-10-17 access"
          label: "Current site markets 100k-plus women and entry pricing from £59 per month"
          detail: "The current homepage shows higher surface-scale claims than the 2025 article, but does not disclose active-member or revenue definitions."
          claimRefs: [CO004, CO005]
    claimRefs: [CO001, CO002, CO004, CO005, CO006, CO007, CO008, CO009, CO010, CO013, CO014, CO016]
callouts:
  - calloutType: strength
    title: Blood-test-led intake is the clearest product differentiator in retained evidence
    body: The strongest specific operating claim is not generic telehealth convenience but the blood-test-first workflow, which the company says it uses to confirm eligibility, personalize care, and monitor progress over time. That creates a more defensible clinical narrative than questionnaire-only prescribing, even though outcome data is still undisclosed.
    claimRefs: [CO002, CO006, CO015]
  - calloutType: risk
    title: Valuation visibility exceeds governance and economics visibility
    body: Public evidence is enough to support the reported $1 billion valuation and $50 million round, but not enough to underwrite it confidently. Investor names, board composition, cap-table terms, revenue, ARR, and headcount remain outside the retained source set.
    claimRefs: [CO007, CO011]
