  topStrengths:
    - Differentiated women-focused care model with clinician review and blood-test-led onboarding.
    - Strong brand and funding signal, with a reported $50 million Series A and unicorn-marked valuation.
    - Early member-scale proof and repeated public references to a large women-focused community.
  topRisks:
    - Revenue, retention, margin, CAC, and payback remain undisclosed.
    - Reported valuation depends on management-only metrics and undisclosed cap-table terms.
    - UK online-prescribing and weight-management regulation is tightening around high-risk medicines.
  unresolvedGaps:
    - Active paying-member base, continuation by medication, and cohort retention curves.
    - Revenue, contribution margin, gross-margin bridge, CAC, and payback period.
    - Series A cap table, liquidation preferences, and investor rights.
    - Support-quality dashboard including complaint rates, escalation times, and adverse-event governance.
    - >-
      Evidence that blood-test-first personalization improves outcomes, retention, or monetization versus simpler
      telehealth flows.
