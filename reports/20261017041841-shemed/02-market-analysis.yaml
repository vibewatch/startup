artifact: market-analysis
slug: shemed
runDate: 2026-10-17
company:
  name: SheMed
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    SheMed is not just selling a weight-loss injection; it is selling a women-focused,
    clinician-screened metabolic-care workflow that bundles branded GLP-1 access with blood
    testing, monitoring, and support. The assigned evidence supports bounded demand lenses
    around UK obesity-drug access, self-pay pricing, and SheMed's early member scale, but it
    does not support a clean public TAM/SAM/SOM stack.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The relevant market boundary is narrower than "digital health" and wider than "online
      GLP-1 prescriptions." SheMed's own workflow starts with screening, eligibility checks,
      and ongoing follow-up, while NHS and NICE materials show that UK obesity treatment is
      meant to combine medicines with behavioural and clinical support rather than simple drug
      fulfilment. That means the included spend is medication, diagnostics, clinician review,
      monitoring, and support; the excluded spend is unrelated wellness content, bariatric
      surgery, and broad primary-care work that is not part of a weight-management pathway.
      The main substitutes are the public NHS pathway, generic online pharmacies, and other
      self-pay UK GLP-1 providers that do not necessarily lead with SheMed's women-specific
      positioning or blood-test-first workflow.
    claimRefs: [CM001, CM002, CM003, CM008, CM013]
    tableRefs: [TM001]
  - id: sizing-segmentation
    title: Sizing lenses and buyer segmentation
    body: >-
      The assigned pool supports several demand lenses, but not a mathematically additive TAM,
      SAM, and SOM. On the public side, NHS England says the first three years of tirzepatide
      rollout will prioritise 220,000 patients, which is a useful floor for clinically
      prioritised UK demand but not a whole-market ceiling. On the private side, SheMed's own
      homepage says "50,000+" members, while Future FemHealth and Reuters-carrying coverage say
      the company reached more than 60,000 members in under a year; together those disclosures
      show meaningful early demand without proving active paying members or retention. Buyer
      economics are also clearly self-pay today: an affiliate-funded comparison site shows UK monthly
      starting prices for branded GLP-1 products clustering around the mid-hundreds of pounds,
      and Forbes shows SheMed using a £149 at-home hormone and metabolic screening kit as an
      adjacent paid entry point beyond the core medication programme.
    claimRefs: [CM004, CM005, CM007, CM009, CM010, CM011]
    tableRefs: [TM002, TM003]
    figureRefs: [FM001]
  - id: adoption-drivers-and-constraints
    title: Growth drivers and adoption constraints
    body: >-
      Demand-side momentum is real: Reuters notes that women make up a majority of GLP-1 users,
      while NHS and press coverage show strong demand alongside phased public access. SheMed's differentiation
      thesis is that a women-focused, clinically monitored workflow can capture spend from users
      who want more reassurance than a questionnaire-only online pharmacy. But the category is
      also service-heavy and regulated. NHS England's phased rollout implies constrained public
      capacity, not instant universal access, while GPhC guidance now says high-risk
      weight-management prescribing cannot rely on online questionnaires alone and must
      independently verify patient information. Price sensitivity is visible too: Reuters says
      recent sign-ups shifted toward Wegovy after Mounjaro became more expensive in the UK. For
      valuation, that combination means adoption should be modelled as a trust-and-operations
      market, not as frictionless consumer e-commerce.
    claimRefs: [CM009, CM010, CM012, CM013]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Women-focused GLP-1 metabolic-care programme
        - Branded GLP-1 medication, blood-test screening, clinician review, weekly check-ins, side-effect support
        - General wellness subscriptions, bariatric surgery, unrelated primary-care services
        - User is adult woman; payer is typically self-pay household budget
        - SheMed's core served market
      - - NHS obesity-medicine pathway
        - Eligibility assessment, prescribed obesity medicines, clinical review, behavioural wraparound care
        - Private convenience premiums and non-clinically indicated self-pay use
        - User is eligible patient; payer is NHS commissioner
        - Baseline public substitute and category benchmark
      - - Women's hormone / metabolic screening adjacency
        - At-home sampling, hormone and metabolic panel processing, clinician discussion
        - Full specialist endocrine workups and unrelated diagnostics
        - User and payer are self-pay women with symptom or optimisation demand
        - Adjacent entry product that broadens SheMed beyond pure medication supply
      - - Generic online pharmacy GLP-1 supply
        - Online consultation, medicine fulfilment, dispatch, basic follow-up
        - Female-specific research positioning and deeper diagnostic layering
        - User is adult self-pay patient; payer is individual consumer
        - Status-quo substitute that sets comparison pressure on trust and convenience
    notes: >-
      Included and excluded spend are chapter synthesis from the cited sources; they define the
      served workflow boundary rather than a formal industry taxonomy.
    claimRefs: [CM001, CM002, CM003, CM005, CM008, CM012, CM013]
  - id: TM002
    title: TAM/SAM/SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - NHS England
        - Accessed 2026
        - England
        - 220,000 prioritised patients in first 3 years of rollout
        - null
        - Commissioning lens for clinically prioritised tirzepatide access within a 12-year rollout
        - High
        - Public-pathway cohort, not total addressable demand
      - - SheMed homepage
        - "2026"
        - United Kingdom
        - 50,000+ members
        - null
        - Current company-disclosed member floor on the live homepage
        - Medium
        - Lower-bound marketing disclosure; not active paying members
      - - Future FemHealth / Reuters-backed funding coverage
        - "2025"
        - United Kingdom
        - More than 60,000 members in under a year
        - null
        - Specialist-media and Reuters reports of company-reported scale shortly after fundraising
        - Medium
        - Member count is unaudited and may not equal revenue-bearing customers
      - - WhichWeightMeds / Forbes
        - "2026"
        - United Kingdom
        - £145-£240 per month comparator pricing band; £149 PMOS test entry point
        - null
        - Self-pay pricing lens from comparator ranges plus SheMed's adjacent diagnostic offer
        - Medium
        - Pricing bounds monetisation, not market size, and mixes medication with diagnostics
    notes: >-
      These are bounded demand and monetisation lenses, not an additive TAM/SAM/SOM waterfall;
      the assigned evidence does not disclose an auditable eligible-population denominator or
      SheMed conversion funnel.
    claimRefs: [CM004, CM005, CM007, CM010, CM011]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Women seeking private GLP-1 weight management
        - Individual consumer
        - Adult woman using medication and check-ins
        - Self-pay consumer
        - Questionnaire, screening kit, clinician review, medication delivery, weekly follow-up
        - Household discretionary health budget
        - Faster access or more tailored oversight than public pathways
      - - Safety-conscious repeat GLP-1 users
        - Individual consumer
        - Returning patient comparing branded options
        - Self-pay consumer
        - Ongoing monitoring, dose support, side-effect management, periodic blood testing
        - Household recurring subscription budget
        - Desire for monitoring, trust, and medication switching support
      - - Women with hormonal or metabolic symptom questions
        - Individual consumer
        - Woman seeking testing plus clinician interpretation
        - Self-pay consumer
        - One-off home test, lab review, clinician consultation, possible referral or programme upsell
        - Out-of-pocket diagnostics budget
        - Need to investigate symptoms before or alongside medication decisions
      - - NHS-eligible obesity-medicine patients
        - Clinical referrer / commissioning pathway
        - Patient meeting NICE-linked criteria
        - NHS
        - Eligibility review, medicine prescribing, clinical reviews, behavioural wraparound care
        - Public healthcare budget
        - Clinical need with access through prioritised rollout rather than retail self-pay
    notes: >-
      Buyer, payer, and budget-owner fields are inferred from the cited workflow and commissioning
      sources because the assigned evidence does not publish a detailed SheMed channel mix.
    claimRefs: [CM002, CM005, CM007, CM011, CM013]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Mixed public-access, company-scale, and self-pay pricing lenses bound the market without
      pretending to a clean comparable TAM stack.
    data:
      items:
        - label: NHS obesity-drug rollout horizon
          value: "12"
          unit: years
          note: Full commissioning horizon for tirzepatide rollout rather than a population total.
        - label: NHS prioritised cohort
          value: "220,000"
          unit: patients
          note: First 3-year clinically prioritised cohort for tirzepatide access in England.
        - label: SheMed homepage member floor
          value: "50,000+"
          unit: members
          note: Current lower-bound disclosure on the official homepage.
        - label: Press-reported member lens
          value: ">60,000"
          unit: members
          note: Future FemHealth and Reuters report the company-disclosed level in under a year.
        - label: Female GLP-1 user concentration
          value: Majority
          unit: share descriptor
          note: Reuters reports that women make up a majority of patients using GLP-1 drugs.
        - label: Comparator private monthly entry band
          value: "£145-£169"
          unit: per month
          note: Starting-price range for Saxenda, Mounjaro, and Wegovy on WhichWeightMeds.
        - label: SheMed diagnostic entry product
          value: "£149"
          unit: per test
          note: Forbes says the PMOS screening kit tests 19 hormone and metabolic metrics.
    approximationNotes: >-
      This pyramid intentionally mixes population, company-scale, and pricing lenses to show how
      access narrows from public pathway capacity into specific self-pay offers; it is not a
      mathematically comparable funnel or additive market model.
    claimRefs: [CM004, CM005, CM007, CM009, CM011]
