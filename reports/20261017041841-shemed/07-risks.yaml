    title: "The sharpest near-term red flag is compliance, not demand"
    body: "Demand may be strong, but the most immediate thesis-break risk is a mismatch between public GLP-1 marketing language and a UK enforcement regime that is explicitly telling advertisers to avoid that terminology while already taking action against weight-loss promoters."
    claimRefs: ["CR001", "CR006", "CR007", "CR015"]
  - calloutType: "risk"
    title: "Operational intensity is part of the value proposition and the risk"
    body: "SheMed's differentiation rests on blood tests, clinician review, check-ins, and regulated care rather than a thin transaction layer. That can support outcomes, but it also means service quality and cost discipline matter more than top-of-funnel demand alone."
    claimRefs: ["CR002", "CR003", "CR004", "CR012", "CR014", "CR016"]
  - calloutType: "recommendation"
    title: "Kill criteria before underwriting the current narrative"
    body: "Do not treat the current valuation as durable unless management can show a current compliance pack, named regulated counterparties, service-quality dashboards, outcome cohorts, and economics that prove the support-heavy model scales without regulatory or operational slippage."
    claimRefs: ["CR008", "CR010", "CR011", "CR013", "CR016"]
