company:
  name: "SheMed"
chapter:
  number: 7
  title: "Risks"
  summary: "SheMed's sharpest near-term risks come from operating a fast-scaling consumer GLP-1 service inside a UK prescription-medicine regime that is actively tightening and enforcing its rules. The company also promises blood-test-led onboarding, clinician oversight, and ongoing support while scaling infrastructure after a recent funding step-up to a reported $1 billion valuation, leaving compliance execution and service-quality proof as the core diligence bottlenecks."
sections:
  - id: "ranked-risk-profile"
    title: "Ranked risk profile"
    body: "The highest residual risk is regulatory and marketing-compliance exposure, because SheMed's public landing page uses the exact GLP-1 terminology that UK regulators have told advertisers to avoid when promoting prescription-only weight-loss medicines. The second risk is operating execution: the model is more service-heavy than a simple e-pharmacy flow because it combines clinician review, blood testing, check-ins, and ongoing support promises while the company is still scaling clinical infrastructure. Third, the category remains policy-sensitive: NHS rollout is phased, underfunded in several areas, and already prompting rationing discussions, which can keep private demand elevated but also increases scrutiny on how private providers market and deliver care. Fourth, the financing bar is high because a recent reported unicorn valuation leaves limited room for service-quality misses or slower-than-expected unit-economics proof."
    claimRefs: ["CR006", "CR007", "CR009", "CR010", "CR012", "CR013", "CR015", "CR016"]
    figureRefs: ["FR001"]
  - id: "regulatory-and-legal-exposure"
    title: "Regulatory and legal exposure"
    body: "The regulatory burden is not theoretical. The MHRA/ASA/GPhC enforcement notice explicitly says advertisers should avoid prescription-medicine language such as “GLP-1,” and the MHRA says it has already acted against more than 25 businesses this year for public promotion of weight-loss prescription medicines. Osborne Clarke's summary of the UK framework reinforces that prescription-only medicines cannot be advertised to the public and that online providers need more than questionnaire-only gating. SheMed does show some mitigation signals on its own site, including a regulated-service stack, clinician review, and blood-test-led screening, but the public evidence in this pool does not yet establish whether its live marketing and operating materials have been independently audited against the latest rule interpretations."
    claimRefs: ["CR001", "CR002", "CR004", "CR005", "CR006", "CR007", "CR008", "CR015"]
    tableRefs: ["TR001"]
  - id: "operational-and-service-delivery"
    title: "Operational and service-delivery risk"
    body: "SheMed's care proposition is operationally ambitious. The company says users pass through identity verification, biomarker testing, clinician review, weekly check-ins, and ongoing clinical support rather than a lightweight commerce funnel. That service design can be a differentiator, but it also creates more failure points: test-kit turnaround, support responsiveness, clinician capacity, refill accuracy, and adverse-event escalation all matter more when the product promise is personalised and medically supervised. The fresh capital raise is being directed toward medical teams, technology teams, and clinical infrastructure, which implies management also sees execution depth—not just customer acquisition—as the gating problem to solve at the current stage."
    claimRefs: ["CR002", "CR003", "CR004", "CR012", "CR014", "CR016"]
    tableRefs: ["TR002"]
  - id: "policy-dependency-and-financing"
    title: "Policy dependency, partner dependency, and financing pressure"
    body: "SheMed is still tied to external systems it does not control. Its operating model depends on regulated pharmacy and prescriber infrastructure, obesity-medicine policy, and continued category legitimacy in the UK. NHS England says tirzepatide access requires new services and a phased 12-year rollout, while The BMJ reports that less than half of commissioning bodies had started GP prescribing and some were already considering tighter criteria or rationing. That backdrop can keep private demand strong, but it also means category economics and public expectations may move faster than safe delivery capacity. On top of that, the company is now carrying a reported $1 billion valuation and undisclosed investor mix, so the next financing or growth checkpoint will likely require harder evidence on compliance durability, service quality, and commercial efficiency than is visible in the assigned public sources."
    claimRefs: ["CR002", "CR008", "CR009", "CR010", "CR011", "CR013", "CR016"]
    tableRefs: ["TR003"]
