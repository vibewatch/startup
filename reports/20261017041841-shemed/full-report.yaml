              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The October 2025 round gives SheMed meaningful expansion capital, and public reports are directionally
              consistent about where that money is meant to go: UK expansion, larger medical and technology teams,
              stronger clinical infrastructure, research, and patient-experience initiatives. That supports the idea
              that management is funding operating scale and capability, not just customer acquisition. However, the
              same public record remains thin on the variables that actually determine whether the round is enough: cash
              on hand after the raise, monthly burn, drug-level gross margin, marketing efficiency, continuation by
              cohort, and debt or working-capital obligations. The current Companies House extract confirms only
              confirmation- statement timing, not cash or accounts data, while Digital Health says the company is not
              disclosing investor information for the round. Financially, the verdict is therefore mixed: the business
              has credible demand and a differentiated care bundle, but the underwriting case still depends on
              management-only metrics that are absent from public evidence.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI014
              - CI015
              - CI016
