      - number: '5.4'
        title: UK GLP-1 controls raise the operating bar, and SheMed's public trust surface is narrower than its care claims
        blocks:
          - type: paragraph
            body: >-
              The regulatory context matters because UK weight-management prescribing is increasingly explicit about
              identity verification, independent checking of clinical information, legitimate pharmacy supply, and
              wraparound care. NHS England describes obesity medicines as part of a reduced-calorie-diet and
              behavioral-support pathway, the GPhC says an online questionnaire or phone call alone is not enough, and
              GOV.UK emphasizes that private GLP-1 supply still requires a consultation and should come only from
              legitimate pharmacies. Those expectations fit SheMed's public emphasis on screening and monitoring, but
              they also create execution risk: the company must keep verification, clinical review, supply integrity,
              and support quality working in tandem at scale. The current public surface does not show status metrics,
              security certifications, escalation SLAs, or published study results that would let an investor test
              whether the workflow is as reliable and defensible as the marketing narrative.
