              outcome data proving that SheMed's personalization layer improves results or scales cleanly under UK GLP-1
              controls.
            calloutType: risk
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE010
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target segment and buying motion
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to a narrow initial customer definition rather than a broad employer or payer
              motion: SheMed markets a clinician-led UK metabolic-health program for women, centered on GLP-1 treatment,
              PMOS-related screening, and blood-test-led personalization. The public workflow starts with a
              questionnaire, weight and ID verification, an at-home blood test, and clinical review before treatment
              starts, which positions the product for safety-conscious retail buyers who are willing to self-pay for
              more oversight than a simple pharmacy questionnaire. That positioning matters because NHS access remains
              phased and capacity constrained, so private clinics can capture demand from patients who qualify only
              slowly or not at all through the public pathway; but that macro demand should not be mistaken for proof
              that SheMed owns any particular share of it.
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU009
              - CU013
              - CU014
      - number: '6.2'
        title: Adoption signals and customer proof
        blocks:
          - type: paragraph
            body: >-
              SheMed's visible adoption evidence is strongest in consumer-facing signals, but those signals are uneven
              in what they prove. Digital Health News reported in October 2025 that the company had cared for more than
              60,000 members, while a September 2026 CEO-contributed IBTimes essay said over 100,000 women had trusted
              the service in the UK and referenced plans from £59 per month. Trustpilot's displayed review count
              increased from 5,405 in a March 2026 archive to 6,549 in October 2026, while the displayed rating moved
              from 4.3 to 4.1. These measures support widening public engagement, not active-subscriber or retention
              growth. Named proof exists mainly through customer reviews and official testimonials that repeatedly
              mention blood-test entry, weekly monitoring, side-effect support, and clinician contact, which is stronger
              than logo-only proof but still lighter than audited cohort or outcomes data.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU006
              - CU008
      - number: '6.3'
        title: Durability, complaints, and channel risk
        blocks:
          - type: paragraph
            body: >-
              The main weakness in SheMed's customer picture is durability. None of the assigned sources disclose NRR,
              GRR, churn, continuation by medication, average subscription length, or top-customer concentration, so
              ongoing quality has to be inferred from review patterns rather than measured cohorts. Trustpilot's current
              page pairs a high review count and generally positive sentiment with concrete complaints about
              communication, cancellations, dose management, and effectiveness, which means the service has real
              consumer traction but also a visible support burden. Public evidence also keeps the go-to-market squarely
              in UK direct-to-consumer subscriptions, while diagnostic execution partly depends on external
              infrastructure such as the Tasso integration. Sector-wide advertising enforcement adds acquisition risk:
              the ASA found roughly 900 likely non-compliant weight-management ads, though the evidence does not
              identify SheMed among them.
            claimRefs:
              - CU007
              - CU008
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Diligence bottom line
        blocks:
          - type: paragraph
            body: >-
              SheMed appears to have found an attractive early customer wedge: women seeking more clinically managed
              private GLP-1 care than lightweight online prescribing flows provide, especially while NHS access is
              rationed. The public proof is good enough to support real adoption and customer love for the
              screening-and-support model, but not good enough to underwrite retention durability, contribution
              economics, or concentration risk. For investment diligence, the next step is not more testimonials; it is
              a cohort pack showing active members, refill cadence, continuation by drug and dose, cancellation and
              refund rates, complaint volumes, and what portion of acquisition comes from repeat referrals versus paid
              consumer marketing.
            claimRefs:
              - CU005
              - CU006
              - CU010
              - CU013
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strongest proof is service-led consumer validation
            body: >-
              SheMed has better public customer proof than a logo wall because the evidence repeatedly ties adoption to
              blood-test entry, clinician contact, and support behavior.
            calloutType: strength
            claimRefs:
              - CU001
              - CU006
              - CU007
          - type: callout
            title: Durability remains the main blind spot
            body: >-
              Public sources support customer demand and visible usage, but they still do not disclose active paying
              members, medication continuation, renewal rates, or concentration.
            calloutType: risk
            claimRefs:
              - CU005
              - CU013
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk profile
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk is regulatory and marketing-compliance exposure, because SheMed's public landing
              page uses the exact GLP-1 terminology that UK regulators have told advertisers to avoid when promoting
              prescription-only weight-loss medicines. The second risk is operating execution: the model is more
              service-heavy than a simple e-pharmacy flow because it combines clinician review, blood testing,
              check-ins, and ongoing support promises while the company is still scaling clinical infrastructure. Third,
              the category remains policy-sensitive: NHS rollout is phased, underfunded in several areas, and already
              prompting rationing discussions, which can keep private demand elevated but also increases scrutiny on how
              private providers market and deliver care. Fourth, the financing bar is high because a recent reported
              unicorn valuation leaves limited room for service-quality misses or slower-than-expected unit-economics
              proof.
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR010
              - CR012
              - CR013
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR010
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory burden is not theoretical. The MHRA/ASA/GPhC enforcement notice explicitly says advertisers
              should avoid prescription-medicine language such as “GLP-1,” and the MHRA says it has already acted
              against more than 25 businesses this year for public promotion of weight-loss prescription medicines.
              Osborne Clarke's summary of the UK framework reinforces that prescription-only medicines cannot be
              advertised to the public and that online providers need more than questionnaire-only gating. SheMed does
              show some mitigation signals on its own site, including a regulated-service stack, clinician review, and
              blood-test-led screening, but the public evidence in this pool does not yet establish whether its live
              marketing and operating materials have been independently audited against the latest rule interpretations.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR015
      - number: '7.3'
        title: Operational and service-delivery risk
        blocks:
          - type: paragraph
            body: >-
              SheMed's care proposition is operationally ambitious. The company says users pass through identity
              verification, biomarker testing, clinician review, weekly check-ins, and ongoing clinical support rather
              than a lightweight commerce funnel. That service design can be a differentiator, but it also creates more
              failure points: test-kit turnaround, support responsiveness, clinician capacity, refill accuracy, and
              adverse-event escalation all matter more when the product promise is personalised and medically
              supervised. The fresh capital raise is being directed toward medical teams, technology teams, and clinical
              infrastructure, which implies management also sees execution depth—not just customer acquisition—as the
              gating problem to solve at the current stage.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR012
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR012
              - CR014
              - CR016
      - number: '7.4'
        title: Policy dependency, partner dependency, and financing pressure
        blocks:
          - type: paragraph
            body: >-
              SheMed is still tied to external systems it does not control. Its operating model depends on regulated
              pharmacy and prescriber infrastructure, obesity-medicine policy, and continued category legitimacy in the
              UK. NHS England says tirzepatide access requires new services and a phased 12-year rollout, while The BMJ
              reports that less than half of commissioning bodies had started GP prescribing and some were already
              considering tighter criteria or rationing. That backdrop can keep private demand strong, but it also means
              category economics and public expectations may move faster than safe delivery capacity. On top of that,
              the company is now carrying a reported $1 billion valuation and undisclosed investor mix, so the next
              financing or growth checkpoint will likely require harder evidence on compliance durability, service
              quality, and commercial efficiency than is visible in the assigned public sources.
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR012
              - CR013
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The sharpest near-term red flag is compliance, not demand
            body: >-
              Demand may be strong, but the most immediate thesis-break risk is a mismatch between public GLP-1
              marketing language and a UK enforcement regime that is explicitly telling advertisers to avoid that
              terminology while already taking action against weight-loss promoters.
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR015
          - type: callout
            title: Operational intensity is part of the value proposition and the risk
            body: >-
              SheMed's differentiation rests on blood tests, clinician review, check-ins, and regulated care rather than
              a thin transaction layer. That can support outcomes, but it also means service quality and cost discipline
              matter more than top-of-funnel demand alone.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR012
              - CR014
              - CR016
          - type: callout
            title: Kill criteria before underwriting the current narrative
            body: >-
              Do not treat the current valuation as durable unless management can show a current compliance pack, named
              regulated counterparties, service-quality dashboards, outcome cohorts, and economics that prove the
              support-heavy model scales without regulatory or operational slippage.
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR013
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The public evidence is strong enough to say that SheMed has built a differentiated narrative:
              women-specific metabolic care, clinician oversight, at-home blood testing, and a safety-first onboarding
              flow all distinguish it from the most generic online GLP-1 funnels. Public financing coverage also
              matters: both SheMed's own profile and Digital Health describe a $50 million Series A and unicorn status,
              which means the company has already attracted a premium private-market mark. The problem for a new
              investor is that the public record still does not disclose the operating proof needed to underwrite that
              mark confidently. This chapter's source set does not surface revenue, cohort continuation after titration,
              CAC, contribution margin, loss rates, or preference terms. In practice, that means the investment call has
              to be price-sensitive: the differentiated care model may justify premium interest, but not blind
              acceptance of the headline round price. The disciplined call is research-more with a stretched valuation
              stance and a high risk rating until management can show audited or board-grade evidence on economics,
              retention, and terms.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV005
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: What supports the thesis, and what breaks it
        blocks:
          - type: paragraph
            body: >-
              The investable thesis starts with category pull and product design. NHS England is phasing
              obesity-medicine access over years rather than months, and the London Assembly documents a large gap
              between public provision and private demand. That backdrop creates a real demand window for private
              operators that can provide safe, compliant wraparound care. SheMed's model lines up with that direction
              better than pure questionnaire-based sellers because its flow includes weight and identity verification,
              clinician review, and blood testing before treatment. The anti-thesis is equally important. Public
              price-comparison evidence shows UK consumers can already compare multiple GPhC-registered providers at
              visible monthly starting prices, while the GPhC has tightened online-prescribing safeguards for
              weight-management medicines. A business can therefore face simultaneous margin pressure and compliance
              pressure even while category demand rises. The public record also contains traction ambiguity: one SheMed
              page cites over 50,000 UK members, while LinkedIn cites a growing community of over 100,000 women. That
              does not disprove traction, but it does show why a valuation decision should rely on verified
              paying-member, retention, and outcomes data rather than marketing surface numbers alone.
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Scenario frame, valuation posture, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Without public financial disclosures, the cleanest valuation method is not a precise revenue multiple but
              a milestone-based underwriting frame anchored to the last reported mark. In the bull case, SheMed can
              defend or exceed that mark only if diligence proves that its women- specific care model translates into
              superior retention, safer prescribing, and better economics than mainstream online pharmacies. The base
              case is less generous: the company may be strategically attractive, yet still deserve a discount to the
              unicorn headline until investors can verify revenue quality, repeat behavior, and actual take rates after
              clinical costs. The bear case is a combination of private-market price compression, tighter compliance
              burden, and weaker-than-expected cohort quality, which would make a down-round or flat round plausible
              even if category demand stays healthy. That is why the next diligence step is not more storytelling; it is
              a narrow package of hard evidence on revenue, retention, unit economics, prescribing safety, and cap-table
              mechanics. If management cannot supply those items, the current public evidence supports tracking the
              business rather than chasing the last reported valuation.
            claimRefs:
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public-evidence verdict
            body: >-
              The right public-evidence call is research-more, not buy: the model looks differentiated, but the current
              price signal is ahead of the disclosed proof on revenue quality, retention, and cap-table terms.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV013
              - CV015
              - CV016
          - type: callout
            title: Down-round trigger
            body: >-
              A combination of price transparency, tighter prescribing safeguards, and weak cohort economics would turn
              the current unicorn headline from a proof point into a reference for future compression.
            calloutType: risk
            claimRefs:
              - CV012
              - CV014
              - CV015
