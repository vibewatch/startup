          new diligence evidence proves premium unit economics and clean terms.
        - Execution burden rises if clinical infrastructure and support costs scale faster than revenue.
        - Requires new evidence, not current public evidence alone.
      - - Base
        - >-
          Demand remains real, but the company looks more like a strong category operator than a fully de-risked outlier
          because revenue quality and cap-table terms stay undisclosed.
        - >-
          A broad $0.6 billion to $1.0 billion diligence band is more supportable than paying up past the last round
          without sharper proof.
        - Private-market multiple compression or weaker retention could move the fair band lower.
        - Best matched to the evidence currently available.
      - - Bear
        - >-
          Cohort quality, retention, or prescribing economics disappoint while regulation and price transparency make
          customer acquisition and support more expensive.
        - Value could reset below $0.6 billion, implying flat-round or down-round risk versus the reported unicorn mark.
        - Hidden preferences or expensive clinical operations could amplify dilution for later investors.
        - Credible if management cannot close the named public evidence gaps.
    notes: >-
      Scenario bands are underwriting heuristics anchored to the last reported private valuation and the current public
      evidence set; they are intentionally broad because revenue and term disclosures are missing.
    claimRefs:
      - CV005
      - CV006
      - CV012
      - CV013
      - CV014
      - CV015
