  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape spans public care, pharmacy incumbents, and funded adjacencies
        blocks:
          - type: paragraph
            body: >-
              The retained pool shows that buyers can solve the same obesity-care job through at least three channels.
              First, the NHS remains the status-quo incumbent: NHS England says weight-loss medicines are prescribed
              only to patients living with obesity who meet specific criteria, and tirzepatide rollout is being phased
              across a 12-year timetable with only 220,000 patients prioritised in the first three years, so the public
              pathway remains clinically credible but capacity constrained. Second, private pharmacy-led competitors
              already advertise transparent starting prices and broad distribution; WhichWeightMeds lists LloydsPharmacy
              Online Doctor, Superdrug Online Doctor, and Boots Online Doctor with visible Mounjaro entry prices and
              common consultation-plus-delivery workflows. Third, adjacent digital-health platforms are still being
              funded around women's health, with EU-Startups reporting fresh capital for Numan's move into female
              health, which means SheMed is not defending only against current GLP-1 dispensers but also against
              adjacent platforms that can add prescribing over time. The retained evidence does not show a standalone
              "internal build" vendor, but it does show a practical self-assembly substitute: a patient can combine NHS
              guidance, a regulated pharmacy, and generic lifestyle support rather than buy SheMed's all-in-one
              workflow.
            claimRefs:
              - CP011
              - CP012
