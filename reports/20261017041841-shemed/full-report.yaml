      - number: '4.2'
        title: Pricing, demand, and commercial signals
        blocks:
          - type: paragraph
            body: >-
              SheMed’s public revenue proof is strongest on demand and weakest on disclosed monetization. Reuters
              reported that the company had added more than 60,000 members in less than a year and raised $50 million in
              Series A financing, while Startuprise and Digital Health repeat the same growth narrative and
              use-of-proceeds logic. Reuters also reported a commercially meaningful mix signal: most new customers had
              opted for Wegovy over Mounjaro after Lilly raised UK prices for Mounjaro, implying that upstream drug
              pricing can shift SheMed’s product mix and potentially its gross profit per member. Because no assigned
              source discloses SheMed’s own list price or realized ASP, the clearest public price anchor is external:
              WhichWeightMeds shows major UK pharmacies advertising Mounjaro starting prices from £149 to £179 per month
              and a typical range of £149-£210 per month. That benchmark suggests SheMed must earn any premium through
              safety, diagnostics, and support rather than through undisclosed medicine markups alone.
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
              - CI012
