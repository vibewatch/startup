            body: >-
              SheMed’s public evidence supports a more clinician- and diagnostics-heavy proposition than commodity GLP-1
              resellers, but the same safety and support features that differentiate the product also add labour, lab,
              logistics, and compliance cost that cannot yet be netted against revenue because public cash, margin, and
