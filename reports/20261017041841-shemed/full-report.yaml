      - number: '3.2'
        title: SheMed differentiates on verification depth and women-specific positioning
        blocks:
          - type: paragraph
            body: >-
              SheMed's strongest visible differentiation is not lowest-price distribution but a more managed clinical
              workflow. On its official "How it works" page, the company shows a sequence of questionnaire, weight and
              ID verification, at-home blood testing, and then treatment shipment with a side-effect care kit.
              Third-party coverage points in the same direction: Pharmacy UK says SheMed is built around women's
              hormonal and metabolic needs and reports that SheMed uses laboratory-based blood tests rather than
              self-reported BMI alone, while Digital Health reported a Tasso blood test integration. This matters
              because the GPhC now says prescribers of weight-management medicines cannot rely on a questionnaire alone
              and must independently verify weight, height, and-or BMI, so SheMed's higher-touch process is
              directionally aligned with the stricter trust and compliance bar rather than obviously ahead of it by
              default. The trade-off is buyer friction: a workflow with blood tests and verification can justify trust,
              but it can also slow conversion compared with generic pharmacy funnels that already surface clear monthly
              price anchors.
