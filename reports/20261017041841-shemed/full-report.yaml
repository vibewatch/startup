      - number: '3.3'
        title: Incumbents still own price transparency and easy multi-homing
        blocks:
          - type: paragraph
            body: >-
              The private-competitor set in retained evidence competes on visible price anchors and distribution
              convenience. WhichWeightMeds shows Lloyds, Superdrug, and Boots with published starting prices, while the
              same page emphasizes collection-or-delivery convenience, existing retail networks, and ongoing support. By
              contrast, the retained pool for this chapter does not include a current SheMed public pricing page or
              checkout flow, so the company cannot yet be shown beating pharmacy incumbents on cash-pay transparency.
              That asymmetry matters for switching cost. When major alternatives share the same medication class,
              advertise visible entry prices, and route through GPhC-registered pharmacy infrastructure, buyers can
              compare and re-route relatively easily; SheMed's main potential lock in the retained evidence is its
              testing cadence, monitoring workflow, and women-specific support narrative rather than proprietary
              distribution. NHS England's wraparound-care requirement also means the public pathway is more than drug
              access alone, so the status quo alternative is stronger than a simple "slow waiting list" caricature.
