  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk clusters around consumer-facing GLP-1 marketing compliance, support-heavy operating execution, and
      category-level policy sensitivity.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation evidence
      rows:
