  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market boundary is narrower than "digital health" and wider than "online GLP-1
              prescriptions." SheMed's own workflow starts with screening, eligibility checks, and ongoing follow-up,
              while NHS and NICE materials show that UK obesity treatment is meant to combine medicines with behavioural
              and clinical support rather than simple drug fulfilment. That means the included spend is medication,
              diagnostics, clinician review, monitoring, and support; the excluded spend is unrelated wellness content,
              bariatric surgery, and broad primary-care work that is not part of a weight-management pathway. The main
              substitutes are the public NHS pathway, generic online pharmacies, and other self-pay UK GLP-1 providers
              that do not necessarily lead with SheMed's women-specific positioning or blood-test-first workflow.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM013
