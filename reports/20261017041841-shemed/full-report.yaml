      - number: '5.3'
        title: Differentiation is clinically framed personalization, but proof of outcome advantage is still limited
        blocks:
          - type: paragraph
            body: >-
              SheMed's differentiation case rests on combining GLP-1 prescribing with biomarker-led personalization and
              ongoing support aimed specifically at women. The Tasso release says the blood test is central to the model
              and that results are used to personalize treatment and track progress over time; the official journey page
              lists diabetes-risk, thyroid, cardiovascular, and liver markers as inputs. That is a more concrete product
              story than many consumer GLP-1 brands offer. Still, the evidence remains largely company- or
              partner-issued. The assigned pool does not include a public study result, benchmark, API ecosystem, or
              other independent technical proof showing that this extra diagnostic layer improves retention, safety, or
              monetization relative to a simpler telehealth flow.
