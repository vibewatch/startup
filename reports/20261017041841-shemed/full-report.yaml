    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and current offer
        blocks:
          - type: paragraph
            body: >-
              SheMed positions itself as a women-focused UK metabolic-health platform centered on clinician-led weight
              management, GLP-1 treatment, and blood-test-informed care. The current homepage markets plans from £59 per
              month, 100k-plus members, and a regulated stack that includes a CQC-registered provider, GMC-registered
              clinicians, and a GPhC registered pharmacy. The operating model looks more clinically involved than a
              questionnaire-only telehealth flow because the company says members complete an at-home blood test before
              treatment and repeat testing over time. That supports a more defensible care narrative, but the retained
              public sources still do not disclose revenue, ARR, headcount, or an exact headquarters city.
