  - id: FI001
    title: Revenue model bridge from acquisition to ongoing care margin
    type: flow
    summary: >-
      Public evidence shows a care-heavy revenue chain in which diagnostics, clinician review, fulfilment, and support
      all sit between acquisition and any recurring gross profit.
    data:
      nodes:
        - id: lead
          label: Qualified lead
          value: Questionnaire plus weight and ID verification
          detail: Intake starts with a questionnaire and app-based weight and ID checks.
        - id: screening
          label: Clinical screening
          value: At-home blood test
          detail: Eligibility is checked with a home blood test, and ineligible patients receive a refund.
        - id: fulfilment
          label: First fulfilment
          value: Treatment plus starter kit
          detail: The first shipment includes treatment, a side-effect care kit, a disposal bin, and startup materials.
        - id: monitoring
          label: Safety monitoring
          value: Repeat blood tests and clinician review
          detail: Repeat blood testing and clinician oversight add ongoing cost before any steady-state margin is visible.
        - id: retention
          label: Ongoing member care
          value: Check-ins and support
          detail: Ongoing support aims to retain members and sustain recurring revenue.
        - id: gross-profit
          label: Gross profit pool
          value: Residual after medication, labs, clinicians, logistics, and support
          detail: Public sources do not disclose the gross margin left after these inputs.
      edges:
        - from: lead
          to: screening
          label: safety and eligibility
        - from: screening
          to: fulfilment
          label: clinically approved patients
        - from: fulfilment
          to: monitoring
          label: active treatment
        - from: monitoring
          to: retention
          label: safe continuation
        - from: retention
          to: gross-profit
          label: margin after care delivery
    approximationNotes: >-
      Public sources describe the workflow qualitatively; no assigned source discloses numeric conversion or margin
      rates.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI011
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence supports a layered care workflow with diagnostics, clinician review, and monitoring rather than a
      disclosed software stack.
    data:
      layers:
        - label: Intake and eligibility
          detail: Questionnaire plus app-based weight and ID verification before clinician review.
          items:
            - Weight and health questionnaire
            - Weight + ID verification with a SheMed team member
        - label: Diagnostic baseline
          detail: At-home blood collection establishes baseline safety data before prescribing.
          modules:
            - Tasso+ blood collection device
            - 'Biomarkers: HbA1c, TSH, total cholesterol, HDL, LDL, cholesterol ratio, triglycerides, AST, GGT, ALT'
        - label: Clinical decisioning
          detail: Clinician-reviewed plan is built around blood results and eligibility.
          modules:
            - Clinically reviewed plan built around your results
            - Full refund if patient is found ineligible from blood test
        - label: Treatment start
          detail: Home-delivered starter bundle combines medication and safety aids.
          outputs:
            - First treatment, side-effect care kit, disposal bin, and start materials
        - label: Monitoring and support
          detail: Repeat testing and regular contact sustain the longitudinal care model.
          items:
            - Free test kit twice a year
            - Weekly check-ins and weigh-ins
            - Clinician available for queries
        - label: Compliance and pharmacy controls
          detail: Safe supply depends on identity checks, clinical verification, and legitimate pharmacy channels.
          modules:
            - Independent verification of clinical information
            - Prescription supply through a legitimate pharmacy
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE012
