      - number: '4.3'
        title: Cost structure and service-delivery load
        blocks:
          - type: paragraph
            body: >-
              The public cost story is clearer on obligations than on gross margin. SheMed’s own flow requires
              blood-test screening, starter-kit fulfilment, follow-up testing, and ongoing support, each of which adds
              operating cost beyond the medication itself. External regulation reinforces that this is not a lightweight
              workflow: the GPhC now treats weight-management medicines as high-risk online prescribing, requiring
              independent verification and two-way communication, while NHS England says tirzepatide rollout requires
              new services, professional training, and wraparound care. NICE’s 2026 obesity guidance also keeps planning
              and funding services squarely in scope for commissioners and providers. Together, these sources support a
              practical conclusion: SheMed’s care-heavy model may improve trust and differentiation, but it likely
              carries structurally higher clinical, compliance, and service-delivery cost than a pure lead-generation or
              prescription-pass-through model.
            claimRefs:
              - CI002
