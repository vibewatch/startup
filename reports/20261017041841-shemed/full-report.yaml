              starts with a questionnaire, moves into app-based weight and ID verification, then requires an at-home
              blood test before a clinician-reviewed plan and first prescription are issued. The same page says the
              first shipment includes treatment, a side-effect care kit, a disposal bin, and starter materials, which
              means the product is sold as a bundled care journey rather than a single medication transaction. The
              blood-test-first structure is more specific than the typical "consult then ship" telehealth pitch, but the
              public evidence still describes the workflow more clearly than the underlying software or operating
              systems that support it.
