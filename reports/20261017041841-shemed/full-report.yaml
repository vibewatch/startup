      - number: '3.4'
        title: Moat durability depends on outcome proof, not just better onboarding
        blocks:
          - type: paragraph
            body: >-
              The chapter's evidence supports a real but still provisional moat. SheMed has a differentiated operating
              pattern - verification, blood testing, and women-centered positioning - and that should matter more if
              regulation keeps tightening around online prescribing. But the same evidence also highlights how
              commoditization can arrive from two sides. Pharmacy-led incumbents can compress differentiation through
              transparent pricing and convenient fulfillment, while adjacent digital-health platforms with fresh capital
              can add women-focused positioning without starting from zero. SheMed therefore looks more durable on trust
              posture than on distribution power. The unresolved question is whether its added workflow creates superior
              retention, outcomes, or willingness to pay; without public price disclosure and cohort-quality proof, the
              company can be described as clinically better packaged than generic pharmacy options, but not yet as
              competitively unassailable.
