      - number: '2.2'
        title: Sizing lenses and buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports several demand lenses, but not a mathematically additive TAM, SAM, and SOM. On
              the public side, NHS England says the first three years of tirzepatide rollout will prioritise 220,000
              patients, which is a useful floor for clinically prioritised UK demand but not a whole-market ceiling. On
              the private side, SheMed's own homepage says "50,000+" members, while Future FemHealth and
              Reuters-carrying coverage say the company reached more than 60,000 members in under a year; together those
              disclosures show meaningful early demand without proving active paying members or retention. Buyer
              economics are also clearly self-pay today: an affiliate-funded comparison site shows UK monthly starting
              prices for branded GLP-1 products clustering around the mid-hundreds of pounds, and Forbes shows SheMed
              using a £149 at-home hormone and metabolic screening kit as an adjacent paid entry point beyond the core
              medication programme.
