      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Demand-side momentum is real: Reuters notes that women make up a majority of GLP-1 users, while NHS and
              press coverage show strong demand alongside phased public access. SheMed's differentiation thesis is that
              a women-focused, clinically monitored workflow can capture spend from users who want more reassurance than
              a questionnaire-only online pharmacy. But the category is also service-heavy and regulated. NHS England's
              phased rollout implies constrained public capacity, not instant universal access, while GPhC guidance now
              says high-risk weight-management prescribing cannot rely on online questionnaires alone and must
              independently verify patient information. Price sensitivity is visible too: Reuters says recent sign-ups
              shifted toward Wegovy after Mounjaro became more expensive in the UK. For valuation, that combination
              means adoption should be modelled as a trust-and-operations market, not as frictionless consumer
              e-commerce.
