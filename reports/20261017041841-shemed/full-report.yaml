          note: >-
            Public GLP-1 terminology is visible today; no SheMed-specific enforcement outcome is shown in the assigned
            evidence.
          values:
            - label: High
              tone: high
            - label: High
              tone: critical
            - label: Limited public proof
              tone: adverse
        - label: Clinical-ops scaling and support load
          note: The proposition is differentiated, but service promises add multiple execution dependencies.
          values:
            - label: High
              tone: high
            - label: High
              tone: critical
            - label: Building
              tone: warning
        - label: UK access / policy sensitivity
          note: Phased NHS rollout and local funding gaps can preserve demand while increasing scrutiny.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Partial
              tone: warning
        - label: Outcome-proof and retention opacity
          note: Public evidence still lacks the cohort and study outputs needed to prove durable differentiation.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Limited public proof
              tone: adverse
        - label: Valuation / financing execution pressure
