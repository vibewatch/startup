company:
  name: SheMed
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports SheMed as a women-focused UK direct-to-consumer GLP-1 care program whose strongest customer proof is high-volume review activity and repeated blood-test-and-support narratives, not disclosed retention economics. Company-reported scale moved from "more than 60,000 members" in October 2025 to "over 100,000 women" by September 2026, while Trustpilot snapshots show a growing review footprint but a softer score; none of those measures separates active paying subscribers, renewals, or concentration.
sections:
  - id: target-segment-and-buying-motion
    title: Target segment and buying motion
    body: >-
      The assigned evidence points to a narrow initial customer definition rather than a broad employer or payer motion: SheMed markets a clinician-led UK metabolic-health program for women, centered on GLP-1 treatment, PMOS-related screening, and blood-test-led personalization. The public workflow starts with a questionnaire, weight and ID verification, an at-home blood test, and clinical review before treatment starts, which positions the product for safety-conscious retail buyers who are willing to self-pay for more oversight than a simple pharmacy questionnaire. That positioning matters because NHS access remains phased and capacity constrained, so private clinics can capture demand from patients who qualify only slowly or not at all through the public pathway; but that macro demand should not be mistaken for proof that SheMed owns any particular share of it.
    claimRefs: [CU001, CU002, CU009, CU010, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-signals-and-customer-proof
    title: Adoption signals and customer proof
    body: >-
      SheMed's visible adoption evidence is strongest in consumer-facing signals, but those signals are uneven in what they prove. Digital Health News reported in October 2025 that the company had cared for more than 60,000 members, while a September 2026 CEO-contributed IBTimes essay said over 100,000 women had trusted the service in the UK and referenced plans from £59 per month. Trustpilot's displayed review count increased from 5,405 in a March 2026 archive to 6,549 in October 2026, while the displayed rating moved from 4.3 to 4.1. These measures support widening public engagement, not active-subscriber or retention growth. Named proof exists mainly through customer reviews and official testimonials that repeatedly mention blood-test entry, weekly monitoring, side-effect support, and clinician contact, which is stronger than logo-only proof but still lighter than audited cohort or outcomes data.
    claimRefs: [CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU002, TU003]
  - id: durability-complaints-and-channel-risk
    title: Durability, complaints, and channel risk
    body: >-
      The main weakness in SheMed's customer picture is durability. None of the assigned sources disclose NRR, GRR, churn, continuation by medication, average subscription length, or top-customer concentration, so ongoing quality has to be inferred from review patterns rather than measured cohorts. Trustpilot's current page pairs a high review count and generally positive sentiment with concrete complaints about communication, cancellations, dose management, and effectiveness, which means the service has real consumer traction but also a visible support burden. Public evidence also keeps the go-to-market squarely in UK direct-to-consumer subscriptions, while diagnostic execution partly depends on external infrastructure such as the Tasso integration. Sector-wide advertising enforcement adds acquisition risk: the ASA found roughly 900 likely non-compliant weight-management ads, though the evidence does not identify SheMed among them.
    claimRefs: [CU007, CU008, CU013, CU014, CU015, CU016]
  - id: diligence-bottom-line
    title: Diligence bottom line
    body: >-
      SheMed appears to have found an attractive early customer wedge: women seeking more clinically managed private GLP-1 care than lightweight online prescribing flows provide, especially while NHS access is rationed. The public proof is good enough to support real adoption and customer love for the screening-and-support model, but not good enough to underwrite retention durability, contribution economics, or concentration risk. For investment diligence, the next step is not more testimonials; it is a cohort pack showing active members, refill cadence, continuation by drug and dose, cancellation and refund rates, complaint volumes, and what portion of acquisition comes from repeat referrals versus paid consumer marketing.
    claimRefs: [CU005, CU006, CU010, CU013, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Evidence of scale
      - Strategic value / gap
    rows:
      - - Women seeking clinician-led private GLP-1 care
        - User = buyer = payer in the visible public workflow
        - Weight-loss and metabolic-health treatment with blood-test-led screening
        - ">60,000 members (Oct 2025) and >100,000 women trusted us (Sep 2026), both company-reported"
        - Strong category fit; active paying base and renewal mix are undisclosed
      - - Safety-first first-time or cautious GLP-1 users
        - Self-paying retail member
        - Wants identity checks, blood testing, clinician review, and side-effect support
        - Official workflow plus repeated review mentions of blood tests and check-ins
        - Differentiated onboarding signal; no published conversion or CAC data
      - - Patients pushed toward private access by constrained NHS rollout
        - Self-paying user while public access is phased
        - Faster private access to obesity medicines with wraparound support
        - Health Foundation says private sector is currently the main access route; NHS rollout prioritizes 220,000 patients over three years
        - Category tailwind is clear; SheMed-specific share is not
    notes: Mixed company-reported counts and category context; no row proves active paying retention or segment profitability.
    claimRefs: [CU002, CU003, CU004, CU010, CU011]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Members cared for
        - ">60,000"
        - "2025-10"
        - Digital Health News
        - Medium
        - Shows meaningful early consumer scale
        - No active-paying, churn, or refill split
      - - Women trusted in the UK
        - ">100,000"
        - "2026-09-11"
        - IBTimes contributor essay by CEO
        - Medium
        - Indicates 2026 growth narrative continued
        - '"Trusted us" is not defined as active subscribers'
      - - Trustpilot review footprint
        - 5,405 reviews at 4.3/5, rising to 6,549 reviews at 4.1/5
        - 2026-03 to 2026-10
        - Archived and current Trustpilot snapshots
        - Medium
        - Public engagement widened while the displayed score softened
        - Review activity is not equivalent to paying members or retained cohorts
      - - UK GLP-1 category access
        - 2.4 million people estimated to be accessing GLP-1 medications
        - 2025
        - Health Foundation
        - High
        - Category demand for private access is substantial
        - Not SheMed-specific customer volume
    notes: Values mix company-reported customer counts, third-party review activity, and category demand; they are not directly comparable cohort measures.
    claimRefs: [CU003, CU004, CU005, CU007, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof
      - Limitation
    rows:
      - - 'Trustpilot reviewer: "SheMed is amazing"'
        - Self-paying retail member
        - Pre-treatment screening and ongoing monitored program
        - Production / active treatment
        - Reported constant checkups, one-to-one phone calls, and a safer monitored journey than questionnaire-only rivals
        - Anonymous public review; no objective clinical outcome disclosed
      - - 'Trustpilot reviewer: "The SheMed blood test kit was so easy…"'
        - New retail user entering the program
        - Blood-test-led onboarding
        - Onboarding / pre-prescription approval
        - Reported clear instructions and easy home sampling while awaiting assessment
        - Shows acquisition and screening proof, not retention or refill behavior
      - - 'Trustpilot reviewer: "Avoid avoid avoid"'
        - Existing or attempted member
        - Support escalation and account handling
        - Production / service-friction evidence
        - Reported unresolved support issues and unexplained account cancellation
        - Single complaint does not quantify prevalence, but it proves downside variance
    notes: Sample only; rows are representative public proof points from a review platform plus the official onboarding flow, not an exhaustive customer list.
    enumerationScope:
      coverage: sample
      basis: Publicly visible Trustpilot review excerpts and official workflow evidence from 2025-2026 UK consumer onboarding.
    claimRefs: [CU001, CU006, CU008]
