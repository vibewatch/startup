        - label: First prescription and support
          touchpoints:
            - First treatment box
            - Side-effect care kit and clinician support
        - label: Monitoring and renewal loop
          touchpoints:
            - Weekly progress monitoring
            - Repeat blood testing and ongoing dose review
    approximationNotes: This is a structured representation of the published workflow rather than a quantitative funnel.
    claimRefs: [CU001, CU009, CU013, CU014]
callouts:
  - calloutType: strength
    title: Strongest proof is service-led consumer validation
    body: SheMed has better public customer proof than a logo wall because the evidence repeatedly ties adoption to blood-test entry, clinician contact, and support behavior.
    claimRefs: [CU001, CU006, CU007]
  - calloutType: risk
    title: Durability remains the main blind spot
    body: Public sources support customer demand and visible usage, but they still do not disclose active paying members, medication continuation, renewal rates, or concentration.
    claimRefs: [CU005, CU013, CU015]
