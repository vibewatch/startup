company:
  name: SheMed
chapter:
  number: 4
  title: Financials
  summary: >-
    SheMed appears to monetize a higher-touch GLP-1 programme rather than a bare prescription script: public
    sources show blood-test onboarding, clinician review, starter-kit fulfilment, and ongoing support layered
    around Wegovy and Mounjaro demand. The October 2025 $50 million Series A gives the company growth capital,
    but public underwriting still lacks revenue, cash, burn, margin, CAC, and retention disclosure, so the
    financial case is directionally promising but not yet model-ready.
sections:
  - id: revenue-model-and-monetization
    title: Revenue model and monetization
    body: >-
      Public evidence points to a bundled metabolic-care model rather than a commodity online prescription flow.
      Reuters and Digital Health describe SheMed as a women-focused weight-management service built around GLP-1
      medicines, while the company’s own onboarding page adds the operational detail: patients begin with a
      questionnaire, app-based weight and ID verification, and an at-home blood test before starting treatment.
      That structure matters financially because SheMed is not just reselling medication; it is packaging
      diagnostics, clinician review, fulfilment, and ongoing support into the member journey. The same official
      page says the first box includes treatment, a side-effect care kit, a disposal bin, and onboarding
      materials, while repeat blood testing is included twice a year. That creates a more defensible service
      bundle, but it also means the company needs enough realized pricing and retention to cover labs, clinician
      time, logistics, and support content that simpler telehealth resellers may avoid.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-demand-and-commercial-signals
    title: Pricing, demand, and commercial signals
    body: >-
      SheMed’s public revenue proof is strongest on demand and weakest on disclosed monetization. Reuters reported
      that the company had added more than 60,000 members in less than a year and raised $50 million in Series A
      financing, while Startuprise and Digital Health repeat the same growth narrative and use-of-proceeds logic.
      Reuters also reported a commercially meaningful mix signal: most new customers had opted for Wegovy over
      Mounjaro after Lilly raised UK prices for Mounjaro, implying that upstream drug pricing can shift SheMed’s
      product mix and potentially its gross profit per member. Because no assigned source discloses SheMed’s own
      list price or realized ASP, the clearest public price anchor is external: WhichWeightMeds shows major UK
      pharmacies advertising Mounjaro starting prices from £149 to £179 per month and a typical range of
      £149-£210 per month. That benchmark suggests SheMed must earn any premium through safety, diagnostics, and
      support rather than through undisclosed medicine markups alone.
    claimRefs: [CI005, CI007, CI008, CI009, CI012]
    tableRefs: [TI002]
  - id: cost-structure-and-service-delivery
    title: Cost structure and service-delivery load
    body: >-
      The public cost story is clearer on obligations than on gross margin. SheMed’s own flow requires blood-test
      screening, starter-kit fulfilment, follow-up testing, and ongoing support, each of which adds operating cost
      beyond the medication itself. External regulation reinforces that this is not a lightweight workflow: the
      GPhC now treats weight-management medicines as high-risk online prescribing, requiring independent
      verification and two-way communication, while NHS England says tirzepatide rollout requires new services,
      professional training, and wraparound care. NICE’s 2026 obesity guidance also keeps planning and funding
      services squarely in scope for commissioners and providers. Together, these sources support a practical
      conclusion: SheMed’s care-heavy model may improve trust and differentiation, but it likely carries
      structurally higher clinical, compliance, and service-delivery cost than a pure lead-generation or
      prescription-pass-through model.
    claimRefs: [CI002, CI003, CI004, CI010, CI011, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy-and-financial-verdict
    title: Capital adequacy and financial verdict
    body: >-
      The October 2025 round gives SheMed meaningful expansion capital, and public reports are directionally
      consistent about where that money is meant to go: UK expansion, larger medical and technology teams,
      stronger clinical infrastructure, research, and patient-experience initiatives. That supports the idea that
      management is funding operating scale and capability, not just customer acquisition. However, the same
      public record remains thin on the variables that actually determine whether the round is enough: cash on
      hand after the raise, monthly burn, drug-level gross margin, marketing efficiency, continuation by cohort,
      and debt or working-capital obligations. The current Companies House extract confirms only confirmation-
      statement timing, not cash or accounts data, while Digital Health says the company is not disclosing
      investor information for the round. Financially, the verdict is therefore mixed: the business has credible
      demand and a differentiated care bundle, but the underwriting case still depends on management-only
      metrics that are absent from public evidence.
    claimRefs: [CI005, CI006, CI007, CI008, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
