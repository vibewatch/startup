        - Full refund if blood testing finds the patient ineligible
        - Onboarding conversion carries refund and lab-cost risk
        - Medium
        - SheMed how-it-works page
      - - UK self-pay GLP-1 benchmark
        - Mounjaro typical range £149-£210/mo; major providers start at £149-£179/mo
        - SheMed must justify any premium through safety, diagnostics, and support
        - Medium
        - WhichWeightMeds comparison page
    notes: SheMed-specific price realization is undisclosed; market benchmark rows are external comparables, not SheMed pricing.
    claimRefs: [CI004, CI009, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Customer scale proxy
        - 60,000+ members within roughly the first year
        - Medium
        - Shows throughput and demand, but not active paying retention or revenue per member
        - Split active paying members, cumulative signups, and medication mix
      - - Revenue-mix pressure proxy
        - Reuters says most new customers shifted to Wegovy after Lilly raised UK Mounjaro prices
        - Medium
        - Upstream drug pricing can change mix and gross profit by cohort
        - Gross margin by drug, switching rate, and supplier terms
      - - Clinical and compliance workload
        - Weight-management prescribing requires independent verification and two-way communication
        - High
        - Licensed clinical and QA effort are structural opex / COGS drivers
        - Prescriber minutes, support staffing, and quality-assurance cost per member
      - - Policy pathway constraint
        - NHS England will prioritise 220,000 tirzepatide patients over the first 3 years of a 12-year rollout
        - Medium
        - Public-private demand balance can affect future conversion and price elasticity
        - Member mix by NHS-eligible, NHS-ineligible, and self-pay demand segments
      - - Runway visibility
        - null
        - Low
        - Round size alone does not show cash runway, burn, debt, or working-capital needs
        - Cash on hand, monthly burn, debt facilities, and next-round trigger
    notes: Null rows mean the metric is not publicly disclosed in the assigned source pool and requires management diligence.
    claimRefs: [CI008, CI009, CI010, CI011, CI014, CI016]
figures:
  - id: FI001
    title: Revenue model bridge from acquisition to ongoing care margin
    type: flow
    summary: >-
      Public evidence shows a care-heavy revenue chain in which diagnostics, clinician review, fulfilment, and
      support all sit between acquisition and any recurring gross profit.
    data:
      nodes:
        - id: lead
          label: Qualified lead
          value: Questionnaire plus weight and ID verification
          detail: Intake starts with a questionnaire and app-based weight and ID checks.
        - id: screening
          label: Clinical screening
          value: At-home blood test
          detail: Eligibility is checked with a home blood test, and ineligible patients receive a refund.
        - id: fulfilment
          label: First fulfilment
          value: Treatment plus starter kit
          detail: The first shipment includes treatment, a side-effect care kit, a disposal bin, and startup materials.
        - id: monitoring
          label: Safety monitoring
          value: Repeat blood tests and clinician review
          detail: Repeat blood testing and clinician oversight add ongoing cost before any steady-state margin is visible.
        - id: retention
          label: Ongoing member care
          value: Check-ins and support
          detail: Ongoing support aims to retain members and sustain recurring revenue.
        - id: gross-profit
          label: Gross profit pool
          value: Residual after medication, labs, clinicians, logistics, and support
          detail: Public sources do not disclose the gross margin left after these inputs.
      edges:
        - from: lead
          to: screening
          label: safety and eligibility
        - from: screening
          to: fulfilment
          label: clinically approved patients
        - from: fulfilment
          to: monitoring
          label: active treatment
        - from: monitoring
          to: retention
          label: safe continuation
        - from: retention
          to: gross-profit
          label: margin after care delivery
    approximationNotes: Public sources describe the workflow qualitatively; no assigned source discloses numeric conversion or margin rates.
    claimRefs: [CI001, CI002, CI003, CI004, CI011]
callouts:
  - calloutType: risk
    title: Differentiated care bundle, opaque economics
    body: >-
      SheMed’s public evidence supports a more clinician- and diagnostics-heavy proposition than commodity GLP-1
      resellers, but the same safety and support features that differentiate the product also add labour, lab,
      logistics, and compliance cost that cannot yet be netted against revenue because public cash, margin, and
      retention data remain undisclosed.
    claimRefs: [CI001, CI004, CI010, CI011, CI014]
