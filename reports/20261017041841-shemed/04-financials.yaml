      - Diligence ask
    rows:
      - - GLP-1 treatment programme
        - Prescription medication paired with clinician-led weight-management support
        - member / month
        - Public sources confirm Wegovy and Mounjaro demand, but no revenue disclosure
        - Core revenue stream is visible; ASP and mix are not
        - Monthly paying members by drug, dose, and acquisition channel
      - - Diagnostics and eligibility screening
        - At-home blood test before prescribing, plus repeat monitoring
        - screening episode / member
        - Free test kit included twice a year; patients ineligible after blood testing receive a refund
        - Bundled into care flow rather than disclosed as standalone revenue
        - Lab cost per kit, repeat-test uptake, and refund incidence
      - - Ongoing support and monitoring
        - Weekly check-ins, clinician access, and digital support throughout treatment
        - active member / month
        - Included within the programme; public sources do not separate service fees
        - Likely retention lever, but contribution margin is undisclosed
        - Support staffing model, clinician minutes, and retention by cohort
    notes: Public sources show bundle components, not a disclosed revenue split; null economics remain management-only.
    claimRefs: [CI001, CI002, CI003, CI004]
