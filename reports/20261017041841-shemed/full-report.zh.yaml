      - number: '3.4'
        title: 护城河能否持久取决于结果证明，而不只是更好的接入流程
        blocks:
          - type: paragraph
            body: >-
              本章证据支持一条真实但仍属阶段性的护城河。SheMed 具备差异化运营模式——核验、血检和面向女性的定位——如果线上开方监管继续收紧， 这些能力会更重要。但同一批证据也显示商品化可能从两侧到来。药房
              incumbent 可以靠透明定价和便利履约压缩差异化，拥有新资金的邻近 数字健康平台也可以增加女性定位，不必从零开始。因此，SheMed 在信任姿态上看起来比在配送能力上更持久。未解决的问题是，新增流程能否带来
              更高留存、更好结果或更强付费意愿；在公开价格和队列质量证据缺失的情况下，可以说其临床包装优于普通药房选项，但还不能说竞争上不可撼动。
            claimRefs:
              - CP005
              - CP007
              - CP014
              - CP015
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              公开证据指向组合式代谢护理模式，而非商品化的线上处方流程。Reuters 和 Digital Health 将 SheMed 描述为围绕 GLP-1 药物打造的
              面向女性的体重管理服务；公司自己的接入页面则补充了运营细节：患者先完成问卷、在应用内核验体重和身份，再做居家血检，之后才开始治疗。 这在财务上很关键，因为 SheMed
              不只是转售药物，而是把诊断、临床复核、履约和持续支持打包进会员旅程。同一官方页面称首个包裹包括治疗药物、
              副作用护理包、弃置箱和接入材料，复查血检每年包含两次。这让服务组合更有说服力，但也意味着公司需要足够的实际定价和留存，才能覆盖
              实验室、临床医生时间、物流和支持内容等成本，这些成本可能是更简单的远程医疗转售商所避开的。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
