          x: 3
          'y': 1
          detail: 零售分销和可见起步价；定位通用。
        - label: Boots Online Doctor
          x: 3
          'y': 1
          detail: 全国零售信任和持续支持；定位通用。
        - label: Numan
          x: 2
          'y': 3
          detail: 正从相邻数字健康平台拓展至女性健康。
    approximationNotes: 1–5 的序数位置综合了留存证据中的验证深度和女性专属重点；它们不是实测市场份额或结果评分。
    claimRefs:
      - CP001
      - CP005
      - CP007
      - CP008
      - CP009
      - CP010
      - CP011
      - CP013
      - CP015
  - id: FI001
    title: 从获客到持续护理利润的收入模型桥
    type: flow
    summary: 公开证据显示，这条收入链条护理环节很重：诊断、临床审核、履约和支持，都位于获客与任何经常性毛利之间。
    data:
      nodes:
        - id: lead
          label: 合格线索
          value: Questionnaire plus weight and ID verification
          detail: 入口从问卷以及通过应用完成的体重和身份核验开始。
        - id: screening
          label: 临床筛查
          value: At-home blood test
          detail: 通过居家血检确认资格，不符合条件的患者可获退款。
        - id: fulfilment
          label: 首次履约
          value: Treatment plus starter kit
          detail: 首次发货包含治疗方案、副作用护理包、废弃物收集桶和启动材料。
        - id: monitoring
          label: 安全监测
          value: Repeat blood tests and clinician review
          detail: 重复血检和临床医生监督会持续增加成本，直到稳定状态利润显现之前都无法忽略。
        - id: retention
          label: 持续会员护理
          value: Check-ins and support
          detail: 持续支持旨在留住会员并维持经常性收入。
        - id: gross-profit
          label: 毛利池
          value: Residual after medication, labs, clinicians, logistics, and support
          detail: 公开来源未披露扣除这些投入后剩余的毛利率。
      edges:
        - from: lead
          to: screening
          label: 安全与资格
        - from: screening
          to: fulfilment
          label: 临床批准的患者
        - from: fulfilment
          to: monitoring
          label: 正在接受治疗
        - from: monitoring
          to: retention
          label: 安全持续治疗
        - from: retention
          to: gross-profit
          label: 交付护理后的利润
    approximationNotes: 公开来源以定性方式描述这一流程；指定来源均未披露转化率或利润率数字。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI011
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据支持一套分层护理流程，包含诊断、临床审核和监测，而不是一套已披露的软件栈。
    data:
      layers:
        - label: 入口与资格
          detail: 临床审核前先完成问卷，以及通过应用进行的体重和身份核验。
          items:
            - 体重和健康问卷
            - 与 SheMed 团队成员完成体重 + 身份核验
        - label: 诊断基线
          detail: 开具处方前，在家采血建立安全性基线数据。
          modules:
            - Tasso+ 采血设备
            - 生物标志物：HbA1c、TSH、总胆固醇、HDL、LDL、胆固醇比值、甘油三酯、AST、GGT、ALT
        - label: 临床决策
          detail: 临床医生根据血检结果和资格审核方案。
          modules:
            - 根据你的结果制定经临床审核的方案
            - 若血检发现患者不符合条件，可获全额退款
        - label: 开始治疗
          detail: 居家配送的启动套装将药物与安全辅助用品组合在一起。
          outputs:
            - 首次治疗药物、副作用护理包、废弃物收集桶和启动材料
        - label: 监测与支持
          detail: 重复检测和定期联系支撑纵向护理模式。
          items:
            - 每年两次免费检测套件
            - 每周检查进度和称重
            - 临床医生随时回应问题
        - label: 合规与药房控制
          detail: 安全供药依赖身份核验、临床验证和正规药房渠道。
          modules:
            - 独立核验临床信息
            - 通过正规药房供应处方药
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: SheMed 的公开客户旅程强调筛查、临床审核和重复监测，而不是一键配药。
    data:
      items:
        - label: 认知
          touchpoints:
            - 女性代谢健康定位
            - NHS 分阶段推广期间的私人渠道替代方案
        - label: 资格问卷
          touchpoints:
            - 关于体重、健康状况和当前用药的问卷
            - 初步适合性筛查
        - label: 体重和身份核验
          touchpoints:
            - 通过应用与团队成员完成核验
            - 以合规为导向的身份和体重检查
        - label: 居家血检和临床审核
          touchpoints:
            - 包含免费检测套件
            - 生物标志物基线为个性化方案提供依据
        - label: 首次处方和支持
          touchpoints:
            - 首次治疗盒
            - 副作用护理包和临床医生支持
        - label: 监测与续订循环
          touchpoints:
            - 每周进度监测
            - 重复血检和持续剂量审核
    approximationNotes: 这是对已发布流程的结构化呈现，而不是定量漏斗。
    claimRefs:
      - CU001
      - CU009
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险集中在面向消费者的 GLP-1 营销合规、支持密集型运营执行和品类层面的政策敏感度。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释证据
      rows:
        - label: 营销 / POM 广告暴露
          note: 当前已能看到公开 GLP-1 术语；指定证据中没有 SheMed 特定执法结果。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: critical
            - label: 公开证明有限
              tone: adverse
        - label: 临床运营扩张与支持负荷
          note: 方案具有差异化，但服务承诺增加了多项执行依赖。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: critical
            - label: 建设中
              tone: warning
        - label: 英国可及性 / 政策敏感度
          note: NHS 分阶段推广和地方资金缺口可能维持需求，同时加大审查力度。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 部分
              tone: warning
        - label: 结果证明与留存透明度
          note: 公开证据仍缺少证明持久差异化所需的队列和研究结果。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 公开证明有限
              tone: adverse
        - label: 估值 / 融资执行压力
          note: 报道中的 $1 billion 估值提高了对合规增长和运营质量的举证要求。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 公开证明有限
              tone: adverse
        - label: 交易对手与治理依赖
          note: 该模式依赖受监管的外部基础设施；本证据池对其功能有所描述，但未公开拆解。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 部分
              tone: warning
    approximationNotes: 矩阵评级综合了留存的公开证据；它们是风险判断，而非有来源支撑的数值概率。
    claimRefs:
      - CR006
      - CR007
      - CR009
      - CR010
      - CR012
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐取决于差异化护理和需求顺风，但经济性缺失及估值纪律不足会抵消这些优势。
    data:
      nodes:
        - id: demand-gap
          label: 需求顺风
          detail: NHS 的减重药物推广分阶段进行，而私人需求已清晰可见。
          claimRefs:
            - CV009
            - CV010
        - id: differentiated-model
          label: 差异化护理模式
          detail: SheMed 将 GLP-1 治疗与核验、血检和临床医生监督结合起来。
          claimRefs:
            - CV001
            - CV002
            - CV011
        - id: financing-signal
          label: 融资信号
          detail: 公开报道和公司材料指向一笔 $50 million A 轮融资及独角兽估值。
          claimRefs:
            - CV005
        - id: missing-economics
          label: 经济性缺失
          detail: 收入、留存、单位经济性和优先权条款均未公开披露。
          claimRefs:
            - CV006
            - CV013
            - CV015
        - id: market-pressure
          label: 市场与监管压力
          detail: 消费者可以比较公开价格，而监管机构正在收紧线上保障措施。
          claimRefs:
            - CV012
            - CV014
        - id: recommendation
          label: 继续研究 / 估值偏高
          detail: 只有在尽调证明单位经济性更优、条款干净，且入场价格不高于纪律性上限时，才应推进。
          claimRefs:
            - CV013
            - CV015
            - CV016
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
