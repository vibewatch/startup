      - CV015
      - CV016
  - id: TV003
    title: 看涨 / 基准 / 看跌情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 看涨
        - SheMed 将女性专属护理、检测和临床支持转化为相较主流远程医疗可比公司的明显更高留存率、更好结果和合规增长。
        - 有公开证据支撑的估值需要站稳在最近披露的 $1.0 billion 以上；只有新的尽调证据证明单位经济性更优、条款干净，才有上行空间。
        - 如果临床基础设施和支持成本增速超过收入，执行负担会加重。
        - 需要新的证据，不能只依赖当前公开证据。
      - - 基准
        - 需求确实存在，但由于收入质量和股权结构条款仍未披露，公司更像品类中的强运营者，而不是风险已充分出清的异类。
        - 在缺乏更有力证据的情况下，$0.6 billion 至 $1.0 billion 的宽幅尽调区间，比在上一轮估值之上溢价买入更有支撑。
        - 私募市场倍数收缩或留存走弱，都可能压低合理区间。
        - 与当前可获得的证据最匹配。
      - - 看跌
        - 在监管和价格透明度推高获客及支持成本的同时，队列质量、留存或处方经济性令人失望。
        - 估值可能重置到 $0.6 billion 以下，相对于已披露的独角兽估值，意味着平价轮或下轮融资风险。
        - 隐性优先权或高昂的临床运营成本，可能放大后续投资人的稀释。
        - 如果管理层无法补上已指出的公开证据缺口，这一情景就有可信度。
    notes: 情景区间是锚定最近披露的私募估值和当前公开证据集的投资判断启发式；由于收入和条款披露缺失，区间有意设得较宽。
    claimRefs:
      - CV005
      - CV006
      - CV012
      - CV013
      - CV014
      - CV015
