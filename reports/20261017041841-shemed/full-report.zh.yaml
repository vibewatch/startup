  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 论点
      - 哪些信息会改变判断
    rows:
      - - 论点：SheMed 聚焦女性的代谢健康定位、临床医生监督和验血优先的注册流程，可能相较更简单的线上卖家支撑更高的信任溢价。
        - 若尽调显示这一设计改善留存、结果或贡献利润率，则上调判断；若它主要是营销成本、没有可量化的队列收益，则下调判断。
      - - 论点：公开融资报道和公司材料显示，SheMed 已取得有意义的融资信号和品类知名度。
        - 若披露投资者质量、治理和后续需求，则上调判断；若条款高度受优先权保护或依赖不可重复的热情，则下调判断。
      - - 反论点：公开证据没有披露收入、毛利率、CAC、回本期、会员续期或亏损率，因此无法独立评估 headline 估值。
        - 若经审计或董事会级 KPI 显示留存强劲且增长高效，则上调判断；若经济性弱于私募市场同行所暗示的水平，则下调判断。
      - - 反论点：英国私人 GLP-1 护理面临可见的价格透明度要求和更严格的线上开药保障，这可能在推高合规成本的同时压缩利润率。
        - 若 SheMed 证明定价能力持久且安全结果更优，则上调判断；若它主要靠营销和广泛的品类需求竞争，则下调判断。
    notes: 各论点是与估值相关的综合判断，不是独立事实；每一行都建立在被引用的主张上，应在尽调中验证。
