  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局覆盖公共医疗、药房巨头和获融资的邻近领域
        blocks:
          - type: paragraph
            body: >-
              留存证据显示，买方至少可以通过三条渠道解决同一项肥胖护理需求。第一，NHS 仍是现状型 incumbent：NHS England 表示，减重药物只向符合特定标准的肥胖患者开具；替尔泊肽推广按 12
              年时间表分阶段推进，前三年仅优先覆盖 220,000 名患者，因此公共路径临床可信， 但容量受限。第二，私立药房主导的竞争者已经公开起步价并拥有广泛配送；WhichWeightMeds 列出
              LloydsPharmacy Online Doctor、Superdrug Online Doctor 和 Boots Online Doctor，展示 Mounjaro
              起售价及常见的咨询加配送流程。第三，女性健康领域的邻近数字健康平台仍在融资，EU-Startups 报道 Numan 获得新资金进军女性健康；SheMed 面对的不只是当前 GLP-1
              配药商，还包括未来可以增加开方服务的邻近平台。留存证据没有显示独立的“内部自建”供应商，但展示了一种现实的自行组合替代：患者可以把 NHS 指引、受监管药房和普通生活方式支持拼在一起，而不是购买 SheMed
              的一体化流程。
