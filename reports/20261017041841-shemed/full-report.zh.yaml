      - - 置信度
        - medium
        - 公开证据足以否定盲目买入，但不足以精确给内在价值定价。
        - 保持尽调推进；没有新数据前不要转为高确信度判断。
      - - 风险评级
        - high
        - 监管收紧、价格透明度和未披露的队列经济性带来多条下行路径。
