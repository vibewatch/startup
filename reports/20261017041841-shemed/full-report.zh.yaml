      - number: '4.2'
        title: 定价、需求与商业信号
        blocks:
          - type: paragraph
            body: >-
              SheMed 的公开收入证据在需求端最强，在已披露的变现端最弱。Reuters 报道称，公司在不到一年内增加了超过 60,000 名会员并完成 $50m A 轮融资；Startuprise 和 Digital
              Health 重复了同一增长叙事及资金用途逻辑。Reuters 还报道了一个有商业意义的组合信号： Lilly 提高 Mounjaro 在英国的价格后，大多数新客户选择了 Wegovy，上游药价会改变
              SheMed 的产品组合，也可能影响每位会员的毛利。由于没有任何指定来源披露 SheMed 自己的标价或实际 ASP，最清晰的公开价格锚点来自外部：WhichWeightMeds 显示英国主要药房将
              Mounjaro 起售价定在 £149–£179/月，典型区间为 £149–£210/月。这一基准表明，SheMed 必须靠安全性、诊断和支持来赚取溢价，而不能只靠未披露的药品加价。
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
