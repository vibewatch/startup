              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: 什么支持论点，什么会击穿它
        blocks:
          - type: paragraph
            body: >-
              可投资论点从品类拉力和产品设计开始。NHS England 用数年而非数月逐步开放肥胖药物服务，伦敦议会也记录了公共供给与私人需求之间的巨大缺口。
              这一背景为能够提供安全、合规配套护理的私立运营者创造了真实需求窗口。SheMed 的模式比纯问卷销售商更契合这一方向，因为其流程在治疗前包含
              体重和身份核验、临床复核及血检。反向论点同样重要。公开比价证据显示，英国消费者已经可以在多个 GPhC 注册服务商之间比较可见的月度起售价， 而 GPhC
              又收紧了体重管理药物线上开方的保障措施。因此，即使品类需求上升，企业也可能同时承受利润率压力和合规压力。公开记录还存在牵引力口径 的模糊：SheMed 某页面称英国会员超过 50,000 人，LinkedIn
              则称不断增长的社区有超过 100,000 名女性。这不否定牵引力，但说明估值决策应依赖 经验证的付费会员、留存和结果数据，而不能只看营销表面的数字。
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 情景框架、估值姿态与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              在缺少公开财务披露的情况下，最干净的估值方法不是精确的收入倍数，而是以最后一次报道的估值为锚的里程碑式投资判断框架。乐观情景下，
              只有当尽调证明其面向女性的护理模式能带来比主流线上药房更高的留存、更安全的开方和更好的经济性，SheMed 才能守住或超过该估值。基准
              基准情景没那么慷慨：公司可能具有战略吸引力，但在投资人核实收入质量、重复行为和临床成本后的实际抽成前，仍应相对独角兽估值打折。
              悲观情景则是私募市场价格压缩、更重的合规负担和低于预期的队列质量叠加；即使品类需求保持健康，也可能导致下轮降价或平轮融资。这正是下一步
              尽调不应继续讲故事，而应索取一套聚焦收入、留存、单位经济性、开方安全和股权结构机制的硬证据。如果管理层无法提供，当前公开证据支持跟踪业务， 而不是追逐上一轮估值。
            claimRefs:
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 公开证据判断
            body: 正确的公开证据结论是继续研究，而不是买入：模式看起来有差异化，但当前价格信号已经领先于收入质量、留存和股权结构条款方面的披露证据。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV013
              - CV015
              - CV016
          - type: callout
            title: 下轮降价触发因素
            body: 价格透明度、开方保障收紧和队列经济性疲弱叠加，会让当前的独角兽估值从证明点变成未来估值压缩的参照。
            calloutType: risk
            claimRefs:
              - CV012
              - CV014
              - CV015
