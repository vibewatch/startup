      - number: '3.2'
        title: SheMed 以核验深度和女性定位实现差异化
        blocks:
          - type: paragraph
            body: >-
              SheMed 最明显的差异化不在最低价配送，而在更受管理的临床流程。公司官方“运作方式”页面展示了问卷、体重和身份核验、居家血检，
              随后寄送治疗药物和副作用护理包的完整顺序。第三方报道也指向同一方向：Pharmacy UK 称 SheMed 围绕女性激素和代谢需求构建， 并报道其使用实验室血检而非仅依赖自报 BMI；Digital
              Health 则报道了 Tasso 血检整合。这很重要，因为 GPhC 现在规定，体重管理 药物开方者不能只依赖问卷，必须独立核验体重、身高和/或 BMI。因此，SheMed
              的高接触流程在方向上符合更严格的信任和合规门槛， 并非天然就领先。代价是买方摩擦：血检和核验可以支撑信任，但相比已经明确展示月度价格锚点的普通药房漏斗，也可能拖慢转化。
