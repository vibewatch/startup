        title: 身份与当前产品
        blocks:
          - type: paragraph
            body: >-
              SheMed 将自身定位为一家面向女性的英国代谢健康平台，核心是临床医生主导的体重管理、GLP-1 治疗和基于血检的护理。当前官网推广 £59/月起的套餐、100k+ 名会员，以及一套受监管的服务体系，包括
              CQC 注册服务商、GMC 注册临床医生和 GPhC 注册药房。这个运营模式看起来比只靠问卷的远程医疗流程更深入临床，因为公司称会员在治疗前要完成居家血检，并在后续
              持续复测。这让护理叙事更站得住脚，但留存的公开来源仍未披露收入、ARR、员工人数或确切总部城市。
