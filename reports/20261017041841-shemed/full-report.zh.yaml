  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场边界比“数字健康”更窄，又比“线上 GLP-1 开方”更宽。SheMed 自身流程从筛查、资格核验和持续随访开始，而 NHS 与 NICE
              材料显示，英国肥胖治疗应将药物与行为和临床支持结合，而不是简单发药。因此纳入的支出包括药物、诊断、临床复核、监测和支持；
              排除的支出则包括无关的健康内容、减重手术，以及不属于体重管理路径的广泛初级保健工作。主要替代方案是公共 NHS 路径、普通线上药房， 以及其他不一定突出女性定位或血检先行流程的英国自费 GLP-1 服务商。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM013
