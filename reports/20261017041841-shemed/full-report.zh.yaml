      - - 估值立场
        - stretched
        - 市场可见的公开信息显示估值为 $1 billion，但收入、留存和优先权条款并未披露。
        - 在继续推进前争取更低入场价或更强证据。
      - - 决策含义
        - 价格敏感型路径 / 尽调
        - 公开证据支持继续尽调，而不是仅凭公开证据做出肯定判断。
        - 只有在经济性、安全指标和股权表机制经得起审查时才推进。
    notes: 仅为本章的快照判断；数值综合被引用的来源集，不能替代管理层数据室证据。
