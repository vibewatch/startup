            body: >-
              公开成本叙事对义务的说明比对毛利率更清楚。SheMed 自身流程要求血检筛查、首包履约、复查和持续支持，每一项都在药物之外增加运营成本。 外部监管进一步说明这不是轻量流程：GPhC
              现在将体重管理药物视为高风险线上开方，要求独立核验和双向沟通；NHS England 则称替尔泊肽推广 需要新服务、专业培训和配套护理。NICE 的 2026
              年肥胖指引也把服务规划和资金安排明确纳入委托方与服务商的范围。综合来看，实际结论是： SheMed 的重护理模式可能提高信任和差异化，但其临床、合规和服务交付成本很可能结构性高于纯获客或纯处方转接模式。
