      - number: '3.3'
        title: 现有药房仍掌握价格透明度与轻松多平台比价能力
        blocks:
          - type: paragraph
            body: >-
              留存证据中的私立竞争者主要比拼公开价格锚点和配送便利。WhichWeightMeds 展示 Lloyds、Superdrug 和 Boots 的公开起售价，
              同一页面还强调自取或配送便利、既有零售网络和持续支持。相比之下，本章留存证据不含 SheMed 当前公开定价页面或结账流程，因此 还不能证明公司在现金支付透明度上胜过药房
              incumbent。这种不对称关系会影响切换成本。当主要替代方案使用同一药物类别、公开起售价， 并接入 GPhC 注册药房基础设施时，买方可以相对容易地比较和改投；留存证据中 SheMed
              可能形成的锁定主要来自检测节奏、监测流程和女性 支持叙事，而非专有配送。NHS England 对配套护理的要求也意味着公共路径不只是获得药物，因此现状方案比简单的“漫长等待名单”更强。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP013
              - CP016
          - type: table
            tableRef: TP003
