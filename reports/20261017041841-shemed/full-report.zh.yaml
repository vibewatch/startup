      - number: '2.2'
        title: 市场规模视角与买方分层
        blocks:
          - type: paragraph
            body: >-
              分配到的证据池支持多个需求视角，但不足以得出数学上可相加的 TAM、SAM 和 SOM。公共市场方面，NHS England 表示替尔泊肽推广的 前三年将优先覆盖 220,000
              名患者，这是临床优先的英国需求下限，而不是整个市场的上限。私立市场方面，SheMed 官网称有“50,000+” 会员，而 Future FemHealth 和转载 Reuters
              的报道称公司在不到一年内达到超过 60,000 名会员；这些披露共同说明早期需求强劲， 但不能证明活跃付费会员数或留存率。买方经济性目前也明显是自费：一个由联盟营销资助的比较网站显示，英国品牌 GLP-1
              产品的月度起售价集中在几百英镑中段；Forbes 则显示 SheMed 将一套 £149 的居家激素和代谢筛查套件作为核心用药项目之外的邻近付费入口。
