            body: >-
              监管背景很关键，因为英国体重管理开方越来越明确要求身份核验、独立检查临床信息、合法药房供货和配套护理。NHS England 将肥胖药物 描述为低热量饮食和行为支持路径的一部分；GPhC
              表示单靠线上问卷或电话不够；GOV.UK 强调私立 GLP-1 供应仍需咨询，并且只能来自合法药房。 这些要求与 SheMed
              公开强调的筛查和监测相符，但也制造执行风险：公司必须在规模化时让核验、临床复核、供应完整性和支持质量协同运转。 当前公开信息没有显示状态指标、安全认证、升级 SLA
              或公开研究结果，投资人无法据此检验该流程是否像营销叙事所说的那样可靠且有防御力。
