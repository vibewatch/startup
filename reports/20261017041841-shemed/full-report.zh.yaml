      - number: '2.3'
        title: 增长动力与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求端动能真实存在：Reuters 指出女性占 GLP-1 用户多数，NHS 和媒体报道也显示需求旺盛，但公共渠道正在分阶段开放。SheMed 的
              差异化逻辑是，面向女性且有临床监测的流程，能吸引那些比只填问卷的线上药房更需要安心感的用户。但这个品类服务负荷高且监管严格。 NHS England
              的分阶段推广意味着公共供给受限，而不是人人马上都能获得服务；GPhC 指引现在也明确，高风险体重管理开方不能只依赖线上 问卷，必须独立核验患者信息。价格敏感度同样可见：Reuters 称，Mounjaro
              在英国涨价后，近期新用户转向 Wegovy。估值时，应把采用率放进信任与运营能力的市场框架，而不是按无摩擦的消费电商市场建模。
