            title: 运营强度既是价值主张，也是风险
            body: SheMed 的差异化依靠血检、临床复核、定期联系和受监管护理，而不是薄薄的交易层。这可以支持结果，但也意味着服务质量和成本纪律比漏斗顶端的需求更重要。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR012
              - CR014
              - CR016
          - type: callout
            title: 在接受当前叙事前的终止标准
            body: 除非管理层能拿出当前合规材料包、具名受监管交易对手、服务质量仪表盘、结果队列和能证明重支持模式可以在不发生监管或运营滑坡的情况下规模化的经济性数据， 否则不要把当前估值视为持久。
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR013
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据足以说明 SheMed 已经搭建了差异化叙事：面向女性的代谢护理、临床监督、居家血检和安全优先的接入流程，都让它区别于最普通的线上 GLP-1 漏斗。公开融资报道同样重要：SheMed 自有资料和
              Digital Health 都描述了 5000 万美元 A 轮融资及独角兽地位，说明公司已经
              获得私募市场溢价定价。对新投资人而言，问题在于公开记录仍未披露足以有把握评估这一价格的运营证明。本章来源集没有提供收入、滴定后的队列持续率、
              CAC、贡献利润率、损失率或优先权条款。实践中，投资判断必须对价格敏感：差异化护理模式或许值得溢价关注，但不值得盲目接受上一轮的标价。
              在管理层拿出关于经济性、留存和条款的经审计或董事会级证据前，纪律性的结论是继续研究，同时对估值保持拉伸立场并给予高风险评级。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV005
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
