      - number: '7.2'
        title: Payment and platform dependency risk
        blocks:
          - type: paragraph
            body: >-
              The 2021 explicit-content ban and reversal remains the clearest public stress test of the OnlyFans model.
              Independent coverage tied the original announcement to banking and payment-partner pressure, while the
              reversal arrived only after the company said it had secured assurances needed to support creators. That
              sequence shows that payment tolerance can override platform policy even when creator backlash is intense.
              Fresher commentary from Verdict, The Guardian, NSWP, and Fast Company also underscores that the trust
              damage did not fully disappear when the formal ban disappeared. Recent adverse coverage keeps the issue
              current: whistleblower allegations involving Mastercard and Visa, combined with Mastercard’s own
              compliance-program rules, show why the company cannot treat payments risk as solved by past scale. If
              processor terms tighten, the damage would not stop at fees. Creators can multihome across lower-stigma
              alternatives such as Patreon, Substack, and broader commerce rails, so any payment shock can transmit into
              creator retention and lower customer trust faster than a standard SaaS platform would expect.
            claimRefs:
