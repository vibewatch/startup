        blocks:
          - type: paragraph
            body: |-
              Public durability evidence is indirect. Third-party operating guides say successful creators increasingly
              depend on PPV and chat, while analytics vendors treat churn, LTV, ARPU and message performance as core
              metrics. That implies repeat behavior matters economically, but it does not prove OnlyFans-level cohort
              health. The strongest adverse durability signal is on the creator-supply side: Bambi argues acquisition
              costs are rising, creator lifespan is often only 14–18 months, and multihoming is increasingly standard.
              Public market pages also describe median creator earnings below $200 a month and extreme concentration in
              top creators, which makes the long-tail supply base look economically fragile. Critically, OnlyFans does
              not disclose GRR, NRR, renewal rates, active-paying-fan cohorts, or creator churn in retained public
              sources. The chapter can therefore support the existence of retention dynamics, but not quantify durable
