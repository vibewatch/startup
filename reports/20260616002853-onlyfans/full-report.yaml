              - CV039
              - CV040
      - number: '8.4'
        title: Scenarios, upside optionality, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The fresh public price should remain the base case until proven otherwise. A bull case above $4 billion
              requires two things the public record does not yet provide: clean multi-year compliance evidence and proof
              that Architect’s creator-fintech vision can monetize beyond the legacy 20% take-rate business. A bear case
              around $2.0-2.5 billion becomes plausible if regulation worsens, processors tighten terms, or new
              investors cannot secure governance or downside protection. That framework leads to a practical diligence
              agenda. Investors need audited margin detail, the 2026 deal’s real preference stack and rights, evidence
              of remediation after the Ofcom fine, and cohort retention data that can show whether creator liquidity is
              as durable as the account totals suggest. Without that package, the correct stance is to respect the
              public anchor but avoid paying above it on narrative alone, especially in an ordinary minority round.
            claimRefs:
              - CV035
              - CV036
              - CV038
              - CV039
              - CV040
              - CV041
              - CV043
              - CV042
          - type: table
            tableRef: TV006
            claimRefs:
              - CV041
              - CV036
              - CV028
              - CV037
          - type: figure
