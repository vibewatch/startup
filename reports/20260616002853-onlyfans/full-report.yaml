            claimRefs:
              - CV016
              - CV027
              - CV028
              - CV044
              - CV036
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports price, not exuberance
            body: >-
              The 2026 Architect transaction is a real pricing point that validates OnlyFans as a valuable and
              profitable platform. It does not, by itself, justify paying more than the anchor without better terms or
              better evidence.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV037
              - CV044
          - type: callout
            title: The main discount is quality of risk, not lack of scale
            body: >-
              OnlyFans is large enough and profitable enough to command a meaningful valuation. The cap on upside comes
              from regulation, payment sensitivity, and governance, which make terminal value less secure than the raw
              revenue base suggests.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV028
              - CV029
          - type: callout
            title: Creator-fintech adjacency should be treated as option value only
            body: >-
              Architect’s strategy could create upside, but public evidence does not yet show attach rates, product
              economics, or loss experience. Until that evidence exists, the optionality should not carry the valuation
              case.
            calloutType: assumption
            claimRefs:
              - CV035
              - CV036
              - CV042
