companyProfile:
  summary: >-
    OnlyFans is a London-based creator-payments platform operated by Fenix International Limited that lets creators
    monetize subscriptions, pay-per-view media, tips, and direct-message interactions while keeping 80% of earnings.
    Founded by Tim Stokely in 2016 and later controlled by Leonid Radvinsky, the business reached unusual scale for a
    private platform and then reset its ownership story in 2026 when Yekaterina Chudnovsky became the visible person
    with significant control and Architect Capital bought a 16% minority stake. Public filings and reporting show an
    unusually profitable creator marketplace, but the platform still carries regulatory, payment-counterparty, and
    governance risks that matter as much as its growth and profit profile.
  foundedDate: '2016-01-01'
  founders:
