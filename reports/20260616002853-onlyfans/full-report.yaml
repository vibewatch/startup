      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The 2021 policy reversal remains a live risk signal
            body: >-
              The ban-and-reversal episode matters because it proved that payment tolerance can dictate platform policy.
              That dynamic still frames downside risk more than almost any single product metric.
            calloutType: risk
            claimRefs:
