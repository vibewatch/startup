  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and trust-stack risk
        blocks:
          - type: paragraph
            body: >-
              OnlyFans now has a demonstrated UK enforcement problem rather than a hypothetical one. Ofcom escalated
              from a 2024 investigation into the platform’s age-verification measures to a £1.05 million fine in 2025
              for inaccurate responses about age assurance. That matters because the Online Safety Act turns
              child-safety and illegal-content controls into continuing legal duties for services with significant UK
              users, not one-off PR issues. The Reuters-derived swissinfo reporting adds a second layer of risk: even if
              OnlyFans cites moderation outputs such as CyberTipline reports, outside experts still face structural
              limits in independently auditing creator-by-creator paywalled content. The result is a trust stack in
              which regulators, payment partners, and the public can all question whether the company’s controls are as
              strong as management claims, and a challenge on one front can quickly harden into a broader confidence
              problem.
            claimRefs:
