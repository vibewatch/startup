      - number: '3.4'
        title: Moat durability versus compliance and payment pressure
        blocks:
          - type: paragraph
            body: >-
              OnlyFans’ moat is strongest where rivals are weakest: closed-loop paid conversion at scale. The public
              numbers show that it operates with billions of gross fan payments and hundreds of millions of registered
              fan accounts, which no source here matches with the same visibility. But scale does not eliminate risk.
              The 2021 attempted porn ban demonstrated how quickly banking and payout pressure can threaten adult
              creators’ trust in the platform. Ofcom’s 2025 fine and the Online Safety Act add a second layer of
              pressure by making age assurance and reporting governance a hard operating requirement. Swissinfo and
              Mastercard reinforce the third layer: payment-rail and trust controls shape what the market can legally
              and operationally sustain. That leaves a nuanced underwriting view. OnlyFans has real liquidity and brand
              advantages, but creators can still multi-home, discovery can still happen elsewhere, and regulatory or
              payment shocks can still narrow the moat faster than a simple market-share chart would imply.
