  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: |-
              For a creator, OnlyFans is a monetized direct-to-fan workflow rather than a generic social feed. The
              core product lets a creator publish photos, video and chat offers behind recurring subscriptions, while
              also monetizing one-off pay-per-view drops, tips and one-to-one direct messages. The official About
              page frames this as a subscription social platform built around direct creator-fan relationships, and
              Pocket-lint plus OnlyFans Statistics show the economic stack is broader than subscriptions alone. The
              key workflow distinction is that discovery, conversion and monetization are split across surfaces:
              creators use the paid web platform for commerce and relationship management, while OFTV gives the
              company a safe-for-work discovery surface that can live inside app stores and TV ecosystems. That
              separation is strategically important because it expands brand reach without collapsing the paid product
              into a mainstream app-store policy model.
