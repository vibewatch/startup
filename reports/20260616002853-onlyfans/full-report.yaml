            body: >-
              The cleanest current capital datapoint is the May 2026 Architect Capital transaction: 16% of the company
              sold for $535 million at a $3.15 billion implied valuation. That is the only priced external financing
              event clearly visible in the reviewed pack, and InforCapital even describes it as the first external
              round. Whether or not that turns out to be literally true, the broader public signal is clear: the final
              priced minority round landed well below the earlier sale-talk headlines. Reuters-linked coverage in
              January 2026 discussed a nearly 60% sale to Architect at around $5.5 billion including debt, while Variety
              had previously written that Radvinsky was shopping the company at roughly $8 billion. The adequacy problem
              is that none of those stories discloses cash on hand, burn, reserve requirements, or the actual
