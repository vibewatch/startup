              - CV031
              - CV032
      - number: '8.3'
        title: What caps the price
        blocks:
          - type: paragraph
            body: >-
              The reason OnlyFans does not automatically deserve a much higher value is not scale; it is risk quality.
              The Ofcom fine is direct evidence that regulatory issues are no longer hypothetical, while the 2021
              banking-driven policy reversal still warns that payment tolerance can shape product policy and creator
              trust. Governance also matters: the company paid out extraordinary dividends, control remains
              concentrated, and public disclosure does not reveal the rights or protections attached to the 2026
              minority investment. Those factors make the same headline valuation less attractive for a plain minority
              investor than for a strategic or structured buyer. Peer comparisons reinforce the point. Patreon appears
              to trade on a much richer revenue multiple despite far smaller revenue because its content and payments
              profile is cleaner. Substack, too, benefits from standard rails and lower stigma. The public
              market-clearing price therefore looks like a valuation that already embeds a discount for regulation,
              governance, and terminal-value uncertainty.
            claimRefs:
              - CV028
              - CV029
              - CV041
              - CV033
              - CV034
              - CV007
