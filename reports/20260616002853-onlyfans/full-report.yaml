  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, transaction mechanics, and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              OnlyFans should be underwritten first as a payments-and-take-rate platform, not as a standard SaaS vendor.
              The strongest public source is the terms page: it defines creator interactions around subscriptions,
              pay-per-view content, and direct-message payments, says subscriptions auto-renew unless cancelled, and
              makes clear that creators set their own monthly price. Creator-facing official material then adds the
              crucial economic split: creators keep 80% of earnings, leaving the platform with a 20% take. Those facts
              establish the basic revenue engine, but they do not establish revenue quality. Public sources still do not
              break out how much 2024 net revenue came from subscriptions versus PPV versus messaging, and they provide
              no realized ARPU, creator concentration, or chargeback data. The new strategic layer is creator financial
              services, which Architect and management say they now want to build on top of the existing transaction
              flow. Official blog surfaces also show current marketing emphasis on athletes, comedians, OFTV talent, and
              free accounts, which supports management’s claim that diversification is meant to widen monetization
              without changing the underlying payment mechanics.
