          - type: callout
            title: Ofcom moved from suspicion to a monetary penalty
            body: >-
              OnlyFans is no longer dealing with abstract UK scrutiny. Ofcom already investigated, concluded responses
              were inaccurate, and imposed a fine, which should raise the probability investors assign to future
              follow-on actions.
            calloutType: risk
            claimRefs:
              - CR011
              - CR013
              - CR015
          - type: callout
            title: Governance opacity is manageable only if diligence rights are strong
            body: >-
              Large dividends, concentrated control, and non-trivial entity mapping do not automatically break the
              thesis, but they do require stronger information rights and more direct diligence than a normal
              creator-tech deal.
            calloutType: assumption
