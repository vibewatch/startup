      - number: '1.5'
        title: Regulatory, tax, and reputational overhangs
        blocks:
          - type: paragraph
            body: >-
              OnlyFans’ company overview is incomplete without the adverse context because the external risk surface is
              unusually relevant to the investment story. Ofcom’s fine was not a small technicality: the regulator said
              Fenix gave inaccurate information about age-assurance thresholds, took too long to surface the error, and
              only received a discount because it accepted the findings and settled. Sky News also documented a
              long-running UK VAT dispute that could have imposed more than £11 million of tax liability. Separate
              Reuters-linked coverage relayed through CBS kept illegal-content payment allegations in circulation by
              tying the platform to a FinCEN whistleblower complaint involving Mastercard and Visa. None of those items
              disproves the company’s scale or profitability, but together they show why a minority-stake valuation
              alone is not enough to underwrite regulatory durability, processor resilience, or reputational tolerance
              among financial counterparties.
            claimRefs:
              - CO032
              - CO033
              - CO034
              - CO035
              - CO036
              - CO037
              - CO049
