      - number: '2.4'
        title: Growth drivers, regulatory constraints, and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest growth driver for OnlyFans is not a generic TAM chart but the combination of creator-economy
              expansion, demonstrated fan willingness to pay, and a closed-loop payout model that has already reached
              multi-billion-dollar scale. The biggest constraints are equally specific. Ofcom’s fine and the Online
              Safety Act show that adult-content platforms face ongoing age-assurance, reporting, and child-safety
              obligations that mainstream creator tools do not shoulder to the same degree. Swissinfo and CBS also
              reinforce that paywalled adult ecosystems are hard for outsiders to audit, which raises scrutiny risk.
              Just as importantly, the 2021 porn-ban episode showed that banking and payment partners can abruptly
              reshape the market by threatening distribution or payout continuity. That means investors should treat
              OnlyFans as a durable but regulation-sensitive cash-flow platform: public data is strong on historical
              platform output, weaker on true adult-market breadth, and weakest on how payment-rail decisions could
              reshape supply, policy, or creator willingness to stay concentrated on one platform.
