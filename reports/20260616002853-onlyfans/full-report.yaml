      - number: '7.4'
        title: Mitigations, monitors, and thesis-break tests
        blocks:
          - type: paragraph
            body: >-
              The investment implication is not that OnlyFans is unfinanceable; it is that the company should be
              underwritten like a high-cash-flow but highly regulated counterparty-dependent platform. The key mitigants
              are therefore governance and evidentiary rather than storytelling: direct access to Ofcom correspondence,
              processor reserve terms, tax-case status, a clean structure chart, and operating metrics on creator churn
              and age-assurance performance. If those materials are unavailable, the residual risk stays high because
              public evidence already shows a regulator willing to fine the company, a business model shaped by payment
              tolerance, and a user/creator base that can react quickly to trust shocks. In other words, downside here
              is operationally fast-moving rather than a slow-burn governance concern. For diligence, the main kill
              criteria are any fresh child-safety enforcement, any payment-rail restriction tied to harm controls, any
              adverse VAT ruling, or any new inconsistency between control filings and management narrative. Those
              events would all indicate that public risks are not merely reputational noise but direct valuation and
              liquidity inputs.
            claimRefs:
              - CR013
              - CR009
              - CR018
              - CR026
