      - number: '5.2'
        title: Module Map and Operating Surface
        blocks:
          - type: paragraph
            body: |-
              Publicly visible product modules are straightforward but economically dense. The paid platform handles
              subscriptions, direct messages, pay-per-view upsells, tipping and creator payout reporting. Creator
              Center materials show that onboarding, earnings optimization and feature education are productized as an
              official support surface rather than left entirely to community lore. OFTV is the separate content and
              discovery module: the site and Apple listing position it as free, ad-free and no-login-required, with
              fitness, cooking, comedy and music prominently featured. Around those native surfaces sits a clear
              third-party operating layer. Infloww, FansMetric, Supercreator and SirenCY all market analytics,
              conversion, churn, PPV timing and LTV tools specifically for OnlyFans operators, implying the native
              stack is commercially powerful but operationally incomplete for advanced creators and agencies. The
