      - number: '3.2'
        title: Pricing, packaging, and publicly visible scale
        blocks:
          - type: paragraph
            body: >-
              Price alone does not settle the competitive question, but it does explain why OnlyFans must win on
              conversion and liquidity rather than on the cheapest take rate. OnlyFans keeps 20% of fan payments.
              Patreon’s standard plan is 10% before processing and taxes. Substack’s platform fee is also 10%, although
              effective creator cost climbs when Stripe and app-store friction are layered in. Ko-fi can be cheaper
              still for some use cases, with free-tier tips at 0% and most other monetization types at 5%. Those rivals
              also package differently: Patreon bundles community, newsletters, and one-time products; Substack is
              optimized for subscription publishing and writer-owned audiences; Ko-fi mixes tips, shops, memberships,
              and commissions. OnlyFans remains the largest publicly visible monetization engine in this comparison set,
              but its fee premium means creators need to believe the platform converts better, pays reliably, and
              tolerates adult monetization better than the alternatives.
