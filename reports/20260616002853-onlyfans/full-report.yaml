  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct adult rivals, mainstream paid tools, and commerce adjacencies'
        blocks:
          - type: paragraph
            body: >-
              OnlyFans should not be benchmarked only against direct adult-content subscription clones. The real
              decision set is broader. Adult-focused alternatives such as Fansly, FanCentro, and JustForFans matter
              because they provide fallback supply for creators who care most about payout familiarity, community fit,
              or policy tolerance. Mainstream membership and newsletter platforms such as Patreon, Substack, and Ko-fi
              matter because they let creators monetize loyal audiences with lower headline platform fees or stronger
              audience ownership. Discovery-led and commerce-led platforms matter too. TikTok Shop turns creators into
              merchants inside video and livestream feeds, while Linktree shows that creators already push meaningful
              traffic into retail and affiliate conversion off-platform. The competitive landscape therefore spans
              direct substitutes, adjacent creator tools, and multi-homing workflows instead of a single one-to-one
              “best alternative” rival. That broader framing is essential because creators often combine several
              monetization layers at once, not sequentially.
            claimRefs:
