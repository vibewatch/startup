  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacent monetization paths
        blocks:
          - type: paragraph
            body: >-
              OnlyFans should not be framed as a proxy for the entire creator economy. The broad backdrop is real: the
              2026 Creator Economy Report describes a market of creator-led businesses supported by software, finance,
              advertising, and commerce tools, while Linktree and ClickAnalytic show how much discovery and shopping
              activity now sits outside direct subscriptions. But OnlyFans monetizes a narrower layer. Its terms show
              that the product is built around subscriptions, pay-per-view unlocks, direct-message purchases, and
              platform-managed payouts. OFTV and broader creator categories matter because they widen the top of funnel,
              yet those adjacencies do not erase the fact that OnlyFans still depends on converting fans inside a
              controlled paywall. The market boundary therefore includes paid-fan conversion, creator onboarding and
              payouts, and moderation or compliance infrastructure; it excludes most ad-tech spend, open social reach,
              and the wider mass of creator software that never touches adult paid content today globally.
