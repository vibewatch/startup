      - number: '1.1'
        title: Identity, legal entity, and business model
        blocks:
          - type: paragraph
            body: >-
              OnlyFans should be framed as a branded creator-payments platform operated through the UK legal entity
              Fenix International Limited rather than as a simple consumer app brand. The official Terms of Use are the
              cleanest primary source: they identify Fenix International Limited as the operator, place the registered
              office at 9th Floor, 107 Cheapside in London, and define the platform’s core economic interactions as
              subscriptions, pay-per-view sales, and direct-message payments between fans and creators. Independent and
              official material align on the 2016 founding by Tim Stokely. Public creator-facing copy also supports the
              broader product narrative that management wants investors to hear: a platform for many creator categories,
              not just adult creators. That said, later external coverage still treats adult content as the center of
              gravity, so the official diversification story should be read as strategic positioning rather than a
              replacement for the core historical business.
