      - number: '8.2'
        title: What supports the price
        blocks:
          - type: paragraph
            body: >-
              OnlyFans has two unusual strengths relative to creator-platform peers: scale and cash generation. The
              platform reported roughly 4.634 million creator accounts, 377.5 million fan accounts, and more than $25
              billion of cumulative payouts, which makes it a real liquidity hub rather than a thin marketplace. The
              financial profile also matters. Heavy dividends and a large cash balance suggest the business is already
              producing cash for owners, not simply promising future monetization. Those traits make the current
              valuation easier to defend than a typical high-growth private software multiple would be. They also
              explain why the best comparable is not a niche adult rival alone. OnlyFans should be evaluated against
              broader creator-subscription platforms such as Patreon and Substack while still recognizing that its
              absolute scale is much larger. The valuation argument in favor of the company is therefore simple: a
              dominant, profitable, cash-yielding network can deserve a durable premium to smaller peers even without an
              IPO narrative.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV016
              - CV027
              - CV019
              - CV021
