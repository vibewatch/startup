      - number: '3.3'
        title: Adult-platform dynamics and why creators keep fallback options
        blocks:
          - type: paragraph
            body: >-
              The direct adult-platform set is best understood as an operating-risk hedge rather than as a set of
              transparent public comps. Fansly’s help center is heavy on payout methods, earnings statistics,
              subscription mechanics, and tax forms. FanCentro’s accessible support pages also center on earnings and
              payments. JustForFans differentiates through explicit LGBTQ and kink positioning plus a stated 80–85%
              payout. None of these surfaces provides a clean public scale comparison to OnlyFans, but together they
              show why adult creators do not make platform choices on fee tables alone. They care about whether adult
              content is welcome, how quickly money moves, whether identity and tax paperwork work, and whether a niche
              community exists. That setup naturally encourages multihoming. A creator can keep OnlyFans as the biggest
              revenue engine while maintaining backup distribution or niche monetization elsewhere in case policy,
              payouts, or audience behavior shift. In practice that means competitive pressure often shows up as
              redundancy and portfolio behavior, not a clean full-platform replacement event.
