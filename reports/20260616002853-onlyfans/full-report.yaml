      - number: '1.4'
        title: Milestones from founding to policy reversals and succession
        blocks:
          - type: paragraph
            body: >-
              The public milestone arc is less about product launches than about platform legitimacy, content-policy
              pressure, and ownership shifts. Founding in 2016 and Radvinsky’s 2018 acquisition created the legal and
              ownership base. The next pivotal milestone came in August 2021, when the company tried to ban sexually
              explicit content after pressure from banking and payment partners and then reversed itself within days
              after creator backlash. That episode remains strategically important because it exposed how dependent the
              business is on payment infrastructure even when creator demand is strong. Later milestones were governance
              and compliance driven: Blair’s 2023 CEO appointment, Ofcom’s 2024 investigation and 2025 fine over
              inaccurate age-assurance disclosures, the 2025 filing of strong FY2024 accounts, and finally the 2026
              succession-and-financing reset in which Chudnovsky became the visible controller and Architect Capital
              bought a minority stake.
