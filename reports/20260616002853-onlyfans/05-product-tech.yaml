  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: native-analytics-depth
    missingEvidence: A current first-party walkthrough of dashboard fields, alerting, payout controls and any API or export endpoints.
    whyItMatters: Public evidence suggests advanced operators rely on external tooling, but the exact boundary between native analytics and third-party overlays remains unclear.
    diligencePath: Request live creator demo accounts, analytics screenshots, support documentation and roadmap commentary from product leadership.
  - type: missing-source
    severity: material
    topic: support-and-reliability
    missingEvidence: Published uptime, outage history, response-time SLOs and support SLA commitments for creators and high-volume agencies.
    whyItMatters: A monetized relationship platform can lose trust quickly when support and payout operations are unreliable.
    diligencePath: Request internal reliability scorecards, support queue metrics and major-incident postmortems.
  - type: private-evidence-only
    severity: material
    topic: oftv-conversion
    missingEvidence: Evidence linking OFTV usage to creator acquisition, paying-fan conversion or retention uplift.
    whyItMatters: OFTV may be strategically valuable, but public sources do not show whether it actually compounds monetization on the paid platform.
    diligencePath: Ask for internal attribution studies, cross-surface funnel data and creator case studies with OFTV-assisted conversion.
  - type: conflicting-data
    severity: material
    topic: trust-safety-control-quality
    missingEvidence: Primary documentation reconciling current challenge-age settings, verification workflows and quality-assurance controls after the Ofcom enforcement action.
    whyItMatters: The company clearly has policy and verification systems, but the public record proves those systems were misrepresented to regulators.
    diligencePath: Request updated control descriptions, QA process documents and regulator correspondence after the 2025 fine.
