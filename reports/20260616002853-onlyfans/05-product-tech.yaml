- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Dependency
  - Risk
  rows:
  - - Web-first paid platform
    - Hosts subscriptions, PPV, tips, DMs and creator account management
    - Browser access plus payments and moderation systems
    - App-store restrictions limit native distribution of the core paid product
  - - Creator education surface
    - Explains tools, features and monetization workflows
    - Official editorial/support team
    - Documentation depth is visible, but change cadence and completeness are opaque
  - - Analytics and reporting
    - Tracks earnings, churn, LTV, PPV and message performance
    - Native dashboard plus third-party vendors
    - Operational dependence can shift value capture outside OnlyFans
  - - Trust and compliance controls
    - Age checks, identity verification, content-policy enforcement, complaints and appeals
    - Third-party facial estimation, policy operations, regulator interaction
    - Regulatory misreporting has already triggered enforcement
  - - OFTV distribution layer
    - App-safe free video viewing across mobile and TV platforms
    - Apple/TV ecosystems and creator participation
    - Discovery scale does not automatically translate into paying conversion
  notes: Because OnlyFans does not publish a deep systems architecture, this table uses the best-supported operating components visible from official pages, app listings and practitioner tooling.
