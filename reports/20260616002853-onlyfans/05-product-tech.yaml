  - Status
  - Scope
  - Gap
  rows:
  - - Facial age estimation challenge age
    - Live but previously misreported
    - User age assurance on account creation
    - Ofcom found the threshold had been 20 rather than the stated 23
  - - Secondary adult verification
    - Live
    - Fallback for users estimated below challenge age
    - Public detail is policy-level, not control-performance data
  - - Deepfake / synthetic media restriction
    - Tightened in 2026 policy commentary
    - Creator content governance
    - Public confirmation comes through third-party policy analysis more than first-party technical docs
  - - Complaints / appeals / acceptable use policy
    - Documented in terms surface
    - Platform governance and disputes
    - Policy abundance does not prove operational maturity or response quality
  - - Payment-rail scrutiny
    - Active external risk
    - Merchant acquiring and compliance perimeter
    - External pressure can force product-policy changes or stricter enforcement
  notes: This table separates the existence of controls from evidence of control quality; public enforcement and legal analysis show the gap between having a policy surface and operating it reliably.
