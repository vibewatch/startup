callouts:
- calloutType: strength
  title: Flexible monetization is the product core
  body: |-
    OnlyFans' strongest product proof is not a single feature but the way subscriptions, PPV, tips and paid
    messages combine into a dense direct-to-fan monetization loop that many creator tools now orbit.
  claimRefs:
  - CE004
  - CE009
  - CE010
- calloutType: risk
  title: Compliance and payments can rewrite the roadmap
  body: |-
    Because age assurance, moderation accuracy and payment-rail scrutiny already triggered investigations,
    fines and external criticism, product policy on OnlyFans can be forced by regulators and processors
    rather than chosen solely by the company.
  claimRefs:
  - CE020
  - CE023
  - CE024
  - CE036
