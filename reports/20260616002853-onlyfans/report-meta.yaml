companyProfile:
  summary: OnlyFans is a London-based creator-payments platform operated by Fenix International Limited that lets creators monetize subscriptions, pay-per-view media, tips, and direct-message interactions while keeping 80% of earnings. Founded by Tim Stokely in 2016 and later controlled by Leonid Radvinsky, the business reached unusual scale for a private platform and then reset its ownership story in 2026 when Yekaterina Chudnovsky became the visible person with significant control and Architect Capital bought a 16% minority stake. Public filings and reporting show an unusually profitable creator marketplace, but the platform still carries regulatory, payment-counterparty, and governance risks that matter as much as its growth and profit profile.
  foundedDate: '2016-01-01'
  founders:
    - name: Timothy Stokely
      role: Founder
      background: British entrepreneur who launched OnlyFans in 2016 and later sold control of Fenix/OnlyFans to Leonid Radvinsky.
      claimRefs: [CO001, CO013]
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: Subscription-based creator platform for paid fan relationships, including subscriptions, pay-per-view content, tips, and direct-message payments.
  customerFocus: Individual creators monetizing fans directly across adult and non-adult categories, with especially strong historic concentration in adult content.
  businessModel: OnlyFans keeps 20% of creator revenue while creators keep 80%; monetization is driven by subscriptions, PPV, tips, and messaging-related spend.
  stage: Series A
  fundingStatus: $535M minority Series A-style financing from Architect Capital in May 2026 at an implied $3.15B valuation after a decade of self-funded operations.
