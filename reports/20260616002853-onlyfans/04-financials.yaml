- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Current public status
  - Exact diligence path
  rows:
  - - Cash, burn, and runway
    - Blocks a direct capital-adequacy judgment
    - Not publicly disclosed in reviewed pack
    - Request 24-month cash-flow model, current cash, monthly burn, and reserve requirements
  - - Revenue mix by subscriptions / PPV / messages
    - Blocks revenue-quality analysis
    - Only structural mechanics are public
    - Request GMV and net revenue split by stream and geography
  - - Gross margin and payment-cost stack
    - Blocks sustainable-margin analysis
    - Consolidated profit is public; cost stack is not
    - Request processor fees, chargebacks, fraud losses, support cost, and margin by stream
  - - Creator concentration and churn
    - Blocks revenue durability analysis
    - Public pack has total users and creators but not concentration
    - Request top-creator share of GMV, creator churn, and fan-retention cohorts
  - - Architect round terms and governance rights
    - Blocks dilution and downside-rights analysis
    - Stake size and price are public; terms are not
    - Request term sheet, side letters, board rights, preferences, and information rights
  - - Tax and regulatory reserves
    - Blocks true free-cash-flow and liability analysis
    - Fine and VAT dispute are visible, reserve treatment is not
    - Request legal-reserve memo, regulator correspondence, and tax provisioning schedules
  notes: Each row names a specific diligence deliverable because the public record supports a view on scale and risk, but not a full underwriting model.
