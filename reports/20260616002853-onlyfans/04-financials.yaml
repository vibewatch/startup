callouts:
- calloutType: strength
  title: OnlyFans is already a very large and profitable private platform on public evidence
  body: The available record is unusually strong on scale for a private company. Fiscal 2024 fan payments, net revenue, profit, user counts, creator counts, and payout totals are all large enough to establish that this is not an early-stage growth story but a scaled, cash-generative platform whose core economics already work at the consolidated level.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI005
  - CI008
  - CI009
- calloutType: risk
  title: Financial opacity now matters more than growth credibility
  body: The financial question is no longer whether OnlyFans has revenue or profit. It is whether investors can see enough of the margin stack, creator concentration, processor dependence, legal reserves, and Architect round terms to underwrite durability. Public evidence remains too thin on those exact points.
  claimRefs:
  - CI029
  - CI030
  - CI031
  - CI034
  - CI038
  - CI047
  - CI051
  - CI052
