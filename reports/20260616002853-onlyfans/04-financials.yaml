- id: public-scale-and-unit-economics-gaps
  title: FY2024 scale, profitability, and unit-economics blind spots
  body: 'The public record is strongest on headline 2024 scale and weakest on unit economics. Variety and The Independent align on the core figures: about $7.22 billion of gross fan payments, $1.41 billion of net revenue, and $684 million of pre-tax profit. They also align on the user base — 377.5 million fan accounts and 4.634 million creator accounts — while Variety adds the notable detail that Fenix itself had just 46 employees and relied heavily on contractors. That combination suggests a highly scaled but operationally specialized platform with strong consolidated profitability. However, the same record leaves the most underwriting-important unit-economics questions unanswered. There is no public cash balance, runway, gross margin by stream, creator concentration, refund behavior, CAC, or payback data. Public evidence therefore supports scale and profit, but not enough of the cost stack to model durability cleanly.'
