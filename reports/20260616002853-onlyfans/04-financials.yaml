tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Subscriptions
    - Fans pay creators recurring monthly fees and OnlyFans keeps a share of those payments
    - Monthly subscription fee
    - Core mechanic is official, but public revenue split is undisclosed
    - High platform relevance, medium disclosure quality
    - Request subscription GMV, realized take, churn, and cohort ARPU
  - - Pay-per-view content
    - Fans purchase individual paid posts or locked content
    - Per item transaction
    - Officially supported in terms; stream contribution is undisclosed
    - Medium — important but unsegmented publicly
    - Request PPV GMV, attach rate, refund rate, and creator concentration
  - - Direct-message payments
    - Fans can pay for messaging interactions with creators
    - Per message / interaction
    - Officially supported in terms; financial mix undisclosed
    - Medium — likely meaningful but opaque
    - Request DM GMV, abuse/refund rate, and take-rate by interaction type
  - - Platform take rate
    - OnlyFans monetizes a percentage of creator interactions
    - 20% / creators keep 80%
    - Well repeated in company and independent coverage
    - High confidence on structure, low confidence on realized effective take after adjustments
    - Request realized net take rate after chargebacks, payment fees, taxes, and incentives
  - - Creator financial services / process stream
    - 2026 Architect rationale points to future financial products and smoother payouts
    - Service or payments-finance fee base
    - Strategic direction announced; revenue contribution not yet public
    - Low current revenue certainty, potentially strategic future upside
    - Request roadmap, launch timing, economics, and regulatory approvals for any new financial products
  notes: Rows distinguish official transaction mechanics from future monetization themes. Public evidence supports structure, not stream-level revenue mix.
