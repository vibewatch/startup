- id: regulatory-costs-and-financial-verdict
  title: Regulatory costs, liability overhangs, and financial verdict
  body: The financial verdict on OnlyFans is simultaneously strong and incomplete. Strong, because the public record supports a business of enormous scale with real profit and significant dividend capacity. Incomplete, because the same public record shows compliance and liability risks that matter precisely because so much cash moves through the platform. Ofcom’s £1.05 million fine, the historic VAT dispute described by Sky News, and payments-related illegal-content allegations all have the potential to affect reserves, partner risk, and valuation tolerance even if they do not yet erase profitability. The bottom line is that OnlyFans looks financially powerful enough to command a multibillion-dollar private valuation and attract strategic capital, but still too opaque on cash, reserve policy, revenue mix, and governance terms to clear a full institutional underwriting standard without management diligence materials. Independent scrutiny is also unusually hard because so much creator content
    sits behind individual paywalls, which weakens outside verification of safety prevalence and reinforces the need for direct diligence. The same gap applies to the exact reserve treatment for UK online-safety compliance.
