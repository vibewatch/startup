    - No public disclosure of effective net take after fees, disputes, or taxes
  - - Strategic creator-finance services
    - Not yet publicly priced
    - Architect / company statements
    - Signals a future monetization adjacency rather than current disclosed revenue
    - No disclosed product set, fee model, approval timeline, or attach assumptions
  notes: OnlyFans exposes pricing structure more clearly than realized economics. The table intentionally separates list mechanics from actual revenue realization.
