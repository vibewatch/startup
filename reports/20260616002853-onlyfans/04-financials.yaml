company:
  name: OnlyFans
chapter:
  number: 4
  title: Financials
  summary: 'OnlyFans’ public financial record is strong on scale and weak on underwriting detail. FY2024 coverage tied to the annual report points to about $7.22 billion of gross fan payments, $1.41 billion of net revenue, and $684 million of pre-tax profit, while the 2026 Architect Capital deal priced 16% of the company at $535 million and implied a $3.15 billion valuation. The main caveat is not growth credibility but opacity: cash, burn, stream-level gross margin, creator concentration, reserve policy, and Architect’s governance rights remain private even as Ofcom and tax overhangs stay financially relevant.'
sections:
- id: revenue-model-and-monetization
  title: Revenue model, transaction mechanics, and monetization visibility
  body: 'OnlyFans should be underwritten first as a payments-and-take-rate platform, not as a standard SaaS vendor. The strongest public source is the terms page: it defines creator interactions around subscriptions, pay-per-view content, and direct-message payments, says subscriptions auto-renew unless cancelled, and makes clear that creators set their own monthly price. Creator-facing official material then adds the crucial economic split: creators keep 80% of earnings, leaving the platform with a 20% take. Those facts establish the basic revenue engine, but they do not establish revenue quality. Public sources still do not break out how much 2024 net revenue came from subscriptions versus PPV versus messaging, and they provide no realized ARPU, creator concentration, or chargeback data. The new strategic layer is creator financial services, which Architect and management say they now want to build on top of the existing transaction flow. Official blog surfaces also show current marketing
    emphasis on athletes, comedians, OFTV talent, and free accounts, which supports management’s claim that diversification is meant to widen monetization without changing the underlying payment mechanics.'
