tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale / proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Creators
    - Buyer=user=payer on supply side via 20% platform take
    - Publish gated content, chat offers and PPV drops
    - Millions of creator accounts; named creator examples and official storytelling
    - Supply-side revenue engine and content inventory
    - No public creator retention or cohort economics by tier
  - - Paying fans
    - Buyer=user=payer on demand side
    - Subscribe, tip, buy PPV and purchase chat interactions
    - Hundreds of millions of fan accounts in public summaries
    - Demand-side monetization base
    - No public active-paying-fan denominator or renewal curve
  - - Free OFTV viewers
    - User only; not necessarily payer
    - Consume safe-for-work creator video across app and TV surfaces
    - Apple App Store + OFTV site prove live distribution
    - Top-of-funnel brand and creator discovery surface
    - No public OFTV-to-paid conversion data
  - - Non-adult creator categories
    - Creator supply subset
    - Use OnlyFans/OFTV for fitness, comedy, music, cooking and creator-led entertainment
    - Official creator blog and OFTV app listing
    - Brand diversification and broader audience acquisition
    - No public revenue mix by category
  - - Celebrity / top creators
    - High-visibility supply segment
    - Drive attention, subscription demand and PPV economics
    - Pocket-lint cites celebrity accounts; 2026 estimates show severe income concentration
    - Can materially influence GMV and brand visibility
    - No official concentration disclosure for top earners
  notes: Rows separate economic roles across the marketplace; public evidence is strongest on creator-side proof and weakest on fan-side retention or concentration.
