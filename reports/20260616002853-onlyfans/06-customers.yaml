  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: active-paying-fans
    missingEvidence: Monthly active paying fans, renewal rates and chargeback-adjusted net paying cohorts.
    whyItMatters: Registered fan-account totals prove reach, but not recurring monetization quality or customer durability.
    diligencePath: Request monthly paying users, new-vs-renewing mix, chargebacks and cohort retention by region and creator tier.
  - type: private-evidence-only
    severity: material
    topic: creator-retention
    missingEvidence: Creator churn, reactivation, median tenure and cohort survivorship by creator size band.
    whyItMatters: Public sources strongly suggest supply-side churn and concentration risk, but cannot quantify how stable creator supply really is.
    diligencePath: Request creator survival curves, reactivation rates and revenue contribution by creator tenure cohort.
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Official top-creator concentration metrics for GMV, net revenue and payouts.
    whyItMatters: Power-law economics can make large top-line scale compatible with fragile customer concentration.
    diligencePath: Request top 1, 10, 100 and 1,000 creator shares of GMV, net revenue and payouts plus trend over time.
  - type: missing-source
    severity: material
    topic: fan-trust-and-satisfaction
    missingEvidence: Platform-level complaint rates, moderation appeals, refunds, trust surveys and post-Ofcom remediation data.
    whyItMatters: Adverse reporting proves trust risk exists, but not whether customer confidence is worsening or improving.
    diligencePath: Request complaint taxonomy, time-to-resolution, moderation error rates and trust / safety KPI trendlines.
  - type: enumeration-incomplete
    severity: material
    topic: TU003 named creator proof coverage
    missingEvidence: A broader and more current public roster of named creators with quantified outcomes across more categories than the few retained examples.
    whyItMatters: The named customer proof table establishes that creator-side public proof exists, but coverage is still partial and marketing-led rather than a complete customer census.
    diligencePath: Request internal creator case studies, category-level success stories, and updated public references with outcome metrics.
    relatedTableRefs:
    - TU003
