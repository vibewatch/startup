- id: named-customer-proof
  title: Named Customer Proof Exists, but It Is Mostly Creator-Side and Marketing-Led
  body: |-
    OnlyFans does have named public customer proof, but it is not balanced across the marketplace. The
    strongest examples sit on the creator side: OFTV launch materials named Cheri Fit, Yoga with Taz and
    Tennis Class with Adi as example programming, while Pocket-lint highlights celebrity accounts such as
    Cardi B and Bella Thorne. Official creator storytelling and the OFTV app listing add category proof for
    athletes, comedians, podcasters, home chefs and influencers. What is missing is equally important. The
    retained source set does not provide a comparable public roster of named paying-fan cohorts, brand-side
    advertisers, enterprise buyers, or audited creator case studies with quantified production outcomes.
    Public proof therefore demonstrates real creator activity and category breadth, but it remains closer to
    go-to-market evidence than to durable cohort or expansion evidence.
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU032
  - CU034
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-and-durability
  title: Durability Signals Exist, but Public Retention Math Is Thin and Indirect
  body: |-
    Public durability evidence is indirect. Third-party operating guides say successful creators increasingly
    depend on PPV and chat, while analytics vendors treat churn, LTV, ARPU and message performance as core
    metrics. That implies repeat behavior matters economically, but it does not prove OnlyFans-level cohort
    health. The strongest adverse durability signal is on the creator-supply side: Bambi argues acquisition
    costs are rising, creator lifespan is often only 14–18 months, and multihoming is increasingly standard.
    Public market pages also describe median creator earnings below $200 a month and extreme concentration in
    top creators, which makes the long-tail supply base look economically fragile. Critically, OnlyFans does
    not disclose GRR, NRR, renewal rates, active-paying-fan cohorts, or creator churn in retained public
    sources. The chapter can therefore support the existence of retention dynamics, but not quantify durable
    retention in underwriteable terms.
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU035
  - CU036
  - CU037
