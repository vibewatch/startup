  - TU004
- id: expansion-and-concentration-risks
  title: Expansion Potential Is Clear, but Concentration, Trust, and Regulatory Risk Remain Central
  body: |-
    OnlyFans clearly has room to expand by broadening category mix, onboarding more creators and converting
    more attention into higher-yield PPV or chat spending. Yet the public risk picture is unavoidable. A few
    modeled datasets point to severe creator-income concentration, and none of the retained public sources
    disclose what share of revenue sits with the top 10 or top 100 creators. Geography is also hard to
    underwrite because public country splits are based on proxies rather than official paid-user ledgers. On
    the trust side, Ofcom's fine shows that age-assurance and child-safety controls can become adoption and
    reputation issues, while Factually and Bambi point to persistent privacy, payment and burnout concerns.
    Those adverse signals matter because creator supply, fan trust and regulatory tolerance are mutually
    reinforcing. Expansion is plausible, but the public record still leaves concentration and durability as
    open underwriting risks.
  claimRefs:
