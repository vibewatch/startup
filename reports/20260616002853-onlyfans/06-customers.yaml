runDate: '2026-06-16'
company:
  name: OnlyFans
chapter:
  number: 6
  title: Customers
  summary: |-
    Public evidence supports OnlyFans as a globally scaled two-sided marketplace with millions of creator
    accounts and hundreds of millions of fan accounts, but the cleanest proof is top-line scale and named
    creator/category evidence rather than disclosed retention or concentration metrics. Customer durability is
    the weak point: public sources point to power-law creator economics, multihoming, churn, and trust/safety
    pressure, while leaving active-paying-fan counts, cohort retention and top-customer concentration private.
sections:
- id: buyer-user-payer-map
  title: Buyer, User, and Payer Map Across Creators, Fans, and Free Discovery Audiences
  body: |-
    OnlyFans has to be read as a two-sided marketplace, not a single customer bucket. On the supply side,
    creators are the economic customers because they choose whether to build pages, price subscriptions,
    push PPV offers and tolerate a 20% take rate in exchange for distribution and payment handling. On the
    demand side, fans are the paying end-users funding subscriptions, tips, pay-per-view purchases and paid
    messages. OFTV adds a third public-facing audience: free viewers consuming safe-for-work video that can
    broaden brand reach without entering the paid product. Public proof is much stronger for creator-side
    segmentation than for fan-side segmentation. Official and semi-official surfaces name athletes,
    comedians, fitness creators, musicians and celebrity accounts, while top-line fan totals are published as
    cumulative counts with little segmentation by payer type, geography or repeat-purchase behavior. That is
    enough to prove breadth, but not enough to cleanly underwrite value by segment.
  claimRefs:
  - CU001
  - CU004
  - CU010
  - CU011
  - CU013
  - CU014
  - CU030
  - CU034
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-scale-and-geography
  title: Adoption Scale Is Well Evidenced, but Geography and Active Usage Are Mostly Modeled
  body: |-
    The strongest public adoption evidence is scale, not clean cohort behavior. OnlyFans 2023 company
    messaging cited more than 220 million fans and more than 3 million creators, while FY2024-oriented
    market summaries and Variety coverage push the public baseline to roughly 4.63 million creator accounts
    and 377.5 million fan accounts. Those figures support a real global platform, but they also come with
    caveats. Independent stats pages explicitly warn that fan accounts are cumulative rather than unique
    active humans, and country splits are modeled from traffic or profile sampling rather than published by
    OnlyFans. Across those proxies, the US consistently appears as the dominant market by traffic or spend,
    with the UK, Mexico, Spain and Germany regularly cited as important follow-on markets. The right reading
    is therefore: the platform is large and global, but public geography and actives remain proxy-heavy.
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU015
  - CU026
