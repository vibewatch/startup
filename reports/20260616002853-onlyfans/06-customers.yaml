- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Impact
  - Diligence path
  rows:
  - - Broader non-adult creator categories
    - Official category breadth may not map to equally diversified revenue
    - Brand expansion can overstate economic diversification
    - Request GMV and creator-count mix by category and content type
  - - Creator growth at platform scale
    - Top-creator concentration is modeled but not officially disclosed
    - Revenue concentration may be much higher than public top-line scale implies
    - Request top 10/100 creator share of GMV, net revenue and payouts
  - - Global geography footprint
    - Country splits are proxy-based rather than official
    - Regional expansion quality and paid density remain hard to underwrite
    - Request paid users, creators and net revenue by top 10 markets
  - - Rising creator operating pressure
    - Higher acquisition costs and short creator lifespan can weaken supply durability
    - Marketplace supply may churn even while registered accounts keep growing
    - Request creator CAC support, onboarding drop-off and multihoming rates
  - - Trust / safety scrutiny
    - Regulatory and privacy concerns can reduce fan trust and payment tolerance
    - Adoption and processor access can be hurt by policy failures
    - Request chargeback trends, appeal outcomes, moderation staffing and post-Ofcom remediation evidence
  notes: Risks are framed as customer and revenue durability issues, not only as legal or PR concerns.
  claimRefs:
  - CU022
  - CU023
  - CU027
  - CU029
  - CU030
  - CU035
- id: TU006
  title: Public customer data gaps table
  columns:
  - Missing metric
  - Why it matters
  - Best public proxy available
  - Limitation
  - Exact diligence path
  rows:
  - - Active paying fans
    - Determines real monetization depth, not just registered accounts
    - Cumulative fan-account counts from market summaries
    - Registered accounts overstate active monetizers
    - Request active payers, monthly renewals and chargeback-adjusted net payers by month
  - - Creator retention
    - Determines supply durability and content continuity
    - Agency/vendor churn benchmarks and lifespan estimates
    - Third-party benchmarks are not OnlyFans cohorts
    - Request creator monthly churn, reactivation and top-decile tenure curves
  - - Top-creator concentration
    - Determines exposure to whales and celebrity accounts
    - 2026 modeled long-tail inequality estimates
    - No official revenue-share disclosure
    - Request GMV, revenue and payout concentration by top 1, 10, 100 and 1,000 creators
  - - Geographic paid density
    - Determines whether global scale is broad or shallow
    - Traffic and profile-based country proxies
    - Traffic and profile presence are not revenue density
    - Request users, creators, ARPPU and revenue by country
  - - Fan satisfaction / trust
    - Determines repeat-purchase and payment tolerance
    - Adverse reporting and trust commentary
    - No platform-level NPS or complaint-rate disclosure
    - Request complaints, refunds, moderation appeals and fraud / abuse trends over time
  notes: These are the denominators missing from public customer evidence; each row states the precise diligence request needed to convert scale proof into underwriteable durability proof.
  claimRefs:
  - CU015
  - CU024
  - CU027
  - CU031
  - CU035
