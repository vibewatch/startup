callouts:
- calloutType: strength
  title: Scale is real even if the denominators are messy
  body: |-
    The public record is more than sufficient to establish OnlyFans as a real global marketplace with millions
    of creator accounts and hundreds of millions of fan accounts, even though active-paying-user and retention
    denominators remain undisclosed.
  claimRefs:
  - CU002
  - CU003
  - CU033
- calloutType: risk
  title: Customer durability is the underwriting gap
  body: |-
    Public evidence proves breadth and visibility, but it also points to top-heavy creator economics,
    multihoming, churn, and trust/safety risk—while leaving the cohort and concentration data an investor
    would actually want entirely private.
  claimRefs:
