  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: processor contracts
    missingEvidence: Current payment-processor reserve terms, escalation triggers, and any content-policy side letters.
    whyItMatters: Public evidence shows payment tolerance can force product policy changes and working-capital shocks.
    diligencePath: Request processor contracts, reserve schedules, and board materials on payment contingency planning.
  - type: private-evidence-only
    severity: material
    topic: uk remediation
    missingEvidence: The full Ofcom remediation plan, internal owners, and proof of control changes after the fine.
    whyItMatters: The difference between a contained incident and a recurring enforcement cycle depends on remediation
      quality.
    diligencePath: Request Ofcom correspondence, remediation workplan, and internal audit evidence.
  - type: private-evidence-only
    severity: material
    topic: tax exposure
    missingEvidence: Current status of the VAT dispute, reserves booked, and worst-case liability analysis.
    whyItMatters: Adverse tax treatment could compress distributable cash and change normalized economics.
    diligencePath: Request outside-counsel memo, reserve schedule, and most recent finance-committee discussion.
  - type: private-evidence-only
    severity: material
    topic: governance depth
    missingEvidence: Board composition, committee structure, succession planning, and org depth for compliance/trust
      functions.
    whyItMatters: Public data suggests control concentration and limited direct headcount, but not the actual quality
      of oversight.
    diligencePath: Request board deck, org chart, and biographies for trust, compliance, legal, and treasury leads.
