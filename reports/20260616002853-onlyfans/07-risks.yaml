company:
  name: OnlyFans
chapter:
  number: 7
  title: Risks
  summary: 'OnlyFans’ risk stack is dominated by three linked exposures: UK child-safety enforcement that has already
    produced a £1.05 million Ofcom fine, payment-counterparty dependence that visibly drove the 2021 explicit-content
    ban reversal, and governance opacity around concentrated control, heavy dividends, and complex entity mapping.
    The business is highly cash generative, but the same evidence base shows that moderation, processor tolerance,
    and legal/tax interpretation can all transmit quickly into creator trust, liquidity, and valuation.'
sections:
- id: regulatory-trust-risk
  title: Regulatory and trust-stack risk
  body: 'OnlyFans now has a demonstrated UK enforcement problem rather than a hypothetical one. Ofcom escalated
    from a 2024 investigation into the platform’s age-verification measures to a £1.05 million fine in 2025 for
    inaccurate responses about age assurance. That matters because the Online Safety Act turns child-safety and
    illegal-content controls into continuing legal duties for services with significant UK users, not one-off PR
    issues. The Reuters-derived swissinfo reporting adds a second layer of risk: even if OnlyFans cites moderation
    outputs such as CyberTipline reports, outside experts still face structural limits in independently auditing
    creator-by-creator paywalled content. The result is a trust stack in which regulators, payment partners, and
    the public can all question whether the company’s controls are as strong as management claims, and a challenge
    on one front can quickly harden into a broader confidence problem.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR015
  - CR016
  - CR006
  - CR007
  - CR043
  tableRefs:
