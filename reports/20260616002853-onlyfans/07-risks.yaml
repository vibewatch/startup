- id: governance-model-risk
  title: Governance, model, and reporting risk
  body: 'OnlyFans combines exceptional cash generation with notable governance opacity. Public reporting says the
    business produced about $1.41 billion of FY2024 net revenue and $684 million of pretax profit, yet owner distributions
    remained enormous and the direct employee count cited at the reporting entity stayed strikingly low. Recent
    control appears concentrated in a single person following Leonid Radvinsky’s death, while UK registry pages
    also require careful entity mapping because company number 09740537 now surfaces as MONT FORT INVESTMENTS. None
    of those facts proves a control failure on its own, but together they raise diligence difficulty around succession,
    oversight depth, and the way future capital or M&A counterparties would get comfortable with the structure.
    The long-running VAT dispute adds a harder edge: it shows that even a highly profitable platform can still face
    legal interpretations that change what its unit economics really mean.'
  claimRefs:
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
