- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - UK enforcement escalation
    - New Ofcom case, formal notice, or child-safety sanction
    - Any new fine, legally mandated remediation, or named breach of Online Safety Act duties
    - Shift from monitor to red-flag; pause new capital unless governance rights improve
  - - Payment access tightening
    - Reserve requirement, payout delay, or processor/network policy change
    - Any public or privately disclosed processor restriction tied to harm-monitoring concerns
    - Re-underwrite downside with working-capital shock and creator churn stress
  - - Creator trust break
    - Abnormal cancellations, multihoming disclosures, or public creator revolt
    - Sustained creator payout complaints or another policy whiplash event
    - Assume lower retention and reduced platform bargaining power
  - - Tax-case loss
    - Adverse ruling on VAT treatment
    - Ruling that taxes gross user payments rather than commission economics
    - Cut valuation and liquidity assumptions; revisit dividend and reserve policy
  - - Control-person opacity
    - Delayed filings or inconsistent beneficial-ownership disclosures
    - Material gap between entity records and management narrative
    - Escalate legal diligence and demand enhanced information rights
  notes: These triggers are designed as monitorable thesis-break tests rather than broad management aspirations.
