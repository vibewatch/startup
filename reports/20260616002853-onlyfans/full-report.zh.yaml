      - number: '5.3'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              OnlyFans 没有公开暴露可与 API 平台相比的深层技术架构，因此证据最充分的运营模型是功能性的，而不是基础设施性的。公开证据指向双表面架构：一个 web-first
              的付费商业体验，以及一个用于适合应用分发的视频发现的独立 OFTV 层。付费平台内部，关键运营组件是创作者入驻与教育、订阅计费、聊天和 PPV 商品化、payout
              报告，以及年龄保障和内容审核等政策控制。供应商生态填补了一手公开文档没有覆盖的部分：流失仪表盘、消息表现、收入热力图和粉丝 LTV
              工具，都显示外部分析和代理运营软件被大量叠加在核心平台之上。这意味着平台具备可防守的工作流护城河——创作者能在一个平台上用多种方式变现——但也存在文档缺口：投资人能看到商业设计，却无法仅凭公开来源核验太多底层系统深度、API
