    sections:
      - number: '1.1'
        title: 身份、法律实体与商业模式
        blocks:
          - type: paragraph
            body: >-
              OnlyFans 更应被看作由英国法律实体 Fenix International Limited 运营的品牌化创作者支付平台，而不是一个简单的消费者 App 品牌。官方 Terms of Use
              是最干净的一手来源：条款确认运营方为 Fenix International Limited，注册办公室位于伦敦 9th Floor, 107
              Cheapside，并把平台核心经济互动界定为粉丝与创作者之间的订阅、按次付费销售和私信付款。独立材料和官方材料均指向 Tim Stokely 于 2016
              年创立公司。公开面向创作者的文案也支撑管理层希望投资人听到的更宽产品叙事：这是一个服务多类创作者的平台，不只是成人创作者平台。话虽如此，后续外部报道仍把成人内容视为重心，因此官方多元化叙事应被理解为战略定位，而非对核心历史业务的替代。
