      - number: '3.1'
        title: 格局：直接成人竞品、主流付费工具与商业相邻业务
        blocks:
          - type: paragraph
            body: >-
              OnlyFans 不应只拿直接成人内容订阅克隆产品来对标。真正的决策集合更宽。Fansly、FanCentro、JustForFans
              等成人导向替代品很重要，因为它们为最在意提现熟悉度、社区匹配或政策容忍度的创作者提供备用供给。Patreon、Substack、Ko-fi 等主流会员和 newsletter
              平台也很重要，因为它们让创作者以更低名义平台费或更强受众所有权来变现忠实受众。由发现驱动和由商业驱动的平台同样重要。TikTok Shop 把创作者变成视频和直播信息流里的商户，Linktree
              则显示创作者已经把大量流量推向站外零售和联盟转化。因此，竞争格局横跨直接替代品、相邻创作者工具和多平台经营工作流，而不是单一一对一的“最佳替代”对手。这个更宽框架至关重要，因为创作者常常同时组合多层变现，而不是按顺序切换。
