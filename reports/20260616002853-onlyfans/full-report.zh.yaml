              增加第三类面向公众的受众：免费观看适合工作场景视频的用户，能在不进入付费产品的情况下扩大品牌触达。公开证据对创作者侧分层远强于粉丝侧分层。官方和半官方表面点名运动员、喜剧演员、健身创作者、音乐人和名人账户，而顶层粉丝总数以累计计数披露，很少按付款方类型、地理或重复购买行为分层。这足以证明广度，但不足以按细分市场干净承销价值。
