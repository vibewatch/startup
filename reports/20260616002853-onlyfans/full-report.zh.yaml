            body: >-
              OnlyFans 现在面对的是已被证明的英国执法问题，而不是假设风险。Ofcom 从 2024 年对平台年龄验证措施的调查升级为 2025 年 £1.05M
              罚款，原因是公司就年龄保障给出不准确答复。这很重要，因为 Online Safety Act 将儿童安全和非法内容控制变成对拥有大量英国用户服务的持续法律义务，而不是一次性 PR 问题。Reuters 衍生的
              swissinfo 报道又增加第二层风险：即便 OnlyFans 引用 CyberTipline
              报告等审核产出，外部专家在独立审计逐个创作者的付费墙内容时仍存在结构性限制。结果是一个信任栈：监管机构、支付伙伴和公众都可能质疑公司控制措施是否像管理层声称的那样强；某一战线上的挑战也可能迅速硬化成更广泛的信心问题。
