      - number: '1.2'
        title: 领导层交接、所有权与治理可见度
        blocks:
          - type: paragraph
            body: >-
              概览里最重要的当前事实，是 2026 年的控制权转换。Keily Blair 在 Ami Gan 之后于 2023 年出任
              CEO；官方公告把她描述为重视信任与安全的运营者，并称她此前已在首席战略与运营岗位上塑造公司战略。注册记录随后显示，2026 年治理重置：Blair、Yekaterina Chudnovsky 和 James
              Sagan 于 2026 年 5 月成为董事，而 Companies House 记录 Leonid Radvinsky 在 2026 年 3 月去世后停止担任董事和 PSC。当前控制权似乎落在
              Chudnovsky 手中；PSC 登记显示，她持有 75% 或以上股份和投票权，并拥有董事任命权。公开材料没有给出完整董事会名单、委员会结构或 Architect Capital
              进入后的投资人权利包，因此治理可见度仍明显弱于所有权可见度。
