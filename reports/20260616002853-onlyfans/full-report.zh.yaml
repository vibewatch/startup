      - number: '3.2'
        title: 定价、打包与公开可见规模
        blocks:
          - type: paragraph
            body: >-
              价格本身不能决定竞争问题，但它解释了为什么 OnlyFans 必须靠转化和流动性取胜，而不是靠最低抽成率。OnlyFans 留存粉丝付款的 20%。Patreon 标准计划在支付处理和税费前收取
              10%。Substack 平台费也是 10%，但叠加 Stripe 和应用商店摩擦后，创作者实际成本会上升。Ko-fi 在某些用例里还能更便宜，免费层打赏为 0%，多数其他变现类型为
              5%。这些对手的打包方式也不同：Patreon 组合社区、newsletter 和一次性产品；Substack 优化订阅出版和作者自有受众；Ko-fi 混合打赏、商店、会员和委托。OnlyFans
              仍是这一对比组里公开可见的最大变现引擎，但其费率溢价意味着创作者必须相信平台转化更好、付款更可靠，也比替代方案更能容忍成人变现。
