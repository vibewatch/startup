              公开记录对 2024 年头部规模最强，对单位经济最弱。Variety 和 The Independent 在核心数字上相互吻合：约 $7.22B 粉丝总支付、$1.41B 净收入和 $684M
              税前利润。两者也一致指向用户基础——377.5M 个粉丝账户和 4.634M 个创作者账户——Variety 还补充了一个醒目细节：Fenix 自身只有 46
              名员工，并高度依赖承包商。这一组合说明，平台规模很大、运营上高度专门化，合并盈利能力强。但同一记录留下了最影响承销的单位经济问题：没有公开现金余额、跑道、分业务毛利率、创作者集中度、退款行为、CAC
              或回本数据。因此，公开证据支持规模和利润，却不足以完整建模成本栈的耐久性。
