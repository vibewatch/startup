      - number: '2.2'
        title: 规模测算视角：广义创作者经济与 OnlyFans 专属规模
        blocks:
          - type: paragraph
            body: >-
              可获得证据支持多个规模测算视角，而不是一个干净的 TAM。广义侧，Influencer Marketing Factory 报告把 2026 年美国创作者广告支出估为 $43.9B，并引用全球创作者人口到
              2032 年可能超过 1.1B 的说法。这些数字解释了为什么投资人仍高度关注。但创作者收入高度偏斜：多数创作者年收入仍低于 $10,000，只有少数超过
              $100,000，社交商务或联盟收入也已具备实质规模。OnlyFans 专属数字更具体，但窄得多。Variety 和衍生统计页面把 FY2024 绑定到 $7.22B 粉丝总支付、$1.41B
              净收入、4.634M 个创作者账户和 377.5M 个粉丝账户。地理估算进一步表明，美国主导流量和消费，创作者基础则集中但跨多国。这些数字可作为 SAM 讨论锚点，但仍是平台层面结果，而非完整成人创作者市场普查。
