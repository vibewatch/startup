      - number: '3.4'
        title: 护城河耐久性与合规、支付压力
        blocks:
          - type: paragraph
            body: >-
              OnlyFans 的护城河在对手最弱处最强：规模化闭环付费转化。公开数字显示，它拥有数十亿美元粉丝总支付和数亿注册粉丝账户；本材料包中没有来源能以同等可见度匹配。但规模不能消除风险。2021
              年试图禁止色情内容的事件，证明银行和提现压力能多快威胁成人创作者对平台的信任。Ofcom 2025 年罚款和 Online Safety Act
              又增加第二层压力，把年龄保障和报告治理变成硬性运营要求。Swissinfo 和 Mastercard 强化第三层：支付轨道和信任控制会塑造市场在法律和运营上能承受什么。由此得出的承销判断更细：OnlyFans
              有真实流动性和品牌优势，但创作者仍可多平台经营，发现仍可发生在别处，监管或支付冲击也仍可能比简单市场份额图所暗示的更快收窄护城河。
