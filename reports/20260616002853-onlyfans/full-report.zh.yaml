        title: 从创立到政策反转与继任的里程碑
        blocks:
          - type: paragraph
            body: >-
              公开里程碑主线，与其说是产品发布，不如说是平台合法性、内容政策压力和所有权变迁。2016 年创立与 Radvinsky 2018 年收购奠定了法律和所有权基础。下一个关键节点发生在 2021 年 8
              月：公司在银行和支付合作伙伴压力下试图禁止露骨性内容，但创作者反弹后数日内又撤回。该事件仍具战略意义，因为它暴露出即使创作者需求强劲，业务也高度依赖支付基础设施。后续里程碑更多由治理和合规驱动：Blair
              2023 年出任 CEO，Ofcom 2024 年调查并于 2025 年因年龄保障披露不准确罚款，2025 年提交强劲的 FY2024 账目，最后是 2026 年继任与融资重置——Chudnovsky
              成为可见控制人，Architect Capital 买入少数股权。
