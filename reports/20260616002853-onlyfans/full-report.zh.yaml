companyProfile:
  summary: >-
    OnlyFans 是一家总部在伦敦的创作者支付平台，由 Fenix International Limited 运营，让创作者靠订阅、按次付费媒体、打赏和私信互动变现，并保留 80% 收入。公司由 Tim Stokely 于
    2016 年创立，后来由 Leonid Radvinsky 控制；作为私营平台，它做到少见规模，2026 年又重置了所有权叙事：Yekaterina Chudnovsky 成为可见的重大控制人，Architect Capital
    买入 16% 少数股权。公开备案和报道显示，这是一个利润异常丰厚的创作者市场，但平台仍背着监管、支付交易对手和治理风险；这些风险对投资判断的重要性不亚于增长和利润本身。
