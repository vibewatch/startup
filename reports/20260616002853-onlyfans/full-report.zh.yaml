  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、交易机制与变现可见度
        blocks:
          - type: paragraph
            body: >-
              承销 OnlyFans，首先应把它看作支付与抽成率平台，而不是标准 SaaS
              厂商。最强公开来源是条款页：它把创作者互动定义在订阅、按次付费内容和私信付款周围，说明订阅除非取消否则自动续订，并明确创作者自行设定月价。官方面向创作者材料随后补上关键经济分成：创作者保留 80% 收入，平台拿
              20%。这些事实确立了基础收入引擎，但没有证明收入质量。公开来源仍未拆分 2024 年净收入中订阅、PPV 和消息各占多少，也没有提供实际
              ARPU、创作者集中度或拒付数据。新战略层是创作者金融服务；Architect 和管理层称，现在希望在现有交易流之上搭建这层服务。官方博客表面也显示，当前营销重点放在运动员、喜剧演员、OFTV
              人才和免费账户上，支撑管理层关于多元化旨在扩大变现、但不改变底层支付机制的说法。
