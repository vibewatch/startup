      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              OnlyFans
              的分层结构不同于多数软件市场，因为经济买方分散在创作者和粉丝两端。创作者是准商户，决定是否入驻、如何定价，并接受平台的提现和合规负担。粉丝是经常性付款方，实际出资购买订阅、私信和按次付费内容。代理机构、会计和创作者经理人作为工作流放大器也很重要，因为他们能为较大账号专业化入驻、提现和内容运营。OFTV
              和更宽品类扩张同样重要，因为它们帮助创作者吸引主流受众；但变现强度最高的细分市场，仍是粉丝愿意反复付费互动的地方。该结构也解释了为什么社交商务和联盟变现构成替代：当订阅付费墙对某一受众组合而言过于高风险、监管过重或过于小众时，创作者可以把注意力导向摩擦更低的零售、店铺或站外商业。
