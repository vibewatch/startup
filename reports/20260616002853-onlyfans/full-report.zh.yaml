  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              对创作者而言，OnlyFans 是一套可变现的直达粉丝工作流，而不是泛社交信息流。核心产品让创作者把照片、视频和聊天报价放在经常性订阅之后，同时也能靠一次性按次付费内容、打赏和一对一私信变现。官方 About
              页面把它描述为围绕直接创作者—粉丝关系搭建的订阅社交平台；Pocket-lint 与 OnlyFans Statistics
              则显示，经济栈不止订阅。关键工作流差异在于，发现、转化和变现被拆在不同表面：创作者用付费网页平台做商业和关系管理，OFTV
              则给公司一个适合工作场景的发现表面，可进入应用商店和电视生态。这种分离有战略意义，因为它扩大品牌触达，又不会把付费产品压进主流应用商店政策模型。
