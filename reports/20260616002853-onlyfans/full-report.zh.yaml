      - number: '2.4'
        title: 增长驱动、监管约束与承销缺口
        blocks:
          - type: paragraph
            body: >-
              OnlyFans 最强增长驱动不是一张泛化 TAM 图，而是创作者经济扩张、粉丝已证明的付费意愿，以及一个已经做到数十亿美元规模的闭环提现模型。最大约束同样具体。Ofcom 罚款和 Online Safety
              Act 显示，成人内容平台持续承担年龄保障、报告和儿童安全义务，主流创作者工具并不承受同等程度的负担。Swissinfo 和 CBS
              也强化了这一点：付费墙内的成人生态很难被外部审计，因而抬高审查风险。同样重要的是，2021 年色情禁令事件说明，银行和支付合作伙伴可以通过威胁分发或提现连续性来突然重塑市场。这意味着投资人应把 OnlyFans
              看成一个耐久但受监管敏感的现金流平台：公开数据对历史平台产出很强，对真实成人市场广度较弱，对支付轨道决策如何重塑供给、政策或创作者继续集中于单一平台的意愿最弱。
