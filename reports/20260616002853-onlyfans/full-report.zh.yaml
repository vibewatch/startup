      - - 战略可选性论点：Architect 可能把业务扩展到服务银行覆盖不足创作者的金融服务
        - 只有在披露新产品采用、附加率或收入后，论点才会增强
      - - 反论点：监管和支付污名限制倍数扩张
        - 只有连续多年合规记录干净且支付伙伴支持稳定后，压力才会缓解
      - - 反论点：高额分红和集中控制降低少数股权吸引力
        - 治理权更强、独立监督到位、结构披露更清晰后，压力才会缓解
      - - 反论点：替代品压住终局价值
        - 如果 OnlyFans 证明自己掌握的不只是订阅，而是更多创作者工作流，论点会削弱
    notes: 这些论点把当前公开估值证据与第 7 章的下行地图合在一起。
    claimRefs:
      - CV016
      - CV027
      - CV035
      - CV028
      - CV029
      - CV043
  - id: TV003
    title: 牛市 / 基准 / 熊市场景表
    columns:
      - 情景
      - 关键假设
      - 估值区间
      - 概率信号
      - 下行 / 上行逻辑
    rows:
      - - 牛市
        - 合规干净、支付通道稳定，创作者金融科技附加清晰可见
        - $4.0B-$4.5B
        - 需要新产品证据，且没有新的监管事件
        - 如果可选性转化为收入，倍数可高于当前锚点
      - - 基准
        - FY2024 盈利能力延续，但污名和治理悬顶仍在
        - $3.0B-$3.3B
        - 新近公开交易已经在这里出清
        - 当前少数股权价格仍是最佳公开标记
      - - 熊市
        - 监管成本上升、处理商收紧、治理权继续偏弱
        - $2.0B-$2.5B
        - 任何新的 Ofcom 或支付冲击都会迅速推向这里
        - 折价反映经风险调整的现金流和结构顾虑
      - - 上行结构化交易
        - 业务质量相同，但带清算优先权 / 下行保护
        - 与头条估值相同或略高
        - 需要条款支撑，而不只是公司表现
        - 结构化资本可以提升投资者 IRR，无需证明普通股价值更高
    notes: 区间是基于公开证据的情景带，不是管理层指引或 DCF 输出。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV037
      - CV041
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态
      - 估值 / 定价
      - 规模指标
      - 相关性
      - 局限
    rows:
      - - OnlyFans
        - 私募少数股权轮（2026）
        - $3.15B 换 16% 股权
        - $1.41B FY2024 净收入；$684M 税前利润
        - 直接标的，也是最新公开定价点
        - 权利、优先权和具体交易条款未公开
      - - Patreon
        - 私有
        - ~$4.0B
        - 2025 年收入约 $179M（Sacra 估计）
        - 最接近的干净创作者订阅可比公司，收入具备经常性
        - 未审计估算，内容 / 监管画像差异很大
      - - Substack
        - 私有
        - 2025 轮约 $1.1B
        - 5M+ 付费订阅；35M+ 活跃订阅
        - 体现更干净支付和自有受众经济的价值
        - 形式和变现栈不同于粉丝订阅式成人内容
      - - Fansly
        - 私有成人垂直平台
        - 无有力公开估值
        - 头条 20% 费率，成人创作者工具集
        - 最直接的成人定价可比对象
        - 缺少可靠公开财务规模或交易基准
      - - JustForFans / FanCentro
        - 私有成人垂直平台
        - 无有力公开估值
        - 80-85% 分成 / 月度打款节奏
        - 可用于创作者分成和垂直竞争框架
        - 公开财务数据稀疏，不能作为干净估值可比对象
    notes: OnlyFans 行使用公开交易和 FY2024 指标；同业行混合了分析师估算、官方定价和公开融资摘要。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Exhaustive set of the five public/private creator-platform comparables explicitly used in this chapter’s
        valuation discussion.
    claimRefs:
      - CV002
      - CV009
      - CV010
      - CV019
      - CV020
      - CV021
      - CV022
      - CV024
      - CV026
      - CV025
  - id: TV005
    title: 投资论点破裂与止损触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 新的英国执法或新的重大信任与安全处罚
        - 任何新罚款、正式整改令，或类似境外行动
        - 打破「2025 年事件已经被控制」这一判断
        - 将承销推向熊市区间，并要求更强结构
      - - 支付通道限制
        - 公开披露的准备金、处理商退出或卡组织限制
        - 同时削弱流动性和创作者信任
        - 立即重切估值和营运资本假设
      - - 看不到创作者金融科技采用证据
        - 12 个月内没有披露牵引力或产品经济性
        - 抹去很大一部分战略上行叙事
        - 把业务当作成熟现金流平台，而不是期权丰富的增长资产
      - - 治理权仍然偏弱
        - 未向新投资者提供有意义的信息权或下行保护
        - 同样的头条价格对少数股东更不具吸引力
        - 要求更低入场价，否则放弃
      - - 创作者或粉丝互动显著转弱
        - 创作者新增、粉丝活跃或打款吞吐量显著下降
        - 挑战流动性护城河论点
        - 重审竞争假设和终局价值
    notes: 这些触发项用于新交易承销，不只是管理层运营 KPI。
    claimRefs:
      - CV028
      - CV029
      - CV036
      - CV041
      - CV027
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构和优先权
        - 2026 年交易中的具体清算优先权、反稀释条款和投资者权利
        - 缺少结构细节时，头条估值可能误导
        - 索取法律文件和条款清单
      - - 审计利润率桥
        - FY2024 净收入背后的毛利率、打款处理成本和现金转化细节
        - 需要判断公开标记按正常化利润看是便宜还是偏满
        - 索取审计账目和财务备忘录
      - - Architect 交易经济性
        - Architect 的董事会权、信息权和任何下行保护
        - 对任何后续少数股权投资者都是关键可比
        - 索取附函摘要或股东协议
      - - 创作者金融科技产品牵引力
        - 任何新金融服务产品的采用、收入和损失率数据
        - 区分真实上行和叙事可选性
        - 索取产品 KPI 材料和试点经济性
      - - 监管整改状态
        - 罚款后控制措施已实质改善的证据
        - 更干净的合规轨迹可能支撑更高估值置信度
        - 索取 Ofcom 整改包和信任指标
      - - 互动和流失分群
        - 创作者留存、粉丝消费留存和多平台经营指标
        - 仅靠账户数无法证明变现耐久
        - 索取分群材料和订阅留存分析
    notes: 要把公平的公开锚点变成更强投资建议，这些问题是最低限度的新增证据。
    claimRefs:
      - CV041
      - CV036
      - CV028
      - CV037
