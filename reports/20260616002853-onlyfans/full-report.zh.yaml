      - number: '1.3'
        title: 规模、估值信号与公司状态快照
        blocks:
          - type: paragraph
            body: >-
              OnlyFans 现在已有可信的公开规模指标，尽管披露的治理细节仍远少于上市公司。Variety 对 2024 年年报的报道与 The Independent 的跟进文章在最大经营数字上相互吻合：377.5M
              个粉丝账户、4.634M 个创作者账户、2024 年粉丝总支付超过 $7B，以及 46
              名直接雇员加上更大的承包商基础。在公司概览语境下，这些数字最重要的意义，是证明平台在没有广泛公开市场式透明度的情况下做到了全球规模。当前最干净的市场价值信号，是 2026 年 5 月 Architect
              Capital 交易：其以 $535M 定价公司 16% 股权，隐含估值 $3.15B。InforCapital 更进一步称该轮为首次外部融资，但该说法应保持中等置信度，因为已审阅的主流媒体并未直接这样表述。
