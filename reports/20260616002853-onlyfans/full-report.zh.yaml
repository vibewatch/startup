  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻变现路径
        blocks:
          - type: paragraph
            body: >-
              OnlyFans 不应被视为整个创作者经济的代理变量。大背景确实存在：2026 Creator Economy Report 描述了由软件、金融、广告和商业工具支撑的创作者主导企业市场，Linktree 和
              ClickAnalytic 也显示，如今大量发现和购物活动已发生在直接订阅之外。但 OnlyFans 变现的是更窄的一层。其条款显示，产品围绕订阅、按次付费解锁、私信购买和平台管理的提现搭建。OFTV
              和更宽创作者类别之所以重要，是因为它们扩大漏斗顶部；但这些相邻业务没有改变一个事实：OnlyFans
              仍依赖在受控付费墙内把粉丝转化为付费用户。因此，市场边界包括付费粉丝转化、创作者入驻和提现、审核或合规基础设施；它排除大多数广告技术支出、开放社交流量，以及全球范围内今天从未触达成人付费内容的更广泛创作者软件。
