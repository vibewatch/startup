            body: >-
              信任与安全不是 OnlyFans 的边缘议题；它们是核心产品依赖。OnlyFans 条款暴露出一个政策异常重的平台栈，包括可接受使用、粉丝—创作者合同、投诉和申诉政策；SirenCY 的 2026
              年政策摘要则指向收紧的 deepfake 和合成媒体限制。Ofcom 调查和后续罚款提供了最硬的产品风险证据：Fenix 曾告诉监管机构，面部年龄估算会在年龄 23 岁时触发挑战，但实际设置自 2021
              年底以来一直是 20 岁；Ofcom 认定公司未能就儿童安全控制提供准确信息。独立报道和法律分析又增加两层风险。Terms.Law 认为创作者向平台授予广泛且持久的权利，CBS
