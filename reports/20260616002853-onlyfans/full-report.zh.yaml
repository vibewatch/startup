      - number: '3.3'
        title: 成人平台动态与创作者保留备用选项的原因
        blocks:
          - type: paragraph
            body: >-
              直接成人平台集合，最好理解为经营风险对冲，而不是一组透明公开可比公司。Fansly 帮助中心重点覆盖提现方式、收入统计、订阅机制和税表。FanCentro
              可访问支持页面也围绕收入和付款展开。JustForFans 通过明确的 LGBTQ 和 kink 定位，以及宣称 80–85% 的 payout 来差异化。这些公开表面都无法提供与 OnlyFans
              的干净规模对比，但合在一起说明，成人创作者不会只看费率表来做平台选择。他们在意成人内容是否受欢迎、资金周转多快、身份和税务文书是否顺畅，以及是否存在小众社区。该设置自然鼓励多平台经营。创作者可以把
              OnlyFans 作为最大收入引擎，同时在其他地方保留备用分发或小众变现，以防政策、提现或受众行为变化。实践中，这意味着竞争压力往往表现为冗余和组合行为，而不是一次干净的全平台替换事件。
