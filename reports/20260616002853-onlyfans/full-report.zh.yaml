            body: >-
              对 OnlyFans 的财务判断同时强劲又不完整。强劲在于，公开记录支持一个规模巨大、利润真实且具备显著分红能力的业务。不完整在于，同一公开记录显示合规和负债风险很重要，恰恰因为平台上流动的现金太多。Ofcom
              £1.05M 罚款、Sky News 描述的历史 VAT 争议，以及支付相关非法内容指控，都可能影响准备金、伙伴风险和估值容忍度，即便它们尚未抹去盈利能力。底线是，OnlyFans
              看起来财务实力足以支撑数十亿美元私有估值并吸引战略资本，但在现金、准备金政策、收入组合和治理条款上仍过于不透明；若没有管理层尽调材料，它还无法达到完整机构承销标准。独立审查也异常困难，因为大量创作者内容位于个人付费墙之后，削弱外部核验安全问题普遍性的能力，也强化了直接尽调的必要性。同样的缺口也适用于英国在线安全合规准备金的确切处理方式。
