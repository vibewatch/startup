      - number: '1.5'
        title: 监管、税务与声誉悬顶风险
        blocks:
          - type: paragraph
            body: >-
              如果不放入负面背景，OnlyFans 的公司概览就是不完整的，因为外部风险面对投资故事异常重要。Ofcom 罚款不是一个小技术问题：监管机构称 Fenix
              就年龄保障阈值提供了不准确信息，发现错误后披露过慢，且只因接受调查结论并和解才获得折扣。Sky News 还记录了一场长期英国 VAT 争议，潜在税务负债可能超过 £11M。另有经 CBS 转述的 Reuters
              相关报道，围绕 Mastercard 和 Visa 的 FinCEN
              举报人投诉，把非法内容付款指控持续留在公众视野。上述事项都不能推翻公司的规模或盈利能力，但合在一起说明，单靠少数股权估值还不足以承销监管韧性、处理商抗压能力或金融交易对手的声誉容忍度。
