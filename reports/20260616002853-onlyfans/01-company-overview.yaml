- id: leadership-and-control
  title: Leadership transition, ownership, and governance visibility
  body: 'The most important current-fact set in the overview is the 2026 control transition. Keily Blair became CEO in 2023 after Ami Gan, and the official announcement positioned her as a trust-and-safety-oriented operator who had already been shaping strategy from the chief strategy and operations role. Registry records then show a 2026 governance reset: Blair, Yekaterina Chudnovsky, and James Sagan appeared as directors in May 2026, while Companies House records Leonid Radvinsky’s cessation as both director and PSC after his March 2026 death. Current control now appears to sit with Chudnovsky, who holds 75% or more of shares and voting rights plus director-appointment rights according to the PSC register. What the public pack does not provide is a full board roster, committee structure, or investor-rights package after Architect Capital’s entry, so governance visibility remains materially weaker than ownership visibility.'
