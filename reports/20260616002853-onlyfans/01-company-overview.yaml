company:
  name: OnlyFans
chapter:
  number: 1
  title: Company Overview
  summary: 'OnlyFans is a UK-operated creator-payments platform founded in 2016 and run through Fenix International Limited, with Keily Blair as CEO and Yekaterina Chudnovsky now visible as the controlling shareholder after Leonid Radvinsky’s death in 2026. Public scale is unusually large for a still-private business: FY2024 coverage points to 377.5 million fan accounts, 4.634 million creator accounts, and more than $25 billion of cumulative creator payouts, while the May 2026 Architect Capital transaction implied a $3.15 billion valuation. The main overview caveats are incomplete board and capital-structure disclosure plus material regulatory, tax, and payment-partner overhangs that remain central to diligence.'
sections:
- id: identity-and-legal-structure
  title: Identity, legal entity, and business model
  body: 'OnlyFans should be framed as a branded creator-payments platform operated through the UK legal entity Fenix International Limited rather than as a simple consumer app brand. The official Terms of Use are the cleanest primary source: they identify Fenix International Limited as the operator, place the registered office at 9th Floor, 107 Cheapside in London, and define the platform’s core economic interactions as subscriptions, pay-per-view sales, and direct-message payments between fans and creators. Independent and official material align on the 2016 founding by Tim Stokely. Public creator-facing copy also supports the broader product narrative that management wants investors to hear: a platform for many creator categories, not just adult creators. That said, later external coverage still treats adult content as the center of gravity, so the official diversification story should be read as strategic positioning rather than a replacement for the core historical business.'
