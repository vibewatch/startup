- id: scale-valuation-and-corporate-state
  title: Scale, valuation signal, and corporate-state snapshot
  body: 'OnlyFans now has credible public scale indicators even though it still discloses far less governance detail than a public company would. Variety’s 2024 annual-report coverage and The Independent’s follow-on piece align on the biggest operating numbers: 377.5 million fan accounts, 4.634 million creator accounts, 2024 gross fan payments above $7 billion, and only 46 direct employees supported by a larger contractor base. In the company-overview context, those numbers matter mostly as proof that the platform reached global scale without broad public-market-style transparency. The cleanest current market-value signal is the May 2026 Architect Capital deal, which priced 16% of the company at $535 million and implied a $3.15 billion valuation. InforCapital goes further and calls that round the first external capital raise, but that claim should stay medium confidence because the reviewed mainstream press does not state it as directly.'
