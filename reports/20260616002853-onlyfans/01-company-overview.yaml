  body: 'OnlyFans’ 2021 explicit-content reversal, 2025 Ofcom fine, VAT dispute history, and illegal-content payment allegations all point to the same structural issue: the platform’s growth depends on financial and regulatory counterparties that can impose costs or policy constraints well before demand weakens.'
