  body: 'The clearest 2026 shift is not product but governance: Radvinsky died, Chudnovsky became the PSC, new directors appeared in Companies House, and Architect Capital bought a minority stake. That means diligence should separate succession and control mechanics from the still-familiar platform economics and creator-supply model.'
  claimRefs:
