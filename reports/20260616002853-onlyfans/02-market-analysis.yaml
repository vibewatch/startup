- id: buyer-user-payer-structure
  title: Buyer, user, and payer segmentation
  body: 'OnlyFans has a different segmentation structure from most software markets because the economic buyer is fragmented across creators and fans. Creators are the quasi-merchants who decide whether to onboard, set prices, and accept the platform’s payout and compliance burden. Fans are the recurring payers who actually fund subscriptions, direct messages, and pay-per-view purchases. Agencies, accountants, and creator managers matter as workflow multipliers because they can professionalize onboarding, payouts, and content operations for larger accounts. OFTV and broader genre expansion matter because they help creators attract mainstream audiences, but the most monetization-intensive segment still sits where fans will tolerate repeated paid interactions. That structure also explains why social-commerce and affiliate monetization are substitutes: creators can redirect attention toward lower-friction retail, storefront, or off-platform commerce when a subscription paywall is too risky,
    too regulated, or too niche for their audience mix.'
  claimRefs:
  - CM008
  - CM009
