- id: sizing-lenses-and-concentration
  title: 'Sizing lenses: broad creator economy versus OnlyFans-specific scale'
  body: 'The accessible evidence supports multiple sizing lenses rather than one clean TAM. On the broad side, the Influencer Marketing Factory report puts U.S. creator ad spend at $43.9 billion in 2026 and cites a global creator population that could surpass 1.1 billion by 2032. Those numbers show why investor attention remains high. But creator income is highly skewed: most creators still earn under $10,000 a year, only a small minority top $100,000, and social-commerce or affiliate income is already material. OnlyFans-specific numbers are much more concrete but much narrower. Variety and the derivative statistics page tie FY2024 to $7.22 billion in gross fan payments, $1.41 billion in net revenue, 4.634 million creator accounts, and 377.5 million fan accounts. Geography estimates further suggest the United States dominates traffic and spend while the creator base is concentrated but multinational. These are useful anchors for a SAM discussion, but they are still platform-level outcomes,
    not a full adult-creator market census.'
