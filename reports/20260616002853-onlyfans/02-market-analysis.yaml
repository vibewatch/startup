tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Core paid-fan subscriptions
    - Recurring creator subscriptions, renewals, wallet-funded fan payments
    - Brand advertising, open-social reach, creator tools that do not process fan payments
    - Creator chooses platform; fan pays
    - Closest fit to OnlyFans core monetization model
  - - Pay-per-view and direct messages
    - Paid unlocks, messages, tips, and one-off content interactions
    - General creator merch revenue processed elsewhere
    - Creator chooses format; fan pays per interaction
    - Important incremental monetization layer inside the same wallet relationship
  - - Creator onboarding and payouts
    - Identity checks, payout setup, tax handling, chargeback and refund management
    - Standalone payroll or fintech products that do not tie to fan transactions
    - Creator and platform share workflow costs
    - Critical because adult-creator supply depends on being able to get onboarded and paid
  - - Safe-for-work discovery adjacencies
    - OFTV and promotional surfaces that help creators attract audiences to paid pages
    - Most mainstream open-social impressions that never convert into paid fan actions
    - Creator and platform share interest; fan attention is the input
    - Relevant as feeder traffic, not the direct economic core
  - - Creator commerce and affiliate substitutes
    - Affiliate links, storefronts, retail and brand-commerce actions
    - Pure ad-tech or enterprise software budgets
    - Creator decides; shopper pays merchant
    - Competes for creator effort and audience conversion
  - - Adult-platform compliance layer
    - Age verification, moderation, regulator reporting, payments compliance
    - General content software with no adult-content exposure
    - Platform operator bears direct burden
    - Defines why OnlyFans is narrower and harder than broad creator software
  notes: Rows separate broad creator-economy activity from the narrower paid-fan, payout, and compliance stack that OnlyFans actually monetizes.
