  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: deal terms
    missingEvidence: Exact rights, preferences, downside protections, and board terms in the 2026 Architect transaction.
    whyItMatters: Minority economics can differ materially from headline equity value.
    diligencePath: Request term sheet, side letters, and shareholder-rights summary.
  - type: private-evidence-only
    severity: material
    topic: margin bridge
    missingEvidence: Detailed audited bridge from gross payments to net revenue, gross margin, EBITDA, cash conversion,
      and reserve policy.
    whyItMatters: Determines whether the 2026 valuation is cheap, fair, or expensive on normalized earnings.
    diligencePath: Request audited statements plus finance memo reconciling creator payouts, processing costs, and
      tax impacts.
  - type: private-evidence-only
    severity: material
    topic: creator-fintech economics
    missingEvidence: Adoption, unit economics, default/loss rates, and attach rates for any new financial-services
      products.
    whyItMatters: Without product economics, strategic upside remains narrative rather than underwritable value.
    diligencePath: Request product KPI dashboard, pilot results, and credit-policy materials.
  - type: private-evidence-only
    severity: material
    topic: retention cohorts
    missingEvidence: Creator and fan retention cohorts, multihoming rates, and spend durability beyond account totals.
    whyItMatters: Valuation multiples depend on durable monetization, not just large cumulative account numbers.
    diligencePath: Request cohort deck segmented by creator size, geography, and product mix.
