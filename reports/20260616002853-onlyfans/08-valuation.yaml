- id: what-supports-price
  title: What supports the price
  body: 'OnlyFans has two unusual strengths relative to creator-platform peers: scale and cash generation. The platform
    reported roughly 4.634 million creator accounts, 377.5 million fan accounts, and more than $25 billion of cumulative
    payouts, which makes it a real liquidity hub rather than a thin marketplace. The financial profile also matters.
    Heavy dividends and a large cash balance suggest the business is already producing cash for owners, not simply
    promising future monetization. Those traits make the current valuation easier to defend than a typical high-growth
    private software multiple would be. They also explain why the best comparable is not a niche adult rival alone.
    OnlyFans should be evaluated against broader creator-subscription platforms such as Patreon and Substack while
    still recognizing that its absolute scale is much larger. The valuation argument in favor of the company is
    therefore simple: a dominant, profitable, cash-yielding network can deserve a durable premium to smaller peers
    even without an IPO narrative.'
  claimRefs:
  - CV011
  - CV012
  - CV013
  - CV016
  - CV027
  - CV019
  - CV021
  tableRefs:
  - TV004
  figureRefs:
  - FV002
- id: what-caps-price
  title: What caps the price
  body: 'The reason OnlyFans does not automatically deserve a much higher value is not scale; it is risk quality.
    The Ofcom fine is direct evidence that regulatory issues are no longer hypothetical, while the 2021 banking-driven
    policy reversal still warns that payment tolerance can shape product policy and creator trust. Governance also
    matters: the company paid out extraordinary dividends, control remains concentrated, and public disclosure does
    not reveal the rights or protections attached to the 2026 minority investment. Those factors make the same headline
    valuation less attractive for a plain minority investor than for a strategic or structured buyer. Peer comparisons
    reinforce the point. Patreon appears to trade on a much richer revenue multiple despite far smaller revenue
    because its content and payments profile is cleaner. Substack, too, benefits from standard rails and lower stigma.
    The public market-clearing price therefore looks like a valuation that already embeds a discount for regulation,
    governance, and terminal-value uncertainty.'
  claimRefs:
  - CV028
  - CV029
  - CV041
  - CV033
  - CV034
  - CV007
  tableRefs:
  - TV003
  - TV005
  figureRefs:
  - FV003
- id: scenarios-and-final-diligence
  title: Scenarios, upside optionality, and final diligence asks
  body: 'The fresh public price should remain the base case until proven otherwise. A bull case above $4 billion
    requires two things the public record does not yet provide: clean multi-year compliance evidence and proof that
    Architect’s creator-fintech vision can monetize beyond the legacy 20% take-rate business. A bear case around
    $2.0-2.5 billion becomes plausible if regulation worsens, processors tighten terms, or new investors cannot
    secure governance or downside protection. That framework leads to a practical diligence agenda. Investors need
    audited margin detail, the 2026 deal’s real preference stack and rights, evidence of remediation after the Ofcom
    fine, and cohort retention data that can show whether creator liquidity is as durable as the account totals
    suggest. Without that package, the correct stance is to respect the public anchor but avoid paying above it
    on narrative alone, especially in an ordinary minority round.'
  claimRefs:
  - CV035
  - CV036
  - CV038
  - CV039
