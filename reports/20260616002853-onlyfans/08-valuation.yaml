- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - 'Scale + profitability thesis: OnlyFans is unusually profitable and liquid for a creator platform of this
      size'
    - Would weaken if audited filings showed lower normalized earnings or material off-balance-sheet obligations
  - - 'Network-effects thesis: 4.6M creators and 377.5M fans create a liquidity moat in paid fan subscriptions'
    - Would weaken if creator churn or fan engagement proved much lower than account counts suggest
  - - 'Strategic-optionality thesis: Architect could expand into financial services for under-banked creators'
    - Would strengthen only with disclosed product adoption, attach rates, or revenue from new services
  - - 'Anti-thesis: regulatory and payment stigma limits multiple expansion'
    - Would ease only after a multi-year record of clean compliance and stable payment-partner support
  - - 'Anti-thesis: heavy dividends and concentrated control reduce minority appeal'
    - Would ease with stronger governance rights, independent oversight, and cleaner structure disclosure
  - - 'Anti-thesis: substitutes cap terminal value'
    - Would weaken if OnlyFans proved it can own more of creator workflow than subscriptions alone
  notes: Arguments combine current public valuation evidence with the downside map from chapter 7.
  claimRefs:
  - CV016
  - CV027
  - CV035
  - CV028
  - CV029
  - CV043
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation range
  - Probability signal
  - Downside / upside logic
  rows:
  - - Bull
    - Clean compliance, stable payment rails, and visible creator-fintech attach
    - $4.0B-$4.5B
    - Needs new product proof plus no fresh regulatory events
    - Multiple can expand above current anchor if optionality becomes revenue
  - - Base
    - FY2024 profitability sustains, but stigma and governance overhang persist
    - $3.0B-$3.3B
    - Fresh public transaction already cleared here
    - Current minority price remains the best public mark
  - - Bear
    - Regulatory costs rise, processors tighten, and governance rights stay weak
    - $2.0B-$2.5B
    - Any new Ofcom or payments shock would push here quickly
    - Discount reflects risk-adjusted cash-flow and structure concerns
  - - Upside structured deal
    - Same business quality, but with liquidation preference / downside protection
    - Same headline or slightly above
    - Requires terms, not just company performance
    - Structured capital can improve investor IRR without proving higher common-equity value
  notes: Ranges are public-evidence scenario bands, not management guidance or DCF outputs.
