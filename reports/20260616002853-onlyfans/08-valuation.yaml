    - $1.41B FY2024 net revenue; $684M pretax profit
    - Direct subject and freshest public pricing point
    - Rights, preferences, and exact deal terms are not public
  - - Patreon
    - Private
    - ~$4.0B
    - ~$179M 2025 revenue (Sacra est.)
    - Closest clean creator-subscription comp with recurring revenue
    - Unaudited estimate and very different content / regulatory profile
  - - Substack
    - Private
    - ~$1.1B 2025 round
    - 5M+ paid subscriptions; 35M+ active subscriptions
    - Shows value of cleaner payments and owned-audience economics
    - Different format and monetization stack than fan-subscription adult content
  - - Fansly
    - Private niche adult platform
    - No strong public valuation
    - Headline 20% fee, adult-creator toolset
    - Most direct adult-pricing comp
    - No reliable public financial scale or transaction benchmark
  - - JustForFans / FanCentro
    - Private niche adult platforms
    - No strong public valuation
    - 80-85% payout / monthly payout cadence
    - Useful for creator payout and niche competition framing
    - Not clean valuation comps because public financial data is sparse
