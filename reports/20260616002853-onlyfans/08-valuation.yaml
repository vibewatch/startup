company:
  name: OnlyFans
chapter:
  number: 8
  title: Valuation
  summary: The freshest public pricing point for OnlyFans is Architect Capital’s May 2026 purchase of 16% for $535
    million, implying a $3.15 billion valuation. That price is supported by rare public profitability and scale
    for a creator platform, but it also appears to already discount regulatory overhang, payment sensitivity, concentrated
    control, and uncertain minority-rights economics. The most supportable call is that the company is fairly priced
    for strategic or structured capital and full for a plain-vanilla minority investment at the public anchor.
sections:
- id: valuation-anchor
  title: Current valuation anchor and recommendation
  body: 'The strongest public valuation anchor is the May 2026 Architect Capital transaction: $535 million for a
    16% stake, implying an equity valuation of about $3.15 billion. That price is meaningful because it is newer
    and harder than the rumor cycle that previously floated much higher sale values and alternative sale structures.
    It also sits on top of unusually strong public financial evidence for a creator platform: FY2024 net revenue
    of about $1.41 billion and pretax profit of about $684 million. On those facts alone, the business does not
    look distressed. The problem is that a new minority investor is not buying those economics in a clean governance
    wrapper. Public evidence still points to meaningful regulatory overhang, payment sensitivity, and concentrated
    control. That is why the right call is not that the valuation is wrong; it is that the valuation looks fair
    for strategic or structured capital but full for a plain minority investment without stronger terms, better
    rights, or clearer downside protection.'
  claimRefs:
  - CV001
  - CV002
  - CV004
  - CV005
  - CV006
  - CV009
