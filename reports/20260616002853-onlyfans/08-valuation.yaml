- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Fresh UK enforcement or new major trust-and-safety sanction
    - Any new fine, formal remediation order, or analogous foreign action
    - Breaks the idea that 2025 was a contained event
    - Move underwriting toward bear range and demand stronger structure
  - - Payment-rail restriction
    - Publicly disclosed reserve, processor exit, or network restriction
    - Undercuts liquidity and creator trust simultaneously
    - Re-cut valuation and working-capital assumptions immediately
  - - No evidence of creator-fintech adoption
    - Twelve months with no disclosed traction or product economics
    - Removes much of the strategic-upside narrative
    - Treat business as mature cash-flow platform rather than option-rich growth asset
  - - Governance rights remain weak
    - No meaningful information rights or downside protections offered to new investors
    - Makes the same headline price less attractive for minorities
    - Require lower entry price or walk away
  - - Creator or fan engagement softens materially
    - Meaningful decline in creator additions, fan activity, or payout throughput
    - Challenges liquidity-moat thesis
    - Revisit competitive assumptions and terminal value
  notes: Triggers are intended for new-deal underwriting, not operating KPIs for management alone.
  claimRefs:
  - CV028
  - CV029
  - CV036
  - CV041
  - CV027
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preferences
    - Exact liquidation preferences, anti-dilution terms, and investor rights in the 2026 deal
    - Headline valuation can mislead without structure detail
    - Request legal docs and term sheet
  - - Audited margin bridge
    - Gross margin, payout processing costs, and cash conversion details behind FY2024 net revenue
    - Needed to decide whether the public mark is cheap or full on normalized earnings
    - Request audited accounts and finance memo
  - - Architect deal economics
    - Board rights, information rights, and any downside protection for Architect
    - Critical comp for any follow-on minority investor
    - Request side-letter summary or shareholder agreement
  - - Creator-fintech product traction
    - Adoption, revenue, and loss-rate data for any new financial-services products
    - Separates real upside from narrative optionality
    - Request product KPI deck and pilot economics
  - - Regulatory remediation status
    - Evidence that post-fine controls have improved materially
    - A cleaner compliance trajectory could justify higher valuation confidence
    - Request Ofcom remediation package and trust metrics
  - - Engagement and churn cohorts
    - Creator retention, fan spend retention, and multihoming indicators
    - Account counts alone do not prove durable monetization
    - Request cohort deck and subscription-retention analysis
  notes: These asks are the minimum additional evidence needed to turn a fair public anchor into a stronger investment
    recommendation.
  claimRefs:
  - CV041
  - CV036
  - CV028
  - CV037
