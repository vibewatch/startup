- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Price / unit / contract model
  - Included capabilities
  - Known extra fees or unknowns
  - Implication
  rows:
  - - OnlyFans
    - 20% of fan payments
    - Subscriptions, PPV, DMs, creator payouts, paywall monetization
    - Exact payment-processor economics not publicly broken out here
    - Highest headline take in this set must be justified by conversion and adult tolerance
  - - Patreon
    - 10% standard platform fee; legacy 5/8/11 plans remain for older pages
    - Memberships, one-time purchases, video, livestream, newsletters, chats
    - Processing, payout, currency, tax, and iOS effects still matter
    - Cheaper headline fee but broader community product and less adult-native positioning
  - - Substack
    - 10% platform fee plus Stripe fees
    - Paid subscriptions, publishing, podcasting, chats, creator stats
    - Effective take often estimated above headline fee; iOS pricing remains complex
    - Powerful for writer-owned audiences but narrower product scope than OnlyFans
  - - Ko-fi
    - 0% tips and 5% most monetization on free tier; $12/mo Gold removes service fees
    - Tips, memberships, shop sales, commissions, direct payouts
    - Processor fees still apply; discovery is weak
    - Very low friction for creators who can bring their own audience
  - - JustForFans
    - 80-85% payout claim
    - Adult community positioning
    - Public packaging depth is thin in this pack
    - Relevant niche benchmark for payout-sharing expectations
  - - TikTok Shop
    - Category-based referral fees often around 5-6%
    - Video commerce, LIVE commerce, storefronts, linked marketing accounts
    - Different merchant and product-led workflow from paid fandom
    - Competes for creator attention when product commerce converts better than subscriptions
  notes: 'Packaging differences matter as much as headline fee: the platforms optimize for different creator jobs and audience relationships.'
