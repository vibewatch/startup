- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence-backed rationale
  - Mitigation / diligence ask
  rows:
  - - Closed-loop paid conversion at scale
    - Lower-fee substitutes and multihoming
    - High
    - OnlyFans is far larger publicly than rivals, but creators can keep backup monetization channels elsewhere.
    - Request cohort retention, creator churn after policy shocks, and cross-platform attach rates
  - - Adult-policy tolerance
    - Banking, payments, and regulator pressure
    - High
    - The 2021 ban reversal and 2025 Ofcom fine show adult tolerance is not fully under OnlyFans control.
    - Request current processor mix, reserve requirements, and regulator action log
  - - Liquidity and brand recognition
    - Open-discovery platforms capture top-of-funnel
    - Medium-High
    - TikTok Shop and Linktree emphasize audience reach and off-platform commerce rather than closed paywalls.
    - Quantify how much OnlyFans relies on external discovery for new fan acquisition
  - - Creator operating convenience
    - Alternative payout and niche-community tools
    - Medium
    - Fansly, FanCentro, and JustForFans all compete on payout or niche-fit expectations.
    - Benchmark onboarding friction, payout speed, and payout-failure rates versus named rivals
  - - Headline fee power
    - Mainstream competitors with lower platform takes
    - Medium
    - Patreon, Substack, and Ko-fi all undercut OnlyFans on sticker price.
    - Show realized creator LTV or ARPPU uplift that offsets the 20% take
  - - Trust and safety narrative
    - Independent scrutiny gaps
    - Medium
    - Swissinfo notes that paywalled adult ecosystems are hard to audit independently.
    - Request third-party trust and safety reporting and adverse-event transparency metrics
  notes: Severity is an underwriting judgment based on the current public pack, not a numerical market-share forecast.
