- id: adult-platform-dynamics-and-multihoming
  title: Adult-platform dynamics and why creators keep fallback options
  body: The direct adult-platform set is best understood as an operating-risk hedge rather than as a set of transparent public comps. Fansly’s help center is heavy on payout methods, earnings statistics, subscription mechanics, and tax forms. FanCentro’s accessible support pages also center on earnings and payments. JustForFans differentiates through explicit LGBTQ and kink positioning plus a stated 80–85% payout. None of these surfaces provides a clean public scale comparison to OnlyFans, but together they show why adult creators do not make platform choices on fee tables alone. They care about whether adult content is welcome, how quickly money moves, whether identity and tax paperwork work, and whether a niche community exists. That setup naturally encourages multihoming. A creator can keep OnlyFans as the biggest revenue engine while maintaining backup distribution or niche monetization elsewhere in case policy, payouts, or audience behavior shift. In practice that means competitive
    pressure often shows up as redundancy and portfolio behavior, not a clean full-platform replacement event.
  claimRefs:
  - CP017
  - CP018
  - CP019
  - CP032
  - CP035
  - CP039
  figureRefs:
  - FP003
- id: moat-durability-and-regulatory-pressure
  title: Moat durability versus compliance and payment pressure
  body: 'OnlyFans’ moat is strongest where rivals are weakest: closed-loop paid conversion at scale. The public numbers show that it operates with billions of gross fan payments and hundreds of millions of registered fan accounts, which no source here matches with the same visibility. But scale does not eliminate risk. The 2021 attempted porn ban demonstrated how quickly banking and payout pressure can threaten adult creators’ trust in the platform. Ofcom’s 2025 fine and the Online Safety Act add a second layer of pressure by making age assurance and reporting governance a hard operating requirement. Swissinfo and Mastercard reinforce the third layer: payment-rail and trust controls shape what the market can legally and operationally sustain. That leaves a nuanced underwriting view. OnlyFans has real liquidity and brand advantages, but creators can still multi-home, discovery can still happen elsewhere, and regulatory or payment shocks can still narrow the moat faster than a simple market-share
    chart would imply.'
