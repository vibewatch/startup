    "number": 1,
    "title": "Company Overview",
    "summary": "Dataminr is a New York-based, late-stage private AI company that sells real-time event, threat, and risk intelligence to enterprise, government, defense, and news customers. Public 2025 sources support a business with roughly $200 million of ARR, at least 800 customers, deep blue-chip/government penetration, and a hybrid 2025 financing stack built around convertible instruments rather than a newly priced equity round. The main diligence flags are founder/board disclosure opacity, conflicting public founder and headcount records, 2023 layoffs, surveillance-related criticism, and limited public detail on the terms and dilution impact of the 2025 convertibles and credit."
  },
  "sections": [
    {
      "id": "identity-platform-and-footprint",
      "title": "Identity, platform, and customer footprint",
      "body": "Dataminr describes itself as the global leader in AI-powered real-time event, threat, and risk intelligence, and the fetched company pages consistently position the business as an infrastructure-like intelligence platform rather than a consumer media or ad-tech product. The core offer is a multi-product stack spanning Dataminr Pulse for Corporate Security, First Alert for public-sector response, Dataminr for News, and Dataminr for Cyber Defense. The technical spine is unusually prominent in company materials: Dataminr says it performs trillions of daily computations across billions of public inputs from more than one million unique public data sources, uses more than 50 proprietary LLMs, and synthesizes text, images, video, sound, and sensor data in 150-plus languages across 220-plus countries and territories. That platform framing matters because later growth claims depend less on a single app and more on a common AI/data layer that can be repackaged across physical security, cyber, public sector, and newsroom workflows. Public customer proof is also strong by private-company standards. Current official pages say Dataminr is trusted by two-thirds of the Fortune 50, half of the Fortune 100, more than 100 U.S. government agencies, and 20-plus international governments; Dataminr for News is described as used by more than 1,500 newsrooms and 30,000-plus journalists. TechCrunch adds that the company serves more than 800 customers overall and names NATO and OpenAI among them. The location picture is directionally consistent but not perfectly clean: multiple third-party databases place the company in New York City, with 6 East 32nd Street and 135 Madison Avenue both appearing in public profiles. Together, the evidence supports a clear chapter-one identity: Dataminr is a late-stage New York intelligence software company with meaningful global distribution, strong public-sector relevance, and a customer base large enough to make later ARR and financing claims plausible.",
