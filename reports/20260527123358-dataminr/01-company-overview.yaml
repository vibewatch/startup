      "id": "founders-leadership-and-governance",
      "title": "Founders, leadership, and governance visibility",
      "body": "Dataminr is still unmistakably founder-led. Official leadership materials identify Ted Bailey as founder, CEO, and chairman; Jeff Kinsey as co-founder and CTO; and Peter Bailey as president of corporate initiatives and a founding member focused on strategy, fundraising, and investor relations. The current executive bench is broader than the company’s older public profile, with Balaji Yelamanchili listed as president and COO, Tiffany Buchanan as CFO, Matthew Harrell as chief partner officer, Joel Tetreault as chief AI officer, and additional leaders across product, legal, people, public sector, and revenue. That functional spread is a positive signal for a company that now sells into security, cyber, government, and large-enterprise environments. Two governance caveats still matter. First, public founder attribution beyond Ted Bailey is not perfectly clean: official materials clearly name Jeff Kinsey and Peter Bailey as founding members, while TechCrunch, Wikipedia, and other third-party summaries also mention Sam Hendel. Second, the current COO story looks under-disclosed. Dataminr’s April 2024 and April 2025 releases presented Brian Gumbel as president and COO, yet the 2026 leadership page now lists Balaji Yelamanchili in that role without a fetched transition announcement. The June 2025 Tiffany Buchanan hire and the March 2025 elevation of Dave DeWalt to board vice chairman both suggest increasing institutionalization and capital-markets preparation, but official pages still do not publish a clean board roster, committee map, or current ownership structure. Third-party databases fill some of that gap, but they do not eliminate key-person dependence or cap-table opacity.",
