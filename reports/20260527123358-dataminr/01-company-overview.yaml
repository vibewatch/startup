      "id": "funding-history-and-capital-structure",
      "title": "Funding history, investor base, and financing structure",
      "body": "Dataminr’s last clean priced benchmark remains the March 2021 Series F, when the company announced a $475 million financing at a $4.1 billion valuation. Official and TechCrunch coverage align on that headline and on a marquee syndicate that included Eldridge, Valor Equity Partners, MSD Capital, Reinvent Capital, ArrowMark Partners, IVP, Eden Global, and Morgan Stanley Tactical Value funds. The 2021 round turned Dataminr into a well-capitalized late stage AI platform at a time when management was still openly discussing IPO ambitions. The more important current story is that 2025 funding came through hybrid instruments instead of a newly disclosed priced round. On March 19, 2025, Dataminr raised $85 million from NightDragon and HSBC through convertible financing plus credit, and TechCrunch reported that the instrument was explicitly pre-IPO, did not set a valuation, and would give investors a discount to a later IPO price or financing price. NightDragon also disclosed plans for an SPV that could add up to another $100 million of convertible exposure. Just over a month later, Fortress provided an additional $100 million of convertible financing. Fortress, Dataminr, and Private Equity Wire all frame this as a strategic growth investment, but it also signals financing-structure caution: the company added capital without resetting the 2021 valuation publicly, and public sources still do not disclose coupon terms, conversion mechanics, covenant packages, or priority relative to prior investors. Total capital raised is therefore only expressible as a range—roughly $1.0 billion to $1.24 billion—depending on which sources include secondaries, debt, and recent convertibles.",
