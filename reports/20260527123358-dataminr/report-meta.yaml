companyProfile:
  summary: >-
    Dataminr is a New York-based, late-stage private AI company that sells real-time event, threat,
    and risk intelligence to corporate security teams, cyber defenders, public-sector organizations,
    financial institutions, and newsrooms. Public sources support a scaled business with broad government
    and Fortune 50 penetration, strong product breadth across physical and cyber workflows, and roughly
    $200 million of ARR. At the same time, public disclosure remains limited on underlying unit economics,
    customer concentration, and the capital-structure implications of Dataminr's 2025 convertible financings.
