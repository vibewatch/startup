  productSummary: >-
    Dataminr sells a real-time intelligence platform that uses multimodal AI and public-data discovery to
    surface emerging events, cyber threats, physical-security issues, crisis signals, and breaking news,
    packaged through Dataminr for Corporate Security, Dataminr for Cyber Defense, First Alert, and Dataminr for News.
  customerFocus: >-
    Large enterprises, government and defense organizations, security teams, financial institutions, and
    professional newsrooms that need early warning and faster decision support across physical and digital risk.
  businessModel: >-
    Enterprise software sold through direct sales, partner channels, public-sector distribution, and marketplace/API
    routes, with expansion across vertical products and workflow-specific modules.
  stage: late-stage private
