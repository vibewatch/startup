- id: unit-economics-and-disclosure-gaps
  title: Unit economics and disclosure gaps
  body: Dataminr looks operationally like an asset-light software and data platform, but public disclosure is too sparse to support a true unit-economics underwrite. The strongest public datapoints are the ARR signal and rough headcount range from GetLatka and Tracxn; together they imply about $0.24 million to $0.26 million of ARR per employee, which is respectable for a private enterprise software company but not enough to judge efficiency on its own. The 2023 layoff of roughly 20% of staff and the memo’s promise of multiple years of runway imply management has already pushed on cost structure, yet the company still does not disclose gross margin, services intensity, burn, cash, or retention. IncFact’s broad $100 million to $500 million revenue estimate underscores how approximate outside databases remain for a private issuer. In practice, investors cannot tell whether Dataminr’s near-$200 million ARR is largely software-like recurring revenue, labor-heavy implementation revenue, or some
    hybrid. That missing layer is why the public picture supports conviction on demand, but not yet on margin path or sales efficiency.
  claimRefs:
  - CI017
  - CI018
  - CI021
  - CI025
  - CI026
