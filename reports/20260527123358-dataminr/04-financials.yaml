- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public signal
  - Current value/status
  - Revenue quality
  - Diligence ask
  rows:
  - - Enterprise corporate security subscriptions
    - Negotiated software subscriptions and contracts tied to risk/event intelligence workflows
    - Corporate Security product page plus Fortune 50 customer references
    - Large and current, but no segment ARR disclosed
    - Likely recurring and sticky if embedded in security operations
    - Provide enterprise ARR, ACV, renewal rates, and services attach rate
  - - Government and defense contracts
    - Multi-year public-sector contracts and agency subscriptions
    - 100+ U.S. agencies, 20+ international governments, plus reported $282M DoD contract
    - Material and strategic; concentration unknown
    - High durability potential, but procurement and recompete risk matter
    - Disclose top contracts, backlog, recompete schedule, and concentration by agency
  - - Newsroom subscriptions
    - Newsroom and journalist subscriptions for breaking-news workflows
    - 1,500+ newsrooms and 30,000 journalists
    - Scaled installed base; revenue not disclosed
    - Recurring but likely lower ACV than enterprise/government
    - Disclose newsroom ARR, churn, and ARPU by newsroom size
  - - Partner/API and embedded distribution
    - Partner network, API, and embedded intelligence distribution
    - 2025 release highlighted partner network and platform/API expansion
    - Expansion vector, but no contribution disclosed
    - Could improve distribution economics if channel-led
    - Disclose partner-sourced pipeline, partner revenue, and API pricing model
  - - Services / deployment / customization
    - Implementation, onboarding, training, and workflow configuration
    - No direct public split; implied risk in enterprise/government deployments
    - Undisclosed
    - Quality depends on whether services are small enablement or a large revenue share
    - Disclose services revenue share, margin, and implementation burden per deal
  notes: Current value/status reflects only public evidence. Dataminr discloses customer and product scale, but not segment ARR or software-versus-services mix.
