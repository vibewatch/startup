company:
  name: Dataminr
chapter:
  number: 4
  title: Financials
  summary: Dataminr entered 2025 with credible topline momentum—officially approaching $200M ARR plus broad enterprise, government, and newsroom adoption—but financed that next leg with two back-to-back convertibles ($85M in March and $100M in April) rather than a new priced equity round. Public evidence supports commercial scale, yet underwriting remains constrained because Dataminr does not disclose cash, burn, gross margin, retention, segment mix, or contract concentration; the correct read is strong demand paired with notable valuation-sensitivity and disclosure risk.
sections:
- id: capital-structure-and-adequacy
  title: Capital structure and adequacy
  body: 'Dataminr’s public financial story is anchored by a well-known 2021 priced equity round and two far more tactical 2025 instruments. In March 2021 the company raised $475 million at a $4.1 billion valuation, with management framing that capital as fuel for enterprise growth, international expansion, and public-sector scale-up. By contrast, March 2025 brought an $85 million combination of convertible financing and credit from NightDragon and HSBC, followed just over a month later by a separate $100 million convertible financing from Fortress. TechCrunch explicitly described the March round as pre-IPO convertible financing that did not set a new valuation, while Private Equity Wire framed the Fortress deal as a pre-IPO dilution-management tool. Those facts matter more than the headline dollars: Dataminr appears able to raise capital, but it is choosing bridge-style instruments rather than repricing common equity. Public databases also diverge on lifetime capital raised, so the safest
    expression is an approximate public tally of about $1.2 billion-plus. What remains missing is the crucial underwriting layer beneath the fundraising headlines: cash on hand, current burn, covenant burden, and whether the 2025 financings were opportunistic or necessary.'
