callouts:
- calloutType: strength
  title: Demand signal is strong even though disclosure is thin
  body: Near-$200M ARR, 100+ U.S. agencies, 20+ international governments, 1,500+ newsrooms, and a reported $282M DoD contract are unusually strong public traction signals for a private company. The issue is not whether Dataminr has commercial relevance; it is whether the public record reveals enough about the quality of that revenue.
  claimRefs:
  - CI008
  - CI010
  - CI028
- calloutType: risk
  title: Back-to-back convertibles are a real valuation-sensitivity signal
  body: Convertible financing can be rational pre-IPO bridge capital, but two such instruments in rapid succession—after a 2023 layoff and without a fresh priced-equity mark—suggest management wanted capital without reopening the valuation question. That is not fatal, but it is a meaningful diligence flag.
  claimRefs:
  - CI017
  - CI033
  - CI035
  - CI036
- calloutType: recommendation
  title: Underwrite Dataminr as commercially strong but financially under-disclosed
  body: The public evidence supports a company with genuine demand and multiple defensible end markets. However, any investment case should remain conditional until management provides gross margin, burn, retention, customer concentration, and convertible-term disclosure.
  claimRefs:
  - CI030
  - CI038
  - CI039
