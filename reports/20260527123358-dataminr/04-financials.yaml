  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Segment and consolidated gross margin, plus the split between software subscription revenue and implementation/services revenue.
    whyItMatters: Without gross margin and services mix, investors cannot judge whether the current ARR signal is high-quality software revenue or labor-intensive delivery revenue.
    diligencePath: Request audited management accounts with gross margin by segment and direct-cost bridge for data, cloud, support, and services.
    relatedQuestionRefs:
    - QI015
    - QI022
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Cash balance, monthly burn, debt covenants, and runway months after the March/April 2025 financings.
    whyItMatters: Capital adequacy cannot be underwritten from fundraising headlines alone; the bridge financing could represent optionality or genuine liquidity need.
    diligencePath: Obtain monthly cash burn, current cash, debt schedule, covenant package, and 18–24 month base/upside/downside cash forecast.
    relatedQuestionRefs:
    - QI016
    - QI025
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: retention-sales-efficiency
    missingEvidence: Net revenue retention, gross retention, CAC, payback period, quota attainment, and segment-level sales-cycle data.
    whyItMatters: Enterprise and government scale claims do not translate into durable efficient growth unless retention and go-to-market efficiency are known.
    diligencePath: Request cohort tables, NRR by segment, CAC/payback model, pipeline conversion, and quota-carrying rep productivity.
    relatedQuestionRefs:
    - QI017
    - QI018
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: minor
    topic: pricing-realization
    missingEvidence: Actual pricing architecture by SKU, average contract value, discounting norms, and ARR per customer segment.
    whyItMatters: Public customer counts are not enough to assess monetization quality, upsell opportunity, or dependence on a few very large contracts.
    diligencePath: Request price book, realized pricing waterfall, ACV distribution, and top-20 customer revenue concentration.
    relatedQuestionRefs:
    - QI009
    - QI022
    - QI023
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: conflicting-data
    severity: minor
    topic: total-raised
    missingEvidence: A management-confirmed cap table or financing ledger reconciling equity, credit, and convertible instruments.
    whyItMatters: Public databases disagree materially on lifetime capital raised, which can distort dilution, insider support, and financing-dependency analysis.
    diligencePath: Ask management to provide round-by-round financing history including equity, debt, convertibles, and any undrawn SPV commitments.
    relatedQuestionRefs:
    - QI005
    relatedTableRefs:
    - TI004
    - TI005
