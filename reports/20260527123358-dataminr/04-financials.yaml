- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value
  - Confidence
  - Why it matters
  - Closest public evidence
  - Diligence ask
  rows:
  - - ARR / revenue scale
    - ~$200M ARR; third-party range extends to ~$222.3M for 2024
    - Medium
    - Anchors current scale and implied efficiency
    - Official 2025 releases plus GetLatka profile
    - Provide audited revenue, ARR bridge, and trailing-12-month recognized revenue
  - - ARR per employee
    - ~$0.24M-$0.26M based on 757-842 employees
    - Medium
    - Proxy for operating leverage and workforce efficiency
    - GetLatka and Tracxn headcount snapshots plus official ARR signal
    - Provide actual revenue per employee, fully loaded compensation, and quota-carrier productivity
  - - Gross margin
    - null
    - Low
    - Core input to software quality and margin path
    - No public disclosure found in cited sources
    - Provide gross margin by segment and direct cost detail
  - - Cash runway
    - 'Only qualitative: “multiple years of cash runway” after 2023 layoff'
    - Low
    - Determines whether 2025 financing was optional or necessary
    - TechCrunch reporting on 2023 memo
    - Provide cash balance, monthly burn, and base-case runway
  - - NRR / expansion
    - null
    - Low
    - Shows whether upsell and seat expansion support durable ARR compounding
    - No public retention metrics found
    - Provide gross retention and NRR by segment and top cohort
  - - CAC / payback
    - null
    - Low
    - Needed to judge sales efficiency in enterprise and government motion
    - No public CAC or sales-cycle economics found
    - Provide CAC, payback, pipeline conversion, and sales cycle by segment
  notes: Null values reflect unavailable public data, not zero values. The only credible public quantitative anchors are ARR, headcount range, and the 2023 qualitative runway comment.
