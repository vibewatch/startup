- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Public status
  - Why it matters
  - Closest proxy
  - Diligence path
  rows:
  - - Cash balance and monthly burn
    - Not disclosed
    - Core capital adequacy question after back-to-back convertibles
    - 2023 statement about multiple years of runway
    - Request monthly cash balance, burn, and forecast after 2025 financings
  - - Gross margin by segment
    - Not disclosed
    - Separates software-like economics from services-heavy delivery
    - Software/platform model inference only
    - Request management P&L with gross profit by product and services
  - - NRR / gross retention
    - Not disclosed
    - Critical for judging expansion-led ARR durability
    - Large customer footprint and mission-critical positioning
    - Request cohort retention tables and expansion waterfall
  - - CAC, payback, and sales efficiency
    - Not disclosed
    - Needed to underwrite enterprise and government GTM economics
    - Headcount range and customer-scale proxies only
    - Request sales productivity, payback, and pipeline conversion metrics
  - - Segment ARR mix
    - Not disclosed
    - Customer counts cannot be converted into economics without mix
    - Product and customer pages show enterprise/government/news exposure
    - Request ARR by enterprise, government, media, partner/API, and services
  - - Customer concentration / contract concentration
    - Not disclosed
    - Large government contracts can improve durability but raise dependency risk
    - Reported $282M DoD contract plus 100+ agencies
    - Request top-20 customers, renewal schedule, and backlog by agency or logo
  - - Debt and convertible terms
    - Not disclosed
    - Bridge financing can be benign or restrictive depending on terms
    - Public headlines only mention convertibles, credit, and investor names
    - Request maturity, pricing, security package, and conversion features
  notes: This table lists the specific private-company metrics still needed for underwriting. Every row is a real diligence blocker or confidence limiter from the public record.
