- id: revenue-model-and-scale-signals
  title: Revenue model and scale signals
  body: 'Public evidence supports a strong topline trajectory, but it is strongest on aggregate scale and weakest on monetization detail. Dataminr’s official 2025 releases say the company is approaching $200 million in ARR, while TechCrunch reported more than 800 customers, 1,500 newsrooms, and a five-year $282 million Department of Defense contract. Official pages separately confirm more than 100 U.S. government agencies, 20-plus international governments, and more than 1,500 newsrooms, which together point to a diversified customer base across enterprise, public sector, and media. The product footprint also suggests multiple monetizable surfaces: corporate security and event-risk intelligence for enterprises, mission-oriented government deployments, newsroom subscriptions, and a partner/API motion for embedded use cases. What Dataminr does not reveal publicly is equally important: no list pricing, no disclosed ACVs, no segment ARR split, and no indication of how much revenue comes from
    recurring software versus services and deployments. That means revenue quality must be inferred from who buys the product and how mission-critical it appears, not from disclosed SaaS economics.'
