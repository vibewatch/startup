- id: modules-and-customer-workflows
  title: Modules and customer workflows
  body: 'The marketed product map now spans four visible top-level buyer surfaces plus newer cyber-specialized modules. On the enterprise side, Dataminr for Corporate Security is framed around employee safety, asset protection, and operational resilience, with adjacent use cases in executive protection, supply-chain monitoring, financial-services operations, and route or site awareness. In public sector, First Alert remains the situational-awareness surface for emergency management, diplomatic security, law enforcement, and force-protection workflows. In media, Dataminr for News packages the same real-time discovery engine for newsroom verification and breaking-news discovery. Cyber is where the product family has become more modular: Pulse for Cyber Risk handles cyber-physical convergence and digital-risk use cases, Agentic TIP aims to operationalize intelligence across the full lifecycle, CTTI tailors external signals to a customer''s own environment, and Investigation Insights overlays
    that context across hundreds of connected tools. The common thread is workflow compression. Dataminr is not merely promising alerts; it is promising fewer pivots, fewer manual enrichment steps, and faster movement from signal to decision. That is strategically important because it makes the moat claim about product integration and operational relevance, not just about raw data collection.'
