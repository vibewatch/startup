- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Dataminr for Corporate Security
    - Corporate security and GSOC teams
    - Scaled core product
    - Earliest external signal plus context for people, sites, and operations, with Esri and Genetec tie-ins
    - Need cohort-level retention, implementation effort, and incident-SLA data
  - - Dataminr First Alert
    - Emergency management, law enforcement, and other public-sector operators
    - Scaled core product
    - Real-time event discovery purpose-built for first responders and public-sector crisis workflows
    - Need deployment depth by agency and proof of sustained usage intensity
  - - Dataminr for News
    - Newsrooms and journalists
    - Scaled core product
    - Same event-detection backbone packaged for breaking-news discovery and verification
    - Need newsroom churn, pricing model, and workflow stickiness metrics
  - - Dataminr Pulse for Cyber Risk
    - CISOs, cyber-risk, and cyber-physical teams
    - Scaled but still expanding
    - Cross-domain cyber-physical intelligence, entity mapping, and knowledge-graph-driven relevance
    - Need external KPI proof beyond product claims and marketplace listings
  - - Agentic Threat Intelligence Platform
    - Threat-intel and CTI operations teams
    - Commercialized but still roadmap-heavy
    - Structured and reusable intelligence, 300+ source normalization, and agentic routing across the lifecycle
    - Need customer proof for no-code agents and 2026 custom-playbook roadmap
  - - Client-Tailored Threat Intelligence
    - SOC and threat-intel analysts
    - Commercialized current module
    - Fuses external signals with customer telemetry so relevance is tailored before analyst review
    - Need proof of telemetry connectors, onboarding effort, and false-positive reduction methodology
  - - Investigation Insights
    - Analysts working inside SIEM, EDR, ticketing, and browsers
    - Commercialized current module
    - Context overlay and federated search across 200+ connected systems without a data lake
    - Need architecture detail on auth, permissions, and workstation footprint
  - - Developer Platform / API / SDK
    - Partners, product teams, and developers
    - Newer but strategically important layer
    - Turns distribution into code via APIs, SDKs, blueprints, and metadata-rich streams
    - Need full public API object model, rate limits, support model, and SDK language coverage
  notes: Status labels reflect only public evidence through the run date. Differentiation is the external story Dataminr tells, not a third-party winner declaration.
