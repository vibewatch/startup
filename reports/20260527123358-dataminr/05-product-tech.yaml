- id: integrations-deployment-and-trust-controls
  title: Integrations, deployment, and trust controls
  body: 'Dataminr''s go-to-market increasingly depends on being embedded inside existing customer systems rather than forcing customers into a standalone console. Official sources and partner listings show API and marketplace distribution through AWS, Carahsoft, Splunk, Esri, and Genetec, while Investigation Insights and CTTI are explicitly marketed as no-rip-and-replace overlays that sit on top of SIEM, EDR, ticketing, browser, and other analyst tools. The November 2025 Developer Portal and enhanced SDK matter because they turn that integration motion into a product surface of its own, with docs, code samples, SDKs, and integration patterns meant to shorten partner build cycles. Esri and Genetec deepen the physical-world and geospatial story; Splunk validates the cyber-workflow story; AWS and Carahsoft add distribution credibility. On trust and compliance, the strongest public signal is Dataminr''s ISO/IEC 42001 certification layered on top of ISO/IEC 27001 and 27701, which is useful evidence
    that the company is formalizing AI governance rather than shipping agentic features without controls. Still, the public material is better at describing what integrations exist than how they are operated under load: rate limits, support obligations, uptime commitments, and authentication depth remain under-disclosed.'
