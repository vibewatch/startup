- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Company solution
  - Measurable benefit signal
  - Limitation
  rows:
  - - GSOC / corporate security monitoring
    - Fragmented external-event monitoring across sites, executives, and travel
    - Corporate Security surface plus geospatial and physical-security integrations
    - Earlier signal around employee safety, facilities, and continuity risks
    - Public evidence does not show average time-to-value or admin burden
  - - Cyber-threat triage
    - Too many alerts lack context and are manually enriched across tools
    - Pulse for Cyber Risk plus CTTI and Investigation Insights
    - Company claims investigations move from hours or minutes to seconds
    - Independent benchmark methodology is not public
  - - Threat-intel operations
    - Intel expires in spreadsheets and disconnected feeds
    - Agentic TIP structures, scores, routes, and reuses intelligence
    - Dataminr markets reusable intelligence across detection, response, hunting, and reporting
    - Roadmap and customer-reference depth are still limited in public
  - - Emergency-management response
    - Scene understanding is slow and fragmented during fast-moving incidents
    - First Alert plus emergency-management workflows
    - Public pages emphasize earlier situational awareness and faster decision-making
    - No public deployment-depth or renewal metrics by agency
  - - Newsroom verification
    - Journalists chase fragmented witness signals while deadlines compress
    - Dataminr for News with live event discovery and verification support
    - 1,500+ newsrooms and 30,000 journalists cited by Dataminr
    - No public pricing or ARPU visibility
  - - Executive protection
    - Threats may appear in images or local chatter before they hit formal channels
    - Executive-protection use case on top of Corporate Security and Multi-Modal Fusion AI
    - Public copy highlights image-led threat discovery and hyperlocal awareness
    - No independent EP outcome metrics are public
  - - Supply-chain and operations monitoring
    - Disruptions around routes, sites, vendors, and regions are easy to miss
    - Supply-chain and financial-services use cases plus Esri context
    - Public materials position Dataminr as a common operating picture for business disruption
    - Public record does not quantify workflow savings by vertical
  - - Partner product team embedding intelligence
    - Building real-time event intelligence in-house is slow and integration-heavy
    - Developer Portal, SDK, and API metadata stream
    - Docs, blueprints, and code samples are meant to shorten integration cycles
    - Full API depth is not public enough to verify supportability independently
  notes: Benefit signals are public claims or externally visible adoption markers, not controlled customer studies. Limitations flag where diligence should ask for referenceable metrics.
