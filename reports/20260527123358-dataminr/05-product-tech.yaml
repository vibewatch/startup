- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Evidence
  - Key dependency
  - Risk
  rows:
  - - Public-data ingestion
    - Continuously collects public web, social, deep and dark web, code-repository, sensor, and partner data
    - 1M+ sources, 150+ languages, 220+ countries, 43+ TB daily
    - Third-party platform access and source-rights continuity
    - Coverage or cost can shift when external platforms change terms
  - - Multi-Modal Fusion AI detection
    - Detects early event, threat, and risk signals across text, image, video, audio, and machine signals
    - Technical blog explains crossmodal attention and multi-model detection stack
    - Model quality, training data, and source diversity
    - Public benchmark methodology is limited
  - - Entity and knowledge-graph layer
    - Maps named entities, related organizations, and cyber artifacts to make signals relevant
    - Pulse for Cyber Risk cites NER, dynamic entity mapping, and a millions-of-entities knowledge graph
    - Fresh and correct entity relationships
    - Bad mappings could create noisy or misleading prioritization
  - - Generative AI description layer
    - Turns detections into live event briefs and summaries
    - ReGenAI launch and AI platform page describe automatically regenerated Live Briefs
    - Prompting, retrieval, and evaluation logic
    - Accuracy claims are public but methodology is not
  - - Agentic context layer
    - Adds autonomous contextualization, routing, and next-step logic
    - Intel Agents, Agentic TIP, and CTTI pages describe goal-oriented multi-agent workflows
    - Access to customer telemetry and evolving policy logic
    - Could become opaque if explainability and guardrails lag product breadth
  - - Customer context and connected systems
    - Pulls in private telemetry or searches connected tools for relevance
    - CTTI and Investigation Insights cite customer telemetry fusion and 200+ connected systems
    - Connector coverage, auth models, and permissions
    - Operational complexity is under-disclosed in public docs
  - - API / SDK / integration layer
    - Delivers data and context into customer and partner products
    - Developer Portal, SDK, Splunk app, Esri connectors, and Genetec workflow
    - Developer docs, rate limits, marketplace upkeep, and partner support
    - Public detail is enough to show direction, not enough to fully diligence supportability
  - - Domain product surfaces
    - Packages the same platform for enterprise security, cyber defense, public sector, and news
    - Corporate Security, First Alert, News, and cyber modules all sit on common AI claims
    - Consistent quality across very different vertical workflows
    - A broad SKU map raises execution and messaging complexity
  notes: This is an evidence-backed operating map, not an internal deployment diagram. Risks focus on dependencies or blind spots visible from public materials.
