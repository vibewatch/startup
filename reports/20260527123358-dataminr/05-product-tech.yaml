  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: benchmarking-risk
    missingEvidence: Independent precision, recall, latency, and false-positive methodology for Multi-Modal Fusion AI, ReGenAI, and Intel Agents.
    whyItMatters: Marketing claims about speed, accuracy, and false-positive reduction are central to Dataminr's differentiation, but they cannot be underwritten from public materials alone.
    diligencePath: Request benchmark decks, evaluation methodology, red-team results, and customer KPI snapshots that tie alert quality to operational outcomes.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: deployment-model
    missingEvidence: Reference architectures that show connector setup, permissions, endpoint footprint, uptime expectations, and support responsibilities for overlays and APIs.
    whyItMatters: Dataminr repeatedly markets fast deployment and no-rip-and-replace onboarding, so implementation complexity is a core underwriting variable rather than a side issue.
    diligencePath: Ask for deployment guides, sample architecture diagrams, customer implementation timelines, and support runbooks for Splunk, Esri, Genetec, and direct API deployments.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
  - type: access-blocked
    severity: material
    topic: documentation-gap
    missingEvidence: Direct inspection of full public API docs, auth flows, rate limits, and schema detail for the Developer Portal and API surfaces.
    whyItMatters: The developer motion is strategically important, but without portal-level technical detail it is hard to assess integration friction, switching costs, and supportability from the outside.
    diligencePath: Obtain live portal access during diligence, walk through auth and object models with a solutions engineer, and request a sample implementation plus rate-limit and SLA documentation.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
