company:
  name: Dataminr
chapter:
  number: 5
  title: Product & Technology
  summary: 'Dataminr''s product is not a single alert feed but a layered real-time intelligence platform: Multi-Modal Fusion AI discovers weak signals across more than 1 million public sources, ReGenAI rewrites Live Briefs as events change, and newer agentic modules push context into customer workflows through overlays, APIs, SDKs, and partner platforms. Public evidence supports broad module coverage across corporate security, cyber defense, public sector, and media, plus meaningful integration momentum, but technical underwriting remains constrained by sparse public benchmarking, limited public API detail, and continuing dependence on third-party data and platform access.'
sections:
- id: platform-architecture-and-data-strategy
  title: Platform architecture and data strategy
  body: 'Dataminr consistently describes the product as a layered AI platform rather than a narrow alerting application. The public architecture starts with broad public-data ingestion across text, image, video, audio, and sensor signals, then applies Multi-Modal Fusion AI to discover candidate events, risks, and threats at scale. That detection layer is followed by description and context layers: ReGenAI turns fast-moving detections into continuously rewritten Live Briefs, while Intel Agents and other agentic workflows add the surrounding context, prioritization, and next-best-action logic that customers need to decide quickly. The company''s own technical writing is useful here because it goes beyond generic marketing and explains crossmodal attention between image and text embeddings, plus the use of computer vision, natural-language understanding, audio, and anomaly-detection models. Dataminr also makes unusually aggressive scale claims for a private vendor, including more than 1 million
    sources, more than 50 proprietary LLMs, and 43+ terabytes of daily data processed. Those numbers help explain why the product can serve physical, cyber, and news workflows from one platform, but they are still mostly management or partner statements rather than independently benchmarked technical disclosures.'
