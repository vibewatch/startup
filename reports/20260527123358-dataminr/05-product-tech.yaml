- id: differentiation-limitations-and-underwriting-risks
  title: Differentiation, limitations, and underwriting risks
  body: 'The clearest public product differentiation is that Dataminr combines three layers that are often sold separately elsewhere: broad event detection, live generative description, and workflow-embedded context. The cyber pages sharpen that pitch by attacking legacy threat-intelligence platforms as too slow, generic, and manual, then positioning Agentic TIP, CTTI, and Investigation Insights as the operating system for intelligence inside existing stacks. That is directionally credible, and third-party partner surfaces do show real integration work. But there are real technical underwriting caveats. First, much of the performance story remains self-reported: fastest detection, 99.5% ReGenAI accuracy, reduced false positives, and major workflow compression are all plausible, yet the public record does not provide enough benchmark methodology to test them independently. Second, the platform is structurally dependent on continued access to public data, partner ecosystems, and customer-connected
    tools; diversification helps, but changes in source access, API terms, or ecosystem incentives can still erode product coverage or delivery quality. Third, the public developer footprint is still modest relative to the ambition of the platform. The GitHub and research signals show there is real technical substance, but not enough public surface to fully diligence supportability, explainability, or long-run switching costs without direct technical diligence.'
