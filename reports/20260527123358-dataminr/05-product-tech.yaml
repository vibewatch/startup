callouts:
- calloutType: strength
  title: The moat claim is workflow embed, not just alert discovery
  body: Dataminr's strongest public product story is that it layers discovery, live description, and workflow-native context across multiple verticals. Splunk, Esri, Genetec, and the Developer Portal all reinforce that the company is trying to live inside existing customer systems, not beside them.
  claimRefs:
  - CE004
  - CE024
  - CE030
  - CE031
  - CE051
- calloutType: insight
  title: Cyber is the most visibly modularized part of the suite
  body: 'The cyber-defense stack now has the clearest internal segmentation: Pulse for Cyber Risk for signal discovery, Agentic TIP for lifecycle operations, CTTI for environment-specific relevance, and Investigation Insights for in-tool response context. That makes cyber the proving ground for Dataminr''s agentic roadmap.'
  claimRefs:
  - CE013
  - CE016
  - CE018
  - CE021
  - CE027
- calloutType: risk
  title: Public-data and benchmark opacity remain the main technical risks
  body: Dataminr looks technically ambitious, but investors still need direct diligence on source-right durability, independent benchmark methodology, and API-support depth. The public record is good enough to support product breadth, not good enough to underwrite every performance claim at face value.
  claimRefs:
  - CE043
  - CE046
  - CE047
  - CE052
  - CE053
