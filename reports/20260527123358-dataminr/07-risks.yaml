  rows:
  - - Police surveillance of protected speech and protests
    - U.S. local / federal public sector
    - Documented in multiple FOIA-backed reports; no comprehensive remediation disclosed
    - High
    - Critical
    - Company says First Alert is designed to prevent targeting and works from public data
    - 'High: backlash can still drive contract scrutiny, platform pressure, and reputational damage'
    - Request all protest-monitoring complaints, customer escalations, and internal policy reviews since
      2020
  - - X/Twitter surveillance-policy conflict
    - Platform policy / U.S.
    - Historical prohibition softened, but contradiction remains documented
    - Medium-High
    - Critical
    - Dataminr appears to have privileged access and long-standing partner status
    - 'High: access, pricing, or permitted-use changes could degrade differentiated signal quality'
    - Obtain current X agreement, pricing terms, renewal dates, and contingency plan
  - - Federal and DoD privacy / civil-liberties obligations
    - U.S. federal
    - Active whenever agencies use Dataminr under DoD and related privacy rules
    - Medium
    - High
    - Existing DHS-reviewed privacy documentation and DoD policy references show formal compliance framework
    - 'Medium-High: compliance burden rises with public-sector scale and FOIA visibility'
    - Review PIAs, ATO materials, privacy reviews, and any corrective-action history
  - - Municipal procurement scrutiny over police deployments
    - U.S. state / local
    - 'Ongoing: Houston, DC, LA and similar records keep surfacing'
    - High
    - High
    - Broad contract-vehicle coverage and public-safety use cases support continued demand
    - 'Medium-High: a few high-profile cancellations could chill adjacent buyers'
    - Ask for renewal history, RFP losses, and legal objections by city or agency
  - - Public-data processing and deletion obligations
    - Cross-jurisdictional
    - Explicit in privacy policy and API license terms
    - Medium
    - Medium-High
    - Dataminr publishes privacy policy, deletion obligations, and API controls
    - 'Medium: public-data sourcing does not remove privacy, retention, or misuse disputes'
    - Review retention maps, deletion SLAs, and third-party data-provider obligations
  - - Potential constitutional or civil-rights challenge triggered by model error or profiling claims
    - U.S.
    - No public Dataminr-specific action identified in reviewed sources
    - Medium
    - High
    - Company denies surveillance framing and points to public-data guardrails
    - Medium-High because adverse reporting already documents factual patterns plaintiffs could cite
    - Request outside-counsel memos and any threatened claims tied to First Alert or protest monitoring
  notes: Severity reflects underwriting impact rather than expected damages alone. Coverage is intentionally
