company:
  name: Dataminr
chapter:
  number: 7
  title: Risks
  summary: 'Dataminr''s risk profile is concentrated in a few underwriting-critical issues rather than
    generic startup noise: documented surveillance backlash tied to police use of public-social-data alerts;
    real dependency on privileged platform access even within a broader one-million-source narrative;
    back-to-back 2025 convertibles that preserved valuation optionality but left capital-structure terms
    opaque; and an execution burden created by scaling government sales, partner distribution, and agentic
    AI at the same time. The strongest mitigants are also concrete—broad adoption, active public-sector
    demand, ISO-based AI governance, and recent CFO/COO hires—but the remaining uncertainty is still large
    enough that the decisive diligence asks are about dependency, concentration, model quality, and financing
    terms, not about market demand.'
sections:
- id: privacy-platform-and-regulatory-risks
  title: Privacy, Platform, and Regulatory Risks
  body: 'Dataminr’s highest-severity underwriting risk is that a core part of its differentiated public-sector
    value proposition sits on politically sensitive ground. The evidentiary base here is unusually strong
    for a private company: FOIA-driven reporting from The Intercept, a Brennan Center document review,
    StateScoop’s procurement follow-up, Houston’s council vote, and Dataminr’s own privacy and legal pages
    all point in the same direction. Dataminr’s edge is not simply that it reads public posts; it is that
    it can ingest public signals at a speed, breadth, and productized level that ordinary users and most
    agencies cannot replicate. That is why X/Twitter firehose access matters, why police departments buy
    the product, and why critics frame the same feature as outsourced surveillance rather than neutral
    alerting. The resulting risk is twofold. First, platform risk: if X materially changes price, access,
    or permitted use, Dataminr’s public-sector and protest-monitoring workflows could lose an input that
    multiple sources still describe as central. Second, backlash risk: reporters and civil-liberties advocates
    have already documented protest tracking, false positives, and bias allegations. There is no clear
    evidence in the public record of formal enforcement against Dataminr itself, but federal privacy review
    documents, DFARS privacy obligations, and repeated procurement disclosures show this is not a theoretical
    policy debate. The mitigant is that Dataminr publicly positions First Alert as privacy-protective
    and can point to public-data sourcing plus legal controls; the residual exposure is that buyers, platforms,
    or legislators may judge the real-world effect more harshly than the company’s framing.'
