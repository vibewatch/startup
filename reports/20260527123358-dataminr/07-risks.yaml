  title: The surveillance backlash is already evidenced, not hypothetical
  body: FOIA-backed reporting, municipal procurement records, and think-tank analysis already show Dataminr
    being used to track protected protests. The open question is not whether backlash exists, but how
    often it changes renewals, policy, or platform access.
  claimRefs:
  - CR005
  - CR012
  - CR009
  - CR048
- calloutType: risk
  title: Back-to-back convertibles are a real capital-structure signal
  body: Two 2025 convertibles after the 2023 layoff do not prove weakness, but they do prove Dataminr
    chose bridge-style capital rather than a fresh priced round. Until the actual terms are disclosed,
    investors cannot size the downside correctly.
  claimRefs:
  - CR025
  - CR026
  - CR027
  - CR028
  - CR031
