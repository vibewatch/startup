  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: government-concentration
    missingEvidence: Management-confirmed segment revenue mix, top agency contract values, and a renewal
      calendar for major public-sector contracts.
    whyItMatters: Public sources show a large government footprint but do not quantify whether one or
      two federal programs dominate ARR or cash flow.
    diligencePath: Request a contract ledger by customer, segment, annual value, renewal date, and recompete
      probability.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: model-quality-metrics
    missingEvidence: False-positive, precision, recall, escalation, appeal, and human-override metrics
      by product, especially First Alert and agentic AI features.
    whyItMatters: Adverse reporting proves error risk exists, but investors cannot judge how often model
      errors occur or how quickly customers can correct them.
    diligencePath: Ask for red-team reports, alert-quality dashboards, false-positive trendlines, and
      incident postmortems by product line.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: convertible-terms
    missingEvidence: Executed term sheets or summaries for the 2025 NightDragon/HSBC and Fortress convertibles,
      including maturity, coupon, discount, caps, seniority, covenants, and security package.
    whyItMatters: The bridge-style financings are central to underwriting downside, yet the public record
      does not disclose whether they are benign optionality or a real capital-structure constraint.
    diligencePath: Request financing documents and board materials that explain why convertibles were
      chosen instead of a priced equity round.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: x-dependency-share
    missingEvidence: A management-backed estimate of what share of alert volume, precision advantage,
      and public-sector value would be lost if X limited privileged access or materially raised price.
    whyItMatters: Current sources show that X access matters, but not how substitutable that feed is inside
      Dataminr’s one-million-source narrative.
    diligencePath: Ask product and engineering leadership for source-level dependency analysis, vendor
      contracts, and contingency plans for a firehose interruption.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: succession-depth
    missingEvidence: A current org chart, succession plan, and retention/attrition data for the leadership
      bench below Ted Bailey, Tiffany Buchanan, and Brian Gumbel.
    whyItMatters: The company has recently added key executives, but public sources do not show whether
      Dataminr is truly institutionalized enough to absorb founder or new-exec disruption.
    diligencePath: Request succession materials, retention packages for key roles, and a 12-month executive
      hiring plan.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR004
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-inventory
    missingEvidence: A full inventory of municipal restrictions, formal complaints, contract cancellations,
      and internal legal reviews tied to protest monitoring or privacy objections.
    whyItMatters: The public record proves controversy, but not the full denominator of procurement friction
      or how often criticism has changed a buying decision.
    diligencePath: Run a legal and sales diligence workstream covering policy objections, RFP losses,
      agency reviews, and customer escalations since 2020.
    relatedQuestionRefs:
    - QR002
    - QR003
    relatedTableRefs:
    - TR001
