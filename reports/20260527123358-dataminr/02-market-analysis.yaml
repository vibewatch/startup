    severity: material
    topic: retention-and-expansion
    missingEvidence: Net revenue retention, logo retention, seat growth, or renewal metrics by buyer segment.
    whyItMatters: Growth quality and budget durability differ materially between Fortune 50 security teams, agencies, and cost-constrained newsrooms.
