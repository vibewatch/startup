- id: TM004
  title: Growth Drivers and Adoption Constraints
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Dataminr
  - Diligence ask
  rows:
  - - Rising cyberattacks, geopolitics, and disruptive events
    - Tailwind
    - Current and structural
    - Supports cross-vertical demand for earlier warning and contextual intelligence
    - Which use cases drive the fastest expansion within the installed base?
  - - Regulatory and compliance pressure
    - Tailwind
    - Current and structural
    - Reinforces demand in cyber, financial services, and government workflows
    - Which mandates most directly influence purchase timing today?
  - - Vertical expansion via partners and Platform API
    - Tailwind
    - 2025 onward
    - Widens SAM without requiring Dataminr to own the full end application
    - What portion of new ARR is direct vs partner-sourced?
  - - Government funding mismatch and procurement friction
    - Constraint
    - Persistent
    - Delays deployment even where use case urgency is high
    - What is the median public-sector sales cycle and renewal timeline?
  - - Newsroom layoffs and cost pressure
    - Constraint
    - Current
    - Limits broad willingness to pay despite strong workflow fit
    - How many newsroom customers are full-price enterprise contracts versus discounted strategic accounts?
  - - Platform API restrictions and anti-scraping measures
    - Constraint
    - Current and rising
    - Can reduce data coverage or raise collection cost, which weakens product differentiation if not offset by partnerships
    - How exposed is Dataminr to any single data platform or access policy change?
  - - Crowded CTI / TIP comparison set
    - Constraint
    - Current
    - Pushes Dataminr to prove workflow integration and prioritization rather than early detection alone
    - What win rates look like versus Flashpoint, Recorded Future, and TIP incumbents?
  - - AI-enabled automation inside customer workflows
    - Mixed
    - Current and medium term
    - Raises demand for faster intelligence while also increasing scrutiny on ROI and feature overlap
    - Which features are proprietary enough to sustain pricing power as customer AI tooling improves?
  notes: Rows combine independent market reports, Reuters Institute, Route Fifty, GAO, and Dataminr/partner disclosures. The final row is a mixed factor because AI is both a budget tailwind and a source of substitution risk.
