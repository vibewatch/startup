company:
  name: Dataminr
chapter:
  number: 2
  title: Market Analysis
  summary: Dataminr operates across adjacent but non-identical markets — OSINT, threat intelligence, corporate security software, public-sector early warning, newsroom alerting, and financial-risk monitoring — so broad market reports are only rough outer bounds. Third-party estimates place the most relevant OSINT and threat-intelligence categories mostly in the mid-teens to low-twenties billions of dollars in 2025–2026, but Dataminr's practical SAM is narrower because spend is fragmented across CSO, CISO, government, newsroom, and financial-risk budgets and constrained by procurement friction, newsroom austerity, and public-data access limits.
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Adjacent Categories
  body: 'Dataminr should not be framed as a generic “AI company” or as a pure cyber vendor. The evidence is much more specific: the company sells real-time event, threat, and risk intelligence into at least six workflow families — corporate security, cyber defense, public sector/first alert, news, financial services, and supply-chain disruption monitoring. Those workflows overlap with open-source intelligence (OSINT), cyber threat intelligence (CTI), critical-event management, media-intelligence/newsgathering, and resilience software, but they do not map cleanly to any one analyst category. That matters because the buyer, budget line, and willingness to pay differ materially by workflow. A Fortune 50 corporate-security team buys earlier warning on physical threats, travel risk, and business disruption; a cyber team buys external detection and threat context that plugs into SIEM/SOAR/TIP systems; a newsroom buys speed and verification; a financial-services user buys earlier awareness of market-moving
    events; and a government buyer buys situational awareness or force-protection signals, often through procurement vehicles or channel partners. Included spend therefore means external real-time intelligence, not all security, all media monitoring, or all enterprise software. Excluded spend should include full SIEM budgets, broad ad-tech or brand-monitoring categories, and command-and-control systems where Dataminr does not own the core workflow. Partnerships with Control Risks, Altana, Carahsoft, AWS Marketplace, and SoftwareOne reinforce this narrower reading: Dataminr is frequently the alerting and context layer inside a larger operational stack rather than the entire system of record.'
  claimRefs:
