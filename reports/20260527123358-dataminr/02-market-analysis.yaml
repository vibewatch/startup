  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: vertical-revenue-mix
    missingEvidence: Audited or management-level disclosure of Dataminr revenue by vertical, geography, or product line.
    whyItMatters: Without mix disclosure, any bottom-up SAM or segment-penetration model is highly assumption-driven.
    diligencePath: Request board deck or banker materials showing ARR by vertical, geography, and direct vs partner channel.
