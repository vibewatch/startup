  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Public or customer-verified price points for Dataminr corporate security, cyber, news, and public-sector packages.
    whyItMatters: Pricing determines whether newsroom and public-sector buyers are realistically monetizable at scale or only strategically important logos.
    diligencePath: Collect RFPs, procurement schedules, customer invoices, or reseller quotes across at least three buyer segments.
