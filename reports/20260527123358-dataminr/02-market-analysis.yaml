- id: TM005
  title: Regulatory and Platform-Dependency Constraint Register
  columns:
  - Constraint
  - Affected segment(s)
  - Evidence
  - Why it matters
  - Diligence ask
  rows:
  - - API throttling and platform access changes
    - Cyber, news, public-sector OSINT workflows
    - Knowlesys and Mordor cite rate limits, API changes, and content restrictions
    - Dataminr's value depends on persistent access to broad, timely public signals
    - Request source concentration, fallback coverage, and access-resilience plans by platform
  - - Procurement and privacy controls
    - Government and defense
    - GAO and Route Fifty highlight high cyber/privacy risk and funding mismatches
    - Large contracts exist, but adoption can be slowed or narrowed by procurement and oversight requirements
    - Review ATO timelines, procurement vehicles, and implementation burden for public-sector deployments
  - - Newsroom austerity
    - News
    - Reuters Institute documents job losses and layoffs across U.S. newsrooms
    - Budget-constrained news buyers may renew slowly or buy smaller seats despite high product utility
    - Measure ARR concentration, logo retention, and price sensitivity across newsroom cohorts
  - - Category overlap with CTI/TIP tools
    - Cyber
    - Flashpoint and ThreatConnect frame buyer needs around integrated CTI workflows
    - Dataminr must prove it is additive, not redundant, inside existing security stacks
    - Inspect replacement rates, attach rates, and integration-led expansions in cyber accounts
  - - Partner dependence in adjacencies
    - Supply chain, government, news distribution
    - Altana, Carahsoft, AWS, and SoftwareOne materially extend distribution
    - Partners can accelerate reach but also compress margins and reduce direct customer control
    - Break out partner-sourced revenue, renewal terms, and data-rights economics
  - - Macro efficiency pressure on vendor spend
    - All segments
    - TechCrunch reported 2023 layoffs and 2025 financing framed around growth and AI
    - Even category leaders must show budget efficiency, especially in non-core segments
    - Test whether recent bookings are consolidations of existing spend or true net-new budget creation
  notes: This table isolates risks that can compress SAM or slow adoption even if top-down market growth remains healthy. Several rows reflect operational constraints rather than demand collapse.
