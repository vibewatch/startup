- id: buyers
  title: Buyer, User, Payer, and Spend Ownership by Segment
  body: 'Dataminr''s cross-vertical expansion is real, but budget ownership is fragmented. In corporate security, the usual buyer is a CSO, GSOC leader, resilience team, or duty-of-care function; the user is the security operator or analyst; and the payer is usually an enterprise security, crisis-management, or travel-risk budget. In cyber defense, the buyer shifts to the CISO organization, especially threat-intelligence, external attack-surface, digital-risk, or vulnerability teams, and Dataminr is explicitly positioned as a complement to existing SIEM, SOAR, and TIP investments. In government and emergency management, users include agency operators, first responders, or defense/security personnel, but purchase paths often run through Carahsoft, marketplace listings, or formal contracts rather than pure SaaS self-serve. In news, the user is the assignment editor, reporter, verification desk, or audience team, while the payer is the newsroom operations or tooling budget; that makes adoption
    more sensitive to macro media economics than in Fortune 50 security. Financial services is another multi-budget segment: Dataminr can sit with market-intelligence, compliance, operational-risk, ESG, or research teams. Supply-chain is the least proven as a core standalone budget owner; current evidence points more to partner-led distribution and API embedding than to Dataminr displacing existing logistics or ERP systems directly. The commercial implication is that Dataminr is not selling one product into one homogeneous budget. It is selling a shared intelligence substrate into several distinct procurement motions, each with different ACVs, proof requirements, and renewal risk.'
