- id: TM001
  title: Market Definition and Boundary Table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters to Dataminr
  rows:
  - - Corporate security / resilience
    - External threat, event, travel-risk, crisis, and facility-alerting budgets
    - Core guard force labor, cameras/access-control hardware, full CEM suites
    - CSO, GSOC, resilience leader; enterprise security or duty-of-care budget
    - This is one of Dataminr's clearest core workflows and supports higher-ACV enterprise deployments.
  - - Cyber defense / CTI
    - External cyber-risk, vulnerability, digital-risk, and threat-intelligence tooling
    - Endpoint, network, and full SIEM/SOAR platform spend
    - CISO, CTI lead, external attack-surface or vulnerability owner
    - Dataminr complements internal telemetry and helps justify up-stack cyber expansion.
  - - Public sector / emergency management / defense
    - Early-warning, force-protection, disaster-response, and agency situational-awareness spend
    - Command-and-control platforms, general IT modernization, unrelated mission systems
    - Agency program office, emergency-management leader, procurement vehicle
    - Large budgets exist, but contracts are concentrated and sales cycles are longer.
  - - News / media intelligence
    - Breaking-news detection, verification support, and newsroom workflow tooling
    - Broad media monitoring, ad-tech, audience analytics, CMS spend
    - Editor, assignment desk, verification team; newsroom operations budget
    - Strategic logo value is high, but buyer budgets are structurally constrained.
  - - Financial services event intelligence
    - Market-moving event feeds for trading, compliance, risk, and ESG workflows
    - Market data terminals, core risk engines, general research platforms
    - Risk, compliance, market-intelligence, or research budget owner
    - Useful because one vertical can touch several internal budgets and high-value workflows.
  - - Supply-chain / partner-embedded resilience
    - External disruption signals for supplier, route, and network risk
    - ERP, TMS, procurement suites, or broad supply-chain planning budgets
    - Partner platform owner or resilience team; often API or embedded spend
    - Evidence points to adjacency and partner-led distribution rather than standalone dominance.
  notes: 'Boundary logic is evidence-led: included spend is limited to external real-time intelligence workflows Dataminr actually markets; excluded spend removes broader adjacent software categories that would overstate TAM.'
