- id: TP004
  title: Pricing / packaging comparison and substitute routes
  columns:
  - Vendor / substitute
  - Public price signal
  - Packaging cue visible in source pack
  - Likely budget owner
  - Implication
  rows:
  - - Dataminr
    - No public list price visible
    - Request demo across products; enterprise packaging across corporate security, cyber defense, and news
    - Corporate security, CISO, public sector, newsroom leadership
    - Sales-led packaging supports value-based pricing but forces diligence on realized contract economics
  - - Recorded Future
    - No public list price visible
    - Book a demo / platform-led subscription sale
    - CISO, threat-intelligence teams, government security buyers
    - Pricing opacity is normal for strategic CTI platforms; value story is breadth plus analyst context
  - - Flashpoint
    - No public list price visible
    - Request pricing and demo; platform plus services and analyst support
    - Threat-intelligence, fraud, physical security, public sector
    - Services-heavy packaging can justify higher ACVs when teams want finished intelligence, not raw feeds
  - - ZeroFox
    - No public list price visible
    - Request demo / pricing; platform plus disruption and services
    - CISO, digital-risk, brand protection, executive protection
    - Packaging likely competes on broader external-risk coverage rather than on low-cost alerting
  - - Babel Street
    - No public list price visible
    - Book a demo; modular threat, identity, and vendor-risk positioning
    - Government missions, investigations, compliance, enterprise risk
    - Mission-grade packaging supports premium positioning where multilingual identity or vendor risk matters
  - - Palantir
    - No public list price visible
    - Platform / operating-system sale, not self-serve tooling
    - Defense, operations, enterprise transformation, CIO/COO
    - Budget hurdle is higher, but embedded workflow ownership can be stickier than an alerting tool
  - - Janes
    - No public list price visible
    - Book a demo / login model for datasets and intelligence products
    - Defense intelligence, planning, logistics, procurement
    - Subscription-like data packaging fits specialist defense workflows rather than broad enterprise monitoring
  - - Meltwater / Brandwatch
    - No public list price visible
    - Request pricing or demo for PR, media, social, and consumer intelligence suites
    - PR, communications, marketing, insights
    - Adjacent competition is strongest where Dataminr is pitched for reputation or narrative monitoring rather than hard security operations
  - - Internal build / existing stack
    - Uses already-owned tools and staff time
    - SIEM, TIP, PR tools, social listening, advisory feeds, and analysts combined manually
    - Existing functional owners
    - Often looks cheaper on paper and can slow platform consolidation even when it creates more fragmented workflows
  notes: 'The strongest pricing signal in this source pack is the lack of visible list pricing. The implication is itself important: buyers should expect negotiated enterprise contracts, multi-stakeholder sales cycles, and large variance between list-equivalent positioning and realized deal economics.'
  enumerationScope:
    coverage: partial
    basis: The table covers public packaging cues visible on official pages and the most credible substitute route, but it cannot show realized pricing, discounts, or contract terms because those are not disclosed in the reviewed source pack.
