- id: TP003
  title: Ownership, financing, and government-footprint signals
  columns:
  - Competitor
  - Public / private status
  - Supportable financing or ownership signal
  - Government-footprint signal
  - Implication for Dataminr
  rows:
  - - Dataminr
    - Private
    - Raised $85M in 2025; TechCrunch still references prior $4.1B valuation from 2021
    - 100+ U.S. government agencies and 20+ international governments
    - Large private capitalization plus public-sector reach make Dataminr hard to dismiss as a niche product
  - - Recorded Future
    - Subsidiary of Mastercard
    - Mastercard acquisition at $2.65B; prior 2019 Insight deal at $780M
    - Governments and critical infrastructure positioning; ~1,900 clients in 75 countries
    - Strategic owner can fund cross-sell into payments, fraud, and enterprise security
  - - Flashpoint
    - Acquired-stage private company
    - Tracxn profile lists $49M funding and acquired status
    - Defense, law enforcement, intelligence community, public sector called out directly
    - Even without public valuation transparency, public-sector and analyst depth are credible
  - - ZeroFox
    - Private-equity owned private company
    - Haveli completed take-private deal; $1.14 per-share cash and Nasdaq delisting
    - ZeroFox cites large public-sector customers alongside enterprise verticals
    - PE ownership can sharpen commercial discipline and product focus
  - - Babel Street
    - Private
    - Third-party profile cites $31.7M ARR, $95M valuation, and no outside funding; confidence is limited
    - National defense and law-enforcement buyers are explicit on official site
    - Supportable public financial data is thin, but mission footprint is clear
  - - Palantir
    - Public
    - IR and SEC-filing structure provide the clearest disclosure posture in the set
    - Army Vantage and defense workflow pages show deep government embed
    - Public-market scale and workflow depth make Palantir a high-end adjacent threat
  - - Janes
    - Acquired-stage private company
    - Tracxn says Montagu acquired Janes in 2019
    - Core product is defense and security intelligence for planning and readiness
    - Janes is narrower than Dataminr but highly credible in defense procurement workflows
  - - Meltwater
    - PE-backed private company
    - Goodwin documented Marlin and Altor agreement to acquire Meltwater
    - Government footprint is not the center of the pitch; PR and comms are
    - Competition is mostly for communications and reputation budgets, not cyber mission budgets
  - - Brandwatch
    - Part of Cision Group
    - Official acquisition note says Cision bought Brandwatch for $450M
    - Government fit is limited in public materials
    - Competition is budget-adjacent and strongest in consumer, reputation, and market-intel workflows
  notes: This table isolates public/private posture, financing, and government-footprint signals because those factors heavily influence buyer trust, distribution power, and likely commercial discipline. Private-company figures for Flashpoint, Babel Street, and Janes are treated as directional only where the source itself is profile-based.
