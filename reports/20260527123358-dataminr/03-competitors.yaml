tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Ownership / valuation signal
  - Core workflow
  - Data access / footprint signal
  - Primary limitation versus Dataminr
  rows:
  - - Dataminr
    - Direct real-time event, threat, and risk intelligence
    - Private; 2025 financing after prior 2021 $4.1B valuation reference
    - Earliest public-signal detection across corporate security, cyber defense, public sector, and news
    - 1M+ public data sources; 100+ U.S. agencies; 20+ international governments; 1,500+ newsrooms
    - Public-data edge is strong, but proprietary finished-intelligence or system-of-record depth is less explicit
  - - Recorded Future
    - Direct cyber / geopolitical intelligence
    - Mastercard agreed to acquire it for $2.65B; independent subsidiary framing
    - Cyber threat intelligence plus geopolitical and disinformation context
    - 1M+ sources; about 1,900 clients in 75 countries; government critical-infrastructure positioning
    - More cyber-centric than Dataminr’s broader cross-functional event-alert packaging
  - - Flashpoint
    - Direct threat-intelligence and investigations platform
    - Acquired-stage in Tracxn; $49M total funding in profile data
    - Finished intelligence, investigations, vulnerability, physical and national security workflows
    - 3.6 petabytes from open and difficult-to-reach spaces; public-sector and defense focus
    - Less obvious newsroom or broad corporate-crisis positioning than Dataminr
  - - ZeroFox
    - External cybersecurity / digital risk protection
    - Taken private by Haveli in 2024 at $1.14 per share cash to shareholders
    - Discovery, validation, disruption, takedowns, and external cyber risk
    - 12B+ signals; thousands of customers including major public-sector organizations
    - More disruption- and takedown-oriented than broad real-time event awareness
  - - Babel Street
    - Identity, vendor, and strategic risk intelligence
    - Private; third-party profile cites ~$31.7M ARR and ~$95M valuation
    - Mission-grade multilingual risk intelligence and identity resolution
    - Rights-cleared mission-grade data; national defense, law enforcement, enterprise and fintech buyers
    - Less evidence of broad newsroom or mass-event alerting than Dataminr
  - - Palantir
    - Government and enterprise operating system
    - Public company with IR and SEC reporting
    - Deep operational software for defense decision-making, enterprise workflows, and private-network AI
    - Army Vantage and defense workflow embedding are stronger than Dataminr’s operational embed
    - Not primarily an external public-signal alerting product
  - - Janes
    - Defense and security intelligence incumbent
    - Acquired-stage; Montagu ownership signal in Tracxn
    - Validated defense datasets and analysis for planning, logistics, and forecasting
    - Expert-validated OSINT, exclusive interviews, machine-readable defense data
    - Narrower, defense-heavy remit and weaker broad commercial incident-alert fit
  - - Meltwater
    - Adjacent media and social intelligence
    - 2023 PE take-private agreement by Marlin and Altor
    - PR, communications, and marketing intelligence across media, social, and AI signals
    - 27,000+ organizations; 1.3B documents per day; 240+ languages
    - Weak substitute for cyber or mission intelligence, stronger for communications budgets
  - - Brandwatch
    - Adjacent consumer intelligence and social suite
    - Official post says Cision acquired Brandwatch for $450M
    - Consumer intelligence, search intelligence, social management, and media intelligence
    - 100M+ sources claimed; belongs to Cision Group Ltd
    - Closer to comms and insight workflows than threat-operations workflows
  - - Internal build / multi-tool status quo
    - Status-quo substitute
    - Uses existing staff and incumbent tools rather than a new platform purchase
    - Analysts assemble feeds from SIEM, TIP, PR, social, and advisory tools
    - Strength depends on existing stack and in-house tradecraft
    - Usually slower and more fragmented than Dataminr’s packaged early-warning workflow
  notes: This table is a focused landscape of the canonical peer set plus the most credible substitute route. Ownership and valuation cells use only supportable public signals; where data is thin, the cell states that directly instead of inferring a precise current valuation.
