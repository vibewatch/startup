- id: direct-intelligence-peers
  title: Direct intelligence peers and public-private ownership signals
  body: 'Recorded Future, Flashpoint, ZeroFox, and Babel Street are the clearest direct or near-direct competitors because they sell intelligence products to overlapping security and public-sector buyers. Recorded Future pairs a large-scale cyber-intelligence platform with geopolitical and disinformation framing, and its sale to Mastercard validates strategic value at a multi-billion-dollar level while preserving an ‘independent platform’ story. Flashpoint differentiates around primary-source collection from difficult-to-reach spaces, finished intelligence, geospatial analysis, and heavy analyst support. ZeroFox comes from an external-cybersecurity angle, bundling discovery, validation, and disruption across cyber, brand, executive, and physical risk, and its 2024 take-private transaction moved it from public-market scrutiny back to private-equity ownership. Babel Street is the most identity- and mission-centric of the group: it now frames itself around agentic risk intelligence, multilingual
    data, and risk domains including identity and vendor exposure. Together, these peers show that Dataminr is not just competing against another alert stream; it is competing against vendors that increasingly package collection, analysis, workflow, and ownership narratives into one enterprise sale.'
