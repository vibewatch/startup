  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Current Dataminr, Recorded Future, Flashpoint, ZeroFox, and Babel Street contract pricing, discounting, seat counts, and realized ACVs.
    whyItMatters: Without real contracts it is difficult to test whether Dataminr wins because it is better or because buyers tolerate opaque pricing for a mission-critical workflow.
    diligencePath: Request three recent customer contracts or order forms per direct peer, plus any available pricing benchmark memos or procurement comparisons.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: substitute-routes
    missingEvidence: Win-loss data showing when customers kept Dataminr only for alerting while routing investigation, action, or reporting into another platform.
    whyItMatters: Multi-homing is one of the clearest ways Dataminr could lose wallet share without a direct rip-and-replace event.
    diligencePath: Review ten recent renewals and losses, classify the owning workflow after the alert, and interview frontline sales leaders on the most common substitute patterns.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP005
  - type: enumeration-incomplete
    severity: minor
    topic: landscape-coverage
    missingEvidence: A broader census of regional OSINT vendors, specialist public-safety tools, and bundled SIEM or TIP substitutes beyond the canonical set.
    whyItMatters: The chapter covers the required canonical set, but a fuller landscape would sharpen local displacement risk and procurement alternatives.
    diligencePath: Extend the source-discovery pack to regional specialists, managed-security vendors, and incumbent suite modules in Dataminr's strongest verticals.
    relatedQuestionRefs:
    - QP001
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: minor
    topic: private-peer-financing
    missingEvidence: Audited current valuation and revenue disclosures for Flashpoint, Babel Street, and Janes rather than profile-based estimates or ownership markers.
    whyItMatters: The public/private posture of several peers influences how much pricing pressure or investment capacity Dataminr may face over the next cycle.
    diligencePath: Pull subscription databases or management presentations that disclose latest sponsor ownership, debt structure, ARR, or board-approved valuation marks.
