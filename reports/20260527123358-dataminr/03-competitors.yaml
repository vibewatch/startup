- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Dataminr moat claim
  - Specific threat
  - Severity
  - Evidence from peer set
  - Diligence ask
  rows:
  - - Earliest public-data alerting
    - Peers can wrap agentic AI and analyst services around similar open-source streams
    - High
    - Recorded Future, Flashpoint, ZeroFox, and Babel Street all now market AI-enhanced intelligence workflows
    - Request measured win rates where earliest alert speed changes customer outcomes, not just demo experience
  - - Cross-functional packaging across cyber, corporate security, and news
    - Adjacent vendors can peel off narrower workflows one budget at a time
    - Medium-High
    - Meltwater and Brandwatch own comms workflows; Palantir and Janes own deeper mission workflows
    - Map which modules renew together and which sit in accounts alongside substitute tools
  - - Government footprint
    - Palantir and Janes have deeper mission-system gravity in defense and operations
    - High
    - Army Vantage, Gotham, and Janes planning datasets signal deeper operational embed
    - Get case studies showing Dataminr owns the decisive workflow rather than just feeding another platform
  - - Cyber-defense expansion
    - Flashpoint and Recorded Future market more finished intelligence and hard-to-reach collections
    - High
    - Flashpoint emphasizes difficult-to-reach spaces and analyst support; Recorded Future spans cyber, geopolitics, and disinformation
    - Test whether Dataminr wins on full CTI budgets or only on first-alert augmentation
  - - Platform stickiness
    - Multi-homing keeps Dataminr useful but can cap wallet share and bargaining power
    - Medium
    - Official pages repeatedly stress integrations into existing workflows rather than replacement of those systems
    - Measure attach rate to downstream workflows and quantify where Dataminr is the system of action versus a signal source
  - - Opaque enterprise pricing
    - Customers may benchmark Dataminr against narrower tools that look cheaper on a per-seat or per-team basis
    - Medium
    - Public sites show demos and pricing requests rather than transparent rate cards
    - Review realized pricing, uplift history, and proof of ROI by use case and buyer persona
  - - Defensibility narrative
    - Competitor-authored comparisons already attack Dataminr on workflow depth and alert quality
    - Medium-High
    - Flashpoint directly claims Dataminr lacks geospatial search and refined alerts
    - Validate Dataminr’s geospatial, investigative, and signal-refinement performance with customer references and product testing
  notes: Severity is an underwriting judgment rather than a statistical forecast. The goal is to isolate where Dataminr’s advantage is likely structural versus where it could compress if a buyer prioritizes analyst depth, exclusive collections, or workflow ownership.
