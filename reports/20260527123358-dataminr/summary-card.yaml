  topStrengths:
    - >-
      Dataminr has built a cross-functional real-time intelligence platform that spans corporate security, cyber
      defense, public sector, and newsroom workflows rather than a single-point use case.
    - >-
      Public customer proof shows meaningful penetration across blue-chip enterprises, government agencies, and more
      than 1,500 newsrooms.
    - >-
      The company still has access to institutional capital and strategic relationships, as shown by the 2025 financings
      from NightDragon/HSBC and Fortress.
    - >-
      Product innovation around ReGenAI, agentic AI, and integration-led distribution suggests Dataminr is still
      investing to widen its workflow moat.
  topRisks:
    - >-
      The 2025 financing stack relied on convertibles and credit instead of a new priced equity round, leaving the 2021
      $4.1B mark looking stale and potentially unsupported.
    - >-
      Public disclosure remains thin on gross margin, burn, cash runway, NRR, customer concentration, and the detailed
      economic terms of the 2025 instruments.
    - >-
      Dataminr faces recurring privacy and civil-liberties criticism tied to police and government surveillance use
      cases built on public-social-data monitoring.
    - >-
      Product effectiveness still depends on continued access to third-party public-data sources and on model quality in
      noisy real-time environments.
    - >-
      Competitors such as Recorded Future, Palantir, Flashpoint, Babel Street, and ZeroFox give buyers viable
      alternatives when they prioritize deeper threat-intelligence workflows or finished intelligence.
  unresolvedGaps:
    - Public sources do not disclose Dataminr's current cash balance, burn, gross margin, or net revenue retention.
    - >-
      The detailed conversion terms, discounts, priority, and covenant structure of the 2025 NightDragon/HSBC and
      Fortress financings are not public.
    - >-
      Public evidence does not resolve customer concentration, renewal quality, or contract value by segment beyond a
      small set of named references.
    - Founder attribution and current governance/board disclosure remain incomplete in public materials.
    - >-
      Public sources are much stronger on product breadth and logo count than on measured model quality, false-positive
      rates, and workflow ROI by cohort.
