  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer jobs
        blocks:
          - type: paragraph
            body: >-
              Competition around Dataminr is broader than one peer set because buyers can solve the underlying problem
              in several different ways. Dataminr packages real-time external awareness for corporate security, cyber
              defense, public sector, and newsrooms, so it overlaps with threat-intelligence vendors,
              external-cybersecurity platforms, defense-intelligence incumbents, and adjacent media or
              consumer-intelligence tools. The common thread is not one product category but a buyer desire to know
              sooner and act faster. Dataminr’s own positioning matters here: it sells early warning from public data at
              large scale, then routes that intelligence into existing security, resilience, and newsroom workflows.
              That broad packaging expands the addressable budget, but it also exposes the company to more substitute
              routes than a narrow cyber-only vendor. In practice, many customers can multi-home: they can keep Dataminr
              for first alerting, use another platform for finished intelligence or takedowns, and still rely on
              internal systems for action and reporting. The competitive question is therefore less about who matches
              every feature and more about which vendors win each leg of the workflow and who becomes the durable system
              of record.
