      - number: '8.2'
        title: The real 2025 signal is bridge-style financing, not valuation affirmation
        blocks:
          - type: paragraph
            body: >-
              The strongest reason to treat the 2021 mark skeptically is not abstract multiple compression; it is the
              specific structure Dataminr used in 2025. In March the company raised $85 million through a combination of
              convertible financing and credit, and TechCrunch reported that the instrument was pre-IPO financing that
              explicitly did not set a valuation while promising investors a discount to an IPO price or subsequent
              round. A month later Dataminr announced a second $100 million convertible financing from Fortress. Private
              Equity Wire made the subtext plain: convertible debt is favored because it raises capital while minimizing
              equity dilution ahead of a potential IPO. None of that proves distress, and the company’s customer base
              and ARR claim suggest real operating scale. But it does mean public markets have not been asked to clear
              common equity since 2021. Combined with the 2023 layoff, the sequence reads as a yellow flag on stale
              marks: Dataminr found capital, but it found it in structures designed to postpone a hard repricing.
