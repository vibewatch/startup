          - type: paragraph
            body: >-
              The quality of Dataminr's public customer proof varies sharply by segment. News and public sector are best
              supported. The Associated Press is the cleanest newsroom proof because Dataminr publishes a named case
              study with AP's Vice President of Global Safety, Risk and Resilience describing centralized risk
              monitoring and a reduction in manual scraping, and AP separately shows Dataminr embedded into AP
              Storytelling. NATO is the strongest named defense proof because Dataminr and PRNewswire both describe an
              expanded First Alert deployment. HP is the strongest named enterprise corporate-security proof because
              Dataminr publishes a detailed executive-protection page and a named HP leader quote about mobile alerts
              and itinerary-based monitoring. Oklahoma emergency management gives Dataminr a concrete state-level
              public-safety proof point. By contrast, OpenAI is only publicly evidenced through a TechCrunch line and a
              Dataminr spokesperson quote, while FEMA is supported only by a historical privacy-review file title rather
              than a readable current deployment record. That asymmetry is the key customer- proof takeaway: Dataminr
              has enough named references to prove real use, but not enough deep, independently quantified references to
              prove revenue weight or renewal quality across the full base.
