      - number: '2.4'
        title: Adoption Drivers, Constraints, and Platform Dependencies
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers are also the reasons Dataminr spans multiple categories. Independent and
              company sources alike point to rising cyberattacks, geopolitical volatility, compliance pressure, and the
              need for faster real-time intelligence sharing as structural tailwinds. OSINT reports show growing
              private-sector adoption beyond government and defense, while Dataminr's own expansion messaging and
              partner activity indicate demand from corporate security, finance, supply-chain, and public-sector users.
              But the constraints are equally important. Government buyers face fragmented structures, mandates that can
              outpace funding, and procurement and privacy controls that lengthen sales cycles. Newsrooms face severe
              budget pressure: Reuters Institute documents almost 2,700 lost U.S. newsroom jobs in 2023 followed by
              further cuts in early 2024, which means even a valuable tool can be hard to fund broadly. Public-data
              dependence is another hard constraint, not a theoretical one. Knowlesys and Mordor both cite API
              restrictions, anti-scraping measures, privacy mandates, and adversarial data poisoning as factors that can
              reduce visibility or raise collection costs. Category crowding also matters: Flashpoint, ThreatConnect,
              and adjacent CTI/TIP vendors frame the buyer decision around not just early detection but analyst support,
              vulnerability context, workflow integration, and prioritization. Dataminr therefore benefits from real
              market tailwinds, but the investable question is whether those tailwinds overcome split budgets,
              data-access friction, and the need to prove workflow ROI separately in each vertical.
            claimRefs:
