  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform architecture and data strategy
        blocks:
          - type: paragraph
            body: >-
              Dataminr consistently describes the product as a layered AI platform rather than a narrow alerting
              application. The public architecture starts with broad public-data ingestion across text, image, video,
              audio, and sensor signals, then applies Multi-Modal Fusion AI to discover candidate events, risks, and
              threats at scale. That detection layer is followed by description and context layers: ReGenAI turns
              fast-moving detections into continuously rewritten Live Briefs, while Intel Agents and other agentic
              workflows add the surrounding context, prioritization, and next-best-action logic that customers need to
              decide quickly. The company's own technical writing is useful here because it goes beyond generic
              marketing and explains crossmodal attention between image and text embeddings, plus the use of computer
              vision, natural-language understanding, audio, and anomaly-detection models. Dataminr also makes unusually
              aggressive scale claims for a private vendor, including more than 1 million sources, more than 50
              proprietary LLMs, and 43+ terabytes of daily data processed. Those numbers help explain why the product
              can serve physical, cyber, and news workflows from one platform, but they are still mostly management or
              partner statements rather than independently benchmarked technical disclosures.
