      - number: '3.3'
        title: Government and defense workflow incumbents
        blocks:
          - type: paragraph
            body: >-
              Palantir and Janes matter because they compete at a different layer of the stack. Palantir’s official
              positioning is not primarily about being first to a public signal; it is about integrating data,
              decisions, and operations, with Gotham for defense decision-making, Foundry for enterprise operating
              workflows, and AIP for controlled AI execution on private networks. That is a deeper workflow claim than
              Dataminr’s external-awareness posture, and the Army Vantage reference underscores long-running operational
              embed inside government. Janes is similarly different from Dataminr, but for defense and intelligence
              buyers it can still be a substitute in key moments. Janes markets validated, machine-readable defense and
              security intelligence that feeds logistics, planning, wargaming, and strategic forecasting. Its
              human-expert validation and exclusive interviews give it a more curated, tradecraft-heavy posture than
              Dataminr’s automated public-data scanning. When a buyer needs a force-planning dataset or a defense-grade
              operational picture, Palantir and Janes have stronger workflow gravity than Dataminr; when a buyer needs
              the earliest possible public warning across a broad risk surface, Dataminr has the better starting point.
