      - number: '1.4'
        title: Scale signals, milestones, and adverse diligence flags
        blocks:
          - type: paragraph
            body: >-
              On operating scale, the core picture is favorable. Official 2025 materials say Dataminr is approaching
              $200 million in ARR, and the company’s customer base now spans at least 800 organizations, including deep
              Fortune 50 penetration, more than 100 U.S. agencies, 20-plus international governments, and more than
              1,500 newsrooms. The business also appears to have meaningful strategic anchoring inside public-sector and
              defense workflows: TechCrunch cites a five-year, $282 million U.S. Department of Defense contract and
              names NATO among customers. Product velocity also remained visible in 2024-2025 through ReGenAI, planned
              Context Agents, and a broader partner-network push. But the chapter-one downside flags are real. Public
              headcount signals are inconsistent—official disclosures moved from 900-plus employees in 2022 to roughly
              800 in 2024, while third-party 2025-2026 datasets point to a range closer to the high-700s or low-800s.
              The company also cut around 20% of staff in late 2023, with management tying the move to macro pressure,
              efficiency, AI shifts, and a push toward profitability. In parallel, Dataminr remains exposed to a
              long-running surveillance criticism set: TechCrunch’s 2025 financing coverage cites prior reporting on
              law-enforcement use around protests, while its 2021 Series F story revisits controversy around
              data-sharing and potential downstream misuse by customers. Those issues do not negate Dataminr’s
              commercial traction, but they do matter for diligence because they intersect directly with go-to-market
              concentration, regulatory sensitivity, and reputational risk in the same public-sector markets that now
              support growth.
