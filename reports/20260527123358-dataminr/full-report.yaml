      - - X / platform dependency
        - Platform-access change
        - Material restriction, major repricing, or loss of written approval for current use case
        - Pause underwriting until management quantifies signal substitution and margin impact
      - - Surveillance / privacy backlash
        - Policy or customer escalation
        - >-
          Two or more material public-sector cancellations, investigations, or council fights tied to surveillance
          concerns
        - Re-rate public-sector durability downward and revisit reputation risk
      - - Government concentration
        - Renewal concentration evidence
        - Management cannot show diversified renewal calendar or segment mix after diligence
        - Treat government concentration as higher than modeled and discount valuation support
      - - AI quality and agentic autonomy
        - Model-risk disclosure failure
        - Management cannot provide false-positive metrics, override controls, and postmortem process
        - Do not underwrite agentic upsell or predictive-AI expansion value
      - - Capital-structure pressure
        - Convertible term opacity
        - No term-sheet visibility on maturity, covenant, or conversion economics
        - Assume financing overhang remains a material downside driver
      - - Competitive pressure
        - Win-loss deterioration
        - Management shows rising losses or discounting versus Recorded Future, Palantir, Flashpoint, or ZeroFox peers
        - Lower confidence in margin expansion and public-sector/enterprise share gains
      - - Key-person and bench risk
        - Leadership churn
        - Departure of Bailey, Buchanan, or Gumbel without clear successor and transition plan
        - Move to a higher execution-risk rating until bench strength is evidenced
    notes: >-
      Thresholds emphasize observable events because public disclosure is too sparse to support false numerical
      precision on concentration, margins, or conversion economics.
