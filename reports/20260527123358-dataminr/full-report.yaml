        title: Durability and expansion visibility
        blocks:
          - type: paragraph
            body: >-
              Dataminr's public customer evidence implies stickiness but stops short of proving it. The use cases that
              are visible—executive protection, emergency management, force protection, newsroom alerting, crisis
              communications, and market-moving intelligence—are inherently high-consequence workflows where switching
              costs can be meaningful once alerts are integrated into daily operating procedures. There are several
              expansion proxies: NATO is described as an expanded partnership, AP has progressed from risk-monitoring
              use toward newsroom workflow embedding, and Esri describes a transition of existing First Alert customers
              to a richer map experience. TechCrunch also reports a five-year, $282 million Department of Defense
              contract, which at minimum suggests one large multi-year federal relationship. But none of these public
              signals answer the core durability questions an investor actually needs: Dataminr does not publish NRR,
              GRR, churn, contract terms, seat counts for named accounts, or top-customer concentration. Public evidence
