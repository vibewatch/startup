      - number: '2.2'
        title: TAM, SAM, SOM, and Contradictory Market-Size Lenses
        blocks:
          - type: paragraph
            body: >-
              Top-down market sizing is the chapter's biggest methodological trap. The adjacent market reports fetched
              for this run do not agree on scope or even on what the unit of analysis is. The Business Research Company
              and Future Market Insights put the threat-intelligence category in roughly the $13–16B range in 2025–2026.
              OSINT reports are wider still: Global Market Insights places the category at $15.9B in 2026, while Mordor
              Intelligence places it at $21.06B, and a much lower-quality Proficient Market Insights page publishes an
              implausible long-range OSINT forecast in the trillions. That spread is not a reason to average all numbers
              together. It is a reason to bound the market more tightly around what Dataminr actually monetizes.
              Dataminr's real market is narrower than “all OSINT” because not every OSINT use case buys a high-end,
              always-on, multi-modal alerting platform, and narrower than “all threat intelligence” because the company
              does not capture the entirety of internal-telemetry, endpoint, or SIEM spend. A practical SAM therefore
              sits inside cross-vertical real-time intelligence budgets for large enterprises, public-sector agencies,
              financial-risk teams, and premium news organizations. Near-$200M ARR is meaningful proof of demand, but it
              still implies low penetration versus any mid-teens-to-low-twenties-billion adjacent category estimate. In
              other words, the upside case depends more on vertical expansion, deeper enterprise wallet share, and
              partner distribution than on claiming the whole syndicated OSINT or CTI TAM.
