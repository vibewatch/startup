      - number: '7.2'
        title: Capital Structure and Customer Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              The second major underwriting risk is financial and structural rather than narrative. Dataminr’s 2025
              funding sequence is telling: after a 2023 workforce reduction designed to create runway, the company
              raised an $85 million hybrid of convertible financing and credit, added an SPV for still more convertible
              capacity, and then closed a separate $100 million convertible from Fortress a month later. That is not
              proof of distress—official sources still show demand, ARR scale, and broad customer adoption—but it is
              strong evidence that management preferred bridge-style capital to a fresh priced round. In a private
              company that still does not disclose cash, burn, margin, retention, or customer concentration, that choice
              should be read as valuation sensitivity and financing-structure pressure until proven otherwise. Public
              sources also show a meaningful government footprint: 100-plus U.S. agencies, 20-plus international
              governments, a reported five-year DoD contract, an active DISA award, and broad procurement-vehicle
              coverage. Those facts are positive for demand, but they also mean contract renewal, political scrutiny, or
              budget shifts could transmit quickly into ARR. The public evidence is strongest on scale and weakest on
              mix. Underwriters can see enough to know government is important; they cannot yet see enough to know
              whether Dataminr is comfortably diversified across enterprise, defense, public safety, and news. That is
              why the most useful diligence is not another market-sizing slide but a contract ledger, renewal calendar,
              and full disclosure of the 2025 convertibles’ economics.
