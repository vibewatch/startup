            body: >-
              Dataminr's strongest public evidence shows the product being embedded inside operating workflows rather
              than used as a casual dashboard. AP uses the product to protect journalists in conflict zones and Dataminr
              alerts now appear directly inside AP Storytelling. HP uses it for executive travel and event protection,
              with tailored alerts tied to executive itineraries. Oklahoma emergency management uses First Alert in
              incident response. Public-sector organizations can buy through Carahsoft's NASPO pathways and through AWS
              Marketplace, while Esri says existing First Alert customers are being migrated to ArcGIS Basemaps.
