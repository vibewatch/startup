        title: Exhibits
        blocks:
          - type: callout
            title: The Main Risk Is Budget Fragmentation, Not Lack of Category Growth
            body: >-
              The adjacent OSINT and threat-intelligence categories are growing, but Dataminr cannot monetize those
              totals uniformly. Enterprise corporate-security budgets are much healthier than newsroom budgets;
              public-sector budgets can be large but are procurement-heavy; and public-data access constraints can erode
              coverage quality or raise collection cost. Investors should therefore treat Dataminr as a cross-vertical
              workflow platform with uneven monetization potential, not as a direct proxy for any single published TAM
              figure.
