      - number: '8.3'
        title: Comparable context supports a scaled company, but not a 20x ARR private entry
        blocks:
          - type: paragraph
            body: >-
              The closest supportable strategic comparable is Recorded Future, which Mastercard bought for $2.65
              billion. Payments Dive also reported approximately $300 million of annual revenue, implying an acquisition
              multiple of roughly 8.8x revenue—healthy, but nowhere near Dataminr’s stale 20.5x ARR mark. ZeroFox offers
              a different lesson: it went private at $1.14 per share after reporting $188.4 million of ARR and positive
              free cash flow, reminding investors that public cyber-adjacent markets do not always reward scale with
              premium valuations. Meltwater’s take-private, while more media-intelligence than threat-intelligence,
              reinforces the point that information vendors can migrate to private ownership when public support is
              weak. Palantir is the obvious public multiple context, but at roughly 62.7x trailing sales and more than
              $319 billion of market cap in May 2026 it is an AI-market exception, not a sane base comp. Flashpoint,
              Babel Street, and Janes further suggest that exclusivity of collection, mission-grade workflow depth, and
              validated defense intelligence matter as much as early warning alone.
