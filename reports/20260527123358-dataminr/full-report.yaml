      - number: '7.3'
        title: Competition, AI, and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Dataminr is not defending a static niche. The competitive field around real-time threat, risk, and
              intelligence workflows is getting better capitalized and more platform-like, not weaker. Recorded Future
              is moving under Mastercard with explicit scale support; ZeroFox has fresh private-equity backing;
              Flashpoint markets AI-enabled threat workflows; and Palantir continues to sell an AI platform into
              adjacent mission-critical decision environments. Dataminr’s answer is to deepen product ambition, not to
              narrow it. The company’s agentic roadmap shows autonomous context generation now, client-tailored context
              next, and predictive intelligence in 2026. That roadmap may support expansion, but it also raises the
              operational stakes of model error. Adverse reporting already documents false positives in
              protest-monitoring contexts, while public sources still do not disclose precision, recall, appeal rights,
              or kill-switch processes for the products that matter most in government and security workflows. Dataminr
              has real mitigants here: ISO 42001 plus prior ISO 27001/27701 suggest the company takes governance more
              seriously than many private AI vendors, and the recent CFO/COO hires show management knows it must
              professionalize for the next stage. The residual risk is that Dataminr is scaling product scope, channel
              complexity, and public-sector sales all at once, after a major layoff and while its executive bench is
              still being built out. That combination is survivable, but it is not low-risk execution.
            claimRefs:
