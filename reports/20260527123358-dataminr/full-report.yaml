      - number: '3.5'
        title: Where Dataminr leads, where it lags, and the adverse moat case
        blocks:
          - type: paragraph
            body: >-
              Dataminr’s clearest lead remains the combination of public-data breadth, speed-to-detection, and packaging
              across multiple buyer groups. The company can credibly sell into corporate security, cyber defense, public
              sector, and newsrooms with one real-time awareness story, and its government footprint and newsroom reach
              reinforce that breadth. The lagging edges are just as clear. Rivals such as Flashpoint, Recorded Future,
              Babel Street, Palantir, and Janes market more explicit private-source access, analyst-written finished
              intelligence, or deeply embedded operational workflows. ZeroFox adds disruption and takedown capabilities
              that Dataminr does not foreground. That makes the strongest adverse view of Dataminr’s defensibility
              straightforward: if customers decide that first-alert speed is only one input, and the real value sits in
              exclusive access, curated intelligence, or system-of-record workflow control, Dataminr can be pushed down
              toward a signal layer instead of the owning platform. Flashpoint’s direct comparison page, while
              vendor-authored, is revealing because it attacks Dataminr exactly on that axis. As more peers wrap agentic
              AI around their own proprietary data and workflows, Dataminr’s moat looks durable only if it can keep
              converting alerting superiority into the decision layer, not just the detection layer.
