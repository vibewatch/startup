      - number: '7.4'
        title: Residual Exposure, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The key investment question is not whether Dataminr faces risk; it is which risks are severe enough to
              break the underwriting case and which are manageable with the right diligence. The strongest adverse
              evidence in this chapter is not generic startup noise. It is specific: documented police use around
              protected protests, documented reliance on privileged platform access, documented false positives,
              documented use of convertibles rather than repricing equity, and documented government footprint without
              disclosed segment concentration. The company’s strongest mitigants are also concrete: broad enterprise
              adoption, active government demand, formal AI-management certifications, and fresh executive hires built
              for scale and public-market discipline. On balance, the highest residual exposures are the ones public
              sources cannot close: how dependent Dataminr really is on X for differentiated signal quality; whether
              public-sector contracts dominate the economics more than management implies; what the 2025 convertibles
              actually cost; and how model-quality controls behave in the highest-stakes workflows. Those are the issues
              that should drive diligence sequencing. If management cannot provide hard answers on dependency,
              concentration, model quality, and capital-structure terms, then the risk chapter should not be read as
              “watch items”; it should be read as evidence that the current underwriting case is still incomplete.
