  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、平台与监管风险
        blocks:
          - type: paragraph
            body: >-
              Dataminr 最严重的承保风险，是公共部门差异化价值主张中的核心部分踩在政治敏感地带。作为一家私营公司，它在这里的证据基础异常扎实：The Intercept 基于 FOIA 的报道、Brennan
              Center 的文件审查、StateScoop 的采购跟进、Houston 市议会投票，以及 Dataminr 自己的隐私和法律页面，都指向同一个方向。Dataminr
              的优势不只是读取公开帖子，而是能以普通用户和多数机构无法复制的速度、广度和产品化程度摄入公开信号。这解释了为什么 X/Twitter
              全量流访问权重要，为什么警察部门会采购产品，也解释了为什么批评者把同一功能称为外包监控，而不是中性告警。由此带来两类风险。第一是平台风险：如果 X 大幅改变价格、访问权或许可用途，Dataminr
              公共部门和抗议监测工作流可能失去一个多方来源仍称为核心的输入。第二是反弹风险：记者和公民自由倡导者已经记录了抗议追踪、误报和偏见指控。公开记录里没有清晰证据显示 Dataminr
              本身受到正式执法，但联邦隐私审查文件、DFARS 隐私义务和反复出现的采购披露表明，这不是一场理论性的政策争论。缓释因素是 Dataminr 公开把 First Alert
              定位为保护隐私，并能指向公开数据来源和法律控制；剩余敞口在于，买方、平台或立法者可能比公司自己的表述更严厉地评估现实效果。
