            title: 连续可转工具是真实的估值敏感信号
            body: 可转融资可以是理性的 pre-IPO 过桥资本；但在 2023 年裁员之后、没有新的定价股权标记时，短时间连续两笔这类工具，说明管理层想拿到资本，同时不重新打开估值问题。这并不致命，但是真正有意义的尽调标志。
