        title: 模块与客户工作流
        blocks:
          - type: paragraph
            body: >-
              目前营销中的产品地图覆盖四个可见顶层买方面，以及更新的网络专项模块。企业侧，Dataminr for Corporate Security
              围绕员工安全、资产保护和运营韧性展开，并延伸到高管保护、供应链监测、金融服务运营，以及路线或场地态势感知。公共部门中，First Alert
              仍是应急管理、外交安全、执法和部队防护工作流的态势感知界面。媒体中，Dataminr for News 将同一套实时发现引擎打包给新闻编辑室，用于核验和突发新闻发现。网络是产品家族模块化最明显的地方：Pulse
              for Cyber Risk 处理网络实体融合和数字风险用例，Agentic TIP 试图把情报全生命周期运营化，CTTI 将外部信号匹配到客户自身环境，Investigation Insights
              则把这种上下文覆盖到数百个已连接工具。共同线索是压缩工作流。Dataminr
              不只是承诺告警；它承诺更少跳转、更少手工补充步骤，以及从信号到决策更快移动。这一点有战略意义，因为护城河主张落在产品集成和运营相关性上，而不只是原始数据采集。
