            body: >-
              锚定可比集合后，情景数学很直接。若走出类似 Recorded Future 的结果，Dataminr 估值约 $1.8 billion。更强的跨职能定位、更深的政府渗透，以及仍为私营公司的稀缺性叙事，可以支撑约
              $2.0-$2.6 billion 的基准情景区间，即 10x-13x ARR。这显著高于 ZeroFox 式公开市场压力，也低于未被触碰的 2021 年标题估值。只有三件事同时发生，乐观情景才会到达约
              $3.2-$4.1 billion：Dataminr 在 $200 million ARR 以上继续高速复合增长，IPO 窗口以有吸引力的条款重启，买方开始把公司视为稀缺的 AI
              赋能情报资产，而不是又一家用结构化资本续命的后期私营公司。如果没有定价轮、结构化资本放大优先权不确定性，且战略买方或类二级市场买方主导价格，悲观情景约为 $1.2-$1.8
              billion。这个框架导出一个结论：不要只依据 2021 年标题估值承保新资金。
