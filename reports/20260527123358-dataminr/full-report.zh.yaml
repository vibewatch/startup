        blocks:
          - type: paragraph
            body: >-
              关键投资问题不是 Dataminr
              是否有风险，而是哪些风险严重到足以打穿承保逻辑，哪些风险可以靠正确尽调管理。本章最强的反向证据不是泛泛的创业公司噪音，而是具体事实：有记录的警察围绕受保护抗议活动使用产品；有记录地依赖特权平台访问；有记录的误报；有记录地使用可转债而不是重新定价股权；有记录的政府足迹，却没有披露分部集中度。公司最强的缓释因素也很具体：广泛企业采用、活跃政府需求、正式
              AI 管理认证，以及为规模化和公开市场纪律而补进的新高管。综合来看，最高的剩余敞口正是公开来源无法封口的问题：Dataminr 对 X
              的差异化信号质量到底有多依赖；公共部门合同是否比管理层暗示的更主导经济性；2025
              年可转债实际成本是多少；模型质量控制在最高风险工作流中表现如何。这些问题应该决定尽调顺序。如果管理层不能就依赖、集中度、模型质量和资本结构条款给出硬答案，那么风险章节就不应被读作“观察事项”，而应被读作当前承保逻辑仍未完整的证据。
