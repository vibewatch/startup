      - number: '2.2'
        title: TAM、SAM、SOM 与相互冲突的市场规模视角
        blocks:
          - type: paragraph
            body: >-
              自上而下测算市场，是本章最大的常见方法陷阱。本次抓取的相邻市场报告，在范围甚至分析单位上都不一致。The Business Research Company 和 Future Market Insights
              将威胁情报类别放在 2025–2026 年约 $13–16B 区间。OSINT 报告分歧更大：Global Market Insights 将该类别 2026 年规模定为 $15.9B，Mordor
              Intelligence 为 $21.06B，而质量低得多的 Proficient Market Insights 页面则给出一个不可信的、长期达到万亿美元级的 OSINT
              预测。这种跨度不是把所有数字平均的理由，而是要求围绕 Dataminr 实际变现的部分更紧地圈定市场。Dataminr 的真实市场比“全部 OSINT”窄，因为并非每个 OSINT
              用例都会购买高端、常开、多模态预警平台；也比“全部威胁情报”窄，因为公司并不吃下内部遥测、终端或 SIEM 支出的全部。因此，务实的 SAM
              位于大型企业、公共部门机构、金融风险团队和高端新闻机构的跨垂直实时情报预算内。接近 $200M ARR 是有意义的需求证明，但相对于任何十几到二十几 billion
              美元的相邻类别估算，仍意味着渗透率很低。换句话说，上行 case 更依赖垂直扩张、更深的企业钱包份额和合作伙伴分销，而不是宣称拿下整个综合 OSINT 或 CTI TAM。
