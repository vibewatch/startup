        - 有助于三角定位普通股今天可能在哪里出清。
        - 对一级经纪商 / 老股平台开展尽调，并要求方法透明。
    notes: 这些要求是支付高于 $2.0B-$2.6B 基准区间前必须拿到的最低材料，不是可有可无的尽调愿望清单。
