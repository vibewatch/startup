      - number: '4.2'
        title: 收入模式与规模信号
        blocks:
          - type: paragraph
            body: >-
              公开证据支持强劲的收入轨迹，但它对整体规模最强，对变现细节最弱。Dataminr 官方 2025 年新闻稿称公司 ARR 接近 $200 million；TechCrunch 报道称，公司拥有 800
              多个客户、1,500 家新闻编辑室，以及一份五年期 $282 million 的国防部合同。官方页面还分别确认 100 多个美国政府机构、20 多个国际政府和 1,500
              多家新闻编辑室，这些共同指向一个横跨企业、公共部门和媒体的多元客户基础。产品足迹也说明存在多个可变现表面：面向企业的企业安全和事件风险情报，面向任务的政府部署，新闻编辑室订阅，以及嵌入式用例的合作伙伴 / API
              动作。Dataminr 未公开的内容同样重要：没有价目表，没有披露 ACV，没有分部 ARR
              拆分，也没有说明多少收入来自经常性软件，多少来自服务和部署。因此，收入质量必须从谁购买产品、产品看起来多么关键来推断，而不是从已披露的 SaaS 经济指标判断。
