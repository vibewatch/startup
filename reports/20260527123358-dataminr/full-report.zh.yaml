            body: >-
              对 2021 年估值标记保持怀疑，最强理由不是抽象的倍数压缩，而是 Dataminr 在 2025 年采用的具体结构。3 月，公司通过可转债融资和信贷组合募集 $85 million；TechCrunch
              报道称，该工具是 IPO 前融资，明确不设估值，同时承诺投资人可按 IPO 价格或后续融资轮折价转换。一个月后，Dataminr 又宣布从 Fortress 获得第二笔 $100 million
              可转债融资。Private Equity Wire 把潜台词说得很明白：可转债受青睐，是因为它能在潜在 IPO 前募集资金，同时尽量减少股权稀释。这些都不证明公司陷入困境，客户基础和 ARR
              说法也指向真实运营规模。但这意味着，自 2021 年以来，公开市场还没有被要求为普通股清算定价。叠加 2023 年裁员，这一顺序是陈旧估值的黄灯：Dataminr
              找到了资本，但找到的是为推迟硬性重新定价而设计的结构。
