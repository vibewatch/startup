            body: >-
              Dataminr 的公开客户故事很宽，对私有公司来说也少见可见，但可见指标混合了几个不同分母。官方页面一致称，平台获得 100 多个美国政府机构、20+ 国际政府、Fortune 50 三分之二、Fortune
              100 一半，以及 1,500 多家新闻编辑室信任；新闻稿还补充 30,000+ 记者，以及近 200 个使用 First Alert 的公共部门和社会公益组织。TechCrunch 又给出 800+
