      - number: '3.3'
        title: 政府与国防工作流中的既有厂商
        blocks:
          - type: paragraph
            body: >-
              Palantir 和 Janes 重要，是因为它们在技术栈的另一个层级竞争。Palantir 官方定位的重点并不是最先捕捉公开信号，而是整合数据、决策和运营：Gotham 用于国防决策，Foundry
              用于企业运营工作流，AIP 用于在私有网络上受控执行 AI。这比 Dataminr 的外部态势感知姿态更深地占据工作流；Army Vantage 参考也凸显其在政府内部长期运营嵌入。Janes 同样不同于
              Dataminr，但对国防和情报买方来说，它在关键时刻仍可成为替代。Janes 销售经过验证、机器可读的国防与安全情报，输入物流、规划、兵棋推演和战略预测。它的人类专家验证和独家采访，让其姿态比 Dataminr
              自动化公开数据扫描更经策展、更重情报工艺。当买方需要部队规划数据集或国防级运营图景时，Palantir 和 Janes 的工作流引力强于
              Dataminr；当买方需要在宽风险面上尽可能早的公开预警时，Dataminr 起点更好。
