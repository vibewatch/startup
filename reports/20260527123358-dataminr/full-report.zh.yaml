      - number: '2.3'
        title: 按细分划分的买方、用户、付款方与支出归属
        blocks:
          - type: paragraph
            body: >-
              Dataminr 的跨垂直扩张真实存在，但预算归属很分散。在企业安全中，通常买方是 CSO、GSOC 负责人、韧性团队或 duty-of-care
              职能；用户是安全运营员或分析师；付款方通常是企业安全、危机管理或差旅风险预算。在网络防御中，买方转向 CISO 组织，尤其是威胁情报、外部攻击面、数字风险或漏洞团队；Dataminr 也明确定位为现有
              SIEM、SOAR 和 TIP 投资的补充。在政府和应急管理中，用户包括机构运营人员、第一响应人员或国防 / 安保人员，但购买路径常通过 Carahsoft、marketplace 上架或正式合同，而不是纯
              SaaS 自助。在新闻中，用户是派稿编辑、记者、核验台或受众团队，付款方则是新闻编辑室运营或工具预算；这让采用率比 Fortune 50 安全场景更受宏观媒体经济影响。金融服务是另一个多预算细分：Dataminr
              可以落在市场情报、合规、运营风险、ESG 或研究团队。供应链作为核心独立预算所有者，证据最弱；当前证据更多指向合作伙伴主导分销和 API 嵌入，而非 Dataminr 直接替换既有物流或 ERP
              系统。商业含义是，Dataminr 不是把一个产品卖进一个同质预算，而是把共享情报底座卖进多条不同采购动作；每条动作的 ACV、证明要求和续约风险都不同。
