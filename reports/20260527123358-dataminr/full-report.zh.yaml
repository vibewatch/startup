  - id: TM005
    title: 监管与平台依赖约束登记表
    columns:
      - 约束
      - 受影响细分市场
      - 证据
      - 重要性
      - 尽调问题
    rows:
      - - API 限流与平台访问变化
        - 网络、新闻、公共部门 OSINT 工作流
        - Knowlesys 和 Mordor 提到速率限制、API 变化和内容限制
        - Dataminr 的价值依赖持续访问广泛、及时的公共信号
        - 按平台索取来源集中度、备用覆盖和访问韧性计划
      - - 采购与隐私控制
        - 政府和国防
        - GAO 和 Route Fifty 强调较高的网络 / 隐私风险与资金错配
        - 大合同存在，但采购和监督要求可能拖慢采用或缩窄范围
        - 审查公共部门部署的 ATO 时间线、采购通道和实施负担
      - - 新闻编辑室紧缩
        - 新闻
        - Reuters Institute 记录了美国新闻编辑室的岗位流失和裁员
        - 预算受限的新闻买方即使产品效用高，也可能续约慢或购买更少席位
        - 衡量新闻编辑室客户队列的 ARR 集中度、客户数留存和价格敏感度
      - - 与 CTI/TIP 工具的类别重叠
        - 网络
        - Flashpoint 和 ThreatConnect 将买方需求框定在集成式 CTI 工作流
        - Dataminr 必须证明自己能在现有安全技术栈中增量补强，而不是冗余
        - 检查网络安全账户中的替换率、附加率和集成驱动扩张
      - - 相邻领域的合作伙伴依赖
        - 供应链、政府、新闻分发
        - Altana、Carahsoft、AWS 和 SoftwareOne 显著延伸分销
        - 合作伙伴能加速触达，但也可能压缩利润率、削弱直接客户控制
        - 拆分合作伙伴来源收入、续约条款和数据权利经济性
      - - 宏观效率压力压缩供应商支出
        - 所有细分市场
        - TechCrunch 报道了 2023 年裁员；2025 年融资叙事围绕增长和 AI
        - 即便是品类领导者也必须证明预算效率，尤其在非核心细分市场
        - 检验近期订单额是在整合既有支出，还是创造真正净新增预算
    notes: 本表单独列出即使自上而下市场仍增长，也可能压缩 SAM 或拖慢采用的风险。多行反映的是运营约束，而非需求崩塌。
