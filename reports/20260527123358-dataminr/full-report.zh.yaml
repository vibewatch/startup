      - number: '7.2'
        title: 资本结构与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              第二大承保风险不是叙事问题，而是财务和结构问题。Dataminr 2025 年的融资顺序很说明问题：2023 年裁员为现金跑道腾空间后，公司先募集了 $85 million
              的可转债融资与信贷组合，又为更多可转债容量设立 SPV，随后一个月从 Fortress 单独完成 $100 million 可转债。这不证明公司陷入困境——官方来源仍显示需求、ARR
              规模和广泛客户采用——但强烈说明管理层更偏好桥接式资本，而不是新一轮定价融资。Dataminr
              仍不披露现金、烧钱速度、利润率、留存或客户集中度；在这种私营公司里，除非有相反证明，否则这个选择应被解读为估值敏感和融资结构压力。公开来源还显示了有意义的政府足迹：100+ 家美国机构、20+
              个国际政府、一份据报道五年的 DoD 合同、活跃的 DISA 中标，以及广泛的采购工具覆盖。这些事实利好需求，但也意味着合同续约、政治审查或预算变化可能很快传导到
              ARR。公开证据对规模最强，对结构最弱。承保方看得出政府很重要；但还看不清 Dataminr
              是否已经在企业、国防、公共安全和新闻之间实现舒适分散。因此，最有用的尽调材料不是又一页市场规模测算，而是合同台账、续约日历，以及 2025 年可转债经济条款的完整披露。
