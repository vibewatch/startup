      - number: '5.3'
        title: 集成、部署与信任控制
        blocks:
          - type: paragraph
            body: >-
              Dataminr 的进入市场越来越依赖嵌入客户既有系统，而不是迫使客户使用独立控制台。官方资料和合作伙伴上架显示，公司通过 AWS、Carahsoft、Splunk、Esri 和 Genetec 走 API 与
              marketplace 分销；Investigation Insights 和 CTTI 也明确营销为无需 rip-and-replace 的覆盖层，位于
              SIEM、EDR、工单、浏览器和其他分析师工具之上。2025 年 11 月 Developer Portal 和增强 SDK 很重要，因为它们把这条集成动作变成独立产品界面，提供文档、代码样例、SDK
              和集成模式，用来缩短伙伴构建周期。Esri 和 Genetec 加深实体世界与地理空间故事；Splunk 验证网络工作流故事；AWS 和 Carahsoft 增加分销可信度。信任和合规方面，最强公开信号是
              Dataminr 在 ISO/IEC 27001 和 27701 之上取得 ISO/IEC 42001 认证，这能证明公司在制度化 AI 治理，而不是没有控制就发货 agentic
              功能。不过，公开材料更擅长说明有哪些集成，而不是说明它们在高负载下如何运行：速率限制、支持义务、正常运行时间承诺和认证深度仍然披露不足。
