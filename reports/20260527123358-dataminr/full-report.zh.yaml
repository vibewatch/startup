              最接近、且可支撑的战略可比是 Recorded Future，Mastercard 以 $2.65 billion 收购了它。Payments Dive 还报道其年收入约 $300 million，隐含收购倍数约
              8.8x 收入——健康，但远低于 Dataminr 陈旧的 20.5x ARR 标记。ZeroFox 给出另一种教训：在报告 $188.4 million ARR 和正自由现金流后，它以每股 $1.14
              私有化，提醒投资人，公开网络安全相邻市场并不总是用溢价估值奖励规模。Meltwater 的私有化虽然更偏媒体情报而非威胁情报，但也强化了一个观点：当公开市场支持不足时，信息供应商会迁移到私有制。Palantir
              是显而易见的公开市场倍数背景，但 2026 年 5 月它约 62.7x 过去十二个月销售额、超过 $319 billion 市值，是 AI 市场例外，不是理性的基础可比。Flashpoint、Babel
              Street 和 Janes 进一步说明，采集排他性、任务级工作流深度和经过验证的国防情报，与单纯早期预警同样重要。
