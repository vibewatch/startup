      - number: '3.2'
        title: 直接情报同业与公私所有权信号
        blocks:
          - type: paragraph
            body: >-
              Recorded Future、Flashpoint、ZeroFox 和 Babel Street 是最清晰的直接或近直接竞争对手，因为它们都向重叠的安全和公共部门买方销售情报产品。Recorded Future
              将大规模网络情报平台与地缘政治和虚假信息叙事结合；出售给 Mastercard 验证了其数十亿美元级战略价值，同时保留了“独立平台”故事。Flashpoint
              围绕难触达空间的第一手来源采集、成品情报、地理空间分析和重分析师支持做差异化。ZeroFox 从外部网络安全角度切入，把网络、品牌、高管和实体风险中的发现、验证和破坏打包；2024
              年私有化交易让它从公开市场审视回到私募股权所有权。Babel Street 是这组里最以身份和任务为中心的公司：现在围绕 agentic risk
              intelligence、多语言数据，以及包括身份和供应商暴露在内的风险域来讲故事。合起来，这些同业说明 Dataminr
              不只是在和另一条预警流竞争；它在和越来越会把采集、分析、工作流和所有权叙事打包进一笔企业销售的供应商竞争。
