      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Dataminr 仍然明显由创始人掌舵。官方领导层材料列出 Ted Bailey 为创始人、CEO 和董事长，Jeff Kinsey 为联合创始人兼 CTO，Peter Bailey
              为企业战略事务总裁和创始成员，负责战略、融资和投资者关系。当前高管层比公司早期公开画像更宽：Balaji Yelamanchili 为总裁兼 COO，Tiffany Buchanan 为 CFO，Matthew
              Harrell 为首席合作伙伴官，Joel Tetreault 为首席 AI
              官，另有产品、法务、人力、公共部门和收入职能负责人。这种职能铺开，对一家已经卖进安全、网络、政府和大型企业环境的公司是正面信号。但两点治理保留仍然重要。第一，Ted Bailey
              之外的公开创始人归属并不完全干净：官方材料明确称 Jeff Kinsey 和 Peter Bailey 是创始成员，而 TechCrunch、Wikipedia 和其他第三方摘要也提到 Sam
              Hendel。第二，当前 COO 叙事披露不足。Dataminr 2024 年 4 月和 2025 年 4 月新闻稿把 Brian Gumbel 描述为总裁兼 COO，但 2026 年领导层页面现在列出
              Balaji Yelamanchili 担任该职位，抓取资料中没有过渡公告。2025 年 6 月聘任 Tiffany Buchanan，以及 2025 年 3 月将 Dave DeWalt
              提升为董事会副董事长，都说明公司在增强制度化和资本市场准备；但官方页面仍未发布清晰的董事会名单、委员会图谱或当前所有权结构。第三方数据库填补了一部分缺口，却不能消除关键人物依赖或股权结构表不透明。
