  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 资本结构与资金充足性
        blocks:
          - type: paragraph
            body: >-
              Dataminr 的公开财务故事，由知名的 2021 年定价股权轮和两个更战术性的 2025 年工具支撑。2021 年 3 月，公司以 $4.1 billion 估值融资 $475
              million，管理层称这笔资本将支持企业增长、国际扩张和公共部门放量。相比之下，2025 年 3 月带来的是 NightDragon 和 HSBC 提供的 $85 million 可转融资加信贷，一个多月后
              Fortress 又单独提供 $100 million 可转融资。TechCrunch 明确将 3 月融资描述为未设新估值的 pre-IPO 可转融资，Private Equity Wire 则把
              Fortress 交易描述为 pre-IPO 稀释管理工具。这些事实比 headline 金额更重要：Dataminr
              看起来仍能融资，但选择的是过桥式工具，而不是重定价普通股。公开数据库对累计融资额也有分歧，所以最稳妥的表述，是公开口径约 $1.2 billion 以上。缺失的是融资 headline
              之下的关键承销层：账上现金、当前 burn、契约负担，以及 2025 年融资究竟是机会主义还是必要之举。
