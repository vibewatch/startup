      - number: '8.5'
        title: IPO 路径假设与最后尽调问题
        blocks:
          - type: paragraph
            body: >-
              回到陈旧 2021 年标记的唯一可信路径，是 IPO 或近 IPO 重新定价，解决可转债目前回避的问题。投资人需要 2025 年 3 月和 4
              月工具的精确经济条款——票息、期限、转换折扣、担保包以及任何契约限制。投资人还需要看清 2021 Series F 和此后任何结构化资本形成的优先权与稀释堆叠。最重要的是，Dataminr 需要披露能把 $200
              million ARR 故事转换成溢价倍数故事的运营指标：分部结构、毛利率、留存、销售效率和自由现金流转化。在这些指标可见前，正确建议是以中等置信度观察，并在 $4.1 billion
              上采用偏高估值立场。公开证据支持继续贴近公司，但不支持在 2026 年支付 2021 年清算价。真正的定价轮、IPO 文件，或足以支撑 15x+ ARR
              结果的已披露强指标，都会改变判断；在此之前，价格纪律就是全部工作。
