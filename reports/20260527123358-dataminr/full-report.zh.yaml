      - number: '2.4'
        title: 采用驱动因素、约束与平台依赖
        blocks:
          - type: paragraph
            body: >-
              最强采用驱动因素，也解释了 Dataminr 为何横跨多个类别。独立资料和公司资料都指向网络攻击上升、地缘政治波动、合规压力，以及对更快实时情报共享的需求，这些构成结构性顺风。OSINT
              报告显示，政府和国防之外的私营部门采用在增长；Dataminr
              自身扩张表述和合作伙伴活动，也显示企业安全、金融、供应链和公共部门用户存在需求。但约束同样重要。政府买方面对碎片化结构、可能跑在资金前面的强制要求，以及会拉长销售周期的采购和隐私控制。新闻编辑室预算压力很大：Reuters
              Institute 记录 2023 年美国新闻编辑室岗位流失近 2,700 个，2024 年初又继续裁减，这意味着即便工具有价值，也很难广泛付费。公开数据依赖是硬约束，不是理论问题。Knowlesys 和
              Mordor 都提到 API 限制、反爬措施、隐私要求和对抗性数据投毒，这些因素可能降低可见度或抬高采集成本。类别拥挤也重要：Flashpoint、ThreatConnect 和相邻 CTI/TIP
              供应商，会把买方决策框在早期检测之外，还包括分析师支持、漏洞上下文、工作流集成和优先级排序。因此，Dataminr
              确实受益于市场顺风，但可投资问题在于，这些顺风能否抵消预算分裂、数据访问摩擦，以及每个垂直领域都要分别证明工作流 ROI 的要求。
