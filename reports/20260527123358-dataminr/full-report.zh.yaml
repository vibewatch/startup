            body: >-
              Dataminr
              客户章节的主要弱点，是标题式广度和已验证深度之间的落差。公司可以有可信度地引用规模，但相当一部分企业端证明仍来自匿名客户证言，例如一家大型汽车制造商、一个网约车平台、一个全球非营利组织和一家金融服务机构。Featuredcustomers
              列出更多具名客户标识，但本轮无法访问其中许多一手案例页面，因此应把它们视为线索，而不是已经充分验证的当前部署。公共部门证明也并不顺滑：The Intercept 和 ACLU 联盟信都显示，Dataminr
              过往服务警方和监测抗议的历史，仍是活跃的声誉与采购问题。这不否定采用——反而证明政府确实在用——但会让公共部门客户质量的干净叙事变复杂。剩下最重要的尽调问题，是头部客户集中度、联邦客户占比、新闻编辑室变现，以及
