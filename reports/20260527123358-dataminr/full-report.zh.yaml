chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台与客户覆盖
        blocks:
          - type: paragraph
            body: >-
              Dataminr 自称是 AI 驱动实时事件、威胁与风险情报的全球领导者；抓取到的公司页面也一致把它定位成类似基础设施的情报平台，而非消费者媒体或广告技术产品。核心产品是一套多产品栈，覆盖 Dataminr
              Pulse for Corporate Security、面向公共部门响应的 First Alert、Dataminr for News 和 Dataminr for Cyber
              Defense。公司材料里，技术主干尤其突出：Dataminr 称其每天在数十亿条公开输入上执行数万亿次计算，覆盖超过 100 万个独立公开数据源，使用 50 多个自有 LLM，并在 220
              多个国家和地区、150 多种语言中综合文本、图像、视频、声音和传感器数据。这种平台定位很关键，因为后续增长主张不靠单一应用，而靠一层通用
              AI/数据底座，可以重新打包进实体安全、网络、公共部门和新闻编辑室工作流。以私有公司标准看，公开客户佐证也很强。当前官方页面称，Dataminr 获得 Fortune 50 三分之二、Fortune 100
              一半、100 多个美国政府机构，以及 20 多个国际政府信任；Dataminr for News 被称为服务 1,500 多家新闻编辑室和 30,000 多名记者。TechCrunch 又补充，公司整体服务
              800 多个客户，其中包括 NATO 和 OpenAI。所在地信息方向一致，但并不完全干净：多个第三方数据库将公司放在纽约市，公开资料中同时出现 6 East 32nd Street 和 135 Madison
              Avenue。合在一起，证据支撑清晰的第一章身份：Dataminr 是一家纽约后期情报软件公司，全球分销已有分量，公共部门相关性强，客户基数足以让后续 ARR 和融资主张显得可信。
