  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 2021 年估值仍定义讨论框架，但不等于清算价格
        blocks:
          - type: paragraph
            body: >-
              Dataminr 的估值故事格外容易写标题，也格外难承保。标题很熟悉：公司最后一次定价股权融资发生在 2021 年 3 月，当时以 $4.1 billion 估值完成 $475 million Series
              F。承保难题在于，四年多市场重新定价、且没有新的公开定价轮之后，这个标记在 2026 年 5 月到底意味着什么。公开证据仍支持这是一家严肃公司——Dataminr 称 ARR 接近 $200
              million，企业和政府渗透很深，2021 与 2025 年披露合在一起显示客户证明没有消失。但陈旧估值现在意味着约 20.5x
              ARR，这是一个溢价倍数，需要靠当前价格发现来防守，而不是靠历史融资记忆。正确投资姿态因此应对价格敏感，而不是对公司质量敏感：业务可以很强，但未经触碰的 2021 年价格仍可能对新资金太贵。
