          value: ~$15.8B-$21.1B (2026 lenses)
          note: 使用 TBRC、GMI 和 Mordor 作为不可相加的外层边界；范围相互重叠，不能直接比较。
        - label: 实际 SAM — Dataminr 有把握变现的实时情报预算
          value: ~$3B-$7B (author bounded)
          note: 只包含部分企业安全、网络、公共部门、金融、高端新闻和伙伴带动的供应链工作流。
        - label: 当前 SOM — 接近 $200M ARR 的隐含渗透率
