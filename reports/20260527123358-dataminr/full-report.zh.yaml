              卖进企业安全、公共部门和国防工作流、NGO 与人道主义用例，以及新闻编辑室运营，并为金融服务团队和高管保护项目提供额外包装。广度信号很强；但广度背后的变现拆分仍然不透明，因为 Dataminr 不公布分部
