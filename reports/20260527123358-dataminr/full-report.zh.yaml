      - number: '1.3'
        title: 融资历史、投资者基础与融资结构
        blocks:
          - type: paragraph
            body: >-
              Dataminr 最近一个干净的定价基准，仍是 2021 年 3 月的 Series F，当时公司宣布以 $4.1 billion 估值融资 $475 million。官方资料和 TechCrunch 对这个
              headline 以及头部财团口径一致，投资方包括 Eldridge、Valor Equity Partners、MSD Capital、Reinvent Capital、ArrowMark
              Partners、IVP、Eden Global 和 Morgan Stanley Tactical Value funds。2021 年这一轮，让 Dataminr 成为资本充足的后期 AI
              平台，当时管理层仍公开讨论 IPO 目标。当前更重要的故事是，2025 年资金来自混合工具，而非新披露的定价融资。2025 年 3 月 19 日，Dataminr 通过可转融资加信贷，从 NightDragon
              和 HSBC 融得 $85 million；TechCrunch 报道称，该工具明确属于 pre-IPO，不设估值，并将让投资者在后续 IPO 价格或融资价格上获得折扣。NightDragon 还披露计划设立
              SPV，最高可再增加 $100 million 可转敞口。一个多月后，Fortress 又提供 $100 million 可转融资。Fortress、Dataminr 和 Private Equity Wire
              都把这笔交易描述为战略增长投资，但它同样释放融资结构谨慎信号：公司补充了资本，却没有公开重置 2021
              年估值，公开资料仍未披露票息条款、转换机制、契约组合，或相对既有投资者的优先级。因此，总融资额只能表达为区间——约 $1.0 billion 至 $1.24
              billion——取决于资料源是否计入二级交易、债务和近期可转工具。
