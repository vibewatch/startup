      - number: '5.4'
        title: 差异化、限制与承销风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开产品差异化，是 Dataminr 结合了其他地方常常分开销售的三层：广泛事件检测、实时生成式描述，以及嵌入工作流的上下文。网络页面进一步打磨这一
              pitch，批评传统威胁情报平台太慢、太泛、太依赖人工，再把 Agentic TIP、CTTI 和 Investigation Insights
              定位成既有栈内部的情报操作系统。这个方向可信，第三方合作伙伴界面也显示了真实集成工作。但技术承销仍有真实保留。第一，许多性能故事仍是自报：最快检测、99.5% ReGenAI
              准确率、减少误报和大幅压缩工作流都合理，却没有足够公开基准方法来独立验证。第二，平台结构性依赖对公开数据、合作伙伴生态和客户连接工具的持续访问；多元化有帮助，但来源访问、API
              条款或生态激励变化仍可能侵蚀产品覆盖或交付质量。第三，相对于平台野心，公开开发者足迹仍然有限。GitHub
              和研究信号显示确有技术实质，但没有足够公开表面，可以在不做直接技术尽调的情况下充分验证可支持性、可解释性或长期切换成本。
