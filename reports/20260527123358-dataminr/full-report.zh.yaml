  - id: TP005
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - Dataminr 护城河主张
      - 具体威胁
      - 严重性
      - 同业证据
      - 尽调要求
    rows:
      - - 最早公开数据告警
        - 同业可围绕类似开源数据流叠加智能体 AI 和分析师服务
        - 高
        - Recorded Future、Flashpoint、ZeroFox 和 Babel Street 现在都在营销 AI 增强型情报工作流
        - 要求提供可量化胜率，证明最早告警速度改变客户结果，而不只是演示体验
      - - 跨网络安全、企业安全和新闻的跨职能打包
        - 相邻厂商可逐个预算剥离更窄工作流
        - 中高
        - Meltwater 和 Brandwatch 把持传播工作流；Palantir 和 Janes 把持更深的任务工作流
        - 梳理哪些模块一起续约，哪些模块在账户中与替代工具并存
      - - 政府业务足迹
        - Palantir 和 Janes 在国防与运营中具备更深任务系统引力
        - 高
        - Army Vantage、Gotham 和 Janes 规划数据集显示更深运营嵌入
        - 获取案例研究，证明 Dataminr 拥有决定性工作流，而不只是为另一个平台供料
      - - 网络防御扩张
        - Flashpoint 和 Recorded Future 营销更成品化的情报和更难触达的数据集
        - 高
        - Flashpoint 强调难触达空间和分析师支持；Recorded Future 覆盖网络安全、地缘政治和虚假信息
        - 测试 Dataminr 赢下的是完整 CTI 预算，还是只作为首报增强
      - - 平台黏性
        - 多平台并用让 Dataminr 保持有用，但可能限制钱包份额和议价能力
        - 中
        - 官方页面反复强调接入现有工作流，而不是替代这些系统
        - 衡量下游工作流挂载率，并量化 Dataminr 在哪些场景是行动系统、哪些只是信号源
      - - 企业定价不透明
        - 客户可能用按席位或按团队看起来更便宜的窄工具对标 Dataminr
        - 中
        - 公开网站展示演示和询价入口，而非透明价目表
        - 按用例和买方画像审查实际成交价、涨价历史和 ROI 证明
      - - 可防御性叙事
        - 竞争对手撰写的对比已经攻击 Dataminr 的工作流深度和告警质量
        - 中高
        - Flashpoint 直接称 Dataminr 缺少地理空间搜索和精细化告警
        - 用客户访谈和产品测试验证 Dataminr 的地理空间、调查和信号精炼表现
    notes: 严重性是承销判断，不是统计预测。目标是拆出 Dataminr 的优势哪些可能是结构性的，哪些会在买家优先考虑分析师深度、独家数据集或工作流所有权时被压缩。
