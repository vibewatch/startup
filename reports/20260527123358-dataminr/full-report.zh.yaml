    title: Dataminr 市场规模金字塔：从外层 TAM 到实际 SOM
    type: pyramid
    layout: standard
    summary: 金字塔从广义相邻 OSINT / CTI 类别估算逐层收窄，到 Dataminr 可触达的更小工作流市场，再到接近 $200M ARR 对应的当前隐含渗透率。
