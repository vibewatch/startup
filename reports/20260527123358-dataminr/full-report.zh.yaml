      - - 监管与合规压力
        - 顺风
        - 当前且结构性
        - 强化网络、金融服务和政府工作流的需求
        - 当下哪些法规要求最直接影响采购时点？
      - - 借助合作伙伴和 Platform API 纵向扩张
        - 顺风
        - 2025 年起
        - 不要求 Dataminr 掌控完整终端应用，也能扩大 SAM
        - 新增 ARR 中，直销和合作伙伴来源各占多少？
      - - 政府资金错配与采购摩擦
        - 约束
        - 持续存在
        - 即使用例很急，也会拖慢部署
        - 公共部门销售周期和续约时间线的中位数是多少？
      - - 新闻编辑室裁员与成本压力
        - 约束
        - 当前
        - 尽管工作流契合度强，广泛付费意愿仍受限制
        - 新闻编辑室客户中，多少是全价企业合同，多少是折扣战略账户？
      - - 平台 API 限制与反爬措施
        - 约束
        - 当前且在上升
        - 可能压缩数据覆盖或抬高采集成本；若不能用合作伙伴关系抵消，产品差异化会被削弱
        - Dataminr 对任何单一数据平台或访问政策变化的暴露有多高？
      - - CTI / TIP 对标集合拥挤
        - 约束
        - 当前
        - 推动 Dataminr 证明工作流集成和优先级排序，而不只是更早发现
        - 相对 Flashpoint、Recorded Future 和 TIP 既有厂商，胜率如何？
      - - 客户工作流内的 AI 自动化
        - 混合
        - 当前和中期
