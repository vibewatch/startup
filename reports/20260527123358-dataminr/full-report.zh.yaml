  - id: TP001
    title: 竞争对手概况表
    columns:
      - 竞争对手
      - 类别
      - 所有权 / 估值信号
      - 核心工作流
      - 数据访问 / 覆盖信号
      - 相对 Dataminr 的主要局限
    rows:
      - - Dataminr
        - 直接的实时事件、威胁和风险情报
        - 私营；2021 年曾有 $4.1B 估值参考，2025 年又融资
        - 在企业安保、网络防御、公共部门和新闻场景中最早发现公共信号
        - 1M+ 公共数据源；100+ 美国机构；20+ 国际政府；1,500+ 新闻编辑室
        - 公共数据优势强，但自研成品情报或记录系统深度披露较少
      - - Recorded Future
        - 直接网络 / 地缘政治情报
        - Mastercard 同意以 $2.65B 收购；定位为独立子公司
        - 网络威胁情报，叠加地缘政治和虚假信息情境
        - 1M+ 来源；约 1,900 家客户，覆盖 75 个国家；定位政府关键基础设施
        - 相较 Dataminr 更宽的跨职能事件告警包装，它更偏网络安全
      - - Flashpoint
        - 直接威胁情报和调查平台
        - Tracxn 显示处于已收购阶段；资料中累计融资 $49M
        - 成品情报、调查、漏洞、实体与国家安全工作流
        - 来自开放和难触达空间的 3.6 PB 数据；聚焦公共部门和国防
        - 新闻编辑室或广泛企业危机定位不如 Dataminr 明显
      - - ZeroFox
        - 外部网络安全 / 数字风险防护
        - Haveli 于 2024 年以每股 $1.14 现金向股东私有化收购
        - 发现、验证、干扰、下架和外部网络风险
        - 12B+ 信号；数千客户，包括主要公共部门组织
        - 比广泛实时事件感知更偏干扰和下架
      - - Babel Street
        - 身份、供应商和战略风险情报
        - 私营；第三方资料称 ARR 约 $31.7M、估值约 $95M
        - 任务级多语言风险情报和身份解析
        - 权利清晰的任务级数据；买方包括国防、执法、企业和金融科技
        - 广泛新闻编辑室或大规模事件告警证据少于 Dataminr
      - - Palantir
        - 政府和企业操作系统
        - 上市公司，有 IR 和 SEC 报告
        - 面向国防决策、企业工作流和私有网络 AI 的深度运营软件
        - Army Vantage 和国防工作流嵌入强于 Dataminr 的运营嵌入
        - 主要不是外部公共信号告警产品
      - - Janes
        - 国防和安全情报既有厂商
        - 已收购阶段；Tracxn 显示 Montagu 所有权信号
        - 用于规划、物流和预测的已验证国防数据集与分析
        - 专家验证的 OSINT、独家访谈、机器可读国防数据
        - 职责范围更窄、更偏国防；广泛商业事件告警契合度较弱
      - - Meltwater
        - 相邻媒体和社交情报
        - 2023 年 Marlin 和 Altor 达成 PE 私有化协议
        - 覆盖媒体、社交和 AI 信号的公关、传播和营销情报
        - 27,000+ 组织；每天 1.3B 文档；240+ 语言
        - 作为网络或任务情报替代品较弱，更适合传播预算
      - - Brandwatch
        - 相邻消费者情报和社交套件
        - 官方文章称 Cision 以 $450M 收购 Brandwatch
        - 消费者情报、搜索情报、社交管理和媒体情报
        - 声称 100M+ 来源；隶属 Cision Group Ltd
        - 更接近传播和洞察工作流，而非威胁运营工作流
      - - 内部自建 / 多工具现状
        - 现状替代方案
        - 使用现有人员和既有工具，而不是购买新平台
        - 分析师从 SIEM、TIP、公关、社交和咨询工具拼接信息流
        - 强弱取决于现有技术栈和内部技艺
        - 通常比 Dataminr 打包的早期预警工作流更慢、更碎片化
    notes: 本表聚焦标准同行集合，以及最可信的替代路径。所有权和估值单元格只使用可支撑的公开信号；数据薄弱处直接说明，而不是推断精确的当前估值。
