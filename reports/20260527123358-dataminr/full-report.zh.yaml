            title: 主要风险是预算碎片化，而不是类别缺少增长
            body: >-
              相邻的 OSINT 和威胁情报类别在增长，但 Dataminr
              无法均匀变现这些总量。企业安全预算比新闻编辑室预算健康得多；公共部门预算可能很大，却采购负担重；公开数据访问约束也可能侵蚀覆盖质量或抬高采集成本。因此，投资人应把 Dataminr
