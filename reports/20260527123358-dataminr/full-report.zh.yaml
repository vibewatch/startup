    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 2025 年工具条款
        - 2025 年 3 月 / 4 月融资的票息、到期、折扣、契约、担保和转换顺位
        - 这些条款决定桥式资本是良性可选项，还是未来稀释 / 控制风险。
        - 管理层、法律顾问或数据室融资文件。
      - - 优先权堆叠
        - 2021 年 Series F 轮及后续结构化资本的完整清算瀑布
        - 若高级索偿排在普通股之前，新资金回报可能与企业价值测算大幅背离。
        - 股权结构表导出，加董事会批准的融资文件。
      - - ARR 质量
        - 约 $200M ARR 叙事中的分部拆分、多年合同组合、总留存、净留存和服务成分
        - 溢价倍数取决于 ARR 质量，而不只是数量。
        - 财务团队队列分析和董事会汇报包。
      - - 利润率和现金流
        - 毛利率、EBITDA 桥接、自由现金流桥接，以及 2025 年融资后的现金跑道
        - 需要用来区分可选桥式融资和必要性融资。
        - 经审计财务报表和管理层模型。
      - - 退出准备
        - IPO 准备状态、审计师准备度、法律清理和投资者教育计划
        - 乐观情景需要通向公开价格发现的现实路径，而不是无限期桥式融资。
        - CFO / 法律尽调会议。
      - - 老股市场证据
