  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、计入支出与相邻类别
        blocks:
          - type: paragraph
            body: >-
              Dataminr 不应被简单框定为泛泛的“AI 公司”，也不是纯网络安全供应商。证据要具体得多：公司把实时事件、威胁与风险情报卖进至少六类工作流——企业安全、网络防御、公共部门 / first
              alert、新闻、金融服务，以及供应链中断监测。这些工作流与开源情报（OSINT）、网络威胁情报（CTI）、重大事件管理、媒体情报 /
              新闻采集和韧性软件重叠，但无法干净映射到任何一个分析师类别。这一点重要，因为不同工作流的买方、预算线和付费意愿差异很大。Fortune 50
              企业安全团队购买实体威胁、差旅风险和业务中断的早期预警；网络团队购买可接入 SIEM/SOAR/TIP
              系统的外部检测和威胁上下文；新闻编辑室购买速度和核验；金融服务用户购买对影响市场事件的更早感知；政府买方购买态势感知或部队防护信号，往往通过采购工具或渠道伙伴完成。因此，计入支出应是外部实时情报，而不是全部安全、全部媒体监测或全部企业软件。排除支出应包括完整
              SIEM 预算、广义广告技术或品牌监测类别，以及 Dataminr 不掌握核心工作流的指挥控制系统。与 Control Risks、Altana、Carahsoft、AWS Marketplace 和
              SoftwareOne 的合作强化了这个更窄的理解：Dataminr 常常是更大运营栈中的预警和上下文层，而不是完整记录系统。
