  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与数据策略
        blocks:
          - type: paragraph
            body: >-
              Dataminr 一贯把产品描述为分层 AI 平台，而不是狭窄的预警应用。公开架构从广泛公开数据摄取开始，覆盖文本、图像、视频、音频和传感器信号；随后用 Multi-Modal Fusion AI
              大规模发现候选事件、风险和威胁。检测层之后是描述层和上下文层：ReGenAI 将快速变化的检测持续改写成 Live Briefs，Intel Agents 和其他 agentic
              工作流则补上客户快速决策所需的周边上下文、优先级排序和 next-best-action 逻辑。公司自己的技术写作在这里有价值，因为它不止是泛泛营销，而是解释了图像和文本 embedding
              之间的跨模态注意力，以及计算机视觉、自然语言理解、音频和异常检测模型的使用。Dataminr 还对一家私有供应商提出了少见激进的规模主张，包括超过 100 万个来源、50 多个自有 LLM，以及每日处理 43+
              TB 数据。这些数字有助于解释为什么一个平台可以服务实体、网络和新闻工作流，但它们仍主要是管理层或合作伙伴表述，而非独立基准测试过的技术披露。
