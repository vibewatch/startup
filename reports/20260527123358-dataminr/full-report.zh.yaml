            body: >-
              Dataminr
              的公开客户证据暗示产品有粘性，但还没有证明粘性。能看到的用例——高管保护、应急管理、部队保护、新闻编辑室告警、危机沟通、影响市场的情报——本来就是高后果工作流；一旦告警接入日常运营流程，切换成本就可能很高。扩张有几个代理信号：NATO
              被描述为扩大的合作关系；AP 从风险监测走向新闻编辑室工作流嵌入；Esri 描述现有 First Alert 客户正在切换到更丰富的地图体验。TechCrunch 还报道了一份五年、$282 million
              的美国国防部 合同，至少说明存在一个大型多年期联邦关系。但这些公开信号都没有回答投资人真正需要的持久性问题：Dataminr 不披露
              NRR、GRR、流失率、合同条款、具名账户席位数或头部客户集中度。因此，公开证据支持任务关键性和可能的续约潜力，但不足以承保续约经济性。
