  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 从规模、验证、可比支撑、融资质量和证据质量维度，对今天进入 Dataminr 的 IC 式打分。
    data:
      items:
        - label: 市场 / 品类相关性
          value: 8/10
          note: 威胁、事件和风险情报仍是企业和政府的战略预算。
        - label: 商业验证
          value: 8/10
          note: 接近 $200M ARR，加上 Fortune 客户和政府客户足迹，是可信的规模信号。
        - label: 可比支撑
          value: 5/10
          note: Recorded Future 支撑数十亿美元价值，但不能干净支撑 20x ARR 的私人市场估值。
        - label: 融资质量
          value: 4/10
          note: 2025 年可转债保留了选择权，但降低了价格透明度。
        - label: 估值公允性
          value: 3/10
          note: 旧的 $4.1B 估值相对可支撑锚点显得偏高。
        - label: 证据质量
          value: 5/10
          note: 公开证据在规模上较好，在股权结构表、利润率和融资工具条款上较弱。
        - label: 入场准备度
          value: 4/10
          note: 没有重新定价或更完整披露时，新资金若按高于基准情景逻辑的价格进入还为时过早。
    approximationNotes: 分数是定性 IC 辅助，不是模型输出。它们只总结本章审阅的证据集。
    claimRefs:
      - CV007
      - CV016
      - CV019
      - CV033
      - CV034
      - CV040
      - CV046
      - CV047
