      - number: '1.4'
        title: 规模信号、里程碑与负面尽调标志
        blocks:
          - type: paragraph
            body: >-
              从运营规模看，核心图景偏正面。官方 2025 年材料称 Dataminr ARR 接近 $200 million，公司客户群现已覆盖至少 800 个组织，包括深入渗透 Fortune 50、100
              多个美国机构、20 多个国际政府，以及 1,500 多家新闻编辑室。业务似乎也已深嵌公共部门和国防工作流：TechCrunch 引用了一份五年期、$282 million 的美国国防部合同，并点名 NATO
              为客户。2024–2025 年，产品速度也通过 ReGenAI、规划中的 Context Agents，以及更广泛的合作伙伴网络推进保持可见。但第一章的下行信号同样真实。公开员工数信号不一致——官方披露从
              2022 年 900 多名员工降至 2024 年约 800 人，而 2025–2026 年第三方数据集指向更接近 700 多人高位或 800 多人低位的区间。公司还在 2023 年末裁员约
              20%，管理层将这一举措与宏观压力、效率、AI 转向和盈利推动联系起来。与此同时，Dataminr 仍暴露在长期监控批评之下：TechCrunch 的 2025
              年融资报道引用了过往关于执法机构在抗议场景中使用该产品的报道，其 2021 年 Series F 报道也重提数据共享和客户下游潜在滥用争议。这些问题不否定 Dataminr
              的商业牵引力，但尽调必须纳入，因为它们直接交叉于进入市场集中度、监管敏感性，以及支撑增长的同一批公共部门市场中的声誉风险。
