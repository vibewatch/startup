      - number: '4.3'
        title: 单位经济与披露缺口
        blocks:
          - type: paragraph
            body: >-
              Dataminr 在运营形态上像一家轻资产软件和数据平台，但公开披露太少，不足以真正承销单位经济。最强公开数据点是 ARR 信号，以及 GetLatka 和 Tracxn
              给出的粗略员工数区间；二者合在一起，意味着每名员工约 $0.24 million 至 $0.26 million ARR。这个水平对私有企业软件公司体面，但单独不足以判断效率。2023 年约 20%
              裁员，以及备忘录承诺多年 runway，说明管理层已经压过成本结构；但公司仍不披露毛利率、服务强度、burn、现金或留存。IncFact 给出的 $100 million 至 $500 million
              宽收入估算，也说明外部数据库对私有发行人的近似程度仍很高。实践中，投资人无法判断 Dataminr 接近 $200 million ARR
              主要是软件化经常性收入、劳动力密集型实施收入，还是某种混合体。正是这一层缺失，使公开图景可以支撑对需求的信心，但尚不能支撑对利润率路径或销售效率的信心。
