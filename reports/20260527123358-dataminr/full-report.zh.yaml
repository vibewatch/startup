      - number: '7.3'
        title: 竞争、AI 与执行风险
        blocks:
          - type: paragraph
            body: >-
              Dataminr 守的不是一个静态小众市场。围绕实时威胁、风险和情报工作流的竞争场，资本更充足，也更像平台，而不是变弱。Recorded Future 进入 Mastercard
              体系后获得明确规模支持；ZeroFox 获得新的私募股权支持；Flashpoint 主打 AI 赋能的威胁工作流；Palantir 继续把 AI 平台卖进相邻的任务关键决策环境。Dataminr
              的回应不是收窄，而是加深产品野心。公司的智能体路线图显示，现在是自主生成上下文，下一步是为客户定制上下文，2026
              年是预测性情报。路线图可能支撑扩张，但也抬高了模型错误的运营代价。反向报道已经记录了抗议监测场景中的误报，而公开来源仍不披露政府和安全工作流中最关键产品的精确率、召回率、申诉权或熔断流程。Dataminr
              确实有缓释因素：ISO 42001 以及此前的 ISO 27001/27701 表明，公司比许多私营 AI 供应商更重视治理；近期 CFO/COO
              招聘也说明管理层知道下一阶段必须专业化。剩余风险在于，Dataminr 在一次重大裁员之后、管理层梯队仍在搭建时，同时扩大产品范围、渠道复杂度和公共部门销售。这组组合不是不可承受，但绝不是低风险执行。
