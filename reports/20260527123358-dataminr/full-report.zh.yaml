  - id: TP003
    title: 所有权、融资与政府业务足迹信号
    columns:
      - 竞争对手
      - 上市 / 私营状态
      - 可佐证的融资或所有权信号
      - 政府业务足迹信号
      - 对 Dataminr 的含义
    rows:
      - - Dataminr
        - 私营
        - 2025 年融资 $85M；TechCrunch 仍引用 2021 年 $4.1B 估值
        - 100+ 家美国政府机构和 20+ 个国际政府
        - 大规模私营资本化叠加公共部门触达，让 Dataminr 很难被视作小众产品
      - - Recorded Future
        - Mastercard 子公司
        - Mastercard 以 $2.65B 收购；此前 2019 年 Insight 交易估值 $780M
        - 定位政府和关键基础设施；在 75 个国家拥有约 1,900 家客户
        - 战略股东可出资推动向支付、反欺诈和企业安全交叉销售
      - - Flashpoint
        - 已被收购的私营公司
        - Tracxn 档案列出 $49M 融资和已被收购状态
        - 官方直接点名国防、执法、情报共同体和公共部门
        - 即便公开估值不透明，公共部门足迹和分析师深度仍有可信度
      - - ZeroFox
        - 私募股权持有的私营公司
        - Haveli 完成私有化交易；每股 $1.14 现金并从 Nasdaq 退市
        - ZeroFox 同时提到大型公共部门客户和企业垂直行业
        - PE 持有可能强化商业纪律和产品聚焦
      - - Babel Street
        - 私营
        - 第三方档案提到 $31.7M ARR、$95M 估值且没有外部融资；置信度有限
        - 官方网站明确面向国防和执法买家
        - 可佐证的公开财务数据很薄，但任务场景足迹清楚
      - - Palantir
        - 上市
        - IR 和 SEC 文件结构提供组内最清晰的披露姿态
        - Army Vantage 和国防工作流页面显示深度嵌入政府
        - 公开市场规模和工作流深度使 Palantir 成为高端相邻威胁
      - - Janes
        - 已被收购的私营公司
        - Tracxn 称 Montagu 于 2019 年收购 Janes
        - 核心产品是面向规划和备战的国防与安全情报
        - Janes 比 Dataminr 更窄，但在国防采购工作流里可信度很高
      - - Meltwater
        - PE 支持的私营公司
        - Goodwin 记录了 Marlin 与 Altor 收购 Meltwater 的协议
        - 政府足迹不是卖点中心；PR 和传播才是
        - 竞争主要争夺传播和声誉预算，而非网络安全任务预算
      - - Brandwatch
        - Cision Group 旗下
        - 官方收购说明称 Cision 以 $450M 收购 Brandwatch
        - 公开材料中政府适配度有限
        - 竞争是预算相邻，在消费者、声誉和市场情报工作流中最强
    notes: 本表单独拆出上市 / 私营属性、融资和政府业务足迹信号，因为这些因素很大程度影响买家信任、分销能力和可能的商业纪律。Flashpoint、Babel Street 和 Janes 的私营公司数字来自档案型来源时，仅作方向性参考。
