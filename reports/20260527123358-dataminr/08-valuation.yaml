- id: bull-base-bear-and-entry-discipline
  title: Bull / base / bear framing implies disciplined entry far below the stale headline
  body: 'The scenario math is straightforward once the comp set is anchored. A Recorded-Future-like outcome gets Dataminr to roughly $1.8 billion. A reasonable premium for stronger cross-functional positioning, deeper government penetration, and a still-private scarcity story can support a base-case range of about $2.0-$2.6 billion, or 10x-13x ARR. That is materially above ZeroFox-style public stress and below the untouched 2021 headline. The bull case reaches roughly $3.2-$4.1 billion only if three things happen together: Dataminr keeps compounding well above $200 million ARR, the IPO window reopens on attractive terms, and buyers start treating the company as a scarce AI-enabled intelligence asset rather than as another structured-capital late-stage private company. The bear case sits around $1.2-$1.8 billion if no priced round appears, structured capital compounds preference uncertainty, and strategic or secondary-style buyers set the tone. That framing leads to one conclusion: do not
    underwrite new money off the 2021 headline alone.'
  claimRefs:
