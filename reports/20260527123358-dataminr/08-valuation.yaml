tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current view
  - Why
  - Decision implication
  rows:
  - - Recommendation
    - Track
    - Business quality is supportable, but fresh price support is not.
    - Stay engaged, but do not anchor on the stale $4.1B mark for new money.
  - - Confidence
    - Medium
    - 2025 financing structure is clear; cap-table, margin, and retention details are not.
    - Need a priced re-mark or materially better disclosure to raise confidence.
  - - Risk rating
    - High
    - Structured capital, no fresh price discovery, and preference uncertainty can all change realized equity value.
    - Treat financing structure as part of downside risk, not a footnote.
  - - Valuation stance
    - Stretched
    - At ~$200M ARR the stale mark implies ~20.5x ARR, far above supportable private comparables.
    - Do not pay 2021-clearing prices without a true IPO-style reset.
  - - Entry discipline
    - $2.0B-$2.6B effective value or wait
    - Base-case comp math clusters near 10x-13x ARR, not 20x-plus.
    - Require either discount, structure protection, or fresh market evidence before entry.
  - - Exit posture
    - IPO or strategic sale needed for upside
    - Only a reopening IPO window or high-premium strategic outcome supports proximity to the stale mark.
    - Underwrite to downside around strategic clearing levels, not headline private marks.
  notes: This is a price-sensitive judgment, not a generic quality score. The company can be attractive while the stale 2021 mark remains too rich for fresh entry.
