- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Latest disclosed scale metric
  - Valuation / multiple / status
  - Relevance
  - Limitation
  rows:
  - - Dataminr (stale mark)
    - ~$200M ARR in 2025
    - $4.1B stale headline; ~20.5x ARR
    - Direct reference point for current private entry debate.
    - Not a fresh priced round; bridge financings leave the mark stale.
  - - Recorded Future
    - ~$300M annual revenue; 1,900 clients / 75 countries
    - $2.65B sale; ~8.8x revenue
    - Best supportable strategic threat-intelligence benchmark.
    - Acquisition multiple is strategic, not a minority private round.
  - - ZeroFox
    - $188.4M ARR; positive free cash flow
    - $1.14/share take-private; public company went private
    - Shows how external-risk vendors can clear at modest public/private values despite scale.
    - Per-share outcome is not directly comparable to a venture private round.
  - - Palantir
    - $4.475B 2025 revenue
    - ~$319B market cap; ~62.7x trailing sales in May 2026
    - Useful public-multiple ceiling for AI narrative exuberance.
    - Too large and too exceptional to anchor a normal Dataminr entry case.
  - - Meltwater
    - 27,000 customers; 2,300 employees
    - 2023 take-private at NOK 18/share
    - Adjacent information-services take-private precedent when public support softens.
    - Media-intelligence economics are not the same as threat-intelligence economics.
  notes: 'Coverage is intentionally selective: only comparables with supportable public valuation or transaction signals are included as anchors. Flashpoint, Babel Street, and Janes are discussed in prose as directional peers rather than hard valuation marks.'
  enumerationScope:
