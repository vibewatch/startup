  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: 2025-instrument-terms
    missingEvidence: Exact coupon, maturity, security, and conversion-discount terms for the March and April 2025 financings.
    whyItMatters: Those terms determine whether the bridge capital is modest optionality or a meaningful claim ahead of common equity.
    diligencePath: Request financing documents, board approvals, and cap-table waterfall outputs from management counsel.
    relatedQuestionRefs:
    - QV027
  - type: private-evidence-only
    severity: blocking
    topic: preference-overhang
    missingEvidence: Full liquidation-preference, participation, and conversion waterfall across Series F and 2025 structured instruments.
    whyItMatters: Enterprise-value ranges can dramatically overstate fresh-money equity value if senior claims absorb exit proceeds first.
    diligencePath: Obtain the full capitalization table with preferred terms and model common-share proceeds under bear/base/bull exits.
    relatedQuestionRefs:
    - QV028
  - type: enumeration-incomplete
    severity: minor
    topic: TV004-comparable-coverage
    missingEvidence: A broader set of supportable public valuation marks for Flashpoint, Babel Street, Janes, and other threat-intelligence peers.
    whyItMatters: The comparable valuation table is intentionally partial because several directional peers lack clean public pricing signals, which limits triangulation precision.
    diligencePath: Continue source discovery for official transaction, financing, or verified secondary valuation signals for directional peers before broadening TV004.
    relatedTableRefs:
    - TV004
  - type: conflicting-data
    severity: material
    topic: secondary-clearing-price
    missingEvidence: Verified 2025-2026 Dataminr secondary transaction data with transparent methodology, not just model-derived indications.
    whyItMatters: A real secondary clear would materially improve valuation triangulation between the stale 2021 mark and current bridge capital reality.
    diligencePath: Source broker-dealer or platform transaction evidence and reconcile it with outstanding share count and share class.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: premium-multiple-justification
    missingEvidence: Gross margin, NRR, sales efficiency, free-cash-flow, and segment-mix evidence strong enough to justify a 15x-plus ARR outcome.
    whyItMatters: Without quality-of-revenue and cash-conversion evidence, a premium multiple is just an untested narrative.
    diligencePath: Review audited financials and cohort analytics, then rebuild scenario valuation on disclosed operating metrics.
    relatedQuestionRefs:
    - QV030
