- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - Dataminr is a real scaled asset, not a paper unicorn
    - Approaching $200M ARR plus deep Fortune 50 and government penetration.
    - Audited ARR bridge, retention, and segment mix would strengthen this leg.
  - - The stale 2021 mark still overstates likely 2026 clearing value
    - No new priced round; 2025 capital was convertible financing and credit.
    - A real priced equity round or IPO filing could re-establish price support.
  - - Convertible capital is a yellow flag, not neutral plumbing
    - TechCrunch and Private Equity Wire both frame the 2025 money as pre-IPO and dilution-managing.
    - Full financing terms that are investor-friendly could reduce the concern.
  - - Recorded Future supports multi-billion strategic value
    - $2.65B sale with roughly $300M revenue implies a healthy but sub-20x multiple.
    - Dataminr needs evidence that it deserves a premium to that benchmark.
  - - Palantir is too hot a comp to anchor entry pricing
    - Palantir trades around 62.7x trailing sales in May 2026.
    - A broader public re-rating of intelligence software, not just AI flagships, would help.
  - - Deeper mission and collection moats can compress Dataminr’s premium
    - Flashpoint, Babel Street, and Janes all market harder-to-reach or mission-grade intelligence depth.
    - Proof that Dataminr owns more of the workflow than just earliest alerting would help.
  notes: 'The thesis and anti-thesis are intentionally symmetrical: company quality is not the same thing as entry attractiveness.'
