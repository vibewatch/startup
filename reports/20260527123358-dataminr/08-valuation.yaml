- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - 2025 instrument terms
    - Coupon, maturity, discount, covenant, security, and conversion hierarchy for March/April 2025 financings
    - These terms determine whether bridge capital is benign optionality or future dilution / control risk.
    - Management, counsel, or financing documents in data room.
  - - Preference stack
    - Full liquidation waterfall across 2021 Series F and later structured capital
    - Fresh-money returns can diverge sharply from enterprise-value math if senior claims sit ahead of common.
    - Cap-table export plus board-approved financing docs.
  - - ARR quality
    - Segment split, multi-year contract mix, gross retention, net retention, and services content inside the ~$200M ARR story
    - Premium multiples depend on quality of ARR, not just quantity.
    - Finance team cohort analysis and board reporting pack.
  - - Margins and cash flow
    - Gross margin, EBITDA bridge, free-cash-flow bridge, and runway after 2025 financings
    - Needed to tell optional bridge financing from necessity financing.
    - Audited financial statements and management model.
  - - Exit readiness
    - IPO prep status, auditor readiness, legal cleanup, and investor-education plan
    - Bull case requires a realistic path to public price discovery rather than indefinite bridge funding.
    - CFO / legal diligence session.
  - - Secondary market evidence
    - Actual observed 2025-2026 secondary clears, if any, not just model-derived indications
    - Helpful for triangulating where common equity might clear today.
    - Primary broker / secondary platform diligence with methodology transparency.
  notes: These asks are the minimum package required before paying above the $2.0-$2.6B base-case range. They are not optional diligence nice-to-haves.
