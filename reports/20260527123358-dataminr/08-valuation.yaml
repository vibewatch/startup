- id: ipo-path-and-final-diligence-gates
  title: IPO-path assumptions and final diligence asks
  body: 'The only credible path back toward the stale 2021 mark is an IPO or near-IPO repricing that resolves the questions the convertibles currently dodge. Investors need the exact economics of the March and April 2025 instruments—coupon, maturity, conversion discount, security package, and any covenant constraints. They also need a clear view of the preference and dilution stack created by the 2021 Series F and any later structured capital. Most importantly, Dataminr would need to disclose the operating metrics that convert a $200 million ARR story into a premium multiple story: segment mix, gross margin, retention, sales efficiency, and free-cash-flow conversion. Until those are visible, the right recommendation is Track with medium confidence and a stretched valuation stance at $4.1 billion. Public evidence supports staying close to the company, but it does not support paying a 2021-clearing price in 2026. A genuine priced round, IPO filing, or disclosed metrics strong enough to justify
    a 15x-plus ARR outcome would move the call; absent that, price discipline is the whole job.'
