- id: TV003
  title: Current financing / stale-mark reality table
  columns:
  - Date / instrument
  - Amount
  - Structure
  - What it means for valuation
  - Key unknowns
  rows:
  - - Mar 2021 Series F
    - $475M
    - Priced equity at $4.1B
    - Still the last disclosed headline mark and therefore the public anchor.
    - Preference terms, remaining proceeds, and current ownership stack.
  - - Mar 2025 NightDragon / HSBC
    - $85M
    - Convertible financing plus credit
    - Fresh capital without fresh common-equity price discovery.
    - Coupon, maturity, discount, covenants, and security package.
  - - Mar 2025 NightDragon SPV capacity
    - Up to $100M
    - Additional potential convertible financing
    - Shows appetite for more structured capital, not necessarily equity repricing.
    - How much was actually drawn and at what economics.
  - - Apr 2025 Fortress
    - $100M
    - Convertible financing
    - Reinforces bridge-style funding and IPO-optionality framing.
    - Conversion hierarchy versus prior investors and common equity.
  - - Nov 2023 layoff
    - 20% / ~150 staff
    - Operating reset
    - Suggests management was already protecting efficiency before the 2025 raises.
    - Whether this created durable margin improvement or just bought time.
  notes: This table is about what the financing structure signals, not whether Dataminr can raise capital. It clearly can; the question is why it chose convertibles over fresh price discovery.
