company:
  name: Dataminr
chapter:
  number: 8
  title: Valuation
  summary: Dataminr’s last disclosed priced mark is still the 2021 $4.1 billion Series F, but the company’s 2025 capital came through convertibles and credit rather than a fresh equity repricing. With ARR now publicly framed around $200 million, the stale mark implies roughly 20.5x ARR—well above the strongest supportable private comp math—so the right call is Track with a stretched valuation stance at the old headline price and clear entry discipline below it.
sections:
- id: stale-mark-still-frames-the-decision
  title: The 2021 mark still frames the conversation, but not the clearing price
  body: 'Dataminr’s valuation story is unusually easy to headline and unusually hard to underwrite. The headline is familiar: the company last raised a priced equity round in March 2021, when it closed a $475 million Series F at a $4.1 billion valuation. The underwriting problem is what that mark means in May 2026 after four more years of market repricing and no new disclosed priced round. Public evidence still supports a serious company—Dataminr says it is approaching $200 million of ARR, it has deep enterprise and government penetration, and the 2021 and 2025 disclosures together show the customer proof has not disappeared. But the stale mark now implies about 20.5x ARR, which is a premium multiple that has to be defended by current price discovery, not by historical fundraising memory. The right investment stance is therefore price-sensitive rather than company-quality-sensitive: the business can be strong while the untouched 2021 price is still too rich for fresh capital.'
  claimRefs:
