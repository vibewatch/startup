schemaVersion: report-v2
artifact: customers
slug: dataminr
runDate: '2026-05-27'
company:
  name: Dataminr
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports Dataminr serving a broad, mission-critical customer base spanning
    800+ organizations overall, deep Fortune 50 penetration, more than 100 U.S. government
    agencies, 20+ international governments, and 1,500+ newsrooms. The strongest named proofs
    are The Associated Press, NATO, HP, and Oklahoma emergency management, while OpenAI and the
    FEMA privacy document are thinner or more historical signals. The core diligence issue is not
    breadth of adoption but verified depth: public materials do not disclose retention, contract
    values for most named customers, or concentration, and enterprise proof still leans heavily on
    anonymous testimonials and partner channels.
sections:
  - id: customer-segments-and-public-footprint
    title: Customer segments and public footprint
    body: >-
      Dataminr's public customer story is broad and unusually visible for a private company, but
      the visible metrics mix several different denominators. Official pages consistently say the
      platform is trusted by more than 100 U.S. government agencies, 20+ international governments,
      two-thirds of the Fortune 50, half of the Fortune 100, and more than 1,500 newsrooms; press
      releases add 30,000+ journalists and nearly 200 public-sector and social-good organizations
      using First Alert. TechCrunch adds a separate topline of 800+ customers overall. Those
      figures should not be added together: 800+ appears to be organization count, 145,000 public-
      sector users is user count, and 30,000 journalists is seat or end-user count within the
      newsroom segment. Still, the segment mix is clear. Dataminr sells into enterprise security,
      public-sector and defense workflows, NGO and humanitarian use cases, and newsroom operations,
      with additional packaging for financial-services teams and executive-protection programs. The
      breadth signal is strong; the monetization split behind that breadth remains opaque because
      Dataminr does not publish segment ARR, paying account counts, or ACV by customer class.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU023, CU032, CU034, CU042]
    tableRefs: [TU001, TU002]
    figureRefs: [FU001]
  - id: named-reference-customers-and-proof-quality
    title: Named reference customers and proof quality
    body: >-
      The quality of Dataminr's public customer proof varies sharply by segment. News and public
      sector are best supported. The Associated Press is the cleanest newsroom proof because
      Dataminr publishes a named case study with AP's Vice President of Global Safety, Risk and
      Resilience describing centralized risk monitoring and a reduction in manual scraping, and AP
      separately shows Dataminr embedded into AP Storytelling. NATO is the strongest named defense
      proof because Dataminr and PRNewswire both describe an expanded First Alert deployment. HP is
      the strongest named enterprise corporate-security proof because Dataminr publishes a detailed
      executive-protection page and a named HP leader quote about mobile alerts and itinerary-based
      monitoring. Oklahoma emergency management gives Dataminr a concrete state-level public-safety
      proof point. By contrast, OpenAI is only publicly evidenced through a TechCrunch line and a
      Dataminr spokesperson quote, while FEMA is supported only by a historical privacy-review file
      title rather than a readable current deployment record. That asymmetry is the key customer-
      proof takeaway: Dataminr has enough named references to prove real use, but not enough deep,
      independently quantified references to prove revenue weight or renewal quality across the full
      base.
    claimRefs: [CU007, CU008, CU009, CU012, CU013, CU017, CU019, CU021, CU027, CU031, CU039]
    tableRefs: [TU003]
    figureRefs: [FU003]
  - id: deployment-patterns-and-channel-access
    title: Deployment patterns and channel access
    body: >-
      Dataminr's strongest public evidence shows the product being embedded inside operating
      workflows rather than used as a casual dashboard. AP uses the product to protect journalists
      in conflict zones and Dataminr alerts now appear directly inside AP Storytelling. HP uses it
      for executive travel and event protection, with tailored alerts tied to executive itineraries.
      Oklahoma emergency management uses First Alert in incident response. Public-sector
      organizations can buy through Carahsoft's NASPO pathways and through AWS Marketplace, while
      Esri says existing First Alert customers are being migrated to ArcGIS Basemaps. Financial-
      services pages show Dataminr also selling market-moving event intelligence into investment and
      risk workflows, and the executive-protection materials show a travel-and-physical-security
      deployment pattern that differs from media and emergency-response use. The important analytic
      distinction is between workflow embedding and procurement access. AP, HP, NATO, and Oklahoma
      demonstrate operational use. Carahsoft, AWS, SoftwareOne, and the partner network prove route
      to market and procurement ease, but they do not by themselves prove end-customer spend,
      retention, or adoption depth.
    claimRefs: [CU010, CU011, CU015, CU016, CU019, CU020, CU021, CU022, CU024, CU025, CU033, CU041]
    figureRefs: [FU002]
  - id: durability-and-expansion-visibility
    title: Durability and expansion visibility
    body: >-
      Dataminr's public customer evidence implies stickiness but stops short of proving it. The
      use cases that are visible—executive protection, emergency management, force protection,
      newsroom alerting, crisis communications, and market-moving intelligence—are inherently
      high-consequence workflows where switching costs can be meaningful once alerts are integrated
      into daily operating procedures. There are several expansion proxies: NATO is described as an
      expanded partnership, AP has progressed from risk-monitoring use toward newsroom workflow
      embedding, and Esri describes a transition of existing First Alert customers to a richer map
      experience. TechCrunch also reports a five-year, $282 million Department of Defense contract,
      which at minimum suggests one large multi-year federal relationship. But none of these public
      signals answer the core durability questions an investor actually needs: Dataminr does not
      publish NRR, GRR, churn, contract terms, seat counts for named accounts, or top-customer
      concentration. Public evidence therefore supports mission-criticality and likely renewal
      potential, but not underwritten renewal economics.
    claimRefs: [CU013, CU014, CU018, CU024, CU029, CU032, CU034, CU035, CU040]
    tableRefs: [TU004]
  - id: adverse-lens-proof-gaps-and-concentration-risk
    title: Adverse lens, proof gaps, and concentration risk
    body: >-
      The main weakness in Dataminr's customer chapter is the gap between headline breadth and
      verified depth. The company can credibly cite scale, but a meaningful share of enterprise
      proof still comes from anonymous customer testimonials such as a major automaker, a rideshare
      platform, a global nonprofit, and a financial-services organization. Featuredcustomers lists a
      much larger inventory of named logos, but many of those direct first-party case-study pages
      were not accessible during this run, so they should be treated as leads rather than fully
      validated current deployments. Public-sector proof is also not frictionless: The Intercept and
      an ACLU coalition letter both show Dataminr's police and protest-monitoring history remains a
      live reputational and procurement issue. That does not negate adoption—if anything it confirms
      real governmental use—but it complicates the clean narrative around public-sector customer
      quality. The biggest remaining diligence asks are top-customer concentration, federal mix,
      newsroom monetization, and whether flagship named accounts like AP, NATO, HP, and any OpenAI
      deployment represent large recurring contracts or simply highly visible reference logos.
    claimRefs: [CU006, CU026, CU028, CU029, CU030, CU031, CU033, CU035, CU036, CU037, CU038, CU039, CU040]
    tableRefs: [TU005]
    figureRefs: [FU004]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - segment
      - buyer / user / payer
      - use case
      - scale indicator
      - strategic value
      - key gap
    rows:
      - - Enterprise corporate security
        - Buyer = security / resilience leaders; users = analysts, GSOCs, crisis teams; payer = enterprise security budget
        - Facilities monitoring, executive travel, crisis communications, employee safety, operational resilience
        - Two-thirds of Fortune 50 and half of Fortune 100 per repeated official claims; HP is named, most other enterprise testimonials are anonymous
        - High-value logo segment with likely multi-workflow stickiness
        - No public ACV, renewal, or top-customer revenue disclosure
      - - Public sector and defense
        - Buyer = federal, state, local, defense, NGO and public-safety leadership; users = operators, fusion centers, emergency teams; payer = procurement / mission budgets
        - Force protection, emergency management, infrastructure protection, law-enforcement awareness, humanitarian response
        - 100+ U.S. government agencies, 20+ international governments, nearly 200 public-sector and social-good organizations, 145,000+ users
        - Strongest named proof base and likely largest contract sizes
        - Public controversy and concentration risk around government usage are unresolved
      - - News and media
        - Buyer = newsroom leadership or safety teams; users = editors, reporters, security staff; payer = newsroom / media budget
        - Early breaking-news detection, reporter safety, editorial workflow acceleration
        - 1,500+ newsrooms and 30,000+ journalists; AP named case study and AP Storytelling integration
        - Best-supported operational workflow proof in public record
        - Revenue per newsroom, churn, and ARPU are not public
      - - Financial services and data-driven risk teams
        - Buyer = trading, risk, research, or platform leaders; users = analysts and model consumers; payer = market-data / risk budget
        - Market-moving event detection, supply-chain and adverse-event intelligence, ESG / risk workflows
        - Official use-case page plus one anonymous financial-services testimonial
        - Expands TAM beyond security and news
        - Named bank / insurer references not publicly visible in reviewed sources
      - - Channel and embedded distribution
        - Buyer = resellers, marketplaces, alliance partners; users = partner sellers and downstream customers; payer = end customer via partner route
        - Procurement and delivery through Carahsoft, AWS Marketplace, SoftwareOne, Esri, Splunk, Palo Alto Networks, Crisis24
        - Multiple channel routes are publicly visible
        - Lowers procurement friction and broadens reach
        - Channel presence does not prove downstream deployment or spend
    notes: >-
      Scale indicators intentionally mix organization and user counts because that is how public
      sources present the market. Dataminr does not disclose segment ARR or customer counts by
      payer class.
    claimRefs: [CU001, CU002, CU004, CU005, CU015, CU016, CU020, CU021, CU025, CU032, CU033, CU041]
