  - id: TU003
    title: Named customer proof table
    columns:
      - customer / user
      - segment
      - deployment or use case
      - production vs. pilot
      - outcome or evidence
      - limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly named Dataminr customers, users, or deployment references that were directly
        fetchable on official, partner, or independent pages reviewed on 2026-05-27. Partial
        because Dataminr's broader customer roster is not public and several aggregator-listed case
        studies were not directly accessible.
    rows:
      - - The Associated Press
        - News / media
        - Dataminr Pulse for Corporate Security used to protect journalists in conflict zones; Dataminr alerts also embedded in AP Storytelling newsroom workflow
        - Production
        - Named AP executive quote, centralized pane-of-glass description, and a live AP workflow integration page
        - No public pricing, seat count, or renewal data
      - - NATO
        - Defense / public sector
        - First Alert for global force and infrastructure protection
        - Production
        - Dataminr and PRNewswire both describe an expanded partnership with NATO
        - No public outcome metric, user count inside NATO, or contract value
      - - HP
        - Enterprise corporate security
        - Executive-protection alerts tied to executive travel, routes, and large events
        - Production
        - Named HP executive-protection leader quote says Dataminr is indispensable on mobile and used for itinerary-based alerting
        - Scope appears real but economic value and global seat count are undisclosed
      - - Oklahoma Department of Emergency Management
        - State emergency management
        - First Alert used to prioritize data and improve emergency response
        - Production
        - Official emergency-management page names OEM and frames the product as cutting response time
        - Evidence is a short snippet rather than a full case study with detailed metrics
      - - United Nations
        - Humanitarian / NGO / public sector
        - First Alert used in more than 100 countries and listed among public-sector social-good users
        - Production appears likely
        - Repeated in official Dataminr press and customer materials; FeaturedCustomers also lists a UN case study
        - No direct UN-authored quote or accessible first-party case-study page reviewed this run
      - - OpenAI
        - Enterprise / strategic logo
        - Unspecified security / risk use according to TechCrunch and a Dataminr spokesperson
        - Public mention only
        - TechCrunch names OpenAI as a customer and quotes Dataminr saying its AI tech steers security across OpenAI
        - No public Dataminr or OpenAI case study, scope, or quote was accessible at runDate
      - - FEMA
        - Federal emergency management
        - Historical situational-awareness and emergency-response use per privacy-review document title
        - Historical proof only
        - Public Brennan Center-hosted file title references FEMA use of Dataminr for situational awareness and emergency response
        - PDF text layer is not readable; current deployment status is unknown and historical only
    notes: >-
      Rows distinguish strong operational proof from thinner logo or document-title proof. OpenAI and
      FEMA are included because they are canonical public signals, but both have materially weaker
      verification depth than AP, NATO, HP, or Oklahoma OEM.
    claimRefs: [CU007, CU009, CU012, CU017, CU019, CU021, CU027, CU031, CU039]
  - id: TU004
    title: Retention, repeat usage, and satisfaction table
    columns:
      - metric
      - value or status
      - segment
      - confidence
      - diligence ask
    rows:
      - - Net revenue retention (NRR)
        - null
        - All segments
        - low
        - Request NRR by segment and by named-account cohort
      - - Gross retention / churn
        - null
        - All segments
        - low
        - Request GRR, logo churn, and gross seat retention
      - - Federal contract durability proxy
        - Five-year, $282M DoD contract reported by TechCrunch
        - Federal / defense
        - medium
        - Confirm product scope, option years, and share of total ARR
      - - Named expansion signal
        - NATO partnership described as expanded; AP integration extends use into AP Storytelling
        - Government and news
        - medium
        - Quantify cross-sell, seat growth, and renewal timing for these accounts
      - - Installed-base continuity proxy
        - Esri says current First Alert users will migrate to ArcGIS Basemaps by year-end 2025
        - Public sector
        - medium
        - Confirm active-user base and migration completion rate
      - - Qualitative satisfaction proxy
        - Positive named quotes from AP and HP plus positive official testimonials
        - News and enterprise
        - medium
        - Collect independent references and net-promoter / satisfaction evidence by segment
      - - Contract length and pricing transparency
        - Mostly undisclosed; AWS page says pricing varies by deployment size and integration scope
        - Enterprise and partner-led deals
        - low
        - Request standard contract terms, billing models, and minimum commitments
    notes: >-
      Null values mean Dataminr does not publicly disclose standard SaaS durability metrics. The
      non-null rows are proxies that suggest embedded usage but do not substitute for true retention
      data.
    claimRefs: [CU016, CU018, CU022, CU024, CU032, CU034, CU035, CU040]
  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - expansion driver
      - concentration or proof risk
      - impact if real
      - diligence path
    rows:
      - - Newsroom workflow embedding via AP Storytelling
        - Public proof concentrated in AP plus broad topline counts
        - Positive for stickiness, but newsroom revenue concentration remains unknown
        - Request newsroom ARR, top-media accounts, and renewal rates
      - - Public-sector procurement access through Carahsoft and AWS
        - Access channels may be mistaken for deployed spend
        - Can overstate adoption depth if channel availability is read as customer count
        - Separate procurement routes from active contracts and seat counts
      - - Government breadth (100+ U.S. agencies, 20+ international governments)
        - Could mask concentration in a few very large federal / defense customers
        - High if DoD or a handful of agencies drive disproportionate revenue
        - Request top-10 customer concentration and federal mix
      - - Enterprise logo inventory beyond HP
        - Corporate-security proof is heavily anonymous
        - Limits confidence in enterprise PMF and renewal economics outside public sector and news
        - Request named references, contract values, and deployment scopes
      - - OpenAI and FEMA canonical signals
        - Both are thin or historical proofs rather than fresh quantified case studies
        - High risk of over-reading headline logos
        - Obtain direct customer quote, procurement record, or current deployment statement
      - - Surveillance controversy around protest monitoring
        - Public-sector customer proof is real but politically and reputationally sensitive
        - Could affect procurement, renewals, or policy constraints in sensitive jurisdictions
        - Review procurement reviews, contract clauses, and customer governance requirements
      - - Partner-network expansion
        - Broad alliance footprint may improve reach but can obscure direct sales efficiency
        - Moderate risk that partner visibility is stronger than closed-won deployments
        - Request channel-sourced pipeline, booked ARR, and partner-attributed retention
    notes: >-
      Expansion and concentration analysis is constrained by the absence of customer-level revenue,
      retention, and contract-size disclosures. Risks are framed as diligence priorities rather than
      proven negative outcomes.
    claimRefs: [CU015, CU016, CU024, CU025, CU030, CU031, CU033, CU035, CU038, CU040]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Common Dataminr customer journey from risk-monitoring need to workflow embedding, with the
      strongest public examples in news, public sector, and executive protection.
    data:
      items:
        - label: Triggering problem
          detail: Customers start with a need for earlier warning on crises, threats, or breaking events affecting people, facilities, travel, or editorial coverage.
          claimRefs: [CU005, CU020, CU041]
        - label: Evaluation and procurement
          detail: Organizations evaluate Dataminr directly or through Carahsoft, AWS Marketplace, SoftwareOne, and alliance partners depending on segment and procurement rules.
          claimRefs: [CU010, CU011, CU015, CU016, CU025]
        - label: Initial workflow embedding
          detail: AP embeds alerts into newsroom workflows, HP ties alerts to executive itineraries, and Oklahoma OEM uses First Alert in emergency-response operations.
          claimRefs: [CU007, CU009, CU021, CU022]
        - label: Daily operational use
          detail: Users monitor facilities, travel routes, crises, protests, and market-moving events through real-time alerts rather than manual open-source monitoring.
          claimRefs: [CU006, CU008, CU019, CU020, CU041]
        - label: Expansion surfaces
          detail: Expansion paths include broader newsroom workflows, more public-sector agencies, richer mapping via Esri, and partner-led deployment into adjacent systems.
          claimRefs: [CU013, CU015, CU024, CU025]
        - label: Renewal decision
          detail: Mission-criticality suggests stickiness, but public evidence on NRR, churn, contract length, and price expansion is absent.
          claimRefs: [CU034, CU040]
    claimRefs: [CU005, CU007, CU009, CU010, CU015, CU016, CU021, CU022, CU024, CU025, CU034, CU041]
  - id: FU002
    title: Adoption and deployment flow
    type: flow
    layout: wide
    summary: >-
      Dataminr's public deployment path runs from procurement access to embedded operational use,
      with the cleanest evidence coming from AP, HP, NATO, Oklahoma OEM, and active First Alert users.
    data:
      nodes:
        - id: route-to-market
          label: Route to market
          detail: Direct sales, Carahsoft public-sector vehicles, AWS Marketplace, SoftwareOne, and technology alliances.
        - id: access-granted
          label: Procurement / access granted
          detail: Customers gain access through contracts, marketplaces, or partner-led purchases.
        - id: workflow-integration
          label: Workflow integration
          detail: Alerts are integrated into AP Storytelling, executive travel monitoring, emergency-response operations, and mapping stacks.
        - id: live-operations
          label: Live operations
          detail: Dataminr becomes part of daily alert triage, incident response, and breaking-news discovery.
        - id: expansion
          label: Expansion
          detail: Additional teams, geographies, or partner capabilities get layered in.
        - id: renewal-opacity
          label: Renewal opacity
          detail: Economic depth and renewal quality are mostly private despite strong operational proof.
      edges:
        - from: route-to-market
          to: access-granted
          label: channel or direct purchase
        - from: access-granted
          to: workflow-integration
          label: implementation / integration
        - from: workflow-integration
          to: live-operations
          label: operational adoption
        - from: live-operations
          to: expansion
          label: broader use cases and users
        - from: expansion
          to: renewal-opacity
          label: economics remain private
    approximationNotes: >-
      The flow is qualitative rather than numeric because public Dataminr materials disclose very
      little conversion, seat, or renewal data. It maps the recurring operational pattern visible in
      the named references.
    claimRefs: [CU009, CU015, CU016, CU021, CU022, CU024, CU025, CU033, CU040, CU041]
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Public customer-proof quality varies by segment: news and public sector have the strongest
      operational evidence, while enterprise breadth and marquee-logo depth remain less verified.
    data:
      columns:
        - Named logo
        - Named operator quote
        - Independent corroboration
        - Outcome specificity
        - Renewal visibility
      rows:
        - label: News / media
          values:
            - Strong (AP plus 1,500+ newsroom claim)
            - Strong (AP risk leader quote)
            - Medium (AP workflow page, ONA sponsor page)
            - Medium (manual-scraping reduction, workflow embed)
            - Weak
        - label: Government / defense
          values:
            - Strong (NATO, UN, Oklahoma OEM, FEMA historical)
            - Weak to medium
            - Medium (PRNewswire, AITech365, HSD Forum, Esri)
            - Medium (force protection, emergency response)
            - Weak
        - label: Enterprise corporate security
          values:
            - Medium (HP named; others anonymous)
            - Medium (HP quote)
            - Weak
            - Medium (rerouting, itinerary monitoring, facilities)
            - Weak
        - label: Financial services
          values:
            - Weak
            - None
            - Weak
            - Medium (market-moving event use case)
            - None
        - label: OpenAI / marquee-mention bucket
          values:
            - Weak (reported mention only)
            - None
            - Weak (TechCrunch + spokesperson quote)
            - None
            - None
    approximationNotes: >-
      Cells reflect evidence quality, not customer quality. Weak means the public record is thin or
      indirect, not that the customer relationship is necessarily small.
    claimRefs: [CU017, CU020, CU027, CU028, CU029, CU030, CU031, CU039]
  - id: FU004
    title: Public customer proof strength by segment
    type: bar
    layout: standard
    summary: >-
      Analyst scoring of Dataminr's public customer-proof depth by segment on a 1-5 scale, based on
      named deployments, named quotes, independent corroboration, and renewal visibility.
    data:
      items:
        - label: News / media
          value: 5
          detail: AP case study, AP Storytelling integration, ONA sponsor proof, and official newsroom scale claims.
          tone: positive
        - label: Government / defense
          value: 4
          detail: NATO, UN, Oklahoma OEM, Carahsoft, Esri, and broad public-sector counts provide strong breadth, but renewal visibility is weak.
          tone: positive
        - label: Enterprise corporate security
          value: 3
          detail: HP is strong named proof, but many other enterprise testimonials are anonymous.
          tone: neutral
        - label: Financial services
          value: 2
          detail: Dataminr clearly sells the use case, but named financial institutions are not visible in the reviewed public record.
          tone: negative
        - label: Partner / channel access
          value: 2
          detail: AWS, Carahsoft, SoftwareOne, and alliance partners prove reach, not downstream spend.
          tone: negative
    approximationNotes: >-
      Scores are analytical and directional, not company-reported metrics. The lens is public proof
      quality rather than customer importance or ARR.
    claimRefs: [CU028, CU029, CU030, CU031, CU033, CU039, CU040]
