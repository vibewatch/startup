      - number: '3.3'
        title: 规模与集成带来韧性，但被替代风险仍然真实
        blocks:
          - type: paragraph
            body: >-
              最近的规模扩张增强了 Modal 的竞争地位。SiliconANGLE 和 Automater 都报道了 7.5 亿美元融资、157.5 亿美元估值、超过 10
              亿美元年化收入，以及已成为重要独立产品线的沙箱业务。这种规模在竞争上很重要，因为它能为产品扩张提供资金，也让 Modal
              比小型点状方案更有余量吸收宕机、容量波动或定价压力。即便如此，同一证据并不支持其对该品类形成牢固控制。Modal 仍是闭源托管平台；Daytona 和 Beam.cloud
              保留自托管或开源退出路径；Vercel、Cloudflare、AWS、Azure 和 Google 的生态原生替代方案也在持续改善，满足偏好留在现有技术栈内的客户。因此，Modal
              在高增长智能体场景中比在商品化推理或重视控制权的部署中更难被替代。
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: Modal 赢在广度，而不是成为最便宜的裸 GPU 供应商
