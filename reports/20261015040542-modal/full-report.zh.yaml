              Modal 官方材料支持按秒计量、缩容至零和广泛 GPU
              目录，但也警告客户总成本可能包括存储、网络、套餐费用及其他资源。这些限定条件排除了“无服务器计费总能降本”的简单说法。保留的证据没有完整价目表，也没有实际价格分布，因此不能把标价机制混同于收入产出或毛利率。

              Sacra 将其 go-to-market 描述为以 B2B 为主，面向机器学习工程师、AI 研究者和开发团队。其还指出，云市场集成可以让企业使用符合条件的已承诺云支出，从而降低采购摩擦。在供给侧，AI
              Daily Insights 报道 Modal 从 20 多个云获取容量，官方指南列出 11 种有价格的 GPU 配置。这种广度可以改善可用性和采购弹性，但也让模式暴露于第三方容量价格和未公开的供应商经济性。
