  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：AI 原生无服务器基础设施，而非通用云
        blocks:
          - type: paragraph
            body: >-
              Modal 的公开定位和第三方评测一致将其归为无服务器 AI 基础设施，而不是通用云托管。核心产品是面向定制 AI 工作负载的代码定义计算：开发者在代码中配置
              GPU、存储、扩缩容和端点，而不是租用裸虚拟机或自行编排 Kubernetes。该边界包括推理端点、批处理任务、训练、notebook 和安全代码执行沙箱，但不包括专用预留 GPU
              集群、通用容器平台，以及将工作负载代码完全抽象掉的成品模型 API。实际而言，Modal 争夺的是 AI 团队原本会花在 GPU 租赁上的预算，以及把这些工作负载做成生产系统所需的工程人力。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 资料缺少清晰 TAM，因此规模测算必须依赖运营视角
        blocks:
          - type: paragraph
            body: >-
              证据池中没有独立分析师或监管来源能够清晰量化“无服务器 AI 基础设施”在 2026 年的 TAM、SAM 或 SOM，因此给出单一市场数字会制造虚假的精确感。资料支持的是一组受约束的规模代理指标：Modal
              覆盖的云、区域和 GPU 选项；推理和沙箱的公开声称吞吐量与并发量；以及公司自报的 ARR 加速——这一加速发生在 AI
              推理基础设施融资异常活跃的一年。这些信号说明推理、训练、智能体沙箱和内部助手拥有广阔可触达机会，但不能证明其在独立测量市场中的份额。尽调含义是，估值应绑定采用质量和工作负载经济性，而不是泛泛的“大 TAM”叙事。
            claimRefs:
              - CM005
              - CM006
              - CM013
              - CM014
              - CM015
