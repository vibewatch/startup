              最新融资在这里仅作为未来资本充足度的输入；逐轮时间线应放在公司概览中。Sacra 和独立报道称，Modal 于 2026 年 10 月以 157.5 亿美元投后估值完成 7.5 亿美元 D 轮，Sacra
