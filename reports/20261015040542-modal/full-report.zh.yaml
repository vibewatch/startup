        title: 身份、产品范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              在本次资料范围内，Modal 的定位非常清晰：公司将自己描述为服务于 AI 应用构建、训练和上线团队的云基础设施，独立资料也一致将其定位为无服务器 GPU 平台。产品范围并非单一推理端点供应商。官方页面把
