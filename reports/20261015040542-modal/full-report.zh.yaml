  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 估值判断遵循一条简单链条：需求证据和产品证据很强，但披露和下行保护落后于价格。
    data:
      nodes:
        - id: demand-proof
          label: 需求证据
          detail: 截至 2026 年 10 月 ARR 超过 $1B；Sandbox ARR 约 $300M，启动次数接近 3B。
        - id: product-proof
          label: 产品证据
          detail: AI 原生运行时、覆盖 20+ 个云的弹性调度、即时 GPU 访问和按秒计费。
        - id: pricing-context
          label: 定价背景
          detail: 2026 年 10 月 Series D 约为 $15.75B 至 $16.0B，隐含十几倍的 ARR 倍数。
        - id: risk-load
          label: 风险负荷
          detail: 客户集中度未披露，评测来源警告锁定效应和成本意外风险。
        - id: entry-discipline
          label: 入场纪律
          detail: 需要私有数据证明利润率、留存、集中度、治理和优先权条款。
        - id: recommendation
          label: 建议
          detail: 持续跟踪；在尽调弥补公开信息缺口前，估值偏高。
      edges:
        - from: demand-proof
          to: product-proof
          label: 支撑溢价定位
        - from: product-proof
          to: pricing-context
          label: 解释支付意愿
        - from: pricing-context
          to: risk-load
          label: 提高投资判断门槛
        - from: risk-load
          to: entry-discipline
          label: 需要更多证据
        - from: entry-discipline
          to: recommendation
          label: 因此继续跟踪
    approximationNotes: 该流程总结投资逻辑，而非量化模型；估值表述使用留存来源中的四舍五入公开数据。
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV010
      - CV014
      - CV015
      - CV016
