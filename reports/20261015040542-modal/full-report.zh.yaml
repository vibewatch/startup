              - CM009
              - CM013
              - CM014
      - number: '2.3'
        title: 买方集中在平台工程，弹性是切入口，成本是拖累
        blocks:
          - type: paragraph
            body: >-
              公开证据指向三类主要买方：以 Python 为主、交付突发式推理的初创和成长型 AI
              团队；部署内部助手的企业平台团队；以及需要具备生产并发能力的安全代码执行的智能体开发者。三类买方的触发点相近：部署更快、没有闲置基础设施，并且无需先搭建平台团队就能获得可信的安全和可观测性。采用阻力也高度一致。评测反复提醒，保证执行、区域价格乘数和较高的稳态利用率可能抹平无服务器
              GPU 的经济优势；需要预留容量、定制网络或成品端点的团队，则可能偏好专用租赁、基于 Kubernetes 的平台或其他供应商。因此，Modal 更适合利用率呈尖峰、开发者时间稀缺的场景，而不是计算持续运行、最低
              GPU 小时成本占主导的场景。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
              - CM015
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 弹性是切入口；稳态利用率才是经济性检验
            body: 当团队更重视开发效率和突发扩容、而不是绝对最低的 GPU 小时价格时，Modal 最有优势。一旦工作负载变成常驻运行或要求保证执行，买方就必须与专用替代方案做基准比较，不能假定无服务器溢价始终合理。
            calloutType: insight
            claimRefs:
              - CM007
              - CM010
              - CM011
              - CM012
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争版图覆盖直接运行时、生态替代品与底层托管
        blocks:
          - type: paragraph
            body: >-
              Modal 面对的不是单一同业集合。其 2026 年对比页面将市场描述为安全代码执行专业厂商、更广泛的云生态，以及具备 GPU 能力的沙箱或平台供应商的组合，而非狭窄的无服务器 GPU
              细分市场。独立资料也印证了这一点：BearPlex 将 Modal 与 AWS SageMaker、Vertex AI、Anyscale、RunPod、Replicate 和 Together AI
              并列，Prismix 则直接从 GPU 托管经济性角度比较 Modal、Replicate、RunPod 和 Vast.ai。买方因此有多条路径解决同一底层任务：采用集成式智能体运行时，使用嵌入既有 Web
              或云技术栈的生态原生沙箱，或自行组装更底层的 GPU 基础设施。因此，尽调真正要问的不是 Modal 是否存在直接竞争，而是哪类买方工作流足够看重托管范围，愿意接受 Modal 的溢价抽象层。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP014
      - number: '3.2'
        title: 能力广度和定价更适合突发式智能体工作负载，而非最低价裸 GPU 路径
        blocks:
          - type: paragraph
            body: >-
              当客户希望通过一个托管界面获得推理、训练、批处理和安全沙箱，并拥有广泛 GPU 供应和合规控制时，Modal 的竞争力最强。同一批资料也说明了切换为何仍然可行：E2B 以基于 Firecracker
              的临时执行形成差异化，Daytona 主打持久化和自托管工作区，Beam.cloud 主打开源及自托管的无服务器 GPU 控制，Vercel 或 Cloudflare
              则更紧密地绑定周边生态。公开定价信号方向一致：Prismix 显示 Modal 与 Replicate 的 A10G 约为 $0.59/小时，高于 RunPod 约 $0.44 和 Vast.ai 约
              $0.20-$0.35。BearPlex 基于实际使用得出类似结论：工作负载突发且运营速度重要时 Modal 胜出，但持续、长期高温运行的推理可以转向专用基础设施或经济性更好的托管端点。
            claimRefs:
              - CP003
              - CP004
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
