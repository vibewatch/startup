      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - ARR 保持在 2026 年 10 月跃升后的水平之上，Sandbox 需求继续扩大，私募市场对 AI 基础设施的兴趣仍然高涨。
        - $18 billion 至 $20 billion 区间，即在可持续扩大的收入基础上约 18 倍至 20 倍，需要持续增长和更清晰的经济性同时成立。
        - 锁定效应反噬、基础设施竞争，或扩张带来的利润率稀释。
        - 需要私有数据证明毛利率和留存，并且 Series D 之后的产品路线图取得可见进展。
      - - 基准
        - ARR 的跃升是真实的，但披露仍然稀薄，市场继续按当前十几倍附近的倍数为 Modal 估值。
        - $15 billion 至 $16 billion 区间，即大致贴近当前定价，最符合今天的公开证据。
        - 没有更充分披露时，重估上行空间有限。
        - 当前 Series D 价格和 5 月至 10 月的规模增长证据支持这一情景。
      - - 悲观
        - 增长回归常态，集中度高于预期，或私有尽调展开后经济性令人失望。
        - $10 billion 至 $12 billion 区间，即以 $1 billion 收入基础计算约 10 倍至 12 倍，反映披露质量落后时的倍数压缩。
        - 公司证明利润率具备持久性之前，价格重置可能已经到来。
        - 更弱的下一轮定价、ARR 质量放缓或不利的优先权条款，都会强化这一情景。
    notes: 情景区间是分析师基于 Modal 公开融资历史和已报道的 2026 年 10 月 ARR 得出的估计，不是二级市场报价或经审计的公开市场可比公司数据。
