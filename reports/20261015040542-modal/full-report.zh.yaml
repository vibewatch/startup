figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公开时间线显示，公司从早期产品发布快速走向后期融资和规模化 Sandbox 收入，但若干治理细节仍然缺失。
    data:
      items:
        - date: 2021-08
          label: 公司成立
          detail: Sterling 将 Modal 的成立时间追溯至 2021 年 8 月，地点为纽约，创始人为 Erik Bernhardsson 和 Akshat Bubna。
          claimRefs:
            - CO002
            - CO016
        - date: '2022'
          label: Functions 发布
          detail: Sterling 的时间线显示，Modal Functions 于 2022 年进入市场，是面向 AI/ML 工作负载的 Python 风格无服务器容器 API。
          claimRefs:
            - CO015
        - date: 2023-05
          label: Series A
          detail: Sterling 列出的 $16 million Series A 由 Redpoint Ventures 领投。
          claimRefs:
            - CO016
        - date: 2025-Q1
          label: Sandboxes 正式商用
          detail: Sterling 称 Modal Sandboxes 于 2025 年第一季度正式商用，将智能体执行定位为独立产品线。
          claimRefs:
            - CO015
        - date: '2025-10-01'
          label: 独角兽估值下的 Series B
          detail: Built In NYC 报道称，$87 million 的 Series B 将 Modal 估值推至 $1.1 billion，累计融资额达到 $111 million。
          claimRefs:
            - CO006
        - date: 2026-05
          label: Series C 重定价
          detail: Wowtale 称，Modal 于 2026 年 5 月融资 $355 million，估值为 $4.65 billion。
          claimRefs:
            - CO008
