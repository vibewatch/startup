  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开客户证据显示，客户会从快速开发者试用，逐步走向更高量的 Sandbox、编码智能体和企业助手工作负载。
    data:
      nodes:
        - id: trial
          label: 开发者主导的试用
          detail: ML 和平台工程师被 Python 定义的基础设施、按秒计费和快速获取 GPU 容量所吸引。
          touchpoints:
            - Code-first infrastructure defined in Python
            - Per-second billing and fast feedback loops
        - id: initial-workload
          label: 初始生产工作负载
          detail: 客户从推理、训练、批处理或容器化 AI 后端开始，这些场景都受益于弹性扩展。
          touchpoints:
            - Inference and training are core entry points
            - Production use often starts in AI-native product teams
        - id: named-proof
          label: 已点名的生产证据
          detail: Suno、Ramp 和 DoorDash 等公开案例不止展示 logo，而是把 Modal 与具体工作流或结果联系起来。
          touchpoints:
            - Suno speed-to-market example
            - Ramp and DoorDash deployment references
        - id: sandbox-expansion
          label: Sandbox 扩张
          detail: 随着客户增加编码智能体、内部助手或其他智能体工作负载，安全代码执行成为第二个增长面。
          touchpoints:
            - Lovable 1M+ sandboxes in 48 hours
            - Ramp Inspect on Modal Sandboxes
        - id: enterprise-controls
          label: 企业控制
          detail: 使用深入后，客户案例强调合规、隔离和内部助手部署，而不只是原始算力。
          touchpoints:
            - Enterprise assistant positioning
            - Secure sandbox execution and compliance features
        - id: durability-test
          label: 持久性检验
          detail: 由于留存、GRR、NRR 和头部账户敞口仍未披露，公开叙事在续约和集中度阶段更难验证。
          touchpoints:
            - No public cohort or churn disclosure
            - Independent reviews flag cost and lock-in friction
    approximationNotes: 旅程阶段总结反复出现的公开证据点，而不是具有共同分母的计量漏斗。
