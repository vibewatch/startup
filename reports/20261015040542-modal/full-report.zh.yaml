  - id: FM001
    title: 受证据约束的机会堆栈
    type: pyramid
    summary: 由于指定来源池缺少独立 TAM 来源，该堆栈采用有证据支持的部署边界代理指标，展示 Modal 可能覆盖哪些工作负载层。
    data:
      items:
        - label: 区域覆盖
          value: 100+ regions
          note: 官方平台页面称覆盖 100+ 个地区
        - label: 云覆盖
          value: 20+ clouds
          note: 官方平台页面称覆盖 20+ 个云
        - label: GPU 菜单
          value: 11 priced configurations
          note: 官方 GPU 供应商对比列出从 T4 到 B300 的选项
        - label: 推理弹性
          value: 1,000+ GPUs
          note: 官方 GPU 供应商对比称可即时扩展至 1,000+ 张 GPU
        - label: Sandbox 并发
          value: 100k+ concurrent
          note: 官方 Sandbox 对比称支持 100k+ 个并发 Sandbox
        - label: 长时运行
          value: 24 hours
          note: 官方企业助手对比称函数超时可达 24 小时
    approximationNotes: 这些数值是异质的容量代理指标，不是可相加的市场层级；它们说明可触达的工作负载广度，而非成比例的市场份额或已验证的美元 TAM。
