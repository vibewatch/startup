  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 用量创造收入，但只有一条产品线被量化
        blocks:
          - type: paragraph
            body: >
              Modal 变现的是基础设施消耗，而不只是席位。Sacra 将其描述为 B2B、按使用量计费的模式，客户按秒支付计算费用；Modal 自有材料则说明 Functions
              可缩容至零，但已配置的热容量仍会计费。这确定了收入机制：推理、训练、批处理和智能体执行产生按 CPU 或 GPU 用量计量的活动，进而形成收入。但这不能证明收入确认政策、实际企业费率、折扣或最低承诺。

              公开增长势头异常强劲，但仍需区分归因。Sacra 估算 Modal 在 2026 年 10 月达到 $1 billion 年化收入；其他报道转述 Modal 的说法，称年化收入运行率超过 $1
              billion，同比增幅超过十五倍。Sandboxes 是唯一披露的产品级贡献，年化运行率约 $300 million，约占 $1 billion 总里程碑的 30%。其余收入没有公开分配到
              Functions、推理、训练、存储、网络、套餐或支持服务。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
