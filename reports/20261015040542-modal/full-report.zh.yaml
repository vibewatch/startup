          note: 2026 年估值大幅重置后，对增长放缓或利润率证据不完整的容忍度有限。
          values:
            - 高
            - 高
            - 低-中
            - 高
    approximationNotes: 定性排名综合留存来源中的证据；不推断未报告的事件发生率或内部利润率数据。
