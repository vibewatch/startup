  - id: FI001
    title: 收入模式与利润率风险桥
    type: flow
    summary: 工作负载活动转化为计量收入，而采购选择和第三方 GPU 容量共同决定尚未披露的毛利润结果。
    data:
      nodes:
        - id: workloads
          label: 客户工作负载
          detail: 推理、训练、批处理和智能体执行创造资源需求。
        - id: functions
          label: Functions 与计算
          detail: 代码定义的工作负载消耗 CPU 和 GPU 资源。
        - id: sandboxes
          label: Sandboxes
          detail: 隔离的智能体环境消耗 CPU、内存和可选的 GPU 资源。
        - id: metering
          label: 按秒计量
          detail: 已配置资源的使用时间是公开的主要计费机制。
        - id: procurement
          label: 套餐与市场
          detail: 企业采购可以转入承诺云支出，并叠加套餐经济性。
        - id: revenue
          label: 年化收入
          detail: Sacra 估计 2026 年 10 月为 $1B；据报道 Sandboxes 约为 $300M。
        - id: supplier-costs
          label: 第三方容量成本
          detail: 覆盖 20+ 个云的容量池扩大了供应范围，也带来投入成本敞口。
        - id: gross-profit
          label: 毛利润
          detail: 产品层面毛利率和供应商成本转嫁情况仍未披露。
      edges:
        - from: workloads
          to: functions
          label: 通用计算需求
        - from: workloads
          to: sandboxes
          label: 智能体运行时需求
        - from: functions
          to: metering
          label: 资源秒数
        - from: sandboxes
          to: metering
          label: CPU、内存和 GPU 秒数
        - from: metering
          to: procurement
          label: 按账户条款计费的用量
        - from: procurement
          to: revenue
          label: 客户支出
        - from: supplier-costs
          to: gross-profit
          label: 基础设施投入成本
        - from: revenue
          to: gross-profit
          label: 减：未披露的交付成本
    approximationNotes: 这是结构性流程，而非量化会计瀑布图；其中不代表任何转化率、收入确认时点或毛利率数值。
    claimRefs:
      - CI003
      - CI005
      - CI008
      - CI009
      - CI014
      - CI015
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 分层展示 Modal 公开材料中反复出现的代码定义开发界面、运行时平面和控制层。
    data:
      layers:
        - label: 开发者界面
          detail: 团队交付 AI 工作负载时以代码定义的入口
          modules:
            - Python 应用和函数定义
