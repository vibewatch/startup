              HIPAA。对销售不受信任代码安全执行的企业而言，这些控制很有意义。剩余问题在于证据范围，而非明显矛盾。本次资料没有保留审计报告、独立事故审查、监管申报或法院记录来说明这些控制覆盖多少产品、客户数据类别或司法辖区，因此合规和法律放行仍是尽调事项，而不是已核实事实。
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR014
          - type: table
            tableRef: TR001
