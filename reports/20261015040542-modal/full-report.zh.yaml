  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 有证据支持的序位定位显示，Modal 更偏向集成平台广度，而 Daytona 和 Beam.cloud 在部署控制上得分更高。
    data:
      xAxis:
        label: 智能体工作负载的平台广度
        min: 1
        max: 5
        low: 单一用途或窄型执行层
        high: 集成式 AI 平台
        description: Evidence-backed ordinal synthesis from cited public capabilities
        scale: ordinal
      yAxis:
        label: 部署控制 / 可移植性
        min: 1
        max: 5
        low: 托管且绑定供应商
        high: 自托管或开放基础设施
        description: Evidence-backed ordinal synthesis from cited public capabilities
        scale: ordinal
      points:
        - label: Modal
          x: 4.8
          'y': 2
          note: 统一提供 Sandbox、推理、训练和批处理，并配备托管多云容量，但产品闭源且为托管模式。
        - label: E2B
          x: 2.4
          'y': 2.3
          note: 凭借 Firecracker 隔离，擅长安全代码执行；但现有证据对其更广泛的平台范围支持较弱。
        - label: Daytona
          x: 2.9
          'y': 4.2
          note: 持久化工作区和自托管 / 开源选项提高了买方控制力，但集成广度不及 Modal。
        - label: Beam.cloud
          x: 3
          'y': 4.8
          note: 开源无服务器 GPU 平台支持自托管，强调基础设施控制和较低锁定。
        - label: Vercel Sandbox
          x: 2.3
          'y': 1.8
          note: 更适合被理解为 Vercel 生态中的执行层，而非广泛的 AI 基础设施套件。
        - label: Cloudflare Sandbox
          x: 2.2
          'y': 2.1
          note: 原生于 Workers 的代码执行为 Cloudflare 用户拓宽了选择，但现有证据覆盖范围仍窄于 Modal 的平台范围。
    approximationNotes: 坐标轴是分析师基于引用的公开能力定位、部署模式和产品广度给出的序位评分，不是测量所得的基准测试结果。
