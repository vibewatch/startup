companyProfile:
  summary: >
    Modal 是一家总部位于纽约的无服务器 AI 基础设施公司，约于 2021 年由 Erik Bernhardsson 和 Akshat Bubna
    创立。平台让团队用代码定义计算、GPU、沙箱、存储和调度行为，然后依托大型多云容量池运行推理、训练、批处理任务和安全的智能体工作负载，无需自行管理基础设施。当前产品包括
    Functions、Inference、Training、Sandboxes，以及合规、网络和云市场分发接口等企业控制能力。公开证据显示，Modal 的业务规模已远超 2026 年年中：2026 年 10 月报道显示，公司完成
    7.5 亿美元 D 轮融资，投后估值 157.5 亿美元，年化收入超过 10 亿美元；其中 Sandboxes 单独约为 3 亿美元年化收入。
