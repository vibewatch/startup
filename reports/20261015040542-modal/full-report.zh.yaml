              的现金余额、月度经营烧钱、现金跑道、债务或项目融资义务，也没有披露下一轮融资触发条件。同一证据集也没有披露按产品划分的毛利率、营运资金需求、资本开支、CAC、回收期、NRR 或客户集中度。因此，不能从融资
