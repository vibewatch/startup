    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal rates, and cohort retention by product line or customer segment.
    whyItMatters: >-
      Demand looks real, but without retention data it is impossible to separate rapid new-logo growth from durable
