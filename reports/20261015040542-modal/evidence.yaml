evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current company-confirmed employee count with date and functional breakdown.
    whyItMatters: >-
      Headcount is a core scale signal and affects judgments about operating leverage, hiring intensity, and execution
      capacity.
    diligencePath: Request the current org chart or a dated employee census from management and reconcile it with public profiles.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Full board composition, committee structure, and board or observer rights by investor.
    whyItMatters: >-
      Late-stage private-company governance influences control, financing flexibility, and downside protection for new
      investors.
    diligencePath: Obtain the board deck, charter documents, and latest financing documents or investor rights agreement.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-count-and-concentration
    missingEvidence: Exact active customer count, top-customer concentration, and the split between sandbox and non-sandbox revenue.
    whyItMatters: The chapter can cite marquee logos and run-rate claims, but not the breadth or durability of the revenue base.
    diligencePath: Request a customer concentration table, cohort retention view, and product-level revenue mix from management.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: >-
      A reconciled financing ledger covering Seed through Series D, including total proceeds, liquidation preferences,
      and any secondary sales.
    whyItMatters: Public sources establish valuation momentum but do not show the real ownership and downside stack behind it.
    diligencePath: >-
      Request the capitalization table, financing docs, and a round-by-round investor schedule from counsel or
      management.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      An independent 2026 TAM or segment-level spend estimate for serverless AI infrastructure, AI-agent sandboxes, or
      custom enterprise-assistant infrastructure.
    whyItMatters: >-
      Without an external denominator, market-share and multiple-based valuation arguments can overstate how much of the
      reachable market is actually addressable by Modal.
    diligencePath: >-
      Add analyst, public-company, or trade-association sources that quantify spend by workload segment and separate
      serverless from broader cloud or AI software categories.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-owner
    missingEvidence: >-
      Customer procurement evidence showing the exact budget line owner for inference, sandbox, and internal-assistant
      deployments.
    whyItMatters: >-
      The buyer and payer map is currently inferred from product messaging and use cases, which can misstate how
      land-and-expand actually happens in enterprise accounts.
    diligencePath: >-
      Request customer references, win-loss notes, procurement templates, or case studies that identify whether spend
      sits in cloud, platform, security, or line-of-business budgets.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: geography
    missingEvidence: Revenue or workload mix by geography, vertical, and product line.
    whyItMatters: >-
      The chapter can show breadth of supported workloads but cannot distinguish whether demand is concentrated in a few
      AI-native cohorts or already diversified across larger enterprise pools.
    diligencePath: >-
      Obtain internal cohort, revenue-mix, or deployment-mix reporting and reconcile it against the public customer
      examples in news and company sources.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: enumeration-incomplete
    severity: material
    topic: long-tail-competitor-coverage
    missingEvidence: >-
      A fuller win-loss style list of smaller niche agent runtimes and sandbox vendors beyond the six public comparators
      retained here.
    whyItMatters: >-
      Modal competes in a fast-moving market where emerging entrants can pressure pricing or feature expectations before
      they become large enough to appear in broad comparison articles.
    diligencePath: >-
      Request internal win-loss data, recent competitive bake-off decks, and top-20 opportunities lost to sandbox or
      self-host alternatives over the last two quarters.
    relatedQuestionRefs:
      - QP001
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-discounts
    missingEvidence: Actual enterprise contract pricing, reserved-capacity terms, and discounting behavior for Modal and named rivals.
    whyItMatters: >-
      List prices are directionally useful but do not show whether Modal can hold margin or win enterprise deals once
      negotiated discounts and committed-spend packages are included.
    diligencePath: >-
      Obtain recent customer proposals, committed-spend schedules, and at least three deal comparisons where Modal was
      shortlisted against lower-level GPU infrastructure.
    relatedQuestionRefs:
      - QP005
      - QP006
  - type: private-evidence-only
    severity: material
    topic: switching-costs-and-churn
    missingEvidence: >-
      Customer-level migration, multi-homing, and churn evidence showing how often workloads leave Modal for self-hosted
      or incumbent-cloud substitutes.
    whyItMatters: >-
      The durability debate ultimately depends on whether Modal's code-first ergonomics create stickiness or whether
      buyers can re-platform once volumes stabilize.
    diligencePath: >-
      Ask management for cohort retention by product line, top competitive losses, and examples of workloads that
      graduated from Modal to dedicated infrastructure.
    relatedQuestionRefs:
      - QP004
      - QP005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Revenue, recognized-revenue policy, realized pricing, and gross margin by Functions, Sandboxes, training, storage,
      networking, plans, and support.
    whyItMatters: A single product run-rate figure cannot establish the durability or profitability of the remaining revenue base.
    diligencePath: >-
      Request monthly product-level revenue, discounts, credits, recognition policy, infrastructure COGS, and
      gross-margin schedules.
    relatedQuestionRefs:
      - QI002
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency-and-retention
    missingEvidence: CAC, payback, NRR, churn, contraction, and top-10 customer concentration by segment.
    whyItMatters: These metrics determine whether usage growth reflects durable expansion or expensive, concentrated demand.
    diligencePath: Request cohort retention, customer-concentration, and fully loaded sales-efficiency dashboards by segment.
    relatedQuestionRefs:
      - QI007
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: >-
      Current cash balance, monthly operating burn, debt or project-finance obligations, next-round trigger, and
      base/downside runway.
    whyItMatters: Funding raised is not cash available, so financing headlines cannot establish capital adequacy.
    diligencePath: Request the latest board finance pack, debt schedule, use-of-funds plan, and runway sensitivities.
    relatedQuestionRefs:
      - QI008
      - QI010
    relatedTableRefs:
      - TI003
  - type: access-blocked
    severity: minor
    topic: source-verification
    missingEvidence: >-
      The prefetched The AI World artifact contains only publisher-description text rather than the target Modal
      article.
    whyItMatters: >-
      The target URL cannot independently corroborate its advertised funding and revenue assertions from the preserved
      text.
    diligencePath: Treat the URL as unusable unless a future permitted retrieval captures the actual article body.
    relatedQuestionRefs:
      - QI001
