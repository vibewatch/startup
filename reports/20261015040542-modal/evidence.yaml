    severity: material
    topic: reliability-proof
    missingEvidence: An independently reported status-page, SLA, outage log, or customer postmortem tied to Modal production workloads.
    whyItMatters: >-
      Deployment-risk underwriting is weak without public uptime evidence, especially now that Modal is positioning
      sandboxes for large enterprise and agent workloads.
    diligencePath: >-
      Request 12-month availability metrics, incident history, and customer references covering production outages and
      response times.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: private-evidence-only
    severity: material
    topic: compliance-scope
    missingEvidence: >-
      Current SOC 2 report, HIPAA BAA scope, pen-test summary, and architecture documentation for tenant isolation and
      key management.
    whyItMatters: >-
      Public marketing claims establish positioning, not whether the actual control scope is sufficient for regulated or
      security-sensitive deployments.
    diligencePath: Obtain the security packet, trust-center artifacts, and an enterprise architecture review under NDA.
