      adoption.
    diligencePath: >-
      Request active-developer metrics, changelog cadence, and any public repo or package-download telemetry Modal is
      willing to disclose.
    relatedQuestionRefs:
      - QE005
      - QE008
  - type: missing-source
    severity: minor
    topic: steady-state-economics
    missingEvidence: >-
      Benchmarking of cold-start, cost, and performance under steady high-utilization workloads against reserved GPU
      alternatives.
    whyItMatters: >-
      Independent guides say workload shape matters, but the assigned pool does not quantify where Modal loses its
      economic advantage.
    diligencePath: >-
      Run a customer-workload bake-off comparing bursty and steady traffic profiles across Modal and reserved GPU
