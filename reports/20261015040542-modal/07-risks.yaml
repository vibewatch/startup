        - label: "Burst-cost volatility"
          note: "Per-second billing helps utilization, but parallel GPU bursts can still create customer and margin shocks."
          values: ["Medium", "High", "Low-Medium", "High"]
        - label: "Valuation and execution stretch"
          note: "A steep 2026 valuation reset leaves limited tolerance for slower growth or incomplete margin evidence."
          values: ["High", "High", "Low-Medium", "High"]
    approximationNotes: "Qualitative rankings synthesize retained source evidence; they do not infer unreported incident rates or internal margin data."
    claimRefs: [CR001, CR003, CR004, CR005, CR008, CR010, CR012, CR014, CR015]
callouts:
  - calloutType: risk
    title: Primary kill criterion
    body: >-
      A material security or tenant-isolation failure, or enterprise procurement friction caused by
      inability to furnish independent compliance-scope evidence beyond company-authored pages, would
      break the current premium thesis faster than additional ARR growth could repair it.
    claimRefs: [CR002, CR003, CR007, CR014]
  - calloutType: risk
    title: Secondary kill criterion
    body: >-
      If AI-native usage growth slows before Modal can show durable margin discipline and cost
      controls, the move from $4.65B to $15.75B in five months leaves substantial valuation downside
      even if customer adoption remains real.
    claimRefs: [CR005, CR008, CR009, CR010]
