  productSummary: >
    Modal sells serverless AI infrastructure: code-defined Functions and Inference for CPU/GPU workloads, Training and
    batch compute, isolated Sandboxes for untrusted or agent-executed code, and enterprise controls that support
    security review and deployment on regulated stacks. The platform emphasizes per-second metering, scale-to-zero
    behavior, and a multi-cloud GPU scheduler rather than self-managed infrastructure.
  customerFocus: >
    AI-native software builders, ML and platform engineers, coding-agent operators, and enterprise AI teams that need
    bursty inference, training, or secure code execution without building a GPU fleet.
  businessModel: >
    Primarily consumption-based per-second billing for compute and sandboxes, supplemented by enterprise contracts,
    cloud marketplace distribution, and support / plan economics.
  stage: Series D
  fundingStatus: >
    Modal's latest public financing is a $750 million Series D in October 2026 at a $15.75 billion post-money valuation,
    following a $355 million Series C in May 2026 and an earlier Series B that public sources still do not reconcile
    cleanly. Public coverage and company materials indicate the business has crossed $1 billion in annualized revenue,
    but disclosed gross margin, burn, runway, and retention remain unavailable.
