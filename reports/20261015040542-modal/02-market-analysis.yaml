  evidenceGaps:
    - type: missing-source
      severity: material
      topic: tam-sam-som
      missingEvidence: An independent 2026 TAM or segment-level spend estimate for serverless AI infrastructure, AI-agent sandboxes, or custom enterprise-assistant infrastructure.
      whyItMatters: Without an external denominator, market-share and multiple-based valuation arguments can overstate how much of the reachable market is actually addressable by Modal.
      diligencePath: Add analyst, public-company, or trade-association sources that quantify spend by workload segment and separate serverless from broader cloud or AI software categories.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: budget-owner
      missingEvidence: Customer procurement evidence showing the exact budget line owner for inference, sandbox, and internal-assistant deployments.
      whyItMatters: The buyer and payer map is currently inferred from product messaging and use cases, which can misstate how land-and-expand actually happens in enterprise accounts.
      diligencePath: Request customer references, win-loss notes, procurement templates, or case studies that identify whether spend sits in cloud, platform, security, or line-of-business budgets.
      relatedQuestionRefs: [QM003]
      relatedTableRefs: [TM003]
    - type: missing-source
      severity: minor
      topic: geography
      missingEvidence: Revenue or workload mix by geography, vertical, and product line.
      whyItMatters: The chapter can show breadth of supported workloads but cannot distinguish whether demand is concentrated in a few AI-native cohorts or already diversified across larger enterprise pools.
      diligencePath: Obtain internal cohort, revenue-mix, or deployment-mix reporting and reconcile it against the public customer examples in news and company sources.
      relatedQuestionRefs: [QM007, QM008]
