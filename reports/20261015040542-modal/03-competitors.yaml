  rows:
  - - Modal
    - Integrated AI infrastructure / agent runtime
    - $750M Series D at $15.75B valuation; >$1B annualized revenue; ~200 employees
    - AI builders wanting managed compute, inference, training, and secure sandboxes
    - Unified platform, multi-cloud capacity pool, compliance posture, broad GPU support
    - Closed-source managed platform; not cheapest for always-on inference
  - - E2B
    - Sandbox specialist
    - Public customer logos include Perplexity, Hugging Face, Groq, and Lindy; broad Fortune 100 adoption claimed
    - Teams focused on secure code execution and testing for AI agents
    - Firecracker microVM isolation and straightforward integration
    - Retained sources do not establish broader training/inference stack or public GPU breadth
  - - Daytona
    - Persistent sandbox / development environment
    - $24M Series A in February 2026 according to Modal's comparison guide
    - Teams needing persistent workspaces, cold starts, and infrastructure control
    - Persistent sandboxes plus managed and self-hosted options
    - Positioning is more workspace-centric than full-stack AI infrastructure
  - - Beam.cloud
    - Open-source serverless GPU platform
    - AGPL-3.0 open-source platform with self-hosted option
    - Teams that prioritize self-hosting and avoiding vendor lock-in
    - Open-source control with GPU support in self-hosted deployments
    - Managed convenience and broader ecosystem proof are thinner in retained sources
  - - Vercel Sandbox
    - Ecosystem-native sandbox
    - Sandbox-specific scale not disclosed in retained sources
    - Teams already building AI apps inside the Vercel ecosystem
    - Firecracker microVMs, active CPU billing, and Vercel AI SDK affinity
    - Less evidence in retained sources of broader AI infrastructure breadth or GPU-centric positioning
  - - Cloudflare Sandbox
    - Ecosystem-native code execution
    - Sandbox-specific scale not disclosed in retained sources
    - Teams that want code execution from Workers applications
    - Workers/Durable Objects integration and TypeScript-first workflow
    - Container execution focus is narrower than Modal's broader AI platform
  notes: 'Sample rather than exhaustive landscape: rows emphasize the most visible direct, adjacent, and substitute options in retained 2025-2026 sources; funding and scale fields remain blank or narrative where public sandbox-specific disclosures were not available.'
