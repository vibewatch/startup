callouts:
- calloutType: strength
  title: Modal wins on breadth, not on being the cheapest raw GPU supplier
  body: The retained sources repeatedly position Modal as the option for buyers who want managed sandboxes, inference, training, and compliance in one place. That is a broader promise than most rivals offer, but it also means Modal is defending a premium abstraction layer rather than a lowest-cost infrastructure position.
  claimRefs:
  - CP004
  - CP009
  - CP012
  - CP013
- calloutType: risk
  title: Control-sensitive buyers still have credible escape routes
  body: Modal's closed-source, managed model leaves room for self-host/open alternatives such as Daytona and Beam.cloud, and for ecosystem-native substitutes from Vercel, Cloudflare, or hyperscaler stacks. If price pressure rises or buyers standardize on existing clouds, Modal's breadth may not fully offset portability concerns.
  claimRefs:
  - CP003
  - CP006
  - CP008
  - CP014
  - CP015
