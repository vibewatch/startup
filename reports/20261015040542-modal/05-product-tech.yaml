callouts:
  - calloutType: strength
    title: Sandboxes are now a real product surface, not a side feature
    body: >-
      The biggest maturity signal in this refresh is that external coverage now treats Sandboxes as a distinct growth
      engine with meaningful scale, which broadens Modal from function-hosting infrastructure into a fuller agent-workload platform.
    claimRefs: [CE005, CE006, CE012]
  - calloutType: risk
    title: Security and reliability underwriting still needs private diligence
    body: >-
      Public evidence establishes positioning on isolation, compliance, and private networking, but most of it is
      company-issued and none of it substitutes for the current audit package, uptime data, or incident history.
    claimRefs: [CE007, CE008, CE009]
  - calloutType: insight
    title: Product fit is powerful but workload-shaped
    body: >-
      Modal's core strengths compound under bursty or experimental GPU demand, while the public evidence still leaves
      open where steady-state utilization or no-cold-start requirements would tip the economics back toward reserved infrastructure.
    claimRefs: [CE003, CE010, CE011]
