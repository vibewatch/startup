      - ["Scheduler and GPU capacity pool", "Places work on GPUs across a multi-cloud pool", "20+ clouds / 100+ regions claim and broad GPU catalog", "Capacity guarantees, quota behavior, and single-cloud failure modes remain undisclosed"]
      - ["Sandbox isolation layer", "Separates untrusted code execution from the host/control plane", "gVisor container isolation and enterprise controls", "Public materials do not prove tenant-boundary strength or post-incident response quality"]
      - ["Enterprise connectivity and compliance", "Supports procurement, networking, and regulated workload positioning", "AWS Marketplace, planned PrivateLink, SOC 2 Type 2, and HIPAA/BAA claims", "Need current audit package, BAA scope, and customer validation under NDA"]
    notes: >-
      Architecture reflects the recurring elements in the assigned public sources; it is specific enough for buyer
      workflow analysis but still lacks private operational detail such as quotas, SLOs, and tenant-boundary evidence.
    claimRefs: [CE001, CE004, CE007, CE008, CE009, CE010, CE013]
