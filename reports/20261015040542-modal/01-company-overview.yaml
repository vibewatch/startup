    notes: >-
      Partial stakeholder map based on disclosed founders and named financing
      counterparties; public sources do not reveal the actual board seats, ownership
      percentages, or preference stack.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover named founders and disclosed investors appearing in the assigned
        2025-2026 source pool, not the full capitalization table.
    claimRefs: [CO006, CO007, CO008, CO016]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The public chronology shows a fast shift from early product launch to late-stage
      financing and scaled sandbox revenue, with several governance details still missing.
    data:
      items:
        - date: "2021-08"
          label: Company founded
          detail: "Sterling dates Modal's founding to August 2021 in New York by Erik Bernhardsson and Akshat Bubna."
          claimRefs: [CO002, CO016]
        - date: "2022"
          label: Functions launch
          detail: "Sterling's chronology places Modal Functions in market in 2022 as a Pythonic serverless container API for AI/ML workloads."
          claimRefs: [CO015]
        - date: "2023-05"
          label: Series A
          detail: "Sterling lists a $16 million Series A led by Redpoint Ventures."
          claimRefs: [CO016]
        - date: "2025-Q1"
          label: Sandboxes GA
          detail: "Sterling says Modal Sandboxes reached GA in Q1 2025, framing agent execution as a standalone product line."
          claimRefs: [CO015]
        - date: "2025-10-01"
          label: Series B at unicorn valuation
          detail: "Built In NYC reported an $87 million Series B that valued Modal at $1.1 billion and brought total raised capital to $111 million."
          claimRefs: [CO006]
        - date: "2026-05"
          label: Series C repricing
          detail: "Wowtale says Modal raised $355 million in May 2026 at a $4.65 billion valuation."
          claimRefs: [CO008]
        - date: "2026-10-14"
          label: Series D step-up
          detail: "Wowtale and AI Daily Insights reported a $750 million Series D at a $15.75 billion post-money valuation led by Accel."
          claimRefs: [CO007]
        - date: "2026-10-15"
          label: Scale proof enters the public record
          detail: "Independent October 2026 coverage says annualized run rate passed $1 billion and Sandboxes reached roughly $300 million annualized with nearly 3 billion launches."
          claimRefs: [CO009, CO010]
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO015, CO016]
callouts:
  - calloutType: strength
    title: Product scope now extends beyond generic serverless GPU compute
    body: >-
      The strongest identity signal is that Modal is not being described as a
      single-purpose inference endpoint product. Official and independent sources
      consistently point to a combined stack of Functions, Training, Inference,
      and Sandboxes, which supports a broader platform thesis than many AI
      infrastructure peers.
    claimRefs: [CO001, CO004, CO011]
  - calloutType: risk
    title: Public operating transparency still lags the financing step-up
    body: >-
      Headcount is inconsistent across public profiles, board and investor-rights
      disclosure is missing, and the one explicitly adverse review in the assigned
      pool warns about vendor lock-in, cost surprises, and reduced control versus
      raw VMs. Those gaps matter more after a rapid move to a $15.75 billion
      valuation.
    claimRefs: [CO012, CO013, CO014]
  - calloutType: insight
    title: Sandboxes appear to have become a second major value driver
    body: >-
      October 2026 reporting attributes roughly $300 million of annualized revenue
      to Sandboxes alone, implying that code-execution infrastructure is no longer
      merely an add-on to GPU compute but a central component of Modal's scale
      story and likely of how investors justify the latest round.
    claimRefs: [CO009, CO010]
