      Partial enumeration only: the assigned pool names the co-founders but does not
      publish a current board roster, committee structure, or full executive team.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows enumerate only the founders and public role signals visible in the
        assigned source pool as of the 2026-10-15 run date.
    claimRefs: [CO002, CO003, CO012, CO013, CO014]
