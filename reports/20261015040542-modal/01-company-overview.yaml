      - ["Akshat Bubna", "Co-founder", "Founding technical stakeholder tied to product architecture", "Confirm current operating remit and ownership after late-stage financings."]
      - ["Lux Capital", "Series B lead; repeat investor in later syndicate reporting", "Helped establish unicorn pricing and appears to remain in the cap table", "Verify board seat, pro rata rights, and any protective provisions."]
      - ["Accel", "Series D lead", "Sets the price on the latest disclosed round and likely influences governance from 2026 onward", "Confirm board or observer rights and expected ownership after the round."]
      - ["Kleiner Perkins", "New Series D investor", "Signals syndicate expansion at the highest valuation step-up", "Confirm ownership size, follow-on rights, and any strategic commercial links."]
