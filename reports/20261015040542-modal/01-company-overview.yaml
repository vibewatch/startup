schemaVersion: report-v2
artifact: company-overview
slug: modal
runDate: 2026-10-15
company:
  name: Modal
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Modal presents as a code-first AI infrastructure platform centered on serverless
    compute, GPUs, and sandboxes, with official materials emphasizing scale-from-zero
    developer ergonomics and independent October 2026 coverage tying the business
    to a $15.75 billion Series D and more than $1 billion in annualized run rate.
    The public evidence set is directionally strong on financing and product scope
    but still leaves governance and current headcount unresolved, with conflicting
    third-party employee counts and only review-level evidence on key operating
    trade-offs.
sections:
  - id: identity-platform
    title: Identity, product scope, and operating model
    body: >-
      Modal's current identity is unusually crisp across the assigned source pool:
      the company describes itself as cloud infrastructure for teams building,
      training, and serving AI applications, while independent profiles converge
      on the same serverless-GPU positioning. The product scope is broader than a
      single inference endpoint vendor. Official pages present Functions, Inference,
      Training, and Sandboxes as one platform, and the 2026 sandbox resource adds
      third-party proof points such as Ramp, Suno, and Lovable. The common thread
      is a code-first model that lets developers declare infrastructure in code,
      scale usage elastically, and pay only while workloads run, which is central
      to how later chapters should think about both adoption and valuation.
    claimRefs: [CO001, CO004, CO005, CO011]
    tableRefs: [TO001]
  - id: founders-footprint
    title: Founders, footprint, and governance visibility
    body: >-
      The company page makes the founding story and geographic footprint explicit:
      Erik Bernhardsson and Akshat Bubna are the named founders, and the team is
      presented as operating across New York, Stockholm, and San Francisco, with
      a London address also listed. That is enough to establish founder-market fit
      around infrastructure-heavy AI workloads, but not enough to establish mature
      governance. The assigned pool does not disclose the board roster, committee
      structure, or investor rights that would normally matter for a late-stage
      private infrastructure company. Public operating-scale signals are also
      inconsistent: one profile says roughly 58 employees, while same-day October
      2026 reporting places the team above 200.
    claimRefs: [CO002, CO003, CO013, CO014]
    tableRefs: [TO002]
  - id: funding-scale
    title: Financing history, current scale, and stakeholder implications
    body: >-
      The financing arc is the clearest independent signal in the chapter. Built
      In NYC covered an $87 million Series B that put Modal at a $1.1 billion
      valuation in October 2025, while October 2026 reporting from Wowtale and AI
      Daily Insights says the company then raised a $750 million Series D at a
      $15.75 billion post-money valuation after a $355 million Series C in May
      2026. Those same October 2026 reports say annualized run rate passed $1
      billion and Sandboxes alone reached roughly $300 million, which implies the
      sandbox product has become large enough to matter as its own revenue pillar.
      The investor list is also broadening, with Accel leading the D round and
      Kleiner Perkins joining a syndicate that already included Redpoint, Lux,
      Amplify, Menlo, General Catalyst, and Bain Capital Ventures.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO016]
    tableRefs: [TO003]
  - id: milestones-and-open-questions
    title: Milestones, execution signals, and unresolved diligence asks
    body: >-
      The milestone record suggests Modal moved from an early Pythonic serverless
      GPU product into a multi-product AI infrastructure platform quickly: Sterling
      places the company founding in 2021, Functions in 2022, a Series A in May
      2023, Sandboxes GA in early 2025, and then a rapid 2026 financing and scale
      step-up. The same evidence base also points to the main unresolved asks for
      later diligence. Public sources do not settle exact headcount, customer count,
      board composition, or financing-rights detail, and the one explicitly adverse
      review in the pool highlights cost surprises, vendor lock-in, and reduced
      control relative to raw VMs. Those are not thesis-breakers by themselves, but
      they do limit how much of the headline valuation can be accepted without
      private materials.
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value / status
      - Date
      - Confidence
      - Gap
    rows:
      - [Company identity, "Serverless AI infrastructure / cloud compute platform", current, medium, null]
      - [Headquarters / footprint, "New York base with Stockholm, San Francisco, and London presence disclosed", current, medium, "Board location and legal-entity structure are not disclosed in the assigned pool."]
      - [Latest valuation, "$15.75B post-money Series D", "2026-10-14", medium, null]
      - [Total capital raised, "$111M by Series B; later rounds lift public total far above that, but an exact cumulative total is not reconciled across the assigned pool", "2025-10 to 2026-10", low, "Need company cap table or financing summary that reconciles Seed through Series D proceeds."]
      - [Annualized run rate, "Passed $1B", "2026-10", medium, null]
      - [Sandbox revenue line, "~$300M annualized; nearly 3B sandboxes launched", "2026-10", medium, "No audited revenue-mix bridge or gross margin disclosure is available."]
      - [Headcount, "Conflicting public signals: ~58 employees vs. 200+ employees", "2026-10", low, "Need current company-confirmed employee count and function mix."]
      - [Customer count, null, current, low, "Public sources name customers such as Ramp, Suno, Cognition, Runway, 1X, and Lovable, but do not disclose an exact customer count."]
    notes: >-
      Mixes official and third-party evidence; null marks unsupported metrics, and
      conflicting rows preserve unresolved public-source disagreements rather than
      forcing a synthetic single number.
    claimRefs: [CO001, CO003, CO007, CO009, CO010, CO011, CO013, CO014]
