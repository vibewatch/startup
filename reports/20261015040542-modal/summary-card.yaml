  headline: >
    Modal now looks like a real scale business with more than $1 billion in annualized revenue, a $15.75 billion Series
    D, and a differentiated serverless AI infrastructure platform — but the valuation is stretched and public disclosure
    still leaves margin quality, retention, and concentration unresolved.
