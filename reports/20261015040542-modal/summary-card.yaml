  topStrengths:
    - Public evidence supports a step-up to more than $1 billion in annualized revenue, which validates demand at scale
    - Sandboxes have become a material standalone product line, expanding Modal beyond commodity GPU compute
    - >-
      Code-first developer ergonomics plus multi-cloud GPU scheduling keep the platform differentiated for bursty AI
      workloads
    - The October 2026 financing and valuation step-up confirm institutional confidence in the business
    - >-
      Named customer breadth across AI products, coding agents, robotics, and enterprise assistants supports broad
      workload fit
  topRisks:
    - Gross margin, NRR, burn, runway, and top-customer concentration remain undisclosed
    - The $15.75B valuation leaves limited room for underperformance or slower growth
    - Reliability and capacity dependence on external cloud and GPU supply can pressure availability and unit economics
    - Public evidence still does not fully resolve governance, board, or cap-table detail
    - Customer lock-in and cost surprises can push steady-state workloads toward cheaper substitutes
  unresolvedGaps:
    - Gross margin by product line is the single most important undisclosed data point
    - NRR, cohort retention, and top-customer concentration remain unavailable publicly
    - Monthly operating burn and current cash balance cannot be confirmed from public materials
    - Cap table, liquidation preference amounts, and board / governance detail remain undisclosed
    - Exact current employee count and headcount mix are still not publicly reconciled
    - Public sources still disagree on the earlier Series B details, so financing history is only partially reconciled
