      - ["Sandbox run rate", "~$300M in Oct. 2026 (company figure relayed by third parties)", "Medium", "Shows a material product line but not its margin", "Provide Sandbox revenue, COGS, and customer cohorts"]
      - ["Gross margin by product", null, "Low", "Tests whether usage growth produces durable economic value", "Provide revenue and COGS for Functions, Sandboxes, storage, and support"]
      - ["CAC, payback, NRR, and concentration", null, "Low", "Tests GTM efficiency and revenue durability", "Provide segment cohorts, top-10 share, churn, and contraction"]
      - ["Cash, burn, and runway", null, "Low", "Funding raised does not establish cash available or financing dependency", "Provide current cash, monthly burn, and base/downside runway"]
