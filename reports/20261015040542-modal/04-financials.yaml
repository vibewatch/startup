company:
  name: "Modal"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence supports a rapidly scaling, usage-metered AI infrastructure business: Sacra estimates $1 billion of annualized revenue in October 2026, while Modal says Sandboxes alone reached roughly a $300 million run rate. The underwriting constraint is disclosure quality rather than top-line momentum, because gross margin, cash, burn, runway, retention, concentration, and realized pricing remain unavailable."
sections:
  - id: "revenue-model-and-traction"
    title: "Usage creates revenue, but only one product line is quantified"
    body: |
      Modal monetizes infrastructure consumption rather than seats alone. Sacra describes a B2B, consumption-based model in which customers pay by the second for compute, and Modal's own material says Functions scale to zero while provisioned warm capacity remains billable. This establishes the mechanism: inference, training, batch processing, and agent execution create metered CPU or GPU activity that becomes revenue. It does not establish revenue-recognition policy, realized enterprise rates, discounts, or minimum commitments.

      Public traction is unusually strong but still attribution-sensitive. Sacra estimates that Modal reached $1 billion in annualized revenue in October 2026, while other coverage relays Modal's claim that annualized revenue run rate exceeded $1 billion and grew more than fifteenfold year over year. Sandboxes are the only disclosed product-level contribution, at roughly a $300 million run rate, or about 30% of the $1 billion aggregate milestone. The remainder is not publicly allocated across Functions, inference, training, storage, networking, plans, or support.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI001]
  - id: "pricing-costs-and-gtm"
    title: "List-price mechanics are visible; realized economics are not"
    body: |
      Modal's official material supports per-second metering, scale-to-zero, and a broad GPU catalog, but it also warns that total customer cost can include storage, networking, plan fees, and other resources. Those qualifications prevent a simplistic claim that serverless billing always lowers cost. The retained evidence does not include a complete rate card or any realized-price distribution, so list mechanics should not be confused with revenue yield or gross margin.

      Sacra characterizes the go-to-market motion as primarily B2B, aimed at machine-learning engineers, AI researchers, and development teams. It also reports that cloud marketplace integrations can let enterprises apply eligible committed cloud spend, reducing procurement friction. On the supply side, AI Daily Insights reports that Modal draws capacity from more than 20 clouds, and an official guide lists 11 priced GPU configurations. That breadth can improve availability and purchasing flexibility, but it also exposes the model to third-party capacity prices and supplier economics that are not publicly disclosed.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI016]
    tableRefs: [TI002]
    figureRefs: [FI001]
  - id: "capital-adequacy"
    title: "Financing capacity rose sharply, but funding raised is not cash available"
    body: |
      The latest financing is relevant here only as an input to forward capital adequacy; the round-by-round chronology belongs in Company Overview. Sacra and independent coverage report a $750 million Series D at a $15.75 billion post-money valuation in October 2026, and Sacra estimates total disclosed funding reached approximately $1.22 billion. AI Daily Insights notes that the company announcement did not specify exactly how the new capital would be spent.

      Those figures show access to capital, not current liquidity. None of the retained artifacts reports Modal's cash balance, monthly operating burn, runway, debt or project-finance obligations, or a next-round trigger. The same evidence set does not disclose gross margin by product, working-capital needs, capex, CAC, payback, NRR, or customer concentration. Capital adequacy therefore cannot be underwritten from financing headlines: investors need a current finance pack and product-level contribution economics before treating the latest round as proof of a durable cash cushion.
    claimRefs: [CI011, CI012, CI013, CI015]
    tableRefs: [TI003]
  - id: "financial-verdict"
    title: "Growth is credible, but revenue quality and margin durability remain unproven"
    body: |
      The positive case is that Modal has a legible monetization engine, very rapid reported scale, a material Sandbox revenue line, and multiple paths for workload expansion. Consumption pricing can produce natural account growth as customers run more jobs, while marketplace procurement can lower adoption friction. The public evidence is strong enough to conclude that the business has meaningful commercial traction, but not strong enough to determine how much of that traction converts to gross profit or free cash flow.

      The adverse case is structural. Sacra identifies scarce GPU supply and chip-price increases as risks to both availability and margin, while hyperscalers can use broader contracts and committed-spend relationships to compete on price. Without product-level gross margin, supplier pass-through terms, retention, concentration, burn, and runway, the appropriate verdict is conditional: verify revenue quality and capital efficiency before underwriting the reported top-line trajectory as durable financial performance.
    claimRefs: [CI001, CI003, CI004, CI008, CI014, CI015]
