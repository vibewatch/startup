  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal rates, and cohort retention by product line or customer segment.
    whyItMatters: Demand looks real, but without retention data it is impossible to separate rapid new-logo growth from durable recurring customer economics.
    diligencePath: Request cohort tables, renewal reports, and customer-retention dashboards in the data room, with separate views for core compute and Sandboxes.
    relatedQuestionRefs:
    - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer ARR share, top-customer contract terms, channel mix, and revenue concentration by workload category.
    whyItMatters: The public logo set looks diversified, but a small number of large AI-native accounts could still dominate revenue and renewal risk.
    diligencePath: Request top-customer concentration tables, contract-length summaries, and segment revenue bridges from finance and sales leadership.
    relatedQuestionRefs:
    - QU006
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: material
    topic: named-customer-proof-depth
    missingEvidence: More independent customer references, procurement records, or customer-authored case studies that confirm production use and outcomes.
    whyItMatters: Named customer breadth is credible, but most detailed deployment narratives are still curated by Modal rather than independently documented by the customer.
    diligencePath: Collect customer-authored case studies, conference talks, procurement wins, and reference calls for at least three large production accounts.
