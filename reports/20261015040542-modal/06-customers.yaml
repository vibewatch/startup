company:
  name: Modal
chapter:
  number: 6
  title: Customers
  summary: Public customer proof is strongest in AI-native product teams using Modal for inference, sandboxes, and agent workloads, with fresh October 2026 signals that usage and revenue accelerated sharply. The evidence shows meaningful breadth across coding agents, media generation, robotics, and internal enterprise assistants, but durability still cannot be underwritten because public sources do not disclose NRR, GRR, churn, renewal rates, or customer concentration.
sections:
- id: buyer-and-workload-mix
  title: Buyer mix centers on AI-native builders and platform teams
  body: 'The public customer set skews toward teams that need bursty GPU or sandbox capacity without building their own infrastructure layer. Official material emphasizes a code-first operating model, per-second billing, and multi-cloud capacity, which fits ML engineers, developer-platform teams, and internal AI builders more naturally than procurement-led legacy IT buyers. Independent and semi-independent sources reinforce the same pattern: named customers span consumer AI products, coding agents, media generation, robotics, and research workloads rather than conventional back-office SaaS deployments. That is a positive signal for product-market fit in AI-native infrastructure, but it also means the current proof base says more about developer-led adoption than about broad enterprise standardization.'
  claimRefs:
  - CU001
  - CU010
  - CU011
  - CU012
  - CU015
  tableRefs:
  - TU001
- id: adoption-scale-and-expansion
  title: Adoption signals point to real scale, with sandboxes driving expansion
  body: 'The strongest quantitative adoption signals are recent and mostly company-issued, but they are too specific to ignore. Modal says it supports more than 10,000 teams, while October 2026 coverage says the business crossed $1 billion of annualized run rate and that Sandboxes alone reached a $300 million run rate. The expansion narrative is especially important for underwriting: customer proof repeatedly moves from generic compute to code execution, background agents, and high-concurrency sandbox usage. Lovable, Ramp, and other agentic customers suggest Modal is not only winning initial deployment but also broadening within accounts as secure execution becomes a larger workload category.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  - CU007
  - CU008
  - CU009
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: named-production-proof
  title: Named customer proof shows breadth, but most depth still comes from company-curated examples
  body: 'Named references are not just logo slides: several sources tie customers to a specific workload, operating outcome, or production milestone. Lovable is the clearest sandbox-scale example, Ramp appears repeatedly around coding-agent deployment, and Suno is framed as a speed-to-market win. Independent October 2026 coverage broadens the roster further to DoorDash, Cognition, Linear, Hebbia, Runway, Physical Intelligence, 1X, Chai Discovery, and Achira, which reduces the risk that the story depends on one vertical. Even so, the deepest operational detail still comes from Modal-authored material, so named customer breadth is more convincing than retention or commercial durability.'
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
  - CU010
  - CU011
  - CU012
  tableRefs:
  - TU003
- id: durability-and-concentration-gaps
  title: Retention, concentration, and support economics remain the main customer risks
  body: 'The biggest missing piece is not whether customers exist, but whether they stay, expand profitably, and remain diversified. Public sources reviewed here do not disclose NRR, GRR, churn, renewal cohorts, contract length, or top-customer ARR share, so durability and concentration cannot be verified from public evidence. Independent review surfaces also introduce softer execution risk: public feedback flags cost surprise, support responsiveness, and runtime lock-in as recurring pain points. None of those signals disproves adoption, but together they keep the customer story in "strong proof of demand, incomplete proof of stickiness" territory.'
  claimRefs:
  - CU013
  - CU014
  - CU016
