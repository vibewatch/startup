figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  summary: Public customer proof shows an adoption path from fast developer trial into higher-volume sandbox, coding-agent, and enterprise-assistant workloads.
  data:
    nodes:
    - id: trial
      label: Developer-led trial
      detail: ML and platform engineers are drawn by Python-defined infrastructure, per-second billing, and fast access to GPU capacity.
      touchpoints:
      - Code-first infrastructure defined in Python
      - Per-second billing and fast feedback loops
    - id: initial-workload
      label: Initial production workload
      detail: Customers start with inference, training, batch work, or containerized AI backends that benefit from elastic scaling.
      touchpoints:
      - Inference and training are core entry points
      - Production use often starts in AI-native product teams
    - id: named-proof
      label: Named production proof
      detail: Public references such as Suno, Ramp, and DoorDash move beyond logos by tying Modal to a concrete workflow or outcome.
      touchpoints:
      - Suno speed-to-market example
      - Ramp and DoorDash deployment references
    - id: sandbox-expansion
      label: Sandbox expansion
      detail: Secure code execution becomes a second growth surface as customers add coding agents, internal assistants, or other agentic workloads.
      touchpoints:
      - Lovable 1M+ sandboxes in 48 hours
      - Ramp Inspect on Modal Sandboxes
    - id: enterprise-controls
      label: Enterprise controls
      detail: As usage deepens, customer stories emphasize compliance, isolation, and internal-assistant deployments rather than only raw compute.
      touchpoints:
      - Enterprise assistant positioning
      - Secure sandbox execution and compliance features
    - id: durability-test
      label: Durability test
      detail: The public story becomes harder to verify at renewal and concentration stage because retention, GRR, NRR, and top-account exposure stay undisclosed.
      touchpoints:
      - No public cohort or churn disclosure
      - Independent reviews flag cost and lock-in friction
  approximationNotes: Journey stages summarize repeated public proof points rather than a measured funnel with shared denominators.
