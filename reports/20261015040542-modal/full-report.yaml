companyProfile:
  summary: >
    Modal is a New York-based serverless AI infrastructure company founded around 2021 by Erik Bernhardsson and Akshat
    Bubna. The platform lets teams define compute, GPU, sandbox, storage, and scheduling behavior in code, then run
    inference, training, batch jobs, and secure agent workloads across a large multi-cloud capacity pool without
    managing their own infrastructure. Its current product surface includes Functions, Inference, Training, Sandboxes,
    and enterprise controls such as compliance, networking, and marketplace distribution hooks. The public evidence now
    supports a much larger business than in mid-2026, with October 2026 reporting tying Modal to a $750 million Series D
    at a $15.75 billion post-money valuation and more than $1 billion in annualized revenue, while Sandboxes alone are
    reported at roughly a $300 million run rate.
  founders:
    - name: Erik Bernhardsson
      role: Co-Founder
      background: Publicly named founding technical leader and company face.
      claimRefs:
        - CO002
        - CO014
    - name: Akshat Bubna
      role: Co-Founder
      background: Publicly named co-founder on Modal's company materials.
      claimRefs:
        - CO002
  foundedDate: '2021-01-01'
  foundingLocation: New York, NY, USA
  headquarters: New York, NY, USA
  productSummary: >
    Modal sells serverless AI infrastructure: code-defined Functions and Inference for CPU/GPU workloads, Training and
    batch compute, isolated Sandboxes for untrusted or agent-executed code, and enterprise controls that support
    security review and deployment on regulated stacks. The platform emphasizes per-second metering, scale-to-zero
    behavior, and a multi-cloud GPU scheduler rather than self-managed infrastructure.
  customerFocus: >
    AI-native software builders, ML and platform engineers, coding-agent operators, and enterprise AI teams that need
    bursty inference, training, or secure code execution without building a GPU fleet.
  businessModel: >
    Primarily consumption-based per-second billing for compute and sandboxes, supplemented by enterprise contracts,
    cloud marketplace distribution, and support / plan economics.
  stage: Series D
  fundingStatus: >
    Modal's latest public financing is a $750 million Series D in October 2026 at a $15.75 billion post-money valuation,
    following a $355 million Series C in May 2026 and an earlier Series B that public sources still do not reconcile
    cleanly. Public coverage and company materials indicate the business has crossed $1 billion in annualized revenue,
    but disclosed gross margin, burn, runway, and retention remain unavailable.
