      - number: '6.2'
        title: Adoption signals point to real scale, with sandboxes driving expansion
        blocks:
          - type: paragraph
            body: >-
              The strongest quantitative adoption signals are recent and mostly company-issued, but they are too
              specific to ignore. Modal says it supports more than 10,000 teams, while October 2026 coverage says the
              business crossed $1 billion of annualized run rate and that Sandboxes alone reached a $300 million run
              rate. The expansion narrative is especially important for underwriting: customer proof repeatedly moves
              from generic compute to code execution, background agents, and high-concurrency sandbox usage. Lovable,
              Ramp, and other agentic customers suggest Modal is not only winning initial deployment but also broadening
              within accounts as secure execution becomes a larger workload category.
            claimRefs:
