              - CU011
      - number: '6.4'
        title: Retention, concentration, and support economics remain the main customer risks
        blocks:
          - type: paragraph
            body: >-
              The biggest missing piece is not whether customers exist, but whether they stay, expand profitably, and
              remain diversified. Public sources reviewed here do not disclose NRR, GRR, churn, renewal cohorts,
              contract length, or top-customer ARR share, so durability and concentration cannot be verified from public
              evidence. Independent review surfaces also introduce softer execution risk: public feedback flags cost
              surprise, support responsiveness, and runtime lock-in as recurring pain points. None of those signals
              disproves adoption, but together they keep the customer story in "strong proof of demand, incomplete proof
              of stickiness" territory.
            claimRefs:
              - CU013
              - CU014
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Best proof is in agentic and AI-native workloads
            body: >-
              Modal has unusually concrete public proof in coding agents, sandboxed execution, media generation, and
              research workloads, which is a stronger customer signal than generic logo slides.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU010
              - CU015
          - type: callout
            title: Stickiness is still less proven than demand
            body: >-
              Public adoption metrics are strong, but customer durability remains under-specified because renewals,
              concentration, and cohort behavior are not disclosed while review surfaces flag cost and support friction.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
              - CU013
