      - - Recommendation
        - Track
        - >-
          Scale proof improved from roughly $300 million annualized revenue in May 2026 to more than $1 billion ARR by
          October 2026 while valuation reset to roughly $15.75 billion to $16.0 billion.
        - Keep diligence live, but do not underwrite a buy from public evidence alone.
      - - Confidence
        - Medium
        - >-
          Multiple independent sources agree on the financing and ARR step-up, but unit economics and preference terms
          remain undisclosed.
        - Confidence can rise only after private data room access.
      - - Risk rating
        - High
        - >-
          Fast repricing, customer concentration hints, and review-source warnings on lock-in and cost surprise leave
          limited execution room.
        - Demand downside protection and milestone gating.
      - - Valuation stance
        - Stretched
        - The implied Series D multiple is about 15.8x ARR, roughly flat to the 15.5x Series C benchmark.
        - Entry needs either better disclosure or a better price signal.
      - - Target return / hold discipline
        - Not supportable publicly
        - No reviewed source disclosed gross margin, NRR, top-customer ARR concentration, or the preference stack.
        - Wait for private diligence or a materially lower entry reference.
    notes: >-
      Analyst synthesis based on retained sources; recommendation rows separate observed financing facts from what
      remains unverified in public materials.
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV010
      - CV014
      - CV015
      - CV016
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Scale proof
        - More than $1 billion ARR by October 2026 and about $300 million sandbox ARR indicate genuine demand.
        - >-
          Hypergrowth in AI infrastructure can reverse quickly if spending normalizes or usage concentrates in a few
          accounts.
        - Show cohort retention, net revenue retention, and durable growth outside the top customer set.
      - - Product moat
        - AI-native runtime, per-second billing, and multi-cloud GPU access can justify a premium developer experience.
        - Vendor lock-in and raw-VM alternatives can narrow willingness to pay over time.
        - Provide customer win-loss evidence and migration data showing low churn despite alternatives.
      - - Commercial proof
        - Named customers span agents, media, software, and robotics use cases.
        - Public customer names do not reveal concentration or account durability.
        - Disclose top-10 ARR concentration and churn history.
      - - Price discipline
        - The October 2026 mark kept the multiple in the same mid-teens band despite rapid ARR expansion.
        - >-
          A stable multiple still leaves little room for disclosure misses at a $15.75 billion to $16.0 billion
          valuation.
        - A lower secondary mark or stronger unit-economics evidence would improve the entry case.
    notes: >-
      The table separates company quality from price discipline; the anti-thesis is about underwriting risk at the
      current mark, not whether Modal has built a real product.
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          ARR stays above the October 2026 step-up, sandbox demand keeps broadening, and private-market appetite for AI
          infrastructure remains hot.
        - >-
          $18 billion to $20 billion range, or roughly 18x to 20x on a sustainably larger revenue base, would require
          both continued growth and cleaner economics.
        - Lock-in backlash, infrastructure competition, or margin dilution from expansion.
        - >-
          Would need private proof on gross margin and retention plus visible success in the post-Series D product
          roadmap.
      - - Base
        - >-
          The ARR step-up is real, but disclosure remains thin and the market continues to value Modal near the current
          mid-teens multiple.
        - $15 billion to $16 billion range, or broadly around the current mark, fits the public evidence best today.
        - Limited rerating upside without better disclosure.
        - Supported by the current Series D price and May-to-October scaling evidence.
      - - Bear
        - >-
          Growth normalizes, concentration proves higher than hoped, or economics disappoint once private diligence
          opens.
        - >-
          $10 billion to $12 billion range, roughly 10x to 12x on a $1 billion revenue base, captures multiple
          compression when disclosure quality lags.
        - A pricing reset could arrive before the company proves durable margins.
        - Would be reinforced by a weaker next mark, slowing ARR quality, or unfavorable preference terms.
    notes: >-
      Scenario ranges are analyst estimates anchored to Modal's public round history and the reported October 2026 ARR,
      not quoted secondary transactions or audited public-market comps.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV011
      - CV014
      - CV016
