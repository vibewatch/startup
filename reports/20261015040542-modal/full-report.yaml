  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: AI-native serverless infrastructure, not generic cloud'
        blocks:
          - type: paragraph
            body: >-
              Modal's public positioning and third-party reviews consistently define the category as serverless AI
              infrastructure rather than general-purpose cloud hosting. The core offer is code-defined compute for
              custom AI workloads, where developers configure GPUs, storage, scaling, and endpoints in code rather than
              renting raw virtual machines or orchestrating Kubernetes themselves. That boundary includes inference
              endpoints, batch jobs, training, notebooks, and secure code-execution sandboxes, but it excludes dedicated
              reserved GPU fleets, generic container platforms, and fully packaged model APIs that abstract away the
              workload code itself. In practice, the "market" Modal attacks is the budget that AI teams would otherwise
              spend on GPU rentals plus the engineering labor required to make those workloads production-ready.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing must rely on operational lenses because the assigned pool lacks a clean TAM
        blocks:
          - type: paragraph
            body: >-
              The evidence pool does not contain an independent analyst or regulator source that cleanly quantifies a
              2026 TAM, SAM, or SOM for "serverless AI infrastructure," so a single market number would be invented
              precision. What the sources do support is a set of constrained sizing proxies: Modal's official footprint
              across clouds, regions, and GPU options; public throughput and concurrency claims for inference and
              sandboxes; and a demand proxy from company-reported ARR acceleration during a year of intense funding for
              AI inference infrastructure. Those signals imply a broad reachable opportunity across inference, training,
              agent sandboxes, and internal assistants, but they do not establish share of an independently measured
              market. The diligence implication is that valuation should be tied to adoption quality and workload
              economics, not to a generic "large TAM" narrative.
            claimRefs:
              - CM005
              - CM006
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM013
              - CM014
      - number: '2.3'
        title: Buyers cluster around platform engineering, with elasticity as the wedge and cost as the drag
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to three main buyer clusters: Python-first startup and scale-up AI teams shipping
              bursty inference, enterprise platform teams deploying internal assistants, and agent builders that need
              secure code execution with production concurrency. Across all three, the purchase trigger is similar:
              faster deployment, no idle infrastructure, and credible security and observability without standing up a
              platform team first. The main adoption drag is equally consistent. Reviews repeatedly warn that guaranteed
              execution, regional pricing multipliers, and high steady-state utilization can erase the economic
              advantage of serverless GPUs, while teams that need reserved capacity, custom networking, or packaged
              endpoints may prefer dedicated rentals, Kubernetes-based platforms, or other vendors. Modal's market is
              therefore attractive where utilization is spiky and developer time is scarce, not where compute is
              continuous and lowest-cost GPU-hours dominate.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Elasticity is the wedge; steady-state utilization is the economic test
            body: >-
              Modal looks strongest where teams value developer velocity and burst scaling more than the absolute
              cheapest GPU-hour. Once workloads become always-on or require guaranteed execution, the buying center has
              to benchmark dedicated alternatives rather than assume the serverless premium will remain justified.
            calloutType: insight
            claimRefs:
              - CM007
              - CM010
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape breadth spans direct runtimes, ecosystem substitutes, and lower-level hosting
        blocks:
          - type: paragraph
            body: >-
              Modal is not competing in a single peer set. Its own 2026 comparison pages frame the market as a mix of
              secure code-execution specialists, broader cloud ecosystems, and GPU-capable sandbox or platform vendors
              rather than a narrow serverless-GPU niche. Independent sources reinforce that picture: BearPlex places
              Modal alongside AWS SageMaker, Vertex AI, Anyscale, RunPod, Replicate, and Together AI, while Prismix
              compares Modal directly with Replicate, RunPod, and Vast.ai on GPU-hosting economics. That means buyers
              can solve the same underlying job in multiple ways: with an integrated agent runtime, with an
              ecosystem-native sandbox embedded in an existing web or cloud stack, or by assembling lower-level GPU
              infrastructure themselves. For diligence, the relevant question is therefore not whether Modal has direct
              competitors, but which buyer workflow values managed breadth enough to accept Modal's premium abstraction
              layer.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP014
      - number: '3.2'
        title: Capability breadth and pricing favor bursty agent workloads, not the cheapest raw GPU path
        blocks:
          - type: paragraph
            body: >-
              Modal's competitive position is strongest when a customer wants one managed surface for inference,
              training, batch jobs, and secure sandboxes with broad GPU availability and compliance controls. The same
              sources also show why switching remains plausible. E2B differentiates on Firecracker-based ephemeral
              execution, Daytona on persistent and self-hosted workspaces, Beam.cloud on open-source and self-hosted
              serverless GPU control, and Vercel or Cloudflare on tighter attachment to their surrounding ecosystems.
              Public pricing signals point the same direction: Prismix shows Modal and Replicate at roughly $0.59 per
              A10G hour, above RunPod at roughly $0.44 and Vast.ai at roughly $0.20-$0.35. BearPlex reaches a similar
              conclusion from practice, arguing that Modal wins when workloads are bursty and operational speed matters,
              but that steady, always-hot inference can move to dedicated infrastructure or managed endpoints with
              better economics.
            claimRefs:
              - CP003
              - CP004
              - CP008
              - CP009
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP012
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP007
              - CP008
              - CP013
      - number: '3.3'
        title: Durability comes from scale and integration, but displacement risk remains real
        blocks:
          - type: paragraph
            body: >-
              Recent scale strengthens Modal's hand. SiliconANGLE and Automater both report a $750 million round at a
              $15.75 billion valuation, more than $1 billion in annualized revenue, and a sandboxes business that has
              become a meaningful product line in its own right. That scale matters competitively because it funds
              product expansion and gives Modal more room to absorb outages, capacity volatility, or pricing pressure
              than smaller point solutions. Even so, the same evidence does not support a durable lock on the category.
              Modal is still a closed-source managed platform, while Daytona and Beam.cloud preserve self-host or
              open-source escape valves, and ecosystem-native substitutes from Vercel, Cloudflare, AWS, Azure, and
              Google keep improving for customers that prefer to stay inside their incumbent stack. Modal therefore
              looks harder to displace in high-growth agent use cases than in commoditized inference or
              control-sensitive deployments.
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Modal wins on breadth, not on being the cheapest raw GPU supplier
            body: >-
              The retained sources repeatedly position Modal as the option for buyers who want managed sandboxes,
              inference, training, and compliance in one place. That is a broader promise than most rivals offer, but it
              also means Modal is defending a premium abstraction layer rather than a lowest-cost infrastructure
              position.
            calloutType: strength
            claimRefs:
              - CP004
              - CP009
              - CP012
              - CP013
          - type: callout
            title: Control-sensitive buyers still have credible escape routes
            body: >-
              Modal's closed-source, managed model leaves room for self-host/open alternatives such as Daytona and
              Beam.cloud, and for ecosystem-native substitutes from Vercel, Cloudflare, or hyperscaler stacks. If price
              pressure rises or buyers standardize on existing clouds, Modal's breadth may not fully offset portability
              concerns.
            calloutType: risk
            claimRefs:
              - CP003
              - CP006
              - CP008
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Usage creates revenue, but only one product line is quantified
        blocks:
          - type: paragraph
            body: >
              Modal monetizes infrastructure consumption rather than seats alone. Sacra describes a B2B,
              consumption-based model in which customers pay by the second for compute, and Modal's own material says
              Functions scale to zero while provisioned warm capacity remains billable. This establishes the mechanism:
              inference, training, batch processing, and agent execution create metered CPU or GPU activity that becomes
              revenue. It does not establish revenue-recognition policy, realized enterprise rates, discounts, or
              minimum commitments.


              Public traction is unusually strong but still attribution-sensitive. Sacra estimates that Modal reached $1
              billion in annualized revenue in October 2026, while other coverage relays Modal's claim that annualized
              revenue run rate exceeded $1 billion and grew more than fifteenfold year over year. Sandboxes are the only
              disclosed product-level contribution, at roughly a $300 million run rate, or about 30% of the $1 billion
              aggregate milestone. The remainder is not publicly allocated across Functions, inference, training,
              storage, networking, plans, or support.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI007
              - CI008
      - number: '4.2'
        title: List-price mechanics are visible; realized economics are not
        blocks:
          - type: paragraph
            body: >
              Modal's official material supports per-second metering, scale-to-zero, and a broad GPU catalog, but it
              also warns that total customer cost can include storage, networking, plan fees, and other resources. Those
              qualifications prevent a simplistic claim that serverless billing always lowers cost. The retained
              evidence does not include a complete rate card or any realized-price distribution, so list mechanics
              should not be confused with revenue yield or gross margin.


              Sacra characterizes the go-to-market motion as primarily B2B, aimed at machine-learning engineers, AI
              researchers, and development teams. It also reports that cloud marketplace integrations can let
              enterprises apply eligible committed cloud spend, reducing procurement friction. On the supply side, AI
              Daily Insights reports that Modal draws capacity from more than 20 clouds, and an official guide lists 11
              priced GPU configurations. That breadth can improve availability and purchasing flexibility, but it also
              exposes the model to third-party capacity prices and supplier economics that are not publicly disclosed.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI010
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI005
              - CI008
              - CI009
              - CI014
              - CI015
              - CI016
      - number: '4.3'
        title: Financing capacity rose sharply, but funding raised is not cash available
        blocks:
          - type: paragraph
            body: >
              The latest financing is relevant here only as an input to forward capital adequacy; the round-by-round
              chronology belongs in Company Overview. Sacra and independent coverage report a $750 million Series D at a
              $15.75 billion post-money valuation in October 2026, and Sacra estimates total disclosed funding reached
              approximately $1.22 billion. AI Daily Insights notes that the company announcement did not specify exactly
              how the new capital would be spent.


              Those figures show access to capital, not current liquidity. None of the retained artifacts reports
              Modal's cash balance, monthly operating burn, runway, debt or project-finance obligations, or a next-round
              trigger. The same evidence set does not disclose gross margin by product, working-capital needs, capex,
              CAC, payback, NRR, or customer concentration. Capital adequacy therefore cannot be underwritten from
              financing headlines: investors need a current finance pack and product-level contribution economics before
              treating the latest round as proof of a durable cash cushion.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI003
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Growth is credible, but revenue quality and margin durability remain unproven
        blocks:
          - type: paragraph
            body: >
              The positive case is that Modal has a legible monetization engine, very rapid reported scale, a material
              Sandbox revenue line, and multiple paths for workload expansion. Consumption pricing can produce natural
              account growth as customers run more jobs, while marketplace procurement can lower adoption friction. The
              public evidence is strong enough to conclude that the business has meaningful commercial traction, but not
              strong enough to determine how much of that traction converts to gross profit or free cash flow.


              The adverse case is structural. Sacra identifies scarce GPU supply and chip-price increases as risks to
              both availability and margin, while hyperscalers can use broader contracts and committed-spend
              relationships to compete on price. Without product-level gross margin, supplier pass-through terms,
              retention, concentration, burn, and runway, the appropriate verdict is conditional: verify revenue quality
              and capital efficiency before underwriting the reported top-line trajectory as durable financial
              performance.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI008
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital raised is not runway
            body: >-
              The $750M Series D and approximately $1.22B of total disclosed funding demonstrate financing access, but
              the retained evidence does not disclose current cash, monthly burn, debt obligations, or downside runway.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI015
          - type: callout
            title: Underwrite contribution economics before top-line momentum
            body: >-
              The next diligence step is a product-level bridge from metered usage to recognized revenue, infrastructure
              COGS, gross margin, retention, and cash generation.
            calloutType: recommendation
            claimRefs:
              - CI005
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
