          'y': 1.8
          note: Best understood as a Vercel-ecosystem execution layer rather than a broad AI infrastructure suite.
        - label: Cloudflare Sandbox
          x: 2.2
          'y': 2.1
          note: >-
            Workers-native code execution broadens options for Cloudflare users, but retained evidence remains narrower
            than Modal's platform scope.
