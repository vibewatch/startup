      - number: '5.3'
        title: Differentiation, controls, and product risk
        blocks:
          - type: paragraph
            body: >-
              Modal’s differentiation is strongest where developer ergonomics meet AI-native infrastructure:
              code-defined

              images and GPU requests, broad accelerator choice, and a sandboxed execution plane that product guides
              position

              for agent workloads as well as classic inference and training. The control story is directionally credible
              — the

              company publicly claims gVisor-based isolation, SOC 2 Type 2 completion, HIPAA support on Enterprise
              plans, and

              deeper AWS-private networking support — but nearly all of that evidence is company-controlled. That
              matters

              because the same third-party guides that praise the platform also warn that serverless GPU economics are

              workload-shaped: buyers with constant, latency-intolerant demand may still prefer reserved infrastructure,
              and

              buyers with strict security review requirements still need primary diligence artifacts before treating
              Modal as a

              fully underwritten enterprise standard.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Sandboxes are now a real product surface, not a side feature
            body: >-
              The biggest maturity signal in this refresh is that external coverage now treats Sandboxes as a distinct
              growth engine with meaningful scale, which broadens Modal from function-hosting infrastructure into a
              fuller agent-workload platform.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE012
          - type: callout
            title: Security and reliability underwriting still needs private diligence
            body: >-
              Public evidence establishes positioning on isolation, compliance, and private networking, but most of it
              is company-issued and none of it substitutes for the current audit package, uptime data, or incident
              history.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE009
          - type: callout
            title: Product fit is powerful but workload-shaped
            body: >-
              Modal's core strengths compound under bursty or experimental GPU demand, while the public evidence still
              leaves open where steady-state utilization or no-cold-start requirements would tip the economics back
              toward reserved infrastructure.
            calloutType: insight
