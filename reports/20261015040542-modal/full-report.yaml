      - number: '1.3'
        title: Financing history, current scale, and stakeholder implications
        blocks:
          - type: paragraph
            body: >-
              The financing arc is the clearest independent signal in the chapter. Built In NYC covered an $87 million
              Series B that put Modal at a $1.1 billion valuation in October 2025, while October 2026 reporting from
              Wowtale and AI Daily Insights says the company then raised a $750 million Series D at a $15.75 billion
              post-money valuation after a $355 million Series C in May 2026. Those same October 2026 reports say
              annualized run rate passed $1 billion and Sandboxes alone reached roughly $300 million, which implies the
              sandbox product has become large enough to matter as its own revenue pillar. The investor list is also
              broadening, with Accel leading the D round and Kleiner Perkins joining a syndicate that already included
              Redpoint, Lux, Amplify, Menlo, General Catalyst, and Bain Capital Ventures.
            claimRefs:
