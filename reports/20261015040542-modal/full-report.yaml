      - number: '6.3'
        title: Named customer proof shows breadth, but most depth still comes from company-curated examples
        blocks:
          - type: paragraph
            body: >-
              Named references are not just logo slides: several sources tie customers to a specific workload, operating
              outcome, or production milestone. Lovable is the clearest sandbox-scale example, Ramp appears repeatedly
              around coding-agent deployment, and Suno is framed as a speed-to-market win. Independent October 2026
              coverage broadens the roster further to DoorDash, Cognition, Linear, Hebbia, Runway, Physical
              Intelligence, 1X, Chai Discovery, and Achira, which reduces the risk that the story depends on one
              vertical. Even so, the deepest operational detail still comes from Modal-authored material, so named
              customer breadth is more convincing than retention or commercial durability.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
