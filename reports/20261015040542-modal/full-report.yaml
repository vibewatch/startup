  - id: FI001
    title: Revenue model and margin-risk bridge
    type: flow
    summary: >-
      Workload activity becomes metered revenue, while procurement choices and third-party GPU capacity determine an
      undisclosed gross-profit outcome.
    data:
      nodes:
        - id: workloads
          label: Customer workloads
          detail: Inference, training, batch processing, and agent execution create resource demand.
        - id: functions
          label: Functions and compute
          detail: Code-defined workloads consume CPU and GPU resources.
        - id: sandboxes
          label: Sandboxes
          detail: Isolated agent environments consume CPU, memory, and optional GPU resources.
        - id: metering
          label: Per-second metering
          detail: Provisioned resource time is the principal published billing mechanism.
        - id: procurement
          label: Plans and marketplaces
          detail: Enterprise procurement can route committed cloud spend and add plan economics.
        - id: revenue
          label: Annualized revenue
          detail: Sacra estimates $1B in October 2026; Sandboxes are reported at roughly $300M.
        - id: supplier-costs
          label: Third-party capacity costs
          detail: A pool spanning more than 20 clouds creates supply breadth and input-cost exposure.
        - id: gross-profit
          label: Gross profit
          detail: Product-level gross margin and supplier pass-through remain undisclosed.
      edges:
        - from: workloads
          to: functions
          label: general compute demand
        - from: workloads
          to: sandboxes
          label: agent-runtime demand
        - from: functions
          to: metering
          label: resource seconds
        - from: sandboxes
          to: metering
          label: CPU, memory, and GPU seconds
        - from: metering
          to: procurement
          label: usage billed through account terms
        - from: procurement
          to: revenue
          label: customer spend
        - from: supplier-costs
          to: gross-profit
          label: infrastructure input cost
        - from: revenue
          to: gross-profit
          label: less undisclosed delivery costs
    approximationNotes: >-
