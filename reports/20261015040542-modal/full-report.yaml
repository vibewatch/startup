    title: Recommendation logic
    type: flow
    summary: >-
      The valuation call follows a simple chain: demand proof and product proof are strong, but disclosure and downside
      protection lag the price.
    data:
      nodes:
        - id: demand-proof
          label: Demand proof
          detail: More than $1B ARR by October 2026; sandboxes about $300M ARR and nearly 3B launches.
        - id: product-proof
          label: Product proof
          detail: AI-native runtime, elastic scheduling across 20+ clouds, instant GPU access, and per-second billing.
        - id: pricing-context
          label: Pricing context
          detail: October 2026 Series D at roughly $15.75B to $16.0B implies a mid-teens ARR multiple.
        - id: risk-load
          label: Risk load
          detail: Customer concentration is not disclosed, and review sources flag lock-in and cost-surprise risk.
        - id: entry-discipline
          label: Entry discipline
          detail: Need private proof on margins, retention, concentration, governance, and preference terms.
        - id: recommendation
          label: Recommendation
          detail: Track; stretched valuation until diligence closes the public-information gap.
      edges:
        - from: demand-proof
          to: product-proof
          label: supports premium positioning
        - from: product-proof
          to: pricing-context
          label: explains willingness to pay
        - from: pricing-context
          to: risk-load
          label: raises the underwriting bar
        - from: risk-load
          to: entry-discipline
          label: requires more proof
        - from: entry-discipline
          to: recommendation
          label: therefore stay on track
