      - number: '5.2'
        title: Execution architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              The public architecture centers on a code-defined build/runtime layer, an AI-optimized
              container/filesystem

              stack, and an elastic scheduler that Modal says can place work across 20+ clouds and 100+ regions.
              Independent

              guides corroborate the broad shape of this model and repeatedly frame startup latency as the key technical
              trade:

              Modal can scale to zero and bring GPUs online quickly, but cold starts still exist and matter for
              interactive

              traffic. Enterprise deployment posture has also moved forward from generic cloud compatibility to named

              distribution and network-integration motions with AWS, including Marketplace and planned PrivateLink
              support.

              What is still missing from the assigned evidence is independent proof of production SLOs, quota behavior
              under

              stress, or how often enterprise buyers need to keep warm capacity in practice.
