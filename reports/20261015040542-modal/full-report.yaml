              Modal is no longer best described as only “serverless Python functions.” The current public surface spans

              code-defined Functions, Sandboxes for isolated code execution, and SDK/control-plane messaging that now
              appears

              across Python, TypeScript, and Go. In workflow terms, buyers are purchasing an execution layer that lets
              teams

              describe images, dependencies, secrets, schedules, and GPU needs in code, then run inference, training,
