chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating model
        blocks:
          - type: paragraph
            body: >-
              Modal's current identity is unusually crisp across the assigned source pool: the company describes itself
              as cloud infrastructure for teams building, training, and serving AI applications, while independent
              profiles converge on the same serverless-GPU positioning. The product scope is broader than a single
              inference endpoint vendor. Official pages present Functions, Inference, Training, and Sandboxes as one
              platform, and the 2026 sandbox resource adds third-party proof points such as Ramp, Suno, and Lovable. The
              common thread is a code-first model that lets developers declare infrastructure in code, scale usage
              elastically, and pay only while workloads run, which is central to how later chapters should think about
              both adoption and valuation.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO011
