        blocks:
          - type: paragraph
            body: >-
              The company page makes the founding story and geographic footprint explicit: Erik Bernhardsson and Akshat
              Bubna are the named founders, and the team is presented as operating across New York, Stockholm, and San
              Francisco, with a London address also listed. That is enough to establish founder-market fit around
              infrastructure-heavy AI workloads, but not enough to establish mature governance. The assigned pool does
              not disclose the board roster, committee structure, or investor rights that would normally matter for a
              late-stage private infrastructure company. Public operating-scale signals are also inconsistent: one
              profile says roughly 58 employees, while same-day October 2026 reporting places the team above 200.
