  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Ranked risk stack: dependency, lock-in, and valuation reset'
        blocks:
          - type: paragraph
            body: >-
              The most material public risk is that Modal's strongest commercial message - instant elastic AI compute
              without infrastructure management - is inseparable from dependencies it does not fully control. Company
              materials say capacity is drawn from more than 20 clouds, while an AWS Marketplace customer says execution
              happens entirely on Modal's cloud and depends on Modal's CLI and internet access. That combination creates
              a dual exposure: supplier-side interruptions or GPU scarcity can weaken availability and margins, and
              customer-side switching costs rise if teams build deeply into the runtime model. The market is currently
              forgiving because growth and financing have been exceptional, but the same operating leverage becomes
              dangerous after the move from a $4.65B Series C valuation in May 2026 to $15.75B in October 2026.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR008
              - CR009
              - CR011
              - CR015
          - type: table
            tableRef: TR003
