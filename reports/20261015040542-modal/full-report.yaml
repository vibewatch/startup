  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer mix centers on AI-native builders and platform teams
        blocks:
          - type: paragraph
            body: >-
              The public customer set skews toward teams that need bursty GPU or sandbox capacity without building their
              own infrastructure layer. Official material emphasizes a code-first operating model, per-second billing,
              and multi-cloud capacity, which fits ML engineers, developer-platform teams, and internal AI builders more
              naturally than procurement-led legacy IT buyers. Independent and semi-independent sources reinforce the
              same pattern: named customers span consumer AI products, coding agents, media generation, robotics, and
              research workloads rather than conventional back-office SaaS deployments. That is a positive signal for
              product-market fit in AI-native infrastructure, but it also means the current proof base says more about
              developer-led adoption than about broad enterprise standardization.
            claimRefs:
              - CU001
              - CU010
              - CU011
              - CU012
              - CU015
