        title: Milestones, execution signals, and unresolved diligence asks
        blocks:
          - type: paragraph
            body: >-
              The milestone record suggests Modal moved from an early Pythonic serverless GPU product into a
              multi-product AI infrastructure platform quickly: Sterling places the company founding in 2021, Functions
              in 2022, a Series A in May 2023, Sandboxes GA in early 2025, and then a rapid 2026 financing and scale
              step-up. The same evidence base also points to the main unresolved asks for later diligence. Public
              sources do not settle exact headcount, customer count, board composition, or financing-rights detail, and
              the one explicitly adverse review in the pool highlights cost surprises, vendor lock-in, and reduced
              control relative to raw VMs. Those are not thesis-breakers by themselves, but they do limit how much of
