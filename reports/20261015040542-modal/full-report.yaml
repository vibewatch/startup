  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Evidence-backed ordinal positioning suggests Modal sits furthest toward integrated platform breadth, while Daytona
      and Beam.cloud score higher on deployment control.
    data:
      xAxis:
        label: Platform breadth for agent workloads
        min: 1
        max: 5
        low: Single-purpose or narrow execution layer
        high: Integrated AI platform
        description: Evidence-backed ordinal synthesis from cited public capabilities
        scale: ordinal
      yAxis:
        label: Deployment control / portability
        min: 1
        max: 5
        low: Managed and vendor-tied
        high: Self-host or open infrastructure
        description: Evidence-backed ordinal synthesis from cited public capabilities
        scale: ordinal
      points:
        - label: Modal
          x: 4.8
          'y': 2
          note: >-
            Unified sandboxes, inference, training, and batch with managed multi-cloud capacity, but closed-source and
            managed.
        - label: E2B
          x: 2.4
          'y': 2.3
          note: >-
            Strong secure code-execution specialist with Firecracker isolation, but narrower retained evidence on
            broader platform scope.
        - label: Daytona
          x: 2.9
          'y': 4.2
          note: Persistent workspaces and self-host/open-source options increase buyer control more than integrated breadth.
        - label: Beam.cloud
