  topStrengths:
    - 公开证据支持年化收入跃升至 $1 billion 以上，证明业务已经具备规模化需求
    - Sandboxes 已成为有分量的独立产品线，让 Modal 不再只是提供同质化 GPU 算力
    - 代码优先的开发体验，加上多云 GPU 调度，让平台在突发型 AI 工作负载中保持差异化
    - 2026 年 10 月的融资和估值跃升，印证了机构投资者对这项业务的信心
    - 覆盖 AI 产品、编码代理、机器人和企业助手的具名客户足够多元，说明平台适配的工作负载范围很广
  topRisks:
    - 毛利率、NRR、现金消耗、现金跑道和头部客户集中度仍未披露
    - $15.75B 的估值几乎不给业绩不达预期或增速放缓留下空间
    - 对外部云和 GPU 供应的可靠性、容量依赖，可能挤压可用性和单位经济性
    - 公开证据仍不足以完整厘清治理、董事会和资本结构细节
    - 客户锁定和成本意外，可能把稳定运行的工作负载推向更便宜的替代方案
  unresolvedGaps:
    - 按产品线拆分的毛利率，是最重要的单项未披露数据
    - NRR、分 cohort 留存率和头部客户集中度仍没有公开数据
    - 月度运营现金消耗和当前现金余额，无法从公开材料中确认
    - 股权结构表、清算优先权金额以及董事会 / 治理细节仍未披露
    - 当前准确员工人数和人员构成，公开信息仍未完全对齐
    - 公开来源对更早的 Series B 细节仍有分歧，因此融资历史只能部分对齐
