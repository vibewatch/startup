      - number: '1.4'
        title: Disclosure gaps and execution risk
        blocks:
          - type: paragraph
            body: >-
              The main diligence risk is not lack of ambition but the gap between a well-funded development platform and
              demonstrated human efficacy. The merger exhibit uses forward-looking language for closing, cash runway,
              clinical timing, and product benefits, and says actual results may differ materially. The FDA
              approval-notification source is used only to distinguish an actual approval disclosure from Treeline's
              Phase 1 status; it is not evidence that no other regulatory record exists. The proposed public-company
              transition may improve disclosure, but until the S-4, post-close filings, and clinical readouts are
              available, investors cannot independently verify cash burn, runway, cap table, detailed board governance,
              trial enrollment, or patient-level efficacy. The evidence therefore supports a research-more posture:
              founder quality and financing are strengths, while clinical validation, transaction completion, and
              disclosure depth remain material uncertainties.
            claimRefs:
              - CO013
              - CO014
              - CO015
