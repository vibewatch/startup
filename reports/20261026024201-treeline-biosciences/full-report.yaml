  - id: FE001
    title: Disclosed product and operating architecture
    type: stack
    summary: >-
      Treeline's public materials describe a layered drug-discovery and development model, while leaving technical
      validation and clinical outcomes open.
    data:
      layers:
        - label: Target and biology
          detail: Biological framing and target tractability.
          items:
            - name: Compelling biological targets
              detail: Oncology-led pipeline with planned expansion to neurology and immunology.
            - name: Target tractability
              detail: Company says modality choice is determined by target demands.
        - label: Discovery engine
          detail: In-house scientific workflow and computational prioritization.
          items:
            - name: In-house R&D
              detail: Biology, chemistry, protein science, computation, and development capabilities are described.
            - name: Computational tools
              detail: Company describes leading-edge computational tools; no independent benchmark is disclosed.
        - label: Therapeutic modalities
          detail: Target-specific choice among disclosed drug modalities.
          items:
            - name: Small-molecule inhibitors
              detail: TLN-372 and TLN-254 are described as small-molecule programs.
            - name: Protein degraders and TT-ADCs
              detail: TLN-121 is described as a degrader; targeted-therapy ADCs are part of the broader pipeline.
        - label: Clinical translation
          detail: Early human development and forward-looking clinical entries.
          items:
            - name: Three Phase 1 programs
              detail: Company-reported status as of the June 2026 merger announcement.
            - name: Future clinical entries
              detail: A fourth entry is expected in 2026, with three more expected in 2027-2028.
        - label: Regulatory and quality
          detail: Controls required to move investigational assets through human studies.
          items:
            - name: Clinical and regulatory submissions
              detail: Required for IND progression and trial execution; study-level evidence is not public here.
            - name: Quality and safety systems
              detail: Manufacturing, monitoring, and compliance controls remain diligence requests.
        - label: Evidence and scale
          detail: Validation layer separating disclosed plans from demonstrated performance.
          items:
            - name: Independent validation
              detail: No independent computational benchmark or human efficacy result is retained in this pool.
            - name: Portfolio scalability
              detail: Multiple programs are disclosed, but delivery cadence and reproducibility are unquantified.
    approximationNotes: >-
      Layer order represents disclosed workflow, not a measured value chain or evidence of efficacy, reliability, or
      scale.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
