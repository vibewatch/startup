    title: Clinical adoption journey
    type: journey-map
    summary: >-
      Treeline's visible customer journey currently runs from biomarker-eligible patient access through trial evidence,
      with commercial adoption still ahead of the public record.
    data:
      nodes:
        - id: disease-segment
