chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Treeline describes itself as a clinical-stage biopharmaceutical company focused on making medicines,
              rather than selling software or a licensable platform. Its stated model combines in-house research and
              development with computational tools and multiple modalities: small-molecule inhibitors, protein
              degraders, and targeted-therapy antibody-drug conjugates. The June 2026 SEC-filed merger exhibit says the
              company was founded in 2021, had advanced three programs into Phase 1, and had a fourth planned clinical
              entry in 2026. BioPharma Dive reported laboratories and offices in Watertown, San Diego, and Basel, but
              the retained evidence does not resolve a formal headquarters because a supplier listing instead labels
              Stamford, Connecticut. The evidence supports a multi-program clinical-stage identity, but not a commercial
              revenue model or approved Treeline product.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO016
      - number: '1.2'
        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >-
              The merger exhibit identifies Josh Bilenker as co-founder and CEO, Jeff Engelman as co-founder and CSO,
              and Spencer Smith as CFO. It attributes Bilenker's prior experience to founding and leading Loxo Oncology
              through three FDA-approved medicines and an $8 billion Eli Lilly acquisition, and identifies Engelman's
              prior roles at Massachusetts General Hospital and Novartis Institutes for Biomedical Research. The same
              filing proposes a 12-person post-closing board with 10 Treeline designees and two Standard BioTools
              designees. These credentials are relevant founder-market-fit signals, but the available pool does not
              provide a complete current board roster, committee structure, ownership table, or key-person succession
              plan. The leadership page independently confirms Engelman's CSO and co-founder role and his Novartis
              oncology background.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: Capital, transaction, and milestones
        blocks:
          - type: paragraph
            body: >-
              Treeline's capital position is substantial but must be separated into historical fundraising and
              transaction-dependent cash. BioPharma Dive reported approximately $1.1 billion raised since formation and
              $200 million of new funding in September 2025, while the June 2026 SEC-filed exhibit states that Treeline
              had previously raised approximately $1.2 billion. The latter also says the proposed Standard BioTools
              combination would add approximately $450 million of net cash and leave more than $900 million of pro-forma
              cash expected to fund operations into 2029. Those are issuer and transaction projections, not audited
              cash-balance or runway evidence. The proposed transaction was expected to close in the second half of
              2026, subject to approvals and customary conditions. The announced milestone path includes an expected
              TLN-499 Phase 1 entry in 2026, three additional clinical entries in 2027-2028, and interim data readouts
              beginning in 2027. The public record does not establish current revenue, customers, audited burn,
              per-program allocation, or a negotiated Treeline pre-money valuation.
