      - CU006
      - CU011
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Clinical proof and financing dependencies carry the highest residual exposure because public evidence does not yet
      verify human outcomes or committed liquidity.
    data:
      columns:
        - Likelihood / impact
        - Moderate impact
        - High impact
        - Critical impact
      rows:
        - label: High likelihood
          values:
            - Clinical proof failure
            - Target-engagement failure
            - Phase 1 efficacy failure
            - Critical safety signal
        - label: Medium likelihood
          values:
            - Cross-site coordination
            - Enrollment delay
            - Manufacturing interruption
            - Regulatory or financing delay
        - label: Low likelihood
          values:
            - Data-quality failure
            - Protocol deviation
            - Supply backup failure
            - Transaction-term change
        - label: Unknown likelihood
          values:
            - Litigation or IP issue
            - Privacy or security incident
            - Partner termination
            - Unreported adverse event
        - label: Unverified likelihood
          values:
            - Environmental issue
            - Labor disruption
            - Data breach
            - Regulatory enforcement
        - label: Contingent likelihood
          values:
            - Recall
            - Trial hold
            - License termination
            - Capital shortfall
    claimRefs:
      - CR003
      - CR007
      - CR010
      - CR012
