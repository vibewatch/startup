    claimRefs: [CP001, CP007, CP008, CP014, CP016]
callouts:
  - calloutType: insight
    title: The moat is still a clinical option
    body: Treeline's portfolio breadth and expected capitalization can support multiple shots on goal, but public evidence does not yet show that its pan-KRAS or degrader programs outperform established or later-stage alternatives.
    claimRefs: [CP001, CP006, CP007, CP008, CP016]
  - calloutType: risk
    title: Competitive proof is the gating event
    body: "The key diligence trigger is comparative human data: target coverage, dose intensity, safety, combination feasibility, and response durability against the crowded KRAS field and established lymphoma approaches."
    claimRefs: [CP007, CP010, CP015, CP016]
