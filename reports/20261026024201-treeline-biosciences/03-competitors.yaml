      - [Revolution Medicines, Direct KRAS peer, "Phase 3 programs and positive readouts described in the landscape source", "RAS-mutant solid tumors", "Pan-RAS/RAS(ON) coverage and advanced clinical stage", "Source is a generated landscape summary; primary trial details were not retained"]
      - [Amgen and BMS/Mirati, KRAS incumbents, "Approved sotorasib and adagrasib are listed in the landscape source", "KRAS G12C NSCLC and related settings", "Commercial and regulatory precedent in covalent G12C inhibition", "Crowded class creates resistance and differentiation pressure"]
      - [Jacobio/AstraZeneca and Chinese G12C peers, Direct and adjacent peers, "Glecirasib is listed as approved; JAB-23E73 is listed as a pan-KRAS program", "KRAS-mutant oncology, with China-originated assets", "Approval speed and licensing can extend regional or global reach", "Detailed pivotal efficacy and realized pricing were not retained"]
    notes: "Sources combine a company-issued merger release with an independent market-landscape summary; stages and portfolio descriptions are not a like-for-like efficacy benchmark."
    claimRefs: [CP001, CP004, CP007, CP008, CP009, CP014]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Treeline, KRAS incumbents, Pan-RAS or pan-KRAS peers, Evidence implication]
    rows:
      - [Mutation or target breadth, "Company claims pan-KRAS TLN-372 and multiple non-KRAS programs", "Covalent G12C products are established; exact breadth varies by asset", "Pan-RAS or pan-KRAS approaches are described in the landscape source", "Breadth is a hypothesis until clinical differentiation is shown"]
      - [Clinical validation, "Three Phase 1 programs disclosed", "Approved products provide regulatory and clinical precedent", "Several programs are described as Phase 3 or Phase 1/2", "Stage is a proxy for evidence maturity, not efficacy"]
      - [Combination and safety rationale, "TLN-372 is designed to spare HRAS and NRAS; TLN-121 is designed to limit off-target toxicity", "Combination and resistance trade-offs are established competitive concerns", "Landscape source identifies combinations and new modalities as differentiation routes", "Claims require independent safety, dose, and combination data"]
      - [Distribution and trust, "Expected Nasdaq listing and experienced founders", "Incumbents have commercial infrastructure and prescribing history", "Peer evidence includes large-company partnerships and licensing", "Capital access may help execution but does not establish physician or payer adoption"]
    notes: "Cells marked as company claims or directional implications are not independent benchmarks; no source in the assigned pool provides a complete, comparable feature specification for every peer."
    claimRefs: [CP001, CP006, CP007, CP011, CP012, CP016]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Alternative, Price or contract model, Included capability, Discount or unknown, Competitive implication]
    rows:
      - [Treeline clinical programs, null, "Investigational medicines in Phase 1", "Commercial price and reimbursement are undisclosed", "No realized pricing power can be assessed"]
      - [Approved KRAS G12C therapies, null, "Approved treatment options are listed for sotorasib and adagrasib", "Net price, contracting, and line-of-therapy economics are not in the retained source", "Incumbent access is a competitive advantage, but price comparison is unavailable"]
      - [Licensed EZH2 route, null, "Treeline's merger release says TLN-254 was in-licensed after Phase 2 evaluation and approval in China", "License economics and territory terms are not disclosed in the retained source", "Partner dependence and economics require diligence"]
      - [Internal build versus external licensing, null, "Treeline combines in-house discovery with at least one licensed program", "Program-level cost, milestones, royalties, and termination rights are unknown", "Portfolio breadth may trade off against transparency and control"]
    notes: "Null price cells mean no comparable public price or contract value was retained; investigational status, approved status, and licensing are different commercial models."
    claimRefs: [CP001, CP002, CP013, CP015]
