      - [Peripheral and cutaneous T-cell lymphoma patients, "Patient / treating center; payer not yet established", "TLN-254 clinical development after in-licensing", "Phase 1 population described; no public cohort denominator in assigned sources", "Tests the in-licensed asset in Treeline's development system", "No current enrollment, response, persistence, or access data"]
      - [Patients with KRAS-altered solid tumors, "Patient / investigator; payer not yet established", "TLN-372 Phase 1 development", "Clinical program announced; no public patient or site denominator in assigned sources", "Expands the potential disease and biomarker population", "No disclosed enrollment, response, commercial demand, or payer evidence"]
      - [Clinical investigators and trial sites, "Research sites and principal investigators", "Screen, enroll, dose, monitor, and assess participants", "NCT07082803 lists locations across North America and Australia", "Execution capacity and data-generation access", "Site activation, enrollment velocity, and concentration by site are undisclosed"]
    notes: "Sources: Treeline announcement, BioPharma Dive coverage, and ClinicalTrials.gov; clinical eligibility and estimated enrollment are not commercial customer counts, and undisclosed denominators remain null."
    claimRefs: [CU001, CU002, CU003, CU005, CU006]
  - id: TU002
    title: Customer growth / adoption trajectory
    columns: [Metric, Value, Date, Source, Confidence, Implication, Missing denominator]
    rows:
      - [Clinical program count, 3 programs entering Phase 1, "2025-09-03", "Treeline announcement", high, "Development funnel reached human testing across two internally discovered and one in-licensed program", "No program-level enrollment or outcome denominator"]
      - [TLN-121 study status, Recruiting, "2026-09-04", "ClinicalTrials.gov NCT07082803", high, "Live trial access is an operational adoption signal", "No actual enrollment or enrollment velocity"]
      - [TLN-121 estimated enrollment, 180 participants, "2026-09-04", "ClinicalTrials.gov NCT07082803", high, "Defines planned study scale, not realized demand", "Actual screened, enrolled, treated, and evaluable participants"]
      - [TLN-121 estimated study completion, "2030-11", "2026-09-04", "ClinicalTrials.gov NCT07082803", high, "Long development cycle limits near-term commercial evidence", "Interim milestones and timing confidence"]
      - [Commercial customer count, null, "2026-10-26", "Assigned-pool review", low, "No public commercial adoption metric was located", "Active accounts, prescriptions, revenue, and payer coverage"]
    notes: "Sources are dated or accessed as shown; the table separates planned clinical scale from realized adoption, and null means the assigned successful source pool did not disclose the metric."
    claimRefs: [CU005, CU006, CU007, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Customer / proof surface, Segment, Deployment or use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [NCT07082803 participants and investigators, "Relapsed or refractory non-Hodgkin lymphoma", "TLN-121 alone and with other anti-lymphoma therapies", "Recruiting Phase 1; not production", "Protocol evaluates safety, pharmacokinetics, and preliminary anti-tumor activity", "No results posted and no efficacy outcome disclosed"]
      - [Participating clinical sites, "Lymphoma trial population", "Multicenter enrollment and follow-up", "Active research network; not commercial deployment", "Locations are listed across the United States, Canada, and Australia", "Site-level activation, patient throughput, and concentration are not reported"]
      - [T-cell lymphoma patients, "Peripheral and cutaneous T-cell lymphoma", "TLN-254 development after Hengrui license", "Clinical development; not production", "BioPharma Dive reports the asset is approved in China and is being developed by Treeline", "No Treeline trial results, access volume, or persistence data"]
    notes: "Enumeration is partial: it covers three publicly described clinical proof surfaces, not every participant, site, or future customer; no row should be read as a paying customer or validated outcome."
    enumerationScope:
      coverage: partial
      basis: "Publicly described Treeline clinical programs and trial proof surfaces available in the assigned pool as of 2026-10-26"
    claimRefs: [CU005, CU006, CU008, CU010]
