callouts:
  - calloutType: insight
    title: Clinical access is not commercial traction
    body: Treeline has a recruiting, multicenter Phase 1 program and three disclosed clinical candidates, but the assigned evidence does not establish a paying customer base, efficacy, retention, or expansion.
    claimRefs: [CU005, CU006, CU009]
  - calloutType: risk
    title: Durability remains unmeasured
    body: "The key customer-risk variables are trial execution and dose durability: enrollment velocity, discontinuation, dose optimization, response, and follow-up are not disclosed in the retained sources."
    claimRefs: [CU010, CU011, CU012]
