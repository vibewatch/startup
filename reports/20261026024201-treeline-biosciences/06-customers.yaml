schemaVersion: "report-v2"
artifact: customers
slug: treeline-biosciences
runDate: 2026-10-26
company:
  name: Treeline Biosciences
chapter:
  number: 6
  title: Customers
  summary: Treeline is a clinical-stage oncology company whose current customer proxy is the patient and clinical-site ecosystem, not a paying commercial base. Public evidence shows three early clinical programs and a recruiting Phase 1 trial, but no disclosed commercial customers, outcomes, retention, or revenue denominator.
sections:
  - id: customer-segments
    title: Patient and buyer segments
    body: >-
      Treeline's current addressable user population is defined by clinical eligibility rather than
      a commercial buyer funnel. The September 2025 announcement places TLN-121 and TLN-254 in
      lymphoma and TLN-372 in KRAS-altered solid tumors, while the independent merger coverage
      describes the portfolio as experimental programs in early trials (SU001, SU002). The
      registrational customer is therefore not yet a payer or hospital purchasing a marketed
      product; it is a patient, investigator, and trial site participating in development. The
      disclosed segmentation is clinically specific, but the public record does not provide active
      patient counts by disease, geography, payer, or revenue band. The segmentation table keeps
      those denominators explicitly unknown rather than converting trial eligibility into demand.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named proof
    body: >-
      The strongest adoption signal is operational: ClinicalTrials.gov lists NCT07082803 as
      recruiting, with Treeline as sponsor, an estimated enrollment of 180, and an estimated
      completion in November 2030 (SU003). That is evidence of a live development process and
      multi-site access, not evidence of efficacy, repeat use, prescription demand, or commercial
      conversion. The record says no results are posted, and the trial's stated purpose includes
      safety, pharmacokinetics, and preliminary anti-tumor activity. The named-proof table thus
      treats patients and participating institutions as clinical proof surfaces, distinguishes
      recruiting from production deployment, and records the absent outcome denominator.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-expansion
    title: Retention, expansion, and concentration
    body: >-
      No public source in the assigned pool discloses NRR, GRR, churn, renewal, contract length,
      cohort retention, active accounts, sales pipeline, or customer concentration. The commercial
      durability question is therefore unresolved rather than weakly positive. Treeline's stated
      model is to build a repeatable, multi-program biopharma engine, and the merger coverage
      reports a fourth drug that could enter Phase 1 plus additional unnamed programs (SU002), but
      pipeline breadth is not customer expansion. FDA Project Optimus adds a material diligence
      lens: dose and schedule choices can create toxicity, dose reductions, discontinuations, and
      missed benefit if poorly characterized (SU004). Before treating clinical enrollment as a
      durable adoption loop, an investor should obtain trial-level enrollment velocity, site
      activation, screen-failure, discontinuation, dose-optimization, response, and follow-up
      data, plus any post-approval access and payer evidence.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: []
    figureRefs: []
