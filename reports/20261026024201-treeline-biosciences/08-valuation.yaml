        - id: cash
          label: "Cash and merger terms unverified"
        - id: clinical
          label: "Human efficacy not yet established"
        - id: dilution
          label: "Cap table and preferences undisclosed"
        - id: recommendation
          label: "Research-more"
      edges:
        - from: scale
          to: recommendation
        - from: founder
          to: recommendation
        - from: cash
          to: recommendation
        - from: clinical
          to: recommendation
        - from: dilution
          to: recommendation
    claimRefs: [CV001, CV002, CV008, CV012, CV017]

callouts:
  - calloutType: recommendation
    title: Decision
    body: Research-more until the reverse-merger agreement, audited cash and burn, fully diluted capitalization, preference terms, and first meaningful human data are available.
    claimRefs: [CV007, CV008, CV012, CV016]
  - calloutType: risk
    title: Thesis-break trigger
    body: A materially lower cash balance, discounted financing, failed merger, or negative clinical safety/efficacy signal would invalidate the cash-supported option framing.
    claimRefs: [CV013, CV014, CV015, CV016]

