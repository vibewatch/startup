      - ["Biomarker or indication mismatch", "medium", "high", "programs are target-specific but clinical validation is pending", "Enrollment and response risk", "Reconcile inclusion criteria with translational evidence and site screening"]
      - ["Regulatory or IND delay", "medium", "high", "public dates and status are incomplete", "Delayed readouts and higher burn", "Request IND status, agency questions, and milestone calendar"]
    notes: "Sources include company-issued descriptions, independent reporting, and FDA approval notices; null or qualitative maturity fields mean the assigned pool did not provide auditable program-level evidence."
    enumerationScope:
      coverage: partial
      basis: "Publicly disclosed clinical and regulatory risks identified from assigned sources available on 2026-10-26"
    claimRefs: [CR001, CR002, CR003, CR004, CR007]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Clinical operations or enrollment delay", "medium", "high", "planned milestones are described but site-level evidence is absent", "Burn and data-timing slippage", "Site roster and enrollment denominator"]
      - ["Manufacturing or supply interruption", "medium", "high", "no CMC or vendor evidence in pool", "Trial interruption or batch failure", "CMC network, release testing, and backup suppliers"]
      - ["Cross-site coordination failure", "medium", "high", "multi-city footprint is described by a company-profile source", "Quality and decision latency", "RACI, quality system, and audit results"]
      - ["Data or protocol-quality failure", "low-to-medium", "high", "no incident or deviation register is public in pool", "Uninterpretable or delayed readout", "Protocol deviations, database lock controls, and inspection history"]
    notes: "Likelihood and severity are diligence prioritization judgments anchored to disclosed operating dependencies; they are not observed incident rates. Missing denominators and incident logs remain open gaps."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["EZH2 license", "Jiangsu Hengrui", "Licensed TLN-254 program", "One named external program", "Rights, milestone, or supply dispute", "high", "Review license, territory, termination, and milestone terms", "Material program-specific dependency"]
      - ["Clinical financing", "Private investors and future capital markets", "Fund discovery and Phase 1 portfolio", "Public funding total is not cash availability", "Financing delay or dilution before proof", "high", "Maintain program-level cash forecast and contingency plan", "Runway and dilution are unverified"]
      - ["Reverse-merger path", "Standard BioTools", "Public-market access and transaction funding", "Transaction-dependent", "Closing delay or changed economics", "high", "Reconcile definitive filings and closing conditions", "Cash-at-close and ownership assumptions need verification"]
      - ["Public-market liquidity", "Nasdaq listing process", "Potential exit and financing venue", "No confirmed completed listing in assigned evidence", "Market access or valuation compression", "medium", "Confirm closing, listing, lockups, and reporting controls", "Liquidity and governance terms remain open"]
    notes: "Counterparty roles and financial figures are attributed to the cited sources; milestone ceilings, expected cash, and transaction terms must not be treated as available cash without definitive filings."
    claimRefs: [CR009, CR010, CR011, CR012]

figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Clinical proof and financing dependencies carry the highest residual exposure because public evidence does not yet verify human outcomes or committed liquidity.
    data:
      columns: [Likelihood / impact, Moderate impact, High impact, Critical impact]
      rows:
        - label: High likelihood
          values: ["Clinical proof failure", "Target-engagement failure", "Phase 1 efficacy failure", "Critical safety signal"]
        - label: Medium likelihood
          values: ["Cross-site coordination", "Enrollment delay", "Manufacturing interruption", "Regulatory or financing delay"]
        - label: Low likelihood
          values: ["Data-quality failure", "Protocol deviation", "Supply backup failure", "Transaction-term change"]
        - label: Unknown likelihood
          values: ["Litigation or IP issue", "Privacy or security incident", "Partner termination", "Unreported adverse event"]
        - label: Unverified likelihood
          values: ["Environmental issue", "Labor disruption", "Data breach", "Regulatory enforcement"]
        - label: Contingent likelihood
          values: ["Recall", "Trial hold", "License termination", "Capital shortfall"]
    claimRefs: [CR003, CR007, CR010, CR012]

callouts:
  - calloutType: risk
    title: The portfolio is still an option on human proof
    body: Treeline has assembled capital and multiple clinical shots, but the assigned evidence does not include human efficacy or safety results. The first thesis-break test is therefore clinical, not fundraising.
    claimRefs: [CR001, CR003, CR009]
  - calloutType: assumption
    title: Cash claims require filing-level reconciliation
    body: Reported funding, milestone ceilings, and expected transaction cash describe different economic concepts. Treating them as interchangeable would overstate liquidity and understate dilution or financing risk.
    claimRefs: [CR009, CR010, CR011]

