    severity: material
    topic: clinical-validation
    missingEvidence: Trial enrollment, safety, efficacy, and interim data for each Phase 1 program.
    whyItMatters: >-
      The value proposition remains dependent on human clinical validation rather than only founder credentials and
      preclinical selection.
    diligencePath: >-
      Track trial registries, conference disclosures, and company filings for protocol, enrollment, and interim
      readouts.
