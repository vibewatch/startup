  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited financial statements, current headcount, formal headquarters, valuation, debt, cash burn, runway bridge,
      cap table, and program-level capital allocation.
    whyItMatters: >-
      The financing narrative cannot be translated into liquidity or valuation confidence without accounting and
      capitalization detail.
    diligencePath: >-
      Review the S-4 and subsequent SEC filings after the proposed transaction, including cash, expenses, shares, and
      related-party disclosures.
