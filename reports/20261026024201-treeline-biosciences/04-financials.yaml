callouts:
  - calloutType: strength
    title: Large disclosed financing base
    body: Tracxn reports $1.1 billion of total funding, and independent coverage reports a $200 million Series A extension bringing total funding to that level.
    claimRefs: [CI009, CI010]
  - calloutType: risk
    title: Capital adequacy remains conditional
    body: The most decision-relevant cash figure is more than $900 million expected at merger closing, not an audited cash balance available today; closing mechanics, obligations, and burn remain unverified.
    claimRefs: [CI011, CI013, CI015]
  - calloutType: recommendation
    title: Request a financing-to-readout model
    body: Underwriting should require audited financials, monthly burn, debt and commitments, cash-at-close reconciliation, and program budgets through the next clinical readouts.
    claimRefs: [CI014, CI015, CI016]
