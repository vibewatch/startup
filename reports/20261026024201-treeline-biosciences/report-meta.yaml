companyProfile:
  summary: >-
    Treeline Biosciences is a clinical-stage biopharmaceutical company founded in 2021 by Josh Bilenker and Jeff
    Engelman. Its stated operating model integrates in-house research and development with computational tools across
    multiple drug modalities, and its June 2026 merger announcement reported three programs in Phase 1 with additional
    clinical entries planned. The retained evidence does not establish commercial revenue, current customer count,
    audited financials, or mature human efficacy.
  founders:
