    notes: "Boundary is an analytical classification from Treeline's disclosed modalities and FDA disease/biomarker-specific approval language; it is not a reported market-size estimate."
    claimRefs: [CM001, CM003, CM004, CM010]
  - id: TM002
    title: Evidence-constrained sizing lenses
    columns: [publisher or lens, year, geography, value, CAGR, methodology, confidence, limitation]
    rows:
      - [National Cancer Institute SEER, "2026 estimate", "United States", "79,320 estimated new non-Hodgkin lymphoma cases; 19,970 estimated deaths", null, "Population surveillance and projection; rates and counts are not drug spending", high, "Incidence is not addressable revenue and includes patients outside Treeline's target subsets"]
      - [HealthQuest Capital / Standard BioTools transaction release, 2026, "Global company pipeline", "3 Phase 1 programs; fourth planned in 2026; 3 more expected in 2027-2028", null, "Company/partner transaction disclosure", medium, "Pipeline count does not establish efficacy, approval, or market share"]
      - [HealthQuest Capital / Standard BioTools transaction release, 2026, "Combined company", "More than $900 million pro-forma cash expected at closing; runway into 2029", null, "Expected financing position at transaction close", medium, "Cash is not revenue, demand, or bottom-up valuation"]
      - [Grand View Research page, unknown, "Global oncology drugs", "Numeric estimate unavailable in fetched text", null, "Fetched page presents access and subscription prompts", low, "A public market-size number cannot be verified from the assigned fetch"]
    notes: "The lenses are deliberately non-additive and not comparable units. No CAGR is populated because no assigned fetched source provides a verifiable CAGR for Treeline's addressable market."
    claimRefs: [CM005, CM006, CM007, CM009]
  - id: TM003
    title: Segment, buyer, and adoption map
    columns: [segment, buyer, user, payer, workflow, budget owner, adoption trigger]
    rows:
      - [Discovery and clinical development, "Investors and biopharma management", "Research and clinical teams", "Company financing and public-market capital", "Select targets, run trials, allocate capital", "CFO, board, and investors", "Credible data package and financing runway"]
      - [Regulatory access, "Sponsor and regulator", "Regulatory and clinical affairs teams", "Sponsor and regulatory budget", "Submit evidence and obtain a label", "Regulatory organization", "Efficacy, safety, biomarker definition, and required approvals"]
      - [Oncology treatment, "Health system and oncology practice", "Oncologist and care team", "Commercial or government payer; patient cost share", "Diagnose, select, prescribe, and monitor therapy", "Provider pharmacy and payer policy", "Differentiated clinical benefit, tolerability, and coverage"]
      - [Patient access, "Patient and treating clinician", "Patient", "Payer plus patient out-of-pocket", "Receive treatment and generate outcomes", "Payer and household", "Accessible coverage and outcomes that justify switching"]
    notes: "Buyer and payer roles are an analytical adoption map, not disclosed Treeline customer contracts; source-backed adoption gates are the FDA's disease, biomarker, stage, and prior-treatment requirements."
    claimRefs: [CM003, CM010, CM011, CM012]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: "Three non-additive evidence layers bound the opportunity from disease population to company pipeline and financing capacity."
    data:
      nodes:
        - label: "Clinical need"
          value: "79,320 estimated U.S. NHL new cases in 2026"
          detail: "Population incidence is a demand context, not a Treeline revenue estimate."
          tone: neutral
          claimRefs: [CM005]
        - label: "Treeline pipeline"
          value: "3 Phase 1 programs; 4th planned in 2026"
          detail: "Company/partner disclosure; clinical entry does not establish approval or efficacy."
          tone: positive
          claimRefs: [CM006]
        - label: "Financing capacity"
          value: "> $900M expected pro-forma cash"
          detail: "Expected at closing and described as runway into 2029; cash is not market size."
          tone: opportunity
          claimRefs: [CM007]
        - label: "Regulatory gate"
          value: "Disease- and biomarker-specific approval"
          detail: "FDA approvals define the eligible population and treatment context."
          tone: neutral
          claimRefs: [CM003]
        - label: "Adoption gate"
          value: "Clinical benefit plus coverage"
          detail: "Approval alone does not establish physician or payer uptake."
          tone: warning
          claimRefs: [CM010, CM012]
        - label: "Treeline SAM/SOM"
          value: "Not publicly disclosed"
          detail: "No transparent target-population, price, reimbursement, or share calculation was retained."
          tone: adverse
          claimRefs: [CM009]
    approximationNotes: "Layers are ordered evidence lenses, not proportional or additive market values; no SAM/SOM is asserted because the assigned pool lacks a transparent calculation."
    claimRefs: [CM014]
