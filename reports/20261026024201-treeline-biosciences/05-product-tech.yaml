      - [TLN-254, "Patients and clinicians treating peripheral or cutaneous T-cell lymphomas", "Phase 1; company-described", "EZH2 inhibitor in-licensed from Jiangsu Hengrui", "License terms, current protocol, and comparative clinical evidence"]
      - [Fourth clinical entry, "Future patients in an undisclosed indication", "Planned for 2026; forward-looking", "No public asset-level differentiation disclosed", "Candidate identity, IND status, and development plan"]
    notes: "Status and differentiation are primarily company disclosures; planned entries are not completed milestones, and blank technical details require primary diligence."
    claimRefs: [CE001, CE002, CE003, CE006]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Treeline solution, Measurable benefit, Limitation]
    rows:
      - ["Select a cancer target", "Biology and target-selection work before candidate nomination", "Match compelling targets with drug approaches", "No public quantitative benefit", "Target-selection criteria and hit rates undisclosed"]
      - ["Create a molecule for a difficult target", "Iterative chemistry and assay development", "In-house chemistry plus computational tools", "No public benchmark or cycle-time series", "Computational performance and reproducibility unverified"]
      - ["Advance a candidate to humans", "Preclinical package, IND preparation, and Phase 1 execution", "Three programs reported in Phase 1", "Program count is disclosed; efficacy is not", "Study-level enrollment and safety data unavailable"]
      - ["Expand the portfolio", "Fund and staff multiple parallel programs", "Multi-program model with additional entries planned", "Fourth entry and 2027-2028 entries are expectations", "No audited delivery cadence or kill-rate data"]
      - ["Source an external asset", "License a candidate when external provenance is preferable", "TLN-254 in-licensed from Jiangsu Hengrui", "Access to an existing asset is disclosed", "Economics, rights, and transfer package undisclosed"]
    notes: "The table describes the disclosed operating workflow, not realized patient or commercial outcomes; measurable-benefit cells are null where no source provides a metric."
    claimRefs: [CE004, CE005, CE007, CE008, CE014]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or diligence ask]
    rows:
      - ["Target biology", "Select oncology, neurology, and immunology opportunities", "Biological rationale and target tractability", "Target validation package is not public"]
      - ["Chemistry and protein science", "Create small molecules and degraders", "Assays, chemistry capability, and candidate quality", "No reproducibility or yield metrics disclosed"]
      - ["Computational tools", "Prioritize and accelerate discovery workflows", "Data, models, and expert interpretation", "No independent benchmark, model validation, or governance evidence"]
      - ["Modality selection", "Choose inhibitor, degrader, glue, or TT-ADC approach", "Target-specific drug properties and safety constraints", "Trade-off framework is described only at a high level"]
      - ["Clinical development", "Move selected assets through Phase 1 and later trials", "Regulatory submissions, sites, patients, and safety monitoring", "Study-specific records and interim outcomes are not available in assigned captures"]
      - ["Portfolio financing", "Support parallel programs and future entries", "Merger closing and cash expected at closing", "Runway is a forward-looking company estimate, not proof of execution"]
    notes: "Architecture layers are an analytical rendering of disclosed activities; they do not prove an integrated technical stack, validated controls, or clinical success."
    claimRefs: [CE005, CE006, CE009, CE010, CE011]
figures:
  - id: FE001
    title: Disclosed product and operating architecture
    type: stack
    summary: Treeline's public materials describe a layered drug-discovery and development model, while leaving technical validation and clinical outcomes open.
    data:
      layers:
        - label: "Target and biology"
          detail: "Biological framing and target tractability."
          items:
            - name: "Compelling biological targets"
              detail: "Oncology-led pipeline with planned expansion to neurology and immunology."
            - name: "Target tractability"
              detail: "Company says modality choice is determined by target demands."
        - label: "Discovery engine"
          detail: "In-house scientific workflow and computational prioritization."
          items:
            - name: "In-house R&D"
              detail: "Biology, chemistry, protein science, computation, and development capabilities are described."
            - name: "Computational tools"
              detail: "Company describes leading-edge computational tools; no independent benchmark is disclosed."
        - label: "Therapeutic modalities"
          detail: "Target-specific choice among disclosed drug modalities."
          items:
            - name: "Small-molecule inhibitors"
              detail: "TLN-372 and TLN-254 are described as small-molecule programs."
            - name: "Protein degraders and TT-ADCs"
              detail: "TLN-121 is described as a degrader; targeted-therapy ADCs are part of the broader pipeline."
        - label: "Clinical translation"
          detail: "Early human development and forward-looking clinical entries."
          items:
            - name: "Three Phase 1 programs"
              detail: "Company-reported status as of the June 2026 merger announcement."
            - name: "Future clinical entries"
              detail: "A fourth entry is expected in 2026, with three more expected in 2027-2028."
        - label: "Regulatory and quality"
          detail: "Controls required to move investigational assets through human studies."
          items:
            - name: "Clinical and regulatory submissions"
              detail: "Required for IND progression and trial execution; study-level evidence is not public here."
            - name: "Quality and safety systems"
              detail: "Manufacturing, monitoring, and compliance controls remain diligence requests."
        - label: "Evidence and scale"
          detail: "Validation layer separating disclosed plans from demonstrated performance."
          items:
            - name: "Independent validation"
              detail: "No independent computational benchmark or human efficacy result is retained in this pool."
            - name: "Portfolio scalability"
              detail: "Multiple programs are disclosed, but delivery cadence and reproducibility are unquantified."
    approximationNotes: "Layer order represents disclosed workflow, not a measured value chain or evidence of efficacy, reliability, or scale."
    claimRefs: [CE005, CE006, CE007, CE008]
callouts:
  - calloutType: insight
    title: Portfolio is the product
    body: Treeline's product surface is a portfolio of investigational medicines built through an integrated discovery model; no commercial product or outcome metric is established in the assigned evidence.
    claimRefs: [CE001, CE004, CE005]
  - calloutType: risk
    title: Technical proof remains thin
    body: The public record describes modalities and development stages but does not provide study-level clinical data, independent computational benchmarks, quality certifications, or reproducible manufacturing evidence.
    claimRefs: [CE009, CE013, CE015, CE016]
  - calloutType: recommendation
    title: Require primary translational evidence
    body: Before underwriting technical maturity, obtain protocols, enrollment and safety updates, translational datasets, assay validation, quality-system evidence, and definitive regulatory filings.
    claimRefs: [CE009, CE011, CE015]
