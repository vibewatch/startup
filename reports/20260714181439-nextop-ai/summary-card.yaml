  topStrengths:
    - >-
      Founder-market fit is unusually strong, anchored in Anshul Sadana's Arista operating history and hyperscaler
      networking relationships.
    - >-
      The company targets a real AI-infrastructure bottleneck where Ethernet, openness, power efficiency, and custom
      engineering matter.
    - >-
      Product positioning is concrete rather than vague, with named scale-up, scale-out, scale-across, and front-end
      networking scope plus open-NOS support.
    - >-
      Investor validation is elite, with Lightspeed, Andreessen Horowitz, Altimeter, and other backers underwriting the
      category early.
    - Large disclosed financing reduces near-term survivability risk for a capital-intensive hardware program.
  topRisks:
    - >-
      Public revenue, backlog, margin, retention, and concentration data remain undisclosed, making valuation
      underwriting highly uncertain.
    - >-
      Named customer proof is extremely thin relative to the $4.2B mark, with public validation centered on one
      Microsoft-linked operator quote plus anonymous cohorts.
    - >-
      Export-control, supplier, and merchant-silicon dependencies can directly slow or block customer ramps in a
      geopolitically sensitive market.
    - >-
      Hyperscaler-heavy account structure likely creates meaningful concentration risk even if early design wins are
      real.
    - Public trust, security, and reliability disclosure is sparse for a vendor selling into demanding cloud operators.
  unresolvedGaps:
    - Current revenue, booked backlog, and the bridge from engineering wins to recognized revenue.
    - Gross margin, warranty reserve, support-cost profile, and hardware replacement history.
    - Top-customer concentration, renewal status, and referenceability beyond the Microsoft-linked operator signal.
    - Export-compliance maturity, ownership screening, and auditability for global deployments.
    - Preference stack, secondary terms, and other cap-table details that affect actual return potential.
