      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    enumerationScope:
      coverage: exhaustive
      basis: >
        Covers the public networking and AI-infrastructure comparables most useful for triangulating Nextop's current
        $4.2B private mark from public evidence: pure-play cloud networking, incumbent networking, merchant-silicon /
        AI-infrastructure suppliers, and adjacent AI-native infrastructure.
    rows:
      - - Arista Networks
        - 公共云 / 数据中心网络龙头
        - 市值约 ~$228.01B（2026 年 7 月）
        - 云网络可信度和战略重要性方面，最佳公共纯云网络可比公司
        - 比 Nextop 成熟、盈利和多元化得多；单看市值并不说明入场价值公平
      - - Cisco Systems
        - 成熟在位网络设备厂商
        - 市值约 ~$459.65B（2026 年 7 月）
        - 产品宽度和客户深度得到证明后，网络控制点可以长到多大，Cisco 给了参照
        - 企业和服务提供商敞口较多，作为 AI 原生创业公司定价的同类可比偏弱
      - - Broadcom
        - 商用芯片与 AI 基础设施供应商
        - 市值约 ~$1.862T（2026 年 7 月）
        - 展示 AI 中瓶颈基础设施层能沉淀多少价值
        - 业务组合、软件敞口和规模使它不适合作为直接创业公司倍数锚
      - - NVIDIA
        - 主导 AI 基础设施瓶颈的玩家
        - 市值约 ~$5.129T（2026 年 7 月）
        - 可作为战略性 AI 瓶颈能长到多值钱的天花板示例
        - GPU 和系统主导地位，与以太网交换机创业公司的经济性结构不同
      - - Hewlett Packard Enterprise（AI 网络相邻厂商）
        - 相邻的 AI 网络与企业基础设施厂商
        - 市值约 ~$64.86B（2026 年 7 月）
        - 提供一个规模较低、带网络敞口且有公开运营披露的相邻可比
        - 更宽的企业业务组合和不同利润率结构限制直接参考价值
      - - Juniper Networks
        - 收购前的独立网络设备厂商
        - 最后已知独立市值约 ~$13.35B（2025 年 7 月）
        - 可作为类似底部的参照：HPE 收购前，一个成熟但 AI 中心性较弱的网络资产是什么样
        - 不是 2026 年仍在交易的公共可比公司，也早于当前 AI 网络热潮
    notes: |
      这张表刻意使用市值状态，而不是在私营公司数据不完整时硬凑假精确倍数。公共可比分析只提供方向，不是机械结论。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV024
      - CV041
  - id: TV005
    title: 论点破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 锚定客户集中度被证明极端
        - 收入实质集中在一两个项目，续约可见度有限
        - 削弱多元化，使溢价估值难以自圆其说
        - 除非价格明显重置，否则下调为放弃
      - - Series B 扩张后仍无订单储备 / 收入 / 利润率披露
        - 持续拒绝或无法私下提供基本运营指标
        - 把当前不透明从暂时问题变成结构性问题
        - 维持继续研究，或直接放弃
      - - 出口管制或合规问题浮现
        - 执法问询、项目受阻，或所有权 / KYC 控制不足
        - 下调国际扩张假设，并抬高治理风险
        - 继续推进前要求完成法务补救
      - - 商用芯片 / 路线图延误
        - 下一代交换机爬坡延迟，或出现配额约束
        - 削弱相对在位厂商的产品时点优势
        - 下调并重做看多和基准情景
      - - 现场可靠性或支持失误
        - RMA 明显飙升、公开事故，或反复替换失败
        - 支持组织从护城河变成负债
        - 下调上行区间，并抬高尽调门槛
      - - 高管连续性中断
        - 创始人或多名关键工程 / 支持负责人离开
        - 直接削弱关系驱动的论点
        - 从第一性原理重新评估
    notes: 终止触发项聚焦于最能快速摧毁当前溢价叙事的事项。
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入与订单储备
        - 当前收入、已签订单储备和按项目划分的爬坡
        - 支撑估值最直接的缺失输入
        - CFO / 财务尽调请求
      - - 毛利率与质保准备金
        - 产品利润率、支持成本、质保准备金和 RMA 历史
        - 决定该模型能否在经济性上扩张
        - 财务 + 运营尽调
      - - 客户集中度
        - Top-5 客户集中度、续约状态和具名客户背书
        - 判断当前估值靠广泛证明支撑，还是只靠少数锚定胜利
        - CEO / 销售 / 投资人尽调
      - - 出口合规成熟度
        - ECP、所有权筛查、KYC 和审计权流程
        - 判断全球增长假设能否在法律上站住
        - 法务 / 合规尽调
      - - 安全与可靠性姿态
        - 信任中心材料、认证、事故历史和支持 SLA 达成情况
        - 顶级云客户常用这些控制项筛选供应商
        - 安全 + 支持尽调
      - - 股权结构与优先权悬置压力
        - 优先权堆栈、二级出售权、投资人保护和降估值轮条款
        - 即便企业价值增长，也会影响实际回报潜力
        - 公司法律顾问 / 融资尽调
    notes: 上述问题按对估值建议的影响排序，而不是按管理层提供难易度排序。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
