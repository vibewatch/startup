      - number: '1.2'
        title: 创始人匹配度、领导层厚度与治理信号
        blocks:
          - type: paragraph
            body: >-
              公开材料里最强的人才信号，是创始人与市场匹配。Anshul Sadana 不是追 AI 热度的外行；第三方报道和投资人材料显示，他在 Arista 待了约 17 年并曾任 COO，一篇独立评测还提到他早年有
              Cisco 经历。这段背景很重要，因为 Nexthop 正面切入超大规模云厂商网络项目，而设计信誉和关系在这里都是稀缺资产。代价是关键人集中：创始人履历贯穿发布报道、投资人叙事、Davos
              媒体露出和官方产品公告。公开可见的领导层厚度有，但仍偏轻。公司 about 页面列出硬件、软件、产品、客户工程、财务和供应链负责人，董事和顾问名单包括 Ita Brennan、Sureel Choksi、Guru
              Chahal 和 Dave Maltz。Linux Foundation 报道也显示 Ryan Torres 代表 Nexthop
              发声其软件议程。整体看，治理可见度好过隐身阶段创业公司，但还不等于成熟上市公司的运营组织图：委员会、独立董事长细节和股权披露都还看不到。
