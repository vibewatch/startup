            body: >-
              NVIDIA 仍是栈最宽的对手，因为它同时覆盖专有 InfiniBand 和以太网。Spectrum 平台把交换机与 Cumulus Linux、Pure SONiC、NetQ
              以及仿真或验证工具打包；InfiniBand 平台又加入 SHARP 和其他网络内计算功能，这些在顶级训练 fabric 里仍然重要。NVIDIA 新近的硅光公告也显示，它正强势把网络绑在自己的 AI
              工厂愿景上，而不是把以太网份额让给独立交换厂商。Arista 是最清晰的开放以太网系统对手。它在 2026 年 6 月发布 1.6T 时，把 7060XE7 家族定位成同时面向 scale-up 和
              scale-out 的机架级 AI 基础设施，支持 EOS 和开放 NOS，并获得 Meta、Microsoft、Oracle 的客户背书。Cisco 竞争方式略有不同，强调 Silicon One
              作为统一架构，并把 AI 网络叙事连到光融合，以及链路层重试、拥塞控制等 Ultra Ethernet 式机制。HPE Juniper 现在把该品类纳入更宽的 AI Data Center Solution
              攻势；这意味着 Nextop 面对的可能不只是一个交换机厂商，而是带 Juniper 交换和 AIOps 的计算、存储、网络打包方案。横向看这些玩家，和 Nextop 的重叠很明显：它们现在都把以太网营销成可信的
