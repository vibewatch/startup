  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入口径与架构层
        blocks:
          - type: paragraph
            body: >-
              Nexthop 的正确市场边界是 AI 数据中心网络，而不是整个 AI 基础设施热潮。公司官方材料一直描述四个网络层：scale-up、scale-out、scale-across 和
              front-end，并把它们与交换机、网络操作系统、光模块和线缆验证绑定。这个边界很重要，因为 AI 生态里许多巨大的公开数字，其实指向 GPU、建筑、电力基础设施或租户配套建设，而不是网络这个切片本身。UEC
              和 OCP 资料进一步说明，网络内部正在拆成不同技术子市场：scale-up 服务紧耦合加速器域，scale-out 服务集群 fabric，scale-across 服务跨数据中心
              fabric，front-end 网络服务用户、存储和互联网接入。训练和推理也把架构拉向不同方向。McKinsey 和 JLL
              显示，训练更偏向远离都市、供电充足的园区，推理则推向靠近都市圈、低延迟的部署。尽调上，Nexthop 的实际切入口是以太网交换与互连层，位于加速计算和数据中心其余技术栈之间。
