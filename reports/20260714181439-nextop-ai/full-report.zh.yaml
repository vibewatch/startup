      - number: '2.2'
        title: 规模测算视角，以及为什么估计会分叉
        blocks:
          - type: paragraph
            body: >-
              规模证据方向一致，但撑不起一个唯一标准 TAM。Nexthop 自己的发布材料引用约 $35B 的交换市场，Series B 材料则引用 SemiAnalysis 对 2031 年 $100B AI
              数据中心网络市场的判断。公司新闻中心后来强调 650 Group 的观点：数据中心网络到 2032 年可能达到 $200B。Dell’Oro 又给出另一种视角，预计五年内交换机销售约 $80B；JLL
              把背景进一步放宽，称 2026 至 2030 年租户可能在 IT 配套上投入 $1T 到 $2T。这些数字与其说矛盾，不如说口径不同：有的只算交换机，有的算更宽的 AI
              网络，有的几乎把整个计算配套预算都算进去。因此，本章应把精确规模当作有边界的区间，不应假装一个巨大的单一数字可以干净映射到 Nextop 的近期可服务机会。
