      - number: '2.4'
        title: 增长驱动、以太网顺风与市场约束
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动很容易看清。AI 集群扩张很快；以太网已经打开一条进入原先由 InfiniBand 主导负载的可信路径；800G 已在 AI fabric 中进入主流；1.6T 和共封装光学也在进入 2026
              年部署窗口。Cisco、UEC、TrendForce 和 Electronic Design 都把链路层重试、基于 credit 的流控、packet spraying 等 Ultra Ethernet
              创新描述为弥合以太网与 InfiniBand 历史可靠性差距的尝试，同时保留以太网更宽生态的优势。但约束同样实质。JLL 和 Bessemer 都强调电力才是真正瓶颈，电网等待以年计；Dell’Oro
              则强调芯片和内存供应短缺。Futurum 又提出资本纪律问题：即便超大规模云厂商计划资本开支约 $660B 到 $690B，投资人仍要问，基础设施支出能否转化成持久回报。最后，InfiniBand
              在最苛刻的训练环境里仍保有优势，所以以太网份额提升并不会消灭专有 fabric 由性能驱动的利基市场。
