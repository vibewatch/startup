    summary: 最大上行杠杆是经审计的商业证据；最大下行杠杆，是确认当前集中度和毛利率不透明比预期更糟。
    approximationNotes: 条形展示围绕已披露约 $4.2B 估值标记的方向性估值变化，单位为十亿美元；各项不可相加。
