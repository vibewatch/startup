      - number: '7.3'
        title: 依赖与集中风险：超大规模云厂商、商用芯片和开放生态
        blocks:
          - type: paragraph
            body: >
              Nextop 的商业上行空间和依赖栈绑在一起。公司公开瞄准全球最大云运营商，并告诉投资人，急需高度定制 AI 网络技术的超大规模云厂商只有少数。机会可能变得巨大，根源在此；集中风险很可能极端，根源也在此。
              客户章节只找到一个具名的运营商相邻验证（Dave Maltz 代表 Microsoft Azure Networking），以及两个匿名群体
              （领先超大规模云厂商、NeoClouds）。如果少数设计定点撑起大部分收入模型，爬坡延迟、路线图滑坡或失去一个
              锚定账户，都可能对订单额和估值造成超额影响。供应商集中进一步放大风险。产品族围绕商用芯片和深度集成工作 构建，开放 NOS 战略依赖外部软件社区，尤其是
              SONiC。参与社区是优势，也是依赖：路线图分叉、上游质量回退， 或运营商在 SONiC、FBOSS 与内部 fork 之间偏好变化，都会抬高 Nextop 的支持负担。全球出口管制规则又叠加
              一层依赖，因为客户地域和所有权同样重要，不只是目的国。最后，投资人本身在这个阶段也成了隐性依赖： 完成 $500M Series B 后，市场对执行、产品宽度和证据密度的期待都很高；如果前几个旗舰项目爬坡不顺，
              未来融资会更不宽容。
