  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局、直接对手与替代路径
        blocks:
          - type: paragraph
            body: >-
              Nextop 的竞争格局比简单的创业公司对创业公司更宽。直接对手包括 Arista、Cisco、HPE Juniper，以及 NVIDIA Spectrum 等 AI 以太网 fabric
              厂商。既有替代路径仍包括 NVIDIA InfiniBand；在对性能敏感的训练环境里，它仍是严肃选项。再往下是由 Broadcom 和 Marvell
              领头的商用交换芯片层。这些公司不总是销售带品牌的成品系统，但决定了 OEM、ODM 和超大规模云厂商内部硬件团队能做出什么。最后，对最成熟买方来说，现状路径是内部自建：超大规模云厂商可以把商用交换芯片与
              SONiC 或其他开放 NOS 配起来，用内部系统工程替代从 Nextop 购买成品 fabric。这很关键，因为 Nextop
              不只是在替换有品牌的交换机既有厂商；它还要说服买方，外部共同开发伙伴比自己做同样的以太网 fabric 更好。公司官方材料解释了它为什么认为自己能竞争：定制加现货系统，支持 SONiC、FBOSS 和
              BYoNOS，验证光模块和线缆，并明确聚焦超大规模云厂商与 NeoCloud，而不是泛企业账户。
