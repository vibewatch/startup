      - number: '5.4'
        title: 信任、质量、安全，以及公开记录没有证明的事
        blocks:
          - type: paragraph
            body: >-
              这是本章最大的技术警示。公开证据在架构、开放网络匹配和产品范围上很强，但在企业和超大规模云厂商尽调团队最终会要求的信任证明项上很弱。SONiC
              生态本身发布了社区流程、架构、测试和安全流程页，为开放软件栈提供了有用背景。但至少在本次审阅语料中，Nextop 自己的公开材料没有展示专门的信任中心、状态页、安全白皮书、公开 SLA、基准测试方法、MTBF
              数字、SOC 2 或 ISO 认证声明，或详细漏洞披露流程。缺席不证明内部控制薄弱，但会显著限制外部核验。对一家把自己定位于关键 AI fabric
              基础设施的公司来说，可靠性和安全证明与拓扑图一样重要。在这些证明面公开之前，投资人应把产品可信度和运营保障当作相互关联但彼此独立的判断。
