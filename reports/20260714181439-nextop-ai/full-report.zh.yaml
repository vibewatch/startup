      - number: '2.3'
        title: 买方分层、使用者与采用路径
        blocks:
          - type: paragraph
            body: >-
              最重要的买方是超大规模云厂商，其次是 NeoCloud 运营商。Nexthop 官方页面反复瞄准这些群体，而不是传统企业账户；McKinsey 预计超大规模云厂商将控制约 70%
              的美国预测容量。使用者是负责集群设计、网络运营和平台可靠性的工程团队；付款方则在基础设施和容量规划组织里，优化部署速度、电力、延迟和硬件可得性。Network World 的买方指南强调，在 AI
              工厂规模下，赢家不是孤立地拼速度，而是同时解决遥测、路由、无损传输和管理简化。OCP ESUN 和 Network DNA
              也显示，网络选择现在比通用云网络更紧密地跟着计算拓扑走。因此，采用路径比经典企业交换更长、更技术化：设计协作、fabric
              验证、软件栈集成、光模块验证、集群基准测试签核，然后才是更广部署。这有利于能共同开发的厂商，而不是只会发货盒子的厂商。
