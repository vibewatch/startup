  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险：出口管制、隐私义务与开源暴露
        blocks:
          - type: paragraph
            body: >
              最具体的外部监管风险是出口管制。Nextop 面向超大规模云厂商、NeoClouds 和全球 AI 数据中心建设， 公司因此直接进入 BIS 现在视为战略敏感的生态。BIS 指引称，先进计算物项出口给总部位于
              Country Group D:5 或 Macau 的实体需要许可证，即便该实体不在这些辖区内；BIS 更广的 AI diffusion
              框架也显示，先进芯片、模型权重和大型数据中心集群都可能落入地域上限、最终用途限制和合规日志要求。 Morrison Foerster、JD Supra 和 Gibson Dunn
              的法律提示都指向同一点：执法正在从芯片制造商扩展到 数据中心运营商、服务提供商和基础设施中介。落到 Nextop 身上，全球客户资格审查、KYC、合同审计权和
              路由可视性，可能从后台细节变成销售周期阻力。第二层法律风险来自公司 2026 年 4 月的隐私政策， 该政策明确涵盖 cookies、分析、广告合作伙伴、服务提供商，以及向执法机关和其他第三方披露。正常网站
              运营都会写这类条款，但这也意味着 Nextop 已经围绕隐私和安全作出公开法律承诺，却没有配套的公开信任中心、认证目录或 独立条款页，帮助企业买方评估控制环境。第三，公司的开放 NOS
              战略——SONiC、FBOSS、加固 NOS 发行版， 以及对 SONiC 生态的高贡献——是商业资产，也带来典型的软件和硬件 IP 风险：许可证合规、集成缺陷和 第三方代码责任。
