        blocks:
          - type: paragraph
            body: >
              Nextop 给投资人和潜在客户提供了一些企业级支持成熟度证据，但几乎没有公开证据证明实际客户耐久性。Support Hub 披露在线工单管理、工单管理
              API、软件发布、软件生命周期指引、产品公告、最长一年的硬件保修、返厂服务，以及从战略仓库发出的下一工作日更换。这些承诺对一家年轻硬件厂商很有分量，也暗示管理层预期会服务停机成本很高的生产环境。但公开记录没有披露
              NRR、GRR、流失率、续费率、合同期限、在手订单、平均售价或头部客户集中度。评价界面也很薄：PeerSpot 称尚未收集到 Nexthop AI 评价；G2 页面邀请首批评价；SourceForge 显示一个
