      - number: '8.2'
        title: 论点与反论点：战略稀缺对照证据稀缺
        blocks:
          - type: paragraph
            body: >
              看多论点建立在战略稀缺上。AI 集群需要的网络架构必须同时处理电力密度、拥塞、光模块和部署速度， 能交付到这个水平的供应商不多。Nextop 的类定制 JDM 模式、商用芯片能力、SONiC / FBOSS
              开放性， 以及创始人触达超大规模云工程组织的能力，让公司有可能赢下少数但价值极高的设计定点。投资人显然在为这种 可能性买单：Lightspeed 设想公司可达 $100B+ 规模，a16z
              认为网络瓶颈重新开放争夺，第三方报道也把 AI 网络视为 基础设施栈的新控制点。反论点同样清楚：公开证据远未达到 $4.2B 估值隐含的水平。公司没有披露收入指标， 没有公开
              backlog，没有具名超大规模云生产客户，没有公开留存指标，也没有公开集中度明细。最强的具名外部 证据仍是 2026 年 3 月产品公告中嵌入的一段 Microsoft Azure Networking
              引述。该引述足以确认相关性， 但不足以确认多元化规模。因此，反论点不是市场看错了 AI 网络，而是当前公开证据没有显示 Nextop 实际控制了 这个市场的多大份额。
