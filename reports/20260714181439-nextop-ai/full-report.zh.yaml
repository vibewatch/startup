      - number: '7.2'
        title: 运营、质量与安全风险：AI 集群规模下的定制硬件
        blocks:
          - type: paragraph
            body: >
              运营上，Nextop 走的是基础设施里最难的一类产品路径：把定制和半定制交换系统交付进 AI 集群， 同时要顶住电力、散热、光模块、缓冲、遥测和部署速度。公开产品界面显示，4000、4200 和 5000
              系列直接依赖高端 Broadcom 芯片；2026 年 3 月发布还引用 Broadcom 对其低功耗交换芯片集成的认可。 Nextop 因此接入一流商用芯片路线图，也继承这类依赖带来的时点、分配、验证和 ASP
              压力。 可靠性透明度仍薄：公司提供软件版本、生命周期内容、公告、下一个工作日更换和返厂维修，却没有披露 MTBF、 RMA
              率、召回历史、安全事件记录、正常运行时间统计或现场故障指标。支持组织存在是正面信号，但也承认 硬件故障、补丁节奏和全球物流对商业模式很关键。安全透明度也不足。Support Hub 提到安全最佳实践和公告，
              隐私政策承诺合理的管理、技术和组织保障，但本章没有找到公开 SOC 2 报告、ISO 27001 认证、信任中心、 漏洞赏金、事件报告页或产品安全架构材料。公司争取的是顶级云运营商，这种公开姿态缺口值得注意。
            claimRefs:
              - CR010
