        title: 来自品类的成本结构代理指标，以及为什么硬件经济性重要
        blocks:
          - type: paragraph
            body: >-
              判断成本结构最清楚的办法，是从公开网络同业三角校准，而不是假装 Nextop 披露了自己的数字。公司围绕商用交换芯片和开放网络生态构建 AI
              网络硬件，这意味着成本桶包括交换芯片、光模块、内存、板卡、组装、验证、备件、客户工程和现场支持。公开可比公司显示，经济性跨度可以很大。HPE 2025 财年 Q4 业绩显示，整体 GAAP 毛利率为
              33.5%，non-GAAP 毛利率为 36.4%，网络分部经营利润率为 23%。Broadcom 年报和业绩材料显示的盈利能力高得多，但那包含不同组合和比新兴系统创业公司更大的规模。Marvell
              年报和业绩页面强调了一家商用交换芯片供应商的公开披露节奏及其对产品周期的依赖；Cisco、NVIDIA 和 Arista 则都提供 Nextop 不具备的年报级透明度。结论不是 Nextop
              应该映射到某一家同业利润率，而是 AI 网络经济性高度依赖组合；硬件创业公司若想获得接近成熟公司的利润率，就必须非常仔细地控制 BOM、营运资本和软件附加。
