    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与产品边界
        blocks:
          - type: paragraph
            body: >-
              Nexthop AI 把自己定位成 AI 数据中心的专用网络供应商，而不是通用企业网络厂商。官网、发布材料和平台页反复把锚点放在全球最大云运营商，放在 SONiC、FBOSS
              等开放网络操作系统，也放在现货与定制交换系统的组合上。这个定位很关键：Nexthop
              更像一家以太网基础设施公司，试图吃下商用交换芯片、光互连和超大规模云厂商部署流程之间那层难做的环节，而不是一个软件抽象层。公司当前官方足迹显示总部在 Santa Clara，另在
              Seattle、Vancouver、Dublin 和 Bengaluru 设有地点。产品材料已经展示出很宽的范围：scale-out、scale-up、scale-across、front-end
              网络，以及光模块和线缆。即便只看概览，核心商业叙事也很清楚：Nexthop 想成为共同开发伙伴，帮助超大规模云厂商和 NeoCloud 更快部署 AI fabric，并比传统做法更省电。
