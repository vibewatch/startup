      - number: '8.3'
        title: 情景框架：当前估值对证据失望的容错有限
        blocks:
          - type: paragraph
            body: >
              因为公司没有披露收入或利润率数据，情景分析只能是定性的，但仍可以分析。悲观情景很直接： 客户爬坡慢于投资人预期，一两个锚定项目占业务比重过高，出口或供应链摩擦拖慢全球铺开，公开证据缺口
              延续到下一轮融资或流动性窗口。在这种情况下，私募市场把估值重置到较低战略溢价水平是合理可能。基准情景 更微妙：Nextop 是真实公司，有战略相关性，也许确实应该比典型早期硬件公司享有显著溢价；但在私下尽调证明
              收入、backlog、利润率和集中度之前，这个溢价大致只能支撑当前估值。乐观情景需要的不只是品类兴奋。 它需要具名客户扩宽、复购证据、干净的支持和可靠性表现，以及足够披露的经济性，证明定制 AI 网络项目可以
              变成可规模化业务，而不是一组昂贵工程项目。换句话说，上行空间可以很大，但已披露估值已经反映了其中相当一部分。
