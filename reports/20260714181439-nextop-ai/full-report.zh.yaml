      - number: '5.3'
        title: 部署流程、发布成熟度与关键依赖
        blocks:
          - type: paragraph
            body: >-
              公开语料暗示的技术流程很重。买方首先选择 AI fabric 拓扑和网络层范围，再对齐 NOS 偏好，然后验证硬件、光模块和线缆；只有这些完成后，才能开始更广部署和支持。Cisco 的 scale-across
              讨论和 Broadcom 的 scale-up 以太网规格，解释了这件事为什么重要：AI fabric 越来越依赖芯片、系统、光模块、缓冲和拥塞管理能力之间的紧密协同。Marvell 的 Teralynx
              材料又提供一条线索，它强调低延迟、遥测、DCB、RoCE 和可编程性——这些正是 Nextop 这类集成商需要可靠暴露出来的能力。路线图证据不错，但仍不完整。公开里程碑显示，2025 年发布、2025 年
              SONiC 治理层级提升、2026 年 3 月具名交换机发布，以及持续存在的软件发布入口。缺失的是更深的发布节奏、bug
              修复实践、硬件验证广度和生产部署数量证明。因此，技术成熟度在架构和产品意图上方向性很强，但在可重复运营证明上只得到部分验证。
