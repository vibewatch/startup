  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层：超大规模云厂商优先，NeoCloud 第二，广义企业尚未证实
        blocks:
          - type: paragraph
            body: >
              Nextop AI 的公开定位窄而一致，瞄准最大型云和 AI 基础设施运营商，而不是广义企业市场。官网称公司在为“全球最大云运营商构建最高效的 AI 基础设施”；2025 年 3
              月发布稿称，公司为超大规模云厂商构建定制网络解决方案，并把它们整合进客户优化后的云栈；2026 年 3 月产品发布又称，同一批平台可以运行超大规模云厂商偏好的 SONiC 或 FBOSS 镜像，也可以作为面向
              NeoCloud 的交钥匙 Nexthop-NOS 产品交付。这给本章一个清晰的分层镜头：（1）超大规模云厂商采购定制化 JDM 式硬件、光模块和软件集成；（2）NeoCloud
              运营商采购更成套的交钥匙系统；（3）开放网络云运营商评估交换机，因为它们需要 SONiC 或 FBOSS 兼容性以及深度客户工程支持。明显缺席的是：没有任何公开证据显示 Nextop
              正在有意义地卖给主流企业、电信、园区或 SMB 客群。人员配置也强化了这一分层：公司公开列出客户工程 VP 和客户工程 AVP；Support Hub 暴露工单
              API、硬件更换、生命周期通知和全球分布式支持覆盖。这是一个预期销售周期漫长、技术性强、导入设计很重，并服务少数成熟买方的供应商画像；不是拥有数千个轻支持账户的自助式软件业务。
