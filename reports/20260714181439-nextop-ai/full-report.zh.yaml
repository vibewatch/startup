  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、变现机制与真正公开的信息
        blocks:
          - type: paragraph
            body: >-
              最站得住的公开判断是，Nextop 靠硬件系统、软件集成和工程服务的组合变现，而不是纯软件订阅。官方页面描述 scale-up、scale-out、scale-across 和 front-end
              交换平台；发布与 Series B 材料则强调面向超大规模云厂商的 JDM 式工作，以及面向 NeoCloud 的交钥匙产品。软件发布页和反复出现的开放 NOS
              语言，暗示还有软件和支持层，但公开证据看不到独立软件定价、许可条款或维护附加率。这很关键，因为网络创业公司的财务面貌，会因收入来自产品 ASP、一次性工程服务、支持合同还是经常性软件而完全不同。公开语料足以说明
              Nextop 不是简单卖盒子的公司，也不是典型 SaaS 公司；但它不足以揭示当前收入组合、收入确认政策，或初始设计赢单之后商业模式有多少是经常性。
