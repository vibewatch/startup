      - number: '8.4'
        title: 什么会改变判断：私有指标、更好价格，或两者都有
        blocks:
          - type: paragraph
            body: >
              建议有两条上调路径：价格改善，或证据改善。证据改善的概率更高。最关键的最终尽调包很具体： 季度收入和 backlog、毛利率和保修准备金、头部客户集中度、Microsoft 相关运营商验证之外的客户可背书性、
              出口合规成熟度，以及管理层对下一代产品爬坡的信心。如果上述数据点强，那么即便没有广泛公开披露，溢价估值 也能成立，因为公司会更像经典的超大规模云供应商业务——少数设计定点可以支撑超额企业价值。如果数据弱，
              当前估值就显得拉伸。价格改善是另一条路径：当许多核心输入仍是私有信息时，再高质量的公司，如果价格太高， 也可能不是好投资。投委会式结论因此很简单：不要否定这家公司；要否定的是，仅靠公开证据就足以支持以 $4.2B
              激进入场的想法。
