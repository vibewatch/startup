      - number: '3.4'
        title: 护城河耐久性、开放标准顺风与反向竞争视角
        blocks:
          - type: paragraph
            body: >-
              支持 Nextop 的最强论点是，开放以太网动能降低了买方继续被单一既有厂商栈锁住的意愿。Cisco 的 Ultra Ethernet 叙事、Marvell 的 SONiC 语言、Broadcom 对
              scale-up 以太网规格的引用，以及 Arista 对开放 NOS 的支持，都说明 AI 网络正不再那么信奉专有栈。这能帮助 Nextop
              拿到会。但反向解读同样重要：如果开放标准对所有人都在改善，差异化可能收窄，而不是扩大。客户可能会认定，拥有全球支持、更大资产负债表容量、已验证供给获取能力，并且同样沿标准路线图前进的既有厂商 更安全。HPE
              Juniper 可以把网络打包进 AI 工厂销售；NVIDIA 可以把网络绑到 GPU、DPU 和光子学；Arista 可以把高密度以太网与已知运营模型结合；商用交换芯片生态也能支持内部自建。因此，Nextop
              的护城河大概更少取决于协议新意，更多取决于执行速度、设计赢单转化、供应链可靠性，以及作为灵活共同开发伙伴的价值。这些护城河都合理，但公开证据仍未证明它们在生产客户里有多耐久。
