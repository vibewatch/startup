  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：继续研究 / 按当前估值跟踪
        blocks:
          - type: paragraph
            body: >
              这桩投资案例容易让人欣赏，却很难定价。正面看，Nextop 针对 AI 基础设施里的真实瓶颈，创始人拥有少见的 超大规模云可信度；公司在退出隐身不到一年后就拿到罕见的 $500M Series B，估值约
              $4.2B。官方和投资人来源 在核心论点上是一致的：云规模 AI 网络变化很快，既有厂商不是为 all-to-all GPU 流量设计的，运营商想要比
              传统机箱中心厂商更多的定制、更低功耗和更开放的软件控制。负面看，公开记录仍缺少支撑价格敏感建议的数据：
              收入、backlog、毛利率、burn、客户集中度、留存，以及具名生产客户宽度。在这个估值上，投资人今天买的是
              可能成为品类领先战略位置的未来，而不是已经公开证明的经营基础。这不说明公司质量低；问题在于当前基于公开 信息作出投资判断时证据不足。因此，公开数据下的正确建议是继续研究 / 跟踪，置信度中等，风险评级高。
