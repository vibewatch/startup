              中心拓扑和控制特性的支持。这意味着，拼出有竞争力的以太网 AI fabric 所需底层技术要素，越来越不被某一个品牌 OEM 独占。对买方来说，菜单变宽了：买 NVIDIA、Arista、Cisco 或 HPE
              Juniper；买 Nextop；或者用商用交换芯片加开放软件，由内部团队或 ODM
