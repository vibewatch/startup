        blocks:
          - type: paragraph
            body: >-
              Nextop 的 GTM 天生工程重、账户集中。公司瞄准超大规模云厂商和 NeoCloud，而不是 SMB
              或广义企业渠道；外部报道反复描述定制构建、共同开发，以及充当云运营商工程团队的延伸。这几乎必然意味着漫长的验证周期、昂贵的客户工程，以及少数账户模型；一个或两个生产爬坡就可能带来不成比例的影响。公开数据也显示服务成本不低：about
              页面列出硬件、软件、客户工程、财务和供应链负责人，招聘页与发布报道则显示全球招聘，且早在 2025 年 3 月就约有 100 名员工。缺失的是能把叙事变成投资判断
              的指标：CAC、回本周期、在手订单转化、支持续费率、软件附加率、分产品线毛利率和出货量。单位指标缺失不是装饰性缺口；它意味着投资人还无法判断 Nextop
              会更像高毛利控制平面厂商，还是更像低毛利硬件与服务集成商。
