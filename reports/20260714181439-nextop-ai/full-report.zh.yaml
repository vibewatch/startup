companyProfile:
  summary: >-
    Nextop AI 是一家总部位于 Santa Clara 的非上市 AI 网络基础设施公司，2024 年由前 Arista COO Anshul Sadana 创立。公司向构建大型 AI 集群的超大规模云厂商和 NeoCloud
    运营商销售定制与现货以太网交换系统、加固版网络操作系统，以及验证过的互连方案；产品叙事围绕 scale-up、scale-out、scale-across、front-end 网络，并支持 SONiC、FBOSS 等开放
    NOS。对一家年轻硬件创业公司来说，公开融资证据异常强：2025 年 3 月启动轮 $110M，2026 年 3 月供不应求的 $500M Series B，估值
    $4.2B。但公开客户与财务披露仍很薄，运营底座远没有估值标题那么扎实。
