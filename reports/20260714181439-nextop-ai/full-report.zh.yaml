      - number: '5.2'
        title: 架构、开放网络依赖，以及技术栈可能如何运作
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Nextop 的架构有意走解耦路线。公司称支持 SONiC、FBOSS 和 BYoNOS；软件发布页暗示有主动生命周期管理；官方发布材料把系统连到超大规模云厂商的控制偏好，而不是封闭专有
              NOS。周边生态资料解释了这在技术上意味着什么。SONiC 项目把自己描述为模块化、基于容器的开放 NOS，可运行在多个交换机厂商和 ASIC 上；sonic-buildimage 仓库则展示了为
              Broadcom、Marvell-Teralynx、Mellanox、NVIDIA BlueField 等平台构建镜像的实际复杂度。FBOSS 也通过 agent daemon、Thrift API、JSON
              配置，以及覆盖 packet、fabric、LLDP、状态处理的大型代码树，暴露了交换软件集成的深度。合在一起，这些信号支持一个清晰的架构推断：Nextop
              的差异化可能不在秘密控制平面，而在把商用交换芯片硬件、开放 NOS 选择、光学验证和部署流程集成成面向云的以太网 fabric。这让架构显得可信，但也意味着公司深度依赖它无法完全控制的外部生态。
