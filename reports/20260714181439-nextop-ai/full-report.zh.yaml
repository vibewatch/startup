        blocks:
          - type: paragraph
            body: >
              公开采用证据存在，但定性多于定量。最强运营信号来自 Nextop 2026 年 3 月产品公告；公司官网和 Business Wire
              都重复称，公司平台和软件解决方案“已经向领先超大规模云厂商出货”。Network World 2025 年 3 月访谈提供了更多细节：Anshul Sadana
              表示公司正直接与超大规模云厂商客户并肩工作，帮助它们把产品开发周期压缩 6 到 12 个月，并探索比内部团队能处理的更多设计备选。2025 年发布稿同样称，Nextop
              作为云公司工程团队的延伸来工作。这些都是有意义的指标，说明 Nextop
              不只是产品前或纯愿景阶段。与此同时，没有任何公开来源披露客户数量、部署数量、按账户口径的已订收入、胜率、续费率，甚至没有披露已出货运营商的具名名单。因此，公开记录支持真实
              设计赢单和早期出货这一论点，但不支持分散采用这一论点。支持界面部分弥合了这个缺口：Support Hub
              展示出正式售后运营模型，包括门户、API、软件生命周期、下一工作日硬件更换和全球接力式覆盖，这与服务大型生产客户相一致。但这些支持投入证明的是准备度，不是续费或广度。
