        blocks:
          - type: paragraph
            body: >
              具名客户证明记录明显比融资叙事薄。本章研究只找到一个清楚具名、与运营商相关的验证来源：Dave Maltz；Nextop 材料和 Microsoft 自有网站都把他识别为 Azure Networking
              的工程负责人。他在 2026 年 3 月产品发布中公开赞扬 Nextop 对开放网络的贡献、在 Disaggregated Spine
              概念上的工作，以及其“对客户成功坚定不移的投入”。这条引述很重要，因为它把一位具名 Microsoft 高管和 Nextop 当前公告连在一起；但它仍没有说 Microsoft
              已下生产采购单，或部署了某个具体数量的 Nextop 设备。Microsoft 之外，公开证明收缩成两个匿名群体：Nextop 称其已经向“领先超大规模云厂商”出货；又称为“NeoClouds”提供围绕
              Nexthop NOS 构建的加固交钥匙系统。2026 年 3 月融资新闻稿补充说，深度客户伙伴关系推动了面向最大运营商的高度定制 JDM 方案，以及面向 NeoCloud
              的交钥匙产品，进一步说明这些并非假想客群。但没有公开案例研究具名某一家超大规模云厂商或
              NeoCloud，没有引用采购记录，第三方评价平台也看不到有意义的用户量。换句话说，公开客户证明真实到足以确立市场进展，但太稀疏，无法显示广度、分散度或耐久性。
