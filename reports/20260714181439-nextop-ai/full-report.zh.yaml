      - number: '1.3'
        title: 融资历史、估值跃升与披露边界
        blocks:
          - type: paragraph
            body: >-
              对一家非上市基础设施公司来说，公开资本故事异常清楚。Nexthop 于 2025-03-25 脱离隐身状态发布，拿到 $110M，由 Lightspeed 领投，财团包括 Kleiner
              Perkins、WestBridge Capital、Battery Ventures 和 Emergent Ventures。不到一年后，公司又宣布 $500M 超额认购 Series B，估值
              $4.2B，Lightspeed 再次领投，Andreessen Horowitz 与 Altimeter 加入。简单相加，已披露融资约
              $610M。这种融资速度是优势，因为面向超大规模云厂商的网络硬件设计、验证和制造都很烧钱。它也是风险，因为估值上调发生在公司披露收入、ARR、毛利率或客户数量之前。投资人论点
              和官方新闻稿都描述了很大的机会，但概览证据仍更多靠顶级投资人信念和市场叙事支撑估值信心，而不是透明经营指标。
