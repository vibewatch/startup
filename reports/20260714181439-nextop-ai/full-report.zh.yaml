      - number: '7.4'
        title: 财务与执行风险：资本密集、利润率不确定和关键人暴露
        blocks:
          - type: paragraph
            body: >
              财务模型风险仍大，因为 Nextop 资金充足，却异常不透明。公司已融资约 $610M，报道估值约 ~$4.2B，
              短期融资风险因此下降；但公开来源没有披露收入、backlog、毛利率、burn、库存、应收账款、合同期限或 营运资本周转。这一点尤其重要，因为公开可比公司显示，网络硬件经济性由供应链纪律、毛利率管理和快速
              产品周期执行共同驱动。类定制 JDM 模式可能提高超大规模云客户的战略价值，但也会拉长认证周期、增加工程开支； 当客户要求定制硬件、验证或光模块组合时，还会制造棘手的利润率取舍。执行风险也同样集中在人身上。
              投资人材料反复把 Anshul Sadana 的运营商关系和 Arista 经历写成公司成立的核心原因；如果失去他，或硬件、 软件、供应链、客户工程团队出现人员流失，销售可信度和项目交付都会变弱。Santa
              Clara、Seattle、Vancouver、 Dublin 和 Bengaluru 的公开办公版图帮助公司获取人才，但也给一家仍年轻的公司增加协同负担；公司还要同时同步 芯片选择、软件发布、RMA
              流程和全球客户部署。
