      - number: '7.5'
        title: 缓释措施、监控指标与推翻论点的触发器
        blocks:
          - type: paragraph
            body: >
              Nextop 的缓释不是从零开始。公司拥有可观资本、已发布的隐私政策、可见的支持中心、软件发布界面、 SONiC
              治理参与，以及偏客户工程的组织架构。上述都是实打实的基础模块，可以支撑机构级基础设施供应商。但它们仍是 脚手架，还不是公司能跨产品代际和买方批次反复执行的证据。投资人应问的不是这些风险能不能消除，而是能不能
              监控。最重要的领先指标很直接：新增具名客户、出口合规成熟度、摆脱一两个锚定运营商的多元化证据、毛利率或 backlog 披露、现场质量指标，以及核心技术领导梯队的连续性。反过来，少数推翻论点的事件会大幅削弱故事：
              失去锚定超大规模云项目或项目重大延迟、出现公开出口管制执法问题、融到 $500M 后仍无法展示利润率或
              backlog、芯片路线图明显滑坡，或现场可靠性问题把支持组织从护城河变成成本中心。今天的公开记录足以识别这些 绊线，但不足以排除它们。
