  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: benchmark-and-reliability-proof
    missingEvidence: Public benchmarks, latency methodology, MTBF data, failure rates, and customer-reported reliability outcomes for named systems.
    whyItMatters: Product credibility in critical AI fabrics depends on repeatable operating proof, not only on architectural positioning.
    diligencePath: Request benchmark deck, lab methodology, failure logs, and reference-account post-deployment metrics by SKU.
    relatedQuestionRefs: [QE020, QE024, QE025]
    relatedTableRefs: [TE001, TE004]
  - type: private-evidence-only
    severity: material
    topic: trust-and-compliance-surface
    missingEvidence: Company-specific security process, status page, trust center, certifications, support SLAs, and incident-disclosure posture.
    whyItMatters: Large cloud and enterprise buyers require public or private assurance artifacts before entrusting critical network layers.
    diligencePath: Request security whitepaper, vulnerability-disclosure policy, certification list, SLA templates, and customer-facing trust materials.
    relatedQuestionRefs: [QE018, QE019, QE021]
    relatedTableRefs: [TE004]
  - type: private-evidence-only
    severity: material
    topic: sku-level-specification-depth
    missingEvidence: Full per-SKU specifications, port counts, ASIC lineage, availability windows, and software-support matrix for NH-4010, NH-4220, and NH-5010.
    whyItMatters: Without detailed specs, buyers and investors cannot compare maturity or economics of the named systems against incumbents.
    diligencePath: Request product briefs, price books, release notes, and hardware qualification matrix by SKU.
    relatedQuestionRefs: [QE002, QE014]
    relatedTableRefs: [TE001, TE005]
  - type: private-evidence-only
    severity: minor
    topic: release-cadence-proof
    missingEvidence: Version history depth, bug-fix cadence, support case metrics, and lifecycle roadmap beyond the existence of a software-releases page.
    whyItMatters: Ongoing software and support quality can materially affect deployment friction and renewal economics.
    diligencePath: Request release-note archive, support KPI dashboard, and lifecycle policy documentation.
    relatedQuestionRefs: [QE004, QE017]
    relatedTableRefs: [TE005]
