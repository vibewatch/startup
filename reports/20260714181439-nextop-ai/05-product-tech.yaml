- id: deployment-roadmap-and-technical-dependencies
  title: Deployment workflow, release maturity, and critical dependencies
  body: 'The technical workflow implied by the public corpus is demanding. A buyer first chooses an AI-fabric topology and network layer scope, then aligns on NOS preference, then qualifies hardware, optics, and cables, and only after that can broader deployment and support begin. Cisco''s scale-across discussion and Broadcom''s scale-up Ethernet specification help frame why this matters: AI fabrics increasingly depend on tight coordination across silicon, systems, optics, buffers, and congestion-management features. Marvell''s Teralynx materials add another clue by emphasizing low latency, telemetry, DCB, RoCE, and programmability—exactly the kinds of capabilities that an integrator like Nextop would need to expose reliably. The roadmap evidence is good but still partial. Public milestones show a 2025 launch, a 2025 SONiC-governance step-up, a March 2026 named-switch launch, and an ongoing software-releases surface. What is missing is deeper proof on release cadence, bug-fix practice, hardware qualification breadth, and production deployment counts. Technical maturity therefore looks directionally strong on architecture and product intent, but only partially verified on repeatable operating proof.'
