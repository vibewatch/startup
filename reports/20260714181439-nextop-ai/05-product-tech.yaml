callouts:
- calloutType: strength
  title: The architecture aligns with how hyperscalers already operate open networking
  body: Support for SONiC, FBOSS, and BYoNOS is not cosmetic. It suggests Nextop is trying to fit into existing operator workflows instead of imposing a new proprietary control plane, which is a meaningful product-design advantage in hyperscale environments.
  claimRefs:
  - CE003
  - CE006
  - CE023
  - CE026
- calloutType: risk
  title: Open-ecosystem fit also means external dependency risk
  body: The same architectural openness that improves interoperability also increases dependence on merchant silicon, open-source NOS communities, and third-party optics or validation workflows. That can reduce control over cadence, differentiation, and support burden.
  claimRefs:
  - CE009
  - CE010
  - CE015
  - CE016
  - CE024
- calloutType: assumption
  title: Product credibility is ahead of public trust assurance
  body: The corpus is strong enough to support an architecture judgment and a product-scope judgment. It is not strong enough to support a full reliability, security, or compliance judgment because Nextop has not publicly exposed the trust surfaces large buyers usually expect.
  claimRefs:
  - CE020
  - CE021
  - CE032
  - CE034
