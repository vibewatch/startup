- id: sizing-lenses-and-range
  title: Sizing lenses and why estimates diverge
  body: The sizing evidence points in one direction but does not support a single canonical TAM. Nexthop’s own launch materials cited a roughly $35 billion switching market, while the Series B materials quoted SemiAnalysis on a $100 billion AI datacenter networking market by 2031. The company’s news hub later highlighted a 650 Group view that data center networking could reach $200 billion by 2032. Dell’Oro adds another lens, projecting roughly $80 billion of switch sales over five years, and JLL broadens the context further by saying tenants may spend $1 trillion to $2 trillion on IT fit-out across 2026 to 2030. Those numbers are not contradictory so much as they are measuring different things. Some count switches only, some count broader AI networking, and some count practically the whole compute fit-out budget. The market chapter should therefore treat precise sizing as a bounded range and avoid pretending that a single giant number cleanly maps to Nextop’s near-term serviceable opportunity.
