- id: growth-drivers-and-constraints
  title: Growth drivers, Ethernet tailwinds, and market constraints
  body: 'The strongest growth drivers are easy to identify. AI clusters are scaling fast, Ethernet has opened a credible path into workloads once dominated by InfiniBand, 800G is already mainstream in AI fabrics, and 1.6T plus co-packaged optics are moving into the 2026 deployment window. Cisco, UEC, TrendForce, and Electronic Design all frame Ultra Ethernet innovations such as link-layer retry, credit-based flow control, and packet spraying as attempts to close the historical reliability gap with InfiniBand while keeping Ethernet’s broader ecosystem advantage. But the constraints are equally material. JLL and Bessemer both emphasize power as the real bottleneck, with grid waits measured in years, while Dell’Oro highlights supply shortages in chips and memory. Futurum adds a capital-discipline question: even with roughly $660 billion to $690 billion of planned hyperscaler capex, investors still have to ask whether infrastructure spending will convert into durable returns. Finally, InfiniBand
    still keeps advantages in the most demanding training environments, so Ethernet’s share gains do not eliminate performance-driven niches for proprietary fabrics.'
