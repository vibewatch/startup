callouts:
- calloutType: insight
  title: The cleanest market wedge is AI-fabric Ethernet, not all AI infrastructure
  body: The best-supported opportunity sits at the switching and interconnect layer. Once the analysis expands into GPUs, real estate, or total fit-out spend, the numbers get much larger but stop being directly useful for underwriting Nextop’s addressable market.
  claimRefs:
  - CM001
  - CM003
  - CM012
  - CM038
- calloutType: risk
  title: Power and supply constraints can delay networking revenue even when demand is real
  body: Several sources agree that demand is not the only gating factor. Grid waits, construction inflation, and shortages in chips and memory can all postpone deployments even if buyers want more AI-fabric capacity immediately.
  claimRefs:
  - CM033
  - CM034
  - CM035
  - CM036
- calloutType: assumption
  title: Market estimates should be used as boundary markers, not as a single canonical TAM
  body: This chapter treats $35B, $80B over five years, $100B by 2031, and $200B by 2032 as different lenses on related but non-identical markets. Any valuation work that uses one of them should first restate exactly what is being counted.
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM038
