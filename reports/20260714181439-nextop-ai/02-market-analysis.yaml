tables:
- id: TM001
  title: Market definition table
  columns:
  - Layer / segment
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Relevance to Nextop
  rows:
  - - Scale-up networking
    - Rack- or pod-level interconnect logic, switching, lossless transport features
    - GPU silicon itself, package-level interconnect IP
    - Hyperscaler AI platform teams
    - Adjacent but increasingly relevant because Ethernet is moving into this layer
  - - Scale-out networking
    - Back-end cluster switches, NOS, telemetry, congestion control, optics
    - Servers, accelerators, applications
    - Hyperscalers, NeoClouds, sovereign AI operators
    - Core current wedge
  - - Scale-across networking
    - Inter-datacenter fabrics, DCI-oriented switching, encryption, long-reach optics
    - WAN transit outside the controlled cluster domain
    - Hyperscaler backbone and infra teams
    - Important expansion vector for multi-site AI clusters
  - - Front-end networking
    - Ingress / egress fabric linking AI clusters to users, storage, and the internet
    - Application software and end-user devices
    - Cloud service operators and platform teams
    - Secondary adjacency
  - - Broader AI infrastructure
    - Data center shells, generators, chillers, GPU servers, power delivery
    - Not networking spend
    - Real estate, energy, and compute procurement teams
    - Should be excluded from Nextop TAM claims
  notes: Boundary table separates AI networking spend from broader AI infrastructure so the chapter does not confuse switch opportunity with total data-center capex.
