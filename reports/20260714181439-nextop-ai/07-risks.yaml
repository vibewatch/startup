  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: export-compliance maturity
      missingEvidence: >
        No public export-compliance program, sanctioned-party screening workflow, customer-ownership review,
        or contractual audit-right framework was found for Nextop AI.
      whyItMatters: >
        BIS guidance and legal analyses show that advanced-computing infrastructure companies can face
        real enforcement exposure even when they are not the chip manufacturer of record.
      diligencePath: >
        Request the company's ECP, screening tools, restricted-party workflow, customer onboarding
        checklist, and legal escalation process for D:5-, Macau-, or China-linked entities.
      relatedTableRefs: [TR001, TR005]
      relatedQuestionRefs: [QR002, QR003, QR028, QR030]
    - type: private-evidence-only
      severity: blocking
      topic: concentration, backlog, and margin data
      missingEvidence: >
        No public top-customer schedule, backlog number, gross margin, revenue, burn, or working-capital
        data was found despite the company's large financing round.
      whyItMatters: >
        Without these metrics, the highest-probability downside path -- concentration plus delayed ramp --
        cannot be measured externally.
      diligencePath: >
        Request quarterly backlog, revenue, gross margin, burn, top-5 concentration, and pipeline by
        design-win stage.
      relatedTableRefs: [TR003, TR005, TR006]
