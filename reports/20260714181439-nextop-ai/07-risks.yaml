  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Anchor-customer concentration
        - Named customer and cohort disclosure
        - No additional named customer or quantified deployment proof within the next financing cycle
        - Treat concentration risk as thesis-central rather than temporary opacity
      - - Export-control exposure
        - Compliance-program maturity
        - No formal ECP, no ownership/KYC workflow, or any enforcement inquiry tied to restricted geographies
        - Escalate legal diligence and discount international-sales assumptions
      - - Merchant-silicon dependence
        - Roadmap and allocation continuity
        - Missed 1.6T / next-gen platform milestone or visible allocation constraint from core suppliers
        - Re-underwrite product timing and valuation multiple
      - - Quality and field reliability
        - RMA / incident / support metrics
        - Elevated RMAs, material security incident, or repeated replacement misses
        - Reframe support org from moat to liability; pause aggressive upside case
      - - Financial opacity after large funding
        - Management disclosure discipline
        - Continued absence of backlog, gross-margin, or burn disclosure after Series B scale-up
        - Increase evidence-quality discount and prefer track / research-more stance
      - - Leadership continuity
        - Senior leadership turnover
        - Departure of founder or multiple heads across hardware / software / customer engineering
        - Reassess execution probability and customer relationship durability immediately
    notes: >
      These triggers are intentionally binary enough to inform an investment committee, not just a product
      review meeting.
