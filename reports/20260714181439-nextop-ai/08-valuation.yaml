      - CV024
      - CV025

  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    enumerationScope:
      coverage: exhaustive
      basis: >
        Covers the public networking and AI-infrastructure comparables most useful for triangulating
        Nextop's current $4.2B private mark from public evidence: pure-play cloud networking, incumbent
        networking, merchant-silicon / AI-infrastructure suppliers, and adjacent AI-native infrastructure.
    rows:
      - - Arista Networks
        - Public cloud/data-center networking leader
        - ~$228.01B market cap (July 2026)
        - Best public pure-play comp for cloud networking credibility and strategic relevance
        - Far more mature, profitable, and diversified than Nextop; market cap alone does not imply entry value fairness
      - - Cisco Systems
        - Mature incumbent networking vendor
        - ~$459.65B market cap (July 2026)
        - Shows how large networking control points can become when product breadth and customer depth are proven
        - Enterprise and service-provider exposure make it a weak like-for-like comp for AI-native startup pricing
      - - Broadcom
        - Merchant-silicon and AI-infrastructure supplier
        - ~$1.862T market cap (July 2026)
        - Demonstrates how much value can accrue to bottleneck infrastructure layers in AI
        - Conglomerate mix, software exposure, and scale make it unsuitable as a direct startup multiple anchor
      - - NVIDIA
        - Dominant AI-infrastructure bottleneck owner
        - ~$5.129T market cap (July 2026)
        - Useful as a ceiling illustration for how strategically valuable AI bottlenecks can become
        - GPU and systems dominance is structurally different from Ethernet-switch startup economics
      - - Hewlett Packard Enterprise
        - Adjacent AI-networking and enterprise infrastructure vendor
        - ~$64.86B market cap (July 2026)
        - Provides a lower-scale adjacency comp with networking exposure and public operational disclosure
        - Broader enterprise mix and different margin structure limit direct relevance
      - - Juniper Networks
        - Pre-acquisition standalone networking vendor
        - Last known standalone market cap ~$13.35B (July 2025)
        - Useful as a floor-like reference for what a mature but less AI-central networking asset looked like before HPE acquisition
        - Not a live 2026 public trading comp and predates the current AI-networking frenzy
    notes: >
      This table intentionally uses market-cap status rather than forcing a false-precision multiple from
      incomplete private-company data. The public-comparable exercise is directional, not deterministic.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV024
      - CV041

  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Anchor-customer concentration proves extreme
        - Revenue materially concentrated in one or two programs with limited renewal visibility
        - Weakens diversification and makes a premium valuation hard to defend
        - Downgrade to pass unless price resets meaningfully
      - - No backlog / revenue / margin disclosure after Series B scale-up
        - Continued refusal or inability to provide basic operating metrics privately
        - Converts current opacity from temporary to structural
        - Hold at research-more or decline
      - - Export-control or compliance issue surfaces
        - Enforcement inquiry, blocked program, or inadequate ownership/KYC controls
        - Discounts international scale assumptions and raises governance risk
        - Require legal remediation before proceeding
      - - Merchant-silicon / roadmap slip
        - Delayed next-generation switch ramp or allocation constraint
        - Weakens product-timing edge versus incumbents
        - Re-underwrite bull and base cases downward
      - - Field reliability or support miss
        - Material RMA spike, public incident, or repeated replacement failure
        - Turns support organization into a liability, not a moat
        - Cut upside range and tighten diligence bar
      - - Senior leadership discontinuity
        - Founder or multiple key engineering/support leaders leave
        - Directly weakens the relationship-driven thesis
        - Reassess from first principles
    notes: Kill triggers focus on what most rapidly destroys the current premium narrative.
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031

  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue and backlog
        - Current revenue, booked backlog, and ramp by program
        - Most direct missing inputs for valuation support
        - CFO / finance diligence request
      - - Gross margin and warranty reserve
        - Product margin, support cost, warranty reserve, and RMA history
        - Determines whether the model can scale economically
        - Finance + operations diligence
      - - Customer concentration
        - Top-5 customer concentration, renewal status, and named references
        - Determines whether current valuation rests on broad proof or a few anchor wins
        - CEO / sales / investor diligence
      - - Export-compliance maturity
        - ECP, ownership screening, KYC, and audit-rights process
        - Determines whether global growth assumptions are legally durable
        - Legal / compliance diligence
      - - Security and reliability posture
        - Trust-center materials, certifications, incident history, support SLA attainment
        - Elite cloud customers often gate suppliers on these controls
        - Security + support diligence
      - - Cap-table and preference overhang
        - Preference stack, secondary rights, investor protections, and down-round terms
        - Affects actual return potential even if enterprise value grows
        - Corporate counsel / financing diligence
    notes: These asks are ordered by what most changes the valuation recommendation, not by what is easiest for management to provide.
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040

