  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Bull thesis — AI-networking bottleneck owner
        - A16z, Lightspeed, and official product materials all frame networking as a central constraint on AI cluster performance
        - Confirm 2-3 named production customers and backlog scale
      - - Bull thesis — founder and operator credibility
        - Anshul Sadana's Arista/Cisco background and hyperscaler relationships are central to the investor case
        - Show that credibility converts into diversified, repeatable design wins rather than a few bespoke projects
      - - Bull thesis — custom + open-NOS model
        - Nextop combines merchant silicon, customer engineering, SONiC/FBOSS openness, and turnkey NeoCloud offers
        - Disclose gross-margin trajectory and support burden to prove the model scales economically
      - - Anti-thesis — proof scarcity
        - No public revenue, backlog, named production hyperscaler customer, retention, or concentration schedule
        - Release private metrics or accept a materially lower valuation entry point
      - - Anti-thesis — concentration and compliance risk
        - Risks chapter shows export controls, supplier dependence, and likely hyperscaler concentration
        - Demonstrate export-compliance maturity and revenue diversification beyond one or two anchor programs
      - - Anti-thesis — current price already anticipates success
        - $4.2B valuation arrived less than a year after launch, before public financial proof
        - A lower price or stronger private operating evidence would reduce underwriting tension
    notes: The table is designed to show exactly which missing facts are gating a stronger recommendation.
    claimRefs:
