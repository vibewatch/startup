  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bear
        - Named customer proof remains thin; one or two anchor programs dominate; no public revenue or backlog proof emerges; supply or export frictions slow ramps
        - Valuation range compresses to roughly $1.5B-$3.0B, implying meaningful downside from the $4.2B mark
        - Concentration, compliance, roadmap, and support-execution failures
        - Credible because current price is high relative to public proof
      - - Base
        - Strategic relevance remains real; private metrics are probably solid enough to avoid a collapse, but public evidence stays incomplete and diversification remains limited
        - Valuation range of roughly $3.0B-$4.5B, with the current $4.2B mark near the upper half of fair value
        - Flat-to-modest-negative returns if entry is at the Series B valuation
        - Most likely on public evidence alone
      - - Bull
        - Multiple named hyperscaler / NeoCloud wins emerge; backlog, revenue, and gross-margin data validate the business; export and supplier execution stay clean
        - Valuation range of roughly $5.5B-$8.0B, implying upside but not unlimited upside from today's mark
        - Requires proof that custom AI-networking programs scale into a repeatable platform business
        - Plausible, but not yet publicly demonstrated
    notes: >
      Scenario ranges are qualitative author estimates anchored to current public marks, public-comp market
      caps, and the proof burden implied by the company's stage and business model.
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
