  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue, backlog, and margins
      missingEvidence: >
        No public revenue, booked backlog, gross margin, burn, or warranty reserve figures were found for
        Nextop AI.
      whyItMatters: >
        These are the core anchors needed to move from a strategic narrative to a defensible valuation.
      diligencePath: >
        Request quarterly revenue, backlog by program, gross margin, burn, warranty reserve, and support
        cost data under NDA.
      relatedTableRefs: [TV003, TV006]
      relatedQuestionRefs: [QV009, QV016, QV024, QV030]
    - type: private-evidence-only
      severity: blocking
      topic: customer concentration and referenceability
      missingEvidence: >
        No public top-customer schedule, renewal data, or named production hyperscaler roster is available.
      whyItMatters: >
        A $4.2B valuation can be justified by a few extraordinary programs or undermined by exactly the
        same concentration if those programs are not durable.
      diligencePath: >
        Request top-5 customer concentration, renewal status, and three customer references spanning
        hyperscalers and NeoClouds.
      relatedTableRefs: [TV005, TV006]
      relatedQuestionRefs: [QV015, QV023, QV024, QV030]
    - type: private-evidence-only
      severity: material
      topic: cap-table and preference overhang
      missingEvidence: >
        The public record does not reveal preference stack, liquidation rights, investor protections,
        secondaries, or down-round terms.
      whyItMatters: >
        Enterprise-value upside can fail to translate into investor returns if preference or dilution terms
        are punitive.
      diligencePath: >
        Review cap table, charter, major investor rights, and any secondary-market or tender history.
      relatedTableRefs: [TV006]
      relatedQuestionRefs: [QV025]
    - type: private-evidence-only
      severity: material
      topic: exit readiness and liquidity path
