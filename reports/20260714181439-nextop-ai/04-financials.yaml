- id: cost-structure-and-capital-intensity
  title: Cost structure proxies from the category and why hardware economics matter
  body: 'The clearest way to reason about cost structure is by triangulating from public networking peers rather than pretending Nextop has disclosed its own figures. The company is building AI-networking hardware around merchant-silicon and open-networking ecosystems, which implies cost buckets including switch silicon, optics, memory, boards, assembly, validation, spares, customer engineering, and field support. Public comparables show how wide the economics can be. HPE''s fiscal Q4 2025 results showed 33.5% GAAP gross margin and 36.4% non-GAAP gross margin overall, while its networking segment posted 23% operating margin. Broadcom''s annual-report and earnings materials show far higher profitability, but that includes a different mix and more scale than an emerging systems startup. Marvell''s annual-report and results pages emphasize the cadence of public disclosures for a merchant-silicon provider and its dependence on product cycles, while Cisco, NVIDIA, and Arista all provide the kind of annual-report transparency that Nextop does not. The takeaway is not that Nextop should map to any one peer margin. It is that AI-networking economics are highly mix-dependent, and hardware startups need very careful control over BOM, working capital, and software attachment if they want mature-company-like margins.'
