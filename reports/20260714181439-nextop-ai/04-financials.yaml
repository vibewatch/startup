  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-margin-pack
    missingEvidence: Quarterly revenue, gross margin, and revenue-mix disclosure by hardware, software, and services.
    whyItMatters: Without a basic P&L bridge, investors cannot test whether Nextop is scaling profitable systems revenue or simply funding a long hardware ramp.
    diligencePath: Request management financials covering revenue by quarter, gross-margin walk, and segment mix for the last six quarters.
    relatedQuestionRefs:
    - QI009
    - QI010
    - QI022
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: liquidity-and-runway
    missingEvidence: Cash on hand, monthly burn, runway, purchase commitments, and any venture debt or supplier-finance exposure.
    whyItMatters: Capital raised is not the same as capital remaining, especially in an inventory- and validation-heavy hardware business.
    diligencePath: Request treasury summary, monthly cash-burn history, debt schedule, and material supplier commitments.
    relatedQuestionRefs:
    - QI018
    - QI019
    - QI020
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: backlog-and-concentration
    missingEvidence: Backlog, top-customer concentration, payment terms, and pilot-to-production conversion rates.
    whyItMatters: Revenue quality in hyperscaler infrastructure depends on whether a few concentrated accounts are real, durable, and paying on favorable terms.
    diligencePath: Request bookings backlog, top-customer schedule, DSO by cohort, and win-loss history by account.
    relatedQuestionRefs:
    - QI006
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
