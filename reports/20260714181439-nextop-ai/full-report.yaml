      - number: '7.3'
        title: 'Dependency and concentration risk: hyperscalers, merchant silicon, and open ecosystems'
        blocks:
          - type: paragraph
            body: >
              Nextop's commercial upside is inseparable from its dependency stack. The company openly targets the
              world's largest cloud operators and tells investors there are only a small number of hyperscalers in
              urgent need of highly customized AI-networking technology. That is exactly why the opportunity can become
              enormous, and exactly why concentration risk is likely extreme. The customers chapter found only one named
              operator-adjacent validator (Microsoft Azure Networking via Dave Maltz) plus two anonymous cohorts
              (leading hyperscalers, NeoClouds). If a small number of design wins drive most of the revenue model,
              delayed ramp, roadmap slippage, or loss of one anchor account could have an outsized effect on bookings
              and valuation. Supplier concentration compounds that risk. The product family is built around merchant
              silicon and deep integration work, and the open-NOS strategy depends on external software communities,
              especially SONiC. Community participation is a strength, but it is also a dependency: roadmap divergence,
              quality regressions upstream, or changes in operator preferences between SONiC, FBOSS, and internal forks
              can all raise Nextop's support burden. Global export-control rules add a further dependency layer because
              customer geography and ownership matter, not just destination country. Finally, investors themselves
              become implicit dependencies at this stage: after a $500M Series B, expectations for execution, portfolio
              breadth, and proof density are high, and future financings could become much less forgiving if the first
              few flagship ramps stumble.
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
