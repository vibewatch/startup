  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and architectural layers
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Nexthop is AI data center networking, not the entire AI infrastructure boom.
              Official company materials consistently describe four network layers—scale-up, scale-out, scale-across,
              and front-end—and pair them with switches, network operating systems, optics, and cable validation. That
              boundary matters because many large public numbers in the AI ecosystem actually refer to GPUs, buildings,
              power infrastructure, or tenant fit-out rather than the networking slice itself. UEC and OCP sources
              reinforce that networking itself is fragmenting into distinct technical submarkets: scale-up for tightly
              coupled accelerator domains, scale-out for cluster fabrics, scale-across for inter-datacenter fabrics, and
              front-end networking for user, storage, and internet access. Training and inference also pull architecture
              differently. McKinsey and JLL show training leaning toward remote, power-rich campuses while inference
              pushes toward metro-adjacent, lower-latency deployments. For diligence purposes, Nexthop’s practical wedge
              is the Ethernet switching and interconnect layer that sits between accelerated compute and the rest of the
              data center stack.
            claimRefs:
