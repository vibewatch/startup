      - number: '1.2'
        title: Founder fit, leadership depth, and governance signals
        blocks:
          - type: paragraph
            body: >-
              The strongest people signal in public materials is founder-market fit. Anshul Sadana is not an outsider
              chasing AI excitement; third-party coverage and investor material place him at Arista for roughly 17
              years, including as COO, and one independent review also notes earlier Cisco experience. That background
              matters because Nexthop is pitching directly into hyperscaler networking programs where design credibility
              and relationships are unusually scarce assets. The trade-off is key-person concentration: the founder’s
              biography appears across launch coverage, investor messaging, Davos media, and official product
              announcements. Public leadership depth is visible but still relatively light. The company’s about page
              names hardware, software, product, customer engineering, finance, and supply-chain leaders, while its
              board and advisor roster includes Ita Brennan, Sureel Choksi, Guru Chahal, and Dave Maltz. Linux
              Foundation coverage also shows Ryan Torres speaking for Nexthop’s software agenda. Overall, governance
              visibility is better than a stealth-stage startup but still not equal to a mature public-company operating
              chart with committees, independent-chair detail, and ownership disclosures.
