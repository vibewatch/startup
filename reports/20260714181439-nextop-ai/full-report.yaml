      - number: '8.4'
        title: 'What would change the call: private metrics, better price, or both'
        blocks:
          - type: paragraph
            body: >
              The recommendation can move in two ways: the price can improve, or the evidence can improve. Evidence
              improvement is the higher-probability route. The final diligence package that matters most is specific:
              quarterly revenue and backlog, gross margin and warranty reserve, top-customer concentration, customer
              referenceability beyond Microsoft-linked operator validation, export- compliance maturity, and leadership
              confidence around next-generation product ramps. If those data points are strong, then a premium valuation
              can be justified even without broad public disclosure, because the company would resemble a classic
              hyperscaler-supplier business where a handful of design wins are worth outsized enterprise value. If they
              are weak, the current mark looks stretched. Price improvement is the other route: even a high-quality
              company can be a poor investment at too rich a price when so many core inputs remain private. The
              committee-style conclusion is therefore simple: do not reject the company; reject the idea that public
              evidence alone justifies aggressive entry at $4.2B.
