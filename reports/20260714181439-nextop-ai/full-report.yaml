            body: >-
              This is the chapter's biggest technical caution. The public evidence is strong on architecture,
              open-networking fit, and product scope, but weak on the trust surfaces that enterprise and hyperscaler
              diligence teams eventually demand. The SONiC ecosystem itself publishes community process, architecture,
              testing, and a security-process page, which is useful context for the open software stack. But Nextop's
              own public materials, at least in the corpus reviewed here, do not show a dedicated trust center, status
              page, security whitepaper, public SLA, benchmark methodology, MTBF figures, SOC 2 or ISO certification
              claims, or a detailed vulnerability-disclosure process. That absence does not prove weak internal
              controls, but it does sharply limit external verification. For a company positioning itself in critical
              AI-fabric infrastructure, reliability and security proof matter as much as topology diagrams. Until those
              surfaces are disclosed, investors should treat product credibility and operational assurance as related
