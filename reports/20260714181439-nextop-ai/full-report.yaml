      - number: '7.2'
        title: 'Operational, quality, and security risk: custom hardware at AI-cluster scale'
        blocks:
          - type: paragraph
            body: >
              Operationally, Nextop is attempting one of the hardest product motions in infrastructure: shipping custom
              and semi-custom switching systems into AI clusters where power, thermals, optics, buffers, telemetry, and
              deployment speed all matter simultaneously. The public product surfaces show direct dependence on high-end
              Broadcom silicon across the 4000, 4200, and 5000 series; the March 2026 launch also quotes Broadcom
              praising the integration of its low-power switching silicon. That gives Nextop access to a best-in-class
              merchant-silicon roadmap, but it also means the company inherits all of the timing, allocation,
              validation, and ASP pressure that come with that dependence. Reliability transparency remains thin: the
              company offers software releases, lifecycle content, advisories, next-business-day replacement, and
              return-to-factory repair, yet it discloses no MTBF, RMA rate, recall history, security-incident record,
              uptime statistics, or field-failure metrics. The support organization's existence is a positive sign, but
              it is also an admission that hardware failures, patch cadence, and global logistics matter materially to
              the business model. There is also a security-opacity issue. The Support Hub mentions security best
              practices and advisories, and the privacy policy promises reasonable administrative, technical, and
              organizational safeguards, but the chapter did not locate a public SOC 2 report, ISO 27001 certification,
              trust center, bug bounty, incident-report page, or product security architecture artifact. For a company
              courting elite cloud operators, that missing public posture is notable.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
