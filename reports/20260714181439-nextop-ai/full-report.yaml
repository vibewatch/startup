        blocks:
          - type: paragraph
            body: >-
              The strongest pro-Nextop argument is that open Ethernet momentum lowers the buyer's willingness to remain
              captive to a single incumbent stack. Cisco's Ultra Ethernet framing, Marvell's SONiC language, Broadcom's
              scale-up Ethernet specification reference, and Arista's willingness to support open NOS all indicate that
              AI networking is becoming less doctrinally proprietary. That helps a company like Nextop get meetings. But
              the adverse interpretation is just as important: if open standards are improving for everyone, then
              differentiation can narrow rather than widen. A customer may decide that an incumbent with global support,
              larger balance-sheet capacity, proven supply access, and the same standards-aligned roadmap is a safer
              bet. HPE Juniper can package networking into an AI-factory sale; NVIDIA can tie networking to GPUs, DPUs,
              and photonics; Arista can combine dense Ethernet with a known operating model; and merchant-silicon
              ecosystems can support internal build. As a result, Nextop's moat likely depends less on protocol novelty
              than on execution speed, design-win conversion, supply-chain reliability, and the value of being a
              flexible co-development partner. Those are plausible moats, but public evidence still does not prove how
              durable they are in production accounts.
