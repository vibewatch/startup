      - number: '8.3'
        title: 'Scenario framing: the current mark leaves limited room for evidence disappointment'
        blocks:
          - type: paragraph
            body: >
              Scenario analysis is necessarily qualitative because the company has not disclosed revenue or margin data,
              but that does not mean it is impossible. The bear case is straightforward: customer ramps are slower than
              investors expect, one or two anchor programs dominate too much of the business, export or supply-chain
              frictions slow global rollout, and the public proof gap persists through the next financing or liquidity
              window. In that case, a private-market reset toward a lower strategic-premium valuation is plausible. The
              base case is more nuanced: Nextop is real, strategically relevant, and probably deserving of a substantial
              premium over a typical early-stage hardware company, but that premium only roughly sustains the current
              mark until private diligence proves revenue, backlog, margins, and concentration. The bull case requires
              more than category excitement. It requires named customer broadening, evidence of repeat purchase, clean
              support and reliability performance, and enough disclosed economics to show that custom AI-networking
              programs can become a scalable business rather than a set of expensive engineering projects. Put
              differently: the upside can be large, but a meaningful fraction of it is already reflected in the
              disclosed valuation.
            claimRefs:
