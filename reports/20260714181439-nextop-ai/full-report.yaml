  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and legal risk: export controls, privacy obligations, and open-source exposure'
        blocks:
          - type: paragraph
            body: >
              The most concrete external regulatory risk is export control. Nextop targets hyperscalers, NeoClouds, and
              global AI-data-center buildouts, which places it squarely inside the ecosystem that BIS now treats as
              strategically sensitive. BIS guidance states that a license is required for advanced-computing items
              exported to entities headquartered in Country Group D:5 or Macau, even if those entities sit outside those
              jurisdictions, and BIS's broader AI diffusion framework shows how advanced chips, model weights, and large
              data-center clusters can become subject to geographic caps, end-use restrictions, and compliance logging.
              Legal alerts from Morrison Foerster, JD Supra, and Gibson Dunn all converge on the same point: enforcement
              is expanding beyond chip manufacturers to data-center operators, service providers, and infrastructure
              intermediaries. For Nextop, that means global customer qualification, KYC, contractual audit rights, and
              routing visibility can become sales-cycle friction rather than back-office detail. A second legal layer
              comes from the company's own April 2026 privacy policy, which explicitly contemplates cookies, analytics,
              advertising partners, service providers, and disclosures to law enforcement and other third parties. That
              is normal web-operations language, but it also means Nextop now has published legal commitments around
              privacy and security without a parallel public trust center, certification catalog, or standalone terms
              page that would help an enterprise buyer evaluate the control environment. Third, the company's open-NOS
              strategy -- SONiC, FBOSS, hardened NOS distributions, and high contribution to the SONiC ecosystem -- is a
              commercial asset, but it also creates classic software-and-hardware IP risk around license compliance,
              integration defects, and third-party code responsibilities.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
