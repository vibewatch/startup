      - number: '2.3'
        title: Buyer segmentation, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The most important buyers are hyperscalers and, secondarily, NeoCloud operators. Official Nexthop pages
              repeatedly target those groups instead of traditional enterprise accounts, and McKinsey expects
              hyperscalers to control about 70 percent of forecast U.S. capacity. Users are the engineering teams
              responsible for cluster design, network operations, and platform reliability, while payers sit in
              infrastructure and capacity-planning organizations that optimize deployment speed, power, latency, and
              hardware availability. Network World’s buyer guide stresses that at AI-factory scale, the winning supplier
              solves telemetry, routing, lossless transport, and management simplicity together, not speed in isolation.
              OCP ESUN and Network DNA also show that network choices now track compute topology more closely than in
              generic cloud networking. The adoption path therefore looks longer and more technical than classic
              enterprise switching: design collaboration, fabric qualification, software-stack integration, optics
              validation, cluster benchmark sign-off, then broader deployment. That favors vendors that can co-develop
              rather than merely ship boxes.
