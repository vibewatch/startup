      - number: '7.5'
        title: Mitigations, monitors, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >
              Nextop is not starting from zero on mitigation. It has meaningful capital, a published privacy policy, a
              visible support hub, a software-release surface, SONiC governance participation, and a
              customer-engineering-heavy org chart. Those are real building blocks for an institutional-quality
              infrastructure supplier. But they are still scaffolding rather than proof that the company can repeatedly
              execute across product generations and buyer cohorts. For an investor, the right frame is not whether
              these risks can be eliminated, but whether they can be monitored. The most important leading indicators
              are straightforward: named customer additions, export-compliance maturity, evidence of diversification
              beyond one or two anchor operators, gross-margin or backlog disclosure, field-quality metrics, and
              continuity of the core technical leadership bench. Conversely, a small set of thesis-break events would
              sharply weaken the story: loss or material delay of an anchor hyperscaler program, a public export-control
              enforcement issue, an inability to show margins or backlog after raising $500M, a significant
              silicon-roadmap slip, or a field-reliability problem that turns the support organization into a cost
              center rather than a moat. The public record today is good enough to identify those tripwires, but not
              good enough to clear them.
