  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Strategic relevance and investor quality keep Nextop investable, but missing operating proof keeps the
      recommendation at research-more / track.
    approximationNotes: The flow is qualitative and maps the public-evidence chain supporting the recommendation as of 2026-07-14.
    data:
      nodes:
        - id: market
          label: AI-networking bottleneck
          detail: Real market pain around hyperscaler AI fabrics and open software control.
          type: input
        - id: team
          label: Team and investor quality
          detail: Founder credibility plus Lightspeed and a16z support.
          type: input
        - id: proof
          label: Proof gap
          detail: No public revenue, backlog, margin, or named production hyperscaler customer.
          type: process
        - id: risks
          label: Concentration and compliance risk
          detail: Customer concentration, export controls, supplier dependence, and support/reliability unknowns.
          type: process
        - id: rec
          label: 'Recommendation: research-more / track'
          detail: Attractive company, but do not underwrite $4.2B on public evidence alone.
          type: output
      edges:
        - from: market
          to: proof
          label: strategic upside is real
        - from: team
          to: proof
          label: access and execution credibility help
        - from: proof
          to: risks
          label: missing metrics magnify risk discount
        - from: risks
          to: rec
          label: keeps entry discipline tight
    claimRefs:
