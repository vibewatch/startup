      - number: '3.3'
        title: Merchant silicon, pricing opacity, and internal-build pressure
        blocks:
          - type: paragraph
            body: >-
              Broadcom and Marvell make the category harder for Nextop in a less visible but strategically important
              way. Broadcom's Tomahawk family and Marvell's Teralynx family both advertise the throughput, radix,
              congestion-management, and low-latency characteristics required for AI fabrics. Marvell goes further by
              explicitly promoting open NOS, SONiC, SAI, and ODM or OEM deployment paths, while Broadcom documents
              support for AI-centric topologies and control features in its switch silicon. This means the underlying
              technical ingredients needed to assemble a competitive Ethernet AI fabric are increasingly available
              outside any one branded OEM. For a buyer, that widens the menu: buy NVIDIA, Arista, Cisco, or HPE Juniper;
              buy Nextop; or use merchant silicon plus open software in an internal or ODM-led design. Public pricing
              data does not simplify the choice because most vendors disclose port counts, availability windows, and
              architecture claims but not list pricing, discount structures, or realized contract economics. In practice
              that shifts competition toward trust, supply access, integration support, and willingness to customize
              around a buyer's topology. Those are exactly the areas where Nextop claims an advantage, but they are also
              the areas hardest to verify from public evidence alone.
