  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer segments: hyperscalers first, NeoClouds second, broad enterprise unproven'
        blocks:
          - type: paragraph
            body: >
              Nextop AI's public positioning is narrowly and consistently targeted at the largest cloud and AI
              infrastructure operators rather than a broad enterprise market. Its homepage says it is building "the most
              efficient AI infrastructure for the world's largest cloud operators," the March 2025 launch release says
              it builds custom networking solutions for hyperscalers that integrate into their optimized cloud stack,
              and the March 2026 product launch says the same platforms can run a hyperscaler's preferred SONiC or FBOSS
              image or be delivered as a turnkey Nexthop-NOS product for NeoClouds. That gives the chapter a clean
              segmentation lens: (1) hyperscalers buying custom JDM- style hardware, optics, and software integration;
              (2) NeoCloud operators buying more packaged turnkey systems; and (3) open-networking cloud operators
              evaluating switches because they want SONiC or FBOSS compatibility plus deep customer engineering support.
              What is notably absent is any public evidence that Nextop is selling meaningfully into mainstream
              enterprise, telecom, campus, or SMB segments. The personnel footprint reinforces the segmentation: the
              company publicly lists both a VP Customer Engineering and an AVP Customer Engineering, while the Support
              Hub exposes case APIs, hardware replacement, lifecycle notices, and globally distributed support coverage.
              That is the profile of a vendor expecting long, technical, design-in-heavy sales cycles with a small
              number of sophisticated buyers, not a self-serve software business with thousands of lightly-supported
              accounts.
            claimRefs:
              - CU001
              - CU002
              - CU003
