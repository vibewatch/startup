        title: Product definition, modules, and buyer-facing scope
        blocks:
          - type: paragraph
            body: >-
              Nextop's official product surface is unusually broad for a young networking startup. The company does not
              present itself as a point solution for one link layer or one switch box. Instead it maps the AI-fabric
              problem into four layers: scale-up, scale-out, scale-across, and front-end networking. Its March 2026
              product launch added named systems—NH-4010, NH-4220, NH-5010, and the Disaggregated Spine
              architecture—while the general platforms page frames the company around Ethernet switching, network
              software, optics, and cable validation. That matters because the buyer workflow is not just to purchase a
              device but to assemble a functioning AI-fabric environment that can fit an existing cloud operator control
              plane. Public sources also repeatedly emphasize support for SONiC, FBOSS, and BYoNOS, making the product
              definition less about a proprietary operating stack and more about integrating open or customer-selected
              software with purpose-built hardware. The result is a platform story rather than a single SKU story, but
              one whose commercial maturity still depends on whether named systems are shipping at scale.
