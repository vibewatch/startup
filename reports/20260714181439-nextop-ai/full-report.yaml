companyProfile:
  summary: >-
    Nextop AI is a private Santa Clara AI-networking infrastructure company founded in 2024 by former Arista COO Anshul
    Sadana. The company sells custom and off-the-shelf Ethernet switching systems, hardened network operating systems,
    and validated interconnects for hyperscalers and NeoCloud operators building large AI clusters, with a product story
    centered on scale-up, scale-out, scale-across, and front-end networking plus open-NOS support such as SONiC and
    FBOSS. Public financing evidence is unusually strong for a young hardware startup, with a $110M launch round in
    March 2025 and an oversubscribed $500M Series B in March 2026 at a $4.2B valuation, but public customer and
    financial disclosure remain thin enough that the operating base is still much less proven than the valuation
    headline.
  foundedDate: '2024-01-01'
