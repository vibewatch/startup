  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, direct rivals, and substitute paths
        blocks:
          - type: paragraph
            body: >-
              Nextop's competitive landscape is wider than a simple startup-versus-startup comparison. The direct
              rivalry set includes AI Ethernet fabric vendors such as Arista, Cisco, HPE Juniper, and NVIDIA's Spectrum
              platform. The incumbent substitute set still includes NVIDIA InfiniBand, which remains a serious option
              for performance-sensitive training environments. Below that sits the merchant-silicon layer led by
              Broadcom and Marvell. Those companies do not always sell the finished branded system, but they determine
              what OEMs, ODMs, and internal hyperscaler hardware teams can build. Finally, the status quo for the most
              sophisticated buyers is internal build: a hyperscaler can pair merchant silicon with SONiC or another open
              NOS, then use in-house systems engineering instead of buying a finished fabric from Nextop. That matters
              because Nextop is not only trying to displace branded switch incumbents; it is also trying to persuade
              buyers that an external co-development partner is better than building the same Ethernet fabric
              themselves. The company's official materials show why it believes it can compete: custom plus
              off-the-shelf systems, support for SONiC, FBOSS, and BYoNOS, validated optics and cables, and explicit
              focus on hyperscalers and NeoClouds rather than generic enterprise accounts.
            claimRefs:
              - CP001
              - CP002
              - CP021
              - CP023
              - CP024
              - CP025
              - CP036
