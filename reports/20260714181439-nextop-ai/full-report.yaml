      - number: '7.4'
        title: 'Financial and execution risk: capital intensity, margin uncertainty, and key-person exposure'
        blocks:
          - type: paragraph
            body: >
              Financial-model risk remains large because Nextop is both well capitalized and unusually opaque. The
              company has raised roughly $610M and sits at a reported ~$4.2B valuation, which reduces short-term
              financing risk, but none of the public sources disclose revenue, backlog, gross margin, burn, inventory,
              receivables, contract length, or working-capital turns. That is particularly important because public
              comparables show networking hardware economics are driven by supply-chain discipline, gross-margin
              management, and execution against rapid product cycles. A custom JDM-like model may improve strategic
              value to hyperscalers, but it can also lengthen qualification periods, increase engineering expense, and
              create awkward margin tradeoffs when customers demand bespoke hardware, validation, or optics
              combinations. Execution risk is equally concentrated in people. Investor materials repeatedly frame Anshul
              Sadana's operator relationships and Arista history as the core reason the company exists; losing him or
              suffering turnover in hardware, software, supply chain, or customer engineering would weaken both sales
              credibility and program delivery. The publicly listed footprint across Santa Clara, Seattle, Vancouver,
              Dublin, and Bengaluru gives access to talent, but it also adds coordination load for a still-young company
              trying to synchronize silicon choices, software releases, RMA processes, and global customer deployments.
            claimRefs:
              - CR026
              - CR027
