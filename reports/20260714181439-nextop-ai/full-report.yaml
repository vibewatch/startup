    enumerationScope:
      coverage: exhaustive
      basis: >
        Covers the public networking and AI-infrastructure comparables most useful for triangulating Nextop's current
        $4.2B private mark from public evidence: pure-play cloud networking, incumbent networking, merchant-silicon /
        AI-infrastructure suppliers, and adjacent AI-native infrastructure.
    rows:
      - - Arista Networks
        - Public cloud/data-center networking leader
        - ~$228.01B market cap (July 2026)
        - Best public pure-play comp for cloud networking credibility and strategic relevance
        - Far more mature, profitable, and diversified than Nextop; market cap alone does not imply entry value fairness
      - - Cisco Systems
        - Mature incumbent networking vendor
        - ~$459.65B market cap (July 2026)
        - Shows how large networking control points can become when product breadth and customer depth are proven
        - Enterprise and service-provider exposure make it a weak like-for-like comp for AI-native startup pricing
      - - Broadcom
        - Merchant-silicon and AI-infrastructure supplier
        - ~$1.862T market cap (July 2026)
        - Demonstrates how much value can accrue to bottleneck infrastructure layers in AI
        - Conglomerate mix, software exposure, and scale make it unsuitable as a direct startup multiple anchor
      - - NVIDIA
        - Dominant AI-infrastructure bottleneck owner
        - ~$5.129T market cap (July 2026)
        - Useful as a ceiling illustration for how strategically valuable AI bottlenecks can become
        - GPU and systems dominance is structurally different from Ethernet-switch startup economics
      - - Hewlett Packard Enterprise
        - Adjacent AI-networking and enterprise infrastructure vendor
        - ~$64.86B market cap (July 2026)
        - Provides a lower-scale adjacency comp with networking exposure and public operational disclosure
        - Broader enterprise mix and different margin structure limit direct relevance
      - - Juniper Networks
        - Pre-acquisition standalone networking vendor
        - Last known standalone market cap ~$13.35B (July 2025)
        - >-
          Useful as a floor-like reference for what a mature but less AI-central networking asset looked like before HPE
          acquisition
        - Not a live 2026 public trading comp and predates the current AI-networking frenzy
