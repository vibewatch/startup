  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, monetization mechanics, and what is actually public
        blocks:
          - type: paragraph
            body: >-
              The most defensible public view is that Nextop monetizes a blend of hardware systems, software
              integration, and engineering services rather than a pure software subscription. Official pages describe
              scale-up, scale-out, scale-across, and front-end switch platforms, while launch and Series B materials
              emphasize joint-development-manufacturer style work for hyperscalers and turnkey products for NeoClouds.
              The software-releases page and repeated open-NOS language imply a software and support layer, but public
              evidence does not show standalone software pricing, license terms, or maintenance attach rates. That
              matters because networking startups can look very different financially depending on whether revenue comes
              from product ASPs, non-recurring engineering, support contracts, or recurring software. The public corpus
              is strong enough to establish that Nextop is not a simple box seller and not a typical SaaS company, but
              it is not strong enough to reveal current revenue mix, revenue-recognition policies, or how much of the
              commercial model is recurring after the initial design win.
