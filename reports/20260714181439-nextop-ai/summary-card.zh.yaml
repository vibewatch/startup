  topStrengths:
    - 创始人-市场匹配少见地强，Anshul Sadana 在 Arista 的运营经历和与超大规模云厂商的网络关系是核心支撑。
    - 公司瞄准真实的 AI 基础设施瓶颈，Ethernet、开放性、能效和定制工程能力都至关重要。
    - 产品定位具体，不是泛泛而谈：明确覆盖 scale-up、scale-out、scale-across、前端网络，并支持开放 NOS。
    - 投资人背书一线，Lightspeed、Andreessen Horowitz、Altimeter 等机构在品类早期即下注。
    - 已披露的大额融资降低了资本密集型硬件项目的近期生存风险。
  topRisks:
    - 公开收入、订单积压、毛利率、留存和客户集中度仍未披露，估值承销高度不确定。
    - 相比 $4.2B 标记，具名客户证据极薄，公开验证主要来自一条与 Microsoft 相关运营商引述和匿名客户群。
    - 出口管制、供应商和商用硅依赖，可能在地缘敏感市场直接拖慢或卡住客户爬坡。
    - 即便早期设计定点真实，账户结构高度依赖超大规模云厂商，也很可能带来显著集中度风险。
    - 面向要求严苛云运营商销售的供应商，公开信任、安全和可靠性披露仍稀少。
  unresolvedGaps:
    - 当前收入、已签订单积压，以及从工程定点转为确认收入的路径。
    - 毛利率、质保准备、支持成本结构和硬件更换历史。
    - 头部客户集中度、续约状态，以及 Microsoft 相关运营商信号之外的可推荐性。
    - 全球部署的出口合规成熟度、所有权筛查和可审计性。
    - 优先股结构、二级条款等影响实际回报潜力的 cap table 细节。
