      - Limitation
    enumerationScope:
      coverage: exhaustive
      basis: >
        Covers every customer-like public proof item this chapter could locate for Nextop AI as of
        2026-07-14: one named operator-adjacent quote (Microsoft Azure Networking) and two unnamed buyer
        cohorts (leading hyperscalers, NeoClouds) repeatedly referenced in official and independent
        sources. No additional named customer case study, procurement record, or peer review was found.
    rows:
      - - Microsoft Azure Networking (Dave Maltz quote)
        - Hyperscaler / operator validator
        - Public endorsement tied to SONiC collaboration, Disaggregated Spine concept, and customer-success language
        - Validation / design-partner signal; commercial purchase status undisclosed
        - Named Microsoft executive publicly praises Nextop's speed, open-networking work, and dedication to customer success
        - Quote proves relationship proximity, not a purchase order, deployment size, or renewal
      - - Leading hyperscalers (unnamed cohort)
        - Hyperscaler customers
        - Scale-out and scale-across switches; custom hardware/software co-development
        - Shipping / production asserted by company
        - Nextop says products are already shipping and that one large hyperscaler co-developed the Disaggregated Spine architecture
        - Names, shipment volumes, and account count withheld; all proof ultimately traces to company-originated releases or interviews
      - - NeoClouds (unnamed cohort)
        - AI cloud providers
        - Turnkey switches plus hardened Nexthop NOS powered by SONiC
        - Commercially targeted; named deployment unconfirmed
        - Official sources repeatedly present NeoClouds as a buyer group for turnkey products rather than bespoke hyperscaler JDM
        - No named NeoCloud customer, no case study, and no quantified outcome disclosed
    notes: >
