    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public proof
      - Strategic value
      - Gap
    rows:
      - - Hyperscalers
        - Buyer = network architecture / cloud infrastructure leadership; user = network engineering and operations; payer = centralized data-center capex and software/support budget
        - Co-developed scale-out, scale-across, and front-end AI network platforms
        - Home page, launch press release, Network World interview, March 2026 shipping claim
        - Core revenue thesis; highest potential ASP and design-win leverage
        - No named customer roster, customer count, or top-account concentration disclosed
      - - NeoCloud operators
        - Buyer = founder / infrastructure lead; user = SRE and network operations; payer = AI cloud operator capex / opex budget
        - Turnkey switches and SONiC-based Nexthop NOS distribution
        - March 2026 product launch and Series B release explicitly mention NeoClouds
        - Diversifies beyond the handful of top hyperscalers if real
        - No named NeoCloud customer or deployment KPI disclosed
      - - Open-networking cloud operators
        - Buyer = network software/platform team; user = switch operations and deployment engineers; payer = cloud operator platform budget
        - Run preferred SONiC or FBOSS image on Nextop hardware with customer engineering support
        - Microsoft Azure quote, SONiC board role, open-networking language across official sources
        - Helps Nextop compete where open NOS choice is a procurement requirement
        - Ecosystem validation does not equal a signed commercial win
      - - Mainstream enterprise / telecom / SMB
        - No distinct public buyer profile disclosed
        - Not clearly targeted in public materials
        - No public case study, pricing surface, or channel narrative found
        - Could be future TAM expansion, but not part of visible near-term thesis
        - Public evidence suggests this segment is effectively unproven today
    notes: >
      The segmentation table is drawn only from public evidence. It intentionally treats mainstream
      enterprise as a gap row because the company repeatedly describes hyperscaler and NeoCloud buyers but
      never publicly substantiates a broader customer mix.
