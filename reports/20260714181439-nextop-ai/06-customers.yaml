  evidenceGaps:
    - type: enumeration-incomplete
      severity: blocking
      topic: named customer roster
      missingEvidence: >
        No public source reviewed for this chapter names a production hyperscaler or NeoCloud customer of
        Nextop AI. Microsoft Azure provides the only named operator-adjacent validation, but not a named
        purchase reference.
      whyItMatters: >
        Without at least a few named production customers, outside investors cannot judge breadth,
        diversification, or referenceability relative to a $4.2B valuation narrative.
      diligencePath: >
        Request at least three customer reference calls: one hyperscaler, one NeoCloud, and one open-
        networking operator using SONiC or FBOSS on Nextop hardware.
      relatedTableRefs: [TU003]
      relatedQuestionRefs: [QU006, QU010, QU011, QU013, QU014]
    - type: private-evidence-only
      severity: blocking
      topic: retention and renewal metrics
      missingEvidence: >
        No public NRR, GRR, churn, renewal-rate, contract-length, or backlog data was found across
        company, investor, media, and review sources.
      whyItMatters: >
        The strongest upside case for Nextop depends on deepening wallet share inside a few very large
        accounts; without retention and renewal data, that thesis cannot be externally validated.
      diligencePath: >
        Request cohort retention, logo churn, renewal schedule, and booked backlog by quarter for the top
        ten accounts.
      relatedTableRefs: [TU004, TU005]
      relatedQuestionRefs: [QU018, QU025]
    - type: private-evidence-only
      severity: material
      topic: customer concentration schedule
      missingEvidence: >
        No public source discloses revenue concentration by top account, top five accounts, or by
        hyperscaler versus NeoCloud segment.
      whyItMatters: >
        A business selling mainly to hyperscalers could be extraordinary if it has multiple active design
        wins, or very fragile if one or two accounts dominate revenue. Public evidence cannot tell which.
      diligencePath: >
        Request a concentration schedule, program-stage pipeline, and scenario analysis for the loss or
        delay of the largest account.
      relatedTableRefs: [TU005]
      relatedQuestionRefs: [QU021, QU025]
    - type: missing-source
      severity: material
      topic: independent adverse customer evidence
      missingEvidence: >
        The chapter found almost no public adverse customer evidence beyond thin review-platform coverage;
        no failed deployment report, churned-customer interview, or procurement dispute was located.
      whyItMatters: >
        The absence of adverse evidence could mean strong execution, or simply reflect NDA-heavy customer
        relationships and the lack of public operator commentary.
      diligencePath: >
        Conduct structured customer references including one lost-deal or churned-account discussion, and
        request internal support and RMA trend data.
      relatedTableRefs: [TU004, TU006]
      relatedQuestionRefs: [QU017, QU025]

