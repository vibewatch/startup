figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Nextop's visible customer journey is a design-in-heavy path from operator need through co-development and support, with the biggest information break occurring after initial shipment.
    data:
      nodes:
        - id: ai-demand
          label: AI-network demand appears
          detail: Hyperscalers and NeoClouds need higher-bandwidth, lower-power Ethernet fabrics for AI clusters.
          tone: positive
        - id: co-design
          label: Co-design / qualification
          detail: Nextop positions itself as an extension of cloud engineering teams and a JDM-style partner.
          tone: positive
        - id: open-nos-fit
          label: Open-NOS fit
          detail: Buyers choose SONiC or FBOSS on Nextop hardware, or accept a hardened Nexthop NOS package.
          tone: positive
        - id: shipment
          label: Initial shipment
          detail: Company says platforms are already shipping to leading hyperscalers, but names and volumes are withheld.
          tone: neutral
        - id: post-sale-support
          label: Post-sale support
          detail: Portal, API, warranty, lifecycle notices, and replacement services support production environments.
          tone: positive
        - id: renewal-opacity
          label: Renewal / expansion opacity
          detail: No public NRR, churn, contract-length, or concentration data reveals whether shipped programs expand or stall.
          tone: warning
    claimRefs:
      - CU001
      - CU002
      - CU009
      - CU019
      - CU029
      - CU031

  - id: FU002
    title: Adoption / deployment flow
    type: flow
    summary: Public evidence supports a flow from buyer demand to co-development to shipment and support, but not the conversion rates between those stages.
    data:
      nodes:
        - id: demand
          label: Hyperscaler / NeoCloud demand
          tone: positive
        - id: designin
          label: Qualification and co-development
          tone: positive
        - id: platform-choice
          label: Preferred NOS or turnkey package
          tone: neutral
        - id: production
          label: Shipment into production environments
          tone: neutral
        - id: support
          label: Support, lifecycle, and replacement
          tone: positive
      edges:
        - from: demand
          to: designin
          label: evaluate build / buy / partner
        - from: designin
          to: platform-choice
          label: choose custom or turnkey path
        - from: platform-choice
          to: production
          label: deploy switches and software
        - from: production
          to: support
          label: operate and maintain
    approximationNotes: >
      This is an evidence flow rather than a numeric funnel because Nextop does not publicly disclose
