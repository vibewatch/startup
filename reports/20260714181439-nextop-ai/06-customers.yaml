  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - JDM / co-development model for hyperscalers
        - A very small number of giant buyers can dominate revenue if even one or two programs ramp
        - Strong upside if designed in, but program loss or delay could materially change financial outcomes
        - Request top-customer concentration and pipeline by program stage
      - - Turnkey NeoCloud offer
        - Diversification narrative is attractive, but no named NeoCloud customer exists publicly
        - Could reduce reliance on the handful of top hyperscalers if conversion is real
        - Request named NeoCloud references and booked wins by region
      - - Open-NOS compatibility (SONiC / FBOSS)
        - Ecosystem credibility may broaden consideration sets, but does not guarantee purchase conversion
        - Helps account entry where buyers insist on open software control
        - Request win/loss analysis versus incumbent Ethernet vendors and internal build options
      - - Formal support infrastructure
        - Support readiness can lower switching friction for expansions, but public evidence does not show actual renewals
        - Suggests Nextop is investing for long-lived production relationships
        - Request support-ticket volumes, resolution times, and expansion-rate correlation for existing accounts
      - - Revenue opacity
        - No public backlog, ARR, or contract-value data makes concentration unknowable from outside
        - Prevents external validation of whether the valuation rests on a broad base or a few anchor accounts
        - Request customer concentration schedule, backlog, and shipment ramp by quarter
    notes: >
      The chapter's central customer-risk conclusion is concentration uncertainty rather than demonstrated
      customer weakness. Every row therefore ends with a concrete diligence ask.
    claimRefs:
