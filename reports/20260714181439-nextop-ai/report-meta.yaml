companyProfile:
  summary: Nextop AI is a private Santa Clara AI-networking infrastructure company founded in 2024 by former Arista COO Anshul Sadana. The company sells custom and off-the-shelf Ethernet switching systems, hardened network operating systems, and validated interconnects for hyperscalers and NeoCloud operators building large AI clusters, with a product story centered on scale-up, scale-out, scale-across, and front-end networking plus open-NOS support such as SONiC and FBOSS. Public financing evidence is unusually strong for a young hardware startup, with a $110M launch round in March 2025 and an oversubscribed $500M Series B in March 2026 at a $4.2B valuation, but public customer and financial disclosure remain thin enough that the operating base is still much less proven than the valuation headline.
  foundedDate: '2024-01-01'
  founders:
    - name: Anshul Sadana
      role: Founder & CEO
      background: Former Arista Networks COO with roughly 17 years at Arista and deep hyperscaler networking credibility.
      claimRefs: [CO004, CO005]
  foundingLocation: Santa Clara, California, USA
  headquarters: Santa Clara, California, USA
  productSummary: Nextop sells AI data-center Ethernet infrastructure spanning scale-up, scale-out, scale-across, and front-end networking, combining switching hardware, open-NOS support, and validated interconnects for cloud-scale deployments.
  customerFocus: Hyperscalers, NeoCloud operators, and cloud-infrastructure teams buying customized or turnkey networking systems for AI clusters.
  businessModel: B2B hardware-and-software supplier model built around custom hyperscaler/JDM-style programs, more packaged NeoCloud systems, and post-sale support and lifecycle services.
  stage: Private, Series B / unicorn
  fundingStatus: Publicly disclosed funding totals are about $610M, including a $500M oversubscribed Series B announced in March 2026 at a $4.2B valuation led by Lightspeed with Andreessen Horowitz and Altimeter participation.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO005, CO013, CO015, CO016, CE001, CE003, CU001, CU002]
