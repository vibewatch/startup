callouts:
- calloutType: strength
  title: Elite investors and open-networking ecosystem proof arrived unusually early
  body: 'Nexthop combined two scarce early-stage signals: blue-chip capital formation and visible open-networking credibility. The $110 million launch, the $500 million Series B at a $4.2 billion valuation, and the move onto the SONiC governing board all suggest that both financial backers and ecosystem participants view the company as more than a concept-stage hardware startup.'
  claimRefs:
  - CO007
  - CO012
  - CO013
  - CO031
  - CO032
- calloutType: risk
  title: The public record is strong on narrative and funding, weak on operating disclosure
  body: This chapter can verify funding rounds, investor quality, product announcements, and open-software positioning. It cannot verify revenue, margins, customer count, or named design wins, and external skeptical coverage explicitly flags the combination of a rapid valuation step-up and a hard incumbent-displacement problem.
  claimRefs:
  - CO034
  - CO035
  - CO037
- calloutType: insight
  title: Nexthop is selling a collaboration model as much as a switch box
  body: Across official and independent coverage, the company’s differentiation is not framed as a single proprietary ASIC or a single NOS. The recurring pitch is that hyperscalers can use Nexthop to compress design cycles, keep open-software control, and still get custom hardware plus validated interconnects.
  claimRefs:
  - CO009
  - CO021
  - CO022
  - CO039
- calloutType: assumption
  title: Later chapters should treat customer traction and unit economics as unproven until named evidence appears
  body: The overview evidence is enough to establish identity and financing but not enough to underwrite revenue quality. Until public filings, customer references, or more detailed management commentary appear, later chapters should assume that customer concentration, pricing power, and gross-margin durability remain open diligence tracks rather than settled facts.
  claimRefs:
  - CO034
  - CO036
  - CO037
