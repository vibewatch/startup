    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Named hyperscaler or NeoCloud design partners, production deployments, and renewal evidence.
    whyItMatters: Public positioning is strong, but the overview cannot yet separate active customer programs from target-account marketing.
    diligencePath: Request customer reference calls, PO history, deployment status by account, and any public reference permissions.
