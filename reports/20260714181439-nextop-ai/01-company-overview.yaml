- id: funding-valuation-and-disclosure
  title: Funding history, valuation step-up, and disclosure limits
  body: The public capital story is unusually legible for a private infrastructure company. Nexthop launched from stealth on 2025-03-25 with $110 million led by Lightspeed and a syndicate that included Kleiner Perkins, WestBridge Capital, Battery Ventures, and Emergent Ventures. Less than a year later, it announced an oversubscribed $500 million Series B at a $4.2 billion valuation with Lightspeed again leading and Andreessen Horowitz plus Altimeter joining. On simple arithmetic, disclosed funding totals reach about $610 million. That pace of capital formation is a strength because networking hardware for hyperscalers is expensive to design, validate, and manufacture. It is also a risk because the markup happened before the company disclosed revenue, ARR, gross margin, or customer count. Investor theses and official releases both describe a very large opportunity, but the overview evidence still supports valuation confidence more through elite-backer conviction and market narrative than
    through transparent operating metrics.
  claimRefs:
