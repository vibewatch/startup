  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-history
    missingEvidence: A complete round-by-round cap table with ownership percentages, board rights, and any secondary transactions.
    whyItMatters: The public record supports total disclosed raised but does not show dilution, control, or whether early investors still dominate governance.
    diligencePath: Request the latest cap table, investor rights agreement summary, and board observer list from management or counsel.
    relatedQuestionRefs:
    - QO009
    - QO025
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue, ARR, gross margin, customer count, and named design-win evidence.
    whyItMatters: Without operating metrics, the valuation step-up cannot be tested against commercial traction or hardware unit economics.
    diligencePath: Request management KPI pack, customer concentration schedule, and monthly bookings / shipment history.
    relatedQuestionRefs:
