company:
  name: Nextop AI
chapter:
  number: 1
  title: Company Overview
  summary: 'Nexthop AI is a Santa Clara-based AI networking infrastructure startup founded in 2024 by former Arista COO Anshul Sadana. Public evidence supports two financing milestones — a $110 million stealth launch in March 2025 and a $500 million Series B at a $4.2 billion valuation in March 2026 — plus a product strategy centered on open-software Ethernet switching for hyperscalers and NeoClouds. The main overview caveat is disclosure opacity: public sources do not provide revenue, ARR, named customer wins, or a complete cap-table history, so the chapter can verify positioning and financing far better than current operating scale.'
sections:
- id: identity-and-positioning
  title: Identity, positioning, and product surface
  body: 'Nexthop AI presents itself as a purpose-built networking supplier for AI data centers rather than as a general enterprise networking vendor. Across its homepage, launch materials, and platform pages, the company consistently anchors on the world’s largest cloud operators, on open network operating systems such as SONiC and FBOSS, and on a mix of off-the-shelf plus customized switching systems. That matters because it frames Nexthop less as a software abstraction and more as an Ethernet infrastructure company trying to own a difficult layer between merchant silicon, optical interconnects, and hyperscaler deployment workflows. The company’s current official footprint points to Santa Clara headquarters with additional locations in Seattle, Vancouver, Dublin, and Bengaluru. Product materials show a broad scope already: scale-out, scale-up, scale-across, and front-end networking plus optics and cables. Even at the overview level, the core commercial story is clear: Nexthop wants to be
    the co-development partner that helps hyperscalers and NeoClouds deploy AI fabrics faster and with better power efficiency than legacy approaches.'
