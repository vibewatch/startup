- id: milestones-ecosystem-and-risks
  title: Milestones, ecosystem validation, and early adverse signals
  body: The chapter’s milestone pattern shows that Nexthop is moving quickly on ecosystem positioning as well as financing. In March 2025 the company tied its launch to open-networking support and to custom hyperscaler builds. By October 2025, Linux Foundation and PR Newswire said Nexthop had advanced to Premier SONiC membership and joined the governing board, which is a meaningful credibility signal for a young networking vendor selling around open software. March 2026 then combined the Series B and the public launch of the NH-4010, NH-4220, and NH-5010 plus the Disaggregated Spine architecture. Media appearances around Davos and theCUBE added founder visibility, while the company’s own news pages highlighted recognition from CRN and TechCrunch-linked lists. The adverse counterpoint is that public traction is still mostly ecosystem and investor proof rather than named customer proof. External skeptical coverage argues that hyperscaler switching decisions are sticky, incumbents are formidable,
    and Nexthop’s lack of disclosed financials makes flawless execution a prerequisite rather than a bonus.
