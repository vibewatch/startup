  title: Pricing is too opaque to call Nextop a low-cost or premium vendor from public data
  body: Most public competitor materials disclose bandwidth, optics, availability, and software posture rather than list price or realized contract economics. This chapter therefore compares packaging power and switching paths more confidently than absolute price leadership.
