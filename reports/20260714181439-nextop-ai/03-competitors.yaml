callouts:
- calloutType: strength
  title: Open software plus co-development is the clearest public differentiator
  body: Nextop's sources consistently emphasize SONiC, FBOSS, BYoNOS, optics validation, and custom system design. That positioning gives it a sharper angle than a generic switch startup, especially for buyers that want Ethernet without buying the whole AI-factory stack from one incumbent.
  claimRefs:
  - CP021
  - CP023
  - CP037
- calloutType: risk
  title: The same open-Ethernet trend that helps Nextop also helps larger incumbents
  body: UEC-style momentum can reduce lock-in, but it also means NVIDIA, Arista, Cisco, HPE Juniper, Broadcom, and Marvell can all market standards-aligned AI fabrics. If that convergence continues, scale, support, and supply access may matter more than architectural philosophy.
  claimRefs:
