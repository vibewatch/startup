- id: incumbent-platform-profiles
  title: Incumbent platform profiles and where they overlap Nextop
  body: 'NVIDIA remains the broadest stack rival because it spans both proprietary InfiniBand and Ethernet. Its Spectrum platform bundles switches with Cumulus Linux, Pure SONiC, NetQ, and simulation or validation tooling, while its InfiniBand platform adds SHARP and other in-network-computing features that still matter in top-end training fabrics. NVIDIA''s newer silicon-photonics announcements also show how aggressively it is trying to keep networking attached to its AI-factory vision rather than ceding Ethernet share to standalone switching vendors. Arista is the clearest open-Ethernet systems rival. Its June 2026 1.6T launch positioned the 7060XE7 family as rack-scale AI infrastructure for both scale-up and scale-out, with support for EOS and open NOS plus customer endorsements from Meta, Microsoft, and Oracle. Cisco competes somewhat differently, emphasizing Silicon One as a unified architecture and tying its AI-networking pitch to optical convergence and Ultra-Ethernet-style mechanisms such as link-layer retry and congestion controls. HPE Juniper now attacks the category as part of a broader AI Data Center Solution, meaning Nextop can face not just a switch vendor but a bundled compute-storage-networking proposal with Juniper switching and AIOps. Across these players, the overlap with Nextop is obvious: all now market Ethernet as a credible AI-fabric substrate rather than a second-tier alternative.'
