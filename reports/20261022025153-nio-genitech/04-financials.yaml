    columns: [Stream, Mechanism, Unit, Current value/status, Quality, Diligence ask]
    rows:
      - [Vehicle chip sales, "Supply of Shenji chips into NIO and potentially other vehicle programs", "Per chip / vehicle program", "Commercial deployment reported; revenue not disclosed", "Company-linked deployment evidence; no recognized revenue", "Obtain contracts, shipment reports, ASP, returns, and revenue-recognition policy"]
      - [Technology licensing, "External technical licensing of NX9031 or related IP", "License / system authorization", "External licensing reported as a strategic direction; price unknown", "Third-party report; no signed contract value", "Obtain executed licenses, upfront fees, royalties, milestones, and exclusivity"]
      - [Partner-developed chips, "Joint development and possible supply through the Chongqing venture", "Program / chip shipment", "M97 and other programs reported; commercial timing uncertain", "Industry reporting; not audited", "Confirm ownership, transfer pricing, customer commitments, and launch schedule"]
      - [Parent-related activity, "NIO-funded development and use in NIO-branded vehicles", "Internal transfer / vehicle", "Material historical R&D investment reported", "Related-party context; not standalone revenue", "Provide related-party agreements and eliminate internal transfers from external revenue"]
    notes: "Sources distinguish product sales and reported licensing plans, but do not disclose recognized revenue, realized pricing, contract terms, or the boundary between NIO internal activity and external GeniTech revenue."
    claimRefs: [CI001, CI002, CI003, CI004, CI007, CI014, CI015]
  - id: TI002
    title: Pricing / monetization table
    columns: [Price or economics item, Basis, List vs realized, Status, Implication]
    rows:
      - [NX9031 cost advantage, "Approximately CNY10,000 per vehicle versus Nvidia Orin-X", "Not a customer price; reported company comparison", "Company figure reported by Yicai", "Potential OEM value capture is unknown"]
      - [NX9031 technical license, "Single IP authorization may be millions of USD; system-level authorization may reach hundreds of millions", "Illustrative industry ranges, not GeniTech terms", "Reported range; no executed GeniTech contract identified", "Cannot use as forecast revenue"]
      - [2026 Onvo L90 vehicle price, "CNY265,800-CNY299,800", "Vehicle list price, not chip price", "Published vehicle pricing", "Shows the application context, not semiconductor monetization"]
      - [Series A financing, "CNY2.3 billion / approximately $329 million", "Capital raised, not operating revenue", "February 2026 financing", "Provides funding capacity but not runway without cash and burn"]
    notes: "The rows intentionally separate chip economics, licensing ranges, vehicle list price, and financing. They are not interchangeable denominators and should not be combined into a revenue or margin estimate."
    claimRefs: [CI006, CI009, CI010, CI011, CI013, CI015]
  - id: TI003
    title: Unit economics table
    columns: [Metric, Value/null, Confidence, Why it matters, Diligence ask]
    rows:
      - [R&D investment for NX9031, "CNY2.3B-CNY3B", medium, "Sets the sunk-cost and amortization burden before external volume", "Reconcile project costs to GeniTech opening balance sheet and capitalization policy"]
      - [Reported vehicle cost advantage, "Approximately CNY10,000 per vehicle", medium, "Indicates potential OEM value and adoption incentive", "Validate against realized BOM, manufacturing, software, support, and warranty costs"]
      - [Pre-spinout chip team, ">600 people", medium, "Signals a substantial fixed engineering cost base", "Provide current headcount, compensation, contractor mix, and loaded R&D expense"]
      - [Gross margin, null, low, "Required to assess whether volume creates cash generation", "Provide audited gross margin by chip, license, and customer"]
      - [CAC / sales efficiency, null, low, "External OEM sales may require long qualification cycles and channel spend", "Provide sales-cycle length, win rate, CAC, and payback by external customer"]
      - [Cash / burn / runway, null, low, "Determines financing dependency and next-round risk", "Provide monthly cash bridge, operating burn, capex, debt, and runway case"]
    notes: "Nulls are unavailable public evidence, not zero. Reported figures are not audited standalone GeniTech financial statements and do not establish gross profit or cash burn."
    claimRefs: [CI005, CI006, CI007, CI012]
