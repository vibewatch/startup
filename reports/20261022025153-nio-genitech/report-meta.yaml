companyProfile:
  summary: >-
    Nio GeniTech, also referred to as Shenji, is NIO's intelligent-driving semiconductor arm. It was separated into a
    standalone legal entity in June 2025 and externally financed in February 2026 while NIO retained control. The public
    record supports a transition from captive automotive silicon toward external licensing and broader AI-compute
    applications, but leaves standalone economics, governance terms, and durable external customer commitments
    unverified.
