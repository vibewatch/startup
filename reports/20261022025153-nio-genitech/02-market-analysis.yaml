      - ["Chinese OEM external design wins", "OEM procurement and ADAS leadership", "ADAS engineering and algorithm teams", "Vehicle program or component procurement", "Lower cost, domestic supply and algorithm flexibility", "Qualification, switching cost and competitor resistance"]
      - ["Semiconductor co-development partners", "Chip design partner", "Joint hardware/software teams", "Co-development and licensing budget", "Faster access to high-compute architecture", "Partner economics and unclear ownership/licensing terms"]
      - ["Global or export-oriented OEMs", "Global sourcing and compliance teams", "Safety, software and sourcing organizations", "Platform and compliance budgets", "Supply assurance and functional-safety readiness", "Export controls and manufacturing access"]
      - ["Embodied-AI and inference adjacencies", "Robotics or edge-AI product teams", "Inference-platform engineers", "New-product R&D budget", "Reuse of high-compute architecture", "No public external revenue or independently sized pool"]
      - ["Status-quo or internal build", "OEM engineering organization", "Internal chip and software teams", "Internal R&D budget", "Control and differentiation", "High R&D cost and time-to-market"]
    notes: >-
