callouts:
  - calloutType: risk
    title: Highest-priority risk
    body: "Export-control and data-governance rules can restrict the addressable market or raise qualification costs even if the silicon performs as intended."
    claimRefs: [CR005, CR006, CR007]
  - calloutType: assumption
    title: Evidence boundary
    body: "Public reporting supports deployment and partnership signals, but does not verify signed external OEM contracts, standalone cash runway, security certifications, or the absence of incidents."
    claimRefs: [CR003, CR010, CR014]
  - calloutType: recommendation
    title: Monitoring trigger
    body: "Require documented design wins, production dates, export-control clearance, and independent security and automotive-quality evidence before increasing exposure."
    claimRefs: [CR011, CR013, CR016]

