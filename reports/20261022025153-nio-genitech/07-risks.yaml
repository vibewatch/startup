      - ["Cross-border automotive data transfer", "China and destination markets", "Practices described as opaque", High, "Localize and minimize data where required", "Review telemetry architecture and retention"]
      - ["Product liability, safety, and IP exposure", "Customer jurisdictions", "No public case identified in assigned sources", Medium, "Contractual allocation and quality systems", "Obtain litigation, warranty, and patent schedules"]
    enumerationScope:
      coverage: partial
      basis: "Public policy and risk sources reviewed for the 2026 refresh; not a complete legal docket or licensing inventory."
    notes: "The assigned sources establish policy and risk context but do not constitute a complete legal docket, license file, or compliance opinion for GeniTech."
    claimRefs: [CR006, CR007, CR010, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or ecosystem, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Core demand and reference deployments", "NIO brands", "Internal demand does not convert automatically into external sales", High, "Use production data and qualify external designs", High]
      - ["M97 co-development and supply route", "Axera / Chongqing joint venture", "Coordination, yield, or shipment delay", High, "Shared engineering and staged qualification", "Medium-high"]
      - ["External OEM pipeline", "Leapmotor and Geely", "Interest does not become signed production volume", High, "Secure written design wins and milestones", High]
      - ["Foundry, packaging, and component ecosystem", "Automotive semiconductor suppliers", "Capacity, cost, or export disruption", Medium, "Dual-source and maintain inventory buffers", "Medium-high"]
    notes: "Counterparties and scenarios are drawn from public reporting; no assigned source provides contract terms, exclusivity, volumes, or supplier concentration percentages."
    claimRefs: [CR003, CR013, CR014, CR015]

