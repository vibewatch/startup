    notes: "Assessment is based on the retained public evidence as of 2026-10-22; unknown valuation is intentional and does not mean zero."
    claimRefs: [CV007, CV008, CV009, CV010]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence signal, What would change the view]
    rows:
      - [Domestic automotive-chip substitution is a real strategic market, "S&P Global Mobility reports policy and OEM movement toward local chips.", "Evidence of production share and pricing for GeniTech chips across named external OEM programs."]
      - [NIO deployment can provide a reference platform, "CNEV Post reports Shenji NX9031 deployment into the 2026 Onvo L90 and more than 200,000 users claimed by Onvo.", "Independent shipment, warranty, and unit-economics data rather than a company-reported user count."]
      - [External commercialization is possible, "IT Home reports the Chongqing joint venture and reported technology-licensing proceeds.", "Signed customer contracts, shipment records, ownership economics, and cash receipts."]
      - [Scale economics may be difficult, "Market research highlights concentrated high-end competition and capital/manufacturing barriers.", "Audited gross margin, foundry terms, software attach, and qualification cost per program."]
    notes: "The table separates strategic evidence from the missing proof needed to support a price-sensitive investment decision."
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "External OEM programs reach production; licensing and chip revenue become independently observable; qualification costs are shared with partners.", "A verified recurring revenue and margin base could support a market-based semiconductor multiple; no numeric range is supportable now.", "Execution, customer concentration, export controls, and platform competition.", "Plausible but unproven; requires contract and shipment evidence."]
      - [Base, "NIO and sub-brand deployment continues; external work remains pilots or early qualification; standalone financial disclosure stays limited.", "Strategic option value exists, but illiquidity and information asymmetry justify research-more rather than a premium entry.", "Capital intensity, long qualification cycles, transfer-pricing opacity, and no verified current mark.", "Most consistent with current public evidence."]
      - [Bear, "External commercialization fails or is delayed; policy/export restrictions worsen; funding and qualification needs exceed available support.", "Downside is driven by dilution, preference overhang, and impaired residual value; a numeric loss estimate is not supportable.", "Regulatory access, customer concentration, technical qualification, and financing terms.", "Material downside case; adverse evidence is present but company-specific financial exposure is unknown."]
    notes: "No probability percentages or valuation ranges are fabricated because the retained sources do not disclose standalone revenue, margins, cap-table terms, or a current Nio GeniTech valuation."
    claimRefs: [CV011, CV012, CV013, CV014, CV016]
