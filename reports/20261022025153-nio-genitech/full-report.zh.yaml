        - 汽车半导体供应商
        - 产能、成本或出口中断
        - 中
        - 采用双供应源并保持库存缓冲
        - 中高
    notes: 交易对手和情景来自公开报道；指定来源没有提供合同条款、排他性、出货量或供应商集中度百分比。
    claimRefs:
      - CR003
      - CR013
      - CR014
      - CR015
  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 当前评估
      - 决策含义
    rows:
      - - 建议
        - research-more
        - 在价格和独立运营证据验证前，不应据此承诺买入。
      - - 置信度
        - 中
        - 战略与市场信号已经显现，但财务分拆情况和估值仍不可见。
      - - 风险评级
        - 高
        - 认证、政策、集中度和融资透明度风险仍然重大。
      - - 估值判断
        - unknown
        - 保留来源尚未建立当前独立估值或可审计的收入基础。
    notes: 评估基于截至 2026-10-22 保留的公开证据；估值未知是有意保留，并不意味着估值为零。
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV002
    title: 正反论点
    columns:
      - 论点
      - 证据信号
      - 哪些证据会改变判断
    rows:
      - - 国产汽车芯片替代确实是一个战略市场
        - S&P Global Mobility 报告了政策和 OEM 转向本地芯片的动向。
        - 需要有证据证明 GeniTech 芯片在已点名外部 OEM 项目中的量产份额和定价。
      - - NIO 的部署可以提供示范平台
        - CNEV Post 报道 Shenji NX9031 部署于 2026 款 Onvo L90，Onvo 还自称拥有超过 200,000 名用户。
        - 需要独立的出货、质保和单位经济数据，而不是公司自报的用户数。
      - - 外部商业化存在可能
        - IT之家报道了重庆合资企业及据报道获得的技术许可收入。
        - 需要已签署的客户合同、出货记录、股权经济性和现金回款。
      - - 规模化经济性可能较难实现
        - 市场研究强调高端竞争集中，以及资本和制造门槛。
        - 需要经审计的毛利率、晶圆代工条款、软件附加率和每个项目的认证成本。
    notes: 该表将战略证据与支持价格敏感型投资决策所缺失的证明区分开来。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV015
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 估值或回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 外部 OEM 项目进入量产；许可收入和芯片收入可由独立来源观察；认证成本由合作伙伴分担。
        - 经验证的经常性收入和利润率基础或可支撑按市场定价的半导体估值倍数；目前无法支持任何数值区间。
        - 执行、客户集中度、出口管制和平台竞争。
        - 存在可能但尚未证实；需要合同和出货证据。
      - - 基准
        - NIO 及其子品牌继续部署；外部项目仍处于试点或早期认证阶段；独立财务披露仍然有限。
        - 战略期权价值存在，但流动性不足和信息不对称意味着应继续研究，而不是支付溢价进入。
        - 资本密集度、漫长认证周期、转移定价不透明，以及未经验证的当前估值。
        - 与当前公开证据最为一致。
      - - 悲观
        - 外部商业化失败或延迟；政策和出口限制恶化；融资与认证需求超过可用支持。
        - 下行风险来自稀释、优先权负担和剩余价值受损；无法支持数值化损失估计。
        - 监管准入、客户集中度、技术认证和融资条款。
        - 这是一个重大下行情景；已有反向证据，但公司层面的财务敞口未知。
    notes: 由于保留来源没有披露独立收入、利润率、股权结构表条款或 Nio GeniTech 当前估值，因此不虚构概率百分比或估值区间。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
