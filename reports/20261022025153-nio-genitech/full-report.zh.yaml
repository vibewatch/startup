  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场是汽车智能驾驶计算，包括支持辅助驾驶和车内推理的汽车 SoC、配套软件与支持服务。市场覆盖向 OEM 销售的芯片、联合开发或授权的芯片架构，以及部署所需的软件和集成；不包括整车、通用数据中心 GPU
              和无关的消费级 AI 加速器。买方按车型项目共同评估算力、算法、安全认证、内存、供应保障和集成工作，因此这一边界具有商业意义。NIO 从 Nvidia Orin-X 转向自有
              NX9031，显示出内部自研替代；NXP 的中央计算平台则代表更广泛的整车整合方案，而非直接等价的辅助驾驶芯片。市场因此同时包含直接芯片供应、联合设计和内部开发，OEM 工程团队仍保留维持现状的可信选项。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 测算视角与商业证据
        blocks:
          - type: paragraph
            body: >-
              对这家公司而言，自下而上的测算比单一 TAM 总量更可信。证据显示，潜在客户包括中国及全球 OEM 项目，但没有完整项目数量、芯片价格、装配率或 GeniTech 可服务份额。Horizon Robotics
              报告有 400 个设计定点车型、27 家全球车企及 2025 年 RMB3.8 billion 收入；CNEVPost 报道 NX9031 已用于 NIO 自有车辆中超过 200,000
              名用户。这些是市场参与指标，不能互换成市场规模。第二个视角是能力替代：OEM 有兴趣用国产高算力芯片替换 Nvidia 和 Qualcomm 硬件，但机会窗口较短，且面临更强的现有厂商
              和下一代产品压力。第三个视角是邻接市场：GeniTech 的定位覆盖车载芯片、具身智能和智能体推理，但没有来源独立测量这些市场的收入池。结论是受证据约束的机会，而不是已验证的 TAM/SAM/SOM 堆栈。
            claimRefs:
