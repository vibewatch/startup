companyProfile:
  summary: >-
    Nio GeniTech（亦称 Shenji）是 NIO 的智能驾驶半导体部门。公司于 2025 年 6 月分拆为独立法律实体，并在 2026 年 2 月获得外部融资，同时 NIO 保持控制权。公开记录显示，公司正从服务 NIO
    集团的汽车芯片转向对外授权及更广泛的 AI 计算应用；但独立经济性、治理条款和持久的外部客户承诺仍未得到验证。
