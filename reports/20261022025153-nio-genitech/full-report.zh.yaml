        - date: 2025-11
          label: 许可启动
          details: ChinaBizInsider 报道，GeniTech 于 2025 年末开始向第三方汽车芯片公司许可 NX9031 技术。
          tone: positive
          claimRefs:
            - CO012
        - date: '2026-02-26'
          label: 外部融资
          details: NIO 披露向新发行的 GeniTech 股份投入合计 RMB2.257 billion 现金。
          tone: positive
          claimRefs:
            - CO006
        - date: '2026-03-20'
          label: 据报道已与外部 OEM 洽谈
