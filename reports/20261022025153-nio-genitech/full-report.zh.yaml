        title: 图表与要点
        blocks:
          - type: callout
            title: 可服务市场取决于条件
            body: 证据支持 OEM 对国产智能驾驶计算的需求，但商业规模取决于外部量产项目，而非仅靠 NIO 内部采用。
            calloutType: insight
            claimRefs:
              - CM006
              - CM011
              - CM015
          - type: callout
            title: 出口管制与现有厂商路线图很重要
            body: 出口限制、制造资源和竞争产品周期，都可能缩短国产汽车芯片供应商赢得项目的窗口。
            calloutType: risk
            claimRefs:
