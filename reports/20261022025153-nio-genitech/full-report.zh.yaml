          - type: paragraph
            body: >-
              成本基础很可能由芯片设计、验证、软件适配、制造资源和客户认证主导，但公开证据没有说明各项分配。Yicai 报道 NX9031 研发成本为 CNY2.3 billion 至 CNY3 billion，Nio 称相较
              Nvidia Orin-X 每辆车约节省 CNY10,000；这些是公司报道数字，不是经审计的 GeniTech 单位经济。另一份报道称分拆前芯片团队超过 600
              人。证据支持较大的前期投入和潜在单车成本收益，但不支持贡献毛利、晶圆成本、良率、质保准备金、支持成本或客户
              CAC/回本周期，因此无法做出可靠的利润率预测。中国自研芯片初期可能与第三方用户集成不佳，也可能拉长认证和支持周期。
