      - number: '2.3'
        title: 买方、采用路径与限制
        blocks:
          - type: paragraph
            body: >-
              主要买方是 OEM 的半导体或智能驾驶部门，使用者是车辆软件和系统团队，实际付款方是车型项目或平台预算。导入从架构评估和软件适配开始，经过测试、功能安全及供应资格认证后，才进入量产
              设计定点。驱动因素包括成本控制、技术栈自主、模型驱动性能以及掌握算法层。GeniTech 通过芯片设计伙伴及共同持有的车载芯片公司开展联合开发，意图触达其他 OEM；NXP
              的生态模式也说明使能工具和伙伴支持是产品的一部分。限制因素很多：5nm 汽车芯片需要制造资源，出口管制可能适用于中国总部企业在境外的业务，OEM 可能抗拒竞争对手供应商的部件，Horizon 或其他
              现有厂商的新品也会压缩差异化窗口。没有公开来源证明 GeniTech 的外部设计定点转化、定价、毛利率或经常性授权经济性。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 估值相关性与未解的规模问题
        blocks:
          - type: paragraph
            body: >-
              同一架构可能复用于 NIO 车型、外部 OEM 项目及邻接推理应用，因此市场可以为 GeniTech
              提供战略期权价值。但这种期权价值不能视为当前经常性收入：公开记录主要证明产品部署、资本形成、客户拓展和技术定位。关键问题是，公司能否在不放弃自身车型路线图控制权的情况下，把这些信号变成可重复的外部项目。最重要的尽调要求包括签署的
              设计定点清单、量产起始日期、约定数量与价格、软件或 IP 授权条款、客户集中度、晶圆供应和出口管制审查。在资料到位前，市场规模只能是存在重大不确定性的合理区间，而非精确的可服务市场。
            claimRefs:
              - CM008
              - CM011
              - CM014
              - CM015
