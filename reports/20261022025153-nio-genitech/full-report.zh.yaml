      - number: '3.3'
        title: 定价、分销与切换成本
        blocks:
          - type: paragraph
            body: >-
              指定来源没有披露 GeniTech 的公开目录价、实际芯片 ASP、版税率或外部设计定点合同。唯一的变现证据是：GeniTech 于 2025 年末开始向第三方汽车芯片公司授权 NX9031 技术；另有报道称与
              Axera（爱芯元智）的合作产生数亿元技术授权费。这些都不等于经常性收入或公开价格。NIO 和 ONVO
              提供装机基础试验场，外部采用则需要集成、安全验证、软件支持以及对生态持续性的信心。车企自研可通过掌握车辆数据形成迭代护城河，这对 GeniTech 在 NIO 内部是优势，但向竞争 OEM
              销售时反而构成壁垒。验证期间买方可以同时采用或保留 NVIDIA/Horizon/Huawei，直到外部量产承诺披露前，GeniTech 的议价能力会受到削弱。
            claimRefs:
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              GeniTech 的护城河假设依赖三项资产：NIO 和 ONVO 车辆产生的量产数据、硬件软件协同设计，以及从芯片延伸到控制器和开发工具的平台。前两项在 NIO
              集团内部有可信证据，但在封闭渠道之外的持久性尚未验证。Black Sesame 的 2024 年招股书披露截至 2024 年 3 月 31 日有 23 个车型设计定点、SoC 出货超过
              156,000，并警告竞争者可能拥有更多资源。芯片市场可能赢家通吃，NVIDIA 保有软件生态优势，中国 OEM
              也可选择更便宜或捆绑式替代方案。美国出口管制还会限制先进外国部件的供应链和市场准入。GeniTech 的差异化有潜力，但公开记录尚未证明稳定的第三方锁定、广泛客户基础或可防守的溢价。
            claimRefs:
              - CP014
              - CP015
              - CP016
              - CP017
