  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争集合不只是自动驾驶芯片厂商。车企可以向 NVIDIA 购买通用加速器，采用 Horizon 的成本导向平台，使用 Huawei 的芯片加 ADS 栈，与另一家车企授权或联合开发，或保留内部设计团队。针对 15
              家中国独立 OEM 的分析称，市场围绕 NVIDIA、Huawei、Horizon 和自研芯片展开，并将 Li Auto、XPeng、NIO、Geely 视为差异化架构路径。约 200 TOPS
              的第三方芯片也能支持完整的点到点驾驶，因此 TOPS 高并非充分的采购标准。GeniTech 的方案是供应商平台而不只是芯片，已报道的组合包括 NX9031 系列硅片、域控制器和 RUDO
              开发套件；这也让公司暴露于现有厂商的软件生态、集成风险和 OEM 信任要求之下。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP014
      - number: '3.2'
        title: 能力与商业比较
        blocks:
          - type: paragraph
            body: >-
              公开能力证据更支持 GeniTech 的汽车级集成和内部部署，而非经独立验证的外部市场份额。ChinaEVHome 报告官方数字为 NX9031X 出货超过 200,000，同时指出其他媒体引用
              300,000；The Electric Viking 另称出货已超过 300,000，不能把差异压成一个精确数字。CNEVPost 报道 2026 ONVO L90 将采用自研 NX9031，NIO
              已在全系车型中采用，品牌称用户超过 200,000。GeniTech 据报采用 5nm NX9031U，风冷下最高 800 TOPS，平台还包含 28 核域控制器、CUDA 兼容工具链、Ubuntu 24.04
              LTS 和 ROS2 Jazzy 支持。这些功能可能降低开发者迁移摩擦，但主要来自公司描述或媒体报道；比较矩阵因此将未获支持的竞争对手价格、客户数和量产承诺标为未知。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
