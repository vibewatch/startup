      - number: '1.3'
        title: 里程碑与执行风险
        blocks:
          - type: paragraph
            body: >-
              里程碑显示，公司正从内部汽车部署走向外部化：NIO 芯片业务于 2025 年 6 月分拆，2025 年末出现对外授权报道，2026 年 2 月融资补充资本，Onvo 确认改款 2026 L90 将采用
              NX9031。IT之家还报道了与 Aixin Yuanzhi 的联合开发和供货路径，以及与 Leapmotor、Geely 的潜在接触；但指定证据未将这些讨论确认成量产承诺。Research and
              Markets 在 2026 年自研芯片比较中将 NIO 列为 1000 TOPS，说明其算力定位较高，并不等于外部验证的性能。核心执行考验，是 GeniTech 能否把 NIO 集团销量转化为可重复的外部
              设计导入，同时不在汽车、具身智能和智能体推理市场之间失焦。影响中国总部企业的出口管制及独立经济披露不足，增加了重大不确定性。Black Sesame 文件披露其截至 2024 年 3 月有 908
              名研发员工、2023 年研发费用 RMB1.3625 billion，这只能说明行业资本密集，不能作为 GeniTech 指标。
            claimRefs:
              - CO005
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
