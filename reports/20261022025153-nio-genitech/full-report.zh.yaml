            body: >-
              2026 年 2 月 26 日，NIO 披露向 GeniTech 新发行股份投入合计 RMB2.257 billion 现金。报道显示，交易后 NIO 子公司持股 62.7%，投资者合计持股
              27.3%，激励计划管理实体持股 10.0%；NIO 仍将 GeniTech 纳入合并范围。另一份分析称投后估值约 RMB8.3 billion，自分拆以来融资接近 RMB3
