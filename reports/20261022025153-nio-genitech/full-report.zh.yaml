          - type: paragraph
            body: >-
              合理决策是继续研究，而不是买入或回避。证据支持国产汽车芯片替代带来的有价值期权，但无法检验价格，因为公开记录没有当前独立估值，也没有足够运营数据构建可靠的收入或盈利倍数。纪律化入场需要经核实的 cap
              股权结构表、优先股堆叠、最新轮次条款、独立财务报表、与 NIO 的转移定价安排，以及带量产时间表的外部 OEM 设计定点
              合同。在此之前，投资者应把报道的融资数字视为融资背景信号，而不是企业当前可用现金，也不应把母公司交付量或芯片用户数转换成 GeniTech 收入。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              由于公开证据不足以支持可靠的点估值，情景分析只能是定性的。乐观情景假设已报道的外部供货进入可重复量产，授权或芯片收入变得可独立观察；基准情景假设 NIO
              及子品牌继续部署，但外部数量仍处于试点规模，认证和商业化持续消耗资本；悲观情景假设政策或出口限制、客户集中度或漫长汽车认证周期阻止足够的外部规模，此时战略重要性仍可能与疲弱的独立回报并存。上行空间合理存在，但财务和合同证据缺失，无法给出高置信度估值区间。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 退出准备度与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              退出准备度尚未得到验证。可信的重估需要披露外部 OEM 量产授予、按客户拆分的出货或授权收入、毛利证据、覆盖认证周期的资本需求，以及说明 NIO
              与芯片子公司或合资公司之间价值流向的治理权利。论点失效触发因素包括下一轮尽调前仍无独立可验证的外部量产、出口管制准入发生重大不利变化、认证周期超出可用资金，或融资条款赋予优先权并使普通股剩余价值很低。软件兼容性、制造资源、每瓦性能、客户集中度和资本需求，也应与
              TOPS 声称一并监测。
            claimRefs:
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
      - number: '8.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 价格敏感结论
            body: 继续研究：战略期权可信，但公开证据不支持经验证的入场价格、回报目标或独立估值。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
          - type: callout
            title: 核心论点失效
            body: 如果无法验证外部量产项目、客户级出货和融资条款，投资案例仍只是母公司的战略叙事，而不是可以据此承保的独立估值。
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
              - CV015
              - CV016
