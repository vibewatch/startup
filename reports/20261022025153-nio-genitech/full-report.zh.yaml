          details: NIO 将 GeniTech 分拆为独立法律实体。
          tone: neutral
          claimRefs:
            - CO002
        - date: 2025-11
          label: 外部开发路径
          details: IT之家报道 GeniTech 与 Aixin Yuanzhi 成立合资企业，面向外部供货。
          tone: neutral
          claimRefs:
