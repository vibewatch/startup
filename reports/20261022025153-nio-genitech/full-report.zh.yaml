    title: 公司概览
    sections:
      - number: '1.1'
        title: 主体与运营模式
        blocks:
          - type: paragraph
            body: >-
              Nio GeniTech（亦称 Shenji）负责 NIO 的智能驾驶芯片业务。现有记录显示，该业务最初是 NIO 为集团车型开发的自有芯片，随后于 2025 年 6
              月完成法律分拆，以支持独立融资和对外商业化。NX9031 系列是核心披露产品：NX9031X 据称已部署于 NIO 和 Onvo
              车型，其他型号则面向具身智能和推理负载。公司的运营模式分成两部分：向母集团生态供货，先获得装机基础；对外授权和第三方芯片销售，则是尚未验证的扩张路径。指定证据未确认公司网站、成立日期、总部、具名创始人或独立员工数。
