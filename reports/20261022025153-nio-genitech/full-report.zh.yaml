              留作员工激励。Multiples 将该轮报道为约 $329 million、估值 $1.4
              billion。这些数字代表融资额和投后估值，并不代表扣除运营及研发支出后当前可用现金。没有留存独立现金、月度消耗、债务、营运资金、现金续航或下一轮触发条件的公开声明。因此结论是有条件的：融资可支持商业化并分担研发风险，但在管理层提供独立财务报表、母公司转移定价条款、外部
              设计定点合同及现金桥接前，投资判断仍受阻。超过 150,000 颗芯片的部署及 Onvo L90 扩张说明 NIO 生态内有产品牵引力，但不是独立 GeniTech 收入。
