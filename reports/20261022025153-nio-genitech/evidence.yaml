evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited standalone GeniTech financial statements, cash-flow profile, debt, margins, and transfer-pricing policy
      with NIO.
    whyItMatters: >-
      The financing and reported valuation cannot be translated into operating quality, cash runway, or an investable
      semiconductor earnings profile without standalone economics.
    diligencePath: >-
      Request audited standalone statements, management accounts, related-party schedules, and the intercompany pricing
      policy from management or lead investors.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Named February 2026 investors, board composition, reserved matters, liquidation preferences, and incentive-plan
      terms.
    whyItMatters: >-
      NIO's 62.7% control percentage does not by itself reveal minority protections, economic priority, or decision
      rights.
    diligencePath: Obtain the definitive subscription agreements, amended articles, cap table, and board or shareholder resolutions.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: external-customers
    missingEvidence: >-
      Signed external customer contracts, design-win status, production timing, and shipment volumes outside NIO and
      Onvo.
    whyItMatters: The platform thesis depends on repeatable external commercialization rather than only captive parent demand.
    diligencePath: >-
      Request a customer pipeline by stage, signed contract extracts, production SOP dates, and independent customer
      references.
    relatedQuestionRefs:
      - QO006
  - type: access-blocked
    severity: minor
    topic: leadership
    missingEvidence: A current official leadership and board roster, registered headquarters, and standalone employee count.
    whyItMatters: >-
      The record supports founder-level sponsorship but cannot quantify key-person dependence, succession resilience, or
      present operating scale.
    diligencePath: >-
      Obtain the corporate registry extract, company leadership page, current payroll roster, and board minutes or
      investor presentation.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: valuation
    missingEvidence: >-
      Primary transaction documentation reconciling the reported RMB8.3 billion post-money valuation with the RMB2.257
      billion subscription and ownership percentages.
    whyItMatters: >-
      Different reported financing descriptors may reflect pre-money versus post-money conventions or different
      transaction scopes.
    diligencePath: Reconcile the transaction cap table and valuation definition against the signed subscription agreements.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A bottom-up market model with OEM program counts, chip ASPs, attach rates, geographic scope and GeniTech
      serviceable share.
    whyItMatters: Without a common denominator, broad automotive compute indicators cannot support a defensible SAM or SOM.
    diligencePath: >-
      Request management's market model and reconcile it to signed design wins, production schedules and third-party OEM
      data.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-proof
    missingEvidence: Executed external OEM design-win agreements, launch dates, volumes, pricing and licensing or royalty terms.
    whyItMatters: External production economics determine whether strategic option value becomes recurring revenue.
    diligencePath: Obtain a redacted customer pipeline and contract summary with production milestones and concentration.
    relatedQuestionRefs:
      - QM006
      - QM009
    relatedTableRefs:
      - TM003
  - type: access-blocked
    severity: material
    topic: export-controls
    missingEvidence: >-
      Company-specific semiconductor export-control assessment covering design, foundry, packaging and customer
      geography.
    whyItMatters: >-
      Restrictions can affect attainable process nodes, supply continuity and which external programs are legally
      serviceable.
    diligencePath: Review counsel's current classification and licensing analysis with the foundry and distribution chain.
    relatedQuestionRefs:
      - QM005
  - type: conflicting-data
    severity: minor
    topic: market-architecture
    missingEvidence: >-
      Comparable third-party estimates separating assisted-driving SoC revenue from central vehicle compute and adjacent
      inference.
    whyItMatters: Different architecture definitions can materially change the apparent market size and competitor set.
    diligencePath: Commission a source-reconciled market study with explicit product, geography, year and revenue boundaries.
    relatedQuestionRefs:
      - QM001
      - QM002
    relatedTableRefs:
      - TM001
      - TM002
  - type: missing-source
    severity: material
    topic: external-design-wins
    missingEvidence: >-
      Signed external OEM design wins, production start dates, committed volumes, and customer concentration for
      GeniTech chips.
    whyItMatters: >-
      Internal NIO and ONVO deployment validates engineering but does not establish a repeatable supplier business
      against NVIDIA, Horizon, or Huawei.
    diligencePath: >-
      Obtain customer contracts, nomination letters, production-volume schedules, and independent confirmation from each
      external OEM.
    relatedQuestionRefs:
      - QP003
      - QP004
      - QP006
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: GeniTech list and realized pricing by chip, controller, software, and licensing package.
    whyItMatters: >-
      Without ASPs, royalty terms, discounts, and support costs, competitive economics and margin durability cannot be
      compared.
    diligencePath: Request a product price book, representative contracts, royalty schedules, and customer-level gross-margin bridge.
    relatedQuestionRefs:
      - QP005
      - QP007
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: minor
    topic: shipments
    missingEvidence: >-
      A reconciled, dated shipment definition separating NX9031X shipments from total GeniTech-series shipments and user
      exposure.
    whyItMatters: >-
      Public reports cite more than 200,000 and more than 300,000 units, and the denominator and measurement date are
      not consistent.
    diligencePath: >-
      Reconcile wafer or finished-chip shipments, vehicle installations, and shipment dates to a company or auditor
      schedule.
    relatedQuestionRefs:
      - QP003
  - type: missing-source
    severity: material
    topic: software-ecosystem
    missingEvidence: >-
      Independent benchmark results, SDK adoption, developer counts, support SLA, and migration cost versus CUDA,
      Horizon, and Huawei stacks.
    whyItMatters: Software and integration friction may outweigh TOPS comparisons when OEMs select a production platform.
    diligencePath: >-
      Obtain benchmark methodology, SDK release history, support metrics, and references from external developers or OEM
      engineering teams.
    relatedQuestionRefs:
      - QP006
      - QP007
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: standalone-financials
    missingEvidence: >-
      Audited standalone income statement, balance sheet, cash-flow statement, and revenue-recognition policy for
      GeniTech.
    whyItMatters: >-
      Without standalone statements, financing raised and parent deployment cannot be translated into revenue quality,
      margin, or cash generation.
    diligencePath: >-
