  - id: FE001
    title: Reported product architecture and evidence boundaries
    type: stack
    summary: >-
      A four-layer view of the reported sensing-to-vehicle workflow, with unverified controls shown as diligence
      boundaries.
    data:
      layers:
        - label: Vehicle inputs
          modules:
            - label: Camera, radar, and LiDAR signals
              detail: >-
                CNEVPost describes the NX9031 as an ADAS processor used in an integrated vehicle system; exact sensor
                configurations are not disclosed.
            - label: Sensor calibration and synchronization
              detail: >-
                Required vehicle-integration dependency; the assigned sources do not disclose GeniTech's calibration
                tooling or coverage.
        - label: NX9031 silicon
          modules:
            - label: 5-nanometer automotive-grade SoC
              detail: >-
                Gasgoo and CNEVPost report the process and flagship-chip positioning; independent benchmark evidence is
                absent.
            - label: Memory and inference subsystem
              detail: >-
                CNEVPost reports 546 GB/s memory bandwidth; workload-level latency and power measurements are not
                independently available.
        - label: Driving software
          modules:
            - label: In-house software and NIO World Model
              detail: >-
                CNEVPost reports the world-model integration planned for the updated Onvo L90; production validation
                remains to be confirmed.
        - label: Safety and diagnostics
          modules:
            - label: Functional-safety and diagnostic controls
              detail: >-
                Automotive deployment requires these controls, but the assigned sources do not document GeniTech's
                certification or diagnostic package.
        - label: Update and support
          modules:
            - label: OTA lifecycle and field support
              detail: Long-term update, rollback, vulnerability-response, and field-return processes remain evidence gaps.
        - label: Vehicle deployment and support
          modules:
            - label: NIO and Onvo vehicle programs
              detail: >-
                Reported internal deployment is stronger than public evidence for external OEM qualification,
                cybersecurity, and lifecycle support.
