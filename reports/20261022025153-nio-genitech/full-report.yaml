  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is automotive intelligent-driving compute: automotive system-on-chips, associated
              software and support that enable assisted driving and related in-vehicle inference. It includes chips sold
              to original equipment manufacturers (OEMs), co-developed or licensed chip architectures, and the software
              and integration needed to deploy them. It excludes complete vehicles, general-purpose data-centre GPUs,
              and unrelated consumer AI accelerators. The boundary is commercially meaningful because buyer decisions
              are made at the vehicle-program level, where compute, algorithms, safety certification, memory, supply
              assurance and integration effort are jointly evaluated. NIO's disclosed move from Nvidia Orin-X toward its
              own NX9031 shows an internal-build substitute, while NXP's central-compute platform illustrates a broader
              vehicle consolidation alternative rather than a direct assisted-driving chip equivalent. The market
              therefore contains direct chip supply, co-design and internal development, with vehicle OEM engineering
              teams retaining a credible status-quo option.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and commercial evidence
        blocks:
          - type: paragraph
            body: >-
              A bottom-up lens is more credible than a single headline TAM for this company. The available evidence
              shows a potential customer pool of Chinese and global OEM programs, but it does not disclose a complete
              program count, chip price, attach rate or GeniTech serviceable share. Public operating signals show that
              Horizon Robotics reported 400 design-win models, 27 global automakers and 2025 revenue of RMB3.8 billion,
              while CNEVPost reported that NX9031 had been used by more than 200,000 users in NIO's own vehicles. These
              are market-participation indicators, not interchangeable market-size measures. A second lens is capability
              substitution: reporting describes OEM interest in replacing Nvidia and Qualcomm hardware with domestic
              high-compute chips, but it also describes a short opportunity window and pressure from stronger incumbents
              and future product generations. A third lens is adjacency: GeniTech's public positioning spans vehicle
              chips, embodied intelligence and agent inference, yet no source provides an independently measured revenue
              pool for those adjacencies. The resulting conclusion is an evidence-constrained opportunity, not a
              validated TAM/SAM/SOM stack.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM015
      - number: '2.3'
        title: Buyers, adoption path and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary buyer is an OEM semiconductor or intelligent-driving organization; the user is the vehicle
              software and systems team; and the economic payer is the vehicle program or platform budget. Adoption
              starts with architecture evaluation and software adaptation, then moves through testing, functional-safety
              and supply qualification before a production design win. The trigger is a combination of cost control,
              sovereignty of the technology stack, performance for model-based driving and a desire to control the
              algorithm layer. Evidence also points to a channel route: GeniTech's reported joint development through a
              chip-design partner and jointly owned vehicle-chip company was intended to reach other OEMs, while NXP's
              ecosystem model shows that enablement and partner support are part of the product. Constraints are
              substantial. A 5nm automotive chip requires difficult manufacturing access; export controls can apply to
              Chinese-headquartered companies outside China; OEMs may resist supplier components from a competitor; and
              future Horizon or other incumbent products can compress the differentiation window. No public source
              establishes GeniTech's external design-win conversion, pricing, gross margin or recurring licensing
              economics.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Valuation relevance and unresolved sizing
        blocks:
          - type: paragraph
            body: >-
              The market can support strategic option value for GeniTech because one architecture may be reused across
              NIO vehicles, external OEM programs and adjacent inference applications. That option value should not be
              treated as current recurring revenue: the public record mainly documents product deployment, capital
              formation, reported customer outreach and technical positioning. The valuation-relevant test is whether
              the company can turn those signals into repeatable external programs without giving up control of its own
              vehicle roadmap. The most important diligence requests are a signed design-win list, production start
              dates, contracted volumes and pricing, software or IP licensing terms, customer concentration, wafer
              supply and export-control review. Until those are supplied, market sizing remains a range of plausible
              lenses with material uncertainty rather than a precise serviceable market.
            claimRefs:
              - CM008
              - CM011
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The addressable market is conditional
            body: >-
              Evidence supports OEM demand for domestic intelligent-driving compute, but commercial scale depends on
              external production programs rather than NIO internal adoption alone.
            calloutType: insight
            claimRefs:
