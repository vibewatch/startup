      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The cost base is likely dominated by semiconductor design, verification, software adaptation,
              manufacturing access, and customer qualification, but the public evidence does not establish the
              allocation among those items. Yicai reports that NX9031 R&D cost CNY2.3 billion to CNY3 billion and that
              Nio described an approximately CNY10,000 per-vehicle cost advantage versus Nvidia's Orin-X; these are
              reported company figures, not audited GeniTech unit economics. A separate report says the chip team
              exceeded 600 people before the spinout, while CarNewsChina describes the R&D investment as billions of
              yuan using battery-swap-station comparisons. The evidence supports material upfront investment and a
              potential vehicle-level cost benefit, but not contribution margin, wafer cost, yield, warranty reserve,
              support cost, or customer CAC/payback. Those missing fields prevent a defensible margin forecast. The
              broader market also presents an adverse commercialization risk: independent industry reporting says
              Chinese in-house chips may initially integrate less well with third-party users, which could lengthen
              qualification and support cycles.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI012
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The February 2026 round is the clearest public capital event: Yicai reports CNY2.3 billion of cash for
              newly issued shares, a 27.3% investor stake, NIO retaining 62.7% control, and 10% reserved for employee
              incentives. Multiples reports the round as approximately $329 million at a $1.4 billion valuation. These
              figures describe financing raised and post-money valuation, not cash currently available after operating
              and R&D spending. There is no retained public statement here for standalone cash, monthly burn, debt,
              working capital, runway, or a next-round trigger. The financial verdict is consequently conditional: the
              round can fund commercialization and share R&D risk, but the investment case remains blocked until
              management provides standalone financial statements, parent transfer-pricing terms, external design-win
              contracts, and a cash bridge from financing to runway. Reported deployment of more than 150,000 chips and
              expansion into the Onvo L90 show product traction inside the NIO ecosystem, but neither measure is
              standalone GeniTech revenue or proof of external-customer cash conversion.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financial underwriting is disclosure-limited
            body: >-
              A large financing and reported per-vehicle savings do not establish revenue quality, cash runway, or
              profitability. The decisive diligence request is a standalone cash, revenue, cost, and related-party
              bridge.
