chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Nio GeniTech, also referred to as Shenji, is the semiconductor business responsible for NIO's
              intelligent-driving chip activities. The available record places its origin inside NIO as proprietary
              silicon for NIO-group vehicles, followed by a June 2025 legal separation intended to support independent
              capital raising and external commercialization. The NX9031 family is the core disclosed product line: the
              NX9031X is described as already deployed across NIO and Onvo vehicles, while other variants are positioned
              for embodied intelligence and inference workloads. This creates a two-part operating model: captive supply
              to the parent ecosystem provides an installed base, while licensing and third-party chip sales are the
              unproven expansion paths. The company website, founding date, headquarters, named founders, and standalone
              employee count were not established by the assigned evidence.
