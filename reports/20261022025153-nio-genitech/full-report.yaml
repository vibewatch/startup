  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than autonomous-driving chip vendors alone. A vehicle OEM can buy
              a general-purpose accelerator from NVIDIA, adopt a cost-oriented platform from Horizon, use Huawei's
              chip-plus-ADS stack, license or co-develop with another automaker, or keep an internal design team. An OEM
              can also retain a status quo of existing chips while it validates a replacement. An analyst review of 15
              Chinese independent OEMs describes a market organized around NVIDIA, Huawei, Horizon, and self-developed
              chips, while identifying Li Auto, XPeng, NIO, and Geely as differentiated architecture paths. The same
              review says third-party chips around 200 TOPS can support a full door-to-door link, so high TOPS alone is
              not a sufficient buying criterion. GeniTech's proposed answer is a supplier platform, not only a chip: the
              reported offer combines NX9031-series silicon, domain controllers, and the RUDO development kit. That
              expands the addressable buyer need but also exposes GeniTech to incumbent software ecosystems, integration
              risk, and OEM trust requirements.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP014
      - number: '3.2'
        title: Capability and commercial comparison
        blocks:
          - type: paragraph
            body: >-
              Publicly disclosed capability evidence favors GeniTech on automotive-grade integration and internal
              deployment, not on independently verified external market share. ChinaEVHome reports an official figure
              above 200,000 NX9031X shipments while noting that other media cited 300,000; The Electric Viking
              separately reports that shipments surpassed 300,000. This discrepancy should not be collapsed into a
              single precise number. CNEVPost reports that the 2026 ONVO L90 will use the in-house NX9031 and that NIO
              had adopted it across its lineup, with more than 200,000 users cited by the brand. The two reports
              therefore support meaningful internal validation, but not a clean external-customer count. GeniTech's
              reported 5nm NX9031U offers up to 800 TOPS under air cooling, and the platform includes a 28-core domain
              controller, CUDA-compatible tooling, Ubuntu 24.04 LTS, and ROS2 Jazzy support. Those features can reduce
              switching friction for developers, but the claims are primarily company-described or media-reported. The
              comparison matrix consequently marks unsupported competitor pricing, customer counts, and production
              commitments as unknown.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
