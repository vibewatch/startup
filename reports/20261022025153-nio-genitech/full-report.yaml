      - number: '1.2'
        title: Financing, control, and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              On 26 February 2026, NIO disclosed an aggregate RMB2.257 billion cash investment into newly issued
              GeniTech shares. The assigned reporting describes a post-transaction structure in which an NIO subsidiary
              retains 62.7%, the investors collectively hold 27.3%, and entities administering the incentive plan hold
              10.0%; NIO continues to consolidate GeniTech. A separate analysis reports an approximately RMB8.3 billion
              post-money valuation and close to RMB3 billion raised since the spin-out, but that valuation and
              cumulative amount are not presented in the assigned primary-style disclosure and should be treated as
              reported estimates rather than audited company financials. The complete investor list, preference stack,
              board rights, transfer-pricing arrangements, and standalone revenue, margin, cash-burn, and debt data
              remain open diligence items.
