      - number: '1.3'
        title: Milestones and execution risks
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a progression from internal automotive deployment to externalization: NIO's
              chip activity was separated in June 2025; an external licensing relationship was reported in late 2025;
              the February 2026 financing supplied new capital; and Onvo confirmed that the updated 2026 L90 would use
              the NX9031. IT之家 additionally reports a joint development and supply path involving Aixin Yuanzhi and
              possible discussions with Leapmotor and Geely, but those third-party customer discussions are not
              confirmed production commitments in the assigned evidence. Research and Markets places NIO at 1000 TOPS in
              its 2026 self-developed-chip comparison, indicating high compute positioning rather than externally
              verified performance. The principal execution test is whether GeniTech can convert NIO-group volume into
              repeatable external design-ins without losing focus across automotive, embodied-intelligence, and
              agent-inference markets. Export-control restrictions affecting Chinese-headquartered companies and limited
              disclosure on standalone economics add material uncertainty. Black Sesame's filing provides a sector
              benchmark of 908 R&D employees at March 2024 and RMB1.3625 billion of 2023 R&D expense, underscoring
              capital intensity rather than establishing a GeniTech metric.
