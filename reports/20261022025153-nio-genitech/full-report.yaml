  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              GeniTech is presented publicly as NIO's in-house automotive semiconductor business, with the Shenji NX9031
              as its flagship product. Gasgoo reports that the processor is a 5-nanometer automotive-grade chip, that
              NIO says it has been in mass production since 2024, and that shipments exceeded 150,000 sets. CNEVPost
              separately reports that NIO's Onvo brand planned to equip the updated 2026 L90 with the NX9031 and the NIO
              World Model. These sources support a customer workflow in which the chip, perception software, and
              vehicle-level driving functions are integrated into an OEM platform. They do not establish a standalone
              merchant-chip customer base, realized external revenue, or production commitments from other automakers.
              The strongest current product proof is therefore internal vehicle deployment, while external
              commercialization remains a diligence question.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
