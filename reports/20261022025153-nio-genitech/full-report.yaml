      - number: '3.3'
        title: Pricing, distribution, and switching costs
        blocks:
          - type: paragraph
            body: >-
              No assigned source provides a public GeniTech list price, realized chip ASP, royalty rate, or external
              design-win contract. The only reported monetization evidence is that GeniTech began licensing NX9031
              technology to a third-party automotive-chip company in late 2025 and that a separate report describes a
              collaboration with Axera (爱芯元智) that generated several hundred million yuan of technology-licensing fees;
              these are not equivalent to recurring revenue or a published price. Distribution is similarly asymmetric:
              NIO and ONVO provide an installed-base proving ground, while external adoption requires integration,
              safety validation, software support, and confidence that GeniTech will maintain an ecosystem. The analyst
              review describes automaker self-development as a way to capture vehicle data for iteration, which is a
              potential moat for GeniTech inside NIO but a barrier when selling to competing OEMs. A buyer can therefore
              multi-home or retain NVIDIA/Horizon/Huawei during validation, weakening GeniTech's negotiating leverage
              until external production commitments are disclosed.
            claimRefs:
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              GeniTech's moat thesis rests on three linked assets: production data from NIO and ONVO vehicles,
              hardware-software co-design, and a platform that extends from chips into controllers and developer tools.
              The evidence is credible for the first two inside the NIO group, but durability outside that captive
              channel is unproven. Black Sesame's 2024 prospectus illustrates a scaled specialist alternative, reporting
              23 vehicle-model design wins and more than 156,000 SoCs shipped as of March 31, 2024; it also warns that
              competitors may have materially greater resources and that intellectual-property protection may not
              prevent competition. An adverse market signal is therefore structural rather than a single product
              failure: the chip market can exhibit winner-takes-all dynamics, NVIDIA retains software-ecosystem
              advantages, and Chinese OEMs can choose lower-cost or bundled alternatives. U.S. export-control guidance
              also confirms that licensing requirements apply to businesses headquartered in China or owned by a
              China-headquartered parent, adding a supply-chain and market-access constraint for advanced foreign
              components. GeniTech's differentiation is promising, but the public record does not yet establish durable
              third-party lock-in, a broad customer base, or a defensible price premium.
            claimRefs:
              - CP014
              - CP015
              - CP016
              - CP017
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Internal deployment is the clearest proof point
            body: >-
              GeniTech has reported production exposure through NIO and ONVO and a broader platform scope than a bare
              silicon component, creating a credible starting point for iteration and integration.
            calloutType: strength
            claimRefs:
              - CP004
              - CP005
              - CP006
          - type: callout
            title: External supplier economics remain unproven
            body: >-
              The public record does not establish external production volumes, realized pricing, recurring licensing
              economics, or customer concentration, so internal validation should not be treated as durable third-party
              moat.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP012
          - type: callout
            title: Ecosystem and trust may matter more than peak TOPS
            body: >-
              The assigned analyst review says lower-compute third-party chips can support full-scenario driving, while
              reporting also identifies software-ecosystem and trust advantages for incumbents; GeniTech must prove
              integration and support, not only specifications.
            calloutType: insight
            claimRefs:
              - CP003
              - CP009
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              The available company profile describes Nio GeniTech as a privately held, B2B business whose revenue model
              is product sales. That is a useful classification, but it is not evidence of recognized revenue or
              realized pricing. The operating model appears to have two possible streams: selling chips into vehicle
              programs and licensing the underlying technology to external customers. Yicai reports that the February
              financing supports continued development and promotion of high-end chips, while Tech in Asia reports that
              Shenji is open to external customers. An industry-trade page repeats NIO's announcement that the chip is
              open to broader collaboration, and IT Home reports several hundred million yuan of technology-licensing
              fees through the Axera cooperation; neither establishes audited GeniTech revenue. No retained source
              discloses contract value, shipment revenue, gross margin, payment terms, backlog, or recognition policy.
              The core underwriting question is therefore whether external volume and pricing can turn a parent-funded
              engineering asset into repeatable, independently reported revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI014
