company:
  name: Nio GeniTech
chapter:
  number: 1
  title: Company Overview
  summary: Nio GeniTech (Shenji) is NIO's intelligent-driving semiconductor arm, separated into a standalone legal entity in June 2025 and externally financed in February 2026 while NIO retained control. Public evidence supports a transition from captive automotive silicon toward external licensing and broader AI-compute applications, but standalone financials, complete governance terms, and durable external customer commitments remain undisclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: "Nio GeniTech, also referred to as Shenji, is the semiconductor business responsible for NIO's intelligent-driving chip activities. The available record places its origin inside NIO as proprietary silicon for NIO-group vehicles, followed by a June 2025 legal separation intended to support independent capital raising and external commercialization. The NX9031 family is the core disclosed product line: the NX9031X is described as already deployed across NIO and Onvo vehicles, while other variants are positioned for embodied intelligence and inference workloads. This creates a two-part operating model: captive supply to the parent ecosystem provides an installed base, while licensing and third-party chip sales are the unproven expansion paths. The company website, founding date, headquarters, named founders, and standalone employee count were not established by the assigned evidence."
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: financing-control-and-stakeholders
    title: Financing, control, and stakeholder structure
    body: "On 26 February 2026, NIO disclosed an aggregate RMB2.257 billion cash investment into newly issued GeniTech shares. The assigned reporting describes a post-transaction structure in which an NIO subsidiary retains 62.7%, the investors collectively hold 27.3%, and entities administering the incentive plan hold 10.0%; NIO continues to consolidate GeniTech. A separate analysis reports an approximately RMB8.3 billion post-money valuation and close to RMB3 billion raised since the spin-out, but that valuation and cumulative amount are not presented in the assigned primary-style disclosure and should be treated as reported estimates rather than audited company financials. The complete investor list, preference stack, board rights, transfer-pricing arrangements, and standalone revenue, margin, cash-burn, and debt data remain open diligence items."
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: milestones-and-execution-risks
    title: Milestones and execution risks
    body: "The milestone record shows a progression from internal automotive deployment to externalization: NIO's chip activity was separated in June 2025; an external licensing relationship was reported in late 2025; the February 2026 financing supplied new capital; and Onvo confirmed that the updated 2026 L90 would use the NX9031. IT之家 additionally reports a joint development and supply path involving Aixin Yuanzhi and possible discussions with Leapmotor and Geely, but those third-party customer discussions are not confirmed production commitments in the assigned evidence. Research and Markets places NIO at 1000 TOPS in its 2026 self-developed-chip comparison, indicating high compute positioning rather than externally verified performance. The principal execution test is whether GeniTech can convert NIO-group volume into repeatable external design-ins without losing focus across automotive, embodied-intelligence, and agent-inference markets. Export-control restrictions affecting Chinese-headquartered companies and limited disclosure on standalone economics add material uncertainty. Black Sesame's filing provides a sector benchmark of 908 R&D employees at March 2024 and RMB1.3625 billion of 2023 R&D expense, underscoring capital intensity rather than establishing a GeniTech metric."
    claimRefs: [CO005, CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: []
    figureRefs: []
