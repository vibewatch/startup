callouts:
  - calloutType: strength
    title: Controlled platform with an installed base
    body: "NIO retains control and consolidation while the NX9031 family is already reported in NIO and Onvo vehicles, giving GeniTech a real internal deployment channel before external expansion."
    claimRefs: [CO004, CO007, CO013]
  - calloutType: risk
    title: Commercial proof is ahead of disclosure
    body: "The assigned evidence supports financing and reported licensing activity, but it does not establish standalone revenue, audited profitability, a complete investor roster, or binding external production volumes."
    claimRefs: [CO008, CO009, CO010, CO014]
  - calloutType: recommendation
    title: Treat the financing as validation, not operating proof
    body: "The February 2026 financing is a meaningful external signal, but diligence should wait for named investors, governance terms, audited standalone economics, and repeatable third-party design-ins before underwriting platform-level value."
    claimRefs: [CO006, CO009, CO010, CO014]
