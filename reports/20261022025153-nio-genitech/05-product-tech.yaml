  name: Nio GeniTech
chapter:
  number: 5
  title: Product & Technology
  summary: Nio GeniTech's public product evidence centers on the Shenji NX9031 automotive ADAS SoC, described as a 5-nanometer, in-house chip already deployed across NIO vehicles and being extended toward Onvo. The public record supports a credible integrated chip-and-software product direction, but leaves material uncertainty around external-customer production, independent performance validation, security controls, and the broader product roadmap.
sections:
  - id: product-definition
    title: Product and customer workflow
    body: >-
      GeniTech is presented publicly as NIO's in-house automotive semiconductor
      business, with the Shenji NX9031 as its flagship product. Gasgoo reports
      that the processor is a 5-nanometer automotive-grade chip, that NIO says
      it has been in mass production since 2024, and that shipments exceeded
      150,000 sets. CNEVPost separately reports that NIO's Onvo brand planned
      to equip the updated 2026 L90 with the NX9031 and the NIO World Model.
      These sources support a customer workflow in which the chip, perception
      software, and vehicle-level driving functions are integrated into an
      OEM platform. They do not establish a standalone merchant-chip customer
      base, realized external revenue, or production commitments from other
      automakers. The strongest current product proof is therefore internal
      vehicle deployment, while external commercialization remains a diligence
      question.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-maturity
    title: Architecture, maturity, and differentiation
    body: >-
      The available evidence describes an integrated automotive compute
      platform rather than a disclosed chip specification sheet. Gasgoo
      attributes four conventional-chip-equivalent computing power to the
      NX9031 and reports more than 150,000 shipped sets; CNEVPost adds
      reported figures of more than 50 billion transistors and 546 GB/s memory
      bandwidth. IT Home reports that the former NIO chip team exceeded 600
      people and that a later collaboration with AiMOGA retained core modules
      and architecture while developing a new chip. Those are company or
      media-reported signals, not independent benchmark results. Competitor
      disclosures show the comparison bar: Qualcomm describes Snapdragon Ride
      as a scalable automaker platform, while Renesas documents 34 TOPS,
      safety-oriented cores, camera/radar/LiDAR interfaces, and an SDK for its
      R-Car V4H. GeniTech's differentiation may lie in vehicle-software
      integration and NIO data or deployment feedback, but public evidence
      does not yet verify comparative TOPS, latency, power, functional-safety
      certification, or reusable developer tooling.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-trust-gaps
    title: Deployment, trust, and technical diligence
    body: >-
      Deployment evidence is stronger than disclosure evidence. CNEVPost says
      the NX9031 has been used across NIO's main-brand lineup and reports that
      the updated Onvo L90 would add the chip alongside a new world-model
      software release. IT Home describes a move toward supplying external
      vehicle makers through a joint venture and says a second chip was in
      production, but the article does not provide contracts, acceptance
      criteria, or independently verified volumes. The assigned public sources
      also do not document GeniTech's security threat model, vulnerability
      response, privacy controls, incident history, ISO/ASPICE evidence,
      ASIL certificate, field-failure rate, OTA rollback process, or long-term
      support policy. These omissions matter because automotive compute
      products must pass both vehicle integration and safety/reliability
      gates. The immediate diligence priority is a customer-ready technical
      package: architecture and benchmark data, safety and cybersecurity
      artifacts, production-quality metrics, and signed external design-win
      evidence.
    claimRefs: [CE011, CE012, CE013, CE014]
    tableRefs: []
    figureRefs: []
