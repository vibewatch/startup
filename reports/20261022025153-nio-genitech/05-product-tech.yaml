      - ["Operate safely over vehicle life", "OEM requires functional safety, cybersecurity, OTA, and field support", "Public sources describe product claims but not the control package", "Safety and reliability are material purchase criteria", "Security controls, incident response, and field-failure evidence are undisclosed"]
    notes: >-
      The table separates reported product use from unverified benefits and
      identifies the evidence needed to convert each workflow into a
      production reference.
    claimRefs: [CE002, CE003, CE011, CE012, CE013]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or open question]
    rows:
      - ["Vehicle sensing and perception", "Ingest camera, radar, and potentially LiDAR signals for driver assistance", "Vehicle sensor suite and calibration", "Sensor-fusion performance and coverage are not publicly quantified"]
      - ["NX9031 compute silicon", "Execute autonomous-driving inference and related workloads", "Advanced-node manufacturing and automotive qualification", "Yield, thermal envelope, power, and independent benchmark data are unavailable"]
      - ["Embedded software and world-model layer", "Turn compute into driving, parking, and active-safety behavior", "Model training data, software validation, and OTA tooling", "Model failure modes, rollback, and update governance are undisclosed"]
      - ["Vehicle integration and support", "Integrate ECU, safety mechanisms, diagnostics, and field updates", "NIO/Onvo engineering and supplier ecosystem", "External OEM integration burden and lifecycle support capacity are unproven"]
    notes: >-
      This is an evidence-bounded operating model assembled from reported
      product and deployment descriptions; it is not a disclosed GeniTech
      architecture diagram.
    claimRefs: [CE002, CE005, CE006, CE012, CE013]
figures:
  - id: FE001
    title: Reported product architecture and evidence boundaries
    type: stack
    summary: A four-layer view of the reported sensing-to-vehicle workflow, with unverified controls shown as diligence boundaries.
    data:
      layers:
        - label: Vehicle inputs
          modules:
            - label: Camera, radar, and LiDAR signals
              detail: CNEVPost describes the NX9031 as an ADAS processor used in an integrated vehicle system; exact sensor configurations are not disclosed.
            - label: Sensor calibration and synchronization
              detail: Required vehicle-integration dependency; the assigned sources do not disclose GeniTech's calibration tooling or coverage.
        - label: NX9031 silicon
          modules:
            - label: 5-nanometer automotive-grade SoC
              detail: Gasgoo and CNEVPost report the process and flagship-chip positioning; independent benchmark evidence is absent.
            - label: Memory and inference subsystem
              detail: CNEVPost reports 546 GB/s memory bandwidth; workload-level latency and power measurements are not independently available.
        - label: Driving software
          modules:
            - label: In-house software and NIO World Model
              detail: CNEVPost reports the world-model integration planned for the updated Onvo L90; production validation remains to be confirmed.
        - label: Safety and diagnostics
          modules:
            - label: Functional-safety and diagnostic controls
              detail: Automotive deployment requires these controls, but the assigned sources do not document GeniTech's certification or diagnostic package.
        - label: Update and support
          modules:
            - label: OTA lifecycle and field support
              detail: Long-term update, rollback, vulnerability-response, and field-return processes remain evidence gaps.
        - label: Vehicle deployment and support
          modules:
            - label: NIO and Onvo vehicle programs
              detail: Reported internal deployment is stronger than public evidence for external OEM qualification, cybersecurity, and lifecycle support.
    claimRefs: [CE001, CE002, CE005, CE011, CE012]
callouts:
  - calloutType: strength
    title: Internal deployment is the clearest product proof
    body: Reported mass production and use across NIO vehicles provide a stronger maturity signal than an announcement-only prototype, although the figures remain company or media reported.
    claimRefs: [CE001, CE002, CE003]
  - calloutType: risk
    title: External commercialization and safety evidence remain open
    body: The pool does not provide signed external design wins, independent benchmarks, cybersecurity controls, safety certificates, or field-reliability data.
    claimRefs: [CE011, CE012, CE013, CE014]
