  evidenceGaps:
    - type: missing-source
      severity: material
      topic: external-commercialization
      missingEvidence: Signed external OEM design wins, qualification status, production start dates, and committed volumes for customers outside NIO.
      whyItMatters: External production evidence determines whether the product is a repeatable merchant platform or primarily an internal NIO capability.
      diligencePath: Request anonymized contracts, design-win letters, customer qualification milestones, and shipment schedules from management.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: benchmarking
      missingEvidence: Independent benchmark package covering TOPS, latency, power, thermal limits, memory bandwidth, and representative workloads.
      whyItMatters: Marketing-level compute comparisons cannot establish competitive performance, vehicle cost, or deployment feasibility.
      diligencePath: Obtain lab reports, silicon revision data, workload definitions, and third-party or customer validation.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: trust-and-safety
      missingEvidence: Functional-safety, cybersecurity, privacy, quality, incident-response, and OTA lifecycle documentation.
      whyItMatters: Safety and support controls are gating requirements for automotive deployment and can create liability or recall exposure.
      diligencePath: Request ISO/ASPICE and ISO 26262 evidence, threat models, vulnerability disclosures, field-return statistics, and update governance.
      relatedQuestionRefs: [QE006, QE009, QE010]
    - type: enumeration-incomplete
      severity: minor
      topic: product-roadmap
      missingEvidence: Authoritative product catalog covering current and planned chips, software releases, supported vehicle programs, and roadmap dates.
      whyItMatters: A single flagship chip and media reports do not establish the breadth, cadence, or support horizon of the product line.
      diligencePath: Obtain the current product brief, lifecycle policy, roadmap, and release notes under NDA.
      relatedQuestionRefs: [QE002, QE004]
