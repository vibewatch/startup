  evidenceGaps:
    - type: missing-source
      severity: material
      topic: external-design-wins
      missingEvidence: Signed external OEM design wins, production start dates, committed volumes, and customer concentration for GeniTech chips.
      whyItMatters: Internal NIO and ONVO deployment validates engineering but does not establish a repeatable supplier business against NVIDIA, Horizon, or Huawei.
      diligencePath: Obtain customer contracts, nomination letters, production-volume schedules, and independent confirmation from each external OEM.
      relatedQuestionRefs: [QP003, QP004, QP006]
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: GeniTech list and realized pricing by chip, controller, software, and licensing package.
      whyItMatters: Without ASPs, royalty terms, discounts, and support costs, competitive economics and margin durability cannot be compared.
      diligencePath: Request a product price book, representative contracts, royalty schedules, and customer-level gross-margin bridge.
      relatedQuestionRefs: [QP005, QP007]
      relatedTableRefs: [TP003]
    - type: conflicting-data
      severity: minor
      topic: shipments
      missingEvidence: A reconciled, dated shipment definition separating NX9031X shipments from total GeniTech-series shipments and user exposure.
      whyItMatters: Public reports cite more than 200,000 and more than 300,000 units, and the denominator and measurement date are not consistent.
      diligencePath: Reconcile wafer or finished-chip shipments, vehicle installations, and shipment dates to a company or auditor schedule.
      relatedQuestionRefs: [QP003]
    - type: missing-source
      severity: material
      topic: software-ecosystem
      missingEvidence: Independent benchmark results, SDK adoption, developer counts, support SLA, and migration cost versus CUDA, Horizon, and Huawei stacks.
      whyItMatters: Software and integration friction may outweigh TOPS comparisons when OEMs select a production platform.
      diligencePath: Obtain benchmark methodology, SDK release history, support metrics, and references from external developers or OEM engineering teams.
      relatedQuestionRefs: [QP006, QP007, QP008]
