callouts:
  - calloutType: strength
    title: Internal deployment is the clearest proof point
    body: GeniTech has reported production exposure through NIO and ONVO and a broader platform scope than a bare silicon component, creating a credible starting point for iteration and integration.
    claimRefs: [CP004, CP005, CP006]
  - calloutType: risk
    title: External supplier economics remain unproven
    body: The public record does not establish external production volumes, realized pricing, recurring licensing economics, or customer concentration, so internal validation should not be treated as durable third-party moat.
    claimRefs: [CP010, CP011, CP012]
  - calloutType: insight
    title: Ecosystem and trust may matter more than peak TOPS
    body: The assigned analyst review says lower-compute third-party chips can support full-scenario driving, while reporting also identifies software-ecosystem and trust advantages for incumbents; GeniTech must prove integration and support, not only specifications.
    claimRefs: [CP003, CP009, CP016]
