company:
  name: Nio GeniTech
chapter:
  number: 6
  title: Customers
  summary: Nio GeniTech has a credible internal beachhead through NIO and reported integration into the Onvo L90, but public evidence for external OEM production deployments, repeat commercial purchases, retention, and customer concentration remains limited. The customer thesis therefore depends on converting internal validation and partner testing into independently verifiable production programs.
sections:
  - id: customer-segments
    title: Customer segments and buying path
    body: "Nio GeniTech's visible customer surface is best understood as two layers rather than as a disclosed account base. The first layer is the NIO group, where the Shenji NX9031 is reported as deployed across the NIO main-brand lineup and is being extended to Onvo. This is meaningful product usage, but it is captive demand and does not by itself demonstrate arm's-length willingness to pay. The second layer is external automotive customers: IT之家 reports that Shenji and 爱芯元智 (Aixin Yuanzhi) have been contacting Leapmotor and Geely, while the same report describes a joint-development and external-supply route rather than named production contracts. Nio GeniTech therefore appears to sell into an OEM design-in process with long validation cycles, software and hardware integration requirements, and procurement decisions that are not yet fully observable in the public record."
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and named deployment proof
    body: "The strongest public adoption evidence is deployment inside the parent ecosystem, not a broad independent customer roster. CNEVPost reports that the NX9031 had provided an intelligent-driving experience for over 200,000 users and that the updated 2026 Onvo L90 would use the chip. NIO's own site presents a user-facing service ecosystem around its vehicles, but it does not disclose GeniTech's standalone customer count, chip revenue, utilization, or contract economics. Horizon's investor-relations disclosures illustrate the type of external proof a scaled automotive-chip supplier can publish—vehicle-brand adoption, designated models, and end-user reach—yet those figures describe Horizon, not GeniTech, and are included only as a market comparability reference. The available record supports an adoption milestone and a group deployment; it does not establish repeat purchases, conversion rates, or external production volume."
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-and-expansion
    title: Durability, expansion, and concentration risk
    body: "No assigned source reports GeniTech NRR, GRR, churn, renewal rates, contract length, cohort retention, or customer concentration. The reported path from NIO deployment to Onvo integration and possible external supply is an expansion hypothesis, not measured land-and-expand performance. The February financing report says external investors took 27.3% and that the transaction was viewed as a signal of commercial potential, but financing participation is not customer evidence. Competitor materials show that automotive semiconductor commercialization is often expressed through multi-brand adoption and large installed bases; GeniTech has not publicly disclosed equivalent independent denominators. The diligence conclusion is therefore asymmetric: internal deployment lowers product-adoption uncertainty, while customer durability and revenue diversification remain material unresolved risks."
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
callouts:
  - calloutType: strength
    title: Captive deployment is a real validation step
    body: "Reported use of the NX9031 across NIO's main brand and the planned Onvo L90 integration provide evidence that the chip is moving through a production-vehicle pathway, even though the evidence is not independent customer retention proof."
    claimRefs: [CU001, CU005]
  - calloutType: risk
    title: External customer conversion is not yet demonstrated
    body: "Public reporting describes contact, testing, and potential supply relationships with other automakers, but the assigned evidence does not establish a named external OEM production contract, purchase volume, or recurring revenue."
    claimRefs: [CU003, CU004, CU012]
  - calloutType: recommendation
    title: Request customer-contract evidence before underwriting scale
    body: "Obtain anonymized design-win and production-volume schedules, customer contract terms, renewal or follow-on evidence, and revenue concentration by customer before treating external expansion as durable."
    claimRefs: [CU009, CU010, CU012]
