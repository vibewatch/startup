  title: Public proof is stronger than a logo wall
  body: Zip has a meaningful set of current named case studies with concrete metrics, not just customer logos. That clears the real-adoption bar for chapter 6.
  claimRefs:
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU025
  - CU026
- calloutType: insight
  title: The expansion wedge is orchestration becoming control layer
  body: The clearest expansion pattern is not seat growth alone; it is Zip becoming the front door that other procurement, legal, AP, and AI workflows start depending on.
  claimRefs:
  - CU005
  - CU008
  - CU010
  - CU023
- calloutType: risk
  title: Retention and concentration remain underwriting gaps
  body: Public sources show wins and complaints, but they still do not reveal NRR, GRR, churn, contract terms, or top-customer share. Those must come from diligence materials.
  claimRefs:
  - CU027
  - CU028
  - CU035
  - CU037
  - CU038
