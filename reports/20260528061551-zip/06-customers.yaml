- id: TU006
  title: Adverse signals and disclosure gap table
  columns:
  - Signal
  - Evidence
  - Potential impact
  - Confidence
  - Diligence ask
  rows:
  - - Vendor master data controls
    - G2 reviewer says payment terms and currency cannot be locked in vendor master data inside workflow
    - Could create policy leakage or rework in AP-heavy deployments
    - Medium
    - Request product roadmap and customer examples of master-data governance
  - - AP inbox and attachment handling
    - G2 reviewer flags slow loading, PDF-only inbox behavior, and attachment limitations
    - Could reduce AP-team satisfaction and constrain invoice workflows
    - Medium
    - Request current AP module usage, backlog, and support-ticket volume
  - - Reporting and manual queue friction
    - G2 and TrustRadius surface reporting limitations and manual process elements
    - Could slow executive reporting and weaken procurement ROI storytelling
    - Medium
    - Request customer retention by reporting-heavy use cases and roadmap timing
  - - Support coverage and integration breaks
    - Software Advice cites western-time-zone admin coverage and recurring Ironclad integration issues
    - Could matter for EMEA / APAC renewals or complex legal-workflow deployments
    - Medium
    - Request support SLA coverage by region and integration incident history
  - - Public churn / failed pilot evidence
    - No retained source names a failed pilot, blocked rollout, or customer churn event
    - Disclosure gap means durability cannot be fully underwritten from public evidence
    - Low
    - Request churned-customer list, failed POCs, and post-mortems for lost expansions
  notes: 'Adverse evidence comes mainly from independent review surfaces rather than public customer loss disclosures. That asymmetry is itself informative: the operational complaints are visible, but their revenue consequence is not.'
