- id: expansion-retention-friction
  title: Expansion patterns, durability proxies, and procurement friction
  body: |-
    Public evidence points to a consistent land-and-expand motion. Zip often lands as the intake or orchestration layer that replaces spreadsheets, email, Jira, Coupa, or other disconnected tools; it then widens into procure-to-pay, sourcing, payments, vendor cards, AI agents, or broader departmental rollout. Canva's current story lists a broad multi-product footprint across intake-to-procure, procure-to-pay, sourcing, global payments, vendor cards, and an integration platform. Anthropic describes moving from corporate cards into a structured P2P process. OpenAI moved from an initial AI agent into 10+ agents. ADT expanded from an IT-led pilot into a broader orchestration layer. Datadog's story frames Zip as the replacement for a prior Coupa-centered stack rather than as a point feature.

    Durability, however, is where disclosure thins out. Public materials do not disclose exact customer count, NRR, GRR, logo churn, average contract length, or top-customer share. The strongest durability proxies are qualitative: multiple current stories describe broader scope after initial deployment; G2 shows 83 reviews and recent activity; review sites repeatedly praise implementation speed, workflow flexibility, integrations, and responsive support. Those same reviews also surface friction that could matter in renewals if unresolved. G2 and Software Advice describe vendor-master-data constraints, AP inbox and PDF-handling limits, slow loading, reporting gaps, manual queues, western-time-zone support constraints, and recurring Ironclad integration breakage. These are not thesis-breakers on their own, but they do show that Zip's adoption story includes real operational drag at the edge of complex deployments.
