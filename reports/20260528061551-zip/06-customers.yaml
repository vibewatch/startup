- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Current evidence
  - Impact if real
  - Confidence
  - Diligence path
  rows:
  - - Land on orchestration, then expand into wider suite
    - Canva, Anthropic, OpenAI, and ADT all show broader scope after initial deployment
    - Supports strong NRR if attach rates generalize beyond public references
    - Medium
    - Request module attach-rate by cohort and expansion bookings by product
  - - AI agents as upsell vector
    - OpenAI moved from one agent to 10+; Zip and news sources frame AI agents as major recent customer value lever
    - Could raise platform stickiness and ACV at strategic accounts
    - Medium
    - Request AI-agent penetration and paid vs. bundled agent usage
  - - Platform consolidation / rip-and-replace motion
    - Datadog replaced Coupa-centered workflow; several customers replaced spreadsheets, email, Jira, or homegrown tools
    - Raises switching costs once Zip becomes the control layer
    - Medium
    - Request competitive displacement win rates and post-go-live renewal rates
  - - Staged rollout from one function into wider enterprise
    - ADT started with IT procurement before broader rollout
    - Positive proof that initial land can expand across departments
    - Medium
    - Request rollout timelines and module expansion for pilot-origin accounts
  - - Revenue concentration by top customers
    - Not publicly disclosed
    - A few Fortune 500 customers could still dominate ARR even if proof quality is high
    - Low
    - Request top-10 customer revenue share, churn, and renewal dates
  - - Segment concentration in visible proof
    - Public case studies lean enterprise and complex regulated buyers; startup / SMB proof is thin
    - Could mean Zip's lower-end motions are less proven than marketing suggests
    - Medium
    - Request logo count, ACV, and churn by company-size bucket
  notes: 'The strongest public expansion evidence comes from scope-widening case studies, while the strongest concentration risk evidence comes from what Zip does not disclose. Public proof is therefore asymmetric: clear on wins, thin on mix.'
