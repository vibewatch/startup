- id: concentration-adverse-gaps
  title: Concentration risk, adverse evidence, and remaining gaps
  body: |-
    The visible proof set is strong on quality but narrow on disclosure. It is concentrated in large North American or European enterprises and in tech-adjacent or regulated verticals: AI labs, software/data infrastructure, telecom, financial services, retail, semiconductors, and physical security. That makes strategic sense for Zip's orchestration product, but it leaves a real underwriting gap around the long tail. The homepage still markets enterprise, mid-market, and startup motions, yet the retained public references lean heavily toward complex enterprise transformations. There is little public evidence that would let an investor distinguish how much of Zip's revenue comes from Fortune 500-style accounts versus mid-market buyers or startup cohorts.

    Adverse evidence is present but limited. Independent review surfaces are useful for complaints and implementation rough edges, but they do not disclose churn or failed renewal outcomes. No retained source showed a failed pilot, blocked rollout, or named customer churn event. That absence should not be read as proof of perfect durability; it mostly reflects the limits of public disclosure for a private company. The practical diligence implication is straightforward: Zip's public customer chapter clears the 'real adoption' bar and shows meaningful expansion patterns, but concentration risk, true retention quality, and renewal durability remain data-room questions rather than publicly answerable ones.
