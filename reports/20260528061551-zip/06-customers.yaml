  rows:
  - - AI frontier and model labs
    - OpenAI, Anthropic
    - 'Buyer: procurement / finance ops; User: employees, procurement, TPRM; Payer: central finance or procurement'
    - AI-assisted procurement orchestration during hypergrowth
    - US-headquartered global operators
    - Public proof is strong on outcomes but silent on ACV and renewal timing
  - - Software, data, and developer infrastructure
    - Snowflake, Datadog, Coinbase, Arm
    - 'Buyer: source-to-pay or procurement transformation lead; User: engineers, AP, requesters; Payer: procurement / finance'
    - Replace fragmented stacks, add spend visibility, control supplier sprawl
    - Large global software or semiconductor businesses
    - No public revenue mix by sub-segment
  - - Financial services and insurance
    - Discover, Prudential, Invesco
    - 'Buyer: CPO / procurement ops / finance; User: employees plus procurement and compliance teams; Payer: finance'
    - Compliance-heavy orchestration, visibility, and stakeholder experience
    - Regulated enterprises with large employee bases
    - Top-customer concentration within financial services is undisclosed
  - - Retail and consumer
    - Dollar Tree
    - 'Buyer: strategic sourcing / procurement; User: business stakeholders and sourcing team; Payer: enterprise procurement budget'
    - Increase spend influence and improve renewal discipline on non-product spend
    - Large US retailer with $5B+ non-product spend in story
    - Only one retained public retail case study
  - - Telecom and complex supplier ecosystems
    - T-Mobile
    - 'Buyer: CPO; User: procurement teams and internal business partners; Payer: enterprise procurement budget'
    - Prioritize high-value deals while handling very large supplier counts
    - US telecom with 30,000 suppliers and $35B spend in story
    - Public proof is directional; follow-on adoption metrics are thin
  - - Security and IT supplier management
    - ADT
    - 'Buyer: IT strategic supplier management; User: sourcing managers, legal, IT requesters; Payer: procurement / IT'
    - Start with IT procurement, then expand orchestration across enterprise workflows
    - US physical-security provider; staged rollout
    - Broader rollout scope beyond the pilot is not quantified publicly
  - - Homepage-marketed lower-end motions
    - Enterprise / Mid-market / Startups (no retained startup case study)
    - Buyer varies by size; user is broad employee base; payer is finance or procurement
    - Fast implementation and orchestration for smaller buyers per homepage positioning
    - Marketed across three size bands
    - Retained public proof for startup and lower-mid-market customers is limited
  notes: Rows summarize the visible public proof set as of 2026-05-28, not Zip's full installed base. The final row reflects homepage positioning rather than a retained named startup case study.
