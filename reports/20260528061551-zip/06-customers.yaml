- id: named-proof-adoption
  title: Named customer proof, production maturity, and adoption trajectory
  body: |-
    Zip's customer proof is materially stronger than a logo wall because most retained stories are current, named, and quantitative. OpenAI says two-thirds of the company now comes through procurement as the front door, that its first Zip AI agent saved 1,400 hours, and that the team subsequently deployed 10+ agents. Anthropic says it kept procurement headcount flat while headcount grew 5x, reached 95% policy adoption in year one, and more than doubled procure-to-pay volume. Snowflake says Zip gave it visibility into $3.7 billion of spend before approval, produced $305 million of savings, and stopped $11 million of bad purchases. Discover says it removed 3,000 redundant approvals and increased throughput 67%. Invesco says a 19-person team manages $1.1 billion of spend, avoided 30+ hires, and moved ROI from 4x to 7x. Dollar Tree, Datadog, Coinbase, and ADT all report similarly concrete before/after metrics.

    The proof is still company-authored, so evidence quality varies. The strongest rows are current Zip case studies with named operators and specific outcomes; weaker rows are stories that are current but more directional than numeric. Production maturity nonetheless looks real. Nearly every retained reference describes a live deployment, not a lab pilot. ADT is the clearest staged rollout: it began with an IT-focused pilot, then expanded orchestration across a broader enterprise procurement environment. That is a positive adoption signal, but it also underlines a limitation of the public set: Zip does not publish an exhaustive customer roster, attach-rate table, or renewal schedule, so the analysis can show visible wins but not the base-rate denominator behind them.
