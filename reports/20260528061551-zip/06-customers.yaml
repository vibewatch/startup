  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: Named customer proof table coverage
    missingEvidence: An exhaustive current customer roster with production status, segment, and deployment scope is not public.
    whyItMatters: Without the denominator, public wins can prove adoption quality but not installed-base breadth or selection bias.
    diligencePath: Request a current customer list by segment with status tags for production, pilot, churned, and expansion-stage accounts.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: Retention metrics
    missingEvidence: Current NRR, GRR, logo churn, contract length, and renewal timing are not publicly disclosed.
    whyItMatters: The chapter can show real adoption, but it cannot measure durability or replacement risk without retention math.
    diligencePath: Request NRR, GRR, churn, renewal schedule, and module attach-rate by cohort and by company-size segment.
    relatedQuestionRefs:
    - QU018
  - type: missing-source
    severity: material
    topic: Adverse deployment outcomes
    missingEvidence: No retained public source names a failed pilot, blocked rollout, or churned customer tied to Zip.
    whyItMatters: Adverse review complaints are visible, but without named loss events it is impossible to judge whether the product issues have revenue consequences.
    diligencePath: Request churned-customer references, lost expansion post-mortems, and examples of pilots that did not roll into production.
    relatedQuestionRefs:
    - QU024
  - type: private-evidence-only
    severity: material
    topic: Customer concentration
    missingEvidence: Top-customer share, top-10 customer share, and revenue mix by segment are not publicly disclosed.
    whyItMatters: The visible proof set suggests heavy enterprise concentration, but the financial magnitude of that concentration is unknown.
    diligencePath: Request top-customer revenue concentration schedules and segment-level ACV, churn, and renewal data.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU005
