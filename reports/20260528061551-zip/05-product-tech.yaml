  - id: automation-roadmap
    title: AI operating model, release path, and developer signal
    body: >-
      Zip's 2025-2026 product story is the transition from orchestration to agentic automation. The
      company now markets a suite of 50-plus AI agents for procurement-specific tasks such as intake
      validation, price negotiation, contract review, supplier 360 analysis, DORA screening, SOC 2
      summarization, invoice coding, and payment risk checks. The important product detail is not merely
      that generative AI exists somewhere in the UI; Zip is embedding those agents into the exact nodes
      where employees, approvers, legal teams, AP teams, and suppliers already interact with the workflow.
      Public developer and practitioner signal is thinner than a traditional platform company because the
      detailed API reference is gated, but there is still enough surface to confirm real integration work:
      public integration docs, a visible API reference shell, an API-tracker catalog showing webhooks and
      GraphQL references, and a public engineering blog. Recent external coverage also confirms that Zip's
      2024 release train focused on low-code extensibility and templates, while 2025 focused on agentic AI
      and broader procurement automation. The result is a credible roadmap toward deeper automation, even
      if outsiders cannot fully inspect the API surface without customer credentials.
    claimRefs:
      - CE018
      - CE022
      - CE027
      - CE028
      - CE029
      - CE030
      - CE031
      - CE032
      - CE040
    tableRefs:
      - TE005
    figureRefs:
      - FE004

  - id: trust-differentiation-risks
    title: Reliability, trust posture, differentiation, and product risk
    body: >-
      Zip's strongest differentiation is architectural: it intervenes before spend hardens into purchase
      orders, invoices, or payments, where employee behavior, supplier choice, legal review, and policy
      routing still can be changed. That makes the platform more valuable than downstream analytics alone,
      especially for organizations with fragmented back-office tooling. Public trust materials are also
      stronger than many private SaaS peers: Zip discloses TLS and AES encryption, per-customer
      application-layer encryption, Cloudflare WAF, annual penetration testing, Semgrep and Nessus usage,
      SOC 2 Type 2 and SOC 1 Type 2 audit status, transfer-mechanism language, a vulnerability disclosure
      policy, and a subprocessor list. The weak spots are equally visible. The public API detail is gated,
      public uptime and SLA commitments were not located, and public materials do not state product-level
      hosting regions or residency options. Practitioner reviews praise usability and cross-functional
      workflow guidance but repeatedly ask for better reporting and note some integration friction,
      including an Ironclad issue in one review set. Zip also warns directly that its Slack AI experience
      may produce inaccurate answers, underscoring that autonomy still needs human verification for policy-
      critical decisions.
    claimRefs:
