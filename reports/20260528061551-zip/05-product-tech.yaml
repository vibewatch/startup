  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Key dependency
      - Risk
    rows:
      - - Procurement Concierge + Intake-to-Procure
        - Front door that captures requests, documents, and policy context
        - Requester adoption; company policy content; uploaded files
        - AI misguidance or weak policy configuration can propagate downstream errors
      - - Workflow Engine
        - No-code approval routing, queues, hierarchies, and parallel stakeholder review
        - Correct role mapping; ERP, CLM, GRC, ITSM integration patterns
        - Misconfigured routing or stale user hierarchies can block adoption
      - - Domain workflow apps
        - Supplier onboarding, sourcing, risk, contract, AP, cards, and payments modules
        - Clean supplier data, contracts, risk feeds, invoice data
        - Breadth increases implementation scope and cross-team governance burden
      - - App Studio
        - Low-code custom actions, triggers, and branching for third-party systems
        - REST/SOAP endpoint availability; customer admin skill
        - Public docs are gated, making pre-purchase technical diligence harder
      - - Collaboration connectors
        - Slack notifications/actions and legal review handoff surfaces
        - Slack and Ironclad APIs plus customer auth setup
        - Third-party API changes or brittle syncs create workflow exceptions
      - - ERP / source-to-pay sync
        - Requisition, PO, budget, invoice, and reconciliation sync to systems of record
        - SAP Ariba and other ERP / P2P connectors
        - Data mismatches undermine single-source-of-truth value
      - - Cloud / subprocessor layer
        - Hosting, AI services, observability, support, and data movement
        - AWS, Anthropic, Google, Datadog, Fivetran, Fullstory, Intercom and others
        - Region, SLA, and product-level residency commitments are not public
    notes: >-
      The architecture is reconstructed from product, trust, subprocessor, and integration documentation.
