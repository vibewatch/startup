  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow without Zip
      - Zip solution
      - Measurable benefit / output
      - Limitation
    rows:
      - - Kick off a purchase request
        - Email, chat, tickets, spreadsheets, and missing context
        - Intake-to-Procure plus Procurement Concierge
        - Structured request created up front; company claims 3x faster intake completion
        - Public accuracy data for concierge guidance is limited
      - - Route cross-functional approvals
        - Manual chasing across procurement, legal, IT, security, and finance
        - Workflow Engine with dynamic approvers and queues
        - Transparent status and fewer approval bottlenecks
        - Configuration quality depends on customer policy design
      - - Onboard a supplier
        - Separate portals, documents, and risk checks across teams
        - Supplier Onboarding plus Vendor Management plus Risk Orchestration
        - Company claims 85% faster onboarding cycle time and 98% portal completion rate
        - Public residency and region detail for supplier data is not explicit
      - - Run an RFx and negotiate pricing
        - Ad hoc templates, email threads, and manual market research
        - Sourcing with RFx generation and price negotiation agents
        - Faster event creation and more supplier competition in one workflow
        - No public third-party benchmark on savings capture quality
      - - Review a buy-side contract
        - Separate legal system with weak visibility for procurement stakeholders
        - AI Contract Orchestration and Ironclad integration
        - Risk-based triage, redlines, and renewal tracking inside procurement workflow
        - Practitioner review set still notes some Ironclad integration breakage
      - - Process invoice and pay supplier
        - Shared inboxes, manual coding, bank portals, and disconnected AP work
        - Procure-to-Pay plus Global Payments
        - 5x faster invoice processing claimed; bank verification and ERP reconciliation built in
        - Public payout-partner and SLA disclosures are limited
      - - Issue card-backed purchase quickly
        - Manual card request outside procurement workflow
        - Vendor Cards
        - Request, approval, issuance, and reconciliation tied to same request record
        - Coverage depends on external card partner footprint
    notes: >-
      Benefits marked as speed improvements are company-reported or review-site reported, not third-party
      audits. Workflow value is strongest where Zip removes fragmented request intake and stakeholder handoffs.
