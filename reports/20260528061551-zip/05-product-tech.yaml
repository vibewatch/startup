  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: >-
        Public uptime history, formal SLA commitments, and a public status or incident log for Zip's production service.
      whyItMatters: >-
        Enterprise buyers using Zip as a control point across procurement, legal, AP, and payments need to understand
        how often the orchestration layer or critical connectors fail and what commercial remedies apply.
      diligencePath: >-
        Request master-service uptime commitments, connector-specific incident history, and internal SRE reporting under NDA;
        ask specifically whether payment, ERP, and Slack connector incidents are tracked separately.
      relatedQuestionRefs:
        - QE023

    - type: missing-source
      severity: material
      topic: product-level data residency
      missingEvidence: >-
        Product-by-product hosting regions, residency options, and any customer-selectable data-localization controls are not
        public in the fetched trust and privacy pages.
      whyItMatters: >-
        Supplier onboarding, contract review, and payment data can carry jurisdiction-specific obligations for financial
        services and international enterprises.
      diligencePath: >-
        Request region commitments and residency matrix by product module; review DPA exhibits and subprocessor-region mapping.
      relatedQuestionRefs:
        - QE024

    - type: private-evidence-only
      severity: material
      topic: api-surface-depth
      missingEvidence: >-
        Detailed endpoint coverage, webhook payloads, rate limits, and auth flows are behind authenticated docs and cannot be
        fully underwritten from public sources.
      whyItMatters: >-
        Integration depth is core to Zip's product thesis; gated detail slows pre-purchase technical diligence for complex
        customers.
      diligencePath: >-
        Ask for sandbox access or a live API review during diligence; request OpenAPI specs, webhook examples, and connector
        maintenance policy documentation.
      relatedQuestionRefs:
        - QE013
        - QE025

    - type: private-evidence-only
      severity: minor
      topic: ai-productivity-metrics
      missingEvidence: >-
        Public AI speed and productivity claims such as 10 million insights, 3x faster intake, 5x faster invoice processing,
        85% faster onboarding, and 98% portal completion are company-reported and not independently audited.
      whyItMatters: >-
        These metrics influence the automation and ROI case, but without cohort definitions or independent verification they
        should be treated as directional rather than underwritten facts.
      diligencePath: >-
        Request cohort methodology, customer references tied to each metric, and pre/post implementation measurement detail.
      relatedQuestionRefs:
        - QE021
