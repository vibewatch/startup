callouts:
  - calloutType: strength
    title: Zip's moat is upstream control, not downstream bookkeeping
    body: >-
      Zip is strongest where it can shape behavior before a request becomes a PO, invoice, or payment.
      The orchestration layer captures policy, stakeholder routing, supplier choice, contract review,
      and budget context before money leaves the company, which is more defensible than after-the-fact
      analytics alone.
    claimRefs:
      - CE001
      - CE004
      - CE031
      - CE040

  - calloutType: strength
    title: AI is embedded in real workflow nodes, not bolted on as a chatbot
    body: >-
      The public product set shows AI inside intake, supplier onboarding, sourcing, contract review,
      invoice coding, and payment-risk review. That matters because the AI surfaces align with the actual
      handoff points that create procurement cycle time.
    claimRefs:
      - CE008
      - CE010
      - CE011
      - CE012
      - CE013
      - CE015
      - CE030

  - calloutType: risk
    title: Public API and reliability evidence lag the product's enterprise ambition
    body: >-
      Zip clearly has a real integration surface, but detailed API docs are gated and public materials do
      not disclose uptime targets or a public status page. For buyers who want to underwrite mission-
      critical workflow risk before purchase, that is a meaningful diligence gap.
    claimRefs:
      - CE027
      - CE028
      - CE036
      - CE037

  - calloutType: risk
    title: Practitioner reviews point to reporting and integration rough edges
    body: >-
      Review-site feedback is directionally positive on usability and workflow structure, but public review
      excerpts still call out reporting flexibility, navigation quirks, slower support outside western time
      zones, and one recurring Ironclad integration complaint. Those issues do not break the core thesis,
      but they matter for scaled enterprise rollouts.
    claimRefs:
      - CE033
      - CE034

  - calloutType: insight
    title: Zip looks more like a systems-of-engagement layer than a classic suite replacement
    body: >-
      Across official pages, external explainers, and integration materials, Zip repeatedly presents itself
      as the workflow and policy layer above ERP, CLM, GRC, ITSM, and payment tools. That positioning is
      likely why the company can expand breadth quickly without forcing customers into a single closed stack.
    claimRefs:
      - CE004
      - CE018
      - CE019
      - CE031

