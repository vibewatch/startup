artifact: product-tech
slug: zip
runDate: '2026-05-28'
company:
  name: Zip
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Zip is best understood as a front-door procurement orchestration layer that captures employee demand
    before it becomes a PO, contract, invoice, or payment, then routes work through modular applications
    for sourcing, supplier onboarding, risk, legal review, AP, and disbursement. The operating model is
    integration-first: no-code workflows, App Studio, ERP/CLM/GRC/ITSM connectors, and collaboration
    surfaces such as Slack and SAP Ariba sync. Since 2024 Zip has expanded from intake orchestration into
    broader AI automation, payments, cards, and contract workflows. The main product risks are gated API
    detail, limited public SLA and residency disclosure, and practitioner complaints around reporting and
    occasional integration friction.

sections:
  - id: product-workflow
    title: Product definition in customer workflow terms
    body: >-
      Zip's product is not best described as a standalone ERP or AP tool; it is a procurement
      orchestration layer that sits at the front of the spend lifecycle. The user job starts when an
      employee needs to buy something, onboard a supplier, renew a contract, run an RFx, or pay an
      approved invoice. Zip's intake products collect the request up front, guide the requester through
      missing information, and route work to the right cross-functional reviewers in procurement, legal,
      IT, security, finance, and AP. From that front door, the product branches into modular workflow
      surfaces: Intake-to-Procure, Procure-to-Pay, Supplier Onboarding, Sourcing, Risk Orchestration,
      AI Contract Orchestration, AI Procurement Concierge, plus add-ons for Global Payments, Vendor Cards,
      Budgets, and App Studio. That breadth means the product can be sold as a lightweight request layer
      or as a wider intake-to-pay operating system. It also means implementation quality depends on how
      well customers define approval logic, preferred suppliers, budget rules, and downstream system sync
      rather than on a single monolithic deployment.
    claimRefs:
