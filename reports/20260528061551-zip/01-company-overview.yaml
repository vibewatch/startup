  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials-private
      missingEvidence: "ARR, revenue run-rate, gross margin, net revenue retention (NRR), and burn rate are all withheld as private-company information. No debt or credit facility disclosures exist."
      whyItMatters: "Without revenue metrics, it is impossible to assess Zip's growth efficiency, unit economics, or whether the $2.2B valuation represents a fair revenue multiple. NRR is a critical SaaS health indicator."
      diligencePath: "Request revenue, ARR, gross margin, NRR, and cash runway via management diligence call or data room access. Cross-check with reference customers for contract-value benchmarks."
      relatedQuestionRefs: [QO018]

    - type: missing-source
      severity: minor
      topic: secondary-debt
      missingEvidence: "No public record of secondary share transactions, venture debt, or credit facility arrangements involving Zip has been located."
      whyItMatters: "Undisclosed secondary sales could indicate founder or early investor liquidity-seeking; debt financing affects balance sheet risk and covenant constraints."
      diligencePath: "Request capitalization table, debt schedule, and any secondary transaction history during management diligence."
      relatedQuestionRefs: [QO026]

    - type: enumeration-incomplete
      severity: minor
      topic: investor-stakes
      missingEvidence: "Exact ownership percentages, pro-rata rights, and liquidation preferences for each investor in TO003 are not publicly disclosed by Zip or its investors."
      whyItMatters: "Unknown cap-table structure prevents assessment of founder dilution, governance control, and alignment between investors in a downside scenario."
      diligencePath: "Request capitalization table, investor rights agreement, and any secondary transaction history during data room review."
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO003]

    - type: enumeration-incomplete
      severity: minor
      topic: milestone-table
      missingEvidence: "The TO004 milestone table is sourced from public announcements and press coverage; adverse events, private governance events, and pre-2021 formative milestones may not have public record."
      whyItMatters: "Unrecorded milestones (e.g., internal pivots, leadership discussions, undisclosed rounds) could change the company's historical trajectory narrative."
      diligencePath: "Request a detailed company timeline via management diligence; review cap table history and board minutes for additional governance events."
      relatedQuestionRefs: [QO009]
      relatedTableRefs: [TO004]

    - type: missing-source
      severity: minor
      topic: governance
      missingEvidence: "Full board composition, independent directors (if any), shareholder voting rights, and liquidation preference terms are not publicly disclosed."
      whyItMatters: "Governance structure affects founder control, investor alignment, and exit scenarios. Key-person provisions and drag-along rights are material for investors."
      diligencePath: "Request board composition and charter documents, shareholder agreement, and any protective provisions during data room review."
      relatedQuestionRefs: [QO015]

    - type: enumeration-incomplete
