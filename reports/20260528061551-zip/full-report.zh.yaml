  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按购买者、用户、付款方和用例划分客户
        blocks:
          - type: paragraph
            body: >-
              Zip 自己的市场页面仍在同时覆盖三类规模动作——企业、中端市场和初创公司——但本次保留的公开可核查客户证据明显偏向企业。现有案例研究集中在
              OpenAI、Anthropic、Snowflake、Discover、T-Mobile、Invesco、Prudential、Dollar Tree、Datadog、Coinbase、Arm 和
              ADT：这些买方已经足够大、受监管约束，或运营复杂度足够高，能切实感受到碎片化采购工作流的痛点。这一点很重要，因为它说明 Zip
              最强的公开证据不是「人人适用的通用采购」，而是为采购、财务、IT、安全和法务都需要共同入口与审查层的组织做编排。


              这些案例里的经济买方通常是首席采购官、采购负责人、财务运营负责人或 IT 供应商管理负责人。日常用户更广：提交请求的员工、寻源经理、应付账款团队、第三方风险管理（TPRM）团队和业务审批人。即使最初推动者在 IT
              或运营部门，付款方通常也是中央采购或财务预算负责人。用例重复度很高。OpenAI、Anthropic 和 Snowflake 强调大规模编排叠加 AI 辅助采购；Discover、Prudential 和
              Invesco 强调金融服务里的合规、可见性和利益相关方体验；Datadog、Coinbase、Arm 和 ADT 强调替换碎片化采购栈或自建工作流；Dollar Tree 和 T-Mobile
              强调支出影响力和供应商基础控制。
