      - number: '7.2'
        title: 运营、安全和可用性风险
        blocks:
          - type: paragraph
            body: >-
              Zip 自己的信任与政策文件显示其认真投入控制，但也暴露了具体失效模式。公司称，其项目源自 NIST、CIS、OWASP 和 EDPB 指引；客户数据在传输和静态状态下加密；已部署 Cloudflare
              WAF、静态与动态扫描、年度第三方渗透测试、SAML/SCIM、MFA、客户审计日志和最小权限控制；安全项目由 CTO 和内部审计委员会治理。这些都是实质性缓释。同一批文件也确认，Zip
              预期可能出现数据泄露、业务连续性事件和网络事件，且解决方案托管在美国 AWS。

              子处理方清单把依赖栈说得很清楚：AWS 提供云和生成式 AI 服务，Google 和 Microsoft Azure 负责 AI 处理，Anthropic 支撑部分 AI
              辅助功能；Datadog、LaunchDarkly、Intercom、Asana 和 LangSmith 则覆盖可观测性、功能开关、支持、缺陷分诊和 AI
              追踪。零数据留存承诺和客户退出选择权有帮助，但不能消除上游集中度或模型治理风险。关键在于，Zip
              的公开状态页证明运营变更窗口是真实存在的：一项持续数月的平台升级计划会在周末迁移期间，暂时取消创建或编辑供应商、请求、PO
              和发票的能力。这不是灾难信号，但直接证明产品和运营变更会触及核心采购工作流。再叠加独立评论中围绕供应商主数据控制和可共享报表的投诉，剩余承销判断是：Zip
              的控制姿态可信，但可用性、迁移和集成摩擦仍是一线运营风险。
