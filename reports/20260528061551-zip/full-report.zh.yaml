  - id: TV002
    title: 正向 / 反向论点表
    columns:
      - 论点
      - 证据
      - 改变判断的条件
    rows:
      - - 正向论点：Zip 已从品类故事迈过门槛，成为品类竞争者
        - Gartner 现在把 Zip 与 SAP、Coupa、Oracle 并列，公开来源也证实了可观的支出和供应商规模
        - 如果私下尽调确认这些规模信号能转化为高质量经常性收入和持久留存，判断会改善
      - - 正向论点：采购编排可能具备工作流引力，抵御 AI 商品化
        - PwC 认为，绑定财务或监管结果的系统会因 AI 增值，而不是被 AI 取代
        - 如果 Zip 对审批、寻源、供应商和支付工作流掌握足够深，足以成为记录系统，判断会改善
      - - 正向论点：如果 Zip 已跨过 $300M 收入门槛，当前估值可能合理
        - 如果当前收入高于约 $300M，且利润率和 NRR 强劲，$2.2B 估值筛选会合理得多
        - 只有管理层提供经审计或董事会批准的收入和利润率数据，判断才会上调
      - - 反向论点：2026 年软件倍数仍受压且更挑剔
        - Foley、BMO、MCF 和 Windsor Drake 都显示，工作流 SaaS 的倍数区间更低、审查更严、溢价门槛更高
        - 只有 Zip 展示出足以拿到软件上半区倍数的经济性和防御力，担忧才会缓解
      - - 反向论点：规模指标不等于收入质量
        - 已处理支出、供应商数、已发布功能和 AI 代理上线都是有用证明点，但不能替代 ARR、毛利率或流失数据
        - 如果 Zip 能把这些运营指标清晰映射到变现和留存，担忧会缓解
      - - 反向论点：后期私募条款可能扭曲表面投后估值
        - 2026 年市场评论强调，下行保护和二级交易驱动的流动性是后期软件融资的常见特征
        - 只有法务和财务披露优先权堆栈、附函以及任何二级定价历史，担忧才会消除
    notes: 表格把 Zip 作为公司的强项，与 Zip 作为当前价格下投资标的仍未解决的问题分开。
