  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Zip 的产品不应被描述为独立 ERP 或 AP 工具；它是位于支出生命周期前端的采购编排层。用户任务从员工需要购买某样东西、导入供应商、续签合同、发起 RFx 或支付已批准发票时开始。Zip
              的需求入口产品先收集请求，引导请求人补齐缺失信息，再把工作流转给采购、法务、IT、安全、财务和 AP
              中正确的跨职能审核人。借助这个前门，产品分叉到模块化工作流界面：Intake-to-Procure、Procure-to-Pay、Supplier Onboarding、Sourcing、Risk
              Orchestration、AI Contract Orchestration、AI Procurement Concierge，以及 Global Payments、Vendor Cards、Budgets 和
              App Studio 等附加模块。这种广度意味着，产品既可以作为轻量请求层销售，也可以作为更宽的
              需求入口到支付操作系统销售。同时，实施质量取决于客户定义审批逻辑、优先供应商、预算规则和下游系统同步的水平，而不是单一巨型部署。
