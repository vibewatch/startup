  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险最高的集群围绕云 / AI 依赖、客户集中度不透明和财务模型不透明；隐私 / AI 治理也紧随其后。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余风险
      rows:
