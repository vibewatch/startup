      - number: '8.4'
        title: 建议、杀伤触发器和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              证据支持给出观察建议，置信度中等、风险高、估值立场偏高。这个判断刻意保持价格敏感。公开证据足以避免自动放弃：Zip 有真实品类地位、有意义的客户证据，也有足够运营规模，值得认真尽调。但这些证据不足以在 $2.2
              billion 参考标记上支持买入建议。缺口不在故事质量，而在经济披露。公开记录仍无法告诉投资人：Zip 究竟是一家 $150 million 收入公司、按公开软件筛选会显得昂贵，还是一家 $300
              million+ 收入公司、可能因采购工作流引力和 AI
              扩张获得溢价。公开记录也没有回答最新一轮是干净普通股经济，还是带下行保护、会夸大普通股价值的结构化后期交易。这些不是边角问题，而是决定当前价格是充分、脆弱还是真有吸引力的核心。实际含义很简单：只有在尽调路径能证明收入规模、利润率耐久性、留存质量和干净条款时才继续。如果这些文件强，Zip
              可以上调推荐等级；如果弱，应快速打破投资逻辑，而不是事后合理化。
