      - number: '6.2'
        title: 具名客户证据、生产成熟度和采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Zip 的客户证据明显强于一面客户标识墙，因为大多数保留案例都是当前、具名且带量化指标的。OpenAI 称，如今公司三分之二的采购需求都以采购作为入口，第一个 Zip AI 智能体节省了 1,400
              小时，团队随后部署了 10+ 个智能体。Anthropic 称，在员工数增长 5x 的同时采购团队人数保持不变，第一年政策采用率达到 95%，采购到付款量增长超过一倍。Snowflake 称，Zip
              让其在审批前看见 $3.7 billion 支出，带来 $305 million 节省，并阻止了 $11 million 不良采购。Discover 称，其移除了 3,000 个冗余审批，吞吐量提升
              67%。Invesco 称，一个 19 人团队管理 $1.1 billion 支出，避免招聘 30+ 人，并把 ROI 从 4x 提升到 7x。Dollar Tree、Datadog、Coinbase 和 ADT
              也披露了类似具体的前后对比指标。


              这些证据仍由公司撰写，证据质量因此不一。最强的条目是 Zip
              当前案例研究，带具名运营人员和具体结果；较弱的条目虽然也是当前故事，但方向性强于数字。尽管如此，生产环境成熟度看起来真实。几乎每条保留引用都描述了上线部署，而不是实验室试点。ADT 的分阶段部署最清楚：先从 IT
              侧试点开始，再把编排扩展到更广的企业采购环境。这是正向采用信号，但也凸显公开材料的限制：Zip 不公布完整客户名单、附加购买率表或续约时间表，因此分析只能看到可见胜利，看不到背后的基准分母。
