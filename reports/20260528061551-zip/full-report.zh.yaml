        - OpenAI、Anthropic
        - 买方：采购 / 财务运营；用户：员工、采购、TPRM；付款方：总部财务或采购
        - 超高速增长期的 AI 辅助采购编排
        - 总部在美国的全球运营公司
        - 公开案例对结果支撑很强，但没有披露 ACV 和续约时间
      - - 软件、数据和开发者基础设施
        - Snowflake、Datadog、Coinbase、Arm
        - 买方：寻源到付款或采购转型负责人；用户：工程师、AP、申请人；付款方：采购 / 财务
        - 替换碎片化技术栈，增加支出可见性，控制供应商蔓延
        - 大型全球软件或半导体企业
        - 未公开按子客群拆分的收入组合
      - - 金融服务和保险
        - Discover、Prudential、Invesco
        - 买方：CPO / 采购运营 / 财务；用户：员工及采购、合规团队；付款方：财务
        - 合规要求重的编排、可见性和参与方体验
        - 员工基数大的受监管企业
        - 金融服务内部头部客户集中度未披露
