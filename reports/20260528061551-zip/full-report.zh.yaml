  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant public enterprise software proxies plus historical and current Coupa procurement
        references available from retained public sources. Direct private procurement-orchestration comparables remain
        under-disclosed, so the set is intentionally blended rather than exhaustive.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 为何有用
      - 局限
    rows:
      - - Zip
        - $2.2B 2024 年估值，当前收入未披露
        - 倍数无法公开验证
        - 直接承销对象和最新融资参考点
        - 缺收入、毛利率、NRR 和优先权堆栈数据
      - - Workday
        - $30.74B 市值和 $9.55B 收入
        - ~3.2x 收入
        - 成熟、经审计企业平台的低倍数公开工作流基准
        - 成熟度和多元化程度远高于 Zip
      - - SAP
        - $205.29B 市值和 $43.72B 收入
        - ~4.7x 收入
        - SAP 是传统采购套件在位者，也是经审计上市公司，因此可作参照
        - 巨大规模和不同产品宽度削弱直接可比性
      - - ServiceNow
        - $105.31B 市值和 $13.96B 收入
        - ~7.5x 收入
        - 对平台经济性强的工作流软件，是有用的公开中高位基准
        - 平台更宽、成熟度更高，产品组合也不同于采购软件
      - - Oracle
        - $549.20B 市值和 $64.07B 收入
        - ~8.6x 收入
        - 显示公开市场愿意为深度嵌入工作流的大规模企业平台支付的上限
        - 由更广的数据库、云和 ERP 暴露驱动，而不是纯采购
      - - Coupa
        - 历史 $8B 私有化交易，加上 FY2024 账单额 >$1B、截至 FY26 Q2 约 3,100 个客户
        - 历史采购基准，不是干净的当前公开倍数
        - 在成熟度、客户宽度和支出管理范围上，最接近的采购软件参照
        - 私有化后的背景和不同产品宽度，使其映射到 Zip 并不完美
    notes: 这组可比对象混合了公开软件平台和 Coupa 的采购特定背景，因为直接的私营采购编排估值很少披露足够当前财务数据，难以做严格同类筛选。
