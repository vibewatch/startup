      - number: '7.3'
        title: 合作伙伴、平台和客户集中风险
        blocks:
          - type: paragraph
            body: >-
              Zip 的产品价值有意建立在依赖之上。AI 页面称其智能体从 60+ 个集成中提取上下文；Brex 把 Zip 描述成通向现有财务系统的入口，而不是替换它们的记录系统。NetSuite
              集成尤其说明问题：供应商、账户、物料、总账、税务和自定义字段数据每天同步，让 ERP 连接变成关键任务。G2 归档材料也把接入工单、CLM、GRC 和 ERP/P2P
              系统描述为核心产品能力。这是增长资产，但也意味着合作伙伴或连接器失效可能传导成工作流停摆、客户不满和部署放慢。

              客户侧也类似。公开材料清楚列出了标杆账户——OpenAI、Anthropic、T-Mobile、Mars、Dollar Tree、Northwestern Mutual、Checkr 等——公司来源还引用了超过
              $500 billion 的已处理支出和数十亿美元节省。Procurement Magazine 又补充了供应商和审批规模证据。公开证据没有展示的是合同价值结构、前 10
              大客户占比，或任何硬性的收入集中度表。因此客户集中风险只能部分判断。生态也在变化：新闻室强调 Brex 与前竞争对手 Zip 合作，这在战略上是正面的，但也确认 Zip
              的部分分销、数据质量和客户价值叙事依赖相邻平台，而这些平台的激励会变化。承销结论是：Zip 的护城河一部分来自生态深度，但生态深度也是集中的传导风险来源。
