        - 从 IT 采购切入，再把编排扩展到企业工作流
        - 美国实体安全服务商；分阶段推出
        - 试点之外更大范围推出未公开量化
      - - 官网主推的较低端客群打法
        - 企业 / 中端市场 / 创业公司（无可引用的创业公司案例研究）
        - 买方随规模而变；用户是广泛员工群体；付款方是财务或采购
        - 按官网定位，为较小买方提供快速实施和编排
        - 面向三个规模段营销
        - 创业公司和偏低端中端市场客户的可引用公开证据有限
