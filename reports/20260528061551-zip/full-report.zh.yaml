        - Fortune 500 和全球企业
        - 端到端支出管理、寻源、AP、分析、供应商生命周期
        - 定制报价；第三方估计 $30K+/yr，或基础版约 $2.5K/mo
        - 捆绑全套件深度、供应商网络和基准数据
        - 上线周期长、UX 更笨重、管理负担更重
      - - SAP Ariba
        - ERP 原生既有厂商
        - SAP 级业务；行业媒体称份额约 29%；网络覆盖 190+ 国家
        - 大型全球企业和受监管企业，尤其是 SAP 体系
