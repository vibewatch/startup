  - id: FM004
    title: 企业采购采用漏斗 — 从需求入口到平台部署
    type: funnel
    layout: standard
    summary: 六阶段漏斗，从采购痛点意识到完整平台部署和价值兑现，呈现 Zip 介入的位置和采用流失的位置。
    data:
      items:
        - label: 痛点意识
          value: 10000
          detail: 企业遭遇需求入口混乱、支出可见性缺失或审计压力；全球估计 10,000+ 家中型市场公司面临显著间接支出管理缺口；结构性驱动来自每个请求通常要登录 2+ 个系统，比例达 88%。
          tone: neutral
        - label: 主动评估
          value: 2000
          detail: 采购负责人主动评估 S2P 或需求入口平台；CPO/CFO 联合需求；大型企业到 2026 年预计 75% 采用 AI 采购，意味着显著销售管线；实际 RFP 群体无法从公开来源量化。
          tone: neutral
        - label: 平台选择
          value: 800
          detail: >-
            从短名单收敛到单一供应商；Zip 在中型市场与 Coupa、Tonkean、ORO Labs 竞争；Fortune 500 更偏好 SAP Ariba 和
            Oracle；实施成本和速度是关键决策因素；中型市场平均交易周期未在公开来源披露。
          tone: neutral
        - label: 已签合同
          value: 600
          detail: 合同签署；Zip 报告数百个企业部署（确切数量未披露）；Dollar Tree、T-Mobile、OpenAI、Anthropic、AMD、Discover 为具名客户；需求入口层通常在数周内开始实施。
          tone: positive
        - label: 上线部署（90 天 ROI）
          value: 500
          detail: >-
            平台已部署并活跃；Zip 通过缩短周期时间和提高纳管支出来争取 90 天内可衡量 ROI；Mutual of Omaha 周期时间缩短 68%；Dollar Tree 周期时间缩短 70%，并识别出 $100M
            节省。
          tone: positive
        - label: 全平台扩张
          value: 300
          detail: 客户从需求入口扩展到完整 S2P，包括寻源、合同、P2P 和 AI Agent；Zip 策略是先用需求入口落地，再扩展到完整 S2P；留存率和扩张率未公开披露。
