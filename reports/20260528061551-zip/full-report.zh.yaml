        - label: 资本 / 披露不透明
          values:
            - 高
            - 高
            - 低
            - 高
    approximationNotes: 评级是序数判断，反映本章审阅的公开证据；管理层尽调拿到客户集中度、事件和财务数据后，应重新校准。
    claimRefs:
      - CR010
      - CR017
      - CR022
      - CR027
