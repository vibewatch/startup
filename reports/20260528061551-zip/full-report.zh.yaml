  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局类别与竞争集合
        blocks:
          - type: paragraph
            body: >-
              Zip 竞争的不是一个同质化采购软件市场。买方至少可以通过五类替代方案解决同一个控制问题：Coupa、SAP Ariba、Ivalua、Oracle 等寻源到付款完整套件既有厂商；Zip 和 Tonkean
              等编排优先挑战者；Procurify 等更轻量的中型市场采购到付款工具；Ramp、Airbase、Brex 等财务牵头的支出技术栈；以及包括 ServiceNow 工作流、ERP
              原生模块、电子表格、邮件和内部工单在内的现状替代品。这一分类很重要，因为采购决策往往不是「哪款采购软件最好」，而是买方到底想要一个新入口、一整套套件、一个财务主导的支出技术栈，还是根本不新增平台。

              公开证据显示，既有厂商仍掌握最大的安装基础和最成熟的分析师定位。6sense 按观察到的域名足迹，将 Ariba Procurement Solutions、Coupa Procurement 和
              ServiceNow Procurement 排在 Zip 前面；采购行业媒体仍把 SAP Ariba 视为份额领导者，把 Coupa、SAP、Ivalua 和 Oracle
              视为套件市场中心。在这一背景下，Zip 的崛起有意义，因为它验证了编排作为品类切口的价值：公司如今被定位为 2026 年
              Visionary，也是象限中唯一的智能体式采购编排平台，但相比经常并列出现的套件厂商，它仍年轻得多。

              最重要的替代品仍是现状。Tonkean 的调查数据和 TechCrunch 的报道都描述了同一个世界：采购仍跨越过多系统、过多交接和过多手工工作。这种碎片化为 Zip
              的「前门」论点打开了机会，但也意味着买方可以继续把 ServiceNow、ERP 模块、共享邮箱、电子表格和审批工具拼在一起，比创业公司牛市叙事通常假设的时间更久。
