      - - 收入 / ARR
        - 无直接披露；只有 ROI 和规模代理指标
        - 无法把估值对应到收入倍数或增长效率
        - 要求提供月度 ARR 桥接、按模块拆分的 ARR，以及按年度审计的收入
      - - 毛利率 / 服务组合
        - 只能用 BILL 和 ServiceNow 的参照区间
        - 无法判断软件质量，或支付 / 服务对利润率的稀释
        - 要求按软件、支付和专业服务拆分毛利率
      - - 烧钱 / 跑道
        - Series D 轮金额已知；现金余额未知
        - 无法判断资本是否充足
        - 要求提供现金、月度净烧钱，以及基准 / 乐观 / 悲观跑道模型
      - - NRR / 流失
        - 只有「战略型企业客户留存率 100%」这一说法
        - 无法拆分客户 logo 质量与客户队列留存韧性
        - 要求提供毛留存率、NRR、按客群拆分的流失率，以及收缩驱动因素
      - - CAC / 销售回本周期
        - 只有 3 个月实施和 8 个月 ROI
        - 无法判断增长是否高效获取
        - 要求提供全口径 CAC、回本周期、销售指标完成率和管道转化率
      - - 支付业务单位经济模型
        - $15B 年化处理规模，以及覆盖 140 个国家 / 40 种货币
        - 抽成率、损失、准备金需求和资金管理复杂度未知
        - 要求提供支付收入、毛利、支付失败率和合规成本
      - - 模块组合 / 附加率
        - 产品覆盖面很宽已公开；收入贡献未公开
        - 无法判断 AI 和 P2P 是单独变现还是打包
        - 要求按模块提供 ARR 和客户数，以及附加率演变
      - - 支持负担 / 产品债
        - 评论网站提到报表、入驻和卡片限制
        - 支持成本会随增长降下来还是升上去，尚不清楚
        - 要求提供每客户支持工单数、升级率和路线图完成日期
    notes: 上述公开数据缺口影响最大；每一项都会实质影响估值、跑道或利润率判断。
    claimRefs:
