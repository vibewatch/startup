      - number: '4.3'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >-
              Zip 的成本结构比纯工作流自动化供应商更宽，因为公司现在触及实施、AI 计算、集成和跨境支付。采购到付款页面强调发票自动化、PO 管理和财务技术栈同步。全球支付页面加入了 140 个国家、40
              种货币的支付编排，覆盖多条轨道、对账和合规。集成和 AI 页面显示 60+ 个集成、深入 ERP/CLM/GRC 连接，以及让交付成本部分取决于数据访问、计算和支持质量的 AI 功能。简单说：Zip
              可能有一个接近软件公司的高毛利核心，但支付或服务收入占比每提高一点，都可能稀释这一水平。

              公开可比公司有助于框定区间，但不能给出答案。BILL 的 FY25 SEC 支持结果显示，全年毛利率为 81.4%，且交易费收入占比可观；ServiceNow 2025 10-K 摘要中的企业工作流软件毛利率为
              78%。如果实施服务或全球支付贡献的收入份额高于市场假设，Zip 的收入结构可能低于这些锚点。BILL 37% 的收入用于销售和营销，也提示企业工作流加支付的分发会很昂贵。

              主要限制仍是披露。Zip 不公布毛利率、服务收入结构、AI 推理成本、支付抽成率、欺诈或损失准备，也不公布销售和营销支出。公开层面，最多只能三角测算：Zip 可能有一个中高毛利的 SaaS
              核心，同时服务和支付运营带来显著利润率拖累。
