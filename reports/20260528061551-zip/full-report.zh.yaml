      - number: '8.3'
        title: 情景区间和退出路径
        blocks:
          - type: paragraph
            body: >-
              由于 Zip 当前收入和利润率未披露，情景工作必须清楚区分假设和证据。证据给了我们轮次价格、2026 年公开市场倍数压缩背景，以及来自 Coupa 的采购基准；证据没有给出干净的当前收入线。悲观情景假设 Zip
              是一个强产品、已有真实客户采用，但仍低于获得溢价私有估值所需的收入门槛，在 $150 million 到 $180 million 收入基数上按 3x 到 4x 收入，对应 $450 million 到 $720
              million。基准情景假设收入为 $220 million 到 $260 million，倍数为中个位数到高个位数，落在约 $1.1 billion 到 $1.82 billion。乐观情景假设 Zip
              已经跨过 $300 million 收入线，并有耐久利润率、留存和 AI 驱动扩张支撑，对应约 $2.1 billion 到 $3.24
              billion。这一分布比表面估值更重要，因为它显示当前标记并非明显不可能，但也尚未得到公开证据支撑。退出逻辑同样受限。BMO 和 Foley 指向选择性 IPO 条件，以及仍更强的 M&A
              或二级市场，这让战略方或赞助方主导的流动性比近期 IPO 承销案例更站得住。
