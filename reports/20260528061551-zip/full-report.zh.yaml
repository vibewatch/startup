      - CR042
  - id: FR002
    title: 风险传导图
    type: dag
    summary: Zip 的主要风险通过相互连接的运营和法律渠道，传导到续约质量、支持成本、融资杠杆和估值信心。
    data:
      nodes:
        - id: ai_gov
          label: AI / 隐私治理缺口
        - id: cloud_dep
          label: 云或 AI 供应商中断
        - id: erp_dep
          label: ERP / 合作伙伴集成失败
        - id: migration
          label: 迁移或发布中断
        - id: trust
          label: 客户信任侵蚀
        - id: support
          label: 支持与修复成本
        - id: renewals
          label: 续约 / 扩张压力
        - id: capital
          label: 融资与估值压力
      edges:
