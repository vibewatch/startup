        - T-Mobile
        - 买方：CPO；用户：采购团队和内部业务伙伴；付款方：企业采购预算
        - 在处理超大供应商数量时，优先推进高价值交易
        - 案例中的美国电信公司，拥有 30,000 家供应商和 $35B 支出
        - 公开证据偏方向性；后续采用指标单薄
      - - 安全和 IT 供应商管理
        - ADT
