    rows:
      - - Procurement Concierge + Intake-to-Procure
        - 捕捉申请、文档和政策上下文的前门入口
        - 申请人采用；公司政策内容；上传文件
        - AI 误导或政策配置薄弱，会把错误传到下游
      - - Workflow Engine
        - 无代码审批路由、队列、层级和多方并行审核
        - 准确的角色映射；ERP、CLM、GRC、ITSM 集成模式
        - 路由配置错误或用户层级过期，会阻碍采用
      - - 领域工作流应用
        - 供应商入驻、寻源、风险、合同、AP、卡和支付模块
        - 干净的供应商数据、合同、风险数据源、发票数据
        - 产品覆盖面越宽，实施范围和跨团队治理负担越大
      - - App Studio
        - 面向第三方系统的低代码自定义动作、触发器和分支
        - REST/SOAP 端点可用性；客户管理员能力
        - 公开文档有访问门槛，采购前技术尽调更难
      - - 协作连接器
        - Slack 通知 / 动作，以及法务审核交接界面
        - Slack 和 Ironclad API，以及客户认证配置
        - 第三方 API 变更或脆弱同步会制造工作流异常
      - - ERP / 寻源到付款同步
        - 采购申请、PO、预算、发票和对账同步到主记录系统
        - SAP Ariba 及其他 ERP / P2P 连接器
        - 数据不匹配会削弱单一事实源价值
      - - 云 / 子处理方层
        - 托管、AI 服务、可观测性、支持和数据流动
        - AWS、Anthropic、Google、Datadog、Fivetran、Fullstory、Intercom 等
        - 区域、SLA 和产品级数据驻留承诺未公开
    notes: 该架构根据产品、信任、子处理方和集成文档重构。Zip 的公开材料把控制平面讲得清楚，但没有展开完整运行时拓扑。
