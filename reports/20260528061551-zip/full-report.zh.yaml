chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Zip（法定运营实体为 Zip HQ, Inc.）是一家 AI 驱动的采购编排平台，总部位于 California 州 San Francisco。公司成立于 2020 年，处在企业软件、AI
              自动化和支出管理的交汇处。核心产品为任何员工发起采购请求提供一个「统一入口」：请求进入后，会按可配置审批流在财务、法务、IT、安全和采购团队之间流转，再继续管理采购订单、发票处理和全球支付的完整生命周期。


              Zip 将自身商业模式定义为 SaaS 平台，主要按订阅向中型市场和企业客户销售。平台通过 60+ 个预建连接器接入 ERP（SAP、Oracle、NetSuite）、CLM 系统、GRC
              工具和其他企业软件。Zip 支持 140+ 个国家、40+ 种货币的供应商付款，具备全球支付基础设施。公司已把产品面扩展到需求入口管理、寻源、供应商管理、PO 管理、发票处理、AI 合同编排，以及一套不断扩大的
              50+ 个采购工作流自主 AI 代理。


              Zip 称自己开创了「需求入口与采购编排」品类，最近又提出「智能体式采购编排」。到 2026 年，公司声称自己是 Gartner Source-to-Pay Suites Magic Quadrant
              中唯一的采购编排平台。企业客户横跨金融服务（Northwestern
              Mutual、Discover、Prudential）、科技（OpenAI、Snowflake、Anthropic、Canva）、零售（Dollar
              Tree、Sephora、Sprouts）等行业。公司也已国际化，在 San Francisco、New York、London 和 Toronto 设有办公室。
