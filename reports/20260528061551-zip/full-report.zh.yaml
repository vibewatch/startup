  - id: FM001
    title: 采购市场规模视角（TAM → SAM → SOM 金字塔）
    type: pyramid
    layout: standard
    summary: 从最宽的全球采购软件 TAM，到 Zip 在以需求入口编排为先的中型市场采购中估算的可服务可获取市场，共四层嵌套。
    approximationNotes: S2P SAM 是 MarkWide Research 2026 估计。SOM 是受约束的内部估计；没有分析师发布独立 I&O 子板块数字。所有数值均为十亿美元。
    data:
      items:
        - label: 全球采购软件 TAM
          value: $9.9–$11.1B (2026)
          detail: 完整采购软件市场，覆盖电子采购、S2P 套件、CLM、电子寻源、支出分析和采购自动化；五家分析师来源（Mordor、GVR、FBI、TBRC、IMARC）区间为 $9.88B 至 $11.14B。
          tone: neutral
        - label: 寻源到付款套件 SAM
          value: ~$8.7B (2026)
          detail: 专指寻源到付款集成套件；MarkWide Research 2026 估计；包括 Coupa、SAP Ariba、Ivalua、Oracle、GEP、JAGGAER，以及包括 Zip 在内的专业编排平台。
          tone: neutral
        - label: 中型市场 S2P / 需求入口编排 SAM（Zip 可触达）
          value: $1.5–$3.0B est. (2026)
          detail: 团队估计，方法是将中型市场占比（约 S2P SAM 的 20–35%）套用到 MarkWide S2P 数字；没有分析师单独发布该子板块；见 evidenceGaps。
          tone: neutral
        - label: 需求入口编排 SOM（Zip 滩头市场）
          value: <$0.5B est. (2026)
          detail: Zip 当前装机基础为数百家企业客户；SOM 是高度不确定的内部估计，基于隐含 ARR 和市场份额代理；没有独立分析师估计。
          tone: neutral
