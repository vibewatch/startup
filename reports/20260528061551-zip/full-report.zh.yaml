  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 当前收入不及预期
        - 经验证当前收入低于约 $200M
        - 如果没有超常经济性，即便按宽松的公开可比公司口径，也撑不起该轮价格
        - 将 2024 年估值视为减值，并从更低基准价值区间重新承销
      - - 利润率质量偏弱
        - 毛利率结构性低于 ~60%，或服务收入组合主导软件经济性
        - Zip 会不像高端工作流软件，更像低倍数、实施偏重的 SaaS
        - 立即下调倍数区间和建议
      - - 留存未越过溢价门槛
        - NRR 低于 ~110%，且流失或收缩偏高
        - AI 和编排扩张不足以支撑软件上半区倍数
        - 维持跟踪状态，或在当前价格下退出
      - - 条款高度结构化
        - 参与权、叠加清算优先权或隐性二级折扣实质性压低普通股价值
        - 表面投后估值会高估真实入场经济性
        - 按普通股所得重切价格，而不是按表面轮次估值
      - - 退出市场仍狭窄
        - 没有可信的战略买家或财务赞助方路径出现，IPO 准备仍需数年
        - 后期流动性仍挑剔，持有期风险上升
        - 要求更大入场折扣，或暂停投资工作
    notes: 这些触发项把公开市场参考点和私下尽调阈值结合起来，因为关键论点风险在经济质量、条款结构和退出时点。
