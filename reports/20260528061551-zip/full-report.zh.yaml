      - number: '4.2'
        title: 销售动作与效率替代指标
        blocks:
          - type: paragraph
            body: >-
              Zip 的公开客户证据指向一种自上而下的企业销售打法：不是靠最低标价，而是靠部署速度和可衡量节省取胜。G2 的评论聚合显示平均实施周期为 3 个月，ROI 窗口为 8 个月。Software Advice
              评论更进一步，用户称 Zip 不需要单独的第三方实施团队，易部署帮助它赢下交易。对一家不披露 magic number、CAC、销售回本期或净留存的私营公司来说，这些都是有用的 CAC 回本期替代指标。

              客户故事强化了这一模式。Dollar Tree 提到 $125M 受支持节省和周期时间降低 70%；Snowflake 提到 $305M 节省和审批前可见的 $3.7B 支出；Discover 提到减少
              3,000 次审批、吞吐量提高 67%；OpenAI 提到 10+ 个 AI 代理投产，仅第一个代理就节省 1,400 小时。这些都是公司撰写的主张，应当视为最佳案例而不是组合平均值，但仍展示了 Zip 能带入
              CFO 或 CPO 主导交易周期的 ROI 叙事。

              缺失环节是 cohort 数据。公开来源没有披露胜率、CAC、按分层划分的销售周期、平均合同价值、扩张收入或续约行为。没有这些指标，公开证据只能支持一个可信的企业效率故事，无法支撑稳健的销售效率模型。
