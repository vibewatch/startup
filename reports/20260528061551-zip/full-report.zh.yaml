  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Zip 进入估值工作时，有一个异常强的事实组合，也有一个异常关键的缺失。强事实组合是：2024 年 10 月 Series D 得到 Zip 自己公告、Business Wire、外部法律顾问和
              Crunchbase 报道相互印证：新增融资 $190 million，估值 $2.2 billion，BOND 领投，DST Global、Adams Street、Alkeon、Y Combinator 和
              CRV 参投。到 2026 年 1 月，Zip 仍在公开使用这一估值参照，同时声称客户节省超过 $6 billion、处理数千亿美元支出、覆盖 7 million
              供应商，并以榜单唯一智能体采购编排平台身份首次进入 Gartner Magic Quadrant。这些不像脆弱种子阶段叙事的信号。缺失项是承销分母。公开证据仍未披露 Zip
              当前收入、ARR、毛利率、NRR、烧钱速度或轮次条款。这很关键，因为 $2.2 billion 标记若按 9x 需要约 $244 million 收入，按 7x 需要 $314 million，按 5x 需要
              $440 million。没有已验证的分母，投资人实质上是在为溢价假设买单，而不是为公开市场已证明的支撑买单。因此，入场纪律应先从收入桥、毛利率证明和优先股堆叠审查开始，再把名义后估值当成公平普通股价格。
