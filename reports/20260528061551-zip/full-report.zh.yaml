              五个已发布 TAM 估计都覆盖完整采购软件市场。没有分析师单独给出 Zip 最初竞争所在的需求入口与编排（I&O）子赛道美元规模。Gartner 在 2026 年决定把 Zip 纳入 S2P Magic
