        - 中
        - 对收入耐久度是正面信号，但不是全公司 NRR 指标
        - 按队列披露总留存和净留存
    notes: 由于 Zip 不公布队列指标或经审计毛利率，多数单位经济模型数值都是代理指标或案例研究结果。
