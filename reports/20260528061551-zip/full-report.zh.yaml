        - 提供安装客户群内标准化后的队列结果
      - - 毛利率代理指标
        - 估计区间为 65%-80%；BILL FY25 为 81.4%，ServiceNow 2025 为 78%
        - 中
        - 框定服务和支付稀释前可能的软件式毛利率上限
        - 披露混合毛利率和纯软件毛利率
      - - 销售强度代理指标
        - BILL FY25 销售和营销支出约占收入 ~37%
        - 高
        - 企业工作流加支付可能需要昂贵的现场销售和客户成功投入
        - 披露 S&M 支出、爬坡期和 CAC 回本周期
      - - 支付敞口
