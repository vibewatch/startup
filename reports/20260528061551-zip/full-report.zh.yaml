        - 已上线 / 核心产品
        - RFx 生成、竞争研究和谈判智能体嵌入工作流
        - 除公司说法外，没有公开胜率或寻源吞吐指标
      - - Risk Orchestration
        - 采购 + 安全 + 风险团队
        - 已上线 / 核心产品
        - Supplier 360、DORA 筛查、SOC 2 审查、自动分层和路由
        - 第三方风险数据供应商和评分方法只部分公开
      - - AI Contract Orchestration
        - 法务 + 采购
        - 已上线 / 核心产品
        - 买方合同红线修订、操作手册、基于风险的路由和续约跟踪
        - 公开文档未披露条款模型准确率或审核人推翻率
      - - AI Procurement Concierge
        - 员工申请人
        - 已上线 / 核心产品
        - 对话式入口、自动填写请购、优选供应商和政策指引
        - 公开材料只轻描淡写地描述幻觉或答案质量控制
      - - Global Payments
        - AP + 财务
        - 已上线 / 附加模块
        - 已批准发票的付款编排、银行验证、ERP 对账
        - 支付通道伙伴和产品级正常运行时间承诺未公开披露
