      - number: '5.2'
        title: 架构、集成模型与部署面
        blocks:
          - type: paragraph
            body: >-
              公开材料一贯把 Zip 定位为集成优先的 SaaS 层，而不是推倒重来的替换型套件。Workflow Engine 提供无代码路由、队列、层级和跨职能审批；Vendor Management 与 Spend
              Insights 提供持久数据和报告界面；App Studio 将平台扩展到定制 REST 和 SOAP 系统，而不强迫用户采用新的前端工作流。Zip 的部署模型假设客户已经在运行
              ERP、P2P、CLM、GRC、ITSM 或协作系统，并希望 Zip 治理请求如何进入这些系统，而不是把这些系统丢掉。公开案例包括用 Slack 做请求人与审批人交互，用 Ironclad 做法务审核，用 SAP
              Ariba 做请购单同步。交付技术栈基于云，依赖 AWS 和更广的子处理方集合，包括 Anthropic、Google、Datadog、Fivetran、Fullstory 和
              Intercom。相对传统套件项目，这一架构灵活且可能部署更快；但它也制造依赖风险：客户价值取决于连接器质量、政策设计、第三方正常运行时间，以及来自上下游系统的数据质量。
