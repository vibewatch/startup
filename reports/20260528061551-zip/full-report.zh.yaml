      - number: '5.4'
        title: 可靠性、信任姿态、差异化与产品风险
        blocks:
          - type: paragraph
            body: >-
              Zip
              最强的差异化在架构层：它在支出固化成采购订单、发票或付款之前介入，此时员工行为、供应商选择、法务审核和政策路由仍可改变。对后台工具碎片化的组织来说，这让平台比单纯下游分析更有价值。公开信任材料也强于许多私营
              SaaS 同行：Zip 披露了 TLS 和 AES 加密、按客户应用层加密、Cloudflare WAF、年度渗透测试、Semgrep 和 Nessus 使用情况、SOC 2 Type 2 与 SOC 1
              Type 2 审计状态、转移机制语言、漏洞披露政策和子处理方列表。弱点同样可见。公开 API 细节需要登录，未找到公开正常运行时间和 SLA
              承诺，公开材料也没有说明产品级托管区域或数据驻留选项。从业者评论称赞易用性和跨职能工作流指引，但反复要求更好的报告，并提到一些集成摩擦，包括一个评论集中出现的 Ironclad 问题。Zip 还直接警告，其
              Slack AI 体验可能产生不准确回答，说明涉及政策关键决策时，自主性仍需要人工核验。
