  - id: TI003
    title: 单位经济模型表
    columns:
      - 指标
      - 公开值 / 代理指标
      - 置信度
      - 重要性
      - 尽调要求
    rows:
      - - 实施时间
        - 平均 3 个月（G2）
        - 中
        - 实施周期越短，CAC 拖累越低，收入激活越快
        - 按细分市场和模块拆分实施时间
