        - from: ai_stack
          to: zip
          label: 驱动 AI 功能
        - from: erp
          to: zip
          label: 同步核心记录
        - from: ecosys
          to: zip
          label: 延展工作流价值
        - from: ops_tools
          to: zip
          label: 监控和支持
        - from: zip
          to: customers
          label: 服务于
        - from: customers
          to: zip
          label: 提供交易量和数据
    claimRefs:
      - CR019
      - CR020
      - CR021
      - CR026
      - CR027
      - CR029
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 经佐证的品类证据、缺失的经济性、公开可比区间和选择性流动性如何共同形成观察（TRACK）建议。
    data:
      nodes:
        - id: proof
          label: 证据：真实融资、进入 Gartner MQ、支出和供应商足迹已具规模
          type: input
        - id: moat
          label: 潜在护城河：采购工作流引力加上 AI 编排
          type: input
        - id: opacity
          label: 不透明：收入、利润率、留存和股权结构条款仍是私有信息
          type: input
        - id: comps
          label: 可比区间：大型软件筛选样本集中在约 3x 至 9x 收入
          type: process
        - id: exits
          label: 流动性：M&A 和老股交易强于短期 IPO
          type: input
        - id: valuation
          label: 当前估值需要高溢价经济性才算合理
          type: process
        - id: recommendation
          label: 观察，中等信心，高风险，估值偏高
          type: output
        - id: upgrade
          label: 只有尽调证明收入 >$300M、利润率 / NRR 强劲且条款干净，才上调评级
          type: output
      edges:
        - from: proof
          to: valuation
        - from: moat
          to: valuation
        - from: opacity
          to: valuation
        - from: comps
          to: valuation
        - from: exits
          to: recommendation
        - from: valuation
          to: recommendation
        - from: recommendation
          to: upgrade
    approximationNotes: 该流程表达承销逻辑，而不是确定性财务模型；它列出在当前价格下会改变判断的具体条件。
    claimRefs:
      - CV032
      - CV039
      - CV042
      - CV043
      - CV049
      - CV050
      - CV051
      - CV052
      - CV054
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 让 Zip 的 $2.2B 估值符合选定收入倍数筛选所需的收入。
    data:
      items:
        - label: 3x 收入
          value: 733.3
          note: 受压市场中，工作流 SaaS 的低端筛选口径
        - label: 5x 收入
          value: 440
          note: 中端软件支撑阈值
        - label: 7x 收入
          value: 314.3
          note: 更强企业软件溢价筛选口径
        - label: 9x 收入
          value: 244.4
          note: 公开工作流平台上半区筛选口径
        - label: 11x 收入
          value: 200
          note: 更接近卓越软件资产的历史溢价阈值
    approximationNotes: 该图有意反推估值数学，因为公开证据披露了价格，却没有披露收入分母。
    claimRefs:
      - CV025
      - CV031
      - CV032
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 悲观、基准和乐观估值区间，基于明确的收入和倍数假设。
    data:
      items:
        - label: 悲观情景
          low: 450
          mid: 585
          high: 720
          note: $150M-$180M 收入，3x-4x
        - label: 基准情景
          low: 1100
          mid: 1460
          high: 1820
          note: $220M-$260M 收入，5x-7x
        - label: 乐观情景
          low: 2100
          mid: 2670
          high: 3240
          note: $300M-$360M 收入，7x-9x
    approximationNotes: 区间受证据约束，但仍高度依赖假设，因为公开记录未披露 Zip 当前收入或盈利能力。
    claimRefs:
      - CV045
      - CV046
      - CV047
      - CV048
      - CV053
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格评分，从品类证据、护城河潜力、经济性可见度、估值和退出准备度衡量 Zip。
    data:
      items:
        - label: 品类证据
          value: 4.5
          note: 对一家私营公司而言，融资和 Gartner 认可获得的佐证异常充分
        - label: 产品 / AI 动能
          value: 4
          note: AI 智能体发布节奏和寻源到付款覆盖宽度支持真实上行空间，前提是变现足够持久
        - label: 工作流防御性
          value: 3.5
          note: 采购可能具备工作流引力，但锁定深度仍需要尽调证明
        - label: 经济性可见度
          value: 1.5
          note: 收入、毛利率、留存和烧钱速度仍未公开
        - label: 估值支撑
          value: 2
          note: 若没有高质量规模收入的证据，$2.2B 估值很难站住
        - label: 退出准备度
          value: 2.5
          note: 战略买家或财务投资人流动性比短期 IPO 更可信
        - label: 证据质量
          value: 3.5
          note: 融资和品类证据很强，但关键承销文件缺位
    approximationNotes: 分数是方向性判断辅助，不是机械模型；低分主要反映经济性披露缺失，并不否认产品牵引力。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
      - CV049
      - CV050
      - CV051
      - CV052
