      - number: '1.4'
        title: 平台规模、指标与关键里程碑
        blocks:
          - type: paragraph
            body: >-
              到 2025 年中，Zip 称创立以来已累计处理超过 $500B 客户支出，采购请求年化处理规模约为 $70B，实际支付年化约 $15B（上一年为 $5B，已增长三倍）。公司平台管理 700+
              万家供应商，已为客户节省 $6.8B，总支出平均降低 3.6%，生产率提升 25%。平台还完成了 2600 万次审批，并向客户群交付了 1000 万条 AI 洞察。截至 2025 年 5
              月的十二个月里，员工数从约 250 人增至 500+ 人，每季度新增 100+ 人，支出明显向研发倾斜。公司在 EMEA 拥有 60+ 名员工。


              2025 年的平台级关键里程碑包括：推出 50+ 个自主 AI 代理（包括 Price Negotiation Agent、Renewal Assist Agent 和 Adverse Media
              Agent）；客户节省金额超过 $6B；Zip Forward 2025 参会者增至 700+ 名采购和财务负责人；发布首份 State of Spend 报告；与前竞争对手 Brex 合作做企业金融科技集成；在
              Toronto 开设新办公室，并扩建 San Francisco 总部（75,000 平方英尺）和 New York 办公点。公司称「战略企业客户」留存率为 100%，但准确客户数和净收入留存率未公开披露。


              独立用户评论记录的产品和平台限制包括：报告共享能力不足（用户不能轻松共享已保存的报告视图）、供应商主数据管理不够灵活（部分字段如付款条款无法在供应商层面锁定）、与 Ironclad 等第三方 CLM
              工具偶发集成挑战，以及非美国时区客户支持覆盖有限。这些批评反映了平台仍然年轻，也指出了需要继续投入的领域。
