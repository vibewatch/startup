      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              自 2020 年创立以来，Zip 在四轮已披露风险融资中累计获得 $371M。公司进入 Y Combinator Winter 2021 批次，获得早期验证和第一笔机构资本。2021 年 8 月，Zip 完成
              $26.8M Series A，由 Tiger Global 领投，CRV 和 Y Combinator Continuity 参投。2022 年 5 月，Series B 融资 $43M，由 YC
              Continuity 领投，Tiger Global 和 CRV 参投，投后估值达到 $1.2B —— 创立约 18 个月后即成为独角兽。2023 年 5 月，Series C 由 Y
              Combinator、CRV 和 Tiger Global 投资，以 $1.5B 投后估值融资 $100M。2024 年 10 月的 Series D 是公司历史上最大一轮融资，由 BOND 领投（Jay
              Simons 是该交易的普通合伙人），以 $2.2B 估值融资 $190M，新投资方 DST Global、Adams Street Partners 和 Alkeon Capital 与现有投资方共同参与。


              公司和投资人称，Series D 是二十多年来采购技术领域单笔金额最大的投资。资金用途包括加速研发（包括建立 Zip AI Lab）、地域扩张（尤其是同比增长超过 200% 的
              EMEA）和继续扩员。公开来源未发现二级交易或债务融资；这些仍是需要直接询问管理层的证据缺口。Zip 是私营公司，没有公开披露义务；公开来源无法获得收入、ARR、毛利率和烧钱速度。
