  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              Zip 所处的是间接采购软件市场，覆盖软件订阅、IT 硬件、专业服务、营销、设施和临时劳动力等非生产性支出，区别于制造中使用的原材料和成品直接采购。这一区分很重要：相比已由供应链 ERP
              模块主导的直接寻源，间接支出通常更碎片化、更受政策驱动，也更依赖面向员工的需求入口工作流。

              最广的市场口径是全球采购软件市场，涵盖电子采购、供应商管理、合同生命周期管理（CLM）、电子寻源、支出分析和寻源到付款（S2P）套件平台。纳入的支出类别包括间接商品和服务、长尾支出、专业服务、SaaS
              续约管理和企业技术采购。排除的是直接制造采购（由供应链 ERP 主导）、作为独立产品的应付账款（AP）自动化，以及物流 / 履约平台。相邻市场——AP
              自动化、CLM、供应商风险情报和支出分析——各自有专门的供应商子市场，也提供自然的交叉销售路径，但不是 Zip 当前定位的核心。

              现状替代品仍然重要：大多数没有专门 S2P 平台的企业，仍通过 ERP 原生模块（SAP MM、Oracle iProcurement）、手工邮件和电子表格审批链，或 Slack、Jira、ServiceNow
              中的临时工单系统来跑采购。88% 的采购负责人称，员工每提交一个采购请求都必须登录至少两个外部系统；只有 18% 称自己的技术栈已经完全打通——这说明替代问题仍然真实且广泛。
