      - number: '6.4'
        title: 集中风险、反向证据和剩余缺口
        blocks:
          - type: paragraph
            body: >-
              可见证据集质量强，但披露面窄。它集中在北美或欧洲大型企业，以及科技相邻或受监管垂直行业：AI 实验室、软件 / 数据基础设施、电信、金融服务、零售、半导体和实体安全。这符合 Zip
              编排产品的战略逻辑，但长尾部分留下真实承销缺口。官网仍在营销企业、中端市场和初创公司三类动作，但保留的公开引用明显偏向复杂企业转型。公开证据很少，无法让投资人分辨 Zip 收入中有多少来自 Fortune 500
              式账户，又有多少来自中端买方或初创公司队列。


              反向证据存在，但有限。独立评论页面有助于识别投诉和实施摩擦，却不披露流失或续约失败结果。保留来源没有显示失败试点、受阻部署或具名客户流失事件。不能把这种缺席理解成耐久性完美的证据；它更多反映了私有公司的公开披露限制。实际尽调含义很直接：Zip
