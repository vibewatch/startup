        - 中
        - 带来支付通道费用、合规、资金管理和损失风险，这些是纯软件同行没有的
        - 披露支付毛利、准备金政策和欺诈损失历史
      - - 支持 / 产品债务负荷
        - 评论证据显示报表缺口、上线导入控制问题和虚拟卡限制
        - 中
        - 可能推高支持成本，并拖慢扩张收入
        - 提供每账户支持成本和产品缺陷积压趋势
      - - 留存质量
