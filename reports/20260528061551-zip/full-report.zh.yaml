      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              企业采购软件涉及三个结构上不同的角色：买方（选择并签约平台）、用户（每天提交采购请求的员工）和付费方（财务或会计部门，支付订阅费用并期待 ROI）。实践中，CPO 或采购 VP
              是主要买方和内部推动者；但年合同额超过 $100,000 时，CFO 联签是标准做法，而多数企业级 S2P 部署都在这一范围内。

              Zip 明确瞄准 200 到 10,000 名员工的中型市场到企业客户——典型包括 Series C
              后的成长阶段科技公司、寻求控制支出的新上市公司，以及医疗、金融服务和零售中规模企业：它们已经超过电子表格采购能承载的复杂度，却负担不起完整 SAP 或 Coupa
              部署。这类买方的特征是采购去中心化、采购人员相对公司规模偏少，并且急需快速上线、在 90 天内看到可衡量 ROI。

              Coupa 的主要买方画像是 Fortune 500 企业——大型、全球化、多事业部组织，合规要求复杂，供应商数以千计，并推进多年期 S2P 转型项目。SAP Ariba 的买方主要是已深嵌 SAP
              生态的组织。Oracle Fusion Procurement 服务的是运行 Oracle ERP、需要可审计且受治理的寻源到付款流程的企业。这些传统套件需要比 Zip 的快速部署模型更长的实施周期（12–24
              个月）和更高的配置投入。

              到 2026 年，前四分位 CPO 团队约 24% 的采购预算用于技术。尽管工作量增加 8%，采购运营预算本身预计从 2025 年到 2026 年小幅下降（−0.4%），形成结构性效率缺口，Zip 等 AI
              驱动平台正把这一点定位为核心价值主张。中型市场客户部署 Zip 的平均年度采购软件成本为每年 $72,000 到 $82,000；Coupa 起价约每年 $30,000，并会随模块增加而上升。
