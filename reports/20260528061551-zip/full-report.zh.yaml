      - number: '7.4'
        title: 人员、执行和财务模型风险
        blocks:
          - type: paragraph
            body: >-
              最后一类风险，是私有公司不透明度下的执行。Zip 的 2024 年 Series D 和随后 2025-2026 年产品推进，清楚显示了投资人信心和市场动能：以 $2.2 billion 估值融资 $190
              million，自成立以来累计融资超过 $371 million，明确计划资助 AI 实验室和地域扩张，并公开声称客户采用迅速。CityBiz 另行报道称，Zip 员工数一年内从 250 人翻倍至超过 500
              人。这些都是正面信号，但也意味着在 Zip 正从采购编排扩展到智能体采购和 AI 合同编排的同一时点，招聘、入职和协同压力都很陡。

              公开证据仍太薄，无法干净承销模型。CEO 关于战略企业客户 100%
              留存的说法没有披露队列定义，也仍无公开文件让外部人评估收入、烧钱速度、营运资本强度、利润率结构或现金跑道。公开记录显示，一家由赞助方支持、快速扩张的公司正在同时增加 AI
              产品、平台迁移、新办公室和生态合作。下行情景不一定意味着失败迫在眉睫；它更可能表现为多线滑坡——部署变慢、支持负担上升、续约变难，或需要以更不利条款补充资本——而不是某个头条法律事件。因此，尽调应把披露不透明本身视为核心财务模型风险，而不只是信息缺口。
