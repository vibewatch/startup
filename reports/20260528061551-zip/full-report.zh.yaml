      - 实施负担
      - 包含范围
      - 公开信息缺口
      - 含义
    rows:
      - - Zip
        - 定制报价；第三方估算 ~$72K-$82K/yr
        - 按报价成交；可能受用量、工作流和集成范围驱动
        - 中等；通常 4-8 周，或约 1 个月
        - 从需求受理到付款的编排，P2P 能力在扩展
        - 未发布价目表；实际成交价和胜率未知
        - ROI 快的叙事清楚，但公开对标 TCO 更难
      - - Coupa
        - 定制报价；第三方估算基础版 $30K+/yr 或 ~$2.5K/mo
        - 企业套件模块加附加项
        - 高；常见 6-12 个月
        - 完整支出管理、寻源、AP、分析、供应商工具
        - 模块实际成交价不透明
