      - number: '3.3'
        title: 护城河耐久性、锁定与反向证据
        blocks:
          - type: paragraph
            body: >-
              Zip 的护城河在工作流前端最强。证据反复支持同一种模式：员工和管理员喜欢 Zip，是因为不需要巨大的实施开销，也能更容易地提出、流转和治理采购请求。这个切口真实存在，而且战略价值很高，因为它允许 Zip
              作为覆盖层落在 SAP、Coupa、Oracle、NetSuite 或其他系统之上。对想先修好需求入口、暂缓完整替换的买方来说，这是一个强价值主张。

              但护城河并非没有挑战。既有厂商已经掌握下游供应商网络、AP、寻源、ERP 数据和伙伴渠道，因此打包压力是结构性的。AI 也不再只属于挑战者：Coupa、SAP、Ivalua、Oracle 和 ServiceNow
              都在营销嵌入式或智能体式采购工作流 AI。Zip 的负面客户证据进一步强化这一风险。评论反复强调更好的 UX 和支持，但也抱怨报告深度、账单处理和仍在成熟中的 P2P
              模块——这些正是既有厂商和相邻财务技术栈可以利用的缺口。

              最后的承销问题是，公开市场只给出部分图像。公开来源提供粗略定价估计和高层部署轶事，但没有披露实际成交价格、竞争胜率、毛留存或准确流失原因。关键尽调问题仍未解决：在既有厂商补上 UX 和 AI 缺口之前，Zip
              的前门优势是否足够大，能否扩展成耐久的套件经济性。
