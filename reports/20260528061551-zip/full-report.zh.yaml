  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 公开证据
      - 收入质量
      - 尽调要求
    rows:
      - - 核心采购编排
        - 企业订阅 / 平台许可
        - 官方产品页和联系销售页面显示其为报价式企业销售，而非标价销售
        - 一旦嵌入审批和需求受理，收入可能具备经常性和黏性
        - 按队列提供 ARR、平均合同期和续约增幅
      - - 采购到付款自动化
        - 围绕 PO、发票和 AP 工作流做模块增购
        - 官方 P2P 页面展示 PO、发票、结账和欺诈筛查工作流
        - 支撑现有账户内的扩张收入
        - 披露各模块附加率、价格提升和服务收入组合
      - - AI 智能体和 AI 自动化
        - 叠加在工作流数据上的附加 / 扩张 SKU
        - AI 页面提到 10M 条洞察、需求受理提速 3x、发票处理提速 5x
        - 可能扩张 ACV，但计算成本和定价不透明
        - 披露 AI SKU 定价、客户采用率和 AI 毛利率
      - - 全球支付
        - 支付能力嵌入软件，叠加支付通道使用
        - 全球支付页面提到 140+ 个国家、40+ 种货币和多种付款方式
        - 拓宽变现面，但相较纯软件可能拉低混合毛利率
        - 披露抽成率、支付通道成本、欺诈损失和营运资本敞口
      - - 实施 / 部署支持
        - 前置服务，或嵌入式支持负荷
        - G2 和 Software Advice 提到部署快、对外部实施方依赖更低
        - 能加快获客，但若服务占比重会稀释毛利率
        - 披露专业服务收入占比和实施人员配置模型
    notes: 公开收入结构未披露；收入流标签描述的是证据能支撑的变现面，而不是经审计的贡献比例。
