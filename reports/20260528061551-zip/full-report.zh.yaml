      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Zip 于 2020 年由三位创始人共同创办，他们都在 Airbnb 亲身经历过失灵的企业采购。Rujul Zaparde（联合创始人兼 CEO）是连续创业者，曾从 Harvard 辍学创办
              FlightCar（YC W2013），这家 P2P 租车市场被他带到 17 个网点，最终被 Mercedes-Benz 收购。创办 Zip 之前，Zaparde 在 Y Combinator 担任
              Visiting Partner。Lu Cheng（联合创始人兼 CTO）在 Airbnb 工作六年，最后担任 Airbnb Experiences 工程负责人。Felix Meng（联合创始人）负责 Zip
              的商业化。他们共同的 Airbnb 背景，让创始团队直接看到了复杂企业采购系统的痛点，也构成了有说服力的创始人与市场契合。


              三位创始人之外，Zip 的领导团队还包括来自 Apple、Airbnb 和 Meta 的产品负责人，以及曾在 United Health、Sanofi、MGM Resorts、Discover 和 NASA
              从事采购相关工作的运营高管。截至报告日期，公开来源没有发现核心高管团队出现重大离职。公司董事会包括关键投资方代表，尤其是 BOND General Partner、Atlassian 前总裁 Jay
              Simons，他在 Series D 之后加入。治理细节，包括准确董事会构成和是否有独立董事，均未公开披露。


              现阶段，Zip 对 Zaparde 的关键人物依赖是一个明确风险：他既是可见度最高的 CEO，也是主要外部发言人。Lu Cheng 作为工程负责人，对产品方向同样关键。公司展现出制度连续性：截至 Series D
              和五周年里程碑，三位联合创始人仍都深度参与公司。
