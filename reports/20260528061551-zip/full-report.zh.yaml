      - number: '6.3'
        title: 扩张模式、耐久性代理指标和采购摩擦
        blocks:
          - type: paragraph
            body: >-
              公开证据指向稳定的先落地再扩张动作。Zip 往往先作为需求入口或编排层落地，替换电子表格、邮件、Jira、Coupa 或其他割裂工具；随后扩展到采购到付款、寻源、支付、供应商卡、AI
              智能体，或更广泛的部门部署。Canva 当前案例列出一个很宽的多产品版图，覆盖从需求入口到采购、采购到付款、寻源、全球支付、供应商卡和集成平台。Anthropic 描述了从公司卡转向结构化 P2P
              流程。OpenAI 从最初一个 AI 智能体扩展到 10+ 个智能体。ADT 从 IT 主导试点扩展成更广的编排层。Datadog 的案例把 Zip 定位为替换此前以 Coupa 为中心的栈，而不是一个点状功能。


              耐久性披露则明显变薄。公开材料不披露准确客户数、NRR、GRR、客户数流失、平均合同期限或头部客户占比。最强的耐久性代理指标是定性的：多个当前案例描述了初始部署后的范围扩张；G2 显示 83
              条评论和近期活动；评论网站反复称赞实施速度、工作流灵活性、集成和响应式支持。同一批评论也暴露出若不解决、可能影响续约的摩擦。G2 和 Software Advice 提到供应商主数据限制、AP 收件箱和 PDF
              处理限制、加载慢、报表缺口、手工队列、西方时区支持限制，以及反复出现的 Ironclad 集成故障。这些问题本身不是投资逻辑杀手，但说明 Zip 的采用故事在复杂部署边缘存在真实运营阻力。
