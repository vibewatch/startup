          to: trust
          label: 削弱
        - from: cloud_dep
          to: migration
          label: 复杂化
        - from: erp_dep
          to: trust
          label: 拖慢部署
        - from: migration
          to: support
          label: 推高
        - from: trust
          to: renewals
          label: 施压
        - from: support
          to: capital
          label: 降低效率
        - from: renewals
          to: capital
          label: 传导至
        - from: ai_gov
          to: capital
          label: 可能触发
    claimRefs:
      - CR011
      - CR022
      - CR027
      - CR032
      - CR040
      - CR044
  - id: FR003
    title: 依赖地图
    type: dag
    summary: Zip 的关键依赖分布在 AWS 托管、AI 模型供应商、ERP 连接器、相邻支出平台，以及面向客户的可观测性 / 支持工具。
    data:
      nodes:
        - id: aws
          label: AWS 托管
        - id: ai_stack
          label: Anthropic / Google / Azure
        - id: erp
          label: NetSuite 和其他 ERP / P2P 系统
        - id: ecosys
          label: Brex 和生态合作伙伴
        - id: ops_tools
          label: Datadog / LaunchDarkly / Intercom / LangSmith
        - id: customers
          label: 企业客户
        - id: zip
          label: Zip 平台结果
      edges:
