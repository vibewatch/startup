        - 员工 + 采购
        - 已上线 / 核心产品
        - 自然语言请购、自动路由、面向采购的 AI 智能体
        - 自定义请购扩展所需的公开 API 和数据模型细节仍有访问门槛
      - - Procure-to-Pay
        - 采购 + 财务 + AP
        - 已上线 / 核心产品
        - 上游请购在一条流程里驱动 PO、发票和付款自动化
        - 没有公开 SLA，也没有异常处理准确率的公开基准
      - - Supplier Onboarding
        - 采购 + 法务 + 安全 + 供应商
        - 已上线 / 核心产品
        - AI 门户、集中供应商档案、自动 TIN/VAT/OFAC/D&B/银行校验
        - 供应商数据的托管区域和数据驻留选项未公开
      - - Sourcing
