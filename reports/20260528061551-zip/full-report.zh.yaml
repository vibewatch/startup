  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私、AI 和法律风险
        blocks:
          - type: paragraph
            body: >-
              Zip 公开法律页面显示的是真实合规负担，不是空泛的信任中心营销。其信任和隐私页面明确称，公司承诺遵守 GDPR 和 CCPA 标准，在受限传输中使用 SCCs 和英国 IDTA 附录，参与 Data
              Privacy Framework，并把 Data Processing Agreement 写入标准 MSA。2024 年 6 月 DPA 进一步放大风险边界：适用法律被定义为包括 GDPR、UK
              GDPR、瑞士 FADP 和 CCPA；一旦出现不合规迹象，客户获得审计权。这是一项缓释，但也意味着一旦出问题，企业买方可以强制审查。

              AI 扩大了法律暴露面。Zip 现在营销 DORA 评估、负面媒体、合同风险和需求入口验证智能体，以及一个可自动化供应商审查和持续义务监控的合同编排产品。EU AI Act 的高风险框架不能逐项套用到今天的
              Zip 用例，但它显示了监管在高影响 AI 的人工监督、记录留存和风险控制上正往哪里走。正面看，Zip 称截至目前未收到政府数据请求，其政策承诺在适当情况下收窄并挑战请求。负面看，已审查的公开搜索页面没有发现
              Zip 的 FTC、SEC、制裁或重大违规记录，但这些负面检查样本稀疏，并不能洗清风险。正确结论是：法律监管风险可控但不轻，最大的开放尽调项在 AI 治理、执法历史和客户合同谈判偏离。
