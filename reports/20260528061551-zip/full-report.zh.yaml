  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 支撑证据
      - 主要威胁
      - 严重性
      - 缓释措施 / 尽调要求
    rows:
      - - 需求方 UX 和无代码工作流设计
        - 评论和对比普遍认为 Zip 直观、可配置、易部署
        - 既有厂商改进引导式采购和 AI 辅助需求受理
        - 中
        - 要求提供相对 Coupa / SAP / Oracle 的正面对比演示评分和管理员变更日志
      - - 覆盖式部署在 ERP / P2P 之上
        - Zip 可集成 SAP、NetSuite、Coupa、Workday、Slack、Okta、DocuSign
        - 买家选择加深既有套件，而不是增加 Zip
        - 高
        - 量化已部署既有套件账户中的附加率、扩张率和胜率
      - - 快速实施和采用
        - 4-8 周对比数据，以及评论中较强的上线导入证据
        - 财务牵头的替代方案也主打快速体现价值
        - 中
        - 按细分市场和实施伙伴收集上线时间队列数据
      - - AI 主导的编排叙事
        - Zip 推出 50+ 个专用 AI 智能体，并主打编排深度
        - Coupa、SAP、Ivalua、Oracle 和 ServiceNow 也在营销嵌入式或智能体 AI
        - 高
        - 检验哪些 AI 功能每周真正被使用，哪些拉动净留存
      - - 跨法务 / IT / 财务的采购控制
        - Zip 和评论强调多利益方路由与审计轨迹
        - ServiceNow 和 ERP 原生工作流本就嵌在相邻企业控制平面里
        - 高
        - 梳理 Zip 因跨职能编排优于 Now / ERP 原生工具而赢单的场景
      - - 中端市场先落地再扩张的切入点
        - Zip 定位在 200-10,000 名员工公司；中端市场下沿仍渗透不足
        - Procurify、Ramp、Airbase、Brex 和 ProcureDesk 类工具从下方挤压该细分市场
        - 高
        - 按公司规模和输给轻量替代方案的原因拆分销售管线
      - - 超越需求受理的套件深度扩张
        - Zip 正在扩展到 P2P、寻源和 AP
        - 客户评论仍提到报表、账单模块和供应商主数据限制
        - 高
        - 用产品使用数据和按队列划分的模块附加率验证路线图可信度
      - - 企业信任姿态
        - 品类领导者都宣传认证、正常运行时间和隐私控制
        - 信任成为入场券，而不是差异化
        - 中
        - 要求提供 Zip 当前认证组合、正常运行时间历史，以及按地区划分的监管姿态
      - - 定价和 ROI 透明度
        - 公司声称 ROI 快，但公开的实际成交价和胜率数据很薄
        - 定价不透明会削弱买家信心，也让竞争基准更复杂
        - 中高
        - 要求提供实际成交价区间、ROI 案例研究和竞争替换证据
    notes: 严重性为定性判断，反映各风险对 Zip 的竞争重要性，而非按概率加权的财务损失；尽调要求就是关闭每项风险所需的具体下一步。
