      - - SAP Ariba
        - 定制报价
        - 企业套件 / 网络定价
        - 高
        - 广泛的 S2P，加供应商网络和相邻支出工具
        - 公开标价缺失
        - 最适合 SAP 相邻系统已经足以支撑企业级采购流程的场景
      - - Ivalua
        - 定制报价
