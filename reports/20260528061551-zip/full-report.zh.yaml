  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 没有 Zip 时的现有流程
      - Zip 方案
      - 可衡量收益 / 产出
      - 限制
    rows:
      - - 发起采购申请
        - 邮件、聊天、工单、电子表格，且上下文缺失
        - Intake-to-Procure + Procurement Concierge
        - 一开始就生成结构化申请；公司称请购完成速度快 3x
        - Concierge 指引的公开准确率数据有限
      - - 推进跨职能审批
        - 手动追采购、法务、IT、安全和财务各方
        - Workflow Engine，支持动态审批人和队列
        - 状态透明，审批瓶颈减少
        - 配置质量取决于客户的政策设计
      - - 供应商入驻
        - 各团队分散使用门户、文档和风险检查
        - 供应商入驻 + 供应商管理 + 风险编排
        - 公司称入驻周期缩短 85%，门户完成率达 98%
        - 供应商数据驻留和区域细节没有明确公开
      - - 发起 RFx 并谈判价格
        - 临时模板、邮件串和人工市场调研
        - Sourcing，带 RFx 生成和价格谈判智能体
        - 在一条工作流里更快创建寻源事件，并引入更多供应商竞争
        - 没有第三方公开基准衡量节省兑现质量
      - - 审查买方合同
        - 法务系统割裂，采购参与方可见性弱
        - AI Contract Orchestration 和 Ironclad 集成
        - 在采购工作流中做基于风险的分流、红线修订和续约跟踪
        - 从业者评论样本仍提到部分 Ironclad 集成故障
      - - 处理发票并向供应商付款
        - 共享收件箱、手工编码、银行门户，以及割裂的 AP 工作
        - 采购到付款 + 全球支付
        - 公司称发票处理速度快 5x；内置银行验证和 ERP 对账
        - 公开披露的付款伙伴和 SLA 信息有限
      - - 快速发起卡支付采购
        - 在采购工作流之外手动申请卡
        - Vendor Cards
        - 申请、审批、发卡和对账都绑定同一条申请记录
        - 覆盖范围取决于外部卡伙伴网络
    notes: 标为速度提升的收益来自公司或评论网站披露，不是第三方审计。Zip 的工作流价值在两处最强：消除碎片化请购入口，减少参与方交接。
