  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              Zip 公开呈现的货币化模式更像典型联系销售模式下售出的企业工作流 SaaS，而不是透明自助定价。采购到付款和销售联系页面都不公布标价；Zip 会把潜在客户导入定制化企业销售周期。这与产品足迹一致：Zip
              如今销售更广的采购技术栈，包括需求入口编排、采购到付款、AI 代理、全球支付、供应商卡和其他附加模块，因此实际定价大概率取决于模块组合、工作流复杂度、集成和支付量。

              可用第三方定价证据很薄，置信度也低。SelectHub 称 Zip 按年度报价、没有免费试用，只给出粗略的「$1,000 或更高」起价估计；这只能方向性确认定价不透明，不能代表实际
              ACV。更重要的是企业销售中使用的公开价值证据：2026 年 Forrester 支持的 TEI 页面称，四家大型企业访谈建模得到三年 386% ROI；官方客户故事则显示 Dollar
              Tree、Snowflake、Discover 和 OpenAI 获得高度具体的节省和效率结果。这一组合说明 Zip 依靠业务结果销售来货币化，而不是靠公开费率表。

              工作流的任务关键性可能提升收入质量。采购请求、审批、PO、发票和供应商付款嵌在跨职能运营流程中，部署后通常更难替换。不过，实际合同期限、扩张定价、续约提价、折扣和模块附加率均未披露，因此仅靠公开来源无法充分承销实际收入质量。
