      - number: '8.2'
        title: 投资逻辑、反向逻辑和可比公司组
        blocks:
          - type: paragraph
            body: >-
              Zip 的正向案例有证据支撑。Gartner 现在把公司放在寻源到付款中与 SAP、Coupa 和 Oracle 并列；PwC
              的工作流引力框架也解释了为什么采购编排如果真的成为财务和合规工作流的记录系统，而不是一层很薄的用户界面，就可能守住定价权。Zip 的公开客户名单、大型供应商图谱和快速 AI
              产品节奏支撑这种可能。反向逻辑同样真实。采购软件不能豁免于 2026 年软件估值重置：Foley、BMO、MCF 和 Windsor Drake
              都指向更紧的估值区间、更高的单位经济审查，以及防御性平台和普通工作流 SaaS 之间更尖锐的区分。公开可比公司也强调了这一点。按当前市值收入比筛选，Workday 约为 3.2x 收入，SAP 约
              4.7x，ServiceNow 约 7.5x，Oracle 约 8.6x。历史 Coupa 背景有帮助但不决定结论：$8 billion 私有化交易和 Coupa 当前 3,100
              客户规模展示了成熟采购领导者可能长成什么样，但不能改变 Zip 自身收入转化和利润率质量仍未公开的事实。因此，可比公司组支持的是混合区间，而不是明确的溢价结论。
