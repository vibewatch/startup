      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              主要增长驱动来自 AI 采用、云现代化和支出可视化要求。Mordor Intelligence 的驱动模型中，长尾支出自动化 AI 对 CAGR
              的影响最大（+6.1%），其次是成本削减和支出可视化要求（+5.2%），以及云原生 S2P 现代化（+4.5%）。这些驱动彼此强化：成本压力带来可视化需求，可视化又需要云原生数据架构，后者进而让 AI
              代理能贯穿采购生命周期运转。预计到 2026 年，75% 的大型企业会使用 AI 驱动的采购解决方案；80% 以上公司会完成采购流程数字化。

              云采用是结构性使能因素：2025 年，云部署占采购软件市场 67.92% 份额，并在 2031 年前保持 9.81% CAGR。原因主要在于 SaaS
              模型把大额资本开支转成运营成本，而且不需要本地基础设施就能快速部署。医疗是增长最快的终端用户板块（Mordor 给出的 CAGR 为 9.79%），因为含受保护健康信息的供应商合同需要 HIPAA
              驱动的审计日志。EU AI Act 对自动化采购决策的算法透明度提出合规要求，也在欧洲公共部门买方中制造替换需求。

              采用约束是结构性的，且被看多 TAM 预测低估。传统 ERP 锁定是最大单一障碍：数十年定制化的本地 SAP、Oracle 或 Infor 工作流制造了切换成本，即便 ROI 可以证明也会推迟迁移；截至
              2025–2026 年，约 60% 的 SAP ERP 客户仍运行传统 ECC6 平台。当子处理方在欧洲经济区之外运营时，GDPR 跨境数据摩擦会限制云托管供应商数据库。86%
              的英国组织称建设数字采购技能存在相当大障碍，人才短缺居首。供应商碎片化在集成多个点解决方案时制造互操作问题，进一步拉长部署时间。

              仅 P2P 自动化就能让采用者最多降低 60% 处理成本；部署 AI 的采购团队称 90 天内周期时间缩短 40% 到 60%。但这些 ROI
              预测高度依赖员工采用，而员工采用需要变更管理投入，采购技术供应商很少把这部分成本计入销售周期。
