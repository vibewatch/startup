      - number: '2.2'
        title: 市场规模 —— TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              五家分析机构给出了采购软件市场的 2026 年估计，总可寻址市场从 $9.88B（Fortune Business Insights）到 $11.14B（Business Research
              Company）不等。Mordor Intelligence 将 2026 年规模估为 $10.74B；Grand View Research 以 2025 年 $10.06B 为基数，预计 CAGR 为
              10.0%；IMARC Group 估计 2025 年为 $8.9B，到 2034 年达到 $18.2B。2026 年点估之间有 13%
              的差距，来自市场定义（有些纳入专业服务和托管采购，有些只算软件）、地域范围和底层一手研究时间的差异。

              对 Zip 的主要竞争场域寻源到付款套件而言，MarkWide Research 估计 2026 年市场规模为 $8.7B，到 2035 年以 11.4% CAGR 增至
              $22.99B。采购到付款子赛道（不含上游寻源的更窄切片）由 6W Research 估为 2025 年 $5.2B、2032 年 $10.4B。Mordor Intelligence 将采购平台中的 AI
              市场估为 2026 年 $4.99B、2031 年 $19.74B，对应 31.67% CAGR；由于 AI 能力正作为溢价层附着在这些套件上，这一增速结构性快于底层软件市场。

              还没有分析师为 Zip 的具体滩头阵地——以需求入口编排为先、服务中型市场和成长阶段企业的采购——发布清晰 SOM 估计。最接近的替代指标，是 Gartner 将 Zip 纳入 2026 S2P Magic
              Quadrant 时首次承认的需求入口与编排（I&O）子赛道。证据部分保留这一缺口。

              CAGR 估计明显分化：Business Research Company 对采购软件给出的历史 CAGR 为 13.6%（基准年份和方法不同），与 Mordor 对同一市场给出的前瞻 CAGR 9.76%
              相冲突，差距达 390 个基点。没有底层一手调查，无法调和这一差异。
