        - 采购、AP、合同、费用 / 卡
        - 虽有定价页，但没有公开价目表
        - 复杂度较低的买家无需承担套件开销，也能建立控制
      - - Ramp
        - 公开渠道未显示采购标价
        - 打包在财务技术栈内；定价细节另有说明
        - 低到中
        - 采购、AP、公司卡、供应商情报
        - 采购专项定价未公开
