        - NRR、GRR、客户数流失率和按同期群拆分的扩张
        - 高 AI 和工作流估值倍数很大程度取决于可持续的先落地、再扩张
        - 收入运营和财务分析
      - - 股权结构和融资轮条款
        - 股份类别、清算优先权、参与权、按比例跟投权和任何附带协议
        - 如果下行保护异常强，名义投后估值可能错估普通股价值
        - 公司律师和融资文件
      - - 客户集中度和部署深度
        - 头部客户 ARR、续约时间、模块采用和部署深度
        - 如果变现集中或停在浅层，已处理支出和供应商数量的参考价值会下降
        - CRO 材料包和客户成功报表
      - - 退出准备度
        - 战略买家图谱、财务赞助方兴趣、已审计控制准备度和 IPO 准备路线图
        - 最可能的流动性路径是战略收购或财务赞助方主导，因此退出准备会改变今天的估值
        - CEO、董事会材料和投行顾问参考
    notes: 每个尽调问题都对应一个可能改变投资建议、可接受入场价格，或两者都改变的变量。
    claimRefs:
