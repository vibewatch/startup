      - number: '2.5'
        title: 证据缺口与尽调问题
        blocks:
          - type: paragraph
            body: >-
              仅靠公开证据无法解决几个关键规模和采用问题。最实质的缺口，是 Zip 开创的「需求入口编排优先」子赛道没有清晰的 SAM 或 SOM。五家分析机构的 TAM
              估计都覆盖整个采购软件市场；没有分析师单独给出需求入口与编排层的美元规模。Gartner 在 2026 年首次把 Zip 纳入 S2P MQ，确认 I&O 品类正被吸收到更广的市场定义中，这也让自下而上的 SOM
              估算更复杂。

              第二个缺口是，缺少分析师估计中型市场买方与 Fortune 500 买方各自管理了多少企业采购预算；要更精确测算 Zip 的真实 TAM，需要这一输入。第三个缺口是，Zip
              声称已处理支出（$500B+）和节省金额（$6.8B）均为公司披露，缺乏独立验证。最后，分析师之间的 CAGR 分歧（8.05% 到
              13.6%）代表真实方法论冲突；没有一手调查数据无法解决，也限制了以单一估计锚定长期收入预测的可靠性。

              尽调问题包括：（1）索取 Gartner 2026 S2P MQ 完整报告（ID G00833291），理解其如何测算 I&O
              子市场；（2）获取专门针对需求入口编排市场的独立分析师估计；（3）通过客户渠道访谈核验 Zip 的已处理支出和节省金额；（4）通过一手买方访谈评估目标垂直行业（科技、医疗、金融服务）的采购 IT 采用率。
            claimRefs:
              - CM040
