companyProfile:
  summary: >-
    Zip is a San Francisco-based procurement orchestration company founded in 2020 by Rujul Zaparde,
    Lu Cheng, and Felix Meng. The company has built an AI-powered intake-to-pay platform spanning
    intake, sourcing, supplier management, purchasing, invoice workflows, AI contract orchestration,
    and global payments, and it now serves a visible set of large enterprise customers across AI,
    software, financial services, telecom, retail, and other regulated or operationally complex
    segments. Public evidence supports meaningful category credibility, but major underwriting inputs
    remain private.
  foundedDate: '2020-01-01'
  founders:
    - name: Rujul Zaparde
      role: CEO
      background: >-
        Former FlightCar founder and CEO and later a Visiting Partner at Y Combinator before
        co-founding Zip.
      claimRefs: [CO003, CO006]
    - name: Lu Cheng
      role: CTO
      background: >-
