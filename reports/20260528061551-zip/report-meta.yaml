  foundingLocation: San Francisco, California
  headquarters: San Francisco, California
  productSummary: >-
    AI-powered procurement orchestration platform covering intake management, sourcing, supplier
    management, PO and invoice workflows, AI contract orchestration, and global payments in one
    system.
  customerFocus: >-
    Enterprise, mid-market, and startup buyers are marketed, but the strongest public proof is among
    large enterprises in AI, software, financial services, telecom, retail, and other complex,
    multi-stakeholder procurement environments.
  businessModel: >-
