  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              Zip operates in the indirect procurement software market, which covers non-production spend— software
              subscriptions, IT hardware, professional services, marketing, facilities, and contingent labor—as distinct
              from direct procurement of raw materials and finished goods used in manufacturing. This distinction
              matters because indirect spend is typically more fragmented, more policy-driven, and more dependent on
              employee-facing intake workflows than direct sourcing, where supply chain ERP modules already dominate.

              The broadest relevant universe is the global procurement software market, which encompasses e-procurement,
              supplier management, contract lifecycle management (CLM), e-sourcing, spend analytics, and source-to-pay
              (S2P) suite platforms. Included spend categories are indirect goods and services, tail spend, professional
              services, SaaS renewal management, and enterprise technology purchases. Excluded are direct manufacturing
              procurement (dominated by supply chain ERP), accounts payable (AP) automation as a standalone product, and
              logistics/fulfillment platforms. Adjacent markets—AP automation, CLM, supplier risk intelligence, and
              spend analytics—each have dedicated vendor sub-markets and provide natural cross-sell paths but are not
              core to Zip's current positioning.

              Status-quo substitutes remain significant: most enterprises without a dedicated S2P platform route
              procurement through ERP-native modules (SAP MM, Oracle iProcurement), manual email and spreadsheet
              approval chains, or ad hoc ticketing systems in Slack, Jira, or ServiceNow. Eighty-eight percent of
              procurement leaders report employees must log into at least two external systems for every single
              procurement request, and only 18% describe their stack as fully integrated—evidence that the substitution
              problem is live and wide.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM026
          - type: table
            tableRef: TM001
            claimRefs:
              - CM012
