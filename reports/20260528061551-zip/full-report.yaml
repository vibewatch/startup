        title: Customer segmentation by buyer, user, payer, and use case
        blocks:
          - type: paragraph
            body: >-
              Zip's own go-to-market surface still advertises three size motions—enterprise, mid-market, and
              startups—but the publicly inspectable customer proof retained for this run is much more
              enterprise-weighted. The live case-study set centers on OpenAI, Anthropic, Snowflake, Discover, T-Mobile,
              Invesco, Prudential, Dollar Tree, Datadog, Coinbase, Arm, and ADT: buyers that are already large,
              regulated, or operationally complex enough to feel acute pain from fragmented procurement workflows. That
              matters because it suggests Zip's strongest public proof is not 'general procurement for everyone,' but
              orchestration for organizations where procurement, finance, IT, security, and legal all need a common
              intake and review layer.


              Across those references the economic buyer is usually a Chief Procurement Officer, head of procurement,
              finance-operations leader, or IT supplier-management owner. The day-to-day users are broader: employees
              submitting requests, sourcing managers, AP teams, TPRM teams, and business approvers. The payer is
              typically the central procurement or finance budget owner, even when the initial champion sits in IT or
              operations. Use-case repetition is striking. OpenAI, Anthropic, and Snowflake emphasize orchestration plus
              AI-assisted procurement at scale; Discover, Prudential, and Invesco emphasize compliance, visibility, and
              stakeholder experience in financial services; Datadog, Coinbase, Arm, and ADT emphasize replacing
              fragmented procurement stacks or homegrown workflows; Dollar Tree and T-Mobile emphasize spend influence
