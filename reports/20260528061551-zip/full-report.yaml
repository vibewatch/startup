  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, privacy, AI, and legal risk
        blocks:
          - type: paragraph
            body: >-
              Zip's public legal surfaces show a genuine compliance burden, not empty trust-center marketing. Its trust
              and privacy pages explicitly say the company is committed to GDPR and CCPA standards, uses SCCs and a UK
              IDTA addendum for restricted transfers, participates in the Data Privacy Framework, and bakes a Data
              Processing Agreement into its standard MSA. The June 2024 DPA broadens the risk envelope further by
              defining applicable laws to include GDPR, UK GDPR, Switzerland's FADP, and CCPA, and by giving customers
              audit rights when there are indications of non-compliance. That is a mitigation, but it also means
              enterprise buyers can force scrutiny when something goes wrong.

              AI expands the legal surface area. Zip now markets DORA assessment, adverse media, contract-risk, and
              intake-validation agents, plus a contract-orchestration product that automates supplier review and ongoing
              obligation monitoring. The EU AI Act's high-risk framework does not neatly map one-for-one onto today's
              Zip use cases, but it does show where regulators are moving on human oversight, record-keeping, and risk
              controls for consequential AI. On the positive side, Zip says it has received no government requests for
              data to date and its policy commits to narrow and challenge requests where appropriate. On the negative
              side, reviewed public search surfaces did not identify an FTC, SEC, sanctions, or major violation record
              for Zip, but those negative checks are sparse rather than exculpatory. The right conclusion is that
              legal-regulatory risk is manageable but non-trivial, with the biggest open diligence items around AI
              governance, enforcement history, and negotiated customer-contract deviations.
            claimRefs:
