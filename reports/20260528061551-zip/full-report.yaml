      - number: '5.2'
        title: Architecture, integration model, and deployment surface
        blocks:
          - type: paragraph
            body: >-
              Public materials consistently frame Zip as an integration-first SaaS layer rather than a rip-and- replace
              suite. The Workflow Engine provides no-code routing, queues, hierarchies, and cross- functional approvals;
              Vendor Management and Spend Insights provide persistent data and reporting surfaces; and App Studio
              extends the platform to custom REST and SOAP systems without forcing a new user-facing workflow. Zip's
              deployment model assumes customers already run ERP, P2P, CLM, GRC, ITSM, or collaboration systems and want
              Zip to govern how requests enter those systems, not to throw them away. Public examples include Slack for
              requester and approver interaction, Ironclad for legal review, and SAP Ariba for requisition sync. The
              delivery stack is cloud based and depends on AWS and a broader subprocessor set that includes Anthropic,
              Google, Datadog, Fivetran, Fullstory, and Intercom. That architecture is flexible and likely fast to
              deploy relative to legacy suite projects, but it also creates dependency risk: customer value depends on
              connector quality, policy design, third-party uptime, and the quality of data flowing in from upstream and
              downstream systems.
