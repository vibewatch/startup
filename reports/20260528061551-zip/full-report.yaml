              studies with named operators and specific outcomes; weaker rows are stories that are current but more
              directional than numeric. Production maturity nonetheless looks real. Nearly every retained reference
              describes a live deployment, not a lab pilot. ADT is the clearest staged rollout: it began with an
              IT-focused pilot, then expanded orchestration across a broader enterprise procurement environment. That is
              a positive adoption signal, but it also underlines a limitation of the public set: Zip does not publish an
              exhaustive customer roster, attach-rate table, or renewal schedule, so the analysis can show visible wins
