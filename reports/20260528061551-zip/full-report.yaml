      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Zip has raised $371 million across four disclosed venture funding rounds since its founding in 2020. The
              company entered the Y Combinator Winter 2021 batch, which provided early validation and the first
              institutional capital. In August 2021, Zip closed a $26.8 million Series A led by Tiger Global with
              participation from CRV and Y Combinator Continuity. In May 2022 the Series B raised $43 million led by YC
              Continuity with Tiger Global and CRV participating, bringing the post-money valuation to $1.2 billion —
              achieving unicorn status roughly 18 months after founding. The Series C in May 2023 raised $100 million at
              a $1.5 billion post-money valuation from Y Combinator, CRV, and Tiger Global. The Series D in October
              2024, the largest in the company's history, raised $190 million led by BOND (with Jay Simons as the deal's
              General Partner) at a $2.2 billion valuation, with new investors DST Global, Adams Street Partners, and
              Alkeon Capital alongside existing investors.


              The Series D was described by the company and investors as the largest single investment in procurement
              technology in over two decades. Proceeds were earmarked for accelerated R&D (including establishing a Zip
              AI Lab), geographic expansion (particularly EMEA where growth had exceeded 200% year-over-year), and
              continued headcount growth. No secondary transactions or debt financing have been identified in publicly
              available sources; these remain evidence gaps requiring direct management inquiry. Zip is a private
              company with no public disclosure obligations; revenue, ARR, gross margin, and burn rate are not available
              from public sources.
