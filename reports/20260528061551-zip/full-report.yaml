      - number: '5.3'
        title: AI operating model, release path, and developer signal
        blocks:
          - type: paragraph
            body: >-
              Zip's 2025-2026 product story is the transition from orchestration to agentic automation. The company now
              markets a suite of 50-plus AI agents for procurement-specific tasks such as intake validation, price
              negotiation, contract review, supplier 360 analysis, DORA screening, SOC 2 summarization, invoice coding,
              and payment risk checks. The important product detail is not merely that generative AI exists somewhere in
              the UI; Zip is embedding those agents into the exact nodes where employees, approvers, legal teams, AP
              teams, and suppliers already interact with the workflow. Public developer and practitioner signal is
              thinner than a traditional platform company because the detailed API reference is gated, but there is
              still enough surface to confirm real integration work: public integration docs, a visible API reference
              shell, an API-tracker catalog showing webhooks and GraphQL references, and a public engineering blog.
              Recent external coverage also confirms that Zip's 2024 release train focused on low-code extensibility and
              templates, while 2025 focused on agentic AI and broader procurement automation. The result is a credible
              roadmap toward deeper automation, even if outsiders cannot fully inspect the API surface without customer
              credentials.
