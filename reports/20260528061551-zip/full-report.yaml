      - number: '4.2'
        title: Sales motion and efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Zip's public customer evidence points to a top-down enterprise sales motion that wins on deployment speed
              and measurable savings rather than on lowest list price. G2's review aggregation points to a 3-month
              average implementation period and an 8-month ROI window. Software Advice reviews go further, with users
              saying Zip did not require a separate third-party implementation team and that easy deployment helped it
              win the deal. Those are useful CAC-payback proxies for a private company that does not publish magic
              number, CAC, sales payback, or net retention.

              Customer stories reinforce the pattern. Dollar Tree cites $125M of supported savings and a 70% reduction
              in cycle times; Snowflake cites $305M of savings and $3.7B of spend visible before approval; Discover
              cites 3,000 approvals removed and 67% higher throughput; OpenAI cites 10+ AI agents in production and
              1,400 hours saved from the first agent alone. These are company-authored claims, so they should be treated
              as best-case case studies rather than portfolio averages, but they still show the kind of ROI narrative
              Zip can take into a CFO- or CPO-led deal cycle.

              The missing link is cohort data. Public sources do not disclose win rates, CAC, sales-cycle length by
              segment, average contract value, expansion revenue, or renewal behavior. Without those metrics, public
              evidence supports a plausible enterprise-efficiency story but not a robust sales-efficiency model.
            claimRefs:
