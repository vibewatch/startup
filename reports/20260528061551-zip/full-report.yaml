      - number: '2.2'
        title: Market Sizing — TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: >-
              Five analyst firms provide 2026 estimates for the procurement software market, spanning $9.88B (Fortune
              Business Insights) to $11.14B (Business Research Company) for the total addressable market. Mordor
              Intelligence puts the 2026 figure at $10.74B, Grand View Research anchors at the 2025 base of $10.06B
              growing at 10.0% CAGR, and IMARC Group estimates $8.9B in 2025 reaching $18.2B by 2034. The 13% spread
              across 2026 point estimates reflects differences in market definition (some include professional services
              and managed procurement; others are software-only), geographic scope, and vintage of the underlying
              primary research.

              For the source-to-pay suite segment—Zip's primary competitive arena—MarkWide Research estimates the 2026
              market at $8.7 billion, growing to $22.99 billion by 2035 at an 11.4% CAGR. The procure-to-pay sub-segment
              (a narrower slice excluding upstream sourcing) is valued at $5.2B in 2025 by 6W Research, reaching $10.4B
              by 2032. The AI in procurement platforms market, which captures value from embedded automation and agentic
              workflows across these suites, is sized by Mordor Intelligence at $4.99B in 2026 and $19.74B by 2031,
              reflecting a 31.67% CAGR that is structurally faster than the underlying software market because AI
              capability is being attached as a premium layer.

              No analyst has published a clean SOM estimate for Zip's specific beachhead—intake-orchestration- first
              procurement for mid-market and growth-stage enterprises. The closest proxy is the intake and orchestration
              (I&O) sub-segment first recognized by Gartner when Zip was added to the 2026 S2P Magic Quadrant. This gap
              is preserved in the evidence section.

              CAGR estimates diverge materially: Business Research Company's 13.6% historic CAGR for procurement
              software (different base year and methodology) contradicts Mordor's 9.76% forward CAGR for the same
              market, a 390-basis-point gap that cannot be reconciled without access to the underlying primary surveys.
