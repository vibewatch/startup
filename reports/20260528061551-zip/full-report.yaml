      - number: '8.3'
        title: Scenario range and exit path
        blocks:
          - type: paragraph
            body: >-
              Because Zip's current revenue and margins are undisclosed, the scenario work has to be explicit about what
              is assumption and what is evidence. Evidence gives us the round price, the compressed 2026 public-multiple
              backdrop, and a procurement benchmark from Coupa; it does not give us a clean current revenue line. The
              bear case assumes Zip is a strong product with real customer adoption but still below the revenue
              threshold needed for a premium private mark, yielding $450 million to $720 million at 3x to 4x revenue on
              a $150 million to $180 million base. The base case assumes $220 million to $260 million of revenue and
              mid-single-digit to high-single-digit multiples, landing at roughly $1.1 billion to $1.82 billion. The
              bull case assumes Zip has already crossed the $300 million revenue line with durable margins, retention,
              and AI-driven expansion, supporting roughly $2.1 billion to $3.24 billion. That distribution matters more
              than the headline valuation because it shows the present mark is not obviously impossible, but it is also
              not yet supported by public proof. Exit logic is similarly constrained. BMO and Foley point to selective
              IPO conditions and a still-stronger M&A or secondaries market, which makes strategic or sponsor-led
              liquidity more supportable than a near-term IPO underwriting case.
