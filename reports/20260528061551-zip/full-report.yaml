  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Zip's product is not best described as a standalone ERP or AP tool; it is a procurement orchestration
              layer that sits at the front of the spend lifecycle. The user job starts when an employee needs to buy
              something, onboard a supplier, renew a contract, run an RFx, or pay an approved invoice. Zip's intake
              products collect the request up front, guide the requester through missing information, and route work to
              the right cross-functional reviewers in procurement, legal, IT, security, finance, and AP. From that front
              door, the product branches into modular workflow surfaces: Intake-to-Procure, Procure-to-Pay, Supplier
              Onboarding, Sourcing, Risk Orchestration, AI Contract Orchestration, AI Procurement Concierge, plus
              add-ons for Global Payments, Vendor Cards, Budgets, and App Studio. That breadth means the product can be
              sold as a lightweight request layer or as a wider intake-to-pay operating system. It also means
              implementation quality depends on how well customers define approval logic, preferred suppliers, budget
              rules, and downstream system sync rather than on a single monolithic deployment.
