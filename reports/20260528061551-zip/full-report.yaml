              The evidence supports a TRACK recommendation with medium confidence, high risk, and a stretched valuation
              stance. That call is intentionally price-sensitive. Public evidence is good enough to avoid an automatic
              pass: Zip has real category standing, meaningful customer proof, and enough operating scale to justify
              serious diligence. It is not good enough to justify a buy recommendation at the $2.2 billion reference
              mark. The gap is not story quality; it is economic disclosure. The public record still cannot tell an
              investor whether Zip is a $150 million revenue business that would look expensive against public software
              screens, or a $300 million-plus business that might deserve a premium for procurement workflow gravity and
              AI expansion. It also does not answer whether the latest round was clean common-equity economics or a more
              structured late-stage deal with downside protection that overstates common value. Those are not side
              issues. They determine whether the current price is full, fragile, or genuinely attractive. The practical
              implication is simple: proceed only on a diligence path that can prove revenue scale, margin durability,
              retention quality, and clean terms. If those files are strong, Zip can move up the recommendation stack.
              If they are weak, the thesis should be broken quickly rather than rationalized.
