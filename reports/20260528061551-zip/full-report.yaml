        title: Exhibits
        blocks:
          - type: callout
            title: Founder-Market Fit and Category Creation
            body: >-
              Zip's founders built the company from direct experience of broken procurement at Airbnb. By creating the
              intake-to-procure and later the procurement orchestration category — rather than competing in an
              established space — they captured early-mover positioning that is difficult for legacy ERP incumbents
              (SAP, Oracle, Coupa) to replicate quickly. This is reinforced by the company's rapid analyst recognition:
              IDC MarketScape leader in 2024, Gartner MQ in 2026, and Spend Matters Value Leader.
