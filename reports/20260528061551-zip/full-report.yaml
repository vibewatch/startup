      - number: '7.4'
        title: People, execution, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              The final risk bucket is execution under private-company opacity. Zip's 2024 Series D and subsequent 2025-
              2026 product push clearly show investor confidence and market momentum: $190 million at a $2.2 billion
              valuation, more than $371 million raised since founding, explicit plans to fund an AI lab and geographic
              expansion, and public claims of rapid customer adoption. CityBiz separately reports that Zip doubled
              headcount from 250 to over 500 employees in a year. Those are positives, but they also imply steep hiring,
              onboarding, and coordination demands at the exact moment Zip is broadening from procurement orchestration
              into agentic procurement and AI contract orchestration.

              Public evidence remains too thin to underwrite the model cleanly. The CEO's claim of 100% retention across
              strategic enterprise customers lacks a disclosed cohort definition, and there are still no public filings
              that let outsiders assess revenue, burn, working-capital intensity, margin profile, or runway. The public
              record shows a sponsor-backed, fast-scaling company adding AI products, platform migrations, new offices,
              and ecosystem partnerships simultaneously. That does not imply imminent failure; it implies that the
              downside case is most likely to appear as multi-front slippage—slower deployments, higher support burden,
              harder renewals, or a need for additional capital on less favorable terms—rather than as one headline
              legal event. Diligence should therefore treat disclosure opacity itself as a core financial-model risk,
              not merely as missing color.
