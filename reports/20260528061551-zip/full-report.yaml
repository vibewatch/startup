      - number: '5.4'
        title: Reliability, trust posture, differentiation, and product risk
        blocks:
          - type: paragraph
            body: >-
              Zip's strongest differentiation is architectural: it intervenes before spend hardens into purchase orders,
              invoices, or payments, where employee behavior, supplier choice, legal review, and policy routing still
              can be changed. That makes the platform more valuable than downstream analytics alone, especially for
              organizations with fragmented back-office tooling. Public trust materials are also stronger than many
              private SaaS peers: Zip discloses TLS and AES encryption, per-customer application-layer encryption,
              Cloudflare WAF, annual penetration testing, Semgrep and Nessus usage, SOC 2 Type 2 and SOC 1 Type 2 audit
              status, transfer-mechanism language, a vulnerability disclosure policy, and a subprocessor list. The weak
              spots are equally visible. The public API detail is gated, public uptime and SLA commitments were not
              located, and public materials do not state product-level hosting regions or residency options.
              Practitioner reviews praise usability and cross-functional workflow guidance but repeatedly ask for better
              reporting and note some integration friction, including an Ironclad issue in one review set. Zip also
              warns directly that its Slack AI experience may produce inaccurate answers, underscoring that autonomy
              still needs human verification for policy- critical decisions.
