      - number: '7.2'
        title: Operational, security, and availability risk
        blocks:
          - type: paragraph
            body: >-
              Zip's own trust and policy stack shows serious control investment, but it also reveals concrete failure
              modes. The company says its program is derived from NIST, CIS, OWASP, and EDPB guidance; customer data is
              encrypted in transit and at rest; Cloudflare WAF, static and dynamic scanning, annual third-party
              penetration tests, SAML/SCIM, MFA, customer audit logs, and least-privilege controls are in place; and the
              security program is governed by the CTO and an internal audit committee. Those are material mitigants. The
              same documents, however, confirm that Zip anticipates data breaches, business-continuity events, and cyber
              incidents, and that the solution is hosted on AWS in the United States.

              The subprocessor roster makes the dependency stack explicit: AWS for cloud and generative-AI services,
              Google and Microsoft Azure for AI-related processing, Anthropic for certain AI-assisted features, plus
              Datadog, LaunchDarkly, Intercom, Asana, and LangSmith across observability, feature flags, support, bug
              triage, and AI tracing. Zero-data-retention commitments and customer opt-out rights help, but they do not
              remove upstream concentration or model-governance risk. Crucially, Zip's public status page proves that
              operational change windows are real: a multi-month platform-upgrade program temporarily removes the
              ability to create or edit vendors, requests, POs, and invoices during weekend migrations. That is not a
              disaster signal, but it is direct evidence that product and operational changes can touch the core
              purchasing workflow. Add independent review complaints around vendor-master-data controls and sharable
              reporting, and the residual underwriting view is that Zip's control posture is credible while
              availability, migration, and integration friction remain top-tier operational risks.
