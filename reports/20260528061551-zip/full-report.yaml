      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Enterprise procurement software involves three structurally distinct roles: the buyer (who selects and
              contracts the platform), the user (employees who submit purchase requests daily), and the payer (finance
              or accounting, who funds the subscription and expects ROI). In practice the CPO or VP of Procurement is
              the primary buyer and internal champion, but CFO co-sign is standard for contracts above $100,000 per
              year, which includes most enterprise S2P deployments.

              Zip's stated target is mid-market to enterprise companies with 200 to 10,000 employees— typically
              post-Series C growth-stage technology companies, newly public companies seeking spend control, and
              mid-size enterprises in healthcare, financial services, and retail that outgrew spreadsheet-based
              procurement without affording a full SAP or Coupa deployment. These buyers are characterized by
              decentralized purchasing, limited procurement staff relative to company size, and high urgency for fast
              implementation and measurable ROI within 90 days.

              Coupa's primary buyer profile is the Fortune 500 enterprise—large, global, multi-division organizations
              with complex compliance requirements, thousands of suppliers, and multi-year S2P transformation programs.
              SAP Ariba's buyer is predominantly organizations already embedded in the SAP ecosystem. Oracle Fusion
              Procurement serves enterprises running Oracle ERP who need audit-ready, governed source-to-pay processes.
              These legacy suites require longer implementations (12–24 months) and higher configuration investments
              than Zip's faster-deployment model.

              Top-quartile CPO teams allocated approximately 24% of their procurement budget to technology by 2026. The
              procurement operating budget itself is expected to decrease slightly (−0.4%) from 2025 to 2026 despite an
              8% increase in workload, creating a structural efficiency gap that AI-led platforms like Zip position as
              their core value proposition. Average annual procurement software cost for Zip deployments runs $72,000 to
              $82,000 per year for mid- market customers, while Coupa starts at approximately $30,000 per year and
              escalates with module additions.
