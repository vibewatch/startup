      - number: '7.3'
        title: Partner, platform, and customer-concentration risk
        blocks:
          - type: paragraph
            body: >-
              Zip's product value is deliberately built on dependency. The AI page says its agents draw context from 60+
              integrations, and Brex describes Zip as the front door to existing financial systems rather than a system
              of record that replaces them. The NetSuite integration is especially telling: daily syncs of vendor,
              account, item, GL, tax, and custom-field data make ERP connectivity mission critical. G2's archived
              materials also frame integration into ticketing, CLM, GRC, and ERP/P2P systems as a core product
              capability. This is a growth asset, but it means partner or connector failure can propagate into workflow
              stoppage, customer dissatisfaction, and slower deployment.

              The customer side has a similar shape. Public materials clearly establish marquee accounts—OpenAI,
              Anthropic, T-Mobile, Mars, Dollar Tree, Northwestern Mutual, Checkr, and others—and company sources cite
              more than $500 billion of spend processed and billions in savings. Procurement Magazine adds scale
              evidence around suppliers and approvals. What public evidence does not show is contract-value mix, top-10
              customer share, or any hard revenue concentration schedule. That leaves customer-concentration risk only
              partially knowable. The ecosystem is also evolving: the newsroom highlights Brex partnering with former
              competitor Zip, which is strategically positive but confirms that some of Zip's distribution, data
              quality, and customer-value narrative depend on adjacent platforms whose incentives can change. The
              underwriting takeaway is that Zip's moat is partly ecosystem depth—but ecosystem depth is also a
              concentrated source of transmission risk.
