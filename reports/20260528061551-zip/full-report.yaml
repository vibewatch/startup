  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Zip enters valuation work with one unusually strong fact pattern and one unusually important omission. The
              strong fact pattern is that the October 2024 Series D is corroborated across Zip's own announcement,
              Business Wire, outside counsel, and Crunchbase reporting: $190 million of new money, a $2.2 billion
              valuation, and a syndicate led by BOND with DST Global, Adams Street, Alkeon, Y Combinator, and CRV. By
              January 2026, Zip was still publicly using that valuation reference while also claiming more than $6
              billion of customer savings, hundreds of billions of spend processed, 7 million suppliers, and a Gartner
              Magic Quadrant debut as the only agentic procurement orchestration platform on the list. Those are not the
              signals of a fragile seed-stage narrative. The omission is the underwriting denominator. Public evidence
              still does not disclose Zip's current revenue, ARR, gross margin, NRR, burn, or round terms. That matters
              because a $2.2 billion mark requires roughly $244 million of revenue at 9x, $314 million at 7x, and $440
              million at 5x. Without a verified denominator, the investor is effectively paying for premium assumptions
              rather than for demonstrated public-market support. Entry discipline should therefore start with a revenue
              bridge, gross-margin proof, and preference-stack review before treating the headline post-money as a fair
              common-equity price.
