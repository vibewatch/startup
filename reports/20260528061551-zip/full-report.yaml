      - number: '1.2'
        title: Founders, Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Zip was co-founded in 2020 by three individuals who shared first-hand experience with dysfunctional
              enterprise procurement at Airbnb. Rujul Zaparde (Co-Founder and CEO) is a serial entrepreneur who
              previously dropped out of Harvard to found FlightCar (YC W2013), a peer-to-peer car rental marketplace he
              led to 17 locations and an acquisition by Mercedes-Benz. Before Zip, Zaparde served as a Visiting Partner
              at Y Combinator. Lu Cheng (Co-Founder and CTO) spent six years at Airbnb where he most recently served as
              Head of Engineering for Airbnb Experiences. Felix Meng (Co-Founder) leads go-to-market efforts at Zip.
              Their shared Airbnb background gave the founding team direct exposure to the frustrations of complex
              enterprise procurement systems, providing compelling founder-market fit.


              Beyond the three founders, Zip's leadership team includes product leaders recruited from Apple, Airbnb,
              and Meta, as well as operations executives with procurement backgrounds at United Health, Sanofi, MGM
              Resorts, Discover, and NASA. No material leadership departures from the core executive team have been
              identified in publicly available sources as of the report date. The company's board includes
              representatives from key investors, notably Jay Simons (General Partner at BOND, former President of
              Atlassian) who joined following the Series D round. Governance details, including exact board composition
              and any independent directors, are not publicly disclosed.


              Key-person dependence on Zaparde as the visible CEO and primary external spokesperson is a recognized risk
              at this stage of company development. Lu Cheng's role as engineering lead is similarly critical for
              product direction. The company has shown institutional consistency, with all three co-founders remaining
              actively involved through the Series D and fifth anniversary milestones.
