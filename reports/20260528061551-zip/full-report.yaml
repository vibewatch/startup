chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Zip (legal entity operating as Zip HQ, Inc.) is an AI-powered procurement orchestration platform
              headquartered in San Francisco, California. The company was incorporated in 2020 and operates at the
              intersection of enterprise software, AI automation, and spend management. Its core product provides a
              "single front door" for any employee to initiate a purchase request, routing it through configurable
              approval workflows across Finance, Legal, IT, Security, and Procurement teams, then managing the full
              lifecycle through purchase orders, invoice processing, and global payments.


              Zip identifies its business model as a SaaS platform sold primarily on subscription terms to mid-market
              and enterprise customers. The platform integrates with ERPs (SAP, Oracle, NetSuite), CLM systems, GRC
              tools, and other enterprise software via 60+ pre-built connectors. Zip supports vendor payments in 140+
              countries and 40+ currencies, giving it global payment infrastructure. The company has expanded its
              product surface across intake management, sourcing, supplier management, PO management, invoice
              processing, AI contract orchestration, and a growing suite of 50+ autonomous AI agents for procurement
              workflows.


              Zip characterizes itself as the category creator for "intake and procurement orchestration" and more
              recently for "agentic procurement orchestration." In 2026, the company claims to be the only procurement
              orchestration platform in the Gartner Magic Quadrant for Source-to-Pay Suites. Enterprise customers span
              financial services (Northwestern Mutual, Discover, Prudential), technology (OpenAI, Snowflake, Anthropic,
              Canva), retail (Dollar Tree, Sephora, Sprouts), and other sectors. The company has expanded
              internationally, with offices in San Francisco, New York, London, and Toronto.
