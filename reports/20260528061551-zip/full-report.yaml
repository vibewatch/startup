      - number: '2.5'
        title: Evidence Gaps and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Several key sizing and adoption questions cannot be resolved from public evidence alone. The most material
              gap is the absence of a clean serviceable addressable market (SAM) or serviceable obtainable market (SOM)
              for the intake-orchestration-first sub-segment that Zip pioneered. All five analyst TAM estimates cover
              the full procurement software market; no analyst has published an isolated dollar estimate for the
              intake-and-orchestration layer. Gartner's 2026 decision to include Zip in the S2P MQ for the first time
              confirms that the I&O category is being absorbed into the broader market definition, which complicates
              bottom-up SOM estimation further.

              A second gap is the lack of any analyst estimate for the share of enterprise procurement budget managed by
              mid-market versus Fortune 500 buyers, which would be required to size Zip's true TAM more precisely. The
              third gap is the absence of independent verification of the claimed dollar value of spend processed by Zip
              ($500B+) and savings delivered ($6.8B), which are company-reported and not independently audited. Finally,
              CAGR divergence between analysts (8.05% to 13.6%) represents a genuine methodological conflict that cannot
              be resolved without primary survey data, limiting the reliability of long-range revenue projections
              anchored to any single estimate.

              Diligence asks include: (1) request Gartner's full 2026 S2P MQ report (ID G00833291) to understand how
              they sized the I&O sub-market; (2) obtain independent analyst estimates specifically for the intake
              orchestration market; (3) verify Zip's spend-processed and savings figures through customer channel
              checks; (4) assess procurement IT adoption rates in target verticals (tech, healthcare, financial
              services) through primary buyer interviews.
            claimRefs:
              - CM040
              - CM041
              - CM042
              - CM043
              - CM045
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: SOM Estimation Gap — No Analyst Has Isolated the Intake-Orchestration Sub-Segment
            body: >-
              All five published TAM estimates cover the full procurement software market. No analyst has published an
              isolated dollar estimate for the intake-and-orchestration (I&O) sub-segment where Zip first competed.
              Gartner's 2026 decision to include Zip in the S2P Magic Quadrant signals that I&O is being absorbed into
              the broader S2P category, which may increase perceived TAM but also intensifies competition with
              established suite vendors. Investors relying on single-source TAM estimates (e.g., "$9.5–$10B procurement
              software market") will need to apply custom top-down decompositions to derive Zip's addressable
              sub-market.
            calloutType: risk
            claimRefs:
              - CM043
          - type: callout
            title: Conflicting CAGR Estimates Limit Long-Range Revenue Projections
            body: >-
              The 390-basis-point divergence between Business Research Company's 13.6% and Mordor Intelligence's 9.76%
              CAGR for the same procurement software market means that a 10-year forward revenue model anchored to
              either endpoint will produce materially different valuations. Diligence should verify the methodology
              underlying whichever estimate a financial model uses and avoid treating any single analyst's CAGR as
              consensus.
            calloutType: insight
            claimRefs:
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape Classes and Competitive Set
        blocks:
          - type: paragraph
            body: >-
              Zip is not competing in a single homogeneous procurement-software market. Buyers can solve the same
              control problem through at least five classes of alternatives: full-suite source-to-pay incumbents such as
              Coupa, SAP Ariba, Ivalua, and Oracle; orchestration-first challengers such as Zip and Tonkean; lighter
              mid-market procure-to-pay tools such as Procurify; finance-led spend stacks such as Ramp, Airbase, and
              Brex; and status-quo substitutes that include ServiceNow workflows, ERP-native modules, spreadsheets,
              email, and internal ticketing. This classification matters because the purchase decision is often less
              about “best procurement software” and more about whether the buyer wants a new front door, a full suite, a
              finance-led spend stack, or no new platform at all.

              Public evidence shows that incumbents still control the largest installed bases and the most mature
              analyst positioning. 6sense places Ariba Procurement Solutions, Coupa Procurement, and ServiceNow
              Procurement ahead of Zip by observed domain footprint, while procurement trade press still treats SAP
              Ariba as a share leader and Coupa, SAP, Ivalua, and Oracle as the center of the suite market. Against that
              backdrop, Zip's rise is meaningful because it validates orchestration as a category wedge: the company is
              now framed as a 2026 Visionary and the only agentic procurement orchestration platform on the quadrant,
              but it is still a much younger entrant than the suites it often sits beside.

              The most important substitute is still the status quo. Tonkean's survey data and TechCrunch's reporting
              both describe a world where procurement still spans too many systems, too many handoffs, and too much
              manual work. That fragmentation creates the opening for Zip's front- door thesis, but it also means buyers
              can postpone a formal platform decision by stitching together ServiceNow, ERP modules, shared inboxes,
              spreadsheets, and approval tools for longer than a startup bull case usually assumes.
