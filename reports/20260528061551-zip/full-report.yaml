          it
        - >-
          The view improves if Zip owns approval, sourcing, supplier, and payment workflows deeply enough to become the
          system of record
      - - 'THESIS: The current mark could be fair if Zip is already above the $300M revenue threshold'
        - >-
          A $2.2B valuation screens much more reasonably if current revenue is above roughly $300M with strong margins
          and NRR
