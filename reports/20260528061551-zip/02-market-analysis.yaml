  - id: section-gaps-diligence
    title: Evidence Gaps and Diligence Asks
    body: >-
      Several key sizing and adoption questions cannot be resolved from public evidence alone.
      The most material gap is the absence of a clean serviceable addressable market (SAM) or
      serviceable obtainable market (SOM) for the intake-orchestration-first sub-segment that
      Zip pioneered. All five analyst TAM estimates cover the full procurement software market;
      no analyst has published an isolated dollar estimate for the intake-and-orchestration layer.
      Gartner's 2026 decision to include Zip in the S2P MQ for the first time confirms that the
      I&O category is being absorbed into the broader market definition, which complicates bottom-up
      SOM estimation further.

      A second gap is the lack of any analyst estimate for the share of enterprise procurement budget
      managed by mid-market versus Fortune 500 buyers, which would be required to size Zip's true
      TAM more precisely. The third gap is the absence of independent verification of the claimed
      dollar value of spend processed by Zip ($500B+) and savings delivered ($6.8B), which are
      company-reported and not independently audited. Finally, CAGR divergence between analysts
      (8.05% to 13.6%) represents a genuine methodological conflict that cannot be resolved without
      primary survey data, limiting the reliability of long-range revenue projections anchored to
      any single estimate.

      Diligence asks include: (1) request Gartner's full 2026 S2P MQ report (ID G00833291) to
      understand how they sized the I&O sub-market; (2) obtain independent analyst estimates
      specifically for the intake orchestration market; (3) verify Zip's spend-processed and savings
      figures through customer channel checks; (4) assess procurement IT adoption rates in target
      verticals (tech, healthcare, financial services) through primary buyer interviews.
    claimRefs:
      - CM040
      - CM041
      - CM042
      - CM043
      - CM045

