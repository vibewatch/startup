callouts:
  - calloutType: risk
    title: SOM Estimation Gap — No Analyst Has Isolated the Intake-Orchestration Sub-Segment
    body: >-
      All five published TAM estimates cover the full procurement software market. No analyst has
      published an isolated dollar estimate for the intake-and-orchestration (I&O) sub-segment
      where Zip first competed. Gartner's 2026 decision to include Zip in the S2P Magic Quadrant
      signals that I&O is being absorbed into the broader S2P category, which may increase perceived
      TAM but also intensifies competition with established suite vendors. Investors relying on
      single-source TAM estimates (e.g., "$9.5–$10B procurement software market") will need to
      apply custom top-down decompositions to derive Zip's addressable sub-market.
    claimRefs:
      - CM043

  - calloutType: insight
    title: Conflicting CAGR Estimates Limit Long-Range Revenue Projections
    body: >-
      The 390-basis-point divergence between Business Research Company's 13.6% and Mordor
      Intelligence's 9.76% CAGR for the same procurement software market means that a 10-year
      forward revenue model anchored to either endpoint will produce materially different valuations.
      Diligence should verify the methodology underlying whichever estimate a financial model uses
      and avoid treating any single analyst's CAGR as consensus.
    claimRefs:
      - CM011

