  - id: section-growth-drivers
    title: Growth Drivers and Adoption Constraints
    body: >-
      The primary growth drivers are AI adoption, cloud modernization, and spend-visibility mandates.
      Mordor Intelligence's driver model assigns AI-for-tail-spend-automation the highest CAGR impact
      (+6.1%), followed by cost-takeout and spend-visibility mandates (+5.2%) and cloud-native S2P
      modernization (+4.5%). These drivers are reinforcing: cost pressure triggers demand for visibility,
      which requires cloud-native data architectures, which in turn enable AI agents to operate across
      the procurement lifecycle. Seventy-five percent of large enterprises are projected to use AI-
      driven procurement solutions by 2026, and over 80% of companies are expected to have digitalized
      procurement processes by 2026.

      Cloud adoption is the structural enabler: cloud deployment held 67.92% of procurement software
      market share in 2025 at a 9.81% CAGR through 2031, largely because SaaS models convert large
      capital expenditures into operational costs and enable rapid deployment without on-premises
      infrastructure. Healthcare is the fastest-growing end-user segment (9.79% CAGR per Mordor) due
      to HIPAA-driven audit logging requirements for supplier contracts containing protected health
      information. EU AI Act compliance mandates for algorithmic transparency in automated procurement
      decisions are creating replacement demand among European public sector buyers.

      Adoption constraints are structural and underappreciated by bull-case TAM projections. Legacy ERP
      lock-in is the largest single barrier: decades of customized on-premises SAP, Oracle, or Infor
      workflows create switching costs that delay migration even where ROI is demonstrable, and roughly
      60% of SAP ERP customers were still running legacy ECC6 platforms as of 2025-2026. GDPR
      cross-border data friction constrains cloud-hosted supplier databases when sub-processors operate
      outside the European Economic Area. Eighty-six percent of UK organizations reported considerable
      obstacles building digital procurement skills, with talent shortages leading the list. Vendor
      fragmentation creates interoperability issues when integrating multiple point solutions, further
      slowing deployment timelines.

      P2P automation alone reduces processing costs by up to 60% for adopters, and procurement teams
      deploying AI report 40 to 60% cycle-time reductions within 90 days, but these ROI projections
      depend heavily on employee adoption—a constraint that requires change management investment that
      procurement technology vendors rarely price into their sales cycles.
