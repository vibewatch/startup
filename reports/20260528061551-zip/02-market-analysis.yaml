  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing-gaps
      missingEvidence: >-
        No analyst firm has published an isolated dollar size or CAGR estimate for the
        intake-orchestration sub-segment of procurement software. Gartner Report ID G00833291
        (the full 2026 S2P MQ report) would be the highest-quality source but is paywalled.
      whyItMatters: >-
        Without a sub-segment estimate, investors and analysts must derive Zip's SAM from
        top-down decompositions with significant uncertainty, making SOM estimation highly
        approximate.
      diligencePath: >-
        Request or purchase Gartner's full 2026 Magic Quadrant for Source-to-Pay Suites
        (report ID G00833291); commission a custom analyst inquiry through Gartner
        specifically asking for the intake-and-orchestration sub-segment market size.
      relatedQuestionRefs:
        - QM004
        - QM023

    - type: missing-source
      severity: material
      topic: spend-under-management
      missingEvidence: >-
        No public study provides the share of enterprise indirect spend currently under
        management by procurement platforms versus flowing through unmanaged channels. Ardent
        Partners' CPO Rising research covers procurement maturity but is subscription-gated.
      whyItMatters: >-
        The ratio of managed-to-unmanaged indirect spend is a key input for estimating
        the conversion opportunity that procurement platforms like Zip can address. Without
        it, the serviceable market cannot be sized with confidence.
      diligencePath: >-
        Obtain Ardent Partners' CPO Rising annual report; commission primary buyer interviews
        across 20–30 mid-market procurement leaders to establish a spend-under-management
        baseline.
      relatedQuestionRefs:
        - QM025

    - type: conflicting-data
      severity: minor
      topic: market-sizing-divergence
      missingEvidence: >-
        The 390-basis-point spread between IMARC's 8.05% CAGR and Business Research Company's
        13.6% CAGR for the same procurement software market cannot be reconciled without access
        to both firms' primary survey methodologies and segment definitions.
      whyItMatters: >-
        Financial models anchored to either extreme will produce materially different long-range
        valuation outputs, particularly for a category expected to grow substantially with AI
        adoption.
      diligencePath: >-
        Request methodology documentation from both IMARC and Business Research Company;
        cross-validate against IDC and Forrester procurement software sizing (both subscription
        gated); build a scenario range using 9%–12% CAGR as a defensible central estimate.
      relatedQuestionRefs:
        - QM011

    - type: private-evidence-only
      severity: material
      topic: customer-outcomes
      missingEvidence: >-
        Zip's reported metrics—$6.8 billion in customer savings, $500 billion in spend
        processed, 7 million suppliers managed—are company-reported and have not been
        independently audited or verified by a third party.
      whyItMatters: >-
        These figures anchor much of the market-validation narrative and are cited by
        analysts and media without independent corroboration. If savings methodology
        differs from industry standards, the numbers may overstate Zip's actual impact.
      diligencePath: >-
        Request customer-level savings attestations from three to five named Zip customers
        through primary channel checks; ask Zip for its savings calculation methodology
        and compare against peer benchmarks from Ardent Partners or The Hackett Group.

