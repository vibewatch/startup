    severity: material
    topic: financials-private
    missingEvidence: >-
      ARR, revenue run-rate, gross margin, net revenue retention (NRR), and burn rate are all withheld as
      private-company information. No debt or credit facility disclosures exist.
    whyItMatters: >-
      Without revenue metrics, it is impossible to assess Zip's growth efficiency, unit economics, or whether the $2.2B
      valuation represents a fair revenue multiple. NRR is a critical SaaS health indicator.
    diligencePath: >-
      Request revenue, ARR, gross margin, NRR, and cash runway via management diligence call or data room access.
      Cross-check with reference customers for contract-value benchmarks.
