  - type: conflicting-data
    severity: minor
    topic: market-sizing-divergence
    missingEvidence: >-
      The 390-basis-point spread between IMARC's 8.05% CAGR and Business Research Company's 13.6% CAGR for the same
      procurement software market cannot be reconciled without access to both firms' primary survey methodologies and
      segment definitions.
    whyItMatters: >-
      Financial models anchored to either extreme will produce materially different long-range valuation outputs,
      particularly for a category expected to grow substantially with AI adoption.
    diligencePath: >-
      Request methodology documentation from both IMARC and Business Research Company; cross-validate against IDC and
      Forrester procurement software sizing (both subscription gated); build a scenario range using 9%–12% CAGR as a
      defensible central estimate.
