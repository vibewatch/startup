    topic: spend-under-management
    missingEvidence: >-
      No public study provides the share of enterprise indirect spend currently under management by procurement
      platforms versus flowing through unmanaged channels. Ardent Partners' CPO Rising research covers procurement
      maturity but is subscription-gated.
    whyItMatters: >-
      The ratio of managed-to-unmanaged indirect spend is a key input for estimating the conversion opportunity that
      procurement platforms like Zip can address. Without it, the serviceable market cannot be sized with confidence.
    diligencePath: >-
      Obtain Ardent Partners' CPO Rising annual report; commission primary buyer interviews across 20–30 mid-market
      procurement leaders to establish a spend-under-management baseline.
