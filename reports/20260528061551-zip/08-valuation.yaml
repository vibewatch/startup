    - type: private-evidence-only
      severity: blocking
      topic: current-revenue
      missingEvidence: Current revenue, ARR, and a bridge from FY2024 through the latest quarter.
      whyItMatters: The public mark cannot be screened against any valuation band without a verified denominator.
      diligencePath: Request a CFO pack and board deck showing quarterly revenue, ARR, and year-to-date run rate.
      relatedQuestionRefs: [QV005]
