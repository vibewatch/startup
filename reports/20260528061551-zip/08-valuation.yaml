schemaVersion: report-v2
artifact: valuation
slug: zip
runDate: '2026-05-28'
company:
  name: Zip
chapter:
  number: 8
  title: Valuation
  summary: >-
    Zip's October 2024 $190 million Series D at a $2.2 billion valuation is well corroborated,
    and the company's January 2026 Gartner Magic Quadrant debut plus large-scale spend and
    supplier metrics show that it is a real category player rather than a concept stock. The
    underwriting problem is price, not existence: public evidence still does not disclose current
    revenue, gross margin, retention, burn, or preference terms, while 2026 software valuation
    data shows compressed multiples and selective liquidity. The evidence therefore supports a
    TRACK recommendation with medium confidence, high risk, and a stretched valuation stance
    unless private diligence proves revenue scale, margin quality, and clean downside-protection
    terms.
sections:
  - id: financing-context-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      Zip enters valuation work with one unusually strong fact pattern and one unusually important
      omission. The strong fact pattern is that the October 2024 Series D is corroborated across
      Zip's own announcement, Business Wire, outside counsel, and Crunchbase reporting: $190
      million of new money, a $2.2 billion valuation, and a syndicate led by BOND with DST Global,
      Adams Street, Alkeon, Y Combinator, and CRV. By January 2026, Zip was still publicly using
      that valuation reference while also claiming more than $6 billion of customer savings,
      hundreds of billions of spend processed, 7 million suppliers, and a Gartner Magic Quadrant
      debut as the only agentic procurement orchestration platform on the list. Those are not the
      signals of a fragile seed-stage narrative. The omission is the underwriting denominator.
      Public evidence still does not disclose Zip's current revenue, ARR, gross margin, NRR, burn,
      or round terms. That matters because a $2.2 billion mark requires roughly $244 million of
      revenue at 9x, $314 million at 7x, and $440 million at 5x. Without a verified denominator,
      the investor is effectively paying for premium assumptions rather than for demonstrated
      public-market support. Entry discipline should therefore start with a revenue bridge,
      gross-margin proof, and preference-stack review before treating the headline post-money as a
      fair common-equity price.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV008, CV009, CV010, CV031, CV032, CV034, CV035, CV036, CV037]
    tableRefs: [TV001]
    figureRefs: [FV002]
  - id: thesis-antithesis-and-comparable-set
    title: Thesis, anti-thesis, and comparable set
    body: >-
      The positive case for Zip is evidence-backed. Gartner now places the company beside SAP,
      Coupa, and Oracle in source-to-pay, while PwC's workflow-gravity framework helps explain why
      procurement orchestration could retain pricing power if it truly becomes the system of record
      for financial and compliance workflows rather than a thin user-interface layer. Zip's public
      customer list, large supplier graph, and rapid AI product cadence support that possibility.
      The anti-thesis is equally real. Procurement software is not exempt from the 2026 software
      reset: Foley, BMO, MCF, and Windsor Drake all point to tighter valuation bands, higher unit-
      economics scrutiny, and a sharper distinction between defensible platforms and ordinary
      workflow SaaS. Public comps underline the point. Workday screens at roughly 3.2x revenue,
      SAP at about 4.7x, ServiceNow at about 7.5x, and Oracle at about 8.6x on current market-cap-
      to-revenue screens. Historical Coupa context is helpful but not decisive: the $8 billion
      take-private and Coupa's current 3,100-customer scale show what a mature procurement leader
      can look like, but they do not remove the fact that Zip's own revenue conversion and margin
      quality remain private. The comparable set therefore supports a blended range, not a clean
      premium verdict.
    claimRefs: [CV008, CV009, CV011, CV012, CV017, CV018, CV019, CV021, CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030, CV038, CV039, CV040, CV041, CV042, CV043, CV044, CV057]
    tableRefs: [TV002, TV004]
    figureRefs: [FV004]
  - id: scenario-range-and-exit-path
    title: Scenario range and exit path
    body: >-
      Because Zip's current revenue and margins are undisclosed, the scenario work has to be
      explicit about what is assumption and what is evidence. Evidence gives us the round price,
      the compressed 2026 public-multiple backdrop, and a procurement benchmark from Coupa; it does
      not give us a clean current revenue line. The bear case assumes Zip is a strong product with
      real customer adoption but still below the revenue threshold needed for a premium private mark,
      yielding $450 million to $720 million at 3x to 4x revenue on a $150 million to $180 million
      base. The base case assumes $220 million to $260 million of revenue and mid-single-digit to
      high-single-digit multiples, landing at roughly $1.1 billion to $1.82 billion. The bull case
      assumes Zip has already crossed the $300 million revenue line with durable margins, retention,
      and AI-driven expansion, supporting roughly $2.1 billion to $3.24 billion. That distribution
      matters more than the headline valuation because it shows the present mark is not obviously
      impossible, but it is also not yet supported by public proof. Exit logic is similarly
      constrained. BMO and Foley point to selective IPO conditions and a still-stronger M&A or
      secondaries market, which makes strategic or sponsor-led liquidity more supportable than a
      near-term IPO underwriting case.
    claimRefs: [CV013, CV014, CV015, CV016, CV020, CV031, CV032, CV033, CV045, CV046, CV047, CV048, CV053]
    tableRefs: [TV003]
    figureRefs: [FV003]
  - id: recommendation-kill-triggers-and-diligence
    title: Recommendation, kill triggers, and final diligence asks
    body: >-
      The evidence supports a TRACK recommendation with medium confidence, high risk, and a
      stretched valuation stance. That call is intentionally price-sensitive. Public evidence is
      good enough to avoid an automatic pass: Zip has real category standing, meaningful customer
      proof, and enough operating scale to justify serious diligence. It is not good enough to
      justify a buy recommendation at the $2.2 billion reference mark. The gap is not story quality;
      it is economic disclosure. The public record still cannot tell an investor whether Zip is a
      $150 million revenue business that would look expensive against public software screens, or a
      $300 million-plus business that might deserve a premium for procurement workflow gravity and
      AI expansion. It also does not answer whether the latest round was clean common-equity
      economics or a more structured late-stage deal with downside protection that overstates common
      value. Those are not side issues. They determine whether the current price is full, fragile,
      or genuinely attractive. The practical implication is simple: proceed only on a diligence path
      that can prove revenue scale, margin durability, retention quality, and clean terms. If those
      files are strong, Zip can move up the recommendation stack. If they are weak, the thesis
      should be broken quickly rather than rationalized.
    claimRefs: [CV032, CV034, CV035, CV036, CV043, CV044, CV049, CV050, CV051, CV052, CV053, CV054, CV055, CV056]
    tableRefs: [TV005, TV006]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence basis
    rows:
      - - Recommendation
        - TRACK — continue diligence, but do not underwrite the current mark as a buy on public evidence
        - Round, category standing, and scale are real; the missing denominator and term-sheet details are not
      - - Confidence
        - Medium
        - Funding facts and comp data are corroborated, but the key valuation inputs remain private
      - - Risk rating
        - High
        - The current price depends on undisclosed revenue quality, retention, margins, and structured-term risk
      - - Valuation stance
        - Stretched
        - A $2.2 billion mark needs roughly $244M to $440M of revenue across 9x to 5x public-style multiple screens
      - - Decision implication
        - Require revenue bridge, margin waterfall, and cap-table terms before advancing
        - Without those files the common-equity downside range is too wide for a conviction buy call
    notes: >-
      This is a price-sensitive recommendation table, not a company-quality scorecard; the decisive
      missing inputs are current revenue, margin, retention, and term-sheet economics.
    claimRefs: [CV001, CV002, CV031, CV032, CV034, CV035, CV049, CV050, CV051, CV052]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - 'THESIS: Zip has crossed the threshold from category story to category contender'
        - Gartner now places Zip beside SAP, Coupa, and Oracle, while public sources corroborate meaningful spend and supplier scale
        - The view improves if private diligence confirms those scale signals convert into high-quality recurring revenue and durable retention
      - - 'THESIS: Procurement orchestration may have workflow gravity that resists AI commoditization'
        - PwC argues systems tied to financial or regulatory outcomes can gain value from AI rather than be replaced by it
        - The view improves if Zip owns approval, sourcing, supplier, and payment workflows deeply enough to become the system of record
      - - 'THESIS: The current mark could be fair if Zip is already above the $300M revenue threshold'
        - A $2.2B valuation screens much more reasonably if current revenue is above roughly $300M with strong margins and NRR
        - The view upgrades only when management provides audited or board-approved revenue and margin data
      - - 'ANTI-THESIS: 2026 software multiples remain compressed and selective'
        - Foley, BMO, MCF, and Windsor Drake all show lower bands, higher scrutiny, and a tougher premium test for workflow SaaS
        - The concern eases only if Zip shows economics and defensibility good enough to deserve upper-half software multiples
      - - 'ANTI-THESIS: Scale metrics do not equal revenue quality'
        - Spend processed, suppliers, features shipped, and AI-agent launches are useful proof points but not substitutes for ARR, gross margin, or churn data
        - The concern eases if Zip can map those operating metrics cleanly into monetization and retention
      - - 'ANTI-THESIS: Late-stage private terms can distort the headline post-money'
        - 2026 market commentary highlights downside protection and secondary-driven liquidity as common features of late-stage software financings
        - The concern clears only when counsel and finance disclose the preference stack, side letters, and any secondary pricing history
    notes: >-
      The table separates what is strong about Zip the company from what is still unresolved about
      Zip the investment at the current price.
    claimRefs: [CV009, CV017, CV018, CV019, CV032, CV033, CV038, CV039, CV040, CV041, CV042, CV043, CV044]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Revenue assumption
      - Multiple logic
      - Indicative value range
      - Probability signal
      - Main trigger
    rows:
      - - Bear
        - $150M-$180M revenue base
        - 3x-4x revenue, consistent with lower-end public workflow SaaS under compression
        - $450M-$720M
        - '~25%: plausible if spend scale does not translate into premium monetization'
        - Revenue remains below premium thresholds or structured terms erode common-equity value
      - - Base
        - $220M-$260M revenue base
        - 5x-7x revenue, roughly the middle of large-software comp screens
        - $1.10B-$1.82B
        - '~50%: most consistent with real scale plus incomplete proof of premium economics'
        - Business proves substantial but still not premium enough to justify the full current mark
      - - Bull
        - $300M-$360M revenue base
        - 7x-9x revenue, requiring durable growth, strong margins, and retention
        - $2.10B-$3.24B
        - '~25%: requires upper-half software quality and category-premium belief'
        - AI expansion, retention, and monetization are strong enough to defend a premium multiple
    notes: >-
      These scenarios are intentionally explicit about assumption risk because public evidence does
      not disclose Zip's current revenue, margin profile, or retention quality.
    claimRefs: [CV031, CV032, CV033, CV045, CV046, CV047, CV048]
  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant public enterprise software proxies plus historical and current
        Coupa procurement references available from retained public sources. Direct private
        procurement-orchestration comparables remain under-disclosed, so the set is intentionally
        blended rather than exhaustive.
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Zip
        - $2.2B 2024 valuation with current revenue undisclosed
        - Multiple cannot be verified publicly
        - Direct underwrite object and latest financing reference point
        - Missing revenue, gross margin, NRR, and preference-stack data
      - - Workday
        - $30.74B market cap and $9.55B revenue
        - ~3.2x revenue
        - Useful lower-multiple public workflow benchmark for a mature, audited enterprise platform
        - Much more mature and diversified than Zip
      - - SAP
        - $205.29B market cap and $43.72B revenue
        - ~4.7x revenue
        - Relevant because SAP is a legacy procurement suite incumbent and audited public filer
        - Massive scale and different product breadth flatten direct comparability
      - - ServiceNow
        - $105.31B market cap and $13.96B revenue
        - ~7.5x revenue
        - Helpful upper-mid public benchmark for workflow software with strong platform economics
        - Broader platform, higher maturity, and different product mix than procurement software
      - - Oracle
        - $549.20B market cap and $64.07B revenue
        - ~8.6x revenue
        - Shows the upper bound public market will pay for scaled enterprise platforms with deep embedded workflows
        - Driven by broader database, cloud, and ERP exposure rather than pure procurement
      - - Coupa
        - Historical $8B take-private plus >$1B FY2024 billings and ~3,100 customers by Q2 FY26
        - Historical procurement benchmark, not a clean current public multiple
        - Most relevant procurement software reference for maturity, customer breadth, and spend-management scope
        - Post-take-private context and different product breadth make translation to Zip imperfect
    notes: >-
      The set mixes public software platforms with procurement-specific Coupa context because direct
      private procurement-orchestration marks rarely come with enough current financial disclosure to
      support a like-for-like screen.
    claimRefs: [CV021, CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV030, CV057]
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Current revenue disappoints
        - Verified current revenue is below roughly $200M
        - The round price would sit above even generous public-comp support without extraordinary economics
        - Treat the 2024 mark as impaired and re-underwrite from a lower base-case value range
      - - Margin quality is weak
        - Gross margin is structurally below ~60% or services mix dominates software economics
        - Zip would look less like premium workflow software and more like lower-multiple implementation-heavy SaaS
        - Downgrade the multiple band and recommendation immediately
      - - Retention does not clear premium thresholds
        - NRR is below ~110% and churn or contraction is elevated
        - AI and orchestration expansion would not be strong enough to justify upper-half software multiples
        - Keep the name on track status or step away at the current price
      - - Terms are heavily structured
        - Participation rights, stacked liquidation preferences, or hidden secondary discounts materially reduce common-equity value
        - Headline post-money would overstate true entry economics
        - Recut price from common-equity proceeds, not from the headline round valuation
      - - Exit market remains narrow
        - No credible strategic or sponsor route emerges and IPO readiness is still years away
        - Holding-period risk rises while late-stage liquidity remains selective
        - Require a wider entry discount or suspend investment work
    notes: >-
      These triggers combine public-market reference points with private-diligence thresholds because
      the key thesis risks are economic quality, term-sheet structure, and exit timing.
    claimRefs: [CV013, CV014, CV031, CV043, CV044, CV053, CV054, CV055]
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current revenue and ARR
        - Monthly and annualized revenue bridge from FY2024 through the latest quarter
        - Without a denominator the current mark cannot be compared cleanly against public software screens
        - CFO package plus board deck
      - - Gross margin and services mix
        - Gross-margin waterfall by product line and implementation mix
        - Premium software multiples require software-like unit economics, not just workflow adoption
        - FP&A and product finance
      - - Retention quality
        - NRR, GRR, logo churn, and expansion by cohort
        - Premium AI and workflow multiples depend heavily on durable land-and-expand behavior
        - Revenue operations and finance analytics
      - - Cap table and round terms
        - Share classes, liquidation preferences, participation rights, pro-rata rights, and any side letters
        - Headline post-money can misprice common equity if downside protection is unusually strong
        - Company counsel and financing documents
      - - Customer concentration and deployment depth
        - Top-customer ARR, renewal timing, module adoption, and deployment depth
        - Spend processed and supplier counts are less useful if monetization is concentrated or shallow
        - CRO package and customer-success reporting
      - - Exit readiness
        - Strategic-buyer map, sponsor interest, audited controls readiness, and IPO-readiness roadmap
        - The most likely liquidity route is strategic or sponsor-led, so exit preparation changes value today
        - CEO, board materials, and banker references
    notes: >-
      Every diligence ask is tied to a variable that could move the recommendation, the acceptable
      entry price, or both.
    claimRefs: [CV034, CV035, CV036, CV042, CV043, CV049, CV052, CV053, CV056]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: How corroborated category proof, missing economics, public comp bands, and selective liquidity combine into a TRACK recommendation.
    data:
      nodes:
        - id: proof
          label: 'Proof: real financing, Gartner MQ entry, scaled spend and supplier footprint'
          type: input
        - id: moat
          label: 'Potential moat: procurement workflow gravity plus AI orchestration'
          type: input
        - id: opacity
          label: 'Opacity: revenue, margin, retention, and cap-table terms are still private'
          type: input
        - id: comps
          label: 'Comp band: large software screens cluster around ~3x to ~9x revenue'
          type: process
        - id: exits
          label: 'Liquidity: M&A and secondaries stronger than near-term IPO'
          type: input
        - id: valuation
          label: 'Current mark needs premium economics to be fair'
          type: process
        - id: recommendation
          label: TRACK, medium confidence, high risk, stretched valuation stance
          type: output
        - id: upgrade
          label: 'Upgrade only if diligence proves >$300M revenue, strong margins/NRR, and clean terms'
          type: output
      edges:
        - from: proof
          to: valuation
        - from: moat
          to: valuation
        - from: opacity
          to: valuation
        - from: comps
          to: valuation
        - from: exits
          to: recommendation
        - from: valuation
          to: recommendation
        - from: recommendation
          to: upgrade
    approximationNotes: >-
      The flow expresses underwriting logic rather than a deterministic financial model; it shows the
      specific conditions that would move the call at the current price.
    claimRefs: [CV032, CV039, CV042, CV043, CV049, CV050, CV051, CV052, CV054]
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Revenue required for Zip's $2.2 billion mark to fit selected revenue-multiple screens.
    data:
      items:
        - label: 3x revenue
          value: 733.3
          note: Lower-end workflow SaaS screen in a compressed market
        - label: 5x revenue
          value: 440.0
          note: Mid-market software support threshold
        - label: 7x revenue
          value: 314.3
          note: Stronger enterprise-software premium screen
        - label: 9x revenue
          value: 244.4
          note: Upper-half public workflow platform screen
        - label: 11x revenue
          value: 200.0
          note: Historical premium threshold closer to exceptional software assets
    approximationNotes: >-
      This figure deliberately reverses the valuation math because public evidence discloses the
      price but not the revenue denominator.
    claimRefs: [CV025, CV031, CV032, CV033]
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Bear, base, and bull valuation ranges built from explicit revenue and multiple assumptions.
    data:
      items:
        - label: Bear case
          low: 450
          mid: 585
          high: 720
          note: $150M-$180M revenue at 3x-4x
        - label: Base case
          low: 1100
          mid: 1460
          high: 1820
          note: $220M-$260M revenue at 5x-7x
        - label: Bull case
          low: 2100
          mid: 2670
          high: 3240
          note: $300M-$360M revenue at 7x-9x
    approximationNotes: >-
      The ranges are evidence-constrained but still assumption-heavy because the public record does
      not disclose Zip's current revenue or profitability.
    claimRefs: [CV045, CV046, CV047, CV048, CV053]
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scoring of Zip on category proof, moat potential, economics visibility, valuation, and exit readiness.
    data:
      items:
        - label: Category proof
          value: 4.5
          note: Financing and Gartner recognition are unusually well corroborated for a private company
        - label: Product / AI momentum
          value: 4.0
          note: AI-agent cadence and source-to-pay breadth support real upside if monetization is durable
        - label: Workflow defensibility
          value: 3.5
          note: Procurement can have workflow gravity, but the depth of lock-in still needs diligence proof
        - label: Economics visibility
          value: 1.5
          note: Revenue, gross margin, retention, and burn remain private
        - label: Valuation support
          value: 2.0
          note: The $2.2B mark is difficult to defend without proof of premium-scale revenue
        - label: Exit readiness
          value: 2.5
          note: Strategic or sponsor liquidity is more plausible than a near-term IPO
        - label: Evidence quality
          value: 3.5
          note: Financing and category proof are strong, but the key underwriting files are absent
    approximationNotes: >-
      Scores are directional judgment aids rather than a mechanical model; lower scores mainly
      reflect missing economic disclosure rather than denial of product traction.
    claimRefs: [CV037, CV038, CV039, CV040, CV041, CV042, CV049, CV050, CV051, CV052]
