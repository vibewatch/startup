  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-and-arr-gap
      missingEvidence: >-
        Zip does not publish audited revenue, ARR, deferred revenue, or contract-value disclosures.
      whyItMatters: >-
        Without a revenue base, investors cannot test valuation multiples, growth durability, or whether the
        company is large enough to absorb its expanding cost structure.
      diligencePath: >-
        Request audited GAAP revenue by year, current ARR by module and geography, deferred revenue balances,
        and a bookings-to-billings bridge.
      relatedQuestionRefs:
        - QI013
        - QI017
      relatedTableRefs:
        - TI002
        - TI005

    - type: private-evidence-only
      severity: material
      topic: cohort-unit-economics
      missingEvidence: >-
        Zip does not disclose CAC, cohort payback, average contract value, or net revenue retention outside a
        narrow strategic-enterprise retention claim.
      whyItMatters: >-
        Customer stories prove value exists, but they do not establish whether growth is being acquired
        efficiently across the full customer base.
      diligencePath: >-
        Request CAC by channel, fully loaded sales payback, NRR and gross retention by cohort, average contract
        size, and module attach-rate evolution.
      relatedQuestionRefs:
        - QI016
      relatedTableRefs:
        - TI003
        - TI005

    - type: missing-source
      severity: material
      topic: pricing-realization
      missingEvidence: >-
        Public sources show only custom-quote sales motion and low-confidence directory estimates; realized ACV,
        discounting, and contract duration are not public.
      whyItMatters: >-
        Underwriting revenue quality requires knowing whether Zip is winning on premium pricing, discounting,
        or bundling that may hide weaker module-level monetization.
      diligencePath: >-
        Request price books, discount bands, median contract length, and recent new-logo plus renewal deal
        summaries by segment.
      relatedQuestionRefs:
        - QI017
      relatedTableRefs:
        - TI002

    - type: missing-source
      severity: material
      topic: leverage-and-liquidity
      missingEvidence: >-
        No retained public source discloses debt facilities, cash on hand, monthly burn, or runway.
      whyItMatters: >-
        A company can be operationally scaled yet still be near a financing trigger if burn, working capital,
        or debt obligations are aggressive.
      diligencePath: >-
        Request current cash balance, monthly burn, cash-flow statement, debt schedule, covenant package, and
        a 12- to 24-month runway model including payments-related working capital needs.
      relatedQuestionRefs:
        - QI021
        - QI022
      relatedTableRefs:
        - TI004
        - TI005

sections:
  - id: section-revenue-model-pricing
    title: "Revenue model and pricing"
    body: >-
      Zip's public monetization model looks like enterprise workflow SaaS sold through a classic contact-sales
      motion rather than transparent self-serve pricing. Official surfaces for procure-to-pay and contact sales
      never publish list prices; instead, Zip steers prospects into a bespoke enterprise sales cycle. That is
      consistent with the product footprint: Zip now sells a broader procurement stack including intake
      orchestration, procure-to-pay, AI agents, global payments, vendor cards, and other add-ons, so realized
      pricing likely depends on module mix, workflow complexity, integrations, and payment volume.

      The available third-party pricing evidence is thin and low-confidence. SelectHub describes Zip as
      annually quote-based with no free trial and only a rough "$1,000 or more" starting-price estimate,
      which is directionally useful only to confirm opacity, not actual ACV. What matters more is the public
      value evidence used in enterprise selling: the 2026 Forrester-backed TEI page says four large-enterprise
      interviews modeled 386% ROI over three years, while official customer stories show highly specific
      savings and efficiency outcomes at Dollar Tree, Snowflake, Discover, and OpenAI. That combination
      suggests Zip monetizes on business-outcome selling rather than published rate cards.

      Revenue quality is likely helped by the mission-critical nature of the workflow. Procurement requests,
      approvals, POs, invoices, and supplier payments sit inside cross-functional operating processes, which
      usually makes replacement harder after deployment. Still, actual contract duration, expansion pricing,
      renewal uplift, discounting, and module attach rates are undisclosed, so realized revenue quality cannot
      be fully underwritten from public sources alone.
    claimRefs: [CI001, CI002, CI003, CI005, CI008, CI009, CI015, CI025]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]

  - id: section-sales-motion-efficiency
    title: "Sales motion and efficiency proxies"
    body: >-
      Zip's public customer evidence points to a top-down enterprise sales motion that wins on deployment
      speed and measurable savings rather than on lowest list price. G2's review aggregation points to a
      3-month average implementation period and an 8-month ROI window. Software Advice reviews go further,
      with users saying Zip did not require a separate third-party implementation team and that easy deployment
      helped it win the deal. Those are useful CAC-payback proxies for a private company that does not publish
      magic number, CAC, sales payback, or net retention.

      Customer stories reinforce the pattern. Dollar Tree cites $125M of supported savings and a 70%
      reduction in cycle times; Snowflake cites $305M of savings and $3.7B of spend visible before approval;
      Discover cites 3,000 approvals removed and 67% higher throughput; OpenAI cites 10+ AI agents in
      production and 1,400 hours saved from the first agent alone. These are company-authored claims, so they
      should be treated as best-case case studies rather than portfolio averages, but they still show the kind
      of ROI narrative Zip can take into a CFO- or CPO-led deal cycle.

      The missing link is cohort data. Public sources do not disclose win rates, CAC, sales-cycle length by
      segment, average contract value, expansion revenue, or renewal behavior. Without those metrics, public
      evidence supports a plausible enterprise-efficiency story but not a robust sales-efficiency model.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI032]
    figureRefs: [FI002]

  - id: section-cost-structure-unit-economics
    title: "Cost structure and unit economics"
    body: >-
      Zip's cost structure is broader than a pure workflow-automation vendor because the company now touches
      implementation, AI compute, integrations, and cross-border payments. The procure-to-pay page emphasizes
      invoice automation, PO management, and finance-stack syncing. The global-payments page adds 140-country,
      40-currency payout orchestration with multiple rails, reconciliation, and compliance. The integrations
      and AI pages show 60+ integrations, deep ERP/CLM/GRC connectivity, and AI features that make delivery
      cost partly a function of data access, compute, and support quality. Put simply: Zip likely enjoys a
      software-like gross margin core, but every point of payments or services mix can dilute that profile.

      Public comparables help frame the range even though they do not solve it. BILL's FY25 SEC-backed results
      show 81.4% full-year gross margin with meaningful transaction-fee revenue, while ServiceNow's 2025 10-K
      summary sits at 78% gross margin for enterprise workflow software. Zip's mix could land below those
      anchors if implementation services or global payments contribute a larger share of revenue than the
      market assumes. BILL's 37%-of-revenue sales-and-marketing load also highlights how expensive enterprise
      workflow-plus-payments distribution can be.

      The principal limitation is disclosure. Zip does not publish gross margin, services mix, AI inference
      costs, payments take rate, fraud or loss reserves, or sales and marketing spend. Publicly, the best
      one can do is triangulate a likely mid- to high-gross-margin SaaS core with meaningful margin drag from
      services and payment operations.
    claimRefs: [CI003, CI004, CI027, CI028, CI029, CI030, CI031]
    tableRefs: [TI003]
    figureRefs: [FI004]

  - id: section-capital-adequacy-gaps
    title: "Capital adequacy and public disclosure gaps"
    body: >-
      Company Overview already covers Zip's full funding chronology; financially, the relevant current fact is
      that Series D added $190M at a $2.2B valuation in late 2024, taking cumulative capital raised to about
      $371M. Zip and independent coverage say that money is being used for R&D, the Zip AI Lab, procure-to-pay
      expansion, and faster EMEA growth. Separate company coverage reported 200% EMEA growth plus new London
      investment, while CityBiz reported a jump from 250 to over 500 employees and a bigger physical footprint
      in San Francisco, New York, and Toronto. Those are all signs of aggressive reinvestment rather than
      austerity.

      Public scale metrics support the idea that Zip has enough capital to keep pressing expansion. By late
      2025, public coverage tied to company statements cited $355B of spend processed across 7M suppliers,
      $6B of customer savings, 10M days of cycle-time saved, and 10M AI insights. CityBiz separately reported
      a $15B annual payments run-rate. Those figures do not prove capital efficiency, but they do suggest Zip
      is operating at a large-enough scale to justify meaningful platform, support, and compliance spend.

      The core capital-adequacy problem is the absence of balance-sheet data. No retained public source gives
      cash on hand, monthly burn, runway, debt facilities, or any working-capital metrics tied to the
      payments product. That means the company may be well capitalized in absolute dollars while still being
      impossible to underwrite on runway or burn discipline from public evidence alone.
    claimRefs: [CI016, CI017, CI019, CI020, CI021, CI022, CI023, CI024, CI037, CI038]
    tableRefs: [TI004, TI005]
    figureRefs: [FI003]

  - id: section-financial-verdict
    title: "Financial verdict"
    body: >-
      On the positive side, Zip's revenue quality appears stronger than that of many procurement point
      solutions. The company is embedding into cross-functional workflows, official customer stories document
      meaningful savings and throughput gains, and CityBiz cites 100% retention across strategic enterprise
      customers. The business model also has multiple expansion levers—core orchestration, procure-to-pay,
      AI agents, and payments—which can raise net dollar retention if monetized cleanly.

      On the negative side, public evidence still stops far short of investable financial transparency.
      Revenue, ARR, gross margin, services mix, CAC, NRR, churn, burn, cash, runway, and payments take-rate
      are all missing. Review sources also show that reporting and onboarding limitations still exist,
      suggesting nontrivial support and product-investment load. In 2026's tougher late-stage software market,
      PwC and SVB both imply that valuation support will go to companies that can prove real workflow moats,
      pricing power, and durable growth—not just AI usage narratives.

      The verdict is therefore favorable on business quality but incomplete on finance quality. Zip looks like
      a credible high-end enterprise software asset with signs of sticky demand, but public evidence alone is
      insufficient to underwrite margin path, cash runway, or a defensible private-market valuation. Those are
      the key diligence blockers for an investor or acquirer.
    claimRefs: [CI012, CI025, CI033, CI034, CI035, CI036, CI039, CI040]

