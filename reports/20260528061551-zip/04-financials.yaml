      - ["Support / product debt load", "Review evidence of reporting gaps, onboarding-control issues, and virtual-card limitations", "Medium", "Can raise support cost and slow expansion revenue", "Provide support cost per account and product defect backlog trends"]
      - ["Retention quality", "100% retention across strategic enterprise customers (company-claimed)", "Medium", "Positive signal for revenue durability, but not a full company-wide NRR metric", "Disclose gross and net retention by cohort"]
    notes: "Most unit-economics values are proxies or case-study outcomes because Zip does not publish cohort metrics or audited margins."
    claimRefs: [CI005, CI006, CI008, CI009, CI010, CI011, CI025, CI027, CI028, CI029, CI033]
    enumerationScope:
      coverage: partial
      basis: >-
        Most unit economics remain private. Table mixes direct public signals with clearly labeled proxy ranges
        from public comparables and customer outcomes.

  - id: TI004
    title: "Capital adequacy table"
    columns:
      - "Capital signal"
      - "Public value / status"
      - "Source basis"
      - "Implication"
      - "Diligence ask"
    rows:
      - ["Latest financing", "$190M Series D at $2.2B valuation", "Zip, Business Wire, Crunchbase, FinTech Futures", "Large late-stage round gives meaningful expansion capital", "Provide post-round cash balance and ownership dilution"]
      - ["Cumulative equity raised", "~$371M since 2020", "Crunchbase and FinTech Futures", "Suggests balance-sheet support even without debt", "Provide full cap table and liquidation preference stack"]
      - ["Use of proceeds", "AI lab, R&D, P2P expansion, EMEA growth", "Zip and independent coverage", "Capital is being deployed aggressively rather than conserved", "Provide budget allocation across R&D, sales, and expansion"]
      - ["Headcount growth", "250 to 500+ employees in one year", "CityBiz", "Operating-expense base likely stepped up materially in 2025", "Provide quarterly headcount, revenue per employee, and burn bridge"]
      - ["Office / geographic expansion", "75k sq ft SF HQ; NYC and Toronto expansion; London/EMEA buildout", "CityBiz and Business Wire", "Signals confidence and scale, but also fixed-cost expansion", "Provide lease obligations and regional payroll commitments"]
      - ["Operating scale proxy", "$15B annual payments run-rate; $355B spend processed in 2025", "CityBiz, Business Wire, PYMNTS", "Supports argument that the platform has enough scale to absorb platform investment", "Tie payment volume and spend volume to actual revenue and gross profit"]
      - ["Debt / project finance", "No public disclosure found", "Absence across retained sources", "Leverage risk appears low, but this remains unverified", "Confirm debt facilities, venture debt, letters of credit, and guarantees"]
      - ["Cash / burn / runway", "Not publicly disclosed", "No retained source provides balance-sheet data", "Most important blocker to capital-adequacy underwriting", "Provide cash balance, monthly burn, and runway scenario analysis"]
    notes: "Capital adequacy can only be inferred from fundraising and operating-scale signals because Zip publishes no balance-sheet detail."
    claimRefs: [CI016, CI017, CI019, CI020, CI021, CI022, CI023, CI024, CI037, CI038]
    enumerationScope:
      coverage: partial
      basis: >-
        Table focuses on current adequacy signals rather than restating every historical round from Company
        Overview. Cash, burn, and debt remain public evidence gaps.

  - id: TI005
    title: "Public financial gaps table"
    columns:
      - "Missing metric"
      - "What is public"
      - "Underwriting risk"
      - "Specific diligence path"
    rows:
      - ["Revenue / ARR", "No direct disclosure; only ROI and scale proxies", "Cannot map valuation to revenue multiple or growth efficiency", "Request monthly ARR bridge, ARR by module, and audited revenue by year"]
      - ["Gross margin / services mix", "Only proxy range from BILL and ServiceNow", "Cannot judge software quality or payments/services dilution", "Request gross margin by software, payments, and professional services"]
      - ["Burn / runway", "Series D amount is known; cash balance is not", "Capital adequacy cannot be underwritten", "Request cash, monthly net burn, and base/upside/downside runway models"]
      - ["NRR / churn", "100% strategic-enterprise retention claim only", "Cannot separate logo quality from cohort durability", "Request gross retention, NRR, churn by segment, and contraction drivers"]
      - ["CAC / sales payback", "3-month implementation and 8-month ROI only", "Cannot tell if growth is efficiently acquired", "Request fully loaded CAC, payback, quota attainment, and pipeline conversion"]
      - ["Payments unit economics", "$15B run-rate and 140-country / 40-currency footprint", "Unknown take rate, losses, reserve needs, and treasury complexity", "Request payment revenue, gross profit, failed-payment rate, and compliance cost"]
      - ["Module mix / attach rate", "Broad product surface is public; revenue contribution is not", "Cannot tell whether AI and P2P are monetized or bundled", "Request ARR and customer counts by module and attach-rate evolution"]
      - ["Support burden / product debt", "Review sites cite reporting, onboarding, and card limitations", "Unclear whether support costs scale down or up with growth", "Request support tickets per customer, escalation rate, and roadmap close dates"]
    notes: "These are the highest-impact public-data gaps; each one materially affects valuation, runway, or margin underwriting."
    claimRefs: [CI012, CI013, CI014, CI026, CI032, CI033, CI038, CI040]
    enumerationScope:
      coverage: exhaustive
      basis: >-
        These are the principal financial data gaps preventing a full public-only underwriting model for Zip.

figures:
  - id: FI001
    title: "Revenue model bridge"
    type: flow
    layout: standard
    summary: >-
      Publicly observable bridge from customer procurement activity to recurring software revenue and a blended
      gross-profit outcome for Zip.
    approximationNotes: >-
      This figure is mechanism-oriented rather than numeric because Zip does not disclose revenue mix, take
      rate, or realized module pricing.
    data:
      nodes:
        - id: requests
          label: "Enterprise request volume"
          description: "Customers route procurement, approvals, POs, invoices, and supplier interactions through Zip workflows."
        - id: core-platform
          label: "Core orchestration subscription"
          description: "Quote-based platform sale monetizes the front door and approval workflow layer."
        - id: module-expansion
          label: "Module attach"
          description: "Procure-to-pay, AI, budgets, vendor cards, and sourcing expand ACV inside deployed accounts."
        - id: payments-layer
          label: "Payments and rail activity"
          description: "Global payments adds usage and service economics tied to payout volume, currencies, and compliance."
        - id: gross-profit
          label: "Blended gross profit"
          description: "Software-like economics are likely strongest at the orchestration layer; services and payments determine dilution."
      edges:
        - from: requests
          to: core-platform
          label: "converted into"
        - from: core-platform
          to: module-expansion
          label: "expands via"
        - from: module-expansion
          to: payments-layer
          label: "can include"
        - from: core-platform
          to: gross-profit
          label: "drives"
        - from: payments-layer
          to: gross-profit
          label: "dilutes / scales"
    claimRefs: [CI001, CI002, CI003, CI004, CI030, CI031]

  - id: FI002
    title: "Unit economics bridge"
    type: flow
    layout: standard
    summary: >-
      Best public proxy for how Zip converts an enterprise deployment into measurable customer value and then
      into potential renewal quality.
    approximationNotes: >-
      Zip does not disclose CAC or cohort payback, so the bridge relies on review-platform implementation
      data, the Forrester-sponsored study, and official customer stories.
    data:
      nodes:
        - id: enterprise-deal
          label: "Enterprise sale"
          description: "Custom quote and contact-sales motion imply a field-led enterprise acquisition model."
        - id: implementation
          label: "Implementation"
          description: "G2 review data points to about 3 months to implement; Software Advice cites low need for outside implementers."
        - id: adoption
          label: "Workflow adoption"
          description: "Employees and approvers use Zip for request intake, approvals, AP, and AI-assisted workflows."
        - id: measurable-value
          label: "Measurable customer value"
          description: "Official case studies cite savings, throughput gains, cycle-time reduction, and hours saved."
        - id: renewal-quality
          label: "Renewal / expansion potential"
          description: "If value is durable, it should support renewals and module attach, but public cohort metrics are absent."
      edges:
        - from: enterprise-deal
          to: implementation
          label: "activates"
        - from: implementation
          to: adoption
          label: "enables"
        - from: adoption
          to: measurable-value
          label: "creates"
        - from: measurable-value
          to: renewal-quality
          label: "supports"
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI032]

  - id: FI003
    title: "Financial estimate range"
    type: range
    layout: wide
    summary: >-
      Publicly supportable range estimates for Zip's margin and valuation context, mixing direct comparable
      data with clearly labeled analytical ranges.
    approximationNotes: >-
      Gross-margin and sales-intensity ranges are analytical estimates anchored by BILL and ServiceNow public
      disclosures. Valuation-multiple band uses 2026 private/public software market context rather than Zip-specific trading data.
    data:
      items:
        - label: "Estimated blended gross margin for Zip-like mix"
          low: 65
          mid: 72
          high: 80
          unit: "%"
          detail: "Anchored by 78%-81.4% public peers, discounted for payments and services mix uncertainty"
          source: "BILL FY25, ServiceNow 2025, Zip product mix"
          tone: neutral
        - label: "Enterprise sales intensity"
          low: 35
          mid: 40
          high: 45
          unit: "% of revenue"
          detail: "BILL's 37% S&M ratio provides a public center point for enterprise workflow-plus-payments sales load"
          source: "BILL FY25 SEC exhibit"
          tone: neutral
        - label: "Implementation to initial ROI window"
          low: 3
          mid: 5.5
          high: 8
          unit: "months"
          detail: "G2 implementation and ROI proxies"
          source: "G2 review data"
          tone: positive
        - label: "2026 software valuation context"
          low: 3.8
          mid: 4.65
          high: 5.5
          unit: "x EV/Revenue"
          detail: "Median private SaaS EV/revenue versus compressed public-multiple backdrop in Q1 2026"
          source: "SaaSRise Q1 2026"
          tone: adverse
    claimRefs: [CI006, CI027, CI028, CI029, CI031, CI036]

  - id: FI004
    title: "Capital intensity / cash-flow map"
    type: matrix
    layout: wide
    summary: >-
      Qualitative map of which Zip revenue layers are likely to drive margin dilution, working-capital needs,
      and disclosure risk.
    approximationNotes: >-
      Ratings are evidence-backed qualitative judgments from official product pages, review data, and public
      comparable filings. Zip has not disclosed actual cost-accounting splits.
    data:
      columns:
        - "Margin profile"
        - "Working-capital exposure"
        - "Fixed-cost burden"
        - "Disclosure gap"
      rows:
        - label: "Core orchestration SaaS"
          values: ["High", "Low", "Medium-High", "High"]
        - label: "Procure-to-pay / AP automation"
          values: ["Medium-High", "Low-Medium", "Medium", "High"]
        - label: "Global payments"
          values: ["Medium", "High", "Medium", "High"]
        - label: "AI agents and automation"
          values: ["Medium-High", "Low", "High", "High"]
        - label: "Implementation and support"
          values: ["Low-Medium", "Low", "High", "Medium"]
    claimRefs: [CI003, CI004, CI027, CI030, CI031, CI033, CI037, CI040]
