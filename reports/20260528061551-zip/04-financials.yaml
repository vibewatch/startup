chapter:
  number: 4
  title: "Financials"
  summary: >-
    Zip's public financial picture supports a high-quality enterprise software revenue model but not an
    underwritable forecast. Official sources show quote-based enterprise monetization across procurement
    orchestration, procure-to-pay, AI, and global payments, while customer stories and the 2026
    Forrester-backed TEI page provide concrete ROI signals: 386% modeled three-year ROI, $125M in Dollar
    Tree savings, $305M in Snowflake savings, and 1,400 hours saved at OpenAI. Series D injected $190M at
    a $2.2B valuation for AI lab, procure-to-pay, and EMEA expansion, and 2025 operating signals include a
    jump from 250 to 500+ employees and a $15B annual payments run-rate. The underwriting blocker is that
    revenue, ARR, gross margin, burn, net retention, and payments take-rate remain undisclosed.
