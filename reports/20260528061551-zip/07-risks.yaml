  evidenceGaps:
    - type: missing-source
      severity: material
      topic: TR001 regulatory / legal risk register coverage
      missingEvidence: Public materials do not reveal negotiated customer-contract deviations, complaint histories, regulator correspondence, or a definitive company-specific litigation schedule.
      whyItMatters: Zip's public privacy and AI posture is visible, but the real downside often appears first in negotiated enterprise contracts, customer complaints, or regulator inquiries.
      diligencePath: Request litigation and regulatory-inquiry schedules, major contract redlines, privacy complaint logs, and outside-counsel summaries for the last five years.
      relatedQuestionRefs: [QR008, QR034]
      relatedTableRefs: [TR001]
    - type: missing-metric
      severity: material
      topic: customer concentration opacity
      missingEvidence: Exact customer count, top-customer ARR share, top-10 revenue concentration, and renewal dependence by named enterprise account are not public.
      whyItMatters: The company clearly has marquee customers, but the public record does not show whether one or two accounts dominate revenue or expansion expectations.
      diligencePath: Request customer concentration schedules, ARR by cohort and account, logo-to-revenue mapping, and renewal history for top accounts.
      relatedQuestionRefs: [QR025, QR030]
      relatedTableRefs: [TR003, TR005]
    - type: private-evidence-only
      severity: critical
      topic: financial model opacity
      missingEvidence: Revenue, burn, gross margin, working capital, runway, and downside financing plans remain outside the public record.
      whyItMatters: Private-company opacity prevents reliable underwriting of how legal, operational, or customer shocks would flow into cash needs and valuation.
      diligencePath: Request audited or review-level financials, board KPI packs, cash runway analysis, budget vs. actuals, and financing scenarios.
      relatedQuestionRefs: [QR028]
      relatedTableRefs: [TR004, TR005]

