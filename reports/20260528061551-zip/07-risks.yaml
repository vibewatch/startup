  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Privacy / AI-governance drift
        - Customer, regulator, or auditor challenge on AI decision logging or transfer controls
        - Material control exception, regulator inquiry, or inability to evidence human oversight
        - Pause aggressive AI-upside credit until governance pack is produced and validated
      - - Cloud / AI subprocessor concentration
        - Provider outage or provider-policy change
        - Repeated downtime, degraded AI quality, or loss of zero-data-retention assurances
        - Recut reliability assumptions and require contingency plan before underwriting growth
      - - ERP integration dependency
        - Connector reliability and implementation slippage
        - Daily sync failures, elevated professional-services load, or delayed go-lives
        - Lower deployment-speed thesis and reduce expansion assumptions
      - - Customer concentration opacity
        - Large-account churn or pipeline softness without concentration disclosure
        - Management cannot provide top-customer ARR / GP share and churn history
        - Treat opacity itself as a thesis break for concentrated upside assumptions
      - - Product and organizational sprawl
        - Missed milestones across AI, contract orchestration, and migration programs
        - Two or more critical launch or migration slips in a short period
        - Reduce execution multiple and focus diligence on staffing and release discipline
      - - Capital / model opacity
        - Financing need arrives before public or diligence data support the model
        - Burn, gross margin, runway, or covenant data remain unavailable in diligence
        - Require downside financing plan; otherwise move to pass or monitor-only status
    notes: >-
      Each trigger is intentionally monitorable: management can either satisfy it with evidence or confirm that
      residual exposure remains too high.
    claimRefs:
      - CR006
      - CR010
      - CR017
      - CR022
      - CR027
      - CR032
      - CR042
