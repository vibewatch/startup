sections:
  - id: section-landscape-classes
    title: Landscape Classes and Competitive Set
    body: >-
      Zip is not competing in a single homogeneous procurement-software market. Buyers can solve
      the same control problem through at least five classes of alternatives: full-suite
      source-to-pay incumbents such as Coupa, SAP Ariba, Ivalua, and Oracle; orchestration-first
      challengers such as Zip and Tonkean; lighter mid-market procure-to-pay tools such as
      Procurify; finance-led spend stacks such as Ramp, Airbase, and Brex; and status-quo
      substitutes that include ServiceNow workflows, ERP-native modules, spreadsheets, email, and
      internal ticketing. This classification matters because the purchase decision is often less
      about “best procurement software” and more about whether the buyer wants a new front door,
      a full suite, a finance-led spend stack, or no new platform at all.

      Public evidence shows that incumbents still control the largest installed bases and the most
      mature analyst positioning. 6sense places Ariba Procurement Solutions, Coupa Procurement,
      and ServiceNow Procurement ahead of Zip by observed domain footprint, while procurement trade
      press still treats SAP Ariba as a share leader and Coupa, SAP, Ivalua, and Oracle as the
      center of the suite market. Against that backdrop, Zip's rise is meaningful because it
      validates orchestration as a category wedge: the company is now framed as a 2026 Visionary
      and the only agentic procurement orchestration platform on the quadrant, but it is still a
      much younger entrant than the suites it often sits beside.

      The most important substitute is still the status quo. Tonkean's survey data and TechCrunch's
      reporting both describe a world where procurement still spans too many systems, too many
      handoffs, and too much manual work. That fragmentation creates the opening for Zip's front-
      door thesis, but it also means buyers can postpone a formal platform decision by stitching
      together ServiceNow, ERP modules, shared inboxes, spreadsheets, and approval tools for longer
      than a startup bull case usually assumes.
    notes: >-
      Scale, pricing, and segment fields combine official pages, reviews, and trade coverage; custom-quote vendors preserve public ambiguity rather than inferred list prices.
    claimRefs:
      - CP001
      - CP002
      - CP004
      - CP005
      - CP012
      - CP014
      - CP015
      - CP031
      - CP032
      - CP040
    tableRefs:
      - TP001
    figureRefs:
      - FP001

  - id: section-head-to-head-comparison
    title: Capability, Pricing, GTM, and Trust Comparison
    body: >-
      Zip's best-supported advantage is not suite breadth; it is requester experience and speed.
      Reviews and competitor comparisons consistently describe Zip as intuitive, flexible, and easy
      to implement relative to legacy suites. That matters because employee adoption is the first
      gating function in procurement transformation. Where Zip tends to win is when a company has
      decentralized requests, too many approvers across legal, IT, finance, and security, and a
      desire to improve control without forcing every employee into a heavyweight suite interface.

      The tradeoff is equally consistent across the evidence base. Coupa, SAP Ariba, Ivalua, and
      Oracle all have deeper downstream procure-to-pay capabilities, stronger supplier or ERP
      adjacency, and more credible full-suite analytics. Coupa's long implementation times and
      harder UX are the price of that breadth; SAP and Oracle inherit distribution through broader
      enterprise stacks; Ivalua wins where configurability and complex procurement depth outweigh
      speed. Zip's public pricing is opaque, and even third-party estimates are coarse. That
      opacity is not unique to Zip—most enterprise suites hide pricing behind demos and custom
      quotes—but it makes direct ROI benchmarking difficult, especially when comparing against
      lower-friction alternatives such as Procurify, Ramp, Airbase, or Brex.

      Trust and regulatory posture are also no longer differentiators by themselves. SAP advertises
      FedRAMP and global certifications, Coupa publishes uptime, Ramp and Brex highlight SOC and
      payment-security controls, and ServiceNow foregrounds GDPR and privacy-by-design. In other
      words, Zip cannot rely on “enterprise ready” as a moat. It has to win on workflow design,
      time-to-value, and the practical ability to coexist with the systems buyers already own.
    claimRefs:
      - CP006
      - CP007
      - CP008
      - CP009
      - CP010
