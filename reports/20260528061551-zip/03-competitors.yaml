  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - "Moat claim"
      - "Supporting evidence"
      - "Primary threat"
      - "Severity"
      - "Mitigation / diligence ask"
    rows:
      - - "Requester UX and no-code workflow design"
        - "Review and comparison consensus says Zip is intuitive, configurable, and easy to deploy"
        - "Incumbents improve guided buying and AI-assisted intake"
        - "Medium"
        - "Request head-to-head demo scores and admin-change logs versus Coupa/SAP/Oracle"
      - - "Overlay deployment on top of ERP/P2P"
        - "Zip integrates with SAP, NetSuite, Coupa, Workday, Slack, Okta, DocuSign"
        - "Buyer chooses to deepen incumbent suite instead of adding Zip"
        - "High"
        - "Quantify attach rate, expansion rate, and win rate in accounts already running suite incumbents"
      - - "Fast implementation and adoption"
        - "4-8 week comparisons and strong review-based onboarding evidence"
        - "Finance-led alternatives also market fast time-to-value"
        - "Medium"
        - "Collect time-to-live cohort data by segment and implementation partner"
      - - "AI-led orchestration narrative"
        - "Zip launched 50+ purpose-built AI agents and markets orchestration depth"
        - "Coupa, SAP, Ivalua, Oracle, and ServiceNow now market embedded or agentic AI too"
        - "High"
        - "Test which AI features are actually used weekly and which drive net retention"
      - - "Cross-functional procurement control across legal / IT / finance"
        - "Zip and reviews emphasize multi-stakeholder routing and audit trails"
        - "ServiceNow and ERP-native workflows already sit in adjacent enterprise control planes"
        - "High"
        - "Map where Zip wins because it orchestrates cross-functionally better than Now/ERP-native tools"
      - - "Mid-market land-and-expand wedge"
        - "Zip is framed around 200-10,000 employees; lower mid-market is still underpenetrated"
        - "Procurify, Ramp, Airbase, Brex, and ProcureDesk-style tools pressure the segment from below"
        - "High"
        - "Break pipeline by company size and loss reasons to lighter alternatives"
      - - "Suite-depth expansion beyond intake"
        - "Zip is expanding into P2P, sourcing, and AP"
        - "Customer reviews still cite reporting, bill module, and vendor-master limitations"
        - "High"
        - "Validate roadmap credibility with product-usage data and module attach by cohort"
      - - "Enterprise trust posture"
        - "Category leaders all advertise certifications, uptime, and privacy controls"
        - "Trust becomes table stakes, not a differentiator"
        - "Medium"
        - "Ask for Zip's current certification set, uptime history, and regulatory posture by region"
      - - "Pricing and ROI transparency"
        - "Fast ROI is claimed, but public realized pricing and win-rate data are thin"
        - "Opaque pricing reduces buyer confidence and complicates competitive benchmarking"
        - "Medium-High"
        - "Request realized pricing bands, ROI case studies, and competitive displacement evidence"
    notes: >-
      Severity is qualitative and reflects competitive importance to Zip, not probability-weighted financial loss; diligence asks are the concrete next steps needed to close each risk.
    claimRefs:
      - CP016
      - CP017
      - CP019
      - CP023
      - CP024
      - CP027
      - CP029
      - CP030
      - CP033
      - CP034
      - CP035
      - CP036
      - CP037
      - CP038
      - CP039
      - CP040
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Register enumerates the primary durability claims and risks evidenced in current sources for
        Zip's competitive position: UX, overlay strategy, implementation speed, AI, cross-functional
        orchestration, segment wedge, product-depth expansion, trust, and pricing transparency.

