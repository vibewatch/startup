company:
  name: "Clear Street"
chapter:
  number: 8
  title: "Valuation"
  summary: "Clear Street has credible evidence of rapid operating scale and a $2.0 billion 2023 financing benchmark, but three independent data providers give conflicting January-February 2026 valuation signals of approximately $8.2 billion, $11 billion, and $12 billion. The appropriate recommendation is research more / track: public evidence does not support a disciplined entry price, target return, or exit timetable without primary financing terms and audited financials."
sections:
  - id: "decision-and-financing-evidence"
    title: "Decision and Financing Evidence"
    body: "Recommendation: research more / track, with medium-low confidence, high risk, and no supportable entry valuation from the available public record. The strongest historical anchor is the April 2023 second tranche: Clear Street and TechCrunch both reported a $270 million investment, a $435 million total Series B, and a $2.0 billion valuation; TechCrunch and Multiples also place the May 2022 first tranche at $1.7 billion. Current evidence is much less coherent. Multiples reports a $12 billion January 2026 strategic-round valuation, Sacra reports an approximately $11 billion implied valuation after a January 2026 Series C, and Tracxn reports $8.2 billion as of February 12, 2026. These marks differ in round label, amount, date, and valuation, and none of the retained sources is a primary 2026 financing document. The divergence precludes a precise price, target return, hold period, or exit forecast."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV015"
    tableRefs:
      - "TV001"
  - id: "thesis-and-antithesis"
    title: "Thesis and Anti-Thesis"
    body: "The thesis is that operating scale may have advanced substantially since the 2023 financing. Clear Street currently claims $1.0 billion in capital raised, more than 700 institutional clients, about $16 billion in customer balances, roughly $28.4 billion of daily notional volume, and 94% year-over-year transacted growth. It also reported 830 employees in July 2026, while its careers page separately describes more than 800 employees. The anti-thesis is that the available revenue evidence is analyst-estimated rather than audited and may be especially sensitive to market conditions: Sacra estimates $1.04 billion of 2025 revenue and says net financing represented roughly 70% of 2024 revenue. That concentration links valuation support to client balances, leverage, spreads, and interest rates rather than to a pure recurring-software model. Scale therefore improves the company-quality case but does not resolve entry-price discipline."
    claimRefs:
      - "CV006"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV016"
    tableRefs:
      - "TV002"
    figureRefs:
      - "FV001"
  - id: "scenarios-and-comparables"
    title: "Scenarios and Comparable Context"
    body: "Scenario analysis should use observed reference points rather than invented forecasts. A bull signal would be primary confirmation of the $12 billion mark together with audited results consistent with Multiples' $940 million round-vintage revenue record or Sacra's $1.04 billion full-year 2025 estimate, plus sustained balance and volume growth. A base signal is reconciliation within the roughly $8.2 billion to $11 billion range indicated by Tracxn and Sacra, accompanied by disclosed security terms and normalized earnings. A bear signal is a reset toward the $2.0 billion 2023 financing reference if revenue quality, client balances, or financing economics weaken; that historical price is a reference, not a floor or fair-value estimate. Multiples identifies StoneX, Virtu, Groww, XP, FalconX, and Wealthsimple as comparables, but their business mixes and the page's mixed fiscal-period data make them directional references rather than a defensible peer-multiple valuation."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV014"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-diligence"
    title: "Exit Readiness, Diligence Asks, and Thesis-Break Triggers"
    body: "Exit readiness remains unproven in the retained evidence. Sacra says the company was preparing for a 2026 public offering, while Multiples describes a potential listing as early as 2026; neither source establishes that a filing, pricing, or listing occurred by the run date. Before underwriting an entry, obtain the 2026 financing documents, fully diluted capitalization, liquidation preferences, senior-note terms, audited 2024-2025 financials, regulatory-capital schedules, and customer and financing-balance concentration. A favorable decision requires reconciled valuation and revenue figures, durable earnings through a rate cycle, and a credible liquidity path. Thesis-break triggers include sustained contraction in customer balances or daily notional, material deterioration in financing economics, a regulatory-capital constraint, inability to reconcile the current valuation marks, or a financing round whose preferences make the headline valuation economically misleading."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV008"
      - "CV010"
      - "CV011"
      - "CV013"
      - "CV015"
      - "CV016"
