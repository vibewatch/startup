        - "$12B third-party January 2026 mark; not an independent fair-value estimate"
        - "Stronger only after audited results and a verified liquidity path"
        - "Reject if the headline mark depends on investor-favorable preferences or non-comparable revenue"
      - - "Base"
        - "Current marks reconcile; revenue remains near reported 2025 scale; financing concentration is manageable"
        - "Approximately $8.2B-$11B from Tracxn and Sacra; not a modeled range"
        - "Neutral until financing documents and normalized earnings are available"
        - "Pause if valuation, round size, or security terms cannot be reconciled"
      - - "Bear"
        - "Revenue quality weakens, balances or leverage contract, or financing spreads compress"
        - "$2B April 2023 financing reference; not a floor or current fair value"
        - "Rises with verified deceleration, regulatory-capital pressure, or private-round stress"
        - "Thesis breaks on sustained scale contraction or preference-adjusted down-round economics"
    notes: "Ranges are observed source references with different dates and definitions, not forecasts; probabilities and investor returns cannot be calculated from the retained public evidence."
