callouts:
  - calloutType: insight
    title: Cloud-Native Ledger Architecture Overcomes Legacy Incumbent Lock-In
    body: >
      Incumbent prime brokers and custodian banks remain burdened by decades-old mainframe systems,
      often requiring batch-based reconciliation that takes days to settle. Clear Street's cloud-native,
      single real-time ledger enables 14-day institutional onboarding and real-time risk calculations,
      allowing the firm to capture emerging hedge funds and high-volume market participants underserved
      by tier-one institutions.
    claimRefs:
      - CM002
      - CM013
      - CM014
  - calloutType: risk
    title: Capital Intensity and Regulatory Scrutiny Limit Rapid Scale
    body: >
      Operating as a multi-asset clearing firm requires substantial capital reserves, net capital
      compliance, and clearinghouse deposit commitments. Rapid balance sheet and volume expansion
      inevitably increases regulatory exposure across SEC, FINRA, and CFTC jurisdictions, making risk
      control and regulatory compliance critical bottlenecks to market share expansion.
    claimRefs:
      - CM015
      - CM016
