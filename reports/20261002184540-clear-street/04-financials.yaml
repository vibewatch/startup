company:
  name: Clear Street
chapter:
  number: 4
  title: Financials
  summary: >-
    Reported revenue and net income accelerated through September 2025, but the
    revenue mix remains concentrated in financing economics tied to client
    balances and market conditions. Public evidence does not disclose realized
    pricing, gross margin, cash on hand, cash burn, runway, customer concentration,
    or risk-adjusted returns on the balance sheet, leaving material underwriting
    work despite reported profitability.
sections:
  - id: revenue-quality
    title: Revenue scale is visible, but financing concentration shapes quality
    body: >-
      Clear Street reported $463.6 million of 2024 revenue and $89.1 million of
      net income; for the nine months ended September 30, 2025, reported revenue
      rose to $783.7 million, up 160% year over year, while net income reached
      $157.2 million. The assigned evidence describes two principal streams rather
      than a subscription model. Sacra attributes about 70% of 2024 revenue, or
      $326 million, to net financing and about 30%, or $137 million, to transaction
      revenue. This mix can benefit from larger client balances and activity, but
      it also makes revenue quality sensitive to interest-rate spreads, securities
      lending demand, client leverage, and trading volumes. Accounting revenue
      should not be relabeled as ARR, and accounting profit does not establish
      cash generation because no cash-flow statement or balance sheet was present
      in the assigned evidence.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: monetization-and-gtm
    title: Adjacent products widen monetization, while realized pricing stays private
    body: >-
      The public operating footprint points to several cross-sell surfaces.
      Clear Street says its Kalshi relationship includes institutional trading
      access, clearing, settlement, block trading, swap solutions for ETFs, and
      supporting infrastructure. Family Wealth Report separately reported the
      launch of private-markets equity research inside client accounts, while the
      investment-banking page claims 92 transactions and $99 billion of transaction
      value in 2025. These activities can deepen account relationships and add
      clearing, financing, execution, advisory, or research economics, but the
      assigned evidence does not disclose list prices, realized take rates,
      discounts, contract minimums, sales-cycle length, CAC, or payback. Deal
      value and transaction count are activity measures, not revenue. Accordingly,
      this chapter treats product breadth as a monetization opportunity rather
      than evidence of incremental margin or efficient customer acquisition.
    claimRefs:
      - CI014
      - CI015
      - CI016
    tableRefs:
      - TI002
  - id: operating-scale-and-unit-economics
    title: Scale proxies are strong, but definitions and cost attribution are incomplete
    body: >-
      An independent IPO report placed Clear Street above 2,000 clients and
      $31.3 billion of daily trading activity as of September 2025, with more
      than $17.2 billion of interest-bearing client balances. The official
      homepage presents a different, undated operating snapshot of more than
      700 institutional clients and about $16 billion of customer balances.
      These figures may describe different dates, populations, or balance
      definitions and should not be treated as contradictory without management
      reconciliation. Cost proxies point to a substantial service and control
      footprint: the company said headcount grew from 773 to 830 during 2026,
      while its careers page lists 16 offices and more than 800 employees.
      Those facts indicate operating scale but do not reveal personnel expense,
      cloud and connectivity costs, regulatory-capital usage, gross margin, or
      contribution margin by stream.
    claimRefs:
      - CI007
      - CI008
      - CI011
      - CI012
      - CI013
    tableRefs:
      - TI003
  - id: capital-adequacy-verdict
    title: Reported financing extends capacity but does not prove runway
    body: >-
      Clear Street raised approximately $135.4 million through Series C preferred
      stock sales in December 2025 and January 2026. A subsidiary also issued
      $78.5 million of notes in January 2026, taking reported outstanding debt to
      $300 million. These facts show continued access to equity and debt capital,
      but funding raised is not the same as cash available: the assigned evidence
      does not state unrestricted cash, regulatory-capital requirements,
      encumbered liquidity, debt maturities, covenants, cash burn, or planned use
      of funds. The financial verdict is therefore mixed. Revenue scale and
      reported profitability support operating traction, while financing
      concentration and missing balance-sheet, cash-flow, margin, pricing, and
      concentration data prevent a confident judgment on durable returns or
      capital adequacy. Underwriting should require audited statements and
      stream-level economics before assigning a forward margin or runway case.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI007
      - CI009
      - CI010
tables:
  - id: TI001
    title: Revenue streams and quality
    columns:
      - Stream
      - Mechanism
      - Public unit or scale
      - Current evidence
      - Quality and diligence implication
    rows:
      - - Net financing
        - Margin lending, securities lending, and yield on client balances
        - "$326M in 2024; about 70% of revenue"
        - Third-party reported
        - "Concentrated and balance-driven; request spread, rate, leverage, and concentration sensitivities"
      - - Transaction revenue
        - Commissions, clearing fees, and related transaction income
        - "$137M in 2024; about 30% of revenue"
        - Third-party reported
        - "Activity-sensitive; request volume, take-rate, asset-class, and client cohort splits"
      - - Investment banking
        - Advisory and underwriting mandates
        - "92 transactions and $99B transaction value in 2025"
        - Company claimed
        - "Deal activity is not revenue; request recognized fees, backlog, and mandate win rates"
      - - Prediction-market services
        - Trading access, clearing, settlement, block trading, and ETF swap solutions
        - Launched with Kalshi in May 2026
        - Company claimed
        - "Early revenue surface; request volumes, pricing, capital usage, and counterparty economics"
      - - Private-markets research
        - Research delivered within client accounts
        - Launched in August 2026
        - Independently reported
        - "Monetization not disclosed; determine whether paid, bundled, or acquisition-led"
    notes: >-
      Values retain the source periods and metric labels. The 70/30 split is
      Sacra's 2024 characterization; product launches disclose no revenue or margin.
    claimRefs:
      - CI005
      - CI006
      - CI014
      - CI015
      - CI016
  - id: TI002
    title: Pricing and monetization disclosure
    columns:
      - Offering
      - Likely billing unit supported by evidence
      - Public price or realized rate
      - What is known
      - Required diligence
    rows:
      - - Financing
        - Spread or fee on funded balances and securities lending
        - Not disclosed
        - Financing is the largest reported stream
        - Obtain benchmark curves, client yields, funding costs, rebates, and net spread
      - - Execution and clearing
        - Transaction or activity-based fee
        - Not disclosed
        - Transaction revenue is separately described
        - Obtain rate cards, realized take rates, rebates, discounts, and minimum commitments
      - - Investment banking
        - Advisory or underwriting fee
        - Not disclosed
        - 2025 mandate count and transaction value are public
        - Reconcile gross deal value to recognized fees, expenses, and contribution margin
      - - Kalshi-related services
        - Clearing, settlement, block-trading, or swap economics
        - Not disclosed
        - Service scope is public
        - Obtain launch volumes, pricing schedules, collateral needs, and counterparty exposure
      - - Private-markets research
        - Subscription, bundled service, or acquisition tool
        - Not disclosed
        - Research is available inside client accounts
        - Confirm packaging, paid seats, attach rate, retention impact, and analyst cost
    notes: >-
      The assigned evidence contains no list or realized pricing. Billing-unit
      descriptions are mechanism-level interpretations, not reported price points.
    claimRefs:
      - CI005
      - CI006
      - CI014
      - CI015
      - CI016
  - id: TI003
    title: Public unit-economics inputs and underwriting gaps
    columns:
      - Metric
      - Reported value
      - Period and denominator
      - Confidence
      - Why it matters or diligence ask
    rows:
      - - Revenue
        - "$463.6M"
        - FY2024 accounting revenue
        - Medium
        - Establishes scale; reconcile to audited statements and stream detail
      - - Net income
        - "$89.1M"
        - FY2024 accounting net income
        - Medium
        - Profit is not cash flow; request cash conversion and regulatory-capital movement
      - - Revenue
        - "$783.7M; 160% YoY growth"
        - Nine months ended September 30, 2025
        - Medium
        - Tests acceleration; reconcile period comparability and one-time items
      - - Net income
        - "$157.2M"
        - Nine months ended September 30, 2025
        - Medium
        - Request tax, credit, mark-to-market, and cash-flow bridges
      - - Interest-bearing client balances
        - "More than $17.2B"
        - September 30, 2025 balance
        - Medium
        - Request concentration, tenor, collateral, funding, and net-yield detail
      - - Operating activity
        - "More than 2,000 clients; $31.3B daily trading activity"
        - September 2025; client definition not disclosed
        - Medium
        - Reconcile active versus contracted clients and revenue per cohort
      - - Headcount
        - "830, up from 773"
        - 2026 company snapshot
        - Medium
        - Request compensation, productivity, and function-level allocation
      - - Outstanding debt
        - "$300M after a $78.5M note issuance"
        - January 2026
        - Medium
        - Obtain maturities, rates, covenants, collateral, and entity-level guarantees
    notes: >-
      All values are public reported or company-claimed snapshots. No CAC,
      payback, gross margin, cash balance, burn, runway, or free-cash-flow value
      was available in the assigned evidence; nulls are not estimated.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI007
      - CI008
      - CI009
      - CI010
      - CI012
