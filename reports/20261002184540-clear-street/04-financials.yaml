callouts:
  - calloutType: risk
    title: Financing concentration is the central earnings sensitivity
    body: >-
      With roughly 70% of 2024 revenue attributed to net financing, underwriting
      depends on net spreads, client leverage, securities-lending demand, and
      balance retention. Reported growth alone cannot establish durability
      without rate and balance sensitivity schedules.
    claimRefs:
      - CI005
      - CI007
  - calloutType: recommendation
    title: Require cash, margin, and concentration schedules before underwriting
    body: >-
      Obtain audited balance sheets and cash-flow statements, unrestricted and
      regulatory cash, debt terms, stream-level gross margins, realized pricing,
      client concentration, CAC and payback, and stress tests for rates and
      activity. Do not infer runway from reported funding or net income.
    claimRefs:
      - CI003
      - CI004
      - CI009
      - CI010
