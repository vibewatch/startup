companyProfile:
  summary: >-
    Clear Street
    成立于2018年，总部位于纽约市，是一家处于发展后期的未上市资本市场基础设施企业。公司将云原生清算、托管、执行、保证金融资与证券借贷，同私募市场研究、事件合约服务及主动交易工具等新兴衍生产品融为一体。公司报告拥有700+家机构客户与约$16
    billion客户资产余额；但因审计报告、现金流细节以及经优先权调整的融资条款均未公开，其财务成色与估值难以准确厘定。
