              million）归结为净融资收入，约30%（即$137
              million）归为交易收入。该收入结构可受益于客户资产余额扩大与交易活跃度提升，但也导致收入质量极易受利差波动、融券借贷需求、客户杠杆水平及交易量影响。会计营收不可混同为
              ARR，且由于所给证据未提供现金流量表或资产负债表，会计利润亦无法佐证现金流生成能力。
