            body: >
              自2018年创立以来，Clear Street 清算与执行平台的商业化拓展大幅增长。官方平台指标显示，该平台服务700+家机构客户，托管约$16
              billion客户资产余额，日均清算约5.5亿股，日均名义交易额达~$28.4
              billion。得益于机构客户入驻提速，以及覆盖股票、期权、期货、固定收益、场外衍生品与数字资产的跨品类清算能力上线，公司报告交易量同比增长94%。独立第三方数据追踪机构 GetLatka 报告 Clear
              Street 于2025年实现营收$101.9 million，高于2023年披露的$56.4 million。然而，GetLatka 采用 SaaS ARR 指标评估 Clear
              Street，而非沿用经纪自营商适用的净息差与融资利差模型，突显出公开披露数据在真实账户留存率、净金额留存率 (NRR) 和总金额留存率 (GRR) 上的持续缺失。为进一步突破机构圈层迈向个人财富客群，Clear
