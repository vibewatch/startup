      - number: '7.2'
        title: 监管合规与法律存续
        blocks:
          - type: paragraph
            body: >
              Clear Street 官方合规页面列明了 FINRA 会员资格、CFTC 期货佣金商登记与 NFA 会员资质，以及在 SEC 完成的基于证券的掉期交易商登记 (CR001, CR002,
              CR003)。上述资质仅证明其处于广泛的监管覆盖范围之内，无法佐证其各项法定义务均通过了独立检验，亦不代表其拥有清白的执法处罚记录。其客户保护救济机制同样存在上限：Clear Street 称 Lloyd's
              超额 SIPA 险提供明确的单账户保额与$250 million总限额 (CR004)。发行人新闻稿进一步显示，Clear Street 于2026年5月对 Forum Markets
              启动股票研究覆盖，增添了执业操守、信息披露与利益冲突风控等层面的尽调核查点；该稿件本身并未证明存在违规
              (CR014)。现有材料库不包含监管机构出具的检查意见、法院判令记录、违规处分历史或独立审计核验的资本储备数据。在将相关牌照注册与保险披露作为完整法律风险评估依据之前，必须调取上述核验记录。
            claimRefs:
              - CR001
              - CR002
