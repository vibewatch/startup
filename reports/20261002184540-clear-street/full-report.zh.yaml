              Clear Street 在现代资本市场中呈现混合业务姿态。其核心商业引擎仍是面向对冲基金和经纪自营商的机构清算、托管与融资基础设施；但近期进军 Pre-IPO SPV 银团分销、个人主动交易应用以及原生 AI
              零售助手 (Omni) 的战略举措，表明其向高毛利主动交易散户工作流的多元化扩张诉求 (CO004, CO007, CO008, CO014)。
