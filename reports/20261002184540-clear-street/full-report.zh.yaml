  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、覆盖范围与现状替代品
        blocks:
          - type: paragraph
            body: >
              Clear Street 布局于资本市场基础设施与主经纪生态系统。公司核心运营边界涵盖股票、期权、期货及固定收益品类的主经纪融资、证券借贷、交易执行、清算、托管及交易后结算。以50年历史的 COBOL
              清算系统为主的老旧大型机架构，构成了传统主经纪商和托管银行固守的既有格局。Clear Street
              以单一体化实时账本为核心的云原生平台取代该碎片化架构，将执行、清算与风险管理整合入单一技术栈。该市场所纳支出来源包括对冲基金、持牌经纪自营商、自营交易公司及高频主动交易账户支付的机构主经纪保证金利息、证券借入费用、交易执行佣金、托管管理费及清算费用。此边界明确排除散户财富管理咨询费、个人储蓄银行、传统商业贷款及被动智能投顾资产管理费。相邻市场机遇则涵盖投资银行咨询服务、股权资本市场承销、数字资产现货交易基础设施，以及事件驱动型预测市场的清算服务。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
