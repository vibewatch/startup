        blocks:
          - type: paragraph
            body: >
              重大机构合作、公开承销业务以及合规市场准入印证了其经过核实的商业采纳成效。2026年5月，Clear Street 宣布与受联邦监管的预测市场交易所 Kalshi 达成里程碑式战略合作，成为首家入驻 Kalshi
              交易所与清算所的机构期货佣金商 (FCM)。依协议约定，Clear Street 提供受监管事件合约的 24/7 机构交易通道，借助大宗交易开展大规模风险转移，并向发行预测市场产品的 ETF
              发起人提供清算、结算与掉期交易台解决方案。在企业融资领域，Clear Street 投行部已累计为超$2.35 billion资本市场交易提供顾问服务，担任 Renatus Tactical
              Acquisition Corp (Nasdaq: RTACU) 和 Digital Asset Acquisition Corp. (Nasdaq: DAAQU) 等特殊目的收购公司 (SPAC)
              的联席账簿管理人及顾问。此外，Clear Street Group Inc. 提交 SEC 的 S-1 承销协议显示出与全球投行的深度机构银团合作，除 Clear Street LLC 外，Goldman
              Sachs、BofA Securities、Morgan Stanley 及 UBS Securities 均列席代表承销商，并设有面向公司关联参与者的定向配售计划 (Directed Share
              Program)。
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
              - CU012
