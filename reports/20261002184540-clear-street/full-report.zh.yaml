      - number: '8.4'
        title: 退出成熟度、尽调清单与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              在现有保留证据中，公司退出成熟度未经证实。Sacra称公司此前正筹备2026年公开上市，Multiples亦提及最早或于2026年挂牌；但截至尽调基准日，并无信源确认已完成交表申报、定价或正式挂牌。在做出投资决策前，须获取2026年融资协议原文、完全稀释后股权结构表、清算优先权条款、高级票据条款、2024至2025年审计财报、监管资本明细表以及客户与融资余额集中度明细。转为看多决策的前提包括：厘清估值与收入口径、验证跨利率周期的稳健盈利能力、以及明确可信的流动性退出路径。论点失效的触发条件涵盖：客户资产余额或日均名义交易量持续萎缩、融资业务经济效益显著恶化、触碰监管资本红线、现行估值分歧无法调和，或新一轮融资的优先权利导致表面估值失真。
            claimRefs:
