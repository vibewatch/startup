chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、现代架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Clear Street 于2018年9月在纽约成立，定位为机构级金融基础设施提供商与主经纪商，旨在以现代云原生清算与托管引擎取代传统主机系统 (CO001, CO002,
              CO004)。公司面向对冲基金、专业交易员、机构投资者及成熟个人市场参与者，提供跨资产清算、托管、执行、证券借贷与保证金融资服务 (CO001, CO004, CO007)。除机构主经纪业务外，Clear
              Street 还推出 Clear Street Private Markets，自 Databricks 起为合格投资者提供 Pre-IPO 特殊目的载体 (SPV) 敞口；同时依托集成 AI
              交易工具的自研桌面端与移动端应用，扩展零售客群的主动交易能力 (CO007, CO008, CO014)。透明的阶梯式股票成交量定价、期权佣金以及挂钩基准利率的融资费用，构成了其覆盖资本市场全工作流的变现基石
              (CO015)。
