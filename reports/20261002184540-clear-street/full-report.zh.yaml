  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Clear Street 自 2018 至 2026 年在公司创立、融资轮次、监管扩张、平台收购及管理层重组方面的时间线演进。
    data:
      items:
        - label: 公司创立
          date: 2018-09
          detail: Clear Street 在纽约创立，旨在为现代资本市场搭建云原生清算与托管基础设施。
        - label: 清算经纪自营商展业
          date: 2018-12
          detail: 作为 FINRA 与 SIPC 注册清算经纪自营商正式展业。
        - label: 首笔美股交易清算
          date: 2019-08
          detail: 完成美股市场首笔交易执行处理，确立核心订单处理能力。
        - label: 收购 CenterPoint Securities
          date: 2020-07
          detail: 收购专业主动交易平台 CenterPoint Securities，拓展客户分销网络。
        - label: 上线 ATLAS 券源定位系统
          date: 2022-11
          detail: 推出 ATLAS 自动化证券借贷与券源分配平台，服务卖空交易客户。
        - label: B 轮融资扩融
          date: 2023-04
          detail: 完成由 Prysm Capital 领投的 $270M B 轮增资，投后估值 $2.0B。
        - label: 收购 REACT 期货清算平台
          date: 2023-07
          detail: 收购云原生期货清算平台 REACT，将业务拓展至多资产场内衍生品领域。
        - label: C 轮融资与提交 IPO 申请
          date: 2026-01
          detail: 完成由 Baillie Gifford 领投的 $135.4M C 轮融资，估值 $12B，并提交初步 S-1 文件。
        - label: 暂缓 IPO 推进
          date: 2026-02
          detail: 秘密递交 S-1 申请后暂停首次公开募股计划，转向发力私募市场拓展。
        - label: 高管领导层交接
          date: 2026-05
          detail: Ed Tilly 宣布辞去 CEO 职务；创始人 Uri Cohen 重任首席执行官。
        - label: 布局私募市场与推出 Databricks SPV
          date: 2026-07
          detail: 推出 Clear Street Private Markets，以 Databricks 为起点为高增长科技企业提供 Pre-IPO 份额认购渠道。
