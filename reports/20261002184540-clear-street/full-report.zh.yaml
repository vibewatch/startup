              - CM014
              - CM015
      - number: '2.4'
        title: 图表展示
        blocks:
          - type: callout
            title: 云原生账本架构破除传统巨头生态锁定
            body: >
              传统主经纪商与托管银行仍受困于沿用数十年的大型机系统，结算往往依赖耗时数日的批处理对账。Clear Street
              的云原生单一体化实时账本把机构接入压到14天，并实时计算风险，帮助公司吸引一线机构服务不足的新兴对冲基金与高交易量市场参与者。
            calloutType: insight
            claimRefs:
              - CM002
              - CM013
              - CM014
          - type: callout
            title: 高资本消耗与严监管审查制约规模扩张
            body: >
              作为跨资产清算机构运营，需持有庞大资本储备、维持合规净资本并承担清算所保证金义务。资产负债表与交易规模的快速扩张，势必推高 SEC、FINRA 和 CFTC
              辖区下的监管敞口，使得风控把控与合规审查成为争夺市场份额的关键瓶颈。
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局、巨头护城河与市场替代方案
        blocks:
          - type: paragraph
            body: >
              Clear Street 处于机构主经纪业务与现代交易后清算基础设施交汇点，直面四类截然不同的市场替代竞争对手。首要竞争阵地由老牌华尔街投行主经纪商主导——尤其是 Goldman Sachs、Morgan
              Stanley、JPMorgan 与
              UBS。这些巨头凭借雄厚资产负债表、深厚百年机构关系、广泛信贷额度以及全面的跨资产资本市场承销分销网络，牢牢掌控机构主经纪高端市场。上述老牌托管银行运行于数十年累积的陈旧系统，频繁依赖50年历史的 COBOL
              大型机与碎片化批处理对账，导致长达数月的入驻周期与严苛的最低资产门槛。为此，Clear Street 聚焦新兴与中型对冲基金、自营交易台以及被大型投行忽视、边缘化或清退的持牌经纪自营商。在传统投行之外，Apex
              Clearing 与 DriveWealth
              等独立云原生清算平台在现代执行与清算能力上直接竞逐，不过其历史重心主要集中于零售金融科技经纪商，而非全功能机构主经纪融资。另一重结构性竞争来自金融科技软件与交易后处理服务商（以 Broadridge 和 SS&C
              为代表），它们向经纪自营商输出 SaaS 外包清算模块；此外，CME 与 ICE 等垂直整合型衍生品交易所亦在积极寻求直通清算授权。最后，经纪自营商自建系统以及独立执行管理系统
              (EMS)、专有融券借贷平台等专项单点方案，构成机构交易机构规避供应商锁定而长期沿用的既有替代品。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 架构能力、平台工作流与功能权衡
        blocks:
          - type: paragraph
            body: >
              对清算与主经纪能力的尽调表明，传统托管架构与现代 API 优先平台之间存在显著架构分歧。Clear Street 的差异化优势立足于统一主经纪工作台
              Studio，以及单一体化云原生实时账本，将订单执行、跨50+流动性场所的智能订单路由、持续投资组合保证金计算、融券券源寻券 (Stock Loan Locates)
              和托管汇总至集成环境。相较传统主经纪商隔夜批处理对账，Clear Street 基础设施以99.997%可靠性执行直通式处理 (STP)，向量化交易团队及基金经理实时呈现即时购买力变动与风控分析。平台采用 API
              优先设计，提供 REST 与 WebSocket 接口，辅以由 gRPC、PostgreSQL 和 Redis
              支撑的微服务，帮助算法交易者跑通盘前风控核查与自动化寻券工作流。然而，显著能力差距与功能取舍依旧存在。老牌投行在全市场执行广度、固收与外汇深度流动性池，以及依托旗下机构资管业务获取的充沛融券券源方面，仍具压倒性优势。面向零售的清算机构如
              Apex Clearing 与 DriveWealth 虽擅长碎股交易、自动化微投资 API 及海量散户快速入驻，却缺乏对冲基金所必需的复杂投资组合保证金模型、合成掉期交易台与定制机构风控架构。Clear
              Street 为中型机构填补了该空白，但受制于较小资产负债表体量，无法匹敌全球性投行数万亿美元的融资规模。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
