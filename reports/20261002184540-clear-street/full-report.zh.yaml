      - number: '1.3'
        title: 资本化概况、估值分歧与规模轨迹
        blocks:
          - type: paragraph
            body: >-
              Clear Street 的资本化路径表现为密集的一级市场融资轮次，以及独立二级市场与追踪数据库之间显著的估值分歧。公司备案与官方披露显示累计融资$1.0 billion；风险投资追踪机构 Tracxn
              则记录为6轮共计$649 million；私募证券平台 Forge Global 报告累计融资$885.47 million，最新一笔为2026年1月完成的$135.39 million C轮融资 (CO004,
              CO006, CO012, CO013)。在 Baillie Gifford、SBI Holdings、Prysm Capital 和 IMC Investments 等机构投资者支持下，私募轮次估值由 B
              轮各期的$2.0 billion至$2.1 billion跃升至2026年初的$12 billion (CO006, CO008, CO012, CO013)。然而，在2026年1月完成机密或初步 S-1
              申报准备后，因市场环境波动，Clear Street 于2026年2月正式搁置 IPO 计划，将近期资金重新投向私募市场基础设施、加密资产布局以及核心清算能力建设，服务全球超700家机构客户与830名员工
              (CO004, CO005, CO008, CO012)。
            claimRefs:
              - CO004
