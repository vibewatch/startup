        - 若公开估值依赖向投资者倾斜的优先清算权或不可比营收，则予以否决
      - - 基准
        - 当前估值分歧得以调和；营收保持在接近披露的 2025 年规模；融资业务集中度在可控范围
        - 来自 Tracxn 与 Sacra 的估值约 $8.2B-$11B；非模型测算区间
        - 在获取融资文件与正常化盈利数据前保持中性
        - 若估值、轮次规模或证券条款无法核对一致则暂停建仓
      - - 悲观情形
        - 收入质量恶化、客户余额或杠杆收缩、或融资利差收窄
        - 2023年4月融资参考估值 $2B；非估值下限或当前公允价值
        - 若增速放缓获证实、监管资本承压或私募轮次出现压力，概率上升
        - 若规模持续收缩或出现清算优先权调整后的降价轮条款，投资逻辑被打破
    notes: 估值区间系不同日期与口径的公开源引用，非财务预测；无法基于现有公开凭证计算发生概率与投资者回报率。
    claimRefs:
      - CV001
      - CV003
      - CV004
