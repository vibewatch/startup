  - id: FU001
    title: 客户旅程全景图：机构客户入驻、多资产拓展与留存飞轮
    type: journey-map
    summary: 展示机构客户从清算迁移、多资产产品拓展到交叉销售循环的完整生命周期。
    data:
      items:
        - label: 阶段一：基础设施调研与尽职调查
          detail: 对冲基金、量化交易团队及经纪自营商评估采用现代清算方案替代传统 COBOL 大型主机的可行性。
          touchpoints:
            - 针对实时保证金账本与云原生直通式处理展开高管推介
            - API 延迟、FIX 连接能力与交易执行性能技术评估
            - 信用评估、监管资本核验与保证金融资条款审查
        - label: 阶段二：平台集成与账户接入
          detail: 交易对手方建立账户体系、划入托管资产并配置交易接口。
          touchpoints:
            - 在 FINRA 与 CFTC 注册实体下开设托管与清算账户
            - API 密钥生成、风险限额校准与交易台权限配置
            - 初始保证金抵押品、现金存款及投资组合资产划转
        - label: 阶段三：核心执行与证券借贷应用
          detail: 客户在股票与期权市场执行日常高频交易流，并调用证券借贷可融券源。
          touchpoints:
            - 借助智能订单路由与自动化清算执行大额订单
            - 利用证券借贷交易台满足卖空与难借券融券需求
            - 实时监控投资组合风险并自动完成日终保证金结算
        - label: 阶段四：多资产扩张与衍生品掉期
          detail: 客户通过接入新资产类别、期货清算及定制衍生品掉期，提升在平台的钱包份额。
          touchpoints:
            - 机构期货佣金商 (FCM) 接入 Kalshi 交易所合规预测市场
            - 为 ETF 发行人及机构宏观风险转移提供掉期柜台交易执行
            - 数字资产现货交易与加密基础设施集成
        - label: 阶段五：资本市场顾问与生态深度绑定
          detail: 成熟客户进一步使用企业投资银行、资本对接及 Pre-IPO 私募市场服务。
          touchpoints:
            - 承揽企业融资、并购及 SPAC 上市的投资银行委托
            - 参与私募二级市场 SPV 及辛迪加联合投资
            - 业务流程深度嵌入，构建针对传统方案的高昂迁移壁垒
        - label: 阶段六：长期流动性沉淀与交易对手方留存
          detail: 长期交易对手方在全球交易场所持续扩大多资产沉淀余额，提升跨清算保证金使用效率。
          touchpoints:
            - 统一优化股票、期货、掉期及加密资产余额保证金使用效率
            - 联合机构交易场所与上市 ETF 发起人共同开发产品
            - 持续开展日常运营监控与交易对手方合规审计核查
