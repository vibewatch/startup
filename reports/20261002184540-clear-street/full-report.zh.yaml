      - number: '6.4'
        title: 客户留存隐患、法律诉讼与隐私顾虑
        blocks:
          - type: paragraph
            body: >
              尽管客户体量迅速攀升，Clear Street 仍面临严峻的交易对手方、公司治理及客户稳定性风险。在纽约南区联邦地区法院审理的诉讼案中 (Batanjany et al. v. Clear Street
              Management LLC et al.，2026年6月)，来自 Clear Street 衍生品与证券借贷交易台的四名前 FINRA 注册经纪人员就重大运营与客户隐私问题提供宣誓证词。包括衍生品运营主管
              Jordan Brodsky 在内的前员工宣誓作证称，包括 CCO Andy Volz 在内的高管曾指示员工将保密客户数据传输给首席执行官 Uri Cohen 名下的私人家族投资公司 White
              Bay。前衍生品业务 CEO Patrick Travers 与董事总经理 Cory Solomon 证实，内部曾就客户隐私、保证金要求、合同更替 (Novation) 合规、Regulation SHO
              下的融券借贷披露，以及对提出《1940年投资公司法》基金托管异议人员的解雇问题多次拉响内部警报。2025年9月，七名衍生品专业人士集体辞职跳槽至竞对 Hidden Road Partners，引发 Clear
              Street 报复性提交“因故开除”的 Form U-5 备案；联邦地区法官 Analisa Torres
              认定存在非法报复可能并签发禁令予以制止。这些宣誓举证披露暴露出深刻的客户信任危机、潜在监管处罚与员工流失风险，对机构交易对手留存及主经纪合作稳定性构成直接威胁。
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 纽约南区法院诉讼宣誓举证暴露出客户信任脆弱性
            body: >
              在联邦法院 (Batanjany v. Clear Street Management LLC) 的宣誓证词指出高管授意将客户交易数据转交关联家族办公室 (White
              Bay)，从而引发尖锐的机构信任与合规危机。在主经纪业务中，涉及交易策略、借券需求与持仓规模的客户保密性至关重要；若依据 SEC 与 FINRA
              规则认定存在隐私泄露违规或遭监管处罚，可能触发机构客户成批出走，倒戈转投 Hidden Road Partners、Interactive Brokers 或华尔街一线大行等竞对主经纪商。
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
          - type: callout
            title: 首发卡位预测市场 FCM 资质撬动战略性资产扩张
            body: >
              Clear Street 通过与 Kalshi 合作成为首家机构 FCM 清算会员，开辟了创新的获客通道。凭借将机构对冲基金、做市商及 ETF 发行人接入受监管事件合约，Clear Street
              使其清算特许业务与传统主经纪商形成鲜明差异化，同时在非相关新兴资产类别中赚取高利润率的掉期交易台费用与清算费用。
            calloutType: insight
            claimRefs:
