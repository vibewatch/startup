              - CR013
      - number: '7.4'
        title: 财务模型与执行门槛
        blocks:
          - type: paragraph
            body: >
              公开规模数据尚不足以量化损失吸收能力或资金跑道。Clear Street 称其已融资$1.0 billion，但融资总额不等同于可用现金、监管资本或实际流动性 (CR006)。同理，约$16
              billion的客户资产余额仅衡量平台托管的客户资金规模，而非公司自有现金或权益资本 (CR005)。Latka 报告其2025年营收为$101.9
              million，但底层来源明确标注为“未记录”，故该数据仅具弱参考价值，不可视作可供审计的财务基准 (CR015)。执行复杂性则更为直观显现：Clear Street
              报告2026年间员工人数从773人增至830人，管理层发生人事调整，并同步推进零售交易应用、加密货币现货交易、预测市场合作以及筹备中跨地域和跨品类扩张 (CR010,
              CR011)。因此，投后监测方案应严格要求提供审计营收与资本金、客户与对手方集中度、信贷坏账损失、欺诈损失、流动性压力测试结果、核心系统分项可用率及新业务上线事故明细。若未能提供上述指标，或指标恶化超出董事会核定限度，应立即暂缓投资。
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 投资逻辑破损条件
            body: >
              出现重大牌照受限、客户保护或资本金缺陷、无法恢复的关键服务中断、账本头寸未平调对账不符，或发生管理层无法在董事会规定期限内整改的实质内控失效时，应立即终止投资。在监管记录、鉴证报告、资本金数据或事故记录依然缺失的情况下，应审慎暂缓评估，切勿盲目推定为安全。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR007
              - CR016
          - type: callout
            title: 财务风险证据未达决策级标准
            body: |
              融资总额、客户资产余额与第三方估算营收分属完全不同的统计维度。上述指标均无法确立当前的可用现金、监管资本、风险吸收厚度、现金消耗率或资金跑道；在测算财务模型风险之前，必须调取经审计财务报告与监管资本专项报告。
            calloutType: assumption
            claimRefs:
              - CR005
              - CR006
              - CR015
  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 决策与融资依据
        blocks:
          - type: paragraph
            body: >-
              投资建议：进一步研究/持续跟踪，置信度中偏低，风险高，且现有公开记录无法支撑明确的入场估值。最具参考价值的历史锚点是2023年4月的第二笔交割：Clear Street与TechCrunch均报道获得$270
              million投资、Series B总额达$435 million且估值为$2.0 billion；TechCrunch与Multiples还将2022年5月的第一笔交割估值定在$1.7
              billion。当前证据的分歧显著扩大。Multiples报道2026年1月战略轮估值为$12 billion，Sacra报道2026年1月Series C后隐含估值约$11
              billion，Tracxn则记录截至2026年2月12日估值为$8.2
              billion。各方在轮次名称、融资规模、交割日期及估值数据上均存在差异，且所引来源均非2026年一手融资文件。上述分歧导致无法给出精确的入场定价、目标回报率、持有期或退出预测。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV015
