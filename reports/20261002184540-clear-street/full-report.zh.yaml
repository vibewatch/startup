      - number: '2.2'
        title: 目标市场规模、交易量与增长轨迹
        blocks:
          - type: paragraph
            body: >
              资本市场基础设施每日承载全球金融市场数万亿美元交易价值与数十亿笔交易往来。Clear Street 的核心目标市场立足于高交易量的美股及衍生品交易处理与融资。Clear Street
              平台上的机构客户平均资产余额约为$19.4 billion，美股日均交易量达$33.6 billion，约占美股全市场交易总量的3.4%。除核心主经纪业务外，新兴相邻市场提供了可观的增量扩张路径。Clear
              Street 研究预测，预测市场交易领域到2030年潜在市场总规模达$14 billion，年交易量预计达$1.2 trillion，远高于2025年约$47 billion的交易量和$440
              million的收入。测算制约因素在于，机构主经纪业务收入高度依赖全市场波动率、融券借贷需求以及保证金余额适用利率。鉴于一线托管银行普遍采取捆绑财报口径，纯云原生主经纪业务的独立规模测算仍受一定限制。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
