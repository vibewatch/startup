            body: >
              Clear Street
              锁定其交易频次、跨资产策略或资金规模需求未获传统主经纪系统充分满足的成熟金融市场参与者。公司将客群细分为六大核心买方与对手方类别：机构对冲基金、量化与算法交易团队、做市商及专业交易公司、转介经纪自营商
