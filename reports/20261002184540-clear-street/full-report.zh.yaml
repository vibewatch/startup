      - number: '7.3'
        title: 运营、安全与外部依赖敞口
        blocks:
          - type: paragraph
            body: >
              架构高度集中构成核心运营风险。Clear Street 披露其拥有覆盖清算、托管与风控的单一自研云原生账本；竞对发布的分析文章则指出该平台依托 AWS 弹性算力运行 (CR007,
              CR009)。共享账本虽可降低对账损耗，但也使得灾备恢复指标、数据一致性、跨区域故障转移及供应商退出预案成为事关投资决策的关键考量。Clear Street
              将数据加密、访问权限控制、持续监控、标准化应急响应、安全开发及供应商评估列为内控举措 (CR008)；但所给证据中未见任何独立鉴证报告或灾难恢复演练成果。Lloyd's
              保单引入了额外的交易对手与续保依赖风险；Büro 案例研究则指明公开官网由第三方机构落地搭建，不过该来源并未表明该服务商与核心经纪系统存在关联合同 (CR004,
              CR013)。尽职调查应当将低关键度的营销层依赖，与云计算、清算、托管、保险及市场准入等核心依赖严格区分。
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR009
              - CR013
              - CR016
