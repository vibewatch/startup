      - number: '2.3'
        title: 买方客群细分、采纳驱动因素与结构性约束
        blocks:
          - type: paragraph
            body: >
              Clear Street 的主要买方客群包括新兴及中型对冲基金、自营交易团队、持牌做市商、机构经纪自营商以及成熟的高频零售交易者。对冲基金与自营交易团队通常由首席运营官 (COO)、首席技术官 (CTO)
              或交易主管担任核心预算负责人和决策者。传统主经纪商的结构性限制驱动了客户采纳，痛点包括苛刻的资金门槛、冗长缓慢的准入入驻周期、不透明的融券券源库存，以及碎片化跨多日结算对账。Clear Street
              依托云原生技术破局，约14天即可完成机构客户入驻，并提供兼具高速执行与实时风控的支持。然而，关键采纳约束依然存在，包括高昂的机构迁移成本、大型基金对多元主经纪商模式的深度依赖、来自 FINRA、SEC 与
              CFTC 的严苛监管审查，以及维持清算保证金与客户融资所需的极高资本消耗。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM012
