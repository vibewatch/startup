  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 风险态势排序
        blocks:
          - type: paragraph
            body: >
              影响程度最大的风险敞口集中在监管合规延续性、客户资产保护和平台可用性。Clear Street 表示其支撑约$16
              billion客户资产余额，其清算页面报告单一体化云原生账本在2025年达到超99.9%的直通处理率，并在交易量突发翻倍期间维持约99.95%可用性（均为公司自测数据）(CR005,
              CR007)。这些指标反映出运营规模和特定受测区间的表现，但并不能保证其在各类极端压力情景下的稳健度。所给证据还显示其业务版图持续扩大，且在2026年集中上线多款产品，加剧了变更管理压力 (CR010,
              CR011, CR012)。因此，风险热力图依据披露的业务活跃度与资产规模评估影响级别，但在证据库缺乏独立故障记录与第三方鉴证测试的情况下，将发生概率标注为未知
              (CR016)。投资逻辑破损的判定标准应锚定牌照吊销或受限、客户保护机制缺陷、无法恢复的关键系统宕机，或业务扩张失控超出资本与内控承载能力的切实证据，而非采信从未发生故障这种缺乏依据的主张。
            claimRefs:
              - CR005
              - CR007
              - CR010
              - CR011
              - CR012
              - CR016
