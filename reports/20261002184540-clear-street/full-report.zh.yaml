      - number: '3.4'
        title: 图表展示
        blocks:
          - type: callout
            title: 中端市场切入点突破传统巨头资产负债表非对称劣势
            body: >
              华尔街大行虽坐拥万亿美元级超大基金难以企及的庞大资产负债表，但其僵化运营架构致使新兴及中型资管机构严重缺乏有效支持。Clear Street
              凭借现代化技术栈与14天敏捷入驻，构建起强有力的切入点，牢牢吸纳追求敏捷响应的主经纪客户，并以此作为跨资产扩张的核心跳板。
            calloutType: insight
            claimRefs:
              - CP002
              - CP007
              - CP013
          - type: callout
            title: 多头开户与老牌对手报复性定价威胁客户留存
            body: >
              机构对冲基金极少单一依赖某家主经纪商，普遍采取多头开户以分散交易对手方风险。一旦老牌大行升级陈旧基础设施，或针对中型基金选择性压低保证金借贷利率，Clear Street
              将面临高毛利融资余额流失风险，除非其能持续拓宽券源库存与资产类别覆盖范围。
            calloutType: risk
            claimRefs:
