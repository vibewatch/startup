      - number: '8.3'
        title: 情景推演与可比公司参照
        blocks:
          - type: paragraph
            body: >-
              情景推演应依托实际观测锚点，而非凭空预测。乐观情形（Bull）：$12 billion估值获一手文件确认，经审计业绩印证Multiples记录的$940
              million当期年化收入或Sacra估算的2025全年$1.04 billion收入，且客户资产与交易量持续增长。基准情形（Base）：估值在Tracxn与Sacra给出的约$8.2 billion至$11
              billion区间内达成一致，并披露具体证券条款及常态化盈利数据。悲观情形（Bear）：若收入质量恶化、客户余额流失或融资息差收窄，估值或回落至2023年融资的$2.0
              billion参考基准；该历史价格仅供参考，不构成估值下限或公允价值估算。Multiples列出StoneX、Virtu、Groww、XP、FalconX与Wealthsimple作为可比标的，但因业务结构差异明显且数据混杂不同财年周期，仅具方向参考价值，无法支撑可比公司倍数估值法。
