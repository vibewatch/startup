      - number: '3.3'
        title: 定价格局、迁移摩擦与护城河持久度
        blocks:
          - type: paragraph
            body: >
              主经纪行业的定价结构与迁移经济学植根于资产负债表息差，而非透明的软件授权许可费。Clear Street
              约70%收入来自净融资业务（包括保证金借贷利差、融券借贷费用及现金管理收益），其余30%来自交易执行佣金、综合清算费及资本市场顾问费。大型投行竞对采取捆绑式、关系驱动型定价模型，基于总托管资产、主经纪资金沉淀及投行业务往来协商保证金利率与执行成本，从而形成独立清算商在缺乏资产负债表规模支撑下难以匹敌的交叉补贴价格。与之相反，零售清算平台则依靠单账户清算费、订单流分成
              (PFOF) 与碎股托管费变现。该市场中的机构迁移成本构成保护老牌巨头的深厚竞争护城河：更换主经纪商需迁移复杂的监管备案、在 DTCC/NSCC 缴纳新清算保证金、重签 ISDA
              及主经纪保证金协议、转托管跨资产抵押品，并对运营团队展开新界面培训。因此，机构多头开户 (Multi-homing) 极为普遍；对冲基金通常维持与华尔街大行的核心合作，同时将 Clear Street
              作为辅助或特色主经纪商，用于融券困难 (Hard-to-borrow) 股票借贷、快速入驻或高频算法交易执行。Clear Street
              的长期护城河持久度取决于：在维持技术迭代速度与监管合规的同时，激进扩充生息客户资产规模，以抵御老牌巨头系统现代化与激进价格竞争。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
