      - number: '1.2'
        title: 高管人事更迭与治理架构
        blocks:
          - type: paragraph
            body: >-
              Clear Street 由 Sachin Kumar、Chris Pento 以及执行董事长 Uri Cohen 联合创立。在 Ed Tilly 依计划自管理层退休后，Uri Cohen
              于2026年6月1日重新出任首席执行官 (CO002, CO003, CO009, CO010)。在 Tilly 担任 CEO 的两年任期内，公司向北美、欧洲与亚洲推进国际化扩张，跨过$1.0
              billion年化营收门槛，并大幅加快多资产产品迭代速度；此后 Tilly 转任顾问职务并保留董事席位 (CO003, CO009)。随后，高管梯队于2026年7月完成内部晋升重组，任命 Andy Volz 与
              John DiBacco 为联席总裁，Megan Cruse 为首席运营官，Jon Daplyn 为首席技术官，Michael Stover 为首席人才与绩效官 (CO005,
              CO011)。此项治理安排重新整合运营、技术与商业领导层，兼顾机构主经纪业务增长与主动交易业务扩张 (CO005, CO011)。
            claimRefs:
