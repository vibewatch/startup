      - number: '8.2'
        title: 核心论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              投资论点在于公司业务规模自2023年融资以来大幅跨越。Clear Street目前宣称已募集$1.0 billion资本，服务逾700家机构客户，客户资产余额约$16 billion，日均名义交易量约$28.4
              billion，且交易额同比增长94%。公司还于2026年7月披露拥有830名员工，招聘页面另载有逾800名员工。反向论点在于现有收入数据源自分析师估算而非审计报告，且对市场行情高度敏感：Sacra估算其2025年收入为$1.04
              billion，并指出净融资收益占2024年收入约70%。这种高度集中意味着估值支撑依赖客户余额、杠杆倍数、利差与基准利率，而非纯粹的订阅制SaaS软件模式。因此，规模扩张固然夯实了公司质地，却未解决入场定价纪律问题。
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
