            body: >-
              Clear Street 从底层自研构建端到端资本市场基础设施，旨在彻底替代统治传统主经纪商和清算领域达50年之久的 COBOL 大型机系统。Clear Street
              放弃靠隔夜批处理对账硬性拼接的碎片化数据库，将其多资产清算与托管业务架构于单一统一的实时账本之上。这一云原生底座让交易执行、保证金计算、风险管理与清算实时同步，覆盖美股、期权、期货、固定收益、基于证券的掉期及数字资产。在交易栈的分析与数据处理层，Clear
