  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Impact
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap / trigger
    rows:
      - - Single-ledger outage or data-integrity failure
        - Unknown
        - Critical
        - Company reports >99.9% STP and ~99.95% uptime in a 2025 volume event
        - High without service-level and recovery evidence
        - Trigger on missed RTO/RPO, unreconciled positions, or material client impact
      - - Cyber intrusion or privileged-access compromise
        - Unknown
        - Critical
        - Company lists layered access, monitoring, secure development, and incident response
        - High without independent assurance and remediation history
        - Obtain SOC reports, penetration tests, incident log, and access-review exceptions
      - - Cloud-region or provider dependency failure
        - Unknown
        - High
        - AWS elasticity reported by a competitor source; failover is not evidenced
        - High because architecture and exit rights are unknown
        - Trigger on failed regional recovery test or unremediated provider concentration
      - - Product and geographic change overload
        - Current execution signal
        - High
        - Leadership changes and hiring are disclosed; governance evidence is absent
        - Medium-high while multiple launches and expansion proceed
        - Track launch incidents, risk staffing, control exceptions, and delayed remediation
    notes: >
      Qualitative ratings preserve unknown likelihood where the assigned evidence
      provides controls or performance claims but no independent incident frequency.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR016
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Impact
      - Mitigation
      - Residual exposure
    rows:
      - - Cloud compute
        - Amazon Web Services, per third-party explainer
        - Elastic infrastructure for platform scaling
        - Unknown
        - Regional outage, service degradation, or constrained exit
        - Critical
        - Company discloses monitoring and vendor assessment, not failover results
        - High pending architecture, contract, recovery, and exit-plan review
      - - Excess customer-account protection
        - Lloyd's of London
        - Excess SIPA coverage above specified thresholds
        - One disclosed excess insurer
        - Policy non-renewal, exclusion, or aggregate losses above $250 million
        - High
        - Disclosed per-account limits and aggregate cap
        - Material because policy terms, exclusions, and renewal are not in pool
      - - Public website implementation
        - Büro
        - Design and implementation of public digital experience
        - Unknown
        - Website disruption or vendor transition affects communications
        - Low
        - Replaceable marketing surface; no core-system role evidenced
        - Low unless diligence reveals identity, onboarding, or trading integration
    notes: >
      The register separates evidenced counterparties from inferred criticality;
      no customer, venue, banking, liquidity-provider, or market-data concentration
      schedule was available.
    claimRefs:
      - CR004
      - CR008
      - CR009
      - CR013
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >
      Evidence-based qualitative ranking of impact, likelihood support, mitigation
      maturity, and residual exposure for six investment-critical risks.
    data:
      columns:
        - id: impact
          label: Impact
          detail: Consequence if the risk occurs
        - id: likelihood
          label: Likelihood evidence
          detail: What the assigned sources establish about frequency
        - id: mitigation
          label: Mitigation maturity
          detail: Publicly evidenced control posture
        - id: residual
          label: Residual severity
          detail: Exposure remaining after disclosed mitigations
      rows:
        - id: regulatory-continuity
          label: Regulatory continuity
          note: Multiple disclosed U.S. registrations; no examination record in pool
          values:
            - label: Critical
              detail: A restriction could impair core regulated services
            - label: Unknown
              detail: Registration does not establish incident frequency
            - label: Documented
              detail: Registrations are company-disclosed
            - label: High
              detail: Independent regulatory record remains a diligence gap
        - id: customer-asset-protection
          label: Customer-asset protection
          note: Customer balances and insurance limits are different measures
          values:
            - label: Critical
              detail: Company reports approximately $16 billion in customer balances
            - label: Unknown
              detail: No loss or reserve history was allocated
            - label: Bounded
              detail: Excess coverage has per-account and aggregate caps
            - label: High
              detail: Capital and liquidity sufficiency are not established
        - id: ledger-availability
          label: Ledger availability and integrity
          note: Company-reported 2025 STP and uptime are not independent assurance
          values:
            - label: Critical
              detail: Clearing, custody, and risk management share the ledger
            - label: Partly evidenced
              detail: One high-volume period is disclosed
            - label: Claimed
              detail: Monitoring and incident response are described
            - label: Medium-high
              detail: Recovery testing and service-level history are unavailable
        - id: cyber-security
          label: Cybersecurity and access control
          note: Controls are described without an allocated assurance report
          values:
            - label: Critical
              detail: Sensitive and regulated data are in scope
            - label: Unknown
              detail: No incident chronology was allocated
            - label: Claimed
              detail: Layered controls and secure development are described
            - label: High
              detail: Effectiveness and remediation evidence are missing
        - id: cloud-dependency
          label: Cloud-provider dependency
          note: AWS use is reported by a competitor source, not corroborated here
          values:
            - label: High
              detail: Compute supports scaling of transaction workloads
            - label: Unknown
              detail: Architecture concentration is not disclosed
            - label: Unverified
              detail: Vendor assessment is claimed; failover is not evidenced
            - label: High
              detail: Contract, recovery, and exit details remain private
        - id: execution-overload
          label: Product and geographic execution
          note: Headcount and launches are signals, not proof of control failure
          values:
            - label: High
              detail: Multiple launches and planned expansion broaden scope
            - label: Current signal
              detail: Changes were announced in 2026
            - label: Developing
              detail: Leadership accountability is described, metrics are not
            - label: Medium-high
              detail: Launch quality and control-exception data are unavailable
    approximationNotes: >
      Qualitative labels are analytical rankings, not measured probabilities.
      Unknown means the assigned evidence cannot establish frequency.
    claimRefs:
      - CR004
      - CR005
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR016
callouts:
  - calloutType: risk
    title: Thesis-break conditions
    body: >
      Stop underwriting on a material license restriction, customer-protection or
      capital deficiency, unrecovered critical-service outage, unreconciled ledger
      positions, or a confirmed control failure that management cannot remediate
      within board-approved limits. Pause rather than infer safety when regulator
      records, assurance reports, capital data, or incident history remain
      unavailable.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR005
      - CR007
      - CR016
  - calloutType: assumption
    title: Financial-risk evidence is not decision-grade
    body: >
      Capital raised, customer balances, and a third-party revenue estimate are
      different metrics. None establishes current cash availability, regulatory
      capital, loss absorption, cash burn, or runway; audited financials and
      regulatory capital reports are required before sizing financial-model risk.
    claimRefs:
      - CR005
      - CR006
      - CR015
