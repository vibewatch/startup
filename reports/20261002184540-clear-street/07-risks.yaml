        - United States
        - Forum Markets says Clear Street initiated coverage in May 2026
        - Unknown
        - High
        - Coverage activity evidenced; policies and conflicts not evidenced
        - Material pending research-independence and disclosure review
        - Obtain engagement terms, analyst attestations, disclosures, and supervisory logs
    notes: >
      Partial enumeration based only on assigned company and issuer sources; it is
      not a regulator-verified list of licenses, matters, or jurisdictions.
