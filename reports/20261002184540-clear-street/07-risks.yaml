  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory-legal-risk-register
      missingEvidence: >
        Regulator-issued examination, disciplinary, capital-deficiency, enforcement,
        and court records for every relevant entity and jurisdiction.
      whyItMatters: >
        Company-disclosed registrations do not establish compliance history,
        supervisory findings, pending litigation, or capital adequacy.
      diligencePath: >
        Pull FINRA BrokerCheck, NFA BASIC, SEC and CFTC records, state and foreign
        registrations, material court dockets, FOCUS reports, and regulator
        correspondence for all operating entities.
      relatedQuestionRefs:
        - QR002
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: financial-and-model-risk
      missingEvidence: >
        Audited revenue, cash, regulatory capital, liquidity, burn, credit losses,
        fraud losses, working-capital needs, and customer/counterparty concentration.
      whyItMatters: >
        Capital raised and customer balances do not measure cash available, runway,
        loss absorption, earnings quality, or concentration.
      diligencePath: >
        Obtain audited financial statements, regulatory capital reports, liquidity
        stress tests, loan and margin books, loss vintages, fraud reports, and
        top-customer and counterparty schedules.
      relatedQuestionRefs:
        - QR005
    - type: private-evidence-only
      severity: material
      topic: security-controls
      missingEvidence: >
        Independent assurance reports, penetration tests, incident chronology,
        service-level history, recovery test results, and remediation aging.
      whyItMatters: >
        Public descriptions establish claimed controls but not operating
        effectiveness, recovery capability, or the absence of incidents.
      diligencePath: >
        Review SOC reports and bridge letters, security assessments, material
        incidents, RTO/RPO test evidence, uptime by critical service, and open
        remediation items under NDA.
    - type: private-evidence-only
      severity: material
      topic: dependency-concentration
      missingEvidence: >
        Cloud architecture, market venue, bank, custodian, insurer, market-data,
        liquidity-provider, customer, and counterparty concentration schedules.
      whyItMatters: >
        Named vendors alone do not establish substitutability, contractual
        protections, concentration, recovery options, or financial exposure.
      diligencePath: >
        Obtain critical-vendor inventory, dependency maps, contracts, termination
        rights, business-continuity tests, insurance policy terms, and concentration
        limits with current utilization.
      relatedTableRefs:
        - TR003
