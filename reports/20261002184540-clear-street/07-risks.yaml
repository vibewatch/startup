artifact: risks
slug: clear-street
runDate: 2026-10-02
company:
  name: Clear Street
chapter:
  number: 7
  title: Risks
  summary: >
    Clear Street's largest disclosed risk surface is the combination of regulated
    customer-asset activity, a concentrated cloud-native ledger, and rapid product
    and organizational expansion. Public evidence describes registrations,
    insurance, controls, and reliability, but it does not independently establish
    control effectiveness, incident history, counterparty concentration, or
    balance-sheet loss capacity.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >
      The highest-impact exposures are regulatory continuity, customer-asset
      protection, and platform availability. Clear Street says it supports about
      $16 billion in customer balances, while its clearing page reports a single
      cloud-native ledger and company-measured 2025 reliability of more than 99.9%
      straight-through processing and about 99.95% uptime during a sudden volume
      doubling (CR005, CR007). Those metrics indicate operating scale and a tested
      period; they do not establish performance in every stress scenario. The
      assigned evidence also shows a larger operating footprint and several 2026
      launches, increasing change-management demands (CR010, CR011, CR012).
      Accordingly, the heatmap ranks impact from the disclosed activity and asset
      scale, but marks likelihood as unknown where the pool contains neither an
      independent incident chronology nor assurance testing (CR016). A thesis break
      should be tied to a lost or restricted license, a customer-protection
      deficiency, an unrecovered critical outage, or evidence that expansion is
      outrunning capital and control capacity—not to an unsupported claim that no
      incident has occurred.
    claimRefs:
      - CR005
      - CR007
      - CR010
      - CR011
      - CR012
      - CR016
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: regulatory-and-legal
    title: Regulatory and legal continuity
    body: >
      Clear Street's own legal page identifies FINRA membership, futures commission
      merchant registration with the CFTC and NFA membership, and SEC registration
      as a security-based swap dealer (CR001, CR002, CR003). These statuses are
      evidence of a broad supervisory perimeter, not evidence that every obligation
      has been independently tested or that the firm has a clean enforcement
      history. Customer-protection mitigation is also bounded: Clear Street says
      Lloyd's excess SIPA coverage provides stated per-account limits and a $250
      million aggregate limit (CR004). An issuer release further establishes that
      Clear Street initiated equity research coverage of Forum Markets in May 2026,
      adding a conduct, disclosure, and conflict-control diligence surface; the
      release does not evidence a breach (CR014). The available pool contains no
      regulator-issued examination findings, court docket, disciplinary history,
      or independently verified capital-reserve data. Those records should be
      obtained before treating the registrations and insurance disclosures as a
      complete legal-risk assessment.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR014
    tableRefs:
      - TR001
  - id: operational-and-dependency
    title: Operational, security, and dependency exposure
    body: >
      Architecture concentration is the central operational risk. Clear Street
      describes one in-house, cloud-native ledger spanning clearing, custody, and
      risk management, while a competitor-published explainer reports that the
      platform uses elastic AWS compute (CR007, CR009). A shared ledger can reduce
      reconciliation friction, but it also makes recovery objectives, data
      integrity, regional failover, and vendor exit plans investment-critical.
      Clear Street lists encryption, access restrictions, continuous monitoring,
      formal incident response, secure development, and vendor assessment as
      controls (CR008); no independent assurance report or recovery-test result is
      present in the assigned evidence. The Lloyd's policy creates an additional
      counterparty and renewal dependency, and Büro's case study identifies a
      third-party implementer for the public website, although the source does not
      connect that agency to core brokerage systems (CR004, CR013). Diligence should
      separate low-criticality marketing dependencies from cloud, clearing,
      custody, insurance, and market-access dependencies.
    claimRefs:
      - CR004
      - CR007
      - CR008
      - CR009
      - CR013
      - CR016
    tableRefs:
      - TR003
  - id: financial-and-execution
    title: Financial model and execution thresholds
    body: >
      Public scale figures are insufficient to quantify loss absorption or runway.
      Clear Street says it has raised $1.0 billion, but funding raised is not cash
      available, regulatory capital, or liquidity (CR006). Likewise, approximately
      $16 billion of customer balances measures client assets on the platform, not
      corporate cash or equity capital (CR005). Latka reports $101.9 million of
      2025 revenue while explicitly showing the underlying source as “Not
      recorded,” so the figure is a weak signal rather than an auditable financial
      baseline (CR015). Execution complexity is more directly visible: Clear Street
      reported headcount increasing from 773 to 830 during 2026, internal leadership
      changes, a consumer trading app, cryptocurrency spot-trading capabilities, a
      prediction-market partnership, and planned geographic and asset-class
      expansion (CR010, CR011). The monitoring package should therefore require
      audited revenue and capital, customer and counterparty concentration, credit
      losses, fraud losses, liquidity stress tests, uptime by critical service, and
      launch-level incident data. Failure to supply those measures—or deterioration
      beyond board-approved limits—should pause underwriting.
    claimRefs:
      - CR005
      - CR006
      - CR010
      - CR011
      - CR015
      - CR016
