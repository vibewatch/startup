        title: Exhibits
        blocks:
          - type: callout
            title: 'Dual Market Identity: Prime Brokerage Utility vs. Active Trading Platform'
            body: >-
              Clear Street occupies a hybrid market posture in modern capital markets. While its core economic engine is
              an institutional clearing, custody, and financing utility for hedge funds and broker-dealers, its recent
              strategic pushes into pre-IPO SPV syndication, individual active trading apps, and AI-native retail
              assistants (Omni) reflect an ambitious diversification into higher-margin active trader retail workflows
              (CO004, CO007, CO008, CO014).
            calloutType: insight
            claimRefs:
              - CO004
              - CO007
              - CO008
              - CO014
          - type: callout
            title: Capitalization Discrepancies and Public Market Timing
            body: >-
              Third-party disclosures exhibit notable divergence regarding Clear Street's historical capital base,
              ranging from $649 million in venture rounds to $1.0 billion in company-stated capital. Furthermore, having
              paused its planned $12 billion IPO in February 2026 after preliminary S-1 preparations, the company must
              sustain high revenue run-rates and capital efficiency under private ownership before public market windows
              reopen (CO004, CO006, CO008, CO012).
            calloutType: risk
            claimRefs:
              - CO004
              - CO006
