  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological progression of Clear Street corporate founding, financing rounds, regulatory expansion, platform
      acquisitions, and leadership reorganizations from 2018 through 2026.
    data:
      items:
        - label: Corporate Inception
          date: 2018-09
          detail: >-
            Clear Street founded in New York to build cloud-native clearing and custody infrastructure for modern
            capital markets.
        - label: Clearing Broker-Dealer Operations
          date: 2018-12
          detail: Commences operations as a registered clearing broker-dealer member of FINRA and SIPC.
        - label: First US Equities Trade
          date: 2019-08
          detail: Processes initial trade execution in US equities market, establishing core order-processing capabilities.
        - label: CenterPoint Securities Acquisition
          date: 2020-07
          detail: Acquires professional active trading platform CenterPoint Securities to expand client distribution.
        - label: ATLAS Locates System Launch
          date: 2022-11
          detail: Launches ATLAS automated securities lending and locate allocation platform for short-selling clients.
        - label: Series B Funding Expansion
          date: 2023-04
          detail: Raises $270M Series B tranche led by Prysm Capital at a $2.0B post-money valuation.
        - label: REACT Futures Acquisition
          date: 2023-07
          detail: >-
            Acquires cloud-native futures clearing platform REACT to expand into multi-asset exchange-traded
            derivatives.
        - label: Series C Round & IPO Filing
          date: 2026-01
          detail: Completes $135.4M Series C round at $12B valuation led by Baillie Gifford and files preliminary S-1.
        - label: IPO Plan Deferral
          date: 2026-02
          detail: >-
            Pauses initial public offering plans following confidential S-1 submission to focus on private market
            expansion.
        - label: Executive Leadership Transition
          date: 2026-05
          detail: Ed Tilly announces retirement from CEO role; Founder Uri Cohen transitions back to Chief Executive Officer.
        - label: Private Markets & Databricks SPV
          date: 2026-07
          detail: >-
            Launches Clear Street Private Markets offering pre-IPO access to high-growth tech firms starting with
            Databricks.
        - label: Executive Reorganization
          date: 2026-07
          detail: >-
            Promotes Andy Volz and John DiBacco to Co-Presidents and Megan Cruse to Chief Operating Officer as headcount
            reaches 830.
