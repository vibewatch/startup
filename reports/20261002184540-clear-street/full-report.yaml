chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Modern Architecture, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in September 2018 in New York, Clear Street operates as an institutional-grade financial
              infrastructure provider and prime broker designed to replace legacy mainframe systems with a modern,
              cloud-native clearing and custody engine (CO001, CO002, CO004). The firm provides multi-asset clearing,
              custody, execution, securities lending, and margin financing to hedge funds, professional traders,
              institutional investors, and sophisticated individual market participants (CO001, CO004, CO007). In
              addition to institutional prime brokerage, Clear Street launched Clear Street Private Markets to provide
              accredited clients with pre-IPO special purpose vehicle (SPV) exposure, beginning with Databricks, while
              also expanding active retail trading capabilities via proprietary desktop and mobile applications
              featuring AI-driven trading tools (CO007, CO008, CO014). Transparent volume-tiered equity pricing, options
              commissions, and benchmark-linked financing underpin its monetization model across capital markets
              workflows (CO015).
            claimRefs:
