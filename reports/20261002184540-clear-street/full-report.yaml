      - number: '5.2'
        title: Clear Street Studio, Margin Engines, and Workflow Tooling
        blocks:
          - type: paragraph
            body: >-
              Clients interact with Clear Street infrastructure through Clear Street Studio, a unified web command
              center and programmatic developer API suite. Studio delivers institutional trading tools, portfolio
              analytics, and automated operational workflows once accessible only to Tier-1 hedge funds. A critical
              technological pillar is Studio real-time margin and risk simulation capability. Through interactive
              features such as the Shocks View, portfolio managers and risk officers can simulate portfolio resilience
              and margin capital requirements against violent hypothetical market moves across multi-asset books
              instantaneously, eliminating the traditional friction of calling back-office risk desks for manual
              scenario estimates. In addition to high-turnover hedge funds, Studio is specifically adopted by family
              offices managing hybrid public and private investment books, who utilize its consolidated dashboard to
              unify cross-asset reporting and eliminate spreadsheet reconciliations across fragmented custodians. Clear
              Street backs Studio with consultative business engineering teams to coordinate direct API integrations and
              custom operational onboarding.
            claimRefs:
              - CE006
