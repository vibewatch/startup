    title: Risk heatmap
    type: matrix
    summary: >
      Evidence-based qualitative ranking of impact, likelihood support, mitigation maturity, and residual exposure for
      six investment-critical risks.
    data:
      columns:
        - id: impact
          label: Impact
          detail: Consequence if the risk occurs
        - id: likelihood
          label: Likelihood evidence
          detail: What the assigned sources establish about frequency
        - id: mitigation
          label: Mitigation maturity
          detail: Publicly evidenced control posture
        - id: residual
          label: Residual severity
          detail: Exposure remaining after disclosed mitigations
      rows:
        - id: regulatory-continuity
          label: Regulatory continuity
          note: Multiple disclosed U.S. registrations; no examination record in pool
          values:
            - label: Critical
              detail: A restriction could impair core regulated services
            - label: Unknown
              detail: Registration does not establish incident frequency
            - label: Documented
              detail: Registrations are company-disclosed
            - label: High
              detail: Independent regulatory record remains a diligence gap
        - id: customer-asset-protection
          label: Customer-asset protection
          note: Customer balances and insurance limits are different measures
          values:
            - label: Critical
              detail: Company reports approximately $16 billion in customer balances
            - label: Unknown
              detail: No loss or reserve history was allocated
            - label: Bounded
              detail: Excess coverage has per-account and aggregate caps
            - label: High
              detail: Capital and liquidity sufficiency are not established
        - id: ledger-availability
          label: Ledger availability and integrity
          note: Company-reported 2025 STP and uptime are not independent assurance
          values:
            - label: Critical
              detail: Clearing, custody, and risk management share the ledger
            - label: Partly evidenced
              detail: One high-volume period is disclosed
            - label: Claimed
              detail: Monitoring and incident response are described
            - label: Medium-high
              detail: Recovery testing and service-level history are unavailable
        - id: cyber-security
          label: Cybersecurity and access control
          note: Controls are described without an allocated assurance report
          values:
            - label: Critical
              detail: Sensitive and regulated data are in scope
            - label: Unknown
              detail: No incident chronology was allocated
            - label: Claimed
              detail: Layered controls and secure development are described
            - label: High
              detail: Effectiveness and remediation evidence are missing
        - id: cloud-dependency
          label: Cloud-provider dependency
          note: AWS use is reported by a competitor source, not corroborated here
          values:
            - label: High
              detail: Compute supports scaling of transaction workloads
            - label: Unknown
              detail: Architecture concentration is not disclosed
            - label: Unverified
              detail: Vendor assessment is claimed; failover is not evidenced
            - label: High
              detail: Contract, recovery, and exit details remain private
        - id: execution-overload
          label: Product and geographic execution
          note: Headcount and launches are signals, not proof of control failure
          values:
            - label: High
              detail: Multiple launches and planned expansion broaden scope
            - label: Current signal
              detail: Changes were announced in 2026
            - label: Developing
              detail: Leadership accountability is described, metrics are not
            - label: Medium-high
              detail: Launch quality and control-exception data are unavailable
    approximationNotes: >
      Qualitative labels are analytical rankings, not measured probabilities. Unknown means the assigned evidence cannot
