      - number: '1.2'
        title: Executive Leadership Transitions and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              Clear Street was co-founded by Sachin Kumar and Chris Pento, alongside Executive Chairman Uri Cohen, who
              returned to the Chief Executive Officer role on June 1, 2026, following the planned executive retirement
              of Ed Tilly (CO002, CO003, CO009, CO010). Under Tilly's two-year tenure as CEO, the firm expanded
              internationally across North America, Europe, and Asia, crossed the $1.0 billion annual revenue threshold,
              and substantially increased its multi-asset product velocity before Tilly transitioned back to an advisory
              role and board seat (CO003, CO009). The executive bench was subsequently restructured in July 2026 with
              promotions from within, appointing Andy Volz and John DiBacco as Co-Presidents, Megan Cruse as Chief
              Operating Officer, Jon Daplyn as Chief Technology Officer, and Michael Stover as Chief People and
              Performance Officer (CO005, CO011). This governance realigns operational, technical, and commercial
              leadership to balance institutional prime brokerage growth with active trading expansion (CO005, CO011).
            claimRefs:
              - CO002
              - CO003
              - CO005
              - CO009
              - CO010
              - CO011
