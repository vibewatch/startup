      - number: '4.4'
        title: Reported financing extends capacity but does not prove runway
        blocks:
          - type: paragraph
            body: >-
              Clear Street raised approximately $135.4 million through Series C preferred stock sales in December 2025
              and January 2026. A subsidiary also issued $78.5 million of notes in January 2026, taking reported
              outstanding debt to $300 million. These facts show continued access to equity and debt capital, but
              funding raised is not the same as cash available: the assigned evidence does not state unrestricted cash,
              regulatory-capital requirements, encumbered liquidity, debt maturities, covenants, cash burn, or planned
              use of funds. The financial verdict is therefore mixed. Revenue scale and reported profitability support
              operating traction, while financing concentration and missing balance-sheet, cash-flow, margin, pricing,
              and concentration data prevent a confident judgment on durable returns or capital adequacy. Underwriting
              should require audited statements and stream-level economics before assigning a forward margin or runway
              case.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI007
              - CI009
              - CI010
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing concentration is the central earnings sensitivity
            body: >-
              With roughly 70% of 2024 revenue attributed to net financing, underwriting depends on net spreads, client
              leverage, securities-lending demand, and balance retention. Reported growth alone cannot establish
              durability without rate and balance sensitivity schedules.
            calloutType: risk
            claimRefs:
              - CI005
              - CI007
          - type: callout
            title: Require cash, margin, and concentration schedules before underwriting
            body: >-
              Obtain audited balance sheets and cash-flow statements, unrestricted and regulatory cash, debt terms,
              stream-level gross margins, realized pricing, client concentration, CAC and payback, and stress tests for
              rates and activity. Do not infer runway from reported funding or net income.
            calloutType: recommendation
            claimRefs:
