      - number: '4.2'
        title: Adjacent products widen monetization, while realized pricing stays private
        blocks:
          - type: paragraph
            body: >-
              The public operating footprint points to several cross-sell surfaces. Clear Street says its Kalshi
              relationship includes institutional trading access, clearing, settlement, block trading, swap solutions
              for ETFs, and supporting infrastructure. Family Wealth Report separately reported the launch of
              private-markets equity research inside client accounts, while the investment-banking page claims 92
              transactions and $99 billion of transaction value in 2025. These activities can deepen account
              relationships and add clearing, financing, execution, advisory, or research economics, but the assigned
              evidence does not disclose list prices, realized take rates, discounts, contract minimums, sales-cycle
              length, CAC, or payback. Deal value and transaction count are activity measures, not revenue. Accordingly,
              this chapter treats product breadth as a monetization opportunity rather than evidence of incremental
              margin or efficient customer acquisition.
            claimRefs:
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
