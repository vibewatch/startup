              - CO009
              - CO010
              - CO011
      - number: '1.3'
        title: Capitalization Profile, Valuation Discrepancies, and Scale Trajectory
        blocks:
          - type: paragraph
            body: >-
              Clear Street's capitalization trajectory is characterized by rapid private funding rounds and material
              valuation divergence across independent secondary markets and tracker databases. Company filings and
              official disclosures report $1.0 billion in total capital raised, while venture tracker Tracxn records
              $649 million across six rounds and private securities platform Forge Global reports $885.47 million in
              cumulative financing culminating in a $135.39 million Series C round in January 2026 (CO004, CO006, CO012,
              CO013). Private funding round valuations jumped from $2.0 billion-$2.1 billion in Series B tranches up to
              $12 billion in early 2026 backed by institutional investors including Baillie Gifford, SBI Holdings, Prysm
              Capital, and IMC Investments (CO006, CO008, CO012, CO013). However, following confidential or preliminary
              S-1 preparations in January 2026, Clear Street officially paused its IPO plans in February 2026 amid
              volatile market conditions, redirecting near-term capital toward private markets infrastructure, crypto
              asset expansion, and core clearing capacity serving over 700 institutional clients and 830 employees
              worldwide (CO004, CO005, CO008, CO012).
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO008
              - CO012
              - CO013
