  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >
              Clear Street operates across the capital markets infrastructure and prime brokerage ecosystem. The firm's
              core operational boundary encompasses prime brokerage financing, securities lending, trade execution,
              clearing, custody, and post-trade settlement across equities, options, futures, and fixed income. Outdated
              legacy mainframe infrastructure—predominantly 50-year-old COBOL-based clearing systems—represents the
              entrenched status quo among incumbent prime brokers and custody banks. Clear Street replaces this
              fragmented architecture with a cloud-native platform centered on a single real-time ledger that unifies
              execution, clearing, and risk management into one stack. Spend included in this market comprises
              institutional prime brokerage margin interest, securities borrowing fees, trade execution commissions,
              custody administration, and clearing fees paid by hedge funds, registered broker-dealers, proprietary
              trading firms, and active trading accounts. Excluded from this boundary are retail wealth management
              advisory fees, consumer deposit banking, traditional commercial lending, and passive robo-advisory asset
              management fees. Adjacent market opportunities include investment banking advisory services, equity
              capital market underwriting, digital asset spot trading infrastructure, and clearing services for
              event-driven prediction markets.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
