              - CI016
      - number: '4.3'
        title: Scale proxies are strong, but definitions and cost attribution are incomplete
        blocks:
          - type: paragraph
            body: >-
              An independent IPO report placed Clear Street above 2,000 clients and $31.3 billion of daily trading
              activity as of September 2025, with more than $17.2 billion of interest-bearing client balances. The
              official homepage presents a different, undated operating snapshot of more than 700 institutional clients
              and about $16 billion of customer balances. These figures may describe different dates, populations, or
              balance definitions and should not be treated as contradictory without management reconciliation. Cost
              proxies point to a substantial service and control footprint: the company said headcount grew from 773 to
              830 during 2026, while its careers page lists 16 offices and more than 800 employees. Those facts indicate
              operating scale but do not reveal personnel expense, cloud and connectivity costs, regulatory-capital
              usage, gross margin, or contribution margin by stream.
            claimRefs:
