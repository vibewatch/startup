              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real-Time Risk Simulation vs. Legacy Batch Calls
            body: >-
              Clear Street Studio replaces manual risk inquiries with real-time computational margin shock simulations,
              allowing institutional traders to stress-test multi-asset portfolio drawdowns and cross-margining
              requirements instantly without waiting for overnight batch clearing runs.
            calloutType: insight
            claimRefs:
              - CE007
              - CE008
          - type: callout
            title: The Bilateral Integration Burden in Modern Clearing
            body: >-
              Although Clear Street eliminates internal COBOL mainframes, it must maintain extensive translation engines
              to interface with DTCC, OCC, and external exchange protocols that continue to operate on legacy messaging
              standards, acting as an active bridge across the capital markets ecosystem.
            calloutType: risk
            claimRefs:
              - CE011
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Institutional Client Base Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >
              Clear Street targets sophisticated financial market participants whose trading velocity, multi-asset
              strategies, or balance sheet requirements are underserved by legacy prime brokerage systems. The firm
              segments its customer base across six primary buyer and counterparty categories: institutional hedge
              funds, quantitative and algorithmic trading groups, market makers and professional trading firms,
              introducing broker-dealers, asset managers and ETF issuers, and corporate advisory or digital asset
              treasury clients. In institutional hedge funds and proprietary trading groups, the primary economic buyers
              are chief operating officers, portfolio managers, and chief risk officers who require real-time risk
              analytics, seamless margin financing, and automated securities lending demand execution. For introducing
              broker-dealers, Clear Street delivers white-label clearing, trade execution, and regulatory custody,
              replacing inflexible 50-year-old COBOL mainframe infrastructures with modern cloud-native APIs. In asset
              management and structured products, Clear Street acts as an institutional Futures Commission Merchant
              (FCM) and swap desk partner, enabling regulated venues like Kalshi and ETF sponsors to structure
              prediction market derivatives and listed investment vehicles. Additionally, through Clear Street
              Investment Banking, the firm advises corporate and financial clients on capital raising, initial public
              offerings, and digital asset treasury strategy, completing billions of dollars in transaction advisory.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
      - number: '6.2'
        title: Client Adoption Trajectory, Balance Sheet Scale, and Commercial Milestones
        blocks:
          - type: paragraph
            body: >
              Commercial traction across Clear Street's clearing and execution platform has scaled substantially since
              its 2018 inception. Official platform metrics reveal that the platform services over 700 institutional
              clients, custodying approximately $16 billion in customer balances and clearing ~550 million shares daily
              with ~$28.4 billion in average daily notional turnover. The firm reported 94% year-over-year transacted
              growth, driven by expanding institutional client onboarding and the rollout of multi-asset clearing
              capabilities spanning equities, options, futures, fixed income, OTC derivatives, and digital assets.
              Independent third-party data tracking firm GetLatka reports that Clear Street generated $101.9 million in
              revenue in 2025, expanding from $56.4 million reported in 2023. However, GetLatka evaluates Clear Street
              under SaaS ARR benchmarks rather than broker-dealer net interest margin and financing spread models,
              highlighting persistent public-reporting data gaps regarding true client account retention rates, net
              revenue retention (NRR), and gross revenue retention (GRR). To further broaden client reach beyond
              institutions into individual wealth, Clear Street launched Clear Street Active, a dedicated retail trading
              platform supported by custom design systems and mobile infrastructure, attempting to build a bifurcated
              institutional-and-retail user ecosystem.
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU007
              - CU008
              - CU009
              - CU010
      - number: '6.3'
        title: Named Customer Proof, Institutional Deployments, and Underwriting Syndicates
        blocks:
          - type: paragraph
            body: >
              Verified commercial adoption is demonstrated by major institutional partnerships, public underwriting
              engagements, and regulated market integrations. In May 2026, Clear Street announced a milestone strategic
              partnership with Kalshi, the federally regulated prediction market exchange, becoming the first
              institutional Futures Commission Merchant (FCM) to join Kalshi's exchange and clearing house. Under this
              agreement, Clear Street provides institutional trading access to 24/7 regulated event contracts,
              large-scale risk transfer via block trading, clearing, settlement, and swap desk solutions for ETF issuers
              creating prediction market products. In corporate finance, Clear Street Investment Banking has advised on
              over $2.35 billion in capital markets transactions, serving as bookrunner and advisor for special purpose
              acquisition companies such as Renatus Tactical Acquisition Corp (Nasdaq: RTACU) and Digital Asset
              Acquisition Corp. (Nasdaq: DAAQU). Furthermore, SEC S-1 underwriting agreements for Clear Street Group
              Inc. demonstrate deep institutional counterparty syndication with global investment banks, naming Goldman
              Sachs, BofA Securities, Morgan Stanley, and UBS Securities as representatives alongside Clear Street LLC,
              including a Directed Share Program for company-related participants.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
              - CU012
      - number: '6.4'
        title: Client Retention Vulnerabilities, Litigation, and Privacy Concerns
        blocks:
          - type: paragraph
            body: >
              Despite rapid customer growth, Clear Street faces severe counterparty, governance, and client durability
              risks. In federal court proceedings before the U.S. District Court for the Southern District of New York
              (Batanjany et al. v. Clear Street Management LLC et al., June 2026), four former FINRA-registered
              broker-dealers from Clear Street's derivatives and securities lending desks provided sworn testimony
              regarding serious operational and client privacy concerns. Former employees, including derivatives
              operations leader Jordan Brodsky, testified under oath that senior management, including CCO Andy Volz,
              instructed staff to transmit confidential client data to White Bay, the private family investment firm of
              CEO Uri Cohen. Former derivatives CEO Patrick Travers and Managing Director Cory Solomon testified
              regarding internal alarms raised over client privacy, margin requirements, novation compliance, securities
              lending disclosures under Regulation SHO, and the termination of personnel raising 1940 Act fund custody
              issues. In September 2025, seven derivatives professionals resigned simultaneously to join competitor
              Hidden Road Partners, prompting Clear Street to issue retaliatory 'for cause' Form U-5 filings that
              District Judge Analisa Torres enjoined, finding a likelihood of unlawful retaliation. These sworn
              proceedings expose substantial client trust vulnerabilities, potential regulatory sanctions, and employee
              churn that threaten institutional counterparty retention and prime brokerage relationship durability.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Client Trust Vulnerability from Sworn SDNY Litigation Disclosures
            body: >
              Sworn testimony in federal court (Batanjany v. Clear Street Management LLC) that senior executives
              directed the transfer of client trading data to an affiliated family office (White Bay) creates acute
              institutional trust and compliance risks. In prime brokerage, client confidentiality regarding trading
              strategies, borrow demand, and position sizes is paramount; substantiated privacy breaches or regulatory
              sanctions under SEC and FINRA rules could trigger institutional client defections to competing prime
              brokers such as Hidden Road Partners, Interactive Brokers, or tier-one banks.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
          - type: callout
            title: Strategic Asset Expansion via First-to-Market Prediction Market FCM Status
            body: >
              Clear Street's partnership with Kalshi to become the first institutional FCM clearing member establishes
              an innovative customer acquisition channel. By bridging institutional hedge funds, market makers, and ETF
              issuers into regulated event contracts, Clear Street differentiates its clearing franchise from
              traditional prime brokers while driving high-margin swap desk and clearing fees across a non-correlated
              asset class.
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >
              The highest-impact exposures are regulatory continuity, customer-asset protection, and platform
              availability. Clear Street says it supports about $16 billion in customer balances, while its clearing
              page reports a single cloud-native ledger and company-measured 2025 reliability of more than 99.9%
              straight-through processing and about 99.95% uptime during a sudden volume doubling (CR005, CR007). Those
              metrics indicate operating scale and a tested period; they do not establish performance in every stress
              scenario. The assigned evidence also shows a larger operating footprint and several 2026 launches,
              increasing change-management demands (CR010, CR011, CR012). Accordingly, the heatmap ranks impact from the
              disclosed activity and asset scale, but marks likelihood as unknown where the pool contains neither an
              independent incident chronology nor assurance testing (CR016). A thesis break should be tied to a lost or
              restricted license, a customer-protection deficiency, an unrecovered critical outage, or evidence that
              expansion is outrunning capital and control capacity—not to an unsupported claim that no incident has
              occurred.
            claimRefs:
              - CR005
              - CR007
              - CR010
              - CR011
              - CR012
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
      - number: '7.2'
        title: Regulatory and legal continuity
        blocks:
          - type: paragraph
            body: >
              Clear Street's own legal page identifies FINRA membership, futures commission merchant registration with
              the CFTC and NFA membership, and SEC registration as a security-based swap dealer (CR001, CR002, CR003).
              These statuses are evidence of a broad supervisory perimeter, not evidence that every obligation has been
              independently tested or that the firm has a clean enforcement history. Customer-protection mitigation is
              also bounded: Clear Street says Lloyd's excess SIPA coverage provides stated per-account limits and a $250
              million aggregate limit (CR004). An issuer release further establishes that Clear Street initiated equity
              research coverage of Forum Markets in May 2026, adding a conduct, disclosure, and conflict-control
              diligence surface; the release does not evidence a breach (CR014). The available pool contains no
              regulator-issued examination findings, court docket, disciplinary history, or independently verified
              capital-reserve data. Those records should be obtained before treating the registrations and insurance
              disclosures as a complete legal-risk assessment.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR014
      - number: '7.3'
        title: Operational, security, and dependency exposure
        blocks:
          - type: paragraph
            body: >
              Architecture concentration is the central operational risk. Clear Street describes one in-house,
              cloud-native ledger spanning clearing, custody, and risk management, while a competitor-published
              explainer reports that the platform uses elastic AWS compute (CR007, CR009). A shared ledger can reduce
              reconciliation friction, but it also makes recovery objectives, data integrity, regional failover, and
              vendor exit plans investment-critical. Clear Street lists encryption, access restrictions, continuous
              monitoring, formal incident response, secure development, and vendor assessment as controls (CR008); no
              independent assurance report or recovery-test result is present in the assigned evidence. The Lloyd's
              policy creates an additional counterparty and renewal dependency, and Büro's case study identifies a
              third-party implementer for the public website, although the source does not connect that agency to core
              brokerage systems (CR004, CR013). Diligence should separate low-criticality marketing dependencies from
              cloud, clearing, custody, insurance, and market-access dependencies.
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR009
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR008
              - CR009
              - CR013
      - number: '7.4'
        title: Financial model and execution thresholds
        blocks:
          - type: paragraph
            body: >
              Public scale figures are insufficient to quantify loss absorption or runway. Clear Street says it has
              raised $1.0 billion, but funding raised is not cash available, regulatory capital, or liquidity (CR006).
              Likewise, approximately $16 billion of customer balances measures client assets on the platform, not
              corporate cash or equity capital (CR005). Latka reports $101.9 million of 2025 revenue while explicitly
              showing the underlying source as “Not recorded,” so the figure is a weak signal rather than an auditable
              financial baseline (CR015). Execution complexity is more directly visible: Clear Street reported headcount
              increasing from 773 to 830 during 2026, internal leadership changes, a consumer trading app,
              cryptocurrency spot-trading capabilities, a prediction-market partnership, and planned geographic and
              asset-class expansion (CR010, CR011). The monitoring package should therefore require audited revenue and
              capital, customer and counterparty concentration, credit losses, fraud losses, liquidity stress tests,
              uptime by critical service, and launch-level incident data. Failure to supply those measures—or
              deterioration beyond board-approved limits—should pause underwriting.
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break conditions
            body: >
              Stop underwriting on a material license restriction, customer-protection or capital deficiency,
              unrecovered critical-service outage, unreconciled ledger positions, or a confirmed control failure that
              management cannot remediate within board-approved limits. Pause rather than infer safety when regulator
              records, assurance reports, capital data, or incident history remain unavailable.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR007
              - CR016
          - type: callout
            title: Financial-risk evidence is not decision-grade
            body: >
              Capital raised, customer balances, and a third-party revenue estimate are different metrics. None
              establishes current cash availability, regulatory capital, loss absorption, cash burn, or runway; audited
              financials and regulatory capital reports are required before sizing financial-model risk.
            calloutType: assumption
            claimRefs:
              - CR005
              - CR006
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and Financing Evidence
        blocks:
          - type: paragraph
            body: >-
              Recommendation: research more / track, with medium-low confidence, high risk, and no supportable entry
              valuation from the available public record. The strongest historical anchor is the April 2023 second
              tranche: Clear Street and TechCrunch both reported a $270 million investment, a $435 million total Series
              B, and a $2.0 billion valuation; TechCrunch and Multiples also place the May 2022 first tranche at $1.7
              billion. Current evidence is much less coherent. Multiples reports a $12 billion January 2026
              strategic-round valuation, Sacra reports an approximately $11 billion implied valuation after a January
              2026 Series C, and Tracxn reports $8.2 billion as of February 12, 2026. These marks differ in round label,
              amount, date, and valuation, and none of the retained sources is a primary 2026 financing document. The
              divergence precludes a precise price, target return, hold period, or exit forecast.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV008
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that operating scale may have advanced substantially since the 2023 financing. Clear Street
              currently claims $1.0 billion in capital raised, more than 700 institutional clients, about $16 billion in
              customer balances, roughly $28.4 billion of daily notional volume, and 94% year-over-year transacted
              growth. It also reported 830 employees in July 2026, while its careers page separately describes more than
              800 employees. The anti-thesis is that the available revenue evidence is analyst-estimated rather than
              audited and may be especially sensitive to market conditions: Sacra estimates $1.04 billion of 2025
              revenue and says net financing represented roughly 70% of 2024 revenue. That concentration links valuation
              support to client balances, leverage, spreads, and interest rates rather than to a pure recurring-software
              model. Scale therefore improves the company-quality case but does not resolve entry-price discipline.
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV011
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.3'
        title: Scenarios and Comparable Context
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should use observed reference points rather than invented forecasts. A bull signal would
              be primary confirmation of the $12 billion mark together with audited results consistent with Multiples'
              $940 million round-vintage revenue record or Sacra's $1.04 billion full-year 2025 estimate, plus sustained
              balance and volume growth. A base signal is reconciliation within the roughly $8.2 billion to $11 billion
              range indicated by Tracxn and Sacra, accompanied by disclosed security terms and normalized earnings. A
              bear signal is a reset toward the $2.0 billion 2023 financing reference if revenue quality, client
              balances, or financing economics weaken; that historical price is a reference, not a floor or fair-value
              estimate. Multiples identifies StoneX, Virtu, Groww, XP, FalconX, and Wealthsimple as comparables, but
              their business mixes and the page's mixed fiscal-period data make them directional references rather than
              a defensible peer-multiple valuation.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV015
              - CV016
      - number: '8.4'
        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness remains unproven in the retained evidence. Sacra says the company was preparing for a 2026
              public offering, while Multiples describes a potential listing as early as 2026; neither source
              establishes that a filing, pricing, or listing occurred by the run date. Before underwriting an entry,
              obtain the 2026 financing documents, fully diluted capitalization, liquidation preferences, senior-note
              terms, audited 2024-2025 financials, regulatory-capital schedules, and customer and financing-balance
              concentration. A favorable decision requires reconciled valuation and revenue figures, durable earnings
              through a rate cycle, and a credible liquidity path. Thesis-break triggers include sustained contraction
              in customer balances or daily notional, material deterioration in financing economics, a
              regulatory-capital constraint, inability to reconcile the current valuation marks, or a financing round
              whose preferences make the headline valuation economically misleading.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price Discipline Overrides Company Quality
            body: >-
              Clear Street may be a high-quality growth company, but the retained evidence cannot establish what
              security an investor would buy, at what fully diluted price, with what preferences, or against which
              audited earnings base. The decision should change only when those variables are reconciled.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV015
