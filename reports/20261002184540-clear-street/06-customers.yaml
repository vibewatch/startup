figures:
  - id: "FU001"
    title: "Customer Journey Map: Institutional Onboarding, Multi-Asset Expansion, and Retention Flywheel"
    type: "journey-map"
    summary: "Illustrates the institutional customer lifecycle from clearing migration through multi-asset product expansion and cross-selling loops."
    data:
      items:
        - label: "Phase 1: Infrastructure Discovery & Due Diligence"
          detail: "Hedge funds, quant desks, and broker-dealers evaluate modern clearing replacement for legacy COBOL mainframes."
          touchpoints:
            - "Executive pitch on real-time margin ledger and cloud-native straight-through processing"
            - "Technical review of API latency, FIX connectivity, and execution performance"
            - "Credit assessment, regulatory capital verification, and margin financing terms review"
        - label: "Phase 2: Platform Integration & Account Onboarding"
          detail: "Counterparties establish account structures, fund custodial balances, and configure trading interfaces."
          touchpoints:
            - "Custody and clearing account opening under FINRA and CFTC registered entities"
            - "API key generation, risk limits calibration, and trading desk permissioning"
            - "Initial transfer of margin collateral, cash deposits, and portfolio balances"
        - label: "Phase 3: Core Execution & Securities Lending Utilization"
          detail: "Clients execute active daily flow across equities and options, utilizing securities lending borrow availability."
          touchpoints:
            - "Routing high-volume orders through smart order routing and automated clearing"
            - "Utilizing securities lending desk demand for short sales and hard-to-borrow names"
            - "Real-time portfolio risk monitoring and automated end-of-day margin settlement"
        - label: "Phase 4: Multi-Asset Expansion & Derivative Swaps"
          detail: "Clients expand wallet share by adopting new asset classes, futures clearing, and customized derivative swaps."
          touchpoints:
            - "Institutional FCM onboarding for regulated prediction markets via Kalshi exchange"
            - "Swap desk execution for ETF issuers and institutional macro risk transfer"
            - "Digital asset spot trading and crypto infrastructure integration"
        - label: "Phase 5: Capital Markets Advisory & Ecosystem Lock-in"
          detail: "Established clients leverage corporate investment banking, capital introductions, and pre-IPO private markets."
          touchpoints:
            - "Investment banking mandates for corporate capital raises, M&A, and SPAC listings"
            - "Participation in private secondary market SPVs and syndicate co-investments"
            - "Deep operational embeddedness creating high switching costs to legacy alternatives"
        - label: "Phase 6: Durable Liquidity Advocacy & Counterparty Retention"
          detail: "Long-term counterparties deepen multi-asset balances and cross-clearing margin efficiencies across global trading venues."
          touchpoints:
            - "Unified margin optimization across equities, futures, swaps, and crypto balances"
            - "Joint product development with institutional trading venues and listed ETF sponsors"
            - "Ongoing operational monitoring and counterparty compliance audit reviews"
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU008"
callouts:
  - calloutType: "risk"
    title: "Client Trust Vulnerability from Sworn SDNY Litigation Disclosures"
    body: >
      Sworn testimony in federal court (Batanjany v. Clear Street Management LLC) that senior executives directed the transfer
      of client trading data to an affiliated family office (White Bay) creates acute institutional trust and compliance risks.
      In prime brokerage, client confidentiality regarding trading strategies, borrow demand, and position sizes is paramount;
      substantiated privacy breaches or regulatory sanctions under SEC and FINRA rules could trigger institutional client defections
      to competing prime brokers such as Hidden Road Partners, Interactive Brokers, or tier-one banks.
    claimRefs:
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
  - calloutType: "insight"
    title: "Strategic Asset Expansion via First-to-Market Prediction Market FCM Status"
    body: >
      Clear Street's partnership with Kalshi to become the first institutional FCM clearing member establishes an innovative
      customer acquisition channel. By bridging institutional hedge funds, market makers, and ETF issuers into regulated event
      contracts, Clear Street differentiates its clearing franchise from traditional prime brokers while driving high-margin
      swap desk and clearing fees across a non-correlated asset class.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU011"
