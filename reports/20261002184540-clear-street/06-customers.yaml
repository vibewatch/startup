company:
  name: "Clear Street"
chapter:
  number: 6
  title: "Customers"
  summary: "Clear Street serves over 700 institutional clients across hedge funds, market makers, broker-dealers, ETF issuers, and institutional exchanges, supporting ~$16 billion in customer balances and ~$28.4 billion in daily trading volume. While client expansion is driven by cloud-native multi-asset clearing and strategic institutional partnerships like Kalshi, commercial durability faces counterparty risk, executive departures to competitors, and regulatory litigation over client data privacy and trading desk practices."
sections:
  - id: "customer-segmentation-and-profile"
    title: "Institutional Client Base Segmentation and Buyer Profiles"
    body: >
      Clear Street targets sophisticated financial market participants whose trading velocity, multi-asset strategies,
      or balance sheet requirements are underserved by legacy prime brokerage systems. The firm segments its customer
      base across six primary buyer and counterparty categories: institutional hedge funds, quantitative and algorithmic
      trading groups, market makers and professional trading firms, introducing broker-dealers, asset managers and ETF issuers,
      and corporate advisory or digital asset treasury clients. In institutional hedge funds and proprietary trading groups,
      the primary economic buyers are chief operating officers, portfolio managers, and chief risk officers who require
      real-time risk analytics, seamless margin financing, and automated securities lending demand execution. For introducing
      broker-dealers, Clear Street delivers white-label clearing, trade execution, and regulatory custody, replacing inflexible
      50-year-old COBOL mainframe infrastructures with modern cloud-native APIs. In asset management and structured products,
      Clear Street acts as an institutional Futures Commission Merchant (FCM) and swap desk partner, enabling regulated
      venues like Kalshi and ETF sponsors to structure prediction market derivatives and listed investment vehicles.
      Additionally, through Clear Street Investment Banking, the firm advises corporate and financial clients on capital raising,
      initial public offerings, and digital asset treasury strategy, completing billions of dollars in transaction advisory.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-scale"
    title: "Client Adoption Trajectory, Balance Sheet Scale, and Commercial Milestones"
    body: >
      Commercial traction across Clear Street's clearing and execution platform has scaled substantially since its 2018 inception.
      Official platform metrics reveal that the platform services over 700 institutional clients, custodying approximately
      $16 billion in customer balances and clearing ~550 million shares daily with ~$28.4 billion in average daily notional
      turnover. The firm reported 94% year-over-year transacted growth, driven by expanding institutional client onboarding
      and the rollout of multi-asset clearing capabilities spanning equities, options, futures, fixed income, OTC derivatives,
      and digital assets. Independent third-party data tracking firm GetLatka reports that Clear Street generated $101.9 million
      in revenue in 2025, expanding from $56.4 million reported in 2023. However, GetLatka evaluates Clear Street under SaaS ARR
      benchmarks rather than broker-dealer net interest margin and financing spread models, highlighting persistent public-reporting
      data gaps regarding true client account retention rates, net revenue retention (NRR), and gross revenue retention (GRR).
      To further broaden client reach beyond institutions into individual wealth, Clear Street launched Clear Street Active,
      a dedicated retail trading platform supported by custom design systems and mobile infrastructure, attempting to build a
      bifurcated institutional-and-retail user ecosystem.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
  - id: "named-deployments-and-partnerships"
    title: "Named Customer Proof, Institutional Deployments, and Underwriting Syndicates"
    body: >
      Verified commercial adoption is demonstrated by major institutional partnerships, public underwriting engagements,
      and regulated market integrations. In May 2026, Clear Street announced a milestone strategic partnership with Kalshi,
      the federally regulated prediction market exchange, becoming the first institutional Futures Commission Merchant (FCM)
      to join Kalshi's exchange and clearing house. Under this agreement, Clear Street provides institutional trading access
      to 24/7 regulated event contracts, large-scale risk transfer via block trading, clearing, settlement, and swap desk
      solutions for ETF issuers creating prediction market products. In corporate finance, Clear Street Investment Banking
      has advised on over $2.35 billion in capital markets transactions, serving as bookrunner and advisor for special purpose
      acquisition companies such as Renatus Tactical Acquisition Corp (Nasdaq: RTACU) and Digital Asset Acquisition Corp. (Nasdaq: DAAQU).
      Furthermore, SEC S-1 underwriting agreements for Clear Street Group Inc. demonstrate deep institutional counterparty
      syndication with global investment banks, naming Goldman Sachs, BofA Securities, Morgan Stanley, and UBS Securities as
      representatives alongside Clear Street LLC, including a Directed Share Program for company-related participants.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "retention-risks-and-adverse-litigation"
    title: "Client Retention Vulnerabilities, Litigation, and Privacy Concerns"
    body: >
      Despite rapid customer growth, Clear Street faces severe counterparty, governance, and client durability risks.
      In federal court proceedings before the U.S. District Court for the Southern District of New York (Batanjany et al. v.
      Clear Street Management LLC et al., June 2026), four former FINRA-registered broker-dealers from Clear Street's derivatives
      and securities lending desks provided sworn testimony regarding serious operational and client privacy concerns. Former
      employees, including derivatives operations leader Jordan Brodsky, testified under oath that senior management, including
      CCO Andy Volz, instructed staff to transmit confidential client data to White Bay, the private family investment firm of
      CEO Uri Cohen. Former derivatives CEO Patrick Travers and Managing Director Cory Solomon testified regarding internal
      alarms raised over client privacy, margin requirements, novation compliance, securities lending disclosures under Regulation
      SHO, and the termination of personnel raising 1940 Act fund custody issues. In September 2025, seven derivatives professionals
      resigned simultaneously to join competitor Hidden Road Partners, prompting Clear Street to issue retaliatory 'for cause'
      Form U-5 filings that District Judge Analisa Torres enjoined, finding a likelihood of unlawful retaliation. These sworn
      proceedings expose substantial client trust vulnerabilities, potential regulatory sanctions, and employee churn that
      threaten institutional counterparty retention and prime brokerage relationship durability.
    claimRefs:
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs: []
