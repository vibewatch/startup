evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-statements
    missingEvidence: >-
      Audited financial income statements, GAAP balance sheets, net income, and cash flow disclosures for fiscal years
      2024 through 2026.
    whyItMatters: >-
      Validates whether the claimed $1.0 billion revenue threshold represents net revenues or gross trading notional,
      and confirms operating profitability.
    diligencePath: Request confidential audited financials, FOCUS reports, and draft S-1 registration statements under NDA.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: board-composition-and-voting-control
    missingEvidence: Complete schedule of board of directors seats, independent observer rights, and founder voting share structures.
    whyItMatters: >-
      Determines whether founder Uri Cohen and executive leadership maintain super-majority voting control over Series B
      and Series C preferred shareholders.
    diligencePath: Review certificate of incorporation, investors' rights agreement, and voting agreements in data room.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: independent-cloud-prime-sizing
    missingEvidence: >-
      Granular breakdown separating cloud-native prime brokerage technology spend from aggregate custody and financing
      fee pools at major investment banks.
    whyItMatters: >-
      Prevents precise calculation of Serviceable Addressable Market (SAM) exclusively accessible to independent cloud
      clearing entrants.
    diligencePath: >-
      Review industry surveys from hedge fund operational associations or third-party capital markets benchmarking firms
      (e.g. Coalition Greenwich).
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: uncorroborated-claim
    severity: material
    topic: competitor-financing-spreads
    missingEvidence: >-
      Detailed schedule of client margin interest spreads and securities lending rebate splits across middle-market
      prime broker competitors.
    whyItMatters: >-
      Net financing revenues represent 70% of prime brokerage revenue; private negotiated spread data determines true
      pricing competitiveness versus tier-one banks.
    diligencePath: >-
      Request anonymized rate card benchmarks and prime brokerage fee schedules from institutional hedge fund
      prospective clients during diligence interviews.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-sales-efficiency
    missingEvidence: >-
      List and realized pricing, discounts, minimum commitments, sales-cycle length, customer-acquisition cost, and
      payback by segment and product.
    whyItMatters: >-
      Without realized pricing and acquisition costs, activity growth cannot establish revenue quality or efficient
      go-to-market economics.
    diligencePath: >-
      Request contract samples, rate cards, cohort-level invoicing, sales-pipeline conversion, fully loaded CAC, and
      payback schedules from management.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-runway
    missingEvidence: >-
      Unrestricted cash, regulatory and encumbered cash, cash flow, burn, debt maturities and covenants, planned use of
      funds, runway, and management's next financing trigger.
    whyItMatters: >-
      Reported funding and accounting net income do not establish cash availability, regulatory-capital headroom, or
      financing independence.
    diligencePath: >-
      Obtain audited balance sheets and cash-flow statements, legal-entity liquidity schedules, debt agreements,
      covenant compliance, and a board-approved 24-month capital plan.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: margin-and-risk-adjusted-returns
    missingEvidence: >-
      Gross margin and contribution margin by stream, cost of funds, credit losses, collateral haircuts,
      regulatory-capital allocation, and client-concentration exposure.
    whyItMatters: >-
      The financing-heavy mix may generate accounting profit while consuming balance sheet and exposing earnings to
      rates, leverage, and concentration.
    diligencePath: >-
      Request stream-level management accounts, treasury and asset-liability reports, concentration schedules, stress
      tests, and return-on-capital calculations.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
      - TI003
  - type: conflicting-data
    severity: minor
    topic: platform-scale
    missingEvidence: >-
      A reconciliation of the official 700-plus institutional-client and $16 billion balance snapshot to the later
      2,000-plus client and $17.2 billion interest-bearing-balance figures.
    whyItMatters: >-
      Different dates, client populations, and balance definitions can materially distort revenue-per-client and
      balance-growth analysis.
    diligencePath: >-
      Ask management for dated definitions and bridge schedules for client counts, active accounts, total balances, and
      interest-bearing balances.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: client-retention-metrics
    missingEvidence: Audited client net revenue retention (NRR), gross retention rate (GRR), and client account churn statistics.
    whyItMatters: >-
      Without cohort retention data, investors cannot verify whether customer revenue growth reflects expanding wallet
      share from enduring counterparties or rapid churn masked by top-of-funnel acquisitions.
    diligencePath: >-
      Inspect S-1 registration statement confidential exhibits, prime brokerage monthly client cohort statements, and
      client departure notices.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: client-concentration
    missingEvidence: >-
      Percentage of total clearing revenues and customer balances accounted for by the top 5 and top 10 prime brokerage
      clients.
    whyItMatters: >-
      Prime brokerage businesses frequently face severe customer concentration risk where the loss of one major
      multi-strategy hedge fund can impair clearing margins.
    diligencePath: >-
      Request customer revenue concentration schedules from Clear Street management and cross-reference counterparty
      credit exposure disclosures.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      Full customer roster of 700+ institutional clients beyond publicly announced partners such as Kalshi and SPAC
      advisory clients.
    whyItMatters: >-
      Most institutional hedge funds and proprietary trading firms maintain strict confidentiality agreements,
      preventing public verification of individual customer AUM and usage.
    diligencePath: >-
      Conduct blind customer reference calls with institutional hedge funds and review trade settlement broker
      allocations in public 13F filings.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >
      Regulator-issued examination, disciplinary, capital-deficiency, enforcement, and court records for every relevant
      entity and jurisdiction.
    whyItMatters: >
      Company-disclosed registrations do not establish compliance history, supervisory findings, pending litigation, or
      capital adequacy.
    diligencePath: >
      Pull FINRA BrokerCheck, NFA BASIC, SEC and CFTC records, state and foreign registrations, material court dockets,
      FOCUS reports, and regulator correspondence for all operating entities.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-and-model-risk
    missingEvidence: >
      Audited revenue, cash, regulatory capital, liquidity, burn, credit losses, fraud losses, working-capital needs,
      and customer/counterparty concentration.
    whyItMatters: >
      Capital raised and customer balances do not measure cash available, runway, loss absorption, earnings quality, or
      concentration.
    diligencePath: >
      Obtain audited financial statements, regulatory capital reports, liquidity stress tests, loan and margin books,
      loss vintages, fraud reports, and top-customer and counterparty schedules.
    relatedQuestionRefs:
      - QR005
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: >
      Independent assurance reports, penetration tests, incident chronology, service-level history, recovery test
      results, and remediation aging.
    whyItMatters: >
      Public descriptions establish claimed controls but not operating effectiveness, recovery capability, or the
      absence of incidents.
    diligencePath: >
      Review SOC reports and bridge letters, security assessments, material incidents, RTO/RPO test evidence, uptime by
      critical service, and open remediation items under NDA.
  - type: private-evidence-only
    severity: material
    topic: dependency-concentration
    missingEvidence: >
      Cloud architecture, market venue, bank, custodian, insurer, market-data, liquidity-provider, customer, and
      counterparty concentration schedules.
    whyItMatters: >
      Named vendors alone do not establish substitutability, contractual protections, concentration, recovery options,
      or financial exposure.
    diligencePath: >
      Obtain critical-vendor inventory, dependency maps, contracts, termination rights, business-continuity tests,
      insurance policy terms, and concentration limits with current utilization.
    relatedTableRefs:
      - TR003
  - type: conflicting-data
    severity: material
    topic: current-valuation
    missingEvidence: >-
      Primary documents confirming the January-February 2026 round size, security type, post-money valuation, and
      closing date.
    whyItMatters: >-
      Independent providers report incompatible valuation and round figures, preventing a defensible current price
      anchor.
    diligencePath: Obtain signed financing documents, board approvals, and an issuer-verified fully diluted capitalization schedule.
    relatedQuestionRefs:
      - QV001
      - QV002
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited 2024-2025 revenue, net income, financing-spread, balance-sheet, and regulatory-capital schedules.
    whyItMatters: >-
      Analyst estimates cannot establish revenue quality, normalized earnings, capital intensity, or a supportable
      valuation multiple.
    diligencePath: Review audited statements and reconcile revenue definitions, periods, and denominators to the valuation date.
    relatedQuestionRefs:
      - QV003
      - QV004
      - QV006
  - type: private-evidence-only
    severity: material
    topic: security-terms
    missingEvidence: >-
      Fully diluted ownership, liquidation preferences, anti-dilution rights, senior-note terms, and employee option
      overhang.
    whyItMatters: >-
      Headline post-money valuation can differ materially from preference-adjusted investor economics and dilution
      exposure.
    diligencePath: Review the cap table, charter, side letters, note agreements, and proceeds waterfall under downside exits.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Current primary evidence of IPO filing status, listing timetable, underwriter mandate, or another credible
      liquidity path.
    whyItMatters: >-
      A target hold period or exit return requires a verifiable route to liquidity rather than analyst descriptions of
      preparation.
    diligencePath: Check issuer and regulatory filings, then obtain board-approved capital-markets plans and underwriter materials.
    relatedQuestionRefs:
      - QV007
