  - id: TP002
    title: Core Capability and Feature Matrix Across Clearing Platforms
    columns:
      - Buying & Architectural Criteria
      - Clear Street
      - Bulge Bracket Incumbents
      - Apex Clearing / DriveWealth
      - Broadridge / Post-Trade SaaS
    rows:
      - - Real-Time Single Ledger
        - Fully unified single ledger across execution, margin, and clearing
        - Fragmented overnight batch reconciliation across legacy systems
        - Modern cloud database optimized for retail account balances
        - Multi-system post-trade data synchronization
      - - Average Client Onboarding Speed
        - Rapid ~14-day digital onboarding workflow
        - 60 to 180 days across legal, risk, and operations committees
        - Instantaneous API onboarding for retail end-users
        - Dependent on underlying broker-dealer operations
      - - Multi-Asset Coverage
        - Equities, options, futures, fixed income, crypto, prediction markets
        - Comprehensive global coverage across every major institutional asset
        - Primarily U.S. equities, fractional shares, and select options
        - Broad multi-asset transaction reporting software
      - - Institutional Portfolio Margin & Locate Desk
        - Real-time continuous portfolio margin and automated locate APIs
        - Deep bespoke portfolio margin desks with massive captive locate supply
        - Limited standard Reg T and basic margin; retail locate focus
        - Margin calculation software modules without principal balance sheet
      - - API-First Architecture & WebSockets
        - Native REST, WebSocket, and gRPC endpoints for all Studio functions
        - Legacy FIX protocols and batch file transfers (SFTP/SWIFT)
        - Modern RESTful APIs designed for fintech app integration
        - Enterprise API wrappers around mainframe processing engines
      - - Balance Sheet & Financing Depth
        - ~$1.0B equity raised, $16B+ balances; growing but mid-market scale
        - Trillion-dollar balance sheets with global central bank access
        - Moderate balance sheet geared toward retail margin financing
        - Non-bank technology provider (zero balance sheet financing)
    notes: "Matrix compares verified platform features and technical capabilities based on analyst research, vendor documentation, and industry evaluations."
