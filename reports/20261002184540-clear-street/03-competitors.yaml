callouts:
  - calloutType: insight
    title: Middle-Market Wedge Overcomes Incumbent Balance-Sheet Asymmetry
    body: >
      While bulge bracket institutions maintain insurmountable balance sheets for trillion-dollar mega-funds,
      their rigid operational structures leave emerging and mid-sized managers severely underserved. Clear
      Street's modern tech stack and rapid 14-day onboarding provide a powerful wedge to capture institutional
      clients seeking responsive prime brokerage, serving as a primary stepping stone to multi-asset expansion.
    claimRefs:
      - CP002
      - CP007
      - CP013
  - calloutType: risk
    title: Multi-Homing and Retaliatory Incumbent Pricing Threaten Customer Retention
    body: >
      Institutional hedge funds rarely rely entirely on a single prime broker, frequently multi-homing to
      diversify counterparty exposure. If bulge bracket incumbents upgrade legacy infrastructure or selectively
      discount margin lending rates for mid-sized funds, Clear Street risks losing high-margin financing balances
      unless it continuously broadens its securities lending inventory and asset class coverage.
    claimRefs:
      - CP011
      - CP014
      - CP015
