  - id: TP003
    title: Monetization Models, Pricing Mechanics, and Institutional Tradeoffs
    columns:
      - Competitor Class
      - Primary Pricing Mechanism
      - Included Capabilities
      - Pricing Opacity & Discounts
      - Strategic Implication
    rows:
      - - Bulge Bracket Prime Brokers (Goldman, MS)
        - Net interest margin spreads + bundled execution commissions
        - Full prime custody, synthetic swaps, capital intro, bespoke risk
        - Highly opaque; discounted heavily for large fund asset pools
        - Squeezes smaller funds; creates pricing barrier for non-tier-1 managers
      - - Clear Street
        - Spread on margin lending, stock borrow fees, and execution
        - Studio workstation, real-time risk, portfolio margin, clearing APIs
        - Transparent tier-based margin schedules and competitive borrow rates
        - Middle-market hedge funds obtain tier-1 tools without multi-billion AUM
      - - Retail Cloud Clearers (Apex, DriveWealth)
        - Per-account custody fees + per-trade clearing fees + PFOF/spreads
        - Micro-investing APIs, fractional shares, tax reporting, automated ACATS
        - Published transaction pricing schedules with volume discounts
        - High unit margins on retail accounts, unviable for institutional prime
      - - Enterprise Tech Vendors (Broadridge, SS&C)
        - Annual software licenses + recurring post-trade transaction fees
        - Regulatory reporting software, proxy processing, back-office modules
        - Multi-year enterprise contracts with tiered volume minimums
        - Pure software expense for broker-dealers without balance sheet support
      - - Specialized Point Solutions (EMS/Locate Desks)
        - Monthly workstation seat fees (SaaS) + per-locate borrow fees
        - Algorithmic execution routing and standalone short locate desks
        - Transparent seat pricing ($1k-$3k/user/mo) plus variable borrow markups
        - Fragmented software stack; lacks integrated clearing and settlement
    notes: "Pricing structures reflect institutional market conventions and analyst research comparing financing spreads, technology fees, and transaction charges."
