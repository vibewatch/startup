chapter:
  number: 1
  title: "Company Overview"
  summary: "Clear Street is a cloud-native financial technology firm and prime broker founded in 2018 in New York that has scaled to over $1.0 billion in capital raised and reached an estimated $12 billion valuation in early 2026. The firm modernizes capital markets infrastructure across clearing, custody, execution, and active trading while managing executive leadership transitions and navigating deferred IPO plans."
sections:
  - id: "identity-and-business-model"
    title: "Corporate Identity, Modern Architecture, and Business Model"
    body: "Founded in September 2018 in New York, Clear Street operates as an institutional-grade financial infrastructure provider and prime broker designed to replace legacy mainframe systems with a modern, cloud-native clearing and custody engine (CO001, CO002, CO004). The firm provides multi-asset clearing, custody, execution, securities lending, and margin financing to hedge funds, professional traders, institutional investors, and sophisticated individual market participants (CO001, CO004, CO007). In addition to institutional prime brokerage, Clear Street launched Clear Street Private Markets to provide accredited clients with pre-IPO special purpose vehicle (SPV) exposure, beginning with Databricks, while also expanding active retail trading capabilities via proprietary desktop and mobile applications featuring AI-driven trading tools (CO007, CO008, CO014). Transparent volume-tiered equity pricing, options commissions, and benchmark-linked financing underpin its monetization model across capital markets workflows (CO015)."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO004"
      - "CO007"
      - "CO008"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership Transitions and Governance Architecture"
    body: "Clear Street was co-founded by Sachin Kumar and Chris Pento, alongside Executive Chairman Uri Cohen, who returned to the Chief Executive Officer role on June 1, 2026, following the planned executive retirement of Ed Tilly (CO002, CO003, CO009, CO010). Under Tilly's two-year tenure as CEO, the firm expanded internationally across North America, Europe, and Asia, crossed the $1.0 billion annual revenue threshold, and substantially increased its multi-asset product velocity before Tilly transitioned back to an advisory role and board seat (CO003, CO009). The executive bench was subsequently restructured in July 2026 with promotions from within, appointing Andy Volz and John DiBacco as Co-Presidents, Megan Cruse as Chief Operating Officer, Jon Daplyn as Chief Technology Officer, and Michael Stover as Chief People and Performance Officer (CO005, CO011). This governance realigns operational, technical, and commercial leadership to balance institutional prime brokerage growth with active trading expansion (CO005, CO011)."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO005"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Capitalization Profile, Valuation Discrepancies, and Scale Trajectory"
    body: "Clear Street's capitalization trajectory is characterized by rapid private funding rounds and material valuation divergence across independent secondary markets and tracker databases. Company filings and official disclosures report $1.0 billion in total capital raised, while venture tracker Tracxn records $649 million across six rounds and private securities platform Forge Global reports $885.47 million in cumulative financing culminating in a $135.39 million Series C round in January 2026 (CO004, CO006, CO012, CO013). Private funding round valuations jumped from $2.0 billion-$2.1 billion in Series B tranches up to $12 billion in early 2026 backed by institutional investors including Baillie Gifford, SBI Holdings, Prysm Capital, and IMC Investments (CO006, CO008, CO012, CO013). However, following confidential or preliminary S-1 preparations in January 2026, Clear Street officially paused its IPO plans in February 2026 amid volatile market conditions, redirecting near-term capital toward private markets infrastructure, crypto asset expansion, and core clearing capacity serving over 700 institutional clients and 830 employees worldwide (CO004, CO005, CO008, CO012)."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO008"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
