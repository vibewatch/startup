            - Voice-assistant control
            - Pet Care Mode and Baby Care Mode
          outputs:
            - Targeted household-cleaning routines
            - Lower-touch day-to-day operation
        - label: Perception and decisioning
          detail: Sensor and model layer that routes cleaning behavior
          modules:
            - Dual 1080p RGB cameras on Flow 2
            - LiDAR or camera-led mapping on current smart-cleaning stack
            - DirtSense and object-recognition logic
          outputs:
            - Room maps
            - Obstacle avoidance
            - Adaptive cleaning mode selection
        - label: Cleaning execution
          detail: On-floor actuation hardware
          modules:
            - 30,000 to 31,000 Pa suction claims on current flagship messaging
            - DualFlow anti-tangle brush system
            - Track or triangular mop systems with pressure and edge handling
          outputs:
            - Vacuum pickup
            - Wet scrubbing
            - Carpet and edge transitions
        - label: Dock and service layer
          detail: Base-station automation and upkeep
          modules:
            - Hot-water mop washing
            - Warm-air drying
            - Self-emptying or dust compression
            - Optional water refill and drainage connection
          outputs:
            - Reduced daily manual maintenance
            - Longer unattended cleaning intervals
        - label: Feedback and support
          detail: Post-cleaning review and after-sales loop
          items:
            - Cleaning reports and history
            - Troubleshooting and support surface
            - Service-location network
          outputs:
            - Usage feedback
            - Support escalation path
    approximationNotes: >-
      This stack synthesizes the assigned public sources into layers; exact hardware varies by SKU and the figure should
      be read as a family architecture, not a single bill of materials.
    claimRefs: [CE007, CE008, CE009, CE010, CE012, CE014]
callouts:
  - calloutType: strength
    title: Hands-off cleaning is the clearest product advantage
    body: >-
      Across official pages, the 2025 guide, CES 2026 launch coverage, and Vacuum Wars, Narwal repeatedly leads with
      self-cleaning mops, anti-tangle hardware, adaptive sensing, and dock automation. The repetition across both vendor
      and reviewer narratives suggests the product is being bought and judged as a convenience system, not just as a
      suction benchmark.
    claimRefs: [CE008, CE009, CE010, CE012]
  - calloutType: risk
    title: Public proof is thinner than the marketing surface
    body: >-
      Narwal's public materials describe many architectural and trust attributes, but the assigned pool includes only one
      current independent product review, no direct security or privacy documentation, and no public warranty or repair
      metrics. That means strong feature claims are easier to verify than durable operational quality.
    claimRefs: [CE006, CE011, CE013]
  - calloutType: recommendation
    title: Underwrite as premium connected hardware, not as an extensible platform
    body: >-
      The evidence supports Narwal as a premium connected-device and docking-system vendor with rapid consumer-product
      iteration. It does not yet support a thesis built on open APIs, developer adoption, or unusually transparent trust
      operations.
    claimRefs: [CE007, CE012, CE014]
