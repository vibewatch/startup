company:
  name: Narwal Robotics
chapter:
  number: 4
  title: Financials
  summary: >-
    Narwal's assigned 2026 public evidence supports a premium, hardware-led revenue model built
    around robot vacuum-and-mop device sales priced from $699.99 to $1,299.99, with promotions
    that can move materially below list. Public scale proxies are strong, but the refresh pool
    still does not disclose revenue, gross margin, burn, runway, CAC, or realized pricing, so
    underwriting remains bounded by disclosure gaps and China hardware cost exposure.
sections:
  - id: revenue-model
    title: Revenue model and public pricing architecture
    body: >-
      The assigned refresh pool points to a straightforward consumer hardware monetization model:
      Narwal's current public storefront displays three active robot vacuum-and-mop systems at
      $699.99, $1,099.99, and $1,299.99, while its own 2025 buyer guide frames the premium robot
      vacuum segment at roughly $900-$1,500. That combination supports a view that Narwal is
      selling premium household cleaning hardware rather than a visibly recurring software product.
      The same materials also show that realized pricing is unlikely to equal list price all year:
      the homepage advertises October Prime Day discounts of up to 57% off the full vacuum lineup.
      For financial underwriting, displayed prices are useful only as a reference point until management
      provides realized ASPs, channel mix, return rates, and any retailer or promotional
      concessions by SKU.
    claimRefs: [CI001, CI002, CI003, CI010]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: operating-economics
    title: Operating leverage, service load, and cost sensitivities
    body: >-
      Public scale signals are meaningful but still indirect. Narwal's reviewed materials emphasize
      users, households, patents, service locations, and employee count instead of reported
      financial statements, which gives some confidence that the business has built a real installed
      base and operating footprint but not enough to prove revenue quality or margin durability.
      For a hardware company, that footprint matters because after-sale service, warranty handling,
      spare parts, and channel support can drive gross margin and working-capital requirements just
      as much as the initial sale. External signals in the pool add two caution flags: U.S.
      Section 301 tariff administration remains active, and a public China robot-vacuum comparable,
      Roborock, has seen meaningful profit-margin compression. Together, those signals suggest that
      Narwal's margin path is likely sensitive to tariffs, promotions, warranty load, and inventory
      turns even though the public pool does not quantify them.
    claimRefs: [CI004, CI005, CI006, CI007, CI009, CI012, CI013, CI014, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and underwriting blockers
    body: >-
      The core underwriting problem is not whether Narwal has market presence; it is that the
      assigned public evidence does not disclose the financial variables needed to judge capital
      adequacy. Within this pool, there is no contemporaneous revenue, ARR, gross margin, burn,
      cash balance, runway, debt, or next-round trigger, and there are no public CAC, payback,
      repeat-purchase, or warranty-claim disclosures that would let an investor convert product
      traction into unit economics. That means the chapter can support a bounded verdict: Narwal
      looks like a scaled premium hardware exporter with real consumer demand signals, but current
      list pricing, promotion depth, and service footprint do not by themselves establish revenue
      quality or financing sufficiency. Management diligence should therefore focus on realized
      pricing, returns, channel economics, warranty reserves, and current cash-versus-burn before
      any investment case relies on margin expansion or self-funded growth.
    claimRefs: [CI008, CI011, CI015, CI016]
