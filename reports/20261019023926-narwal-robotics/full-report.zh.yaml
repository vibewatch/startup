      - number: '5.3'
        title: 部署成熟度、服务覆盖与证据质量
        blocks:
          - type: paragraph
            body: >-
              Narwal 最强的成熟度信号是消费部署规模和减少人工介入的维护主张。美国商店宣传覆盖 30+ 个国家和市场、6M+ 家庭、1,500+ 项专利和 500+
              个服务地点；当前旗舰材料还强调基站可洗、烘干、集尘，部分型号可接入管道。这说明产品系统旨在安装后尽量减少日常人工介入。弱点在于证据颗粒度：指定证据没有维修率、保修索赔、备件周转或应用运行时间的直接现场数据，因此服务覆盖可见，但规模化服务质量不可见。
            claimRefs:
              - CE003
              - CE004
              - CE010
              - CE011
      - number: '5.4'
        title: 差异化、信任信号与技术风险
        blocks:
          - type: paragraph
            body: >-
              Narwal
              的差异化建立在减少维护和情境感知清洁上，而不是公开开发者生态或专有软件分发。官方和独立来源反复提到自动清洁拖布、防缠绕刷、障碍识别和自动化基站工作。这是可信的高端硬件故事，但公开证据并不均衡。Vacuum
              Wars 认为 Flow 2 避障和处理毛发表现强，但也指出其对干涸污渍的拖地表现低于平均水平，并有应用可靠性投诉。Edgechat 还称 Narwal Flow 获得 TÜV Rheinland
              网络安全认证，但指定证据没有底层证书或当前类似信任中心的披露，因此隐私、联网设备安全和可靠性判断只能部分验证。
