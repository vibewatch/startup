      - number: '7.3'
        title: 缓释措施、监控指标与止损标准
        blocks:
          - type: paragraph
            body: >-
              Narwal 确有一些可见的缓释证据。早期机队事件期间，公司设立了七条维修线，并在 20
              天内解决急性故障潮；管理层现在称，海外发布通常会比中国晚约六个月测试。这些是可信的流程信号，但不能替代当前关于故障率、维修周转、退货退款率或隐私安全控制的披露。因此，正确的投资姿态是要求可量化的监控指标，而不是接受定性安慰。


              实际上，如果 Narwal 无法证明保修结果持续改善、在品类商品化下仍能维持高端定价，以及在线下和合作门店暴露增加时保持渠道经济纪律，投资论点就应被推翻。开放尽调清单在此尤其重要，因为指定 2026
              年证据对产品和渠道叙事很丰富，却缺少独立佐证的法律、财务和储备质量指标。
            claimRefs:
