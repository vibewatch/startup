        title: 家庭买方清晰可见，但客户经济性不可见
        blocks:
          - type: paragraph
            body: >-
              指定证据显示，这是家庭消费业务，而非已披露的企业客户账本。Narwal 美国商店列出的消费级扫拖机器人 SKU 价格为 $699.99 至 $1,299.99；Reviewed 的测试文章也把旗舰 Flow 2
              链接到同为 $1,299.99 的 Amazon
              购买路径。因此，客户最清晰的分层是家庭需求：高端混合地面家庭、养宠家庭，以及在不同功能层级和渠道间比较的消费者。缺少的仍是渠道拆分、复购行为和零售商集中度公开披露，因此漏斗的经济持久性仍是推断而非测量。
