  - id: FE001
    title: 产品架构图
    type: stack
    summary: Narwal 的公开架构把家庭感知和控制置于清洁硬件及维护基站之上。
    data:
      layers:
        - label: 家庭输入
          detail: 系统需要识别的污渍类型和房间环境
          items:
            - 宠物毛发和带入的碎屑
            - 湿洒污渍和干涸污渍
            - 按房间区分的家庭日常
          outputs:
            - 清洁优先级信号
        - label: 体验与控制
          detail: 面向消费者的编排和家庭场景控制
          items:
            - App 排程和房间选择
            - 语音助手控制
            - Pet Care Mode 和 Baby Care Mode
          outputs:
            - 定向家庭清洁流程
            - 更少人工介入的日常运行
        - label: 感知与决策
          detail: 引导清洁行为的传感器和模型层
          modules:
            - Flow 2 上的双 1080p RGB 摄像头
            - 当前智能清洁产品栈中的 LiDAR 或摄像头建图
            - DirtSense 和物体识别逻辑
          outputs:
            - 房间地图
            - 障碍物规避
            - 自适应清洁模式选择
        - label: 清洁执行
          detail: 地面上的执行硬件
          modules:
            - 当前旗舰宣传中声称的 30,000 至 31,000 Pa 吸力
            - DualFlow 防缠绕刷系统
            - 带压力和边缘处理能力的履带式或三角形拖布系统
          outputs:
            - 吸尘拾取
            - 湿式擦洗
            - 地毯和边缘过渡
        - label: 基站与服务层
          detail: 基站自动化和维护
          modules:
            - 热水洗拖布
            - 暖风烘干
            - 自动集尘或压缩尘盒
            - 可选的自动补水和排水连接
          outputs:
            - 减少日常人工维护
            - 更长的无人值守清洁间隔
        - label: 反馈与支持
          detail: 清洁后的复盘和售后闭环
          items:
            - 清洁报告和历史记录
            - 故障排查和支持入口
            - 服务网点网络
          outputs:
            - 使用反馈
            - 支持升级路径
    approximationNotes: 该架构栈综合了指定公开来源并按层归纳；不同 SKU 的确切硬件有所不同，因此应将其理解为产品家族架构， 而非单一物料清单。
