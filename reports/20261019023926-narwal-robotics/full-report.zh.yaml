      - number: '6.2'
        title: 有独立使用证据，但主要来自编辑部家庭测试
        blocks:
          - type: paragraph
            body: >-
              Narwal 确有公开证据表明真实用户在家中使用产品，但大部分证据来自有署名的编辑测试，而非公开客户名单或可审计的零售 sell-through。Vacuum Wars 在有狗的忙碌家庭中使用 Flow 2
              三个月；Reviewed 围绕宠物、地毯和厨房污渍测试 Flow 2 数周；HGTV 也在真实住宅中测试多个 Narwal 型号，并将 Freo Pro 评为首选。这比只展示客户 logo
              更有说服力，因为它展示了真实环境中的安装、导航和清洁表现，但仍不足以证明客户扩张、续购或按 cohort 划分的广泛安装基数参与度。
