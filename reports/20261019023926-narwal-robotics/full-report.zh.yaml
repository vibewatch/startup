      - number: '3.3'
        title: 耐久性、商品化与既有厂商应对
        blocks:
          - type: paragraph
            body: >-
              护城河问题仍未解决，因为现有证据中的 Narwal 公开差异化主要靠功能，而反向证据显示该品类已进入红海竞争。China Business Insider 称，Ecovacs 仍控制中国扫地机器人市场超过
              35%；但 Roborock 和 Dreame 正凭借算法、工业设计和激进定价抢占份额，Narwal 被描述为势头增强，而非已锁定平台领导者。Narwal
              当前公开叙事更强调自动化、低噪音和高端体验，而不是分销排他性或标准控制。由于缺少复购、零售商集中度、保修索赔或多平台使用数据，现有证据支持的是可信的高端挑战者故事，而非已验证的持久护城河。
            claimRefs:
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: Narwal 最清晰的公开切入口是安静的家庭自动化
            body: 在指定证据中，Narwal 最强的差异化是更安静、免手操作的硬地面清洁，而不是已验证的价格或互操作性优势。
            calloutType: insight
            claimRefs:
              - CP007
              - CP011
              - CP014
          - type: callout
            title: 仅靠功能领先，可能很容易被资金更充足的同业追上
            body: 反向证据显示既有厂商和同业迭代很快，因此 Narwal 需要超越高端硬件功能，才能证明防御力持久。
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开定价结构
        blocks:
          - type: paragraph
            body: >-
              指定更新证据指向简单的消费硬件变现模式：Narwal 当前公开商店展示三款在售扫拖机器人，价格分别为 $699.99、$1,099.99 和 $1,299.99；其 2025
              年买家指南则将高端扫地机器人区间定为约 $900-$1,500。这说明 Narwal 销售的是高端家庭清洁硬件，而不是明显具备持续性的软件产品。同样的材料也显示，全年实际成交价不太可能等于标价：首页宣传 10 月
              Prime Day 全系列扫地机器人最高 57% 折扣。在管理层提供按 SKU 划分的实际 ASP、渠道组合、退货率及零售或促销让利前，展示价格只能作为参考。
