      - number: '1.2'
        title: 资本与利益相关方基础
        blocks:
          - type: paragraph
            body: >-
              证据中的融资信息较集中，方向也基本一致。Multiples 记录了 2020 年 4 月的 $14M B 轮融资，以及 2025 年 4 月让 Narwal 估值达到 $2.4B 的 $100M E
              轮融资；最新一轮的领投方为 Beijing Robot Industry Fund 和 Tencent。同一份资料称公司 2024 年收入为 $200M、同比增长
              130%，但这些仍是附着在募资背景中的非上市公司数据，并非经审计披露。公开利益相关方图谱也不完整：机构层面的投资者可见，但指定证据没有呈现现任董事会名单，也没有呈现 Junbin
              之外的管理层梯队，因此控制权和继任问题仍未解决。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
