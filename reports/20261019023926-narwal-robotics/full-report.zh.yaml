      - number: '8.3'
        title: 情景框架与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              因此，情景区间是方向性的，并非经过数字化投资判断。乐观情景下，Narwal 将把产品领先和高端 ASP
              转化为接近中国最佳扫地机器人同业的规模经济，同时证明隐私、产品质量和渠道执行风险可控。基准情景更保守：高端定位维持品牌相关性，但在缺少可审计财务和实时价格时，投资者应坚持估值纪律，而非追逐动量。悲观情景很直接：如果产品局限、隐私担忧或倍数压缩在
              Narwal 披露更强规模证据前发生，私募市场定价可能跑在证据前面。剩余工作不是继续讲故事，而是对融资条款、经审计运营指标以及治理敏感产品风险的整改证据进行文件级尽调。
