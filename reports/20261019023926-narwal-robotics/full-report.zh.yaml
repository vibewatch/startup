      - number: '6.3'
        title: 持久性取决于仍然混杂的支持与信任信号
        blocks:
          - type: paragraph
            body: >-
              现有证据中，持久性和扩张最强的信号是支持服务代理指标，而不是正式留存指标。Narwal 提供标准消费硬件组合：一年有限保修、可选延保和 30
              天退货政策；但独立评测也提醒，替换部件和美国保修服务可能比大型竞争对手更难获得。此外，韩国消费者机构测试发现 Freo Z Ultra 存在应用认证缺陷，厂商修复前可能暴露照片；一宗 2025
              年美国消费者案件在带有禁止重新提起同一诉讼效力的驳回前达成原则性和解。这些事项没有一项能证明流失，但合在一起说明 Narwal 的公开客户故事仍偏向获客，而非长期留存或抵御集中度风险。
