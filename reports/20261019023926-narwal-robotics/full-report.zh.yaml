            body: >-
              Narwal 销售的是高端家庭清洁产品组合，而不是通用机器人平台。全球产品页列出 Flow 2、Flow、Freo Z10 Ultra、Freo Z Ultra、Freo Z10、Freo X10
              Pro、Freo X Ultra、Freo Pro 和 S30 Series；美国商店则明确把 Flow 2 作为旗舰，并将 Freo 20 和 Freo 20 Edge
              定价在其下方。这是一条面向消费者的经典高、中、低产品梯度，让买方在自动化深度和价格之间取舍。公开规模信号方向积极，但公司控制的页面对安装基数和专利数量说法不一，因此产品组合宽度清晰，公开基准的精确度却不足。
