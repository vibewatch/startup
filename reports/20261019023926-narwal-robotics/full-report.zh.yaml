  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Narwal 当前证据包呈现的是可信的高端消费硬件故事，而不是足以支撑买入的投资案例。公司正在发布新的旗舰产品，公开销售约 $1.3k-$1.5k 的 Flow
              2，并受益于独立研究仍认为增长迅速的扫地机器人市场。但同一证据包缺少 Narwal 当前融资价格、资本表优先权、经审计收入规模和利润率状况。证据中最好的公开估值锚点是 Dreame 据报 $9.6 billion
              的 IPO 前融资，但该基准对应的是大得多的已披露收入和出货规模。综合来看，当前无法支持买入；更纪律化的做法是继续把 Narwal 放在“继续研究”轨道上，等待价格和财务披露追上高端产品叙事。
