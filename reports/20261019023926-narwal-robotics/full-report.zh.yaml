              - CO009
      - number: '1.3'
        title: 里程碑、更新变化与风险背景
        blocks:
          - type: paragraph
            body: >-
              更新证据显示，Narwal 仍在推出可见的产品和市场进入里程碑，而不只是重复旧融资故事。Multiples 将公司与 2020 年的 T10、2022 年的 Freo 系列以及 2025 年 E 轮融资前更强劲的
              2024 年收入表现联系起来；GearBrain 则称 Narwal 在 CES 2026 展示 Flow 2、V50 和 U50，推动更完整的智能清洁生态。不过，警示信号同样重要。Multiples
              对总部所在地的表述前后不一，Narwal 自有渠道的规模 KPI 也互相矛盾；尽管美国零售和电商品牌面临的网络无障碍诉讼仍处于高位，现有证据并未确认 Narwal
              特有的公开法律事件。因此，本章适合为后文复用公司身份信息提供锚点，但不足以完成治理或统一封面指标的尽调。
