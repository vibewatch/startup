      - number: '8.2'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              正向论点始于看起来真实而非 aspirational 的高端定位。Narwal 自有页面展示了庞大的安装用户基数、广泛地域覆盖，以及围绕 AI
              清洁自动化的发布节奏。独立报道总体支持这一产品野心：评测者看到了真实的自动化提升和复杂拖地能力，CES 报道也把 Flow 2
              视为旗舰，而不是低价挑战者。反向论点是，产品野心的公开证据比持久经济性的证据更容易找到。一篇评测仍指出其高绒地毯和边缘清洁弱点，Channelnews 也报道某款 Narwal
              型号存在隐私和认证问题，若未解决可能损害信任。缺少当前收入、毛利率或融资条款披露，使看涨论点仍是证据不完整，而非投资已完成。
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
