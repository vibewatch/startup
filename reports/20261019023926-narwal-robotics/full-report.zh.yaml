    sections:
      - number: '1.1'
        title: 公司身份与运营面
        blocks:
          - type: paragraph
            body: >-
              现有证据足以讲清 Narwal 的身份，但叙事仍偏向公司自述。Narwal 自有品牌材料将公司定位为以 AI 为先的家庭清洁自动化企业，起点是创始人 Junbin 对脏乱地面的困扰；Multiples 则称其为
              2016 年成立、面向北美、欧洲和亚洲消费渠道销售的私营智能清洁机器人公司。官网快照也显示，公司采用高端消费定价，而非企业硬件定价。更不稳定的是规模层面：Narwal
              在关于我们页面披露了一套用户数和专利数，在首页又披露了更大的家庭数、专利数和服务地点数，但两套数据没有共同分母或日期标记。
