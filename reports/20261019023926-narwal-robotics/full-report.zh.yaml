      - number: '4.2'
        title: 经营杠杆、服务负担与成本敏感性
        blocks:
          - type: paragraph
            body: >-
              公开规模信号有意义，但仍是间接的。Narwal
              被审阅的材料强调用户、家庭、专利、服务地点和员工数，而不是财务报表；这说明公司确实建立了安装基数和运营足迹，却不足以证明收入质量或利润率韧性。对硬件公司而言，这些规模很重要，因为售后服务、保修处理、备件和渠道支持，对毛利和营运资本的影响不亚于初次销售。证据中的外部信号又带来两个警示：美国
              Section 301 关税管理仍在持续，公开的中国扫地机器人可比公司 Roborock 也经历了明显的利润率压缩。因此，尽管公开证据没有量化，Narwal
              的利润率路径很可能对关税、促销、保修负担和库存周转敏感。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI009
              - CI012
              - CI013
              - CI014
              - CI015
          - type: table
