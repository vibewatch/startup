  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Narwal 当前较窄的市场边界。Dealroom 和 EquityZen 都将公司归入家庭机器人或智能清洁机器人领域；Dealroom
              还称，公司通过线上直营和大型零售商向住宅家庭销售。因此，近期估算应纳入家用扫拖机器人硬件、内置自主功能，以及与家庭地面清洁相关的配件或耗材持续支出。不能直接把整个清洁自动化市场都算进去，因为商业或工业清洁的买方路径、运行时间要求和服务模式，与
              Narwal 面向家庭用户材料所描述的家庭升级路径不同。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
      - number: '2.2'
        title: 估值口径与品类结构
        blocks:
          - type: paragraph
            body: >-
              尽管 Narwal 的公司特定服务市场仍不透明，品类层面的公开数据方向较为清晰。Global Market Insights 估计，机器人吸尘器品类 2025 年规模为 USD 12.5 billion，2026
              年为 USD 14.4 billion，2035 年将达到 USD 30.9 billion。Statista 更宽泛的家电展望也表明，扫地机器人等联网设备仍是家电支出中的增长细分，但这只是宏观邻近指标，并非
              Narwal 特有的需求测量。更与估值相关的是，当前品类价值集中在地面清洁机器人、高度自主运行和线上分销，而不是泛化的“智能家居”大类。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
