      - number: '4.3'
        title: 资本充足性与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              投资判断的核心问题不是 Narwal 有没有市场存在感，而是指定公开证据没有披露评估资本充足性所需的财务变量。现有证据没有当期收入、ARR、毛利率、烧钱、现金余额、现金跑道、债务或下一轮触发条件，也没有公开
              CAC、回本期、复购或保修索赔数据，投资者无法据此把产品势头转换为单位经济模型。因此，本章只能给出有限判断：Narwal
              像一家已经形成规模、拥有真实消费需求信号的高端硬件出口商，但当前标价、促销深度和服务足迹本身不能证明收入质量或融资充足性。管理层尽调应先聚焦实际成交价、退货、渠道经济、保修准备金以及当前现金与烧钱，再考虑利润率扩张或自我造血增长。
            claimRefs:
              - CI008
              - CI011
              - CI015
              - CI016
