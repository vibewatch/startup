      - number: '7.2'
        title: 按失效模式划分的风险登记
        blocks:
          - type: paragraph
            body: >-
              监管和法律登记更关乎证据不对称，而不是已被证实的现行执法事件。Narwal
              自有材料强调摄像头、AI、清洁历史分析、应用控制和语音助手，这扩大了隐私、网络安全、互操作性和产品责任风险面。但指定来源没有当前认证、事件披露惯例、数据留存控制或按司法辖区划分的设备合规文件公开证据。因此，法律和监管风险是实质性的，但证据不足，并非已被证伪。


              运营证据更扎实。公司经历过全机队故障，近期仍面临未解决的 BBB 投诉，安装基数和国际复杂度也在扩大。合作伙伴依赖同样真实：Narwal 正深入发展自营零售和 Huawei
              关联商店，同时把渠道组合转向线下。因此，执行风险除产品质量外，还包括分销商和零售表现、演示质量、逆向物流及潜在渠道冲突。
