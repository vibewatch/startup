  - id: TV002
    title: 正方论点 / 反方论点表
    columns:
      - 观察维度
      - 正方论点
      - 反方论点
      - 哪些事实会改变判断
    rows:
      - - 高端定位
        - Flow 2 的发布时机、奢侈品牌式定位和高端标价，支撑其确实采取高端品牌姿态。
        - 仅凭高端 ASP 不能证明可重复性、利润率或规模化支付意愿。
        - 展示经审计的销售出货、复购和毛利率证据。
      - - 产品验证
        - 独立报道将其描述为拥有先进自动化和 AI 清洁功能的真正旗舰产品。
        - 独立评测也发现其贴边清洁较弱，在高绒地毯上的表现不佳。
        - 更多第三方耐久性和保修数据，才能区分新鲜感与持久优势。
      - - 品类背景
        - 独立市场数据集仍为扫地机器人提供了强劲的长期增长叙事。
        - 品类规模大，并不保证领先的品类经济性或有利的入场价格。
        - Narwal 近期独立市场份额或盈利数据将加强这一判断链条。
      - - 治理 / 下行
        - 资料包中没有单一来源能证明今天已经出现论点破裂。
        - 隐私 / 认证发现及融资披露缺失，可能压低信任和估值。
        - 有记录的整改和已披露的融资条款将显著提升可投资判断性。
    notes: 正反论点表在同一证据基础上并列上行与下行，因此建议关注价格，而不是品牌。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV013
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Narwal 将高端新品发布和 AI 驱动的产品差异化转化为已披露的规模，接近中国头部同行。
        - 上行空间要求未来入场价格在经审计的规模证明之后，仍对执行风险打出折扣。
        - 硬件商品化、关税 / 物流压力及品牌投入低效。
        - 需要披露收入质量、利润率持久性，并持续跟进治理情况。
      - - 基准
        - Narwal 仍是可信的高端品牌，但当前证据对产品的支持强于对财务的支持。
        - 在价格和经济性披露前，最有依据的做法是跟踪或继续研究。
        - 披露前买入，等于投资人押注情绪，而非回报。
        - 与指定资料池当前的公开证据结构一致。
      - - 悲观
        - 在更强的财务披露到来前，产品缺陷、隐私担忧或估值倍数压缩浮现。
        - 当证据质量落后于叙事质量时，任何高端私募市场估值都可能迅速下调。
        - 信任受损、下轮融资风险和较弱的退出选择权。
        - 未解决的安全发现或疲弱的渠道 / 保修指标会进一步强化这一情景。
    notes: 情景有意保持定性，因为指定证据未披露 Narwal 当前估值、收入基础或股权表结构，无法支持精确区间。
    claimRefs:
