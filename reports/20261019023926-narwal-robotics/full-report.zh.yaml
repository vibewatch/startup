              - CM004
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              推动品类增长的同一批属性，也限制了 Narwal 的上行空间。Statista 和 Narwal 都把智能家居能力视为采用驱动因素，Narwal 面向未来的产品叙事也把 AI
              导航、自维护和智能家居集成视为基本配置。但 Global Market Insights 强调了两个比宏大 TAM
              叙事更影响时点判断的摩擦点：前期成本敏感度，尤其是在价格敏感地区；以及电池、基站、耗材或地图流程在反复使用中出现故障后，售后和维护带来的摩擦。因此，估值更应看留存、服务体验和用户是否愿意再次购买高端自主产品，不能只看品类增长故事。
            claimRefs:
              - CM005
              - CM012
              - CM013
              - CM014
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局宽度与替代路径
        blocks:
          - type: paragraph
            body: >-
              指定证据显示，Narwal 首先是在高端家用地面清洁机器人领域竞争，而不是打造广义家庭服务平台。Tracxn 将 Narwal 描述为生产自主扫拖系统的厂商，系统可自动清洗和烘干拖布；其竞争者包括
              Dreame、Tineco 和 Ruimi。Narwal 自有材料围绕 AI 导航、自动清洁基站、智能家居控制和免手维护来定义品类，同时将商业机器人列为邻近但更重型的系统，服务办公室、酒店和诊所，而非
              Narwal 当前的家庭核心。现有证据支持的替代品包括高端扫地机器人同业、成熟既有厂商、邻近商用机器人，以及人工吸尘加拖地；指定证据没有提供定制内部自研替代方案的公开证明。
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP015
