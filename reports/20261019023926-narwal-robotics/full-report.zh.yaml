      - number: '5.2'
        title: 运营模式与技术架构
        blocks:
          - type: paragraph
            body: >-
              核心运营模式是由传感器驱动的家庭自主清洁：感知房间，识别物体或污渍，调整清洁模式，再把维护交给基站。Narwal 官方技术内容描述了 AI 加 LiDAR
              或摄像头建图、避障、动态吸力或拖地模式切换，以及基于应用或语音的编排。其 2025 和 2026 年旗舰叙事又加入 DirtSense、DualFlow
              防缠绕硬件、热水洗拖布、清洁剂管理、压缩灰尘或自动集尘，以及面向宠物、婴儿和贵重物品的场景模式。因此，这套架构比商品化吸力参数表更完整，但除一篇当前独立评测外，仍主要由厂商描述。
