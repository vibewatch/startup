      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              Narwal 的公开足迹指向富裕家庭购买，而不是企业采购。Dealroom 称其当前客户是住宅家庭，公司同时采用 DTC 销售和零售商分销；Narwal 还声称已覆盖 30 多个国家和地区、拥有 180
              万以上用户。采用触发点是便利性转化为可信的自主能力。Narwal 自有品类叙事强调 AI
              导航、自维护、应用或语音控制、对小户型的适配、障碍识别，以及其他减少人工监管的功能。尽调时，预算决策者应定位为家庭家电买方，转化路径则取决于高端升级逻辑、零售信任和 DTC 产品教育。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
