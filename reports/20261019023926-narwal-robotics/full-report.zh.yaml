  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险图景
        blocks:
          - type: paragraph
            body: >-
              指定证据中最强的信号指向典型的规模化风险：Narwal 已不再是小众硬件品牌，而是拥有庞大安装基数、跨境发布、复杂零售渠道以及应用和 AI
              驱动产品行为的高端消费机器人平台。因此，可靠性、售后服务和发布纪律比表面增长更重要。风险并非假设：KR-Asia/36Kr 回顾了一起历史事件，当时半数机队同时崩溃，创始人承认公司无法定位根因；2026 年
              BBB 投诉也显示，保修和维修摩擦在消费端仍未解决。


              第二项重大风险是经济和渠道压力。Narwal 强调高端定位，但自己的品类评论称先进功能正在下沉到更低价格点。同时，公司扩大线下分销、使用合作伙伴商店并管理区域发布，这些都会增加运营负担并造成利润泄漏。指定
              2026 年证据缺少保修准备金、毛利率、烧钱或当前法律合规控制，因此下行风险只能视为部分缓释，尚未关闭。
