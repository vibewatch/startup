      - number: '3.2'
        title: 同业在能力、价格与买方取舍上的定位
        blocks:
          - type: paragraph
            body: >-
              独立对比证据更支持 Roborock 和 Dreame 作为市场基准。SmartHomeExplorer 的 2026 年指南将 Roborock Saros 20 排名第一、Dreame X50
              第二、Roborock 10R 第三、Narwal Flow 2 第四、Dreame X60 第五；Narwal 在候选范围内，但综合排名并不领先。其相对优势是运行更安静、硬地面自动化，以及
              AI、热水洗拖布和零干预清洁。弱点同样明确：Dreame X50 支持 Matter 且价格更低，Roborock 的吸力和建图则有更强的独立验证，公开证据也没有显示 Narwal
              在互操作性或全场景客观清洁表现上胜出。
