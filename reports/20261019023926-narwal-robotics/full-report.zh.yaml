              - CE013
              - CE014
      - number: '5.5'
        title: 展示
        blocks:
          - type: callout
            title: 免手清洁是最清晰的产品优势
            body: >-
              在官方页面、2025 年指南、CES 2026 发布报道和 Vacuum Wars 中，Narwal
              反复主打自动清洁拖布、防缠绕硬件、自适应感知和基站自动化。厂商与评测者叙事中的重复出现说明，用户购买和评价的是便利系统，而不只是吸力参数。
            calloutType: strength
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE012
          - type: callout
            title: 公开证据比营销呈现更薄弱
            body: Narwal 公开材料描述了许多架构和信任属性，但指定证据只有一篇当前独立产品评测，没有直接的安全或隐私文件，也没有公开保修或维修指标。因此，强功能主张比持久运营质量更容易验证。
            calloutType: risk
            claimRefs:
              - CE006
              - CE011
              - CE013
          - type: callout
            title: 应按高端联网硬件判断，而不是按可扩展平台判断
            body: 证据支持把 Narwal 视为高端联网设备和基站系统厂商，消费产品迭代很快。但证据尚不足以支持建立在开放 API、开发者采用或异常透明的信任运营之上的论点。
            calloutType: recommendation
            claimRefs:
