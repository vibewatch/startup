evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, named executive bench, and role-specific biographies beyond founder Junbin.
    whyItMatters: >-
      Without governance and leadership-bench evidence, succession, oversight quality, and decision concentration cannot
      be assessed confidently.
    diligencePath: Request an org chart, board list, and recent governance or financing materials from the company or lead investors.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: >-
      Dated KPI definitions that reconcile users, households, patents, patented technologies, and service locations
      across Narwal-controlled surfaces.
    whyItMatters: Later chapters need stable cover metrics, and the current mismatch makes scale and IP traction easy to overstate.
    diligencePath: >-
      Request the investor KPI sheet or management definitions used for fundraising and homepage/about-page marketing
      updates.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: private-financials
    missingEvidence: >-
      Audited or investor-grade support for revenue quality, ARR, gross margin, burn, runway, customer count, and the
      current cap table.
    whyItMatters: >-
      The overview can cite round-context metrics, but it cannot convert them into durable quality-of-business or
      valuation support without private financial evidence.
    diligencePath: >-
      Request 2024/2025 management accounts, board materials, KPI definitions, and the latest cap table plus preference
      stack.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: narwal-sam-som
    missingEvidence: Narwal's regional sell-through, ASP, unit volumes, and direct-versus-retail revenue split.
    whyItMatters: >-
      Category TAM is visible, but Narwal's real served market and channel quality cannot be isolated without
      company-specific demand data.
    diligencePath: >-
      Request management or channel-check data for sell-through, ASP by region, and revenue mix across DTC and retail
      partners.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: Repeat-purchase, accessory attach, warranty claim rates, and service-cost trends by model and geography.
    whyItMatters: >-
      Premium appliance valuation depends on whether automation features create durable repurchase behavior instead of
      one-off hardware demand.
    diligencePath: >-
      Ask for cohort retention, consumable reorder rates, warranty reserves, and support-ticket trends by market and
      product family.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Public or management-provided data on repeat purchase, warranty claims, app retention, and retailer concentration.
    whyItMatters: Without these metrics, Narwal's lock-in and multi-homing resistance cannot be judged with confidence.
    diligencePath: >-
      Request cohort retention, return-rate, warranty-cost, and top-channel concentration data from management or major
      retail partners.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Sell-through pricing, discount cadence, bundle attach rates, and gross-margin implications by channel.
    whyItMatters: List prices alone do not show whether Narwal can defend premium ASPs against Dreame and Roborock.
    diligencePath: >-
      Obtain retailer price-history data, channel margin terms, and management ASP bridge disclosures for the latest
      product family.
    relatedQuestionRefs:
      - QP002
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: trust-posture
    missingEvidence: Independent compliance, security, recall, or regulator-facing evidence for Narwal and direct peers.
    whyItMatters: >-
      Trust and regulatory posture are part of the chapter brief, but the assigned pool leaves those cells largely
      unknown.
    diligencePath: >-
      Add retained security, privacy, recall, or standards-certification sources for Narwal, Roborock, Dreame, and
      Ecovacs.
    relatedQuestionRefs:
      - QP006
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Recognized revenue, returns allowances, geographic mix, and gross margin by product family.
    whyItMatters: List prices and traction proxies do not show how much revenue converts into durable gross profit.
    diligencePath: Request monthly management accounts with revenue recognition policy, SKU gross-margin bridge, and returns reserve.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, debt obligations, inventory turns, and management runway forecast.
    whyItMatters: >-
      A hardware business cannot be underwritten for financing sufficiency without current liquidity and working-capital
      data.
    diligencePath: Obtain the latest board package or financing memo with cash, burn, debt, and next-round trigger assumptions.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-gap
    missingEvidence: CAC, payback, repeat purchase, channel mix, realized ASP, warranty-claim rate, and refund data by SKU.
    whyItMatters: >-
      These are the core variables required to assess Narwal's sales efficiency, retention quality, and contribution
      margin.
    diligencePath: >-
      Request cohort-level operating KPIs by channel and SKU, including CAC, discounts, claims, refunds, and attach
      rates.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: >-
      A dated investor, regulatory, or management source that reconciles households or users, patents, and
      service-footprint counts across Narwal's public surfaces.
    whyItMatters: Inconsistent scale and patent figures weaken benchmarking of installed base, support density, and IP moat.
    diligencePath: >-
      Request the latest management deck or KPI appendix with dated definitions for users, households, patents, and
      service locations.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: security-proof
    missingEvidence: >-
      Direct privacy, cybersecurity, certification, or trust-center documentation for Narwal's connected products and
      mobile app.
    whyItMatters: >-
      Connected-device underwriting needs primary evidence on data handling, certification scope, and remediation
      processes rather than secondhand summaries.
    diligencePath: >-
      Request the TÜV certification record, privacy architecture, app-permission map, and any penetration-test or
      product-security summary.
    relatedQuestionRefs:
      - QE004
  - type: private-evidence-only
    severity: material
    topic: reliability-risk
    missingEvidence: >-
      Warranty claims, return rates, repair turnaround, field failure cohorts, and app uptime or crash telemetry by
      major SKU.
    whyItMatters: Marketing surfaces and one review do not establish durable operating quality at installed-base scale.
    diligencePath: Ask for service KPI dashboards, warranty reserves by product family, and post-launch defect or recall logs.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public API, repository, package, integrator-community, or practitioner proxy evidence showing whether Narwal
      supports third-party extensibility.
    whyItMatters: >-
      The chapter brief asks for technical dependencies and integration maturity, but the assigned pool exposes only
      consumer product marketing and review coverage.
    diligencePath: >-
      Confirm whether Narwal has any open API, smart-home developer program, or documented partner integration
      community; if not, underwrite the product as a closed consumer hardware stack.
  - type: missing-source
    severity: material
    topic: concentration-risk-tu003
    missingEvidence: Channel-mix disclosure covering DTC, Amazon, retail partners, and any top-account or top-channel exposure.
    whyItMatters: >-
      Concentration risk cannot be sized from public adoption proofs alone and matters for holiday promotion dependence
      and channel bargaining power.
    diligencePath: >-
      Request 2024-2026 sell-through by channel and geography, plus any retailer concentration thresholds used
      internally.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: >-
      Repeat-purchase, return-rate, warranty-claim, and consumables or replacement-unit cohorts that show whether Narwal
      households stay satisfied after initial purchase.
    whyItMatters: >-
      Editorial household tests validate installation and performance, but they do not reveal whether Narwal converts
      that usage into durable repeat demand or low support burden.
    diligencePath: >-
      Request cohort retention, warranty claims by SKU, return rates, and replacement-part reorder data for the last six
      quarters.
  - type: missing-source
    severity: material
    topic: privacy-security-controls
    missingEvidence: >-
      Current privacy, data-retention, security-certification, and incident-response documentation for camera- and
      app-enabled devices.
    whyItMatters: >-
      Narwal's product surface now spans AI cameras, telemetry, app control, and voice assistants, so legal and
      reputational downside cannot be underwritten from feature marketing alone.
    diligencePath: Request current privacy policy, DPA terms, security attestations, and any disclosed incident logs by market.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: warranty-reserves-and-unit-economics
    missingEvidence: Current gross margin, burn, working-capital, warranty-reserve, repeat-repair, and refund-rate data for 2025-2026.
    whyItMatters: >-
      The public evidence shows operational stress and premium-price pressure, but not whether the business can absorb
      service costs while sustaining premium positioning.
    diligencePath: Request audited or board-level operating pack covering margins, reserves, returns, and channel economics.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: litigation-and-regulatory-status
    missingEvidence: Independent 2026 public evidence on active litigation, recalls, enforcement, or product-compliance exceptions.
    whyItMatters: >-
      Cross-border consumer hardware can accumulate legal or compliance exposure that is not visible in marketing copy
      or interview-style reporting.
    diligencePath: Run counsel- and regulator-led checks across key jurisdictions and request internal litigation / recall log.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: valuation-disclosure
    missingEvidence: >-
      Narwal's current financing round, valuation, liquidation preferences, dilution terms, and the live cap-table
      stack.
    whyItMatters: >-
      A price-sensitive recommendation cannot be underwritten when the current entry price and downside protections are
      undisclosed.
    diligencePath: Request the latest term sheet, cap table, and board-approved financing materials from management.
    relatedQuestionRefs:
      - QV002
  - type: private-evidence-only
    severity: material
    topic: economics-quality
    missingEvidence: Audited revenue, gross margin, warranty-return rates, channel inventory, and cash-burn / runway data.
    whyItMatters: >-
      Premium hardware narratives can still destroy equity value if sell-through, margins, or warranty economics are
      weak.
    diligencePath: Request audited or investor-reporting financials plus channel and warranty KPI packs for the latest twelve months.
    relatedQuestionRefs:
      - QV007
      - QV008
  - type: missing-source
    severity: material
    topic: privacy-remediation
    missingEvidence: Independent proof that Narwal remediated the authentication and photo-access findings reported by ChannelNews.
    whyItMatters: >-
      Unresolved privacy or device-security issues can impair brand trust, increase compliance risk, and compress
      valuation multiples.
    diligencePath: >-
      Obtain remediation documentation, firmware-release notes, and a third-party security attestation tied to the
      affected product family.
    relatedQuestionRefs:
      - QV006
      - QV008
