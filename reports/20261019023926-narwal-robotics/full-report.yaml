        title: Peer positioning on capability, price, and buyer tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Independent comparison evidence is more favorable to Roborock and Dreame on market benchmarking than to
              Narwal's currently compared retail model. SmartHomeExplorer's 2026 guide ranks Roborock Saros 20 first,
              Dreame X50 second, Roborock 10R third, Narwal Flow 2 fourth, and Dreame X60 fifth, which means Narwal is
              in the considered set but not leading the composite ranking. Narwal's relative strengths in this pool are
              quieter operation, hard-floor automation, and the vendor-led push toward AI, hot-water mop washing, and
              zero-intervention cleaning. The weaknesses are equally concrete: Dreame is carrying Matter support and
              lower cited price points on X50, Roborock has stronger independent validation on suction and mapping, and
              the public evidence here does not show Narwal winning on interoperability or objective all-scenario
              cleaning performance.
