      - number: '1.2'
        title: Capital and stakeholder base
        blocks:
          - type: paragraph
            body: >-
              Funding evidence in the pool is concentrated but directionally coherent. Multiples records a $14M Series B
              in April 2020 and a $100M Series E in April 2025 that valued Narwal at $2.4B, with Beijing Robot Industry
              Fund and Tencent listed as round leads on the latest financing. The same profile attributes $200M of
              revenue and 130% year-over-year growth to 2024, but those remain private-company figures attached to
              fundraising context rather than audited disclosures. The public stakeholder picture is also incomplete:
              the investor set is visible at the institution level, yet the current board roster and leadership bench
              beyond founder Junbin do not surface in the assigned evidence, which leaves control and succession
              questions open.
