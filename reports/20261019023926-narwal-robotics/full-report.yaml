    title: Product architecture map
    type: stack
    summary: Narwal's public architecture stacks household sensing and control above cleaning hardware and a maintenance dock.
    data:
      layers:
        - label: Household inputs
          detail: Mess types and room context the system is designed to interpret
          items:
            - Pet hair and tracked debris
            - Wet spills and dried stains
            - Room-specific household routines
          outputs:
            - Cleaning priority signals
        - label: Experience and control
          detail: Consumer-facing orchestration and household context
          items:
            - App scheduling and room selection
            - Voice-assistant control
            - Pet Care Mode and Baby Care Mode
          outputs:
            - Targeted household-cleaning routines
            - Lower-touch day-to-day operation
        - label: Perception and decisioning
          detail: Sensor and model layer that routes cleaning behavior
          modules:
            - Dual 1080p RGB cameras on Flow 2
            - LiDAR or camera-led mapping on current smart-cleaning stack
            - DirtSense and object-recognition logic
          outputs:
            - Room maps
            - Obstacle avoidance
            - Adaptive cleaning mode selection
        - label: Cleaning execution
          detail: On-floor actuation hardware
          modules:
            - 30,000 to 31,000 Pa suction claims on current flagship messaging
            - DualFlow anti-tangle brush system
            - Track or triangular mop systems with pressure and edge handling
          outputs:
            - Vacuum pickup
            - Wet scrubbing
