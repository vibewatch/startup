      - number: '5.2'
        title: Operating model and technical architecture
        blocks:
          - type: paragraph
            body: >-
              The core operating model is sensor-led household autonomy: perceive the room, classify objects or dirt,
              adapt the cleaning mode, then offload maintenance to the base station. Narwal's official technical content
              describes AI plus LiDAR or camera-led mapping, obstacle avoidance, dynamic suction or mop-mode switching,
              and app or voice based orchestration. Its 2025 and 2026 flagship narratives extend that stack with
              DirtSense, DualFlow anti-tangle hardware, hot-water mop washing, detergent management, dust compression or
              self-emptying, and scenario-specific modes for pets, babies, or valuables. The architecture is therefore
              more cohesive than a commodity suction spec sheet, but it remains mostly vendor-described outside one
              current independent review.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE012
              - CE014
