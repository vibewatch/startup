        title: Exhibits
        blocks:
          - type: callout
            title: Narwal's clearest public wedge is quiet household automation
            body: >-
              In the assigned evidence, Narwal's strongest differentiation is quieter, hands-free hard-floor cleaning
              rather than a verified price or interoperability advantage.
            calloutType: insight
            claimRefs:
