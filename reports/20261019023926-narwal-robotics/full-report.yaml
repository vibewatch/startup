              - CP011
              - CP014
          - type: callout
            title: Feature leadership alone may be easy for better-funded peers to match
            body: >-
              Adverse evidence points to rapid incumbent and peer iteration, so Narwal needs more than premium hardware
              features to prove durable defensibility.
