  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and commercial packaging
        blocks:
          - type: paragraph
            body: >-
              Narwal is selling a premium household-cleaning portfolio, not a general robotics platform. The global
              product page currently lists Flow 2, Flow, Freo Z10 Ultra, Freo Z Ultra, Freo Z10, Freo X10 Pro, Freo X
              Ultra, Freo Pro, and the S30 Series, while the US storefront explicitly merchandises Flow 2 as the
              flagship and prices Freo 20 and Freo 20 Edge beneath it. That points to a classic good-better-best ladder
              oriented to consumer buyers choosing between automation depth and price. Public scale signals are
              directionally positive, but company-controlled pages disagree on installed-base and patent counts, so
              portfolio breadth is clear while public benchmarking precision is not.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
