    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows premium consumer hardware pricing converting into device revenue, with realized economics
      then shaped by promotions, installed-base support obligations, and China hardware cost exposure.
    data:
      nodes:
        - id: product
          label: Differentiated cleaning automation
          detail: Narwal's blogs emphasize AI navigation, self-cleaning, hot-water mop washing, and detergent refill.
        - id: skus
          label: Three priced consumer SKUs
          detail: The homepage lists Flow 2 at $1,299.99, Freo 20 at $1,099.99, and Freo 20 Edge at $699.99.
        - id: revenue
          label: Revenue realized through device sales
          detail: Assigned public materials support hardware sales, not a disclosed recurring software subscription line.
        - id: promotions
          label: Promotions shape realized ASP
          detail: The homepage advertises October Prime Day discounts of up to 57% off the full vacuum lineup.
        - id: support
          label: Installed base creates service obligations
          detail: Narwal cites 6M+ households worldwide, 1.8M+ global users, and 500+ service locations.
        - id: margin
          label: Gross profit depends on hidden cost drivers
          detail: Tariffs, warranty/service loads, and inventory economics are material but undisclosed in the assigned pool.
