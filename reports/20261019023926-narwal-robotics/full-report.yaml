      - number: '1.3'
        title: Milestones, refresh deltas, and risk context
        blocks:
          - type: paragraph
            body: >-
              The refresh evidence shows Narwal still shipping visible product and go-to-market milestones, not just
              carrying an old funding narrative. Multiples ties the business to the T10 in 2020, the Freo line in 2022,
              and a stronger 2024 revenue year before the 2025 Series E, while GearBrain places Narwal at CES 2026 with
              the Flow 2, V50, and U50 as a broader smart-cleaning ecosystem push. Even so, the caution flags matter.
              Multiples itself is inconsistent on headquarters language, Narwal's own surfaces are inconsistent on scale
              KPIs, and the pool does not confirm a Narwal-specific public legal incident even though broader U.S. web
              accessibility litigation remains elevated for retail and e-commerce brands. That combination makes the
              chapter fit to anchor later identity reuse, but not to close governance or reconciled-cover-metric
              diligence.
