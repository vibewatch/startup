  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public pricing architecture
        blocks:
          - type: paragraph
            body: >-
              The assigned refresh pool points to a straightforward consumer hardware monetization model: Narwal's
              current public storefront displays three active robot vacuum-and-mop systems at $699.99, $1,099.99, and
              $1,299.99, while its own 2025 buyer guide frames the premium robot vacuum segment at roughly $900-$1,500.
              That combination supports a view that Narwal is selling premium household cleaning hardware rather than a
              visibly recurring software product. The same materials also show that realized pricing is unlikely to
              equal list price all year: the homepage advertises October Prime Day discounts of up to 57% off the full
              vacuum lineup. For financial underwriting, displayed prices are useful only as a reference point until
              management provides realized ASPs, channel mix, return rates, and any retailer or promotional concessions
              by SKU.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI010
