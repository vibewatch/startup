  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a narrow current boundary for Narwal. Dealroom and EquityZen both place the
              company inside home robotics or intelligent cleaning robots, while Dealroom says the company sells direct
              online and through major retailers to residential households. That means near-term sizing should include
              residential robot vacuum-and-mop hardware, bundled autonomy features, and recurring accessory or
              consumable spend tied to household floor care. It should not default to all cleaning automation, because
              the buyer path, uptime expectations, and service model for commercial or industrial cleaning differ from
              the household upgrade motion described in Narwal's own consumer-facing materials.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
      - number: '2.2'
        title: Sizing lenses and category shape
        blocks:
          - type: paragraph
            body: >-
              Category-level public data is directionally strong even though Narwal's company-specific served market
              remains opaque. Global Market Insights values the robotic vacuum category at USD 12.5 billion in 2025 and
              projects USD 14.4 billion in 2026 and USD 30.9 billion by 2035. Statista's broader household-appliance
              outlook reinforces that connected devices such as robot vacuums remain a growth pocket inside appliance
              spending, but it is a macro adjacency rather than a Narwal-specific demand measure. The more
              valuation-relevant point is that current category value clusters in floor-cleaning robots, high-autonomy
              operation, and online distribution, not in a generic "smart home" umbrella.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
