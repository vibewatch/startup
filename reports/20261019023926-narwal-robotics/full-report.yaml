              - CE012
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE012
              - CE014
      - number: '5.3'
        title: Deployment maturity, service surface, and proof quality
        blocks:
          - type: paragraph
            body: >-
              Narwal's strongest maturity signals are consumer deployment scale and reduced-touch maintenance claims.
              The US storefront advertises 30+ countries and markets, 6M+ households, 1,500+ patents, and 500+ service
              locations, while the current flagship materials emphasize docks that wash, dry, empty, and in some
              variants connect to plumbing. That implies a product system designed to minimize daily user intervention
              after installation. The weakness is proof granularity: the assigned pool does not include direct field
              data on repair rates, warranty claims, spare-parts turnaround, or app uptime, so service reach is visible
              but service quality at scale is not.
            claimRefs:
              - CE003
              - CE004
              - CE010
              - CE011
      - number: '5.4'
        title: Differentiation, trust signals, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Narwal's differentiation case rests on maintenance reduction and context-aware cleaning rather than on a
              public developer ecosystem or proprietary software distribution. Across official and independent sources,
              the repeated motifs are self-cleaning mops, anti-tangle brushes, obstacle recognition, and automated dock
              work. That is a credible premium-hardware story, but the public evidence base is uneven. Vacuum Wars found
              strong obstacle avoidance and hair handling on Flow 2, yet also flagged below-average dried-stain mopping
              and app reliability complaints. Edgechat also reports a TÜV Rheinland cybersecurity certification for
              Narwal Flow, but the assigned pool does not include the underlying certificate or a current trust-center
              style disclosure, leaving privacy, connected-device security, and reliability underwriting only partially
              verified.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hands-off cleaning is the clearest product advantage
            body: >-
              Across official pages, the 2025 guide, CES 2026 launch coverage, and Vacuum Wars, Narwal repeatedly leads
              with self-cleaning mops, anti-tangle hardware, adaptive sensing, and dock automation. The repetition
              across both vendor and reviewer narratives suggests the product is being bought and judged as a
              convenience system, not just as a suction benchmark.
            calloutType: strength
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE012
          - type: callout
            title: Public proof is thinner than the marketing surface
            body: >-
              Narwal's public materials describe many architectural and trust attributes, but the assigned pool includes
              only one current independent product review, no direct security or privacy documentation, and no public
              warranty or repair metrics. That means strong feature claims are easier to verify than durable operational
              quality.
            calloutType: risk
            claimRefs:
              - CE006
              - CE011
              - CE013
          - type: callout
            title: Underwrite as premium connected hardware, not as an extensible platform
            body: >-
              The evidence supports Narwal as a premium connected-device and docking-system vendor with rapid
