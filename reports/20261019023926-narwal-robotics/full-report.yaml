      - number: '2.3'
        title: Buyer, user, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Narwal's public footprint points to an affluent household purchase rather than an enterprise procurement
              motion. Dealroom says the current client base is residential households and that the company mixes DTC
              sales with retailer distribution; Narwal also claims 1.8 million-plus users across 30-plus countries and
              regions. The adoption trigger is convenience becoming believable autonomy: Narwal's own category
              commentary emphasizes AI navigation, self-maintenance, app or voice control, compact-home fit, obstacle
              recognition, and other features that reduce supervision. For diligence, that centers the budget owner on
              the household appliance buyer and the conversion path on premium upgrade logic, retail trust, and DTC
              product education.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Growth drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The same attributes expanding the category also limit Narwal's upside. Statista and Narwal both frame
              connected-home intelligence as an adoption driver, and Narwal's future-looking product commentary treats
              AI navigation, self-maintenance, and smart-home integration as table stakes. Yet Global Market Insights
              highlights two frictions that matter more for timing than for top-line TAM rhetoric: upfront cost
              sensitivity, especially in price-sensitive regions, and after-sales or maintenance friction once
              batteries, docks, consumables, or mapping routines fail over repeated use. That implies valuation should
              turn more on retention, service experience, and willingness to repurchase a premium autonomy tier than on
              broad category-growth narratives alone.
            claimRefs:
              - CM005
              - CM012
              - CM013
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape breadth and substitute paths
        blocks:
          - type: paragraph
            body: >-
              The assigned pool shows Narwal competing first in premium household floor-cleaning robots, not in a broad
              home-services platform. Tracxn describes Narwal as a maker of autonomous vacuum-and-mop systems with
              automated pad-washing and drying, and its competitor set there includes Dreame, Tineco, and Ruimi.
              Narwal's own materials frame the category around AI navigation, self-cleaning docks, smart-home control,
              and hands-free maintenance, while also distinguishing commercial robots as adjacent, heavier-duty systems
              for offices, hotels, and clinics rather than Narwal's current core household focus. The meaningful
              substitutes evidenced here are therefore direct premium robot-vacuum peers, established incumbents,
              adjacent commercial robots, and the status quo of manual vacuum-plus-mop cleaning; the assigned pool does
              not provide public proof on custom internal-build alternatives.
