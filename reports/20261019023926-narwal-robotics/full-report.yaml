              - CI005
              - CI010
              - CI012
              - CI015
      - number: '4.2'
        title: Operating leverage, service load, and cost sensitivities
        blocks:
          - type: paragraph
            body: >-
              Public scale signals are meaningful but still indirect. Narwal's reviewed materials emphasize users,
              households, patents, service locations, and employee count instead of reported financial statements, which
              gives some confidence that the business has built a real installed base and operating footprint but not
              enough to prove revenue quality or margin durability. For a hardware company, that footprint matters
              because after-sale service, warranty handling, spare parts, and channel support can drive gross margin and
              working-capital requirements just as much as the initial sale. External signals in the pool add two
              caution flags: U.S. Section 301 tariff administration remains active, and a public China robot-vacuum
              comparable, Roborock, has seen meaningful profit-margin compression. Together, those signals suggest that
              Narwal's margin path is likely sensitive to tariffs, promotions, warranty load, and inventory turns even
              though the public pool does not quantify them.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI009
              - CI012
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The core underwriting problem is not whether Narwal has market presence; it is that the assigned public
              evidence does not disclose the financial variables needed to judge capital adequacy. Within this pool,
              there is no contemporaneous revenue, ARR, gross margin, burn, cash balance, runway, debt, or next-round
              trigger, and there are no public CAC, payback, repeat-purchase, or warranty-claim disclosures that would
              let an investor convert product traction into unit economics. That means the chapter can support a bounded
              verdict: Narwal looks like a scaled premium hardware exporter with real consumer demand signals, but
              current list pricing, promotion depth, and service footprint do not by themselves establish revenue
              quality or financing sufficiency. Management diligence should therefore focus on realized pricing,
              returns, channel economics, warranty reserves, and current cash-versus-burn before any investment case
              relies on margin expansion or self-funded growth.
            claimRefs:
              - CI008
              - CI011
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public underwriting ceiling
            body: >-
              The assigned refresh pool supports product pricing and scale proxies, but not the cash, margin, or
              retention data required to underwrite capital efficiency or financing sufficiency.
            calloutType: risk
            claimRefs:
