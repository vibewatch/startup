              - CV010
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case starts with premium positioning that appears real, not aspirational. Narwal's own pages
              present a large installed-user base, broad geographic reach, and a launch cadence centered on AI-led
              cleaning automation. Independent coverage broadly supports that product ambition: reviewers see genuine
              automation gains and sophisticated mopping, while CES coverage treats Flow 2 as a flagship rather than as
              a discount challenger. The anti-thesis is that public proof of product ambition is easier to find than
              proof of durable economics. One review still flagged high-pile-carpet and edge-cleaning weaknesses, and
              Channelnews reported privacy/authentication findings on a Narwal model that could weigh on trust if
              unresolved. Without current disclosed revenue, gross margin, or financing terms, the bullish thesis
              remains evidence-incomplete rather than investment-complete.
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario framing and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The scenario range is therefore directional rather than numerically underwritten. In the bull case, Narwal
              would convert product leadership and premium ASPs into scale economics closer to the best Chinese
              robot-vacuum peers, while proving that privacy, product-quality, and channel execution risks are
              manageable. The base case is more conservative: premium positioning keeps the brand relevant, but absent
              auditable financials and a live price, investors should assume valuation discipline rather than momentum
              investing. The bear case is straightforward: if product caveats, privacy concerns, or multiple compression
              hit before Narwal can disclose stronger scale proof, private-market pricing could outrun evidence. The
              remaining work is not more storytelling; it is documentary diligence on financing terms, audited operating
              metrics, and remediation evidence for governance-sensitive product risks.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
