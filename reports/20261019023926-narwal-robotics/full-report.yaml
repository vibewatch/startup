      - number: '3.3'
        title: Durability, commoditization, and incumbent response
        blocks:
          - type: paragraph
            body: >-
              The moat question remains open because most of Narwal's public differentiation in this pool is
              feature-led, while the adverse evidence points to a category that is already moving into red-ocean
              competition. China Business Insider says Ecovacs still controls more than 35% of China's robot-vacuum
              market, yet Roborock and Dreame are winning ground through algorithms, industrial design, and aggressive
              pricing, and Narwal is mentioned as gaining momentum rather than as a locked-in platform leader. That
              matters because Narwal's current public case emphasizes automation, low-noise use, and premium user
              experience more than distribution exclusivity or standards control. Without public data on repeat
              purchase, retailer concentration, warranty claims, or multi-homing, the evidence here supports a credible
              premium challenger story, not a proven durable moat.
            claimRefs:
              - CP012
              - CP013
              - CP014
