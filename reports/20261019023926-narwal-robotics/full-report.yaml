      - number: '6.2'
        title: Independent use proof exists, but it is mostly editorial household testing
        blocks:
          - type: paragraph
            body: >-
              Narwal does have public proof that real people are using the products in homes, but most of that proof
              comes from named editorial tests instead of a disclosed customer roster or auditable retailer
              sell-through. Vacuum Wars used the Flow 2 for three months in a busy family home with a dog; Reviewed ran
              the Flow 2 for weeks around pets, rugs, and kitchen messes; and HGTV tested several Narwal models in a
              real house before naming the Freo Pro its top pick. That is better than logo-only marketing, because it
              demonstrates installation, navigation, and cleaning behavior in live environments, yet it still stops
              short of proving customer expansion, renewals, or broad installed-base engagement by cohort.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Durability hinges on support and trust signals that remain mixed
        blocks:
          - type: paragraph
            body: >-
              The strongest signals for durability and expansion in this pool are support proxies, not formal retention
              metrics. Narwal offers a standard consumer-hardware package of a one-year limited warranty, optional
              extended coverage, and a 30-day return policy, but independent review coverage also warns that replacement
              parts and U.S. warranty service can be harder to access than with larger rivals. On top of that, Korea
              Consumer Agency testing found an app-authentication flaw in the Freo Z Ultra that could expose photos
              until vendors patched it, and a 2025 U.S. consumer case reached settlement-in-principle before dismissal
              with prejudice. None of these items proves churn, but together they mean Narwal's public customer story is
              still broader on acquisition than on long-term retention or concentration resilience.
            claimRefs:
              - CU008
              - CU009
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Proof of use is real but still sample-sized
            body: >-
              Narwal clears the "logo-only" bar because independent reviewers actually used the products in homes, yet
              the public evidence still looks like editorial sampling rather than a disclosed customer ledger or cohort
              file.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
          - type: callout
            title: Retention risk is hidden inside support and trust signals
            body: >-
              Without repeat-purchase or concentration data, customer durability has to be inferred from support access,
              privacy posture, and dispute history. Those proxies are mixed enough that diligence should not treat
              installed base claims as equivalent to durable retention.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: |-
              The strongest evidence in the assigned pool points to a classic scaling risk: Narwal is no
              longer a niche hardware brand, but a premium consumer-robotics platform with a large installed
              base, cross-border launches, retail-channel complexity, and app- plus AI-enabled product
              behavior. That makes reliability, post-sale service, and rollout discipline more important to
              underwriting than headline growth alone. The risk is not hypothetical: KR-Asia/36Kr recount a
              historical event where half of the fleet crashed simultaneously and the founder admitted the
              company could not pinpoint the root cause, while BBB complaints in 2026 show unresolved
              warranty and repair friction is still visible at the consumer edge.

              The second major risk is economic and channel pressure. Narwal is leaning into premium
              positioning while its own category commentary says advanced features are diffusing to lower
              price points. At the same time, the company is broadening offline distribution, using partner
              storefronts, and managing region-specific launches, all of which add operational overhead and
              potential margin leakage. The absence of assigned 2026 evidence on warranty reserves, gross
              margin, burn, or current legal/compliance controls means the downside should be framed as
              partly mitigated but not yet closed.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR007
              - CR008
