  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Narwal's current evidence pack shows a credible premium consumer-hardware story, not a price-clearing
              investment case. The company is launching new flagship products, publicly selling Flow 2 in the roughly
              $1.3k-$1.5k band, and benefiting from a robotic-vacuum market that independent research still sees
              compounding quickly. But the same packet lacks Narwal's current funding price, cap-table preferences,
              audited revenue scale, and margin profile. The best public valuation anchor in the pool is Dreame's
              reported $9.6 billion pre-IPO round, yet that benchmark is paired with far larger disclosed revenue and
              unit scale. That mix makes a buy call unsupported today; the disciplined posture is to keep Narwal on a
              research-more track until price and financial disclosure catch up with the premium product narrative.
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
