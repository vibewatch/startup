    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating surface
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports a clear but still company-weighted identity story. Narwal's own brand materials
              frame the company as an AI-first home cleaning automation business born from founder Junbin's frustration
              with messy floors, while Multiples describes a privately held intelligent cleaning-robot company founded
              in 2016 and selling into consumer channels across North America, Europe, and Asia. The homepage snapshot
              also shows a premium consumer price architecture rather than an enterprise hardware profile. What is less
              stable is the scale layer: Narwal currently publishes one set of user and patent figures on its about page
              and a larger set of household, patent, and service-location figures on the homepage, without a shared
              denominator or date stamp.
