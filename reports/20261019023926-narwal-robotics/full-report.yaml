  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Household buyers are visible, but account economics are not
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence set points to a household-consumer business rather than a disclosed
              enterprise-account book. Narwal's U.S. storefront lists consumer robot vacuum-and-mop SKUs from $699.99 to
              $1,299.99, and Reviewed's test article links the flagship Flow 2 to an Amazon purchase path at the same
              $1,299.99 price point. Customer segmentation is therefore clearest by household need state: premium
              mixed-floor buyers, pet-owning homes, and comparison-led shoppers deciding among feature tiers and
              channels. What remains missing is any public disclosure of channel split, repeat-purchase behavior, or
              retailer concentration, so the economic durability of that funnel is still inferred rather than measured.
