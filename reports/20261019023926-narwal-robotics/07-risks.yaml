      whyItMatters: >-
        Narwal's product surface now spans AI cameras, telemetry, app control, and voice assistants,
        so legal and reputational downside cannot be underwritten from feature marketing alone.
      diligencePath: Request current privacy policy, DPA terms, security attestations, and any disclosed incident logs by market.
      relatedQuestionRefs: [QR008]
      relatedTableRefs: [TR001]
