chapter:
  number: 7
  title: Risks
  summary: >-
    Narwal's best-evidenced downside is operational rather than demand-led: the record includes a
    prior fleet-wide failure, recent BBB complaints around warranty handling, and rapid expansion
    across geographies, channels, and software-enabled product surfaces. Management has documented
    some mitigations, including seven emergency repair lines and slower overseas release cadence,
    but the assigned 2026 pool still lacks hard public evidence on current privacy controls,
    warranty reserves, burn, margins, or active regulatory exposure.
sections:
  - id: severity-ranked-risk-picture
    title: Severity-ranked risk picture
    body: |-
      The strongest evidence in the assigned pool points to a classic scaling risk: Narwal is no
      longer a niche hardware brand, but a premium consumer-robotics platform with a large installed
      base, cross-border launches, retail-channel complexity, and app- plus AI-enabled product
      behavior. That makes reliability, post-sale service, and rollout discipline more important to
      underwriting than headline growth alone. The risk is not hypothetical: KR-Asia/36Kr recount a
      historical event where half of the fleet crashed simultaneously and the founder admitted the
      company could not pinpoint the root cause, while BBB complaints in 2026 show unresolved
      warranty and repair friction is still visible at the consumer edge.
      
      The second major risk is economic and channel pressure. Narwal is leaning into premium
      positioning while its own category commentary says advanced features are diffusing to lower
      price points. At the same time, the company is broadening offline distribution, using partner
      storefronts, and managing region-specific launches, all of which add operational overhead and
      potential margin leakage. The absence of assigned 2026 evidence on warranty reserves, gross
      margin, burn, or current legal/compliance controls means the downside should be framed as
      partly mitigated but not yet closed.
    claimRefs: [CR001, CR002, CR005, CR006, CR007, CR008, CR011, CR012, CR013]
    tableRefs: [TR001, TR002]
    figureRefs: [FR001]
  - id: registers-by-failure-mode
    title: Registers by failure mode
    body: |-
      The regulatory/legal register is less about a proven active enforcement event and more about
      evidence asymmetry. Narwal's own materials emphasize cameras, AI, cleaning-history analytics,
      app control, and voice assistants, which increases privacy, cybersecurity, interoperability,
      and product-liability surfaces. Yet the assigned source pool does not include public evidence
      on current certifications, incident disclosure practice, data-retention controls, or
      jurisdiction-specific device-compliance documentation. That leaves legal and regulatory risk
      as material but under-evidenced rather than disproven.
      
      Operationally, the evidence is firmer. The company has already lived through a fleet-wide
      failure, recently faced unresolved BBB complaints, and is still scaling installed base and
      international complexity. Partner dependency is also real: Narwal is pushing deeper into
      self-operated retail and Huawei-linked storefronts while shifting the channel mix toward
      offline, so execution risk now includes distributor/retail performance, demo quality, reverse
      logistics, and potential channel conflict in addition to product quality itself.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR009, CR010, CR012, CR013, CR016]
    tableRefs: [TR003]
  - id: mitigations-monitors-and-kill-criteria
    title: Mitigations, monitors, and kill criteria
    body: |-
      Narwal does have some visible mitigation evidence. During the earlier fleet incident, the
      company set up seven repair lines and resolved the acute wave within 20 days, and management
      now says overseas launches typically trail China by about six months of testing. Those are
      credible process signals, but they are not substitutes for current disclosure on failure
      rates, repair turnaround, return/refund rates, or privacy/security controls. As a result,
      the right investment posture is to demand measurable monitors rather than accept qualitative
      reassurance.
      
      In practice, the thesis should break if Narwal cannot show improving warranty outcomes,
      durable premium pricing despite category commoditization, and disciplined channel economics as
      offline/store-partner exposure rises. The open diligence list is unusually important here
      because the assigned 2026 pool is rich on product and channel narrative but thin on
      independently corroborated legal, financial, and reserve-quality metrics.
    claimRefs: [CR002, CR005, CR006, CR008, CR012, CR013, CR014, CR015]
