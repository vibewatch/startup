      severity: material
      topic: warranty-reserves-and-unit-economics
      missingEvidence: Current gross margin, burn, working-capital, warranty-reserve, repeat-repair, and refund-rate data for 2025-2026.
      whyItMatters: >-
        The public evidence shows operational stress and premium-price pressure, but not whether the
        business can absorb service costs while sustaining premium positioning.
      diligencePath: Request audited or board-level operating pack covering margins, reserves, returns, and channel economics.
      relatedQuestionRefs: [QR008]
      relatedTableRefs: [TR002]
