  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Premium smart-home households
        - Household decision maker
        - Household members
        - Consumer household
        - Routine floor cleaning with minimal intervention
        - Home appliance budget
        - Upgrade from manual or basic robotic cleaning to higher autonomy
      - - Pet-hair or high-frequency cleaning homes
        - Household decision maker
        - Household members
        - Consumer household
        - Daily debris pickup and mop refresh
        - Home maintenance budget
        - Need for reliable recurring cleaning, not one-off deep cleaning
      - - Busy multi-room homes
        - Household decision maker
        - Household members
        - Consumer household
        - Scheduling, mapping, and unattended cleaning across several rooms
        - Home convenience budget
        - AI navigation, self-maintenance, and app control reduce supervision
      - - Retail-led consideration set
        - Household shopper
        - Household members
        - Consumer household
        - Discovery through Best Buy or Costco plus DTC research
        - Home appliance budget
        - Retail trust, demos, and direct education improve conversion
      - - Light commercial adjacency
        - Facilities or site operator
        - Cleaning staff
        - Operations budget
        - Recurring floor maintenance in offices, clinics, or hotels
        - Facilities budget
        - Only attractive when runtime, dustbin, and service economics fit the site
    notes: >-
      Buyer mapping centers current public Narwal proof on consumer households;
      the commercial row is an adjacency lens, not evidence that enterprise
      budgets are already core to Narwal's business.
