  evidenceGaps:
    - type: missing-source
      severity: material
      topic: narwal-sam-som
      missingEvidence: Narwal's regional sell-through, ASP, unit volumes, and direct-versus-retail revenue split.
      whyItMatters: Category TAM is visible, but Narwal's real served market and channel quality cannot be isolated without company-specific demand data.
      diligencePath: Request management or channel-check data for sell-through, ASP by region, and revenue mix across DTC and retail partners.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: retention-economics
      missingEvidence: Repeat-purchase, accessory attach, warranty claim rates, and service-cost trends by model and geography.
      whyItMatters: Premium appliance valuation depends on whether automation features create durable repurchase behavior instead of one-off hardware demand.
      diligencePath: Ask for cohort retention, consumable reorder rates, warranty reserves, and support-ticket trends by market and product family.
      relatedQuestionRefs: [QM008]
