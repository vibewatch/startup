figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Narwal's public customer flow moves from premium comparison shopping to
      household proof and then into support-led retention questions.
    data:
      items:
        - label: Discovery
          detail: Buyers first encounter a premium robot-cleaning lineup with visible MSRP anchors.
          touchpoints:
            - Narwal.com MSRP ladder from $699.99 to $1,299.99
            - Comparative editorial coverage and Amazon-linked purchase path
        - label: Fit screening
          detail: Public use cases emphasize pets, kids, mixed floors, and quieter operation.
          touchpoints:
            - Pet hair and spill cleanup
            - Mixed hard-floor and rug households
            - Premium design and lower-noise expectations
        - label: In-home setup
          detail: Third-party tests validate mapping, obstacle avoidance, and self-service dock behavior.
          touchpoints:
            - Quick mapping and plug-and-play setup
            - Real-home object avoidance around cords, shoes, and pets
        - label: Early proof
          detail: Independent household reviews provide better evidence than logos, but still only at sample depth.
          touchpoints:
            - Vacuum Wars three-month family-home test
            - Reviewed multi-week mixed-room test
            - HGTV multi-model comparison
        - label: Retention proxy
          detail: Public durability proxies are support terms and service footprint rather than disclosed repurchase cohorts.
          touchpoints:
            - 1-year warranty and 30-day return policy
            - 500+ service locations claim
            - Optional dock warranty upsell
        - label: Expansion or friction
          detail: Upsell is visible through premium SKU ladder, while privacy and service frictions can slow advocacy or repeat purchase.
          touchpoints:
            - Premium flagship and feature-led upsell path
            - Support and replacement-part concerns
            - Patched Korea app-security issue and 2025 consumer case
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU009
      - CU011
      - CU013
callouts:
  - calloutType: insight
    title: Proof of use is real but still sample-sized
    body: >-
      Narwal clears the "logo-only" bar because independent reviewers actually
      used the products in homes, yet the public evidence still looks like
      editorial sampling rather than a disclosed customer ledger or cohort file.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU010
  - calloutType: risk
    title: Retention risk is hidden inside support and trust signals
    body: >-
      Without repeat-purchase or concentration data, customer durability has to
      be inferred from support access, privacy posture, and dispute history.
      Those proxies are mixed enough that diligence should not treat installed
      base claims as equivalent to durable retention.
    claimRefs:
      - CU008
      - CU009
      - CU011
      - CU012
