      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Vacuum Wars test household
        - Busy family home with kids, rugs, and a shedding dog
        - Three months of regular Flow 2 household use
        - Independent production-like household use
        - Strong mopping, pet-hair handling, and obstacle avoidance
        - Editorial test, not a disclosed paying-customer cohort
      - - Hannah Emerson / Reviewed home
        - Pet-owning mixed-floor household
        - Flow 2 used for weeks in living room, kitchen, and foyer
        - Independent production-like household use
        - Low-intervention cleaning across hair, tracked dirt, and sticky messes
        - Single tester and no long-term support history
      - - Theresa Holland / HGTV test house
        - Comparison-shopping household
        - Multi-model Narwal testing on a first floor with obstacles and rugs
        - Independent production-like household use
        - Quick mapping, quiet cleaning, and strong obstacle avoidance; Freo Pro named best tested
        - Media-lab style proof rather than audited repeat-purchase evidence
