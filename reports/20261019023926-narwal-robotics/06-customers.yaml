chapter:
  number: 6
  title: Customers
  summary: >-
    Narwal's customer proof is strongest as a premium consumer-hardware funnel:
    official and third-party sources show household buyers shopping a
    $699.99-$1,299.99 robot-cleaning lineup across 30+ countries, but the
    company does not publicly disclose repeat-purchase, channel-mix, or
    concentration metrics in this worker pool. Independent household tests do
    validate real use, while support-access concerns, a Korean privacy incident,
    and a 2025 U.S. consumer case raise durability risk above what marketing
    testimonials alone would suggest.
sections:
  - id: household-buyer-funnel
    title: Household buyers are visible, but account economics are not
    body: >-
      The assigned evidence set points to a household-consumer business rather
      than a disclosed enterprise-account book. Narwal's U.S. storefront lists
      consumer robot vacuum-and-mop SKUs from $699.99 to $1,299.99, and
      Reviewed's test article links the flagship Flow 2 to an Amazon purchase
      path at the same $1,299.99 price point. Customer segmentation is
      therefore clearest by household need state: premium mixed-floor buyers,
      pet-owning homes, and comparison-led shoppers deciding among feature tiers
      and channels. What remains missing is any public disclosure of channel
      split, repeat-purchase behavior, or retailer concentration, so the
      economic durability of that funnel is still inferred rather than measured.
    claimRefs:
      - CU001
      - CU004
      - CU009
      - CU010
      - CU013
    tableRefs:
      - TU001
      - TU002
    figureRefs:
      - FU001
  - id: third-party-use-proof
    title: Independent use proof exists, but it is mostly editorial household testing
    body: >-
      Narwal does have public proof that real people are using the products in
      homes, but most of that proof comes from named editorial tests instead of
      a disclosed customer roster or auditable retailer sell-through. Vacuum
      Wars used the Flow 2 for three months in a busy family home with a dog;
      Reviewed ran the Flow 2 for weeks around pets, rugs, and kitchen messes;
      and HGTV tested several Narwal models in a real house before naming the
      Freo Pro its top pick. That is better than logo-only marketing, because
      it demonstrates installation, navigation, and cleaning behavior in live
      environments, yet it still stops short of proving customer expansion,
      renewals, or broad installed-base engagement by cohort.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU010
    tableRefs:
      - TU003
  - id: durability-and-expansion
    title: Durability hinges on support and trust signals that remain mixed
    body: >-
      The strongest signals for durability and expansion in this pool are
      support proxies, not formal retention metrics. Narwal offers a standard
      consumer-hardware package of a one-year limited warranty, optional
      extended coverage, and a 30-day return policy, but independent review
      coverage also warns that replacement parts and U.S. warranty service can
      be harder to access than with larger rivals. On top of that, Korea
      Consumer Agency testing found an app-authentication flaw in the Freo Z
      Ultra that could expose photos until vendors patched it, and a 2025 U.S.
      consumer case reached settlement-in-principle before dismissal with
      prejudice. None of these items proves churn, but together they mean
      Narwal's public customer story is still broader on acquisition than on
      long-term retention or concentration resilience.
    claimRefs:
      - CU008
      - CU009
      - CU011
      - CU012
      - CU013
