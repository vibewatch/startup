  evidenceGaps:
    - type: missing-source
      severity: material
      topic: concentration-risk-tu003
      missingEvidence: Channel-mix disclosure covering DTC, Amazon, retail partners, and any top-account or top-channel exposure.
      whyItMatters: Concentration risk cannot be sized from public adoption proofs alone and matters for holiday promotion dependence and channel bargaining power.
      diligencePath: Request 2024-2026 sell-through by channel and geography, plus any retailer concentration thresholds used internally.
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: Repeat-purchase, return-rate, warranty-claim, and consumables or replacement-unit cohorts that show whether Narwal households stay satisfied after initial purchase.
      whyItMatters: Editorial household tests validate installation and performance, but they do not reveal whether Narwal converts that usage into durable repeat demand or low support burden.
      diligencePath: Request cohort retention, warranty claims by SKU, return rates, and replacement-part reorder data for the last six quarters.
