      - ["Product proof", "Independent coverage describes a genuine flagship with advanced automation and AI-led cleaning features.", "Independent review also found weak edge cleaning and poor high-pile-carpet performance.", "More third-party durability and warranty data would separate novelty from durable advantage."]
      - ["Category backdrop", "Robotic vacuums still have a strong secular growth narrative from an independent market dataset.", "A large category does not guarantee category-leading economics or favorable entry pricing.", "Recent independent market-share or profitability data for Narwal would strengthen the bridge."]
