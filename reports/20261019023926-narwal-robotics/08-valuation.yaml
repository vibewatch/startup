    notes: >-
      Thesis table pairs upside and downside on the same evidence base so the recommendation stays
      price-sensitive rather than brand-sensitive.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Narwal converts premium launches and AI-led product differentiation into disclosed scale closer to top Chinese peers.", "Upside requires a future entry price that still discounts execution risk after audited scale proof.", "Hardware commoditization, tariff/logistics pressure, and brand-spend inefficiency.", "Would need disclosed revenue quality, margin durability, and clean governance follow-up."]
      - [Base, "Narwal remains a credible premium brand, but current evidence stays stronger on product than on finance.", "Most supportable stance is track or research-more until price and economics are disclosed.", "Paying before disclosure leaves the investor underwriting sentiment rather than returns.", "Matches the current public-evidence mix in the assigned pool."]
      - [Bear, "Product caveats, privacy concerns, or multiple compression surface before stronger financial disclosure arrives.", "Any premium private-market mark can de-rate quickly when evidence quality lags narrative quality.", "Trust damage, down-round risk, and weaker exit optionality.", "Would be reinforced by unresolved security findings or weak channel / warranty metrics."]
    notes: >-
      Scenarios are intentionally qualitative because the assigned evidence does not disclose a
      current Narwal valuation, revenue base, or cap-table structure to support precise ranges.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV013, CV014]
