  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: valuation-disclosure
      missingEvidence: Narwal's current financing round, valuation, liquidation preferences, dilution terms, and the live cap-table stack.
      whyItMatters: A price-sensitive recommendation cannot be underwritten when the current entry price and downside protections are undisclosed.
      diligencePath: Request the latest term sheet, cap table, and board-approved financing materials from management.
      relatedQuestionRefs: [QV002]
    - type: private-evidence-only
      severity: material
      topic: economics-quality
      missingEvidence: Audited revenue, gross margin, warranty-return rates, channel inventory, and cash-burn / runway data.
      whyItMatters: Premium hardware narratives can still destroy equity value if sell-through, margins, or warranty economics are weak.
      diligencePath: Request audited or investor-reporting financials plus channel and warranty KPI packs for the latest twelve months.
      relatedQuestionRefs: [QV007, QV008]
    - type: missing-source
      severity: material
      topic: privacy-remediation
      missingEvidence: Independent proof that Narwal remediated the authentication and photo-access findings reported by ChannelNews.
      whyItMatters: Unresolved privacy or device-security issues can impair brand trust, increase compliance risk, and compress valuation multiples.
      diligencePath: Obtain remediation documentation, firmware-release notes, and a third-party security attestation tied to the affected product family.
      relatedQuestionRefs: [QV006, QV008]
