    title: Competitor profile table
    columns:
      - Alternative
      - Category
      - Scale / funding signal
      - Target segment
      - Differentiation signal
      - Limitation / risk
    rows:
      - - Narwal
        - Direct premium household robot-vacuum brand
        - 1.8M+ users; 30+ countries/regions; 800+ patented technologies; Hu Global Unicorn listing
        - Premium households seeking hands-free floor cleaning
        - Quiet operation and heavy dock/mop automation
        - Public pool does not prove interoperability or distribution lock-in
      - - Roborock
        - Direct premium peer
        - Two Saros models in the 2026 comparison; Saros 20 leads that guide
        - Premium households prioritizing suction, mapping, and review-backed performance
        - Strongest cited consensus score and fast mapping
        - Threshold and pet-hair weaknesses still appear in third-party testing
      - - Dreame
        - Direct premium peer
        - Tracxn says Dreame most recently raised $563M in Oct 2021
        - Value-seeking premium households and homes with threshold obstacles
        - Lower cited X50 price, Matter support, and strong threshold climbing on X60
        - Mixed runtime/review tradeoffs and higher-end model pricing risk
      - - Ecovacs
        - Incumbent benchmark
        - ">35% China robot-vacuum market share"
        - Mainstream-to-premium daily-maintenance buyers
        - Scale, installed base, and all-in-one station positioning
        - Adverse source says innovation pace has lagged Roborock and Dreame
      - - Status quo manual cleaning
        - Substitute
        - No capital signal; ubiquitous household behavior
        - Budget-sensitive homes and renters
        - Lowest upfront cost and no device lock-in
        - No autonomy, self-maintenance, or app-based optimization
      - - Commercial robot cleaners
        - Adjacent alternative
        - Up to 8-hour runtime and large dustbins in Narwal's category explainer
        - Offices, hotels, clinics, and other large facilities
        - Durability and low-supervision cleaning in large spaces
        - Bulkier, louder, costlier, and not evidenced as Narwal's current core market
    notes: >-
      Mixes company-issued and third-party evidence; "public pool does not prove" / "no capital
      signal" indicates the assigned sources did not provide that evidence, not that the fact is false.
    claimRefs: [CP002, CP004, CP006, CP008, CP012, CP015]
