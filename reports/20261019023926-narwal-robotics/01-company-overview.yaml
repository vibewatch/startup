          detail: >-
            Multiples reports $200M of revenue, 130% year-over-year growth, and
            10 product launches during 2024.
        - date: "Apr 2025"
          label: "Series E sets a $2.4B valuation"
          detail: >-
            Multiples records a $100M Series E led by Beijing Robot Industry
            Fund and Tencent and says Narwal planned to move toward a pre-IPO
            stage.
        - date: "Aug 2025"
          label: "Freo Z10 anchors the 2025 lineup"
          detail: >-
            Narwal's 2025 guide presents the Freo Z10 as a zero-intervention
            flagship in the latest product wave.
        - period: "CES 2026"
          label: "Flow 2 ecosystem launch"
          detail: >-
            GearBrain says Narwal unveiled Flow 2 plus the V50 cordless vacuum
            and U50 mattress vacuum as a broader AI-powered cleaning ecosystem.
        - date: "Jul–Oct 2026"
          label: "Commercial cadence remains active"
          detail: >-
            The homepage snapshot includes July 2026 Flow 2 comparison content
            and an October 2026 Prime Day promotion for the full vacuum line.
    claimRefs: [CO001, CO007, CO008, CO009, CO010, CO011, CO013, CO016]
callouts:
  - calloutType: risk
    title: "Identity is reusable, but reconciliation is not complete"
    body: >-
      This pool is strong enough to anchor founding, funding, and launch
      chronology for the rest of the report, but it is not strong enough to
      treat Narwal's current scale metrics or governance coverage as fully
      settled. Official KPI disclosures conflict across company pages, and the
      assigned evidence does not surface a current board roster or executive
      bench beyond founder Junbin.
    claimRefs: [CO001, CO014]
