company:
  name: "Narwal Robotics"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Narwal Robotics still presents as a premium, founder-led consumer-cleaning
    robotics company with a reported $100M Series E in April 2025 at a $2.4B
    valuation and an expanding 2025-26 product cadence. The ground truth is
    usable for identity, funding, and launch history, but governance coverage
    is thin and current scale metrics remain unreconciled across Narwal's own
    surfaces.
sections:
  - id: "identity-and-operating-surface"
    title: "Identity and operating surface"
    body: >-
      The assigned pool supports a clear but still company-weighted identity
      story. Narwal's own brand materials frame the company as an AI-first home
      cleaning automation business born from founder Junbin's frustration with
      messy floors, while Multiples describes a privately held intelligent
      cleaning-robot company founded in 2016 and selling into consumer channels
      across North America, Europe, and Asia. The homepage snapshot also shows
      a premium consumer price architecture rather than an enterprise hardware
      profile. What is less stable is the scale layer: Narwal currently
      publishes one set of user and patent figures on its about page and a
      larger set of household, patent, and service-location figures on the
      homepage, without a shared denominator or date stamp.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO012, CO014]
    tableRefs: [TO001, TO002]
  - id: "capital-and-stakeholder-base"
    title: "Capital and stakeholder base"
    body: >-
      Funding evidence in the pool is concentrated but directionally coherent.
      Multiples records a $14M Series B in April 2020 and a $100M Series E in
      April 2025 that valued Narwal at $2.4B, with Beijing Robot Industry Fund
      and Tencent listed as round leads on the latest financing. The same
      profile attributes $200M of revenue and 130% year-over-year growth to
      2024, but those remain private-company figures attached to fundraising
      context rather than audited disclosures. The public stakeholder picture is
      also incomplete: the investor set is visible at the institution level,
      yet the current board roster and leadership bench beyond founder Junbin do
      not surface in the assigned evidence, which leaves control and succession
      questions open.
    claimRefs: [CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: "milestones-refresh-deltas-and-risk-context"
    title: "Milestones, refresh deltas, and risk context"
    body: >-
      The refresh evidence shows Narwal still shipping visible product and
      go-to-market milestones, not just carrying an old funding narrative.
      Multiples ties the business to the T10 in 2020, the Freo line in 2022,
      and a stronger 2024 revenue year before the 2025 Series E, while
      GearBrain places Narwal at CES 2026 with the Flow 2, V50, and U50 as a
      broader smart-cleaning ecosystem push. Even so, the caution flags matter.
      Multiples itself is inconsistent on headquarters language, Narwal's own
      surfaces are inconsistent on scale KPIs, and the pool does not confirm a
      Narwal-specific public legal incident even though broader U.S. web
      accessibility litigation remains elevated for retail and e-commerce
      brands. That combination makes the chapter fit to anchor later identity
      reuse, but not to close governance or reconciled-cover-metric diligence.
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
