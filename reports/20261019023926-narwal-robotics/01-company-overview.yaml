      - ["ByteDance", "Lead Series B investor", "Listed as a co-lead on the April 2020 Series B, making it part of the visible early institutional base.", "Verify whether the stake remains active and whether any follow-on rights persist."]
      - ["Source Code Capital", "Lead Series B investor", "Co-led the disclosed 2020 Series B and remains part of the visible investor lineage.", "Request cap-table position, reserves, and any board or observer rights."]
