  - CI002
- title: Burn Rate Estimates Suggest Adequate Runway for Commercial Launch
  body: "If PI's estimated annual burn of $70\u2013$150M is accurate, the $600M Series B alone provides approximately 4\u20138 years of runway at the pre-commercial scale. This is sufficient to fund commercial launch and initial deployment scaling without requiring an immediate next raise. However, actual runway compresses significantly if headcount and compute investments accelerate to capture market opportunity."
  calloutType: insight
  claimRefs:
