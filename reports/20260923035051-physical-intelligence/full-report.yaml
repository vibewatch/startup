chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Business Overview
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence, trading as pi.ai, was incorporated and began operations in San Francisco,
              California in March 2024. Its stated mission is to build "a single, general-purpose AI system capable of
              controlling any robot for any task." The company operates at the intersection of robotics, reinforcement
              learning, and large foundation models. Its primary product is π₀ (pi-zero), a vision-language-action (VLA)
              foundation model that ingests camera images, natural language task instructions, and robot proprioceptive
              state to predict continuous motor actions via a flow-matching transformer. π₀ is hardware-agnostic—it can
              be fine-tuned to operate diverse robot platforms (arms, mobile manipulators, humanoids) without rebuilding
              from scratch. Physical Intelligence's business model targets enterprise licensing of its model stack on a
              per-robot SaaS basis, though as of Q3 2026 the company remains pre-commercial-revenue and focused on
              research deployment and pilot programs. The company has also released an open-source variant (openpi) to
              drive ecosystem adoption and training data contributions.
            claimRefs:
              - CO001
              - CO002
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence was co-founded by a group of seven individuals with complementary expertise spanning
              academic robotics research, applied AI engineering, and operational scaling. CEO Karol Hausman was
              previously a Staff Research Scientist at Google DeepMind where he led robotic manipulation research and
              contributed to RT-2; he also served as an adjunct professor at Stanford University. Chief Scientist Sergey
              Levine holds a tenured Associate Professor position at UC Berkeley and leads the Robotic AI and Learning
              (RAIL) Lab, which produced foundational research in deep RL for robots. Co-founder Chelsea Finn, an
              Assistant Professor at Stanford, is best known for Model-Agnostic Meta-Learning (MAML) and rapid robot
              adaptation research. Brian Ichter, another co-founder, was a Research Scientist at Google DeepMind
              focusing on kinodynamic planning and GPU-accelerated robot algorithms. Adnan Esmail, co-founder and VP of
              Engineering, was previously SVP of Engineering at Anduril and a Tesla Autopilot engineer. Lachy Groom
              (early Stripe executive and VC investor) and Quan Vuong (robotics RL researcher) round out the founding
              team. The board composition has not been publicly disclosed; key-person risk is elevated given the
              concentrated technical leadership. There are no disclosed governance controversies or leadership changes
              as of Q3 2026.
            claimRefs:
              - CO001
              - CO002
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
      - number: '1.3'
        title: Funding History, Valuation, and Investors
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence has raised approximately $1.07 billion in approximately 20 months. The seed round of
              $70 million was closed in early-mid 2024, backed by Lux Capital and Jeff Bezos among others, and valued
              the company at an undisclosed pre-seed/seed valuation. The Series A of $400 million was closed in November
              2024 at a $2.4 billion post-money valuation; investors included OpenAI, Thrive Capital, Lux Capital, Index
              Ventures, and others. The Series B of $600 million followed one year later in November 2025, at a $5.6
              billion post-money valuation, led by CapitalG (Alphabet's growth fund) with participation from Lux
              Capital, Bond, Redpoint, Sequoia Capital, Thrive Capital, Index Ventures, T. Rowe Price, and Jeff Bezos.
              As of April 2026 the company is reported to be in advanced talks for a further funding round at an $11
              billion valuation, which if completed would represent a ~2× step-up in under six months. All external
              funding is venture equity; no debt, secondary transactions, or revenue-based financing have been publicly
              disclosed. The large round sizes reflect investor conviction in the market opportunity for robot
              foundation models, as well as the team's research pedigree.
            claimRefs:
              - CO001
              - CO002
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO002
      - number: '1.4'
        title: Key Milestones
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence progressed from founding to $1B+ raised and open-source model release in under two
              years. The company announced its founding and seed funding in March 2024. The π₀ model was described in a
              technical blog post and research paper in October 2024, demonstrating multi-task robot control including
              laundry folding, box assembly, and shirt packaging. The Series A closed in November 2024. In February 2025
              the company open- sourced π₀ model weights and code as the openpi repository, the first open-source
              general robot VLA foundation model. A successor π₀.5 was announced in early 2025, featuring enhanced
              generalization across novel environments. In mid-2025 π₀-FAST was introduced, using a frequency-domain
              discrete action representation (FAST tokenizer) for more efficient inference. The Series B at $5.6 billion
              closed in November 2025. As of Q3 2026, early enterprise pilot deployments are underway in manufacturing
              and logistics verticals with unnamed customers, and the company is reported to be approaching its next
              funding milestone at $11B valuation. There are no disclosed adverse events, regulatory investigations, or
              significant leadership departures as of this report date.
            claimRefs:
              - CO001
              - CO002
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fastest Path to $1B Raised in Robotics AI
            body: >-
              Physical Intelligence raised over $1 billion in under 20 months from founding — faster than any prior
              pure-software robotics AI startup. The $400M Series A (Nov 2024) and $600M Series B (Nov 2025) both set
              records for robotics foundation model software at the time of their respective closes. However, the
              company remains pre-revenue, creating a tension between investor confidence and commercial validation.
            calloutType: insight
            claimRefs:
              - CO001
              - CO002
          - type: callout
            title: Key-Person Concentration Risk
            body: >-
              CEO Karol Hausman and Chief Scientist Sergey Levine are indispensable to Physical Intelligence's research
              credibility and product direction. The company's academic co-founders hold concurrent university
              positions, creating potential distraction risk, though this also provides elite talent pipeline access. No
              succession planning or governance safeguards have been publicly disclosed.
            calloutType: risk
            claimRefs:
              - CO001
              - CO002
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Segmentation
        blocks:
          - type: paragraph
            body: >
              The market relevant to Physical Intelligence is best understood in three concentric layers. The broadest
              is global physical AI and robotics (hardware plus software), a market spanning industrial robots, mobile
              manipulators, humanoids, and autonomous vehicles with an estimated TAM of $50–82 billion in 2025 growing
              to $111–185 billion by 2030. Within this, the enterprise robotics software and AI stack (models,
              deployment infrastructure, training pipelines) represents a narrower SAM of approximately $8–15 billion in
              2025, expected to reach $20–35 billion by 2030 at 20–35% CAGR. The most relevant addressable segment for
              Physical Intelligence is robot foundation model software and per-robot SaaS licensing, which does not yet
              have an established analyst category but can be extrapolated at roughly $3–8 billion by 2028 based on
              per-robot unit economics and projected deployment scale in manufacturing, logistics, and warehouse
              automation. Key verticals include: manufacturing and assembly (largest by revenue today), logistics and
              warehouse automation (fastest growing), commercial and facilities services, and emerging humanoid-enabled
              tasks in healthcare and retail. Physical Intelligence is currently hardware-agnostic and targets robot OEM
              partners plus enterprise customers who already own or plan to deploy robot fleets.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
      - number: '2.2'
        title: TAM, SAM, and SOM Analysis
        blocks:
          - type: paragraph
            body: >
              Grand View Research estimates the physical AI market (embodied AI, robot intelligence software, autonomous
              systems) at approximately $81.6 billion in 2025 with a CAGR of approximately 32% through 2033.
              MarketsandMarkets estimates the AI-in-robotics market (intelligence and control software only) at $5.8
              billion in 2025 growing to $25.9 billion by 2030. McKinsey and BCG analyses suggest that robot software
              and AI layers will eventually capture 40–60% of total robotics value chain margins as proprietary
              intelligence becomes the primary differentiator over commodity hardware. For Physical Intelligence, the
              SOM in the near term (2026–2028) is constrained to early enterprise pilots in manufacturing and logistics,
              with an estimated SOM of $200–500 million if it can win 10–30% of the 100–300 enterprise accounts likely
              to adopt robot foundation model software in that window. This requires successful commercial launch,
              defensible per-robot licensing economics, and hardware partner scale-up.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
      - number: '2.3'
        title: Segment and Buyer Analysis
        blocks:
          - type: paragraph
            body: >
              The primary buyer segments for Physical Intelligence are: (1) robot OEM manufacturers who want to embed
              foundation model intelligence into their hardware (e.g., Agility Robotics, Boston Dynamics, smaller
              humanoid startups); (2) large enterprise operators who deploy robots in manufacturing or logistics and
              want cross-robot generalization without task-specific programming; and (3) system integrators who build
              turnkey automation solutions for factories and warehouses. The decision-maker in enterprise accounts is
              typically the VP of Operations, Chief Automation Officer, or VP of Engineering, with procurement involving
              IT security review, data residency requirements, and integration approval. Buying cycles in enterprise
              robotics are 12–24 months from pilot to contract; Physical Intelligence is in the pilot phase. The OEM
              partnership channel offers faster distribution but lower margins and higher dependency on hardware partner
              success. North America and Europe are primary markets today; Asia-Pacific (particularly Japan, South
              Korea, and China) represents the largest long- term volume market given high industrial robot density.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
      - number: '2.4'
        title: Growth Drivers and Market Constraints
        blocks:
          - type: paragraph
            body: >
              Key growth drivers include: (1) accelerating labor shortages in manufacturing and logistics due to
              demographic trends, which make robotics ROI calculations favorable; (2) rapid improvement in foundation
              model capabilities reducing the cost of robot task programming from $50,000–$250,000 per custom skill to
              near-zero with fine- tuning; (3) falling robot hardware costs (especially for collaborative robots and
              arms) expanding the deployable base; (4) increasing availability of robot training data through open
              datasets and synthetic simulation; and (5) strong capital inflows to the sector creating ecosystem
              development momentum. Constraints and risks include: (1) safety and reliability requirements for
              commercial deployment are extremely stringent; (2) integration complexity with legacy industrial systems
              remains high; (3) the open-source release of π₀ commoditizes the base model and challenges PI's ability to
              maintain proprietary moat; (4) well-funded competitors (Skild AI at $14B valuation, Google DeepMind,
              Figure AI) could out-execute; and (5) compute costs for training and inference are high relative to early
              commercial economics.
            claimRefs:
              - CM001
              - CM002
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Software-Layer Positioning Is the High-Margin Play
            body: >-
              Physical Intelligence deliberately avoids hardware manufacturing, targeting the software intelligence
              layer where margins in AI SaaS are 70–85% gross versus 20–40% for hardware. If robot foundation models
              follow the LLM API playbook, the company that establishes the dominant model-plus-ecosystem wins
              disproportionate economic value. However, this requires PI to establish commercial pricing and scale
              deployments before well-resourced incumbents close the gap.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
          - type: callout
            title: Open-Source Release Creates Ecosystem but Compresses Moat
            body: >-
              The February 2025 open-source release of π₀ accelerates developer ecosystem formation but simultaneously
              enables competitors to build on PI's base model. This parallels the Hugging Face / open LLM dynamic:
              community adoption builds brand and data contributions, but commoditization of base capabilities forces PI
              to differentiate on enterprise fine-tuning, support, and proprietary data. The net market effect is
              positive for total market growth but ambiguous for PI's long-term competitive position.
            calloutType: risk
            claimRefs:
              - CM001
              - CM002
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Framework and Market Structure
        blocks:
          - type: paragraph
            body: >
              The robot foundation model market can be segmented into three competitive archetypes. The first is pure
              software / intelligence-layer players, who build general-purpose robot brains without making hardware:
              Physical Intelligence and Skild AI are the primary examples. The second is full-stack robotics integrators
              who build both hardware and proprietary AI: Figure AI (humanoid arms + Helix VLA), 1X Technologies
              (humanoid + world model), and Agility Robotics (Digit + AI) are examples. The third is incumbent
              technology firms with adjacent compute and AI assets who are extending into robotics: Google DeepMind
              (Gemini Robotics 1.5), Amazon Robotics (Sequoia robotic drive systems + Sparrow), and NVIDIA (Cosmos world
              foundation model). Physical Intelligence most directly competes with Skild AI on the software intelligence
              layer, and with Google DeepMind on model capability and research credibility. Full-stack integrators are
              competitors for enterprise wallet share but also potential customers for PI's model.
            claimRefs:
              - CP001
              - CP002
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
      - number: '3.2'
        title: Key Competitor Profiles
        blocks:
          - type: paragraph
            body: >
              Skild AI, founded in 2023 and based in Pittsburgh, has raised $1.4 billion in a Series C round at a $14
              billion valuation (early 2026), led by SoftBank and NVIDIA, with Samsung and Salesforce Ventures
              participating. Its Skild Brain model claims cross-embodiment generalization via hierarchical architecture
              and achieves zero-shot task transfer. Crucially, Skild reported $30 million in revenue within months of
              its commercial launch in 2025, demonstrating monetization traction that Physical Intelligence has yet to
              achieve. Google DeepMind's Gemini Robotics 1.5 launched in early 2026 as a cloud-accessible VLA model with
              advanced agentic planning and multi-step reasoning — backed by Google's compute infrastructure, massive
              multimodal dataset, and distribution through the Gemini API. Figure AI, which earlier raised $675M at
              $39B+ valuation, builds proprietary humanoid robots (Figure 02) with its Helix VLA model, deployed at BMW
              manufacturing plants; this full-stack approach creates hardware moat but limits software-only
              distribution. Covariant (acquired by Amazon in 2024) focuses narrowly on warehouse/logistics manipulation
              and has the deepest real-world operational data. 1X Technologies, a Norwegian humanoid company, is
              developing a world model for robot cognition with up to $1B raise targeted at ~$10B valuation. Each
              competitor has distinct strengths; Physical Intelligence must differentiate on depth of dexterous
              manipulation, ecosystem openness, and research-grade model quality.
            claimRefs:
              - CP001
              - CP002
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
      - number: '3.3'
        title: Physical Intelligence Moat Analysis and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Physical Intelligence's competitive advantages are: (1) founder pedigree — the combination of Sergey
              Levine (RAIL Lab, Berkeley), Chelsea Finn (MAML, Stanford), and Karol Hausman (RT-2, DeepMind) is arguably
              the world's most credible robotics AI founding team; (2) dexterous manipulation depth — π₀ demonstrated
              industry-leading long- horizon dexterous tasks (laundry folding, assembly) not matched by most competitors
              in benchmarks; (3) open-source ecosystem — openpi creates developer community and training data
              contributions. Key risks to this moat include: (1) open-sourcing commoditizes the base model — Skild,
              Google, and others can benchmark against PI's published work; (2) Skild AI has $14B valuation with ~2.5×
              PI's funding and has already achieved commercial revenue; (3) Google DeepMind has orders of magnitude more
              compute and data, and Gemini Robotics 1.5 is accessible via API to any developer; (4) PI remains
              pre-revenue — if commercial launch is delayed, well-funded rivals will establish enterprise relationships
              first; (5) full-stack integrators (Figure AI, 1X) may have better hardware- software synergies for
              specific deployments. The moat is currently research-stage and not yet commercially proven. Physical
              Intelligence must prioritize commercial launch, hardware partner agreements, and safety certification
              before Skild AI establishes enterprise lock-in and before Google DeepMind completes its commercial API
              rollout for Gemini Robotics. The window for PI to establish a defensible position on commercially proven
              enterprise accounts is approximately 12–18 months from now. Beyond this window, the moat risks becoming
              primarily academic rather than commercially validated. The competitive dynamics in this market ultimately
              favor the player who first proves enterprise-grade reliability and establishes a recurring revenue base.
            claimRefs:
              - CP001
              - CP002
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP002
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Skild AI Leads on Commercial Traction — a Critical Gap
            body: >-
              Skild AI's reported $30M ARR within months of commercial launch represents the most significant
              competitive threat to Physical Intelligence. A software peer with comparable hardware-agnostic positioning
              but 2.5× the funding and already-proven revenue traction creates a first-mover advantage in enterprise
              relationships. If PI does not achieve commercial revenue within the next 12–18 months, Skild's data
              flywheel and enterprise lock-in could become insurmountable.
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
          - type: callout
            title: Google DeepMind Represents Asymmetric Compute and Data Threat
            body: >-
              Google DeepMind's Gemini Robotics 1.5 benefits from Alphabet's compute infrastructure, Google-scale
              multimodal training data, and the Gemini API distribution channel. Physical Intelligence cannot match this
              on compute or data scale without strategic partnerships or a step-change in funding. PI's research
              pedigree may hold near-term differentiation, but Google's advantages compound over time.
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Current Revenue Status
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence has no disclosed commercial revenue as of Q3 2026. The company is conducting early
              enterprise pilot programs in manufacturing and logistics, but no contracts, ARR, or commercial terms have
              been made public. The planned revenue model is a SaaS-per-robot licensing structure, whereby enterprise
              customers would pay a recurring annual fee per robot deployed using PI's foundation model. This is
              analogous to the per-seat or per-unit SaaS models used in enterprise software, applied to physical robots.
              No pricing has been publicly announced. Industry analogies suggest per-robot annual fees could range from
              $5,000 to $15,000, implying that reaching $50M ARR would require approximately 3,300–10,000 active robot
              deployments. Additional revenue streams may include model fine-tuning fees (one-time or recurring),
              enterprise deployment support, and potentially data licensing for robot training datasets. None of these
              have been announced. The openpi open-source release does not appear to generate direct revenue and is
              treated as a community and ecosystem investment. The company's pre-revenue status creates a binary risk:
              either commercial launch proceeds within 12–18 months and the enterprise pilot pipeline converts, or
              fundraising becomes increasingly difficult as competitors establish revenue traction.
            claimRefs:
              - CI001
              - CI002
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
      - number: '4.2'
        title: Cost Structure, Capital Intensity, and Burn Rate
        blocks:
          - type: paragraph
            body: >-
              Physical Intelligence's cost structure is dominated by research and engineering personnel (estimated at
              150–250 employees in Q3 2026), GPU compute for model training and inference, and overhead for a premium
              San Francisco location. Annual personnel cost at an average all-in compensation of $300,000–$400,000 per
              employee implies a personnel burn rate of approximately $45–$100 million per year depending on headcount.
              Compute costs for training large robot VLA models on diverse embodiment data are significant; industry
              benchmarks for models of π₀'s scale suggest training runs costing $5–20 million per major version, with
              ongoing inference costs accruing at scale. Total estimated annual burn is $70–$150 million, implying that
              the $600M Series B alone provides approximately 4–8 years of runway if the company does not scale its
              compute or headcount substantially. However, achieving commercial scale will require significant headcount
              and compute expansion, likely compressing runway to 24–36 months at full commercial build-out. Physical
              Intelligence has not disclosed its actual burn rate or cash on hand. There is no publicly disclosed debt
              financing, and the company has not reported operating losses through regulatory filings as it remains
              private with no SEC reporting obligation beyond Form D exempt offerings. Additionally, capital expenditure
              for custom robotics lab infrastructure, safety testing equipment, and potential manufacturing partnerships
              for pilot programs would add to the cost base. A company of this profile at this stage typically allocates
              60–70% of burn to personnel, 20–25% to compute, and 10–15% to facilities and other overhead. These
              proportions are consistent with comparable AI research startups and suggest that Physical Intelligence's
              total annual operating costs could realistically reach $120 million or more if headcount approaches 250
              and compute expenditure scales with next-generation model development.
            claimRefs:
              - CI001
              - CI002
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
      - number: '4.3'
        title: Capital Adequacy, Funding Path, and Financial Risks
        blocks:
          - type: paragraph
            body: >
              With approximately $1.07 billion raised across three rounds and an estimated burn of $70–$150 million per
              year, Physical Intelligence's estimated runway is approximately 24–60 months depending on pace of
              commercial scale-up. The company is reportedly in advanced talks for a next funding round at an $11
              billion valuation as of April 2026, which if completed at $500M+ would further extend runway by 3–6 years.
              The key financial risks are: (1) the company must achieve at least $50M ARR to justify continued investor
              confidence before its next raise; (2) if commercial conversion of pilots stalls, the valuation step-up
              becomes difficult to defend — the current $5.6B valuation implies an infinite revenue multiple; (3)
              compute costs for training successive model generations could compress runway faster than expected; (4) a
              market downturn or investor sentiment shift could close the fundraising window at AI valuations that do
              not account for zero revenue. The company has no disclosed customer concentration risk as it has no
              commercial customers. Required source types for financial diligence include official company
              communications and regulatory filings; the only SEC Form D filed is for the Series B exempt offering which
              discloses no financial details beyond offering size.
            claimRefs:
              - CI001
              - CI002
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Zero Revenue at $5.6 Billion Valuation — An Extreme Bet
            body: >-
              Physical Intelligence's $5.6 billion valuation with $0 commercial revenue implies an effectively infinite
              revenue multiple. This is justified only if investors believe PI will establish category leadership in
              robot foundation model software at significant scale within 3–5 years. The company needs to convert
              enterprise pilots to revenue-generating contracts and publicly demonstrate commercial traction within the
              next 12–18 months to sustain investor confidence for the reported $11B next round.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
          - type: callout
            title: Burn Rate Estimates Suggest Adequate Runway for Commercial Launch
            body: >-
              If PI's estimated annual burn of $70–$150M is accurate, the $600M Series B alone provides approximately
              4–8 years of runway at the pre-commercial scale. This is sufficient to fund commercial launch and initial
              deployment scaling without requiring an immediate next raise. However, actual runway compresses
              significantly if headcount and compute investments accelerate to capture market opportunity.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Architecture
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence's core product is the π₀ family of robot foundation models. Unlike prior robot AI
              systems that are trained on single robot types and single tasks, π₀ is designed to be cross-embodiment:
              the same model weights are used across 68 distinct robot hardware configurations, ranging from single-arm
              manipulators to bimanual dexterous hands. This cross-embodiment training provides two practical benefits.
              First, it gives the model broader generalization capability, allowing it to transfer skills learned on one
              robot to a new robot with minimal fine-tuning. Second, it allows the company to aggregate training data
              from diverse hardware partners rather than being constrained to data from a single robot design. The
              architecture fuses a pre-trained PaliGemma 3B vision-language model (VLM) with a 300-million-parameter
              action expert transformer. The VLM component handles language instruction understanding and visual scene
              parsing. The action expert generates continuous robot control signals (joint positions, velocities, or
              Cartesian targets depending on the robot) using flow matching, a generative modeling technique that
              outperforms diffusion-based action policies on both accuracy and inference speed. The π₀.5 variant extends
              π₀ with enhanced internet-scale pre-training for broader semantic understanding. π₀-FAST addresses
              inference latency with a faster single-pass action decoder for time-critical tasks. The openpi open-source
              package provides fine-tuning utilities for external research communities using the π₀ weights.
            claimRefs:
              - CE001
              - CE002
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
      - number: '5.2'
        title: Technical Performance and Benchmarks
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence published benchmark results in its arXiv preprint showing that π₀ outperforms prior
              state-of-the-art on the LIBERO benchmark suite, which tests dexterous manipulation tasks including folding
              laundry, organizing objects, and assembling components. Specifically, π₀ achieves materially higher task
              completion rates than OpenVLA, RT-2, and Octo when fine-tuned with limited demonstration data, a metric
              critical for enterprise deployment where extensive robot-specific data collection is expensive. The model
              demonstrates particularly strong capability in long-horizon dexterous manipulation tasks, which are widely
              considered the hardest unsolved problems in robot AI: tasks requiring sequential contact-rich actions over
              many seconds, such as folding laundry or loading a dishwasher. Physical Intelligence has reported that π₀
              can complete these tasks at success rates competitive with the best prior systems but with significantly
              higher data efficiency. However, published benchmarks reflect controlled laboratory settings and do not
              directly validate performance in production enterprise environments with unstructured workspaces, varying
              lighting, and real-time reliability requirements. The gap between laboratory benchmark success rates and
              enterprise production reliability is a key open technical risk. Industry experience in robotics suggests
              that production deployment success rates are typically 20–40 percentage points below laboratory results.
            claimRefs:
              - CE001
              - CE002
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
      - number: '5.3'
        title: Differentiation, IP, and Trust Posture
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence's primary technology differentiation is its VLA architecture combining pre-trained
              VLM reasoning with a flow-matching action expert, trained across the largest reported cross-embodiment
              robot dataset assembled to date. The founding team's academic credentials are exceptional: Sergey Levine
              (UC Berkeley RAIL Lab, inventor of model-agnostic meta-learning MAML-adjacent approaches), Chelsea Finn
              (MAML co-inventor, Stanford AI Lab), and Karol Hausman (Google DeepMind Robotic Learning). This team has
              authored foundational papers cited thousands of times. The openpi release has generated developer
              community adoption measured by GitHub stars and external research citations. The key IP risks are: (1) the
              core architecture relies on PaliGemma (a Google DeepMind model), creating dependency on Google's licensing
              terms; (2) training data provenance and copyright status for robot demonstration videos are not publicly
              disclosed; (3) the arXiv preprint reveals the technical approach in detail, lowering the barrier for
              well-resourced competitors to replicate. On safety and trust, Physical Intelligence has not disclosed
              whether π₀ has undergone third-party safety certification, functional safety audits (ISO 13849 / IEC
              62061), or cybersecurity penetration testing. For enterprise deployment, customers in manufacturing and
              logistics will require documented safety cases and potentially regulatory clearance in CE/OSHA-regulated
              environments. The openpi release includes no documented safety constraints or deployment guardrails beyond
              technical capability constraints, which is a gap relative to what enterprise customers will require for
              production deployment.
            claimRefs:
              - CE001
              - CE002
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: PaliGemma Backbone Creates Structural Google Dependency
            body: >-
              Physical Intelligence's core VLA architecture uses PaliGemma 3B, a model released by Google DeepMind under
              open weights terms. A change in Google's licensing policy or a decision to restrict commercial use of
              PaliGemma would require Physical Intelligence to retrain its foundational model from scratch on an
              alternative backbone, at a cost of tens of millions of dollars and 6–12 months of delay. This is a
              material single-vendor dependency risk that diligence should address with contractual protections if
              possible.
            calloutType: risk
            claimRefs:
              - CE001
              - CE002
          - type: callout
            title: Cross-Embodiment Training Is the Core Defensible Differentiator
            body: >-
              Physical Intelligence's training across 68 robot embodiments is the most distinctive capability claim in
              the field. If this breadth of cross-embodiment coverage is genuine and generalizable to new robot types,
              it provides a data flywheel and model generalization advantage that would take competitors years to
              replicate. Verifying that the 68 embodiments include commercially relevant robot types (not just academic
              research platforms) is a key diligence priority.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Current Status
        blocks:
          - type: paragraph
            body: >-
              Physical Intelligence is in a pure pre-revenue, pre-customer phase as of Q3 2026. The company has publicly
              indicated that it is conducting enterprise pilot programs with unnamed manufacturing and logistics
              customers, but no commercial contracts, customer counts, ARR, or reference customers have been disclosed.
              Based on publicly available information, the expected enterprise customer segmentation is: large
              manufacturers with high-density robot deployments (automotive, electronics, consumer goods assembly),
              logistics and e-commerce warehousing operators requiring flexible pick-and-pack automation, food service
              and hospitality operators requiring dexterous manipulation for food preparation and kitchen tasks, and
              potentially government or defense customers for unstructured environment manipulation. The company has no
              SMB or mid-market go-to-market motion announced; all indicated pilots involve large enterprise accounts
              with the budget and operational scale to deploy dozens to hundreds of robots. The robot OEM partner
              network (which includes hardware companies that contributed embodiment data during training) represents a
              potential indirect customer or reseller channel through which PI software could be licensed on top of
              partner hardware, creating a B2B2B distribution path alongside direct enterprise sales. There is no SMB or
              self-serve channel, no product-led growth motion, and no disclosed freemium conversion path from the
              openpi open-source release to enterprise contracts. The entire commercial path is enterprise direct and
              OEM channel sales at this stage.
            claimRefs:
              - CU001
              - CU002
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
      - number: '6.2'
        title: Pilot Activity and Adoption Evidence
        blocks:
          - type: paragraph
            body: >
              Press reporting from 2024–2025 confirms that Physical Intelligence is engaged in enterprise pilot programs
              with at least two named companies: AgiBot (a Chinese robot manufacturer) and Longcheer Technology (an
              electronics manufacturer), both of which are early-stage cross-embodiment data contributors as well as
              pilot customers. These are the only named customer-proximate relationships available from public sources.
              The openpi open-source community provides a secondary signal of adoption: the repository has accumulated
              thousands of GitHub stars and active external fine-tuning activity from academic and industry research
              teams. This community signal validates developer interest and the utility of the technical approach, but
              it does not constitute enterprise customer traction and does not generate revenue. Physical Intelligence
              has published demo videos of π₀ completing tasks in controlled environments; these videos have received
              significant coverage in technology media (The Verge, IEEE Spectrum, VentureBeat), suggesting strong
              awareness among potential enterprise buyers. Awareness and interest do not translate directly to
              purchasing intent without further commercial validation. The critical unknown is the conversion rate from
              enterprise pilot to signed commercial contract, which is the single most important financial metric for
              any prospective investor to validate in due diligence.
            claimRefs:
              - CU001
              - CU002
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
      - number: '6.3'
        title: Retention Outlook, Concentration Risk, and Expansion
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence has no retention metrics, churn data, NRR, or contract renewal data because it has
              no commercial customers. Retention analysis must therefore be forward-looking and based on structural
              characteristics of the planned SaaS-per-robot model. Retention is structurally expected to be high
              because: (1) robot AI models accumulate customer-specific fine-tuning data over time, creating a switching
              cost equivalent to losing months of proprietary task training data; (2) enterprise robot fleets represent
              major capital investments that create inertia against software vendor changes; (3) integration with safety
              certification workflows and production scheduling systems creates additional switching barriers. These
              structural factors suggest that once Physical Intelligence achieves commercial deployment, gross revenue
              retention above 90% is plausible, but this is entirely theoretical at this stage. Customer concentration
              risk is unknown but expected to be high in the near term if and when commercial launch occurs, because the
              company is likely to close a small number of large enterprise accounts first, creating significant
              top-customer concentration. Diligence should require disclosure of the top-5 customer revenue
              concentration and any minimum purchase commitments in pilot agreements. The expansion model (land one
              deployment in a customer's facility, then expand to additional facilities or robot types) has attractive
              unit economics if customer lifetime is 5+ years and expansion multiplier is 2–5×, but none of this has
              been demonstrated operationally.
            claimRefs:
              - CU001
              - CU002
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Zero Commercial Customers — Highest Customer Risk Rating
            body: >-
              Physical Intelligence has no commercial customers as of Q3 2026. This is the single highest-risk dimension
              of the entire diligence assessment. Investor confidence in the $5.6B valuation depends entirely on the
              assumption that enterprise pilot programs will convert to commercial contracts at acceptable rates,
              timelines, and ACV levels. None of these have been demonstrated. The diligence requirement is a verified
              pilot conversion plan with concrete timelines and at least one signed letter of intent from a named
              enterprise customer.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
          - type: callout
            title: Structural Switching Costs Support High Projected Retention
            body: >-
              Robot AI models that accumulate task-specific fine-tuning data over time create a de facto switching cost
              equivalent to losing months or years of proprietary training investment. Combined with integration into
              safety certification workflows and production scheduling, this suggests Physical Intelligence could
              achieve gross revenue retention above 90% once commercial deployment is established. The risk is that this
              retention advantage depends on the enterprise customer genuinely deploying robots at scale — if pilot
              programs do not convert, retention metrics are irrelevant.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence's most significant regulatory risk is the EU AI Act, which classifies AI systems
              operating in physical environments with potential for harm as potentially high-risk under Annex III. Robot
              AI systems deployed in manufacturing or logistics contexts will likely require conformity assessment,
              human oversight mechanisms, technical documentation, and post-market monitoring before EU commercial
              deployment. Compliance with the EU AI Act is expected to add 12–24 months to the EU go-to-market timeline
              and require significant legal and engineering resources. In the United States, OSHA workplace safety
              regulations and NIST AI Risk Management Framework guidelines apply to AI systems in workplace
              environments, but current US regulatory requirements are less prescriptive than the EU Act and do not
              block near-term domestic deployment. Functional safety certification under ISO 13849 and IEC 62061 is
              required for robot software deployed in manufacturing environments with human-robot collaboration;
              Physical Intelligence has not disclosed any certification progress. Training data IP liability is a latent
              legal risk: if Physical Intelligence's robot demonstration dataset includes video content derived from
              copyrighted sources (manufacturing process videos, proprietary robot operation recordings), IP claims from
              data originators could constrain the company's freedom to operate. There are no known active litigation
              proceedings, regulatory enforcement actions, or material legal disputes against Physical Intelligence as
              of Q3 2026.
            claimRefs:
              - CR001
              - CR002
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
      - number: '7.2'
        title: Operational, Competitive, and Technical Risk
        blocks:
          - type: paragraph
            body: >
              The most acute operational risk is the lab-to-production gap for π₀. While the model demonstrates
              impressive benchmark performance in controlled laboratory conditions, production manufacturing and
              logistics environments are significantly more challenging: unstructured workspaces, variable lighting,
              mixed human and robot traffic, real-time reliability requirements, and the need for 99%+ uptime. Industry
              experience in robotics consistently shows a 20–40 percentage point performance degradation from laboratory
              to production. If Physical Intelligence cannot close this gap during its pilot phase, commercial
              conversion will fail. Competitive operational risk is high from Skild AI, which has already achieved ~$30M
              ARR and is building a commercial data flywheel. Each quarter that Skild AI accumulates production
              deployment data, its model quality improves, widening the competitive moat. Google DeepMind's Gemini
              Robotics 1.5 poses an existential-level competitive threat: Google has effectively unlimited compute,
              direct access to PaliGemma (which Physical Intelligence depends on), and deep enterprise relationships
              through Google Cloud and Google Workspace that provide a natural robot AI distribution channel. Physical
              Intelligence's open-source strategy (openpi) creates a replication risk: a sufficiently motivated
              competitor with compute access can use the published arXiv preprint and the openpi codebase as a starting
              point for replication, compressing the research moat from years to months.
            claimRefs:
              - CR001
              - CR002
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
      - number: '7.3'
        title: Financial, Dependency, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence's financial risk profile is extreme at its current valuation: zero revenue,
              $70–$150M estimated annual burn, and a reported next round at $11B that would require demonstrating
              meaningful commercial traction to close. If the $11B round does not close and commercial revenue remains
              at zero, the company would need to either cut burn dramatically or accept down-round financing, both of
              which carry material equity dilution and talent retention risks. The PaliGemma dependency on Google
              DeepMind is both a technical and financial risk: Google is simultaneously an investor (via CapitalG), a
              technology dependency (PaliGemma), and a direct competitor (Gemini Robotics). If Google restricts
              PaliGemma commercial licensing or acquires a competitor, Physical Intelligence's core architecture is at
              risk. Key-person risk is concentrated: Sergey Levine is the primary public face of the technical approach
              and his departure would impair the technical credibility of the company with investors, potential
              partners, and enterprise customers. Chelsea Finn (MAML co-inventor) and Karol Hausman (CEO) represent
              similar concentration. The company has not disclosed any key-person insurance, founder vesting schedules,
              or retention arrangements. Capital concentration risk is also notable: Lux Capital participated in all
              three rounds, and CapitalG (Alphabet) led the Series B, meaning two investors have majority influence on
              the cap table and board dynamics.
            claimRefs:
              - CR001
              - CR002
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Pre-Revenue at $5.6B Is the Central Thesis-Break Risk
            body: >-
              Physical Intelligence's zero-revenue status at a $5.6 billion valuation is not merely a financial metric
              gap — it is the central thesis-break risk for any investment at current pricing. The company must convert
              enterprise pilots to revenue-generating contracts within 12–18 months or face a fundraising environment
              that will not support an $11 billion next round. This timeline is shorter than typical enterprise robotics
              sales cycles, creating structural urgency that the founding team must manage actively.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Google Is Simultaneously Investor, Dependency, and Competitor
            body: >-
              CapitalG (Alphabet) led Physical Intelligence's Series B while Google DeepMind competes directly via
              Gemini Robotics. Physical Intelligence's core architecture depends on PaliGemma (Google DeepMind). This
              creates a tripartite risk: investor, dependency, and competitor in the same corporate family. Board-level
              governance terms and contractual protections for PaliGemma commercial use are critical diligence items
              that are not currently in the public record.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence closed its Series B in November 2025 at a $5.6 billion post-money valuation on $600
              million raised, implying a $5.0 billion pre-money entry by CapitalG (Alphabet), T. Rowe Price, Redpoint,
              and Lux Capital. The company had zero commercial revenue at closing. There is no precedent in the robotics
              AI sector for a company achieving a $5.6B valuation at zero ARR within 20 months of founding. The
              valuation is justified by three factors: (1) exceptional team quality (Levine, Finn, Hausman are top-tier
              researchers); (2) technical execution (π₀ paper and demos received strong academic and industry
              validation); and (3) investor belief in the market size ($170B+ service robot market by 2030) and Physical
              Intelligence's potential to own the robot foundation model API layer analogous to OpenAI in LLMs. The
              reported next round at $11 billion (April 2026, unconfirmed) would represent a 2× step-up in under six
              months, which is only credible if the company has signed multiple enterprise LOIs or announced a
              commercial partner of material scale. Any investor entering at $11B has an even narrower margin of safety
              than the Series B investors: at $11B with zero revenue, the revenue multiple recovery to a reasonable 10×
              exit requires $1.1 billion in ARR, which implies a leading robot foundation model company at the scale of
              a top-five enterprise SaaS business. This is a 10–15 year horizon, not 5–7 years.
            claimRefs:
              - CV001
              - CV002
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
      - number: '8.2'
        title: Comparable Valuation Framework
        blocks:
          - type: paragraph
            body: >
              In the absence of revenue, valuation must be based on comparable-stage transactions. The most relevant
              comparables are: (1) LLM foundation model companies at pre-/early-revenue stage (OpenAI at $80B at ~$1B
              ARR = 80× forward revenue, implying Physical Intelligence at $5.6B would need ~$70M ARR to be "in range"
              at comparable multiples); (2) robot AI companies at comparable funding stages (Skild AI at $14B at ~$30M
              ARR = 467× revenue, which is extreme but reflects market-clearing demand); (3) pure research-stage AI
              companies with no revenue (Inflection AI at $4B with no commercial product before the Microsoft
              partnership). Physical Intelligence at $5.6B is within the range of extreme pre-revenue AI company
              valuations but at the high end for a robotics-specific company. The key valuation anchors are: (a) if
              Physical Intelligence achieves $50M ARR by 2027, a 50× forward revenue multiple (aggressive) would support
              $2.5B valuation, implying downside from $5.6B; (b) if it achieves $200M ARR by 2028, a 30× forward
              multiple (moderate) would support $6B, in line with the Series B; (c) the bull case requires $400M+ ARR by
              2028 at 20× to justify an $8B valuation, which approaches the lower end of the $11B reported next round.
              The conclusion is that the Series B valuation is "fair" only if Physical Intelligence delivers significant
              commercial traction within 24 months, and the reported next round is extremely aggressive without
              announced commercial revenue.
            claimRefs:
              - CV001
              - CV002
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
      - number: '8.3'
        title: Recommendation, Exit Readiness, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Our recommendation is CAUTION — PASS or WATCH at current valuation, with conditions for a future entry.
              The technology is credible, the team is world-class, and the robot foundation model market has a plausible
              path to very large scale. However, the $5.6B valuation at zero revenue provides insufficient margin of
              safety for most institutional investors, and the reported $11B next round is extremely aggressive. The
              conditions under which we would recommend entry are: (1) Physical Intelligence announces at least $50M ARR
              from two or more named enterprise customers; (2) the company completes at least one functional safety
              certification (ISO 13849 or CE marking) enabling production deployment; (3) a PaliGemma commercial
              licensing agreement with Google is documented and disclosed; (4) Sergey Levine's retention and vesting
              schedule is confirmed. Exit readiness is 5–7 years from now at minimum assuming commercial launch in
              2026–2027 and a typical enterprise software scale trajectory. Strategic acquirers include Amazon,
              Microsoft (via Azure robotics), Samsung, Hyundai, and any major industrial conglomerate seeking an AI
              robot stack. IPO readiness would require $300M+ ARR and positive gross margin at scale, which is a 2029+
              event on optimistic assumptions. Final diligence asks are enumerated in T808.
            claimRefs:
              - CV001
              - CV002
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The $5.6B Valuation Requires $187M ARR to Be "Fair" at 30× Forward Multiple
            body: >-
              At a $5.6 billion valuation and a 30× forward revenue multiple (reasonable for high-growth AI SaaS),
              Physical Intelligence would need $187 million in ARR to justify the current entry price. No robotics AI
              company has achieved this ARR within 3 years of founding. This is not an investment thesis — it is an
              option on a 1-in-10 outcome. Investors must be explicit about this pricing risk.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
          - type: callout
            title: Watch-and-Invest Strategy Is Preferable to Current Entry
            body: >-
              Given the extreme valuation and zero commercial proof, a watch-and-invest strategy is significantly
              preferable to an immediate entry at $5.6B or $11B. An investor who waits for Physical Intelligence to
              demonstrate $50M ARR, functional safety certification, and PaliGemma commercial licensing would enter at
              potentially higher valuation but with dramatically lower binary risk. The incremental upside from entering
              earlier does not compensate for the commercial uncertainty at current prices.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
