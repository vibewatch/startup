  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与架构
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence 的核心产品是 π₀ 系列机器人基础模型。以往机器人 AI 系统通常只在单一机器人类型和单一任务上训练；π₀ 的设计目标则是跨形态：同一套模型权重用于 68
              种不同机器人硬件配置，从单臂机械臂到双手灵巧手都有覆盖。跨形态训练带来两个实际好处。第一，模型泛化更广，可把在一个机器人上学到的技能迁移到新机器人上，只需少量微调。第二，公司可以聚合来自不同硬件合作伙伴的训练数据，而不是受限于单一机器人设计的数据。架构上，π₀
              融合预训练 PaliGemma 3B 视觉-语言模型（VLM）和 300-million-parameter 动作专家 transformer。VLM
              组件负责理解语言指令和解析视觉场景。动作专家借助流匹配生成连续机器人控制信号（关节位置、速度，或随机器人不同而变化的笛卡尔目标）；流匹配是一种生成式建模技术，在准确率和推理速度上都优于基于扩散的动作策略。π₀.5
              在 π₀ 基础上加入更强的互联网规模预训练，以拓宽语义理解。π₀-FAST 用更快的单次动作解码器降低推理延迟，面向时间敏感任务。openpi 开源包为外部研究社区提供基于 π₀ 权重的微调工具。
            claimRefs:
              - CE001
              - CE002
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
      - number: '5.2'
        title: 技术表现与基准
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence 在 arXiv 预印本中发布的基准结果显示，π₀ 在 LIBERO
              基准套件上超过此前最先进方法；该套件测试叠衣、整理物品、组装部件等灵巧操作任务。具体而言，在有限演示数据下微调时，π₀ 的任务完成率显著高于 OpenVLA、RT-2 和
              Octo；这项指标对企业部署至关重要，因为大规模收集特定机器人数据成本很高。模型在长时程灵巧操作任务上表现尤其强，这类任务被普遍视为机器人 AI
              中最难的未解问题：需要在多秒内连续完成接触密集动作，例如叠衣或装洗碗机。Physical Intelligence 报告称，π₀
              在这些任务上的成功率可与此前最佳系统竞争，同时数据效率明显更高。不过，已发布基准来自受控实验室环境，并不能直接验证模型在生产型企业环境中的表现；真实环境会有非结构化工作区、光照变化和实时可靠性要求。实验室基准成功率与企业生产可靠性之间的落差，是关键未解技术风险。机器人行业经验显示，生产部署成功率通常比实验室结果低
              20–40 个百分点。
            claimRefs:
              - CE001
              - CE002
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
      - number: '5.3'
        title: 差异化、知识产权与信任姿态
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence 的主要技术差异化在于 VLA 架构：把预训练 VLM 推理与流匹配动作专家结合，并在据称迄今最大的跨形态机器人数据集上训练。创始团队学术履历极强：Sergey
              Levine（UC Berkeley RAIL Lab，model-agnostic meta-learning MAML 邻近方法发明者）、Chelsea Finn（MAML 共同发明者，Stanford AI
              Lab）和 Karol Hausman（Google DeepMind Robotic Learning）。这支团队发表过被引用数千次的基础论文。openpi 发布后，GitHub star
              和外部研究引用显示开发者社区已有采用。关键 IP 风险包括：（1）核心架构依赖 PaliGemma（Google DeepMind 模型），使公司受 Google
              授权条款制约；（2）机器人演示视频训练数据的来源和版权状态未公开披露；（3）arXiv 预印本详细披露技术路径，降低了资源充足的竞争者复现门槛。安全和信任上，Physical Intelligence 尚未披露
              π₀ 是否经过第三方安全认证、功能安全审计（ISO 13849 / IEC 62061）或网络安全渗透测试。企业部署时，制造和物流客户会要求记录完整的安全论证，并可能要求在 CE/OSHA
              监管环境中取得监管许可。openpi 发布内容除了技术能力约束外，没有记录安全约束或部署护栏；相较企业客户生产部署要求，这是一个缺口。
            claimRefs:
              - CE001
              - CE002
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
      - number: '5.4'
        title: 展示
        blocks:
          - type: callout
            title: PaliGemma 骨干造成结构性 Google 依赖
            body: >-
              Physical Intelligence 的核心 VLA 架构使用 PaliGemma 3B，这是 Google DeepMind 按开放权重条款发布的模型。如果 Google 更改授权政策，或决定限制
              PaliGemma 商业使用，Physical Intelligence 就需要在替代骨干上从零重训基础模型，成本可能达数千万美元，并造成 6–12
              个月延误。这是重大的单一供应商依赖风险；尽调中应尽可能用合同保护覆盖。
            calloutType: risk
            claimRefs:
              - CE001
              - CE002
          - type: callout
            title: 跨形态训练是核心可防守差异点
            body: >-
              Physical Intelligence 在 68
              种机器人形态上训练，是该领域最独特的能力主张。如果这种跨形态覆盖广度真实存在，并能泛化到新机器人类型，就会带来数据飞轮和模型泛化优势，竞争对手需要多年才能复制。验证这 68
              种形态是否包括商业相关机器人类型（而不只是学术研究平台），是关键尽调重点。
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分与当前状态
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年第三季度，Physical Intelligence 处于完全收入前、客户前阶段。公司公开表示正在与未具名制造和物流客户开展企业试点，但尚未披露商业合同、客户数、ARR
              或参考客户。基于公开信息，预期企业客户细分包括：机器人部署密度高的大型制造商（汽车、电子、消费品装配）、需要柔性拣选与包装自动化的物流和电商仓储运营商、需要灵巧操作来完成备餐和厨房任务的餐饮与酒店运营商，以及可能需要非结构化环境操作能力的政府或国防客户。公司未公布面向
              SMB 或中端市场的获客动作；所有已显示试点都涉及大型企业账号，这些客户有预算和运营规模部署数十到数百台机器人。机器人 OEM 合作伙伴网络（包括训练期间贡献形态数据的硬件公司）构成潜在间接客户或转售渠道，PI
              软件可叠加在伙伴硬件之上授权，与直销企业并行形成 B2B2B 分发路径。公司没有 SMB 或自助渠道，没有产品驱动增长动作，也未披露从 openpi
              开源发布转化到企业合同的免费增值路径。现阶段，整条商业路径都是企业直销和 OEM 渠道销售。
            claimRefs:
              - CU001
              - CU002
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
      - number: '6.2'
        title: 试点活动与采用证据
        blocks:
          - type: paragraph
            body: >
              2024–2025 年新闻报道确认，Physical Intelligence 正与至少两家具名公司推进企业试点：AgiBot（一家中国机器人制造商）和 Longcheer
              Technology（一家电子制造商）。两家公司都是早期跨形态数据贡献方，也接近试点客户。这是公开来源中仅有的具名、接近客户的关系。openpi 开源社区提供了第二层采用信号：仓库已积累数千个 GitHub
              星标，学术和行业研究团队有活跃的外部微调活动。该社区信号证明开发者兴趣和技术路线效用，但不构成企业客户牵引，也不产生收入。Physical Intelligence 发布过 π₀
              在受控环境中完成任务的演示视频；这些视频获得 The Verge、IEEE Spectrum、VentureBeat
              等科技媒体广泛报道，说明潜在企业买方已有较高认知。不过，认知和兴趣不会在缺乏进一步商业验证时直接转化为购买意向。关键未知项是企业试点转为签署商业合同的转化率；这是任何潜在投资者在尽调中最需要验证的单一财务指标。
            claimRefs:
              - CU001
              - CU002
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
      - number: '6.3'
        title: 留存前景、集中风险与扩张
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence 没有留存指标、流失数据、NRR 或合同续约数据，因为没有商业客户。因此，留存分析必须前瞻地基于计划中的按机器人计费 SaaS
              模型结构特征。留存预计在结构上较高，因为：（1）机器人 AI
              模型会随时间积累客户特定微调数据，切换供应商等同于丢失数月专有任务训练数据，形成切换成本；（2）企业机器人队列是重大资本投入，会抑制软件供应商变更；（3）与安全认证流程和生产排程系统集成，会带来额外切换壁垒。这些结构因素显示，一旦
              Physical Intelligence 实现商业部署，总收入留存超过 90%
              是可能的，但现阶段完全停留在理论层面。客户集中风险未知；若商业发布发生，短期内预计会较高，因为公司可能先拿下少数大型企业账号，形成显著头部客户集中。尽调应要求披露前五大客户收入集中度，以及试点协议中的任何最低采购承诺。扩张模型（先在客户一个设施落地，再扩展到更多设施或机器人类型）若客户生命周期达到
              5+ 年、扩张倍数为 2–5×，单元经济模型很有吸引力；但这些尚未在运营上得到证明。
            claimRefs:
              - CU001
              - CU002
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
      - number: '6.4'
        title: 展示
        blocks:
          - type: callout
            title: 零商业客户——最高客户风险评级
            body: >-
              截至 2026 年第三季度，Physical Intelligence 没有商业客户。这是整个尽调评估中风险最高的维度。投资者对 $5.6B 估值的信心，完全取决于企业试点会以可接受的转化率、时间表和 ACV
              水平转为商业合同这一假设。这些均未被证明。尽调要求是：具名企业客户提供至少一份已签署意向书，并验证带有具体时间表的试点转化计划。
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
          - type: callout
            title: 结构性切换成本支撑较高的预计留存
            body: >-
              随时间积累任务特定微调数据的机器人 AI 模型，会形成事实上的切换成本，等同于损失数月甚至数年的专有训练投入。再叠加安全认证流程和生产排程集成，Physical Intelligence
              一旦建立商业部署，可能实现 90% 以上总收入留存。风险在于，这一留存优势取决于企业客户真正大规模部署机器人——如果试点项目不能转化，留存指标就没有意义。
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence 最重要的监管风险是 EU AI Act；该法案将可能造成伤害、在物理环境中运行的 AI 系统归入 Annex III 下潜在高风险类别。部署在制造或物流场景中的机器人
              AI 系统，在欧盟商业部署前，很可能需要完成符合性评估、人类监督机制、技术文档和上市后监测。遵守 EU AI Act 预计会让欧盟市场进入 时间线增加 12–24
              个月，并消耗大量法律和工程资源。美国方面，OSHA 工作场所安全法规和 NIST AI Risk Management Framework 指南适用于工作环境中的 AI 系统，但当前美国监管要求不如 EU Act
              具体，也不会阻碍短期国内部署。在存在人机协作的制造环境中部署机器人软件，需要满足 ISO 13849 和 IEC 62061 功能安全认证；Physical Intelligence
              尚未披露任何认证进展。训练数据 IP 责任是潜在法律风险：如果 Physical Intelligence 的机器人演示数据集包含来自受版权保护来源的视频内容（制造流程视频、专有机器人操作记录），数据来源方的
              IP 主张可能限制公司的运营自由。截至 2026 年第三季度，未发现针对 Physical Intelligence 的已知活跃诉讼、监管执法行动或重大法律纠纷。
            claimRefs:
              - CR001
              - CR002
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
      - number: '7.2'
        title: 运营、竞争与技术风险
        blocks:
          - type: paragraph
            body: >
              最尖锐的运营风险，是 π₀ 从实验室走向生产的缺口。模型在受控实验室条件下跑出亮眼基准，但制造和物流现场难得多：工作空间非结构化、光照多变、人和机器人混行、可靠性要实时达标，还要 99%+
              正常运行时间。机器人行业经验反复表明，从实验室到生产，性能通常会掉 20–40 个百分点。如果 Physical Intelligence 在试点阶段补不上这个缺口，商业转化就会失败。来自 Skild AI
              的竞争运营风险很高：Skild AI 已做到约 $30M ARR，并在搭建商业数据飞轮。Skild AI 每多一个季度积累生产部署数据，模型质量就会提高，竞争护城河也随之加宽。Google DeepMind 的
              Gemini Robotics 1.5 是存在级竞争威胁：Google 算力几乎没有上限，能直接使用 PaliGemma（Physical Intelligence 依赖它），还通过 Google Cloud 和
              Google Workspace 掌握深厚企业关系，这些关系天然可以变成机器人 AI 分销渠道。Physical Intelligence
              的开源策略（openpi）带来复制风险：只要竞争对手足够有动力且拿得到算力，就能以已发布的 arXiv 预印本和 openpi 代码库为起点复现，把研究护城河从几年压缩到几个月。
            claimRefs:
              - CR001
              - CR002
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
      - number: '7.3'
        title: 财务、依赖与关键人物风险
        blocks:
          - type: paragraph
            body: >
              以当前估值看，Physical Intelligence 的财务风险画像极端：零收入、估计每年烧钱 $70–$150M，且据报道下一轮估值 $11B；要完成该轮，公司必须证明已有实质商业牵引。如果 $11B
              轮融不成，而商业收入仍为零，公司要么大幅砍烧钱速度，要么接受降估值融资；两者都意味着重大股权稀释和人才留存风险。对 Google DeepMind 的 PaliGemma
              依赖既是技术风险，也是财务风险：Google 同时是投资方（通过 CapitalG）、技术依赖方（PaliGemma）和直接竞争者（Gemini Robotics）。如果 Google 限制 PaliGemma
              商业许可，或收购竞争对手，Physical Intelligence 的核心架构就会承压。关键人物风险高度集中：Sergey Levine
              是技术路线最主要的公开面孔；如果他离开，公司在投资人、潜在伙伴和企业客户面前的技术可信度都会受损。Chelsea Finn（MAML 共同发明人）和 Karol
              Hausman（CEO）也有类似集中度。公司没有披露任何关键人物保险、创始人归属时间表或留任安排。资本集中风险同样明显：Lux Capital 参与了三轮融资，CapitalG（Alphabet）领投
              Series B，意味着两家投资人在股权结构表和董事会动态中拥有主要影响力。
            claimRefs:
              - CR001
              - CR002
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
      - number: '7.4'
        title: 展项
        blocks:
          - type: callout
            title: $5.6B 估值下仍处收入前，是最核心的投资逻辑击穿风险
            body: >-
              Physical Intelligence 以 $5.6B 估值仍零收入，这不只是财务指标缺口，而是当前价格下任何投资的核心投资逻辑击穿风险。公司必须在 12–18 个月内把企业试点转成产生收入的合同，否则下一轮
              $11B 融资将缺少市场支撑。这个时间表短于典型企业机器人销售周期，给创始团队制造了结构性紧迫感，必须主动管理。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Google 同时是投资方、依赖方和竞争者
            body: >-
              CapitalG（Alphabet）领投 Physical Intelligence 的 Series B，而 Google DeepMind 通过 Gemini Robotics 直接竞争。Physical
              Intelligence 的核心架构依赖 PaliGemma（Google DeepMind）。这形成三重风险：同一企业集团同时扮演投资方、依赖方和竞争者。董事会层面的治理条款，以及 PaliGemma
              商业使用的合同保护，是关键尽调事项；目前公开记录里还没有。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence 在 November 2025 完成 Series B，融资 $600M，投后估值 $5.6B，意味着 CapitalG（Alphabet）、T. Rowe
              Price、Redpoint 和 Lux Capital 的入场前估值约为 $5.0B。交易完成时，公司商业收入为零。机器人 AI 领域没有先例：一家公司成立 20 个月、零 ARR，却拿到 $5.6B
              估值。这个估值靠三点支撑：（1）团队质量异常强，Levine、Finn、Hausman 都是一线研究者；（2）技术执行到位，π₀ 论文和演示获得学术界和产业界强验证；（3）投资人相信市场空间足够大（2030
              年服务机器人市场 $170B+），也相信 Physical Intelligence 可能占据类似 OpenAI 在 LLM 中的机器人基础模型 API 层。据报道，下一轮估值 $11B（April
              2026，未确认），不到六个月估值翻 2 倍；只有在公司已签下多个企业 LOI，或宣布了具备实质规模的商业伙伴时，这才可信。任何以 $11B 入场的投资人，安全边际都比 Series B 投资人更窄：如果
              $11B 估值对应零收入，要让收入倍数回到合理的 10× 退出水平，需要 $1.1B ARR；这意味着公司必须长成领先的机器人基础模型公司，规模接近前五大企业 SaaS。这个路径是 10–15 年，不是 5–7
              年。
            claimRefs:
              - CV001
              - CV002
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
      - number: '8.2'
        title: 可比估值框架
        blocks:
          - type: paragraph
            body: >
              在没有收入的情况下，估值只能基于同阶段交易。最相关的可比对象有三类：（1）无收入 / 早期收入阶段的 LLM 基础模型公司（OpenAI 估值 $80B、ARR 约 $1B，即 80×
              远期收入；按可比倍数，Physical Intelligence 在 $5.6B 估值下需要约 $70M ARR 才算落入可比区间）；（2）处在可比融资阶段的机器人 AI 公司（Skild AI 估值
              $14B、ARR 约 $30M，即 467× 收入，虽然极端，但反映了市场出清需求）；（3）没有收入的纯研究阶段 AI 公司（Inflection AI 在与 Microsoft 合作前没有商业产品，估值
              $4B）。Physical Intelligence 的 $5.6B 估值落在极端收入前 AI 公司估值区间内，但在机器人专项公司里处于高位。关键估值锚点是：（a）如果 Physical Intelligence
              到 2027 年实现 $50M ARR，50× 远期收入倍数（激进）可支撑 $2.5B 估值，低于 $5.6B；（b）如果到 2028 年实现 $200M ARR，30× 远期倍数（中等）可支撑 $6B，与
              Series B 相当；（c）乐观情景需要到 2028 年实现 $400M+ ARR，并按 20× 计，才能支撑 $8B 估值，接近据报道 $11B 下一轮的低端。结论是，只有 Physical
              Intelligence 在 24 个月内拿出显著商业牵引，Series B 估值才算“合理”；如果没有已宣布的商业收入，据报道的下一轮估值就极其激进。
            claimRefs:
              - CV001
              - CV002
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
      - number: '8.3'
        title: 建议、退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              我们的建议是谨慎——按当前估值应放弃或观察，同时为未来入场设条件。技术可信，团队世界级，机器人基础模型市场也有走向超大规模的合理路径。但零收入对应 $5.6B 估值，对多数机构投资人来说安全边际不足；据报道
              $11B 下一轮也极其激进。我们建议入场的条件是：（1）Physical Intelligence 宣布至少 $50M ARR，且来自两个或更多具名企业客户；（2）公司完成至少一项功能安全认证（ISO 13849
              或 CE marking），支撑生产部署；（3）与 Google 的 PaliGemma 商业许可协议已形成文件并披露；（4）Sergey Levine 的留任和归属时间表得到确认。若假设 2026–2027
              年商业化推出，并沿典型企业软件扩张轨迹发展，退出准备度至少还要 5–7 年。战略收购方包括 Amazon、Microsoft（通过 Azure robotics）、Samsung、Hyundai，以及任何希望获得
              AI 机器人栈的大型工业集团。IPO 准备度需要 $300M+ ARR 和规模化正毛利率；即使按乐观假设，这也是 2029+ 事件。最终尽调问题列在 T808。
            claimRefs:
              - CV001
              - CV002
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
      - number: '8.4'
        title: 展项
        blocks:
          - type: callout
            title: $5.6B 估值需要 $187M ARR，按 30× 远期倍数才算“合理”
            body: >-
              在 $5.6B 估值和 30× 远期收入倍数（对高增长 AI SaaS 算合理）下，Physical Intelligence 需要 $187M ARR 才能支撑当前入场价格。没有一家机器人 AI 公司在成立 3
              年内达到这个 ARR。这不是投资逻辑，而是在押注 1-in-10 结果。投资人必须把这个定价风险讲清楚。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
          - type: callout
            title: 观察后再投，优于现在入场
            body: >-
              鉴于估值极端且商业证明为零，观察后再投明显优于立即以 $5.6B 或 $11B 入场。投资人如果等到 Physical Intelligence 证明 $50M ARR、功能安全认证和 PaliGemma
              商业许可后再进，入场估值可能更高，但二元风险会大幅下降。提前入场带来的增量上行，无法补偿当前价格下的商业不确定性。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
