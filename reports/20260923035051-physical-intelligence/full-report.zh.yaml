        - 高 —— 若 Google 限制 PaliGemma，或借 Gemini Robotics 更激进地竞争
        - 关注 Google DeepMind 竞争动作；董事会席位条款很关键
      - - 机器人 OEM 合作伙伴（AgiBot、Longcheer 等）
        - 分发渠道 / 数据
        - 中
        - 中 —— 若 OEM 转向竞品 AI（Skild AI、Google），PI 将失去渠道和数据
        - 建立直接企业客户关系，降低对 OEM 的依赖
      - - OpenAI（Series A 轮战略投资方）
        - 资金提供方 / 竞争信号
        - 低
        - 低 —— 近期 OpenAI 不太可能在 PI 所处层级直接竞争机器人 AI
        - 关注 OpenAI 的机器人业务雄心；目前无冲突
    claimRefs:
      - CR001
      - CR002
    enumerationScope:
      coverage: exhaustive
      basis: >-
        All six primary partner and dependency risks for Physical Intelligence are enumerated based on disclosed
        investor and technology dependency relationships. No additional known material dependencies omitted.
    notes: 说明：根据公开来源和当前搜索包证据整理；部分行使用估计值或覆盖不完整。
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 置信度
    rows:
      - - 总体建议
        - 谨慎 —— 当前入场应放弃或观察；等商业化证明后再回看
        - 中
      - - 投资风险评级
        - 高（尚无收入；估值极端；Google 冲突；关键人物风险）
        - 高
      - - 估值立场
        - 偏高 —— 以当前商业化阶段看，$5.6B 是公允价值的 2–3×
        - 中
      - - 据报道下一轮（$11B）立场
        - 极度偏高 —— 以 $11B 入场，需要 $400M+ ARR 才能获得合理 5 年回报
        - 中
      - - 持有期（若投资）
        - 至少 5–7 年；达到 IPO 准备状态需 7–10 年
        - 低
      - - 目标退出倍数（若以 $5.6B 投资）
        - 投入资本回报 3–5× 需要退出时估值达到 $15–28B；只有乐观情景才可能实现
        - 低
      - - 战略收购方概率
        - 中 —— Amazon、Microsoft、Samsung、Hyundai、Bosch 可能以 $3–10B 收购
        - 低
    claimRefs:
      - CV001
      - CV002
    notes: 说明：根据公开来源和当前搜索包证据整理；部分行使用估计值或覆盖不完整。
  - id: TV002
    title: 投资逻辑与反向逻辑表
    columns:
      - 逻辑要素
      - 乐观逻辑（投资）
      - 反向逻辑（放弃）
    rows:
      - - 市场机会
        - 到 2030 年服务机器人市场 $170B+；机器人 AI 是“操作系统”层；呈现赢家通吃大部分的格局
        - 市场仍在成形；企业采用速度慢于消费者 AI；市场规模预测经常落空
      - - 技术
        - π₀ 跨本体架构属同类最佳；68 种本体构成结构性数据护城河；创始团队有 MAML 和 DeepMind 背景
        - arXiv 预印本已经披露架构；Google DeepMind 既有同等算力又拥有 PaliGemma；Skild AI 在数据飞轮上领先
      - - 收入轨迹
        - 若 3 个企业客户按 1,000 台机器人规模、$15K/机器人/年的价格转化，Q4 2027 可达到 $50M ARR
        - 尚无商业牵引；Skild AI 已有 $30M ARR；Physical Intelligence 为 0；销售周期 12–24 个月
      - - 团队
        - Levine、Finn、Hausman 是全球前五的机器人 AI 研究者；能吸引最优秀的机器人学 PhD 人才；在企业买家面前有可信度
        - 六位联合创始人带来治理风险；尚未宣布首席营收官（CRO）/ 销售副总裁（VP Sales）；Stanford 和 UC Berkeley 的学术牵引仍在
      - - 估值
        - 按可比研究质量看，$5.6B 与 LLM 阶段 AI 公司相当；竞赛格局可支撑 $11B
        - 零收入下 $5.6B 是公允价值的 2–3×；零收入下 $11B 极端偏高；可比的 Skild AI 467× 收入倍数也很极端
    claimRefs:
      - CV001
      - CV002
    notes: 说明：根据公开来源和当前搜索包证据整理；部分行使用估计值或覆盖不完整。
  - id: TV003
    title: 乐观、基准与悲观情景表
    columns:
      - 情景
      - 概率
      - 2028 年 ARR
      - 2028 年估值
      - 以 $5.6B 入场的退出倍数
      - 关键假设
    rows:
      - - 乐观情景
        - 20%
        - $200M–$400M
        - $8B–$15B
        - 1.4×–2.7×（温和）
        - PI 转化 5+ 家企业；Skild 未占据主导；Google API 未规模化；$15K/机器人/年的定价守住
      - - 基准情景
        - 50%
        - $30M–$100M
        - $2B–$4B
        - 0.4×–0.7×（亏损）
        - 转化 2–3 家企业；销售周期慢于预期；Skild 保持优势；Google Gemini Robotics 形成部分竞争
      - - 悲观情景
        - 30%
        - $0–$15M
        - $500M–$1.5B
        - 0.09×–0.27×（重大亏损）
        - 到 2027 年仍无商业牵引；降价轮；关键人物离职；Google 收购 Skild 或推出 Gemini Robotics API
    claimRefs:
      - CV001
      - CV002
    notes: 说明：根据公开来源和当前搜索包证据整理；部分行使用估计值或覆盖不完整。
