            title: $5.6 billion 估值、零收入——极端押注
            body: >-
              Physical Intelligence 在 $0 商业收入下获得 $5.6 billion 估值，意味着收入倍数事实上无限大。只有当投资者相信 PI 能在 3–5
              年内以显著规模建立机器人基础模型软件的品类领导地位，这一估值才说得通。为了支撑据报道 $11B 的下一轮融资，公司需要在未来 12–18 个月内把企业试点转为创收合同，并公开证明商业牵引。
            calloutType: risk
