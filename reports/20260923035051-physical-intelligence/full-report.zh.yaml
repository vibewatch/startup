        - label: 评估
          detail: 申请试点；会见 PI 企业团队；评估硬件兼容性；完成内部商业论证
        - label: 试点
          detail: 在 1–5 台机器人上部署 π₀；用内部 KPI 衡量任务表现；评估 ROI 和安全合规
        - label: 商业合同
