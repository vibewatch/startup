      - number: '3.2'
        title: 主要竞争对手画像
        blocks:
          - type: paragraph
            body: >
              Skild AI 成立于 2023 年，总部位于 Pittsburgh，已在 Series C 融资中募集 $1.4 billion，估值 $14 billion（2026 年初），由 SoftBank 和
              NVIDIA 领投，Samsung 和 Salesforce Ventures 参投。其 Skild Brain 模型称可借助层级架构实现跨形态泛化，并完成零样本任务迁移。关键在于，Skild 报告称 2025
              年商业发布后数月内收入达到 $30 million，证明了 Physical Intelligence 尚未实现的变现牵引。Google DeepMind 的 Gemini Robotics 1.5 于 2026
              年初发布，是可通过云访问的 VLA 模型，具备先进的智能体规划和多步推理能力——背后有 Google 算力基础设施、海量多模态数据集以及 Gemini API 分发渠道。Figure AI 此前以 $39B+
              估值融资 $675M，打造自研人形机器人（Figure 02）及其 Helix VLA 模型，并已部署在 BMW 工厂；这种全栈路径形成硬件护城河，但限制纯软件分发。Covariant（2024 年被
              Amazon 收购）聚焦仓储 / 物流操作，拥有最深的真实世界运营数据。挪威人形机器人公司 1X Technologies 正在开发面向机器人认知的世界模型，目标融资最高 $1B、估值约
              $10B。各竞争对手优势不同；Physical Intelligence 必须在灵巧操作深度、生态开放度和研究级模型质量上做出区分。
            claimRefs:
              - CP001
              - CP002
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
      - number: '3.3'
        title: Physical Intelligence 护城河分析与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Physical Intelligence 的竞争优势包括：（1）创始人履历——Sergey Levine（RAIL Lab，Berkeley）、Chelsea Finn（MAML，Stanford）和
              Karol Hausman（RT-2，DeepMind）的组合，堪称全球最可信的机器人 AI 创始团队之一；（2）灵巧操作深度——π₀
              展示了行业领先的长时程灵巧任务（叠衣、装配），多数竞争对手在基准中尚未达到；（3）开源生态——openpi
              带来开发者社区和训练数据贡献。护城河面临的关键风险包括：（1）开源使基础模型商品化——Skild、Google 等可对标 PI 公开成果；（2）Skild AI 估值 $14B，融资约为 PI 的
              2.5×，且已经实现商业收入；（3）Google DeepMind 的算力和数据高出数个数量级，Gemini Robotics 1.5 可由任何开发者通过 API 访问；（4）PI
              仍处于收入前阶段——如果商业发布延迟，资金充足的对手会先建立企业关系；（5）全栈集成商（Figure
              AI、1X）在特定部署中可能拥有更好的硬件-软件协同。当前护城河仍处在研究阶段，尚未获得商业验证。Physical Intelligence 必须优先推进商业发布、硬件伙伴协议和安全认证，抢在 Skild AI
              建立企业锁定、Google DeepMind 完成 Gemini Robotics 商业 API 推广之前卡位。从现在起，PI 大约有 12–18
              个月窗口，在已商业验证的企业账号上建立可防守位置。窗口之后，护城河可能主要停留在学术层面，而非商业验证。这个市场的竞争动态最终会偏向率先证明企业级可靠性并建立经常性收入基础的玩家。
            claimRefs:
              - CP001
              - CP002
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP002
      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: Skild AI 在商业化牵引上领先——这是关键缺口
            body: >-
              Skild AI 报告称商业发布后数月内达到 $30M ARR，这是 Physical Intelligence 面临的最重大竞争威胁。这个软件同行定位同样不绑定硬件，但融资为
              2.5×，且收入牵引已经得到验证，在企业关系中形成先发优势。如果 PI 未来 12–18 个月内不能实现商业收入，Skild 的数据飞轮和企业锁定可能变得难以追赶。
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
          - type: callout
            title: Google DeepMind 带来不对称的算力与数据威胁
            body: >-
              Google DeepMind 的 Gemini Robotics 1.5 受益于 Alphabet 算力基础设施、Google 规模的多模态训练数据和 Gemini API
              分发渠道。没有战略合作或融资跃迁，Physical Intelligence 无法在算力或数据规模上匹配。PI 的研究声誉短期内或许还能形成差异化，但 Google 的优势会随时间复利。
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与当前收入状态
        blocks:
          - type: paragraph
            body: >
              截至 2026 年第三季度，Physical Intelligence 未披露任何商业收入。公司正在制造和物流领域推进早期企业试点，但合同、ARR 或商业条款均未公开。计划中的收入模式是按机器人计费的 SaaS
              授权：企业客户为每台使用 PI 基础模型部署的机器人支付经常性年费。这类似企业软件中按席位或按单元计费的 SaaS 模式，只是应用在实体机器人上。公司尚未公开定价。行业类比显示，单台机器人年费可能在 $5,000
              到 $15,000 之间；若要达到 $50M ARR，大约需要 3,300–10,000
              台活跃机器人部署。其他收入来源可能包括模型微调费（一次性或经常性）、企业部署支持，以及潜在的机器人训练数据集授权。这些都尚未公布。openpi
              开源发布似乎不产生直接收入，更像社区和生态投资。公司的收入前状态带来二元风险：要么商业发布在 12–18 个月内推进、企业试点管线成功转化；要么随着竞争对手建立收入牵引，融资会越来越难。
            claimRefs:
              - CI001
              - CI002
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
      - number: '4.2'
        title: 成本结构、资本强度与烧钱速度
        blocks:
          - type: paragraph
            body: >-
              Physical Intelligence 的成本结构主要由研究和工程人员（估计 2026 年第三季度 150–250 人）、用于模型训练和推理的 GPU 算力，以及 San Francisco
              高端办公地点的开销构成。若平均全包薪酬为每名员工 $300,000–$400,000，按人数不同，年度人员烧钱约 $45–$100 million。用多样化机器人形态数据训练大型机器人 VLA
              模型，算力成本显著；按 π₀ 规模模型的行业基准，每个主要版本的训练成本约 $5–20 million，规模化后还会持续产生推理成本。估计年度总烧钱为 $70–$150
              million；如果公司不大幅扩张算力或人员，仅 $600M Series B 就可提供约 4–8 年现金跑道。不过，要达到商业规模，需要显著增加人员和算力投入，全面商业化建设时现金跑道很可能压缩到 24–36
              个月。Physical Intelligence 尚未披露实际烧钱速度或账上现金。公司没有公开披露债务融资；由于仍为私营公司，除 Form D 豁免发行外没有 SEC
              报告义务，也未通过监管文件报告运营亏损。此外，定制机器人实验室基础设施、安全测试设备，以及试点项目潜在制造合作所需资本开支，都会增加成本基数。这个阶段、这种类型的公司通常将 60–70%
              烧钱用于人员，20–25% 用于算力，10–15% 用于设施和其他开销。这些比例与可比 AI 研究初创公司一致，也意味着如果员工数接近 250、算力投入随下一代模型开发扩大，Physical
              Intelligence 年度运营成本实际可能达到 $120 million 或更高。
            claimRefs:
              - CI001
              - CI002
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
      - number: '4.3'
        title: 资本充足性、融资路径与财务风险
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence 三轮融资累计约 $1.07 billion，年度烧钱估计 $70–$150 million；视商业扩张节奏而定，估计现金跑道约 24–60 个月。据报道，截至 2026
              年 4 月，公司正深入洽谈下一轮融资，估值 $11 billion；若以 $500M+ 完成，可再延长 3–6 年现金跑道。关键财务风险包括：（1）下一次融资前，公司必须至少做到 $50M ARR
              才能支撑投资者信心；（2）如果试点商业转化停滞，估值上台阶会难以辩护——当前 $5.6B
              估值意味着收入倍数无限大；（3）连续训练新一代模型的算力成本可能比预期更快压缩现金跑道；（4）市场下行或投资者情绪变化可能关闭 AI
              高估值融资窗口，尤其是零收入公司。公司没有披露客户集中风险，因为尚无商业客户。财务尽调所需来源包括官方公司沟通和监管文件；唯一的 SEC Form D 是 Series B
              豁免发行文件，除发行规模外未披露财务细节。
            claimRefs:
              - CI001
              - CI002
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
