chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与业务概览
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence 以 pi.ai 名义经营，2024 年 3 月在 California 州 San Francisco
              注册并开始运营。公司宣称的使命是打造「一个单一、通用、能够控制任意机器人完成任意任务的 AI 系统」。公司处在机器人、强化学习和大型基础模型的交叉点。核心产品是
              π₀（pi-zero），一种视觉-语言-动作（VLA）基础模型；它接收摄像头图像、自然语言任务指令和机器人本体状态，再借助流匹配 transformer 预测连续电机动作。π₀
              不绑定硬件——可微调到不同机器人平台（机械臂、移动操作机器人、人形机器人）上运行，无需从零重建。Physical Intelligence 的商业模式瞄准企业客户，按机器人 SaaS 方式授权其模型栈；但截至
              2026 年第三季度，公司仍没有商业收入，重点仍是研究部署和试点项目。公司也发布了开源变体 openpi，用于推动生态采用和训练数据贡献。
            claimRefs:
              - CO001
              - CO002
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
          - type: figure
            figureRef: FO001
            claimRefs:
