companyProfile:
  summary: >-
    Physical Intelligence 于 2024 年 3 月在 San Francisco 成立，创始团队是一批顶尖机器人 AI 研究者——Karol Hausman（CEO，前 Google
    DeepMind）、Sergey Levine（首席科学家，UC Berkeley RAIL Lab）、Chelsea Finn（MAML 共同发明者，Stanford AI Lab）、Brian Ichter（前 Google
    DeepMind）、Adnan Esmail（工程副总裁，前 Anduril/Tesla）和 Lachy Groom（前 Stripe）。公司的使命是打造通用机器人基础模型——一种可控制任意机器人执行任意物理任务的 AI 系统，类似
    GPT-4 之于文本任务。旗舰 π₀ 模型在 68 种机器人形态上训练，在灵巧操作基准上超过此前最先进水平。公司在不到 20 个月内通过三轮融资（种子轮、Series A、Series B）募集 $1.07 billion，2025
    年 11 月估值达到 $5.6 billion，当时商业收入为零。制造和物流领域的企业试点已经启动，AgiBot 和 Longcheer Technology 被列为早期合作方。公司所处竞争格局包括 Skild AI（$14B
    估值、$30M ARR）、Google DeepMind Gemini Robotics 和 Figure AI（$39B 估值），每家都构成不同竞争挑战。
