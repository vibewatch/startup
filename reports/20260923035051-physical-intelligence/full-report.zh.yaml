  - id: FM001
    title: Physical AI 市场规模金字塔
    type: pyramid
    summary: 嵌套式 TAM-SAM-SOM 金字塔，展示 Physical Intelligence 的市场机会层级：从广义实体 AI 到机器人基础模型 SaaS。
    data:
      items:
        - label: 实体 AI / 机器人总可用市场（TAM）
          detail: $50–82B（2025）→ $111–185B（2030）；硬件 + 软件 + 服务
        - label: 机器人 AI 软件可服务市场（SAM）
          detail: $5.8B（2025）→ $25.9B（2030）；仅软件智能层
        - label: 机器人基础模型 SaaS（PI 目标）
          detail: $0.5–1B（2025，萌芽期）→ $3–8B（2030）；按机器人授权
        - label: Physical Intelligence 可获取市场（SOM）
          detail: 当前 $0 → 2028 年 $200–500M；早期采用客户赢单率 10–30%
        - label: 相邻工业自动化软件
          detail: 工作流编排 / 机器人机队管理软件 $1.5–3B；相邻但不属于 PI 核心总可用市场（TAM）
        - label: 服务与集成支出
          detail: 系统集成和部署服务 $2–6B；企业采用的间接预算池
