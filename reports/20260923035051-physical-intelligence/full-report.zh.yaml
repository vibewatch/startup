            body: >-
              如果 PI 每年 $70–$150M 的估计烧钱准确，仅 $600M Series B 就能在商业化前规模下提供约 4–8
              年现金跑道。这足以资助商业发布和初始部署扩张，无需立即再融资。不过，如果为抢占市场机会而加快人员和算力投入，实际现金跑道会明显压缩。
            calloutType: insight
