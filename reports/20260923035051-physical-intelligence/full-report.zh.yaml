              - CO002
      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence 由七名背景互补的成员共同创立，能力覆盖学术机器人研究、应用 AI 工程和运营扩张。CEO Karol Hausman 曾任 Google DeepMind
              资深研究科学家，领导机器人操作研究并参与 RT-2，也曾在 Stanford University 兼任教授。首席科学家 Sergey Levine 是 UC Berkeley 终身副教授，并领导 Robotic
              AI and Learning（RAIL）Lab；该实验室产出了机器人深度强化学习的基础研究。联合创始人 Chelsea Finn 是 Stanford 助理教授，以 Model-Agnostic
              Meta-Learning（MAML）和快速机器人适应研究闻名。另一位联合创始人 Brian Ichter 曾任 Google DeepMind 研究科学家，研究重点是动力学规划和 GPU
              加速机器人算法。联合创始人兼工程副总裁 Adnan Esmail 曾任 Anduril 工程高级副总裁，也曾是 Tesla Autopilot 工程师。Lachy Groom（Stripe 早期高管、VC
              投资人）和 Quan Vuong（机器人强化学习研究者）补齐了创始团队。董事会组成尚未公开；技术领导层集中，关键人物风险较高。截至 2026 年第三季度，未披露治理争议或领导层变动。
            claimRefs:
              - CO001
              - CO002
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
      - number: '1.3'
        title: 融资历史、估值与投资者
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence 在约 20 个月内累计融资约 $1.07 billion。$70 million 种子轮于 2024 年初至年中关闭，由 Lux Capital、Jeff Bezos
              等支持，种子前 / 种子估值未披露。$400 million Series A 于 2024 年 11 月关闭，投后估值 $2.4 billion；投资者包括 OpenAI、Thrive Capital、Lux
              Capital、Index Ventures 等。$600 million Series B 在一年后的 2025 年 11 月跟进，投后估值 $5.6 billion，由 CapitalG（Alphabet
              的成长基金）领投，Lux Capital、Bond、Redpoint、Sequoia Capital、Thrive Capital、Index Ventures、T. Rowe Price 和 Jeff
              Bezos 参投。截至 2026 年 4 月，据报道公司正就新一轮融资进行深入洽谈，目标估值 $11 billion；若完成，意味着不到六个月估值约 2×
              上台阶。所有外部融资均为风险股权融资；未公开披露债务、老股交易或基于收入的融资。大额融资规模体现了投资者对机器人基础模型市场机会的信心，也反映了团队的研究声誉。
            claimRefs:
              - CO001
              - CO002
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO002
      - number: '1.4'
        title: 关键里程碑
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence 从成立到累计融资 $1B+ 并发布开源模型，用时不到两年。公司于 2024 年 3 月宣布成立和种子轮融资。2024 年 10 月，π₀
              模型在技术博客和研究论文中被披露，展示了多任务机器人控制，包括叠衣、装盒和衬衫包装。Series A 于 2024 年 11 月关闭。2025 年 2 月，公司将 π₀ 模型权重和代码以 openpi
              仓库形式开源，这是首个开源的通用机器人 VLA 基础模型。继任模型 π₀.5 于 2025 年初发布，提升了对新环境的泛化能力。2025 年中，π₀-FAST 发布，采用频域离散动作表示（FAST
              tokenizer）提高推理效率。$5.6 billion Series B 于 2025 年 11 月关闭。截至 2026 年第三季度，面向制造和物流垂直行业的早期企业试点正在推进，客户未具名；据报道公司正接近
              $11B 估值的下一轮融资里程碑。截至本报告日期，未披露不利事件、监管调查或重大领导层离职。
            claimRefs:
              - CO001
              - CO002
      - number: '1.5'
        title: 展示
        blocks:
          - type: callout
            title: 机器人 AI 史上最快募资超 $1B
            body: >-
              Physical Intelligence 自成立起不到 20 个月就融资超过 $1 billion，速度快于此前任何纯软件机器人 AI 初创公司。$400M Series A（2024 年 11 月）和
              $600M Series B（2025 年 11 月）在各自关闭时都刷新了机器人基础模型软件融资纪录。不过，公司仍处于收入前阶段，投资者信心与商业验证之间存在张力。
            calloutType: insight
            claimRefs:
              - CO001
              - CO002
          - type: callout
            title: 关键人物集中风险
            body: >-
              CEO Karol Hausman 和首席科学家 Sergey Levine 对 Physical Intelligence
              的研究可信度和产品方向不可替代。公司的学术联合创始人同时保留大学职位，可能分散精力；但这也带来顶尖人才管道。截至目前，未公开披露继任规划或治理防护措施。
            calloutType: risk
            claimRefs:
              - CO001
              - CO002
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与细分
        blocks:
          - type: paragraph
            body: >
              与 Physical Intelligence 最相关的市场可分成三个同心层。最外层是全球具身 AI 与机器人（硬件加软件），涵盖工业机器人、移动操作机器人、人形机器人和自动驾驶汽车；2025 年估计 TAM 为
              $50–82 billion，到 2030 年增至 $111–185 billion。内层是企业机器人软件和 AI 栈（模型、部署基础设施、训练管线），2025 年 SAM 约 $8–15 billion，预计到
              2030 年达到 $20–35 billion，CAGR 为 20–35%。Physical Intelligence 最相关的可服务细分是机器人基础模型软件和按机器人计费的 SaaS
              授权；该领域尚未形成成熟分析师类别，但按单机器人经济模型以及制造、物流和仓储自动化的预计部署规模推算，到 2028 年大约为 $3–8
              billion。关键垂直包括：制造与装配（当前收入最大）、物流与仓储自动化（增速最快）、商业和设施服务，以及医疗和零售中由人形机器人带动的新兴任务。Physical Intelligence
              当前不绑定硬件，目标客户包括机器人 OEM 合作伙伴，以及已经拥有或计划部署机器人队列的企业客户。
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
      - number: '2.2'
        title: TAM、SAM 与 SOM 分析
        blocks:
          - type: paragraph
            body: >
              Grand View Research 估计，具身 AI 市场（具身 AI、机器人智能软件、自主系统）2025 年约 $81.6 billion，到 2033 年 CAGR 约
              32%。MarketsandMarkets 估计，机器人 AI 市场（仅智能和控制软件）2025 年为 $5.8 billion，到 2030 年增至 $25.9 billion。McKinsey 和 BCG
              的分析显示，随着自研智能成为相对商品化硬件的主要差异点，机器人软件和 AI 层最终将拿走整个机器人价值链利润的 40–60%。对 Physical Intelligence 而言，近期（2026–2028）的
              SOM 受限于制造和物流领域的早期企业试点；如果公司能拿下该窗口内可能采用机器人基础模型软件的 100–300 个企业账号中的 10–30%，估计 SOM 为 $200–500
              million。这要求商业发布成功、按机器人计费的授权经济模型站得住，并且硬件合作伙伴能放量。
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
      - number: '2.3'
        title: 细分客群与买方分析
        blocks:
          - type: paragraph
            body: >
              Physical Intelligence 的主要买方分为三类：（1）希望把基础模型智能嵌入硬件的机器人 OEM 厂商（例如 Agility Robotics、Boston
              Dynamics、较小的人形机器人初创公司）；（2）在制造或物流中部署机器人、希望获得跨机器人泛化且不做特定任务编程的大型企业运营商；（3）为工厂和仓库交付交钥匙
              自动化方案的系统集成商。企业账号的决策人通常是运营副总裁、首席自动化官或工程副总裁，采购过程会涉及 IT 安全审查、数据驻留要求和集成审批。企业机器人采购周期从试点到合同通常为 12–24 个月；Physical
              Intelligence 仍在试点阶段。OEM 合作渠道能带来更快分发，但利润率更低，对硬件伙伴成败的依赖更高。北美和欧洲是当前主要市场；鉴于工业机器人密度高，亚太（尤其日本、韩国和中国）是长期体量最大的市场。
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
      - number: '2.4'
        title: 增长驱动因素与市场约束
        blocks:
          - type: paragraph
            body: >
              关键增长驱动因素包括：（1）人口结构变化加剧制造和物流用工短缺，让机器人 ROI 测算更有利；（2）基础模型能力快速提升，将机器人任务编程成本从每个定制技能 $50,000–$250,000
              降到接近零，只需微调；（3）机器人硬件成本下降，尤其协作机器人和机械臂，扩大可部署基数；（4）开放数据集和合成仿真让机器人训练数据更可得；（5）强劲资本流入推动生态发展。约束和风险包括：（1）商业部署对安全性和可靠性要求极高；（2）与传统工业系统集成仍然复杂；（3）π₀
              开源发布让基础模型趋于商品化，也挑战 PI 维持自研护城河的能力；（4）资金充足的竞争对手（Skild AI $14B 估值、Google DeepMind、Figure
              AI）可能执行更快；（5）相较早期商业经济模型，训练和推理的算力成本偏高。
            claimRefs:
              - CM001
              - CM002
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 软件层定位是高毛利打法
            body: >-
              Physical Intelligence 有意避开硬件制造，瞄准软件智能层；AI SaaS 毛利率为 70–85%，而硬件为 20–40%。如果机器人基础模型沿用 LLM API
              剧本，建立主导模型加生态的公司会拿走不成比例的经济价值。不过，PI 必须在资源雄厚的既有玩家缩小差距之前，确立商业定价并扩大部署。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
          - type: callout
            title: 开源发布做大生态，也压缩护城河
            body: >-
              2025 年 2 月 π₀ 开源发布加速了开发者生态形成，但也让竞争对手能够基于 PI 的基础模型继续开发。这类似 Hugging Face / 开放 LLM
              的动态：社区采用带来品牌和数据贡献，但基础能力商品化迫使 PI 靠企业微调、支持和自有数据区分自己。净市场影响有利于整体市场增长，但对 PI 的长期竞争位置并不明朗。
            calloutType: risk
            claimRefs:
              - CM001
              - CM002
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争框架与市场结构
        blocks:
          - type: paragraph
            body: >
              机器人基础模型市场可分为三类竞争原型。第一类是纯软件 / 智能层玩家，不做硬件，只做通用机器人“大脑”：Physical Intelligence 和 Skild AI
              是主要例子。第二类是全栈机器人集成商，硬件和自研 AI 都做：Figure AI（人形机械臂 + Helix VLA）、1X Technologies（人形机器人 + 世界模型）和 Agility
              Robotics（Digit + AI）属于这一类。第三类是拥有相邻算力和 AI 资产、正向机器人延伸的既有科技公司：Google DeepMind（Gemini Robotics 1.5）、Amazon
              Robotics（Sequoia 机器人驱动系统 + Sparrow）和 NVIDIA（Cosmos 世界基础模型）。Physical Intelligence 在软件智能层最直接对标 Skild
              AI，在模型能力和研究可信度上对标 Google DeepMind。全栈集成商会争夺企业预算，但也可能成为 PI 模型的潜在客户。
            claimRefs:
              - CP001
              - CP002
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
          - type: figure
            figureRef: FP001
            claimRefs:
