  topStrengths:
    - >-
      创始团队世界级——Sergey Levine（RAIL Lab）、Chelsea Finn（MAML）和 Karol Hausman（DeepMind）跻身全球被引用次数最高的前 5 位机器人 AI
      研究者，技术可信度强，也能吸引顶尖研究员。
    - 跨 68 种机器人形态训练，是机器人 AI 里最有辨识度的能力主张；若在商业规模得到验证，这种广度会形成数据飞轮和泛化优势，竞争者需要数年才能复制。
    - >-
      π₀ 架构把 PaliGemma 3B VLM 与 flow-matching action expert 结合，在 LIBERO 灵巧操作 benchmark 上明显领先 OpenVLA、RT-2 和
      Octo；这是机器人领域最难啃的未解任务之一。
    - 公司已融资 $1.07B，按商业化前阶段估计有 4–8 年现金跑道；对研究阶段公司来说，财务韧性很强，资本基础本身就是护城河。
    - openpi 开源发布带来可观开发者采用度，公司几乎不增加成本，就换来生态 goodwill 和外部研究验证。
  topRisks:
    - $5.6B 估值下仍无商业收入，是核心投资逻辑破裂风险；若到 2026 年 Q4 企业试点还不能转成有明确 ARR 的商业合同，据报道 $11B 下一轮融资窗口会关闭，公司将面对艰难融资环境。
    - Skild AI 已做到 $30M ARR，并在积累商业数据飞轮，这个差距每个季度都在拉大；Physical Intelligence 的商业牵引力劣势正在加速。
    - Google DeepMind Gemini Robotics 带来生存级算力和分发不对称威胁；Google 同时是投资人（CapitalG）、技术依赖方（PaliGemma）和竞争者。
    - 架构依赖 Google 的 PaliGemma，形成单点故障；若 Google 收紧 license，公司可能需要 $10M+ 重新训练模型并延迟 6–12 个月，且未披露合同保护。
    - Sergey Levine 和 Chelsea Finn 关键人集中度高——商业发布前任一人离职都会触发投资逻辑破裂；公司未披露留任安排或接班计划。
    - EU AI Act 高风险分类和功能安全认证（ISO 13849）要求，会给欧洲商业部署增加 12–24 个月合规障碍；公司未披露进展。
  unresolvedGaps:
    - 完整企业试点客户名单，包括实名 reference、LOI 状态和试点转商业合同时间表——这是投资前最重要的商业尽调项。
    - 与 Google 的 PaliGemma 商业 license 协议——当前 Gemma Terms of Use 不足以提供投资级 IP 保护，必须拿到正式合同保障。
    - 训练数据来源审计——用于 π₀ 训练的机器人演示视频版权状态未披露；这类重大 IP 责任风险必须在投资前解决。
    - 烧钱速度、账上现金和管理账——估计年烧钱 $70–$150M 区间太宽，无法承保投资，需要通过 VDD 拿到实际数字。
    - Sergey Levine 和 Chelsea Finn 的归属期安排与留任协议——若投资人看不到合同保护，关键人风险就没有被缓释。
