companyProfile:
  summary: "Brevo is a Paris-headquartered customer-engagement software company whose legal entity dates to 2007 and whose own history says founder Armand Thiberge launched the operating business in 2012 across France and India. Rebranded from Sendinblue to Brevo in 2023, the platform now spans email, SMS, WhatsApp, marketing automation, CRM, customer data, and transactional messaging. Public evidence shows real scale and improving financial maturity, but underwriting still depends heavily on selective company disclosures because core SaaS KPI detail remains private."
