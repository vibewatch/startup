    - TI005
  - type: private-evidence-only
    severity: material
    topic: burn-runway
    missingEvidence: Monthly net burn, operating cash flow, and management runway assumptions.
    whyItMatters: The AI, U.S., and M&A plans could absorb capital quickly, but the public record does not show the consumption rate.
    diligencePath: Request last-12-month cash-flow statement by month and the current operating budget with downside scenarios.
    relatedQuestionRefs:
