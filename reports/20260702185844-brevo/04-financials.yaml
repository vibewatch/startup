  - type: private-evidence-only
    severity: material
    topic: cash-balance
    missingEvidence: Post-close cash and restricted-cash balances after the December 2025 financing.
    whyItMatters: Without cash on hand, the round size cannot be translated into liquidity runway or balance-sheet resilience.
    diligencePath: Request closing balance sheet, monthly cash balances, and treasury policy from management.
