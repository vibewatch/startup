- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on judgment
  - Exact diligence path
  rows:
  - - Post-close cash balance
    - Prevents a clean view of liquidity buffer after the 2025 round
    - Request month-end cash, restricted cash, and minimum cash policy immediately after close
  - - Monthly burn and runway
    - Blocks confidence on how quickly AI, U.S., and M&A plans consume the new capital
    - Request last 12 months of management cash burn and budgeted runway by scenario
  - - Debt amount, maturity, and covenants
    - Makes balance-sheet risk impossible to price despite mention of prior debt
    - Request debt schedule, lender list, rates, covenants, and security package
  - - Actual gross margin by channel
    - Prevents discrimination between software-like revenue and lower-margin pass-through activity
    - Request gross margin split for core software, transactional email, SMS/WhatsApp, and services
  - - NRR, churn, and CAC payback
    - Blocks underwriting of durable growth and sales efficiency
    - Request cohort retention, logo churn, net retention, CAC by segment, and payback by sales motion
  - - Plan-level revenue mix and paid conversion
    - Leaves pricing-led estimates scenario-based rather than factual
    - Request paying accounts by tier, free-to-paid conversion, and revenue by plan and module
  notes: These gaps are the difference between a strong directional story and a fully underwriteable model. None can be closed from fetched public sources alone.
