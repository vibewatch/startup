  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and positioning
        blocks:
          - type: paragraph
            body: >-
              Brevo sits between two ends of the SMB engagement market. At the low-complexity end are send-centric or
              newsletter-first tools such as Mailjet, Mailgun, and CleverReach, which solve email delivery or basic
              campaign creation without trying to own the full customer relationship layer. At the heavier end are
              suites such as HubSpot, Zoho, and Salesforce Starter Suite, which treat email marketing as one module
              inside a broader CRM, service, or AI-led operating system. Brevo’s own product and pricing pages place it
              in the middle: one platform for email marketing, marketing automation, SMS, WhatsApp, transactional
              messaging, CDP, and CRM, but still sold through an accessible self-serve funnel.


              That middle position makes the direct comparison set unusually wide. Mailchimp and ActiveCampaign are the
              clearest SMB automation peers because they also combine email, segmentation, workflows, and list growth
              tooling. Klaviyo is a more specialized omnichannel competitor for ecommerce and B2C brands, with deeper
              retail-channel orientation than Brevo. HubSpot, Zoho, and Salesforce compete when the buyer wants
              marketing tied tightly to CRM, service, or revenue workflows. Mailjet and Mailgun are substitutes when the
              primary need is deliverability or developer-controlled transactional messaging, not a general-purpose SMB
              growth stack.


              Independent reviews reinforce this placement. Brevo is repeatedly praised for value, deliverability, and
              breadth relative to price, but the same reviews still call out lighter CRM ergonomics, some template
              limitations, and dependence on integrations for edge workflows. That is consistent with a product that
              wins by bundling “enough” capability into one affordable pane of glass, rather than by being the deepest
              tool in every category.
