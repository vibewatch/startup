      - number: '8.4'
        title: Anti-Thesis, Entry Discipline, and Triggers
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is straightforward: Brevo may prove durable, but a private buyer may still overpay if
              public SaaS stays at roughly 3x-4x revenue and Brevo’s own disclosure never graduates past
              company-selected metrics. Entry discipline should therefore be explicit. Either the price needs to move
              closer to 4.5x ARR or below, or management needs to disclose enough to prove ARR is materially above €240
              million with durable double-digit EBITDA, clean retention, and manageable dilution. Thesis-break triggers
              are equally concrete: 2026 ARR exiting below roughly €215 million; a down-round or heavy preference stack;
              mid-market or U.S. growth losing leadership; or M&A, AI, and CRM upsell not translating into wallet-share
              expansion. Product-friction signals matter too because review sources already point to CRM, AI, WhatsApp,
              and integration limitations. The missing diligence is not cosmetic—it is the evidence that decides whether
              current gross-return math survives contact with the actual capital structure and whether a clean
              investment committee upgrade is justified.
