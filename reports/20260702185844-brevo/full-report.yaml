      - number: '3.2'
        title: Pricing, packaging, and privacy posture
        blocks:
          - type: paragraph
            body: >-
              Brevo’s most obvious competitive advantage is packaging clarity. The free plan, $9 Starter plan, and $18
              Standard plan create a visible ladder for small teams, and the Standard tier explicitly unlocks unlimited
              automation. That is much simpler than HubSpot’s seat-plus-contact logic, where pricing, contact tiers,
              send limits, and renewal rules interact; simpler than Salesforce Starter Suite, which adds transaction-fee
              language to the bundle; and more approachable than higher-end negotiated layers at Klaviyo, Mailchimp
              Premium, and enterprise ActiveCampaign. For budget-sensitive SMBs, clarity matters almost as much as
              absolute price.


              The tradeoff is that Brevo’s public pricing also invites direct benchmarking. Mailjet can frame itself as
              a cheaper send-volume option for basic email workloads. Zoho can counter with free-entry contact
              allowances inside a broader business software family. HubSpot can use short-term promotional pricing to
              narrow the top-of-funnel gap before contact tiers and add-ons expand deal size later. Salesforce Starter
              can package AI-assisted CRM and email under one per-user line item, even if the all-in cost rises with
              payments or expansion.


              On trust and data sovereignty, Brevo and Mailjet have a more obviously European story than the larger
              U.S.-centric suites. Brevo’s public security materials emphasize ISO-backed practices and GDPR-aligned
              privacy support, while Mailjet explicitly names data-center locations in Germany and Belgium. By contrast,
              Mailchimp, HubSpot, ActiveCampaign, and Salesforce mostly answer the question through SCCs, DPA language,
              encryption, or regional hosting controls. Those are legitimate answers, but they sell differently: Brevo
              can lead with a Europe-forward brand promise, while U.S. vendors often lead with contractual and
              infrastructure mitigations.
