  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Privacy, and Channel-Compliance Risk
        blocks:
          - type: paragraph
            body: >-
              Brevo has more formal legal and privacy scaffolding than a lightweight SMB email tool, but that
              scaffolding also highlights how much execution risk sits in regulated messaging workflows. The October
              2025 terms embed the DPA, security measures, SLA, and acceptable-use rules inside the core contract, and
              the anti-spam policy explicitly requires active consent, proof of opt-in, unsubscribe mechanics, and clean
              list sourcing. That matters because the business spans email, SMS, and WhatsApp, where the relevant
              constraints are not just Brevo's own rules. The ICO says unsolicited email and text marketing often need
              specific consent, while WhatsApp requires opt-in permission and reserves the right to limit or remove
              business access for policy violations. Brevo also discloses a multi-entity controller structure and
              possible transfers outside the EEA. The risk is therefore not lack of legal text; it is that Brevo
              customers can still trigger enforcement, suspension, or procurement friction if consent trails, transfer
              controls, or channel-specific policy handling are weak in practice.
            claimRefs:
