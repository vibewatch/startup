      - number: '5.2'
        title: API, Data, Integration, and AI Architecture
        blocks:
          - type: paragraph
            body: >-
              The most credible technical differentiator in Brevo's public record is not a novel core algorithm but the
              scope and connectivity of its platform surface. Brevo documents a unified REST API that covers messaging,
              contacts, custom events, ecommerce sync, and custom objects, then layers CRM webhooks, campaign webhooks,
              official SDKs across seven languages, and an OpenAPI specification on top. Operationally, the architecture
              looks like a message-and-contact core with workflow orchestration and partner integrations around it:
              email and SMS can be triggered from workflows, transactional email supports template-driven
              personalization and message tracking, and WhatsApp support extends from transactional templates into
              scheduled campaigns with stats and approval flows. Brevo's 2026 AI push sits above that data plane. The
              MCP server is important because it turns Brevo from an application a marketer clicks through into a system
              an assistant can query or operate, with tasks spanning contact counts, campaign creation, and CRM deal
              retrieval. The tradeoff is ecosystem complexity. Node, Python, PHP, Ruby, and .NET all exist publicly, but
              the SDK estate is not uniform: Node is in active migration, Python and PHP are modernizing faster than
              Ruby or .NET, and version branches imply real integration-management overhead for technical customers.
