      - number: '2.5'
        title: What public evidence still cannot isolate
        blocks:
          - type: paragraph
            body: >-
              The biggest diligence risk is false precision. Public sources are good enough to show that Brevo sits in a
              real and growing market, that SMB adoption is broadening, and that Europe-specific compliance posture
              matters. They are not good enough to isolate Brevo's true SAM or SOM. Public evidence does not separate
              Brevo revenue or customers by email versus automation versus CRM versus messaging, does not reveal its
              Europe share or free-to-paid conversion by segment, and does not quantify how much deliverability or
              privacy changes affect retention and attach rates. That means the chapter should be used to bound market
              narratives, not to overfit one precise multiple-ready TAM. The next diligence step is management evidence:
              region-by-segment revenue bridges, cohort conversion, attach-rate by channel, and procurement or churn
              evidence linked to compliance and deliverability complexity.
            claimRefs:
