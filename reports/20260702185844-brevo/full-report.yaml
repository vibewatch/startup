            body: >-
              Brevo's 2026 changelog signals an organization shipping actively across security, CRM, loyalty, events,
              SDKs, and AI tooling rather than merely polishing a legacy ESP. OAuth scopes, MCP auth hardening, Deals
              API filters, consent groups, wallet-pass URLs, spec corrections, and repeated SDK releases all landed in a
              single six-month window. That velocity is strategically positive because it shows Brevo extending the
              platform beyond email into broader customer-data and CRM workflows. It is also a real operational risk for
              integrators. Public deprecations, breaking SDK majors, and a Node compatibility warning mean the platform
              can impose migration work on technical customers even while functionality improves. The maturity picture
              is therefore mixed by module: email, forms, campaigns, and core automation look well established; MCP,
              modern SDKs, and some partner/plugin surfaces are still converging; and public infrastructure disclosure
              remains too thin to independently validate the deepest trust claims. For underwriting, Brevo looks like a
              broad, fast-moving product company with credible SMB-to-mid-market utility, but not yet like a fully
              transparent infrastructure vendor whose reliability, packaging, and developer ergonomics can be taken for
