      - number: '4.3'
        title: Capital structure and expansion capital
        blocks:
          - type: paragraph
            body: >-
              The December 2025 transaction looks more like a control-leaning scale-up recapitalization than a plain
              venture extension. Brevo disclosed a €500 million financing round with General Atlantic and Oakley
              entering, Bridgepoint and Bpifrance remaining, and Partech exiting. TechCrunch's cap-table breakdown adds
              a crucial clue: management and employees at 26%, General Atlantic 25%, Oakley 25%, and Bpifrance plus
              Bridgepoint 24%. That distribution, combined with the same article's description of €500 million in fresh
              equity, supports an inferred post-money valuation around €1.0 billion or roughly €1.1 billion-equivalent
              in dollar terms, but not a clean disclosed valuation fact, because reinvestment and seller liquidity make
              the primary-versus-secondary split opaque. The capital use case is clearer than the valuation. Official
              and independent sources point to three main deployment buckets: AI investment, U.S. expansion, and
              continued acquisitions. Brevo separately committed €50 million over five years to its AI Lab, TechCrunch
              said prior debt also existed, and EU-Startups plus TechCrunch described more than €100 million of planned
              U.S. investment through 2030. Historical funding is only partly public—Tech.eu cites a $35 million Series
              A and the company confirmed a $163 million Series B—so the 2025 round appears to be a major step-function
              rather than a routine top-up. Public evidence supports adequate strategic capital; it does not support a
              fully underwritten balance-sheet view.
