        title: Trust, Deliverability, and Reliability
        blocks:
          - type: paragraph
            body: >-
              Brevo's trust surface is meaningful but thinner than its marketing breadth. Public materials do show some
              baseline controls: ISO 27001-focused security messaging, GDPR/CASL/CCPA privacy positioning, sender
              verification plus domain authentication, OAuth scopes, rate-limit tiers, webhook controls, and a
              first-party status page segmented by major product area. The company also claims strong deliverability—99%
              on marketing and transactional surfaces—but the public evidence is still mostly company-authored rather
              than independently audited. Independent signals complicate the picture. IsDown and StatusGator both show a
              live status-monitoring footprint with recent incident history, and StatusGator's user reports include
              mail-send and SMS/account-verification problems that cut across core Brevo workflows. WordPress community
              reviews add another caution: the plugin is widely used enough to have hundreds of reviews, but 2026
              feedback includes quality complaints and unclear packaging around some advanced features. The right
              reading is not that Brevo is unreliable; rather, it is that Brevo already operates enough moving
              parts—campaigns, transactional sending, CRM, webhooks, plugins, AI, WhatsApp—that buyers should diligence
              the controls and service envelope module by module instead of assuming a single, homogeneous reliability
              profile across the whole suite.
