      - number: '8.2'
        title: Public Comp Context and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              The right comparison set is not only broad CRM but scaled marketing automation and customer-engagement
              software. On July 2026 public data, HubSpot sat near 3.2x market cap to 2025 revenue, Klaviyo near 4.1x,
              and Salesforce near 3.3x. Brevo’s current implied 5+ ARR multiple therefore asks investors to pay a
              private-market premium over more transparent public names. Some premium is arguable. Brevo claims
              double-digit EBITDA, unusually fast mid-market growth, accelerating U.S. contribution, and a platform that
              moved beyond newsletters years ago. But pricing and product context cap how far that argument should go.
              Brevo’s own site still highlights a low-friction, price-accessible funnel, while PCMag and TrustRadius
              point to CRM, AI, WhatsApp, and integration limitations. Official pages show 150+ integrations; Klaviyo
              says 350+ apps, and HubSpot continues to lean on a much broader marketplace. Historical context cuts both
              ways too. Intuit paid $12.0 billion for Mailchimp in 2021 and later disclosed $762 million of Mailchimp
              revenue from the acquisition date in fiscal 2022, showing that scaled SMB marketing assets can command
              low-teens strategic multiples. But that was a 2021 strategic M&A tape, not the compressed 2026 public SaaS
              environment.
