      - number: '2.2'
        title: Evidence-constrained TAM, SAM, and contradictory market lenses
        blocks:
          - type: paragraph
            body: >-
              Public sizing supports demand, but it does not support one clean TAM sentence. The narrowest software
              lenses are the 2026 marketing automation and email marketing estimates, which cluster from about $8.1
              billion to $13.7 billion depending on whether the analyst starts with automation workflows or email
              software. The next layer up is customer engagement, where public estimates jump to roughly $28.1 billion
              because the scope widens to CRM-adjacent orchestration, service, analytics, and multi-channel engagement.
              The broadest umbrella is CRM software, which is many times larger again. Those figures are not
              contradictory in the sense that one must be wrong; they are contradictory if used interchangeably in a
              valuation memo. For Brevo, the honest framing is a layered TAM with a narrower software core, a broader
              customer-engagement adjacency, and unresolved Europe-specific or Brevo-specific slices. TM002 and the
              range figure intentionally preserve, rather than smooth over, those boundary conflicts.
