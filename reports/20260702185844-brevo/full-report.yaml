        - Useful as an outer boundary, but too broad to treat as Brevo's practical core TAM
      - - Status quo / internal build
        - In-house scripts, spreadsheets, mailbox tools, commerce defaults
        - Third-party software subscription when no external platform is bought
        - Do nothing, keep existing stack, rely on channel dashboards
        - Sets the real adoption hurdle for many SMBs and price-sensitive buyers
