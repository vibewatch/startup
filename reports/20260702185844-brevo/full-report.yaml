  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and Brevo category fit
        blocks:
          - type: paragraph
            body: >-
              Brevo should be analyzed as an all-in-one growth platform for smaller businesses, not as a pure newsletter
              tool and not as a full enterprise CRM suite. Its official positioning spans email, SMS, automation, CRM,
              and sales tooling, while independent market pages show that even the "email marketing" category often
              includes software, services, automation, CRM email software, and lead generation tools. That means the
              same company can be counted inside several analyst buckets at once. For valuation work, the core included
              spend is subscription or usage revenue tied to email campaigns, journeys, audience management, light sales
              workflows, and adjacent messaging orchestration. Excluded spend includes media buying, agency labor,
              commerce platform GMV, and heavy enterprise-service layers. The most important substitutes are not only
              direct vendors but also spreadsheets, native commerce plugins, simple newsletter tools, and broader suites
              whose automation or CRM modules can absorb the same buyer job.
            claimRefs:
