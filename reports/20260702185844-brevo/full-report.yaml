      - number: '1.4'
        title: Milestones, strategy priorities, and adverse checks
        blocks:
          - type: paragraph
            body: >-
              Brevo’s milestone arc is coherent even where specific private metrics remain opaque. The company moved
              from the original Sendinblue email product into a full CRM suite, rebranded in May 2023, and then used
              2025 capital to double down on AI, U.S. expansion, and acquisitions. Official investor and company
              materials say Brevo had already surpassed $100 million ARR by the 2023 rebrand period, reached 11
              acquisitions by December 2025, and announced a €50 million AI Lab in February 2025 to build European CRM
              agents and AI tooling on top of a workforce that is still more than half oriented toward product
              development and R&D. Adverse signals were not absent, but they were narrower than one might expect for a
              company of this size. The clearest public governance red flag is the 2023 French registry note about
              continuation despite capital impairment. The clearest product-market friction comes from TrustRadius
              reviews, which praise deliverability and ease of use but also flag CRM-module usability, weak
              integrations, complicated WhatsApp automation, and underwhelming AI performance. No major public lawsuit
              or enforcement action surfaced in the specific materials fetched for this chapter, but that should be
              treated as an evidence gap rather than a legal clean bill of health.
