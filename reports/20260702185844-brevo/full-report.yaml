      Brevo's hardest dependencies are external rule-setters and channels plus the internal need to integrate a broad
      roadmap cleanly.
    data:
      nodes:
        - label: Brevo core platform
          note: Email, CRM, automation, and data base
        - label: Gmail
          note: Bulk-sender rules and inbox access
        - label: Yahoo
          note: Sender requirements and spam enforcement
        - label: Meta / WhatsApp
          note: Policy, template approval, and message pricing
        - label: SMS carriers
          note: Route quality and channel economics
        - label: Acquired / new modules
          note: CDP, push, loyalty, AI, and acquired stacks
        - label: Customers
          note: Retention and expansion outcomes
        - label: Investors
          note: Capital support and execution expectations
      edges:
        - from: Gmail
          to: Brevo core platform
          label: Gates email reach
        - from: Yahoo
          to: Brevo core platform
          label: Gates email reach
        - from: Meta / WhatsApp
          to: Brevo core platform
          label: Gates channel access
        - from: SMS carriers
          to: Brevo core platform
          label: Shape delivery economics
        - from: Acquired / new modules
          to: Brevo core platform
          label: Increase integration load
        - from: Brevo core platform
          to: Customers
          label: Determines value and reliability
        - from: Investors
          to: Acquired / new modules
          label: Fund and pressure
        - from: Customers
          to: Investors
          label: Prove or disprove thesis
    claimRefs:
      - CR050
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: Decision flow from disclosed operating proof and comp context to the current recommendation.
    data:
      nodes:
        - id: mark
          label: €500M round; unicorn band only
          type: start
        - id: proof
          label: '>€200M ARR + double-digit EBITDA'
          type: process
        - id: premium
          label: Does Brevo deserve a premium to public comps?
          type: decision
        - id: disclosure
          label: Are valuation terms and capital structure sufficiently disclosed?
          type: decision
        - id: buy
          label: Buy / underwrite
          type: end
        - id: track
          label: Track / Research-More
          type: end
        - id: avoid
          label: Avoid at current price
          type: end
      edges:
        - from: mark
          to: proof
          label: Round is real
        - from: proof
          to: premium
          label: Operating proof exists
        - from: premium
          to: track
          label: Maybe, but not decisively
        - from: premium
          to: avoid
          label: 'No'
        - from: track
          to: disclosure
          label: Need cleaner evidence
        - from: disclosure
          to: buy
          label: Yes + price improves or ARR surprises up
        - from: disclosure
          to: track
          label: 'No'
    approximationNotes: >-
      The flow intentionally simplifies the decision into the two real gates for this chapter: whether Brevo earns a
      premium and whether the disclosure package is sufficient to trust it.
    claimRefs:
      - CV038
      - CV039
      - CV041
      - CV047
      - CV049
      - CV052
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: ARR required to support an approximately €1.1B value at different revenue multiples.
    data:
      items:
        - label: 3.0x
          value: 366.7
          detail: ARR needed if Brevo eventually trades like a compressed broad-CRM name.
        - label: 4.0x
          value: 275
          detail: ARR needed if the company lands near high-quality public marketing software.
        - label: 5.0x
          value: 220
          detail: Close to the low end of today’s implied private mark.
        - label: 5.5x
          value: 200
          detail: Roughly where a €1.1B mark sits against just-over-€200M ARR.
        - label: 6.5x
          value: 169.2
          detail: Requires the market to grant a clear private-growth premium.
    approximationNotes: >-
      Values are ARR in EUR millions and use a simple enterprise-value proxy because the exact cash, debt, and
      preference stack are not public.
    claimRefs:
      - CV040
      - CV041
      - CV043
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Three-year exit-value bands implied by the bear, base, and bull scenarios.
    data:
      items:
        - label: Bear
          low: 700
          mid: 840
          high: 980
          detail: ~0.6x-0.9x gross MOIC at ~€1.1B entry.
        - label: Base
          low: 1080
          mid: 1220
          high: 1450
          detail: ~1.0x-1.3x gross MOIC before dilution and preferences.
        - label: Bull
          low: 1820
          mid: 2100
          high: 2520
          detail: ~1.7x-2.3x gross MOIC if execution stays strong.
    approximationNotes: >-
      Values are enterprise-value proxies in EUR millions and should not be read as common-equity outcomes because the
      exact capital stack is still undisclosed.
    claimRefs:
      - CV044
      - CV045
      - CV046
      - CV047
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scorecard separating company quality from entry quality.
    data:
      items:
        - label: Growth proof
          value: 7/10
          detail: €179M ARR in 2024 and >€200M ARR target for 2025 are credible positive anchors.
        - label: Profitability proof
          value: 7/10
          detail: Double-digit EBITDA claim helps, even though full margin disclosure is absent.
        - label: Product breadth
          value: 8/10
          detail: CRM, messaging, AI, and acquisitions clearly widened the scope beyond newsletters.
        - label: Customer scale
          value: 8/10
          detail: ~600,000 customers and 1,000+ employees imply real operating scale.
        - label: Competitive insulation
          value: 5/10
          detail: Price advantage exists, but ecosystem breadth still trails larger peers.
        - label: Disclosure quality
          value: 4/10
          detail: Exact post-money, preferences, NRR, and gross margin remain missing.
        - label: Entry valuation
          value: 4/10
          detail: Implied 5x-5.5x ARR looks premium to July 2026 public comps.
        - label: Fresh-money investability
          value: 5/10
          detail: Interesting company, but only conditionally attractive at current pricing.
    approximationNotes: Scores are analytical judgments for investment-committee framing rather than standardized external ratings.
    claimRefs:
      - CV004
      - CV010
      - CV016
      - CV017
      - CV041
      - CV042
      - CV043
      - CV047
