      - number: '2.3'
        title: Buyers, budget owners, and European SMB readiness
        blocks:
          - type: paragraph
            body: >-
              Brevo's likely buyer is the founder, owner-operator, growth lead, lifecycle marketer, or
              sales-and-marketing generalist who wants fewer tools and faster time to value, not a separate enterprise
              procurement office buying a category-leading point solution for one function. The daily users are email
              marketers, ecommerce operators, customer-lifecycle managers, and revenue or sales operations staff who
              need lists, campaigns, automations, pipelines, and basic coordination in one place. The European setup
              matters because Brevo explicitly markets GDPR compliance, while Eurostat shows that EU business
              digitalization is progressing but incomplete: most SMEs now have basic digital intensity, roughly half use
              paid cloud services, and only a minority of cloud-using enterprises report CRM usage. That combination
              supports Brevo's positioning as a pragmatic upgrade path from spreadsheets or standalone email tools, but
              it also implies that the practical SAM is gated by workflow maturity and willingness to pay for CRM-like
              behavior, not just by the raw count of European SMEs.
