      - number: '7.3'
        title: Deliverability, Outage, and Platform-Dependence Risk
        blocks:
          - type: paragraph
            body: >-
              Brevo sits on top of channels it does not control, so a meaningful slice of the risk register belongs to
              external platforms and sender-rule regimes. Gmail and Yahoo both enforce sender requirements that can
              downgrade or reject mail when authentication, complaint management, or unsubscribe handling falls short,
              and Gmail explicitly tightened enforcement again in late 2025. Brevo's own release of a Deliverability
              Center confirms that inbox placement and reputation are operational problems to manage, not settled
              advantages. The 2026 incident record sharpens the point: the official status RSS logged two dozen recent
              incidents by 2026-07-02 across email sending, transactional email, workflow execution, tracking,
              automation, and SMS-related surfaces, while StatusGator and IsDown both show longer-running incident
              histories. Shared-platform dependence extends beyond email to WhatsApp pricing and policy enforcement plus
              SMS-credit and carrier economics. Brevo can mitigate these risks with monitoring and controls, but it
              cannot fully eliminate them because the gating decisions sit with mailbox providers, Meta, carriers, and
              upstream infrastructure.
