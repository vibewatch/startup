      - number: '4.2'
        title: Traction, profitability, and unit-economics framing
        blocks:
          - type: paragraph
            body: >-
              Brevo's public financial file is unusually strong for a private European CRM vendor on scale and
              surprisingly weak on the detailed mechanics behind that scale. The strongest disclosed datapoint is the
              company's own statement that it will surpass €200 million ARR in 2025 with a double-digit EBITDA margin.
              That is a materially different signal from a growth story funded purely on hope: it implies scaled
              recurring revenue and some operating discipline before the 2025 round closed. Customer breadth and
              geography reinforce that point. Official and third-party sources place Brevo at 500,000+-to-600,000+
              customers, 1,000+ employees, and operations in 180 countries, with France, Germany, and the U.S.
              contributing 65% of current revenue. At the same time, the unit-economics pack remains incomplete. Public
              comparables provide only a band, not a direct answer: HubSpot posted roughly 83.8% gross margin in 2025,
              while Klaviyo posted 74.7%, and Brevo could sit below the top end if SMS, WhatsApp, transactional
              pass-through, and higher-touch services are more material than at pure-software peers. The sharper
              pricing-led insight is that Brevo's ARR cannot be reconciled with $9-$18 headline plans across the whole
              customer base. Public evidence therefore points to a business whose realized monetization is deeper than
              its entry pricing, but still under-disclosed on paid conversion, ARPA, retention, and contribution margin.
