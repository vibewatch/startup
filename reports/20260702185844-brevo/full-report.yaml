  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing signals
        blocks:
          - type: paragraph
            body: >-
              Brevo's public revenue model is broader than low-cost email software, but the monetization mechanics are
              only partially transparent. Official product pages show one platform spanning marketing campaigns,
              transactional messaging, sales software, a customer data platform, and loyalty workflows, while the
              rebrand from Sendinblue to Brevo was explicitly framed as a shift into a fuller CRM suite. Public pricing
              is visible enough to establish a freemium-to-enterprise ladder: Free, Starter, Standard, Professional, and
              Enterprise, with public entry prices of $0, $9, $18, $499, and custom enterprise contracts. PCMag adds
              important detail by showing volume-scaled tiers, extra charges for SMS/WhatsApp credits, and paid
              landing-page expansion. That means Brevo is not a single-price subscription business; it is a hybrid of
              self-serve subscriptions, usage-linked messaging, and likely negotiated enterprise packages.
              Customer-count evidence also matters: the official site says 500,000+ customers, while several late-2025
              articles say 600,000+. Paired with the disclosed ARR floor above €200 million, those figures imply that
              headline SMB list pricing cannot explain the business on its own. The public file therefore supports a
              real land-and-expand SaaS motion, but one that likely depends on scaled send volumes, higher-tier
              contracts, and module cross-sell rather than only starter-plan newsletter economics.
