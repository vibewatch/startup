      - number: '1.3'
        title: Capital history, scale, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Brevo’s public capital history shows two clear step-changes. First, the company’s 2020 Series B was
              reported at roughly $160–163 million, led by Bridgepoint with Bpifrance and BlackRock alongside Partech’s
              reinvestment; at that point the company said it served about 180,000 customers in 160 countries with
              roughly 400 employees and five offices. Second, the December 2025 financing brought in General Atlantic
              and Oakley Capital, left Bridgepoint and Bpifrance as minority investors, and fully exited Partech while
              pushing Brevo into unicorn status. Official and partner materials say management and employees became the
              company’s largest shareholder after that transaction, and TechCrunch further reported an approximate
              post-deal split of 26% for management and employees, 25% each for General Atlantic and Oakley, and 24%
              combined for Bridgepoint and Bpifrance. Scale disclosures also improved materially by late 2025: the
              company said it had surpassed 600,000 customers, operated in 180 countries, employed more than 1,000
              people, and expected to exceed €200 million ARR in 2025 with double-digit EBITDA margins. The exact
              valuation and exact current headcount still need diligence. Official materials disclose only “unicorn”
              status, while later private-equity trade reporting cited approximately €1 billion or $1.1 billion as a
              valuation anchor in subsequent talks.
