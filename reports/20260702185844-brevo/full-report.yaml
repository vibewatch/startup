  - id: TP001
    title: Competitor profile table
    columns:
      - Vendor
      - Category
      - Primary buyer
      - Product scope
      - Public entry point
      - Data / trust posture
      - Key limitation vs. Brevo
    rows:
      - - Brevo
        - Omnichannel SMB CRM / marketing platform
        - SMBs and lower mid-market teams wanting one bundle
        - Email, automation, SMS, WhatsApp, transactional messaging, CDP, CRM
        - Free; Starter $9/mo; Standard $18/mo
        - Brevo markets GDPR support and ISO-backed security practices
        - Shallower ecosystem and CRM depth than large suites
      - - Mailchimp / Intuit
        - Email marketing and automation suite
        - Growing SMBs and creator / commerce operators
        - Email, automations, forms, analytics, integrations
        - Free-trial-led; contact-based pricing with discounts at 10K+ contacts
        - EU transfers handled via SCCs to the U.S.
        - Less visible CRM and transactional depth than Brevo bundle
      - - HubSpot
        - CRM-led growth suite
        - SMBs scaling toward full GTM system
        - Marketing, CRM, service, content, analytics, AI
        - Starter seat pricing; contact tiers and send caps expand spend
        - SOC 2 / ISO infrastructure, AES-256 at rest, SCC-based transfers
        - Higher complexity and contract friction for small teams
      - - Klaviyo
        - B2C CRM / omnichannel commerce platform
        - Retail and ecommerce brands
        - Email, SMS, RCS, mobile app marketing, WhatsApp, social
        - Free usage tiers; enterprise support from $500/mo
        - Security and GDPR posture present, but U.S.-led operating model
        - More retail-specialized than general SMB CRM
      - - ActiveCampaign
        - Automation-heavy SMB marketing platform
        - SMBs needing deeper orchestration and ecommerce logic
        - Email, automations, CRM, messaging, integrations
        - Tiered plans from Starter to Enterprise
        - DPA, SCCs, GDPR/SOC2/HIPAA compliance claims
        - Tier complexity and heavier setup than Brevo starter motion
      - - Mailjet
        - Email marketing and transactional sender
        - Teams prioritizing email deliverability with lighter marketing needs
        - Campaign email, SMTP, editor, automation basics
        - Free; Starter $9/mo
        - Data stored in Frankfurt and Belgium
        - Narrower CRM and omnichannel scope
      - - Mailgun
        - Transactional email API / deliverability layer
        - Developers and enterprise senders
        - Email API, SMTP relay, validation, deliverability tooling
        - Free first month; Foundation $35/mo
        - Compliance-heavy enterprise posture, but API-first
        - No SMB CRM or campaign operating layer
      - - CleverReach
        - Newsletter-centric email marketing tool
        - European SMB senders
        - Email campaigns, newsletters, basic marketing workflows
        - Free version; review sources cite ~$10/mo starting price
        - Public review sources frame it as Germany-based, but official pages were fetch-blocked
        - Less public evidence of CRM or omnichannel breadth
      - - Zoho Campaigns / Marketing Automation
        - Low-cost suite alternative
        - SMBs already leaning toward Zoho stack
        - Email, journeys, forms, ecommerce and account-based automation
        - Free up to 2K contacts / 6K emails per month
        - Privacy materials provide GDPR DPA path and EEA-style rights
        - Best when customer is willing to live inside broader Zoho stack
      - - Salesforce Starter Suite
        - AI + CRM bundle for small business
        - SMBs wanting CRM-first workflow ownership
        - CRM, sales flows, email marketing, service and commerce hooks
        - Starts at $25/user/mo plus transaction-fee language
        - Hyperforce enables EU data residency options
        - Overkill for small teams that only need messaging and light CRM
