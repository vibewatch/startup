  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Omnichannel Suite and Customer Jobs
        blocks:
          - type: paragraph
            body: >-
              Brevo's public product surface is clearly broader than a standalone newsletter tool. The company markets a
              unified suite for email, SMS, and WhatsApp campaigns, lead capture through signup forms and landing pages,
              no-code workflow automation, and a lightweight sales CRM for deals and meetings. In customer-workflow
              terms, the stack is designed to capture a lead, enrich or segment that contact, trigger lifecycle or
              promotional messages across channels, and then hand higher-intent contacts into a sales pipeline without
              leaving the same admin surface. That breadth is not just homepage copy: Zapier exposes subscriber-ingest
              workflows from common forms and lead sources, while WordPress plugin materials and reviews confirm real
              distribution through site operators, ecommerce connectors, and plugin-based deployment paths. The
              practical caveat is that the suite is not uniformly mature or uniformly packaged. Brevo's own pages
              emphasize free and low-cost entry points, but third-party reviews point to feature gating around landing
              pages, advanced reporting, multi-user access, and some pop-up or plugin functionality. Investors should
              therefore separate true module breadth—which is real—from seamless all-tier execution, which remains
              uneven by channel and surface.
