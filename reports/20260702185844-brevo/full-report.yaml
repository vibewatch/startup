  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Mark and the Disclosure Boundary
        blocks:
          - type: paragraph
            body: >-
              Public evidence makes the financing event real but the exact mark fuzzy. Brevo’s own December 4, 2025
              press release and General Atlantic’s parallel announcement confirm a €500 million financing, unicorn
              status, more than €200 million of 2025 ARR, and a double-digit EBITDA margin. TechCrunch adds the most
              useful cap-table color, reporting that General Atlantic and Oakley each bought roughly 25% stakes while
              management and employees remained the largest shareholder at 26%, but the same article says the exact
              valuation was not disclosed. That matters because the round appears to combine ownership change and growth
              capital, so outsiders can defend only an approximate €1.0-€1.1 billion equity-value band rather than a
              precise post-money. At that band and just-over-€200 million ARR, Brevo screens around 5.0x-5.5x ARR. The
              operating story is not weak: 180 countries, roughly 600,000 customers, more than 1,000 employees, U.S. new
              revenue at 24%, and mid-market growth running twice the rest of the business. Clipperton’s transaction
              note adds that the same round is intended to accelerate North American scale, fund large-scale AI product
              investment, support targeted M&A, and help the company pursue a €1 billion annual-revenue ambition by
              2030. But valuation work here has to start with what is missing as much as with what is known: exact round
              terms, preference stack, and the exact 2025 ARR exit remain undisclosed.
            claimRefs:
              - CV001
