  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding timeline, and platform scope
        blocks:
          - type: paragraph
            body: >-
              Brevo describes itself as a customer platform for sustainable growth spanning email, SMS, WhatsApp, chat,
              marketing automation, CRM, and related sales workflows. The current product and pricing pages show a
              ladder from free and starter plans to multi-seat professional plans and a custom enterprise tier, which
              indicates a subscription-led SaaS model with add-on usage components such as SMS credits, dedicated IP,
              and advanced sales seats. The official footprint is clearly Paris-led today, but the founding timeline
              needs nuance rather than a single date. French registry aggregators list SENDINBLUE as registered in Paris
              in May 2007, while Brevo’s own about and rebrand materials say Armand Thiberge founded the operating
              business in 2012 in India and France and later grew it from an email newsletter tool into a fuller CRM
              suite. That 2012 story is also consistent with the company’s 2023 “after a decade” rebrand narrative. On
              the record reviewed for this chapter, Armand Thiberge remains the public founder-CEO and no fetched source
              supports the prompt’s suggested CEO name Isabelle Gallo. The cleanest synthesis is that the legal vehicle
              predates the operational scaling story, and the brand’s core identity today is the broader Brevo platform
              rather than the original Sendinblue email-only positioning.
