      - number: '1.2'
        title: Leadership, governance, and control structure
        blocks:
          - type: paragraph
            body: >-
              Brevo’s public leadership posture is still founder-led. The 2026 executive page lists Armand Thiberge as
              founder and chief executive officer, supported by CTO Mickaël Arias, CRO and CEO of Americas Channing
              Ferrer, Chief People & Impact Officer Laure Rudelle Arnaud, Chief Product Officer Jérémy Cahen, CFO
              Edouard Celier, Chief Data and AI Officer Charli Idrac, CMO Inken Kuhlmann-Rhinow, and Chief of Staff
              Thibault Rouillon. That gives the company meaningful functional depth across product, revenue, finance,
              people, and AI, but key-person dependence remains concentrated in Thiberge because the rebrand, 2025
              financing, and AI strategy are all publicly communicated through him. Public governance disclosure is
              thinner than leadership disclosure. Registry records surfaced through Societe.com and Pappers show the
              formal president of SENDINBLUE has been Eiffel 65 since January 2021, even though Brevo’s external
              materials still present Thiberge as founder-CEO. The same registry feed also records an October 2023
              continuation filing after net assets fell below half of share capital, which is a meaningful governance
              and balance-sheet warning signal even if the company continued operating normally. Board composition,
              board-seat allocation, and shareholder-rights details remain undisclosed in the public materials reviewed,
              so governance diligence still depends on private cap-table and board documents.
