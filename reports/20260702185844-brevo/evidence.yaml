evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, board-seat allocation, shareholder agreements, and voting-control documents.
    whyItMatters: >-
      Public leadership pages and registry records do not reveal who actually sits on the board or what rights new
      investors hold.
    diligencePath: Request the latest board deck, shareholder agreement, bylaws, and cap table from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Official post-money valuation memo or financing deck for the December 2025 round.
    whyItMatters: >-
      The market narrative says “unicorn,” while trade press later cited roughly €1.0B / $1.1B; exact valuation affects
      ownership dilution and return underwriting.
    diligencePath: Obtain the signed financing term sheet, valuation bridge, and post-close capitalization table.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: An exact current employee count by function and geography.
    whyItMatters: >-
      Official pages only say 1,000+ employees, while third-party directories lag with wide ranges; workforce scale
      matters for burn, productivity, and integration capacity.
    diligencePath: Request the latest HR headcount roll-forward and office-level org breakdown.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
  - type: access-blocked
    severity: minor
    topic: litigation-review
    missingEvidence: >-
      Court-docket, regulator, and sanctions sweeps beyond the public company, registry, and media sources reviewed
      here.
    whyItMatters: Absence of a lawsuit in this source set is not the same as a completed legal diligence review.
    diligencePath: >-
      Run dedicated litigation, sanctions, and regulator database searches across France, the EU, India, Canada, and the
      U.S. before investment committee.
    relatedQuestionRefs:
      - QO023
  - type: conflicting-data
    severity: material
    topic: financial-scale
    missingEvidence: Management reconciliation for the 2024 ARR figure and its reported currency denomination.
    whyItMatters: >-
      Official Brevo materials use both $179M and €179M for what appears to be the same 2024 ARR reference, which can
      materially alter growth and valuation framing.
    diligencePath: Request the audited or board-approved 2024 ARR bridge with reporting currency and FX policy.
    relatedQuestionRefs:
      - QO013
      - QO024
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: A full investor-by-investor ownership table including preferred terms and board rights.
    whyItMatters: The public investor map is directionally useful but incomplete for control analysis and downside protections.
    diligencePath: Request the post-close cap table, liquidation preference summary, and any investor-rights agreement.
    relatedQuestionRefs:
      - QO008
      - QO011
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: >-
      A complete internal chronology of acquisitions, legal-entity events, and board milestones beyond the public
      milestone set used in TO004.
    whyItMatters: >-
      The milestone table is comprehensive for public inflection points, but not exhaustive for every acquisition close
      date or governance event that could matter in diligence.
    diligencePath: >-
      Request a management-prepared corporate timeline covering all acquisitions, material governance actions, and
      legal-entity changes since inception.
    relatedQuestionRefs:
      - QO018
      - QO023
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: europe-sam
    missingEvidence: >-
      A public Europe-only software-spend slice for email marketing, automation, and SMB CRM that matches Brevo's
      practical product scope.
    whyItMatters: >-
      Without a Europe-specific spend bridge, public TAM figures are too broad for a clean Brevo SAM or regional
      penetration model.
    diligencePath: >-
      Request management's regional revenue bridge and any third-party spend studies segmented by European SMB size
      bands and channel mix.
    relatedQuestionRefs:
      - QM009
      - QM028
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: brevo-product-mix
    missingEvidence: Revenue or customer splits across Brevo email, automation, sales CRM, SMS, and WhatsApp products.
    whyItMatters: >-
      Product-family mix determines which external market lens is actually relevant and whether margins resemble email
      software or broader engagement tooling.
    diligencePath: Request product-family ARR, attach-rate, and gross-margin disclosure by geography and customer size.
    relatedQuestionRefs:
      - QM028
      - QM029
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: cohort-conversion
    missingEvidence: Free-to-paid conversion, ARPU, churn, and expansion cohorts by SMB, midmarket, and regional segment.
    whyItMatters: >-
      Market size does not reveal whether Brevo converts broad demand into durable paid share or suffers low-end price
      churn.
    diligencePath: Request cohort tables and expansion data tied to segment, region, and product bundle.
    relatedQuestionRefs:
      - QM029
      - QM030
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: compliance-impact
    missingEvidence: >-
      Measured post-2025 effects of sender-rule enforcement and privacy changes on deliverability, open-rate utility,
      support burden, and retention.
    whyItMatters: >-
      Compliance and privacy shifts may materially affect product value, onboarding friction, and attach rates for
      omnichannel features.
    diligencePath: >-
      Request deliverability metrics, roadmap changes, and churn or procurement evidence linked to Gmail, Yahoo, Apple,
      and consent-rule changes.
    relatedQuestionRefs:
      - QM022
      - QM023
      - QM030
    relatedTableRefs:
      - TM004
  - type: access-blocked
    severity: material
    topic: cleverreach-positioning
    missingEvidence: >-
      A fetchable official CleverReach product or compliance page that states current channel scope, data posture, and
      CRM breadth.
    whyItMatters: >-
      CleverReach is in the requested peer set, but official public pages were bot-verification blocked during this run,
