    whyItMatters: >-
      The chapter intentionally focuses on the named competitor set plus the most common substitutes, so the long tail
      of alternatives is summarized in prose rather than exhaustively enumerated.
    diligencePath: >-
      Expand future refreshes with vertical-specific comparisons only after current win-loss data shows meaningful
      overlap outside the named peer group.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP001
