      - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing-pressure
    missingEvidence: >-
      Realized enterprise discounts, minimum contract values, onboarding fees, and transaction-fee impacts for Brevo and
      major competitors.
    whyItMatters: >-
      List prices and promotional pages explain top-of-funnel positioning, but they do not show where the competitive
      deal actually closes for larger accounts.
    diligencePath: >-
      Request recent order forms, win-loss notes, and effective-price waterfalls for Brevo, HubSpot, Salesforce,
      Klaviyo, and ActiveCampaign deals.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
