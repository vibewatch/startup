- id: switching-costs-and-ecosystem
  title: Switching costs and ecosystem power
  body: 'Brevo’s lock-in is cumulative rather than singular. A customer that starts with newsletters can gradually add list segmentation, consent history, forms, transactional triggers, sender domains, CRM objects, WhatsApp or SMS flows, and external automations. None of those artifacts is individually impossible to migrate, but together they create non-trivial rebuilding cost. Zapier’s connector is especially revealing because it exposes contacts, companies, deals, transactional email, SMS, and event-driven workflows. That suggests Brevo can become the coordinating system for an SMB even when other apps remain in place.


    The partner story cuts both ways. Brevo has an agency program and a public service-partner directory, which should reduce implementation friction and make it easier for small firms to outsource setup. But the surrounding ecosystem is still thinner than the ecosystems promoted by HubSpot, Klaviyo, ActiveCampaign, and Salesforce. HubSpot layers software with marketplace and partner programs; Klaviyo says it connects 350+ apps and runs a global agency-and-tech network; ActiveCampaign advertises 1000+ apps; and Salesforce’s small-business offer sits next to the company’s much broader platform and AppExchange heritage.


    That difference matters not just for acquisition, but for retention. When ecosystem depth rises, customers inherit more templates, consultants, adjacent apps, and operator know-how around the platform. Brevo’s ecosystem is already strong enough to support SMB onboarding and modest expansion, but it is not yet a structural moat on the level of the biggest suites. The real competitive question is whether Brevo can keep enough workflow gravity to stop customers from either consolidating upward into a bundle or fragmenting sideways into specialists.'
