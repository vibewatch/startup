- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Pricing unit
  - Public entry point
  - Included capabilities at entry
  - Expansion lever
  - Competitive implication
  rows:
  - - Brevo
    - Plan + send volume
    - Free; Starter $9/mo; Standard $18/mo
    - Email, transactional messages, templates; Standard adds unlimited automation
    - Higher send volumes and more features
    - Best for transparent pilot motion and price-sensitive omnichannel buyers
  - - Mailchimp
    - Contact-based SaaS
    - Free-trial-led; Standard promotions at 10K+ contacts
    - Email, automations, forms, analytics
    - Contact count and higher premium tiers
    - Can be the “good enough” benchmark that slows Brevo evaluation
  - - HubSpot
    - Seats + marketing contacts
    - Promotional Starter pricing as low as $7/seat/mo; standard listed $20/seat/mo
    - Core marketing plus CRM access and 1K contacts
    - More contacts, more seats, higher hubs, onboarding and renewal lock
    - Low starter sticker can hide larger expansion economics
  - - Klaviyo
    - Usage + support packages
    - Free email/SMS usage tiers; enterprise support starts at $500/mo
    - Email and SMS entry with omnichannel retail tooling
    - Message volume and support tier
    - Attractive when buyer optimizes on commerce revenue, not general CRM breadth
  - - ActiveCampaign
    - Tiered contact-based plans
    - Starter; Plus; Pro; Enterprise
    - Starter email automation with limited actions
    - More users, premium integrations, SSO, dedicated team
    - Can out-feature Brevo on automation depth but is less simple to buy
  - - Mailjet
    - Send-volume email SaaS
    - Free; Starter $9/mo
    - Email campaigns and transactional basics
    - Higher send volume and premium support
    - Undercuts Brevo when buyer only needs email economics
  - - Mailgun
    - API / send volume
    - Free first month; Foundation $35/mo; Scale $90/mo
    - Email API, SMTP, validation
    - Higher volume, dedicated IPs, SSO, retention windows
    - Better for developers, worse for self-serve marketers
  - - Zoho
    - Contact-based SaaS
    - Free up to 2K contacts / 6K emails
    - Email campaigns, templates, basic forms
    - Unlimited emails, more users, broader Zoho cross-sell
    - Competes hardest when buyer already values Zoho suite density
  - - Salesforce Starter Suite
    - Per-user bundle
    - Starts at $25/user/mo
    - CRM, AI-assisted sales flows, dynamic email marketing
    - More users, Pro Suite, transaction-linked upsell
    - Bundles CRM + AI narrative that can make Brevo feel narrow in CRM-led deals
