- id: TP004
  title: GDPR / data-sovereignty and ecosystem comparison
  columns:
  - Vendor
  - Public privacy / residency posture
  - Partner / app ecosystem evidence
  - Likely switching-cost artifact
  - Implication for Brevo
  rows:
  - - Brevo
    - GDPR page plus ISO-backed security page and Europe-forward positioning
    - Agency partner program, service partner directory, Zapier connector
    - Consents, automations, CRM objects, sender domains, partner playbooks
    - Helps win privacy-conscious SMBs without full-suite overhead
  - - Mailchimp
    - SCC-based EU-to-U.S. transfer language
    - Integrations directory across store, accounting, social, and more
    - Lists, templates, audience segments, connected store apps
    - Familiar benchmark with lower sovereignty differentiation
  - - HubSpot
    - SCC / UK-addendum privacy language; regional hosting is a stated priority; SOC2/ISO controls
    - Marketplace plus multiple partner programs
    - Contacts, content, reports, workflows, seats, consulting dependency
    - Large ecosystem raises both acquisition leverage and switching friction
  - - Klaviyo
    - Security/GDPR posture but U.S.-led brand framing
    - 350+ apps and global agency/tech partner network
    - Retail data model, channel orchestration, partner execution know-how
    - Strong specialist ecosystem for ecommerce-centered buyers
  - - ActiveCampaign
    - DPA, SCCs, subprocessor page, GDPR/SOC2/HIPAA claims
    - 1000+ apps and partner motion
    - Advanced automations, ecommerce integrations, user permissions
    - High feature depth can pull mature automation teams away from Brevo
  - - Mailjet
    - Explicit data-center locations in Germany and Belgium
    - Smaller ecosystem than suite leaders
    - Domains, sending reputation, templates, deliverability setup
    - EU trust story is strong, but breadth is narrower than Brevo
  - - Mailgun
    - Enterprise compliance claims and API controls
    - Developer tooling and deliverability ecosystem
    - API implementation, templates, IPs, deliverability rules
    - Competes as infrastructure, not as full SMB engagement layer
  - - Zoho
    - Privacy page offers GDPR DPA path and EEA-style rights
    - Ecosystem strength comes from broader Zoho suite adjacency
    - Suite-level data, users, and cross-app process coupling
    - Low-cost bundle alternative for buyers already aligned to Zoho stack
  - - Salesforce
    - Hyperforce supports EU-boundary processing and local support
    - Starter inherits relevance from broader Salesforce platform and AppExchange brand
    - CRM data model, AI workflows, service/commercial process ownership
    - Most dangerous when the deal starts from CRM standardization rather than messaging
  notes: This table compares public posture, not audited legal equivalence. Native integration counts are not consistently disclosed across vendors, so ecosystem depth is described qualitatively.
