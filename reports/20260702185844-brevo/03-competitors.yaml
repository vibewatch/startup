- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Brevo wedge / moat
  - Threatening rival(s)
  - Severity
  - Why the threat is credible
  - Diligence test
  rows:
  - - Transparent self-serve omnichannel bundle
    - HubSpot, Zoho, Salesforce Starter
    - High
    - Suite vendors can narrow entry-price gaps while promising CRM, AI, and service consolidation
    - Measure win/loss rate when CRM ownership is the first buying criterion
  - - European privacy and trust narrative
    - Mailjet, plus regional hosting offers from larger suites
    - Medium
    - Mailjet has explicit EU data-center language, while larger vendors answer with legal or infrastructure controls
    - Test whether EU-trust actually changes conversion in regulated segments
  - - Breadth across campaign plus transactional messaging
    - Mailgun and Mailjet on infrastructure, Mailchimp on “good enough” breadth
    - High
    - API-first and email-first specialists can undercut Brevo for narrower jobs
    - Quantify what share of new ARR lands because customers want both transactional and marketing in one contract
  - - Approachable partner-led onboarding
    - HubSpot, Klaviyo, ActiveCampaign, Salesforce
    - Medium-High
    - Larger partner ecosystems produce more consultants, templates, and migration paths
    - Count implementation partners, certified experts, and partner-sourced pipeline mix
  - - SMB-friendly value perception
    - Mailchimp, Zoho, Mailjet
    - Medium
    - Independent reviews already show buyers compare Brevo heavily on value and free-plan generosity
    - Track discount pressure and feature objections by competitor at first-call stage
  - - Middle-lane positioning between suites and specialists
    - All major rivals
    - High
    - The middle can be squeezed if Brevo does not keep compounding both breadth and workflow depth
    - Monitor whether expansion customers add CRM/workflow modules or churn to narrower or deeper tools
  notes: Severity is a diligence-stage judgment as of 2026-07-02, not a forecasted probability; “high” means the threat can materially affect pricing power or retention if the buying context shifts.
