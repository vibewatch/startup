  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: cleverreach-positioning
    missingEvidence: A fetchable official CleverReach product or compliance page that states current channel scope, data posture, and CRM breadth.
    whyItMatters: CleverReach is in the requested peer set, but official public pages were bot-verification blocked during this run, so the comparison relies on independent review surfaces.
    diligencePath: Retry CleverReach official pages with a maintainer-approved browser workflow or request vendor materials directly so the review-based row can be replaced with first-party evidence.
    relatedQuestionRefs:
    - QP018
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: partner-ecosystem
    missingEvidence: Consistent native integration counts and partner-sourced pipeline data for Brevo, HubSpot, Klaviyo, ActiveCampaign, and Salesforce after excluding third-party bridges.
    whyItMatters: Public materials prove the existence of marketplaces and partner programs, but they do not let the chapter compare native ecosystem depth on a normalized basis.
    diligencePath: Ask each vendor or internal RevOps team for native-app counts, certified-partner counts, and partner-sourced revenue mix to separate marketing breadth from actual ecosystem usage.
    relatedQuestionRefs:
    - QP022
    - QP026
    relatedTableRefs:
    - TP002
    - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing-pressure
    missingEvidence: Realized enterprise discounts, minimum contract values, onboarding fees, and transaction-fee impacts for Brevo and major competitors.
    whyItMatters: List prices and promotional pages explain top-of-funnel positioning, but they do not show where the competitive deal actually closes for larger accounts.
    diligencePath: Request recent order forms, win-loss notes, and effective-price waterfalls for Brevo, HubSpot, Salesforce, Klaviyo, and ActiveCampaign deals.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: A complete, source-backed census of edge-case substitutes such as internal-build stacks, niche vertical automation tools, and regional newsletter providers.
    whyItMatters: The chapter intentionally focuses on the named competitor set plus the most common substitutes, so the long tail of alternatives is summarized in prose rather than exhaustively enumerated.
    diligencePath: Expand future refreshes with vertical-specific comparisons only after current win-loss data shows meaningful overlap outside the named peer group.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP001
