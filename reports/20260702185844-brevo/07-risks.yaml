- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, Monitoring, and Kill Criteria
  body: 'Brevo is not a no-control story. The company has visible mitigants: EU-hosted infrastructure with ISO 27001 language, a formal legal stack, deliverability tooling, a documented executive team, and public evidence of real scale. Those mitigants justify underwriting the business as a serious platform rather than a fragile point tool. But they do not clear the hardest adverse questions. Before treating the current story as investable without a valuation discount, diligence should force management to produce private evidence on churn and retention cohorts, mailbox-provider complaint or rejection rates, SLA attainment and incident severity, WhatsApp or SMS policy exceptions, board governance, and the integration health of acquired modules. The kill criteria should therefore be explicit and measurable. If channel enforcement rises, status incidents keep clustering around core send surfaces, support economics worsen as seats and add-ons expand, or sponsor-funded breadth comes with weak
    depth metrics, the downside is not just slower growth. It is a structurally weaker platform with more competition, more compliance exposure, and less pricing power than the top-line narrative implies.'
