company:
  name: Brevo
chapter:
  number: 7
  title: Risks
  summary: Brevo's residual risk profile is driven less by existential product-market doubt than by the combination of rising bundle competition, external channel dependence, sponsor-backed execution stretch after the 2025 unicorn round, and limited public durability disclosure. The company has meaningful mitigants—formal legal controls, deliverability tooling, visible security posture, and real scale—but the public record still supports a cautious, evidence-hungry view because outages, policy gatekeepers, and breadth-vs-depth pressure can all hit growth before investors see the damage in disclosed metrics.
sections:
- id: regulatory-privacy-and-channel-compliance-risk
  title: Regulatory, Privacy, and Channel-Compliance Risk
  body: Brevo has more formal legal and privacy scaffolding than a lightweight SMB email tool, but that scaffolding also highlights how much execution risk sits in regulated messaging workflows. The October 2025 terms embed the DPA, security measures, SLA, and acceptable-use rules inside the core contract, and the anti-spam policy explicitly requires active consent, proof of opt-in, unsubscribe mechanics, and clean list sourcing. That matters because the business spans email, SMS, and WhatsApp, where the relevant constraints are not just Brevo's own rules. The ICO says unsolicited email and text marketing often need specific consent, while WhatsApp requires opt-in permission and reserves the right to limit or remove business access for policy violations. Brevo also discloses a multi-entity controller structure and possible transfers outside the EEA. The risk is therefore not lack of legal text; it is that Brevo customers can still trigger enforcement, suspension, or procurement friction
    if consent trails, transfer controls, or channel-specific policy handling are weak in practice.
  claimRefs:
