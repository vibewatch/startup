  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn-proof
    missingEvidence: 12- to 24-month GRR, NRR, logo churn, and support-burden cohorts by plan and customer segment.
    whyItMatters: The core SMB-churn and upmarket-durability risks cannot be priced without cohort evidence.
    diligencePath: Request cohort tables, plan-level retention bridges, and gross-profit retention by channel attach rate.
    relatedQuestionRefs:
    - QR024
  - type: private-evidence-only
    severity: material
    topic: deliverability-by-isp
    missingEvidence: Mailbox-provider complaint, rejection, bounce, and inbox-placement metrics segmented by Gmail, Yahoo, and top sending cohorts.
    whyItMatters: Deliverability dependence is one of the highest residual risks and public tooling does not replace hard performance data.
    diligencePath: Request Postmaster or equivalent ISP dashboards, complaint-rate history, and remediation playbooks for major sender cohorts.
    relatedQuestionRefs:
    - QR025
  - type: private-evidence-only
    severity: material
    topic: governance-and-investor-rights
    missingEvidence: Current board composition, reserved matters, investor veto rights, management incentive plans, and succession planning materials.
    whyItMatters: Sponsor-backed execution pressure is harder to price when governance protections and control rights are opaque.
    diligencePath: Request cap-table governance summary, board deck excerpts, and shareholder-agreement governance provisions.
    relatedQuestionRefs:
    - QR020
    - QR026
  - type: private-evidence-only
    severity: material
    topic: incident-severity-and-sla-proof
    missingEvidence: Incident severity distribution, MTTR history, SLA attainment, root-cause reviews, and customer-credit volumes by product surface.
    whyItMatters: Public incident counts show recurrence but not whether operational failures are shallow nuisances or material customer events.
    diligencePath: Request 12-month incident postmortem summaries, SLA reports, and customer-escalation metrics.
    relatedQuestionRefs:
    - QR007
    - QR028
  - type: private-evidence-only
    severity: material
    topic: cash-efficiency-and-downside-cushion
    missingEvidence: Cash balance, burn, working-capital profile, and 2026 plan-vs-actual commentary beyond the ARR and EBITDA headline.
    whyItMatters: Sponsor-backed execution risk is materially different if the post-round cushion is strong versus if the roadmap still depends on another raise.
    diligencePath: Request management accounts, cash runway analysis, and scenario sensitivities tied to US and M&A expansion.
    relatedQuestionRefs:
    - QR019
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-risk-register-completeness
    missingEvidence: A full jurisdiction-by-jurisdiction legal review covering every market, carrier rule, and channel-specific exception.
    whyItMatters: The regulatory register is intentionally decision-focused and should not be mistaken for a complete legal inventory.
    diligencePath: Expand legal diligence for target geographies, sectors, and planned campaign types before underwriting regulated expansion.
    relatedQuestionRefs:
    - QR004
    - QR005
    relatedTableRefs:
    - TR001
