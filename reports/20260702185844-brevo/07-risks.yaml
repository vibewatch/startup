- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Mailbox-provider enforcement risk
    - Gmail or Yahoo rejection / spam-placement evidence
    - Management cannot provide ISP-level complaint, rejection, and authentication metrics or shows worsening trends over two consecutive quarters
    - Treat deliverability durability as unproven and underwrite a steeper discount or walk
  - - Core send-surface reliability risk
    - Official incidents and postmortems
    - More than three material email, transactional, automation, or SMS incidents in 90 days without convincing root-cause remediation
    - Pause diligence until reliability evidence improves
  - - WhatsApp / SMS policy and economics risk
    - Meta warnings, opt-in exceptions, or carrier-margin erosion
    - Any material WhatsApp policy strike, sudden message-category repricing, or SMS margin compression without offsetting price changes
    - Reduce channel-upside assumptions and reassess multichannel thesis
  - - Sponsor-backed execution stretch
    - 2026 operating plan vs financing promises
    - AI, US, or M&A expansion advances faster than support quality, module attach, or retention proof
    - Assume breadth is diluting depth and avoid paying growth-premium multiples
  - - SMB churn and support burden
    - Plan-level churn, seat expansion, and add-on uptake
    - Management cannot show healthy cohort retention or reveals churn spikes when seats or channel spend scale
    - Treat the free-to-paid funnel as weaker than marketed and step back
  - - Governance and disclosure opacity
    - Private diligence package completeness
    - Board rights, investor protections, SLA attainment, and incident severity remain opaque after diligence requests
    - Escalate to research-more or avoid because downside cannot be priced confidently
  notes: Kill criteria focus on proof that can be requested privately in diligence rather than on optimistic public roadmap milestones.
