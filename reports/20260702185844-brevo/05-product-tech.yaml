callouts:
- calloutType: strength
  title: Broad suite + real integration surface
  body: 'Brevo is not just marketing email software in public evidence: the suite spans transactional email, SMS, WhatsApp, forms, landing pages, deals, webhooks, and a wide API/partner surface. That breadth lowers adoption friction for smaller teams that want one vendor to cover growth, messaging, and light CRM workflows.'
  claimRefs:
  - CE001
  - CE013
  - CE014
  - CE021
  - CE025
- calloutType: risk
  title: Fast shipping cadence creates real migration overhead
  body: Brevo shipped breaking SDK majors, spec corrections, OAuth scope changes, and a contacts-endpoint deprecation in 2026 alone. Combined with the Node compatibility warning and branch fragmentation in npm, this means technical customers should expect active upgrade management rather than a static integration surface.
  claimRefs:
  - CE035
