- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Role
  - Key dependency / control
  - Product / tech risk
  rows:
  - - Campaign and channel UI
    - Creates email, SMS, and WhatsApp campaigns
    - Brevo web app and account permissions
    - Surface breadth increases configuration complexity for smaller teams
  - - Contacts, lists, and segments
    - Stores recipient state for campaigns and CRM
    - Contacts API, custom attributes, segmentation logic
    - Public data-model depth is broad but role/field governance is not deeply disclosed
  - - Workflow automation engine
    - Evaluates triggers and routes cross-channel steps
    - Workflow editor, events, SMTP/API triggers
    - No public execution SLA or backpressure disclosure
  - - Messaging API
    - Sends transactional email, SMS, and WhatsApp messages
    - API keys or OAuth, documented rate limits
    - High throughput is documented, but infrastructure topology is opaque
  - - Transactional template layer
    - Applies templateId and params personalization
    - Template editor plus API payload schema
    - Template governance and promotion process are not public
  - - Sales CRM object model
    - Represents deals, pipelines, stages, meetings, and associations
    - CRM endpoints plus Sales CRM webhooks
    - Smaller public footprint than dedicated CRM platforms
  - - Webhook event bus
    - Pushes delivery, marketing, CRM, payment, loyalty, and notification events
    - Customer endpoint plus webhook cap and security setup
    - Forty-webhook cap can constrain multi-tenant or highly segmented implementations
  - - SDK and spec layer
    - Provides official clients and generated integrations across languages
    - OpenAPI v2 spec + language-specific package registries
    - Version skew across Node, Python, PHP, Ruby, and .NET raises migration overhead
  - - AI / MCP control plane
    - Lets assistants query or mutate Brevo through natural language
    - MCP token, compatible client, documented tools
    - Public documentation shows active security changes and evolving SDK/toolchain expectations
  - - Sender and domain controls
    - Verifies branded sending identities
    - Sender email verification + domain authentication
    - No public visibility into IP-pool design, warm-up tooling, or reputation isolation
  notes: This architecture map stays at the public-interface level because Brevo does not disclose internal cloud, queueing, or MTA topology. Risks focus on what an external technical buyer cannot verify today.
