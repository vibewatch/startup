  evidenceGaps:
  - type: missing-source
    severity: material
    topic: architecture-opacity
    missingEvidence: Named cloud providers, MTA topology, dedicated-vs-shared IP model, regional data-path details, and tenant-isolation architecture for core sending infrastructure.
    whyItMatters: Brevo makes strong deliverability and reliability claims, but buyers cannot pressure-test residency, warm-up design, or blast-radius risk from public materials alone.
    diligencePath: Request an engineering architecture review covering mail-transfer topology, data-region controls, sending-pool design, failover, and tenancy boundaries.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: security-scope
    missingEvidence: Public evidence for certification scope beyond ISO 27001 marketing copy, plus penetration-test cadence, key-management design, and customer-facing security artifacts.
    whyItMatters: Brevo sells into multi-channel engagement workflows that touch PII, transactional traffic, and CRM records, so certification scope and operational controls affect buyer trust and enterprise readiness.
    diligencePath: Ask for trust-center access, current certification letters, pen-test summary, incident-response policy, and documentation on encryption, key management, and vendor subprocessors.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: feature-entitlement-clarity
    missingEvidence: Authoritative plan-by-plan entitlements for pop-up forms, multi-user access, landing pages, advanced reporting, and other gated add-ons across SMB and enterprise tiers.
    whyItMatters: Official and third-party surfaces agree the suite is broad, but buyers can still be surprised by gating that affects rollout cost, workflow design, and channel coverage.
    diligencePath: Request the current commercial packaging sheet and admin-seat matrix, then test the exact account tier intended for deployment in a sandbox tenant.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE001
    - TE005
