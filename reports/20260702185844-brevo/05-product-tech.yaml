- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control / signal
  - Public status
  - Scope / evidence
  - Gap / concern
  rows:
  - - ISO 27001 security practices
    - Claimed on marketing page
    - Data Security page cites ISO 27001:2013-certified practices
    - No public scope letter or adjacent certifications surfaced in fetched materials
  - - GDPR / CASL / CCPA support
    - Claimed on privacy and security pages
    - Data-security copy plus dedicated GDPR page
    - No public mapping of controls to specific modules or regions
  - - Sender verification + domain auth
    - Documented in API docs
    - Senders and domains guide requires sender verification and domain authentication
    - No public detail on dedicated IP, warm-up, or deliverability remediation flows
  - - API keys and OAuth scopes
    - Documented and improving in 2026
    - Getting-started docs plus June 2026 scope release note
    - Granular IAM model beyond scopes is not public
  - - Webhook governance
    - Documented
    - Brevo limits marketing+transactional webhooks to 40 and documents secured webhooks
    - Webhook retry and durability guarantees are not stated publicly
  - - MCP credential hardening
    - Improved in Mar 2026
    - Changelog says tokens no longer travel in URLs and rate limiting was added
    - Still no public auditability or permission-boundary deep dive
  - - First-party status segmentation
    - Visible now
    - Status page breaks health into major product families
    - History depth and module-level SLA commitments remain limited
  - - Independent outage monitoring
    - Visible from third parties
    - IsDown and StatusGator both track recurring incidents and recent outages
    - Aggregators are useful but not a substitute for vendor RCA and uptime commitments
  - - Community quality signal
    - Mixed
    - WordPress plugin has many reviews and a 4.1/5 aggregate
    - 2026 complaints include bugs, unclear gating, and form-connection issues
  notes: The table mixes first-party controls with third-party reliability and community quality signals because Brevo’s public trust surface is spread across product pages, docs, status tools, and ecosystem listings.
