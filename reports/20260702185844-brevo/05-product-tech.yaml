    - App fires order, password, or status event
    - Transactional Email API / SMTP
    - Template variables, messageId tracking, and webhook callbacks are documented
    - Public docs do not disclose shared-vs-dedicated sending pools or deliverability methodology
  - - Run a WhatsApp campaign
    - Team activates WhatsApp, approves templates, schedules send
    - WhatsApp Campaigns API
    - Campaign creation, scheduling, and performance retrieval are public
