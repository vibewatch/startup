tables:
- id: TE001
  title: Product Module / Asset Matrix
  columns:
  - Module
  - Primary user / job
  - Public maturity / status
  - Differentiation
  - Diligence gap
  rows:
  - - Email marketing
    - Marketer sending promotional or lifecycle email
    - GA / heavily marketed
    - AI-assisted content plus claimed 99% deliverability inside the same suite as SMS/WhatsApp
    - No independent inbox-placement or SLA evidence in public materials
  - - Transactional email / API
    - Developer or ops team sending password resets, order updates, receipts
    - GA / high-throughput docs
    - Unified API + SMTP with templating, params, and messageId tracking
    - No public detail on underlying MTA topology, dedicated IP model, or region-specific SLAs
  - - SMS marketing
    - Marketer running text campaigns and triggered alerts
    - GA / publicly priced
    - Runs from the same platform and workflow surface as email and WhatsApp
    - Country routing, sender types, and cost granularity are not fully public
  - - WhatsApp messaging + campaigns
    - Ops or marketer using approved WhatsApp templates and campaigns
    - GA after activation and onboarding
    - Brevo spans transactional templates and scheduled campaign APIs with stats
    - Requires WhatsApp Business setup and template approval outside Brevo control
  - - Signup forms
    - Growth team collecting subscriber or lead data
    - GA / no-code positioning
    - Embeddable forms tied directly into lists, segments, and automation
    - Advanced popup economics and entitlements are not cleanly disclosed publicly
  - - Landing pages
    - Growth team creating conversion surfaces without CMS engineering
    - GA but plan-gated by review evidence
    - No-code page creation keeps acquisition inside the same suite
    - Third-party review says Starter omits landing pages; official plan matrix is not explicit enough
  - - Marketing automation
    - Lifecycle marketer orchestrating cross-channel journeys
    - GA / workflow-editor centric
    - Cross-channel journeys plus triggers tied to contacts, behavior, and commerce events
    - Public docs do not quantify workflow latency or execution SLAs
  - - Sales CRM
    - Sales rep or founder tracking deals, meetings, and pipeline stage
    - GA / lighter CRM surface
    - Deals, meetings, associations, and webhook events coexist with marketing contacts
    - Breadth looks smaller than dedicated enterprise CRMs; no public role/permission depth detail
  - - AI + MCP layer
    - Marketer or operator using AI to draft, query, or run account tasks
    - Early-GA / fast-moving 2026 surface
    - Assistant-driven campaign and CRM actions extend Brevo beyond copy generation
    - Security scope, auditability, and real adoption are not independently validated
  - - SDK and integration ecosystem
    - Developer connecting Brevo into broader SaaS workflows
    - Active in 2026 but version-fragmented
    - Official SDKs, OpenAPI, webhooks, Zapier, WordPress, and 150+ integrations lower adoption friction
    - Migration burden is real because language maturity and version cadence are uneven
  notes: 'Rows distinguish public module existence from maturity: “GA” means clearly marketed or documented, not independently benchmarked. Diligence gaps highlight where public evidence is incomplete or contradictory.'
