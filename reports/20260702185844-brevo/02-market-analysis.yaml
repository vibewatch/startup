- id: TM003
  title: Segment / buyer map
  columns:
  - segment
  - buyer
  - daily user
  - budget owner
  - current substitute
  - adoption trigger
  rows:
  - - Founder-led micro SMB
    - Founder or owner-operator
    - Generalist marketer or founder
    - Operating budget
    - Spreadsheets, basic newsletter tool
    - Need a simple low-cost platform with email plus light CRM
  - - Ecommerce SMB
    - Growth or lifecycle lead
    - Email and retention marketer
    - Marketing or growth budget
    - Mailchimp, Klaviyo, store-native tools
    - Need segmentation, automation, and SMS/WhatsApp around purchase journeys
  - - B2B services or SaaS SMB
    - Founder, marketing lead, or sales lead
    - Marketing generalist plus sales coordinator
    - Combined sales and marketing budget
    - HubSpot starter stack, manual pipeline tracking
    - Need campaigns and lightweight pipeline visibility in one system
  - - Midmarket digital business
    - Demand-gen or revops lead
    - Lifecycle, CRM, and operations users
    - Marketing operations or revops budget
    - Broader CRM or automation suite
    - Need better workflows, reporting, and team coordination without enterprise complexity
  - - Europe-facing compliance-sensitive sender
    - Marketing lead with legal or privacy stakeholder
    - CRM/email operator plus compliance reviewer
    - Marketing budget with oversight
    - Status quo plus internal policy controls
    - Need GDPR-comfortable vendor narrative and explicit consent tooling
  - - Channel-expanding sender
    - Growth or CX lead
    - Campaign manager and support or messaging operator
    - Growth or customer engagement budget
    - Standalone SMS or WhatsApp vendor
    - Need to add messaging channels without rebuilding the whole stack
  notes: Rows reflect representative buying motions rather than a census of all customers; package references are analytical substitutes, not competitor scorecards.
