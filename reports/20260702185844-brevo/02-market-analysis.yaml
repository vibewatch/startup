- id: drivers-and-constraints
  title: Growth drivers, omnichannel expansion, and adoption constraints
  body: 'The strongest demand drivers are easy to state and harder to monetize cleanly. AI is now table stakes in marketing workflows, cloud deployment keeps lowering operating friction for smaller teams, and customer engagement is moving toward bundled journeys across email, SMS, sales follow-up, and messaging. Those trends fit Brevo''s multi-surface product story. But constraints are equally structural. Inbox providers now enforce authentication and spam thresholds more aggressively, which turns deliverability into a capability that smaller senders may need help managing. Apple''s privacy protections reduce the usefulness of open-rate-led optimization, pushing vendors toward deeper analytics and more trustworthy first-party workflows. Direct marketing consent rules still raise list-building friction, especially for Europe-facing teams. And omnichannel expansion is not free: WhatsApp pricing is message-based by category, so each incremental channel can improve engagement while also adding
    variable costs, governance complexity, and support burden.'
  claimRefs:
  - CM027
  - CM028
  - CM029
  - CM030
