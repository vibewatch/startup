- id: preserved-gaps
  title: What public evidence still cannot isolate
  body: 'The biggest diligence risk is false precision. Public sources are good enough to show that Brevo sits in a real and growing market, that SMB adoption is broadening, and that Europe-specific compliance posture matters. They are not good enough to isolate Brevo''s true SAM or SOM. Public evidence does not separate Brevo revenue or customers by email versus automation versus CRM versus messaging, does not reveal its Europe share or free-to-paid conversion by segment, and does not quantify how much deliverability or privacy changes affect retention and attach rates. That means the chapter should be used to bound market narratives, not to overfit one precise multiple-ready TAM. The next diligence step is management evidence: region-by-segment revenue bridges, cohort conversion, attach-rate by channel, and procurement or churn evidence linked to compliance and deliverability complexity.'
  claimRefs:
  - CM013
  - CM020
  - CM039
  - CM040
  - CM041
  - CM042
  - CM044
tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - status-quo substitute
  - why it matters for Brevo
  rows:
  - - Core email marketing SaaS
    - Campaign creation, list management, segmentation, templates, deliverability tools, analytics
    - Paid media, agency services, commerce GMV, internal labor
    - Newsletter plugins, native store email features, spreadsheets
    - Most direct revenue pool for Brevo email subscriptions and send-based usage
  - - Marketing automation
    - Journey orchestration, triggered workflows, lead nurturing, scoring, personalization
    - Broad CDP implementation projects and custom services
    - Manual workflows, basic autoresponders, single-channel tools
    - Explains why Brevo competes for workflow budgets beyond simple newsletters
  - - SMB CRM / sales tooling adjacency
    - Pipelines, contact management, tasking, sales follow-up, lightweight revops
    - Full enterprise CRM transformation and SI-heavy deployments
    - Standalone CRM, spreadsheets, inbox-led selling
    - Critical for Brevo because its sales software broadens buyer utility inside smaller teams
  - - Omnichannel engagement
    - SMS, WhatsApp, and cross-channel orchestration linked to customer journeys
    - Telecom infrastructure economics and bespoke service operations
    - Channel-specific SMS tools, WhatsApp BSPs, social inbox products
    - Expands Brevo addressability but introduces message-category economics and compliance work
  - - Broad customer engagement / CRM umbrella
    - Customer engagement suites, service, analytics, and integrated customer operations
    - Unrelated enterprise applications and offline customer-service labor
    - Enterprise CRM or CX suites
    - Useful as an outer boundary, but too broad to treat as Brevo's practical core TAM
  - - Status quo / internal build
    - In-house scripts, spreadsheets, mailbox tools, commerce defaults
    - Third-party software subscription when no external platform is bought
    - Do nothing, keep existing stack, rely on channel dashboards
    - Sets the real adoption hurdle for many SMBs and price-sensitive buyers
  notes: Boundary separates Brevo-relevant software revenue from media, services, and operational spend; row labels are analytical synthesis grounded in cited category definitions and vendor positioning.
