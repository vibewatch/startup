  evidenceGaps:
  - type: missing-source
    severity: material
    topic: europe-sam
    missingEvidence: A public Europe-only software-spend slice for email marketing, automation, and SMB CRM that matches Brevo's practical product scope.
    whyItMatters: Without a Europe-specific spend bridge, public TAM figures are too broad for a clean Brevo SAM or regional penetration model.
    diligencePath: Request management's regional revenue bridge and any third-party spend studies segmented by European SMB size bands and channel mix.
    relatedQuestionRefs:
    - QM009
    - QM028
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: brevo-product-mix
    missingEvidence: Revenue or customer splits across Brevo email, automation, sales CRM, SMS, and WhatsApp products.
    whyItMatters: Product-family mix determines which external market lens is actually relevant and whether margins resemble email software or broader engagement tooling.
    diligencePath: Request product-family ARR, attach-rate, and gross-margin disclosure by geography and customer size.
