callouts:
- calloutType: insight
  title: Boundary discipline matters more than big-TAM rhetoric
  body: Brevo can be mapped to email marketing, automation, customer engagement, or CRM, but those lenses should not be swapped interchangeably in valuation work.
  claimRefs:
  - CM013
  - CM014
  - CM042
- calloutType: strength
  title: All-in-one and low-entry positioning fit fragmented SMB demand
  body: Brevo's combination of email, automation, sales tooling, and low starting prices creates a credible wedge for smaller teams trying to avoid suite sprawl.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM038
- calloutType: risk
  title: Distribution is becoming an operations and compliance function
  body: Deliverability enforcement, privacy protections, and consent rules mean category growth does not automatically translate into easy share capture or low support costs.
  claimRefs:
  - CM034
  - CM035
  - CM036
  - CM037
  - CM043
- calloutType: recommendation
  title: Ask management for the bridges public data cannot provide
  body: Before using TAM multiples, request region and segment revenue bridges, free-to-paid conversion, channel attach rates, and churn or retention evidence tied to compliance and deliverability shifts.
  claimRefs:
  - CM039
  - CM040
  - CM044
