- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - market implication
  - diligence ask
  rows:
  - - AI-assisted campaign creation and personalization
    - Driver
    - Current
    - Raises software value if vendors can turn automation into measurable productivity and revenue lift
    - Request paid AI feature adoption and price realization
  - - Cloud and SME adoption
    - Driver
    - Current to medium term
    - Lowers implementation friction and broadens the reachable SMB base
    - Measure Brevo conversion by region and company size
  - - Omnichannel expansion into SMS and WhatsApp
    - Driver and constraint
    - Current
    - Broadens scope beyond email but introduces category-specific economics and governance
    - Request channel attach rates, gross margin, and churn by channel mix
  - - All-in-one email plus CRM positioning
    - Driver
    - Current
    - Can reduce tool sprawl for smaller teams and create a land-and-expand motion
    - Validate win rates versus point tools and entry-level CRM substitutes
  - - Authentication and deliverability enforcement
    - Constraint
    - Current
    - Operational burden rises as Gmail and Yahoo harden requirements for bulk senders
    - Review deliverability tooling, customer support load, and onboarding friction
  - - Mail privacy and tracking loss
    - Constraint
    - Persistent
    - Open-rate deterioration pushes buyers toward deeper analytics and first-party measurement
    - Request replacement metrics and product usage after privacy changes
  - - Consent and direct marketing rules
    - Constraint
    - Persistent
    - List growth, re-engagement, and regional campaigns carry ongoing compliance friction
    - Assess consent tooling, legal reviews, and regional policy exceptions
  - - Crowded substitute set and price ladders
    - Constraint
    - Persistent
    - Low-end entrants and broader suites pressure both pricing and retention
    - Review free-to-paid conversion, ARPU, and churn against substitute categories
  notes: Timing, implication, and diligence asks are analytical synthesis; they translate source evidence into adoption and valuation consequences rather than reporting vendor claims verbatim.
