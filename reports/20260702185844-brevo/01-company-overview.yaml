  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, board-seat allocation, shareholder agreements, and voting-control documents.
    whyItMatters: Public leadership pages and registry records do not reveal who actually sits on the board or what rights new investors hold.
    diligencePath: Request the latest board deck, shareholder agreement, bylaws, and cap table from management.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Official post-money valuation memo or financing deck for the December 2025 round.
    whyItMatters: The market narrative says “unicorn,” while trade press later cited roughly €1.0B / $1.1B; exact valuation affects ownership dilution and return underwriting.
    diligencePath: Obtain the signed financing term sheet, valuation bridge, and post-close capitalization table.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: An exact current employee count by function and geography.
    whyItMatters: Official pages only say 1,000+ employees, while third-party directories lag with wide ranges; workforce scale matters for burn, productivity, and integration capacity.
    diligencePath: Request the latest HR headcount roll-forward and office-level org breakdown.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO001
  - type: access-blocked
    severity: minor
    topic: litigation-review
    missingEvidence: Court-docket, regulator, and sanctions sweeps beyond the public company, registry, and media sources reviewed here.
    whyItMatters: Absence of a lawsuit in this source set is not the same as a completed legal diligence review.
    diligencePath: Run dedicated litigation, sanctions, and regulator database searches across France, the EU, India, Canada, and the U.S. before investment committee.
    relatedQuestionRefs:
    - QO023
  - type: conflicting-data
    severity: material
    topic: financial-scale
    missingEvidence: Management reconciliation for the 2024 ARR figure and its reported currency denomination.
    whyItMatters: Official Brevo materials use both $179M and €179M for what appears to be the same 2024 ARR reference, which can materially alter growth and valuation framing.
    diligencePath: Request the audited or board-approved 2024 ARR bridge with reporting currency and FX policy.
    relatedQuestionRefs:
    - QO013
    - QO024
    relatedTableRefs:
    - TO001
