company:
  name: Brevo
chapter:
  number: 1
  title: Company Overview
  summary: 'Brevo is the Paris-headquartered customer-engagement platform formerly known as Sendinblue, with a public timeline that blends a 2007 French legal registration and a 2012 operating founding story under founder-CEO Armand Thiberge. Official and investor materials show a 2023 rebrand, 600,000+ customers across 180 countries, 1,000+ employees, and a December 2025 €500 million financing that made the company a unicorn. Public governance disclosure remains limited: management and employees became the largest shareholder after the 2025 deal, French registry records show a separate legal president and a 2023 capital-impairment continuation filing, and adverse public evidence is concentrated in review-site product complaints rather than disclosed litigation.'
sections:
- id: identity-founding-and-platform
  title: Identity, founding timeline, and platform scope
  body: Brevo describes itself as a customer platform for sustainable growth spanning email, SMS, WhatsApp, chat, marketing automation, CRM, and related sales workflows. The current product and pricing pages show a ladder from free and starter plans to multi-seat professional plans and a custom enterprise tier, which indicates a subscription-led SaaS model with add-on usage components such as SMS credits, dedicated IP, and advanced sales seats. The official footprint is clearly Paris-led today, but the founding timeline needs nuance rather than a single date. French registry aggregators list SENDINBLUE as registered in Paris in May 2007, while Brevo’s own about and rebrand materials say Armand Thiberge founded the operating business in 2012 in India and France and later grew it from an email newsletter tool into a fuller CRM suite. That 2012 story is also consistent with the company’s 2023 “after a decade” rebrand narrative. On the record reviewed for this chapter, Armand Thiberge remains
    the public founder-CEO and no fetched source supports the prompt’s suggested CEO name Isabelle Gallo. The cleanest synthesis is that the legal vehicle predates the operational scaling story, and the brand’s core identity today is the broader Brevo platform rather than the original Sendinblue email-only positioning.
