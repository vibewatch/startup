- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - 2028 ARR only €250-€280M; public SaaS stays compressed; limited evidence of cleaner retention or margin.
    - 2.8x-3.5x exit multiple implies ~€0.7-€1.0B exit value and ~0.6x-0.9x gross MOIC from ~€1.1B entry.
    - Down-round, preference overhang, weak CRM upsell, integration drag.
    - Material downside case that cannot be dismissed at the current mark.
  - - Base
    - 2028 ARR ~€300-€330M; EBITDA remains respectable; Brevo holds a moderate premium to broad CRM comps.
    - 3.6x-4.4x exit multiple implies ~€1.1-€1.5B exit value and ~1.0x-1.3x gross MOIC.
    - Comp multiple stays public-like and disclosure never materially improves.
    - Highest-likelihood zone on current public evidence.
  - - Bull
    - 2028 ARR ~€380-€420M; U.S. and mid-market continue to lead; AI and M&A expand wallet share without margin damage.
    - 4.8x-6.0x exit multiple implies ~€1.8-€2.5B exit value and ~1.7x-2.3x gross MOIC.
    - Execution must stay unusually clean across multiple vectors.
    - Plausible but already demanding for a fresh entry today.
  notes: Ranges are gross, pre-dilution and pre-preference outcomes because public evidence does not disclose the capital structure needed to translate enterprise value into clean common-equity returns.
