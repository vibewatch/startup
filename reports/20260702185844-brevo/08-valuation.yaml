- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Growth proof
    - '>€200M ARR and double-digit EBITDA suggest real scale, not story stock.'
    - Exact ARR exit, NRR, and gross margin remain undisclosed, so quality may be overstated.
    - Audited 2026 ARR bridge, margin, and retention disclosure.
  - - Product breadth
    - Brevo has clearly moved beyond newsletters into broader CRM, messaging, and AI tooling.
    - Review sources still flag CRM, AI, and integration limitations that could cap expansion revenue.
    - Product attach-rate and enterprise cohort data.
  - - Market position
    - U.S. and mid-market momentum justify some premium to slower public peers.
    - A private investor is still paying above public SaaS multiples for thinner disclosure.
    - Proof that U.S. mix and mid-market upsell keep compounding.
  - - Strategic option value
    - 11 acquisitions plus AI investment can widen the platform and raise strategic value.
    - Integration and commercialization risk can just as easily destroy premium multiple support.
    - Acquisition KPI pack and AI monetization data.
  - - Comparable context
    - Mailchimp and public CRM software show the category can support meaningful value creation.
    - Mailchimp was a 2021 strategic take-private; 2026 public comps argue for stricter entry discipline.
    - A cheaper entry or evidence that Brevo deserves Klaviyo-plus multiples.
  notes: The anti-thesis is mostly about price, disclosure, and durability—not about a near-term collapse in company quality.
