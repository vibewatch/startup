- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Revenue / ARR anchor
  - Valuation or multiple
  - Relevance to Brevo
  - Limitation
  rows:
  - - Brevo current disclosed band
    - '>€200M 2025 ARR guidance'
    - ~€1.0-€1.1B implied equity value; ~5.0x-5.5x ARR
    - Closest current mark for underwriting the company today.
    - Exact post-money and round mix remain undisclosed.
  - - HubSpot
    - 2025 revenue $3.1B
    - July 2026 market cap $9.85B; ~3.2x revenue
    - Public mid-market CRM benchmark with broad product scope.
    - More mature, more disclosed, and operationally much larger than Brevo.
  - - Klaviyo
    - 2025 revenue $1.234B
    - July 2026 market cap $5.05B; ~4.1x revenue
    - Scaled marketing-automation comp with stronger growth than broad CRM.
    - More ecommerce-centered and still better disclosed than Brevo.
  - - Salesforce
    - Fiscal 2026 revenue $41.5B
    - July 2026 market cap $136.51B; ~3.3x revenue
    - Shows where broad CRM software trades in public markets.
    - Far larger and more diversified than Brevo’s SMB-led platform.
  - - Intuit / Mailchimp 2021 take-private
    - FY2022 filing shows $762M revenue from acquisition date
    - $12.0B consideration; directional low-teens strategic multiple depending on annualization
    - Useful ceiling reference for scaled SMB marketing assets.
    - Peak-cycle strategic M&A precedent, not a clean 2026 public-market comp.
  notes: 'The set is intentionally a sample, not an exhaustive universe: it mixes direct public comps with one strategic precedent because Brevo is private and the exact post-money was not publicly disclosed.'
  enumerationScope:
    coverage: sample
    basis: Selected public CRM and marketing-automation references plus one strategic M&A precedent that bracket Brevo’s current product scope, price point, and disclosure profile.
