- id: scenario-return-logic-and-recommendation
  title: Scenario Return Logic and Recommendation
  body: Scenario math is the reason the call cannot be a buy at today’s mark. A bear path—ARR only around €250-€280 million by 2028 and exit multiples closer to 2.8x-3.5x—yields roughly €0.7-€1.0 billion of exit value, or about 0.6x-0.9x gross MOIC from a €1.1 billion entry. A base path—roughly €300-€330 million ARR and 3.6x-4.4x—gets to only about €1.1-€1.5 billion, which is basically money-good to modestly positive before dilution. Only the bull path—roughly €380-€420 million ARR with 4.8x-6.0x exit multiples—pushes toward about €1.8-€2.5 billion and 1.7x-2.3x gross MOIC. That is not terrible upside, but it is upside that already assumes U.S. expansion, up-market CRM execution, acquisition integration, and AI commercialization all continue to work. In other words, Brevo can be a strong company and still be an unattractive new entry at the current price. The supportable recommendation is therefore Track / Research-More with medium confidence, high risk, and a stretched valuation stance
    for fresh capital.
