- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR miss
    - 2026 ARR exits below ~€215M
    - The current 5x+ ARR entry stops looking like premium growth and starts looking like overpayment.
    - Re-cut to bear-case multiples immediately.
  - - Financing reset
    - Any down-round, heavy preferences, or clearly seller-friendly primary/secondary mix
    - Common-equity return can be impaired even if revenue keeps growing.
    - Move posture from track to avoid unless structure is unusually protective.
  - - U.S. / mid-market slowdown
    - U.S. no longer drives outsized new revenue or mid-market stops growing faster than core
    - The premium-multiple case loses its strongest acceleration evidence.
    - Collapse base-to-bull assumptions back toward public-comp discipline.
  - - Platform monetization miss
    - M&A, AI, or CRM expansion fails to produce attach-rate and wallet-share gains
    - Product-breadth narrative no longer deserves a premium to simpler email peers.
    - Remove the bull case from underwriting.
  - - Product-friction persistence
    - Independent reviews continue to flag CRM, AI, WhatsApp, or integration shortcomings at scale
    - Lower NRR and weaker enterprise upsell become more likely.
    - Demand customer-cohort evidence before proceeding further.
  notes: These triggers are intentionally measurable so that the valuation stance can be revised before a new round, tender, or secondary purchase is approved.
  claimRefs:
  - CV019
  - CV020
  - CV050
  - CV051
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Round mechanics
    - Exact December 2025 post-money, primary vs. secondary mix, and investor check sizes
    - The current valuation band is inferred rather than directly disclosed.
    - Investor materials, board deck, and financing counsel review.
  - - Capital structure
    - Preferred terms, liquidation stack, option pool, and share count
    - Gross enterprise-value scenarios do not equal common-equity returns without this bridge.
    - Cap table export plus legal term sheet review.
  - - 2026 operating quality
    - ARR exit, gross margin, NRR, churn, and segment mix
    - These determine whether a 5x+ ARR private mark is fair or stretched.
    - Finance diligence and cohort pack.
  - - Expansion economics
    - U.S. CAC, mid-market conversion, CRM attach rates, and AI monetization
    - The bull case assumes breadth converts into efficient, durable revenue.
    - Growth analytics review and customer reference calls.
  - - M&A integration
    - Acquisition payback, product adoption, and integration milestones
    - Brevo is using M&A as a major strategy lever, so integration risk is valuation risk.
    - Product/ops diligence and acquired-business KPI review.
  notes: These asks are targeted only at evidence that changes underwriting outcomes; they are not generic diligence wish-lists.
