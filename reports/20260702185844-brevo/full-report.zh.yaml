            body: >-
              情景测算是今天不能给出买入判断的原因。熊市路径——2028 年 ARR 仅约 €250-€280M，退出倍数更接近 2.8x-3.5x——对应约 €0.7-€1.0B 的退出价值；按 €1.1B 入场，毛
              MOIC 约 0.6x-0.9x。基准路径——约 €300-€330M ARR、3.6x-4.4x——也只到约 €1.1-€1.5B，摊薄前基本是保本到小幅正回报。只有牛市路径——约 €380-€420M
              ARR，退出倍数 4.8x-6.0x——才推向约 €1.8-€2.5B 和 1.7x-2.3x 毛 MOIC。这个上行不算差，但已经假设美国扩张、上行进入中端 CRM、收购整合和 AI
              商业化都继续奏效。换句话说，Brevo 可以是一家强公司，同时在当前价格下仍不是有吸引力的新进投资。可支持的建议因此是跟踪 / 继续研究，置信度中等、风险高，对新资金而言估值偏紧。
