  - id: TP004
    title: GDPR / 数据主权与生态对比
    columns:
      - 供应商
      - 公开隐私 / 数据驻留口径
      - 合作伙伴 / 应用生态证据
      - 可能形成切换成本的资产
      - 对 Brevo 的含义
    rows:
      - - Brevo
        - GDPR 页面，加 ISO 背书的安全页面和欧洲优先定位
        - 代理伙伴计划、服务伙伴目录、Zapier 连接器
        - 同意记录、自动化、CRM 对象、发件域名、伙伴打法手册
        - 不用承担完整套件开销，也能拿下重视隐私的 SMB
      - - Mailchimp
        - 基于 SCC 的 EU 到美国传输条款
        - 覆盖商店、会计、社交等的集成目录
        - 列表、模板、受众分群、已连接商店应用
        - 熟悉的标杆，但主权差异化较弱
      - - HubSpot
        - SCC / UK 附录隐私条款；区域托管是公开优先事项；SOC2/ISO 控制
        - 应用市场加多个伙伴计划
        - 联系人、内容、报表、工作流、席位、咨询依赖
        - 大生态同时抬高获客杠杆和切换摩擦
      - - Klaviyo
        - 安全 / GDPR 姿态明确，但品牌叙事由美国主导
        - 350+ 应用和全球代理 / 技术伙伴网络
        - 零售数据模型、渠道编排、伙伴执行经验
        - 面向电商买家的强专科生态
      - - ActiveCampaign
        - DPA、SCC、子处理方页面、GDPR/SOC2/HIPAA 声明
        - 1000+ 应用和伙伴打法
        - 高级自动化、电商集成、用户权限
        - 功能深度高，可能把成熟自动化团队从 Brevo 拉走
      - - Mailjet
        - 明确列出德国和比利时数据中心位置
        - 生态小于套件龙头
        - 域名、发送声誉、模板、到达率配置
        - EU 信任叙事强，但广度窄于 Brevo
      - - Mailgun
        - 企业合规声明和 API 控制
        - 开发者工具和到达率生态
