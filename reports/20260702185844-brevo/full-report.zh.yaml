  - id: TP001
    title: 竞品画像表
    columns:
      - 厂商
      - 品类
      - 主要买家
      - 产品范围
      - 公开入门点
      - 数据 / 信任姿态
      - 相对 Brevo 的主要局限
    rows:
      - - Brevo
        - 全渠道中小企业 CRM / 营销平台
        - 想要一个打包方案的中小企业和偏小中端团队
        - 电子邮件、自动化、SMS、WhatsApp、交易型消息、CDP、CRM
        - 免费；Starter $9/mo；Standard $18/mo
        - Brevo 主打 GDPR 支持和 ISO 背书的安全实践
        - 生态和 CRM 深度不如大型套件
      - - Mailchimp / Intuit
        - 电子邮件营销和自动化套件
        - 成长期中小企业，以及创作者 / 电商运营者
        - 电子邮件、自动化、表单、分析、集成
        - 以免费试用切入；按联系人定价，10K+ 联系人享折扣
        - 欧盟数据通过 SCCs 转移至美国
        - CRM 和交易型能力的深度不如 Brevo 套装清晰
      - - HubSpot
        - CRM 主导的增长套件
        - 正向完整 GTM 系统扩张的中小企业
        - 营销、CRM、服务、内容、分析、AI
        - Starter 按席位定价；联系人层级和发送上限会拉高支出
        - SOC 2 / ISO 基础设施、静态 AES-256 加密、基于 SCC 的转移
        - 对小团队来说复杂度和合同摩擦更高
      - - Klaviyo
        - B2C CRM / 全渠道电商平台
        - 零售和电商品牌
        - 电子邮件、SMS、RCS、移动应用营销、WhatsApp、社交
        - 免费使用层级；企业支持 $500/mo 起
        - 具备安全和 GDPR 姿态，但运营模式以美国为主
        - 比通用中小企业 CRM 更偏零售专用
      - - ActiveCampaign
        - 自动化更重的中小企业营销平台
        - 需要更深编排和电商逻辑的中小企业
        - 电子邮件、自动化、CRM、消息、集成
        - 从 Starter 到 Enterprise 的分层套餐
        - 声称支持 DPA、SCCs、GDPR/SOC2/HIPAA 合规
        - 层级复杂度和配置负担高于 Brevo 的入门动作
      - - Mailjet
        - 电子邮件营销和交易型发送工具
        - 优先看重电子邮件投递率、营销需求较轻的团队
        - 营销活动电子邮件、SMTP、编辑器、基础自动化
        - 免费；Starter $9/mo
        - 数据存储在法兰克福和比利时
        - CRM 和全渠道范围更窄
      - - Mailgun
        - 交易型电子邮件 API / 投递率层
        - 开发者和企业发送方
        - 电子邮件 API、SMTP 中继、验证、投递率工具
        - 首月免费；Foundation $35/mo
        - 企业合规姿态较重，但以 API 为先
        - 没有中小企业 CRM 或营销活动运营层
      - - CleverReach
        - 以电子报为中心的电子邮件营销工具
        - 欧洲中小企业发送方
        - 电子邮件营销活动、电子报、基础营销工作流
        - 免费版；评测来源称起价约 $10/mo
        - 公开评测来源称其总部在德国，但官方页面抓取受阻
        - 关于 CRM 或全渠道广度的公开证据较少
      - - Zoho Campaigns / Marketing Automation
        - 低成本套件替代品
        - 已经倾向 Zoho 工具栈的中小企业
        - 电子邮件、旅程、表单、电商和基于账户的自动化
        - 免费覆盖最多 2K 联系人 / 每月 6K 封邮件
        - 隐私材料提供 GDPR DPA 路径和 EEA 式权利
        - 客户愿意留在更宽的 Zoho 工具栈内时最合适
      - - Salesforce Starter Suite
        - 面向小企业的 AI + CRM 套装
        - 想让 CRM 掌控工作流的中小企业
        - CRM、销售流程、电子邮件营销、服务和商务挂钩
        - $25/user/mo 起，并包含交易费表述
        - Hyperforce 支持欧盟数据驻留选项
        - 对只需要消息和轻量 CRM 的小团队来说过重
    notes: 各行比较截至 2026-07-02 的公开入门定位；私营公司的实际成交价和谈判折扣通常不公开。
