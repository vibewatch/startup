      - number: '6.3'
        title: 评论、留存代理指标与渠道动态
        blocks:
          - type: paragraph
            body: >-
              对私有欧洲 CRM 套件而言，Brevo 的评论覆盖异常密集；这很重要，因为评论语料是产品触达广泛自助市场的 最清晰独立证明之一。Brevo 自己的定价页引用 2,500+ 条 G2 评论、3,300+ 条
              Capterra 评论和 150+ 条 Gartner 评论，GetApp 则独立列出 3,485 条已验证评论。好评模式一致：评论者喜欢送达能力、
              低摩擦定价、直观的活动管理，以及从免费计划起步的能力。负面模式也一致：CRM 深度、更广集成、 支持响应、WhatsApp 复杂度和部分高层级定价摩擦反复出现。WordPress 页面提供了更尖锐的反向证据。
              插件平均评分只有 4.1/5，2025-2026 年评论 / 支持帖提到 $499 弹窗门槛、不想要的 WonderPush 脚本、 PHP 错误、同意 / 隐私问题，以及确认邮件问题。Brevo
              的伙伴动作部分抵消了这一点，因为代理商和联盟伙伴 有理由引入并实施产品：代理商可以赚取经常性收入分成并获得目录曝光，联盟伙伴则瞄准博主和出版方。
              结果是一种渠道组合：它可以降低获客成本并扩大触达，但也意味着部分客户体验由插件和伙伴中介， 而不是完全由 Brevo 自身决定。
