            body: >-
              2025 年 12 月融资改善了 Brevo 的战略选择，但也抬高了交付门槛。General Atlantic 和 Oakley Capital 加入股东名单，Bridgepoint 继续参与，Partech
              退出；管理层和员工成为最大股东，公司同时宣布达到独角兽状态、2025 年 ARR 超过 €200M、EBITDA 利润率为两位数、投入 AI、加速美国、并强化 M&A
              策略。这些披露构成典型的资方支持执行场景：资本足够充裕，可以同时尝试很多事；但 AI、美国扩张和连续收购叠加，留给整合错误或产品蔓延的空间很小。公开路线图已经通过
              CDP、移动推送、忠诚度和此前收购显示范围在变宽。Brevo 也披露了高管角色，产品投资强度看起来健康；但公开材料仍在董事会监督、投资人权利、详细现金效率和模块级留存上留下大洞。这样很难区分，Brevo
              究竟在形成可持续平台杠杆，还是只是在追赶一个不断变宽的品类。
