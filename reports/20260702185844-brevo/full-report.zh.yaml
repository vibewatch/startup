  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 市场含义
      - 尽调问题
    rows:
      - - AI 辅助的营销活动创建与个性化
        - 驱动因素
        - 当前
        - 厂商若能把自动化转成可衡量的生产率和收入提升，软件价值会抬升
        - 索取付费 AI 功能采用率和价格实现情况
      - - 云服务与中小企业采用
        - 驱动因素
        - 当前到中期
        - 降低实施摩擦，扩大可触达的中小企业基数
        - 按地区和公司规模衡量 Brevo 转化
      - - 向 SMS 和 WhatsApp 做全渠道扩展
        - 驱动因素与约束
        - 当前
        - 产品范围越过电子邮件，但引入各渠道特有的经济性和治理要求
        - 索取按渠道组合拆分的渠道附加率、毛利率和流失率
      - - 电子邮件加 CRM 的一体化定位
        - 驱动因素
        - 当前
        - 可为小团队减少工具分散，并形成先落地再扩张的动作
        - 验证相对单点工具和入门级 CRM 替代品的胜率
      - - 身份验证和投递率执行
        - 约束
        - 当前
        - Gmail 和 Yahoo 收紧批量发送方要求后，运营负担上升
        - 复核投递率工具、客户支持负载和上手摩擦
      - - 邮件隐私与跟踪损失
        - 约束
        - 持续
        - 打开率退化会把买家推向更深的分析和第一方测量
        - 索取隐私变化后的替代指标和产品使用情况
      - - 同意管理和直接营销规则
        - 约束
        - 持续
        - 名单增长、再互动和区域营销活动持续带来合规摩擦
        - 评估同意管理工具、法律审核和区域政策例外
      - - 拥挤的替代品集合和价格阶梯
        - 约束
        - 持续
        - 低端进入者和更宽的套件同时挤压定价和留存
        - 对照替代品类别，复核免费转付费、ARPU 和流失率
    notes: 时间、含义和尽调问题都是分析归纳；它们把来源证据转成采用和估值后果，而不是逐字转述厂商说法。
