      - number: '2.3'
        title: 买方、预算负责人和欧洲 SMB 准备度
        blocks:
          - type: paragraph
            body: >-
              Brevo 的可能买方是创始人、业主经营者、增长负责人、生命周期营销人员，或销售营销通才。 他们想少用工具、更快见效，而不是由独立企业采购部门为单一职能购买品类领先的点状方案。
              日常用户是邮件营销人员、电商运营、客户生命周期经理，以及收入或销售运营人员，他们需要在一个地方 管理列表、活动、自动化、销售管道和基础协同。欧洲环境很重要，因为 Brevo 明确营销 GDPR 合规；
              Eurostat 同时显示，欧盟企业数字化正在推进但尚未完成：多数 SME 现在已有基础数字强度， 约半数使用付费云服务，只有少数使用云的企业报告使用 CRM。这个组合支持 Brevo 作为电子表格或
              独立邮件工具务实升级路径的定位，也意味着实际 SAM 受工作流成熟度和为类 CRM 行为付费的意愿限制， 而不只是由欧洲 SME 的原始数量决定。
