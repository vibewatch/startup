  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价信号
        blocks:
          - type: paragraph
            body: >-
              Brevo 的公开收入模式比低成本邮件软件更宽，但变现机制只部分透明。官方产品页显示一个平台横跨 营销活动、交易型消息、销售软件、客户数据平台和忠诚度工作流；从 Sendinblue 更名为 Brevo
              时，公司也明确把它描述为转向更完整的 CRM 套件。公开定价足以建立免费增值到企业的阶梯： Free、Starter、Standard、Professional 和 Enterprise，公开入口价格分别为
              $0、$9、$18、$499 和定制企业合同。PCMag 补充了重要细节：按量扩展的层级、SMS/WhatsApp 点数额外收费，以及付费 落地页扩展。因此，Brevo
              不是单一价格订阅业务，而是自助订阅、用量挂钩消息和可能的议价企业包 混合体。客户数量证据同样重要：官网称 500,000+ 客户，多篇 2025 年末文章称 600,000+。 与披露的 €200 million
              以上 ARR 下限合看，这些数字意味着，头部 SMB 标价本身解释不了这门生意。 公开文件因此支持一条真实的先落地再扩张 SaaS 路径，但这一路径很可能依赖放大的发送量、更高层级合同 和模块交叉销售，而不只是
              Starter 计划邮件简报经济性。
