      - number: '5.3'
        title: 信任、送达能力与可靠性
        blocks:
          - type: paragraph
            body: >-
              Brevo 的信任覆盖面有意义，但比营销宽度薄。公开材料显示了一些基线控制：围绕 ISO 27001 的安全信息、 GDPR/CASL/CCPA 隐私定位、发送方验证和域名认证、OAuth
              scopes、rate-limit 层级、webhook 控制， 以及按主要产品区域分段的一方状态页。公司还声称在营销和交易型表面有 99% 送达率，但公开证据仍主要来自
              公司自己，而非独立审计。独立信号让图景更复杂。IsDown 和 StatusGator 都显示 Brevo 有实时状态监控足迹 和近期事故历史，StatusGator 的用户报告包括邮件发送和
              SMS/账户验证问题，横跨 Brevo 核心工作流。 WordPress 社区评论又增加一条警示：插件使用足够广，已有数百条评论，但 2026 年反馈包括质量投诉和 某些高级功能包装不清。正确解读不是 Brevo
              不可靠；而是 Brevo 已经运营足够多的运转部件——营销活动、 交易型发送、CRM、webhook、插件、AI、WhatsApp——买方应逐模块尽调控制和服务边界，而不能假设整个套件
