  - id: TV005
    title: 推翻投资论点与终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - ARR 未达预期
        - 2026 年末 ARR 低于 ~€215M
        - 当前 5x+ ARR 入场价不再像为高增长付溢价，而像买贵了。
        - 立即改用悲观情景倍数重算。
      - - 融资重置
        - 任何降估值融资、重偏好条款，或明显偏卖方的一级 / 二级混合结构
        - 即便收入继续增长，普通股回报也可能受损。
        - 除非结构保护异常强，否则从跟踪改为回避。
      - - 美国 / 中端市场放缓
        - 美国不再贡献超额新增收入，或中端市场增速不再快于核心业务
        - 高倍数理由失去最强的加速证据。
        - 把基准到乐观情景假设压回公开可比公司的纪律。
      - - 平台变现未达预期
        - M&A、AI 或 CRM 扩张没能带来附加率和钱包份额提升
        - 产品宽度叙事不再配得上相对简单邮件同行的溢价。
        - 从投资测算中移除乐观情景。
      - - 产品摩擦持续存在
        - 独立评价继续指出 CRM、AI、WhatsApp 或集成在规模化使用中的短板
        - NRR 走低、企业客户向上销售变弱的概率上升。
        - 继续推进前必须拿到客户同期群证据。
    notes: 这些触发因素刻意设置成可衡量指标，方便在批准新一轮融资、要约或二级购买前调整估值立场。
    claimRefs:
      - CV019
      - CV020
      - CV050
      - CV051
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 融资机制
        - 2025 年 12 月准确投后估值、一级 / 二级结构，以及投资人出资规模
        - 当前估值区间是推算得出，并非直接披露。
        - 投资人材料、董事会材料和融资律师审阅。
      - - 资本结构
        - 优先股条款、清算顺位、期权池和股数
        - 没有这座桥，总企业价值情景不等于普通股回报。
        - 导出股权结构表，并审阅法律条款清单。
      - - 2026 年经营质量
        - 年末 ARR、毛利率、NRR、流失率和分部结构
        - 这些指标决定 5x+ ARR 的私有市场标记是合理还是偏高。
        - 财务尽调和客户同期群材料包。
      - - 扩张经济性
        - 美国 CAC、中端市场转化、CRM 附加率和 AI 变现
        - 乐观情景假设产品宽度能转成高效且可持续的收入。
        - 增长分析审阅和客户访谈。
      - - M&A 整合
        - 收购回本期、产品采用和整合里程碑
        - Brevo 把 M&A 作为主要战略杠杆，整合风险就是估值风险。
        - 产品 / 运营尽调和被收购业务 KPI 审阅。
    notes: 这些问题只瞄准会改变投资测算结果的证据，不是泛泛的尽调愿望清单。
