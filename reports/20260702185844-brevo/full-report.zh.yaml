        - 已 GA / 无代码定位
        - 可嵌入表单直接接入列表、细分和自动化
        - 高级弹窗的经济性和权益没有在公开口径中讲清
      - - 落地页
        - 不靠 CMS 工程也要搭建转化页面的增长团队
        - 已 GA，但从评论证据看受套餐限制
        - 无代码建页把获客留在同一套件内
        - 第三方评论称 Starter 不含落地页；官方套餐矩阵又不够明确
      - - 营销自动化
        - 编排跨渠道旅程的生命周期营销人员
        - 已 GA / 以工作流编辑器为中心
        - 跨渠道旅程叠加与联系人、行为和电商事件绑定的触发器
        - 公开文档没有量化工作流延迟或执行 SLA
      - - Sales CRM
        - 跟踪交易、会议和 pipeline 阶段的销售代表或创始人
        - 已 GA / 较轻量的 CRM 界面
        - 交易、会议、关联和 webhook 事件与营销联系人共存
        - 广度看起来小于专用企业 CRM；公开材料也没有角色 / 权限深度细节
      - - AI + MCP 层
        - 用 AI 起草、查询或执行账户任务的营销人员或运营人员
        - 早期 GA / 2026 年快速演进的界面
        - 助手驱动的活动和 CRM 动作，把 Brevo 从文案生成延伸出去
        - 安全范围、可审计性和真实采用率没有独立验证
      - - SDK 和集成生态
        - 把 Brevo 接入更广泛 SaaS 工作流的开发者
        - 2026 年仍活跃，但版本碎片化
        - 官方 SDK、OpenAPI、webhook、Zapier、WordPress 和 150+ 集成降低采用摩擦
        - 语言成熟度和版本节奏不均，迁移负担真实存在
    notes: 各行区分公开模块存在与成熟度：“GA”指已清楚营销或形成文档，不代表经过独立基准测试。尽调缺口标出公开证据不完整或互相矛盾之处。
