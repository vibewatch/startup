        - 运营短信活动和触发式提醒的营销人员
        - 已 GA / 公开定价
        - 与邮件和 WhatsApp 共用同一平台和工作流界面
        - 国家路由、发件人类型和成本粒度没有完全公开
      - - WhatsApp 消息 + 活动
        - 使用已批准 WhatsApp 模板和活动的运营或营销人员
        - 激活和开通后已 GA
        - Brevo 覆盖交易模板和定时活动 API，并提供统计
        - 需要在 Brevo 控制之外完成 WhatsApp Business 设置和模板批准
