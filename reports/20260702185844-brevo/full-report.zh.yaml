        - 公开材料没有独立的进箱率或 SLA 证据
      - - 交易邮件 / API
        - 发送密码重置、订单更新、收据的开发者或运维团队
        - 已 GA / 高吞吐文档齐全
        - 统一 API + SMTP，支持模板、params 和 messageId 跟踪
        - 底层 MTA 拓扑、专用 IP 模型或区域级 SLA 没有公开细节
