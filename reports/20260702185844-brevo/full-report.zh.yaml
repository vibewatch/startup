companyProfile:
  summary: >-
    Brevo 是一家总部在巴黎的客户互动软件公司，法律实体可追溯到 2007 年；公司自己的历史称， 创始人 Armand Thiberge 于 2012 年在法国和印度启动运营业务。公司 2023 年从 Sendinblue 更名为
    Brevo，如今平台覆盖邮件、SMS、WhatsApp、营销自动化、CRM、客户数据和交易型消息。 公开证据显示公司已有真实规模，财务成熟度也在提升，但核心 SaaS KPI 细节仍属私有信息， 承销判断仍高度依赖公司选择性披露。
