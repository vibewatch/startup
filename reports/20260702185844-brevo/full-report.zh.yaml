      - number: '1.4'
        title: 里程碑、战略重点与反向核查
        blocks:
          - type: paragraph
            body: >-
              即便具体私有指标仍不透明，Brevo 的里程碑弧线仍然连贯。公司从最初的 Sendinblue 邮件产品 走向完整 CRM 套件，于 2023 年 5 月更名，并在 2025 年利用资本加码
              AI、美国扩张和收购。 官方投资方和公司材料称，Brevo 在 2023 年更名阶段已超过 $100 million ARR，截至 2025 年 12 月 完成 11 笔收购，并于 2025 年 2 月宣布
              €50 million AI Lab，用于在一支仍有超过半数员工面向 产品开发和 R&D 的团队之上构建欧洲 CRM 智能体和 AI 工具。反向信号并非没有，但比同等体量公司
              可能出现的范围更窄。最清晰的公开治理红旗，是 2023 年法国注册记录中关于资本受损仍继续经营的说明。 最清晰的产品市场摩擦来自 TrustRadius 评论：用户认可送达能力和易用性，但也指出 CRM
              模块可用性、 集成薄弱、WhatsApp 自动化复杂和 AI 表现不足。本章抓取的具体材料中没有浮现重大公开诉讼或执法行动， 但应把这一点视为证据缺口，而不是法律健康证明。
