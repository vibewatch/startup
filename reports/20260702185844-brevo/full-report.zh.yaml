  - id: TP003
    title: 定价 / 套餐对比
    columns:
      - 供应商
      - 定价单位
      - 公开入门价
      - 入门价包含功能
      - 扩张杠杆
      - 竞争含义
    rows:
      - - Brevo
        - 套餐 + 发送量
        - Free 版；Starter $9/mo；Standard $18/mo
        - 邮件、事务消息、模板；Standard 增加无限自动化
        - 更高发送量和更多功能
        - 最适合需要透明试点路径、且价格敏感的全渠道买家
      - - Mailchimp
        - 按联系人计费的 SaaS
        - 以免费试用切入；10K+ 联系人有 Standard 促销价
        - 邮件、自动化、表单、分析
        - 联系人数和更高付费档
        - 可能成为「足够好」标杆，拖慢 Brevo 评估
      - - HubSpot
        - 席位 + 营销联系人
        - Starter 促销价低至 $7/seat/mo；标准标价 $20/seat/mo
        - 核心营销功能，加 CRM 访问和 1K 联系人
        - 更多联系人、更多席位、更高 Hub、上手服务和续约锁定
        - 低入门标价可能掩盖更大的扩张收入
      - - Klaviyo
        - 用量 + 支持套餐
        - 免费邮件 / SMS 用量档；企业支持 $500/mo 起
        - 邮件和 SMS 入门功能，配全渠道零售工具
        - 消息量和支持档位
        - 买家优先优化电商收入、而非通用 CRM 广度时更有吸引力
      - - ActiveCampaign
        - 按联系人分层套餐
        - Starter 版；Plus 版；Pro 版；Enterprise 版
        - Starter 提供邮件自动化，但动作有限
        - 更多用户、高级集成、SSO、专属团队
        - 自动化深度可能胜过 Brevo，但购买没那么简单
      - - Mailjet
        - 按发送量计费的邮件 SaaS
        - Free；Starter $9/mo
        - 邮件营销活动和基础事务邮件
        - 更高发送量和高级支持
        - 买家只看邮件成本时，Mailjet 能用更低价格截走 Brevo 需求
      - - Mailgun
        - API / 发送量
        - 首月免费；Foundation $35/mo；Scale $90/mo
        - 邮件 API、SMTP、验证
        - 更高用量、专用 IP、SSO、留存窗口
        - 更适合开发者，不利于自助营销人员
      - - Zoho
        - 按联系人计费的 SaaS
        - 2K 联系人 / 6K 邮件以内免费
        - 邮件营销活动、模板、基础表单
        - 无限邮件、更多用户、更广 Zoho 交叉销售
        - 买家已经看重 Zoho 套件密度时，竞争最强
      - - Salesforce Starter Suite
        - 按用户计费套件
        - $25/user/mo 起
        - CRM、AI 辅助销售流程、动态邮件营销
        - 更多用户、Pro Suite、交易挂钩式增购
        - 捆绑 CRM + AI 叙事，在 CRM 主导交易中可能让 Brevo 显得狭窄
    notes: 公开入门价是 2026-07-02 的标价或明确公开的促销价；企业折扣、最低消费和实施费用往往未披露。
