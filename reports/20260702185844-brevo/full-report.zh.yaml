        title: 发布节奏、成熟度与产品风险
        blocks:
          - type: paragraph
            body: >-
              Brevo 的 2026 年变更日志显示，公司不是在简单打磨遗留 ESP，而是在安全、CRM、忠诚度、事件、 SDK 和 AI 工具上积极发货。OAuth scopes、MCP 认证加固、Deals API
              过滤器、同意组、钱包凭证 URL、 规范修正和重复 SDK 发布都落在同一个六个月窗口。这个速度在战略上是正面的，因为它显示 Brevo 正把平台 从邮件延展到更宽的客户数据和 CRM
              工作流。对集成方来说，这也是实实在在的运营风险。公开弃用、 破坏性 SDK 大版本和 Node 兼容性警告意味着，即便功能改善，平台也可能把迁移工作压给技术客户。
              因此，成熟度按模块混合：邮件、表单、活动和核心自动化看起来已经稳定；MCP、现代 SDK 和部分 伙伴 / 插件界面仍在收敛；公开基础设施披露仍太薄，无法独立验证最深层信任主张。承销时， Brevo
              看起来是一家产品宽、动作快的公司，对 SMB 到中端市场有可信实用价值；但它还不像一个完全透明的 基础设施厂商，不能在没有直接技术尽调时把可靠性、包装和开发者体验视为理所当然。
