      - number: '2.2'
        title: 受证据约束的 TAM、SAM 与相互冲突的市场口径
        blocks:
          - type: paragraph
            body: >-
              公开规模数据能支撑需求，但支撑不了一句干净的 TAM 结论。最窄的软件口径是 2026 年营销自动化 和邮件营销估算，区间约在 $8.1 billion 到 $13.7
              billion，取决于分析师从自动化工作流还是 邮件软件起算。再上一层是客户互动，公开估算跃升至约 $28.1 billion，因为范围扩展到 CRM 相邻编排、服务、分析和多渠道互动。最宽的伞状口径是 CRM
              软件，规模又大出数倍。 这些数字并不是必然有一个错；真正矛盾的是在估值备忘录中把它们互换使用。对 Brevo 而言， 诚实框架是分层 TAM：较窄的软件核心、更宽的客户互动相邻市场，以及尚未解决的欧洲特定或
              Brevo 特定切片。TM002 和区间图有意保留这些边界冲突，而不是把它们抹平。
