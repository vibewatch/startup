  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值标记与披露边界
        blocks:
          - type: paragraph
            body: >-
              公开证据能确认融资事件真实存在，但准确估值仍模糊。Brevo 2025 年 12 月 4 日的新闻稿和 General Atlantic 的同步公告确认了 €500M 融资、独角兽状态、2025 年 ARR 超过
              €200M，以及两位数 EBITDA 利润率。TechCrunch 补充了最有用的股权结构细节：General Atlantic 和 Oakley 各自买入约 25% 股份，管理层和员工仍以 26%
              成为最大股东；但同一篇文章也说，准确估值并未披露。关键在于，这轮交易似乎同时包含股权变更和增长资本，因此外部人士只能支持大约 €1.0-€1.1B 的股权价值区间，而不是精确的投后估值。按这一区间和刚超过
              €200M 的 ARR 计算，Brevo 大约是 5.0x-5.5x ARR。运营故事并不弱：覆盖 180 个国家、约 600,000 名客户、超过 1,000 名员工、美国新增收入占
              24%，中端市场增长是其余业务的两倍。Clipperton 的交易说明还补充，这轮融资旨在加速北美规模、资助大规模 AI 产品投资、支持定向 M&A，并帮助公司在 2030 年追求 €1B
              年收入目标。但这里做估值，必须同时从缺失项起步：具体轮次条款、优先权结构和 2025 年 ARR 的准确期末值都未披露。
