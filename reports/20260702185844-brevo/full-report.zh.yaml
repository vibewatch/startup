  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Brevo 的品类位置
        blocks:
          - type: paragraph
            body: >-
              分析 Brevo 时，应把它看作面向小型企业的一体化增长平台，而不是纯邮件简报工具， 也不是完整企业 CRM 套件。官方定位覆盖邮件、SMS、自动化、CRM 和销售工具；独立市场页面则显示，
              即便是“邮件营销”品类，也常把软件、服务、自动化、CRM 邮件软件和获客工具纳入其中。 因此，同一家公司可能同时落入多个分析师口径。做估值时，核心纳入支出应是与邮件活动、旅程、
              受众管理、轻量销售工作流和相邻消息编排相关的订阅或用量收入。排除支出包括媒体采买、代理商人工、 电商平台 GMV 和重型企业服务层。最重要的替代方案不只是直接厂商，还包括电子表格、原生电商插件、
              简单邮件简报工具，以及能用自动化或 CRM 模块吸收同一买方任务的更广套件。
