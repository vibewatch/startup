      - - 债务金额、到期日和契约
        - 尽管提到早期债务，资产负债表风险仍无法定价
        - 要求提供债务明细表、贷款方名单、利率、契约和担保包
      - - 按渠道拆分的实际毛利率
        - 无法区分软件式收入和低毛利转嫁活动
        - 要求拆分核心软件、交易邮件、SMS/WhatsApp 和服务的毛利率
      - - NRR、流失率和 CAC 回收期
        - 阻断对增长耐久性和销售效率的承销
        - 要求提供队列留存、客户流失、净留存、按细分市场拆分的 CAC，以及按销售动作拆分的回收期
