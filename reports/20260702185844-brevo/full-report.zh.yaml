      - number: '2.5'
        title: 公开证据仍无法拆出的内容
        blocks:
          - type: paragraph
            body: >-
              最大的尽调风险是虚假的精确感。公开来源足以证明 Brevo 处在真实且增长的市场中，SMB 采用正在拓宽， 欧洲特定合规姿态也很重要。但这些来源不足以拆出 Brevo 的真实 SAM 或
              SOM。公开证据没有按邮件、 自动化、CRM、消息分别拆分 Brevo 收入或客户，没有披露其欧洲份额或各分部免费转付费转化， 也没有量化送达能力或隐私变化对留存和附加率的影响。因此，本章应用于限定市场叙事边界，
              而不是过度拟合一个可直接套倍数的精确 TAM。下一步尽调需要管理层证据：按地区和分部的收入桥、 cohort 转化、按渠道的附加率，以及与合规和送达复杂度相关的采购或流失证据。
