  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场版图与定位
        blocks:
          - type: paragraph
            body: >-
              Brevo 位于 SMB 互动市场的两端之间。低复杂度一端是 Mailjet、Mailgun、CleverReach 等以发送或
              邮件简报为先的工具，解决邮件投递或基础活动创建，并不试图拥有完整客户关系层。更重的一端是 HubSpot、Zoho、Salesforce Starter Suite 等套件，把邮件营销视为更大 CRM、服务或
              AI 驱动操作系统 里的一个模块。Brevo 自己的产品和定价页把它放在中间：一个平台覆盖邮件营销、营销自动化、SMS、 WhatsApp、交易型消息、CDP 和 CRM，但仍通过易进入的自助漏斗销售。


              这个中间位置让直接比较集异常宽。Mailchimp 和 ActiveCampaign 是最清晰的 SMB 自动化同业， 因为它们同样组合邮件、分群、工作流和名单增长工具。Klaviyo 是更专注的电商和 B2C
              品牌全渠道竞争者， 零售渠道取向比 Brevo 更深。买方希望把营销与 CRM、服务或收入工作流紧密绑定时，HubSpot、Zoho 和 Salesforce
              也会竞争。主要需求是送达能力或开发者可控的交易型消息，而不是通用 SMB 增长栈时， Mailjet 和 Mailgun 就是替代品。


              独立评论强化了这一位置。Brevo 反复因性价比、送达能力和相对价格的功能宽度受到认可， 但同一批评论仍指出 CRM 体验较轻、部分模板限制，以及边缘工作流依赖集成。这符合一种产品画像：
              它靠把“够用”的能力打包进一个可负担的统一界面取胜，而不是在每个品类里都做最深的工具。
