    title: 缓释与放弃标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 邮箱服务商执法风险
        - Gmail 或 Yahoo 拒收 / 进垃圾箱证据
        - 管理层无法提供 ISP 层面的投诉、拒收和认证指标，或显示连续两个季度恶化趋势
        - 将送达率耐久性视为未证实，投资测算时加大折价或放弃
      - - 核心发送界面可靠性风险
        - 官方事故和事后复盘
        - 90 天内出现超过三起重大邮件、交易、自动化或 SMS 事故，且没有令人信服的根因修复
        - 暂停尽调，直到可靠性证据改善
      - - WhatsApp / SMS 政策与经济性风险
        - Meta 警告、选择加入例外或运营商毛利侵蚀
        - 任何重大 WhatsApp 政策处罚、消息类别突然重定价，或没有价格调整抵消的 SMS 毛利压缩
        - 下调渠道上行情景假设，重新评估多渠道论点
      - - 投资方支持下的执行拉伸
        - 2026 年经营计划与融资承诺
        - AI、美国或 M&A 扩张快于支持质量、模块附加率或留存证据
        - 假设宽度正在稀释深度，避免支付增长溢价倍数
      - - SMB 流失和支持负担
        - 套餐级流失、席位扩张和附加产品采用
        - 管理层无法证明健康队列留存，或披露席位 / 渠道支出放量时流失激增
        - 将免费转付费漏斗视为弱于宣传，并退后观望
      - - 治理和披露不透明
        - 私下尽调资料完整性
        - 尽调请求后，董事会权利、投资者保护、SLA 达成情况和事故严重度仍不透明
        - 升级为继续研究或回避，因为下行无法有把握地定价
    notes: 放弃标准聚焦尽调中可私下索取的证据，而不是乐观公开路线图里程碑。
