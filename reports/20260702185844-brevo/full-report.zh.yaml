      - number: '7.2'
        title: 竞争、差异化侵蚀与 SMB 经济性风险
        blocks:
          - type: paragraph
            body: >-
              Brevo
              的历史切入口，是用低于企业套件的价格，提供好上手的多渠道广度；但这道护城河正在变薄。独立评测仍认为产品价格有吸引力、也有用，但同时指出落地页能力有限、点数制额外成本、加载慢、导入挑剔、多用户访问昂贵、支持有缺口。客户群重视性价比，又习惯永久免费的入口，这类摩擦正好会放大。与此同时，竞争对手越来越直接在定价页面售卖重叠能力：Mailchimp
              主打邮件、SMS、AI 和大量集成；Klaviyo 推 CRM、邮件、SMS、WhatsApp 和应用生态深度；ActiveCampaign 打包 CRM、WhatsApp、交易邮件和深度集成；Twilio
              SendGrid 则持续压迫专门的邮件基础设施。战略风险不是 Brevo 没有广度，而是如果广度没有更深执行持续支撑，切换或多供应商替代会比管理层希望投资人相信的更容易。
            claimRefs:
