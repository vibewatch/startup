      - number: '7.5'
        title: 缓释、监控与叫停标准
        blocks:
          - type: paragraph
            body: >-
              Brevo 并不是没有控制手段。公司有可见的缓释因素：托管在欧盟的基础设施和 ISO 27001 表述、正式法律栈、到达率工具、有记录的高管团队，以及真实规模的公开证据。这些缓释足以支持把 Brevo
              当成严肃平台来承销，而不是脆弱的单点工具。但最难的反向问题并未因此消失。在不打估值折扣就把当前故事视为可投之前，尽调应要求管理层拿出非公开证据：流失和留存 cohort、邮箱服务商投诉或拒收率、SLA
              达成率和事件严重程度、WhatsApp 或 SMS
              政策例外、董事会治理，以及已收购模块的整合健康度。叫停标准也应明确且可衡量。如果渠道执行收紧、状态事件继续集中在核心发送触点、席位和附加项扩张时支持经济性恶化，或资方出钱买来的广度没有强深度指标支撑，下行就不只是增长放慢。它会是一套结构上更弱的平台：竞争更多、合规暴露更高，定价权也低于收入叙事暗示的水平。
