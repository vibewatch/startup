      - number: '1.2'
        title: 领导层、治理与控制结构
        blocks:
          - type: paragraph
            body: >-
              Brevo 的公开领导姿态仍是创始人主导。2026 年高管页列出 Armand Thiberge 为创始人兼首席执行官， 其下包括 CTO Mickaël Arias、美洲区 CRO 兼 CEO Channing
              Ferrer、首席人力与影响力官 Laure Rudelle Arnaud、首席产品官 Jérémy Cahen、CFO Edouard Celier、首席数据与 AI 官 Charli Idrac、CMO
              Inken Kuhlmann-Rhinow，以及幕僚长 Thibault Rouillon。公司在产品、 收入、财务、人力和 AI 上已有相当的职能深度，但关键人依赖仍集中在 Thiberge 身上，因为更名、
              2025 年融资和 AI 战略都由他对外沟通。公开治理披露比领导层披露薄得多。Societe.com 和 Pappers 浮现的注册记录显示，SENDINBLUE 的法定总裁自 2021 年 1 月起为
              Eiffel 65， 尽管 Brevo 的外部材料仍把 Thiberge 呈现为创始人兼 CEO。同一注册信息还记录了 2023 年 10 月
              在净资产跌破股本一半后继续经营的备案；即便公司正常运营，这也是重要的治理和资产负债表警讯。 董事会组成、董事席位分配和股东权利细节在审阅的公开材料中仍未披露，因此治理尽调仍要依赖 私有股权结构表和董事会文件。
