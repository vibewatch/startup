      - number: '4.2'
        title: 牵引力、盈利性与单位经济框架
        blocks:
          - type: paragraph
            body: >-
              对一家欧洲私有 CRM 厂商而言，Brevo 的公开财务文件在规模上异常强，在解释规模背后机制的细节上却 出奇薄。最强披露点是公司自己称，2025 年 ARR 将超过 €200 million，EBITDA
              利润率为双位数。 这与纯靠希望融资的增长故事截然不同：它意味着 2025 年融资完成前，公司已具备规模化经常性收入和 一定运营纪律。客户宽度和地域进一步强化这一点。官方和第三方来源把 Brevo 描述为拥有
              500,000+ 到 600,000+ 客户、1,000+ 员工，并在 180 个国家运营；法国、德国和美国贡献当前收入的
              65%。与此同时，单位经济包仍不完整。公开可比公司只能提供区间，不能直接回答：HubSpot 2025 年 毛利率约 83.8%，Klaviyo 为 74.7%；如果
              SMS、WhatsApp、交易型转付和高接触服务在 Brevo 中占比高于纯软件同业，Brevo 可能低于区间上沿。更尖锐的定价洞察是，Brevo 的 ARR 无法用整个客户群 的 $9-$18
              标价计划来对上。因此，公开证据指向一家实际变现深度高于入口定价的公司，但其付费转化、 ARPA、留存和贡献利润率仍披露不足。
