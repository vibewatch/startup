      - number: '4.3'
        title: 资本结构与扩张资本
        blocks:
          - type: paragraph
            body: >-
              2025 年 12 月交易更像偏控制的规模化成长阶段资本重组，而不是普通风险融资延长线。Brevo 披露 €500 million 融资，General Atlantic 和 Oakley
              进入，Bridgepoint 和 Bpifrance 留下， Partech 退出。TechCrunch 的股权结构表拆分提供了关键线索：管理层和员工 26%，General Atlantic
              25%，Oakley 25%，Bpifrance 加 Bridgepoint 24%。这个分布加上同一篇文章对 €500 million 新股权的描述，支持推断投后估值约 €1.0 billion，或约 $1.1
              billion 等值美元；但这不是干净披露的 估值事实，因为再投资和卖方流动性让一级与二级拆分变得不透明。资金用途比估值更清楚。官方和独立来源 指向三大投放桶：AI 投资、美国扩张和持续收购。Brevo
              另行承诺五年内向 AI Lab 投入 €50 million； TechCrunch 称此前也存在债务；EU-Startups 和 TechCrunch 描述了到 2030 年超过 €100 million
              的美国计划投资。历史融资只部分公开——Tech.eu 提到 $35 million Series A，公司确认了 $163 million Series B——因此 2025
              年融资看起来是一次重大阶跃，而不是常规补充。公开证据支持 战略资本充足，但不足以支撑完整承销的资产负债表视图。
