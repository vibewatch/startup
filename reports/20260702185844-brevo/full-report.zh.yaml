      - number: '5.2'
        title: API、数据、集成与 AI 架构
        blocks:
          - type: paragraph
            body: >-
              Brevo 公开记录中最可信的技术差异点，不是新颖核心算法，而是平台覆盖面的范围和连接性。Brevo 记录了 一个统一 REST API，覆盖消息、联系人、自定义事件、电商同步和自定义对象，并在其上叠加 CRM
              webhook、 活动 webhook、七种语言的官方 SDK 和 OpenAPI 规范。运营上，架构像是以消息和联系人为核心， 周围环绕工作流编排和伙伴集成：邮件和 SMS
              可以由工作流触发，交易型邮件支持模板驱动个性化和消息跟踪， WhatsApp 支持从交易型模板延伸到带统计和审批流的定时活动。Brevo 的 2026 年 AI 推进位于这个数据平面之上。 MCP
              服务器很重要，因为它把 Brevo 从一个营销人员点击的应用，变成助手可以查询或操作的系统， 任务覆盖联系人计数、活动创建和 CRM 商机检索。取舍是生态复杂度。Node、Python、PHP、Ruby 和
              .NET 都有公开版本，但 SDK 版图并不统一：Node 正在迁移，Python 和 PHP 的现代化快于 Ruby 或 .NET， 版本分支意味着技术客户确实要承担集成管理开销。
