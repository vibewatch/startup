      - number: '3.3'
        title: 切换成本与生态权力
        blocks:
          - type: paragraph
            body: >-
              Brevo 的锁定效应是累积型，而不是单点型。客户从邮件简报起步后，可以逐步加入名单分群、 同意历史、表单、交易触发、发送域名、CRM 对象、WhatsApp 或 SMS 流，以及外部自动化。
              这些资产单独看没有一个无法迁移，但合在一起会产生不低的重建成本。Zapier 连接器尤其有揭示性： 它暴露联系人、公司、商机、交易型邮件、SMS 和事件驱动工作流。这说明即便其他应用仍在， Brevo 也可以成为
              SMB 的协调系统。


              合作伙伴故事两面都有。Brevo 有代理商计划和公开服务伙伴目录，应能降低实施摩擦，也让小公司更容易 外包设置。但周边生态仍比 HubSpot、Klaviyo、ActiveCampaign 和
              Salesforce 推广的生态更薄。 HubSpot 把软件与应用市场和伙伴计划叠在一起；Klaviyo 称连接 350+ 应用，并运营全球代理商和 技术网络；ActiveCampaign 宣传 1000+
              应用；Salesforce 的小企业产品旁边，是公司更大的平台和 AppExchange 传统。


              这个差异不只影响获客，也影响留存。生态深度上升时，客户围绕平台继承更多模板、顾问、相邻应用和 运营经验。Brevo 的生态已经足以支撑 SMB 上手和适度扩张，但还不是最大套件级别的结构性护城河。
              真正的竞争问题是，Brevo 能否保持足够的工作流引力，阻止客户向上并入一个套件，或横向碎片化到 专门工具。
