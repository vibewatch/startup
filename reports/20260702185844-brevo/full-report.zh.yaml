  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - 2028 ARR 仅 €250-€280M；公开 SaaS 倍数继续受压；更干净的留存或利润率证据有限。
        - 2.8x-3.5x 退出倍数意味着约 €0.7-€1.0B 退出价值；以约 €1.1B 入场计，毛 MOIC 约 0.6x-0.9x。
        - 下调融资、优先权包袱、CRM 加购乏力、整合拖累。
        - 在当前估值下，不能忽视的实质下行情景。
      - - 基准
        - 2028 ARR 约 €300-€330M；EBITDA 仍体面；Brevo 相对广义 CRM 可比公司保持适度溢价。
        - 3.6x-4.4x 退出倍数意味着约 €1.1-€1.5B 退出价值和约 1.0x-1.3x 毛 MOIC。
        - 可比倍数维持公开市场水平，披露始终没有实质改善。
        - 按当前公开证据，概率最高的区间。
      - - 乐观
        - 2028 ARR 约 €380-€420M；美国和中端市场继续领跑；AI 和 M&A 扩大钱包份额且不损伤利润率。
        - 4.8x-6.0x 退出倍数意味着约 €1.8-€2.5B 退出价值和约 1.7x-2.3x 毛 MOIC。
        - 多条执行线都必须异常干净。
        - 情景可成立，但对今天新入场资金已经很苛刻。
    notes: 区间是毛回报、稀释前且优先权前结果，因为公开证据未披露将企业价值转换为干净普通股回报所需的资本结构。
    claimRefs:
      - CV044
      - CV045
      - CV046
      - CV047
      - CV050
      - CV052
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 收入 / ARR 锚点
      - 估值或倍数
      - 与 Brevo 的关系
      - 局限
    rows:
      - - Brevo 当前披露区间
        - '>€200M 2025 ARR 指引'
        - ~€1.0-€1.1B 隐含股权价值；~5.0x-5.5x ARR
        - 目前为当下投资测算提供最近的估值锚。
        - 准确投后估值和融资结构仍未披露。
      - - HubSpot
        - 2025 年收入 $3.1B
        - 2026 年 7 月市值 $9.85B；~3.2x 收入
        - 产品覆盖广的公开中端市场 CRM 标杆。
        - 成熟度、披露度和运营规模都远高于 Brevo。
      - - Klaviyo
        - 2025 年收入 $1.234B
        - 2026 年 7 月市值 $5.05B；~4.1x 收入
        - 规模化营销自动化可比标的，增速强于广义 CRM。
        - 更偏电商，披露也仍好于 Brevo。
      - - Salesforce
        - 2026 财年收入 $41.5B
        - 2026 年 7 月市值 $136.51B；~3.3x 收入
        - 给出广义 CRM 软件在公开市场的交易区间。
        - 规模和多元化程度远高于 Brevo 以 SMB 为主的平台。
      - - Intuit / Mailchimp 2021 年私有化交易
        - FY2022 文件显示自收购日起贡献 $762M 收入
        - $12.0B 对价；按年化口径不同，战略倍数方向上为十几倍低段
        - 可作为规模化 SMB 营销资产的上限参考。
        - 周期高点的战略 M&A 先例，不是干净的 2026 年公开市场可比公司。
    notes: 这个样本有意不做穷尽：它混合了直接公开可比公司和一个战略先例，因为 Brevo 仍是私有公司，准确投后估值未公开披露。
    enumerationScope:
