      - number: '1.3'
        title: 资本历史、规模与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Brevo 的公开资本历史有两次清晰跃迁。第一次是 2020 年 Series B，报道金额约 $160–163 million， Bridgepoint 领投，Bpifrance 和 BlackRock
              参与，Partech 继续跟投；当时公司称自己服务约 180,000 名客户，覆盖 160 个国家，约有 400 名员工和 5 个办公室。第二次是 2025 年 12 月融资， General Atlantic
              和 Oakley Capital 进入，Bridgepoint 和 Bpifrance 保留少数股权，Partech 完全退出， 同时把 Brevo
              推入独角兽行列。官方和合作方材料称，交易后管理层和员工成为公司最大股东； TechCrunch 进一步报道，交易后股权大致为管理层和员工 26%，General Atlantic 和 Oakley 各 25%，
              Bridgepoint 与 Bpifrance 合计 24%。到 2025 年末，规模披露也明显改善：公司称客户数已超过 600,000，运营覆盖 180 个国家，员工超过 1,000 人，并预计 2025 年
              ARR 超过 €200 million， EBITDA 利润率达到双位数。准确估值和当前准确员工数仍需尽调。官方材料只披露“独角兽”身份， 后续私募股权行业报道在后续谈判中引用了约 €1 billion 或
              $1.1 billion 的估值锚。
