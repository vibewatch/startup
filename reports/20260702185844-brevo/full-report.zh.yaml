        title: 基础规模、SMB 偏向与欧洲中心足迹
        blocks:
          - type: paragraph
            body: >-
              Brevo 的公开规模线索很强：多个与 2026 年相邻的官方页面如今引用全球 600,000 名客户， 关于页、定价页和 2025 年末融资稿都重复同一数量级。这个客户基础的结构仍偏 SMB。Brevo
              以免费计划、 低成本 Starter 和 Standard 层级、WordPress 插件漏斗中的无限联系人，以及直接面向创业者和小企业的 信息开场。独立评论渠道也指向同一方向：GetApp
              明确称平台在小企业和初创公司中突出，TrustRadius 示例包括单人运营者、小型网店，以及向创业者推荐工具的数字营销代理商。欧洲仍是可见重心。 Brevo 总部在巴黎，称法国、德国和美国占收入的
              65%，并仍在明确进行 DACH 企业销售投资。 具名客户集进一步偏欧洲，Doctolib、Alltricks、Buffalo Grill、L’Occitane、Solidarités
              International、 Jurafuchs 和 Fnac Darty 都强化了这一点：即便美国和更广国际扩张仍在推进，Brevo 最强的公开证明 仍锚定欧洲。
