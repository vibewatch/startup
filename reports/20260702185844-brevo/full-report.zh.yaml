        - 营销活动创建、名单管理、分群、模板、到达率工具、分析
        - 付费媒体、代理服务、电商 GMV、内部人力
        - 邮件简报插件、原生店铺邮件功能、电子表格
        - Brevo 邮件订阅和发送计费使用量最直接的收入池
      - - 营销自动化
        - 旅程编排、触发式工作流、线索培育、评分、个性化
        - 宽口径 CDP 实施项目和定制服务
        - 手工工作流、基础自动回复器、单渠道工具
        - 解释 Brevo 为什么争夺简单邮件简报之外的工作流预算
      - - SMB CRM / 销售工具邻接
        - 销售管道、联系人管理、任务、销售跟进、轻量级收入运营
        - 完整企业级 CRM 转型和 SI 重实施
        - 独立 CRM、电子表格、以收件箱为中心的销售
        - 关键在于，Brevo 的销售软件拓宽了小团队内部的买方用途
      - - 全渠道互动
        - SMS、WhatsApp，以及与客户旅程相连的跨渠道编排
        - 电信基础设施经济性和定制服务运营
        - 渠道专用 SMS 工具、WhatsApp BSP、社交收件箱产品
        - 扩大 Brevo 可触达市场，但引入消息类别经济性和合规工作
      - - 宽口径客户互动 / CRM 伞形市场
        - 客户互动套件、服务、分析和整合客户运营
        - 无关企业应用和线下客服人力
        - 企业 CRM 或 CX 套件
        - 作为外边界有用，但太宽，不能当作 Brevo 的实际核心 TAM
      - - 现状 / 内部自建
        - 内部脚本、电子表格、邮箱工具、电商默认功能
        - 未采购外部平台时的第三方软件订阅
        - 什么都不做，保留现有工具栈，依赖各渠道仪表盘
        - 划出许多中小企业和价格敏感买家的真实采用门槛
    notes: 边界把与 Brevo 相关的软件收入同媒体、服务和运营支出拆开；行标签是基于所引类别定义和厂商定位做出的分析归纳。
