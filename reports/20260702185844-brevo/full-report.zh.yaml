      - number: '7.3'
        title: 到达率、宕机与平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              Brevo 架在自己不控制的渠道上，因此风险清单里相当一部分属于外部平台和发件规则体系。Gmail 和 Yahoo 都执行发件人要求；认证、投诉管理或退订处理不到位，邮件就可能被降权或拒收。Gmail 还明确在
              2025 年底再次收紧执行。Brevo 自己推出 Deliverability Center，也说明收件箱到达和声誉是要持续管理的运营问题，不是已经稳住的优势。2026 年事件记录把这个问题说得更尖锐：截至
              2026-07-02，官方状态 RSS 记录了二十多起近期事件，覆盖邮件发送、交易邮件、工作流执行、追踪、自动化和 SMS 相关触点；StatusGator 和 IsDown
              也显示更长的事件历史。共享平台依赖不止邮件，还延伸到 WhatsApp 定价与政策执行，以及 SMS 点数和运营商经济性。Brevo
              可以靠监控和控制缓释这些风险，但无法彻底消除，因为把关决定掌握在邮箱服务商、Meta、运营商和上游基础设施手里。
