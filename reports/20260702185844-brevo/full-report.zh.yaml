            body: >-
              关于客户持久性的牛市案例很直接，但只得到部分验证。公开故事反复显示，Brevo 通过一个狭窄切口落地—— 交易型邮件、新用户引导、活动管理或忠诚度消息——随后扩展到 SMS、推送、钱包、CRM 或 CDP
              等相邻模块。 公司披露还称，中端市场收入增速是业务其他部分的两倍，这与一个能从 SMB 起点向更大账户攀升的平台相符。 问题在于，公开记录没有给出投资者真正需要的关键尽调指标。抓取到的来源没有披露
              NRR、GRR、流失、 续约节奏、头部客户 ARR 占比、前 10 客户集中度或伙伴来源收入占比。公开证明在垂直上更分散， 但证据所有者并不分散：名字横跨多个行业，详细结果大多留在 Brevo 托管的案例研究页。
              因此，可见客户基础看起来广且具备扩张能力，但集中度和留存仍证据不足。正确解读不是 Brevo 客户弱， 而是公开记录对采用证明很强，对持久性会计很弱。
