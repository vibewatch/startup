      - 日常用户
      - 预算归属
      - 当前替代品
      - 采用触发点
    rows:
      - - 创始人主导的微型中小企业
        - 创始人或业主经营者
        - 通才型营销人员或创始人
        - 运营预算
        - 电子表格、基础电子报工具
        - 需要一个简单、低成本的平台，把电子邮件和轻量 CRM 放在一起
      - - 电商中小企业
        - 增长或生命周期负责人
        - 电子邮件和留存营销人员
        - 营销或增长预算
        - Mailchimp、Klaviyo、店铺原生工具
        - 围绕购买旅程需要分群、自动化和 SMS/WhatsApp
      - - B2B 服务或 SaaS 中小企业
        - 创始人、营销负责人或销售负责人
        - 营销通才加销售协调人员
        - 销售和营销合并预算
        - HubSpot 入门工具栈、手动管线跟踪
        - 需要在一个系统里跑营销活动，并看见轻量销售管线
      - - 中端数字化企业
        - 需求生成或 RevOps 负责人
        - 生命周期、CRM 和运营用户
        - 营销运营或 RevOps 预算
        - 更宽的 CRM 或自动化套件
        - 不想承担企业级复杂度，但需要更好的工作流、报表和团队协同
      - - 面向欧洲且重视合规的发送方
        - 带法律或隐私干系人的营销负责人
        - CRM/电子邮件操作员加合规审核员
        - 带监督的营销预算
        - 维持现状加内部政策控制
        - 需要能让人对 GDPR 合规放心的厂商叙事和明确的同意管理工具
      - - 扩展渠道的发送方
        - 增长或 CX 负责人
        - 营销活动经理，以及支持或消息运营人员
        - 增长或客户互动预算
        - 独立 SMS 或 WhatsApp 厂商
        - 希望增加消息渠道，但不重建整套工具栈
