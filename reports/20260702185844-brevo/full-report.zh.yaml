      - number: '8.2'
        title: 上市可比公司语境与价格纪律
        blocks:
          - type: paragraph
            body: >-
              正确可比集合不只是宽口径 CRM，而是有规模的营销自动化和客户互动软件。按 2026 年 7 月的公开数据，HubSpot 市值约为 2025 年收入的 3.2x，Klaviyo 约
              4.1x，Salesforce 约 3.3x。因此，Brevo 当前隐含的 5x+ ARR 倍数，要求投资人为一家透明度更低的私有公司支付高于上市公司的溢价。部分溢价可以讨论。Brevo 声称 EBITDA
              达两位数，中端市场增长异常快，美国贡献加速，平台也早已越过邮件简报工具。但价格和产品语境会限制这个论点能走多远。Brevo 自己的网站仍强调低摩擦、价格可负担的漏斗；PCMag 和 TrustRadius 则指向
              CRM、AI、WhatsApp 和集成限制。官方页面显示 150+ 个集成；Klaviyo 称有 350+ 个应用，HubSpot 继续依托大得多的应用市场。历史语境也有正反两面。Intuit 2021 年以
              $12.0B 收购 Mailchimp，后来披露 2022 财年自收购日起的 Mailchimp 收入为 $762M，说明有规模的 SMB 营销资产可以拿到低十几倍的战略倍数。但那是 2021 年的战略 M&A
