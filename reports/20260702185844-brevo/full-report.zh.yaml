            calloutType: assumption
            claimRefs:
              - CV038
              - CV039
              - CV040
          - type: callout
            title: 下行更多来自倍数压缩，而不是业务崩塌
            body: 熊市情景不要求业务崩坏。只要倍数向上市公司靠拢、上行进入中端市场变慢，或资本结构不如市场期待，下行就会出现。
            calloutType: risk
            claimRefs:
              - CV044
              - CV048
              - CV050
              - CV051
