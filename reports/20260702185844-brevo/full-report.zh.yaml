  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 全渠道套件与客户任务
        blocks:
          - type: paragraph
            body: >-
              Brevo 的公开产品版图明显不止独立邮件简报工具。公司对外销售一个统一套件，覆盖邮件、SMS 和 WhatsApp 活动，通过注册表单和落地页捕获线索，提供无代码工作流自动化，并有轻量销售 CRM 管理商机
              和会议。从客户工作流看，这套栈旨在捕获线索、丰富或分群联系人，跨渠道触发生命周期或促销消息， 再把高意向联系人交给销售管道，全程不离开同一个管理界面。这个宽度不只是首页文案： Zapier
              暴露了来自常见表单和线索来源的订阅者导入工作流，WordPress 插件材料和评论也确认了 通过站点运营者、电商连接器和插件部署路径形成的真实分发。实际限制是，套件并非每个模块都同样成熟，
              包装也并不完全一致。Brevo 自己的页面强调免费和低成本入口，但第三方评论指出落地页、 高级报告、多用户访问，以及部分弹窗或插件功能存在功能门槛。投资者因此应区分真实模块宽度——确实存在——
              与所有层级无缝执行之间的差异；后者在不同渠道和界面上仍不均衡。
