  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私与渠道合规风险
        blocks:
          - type: paragraph
            body: >-
              相比轻量级 SMB 邮件工具，Brevo 的法律与隐私框架更正式；但这套框架也凸显，受监管消息工作流里的执行风险有多重。2025 年 10 月条款把 DPA、安全措施、SLA
              和可接受使用规则都写进核心合同，反垃圾邮件政策还明确要求主动同意、opt-in 证明、退订机制和干净的名单来源。关键在于，业务横跨邮件、SMS 和 WhatsApp，约束不只来自 Brevo 自己的规则。ICO
              表示，未经请求的邮件和短信营销往往需要明确同意；WhatsApp 也要求 opt-in 许可，并保留在违反政策时限制或移除商业访问权限的权利。Brevo 还披露了多实体控制者结构，以及可能向 EEA
              之外转移数据。因此，风险不是缺少法律文本，而是如果同意链路、转移控制或各渠道政策处理在实践中薄弱，Brevo 客户仍可能触发执法、停用或采购摩擦。
