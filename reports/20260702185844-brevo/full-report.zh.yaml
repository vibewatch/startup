            body: >-
              反论点很直接：Brevo 也许会证明自己有韧性，但如果上市 SaaS 仍在约 3x-4x 收入附近，Brevo 自身披露又始终停在公司自选指标上，私有买方仍可能买贵。入场纪律因此必须明确。要么价格靠近 4.5x
              ARR 或更低，要么管理层披露足够信息，证明 ARR 实质上高于 €240M，且两位数 EBITDA 可持续、留存干净、摊薄可控。破坏论点的触发器同样具体：2026 年期末 ARR 低于约
              €215M；出现降估值融资或厚重优先权结构；中端市场或美国增长失去领先；或者 M&A、AI 和 CRM upsell 没有转化为钱包份额扩张。产品摩擦信号也重要，因为评测来源已经指向
              CRM、AI、WhatsApp 和集成限制。缺失的尽调不是修饰项，而是决定当前毛回报测算能否经受真实资本结构冲击、以及投资委员会能否干净上调评级的证据。
