chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立时间线与平台范围
        blocks:
          - type: paragraph
            body: >-
              Brevo 将自己定位为支撑可持续增长的客户平台，覆盖邮件、SMS、WhatsApp、聊天、 营销自动化、CRM 和相关销售工作流。当前产品和定价页显示，套餐从免费和 Starter 计划一路延伸到多席位
              Professional 计划和定制企业层级，说明公司以订阅 SaaS 为主，并叠加 SMS 点数、专用 IP、高级销售席位等用量组件。公司今天的官方足迹显然以巴黎为核心，
              但创立时间线不能用单一日期概括。法国注册聚合网站将 SENDINBLUE 列为 2007 年 5 月在巴黎注册； Brevo 自己的关于页和更名材料则称，Armand Thiberge 于 2012
              年在印度和法国创立运营业务， 之后把它从邮件简报工具做成更完整的 CRM 套件。这个 2012 年故事也符合公司 2023 年 “十年之后”更名叙事。本章审阅的记录中，Armand Thiberge
              仍是公开的创始人兼 CEO， 抓取到的来源没有支持提示中提到的 CEO 名字 Isabelle Gallo。最干净的综合判断是： 法律载体早于运营扩张故事；品牌今天的核心身份是更宽的 Brevo 平台，而不是最初
              Sendinblue 仅做邮件的定位。
