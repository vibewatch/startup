          label: 把关邮件触达
        - from: Yahoo
          to: Brevo core platform
          label: 把关邮件触达
        - from: Meta / WhatsApp
          to: Brevo core platform
          label: 把关渠道准入
        - from: SMS carriers
          to: Brevo core platform
          label: 塑造投递经济性
        - from: Acquired / new modules
          to: Brevo core platform
          label: 加重整合负担
        - from: Brevo core platform
          to: Customers
          label: 决定价值和可靠性
        - from: Investors
          to: Acquired / new modules
          label: 供资并施压
        - from: Customers
          to: Investors
          label: 验证或推翻论点
    claimRefs:
      - CR050
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 把已披露的运营证据和可比公司背景一路推到当前建议的决策流。
    data:
      nodes:
        - id: mark
          label: €500M 融资；仅处独角兽区间
          type: start
        - id: proof
          label: '>€200M ARR + 两位数 EBITDA'
          type: process
        - id: premium
          label: Brevo 是否该相对上市可比公司享受溢价？
          type: decision
        - id: disclosure
          label: 估值条款和资本结构披露是否足够？
          type: decision
        - id: buy
          label: 买入 / 承销
          type: end
        - id: track
          label: 跟踪 / 继续研究
          type: end
        - id: avoid
          label: 当前价格下回避
          type: end
      edges:
        - from: mark
          to: proof
          label: 融资已落地
        - from: proof
          to: premium
          label: 运营证据存在
        - from: premium
          to: track
          label: 可能，但还不够硬
        - from: premium
          to: avoid
          label: 否
        - from: track
          to: disclosure
          label: 需要更干净的证据
        - from: disclosure
          to: buy
          label: 是 + 价格改善或 ARR 超预期
        - from: disclosure
          to: track
          label: 否
    approximationNotes: 该流程有意把决策简化为本章真正的两个关口：Brevo 是否配得上溢价，以及披露材料是否足以建立信任。
    claimRefs:
      - CV038
      - CV039
      - CV041
      - CV047
      - CV049
      - CV052
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在不同收入倍数下，支撑约 €1.1B 估值所需的 ARR。
    data:
      items:
        - label: 3.0x
          value: 366.7
          detail: 如果 Brevo 最终按估值受压的广义 CRM 标的交易，所需 ARR。
        - label: 4.0x
          value: 275
          detail: 如果公司估值倍数落在高质量上市营销软件公司附近，所需 ARR。
        - label: 5.0x
          value: 220
          detail: 接近当前隐含私募估值的低端。
        - label: 5.5x
          value: 200
          detail: 约 €1.1B 估值对应略高于 €200M ARR 的位置。
        - label: 6.5x
          value: 169.2
          detail: 需要市场给出明确的私募成长溢价。
    approximationNotes: 数值为以百万欧元计的 ARR；因确切现金、债务和优先权结构未公开，这里使用简化企业价值代理值。
    claimRefs:
      - CV040
      - CV041
      - CV043
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 悲观、基准、乐观三种情景隐含的三年退出价值区间。
    data:
      items:
        - label: 悲观
          low: 700
          mid: 840
          high: 980
          detail: 以约 €1.1B 入场，毛 MOIC 约 0.6x-0.9x。
        - label: 基准
          low: 1080
          mid: 1220
          high: 1450
          detail: 稀释和优先权之前，毛 MOIC 约 1.0x-1.3x。
        - label: 乐观
          low: 1820
          mid: 2100
          high: 2520
          detail: 如果执行继续强劲，毛 MOIC 约 1.7x-2.3x。
    approximationNotes: 数值为以百万欧元计的企业价值代理值；由于确切资本结构仍未披露，不应将其解读为普通股结果。
    claimRefs:
      - CV044
      - CV045
      - CV046
      - CV047
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投委会式评分卡，将公司质量和入场质量拆开看。
    data:
      items:
        - label: 增长证据
          value: 7/10
          detail: 2024 年 ARR €179M 以及 2025 年 >€200M ARR 目标，是可信的正向锚点。
        - label: 盈利能力证据
          value: 7/10
          detail: 两位数 EBITDA 的说法有帮助，但完整利润率披露仍缺位。
        - label: 产品广度
          value: 8/10
          detail: CRM、消息、AI 和收购清楚地把版图拓宽到邮件简报之外。
        - label: 客户规模
          value: 8/10
          detail: 约 600,000 名客户和 1,000+ 名员工意味着真实运营规模。
        - label: 竞争防护
          value: 5/10
          detail: 价格优势存在，但生态宽度仍落后于更大同行。
        - label: 披露质量
          value: 4/10
          detail: 精确投后估值、优先权、NRR 和毛利率仍缺失。
        - label: 入场估值
          value: 4/10
          detail: 隐含 5x-5.5x ARR 相比 2026 年 7 月上市可比公司显得有溢价。
        - label: 新资金可投性
          value: 5/10
          detail: 公司值得关注，但当前定价下，吸引力仅在条件满足时成立。
    approximationNotes: 分数是为投委会框架服务的分析判断，并非标准化外部评级。
    claimRefs:
      - CV004
      - CV010
      - CV016
      - CV017
      - CV041
      - CV042
      - CV043
      - CV047
