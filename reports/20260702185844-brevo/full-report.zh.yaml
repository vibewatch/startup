        - 基于定价的估算仍只能停留在情景推演，而不是事实
        - 要求提供各档付费账户数、免费到付费转化率，以及按套餐和模块拆分的收入
    notes: 这些缺口决定叙事能否从方向性很强，推进到模型可承销。仅靠已抓取的公开来源，无法补齐其中任何一项。
