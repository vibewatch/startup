      - 投资论点
      - 反论点
      - 何种证据会改变判断
    rows:
      - - 增长证据
        - '>€200M ARR 和双位数 EBITDA 表明公司已有真实规模，不只是故事股。'
        - 期末 ARR、NRR 和毛利率未披露，质量可能被高估。
        - 经审计的 2026 年 ARR 桥接、利润率和留存披露。
      - - 产品宽度
        - Brevo 已明显走出新闻简报，进入更广的 CRM、消息和 AI 工具。
        - 评论来源仍指出 CRM、AI 和集成限制，可能压住扩张收入。
        - 产品附加率和企业队列数据。
      - - 市场地位
        - 美国和中端市场动能，足以支撑 Brevo 相较增速较慢的公开同行享有一定溢价。
        - 披露更少，私募投资者却仍在支付高于公开 SaaS 的倍数。
        - 证明美国业务占比和中端市场加购能持续复合增长。
      - - 战略期权价值
        - 11 笔收购加 AI 投资能拓宽平台，抬高战略价值。
        - 整合和商业化风险也同样可能摧毁溢价倍数支撑。
        - 收购 KPI 包和 AI 货币化数据。
      - - 可比背景
        - Mailchimp 和上市 CRM 软件公司表明，这个品类可以支撑有意义的价值创造。
        - Mailchimp 是 2021 年战略性私有化交易；2026 年公开可比公司要求更严格的入场纪律。
        - 更便宜的入场价格，或 Brevo 配得上高于 Klaviyo 倍数的证据。
    notes: 反论点主要围绕价格、披露和耐久性，而不是公司质地短期崩塌。
