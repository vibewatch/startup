      - number: '4.4'
        title: 财务结论与披露阻塞点
        blocks:
          - type: paragraph
            body: >-
              公开层面对 Brevo 的结论是：规模、盈利轨迹和战略灵活性有利，但承销精度只能给中等信心。 正面案例是真实的：Brevo 有宽平台、异常可见的定价信号、500,000+ 到 600,000+ 客户基础、
              €200 million 以上 ARR 下限、双位数 EBITDA，以及足够新资本同时推进 AI、M&A 和美国增长。 来自 Adbloom、Buffalo Grill 和 Suntransfers
              的客户证明支持 Brevo 能在基础邮件简报之外 变现多个工作流。负面案例不是困境，而是不透明。独立评论指出产品和集成摩擦；公开来源不披露手头现金、 月度消耗、现金跑道、债务条款、NRR、流失、CAC
              回收期，或按计划和渠道拆分的实际收入组合。 这组缺失很重要，因为 Brevo 低端标价显然不是全部故事：公司必须在较小付费子集上做出比入口层级暗示
              更深的变现，但准确机制仍是私有信息。因此，本章支持一个中等信心结论：Brevo 看起来像一个规模化、 盈利增长型 CRM 资产，具备有意义的扩张可选性，但准确估值、利润率结构和资本充足性仍需要管理层材料，
              不能靠公开资料重建。
