tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / User / Payer
  - Representative evidence
  - Primary use cases
  - Geography / scale signal
  - Key gap
  rows:
  - - Self-serve SMB senders and operators
    - Buyer = founder/marketer/operator; user = same team; payer = card-funded self-serve account
    - Free plan, WordPress plugin funnel, GetApp small-business commentary, TrustRadius small-team reviewers
    - Newsletters, list management, simple automation, transactional SMTP
    - Official pages lead with free / Starter / Standard tiers; review proof is dense among small teams
    - No public split between free accounts, paying SMBs, and true mid-market customers
  - - Ecommerce and retail brands
    - Buyer = CRM/ecommerce/retention lead; user = marketing + loyalty teams; payer = ecommerce or CRM budget
    - Alltricks, L’Occitane, Buffalo Grill, KFC, Fnac Darty
    - Cart recovery, personalized campaigns, wallet loyalty, customer data activation
    - European retail brands dominate the public reference set; outcomes include basket uplift and wallet adoption
    - No ARR or retention disclosure by retail cohort
  - - Transactional and regulated digital platforms
    - Buyer = product/ops/IT/compliance; user = patients, travelers, platform members; payer = central platform budget
    - Doctolib, Air Europa, Kenya Airways
    - Appointment reminders, verification, reservation updates, loyalty emails
    - Public proof includes 75M emails/month and 350k+ wallet passes
    - Contract size, renewal rate, and expansion economics are not public
  - - Enterprise IT and security-sensitive deployments
    - Buyer = IT, IAM, data, or digital platform lead; user = internal operators or downstream business teams; payer = enterprise platform budget
    - Fnac Darty IAM/SSO, KFC CDP, Doctolib API stack
    - SSO, centralized access, unified customer view, event activation
    - Signals credible upmarket motion beyond newsletter tooling
    - Proof depth is still thinner than SMB/self-serve evidence volume
  - - Non-profit and mission organizations
    - Buyer = fundraising or digital donor team; user = fundraisers/contact-center staff; payer = donor-funded operating budget
    - Solidarités International plus NGO discounts on corporate pages
    - Fundraising campaigns, donor lifecycle automation, database segmentation
    - Brevo explicitly courts non-profits and has a named French humanitarian reference
    - No disclosed NGO customer count or donor-retention benchmarks
  - - Agencies, consultants, affiliates, and publishers
    - Buyer = agency owner or consultant; user = service team managing client accounts; payer = partner via commissions or agency clients
    - Agency program, expert directory, affiliate program, TrustRadius agency reviewer
    - Client onboarding, lifecycle marketing, CRM setup, referrals
    - Formal recurring revenue share and featured partner listings show channel depth
    - No public partner-sourced ARR share or partner-led churn data
  notes: Segments combine official positioning, independent reviews, and named case studies. They describe the observable public customer mix, not a disclosed revenue split.
