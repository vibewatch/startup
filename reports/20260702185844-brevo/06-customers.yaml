- id: TU006
  title: Channel / agency dynamics table
  columns:
  - Channel motion
  - Target customer
  - Economics / support model
  - Public evidence
  - Implication
  - Key gap
  rows:
  - - Free and starter self-serve
    - Solopreneurs, SMB marketers, first-time senders
    - Free plan plus low starter pricing; no-credit-card onboarding
    - Pricing page, WordPress plugin, GetApp small-business commentary
    - Broadens the top of funnel and supports 600k-customer scale
    - No free-to-paid or free-to-inactive funnel disclosed
  - - Standard / Professional upsell
    - Small businesses and lower-midmarket operators adding automation or channels
    - Higher price points add automation, reporting, WhatsApp, push, and support
    - Pricing page plus review commentary on advanced-feature gating
    - Supports ACV lift once customers mature beyond basic campaigns
    - No module attach rate or plan-migration data disclosed
  - - Enterprise direct sales
    - Compliance-heavy, 1M+ contact, or multi-brand organizations
    - Custom pricing, SSO, tailored onboarding, and strategic support
    - Pricing page, Doctolib, Fnac Darty, DACH sales press
    - Validates upmarket potential and longer-lived workflows
    - No enterprise renewal or sales-cycle data disclosed
  - - Agency partner referrals
    - Agencies and consultants managing multiple client accounts
    - 10% / 20% / 25% monthly revenue share; multi-account management; directory listing
    - Agency program page and agency TrustRadius example
    - Can scale SMB/midmarket acquisition and reduce implementation friction
    - No partner-sourced ARR or partner-quality distribution disclosed
  - - Expert directory sourcing
    - Customers seeking hands-on setup or lifecycle specialists
    - Featured elite / pioneer / elite-plus partners surfaced in the directory snapshot
    - Expert directory landing page
    - Adds external delivery capacity and specialist vertical expertise
    - Fetched page is only a snapshot, not a complete partner census
  - - Affiliate / publisher program
    - Bloggers, creators, and publishers attracting very small businesses
    - Fixed commissions with a 90-day cookie via PartnerStack
    - Affiliate program page
    - Extends content-led acquisition reach beyond direct search and sales
    - No disclosed lead quality, fraud rate, or conversion-to-retention data
  notes: This table separates direct and indirect acquisition paths. The public record is good on partner incentives and weak on partner-attributed revenue quality.
