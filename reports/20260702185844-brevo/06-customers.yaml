- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Type
  - Impact
  - Diligence path
  rows:
  - - Free-to-paid upgrade motion via self-serve entry
    - Expansion driver
    - Low-friction acquisition can expand into paid plans once volume, automation, or support needs rise
    - Request free-to-paid conversion, time-to-upgrade, and upgrade conversion by plan tier
  - - Module expansion from email into SMS, WhatsApp, push, wallet, CRM, and CDP
    - Expansion driver
    - Raises ACV and embeds Brevo deeper in customer workflows after the initial landing use case
    - Request attach rates and expansion ARR by module and by initial product landed
  - - Agency-led client acquisition and implementation
    - Expansion driver
    - Partners can widen SMB and lower-midmarket reach without Brevo staffing every implementation directly
    - Request partner-sourced ARR, partner retention, and gross-margin impact versus direct sales
  - - Mid-market and DACH enterprise push
    - Expansion driver
    - Could diversify the base away from pure self-serve SMBs and improve contract quality
    - Request win rates, sales cycles, and net retention for DACH and mid-market cohorts
  - - Vendor-authored proof concentration
    - Concentration risk
    - Visible customer success may overstate independently validated production depth because most detailed proof is Brevo-hosted
    - Obtain customer-authored references, public procurement records, or direct reference calls
  - - Top-customer revenue opacity
    - Concentration risk
    - The public record gives no view into largest-account ARR share or renewal concentration
    - Request top-10 ARR concentration, largest-customer share, and concentration trend
  - - Regional concentration opacity
    - Concentration risk
    - France/Germany/U.S. concentration is disclosed at revenue level but not at customer or ARR-by-segment level
    - Request ARR and customer counts by country, region, and plan type
  - - Plugin-led implementation friction
    - Concentration risk
    - Negative WordPress experiences can impair satisfaction in a meaningful self-serve channel even if the core platform is sound
    - Request plugin attach rate, error incidence, and churn reasons for WordPress-led customers
  notes: The expansion drivers are visible in pricing, partner, and case-study materials; the concentration risks are mostly created by missing commercial disclosure rather than negative customer adoption proof.
