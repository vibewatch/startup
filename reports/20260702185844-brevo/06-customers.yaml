figures:
- id: FU001
  title: Customer journey map — how Brevo lands and expands from SMB entry into higher-value use cases
  type: journey-map
  layout: wide
  summary: 'The public evidence points to a repeat journey: affordable first use, live delivery proof, multichannel adoption, partner-assisted setup, and enterprise-grade expansion for the largest accounts.'
  approximationNotes: This journey is inferred from pricing pages, partner programs, reviews, and named case studies. Stage ordering is directional rather than cohort-measured because no funnel conversion data is public.
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU026
  - CU028
  - CU032
  - CU038
  - CU045
  data:
    items:
    - label: 'Stage 1: Affordable trial'
      description: Free plan, Starter tier, or WordPress plugin lets a small team try Brevo with minimal procurement friction.
      buyerTrigger: Need email sending or simple CRM on a low budget
      brevoValue: Free or low-cost setup with immediate sending capacity
      risk: Large free base may not convert into durable paid usage
    - label: 'Stage 2: First live workload'
      description: Customer proves one concrete use case such as newsletters, transactional email, or basic automation.
      buyerTrigger: Need a live campaign or operational message stream quickly
      brevoValue: Templates, SMTP, segmentation, and deliverability tools
      risk: Customers may stay shallow if only one workflow matters
    - label: 'Stage 3: Multichannel activation'
      description: Customers add SMS, WhatsApp, push, wallet, or richer automation after the first workload succeeds.
      buyerTrigger: Need higher engagement, loyalty, or lifecycle orchestration
      brevoValue: Single platform across channels and richer analytics
      risk: Upgrade friction or support gaps can slow adoption
    - label: 'Stage 4: Partner-assisted implementation'
      description: Agencies, consultants, or affiliates help onboard and manage clients that need more hands-on execution.
      buyerTrigger: Customer lacks internal lifecycle or CRM expertise
      brevoValue: Revenue-share incentives and expert directory support service delivery
      risk: Experience quality becomes partially dependent on partners or plugins
    - label: 'Stage 5: Enterprise expansion'
      description: Large accounts adopt API, wallet, CDP, SSO, or data-sensitive workflows once Brevo is trusted operationally.
      buyerTrigger: Need compliance, scale, identity control, or customer-data unification
      brevoValue: Enterprise pricing, tailored onboarding, SSO, CDP, and strategic support
      risk: Public retention and concentration data are still absent even when large logos exist
