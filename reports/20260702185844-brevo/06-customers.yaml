chapter:
  number: 6
  title: Customers
  summary: 'Brevo’s public customer footprint is large and still visibly SMB-heavy: official materials now say 600,000 customers, free/self-serve pricing remains central, and independent review surfaces are dominated by small-business and agency use cases. At the same time, named proof shows credible expansion into European and global mid-market or enterprise deployments across transactional API, loyalty wallet, CDP, and IAM-sensitive workflows, while retention, churn, and concentration metrics remain undisclosed and implementation friction shows up in WordPress/plugin channels.'
sections:
- id: base-size-mix-and-geography
  title: Base Size, SMB Bias, and Europe-Centered Footprint
  body: 'Brevo’s public top line is strong: multiple official 2026-adjacent surfaces now cite 600,000 customers globally, and the about page, pricing page, and late-2025 funding release all repeat the same order of magnitude. The structure of that base still looks SMB-heavy. Brevo leads with a free plan, low-cost Starter and Standard tiers, unlimited contacts in the WordPress plugin funnel, and messaging aimed squarely at entrepreneurs and small businesses. Independent review surfaces point the same way: GetApp explicitly says the platform stands out for small businesses and startups, while TrustRadius examples include solo operators, small online stores, and a digital-marketing agency recommending the tool to entrepreneurs. Europe also remains a visible center of gravity. Brevo is headquartered in Paris, says France, Germany, and the U.S. account for 65% of revenue, and is still making explicit DACH enterprise-sales investments. The named customer set further tilts European, with Doctolib,
    Alltricks, Buffalo Grill, L’Occitane, Solidarités International, Jurafuchs, and Fnac Darty all reinforcing that Brevo’s strongest public proof is still anchored in Europe even as U.S. and broader international expansion continues.'
