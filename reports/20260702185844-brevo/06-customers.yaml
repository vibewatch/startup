- calloutType: strength
  title: Large installed base with real proof beyond newsletters
  body: 'Brevo is no longer defensible only as a low-end email tool: the fetched proof set includes healthcare transactional API, airline and restaurant loyalty, CDP orchestration, and IAM-sensitive enterprise deployment.'
  claimRefs:
  - CU001
  - CU015
  - CU017
  - CU019
  - CU022
  - CU023
  - CU024
- calloutType: insight
  title: The SMB wedge is obvious, but the expansion wedge is where value accrues
  body: Free and low-cost acquisition surfaces explain scale, while named stories show the higher-value path is module expansion into API, wallet, loyalty, CRM, and CDP use cases.
  claimRefs:
  - CU004
  - CU005
  - CU032
  - CU038
  - CU045
- calloutType: risk
  title: Durability is still under-evidenced
  body: Public adoption proof is strong, but Brevo does not disclose NRR, churn, or top-customer concentration, and plugin/channel complaints show that some implementation surfaces can damage satisfaction even when the core platform looks attractive.
  claimRefs:
  - CU035
  - CU036
  - CU037
  - CU040
  - CU041
