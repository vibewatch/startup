  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal rate, and contract-length data by plan or segment.
    whyItMatters: Customer durability is the core missing variable in the public record; without it, customer breadth cannot be translated into high-confidence recurring-value quality.
    diligencePath: Request cohort retention tables by plan tier, churn reasons, expansion timing, and renewal schedules from management or data room exports.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 ARR share, largest customer share, vertical ARR mix, and public evidence of dependency on a few large accounts.
    whyItMatters: The public proof set is broad by vertical, but concentration can still be hidden inside a few enterprise or partner-heavy accounts.
    diligencePath: Request customer concentration schedules, largest-account renewal history, and ARR by vertical and plan tier.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: regional-mix
    missingEvidence: Customer count and ARR split by country or region, including Europe vs. United States and by customer size segment.
    whyItMatters: Europe strength is plausible, but the public record currently proves it through partial revenue concentration and case-study geography rather than a customer ledger.
    diligencePath: Request customer count, ARR, and net retention by geography alongside enterprise vs. SMB segmentation.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU001
    - TU002
  - type: private-evidence-only
    severity: material
    topic: partner-channel-revenue
    missingEvidence: Share of new customers and retained ARR sourced by agencies, affiliates, and expert partners versus direct channels.
    whyItMatters: Channel leverage can improve growth efficiency, but it can also introduce margin pressure, uneven implementation quality, or dependence on external partners.
    diligencePath: Request partner-attributed pipeline, booked ARR, churn, and customer-success outcomes by channel source.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU005
    - TU006
  - type: enumeration-incomplete
    severity: minor
    topic: independent-customer-proof
    missingEvidence: Customer-authored engineering posts, public procurement records, or contract attestations for the largest marquee logos named in Brevo press and marketing.
    whyItMatters: The current chapter can prove real deployments, but many of the deepest outcome claims still depend on vendor-hosted case studies rather than independent evidence owners.
    diligencePath: Ask for direct reference calls, customer-authored materials, or non-Brevo procurement and implementation records for marquee accounts.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU003
