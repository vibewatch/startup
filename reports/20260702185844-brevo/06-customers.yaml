- id: named-customer-proof-by-vertical
  title: Named Customer Proof by Vertical and Use Case
  body: 'Brevo’s best public customer proof is no longer generic email marketing. The strongest travel references are Air Europa and Kenya Airways, both using Brevo for operational or loyalty communications rather than simple newsletters. Air Europa’s story centers on wallet passes and push notifications for reservations and offers, while Kenya Airways shows API-first loyalty growth and a stated plan to add broader marketing-platform capabilities later. Healthcare proof is unusually strong for a private CRM vendor: Doctolib’s case discloses 75 million transactional emails per month, 99% deliverability, sub-five-second delivery for 95% of messages, and explicit EU-hosting and GDPR requirements. Consumer brands show a different expansion path. Alltricks, Buffalo Grill, and L’Occitane use Brevo to drive engagement, cart recovery, wallet adoption, or purchase frequency; KFC uses Brevo CDP for unified customer data; Fnac Darty used Brevo in an IAM-sensitive internal deployment; Jurafuchs uses
    Brevo for onboarding, retention, and premium conversion; and Solidarités International uses it for fundraising. That spread supports real cross-vertical adoption, but most of the outcome detail still comes from Brevo-authored case studies rather than customer-authored postmortems or public procurement records.'
