- id: expansion-potential-concentration-and-gaps
  title: Expansion Potential, Concentration Risk, and Evidence Gaps
  body: 'The bull case on customer durability is straightforward but only partially verified. Public stories repeatedly show Brevo landing through one narrow wedge—transactional email, onboarding, campaign management, or loyalty messaging—and then expanding into adjacent modules such as SMS, push, wallet, CRM, or CDP. Corporate disclosures also say mid-market revenue is growing twice as fast as the rest of the business, which is consistent with a platform that can climb from SMB beginnings into larger accounts. The problem is that the public record stops short of the key diligence metrics investors actually need. No fetched source discloses NRR, GRR, churn, renewal timing, top-customer ARR share, top-10 concentration, or partner-sourced revenue share. Public proof is also more diverse by vertical than by evidence owner: the names span multiple industries, but most detailed outcomes live on Brevo-hosted case-study pages. That means the visible customer base looks broad and expansion-capable,
    yet concentration and retention remain under-evidenced. The right read is not that Brevo has weak customers; it is that the public record is strong on adoption proof and weak on durability accounting.'
