evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements confirming annual recurring revenue (ARR), gross margins by segment, and net cash
      burn.
    whyItMatters: >-
      Without audited segment revenue and burn data, SandboxAQ's multi-billion dollar private valuation cannot be
      independently validated.
    diligencePath: >-
      Request confidential disclosure schedules, management P&L statements, and customer retention cohorts under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: Complete executive roster, unannounced C-suite transitions, and full board of directors composition.
    whyItMatters: >-
      Full organizational visibility is necessary to evaluate key-person dependencies and executive bandwidth across
      dual cyber and biopharma business units.
    diligencePath: >-
      Verify state corporate filings and confirm active executive leadership directory directly with company legal
      counsel.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Exact equity ownership percentages, liquidation preferences, and secondary transaction records across Series A
      through Series E investors.
    whyItMatters: >-
      Detailed cap table mechanics determine economic returns, control rights, and investor alignment in subsequent
      financing rounds or public offerings.
    diligencePath: Inspect cap table capitalization ledger and investor rights agreements during confirmatory diligence.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: arr-segmentation
    missingEvidence: >-
