      licenses (AQtive Guard) and non-recurring government/defense SBIR pilots.
    whyItMatters: >-
      Without segmented ARR confirmation, evaluating the sustainability of SandboxAQ's $5.75 billion valuation against
      realistic addressable market capture remains speculative.
    diligencePath: >-
      Request confidential management financial disclosure of product-line ARR, customer retention metrics, and software
      gross margins during confirmatory diligence.
    relatedQuestionRefs:
