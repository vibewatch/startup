    title: "Federal Procurement Cycle and Revenue Conversion Risk"
    body: "While SandboxAQ holds high-profile engagements with the Department of War and Air Force, public sector SBIR Phase I awards and discovery prototypes carry high conversion friction. Moving from automated discovery inventory to recurring multi-million-dollar migration contracts across federal agencies requires navigating multi-year budgeting and procurement hurdles."
