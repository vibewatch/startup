      - "CR004"
      - "CR005"
  - calloutType: "insight"
    title: "Classical GPU Compute Overhead vs. Quantum Hardware Horizon"
    body: "Because fault-tolerant quantum processors remain years away, SandboxAQ's commercial value proposition centers on Large Quantitative Models running on classical Nvidia GPU clusters. This shifts the near-term operational risk from quantum physics breakthroughs to classical compute unit economics, GPU cluster access, and gross margin sustainability."
