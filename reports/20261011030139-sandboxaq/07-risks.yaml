  title: "Risks"
  summary: "Comprehensive diligence risk register evaluating SandboxAQ's regulatory compliance mandates, operational GPU compute dependencies, federal procurement concentration, and undisclosed financial burn against its $5.3B valuation."
sections:
  - id: "regulatory-and-compliance-risks"
    title: "Regulatory Mandates and Federal Compliance Friction"
    body: "Transitioning enterprise and government architectures to post-quantum cryptography involves protracted compliance cycles and navigating bureaucratic procurement standards. While the Office of Management and Budget has established federal directives requiring agencies to inventory systems vulnerable to quantum attacks, actual agency transitions take years to execute. Store-now-decrypt-later harvesting operations pose an immediate operational threat where adversaries intercept and store encrypted data to decrypt once quantum hardware matures. SandboxAQ addresses these requirements through NIST National Cybersecurity Center of Excellence collaborations and its FedRAMP Ready cloud certification. However, lingering ambiguity around cryptographic agility mandates and federal implementation timelines creates timing risk for commercial deployment."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR012"
      - "CR013"
    tableRefs:
      - "TR001"
  - id: "operational-and-technical-execution-risks"
    title: "Technical Dependencies and Classical Compute Constraints"
    body: "Despite branding centered on quantum breakthroughs, SandboxAQ's near-term product delivery depends fundamentally on classical compute infrastructure and advanced numerical modeling rather than operational quantum hardware. The company's Large Quantitative Models rely heavily on high-performance Nvidia GPU clusters to execute complex simulations across drug discovery and materials science. This operational structure makes the company vulnerable to classical hardware price volatility, GPU cluster availability, and high infrastructure operating overhead. Furthermore, integrating acquired technologies such as Good Chemistry's computational chemistry platform introduces technological synchronization challenges across software development kits and enterprise workflows. Because commercially viable quantum computers remain several years away, SandboxAQ must sustain competitive differentiation against pure classical AI simulation providers while managing substantial ongoing cloud and GPU infrastructure costs."
    claimRefs:
      - "CR004"
      - "CR008"
      - "CR009"
      - "CR010"
    tableRefs:
      - "TR002"
  - id: "partner-and-customer-dependencies"
    title: "Counterparty Concentration and Go-to-Market Channels"
    body: "SandboxAQ relies heavily on a narrow group of high-profile federal sponsors and strategic systems integrators to drive enterprise adoption. The company's highest-profile cybersecurity deployment is a five-year agreement with the Department of War CIO for automated cryptographic discovery across defense systems. However, earlier defense engagements, such as its Air Force Phase I SBIR contract, represent relatively modest exploration efforts with undisclosed dollar values, highlighting the difficulty of converting prototype demonstrations into durable, recurring software revenue. On the commercial side, SandboxAQ depends on global integration partners like Deloitte and EY to identify vulnerabilities and implement cryptographic migration for enterprise clients. This channel dependency leaves customer acquisition velocity subject to partner prioritization and channel alignment, creating customer concentration risk while direct enterprise software distribution remains in development."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR009"
      - "CR011"
    tableRefs:
      - "TR003"
  - id: "composite-risk-evaluation-and-thesis-breaks"
    title: "Composite Risk Evaluation and Thesis-Break Scenarios"
    body: "A comprehensive assessment of SandboxAQ reveals substantial divergence between its $5.3 billion to $5.6 billion private market valuation and its verifiable commercial fundamentals. Having raised more than $950 million in total funding across multiple rounds, the company carries heavy capital expectations from prominent institutional backers including T. Rowe Price and Breyer Capital. However, core financial metrics—such as annual recurring revenue, gross margins by product line, and monthly cash burn—remain undisclosed, preventing independent verification of software revenue quality. Key thesis-break triggers for investors include any stall in federal agency contract conversion from discovery prototypes into paid multi-year software deployments, adverse shifts in NIST or OMB compliance deadlines that reduce enterprise migration urgency, or gross margin degradation caused by escalating classical GPU cluster training expenditures."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR010"
      - "CR014"
      - "CR015"
    figureRefs:
      - "FR001"
