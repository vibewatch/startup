      - number: '8.2'
        title: Financing History, Cap Table Profile, and Valuation Context
        blocks:
          - type: paragraph
            body: >
              Since spinning out from Alphabet in March 2022 under founder Jack Hidary and chairman Eric Schmidt,
              SandboxAQ has raised over $950 million in aggregate funding across multiple financing rounds. Following an
              initial $500 million raise, the company raised more than $300 million in December 2024 at a $5.3 billion
              pre-money valuation ($5.6 billion post-money), before completing its April 2025 Series E round that raised
              over $450 million and valued the firm at $5.75 billion. The syndicate includes premier institutional and
              strategic backers such as T. Rowe Price, Breyer Capital, Fred Alger Management, Google, NVIDIA, BNP
              Paribas, and Ray Dalio. However, the company remains pre-profitability with substantial capital intensity
              in R&D and computing infrastructure, creating dilution and down-round risks if enterprise adoption cycles
              elongate or macro IT budgets contract.
            claimRefs:
