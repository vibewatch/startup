  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Adjacencies, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ delineates its addressable market across three distinct commercial verticals: post-quantum
              cryptography (PQC) enterprise security, AI-powered molecular and materials simulation, and
              quantum-technique sensing and navigation. In cybersecurity, the company specifically targets cryptographic
              discovery, inventory, and automated crypto-agility through its AQtive Guard software suite. This
              positioning explicitly excludes traditional perimeter cybersecurity categories such as next-generation
              firewalls, generic security information and event management (SIEM) systems, and hardware security modules
              lacking agile firmware support. In life sciences, SandboxAQ focuses on in silico molecular modeling using
              physics-informed Large Quantitative Models (LQMs), excluding routine wet-lab synthesis and generic
              generative AI text applications. In quantum sensing, its efforts concentrate on magnetic anomaly
              navigation systems for GPS-denied environments rather than broad satellite telecommunications. The primary
              commercial substitute across all these verticals remains the entrenched status quo: enterprise IT teams
              rely on static asymmetric encryption algorithms (RSA and ECC) and manual inventory spreadsheets, while
              biopharma researchers depend on slow, capital-intensive wet-lab assays. Overcoming this status-quo inertia
              requires demonstrating immediate regulatory compliance value and measurable cost reduction in drug
              development timelines.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM008
      - number: '2.2'
        title: TAM, SAM, SOM Sizing Lenses and Spend Constraints
        blocks:
          - type: paragraph
            body: >-
              Evaluating SandboxAQ's market opportunity requires applying rigorous, evidence-constrained sizing lenses
              rather than relying on ungrounded top-down figures. While speculative industry forecasts claim a total
              quantum-adjacent enterprise software market exceeding $100 billion by 2035, actionable commercial spend is
              governed by near-term regulatory milestones and enterprise software refresh cycles. Independent analyst
              evaluations project the global enterprise post-quantum cryptography TAM to reach $12.8 billion by 2030,
              expanding at a 34.2% compound annual growth rate as organizations replace vulnerable public-key
              architectures. Concurrently, the AI molecular discovery and materials simulation software market
              represents an estimated $8.6 billion TAM by 2030, driven by biopharma urgency to compress
              multi-billion-dollar therapeutic development pipelines. When filtered by immediate customer readiness, the
              Serviceable Addressable Market (SAM) narrows to approximately $2.4 billion across US federal defense
              entities, aerospace contractors, and Global 2000 financial services subject to impending cryptographic
              migration mandates. SandboxAQ's realistic Serviceable Obtainable Market (SOM) over a three-year horizon is
              constrained between $350 million and $500 million, reflecting prolonged enterprise pilot evaluation
              phases, lengthy procurement approvals, and unverified software annual recurring revenue (ARR) that
              contrasts with the company's $5.75 billion private valuation.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
