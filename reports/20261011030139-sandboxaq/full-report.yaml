  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Recommendation, and Decision Matrix
        blocks:
          - type: paragraph
            body: >
              SandboxAQ presents a compelling technical thesis centered on Large Quantitative Models (LQMs) that
              simulate physical phenomena across cryptography, molecular biology, and GPS-denied navigation. However,
              the commercial thesis faces severe information asymmetry due to the complete lack of verified ARR, gross
              margin disclosure, and customer retention metrics. The reported $5.75 billion valuation in its April 2025
              Series E round represents an extraordinary valuation multiple on unconfirmed revenue, making an investment
              stance of buy unsupported by public evidence. We recommend a track posture with a high risk rating and a
              stretched valuation stance. The primary thesis-break triggers include prolonged lack of financial
              disclosure, failure to convert federal prototype programs into recurrent multi-year enterprise contracts,
              or significant multiple compression during next-round equity pricing.
            claimRefs:
