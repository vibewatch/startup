      - number: '8.3'
        title: Scenario Analysis, Comparables, and Key Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Given the opacity of SandboxAQ's financial statements, scenario valuation requires evaluating structural
              divergence across bull, base, and bear operating paths. In the bull scenario, mandatory federal
              post-quantum migrations and biopharma LQM licensing accelerate ARR toward hundreds of millions, validating
              a multi-billion dollar platform valuation. In the base scenario, enterprise adoption progresses
              deliberately with high sales cycles, sustaining moderate ARR growth while leaving the $5.75 billion
              valuation vulnerable to multiple compression against public cybersecurity peers (which trade closer to
              8-15x revenue). In the bear scenario, customer concentration, sales execution friction, and alternative
              quantum or classical approaches trigger down-round risk. Key diligence asks focus on segment ARR
              breakdown, cash burn rate, gross margin profile, and customer expansion rates.
            claimRefs:
