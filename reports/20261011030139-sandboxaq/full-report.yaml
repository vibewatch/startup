      - number: '5.4'
        title: Enterprise Deployment, Workflows, and Trust Controls
        blocks:
          - type: paragraph
            body: >-
              Deployment models vary across product lines to match customer security requirements and regulatory
              frameworks. For enterprise cybersecurity, AQtive Guard operates as a centralized management plane that
              integrates with enterprise networks, software repositories, and Public Key Infrastructure endpoints to
              continuously discover cryptographic dependencies. This capability addresses looming
              store-now-decrypt-later attacks, wherein adversaries harvest encrypted communications today with the
              intent to decrypt them once quantum computers emerge. The platform gained notable defense validation
              through an initial 2022 Air Force SBIR research contract and a subsequent five-year agreement with the
              Department of War Chief Information Officer. To support deployment across regulated commercial sectors,
              SandboxAQ partners with global systems integrators like Deloitte and EY, ensuring automated cryptographic
              discovery aligns with evolving NIST post-quantum migration mandates.
