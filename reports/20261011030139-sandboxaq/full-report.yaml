      - number: '4.4'
        title: Capital Adequacy, Burn Risk, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ maintains a well-capitalized balance sheet following substantial institutional venture backing,
              having raised over $950 million in cumulative equity financing since spinning out from Alphabet in 2022.
              The company established a private post-money valuation of $5.6 billion following a December 2024 funding
              round that secured over $300 million from major growth investors including Fred Alger Management, T. Rowe
              Price, and Breyer Capital, which followed an earlier $500 million capital raise. While this capital
              cushion provides multi-year operational runway to pursue computationally intensive LQM development without
              immediate insolvency pressure, the company's valuation appears stretched against unverified fundamentals.
              SandboxAQ withholds its annual recurring revenue, monthly burn rate, customer renewal retention, and
              liquid cash reserves. For investment underwriters, this complete lack of financial disclosure represents a
              primary diligence blocker: without audited revenue run-rates or gross margin data, determining whether a
              $5.6B valuation reflects reasonable revenue multiples or extreme multiple expansion remains impossible.
              Until management discloses verified commercial traction and cash consumption metrics, financial
              underwriting must classify SandboxAQ as a high-risk diligence candidate with unconfirmed unit economics.
            claimRefs:
              - CI006
              - CI008
              - CI009
              - CI014
              - CI015
