  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Target Buyers
        blocks:
          - type: paragraph
            body: >
              SandboxAQ segments its commercial customer base across four primary vertical sectors: defense and national
              security, biopharmaceutical research, commercial aerospace, and clinical healthcare sensing. In the
              defense and federal security domain, buyers represent cabinet-level Chief Information Officers,
              cybersecurity operational commands, and defense intelligence agencies tasked with mandate-driven
              post-quantum cryptographic transitions. In biopharmaceuticals and materials science, buyers are enterprise
              R&D leaders, computational chemists, and discovery biologics executives seeking accelerated molecular
              binding simulations. In aerospace and clinical diagnostics, user segments span aircraft manufacturers
              evaluating GPS-denied navigation systems and medical research institutions evaluating non-invasive cardiac
              magnetic sensing. This multi-sector footprint demonstrates the wide theoretical applicability of
              SandboxAQ's Large Quantitative Models across disparate physical chemistry and mathematical domains, yet
              also exposes the enterprise to diffuse go-to-market execution requirements across highly regulated and
              protracted procurement cycles.
