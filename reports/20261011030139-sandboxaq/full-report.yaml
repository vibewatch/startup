  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological evolution of SandboxAQ from Alphabet spinout through commercial defense contracts and Series E
      financing.
    data:
      items:
        - label: March 2022
          detail: >-
            Spun off from Alphabet as an independent entity with nine-figure initial funding; Jack Hidary named CEO and
            Eric Schmidt named Chairman.
          tone: positive
        - label: November 2022
          detail: >-
            Awarded Phase I SBIR contract by U.S. Air Force to evaluate quantum-resistant cryptography for military data
            architectures.
          tone: positive
        - label: February 2023
          detail: >-
            Closed $500 million Series D financing round to advance quantum simulation and cybersecurity software
            suites.
          tone: positive
        - label: August 2024
          detail: >-
            Joined OpenFold AI Research Consortium alongside Astex, Biogen, and other biopharma leaders to accelerate
            molecular modeling.
          tone: positive
        - label: December 2024
          detail: >-
            Reuters reported over $300 million raised at a $5.6 billion valuation to accelerate Large Quantitative Model
            (LQM) development.
          tone: positive
        - label: April 2025
          detail: Formally closed over $450 million Series E round backed by Google, NVIDIA, BNP Paribas, and Ray Dalio.
          tone: positive
        - label: October 2025
          detail: >-
            Unveiled OpenCryptography.com public vulnerability database exposing cryptographic risks in open-source
            software packages.
          tone: positive
        - label: December 2025
          detail: >-
            Entered five-year agreement with Department of War CIO for AQtive Guard deployment and launched AI-SPM
            cybersecurity suite.
          tone: positive
        - label: January 2026
          detail: >-
            Launched AQAffinity for structure-free drug potency prediction, expanding biopharma quantitative simulation
            portfolio.
          tone: positive
