      - number: '7.4'
        title: Composite Risk Evaluation and Thesis-Break Scenarios
        blocks:
          - type: paragraph
            body: >-
              A comprehensive assessment of SandboxAQ reveals substantial divergence between its $5.3 billion to $5.6
              billion private market valuation and its verifiable commercial fundamentals. Having raised more than $950
              million in total funding across multiple rounds, the company carries heavy capital expectations from
              prominent institutional backers including T. Rowe Price and Breyer Capital. However, core financial
              metrics—such as annual recurring revenue, gross margins by product line, and monthly cash burn—remain
              undisclosed, preventing independent verification of software revenue quality. Key thesis-break triggers
              for investors include any stall in federal agency contract conversion from discovery prototypes into paid
              multi-year software deployments, adverse shifts in NIST or OMB compliance deadlines that reduce enterprise
              migration urgency, or gross margin degradation caused by escalating classical GPU cluster training
              expenditures.
