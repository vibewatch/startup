  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Commercial Model
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ structures its commercial revenue across two primary pillars: enterprise commercial software
              subscriptions and government and defense contract awards. The company's core commercial offering centers
              on its Large Quantitative Models (LQMs), which combine artificial intelligence with physics-aware
              algorithms to solve complex enterprise problems in post-quantum cryptography, biopharma simulation, and
              GPS-denied navigation. In cybersecurity, SandboxAQ deploys its AQtive Guard suite as an enterprise
              software subscription that automates cryptographic asset discovery, inventory, and migration planning
              across large corporate networks. This commercial offering is complemented by deep ecosystem partnerships
              with leading security vendors, including CrowdStrike and Palo Alto Networks, which facilitate channel
              distribution and technical integrations for enterprise customers preparing for post-quantum cryptographic
              transitions. In parallel, SandboxAQ has secured significant multi-year government commitments, highlighted
              by a five-year deployment agreement with the Department of War Chief Information Officer for
              enterprise-wide cryptographic asset inventory, as well as early Air Force research contracts. This
              diversified structure pairs long-term, high-visibility defense engagements with scalable commercial
              software subscriptions, although segment-level revenue contributions between commercial and federal
              accounts remain undisclosed.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI010
              - CI011
