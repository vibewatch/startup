      - number: '6.4'
        title: Customer Concentration & Federal Procurement Friction
        blocks:
          - type: paragraph
            body: >
              Customer concentration risk is acute given SandboxAQ's heavy reliance on federal defense contracts and
              multi-year government procurement timelines. Federal agency modernization represents a massive budget
              opportunity, but transitioning large public sector infrastructure to post-quantum standards faces
              substantial institutional friction, protracted appropriations cycles, and complex multi-stakeholder
              governance. Leadership has acknowledged that U.S. government procurement compliance is slow and
              transitioning federal enterprises will take years. Furthermore, public sector engagements such as the
              initial Air Force SBIR award often prohibit disclosure of contract values, preventing outside investors
              from independently assessing revenue quality, gross margin profiles, and single-customer concentration.
              Should federal defense priorities shift or agency implementation deadlines experience legislative delays,
              revenue predictability could face severe downside pressure.
            claimRefs:
              - CU005
