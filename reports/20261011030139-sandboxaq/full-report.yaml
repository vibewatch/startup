            title: Diligence Verdict — Track Pending Verified Revenue
            body: >
              SandboxAQ possesses rare technical credibility, a blue-chip investor base, and early defense customer
              wins. However, at a $5.75 billion headline valuation with undisclosed ARR and acknowledged
              commercialization hurdles, the risk-reward profile is unfavorable for capital deployment without
              audit-level financial disclosure and preferred equity terms verification.
