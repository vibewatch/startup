      - number: '3.3'
        title: Pricing opacity weakens buyer-level comparison
        blocks:
          - type: paragraph
            body: >-
              Public packaging evidence is too thin for an economic comparison. NeuronFeed labels SandboxAQ's pricing as
              enterprise but supplies no price, unit, discount structure, or contract term. The assigned sources
              likewise do not disclose realized pricing for AQtive Guard, simulation modules, AQNav, or AQMed.
              Integration may create switching costs once cryptographic assets and dependencies are continuously
              inventoried across a customer's environment, because replacing the system would require reproducing that
              visibility and workflow context. That is an analyst inference from the described deployment model, not
              measured retention evidence. Buyers can still multi-home by retaining existing security controls,
              scientific tools, or internal models alongside SandboxAQ, and no retained source quantifies exclusivity,
              migration cost, contract duration, or channel economics.
            claimRefs:
              - CP011
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP014
      - number: '3.4'
        title: Technical breadth is not yet a measured moat
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ's differentiating narrative combines language interfaces with quantitative models based on
              physics, chemistry, biology, and simulation. That framing is distinctive, but the evidence available to
              this chapter does not show superior benchmark results against direct competitors. Reuters quotes investor
              Jim Breyer saying the models can train on existing hardware such as Nvidia GPUs and may benefit from
              future quantum-chip advances. Existing hardware compatibility lowers adoption friction, yet it may also
              limit infrastructure exclusivity and leave differentiation in proprietary data, model quality, workflow
              integration, and execution. NeuronFeed detected no public API, webhooks, OAuth 2.0, SDKs, or MCP server on
              its review date, which suggests a weaker visible developer-distribution surface, although absence from
              that scan is not proof that private integration capabilities do not exist. Competitive durability
              therefore remains contingent on benchmark disclosure, customer retention, proprietary data rights, and
              repeatable deployment.
            claimRefs:
              - CP003
              - CP012
              - CP015
