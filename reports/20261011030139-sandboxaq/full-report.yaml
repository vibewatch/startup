      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ's enterprise go-to-market model navigates four distinct customer tiers with divergent economic
              buyers and budget ownership mechanisms. In federal defense, economic decision-making rests with department
              Chief Information Officers and military acquisition executives, exemplified by the US Department of War
              and the Department of the Air Force. These government customers utilize dedicated defense procurement
              allocations and Small Business Innovation Research (SBIR) vehicles to fund cryptographic inventory
              platforms and GPS-denied navigation tests. In commercial financial services, Chief Information Security
              Officers (CISOs) and infrastructure risk teams authorize expenditure from enterprise cybersecurity budgets
              to protect core transaction networks against Harvest Now, Decrypt Later (HNDL) data interception threats.
              In biopharma and specialty materials, budget authority shifts to Heads of R&D and Chief Scientific
              Officers who control therapeutic discovery budgets, seeking to accelerate lead identification through
              partnerships like SandboxAQ's integration with Anthropic's Claude. Finally, critical national
              infrastructure operators allocate operational technology (OT) security funds to audit embedded legacy
              encryption. These disparate purchasing dynamics require tailored value propositions, preventing uniform
              sales motions and lengthening overall enterprise conversion velocity.
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Adoption Catalysts, Structural Friction, and Valuation Realism
        blocks:
          - type: paragraph
            body: >-
              Enterprise adoption across SandboxAQ's portfolio is driven by powerful external catalysts but constrained
              by profound operational friction. The principal growth driver in cybersecurity is regulatory compulsion:
              binding federal directives, NIST post-quantum cryptographic standardization, and national security
              mandates establish rigid timelines requiring organizations to discover and catalog vulnerable encryption
              assets. In biopharma, economic pressure to reduce the decade-long, multi-billion-dollar cost of bringing
              novel therapeutics to market accelerates the adoption of physics-based quantitative simulation. However,
              severe structural constraints impede rapid budget deployment. Cryptographic migration is an exceptionally
              complex, multi-year endeavor across heterogeneous legacy enterprise systems, where altering core
              communication protocols introduces substantial operational downtime risks and high switching costs. In
              biopharma, computational predictions must still endure rigorous in vitro and clinical validation before
              generating economic returns. Crucially, third-party reporting documents conflicting private valuation
              benchmarks—ranging from $5.3 billion to $5.75 billion following funding rounds supported by Breyer Capital
              and T. Rowe Price—while verifiable recurring revenue remains undisclosed, leaving the commercial multiple
              vulnerable to scrutiny.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Divergence from Enterprise Sizing
            body: >-
              SandboxAQ's $5.75 billion private valuation implies a revenue multiple exceeding 100x on estimated
              recurring revenues, requiring massive expansion from defense pilots into full-scale enterprise software
              rollouts.
            calloutType: risk
            claimRefs:
              - CM001
              - CM003
              - CM014
          - type: callout
            title: Regulatory Timelines Anchor Near-Term PQC Demand
            body: >-
              Government mandates such as DoW requirements and NIST post-quantum standardization create a mandatory
              compliance timetable, forcing enterprise CISOs to allocate budget for cryptographic discovery regardless
              of macroeconomic headwinds.
            calloutType: insight
            claimRefs:
              - CM004
              - CM008
              - CM011
