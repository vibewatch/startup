      - number: '3.2'
        title: Government deployments are the clearest trust signal
        blocks:
          - type: paragraph
            body: >-
              The strongest competitive proof in the assigned evidence is public-sector adoption. DefenseScoop reported
              SandboxAQ's first U.S. military deal as a Phase I SBIR engagement to examine Air and Space Force
              cryptographic posture; the initial work was expected to last 90 days and might lead to follow-on phases. A
              later company release says the Department of War CIO is using AQtive Guard for automated discovery and
              inventory across its systems. These records support procurement credibility and a path to wider
              departmental access, but they are not independent performance benchmarks. The release is company-issued,
              the earlier contract value was undisclosed, and neither source compares detection coverage, migration
