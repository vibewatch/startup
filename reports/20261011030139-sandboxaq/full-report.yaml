        title: A portfolio creates several competitor sets
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ describes a broad quantitative-AI portfolio across pharma, energy, defense, and other markets,
              while the independent NeuronFeed profile lists drug discovery, materials prediction, cybersecurity,
              navigation, and medical applications. Reuters separately describes exposure to cybersecurity, encryption,
              and life sciences. The practical competitive boundary is therefore fragmented: scientific-software
              providers contest simulation workflows, security platforms and internal teams contest cryptographic
              inventory and migration, and conventional navigation or sensing systems contest the hardware-adjacent
              applications. This structure can diversify demand, but it also prevents a single brand or technical claim
              from establishing leadership across every category. The retained pool names no direct peer with enough
              comparable operating detail to support a complete vendor-by-vendor ranking, so the landscape below
