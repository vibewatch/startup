      - number: '4.2'
        title: Pricing Mechanics and Monetization Structure
        blocks:
          - type: paragraph
            body: >-
              Monetization across SandboxAQ's commercial portfolio relies on custom-quoted enterprise contracts
              combining recurring annual or multi-year software subscription fees with variable compute charges. Unlike
              standardized SaaS vendors with published tier pricing, SandboxAQ does not disclose list prices or seat
              licensing cards publicly. Enterprise customers seeking AQtive Guard or biopharma simulation models must
              engage direct sales representatives for bespoke pricing based on workload volume, infrastructure scope,
              and computational demand. A critical component of SandboxAQ's monetization model is the compute surcharge:
              because running Large Quantitative Models requires substantial mathematical processing, customers incur
              pass-through or metered compute charges tied directly to cloud resources consumed during model execution.
              In the public sector domain, pricing follows standard federal acquisition schedules, ranging from
              fixed-price Small Business Innovation Research awards to negotiated departmental task orders. Notably,
              contract values remain tightly controlled; company leadership explicitly declined to disclose the dollar
              value of its Air Force cryptographic contract citing customer restrictions. This absence of transparent
              contract values and list pricing obscures realized average contract values and baseline unit profitability
              for external analysts.
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
      - number: '4.3'
        title: Unit Economics, Cost Structure, and Gross Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              Analyzing SandboxAQ's cost structure and unit economics requires separating classical compute hosting and
              R&D talent investments from future quantum hardware dependencies. A vital technical and economic advantage
              is that SandboxAQ trains and runs its quantitative AI models on classical computing infrastructure,
              specifically utilizing high-performance Nvidia GPUs and standard cloud platforms rather than specialized,
              expensive quantum hardware. However, running complex physics-based simulations across molecular chemistry
              and enterprise cryptography generates heavy computational hosting costs, which act as a direct gross
              margin drag unless fully passed through to customers. Beyond compute COGS, SandboxAQ maintains a highly
              specialized technical workforce, with approximately 65% of team members holding doctorate degrees across
              physics, mathematics, cryptography, and artificial intelligence, driving substantial ongoing research and
              development payroll overhead. The company also invests in industry pre-competitive collaborations, such as
              the OpenFold AI Research Consortium alongside biopharma peers. Because SandboxAQ remains a private entity,
              it does not publicly report GAAP gross margins, customer acquisition cost payback periods, or net revenue
              retention rates, preventing independent confirmation of whether software unit economics conform to
              best-in-class enterprise software benchmarks.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
