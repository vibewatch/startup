        title: Exhibits
        blocks:
          - type: callout
            title: Quantitative AI Differentiation vs. LLM Generative AI
            body: >-
              Unlike consumer-facing large language models trained on massive text token corpora, SandboxAQ focuses on
              Large Quantitative Models (LQMs) that ingest numerical and physical relationship datasets. This
              architectural distinction underpins its core dual-track go-to-market strategy across life sciences
              simulation and post-quantum cryptographic security posture management.
            calloutType: insight
            claimRefs:
              - CO002
          - type: callout
            title: Commercial Financial Opacity and Valuation Sustainability
