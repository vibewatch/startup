  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Six-stage enterprise customer lifecycle from initial cryptographic assessment through systems integrator expansion
      and multi-vertical LQM platform adoption.
    data:
      items:
        - label: Assessment & Cryptographic Discovery
          stage: Assessment & Cryptographic Discovery
          description: >-
            Enterprise IT and security operations teams conduct automated inventory of public-key encryption
            vulnerabilities using AQtive Guard.
          touchpoints:
            - NIST NCCoE guidance frameworks
            - AQtive Guard ACDI scanning engine
          friction: Opaque legacy software supply chains and hardcoded encryption libraries delay full network visibility.
          expansionLoop: Discovery phase establishes the cryptographic baseline needed for remediation software licensing.
        - label: Pilot Demonstration & Prototype Trials
          stage: Pilot Demonstration & Prototype Trials
          description: >-
            Technical teams run targeted capability demonstrations such as DISA prototype trials or 90-day SBIR
            feasibility studies.
          touchpoints:
            - SBIR Phase I research contracts
            - DISA Emerging Technology prototype milestones
          friction: Security classification restrictions and non-disclosure clauses limit public marketing validation.
          expansionLoop: Successful prototype validation provides evidentiary proof required for federal agency authorization.
        - label: Systems Integrator Procurement & Contracting
          stage: Systems Integrator Procurement & Contracting
          description: Enterprise customers negotiate multi-year software deployment terms assisted by global advisory channels.
          touchpoints:
            - Deloitte GTM integration channel
            - EY enterprise risk consulting engagements
          friction: Complex governmental procurement rules and federal budget appropriations lengthen closing cycles.
          expansionLoop: Channel partner distribution enables scaled deployment across subsidiary agencies and enterprise units.
        - label: Production Deployment & Enterprise Standardization
          stage: Production Deployment & Enterprise Standardization
          description: >-
            Organization-wide rollout of AQtive Guard platform establishing continuous cryptographic inventory
            monitoring.
          touchpoints:
            - DoW CIO five-year enterprise agreement
            - Centralized cryptographic agility management
          friction: Multi-year implementation demands substantial ongoing IT operational support and agency coordination.
          expansionLoop: Standardized enterprise security layer anchors high gross retention and multi-year contract renewals.
        - label: Domain-Specific LQM Module Adoption
          stage: Domain-Specific LQM Module Adoption
          description: >-
            Customer accounts evaluate additional quantitative AI applications across navigation or biopharma
            simulation.
          touchpoints:
            - AQNav GPS-denied navigation flight trials
            - Molecular binding affinity computational modeling
          friction: Cross-functional budget separation between IT security and R&D divisions requires fresh buyer alignment.
          expansionLoop: Shared underlying LQM compute infrastructure lowers marginal cost for secondary module adoption.
        - label: Consortium Collaboration & Ecosystem Expansion
          stage: Consortium Collaboration & Ecosystem Expansion
          description: >-
            Enterprises collaborate in shared research consortia and industry-wide post-quantum standardization
            initiatives.
          touchpoints:
            - OpenFold AI Research Consortium
            - Commercial aerospace flight testing partnerships
          friction: Pre-competitive IP sharing structures require delicate legal structuring between commercial peers.
          expansionLoop: Ecosystem collaboration cements SandboxAQ as the default platform standard for physical-world AI.
    approximationNotes: >-
      Journey map reflects qualitative synthesis of documented customer engagement pathways across government defense
      and corporate enterprise clients.
    claimRefs:
      - CU003
      - CU004
      - CU009
      - CU010
      - CU011
      - CU012
