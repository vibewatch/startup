  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Quantitative AI Paradigm
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ defines its core value proposition at the convergence of artificial intelligence and
              quantum-inspired physics, establishing a distinct category termed Quantitative AI. Spun out of Alphabet in
              2022 after incubating since 2016, the company deliberately avoids developing quantum hardware, positioning
              its products entirely as software solutions running on classical enterprise infrastructure. While
              generative artificial intelligence relies on large language models trained on tokenized public web text,
              SandboxAQ builds Large Quantitative Models that train on high-dimensional numerical relationships,
              physical equations, and in silico simulation data. This physics-guided approach targets commercial and
              sovereign domains where high-quality empirical data is scarce, generating synthetic training sets to model
              molecular reactions, material degradation, and cryptographic asset distributions without incurring
              physical wet-lab or hardware delays.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
      - number: '5.2'
        title: Product Lines, Modules, and Domain Applications
        blocks:
          - type: paragraph
            body: >-
              The company commercializes four primary technology portfolios serving distinct enterprise and public
              sector buyers. In cybersecurity, the flagship AQtive Guard platform provides comprehensive automated
              cryptographic discovery and inventory, enabling enterprises to transition legacy cryptographic
              architectures toward post-quantum standards. In biopharma and materials science, the AQBioSim division
              leverages physics-based simulation algorithms to accelerate early-stage drug discovery and toxicity
              screening, supported by the January 2024 acquisition of Good Chemistry and its QEMIST Cloud and Tangelo
              SDK assets. In sovereign defense, SandboxAQ develops MagNav, an unjammable navigation platform utilizing
              quantum magnetic anomaly sensors and artificial intelligence noise filtering to deliver continuous
              GPS-denied positioning. Finally, in medical diagnostics, the CardiAQ division explores non-invasive
              magnetocardiography prototypes with clinical partners such as Mayo Clinic, expanding quantum biomagnetic
              sensing into clinical workflow environments.
