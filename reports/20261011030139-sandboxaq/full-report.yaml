      - number: '6.3'
        title: Retention Durability & Expansion Dynamics
        blocks:
          - type: paragraph
            body: >
              While SandboxAQ demonstrates credible commercial traction with marquee accounts, visibility into contract
              durability, gross retention, and net revenue retention (NRR) remains heavily obscured. SandboxAQ discloses
              no customer count, annual recurring revenue (ARR) run rate, or customer cohort retention curves. The
              company's expansion thesis relies on a multi-stage land-and-expand trajectory: landing within enterprise
              IT environments via cryptographic discovery and vulnerability scanning with AQtive Guard, before expanding
              into cryptographic agility remediation and specialized scientific LQM modules. To accelerate this
              enterprise onboarding loop, SandboxAQ established strategic go-to-market and integration partnerships with
              tier-one systems integrators Deloitte and EY, as well as formal collaboration with the National Institute
              of Standards and Technology (NIST) National Cybersecurity Center of Excellence. However, without disclosed
              expansion cohorts, the degree to which enterprise pilot customers expand into multi-million dollar annual
              recurring licenses remains an open diligence question.
