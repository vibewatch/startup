      - number: '6.2'
        title: Adoption Trajectory & Named Customer Proof
        blocks:
          - type: paragraph
            body: >
              Commercial adoption has evolved from initial exploratory research projects upon SandboxAQ's spinout from
              Alphabet in 2022 into multi-year defense engagements and joint corporate flight trials. In federal
              cybersecurity, SandboxAQ progressed from an initial 90-day Small Business Innovation Research (SBIR) Phase
              I contract with the U.S. Air Force in November 2022 to a landmark five-year agreement with the Department
              of War Chief Information Officer in December 2025. This department-wide contract leverages the AQtive
              Guard suite for automated cryptographic discovery and inventory, following a successful prototype
              demonstration with DISA's Emerging Technology QRC PKI program. In aerospace, SandboxAQ has conducted
              rigorous flight demonstrations of its AQNav magnetic anomaly navigation platform across both military and
              commercial airframes with the U.S. Air Force, Boeing, and Airbus. In life sciences, the company
              collaborates with global pharmaceutical leaders AstraZeneca and Sanofi to predict molecular binding
              affinities, and participates in the OpenFold AI Research Consortium alongside Biogen and Astex.
