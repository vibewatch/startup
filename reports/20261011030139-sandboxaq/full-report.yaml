  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Mandates and Federal Compliance Friction
        blocks:
          - type: paragraph
            body: >-
              Transitioning enterprise and government architectures to post-quantum cryptography involves protracted
              compliance cycles and navigating bureaucratic procurement standards. While the Office of Management and
              Budget has established federal directives requiring agencies to inventory systems vulnerable to quantum
              attacks, actual agency transitions take years to execute. Store-now-decrypt-later harvesting operations
              pose an immediate operational threat where adversaries intercept and store encrypted data to decrypt once
              quantum hardware matures. SandboxAQ addresses these requirements through NIST National Cybersecurity
              Center of Excellence collaborations and its FedRAMP Ready cloud certification. However, lingering
              ambiguity around cryptographic agility mandates and federal implementation timelines creates timing risk
              for commercial deployment.
            claimRefs:
