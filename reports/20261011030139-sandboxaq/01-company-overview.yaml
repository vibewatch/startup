chapter:
  number: 1
  title: "Company Overview"
  summary: "SandboxAQ is an Alphabet spinout delivering quantitative AI and physics-informed software across post-quantum cryptography and life sciences simulation, backed by over $950 million in capital at an estimated $5.6B to $5.75B valuation, while maintaining total private opacity regarding operational revenues and unit economics."
sections:
  - id: "origins-and-corporate-identity"
    title: "Corporate Identity, Origins, and Business Model"
    body: "SandboxAQ operates as an independent enterprise quantitative artificial intelligence software company, headquartered in Palo Alto, California. The enterprise originally incubated within Alphabet Inc.'s moonshot and advanced computing R&D ecosystem before formally spinning out in March 2022 as an autonomous corporation with independent capitalization, governance, and operating leadership. The company's core technological and commercial thesis centers on Large Quantitative Models (LQMs), which depart fundamentally from statistical large language models by ingesting numerical datasets, physics-based simulations, and quantum mechanics principles. Commercial operations target enterprise software deployments across post-quantum cybersecurity posture management, life sciences drug discovery acceleration, materials simulation, and GPS-denied navigation systems. Despite commanding substantial private market capital, SandboxAQ operates under strict disclosure opacity, refraining from publicly reporting revenue run-rates, annualized recurring revenues, or gross margin performance."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO008"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership, Governance, and Ecosystem Connectivity"
    body: "SandboxAQ is led by founder and Chief Executive Officer Jack Hidary, an entrepreneur and former fellow at the National Institutes of Health who previously directed quantum and artificial intelligence research programs within Alphabet. The company maintains an elite governance and advisory structure headlined by former Google Chief Executive Officer and Chairman Eric Schmidt, who chairs SandboxAQ's board of directors and provides strategic connectivity to federal national security and defense innovation channels. Senior leadership and advisory benches incorporate substantial federal sector expertise, including former U.S. Air Force intelligence officer Jen Sovada, who spearheaded the public sector practice through pivotal Department of Defense and Air Force engagements. This concentration of senior leadership bridges advanced mathematical physics with institutional procurement, though the organization exhibits significant key-person dependence on Hidary and Schmidt for strategic vision and fundraising execution."
    claimRefs:
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-investor-syndicate"
    title: "Capitalization Structure, Valuation, and Investor Syndicate"
    body: "Since separating from Alphabet in 2022, SandboxAQ has assembled a tier-one investor syndicate spanning institutional asset managers, strategic technology corporations, and sovereign-scale private investors. Following an initial nine-figure spinout financing and a $500 million Series D round in February 2023, SandboxAQ completed an over $450 million Series E round in April 2025. This brought lifetime equity capital raised to over $950 million. The investor syndicate features institutional asset manager T. Rowe Price alongside corporate strategics including Google and NVIDIA, alongside Breyer Capital, BNP Paribas, and Ray Dalio. In December 2024, financial press reporting from Reuters documented a $300 million capital infusion valuing the business at $5.6 billion, while later company milestones and research profiles referenced valuations reaching $5.75 billion. Confirmatory diligence must evaluate these differing valuation marks against undisclosed operating metrics."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO014"
    tableRefs:
      - "TO003"
  - id: "technology-and-milestones-evolution"
    title: "Technology Evolution, Product Launches, and Contract Milestones"
    body: "SandboxAQ's operational trajectory demonstrates rapid expansion from theoretical quantum research into validated enterprise and defense deployments. In November 2022, the company secured a Phase I SBIR award from the U.S. Department of the Air Force to analyze data architectures against post-quantum cryptographic decryption vulnerabilities. Commercial traction accelerated through public-private consortia, including joining the OpenFold AI Research Consortium in August 2024 alongside leading biopharma institutions such as Biogen and Astex. Product commercialization reached major milestones between late 2025 and early 2026 with the release of OpenCryptography.com, the launch of AQtive Guard AI-SPM for enterprise shadow AI governance, and the debut of AQAffinity for structure-free drug potency prediction. In December 2025, SandboxAQ executed a five-year agreement with the Department of War Chief Information Officer to deploy AQtive Guard for automated cryptographic discovery and inventory across defense infrastructure."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    figureRefs:
      - "FO001"
