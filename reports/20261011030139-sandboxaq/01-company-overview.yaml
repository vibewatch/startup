callouts:
  - calloutType: "insight"
    title: "Quantitative AI Differentiation vs. LLM Generative AI"
    body: "Unlike consumer-facing large language models trained on massive text token corpora, SandboxAQ focuses on Large Quantitative Models (LQMs) that ingest numerical and physical relationship datasets. This architectural distinction underpins its core dual-track go-to-market strategy across life sciences simulation and post-quantum cryptographic security posture management."
    claimRefs:
      - "CO002"
  - calloutType: "risk"
    title: "Commercial Financial Opacity and Valuation Sustainability"
    body: "While SandboxAQ commands an enterprise valuation between $5.6 billion and $5.75 billion with over $950 million in raised capital, the company does not disclose revenue run-rate, ARR, customer counts, or cash burn. Underwriting the current valuation multiple requires direct verification of software contract values and recurring customer retention."
    claimRefs:
      - "CO006"
      - "CO008"
      - "CO014"
