company:
  name: SandboxAQ
chapter:
  number: 4
  title: Financials
  summary: >-
    SandboxAQ monetizes its Large Quantitative Models through enterprise software subscriptions and pass-through compute
    charges alongside multi-year defense awards, but the lack of public disclosure regarding ARR, gross margins, cash
    burn, and runway leaves its multi-billion-dollar valuation unverified for institutional underwriters.
sections:
  - id: revenue-streams-and-commercial-model
    title: Revenue Streams and Commercial Model
    tableRefs:
      - TI001
    figureRefs:
      - FI001
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI010
      - CI011
    body: >-
      SandboxAQ structures its commercial revenue across two primary pillars: enterprise commercial software
      subscriptions and government and defense contract awards. The company's core commercial offering centers on its
      Large Quantitative Models (LQMs), which combine artificial intelligence with physics-aware algorithms to solve
      complex enterprise problems in post-quantum cryptography, biopharma simulation, and GPS-denied navigation. In
      cybersecurity, SandboxAQ deploys its AQtive Guard suite as an enterprise software subscription that automates
      cryptographic asset discovery, inventory, and migration planning across large corporate networks. This commercial
      offering is complemented by deep ecosystem partnerships with leading security vendors, including CrowdStrike and
      Palo Alto Networks, which facilitate channel distribution and technical integrations for enterprise customers
      preparing for post-quantum cryptographic transitions. In parallel, SandboxAQ has secured significant multi-year
      government commitments, highlighted by a five-year deployment agreement with the Department of War Chief
      Information Officer for enterprise-wide cryptographic asset inventory, as well as early Air Force research
      contracts. This diversified structure pairs long-term, high-visibility defense engagements with scalable
      commercial software subscriptions, although segment-level revenue contributions between commercial and federal
      accounts remain undisclosed.
  - id: pricing-mechanics-and-monetization-structure
    title: Pricing Mechanics and Monetization Structure
    tableRefs:
      - TI002
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
    body: >-
      Monetization across SandboxAQ's commercial portfolio relies on custom-quoted enterprise contracts combining
      recurring annual or multi-year software subscription fees with variable compute charges. Unlike standardized SaaS
      vendors with published tier pricing, SandboxAQ does not disclose list prices or seat licensing cards publicly.
      Enterprise customers seeking AQtive Guard or biopharma simulation models must engage direct sales representatives
      for bespoke pricing based on workload volume, infrastructure scope, and computational demand. A critical component
      of SandboxAQ's monetization model is the compute surcharge: because running Large Quantitative Models requires
      substantial mathematical processing, customers incur pass-through or metered compute charges tied directly to
      cloud resources consumed during model execution. In the public sector domain, pricing follows standard federal
      acquisition schedules, ranging from fixed-price Small Business Innovation Research awards to negotiated
      departmental task orders. Notably, contract values remain tightly controlled; company leadership explicitly
      declined to disclose the dollar value of its Air Force cryptographic contract citing customer restrictions. This
      absence of transparent contract values and list pricing obscures realized average contract values and baseline
      unit profitability for external analysts.
  - id: unit-economics-and-cost-structure
    title: Unit Economics, Cost Structure, and Gross Margin Drivers
    tableRefs:
      - TI003
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI012
      - CI013
      - CI014
    body: >-
      Analyzing SandboxAQ's cost structure and unit economics requires separating classical compute hosting and R&D
      talent investments from future quantum hardware dependencies. A vital technical and economic advantage is that
      SandboxAQ trains and runs its quantitative AI models on classical computing infrastructure, specifically utilizing
      high-performance Nvidia GPUs and standard cloud platforms rather than specialized, expensive quantum hardware.
      However, running complex physics-based simulations across molecular chemistry and enterprise cryptography
      generates heavy computational hosting costs, which act as a direct gross margin drag unless fully passed through
      to customers. Beyond compute COGS, SandboxAQ maintains a highly specialized technical workforce, with
      approximately 65% of team members holding doctorate degrees across physics, mathematics, cryptography, and
      artificial intelligence, driving substantial ongoing research and development payroll overhead. The company also
      invests in industry pre-competitive collaborations, such as the OpenFold AI Research Consortium alongside
      biopharma peers. Because SandboxAQ remains a private entity, it does not publicly report GAAP gross margins,
      customer acquisition cost payback periods, or net revenue retention rates, preventing independent confirmation of
      whether software unit economics conform to best-in-class enterprise software benchmarks.
  - id: capital-adequacy-and-diligence-verdict
    title: Capital Adequacy, Burn Risk, and Diligence Verdict
    claimRefs:
      - CI006
      - CI008
      - CI009
      - CI014
      - CI015
    body: >-
      SandboxAQ maintains a well-capitalized balance sheet following substantial institutional venture backing, having
      raised over $950 million in cumulative equity financing since spinning out from Alphabet in 2022. The company
      established a private post-money valuation of $5.6 billion following a December 2024 funding round that secured
      over $300 million from major growth investors including Fred Alger Management, T. Rowe Price, and Breyer Capital,
      which followed an earlier $500 million capital raise. While this capital cushion provides multi-year operational
      runway to pursue computationally intensive LQM development without immediate insolvency pressure, the company's
      valuation appears stretched against unverified fundamentals. SandboxAQ withholds its annual recurring revenue,
      monthly burn rate, customer renewal retention, and liquid cash reserves. For investment underwriters, this
      complete lack of financial disclosure represents a primary diligence blocker: without audited revenue run-rates or
      gross margin data, determining whether a $5.6B valuation reflects reasonable revenue multiples or extreme multiple
      expansion remains impossible. Until management discloses verified commercial traction and cash consumption
      metrics, financial underwriting must classify SandboxAQ as a high-risk diligence candidate with unconfirmed unit
      economics.
