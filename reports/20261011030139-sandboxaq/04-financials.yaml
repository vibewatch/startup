    rows:
      - - AQtive Guard Enterprise Security
        - Annual / multi-year cloud subscription with cryptographic asset discovery modules
        - Per-seat / per-workload tier
        - Commercialized across Global 1000 and defense agencies
        - High (recurring software subscription)
        - Request ARR by cohort, contract lengths, and renewal rates
      - - Federal & Defense Contracts
        - Fixed-price / cost-plus prime and sub-tier government contracts (DoW CIO, USAF)
        - Task order / multi-year award
        - 5-year agreement with DoW CIO; USAF Phase I SBIR completed
        - Medium (subject to procurement cycles and re-competes)
        - Obtain contract backlog, ceiling values, and funded task order schedules
      - - Life Sciences LQM Simulation (AQBioSim)
        - Cloud-based molecular modeling subscription plus compute usage consumption
        - Annual subscription plus GPU compute hour
        - Deployed with pharma partners (e.g., AstraZeneca, Sanofi)
        - Medium-High (usage fluctuates with drug candidate pipelines)
        - Inspect platform access fees versus variable compute margin pass-through
      - - Navigation & Sensing (AQNav)
        - Hardware-software integration and sensing algorithm licensing for GPS-denied environments
        - Per-platform deployment / integration license
        - Prototype and flight-trial stages with defense and aerospace partners
        - Low-Medium (early stage development / non-recurring NRE)
        - Verify transition from research prototype agreements to recurring production licenses
    notes: >-
      Revenue streams and commercial mechanisms synthesized from company filings, PR disclosures, and analyst reviews.
      Dollar amounts and segment ARR breakdowns are private and withheld.
