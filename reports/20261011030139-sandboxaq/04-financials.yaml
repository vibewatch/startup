  - id: TI003
    title: Unit economics and private diligence gap matrix
    columns:
      - Unit Metric
      - Reported Value
      - Confidence
      - Why It Matters
      - Diligence Underwriting Ask
    rows:
      - - Annual Recurring Revenue (ARR)
        - null
        - Low
        - Core top-line scale indicator required to benchmark revenue multiples against the $5.6B valuation
        - Request certified trailing-12-month ARR schedule disaggregated by product suite
      - - Gross Margin Percentage
        - null
        - Low
        - Reveals true software margin versus compute-heavy GPU infrastructure drag and professional services
        - Require GAAP gross margin breakdown separating cloud compute COGS from software delivery
      - - Net Revenue Retention (NRR)
        - null
        - Low
        - Measures cohort expansion, upsell traction, and resilience against enterprise seat churn
        - Inspect net retention and gross retention curves by customer vintage cohort
      - - Total Capital Raised
        - $950M+
        - High
        - Validates cumulative balance sheet funding cushion to finance capital-intensive LQM development
        - Confirm cap table capitalization, preference overhang, and post-Series E cash position
    notes: >-
      Private metrics with null values reflect complete public nondisclosure by SandboxAQ. High-confidence funding total
      corroborated by institutional announcements and financial press.
