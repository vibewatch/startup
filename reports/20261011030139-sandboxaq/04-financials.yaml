  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cash-burn-and-runway
      missingEvidence: >-
        Monthly cash burn rate, gross operating expenditures, and unrestricted cash balances following the Series D and
        Series E financing rounds.
      whyItMatters: >-
        Without burn rate and current liquid reserves, an underwriter cannot calculate runway, capital consumption
        velocity, or the timeline to cash-flow breakeven.
      diligencePath: >-
        Request audited GAAP financial statements, trailing twelve months cash flow statements, and Board-approved
        budget forecasts under NDA.
