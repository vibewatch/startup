callouts:
  - calloutType: risk
    title: Severe Financial Nondisclosure for a Multi-Billion Dollar Valuation
    body: >-
      SandboxAQ carries a reported $5.6B to $5.75B valuation while keeping annual recurring revenue, gross margins, net
      retention, and cash burn completely private. For institutional investors, underwriting this valuation without
      access to verified management accounts represents an unhedged speculative leap.
    claimRefs:
      - CI006
      - CI014
      - CI015
  - calloutType: strength
    title: Substantial Capital Cushion and Multi-Year Government Backing
    body: >-
      With over $950M in lifetime funding and landmark multi-year federal contracts, including a five-year deployment
      agreement with the Department of War CIO, SandboxAQ maintains substantial balance sheet strength and high
      switching costs across sensitive defense accounts.
    claimRefs:
      - CI003
      - CI006
      - CI008
