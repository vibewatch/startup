      - - High-Performance Compute Surcharge
        - Pass-through / metered compute consumption based on GPU hours consumed
        - Variable usage pricing overlaid on baseline subscription
        - Gross compute margin markup over underlying cloud provider costs unknown
        - SI002 (Growth Engineer), SI005 (Reuters)
      - - Defense & Public Sector Agreements
        - Multi-year departmental agreements and SBIR innovation awards
        - Negotiated federal contract pricing
        - Contract ceiling and awarded task-order dollar amounts restricted by customer authorization
        - SI004 (DefenseScoop), SI006 (SandboxAQ)
      - - Biopharma Research Partnerships
        - Collaborative consortium and joint computational modeling agreements
        - Milestone payments and enterprise platform subscription fees
        - Royalty splits, milestone triggers, and platform access licensing fees undisclosed
        - SI007 (SandboxAQ Blog)
    notes: >-
      Commercial pricing is strictly custom-negotiated for enterprise and government accounts. List price cards are not
      published.
