            body: >
              鉴于 SandboxAQ
              高度依赖联邦国防合同和多年期政府采购周期，客户集中风险十分突出。联邦机构现代化是一个巨大的预算机会，但将大型公共部门基础设施迁移到后量子标准，面临显著的机构摩擦、漫长的拨款周期和复杂的多利益相关者治理。管理层已承认，美国政府采购合规速度慢，联邦企业完成迁移需要数年。此外，早期空军
              SBIR 项目等公共部门合同通常禁止披露合同金额，使外部投资者无法独立评估收入质量、毛利率结构和单一客户集中度。如果联邦国防重点改变，或机构实施期限遭遇立法延误，收入可预测性可能承受严重下行压力。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
              - CU013
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 标杆政府验证与蓝筹品牌名单
            body: >
              SandboxAQ 已成功进入要求苛刻的联邦国防和一线企业账户，拿下五年期 Department of War 协议、空军与 Boeing 的导航飞行演示，以及与 AstraZeneca 和 Sanofi
              的生物制药合作。这些部署为新兴量化 AI 市场提供了强有力的品牌验证。
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU012
          - type: callout
            title: 商业不透明与未披露转化指标
            body: >
              尽管宣布了多项高曝光合作，SandboxAQ 对企业客户数、ARR、NRR 或试点转生产转化率均完全没有披露。早期项目多被描述为 90 天 SBIR
              探索性研究或研究合作，因此经常性软件收入的持久性仍高度难以判断。
            calloutType: risk
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管要求与联邦合规摩擦
        blocks:
          - type: paragraph
            body: >-
              将企业和政府架构迁移至后量子密码学，需要经历漫长的合规周期并应对官僚化采购标准。虽然 Office of Management and Budget
              已发布联邦指令，要求各机构盘点易受量子攻击的系统，但实际机构迁移仍需多年才能执行。“先存储、后解密”的数据收集行动构成即时运营威胁：攻击者截获并保存加密数据，等量子硬件成熟后再解密。SandboxAQ 借助与
              NIST National Cybersecurity Center of Excellence 的合作及 FedRAMP Ready
              云认证，应对这些要求。然而，密码敏捷性要求和联邦实施时间表仍存在模糊地带，给商业部署带来时点风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR012
              - CR013
      - number: '7.2'
        title: 技术依赖与传统算力约束
        blocks:
          - type: paragraph
            body: >-
              尽管品牌围绕量子突破打造，SandboxAQ 近期产品交付从根本上依赖传统算力基础设施和先进数值建模，而不是可运行的量子硬件。公司的大型量化模型高度依赖高性能 Nvidia GPU
              集群，执行药物发现和材料科学模拟。这种运营结构使公司容易受到传统硬件价格波动、GPU 集群可用性和高昂基础设施运营开支的影响。此外，整合 Good Chemistry
              的计算化学平台等收购技术，会给软件开发工具包和企业工作流带来技术同步挑战。由于具备商业可行性的量子计算机仍需数年才能出现，SandboxAQ 必须在管理持续高昂的云和 GPU 基础设施成本的同时，与纯传统 AI
              模拟供应商保持差异化。
            claimRefs:
              - CR004
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR008
              - CR009
              - CR013
      - number: '7.3'
        title: 交易对手集中与 go-to-market 渠道
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 高度依赖一小批知名联邦赞助方和战略系统集成商推动企业采用。公司曝光最高的网络安全部署，是与 Department of War CIO
              签署的五年协议，用于在国防系统中自动发现密码资产。然而，空军 Phase I SBIR 合同等早期国防项目规模相对有限，金额也未披露，凸显出将原型演示转化为持久、经常性软件收入的困难。在商业端，SandboxAQ
              依赖 Deloitte 和 EY 等全球集成伙伴为企业客户识别漏洞并实施密码迁移。这种渠道依赖让客户获取速度受制于伙伴优先级和渠道协同，在直接企业软件分发仍在建设之际，形成客户集中风险。
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR011
      - number: '7.4'
        title: 综合风险评估与论点失效情景
        blocks:
          - type: paragraph
            body: >-
              对 SandboxAQ 的综合评估显示，其 $5.3 billion 至 $5.6 billion 的私募市场估值，与可验证的商业基本面之间存在显著偏离。公司通过多轮融资累计募资超过 $950
              million，因此背负着 T. Rowe Price 和 Breyer Capital
              等知名机构支持者的高资本预期。然而，年度经常性收入、按产品线划分的毛利率和月度现金消耗等核心财务指标仍未披露，阻碍了对软件收入质量的独立验证。投资者需要关注的论点失效触发因素包括：联邦机构合同无法从发现原型转化为付费多年期软件部署；NIST
              或 OMB 合规期限发生不利变化，降低企业迁移紧迫性；以及传统 GPU 集群训练支出持续上升，导致毛利率恶化。
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
              - CR007
