  - id: FP001
    title: 按工作流广度和公开部署证据划分的竞争路径
    type: quadrant
    summary: 分析师序数图将覆盖工作流的广度与公开部署证据的强度分开呈现；不对产品性能评分。
    data:
      xAxis:
        label: 工作流广度
        min: 1
        max: 5
      yAxis:
        label: 公开部署证据
        min: 1
        max: 5
      points:
