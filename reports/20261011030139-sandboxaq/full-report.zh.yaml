            title: 量化 AI 与 LLM 生成式 AI 的差异
            body: >-
              与基于海量文本 token 语料训练、面向消费者的大语言模型不同，SandboxAQ
              专注于摄取数值关系和物理关系数据集的大型量化模型（LQM）。这一架构差异支撑公司在生命科学模拟与后量子密码安全态势管理之间展开双轨 go-to-market。
