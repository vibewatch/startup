      - number: '4.3'
        title: 单位经济、成本结构与毛利率驱动因素
        blocks:
          - type: paragraph
            body: >-
              分析 SandboxAQ 的成本结构和单位经济，需要区分传统算力托管、研发人才投入与未来量子硬件依赖。公司一项重要的技术与经济优势是，量化 AI 模型在传统计算基础设施上训练和运行，具体使用高性能 Nvidia
              GPU 和标准云平台，而不是昂贵的专用量子硬件。然而，在分子化学和企业密码学之间运行复杂的物理模拟，会产生沉重的算力托管成本；除非全部转嫁给客户，否则这些成本会直接拖累毛利率。除算力 COGS
              外，SandboxAQ 还维持一支高度专业化的技术团队，约 65% 的成员拥有物理学、数学、密码学和人工智能博士学位，持续推高研发工资开支。公司还投入行业内的前竞争合作，例如与生物制药同行共同参与
              OpenFold AI Research Consortium。由于 SandboxAQ 仍是私营公司，未公开报告 GAAP
              毛利率、客户获取成本回收周期或净收入留存率，外部无法独立确认其软件单位经济是否符合一流企业软件基准。
