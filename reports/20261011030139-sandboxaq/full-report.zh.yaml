            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
              - CV011
      - number: '8.2'
        title: 融资历史、股权结构表与估值背景
        blocks:
          - type: paragraph
            body: >
              SandboxAQ 于 2022 年 3 月在创始人 Jack Hidary 和董事长 Eric Schmidt 带领下从 Alphabet 分拆，此后通过多轮融资累计筹资超过 9.5 亿美元。公司先完成 5
              亿美元融资，随后于 2024 年 12 月以 53 亿美元投前估值（投后 56 亿美元）融资超过 3 亿美元，之后在 2025 年 4 月完成 E 轮融资，筹资超过 4.5 亿美元，公司估值达到 57.5
              亿美元。投资者包括 T. Rowe Price、Breyer Capital、Fred Alger Management、Google、NVIDIA、BNP Paribas 和 Ray Dalio
              等顶级机构及战略投资方。不过，公司仍未实现盈利，研发和计算基础设施资本密集度较高；若企业采用周期拉长或宏观 IT 预算收缩，将面临股权稀释和下轮融资风险。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 情景分析、可比公司与重点尽调问题
        blocks:
          - type: paragraph
            body: >
              鉴于 SandboxAQ 的财务报表缺乏透明度，情景估值需要评估乐观、基准和悲观运营路径之间的结构性差异。乐观情景下，联邦强制后量子迁移和生物制药 LQM 授权业务加速，推动 ARR
              接近数亿美元，从而支撑数十亿美元的平台估值。基准情景下，企业采用稳步推进，但销售周期较长，ARR 保持温和增长；相较于收入倍数约 8–15 倍的上市网络安全公司，57.5
              亿美元估值仍容易遭遇倍数压缩。悲观情景下，客户集中度、销售执行阻力以及其他量子或经典方案会触发下轮融资风险。重点尽调应关注分业务 ARR、现金消耗率、毛利率结构和客户扩张率。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 附件
        blocks:
          - type: callout
            title: 尽调结论——等待经核实收入，继续跟踪
            body: >
              SandboxAQ 拥有少见的技术可信度、顶级投资者阵容和早期国防客户成果。但在 57.5 亿美元的名义估值下，ARR
              未披露且商业化障碍已被承认；在没有审计级财务披露和优先股条款核实前，投入资本的风险收益比并不划算。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV011
