      - number: '3.4'
        title: 技术广度尚未构成经测量的护城河
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 的差异化叙事把语言接口与基于物理学、化学、生物学和模拟的量化模型结合起来。这一表述很独特，但本章现有证据没有显示其相对直接竞争者拥有更好的基准结果。路透社援引投资人 Jim Breyer
              称，这些模型可在 Nvidia GPU
              等现有硬件上训练，并可能受益于未来量子芯片进步。兼容现有硬件能降低采用摩擦，但也可能限制基础设施排他性，让差异化更多落在专有数据、模型质量、工作流集成和执行上。NeuronFeed 在其审阅日未发现公开
              API、webhooks、OAuth 2.0、SDK 或 MCP
              server，这说明可见的开发者分发界面较弱，但该扫描未发现并不能证明私有集成能力不存在。因此，竞争持久性仍取决于基准披露、客户留存、专有数据权利和可复制部署。
            claimRefs:
              - CP003
              - CP012
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 采购可信度是最具体的优势
            body: 空军及后续 DoW 披露比泛泛的产品组合主张更能提供信任信号，但两个来源都没有给出独立的性能比较。
