chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、起源与商业模式
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 是一家独立的企业级量化人工智能软件公司，总部位于加州帕洛阿尔托。公司最初孕育于 Alphabet Inc. 的 moonshot 项目和先进计算研发体系，随后于 2022 年 3
              月正式分拆，成为拥有独立资本、治理和运营领导层的自主公司。大型量化模型（LQM）构成公司的核心技术与商业论点；这类模型摄取数值数据集、基于物理学的模拟和量子力学原理，与统计型大语言模型有根本区别。商业运营面向企业软件部署，覆盖后量子网络安全态势管理、生命科学药物发现加速、材料模拟和无
              GPS 导航系统。尽管 SandboxAQ 获得了大量私募市场资本，公司仍严格限制披露，不公开报告收入运行率、年度经常性收入或毛利率表现。
            claimRefs:
              - CO001
              - CO002
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO008
      - number: '1.2'
        title: 执行层、治理与生态连接
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 由创始人兼 CEO Jack Hidary 领导；他是一名企业家，曾任美国国立卫生研究院研究员，此前在 Alphabet 负责量子和人工智能研究项目。公司拥有精英化的治理与顾问体系，由前
              Google CEO 兼董事长 Eric Schmidt 担任董事会主席，并为公司连接联邦国家安全和国防创新渠道。高管与顾问团队拥有深厚的联邦部门经验，包括前美国空军情报官员 Jen
              Sovada；她曾通过关键的国防部和空军项目牵头公共部门业务。这种高管集中把先进数学物理与机构采购连接起来，但也意味着公司在战略愿景和融资执行上高度依赖 Hidary 与 Schmidt。
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO009
      - number: '1.3'
        title: 资本结构、估值与投资者联盟
        blocks:
          - type: paragraph
            body: >-
              自 2022 年脱离 Alphabet 后，SandboxAQ 组建了横跨机构资产管理者、战略科技公司和主权级私人投资者的一线投资者联盟。在完成一轮九位数的分拆融资以及 2023 年 2 月 $500
              million 的 Series D 后，公司于 2025 年 4 月完成超过 $450 million 的 Series E，使累计股权融资超过 $950 million。投资者联盟包括机构资产管理者 T.
              Rowe Price，以及 Google、NVIDIA 等企业战略投资者，另有 Breyer Capital、BNP Paribas 和 Ray Dalio。2024 年 12 月，路透社的财经报道记录了一笔
              $300 million 的注资，并称公司估值达到 $5.6 billion；之后公司里程碑和研究简介则提到估值达到 $5.75 billion。尽调必须用未披露的运营指标检验这些不同的估值口径。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO014
