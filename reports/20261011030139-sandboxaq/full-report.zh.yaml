  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将技术差异化和融资验证与商业不透明、高风险及跟踪建议连接起来的决策逻辑。
    data:
      nodes:
        - id: tech-leadership
          label: 专有 LQM 平台与联邦验证
          role: evidence
          tone: positive
        - id: capital-strength
          label: 已融资 $950M+ 及一线投资者（$5.75B Series E）
          role: evidence
          tone: positive
        - id: market-opportunity
          label: 量子安全与科学 AI 顺风
          role: evidence
          tone: positive
        - id: financial-opacity
          label: ARR、利润率和单位经济性均未披露
          role: constraint
          tone: negative
        - id: execution-risk
          label: 早期市场、初步重组与高烧钱
