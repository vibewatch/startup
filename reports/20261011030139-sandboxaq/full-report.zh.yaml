      - number: '2.4'
        title: 采用催化剂、结构性摩擦与估值现实
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 各产品线的企业采用受到强大外部催化剂推动，但也被深层运营摩擦限制。网络安全领域的主要增长驱动是监管强制：具有约束力的联邦指令、NIST
              后量子密码标准化和国家安全要求设定了严格期限，要求组织发现并编目易受攻击的加密资产。在生物制药领域，降低新疗法上市前长达十年、数十亿美元成本的经济压力，推动物理模拟的量化采用。然而，严重的结构性约束阻碍预算快速落地。密码迁移横跨异构遗留企业系统，复杂度极高、周期长；改动核心通信协议会带来显著的运营停机风险和高昂切换成本。在生物制药领域，计算预测仍须经历严格的体外和临床验证，才能产生经济回报。更关键的是，第三方报道记录了相互冲突的私募估值基准——在
              Breyer Capital 和 T. Rowe Price 支持的融资轮之后，估值从 $5.3 billion 到 $5.75 billion 不等——而可验证的经常性收入仍未披露，使商业倍数面临审视。
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM011
              - CM012
