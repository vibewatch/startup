              平台提供全面的自动化密码发现和盘点，帮助企业将遗留密码架构迁移至后量子标准。在生物制药和材料科学领域，AQBioSim 部门使用基于物理的模拟算法加速早期药物发现与毒性筛选；其能力得到 2024 年 1 月收购
