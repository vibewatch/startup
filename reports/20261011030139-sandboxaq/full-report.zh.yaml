figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: SandboxAQ 从 Alphabet 分拆，到签订商业国防合同并完成 Series E 融资的历程。
    data:
      items:
        - label: 2022 年 3 月
          detail: 以独立实体身份从 Alphabet 分拆，获得九位数初始融资；Jack Hidary 出任 CEO，Eric Schmidt 出任董事长。
          tone: positive
        - label: 2022 年 11 月
          detail: 获美国空军授予 SBIR 第一阶段合同，评估军事数据架构的抗量子密码学。
          tone: positive
        - label: 2023 年 2 月
          detail: 完成 $500 million Series D 融资，用于推进量子模拟和网络安全软件套件。
          tone: positive
        - label: 2024 年 8 月
          detail: 与 Astex、Biogen 及其他生物制药龙头加入 OpenFold AI Research Consortium，加速分子建模。
          tone: positive
        - label: 2024 年 12 月
          detail: Reuters 报道，公司以 $5.6 billion 估值融资超过 $300 million，用于加速大型量化模型（LQM）开发。
          tone: positive
        - label: 2025 年 4 月
          detail: 正式完成超过 $450 million 的 Series E 融资，投资方包括 Google、NVIDIA、BNP Paribas 和 Ray Dalio。
          tone: positive
        - label: 2025 年 10 月
          detail: 推出 OpenCryptography.com 公共漏洞数据库，揭示开源软件包中的密码学风险。
          tone: positive
        - label: 2025 年 12 月
          detail: 与 Department of War CIO 签署五年 AQtive Guard 部署协议，并推出 AI-SPM 网络安全套件。
          tone: positive
        - label: 2026 年 1 月
          detail: 推出 AQAffinity，用于无结构药物效力预测，扩展生物制药量化模拟产品组合。
          tone: positive
    approximationNotes: 里程碑日期来自公司官方发布、DefenseScoop 报道和 Reuters 报道。
    claimRefs:
      - CO001
      - CO005
      - CO006
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
