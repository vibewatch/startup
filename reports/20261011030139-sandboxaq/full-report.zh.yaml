        - from: capital-strength
          to: market-opportunity
        - from: market-opportunity
          to: financial-opacity
        - from: financial-opacity
          to: execution-risk
        - from: execution-risk
          to: decision-verdict
    approximationNotes: 流程图展示定性综合判断，将技术差异化与财务风险连接至尽调结论。
