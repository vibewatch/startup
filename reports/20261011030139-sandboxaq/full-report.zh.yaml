  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与商业模式
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 的商业收入主要来自两大支柱：企业商业软件订阅，以及政府和国防合同项目。公司的核心商业产品围绕大型量化模型（LQM），将人工智能与理解物理的算法结合，用于解决后量子密码学、生物制药模拟和无
              GPS 导航中的复杂企业问题。在网络安全领域，SandboxAQ 以企业软件订阅形式部署 AQtive Guard 套件，自动发现、盘点大型企业网络中的密码资产并规划迁移。公司还与 CrowdStrike 和
              Palo Alto Networks 等领先安全厂商建立深度生态合作，为准备后量子密码迁移的企业客户提供渠道分发和技术集成。与此同时，SandboxAQ 已取得重要的多年期政府承诺，包括与 Department
              of War Chief Information Officer
              签署五年部署协议，为全企业盘点密码资产，以及早期空军研究合同。这种多元结构将长期、高曝光的国防项目与可规模化的商业软件订阅结合起来，但商业和联邦账户各自的收入贡献仍未披露。
