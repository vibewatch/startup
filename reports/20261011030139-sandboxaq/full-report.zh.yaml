        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 在获得大量机构风险投资支持后保持资产负债表资金充足，自 2022 年从 Alphabet 分拆以来累计股权融资超过 $950 million。公司在 2024 年 12 月融资后建立 $5.6
              billion 的私募投后估值；该轮从 Fred Alger Management、T. Rowe Price 和 Breyer Capital 等主要成长型投资者处筹得超过 $300
              million，之前还完成过一笔 $500 million 融资。这笔资金缓冲让公司能够在没有即时资不抵债压力的情况下，用多年时间推进计算密集型 LQM
              开发，但其估值相对于未经验证的基本面显得偏高。SandboxAQ
              不披露年度经常性收入、月度现金消耗、客户续约留存或流动现金储备。对投资承销判断而言，这种财务披露的完全缺失是首要尽调障碍：没有经审计的收入运行率或毛利数据，就无法判断 $5.6B
              估值对应合理收入倍数，还是极端倍数扩张。在管理层披露经过验证的商业牵引力和现金消耗指标之前，财务判断必须将 SandboxAQ 归为单位经济尚未确认的高风险尽调标的。
