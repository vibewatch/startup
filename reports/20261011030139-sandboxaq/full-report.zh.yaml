  - id: FI001
    title: 企业和公共部门收入模型桥接
    type: flow
    summary: 展示企业和联邦客户活动如何通过订阅及用量计费转化为毛利的商业转化流程。
    data:
      nodes:
        - id: client-engagement
          label: 企业与联邦需求
          description: 寻求后量子密码学、生物制药模拟或韧性导航方案的全球 1000 强企业和国防机构
        - id: contract-negotiation
          label: 定制合同
          description: 采用定制分层定价的多年期企业订阅和政府授标
        - id: platform-delivery
          label: 云端 LQM 部署
          description: 通过云基础设施和合作伙伴集成交付 AQtive Guard、AQBioSim 或 AQNav
        - id: revenue-recognition
          label: 订阅与用量计费
          description: 月度 / 年度经常性软件许可费，加上 LQM 模型执行的计量算力费用
        - id: cogs-deduction
          label: 算力与交付成本
          description: 云端 GPU 算力基础设施（云上的 Nvidia 硬件）及直接客户工程成本
        - id: gross-profit
          label: 毛利转化
          description: 扣除托管、算力转嫁和部署费用后的净毛利率
    approximationNotes: 基于公开报道呈现 SandboxAQ 商业模型的概念流程；明确的转化率和各步骤美元数值未公开披露。
    claimRefs:
      - CI001
      - CI002
      - CI010
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 覆盖经典算力基础设施、基于物理的 LQM、核心应用平台和企业部署接口的多层架构。
    data:
      layers:
        - label: 经典加速算力层
          detail: 配备 CUDA 加速 DMRG 算法的 Nvidia GPU 集群、Google TPU 及执行数值张量模拟的经典高性能计算集群。
        - label: 数据合成与计算机模拟引擎
          detail: 专有模拟流水线在计算机中生成合成分子和物理训练数据，以绕开现实世界经验数据稀缺的问题。
        - label: 大型量化模型（LQM）核心
          detail: 基于物理关系、量子化学原理和量化数据集训练的数值深度学习模型，而非基于自然语言 token。
        - label: 领域专用模拟平台
          detail: 用于分子建模和药物发现的 AQBioSim；用于计算化学的 QEMIST Cloud 和开源 Tangelo SDK；磁异常滤波模型。
        - label: 后量子密码学套件
          detail: AQtive Guard 自动密码发现与清单（ACDI）引擎，管理密码敏捷性并执行 NIST PQC 迁移标准。
        - label: 企业与政府集成接口
          detail: 与系统集成商（Deloitte、EY）、国防网络（USAF、DoW CIO）及制药平台（AstraZeneca、Sanofi）的客户部署集成。
    approximationNotes: 架构图基于已披露技术描述、收购整合（Good Chemistry）及公开合作公告。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE007
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 企业客户从初始密码评估，到系统集成商扩展及多垂直 LQM 平台采用的六阶段生命周期。
    data:
      items:
        - label: 评估与密码发现
          stage: 评估与密码发现
          description: 企业 IT 和安全运营团队使用 AQtive Guard 自动盘点公钥加密漏洞。
          touchpoints:
            - NIST NCCoE 指导框架
            - AQtive Guard ACDI 扫描引擎
          friction: Opaque legacy software supply chains and hardcoded encryption libraries delay full network visibility.
          expansionLoop: Discovery phase establishes the cryptographic baseline needed for remediation software licensing.
        - label: 试点演示与原型试验
          stage: 试点演示与原型试验
          description: 技术团队开展有针对性的能力演示，例如 DISA 原型试验或为期 90 天的 SBIR 可行性研究。
          touchpoints:
            - SBIR 第一阶段研究合同
            - DISA 新兴技术原型里程碑
          friction: Security classification restrictions and non-disclosure clauses limit public marketing validation.
          expansionLoop: Successful prototype validation provides evidentiary proof required for federal agency authorization.
        - label: 系统集成商采购与签约
          stage: 系统集成商采购与签约
          description: 企业客户在全球咨询渠道协助下谈判多年期软件部署条款。
          touchpoints:
            - Deloitte GTM 集成渠道
            - EY 企业风险咨询项目
          friction: Complex governmental procurement rules and federal budget appropriations lengthen closing cycles.
          expansionLoop: Channel partner distribution enables scaled deployment across subsidiary agencies and enterprise units.
        - label: 生产部署与企业标准化
          stage: 生产部署与企业标准化
          description: 在整个组织推广 AQtive Guard 平台，持续监测密码资产清单。
          touchpoints:
            - DoW CIO 五年企业协议
            - 集中式密码敏捷管理
          friction: Multi-year implementation demands substantial ongoing IT operational support and agency coordination.
          expansionLoop: Standardized enterprise security layer anchors high gross retention and multi-year contract renewals.
        - label: 领域专用 LQM 模块采用
          stage: 领域专用 LQM 模块采用
          description: 客户账户评估导航或生物制药模拟领域的其他量化 AI 应用。
          touchpoints:
            - AQNav 无 GPS 导航飞行试验
            - 分子结合亲和力计算建模
          friction: Cross-functional budget separation between IT security and R&D divisions requires fresh buyer alignment.
          expansionLoop: Shared underlying LQM compute infrastructure lowers marginal cost for secondary module adoption.
        - label: 联盟协作与生态扩展
          stage: 联盟协作与生态扩展
          description: 企业参与共享研究联盟及全行业后量子标准化倡议。
          touchpoints:
            - OpenFold AI Research Consortium
            - 商业航空航天飞行测试合作
          friction: Pre-competitive IP sharing structures require delicate legal structuring between commercial peers.
          expansionLoop: Ecosystem collaboration cements SandboxAQ as the default platform standard for physical-world AI.
    approximationNotes: 旅程图定性综合了政府国防和企业客户中有记录的客户参与路径。
    claimRefs:
      - CU003
      - CU004
      - CU009
      - CU010
      - CU011
      - CU012
