    title: 市场规模视角
    type: pyramid
    summary: 从全球量子相关软件 TAM 到近期可服务收入的分层市场规模框架。
    data:
      items:
        - label: 全球量子相关软件 TAM（$100B+）
          value: 100000
          detail: 到 2035 年，抗量子网络安全、量子传感和 AI 分子物理领域的长期理论总支出。
          tone: neutral
          claimRefs:
            - CM003
        - label: 企业后量子密码学 TAM（$12.8B）
          value: 12800
          detail: 预计到 2030 年，企业 PQC 迁移、发现和密码敏捷工具的全球支出。
          tone: neutral
          claimRefs:
            - CM004
        - label: AI 分子发现与模拟 TAM（$8.6B）
          value: 8600
          detail: 到 2030 年，量化 AI 和基于物理建模可触达的生物制药及材料模拟市场。
          tone: neutral
          claimRefs:
            - CM005
        - label: 可服务可触达市场（SAM）（$2.4B）
          value: 2400
          detail: 美国联邦国防和受监管企业金融领域目前可执行的预算池，这些领域需要立即开展密码资产发现。
          tone: positive
          claimRefs:
            - CM006
        - label: 可服务可获得市场（SOM）（$350M - $500M）
          value: 425
          detail: 近期可获取的市场池受企业从试点到生产的转化周期及多年期合同的高门槛限制。
          tone: positive
          claimRefs:
            - CM006
        - label: 已披露的私有商业规模（$50M - $100M ARR 缺口）
          value: 75
          detail: 未经验证的私有商业收入运行率，需要结合财务尽调确认其与 $5.75B 估值的匹配度。
          tone: warning
          claimRefs:
            - CM013
            - CM014
    approximationNotes: $2.4B 以上数值代表行业分析师自上而下的预测；鉴于私有财务未披露，SOM 和 ARR 数值是受尽调信息约束的估算。
