      - number: '4.2'
        title: 定价机制与变现结构
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 商业产品组合的变现依靠定制报价的企业合同，将年度或多年期软件订阅费与可变算力费用结合。与公开分层定价的标准化 SaaS 厂商不同，SandboxAQ 不公开价目表或席位许可卡。寻求
              AQtive Guard
              或生物制药模拟模型的企业客户必须直接联系销售代表，根据工作量、基础设施范围和计算需求获得定制价格。变现模式的关键组成是算力附加费：由于运行大型量化模型需要大量数学处理，客户要按模型执行期间消耗的云资源承担转嫁或计量算力费用。在公共部门，定价遵循联邦采购标准，从固定价格的
              Small Business Innovation Research
              项目到协商确定的部门任务订单不等。值得注意的是，合同金额受到严格控制；公司管理层以客户限制为由，明确拒绝披露其空军密码合同的金额。合同金额和价目表都不透明，使外部分析师无法了解实际平均合同价值和基础单位盈利能力。
