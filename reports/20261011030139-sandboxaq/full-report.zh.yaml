      - number: '3.2'
        title: 政府部署是最清晰的信任信号
        blocks:
          - type: paragraph
            body: >-
              指定证据中最有力的竞争证明是公共部门采用。DefenseScoop 报道 SandboxAQ 首份美国军方交易是 Phase I SBIR 项目，用于评估空军和太空军的密码态势；初始工作预计持续 90
              天，并可能进入后续阶段。公司之后发布的消息称，Department of War CIO 正在其系统中使用 AQtive Guard
              进行自动发现和盘点。这些记录支持采购可信度以及拓展到更广泛部门的路径，但并非独立的性能基准。该发布由公司出具，早期合同金额未披露，两个来源都没有将检测覆盖率、迁移时间、误报或总成本与现有安全平台或内部工具比较。
