      - number: '2.3'
        title: 买家分层、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 的企业 go-to-market 模式需要应对四个不同客户层级，它们的经济买家和预算归属机制各不相同。在联邦国防领域，经济决策由部门 CIO 和军方采购负责人掌握，例如 US
              Department of War 和 Department of the Air Force。这些政府客户通过专门的国防采购拨款和小企业创新研究（SBIR）机制，为密码库存平台和无 GPS
              导航测试提供资金。在商业金融服务领域，CISO
              和基础设施风险团队从企业网络安全预算中批准支出，以防护核心交易网络免受“先收集、后解密”（HNDL）数据拦截威胁。在生物制药和特种材料领域，预算权转向研发负责人和首席科学官；他们掌管治疗发现预算，并通过与
              Anthropic 的 Claude
              集成等合作加速先导物识别。最后，关键国家基础设施运营商从运营技术（OT）安全预算中拨款，审计嵌入式遗留加密。这些购买逻辑差异很大，需要定制价值主张，无法采用统一销售动作，也会拉长整体企业转化速度。
            claimRefs:
              - CM005
