            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM008
      - number: '2.2'
        title: TAM、SAM、SOM 估值视角与支出约束
        blocks:
          - type: paragraph
            body: >-
              评估 SandboxAQ 的市场机会，需要采用受证据约束的严谨估值视角，而不能依赖缺少依据的自上而下数字。尽管行业预测有时声称，到 2035 年量子相邻企业软件市场将超过 $100
              billion，但可执行的商业支出受近期监管节点和企业软件刷新周期支配。独立分析师预计，到 2030 年全球企业后量子密码学 TAM 将达到 $12.8
              billion；随着各组织替换易受攻击的公钥架构，复合年增长率为 34.2%。与此同时，AI 分子发现与材料模拟软件市场预计到 2030 年 TAM 为 $8.6
              billion，背后是生物制药压缩数十亿美元治疗开发流程的迫切需求。按客户即时准备度筛选后，SAM 缩小至约 $2.4 billion，覆盖美国联邦国防实体、航空航天承包商，以及面临密码迁移要求的 Global
              2000 金融服务企业。SandboxAQ 在三年期内现实可得的 SOM 受限于 $350 million 至 $500
              million，原因包括企业试点评估周期长、采购审批耗时，以及未经验证的软件年度经常性收入（ARR）与公司 $5.75 billion 私募估值之间的反差。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
