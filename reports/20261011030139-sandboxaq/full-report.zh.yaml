          x: 5
          'y': 4
          detail: 覆盖多个行业，并有政府合同证据。
        - label: AQtive Guard
          x: 3
          'y': 5
          detail: 聚焦安全的平台，有空军和 DoW 证据。
        - label: AI 模拟
          x: 4
          'y': 2
          detail: 描述了广泛的科学应用，但未留存可比部署基准。
        - label: AQNav
          x: 2
