  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近领域与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 将可服务市场划分为三个不同的商业垂直领域：后量子密码学（PQC）企业安全、AI 驱动的分子与材料模拟，以及量子技术传感与导航。在网络安全领域，公司通过 AQtive Guard
              软件套件专门瞄准密码发现、盘点和自动化密码敏捷性。公司明确排除下一代防火墙、通用安全信息与事件管理（SIEM）系统，以及固件不支持敏捷更新的硬件安全模块等传统边界安全类别。在生命科学领域，SandboxAQ
              专注于使用物理信息大型量化模型（LQM）进行 in silico 分子建模，不包括常规湿实验合成和通用生成式 AI 文本应用。在量子传感领域，公司集中于无 GPS
              环境下的磁异常导航系统，而不是广义卫星通信。所有这些垂直领域的主要商业替代方案仍是根深蒂固的现状：企业 IT 团队依赖静态非对称加密算法（RSA 和
              ECC）及人工库存表，而生物制药研究人员依赖缓慢且资本密集的湿实验。要打破这种惯性，必须证明即时监管合规价值，并能量化缩短药物开发周期所带来的成本下降。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM008
