              - CR014
              - CR015
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 联邦采购周期与收入转化风险
            body: >-
              SandboxAQ 虽然与 Department of War 和空军拥有高曝光项目，但公共部门 SBIR Phase I
              项目和发现型原型的转化摩擦很高。要从自动化发现盘点推进到联邦机构持续产生收入的数百万美元迁移合同，必须穿越多年预算和采购障碍。
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR005
          - type: callout
            title: 传统 GPU 算力开支与量子硬件时间表
            body: >-
              由于容错量子处理器距离实用化仍有数年，SandboxAQ 当前的商业价值主张围绕运行在经典 Nvidia GPU
              集群上的大型量化模型展开。短期运营风险因此不再主要取决于量子物理突破，而转向经典算力的单位经济性、GPU 集群获取能力和毛利率可持续性。
            calloutType: insight
            claimRefs:
              - CR009
              - CR010
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、建议与决策矩阵
        blocks:
          - type: paragraph
            body: >
              SandboxAQ 的技术论点颇具吸引力，核心是大型量化模型（LQM），用于模拟密码学、分子生物学和无 GPS 导航中的物理现象。但由于完全没有经核实的
              ARR、毛利率披露或客户留存指标，其商业论点面临严重的信息不对称。公司在 2025 年 4 月 E 轮融资中披露的 57.5
              亿美元估值，建立在未经确认的收入之上，估值倍数异常高，因此公开证据不足以支持买入建议。我们建议继续跟踪，风险评级为高，估值判断为偏高。核心论点可能被击穿的触发因素包括财务信息长期不披露、无法将联邦原型项目转化为多年期经常性企业合同，或下一轮股权定价时估值倍数显著压缩。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
