              - CO007
      - number: '1.4'
        title: 技术演进、产品发布与合同里程碑
        blocks:
          - type: paragraph
            body: >-
              SandboxAQ 的运营轨迹显示，公司正从理论量子研究快速扩展到经过验证的企业和国防部署。2022 年 11 月，公司获得美国空军部的 Phase I SBIR
              项目，用于分析数据架构面对后量子密码解密漏洞的风险。商业牵引力随后通过公私联盟加速，包括 2024 年 8 月加入 OpenFold AI Research Consortium，与 Biogen 和 Astex
              等领先生物制药机构并肩合作。2025 年末至 2026 年初，产品商业化达到重要节点：发布 OpenCryptography.com，推出面向企业影子 AI 治理的 AQtive Guard
              AI-SPM，并推出无需结构信息即可预测药物效力的 AQAffinity。2025 年 12 月，SandboxAQ 与 Department of War Chief Information Officer
              签署五年协议，为国防基础设施部署 AQtive Guard，以自动发现和盘点密码资产。
