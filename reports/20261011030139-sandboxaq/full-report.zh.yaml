      - number: '3.3'
        title: 定价不透明削弱买家层面的比较
        blocks:
          - type: paragraph
            body: >-
              公开的产品包装证据太薄弱，无法比较经济性。NeuronFeed 将 SandboxAQ 定价标为企业级，但没有提供价格、计价单位、折扣结构或合同期限。指定资料同样没有披露 AQtive
              Guard、模拟模块、AQNav 或 AQMed
              的实际定价。密码资产和依赖关系一旦持续在客户环境中盘点，集成可能制造切换成本，因为替换系统就要重建这些可见性和工作流上下文。这是基于所述部署模式的分析师推断，不是经测量的留存证据。买家仍可保留现有安全控制、科学工具或内部模型，与
              SandboxAQ 并行使用；保留资料没有量化排他性、迁移成本、合同期限或渠道经济性。
            claimRefs:
