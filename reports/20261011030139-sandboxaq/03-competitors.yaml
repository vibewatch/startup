      - ["Independent benchmarking", "No comparative benchmark retained", Unknown, "No comparable evidence retained", "Core moat claim remains unverified"]
    notes: >-
      Cells describe only public evidence in the assigned pool; “Unknown” means the pool did not support
      a comparison and does not imply the capability is absent.
    claimRefs: [CP002, CP005, CP007, CP008, CP012, CP015]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Route, Public price or unit, Packaging evidence, Discount or contract evidence, Underwriting implication]
    rows:
      - [SandboxAQ, Unknown, "NeuronFeed labels pricing Enterprise", "Commercial terms undisclosed", "Cannot compare total cost or realized price"]
      - ["Direct peer", Unknown, Unknown, Unknown, "No like-for-like price benchmark"]
      - ["Internal build", Unknown, "Labor, data, infrastructure, and maintenance", Unknown, "Requires a customer-specific build-versus-buy model"]
      - ["Status quo", Unknown, "Existing tools and manual process", Unknown, "Avoided procurement may offset unmeasured risk or inefficiency"]
    notes: >-
      Public list prices, realized prices, unit definitions, and discounts were not available in the
      assigned fetched evidence.
    claimRefs: [CP011, CP014]
figures:
  - id: FP001
    title: Competitive routes by workflow breadth and public deployment evidence
    type: quadrant
    summary: >-
      Analyst ordinal map separates breadth of addressed workflows from the strength of public deployment
      evidence; it does not score product performance.
    data:
      xAxis:
        label: Workflow breadth
        min: 1
        max: 5
      yAxis:
        label: Public deployment evidence
        min: 1
        max: 5
      points:
        - {label: SandboxAQ portfolio, x: 5, y: 4, detail: "Broad multi-sector scope with government contract evidence."}
        - {label: AQtive Guard, x: 3, y: 5, detail: "Focused security platform with Air Force and DoW evidence."}
        - {label: AI simulation, x: 4, y: 2, detail: "Broad scientific applications described, but no comparative deployment benchmark retained."}
        - {label: AQNav, x: 2, y: 2, detail: "Navigation application identified; comparable procurement evidence was not retained."}
        - {label: AQMed, x: 2, y: 1, detail: "Medical application identified; public competitive proof in the pool is limited."}
        - {label: Internal build, x: 3, y: 1, detail: "Potentially flexible substitute with no public comparable deployment evidence."}
    approximationNotes: >-
      Ordinal 1–5 analyst scores reflect only breadth and public evidence in the assigned pool; they are
      not market share, technical performance, pricing, or customer-satisfaction measurements.
    claimRefs: [CP001, CP002, CP005, CP007, CP013]
callouts:
  - calloutType: strength
    title: Procurement credibility is the most concrete edge
    body: >-
      The Air Force and later DoW disclosures provide a stronger trust signal than generic portfolio
      claims, although neither source supplies an independent performance comparison.
    claimRefs: [CP005, CP007]
  - calloutType: risk
    title: The central comparison set remains unresolved
    body: >-
      No retained source identifies and benchmarks a direct peer set across capability, price,
      distribution, and outcomes; broad category claims should not be treated as market leadership.
    claimRefs: [CP013, CP015]
