company:
  name: SandboxAQ
chapter:
  number: 3
  title: Competitors
  summary: >-
    SandboxAQ competes as a portfolio rather than in one clean category: its public scope spans
    quantitative-AI simulation, cryptographic management, navigation, and medical sensing. That breadth
    creates multiple routes to market, but the retained evidence does not identify a defensible peer set,
    comparable pricing, or independently benchmarked capability advantages, so differentiation remains
    more credible in government deployment than in broad competitive superiority.
sections:
  - id: competitive-boundary
    title: A portfolio creates several competitor sets
    body: >-
      SandboxAQ describes a broad quantitative-AI portfolio across pharma, energy, defense, and other
      markets, while the independent NeuronFeed profile lists drug discovery, materials prediction,
      cybersecurity, navigation, and medical applications. Reuters separately describes exposure to
      cybersecurity, encryption, and life sciences. The practical competitive boundary is therefore
      fragmented: scientific-software providers contest simulation workflows, security platforms and
      internal teams contest cryptographic inventory and migration, and conventional navigation or
      sensing systems contest the hardware-adjacent applications. This structure can diversify demand,
      but it also prevents a single brand or technical claim from establishing leadership across every
      category. The retained pool names no direct peer with enough comparable operating detail to support
      a complete vendor-by-vendor ranking, so the landscape below distinguishes supported company facts
      from class-level analyst inference and explicit unknowns.
    claimRefs: [CP001, CP002, CP004, CP013]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: proof-and-distribution
    title: Government deployments are the clearest trust signal
    body: >-
      The strongest competitive proof in the assigned evidence is public-sector adoption. DefenseScoop
      reported SandboxAQ's first U.S. military deal as a Phase I SBIR engagement to examine Air and Space
      Force cryptographic posture; the initial work was expected to last 90 days and might lead to
      follow-on phases. A later company release says the Department of War CIO is using AQtive Guard for
      automated discovery and inventory across its systems. These records support procurement credibility
      and a path to wider departmental access, but they are not independent performance benchmarks. The
      release is company-issued, the earlier contract value was undisclosed, and neither source compares
      detection coverage, migration time, false positives, or total cost against incumbent security
      platforms or internal tooling.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
  - id: economics-and-switching
    title: Pricing opacity weakens buyer-level comparison
    body: >-
      Public packaging evidence is too thin for an economic comparison. NeuronFeed labels SandboxAQ's
      pricing as enterprise but supplies no price, unit, discount structure, or contract term. The
      assigned sources likewise do not disclose realized pricing for AQtive Guard, simulation modules,
      AQNav, or AQMed. Integration may create switching costs once cryptographic assets and dependencies
      are continuously inventoried across a customer's environment, because replacing the system would
      require reproducing that visibility and workflow context. That is an analyst inference from the
      described deployment model, not measured retention evidence. Buyers can still multi-home by
      retaining existing security controls, scientific tools, or internal models alongside SandboxAQ,
      and no retained source quantifies exclusivity, migration cost, contract duration, or channel
      economics.
    claimRefs: [CP011, CP014]
    tableRefs: [TP003]
  - id: moat-and-displacement
    title: Technical breadth is not yet a measured moat
    body: >-
      SandboxAQ's differentiating narrative combines language interfaces with quantitative models based
      on physics, chemistry, biology, and simulation. That framing is distinctive, but the evidence
      available to this chapter does not show superior benchmark results against direct competitors.
      Reuters quotes investor Jim Breyer saying the models can train on existing hardware such as Nvidia
      GPUs and may benefit from future quantum-chip advances. Existing hardware compatibility lowers
      adoption friction, yet it may also limit infrastructure exclusivity and leave differentiation in
      proprietary data, model quality, workflow integration, and execution. NeuronFeed detected no
      public API, webhooks, OAuth 2.0, SDKs, or MCP server on its review date, which suggests a weaker
      visible developer-distribution surface, although absence from that scan is not proof that private
      integration capabilities do not exist. Competitive durability therefore remains contingent on
      benchmark disclosure, customer retention, proprietary data rights, and repeatable deployment.
    claimRefs: [CP003, CP012, CP015]
