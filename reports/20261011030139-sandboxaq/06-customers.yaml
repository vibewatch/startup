callouts:
  - calloutType: strength
    title: "Lighthouse Government Validation & Blue-Chip Brand Roster"
    body: >
      SandboxAQ has successfully penetrated demanding federal defense and tier-one corporate accounts, securing a five-year Department of War agreement, Air Force and Boeing navigation flight demonstrations, and biopharma partnerships with AstraZeneca and Sanofi. These deployments provide formidable brand validation in emerging quantitative AI markets.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU012
  - calloutType: risk
    title: "Commercial Opacity & Undisclosed Conversion Metrics"
    body: >
      Despite high-profile partnership announcements, SandboxAQ provides zero disclosure regarding total enterprise customer count, ARR, NRR, or pilot-to-production conversion rates. With early engagements characterized by 90-day SBIR exploratory studies or research collaborations, visibility into recurring software revenue durability remains heavily constrained.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU013

