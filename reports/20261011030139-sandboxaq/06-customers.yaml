company:
  name: "SandboxAQ"
chapter:
  number: 6
  title: "Customers"
  summary: "SandboxAQ has achieved notable early lighthouse customer traction across defense, aerospace, biopharma, and healthcare—including partnerships and deployments with the U.S. Department of War, U.S. Air Force, AstraZeneca, Sanofi, Boeing, Airbus, and Mayo Clinic—validating the cross-industry utility of its Large Quantitative Models (LQMs). However, commercial contracts are largely structured as exploratory SBIR studies or multi-year prototypes with undisclosed contract values, and the company discloses no customer count, ARR, NRR, or gross retention metrics, creating high uncertainty around customer concentration and enterprise conversion velocity."

sections:
  - id: customer-base-segmentation
    title: "Customer Base Segmentation & Target Buyers"
    body: >
      SandboxAQ segments its commercial customer base across four primary vertical sectors: defense and national security, biopharmaceutical research, commercial aerospace, and clinical healthcare sensing. In the defense and federal security domain, buyers represent cabinet-level Chief Information Officers, cybersecurity operational commands, and defense intelligence agencies tasked with mandate-driven post-quantum cryptographic transitions. In biopharmaceuticals and materials science, buyers are enterprise R&D leaders, computational chemists, and discovery biologics executives seeking accelerated molecular binding simulations. In aerospace and clinical diagnostics, user segments span aircraft manufacturers evaluating GPS-denied navigation systems and medical research institutions evaluating non-invasive cardiac magnetic sensing. This multi-sector footprint demonstrates the wide theoretical applicability of SandboxAQ's Large Quantitative Models across disparate physical chemistry and mathematical domains, yet also exposes the enterprise to diffuse go-to-market execution requirements across highly regulated and protracted procurement cycles.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU008
      - CU012
    tableRefs:
      - TU001

  - id: adoption-trajectory-named-proof
    title: "Adoption Trajectory & Named Customer Proof"
    body: >
      Commercial adoption has evolved from initial exploratory research projects upon SandboxAQ's spinout from Alphabet in 2022 into multi-year defense engagements and joint corporate flight trials. In federal cybersecurity, SandboxAQ progressed from an initial 90-day Small Business Innovation Research (SBIR) Phase I contract with the U.S. Air Force in November 2022 to a landmark five-year agreement with the Department of War Chief Information Officer in December 2025. This department-wide contract leverages the AQtive Guard suite for automated cryptographic discovery and inventory, following a successful prototype demonstration with DISA's Emerging Technology QRC PKI program. In aerospace, SandboxAQ has conducted rigorous flight demonstrations of its AQNav magnetic anomaly navigation platform across both military and commercial airframes with the U.S. Air Force, Boeing, and Airbus. In life sciences, the company collaborates with global pharmaceutical leaders AstraZeneca and Sanofi to predict molecular binding affinities, and participates in the OpenFold AI Research Consortium alongside Biogen and Astex.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU008
      - CU011
      - CU014
      - CU015
    tableRefs:
      - TU002
      - TU003

  - id: retention-durability-expansion
    title: "Retention Durability & Expansion Dynamics"
    body: >
      While SandboxAQ demonstrates credible commercial traction with marquee accounts, visibility into contract durability, gross retention, and net revenue retention (NRR) remains heavily obscured. SandboxAQ discloses no customer count, annual recurring revenue (ARR) run rate, or customer cohort retention curves. The company's expansion thesis relies on a multi-stage land-and-expand trajectory: landing within enterprise IT environments via cryptographic discovery and vulnerability scanning with AQtive Guard, before expanding into cryptographic agility remediation and specialized scientific LQM modules. To accelerate this enterprise onboarding loop, SandboxAQ established strategic go-to-market and integration partnerships with tier-one systems integrators Deloitte and EY, as well as formal collaboration with the National Institute of Standards and Technology (NIST) National Cybersecurity Center of Excellence. However, without disclosed expansion cohorts, the degree to which enterprise pilot customers expand into multi-million dollar annual recurring licenses remains an open diligence question.
    claimRefs:
      - CU003
      - CU004
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
    figureRefs:
      - FU001

  - id: concentration-procurement-risks
    title: "Customer Concentration & Federal Procurement Friction"
    body: >
      Customer concentration risk is acute given SandboxAQ's heavy reliance on federal defense contracts and multi-year government procurement timelines. Federal agency modernization represents a massive budget opportunity, but transitioning large public sector infrastructure to post-quantum standards faces substantial institutional friction, protracted appropriations cycles, and complex multi-stakeholder governance. Leadership has acknowledged that U.S. government procurement compliance is slow and transitioning federal enterprises will take years. Furthermore, public sector engagements such as the initial Air Force SBIR award often prohibit disclosure of contract values, preventing outside investors from independently assessing revenue quality, gross margin profiles, and single-customer concentration. Should federal defense priorities shift or agency implementation deadlines experience legislative delays, revenue predictability could face severe downside pressure.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU010
      - CU013

