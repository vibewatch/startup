- id: sizing-lenses
  title: Sizing Lenses — TAM, SAM, and Product-Near Market Proxies
  body: 'Public market-size estimates diverge because they measure different boundaries. Fortune Business Insights sizes the chiplet interconnect and UCIe ecosystem at $3.28 billion in 2026 and projects a steep multi-year growth path, while GM Insights places the chiplet interconnect market at $2.89 billion in 2026 and the broader chiplet market lens from Intel Market Research rises to $7.31 billion in 2026. PatSnap adds a still broader framing by placing the advanced-packaging market at roughly $49-$55 billion by 2026. These numbers are not contradictory so much as nested. Eliyan is closer to the interconnect and standards layer than to the whole chiplet stack, and much further from full advanced-packaging economics. The company also spans electrical and optical-adjacent connectivity, which makes it broader than a pure UCIe-IP vendor but narrower than a full rack-scale networking company. The most useful takeaway for valuation is therefore not one precise TAM, but a set of market envelopes:
    a low single-digit-billion direct interconnect opportunity today, a higher single-digit-billion broader chiplet context, and a much larger packaging-and-optics adjacency that only partly converts into Eliyan addressable revenue.'
