  evidenceGaps:
  - type: missing-source
    severity: material
    topic: som-model
    missingEvidence: Eliyan pricing, content per design win, win-rate assumptions, and deployment volumes.
    whyItMatters: Without bottom-up commercial inputs, TAM can bound upside but cannot support a reliable market-share or revenue forecast.
    diligencePath: Request pricing architecture, design-win pipeline, and expected content value by package and by rack.
    relatedQuestionRefs:
    - QM010
    - QM025
  - type: conflicting-data
    severity: minor
    topic: market-boundaries
    missingEvidence: One harmonized source that separately sizes interconnect IP, chiplet products, advanced packaging, and optical-adjacent layers.
    whyItMatters: Current market estimates are nested rather than aligned, which can lead to double counting if used carelessly.
    diligencePath: Rebuild the market map with a custom bottoms-up model using package counts, HBM adoption, and connectivity content assumptions.
    relatedQuestionRefs:
    - QM009
    - QM024
  - type: private-evidence-only
    severity: material
    topic: customer-segmentation
    missingEvidence: Named Eliyan customer programs by workload, package type, and deployment stage.
    whyItMatters: The buyer map is reasonable but still inferred until customer-specific proof shows where actual demand is converting.
    diligencePath: Ask management for program-by-program segmentation across hyperscalers, accelerator vendors, and memory-adjacent use cases.
    relatedQuestionRefs:
    - QM011
    - QM012
    - QM013
