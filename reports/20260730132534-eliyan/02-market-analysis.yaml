  rows:
  - - Chiplet interconnect / UCIe ecosystem
    - Die-to-die PHY IP, controllers, interoperability layers, validation and related ecosystem services
    - Most accelerator silicon value, server BOM, and generic networking spend
    - ASIC teams, packaging architects, hyperscalers, platform designers
    - Closest public market lens for Eliyan’s core offerings
  - - Broader chiplet market
    - All chiplet-enabled silicon building blocks and modular IC content
    - General IT infrastructure and non-chiplet semiconductors
    - Silicon vendors and system architects
    - Useful context but broader than Eliyan’s direct monetization
  - - Advanced packaging market
    - Interposers, bridges, substrates, assembly, test, and packaging services
    - Most IP-only and software value
    - Foundries, OSATs, advanced-packaging buyers
    - Important adjacency and constraint layer, not Eliyan’s direct revenue pool
  - - Rack-scale AI connectivity
    - Fabric switches, retimers, signal conditioners, optical engines, circuit switching, near-package optics
    - General compute silicon unrelated to connectivity
    - Rack architects, network platform teams, hyperscalers
    - Direct substitute and adjacent budget category
  - - Status-quo substitutes
    - Proprietary D2D links, pluggable optics, switch-side CPO, conventional SerDes-heavy designs
    - Vendor-neutral chiplet IP and memory-expansion chiplets
    - Incumbent silicon/platform owners
    - Main reason broad TAM will not convert one-for-one into Eliyan revenue
  notes: Rows distinguish Eliyan’s product-near connectivity layer from broader chiplet, packaging, and adjacent optical/networking spend.
