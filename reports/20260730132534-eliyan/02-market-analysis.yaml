company:
  name: Eliyan
chapter:
  number: 2
  title: Market Analysis
  summary: 'Eliyan sells into a fast-growing but easily overstated market: the connectivity layer that lets AI compute, memory, packaging, and optical fabrics work as multi-die systems. Independent 2026 market lenses span from roughly $2.9-$3.3 billion for chiplet interconnect/UCIe ecosystems to more than $7 billion for the broader chiplet market and roughly $49-$55 billion for advanced packaging. The market is attractive because AI workloads intensify memory, bandwidth, and power constraints, but adoption still depends on packaging complexity, buyer integration cycles, and competition from adjacent rack-scale and optical incumbents.'
sections:
- id: market-boundary
  title: Market Boundary & Status-Quo Substitutes
  body: 'Eliyan does not participate in the entire semiconductor market, or even the entire AI infrastructure market. Its direct revenue pool sits in the layer that makes multi-die AI systems communicate: die-to-die PHY IP, memory-interconnect logic, chip-to-chip links, associated chiplets, and adjacent electro-optical connectivity. That is narrower than the broad chiplet market, which includes many compute and subsystem chiplets, and also narrower than advanced packaging spend, which includes foundry, OSAT, and substrate value Eliyan does not directly monetize. The right market boundary therefore starts with chiplet interconnect and UCIe-style connectivity, then expands to adjacent substitute budgets such as advanced packaging, proprietary die-to-die links, rack-scale fabric switches, switch-side co-packaged optics, and photonic interconnect engines. This distinction matters because a headline TAM can be numerically large while still overstating Eliyan’s realistic near-term monetizable
    segment. In practice the relevant buyer is asking whether to spend budget on better connectivity around AI accelerators and memory systems, not whether to spend on semiconductors in the abstract.'
