  - FE002
- id: architecture-and-differentiation
  title: Architecture and Differentiation
  body: 'The technical core of Eliyan’s story is a memory- and bandwidth-centric architecture thesis. Rather than asking customers
    to solve scaling problems only through larger monolithic dies or generic board-level connectivity, Eliyan focuses on the
    junction where die-to-die links, packaging, and memory systems become bottlenecks. The white-paper surface is unusually
    helpful for a private semiconductor startup: the company has published work on packaging and simultaneous bi-directional
    signaling, along with public messaging around UMI and high-performance PHYs. This does not prove market success, but it
    does mean the architecture can be inspected at a deeper level than a typical marketing website allows. Independent commentary
    on the memory wall and packaging complexity reinforces that the problem is real. The differentiator is therefore not just
    protocol support, but the claim that Eliyan can deliver higher bandwidth density and better memory-facing behavior in
    chiplet systems.'
  claimRefs:
  - CE004
  - CE005
  - CE014
  - CE021
  - CE026
  - CE029
  tableRefs:
  - TE003
  figureRefs:
  - FE003
  - FE004
- id: deployment-roadmap-and-dependencies
  title: Deployment, Roadmap, and Dependencies
  body: 'Public evidence suggests Eliyan is moving from technology proof toward broader commercialization, but the dependency
    map is substantial. The 64Gbps-in-3nm announcement, Samsung portability work, latest UCIe support, and Arm ecosystem entry
    all strengthen roadmap credibility by showing multiple layers of execution: performance, process portability, standards
    compatibility, and partner alignment. NuLink-XD then extends the roadmap toward chip-to-module and optical-adjacent opportunities,
    which could materially expand the company’s strategic relevance. The trade-off is that each step increases dependency
    on foundries, packaging, standards bodies, and adjacent ecosystem players. Optical expansion especially widens the set
    of external readiness factors that Eliyan cannot fully control. Funding aimed at commercialization supports the idea that
    the company is preparing for deployment, but the public record still stops short of proving broad production maturity
    across named customer programs.'
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE009
  - CE015
