chapter:
  number: 5
  title: Product & Technology
  summary: Eliyan has a technically specific interconnect architecture story anchored in D2D, memory-wall, packaging, and
    optical-adjacent connectivity. Public evidence supports the roadmap direction and ecosystem fit, but production-support,
    reliability, and compliance proof remain materially thinner than the architecture narrative.
sections:
- id: product-definition-and-modules
  title: Product Definition and Module Map
  body: Eliyan’s product surface is best understood as enabling infrastructure rather than as a standalone compute product.
    The company is selling the connective tissue that helps advanced AI and HPC systems move data between dies, memory subsystems,
    and increasingly optical-adjacent links. Public materials consistently point to a set of building blocks—interconnect
    IP, PHY technology, chiplets, and memory-scaling constructs such as UMI—rather than a single monolithic SKU. That distinction
    matters because the real buyer is not a generic IT purchaser but a system-architecture or packaging team inside an OEM,
    hyperscaler, or silicon program. Eliyan’s module story is strong enough to map conceptually, but not yet fully documented
    in a public datasheet-rich surface. Investors can verify the architecture direction, yet still lack a complete public
    package list, support matrix, or deployment evidence for every claimed component. The chapter therefore treats product-definition
    claims as well supported and module-completeness claims as partial.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE011
  - CE012
  - CE023
  - CE033
