  - FU003
- id: retention-expansion-and-concentration
  title: Retention, Expansion, and Concentration
  body: 'Almost everything investors would want to know about customer durability remains undisclosed publicly. No retrieved
    source provides customer count, top-account share, contract length, renewal rate, NRR, GRR, or churn. That leaves a familiar
    semiconductor pattern: high strategic relevance, but limited visibility into how repeatable the business is after initial
    design-in. The likely shape is a concentrated book of large opportunities where one major program matters more than dozens
    of small accounts. That can be attractive if account quality is exceptional, but it also creates revenue lumpiness and
    execution risk when programs slip. Eliyan does appear to have a logical land-and-expand path because its technology can
    span die-to-die, memory, chip-to-chip, and eventually optical-adjacent layers. Still, the public record does not quantify
    movement through that funnel. The defensible view is that expansion potential is real, but retention and concentration
    remain first-order diligence gaps. That missing information is the core reason this chapter stays cautious even though
    the strategic roster is impressive. For infrastructure-component suppliers, the line between a technically admired product
    and a financially durable customer base is usually crossed only when repeat program data becomes visible. Another way
    to frame the gap is that Eliyan may already have valuable accounts, but investors cannot tell from public evidence whether
    those accounts are isolated experiments, scaling design-ins, or enduring platform relationships. That uncertainty should
    directly temper conviction on near-term revenue durability.'
