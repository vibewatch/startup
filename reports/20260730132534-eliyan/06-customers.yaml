chapter:
  number: 6
  title: Customers
  summary: Eliyan’s public customer evidence is directionally positive but still indirect. The company shows unusually strong
    strategic validation from compute, networking, and optics players, yet it discloses too little about named production
    customers, retention, and concentration to conclude that ecosystem pull has already translated into durable customer revenue.
sections:
- id: customer-segmentation-and-buyer-map
  title: Customer Segmentation and Buyer Map
  body: 'Eliyan’s likely customers are not general enterprises; they are advanced infrastructure organizations making design
    decisions around AI compute, memory, packaging, and network scaling. Public materials repeatedly point to hyperscalers,
    AI accelerator developers, memory suppliers, and infrastructure vendors as the relevant segment set. That means the true
    customer map is multi-layered. The user may be a system-architecture or packaging team, the buyer may be a platform or
    silicon program leader, and the payer may sit inside a broader datacenter or semiconductor budget. This matters because
    interconnect products are adopted through technical design programs, not through lightweight software procurement. It
    also means the addressable customer base is probably small in count but large in value per account. Eliyan appears aligned
    to exactly that shape: a supplier whose success depends on winning a limited number of strategically important accounts
    with very deep integration requirements. In practical terms, this creates a customer profile where even a small number
    of active programs can matter enormously. It also means qualitative buyer relevance can be strong long before public revenue
    disclosure becomes available, which is exactly the pattern visible in Eliyan’s current materials.'
  claimRefs:
  - CU001
  - CU002
  - CU012
  - CU018
  - CU030
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-proof-and-adoption-quality
  title: Named Proof and Adoption Quality
  body: The best public customer evidence for Eliyan is indirect but still meaningful. The company has publicly named strategic
    investors and ecosystem participants across AMD, Arm, Meta, Cisco, Lumentum, and optical-adjacent counterparties, while
    external coverage repeatedly frames the business as relevant to hyperscale and AI-infrastructure buyers. That is materially
    better than having no external validation at all. However, it is not the same as a conventional customer case study with
    outcomes, contract scope, production status, and renewal history. The public record contains language about customers
    evaluating or deploying Eliyan technologies, but it does not identify how many programs are in each stage or whether they
    are paying production engagements. As a result, the chapter treats named validation as directionally positive while still
    ranking customer-proof quality as incomplete. Eliyan has evidence of strong ecosystem pull, but not yet enough public
    disclosure to cleanly separate investor belief from durable customer revenue. The distinction is especially important
    at Eliyan’s stage because venture and strategic capital can accelerate ecosystem access without guaranteeing ongoing production
    receipts. A robust customer proof pack would separate endorsements, pilots, qualifications, deployments, and repeat orders.
    Public sources do not yet provide that ladder.
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU013
  - CU019
  - CU021
  - CU022
