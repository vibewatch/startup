- id: distribution-switching-and-substitutes
  title: Distribution, Switching Costs, and Substitutes
  body: 'Competitive outcomes in interconnect infrastructure depend on more than technical merit because qualification, packaging,
    and ecosystem alignment create long design cycles. Public-company incumbents can bundle connectivity with switches, NICs,
    optics, or custom-silicon engagements, giving them leverage in procurement even without proving a single best link metric.
    Eliyan’s strategic investments from hyperscalers and infrastructure partners help offset that imbalance, but they do not
    erase it. The status quo substitute is especially important: the largest customers can internalize interconnect design
    or procure a semi-custom bundle from a platform vendor. Switching costs appear to come less from public list pricing and
    more from design rework, validation effort, and production-risk tolerance. That makes time-to-design-win and access to
    ecosystem partners central parts of the competitive battle. Eliyan’s opportunity is that custom AI architectures increasingly
    need differentiated connectivity; its challenge is that the same trend makes internal build and incumbent bundles more
    credible.'
  claimRefs:
