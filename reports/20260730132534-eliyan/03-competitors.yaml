- id: capability-and-buyer-comparison
  title: Capability and Buyer Comparison
  body: 'The most useful comparison is not company size but where each vendor sits in the buyer workflow. Eliyan’s public
    materials emphasize PHY IP, chiplets, memory links, and specific bandwidth-density claims, while several rivals approach
    the same pain point from neighboring wedges: validated board-level connectivity platforms, interoperable UCIe IP blocks,
    or photonic fabrics aimed at longer-reach movement. Buyers therefore choose among architectures, not only brands. System
    teams optimizing within a package or immediately around the memory wall may prefer vendors that can tune D2D and memory-facing
    links. Teams designing broader AI fabrics may weight ecosystem integration and optical roadmaps more heavily. Public evidence
    is far weaker on list pricing than on capabilities, so the comparison must be framed around integration burden, reach,
    power, and ecosystem fit. That also means unsupported cells should stay unknown instead of being guessed from marketing
    copy.'
  claimRefs:
  - CP009
  - CP010
  - CP012
  - CP014
