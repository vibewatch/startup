evidenceGaps:
  - type: missing-source
    severity: material
    topic: revenue
    missingEvidence: Audited revenue, ARR, gross margin, and cash-flow disclosures.
    whyItMatters: >-
      Without operating metrics, the $1 billion valuation cannot be triangulated against growth, efficiency, or
      software-like stickiness.
    diligencePath: Request board deck KPI pages, current budget, and trailing-twelve-month bookings or revenue tables.
    relatedQuestionRefs:
      - QO016
  - type: private-evidence-only
    severity: material
    topic: customer-disclosure
    missingEvidence: Named production customers, design-win conversion data, and concentration by account.
    whyItMatters: >-
      Commercial momentum is one of the main pillars supporting Eliyan’s valuation, yet public materials do not identify
      who is buying at scale.
    diligencePath: Ask management for customer roster, deployment stages, and revenue contribution by top accounts under NDA.
    relatedQuestionRefs:
      - QO017
      - QO024
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: Authoritative company headcount and org split by engineering, GTM, and operations.
    whyItMatters: >-
      Third-party headcount estimates are directionally useful but not reliable enough for precision on burn or
      operating leverage.
    diligencePath: Request HR census, hiring plan, and organizational chart.
    relatedQuestionRefs:
      - QO018
  - type: missing-source
    severity: material
    topic: governance-rights
    missingEvidence: Board committee structure, ownership percentages, liquidation preferences, and protective provisions.
    whyItMatters: Late-stage preferred terms and control mechanics can materially change downside protection and exit economics.
    diligencePath: Review charter documents, financing documents, cap table, and investor-rights agreement.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: founding-date
    missingEvidence: A primary company source that states the exact founding or incorporation date used for investor materials.
    whyItMatters: >-
      Current public sources support the 2021 operating founding but differ on whether legal formation began in late
      2020 or formal incorporation in 2021.
    diligencePath: Obtain certificate of incorporation and management-confirmed founding timeline.
    relatedQuestionRefs:
      - QO002
  - type: missing-source
    severity: material
    topic: som-model
    missingEvidence: Eliyan pricing, content per design win, win-rate assumptions, and deployment volumes.
    whyItMatters: >-
      Without bottom-up commercial inputs, TAM can bound upside but cannot support a reliable market-share or revenue
      forecast.
    diligencePath: Request pricing architecture, design-win pipeline, and expected content value by package and by rack.
    relatedQuestionRefs:
      - QM010
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-boundaries
    missingEvidence: >-
      One harmonized source that separately sizes interconnect IP, chiplet products, advanced packaging, and
      optical-adjacent layers.
    whyItMatters: Current market estimates are nested rather than aligned, which can lead to double counting if used carelessly.
    diligencePath: >-
      Rebuild the market map with a custom bottoms-up model using package counts, HBM adoption, and connectivity content
      assumptions.
    relatedQuestionRefs:
      - QM009
      - QM024
  - type: private-evidence-only
    severity: material
    topic: customer-segmentation
    missingEvidence: Named Eliyan customer programs by workload, package type, and deployment stage.
    whyItMatters: >-
      The buyer map is reasonable but still inferred until customer-specific proof shows where actual demand is
      converting.
    diligencePath: >-
      Ask management for program-by-program segmentation across hyperscalers, accelerator vendors, and memory-adjacent
      use cases.
    relatedQuestionRefs:
      - QM011
      - QM012
      - QM013
  - type: stale
    severity: minor
    topic: analyst-market-data
    missingEvidence: Additional 2026 or 2027 analyst updates from higher-tier market-data providers.
    whyItMatters: Several available market reports are commercial lead-gen summaries rather than detailed, transparent models.
    diligencePath: Acquire full reports or triangulate with public-company disclosures and supplier shipment data.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM007
      - QM008
  - type: private-evidence-only
    severity: material
    topic: adoption-curve
    missingEvidence: Qualification-cycle length, test-yield data, and integration cost data for actual Eliyan deployments.
    whyItMatters: >-
      Market demand can exist while adoption still lags due to packaging, standards, and production-readiness
      bottlenecks.
    diligencePath: Review customer qualification plans, tapeout schedules, and package validation milestones under NDA.
    relatedQuestionRefs:
      - QM019
      - QM020
      - QM025
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Actual Eliyan pricing, contract model, or licensing economics versus peers.
    whyItMatters: Without pricing visibility it is hard to underwrite share gain versus incumbent bundles.
    diligencePath: Request sample deal structure and pricing benchmarks from management.
  - type: enumeration-incomplete
    severity: material
    topic: named production deployments
    missingEvidence: Named production wins for Eliyan and several private peers remain sparse in public sources.
    whyItMatters: Competitive ranking is weaker when deployment proof trails technical messaging.
    diligencePath: Request customer references and shipped-program counts by product line.
  - type: stale
    severity: minor
    topic: peer adoption depth
    missingEvidence: Updated 2026 customer evidence for optical rivals and private UCIe vendors.
    whyItMatters: Fast-moving interconnect markets can reorder leaders quickly.
    diligencePath: Refresh customer-proof and conference evidence before investment decision.
  - type: private-evidence-only
    severity: blocking
    topic: revenue and gross margin
    missingEvidence: Monthly/annual revenue, gross margin, and booked backlog by product family.
    whyItMatters: >-
      These are the core inputs required to test whether a $1B valuation is justified by current scale or only by future
      promise.
    diligencePath: Request audited or board-level revenue and margin history.
  - type: missing-source
    severity: material
    topic: runway
    missingEvidence: Cash-on-hand, burn, debt, and covenant disclosures.
    whyItMatters: Capital adequacy cannot be quantified precisely without actual liquidity data.
    diligencePath: Request latest balance sheet, cash flow, and financing agreements.
  - type: conflicting-data
    severity: minor
    topic: business model mix
    missingEvidence: Precise mix of licensing, silicon, and services revenue.
    whyItMatters: Margin path differs materially by monetization model.
    diligencePath: Request product-level revenue bridge and recognition policy.
  - type: missing-source
    severity: material
    topic: reliability and support
    missingEvidence: Field reliability, qualification, support SLA, or defect-rate evidence.
    whyItMatters: Deep-infrastructure buyers will prioritize supplier reliability as much as raw performance.
    diligencePath: Request qualification decks, RMA history, and support model documentation.
  - type: private-evidence-only
    severity: material
    topic: production deployments
    missingEvidence: Named production programs and shipped volumes by product family.
    whyItMatters: Without deployment proof it is hard to separate mature products from roadmap-heavy assets.
    diligencePath: Request customer references and tape-out-to-production conversion history.
  - type: stale
    severity: minor
    topic: compliance and certifications
    missingEvidence: Updated 2026 evidence on export-control handling, ISO coverage, and product quality systems.
    whyItMatters: Scaling AI infrastructure suppliers increasingly face compliance diligence from buyers.
    diligencePath: Request quality certifications and compliance policies from management.
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof
    missingEvidence: Public named production customers, pilot status, and outcome metrics for specific accounts.
    whyItMatters: Strategic investor validation is not a substitute for real adoption and retention data.
    diligencePath: Request reference customers, stage definitions, and shipped-program evidence.
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: blocking
    topic: retention and concentration
    missingEvidence: NRR/GRR, renewal rates, top-customer exposure, and follow-on design-win data.
    whyItMatters: These are the metrics required to underwrite durability and downside risk.
    diligencePath: Request account-level retention and concentration schedules.
  - type: missing-source
    severity: material
    topic: customer outcomes
    missingEvidence: Named customer case studies with quantified performance outcomes.
    whyItMatters: Without outcomes, the difference between curiosity and mission-critical adoption remains unclear.
    diligencePath: Request case studies or customer references with deployment metrics.
  - type: enumeration-incomplete
    severity: material
    topic: TR001 regulatory legal risk register
    missingEvidence: Formal export classification, litigation checks, and IP counsel review beyond public web sources.
    whyItMatters: The public record is too thin to clear legal and export risks conclusively.
    diligencePath: Request export-control memo, litigation summary, and freedom-to-operate review.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: customer concentration and qualification
    missingEvidence: Top-account exposure, qualification cycle times, and slip history by program.
    whyItMatters: These are the exact variables most likely to trigger revenue lumpiness or a valuation reset.
    diligencePath: Request pipeline-stage report and top-customer concentration schedule.
  - type: access-blocked
    severity: minor
    topic: third-party corroboration quality
    missingEvidence: Some external pages were blocked or broken, limiting independent corroboration breadth.
    whyItMatters: Sparse corroboration increases the burden on management diligence.
    diligencePath: Re-run source collection with paid databases or counsel-supported diligence.
  - type: enumeration-incomplete
    severity: material
    topic: TV005 comparable valuation table
    missingEvidence: Normalized public-company revenue, margin, and multiple data suitable for a true comp table.
    whyItMatters: Without usable operating comparables, valuation relies more heavily on scenarios and the latest private round.
    diligencePath: Use paid market data and management financials to build a proper comparable set.
    relatedTableRefs:
      - TV005
  - type: private-evidence-only
    severity: blocking
    topic: revenue quality and unit economics
    missingEvidence: Revenue, gross margin, backlog, concentration, and runway.
    whyItMatters: These are the core denominators required to judge whether the $1B mark is fair or stretched.
    diligencePath: Request board-level operating data and cohort/customer schedules.
  - type: access-blocked
    severity: minor
    topic: public comp extraction
    missingEvidence: Some filing and article URLs were not machine-readable enough to extract normalized metrics.
    whyItMatters: This limited the depth of web-only comp analysis.
    diligencePath: Supplement with terminal data or downloadable filings.
