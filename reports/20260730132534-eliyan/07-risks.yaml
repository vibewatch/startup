  - TR003
  - TR004
  figureRefs:
  - FR003
- id: mitigations-kill-criteria-and-overall-view
  title: Mitigations, Kill Criteria, and Overall View
  body: Eliyan is not a visibly distressed or obviously non-compliant company; instead, it is a company with several meaningful
    but still partially unresolved risks stacked together. The strongest public mitigants are the amount of capital raised,
    the caliber of ecosystem validation, and the technical specificity of the product story. The weakest public areas are
    legal and regulatory detail, production-quality disclosure, customer durability evidence, and full financial transparency.
    That combination suggests a risk profile best managed through explicit kill criteria rather than generic optimism. If
    export controls materially constrain target markets, if optical roadmap milestones slip, if one or two flagship programs
    stall, or if the next financing arrives before repeat customer proof, the thesis weakens quickly. Conversely, production
    deployments, concentration disclosure, and clear qualification metrics would defuse several of the highest-severity concerns
    at once. In other words, the downside path is cumulative. None of the open risks has to go badly on its own for the investment
    case to weaken; a modest customer delay, a modest roadmap slip, and incomplete regulatory clarity together could be enough
    to impair the next financing or compress strategic options. That cumulative framing should anchor committee debate.
  claimRefs:
  - CR018
  - CR019
  - CR020
  - CR021
  - CR024
