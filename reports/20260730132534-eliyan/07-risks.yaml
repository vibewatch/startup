chapter:
  number: 7
  title: Risks
  summary: Eliyan’s risks are concentrated in export-control uncertainty, qualification complexity, customer concentration,
    and the gap between visible funding momentum and still-limited operating disclosure. No single public source shows a fatal
    flaw, but several high-severity uncertainties could combine into a sharp commercial or valuation reset if milestones slip.
sections:
- id: regulatory-and-legal-risks
  title: Regulatory and Legal Risks
  body: The most visible public regulatory risk for Eliyan is export-control spillover. U.S. policy tightened again around
    AI semiconductors in 2026, and Eliyan is building precisely in the domain—advanced AI connectivity and semiconductor infrastructure—that
    policymakers increasingly view as strategic. Public company materials and funding releases do not explain how Eliyan classifies
    its products, which geographies matter most, or how the optical roadmap could alter compliance burden. That does not imply
    a present violation, but it does create meaningful diligence uncertainty. The legal surface is similarly thin. OpenCorporates
    confirms the entity’s existence, yet the company’s private status means investors cannot rely on the same litigation,
    risk-factor, or governance disclosure they would expect from a public issuer. No public enforcement or lawsuit appeared
    in the retrieved set, but the absence of surfaced incidents is weaker evidence when the disclosure perimeter itself is
    narrow.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR031
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-and-product-risks
  title: Operational and Product Risks
  body: 'Operational risk is structurally high because Eliyan sits at one of the hardest layers in the AI infrastructure stack:
    the intersection of dies, memory, packaging, and increasingly optics. Even if the underlying technology is strong, qualification
    delays, interoperability challenges, and manufacturing dependencies can postpone or shrink commercial wins. Independent
    commentary on AI infrastructure complexity supports that concern. The public record does not disclose yield, defect-rate,
    or field-reliability metrics, nor does it identify specific foundry or OSAT dependencies in enough detail to clear supply-chain
    risk. Optical expansion increases the number of external partners and readiness factors that must line up. The practical
    consequence is that Eliyan can be technologically right and still commercially late. That gap between technical relevance
    and operational conversion is one of the company’s core underwriting risks.'
  claimRefs:
  - CR006
  - CR007
  - CR008
  - CR009
  - CR023
  - CR027
  - CR028
  - CR036
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: partner-customer-and-financial-risks
  title: Partner, Customer, and Financial Risks
  body: The partner and customer sides of the risk stack are tightly linked. Eliyan benefits from ecosystem ties to Arm, AMD,
    Cisco, Lumentum, and optics-related counterparties, but those same ties underline how dependent commercialization may
    be on a relatively small set of sophisticated programs. Customer concentration is therefore likely, and concentration
    in this category can transmit quickly into lumpy revenue, missed milestones, and valuation volatility. Public evidence
    is still too thin to disprove long pilot cycles or stalled design evaluations. Financial risk compounds the picture. Eliyan’s
    public record is rich on capital raised and poor on revenue, margin, burn, and runway. That means the company can look
    well financed today and still face future capital pressure if design-win conversion is slower than the $1 billion valuation
    implies. The most important visible risk is not insolvency today; it is evidence shortfall against future expectations.
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR015
  - CR016
  - CR017
  - CR022
  - CR030
  - CR033
  - CR034
  - CR037
  - CR038
