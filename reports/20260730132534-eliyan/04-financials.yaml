  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue and gross margin
    missingEvidence: Monthly/annual revenue, gross margin, and booked backlog by product family.
    whyItMatters: These are the core inputs required to test whether a $1B valuation is justified by current scale or only
      by future promise.
    diligencePath: Request audited or board-level revenue and margin history.
  - type: missing-source
    severity: material
    topic: runway
    missingEvidence: Cash-on-hand, burn, debt, and covenant disclosures.
    whyItMatters: Capital adequacy cannot be quantified precisely without actual liquidity data.
    diligencePath: Request latest balance sheet, cash flow, and financing agreements.
  - type: conflicting-data
    severity: minor
    topic: business model mix
    missingEvidence: Precise mix of licensing, silicon, and services revenue.
    whyItMatters: Margin path differs materially by monetization model.
    diligencePath: Request product-level revenue bridge and recognition policy.
