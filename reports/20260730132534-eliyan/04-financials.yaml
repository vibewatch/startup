- id: capital-adequacy-and-funding-dependence
  title: Capital Adequacy and Funding Dependence
  body: What is visible publicly is the funding stack. Eliyan announced a $50 million strategic financing in January 2026
    and a $145 million Series C in July 2026, on top of prior Series A and Series B rounds. That disclosed chronology implies
    at least $295 million of announced capital, which is meaningful for a young semiconductor company. The new funds were
    consistently described as commercialization and scale-up capital, not as emergency recapitalization, which is positive.
    At the same time, the cadence of raises suggests a business still in active build-out mode and therefore dependent on
    external capital until revenue scales. The public record does not disclose cash on hand, monthly burn, runway, debt, or
    purchase obligations, so solvency cannot be modeled precisely. The best conclusion is that near-term financing risk looks
    lower after the 2026 raises, but valuation pressure is higher because the round size and unicorn mark imply rapid conversion
    from technical promise to market traction.
  claimRefs:
  - CI004
  - CI005
  - CI006
  - CI011
  - CI012
  - CI018
  - CI019
  - CI029
  - CI030
  - CI033
