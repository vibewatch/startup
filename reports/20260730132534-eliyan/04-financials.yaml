- id: sales-motion-and-cost-structure
  title: Sales Motion and Cost Structure
  body: 'The likely financial mechanics of Eliyan differ materially from those of software companies because this category
    is sold through design cycles, validation work, and ecosystem qualification. Public evidence suggests sales efficiency
    will be shaped by a small number of large technical programs rather than by high-velocity account acquisition. Strategic
    investors may help with access, but they do not eliminate procurement risk or prove recurring demand. On the cost side,
    the retrieved sources support a directional but not numerical conclusion: chiplet and interconnect commercialization is
    capital intensive. Foundry work, packaging, integration, validation, and field support are all likely heavier burdens
    than a pure IP story would imply. Eliyan’s optical expansion can compound that burden before associated revenue becomes
    visible. Hiring activity on the careers page reinforces that fixed operating costs are still building. Yet no public source
    retrieved provides CAC, payback, gross margin, or contribution margin, so the true economic engine remains hidden behind
    the technical narrative.'
  claimRefs:
  - CI009
  - CI010
  - CI014
  - CI015
  - CI016
