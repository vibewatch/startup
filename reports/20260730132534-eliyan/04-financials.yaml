chapter:
  number: 4
  title: Financials
  summary: Eliyan looks well funded but financially opaque. Public evidence shows at least $295 million of announced capital
    and clear scale-up intent, but no disclosed revenue, margins, burn, or backlog, so the financial case remains a commercialization-underwriting
    exercise rather than a metric-backed operating analysis.
sections:
- id: revenue-model-and-disclosure
  title: Revenue Model and Disclosure Limits
  body: 'Eliyan’s public materials support a clear top-line description of what it sells, but not a quantitative picture of
    how much it earns or at what margin. The company appears to monetize connectivity technology through a combination of
    interconnect IP, PHY technology, chiplets, and related design-in engagements for AI and high-performance compute systems.
    That is enough to understand the business model category: Eliyan is selling infrastructure components into long-cycle
    semiconductor programs, not consumer-facing software or commodity hardware. What remains opaque is the revenue mix across
    licensing, silicon content, support, and custom engineering. None of the retrieved 2026 funding or media materials publishes
    revenue, gross margin, ARR, unit shipments, or customer concentration. As a result, revenue quality cannot be judged from
    public evidence alone. The company’s messaging prioritizes technical performance, ecosystem positioning, and future commercialization,
    which is consistent with a venture-backed semiconductor infrastructure company still proving the path from design relevance
    to scaled monetization.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI007
  - CI008
  - CI023
  - CI028
  - CI032
