- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: 'The public evidence supports a narrow financial verdict: Eliyan looks well financed relative to what it has chosen
    to disclose, but still under-disclosed for full underwriting. The positives are clear. Independent coverage and company
    releases consistently document strong investor appetite, a large 2026 funding stack, and a roadmap that could justify
    substantial long-term value if design wins translate into repeatable revenue. The negatives are equally clear. There is
    no public revenue base, no gross-margin disclosure, no burn or runway figure, no visibility into working capital, and
    no evidence on customer concentration or renewal dynamics. Public-company comparables show what disclosure would normally
    exist in mature infrastructure vendors, which highlights how much is missing here. For an investor, that means the key
    diligence questions are not around whether Eliyan raised money, but whether that money is converting into commercially
    durable programs quickly enough to support a $1 billion valuation without another heavily dilutive financing.'
  claimRefs:
