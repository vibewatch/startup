      - number: '8.2'
        title: Current Valuation Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The latest priced anchor is the July 2026 Series C at a $1 billion valuation, following a $50 million
              strategic financing earlier the same year. That is a strong market signal, but it is also the central
              underwriting constraint for a new investor. Eliyan is no longer a cheap option on a promising technical
              team; it is a unicorn-priced semiconductor infrastructure company with limited public operating
              disclosure. Because revenue, margin, and runway are not available publicly, there is no easy denominator
              to compare against the visible valuation. That makes entry discipline non-negotiable. Investors should
              assume the round price already embeds meaningful expectations around customer conversion, ecosystem
              leverage, and optical-roadmap progress. The burden of proof therefore falls on evidence that can either
              justify the mark or reveal it to be ahead of the commercial reality.
