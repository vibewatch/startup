      - number: '2.5'
        title: Constraints, Adoption Friction & Debate
        blocks:
          - type: paragraph
            body: >-
              The attractive demand backdrop does not eliminate adoption friction. SemiEngineering’s chiplet coverage
              emphasizes rising architectural complexity, and its memory-wall coverage reinforces how difficult
              packaging, routing, and memory integration remain even when demand is obvious. EE Times adds a more
              explicitly adverse market view, arguing that the chiplet landscape is heading into consolidation and that
              unresolved issues around testing, interoperability, security, and optical transition will determine which
              vendors survive as independent businesses. These constraints matter directly for Eliyan because its
              best-case narrative spans multiple domains at once: die-to-die, die-to-memory, chip-to-chip, and
              electro-optical scale-up. Each additional domain expands TAM but also raises integration scope and buyer
              qualification burden. There is also a substitute risk. Large adjacent vendors already sell or market
              rack-scale AI switches, optical engines, CPO, or circuit-switching fabrics that can capture the same
              budget line from different angles. The result is a market with strong demand and real urgency, but still a
              long qualification cycle and a meaningful gap between technical relevance and revenue realization.
            claimRefs:
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
