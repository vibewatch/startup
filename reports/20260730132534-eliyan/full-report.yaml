  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Direct Peers
        blocks:
          - type: paragraph
            body: >-
              Eliyan does not compete in the broad AI-chip market; it competes in the narrower but strategically
              important layer that moves data between dies, memory subsystems, and increasingly optical links. Public
              evidence suggests at least four rival classes matter. First are direct D2D and UCIe-oriented suppliers
              such as Astera Labs and Alphawave that address advanced packaging and die-to-die connectivity with IP or
              silicon. Second are large incumbents such as Broadcom and Marvell that can attach interconnect
              technologies to broader networking, optics, or custom-silicon franchises. Third are photonics specialists
              such as Lightmatter, Celestial AI, and Ayar Labs, which compete more directly as connectivity moves beyond
              copper. Finally, hyperscaler internal build remains a substitute for the highest-volume buyers. This means
              Eliyan’s competitive set is not static: some rivals attack package-level links, some attack rack-scale
              optics, and some can do both. The practical implication is that Eliyan must prove where its specific
              interface approach is indispensable rather than merely standards-compliant.
