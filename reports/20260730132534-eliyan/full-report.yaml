chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity & Product Scope
        blocks:
          - type: paragraph
            body: >-
              Eliyan presents itself as an advanced-connectivity semiconductor company aimed at the bandwidth, memory,
              and power bottlenecks that increasingly define AI infrastructure. Across its homepage, products pages,
              technology pages, and July 2026 Series C announcement, the company consistently frames the core offering
              as a family of NuLink PHY IP blocks and NuGear chiplet products that span die-to-die, die-to-memory,
              chip-to-chip, and increasingly rack-to-rack use cases. The most differentiated part of the story is not
              just raw speed, but packaging flexibility: Eliyan argues that its interconnects can deliver
              advanced-package-class performance on standard organic substrates, reducing cost, complexity, and
              supply-chain dependence. That matters because AI system builders are hitting practical limits in
              interposer capacity, thermal density, test complexity, and time-to-market. Eliyan is therefore selling a
              connectivity architecture thesis, not just a narrow piece of IP, and positioning itself as a way to extend
              chiplet economics across compute, memory, and optical fabrics.
