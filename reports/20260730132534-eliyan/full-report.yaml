      - number: '1.3'
        title: Funding History & Investor Signaling
        blocks:
          - type: paragraph
            body: >-
              Eliyan’s capital history shows a rapid progression from venture-backed technical validation into strategic
              ecosystem financing. The November 2022 Series A brought in $40 million and paired financing with a 5nm
              tapeout, which strongly linked capital formation to an engineering milestone. The March 2024 Series B
              added $60 million from Samsung Catalyst Fund and Tiger Global with participation from Intel Capital, SK
              hynix, and others, broadening the investor base toward both platform and memory-adjacent strategics. In
              January 2026 Eliyan then announced a separate $50 million strategic financing from AMD, Arm, Coherent,
              Meta, Samsung Catalyst Fund, and Intel Capital, explicitly tied to commercialization and AI-system
              deployment. Finally, the July 2026 Series C added $145 million at a $1 billion valuation, led by Seligman
              Ventures and joined by Cisco Investments and Lumentum. Summing only publicly disclosed rounds implies at
              least $295 million of announced capital since 2022. More important than the arithmetic is the pattern:
              Eliyan’s cap table is becoming a map of the AI interconnect stack, spanning compute, foundry, memory,
              networking, and optical constituencies.
