              Eliyan’s likely customers are not general enterprises; they are advanced infrastructure organizations
              making design decisions around AI compute, memory, packaging, and network scaling. Public materials
              repeatedly point to hyperscalers, AI accelerator developers, memory suppliers, and infrastructure vendors
              as the relevant segment set. That means the true customer map is multi-layered. The user may be a
              system-architecture or packaging team, the buyer may be a platform or silicon program leader, and the
              payer may sit inside a broader datacenter or semiconductor budget. This matters because interconnect
              products are adopted through technical design programs, not through lightweight software procurement. It
              also means the addressable customer base is probably small in count but large in value per account. Eliyan
              appears aligned to exactly that shape: a supplier whose success depends on winning a limited number of
              strategically important accounts with very deep integration requirements. In practical terms, this creates
              a customer profile where even a small number of active programs can matter enormously. It also means
              qualitative buyer relevance can be strong long before public revenue disclosure becomes available, which
              is exactly the pattern visible in Eliyan’s current materials.
