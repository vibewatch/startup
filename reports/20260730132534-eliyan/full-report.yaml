      - number: '2.4'
        title: Growth Drivers
        blocks:
          - type: paragraph
            body: >-
              The main market driver is simple: AI systems are running into memory and I/O limits faster than raw
              compute improvements can compensate. Eliyan’s own materials call these the memory and I/O walls, and both
              Electronic Design and SemiAnalysis reinforce the same structural point: AI workloads need more bandwidth,
              lower latency, more memory capacity, and better energy efficiency. Open standards are the second driver.
              Fortune and the UCIe Consortium both show the ecosystem moving toward UCIe as a default interoperability
              layer, reducing the friction of multi-vendor chiplet architectures. A third driver is the migration from
              single-node optimization to rack-scale or cluster-scale optimization. Astera Labs, Broadcom, Lightmatter,
              Ayar Labs, Celestial AI, and Marvell-Lumentum optical-network demonstrations all show large vendors now
              investing around the same bottleneck. Eliyan benefits from that structural demand even if it does not win
              every budget category. Finally, investor behavior itself is a market signal: Eliyan’s strategic rounds
              from compute, hyperscaler, memory, networking, and optical participants suggest that major ecosystem
              actors believe interconnect is becoming a performance-defining layer rather than a background
              implementation detail.
