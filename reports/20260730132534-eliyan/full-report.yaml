      - number: '8.3'
        title: Scenarios and Comparable Framing
        blocks:
          - type: paragraph
            body: >-
              Because hard comp normalization is weak from the public web evidence available here, the most defensible
              valuation method is scenario analysis rather than a faux-precise multiple table. A bull case can support
              the current or higher valuation if Eliyan proves itself as a critical layer across die-to-die, memory, and
              optical-adjacent connectivity with repeated production deployments. A base case is more conservative: the
              company remains technically differentiated and strategically relevant, but still needs more customer,
              margin, and concentration proof before investors can underwrite meaningful upside from the current mark. A
              bear case emerges if qualification cycles drag, concentration is high, and financing arrives before public
              evidence of durable revenue. Comparables still matter directionally because public infrastructure names
              and scaled interconnect vendors show what a mature disclosure set should look like, but the current record
              is too thin for a reliable multiple-driven output. That is why the comparable table is intentionally
              humble: it frames reference points and disclosure standards, but it does not pretend this workflow
              extracted the kind of normalized market data a true investment committee memo would require.
