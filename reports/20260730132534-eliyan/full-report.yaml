      - number: '8.4'
        title: Final Call and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              On current public evidence alone, Eliyan looks more like a high-quality research-more or track candidate
              than an invest-now conviction buy. That is not a negative verdict on the company; it is a recognition that
              the visible price is specific and the visible operating proof is not. The call can improve if management
              shows repeated production deployments, concentration data, gross-margin quality, and a financing runway
              that supports milestone delivery without near-term pressure. The call can worsen if customer proof remains
              indirect through the next financing cycle or if execution drags while the market consolidates around
              broader bundles. This should therefore be treated as an evidence-sensitive recommendation with explicit
              move-up and move-down triggers, not as a generic score on team quality or technical ambition. In committee
              terms, Eliyan deserves another round of data gathering, not an immediate rejection. The company may
              justify its price, but the current public record does not prove it yet. Price should not outrun proof.
            claimRefs:
