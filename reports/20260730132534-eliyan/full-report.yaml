      - number: '2.3'
        title: Buyer, User, and Payer Structure
        blocks:
          - type: paragraph
            body: >-
              The direct buyer for Eliyan-like connectivity is rarely a stand-alone procurement team. More often it is a
              chain of actors beginning with AI-accelerator architects, package-design teams, memory-interface teams,
              board or rack designers, and hyperscaler infrastructure groups that set system-level bandwidth and power
              targets. Eliyan’s own product materials and financing announcements point to AI accelerators, memory
              expansion, cloud infrastructure, and high-performance computing as the immediate problem set. The
              surrounding market confirms that the budget is increasingly owned where system architecture decisions are
              made. Astera Labs frames the rack as the new unit of compute in AI infrastructure, Broadcom frames
              co-packaged optics around power-efficiency and bandwidth density, and Lightmatter and Ayar Labs both sell
              optical interconnect systems intended to solve similar cluster-scale bottlenecks. That means buyer control
              sits with platform architects and strategic silicon teams rather than with commodity module purchasing.
              The user and payer may be different: a hyperscaler may define the workload need, but an ASIC team, switch
              vendor, or packaging partner may decide which interconnect stack actually gets designed in.
