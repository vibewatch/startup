  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The valuation debate on Eliyan is unusually clear in one respect: the company is solving a real and
              strategically important infrastructure problem. The anti-thesis is equally clear: public proof trails
              ambition by a wide margin. Eliyan’s bull case rests on category relevance, technical specificity,
              ecosystem validation, and the possibility that AI system design is shifting enough to make interconnect
              specialists disproportionately valuable. The anti-thesis is that those qualities are exactly what many
              infrastructure startups say before the market learns whether they can convert technical admiration into
              durable revenue. Public evidence does not disprove the upside, but it does prevent an investor from
              treating the current price as obvious. This is a case where company quality may be high while price
              discipline still matters a great deal. Evidence quality matters enormously here.
            claimRefs:
              - CV004
              - CV005
