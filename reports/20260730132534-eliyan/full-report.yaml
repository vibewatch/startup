      - number: '1.4'
        title: Milestones & Commercialization Posture
        blocks:
          - type: paragraph
            body: >-
              Public milestones indicate that Eliyan has moved beyond a pure concept-stage startup, but not yet into a
              fully disclosed scale-up story. In 2022 the company announced a 5nm tapeout and framed Series A capital
              around commercial readiness. By 2023 it was publicly aligning NuLink with UCIe and BoW and adding Jason
              Taylor to the board, which signaled growing ecosystem and infrastructure relevance. In 2024 it announced a
              64Gbps-per-link 3nm milestone, a Samsung SF4X port, and continued emphasis on standard-package economics
              relative to advanced packaging. In 2025 Eliyan joined Arm’s Total Design ecosystem, linking its technology
              to broader open-chiplet architecture work. The two 2026 announcements mattered most for commercialization:
              the January strategic financing claimed active support from hyperscaler and AI-platform investors, while
              the July NuLink-XD launch expanded the narrative from package-level D2D into chip-to-module
              electro-optical links for scale-up networks. Even so, the company’s own language still emphasizes
              customers evaluating or deploying technology rather than naming production revenue, unit volumes, or
              signed design-win counts, which means commercialization is credible but not yet fully transparent.
