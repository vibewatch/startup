        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              The most visible public regulatory risk for Eliyan is export-control spillover. U.S. policy tightened
              again around AI semiconductors in 2026, and Eliyan is building precisely in the domain—advanced AI
              connectivity and semiconductor infrastructure—that policymakers increasingly view as strategic. Public
              company materials and funding releases do not explain how Eliyan classifies its products, which
              geographies matter most, or how the optical roadmap could alter compliance burden. That does not imply a
              present violation, but it does create meaningful diligence uncertainty. The legal surface is similarly
              thin. OpenCorporates confirms the entity’s existence, yet the company’s private status means investors
              cannot rely on the same litigation, risk-factor, or governance disclosure they would expect from a public
              issuer. No public enforcement or lawsuit appeared in the retrieved set, but the absence of surfaced
              incidents is weaker evidence when the disclosure perimeter itself is narrow.
