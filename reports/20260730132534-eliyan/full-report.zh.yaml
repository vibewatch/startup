  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Eliyan 不参与整个半导体市场，甚至也不参与整个 AI 基础设施市场。它的直接收入池位于让多裸片 AI 系统彼此通信的层：裸片到裸片 PHY IP、存储互连逻辑、芯片到芯片链路、相关
              chiplet，以及相邻的电光连接。这比广义 chiplet 市场更窄，后者包括许多计算和子系统 chiplet；也比先进封装支出更窄，后者包括 Eliyan 不直接变现的代工、OSAT
              和基板价值。因此，正确的市场边界应从 chiplet 互连和 UCIe 式连接开始，再扩展到相邻替代预算，例如先进封装、专有裸片到裸片链路、机架级 fabric
              交换机、交换侧共封装光学，以及光子互连引擎。这个区分重要，因为标题式 TAM 可以很大，但仍会夸大 Eliyan 近期可现实变现的细分市场。实践中，相关买家问的是要不要把预算投向 AI
              加速器和存储系统周边更好的连接，而不是抽象地要不要投向半导体。
