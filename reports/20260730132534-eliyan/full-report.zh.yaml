      - number: '2.3'
        title: 买家、用户与付费方结构
        blocks:
          - type: paragraph
            body: >-
              Eliyan 这类连接产品的直接买家很少是独立采购团队。更常见的是一条角色链：从 AI 加速器架构师、封装设计团队、存储接口团队、板级或机架设计者，到设定系统级带宽和功耗目标的 hyperscaler
              基础设施团队。Eliyan 自有产品材料和融资公告指向 AI 加速器、存储扩展、云基础设施和高性能计算，说明这些就是即时问题集。周边市场也证实，预算越来越由做系统架构决策的团队掌握。Astera Labs
              把机架定义为 AI 基础设施的新计算单元，Broadcom 围绕能效和带宽密度定义共封装光学，Lightmatter 和 Ayar Labs
              都在销售旨在解决类似集群级瓶颈的光互连系统。这意味着买方控制权在平台架构师和战略硅团队手中，而不是在商品化模块采购手中。用户和付费方也可能不同：hyperscaler 可能定义工作负载需求，但最终由 ASIC
              团队、交换机厂商或封装伙伴决定哪套互连栈被设计进去。
