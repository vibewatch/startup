      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公司仍由创始团队主导，这也是最重要的尽调事实之一，因为 Eliyan 的技术可信度和 go-to-market 执行，都押在少数几位连续创业 / 运营者身上。官方材料显示，Ramin Farjadrad
              是联合创始人兼 CEO，Patrick Soheili 是联合创始人并负责当前业务战略，Syrus Ziai 是联合创始人并承担运营或工程领导角色。创始人履历与 chiplet
              互连创业公司的市场需求高度贴合：Farjadrad 早前共同创办 Velio 和 Aquantia，并参与过后来进入 BoW、再影响 UCIe 的标准工作；Soheili 有高管、创投和半导体
              go-to-market 经验；Ziai 则在多家先进硅团队担任过工程领导。治理已扩展，但仍偏私营公司轻量披露。公开证据确认 Jason Taylor 于 2023 年加入董事会，Umesh Padval 于
              2026 年加入；公开团队页还显示公司在财务、法务、销售、存储产品和接口 chiplet 上有更深的人才梯队。仍然缺失的是委员会结构、所有权比例、投票权，以及晚期投资人通常需要直接审阅的其他控制机制。
