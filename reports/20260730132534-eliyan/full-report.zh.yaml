        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Eliyan 最可见的公开监管风险是出口管制外溢。2026 年，美国围绕 AI 半导体的政策再次收紧，而 Eliyan 正切入先进 AI
              连接和半导体基础设施这个政策制定者越来越视为战略性的领域。公司公开材料和融资公告没有解释 Eliyan
              如何对产品分类、哪些地理区域最重要，或光学路线图会如何改变合规负担。这并不意味着现在存在违规，但确实制造了有意义的尽调不确定性。法律表面同样很薄。OpenCorporates
              确认了实体存在，但公司的私营状态意味着投资人不能依赖他们通常会从上市发行人那里看到的诉讼、风险因素或治理披露。已检索集合中没有出现公开执法或诉讼，但当披露边界本身很窄时，未浮现事件只是较弱证据。
