  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分群与买方地图
        blocks:
          - type: paragraph
            body: >-
              Eliyan 的潜在客户不是普通企业，而是在 AI 计算、存储、封装和网络扩展上做设计决策的先进基础设施组织。公开材料反复指向 hyperscaler、AI
              加速器开发商、存储供应商和基础设施厂商，说明这些才是相关分群。这意味着真实客户地图是多层的。用户可能是系统架构或封装团队，买方可能是平台或硅项目负责人，付费方则可能位于更大的数据中心或半导体预算内。这个点重要，因为互连产品通过技术设计项目采用，而不是通过轻量软件采购采用。也就是说，可寻址客户基数可能数量小，但单个账户价值大。Eliyan
              看起来正对齐这种形态：一个供应商，成败取决于赢下少数战略重要账户，并满足很深的集成要求。实际来看，这会形成一种客户画像：哪怕只有少量活跃项目，也可能影响巨大。这也意味着，在公开收入披露出现很久以前，定性买方相关性就可能已经很强；这正是
              Eliyan 当前材料中可见的模式。
