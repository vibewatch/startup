chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品范围
        blocks:
          - type: paragraph
            body: >-
              Eliyan 将自己定位为一家先进连接半导体公司，瞄准越来越定义 AI 基础设施的带宽、存储和功耗瓶颈。从官网、产品页、技术页到 2026 年 7 月 Series C 公告，公司始终把核心产品描述为一组
              NuLink PHY IP 模块和 NuGear chiplet 产品，覆盖裸片到裸片、裸片到存储、芯片到芯片，并逐步延伸到机架到机架场景。故事里最差异化的地方不只是原始速度，而是封装灵活性：Eliyan
              主张，其互连能在标准有机基板上交付接近先进封装的性能，从而降低成本、复杂度和供应链依赖。这个点重要，因为 AI 系统建设者正撞上中介层容量、热密度、测试复杂度和上市周期的现实上限。因此，Eliyan
              卖的不是一小块狭义 IP，而是一套连接架构判断，并把自己定位为把 chiplet 经济性延展到计算、存储和光互连织构的路径。
