  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 正向逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Eliyan 的估值争论有一点异常清楚：公司在解决一个真实且有战略重要性的基础设施问题。反向逻辑同样清楚：公开证据远远落后于雄心。Eliyan 的牛市情境靠品类相关性、技术细节、生态验证，以及 AI
              系统设计变化可能让互连专家获得超额价值。反向逻辑是，许多基础设施创业公司在市场验证其能否把技术认可转成持久收入之前，都会这样描述自己。公开证据没有否定上行空间，但也不允许投资人把当前价格视为理所当然。这是一类公司质量可能很高、但价格纪律仍然极其重要的案子。这里，证据质量权重很大。
