      - number: '2.2'
        title: 规模测算视角——TAM、SAM 与贴近产品的市场代理
        blocks:
          - type: paragraph
            body: >-
              公开市场规模估算分歧很大，因为它们测量的边界不同。Fortune Business Insights 将 2026 年 chiplet 互连和 UCIe 生态规模估为 $3.28B，并预测多年高速增长；GM
              Insights 将 2026 年 chiplet 互连市场放在 $2.89B；Intel Market Research 的更广义 chiplet 市场口径在 2026 年升至 $7.31B。PatSnap
              又用更宽口径，把 2026 年先进封装市场放在约 $49B–$55B。这些数字并不互相矛盾，更像嵌套口径。Eliyan 更接近互连和标准层，而不是整个 chiplet
              栈；距离完整先进封装经济性更远。公司同时跨越电连接和光学相邻连接，因此比纯 UCIe-IP 厂商更宽，但比完整机架级网络公司更窄。对估值最有用的结论不是一个精确
              TAM，而是一组市场区间：今天直接互连机会为低个位数十亿美元，更广 chiplet 背景为高个位数十亿美元，封装与光学相邻空间则大得多，但只有一部分会转化为 Eliyan 可寻址收入。
