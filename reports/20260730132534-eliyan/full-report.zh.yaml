  - id: FE001
    title: 产品架构图
    type: stack
    summary: Eliyan 的栈从信号和 PHY 层一路延伸到封装、内存，以及光学相邻部署。
    data:
      layers:
        - label: 应用 / AI 系统
          detail: 面向最看重带宽和内存扩展的终端系统。
