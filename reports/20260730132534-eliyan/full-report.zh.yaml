      - number: '1.5'
        title: 风险、依赖集中与披露缺口
        blocks:
          - type: paragraph
            body: >-
              公司概览层面的核心风险，不在于 Eliyan 是否有一套技术上有意思的互连架构，而在于这套架构能否足够快地进入广泛量产，在更大生态玩家把类似能力内化之前支撑独角兽估值逻辑。Eliyan
              自有材料强调标准封装的成本和供应链优势，但负面行业文献仍指向 chiplet 系统中未解决的封装、测试、互操作、安全、热管理和商业化挑战。EE Times
              认为，市场意识到并非每个点状方案都能作为独立公司存活后，该行业正进入整合阶段；SemiEngineering 则强调，AI 基础设施站在爆发需求和成本、复杂度、部署约束堆叠的十字路口。Eliyan
              仍是一家披露轻的私营公司。已审阅的公开材料没有给出经审计收入、ARR、客户集中度、完整董事会机制或权威所有权数据；即便员工数也只能通过 Tracxn
              等第三方估算获得。这意味着投资人能看到动能和生态验证，但还无法用标准经营指标披露来三角校验估值。
