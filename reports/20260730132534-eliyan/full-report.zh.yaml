companyProfile:
  summary: >-
    Eliyan 是一家位于 Santa Clara 的半导体基础设施创业公司，为 AI、云和高性能计算系统开发 chiplet
    互连技术。公司的产品叙事围绕高带宽裸片到裸片、存储和新兴电光连接展开，已获得主要计算、平台和基础设施参与者的生态验证，但公开经营披露仍然有限。
