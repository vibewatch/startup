      - number: '8.4'
        title: 最终判断与尽调路径
        blocks:
          - type: paragraph
            body: >-
              仅凭当前公开证据，Eliyan
              更像一个高质量的继续研究或跟踪标的，而不是现在就买入的高确信投资。这不是对公司的负面判决；只是承认可见价格很具体，而可见经营证明还不具体。如果管理层拿出反复量产部署、集中度数据、毛利质量，以及能支撑里程碑交付且没有近期压力的资金续航，结论可以上调。如果客户证明在下一轮融资周期前仍然间接，或市场围绕更宽产品包整合时执行拖慢，结论可以下调。因此，这是一条对证据敏感、带明确上调和下调触发条件的建议，而不是对团队质量或技术雄心的泛泛打分。用委员会语言说，Eliyan
              值得再收集一轮数据，而不是立即否决。公司也许能证明其价格合理，但当前公开记录还没有做到。价格不应跑在证据前面。
