      - number: '2.5'
        title: 约束、采用摩擦与争议
        blocks:
          - type: paragraph
            body: >-
              有吸引力的需求背景并不会消除采用摩擦。SemiEngineering 对 chiplet 的报道强调架构复杂度上升，其存储墙报道也说明，即便需求明确，封装、布线和存储集成仍然很难。EE Times
              给出更明确的负面市场观点，认为 chiplet 格局正走向整合，测试、互操作、安全和光学转型等未解决问题将决定哪些厂商能作为独立公司活下来。这些约束直接作用于
              Eliyan，因为它的最佳叙事一次横跨多个领域：裸片到裸片、裸片到存储、芯片到芯片，以及电光 scale-up。每增加一个领域都会扩大
              TAM，但也提高集成范围和买方认证负担。替代风险也存在。大型相邻厂商已经在销售或营销机架级 AI 交换机、光引擎、CPO 或电路交换
              fabric，它们能从不同角度抓住同一条预算线。结果是：市场需求强、紧迫性真实，但认证周期仍长，技术相关性和收入兑现之间仍有明显距离。
