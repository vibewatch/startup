        blocks:
          - type: paragraph
            body: >-
              最近的定价锚点是 2026 年 7 月 Series C 轮，估值 $1B；同年早些时候公司还完成 $50M 战略融资。这是强市场信号，但也是新投资人承销时最大的约束。Eliyan
              已不再是押注优秀技术团队的便宜期权；它是一家以独角兽价格融资、但公开经营披露有限的半导体基础设施公司。营收、毛利率和资金续航都没有公开，投资人缺少一个简单分母去对照可见估值。因此，进入纪律不可让步。应假设轮次价格已经嵌入了客户转化、生态杠杆和光互连路线图进展的实质预期。举证责任于是落在能够证明估值合理、或揭示估值跑在商业现实前面的证据上。
