      - number: '8.3'
        title: 情境与可比框架
        blocks:
          - type: paragraph
            body: >-
              公开网络证据不足以对可比公司做硬性归一，最稳妥的估值方法是情境分析，而不是一张伪精确的倍数表。上行情境下，如果 Eliyan
              通过反复量产部署，证明自己是跨裸片间、内存和近光互连的关键连接层，当前或更高估值可以站得住。基准情境更保守：公司保持技术差异化和战略相关性，但投资人要从当前估值承销有意义上行，还需要更多客户、毛利和集中度证明。下行情境则在认证周期拖长、集中度偏高、且融资早于持久收入公开证据时出现。可比公司仍有方向意义，因为上市基础设施公司和规模化互连供应商展示了成熟披露应有的样子；但当前记录太薄，无法可靠输出倍数驱动的估值。因此，可比表有意保持克制：它只给出参考点和披露标准，不假装本流程已经提取出真正投资委员会备忘录所需的归一化市场数据。
