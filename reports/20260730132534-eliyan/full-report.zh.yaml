      - number: '1.3'
        title: 融资历史与投资人信号
        blocks:
          - type: paragraph
            body: >-
              Eliyan 的资本历史显示，公司从 VC 支持的技术验证快速推进到战略生态融资。2022 年 11 月 Series A 融资 $40M，并与一次 5nm tapeout
              搭配披露，把融资和工程里程碑强绑定。2024 年 3 月 Series B 从 Samsung Catalyst Fund 和 Tiger Global 融到 $60M，Intel Capital、SK
              hynix 等跟投，投资人基础向平台和存储相邻战略方扩展。2026 年 1 月，Eliyan 又宣布来自 AMD、Arm、Coherent、Meta、Samsung Catalyst Fund 和 Intel
              Capital 的 $50M 战略融资，明确指向商业化和 AI 系统部署。最后，2026 年 7 月 Series C 以 $1B 估值再融 $145M，由 Seligman Ventures 领投，Cisco
              Investments 和 Lumentum 参投。仅加总公开披露轮次，意味着 2022 年以来公告资本至少 $295M。比算术更重要的是模式：Eliyan 的股东表正在变成 AI
              互连栈的地图，横跨计算、代工、存储、网络和光学阵营。
