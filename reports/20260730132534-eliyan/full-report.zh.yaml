        title: 格局与直接同业
        blocks:
          - type: paragraph
            body: >-
              Eliyan 不在广义 AI 芯片市场竞争；它竞争的是更窄但战略重要的层，负责在裸片、存储子系统和日益增多的光链路之间搬运数据。公开证据显示，至少有四类对手重要。第一类是 Astera
              Labs、Alphawave 等直接 D2D 和 UCIe 导向供应商，它们用 IP 或硅产品解决先进封装和裸片到裸片连接。第二类是 Broadcom、Marvell
              等大型在位者，它们可以把互连技术挂到更广的网络、光学或定制硅业务上。第三类是 Lightmatter、Celestial AI、Ayar Labs
              等光子专业厂商；当连接从铜进一步外移时，它们的竞争更直接。最后，对最高出货量买家来说，hyperscaler 内部自研仍是替代方案。这意味着 Eliyan
              的竞争集合不是静态的：有些对手攻击封装级链路，有些攻击机架级光学，有些两边都能做。实际含义是，Eliyan 必须证明其特定接口方案在哪些地方不可替代，而不只是符合标准。
