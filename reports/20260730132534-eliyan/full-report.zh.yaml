      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              最主要的市场驱动很简单：AI 系统碰到存储和 I/O 上限的速度，快过原始算力提升能够弥补的速度。Eliyan 自有材料把这些称为存储墙和 I/O 墙，Electronic Design 与
              SemiAnalysis 也强化了同一个结构性判断：AI 工作负载需要更多带宽、更低延迟、更大存储容量和更好能效。开放标准是第二个驱动。Fortune 和 UCIe Consortium 都显示，生态正在把
              UCIe 推向默认互操作层，降低多供应商 chiplet 架构的摩擦。第三个驱动是优化重点从单节点迁移到机架级或集群级。Astera Labs、Broadcom、Lightmatter、Ayar
              Labs、Celestial AI，以及 Marvell-Lumentum 光网络演示，都显示大厂正在围绕同一瓶颈投资。即便 Eliyan
              不能赢下每个预算类别，也会受益于这种结构性需求。最后，投资人行为本身也是市场信号：Eliyan
              来自计算、hyperscaler、存储、网络和光学参与者的战略轮融资表明，主要生态玩家认为互连正从后台实现细节变成定义性能的层。
