            body: >-
              投资人想了解的客户持久性信息，几乎全部没有公开披露。已检索来源没有给出客户数量、头部账户占比、合同期限、续约率、NRR、GRR 或流失。这留下一个熟悉的半导体模式：战略相关性高，但初始 design-in
              之后业务可重复性可见度有限。可能形态是一本由大机会构成、但集中度很高的账，一个重大项目的重要性超过几十个小账户。如果账户质量极高，这会很有吸引力；但项目延迟时，也会制造收入波动和执行风险。Eliyan
              看起来确有合理的 land-and-expand
              路径，因为其技术可以横跨裸片到裸片、存储、芯片到芯片，并最终延伸到光相邻层。只是，公开记录没有量化这个漏斗中的推进。可防守的看法是，扩展潜力真实存在，但留存和集中度仍是一阶尽调缺口。这个缺失信息，是本章即便面对亮眼战略名单仍保持谨慎的核心原因。对基础设施组件供应商而言，技术上受尊敬的产品和财务上持久的客户基础之间，通常只有在重复项目数据可见后才算跨过去。换个说法，Eliyan
              可能已经拥有有价值的账户，但投资人无法从公开证据判断这些账户是孤立实验、正在放大的 design-in，还是长期平台关系。这种不确定性应直接压低对近期收入持久性的信心。
