      - number: '1.4'
        title: 里程碑与商业化姿态
        blocks:
          - type: paragraph
            body: >-
              公开里程碑显示，Eliyan 已经越过纯概念阶段，但还没有进入充分披露的规模化故事。2022 年，公司宣布 5nm tapeout，并把 Series A 资金与商业就绪挂钩。到 2023 年，NuLink
              公开对齐 UCIe 和 BoW，同时 Jason Taylor 加入董事会，释放生态和基础设施相关性增强的信号。2024 年，公司宣布 3nm、每链路 64Gbps 的里程碑、Samsung SF4X
              移植，并继续强调相对先进封装的标准封装经济性。2025 年，Eliyan 加入 Arm Total Design 生态，把技术连接到更广泛的开放 chiplet 架构工作。2026 年两次公告最关乎商业化：1
              月战略融资称获得 hyperscaler 和 AI 平台投资人的积极支持；7 月 NuLink-XD 发布，则把叙事从封装级 D2D 扩展到面向 scale-up
              网络的芯片到模块电光链路。即便如此，公司自己的措辞仍强调客户在评估或部署技术，而不是点名生产收入、出货量或已签 design-win 数量；因此商业化可信，但仍不完全透明。
