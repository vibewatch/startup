  title: Valuation is easier to validate through ecosystem names than through operating metrics
  body: The $1 billion valuation is public, but revenue, ARR, customer concentration, and gross margin are not, so investors are underwriting roadmap and strategic signal more than disclosed financial performance.
  claimRefs:
  - CO009
  - CO040
- calloutType: insight
  title: Eliyan is widening from D2D PHY IP into a full connectivity stack thesis
  body: The sequence from UCIe-compatible die-to-die PHYs to memory-interconnect proposals, C2C SerDes, and rack-to-rack electro-optical ambitions indicates platform expansion rather than a static PHY-IP business.
