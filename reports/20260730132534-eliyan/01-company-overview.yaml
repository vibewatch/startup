- id: founders-and-governance
  title: Founders, Leadership & Governance
  body: 'The company remains founder-centered, and that is one of the most important diligence facts because Eliyan is underwriting both technical credibility and go-to-market execution through a small number of repeat operators. Official materials identify Ramin Farjadrad as co-founder and CEO, Patrick Soheili as co-founder and current business-strategy lead, and Syrus Ziai as a co-founder and operations or engineering leader. The founder biographies show unusually direct market fit for a chiplet-interconnect startup: Farjadrad previously co-founded Velio and Aquantia and is tied to standards work that fed into BoW and later influenced UCIe; Soheili brings prior executive, venture, and semiconductor go-to-market experience; Ziai brings multi-company engineering leadership across advanced silicon teams. Governance has expanded but is still private-company-light. Public evidence confirms Jason Taylor joined the board in 2023 and Umesh Padval joined in 2026, while the public team page shows
    a deeper bench in finance, legal, sales, memory products, and interface chiplets. What remains absent are committee structures, ownership percentages, voting rights, and other control mechanics that a late-stage investor would normally expect to review directly.'
  claimRefs:
  - CO012
  - CO013
