  title: Ecosystem validation is unusually deep for a private interconnect startup
  body: By July 2026 Eliyan had assembled strategic capital from AMD, Arm, Coherent, Meta, Samsung Catalyst Fund, Intel Capital, Cisco Investments, and Lumentum, which suggests that multiple parts of the AI hardware stack see value in its roadmap.
  claimRefs:
