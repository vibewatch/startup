chapter:
  number: 8
  title: Valuation
  summary: Eliyan looks strategically important and plausibly differentiated, but the visible $1 billion valuation is ahead
    of the visible operating proof. The most defensible public-evidence call is research-more with medium confidence and a
    stretched valuation stance until customer conversion, margin quality, and concentration are better disclosed.
sections:
- id: thesis-and-anti-thesis
  title: Thesis and Anti-Thesis
  body: 'The valuation debate on Eliyan is unusually clear in one respect: the company is solving a real and strategically
    important infrastructure problem. The anti-thesis is equally clear: public proof trails ambition by a wide margin. Eliyan’s
    bull case rests on category relevance, technical specificity, ecosystem validation, and the possibility that AI system
    design is shifting enough to make interconnect specialists disproportionately valuable. The anti-thesis is that those
    qualities are exactly what many infrastructure startups say before the market learns whether they can convert technical
    admiration into durable revenue. Public evidence does not disprove the upside, but it does prevent an investor from treating
    the current price as obvious. This is a case where company quality may be high while price discipline still matters a
    great deal. Evidence quality matters enormously here.'
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  - CV021
  - CV027
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV001
- id: current-valuation-context
  title: Current Valuation Context and Entry Discipline
  body: The latest priced anchor is the July 2026 Series C at a $1 billion valuation, following a $50 million strategic financing
    earlier the same year. That is a strong market signal, but it is also the central underwriting constraint for a new investor.
    Eliyan is no longer a cheap option on a promising technical team; it is a unicorn-priced semiconductor infrastructure
    company with limited public operating disclosure. Because revenue, margin, and runway are not available publicly, there
    is no easy denominator to compare against the visible valuation. That makes entry discipline non-negotiable. Investors
    should assume the round price already embeds meaningful expectations around customer conversion, ecosystem leverage, and
    optical-roadmap progress. The burden of proof therefore falls on evidence that can either justify the mark or reveal it
    to be ahead of the commercial reality.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV010
  - CV013
  - CV014
  - CV029
  - CV030
  tableRefs:
  - TV003
  figureRefs:
  - FV002
  - FV003
- id: scenarios-and-comparables
  title: Scenarios and Comparable Framing
  body: 'Because hard comp normalization is weak from the public web evidence available here, the most defensible valuation
    method is scenario analysis rather than a faux-precise multiple table. A bull case can support the current or higher valuation
    if Eliyan proves itself as a critical layer across die-to-die, memory, and optical-adjacent connectivity with repeated
    production deployments. A base case is more conservative: the company remains technically differentiated and strategically
    relevant, but still needs more customer, margin, and concentration proof before investors can underwrite meaningful upside
    from the current mark. A bear case emerges if qualification cycles drag, concentration is high, and financing arrives
    before public evidence of durable revenue. Comparables still matter directionally because public infrastructure names
    and scaled interconnect vendors show what a mature disclosure set should look like, but the current record is too thin
    for a reliable multiple-driven output. That is why the comparable table is intentionally humble: it frames reference points
    and disclosure standards, but it does not pretend this workflow extracted the kind of normalized market data a true investment
    committee memo would require.'
  claimRefs:
  - CV011
  - CV012
  - CV016
  - CV018
  - CV019
  - CV024
  - CV025
  - CV034
  - CV035
  - CV038
  tableRefs:
  - TV004
  - TV005
  figureRefs:
  - FV004
- id: final-call-and-diligence-path
  title: Final Call and Diligence Path
  body: On current public evidence alone, Eliyan looks more like a high-quality research-more or track candidate than an invest-now
    conviction buy. That is not a negative verdict on the company; it is a recognition that the visible price is specific
    and the visible operating proof is not. The call can improve if management shows repeated production deployments, concentration
    data, gross-margin quality, and a financing runway that supports milestone delivery without near-term pressure. The call
    can worsen if customer proof remains indirect through the next financing cycle or if execution drags while the market
    consolidates around broader bundles. This should therefore be treated as an evidence-sensitive recommendation with explicit
    move-up and move-down triggers, not as a generic score on team quality or technical ambition. In committee terms, Eliyan
    deserves another round of data gathering, not an immediate rejection. The company may justify its price, but the current
    public record does not prove it yet. Price should not outrun proof.
  claimRefs:
