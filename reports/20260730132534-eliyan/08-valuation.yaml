  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: TV005 comparable valuation table
    missingEvidence: Normalized public-company revenue, margin, and multiple data suitable for a true comp table.
    whyItMatters: Without usable operating comparables, valuation relies more heavily on scenarios and the latest private
      round.
    diligencePath: Use paid market data and management financials to build a proper comparable set.
    relatedTableRefs:
    - TV005
  - type: private-evidence-only
    severity: blocking
    topic: revenue quality and unit economics
    missingEvidence: Revenue, gross margin, backlog, concentration, and runway.
    whyItMatters: These are the core denominators required to judge whether the $1B mark is fair or stretched.
    diligencePath: Request board-level operating data and cohort/customer schedules.
  - type: access-blocked
    severity: minor
    topic: public comp extraction
    missingEvidence: Some filing and article URLs were not machine-readable enough to extract normalized metrics.
    whyItMatters: This limited the depth of web-only comp analysis.
    diligencePath: Supplement with terminal data or downloadable filings.
