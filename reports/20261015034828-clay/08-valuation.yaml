  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Current 2026 ARR bridge, NRR by segment, gross margin, CAC payback, and net burn or cash-generation evidence.
      whyItMatters: These are the core inputs required to judge whether the latest private valuation is justified or merely momentum-driven.
      diligencePath: Request board or finance-package operating metrics, cohort views, and a bridge from Dec 2025 ARR to current run-rate revenue.
      relatedQuestionRefs: [QV002, QV005, QV007]
    - type: private-evidence-only
      severity: material
      topic: cap-table-overhang
      missingEvidence: Fully diluted ownership, liquidation preferences, seniority, employee-tender terms, and any debt or structured secondary terms after the Sep 2026 round.
      whyItMatters: Entry discipline depends on where common-equity returns actually sit in the stack, not just on the headline post-money valuation.
      diligencePath: Request the current cap table, financing documents, and a preference-stack summary that includes the Jan 2026 tender and Sep 2026 primary financing.
      relatedQuestionRefs: [QV001, QV007]
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: Concrete evidence of IPO preparation, audited public-company readiness, or a repeatable external liquidity path beyond one tender event.
      whyItMatters: Without a clearer exit path, later-stage investors are relying on continued private-market appetite to realize returns.
      diligencePath: Ask management for exit planning materials, audit readiness, banker engagement status, and any board-level timeline for liquidity options.
      relatedQuestionRefs: [QV008]
