company:
  name: Clay
chapter:
  number: 8
  title: Valuation
  summary: >-
    Clay still looks like a category-defining GTM orchestration asset, but the public record supports
    company quality more clearly than it supports the current Sep 2026 $7.1B price. The right public
    posture is track: keep conviction on product proof and distribution, but require private evidence
    on 2026 ARR, retention, gross margin, and cap-table terms before underwriting a buy at the latest mark.
sections:
  - id: recommendation-price-discipline
    title: Recommendation and price discipline
    body: >-
      The public evidence supports a strong company, not yet a strong public-style underwriting case at
      the latest price. Official and third-party sources agree that Clay has built real product proof
      around 150+/200+ provider orchestration, AI-assisted research, and measurable customer outcomes,
      including the OpenAI case where enrichment coverage moved from the low 40s into the high 80s.
      That kind of workflow leverage can justify premium attention. The problem is that the latest public
      valuation mark moved faster than the last public operating benchmark. If the Sep 2026 $7.1B round
      is tested against the last widely repeated $100M ARR marker, the implied multiple is still extreme,
      while public sources continue to flag learning-curve and credit-spend friction. That combination
      makes the call explicitly price-sensitive. Recommendation: track, with a move to buy reserved for
      either a materially lower entry point or private diligence that proves the business has grown well
      beyond the last public ARR anchor with durable unit economics.
    claimRefs: [CV004, CV005, CV006, CV008, CV012]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context
    title: Financing context and what the latest mark implies
    body: >-
      The financing path is the clearest public valuation signal. Silicon Valley Investclub records a
      step-up from the Aug 2025 $3.1B Series C to a Jan 2026 $5.0B DST-led employee tender and then a
      Sep 2026 $7.1B Series D, alongside $115M of fresh primary capital and $372M of cumulative funding.
      Public revenue support has not moved in lockstep: the most repeated operating benchmark remains
      $100M ARR by Dec 2025. That does not disprove the Sep 2026 price, but it means outside investors
      are being asked to bridge a large part of the underwriting story with private information rather
      than public evidence. The issue is not whether Clay is important; it is that public sources still
      do not disclose EV/Rev for any round, do not expose the shareholder register, and do not clarify
      liquidation-preference or dilution dynamics. In practice, that leaves the current mark as a signal
      of investor appetite, not a fully supported public valuation case.
    claimRefs: [CV001, CV002, CV003, CV004, CV011]
  - id: thesis-antithesis-and-scenarios
    title: Thesis, anti-thesis, and scenario framing
    body: >-
      The thesis is straightforward: Clay appears to have category authority, a workflow product that
      sits upstream of many GTM actions, and customer proof that the product can consolidate spend while
      improving match rates. That profile deserves better-than-average multiples. The anti-thesis is
      equally clear: independent reviews still describe a non-trivial ramp-up burden and active credit
      budgeting requirements, while the available peer set is messy. CheckThat frames Apollo and ZoomInfo
      as useful reference points and Autobound highlights n8n's own premium valuation, but none of those
      peers is an apples-to-apples match for Clay's blend of enrichment, orchestration, and AI workflow
      tooling. As a result, bull/base/bear framing has to stay milestone-based rather than falsely
      precise. The public evidence supports a premium asset; it does not yet support declaring that the
      latest private mark is obviously cheap.
    claimRefs: [CV005, CV006, CV008, CV009, CV010]
    tableRefs: [TV002, TV003]
  - id: diligence-asks-and-breakpoints
    title: Diligence asks and thesis-break triggers
    body: >-
      The next diligence cycle should focus on the few variables that could change the recommendation
      quickly. First, request a clean bridge from the Dec 2025 $100M ARR marker to current 2026 ARR,
      plus segment-level NRR, gross margin, payback, and evidence that credit-spend complexity does not
      cap expansion. Second, request the fully diluted cap table, liquidation-preference stack, and the
      economic terms of the Jan 2026 tender and Sep 2026 primary round. Third, pressure-test exit
      optionality: public sources still show no concrete IPO preparation, so investors are relying on
      continued private-market willingness to clear later rounds or structured liquidity. Thesis-break
      triggers are clear even without a model: slower-than-expected 2026 growth, weaker retention or
      margin than the current price implies, or any next liquidity event that prices below the $5.0B to
      $7.1B public mark range.
    claimRefs: [CV003, CV004, CV007, CV008, CV011, CV012]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, track, "Keep Clay on the list, but do not underwrite the Sep 2026 mark from public evidence alone."]
      - [Confidence, medium, "Public sources are coherent on product strength and recent financing marks, but not on current unit economics."]
      - [Risk rating, high, "Price sensitivity is high because the latest valuation outruns the last public operating benchmark."]
      - [Valuation stance, expensive, "A $7.1B mark against the last public $100M ARR anchor leaves little margin of safety without private data."]
      - [What changes the call, buy only on proof or price, "A move to buy needs either stronger private metrics or an entry reset closer to earlier marks."]
    notes: >-
      Public-evidence-only synthesis; the assessment weights product proof, financing marks, and unresolved
      valuation disclosure gaps rather than a full data-room model.
    claimRefs: [CV005, CV006, CV008, CV011, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Type, What would change the view]
    rows:
      - [Workflow orchestration looks differentiated, thesis, Stronger proof would be current expansion and retention data showing the workflow layer converts into durable account growth.]
      - [Customer proof exists beyond marketing copy, thesis, More large-customer case studies with quantified outcomes would support a richer entry multiple.]
      - [Public price support is thinner than company-quality support, anti-thesis, A credible 2026 ARR and gross-margin bridge would reduce the gap between quality and price.]
      - [Ramp-up and credit-spend friction can slow adoption or compress net expansion, anti-thesis, Cohort data showing stable payback and predictable credit economics would soften this concern.]
    notes: >-
      Arguments are valuation-relevant lenses, not standalone facts; they depend on the cited product-proof,
      pricing, and comp-support claims.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Case, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, 2026 ARR and retention are materially above the last public benchmark and the Series D round reflects durable enterprise economics rather than momentum alone., Current or higher pricing can work only if private metrics show enough growth and efficiency to compress the implied multiple quickly., Premium multiple fades if ramp-up friction or customer concentration limits expansion., Requires data-room proof on NRR gross margin and segment mix plus evidence that the new capital funds efficient growth.]
      - [Base, Clay is a premium asset but the last public ARR marker is still the best outside anchor and key underwriting inputs remain private., Fair value likely sits in a broad band between the Jan 2026 tender and Sep 2026 round until private evidence closes the disclosure gap., Investors can overpay for quality when comparables are noisy and private-market appetite is strong., Most likely while public evidence remains milestone-based rather than cash-flow based.]
      - [Bear, Growth normalizes faster than expected or later rounds reveal weaker retention margins or preference overhang., Downside is driven by multiple compression toward earlier private marks rather than by an immediate collapse in company quality., A future liquidity event below the recent mark would reset the narrative quickly., Triggered by soft 2026 operating data or any next financing that clears below the $5.0B to $7.1B range.]
    notes: >-
      Ranges stay directional because public sources provide valuation milestones but not the private operating
      detail required for a precise bottoms-up model.
    claimRefs: [CV001, CV003, CV004, CV008, CV009, CV010, CV011, CV012]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Track follows from strong product proof meeting a still-thin public underwriting record at the latest mark.
    data:
      nodes:
        - label: Category proof
          note: 150+/200+ provider orchestration and AI-assisted workflow automation are consistently described across official and independent sources.
        - label: Customer proof
          note: Official case evidence cites OpenAI coverage improving from the low 40s into the high 80s.
        - label: Growth proof
          note: Public sources repeatedly anchor Clay at $100M ARR by Dec 2025.
        - label: Price signal
          note: Public valuation marks stepped to $7.1B by Sep 2026.
        - label: Underwriting gap
          note: EV/Rev, current 2026 operating metrics, and the full preference stack remain undisclosed.
        - label: Recommendation
          note: Track until private metrics or a better entry make the valuation case cleaner.
      edges:
        - from: Category proof
          to: Customer proof
          label: Product evidence compounds
        - from: Customer proof
          to: Growth proof
          label: Converts to commercial traction
        - from: Growth proof
          to: Price signal
          label: Supports premium interest
        - from: Price signal
          to: Underwriting gap
          label: Raises the proof bar
        - from: Underwriting gap
          to: Recommendation
          label: Keeps entry discipline tight
    approximationNotes: >-
      Sequential logic diagram, not a quantitative model; each node reflects sourced evidence or an explicit
      valuation inference from that evidence.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV011, CV012]
callouts:
  - calloutType: recommendation
    title: Track, not because the company is weak, but because the public valuation support is thin
    body: >-
      Clay has enough product proof and customer proof to stay high on the watchlist, but the Sep 2026 mark
      asks investors to trust private metrics that are not visible in retained public sources.
    claimRefs: [CV004, CV005, CV006, CV011, CV012]
  - calloutType: risk
    title: The main underwriting risk is paying a premium AI multiple without public retention or margin proof
    body: >-
      The strongest downside path is multiple compression, not necessarily company failure: if later data
      shows weaker retention, margin, or cap-table economics than the current mark implies, the next price
      can clear much lower even if Clay remains strategically relevant.
    claimRefs: [CV004, CV008, CV011, CV012]
