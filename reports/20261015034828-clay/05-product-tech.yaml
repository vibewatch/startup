    title: Product architecture map
    type: stack
    summary: >-
      Public evidence places Clay between external data sources and downstream GTM systems,
      with orchestration logic and AI research as the core value layer.
    data:
      layers:
        - label: Data inputs
          note: 150+ provider marketplace plus first-party system data.
          modules:
            - label: Third-party contact and company providers
            - label: CRM or warehouse records
            - label: Public web targets for research
        - label: Enrichment layer
          note: Waterfall enrichment improves field coverage by trying providers in sequence.
          modules:
            - label: Waterfall enrichment
            - label: Data normalization
            - label: Scoring and assignment rules
        - label: AI research layer
          note: Claygent supports prompt-based extraction of custom fields from the web.
          modules:
            - label: Claygent prompt interface
            - label: Web research
            - label: Custom field extraction
        - label: Orchestration layer
          note: Signals, audiences, and workflow logic coordinate who gets routed or activated.
          modules:
            - label: Signals
            - label: Audiences
            - label: Workflow automation
        - label: Sync and integration layer
          note: Official messaging centers on CRM, warehouse, and third-party action sync.
          modules:
            - label: CRM sync
            - label: Data warehouse sync
            - label: Third-party actions or APIs
        - label: Activation layer
          note: Some execution happens natively, while broader multichannel motion still uses adjacent tools.
          modules:
            - label: Sequencer
            - label: Ads audiences
            - label: External calling or engagement tools
    approximationNotes: null
    claimRefs: [CE001, CE002, CE003, CE005, CE006, CE007, CE008, CE012]
callouts:
  - calloutType: strength
    title: Coverage moat comes from orchestration breadth
    body: >-
      Clay's strongest product differentiator is not owned data; it is the ability to
      sequence many providers, add AI web research, and route outputs into downstream
      systems from one operator surface.
    claimRefs: [CE003, CE005, CE012]
  - calloutType: risk
    title: Builder dependence is a real product risk
    body: >-
      Public reviews consistently frame Clay as powerful but operator-heavy, which means
      rollout quality, unit economics, and even day-to-day usability depend on GTM ops or
      GTM engineer talent rather than self-serve simplicity.
    claimRefs: [CE009, CE010]
  - calloutType: assumption
    title: Trust surface trails feature surface
    body: >-
      The assigned evidence pool is strong on feature breadth but weak on primary trust
      artifacts, so security and compliance claims should be treated as partially verified
      until diligence surfaces certificates, scope statements, and operational metrics.
    claimRefs: [CE011]
