  topStrengths:
    - Clear category position in GTM orchestration with differentiated multi-provider enrichment and AI research.
    - Strong public adoption and workflow proof, including named-customer outcomes and broad usage signals.
    - Founder-led execution plus fresh capital support continued product expansion.
  topRisks:
    - The $7.1B public mark remains expensive relative to the last repeated $100M ARR anchor.
    - Retention, gross margin, cash burn, and customer concentration are still undisclosed.
    - The product's learning curve and credit governance can slow adoption or add hidden operating cost.
    - Public trust and compliance evidence is still incomplete for regulated buyers.
  unresolvedGaps:
    - Net revenue retention, gross margin, CAC payback, cash balance, burn, and runway are still not publicly disclosed.
    - Customer concentration, contract length, and the split between direct and partner-mediated revenue remain opaque.
    - Current trust-center artifacts, certificate scope, and GDPR/legal-basis documentation should be verified directly.
    - Cap-table mechanics across the 2026 tender and financing path remain unresolved.
