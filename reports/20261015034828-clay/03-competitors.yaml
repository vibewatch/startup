figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Clay sits farthest toward configurable enrichment, while ZoomInfo, Default, and 11x score
      higher on packaged execution breadth.
    data:
      xAxis:
        label: Workflow flexibility / customizability
        min: 1
        max: 5
        low: Packaged workflow
        high: Highly configurable workflow
        description: Ordinal score synthesized from public workflow, API, and orchestration descriptions.
        scale: ordinal
      yAxis:
        label: Native execution breadth
        min: 1
        max: 5
        low: Data-only support
        high: End-to-end execution
        description: Ordinal score synthesized from whether the product natively handles routing, sequencing, or multichannel execution.
        scale: ordinal
      points:
        - label: Clay
          x: 5
          y: 3
          tone: positive
          note: High configurability through provider waterfalls, tables, and integrations; execution breadth is broader in 2026 but still not the cleanest wedge.
        - label: Apollo
          x: 3
          y: 3
          tone: neutral
          note: Simpler all-in-one outbound package with less flexible enrichment orchestration than Clay.
        - label: ZoomInfo
          x: 3.5
          y: 4.5
          tone: positive
          note: Stronger packaged data foundation and workflow/agent breadth, but less buyer-controlled multi-provider logic.
        - label: Default
          x: 3
          y: 4
          tone: neutral
          note: Built for enrichment-first routing and CRM action, not for outbound database sourcing.
        - label: 11x
          x: 2.5
          y: 5
          tone: risk
          note: Highest native execution breadth because the pitch is autonomous multichannel SDR work rather than configurable enrichment.
        - label: Cognism
          x: 2
          y: 2
          tone: neutral
          note: Focused on compliant phone data and connect rates, with less workflow breadth than Clay.
    approximationNotes: >-
      Axes are evidence-backed ordinal judgments from assigned public product descriptions, not a
      measured benchmark; scores express relative positioning rather than inferred performance
      deltas.
    claimRefs: [CP002, CP008, CP009, CP010, CP011, CP012, CP014, CP015]
callouts:
  - calloutType: insight
    title: No single rival displaces Clay across every buying center
    body: >-
      Clay's most important competitive fact is market fragmentation: Apollo wins the low-friction
      outbound bundle, ZoomInfo and Cognism win proprietary-data or compliance buyers, Default wins
      inbound RevOps teams, and 11x wins the autonomous-execution budget.
    claimRefs: [CP008, CP009, CP010, CP011, CP012, CP014]
  - calloutType: risk
    title: The easiest wedge against Clay is operational, not functional
    body: >-
      Competitors repeatedly attack credit predictability, time-to-value, and workflow complexity.
      If the customer cannot staff a GTM operator, Clay's richer enrichment architecture can become
      a liability instead of a moat.
    claimRefs: [CP005, CP006, CP013, CP014]
