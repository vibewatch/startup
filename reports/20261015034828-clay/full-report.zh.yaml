          - type: paragraph
            body: >-
              融资路径是最清晰的公开估值信号。Silicon Valley Investclub 记录了从 2025 年 8 月 $3.1B 的 Series C，到 2026 年 1 月 DST 主导、估值 $5.0B
              的员工要约收购，再到 2026 年 9 月 $7.1B 的 Series D，同时有 $115M 新增主要资本和累计 $372M 融资。公开收入支持并未同步上行：最常被重复的运营基准仍是 2025 年 12 月
              $100M ARR。这并不推翻 2026 年 9 月的价格，但意味着外部投资者需要用私有信息而非公开证据补足估值故事的大部分。问题不是 Clay 是否重要，而是公开来源仍未披露任何轮次的
              EV/Rev，没有展示股东登记册，也没有说明清算优先权或稀释动态。实际上，这让当前估值更像投资者兴趣信号，而不是得到充分支持的公开市场估值案例。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
      - number: '8.3'
        title: 投资论点、反论点与情景框架
        blocks:
          - type: paragraph
            body: >-
              投资论点很直接：Clay 似乎拥有品类影响力，产品位于许多 GTM 动作的上游，而且客户证明产品能整合支出并提高匹配率。
              这类画像应获得高于平均水平的倍数。反论点同样清楚：独立评测仍描述了不小的上手负担和持续额度预算要求，而可用的可比公司集合很杂。CheckThat 将 Apollo 和 ZoomInfo
              作为有用参照，Autobound 则突出 n8n 自身的高溢价估值，但这些公司都无法与 Clay 在数据增强、编排和 AI 工作流工具上的组合完全对应。因此，牛市/基准/熊市框架必须以里程碑为基础，不能假装精确。
              公开证据支持这是溢价资产，但尚不足以断言最新私募估值明显便宜。
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 尽调请求与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              下一轮尽调应聚焦于少数可能迅速改变建议的变量。第一，要求从 2025 年 12 月 $100M ARR 锚点到当前 2026 年 ARR 的清晰桥接，并附分客群
              NRR、毛利率、回收期，以及额度支出复杂度不会限制扩张的证据。第二，要求完全稀释后的股权结构表、优先股堆叠，以及 2026 年 1 月要约收购和 9 月主要轮次的经济条款。第三，压力测试退出选择：
              公开来源仍显示没有具体 IPO 准备，因此投资者依赖私募市场持续愿意为后续轮次或结构化流动性提供价格。即使没有模型，论点失效触发因素也很清楚：2026 年增长低于预期、留存或利润率弱于当前价格所隐含的水平，
              或任何下一次流动性事件的定价低于公开的 $5.0B 至 $7.1B 区间。
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV011
              - CV012
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 继续跟踪，不是因为公司弱，而是因为公开估值支持薄弱
            body: Clay 的产品和客户证明足以让它继续位于观察名单前列，但 2026 年 9 月的估值要求投资者相信留存公开来源中看不到的私有指标。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
          - type: callout
            title: 主要投资判断风险是在缺乏公开留存或利润率证明时支付 AI 溢价倍数
            body: 最强的下行路径是倍数压缩，而不一定是公司失败：如果后续数据显示留存、利润率或股权表经济性弱于当前估值所暗示的水平，即使 Clay 仍具战略相关性，下一次价格也可能大幅下降。
            calloutType: risk
            claimRefs:
              - CV004
              - CV008
              - CV011
              - CV012
