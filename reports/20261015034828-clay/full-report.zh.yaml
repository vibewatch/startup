  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 真正的竞争集合按待完成任务分散
        blocks:
          - type: paragraph
            body: |-
              Clay 最接近的竞争者不是一个架构完全相同的对手，而是一组解决同一 GTM 工作流相邻环节的产品。Clay 的公开定位和第三方评测
              将其描述为编排层，把多供应商数据增强、AI 网页研究和下游工作流连接组合起来。因此，对 SMB 团队而言，Apollo 是低摩擦的
              “一体化外呼”替代方案；对企业或合规要求较高的团队，ZoomInfo 和 Cognism 是专有数据替代方案；Default 是入站路由替代方案；
              而 11x 则适合真正想要自主生成销售管道、而非可配置增强工作台的买方。

              这一点很重要，因为买方如何定义任务会改变谁赢得交易。已经雇用 RevOps 或 GTM 工程师的团队可以承受 Clay 的复杂度，
              因为平台允许他们把供应商、提示词、API 和信号串成一层运营系统。若团队主要想要更便宜的数据库加触达编排器组合、
              更经核验的联系人集合，或能在同一动作中写回 CRM 的入站路由，那么更窄的替代方案更容易带来价值。实际上，Clay 同时面对点工具、
              以及多个供应商加内部胶水组成的现状技术栈。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
      - number: '3.2'
        title: 能力广度在提升，但套餐仍暴露出替代切入口
        blocks:
          - type: paragraph
            body: |-
              2026 年的公开内容已不再把 Clay 只描述为数据增强工具。评测和竞争对手撰写的比较如今承认 Claygent、触达编排器、信号、
              工作流和代理辅助的活动构建。这缩小了历史执行差距，但没有消除差距。竞争对手反复利用三个切入口：
              Clay 的学习曲线、同时建模操作和数据额度消耗的难度，以及把更严肃的 CRM 同步或 API 用例推入更高档位的功能限制。

              这些切入口直接对应竞争策略。Apollo 将数据与触达编排打包，服务偏好可预测部署而非最大灵活性的小团队。
              ZoomInfo 主打经核验的专有数据库和打包好的代理工作流，而不是用户自建瀑布。Default 为入站 RevOps 团队把增强、资格筛选、
              路由、排期和 CRM 写入合并起来。11x 则把自主多渠道执行定位成完全不同的品类。买方重视可配置的增强逻辑和供应商广度、
              胜过开箱即用的工作流结果时，Clay 仍会赢；但买方一开始就看重成本可预测性或见效速度时，Clay 会更快失分。
            claimRefs:
