  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 通过两个计量池扩大使用支出，但公开证据尚未披露毛利。
    data:
      nodes:
        - id: subscription
          label: 基础订阅层级
          value: 0
          unit: USD
          note: Free、Launch、Growth 或定制 Enterprise 合同决定初始额度。
        - id: actions
          label: Action 额度
          note: 工作流步骤、HTTP 调用、CRM 同步和 AI 操作会消耗 actions。
        - id: credits
          label: 数据信用额度
          note: 市场数据丰富会消耗 data credits；自带密钥可绕过这一池的一部分。
        - id: usage
          label: 客户工作流使用
          note: 瀑布、Claygent 研究、信号和同步量决定使用量是否留在套餐额度内。
        - id: expansion
          label: 扩容 / 超额使用潜力
          note: 公开证据支持更高层级的功能门槛，但没有披露实际超额使用费率或折扣。
        - id: revenue
          label: 确认收入
          note: 公开可见的标价与使用设计表明，收入由经常性订阅和计量使用共同构成。
        - id: gross-profit
          label: 毛利未知
          note: 没有留存的公开来源披露供应商转付成本、支持负担或混合毛利率。
      edges:
        - from: subscription
          to: actions
          label: 包含
          relationship: 层级套餐包含初始月度或年度 action 池。
        - from: subscription
          to: credits
          label: 包含
          relationship: 层级套餐还包含月度或年度 data-credit 池。
        - from: actions
          to: usage
          label: 用于
          relationship: 工作流逻辑、同步和 AI 操作使用 actions。
        - from: credits
          to: usage
          label: 用于
          relationship: 市场数据查询使用 data credits，除非客户自带供应商密钥。
        - from: usage
          to: expansion
          label: 可能触发
          relationship: 更高活动量可能扩大支出，但公开证据没有量化超额使用费或折扣。
        - from: expansion
          to: revenue
          label: 贡献于
          relationship: 支出体现为经常性订阅收入和使用驱动的变现。
        - from: revenue
          to: gross-profit
          label: 公开缺口
          relationship: 收入在收入成本之前可见，但毛利转化并未公开披露。
    approximationNotes: 这里按有证据支持的变现步骤排列，而非量化瀑布，因为留存来源没有披露各阶段的美元贡献。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
      - CI007
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据显示，Clay 位于外部数据源与下游 GTM 系统之间；编排逻辑和 AI 研究是核心价值层。
    data:
      layers:
        - label: 数据输入
          note: 150+ provider marketplace plus first-party system data.
          modules:
            - label: 第三方联系人和公司数据供应商
            - label: CRM 或数据仓库记录
            - label: 用于研究的公开网页目标
        - label: 丰富层
          note: Waterfall enrichment improves field coverage by trying providers in sequence.
          modules:
            - label: 瀑布式数据丰富
            - label: 数据标准化
            - label: 评分和分配规则
        - label: AI 研究层
          note: Claygent supports prompt-based extraction of custom fields from the web.
          modules:
            - label: Claygent 提示词界面
            - label: 网页研究
            - label: 自定义字段提取
        - label: 编排层
          note: Signals, audiences, and workflow logic coordinate who gets routed or activated.
          modules:
            - label: Signals
            - label: Audiences
            - label: 工作流自动化
        - label: 同步与集成层
          note: Official messaging centers on CRM, warehouse, and third-party action sync.
          modules:
            - label: CRM 同步
            - label: 数据仓库同步
            - label: 第三方动作或 API
        - label: 激活层
          note: Some execution happens natively, while broader multichannel motion still uses adjacent tools.
          modules:
            - label: 序列工具
            - label: 广告受众
            - label: 外部呼叫或互动工具
    approximationNotes: null
    claimRefs:
