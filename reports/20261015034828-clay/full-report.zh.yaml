chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Clay 成立于 2017 年，总部位于纽约。第三方资料将 Kareem Amin 和 Nicolae Rusan 列为最初创始人，并称 Varun Anand 于 2021
              年加入并成为联合创始人。公司将自己定位为 GTM 基础设施：团队整合一方和 第三方数据，为账户做增强和评分，用 AI 研究填充非标准字段，编排工作流，再把结果激活到 CRM、数据仓库、
              触达编排器或广告工具中。Clay 称其市场覆盖 200 多家数据和 AI 供应商。这种聚合与编排模式是核心产品主张，而底层联系人数据通常来自连接的供应商，而非单一专有数据库。Clay 首页还宣称有超过
              500,000 个 GTM 团队，但这是一项宽泛的使用指标，不应解读为当前付费客户数。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO006
              - CO007
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Kareem Amin 仍是公开确认的联合创始人兼 CEO，创始人持续参与既是可见优势，也可能形成集中度风险。Nicolae Rusan 和 Varun Anand
              一贯被认定为联合创始人，但已审阅的公开证据无法确认完整的现任高管名单、董事会成员、委员会架构、投票控制权、继任计划，或各位创始人的职能范围。这限制了对治理成熟度和关键人物依赖的判断：
              创始人主导的执行可以观察到，但管理层深度和独立监督并不清楚。因此，领导层表格是有意保留的部分枚举，不代表完整清单。
              在把治理覆盖视为完整之前，尽调应取得当前组织架构、董事会名单和会议记录、授权矩阵、创始人雇佣条款及继任计划。
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.3'
        title: 融资、估值与规模
        blocks:
          - type: paragraph
            body: >-
              ZoomInfo 和 Silicon Valley Investclub 报道，Clay 于 2026 年 9 月完成 $115 million 的 Series D，估值为 $7.1 billion。
              后者列出六轮主要融资，面值合计 $317 million，并另列 2026 年 1 月 $55 million 的员工要约收购。
              该要约收购是员工流动性安排，不是公司融资；将其计入主要资本会高估公司募集资金，而且这些交易金额都不能证明当前可用现金。两个来源还报告截至 2025 年 12 月 ARR 为 $100
              million，但指定证据中没有经审计的收入报表。规模尤其不确定：同一公司资料一处显示 176 名员工，同时又显示 2026 年 1 月为 300 人、2026 年为 1,418 人。
              这些不一致的数值作为缺口保留，不作假设性调和。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO008
              - CO009
      - number: '1.4'
        title: 发展轨迹与尽调含义
        blocks:
          - type: paragraph
            body: >-
              公开时间线显示，2024 年年中后资本形成加速，随后是 2026 年员工要约收购和 Series D。与此同时，产品从数据增强
              向代理、工作流编排和激活扩展。这条轨迹支持平台化叙事，但指定证据也揭示了运营摩擦：竞争对手撰写的评测强调学习曲线陡峭、
              额度消耗难以预测，以及对已配置第三方供应商的依赖；一篇独立评测同样提醒，上手和额度预算需要谨慎。这些批评部分带有商业立场，并非独立基准，但确实提出了具体尽调测试。买方应验证上线时间、失败运行的经济性、
              供应商层面的准确率和客户群留存，而不是从表面采用量或估值推断运营质量。
            claimRefs:
              - CO005
              - CO013
              - CO014
              - CO015
              - CO016
