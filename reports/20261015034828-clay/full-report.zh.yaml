  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 2026 年 ARR 和留存显著高于上一公开基准，Series D 反映的是持久的企业经济性，而不只是增长势头。
        - 只有私有指标显示增长和效率足以迅速压低隐含倍数时，当前或更高定价才站得住。
        - 如果爬坡摩擦或客户集中度限制扩张，溢价倍数会消退。
        - 需要数据室证明 NRR、毛利率和分部结构，并证明新资本确实用于高效增长。
      - - 基准
        - Clay 是优质资产，但上一公开 ARR 仍是外部最可靠的锚，关键投资判断输入仍在私有数据中。
        - 在私有证据填补披露缺口前，合理估值可能落在 2026 年 1 月员工要约和 2026 年 9 月融资之间的宽区间内。
        - 当可比公司数据嘈杂、私募市场兴趣强劲时，投资者可能为质量支付过高价格。
        - 只要公开证据仍以里程碑为主、而非以现金流为主，这就是最可能的情景。
      - - 悲观
        - 增长比预期更快正常化，或后续轮次暴露出更弱的留存、利润率或优先权负担。
        - 下行主要来自倍数向更早的私募估值压缩，而不是公司质量立即崩塌。
        - 未来流动性事件若低于近期估值，会迅速重置市场叙事。
        - 2026 年经营数据疲软，或下一轮融资低于 $5.0B 至 $7.1B 区间，就会触发这一情景。
    notes: 由于公开来源提供的是估值里程碑，而不是精确自下而上的模型所需的私有经营细节，这些区间只作方向性参考。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
