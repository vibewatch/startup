      - number: '2.3'
        title: 采用限制与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              支持需求的同一批来源也描述了限制市场获取的摩擦。Clay 的模式需要选择供应商、排列瀑布顺序、设计提示词、预算额度并持续维护；
              多篇留存评测明确称，平台在有专门负责人或外部专家运营时效果最好。定价和套餐进一步强化了这一点：Launch 可以支持较轻量的试验，但 CRM 自动同步、数据仓库连接、HTTP API 使用、webhook
              和更广泛的编排位于 Growth 或更高档位，这会把有意义的部署推向工作流更大、运营预算更集中的团队。仅凭公开证据，信任和合规仍未完全确定：一篇 2026 年 4 月的编辑评测称未列出 ISO 42001，而
              2026 年稍后的评测称信任门户已载明 ISO 42001:2023。这项不一致不否定市场，但意味着受监管买方在假设漏斗顶端没有摩擦之前，应直接核实当前的保障体系。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
