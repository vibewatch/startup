  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和定价公开，但实际变现不透明
        blocks:
          - type: paragraph
            body: >-
              对一家私营 GTM 平台而言，Clay 的标价如今异常透明：多份留存来源都描述了免费档、Launch、Growth 和 Enterprise，
              并一致认为平台通过两个独立的使用池收费，而不只是按席位超额计费。这对收入质量很重要，因为客户合同把经常性套餐费 与按量消耗的操作次数和市场数据额度结合起来。官方 GTM-ops 页面也印证 Clay
              销售数据编排、CRM 同步和 GTM 工作流能力，独立评测则描述了各付费套餐的当前额度和功能限制。仍不透明的是实际定价：公开来源没有披露折扣水平、套餐结构、
              扩张路径、超额费率，或客户支出有多少转向自带供应商密钥而非 Clay 市场额度。
