  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方逻辑
        blocks:
          - type: paragraph
            body: >-
              留存证据最清晰的市场边界不是泛化的“销售软件”，而是 GTM 数据编排：Clay 位于原始数据供应商、CRM 系统和下游触达 或广告平台之间。独立评测反复将其描述为类似电子表格的工作区，组合 150+
              家数据供应商、AI 研究、瀑布式增强、评分和工作流自动化；Clay 自己的 GTM-ops 页面则强调在系统间同步并处理公司属性、技术属性、联系人和意向数据。
              这个边界会影响估值，因为实际买方通常是为持续数据清理和工作流基础设施配置预算的运营负责人，而不是购买点工具的单个 SDR。同一证据也将最适配用户收窄到希望设计自定义逻辑的 RevOps、GTM
              工程、营销运营和增长团队，而不是只需要更便宜的一次性 邮箱或电话查询产品的团队。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
