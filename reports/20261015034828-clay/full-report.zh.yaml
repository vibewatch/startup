      - number: '2.2'
        title: 市场规模与采用信号
        blocks:
          - type: paragraph
            body: >-
              公开证据对采用代理指标的支持强于对品类支出市场规模的支持。Clay 官方案例展示了工作流层面的 ROI，包括 OpenAI 将数据增强覆盖率提升至两倍以上，以及 Coverflex 使用 Clay 为 3
              million 家公司做增强和评分来绘制 TAM。独立来源还提供 5,000+ 客户，以及主张有 500,000 名 GTM 专业人士或团队等更广但不够严谨的规模信号；这些可作为方向性参考，
              却不等同于可触达支出、分客户群渗透率或可变现的服务市场。因而应自下而上、受证据约束地解读市场：平台似乎与大型数据清理、获客和 ICP 设计工作流高度匹配，但公开材料仍未说明其中多少会转化为付费 Growth 或
              Enterprise 使用，也未说明多少支出落在 Clay 能影响但无法完全捕获的相邻预算中。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
