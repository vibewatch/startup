            body: >-
              留存证据支持有意义的规模，但依靠的是混合公开指标，而非经审计财务报表。Silicon Valley Investclub 列出 2025 年 12 月 ARR 为 $100M，以及 2026 年 1 月超过
              14,000 名已报告客户；其他评测则重复 Clay “500,000+ GTM 团队在使用”的更宽泛口径。
              这些数据点意味着商业动能可观，但不能替代客户群质量指标。评测证据还指出主要经济风险：工作流配置错误时额度消耗可能激增，
              因为客户可以分别耗尽操作额度或数据额度。这一动态可能有利于收入增长，但也提高了对毛利披露、支持负担和留存数据的要求，而这些数据在留存的公开集合中都不存在。
