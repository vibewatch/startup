      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
      - CE008
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据指向一条由搭建者主导的采用路径：先从一个数据丰富工作流开始，只有团队能管住信用消耗和工作流复杂度后才会扩展。
    data:
      items:
        - label: 试用单个工作流
          actor: 增长负责人或 GTM 工程师
          phase: 初步验证价值
          touchpoints:
            - CSV 或 CRM 导入
            - 一个数据丰富瀑布
            - 免费或低信用消耗测试
        - label: 证明数据覆盖提升
          actor: RevOps 或 GTM 系统负责人
          phase: 可量化的价值测试
          touchpoints:
            - 瀑布式数据丰富
            - AI 账户研究
            - 类 OpenAI 的覆盖提升
        - label: 标准化打法
          actor: GTM 搭建者
          phase: 工作流搭建
          touchpoints:
            - 表格和条件逻辑
            - Signals 和评分
            - 共享模板或社区模式
        - label: 接入运营系统
          actor: RevOps / 市场运营
          phase: 团队推广
          touchpoints:
            - CRM 同步
            - Webhooks 或 API
            - 序列工具或广告交接
        - label: 扩展到各类收入动作
          actor: 跨职能收入团队
          phase: 先落地再扩张
          touchpoints:
            - 入站路由
            - 出站个性化
            - 数据仓库或受众同步
        - label: 管住成本和复杂度
          actor: 财务和运营负责人
          phase: 续约门槛
          touchpoints:
            - 信用预算
            - 工作流 QA
            - 学习曲线管理
    approximationNotes: 这些阶段是根据公开工作流描述、案例研究和评测综合出的、有证据支持的采用模式，不是测量得到的转化漏斗。
    claimRefs:
      - CU001
      - CU003
      - CU008
      - CU009
      - CU010
      - CU011
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险集中在工作流复杂度、成本可预测性、供应商相关的数据质量和合规证明，而不是某一宗已披露的法律案件。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余风险
      rows:
        - label: 工作流复杂度 / 运营人员依赖
          note: 对没有专职 GTM 工程或 RevOps 人员的团队而言，这是最强风险。
          values:
            - label: 高
              note: 多份评测提到学习曲线陡峭，工作流设置近似工程工作。
            - label: 高
              note: Clay 位于路由、CRM 清理和营销活动执行环节，而非单一数据丰富步骤。
            - label: 中
              note: 模板、AI 助手和支持能降低摩擦，但无法消除高级构建的复杂度。
            - label: 高
              note: 早期配置错误可能消耗预算，并传播错误数据或路由决策。
        - label: 信用经济性 / 预算超支
          note: 重试、失败运行或大表控制不当时，支出可预测性会变弱。
          values:
            - label: 高
              note: 评测提到 Actions 加 credits，以及失败或重复运行带来的预算消耗。
            - label: 高
              note: 工作流经济性不清晰，可能扭曲客户规模化后的 CAC 或扩张假设。
            - label: 中
              note: 公开来源提到计算器和工作簿预算，但没有披露现场测得的成本护栏。
            - label: 高
              note: 在尽调看到真实客户工作流经济性和审批机制前，剩余风险仍然较高。
        - label: 供应商数据质量 / 新鲜度
          note: 多供应商带来覆盖优势，但数据新鲜度并非由一个经过验证的数据库控制。
          values:
            - label: 高
              note: 输出质量取决于已连接供应商及其记录的新鲜度。
            - label: 中高
              note: 陈旧或较弱的数据丰富结果，会降低定向、筛选和序列质量。
            - label: 中
              note: 瀑布回退和广泛集成分散了单一供应商失效的影响。
            - label: 高
              note: 指定证据没有量化陈旧记录率、供应商 SLA 或异常处理。
        - label: 合规证明 / 信任缺口
          note: 公开合规表述比本批指定材料中的一手证明更宽泛。
          values:
            - label: 中
              note: 评测摘要提到 SOC 2、ISO、GDPR 和 CCPA，但此处没有一手材料。
            - label: 高
              note: 缺少一手证明可能拖慢企业采购，也掩盖范围或时效问题。
            - label: 中低
              note: 企业 DPA、SSO 和合规声明均存在，但仍缺少材料级验证。
            - label: 中高
              note: 只有完成信任中心、证书和 DPA 尽调后，剩余风险才会下降。
        - label: 集成与激活错误传播
          note: Clay 位于数据丰富、CRM、序列工具以及广告或工作流端点之间。
          values:
            - label: 中高
              note: 公开来源描述了跨 CRM、路由和序列界面的广泛下游激活。
            - label: 高
              note: 错误同步、API 变更或工作流失误可能很快触及面向客户的系统。
            - label: 中
              note: 原生与集成工作流分散了工具路径，但配置纪律仍然重要。
            - label: 中高
              note: 在尽调看到审批、回滚路径和异常控制前，剩余风险仍偏高。
        - label: 序列工具和技术栈完整度
          note: 当前来源一致认为 Clay 可以执行动作，但相较专业工具的成熟度仍取决于具体用例。
          values:
            - label: 中
              note: 独立评测承认有原生序列工具，同时仍把专用工具作为基准。
            - label: 中
              note: 对期待单一工具拥有完整 GTM 运营栈的团队而言，这里的缺口最重要。
            - label: 中
              note: Clay 拥有广泛集成和较新的原生层，部分抵消了对单一工具的期待。
            - label: 中
              note: 除非买方要求在没有相邻工具的情况下实现深度执行功能，否则剩余风险维持中等。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR006
      - CR007
      - CR009
      - CR010
      - CR012
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 最新估值下，产品证据很强但公开投资判断记录仍薄弱，因此建议继续跟踪。
    data:
      nodes:
        - label: 品类验证
          note: 官方和独立来源都持续描述 150+/200+ 供应商编排以及 AI 辅助的工作流自动化。
        - label: 客户验证
          note: 官方案例证据称，OpenAI 的覆盖率从 40 出头提升到 80 多。
        - label: 增长验证
          note: 公开来源反复以 2025 年 12 月 $100M ARR 为 Clay 的锚点。
        - label: 价格信号
          note: 公开估值在 2026 年 9 月升至 $7.1B。
        - label: 投资判断缺口
          note: EV/Rev、当前 2026 年经营指标和完整优先股堆叠仍未披露。
        - label: 建议
          note: 在拿到私有指标或更好的入场价格前继续跟踪，以让估值逻辑更清晰。
      edges:
        - from: Category proof
          to: Customer proof
          label: 产品证据不断积累
        - from: Customer proof
          to: Growth proof
          label: 转化为商业牵引力
        - from: Growth proof
          to: Price signal
          label: 支撑溢价兴趣
        - from: Price signal
          to: Underwriting gap
          label: 抬高证明门槛
        - from: Underwriting gap
          to: Recommendation
          label: 保持严格入场纪律
    approximationNotes: 这是顺序逻辑图，不是量化模型；每个节点都代表有来源的证据，或基于该证据作出的明确估值推断。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV011
      - CV012
