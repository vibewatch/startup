            title: 针对 Clay 最容易的切入口是运营，而非功能
            body: 竞争者反复攻击额度可预测性、见效速度和工作流复杂度。如果客户无法配备 GTM 运营者，Clay 更丰富的数据增强架构 就可能从护城河变成负担。
            calloutType: risk
