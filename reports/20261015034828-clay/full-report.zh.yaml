        title: 展示项
        blocks:
          - type: callout
            title: 核心买方是运营负责人，而不是随手购买席位的用户
            body: Clay 最强的公开用例集中在 RevOps、GTM 工程、营销运营和增长团队；这些团队掌握跨系统数据工作流，能够为工作区级支出提供理由。
