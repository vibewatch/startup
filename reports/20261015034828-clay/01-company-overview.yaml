callouts:
  - calloutType: risk
    title: Public scale metrics are not decision-grade
    body: >-
      Headcount values conflict, the 500,000 figure is a broad company usage claim rather
      than a paying-customer count, and neither financing totals nor ARR establish cash,
      audited revenue, retention, or profitability.
    claimRefs: [CO007, CO009, CO010, CO011, CO012]
