      - [CapitalG, "Reported lead for August 2025 Series C", "Major late-stage primary investor", "Series C documents, information rights, and board rights"]
      - [Meritech Capital Partners, "Reported lead for June 2024 Series B and January 2025 expansion", "Repeat institutional investor", "Protective provisions and follow-on ownership"]
      - [Sequoia Capital, "Reported lead for 2023 Series A", "Early institutional investor", "Series A preferences and current ownership"]
      - [First Round Capital, "Reported lead for June 2017 seed", "Earliest named institutional investor", "Seed conversion terms and current ownership"]
      - [DST Global, "Reported lead for January 2026 employee tender", "Liquidity sponsor rather than disclosed primary-round lead", "Tender structure, pricing, participation, and transfer restrictions"]
      - [Employees, "Beneficiaries of reported $55M tender", "Retention and liquidity alignment", "Participation, remaining vested equity, and tax treatment"]
    notes: >-
      Roles are reported by Silicon Valley Investclub and are not proof of current ownership,
      voting control, board seats, or liquidation preferences; the 2026 tender is kept
      separate from primary financing.
