schemaVersion: "report-v2"
artifact: company-overview
slug: clay
runDate: 2026-10-15
company:
  name: Clay
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Clay is a New York-based, founder-led GTM data and workflow company whose official
    positioning centers on multi-provider enrichment, AI research, orchestration, and
    activation. Third-party sources report a September 2026 Series D at a $7.1 billion
    valuation and $100 million of ARR by December 2025, but current paying-customer count,
    headcount, board composition, ownership, debt, and cash availability remain unresolved.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Clay was founded in 2017 and is headquartered in New York. Third-party profiles name
      Kareem Amin and Nicolae Rusan as the original founders and describe Varun Anand as
      joining as a co-founder in 2021. The company presents itself as GTM infrastructure:
      teams combine first- and third-party data, enrich and score accounts, use AI research
      to fill nonstandard fields, orchestrate workflows, and activate results in CRMs,
      warehouses, sequencers, or advertising tools. Clay says its marketplace spans more
      than 200 data and AI providers. That aggregation-and-orchestration model is the core
      product proposition, while the underlying contact data generally comes from connected
      providers rather than a single proprietary database. Clay's homepage also claims more
      than 500,000 GTM teams, but the wording is a broad usage metric and should not be read
      as a current paying-customer count.
    claimRefs: [CO001, CO002, CO003, CO005, CO006, CO007, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Kareem Amin remains the publicly identified co-founder and CEO, making founder
      continuity a visible strength and a potential concentration point. Nicolae Rusan and
      Varun Anand are consistently identified as co-founders, but the reviewed public
      evidence does not establish a complete current executive roster, board membership,
      committee structure, voting control, succession plan, or the functional remit of each
      founder. This limits assessment of governance maturity and key-person dependence:
      founder-led execution is observable, yet management depth and independent oversight
      are not. The leadership table is therefore intentionally partial rather than an
      implied full census. Diligence should obtain the current organization chart, board
      roster and minutes, delegated-authority matrix, founder employment terms, and a
      succession plan before treating governance coverage as complete.
    claimRefs: [CO003, CO004]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, valuation, and scale
    body: >-
      ZoomInfo and Silicon Valley Investclub report a $115 million Series D in September
      2026 at a $7.1 billion valuation. The latter source lists six primary financing rounds
      whose face values total $317 million and separately lists a $55 million employee
      tender in January 2026. The tender is employee liquidity, not company financing, so
      adding it to primary capital would overstate funds raised by the company; none of
      these transaction values establishes cash currently available. Two sources also
      report $100 million of ARR by December 2025, but no audited revenue statement was
      available in the assigned evidence. Scale remains especially uncertain: the same
      company profile displays 176 employees while also showing 300 for January 2026 and
      1,418 for 2026. Those incompatible values are preserved as a gap, not reconciled by
      assumption.
    claimRefs: [CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: trajectory-and-diligence-implications
    title: Trajectory and diligence implications
    body: >-
      The public chronology shows capital formation accelerating after mid-2024, followed
      by a 2026 employee tender and Series D. Product breadth has expanded in parallel from
      enrichment toward agents, workflow orchestration, and activation. That trajectory
      supports a platform narrative, but the assigned evidence also identifies operating
      friction: competitor-authored reviews emphasize a steep learning curve, unpredictable
      credit consumption, and dependence on configured third-party providers, while an
      independent review similarly warns that ramp-up and credit budgeting require care.
      These critiques are commercially interested in part and are not independent
      benchmarks, yet they identify concrete diligence tests. A buyer should validate time
      to production, failed-run economics, provider-level accuracy, and customer cohort
      retention rather than infer operating quality from headline adoption or valuation.
    claimRefs: [CO005, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
