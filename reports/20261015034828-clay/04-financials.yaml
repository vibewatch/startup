schemaVersion: report-v2
artifact: financials
slug: clay
runDate: 2026-10-15
company:
  name: Clay
chapter:
  number: 4
  title: Financials
  summary: >-
    Clay's public monetization model is clearer than its underlying unit economics: retained
    sources consistently show dual-meter subscription pricing built around actions plus data
    credits, but they do not disclose realized pricing, gross margin, CAC payback, or cash
    runway. The 2026 Series D and early-2026 secondary tender reduce near-term financing
    uncertainty, yet underwriting still depends on data-room answers around burn, margin
    structure, and customer concentration.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing are public, but realized monetization is not
    body: >-
      Clay's list pricing is now unusually explicit for a private GTM platform: multiple retained
      sources describe a free tier, Launch, Growth, and Enterprise, and they agree that the
      platform charges through two separate usage pools rather than seat-based overage alone.
      That matters for revenue quality because the customer contract combines recurring plan fees
      with metered consumption of actions and marketplace data credits. The official GTM-ops page
      corroborates that Clay sells data orchestration, CRM sync, and GTM workflow capabilities,
      while independent reviews describe the current allowances and feature gates attached to each
      paid plan. What remains opaque is realized pricing: public sources do not disclose discount
      levels, plan mix, expansion paths, overage rates, or how much of customer spend shifts to
      bring-your-own-provider keys instead of Clay marketplace credits.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: public-traction-and-operating-constraints
    title: Public traction is strong, but operating leverage is still hard to underwrite
    body: >-
      The retained evidence supports meaningful scale, but it does so through mixed public
      metrics rather than audited financial statements. Silicon Valley Investclub lists $100M ARR
      for December 2025 and 14,000-plus reported customers in January 2026, while other reviews
      repeat Clay's broader "500,000+ GTM teams use it" adoption framing. Those datapoints imply
      substantial commercial momentum, but they are not a substitute for cohort-quality metrics.
      Reviewer evidence also points to the main economic risk: credit consumption can spike when
      workflows are misconfigured, because customers can exhaust action or data-credit pools
      independently. That dynamic may be good for top-line expansion, yet it also increases the
      importance of gross-margin disclosure, support burden, and retention data that are not
      available in the retained public set.
    claimRefs: [CI008, CI009, CI012, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting-blockers
    title: New capital lowers immediate financing risk, but key underwriting inputs remain absent
    body: >-
      Clay's latest public financing evidence is supportive on headline capitalization: the company
      announced a $115M Series D at a $7.1B valuation in 2026, and Silicon Valley Investclub also
      lists a $55M January 2026 employee tender at a $5B valuation plus prior primary rounds.
      That chronology suggests current access to capital, but it does not answer the questions an
      underwriter actually needs for conviction. None of the retained sources disclose cash on
      hand, monthly burn, runway, gross margin, CAC payback, customer concentration, debt
      obligations, or the split between direct enterprise spend and partner- or agency-mediated
      demand. As a result, the financial verdict is directionally positive on demand and pricing
      power, but still blocked on core efficiency and liquidity metrics.
    claimRefs: [CI010, CI011, CI014]
callouts:
  - calloutType: insight
    title: Usage-based design can expand ARPU without seat caps
    body: >-
      Clay's actions-plus-data-credit structure gives the company more ways to monetize deeper
      workflow adoption than a simple per-seat SaaS contract, but the same design makes spend
      predictability and support efficiency central to retention quality.
    claimRefs: [CI005, CI006, CI012, CI013]
  - calloutType: risk
    title: Margin path is still an evidence gap
    body: >-
      Public sources explain how Clay charges customers, yet none of the retained evidence shows
      provider pass-through costs, gross margin, or cash burn, so the current valuation cannot be
      underwritten on public information alone.
    claimRefs: [CI007, CI010, CI011, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Platform subscription, "Recurring plan fee for Free / Launch / Growth / Enterprise access", "account / month", "Free; Launch from $167 annual / $185 monthly; Growth from $446 annual / $495 monthly; Enterprise custom", "List pricing is well supported; realized ASP unknown", "Need plan mix, annual vs monthly split, and discount bands by segment"]
      - [Marketplace enrichment, "Customers spend data credits on provider lookups from Clay's marketplace", "data credits", "Launch starts around 2,500-3,000 credits per month; Growth around 6,000 per month", "Usage pool is public; overage economics not public", "Need overage pricing, provider pass-through margins, and credit-breakage rate"]
      - [Workflow orchestration, "Actions meter workflow steps, HTTP calls, CRM syncs, and AI operations", "actions", "Launch starts at 15,000 actions/month; Growth at 40,000 actions/month; Enterprise 200,000+ actions/month", "Mechanism is public; action-to-revenue realization is opaque", "Need average actions consumed per active customer and overage incidence"]
      - [Enterprise add-ons, "Higher-tier features such as warehouse syncs, SSO/RBAC, and full API access support larger contracts", "feature gate / contract", "Enterprise-only and custom priced", "Feature gating is public; contract values are undisclosed", "Need Enterprise ACV range and attach rates for warehouse/API/security modules"]
    notes: >-
      Combines official feature gating with independent plan summaries; rows reflect list pricing
      and public usage allowances, not realized revenue or margin.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Plan
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - [Free, "$0; monthly allowance", "List price only", "100 data credits and 500 actions; evaluation tier, no phone-number enrichment", "SI001 / SI003"]
      - [Launch, "$167/month annual or $185 month-to-month", "List price only", "Starts around 15,000 actions and 2,500-3,000 data credits monthly; no public overage schedule", "SI001 / SI002"]
      - [Growth, "$446/month annual or $495 month-to-month", "List price only", "Starts around 40,000 actions and 6,000 data credits monthly; realized uplift from CRM/API usage unknown", "SI001 / SI002 / SI005"]
      - [Enterprise, "Custom annual contract", "List price unavailable", "200,000+ actions/month, 100,000+ data credits/year, SSO/RBAC, data warehouse syncs, full API access; contract structure undisclosed", "SI001 / SI005"]
    notes: >-
      Public evidence supports plan labels and list pricing, but no retained source discloses
      actual customer discounts, overage rates, or usage-to-revenue conversion by cohort.
    claimRefs: [CI001, CI002, CI003, CI004, CI006, CI007]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [ARR / revenue milestone, "$100M ARR listed for Dec 2025 by Silicon Valley Investclub", medium, "Shows scale, but not cohort quality or GAAP recognition", "Need management revenue bridge, monthly recurring revenue, and audited 2025 / 2026 financials"]
      - [Customer count, "14,000+ reported customers in Jan 2026; other sources also cite 500,000+ GTM teams use it", medium, "Helps frame breadth of adoption, but mixes customer and user/community metrics", "Need paying-customer count, enterprise vs SMB mix, and net revenue retention"]
      - [Gross margin, null, low, "Provider pass-through costs and support burden determine whether usage growth expands or compresses contribution margin", "Need blended gross margin, provider cost of revenue, hosting / inference costs, and services mix"]
      - [CAC / payback, null, low, "High valuation requires evidence that customer acquisition scales efficiently", "Need sales efficiency, CAC, CAC payback, and expansion vs new-logo ARR split"]
      - [Cash / burn / runway, null, low, "Financing adequacy cannot be underwritten from valuation headlines alone", "Need current cash, monthly burn, runway, debt obligations, and next-round trigger metrics"]
      - [Usage predictability, "Adverse reviewer evidence says failed enrichments still burn credits and misconfigured reruns can consume large budgets", medium, "Unpredictable consumption can drive churn, support load, and discounting pressure", "Need churn by spend band, credit overage incidence, and support tickets tied to billing friction"]
    notes: >-
      Null values indicate unavailable retained public evidence, not zero economics; mixed public
      traction metrics are kept separate from unverified private operating metrics.
    claimRefs: [CI008, CI009, CI012, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Usage expands spend through two metered pools, but public evidence stops short of gross-profit disclosure.
    data:
      nodes:
        - id: subscription
          label: Base subscription tier
          value: 0
          unit: USD
          note: Free, Launch, Growth, or custom Enterprise contract sets the starting allowance.
        - id: actions
          label: Action allowance
          note: Workflow steps, HTTP calls, CRM syncs, and AI operations consume actions.
        - id: credits
          label: Data-credit allowance
          note: Marketplace enrichments consume data credits; bring-your-own keys can bypass part of this pool.
        - id: usage
          label: Customer workflow usage
          note: Waterfalls, Claygent research, signals, and sync volume determine whether consumption stays inside the bundle.
        - id: expansion
          label: Expansion / overage potential
          note: Public evidence supports higher-tier feature gates, but not the realized overage schedule or discounting.
        - id: revenue
          label: Recognized revenue
          note: Publicly visible list pricing plus usage design imply recurring-plus-metered revenue.
        - id: gross-profit
          label: Gross profit unknown
          note: No retained public source discloses provider pass-through costs, support burden, or blended gross margin.
      edges:
        - from: subscription
          to: actions
          label: includes
          relationship: Tier bundles an initial monthly or annual action pool.
        - from: subscription
          to: credits
          label: includes
          relationship: Tier also bundles a monthly or annual data-credit pool.
        - from: actions
          to: usage
          label: consumed by
          relationship: Workflow logic, syncs, and AI operations use actions.
        - from: credits
          to: usage
          label: consumed by
          relationship: Marketplace data lookups use data credits unless the customer brings its own provider key.
        - from: usage
          to: expansion
          label: can trigger
          relationship: Higher activity can expand spend, but the public evidence does not quantify overages or discounts.
        - from: expansion
          to: revenue
          label: contributes to
          relationship: Spend lands as recurring subscription revenue plus usage-driven monetization.
        - from: revenue
          to: gross-profit
          label: public gap
          relationship: Revenue is visible before cost of revenue; gross-profit conversion is not publicly disclosed.
    approximationNotes: >-
      Structured as an evidence-backed sequence of monetization steps rather than a quantified
      waterfall because retained sources do not disclose dollar contribution by stage.
    claimRefs: [CI001, CI002, CI003, CI005, CI006, CI007, CI014]
