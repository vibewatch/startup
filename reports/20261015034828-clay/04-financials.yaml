      severity: material
      topic: gross-margin
      missingEvidence: Gross margin, provider pass-through costs, inference or hosting costs, and services mix.
      whyItMatters: Without cost-of-revenue detail, it is impossible to judge whether usage growth expands or compresses contribution margin.
      diligencePath: Request monthly gross-margin bridge, provider cost schedule, and hosting / inference cost breakout by product line.
      relatedQuestionRefs: [QI004, QI008]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: Current cash balance, monthly burn, runway, debt obligations, and financing covenants.
      whyItMatters: Valuation headlines and round announcements do not establish liquidity or refinancing risk.
      diligencePath: Request latest board package, cash-flow statement, debt schedule, and management runway forecast.
      relatedQuestionRefs: [QI006, QI008]
    - type: private-evidence-only
      severity: material
      topic: realized-pricing
      missingEvidence: Realized ASP by segment, discount policy, overage pricing, annual vs monthly contract mix, and expansion revenue by plan.
      whyItMatters: List pricing alone does not show revenue quality or the durability of monetization at scale.
      diligencePath: Request pricing waterfall by cohort, renewal terms, and ARR composition by Free-to-paid, Launch, Growth, and Enterprise customers.
      relatedQuestionRefs: [QI001, QI002, QI008]
