evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current executive roster, board and committee membership, voting control, delegated authorities, founder terms,
      and succession plan.
    whyItMatters: Founder concentration and oversight cannot be assessed from a partial public leadership list.
    diligencePath: >-
      Obtain the current organization chart, board materials, shareholder agreements, voting agreements, founder
      employment terms, and succession documentation.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: >-
      Paying-customer count, payroll headcount, audited revenue and ARR bridge, cash balance, debt schedule, and
      financing proceeds and uses.
    whyItMatters: >-
      Public usage, ARR, financing, and contradictory headcount figures cannot establish current operating scale,
      liquidity, leverage, or revenue quality.
    diligencePath: >-
      Reconcile billing and CRM customer exports to audited statements, inspect the employee census and payroll, and
      review bank statements, debt agreements, cap table, and financing closing documents.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: ownership-and-leadership
    missingEvidence: Exhaustive current leadership, board, investor ownership, preference, and control enumeration.
    whyItMatters: Named founders and lead investors do not reveal the complete decision-making or economic-rights structure.
    diligencePath: >-
      Obtain a certified fully diluted cap table, option ledger, all financing documents, board roster, and current
      executive census.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A public or diligenced segmentation of Clay's paid customer base, ACV bands, and revenue split by SMB, mid-market,
      and enterprise.
    whyItMatters: >-
      Without segment mix and monetization data, public adoption proxies cannot be converted into a defensible SAM/SOM
      or valuation-ready market-share view.
    diligencePath: >-
      Request cohort-level ARR mix, Growth/Enterprise attach rates, and any board or investor market-sizing deck that
      ties paid usage to specific customer segments.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-owner-validation
    missingEvidence: >-
      Primary evidence on who signs the budget in large deployments and how often Clay displaces versus complements
      existing data, CRM, and sequencing tools.
    whyItMatters: >-
      Budget ownership determines whether Clay taps durable platform spend or remains discretionary tooling inside a
      broader GTM stack.
    diligencePath: >-
      Request customer references or case-study interviews that specify buyer title, rollout scope, and systems replaced
      versus integrated.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: win-loss-evidence
    missingEvidence: >-
      Cohorted migration or win-loss data showing which alternatives actually displace Clay most often by customer
      segment and workflow.
    whyItMatters: Public marketing explains positioning, but not which competitor wins most often in real procurement cycles.
    diligencePath: >-
      Request CRM-coded competitive-loss data, migration analyses, or investor/customer references broken down by SMB,
      enterprise, inbound, and outbound motions.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: realized-tco
    missingEvidence: >-
      Customer-level realized spend data that ties Clay actions, data credits, provider mix, and rerun behavior to
      effective monthly cost.
    whyItMatters: >-
      Public list prices establish entry points, but they do not prove the true total-cost delta versus Apollo,
      ZoomInfo, or Default for a real workflow.
    diligencePath: Obtain anonymized billing exports or data-room cohort views by workflow type and monthly enriched-record volume.
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin, provider pass-through costs, inference or hosting costs, and services mix.
    whyItMatters: >-
      Without cost-of-revenue detail, it is impossible to judge whether usage growth expands or compresses contribution
      margin.
    diligencePath: >-
      Request monthly gross-margin bridge, provider cost schedule, and hosting / inference cost breakout by product
      line.
    relatedQuestionRefs:
      - QI004
      - QI008
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt obligations, and financing covenants.
    whyItMatters: Valuation headlines and round announcements do not establish liquidity or refinancing risk.
    diligencePath: Request latest board package, cash-flow statement, debt schedule, and management runway forecast.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Realized ASP by segment, discount policy, overage pricing, annual vs monthly contract mix, and expansion revenue
      by plan.
    whyItMatters: List pricing alone does not show revenue quality or the durability of monetization at scale.
    diligencePath: >-
      Request pricing waterfall by cohort, renewal terms, and ARR composition by Free-to-paid, Launch, Growth, and
      Enterprise customers.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Paying-customer count, enterprise vs SMB mix, top-10 customer share, NRR, and revenue attributable to partners or
      agencies.
    whyItMatters: Adoption breadth without concentration and retention data can overstate the quality of reported growth.
    diligencePath: Request cohort retention tables, revenue concentration schedule, and direct vs partner-sourced ARR split.
    relatedQuestionRefs:
      - QI003
      - QI005
      - QI008
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Primary trust-center artifacts, certificate links, or audit scope statements for SOC 2, ISO 27001, ISO 42001,
      GDPR, and CCPA claims.
    whyItMatters: >-
      Without primary artifacts, investors cannot verify scope, recency, exclusions, or whether controls actually cover
      Claygent, signals, ads, and integrations.
    diligencePath: >-
      Request the trust portal, current certificates, subprocessor list, DPA, and any AI-governance control summaries
      from management.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Practitioner or developer-signal proof such as public API docs usage, package metrics, GitHub activity, technical
      forum adoption, or integrator/community implementation detail.
    whyItMatters: >-
      The product claims extensibility and workflow programmability, but this pool does not prove ecosystem depth beyond
      marketing and competitor commentary.
    diligencePath: >-
      Gather public API or docs analytics, integration partner case studies, GitHub or package-registry signals, and
      practitioner-community references tied to real deployments.
    relatedQuestionRefs:
      - QE010
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      Uptime history, SLA commitments, incident reports, sync-latency metrics, and quality-control statistics for
      Claygent or waterfall validation.
    whyItMatters: >-
      Reliability and support are central to using Clay as GTM infrastructure, but the assigned public pool is
      feature-heavy and operations-light.
    diligencePath: >-
      Request status-page history, SLAs, support response metrics, internal QA methodology, and customer references that
      quantify sync reliability and model-review processes.
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: durability-gap
    missingEvidence: Public or data-room evidence for NRR, GRR, churn, contract length, renewal cohorts, and expansion history.
    whyItMatters: >-
      Customer quality is the central durability test for a workflow platform with high valuation expectations, and
      public deployment anecdotes do not answer renewal risk.
    diligencePath: >-
      Request cohort retention by ARR band, renewal schedule, gross and net retention, and expansion history for the top
      20 accounts.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer share of ARR, direct-versus-partner mix, and Claygency or channel dependence by revenue.
    whyItMatters: >-
      Concentration and channel dependence can make adoption look broad while revenue remains exposed to a narrow
      account or partner base.
    diligencePath: >-
      Ask for top-10 customer ARR concentration, partner-sourced ARR share, and any single-account expansion or churn
      events in the last 24 months.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-roster
    missingEvidence: A broader, independently verifiable roster of production customers with deployment scope and measurable outcomes.
    whyItMatters: >-
      The current sample proves real usage but is too marketing-led to support strong conclusions about breadth across
      verticals or company sizes.
    diligencePath: >-
      Build a customer reference list from public case studies, conference talks, procurement records, and buyer
      testimonials, then map each account to deployment stage and outcome.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: compliance-proof-gap
    missingEvidence: Primary trust-center evidence, certificate scope and dates, DPA or CSA text, and any disclosed incident history.
    whyItMatters: >-
      Without primary artifacts, enterprise procurement, data-rights diligence, and control maturity remain
      under-verified.
    diligencePath: >-
      Request the trust-center package, current certificates, DPA, subprocessors, and any recent security or privacy
      audit outputs.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: workflow-economics
    missingEvidence: >-
      Real customer workflow economics showing Actions, credits, retries, overrides, and cost per qualified workflow or
      campaign.
    whyItMatters: Price and budget volatility can change ROI, gross-margin assumptions, and operator behavior materially.
    diligencePath: >-
      Inspect customer billing exports, budget policies, approval thresholds, and examples of failed-run recovery at
      scale.
    relatedQuestionRefs:
      - QR003
      - QR008
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: reliability-controls
    missingEvidence: >-
      Public or private evidence on provider SLAs, sync cadence, exception alerting, and admin guardrails for downstream
      actions.
    whyItMatters: >-
      Clay's product value depends on reliable provider inputs and safe workflow execution across CRM and sequencing
      systems.
    diligencePath: >-
      Request architecture review materials, alerting dashboards, provider scorecards, retry policies, and customer
      references on control quality.
    relatedQuestionRefs:
      - QR005
      - QR007
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Current 2026 ARR bridge, NRR by segment, gross margin, CAC payback, and net burn or cash-generation evidence.
    whyItMatters: >-
      These are the core inputs required to judge whether the latest private valuation is justified or merely
      momentum-driven.
    diligencePath: >-
      Request board or finance-package operating metrics, cohort views, and a bridge from Dec 2025 ARR to current
      run-rate revenue.
    relatedQuestionRefs:
      - QV002
      - QV005
      - QV007
  - type: private-evidence-only
    severity: material
    topic: cap-table-overhang
    missingEvidence: >-
      Fully diluted ownership, liquidation preferences, seniority, employee-tender terms, and any debt or structured
      secondary terms after the Sep 2026 round.
    whyItMatters: >-
      Entry discipline depends on where common-equity returns actually sit in the stack, not just on the headline
      post-money valuation.
    diligencePath: >-
      Request the current cap table, financing documents, and a preference-stack summary that includes the Jan 2026
      tender and Sep 2026 primary financing.
    relatedQuestionRefs:
      - QV001
      - QV007
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Concrete evidence of IPO preparation, audited public-company readiness, or a repeatable external liquidity path
      beyond one tender event.
    whyItMatters: >-
      Without a clearer exit path, later-stage investors are relying on continued private-market appetite to realize
      returns.
    diligencePath: >-
      Ask management for exit planning materials, audit readiness, banker engagement status, and any board-level
      timeline for liquidity options.
    relatedQuestionRefs:
      - QV008
