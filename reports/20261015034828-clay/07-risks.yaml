chapter:
  number: 7
  title: Risks
  summary: >-
    Clay's current public-risk picture is dominated by execution risk rather than one
    disclosed legal event: the product sits inside routing, CRM, and outbound workflows,
    depends on many external data providers, and still asks customers to manage workflow
    complexity and credit economics. The assigned evidence supports strong product utility,
    but it does not yet provide primary trust artifacts, operating-control detail, or
    workflow-economics evidence strong enough to underwrite a low-risk view.
sections:
  - id: overall-risk-posture
    title: Overall risk posture
    body: >-
      Clay's strongest feature set is also the root of its core risk posture. Official and
      independent sources describe one orchestration layer that joins 150+ data providers,
      CRM and sequencer integrations, AI research, and routing or campaign workflows.
      That breadth clearly creates value, but it also concentrates failure into a single
      operating surface: if provider quality slips, routing logic is misconfigured, or
      spend controls are weak, the downside can move from enrichment into qualification,
      CRM hygiene, and outbound execution. Independent reviews repeatedly say the platform
      is powerful, but harder to run than a plug-and-play point solution and prone to cost
      surprises when workflows are built or re-run poorly.
    claimRefs: [CR001, CR002, CR005, CR006, CR007, CR008, CR012]
    figureRefs: [FR001]
  - id: legal-and-operational-exposure
    title: Legal, compliance, and operational exposure
    body: >-
      The biggest externally visible legal and control risk is not a named lawsuit in the
      assigned pool; it is the gap between broad public compliance assertions and primary
      proof. Review-level sources cite SOC 2 Type II, ISO 27001, ISO 42001, GDPR, CCPA,
      and enterprise DPA or SSO support, but this chapter's assigned evidence set does not
      include trust-center pages, certificate scope statements, or DPA text that would let
      an investor test recency and operating scope. Operationally, third-party reviews also
      tie output quality to provider freshness, note that some signals are only captured
      daily, and describe advanced workflow building as engineering-like work. That mix
      makes diligence on controls, auditability, and workflow governance a prerequisite to
      a lower-severity risk rating.
    claimRefs: [CR003, CR004, CR007, CR009, CR010]
    tableRefs: [TR001, TR002]
  - id: dependency-risks-and-kill-criteria
    title: Dependency risks, mitigations, and kill criteria
    body: >-
      Clay's most important dependencies are external data providers, downstream GTM
      systems, and the operator quality needed to manage both. Official and independent
      sources agree that the platform's advantage comes from combining many providers and
      turning them into repeatable workflows; that same architecture means counterparties
      can degrade quality or raise unit cost without a single catastrophic outage. Public
      mitigations do exist: waterfall routing, native sequencing, AI helpers, templates,
      and broad integration coverage all reduce single-point dependence. But the assigned
      pool still lacks the evidence an investor would want on provider SLAs, budget
      guardrails, admin approvals, exception handling, and trust verification. Until those
      controls are seen, thesis-break triggers should focus on cost volatility, stale or
      low-quality enrichment, and workflow mistakes that reach customer-facing systems.
    claimRefs: [CR001, CR002, CR005, CR006, CR008, CR011, CR012]
    tableRefs: [TR003]
