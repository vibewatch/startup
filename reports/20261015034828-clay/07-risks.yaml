figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Highest residual exposure sits in workflow complexity, cost predictability, provider-linked
      data quality, and compliance substantiation rather than a single disclosed legal case.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Workflow complexity / operator dependence
          note: Strongest risk for teams without dedicated GTM engineering or RevOps operators.
          values:
            - label: High
              note: Multiple reviews cite a steep learning curve and engineering-like workflow setup.
            - label: High
              note: Clay sits inside routing, CRM hygiene, and campaign execution rather than a single enrichment step.
            - label: Medium
              note: Templates, AI helpers, and support reduce friction but do not remove advanced-build complexity.
            - label: High
              note: Early misconfiguration can consume budget and propagate poor data or routing decisions.
        - label: Credit economics / budget overrun
          note: Spend predictability weakens when retries, failed runs, or large tables are poorly controlled.
          values:
            - label: High
              note: Reviews cite Actions plus credits and budget burn from failed or repeated runs.
            - label: High
              note: Unclear workflow economics can distort CAC or expansion assumptions at customer scale.
            - label: Medium
              note: Public sources mention calculators and workbook budgets, but not measured cost guardrails in the field.
            - label: High
              note: Residual risk stays high until diligence sees real customer workflow economics and approvals.
        - label: Provider data quality / freshness
          note: Coverage benefits come from many providers, but data freshness is not controlled by one verified database.
          values:
            - label: High
              note: Output quality depends on the connected providers and freshness of their records.
            - label: Medium-High
              note: Stale or weak enrichment can degrade targeting, qualification, and sequencing quality.
            - label: Medium
              note: Waterfall fallback and broad integrations diversify single-vendor failure.
            - label: High
              note: No assigned evidence quantifies stale-record rates, provider SLAs, or exception handling.
        - label: Compliance substantiation / trust gap
          note: Public compliance language is broader than the primary proof available in this assigned pool.
          values:
            - label: Medium
              note: Review summaries cite SOC 2, ISO, GDPR, and CCPA, but primary artifacts are absent here.
            - label: High
              note: Missing primary proof can slow enterprise procurement and hides scope or recency issues.
            - label: Low-Medium
              note: Enterprise DPA, SSO, and compliance claims exist, but artifact-level verification is still missing.
            - label: Medium-High
              note: Residual exposure falls only after trust-center, certificate, and DPA diligence is completed.
        - label: Integration and activation error propagation
          note: Clay sits between enrichment, CRM, sequencer, and ad or workflow endpoints.
          values:
            - label: Medium-High
              note: Public sources describe broad downstream activation across CRM, routing, and sequencing surfaces.
            - label: High
              note: A bad sync, API change, or workflow mistake can reach customer-facing systems quickly.
            - label: Medium
              note: Native plus integrated workflows diversify tooling paths, but configuration discipline still matters.
            - label: Medium-High
              note: Residual risk remains elevated until diligence sees approvals, rollback paths, and exception controls.
        - label: Sequencer and stack completeness
          note: Current sources agree Clay can execute actions, but maturity versus specialist tools is still use-case dependent.
          values:
            - label: Medium
              note: Independent reviews acknowledge a native sequencer while also treating dedicated tools as the benchmark.
            - label: Medium
              note: Gaps here matter most for teams expecting one tool to own the full GTM operating stack.
            - label: Medium
              note: Clay has broad integrations and a newer native layer, which partially offsets single-tool expectations.
            - label: Medium
              note: Residual exposure stays moderate unless a buyer requires deep execution features without adjacent tooling.
    claimRefs: [CR001, CR003, CR005, CR006, CR007, CR009, CR010, CR012]
callouts:
  - calloutType: risk
    title: Kill criteria to clear before underwriting a buy
    body: >-
      A conviction upgrade needs three concrete proofs: primary trust and compliance artifacts
      that validate scope and recency, a real workflow-economics view that shows Actions,
      credits, and retry behavior at customer scale, and operating evidence on provider
      quality, sync cadence, and exception handling. If diligence instead shows thin
      guardrails, volatile cost per workflow, or provider-quality decay, Clay's breadth
      becomes a scaling risk rather than a durable moat.
    claimRefs: [CR001, CR003, CR005, CR006, CR010, CR012]
