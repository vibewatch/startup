  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow role and current product surface
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, Clay sits upstream of outbound execution: teams assemble account or contact
              tables, enrich them from multiple providers, research exceptions with Claygent, score or route records,
              and then sync the result into CRM, data warehouse, email, or ad systems. Official pages emphasize the
              orchestration role directly, describing both the combination of marketplace data with AI web research and
              the ability to normalize or trigger downstream actions from the same surface. External reviews corroborate
              that buyers treat Clay less like a monolithic prospect database and more like a programmable GTM
              operations layer. The current public module set is broader than enrichment alone: 2026 sources repeatedly
              mention Signals, Audiences, Sequencer, Ads, and workflow automation around the core data marketplace and
              Claygent research agent.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
