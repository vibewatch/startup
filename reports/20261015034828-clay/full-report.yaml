      - number: '2.3'
        title: Adoption constraints and remaining gaps
        blocks:
          - type: paragraph
            body: >-
              The same sources that support demand also describe the friction that constrains market capture. Clay's
              model requires provider selection, waterfall ordering, prompt design, credit budgeting, and ongoing
              maintenance; several retained reviews explicitly say the platform is most effective when a dedicated owner
              or outside specialist runs it. Pricing and packaging reinforce that narrowness: Launch can support lighter
              experimentation, but CRM auto-sync, warehouse connections, HTTP API usage, webhooks, and broader
              orchestration sit at Growth or above, which pushes meaningful deployment toward teams with larger
              workflows and centralized ops budgets. Trust and compliance are supportive but not fully settled from
              public evidence alone, because one April 2026 editorial review said ISO 42001 was not listed while a later
              2026 review reported the trust portal carrying ISO 42001:2023. That mismatch does not invalidate the
              market, but it does mean regulated buyers should verify the current assurance surface directly before
              assuming the top of the funnel is frictionless.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
