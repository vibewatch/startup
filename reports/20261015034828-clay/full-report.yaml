  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Clay sits farthest toward configurable enrichment, while ZoomInfo, Default, and 11x score higher on packaged
      execution breadth.
    data:
      xAxis:
        label: Workflow flexibility / customizability
        min: 1
        max: 5
        low: Packaged workflow
        high: Highly configurable workflow
        description: Ordinal score synthesized from public workflow, API, and orchestration descriptions.
        scale: ordinal
      yAxis:
        label: Native execution breadth
        min: 1
        max: 5
        low: Data-only support
        high: End-to-end execution
        description: >-
          Ordinal score synthesized from whether the product natively handles routing, sequencing, or multichannel
          execution.
        scale: ordinal
      points:
        - label: Clay
          x: 5
          'y': 3
          tone: positive
          note: >-
            High configurability through provider waterfalls, tables, and integrations; execution breadth is broader in
            2026 but still not the cleanest wedge.
        - label: Apollo
          x: 3
          'y': 3
          tone: neutral
          note: Simpler all-in-one outbound package with less flexible enrichment orchestration than Clay.
        - label: ZoomInfo
          x: 3.5
          'y': 4.5
          tone: positive
          note: >-
            Stronger packaged data foundation and workflow/agent breadth, but less buyer-controlled multi-provider
            logic.
        - label: Default
          x: 3
          'y': 4
          tone: neutral
          note: Built for enrichment-first routing and CRM action, not for outbound database sourcing.
        - label: 11x
          x: 2.5
          'y': 5
          tone: risk
          note: >-
            Highest native execution breadth because the pitch is autonomous multichannel SDR work rather than
            configurable enrichment.
        - label: Cognism
          x: 2
          'y': 2
          tone: neutral
          note: Focused on compliant phone data and connect rates, with less workflow breadth than Clay.
    approximationNotes: >-
      Axes are evidence-backed ordinal judgments from assigned public product descriptions, not a measured benchmark;
      scores express relative positioning rather than inferred performance deltas.
    claimRefs:
      - CP002
      - CP008
      - CP009
      - CP010
      - CP011
      - CP012
      - CP014
      - CP015
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Usage expands spend through two metered pools, but public evidence stops short of gross-profit disclosure.
    data:
      nodes:
        - id: subscription
          label: Base subscription tier
          value: 0
          unit: USD
          note: Free, Launch, Growth, or custom Enterprise contract sets the starting allowance.
        - id: actions
          label: Action allowance
          note: Workflow steps, HTTP calls, CRM syncs, and AI operations consume actions.
        - id: credits
          label: Data-credit allowance
          note: Marketplace enrichments consume data credits; bring-your-own keys can bypass part of this pool.
        - id: usage
          label: Customer workflow usage
          note: >-
            Waterfalls, Claygent research, signals, and sync volume determine whether consumption stays inside the
            bundle.
        - id: expansion
          label: Expansion / overage potential
          note: Public evidence supports higher-tier feature gates, but not the realized overage schedule or discounting.
        - id: revenue
          label: Recognized revenue
          note: Publicly visible list pricing plus usage design imply recurring-plus-metered revenue.
        - id: gross-profit
          label: Gross profit unknown
          note: No retained public source discloses provider pass-through costs, support burden, or blended gross margin.
      edges:
        - from: subscription
          to: actions
          label: includes
          relationship: Tier bundles an initial monthly or annual action pool.
        - from: subscription
          to: credits
          label: includes
          relationship: Tier also bundles a monthly or annual data-credit pool.
        - from: actions
          to: usage
          label: consumed by
          relationship: Workflow logic, syncs, and AI operations use actions.
        - from: credits
          to: usage
          label: consumed by
          relationship: Marketplace data lookups use data credits unless the customer brings its own provider key.
        - from: usage
          to: expansion
          label: can trigger
          relationship: Higher activity can expand spend, but the public evidence does not quantify overages or discounts.
        - from: expansion
          to: revenue
          label: contributes to
          relationship: Spend lands as recurring subscription revenue plus usage-driven monetization.
        - from: revenue
          to: gross-profit
          label: public gap
          relationship: Revenue is visible before cost of revenue; gross-profit conversion is not publicly disclosed.
    approximationNotes: >-
      Structured as an evidence-backed sequence of monetization steps rather than a quantified waterfall because
      retained sources do not disclose dollar contribution by stage.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
      - CI007
      - CI014
