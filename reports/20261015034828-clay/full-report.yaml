  - id: FM001
    title: Evidence-constrained market narrowing
    type: pyramid
    summary: >-
      The near-term market narrows from broad GTM workflow demand to ops-led teams with enough workflow complexity and
      budget ownership to justify Clay's setup and credit model.
    data:
      items:
        - label: Broad GTM workflow demand
          value: Sales, marketing, and revenue teams that need better account or contact data
          detail: >-
            Independent reviews place Clay in prospecting, CRM enrichment, personalization, and audience-building
            workflows.
          tone: neutral
          claimRefs:
            - CM001
            - CM003
        - label: Data-enrichment and research workflows
          value: Teams that need multi-provider enrichment plus AI-assisted research
          detail: Clay's differentiation begins when buyers need more than a single-source database or pure sequencer.
          tone: neutral
          claimRefs:
            - CM002
            - CM006
        - label: Custom orchestration use cases
          value: Users willing to design waterfalls, scoring logic, routing rules, and syncs
          detail: The product is repeatedly positioned as a configurable workspace rather than a finished point solution.
          tone: positive
          claimRefs:
            - CM004
            - CM006
        - label: Ops-led ownership
          value: RevOps, GTM engineering, marketing-ops, and growth operators
          detail: These functions recur across official and third-party use cases as the natural buyer-user center.
          tone: positive
          claimRefs:
            - CM003
            - CM005
            - CM013
        - label: Growth-tier orchestration buyers
          value: Teams that need CRM auto-sync, HTTP API, webhooks, warehouse links, or audience sync
          detail: Meaningful recurring deployment often starts where Growth-gated features become necessary.
          tone: warning
          claimRefs:
            - CM005
            - CM010
        - label: Highest-conviction near-term fit
          value: Teams with enough volume, process ownership, and tolerance for credit planning to justify platform upkeep
          detail: Dedicated ownership and sometimes outside specialist help are part of the effective buyer profile.
          tone: risk
          claimRefs:
            - CM009
            - CM012
            - CM015
