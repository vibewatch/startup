      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Kareem Amin remains the publicly identified co-founder and CEO, making founder continuity a visible
              strength and a potential concentration point. Nicolae Rusan and Varun Anand are consistently identified as
              co-founders, but the reviewed public evidence does not establish a complete current executive roster,
              board membership, committee structure, voting control, succession plan, or the functional remit of each
              founder. This limits assessment of governance maturity and key-person dependence: founder-led execution is
              observable, yet management depth and independent oversight are not. The leadership table is therefore
              intentionally partial rather than an implied full census. Diligence should obtain the current organization
              chart, board roster and minutes, delegated-authority matrix, founder employment terms, and a succession
              plan before treating governance coverage as complete.
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.3'
        title: Financing, valuation, and scale
        blocks:
          - type: paragraph
            body: >-
              ZoomInfo and Silicon Valley Investclub report a $115 million Series D in September 2026 at a $7.1 billion
              valuation. The latter source lists six primary financing rounds whose face values total $317 million and
              separately lists a $55 million employee tender in January 2026. The tender is employee liquidity, not
              company financing, so adding it to primary capital would overstate funds raised by the company; none of
              these transaction values establishes cash currently available. Two sources also report $100 million of ARR
              by December 2025, but no audited revenue statement was available in the assigned evidence. Scale remains
              especially uncertain: the same company profile displays 176 employees while also showing 300 for January
              2026 and 1,418 for 2026. Those incompatible values are preserved as a gap, not reconciled by assumption.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
