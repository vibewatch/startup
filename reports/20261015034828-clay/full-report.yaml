      - number: '4.2'
        title: Public traction is strong, but operating leverage is still hard to underwrite
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports meaningful scale, but it does so through mixed public metrics rather than
              audited financial statements. Silicon Valley Investclub lists $100M ARR for December 2025 and 14,000-plus
              reported customers in January 2026, while other reviews repeat Clay's broader "500,000+ GTM teams use it"
              adoption framing. Those datapoints imply substantial commercial momentum, but they are not a substitute
              for cohort-quality metrics. Reviewer evidence also points to the main economic risk: credit consumption
              can spike when workflows are misconfigured, because customers can exhaust action or data-credit pools
              independently. That dynamic may be good for top-line expansion, yet it also increases the importance of
              gross-margin disclosure, support burden, and retention data that are not available in the retained public
              set.
            claimRefs:
              - CI008
              - CI009
              - CI012
              - CI013
