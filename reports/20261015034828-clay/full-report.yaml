  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer logic
        blocks:
          - type: paragraph
            body: >-
              The clearest market boundary from retained evidence is not generic "sales software" but GTM data
              orchestration: Clay sits between raw data vendors, CRM systems, and downstream sequencing or ad platforms.
              Independent reviews repeatedly describe the product as a spreadsheet-like workspace that combines a
              marketplace of 150+ data providers, AI research, enrichment waterfalls, scoring, and workflow automation,
              while Clay's own GTM-ops page emphasizes synchronizing and acting on firmographic, technographic, contact,
              and intent data across systems. That boundary matters for valuation because the practical buyer is usually
              an ops owner with budget for recurring data hygiene and workflow infrastructure, not a single SDR
              purchasing a point tool. The same evidence also narrows the best-fit user to RevOps, GTM engineering,
              marketing-ops, and growth teams that want to design custom logic, rather than teams that only need a
              cheaper one-off email or phone lookup product.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
