      - number: '5.3'
        title: Maturity, execution boundaries, and trust gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows a product that is commercially mature enough for real GTM infrastructure use, but
              still dependent on skilled operators and adjacent tools. Multiple third-party reviews describe a steep
              learning curve, spreadsheet-like formula logic, and credit consumption that can become unpredictable when
              tables or enrichments are misconfigured. Execution scope also appears narrower than full sales-suite
              competitors: Clay now markets native sequencing and ad activation, yet competitor comparisons still frame
              built-in dialing and some multichannel execution as external dependencies. Trust and compliance signals
              are weaker than the product surface: secondary sources list SOC 2 Type II and GDPR, and one also mentions
              ISO 27001 and ISO 42001, but this assigned pool does not include primary trust-center artifacts, uptime
              evidence, or auditable control documents that would let an investor verify scope, recency, or operational
              reliability.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Coverage moat comes from orchestration breadth
            body: >-
              Clay's strongest product differentiator is not owned data; it is the ability to sequence many providers,
              add AI web research, and route outputs into downstream systems from one operator surface.
            calloutType: strength
            claimRefs:
              - CE003
              - CE005
              - CE012
          - type: callout
            title: Builder dependence is a real product risk
            body: >-
              Public reviews consistently frame Clay as powerful but operator-heavy, which means rollout quality, unit
              economics, and even day-to-day usability depend on GTM ops or GTM engineer talent rather than self-serve
              simplicity.
            calloutType: risk
