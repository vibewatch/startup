  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Overall risk posture
        blocks:
          - type: paragraph
            body: >-
              Clay's strongest feature set is also the root of its core risk posture. Official and independent sources
              describe one orchestration layer that joins 150+ data providers, CRM and sequencer integrations, AI
              research, and routing or campaign workflows. That breadth clearly creates value, but it also concentrates
              failure into a single operating surface: if provider quality slips, routing logic is misconfigured, or
              spend controls are weak, the downside can move from enrichment into qualification, CRM hygiene, and
              outbound execution. Independent reviews repeatedly say the platform is powerful, but harder to run than a
              plug-and-play point solution and prone to cost surprises when workflows are built or re-run poorly.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR007
              - CR008
