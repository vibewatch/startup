        title: Exhibits
        blocks:
          - type: callout
            title: Public proof stops before retention math
            body: >-
              The public record is good enough to show that real customers use Clay in production, but not good enough
              to verify how sticky those deployments are. The missing layer is commercial durability: renewal rates,
              contract length, expansion history, and top-customer concentration.
            calloutType: risk
