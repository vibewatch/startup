      - number: '4.3'
        title: New capital lowers immediate financing risk, but key underwriting inputs remain absent
        blocks:
          - type: paragraph
            body: >-
              Clay's latest public financing evidence is supportive on headline capitalization: the company announced a
              $115M Series D at a $7.1B valuation in 2026, and Silicon Valley Investclub also lists a $55M January 2026
              employee tender at a $5B valuation plus prior primary rounds. That chronology suggests current access to
              capital, but it does not answer the questions an underwriter actually needs for conviction. None of the
              retained sources disclose cash on hand, monthly burn, runway, gross margin, CAC payback, customer
              concentration, debt obligations, or the split between direct enterprise spend and partner- or
              agency-mediated demand. As a result, the financial verdict is directionally positive on demand and pricing
              power, but still blocked on core efficiency and liquidity metrics.
            claimRefs:
              - CI010
              - CI011
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Usage-based design can expand ARPU without seat caps
            body: >-
              Clay's actions-plus-data-credit structure gives the company more ways to monetize deeper workflow adoption
              than a simple per-seat SaaS contract, but the same design makes spend predictability and support
              efficiency central to retention quality.
            calloutType: insight
            claimRefs:
              - CI005
              - CI006
              - CI012
              - CI013
          - type: callout
            title: Margin path is still an evidence gap
            body: >-
              Public sources explain how Clay charges customers, yet none of the retained evidence shows provider
              pass-through costs, gross margin, or cash burn, so the current valuation cannot be underwritten on public
              information alone.
            calloutType: risk
            claimRefs:
