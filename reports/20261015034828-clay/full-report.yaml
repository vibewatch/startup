      - number: '1.4'
        title: Trajectory and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The public chronology shows capital formation accelerating after mid-2024, followed by a 2026 employee
              tender and Series D. Product breadth has expanded in parallel from enrichment toward agents, workflow
              orchestration, and activation. That trajectory supports a platform narrative, but the assigned evidence
              also identifies operating friction: competitor-authored reviews emphasize a steep learning curve,
              unpredictable credit consumption, and dependence on configured third-party providers, while an independent
              review similarly warns that ramp-up and credit budgeting require care. These critiques are commercially
              interested in part and are not independent benchmarks, yet they identify concrete diligence tests. A buyer
              should validate time to production, failed-run economics, provider-level accuracy, and customer cohort
              retention rather than infer operating quality from headline adoption or valuation.
