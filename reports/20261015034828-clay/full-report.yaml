          - type: callout
            title: Trust surface trails feature surface
            body: >-
              The assigned evidence pool is strong on feature breadth but weak on primary trust artifacts, so security
              and compliance claims should be treated as partially verified until diligence surfaces certificates, scope
              statements, and operational metrics.
            calloutType: assumption
