      - number: '7.2'
        title: Legal, compliance, and operational exposure
        blocks:
          - type: paragraph
            body: >-
              The biggest externally visible legal and control risk is not a named lawsuit in the assigned pool; it is
              the gap between broad public compliance assertions and primary proof. Review-level sources cite SOC 2 Type
              II, ISO 27001, ISO 42001, GDPR, CCPA, and enterprise DPA or SSO support, but this chapter's assigned
              evidence set does not include trust-center pages, certificate scope statements, or DPA text that would let
              an investor test recency and operating scope. Operationally, third-party reviews also tie output quality
              to provider freshness, note that some signals are only captured daily, and describe advanced workflow
              building as engineering-like work. That mix makes diligence on controls, auditability, and workflow
              governance a prerequisite to a lower-severity risk rating.
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR009
              - CR010
