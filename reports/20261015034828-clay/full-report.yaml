      - number: '5.2'
        title: Operating architecture, integrations, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The operating model is layered rather than vertically integrated. Clay starts from external data providers
              and first-party system data, applies waterfall enrichment and AI research, then passes enriched records
              into CRM, warehouse, or activation endpoints. That architecture is the core differentiator cited across
              competitor and review sources: Clay can improve coverage by sequencing many providers and letting
              operators design custom logic instead of accepting one vendor's proprietary data model. The tradeoff is
              that quality, latency, and economics depend on the provider mix and workflow design chosen by the
              operator. Official positioning around 150+ integrations and CRM/warehouse sync supports the deployment
              story, but it also reinforces that Clay's moat is orchestration breadth and configurability rather than
              owned first-party data or a closed execution stack.
            claimRefs:
              - CE001
              - CE003
