chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Clay was founded in 2017 and is headquartered in New York. Third-party profiles name Kareem Amin and
              Nicolae Rusan as the original founders and describe Varun Anand as joining as a co-founder in 2021. The
              company presents itself as GTM infrastructure: teams combine first- and third-party data, enrich and score
              accounts, use AI research to fill nonstandard fields, orchestrate workflows, and activate results in CRMs,
              warehouses, sequencers, or advertising tools. Clay says its marketplace spans more than 200 data and AI
              providers. That aggregation-and-orchestration model is the core product proposition, while the underlying
              contact data generally comes from connected providers rather than a single proprietary database. Clay's
              homepage also claims more than 500,000 GTM teams, but the wording is a broad usage metric and should not
              be read as a current paying-customer count.
            claimRefs:
              - CO001
              - CO002
              - CO003
