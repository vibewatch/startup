              - CM009
              - CM010
              - CM013
      - number: '2.2'
        title: Sizing and adoption signals
        blocks:
          - type: paragraph
            body: >-
              Public evidence is stronger on adoption proxies than on category-spend market sizing. Clay's official case
              studies show workflow-level ROI, including OpenAI more than doubling enrichment coverage and Coverflex
              using Clay to enrich and score 3 million companies to map its TAM. Independent sources add broader but
              less rigorous scale signals such as 5,000+ customers and claims of 500,000 GTM professionals or teams,
              which are useful directional lenses but not equivalent to addressable spend, segment-level penetration, or
              a monetizable serviceable market. The right way to read the market is therefore bottom-up and
              evidence-constrained: the platform appears well aligned with large data-hygiene, prospecting, and
              ICP-design workflows, but public materials still do not reveal how much of that activity converts into
              paid Growth or Enterprise usage, nor how much sits in adjacent budgets that Clay may influence without
              fully capturing.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM014
              - CM015
