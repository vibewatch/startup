schemaVersion: "report-v2"
artifact: customers
slug: clay
runDate: 2026-10-15
company:
  name: Clay
chapter:
  number: 6
  title: Customers
  summary: >-
    Clay's public customer evidence is strongest for builder-led GTM use cases: official and third-party
    sources consistently position RevOps, GTM ops, and growth teams as core buyers, and named references
    show measurable workflow gains at OpenAI, Coverflex, Anthropic, and Rippling. The weak spot is
    durability: the reviewed public record shows deployments and marketing-scale claims, but not NRR, churn,
    contract-length, or concentration disclosure.
sections:
  - id: customer-segments-and-adoption
    title: Customer segments center on GTM builders, with expansion into adjacent revenue workflows
    body: >-
      Clay's clearest customer fit is not generic "sales teams" but builder-led revenue operations: the
      official GTM-ops surface emphasizes inbound lead enrichment, CRM sync, data-warehouse connectivity, and
      multi-provider research, while independent reviews repeatedly describe Clay as a spreadsheet-style data
      orchestration layer rather than a single proprietary database. That positioning matters for customer
      quality because it implies a relatively technical buyer, usually RevOps, GTM ops, growth, or a GTM
      engineer, who can own workflow design and cost governance. Public scale claims are large and current for
      2026, but they remain marketing-style usage claims rather than audited customer segmentation or paying
      cohort disclosure.
    claimRefs: [CU001, CU002, CU003, CU008, CU011, CU014, CU015]
    tableRefs: [TU001, TU002]
    figureRefs: [FU001]
  - id: named-customer-proof
    title: Named customer proof is real, but mostly vendor-authored and outcome-specific
    body: >-
      The strongest named-customer evidence comes from Clay's own case-study surface and is concrete enough to
      show real production use, not just logo placement. OpenAI's GTM systems lead gives a before-and-after
      coverage quote, Coverflex is tied to a large TAM-mapping workflow, and Anthropic and Rippling are
      presented as active operational users. Independent comparison content partially corroborates the OpenAI
      and Anthropic outcome claims, which is useful because most public proof still stops at deployment
      anecdotes. What remains missing is the commercial durability layer: public sources show use cases and
      workflow outcomes, but not customer tenure, expansion ARR, renewal behavior, or referenceable contract
      scope.
    claimRefs: [CU004, CU005, CU006, CU007, CU013]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Expansion logic is plausible, but durability and concentration remain unverified
    body: >-
      Clay has a credible land-and-expand path because multiple sources show the product stretching from one
      enrichment workflow into CRM sync, APIs and webhooks, sequencing, signals, and ad audiences. That makes
      broader adoption inside revenue teams plausible once one technical owner proves ROI. The adverse side of
      the same story is that independent reviewers repeatedly flag the learning curve and credit governance as
      adoption friction, especially for teams without a dedicated operator. More importantly for investment
      diligence, the reviewed public record does not disclose NRR, GRR, churn, contract length, customer
      concentration, or direct-versus-partner mix, so customer durability remains a diligence gap rather than a
      verified strength.
    claimRefs: [CU009, CU010, CU011, CU012, CU013]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Observed scale or strategic value
      - Gap
    rows:
      - - RevOps / GTM ops teams
        - Buyer and payer are typically RevOps or GTM systems leaders; users include SDRs, AEs, and ops builders
        - Inbound lead enrichment, CRM hygiene, routing, and shared data orchestration
        - Official surface centers CRM sync, AI research, and 150+ integrations for cross-system GTM execution
        - No public revenue split by team type, ARR band, or geography
      - - Growth / outbound builders
        - Buyer is a growth lead or GTM engineer; user is the builder running prospecting workflows
        - Prospect sourcing, waterfall enrichment, account research, personalization, and signals
        - Independent reviews consistently frame Clay as strongest when a technical operator owns workflow logic
        - Public record does not show conversion by customer size or long-term retention for this cohort
      - - Cross-functional enterprise revenue teams
        - Buyer is central RevOps or marketing ops; users expand to CRM, warehouse, and paid-media stakeholders
        - Extend one enrichment workflow into APIs, webhooks, data warehouse sync, sequencing, and ads audiences
        - Multiple sources show a land-and-expand path beyond a single list-building use case
        - No public seat, department, or expansion-spend disclosure once Clay becomes core infrastructure
    notes: >-
      Segments are inferred from official positioning and independent operator reviews, not from company
      disclosure of customer mix or segment revenue.
    claimRefs: [CU001, CU002, CU003, CU008, CU011, CU015]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Public installed-base claim
        - 500,000+ GTM teams (repeated public claim)
        - "2026"
        - ZoomInfo and Apollo comparison pages summarizing Clay's public positioning
        - Medium
        - Suggests broad top-of-funnel awareness and widespread trial or usage claims
        - No paying-customer count, active-seat count, or segment mix
      - - OpenAI enrichment coverage
        - Low 40% to high 80%
        - "2026"
        - Clay customer page plus ZoomInfo comparison coverage summary
        - High
        - Best public proof that Clay can create measurable production uplift for a named customer
        - No lead volume, win-rate, or revenue conversion denominator
      - - Coverflex TAM mapping
        - 3 million companies enriched and scored
        - "2026"
        - Clay customer page
        - Medium
        - Shows the platform can support large-scale TAM and scoring workflows
        - No recurring usage cadence, contract size, or renewal evidence
      - - Anthropic workflow lift
        - Official RevOps quote plus independent report of 3x enrichment rate versus a single-vendor setup
        - "2026"
        - Clay customer page plus ZoomInfo comparison
        - High
        - Indicates deeper operational adoption than simple logo usage
        - No duration, spend, or retention disclosure
    notes: >-
      This table mixes public marketing-scale claims with named-customer outcomes; values are not comparable and
      several rows omit the commercial denominator a buyer or investor would need.
    claimRefs: [CU005, CU006, CU007, CU010, CU015]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - OpenAI
        - GTM systems / inbound ops
        - Multi-provider enrichment for inbound lead enrichment coverage
        - Production reference
        - More than doubled enrichment coverage from low 40% to high 80%
        - Vendor-authored case-study proof; no contract value or renewal data
      - - Coverflex
        - GTM / marketing ops
        - TAM mapping with enrichment and custom buying signals
        - Production reference
        - Enriched and scored 3 million companies
        - Public proof does not disclose ongoing frequency, spend, or retention
      - - Anthropic
        - RevOps
        - Multi-provider enrichment and workflow operations
        - Production reference
        - Official quote on RevOps impact; independent comparison says enrichment rate tripled versus prior setup
        - Limited public detail on scope, seats, and timeline
      - - Rippling
        - Revenue operations
        - Process streamlining and experimentation enablement
        - Production reference
        - Official quote says Clay boosted engagement and experimentation
        - No independent corroboration in the assigned pool
    notes: >-
      This is a partial public sample of named references rather than an exhaustive customer list. Most proof is
      vendor-authored, so it demonstrates usage but not commercial durability.
    enumerationScope:
      coverage: partial
      basis: Public named references visible in the assigned 2026 source pool, not a complete customer census.
    claimRefs: [CU004, CU005, CU006, CU007, CU013]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence points to a builder-led adoption journey that starts with one enrichment workflow and
      expands only after the team can govern credits and workflow complexity.
    data:
      items:
        - label: Trial a single workflow
          actor: Growth lead or GTM engineer
          phase: Initial proof of value
          touchpoints:
            - CSV or CRM import
            - One enrichment waterfall
            - Free or low-credit test
        - label: Prove data-coverage lift
          actor: RevOps or GTM systems owner
          phase: Measurable value test
          touchpoints:
            - Waterfall enrichment
            - AI account research
            - OpenAI-style coverage gain
        - label: Standardize the play
          actor: GTM builder
          phase: Workflow buildout
          touchpoints:
            - Tables and conditional logic
            - Signals and scoring
            - Shared templates or community patterns
        - label: Connect operating systems
          actor: RevOps / marketing ops
          phase: Team rollout
          touchpoints:
            - CRM sync
            - Webhooks or API
            - Sequencer or ads handoff
        - label: Expand across revenue motions
          actor: Cross-functional revenue team
          phase: Land-and-expand
          touchpoints:
            - Inbound routing
            - Outbound personalization
            - Data warehouse or audience sync
        - label: Govern cost and complexity
          actor: Finance and ops owner
          phase: Renewal threshold
          touchpoints:
            - Credit budgeting
            - Workflow QA
            - Learning-curve management
    approximationNotes: >-
      Stages are an evidence-backed adoption pattern synthesized from public workflow descriptions, case studies,
      and reviews; they are not a measured conversion funnel.
    claimRefs: [CU001, CU003, CU008, CU009, CU010, CU011, CU014]
callouts:
  - calloutType: risk
    title: Public proof stops before retention math
    body: >-
      The public record is good enough to show that real customers use Clay in production, but not good enough
      to verify how sticky those deployments are. The missing layer is commercial durability: renewal rates,
      contract length, expansion history, and top-customer concentration.
    claimRefs: [CU004, CU005, CU006, CU007, CU012, CU013]
