  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: durability-gap
      missingEvidence: Public or data-room evidence for NRR, GRR, churn, contract length, renewal cohorts, and expansion history.
      whyItMatters: Customer quality is the central durability test for a workflow platform with high valuation expectations, and public deployment anecdotes do not answer renewal risk.
      diligencePath: Request cohort retention by ARR band, renewal schedule, gross and net retention, and expansion history for the top 20 accounts.
      relatedQuestionRefs: [QU008]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer share of ARR, direct-versus-partner mix, and Claygency or channel dependence by revenue.
      whyItMatters: Concentration and channel dependence can make adoption look broad while revenue remains exposed to a narrow account or partner base.
      diligencePath: Ask for top-10 customer ARR concentration, partner-sourced ARR share, and any single-account expansion or churn events in the last 24 months.
      relatedQuestionRefs: [QU008]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-roster
      missingEvidence: A broader, independently verifiable roster of production customers with deployment scope and measurable outcomes.
      whyItMatters: The current sample proves real usage but is too marketing-led to support strong conclusions about breadth across verticals or company sizes.
      diligencePath: Build a customer reference list from public case studies, conference talks, procurement records, and buyer testimonials, then map each account to deployment stage and outcome.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
