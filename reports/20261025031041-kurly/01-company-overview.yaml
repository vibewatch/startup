company:
  name: Kurly
chapter:
  number: 1
  title: Company Overview
  summary: Kurly is a Seoul-headquartered Korean commerce company that began with curated fresh food and dawn delivery, then expanded into beauty, fashion, living goods, seller delivery, fulfillment, and a Naver distribution partnership. Current evidence shows a meaningful profitability inflection, but private-market valuation, capitalization, cash, and full leadership/governance disclosure remain incomplete.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Kurly was founded in 2014 and is headquartered in Seoul, South Korea. Its original proposition was curated food and fresh-produce commerce supported by next-day dawn delivery, while its current platform spans fresh food, beauty, fashion, living goods, third-party seller delivery and fulfillment. Kurly's own U.S. description says founder Sophie Kim began the business in 2015 with a small initial assortment and a quality-selection process; this is company-reported positioning rather than independent verification. The U.S. offering is operationally distinct from Korean dawn delivery: it uses a U.S. frozen warehouse and direct air shipment from Korea for pantry, beauty and home products. The evidence supports a premium, curated commerce model, but does not establish the economics or revenue contribution of the U.S. business.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-scale
    title: Leadership, governance and operating scale
    body: Publicly accessible evidence identifies Sophie Kim as founder and describes Kim Jong-hoon as Kurly's CFO in the company's first-quarter 2026 earnings coverage. It does not provide a complete board, executive roster, voting-control table or founder/investor ownership breakdown. Third-party workforce data estimates 1,251 employees worldwide as of March 2026, with 99.3% in East Asia, but the provider describes the data as workforce intelligence rather than audited company disclosure. The combination of a concentrated operating footprint and incomplete governance disclosure makes key-person dependence and control rights material diligence questions rather than settled facts.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002]
  - id: funding-profitability-and-milestones
    title: Funding, profitability and milestones
    body: >-
      Kurly's financing history shows a large 2021 Series F, a 2023 pre-IPO round, and later strategic participation by Naver. The 2021 funding report states $200 million raised, $428 million total raised and a $2.2 billion valuation at that time; a later KED report says the company's valuation peaked above 4 trillion won in December 2021, fell to 2.5 trillion won in May 2023, and that Anchor PE held 13.5% as of November 2024. These figures are from different dates and currencies and should not be treated as a single cap table. Operating evidence is stronger on the profitability inflection: reported 2025 sales were preliminarily 2.3671 trillion won with 13.1 billion won operating profit, and reported Q1 2026 revenue was 745.7 billion won with 24.2 billion won operating profit. The record does not establish cash balance, debt, runway, final 2026 results or a committed IPO timetable.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
callouts:
  - calloutType: strength
    title: Profitability inflection is now evidenced
    body: Independent reporting records a first annual operating profit in 2025 and a further quarterly profit in Q1 2026, alongside growth in GMV and newer channels.
    claimRefs: [CO014, CO015]
  - calloutType: risk
    title: Capitalization and governance remain opaque
    body: Public evidence gives historical round and valuation markers but not a current capitalization table, cash position, debt facilities, complete board or control rights.
    claimRefs: [CO013, CO016]
