  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: Current board composition, voting rights, founder and investor ownership percentages, and related-party arrangements.
      whyItMatters: Control and key-person exposure cannot be assessed from historical financing announcements alone.
      diligencePath: Obtain the latest capitalization table, shareholder agreements, board roster and reserved-matters schedule under NDA.
      relatedQuestionRefs: [QO003, QO007]
      relatedTableRefs: [TO002]
    - type: stale
      severity: material
      topic: funding
      missingEvidence: Current valuation, total raised, cash balance, debt facilities and runway after the Naver transaction.
      whyItMatters: Historical round valuations are not a current valuation or available cash measure.
      diligencePath: Request the latest investor update, audited or management accounts, debt schedule and post-money capitalization table.
      relatedQuestionRefs: [QO004, QO008]
      relatedTableRefs: [TO003]
    - type: enumeration-incomplete
      severity: minor
      topic: milestones
      missingEvidence: Verified dates and primary documentation for all product, logistics, regulatory and adverse milestones.
      whyItMatters: The public timeline is sufficient for directional context but not a complete corporate chronology.
      diligencePath: Reconcile company announcements, filings, exchange submissions and board minutes into a dated milestone register.
      relatedQuestionRefs: [QO006, QO007]
      relatedTableRefs: [TO001]
