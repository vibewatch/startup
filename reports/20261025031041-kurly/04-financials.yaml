chapter:
  number: 4
  title: Financials
  summary: Kurly's public record now shows a transition from prolonged losses to reported operating profitability, supported by core grocery growth, category expansion, and logistics productivity. The underwriting case remains constrained by thin reported margins, limited public cash and unit-economics disclosure, and dependence on continued channel and transaction growth.
sections:
  - id: revenue-and-monetization
    title: Revenue model and monetization
    body: "Kurly monetizes a curated online-grocery marketplace anchored in fresh food and dawn delivery, with adjacent beauty, fashion, living, fulfillment, and international offerings. The public evidence separates transaction value from recognized sales: 2025 sales were reported at KRW 2.3671 trillion while GMV was KRW 3.5340 trillion, and first-half 2025 sales were KRW 1.0595 trillion against GMV of KRW 1.7062 trillion. That spread is not an implied take rate because the sources do not provide a consistent accounting bridge. The revenue-quality positives are repeat purchasing, higher-value categories, and seller-delivered products; the diligence gap is realized pricing and margin by stream."
    claimRefs: [CI001, CI002, CI003]
    tableRefs: [TI001, TI002]
  - id: profitability-and-cost-drivers
    title: Profitability and cost structure
    body: The current public trajectory is encouraging but not yet a full underwriting model. Kurly reported KRW 1.3 billion of operating profit in the second quarter of 2025 after an KRW 8.5 billion loss in the comparable quarter, and KRW 3.1 billion of operating profit for the first half. A later report described KRW 13.1 billion of 2025 annual operating profit and four consecutive profitable quarters. Management attributed improvement to logistics-center operations and order-processing efficiency, while earlier reporting identified cold-chain investment, transportation, and packaging as structural cost burdens. Gross margin, contribution margin, fulfillment cost per order, and cash conversion remain undisclosed in the retained evidence.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: growth-and-capital-adequacy
    title: Growth, channels, and capital adequacy
    body: "Kurly's growth engine is broadening beyond its owned app. KurlyN Mart, launched with Naver, added a distribution channel and is reported to have produced rapid transaction growth, stronger repeat purchasing, and regional reach outside the Seoul area. The same channel introduces platform dependence and a competitive response from Coupang, Toss, and Kakao. Historical financing evidence shows that Kurly raised substantial capital and later experienced valuation compression, but this chapter does not restate the funding chronology from Company Overview. More decision-useful capital questions remain unanswered: cash on hand, debt facilities, current burn or cash generation, runway, and the financing trigger for an IPO or further expansion."
    claimRefs: [CI004, CI010, CI011, CI012, CI013, CI014]
  - id: verdict-and-diligence
    title: Financial verdict and diligence blockers
    body: Kurly's financial profile has improved from a loss-making growth model to reported operating profitability, but the margin of safety is narrow relative to the capital and operational complexity of fresh-food delivery. Positive indicators include sustained sales growth, a profitable first half of 2025, a reported full-year 2025 profit, higher transaction value, and evidence that category and channel expansion are increasing customer activity. Offsetting risks are the absence of public cash and debt data, no disclosed CAC or payback, no realized-price or gross-margin bridge, and competitive dependence on partners and delivery infrastructure. The appropriate stance is to credit the profit inflection as evidence, not extrapolate it into durable free cash flow.
    claimRefs: [CI014, CI015, CI016]
    tableRefs: []
callouts:
  - calloutType: strength
    title: Profit inflection is now evidenced
    body: Public reporting supports a first-half 2025 operating profit and a later reported full-year 2025 operating profit, with logistics productivity and category diversification cited as drivers.
    claimRefs: [CI005, CI007, CI008]
  - calloutType: risk
    title: Profitability is not cash adequacy
    body: No retained source discloses cash on hand, debt maturities, free cash flow, burn, or runway, so the IPO and expansion funding dependency remains a material diligence gap.
    claimRefs: [CI014, CI015]
