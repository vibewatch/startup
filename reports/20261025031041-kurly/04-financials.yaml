      - [GMV, "KRW 3.5340tn in 2025 preliminary GMV", high, "Indicates transaction throughput but not recognized revenue", "Provide GMV-to-sales and take-rate bridge"]
      - [Operating profit, "KRW 13.1bn in 2025; KRW 3.1bn in H1 2025", high, "Evidence of profit inflection", "Provide segment and monthly bridge to EBITDA and cash"]
      - [Historical funding, "USD 200m Series F in 2021; USD 428m total raised then", medium, "Frames past financing but not current liquidity", "Reconcile historical proceeds to current cash and cumulative uses"]
      - [Gross margin, null, low, "Needed to test whether delivery and assortment costs are structurally covered", "Provide gross margin by category and channel"]
      - [CAC / payback, null, low, "Needed to assess whether growth is bought or repeat-driven", "Provide cohort CAC, retention, and payback"]
      - [Cash / runway, null, low, "Needed to assess capital dependency and IPO timing", "Provide cash bridge, debt schedule, burn, and runway"]
