  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash balance, debt and lease obligations, free cash flow, monthly burn, runway, and the financing trigger for IPO or expansion.
      whyItMatters: Reported operating profit cannot establish liquidity or financing independence for a capital-intensive fresh-food network.
      diligencePath: Request the latest monthly management accounts, cash bridge, debt schedule, lease commitments, and board-approved financing plan.
      relatedQuestionRefs: [QI007, QI010]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Realized price, gross margin, contribution margin, CAC, payback, delivery cost per order, and cohort retention by channel.
      whyItMatters: Sales and GMV growth may not translate into scalable economic profit when assortment, delivery, and partner fees vary by channel.
      diligencePath: Request cohort-level P&L by grocery, beauty, 3P/fulfillment, KurlyN Mart, and Kurly USA.
      relatedQuestionRefs: [QI004, QI005, QI010]
      relatedTableRefs: [TI002, TI003]
    - type: enumeration-incomplete
      severity: material
      topic: international
      missingEvidence: Kurly USA order volume, revenue, gross margin, customer cohorts, and share of consolidated results.
      whyItMatters: The U.S. offering is described operationally but its financial materiality is not established.
      diligencePath: Request management reporting for Kurly USA and the consolidated accounting treatment of cross-border sales.
      relatedQuestionRefs: [QI009]
      relatedTableRefs: [TI001]
