callouts:
  - calloutType: insight
    title: Repeat demand is the strategic wedge
    body: >-
      The strongest adoption evidence is not a generic market-size estimate:
      it is repeat purchasing in the Naver channel, paired with Kurly's
      curated assortment and paid membership. The unresolved question is
      whether this repeat behavior remains profitable after delivery and
      category-level fulfillment costs.
    claimRefs: [CM003, CM010, CM011, CM016]
  - calloutType: risk
    title: Scale competition can compress the opportunity
    body: >-
      Coupang's reported 55.4% primary-platform preference and the expansion
      of Naver, Toss and Kakao grocery alliances indicate that market growth
      can attract stronger distribution and logistics competitors faster than
      Kurly can widen margins.
    claimRefs: [CM009, CM014, CM015]
