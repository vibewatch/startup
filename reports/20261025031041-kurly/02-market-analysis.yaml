company:
  name: Kurly
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Kurly operates in a large, highly digital Korean grocery market, but the
    relevant opportunity is narrower than headline e-commerce totals: curated
    fresh food, meal kits, beauty and adjacent household categories delivered
    through owned and partner logistics. The evidence supports strong digital
    adoption and repeat-purchase potential, while price sensitivity, Coupang's
    scale, and the cost of cold-chain fulfillment constrain attainable margins
    and therefore valuation.
sections:
  - id: market-boundary
    title: Market boundary and demand context
    body: >-
      The addressable market should be defined as Korean online grocery and
      adjacent curated household commerce, rather than all retail or all
      digital spending. The WUSATA market update reports KRW 242 trillion of
      total online-shopping transactions in 2024, including KRW 47 trillion of
      food purchases, while a separate 2026 report cites KRW 52.3 trillion of
      Korean online-grocery transaction value in the latest year reported.
      These figures are different scopes and vintages, so they are useful
      boundary lenses, not a single additive TAM. Kurly's own positioning
      emphasizes selected products, premium and small-batch foods, chef meal
      kits, beauty and home goods; its U.S. description explicitly says it
      does not carry everything and applies a product committee. The practical
      market therefore includes online grocery, prepared-food occasions and
      selected adjacencies, while excluding general merchandise that does not
      share Kurly's curation or fulfillment economics. Offline supermarkets,
      convenience stores, bulk clubs and home cooking remain status-quo
      substitutes, especially for immediate or price-led purchases.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-and-segments
    title: Sizing lenses and buyer segmentation
    body: >-
      Multiple lenses show a meaningful market but do not prove Kurly's SAM or
      SOM. Food purchases reached KRW 47 trillion in the 2024 WUSATA summary,
      quick commerce was projected at KRW 5 trillion for 2024, and a later
      report states that online grocery transaction value reached KRW 52.3
      trillion while online represented about 28% of total food retail. The
      same WUSATA source reports Kurly as the primary online-grocery platform
      for 8.6% of respondents, versus 55.4% for Coupang, and says Kurly's
      average transaction was KRW 48,200. These survey and transaction
      measures cannot be converted into a precise share without a consistent
      denominator. Kurly's buyer map is consequently segmented by job to be
      done: quality-seeking households, time-poor single-person households,
      meal-kit and fresh-food repeat purchasers, and partner-channel shoppers
      reached through Naver.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002, TM003]
    figureRefs: [FM001]
  - id: drivers-and-constraints
    title: Adoption drivers, constraints and valuation relevance
    body: >-
      Demand drivers are structural but uneven. DataReportal records 50.6
      million internet users and 97.9% internet penetration in South Korea at
      the end of 2025, while the Korea Times reports 8.05 million single-person
      households, or 36.1% of households, in 2024. The latter group's smaller
      meal occasions and bulk-buying frictions can support delivery and
      portioned products, but its reported cost-of-living pressure makes price
      and basket economics decisive. Kurly's 2025 performance reporting shows
      a 13.5% GMV increase and 1.4 million paid members, and the Naver channel
      reported tenfold transaction-value growth, 70%-range repeat-purchase
      share and 77% of transaction value from repeat customers. Constraints
      remain material: WUSATA reports Coupang's 55.4% primary-platform share,
      KED describes cold-chain investment and transportation and packaging
      costs as cumulative-loss drivers, and 2026 reporting says Naver, Toss
      and Kakao are extending alliance-based competition. These dynamics make
      repeat frequency, contribution margin after fulfillment, and channel
      access more valuation-relevant than a broad top-down market label.
    claimRefs: [CM010, CM011, CM012, CM013, CM014, CM015]
    calloutRefs: []
  - id: diligence-gaps
    title: Sizing and adoption gaps
    body: >-
      The retained evidence does not isolate Kurly's serviceable market by
      geography, customer cohort, category or contribution margin. It also
      does not establish a comparable market-share series against Coupang,
      Naver, offline grocers or quick-commerce providers. The available
      percentages mix survey preference, transaction value, platform reach and
      household counts; none should be treated as a conversion funnel. The
      reported Naver repeat metrics are encouraging but are company or partner
      reporting and do not disclose cohort retention, order frequency, CAC,
      fulfillment cost per order or incremental margin. A diligence process
      should request category-level GMV, active-buyer cohorts, regional
      penetration, gross-to-net take rate, delivery cost by temperature class,
      and channel-level contribution profit before assigning a SOM or
      extrapolating current growth into valuation.
    claimRefs: [CM016, CM017]
    callouts: 
      - calloutType: risk
        title: TAM is not the bottleneck
        body: >-
          The evidence supports a large and growing digital grocery pool, but
          the investment constraint is whether Kurly can convert repeat demand
          into durable contribution margin while larger platforms expand the
          same delivery proposition.
        claimRefs: [CM013, CM014, CM016]
