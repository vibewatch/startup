    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: technical-disclosure
    missingEvidence: >-
      Public architecture documentation, API boundaries, uptime and incident history, security controls,
