  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, voting rights, founder and investor ownership percentages, and related-party
      arrangements.
    whyItMatters: Control and key-person exposure cannot be assessed from historical financing announcements alone.
    diligencePath: >-
      Obtain the latest capitalization table, shareholder agreements, board roster and reserved-matters schedule under
      NDA.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO002
  - type: stale
    severity: material
    topic: funding
    missingEvidence: Current valuation, total raised, cash balance, debt facilities and runway after the Naver transaction.
    whyItMatters: Historical round valuations are not a current valuation or available cash measure.
    diligencePath: >-
      Request the latest investor update, audited or management accounts, debt schedule and post-money capitalization
      table.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: Verified dates and primary documentation for all product, logistics, regulatory and adverse milestones.
    whyItMatters: The public timeline is sufficient for directional context but not a complete corporate chronology.
    diligencePath: Reconcile company announcements, filings, exchange submissions and board minutes into a dated milestone register.
    relatedQuestionRefs:
      - QO006
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: blocking
    topic: sizing-gaps
    missingEvidence: >-
      Kurly category-level GMV, active-buyer cohorts, regional penetration, take rate and contribution margin by
      delivery mode.
    whyItMatters: >-
      Without these denominators, public market totals cannot be converted into a defensible SAM or SOM or linked to
      valuation.
    diligencePath: >-
      Request monthly cohort, category, region and fulfillment-cost schedules from management and reconcile them to
      audited revenue and GMV.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      A consistent year, category taxonomy and denominator reconciling the KRW 47 trillion, KRW 52.3 trillion and KRW 5
      trillion lenses.
    whyItMatters: >-
      The values describe different populations and periods, so treating them as one funnel could materially overstate
      opportunity.
    diligencePath: Obtain the underlying Ministry of Data and Statistics tables and map each category to Kurly's served assortment.
    relatedQuestionRefs:
      - QM002
      - QM008
  - type: private-evidence-only
    severity: material
    topic: repeat-purchase
    missingEvidence: Independent validation of KurlyN Mart repeat purchase, order frequency, CAC and incremental contribution margin.
    whyItMatters: Partner-reported repeat metrics may show demand but do not establish profitable, durable adoption.
    diligencePath: >-
      Request channel-level cohorts and contribution-profit bridges from Kurly and Naver, then test against order-level
      samples.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable current basket prices, delivery fees, membership benefits and discount rates across Kurly, Coupang,
      Naver-KurlyN Mart and Oasis.
    whyItMatters: >-
      Without matched pricing, the report cannot determine whether curation and delivery quality compensate for a price
      disadvantage or whether switching is economically meaningful.
    diligencePath: >-
      Collect identical fresh-food baskets and membership terms across the four routes for multiple regions and delivery
      windows.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: Channel-level cohort retention, order frequency, contribution margin, delivery cost, spoilage and supplier terms.
    whyItMatters: >-
      Partner-channel growth may reflect incremental reach, cannibalization, or platform dependence; public
      transaction-value growth alone cannot distinguish them.
    diligencePath: Request a channel cohort and unit-economics bridge covering Kurly-owned and partner-originated orders.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: landscape
    missingEvidence: >-
      A complete current list of regional supermarkets, quick-commerce services and internal-build offerings competing
      for the same customer missions.
    whyItMatters: The identified landscape covers material routes but cannot certify exhaustive competitor enumeration.
    diligencePath: >-
      Build a geography-specific competitor census using matched service area, assortment, delivery window and customer
      segment criteria.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: competitor-scale
    missingEvidence: Comparable period and denominator definitions for MAU, transaction value, GMV, sales and repeat-purchase metrics.
    whyItMatters: >-
      The retained metrics use different periods and populations, so direct ranking could overstate or understate
      relative scale.
    diligencePath: >-
      Normalize competitor disclosures to the same period, geography, metric definition and channel scope before using
      them in valuation.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, debt and lease obligations, free cash flow, monthly burn, runway, and the financing trigger
      for IPO or expansion.
    whyItMatters: >-
      Reported operating profit cannot establish liquidity or financing independence for a capital-intensive fresh-food
      network.
    diligencePath: >-
      Request the latest monthly management accounts, cash bridge, debt schedule, lease commitments, and board-approved
      financing plan.
    relatedQuestionRefs:
      - QI007
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Realized price, gross margin, contribution margin, CAC, payback, delivery cost per order, and cohort retention by
      channel.
    whyItMatters: >-
      Sales and GMV growth may not translate into scalable economic profit when assortment, delivery, and partner fees
      vary by channel.
    diligencePath: Request cohort-level P&L by grocery, beauty, 3P/fulfillment, KurlyN Mart, and Kurly USA.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI010
    relatedTableRefs:
      - TI002
      - TI003
  - type: enumeration-incomplete
    severity: material
    topic: international
