  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: technical-disclosure
      missingEvidence: Public architecture documentation, API boundaries, uptime and incident history, security controls, disaster-recovery testing and service-level metrics.
      whyItMatters: The visible product is operationally complex and partner-dependent, but public evidence cannot quantify technical resilience or implementation risk.
      diligencePath: Request architecture and data-flow diagrams, security assessment summaries, incident and uptime logs, recovery objectives, vendor dependencies and SLA dashboards.
      relatedQuestionRefs: [QE006, QE007, QE008]
    - type: missing-source
      severity: material
      topic: Kurly-USA
      missingEvidence: U.S. order volume, repeat rate, delivery performance, unit economics and contribution to total business.
      whyItMatters: The U.S. surface uses a materially different fulfillment model from Korean dawn delivery and could create distinct logistics and working-capital exposure.
      diligencePath: Request monthly U.S. orders, cohorts, gross margin, shipping cost, spoilage, delivery SLA and inventory turns since launch.
      relatedQuestionRefs: [QE004, QE007]
    - type: missing-source
      severity: material
      topic: partner-channel
      missingEvidence: KurlyN Mart contract economics, data-sharing rights, service-level obligations and channel concentration.
      whyItMatters: Naver extends reach but may shift customer ownership, economics and operational control outside Kurly's own app.
      diligencePath: Request the Naver agreement, channel P&L, repeat and cohort data, customer ownership terms and termination or renegotiation clauses.
      relatedQuestionRefs: [QE006, QE007]
    - type: access-blocked
      severity: minor
      topic: market
      missingEvidence: The assigned Preqin article body was not present in the prefetched text, leaving its referenced market-growth analysis unavailable for verification.
      whyItMatters: A missing independent market source limits corroboration of external growth context even though it does not change the product findings.
      diligencePath: Obtain an accessible original or licensed copy of the Preqin article and verify its Kurly-specific market claims.
      relatedQuestionRefs: [QE005]
