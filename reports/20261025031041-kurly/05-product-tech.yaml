chapter:
  number: 5
  title: Product & Technology
  summary: Kurly's public product surface is a curated, mobile-first grocery and lifestyle marketplace coupled to temperature-controlled fulfillment and dawn delivery. Recent evidence shows the operating model extending through Beauty Kurly, KurlyN Mart and Naver distribution, while public materials leave software architecture, reliability and security controls largely undisclosed.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      Kurly presents a curated shopping proposition rather than an everything-store. Its
      official U.S. description says products are selected and tested, with a Product Committee
      involving merchandisers, the brand team and the founder; the company says products may be
      rejected or removed when they fall below its bar. The Korean app listing describes Market
      Kurly as a curated destination for food, restaurant meals and household goods, and Beauty
      Kurly as a curated beauty service with profile-based recommendations. This supports a
      product definition of discovery, selection, ordering and delivery, not a claim that Kurly
      owns the underlying brands. The U.S. surface adapts the promise: frozen products ship from a
      U.S. warehouse while pantry, beauty and home products ship from Korea by air. The customer
      workflow is therefore category discovery, curated selection, checkout and either cold-chain,
      same-day/dawn or cross-border fulfillment, depending on the surface.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Fulfillment, channels and operating architecture
    body: >-
      The observable architecture is an operating model with distinct layers. The app is the
      customer and merchandising interface; cold-chain packaging and logistics centers are the
      physical service layer; and third-party channels extend distribution. The app listing
      explicitly describes temperature-separated packaging and full cold-chain dawn delivery,
      while Kurly's 2026 results coverage attributes lower cost of sales to improvements at its
      Gimpo, Pyeongtaek and Changwon logistics centers and better order processing efficiency.
      KurlyN Mart adds a channel-integration layer: Naver users order selected fresh foods, meal
      kits and ready-to-eat meals in Naver's app, while Kurly's network performs dawn or same-day
      delivery. The arrangement is operationally meaningful because it can reach users outside
      Kurly's own app, but it also creates dependency on Naver's traffic and interface. Public
      sources do not establish Kurly's internal software stack, API design, uptime, automation
      level or disaster-recovery controls; those remain diligence requests rather than inferred
      architecture.
    claimRefs: [CE004, CE007, CE008, CE009, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-differentiation-risk
    title: Maturity, differentiation and technical risk
    body: >-
      Product maturity is strongest where Kurly discloses repeatable operating processes: curated
      assortment, cold-chain delivery, app-based shopping and expansion into adjacent categories.
      The Korean app has a 4.8/5 rating from roughly 350,000 reviews on the assigned App Store
      capture, and the listing identifies a recent version, but an app-store rating is not a
      reliability SLA or evidence of production-scale resilience. Independent coverage describes
      Kurly's original next-day model as serving all of South Korea, while more recent reporting
      shows the company adding luxury, beauty, fashion and living products and using Naver as a
      distribution partner. Differentiation therefore appears to combine curation, brand and
      cold-chain execution rather than a publicly demonstrated proprietary software moat. Key
      risks are operational complexity across categories and geographies, dependence on delivery
      infrastructure and partners, privacy/data governance, and limited public evidence on
      security, incidents, service levels, certification and roadmap delivery.
    claimRefs: [CE006, CE010, CE011, CE012, CE013, CE015]
    callouts:
      - calloutType: strength
        title: Curated quality plus fulfillment know-how
        body: Kurly's product and operating differentiation is most credible as a combination of selection discipline and cold-chain execution, not as a disclosed software platform.
        claimRefs: [CE002, CE004]
      - calloutType: risk
        title: Technical assurance is under-disclosed
        body: The assigned public evidence does not establish uptime, security controls, incident history, API architecture or measurable service-level performance.
        claimRefs: [CE011, CE014]
