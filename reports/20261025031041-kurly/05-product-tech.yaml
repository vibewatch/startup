      - ["Cold-chain operations", "Temperature-separated packing and dawn delivery", "Logistics centers and delivery network", "Need SLA, capacity, spoilage and contingency data"]
      - ["Partner distribution", "Naver storefront and selected assortment", "Naver traffic and interface", "Need contract, economics, data-sharing and channel concentration terms"]
    notes: Architecture is limited to publicly evidenced operating layers; no software components or performance figures are inferred from marketing descriptions.
    claimRefs: [CE002, CE004, CE007, CE008, CE014]
