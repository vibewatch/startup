callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: >-
      The first annual profit and Naver distribution validate a monitored
      upside case, but the evidence does not yet establish cash generation,
      current capitalization, preference overhang, or an investable IPO price.
    claimRefs: [CV001, CV003, CV017, CV021]
  - calloutType: risk
    title: Valuation is financing-sensitive
    body: >-
      Kurly's prior private marks moved from above KRW 4 trillion to KRW 2.5
      trillion before the current Naver implied mark; terms and denominators
      must be reconciled before treating any mark as fair value.
    claimRefs: [CV003, CV004, CV012, CV013]

