company:
  name: Kurly
chapter:
  number: 8
  title: Valuation
  summary: >-
    Kurly's valuation case has improved with its first annual operating profit,
    but public evidence still supports disciplined tracking rather than a
    price-insensitive buy. The 2026 Naver financing is a useful current mark,
    while the large gap between prior private valuations and today's operating
    proof makes IPO timing, capitalization, cash, and preference rights central
    diligence items.
sections:
  - id: recommendation
    title: Recommendation and valuation stance
    body: >-
      The evidence supports a track recommendation with medium confidence and a
      high risk rating. Kurly reported preliminary 2025 consolidated revenue of
      KRW 2.3671 trillion, GMV of KRW 3.5340 trillion, and operating profit of
      KRW 13.1 billion, its first annual operating profit, but the operating
      margin implied by those figures is only about 0.6% and is not a substitute
      for cash-flow or balance-sheet evidence. A 2026 Naver paid-in capital
      increase at KRW 66,148 per share implied approximately KRW 2.8 trillion
      for Kurly, while prior reporting put the 2021 pre-IPO valuation at KRW
      4 trillion and the 2023 financing valuation at KRW 2.5 trillion. Those
      marks are not directly interchangeable: the instruments, dilution,
      preference terms, currency conversion, and capitalization denominator
      require confirmation. The current evidence therefore justifies monitoring
      profitable growth and strategic distribution, not underwriting a target
      return or issuing a buy call without price and cap-table diligence.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and financing context
    body: >-
      The positive thesis is that Kurly has moved from a capital-intensive
      cold-chain growth story toward a broader, more efficient commerce
      platform. The 2025 results attribute profitability to logistics-center
      operating improvements, a lower cost-of-sales ratio, category expansion,
      and growth in Kurly N Mart. The Naver channel is strategically meaningful:
      reported repeat-purchaser share rose into the 70% range, repeat customers
      represented 77% of transaction value, and 37.8% of N Mart orders came
      from outside the Seoul metropolitan area. The anti-thesis is that the
      reported annual profit remains thin, the 2024 KED account described a
      KRW 12.8 billion nine-month operating loss and a steep valuation decline,
      and competition remains intense. The historical KRW 3.3 billion-dollar
      private mark and planned IPO range are stale context rather than current
      valuation evidence. Any investment decision must test whether growth is
      repeatable after promotions, whether Naver is incremental rather than
      cannibalistic, and whether new categories improve contribution economics.
    claimRefs: [CV006, CV007, CV008, CV010, CV011]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: scenarios-and-comps
    title: Scenarios and comparable reference points
    body: >-
      A defensible scenario range should be built from operating drivers rather
      than a headline multiple copied from an earlier financing. The base case
      is a track outcome: Kurly sustains positive but low-margin earnings,
      expands Naver distribution, and earns a valuation near the current Naver
      implied mark only after confirming cash generation and dilution. The bull
      case requires repeat purchasing and category expansion to lift margins
      materially while the Naver channel broadens regional reach without
      eroding Kurly's own customer economics. The bear case reflects a return to
      losses, a delayed IPO, multiple compression, or the need for new capital
      before liquidity is proven. Historical financing references are useful for
      direction, not for a comparable-company multiple: the 2021 and 2023 marks
      used different market conditions and financing circumstances. HelloFresh's
      2025 results illustrate that a scaled food-commerce model can have
      positive free cash flow while revenue declines, but it is a competitor
      context and not a directly comparable benchmark for Kurly's private mark.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: diligence-and-exit
    title: Exit readiness and thesis-break diligence
    body: >-
      Exit readiness is not established by the available public record. Kurly
      received preliminary exchange approval in 2022 but postponed the listing
      after market conditions and valuation deteriorated, and the current
      evidence does not establish a renewed timetable, exchange, offer price,
      cash runway, debt facilities, exact equity capitalization, or liquidation
      preferences. The decisive diligence package is therefore a reconciled
      cap table and financing ledger, latest management accounts with cash-flow
      and working-capital detail, debt and preferred-security terms, Naver
      investment documents, and an IPO workplan. Thesis-break triggers should
      include a return to recurring operating losses, declining repeat purchase
      or N Mart retention, inability to convert GMV growth into contribution
      profit and cash, a financing below the Naver implied mark, or a listing
      delay that requires materially dilutive capital. Until those tests are
      answered, the appropriate action is to track and re-underwrite on a
      verified price and liquidity path.
    claimRefs: [CV011, CV016, CV017, CV021]

tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, track, "First annual operating profit but thin implied margin and incomplete cash evidence", "Monitor; do not underwrite a buy yet"]
      - [Confidence, medium, "2025 results and 2026 Naver financing are current, while cap-table and IPO details remain open", "Re-underwrite after primary diligence"]
      - [Risk rating, high, "Low operating margin, intense competition, prior valuation compression, and unresolved liquidity terms", "Require downside protection and milestones"]
      - [Valuation stance, uncertain, "Naver transaction implies about KRW 2.8 trillion, but instrument terms and denominator need confirmation", "Use the mark as a reference, not a target price"]
    notes: >-
      Public evidence snapshot as of 2026-10-25. The implied margin is an
      arithmetic indication from reported revenue and operating profit, not a
      cash-flow measure; null or unverified financing terms are not treated as
      zero.
    claimRefs: [CV001, CV002, CV003, CV004, CV017]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current implication]
    rows:
      - ["Profitability inflection", "2025 was reported as the first annual operating profit with four profitable quarters", "Audited accounts show durable operating and free-cash-flow conversion", "Supports tracking, not yet a buy"]
      - ["Distribution leverage", "N Mart repeat-purchaser share reached the 70% range and 37.8% of orders came from outside greater Seoul", "Cohort retention and contribution profit remain positive after incentives", "Strategic partnership is a real upside option"]
      - ["Valuation compression risk", "KED reported a fall from a peak above KRW 4 trillion to KRW 2.5 trillion in the 2023 financing", "New financing terms and preferred rights reconcile to the current mark", "Historical headline values are not a floor"]
      - ["Competitive pressure", "Naver/Kurly's model is explicitly positioned against Coupang and other grocery alliances", "Kurly demonstrates durable share and margin despite competitor scale", "High risk remains appropriate"]
    notes: >-
      The rows combine current reported operating evidence with historical
      financing context. They are analytical judgments anchored to the cited
      claims, not a complete market-share enumeration.
    claimRefs: [CV006, CV007, CV008, CV010, CV011]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Operating assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "N Mart repeat buying persists; category expansion lifts margin; logistics utilization improves", "Current implied mark proves conservative as earnings and cash conversion compound", "Lower probability until cash and cohort evidence are verified", "Repeat rate or contribution margin falls after incentives"]
      - [Base, "Low positive operating profit continues; Naver adds reach; IPO timing remains uncertain", "Track near the approximately KRW 2.8 trillion implied mark pending terms and cash diligence", "Most supportable public-evidence case", "New capital is needed before cash generation is demonstrated"]
      - [Bear, "Growth slows; cold-chain and fulfillment costs re-expand; listing is delayed", "Down-round or preference-adjusted value materially below the Naver mark", "Material risk given prior valuation compression", "Operating losses recur or liquidity runway is short"]
      - [Historical reference, "2021 pre-IPO and 2023 financing marks reflect different markets and instruments", "Do not use US$3.3 billion or KRW 2.5 trillion as a current comparable multiple", "Context only, not a probability-weighted valuation", "Terms cannot be reconciled to the current cap table"]
    notes: >-
      These are qualitative scenario signals, not a precise probability-weighted
      valuation. Public sources do not provide enough current information on
      cash, debt, preferences, dilution, or an IPO price to support false
      precision.
    claimRefs: [CV003, CV004, CV012, CV013, CV014, CV015, CV016]

