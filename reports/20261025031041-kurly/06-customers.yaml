chapter:
  number: 6
  title: Customers
  summary: Kurly's customer evidence shows a premium, quality-led grocery proposition with measurable repeat purchasing through its Naver channel and a larger paid-membership base, but public evidence remains thin on cohort retention, customer economics, and concentration.
sections:
  - id: customer-segments
    title: Customer segments and buying jobs
    body: >-
      Kurly's original customer proposition is a quality-sensitive household shopper who values
      curated fresh food and convenient delivery rather than an undifferentiated supermarket
      catalogue. CNA describes the core group as female millennials in their 30s and 40s who shop
      for families and themselves, while Kurly's U.S. site says its assortment is selected and
      tested rather than stocked indiscriminately. The offer has broadened from premium groceries
      into beauty, fashion, living goods, chef and restaurant meal kits, and Korean pantry products
      for overseas customers. That broadening can increase share of wallet, but the public record
      does not disclose segment-level revenue, payer versus user splits, or customer acquisition
      cost. Naver adds a distribution segment: Kurly's selected food assortment is exposed to Naver
      users, and 37.8% of KurlyN Mart orders came from outside the greater Seoul area, about five
      percentage points above Kurly's own mall.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: >-
      The strongest current adoption evidence is channel-level rather than cohort-level. Chosun
      reported that Kurly's 2025 monthly active users rose by more than 30% year over year and that
      Kurly Members reached 1.4 million subscribers, including more than 200,000 additions in the
      fourth quarter. The same article reported first annual operating profit and a 13.5% increase
      in total transaction volume, but those are company performance measures, not proof of
      retention. Naver/Kurly reporting is more diagnostic: KurlyN Mart repeat-purchaser share rose
      from 17% to the 70% range, repeat customers generated 77% of transaction value, and the
      channel's transaction value grew tenfold from its initial level over a year. These figures
      indicate repeat behavior in one partnership channel, but they do not establish company-wide
      GRR, NRR, churn, renewal, order frequency, or contribution margin by cohort.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-proof-and-expansion
    title: Named customer proof, expansion, and concentration
    body: >-
      Named proof is strongest where a counterparty or customer relationship is described together
      with a concrete use case. Naver's KurlyN Mart places selected fresh foods, meal kits, and
      ready-to-eat meals on Naver while Kurly's network delivers them by dawn or same-day delivery.
      In Singapore, Kurly placed more than 40 products on Lazada's RedMart, including ready-to-cook
      and ready-to-eat meals made with Korean chefs and restaurants. Kurly's luxury expansion also
      added Reebonz as a third-party online retailer, showing marketplace breadth but not evidence
      of repeat demand or production depth. Kurly's own U.S. description says it uses a frozen
      warehouse assortment plus direct air shipments from Korea; this is a channel and fulfilment
      model, not a disclosed customer-count metric. Naver's channel reached regions Kurly's app had
      not penetrated, but the public sources do not identify top-customer revenue, partner
      concentration, churn, failed pilots, complaint rates, or contract duration. Those omissions
      are material to judging durability and downside.
    claimRefs: [CU009, CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
    figureRefs: [FU001]
