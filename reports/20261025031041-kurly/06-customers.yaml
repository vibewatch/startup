          detail: "KurlyN Mart repeat-purchaser share rose from 17% to the 70% range; repeat customers generated 77% of transaction value."
        - id: membership
          label: Membership
          detail: "Kurly Members reached 1.4 million subscribers at the end of 2025."
        - id: expansion
          label: Category and channel expansion
          detail: "Beauty, fashion, living, international, and Naver-distributed assortments extend the customer relationship."
        - id: diligence
          label: Economics to verify
          detail: "Company-wide retention, cohort economics, and customer concentration remain undisclosed in the assigned public sources."
    claimRefs: [CU002, CU007, CU008, CU009, CU010]
callouts:
  - calloutType: strength
    title: Repeat behavior is visible in the Naver channel
    body: KurlyN Mart's reported repeat-purchaser and repeat-value shares are the clearest public evidence of customer durability, although they are not a substitute for company-wide cohort retention.
    claimRefs: [CU007, CU008]
  - calloutType: risk
    title: Customer economics and concentration remain opaque
    body: Public evidence does not disclose churn, renewal, cohort contribution margin, top-customer concentration, or partner-channel dependency, limiting confidence in durability and expansion claims.
    claimRefs: [CU014, CU015]
