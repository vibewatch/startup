callouts:
  - calloutType: risk
    title: Highest-priority diligence
    body: >-
      The decisive unknowns are cash runway, service-quality denominators, privacy controls, partner SLAs, and current capitalization. A positive annual operating result should not be treated as evidence that these exposures are contained.
    claimRefs: [CR001, CR003, CR014, CR016, CR018, CR020]
  - calloutType: assumption
    title: Thesis-break monitoring
    body: >-
      Escalate the risk rating if operating profit reverses, delivery or spoilage metrics deteriorate, a material privacy event occurs, Naver or CJ economics change, or a listing process requires materially more capital than the business can fund.
    claimRefs: [CR001, CR015, CR016, CR018, CR020]
localEvidence:
  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: liquidity
      missingEvidence: Current cash, debt facilities, restricted cash, working-capital needs, and runway by scenario.
      whyItMatters: Thin operating margins and logistics investment can make accounting profitability insufficient to fund expansion or absorb disruption.
      diligencePath: Obtain the latest management accounts, cash reconciliation, debt schedule, covenant package, cap table, and a 24-month downside liquidity model.
      relatedQuestionRefs: [QR008]
    - type: missing-source
      severity: material
      topic: privacy-security
      missingEvidence: Kurly-specific privacy incidents, breach notifications, penetration-test results, and regulator correspondence.
      whyItMatters: The business processes delivery and payment-related information, but a general regulator page cannot establish Kurly's actual control environment or incident history.
      diligencePath: Request the incident register, PIPC correspondence, DPA/subprocessor list, security audit reports, and breach-response playbooks.
      relatedQuestionRefs: [QR002, QR009]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: quality
      missingEvidence: Delivery-on-time, spoilage, refund, complaint, recall, and cold-chain excursion rates by region and category.
      whyItMatters: Customer trust and margin can deteriorate even while headline transaction volume grows.
      diligencePath: Reconcile operational dashboards and customer-service tickets to monthly cohorts, with separate denominators for orders, items, and complaints.
      relatedQuestionRefs: [QR003, QR010]
      relatedTableRefs: [TR002]
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: A current financing mark, IPO timetable, and fully diluted capitalization table.
      whyItMatters: Historical private valuations span materially different market conditions and cannot support a current entry price without a bridge.
      diligencePath: Obtain the latest preferred-share terms, board valuation, investor rights, and IPO adviser materials.
      relatedQuestionRefs: [QR006, QR007]
      relatedTableRefs: [TR003]
