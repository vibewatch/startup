chapter:
  number: 7
  title: Risks
  summary: Kurly's principal risks are thin-margin logistics economics, dependence on partners and external channels, valuation and IPO timing uncertainty, and expanding regulatory and data-protection obligations. Recent profitability and repeat-purchase evidence improve the operating picture, but public evidence does not establish cash runway, incident history, or mitigation maturity.
sections:
  - id: risk-posture
    title: Risk posture and thesis-break triggers
    body: Kurly's risk profile is high because the business combines fresh-food cold-chain execution with a broadening marketplace and partner distribution model. The company reported its first annual operating profit for 2025, but the result was only 13.1 billion Korean won on 2.3671 trillion won of sales, while an earlier independent report described cumulative losses from logistics investment and variable transportation and packaging costs. The current risk thesis therefore depends on whether profitability survives category expansion and channel growth rather than on one positive annual result. The most important thesis breaks are a return to sustained operating losses, measurable service or food-quality failures, loss of a critical logistics or channel partner, or renewed valuation compression that restricts capital access. Public evidence reviewed here does not quantify Kurly's cash balance, debt capacity, runway, or company-specific incident history; these are diligence gaps, not evidence that no exposure exists.
    claimRefs: [CR001, CR002, CR003]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Regulatory and legal exposure
    body: >-
      The public record supports regulatory exposure, but not a confirmed Kurly enforcement action. Kurly handles customer addresses, payment interactions, delivery-access information, and marketplace transactions, while Korea's Personal Information Protection Commission states that it investigates data breaches or infringements. This creates a monitoring obligation even though the assigned PIPC page does not identify Kurly. Product and seller expansion also increases consumer-protection complexity: independent ordering guidance says fresh and frozen goods generally cannot be returned for a change of mind, while damaged or spoiled goods require photographic reporting. Those terms are not a legal finding against Kurly, but they identify a customer-remediation and food-quality control surface. The regulatory register therefore distinguishes observed company or market practices from unresolved legal status and specifies a concrete diligence path for licenses, complaints, privacy controls, recalls, and litigation.
    claimRefs: [CR006, CR007, CR008]
    tableRefs: [TR001]
  - id: operational-quality
    title: Operational, quality, and security risk
    body: >-
      Kurly's operating model is vulnerable to service-quality variance because delivery promises depend on geographic eligibility, cut-off times, building access, refrigerated or frozen handling, and the performance of multiple logistics centers. An independent guide reports that dawn delivery may be unavailable to dormitories and offices, that missing entrance codes can leave a box at a ground-floor or security location, and that busy nights can close orders early. These constraints do not prove systemic failure, but they create measurable failure modes: late or inaccessible delivery, spoiled goods, failed returns, and cold-chain or security incidents. Kurly's 2025 profitability was partly attributed to improved logistics-center operations and order-processing efficiency, yet the retained public evidence does not quantify defect rates, refunds, outages, or security controls.
    claimRefs: [CR010, CR011, CR013, CR014]
    tableRefs: [TR002]
  - id: partner-and-financial
    title: Partner, market, and financial dependency
    body: >-
      Kurly's growth increasingly depends on relationships that can both expand reach and dilute control. TechCrunch reported that CJ Logistics joined the 2021 financing as a strategic backer with a deal to help expand overnight delivery. Naver's KurlyN Mart channel delivered a tenfold increase in transaction value in one year, but Naver was also considering a broader model in which Kurly would provide logistics for additional Smart Store groceries. Independent market analysis identifies high competition and rising expectations for efficient fast delivery as sector challenges. Capital-market risk remains material: Kurly shifted its planned US IPO to Korea in 2021, postponed that listing in 2023 amid weak market sentiment, and was reported at 2.5 trillion won in May 2023 versus a 4 trillion won peak in December 2021. Financing terms, partner economics, and liquidity therefore require fresh underwriting.
    claimRefs: [CR002, CR015, CR016, CR017, CR018, CR019, CR020]
    tableRefs: [TR003]
