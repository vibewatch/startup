chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Kurly was founded in 2014 and is headquartered in Seoul, South Korea. Its original proposition was curated
              food and fresh-produce commerce supported by next-day dawn delivery, while its current platform spans
              fresh food, beauty, fashion, living goods, third-party seller delivery and fulfillment. Kurly's own U.S.
              description says founder Sophie Kim began the business in 2015 with a small initial assortment and a
              quality-selection process; this is company-reported positioning rather than independent verification. The
              U.S. offering is operationally distinct from Korean dawn delivery: it uses a U.S. frozen warehouse and
              direct air shipment from Korea for pantry, beauty and home products. The evidence supports a premium,
              curated commerce model, but does not establish the economics or revenue contribution of the U.S. business.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
