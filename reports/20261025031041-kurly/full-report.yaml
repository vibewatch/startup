  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand context
        blocks:
          - type: paragraph
            body: >-
              The addressable market should be defined as Korean online grocery and adjacent curated household commerce,
              rather than all retail or all digital spending. The WUSATA market update reports KRW 242 trillion of total
              online-shopping transactions in 2024, including KRW 47 trillion of food purchases, while a separate 2026
              report cites KRW 52.3 trillion of Korean online-grocery transaction value in the latest year reported.
              These figures are different scopes and vintages, so they are useful boundary lenses, not a single additive
              TAM. Kurly's own positioning emphasizes selected products, premium and small-batch foods, chef meal kits,
              beauty and home goods; its U.S. description explicitly says it does not carry everything and applies a
              product committee. The practical market therefore includes online grocery, prepared-food occasions and
              selected adjacencies, while excluding general merchandise that does not share Kurly's curation or
              fulfillment economics. Offline supermarkets, convenience stores, bulk clubs and home cooking remain
              status-quo substitutes, especially for immediate or price-led purchases.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
      - number: '2.2'
        title: Sizing lenses and buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              Multiple lenses show a meaningful market but do not prove Kurly's SAM or SOM. Food purchases reached KRW
              47 trillion in the 2024 WUSATA summary, quick commerce was projected at KRW 5 trillion for 2024, and a
              later report states that online grocery transaction value reached KRW 52.3 trillion while online
              represented about 28% of total food retail. The same WUSATA source reports Kurly as the primary
              online-grocery platform for 8.6% of respondents, versus 55.4% for Coupang, and says Kurly's average
              transaction was KRW 48,200. These survey and transaction measures cannot be converted into a precise share
              without a consistent denominator. Kurly's buyer map is consequently segmented by job to be done:
              quality-seeking households, time-poor single-person households, meal-kit and fresh-food repeat purchasers,
              and partner-channel shoppers reached through Naver.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM010
              - CM011
