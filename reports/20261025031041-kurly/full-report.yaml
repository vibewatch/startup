      - number: '4.2'
        title: Profitability and cost structure
        blocks:
          - type: paragraph
            body: >-
              The current public trajectory is encouraging but not yet a full underwriting model. Kurly reported KRW 1.3
              billion of operating profit in the second quarter of 2025 after an KRW 8.5 billion loss in the comparable
              quarter, and KRW 3.1 billion of operating profit for the first half. A later report described KRW 13.1
              billion of 2025 annual operating profit and four consecutive profitable quarters. Management attributed
              improvement to logistics-center operations and order-processing efficiency, while earlier reporting
              identified cold-chain investment, transportation, and packaging as structural cost burdens. Gross margin,
              contribution margin, fulfillment cost per order, and cash conversion remain undisclosed in the retained
              evidence.
            claimRefs:
