      - number: '4.3'
        title: Growth, channels, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Kurly's growth engine is broadening beyond its owned app. KurlyN Mart, launched with Naver, added a
              distribution channel and is reported to have produced rapid transaction growth, stronger repeat
              purchasing, and regional reach outside the Seoul area. The same channel introduces platform dependence and
              a competitive response from Coupang, Toss, and Kakao. Historical financing evidence shows that Kurly
              raised substantial capital and later experienced valuation compression, but this chapter does not restate
              the funding chronology from Company Overview. More decision-useful capital questions remain unanswered:
              cash on hand, debt facilities, current burn or cash generation, runway, and the financing trigger for an
              IPO or further expansion.
            claimRefs:
              - CI004
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Kurly's financial profile has improved from a loss-making growth model to reported operating
              profitability, but the margin of safety is narrow relative to the capital and operational complexity of
              fresh-food delivery. Positive indicators include sustained sales growth, a profitable first half of 2025,
              a reported full-year 2025 profit, higher transaction value, and evidence that category and channel
              expansion are increasing customer activity. Offsetting risks are the absence of public cash and debt data,
              no disclosed CAC or payback, no realized-price or gross-margin bridge, and competitive dependence on
              partners and delivery infrastructure. The appropriate stance is to credit the profit inflection as
              evidence, not extrapolate it into durable free cash flow.
            claimRefs:
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Profit inflection is now evidenced
            body: >-
              Public reporting supports a first-half 2025 operating profit and a later reported full-year 2025 operating
              profit, with logistics productivity and category diversification cited as drivers.
