              - CM007
              - CM008
              - CM009
              - CM011
      - number: '2.3'
        title: Adoption drivers, constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are structural but uneven. DataReportal records 50.6 million internet users and 97.9%
              internet penetration in South Korea at the end of 2025, while the Korea Times reports 8.05 million
              single-person households, or 36.1% of households, in 2024. The latter group's smaller meal occasions and
              bulk-buying frictions can support delivery and portioned products, but its reported cost-of-living
              pressure makes price and basket economics decisive. Kurly's 2025 performance reporting shows a 13.5% GMV
              increase and 1.4 million paid members, and the Naver channel reported tenfold transaction-value growth,
              70%-range repeat-purchase share and 77% of transaction value from repeat customers. Constraints remain
              material: WUSATA reports Coupang's 55.4% primary-platform share, KED describes cold-chain investment and
              transportation and packaging costs as cumulative-loss drivers, and 2026 reporting says Naver, Toss and
              Kakao are extending alliance-based competition. These dynamics make repeat frequency, contribution margin
              after fulfillment, and channel access more valuation-relevant than a broad top-down market label.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Sizing and adoption gaps
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not isolate Kurly's serviceable market by geography, customer cohort, category
              or contribution margin. It also does not establish a comparable market-share series against Coupang,
              Naver, offline grocers or quick-commerce providers. The available percentages mix survey preference,
              transaction value, platform reach and household counts; none should be treated as a conversion funnel. The
              reported Naver repeat metrics are encouraging but are company or partner reporting and do not disclose
              cohort retention, order frequency, CAC, fulfillment cost per order or incremental margin. A diligence
              process should request category-level GMV, active-buyer cohorts, regional penetration, gross-to-net take
              rate, delivery cost by temperature class, and channel-level contribution profit before assigning a SOM or
              extrapolating current growth into valuation.
            claimRefs:
              - CM016
              - CM017
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Repeat demand is the strategic wedge
            body: >-
              The strongest adoption evidence is not a generic market-size estimate: it is repeat purchasing in the
              Naver channel, paired with Kurly's curated assortment and paid membership. The unresolved question is
              whether this repeat behavior remains profitable after delivery and category-level fulfillment costs.
            calloutType: insight
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM016
          - type: callout
            title: Scale competition can compress the opportunity
            body: >-
              Coupang's reported 55.4% primary-platform preference and the expansion of Naver, Toss and Kakao grocery
              alliances indicate that market growth can attract stronger distribution and logistics competitors faster
              than Kurly can widen margins.
            calloutType: risk
            claimRefs:
              - CM009
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and routes to the same job
        blocks:
          - type: paragraph
            body: >-
              Kurly competes across more than a single grocery category. HSG describes the company as combining curated
              groceries, fresh food, beauty and household essentials with Saetbyeol Delivery and an end-to-end cold
              chain. Its U.S. surface explicitly says that the Korean dawn-delivery model does not cross an ocean, so
              the company uses a frozen U.S. warehouse and direct air shipment from Korea instead. That distinction
              matters: the core Korean proposition is a time-and-freshness service, while the U.S. proposition is
              curated Korean assortment with different fulfillment economics. The direct competitive set therefore
              includes Coupang Rocket Fresh, Naver's KurlyN Mart channel, Oasis Market and other fresh-food specialists;
              adjacent alternatives include beauty and lifestyle marketplaces; substitutes include conventional
              supermarkets, restaurant/meal-kit purchasing and parcel delivery; and the status quo is a consumer
              assembling these purchases across several channels. Internal build is also a credible alternative for
              large platforms with their own traffic and fulfillment infrastructure. Current evidence does not establish
              a complete market-share ranking for every class, so the matrix distinguishes observed positioning from
              unknown scale.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP015
      - number: '3.2'
        title: Competitor profiles, scale and strategic direction
        blocks:
          - type: paragraph
            body: >-
              The available evidence shows materially different competitive weapons. Coupang is described as the leading
              online-shopping platform, with 35.95 million monthly active users in September 2026 after recovering from
              a post-breach decline; that is a distribution and traffic advantage rather than proof of grocery
              profitability. Naver supplies a different route to demand: KurlyN Mart sits inside Naver Plus Store, and
              its transaction value increased tenfold over its first year. Kurly's logistics network delivered the
              selected fresh-food assortment, while Naver considered expanding the model to Smart Store sellers and
              logistics centers. Oasis illustrates a specialist challenger whose loyal-customer base can support growth,
              but its 2025 second-quarter operating profit fell 50.9% as advertising and promotion rose 229.2% year on
              year. Kurly's own 2025 results, reported by Chosun, show 2.3671 trillion won of sales, 3.5340 trillion won
              of transaction volume and 13.1 billion won of operating profit, plus 1.4 million paid members; these are
              company-reported performance markers, not proof that its moat is protected. Funding, competitor pricing
              and comparable customer economics are not consistently disclosed in the retained sources.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.3'
        title: Differentiation, switching costs and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Kurly's defensibility is strongest where curation, supplier relationships, product quality control and
              cold-chain operations reinforce one another. Its U.S. description says products pass a Product Committee
              and that the company works directly with growers and makers; HSG similarly attributes differentiation to
              product curation, data-driven retail, fulfillment technology and delivery infrastructure. These
              capabilities can create trust and operational know-how, but they are not automatically exclusive. Naver's
              alliance uses Kurly's network to reach users outside greater Seoul, and the reported repeat-purchase rate
              for KurlyN Mart rose from 17% to the 70% range, showing how a partner channel can accelerate adoption
              while also giving Naver more leverage over demand access. Naver is considering a broader model in which
              Kurly handles logistics while Smart Store sellers provide assortment, which could reduce the value of
              Kurly's curation boundary. Oasis's marketing-led growth and Coupang's scale show that customer acquisition
              and traffic can be contested with capital. The adverse case is therefore not that Kurly lacks
              differentiation, but that differentiation may be copied, redistributed through platforms, or competed away
              in acquisition and logistics costs.
            claimRefs:
              - CP002
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP002
              - CP013
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP013
      - number: '3.4'
        title: Buyer implications and unresolved competitive diligence
        blocks:
          - type: paragraph
            body: >-
              For a buyer, Kurly is most compelling when the purchase requires curated fresh assortment, reliable
              temperature-controlled delivery and a trusted premium experience; it is less clearly advantaged when the
              buyer prioritizes the broadest catalog, lowest delivered price or maximum platform reach. The retained
              evidence supports an evidence-backed ordinal positioning rather than numeric market-share or price claims.
              The key diligence question is whether Kurly's selection and logistics capabilities produce repeat behavior
              and contribution margin that remain intact when Naver, Coupang, Oasis and other channels increase
              promotional intensity. A useful underwriting test would compare customer retention, order frequency,
              basket economics, delivery cost, spoilage and supplier terms by channel, especially Kurly's own app versus
              KurlyN Mart. Public sources do not provide enough comparable pricing, discounting, multi-homing or
              internal-build cost data to conclude that switching costs are high. The current competitive verdict is
              differentiated but exposed: distribution partnerships can expand reach, yet they can also make Kurly
              dependent on platform owners whose traffic and assortment advantages are larger.
            claimRefs:
              - CP001
              - CP004
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is operational and assortment-led
            body: >-
              Kurly's strongest observable edge is the combination of curated products, cold-chain execution and dawn
              delivery rather than a disclosed price advantage.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: callout
            title: Platform partners can both extend and dilute the moat
            body: >-
              KurlyN Mart expands reach through Naver, but a broader Smart Store logistics model could shift assortment
              control and customer access toward the platform.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
              - CP015
          - type: callout
            title: Underwrite matched-channel economics
            body: >-
              Before assigning moat durability, compare retention, basket economics, delivery cost, spoilage and
              supplier terms across Kurly's own app and partner channels.
            calloutType: recommendation
            claimRefs:
              - CP001
              - CP004
              - CP013
              - CP014
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Kurly monetizes a curated online-grocery marketplace anchored in fresh food and dawn delivery, with
              adjacent beauty, fashion, living, fulfillment, and international offerings. The public evidence separates
              transaction value from recognized sales: 2025 sales were reported at KRW 2.3671 trillion while GMV was KRW
              3.5340 trillion, and first-half 2025 sales were KRW 1.0595 trillion against GMV of KRW 1.7062 trillion.
              That spread is not an implied take rate because the sources do not provide a consistent accounting bridge.
              The revenue-quality positives are repeat purchasing, higher-value categories, and seller-delivered
              products; the diligence gap is realized pricing and margin by stream.
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
