              and expansion funding dependency remains a material diligence gap.
            calloutType: risk
            claimRefs:
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Kurly presents a curated shopping proposition rather than an everything-store. Its official U.S.
              description says products are selected and tested, with a Product Committee involving merchandisers, the
              brand team and the founder; the company says products may be rejected or removed when they fall below its
              bar. The Korean app listing describes Market Kurly as a curated destination for food, restaurant meals and
              household goods, and Beauty Kurly as a curated beauty service with profile-based recommendations. This
              supports a product definition of discovery, selection, ordering and delivery, not a claim that Kurly owns
              the underlying brands. The U.S. surface adapts the promise: frozen products ship from a U.S. warehouse
              while pantry, beauty and home products ship from Korea by air. The customer workflow is therefore category
              discovery, curated selection, checkout and either cold-chain, same-day/dawn or cross-border fulfillment,
              depending on the surface.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE008
      - number: '5.2'
        title: Fulfillment, channels and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The observable architecture is an operating model with distinct layers. The app is the customer and
              merchandising interface; cold-chain packaging and logistics centers are the physical service layer; and
              third-party channels extend distribution. The app listing explicitly describes temperature-separated
              packaging and full cold-chain dawn delivery, while Kurly's 2026 results coverage attributes lower cost of
              sales to improvements at its Gimpo, Pyeongtaek and Changwon logistics centers and better order processing
              efficiency. KurlyN Mart adds a channel-integration layer: Naver users order selected fresh foods, meal
              kits and ready-to-eat meals in Naver's app, while Kurly's network performs dawn or same-day delivery. The
              arrangement is operationally meaningful because it can reach users outside Kurly's own app, but it also
              creates dependency on Naver's traffic and interface. Public sources do not establish Kurly's internal
              software stack, API design, uptime, automation level or disaster-recovery controls; those remain diligence
              requests rather than inferred architecture.
            claimRefs:
              - CE004
              - CE007
              - CE008
              - CE009
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
              - CE007
              - CE008
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE007
              - CE008
      - number: '5.3'
        title: Maturity, differentiation and technical risk
        blocks:
          - type: paragraph
            body: >-
              Product maturity is strongest where Kurly discloses repeatable operating processes: curated assortment,
              cold-chain delivery, app-based shopping and expansion into adjacent categories. The Korean app has a 4.8/5
              rating from roughly 350,000 reviews on the assigned App Store capture, and the listing identifies a recent
              version, but an app-store rating is not a reliability SLA or evidence of production-scale resilience.
              Independent coverage describes Kurly's original next-day model as serving all of South Korea, while more
              recent reporting shows the company adding luxury, beauty, fashion and living products and using Naver as a
              distribution partner. Differentiation therefore appears to combine curation, brand and cold-chain
              execution rather than a publicly demonstrated proprietary software moat. Key risks are operational
              complexity across categories and geographies, dependence on delivery infrastructure and partners,
              privacy/data governance, and limited public evidence on security, incidents, service levels, certification
              and roadmap delivery.
            claimRefs:
              - CE006
              - CE010
              - CE011
              - CE012
              - CE013
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence-supported moat is operational
            body: >-
              Public evidence supports curation, cold-chain execution and channel integration as Kurly's visible
              capabilities; it does not support a proprietary software or security moat.
            calloutType: insight
            claimRefs:
              - CE002
              - CE004
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying jobs
        blocks:
          - type: paragraph
            body: >-
              Kurly's original customer proposition is a quality-sensitive household shopper who values curated fresh
              food and convenient delivery rather than an undifferentiated supermarket catalogue. CNA describes the core
              group as female millennials in their 30s and 40s who shop for families and themselves, while Kurly's U.S.
              site says its assortment is selected and tested rather than stocked indiscriminately. The offer has
              broadened from premium groceries into beauty, fashion, living goods, chef and restaurant meal kits, and
              Korean pantry products for overseas customers. That broadening can increase share of wallet, but the
              public record does not disclose segment-level revenue, payer versus user splits, or customer acquisition
              cost. Naver adds a distribution segment: Kurly's selected food assortment is exposed to Naver users, and
              37.8% of KurlyN Mart orders came from outside the greater Seoul area, about five percentage points above
              Kurly's own mall.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              The strongest current adoption evidence is channel-level rather than cohort-level. Chosun reported that
              Kurly's 2025 monthly active users rose by more than 30% year over year and that Kurly Members reached 1.4
              million subscribers, including more than 200,000 additions in the fourth quarter. The same article
              reported first annual operating profit and a 13.5% increase in total transaction volume, but those are
              company performance measures, not proof of retention. Naver/Kurly reporting is more diagnostic: KurlyN
              Mart repeat-purchaser share rose from 17% to the 70% range, repeat customers generated 77% of transaction
              value, and the channel's transaction value grew tenfold from its initial level over a year. These figures
              indicate repeat behavior in one partnership channel, but they do not establish company-wide GRR, NRR,
              churn, renewal, order frequency, or contribution margin by cohort.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named customer proof, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Named proof is strongest where a counterparty or customer relationship is described together with a
              concrete use case. Naver's KurlyN Mart places selected fresh foods, meal kits, and ready-to-eat meals on
              Naver while Kurly's network delivers them by dawn or same-day delivery. In Singapore, Kurly placed more
              than 40 products on Lazada's RedMart, including ready-to-cook and ready-to-eat meals made with Korean
              chefs and restaurants. Kurly's luxury expansion also added Reebonz as a third-party online retailer,
              showing marketplace breadth but not evidence of repeat demand or production depth. Kurly's own U.S.
              description says it uses a frozen warehouse assortment plus direct air shipments from Korea; this is a
              channel and fulfilment model, not a disclosed customer-count metric. Naver's channel reached regions
              Kurly's app had not penetrated, but the public sources do not identify top-customer revenue, partner
              concentration, churn, failed pilots, complaint rates, or contract duration. Those omissions are material
              to judging durability and downside.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU007
              - CU008
              - CU009
              - CU010
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Repeat behavior is visible in the Naver channel
            body: >-
              KurlyN Mart's reported repeat-purchaser and repeat-value shares are the clearest public evidence of
              customer durability, although they are not a substitute for company-wide cohort retention.
            calloutType: strength
            claimRefs:
              - CU007
              - CU008
          - type: callout
            title: Customer economics and concentration remain opaque
            body: >-
              Public evidence does not disclose churn, renewal, cohort contribution margin, top-customer concentration,
              or partner-channel dependency, limiting confidence in durability and expansion claims.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Kurly's risk profile is high because the business combines fresh-food cold-chain execution with a
              broadening marketplace and partner distribution model. The company reported its first annual operating
              profit for 2025, but the result was only 13.1 billion Korean won on 2.3671 trillion won of sales, while an
              earlier independent report described cumulative losses from logistics investment and variable
              transportation and packaging costs. The current risk thesis therefore depends on whether profitability
              survives category expansion and channel growth rather than on one positive annual result. The most
              important thesis breaks are a return to sustained operating losses, measurable service or food-quality
              failures, loss of a critical logistics or channel partner, or renewed valuation compression that restricts
              capital access. Public evidence reviewed here does not quantify Kurly's cash balance, debt capacity,
              runway, or company-specific incident history; these are diligence gaps, not evidence that no exposure
              exists.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR010
              - CR015
              - CR018
              - CR020
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The public record supports regulatory exposure, but not a confirmed Kurly enforcement action. Kurly
              handles customer addresses, payment interactions, delivery-access information, and marketplace
              transactions, while Korea's Personal Information Protection Commission states that it investigates data
              breaches or infringements. This creates a monitoring obligation even though the assigned PIPC page does
              not identify Kurly. Product and seller expansion also increases consumer-protection complexity:
              independent ordering guidance says fresh and frozen goods generally cannot be returned for a change of
              mind, while damaged or spoiled goods require photographic reporting. Those terms are not a legal finding
              against Kurly, but they identify a customer-remediation and food-quality control surface. The regulatory
              register therefore distinguishes observed company or market practices from unresolved legal status and
              specifies a concrete diligence path for licenses, complaints, privacy controls, recalls, and litigation.
            claimRefs:
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR018
              - CR020
      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Kurly's operating model is vulnerable to service-quality variance because delivery promises depend on
              geographic eligibility, cut-off times, building access, refrigerated or frozen handling, and the
              performance of multiple logistics centers. An independent guide reports that dawn delivery may be
              unavailable to dormitories and offices, that missing entrance codes can leave a box at a ground-floor or
              security location, and that busy nights can close orders early. These constraints do not prove systemic
              failure, but they create measurable failure modes: late or inaccessible delivery, spoiled goods, failed
              returns, and cold-chain or security incidents. Kurly's 2025 profitability was partly attributed to
              improved logistics-center operations and order-processing efficiency, yet the retained public evidence
              does not quantify defect rates, refunds, outages, or security controls.
            claimRefs:
              - CR010
              - CR011
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR010
              - CR011
              - CR013
              - CR014
      - number: '7.4'
        title: Partner, market, and financial dependency
        blocks:
          - type: paragraph
            body: >-
              Kurly's growth increasingly depends on relationships that can both expand reach and dilute control.
              TechCrunch reported that CJ Logistics joined the 2021 financing as a strategic backer with a deal to help
              expand overnight delivery. Naver's KurlyN Mart channel delivered a tenfold increase in transaction value
              in one year, but Naver was also considering a broader model in which Kurly would provide logistics for
              additional Smart Store groceries. Independent market analysis identifies high competition and rising
              expectations for efficient fast delivery as sector challenges. Capital-market risk remains material: Kurly
              shifted its planned US IPO to Korea in 2021, postponed that listing in 2023 amid weak market sentiment,
              and was reported at 2.5 trillion won in May 2023 versus a 4 trillion won peak in December 2021. Financing
              terms, partner economics, and liquidity therefore require fresh underwriting.
            claimRefs:
              - CR002
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority diligence
            body: >-
              The decisive unknowns are cash runway, service-quality denominators, privacy controls, partner SLAs, and
              current capitalization. A positive annual operating result should not be treated as evidence that these
              exposures are contained.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR014
              - CR016
              - CR018
              - CR020
          - type: callout
            title: Thesis-break monitoring
            body: >-
              Escalate the risk rating if operating profit reverses, delivery or spoilage metrics deteriorate, a
              material privacy event occurs, Naver or CJ economics change, or a listing process requires materially more
              capital than the business can fund.
            calloutType: assumption
            claimRefs:
              - CR001
              - CR015
              - CR016
              - CR018
              - CR020
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a track recommendation with medium confidence and a high risk rating. Kurly reported
              preliminary 2025 consolidated revenue of KRW 2.3671 trillion, GMV of KRW 3.5340 trillion, and operating
              profit of KRW 13.1 billion, its first annual operating profit, but the operating margin implied by those
              figures is only about 0.6% and is not a substitute for cash-flow or balance-sheet evidence. A 2026 Naver
              paid-in capital increase at KRW 66,148 per share implied approximately KRW 2.8 trillion for Kurly, while
              prior reporting put the 2021 pre-IPO valuation at KRW 4 trillion and the 2023 financing valuation at KRW
              2.5 trillion. Those marks are not directly interchangeable: the instruments, dilution, preference terms,
              currency conversion, and capitalization denominator require confirmation. The current evidence therefore
              justifies monitoring profitable growth and strategic distribution, not underwriting a target return or
              issuing a buy call without price and cap-table diligence.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV017
      - number: '8.2'
        title: Thesis, anti-thesis, and financing context
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Kurly has moved from a capital-intensive cold-chain growth story toward a
              broader, more efficient commerce platform. The 2025 results attribute profitability to logistics-center
              operating improvements, a lower cost-of-sales ratio, category expansion, and growth in Kurly N Mart. The
              Naver channel is strategically meaningful: reported repeat-purchaser share rose into the 70% range, repeat
              customers represented 77% of transaction value, and 37.8% of N Mart orders came from outside the Seoul
              metropolitan area. The anti-thesis is that the reported annual profit remains thin, the 2024 KED account
              described a KRW 12.8 billion nine-month operating loss and a steep valuation decline, and competition
              remains intense. The historical KRW 3.3 billion-dollar private mark and planned IPO range are stale
              context rather than current valuation evidence. Any investment decision must test whether growth is
              repeatable after promotions, whether Naver is incremental rather than cannibalistic, and whether new
              categories improve contribution economics.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV010
              - CV017
      - number: '8.3'
        title: Scenarios and comparable reference points
        blocks:
          - type: paragraph
            body: >-
              A defensible scenario range should be built from operating drivers rather than a headline multiple copied
              from an earlier financing. The base case is a track outcome: Kurly sustains positive but low-margin
              earnings, expands Naver distribution, and earns a valuation near the current Naver implied mark only after
              confirming cash generation and dilution. The bull case requires repeat purchasing and category expansion
              to lift margins materially while the Naver channel broadens regional reach without eroding Kurly's own
              customer economics. The bear case reflects a return to losses, a delayed IPO, multiple compression, or the
              need for new capital before liquidity is proven. Historical financing references are useful for direction,
              not for a comparable-company multiple: the 2021 and 2023 marks used different market conditions and
              financing circumstances. HelloFresh's 2025 results illustrate that a scaled food-commerce model can have
              positive free cash flow while revenue declines, but it is a competitor context and not a directly
              comparable benchmark for Kurly's private mark.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and thesis-break diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not established by the available public record. Kurly received preliminary exchange
              approval in 2022 but postponed the listing after market conditions and valuation deteriorated, and the
              current evidence does not establish a renewed timetable, exchange, offer price, cash runway, debt
              facilities, exact equity capitalization, or liquidation preferences. The decisive diligence package is
              therefore a reconciled cap table and financing ledger, latest management accounts with cash-flow and
              working-capital detail, debt and preferred-security terms, Naver investment documents, and an IPO
              workplan. Thesis-break triggers should include a return to recurring operating losses, declining repeat
              purchase or N Mart retention, inability to convert GMV growth into contribution profit and cash, a
              financing below the Naver implied mark, or a listing delay that requires materially dilutive capital.
              Until those tests are answered, the appropriate action is to track and re-underwrite on a verified price
              and liquidity path.
            claimRefs:
              - CV011
              - CV016
              - CV017
              - CV021
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              The first annual profit and Naver distribution validate a monitored upside case, but the evidence does not
              yet establish cash generation, current capitalization, preference overhang, or an investable IPO price.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV017
              - CV021
          - type: callout
            title: Valuation is financing-sensitive
            body: >-
              Kurly's prior private marks moved from above KRW 4 trillion to KRW 2.5 trillion before the current Naver
              implied mark; terms and denominators must be reconciled before treating any mark as fair value.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV012
              - CV013
