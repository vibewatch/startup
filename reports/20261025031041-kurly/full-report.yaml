figures:
  - id: FO001
    title: Selected Kurly company milestones
    type: timeline
    summary: >-
      Dated financing, product, channel and profitability milestones show a transition from curated grocery delivery to
      a diversified commerce platform.
    data:
      items:
        - date: '2014'
          label: Founded
          details: Kurly is described as founded in 2014 and headquartered in Seoul.
          tone: neutral
          claimRefs:
            - CO001
        - date: '2015'
          label: Founder-led launch story
          details: Kurly's U.S. company description dates Sophie Kim's initial launch story to 2015.
          tone: neutral
          claimRefs:
            - CO002
            - CO006
        - date: '2017'
          label: Beauty expansion
          details: KED Global reports that Kurly began selling cosmetics through its platform.
          tone: positive
          claimRefs:
            - CO004
        - date: 2021-07
          label: Series F
          details: The Spoon reported a $200 million Series F and $2.2 billion valuation.
          tone: positive
          claimRefs:
            - CO011
        - date: '2022'
          label: Brand and IPO path broaden
          details: KED Global reports a platform-name change and a preliminary IPO nod in 2022.
          tone: neutral
          claimRefs:
            - CO004
            - CO012
        - date: 2023-05
          label: Pre-IPO financing
          details: KED Global reports 120 billion won of pre-IPO funding at a 2.5 trillion won valuation.
          tone: neutral
          claimRefs:
            - CO012
        - date: '2025'
          label: First annual operating profit
          details: Reported preliminary sales were 2.3671 trillion won and operating profit was 13.1 billion won.
          tone: positive
          claimRefs:
            - CO014
        - date: 2026-Q1
          label: Quarterly profit acceleration
          details: Reported revenue was 745.7 billion won and operating profit was 24.2 billion won.
          tone: positive
          claimRefs:
            - CO015
        - date: 2026-09
          label: Naver channel scale
          details: KurlyN Mart repeat purchasers reached the 70% range, according to coverage.
          tone: positive
          claimRefs:
            - CO004
            - CO015
    claimRefs:
      - CO001
      - CO004
      - CO011
      - CO012
      - CO014
      - CO015
  - id: FM001
    title: Market sizing lenses
    type: pyramid
    summary: Separate reported market and demand lenses show scale without implying a common additive funnel.
    data:
      nodes:
        - label: Total online shopping
          value: 242
          unit: KRW tn
          detail: 2024 transaction volume reported by WUSATA
        - label: Online grocery
          value: 52.3
          unit: KRW tn
          detail: Latest-year transaction value reported by Biz Chosun
        - label: Online food purchases
          value: 47
          unit: KRW tn
          detail: 2024 food-purchase value reported in WUSATA update
        - label: Quick commerce
          value: 5
          unit: KRW tn
          detail: 2024 projection summarized by WUSATA
        - label: Kurly GMV
          value: 3.534
          unit: KRW tn
          detail: 2025 transaction volume reported by Chosun
        - label: Kurly preference
          value: 8.6
          unit: '%'
          detail: Share naming Kurly as primary online-grocery platform in WUSATA survey
    approximationNotes: >-
      The layers are non-additive sizing lenses with different periods, populations and denominators; pyramid order is a
      presentation of scope, not a derived TAM-to-SOM conversion.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM011
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Kurly is positioned as high on curation and specialized delivery, while platform scale and distribution power are
      stronger for Coupang and Naver-led routes.
    data:
      xAxis:
        label: Platform reach and distribution power
        min: 0
        max: 10
      yAxis:
        label: Curation and specialized fresh-food capability
        min: 0
        max: 10
      points:
        - label: Kurly
          x: 6
          'y': 9
          detail: >-
            Curation, cold chain and dawn delivery are supported; coordinates are ordinal analyst judgments, not market
            shares.
          tone: positive
        - label: Coupang / Rocket Fresh
          x: 10
          'y': 7
          detail: >-
            Large MAU signal and fresh-food platform presence are supported; grocery-specific depth is not fully
            disclosed.
          tone: neutral
        - label: Naver + KurlyN Mart
          x: 9
          'y': 8
          detail: >-
            Naver traffic combined with Kurly logistics and selected assortment; future expansion remains partly
            prospective.
          tone: neutral
        - label: Oasis
          x: 5
          'y': 7
          detail: Fresh-food specialization and loyal-customer growth are supported; scale is lower in retained evidence.
          tone: neutral
        - label: Conventional supermarkets
          x: 8
          'y': 5
          detail: Physical availability is a substitute route; comparable digital specialization is not measured.
          tone: neutral
        - label: Internal platform build
          x: 9
          'y': 6
          detail: Large platforms can assemble traffic, seller access and fulfillment; build cost is not disclosed.
          tone: neutral
    approximationNotes: >-
      Coordinates are evidence-backed ordinal judgments on a 0-10 scale, not sourced market-share, revenue or capability
      measurements; they should not be read as a quantitative ranking.
    claimRefs:
      - CP001
      - CP006
      - CP007
      - CP008
      - CP013
  - id: FI001
    title: Public revenue-to-profit evidence bridge
    type: flow
    summary: >-
      Reported customer and channel activity feeds transaction value and sales, while logistics and category changes are
      cited as contributors to operating profit; cash conversion remains unobserved.
    data:
      nodes:
        - id: customer-demand
          label: Customer demand
          detail: MAU, membership, repeat purchasing, and category adoption
        - id: channel-expansion
          label: Channel expansion
          detail: Kurly app, KurlyN Mart, 3P/FBK, and Kurly USA
        - id: transaction-value
          label: Transaction value / GMV
          detail: 2025 GMV KRW 3.5340tn; H1 2025 GMV KRW 1.7062tn
        - id: recognized-sales
          label: Recognized sales
          detail: 2025 preliminary consolidated sales KRW 2.3671tn
        - id: operating-profit
          label: Operating profit
          detail: 2025 reported KRW 13.1bn; H1 2025 KRW 3.1bn
        - id: cash-conversion
          label: Cash conversion
          detail: Cash, burn, runway, and free cash flow not disclosed
      edges:
        - from: customer-demand
          to: channel-expansion
        - from: channel-expansion
          to: transaction-value
        - from: transaction-value
          to: recognized-sales
        - from: recognized-sales
          to: operating-profit
        - from: operating-profit
          to: cash-conversion
    approximationNotes: >-
      This is an evidence bridge, not a financial reconciliation or implied take-rate model; the sources do not disclose
      the missing accounting and cash-conversion links.
    claimRefs:
      - CI002
      - CI003
      - CI006
      - CI007
      - CI008
      - CI014
  - id: FE001
    title: Publicly evidenced product and operating stack
    type: stack
    summary: >-
      Kurly's disclosed stack runs from mobile discovery and curation through cold-chain fulfillment and partner
      distribution.
    data:
      layers:
        - label: Market Kurly
          detail: Curated food, meals and household goods
        - label: Beauty Kurly
          detail: Curated beauty with profile-based recommendations
        - label: Cold-chain packaging
          detail: Temperature-separated packaging and full cold-chain dawn delivery
        - label: Logistics centers
          detail: Gimpo, Pyeongtaek and Changwon centers cited in 2025 operating improvements
        - label: KurlyN Mart
          detail: Naver storefront with Kurly dawn or same-day delivery
        - label: Kurly USA
          detail: U.S. warehouse frozen shipping and air shipment from Korea
    claimRefs:
      - CE003
      - CE004
      - CE007
      - CE008
    approximationNotes: >-
      The stack shows publicly evidenced operating layers, not a disclosed software architecture or dependency-complete
      system diagram.
  - id: FU001
    title: Customer journey from curated discovery to repeat expansion
    type: journey-map
    summary: >-
      Kurly's public evidence traces a path from curated discovery and first purchase through repeat channel use and
      adjacent-category expansion, while retention economics remain unreported.
    data:
      nodes:
        - id: discovery
          label: Curated discovery
          detail: >-
            Product Committee selection and premium assortment are used to differentiate the initial grocery
            proposition.
        - id: first-order
          label: First order
          detail: Fresh groceries, meal kits, or ready-to-eat products are purchased through Kurly or a partner channel.
        - id: repeat
          label: Repeat purchase
          detail: >-
            KurlyN Mart repeat-purchaser share rose from 17% to the 70% range; repeat customers generated 77% of
            transaction value.
        - id: membership
          label: Membership
          detail: Kurly Members reached 1.4 million subscribers at the end of 2025.
        - id: expansion
          label: Category and channel expansion
          detail: Beauty, fashion, living, international, and Naver-distributed assortments extend the customer relationship.
        - id: diligence
          label: Economics to verify
          detail: >-
            Company-wide retention, cohort economics, and customer concentration remain undisclosed in the assigned
            public sources.
    claimRefs:
      - CU002
      - CU007
      - CU008
      - CU009
      - CU010
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: The most exposed areas combine high impact with incomplete public mitigation evidence.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Liquidity and margin durability
          values:
            - Medium
            - High
            - Unknown
            - High
        - label: Cold-chain and delivery reliability
          values:
            - Medium
            - High
            - Partial
            - High
        - label: Partner/channel dependence
          values:
            - Medium
            - High
            - Partial
            - High
        - label: Privacy and security
          values:
            - Low-to-medium
            - High
            - Unknown
            - High
        - label: IPO and valuation access
          values:
            - Medium
            - High
            - Partial
            - High
        - label: Consumer and seller compliance
          values:
            - Medium
            - Medium-high
            - Partial
            - Medium-high
    claimRefs:
      - CR001
      - CR006
      - CR010
      - CR015
      - CR018
      - CR020
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Current operating proof and strategic distribution improve the case, but thin margins and unresolved financing
      terms lead to a track decision.
    data:
      nodes:
        - id: scale
          label: 2025 scale
          value: KRW 2.3671tn revenue; KRW 3.5340tn GMV
        - id: profit
          label: Profit inflection
          value: KRW 13.1bn operating profit
        - id: channel
          label: Naver channel
          value: Repeat value share 77%; 37.8% outside Seoul
        - id: mark
          label: Current mark
          value: Approx. KRW 2.8tn implied valuation
        - id: risks
          label: Unresolved risks
          value: Thin margin, competition, terms, liquidity
        - id: decision
          label: Decision
          value: Track; re-underwrite after diligence
      edges:
        - - scale
          - profit
        - - profit
          - channel
        - - channel
          - mark
        - - mark
          - risks
        - - risks
          - decision
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV010
      - CV017
