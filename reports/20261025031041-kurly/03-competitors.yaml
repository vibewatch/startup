company:
  name: Kurly
chapter:
  number: 3
  title: Competitors
  summary: Kurly's competitive position rests on curated assortment, cold-chain execution, and dawn-delivery capability, but larger platforms and alliance-led distribution are widening the route to the same customer. The strongest current evidence points to differentiation through selection and logistics partnerships rather than a durable cost advantage; several competitor scale and pricing fields remain undisclosed.
sections:
  - id: landscape
    title: Competitive landscape and routes to the same job
    body: >-
      Kurly competes across more than a single grocery category. HSG describes the company as combining curated groceries, fresh food, beauty and household essentials with Saetbyeol Delivery and an end-to-end cold chain. Its U.S. surface explicitly says that the Korean dawn-delivery model does not cross an ocean, so the company uses a frozen U.S. warehouse and direct air shipment from Korea instead. That distinction matters: the core Korean proposition is a time-and-freshness service, while the U.S. proposition is curated Korean assortment with different fulfillment economics. The direct competitive set therefore includes Coupang Rocket Fresh, Naver's KurlyN Mart channel, Oasis Market and other fresh-food specialists; adjacent alternatives include beauty and lifestyle marketplaces; substitutes include conventional supermarkets, restaurant/meal-kit purchasing and parcel delivery; and the status quo is a consumer assembling these purchases across several channels. Internal build is also a credible alternative for large platforms with their own traffic and fulfillment infrastructure. Current evidence does not establish a complete market-share ranking for every class, so the matrix distinguishes observed positioning from unknown scale.
    claimRefs: [CP001, CP002, CP003, CP004, CP005]
    tableRefs: [TP001]
  - id: competitor-profiles
    title: Competitor profiles, scale and strategic direction
    body: >-
      The available evidence shows materially different competitive weapons. Coupang is described as the leading online-shopping platform, with 35.95 million monthly active users in September 2026 after recovering from a post-breach decline; that is a distribution and traffic advantage rather than proof of grocery profitability. Naver supplies a different route to demand: KurlyN Mart sits inside Naver Plus Store, and its transaction value increased tenfold over its first year. Kurly's logistics network delivered the selected fresh-food assortment, while Naver considered expanding the model to Smart Store sellers and logistics centers. Oasis illustrates a specialist challenger whose loyal-customer base can support growth, but its 2025 second-quarter operating profit fell 50.9% as advertising and promotion rose 229.2% year on year. Kurly's own 2025 results, reported by Chosun, show 2.3671 trillion won of sales, 3.5340 trillion won of transaction volume and 13.1 billion won of operating profit, plus 1.4 million paid members; these are company-reported performance markers, not proof that its moat is protected. Funding, competitor pricing and comparable customer economics are not consistently disclosed in the retained sources.
    claimRefs: [CP006, CP007, CP008, CP009, CP010, CP011, CP012]
    tableRefs: [TP002]
  - id: durability
    title: Differentiation, switching costs and displacement risk
    body: >-
      Kurly's defensibility is strongest where curation, supplier relationships, product quality control and cold-chain operations reinforce one another. Its U.S. description says products pass a Product Committee and that the company works directly with growers and makers; HSG similarly attributes differentiation to product curation, data-driven retail, fulfillment technology and delivery infrastructure. These capabilities can create trust and operational know-how, but they are not automatically exclusive. Naver's alliance uses Kurly's network to reach users outside greater Seoul, and the reported repeat-purchase rate for KurlyN Mart rose from 17% to the 70% range, showing how a partner channel can accelerate adoption while also giving Naver more leverage over demand access. Naver is considering a broader model in which Kurly handles logistics while Smart Store sellers provide assortment, which could reduce the value of Kurly's curation boundary. Oasis's marketing-led growth and Coupang's scale show that customer acquisition and traffic can be contested with capital. The adverse case is therefore not that Kurly lacks differentiation, but that differentiation may be copied, redistributed through platforms, or competed away in acquisition and logistics costs.
    claimRefs: [CP002, CP013, CP014, CP015, CP016]
    tableRefs: [TP003]
    figureRefs: [FP001]
  - id: diligence-implications
    title: Buyer implications and unresolved competitive diligence
    body: >-
      For a buyer, Kurly is most compelling when the purchase requires curated fresh assortment, reliable temperature-controlled delivery and a trusted premium experience; it is less clearly advantaged when the buyer prioritizes the broadest catalog, lowest delivered price or maximum platform reach. The retained evidence supports an evidence-backed ordinal positioning rather than numeric market-share or price claims. The key diligence question is whether Kurly's selection and logistics capabilities produce repeat behavior and contribution margin that remain intact when Naver, Coupang, Oasis and other channels increase promotional intensity. A useful underwriting test would compare customer retention, order frequency, basket economics, delivery cost, spoilage and supplier terms by channel, especially Kurly's own app versus KurlyN Mart. Public sources do not provide enough comparable pricing, discounting, multi-homing or internal-build cost data to conclude that switching costs are high. The current competitive verdict is differentiated but exposed: distribution partnerships can expand reach, yet they can also make Kurly dependent on platform owners whose traffic and assortment advantages are larger.
    claimRefs: [CP001, CP004, CP013, CP014, CP015, CP016]
