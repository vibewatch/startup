      - ["Trust / quality signal", "Product curation and testing", "Unknown in retained sources", "Partner-channel trust and Naver membership", "Good products and trust claimed", "Qualitative only; no independent trust benchmark"]
    notes: "This matrix separates observed capability from unavailable comparison data. Vendor or partner statements are not treated as independent benchmarks, and unknown cells should be closed with matched-basket, service-level and customer-retention evidence."
