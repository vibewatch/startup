      - ["Broad catalog / platform reach", "Expanded into beauty, fashion and living", "Observed mass-platform scale", "Access to Smart Store sellers under consideration", "Specialist fresh-food focus", "Direction is supported; breadth is not measured consistently"]
      - ["Cold-chain / fulfillment control", "End-to-end cold-chain described by HSG", "Unknown in retained sources", "Uses Kurly's logistics network", "Stable supply-chain operation claimed", "Independent operational benchmarking is missing"]
