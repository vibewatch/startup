        - {label: "Internal platform build", x: 9, y: 6, detail: "Large platforms can assemble traffic, seller access and fulfillment; build cost is not disclosed.", tone: neutral}
    approximationNotes: "Coordinates are evidence-backed ordinal judgments on a 0-10 scale, not sourced market-share, revenue or capability measurements; they should not be read as a quantitative ranking."
    claimRefs: [CP001, CP006, CP007, CP008, CP013]
callouts:
  - calloutType: strength
    title: Differentiation is operational and assortment-led
    body: Kurly's strongest observable edge is the combination of curated products, cold-chain execution and dawn delivery rather than a disclosed price advantage.
    claimRefs: [CP001, CP002, CP003]
  - calloutType: risk
    title: Platform partners can both extend and dilute the moat
    body: KurlyN Mart expands reach through Naver, but a broader Smart Store logistics model could shift assortment control and customer access toward the platform.
    claimRefs: [CP013, CP014, CP015]
  - calloutType: recommendation
    title: Underwrite matched-channel economics
    body: Before assigning moat durability, compare retention, basket economics, delivery cost, spoilage and supplier terms across Kurly's own app and partner channels.
    claimRefs: [CP001, CP004, CP013, CP014, CP015, CP016]
