    {
      "id": "comparable-valuation-framework",
      "title": "Comparable frameworks show that headline category membership is not enough to justify the current price",
      "body": "The best public comp method here is not one perfect analog but a layered framework. The public software set provides discipline: UiPath, C3 AI, GitLab, and Datadog show what markets currently pay for automation, AI software, developer platform, and high-growth infrastructure businesses with much richer disclosure than Multiverse. The private set provides category context: Hugging Face, Dataiku, and Mistral show that AI platforms and foundation-model companies can command multi-billion-dollar valuations when ecosystem breadth or frontier relevance is obvious. Multiverse sits between those worlds. It is more strategically differentiated than a generic software vendor and has a stronger sovereign-AI wedge than many public comps. But it is also less disclosed and less platform-entrenched than the better-known private leaders. That is why comparables do not support a simplistic conclusion. They suggest the current valuation is not nonsensical by sector standards, yet they also suggest investors are already paying for a lot of future scale. On raw comp logic, Multiverse looks ambitious but possible at the category level, and stretched at the proof level.",
