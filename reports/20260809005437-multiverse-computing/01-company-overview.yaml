    {
      "id": "founders-and-leadership",
      "title": "Founders, Leadership Bench, and Key-Person Dependence",
      "body": "The founder set blends finance, quantum science, engineering, and commercialization. CEO Enrique Lizaso brings a banking and operations background and has become the primary storyteller for capital raising and sovereign-AI positioning. Co-founder and Chief Scientific Officer Román Orús anchors the scientific core, especially the tensor-network methods that underpin CompactifAI, while CTO Samuel Mugel and co-founder Alfonso Rubio round out the technical and ecosystem-building base. The current leadership page also shows a broader operating bench spanning finance, people, product, and go-to-market roles, which is useful evidence that the business is no longer just a research shop. Even so, public materials suggest meaningful key-person concentration remains. Investors are still underwriting Lizaso’s fundraising and market narrative and Orús’s credibility on the underlying science, so succession planning, board oversight, and the depth of second-line scientific leadership remain live diligence questions.",
