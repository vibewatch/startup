    {
      "id": "capital-and-stakeholders",
      "title": "Funding Trajectory, State Support, and Stakeholder Map",
      "body": "Capital formation is the central story of Multiverse’s maturation. The company moved from an oversubscribed €25 million Series A in March 2024 to a €189 million / $215 million Series B in June 2025 and then to a $570 million / €500 million Series C in July 2026. That latest round valued the company at $1.7 billion pre-money and took aggregate funding to roughly $800 million, putting it among the largest Spanish AI financings. The investor mix is notable because it blends classic venture backers with strategic corporates and public capital. SETT and other Spanish or European public vehicles are not merely symbolic supporters; public backing is central to the company’s sovereignty narrative. The tradeoff is that external observers still do not have a full cap table, exact ownership percentages, or a transparent reconciliation of all public-state commitments across rounds, so stakeholder influence and dilution mechanics remain partly opaque.",
