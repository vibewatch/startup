  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Multiverse Computing is a 2019-founded San Sebastián quantum-inspired AI company that turned early quantum-software work into CompactifAI, a tensor-network model-compression platform. By July 2026 it had raised a $570 million Series C at a $1.7 billion pre-money valuation, with Spanish state backing and a strategy centered on sovereign, edge, and efficient AI deployment."
  },
  "sections": [
    {
      "id": "identity-and-strategy",
      "title": "Identity, Footprint, and Strategic Thesis",
      "body": "Multiverse Computing presents itself as a Spain-based efficient-AI company whose roots are in quantum and quantum-inspired software. Public company materials and independent coverage consistently place the headquarters in Donostia–San Sebastián and describe a 2019 founding period in which the company initially built quantum and optimization tools before scaling CompactifAI into the primary commercial engine. The practical thesis is not “quantum hardware” but tensor-network mathematics from quantum physics applied to compressing and orchestrating AI workloads. By 2026, the identity story had widened from a compression vendor to a sovereign AI platform that can route workloads across cloud, on-premises, and edge devices. That positioning matters for diligence because the company is selling not only cost reduction, but also geopolitical and governance benefits: enterprises and governments can keep models and data closer to home, avoid full hyperscaler dependence, and deploy AI in disconnected or resource-constrained settings.",
