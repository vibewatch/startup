    {
      "id": "milestones-and-scale-signals",
      "title": "Milestones, Scale Signals, and Commercial Expansion",
      "body": "The milestone record shows a fast transition from quantum-software specialist to broader efficient-AI infrastructure company. Public round announcements and office openings show that 2025 and 2026 were not just financing years but scaling years: Madrid opened in late 2025, Barcelona opened in early 2026, and the company attached itself to larger sovereign-AI infrastructure efforts such as the Spanish AI gigafactory consortium. Commercial scale signals are real but still mostly company-supplied. Multiverse repeatedly says it serves more than 100 global customers, that its customers span regulated and industrial sectors, and that its models run across millions of devices and systems. Independent media reinforce those points, but they do not replace hard cohort, retention, or margin disclosure. The best interpretation is that Multiverse has legitimate enterprise traction and brand momentum, yet still lacks the fully transparent operating metrics that later-stage infrastructure investors usually want before underwriting a multi-billion-dollar platform story.",
