    {
      "id": "trust-compliance-and-risks",
      "title": "Trust, Compliance, and Product Risks",
      "body": "The trust story is strongest where sovereignty and local control matter. Public materials repeatedly emphasize that models can run in a customer’s own cloud, on-premise, or on-device, which helps with privacy, data residency, and low-connectivity operation. The integrated management policy also shows some operational maturity and explicit attention to regulatory, contractual, and environmental obligations. But there is still a gap between control-oriented positioning and externally validated trust posture. Across the reviewed sources, Multiverse does not publicly foreground SOC 2 or ISO 27001 certification in the way many enterprise software buyers expect, and the ethics/security pages are far less concrete than the product and benchmark pages. There are also practical product risks: the offline app falls back to the cloud when device resources are insufficient; the most ambitious Foundry surface remains prelaunch; and core performance claims still depend heavily on company-authored test conditions. The result is a technically promising stack with real buyer relevance, but one that still needs buyer-specific validation on security, reliability, and deployment maturity.",
