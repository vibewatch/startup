    {
      "id": "architecture-and-workflow",
      "title": "Architecture and Operating Workflow",
      "body": "The public architecture has become specific enough to explain how the product is meant to operate in practice. CompactifAI reduces model weights before deployment; the deployment page then places those models in managed API, private cloud, on-premise, or edge settings; and the AI Unplugged materials add a routing layer that decides whether a local or cloud model should answer. In the app workflow, Gilda (a local Llama 3.1 Slim) handles lighter or privacy-sensitive tasks, while DeepSeek R1 Slim handles more demanding reasoning in the cloud, coordinated by CompactifAI Router. This is not just a demo diagram. It expresses the core value proposition: move as much useful work as possible to smaller, cheaper, local compute while escalating only harder tasks to more expensive infrastructure. The API documentation reinforces that the serving surface is developer-oriented and OpenAI-compatible, which lowers integration friction. Architecturally, the product looks less like a single model and more like a system for deciding what model should run where, at what cost, and under what control constraints.",
      "claimRefs": [
