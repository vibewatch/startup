      - number: '2.2'
        title: 规模测算视角：边缘 AI、推理与主权算力
        blocks:
          - type: paragraph
            body: >-
              公开规模证据支持一个很大的机会，但并不指向单一精确市场数字。公司和投资人材料把 Multiverse 连接到 $106 billion 的 AI 推理市场；第三方边缘 AI 出版方则把 2026 年边缘 AI
              市场放在一个很宽的区间，从约 $30B 出头到 $30B 高段，有时更高，取决于纳入范围。另一个维度上，欧盟委员会的 AI Factories and Gigafactories
              议程指向一个不可忽视的主权算力需求池，它由政策驱动，而不只是企业软件驱动。这些政策来源没有给压缩供应商一个干净的软件 TAM，但它们证明 Multiverse
              讨论的算力、数据和主权问题是真实存在且有预算的。对尽调来说，有用的结论不是哪一个头条数字正确，而是相邻支出池确实存在，关键任务是判断 Multiverse 作为后期基础设施公司到底能变现哪一层。
