        title: 单位经济模型、成本结构与利润率逻辑
        blocks:
          - type: paragraph
            body: >-
              基本单位经济模型逻辑是说得通的，哪怕公司真实数字仍是私有信息。Multiverse 的压缩话术是：更小模型会减少算力、延迟、存储和能源使用。官方产品材料声称，在某些配置中推理成本降低 50% 到 80%，性能提升
              4x 到 12x；API 文档则声称推理成本最高降低 70%，每秒请求数最高提升 4x。一份 AIwire 关于 Intel Xeon 6 的基准发布显示，一个压缩 Llama 工作负载的吞吐量提升约
              94%，延迟下降约 47% 到 49%，支持了客户可能为效率而非原始模型新颖性付费的观点。不过，公开利润率承保仍很弱，因为我们不知道各模型服务成本、GPU
              组合、再训练成本、支持负担，也不知道收入中有多少来自较低利润率服务、多少来自较高利润率的经常性用量。合理结论是，这门生意可能有吸引人的毛利率潜力，但公开记录还没有证明。
