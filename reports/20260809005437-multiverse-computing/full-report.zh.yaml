  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与既有替代方案
        blocks:
          - type: paragraph
            body: >-
              Multiverse 的目标市场比“AI”窄，也比“压缩软件”宽。公司材料描述的待解决任务结合了推理效率、模型压缩、路由，以及跨云、本地和边缘环境的部署。这把 Multiverse 放在应用型 AI
              推理层，而不是前沿模型训练层。它也意味着主要替代方案不只是直接初创公司。买方可以继续把工作负载交给超大规模云厂商，在昂贵硬件上继续跑全尺寸模型，或者依赖芯片和平台厂商的既有优化栈。因此，市场边界包括那些降低每
              token 成本、减少内存和电力需求、保留隐私或离线运行能力的软件和工具，同时排除通用云基础设施、基础模型创建和无差异咨询服务。这个边界重要，因为它让可服务市场更具体，但也让 Multiverse 面临比宽泛
              AI TAM 故事暗示的更多替代压力。
