      - number: '5.3'
        title: 性能主张、兼容性与差异化
        blocks:
          - type: paragraph
            body: >-
              核心技术差异化主张是，压缩可以保留大模型大部分有用性能，同时大幅降低内存、存储、延迟和算力需求。Multiverse 为此发布了越来越细的证据，尤其是围绕 Intel Xeon 6
              基准和开放模型发布。在一项被广泛分发的 Xeon 6 测试中，公司报告称，一个压缩 Llama 3.3 70B 工作负载的吞吐量提升约 94%，TTFT/TPOT/ITL 降低约 47% 到
              49%，并在引用的基准上保留超过 97% 的准确率。如果这些结果能泛化，差异就很实质。公司还强调与 PyTorch、Hugging Face、vLLM CPU 和 OpenAI
              风格服务界面等主流工具兼容，这很重要，因为买方很少想要孤岛式技术栈。不过，性能故事只完成了部分去风险：大多数详细基准和架构叙事仍由供应商撰写，或由新闻稿再发布，因此差异化看起来可信，但还没有在怀疑型企业架构师理想中的层级上被独立坐实。
