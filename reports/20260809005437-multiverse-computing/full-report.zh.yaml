      - number: '3.2'
        title: 能力对比：Multiverse 独特在哪里，又不独特在哪里
        blocks:
          - type: paragraph
            body: >-
              大多数既有工具已经支持 Multiverse 所销售的一部分能力：量化、剪枝、运行时优化和硬件感知部署。TensorRT 和 TensorRT-LLM 在 NVIDIA 硬件上提供深度优化；OpenVINO 专注
              Intel 环境中的高效推理；Qualcomm AI Hub 强在端侧和验证；Google AI Edge 与 ONNX Runtime 覆盖跨平台部署；Hugging Face
              同时提供优化封装和托管推理界面。因此，Multiverse
              的独特性不在于优化本身存在，而在于它声称能在准确率降幅有限的情况下实现异常高的压缩比，并把压缩包进更宽的主权和跨环境部署故事里。这个区分可信，但也需要持续防守。竞争对手不会原地踏步，而且许多对手拥有更深的分发、更强的开发者引力，或对底层硬件和运行时生态更紧的控制。
