        - 定制定价可能拖慢与替代方案的直接对标
      - - NVIDIA TensorRT 系列
        - SDK、企业栈、Triton / AI Enterprise 邻近能力
        - 混合；工具通常可免费起步，企业打包覆盖更广
        - 推理优化、运行时、编译器、服务
        - 打包进更广的 NVIDIA 支出后，独立价格比较变弱
      - - OpenVINO
        - 开源工具包
        - 通常没有简单的软件席位价
        - 跨 Intel 硬件的优化与推理
        - 价值往往通过硬件和实施兑现，而非单独软件价格
      - - Qualcomm AI Hub
        - 工作台和模型 / 部署工具
        - 已审页面没有简单公开企业价
        - 编译、性能分析、验证并部署到端侧
        - 放在设备项目里可能比作为单独软件科目更容易证明合理
      - - Hugging Face Endpoints
        - 托管专用推理端点
        - 有公开打包入口，但具体支出取决于部署选择
