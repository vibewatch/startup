  - id: TV005
    title: 投资逻辑破裂与止损触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入基数不及预期
        - 当前 ARR / 收入仍只有数千万美元低位，且缺少强毛利证据
        - 让当前投后估值倍数难以站住脚
        - 将当前价格视为偏高，并要求重置或更强条款
      - - 伙伴驱动 GTM 缺少归属权
        - 下一轮尽调后，直接 vs 间接收入、续约或集中度仍不透明
        - 增长标题会转化为质量更低的经济性
        - 下调收入质量，并降低平台倍数假设
      - - 主权切入点被压缩
        - 超大规模云厂商主权云或既有堆栈以相近 TCO 赢下欧洲关键客户
        - 压缩定价权和战略稀缺性
        - 下调终局倍数，并拉长退出溢价路径
      - - 平台执行滑坡
        - Foundry 仍停留在路线图层面，没有客户绑定或 GA 证明
        - 削弱当前估值里嵌入的平台上行部分
        - 更按压缩供应商、而非宽基础设施栈给公司定价
      - - 合规证明持续薄弱
        - 受监管部署仍没有更清晰的 AI Act / 合规资料包或信任材料
        - 拖慢企业采购，并削弱主权溢价
        - 拉长销售周期假设，并施加风险折价
    notes: 这些触发项展示运营失误如何直接传导到估值压缩。
    claimRefs:
