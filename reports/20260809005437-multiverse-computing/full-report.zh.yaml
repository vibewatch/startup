  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和主权风险现在是一阶问题，因为 AI Act 已在 2026 年从理论变成运营 约束
        blocks:
          - type: paragraph
            body: >-
              最迫近的外部风险已经不是泛泛而谈的「总有一天会管 AI」，而是眼下就要落地的合规执行。欧盟委员会的 AI Act 材料和多份 2026 年合规解读指向同一个拐点：到 2026 年 8
              月，执法和透明度义务已经启动；范围内系统的提供方或部署方，需要成文的风险管理、技术文档、日志、人类监督和网络安全控制。Multiverse
              会被牵进去，因为它的客户叙事明确押注金融服务、公共部门、能源、电信，以及接近关键基础设施的部署等受监管、对主权敏感的买家。这并不意味着 CompactifAI 在所有使用场景都会自动成为高风险 AI
              系统；但分类、角色划分和文档已经不再是尽调中的可选项。NIS2 也指向同一主题。Multiverse
              如果想嵌入受监管的欧洲工作负载，客户和伙伴会要求供应链纪律、事件报告准备度和可审计治理。隐私政策也提醒一点：公司已经处理个人数据，并使用第三方提供商，其中部分位于 EEA
              之外；任何要求严格的买家都会因此增加主权和传输治理工作。公开治理记录因此给出了可信基线，但还不是最严企业和公共部门采购最终可能要求的那种产品级信任材料包。
