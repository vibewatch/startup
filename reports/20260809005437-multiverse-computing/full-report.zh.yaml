      - number: '3.4'
        title: 切换成本、多栖使用与护城河耐久度
        blocks:
          - type: paragraph
            body: >-
              耐久度问题是混合的。早期多栖使用可行，因为许多买方已经在 PyTorch、ONNX、Hugging Face，以及 Qualcomm/NVIDIA/Intel 工具链等互操作生态里工作。这给了
              Multiverse
              进入评估周期的空间。但一旦团队承诺采用硬件特定或云特定的推理路径，切换成本就会升高，因为调优、治理、监控和采购都会嵌进去。这是双刃剑。它意味着既有厂商可以很黏，也意味着一个供应商如果赢下窄但重要的工作流，可以从那里扩张。因此，护城河大概率是中等，而不是绝对。它取决于
              Multiverse 能否在压缩效率、隐私友好部署和主权运营栈集成上保持可衡量优势，且速度快过大厂打包或复制相似结果。战略威胁不只是直接竞争；更大的可能是，优化变成更大平台里的标准复选框。
