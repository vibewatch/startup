      - number: '3.3'
        title: 包装、分发与信任 / 监管姿态
        blocks:
          - type: paragraph
            body: >-
              分发是既有巨头最强的地方。NVIDIA、Intel、Qualcomm、Microsoft、Google 和 Hugging Face 在 Multiverse
              这种专门供应商进入评估前，就已经卡在开发者工作流、企业标准或硅采购决策里。它们的产品往往可以免费起步，嵌在更大技术栈中，或作为硬件和云合同的自然延伸出现。行业里很多公司的价格透明度也有限，这让逐项对比变难，并允许大厂把优化能力打包进更大的企业协议。Multiverse
              最好的反制力量，是其在受监管或主权敏感场景中的信任姿态。欧洲围绕 AI 工厂、超大 AI 工厂 和云 / AI
              主权的公共政策势能不会消除大科技竞争，但它确实创造了一个语境：一家欧洲本土、强调控制的压缩层，可能比泛泛的“直接用超大规模云厂商默认选项”更有说服力。
