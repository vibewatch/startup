            body: >-
              从财务上看，Multiverse
              的资本化程度强于披露程度。公司显然已经集结了一笔可观弹药，也似乎从企业和基础设施买方那里获得了可信需求，但它要求投资人在缺少绝对收入、利润率和现金跑道数据的情况下，为很高估值下注，精确建模无从谈起。这意味着核心财务问题不是今天有没有资本；而是公司能否在基础设施扩张、国际增长和定制企业工作吃掉太多新资金之前，把效率主张和主权
              AI 定位转成耐久、高质量的经常性收入。现阶段，审慎看法是建设性但不完整。Multiverse
              的融资消除了即时生存担忧，但缺少已披露现金、烧钱速度、利润率和集中度数据，仍挡住了对收入质量、回本周期和当前估值下行保护的清晰评估。
