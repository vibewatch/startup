    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：既有巨头、相邻平台与现状
        blocks:
          - type: paragraph
            body: >-
              竞争集合在结构上很宽。买方可以通过芯片厂商优化栈、托管云 AI 平台、叠在现有框架上的开源工具，或 Multiverse
              这样的专门供应商，解决同一个任务。这意味着公司的“竞争”不只是其他模型压缩初创公司。NVIDIA、Intel 和 Qualcomm 已经交付贴近硬件、并嵌入更大基础设施决策的优化和部署界面。Microsoft 和
              Google 把优化包在更宽的应用和治理平台里。Hugging Face 和 ONNX Runtime 让内部自建路径可行，从而降低对独立供应商的需求。Neural Magic 被 Red Hat
              收购后的转向也说明，效率工具可以被更大平台吸收。关键后果是，只有当 Multiverse 的压缩质量取舍和主权价值主张超过打包替代方案的便利性时，它才会赢。
