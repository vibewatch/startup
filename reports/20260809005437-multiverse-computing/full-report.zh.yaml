  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 替代方案
      - 类别
      - 规模 / 姿态
      - 目标客群
      - 差异化
      - 相对 Multiverse 的限制
    rows:
      - - NVIDIA TensorRT / TRT-LLM
        - 既有硬件绑定推理栈
        - 深度嵌入 NVIDIA GPU 生态
        - 以 GPU 为中心的企业和数据中心推理
        - 量化、运行时和 LLM 优化强，分发触达极广
        - 差异化主要来自 NVIDIA 优先工作流，而非主权或硬件无关控制
      - - Intel OpenVINO
        - 既有 CPU / 边缘优化栈
        - 与 Intel 硬件覆盖绑定的开源工具包
        - 企业、边缘、浏览器和本地 Intel 部署
        - 聚焦 Intel 设备上的更低延迟、更高吞吐和更小占用
        - 在跨厂商主权编排上的差异化不够明显
      - - Qualcomm AI Hub
        - 设备 / OEM 优化栈
        - 带真机性能分析的端侧工作流
        - Snapdragon 与 Qualcomm 设备生态
        - 端侧验证和部署路径强
        - 与 Qualcomm 硬件选择绑定很紧
      - - Hugging Face Optimum / Endpoints
        - 开放生态 + 托管部署
        - 开发者心智强，模型分发枢纽大
        - 部署开放模型的开发者、创业公司和企业
        - 优化封装和托管端点降低对单独工具的需求
        - 覆盖面广，但不一定为主权优先企业栈优化
      - - ONNX Runtime / 内部自建
        - 开源运行时替代方案
        - 跨平台，且已嵌入许多产品
        - 拥有内部 ML 工程能力的团队
        - 云、边、Web、移动端可移植性和调优旋钮
        - 相比更高层的厂商方案，需要更多内部组装工作
      - - Google AI Edge 与 Microsoft Foundry
        - 平台既有厂商 / 云邻近
        - 打包进更大的开发者和企业生态
        - 端侧应用、企业 AI 应用和智能体
        - 打包便利，贴近治理体系
        - 打包会压缩独立厂商空白市场
      - - Neural Magic / Red Hat AI 效率脉络
        - 已被平台吸收的效率专门厂商
        - 收购后社区工具被废弃
        - 需要稀疏或高效推理工具的团队
        - 说明市场对效率和基于 vLLM 的部署有技术兴趣
        - 也说明专门工具可能被吸收或废弃
    notes: 本组画像比较的是买方为完成同一任务可采用的主要现实替代方案，不只限于直接的创业公司同业。
