  - id: TR005
    title: 缓释与止损标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - AI Act / 受监管用例准备度
        - 产品级角色分类和文档
        - 到下一轮尽调时，受监管部署仍没有清晰的适用性备忘录、控制项映射或证据包
        - 下调企业转化假设，并要求明确补救计划
      - - 安全与主权证明
        - 信任材料和处理方治理
        - 严格买方对基础数据流、传输、日志或支持边界问题仍需要逐项解释
        - 假设公共部门 / 受监管客户销售周期更长、成交率更低
      - - 基准测试可复现性
        - 独立性能证据
        - 收益仍主要来自发布口径，或局限在窄场景演示，缺少更广泛的第三方复现
        - 下调护城河假设，并提高商品化风险权重
      - - 伙伴驱动收入转化
        - 直接 vs 间接订单和续约归属
        - 联盟公告持续增加，但成交、扩张和续约能见度仍薄
        - 下调收入质量和集中度置信度
      - - 平台执行
        - Foundry GA 和运行证据
        - Foundry 仍停留在路线图上，却已经成为公司叙事核心
        - 交付追上前，不承销平台倍数上行
      - - 竞争韧性
        - 相对超大规模云厂商和既有堆栈的输赢
        - 主权买方越来越多在相近 TCO 下选择超大规模云厂商的主权区域，或绑定式供应商工具链
        - 下调定价权和长期差异化评级
    notes: 这些标准适合通过数据室、客户访谈、产品材料和未来公开披露持续跟踪。
