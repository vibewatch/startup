      - number: '7.4'
        title: 伙伴和规模依赖能扩大触达，但也给所有权、利润率和执行控制带来风险
        blocks:
          - type: paragraph
            body: >-
              Multiverse 当前很大一部分商业动能看起来是借伙伴传导，而不是完全来自直销、自有企业关系。EY 将面向受监管买家的行业专属主权 AI 包装出来。PwC 描述国际机会生成。Inetum
              被定位为主要国际伙伴。BeeAPro/Nethesis 和 Arsys 把动作延伸到 NIS2 敏感和主权基础设施场景。产品侧，Axelera 和 Qualcomm
              扩大硬件覆盖。对一家卖进重合规行业的欧洲深科技公司来说，这种杠杆很亮眼。但它也制造依赖。系统集成商、咨询公司、硬件伙伴和云渠道可以加速销售，同时也会遮蔽：哪部分价值归
              Multiverse、哪部分利润留在别处、续约风险最终由谁承担。Series C
              的扩张计划加深了这道难题，因为公司想同时从西班牙和欧洲走向多个地理市场。若公司成功，伙伴杠杆会显得有远见；若不成功，公开记录可能继续产出联盟新闻，却缺少已签单转化、伙伴经济性、客户集中度或续约韧性的直接证据。在数十亿美元估值下，这个区别很关键。
