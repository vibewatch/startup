            body: >-
              很多私营 AI 初创公司几乎不公布价格，Multiverse 不同，它现在暴露了几条变现界面。在自助式 API 推进之前，管理层曾告诉 Crunchbase News，公司的主要收入来源是费用。此后，公司推出
              CompactifAI API 和 AWS Marketplace 分发，在企业部署工作之上增加了按 token 定价的用量收入。公开材料显示至少三条变现路径：按用量计费的自助 API
              推理、面向企业客户的私有端点和私有报价，以及在客户控制的环境中部署压缩模型，例如私有云、本地部署和边缘场景。API 页面和 AWS
              上架页有用，因为它们展示了命名模型的实际标价，而不只是模糊的“联系销售”。即便如此，标价不等于实现价格。私有报价和 AWS Startups 折扣的存在意味着，实际
