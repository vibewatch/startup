  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - UiPath
        - $7.79B 市值 / 2026 财年收入 $1.611B
        - ~4.8x 收入
        - 可作为自动化和企业治理基准，且公开利润改善可见。
        - 规模更大、更成熟，披露远多于 Multiverse。
      - - C3 AI
        - $1.58B 市值 / 2026 财年收入 $250.3M
        - ~6.3x 收入
        - 可作为纯企业 AI 软件参照，尤其适合仍在证明规模的公司。
        - 增长画像弱得多，产品范围也不同。
      - - GitLab
        - $6.58B 市值 / 2026 财年 ARR >$1B
        - ~6.6x ARR 视角
        - 可作为开发者平台和治理导向软件参照。
        - DevSecOps 平台不是直接的 AI 效率可比对象。
      - - Datadog
        - $83.99B 市值 / 2026 财年收入指引 $4.45B-$4.47B
        - ~18.8x 收入
        - 显示市场会给品类领先、高增长基础设施平台多高溢价。
        - Datadog 规模大得多、嵌入更深，也更分散。
      - - Hugging Face
        - 2023 年私募估值 $4.5B
        - 据报道当时 >100x 年化收入
        - 可作为开放 AI 平台基准和分发生态参照。
        - 轮次日期已旧，生态触达规模也完全不同。
      - - Dataiku
        - $3.7B，截至 2026 年 8 月最后确认的私募估值
        - 私募估值参照
        - 可作为企业 AI 平台可比对象，且欧洲软件身份很强。
        - 老股 / 私募数据不如公开市场价格稳健。
      - - Mistral AI
        - 传闻 2026 年估值约 €20B / $23.15B
        - 前沿主权模型溢价
        - 可作为欧洲主权 AI 热情的上限参照。
        - 基础模型龙头；不是一一对应的基础设施倍数。
    notes: 这组可比公司只用于框定估值视角，不主张倍数可以精确一一对应。
    enumerationScope:
      coverage: partial
      basis: >-
        The table enumerates the most decision-relevant public and private reference points retained in this run, but it
        does not cover every possible AI software, cloud, or infrastructure comparable in the market.
