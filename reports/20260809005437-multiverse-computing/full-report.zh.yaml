      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              可能的买方地图是多边的。在企业里，买方通常是基础设施、CTO、平台或安全负责人，而不是孤立的业务线预算。用户是开发者、ML
              工程师和运营团队，他们需要模型在真实硬件上运行，同时满足延迟、隐私或连接约束。在公共部门和受监管行业，付款方可能是主权算力或数字化转型预算，它们关心推理发生在哪里，不亚于关心原始模型质量。采用路径也比消费者 AI
              故事暗示的更偏运营：团队先找出云成本、延迟或隐私很痛的工作负载；再基准测试压缩模型；接着接入现有框架或数据中心栈；可靠性被证明后再扩展。这很重要，因为 Multiverse
              最好的早期行业——制造、能源、电信、航空航天、金融和政府邻近用例——正是部署摩擦很高，但本地高效 AI 回报可能很实在的场景。
