  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面：从压缩引擎到多界面交付栈
        blocks:
          - type: paragraph
            body: >-
              从客户工作流看，Multiverse 不再只销售一个抽象压缩算法。它现在暴露了几个具体产品界面，对应不同买方需求：CompactifAI 是底层压缩器；CompactifAI API
              提供托管推理；部署选项覆盖客户自有云、本地部署和边缘环境；CompactifAI App 面向可离线移动和现场使用；HyperNova、LittleLamb 等开源模型发布在 Hugging Face
              上；Foundry 则是更宽的 AI 工厂控制平面愿景。这很重要，因为不同界面的产品成熟度差异很大。部署目录和 API
              已经具体且有文档。该应用真实存在且可下载，但价值主张取决于设备能力和路由行为。开源模型界面带来了外部开发者触点。Foundry
              则具有战略重要性，但明显更早期。整体图景是一家公司正在试图把“模型压缩”这个核心技术能力，变成覆盖开发者、企业、主权部署和未来基础设施运营方的产品组合。
