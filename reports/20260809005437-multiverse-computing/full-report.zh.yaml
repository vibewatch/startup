      - number: '8.5'
        title: 退出准备度和最终尽调清单确认，下一批能改变决策的事实是经济指标，不是叙事
        blocks:
          - type: paragraph
            body: >-
              从现在看，最现实的退出路径是再来一轮大型私募融资，或在更多经济证据出现后被战略收购。若按近期 IPO 式准备度标准，公司需要在
              ARR、收入质量、毛利率、客户集中度、续约行为、董事会和治理成熟度，以及可能更完整的信任 /
              合规材料包上，拿出干净得多的公开记录。这个门槛目前还看不到。所有这些并不意味着公司弱，而是说明公司仍在从高信念私有叙事跨向证据丰富的公开市场质量。如果增长声称背后是真实经常性经济性，这座桥可以很快跨过。最终尽调清单因此很直接：拿到收入基数、增长质量、价格兑现、伙伴经济性、留存、集中度、优先清算栈，以及
              AI Act / 合规证据。如果这些反馈强，估值讨论会实质改变。如果不强，当前价格看起来就会像故事高峰时的标记，而不是耐久入场点。简言之，公司仍能用业绩挣回估值，但举证责任现在落在经济性和执行上。
