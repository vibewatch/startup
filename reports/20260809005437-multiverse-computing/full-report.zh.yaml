  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 关键假设
      - 估值逻辑
      - 参考估值
    rows:
      - - 乐观
        - 有可能，但尚非基准情景
        - Multiverse 把超高增长转化为 $220M-$300M 的可持续 ARR / 收入，守住强毛利，并扩展成真正的主权 AI 平台。
        - 对具稀缺价值的高增长基础设施资产给予 10x-12x 软件 / 平台倍数。
        - $2.2B-$3.6B
      - - 基准
        - 最符合当前公开证据
        - 公司成为有价值但更窄的 AI 基础设施供应商，ARR / 收入达到 $90M-$150M，平台挂载适中。
        - 对快速增长但非主导的软件基础设施业务给予 6x-8x 倍数。
        - $0.54B-$1.2B
      - - 悲观
        - 如果证据缺口持续存在，就会成真
        - 增长放缓，伙伴驱动 GTM 的耐久性不及预期，主权 / 效率溢价在既有厂商竞争下被压缩。
        - 对 $40M-$70M 收入或 ARR、置信度较弱的业务给予 4x-6x 倍数。
        - $0.16B-$0.42B
      - - 当前估值
        - 已被计入
        - 投资者实际上承销的结果更接近乐观情景，而不是基准情景。
        - Series C 的当前投后估值。
        - $2.3B
    notes: 情景数值是方向性承销区间，不是管理层指引或目标价。
