  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点成立，但反论点同样成立：公开经济指标仍落后于叙事
        blocks:
          - type: paragraph
            body: >-
              Multiverse 的多头论据比普通私有 AI 初创公司更强。它不是一个没有商业验证的匿名模型包装层。公司完成了欧洲最大 AI 基础设施融资之一，称其目前在 10 个行业拥有 100 多家客户，公开了实际
              API 和市场价格，并能指向一个差异化的主权 AI 故事，契合欧洲政策和企业需求。增长信号也异常强：公司称年化收入较 Series B 以来增长超过 10 倍，2026 年 Q1 销售额同比增长 96
              倍。这些都是严肃的正面因素。反论点在于，价格比公开记录更苛刻。最后一个清晰可见的销售代理指标，仍是 Fortune 转发说明中预测 2025 年销售额只有约 $25 million；本轮没有任何公开材料披露
              ARR、已订收入、毛利率、烧钱速度、现金余额、客户集中度或优先清算栈。这意味着投资人可以相信公司具有战略重要性，同时仍然认定当前定价依赖于公开记录还无法确认的假设。因此，核心估值问题不是 Multiverse
              是否重要，而是当前价格是否已经把太多上行空间资本化。
