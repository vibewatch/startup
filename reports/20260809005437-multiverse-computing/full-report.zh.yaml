      - number: '8.4'
        title: 情景分析仍指向跟踪，因为当前价格像早期多头情景
        blocks:
          - type: paragraph
            body: >-
              情景分析比虚假的精确更诚实。多头情景下，Multiverse 维持超常增长，把主权 AI 和压缩故事做成更宽的基础设施平台，达到约 $220 million 到 $300 million ARR
              或收入，同时保持高毛利和真实续约质量。在那个世界，10x 到 12x 倍数可以支撑甚至超过当前标记。基准情景下，公司成为有价值但更窄的 AI 基础设施供应商，也许达到 $90 million 到 $150
              million ARR 或收入，合理倍数为 6x 到
              8x。这个区间支撑有意义的价值，但仍低于当前投后估值。熊市情景下，公司技术上真实，商业上却更偏小众，收入仍低于支撑独角兽以上基础设施溢价所需水平。该情景会导向平轮或下轮。由于当前 $2.3 billion
              价格更接近多头而非基准情景，建议不能是买入。但技术、需求信号和政策顺风都是真实的，也不该轻率否定。跟踪是最符合证据的判断。
