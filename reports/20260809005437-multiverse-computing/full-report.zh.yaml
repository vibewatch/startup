              还补充说，公司此前每年收入都翻倍以上；Multiverse 转发的一篇 Fortune 人物稿则称，预计 2025 年销售额约 $25
              million。这些信号说明业务不是收入前状态，并且增长可能正从较小基数上陡峭抬升。公司还表示服务超过 100 家客户；按 2025 年中到 2026 年中的披露，员工约 160
              人。但披露缺口仍是决定性问题：没有 ARR、没有已签收入、没有毛利率、没有烧钱速度、没有现金余额、没有 NRR、没有客户集中度，也没有合同期限数据。TechCrunch 2026 年 3
