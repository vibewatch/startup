        - 买方无需采用专门压缩器，也有便利替代方案
      - - 借助 ONNX / Google / Azure 内部自建
        - 打包进既有云或工程预算
        - 随更大合同而变化
        - 运行时、应用工厂、端侧栈
        - 纸面上可能更便宜，因为支出藏在既有平台预算里
