companyProfile:
  summary: >-
    Multiverse Computing 是一家总部位于 San Sebastián 的量子启发式 AI 公司，由 Enrique Lizaso、Román Orús、Samuel Mugel 和 Alfonso Rubio 于
    2019 年创立。公司旗舰产品 CompactifAI 将量子物理中的张量网络技术用于压缩大语言模型，让模型能以更低成本运行，并适配更多主权部署环境。Multiverse 目前通过
    API、私有部署和合作伙伴主导的企业渠道销售；2026 年 7 月宣布 $570M Series C 轮，隐含投后估值约 $2.3B。
  foundedDate: '2019-01-01'
