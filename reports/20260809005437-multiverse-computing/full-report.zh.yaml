      - number: '2.4'
        title: 增长驱动、监管与约束
        blocks:
          - type: paragraph
            body: >-
              增长逻辑靠几股力量同时汇合：GPU 短缺、能源和数据中心成本上升、低延迟需求增强、隐私和本地化要求更强，以及欧洲政策环境越来越把 AI 基础设施视为主权问题。EU AI Act
              和欧委会配套倡议并不会直接要求购买模型压缩供应商，但它们明显偏好有文档、可控、可信的部署模式，也让“全部发到一个云端点”不再是放之四海而皆准的答案。与此同时，市场摩擦并不小。Moody’s 认为，AI
              资本开支上涨快于应用收入，价值捕获在行业间并不均匀，集成成本仍然很高。独立产品报道也呼应了这一点：哪怕有前景的本地 AI
              工具，在实践中仍会撞上硬件限制。因此，需求信号很强，但通向大范围变现的路被合规复杂度、既有平台力量，以及围绕 ROI 和运营适配的证明负担卡住。
