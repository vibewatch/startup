  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资、资本底盘与新资金用途
        blocks:
          - type: paragraph
            body: >-
              2024 到 2026 年，Multiverse 的融资画像变化很大。公司在 2024 年 3 月宣布超额认购的 €25 million Series A，2025 年 6 月宣布 $215 million
              Series B，2026 年 7 月又以 $1.7 billion 投前估值完成 $570 million Series C，隐含约 $2.3 billion 投后估值。对一家欧洲私营 AI
              基础设施公司来说，这是很大的资本底盘，应该给管理层留下提前投入、等待收入兑现的空间。公开披露也显示，公司希望投资人相信这笔钱会投向哪里：扩展压缩模型库、资助研发、投入主权 AI
              基础设施和软件，并在东亚、东南亚、中东、加拿大和美国布局。因此，融资故事不只是“更长现金跑道”，而是公司从专门压缩供应商转向更宽基础设施栈的过渡，这同时抬高了机会和资本消耗风险。
