      - number: '5.5'
        title: 信任、合规与产品风险
        blocks:
          - type: paragraph
            body: >-
              信任故事在主权和本地控制重要的场景中最强。公开材料反复强调，模型可以在客户自有云、本地部署或设备端运行，这有助于隐私、数据驻留和低连接环境运行。综合管理政策也显示出一定运营成熟度，并明确关注监管、合同和环境义务。但强调控制的定位与外部验证过的信任姿态之间仍有缺口。在已审阅来源中，Multiverse
              并没有像许多企业软件买方期待的那样公开突出 SOC 2 或 ISO 27001 认证，伦理和安全页面也远不如产品和基准页面具体。还有一些现实产品风险：设备资源不足时，离线应用 会回退到云端；最有野心的
              Foundry 界面仍未发布；核心性能主张仍高度依赖公司撰写的测试条件。结果是一套技术上有前景、且对买方真实有用的技术栈，但它仍需要在安全、可靠性和部署成熟度上接受买方逐案验证。
