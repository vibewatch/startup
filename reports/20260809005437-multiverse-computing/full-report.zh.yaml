  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR / 收入基数
        - 按产品线拆分的当前 ARR 或过去十二个月收入
        - 当前估值对真实收入分母极其敏感
        - 管理层财务包 / 董事会材料
      - - 毛利率和烧钱速度
        - 按收入流拆分的毛利率、现金余额、烧钱速度和现金跑道
        - 用于判断资本效率和下行保护
        - 财务数据室和最新管理账
      - - 客户质量
        - 头部客户集中度、NRR / GRR、合同期限和续约
        - 广度可见，耐久性不可见
        - CRO / 客户成功分析
      - - 伙伴经济性
        - 直接收入 vs 伙伴来源收入、挂载率，以及与 EY / PwC / Inetum / 渠道伙伴的利润分成
        - 缺少经济归属数据时，联盟质量容易被高估
        - 销售运营 / 伙伴团队复核
      - - 股权结构表和优先权
        - Series C 优先股堆叠、按比例跟投权、投资者保护，以及任何老股 / 流动性安排
        - 入场价格取决于普通股等价经济性到底是什么样
        - 法务 / 融资文件
      - - 合规与信任
        - 按部署模式拆分的 AI Act 角色分类、客户安全资料包、日志与监督控制，以及处理方治理
        - 主权 AI 溢价靠可审计控制撑住，而不只是定位
        - 安全、法务和产品治理工作流
    notes: 这些问题优先指向最能撬动估值的缺失数据，而不是泛泛的公司兴趣问题。
    claimRefs:
