      - number: '8.2'
        title: 融资背景和入场纪律提示谨慎，因为公司如今按规模定价，而不是按潜力定价
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月 Series C 改变了承销框架。按 $1.7 billion 投前、约 $2.3 billion 投后估值看，Multiverse
              不再是一个便宜出售可选性的古怪量子启发式专家，而是被定价为高效 AI
              基础设施里的品类竞争者。只有三件事同时成立，这个价格才说得通：第一，增长声称代表可持续商业现实，而不是小基数跳升；第二，公司的主权和效率定位能顶住超大云厂商和捆绑式存量工具的竞争；第三，公司能把伙伴密集的需求转化成独立的经常性经济性。公开证据没有推翻这些条件，但也没有证明它们。因此，入场纪律比公司质量本身更重要。如果实际收入基数仍在数千万美元，当前投后估值即便按软件标准也偏激进。如果真实年化基数已经高出许多，投资理由会迅速改善。缺失变量太重要，正确姿态不是夸大精确度。投资人应把当前定价视作偏多头、仍需更多证据的标记，而不是被干净支撑的公允价值。
