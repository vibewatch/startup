    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、版图与战略逻辑
        blocks:
          - type: paragraph
            body: >-
              Multiverse Computing 把自己定位为一家西班牙的高效 AI 公司，根在量子和量子启发式软件。公司公开材料和独立报道都一致把总部放在 Donostia–San Sebastián，并描述其
              2019 年前后创立：早期先做量子和优化工具，后来把 CompactifAI 扩展成主要商业引擎。实质逻辑不是“量子硬件”，而是把量子物理中的张量网络数学用于压缩和编排 AI 工作负载。到 2026
              年，其身份叙事已经从压缩供应商扩大为主权 AI
              平台，可在云、本地和边缘设备之间路由工作负载。这个定位对尽调很关键，因为公司卖的不只是降本，也包括地缘政治和治理收益：企业和政府能让模型和数据更靠近本土，减少对超大规模云厂商的完全依赖，并在断网或资源受限场景部署
              AI。
