  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 增长
        - 官方材料称，自 Series B 以来年化收入增长 >10x，Q1 2026 销售额同比增长 96x。
        - 小基数上的超高增长，仍可能对应一个过高估值。
        - 披露当前 ARR / 收入基数和毛利率画像。
      - - 商业证明
        - 100+ 客户、具名账户和伙伴牵引显示需求真实存在。
        - 公开证据更能说明覆盖广度，尚不能说明收入质量、留存或集中度。
        - 展示续约队列、头部客户敞口，以及伙伴来源收入 vs 直接收入。
      - - 变现
        - API 定价、私有端点和 AWS 分发给出清晰收入面。
        - 标价和折扣看不出实际 ASP 或利润率。
        - 提供实际成交价格、折扣和服务收入组合数据。
      - - 战略切入点
        - 主权 AI 和高效 AI 是欧洲真实需求主题。
        - 超大规模云厂商的主权云和既有优化堆栈，会压缩独立供应商可拿到的溢价。
        - 展示相对既有工具链和主权云替代方案的胜率。
      - - 平台上行
        - Foundry 和更宽的基础设施野心，能把范围扩出模型压缩。
        - 路线图越宽，执行风险越高，也可能在运营证据出现前提前拉高估值。
        - 展示 Foundry GA 里程碑，以及与真实客户工作负载的绑定。
      - - 当前价格
        - $2.3B 投后估值仍低于最知名的前沿 / 私有 AI 平台。
        - 如果 Multiverse 的可持续收入基数远小于这些同业，估值仍可能偏高。
        - 证明收入基数已经足够大，能支撑溢价倍数。
    notes: 反向逻辑不是说 Multiverse 公司弱，而是当前价格可能跑在公开证据前面。
