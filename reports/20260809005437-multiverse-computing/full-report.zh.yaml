  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 依据
      - 决策含义
    rows:
      - - 投资建议
        - 观察
        - 战略质量真实存在，但公开经济数据缺口太大，无法支持按当前价格买入。
        - 密切跟踪；承销当前估值前，必须看到更强证据。
      - - 置信度
        - 中
        - 融资、增长口径、客户、定价面和风险因素都可见，但收入基数和单位经济性仍不可见。
        - 只能形成方向性判断，不要制造虚假的精确度。
      - - 风险评级
        - 高
        - 当前估值要求持续超高增长、平台扩张和受监管企业转化同时跑通。
        - 对执行和披露风险给出实质折价。
      - - 估值立场
        - 偏高
        - 当前投后估值在乐观情景下更容易解释，基准情景下更吃力。
        - 新数据补上证据缺口前，不假设上行空间。
      - - 入场纪律
        - 只在价格敏感时参与
        - 按当前估值，投资者买的是未来证据，不只是现有证明。
        - 要求硬经济数据尽调，或显著更好的入场条款。
    notes: 本摘要刻意保持价格敏感；评估的是当前估值，而不是抽象意义上的公司质量。
