      - number: '5.4'
        title: 开发者生态、开放发布与路线图成熟度
        blocks:
          - type: paragraph
            body: >-
              Multiverse 显然已经决定，开放和面向开发者的分发是产品战略的一部分，而不是副作用。Hugging Face 组织已验证、活跃，并公开列出多个模型家族，包括
              LittleLamb、HyperNova、Pulsar 变体和配套资产。LittleLamb 尤其重要，因为它显示公司正在把压缩模型推向边缘和智能体用例，并提供明确的快速上手指引、Apache 2.0
              许可，以及面向 Transformers、vLLM 和 SGLang 等框架的说明。HyperNova 展示了互补的高端路线：更大、智能体化、会用工具的模型，并持续迭代基准表现。GitHub
              也作为一个公开信号存在，但代码库界面仍较小，因此生态看起来是在形成中，而不是已经根深蒂固。就路线图成熟度而言，2026 年最具体的发布是 HyperNova 2602/2605、App、LittleLamb 和
              Intel 部署更新。Foundry 另成一类，因为它用雄心很大的控制平面语言营销，但仍被标注为“即将推出”，因此是路线图对象，而不是成熟产品线。
