      - number: '8.3'
        title: 可比框架显示，只靠头部品类标签不足以支撑当前价格
        blocks:
          - type: paragraph
            body: >-
              这里最好的公开可比方法不是找一个完美对标，而是搭一套分层框架。公开软件组提供纪律：UiPath、C3 AI、GitLab 和 Datadog 显示，在披露远比 Multiverse
              充分的情况下，市场目前愿意为自动化、AI 软件、开发者平台和高增长基础设施业务支付什么价格。私有公司组提供品类语境：Hugging Face、Dataiku 和 Mistral
              显示，当生态广度或前沿相关性足够明确时，AI 平台和基础模型公司可以拿到数十亿美元估值。Multiverse 站在两者之间。它比普通软件厂商更具战略差异化，也比许多公开可比公司有更强的主权 AI
              切入口。但相比更知名的私有头部公司，它披露更少，平台嵌入也更浅。因此，可比公司不能支持简单结论。它们说明当前估值按行业标准并非荒唐，但也说明投资人已经为大量未来规模买单。按原始可比逻辑，Multiverse
