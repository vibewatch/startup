        title: 快照判断与未决尽调问题
        blocks:
          - type: paragraph
            body: >-
              截至本次报告日，Multiverse 看起来是一家志向很高、资本充足的欧洲 AI
              基础设施公司，并且与能源效率和主权部署两条主题高度同频。乐观情景很容易讲清楚：可触摸的模型压缩技术、强资本底盘、清晰的公共部门同频、标杆客户，以及压缩模型为什么有经济价值的可信解释。悲观情景也同样清楚。公开披露没有给出经审计收入、ARR、利润率、详细股权结构或完整董事会治理细节。TechCrunch
              等独立报道也指出，本地 AI
              叙事仍有硬件和采用层面的限制：旧设备会回退到云端路由，早期消费者采用规模仍小。因此，尽调重心落在执行和验证上：基准结果能否反复复现，面对更大平台厂商时护城河能守多久，以及估值有多少由运营实质支撑、而不是靠动量和主权
