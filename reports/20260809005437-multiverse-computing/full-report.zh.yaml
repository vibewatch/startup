            body: >-
              产品章节显示出真正的广度：API 分发、压缩后的开放模型、Intel
              基准宣传、路由逻辑，以及不断扩展的端侧和边缘叙事。风险章节必须追问：证据有没有跟上这个野心？还没有完全跟上。积极面足够清楚：已有具体基准声称、现场演示和越来越多伙伴验证。负面是，最强基准证据仍相对狭窄，而且常常绑定公司或伙伴撰写的发布材料。TechCrunch
              2026 年 3 月报道也重要，因为它暴露了一个现实限制：旧设备可能回退到云 API，所以本地 / 离线叙事并不普适。Foundry
              又增加了一层执行。这个页面在战略上有吸引力，但「即将推出」意味着治理和编排控制平面仍处路线图阶段，还不是成熟的通用可用产品。公开治理材料同样只讲了部分故事。公司有隐私和法律页面，也有质量 /
              环境政策，但本轮没有看到专门信任中心、公开事故历史、系统级 AI Act 分类材料包，或深入的第三方安全保证集合。这些都不能证明公司薄弱；但确实意味着举证责任已经从产品叙事转向运营证据。
