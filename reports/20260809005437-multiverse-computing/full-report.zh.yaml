      - number: '2.5'
        title: 市场判断与剩余尽调问题
        blocks:
          - type: paragraph
            body: >-
              这个市场足够有吸引力，可以支撑大额融资，但边界还不够清晰，无法自然推出 Multiverse 最终能拿多少份额。投资逻辑最强的部分是定性，而不是纯数字：企业和政府确实有理由想要高效且主权可控的
              AI，推理成本压力叠加欧洲政策支持，也为采用提供了可信背景。最弱的部分在于，公开记录没有隔离出一个可靠的、面向独立压缩和路由供应商的可服务市场，也没有显示这类供应商在芯片、模型和云厂商继续改进自家优化工具时还能保留多少定价权。换句话说，机会是真实的，但问题是
              Multiverse 会成为这个机会里的控制点平台，还是留在一个快速商品化技术栈中的高性能工具。这一问题会直接传导到竞争、客户和估值。
