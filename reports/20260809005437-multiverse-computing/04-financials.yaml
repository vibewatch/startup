    {
      "id": "traction-and-disclosure-quality",
      "title": "Traction Signals Versus What Still Is Not Public",
      "body": "Public traction signals are directionally positive but still incomplete. The Series C materials claim more than 10x annualized revenue growth since the Series B and 96x year-over-year sales growth in Q1 2026. Crunchbase News adds that the company had been more than doubling revenue each year, while a Fortune profile reposted by Multiverse said predicted 2025 sales were about $25 million. Those signals suggest the business is not pre-revenue and that growth could be very steep from a relatively small base. The company also says it serves more than 100 customers and, by mid-2025 to mid-2026 disclosures, employed roughly 160 people. But the disclosure gaps remain decisive: no ARR, no booked revenue, no gross margin, no burn, no cash balance, no NRR, no customer concentration, and no contract-duration data. TechCrunch’s March 2026 piece is also a useful corrective because it showed the consumer app had fewer than 5,000 monthly downloads and was not ready for mass adoption, reinforcing that the investment case is enterprise infrastructure rather than consumer software traction.",
