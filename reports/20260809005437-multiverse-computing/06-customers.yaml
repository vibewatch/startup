        "FU004"
      ]
    },
    {
      "id": "customer-verdict",
      "title": "Customer Verdict",
      "body": "Multiverse has enough public customer evidence to clear the “is there real enterprise demand?” bar. The named-account set is credible, the vertical spread is broad, the partner network is serious, and the use cases map well to sovereignty-sensitive and cost-sensitive deployments where CompactifAI’s value proposition should resonate. What it has not yet cleared publicly is the harder bar of durable customer economics. The available evidence favors breadth over depth, ecosystem reach over cohort transparency, and impressive logos over measurable retention. For underwriting purposes, that means customer risk is moderate rather than extreme: the company is not searching for its first real users, but investors still need data-room proof on who pays, who expands, who renews, and how dependent the company is on a small number of direct or partner-mediated accounts. In short, the adoption story is promising and commercially relevant, but the durability story remains only partially public.",
      "claimRefs": [
        "CU001",
        "CU003",
        "CU015",
        "CU019",
        "CU021",
