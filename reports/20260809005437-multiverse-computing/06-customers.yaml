    {
      "id": "named-proof-and-deployments",
      "title": "Named Proof and What It Actually Proves",
      "body": "The quality of customer proof varies by account. At the strongest end, Multiverse has repeated, multi-source official mentions of customers such as Bosch, Iberdrola, and the Bank of Canada, plus a concrete Telefónica quote about energy savings on network deployments and a Luzia CTO quote describing more than 50% model-footprint reduction with lower latency and cost. Official Series C materials also say Multiverse models are already deployed across millions of devices and systems, including drones, cameras, satellites, vehicles, and telecom infrastructure. That is meaningful breadth. But public evidence is still uneven. Many names appear in funding announcements or partner releases without the exact commercial terms, production scope, or duration of the deployment. Other organizations—PwC, EY, Inetum, BeeAPro, and Arsys—are best understood as channel, co-development, or implementation proof rather than straightforward direct-customer proof. This does not make the demand story weak; it means investors should distinguish between named logos, production customers, channel multipliers, and ecosystem validators.",
      "claimRefs": [
        "CU003",
        "CU004",
        "CU005",
        "CU014",
