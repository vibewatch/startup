    {
      "id": "durability-and-concentration-gaps",
      "title": "Durability, Retention, and Concentration Gaps",
      "body": "The biggest gap in this chapter is not whether Multiverse has customers. It clearly does. The problem is that public sources do not show enough about the quality of those customer relationships. There is no public NRR or GRR, no churn rate, no contract-duration data, no top-customer revenue share, and no denominator behind the headline of 100-plus customers. It is not even always clear which named organizations are direct paying customers, which are active pilots, and which are partners facilitating deployment to end customers. This matters because a company can show impressive logo breadth while still being revenue-concentrated, pilot-heavy, or dependent on a few channel relationships. TechCrunch’s observation that the consumer app had fewer than 5,000 downloads also reinforces that end-user volume is not the proof point here; enterprise durability is. The chapter therefore has to treat retention and concentration as unresolved diligence items, not solved facts.",
      "claimRefs": [
        "CU014",
        "CU016",
        "CU019",
        "CU020",
        "CU026",
