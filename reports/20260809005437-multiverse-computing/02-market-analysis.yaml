  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Multiverse Computing sells into a layered market spanning AI inference optimization, edge AI deployment, and sovereign AI infrastructure rather than the entire generative-AI value chain. Public evidence supports large demand pools and strong regulatory/policy tailwinds, but precise SAM/SOM boundaries remain fuzzy because incumbents such as NVIDIA, Intel, Qualcomm, and hyperscalers already cover part of the same job."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market Boundary and Status-Quo Alternatives",
      "body": "The relevant market for Multiverse is narrower than “AI” and broader than “compression software.” The company’s own materials describe a job to be done that combines inference efficiency, model compression, routing, and deployment across cloud, on-premises, and edge environments. That puts Multiverse inside the applied AI-inference layer rather than the frontier-model training layer. It also means the primary alternatives are not just direct startups. Buyers can continue sending workloads to hyperscalers, keep using full-size models on expensive hardware, or rely on incumbent optimization stacks from chip and platform vendors. The market boundary therefore includes software and tooling that lower cost-per-token, reduce memory and power requirements, and preserve privacy or offline operation, while excluding generic cloud infrastructure, foundational model creation, and undifferentiated consulting services. This boundary matters because it makes the serviceable market more concrete, but also exposes Multiverse to more substitute pressure than a broad AI-TAM story suggests.",
      "claimRefs": [
