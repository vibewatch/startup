    {
      "id": "switching-cost-moat-and-risk",
      "title": "Switching Cost, Multi-Homing, and Moat Durability",
      "body": "The durability question is mixed. Multi-homing is possible early because many buyers already work in interoperable ecosystems such as PyTorch, ONNX, Hugging Face, and Qualcomm/NVIDIA/Intel toolchains. That gives Multiverse room to enter evaluation cycles. But once a team commits to a hardware-specific or cloud-specific inference path, switching cost rises because tuning, governance, monitoring, and procurement all become embedded. This cuts both ways. It means incumbents can be sticky, but it also means a vendor that wins a narrow but important workflow can expand from there. The moat is therefore likely moderate, not absolute. It depends on whether Multiverse can keep a measurable advantage on compression efficiency, privacy-friendly deployment, and sovereign-operating-stack integration faster than larger vendors can bundle or replicate similar outcomes. The strategic threat is not only direct rivalry; it is the possibility that optimization becomes a standard checkbox inside much larger platforms.",
      "claimRefs": [
        "CP023",
