summary:
  headline: >-
    Track: Multiverse is one of Europe’s more credible sovereign-AI infrastructure stories, but the current $2.3B
    post-money valuation still looks stretched relative to the public economic proof available today.
  overallScore: 6.8
  recommendation: track
  confidence: medium
