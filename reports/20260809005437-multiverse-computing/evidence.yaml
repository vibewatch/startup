evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance-board
    missingEvidence: A board roster with committees, independent directors, and observer rights tied to later financing rounds.
    whyItMatters: Key-person dependence and shareholder influence cannot be judged well without seeing formal governance structure.
    diligencePath: Request the latest board deck, cap table, and governance chart from management.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: cap-table
    missingEvidence: Exact ownership percentages, preference stack, and pro-rata rights for founders, SETT, and later-stage investors.
    whyItMatters: The size and terms of public and strategic ownership affect control, dilution, and refresh risk in future rounds.
    diligencePath: Obtain the latest cap table and term sheets for Series B and Series C.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      A fuller log of internal product launches, governance changes, and smaller partnerships not highlighted in
      headline releases.
    whyItMatters: The public chronology likely overweights financings and PR moments relative to operating milestones.
    diligencePath: Ask management for an internal company timeline covering product, customers, hires, and regulatory events.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or investor-level operating metrics including ARR, gross margin, burn, runway, and debt facilities.
    whyItMatters: Without unit-economics and liquidity detail, the valuation cannot be stress-tested against operating fundamentals.
    diligencePath: Request audited financial statements, KPI dashboards, and debt schedules.
    relatedQuestionRefs:
      - QO022
      - QO023
  - type: conflicting-data
    severity: material
    topic: public-funding
    missingEvidence: >-
      A source that reconciles the March 2025 €67M state co-investment announcement with Lizaso’s later round-by-round
      SETT figures.
    whyItMatters: >-
      Investors need to know whether the difference reflects commitment timing, different vehicles, or a genuine
      inconsistency.
    diligencePath: Ask management and SETT for a round-by-round breakdown of cash invested, committed, and converted into equity.
    relatedQuestionRefs:
      - QO021
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: A precise current company-wide headcount and geographic split as of August 2026.
    whyItMatters: >-
      Rapid office expansion is clear, but exact staffing is still fuzzy and affects burn and execution capacity
      estimates.
    diligencePath: Request current HR census by office and function.
    relatedQuestionRefs:
      - QO012
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: >-
      A source-based model that isolates a true serviceable market for standalone AI model-compression vendors rather
      than broad edge-AI or inference categories.
    whyItMatters: >-
      A broad category TAM does not tell investors how much of the spend a company like Multiverse can realistically
      monetize.
    diligencePath: >-
      Build a bottom-up SAM using buyer segments, deployment counts, expected pricing, and attach rates from management
      and customer interviews.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public pricing or commercial packaging for enterprise model-compression platforms comparable to Multiverse.
    whyItMatters: >-
      Without pricing evidence, it is hard to translate technical relevance into revenue potential or estimate payback
      thresholds.
    diligencePath: Collect customer quotes, marketplace listings, or procurement records and ask management for pricing architecture.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: >-
      A reconciled explanation for why adjacent 2026 edge-AI estimates vary so widely across publishers and scope
      definitions.
    whyItMatters: Using the wrong denominator can overstate or understate Multiverse’s opportunity by a large amount.
    diligencePath: >-
      Normalize retained market reports by included segments, geography, and whether they bundle hardware with
      software/services.
