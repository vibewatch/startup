  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Incumbents, Adjacent Platforms, and Status Quo'
        blocks:
          - type: paragraph
            body: >-
              The competitor set is structurally broad. Buyers can solve the same job through chip-vendor optimization
              stacks, managed cloud AI platforms, open-source tooling layered on existing frameworks, or a specialist
              like Multiverse. That means the company’s “competition” is not just other model-compression startups.
              NVIDIA, Intel, and Qualcomm already ship optimization and deployment surfaces that sit close to the
              hardware and are embedded in broader infrastructure decisions. Microsoft and Google wrap optimization
              inside broader application and governance platforms. Hugging Face and ONNX Runtime enable internal-build
              paths that reduce the need for a standalone vendor altogether. Neural Magic’s transition after its Red Hat
              acquisition also shows that efficiency tooling can be absorbed into larger platforms. The key consequence
              is that Multiverse wins only when its compression-quality tradeoff and sovereignty value proposition
              exceed the convenience of bundled alternatives.
            claimRefs:
