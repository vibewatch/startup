      - number: '1.5'
        title: Snapshot Judgment and Open Diligence Questions
        blocks:
          - type: paragraph
            body: >-
              As of the run date, Multiverse looks like a high-ambition, well-capitalized European AI infrastructure
              company with unusually strong alignment to the themes of energy efficiency and sovereign deployment. The
              bullish case is easy to articulate: tangible model-compression technology, a strong capital base, visible
              public-sector alignment, marquee logos, and a credible explanation for why compressed models matter
              economically. The bear case is also clear. Public disclosures do not provide audited revenue, ARR,
              margins, detailed cap-table ownership, or full board governance detail. Independent coverage such as
              TechCrunch also points out that the local-AI narrative still has hardware and adoption caveats, with older
              devices falling back to cloud routing and early consumer uptake remaining small. The diligence center of
              gravity therefore sits on execution and verification: how repeatable are the benchmarks, how durable is
              the moat against larger platform vendors, and how much of the valuation is backed by operating substance
              rather than momentum and sovereign-AI enthusiasm?
