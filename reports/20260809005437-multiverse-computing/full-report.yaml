      - number: '8.4'
        title: Scenario analysis still points to track because the current price behaves like an early bull case
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is more honest than false precision. In the bull case, Multiverse sustains extraordinary
              growth, turns its sovereign-AI and compression story into a broader infrastructure platform, and reaches
              something like $220 million to $300 million of ARR or revenue with high gross margins and real renewal
              quality. In that world, a 10x to 12x multiple can support or exceed the current mark. In the base case,
              the company becomes a valuable but narrower AI infrastructure supplier, reaches perhaps $90 million to
              $150 million of ARR or revenue, and deserves a 6x to 8x multiple. That range supports meaningful value,
              but still below the current post-money. In the bear case, the company proves technically real yet
              commercially more niche, with revenue still below the level required to sustain a unicorn-plus
              infrastructure premium. That scenario leads to a flat or down round. Because the current $2.3 billion
              price sits much closer to the bull than the base case, the recommendation cannot be buy. But because the
              technology, demand signals, and policy tailwinds are all real, it also should not be dismissive. Track is
              the most evidence-consistent call.
            claimRefs:
