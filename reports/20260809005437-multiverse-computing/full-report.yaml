  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - ARR / revenue base
        - Current ARR or trailing twelve-month revenue by product line
        - The current valuation is extremely sensitive to the actual revenue denominator
        - Management financial pack / board materials
      - - Gross margin and burn
        - Gross margin by stream, cash balance, burn, and runway
        - Needed to understand capital efficiency and downside protection
        - Finance data room and latest management accounts
      - - Customer quality
        - Top-customer concentration, NRR/GRR, contract duration, and renewals
        - Breadth is visible; durability is not
        - CRO / customer success analytics
      - - Partner economics
        - Direct vs partner-sourced revenue, attach rates, and margin sharing with EY/PwC/Inetum/channel partners
        - Alliance quality can be overstated without economic ownership data
        - Sales ops / partnership team review
      - - Cap table and preferences
        - Series C preference stack, pro rata, investor protections, and any secondary/liquidity dynamics
        - Entry price depends on what common-equivalent economics actually look like
        - Legal / financing docs
      - - Compliance and trust
        - >-
          AI Act role classification, customer security packets, logging and oversight controls, and processor
          governance by deployment mode
        - Sovereign-AI premium depends on auditable controls, not only positioning
        - Security, legal, and product governance workstream
    notes: >-
      These asks prioritize the missing data that most directly move valuation rather than general company-interest
      questions.
    claimRefs:
