      - number: '7.5'
        title: The right risk monitor is documentation, conversion, and repeatability—not more partnership headlines
        blocks:
          - type: paragraph
            body: >-
              Multiverse is not a broken story. The risk question is whether the next 12 to 18 months produce the
              artifacts that transform a strong narrative into an underwritable platform business. The first monitor is
              compliance specificity: investors should want system-level role classification, documentation, and
              governance evidence for regulated use cases rather than broad sovereignty marketing alone. The second is
              proof repeatability: benchmarks need to travel across more models, hardware targets, and real customer
              workflows so the company’s advantages look systemic instead of hand-selected. The third is commercial
              ownership: partner announcements should convert into clearer evidence on direct versus indirect revenue,
              renewal behavior, and concentration. The fourth is platform maturity: if Foundry becomes strategic, the
              company will need to show that governance, orchestration, and security controls are as real as the
              compression layer beneath them. The thesis can survive moderate delays in any one area, but it should
              weaken sharply if regulated buyers still require major exceptions, if hyperscaler sovereign offerings
              neutralize differentiation at similar cost, or if the company keeps expanding product scope faster than it
              expands public operating proof. Those are the practical kill criteria, and they are monitorable.
            claimRefs:
