  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue base disappoints
        - Current ARR/revenue is still in the low tens of millions without strong margin evidence
        - Makes the current post-money multiple difficult to defend
        - Treat current price as stretched and require reset or stronger terms
      - - Partner-led GTM lacks ownership
        - Direct versus indirect revenue, renewals, or concentration remain opaque after next diligence cycle
        - Turns growth headlines into lower-quality economics
        - Discount revenue quality and reduce platform-multiple assumptions
      - - Sovereignty wedge compresses
        - Hyperscaler sovereign cloud or incumbent stacks win key European accounts at similar TCO
        - Shrinks pricing power and strategic scarcity
        - Lower terminal multiple and longer path to exit premium
      - - Platform execution slips
        - Foundry remains roadmap-level without customer attachment or GA proof
        - Reduces platform-upside component embedded in current valuation
        - Value the company more as a compression vendor than as a broader infrastructure stack
      - - Compliance proof stays thin
        - No clearer AI Act/compliance packet or trust artifacts for regulated deployments
        - Slows enterprise procurement and weakens the sovereign premium
        - Extend sales-cycle assumptions and apply risk discount
    notes: Triggers are designed to show how operational misses flow directly into valuation compression.
    claimRefs:
      - CV028
      - CV030
