      - number: '2.4'
        title: Growth Drivers, Regulation, and Constraints
        blocks:
          - type: paragraph
            body: >-
              The growth case rests on several converging forces: GPU scarcity, rising energy and data-center costs,
              demand for lower latency, stronger privacy and localization requirements, and a policy climate in Europe
              that increasingly treats AI infrastructure as a sovereignty question. The EU AI Act and related Commission
              initiatives do not directly mandate buying a model-compression vendor, but they clearly favor documented,
              controllable, trustworthy deployment patterns and make “just send it all to one cloud endpoint” a less
              universal answer. At the same time, the market has meaningful frictions. Moody’s argues that AI capital
              expenditure is rising faster than application revenue, that value capture is uneven across sectors, and
              that integration costs remain high. Independent product reporting echoes that even promising local-AI
              tools still hit hardware limits in practice. So the demand signal is strong, but the route to widespread
              monetization is constrained by compliance complexity, incumbent platform power, and proof burdens around
              ROI and operational fit.
            claimRefs:
