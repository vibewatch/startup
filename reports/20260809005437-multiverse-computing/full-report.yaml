  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding, Capital Base, and the Uses of New Money
        blocks:
          - type: paragraph
            body: >-
              Multiverse’s financing profile changed dramatically between 2024 and 2026. The company announced an
              oversubscribed €25 million Series A in March 2024, a $215 million Series B in June 2025, and a $570
              million Series C in July 2026 at a $1.7 billion pre-money valuation, implying roughly a $2.3 billion
              post-money mark. That is a very large capital base for a European private AI infrastructure company and
              should give management room to invest ahead of revenue realization. Public disclosures also show what the
              company wants investors to believe the money is for: expanding the compressed-model library, funding R&D,
              investing in sovereign AI infrastructure and software, and building presence in East Asia, Southeast Asia,
              the Middle East, Canada, and the United States. The funding story is therefore not just “more runway.” It
              is a transition from a specialist compression vendor toward a broader infrastructure stack, which raises
              both opportunity and capital-consumption risk.
