      - number: '4.2'
        title: Revenue Model and Pricing Surfaces
        blocks:
          - type: paragraph
            body: >-
              Unlike many private AI startups that publish almost no pricing at all, Multiverse now exposes several
              monetization surfaces. Before the self-serve API push, management told Crunchbase News that the company’s
              primary revenue generator was fees. Since then it has launched CompactifAI API and AWS Marketplace
              distribution, adding token-priced usage revenue on top of enterprise deployment work. Public materials
              show at least three monetization paths: self-serve API inference billed by usage, private endpoints and
              private offers for enterprise customers, and deployment of compressed models in customer-controlled
              environments such as private cloud, on-premise, and edge settings. The API page and AWS listing are useful
              because they show actual list prices across named models rather than only vague “contact sales” language.
              Even so, list pricing is not realized pricing. The presence of private offers and an AWS Startups discount
              means actual ASPs, gross margins, and enterprise discounting behavior are still hidden from outside
              investors.
