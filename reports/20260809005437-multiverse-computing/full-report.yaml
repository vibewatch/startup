      - number: '2.2'
        title: 'Sizing Lenses: Edge AI, Inference, and Sovereign Compute'
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence supports a large opportunity, but not a single precise market number. Company and
              investor materials tie Multiverse to a $106 billion AI inference market, while third-party edge-AI
              publishers place the 2026 edge-AI market in a very wide band spanning roughly the low-$30 billions to the
              upper-$30 billions and sometimes higher, depending on what is included. Separately, the European
              Commission’s AI Factories and Gigafactories agenda points to a non-trivial sovereign-compute demand pool
              that is policy-driven rather than purely enterprise-software-driven. Those policy sources do not give a
              neat software TAM for compression vendors, but they do show that the compute, data, and sovereignty
              problem Multiverse talks about is real and budgeted. For diligence purposes, the useful conclusion is not
              that one headline number is correct, but that several adjacent spending pools exist and the key task is
              determining which layer Multiverse can actually monetize as a later-stage infrastructure company.
