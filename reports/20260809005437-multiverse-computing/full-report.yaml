      - number: '8.2'
        title: >-
          Financing context and entry discipline point to caution because the company is now priced for scale rather
          than promise
        blocks:
          - type: paragraph
            body: >-
              The July 2026 Series C changed the underwriting frame. At a $1.7 billion pre-money and about $2.3 billion
              post-money valuation, Multiverse is no longer a quirky quantum-inspired specialist selling optionality
              cheaply. It is being priced as a category contender in efficient AI infrastructure. That can be justified
              only if three things are true at once: first, the growth claims represent durable commercial reality
              rather than a tiny-base spike; second, the company’s sovereign and efficiency positioning survives
              competition from hyperscalers and bundled incumbent tooling; and third, the company converts partner-rich
              demand into standalone recurring economics. Public evidence does not disprove any of those conditions, but
              it does not prove them either. Entry discipline therefore matters more than company quality alone. If the
              actual revenue base is still in the tens of millions, the current post-money is aggressive even by
              software standards. If the real annualized base is already much higher, the case improves quickly. Because
              the missing variable is so important, the correct posture is not to overstate precision. Investors should
              treat current pricing as a bull-leaning mark that requires further proof, not as a cleanly supported fair
              value.
            claimRefs:
