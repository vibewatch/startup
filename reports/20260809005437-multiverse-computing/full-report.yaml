      - number: '7.4'
        title: Partner and scale dependence are attractive for reach but risky for ownership, margin, and execution control
        blocks:
          - type: paragraph
            body: >-
              A large share of Multiverse’s current commercial momentum appears to travel through partners rather than
              purely through direct, self-owned enterprise relationships. EY frames industry-specialized sovereign AI
              for regulated buyers. PwC describes international opportunity generation. Inetum is positioned as a main
              international partner. BeeAPro/Nethesis and Arsys extend the motion into NIS2-sensitive and sovereign
              infrastructure contexts. On the product side, Axelera and Qualcomm widen hardware reach. That is
              impressive leverage, especially for a European deep-tech company selling into compliance-heavy sectors.
              But it also creates dependency. System integrators, consultancies, hardware partners, and cloud channels
              can accelerate sales while simultaneously obscuring which value belongs to Multiverse, which margin sits
              elsewhere, and who ultimately owns renewal risk. The Series C expansion plan deepens that challenge
              because the company wants to scale beyond Spain and Europe into multiple geographies at once. If the
              company succeeds, partner leverage will look visionary. If not, the public record could keep producing
              alliance headlines without enough direct evidence on closed-won conversion, partner economics, customer
              concentration, or renewal durability. At a multibillion-dollar valuation, that distinction matters
              materially.
            claimRefs:
