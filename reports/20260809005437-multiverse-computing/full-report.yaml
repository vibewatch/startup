        title: Segments and Buying Centers
        blocks:
          - type: paragraph
            body: >-
              The customer story is clearly enterprise-first. Multiverse’s public surfaces repeatedly frame the buyer as
              a large organization with expensive AI workloads, sensitive data, or infrastructure constraints—not a
              casual consumer. The clients page says the company is trusted by more than 100 companies in 10 industries,
              while the corporates solutions page stresses CAPEX/OPEX reduction, private deployment, regulatory
              compliance, and preservation of existing infrastructure. That points to several recurring buyer
              archetypes: regulated financial and public-sector organizations, energy and telecom operators,
              manufacturers, aerospace and defense-adjacent users, and large enterprises deploying AI inside controlled
              environments. The named-customer and partner set reinforces this pattern: Bosch and Iberdrola are
              industrial and energy proof points; Bank of Canada and Allianz represent regulated finance; Telefónica
              represents telecom and network deployment; Luzia represents high-volume AI assistant infrastructure; EY,
              PwC, Inetum, BeeAPro, and Arsys show that channel and implementation partners are a major route to market.
              This is a sophisticated customer mix, but it also means buyer, user, payer, and deployment partner are not
              always the same entity.
