  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The investment thesis is real, but so is the anti-thesis that public economics still lag the narrative
        blocks:
          - type: paragraph
            body: >-
              The bullish case for Multiverse is stronger than the average private AI startup’s. This is not an
              anonymous model wrapper with no commercial proof. The company has raised one of Europe’s largest AI
              infrastructure rounds, says it now has more than 100 customers across 10 industries, exposes actual API
              and marketplace pricing, and can point to a differentiated sovereign-AI story that resonates with European
              policy and enterprise demand. Growth signals are also unusually dramatic: the company said annualized
              revenue grew by more than 10x since the Series B and Q1 2026 sales grew 96x year over year. Those are
              serious positives. The anti-thesis is that price is more demanding than the public record. The last
              clearly visible sales proxy remains the Fortune-reposted note that predicted 2025 sales were only about
              $25 million, and no public materials in this run disclosed ARR, booked revenue, gross margin, burn, cash
              balance, customer concentration, or preference stack. That means investors can believe the company is
              strategically important and still conclude that current pricing depends on assumptions the public record
              cannot yet confirm. The central valuation question is therefore not whether Multiverse matters. It is
              whether the current price already capitalizes too much of the upside.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
