            body: >-
              The milestone record shows a fast transition from quantum-software specialist to broader efficient-AI
              infrastructure company. Public round announcements and office openings show that 2025 and 2026 were not
              just financing years but scaling years: Madrid opened in late 2025, Barcelona opened in early 2026, and
