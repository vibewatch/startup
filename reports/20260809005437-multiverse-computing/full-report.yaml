      - number: '3.5'
        title: Competitive Verdict
        blocks:
          - type: paragraph
            body: >-
              Multiverse’s competitive position is strongest when the buyer explicitly values compression plus
              sovereignty, not compression alone. If the buyer already wants a Europe-based control layer, offline or
              on-device deployment, or a hardware-agnostic way to reduce inference cost without defaulting to one
              hyperscaler or chip vendor, the company’s pitch is differentiated. If the buyer mainly wants decent
              optimization inside an existing cloud or silicon stack, incumbents can often answer first. That makes
              competition context-dependent rather than universal. The real diligence question is not whether
              alternatives exist—they clearly do—but whether Multiverse’s claimed compression advantage is large enough
              to overcome distribution disadvantages in enough high-value workflows. Customer-level proof, pricing
              discipline, and evidence of repeat wins against bundled options are what will determine whether this
              becomes a durable platform position or a useful feature in a more commoditized ecosystem.
            claimRefs:
