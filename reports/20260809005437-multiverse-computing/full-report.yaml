        - Hypergrowth from a small base can still coexist with a valuation that is too rich.
        - Disclose the current ARR/revenue base and gross margin profile.
      - - Commercial proof
        - 100+ customers, named accounts, and partner traction show real demand.
        - Public evidence still says more about breadth than about revenue quality, retention, or concentration.
        - Show renewal cohorts, top-account exposure, and partner-sourced versus direct revenue.
      - - Monetization
        - API pricing, private endpoints, and AWS distribution show clear revenue surfaces.
        - List pricing and discounts do not reveal realized ASPs or margins.
        - Provide pricing realization, discounting, and services mix data.
      - - Strategic wedge
        - Sovereign and efficient AI is a real European demand theme.
        - >-
          Hyperscaler sovereign clouds and incumbent optimization stacks compress the premium available to independent
          vendors.
        - Show win rates versus incumbent toolchains and sovereign cloud alternatives.
      - - Platform upside
        - Foundry and broader infrastructure ambitions can expand scope beyond model compression.
        - Roadmap breadth also increases execution risk and can pull forward valuation before operating proof exists.
        - Show Foundry GA milestones and attachment to real customer workloads.
      - - Current price
        - A $2.3B post-money keeps the company below the most famous frontier/private AI platforms.
        - It can still be stretched if Multiverse’s durable revenue base is much smaller than those peers.
        - Prove the revenue base is already large enough to justify a premium multiple.
    notes: >-
      The anti-thesis is not that Multiverse is a weak company; it is that the current price may be ahead of public
      proof.
    claimRefs:
      - CV001
      - CV003
      - CV005
