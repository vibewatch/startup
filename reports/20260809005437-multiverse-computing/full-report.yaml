companyProfile:
  summary: >-
    Multiverse Computing is a San Sebastián-based quantum-inspired AI company founded in 2019 by Enrique Lizaso, Román
    Orús, Samuel Mugel, and Alfonso Rubio. The company’s flagship product, CompactifAI, uses tensor-network techniques
    from quantum physics to compress large language models so they can run more cheaply and in more sovereign deployment
    environments. Multiverse now sells through API, private deployment, and partner-led enterprise channels and in July
    2026 announced a $570M Series C that implied roughly a $2.3B post-money valuation.
  foundedDate: '2019-01-01'
