  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product Surface: From Compression Engine to Multi-Surface Delivery Stack'
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, Multiverse is no longer selling just an abstract compression algorithm. It now
              exposes several concrete product surfaces that map to different buyer needs: CompactifAI as the underlying
              compressor; CompactifAI API for managed inference; deployment options for customer-owned cloud,
              on-premise, and edge environments; the CompactifAI App for offline-capable mobile and field use;
              open-source model releases such as HyperNova and LittleLamb on Hugging Face; and Foundry as a broader
              AI-factory control-plane vision. This matters because product maturity differs sharply across these
              surfaces. The deployment catalog and API are already tangible and documented. The app is real and
              downloadable, but its value proposition depends on device capability and routing behavior. The open-source
              model surface creates external developer touchpoints. Foundry, meanwhile, is strategically important but
              visibly earlier-stage. The overall picture is a company trying to turn a core technical competency—model
              compression—into a portfolio that spans developers, enterprises, sovereign deployments, and future
              infrastructure operators.
