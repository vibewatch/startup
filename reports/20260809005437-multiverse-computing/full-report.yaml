      - number: '4.4'
        title: Unit Economics, Cost Structure, and Margin Logic
        blocks:
          - type: paragraph
            body: >-
              The basic unit-economics logic is plausible even though the actual company numbers are private.
              Multiverse’s compression pitch is that smaller models reduce compute, latency, storage, and energy use.
              Official product materials claim 50% to 80% lower inference costs and 4x to 12x faster performance in some
              configurations, while the API documentation claims up to 70% lower inference costs and up to 4x more
              requests per second. An AIwire benchmark release on Intel Xeon 6 showed roughly 94% throughput
              improvements and about 47% to 49% latency reductions for one compressed Llama workload, which supports the
              idea that customers may pay for efficiency rather than raw model novelty. However, public margin
              underwriting is still weak because we do not know serving cost by model, GPU mix, retraining cost, support
              burden, or the share of revenue coming from lower-margin services versus higher-margin recurring usage.
              The right conclusion is that the business may have attractive gross-margin potential, but the public
              record does not yet prove it.
