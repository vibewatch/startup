      - number: '7.3'
        title: >-
          Product-validation, quality, and security risk remain meaningful because the roadmap is broader than the
          public proof set
        blocks:
          - type: paragraph
            body: >-
              The product chapter showed genuine breadth: API distribution, compressed open models, Intel benchmark
              publicity, router logic, and an expanding on-device and edge narrative. The risk chapter has to ask
              whether the proof has caught up with that ambition. It has not fully. The positive side is clear enough:
              there are concrete benchmark claims, live demonstrations, and growing partner validations. The negative
              side is that the strongest benchmark evidence remains relatively narrow and often tied to company-authored
              or partner-authored releases. TechCrunch’s March 2026 reporting also matters because it exposed a
              practical caveat: older devices may fall back to cloud APIs, so the local/offline message is not
              universal. Foundry adds a second execution layer. The page is strategically promising, but “Coming Soon”
              means the governance-and-orchestration control plane is still roadmap-level rather than a mature generally
              available product. Public governance artifacts likewise show only part of the story. The company has
              privacy and legal pages and a quality/environmental policy, but this run did not surface a dedicated trust
              center, public incident history, system-specific AI Act classification packet, or deep third-party
              security-assurance set. None of that proves weakness. It does mean the burden of proof has shifted from
              product narrative to operational evidence.
