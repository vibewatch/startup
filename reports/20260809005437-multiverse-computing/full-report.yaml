              The founder set blends finance, quantum science, engineering, and commercialization. CEO Enrique Lizaso
              brings a banking and operations background and has become the primary storyteller for capital raising and
              sovereign-AI positioning. Co-founder and Chief Scientific Officer Román Orús anchors the scientific core,
