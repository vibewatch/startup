  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: >-
        Active-paying-fan counts, creator churn, GRR/NRR, renewal behavior, and
        cohort-level fan or creator retention data.
      whyItMatters: >-
        Disclosed registered-account scale does not prove repeat monetization or
        customer durability, which is central to underwriting long-term customer
        quality.
      diligencePath: >-
        Obtain Fenix management reporting or investor materials with monthly
        paying fans, paying creators, repeat purchase cohorts, and creator churn
        by segment and geography.
      relatedQuestionRefs: [QU008]
      relatedTableRefs: [TU002]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        A broader list of named creators or enterprise-style customer examples
        with disclosed outcomes, repeat spend, or renewal evidence across
        multiple segments.
      whyItMatters: >-
        Public named examples skew toward celebrities or adverse creator stories,
        which is not enough to judge whether success generalizes across the long
        tail.
      diligencePath: >-
        Request creator cohort case studies, top-decile and median revenue
        curves, and anonymized retention snapshots separating celebrity,
        independent, and agency-managed creators.
      relatedQuestionRefs: [QU004, QU008]
      relatedTableRefs: [TU003]
