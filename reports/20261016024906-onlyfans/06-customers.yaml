  researchQuestions:
    - id: QU001
      question: >-
        Which creator and fan segments does OnlyFans actually serve, and which
        side of the marketplace appears to anchor monetization?
      type: verification
      targets: [contentRequirements/0]
      status: answered
    - id: QU002
      question: >-
        What public evidence establishes the scale of creator and fan adoption,
        and do disclosed counts represent registered or active paying users?
      type: quantification
      targets: [contentRequirements/1]
      status: answered
    - id: QU003
      question: >-
        Which monetization surfaces do fans use to pay creators, and how stable
        is the 20% platform take rate across those surfaces?
      type: mechanism
      targets: [contentRequirements/1]
      status: answered
    - id: QU004
      question: >-
        Which creator cohorts appear to monetize best on OnlyFans: celebrity
        entrants with audiences in hand or the platform's long tail?
