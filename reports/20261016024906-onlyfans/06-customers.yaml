schemaVersion: report-v2
artifact: customers
slug: onlyfans
runDate: 2026-10-16
company:
  name: OnlyFans
chapter:
  number: 6
  title: Customers
  summary: >-
    OnlyFans has very large disclosed creator and fan reach, but the available
    evidence describes a two-sided marketplace more clearly than it proves
    durable recurring retention. Public sources support strong top-of-funnel
    adoption and creator monetization mechanics, while leaving active-paying
    fan counts, churn, concentration, and cohort durability materially
    under-disclosed.
sections:
  - id: two-sided-customer-base
    title: Two-sided customer base with creator-first economics
    body: >-
      OnlyFans serves two interdependent customer groups: creators who use the
      platform to monetize audiences, and fans who pay for direct access to
      those creators. The platform's commercial design is consistent across the
      evidence in this pool: fans convert through subscriptions, pay-per-view
      messages, and tipping, while creators keep 80% of gross receipts and
      OnlyFans keeps a 20% platform fee. Although the brand remains primarily
      associated with pornographic creators, public descriptions also show
      non-adult cohorts including athletes, musicians, comedians, chefs, and
      fitness trainers, plus OFTV and other safe-for-work initiatives. That
      broadens theoretical TAM, but this source set does not quantify how much
      non-adult usage contributes to platform GMV or retention.
    claimRefs: [CU001, CU002, CU003, CU015]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-scale-and-proof
    title: Adoption proof is strong at the top of the funnel, weaker on active-paying depth
    body: >-
      Adoption evidence is strongest on disclosed reach and creator-payout
      scale. Independent summaries of FY2024 disclosures converge around roughly
      4.6 million creator accounts and about 377 million to 377.5 million fan
      or user accounts, while Think Insights traces growth from roughly 7.5
      million users in early 2020 to more than 85 million within a year.
      Creator payouts also appear enormous, with cited FY2024 payouts of $5.8
      billion and cumulative payouts above $25 billion since launch. The
      limitation is denominator quality: these are registered or cumulative
      counts, not active-paying fans, and the source pool does not provide a
      verified public cohort view showing how many of those accounts remain
      active or pay repeatedly over time.
    claimRefs: [CU004, CU005, CU006, CU014]
    tableRefs: [TU002]
  - id: durability-expansion-and-concentration
    title: Expansion depends on off-platform audience funnels and a fragile creator support layer
    body: >-
      The best public proof of expansion is not classic SaaS retention data but
      creator behavior. Think Insights and the HBS submission both describe a
      model in which creators import demand from Instagram, X, TikTok, and
      other outside channels, then monetize fans through recurring subscriptions
      and higher-yield pay-per-view or direct-message offers. That makes
      celebrity and influencer cohorts unusually powerful: Mashable and
      Security.org both cite Bella Thorne's outsized launch economics as proof
      that pre-existing audience can compress time-to-revenue. The same model
      also creates fragility. BBC reporting shows a parallel OFM/agency layer
      that promises growth support but can capture 50%-70% of creator
      economics, interfere with account control, and inject payout risk.
      Without public NRR, GRR, churn, or top-creator concentration disclosures,
      OnlyFans looks durable in aggregate scale but hard to underwrite on cohort
      quality.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / proof
      - Revenue / strategic value
      - Gap
    rows:
      - - Core creator base
        - Creators are the operating customer; fans are the payer on the other side
        - Monetize audiences through subscriptions, PPV, tips, and direct messages
        - Roughly 4.6M creator accounts and ~377M fan or user accounts in FY2024 summaries
        - Creator supply is the platform's primary inventory and payout engine
        - Public disclosures do not separate active earning creators from registered accounts
      - - Adult / NSFW creators
        - Individual performers, independent creators, and professionals
        - Paid access to explicit or adult-adjacent content
        - Wikipedia and Mashable both treat adult content as the dominant brand association
        - Historically the highest-demand category and a major reason for consumer willingness to pay
        - No public GMV split by adult vs. non-adult cohorts in this source set
      - - Celebrity / influencer creators
        - Public figures with existing social audiences
        - Rapid paid fan conversion after launch
        - Bella Thorne's launch is repeatedly cited as an outsized monetization event
        - Validates land-and-expand through imported fandom rather than on-platform discovery alone
        - Celebrity examples are not representative of the median creator
      - - Non-adult / safe-for-work creators
        - Athletes, musicians, comedians, chefs, and fitness creators
        - Membership, behind-the-scenes access, and safe-for-work programming
        - Wikipedia cites OFTV and named mainstream creator initiatives
        - Broadens brand adjacency and possible category expansion
        - No public contribution margin, retention, or revenue mix disclosed
      - - OFM / agency-managed creators
        - Creators who outsource growth, chat, or account operations to managers
        - Subscriber acquisition, response management, and account administration
        - BBC documents a large OFM ecosystem and contracts taking 50%-70% of creator earnings
        - Can accelerate operations for some creators but acts like a paid channel overlay
        - Misaligned incentives, account-control risk, and opaque take rates can weaken durability
    notes: >-
      Segmentation is based on public descriptions and reported creator examples;
      registered-account counts do not prove active-paying depth or cohort
      retention.
    claimRefs: [CU001, CU002, CU003, CU005, CU007, CU010, CU015]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Pandemic-era user growth
        - 7.5M registered users to 85M+ within about a year
        - 2020-2021
        - Think Insights
        - Medium
        - Strong proof of fast adoption during the COVID step-change
        - Registered users do not equal active paying fans
      - - Creator account base
        - About 4.6M to 4.63M creator accounts
        - FY2024 cited in 2025-2026 summaries
        - Think Insights; BBC; InforCapital
        - High
        - Large creator supply underpins breadth and content velocity
        - No disclosure of active earning creators or creator churn
      - - Fan / user account base
        - About 377M to 377.5M fan or user accounts
        - FY2024 cited in 2025-2026 summaries
        - Think Insights; InforCapital
        - High
        - Massive top-of-funnel reach supports marketplace liquidity
        - Public sources do not disclose active-paying fan counts
      - - FY2024 creator payouts
        - $5.8B on $7.22B gross fan payments
        - FY2024
        - Think Insights
        - Medium
        - Confirms large gross transaction volume and direct creator monetization
        - No cohort or renewal breakdown by creator segment
      - - Cumulative payouts since launch
        - More than $25B paid to creators since 2016
        - Reported in 2025-2026 coverage
        - Mashable; InforCapital
        - Medium
        - Shows long-term monetization scale and platform relevance to creators
        - Cumulative payouts do not show current retention quality
      - - Marketplace monetization rule
        - 20% platform cut / 80% creator payout
        - Current operating model
        - Think Insights; Wikipedia; Mashable
        - Medium
        - Simple, creator-friendly price architecture supports conversion and upsell
        - No public breakdown by geography, payment rail, or chargeback intensity
      - - Creator-income distribution shape
        - Mid-tier collapse between Top 25% and Median; 4,083x gap headline
        - 2025 research series
        - OnlyFansStatistics Research; HBS submission
        - Medium
        - Adoption scale does not imply healthy long-tail earnings or retention
        - No official platform cohort table in this source set
    notes: >-
      This table mixes disclosed platform totals with third-party summaries and
      research-series framing; cumulative or registered counts are not active
      paying-user disclosures.
    claimRefs: [CU004, CU005, CU006, CU008, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Bella Thorne
        - Celebrity creator
        - Off-platform audience converted into a high-visibility paid launch
        - Production
        - Mashable and other cited coverage treat her launch as proof that pre-existing fame can monetize immediately
        - Celebrity performance is an outlier and does not prove median creator durability
      - - Gia Clarke
        - Long-tenured UK creator
        - Mature creator using OnlyFans while fielding outreach from external managers
        - Production
        - BBC quotes her saying she receives more OFM messages than fan messages, showing a real surrounding service economy
        - Anecdotal proof of creator activity, not retention or payout quality
      - - Lily Phillips
        - High-earning UK creator
        - Creator testimony on risks in the OFM layer around OnlyFans
        - Production
        - BBC uses her comments as adverse evidence that creator-support intermediaries can expose vulnerable users
        - Adverse proof, not a quantified expansion or renewal case
      - - Leanne
        - Managed creator account
        - Signed a manager contract that included 50% revenue share and account-control rights
        - Production, then exited
        - BBC documents how outsourced growth support can become a customer-durability failure mode
        - Pseudonymized case; not a statistically representative sample
    notes: >-
      This is a representative sample of named or pseudonymized public creator
      evidence from the assigned pool, not an exhaustive enumeration of OnlyFans
      customers.
    enumerationScope:
      coverage: sample
      basis: >-
        Publicly named or pseudonymized creators in the assigned pool spanning
        celebrity launch evidence and BBC creator interviews from 2020-2026.
    claimRefs: [CU007, CU009, CU010, CU011, CU012, CU013]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      OnlyFans converts off-platform creator attention into paid fan
      relationships, then tries to deepen spend through direct-message and
      pay-per-view surfaces while managing payout and safety friction.
    data:
      items:
        - label: Creator acquisition
          actor: Creator
          tone: neutral
          touchpoints:
            - Instagram, X, TikTok, and other audience sources seed traffic
            - Existing fandom matters more than on-platform cold discovery
        - label: Profile discovery
          actor: Fan
          tone: neutral
          touchpoints:
            - Fan browses creator page, offer tiers, and bundles
            - Free follows can precede paid conversion
        - label: Paid conversion
          actor: Fan
          tone: positive
          touchpoints:
            - Monthly subscription unlocks core paywalled content
            - OnlyFans keeps 20%; creator keeps 80%
        - label: Expansion loop
          actor: Creator and fan
          tone: opportunity
          touchpoints:
            - Direct messages, PPV offers, and tips deepen spend
            - Repeat interaction raises value per paying fan
        - label: Managed growth overlay
          actor: OFM / agency layer
          tone: risk
          touchpoints:
            - Some creators outsource chat, promotion, or account operations
            - OFM take rates and account access can dilute creator economics
        - label: Renewal and payout friction
          actor: Platform and creator
          tone: risk
          touchpoints:
            - Payment processors, safety checks, scams, and payout controls affect trust
            - Public sources do not disclose renewal or churn cohorts
    claimRefs: [CU001, CU002, CU009, CU010, CU012, CU013, CU014]
