    rows:
      - ["OnlyFans", "80% creator / 20% platform", "$20 in comparison sources", "Subscriptions, PPV, tips, custom content", "Realized take-home may be lower after payment processing; discovery mostly external", "Incumbent economics are familiar but not uniquely favorable"]
      - ["Fansly", "80% creator / 20% platform", "$5 to $50 depending on source and payment route", "Tiered subscriptions, search/discovery, stronger analytics/scheduling", "Published thresholds differ across comparison sources; audience still smaller", "Alternative wins on tooling more than on headline fee"]
      - ["Fanvue", "85% creator for cited introductory period, then 80/20 standard", "$50 in one management-source comparison", "Subscriptions, PPV, AI creator tools", "Promotional rate changed; current terms must be rechecked before underwriting", "Attractive for onboarding and tooling, but economics converge toward OnlyFans over time"]
      - ["MYM", "25% on subscriptions, 20% on push/private media, plus 7% banking fee", "€50", "Subscriptions, push media, private media, internal search", "French/European orientation narrows addressable audience", "Higher effective fee can still make sense if geography and discovery fit improve conversion"]
      - ["Patreon", "88% to 95% creator depending on plan", "$1 in one comparison source", "Tiered memberships and mainstream community support", "Adult restrictions make monetization scope narrower", "Economics look better on paper, but the product solves a different job for NSFW creators"]
      - ["Partut", "Buyer-paid 15% service fee; creator keeps posted price", "Wise payouts", "No creator-side commission, buyer pays added fee", "Newer platform with little native audience; creators bring traffic", "Best for creators who already source demand externally and want to maximize take-home"]
    notes: >-
      Pricing rows reflect published or comparison-page list terms, not realized creator net revenue. Where sources disagree on payout thresholds or promo periods, the caveat is preserved instead of normalized away.
    claimRefs: [CP003, CP005, CP007, CP008, CP009, CP014]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of platform positioning using source-backed comparisons of native discovery and adult-subscription monetization depth; scores indicate relative fit, not audited market shares.
    data:
      xAxis:
        label: Native discovery / distribution leverage (1 = almost entirely external traffic; 5 = strong internal discovery)
        min: 1
        max: 5
      yAxis:
        label: Monetization depth for adult subscription creators (1 = restricted / narrow; 5 = adult-native multi-revenue stack)
        min: 1
        max: 5
      points:
        - label: OnlyFans
          x: 1
          y: 5
          note: "Largest incumbent with deep PPV monetization, but multiple sources say creators must source most traffic off-platform."
        - label: Fansly
          x: 4
          y: 4
          note: "Direct peer with search/discovery, tiering, and stronger tooling, but still smaller than OnlyFans."
        - label: Fanvue
          x: 3
          y: 4
          note: "AI-forward challenger with subscriptions and PPV, but less audience scale than OnlyFans."
        - label: MYM
          x: 4
          y: 3
          note: "Discovery-led French / European alternative with meaningful monetization tools but higher effective fees."
        - label: Patreon
          x: 3
          y: 1
          note: "Mainstream membership platform with broad awareness but poor fit for explicit adult monetization."
        - label: Partut
          x: 1
          y: 3
          note: "Fee-model outlier that maximizes creator take-home, but discovery is still creator-supplied."
    approximationNotes: >-
      Coordinates are evidence-backed ordinal scores synthesized from cited platform comparisons about discovery, fee structures, monetization formats, and policy fit. They are not independent benchmark measurements or inferred market-share data.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP007, CP009, CP010]
