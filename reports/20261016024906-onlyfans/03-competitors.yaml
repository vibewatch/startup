company:
  name: OnlyFans
chapter:
  number: 3
  title: Competitors
  summary: >-
    OnlyFans remains the scale incumbent in creator subscriptions, but its product moat is thinner than its network moat: multiple sources describe weak native discovery, a flat 20% take rate that direct peers often match, and creator use of multi-platform stacks to hedge policy or payout risk. Competitors differentiate along discoverability, AI tooling, geography, or content-policy fit rather than on a dramatically better economic split, which makes OnlyFans durable but also vulnerable to feature-driven share leakage.
sections:
  - id: landscape-map
    title: "Landscape: direct platforms, substitutes, and status quo"
    body: >-
      The relevant competitive set is broader than adult-subscription clones. Direct peers include Fansly, Fanvue, MYM, LoyalFans, and other adult-native subscription platforms that compete for the same creator and fan monetization flows. Adjacent or substitute options include Patreon and Ko-fi for brand-safe memberships, ManyVids for catalog-style video monetization, and the status quo of using OnlyFans itself as the paid endpoint while sourcing demand from TikTok, X, Instagram, Reddit, and other external funnels. Multiple sources independently describe OnlyFans as the scale leader, but they also agree that creators increasingly stack multiple platforms because discovery, geography, and policy fit differ by platform. That means buyers can solve the same monetization job through a mix of direct rivals, category adjacencies, and off-platform audience-building rather than through OnlyFans alone. 
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-pricing-comparison
    title: Capability and pricing comparisons favor niche advantages over a universal replacement
    body: >-
      On price alone, OnlyFans is hard to distinguish from its closest adult-native peers. Several comparison sources describe OnlyFans, Fansly, and Fanvue as effectively standardizing around an 80/20 creator split, while MYM takes a more complex and often higher effective cut once banking fees are included. The sharper differences are product and audience mechanics: Fansly is repeatedly described as stronger on native discovery, tiered subscriptions, analytics, and scheduling; Fanvue differentiates through AI-enabled creator tooling and international positioning; Patreon has mainstream brand safety but cannot serve explicit adult creators as a primary replacement. The result is a landscape where switching is usually driven by fit to workflow, audience, or policy tolerance rather than by a step-change in platform take rate.
    claimRefs: [CP002, CP003, CP004, CP005, CP007, CP008, CP009]
    tableRefs: [TP002, TP003]
  - id: switching-costs-and-distribution
    title: Switching costs are moderated by external distribution and multi-homing
    body: >-
      OnlyFans' strongest advantage is market gravity, not locked-in software. Sources consistently note that creators still have to acquire most demand off-platform, which lowers technical switching costs because the top of funnel often lives on external social networks rather than inside OnlyFans. At the same time, the operational model is not frictionless: messaging playbooks, tiering logic, payout rules, and regional audience fit differ across platforms, so creators that expand to Fansly, MYM, Fanvue, or LoyalFans usually run a portfolio rather than a full cutover. That points to moderate switching costs and high multi-homing: the creator can reuse content and audience intent, but performance still depends on platform-specific optimization and tooling. 
    claimRefs: [CP001, CP002, CP005, CP008, CP010, CP012]
  - id: durability-and-adverse-evidence
    title: Durability depends on network scale, while adverse evidence centers on policy and feature commoditization
    body: >-
      Adverse evidence suggests OnlyFans can lose marginal creator supply when trust in policy or payments weakens. The 2021 adult-content reversal, attributed to payment and banking pressure, created a visible opening for Fansly, which multiple sources cite as benefiting from that moment. More recent comparison content also frames fees, limited internal promotion, and policy instability as reasons creators test alternatives. This does not erase OnlyFans' incumbent advantage: the platform still combines the largest user base, a mature creator economy, and entrenched buyer familiarity. But it does mean differentiation durability is uneven. If rivals keep matching the 80/20 economics while improving discovery, analytics, or creator tooling, OnlyFans' moat remains scale-based and therefore vulnerable to gradual multi-platform leakage rather than an abrupt winner-take-all collapse.
    claimRefs: [CP006, CP007, CP010, CP011, CP013, CP014]
callouts:
  - calloutType: risk
    title: Feature parity limits pricing power
    body: >-
      Direct peers usually do not beat OnlyFans on headline commission; they attack discovery, analytics, AI tooling, or regional fit instead. That means OnlyFans' pricing power is constrained if creators continue to treat it as one leg of a multi-platform stack rather than as their only monetization home.
    claimRefs: [CP007, CP010, CP014]
  - calloutType: insight
    title: The real substitute is often "OnlyFans plus something else"
    body: >-
      The strongest substitute pattern is not a full platform swap but portfolio monetization: creators pair OnlyFans with a discovery-led or niche-fit second platform to reduce dependence on one set of rules, one payment system, or one audience geography.
    claimRefs: [CP008, CP012]
