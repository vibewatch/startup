      - number: '3.2'
        title: 能力与价格对比更支持细分优势，而非通用替代
        blocks:
          - type: paragraph
            body: >-
              单看价格，OnlyFans 很难与最接近的原生成人平台区分开来。多份对比资料称，OnlyFans、Fansly 和 Fanvue 基本都围绕 80/20 创作者分成标准化，而 MYM
              加上银行费用后，实际抽成更复杂、通常也更高。真正明显的差异在产品和受众机制：Fansly 一再被描述为原生发现、分层订阅、分析和排期更强；Fanvue 通过 AI 创作者工具和国际化定位形成差异；Patreon
              具备主流品牌安全性，却无法成为显性成人创作者的主要替代品。因此，创作者通常因为工作流、受众或政策容忍度匹配而切换，而不是因为平台抽成率发生了阶跃式变化。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP010
              - CP011
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP005
              - CP007
              - CP008
              - CP009
              - CP014
      - number: '3.3'
        title: 外部分发与多平台经营降低了切换成本
        blocks:
          - type: paragraph
            body: >-
              OnlyFans 最强的优势是市场引力，而不是软件锁定。资料一再指出，创作者仍需在平台外获取大部分需求；由于漏斗顶部往往位于外部社交网络，而不是 OnlyFans
              内部，技术切换成本因此较低。但运营模式并非毫无摩擦：消息话术、分层逻辑、付款规则和区域受众匹配在不同平台间各不相同。因此，扩展到 Fansly、MYM、Fanvue 或 LoyalFans
              的创作者通常会运营一个组合，而不是彻底切换。这指向中等切换成本和高度多平台经营：创作者可以复用内容和受众意向，但表现仍取决于平台特有的优化方式和工具。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP008
              - CP010
              - CP012
      - number: '3.4'
        title: 持久性取决于网络规模，反向证据集中在政策与功能商品化
        blocks:
          - type: paragraph
            body: >-
              反向证据表明，当创作者对政策或支付的信任下降时，OnlyFans 可能失去边际创作者供给。2021 年成人内容政策反复、且据称源于支付和银行压力，为 Fansly
              创造了明显机会，多个来源称其从这一时点获益。近期对比内容也将费用、内部推广有限和政策不稳定列为创作者尝试替代平台的原因。这并没有抹去 OnlyFans
              的在位者优势：平台仍拥有最大的用户基础、成熟的创作者经济和根深蒂固的买方认知。但它确实意味着差异化的持久性并不均衡。如果竞争者继续匹配 80/20 经济性，同时改善发现、分析或创作者工具，OnlyFans
              的护城河仍以规模为基础，因此更容易遭遇渐进式多平台分流，而不是突然发生赢家通吃式崩溃。
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 功能趋同限制定价权
            body: >-
              直接同行通常不会在表面佣金上击败 OnlyFans，而是从发现、分析、AI 工具或区域匹配入手。如果创作者继续把 OnlyFans 当作多平台组合中的一环，而不是唯一变现阵地，OnlyFans
              的定价权就会受到约束。
            calloutType: risk
            claimRefs:
              - CP007
              - CP010
              - CP014
          - type: callout
            title: 真正的替代方案往往是“OnlyFans 加上别的平台”
            body: 最强的替代模式不是彻底更换平台，而是组合变现：创作者把 OnlyFans 与一个以发现能力或细分匹配见长的第二平台配对，以降低对单一规则、单一支付系统或单一受众地域的依赖。
            calloutType: insight
            claimRefs:
              - CP008
              - CP012
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与公开规模
        blocks:
          - type: paragraph
            body: >-
              公开证据对核心变现机制的描述一致：OnlyFans 位于粉丝和创作者之间，处理订阅、按次付费解锁、打赏以及直播或定制互动，随后留存固定 20% 的佣金并将 80%
              汇给创作者。这形成一条简单且可扩展的收入桥接，但公开披露把看似经过审计的 2023 年数据与 2024-2026 年第三方摘要混在一起，因此相比实际
              ARPPU、付费转化或清晰的收入结构披露，列表价格和平台规模更有支撑。

              最有力的公开规模锚点来自 2023 年年报摘要和之后的 2024-2026 年第三方更新。UpMarket 报告称，2023 年网站总交易额为 $6.63 billion，平台收入为 $1.31
              billion，创作者支付约 $5.32 billion；之后的摘要则显示，平台在 2026 年约有 377 million 注册用户、4.6 million 创作者，年度总交易额超过 $8
              billion。这些数字对收入顶线的持久性提供了明确方向，但在把总交易额视为高质量收入之前，投资者仍需管理层提供付费用户数、平均支出和集中度数据。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI007
