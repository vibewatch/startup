      - number: '4.3'
        title: 资产负担轻，但资本充足性仍不清晰
        blocks:
          - type: paragraph
            body: >-
              公开记录仍把 OnlyFans 描述为平台层面资产负担异常轻的公司。Matthew Ball 的 2024 年分析引用了 2023 年 $1.3 billion 净收入、$819 million 毛利、$649
              million 营业利润以及仅 42 名平均员工。这与一种业务相符：创作者支付吞噬了总交易额的大头，但平台留存的 20% 份额仍能转化为极高利润率。2024 年 Think Insights
              摘要也指向相同方向，引用 $7.22 billion 总收入、$1.41 billion 净收入和 $684 million 税前利润。

              资本充足性是公开资料最薄弱的地方。InforCapital 报告称，2026 年 5 月完成首轮外部融资：Architect Capital 领投一笔 $535 million 少数股权投资，估值约 $3.15
              billion。这证明公司获得了新的资本来源，但没有披露融资后的期末现金、债务、股息政策或月度烧钱速度。因此，现有证据支持“历史盈利能力很强，但融资依赖问题尚未解决”的判断，而不是明确的现金跑道结论。
            claimRefs:
              - CI003
              - CI004
              - CI011
              - CI012
      - number: '4.4'
        title: 财务结论与尽调障碍
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，OnlyFans 有三个公开维度很有吸引力：简单的 20%
              抽成率、异常高的历史平台盈利能力，以及既能变现经常性订阅、又能变现高客单价交易增购的创作者工作流。这些特征让公司比多数消费社交变现故事更容易令人信服。但现有公开证据对收入质量的支持远弱于对表面规模的支持，因为它没有披露付费账户数、队列留存、流失、头部创作者集中度，或扣除折扣、免费漏斗和机构中介后的实际价格。

              最大的投资判断障碍不是模式能否产生总交易额，而是当前现金创造能力能否在支付通道压力、监管审查以及创作者收入中位数看似偏弱的基础上持续。除非管理层提供 2026
              年之后的现金、烧钱速度、债务、队列和获客数据，否则更审慎的财务判断是：OnlyFans 是一个高度盈利但仍部分不透明的市场，而不是一项可以充分评估的复利型订阅资产。
            claimRefs:
              - CI005
              - CI006
              - CI010
              - CI012
              - CI013
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 支付通道是财务瓶颈
            body: OnlyFans 有吸引力的抽成模型仍依赖能够对审核、付款时间甚至允许的内容施压的银行和卡组织，因此利润持久性并不独立于合规执行。
            calloutType: risk
            claimRefs:
              - CI001
              - CI013
          - type: callout
            title: 表面规模高估了供给健康度
            body: 即使创作者收入高度集中，平台也可以实现很高的盈利；因此，不能把 GMV 增长理解为创作者收入中位数群体在经济上健康或具有黏性的证明。
            calloutType: insight
            claimRefs:
              - CI004
              - CI010
              - CI011
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 创作者工作流与变现界面
        blocks:
          - type: paragraph
            body: >-
              有直接证据支持的产品是一个双边创作者平台，而不是单一订阅工具。官方创作者入驻资料描述的工作流是：创作者开设账户，提交身份和银行信息接受审核，选择免费或付费账户设置，发布内容，推广个人主页，然后靠订阅、按次付费消息或帖子、打赏和直播互动变现粉丝。同一界面还提供消息、投票、信息流帖子和统计等创作者侧互动与分析功能。这种广度很重要，因为保留证据中当前最强的收入信号并不是简单的经常性订阅扩张：一份基于
              Fenix 文件的独立 2026 年统计汇编称，按次付费、打赏和消息的增长快于订阅，如今已主导平台收入。因此，产品尽调应把 OnlyFans 视为一个叠加经常性访问权的交易型创作者支付工作流，而不是纯 SaaS
              式订阅产品。
            claimRefs:
              - CE001
