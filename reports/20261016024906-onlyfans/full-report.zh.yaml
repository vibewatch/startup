figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: OnlyFans 的公开里程碑从 2016 年上线和注册成立开始，延伸至 2026 年的所有权变更、外部融资和持续中的监管审查。
    data:
      items:
        - date: '2016'
          label: 平台上线
          detail: Tim Stokely 创办 OnlyFans，将其打造为直接连接粉丝的订阅平台。
          tone: positive
          claimRefs:
            - CO009
        - date: '2016-09-01'
          label: Fenix International 注册成立
          detail: OnlyFans 背后的法律实体在英国注册成立。
          tone: neutral
          claimRefs:
            - CO009
        - date: '2018-10-03'
          label: Radvinsky 开始控制
          detail: 记录显示 Leonid Radvinsky 持有 75% 或以上的股份和投票权。
          tone: neutral
          claimRefs:
            - CO010
        - date: '2021-08-17'
          label: OFTV 上线
          detail: OnlyFans 推出适合工作场景的 OFTV 流媒体应用。
          tone: positive
          claimRefs:
            - CO012
        - period: 2021-08-21 to 2021-08-25
          label: 银行压力下的政策反转
          detail: OnlyFans 在支付合作伙伴施压后，宣布并随后暂停原定的显性内容政策调整。
          tone: adverse
          claimRefs:
            - CO015
        - date: '2023-07-18'
          label: Keily Blair 出任 CEO
          detail: Keily Blair 接替 Amrapali Gan 担任首席执行官。
          tone: neutral
          claimRefs:
            - CO011
        - date: '2024-05-01'
          label: Ofcom 启动调查
          detail: 英国监管机构 Ofcom 对作为 OnlyFans 提供方的 Fenix 展开调查。
          tone: adverse
          claimRefs:
            - CO013
        - date: '2025-03-27'
          label: Ofcom 罚款
          detail: Ofcom 因 Fenix 对信息请求的答复不准确且不完整，对其处以 £1.05 million 罚款。
          tone: adverse
          claimRefs:
            - CO013
        - date: '2026-03-20'
          label: Chudnovsky 控制权被记录
          detail: 记录显示 Yekaterina Chudnovsky 持有 75% 或以上的股份和投票权。
          tone: neutral
          claimRefs:
            - CO010
        - period: 2026-05
          label: 外部资本进入
          detail: 据报道，Architect Capital 领投一轮 $535 million 少数股权融资，对应约 $3.1-$3.15 billion 估值。
          tone: positive
          claimRefs:
            - CO016
