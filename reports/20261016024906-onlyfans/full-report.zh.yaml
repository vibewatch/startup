  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: OnlyFans 将站外创作者注意力转化为付费粉丝关系，再通过私信和按次付费界面推动消费加深，同时管理付款和安全摩擦。
    data:
      items:
        - label: 创作者获客
          actor: 创作者
          tone: neutral
          touchpoints:
            - Instagram、X、TikTok 及其他受众来源为平台导入流量
            - 既有粉丝基础比平台内的冷启动发现更重要
        - label: 资料发现
          actor: 粉丝
          tone: neutral
          touchpoints:
            - 粉丝浏览创作者页面、优惠层级和套餐
            - 免费关注可以先于付费转化
        - label: 付费转化
          actor: 粉丝
          tone: positive
          touchpoints:
            - 月度订阅解锁核心付费墙内容
            - OnlyFans 留存 20%；创作者获得 80%
        - label: 扩张循环
          actor: 创作者和粉丝
          tone: opportunity
          touchpoints:
            - 直接消息、PPV 优惠和打赏推动消费加深
            - 重复互动提高每位付费粉丝的价值
        - label: 代运营增长层
          actor: OFM / 代理层
          tone: risk
          touchpoints:
            - 部分创作者将聊天、推广或账户运营外包
            - OFM 抽成和账户访问权可能稀释创作者经济收益
        - label: 续订与收款摩擦
          actor: 平台和创作者
          tone: risk
          touchpoints:
            - 支付处理商、安全检查、诈骗和收款控制会影响信任
            - 公开来源未披露续订或流失用户群
    claimRefs:
      - CU001
      - CU002
      - CU009
      - CU010
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 当外部交易对手迫使业务变化的速度快于 OnlyFans 证明其控制成熟度时，剩余风险最高。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解措施成熟度
        - 剩余风险
      rows:
        - label: 英国监管 / 年龄保障治理
          values:
            - High
            - Very high
            - Medium
            - High
        - label: 支付处理商与银行卡网络压力
          values:
            - Medium-high
            - Very high
            - Medium
            - High
        - label: 创作者代理剥削 / 疏忽外溢
          values:
            - High
            - High
            - Low-medium
            - High
        - label: 拒付、付款冻结和准备金摩擦
          values:
            - High
            - High
            - Medium
            - High
        - label: 隐私 / 内部访问 / 私信保密
          values:
            - Medium
            - High
            - Medium
            - Medium-high
        - label: 盗版与信任泄漏
          values:
            - High
            - High
            - Medium
            - 高
    approximationNotes: 热力图评分是对留存证据的定性综合，并非模型生成的概率。
    claimRefs:
