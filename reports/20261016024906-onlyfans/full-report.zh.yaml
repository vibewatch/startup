        title: 展示项
        blocks:
          - type: callout
            title: 规模公开，运营深度不公开
            body: FY2024 收入、利润和账户规模异常庞大，但现有证据对平台的员工数仍只提供宽泛的 LinkedIn 51-200 区间。因此，运营杠杆很明显，人员深度却无法确认。
            calloutType: insight
