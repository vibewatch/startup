  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 基于来源支持的原生发现能力和成人订阅变现深度，对平台定位进行序数化比较；分数表示相对匹配度，而非经审计的市场份额。
    data:
      xAxis:
        label: 原生发现 / 分发杠杆（1 = 几乎完全依赖外部流量；5 = 内部发现能力强）
        min: 1
        max: 5
      yAxis:
        label: 成人订阅创作者的变现深度（1 = 受限 / 狭窄；5 = 原生成人内容、多元收入结构）
        min: 1
        max: 5
      points:
        - label: OnlyFans
          x: 1
          'y': 5
          note: 最大的现有平台，PPV 变现深度高；但多个来源称，创作者必须从站外获取大部分流量。
        - label: Fansly
          x: 4
          'y': 4
          note: 直接竞争平台，具备搜索 / 发现、分层定价和更强工具，但规模仍小于 OnlyFans。
        - label: Fanvue
          x: 3
          'y': 4
          note: 以 AI 为重点的挑战者，提供订阅和 PPV，但受众规模不及 OnlyFans。
        - label: MYM
          x: 4
          'y': 3
          note: 以发现为导向的法国 / 欧洲替代平台，变现工具有一定实力，但实际费率更高。
        - label: Patreon
          x: 3
          'y': 1
          note: 主流会员平台，认知度广，但不适合显性成人内容变现。
        - label: Partut
          x: 1
          'y': 3
          note: 费率模式的离群者，最大化创作者到手收入，但发现仍由创作者自行提供。
    approximationNotes: 坐标是基于平台发现能力、费率结构、变现形式和政策适配度等引用比较综合出的、有证据支持的序数分数，不是独立基准测量或推断出的市场份额数据。
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP007
      - CP009
      - CP010
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: OnlyFans 将创作者导入的流量转化为订阅和交易型增购，从粉丝需求中变现，并固定收取 20% 的佣金。
    data:
      nodes:
        - id: traffic
          label: 外部粉丝获客
          displayValue: X / Instagram / TikTok / Reddit / Google
          detail: 由于 OnlyFans 原生发现能力有限，创作者从站外获取粉丝。
        - id: pricing
          label: 创作者设定访问价格
          displayValue: $4.99-$49.99 subscriptions
          detail: 创作者控制公开标价，也可以提供免费或低价入门优惠。
        - id: transactions
          label: 订阅 + PPV + 打赏
          displayValue: Recurring and one-off spend
          detail: 头部创作者的变现越来越依靠 PPV 和其他交易型增购。
        - id: payments
          label: OnlyFans 支付层
          displayValue: Processing, moderation, payout operations
          detail: 平台撮合支付，并承担对银行卡网络和合规的依赖。
        - id: creator-payout
          label: 创作者收款
          displayValue: 80% creator share
          detail: 2023 年摘要称向创作者支付约 $5.32B；2024 年摘要称为 $5.8B。
        - id: platform-revenue
          label: 平台留存收入
          displayValue: 20% OnlyFans share
          detail: 2023 年报告的平台收入为 $1.306696B；之后的 2024 年摘要称净收入为 $1.41B。
      edges:
        - from: traffic
          to: pricing
          label: 获得的受众进入创作者漏斗
        - from: pricing
          to: transactions
          label: 粉丝选择订阅和增购优惠
        - from: transactions
          to: payments
          label: 网站总交易额经 OnlyFans 处理
        - from: payments
          to: creator-payout
          label: 80% 汇给创作者
        - from: creator-payout
          to: platform-revenue
          label: 平台留存 20%
    approximationNotes: 2023 年数据来自年报摘要；桥接图中的 2024-2026 年数据是第三方报道的方向性更新，并非直接摘自经审计数据。
    claimRefs:
      - CI001
      - CI003
      - CI006
      - CI007
      - CI009
      - CI013
