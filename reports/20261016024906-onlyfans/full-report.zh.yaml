  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场比“社交媒体”更窄，又比单一成人内容细分市场更宽。OnlyFans
              通过经常性订阅、按次付费解锁、打赏和付费消息，把粉丝关系直接变现。因此，最接近的比较对象是一个以成人内容为经济核心、同时吸纳名人、健身和生活方式创作者的创作者支付市场。这个定位很重要，因为买方行为取决于用户是否愿意为独家内容和互动付费，而不是单纯追求受众触达。主要替代方案包括传统色情工作室和片段商店、降低付费意愿的免费成人视频网站，以及
              Patreon 类订阅或私密社区等创作者工具；后者可以在不包含成人内容的情况下实现粉丝直接变现。平台外社交媒体仍是漏斗顶部的发现层，因此市场边界必须纳入对其他网络获客的依赖，但不能把这些网络整体的广告或社交
              TAM 重复计算进去。
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
      - number: '2.2'
        title: 受证据约束的市场规模与变现视角
        blocks:
          - type: paragraph
            body: >-
              公开披露支持强规模逻辑，但不能据此随意得出“巨大 TAM”的结论。FY2025 粉丝总支付额达到 $7.84 billion，其中 $6.29 billion 支付给创作者，$1.55 billion
              留作平台净收入；创作者账户达到 5.063 million，注册粉丝账户达到 437.1
              million。增长仍为正，但已从疫情时期的高峰放缓至个位数，因此支出质量和转化比注册量本身更重要。公开追踪数据还显示出极端集中：用总支付额推算的平均创作者经济表现，会高估典型结果，因为创作者收入中位数远低于平均数。综合来看，最好的规模观察方法是分层看参与、活跃和变现，而不是用一个宽泛估计把所有注册用户或创作者经济支出都视为同等可触达。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              这是一个结构性的双边市场。创作者是经济供给方，也是平台获取用户的主要对象；粉丝则是实际付费方，其支出决定粉丝总支付额和可变现留存。这形成了分层采用路径：独立创作者看重高分成率和对粉丝的直接控制；机构管理的创作者看重运营杠杆和更高的消息变现；名人创作者把
              OnlyFans
              当作高级粉丝访问层；粉丝购买的是亲密感、独家性和即时回应，而不只是泛媒体消费。重要的是，公开证据暗示注册账户数量显著超过活跃参与者，因此可用市场应围绕重复消费群体和高意向创作者来界定，而不是所有曾创建过的账户。由此，预算方在粉丝侧是分散的消费者可选支出，在供给侧则是创作者时间和推广支出。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              现有证据中有三项采用驱动因素最突出：固定的 80/20 分成、通过打赏和按次付费消息把订阅之外的变现继续做深，以及利用平台外社交渠道低成本获客。这些优势也暴露出主要约束。支付处理商和银行合作伙伴仍是
              OnlyFans 能托管什么内容的硬上限，2021 年试图禁播色情内容后又撤回就说明了这一点。创作者侧也受到机构和“OFM”管理者带来的商业化摩擦：它们可能提升粉丝转化，却也会抽走税前收入的
              50%-70%，并带来剥削风险。最后，市场规模最重要的未知数仍未解决：现有证据没有公开活跃付费订阅用户数、队列留存、创作者流失，以及针对非成人相邻市场的清晰且不重叠的
              SAM/SOM。因此，任何估值工作都应将这些视为尽调问题，而不是自行填补的事实。
            claimRefs:
              - CM002
              - CM010
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: OnlyFans 是一个窄而深的支付市场
            body: 最有力的公开证据并不是 OnlyFans 覆盖了所有创作者经济支出，而是它通过直接支付、重复消息和强创作者经济表现，异常有效地变现了其中一个高意向子集。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: callout
            title: 注册账户规模高估了可用需求
            body: 公开账户总数很亮眼，但活跃队列、付费转化和留存仍是前瞻采用与估值工作最关键、也最缺失的分母。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：直接平台、替代方案与现状
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合不只是成人订阅克隆平台。直接同行包括 Fansly、Fanvue、MYM、LoyalFans 以及其他原生成人订阅平台，它们争夺相同的创作者和粉丝变现流。相邻或替代选择包括面向品牌安全会员的
              Patreon 和 Ko-fi、目录式视频变现平台 ManyVids，以及这样一种现状：用 OnlyFans 作为付费终点，同时从 TikTok、X、Instagram、Reddit
              等外部漏斗获取需求。多个来源独立将 OnlyFans
              描述为规模领导者，但也一致认为，创作者越来越多地同时经营多个平台，因为各平台在发现能力、地域和政策匹配上不同。因此，买方可以混合使用直接竞争者、相邻品类和平台外受众建设来完成同一变现任务，而不必只依赖
              OnlyFans。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
