            title: 支付与信任控制是产品依赖，不是合规旁枝
            body: 2021 年银行压力下的政策反复，以及 BBC 在 2026 年对 OFM 滥用的报道，都显示支付交易对手和创作者保护工作流可以直接改变产品能提供什么，以及创作者能否安全使用产品。
            calloutType: risk
            claimRefs:
