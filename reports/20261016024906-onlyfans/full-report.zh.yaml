              最强的硬证据来自监管，而非假设。Ofcom 在发现 Fenix International 对年龄保障控制的正式信息要求作出不准确回复后，对其处以 £1.05 million 罚款；其中包括申诉年龄设置被报告为
              23 岁，而系统实际上自 2021 年 11 月起一直设为 20 岁。这一事件的意义不止于罚款本身：监管机构称公司花了超过 16
              个月才发现错误数据，说明问题在于流程和治理薄弱，而非一次性的文书疏漏。法律暴露还超出年龄保障。Courthouse News 报道称，HMRC 追讨 £11.2 million 欠税，并赢得 ECJ 裁决，认定
              OnlyFans 是对全部收入金额承担责任的供应商；相邻报道还称消费者法和类似疏忽的索赔仍在进行或预计出现。因此，投资判断必须把法律风险视为持续的控制问题，而不只是声誉负担。
