  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的判断
        blocks:
          - type: paragraph
            body: >-
              当前风险堆栈由监管/治理暴露领头，因为 Ofcom 已因 Fenix International 提交不准确的年龄保障信息而对其罚款，并明确批评公司的事实核查和治理流程。OnlyFans
              对支付通道的依赖进一步放大了这一首要风险：公司通过卡组织和银行处理数十亿美元创作者付款，而这些机构已经证明自己有能力迫使平台反复调整政策。第三个严重风险簇在创作者运营：BBC
              报道及相关报道描述了围绕庞大创作者基础的剥削性平台外机构、账户控制滥用和付款转移风险。财务韧性降低了眼前的偿付能力担忧，但若监管机构升级行动、支付中介限制服务，或据称涉及类似疏忽责任的创作者索赔开始获得关注，它并不能消除击穿投资逻辑的情景。
