          - type: paragraph
            body: >-
              创作者侧风险格外重要，因为平台供给本身就是收入引擎。BBC 报道发现，英国创作者指称 OnlyFans 管理者生态中存在威胁、暴力、账户锁定、付款转移，以及拿走最高 70% 收入的合同。OnlyFans 对
              BBC
              的立场是，公司不认可这些机构，也无法影响平台外合同；这限制了公司对一种仍可能损害创作者供给、信任和未来诉讼态势的风险进行直接缓解。平台条款和更广泛的安全报道又增加了摩擦：创作者可能承担拒付损失、面临付款冻结或准备金，并在一个私信未采用端到端加密且内容盗版普遍存在的服务上运营。这些单项都不具备生存性威胁，但合在一起，确实给高端创作者带来流失、信任和注意义务问题。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR015
      - number: '7.4'
        title: 依赖风险、缓解措施与终止标准
        blocks:
          - type: paragraph
            body: >-
              关键依赖风险集中在 OnlyFans 无法完全控制的交易对手上。Think Insights 的模型评估认为，几乎所有收入都通过卡支付流动，并称 Stripe、Visa、Mastercard 和 Discover
              是必需的支付通道；该评估还指出，2021 年露骨内容禁令公告只有在银行合作伙伴保证之后才撤回。即使需求保持不变，支付处理商、银行或监管机构再次干预也会直接冲击变现。现有缓解措施确实存在，但力度不均：3D
              Secure、身份验证器应用
              2FA、水印和支付争议工作流能处理边缘问题，但实际负担仍大量落在创作者身上，包括记录争议、保护账户和打击盗版。因此，在投入新资本前，最清晰的终止标准应是外部且可监测的：任何新的支付限制、更广泛的英国执法行动，或创作者受害索赔开始转化为可重复诉讼的明确证据，都应迫使估值重置。
            claimRefs:
              - CR008
              - CR009
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR009
              - CR015
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 最上层投资逻辑破坏触发点
            body: 新的支付处理商限制或更广泛的英国执法行动会直接打击 OnlyFans 的变现层，而不只是公关层，因为公司的业务依赖卡支付通道，且已经出现监管机构记录在案的治理失误。
            calloutType: risk
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR013
          - type: callout
            title: 缓解措施不对称
            body: 已有多项有记录的缓解措施，但其中很多是 2FA、水印或争议记录等创作者侧习惯，而不是平台闭环控制。因此，即使当前没有生存性事件，剩余暴露仍然很高。
            calloutType: assumption
            claimRefs:
              - CR006
              - CR011
              - CR012
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              估值争论的核心不是 OnlyFans
              是否具备规模或盈利能力；证据集显示两者都具备。更难的问题是，在对治理不透明、成人内容支付脆弱性和创作者侧剥削风险打折之后，当前公开价格是否还留下足够上行空间。公开报道和行业数据库对 2024
              年强劲经济表现的描述趋同：20% 抽成率、约 $7.22 billion 总支付额、约 $1.41 billion 净收入和约 $684 million
              税前利润。这种现金创造能力很有意义，但最有力的已执行价格发现仍是 2026 年 5 月 Architect Capital 的少数股权交易，估值约 $3.1-$3.15
              billion。根据这些证据，价格看起来并非明显陷入困境，但在资本结构条款、治理权利和下行保护仍未披露的情况下，也没有明显便宜到足以支持买入。实际立场应是观察：认可其盈利能力，但在把当前价格视为有吸引力的机会前，要求更低的入场价或明显更充分的披露。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV009
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
      - number: '8.2'
        title: 融资背景与价格发现
        blocks:
          - type: paragraph
            body: >-
              融资历史很重要，因为对于这种规模的业务，OnlyFans 几乎没有公开股权价格发现。InforCapital 将 2026 年 5 月 Architect
              交易描述为自成立以来可确认的首轮外部融资；Wikipedia 则记录，2026 年 1 月试图以 $8 billion 出售公司 60% 股权，但没有找到买家。Think Insights
              另称，在所有权发生变化前，Architect 曾就接近 $5.5 billion 的估值进行谈判，而最终执行的少数股权交易将估值定在约 $3.15 billion。             
              这一过程说明买方愿意为该资产提供资金，但只愿意按明显低于对外宣称售价的水平出资。因此，公开证据支持把 2026 年 5
              月交易作为锚定估值，同时把更高的出售谈价视为未完成的谈判标尺，而不是可用于融资判断的成交价格。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
      - number: '8.3'
        title: 情景区间、退出逻辑与尽调问题
        blocks:
          - type: paragraph
            body: >-
              乐观情景取决于 OnlyFans 能否从庞大的支付基础上持续获得高现金转化，同时证明 2026
              年融资没有附带异常偏向投资者的保护条款。基准情景假设平台仍然高度盈利，但其成人内容结构、创作者集中度和不透明治理会让估值倍数维持在最近一次已执行交易附近。悲观情景与其说是收入崩溃，不如说是估值倍数压缩：如果监管机构或支付合作伙伴收紧标准，或者创作者剥削和盗版担忧迫使公司增加审核与合规支出，当前估值仍可能被证明偏高。FanChecked
              的收入分布估计和 BBC 对 OFM 剥削的报道，都反对假设创作者会长期无摩擦地留存。在从观察转为买入前，尽调应补齐 Architect Capital
              的条款，厘清实际员工结构和审核成本由谁承担，并改善创作者和付费方的留存及集中度披露。
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
