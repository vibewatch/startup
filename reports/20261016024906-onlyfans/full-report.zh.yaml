        - 留存材料没有关于实际应用技术栈、发布节奏或公开开发者文档的证据
      - - 变现引擎
        - 处理订阅、PPV、打赏和收款逻辑
        - 支付处理、权益校验、计费和创作者核算
        - 支付通道中断可能迫使政策改变，2021 内容禁令逆转就是例子
      - - 身份与入驻控制
        - 在发帖和启用收款前验证创作者身份
        - 政府身份证件审核、自拍 / 银行信息核验及配套流程
        - 留存材料没有关于指定供应商、人工审核率或申诉指标的证据
      - - 审核与安全运营
        - 发现并审核违禁内容、滥用行为和创作者账户控制问题
        - 机器学习分类器、哈希、支持人员和升级流程
        - 公开证据不足以让控制效果接受审计，BBC 报道也显示创作者保护仍存在缺口
      - - 支持与分析层
        - 创作者支持，加上产品内统计和运营协助
        - 人工审核 / 支持组织及分析埋点
        - 高度依赖人工运营，成本可能很高，也难以稳定规模化
    notes: 各行结合了直接披露和外部从业者基准；OnlyFans 未指明供应商或技术选择的部分，依赖关系按功能描述，而不是已验证的实现事实。
