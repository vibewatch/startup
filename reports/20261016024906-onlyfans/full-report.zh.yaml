      - number: '1.3'
        title: 里程碑与当前风险态势
        blocks:
          - type: paragraph
            body: >-
              现有证据中的带日期里程碑显示，OnlyFans 从 2016 年上线发展为一个规模化、受监管的平台，并不时尝试把品牌拓展到成人订阅之外。OFTV 于 2021 年 8 月上线，LinkedIn
              当前关于流媒体、时尚、体育、喜剧和金融工具的信息，都表明管理层希望外界将公司视为更广义的创作者平台。即便如此，同一批证据仍将公司与成人内容经济以及限制平台可承载内容的基础设施供应商紧密联系在一起。


              两条风险线最突出。第一，2021 年银行压力下撤回显性内容禁令，凸显模式仍暴露于支付通道和合规要求。第二，BBC 在 2026 年的报道认为，具有剥削性的 OnlyFans
              管理机构可能伤害创作者，而平台保护创作者的力度不足；Ofcom 在 2024-2025 年的执法过程则显示，监管机构已经在检验公司的控制措施。综合来看，OnlyFans
              运营实力强，但对治理高度敏感：高规模和强现金创造能力，与控制权集中、合规依赖和创作者信任风险并存。
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
