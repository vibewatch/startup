chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品模式与已披露规模
        blocks:
          - type: paragraph
            body: >-
              OnlyFans 将自己定位为一家 2016
              年创立、总部位于伦敦的私人娱乐公司。现有证据一致将其描述为直接连接创作者与订阅用户的平台，而不是依靠广告收入的社交网络。其变现组合很直白：订阅、按次付费内容、付费私信和打赏；OnlyFans 留存
              20%，创作者获得 80%。这种简单性很重要，因为它解释了为什么公开的 FY2024 摘要能同时显示极高的交易额和盈利能力，却没有披露同等庞大的员工队伍。


              当前资料池里的公开规模数据虽有明确方向，但还不完整，不能当作完整的运营 KPI。多份公开摘要指向 FY2024 约 $7.22 billion 的粉丝总支付额、约 $1.41 billion 的净收入、约
              $684 million 的税前利润、约 377.5 million 个累计粉丝账户，以及约 4.6 million
              个创作者账户。这些数字可作为后续章节的事实锚点，但没有披露活跃付费用户、创作者集中度，也没有给出超出 LinkedIn 宽泛 51-200 区间的准确当前员工数。
