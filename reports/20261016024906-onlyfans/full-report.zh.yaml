      - number: '4.2'
        title: GTM 动能与创作者经济
        blocks:
          - type: paragraph
            body: >-
              OnlyFans 的表现不像经典 SaaS，更像一个把需求生成外包给供给方的市场。创作者必须通过 X、Instagram、TikTok、Reddit、Google
              和相邻渠道在平台外获取粉丝，因为产品没有提供有意义的原生发现能力。即使创作者层面的获客成本上升，平台收入仍可继续复合增长；但公开平台指标几乎无法说明回本、流失或创作者中位数层面的供给可持续性。

              公开的创作者经济证据明显偏斜。多份第三方摘要称，按次付费和一次性交易是头部创作者的主要变现引擎，同时显示出极端集中曲线：头部 1% 的创作者拿走约三分之一的收入，而创作者收入中位数低于每月
              $200。这一组合支持有利的平台抽成模型，却削弱了对收入质量的信心，因为供给健康取决于是否有足够多的创作者在平台外营销和（在很多情况下）机构费用之后仍能获得有吸引力的净收入。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
