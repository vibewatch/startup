      - number: '5.2'
        title: 运营架构部分可见，且高度依赖运营团队
        blocks:
          - type: paragraph
            body: >-
              保留资料中没有 OnlyFans 的直接工程架构文件、公开 API 参考或状态/SLO
              披露，因此必须谨慎界定内部技术栈。能直接看到的是功能架构：面向创作者的发布和互动界面、面向粉丝的付费内容消费、计费和付款、分析，以及规模可观的信任与安全层。面向类似 OnlyFans
              平台的             
              外部从业者基准会汇聚到同样的架构模块——前端客户端、处理订阅和支付的后端服务、内容交付、身份认证、数据库、云基础设施以及审核/合规系统——这对尽调有方向性价值，但不能替代公司披露。公开规模指标提升了这些不可见内部系统的重要性：官方创作者网站称有
              4M+ 创作者和 400M+ 用户，而独立的基于文件统计显示，截至 2025 财年有 5.06M 个创作者账户和 437.1M 个累计粉丝账户。保留的 Wikipedia 摘要还称公司约有 1,000 人，其中
              80% 专注于审核和支持，这说明人工运营仍是服务交付的核心部分，而不是事后才想到的后台工作。
