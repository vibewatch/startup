      - number: '5.3'
        title: 信任、安全与支付通道依赖仍是核心技术风险
        blocks:
          - type: paragraph
            body: >-
              现有控制措施的证据喜忧参半。官方入驻流程要求创作者在变现前接受身份和银行审核，保留的 Wikipedia 摘要称，准创作者必须在发布前提供九项以上个人身份信息和文件。同一摘要称，OnlyFans
              后来在安全项目中披露了机器学习分类器和 CSAM 哈希，但也指出批评者认为公开数字含义不清。外部事件说明这些控制为何重要：2021 年，OnlyFans
              曾短暂宣布禁止露骨性内容，因为银行支持正在撤出；六天后又撤回决定，显示其对支付和银行交易对手存在实质依赖。最近，BBC
              报道称，具有剥削性的第三方“OFM”管理者仍从创作者那里攫取账户访问权和经济利益；受访专家告诉
              BBC，平台保护创作者免受剥削的力度不足。综合这些信号，产品判断是商业上成熟但运营上暴露：工作流已经跑通，但在把信任与安全视为已解决风险前，尽调仍需获取供应商技术栈、安全认证、滥用响应指标和支付韧性设计的硬证据。
