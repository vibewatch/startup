      - number: '1.2'
        title: 领导层、所有权与控制权
        blocks:
          - type: paragraph
            body: >-
              现有资料将创始人身份、日常经营领导和最终控制权清楚区分开来。Tim Stokely 与 2016 年创办 OnlyFans 的叙事相连，但控制权于 2018 年 10 月转至 Leonid
              Radvinsky，随后在 2026 年 3 月转至 Yekaterina Chudnovsky。Keily Blair 自 2023 年 7 月起担任 CEO，并于 2026 年 5 月加入 Fenix
              董事会。当前阶段，她是最主要的可见经营高管，但所有权似乎集中在其他人手中。


              这一区分对尽调很关键，因为 2026 年融资似乎引入了外部投资者，却没有公开由此形成的治理结构。InforCapital 的融资摘要称，OnlyFans 直到 2026 年才获得外部风险资本，当时
              Architect Capital 领投了一笔 $535 million 的少数股权投资，估值约 $3.1-$3.15
              billion。资料池没有披露条款清单、董事会权利、清算优先权或下行保护，因此后续投资判断应把所有权集中和少数股东保护机制视为仍待尽调的问题，而不是既定事实。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO016
