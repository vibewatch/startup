      - number: '6.2'
        title: Adoption proof is strong at the top of the funnel, weaker on active-paying depth
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is strongest on disclosed reach and creator-payout scale. Independent summaries of
              FY2024 disclosures converge around roughly 4.6 million creator accounts and about 377 million to 377.5
              million fan or user accounts, while Think Insights traces growth from roughly 7.5 million users in early
              2020 to more than 85 million within a year. Creator payouts also appear enormous, with cited FY2024
              payouts of $5.8 billion and cumulative payouts above $25 billion since launch. The limitation is
              denominator quality: these are registered or cumulative counts, not active-paying fans, and the source
              pool does not provide a verified public cohort view showing how many of those accounts remain active or
              pay repeatedly over time.
            claimRefs:
              - CU004
