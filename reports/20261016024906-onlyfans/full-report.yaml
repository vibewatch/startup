      - number: '3.3'
        title: Switching costs are moderated by external distribution and multi-homing
        blocks:
          - type: paragraph
            body: >-
              OnlyFans' strongest advantage is market gravity, not locked-in software. Sources consistently note that
              creators still have to acquire most demand off-platform, which lowers technical switching costs because
              the top of funnel often lives on external social networks rather than inside OnlyFans. At the same time,
              the operational model is not frictionless: messaging playbooks, tiering logic, payout rules, and regional
              audience fit differ across platforms, so creators that expand to Fansly, MYM, Fanvue, or LoyalFans usually
              run a portfolio rather than a full cutover. That points to moderate switching costs and high multi-homing:
              the creator can reuse content and audience intent, but performance still depends on platform-specific
              optimization and tooling. 
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP008
              - CP010
              - CP012
      - number: '3.4'
        title: Durability depends on network scale, while adverse evidence centers on policy and feature commoditization
        blocks:
          - type: paragraph
            body: >-
              Adverse evidence suggests OnlyFans can lose marginal creator supply when trust in policy or payments
              weakens. The 2021 adult-content reversal, attributed to payment and banking pressure, created a visible
              opening for Fansly, which multiple sources cite as benefiting from that moment. More recent comparison
              content also frames fees, limited internal promotion, and policy instability as reasons creators test
              alternatives. This does not erase OnlyFans' incumbent advantage: the platform still combines the largest
              user base, a mature creator economy, and entrenched buyer familiarity. But it does mean differentiation
              durability is uneven. If rivals keep matching the 80/20 economics while improving discovery, analytics, or
              creator tooling, OnlyFans' moat remains scale-based and therefore vulnerable to gradual multi-platform
              leakage rather than an abrupt winner-take-all collapse.
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Feature parity limits pricing power
            body: >-
              Direct peers usually do not beat OnlyFans on headline commission; they attack discovery, analytics, AI
              tooling, or regional fit instead. That means OnlyFans' pricing power is constrained if creators continue
              to treat it as one leg of a multi-platform stack rather than as their only monetization home.
            calloutType: risk
            claimRefs:
              - CP007
              - CP010
              - CP014
          - type: callout
            title: The real substitute is often "OnlyFans plus something else"
            body: >-
              The strongest substitute pattern is not a full platform swap but portfolio monetization: creators pair
              OnlyFans with a discovery-led or niche-fit second platform to reduce dependence on one set of rules, one
              payment system, or one audience geography.
            calloutType: insight
            claimRefs:
              - CP008
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public scale
        blocks:
          - type: paragraph
            body: >-
              Public evidence is consistent on the core monetization mechanic: OnlyFans sits between fans and creators,
              processes subscriptions, pay-per-view unlocks, tips, and live or custom interactions, then retains a flat
              20% commission while remitting 80% to creators. That produces a simple and scalable revenue bridge, but
              the public disclosures mix audited-looking 2023 figures with 2024-2026 third-party summaries, so list
              pricing and platform scale are better supported than realized ARPPU, payer conversion, or any clean
              revenue-mix disclosure.


              The strongest public scale anchors are the 2023 annual-report summaries and later third-party 2024-2026
              updates. UpMarket reports 2023 gross site volume of $6.63 billion, $1.31 billion of platform revenue, and
              roughly $5.32 billion of creator payouts, while later summaries place the platform near 377 million
              registered users, 4.6 million creators, and more than $8 billion of annual gross transaction volume in
              2026. Those numbers are directionally strong for top-line durability, but investors still need management
              data on paying-user counts, average spend, and concentration before treating gross volume as high-quality
              revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
