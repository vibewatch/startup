  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of platform positioning using source-backed comparisons of native discovery and adult-subscription
      monetization depth; scores indicate relative fit, not audited market shares.
    data:
      xAxis:
        label: Native discovery / distribution leverage (1 = almost entirely external traffic; 5 = strong internal discovery)
        min: 1
        max: 5
      yAxis:
        label: >-
          Monetization depth for adult subscription creators (1 = restricted / narrow; 5 = adult-native multi-revenue
          stack)
        min: 1
        max: 5
      points:
        - label: OnlyFans
          x: 1
          'y': 5
          note: >-
            Largest incumbent with deep PPV monetization, but multiple sources say creators must source most traffic
            off-platform.
        - label: Fansly
          x: 4
          'y': 4
          note: Direct peer with search/discovery, tiering, and stronger tooling, but still smaller than OnlyFans.
        - label: Fanvue
          x: 3
          'y': 4
          note: AI-forward challenger with subscriptions and PPV, but less audience scale than OnlyFans.
        - label: MYM
          x: 4
          'y': 3
          note: Discovery-led French / European alternative with meaningful monetization tools but higher effective fees.
        - label: Patreon
          x: 3
          'y': 1
          note: Mainstream membership platform with broad awareness but poor fit for explicit adult monetization.
        - label: Partut
          x: 1
          'y': 3
          note: Fee-model outlier that maximizes creator take-home, but discovery is still creator-supplied.
    approximationNotes: >-
      Coordinates are evidence-backed ordinal scores synthesized from cited platform comparisons about discovery, fee
      structures, monetization formats, and policy fit. They are not independent benchmark measurements or inferred
      market-share data.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP007
      - CP009
      - CP010
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      OnlyFans monetizes fan demand by routing creator-led traffic into subscriptions and transactional upsells, then
      keeping a flat 20% commission.
    data:
      nodes:
        - id: traffic
          label: External fan acquisition
          displayValue: X / Instagram / TikTok / Reddit / Google
          detail: Creators acquire fans off-platform because OnlyFans offers little native discovery.
        - id: pricing
          label: Creator-set access pricing
          displayValue: $4.99-$49.99 subscriptions
          detail: Creators control public list prices and can also run free or low-cost entry offers.
        - id: transactions
          label: Subscriptions + PPV + tips
          displayValue: Recurring and one-off spend
          detail: Top-performer monetization increasingly leans on PPV and other transactional upsells.
        - id: payments
          label: OnlyFans payment layer
          displayValue: Processing, moderation, payout operations
          detail: The platform intermediates payments and bears card-network and compliance dependency.
        - id: creator-payout
          label: Creator payout
          displayValue: 80% creator share
          detail: 2023 summaries cite roughly $5.32B paid to creators; 2024 summaries cite $5.8B.
        - id: platform-revenue
          label: Platform revenue retained
          displayValue: 20% OnlyFans share
          detail: 2023 reported platform revenue was $1.306696B; later 2024 summaries cite $1.41B net revenue.
      edges:
        - from: traffic
          to: pricing
          label: Acquired audience enters creator funnel
        - from: pricing
          to: transactions
          label: Fans choose subscription and upsell offers
        - from: transactions
          to: payments
          label: Gross site volume is processed through OnlyFans
        - from: payments
          to: creator-payout
          label: 80% remitted to creators
        - from: creator-payout
          to: platform-revenue
          label: 20% retained by the platform
    approximationNotes: >-
      2023 values come from annual-report summaries; 2024-2026 values in this bridge are third-party-reported
      directional updates rather than direct audited extracts.
    claimRefs:
      - CI001
      - CI003
      - CI006
      - CI007
      - CI009
      - CI013
