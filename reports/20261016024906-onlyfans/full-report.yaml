  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked view
        blocks:
          - type: paragraph
            body: >-
              The current risk stack is led by regulatory/governance exposure, because Ofcom has already fined Fenix
              International for inaccurate age-assurance submissions and explicitly criticized the company's
              fact-checking and governance processes. That top risk is amplified by OnlyFans' payment-rail dependence:
              the business processes billions of dollars of creator payouts through card networks and banks that have
              already demonstrated their ability to force policy reversals. A third severe cluster sits in creator
              operations, where BBC reporting and adjacent coverage describe exploitative off-platform agencies,
              account-control abuse, and payout diversion risks around a large creator base. Financial resilience
              reduces immediate solvency concern, but it does not neutralize thesis-break scenarios if a regulator
              escalates, a payment intermediary restricts service, or negligence-style creator claims gain traction.
            claimRefs:
              - CR001
              - CR003
              - CR008
              - CR009
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR008
              - CR009
              - CR011
              - CR012
              - CR015
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The strongest hard evidence is regulatory, not hypothetical. Ofcom fined Fenix International £1.05 million
              after finding inaccurate responses to formal information requests about age-assurance controls, including
              a challenge-age setting reported as 23 when the system had in fact been set at 20 since November 2021.
              That matters beyond the fine itself: the regulator said it took the company more than 16 months to
              discover the bad data, which points to process and governance weakness rather than a one-off clerical
              miss. Legal exposure also extends beyond age assurance. Courthouse News reported that HMRC pursued £11.2
              million in back taxes and won an ECJ ruling that treated OnlyFans as the supplier liable on the full
              revenue amount, while consumer-law and negligence-style claims remain active or forecast in adjacent
              reporting. Underwriting therefore has to treat legal risk as a live control issue, not just a reputational
              overhang.
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR014
      - number: '7.3'
        title: Creator safety, trust, and operating risk
        blocks:
          - type: paragraph
            body: >-
              Creator-side risk is unusually important because the platform's supply base is itself the revenue engine.
              BBC reporting found UK creators alleging threats, violence, account lockouts, payout diversion, and
              contracts taking up to 70% of earnings inside the OnlyFans-manager ecosystem. OnlyFans' own position to
              the BBC was that it does not endorse agencies and cannot influence those off-platform contracts, which
              limits direct mitigation on a risk that can still damage creator supply, trust, and future litigation
              posture. The platform's terms and broader safety reporting add more friction: creators can bear chargeback
              losses, face payout holds or reserves, and operate on a service where direct messages are not end-to-end
              encrypted and content piracy remains widespread. Those are not existential individually, but together they
              create a real churn, trust, and duty-of-care problem for premium creators.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
              - CR015
      - number: '7.4'
        title: Dependency risk, mitigations, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The key dependency risk is concentrated in counterparties that sit outside OnlyFans' full control. Think
              Insights' model review argues that virtually all revenue moves through card payments and names Stripe,
              Visa, Mastercard, and Discover as essential rails, while also noting that the 2021 explicit-content ban
              announcement was reversed only after banking-partner assurances. That means a renewed processor, bank, or
              regulator intervention would hit monetization directly even if demand remained intact. Existing
              mitigations are real but uneven: 3D Secure, authenticator-app 2FA, watermarking, and a payment-dispute
              workflow help around the edges, yet much of the practical burden still falls on creators to document
              disputes, secure accounts, and police piracy. The cleanest kill criteria before underwriting fresh capital
              are therefore external and monitorable: any new payment restriction, a materially broader UK enforcement
              step, or clear evidence that creator harm claims are turning into repeatable litigation should force a
              valuation reset.
            claimRefs:
              - CR008
              - CR009
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR009
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Top thesis-break trigger
            body: >-
              A new processor restriction or broader UK enforcement step would hit OnlyFans at the monetization layer,
              not just at the PR layer, because the business depends on card rails and has already absorbed a
              regulator-documented governance failure.
            calloutType: risk
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR013
          - type: callout
            title: Mitigation asymmetry
            body: >-
              Several documented mitigations exist, but many are creator-side habits such as 2FA, watermarking, or
              dispute documentation rather than closed-loop platform controls, so residual exposure stays high even
              without a current existential incident.
            calloutType: assumption
            claimRefs:
              - CR006
              - CR011
              - CR012
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The core valuation debate is not whether OnlyFans has scale or profitability; the evidence set shows both.
              The harder question is whether the available public mark leaves enough upside after discounting governance
              opacity, adult-content payment fragility, and creator-side exploitation risk. Public reporting and sector
              databases converge on strong 2024 economics: a 20% take rate, about $7.22 billion of gross payments,
              roughly $1.41 billion of net revenue, and about $684 million of pre-tax profit. That cash generation is
              meaningful, but the strongest executed price discovery is still the May 2026 Architect Capital minority
              transaction at roughly $3.1-$3.15 billion. On that evidence, the price is not obviously distressed, yet it
              is also not clearly attractive enough to justify a buy when the capital structure terms, governance
              rights, and downside protections remain undisclosed. The practical stance is track: underwrite the
              profitability, but demand either a better entry price or materially better disclosure before treating the
              current mark as a compelling opportunity.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV009
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV009
              - CV013
              - CV014
      - number: '8.2'
        title: Financing context and price discovery
        blocks:
          - type: paragraph
            body: >-
              The financing history matters because OnlyFans has relatively little public equity price discovery for a
              business of this scale. InforCapital characterizes the May 2026 Architect transaction as the first
              external capital raise identified since founding, while Wikipedia records that a January 2026 effort to
              sell 60% of the business at $8 billion found no buyer. Think Insights separately describes pre-death talks
              with Architect at a valuation near $5.5 billion before ownership shifted, while the executed minority
              stake settled near $3.15 billion. That sequence implies buyers were willing to fund the asset, but only at
              a materially lower price than the headline sale aspiration. The public evidence therefore supports using
              the May 2026 transaction as the anchor valuation, while treating higher sale talk as an unconsummated
              negotiating marker rather than a bankable clearing price.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
      - number: '8.3'
        title: Scenario range, exit logic, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The bull case depends on OnlyFans sustaining high cash conversion from a very large payment base while
              proving that the 2026 financing did not include unusually investor-friendly protections. The base case
              assumes the platform remains very profitable but that its adult content mix, creator concentration, and
              opaque governance keep the multiple near the latest executed mark. The bear case is less about revenue
              collapse than about multiple compression: if regulators or payment partners tighten standards, or if
              creator exploitation and piracy concerns force higher moderation and compliance spend, the current
              valuation could still prove full. FanChecked's earnings-distribution estimates and the BBC's reporting on
              OFM exploitation both argue against assuming frictionless long-term creator retention. Before moving from
              track to buy, diligence should close the gap on Architect Capital's terms, clarify real workforce
              structure and moderation cost ownership, and provide better retention and concentration disclosure for
              creators and payers.
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
