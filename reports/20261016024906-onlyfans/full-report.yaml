      - number: '5.3'
        title: Trust, safety, and payment-rail dependence remain the central technical risks
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence on controls is mixed. Official onboarding requires identity and banking review
              before creators can monetize, and Wikipedia's retained summary says prospective creators must provide more
              than nine pieces of personally identifying information and documents before posting. The same retained
              summary says OnlyFans later disclosed machine-learning classifiers and CSAM hashes in its safety program,
              but also notes that critics found the published figures unclear. External events show why those controls
              matter: in 2021, OnlyFans briefly announced a ban on sexually explicit content because banking support was
              being withdrawn, then reversed the decision six days later, demonstrating a material dependency on payment
              and banking counterparties. More recently, the BBC reported that exploitative third-party "OFM" managers
              still extracted account access and economics from creators, with experts telling the BBC the platform was
              not doing enough to protect creators from exploitation. Together, those signals support a product verdict
              of commercially mature but operationally exposed: the workflow is proven, but diligence still needs hard
              evidence on vendor stack, security certifications, abuse-response metrics, and payment-resilience design
              before treating trust and safety as a closed risk.
            claimRefs:
              - CE003
              - CE008
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The monetization engine is broader than subscriptions
            body: >-
              OnlyFans' product should be underwritten as a creator-payments system spanning subscriptions, PPV, tips,
              direct messaging, and livestream engagement, not as a narrow monthly-membership app.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE006
          - type: callout
            title: Payments and trust controls are product dependencies, not compliance side quests
            body: >-
              The 2021 bank-pressure reversal and the BBC's 2026 OFM abuse reporting both show that payment
              counterparties and creator-protection workflows can directly change what the product can offer and how
              safely creators can use it.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Two-sided customer base with creator-first economics
        blocks:
          - type: paragraph
            body: >-
              OnlyFans serves two interdependent customer groups: creators who use the platform to monetize audiences,
              and fans who pay for direct access to those creators. The platform's commercial design is consistent
              across the evidence in this pool: fans convert through subscriptions, pay-per-view messages, and tipping,
              while creators keep 80% of gross receipts and OnlyFans keeps a 20% platform fee. Although the brand
              remains primarily associated with pornographic creators, public descriptions also show non-adult cohorts
              including athletes, musicians, comedians, chefs, and fitness trainers, plus OFTV and other safe-for-work
              initiatives. That broadens theoretical TAM, but this source set does not quantify how much non-adult usage
              contributes to platform GMV or retention.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU015
