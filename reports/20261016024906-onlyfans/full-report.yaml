  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct platforms, substitutes, and status quo'
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than adult-subscription clones. Direct peers include Fansly,
              Fanvue, MYM, LoyalFans, and other adult-native subscription platforms that compete for the same creator
              and fan monetization flows. Adjacent or substitute options include Patreon and Ko-fi for brand-safe
              memberships, ManyVids for catalog-style video monetization, and the status quo of using OnlyFans itself as
              the paid endpoint while sourcing demand from TikTok, X, Instagram, Reddit, and other external funnels.
              Multiple sources independently describe OnlyFans as the scale leader, but they also agree that creators
              increasingly stack multiple platforms because discovery, geography, and policy fit differ by platform.
              That means buyers can solve the same monetization job through a mix of direct rivals, category
              adjacencies, and off-platform audience-building rather than through OnlyFans alone. 
            claimRefs:
