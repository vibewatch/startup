      - number: '6.3'
        title: Expansion depends on off-platform audience funnels and a fragile creator support layer
        blocks:
          - type: paragraph
            body: >-
              The best public proof of expansion is not classic SaaS retention data but creator behavior. Think Insights
              and the HBS submission both describe a model in which creators import demand from Instagram, X, TikTok,
              and other outside channels, then monetize fans through recurring subscriptions and higher-yield
              pay-per-view or direct-message offers. That makes celebrity and influencer cohorts unusually powerful:
              Mashable and Security.org both cite Bella Thorne's outsized launch economics as proof that pre-existing
              audience can compress time-to-revenue. The same model also creates fragility. BBC reporting shows a
              parallel OFM/agency layer that promises growth support but can capture 50%-70% of creator economics,
              interfere with account control, and inject payout risk. Without public NRR, GRR, churn, or top-creator
              concentration disclosures, OnlyFans looks durable in aggregate scale but hard to underwrite on cohort
              quality.
