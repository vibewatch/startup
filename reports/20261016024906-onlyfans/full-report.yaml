      - number: '4.2'
        title: GTM motion and creator economics
        blocks:
          - type: paragraph
            body: >-
              OnlyFans behaves less like classic SaaS and more like a marketplace whose demand generation is outsourced
              to its suppliers. Creators must acquire fans off-platform through X, Instagram, TikTok, Reddit, Google,
              and adjacent channels because the product does not provide meaningful native discovery. That means
              platform revenue can keep compounding even when creator-level customer-acquisition costs rise, but it also
              means public platform metrics reveal little about payback, churn, or the sustainability of supply at the
              median creator level.


              The public creator-economics evidence is notably skewed. Multiple third-party summaries describe PPV and
              one-time transactions as the dominant monetization engine for top performers, and they also show an
              extreme concentration curve in which the top 1% of creators capture roughly one-third of revenue while the
              median creator earns less than $200 per month. That combination supports a favorable platform take-rate
              model, yet it weakens revenue-quality confidence because supply health depends on whether enough creators
              can earn attractive net income after off-platform marketing and, in many cases, agency fees.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The public record still portrays OnlyFans as unusually asset-light at the platform layer. Matthew Ball's
              2024 analysis cites 2023 net revenue of $1.3 billion, gross profit of $819 million, operating profit of
              $649 million, and only 42 average employees, which is consistent with a business where creator payouts
              absorb the bulk of gross volume and the retained 20% platform share can still convert into exceptional
              margins. The 2024 Think Insights summary points in the same direction, citing $7.22 billion of gross
              revenue, $1.41 billion of net revenue, and $684 million of pre-tax profit.


              Capital adequacy is where the public file thins out. InforCapital reports a first external round in May
              2026: a $535 million minority investment led by Architect Capital at a roughly $3.15 billion valuation.
              That establishes fresh access to capital, but it does not disclose ending cash, debt, dividend policy
              after the round, or monthly burn. The available evidence therefore supports a verdict of strong historical
              profitability with unresolved financing-dependency questions, not a clean runway conclusion.
            claimRefs:
              - CI003
              - CI004
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, OnlyFans looks compelling on three public dimensions: a simple 20% take rate, unusually high
              historical platform profitability, and a creator workflow that can monetize both recurring subscriptions
              and high-ticket transactional upsells. Those qualities make the business easier to believe than most
              consumer-social monetization stories. However, the available public evidence is much weaker on revenue
              quality than on headline scale, because it does not disclose paying-account counts, cohort retention,
              churn, concentration by top creators, or realized pricing after discounts, free funnels, and agency
              intermediation.


              The biggest underwriting blocker is not whether the model can produce gross volume; it is whether current
              cash generation is durable under payment-rail pressure, regulatory scrutiny, and a creator base where
              median earnings appear weak. Until management provides post-2026 cash, burn, debt, cohort, and acquisition
              data, the prudent financial view is that OnlyFans is a highly profitable but still partially opaque
              marketplace rather than a fully underwritable compounding subscription asset.
            claimRefs:
              - CI005
              - CI006
              - CI010
              - CI012
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Payment rails are a financial chokepoint
            body: >-
              OnlyFans' attractive take-rate model still depends on banks and card networks that can pressure
              moderation, payout timing, and even permitted content, so margin durability is not independent of
              compliance execution.
            calloutType: risk
            claimRefs:
              - CI001
              - CI013
          - type: callout
            title: Headline scale overstates supply health
            body: >-
              The platform can be highly profitable even while creator earnings are sharply concentrated, which means
              GMV growth should not be read as proof that the median creator cohort is economically healthy or sticky.
            calloutType: insight
            claimRefs:
              - CI004
              - CI010
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Creator workflow and monetization surface
        blocks:
          - type: paragraph
            body: >-
              The directly evidenced product is a two-sided creator platform rather than a single subscription tool.
              Official creator onboarding materials describe a workflow in which a creator opens an account, submits
              identity and banking details for review, chooses free or paid account settings, publishes content,
              promotes the profile, and then monetizes fans through subscriptions, pay-per-view messages or posts, tips,
              and livestream-driven engagement. The same surface also exposes creator-side engagement and analytics
              features such as messaging, polls, feed posts, and statistics. That breadth matters because the strongest
              current revenue signal in the retained evidence is not simple recurring subscription expansion: an
              independent 2026 statistics compilation based on Fenix filings says pay-per-view, tips, and messages grew
              faster than subscriptions and now dominate platform revenue. Product diligence should therefore treat
              OnlyFans as a transactional creator-payments workflow with recurring access layered on top, not as a pure
              SaaS-style subscription product.
            claimRefs:
