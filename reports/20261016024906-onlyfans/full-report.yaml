              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: Growth drivers, adoption constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Three adoption drivers stand out in the assigned evidence: the flat 80/20 split, the ability to compound
              monetization beyond subscriptions through tips and pay-per-view messaging, and the use of off-platform
              social channels as low-cost customer acquisition. Those strengths also expose the main constraints.
              Payment processors and banking partners remain a hard ceiling on what OnlyFans can host, as shown by the
              2021 attempted porn ban and reversal. The creator side also faces commercialization friction from agencies
              and "OFM" managers that can improve fan conversion but also take 50%-70% of pre-tax earnings and introduce
              exploitation risk. Finally, the most important market-sizing unknowns remain unresolved: active paying
              subscriber counts, cohort retention, creator churn, and a clean non-overlapping SAM/SOM for non-adult
              adjacencies are not publicly disclosed in the assigned evidence, so any valuation work should treat those
              as diligence asks rather than filled-in facts.
            claimRefs:
              - CM002
              - CM010
              - CM012
              - CM013
