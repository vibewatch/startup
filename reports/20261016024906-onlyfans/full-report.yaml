      - number: '5.2'
        title: Operating architecture is partially visible and heavily ops-assisted
        blocks:
          - type: paragraph
            body: >-
              The retained pool does not contain a direct OnlyFans engineering architecture document, public API
              reference, or status/SLO disclosure, so the internal stack has to be bounded carefully. What is directly
              visible is the functional architecture: creator-facing publishing and engagement surfaces, fan-facing
              paywalled consumption, billing and payouts, analytics, and a substantial trust-and-safety layer. External
              practitioner benchmarks for OnlyFans-like platforms converge on the same architecture blocks - frontend
              clients, backend services handling subscriptions, payments, content delivery, authentication, databases,
              cloud infrastructure, and moderation/compliance systems - which is directionally useful for diligence but
              not a substitute for company disclosure. Public scale indicators increase the importance of those unseen
              internals: the official creator site claims 4M+ creators and 400M+ users, while independent filing-derived
              statistics show 5.06M creator accounts and 437.1M cumulative fan accounts by fiscal 2025. Wikipedia's
              retained summary also says approximately 1,000 people work at the company and 80% focus on moderation and
              support, implying that human operations remain a core part of service delivery rather than a back-office
              afterthought.
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
