      - number: '3.2'
        title: Capability and pricing comparisons favor niche advantages over a universal replacement
        blocks:
          - type: paragraph
            body: >-
              On price alone, OnlyFans is hard to distinguish from its closest adult-native peers. Several comparison
              sources describe OnlyFans, Fansly, and Fanvue as effectively standardizing around an 80/20 creator split,
              while MYM takes a more complex and often higher effective cut once banking fees are included. The sharper
              differences are product and audience mechanics: Fansly is repeatedly described as stronger on native
              discovery, tiered subscriptions, analytics, and scheduling; Fanvue differentiates through AI-enabled
              creator tooling and international positioning; Patreon has mainstream brand safety but cannot serve
              explicit adult creators as a primary replacement. The result is a landscape where switching is usually
              driven by fit to workflow, audience, or policy tolerance rather than by a step-change in platform take
              rate.
            claimRefs:
