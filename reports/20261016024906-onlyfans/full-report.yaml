        - OnlyFans says it can restrict flagged accounts and investigate
        - High
    notes: >-
      This table isolates external counterparties or ecosystems whose decisions can impair revenue, compliance, or
      creator supply even when user demand remains strong.
    claimRefs:
      - CR003
      - CR004
      - CR008
      - CR009
      - CR015
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence
      - Decision implication
    rows:
      - - Recommendation
        - track
        - Executed 2026 mark near $3.15B; unresolved term opacity
        - Do not stretch on price without better disclosure or better entry
      - - Confidence
        - medium
        - Strong profitability evidence but weak visibility into financing terms and retention
        - Underwrite the business model, not a precision valuation
      - - Risk rating
        - high
        - Creator exploitation, payment/regulatory exposure, and governance opacity remain active
        - Require hard diligence gates before underwriting upside
      - - Valuation stance
        - fair
        - Latest executed mark is not obviously cheap relative to risk and slower growth
        - Public evidence supports discipline, not urgency
    notes: >-
      Judgments synthesize the chapter's public-evidence set; valuation stance is anchored to the executed May 2026
      transaction rather than unclosed sale talk.
    claimRefs:
      - CV002
      - CV005
      - CV007
      - CV009
      - CV013
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Why it matters
      - What would change the view
    rows:
      - - Massive GMV with high profit conversion
        - A 20% take rate on billions of payments produced about $684M of pre-tax profit, proving real earnings power
        - Sustained 2025-2026 growth and audited retention data would support a higher multiple
      - - Executed financing is a stronger anchor than sale rumors
        - >-
          The $535M Architect deal near $3.15B is the cleanest public price signal, while the $8B sale process did not
          clear
        - Signed disclosure showing stronger terms, secondary demand, or a higher priced follow-on would support upside
      - - Creator-economy risks compress the multiple
        - >-
          OFM exploitation, piracy, and payment/regulatory dependence weaken durability even when current earnings look
          strong
        - Evidence of tighter creator protections, lower concentration, and payment resilience would reduce the discount
    notes: >-
      Arguments combine third-party-reported operating metrics with the strongest public 2026 financing signals; no
      private cap-table data is available in the assigned pool.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Core assumptions
      - Valuation / return logic
      - Probability signal
      - Downside / trigger
    rows:
      - - Bull
        - >-
          Architect terms are clean; creator and payer retention stay durable; moderation and payment friction stay
          manageable
        - Current mark proves conservative and a higher private clearing price becomes credible
        - Requires better disclosure plus continued cash generation
        - Breaks if regulators, banks, or creator churn materially raise friction
      - - Base
        - Business remains highly profitable but term opacity and risk discount persist
        - Latest $3.15B transaction remains the best valuation anchor and upside is modest without a cheaper entry
        - Best fit with current public evidence
        - Limited upside if governance and liquidity overhang remain unchanged
      - - Bear
        - Risk discount widens because of exploitation, payment dependency, or tighter regulation
        - Multiple compresses despite positive earnings because buyers demand protection or price concessions
        - Triggered by adverse legal, payment, or reputational developments
        - A lower-priced round, tougher deal protections, or failed sale process would reinforce downside
    notes: >-
      Scenario logic is qualitative because the source pool does not disclose retention cohorts, concentration, or
      Architect Capital's actual preference stack.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV012
      - CV013
      - CV014
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      OnlyFans' public milestone record runs from 2016 launch and incorporation through 2026 ownership change, outside
      financing, and active regulatory scrutiny.
    data:
      items:
        - date: '2016'
          label: Platform launch
          detail: Tim Stokely launches OnlyFans as a direct fan-subscription platform.
          tone: positive
          claimRefs:
            - CO009
        - date: '2016-09-01'
          label: Fenix International incorporated
          detail: The legal entity behind OnlyFans is incorporated in the UK.
          tone: neutral
          claimRefs:
            - CO009
        - date: '2018-10-03'
          label: Radvinsky control begins
          detail: Leonid Radvinsky is recorded with 75% or more of shares and voting rights.
          tone: neutral
          claimRefs:
            - CO010
        - date: '2021-08-17'
          label: OFTV launches
          detail: OnlyFans launches its safe-for-work OFTV streaming app.
          tone: positive
          claimRefs:
            - CO012
        - period: 2021-08-21 to 2021-08-25
          label: Banking-pressure policy reversal
          detail: >-
            OnlyFans announces and then suspends a planned explicit-content policy change after payment-partner
            pressure.
          tone: adverse
          claimRefs:
            - CO015
        - date: '2023-07-18'
          label: Keily Blair becomes CEO
          detail: Keily Blair succeeds Amrapali Gan as chief executive.
          tone: neutral
          claimRefs:
            - CO011
        - date: '2024-05-01'
          label: Ofcom opens investigation
          detail: UK regulator Ofcom opens an investigation into Fenix as provider of OnlyFans.
          tone: adverse
          claimRefs:
            - CO013
        - date: '2025-03-27'
          label: Ofcom fine
          detail: Ofcom fines Fenix £1.05 million for inaccurate and incomplete answers to information requests.
          tone: adverse
          claimRefs:
            - CO013
        - date: '2026-03-20'
          label: Chudnovsky control recorded
          detail: Yekaterina Chudnovsky is recorded with 75% or more of shares and voting rights.
          tone: neutral
          claimRefs:
            - CO010
        - period: 2026-05
          label: Outside capital arrives
          detail: Architect Capital leads a reported $535 million minority round at roughly $3.1-$3.15 billion valuation.
          tone: positive
          claimRefs:
            - CO016
    approximationNotes: >-
