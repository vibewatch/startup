  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitute set
        blocks:
          - type: paragraph
            body: >-
              The relevant market is narrower than "social media" and broader than a single adult-content niche.
              OnlyFans monetizes direct fan relationships through recurring subscriptions, pay-per-view unlocks, tips,
              and paid messages, so the closest benchmark is a creator-payments marketplace with adult content as the
              economic core and celebrity, fitness, and lifestyle creators as adjacencies. That framing matters because
              buyer behavior is tied to willingness to pay for exclusivity and interaction rather than pure audience
              reach. The main substitutes are legacy porn studios and clip stores, free tube sites that reduce
              willingness to pay, and creator tools such as Patreon-like subscriptions or private communities that can
              host direct fan monetization without adult content. Off-platform social surfaces remain the top-of-funnel
              discovery layer, so the market boundary must include the customer-acquisition dependence on other networks
              without double-counting those networks' entire ad or social TAMs.
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
      - number: '2.2'
        title: Evidence-constrained sizing and monetization lenses
        blocks:
          - type: paragraph
            body: >-
              Public disclosures support a strong scale case, but they do not justify a casual "huge TAM" conclusion on
              their own. FY2025 gross fan payments reached $7.84 billion, with $6.29 billion paid to creators and $1.55
              billion retained as platform net revenue; creator accounts reached 5.063 million and registered fan
              accounts reached 437.1 million. Growth is still positive, but the rate has decelerated from pandemic-era
              spikes to single digits, which makes the quality of spend and conversion more important than raw
              registrations. Public trackers also show extreme concentration: the average creator economics implied by
              total payouts overstate typical outcomes because median earnings remain far below the mean. Taken
              together, the best sizing lens is a layered view of participation, activity, and monetization, not a
              single broad estimate that treats all registered users or all creator-economy spend as equally
              addressable.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
