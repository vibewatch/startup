  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Scale and profitability support interest, but term opacity and creator/regulatory risk keep the call at track.
    data:
      nodes:
        - label: Scale proof
          summary: 2024-2026 public estimates show billions of payments and hundreds of millions of accounts.
          tone: positive
        - label: Profit proof
          summary: Public sources converge on strong take-rate economics and roughly $684M of pre-tax profit.
          tone: positive
        - label: Price anchor
          summary: The clearest executed 2026 price signal is the Architect transaction around $3.15B.
          tone: neutral
        - label: Unclosed upside story
          summary: The $8B sale ambition and ~$5.5B pre-death talk did not become a confirmed clearing price.
          tone: warning
        - label: Risk discount
          summary: OFM exploitation, payment sensitivity, and undisclosed deal protections warrant caution.
          tone: risk
        - label: Recommendation = Track
          summary: Wait for cleaner terms, better disclosure, or a lower entry before moving to buy.
          tone: opportunity
      edges:
        - from: Scale proof
          to: Profit proof
          label: validates economics
        - from: Profit proof
          to: Price anchor
          label: supports current mark
        - from: Price anchor
          to: Unclosed upside story
          label: caps sale rumor optimism
        - from: Unclosed upside story
          to: Risk discount
          label: leaves uncertainty unresolved
        - from: Risk discount
          to: Recommendation = Track
          label: drives price discipline
    approximationNotes: >-
      The flow shows analytical sequencing rather than quantified weights; the source pool does not disclose enough
      cap-table detail for a formal waterfall or return model.
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV007
      - CV009
      - CV013
      - CV014
