      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The market is structurally two-sided. Creators are the economic suppliers and the main acquisition target
              for the platform, but fans are the cash payers whose spending determines gross fan payments and
              monetizable retention. That creates a segmented adoption path: independent creators value a high payout
              rate and direct fan control; agency-managed creators value operational leverage and higher message
              monetization; celebrity creators use OnlyFans as a premium fan-access layer; and fans buy intimacy,
              exclusivity, and responsiveness rather than generic media consumption alone. Importantly, public evidence
              implies that registered accounts materially exceed active participants, so the usable market should be
              framed around repeat-spending cohorts and high-intent creators rather than every account ever created. The
              budget owner is therefore diffuse consumer discretionary spend on the fan side and creator time plus
              promotion spend on the supply side.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
