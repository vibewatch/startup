        title: Exhibits
        blocks:
          - type: callout
            title: OnlyFans is a narrow but deep payment market
            body: >-
              The strongest public evidence is not that OnlyFans addresses all creator-economy spend, but that it
              monetizes a high-intent subset unusually well through direct payments, repeat messaging, and strong
              creator economics.
            calloutType: insight
            claimRefs:
