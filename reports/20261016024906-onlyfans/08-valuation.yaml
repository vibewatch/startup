artifact: valuation
slug: onlyfans
runDate: 2026-10-16
company:
  name: OnlyFans
chapter:
  number: 8
  title: Valuation
  summary: >-
    OnlyFans remains a highly profitable creator-payments platform, but the best public 2026
    price signal is the May 2026 Architect Capital transaction at roughly a $3.15 billion
    valuation, not the earlier $8 billion sale ambition. Given opaque deal terms, slowing
    growth versus pandemic-era peaks, and persistent creator-exploitation and payment/regulatory
    risk, the evidence supports a track recommendation rather than a buy call.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: >-
      The core valuation debate is not whether OnlyFans has scale or profitability; the
      evidence set shows both. The harder question is whether the available public mark leaves
      enough upside after discounting governance opacity, adult-content payment fragility, and
      creator-side exploitation risk. Public reporting and sector databases converge on strong
      2024 economics: a 20% take rate, about $7.22 billion of gross payments, roughly $1.41
      billion of net revenue, and about $684 million of pre-tax profit. That cash generation is
      meaningful, but the strongest executed price discovery is still the May 2026 Architect
      Capital minority transaction at roughly $3.1-$3.15 billion. On that evidence, the price
      is not obviously distressed, yet it is also not clearly attractive enough to justify a buy
      when the capital structure terms, governance rights, and downside protections remain
      undisclosed. The practical stance is track: underwrite the profitability, but demand either
      a better entry price or materially better disclosure before treating the current mark as a
      compelling opportunity.
    claimRefs: [CV001, CV002, CV004, CV005, CV007, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: price-discovery
    title: Financing context and price discovery
    body: >-
      The financing history matters because OnlyFans has relatively little public equity price
      discovery for a business of this scale. InforCapital characterizes the May 2026 Architect
      transaction as the first external capital raise identified since founding, while Wikipedia
      records that a January 2026 effort to sell 60% of the business at $8 billion found no
      buyer. Think Insights separately describes pre-death talks with Architect at a valuation
      near $5.5 billion before ownership shifted, while the executed minority stake settled near
      $3.15 billion. That sequence implies buyers were willing to fund the asset, but only at a
      materially lower price than the headline sale aspiration. The public evidence therefore
      supports using the May 2026 transaction as the anchor valuation, while treating higher sale
      talk as an unconsummated negotiating marker rather than a bankable clearing price.
    claimRefs: [CV005, CV006, CV007, CV010, CV014]
    tableRefs: [TV002]
  - id: scenarios
    title: Scenario range, exit logic, and diligence asks
    body: >-
      The bull case depends on OnlyFans sustaining high cash conversion from a very large payment
      base while proving that the 2026 financing did not include unusually investor-friendly
      protections. The base case assumes the platform remains very profitable but that its adult
      content mix, creator concentration, and opaque governance keep the multiple near the latest
      executed mark. The bear case is less about revenue collapse than about multiple compression:
      if regulators or payment partners tighten standards, or if creator exploitation and piracy
      concerns force higher moderation and compliance spend, the current valuation could still
      prove full. FanChecked's earnings-distribution estimates and the BBC's reporting on OFM
      exploitation both argue against assuming frictionless long-term creator retention. Before
      moving from track to buy, diligence should close the gap on Architect Capital's terms,
      clarify real workforce structure and moderation cost ownership, and provide better retention
      and concentration disclosure for creators and payers.
    claimRefs: [CV008, CV009, CV011, CV012, CV015, CV016]
    tableRefs: [TV003]
