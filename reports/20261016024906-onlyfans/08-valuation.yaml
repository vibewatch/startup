  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: architect-capital-terms
      missingEvidence: >-
        The 2026 share purchase agreement or cap-table disclosure showing preferences, governance
        rights, liquidation protections, ratchets, and any downside protection granted to
        Architect Capital.
      whyItMatters: >-
        The executed valuation mark is usable only as a partial anchor if investor protections are
        unknown, because heavy preferences could make the headline price flatter than the real
        common-equity economics.
      diligencePath: >-
        Request the May 2026 transaction documents, current cap table, board rights letter, and
        any side letters covering liquidation preference or anti-dilution protection.
      relatedQuestionRefs: [QV006]
    - type: conflicting-data
      severity: minor
      topic: workforce-definition
      missingEvidence: >-
        A management-confirmed workforce definition separating employees, moderators, contractors,
        and outsourced operations.
      whyItMatters: >-
        Conflicting headcount figures make public productivity and fixed-cost conclusions too noisy
        to treat as a decision driver.
      diligencePath: >-
        Ask management for current FTEs, outsourced moderation scope, and the employee count used
        in any board or investor reporting.
      relatedQuestionRefs: [QV008]
