    notes: >-
      Judgments synthesize the chapter's public-evidence set; valuation stance is anchored to the
      executed May 2026 transaction rather than unclosed sale talk.
    claimRefs: [CV002, CV005, CV007, CV009, CV013]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Why it matters
      - What would change the view
    rows:
      - ["Massive GMV with high profit conversion", "A 20% take rate on billions of payments produced about $684M of pre-tax profit, proving real earnings power", "Sustained 2025-2026 growth and audited retention data would support a higher multiple"]
      - ["Executed financing is a stronger anchor than sale rumors", "The $535M Architect deal near $3.15B is the cleanest public price signal, while the $8B sale process did not clear", "Signed disclosure showing stronger terms, secondary demand, or a higher priced follow-on would support upside"]
      - ["Creator-economy risks compress the multiple", "OFM exploitation, piracy, and payment/regulatory dependence weaken durability even when current earnings look strong", "Evidence of tighter creator protections, lower concentration, and payment resilience would reduce the discount"]
    notes: >-
      Arguments combine third-party-reported operating metrics with the strongest public 2026
      financing signals; no private cap-table data is available in the assigned pool.
    claimRefs: [CV001, CV002, CV005, CV006, CV007, CV008, CV009, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Core assumptions
      - Valuation / return logic
      - Probability signal
      - Downside / trigger
    rows:
      - [Bull, "Architect terms are clean; creator and payer retention stay durable; moderation and payment friction stay manageable", "Current mark proves conservative and a higher private clearing price becomes credible", "Requires better disclosure plus continued cash generation", "Breaks if regulators, banks, or creator churn materially raise friction"]
      - [Base, "Business remains highly profitable but term opacity and risk discount persist", "Latest $3.15B transaction remains the best valuation anchor and upside is modest without a cheaper entry", "Best fit with current public evidence", "Limited upside if governance and liquidity overhang remain unchanged"]
      - [Bear, "Risk discount widens because of exploitation, payment dependency, or tighter regulation", "Multiple compresses despite positive earnings because buyers demand protection or price concessions", "Triggered by adverse legal, payment, or reputational developments", "A lower-priced round, tougher deal protections, or failed sale process would reinforce downside"]
    notes: >-
      Scenario logic is qualitative because the source pool does not disclose retention cohorts,
      concentration, or Architect Capital's actual preference stack.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Scale and profitability support interest, but term opacity and creator/regulatory risk keep the call at track.
    data:
      nodes:
        - label: Scale proof
          summary: 2024-2026 public estimates show billions of payments and hundreds of millions of accounts.
          tone: positive
        - label: Profit proof
          summary: Public sources converge on strong take-rate economics and roughly $684M of pre-tax profit.
          tone: positive
        - label: Price anchor
          summary: The clearest executed 2026 price signal is the Architect transaction around $3.15B.
          tone: neutral
        - label: Unclosed upside story
          summary: The $8B sale ambition and ~$5.5B pre-death talk did not become a confirmed clearing price.
          tone: warning
        - label: Risk discount
          summary: OFM exploitation, payment sensitivity, and undisclosed deal protections warrant caution.
          tone: risk
        - label: Recommendation = Track
          summary: Wait for cleaner terms, better disclosure, or a lower entry before moving to buy.
          tone: opportunity
      edges:
        - from: Scale proof
          to: Profit proof
          label: validates economics
        - from: Profit proof
          to: Price anchor
          label: supports current mark
        - from: Price anchor
          to: Unclosed upside story
          label: caps sale rumor optimism
        - from: Unclosed upside story
          to: Risk discount
          label: leaves uncertainty unresolved
        - from: Risk discount
          to: Recommendation = Track
          label: drives price discipline
    approximationNotes: >-
      The flow shows analytical sequencing rather than quantified weights; the source pool does
      not disclose enough cap-table detail for a formal waterfall or return model.
    claimRefs: [CV002, CV005, CV006, CV007, CV009, CV013, CV014]
