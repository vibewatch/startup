evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Exact 2026 security type, board rights, liquidation preferences, downside protection, and post-money ownership for
      Architect Capital's minority stake.
    whyItMatters: >-
      Without round mechanics, later valuation and governance analysis cannot distinguish simple minority capital from a
      more protective or controlling structure.
    diligencePath: Obtain definitive transaction documents or investor-side disclosures covering the May 2026 round.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: active-scale-and-headcount
    missingEvidence: >-
      Precise current employee count, active paying-user totals, creator concentration, and geographic distribution of
      staff and users.
    whyItMatters: >-
      Cumulative account counts and a LinkedIn employee band are insufficient for judging operational leverage, support
      burden, or customer concentration.
    diligencePath: >-
      Request current management KPI deck or audited operating metrics that separate cumulative accounts from active
      users and disclose corporate headcount.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: TO002 leadership-bench-coverage
    missingEvidence: >-
      Public evidence on the wider executive team, board committees, and functional leaders beyond the founder, CEO, and
      controlling owners.
    whyItMatters: >-
      The leadership table is intentionally partial because succession depth and control checks depend on who runs
      product, finance, compliance, and trust-and-safety below the headline principals.
    diligencePath: >-
      Pull current executive biographies, governance disclosures, and any board-committee references from
      company-controlled sources or formal filings.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: valuation-rounding
    missingEvidence: >-
      A primary document reconciling whether the 2026 round should be quoted as a $3.1 billion or $3.15 billion
      valuation and what share percentage that implies.
    whyItMatters: The difference is not thesis-breaking, but it affects precision in cap-table and return-modeling work.
    diligencePath: >-
      Reconcile the round from signed deal terms, cap-table excerpts, or investor communications rather than rounded
      press summaries.
    relatedQuestionRefs:
      - QO005
      - QO010
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: active-paying-demand
    missingEvidence: >-
      Company-level disclosure of active paying subscribers, payer conversion, cohort retention, creator churn, and fan
      ARPU by cohort.
    whyItMatters: >-
      These denominators determine whether registration growth is translating into durable monetization or simply
      enlarging a low-activity base.
    diligencePath: >-
      Request Fenix annual-report detail, board materials, or cohort dashboards that separate registered, active, and
      paying users by geography and creator segment.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: sam-som-boundary
    missingEvidence: >-
      Independent market data that isolates the addressable paid creator-subscription market outside adult content and
      separates OnlyFans-compatible spend from broader social or entertainment budgets.
    whyItMatters: >-
      Without a clean segmented TAM/SAM/SOM, valuation work risks overstating adjacencies and understating substitution
      from free or ad-supported platforms.
    diligencePath: >-
      Add industry reports, platform filings, or payment-network data that segment creator subscriptions, adult content
      spending, and premium fan-access spend by geography.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM001
      - TM002
  - type: missing-source
    severity: material
    topic: competitor-primary-metrics
    missingEvidence: >-
      Primary-source disclosures for competitor audience size, realized payout timing, and funding for Fansly, Fanvue,
      LoyalFans, and Partut.
    whyItMatters: >-
      Without primary disclosures, competitor profile rows must stay directional and cannot support tighter market-share
      or durability conclusions.
    diligencePath: >-
      Retrieve direct pricing, trust-center, investor, or company disclosure pages for the main direct peers and refresh
      the comparison with primary metrics.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: creator-switching-behavior
    missingEvidence: Cohort-level evidence on creator churn, cross-platform migration, and revenue mix by platform.
    whyItMatters: >-
      Multi-homing is well described qualitatively, but the assigned evidence set does not quantify how often creators
      fully switch versus add a second platform.
    diligencePath: >-
      Request platform cohort retention data, creator surveys, or third-party panel data that tracks account overlap and
      revenue concentration across platforms.
    relatedQuestionRefs:
      - QP004
      - QP008
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: >-
      Current cash balance, monthly burn, debt schedule, covenant package, and dividend policy after the May 2026
      Architect Capital round.
    whyItMatters: >-
      The financing round proves access to capital but does not prove adequacy, liquidity runway, or whether cash is
      being reinvested versus distributed.
    diligencePath: Request the board deck, monthly cash bridge, debt documents, and post-close treasury policy from management.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: creator-cohorts-and-retention
    missingEvidence: >-
      Active paying-user counts, payer conversion, subscriber churn, creator churn, and concentration by top creator and
      top payer cohorts.
    whyItMatters: >-
      Headline GMV and registered-user growth do not show whether the marketplace is broadening or becoming more
      dependent on a thin set of top creators and whales.
    diligencePath: Request cohort tables for paying fans and creators, plus monthly retention and concentration dashboards.
    relatedQuestionRefs:
      - QI004
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-unit-economics
    missingEvidence: >-
      Realized ARPPU, discounting, refund and chargeback rates, channel CAC, payback, and margins by subscriptions
      versus PPV, tips, and live interactions.
    whyItMatters: >-
      Public list pricing and take rate say little about revenue quality, channel efficiency, or whether growth depends
      on increasingly expensive off-platform acquisition.
    diligencePath: >-
      Request management's monetization waterfall by channel and cohort, including CAC, payback, refund, and chargeback
      reporting.
    relatedQuestionRefs:
      - QI003
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: internal-architecture-vendors
    missingEvidence: >-
      Named cloud, CDN, storage, payment, KYC, fraud, moderation, and customer-support vendors plus a current internal
      architecture diagram.
    whyItMatters: >-
      Without named implementation dependencies, it is difficult to assess concentration risk, vendor lock-in,
      architecture resilience, and regulatory exposure.
    diligencePath: >-
      Request the current production architecture, vendor inventory, and dependency map from engineering and security
      leadership.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Current SOC 2, ISO 27001, PCI-DSS scope, penetration-test summaries, uptime commitments, and incident
      history/status reporting.
    whyItMatters: >-
      Trust-and-safety claims are material to creator retention and payment-rail continuity, but the retained evidence
      does not make control quality independently auditable.
    diligencePath: >-
      Request security certifications, last two pen-test executive summaries, fraud/chargeback metrics, and any
      customer-facing uptime or incident disclosures.
  - type: private-evidence-only
    severity: material
    topic: creator-manager-controls
    missingEvidence: >-
      Policy metrics and enforcement data for third-party manager abuse, account sharing, payout reversals, and creator
      account recovery.
    whyItMatters: >-
      The BBC's reporting implies creator-protection failures can become both trust-and-safety and reputational risks,
      but the public evidence does not quantify how Often controls fail or recoveries succeed.
    diligencePath: >-
      Ask trust-and-safety and operations leaders for complaint volumes, response SLAs, payout reversal data, and
      third-party manager enforcement policies.
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: >-
      Active-paying-fan counts, creator churn, GRR/NRR, renewal behavior, and cohort-level fan or creator retention
      data.
    whyItMatters: >-
      Disclosed registered-account scale does not prove repeat monetization or customer durability, which is central to
      underwriting long-term customer quality.
    diligencePath: >-
      Obtain Fenix management reporting or investor materials with monthly paying fans, paying creators, repeat purchase
      cohorts, and creator churn by segment and geography.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A broader list of named creators or enterprise-style customer examples with disclosed outcomes, repeat spend, or
      renewal evidence across multiple segments.
    whyItMatters: >-
      Public named examples skew toward celebrities or adverse creator stories, which is not enough to judge whether
      success generalizes across the long tail.
    diligencePath: >-
      Request creator cohort case studies, top-decile and median revenue curves, and anonymized retention snapshots
      separating celebrity, independent, and agency-managed creators.
    relatedQuestionRefs:
      - QU004
      - QU008
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: payment-rail-dependency
    missingEvidence: >-
      Direct disclosure of processor concentration, reserve terms, dispute win rates, and any contingency plan if a
      major acquirer, card network, or banking partner restricts service.
    whyItMatters: >-
      The monetization engine is processor-dependent, so underwriting needs to know how quickly a single counterparty
      decision could impair payouts or content policy.
    diligencePath: >-
      Request processor contracts, reserve schedules, chargeback statistics, and board-level contingency planning for
      payment disruption.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: legal-case-status
    missingEvidence: >-
      Current docket status, expected loss ranges, and insurance coverage for auto-renewal, creator-harm, or other
      litigation that may sit behind the public reporting.
    whyItMatters: >-
      Public articles show exposure categories but not whether claims are isolated, reserved, dismissed, or growing into
      a repeatable financial drag.
    diligencePath: >-
      Pull active court dockets, insurer correspondence, outside-counsel summaries, and management's latest
      contingent-liability memo.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: security-remediation
    missingEvidence: >-
      Evidence that insider-access controls, data-retention practices, and creator-message confidentiality controls
      improved after the cited incidents.
    whyItMatters: >-
      Without remediation proof, the platform still carries governance and creator-trust risk even if no large fresh
      breach has been publicly confirmed.
    diligencePath: >-
      Request internal audit findings, access-revocation controls, DLP policies, and the latest privacy or security
      assurance artifacts.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: architect-capital-terms
    missingEvidence: >-
      The 2026 share purchase agreement or cap-table disclosure showing preferences, governance rights, liquidation
      protections, ratchets, and any downside protection granted to Architect Capital.
    whyItMatters: >-
      The executed valuation mark is usable only as a partial anchor if investor protections are unknown, because heavy
      preferences could make the headline price flatter than the real common-equity economics.
    diligencePath: >-
      Request the May 2026 transaction documents, current cap table, board rights letter, and any side letters covering
      liquidation preference or anti-dilution protection.
    relatedQuestionRefs:
      - QV006
  - type: conflicting-data
    severity: minor
    topic: workforce-definition
    missingEvidence: >-
      A management-confirmed workforce definition separating employees, moderators, contractors, and outsourced
      operations.
    whyItMatters: >-
      Conflicting headcount figures make public productivity and fixed-cost conclusions too noisy to treat as a decision
      driver.
    diligencePath: >-
      Ask management for current FTEs, outsourced moderation scope, and the employee count used in any board or investor
      reporting.
    relatedQuestionRefs:
      - QV008
