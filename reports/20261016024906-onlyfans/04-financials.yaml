company:
  name: "OnlyFans"
chapter:
  number: 4
  title: "Financials"
  summary: "OnlyFans still reads as a very high-margin transaction platform built on a flat 20% take rate and creator-funded supply, but the public record is much stronger on gross payment volume and historical profitability than on present cash, burn, realized pricing, or cohort durability. The 2026 Architect Capital round removes the immediate 'no capital available' concern, yet underwriting still depends on private disclosures for cash runway, retention, concentration, and creator acquisition efficiency."
sections:
  - id: "revenue-model-and-public-scale"
    title: "Revenue model and public scale"
    body: |-
      Public evidence is consistent on the core monetization mechanic: OnlyFans sits between fans and creators, processes subscriptions, pay-per-view unlocks, tips, and live or custom interactions, then retains a flat 20% commission while remitting 80% to creators. That produces a simple and scalable revenue bridge, but the public disclosures mix audited-looking 2023 figures with 2024-2026 third-party summaries, so list pricing and platform scale are better supported than realized ARPPU, payer conversion, or any clean revenue-mix disclosure.

      The strongest public scale anchors are the 2023 annual-report summaries and later third-party 2024-2026 updates. UpMarket reports 2023 gross site volume of $6.63 billion, $1.31 billion of platform revenue, and roughly $5.32 billion of creator payouts, while later summaries place the platform near 377 million registered users, 4.6 million creators, and more than $8 billion of annual gross transaction volume in 2026. Those numbers are directionally strong for top-line durability, but investors still need management data on paying-user counts, average spend, and concentration before treating gross volume as high-quality revenue.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI005", "CI007"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "gtm-and-creator-economics"
    title: "GTM motion and creator economics"
    body: |-
      OnlyFans behaves less like classic SaaS and more like a marketplace whose demand generation is outsourced to its suppliers. Creators must acquire fans off-platform through X, Instagram, TikTok, Reddit, Google, and adjacent channels because the product does not provide meaningful native discovery. That means platform revenue can keep compounding even when creator-level customer-acquisition costs rise, but it also means public platform metrics reveal little about payback, churn, or the sustainability of supply at the median creator level.

      The public creator-economics evidence is notably skewed. Multiple third-party summaries describe PPV and one-time transactions as the dominant monetization engine for top performers, and they also show an extreme concentration curve in which the top 1% of creators capture roughly one-third of revenue while the median creator earns less than $200 per month. That combination supports a favorable platform take-rate model, yet it weakens revenue-quality confidence because supply health depends on whether enough creators can earn attractive net income after off-platform marketing and, in many cases, agency fees.
    claimRefs: ["CI006", "CI007", "CI008", "CI009", "CI010"]
    tableRefs: ["TI003"]
  - id: "cost-structure-and-capital-adequacy"
    title: "Cost structure and capital adequacy"
    body: |-
      The public record still portrays OnlyFans as unusually asset-light at the platform layer. Matthew Ball's 2024 analysis cites 2023 net revenue of $1.3 billion, gross profit of $819 million, operating profit of $649 million, and only 42 average employees, which is consistent with a business where creator payouts absorb the bulk of gross volume and the retained 20% platform share can still convert into exceptional margins. The 2024 Think Insights summary points in the same direction, citing $7.22 billion of gross revenue, $1.41 billion of net revenue, and $684 million of pre-tax profit.

      Capital adequacy is where the public file thins out. InforCapital reports a first external round in May 2026: a $535 million minority investment led by Architect Capital at a roughly $3.15 billion valuation. That establishes fresh access to capital, but it does not disclose ending cash, debt, dividend policy after the round, or monthly burn. The available evidence therefore supports a verdict of strong historical profitability with unresolved financing-dependency questions, not a clean runway conclusion.
    claimRefs: ["CI003", "CI004", "CI011", "CI012"]
  - id: "financial-verdict-and-diligence-blockers"
    title: "Financial verdict and diligence blockers"
    body: |-
      Financially, OnlyFans looks compelling on three public dimensions: a simple 20% take rate, unusually high historical platform profitability, and a creator workflow that can monetize both recurring subscriptions and high-ticket transactional upsells. Those qualities make the business easier to believe than most consumer-social monetization stories. However, the available public evidence is much weaker on revenue quality than on headline scale, because it does not disclose paying-account counts, cohort retention, churn, concentration by top creators, or realized pricing after discounts, free funnels, and agency intermediation.

      The biggest underwriting blocker is not whether the model can produce gross volume; it is whether current cash generation is durable under payment-rail pressure, regulatory scrutiny, and a creator base where median earnings appear weak. Until management provides post-2026 cash, burn, debt, cohort, and acquisition data, the prudent financial view is that OnlyFans is a highly profitable but still partially opaque marketplace rather than a fully underwritable compounding subscription asset.
    claimRefs: ["CI005", "CI006", "CI010", "CI012", "CI013"]
