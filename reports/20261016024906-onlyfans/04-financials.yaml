    rows:
      - ["Platform take rate", "20% of creator earnings", "High", "Primary revenue lever and anchor for gross-to-net conversion", "Confirm whether any volume rebates, payment-processor pass-throughs, or category-specific exceptions exist"]
      - ["2023 platform revenue", "$1.306696B on $6.629945B gross site volume", "High", "Confirms the gross-volume-to-revenue bridge on reported 2023 data", "Provide direct filing extracts and 2024 audited continuity"]
      - ["2023 pre-tax profit", "$658M", "High", "Shows the platform layer can retain substantial profit after creator payouts and operating costs", "Provide audited 2024/2025 profit bridge and cost structure detail"]
      - ["2024 net revenue / pre-tax profit", "$1.41B net revenue; $684M pre-tax profit", "Medium", "Suggests profitability remained strong after 2023, but this worker pool holds third-party summaries rather than a filing", "Provide the original 2024 accounts and any 2025 interim update"]
      - ["Creator concentration", "Top 1% capture ~33% of revenue; median creator earns under $200/month", "Medium", "Marketplace durability depends on supply health below the top tier", "Provide creator cohort retention, concentration by top creator bands, and active-paying-user counts"]
      - ["Capital availability", "$535M minority round in May 2026; cash and burn undisclosed", "Medium", "Fresh capital reduces immediate financing pressure but does not prove runway", "Provide post-close cash balance, monthly burn, debt schedule, and dividend policy"]
    notes: "Values mix annual-report summaries with later third-party updates; undisclosed fields are diligence gaps, not negative signals by default."
    claimRefs: ["CI001", "CI003", "CI004", "CI010", "CI011", "CI012"]
