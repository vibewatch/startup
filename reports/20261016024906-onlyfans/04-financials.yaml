callouts:
  - calloutType: "risk"
    title: "Payment rails are a financial chokepoint"
    body: "OnlyFans' attractive take-rate model still depends on banks and card networks that can pressure moderation, payout timing, and even permitted content, so margin durability is not independent of compliance execution."
    claimRefs: ["CI001", "CI013"]
  - calloutType: "insight"
    title: "Headline scale overstates supply health"
    body: "The platform can be highly profitable even while creator earnings are sharply concentrated, which means GMV growth should not be read as proof that the median creator cohort is economically healthy or sticky."
    claimRefs: ["CI004", "CI010", "CI011"]
