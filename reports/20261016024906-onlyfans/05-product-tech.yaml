      - ["Publish paid content", "Upload media to creator feed and gate access behind subscriptions or PPV", "Single platform for posts, video, messages, and live interactions", "Combines recurring and transactional revenue in one workflow", "No retained evidence on storage limits, content rights tooling, or archival controls"]
      - ["Deepen fan engagement", "Fans subscribe, message, tip, and buy custom or premium interactions", "Paid messaging, polls, live streaming, and tips keep monetization inside the app", "Higher spend per fan when interaction is monetized beyond a flat subscription", "No retained evidence on conversion funnels, repeat-purchase rates, or fraud-prevention outcomes"]
      - ["Track creator performance", "Review in-product statistics and iterate pricing/content", "Officially listed statistics feature", "Keeps optimization loop on-platform rather than requiring a third-party analytics stack", "No retained evidence on metric granularity or whether analytics are real time"]
      - ["Reach non-explicit audiences", "Distribute safe-for-work video separately from the paywalled core", "OFTV free streaming product", "Potential top-of-funnel and brand diversification path", "No retained evidence on OFTV user overlap with paying fans or creator ROI"]
    notes: "This table describes the evidenced user workflow; benefit language is supported directionally by the product design, while operational KPIs remain diligence asks."
    claimRefs: ["CE001", "CE003", "CE004", "CE005", "CE006"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Client surfaces", "Web/mobile creator and fan experiences for profiles, feeds, messaging, live use, and OFTV discovery", "Frontend applications plus media delivery", "No retained evidence on actual app stack, release cadence, or public developer docs"]
      - ["Monetization engine", "Handles subscriptions, PPV, tips, and payout logic", "Payment processing, entitlement checks, billing, and creator accounting", "Payment-rail interruptions can force policy changes, as the 2021 content-ban reversal showed"]
      - ["Identity and onboarding controls", "Creator verification before posting and payout activation", "Government-ID review, selfie/banking checks, and supporting workflows", "No retained evidence on named vendors, manual-review rates, or appeal metrics"]
      - ["Moderation and safety operations", "Detect and review prohibited content, abuse, and creator account control issues", "Machine-learning classifiers, hashes, support staff, and escalation processes", "Public evidence does not make control efficacy auditable, and BBC reporting shows creator-protection gaps still exist"]
      - ["Support and analytics layer", "Creator support plus in-product statistics and operational assistance", "Human moderation/support organization and analytics instrumentation", "Heavy human-ops dependence can be costly and difficult to scale consistently"]
    notes: "Rows combine direct disclosure with external practitioner benchmarks; where OnlyFans does not name a vendor or technology choice, the dependency is described functionally rather than as a verified implementation fact."
    claimRefs: ["CE003", "CE007", "CE008", "CE009", "CE010", "CE011", "CE012", "CE013"]
