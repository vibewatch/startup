company:
  name: "OnlyFans"
chapter:
  number: 7
  title: "Risks"
  summary: "OnlyFans' highest current risks cluster around UK regulatory scrutiny, payment-rail dependence, and creator-safety failures in the surrounding agency ecosystem. The platform remains highly profitable, but the evidence suggests residual exposure is still high because several mitigations depend on creators' own controls rather than fully closed platform or governance gaps."
sections:
  - id: "ranked-risk-view"
    title: "Severity-ranked view"
    body: |-
      The current risk stack is led by regulatory/governance exposure, because Ofcom has already fined Fenix International for inaccurate age-assurance submissions and explicitly criticized the company's fact-checking and governance processes. That top risk is amplified by OnlyFans' payment-rail dependence: the business processes billions of dollars of creator payouts through card networks and banks that have already demonstrated their ability to force policy reversals. A third severe cluster sits in creator operations, where BBC reporting and adjacent coverage describe exploitative off-platform agencies, account-control abuse, and payout diversion risks around a large creator base. Financial resilience reduces immediate solvency concern, but it does not neutralize thesis-break scenarios if a regulator escalates, a payment intermediary restricts service, or negligence-style creator claims gain traction.
    claimRefs: ["CR001", "CR003", "CR008", "CR009", "CR013"]
    figureRefs: ["FR001"]
  - id: "regulatory-legal-exposure"
    title: "Regulatory and legal exposure"
    body: |-
      The strongest hard evidence is regulatory, not hypothetical. Ofcom fined Fenix International £1.05 million after finding inaccurate responses to formal information requests about age-assurance controls, including a challenge-age setting reported as 23 when the system had in fact been set at 20 since November 2021. That matters beyond the fine itself: the regulator said it took the company more than 16 months to discover the bad data, which points to process and governance weakness rather than a one-off clerical miss. Legal exposure also extends beyond age assurance. Courthouse News reported that HMRC pursued £11.2 million in back taxes and won an ECJ ruling that treated OnlyFans as the supplier liable on the full revenue amount, while consumer-law and negligence-style claims remain active or forecast in adjacent reporting. Underwriting therefore has to treat legal risk as a live control issue, not just a reputational overhang.
    claimRefs: ["CR001", "CR002", "CR010", "CR014"]
    tableRefs: ["TR001"]
  - id: "creator-safety-and-operating-risk"
    title: "Creator safety, trust, and operating risk"
    body: |-
      Creator-side risk is unusually important because the platform's supply base is itself the revenue engine. BBC reporting found UK creators alleging threats, violence, account lockouts, payout diversion, and contracts taking up to 70% of earnings inside the OnlyFans-manager ecosystem. OnlyFans' own position to the BBC was that it does not endorse agencies and cannot influence those off-platform contracts, which limits direct mitigation on a risk that can still damage creator supply, trust, and future litigation posture. The platform's terms and broader safety reporting add more friction: creators can bear chargeback losses, face payout holds or reserves, and operate on a service where direct messages are not end-to-end encrypted and content piracy remains widespread. Those are not existential individually, but together they create a real churn, trust, and duty-of-care problem for premium creators.
    claimRefs: ["CR003", "CR004", "CR005", "CR006", "CR007", "CR011", "CR012", "CR015"]
    tableRefs: ["TR002"]
  - id: "dependency-risk-and-kill-criteria"
    title: "Dependency risk, mitigations, and kill criteria"
    body: |-
      The key dependency risk is concentrated in counterparties that sit outside OnlyFans' full control. Think Insights' model review argues that virtually all revenue moves through card payments and names Stripe, Visa, Mastercard, and Discover as essential rails, while also noting that the 2021 explicit-content ban announcement was reversed only after banking-partner assurances. That means a renewed processor, bank, or regulator intervention would hit monetization directly even if demand remained intact. Existing mitigations are real but uneven: 3D Secure, authenticator-app 2FA, watermarking, and a payment-dispute workflow help around the edges, yet much of the practical burden still falls on creators to document disputes, secure accounts, and police piracy. The cleanest kill criteria before underwriting fresh capital are therefore external and monitorable: any new payment restriction, a materially broader UK enforcement step, or clear evidence that creator harm claims are turning into repeatable litigation should force a valuation reset.
    claimRefs: ["CR008", "CR009", "CR013", "CR015"]
    tableRefs: ["TR003"]
