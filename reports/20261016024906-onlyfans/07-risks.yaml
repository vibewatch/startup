callouts:
  - calloutType: "risk"
    title: "Top thesis-break trigger"
    body: "A new processor restriction or broader UK enforcement step would hit OnlyFans at the monetization layer, not just at the PR layer, because the business depends on card rails and has already absorbed a regulator-documented governance failure."
    claimRefs: ["CR001", "CR008", "CR009", "CR013"]
  - calloutType: "assumption"
    title: "Mitigation asymmetry"
    body: "Several documented mitigations exist, but many are creator-side habits such as 2FA, watermarking, or dispute documentation rather than closed-loop platform controls, so residual exposure stays high even without a current existential incident."
    claimRefs: ["CR006", "CR011", "CR012", "CR015"]
