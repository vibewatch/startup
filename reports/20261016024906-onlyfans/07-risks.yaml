    notes: "Operational risks mix platform-native controls with creator-side behaviors; severity reflects supply-side trust and monetization consequences rather than company solvency alone."
    claimRefs: ["CR003", "CR005", "CR006", "CR007", "CR011", "CR012", "CR015"]
