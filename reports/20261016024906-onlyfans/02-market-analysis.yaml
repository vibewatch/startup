slug: onlyfans
runDate: "2026-10-16"
company:
  name: OnlyFans
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    OnlyFans is best bounded as a creator-payments marketplace rather than a generic
    social-media TAM: it matches creators with paying fans through subscriptions,
    pay-per-view messages, tips, and direct messaging while keeping a flat 20% take
    rate. Public evidence supports a constrained market lens rather than a clean
    TAM/SAM/SOM, because disclosed scale is strong but active-paying demand, cohort
    retention, and ex-adult adjacencies remain only partially visible.
sections:
  - id: market-boundary
    title: Market boundary and substitute set
    body: >-
      The relevant market is narrower than "social media" and broader than a single
      adult-content niche. OnlyFans monetizes direct fan relationships through recurring
      subscriptions, pay-per-view unlocks, tips, and paid messages, so the closest
      benchmark is a creator-payments marketplace with adult content as the economic
      core and celebrity, fitness, and lifestyle creators as adjacencies. That framing
      matters because buyer behavior is tied to willingness to pay for exclusivity and
      interaction rather than pure audience reach. The main substitutes are legacy porn
      studios and clip stores, free tube sites that reduce willingness to pay, and
      creator tools such as Patreon-like subscriptions or private communities that can
      host direct fan monetization without adult content. Off-platform social surfaces
      remain the top-of-funnel discovery layer, so the market boundary must include the
      customer-acquisition dependence on other networks without double-counting those
      networks' entire ad or social TAMs.
    claimRefs: [CM001, CM002, CM010, CM011]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing and monetization lenses
    body: >-
      Public disclosures support a strong scale case, but they do not justify a casual
      "huge TAM" conclusion on their own. FY2025 gross fan payments reached $7.84
      billion, with $6.29 billion paid to creators and $1.55 billion retained as
      platform net revenue; creator accounts reached 5.063 million and registered fan
      accounts reached 437.1 million. Growth is still positive, but the rate has
      decelerated from pandemic-era spikes to single digits, which makes the quality of
      spend and conversion more important than raw registrations. Public trackers also
      show extreme concentration: the average creator economics implied by total payouts
      overstate typical outcomes because median earnings remain far below the mean.
      Taken together, the best sizing lens is a layered view of participation,
      activity, and monetization, not a single broad estimate that treats all
      registered users or all creator-economy spend as equally addressable.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-map
    title: Buyer, user, payer, and adoption path
    body: >-
      The market is structurally two-sided. Creators are the economic suppliers and the
      main acquisition target for the platform, but fans are the cash payers whose
      spending determines gross fan payments and monetizable retention. That creates a
      segmented adoption path: independent creators value a high payout rate and direct
      fan control; agency-managed creators value operational leverage and higher message
      monetization; celebrity creators use OnlyFans as a premium fan-access layer; and
      fans buy intimacy, exclusivity, and responsiveness rather than generic media
      consumption alone. Importantly, public evidence implies that registered accounts
      materially exceed active participants, so the usable market should be framed
      around repeat-spending cohorts and high-intent creators rather than every account
      ever created. The budget owner is therefore diffuse consumer discretionary spend
      on the fan side and creator time plus promotion spend on the supply side.
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM011]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Growth drivers, adoption constraints, and diligence gaps
    body: >-
      Three adoption drivers stand out in the assigned evidence: the flat 80/20 split,
      the ability to compound monetization beyond subscriptions through tips and
      pay-per-view messaging, and the use of off-platform social channels as low-cost
      customer acquisition. Those strengths also expose the main constraints. Payment
      processors and banking partners remain a hard ceiling on what OnlyFans can host,
      as shown by the 2021 attempted porn ban and reversal. The creator side also faces
      commercialization friction from agencies and "OFM" managers that can improve fan
      conversion but also take 50%-70% of pre-tax earnings and introduce exploitation
      risk. Finally, the most important market-sizing unknowns remain unresolved: active
      paying subscriber counts, cohort retention, creator churn, and a clean
      non-overlapping SAM/SOM for non-adult adjacencies are not publicly disclosed in
      the assigned evidence, so any valuation work should treat those as diligence asks
      rather than filled-in facts.
    claimRefs: [CM002, CM010, CM012, CM013]
