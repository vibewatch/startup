      - ["Agency-managed creator", "Creator or manager selecting tooling and operating model", "Creator, manager, and fans", "Fans pay; manager may take 50%-70% of creator pre-tax earnings", "Manager runs acquisition, messaging, and retention operations to raise ARPU", "Fan spend funds the system; creator gives up economics and control", "Need for scale, chat coverage, and monetization optimization."]
      - ["Celebrity / mainstream creator", "Public figure seeking premium fan monetization", "Creator and paying superfans", "Fans", "Launch account, gate exclusive access, use existing audience for conversion", "Consumer discretionary spending", "Need for a direct paid-access layer without building new commerce rails."]
      - ["High-intent fan", "Fan seeking exclusivity and direct interaction", "Fan", "Fan", "Discovers creator off-platform, subscribes, then spends further on PPV, tips, or messages", "Individual entertainment / relationship budget", "Desire for intimacy, responsiveness, and differentiated content."]
    notes: "Rows mix supply-side and demand-side segments because OnlyFans is a two-sided marketplace rather than a single-buyer SaaS workflow."
    claimRefs: [CM002, CM007, CM010, CM011, CM013]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Public evidence supports a constrained participation-and-monetization lens rather
      than a verified external TAM/SAM/SOM stack.
    data:
      items:
        - label: Registered fan accounts
          displayValue: "437.1M"
