          note: "Registered accounts; not a disclosed active-paying subscriber count."
          claimRefs: [CM006]
        - label: Registered creator accounts
          displayValue: "5.063M"
          unit: "FY2025"
          note: "Cumulative creator accounts disclosed for FY2025."
          claimRefs: [CM005]
        - label: Active fan estimate
          displayValue: "132M"
          unit: "2026 estimate"
          note: "Secondary estimate for active fans rather than a company-reported paying cohort."
          claimRefs: [CM007]
        - label: Active creator estimate
          displayValue: "2.5M"
          unit: "2026 estimate"
          note: "Secondary estimate for creators who actually took money during the fiscal year."
          claimRefs: [CM007]
        - label: Gross fan payments
          displayValue: "$7.84B"
          unit: "FY2025"
          note: "Total spend processed before creator payouts."
          claimRefs: [CM003]
        - label: Creator payouts
          displayValue: "$6.29B"
          unit: "FY2025"
          note: "80% payout layer before taxes, processor fees, and agency commissions."
          claimRefs: [CM002, CM003]
    approximationNotes: >-
      External TAM/SAM/SOM is not supportable from the assigned pool, so this pyramid
      intentionally layers disclosed account and monetization figures without implying
      direct unit conversion between registrations, active cohorts, and dollars.
    claimRefs: [CM003, CM005, CM006, CM007]
callouts:
  - calloutType: insight
    title: OnlyFans is a narrow but deep payment market
    body: >-
      The strongest public evidence is not that OnlyFans addresses all creator-economy
      spend, but that it monetizes a high-intent subset unusually well through direct
      payments, repeat messaging, and strong creator economics.
    claimRefs: [CM001, CM002, CM003, CM010]
  - calloutType: risk
    title: Registered-account scale overstates usable demand
    body: >-
      Public account totals are impressive, but active cohorts, paying conversion, and
      retention remain the missing denominators that matter most for forward adoption
      and valuation work.
    claimRefs: [CM006, CM007, CM009, CM013]
