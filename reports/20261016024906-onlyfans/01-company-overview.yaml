callouts:
  - calloutType: insight
    title: Scale is public; operating depth is not
    body: FY2024 revenue, profit, and account-scale figures are unusually large for a platform whose assigned evidence still exposes only a broad 51-200 LinkedIn employee band, so operating leverage is evident but staffing depth is not.
    claimRefs: [CO005, CO006, CO007, CO008]
  - calloutType: risk
    title: Governance and continuity risk remains concentrated
    body: Control appears concentrated in one shareholder, outside capital arrived only in 2026, and the assigned evidence still does not disclose Architect Capital's governance rights or the full remediation status of current regulatory and creator-safety concerns.
    claimRefs: [CO010, CO013, CO014, CO016]
