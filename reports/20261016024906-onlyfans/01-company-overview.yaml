      - Gap / diligence ask
    rows:
      - ["Founded / incorporation", "2016 launch; Fenix incorporated 2016-09-01", "2016", "high", "Public sources do not identify an exact public launch day."]
      - ["Headquarters", "London, England / London, United Kingdom", "current", "high", "No support in the assigned pool for additional corporate office locations."]
      - ["Current stage", "Growth-stage private company; first outside capital reported in 2026", "2026-05", "medium", "Need primary deal documentation to confirm stage language and use of proceeds."]
      - ["2026 external capital", "$535M minority round led by Architect Capital", "2026-05", "medium", "Exact share sold, preferences, and governance rights are not public here."]
      - ["Reported valuation", "$3.1B-$3.15B", "2026-05", "medium", "Public summaries round differently and do not include the underlying cap-table math."]
      - ["FY2024 gross fan payments", "$7.22B", "FY2024", "medium", "Need direct filing extracts if later chapters want primary-grade citation."]
      - ["FY2024 net revenue", "$1.41B", "FY2024", "medium", "No FY2026 revenue disclosure exists in this pool."]
      - ["FY2024 pre-tax profit", "$684M", "FY2024", "high", "Need direct filing access for full margin bridge and cash-flow detail."]
      - ["Account scale", "~377.5M cumulative fan accounts; ~4.6M creator accounts", "FY2024", "medium", "These are cumulative accounts, not active paying users or active earning creators."]
      - ["Headcount", "51-200 employees on LinkedIn", "current", "low", "Precise employee count and geographic distribution remain undisclosed in the assigned evidence."]
    notes: Public summaries in the assigned pool mix audited-year metrics with current-profile data; cumulative accounts are not active users, and undisclosed items stay explicit gaps.
    claimRefs: [CO001, CO005, CO006, CO007, CO008, CO016]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Background
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - ["Tim Stokely", "Founder; launch-era leader", "Credited with launching OnlyFans in 2016; legal incorporation sat under Fenix International.", "Established the direct-to-creator subscription model the company still uses.", "Historical rather than current operator; launch narrative remains tied to him."]
      - ["Keily Blair", "CEO since 2023; director since 2026", "Succeeded Amrapali Gan and is the most visible operating executive in current public materials.", "Owns current execution, brand diversification, and external positioning.", "High current visibility, but the pool does not expose a broader executive bench."]
      - ["Yekaterina Chudnovsky", "Controlling shareholder from 2026; director from 2026", "Recorded with 75% or more of shares and votes after Leonid Radvinsky's control entry ended.", "Represents ultimate control over board and strategic outcomes.", "Very high control concentration with little public biography or governance detail in the pool."]
      - ["Leonid Radvinsky", "Prior controlling owner (2018-2026)", "Held 75% or more of shares and votes during the scale-up period before the 2026 transition.", "Anchored the ownership regime that oversaw OnlyFans' largest growth phase.", "Transition mechanics after his death are only partially public."]
    notes: Enumeration covers the founder plus current and immediately prior control holders because those roles explain present governance and succession risk better than a longer directory would.
    enumerationScope:
      coverage: partial
      basis: Covers the founder, current CEO, current controlling shareholder, and prior controlling owner referenced in the assigned evidence set.
    claimRefs: [CO009, CO010, CO011]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["Creators", "Supply-side counterparties", "They generate platform inventory and receive 80% of gross transaction value.", "Need creator concentration, churn, and take-rate by cohort."]
      - ["Fans / subscribers", "Demand side", "Cumulative fan-account count underpins transaction volume and valuation narratives.", "Need active paying users, repeat purchase behavior, and geographic mix."]
      - ["Yekaterina Chudnovsky", "Controlling shareholder", "Public register summaries indicate 75%+ shares and voting rights from March 2026.", "Need trust, estate, and board-control mechanics."]
      - ["Architect Capital", "Minority investor and 2026 round lead", "Reported lead on the first outside capital infusion at roughly $3.1-$3.15B valuation.", "Need security type, preferences, governance rights, and downside protections."]
      - ["Payment processors and card networks", "Infrastructure gatekeepers", "Processing relationships effectively bound what content and payouts the platform can support.", "Need concentration, reserve requirements, and contingency planning."]
      - ["Ofcom / UK regulators", "External oversight", "Investigation and fine show the platform can face direct supervisory and disclosure pressure.", "Need current remediation status and any follow-on obligations."]
    notes: Enumeration focuses on stakeholders that directly shape economics, control, or platform continuity rather than listing every investor or community segment.
    enumerationScope:
      coverage: partial
      basis: Includes the main economic, control, and regulatory stakeholders surfaced by the assigned public evidence for a company-overview diligence readout.
    claimRefs: [CO004, CO007, CO010, CO013, CO015, CO016]
