artifact: company-overview
slug: onlyfans
runDate: 2026-10-16
company:
  name: OnlyFans
chapter:
  number: 1
  title: Company Overview
  summary: >-
    OnlyFans is a London-founded, privately held creator-subscription platform whose
    2024 disclosed scale and profitability remain unusually large relative to its
    lean published corporate footprint. The 2026 Architect Capital minority round
    added outside capital and valuation evidence, but control still appears highly
    concentrated and key governance, compliance, and creator-safety questions remain
    only partially public.
sections:
  - id: identity-model-scale
    title: Identity, product model, and disclosed scale
    body: |-
      OnlyFans presents itself as a privately held London entertainment company founded
      in 2016, and the assigned evidence consistently describes the product as a direct
      creator-subscription platform rather than an ad-funded social network. The core
      monetization stack is straightforward—subscriptions, pay-per-view content, paid
      direct messages, and tips—with OnlyFans keeping 20% and creators receiving 80%.
      That simplicity matters because it explains why public FY2024 summaries can show
      both very large transaction volume and very high profitability without a similarly
      large disclosed employee base.

      The public scale numbers available in this worker pool are directionally strong
      but not complete enough to treat as full operating KPIs. Multiple public
      summaries point to roughly $7.22 billion of gross fan payments in FY2024, about
      $1.41 billion of net revenue, about $684 million of pre-tax profit, roughly
      377.5 million cumulative fan accounts, and roughly 4.6 million creator accounts.
      Those are useful ground-truth anchors for later chapters, but they do not disclose
      active payers, creator concentration, or a precise current employee count beyond
      LinkedIn's broad 51-200 range.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008]
    tableRefs: [TO001]
  - id: leadership-ownership-and-control
    title: Leadership, ownership, and control
    body: |-
      The company history in the assigned pool shows a clear separation between
      founder identity, day-to-day leadership, and ultimate control. Tim Stokely is
      tied to the 2016 launch narrative, but control moved to Leonid Radvinsky in
      October 2018 and then to Yekaterina Chudnovsky in March 2026. Keily Blair has
      led the business as CEO since July 2023 and joined the Fenix board in May 2026,
      making her the main visible operating executive in the current period while
      ownership appears concentrated elsewhere.

      That split matters for diligence because the 2026 financing appears to have added
      an outside investor without making the resulting governance structure public.
      InforCapital's round summary suggests OnlyFans did not take outside venture money
      until 2026, when Architect Capital led a $535 million minority investment at a
      roughly $3.1-$3.15 billion valuation. The pool does not surface term sheets,
      board rights, liquidation preferences, or downside protections, so later
      investment judgment should treat ownership concentration and minority-protection
      mechanics as live diligence asks rather than settled facts.
    claimRefs: [CO009, CO010, CO011, CO016]
    tableRefs: [TO002, TO003]
  - id: milestones-and-risk-posture
    title: Milestones and current risk posture
    body: |-
      The dated milestone record in the assigned evidence shows OnlyFans evolving from
      a 2016 launch into a scaled, regulated platform with periodic efforts to broaden
      its brand beyond adult subscriptions. OFTV's August 2021 launch and current
      LinkedIn messaging about streaming, fashion, sports, comedy, and financial tools
      indicate management wants readers to see the company as a broader creator
      platform. Even so, the same evidence still ties the company tightly to adult
      content economics and to infrastructure providers that can constrain what the
      platform is able to carry.

      Two risk threads stand out. First, the 2021 explicit-content reversal under
      banking pressure highlights how exposed the model remains to payment rails and
      compliance demands. Second, BBC reporting in 2026 argues that exploitative
      OnlyFans management agencies can harm creators and that the platform has not done
      enough to protect them, while Ofcom's 2024-2025 enforcement sequence shows
      regulators are already testing the company's controls. Together these facts make
      OnlyFans look operationally powerful but governance-sensitive: high scale and
      cash generation coexist with concentrated control, compliance dependence, and
      creator-trust risk.
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
