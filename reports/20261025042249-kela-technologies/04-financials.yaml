    claimRefs: [CI001, CI003, CI005, CI009, CI010]

callouts:
  - calloutType: strength
    title: Financing access is a current strength
    body: >-
      Reported financing of approximately $300M by June 2026, including a reported
      $200M round at a $1.2B valuation, gives Kela unusual funding capacity for a
      company founded in 2024; the amount still needs reconciliation to cash and
      financing terms.
    claimRefs: [CI011, CI012]
  - calloutType: risk
    title: Revenue quality is the main blocker
    body: >-
      Public evidence does not disclose recurring revenue, gross margin, customer
      concentration, collections, burn, or runway, so the headline revenue and
      contract figures cannot yet support a reliable valuation or downside case.
    claimRefs: [CI009, CI010, CI013, CI014]

