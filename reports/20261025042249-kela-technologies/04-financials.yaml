artifact: financials
slug: kela-technologies
runDate: 2026-10-25
company:
  name: Kela Technologies
chapter:
  number: 4
  title: Financials
  summary: Kela has disclosed rapid financing and early revenue traction, but public evidence does not yet separate recurring software revenue from integration and defense-delivery revenue. The underwriting case therefore rests more on market access and capital availability than on demonstrated margins, retention, cash runway, or repeatable unit economics.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Public descriptions point to a hybrid defense-platform model rather than a clean
      SaaS model. Kela describes an open operating system that integrates sensors,
      drones, radars, intelligence systems, and other commercial or military
      components, while the 2026 reporting describes deployments, a factory, and
      hardware-enabled systems. Dealroom labels the business model SaaS, but that
      taxonomy does not establish the mix of subscription, license, integration,
      services, hardware, or contract revenue. The Starling arrangement adds a
      channel and integration dimension: Kela receives exclusive rights to sell,
      integrate, and deploy Pathfinder X in specified Israeli defense channels.
      Consequently, list pricing, realized pricing, revenue recognition, backlog,
      renewal rates, and gross margin remain underwriting gaps rather than inputs to
      a precise revenue forecast.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: sales-efficiency-and-costs
    title: GTM motion, cost structure, and operating leverage
    body: >-
      Kela's go-to-market motion appears enterprise and government-led: early activity
      is concentrated in Israel's defense establishment, with an intended expansion
      toward U.S. and other Western militaries. That motion can support large
      contracts, but it also implies long procurement cycles, stringent requirements,
      deployment labor, and working-capital exposure. Public reporting identifies
      dozens of Israeli deployment points and a factory, while the partnership model
      suggests Kela can add capabilities without manufacturing every component.
      These facts support a plausible path to operating leverage, but they do not
      quantify CAC, sales-cycle duration, implementation cost, inventory, capex,
      service staffing, or contribution margin. The cost base is therefore more
      likely to be a mix of engineering, field deployment, compliance, and
      production costs than a pure software expense profile.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: traction-and-capital
    title: Traction, funding, and capital adequacy
    body: >-
      The strongest current public traction signal is the June 2026 report that Kela
      had approximately $20 million of revenue, at least $50 million of contracts,
      about 150 employees, a southern-Israel factory, and dozens of domestic
      deployment points. Dealroom independently displays a broader $10–50 million
      latest-reported revenue range and a $1–2.5 billion valuation range, alongside
      a May 2026 $200 million financing at a $1.2 billion valuation. Earlier
      reporting described $100 million raised by May 2025, while the later report
      described approximately $300 million cumulatively. These are meaningful
      financing signals, not proof of cash available: terms, preferences, dilution,
      debt, cash balance, burn, runway, and restricted funds are not publicly
      disclosed. The reported contract figure is also not equivalent to recognized
      revenue or ARR.
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: financial-verdict
    title: Underwriting verdict and diligence blockers
    body: >-
      Kela's financial profile is promising but not yet model-ready. Revenue and
      contract disclosures imply commercial conversion beyond a pre-revenue
      prototype, and the latest capital event appears capable of funding substantial
      expansion. However, the evidence is concentrated in press and data-platform
      disclosures, with no public income statement, cash-flow statement, customer
      concentration, gross-margin bridge, or cohort retention. The sector backdrop
      is favorable: U.S. government guidance describes record Israeli defense
      exports, strong U.S. funding links, and a large incumbent base. That backdrop
      can expand demand while also increasing competition and procurement complexity.
      A financeable next step is a diligence package reconciling signed backlog to
      revenue, separating software from hardware and services, and showing cash
      runway under delayed procurement and deployment scenarios.
    claimRefs: [CI013, CI014, CI015, CI016]
    figureRefs: [FI001]

tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Current value or status, Quality, Diligence ask]
    rows:
      - [Platform software, "Open command-and-control layer integrating commercial and military systems", "Business model labelled SaaS; no public ARR", "Third-party taxonomy, not company financial disclosure", "Provide license structure, recurring share, renewal and usage terms"]
      - [Integration and deployment, "Connects sensors, drones, radars, intelligence systems and field deployments", "Operational deployments reported; amount not disclosed", "Independent press description", "Reconcile implementation revenue, labor cost and acceptance milestones"]
      - [Hardware and systems, "Modular hardware and integrated autonomous systems", "Factory and Pathfinder X integration reported; price not disclosed", "Company exhibitor description plus independent report", "Separate hardware billings, inventory, warranty and gross profit"]
      - [Defense contracts, "Government or security-establishment contracts and platform deployments", "At least $50M of contracts reported in June 2026", "Independent report; contract value is not recognized revenue", "Provide signed backlog, cancellation terms, delivery schedule and revenue recognition policy"]
    notes: "Sources include Dealroom, The Jerusalem Post, Globes, Calcalist, and the Modern Day Marine exhibitor listing; public figures are not a complete revenue mix."
    claimRefs: [CI001, CI002, CI003, CI009]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Offering, List or realized pricing, Contract model, What is known, Diligence ask]
    rows:
      - [Platform, null, "Unknown; likely enterprise or government procurement", "No public price list or realized rate", "Obtain representative contract, license metric, escalation and renewal terms"]
      - [Integration, null, "Project or deployment-based terms unknown", "Deployment activity is reported without unit economics", "Obtain implementation SOWs, milestone billing and services margin"]
      - [Pathfinder X integration, null, "Exclusive commercial and operational collaboration with Starling", "Kela has rights to sell, integrate and deploy in specified channels", "Obtain transfer price, reseller margin, support obligation and volume commitments"]
      - [Hardware and field systems, null, "Unknown; may combine product and support charges", "NDAA-compliant fiber spools and ESADs are described by exhibitor", "Obtain BOM, warranty reserve, lead time and working-capital assumptions"]
    notes: "No public list or realized prices were found; null means unavailable, not zero. Official or company-facing descriptions do not establish revenue, margin, or cash collection."
    claimRefs: [CI003, CI004, CI007, CI016]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, "$20M (approximately, 2026 report)", medium, "Shows reported commercial activity but not recurring quality", "Reconcile audited revenue by product, customer, geography and recognition period"]
      - [Contracts, "At least $50M (approximately, 2026 report)", medium, "Indicates potential backlog and future delivery load", "Provide signed backlog, remaining performance obligations and conversion timing"]
      - [Cumulative funding, "Approximately $300M (June 2026 report)", medium, "Suggests strong financing access, not cash on hand", "Provide cap table, round terms, cash balance, burn and restricted cash"]
      - [Gross margin, null, low, "Determines whether hardware and deployment intensity can scale", "Provide segment gross margin, subcontractor cost and warranty history"]
      - [CAC and payback, null, low, "Government sales can consume cash before award and deployment", "Provide pipeline conversion, sales expense, cycle time and payback by channel"]
      - [Runway and burn, null, low, "Determines financing dependency under procurement delays", "Provide monthly cash burn, committed capex, debt and downside runway"]
    notes: "Values are public or explicitly unavailable. Revenue is not ARR, contracts are not recognized revenue, funding is not cash available, and null unit-economics fields require company evidence."
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]

