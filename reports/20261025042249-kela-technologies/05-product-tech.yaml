company:
  name: Kela Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: Kela is publicly described as an open, modular command-and-control software layer that fuses data from heterogeneous military and commercial systems. The product has credible integration and deployment signals, including the Pelanor acquisition and a Starling UAV integration, but public evidence does not disclose technical documentation, reliability metrics, security controls, or independent developer adoption.
sections:
  - id: product-definition
    title: Product and customer workflow
    body: >-
      Kela's product is described as a battlefield operating system rather than a single sensor,
      drone, or weapon. Calcalist reports that the system connects software and hardware components
      such as sensors and radars, supports soldiers in the field and command management at
      headquarters, and presents information from multiple sources through a unified command
      interface. The operating model is therefore an integration layer: a military customer brings
      heterogeneous assets, Kela ingests and processes their data, and commanders receive a
      consolidated operating picture and decision-support surface. This is a differentiated
      workflow proposition, but the public record does not show a product manual, API contract,
      independently measured latency, or a repeatable deployment playbook.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001, TE002]
  - id: architecture-maturity
    title: Architecture, modules, and maturity
    body: >-
      The reported architecture has several observable layers: connected sensors and other
      military or commercial assets; a software layer that integrates and processes heterogeneous
      inputs; AI-assisted analysis and pattern recognition; and a unified command interface for
      field and headquarters users. The acquisition of Pelanor adds a plausible analytics and
      cloud-cost capability, but the target's reported product was a FinOps platform, not proof that
      Pelanor code is integrated into Kela's operational stack. The Starling collaboration is a
      stronger integration signal because the report explicitly says Kela is integrating the
      Pathfinder X UAV system into its own operating system. Public evidence supports a working
      product and field deployment claims, but not a quantified maturity level, uptime history,
      software bill of materials, or formal security certification.
    claimRefs: [CE004, CE005, CE006, CE007]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-trust
    title: Deployment, differentiation, and trust controls
    body: >-
      Kela's differentiation is the combination of open architecture, rapid integration, and
      defense-domain operating experience. Jerusalem Post reporting describes an exclusive
      commercial and operational collaboration that gives Kela rights to sell, integrate, and
      deploy Starling's Pathfinder X with Israeli forces, while also describing a compact
      autonomous docking and UAV system. Times of Israel reporting says Kela intends to facilitate
      adoption of commercial technologies such as tablets, sensors, and radars into existing
      military systems. These are useful deployment and ecosystem signals, not independent proof
      of mission-critical reliability. The public record also leaves open how Kela handles
      encryption classification, export controls, access control, auditability, incident response,
      and safety validation. Israel's 2026 encryption-control reform makes product
      classification and export-compliance work a concrete diligence dependency for sensitive
      deployments.
    claimRefs: [CE008, CE009, CE010, CE011]
