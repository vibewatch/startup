callouts:
  - calloutType: risk
    title: Technical underwriting gap
    body: Public sources establish integration activity but do not establish reliability, cyber-security, safety, or compliance performance for a mission-critical command system.
    claimRefs: [CE010, CE011, CE012]
  - calloutType: insight
    title: Platform value depends on integration execution
    body: The product's strategic value is tied to connecting third-party capabilities quickly; the same dependency increases exposure to supplier, interface, export-control, and deployment-complexity risk.
    claimRefs: [CE005, CE008, CE011]
  - calloutType: recommendation
    title: Diligence priority
    body: Request an architecture and deployment pack covering supported interfaces, data flows, security controls, uptime and incident history, model evaluation, safety cases, export classifications, and customer-level production evidence before underwriting technical defensibility.
    claimRefs: [CE010, CE011, CE012]
