    title: Product architecture map
    type: stack
    summary: Reported Kela operating-system layers from connected assets to command use and compliance dependencies.
    data:
      layers:
        - label: Edge assets
          items: [Sensors, radars, drones, tablets]
          detail: Heterogeneous commercial and military systems are the inputs described in public reporting.
        - label: Integration layer
          items: [Open interfaces, Asset connectors]
          detail: The public proposition is rapid and secure integration without extensive changes to existing systems.
        - label: Data processing
          items: [Real-time ingestion, Data fusion]
          detail: Reporting describes collection and processing of information from multiple sources.
        - label: AI assistance
          items: [Pattern recognition, Actionable insights]
          detail: AI capabilities are described as decision support; performance is not independently measured.
        - label: Command surface
          items: [Unified command interface, Field and headquarters views]
          detail: The interface is intended to provide oversight and centralized control of connected assets.
        - label: Deployment and trust
          items: [Partner integrations, Export controls, Security controls]
          detail: Deployment depends on partners and on compliance controls whose implementation is not publicly documented.
