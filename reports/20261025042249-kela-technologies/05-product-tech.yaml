  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Independent developer or practitioner adoption measures such as public repositories, releases, package downloads, technical forums, or named engineer talks.
      whyItMatters: Adoption and technical activity would help distinguish a deployed integration platform from a largely bespoke defense-services program.
      diligencePath: Request a customer-safe developer-signal pack covering repositories or release cadence where disclosable, integration count, active deployments, and practitioner references.
      relatedQuestionRefs: [QE007, QE008]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Production reliability, cybersecurity, safety, and incident-control evidence for the command platform and integrated UAV systems.
      whyItMatters: Mission-critical defense software cannot be underwritten from feature descriptions and partnership announcements alone.
      diligencePath: Obtain a security architecture, uptime and incident log, penetration-test summary, safety case, model-evaluation results, and customer reference calls under NDA.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: architecture
      missingEvidence: Technical architecture, supported interfaces, deployment topology, data residency, and integration documentation.
      whyItMatters: The open-architecture thesis depends on repeatable integration economics and resilient operation across legacy systems.
      diligencePath: Request an architecture review with interface inventory, deployment runbooks, dependency map, update process, and representative integration timeline.
      relatedQuestionRefs: [QE003, QE005]
