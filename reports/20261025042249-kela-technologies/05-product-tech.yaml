    notes: The table separates stated workflow benefits from missing outcome denominators; no conversion, reliability, or productivity metric is inferred.
    claimRefs: [CE002, CE003, CE008, CE009]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Edge assets", "Sensors, radars, drones, and other connected systems", "Vendor interfaces and asset availability", "Integration breadth may increase configuration and failure-mode complexity"]
      - ["Ingestion and integration", "Connects heterogeneous software and hardware", "Existing military infrastructure and interface access", "Legacy compatibility and accreditation are not documented"]
      - ["Data fusion and AI", "Processes data and supports pattern recognition", "Data quality, compute, and model controls", "False positives, latency, and explainability are unquantified"]
      - ["Command interface", "Presents a unified operating picture", "Field connectivity and user workflows", "Usability and degraded-network behavior are unverified"]
      - ["Deployment operations", "Installs and updates the platform and integrated capabilities", "Defense procurement, support personnel, and partner systems", "Slow procurement and service burden could constrain scale"]
      - ["Trust and compliance", "Governs sensitive data and exports", "Encryption classification and defense export controls", "Compliance scope and certification evidence are not public"]
    notes: Architecture is an evidence-bounded analytical decomposition of reported product functions, not a disclosed Kela technical diagram; dependencies and risks require technical diligence.
    claimRefs: [CE001, CE005, CE010, CE011, CE012]
