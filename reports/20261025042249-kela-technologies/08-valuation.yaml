company:
  name: Kela Technologies
chapter:
  number: 8
  title: Valuation
  summary: Kela has compelling early deployment and financing momentum, but the public record supports a high-expectation private-market price rather than a fully underwritten entry. The recommendation is to track the company until round terms, recurring economics, customer concentration, and export-market conversion are diligence-confirmed.
sections:
  - id: investment-case
    title: Investment case and price sensitivity
    body: >-
      The positive case is unusually strong early evidence for a young defense platform. Calcalist reported a proposed
      $200 million raise at a $1 billion pre-money valuation, while Globes reported the same raise at a $1.2 billion
      valuation and described about $20 million of 2025 revenue and contracts above $50 million. Dealroom records the
      May 2026 financing as $200 million at $1.2 billion and shows Kela's product as a modular battlefield operating
      system, but its revenue field remains non-specific. These figures suggest demand and investor conviction, not
      recurring revenue, cash generation, or a verified post-money cap table. The valuation therefore depends on future
      conversion of Israeli deployments into repeatable allied procurement.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and comparable context
    body: >-
      Kela's thesis rests on an open integration layer that can connect sensors, drones, and other military systems
      faster than closed legacy programs, with early Israeli field use and a Starling collaboration providing
      operational proof points. The anti-thesis is that defense procurement is slow, approval-heavy, and dominated by
      entrenched primes; Globes also reports that Kela sometimes prices aggressively to win projects and that open
      architecture creates cybersecurity questions. Dealroom's comparison list places Kela beside much larger
      companies, including Anduril, but it does not establish a transaction multiple or operating comparability.
      Investors should treat the round valuation as a forward option on international scale, not as a revenue multiple
      validated by public financial statements.
    claimRefs: [CV005, CV006, CV007, CV008]
    tableRefs: [TV002]
  - id: scenario-discipline
    title: Scenario discipline and recommendation
    body: >-
      A scenario framework is more defensible than a point estimate because the public record lacks audited revenue,
      gross margin, backlog quality, dilution terms, preference rights, and customer concentration. The bull case
      requires successful U.S. and allied expansion, sustained deployment growth, and software-like economics layered
      onto integration and hardware activity. The base case assumes continued Israeli traction but slower foreign
      procurement and meaningful services or manufacturing intensity. The bear case assumes price competition,
      integration cost, security review, or procurement delay prevents the $1.2 billion mark from compounding. With
      these uncertainties, track is preferable to buy: the decision can improve after term-sheet and unit-economics
      diligence or after a valuation reset.
    claimRefs: [CV009, CV010, CV011, CV012]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence-and-exit
    title: Exit readiness and diligence gates
    body: >-
      Kela's reported rejection of an Anduril acquisition approach is a signal of independent-company ambition, not a
      realizable exit value. EquityZen explains that private holders may obtain liquidity through an exit event or an
      eligible marketplace transaction, but that generic mechanism does not establish a Kela market price or transfer
      rights. The next investment decision should require the signed financing documents, fully diluted capitalization,
      liquidation preferences, investor rights, audited or management revenue by customer and product, gross margin
      split between software and deployment work, backlog conversion, renewal evidence, export approvals, and
      cybersecurity assurance. Thesis break occurs if international deployment stalls, contracts do not convert to
      revenue, or the company must discount materially to win deployments.
    callouts:
      - calloutType: recommendation
        title: "Recommendation: track"
        body: Public evidence supports strategic momentum but not a sufficiently transparent price or return case for a buy decision.
        claimRefs: [CV001, CV009, CV013]
      - calloutType: risk
        title: Principal valuation risk
        body: The reported $1.2 billion valuation is far more precise than the public evidence on recurring revenue, margins, terms, or customer concentration.
        claimRefs: [CV004, CV010, CV012]
    claimRefs: [CV013, CV014, CV015]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Public evidence, Decision implication]
    rows:
      - [Recommendation, "Track", "Wait for financing terms and operating disclosure before underwriting entry."]
      - [Confidence, "Medium", "Financing and deployment signals are corroborated, but economics are not."]
      - [Risk rating, "High", "Procurement, concentration, security, and valuation risks remain material."]
      - [Valuation stance, "Stretched", "Reported $1.2B value implies substantial future international execution."]
    notes: "Publicly reported financing and operating indicators are not audited and do not establish a post-money cap table or investor return."
    claimRefs: [CV001, CV004, CV009, CV010, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Open architecture can reduce integration friction", "Platform integrates data and connected assets through a unified interface.", "Independent customer references showing deployment time, uptime, and repeat expansion."]
      - ["Early demand may be real", "Globes reports about $20M of 2025 revenue and contracts above $50M; Dealroom records rapid financing.", "Customer-level revenue, backlog conversion, renewal, and collection data."]
      - ["International scale is plausible", "Kela is described as targeting Western militaries and partnered with Starling for an integrated UAV deployment.", "Signed foreign contracts, export approvals, and deployments outside Israel."]
      - ["Price may be ahead of proof", "Globes reports a $1.2B valuation alongside revenue of a few tens of millions and aggressive pricing.", "Audited margins, durable growth, and terms showing limited dilution or preference overhang."]
    notes: "Rows combine reported facts with explicit diligence tests; the comparison is not a peer-multiple analysis."
    claimRefs: [CV005, CV006, CV007, CV008, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Foreign procurement converts; deployments expand; software-like margin emerges.", "Upside could justify or exceed the reported $1.2B mark, but no public multiple supports a numeric target.", "Export, execution, and incumbent response.", "Low-to-medium: strategic evidence exists, economics do not."]
      - [Base, "Israeli activity continues; U.S. and allied adoption takes longer; services remain meaningful.", "Track at the reported mark; seek a price below the current private reference or stronger evidence.", "Procurement duration, concentration, and cost-to-serve.", "Most plausible on current disclosure."]
      - [Bear, "International conversion stalls or aggressive pricing and integration costs compress economics.", "Downside is a valuation reset or preference-heavy financing; loss magnitude cannot be quantified publicly.", "Multiple compression, funding terms, and customer dependence.", "Material: each risk is publicly unresolved."]
      - [Diligence-gated, "Signed terms and customer economics resolve current gaps.", "Re-rate only after verified revenue quality, margins, dilution, and retention.", "Information asymmetry persists until documents are reviewed.", "Decision gate, not a forecast."]
    notes: "Scenario values are intentionally qualitative because public sources do not disclose enough information for a defensible numeric valuation range or target return."
    claimRefs: [CV009, CV010, CV011, CV012, CV014]
