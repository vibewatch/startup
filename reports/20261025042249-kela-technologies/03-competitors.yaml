    title: Feature and capability matrix
    columns: [Buying criterion, Kela, Anduril, Palantir, Incumbent prime, Evidence implication]
    rows:
      - [Open integration across suppliers, "Reported open and modular architecture", "Reported multi-supplier model", "Not established by assigned evidence", "Often bundled or program-specific", "Architecture is the clearest claimed distinction"]
      - [Real-time data fusion and command interface, "Reported", "Reported platform concept", "Core software capability is established at company scale", "Program-specific", "Mission-level comparability is unverified"]
      - [Autonomous aerial capability, "Partner integration through Starling Pathfinder X", "Own and partner autonomy ecosystem", "Not established by assigned evidence", "May be delivered through prime programs", "Partner access is not the same as owned autonomy"]
      - [Deployment speed, "Company and press emphasize rapid integration", "Known fast-moving defense-tech benchmark", "Not comparable from assigned sources", "Traditional procurement described as slower", "Needs deployment-cycle data"]
      - [Security accreditation and incident record, "Not publicly quantified", "Not comparable in assigned evidence", "Not comparable in assigned evidence", "Not comparable in assigned evidence", "Open architecture creates a material diligence ask"]
      - [Pricing and lifecycle support, "Not disclosed; third-party coverage mentions undercutting rivals", "Not disclosed", "Not disclosed in assigned evidence", "Contract-specific", "No price-performance conclusion is supportable"]
    notes: "Cells preserve only evidence available in the assigned pool; qualitative labels are not benchmark scores and unsupported comparisons remain explicitly unknown."
    claimRefs: [CP005, CP006, CP007, CP008, CP011]
  - id: TP003
    title: Pricing, packaging, and switching comparison
    columns: [Alternative, Price or contract model, Included capability, Discount or unknown, Switching or lock-in implication]
    rows:
      - [Kela, "Not publicly disclosed", "Open C2 layer plus integrations", "Third-party report says initial contracts may undercut rivals", "Integration knowledge and field data may create stickiness; not measured"]
      - [Anduril, "Not publicly disclosed", "Platform, sensors, and autonomy ecosystem", "Unknown", "Installed capability and proprietary stack may raise switching costs"]
      - [Palantir, "Not publicly disclosed in assigned evidence", "Data and decision software", "Unknown", "Data workflows and operational adoption may create stickiness; not defense-comparable"]
      - [Shield AI, "Not publicly disclosed", "Autonomy software and aircraft programs", "Unknown", "Mission integration may create program-specific switching costs"]
      - [Incumbent prime, "Program and contract specific", "Bundled system delivery and sustainment", "Unknown", "Procurement relationships and installed base may favor incumbents"]
      - [Internal build or status quo, "Internal labor and integration cost not disclosed", "Existing systems and local control", "Unknown", "Avoids vendor dependence but may preserve fragmentation and slow iteration"]
    notes: "No assigned source provides realized pricing, contract duration, discounts, gross margin, or support cost; all price and switching conclusions are diligence hypotheses."
    claimRefs: [CP008, CP011, CP013, CP014]

figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Evidence-backed ordinal positioning separates platform openness from deployment and distribution maturity; positions are analytical, not market-share measurements.
    data:
      points:
        - {label: Kela, x: 4, y: 3, detail: "Open architecture and early Israeli deployments; international scale remains unproven"}
        - {label: Anduril, x: 4, y: 4, detail: "Open-platform orientation with materially greater reported scale"}
        - {label: Palantir, x: 3, y: 4, detail: "Large software and government footprint; battlefield comparison is incomplete"}
        - {label: Shield AI, x: 3, y: 3, detail: "Strong autonomy specialization and Air Force program signal"}
        - {label: Incumbent primes, x: 2, y: 4, detail: "High procurement and sustainment maturity; openness is program-specific"}
        - {label: Internal build, x: 1, y: 1, detail: "Maximum local control but no external deployment or support scale"}
      xAxis: "Open, interoperable architecture (ordinal 1-4)"
      yAxis: "Deployment and distribution maturity (ordinal 1-4)"
    approximationNotes: "Ordinal scores synthesize the cited evidence and are not independently measured benchmarks; no numeric market-share or performance data were available."
    claimRefs: [CP001, CP003, CP005, CP009, CP015]

callouts:
  - calloutType: strength
    title: Open architecture is a credible wedge
    body: Kela's repeated open-platform positioning and the Starling integration provide a concrete ecosystem story, although the evidence does not yet prove a durable standard.
    claimRefs: [CP001, CP006]
  - calloutType: risk
    title: The benchmark set has deeper scale
    body: Anduril, Palantir, Shield AI, and incumbent primes have stronger disclosed scale or program access; Kela's public record lacks comparable pricing, uptime, and win-loss evidence.
    claimRefs: [CP003, CP009, CP013]
  - calloutType: recommendation
    title: Underwrite deployment repeatability, not funding momentum
    body: Competitive diligence should prioritize redacted contracts, deployment-cycle metrics, security evidence, support economics, and partner rights before treating the platform as a durable moat.
    claimRefs: [CP011, CP014]

