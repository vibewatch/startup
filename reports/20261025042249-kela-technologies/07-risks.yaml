  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory-controls
      missingEvidence: >-
        Jurisdiction-level export classifications, licenses, security accreditations, privacy and AI
        controls, litigation searches, IP ownership records, and material contract liability terms.
      whyItMatters: >-
        Missing permissions or adverse legal findings could delay market entry, block deployments,
        or create liability disproportionate to a young company's balance sheet.
      diligencePath: >-
        Obtain a counsel-certified regulatory matrix, regulator correspondence, accreditation
        certificates, litigation and patent searches, insurance schedules, and representative
        customer and partner contracts.
      relatedQuestionRefs: [QR001]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: reliability-and-security
      missingEvidence: >-
        Independent uptime, latency, false-alarm, field-failure, cyber-incident, penetration-test,
        safety, recall, and customer-acceptance records by deployment cohort.
      whyItMatters: >-
        Mission-critical command and sensor integration can create severe operational consequences
        even when a failure rate is low.
      diligencePath: >-
        Review service-level reports, incident postmortems, red-team results, acceptance tests,
        return and defect cohorts, and direct customer references under appropriate clearance.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: financial-risk
      missingEvidence: >-
        Audited revenue recognition, gross margin by software and services, burn, cash balance,
        working capital, backlog conversion, warranty costs, debt, preferences, and downside runway.
      whyItMatters: >-
        Long procurement cycles, hardware commitments, and field deployment costs may consume cash
        materially earlier than contract headline values imply.
      diligencePath: >-
        Obtain monthly financials, bank statements, cap table and financing documents, backlog aging,
        billing milestones, program-level contribution margins, and a board-approved downside plan.
      relatedQuestionRefs: [QR005, QR010]
      relatedTableRefs: [TR002, TR003]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: >-
        Revenue, backlog, renewal, and gross-margin concentration by customer, program, partner,
        supplier, and jurisdiction, plus termination and substitution rights.
      whyItMatters: >-
        A concentrated defense program or integration partner could control growth, references, cash
        conversion, or product breadth.
      diligencePath: >-
        Review concentration schedules, renewal cohorts, program acceptance status, partner
        agreements, supplier lead times, alternative-source qualification, and termination scenarios.
      relatedQuestionRefs: [QR003, QR004, QR010]
      relatedTableRefs: [TR003]
