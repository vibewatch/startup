  researchQuestions:
    - id: QR001
      question: >-
        Which licenses, export controls, security accreditations, and legal proceedings govern
        Kela's current and planned deployments?
      type: adverse
      targets: [contentRequirements/1]
      status: partial
    - id: QR002
      question: >-
        What independent evidence quantifies availability, cyber incidents, false alarms, field
        failures, recalls, or safety performance?
      type: adverse
      targets: [contentRequirements/2]
      status: partial
    - id: QR003
      question: >-
        Which suppliers and platform partners create concentrated technical or contractual
        dependencies for Kela?
      type: adverse
      targets: [contentRequirements/3]
      status: answered
    - id: QR004
      question: >-
        Does current evidence establish operational deployment rather than only pilots,
        announcements, or product ambition?
      type: verification
      targets: [contentRequirements/0]
      status: answered
    - id: QR005
      question: >-
        What financing and operating-scale evidence informs Kela's capital-intensity and liquidity
        risk without equating funding with cash runway?
      type: quantification
      targets: [contentRequirements/4]
      status: answered
    - id: QR006
      question: >-
        How does Kela's open multi-system architecture create both mitigation and additional
        integration failure modes?
      type: mechanism
      targets: [contentRequirements/2, contentRequirements/3]
      status: answered
    - id: QR007
      question: >-
        What evidence indicates that defense procurement and regulatory friction could delay Kela's
        international expansion?
      type: adverse
      targets: [contentRequirements/1]
      status: answered
    - id: QR008
      question: >-
        What current operating evidence indicates the pace and complexity of Kela's scaling
        challenge?
      type: freshness
      targets: [contentRequirements/0, contentRequirements/2]
      status: answered
    - id: QR009
      question: >-
        How does Kela's ambition to become a defense prime compare with the execution burden imposed
        by incumbent scale and procurement relationships?
      type: comparison
      targets: [contentRequirements/0, contentRequirements/4]
      status: answered
    - id: QR010
      question: >-
        Which monitorable events should reduce conviction or break the investment thesis across the
        major risk categories?
      type: adverse
      targets: [contentRequirements/4]
      status: answered
