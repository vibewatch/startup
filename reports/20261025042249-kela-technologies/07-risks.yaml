schemaVersion: report-v2
artifact: risks
slug: kela-technologies
runDate: 2026-10-25
company:
  name: Kela Technologies
chapter:
  number: 7
  title: Risks
  summary: >-
    Kela's principal underwriting risk is not a single disclosed incident but the gap between
    mission-critical ambition and limited public evidence on regulatory permissions, reliability,
    security controls, customer concentration, and cash consumption. Reported deployments,
    contracts, financing, and partner integrations reduce product-demand risk, while also raising
    execution, procurement, supplier, and governance exposure as the company scales.
sections:
  - id: severity-and-investment-implication
    title: Severity, residual exposure, and investment implication
    body: >-
      The highest residual exposures are procurement and authorization readiness, mission-critical
      reliability, and the capacity to scale a young organization across hardware, software, and
      classified customer environments. Independent reporting describes slow sales cycles, complex
      procurement, and stringent regulatory requirements in defense, while Kela's public materials
      emphasize a secure, open, battle-tested platform without publishing an authorization matrix,
      service levels, incident history, or independent assurance package. That mismatch does not
      establish a control failure; it makes the risk unquantified. Reported contracts and deployment
      points reduce the probability that Kela is only a concept, but do not establish renewal,
      uptime, or concentration. The investment posture should therefore remain conditional on
      primary diligence rather than treating rapid financing or a reported valuation as proof that
      operating controls have matured.
    claimRefs: [CR001, CR004, CR005, CR006, CR007, CR009, CR013, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal-and-market-access
    title: Regulatory, legal, and market-access risk
    body: >-
      Kela sells an integration layer for sensors, drones, intelligence systems, and weapons into
      military infrastructure. That product surface creates potentially material export-control,
      procurement, information-security, safety, intellectual-property, and authorization
      dependencies, but the assigned public evidence does not identify Kela's licenses,
      certifications, approvals, litigation posture, or contractual liability allocation. The
      strongest available independent source instead states that stringent regulation and complex
      procurement are characteristic of the market and that Kela is only considering expansion
      beyond its mainly domestic activity. The practical mitigation is a jurisdiction-by-jurisdiction
      permissions register, contract sample, security-assurance package, and counsel confirmation.
      A blocked program, material enforcement action, or inability to document export and security
      controls before a major foreign award would break the international-expansion thesis.
    claimRefs: [CR003, CR006, CR007, CR012, CR015]
    tableRefs: [TR001]
  - id: operational-financial-and-security-execution
    title: Operational, financial, and security execution
    body: >-
      Kela's architecture promises rapid integration and real-time operational decision support,
      which raises the consequence of latency, false classification, interface failure, degraded
      communications, or a cyber compromise. The Innoviz announcement identifies intended benefits
      in darkness, smoke, dust, fog, glare, and camouflage, but those are company claims rather than
      independent reliability measurements. Reported revenue, contracts, a factory, and deployment
      growth indicate genuine scaling pressure; they do not disclose gross margin, implementation
      cost, working capital, burn, cash availability, or warranty exposure. Financing raised is
      therefore not interchangeable with runway. Mitigation should include audited incident and
      availability data, hardware qualification evidence, deployment-level acceptance metrics,
      gross-margin bridges, and a monthly liquidity plan. Repeated mission failures or liquidity
      needs materially ahead of plan would be thesis-break events.
    claimRefs: [CR002, CR008, CR009, CR010, CR011, CR012, CR016]
    tableRefs: [TR002]
  - id: partner-concentration-and-kill-criteria
    title: Partner concentration, monitoring, and kill criteria
    body: >-
      The open-platform strategy shifts part of Kela's value proposition onto counterparties.
      Innoviz is expected to supply LiDAR at potentially large volumes, while reporting describes
      exclusive Kela rights to sell, integrate, and deploy Starling's system for Israeli defense
      customers. These relationships accelerate capability breadth but introduce qualification,
      supply, roadmap, support, and contractual concentration risk. Domestic-defense dependence also
      makes procurement timing and a small number of programs potentially decisive even though no
      customer-revenue concentration schedule is public. Investors should monitor alternative-source
      qualification, partner termination rights, deployment acceptance, renewal and backlog
      conversion, and customer concentration. Kill criteria are loss of a critical integration
      without a qualified substitute, repeated failure to convert contracts into accepted
      deployments, or evidence that one customer or partner controls an uneconomic share of revenue.
    claimRefs: [CR002, CR003, CR004, CR006, CR008, CR015]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Priority risk
      - Jurisdiction or surface
      - Public status
      - Likelihood
      - Severity
      - Mitigation and monitoring
      - Residual exposure and diligence path
    rows:
      - - Export-control and military-technology authorization
        - Israel, United States, and other Western markets
        - No license or authorization inventory appears in the assigned evidence
        - Unverified
        - High if permissions delay or bar deployment
        - Maintain a jurisdiction and product classification register with named accountable counsel
        - Obtain licenses, classifications, exceptions, and regulator correspondence before underwriting foreign expansion
      - - Procurement, security accreditation, and program approval
        - Defense ministries and security agencies
        - Independent reporting describes slow sales cycles, complex procurement, and stringent requirements
        - High for timing friction
        - High because acceptance gates revenue and deployment
        - Track bid-to-award, award-to-acceptance, accreditation status, and failed-gate reasons by program
        - Review representative tenders, acceptance certificates, security accreditations, and contract milestones
      - - Data, AI, safety, IP, and liability allocation
        - Multi-sensor command-and-control deployments
        - Public sources describe real-time analysis and integrations but not control certifications, disputes, or liability terms
        - Unverified
        - High if a decision-support or integration failure causes mission harm
        - Require model governance, human-override controls, software bills of materials, insurance, and clear partner indemnities
        - Review incident history, penetration tests, safety cases, IP assignments, litigation searches, and customer contract liability
    notes: >-
      Severity is conditional on the documented failure scenario; absence of a public license,
      certification, dispute, or incident record is treated as an evidence gap, not proof of absence.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly visible legal and regulatory risk surfaces in the assigned evidence as of 2026-10-25;
        no primary regulator or court records were available in the pool.
    claimRefs: [CR001, CR003, CR005, CR006, CR007, CR012, CR015]
  - id: TR002
    title: Operational, quality, security, and financial risk register
    columns:
      - Failure mode
      - Evidence signal
      - Likelihood
      - Severity
      - Mitigation maturity
      - Monitoring indicator
      - Residual exposure
    rows:
      - - Mission-critical reliability or cyber failure
        - Platform combines real-time sensor fusion and command software, but no independent uptime or incident series is public
        - Unverified
        - Critical for an accepted military deployment
        - Publicly unverified
        - Availability, false-alarm rate, mean time to recover, severity-one incidents, and customer acceptance failures
        - High until independent test, incident, and service-level evidence is reviewed
      - - Integration complexity across heterogeneous systems
        - Kela connects sensors, drones, radars, intelligence systems, and other components
        - Medium as an execution risk
        - High because interface failure can impair the operating picture
        - Partly mitigated by an open and modular architecture claim
        - Integration cycle time, regression defects, unsupported versions, and deployment rework
        - Medium to high without interface-level reliability and qualification data
      - - Hardware and deployment scaling
        - Innoviz procurement may reach hundreds of units and Kela reportedly added a factory and dozens of deployment points
        - Medium during rapid scale
        - High if quality or supply delays block field acceptance
        - Early and not independently quantified
        - Supplier yield, on-time delivery, field returns, acceptance cycle, and installation backlog
        - Medium to high until production and field-quality cohorts are available
      - - Burn, working capital, and margin compression
        - Reported financing and contracts do not disclose gross margin, burn, cash balance, or implementation working capital
        - Unverified
        - High because hardware, facilities, and long procurement cycles can consume cash before collection
        - Publicly unverified
        - Cash conversion, milestone billing, gross margin by program, burn, and minimum liquidity
        - High until audited financials and a downside runway model are reviewed
    notes: >-
      Likelihood and mitigation maturity are analytical assessments bounded by the cited public
      evidence; undisclosed operating metrics remain unverified rather than estimated.
    claimRefs: [CR001, CR002, CR008, CR009, CR010, CR011, CR012, CR016]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or concentration
      - Role
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Autonomous UAV capability
        - Starling; reported exclusive Israeli commercial and operational arrangement
        - Pathfinder X supply, integration, sale, and deployment
        - Termination, qualification failure, support shortfall, or roadmap divergence removes a differentiated capability
        - High
        - Escrow critical interfaces, document substitution rights, dual-source functions, and test replacement lead times
        - High until termination rights, supply obligations, and substitute qualification are reviewed
      - - LiDAR capability
        - Innoviz; framework for up to several hundred sensors with company-anticipated expansion
        - 3D perception within the situational platform
        - Supply, quality, export, or roadmap disruption delays deployments or degrades sensor coverage
        - Medium to high
        - Stage commitments, qualify alternatives, hold safety stock, and monitor yield and field-return cohorts
        - Medium because scale expectations are prospective and supplier alternatives are undisclosed
      - - Customer and regulator access
        - Mainly the Israeli defense establishment in the available reporting
        - Procurement, accreditation, deployment acceptance, and reference credibility
        - Program delay or policy change slows revenue and weakens proof for foreign expansion
        - High
        - Diversify by customer and jurisdiction, secure portable accreditations, and track accepted deployments rather than announcements
        - High because revenue concentration and renewal data are not public
      - - Capital and growth financing
        - Venture investors and private-market funding
        - Funds expansion while procurement and hardware consume capital
        - Financing conditions tighten before contract cash conversion or margins mature
        - High
        - Board-approved liquidity thresholds, milestone billing, downside hiring gates, and non-dilutive program finance
        - Unverified because cash, burn, preferences, and runway are not disclosed
    notes: >-
      The register distinguishes announced or reported relationships from undisclosed contract
      economics; concentration percentages and termination terms are not inferred.
    claimRefs: [CR002, CR003, CR006, CR008, CR009, CR010, CR015, CR016]
figures:
  - id: FR001
    title: Residual risk heatmap and kill-trigger lens
    type: matrix
    summary: >-
      Conditional severity remains highest where public control evidence is missing and a failure
      could block market access, mission acceptance, or liquidity.
    data:
      columns:
        - label: Impact
        - label: Evidence-based likelihood
        - label: Public mitigation maturity
        - label: Thesis-break trigger
      rows:
        - label: Procurement and authorization
          values:
            - value: High
            - value: High for timing friction
            - value: Unverified
            - value: Major foreign award blocked by missing permissions or accreditation
        - label: Reliability and security
          values:
            - value: Critical
            - value: Unverified
            - value: Unverified
            - value: Repeated severe incidents or failed field acceptance
        - label: Integration complexity
          values:
            - value: High
            - value: Medium
            - value: Partial
            - value: Persistent deployment rework or unsupported interfaces
        - label: Supplier dependency
          values:
            - value: High
            - value: Medium
            - value: Early
            - value: Critical partner loss without a qualified substitute
        - label: Customer concentration
          values:
            - value: High
            - value: Unverified
            - value: Unverified
            - value: One program dominates revenue or fails to renew
        - label: Liquidity and margin
          values:
            - value: High
            - value: Unverified
            - value: Unverified
            - value: Capital required materially earlier than the board downside plan
    approximationNotes: >-
      Categories are qualitative and conditional; the figure does not convert missing public data
      into numeric probabilities or imply that no incident has occurred.
    claimRefs: [CR005, CR007, CR013, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Core underwriting caution
    body: >-
      Reported deployment and financing momentum reduce concept risk, but they do not resolve
      permissions, reliability, concentration, margin, burn, or runway. Investment approval should
      require primary evidence on those controls rather than extrapolation from funding or contracts.
    claimRefs: [CR004, CR008, CR009, CR016]
