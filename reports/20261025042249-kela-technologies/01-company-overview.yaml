callouts:
  - calloutType: strength
    title: "Defense-native integration thesis"
    body: "The combination of a defense-experienced founding team, an open command-and-control layer and early deployment evidence gives Kela a credible strategic wedge in a procurement bottleneck."
    claimRefs: [CO002, CO003, CO006, CO012]
  - calloutType: risk
    title: "Scale and valuation outrun disclosure"
    body: "The reported $1.2B valuation and rapid hiring are not matched by public disclosure of audited revenue, customer concentration, margins, financing terms or cyber assurance."
    claimRefs: [CO008, CO009, CO010, CO015, CO016]
