company:
  name: Kela Technologies
chapter:
  number: 1
  title: Company Overview
  summary: Kela Technologies is a 2024-founded Israeli defense-software company whose open, modular command-and-control platform is being deployed with Israeli security users while the company raises substantial private capital. Public evidence supports a strong founding team, rapid financing and early field activity, but exact customer concentration, audited revenue quality, financing terms and operating economics remain undisclosed.
sections:
  - id: identity-and-product
    title: Identity, product and operating position
    body: >-
      Kela was founded in Israel in July 2024 by Alon Dror, Hamutal Meridor, Omer Bar-Ilan and Jason
      Manne. Independent reporting describes a defense-first company building an open and modular
      operating system for militaries: it ingests data from sensors, radars, drones and other
      systems, processes it in real time, and presents a unified command interface. This is an
      integration and mission-management layer rather than a single airframe or sensor product.
      The product thesis is to let defense customers connect commercial and military technologies
      without the long delays and vendor lock-in associated with traditional procurement. The
      evidence is strongest for the product concept and Israeli deployment context; customer names,
      contract-level performance, security accreditation and production scale are not publicly
      documented in the assigned sources.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-capital
    title: Leadership, capital and scale
    body: >-
      Kela's leadership combines defense, intelligence, software and venture experience. Alon Dror
      is described as a former senior Directorate of Defense Research and Development official and
      Israel Defense Prize winner; Hamutal Meridor previously led Palantir Israel and is identified
      as president and co-founder; the other named founders bring weapons engineering and Rafael
      algorithm experience. Funding evidence is unusually strong for a young private company but
      not fully primary: CTech reported $100 million raised by May 2025, while May and June 2026
      reports described a $200 million round at a $1.2 billion valuation and approximately $300
      million raised in total. Those latest figures are attributed to sources close to the company
      or reported financing records, not audited accounts. Headcount also rose from 25 in 2025 to
      about 150 in 2026 reporting, indicating rapid scaling but not necessarily recurring revenue.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO002, TO003]
  - id: milestones-and-diligence
    title: Milestones, deployment and unresolved diligence
    body: >-
      The public milestone record shows a fast sequence from July 2024 formation to seed and Series
      A financing, a $60 million follow-on round, field deployment, a Starling UAV collaboration,
      reported expansion across Israeli border outposts, a Pelanor acquisition, and the reported
      2026 financing. These milestones support strategic relevance and execution momentum, but they
      do not establish durable unit economics. Globes reporting explicitly notes that open
      architecture raises cybersecurity questions and that defense procurement has lengthy trials,
      testing and approval procedures. Kela's domestic concentration, planned US expansion,
      export-control exposure, integration burden and dependence on mission-critical reliability
      are therefore central risks. Public sources do not provide audited revenue, gross margin,
      burn, runway, customer count, renewal data, post-money terms, dilution or governance rights.
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
    figureRefs: []
