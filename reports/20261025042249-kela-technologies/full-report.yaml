chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product and operating position
        blocks:
          - type: paragraph
            body: >-
              Kela was founded in Israel in July 2024 by Alon Dror, Hamutal Meridor, Omer Bar-Ilan and Jason Manne.
              Independent reporting describes a defense-first company building an open and modular operating system for
              militaries: it ingests data from sensors, radars, drones and other systems, processes it in real time, and
              presents a unified command interface. This is an integration and mission-management layer rather than a
              single airframe or sensor product. The product thesis is to let defense customers connect commercial and
              military technologies without the long delays and vendor lock-in associated with traditional procurement.
              The evidence is strongest for the product concept and Israeli deployment context; customer names,
              contract-level performance, security accreditation and production scale are not publicly documented in the
              assigned sources.
