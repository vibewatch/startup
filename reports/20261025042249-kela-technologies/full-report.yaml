      - number: '5.3'
        title: Deployment, differentiation, and trust controls
        blocks:
          - type: paragraph
            body: >-
              Kela's differentiation is the combination of open architecture, rapid integration, and defense-domain
              operating experience. Jerusalem Post reporting describes an exclusive commercial and operational
              collaboration that gives Kela rights to sell, integrate, and deploy Starling's Pathfinder X with Israeli
              forces, while also describing a compact autonomous docking and UAV system. Times of Israel reporting says
              Kela intends to facilitate adoption of commercial technologies such as tablets, sensors, and radars into
              existing military systems. These are useful deployment and ecosystem signals, not independent proof of
              mission-critical reliability. The public record also leaves open how Kela handles encryption
              classification, export controls, access control, auditability, incident response, and safety validation.
              Israel's 2026 encryption-control reform makes product classification and export-compliance work a concrete
              diligence dependency for sensitive deployments.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical underwriting gap
            body: >-
              Public sources establish integration activity but do not establish reliability, cyber-security, safety, or
              compliance performance for a mission-critical command system.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE012
          - type: callout
            title: Platform value depends on integration execution
            body: >-
              The product's strategic value is tied to connecting third-party capabilities quickly; the same dependency
              increases exposure to supplier, interface, export-control, and deployment-complexity risk.
            calloutType: insight
            claimRefs:
              - CE005
              - CE008
              - CE011
          - type: callout
            title: Diligence priority
            body: >-
              Request an architecture and deployment pack covering supported interfaces, data flows, security controls,
              uptime and incident history, model evaluation, safety cases, export classifications, and customer-level
              production evidence before underwriting technical defensibility.
            calloutType: recommendation
            claimRefs:
              - CE010
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              Kela's apparent customer base is concentrated in government and defense users rather than conventional
              commercial software buyers. The product is described as an operating system connecting sensors, radars,
              drones, intelligence systems, and other military assets, so the operational user is likely distributed
              across field personnel, command staff, and technical integration teams, while the payer is a defense
              establishment or security agency. Public sources place the company mainly inside Israel's domestic defense
              establishment and describe expansion toward U.S. and other Western militaries. That creates strategic
              value if Kela becomes a common integration layer, but it also exposes the company to long procurement
              cycles, security approvals, budget cycles, and customer-specific integration work. No source provides a
              customer-by-revenue segmentation, contract mix, or disclosed payer list, so the table distinguishes
              evidenced segments from unresolved commercial detail.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and deployment evidence
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is stronger than the customer-disclosure record but remains uneven. The March 2025
              Calcalist report said Kela had a working product while withholding customer identities; the June 2026
              Globes report described activity expanding from a limited number of outposts to dozens of deployment
              points within Israel's borders. The Starling agreement adds a named, use-case-specific integration with
              exclusive rights to sell, integrate, and deploy Pathfinder X for Israeli defense forces, although the
              source does not state the number of deployed systems or whether the arrangement has generated recognized
              revenue. A January 2026 report also said some Kela systems were already in service with security forces in
              Israel and other countries, while a separate March 2025 report said operational implementation was
              expected but disclosed no details. Public sources describe plans for U.S. and Western military expansion,
              but do not establish a diversified international customer base. These signals support real deployment and
              integration progress, not proof of broad repeatable adoption or recurring revenue.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named proof, retention, and durability
        blocks:
          - type: paragraph
            body: >-
              The public record contains one clearly named customer-adjacent deployment pathway rather than a roster of
              named end customers. Starling is named as a commercial partner whose UAV system Kela would integrate and
              deploy in the IDF and Ministry of Defense forces; the defense establishment is described as the primary
              operating environment, but specific agencies, contracts, volumes, outcomes, and renewal terms are not
              disclosed. Calcalist explicitly reported that it was unclear whether Kela had customers in March 2025,
              which sets an important disclosure baseline rather than proving that no customers existed. The later
              deployment disclosures therefore show progress, but they do not establish retention, gross or net revenue
              retention, churn, contract duration, satisfaction, or expansion within accounts. The diligence priority is
              to obtain contract-level evidence that separates pilots, production deployments, framework agreements, and
              integration services.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU008
              - CU009
              - CU010
      - number: '6.4'
        title: Expansion path and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Kela's expansion thesis is a land-and-expand model built around an open platform: integrate an initial
              capability, add sensors or autonomous systems, and extend the operating layer across more units or allied
              customers. The Starling collaboration demonstrates this adjacency strategy, while the reported move from a
              limited number of outposts to dozens of deployment points suggests geographic or operational expansion
              inside Israel. However, the same evidence implies concentration risk because public reporting says Kela
              operates mainly within the domestic defense establishment and does not disclose customer concentration.
              Expansion into U.S. and other Western militaries remains described as an ambition or plan, not a verified
              revenue diversification outcome. Investors should therefore underwrite the platform's strategic access
              separately from repeatable customer economics, and request customer-level revenue, renewal, deployment,
              and procurement-cycle data before treating deployment breadth as durable commercial scale.
            claimRefs:
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU007
              - CU008
              - CU014
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Operational proof is emerging
            body: >-
              Kela has public evidence of a working product, a named UAV integration pathway, and an expanding
              deployment footprint, which is materially stronger than logo-only marketing.
            calloutType: strength
            claimRefs:
              - CU005
              - CU007
              - CU008
          - type: callout
            title: Retention and concentration remain opaque
            body: >-
              Public sources do not disclose customer names at the agency level, active accounts, contract duration,
              renewal, churn, or revenue concentration; deployment breadth should not be treated as recurring customer
              economics.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity, residual exposure, and investment implication
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposures are procurement and authorization readiness, mission-critical reliability,
              and the capacity to scale a young organization across hardware, software, and classified customer
              environments. Independent reporting describes slow sales cycles, complex procurement, and stringent
              regulatory requirements in defense, while Kela's public materials emphasize a secure, open, battle-tested
              platform without publishing an authorization matrix, service levels, incident history, or independent
              assurance package. That mismatch does not establish a control failure; it makes the risk unquantified.
              Reported contracts and deployment points reduce the probability that Kela is only a concept, but do not
              establish renewal, uptime, or concentration. The investment posture should therefore remain conditional on
              primary diligence rather than treating rapid financing or a reported valuation as proof that operating
              controls have matured.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR013
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR007
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and market-access risk
        blocks:
          - type: paragraph
            body: >-
              Kela sells an integration layer for sensors, drones, intelligence systems, and weapons into military
              infrastructure. That product surface creates potentially material export-control, procurement,
              information-security, safety, intellectual-property, and authorization dependencies, but the assigned
              public evidence does not identify Kela's licenses, certifications, approvals, litigation posture, or
              contractual liability allocation. The strongest available independent source instead states that stringent
              regulation and complex procurement are characteristic of the market and that Kela is only considering
              expansion beyond its mainly domestic activity. The practical mitigation is a jurisdiction-by-jurisdiction
              permissions register, contract sample, security-assurance package, and counsel confirmation. A blocked
              program, material enforcement action, or inability to document export and security controls before a major
              foreign award would break the international-expansion thesis.
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR012
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
              - CR012
              - CR015
      - number: '7.3'
        title: Operational, financial, and security execution
        blocks:
          - type: paragraph
            body: >-
              Kela's architecture promises rapid integration and real-time operational decision support, which raises
              the consequence of latency, false classification, interface failure, degraded communications, or a cyber
              compromise. The Innoviz announcement identifies intended benefits in darkness, smoke, dust, fog, glare,
              and camouflage, but those are company claims rather than independent reliability measurements. Reported
              revenue, contracts, a factory, and deployment growth indicate genuine scaling pressure; they do not
              disclose gross margin, implementation cost, working capital, burn, cash availability, or warranty
              exposure. Financing raised is therefore not interchangeable with runway. Mitigation should include audited
              incident and availability data, hardware qualification evidence, deployment-level acceptance metrics,
              gross-margin bridges, and a monthly liquidity plan. Repeated mission failures or liquidity needs
              materially ahead of plan would be thesis-break events.
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR016
      - number: '7.4'
        title: Partner concentration, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The open-platform strategy shifts part of Kela's value proposition onto counterparties. Innoviz is
              expected to supply LiDAR at potentially large volumes, while reporting describes exclusive Kela rights to
              sell, integrate, and deploy Starling's system for Israeli defense customers. These relationships
              accelerate capability breadth but introduce qualification, supply, roadmap, support, and contractual
              concentration risk. Domestic-defense dependence also makes procurement timing and a small number of
              programs potentially decisive even though no customer-revenue concentration schedule is public. Investors
              should monitor alternative-source qualification, partner termination rights, deployment acceptance,
              renewal and backlog conversion, and customer concentration. Kill criteria are loss of a critical
              integration without a qualified substitute, repeated failure to convert contracts into accepted
              deployments, or evidence that one customer or partner controls an uneconomic share of revenue.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR008
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR008
              - CR009
              - CR010
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Core underwriting caution
            body: >-
              Reported deployment and financing momentum reduce concept risk, but they do not resolve permissions,
              reliability, concentration, margin, burn, or runway. Investment approval should require primary evidence
              on those controls rather than extrapolation from funding or contracts.
            calloutType: risk
            claimRefs:
              - CR004
              - CR008
              - CR009
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and price sensitivity
        blocks:
          - type: paragraph
            body: >-
              The positive case is unusually strong early evidence for a young defense platform. Calcalist reported a
              proposed $200 million raise at a $1 billion pre-money valuation, while Globes reported the same raise at a
              $1.2 billion valuation and described about $20 million of 2025 revenue and contracts above $50 million.
              Dealroom records the May 2026 financing as $200 million at $1.2 billion and shows Kela's product as a
              modular battlefield operating system, but its revenue field remains non-specific. These figures suggest
              demand and investor conviction, not recurring revenue, cash generation, or a verified post-money cap
              table. The valuation therefore depends on future conversion of Israeli deployments into repeatable allied
              procurement.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV010
              - CV012
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable context
        blocks:
          - type: paragraph
            body: >-
              Kela's thesis rests on an open integration layer that can connect sensors, drones, and other military
              systems faster than closed legacy programs, with early Israeli field use and a Starling collaboration
              providing operational proof points. The anti-thesis is that defense procurement is slow, approval-heavy,
              and dominated by entrenched primes; Globes also reports that Kela sometimes prices aggressively to win
              projects and that open architecture creates cybersecurity questions. Dealroom's comparison list places
              Kela beside much larger companies, including Anduril, but it does not establish a transaction multiple or
              operating comparability. Investors should treat the round valuation as a forward option on international
              scale, not as a revenue multiple validated by public financial statements.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
      - number: '8.3'
        title: Scenario discipline and recommendation
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a point estimate because the public record lacks audited
              revenue, gross margin, backlog quality, dilution terms, preference rights, and customer concentration. The
              bull case requires successful U.S. and allied expansion, sustained deployment growth, and software-like
              economics layered onto integration and hardware activity. The base case assumes continued Israeli traction
              but slower foreign procurement and meaningful services or manufacturing intensity. The bear case assumes
              price competition, integration cost, security review, or procurement delay prevents the $1.2 billion mark
              from compounding. With these uncertainties, track is preferable to buy: the decision can improve after
              term-sheet and unit-economics diligence or after a valuation reset.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV010
              - CV012
      - number: '8.4'
        title: Exit readiness and diligence gates
        blocks:
          - type: paragraph
            body: >-
              Kela's reported rejection of an Anduril acquisition approach is a signal of independent-company ambition,
              not a realizable exit value. EquityZen explains that private holders may obtain liquidity through an exit
              event or an eligible marketplace transaction, but that generic mechanism does not establish a Kela market
              price or transfer rights. The next investment decision should require the signed financing documents,
              fully diluted capitalization, liquidation preferences, investor rights, audited or management revenue by
              customer and product, gross margin split between software and deployment work, backlog conversion, renewal
              evidence, export approvals, and cybersecurity assurance. Thesis break occurs if international deployment
              stalls, contracts do not convert to revenue, or the company must discount materially to win deployments.
            claimRefs:
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation method
            body: >-
              A scenario and diligence-gated framework is used instead of a point multiple because the public record
              does not provide audited recurring revenue, margins, or fully diluted terms.
            calloutType: assumption
            claimRefs:
              - CV009
              - CV010
              - CV014
