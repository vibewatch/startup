      - number: '1.2'
        title: Leadership, capital and scale
        blocks:
          - type: paragraph
            body: >-
              Kela's leadership combines defense, intelligence, software and venture experience. Alon Dror is described
              as a former senior Directorate of Defense Research and Development official and Israel Defense Prize
              winner; Hamutal Meridor previously led Palantir Israel and is identified as president and co-founder; the
              other named founders bring weapons engineering and Rafael algorithm experience. Funding evidence is
              unusually strong for a young private company but not fully primary: CTech reported $100 million raised by
              May 2025, while May and June 2026 reports described a $200 million round at a $1.2 billion valuation and
              approximately $300 million raised in total. Those latest figures are attributed to sources close to the
              company or reported financing records, not audited accounts. Headcount also rose from 25 in 2025 to about
              150 in 2026 reporting, indicating rapid scaling but not necessarily recurring revenue.
