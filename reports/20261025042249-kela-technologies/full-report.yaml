              procurement has lengthy trials, testing and approval procedures. Kela's domestic concentration, planned US
              expansion, export-control exposure, integration burden and dependence on mission-critical reliability are
              therefore central risks. Public sources do not provide audited revenue, gross margin, burn, runway,
              customer count, renewal data, post-money terms, dilution or governance rights.
