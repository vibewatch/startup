        - label: Supplier dependency
          values:
            - value: High
            - value: Medium
            - value: Early
            - value: Critical partner loss without a qualified substitute
        - label: Customer concentration
          values:
            - value: High
            - value: Unverified
            - value: Unverified
            - value: One program dominates revenue or fails to renew
        - label: Liquidity and margin
          values:
