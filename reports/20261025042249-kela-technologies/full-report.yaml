  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Kela’s relevant market is the software and integration layer that fuses heterogeneous sensors, drones,
              radars, intelligence feeds, and decision tools into a common command interface for defense users. Globes
              describes an open-architecture command-and-control system connecting sensors, drones, radars, intelligence
              systems, and weapons, while Calcalist describes an operating system connecting software and hardware
              components for field and headquarters command. This boundary includes mission software, data-fusion,
              integration, deployment, and associated services. It excludes the underlying aircraft, sensors, weapons,
              and broad defense procurement budgets except where those budgets fund integration or command software. The
              practical substitutes are incumbent prime-contractor suites, bespoke government or military builds, point
              solutions operated separately, and the status quo of manual coordination across disconnected systems.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM017
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Public sources do not disclose a market-wide dollar estimate specifically for open command-and-control
              integration software, nor do they establish Kela’s serviceable geography, contract values, or recurring
              software share. The available sizing lenses are narrower and should not be added together: Kela’s reported
              company revenue and contracts indicate early commercial traction, Dealroom records a private-company
              valuation and financing history, and the product descriptions establish a multi-domain use case rather
              than a market total. The strategic ceiling is large because the platform is positioned for Israel, the
              United States, NATO, and other Western militaries, but the conversion from that ceiling to SAM or SOM
              remains unverified. The right diligence output is a bottom-up account and program map by country, mission,
              deployment, software scope, and renewal economics.
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM019
      - number: '2.3'
        title: Buyer, user, and payer pathway
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is likely a defense ministry, military service, or security agency that owns mission
              readiness and procurement authority; commanders and operators are the users; acquisition, program, and
              integration teams are the implementation gatekeepers. Kela’s disclosed initial focus on Israeli defense
              and its stated expansion toward American security agencies and Western militaries imply a government-led,
              programmatic adoption path rather than self-serve SaaS. A platform can enter through a bounded defensive
              deployment or an integrated partner capability, then expand if it proves rapid fielding, interoperability,
              autonomy, and reduced operator burden. The Starling collaboration illustrates this wedge: Kela integrates
              an autonomous UAV into its operating system and receives exclusive rights for Israeli defense users. The
              path is attractive but procurement, security approval, export control, and incumbent integration remain
              mandatory gates.
            claimRefs:
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers include technology-native conflict, the need to integrate commercial and military systems,
              and pressure to shorten deployment cycles. Sequoia reports that Kela had a live product with multiple
              active projects seven months after building began. That is evidence of a speed proposition, not proof of
              repeatable unit economics. Constraints are equally material: Globes identifies slow sales cycles, complex
              procurement, stringent regulation, and entrenched competitors; Israeli export control law covers defense
              equipment, know-how, and related services, and DECA evaluates national-security, foreign-policy,
              international-control, and sensitive- technology considerations. RAND’s current work also frames future C2
              and counter-C2 as a strategic-stability issue. For valuation, the key sensitivities are contract
              conversion, deployment repeatability, software versus integration-services mix, export timing, and whether
              openness creates durable platform control or makes Kela replaceable by a prime.
            claimRefs:
              - CM003
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
      - number: '2.5'
        title: What remains unproven
        blocks:
          - type: paragraph
            body: >-
              The market case is promising but not fully measurable from public evidence. Customer identities,
              active-account counts, contract duration, renewal rates, gross margin, software recurring revenue,
              backlog, win rates, and country-by-country export eligibility are not established in this source set.
              Reported revenue and contract figures also differ by publication date and methodology: Globes reports
              about 20 million dollars of revenue and at least 50 million dollars of contracts in June 2026, while this
              chapter's source set does not establish a customer cohort or recurring-software definition. Those figures
              should not be blended into a market-size estimate. A buyer reference, procurement award, redacted
              contract, deployment cohort, and unit-economics bridge are the highest- value next evidence for converting
              the strategic thesis into a repeatable market model.
            claimRefs:
              - CM019
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is a procurement wedge, not a generic defense TAM
            body: >-
              The evidence supports a specific command-and-control integration wedge with a government buyer and long
              adoption cycle; a broad defense-spending figure would overstate Kela’s addressable software opportunity.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM014
          - type: callout
            title: Openness must become a control point
            body: >-
              Kela’s open architecture can accelerate adoption, but valuation depends on proving that integration, data
              fusion, deployment, or workflow ownership compounds into durable renewals rather than one-off project
              revenue.
            calloutType: risk
            claimRefs:
              - CM003
              - CM017
              - CM019
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Kela's public positioning is an open-architecture battlefield operating system that connects sensors,
              drones, radars, intelligence systems, and weapons into a common command layer. Independent reporting
              describes the product as a way to integrate commercial technology into existing military systems without
              the delays or vendor lock-in associated with traditional procurement, while Globes places the company in
              direct strategic tension with the established Israeli primes Elbit Systems, Rafael, and Israel Aerospace
              Industries. This creates several competitor classes rather than one peer set: closed incumbents that can
              bundle hardware and programs of record; software-led platforms such as Anduril and Palantir; autonomy
              specialists such as Shield AI; component and integration partners; and the status quo of internally
              operated, heterogeneous systems. Kela's reported rejection of an Anduril acquisition offer is a strategic
              signal, but the report also says Kela declined comment, so the approach should not be treated as confirmed
              company strategy. The buyer's real alternative may therefore be a prime contractor's integrated program,
              an incumbent upgrade, or an internal integration effort rather than a like-for-like software purchase.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP010
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP009
              - CP015
      - number: '3.2'
        title: Capability, distribution, and switching comparison
        blocks:
          - type: paragraph
            body: >-
              The most defensible differentiation is architectural and operational: Kela claims rapid, secure
              integration of diverse civilian and military technologies, while reporting describes real-time data fusion
              and a unified command interface. The Starling relationship gives Kela a concrete partner-led route to add
              an autonomous fixed-wing system, including an exclusive right to sell, integrate, and deploy Pathfinder X
              to Israeli forces. That can improve time to field and reduce component manufacturing burden, but it also
              makes partner access and integration quality material dependencies. Anduril is the clearest adjacent
              benchmark because public reporting describes Kela as modeled on Anduril's multi-supplier platform
              approach; Palantir is a relevant software and talent benchmark, not proof of equivalent product
              capability. The public record does not provide comparable uptime, mission success, deployment cost,
              contract duration, or realized pricing for any peer. Those unknowns prevent a numeric performance ranking
              and make switching cost, multi-homing, and lock-in hypotheses rather than established facts.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP011
      - number: '3.3'
        title: Moat durability, pricing pressure, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Kela's potential moat combines defense-domain talent, early operational access, integration know-how, and
              a growing ecosystem rather than a disclosed proprietary standard. Its reported expansion from one Israeli
              border outpost to a high double-digit number of deployments and a Starling integration are encouraging
              distribution signals, but they do not establish repeatable international sales. Dealroom reports a 2025
              revenue estimate and contracts figure, while the same coverage warns that the US market is crowded,
              regulated, and dominated by incumbents; these are third-party reports, not audited disclosures. The same
              source flags cybersecurity questions around open architecture and possible pricing pressure from
              undercutting rivals. Shield AI's much larger financing and Air Force selection show that software-enabled
              autonomy attracts substantial capital and that buyers may prefer interoperable stacks rather than a
              single-vendor lock-in, but they also raise the competitive bar. Kela's durable advantage is therefore
              conditional on proving secure integration, support economics, and procurement repeatability.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP011
              - CP013
              - CP014
      - number: '3.4'
        title: Underwriting implications and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The competitive case is strongest where Kela can turn an open architecture into faster deployment and
              broader supplier access than a prime-led replacement program. It is weakest where the company must compete
              on long-term sustainment, security accreditation, procurement relationships, and global support against
              incumbents with decades of installed-base trust. Public sources do not disclose a customer-by-customer
              revenue split, renewal or retention rates, implementation margins, contract backlog reconciliation, or a
              side-by-side capability test. The reported valuation and funding trajectory may increase resources, but
              funding is not evidence of product-market durability. Before underwriting a moat, diligence should obtain
              redacted contracts, deployment and support metrics, security accreditation evidence, partner termination
              rights, and win-loss data against Anduril, Palantir, Elbit, Rafael, IAI, and internal-build alternatives.
            claimRefs:
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Open architecture is a credible wedge
            body: >-
              Kela's repeated open-platform positioning and the Starling integration provide a concrete ecosystem story,
              although the evidence does not yet prove a durable standard.
            calloutType: strength
            claimRefs:
              - CP001
              - CP006
          - type: callout
            title: The benchmark set has deeper scale
            body: >-
              Anduril, Palantir, Shield AI, and incumbent primes have stronger disclosed scale or program access; Kela's
              public record lacks comparable pricing, uptime, and win-loss evidence.
            calloutType: risk
            claimRefs:
              - CP003
              - CP009
              - CP013
          - type: callout
            title: Underwrite deployment repeatability, not funding momentum
            body: >-
              Competitive diligence should prioritize redacted contracts, deployment-cycle metrics, security evidence,
              support economics, and partner rights before treating the platform as a durable moat.
            calloutType: recommendation
            claimRefs:
              - CP011
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Public descriptions point to a hybrid defense-platform model rather than a clean SaaS model. Kela
              describes an open operating system that integrates sensors, drones, radars, intelligence systems, and
              other commercial or military components, while the 2026 reporting describes deployments, a factory, and
              hardware-enabled systems. Dealroom labels the business model SaaS, but that taxonomy does not establish
              the mix of subscription, license, integration, services, hardware, or contract revenue. The Starling
              arrangement adds a channel and integration dimension: Kela receives exclusive rights to sell, integrate,
              and deploy Pathfinder X in specified Israeli defense channels. Consequently, list pricing, realized
              pricing, revenue recognition, backlog, renewal rates, and gross margin remain underwriting gaps rather
              than inputs to a precise revenue forecast.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI007
              - CI016
      - number: '4.2'
        title: GTM motion, cost structure, and operating leverage
        blocks:
          - type: paragraph
            body: >-
              Kela's go-to-market motion appears enterprise and government-led: early activity is concentrated in
              Israel's defense establishment, with an intended expansion toward U.S. and other Western militaries. That
              motion can support large contracts, but it also implies long procurement cycles, stringent requirements,
              deployment labor, and working-capital exposure. Public reporting identifies dozens of Israeli deployment
              points and a factory, while the partnership model suggests Kela can add capabilities without manufacturing
              every component. These facts support a plausible path to operating leverage, but they do not quantify CAC,
              sales-cycle duration, implementation cost, inventory, capex, service staffing, or contribution margin. The
              cost base is therefore more likely to be a mix of engineering, field deployment, compliance, and
              production costs than a pure software expense profile.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.3'
        title: Traction, funding, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The strongest current public traction signal is the June 2026 report that Kela had approximately $20
              million of revenue, at least $50 million of contracts, about 150 employees, a southern-Israel factory, and
              dozens of domestic deployment points. Dealroom independently displays a broader $10–50 million
              latest-reported revenue range and a $1–2.5 billion valuation range, alongside a May 2026 $200 million
              financing at a $1.2 billion valuation. Earlier reporting described $100 million raised by May 2025, while
              the later report described approximately $300 million cumulatively. These are meaningful financing
              signals, not proof of cash available: terms, preferences, dilution, debt, cash balance, burn, runway, and
              restricted funds are not publicly disclosed. The reported contract figure is also not equivalent to
              recognized revenue or ARR.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Kela's financial profile is promising but not yet model-ready. Revenue and contract disclosures imply
              commercial conversion beyond a pre-revenue prototype, and the latest capital event appears capable of
              funding substantial expansion. However, the evidence is concentrated in press and data-platform
              disclosures, with no public income statement, cash-flow statement, customer concentration, gross-margin
              bridge, or cohort retention. The sector backdrop is favorable: U.S. government guidance describes record
              Israeli defense exports, strong U.S. funding links, and a large incumbent base. That backdrop can expand
              demand while also increasing competition and procurement complexity. A financeable next step is a
              diligence package reconciling signed backlog to revenue, separating software from hardware and services,
              and showing cash runway under delayed procurement and deployment scenarios.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI009
              - CI010
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing access is a current strength
            body: >-
              Reported financing of approximately $300M by June 2026, including a reported $200M round at a $1.2B
              valuation, gives Kela unusual funding capacity for a company founded in 2024; the amount still needs
              reconciliation to cash and financing terms.
            calloutType: strength
            claimRefs:
              - CI011
              - CI012
          - type: callout
            title: Revenue quality is the main blocker
            body: >-
              Public evidence does not disclose recurring revenue, gross margin, customer concentration, collections,
              burn, or runway, so the headline revenue and contract figures cannot yet support a reliable valuation or
              downside case.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Kela's product is described as a battlefield operating system rather than a single sensor, drone, or
              weapon. Calcalist reports that the system connects software and hardware components such as sensors and
              radars, supports soldiers in the field and command management at headquarters, and presents information
              from multiple sources through a unified command interface. The operating model is therefore an integration
              layer: a military customer brings heterogeneous assets, Kela ingests and processes their data, and
              commanders receive a consolidated operating picture and decision-support surface. This is a differentiated
              workflow proposition, but the public record does not show a product manual, API contract, independently
              measured latency, or a repeatable deployment playbook.
            claimRefs:
              - CE001
              - CE002
              - CE003
