      - number: '1.3'
        title: Milestones, deployment and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The public milestone record shows a fast sequence from July 2024 formation to seed and Series A financing,
              a $60 million follow-on round, field deployment, a Starling UAV collaboration, reported expansion across
              Israeli border outposts, a Pelanor acquisition, and the reported 2026 financing. These milestones support
              strategic relevance and execution momentum, but they do not establish durable unit economics. Globes
