  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Strategic proof and financing momentum are offset by opaque economics and execution-sensitive valuation.
    data:
      nodes:
        - id: scale
          label: Early scale signal
          detail: Reported 2025 revenue of about $20M, contracts above $50M, and rapid deployment growth.
        - id: product
          label: Platform proof
          detail: Open command-and-control architecture integrates multiple connected defense assets.
        - id: financing
          label: High private mark
          detail: $200M financing reported at $1.0B pre-money or $1.2B valuation, depending on source.
        - id: opacity
          label: Disclosure gap
          detail: Terms, margins, customer concentration, retention, and cash economics are not public.
        - id: risk
          label: Execution risk
          detail: Procurement, cybersecurity, export, pricing, and incumbent competition can delay conversion.
        - id: recommendation
          label: Track
          detail: Require financing and operating diligence before accepting the current reference price.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV010
      - CV012
