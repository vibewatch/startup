  - id: FU001
    title: Customer journey from integration to expansion
    type: journey-map
    summary: >-
      Kela's disclosed customer path runs from defense-system integration through operational deployment and
      partner-enabled expansion, with retention proof still unobserved.
    data:
      items:
        - label: Defense need
          touchpoints:
            - Fragmented military systems and demand for rapid adoption of commercial technology
            - Government procurement and security qualification
        - label: Initial integration
          touchpoints:
            - Connect sensors, radars, drones, intelligence systems, and edge technologies
            - Partner-led integration such as Starling Pathfinder X
        - label: Operational deployment
          touchpoints:
            - Unified command interface for field and headquarters users
            - Reported expansion from limited outposts to dozens of deployment points
        - label: Platform expansion
          touchpoints:
            - Add capabilities and connected assets through open architecture
            - Potential expansion from Israel to U.S. and Western militaries
        - label: Durability proof
          touchpoints:
            - Renewal, repeat deployments, utilization, and outcomes
            - Public evidence remains insufficient for retention or concentration analysis
        - label: Commercial scale
          touchpoints:
            - Customer-level revenue, contract duration, and active-account disclosure
            - Required diligence before treating deployment breadth as repeatable economics
    claimRefs:
      - CU002
      - CU007
      - CU008
      - CU014
      - CU016
