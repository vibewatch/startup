      - number: '5.2'
        title: Architecture, modules, and maturity
        blocks:
          - type: paragraph
            body: >-
              The reported architecture has several observable layers: connected sensors and other military or
              commercial assets; a software layer that integrates and processes heterogeneous inputs; AI-assisted
              analysis and pattern recognition; and a unified command interface for field and headquarters users. The
              acquisition of Pelanor adds a plausible analytics and cloud-cost capability, but the target's reported
              product was a FinOps platform, not proof that Pelanor code is integrated into Kela's operational stack.
              The Starling collaboration is a stronger integration signal because the report explicitly says Kela is
              integrating the Pathfinder X UAV system into its own operating system. Public evidence supports a working
              product and field deployment claims, but not a quantified maturity level, uptime history, software bill of
              materials, or formal security certification.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE003
