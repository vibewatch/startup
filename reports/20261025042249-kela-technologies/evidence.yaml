evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Executed financing documents showing post-money valuation, dilution, preferences, debt and governance rights.
    whyItMatters: The reported valuation and capital raised cannot be translated into investor economics without the terms.
    diligencePath: Obtain the latest cap table, financing agreement, investor-rights agreement and board materials.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited revenue bridge, backlog conversion, customer concentration and recurring-versus-services mix.
    whyItMatters: Reported revenue and contracts do not establish repeatability, margin quality or cash generation.
    diligencePath: Request audited financials, contract schedule, bookings-to-revenue bridge and top-customer references.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board, executive roster and formal governance responsibilities.
    whyItMatters: Rapid scaling and a concentrated founding team may create key-person and oversight risk.
    diligencePath: Review board minutes, committee charters, succession plans and current organization chart.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: security
    missingEvidence: Independent cyber, reliability, accreditation and incident evidence for mission-critical deployments.
    whyItMatters: Open integration across security boundaries expands the attack surface and availability burden.
    diligencePath: Obtain security accreditation, penetration-test summaries, uptime/incident logs and customer acceptance evidence.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A market forecast or bottom-up account universe for defense command-and-control integration software by geography
      and mission.
    whyItMatters: Without a defined denominator, TAM, SAM, and SOM cannot be tested against Kela's valuation or growth claims.
    diligencePath: >-
      Commission a bottom-up market map using defense appropriations, named programs, procurement notices, and
      software-versus-services scope.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-traction
    missingEvidence: Named customer references, contract values, duration, renewal, backlog, and recurring software share.
    whyItMatters: >-
      These determine whether the market wedge scales as repeatable platform revenue or remains project integration
      work.
    diligencePath: Request a redacted contract schedule, deployment cohort, renewal bridge, and revenue segmentation under NDA.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: regulation
    missingEvidence: >-
      Country-by-country export-control and security-approval path for Kela's software, integrations, and partner
      hardware.
    whyItMatters: Regulatory eligibility can change the timing and reachable geography of the serviceable market.
    diligencePath: Obtain counsel-reviewed export classifications and a program-level approval timeline for each target country.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: conflicting-data
    severity: minor
    topic: disclosure
    missingEvidence: A reconciled historical series defining revenue, contracts, employees, and financing dates across publications.
    whyItMatters: Different dates and definitions can create false growth or market-size precision.
    diligencePath: Reconcile source definitions with company-confirmed management accounts and financing documents.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized contract pricing, discounting, support fees, and gross margin by deployment are not public.
    whyItMatters: Without lifecycle economics, an open-platform wedge cannot be distinguished from a low-price integration strategy.
    diligencePath: Obtain redacted contracts, pricing schedules, renewal terms, and deployment-level contribution margins.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: comparability
    missingEvidence: >-
      Independent side-by-side evidence on uptime, mission outcomes, security accreditation, and deployment time is
      missing.
    whyItMatters: >-
      Capability claims and ordinal positioning cannot establish superiority over incumbent or software-native
      alternatives.
    diligencePath: Request customer references, security attestations, operational metrics, and a structured win-loss review.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer concentration, renewal, multi-homing, integration ownership, and partner termination rights are
      undisclosed.
    whyItMatters: >-
      These inputs determine whether Kela's deployment footprint becomes durable lock-in or remains replaceable project
      work.
    diligencePath: >-
      Review customer-level contracts, renewal cohorts, architecture ownership, and Starling partnership termination
      provisions.
    relatedQuestionRefs:
      - QP006
      - QP009
  - type: missing-source
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited or management financial statements separating software, hardware, integration, services, and contract
      revenue.
    whyItMatters: Without mix and margin data, reported revenue cannot establish recurring quality or operating leverage.
    diligencePath: >-
      Request monthly P&L, revenue-recognition policy, segment gross margin, backlog roll-forward, and customer-level
      concentration under NDA.
    relatedQuestionRefs:
      - QI001
      - QI004
      - QI007
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, committed capex, debt, restricted cash, and downside runway.
    whyItMatters: Reported funding raised is not cash available and cannot prove independence from the next financing round.
    diligencePath: >-
      Request a current balance sheet, 24-month cash forecast, financing documents, debt schedule, and downside case
      assuming procurement delays.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: traction
    missingEvidence: >-
      A reconciled bridge between Globes' approximately $20M revenue, at least $50M contracts, and Dealroom's $10–50M
