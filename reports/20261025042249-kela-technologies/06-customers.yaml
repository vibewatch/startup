company:
  name: Kela Technologies
chapter:
  number: 6
  title: Customers
  summary: Public evidence indicates that Kela has moved beyond a purely conceptual defense platform into deployments and customer-linked integrations, but the public record still does not identify customer names, active-account counts, renewal behavior, or customer concentration. The strongest adoption signal is operational deployment in Israel and the Starling integration, while retention and revenue quality remain material diligence gaps.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      Kela's apparent customer base is concentrated in government and defense users rather than
      conventional commercial software buyers. The product is described as an operating system
      connecting sensors, radars, drones, intelligence systems, and other military assets, so the
      operational user is likely distributed across field personnel, command staff, and technical
      integration teams, while the payer is a defense establishment or security agency. Public
      sources place the company mainly inside Israel's domestic defense establishment and describe
      expansion toward U.S. and other Western militaries. That creates strategic value if Kela
      becomes a common integration layer, but it also exposes the company to long procurement
      cycles, security approvals, budget cycles, and customer-specific integration work. No source
      provides a customer-by-revenue segmentation, contract mix, or disclosed payer list, so the
      table distinguishes evidenced segments from unresolved commercial detail.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and deployment evidence
    body: >-
      Adoption evidence is stronger than the customer-disclosure record but remains uneven. The
      March 2025 Calcalist report said Kela had a working product while withholding customer
      identities; the June 2026 Globes report described activity expanding from a limited number
      of outposts to dozens of deployment points within Israel's borders. The Starling agreement
      adds a named, use-case-specific integration with exclusive rights to sell, integrate, and
      deploy Pathfinder X for Israeli defense forces, although the source does not state the
      number of deployed systems or whether the arrangement has generated recognized revenue. A
      January 2026 report also said some Kela systems were already in service with security forces
      in Israel and other countries, while a separate March 2025 report said operational
      implementation was expected but disclosed no details. Public sources describe plans for
      U.S. and Western military expansion, but do not establish a diversified international
      customer base. These signals support real deployment and integration progress, not proof of
      broad repeatable adoption or recurring revenue.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof-and-durability
    title: Named proof, retention, and durability
    body: >-
      The public record contains one clearly named customer-adjacent deployment pathway rather
      than a roster of named end customers. Starling is named as a commercial partner whose UAV
      system Kela would integrate and deploy in the IDF and Ministry of Defense forces; the
      defense establishment is described as the primary operating environment, but specific
      agencies, contracts, volumes, outcomes, and renewal terms are not disclosed. Calcalist
      explicitly reported that it was unclear whether Kela had customers in March 2025, which
      sets an important disclosure baseline rather than proving that no customers existed. The
      later deployment disclosures therefore show progress, but they do not establish retention,
      gross or net revenue retention, churn, contract duration, satisfaction, or expansion within
      accounts. The diligence priority is to obtain contract-level evidence that separates pilots,
      production deployments, framework agreements, and integration services.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: expansion-and-concentration
    title: Expansion path and concentration risk
    body: >-
      Kela's expansion thesis is a land-and-expand model built around an open platform: integrate
      an initial capability, add sensors or autonomous systems, and extend the operating layer
      across more units or allied customers. The Starling collaboration demonstrates this
      adjacency strategy, while the reported move from a limited number of outposts to dozens of
      deployment points suggests geographic or operational expansion inside Israel. However, the
      same evidence implies concentration risk because public reporting says Kela operates mainly
      within the domestic defense establishment and does not disclose customer concentration.
      Expansion into U.S. and other Western militaries remains described as an ambition or plan,
      not a verified revenue diversification outcome. Investors should therefore underwrite the
      platform's strategic access separately from repeatable customer economics, and request
      customer-level revenue, renewal, deployment, and procurement-cycle data before treating
      deployment breadth as durable commercial scale.
    claimRefs: [CU014, CU015, CU016]
    figureRefs: [FU001]
