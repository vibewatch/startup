companyProfile:
  summary: >-
    Kela Technologies is an Israeli defense-software company founded in 2024 and focused on an open, modular battlefield
    command-and-control platform. The platform is designed to connect sensors, drones, radars, intelligence systems, and
    other commercial or military technologies through a unified operating layer, with public reporting indicating early
    Israeli deployment and ambitions for allied-market expansion.
