- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Public evidence
  - Why it matters
  - Net read
  rows:
  - - ReFuelEU and UK legal mandates
    - Driver
    - EU and UK rules make SAF demand compulsory rather than optional
    - Creates durable demand visibility for certified producers
    - Strong positive for producers already selling into Europe
  - - Singapore levy and Asian policy experimentation
    - Driver
    - CAAS levy socializes the premium to meet a 1% target from 2026
    - Provides an Asian template for demand formation without immediate full mandates
    - Positive but early-stage
  - - Corporate and certificate demand
    - Driver
    - American-Google, Lufthansa corporate fares, and United programmes show non-airline payers emerging
    - Broadens the buyer base and can help absorb premiums
    - Positive and growing
  - - Feedstock scarcity and HEFA dependence
    - Constraint
    - SkyNRG and EcoCeres both highlight feedstock pressure and cost sensitivity
    - Could cap growth or compress margins even when demand is strong
    - Material risk
  - - Project bankability and FID bottlenecks
    - Constraint
    - ICCT says fewer than 30% of SAF projects reach FID
    - Many announced volumes may never materialize on schedule
    - Material risk
  - - Price premium versus fossil jet
    - Constraint
    - IATA and ICCT both report multi-x cost premium over conventional jet fuel
    - High price slows adoption and can distort mandate markets
    - Material risk
  - - Policy sequencing quality
    - Both
    - IATA argues mandates without enabling production can backfire
    - Bad sequencing can create scarcity rents instead of scale
    - Key determinant of market health
  notes: The market is being pulled forward by regulation faster than it is being de-risked by supply, finance, and feedstock expansion.
