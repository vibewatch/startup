tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Relevance to EcoCeres
  rows:
  - - Compliance SAF in mandated aviation markets
    - SAF molecules, sustainability certification, blending, storage, distribution, and compliance value
    - Most airline operating spend, aircraft capex, airport capex unrelated to fuel
    - Fuel suppliers, airlines, regulators, airports, corporates via SAFc
    - Core near-term market because EcoCeres sells certified waste-based SAF into mandate-driven markets
  - - Voluntary or certificate-backed SAF demand
    - Corporate SAF certificates, airline green-fare programmes, book-and-claim attributes
    - Generic carbon offsets and unrelated travel-sustainability services
    - Corporate travel buyers, airlines, registries
    - Important demand accelerator that can absorb green premium before physical supply localizes
  - - Adjacent HVO and renewable diesel use
    - Drop-in road fuel, backup-power fuel, logistics and industrial decarbonization
    - Electric-vehicle hardware, grid storage, unrelated power capex
    - Fleet operators, data-centre operators, logistics buyers
    - Adjacency that broadens EcoCeres demand but is not the same market as aviation compliance SAF
  - - Advanced-pathway and e-SAF development
    - Alcohol-to-jet, power-to-liquid, and other next-gen eligible pathways
    - Unqualified biofuels and fossil co-products that fail sustainability screens
    - Developers, investors, grant agencies, airlines
    - Strategically relevant because feedstock limits make pathway diversity essential after 2030
  - - Excluded broad climate TAM
    - Most renewable-power investment, most EV charging, general aviation services
    - All broad clean-energy spending not tied to low-carbon drop-in fuels
    - Not directly applicable
    - Excluded to avoid overstating the opportunity with generic transition numbers
  notes: 'Boundary is intentionally narrow: it captures monetizable SAF and adjacent renewable-fuel demand, not all clean transportation or all aviation spend.'
