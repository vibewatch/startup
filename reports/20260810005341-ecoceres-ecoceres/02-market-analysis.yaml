- id: TM003
  title: Segment / buyer map
  columns:
  - User
  - Economic payer
  - Adoption trigger
  - Evidence of willingness to pay
  - Implication for EcoCeres
  rows:
  - - Airlines in EU / UK mandate zones
    - Fuel suppliers and airlines, partly passed to passengers or shippers
    - Mandates, penalties, public climate targets
    - IATA, Delta, Lufthansa, and United all emphasize SAF as a primary lever
    - EcoCeres benefits where mandate-backed airlines need reliable certified supply
  - - Corporate travel buyers
    - Corporates paying through SAF certificates or green fares
    - Scope 3 and travel-emissions targets
    - American-Google and Lufthansa-Airbus structures show direct corporate participation
    - EcoCeres can capture premium demand even when physical fuel use is remote
  - - Airports and logistics partners
    - Fuel-system operators and distributors
    - Infrastructure readiness and blending capability
    - Delta-Shell and World Energy highlight delivery, storage, and logistics as core enablers
    - Route-to-aircraft logistics is part of the market, not an afterthought
  - - Asian policy makers and hub operators
    - Passengers, cargo shippers, and airlines through levies or incentives
    - Industrial policy and energy-security goals
    - Singapore SAF levy and Hong Kong industrial-chain proposals create policy pull
    - EcoCeres’ regional position is strongest if Asian hubs follow Singapore-like models
  - - Adjacent industrial users of HVO
    - Industrial operators and infrastructure owners
    - Lower-carbon backup power and transport fuel substitution
    - EcoCeres data-centre HVO pilots show real adjacent demand
    - Adjacency can diversify revenue away from pure aviation cycles
  notes: Buyer and payer are separated because the party consuming SAF is often not the only or ultimate party financing the premium.
