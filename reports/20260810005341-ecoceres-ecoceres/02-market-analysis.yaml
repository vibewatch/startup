chapter:
  number: 2
  title: Market Analysis
  summary: EcoCeres sells into a SAF market that is no longer just voluntary climate spend but a compliance-driven fuel market increasingly shaped by ReFuelEU, UK policy, and Asian levy-based adoption. Demand signals are real and expanding, yet current supply remains tiny relative to mandated trajectories, prices remain several times fossil jet fuel, and feedstock plus project-finance bottlenecks still determine who can actually scale.
sections:
- id: market-boundary-and-regulatory-definition
  title: Market boundary and regulatory definition
  body: 'EcoCeres’ core market is not all clean transportation and not even all biofuels. It is the subset of low-carbon liquid fuels that can satisfy hard-to-abate transport demand, especially sustainable aviation fuel for airline compliance and corporate decarbonization, with HVO as an adjacent market in road transport and industrial backup power. Official EcoCeres materials emphasize that SAF is currently the only commercially viable way to decarbonize aviation at scale and that its product can be used as a drop-in fuel under ASTM D7566 without modifying aircraft or airport fuel infrastructure. ICAO provides the broader policy frame by defining SAF as renewable or waste-derived aviation fuels meeting sustainability criteria and by stating that SAF has the greatest potential to reduce CO2 from international aviation. That makes the included spend much narrower than a generic energy-transition TAM: it is SAF molecules, compliance value, airport logistics, certification, and corporate book-and-claim
    demand. Excluded spend includes the rest of airline operations, most electric-transport capex, and HVO demand outside aviation. ReFuelEU matters because it turns that market boundary into an enforceable one across Europe, where harmonized rules and binding shares move the conversation from voluntary offtakes toward regulated fuel supply.'
