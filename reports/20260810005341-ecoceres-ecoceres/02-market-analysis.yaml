- id: buyers-payers-and-adoption-paths
  title: Buyers, payers, and adoption paths
  body: 'The buyer map is more complex than simply “airlines buy fuel.” Airlines remain the physical users of SAF, but the payer stack increasingly includes jet-fuel suppliers, airports, regulators, and corporate customers seeking emissions claims through book-and-claim or certificate structures. IATA explicitly argues that book-and-claim systems are essential if SAF is to become a global rather than local market, and corporate demand examples already show why. Lufthansa uses SAF-backed corporate fares, American and Google structured a record SAF certificate agreement, and United gives both corporate customers and retail travelers mechanisms to support SAF deployment. Argus also frames the customer set broadly, noting that airlines, aviation-fuel suppliers, and corporate customers are all turning to SAF to meet emissions and ESG targets. Distribution adds another adoption layer: Delta’s Shell deal and World Energy’s logistics commentary show that infrastructure, blending, and delivery can
    be as decisive as molecular supply. For EcoCeres, that matters because the company does not only need to make fuel; it needs routes into airport systems, trusted certification, and counterparties willing to pay or subsidize the green premium. The result is a market with multi-sided demand formation, where whoever best coordinates airlines, corporates, logistics providers, and regulators captures the most durable economics.'
