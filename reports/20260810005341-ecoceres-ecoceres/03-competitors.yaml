  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Actual EcoCeres contract prices, realized spreads, and margin contribution by customer or geography.
    whyItMatters: Competitive strength in SAF often depends on netbacks and logistics cost, not just technical capability.
    diligencePath: Request customer contracts, delivered margin bridges, and distributor economics.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: moat
    missingEvidence: A full public map of EcoCeres supplier exclusivity, airport access, and certified route-to-market partners.
    whyItMatters: Distribution power can outrun molecule quality in mandate-driven markets.
    diligencePath: Request feedstock and logistics partner list plus airport-delivery coverage map.
    relatedQuestionRefs:
    - QP013
    - QP025
  - type: enumeration-incomplete
    severity: minor
    topic: TP001 competitor profile
    missingEvidence: Additional direct competitor profiles for smaller regional SAF suppliers in Europe and Asia.
    whyItMatters: The current map captures the most visible benchmarks but not every emerging regional supplier.
    diligencePath: Expand the next refresh with additional regional players and capacity markers.
    relatedQuestionRefs:
    - QP001
    relatedTableRefs:
    - TP001
  - type: stale
    severity: minor
    topic: public-comps
