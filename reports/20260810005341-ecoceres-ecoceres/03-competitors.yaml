  rows:
  - - EcoCeres
    - Waste-based HEFA / integrated renewable-fuels platform
    - ~770,000 tpa aggregate renewable-fuel capacity across two plants
    - Strongest visible proof in Europe, Hong Kong, and Australia-linked SAF channels
    - Direct benchmark for what an Asia-based challenger can achieve with commercial plants today
  - - Neste
    - Incumbent renewable-fuels and SAF supplier
    - Public market cap ~$24.99B; revenue ~$22.54B TTM
    - Global airport availability and broad brand recognition
    - Largest benchmark incumbent on SAF scale and credibility
  - - World Energy
    - Commercial HEFA SAF producer and logistics operator
    - Paramount plant operating; Houston hub planned
    - North American infrastructure and distribution emphasis
    - Competes on actual physical supply and logistics, not just pathway rhetoric
  - - LanzaJet
    - ATJ technology company and fuels producer
    - Freedom Pines 10M gpy plant; $650M pre-money in 2026 financing
    - Commercial ethanol-to-SAF leader with tolling and offtake structure
    - Alternative-pathway challenger for airline decarbonization budgets
  - - SkyNRG
    - Market developer becoming plant owner / operator
    - DSL-01 under construction; prominent SAF outlook franchise
    - Strong customer and policy ecosystem positioning
    - Influences buyer expectations and future HEFA / advanced-pathway competition
  - - Gevo
    - ATJ / corn-based SAF platform
    - Public market cap ~$0.38B; revenue ~$0.17B TTM
    - U.S. pathway challenger with public-market visibility
    - Shows the public market’s current tolerance for smaller SAF challengers
  - - Aemetis
    - Biofuels platform with SAF aspirations
    - Public market cap ~$0.12B; revenue ~$0.21B TTM
    - Smaller listed comparator rather than direct premium benchmark
    - Useful low-end public valuation reference
  - - Darling Ingredients
    - Large feedstock and renewable-ingredients platform
    - Public market cap ~$9.44B; revenue ~$6.30B TTM
    - Feedstock and renewable-products scale reference
    - Highlights the value of upstream feedstock control even when end-market mix differs
  notes: Public scale markers mix market-cap, revenue, and plant-capacity datapoints because competitors disclose different kinds of information.
