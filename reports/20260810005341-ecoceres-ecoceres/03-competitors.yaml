- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Risk or moat dimension
  - Current read
  - Supporting evidence
  - Why it matters
  - Residual exposure
  rows:
  - - Waste-feedstock access
    - Relative moat
    - EcoCeres cites 100,000+ restaurant relationships and high traceability
    - Could defend margins and reliability if lipid markets tighten
    - Still vulnerable if regulators or rivals redirect feedstock flows
  - - Integrated HEFA execution
    - Relative moat
    - EcoCeres operates two plants while some ATJ peers are earlier stage
    - Operating experience is valuable in a fragile project-finance market
    - Neste and World Energy still have stronger incumbent depth
  - - Customer proof
    - Relative moat
    - BA, Cathay/HSBC, and Viva give visible commercial traction
    - Named customers lower pure-technology skepticism
    - Volumes, prices, and contract terms remain private
  - - Capital-market visibility
    - Competitive risk
    - Listed peers and large incumbents have clearer public scale markers
    - Capital access can accelerate capacity and route-to-market faster than product quality alone
    - EcoCeres remains privately valued and less transparent
  - - Pathway disruption / FOAK failure
    - Competitive risk
    - Fulcrum bankruptcy and ICCT FID data show how hard new pathways are to scale
    - Competitor failure can remove rivals but also warn against overconfidence
    - Any delayed or underperforming expansion can quickly erode standing
  - - Policy and logistics dependence
    - Competitive risk
    - Delta/Shell and World Energy both emphasize infrastructure and delivery
    - Winning SAF supply often requires channel access as much as fuel production
    - EcoCeres still relies heavily on partner-controlled logistics
  notes: Durability is assessed against the current market structure, where logistics, feedstock, and financing discipline can outweigh pure pathway novelty.
