chapter:
  number: 3
  title: Competitors
  summary: 'EcoCeres competes across two overlapping sets: large HEFA incumbents such as Neste and World Energy that already control meaningful SAF supply and logistics, and next-generation challengers such as LanzaJet, SkyNRG, and Gevo that are pushing alternate pathways or project models. EcoCeres’ best competitive angles are waste-feedstock access, integrated HEFA execution, and real airline or industrial customer proof, but the company still competes from a smaller disclosed scale base than the largest incumbents and from a less transparent financial position than public peers.'
sections:
- id: landscape-and-peer-set
  title: Landscape and direct peer set
  body: 'EcoCeres does not face one monolithic competitor class. The most direct competitive pressure today comes from incumbent renewable-fuels suppliers already selling SAF at scale, especially Neste and World Energy. These companies are closest to EcoCeres on pathway maturity, because all rely on currently bankable drop-in fuel production tied to waste oils, fats, or similar sustainable feedstocks and existing airport or distribution infrastructure. A second class consists of technology-forward challengers such as LanzaJet and Gevo, whose alcohol-to-jet positioning targets the same airline decarbonization budget but through a different feedstock and process stack. A third class includes ecosystem builders such as SkyNRG, which combines market development, offtake structuring, and now plant development. Finally, public biofuel companies such as Aemetis and Darling matter less as product twins than as valuation and supply-chain reference points. The practical implication is that EcoCeres
    is competing on several axes at once: present SAF availability, feedstock access, route-to-market, certification credibility, and the ability to keep scaling when newer pathways and older incumbents both push into the same policy-created demand pool.'
