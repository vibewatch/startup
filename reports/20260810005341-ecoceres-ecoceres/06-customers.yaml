- id: named-customer-proof-and-adoption
  title: Named customer proof and adoption surfaces
  body: 'The public customer-proof record is broad and reasonably fresh. British Airways is the clearest example of production-grade aviation demand because the parties not only signed a multi-year agreement but later extended it through 2030. Cathay Pacific and HSBC add a different form of evidence: not pure fuel offtake scale, but a traceability-rich SAF ecosystem in Hong Kong that links airline operations, corporate travel emissions, and policy ambition. On the industrial side, Bridge Data Centres, GDS, and Chindata show that EcoCeres has opened a second major use case for HVO in backup-power applications. That matters because these customers value reliability and compatibility with existing generators, not only low-carbon branding. EcoCeres’ 2026 Project Spark consortium in China broadens the picture again by putting regulators, fuel suppliers, passenger airlines, cargo airlines, and chemical players into one pilot structure. Taken together, the adoption evidence suggests EcoCeres is
    no longer selling only a generic “green fuel” concept. It is already landing into multiple real workflows across Europe, Hong Kong, Mainland China, Southeast Asia, and Australia. The gap is not proof of use; the gap is proof of volume, repeat purchase cadence, and customer economics by segment.'
