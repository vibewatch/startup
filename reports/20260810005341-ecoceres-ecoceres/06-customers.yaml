- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / friction risk
  - Impact
  - Diligence path
  rows:
  - - More airline offtakes
    - SAF supply remains scarce and expensive
    - Can slow conversion from announced intent to purchased volume
    - Request committed offtakes and backlog by geography
  - - More corporate Scope 3 programs
    - Certificate economics and accounting complexity may delay adoption
    - Corporate channel may be meaningful but lumpy
    - Request program design, margin capture, and renewal behavior
  - - More data-centre HVO sites
    - Pilot success may not translate to large recurring fleetwide demand
    - Could diversify away from aviation if conversion works
    - Request post-pilot orders and site rollout plans
  - - More distributor channels
    - Partner dependence can obscure end-customer concentration
    - Improves reach but can weaken direct customer ownership
    - Request distributor economics and exclusivity terms
  - - Regional ecosystem build-out
    - Policy or infrastructure delays can defer adoption despite demand
    - Particularly relevant in Hong Kong and China hub plans
    - Request airport, blending, and regulatory milestone tracking
  notes: Expansion is plausible across several channels, but public evidence still leaves concentration and repeat-purchase intensity largely private.
