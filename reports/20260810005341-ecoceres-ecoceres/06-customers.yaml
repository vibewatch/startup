- id: durability-expansion-and-repeat-usage
  title: Durability, expansion, and repeat-usage read
  body: EcoCeres has some meaningful signs of durability, but only one relationship is publicly visible enough to be treated as a clear renewal signal. British Airways’ extension to 2030 is the strongest retention evidence in the set because it moves beyond announcement-stage excitement into a publicly renewed commercial relationship. Most other named accounts remain pilots, ecosystem programs, or channel partnerships. That does not make them weak; it just means they should not be overstated as proven recurring revenue. Cathay and HSBC demonstrate that EcoCeres can support a more complex customer journey involving certificates, traceability, and corporate travel emissions accounting. Delta, American, Google, and Lufthansa provide adjacent market evidence that the sector’s customer expansion loops increasingly involve airline-corporate ecosystems, certificate structures, and multi-year blended supply programs. Project Spark likewise suggests that green premiums may be socialized across several
    stakeholders rather than borne by one airline alone. For EcoCeres, expansion therefore seems most likely to occur through ecosystem depth—more airports, more distributors, more corporate buyers, and more industrial sites—rather than by classic land-and-expand software motions. This is a workable model, but it makes partner alignment and policy continuity central to customer durability.
