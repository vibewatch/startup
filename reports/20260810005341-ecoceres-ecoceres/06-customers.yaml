chapter:
  number: 6
  title: Customers
  summary: 'EcoCeres’ customer proof is stronger than most private climate manufacturers at a similar disclosure level: airlines, distributors, corporate-travel programs, and data-centre operators all appear in the retained record. The evidence supports real adoption and some renewal durability—especially with British Airways—but most relationships remain volume-opaque, making concentration, retention, and share-of-wallet analysis only partially knowable from public sources.'
sections:
- id: customer-segments-and-buyers
  title: Customer segments, buyers, and payers
  body: 'EcoCeres serves several distinct customer archetypes rather than one homogeneous buyer. The clearest segment is airlines and airline-linked fuel procurement, where the company’s SAF proposition is framed around regulatory compliance, lifecycle emissions reduction, and brand value for increasingly climate-conscious travelers. A second segment is corporate-travel or Scope 3 buyers that do not directly burn the fuel but want decarbonized travel claims through airline or SAF certificate programs. A third segment is fuel-channel partners and distributors such as Viva Energy, whose role is to store, blend, and route product into aviation markets. A fourth segment is industrial or infrastructure operators such as Bridge Data Centres, GDS, and Chindata, which use HVO as a drop-in replacement for diesel in backup-power systems. The payer can therefore differ from the user. Airlines may buy fuel for their own operations, corporations may fund a green premium to address travel emissions, and
    infrastructure operators may buy HVO for resilience-critical sites. This multi-buyer structure is strategically useful because it broadens the demand surface, but it also means EcoCeres must manage several types of procurement logic at once: aviation certification and airport infrastructure, corporate credibility and traceability, and industrial reliability for mission-critical power applications.'
