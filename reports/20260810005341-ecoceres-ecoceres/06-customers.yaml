tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / strategic value
  - Gap
  rows:
  - - Airlines and cargo carriers
    - Buyer and user often the airline or fuel procurement unit
    - Blend SAF into flight operations to cut lifecycle emissions and meet mandates
    - Core premium segment with strongest strategic importance
    - Customer count, annual volumes, and share of wallet are undisclosed
  - - Corporate travel / Scope 3 buyers
    - Payer is corporate customer; airline is delivery vehicle
    - Use SAF certificates or linked programs to address travel emissions
    - Important for green-premium sharing and demand formation
    - Commercial mechanics and renewal rates are opaque
  - - Fuel distributors / terminal partners
    - Partner buys, stores, blends, or routes fuel to end users
    - Expand regional market access and operational reach
    - Critical for Australia and likely other airport-linked markets
    - Channel economics and exclusivity are not public
  - - Data-centre and industrial backup-power operators
    - Buyer and user are infrastructure operators
    - Replace diesel in backup generators with drop-in HVO
    - Diversifies demand beyond aviation and proves compatibility in reliability-critical settings
    - Recurring site count and fuel volumes are unclear
  - - Regulator / ecosystem pilots
    - Multi-stakeholder consortia rather than single buyer
    - Pilot SAF sustainability systems and green-premium structures
    - Can accelerate market design and credibility in Asia
    - Economic conversion from pilot to recurring commercial flow is unproven
  notes: The segment map separates user from payer because SAF and HVO programs often involve airlines, corporate sponsors, channel partners, and regulators simultaneously.
