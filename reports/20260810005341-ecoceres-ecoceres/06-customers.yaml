- id: concentration-friction-and-adverse-signals
  title: Concentration, procurement friction, and adverse signals
  body: 'The main customer risks are concentration opacity, procurement friction, and sector-wide supply scarcity. Public materials do not reveal how much revenue any named customer contributes, how often pilots convert into recurring supply, or whether a small number of airline programs dominate current economics. As a result, concentration risk is real but unquantified. Procurement friction is also intrinsic to the market: SAF buyers must manage compliance rules, green-premium economics, and limited supply, while HVO buyers in mission-critical infrastructure will care about reliability, delivery certainty, and fuel quality. The strongest adverse signal is not customer dissatisfaction; it is sector immaturity. IATA still expects SAF to supply only a small fraction of aviation fuel in 2026, and even United says SAF remains only 0.1% of its total fuel use. Those facts show that demand intent is not the same thing as scaled purchasing. For EcoCeres, this means customer success depends on more
    than winning logos. The company must keep enough product available, keep traceability credible, and keep partner-led delivery channels functioning so that announced pilots and ecosystem programs become durable procurement behavior. Public evidence supports the first two directions; it is much less complete on the third.'
