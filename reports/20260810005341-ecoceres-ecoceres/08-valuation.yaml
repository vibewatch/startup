- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Two operating plants, blue-chip backers, and real customer proof create scarcity value
    - Public revenue, margin, and debt disclosure could materially strengthen conviction
  - - Traceability and certification can become a defensible moat in compliance-heavy markets
    - A verified control failure or feedstock-integrity issue would materially weaken the thesis
  - - Multi-product platform can diversify beyond a single airline buying motion
    - Evidence of low utilization, weak margins, or lumpy pilots would undermine the platform premium
  - - Policy tailwinds support long-term demand
    - If mandates tighten faster than supply or economics support, customer adoption could lag expectations
  notes: The anti-thesis is not that demand disappears; it is that the company may be asked to carry too much valuation without enough transparency.
