- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Johor ramps strongly, Dongguan progresses, feedstock controls hold, and customer proof expands with better disclosure
    - Higher premium could be justified as strategic scarcity and execution credibility improve
    - Still exposed to policy and feedstock shocks
    - Possible but needs new primary financial evidence
  - - Base
    - EcoCeres remains strategically strong but financially opaque, with steady growth and ongoing market friction
    - Valuation should anchor closer to last disclosed mark than to aspirational IPO headlines
    - Opaque margins and financing needs limit multiple expansion
    - Most consistent with current evidence
  - - Bear
    - Fraud scrutiny, project delay, weak utilization, or financing stress hits confidence before broad disclosure
    - Valuation compresses toward lower public-comp ranges or delays exit
    - Reputational and funding damage can compound quickly
    - Cannot be dismissed given sector precedents
  notes: Scenario work intentionally avoids false precision because public revenue and margin inputs remain unavailable.
