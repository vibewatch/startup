  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: EcoCeres contract pricing, delivered spread versus fossil jet, and certificate monetization detail.
    whyItMatters: Market attractiveness depends on realized netbacks rather than only top-down mandate growth.
    diligencePath: Request sample customer contracts and internal margin bridge by geography.
