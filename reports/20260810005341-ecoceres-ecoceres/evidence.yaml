evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and reserved-matters summary.
    whyItMatters: >-
      Governance rights, independent oversight, and sponsor control dynamics affect downside protection and decision
      speed.
    diligencePath: Request the latest board materials, shareholder agreement summary, and governance chart.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current public revenue, run-rate, gross margin, customer count, and total headcount.
    whyItMatters: Plant scale alone does not show monetization quality or operating efficiency.
    diligencePath: Request management KPI pack, latest budget, and year-to-date operating dashboard.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: Updated cap table, preference stack, and any debt or project-finance obligations after 2024.
    whyItMatters: Equity headline value can be misleading without dilution, senior claims, or structured financing terms.
    diligencePath: Request current cap table, subscription agreements, and project-finance summary.
    relatedQuestionRefs:
      - QO015
      - QO023
    relatedTableRefs:
      - TO003
  - type: stale
    severity: minor
    topic: ipo
    missingEvidence: A fresh company-sanctioned statement on intended listing venue, timing, and valuation expectations.
    whyItMatters: Media reporting about IPO timing and valuation can move faster than the company’s actual plans.
    diligencePath: Ask management and lead banks for the current listing plan and status by board approval stage.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: >-
      A region-by-region public breakdown of EcoCeres contracted volumes, target airline counts, and actual delivered
      tonnage.
    whyItMatters: Industry demand does not automatically translate into EcoCeres addressable or winnable share.
    diligencePath: Request management sales pipeline, contracted offtake schedule, and regional revenue split.
    relatedQuestionRefs:
