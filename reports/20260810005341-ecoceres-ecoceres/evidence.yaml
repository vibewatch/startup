      Singapore.
    diligencePath: Add further official Asia and US policy volume sources in a refresh cycle.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: policy-design
    missingEvidence: A reconciled view of whether mandates are accelerating or distorting supply under current pricing conditions.
    whyItMatters: IATA’s adverse reading and EU policy optimism can both be true but imply different underwriting assumptions.
