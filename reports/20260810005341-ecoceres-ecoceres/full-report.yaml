      - number: '1.2'
        title: Leadership, governance, and founder continuity
        blocks:
          - type: paragraph
            body: >-
              The leadership picture shows a deliberate blend of founder continuity, industrial operating experience,
              and sponsor influence. Philip Siu appears in both Bain and IFC materials as EcoCeres co-founder and former
              chief executive, and independent biography pages continue to describe him as vice chairman, which suggests
              founder influence remains significant even after later management changes. The current executive face of
              the business is Matti Lievonen, whom EcoCeres and its 2026 partnership releases identify as chief
              executive officer. That matters because Forbes ties his arrival to prior leadership at Neste, the most
              obvious global benchmark in renewable fuels. Governance also became more visibly sponsor-linked in 2025
              and 2026. EcoCeres and Towngas materials identify Alan Chan and James Tam as co-chairmen, while Bain’s
              original investment release already showed Tam as a Bain partner publicly championing the company. What
              remains less transparent is the deeper governance architecture. Public materials do not disclose committee
              structure, veto rights, or detailed independent-board representation. That gap does not negate the quality
              of the visible leadership bench, but it does mean a diligence process should treat governance detail as a
              follow-up request rather than as something already fully evidenced in the public domain.
