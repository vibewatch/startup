  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product scope
        blocks:
          - type: paragraph
            body: >-
              EcoCeres should be understood as a waste-based renewable fuels producer rather than a generic
              climate-software company or a single-product SAF startup. The company says its principal products are
              sustainable aviation fuel and hydrotreated vegetable oil, with related output that includes renewable
              naphtha and cellulosic ethanol. Official company materials consistently frame those fuels as drop-in
              substitutes for incumbent fossil fuels, produced from waste lipids, used cooking oil, and other renewable
              feedstocks rather than food crops. The operating footprint now spans Hong Kong headquarters and two
              commercial production plants: a legacy site in Zhangjiagang, Jiangsu and a newer Pasir Gudang, Johor
              facility that began producing in Malaysia in 2026 after commissioning in late 2025. The Johor addition
              materially changed the scale story. Public sources now support about 770,000 tonnes per year of aggregate
              renewable-fuel capacity across the two operating sites, while the SAF-specific production narrative is
              framed more aggressively, with management targeting a much larger SAF run rate than the company had in
              2023. The key takeaway for later chapters is that EcoCeres is already commercial and industrial, but its
              public metrics are still stronger on plant and product capacity than on company-level revenue disclosure.
