      - number: '8.4'
        title: Exit readiness, kill triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              EcoCeres is directionally closer to exit readiness than many climate manufacturers because it has tangible
              assets, named customers, and sponsor-quality backing. But exit readiness for a public market is not just
              about being real; it is about being legible. On that criterion, EcoCeres remains incomplete. Public
              investors still cannot see revenue, gross margin, utilization, customer concentration, debt, or cash
              runway. Without those, any listing would ask the market to price a complex industrial story largely
              through strategic narrative and policy tailwinds. That can work in euphoric windows, but it leaves little
              margin for error if macro conditions or SAF sentiment soften. The final diligence agenda is therefore
              explicit: get audited financials, segment revenue and margin, plant-level utilization and yield, debt and
              project-finance obligations, customer volume concentration, and direct evidence that traceability systems
              can survive regulatory scrutiny. If those items come back strong, EcoCeres may deserve a premium to weaker
              or earlier peers. If they do not, then even the last disclosed private mark may prove demanding relative
              to public comps. The investment posture should remain open-minded but disciplined, with a clear
              willingness to walk away from false precision.
            claimRefs:
              - CV034
