      - number: '7.3'
        title: Operational, partner, and financial-model risks
        blocks:
          - type: paragraph
            body: >-
              Operational risk concentrates in scale-up, logistics, and reliability-sensitive applications. EcoCeres is
              no longer just a China-origin exporter; it is now operating in Malaysia, planning a Greater Bay Area SAF
              corridor, and depending on partner infrastructure such as Viva Energy’s Pinkenba terminal for downstream
              market access. Each additional handoff—feedstock collection, pretreatment, terminal storage, blending,
              customs, or airport delivery—creates a new failure mode. The data-centre HVO use cases underline a
              separate operational issue: these customers are mission-critical operators, so product or delivery
              failures would create disproportionate reputation damage. Financial-model risk is equally material.
              Dentons and ICCT both show that large SAF projects still struggle with FID, upfront development costs,
              long-term offtake structures, and the spread between production cost and what airlines can pay. Aemetis’
              filing is a useful cautionary comparator because it shows how quickly a biofuels operator can become
              dependent on equity, tax credits, and debt when liquidity tightens. Fulcrum’s bankruptcy is the harsher
              cautionary case: sector enthusiasm and strategic backers do not prevent project-level failure. For
              EcoCeres, the result is a business that looks commercially real but still vulnerable to the classic
              industrial-renewables trap: expanding faster than balance-sheet transparency, logistics resilience, and
              offtake economics are publicly proven.
