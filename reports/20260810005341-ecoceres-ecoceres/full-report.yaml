      - number: '2.2'
        title: Sizing lenses and regional demand signals
        blocks:
          - type: paragraph
            body: >-
              The right way to size EcoCeres’ market is through multiple constrained lenses rather than one headline
              TAM. The first lens is actual industry supply: IATA estimated 1.9 million tonnes of SAF output in 2025 and
              2.4 million tonnes in 2026, which still amounts to only 0.6% and 0.8% of total jet-fuel consumption. The
              second lens is policy-driven demand. SkyNRG and ICF estimate central-case demand of 12.8 million tonnes by
              2030, while the UK is targeting at least 10% SAF by 2030 and Singapore is already imposing a levy to fund
              a 1% outbound SAF target from late 2026. The third lens is producer capacity. SkyNRG’s nameplate capacity
              outlook reaches 18.5 million tonnes by 2030, but that number assumes announced projects actually arrive on
              time and ignores ramp risk. The fourth lens is EcoCeres’ own commercial positioning. Forbes says Europe is
              its largest revenue region, which fits the fact that Europe is the most mature mandate-driven SAF market
              today. The practical implication is that EcoCeres sits in a market with credible long-run demand pull, but
              near-term economics still depend on capacity timing, pathway eligibility, and whether policy support
              becomes bankable enough to convert theoretical need into contracted fuel demand.
