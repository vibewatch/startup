      - number: '7.2'
        title: Regulatory, legal, and feedstock-integrity risks
        blocks:
          - type: paragraph
            body: >-
              The regulatory story is double-edged. On the positive side, ReFuelEU, the Swiss adoption of the EU
              framework, and Singapore’s 2026 levy all validate that SAF is moving from optional ESG talking point to
              regulated market requirement. On the negative side, they create an environment where compliance value is
              only as strong as underlying feedstock integrity and chain-of-custody enforcement. This is where the
              sharpest risk evidence sits. Transport & Environment shows that Europe already imports 80% of its used
              cooking oil and sources 60% of those imports from China, while both T&E and S&P warn of fraud risk in
              which palm-derived or otherwise ineligible material is mislabelled as waste. EBB’s call for stronger RED
              verification and TIC Council’s traceability white paper reinforce the same concern: the market is building
              faster than the verification stack. For EcoCeres, this is critical because the company explicitly
              positions traceability as part of its product advantage. That is a mitigation, but it also raises the bar:
              if EcoCeres were ever caught inside a certification dispute or mislabelled feedstock chain, the
              reputational damage would likely exceed that of a generic fuel trader. The closed-loop
              Suzhou-to-Zhangjiagang pilot is therefore strategically important because it speaks directly to the most
              dangerous regulatory and legal risk vector in the current SAF market.
            claimRefs:
