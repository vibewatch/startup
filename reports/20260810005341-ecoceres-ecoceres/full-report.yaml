      - number: '5.2'
        title: Operating model and technical workflow
        blocks:
          - type: paragraph
            body: >-
              The public technical workflow starts upstream, not at the refinery gate. EcoCeres repeatedly frames waste
              collection and traceability as integral to the product itself, which is logical because low-carbon fuel
              qualification depends not only on chemical conversion but also on proving feedstock origin and
              sustainability status. The company says it manages extensive restaurant-linked used-cooking-oil
              relationships, is working toward 100% feedstock traceability, and provides Level 2 traceability for
              customer-facing assurance. Additional company commentary points to dedicated tools for tracing raw
              material origins and to an “easy tracer” system capable of tracking small contributions. Downstream, the
              retained sources indicate a workflow that moves from feedstock collection and preprocessing into refining
              and upgrading, then into certification and delivery through existing airport, diesel, or industrial
              infrastructure. IFC adds a useful product-chemistry lens: SAF is technically demanding because of aviation
              freezing-point requirements, while Johor is designed to handle waste oils and palm oil mill effluent
              alongside other residues. What matters strategically is that EcoCeres appears to treat the digital and
              documentation layers—traceability, certification, and compliance—as part of the operating architecture
              rather than as afterthoughts. That is consistent with a sector where untrusted feedstock can invalidate
              the economic value of an otherwise usable fuel molecule.
