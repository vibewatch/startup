      - number: '3.4'
        title: Moat durability, displacement risk, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              EcoCeres’ moat is plausible but not impregnable. Its most credible defenses are waste-feedstock sourcing
              know-how, traceability systems, proprietary process integration, and customer proof that spans both
              aviation and adjacent HVO use cases. Those strengths matter because the SAF market is not yet
              commoditized: certification, feedstock quality, and execution reliability still influence who can actually
              deliver product. But the moat weakens if public policy over-incentivizes a rival pathway, if access to
              cheap lipid feedstocks tightens, or if incumbents with stronger logistics and capital access simply outbid
              smaller producers in key markets. The sharpest adverse evidence comes from failed or stressed
              alternative-fuels projects. Fulcrum’s bankruptcy shows how quickly an ambitious pathway can destroy equity
              value when technical execution, financing, and schedule discipline break down. ICCT’s finding that fewer
              than 30% of SAF projects have reached final investment decision reinforces the same lesson. Even
              successful challengers face capital-market risk: LanzaJet’s 2026 $650 million pre-money financing is a
              helpful validation point for the category, but it also shows that next-wave competitors continue to
              attract serious capital. EcoCeres therefore has a real competitive opening today, yet it still operates in
              a market where scale, financing, and feedstock control can rapidly reshape the leaderboard.
