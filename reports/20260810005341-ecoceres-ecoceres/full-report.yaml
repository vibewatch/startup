        title: Revenue model and revenue-quality read
        blocks:
          - type: paragraph
            body: >-
              EcoCeres appears to monetize through physical product sales rather than platform fees or licensing.
              Official materials describe SAF, hydrotreated vegetable oil, renewable naphtha, and cellulosic ethanol as
              the core outputs, while the customer surface shows airlines, fuel-channel partners, and industrial
              backup-power users rather than consumers or software subscribers. That matters for revenue quality because
              the commercial model should be assessed like an industrial supply business: contract duration, feedstock
              pass-through, certification compliance, logistics reliability, and counterparty mix matter more than
              monthly recurring revenue metrics. Public customer evidence points to several monetization paths. British
              Airways extended a SAF supply agreement through 2030, Cathay Pacific and HSBC publicized a Hong Kong SAF
              initiative, and EcoCeres also highlighted HVO pilots with Bridge Data Centres and Chindata. Those
              disclosures support the existence of repeatable product revenue streams and some revenue diversification
              beyond one airline or one end-market. What the public record does not show is equally important. There are
              no disclosed realized prices, shipment volumes by customer, gross margin bridges, or revenue-recognition
              policies. As a result, the analyst can conclude that EcoCeres has real enterprise demand and multi-product
              commercial routes, but not whether those routes are currently high-margin, stable, or heavily dependent on
              policy premiums.
