      - number: '8.3'
        title: Scenario work and recommendation
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes EcoCeres converts today’s proof into more than just prestige: Johor ramps well,
              Dongguan progresses, feedstock traceability becomes a market advantage rather than a cost burden, and
              policy-driven SAF demand keeps rewarding suppliers that can actually deliver compliant fuel. In that
              world, a higher future valuation could be rational, especially if EcoCeres begins disclosing revenue or
              EBITDA quality and proves multi-region offtake growth. The base case is more conservative. EcoCeres keeps
              growing and remains strategically relevant, but the market continues to face supply bottlenecks, feedstock
              volatility, and financing friction, while EcoCeres itself stays too opaque for investors to pay peak
              multiples with confidence. The bear case is not demand collapse; it is that some mix of
              feedstock-integrity scrutiny, project delay, margin compression, or insufficient disclosure causes the
              next financing or IPO process to price closer to traditional energy or stressed-biofuel comparables than
              to a scarcity-premium climate narrative. Given those branches, the correct recommendation is research-more
              rather than buy. The company is too interesting to dismiss and too under-disclosed to underwrite
              aggressively at rumored IPO-level valuations.
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV029
