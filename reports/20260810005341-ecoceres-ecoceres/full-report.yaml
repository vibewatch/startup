      - Action implication
    rows:
      - - Feedstock or certification integrity failure
        - Any verified mislabelling or certification suspension affecting EcoCeres supply
        - Breaks compliance moat and customer trust narrative
        - Walk away or materially revise valuation down
      - - Expansion slippage
        - Material unexplained delay or downsizing at Dongguan or weak Johor utilization evidence
        - Weakens growth and scale-up case
        - Move to bear case and require larger discount
      - - Financial opacity persists
        - No credible revenue, margin, cash, and debt disclosure during financing or IPO process
        - Makes premium valuation impossible to defend
        - Refuse IPO-style mark and remain on watchlist
      - - Flagship-customer erosion
        - Loss or material weakening of BA, Cathay ecosystem, or key channel relationship
        - Damages commercial proof and concentration profile
        - Re-rate customer quality downward
      - - Market economics worsen
        - Sustained SAF premium stress or offtake-market weakness without subsidies/pass-through
        - Compresses margin path and demand conversion
        - Lower scenario probabilities and valuation ceiling
    notes: Kill triggers are intended to be monitorable and directly linked to thesis transmission, not broad macro fear.
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV032
      - CV039
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue and margin
        - Audited revenue by product/geography and gross margin by stream
        - Determines whether strategic story converts into economic quality
        - Request audited financial package from company or bankers
      - - Utilization and yield
        - Plant-level throughput, downtime, utilization, and yield at China and Johor sites
        - Converts nameplate capacity into real cash-generation potential
        - Request operating KPI dashboard and engineering diligence
      - - Debt and runway
        - Debt schedule, project finance, covenants, and liquidity forecast
        - Essential for downside valuation and dilution analysis
        - Request lender package and management liquidity plan
      - - Customer concentration
        - Top-customer volumes, terms, and pilot-to-production conversion rates
        - Needed to validate durability and exposure to a few logos
        - Request commercial pipeline and top-account review
      - - Traceability controls
        - Audit evidence for feedstock verification and certification exception handling
        - Core to moat and regulatory-risk underwriting
        - Request compliance audit file and supplier-verification workflow
    notes: >-
      These are minimum diligence asks required before moving from track/research-more to any higher-conviction
      recommendation.
    claimRefs:
      - CV032
      - CV034
      - CV038
      - CV039
      - CV040
