  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments, buyers, and payers
        blocks:
          - type: paragraph
            body: >-
              EcoCeres serves several distinct customer archetypes rather than one homogeneous buyer. The clearest
              segment is airlines and airline-linked fuel procurement, where the company’s SAF proposition is framed
              around regulatory compliance, lifecycle emissions reduction, and brand value for increasingly
              climate-conscious travelers. A second segment is corporate-travel or Scope 3 buyers that do not directly
              burn the fuel but want decarbonized travel claims through airline or SAF certificate programs. A third
              segment is fuel-channel partners and distributors such as Viva Energy, whose role is to store, blend, and
              route product into aviation markets. A fourth segment is industrial or infrastructure operators such as
              Bridge Data Centres, GDS, and Chindata, which use HVO as a drop-in replacement for diesel in backup-power
              systems. The payer can therefore differ from the user. Airlines may buy fuel for their own operations,
              corporations may fund a green premium to address travel emissions, and infrastructure operators may buy
              HVO for resilience-critical sites. This multi-buyer structure is strategically useful because it broadens
              the demand surface, but it also means EcoCeres must manage several types of procurement logic at once:
              aviation certification and airport infrastructure, corporate credibility and traceability, and industrial
              reliability for mission-critical power applications.
            claimRefs:
