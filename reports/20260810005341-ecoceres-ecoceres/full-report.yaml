      - number: '4.2'
        title: Cost structure and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The unit-economics story is dominated by feedstock, process yield, logistics, and capital intensity.
              EcoCeres’ own thought leadership argues that feedstock supply will determine winners and losers in
              biofuels, which is a useful admission because it frames economics around physical supply-chain control
              rather than purely around policy. Forbes adds a favorable but still externally reported efficiency claim:
              the Malaysia plant was said to target 85% yield against a 40% to 55% industry norm. If accurate at steady
              state, that would materially help gross margin and improve resilience to high feedstock costs. Even then,
              renewable-fuel economics remain vulnerable to factors outside the company’s control. IATA still sees SAF
              supply covering only a tiny share of global jet-fuel demand, and ICCT emphasizes how few projects make it
              through final investment decision. Public comparators reinforce the volatility. Aemetis’ 2026 quarterly
              filing shows how quickly a biofuels operator can become dependent on equity, tax credits, new debt, and
              working-capital management when commodity spreads move the wrong way. World Energy’s public logistics
              emphasis also highlights a frequently overlooked cost item: even when the fuel molecule is ready, storage,
              blending, and delivery are part of the economic equation. The bottom line is that EcoCeres may possess
              good process economics, but external analysts still lack the disclosed throughput, spread, and
              working-capital data required to prove attractive unit economics.
