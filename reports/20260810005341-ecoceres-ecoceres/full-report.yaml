  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and direct peer set
        blocks:
          - type: paragraph
            body: >-
              EcoCeres does not face one monolithic competitor class. The most direct competitive pressure today comes
              from incumbent renewable-fuels suppliers already selling SAF at scale, especially Neste and World Energy.
              These companies are closest to EcoCeres on pathway maturity, because all rely on currently bankable
              drop-in fuel production tied to waste oils, fats, or similar sustainable feedstocks and existing airport
              or distribution infrastructure. A second class consists of technology-forward challengers such as LanzaJet
              and Gevo, whose alcohol-to-jet positioning targets the same airline decarbonization budget but through a
              different feedstock and process stack. A third class includes ecosystem builders such as SkyNRG, which
              combines market development, offtake structuring, and now plant development. Finally, public biofuel
              companies such as Aemetis and Darling matter less as product twins than as valuation and supply-chain
              reference points. The practical implication is that EcoCeres is competing on several axes at once: present
              SAF availability, feedstock access, route-to-market, certification credibility, and the ability to keep
              scaling when newer pathways and older incumbents both push into the same policy-created demand pool.
            claimRefs:
