      - number: '3.2'
        title: Capability, pathway, and scale comparison
        blocks:
          - type: paragraph
            body: >-
              The capability gap across competitors is wider than generic “SAF company” labels suggest. EcoCeres’ public
              materials and Forbes coverage position it around waste-based HEFA execution, high yields, feedstock
              traceability, and a current two-plant operating footprint. Neste remains the most obvious global
              benchmark: it describes globally available SAF made from renewable waste and residue raw materials and
              still dwarfs most challengers in public market scale. World Energy offers another incumbent template, with
              commercial production in California and emphasis on distribution, trucking, and a planned Houston hub.
              LanzaJet and Gevo attack the same airline decarbonization budget through ATJ rather than HEFA, which
              reduces direct competition for identical lipid feedstocks but introduces different commercialization and
              financing risks. SkyNRG occupies a hybrid role because it has long been a market-development specialist
              and is now adding owned production with DSL-01 while publicly arguing that feedstock and pathway
              diversification are essential. For EcoCeres, the most favorable read is that it already has more disclosed
              commercial proof than some newer ATJ challengers, while still sitting closer to the efficiency frontier
              than many older public biofuel names. The less favorable read is that the deepest-pocketed or most
              globally entrenched rivals have stronger brand, logistics, or capital-market visibility.
