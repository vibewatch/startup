  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              The most material EcoCeres risks are not abstract climate-startup risks; they are specific to
              renewable-fuels scale-up. The top tier combines feedstock-integrity risk, project-execution risk, and
              financing/model risk. Feedstock integrity matters because SAF value in Europe and other regulated markets
              depends on traceability, sustainability claims, and accepted chain-of-custody. If those fail, the molecule
              can lose compliance value even if it still burns. Project-execution risk matters because EcoCeres is
              expanding from a working two-plant platform into a larger regional network that includes Johor ramp-up,
              Australia-linked downstream distribution, and the proposed Dongguan buildout. Financing/model risk matters
              because the sector still struggles to reach FID, secure long-term offtakes at economic prices, and
              withstand working-capital volatility. Lower-tier but still material risks include customer concentration
              opacity, partner/channel dependence, regulatory-change risk, and people/execution risk around senior
              technical-commercial leadership. The key analytical point is that EcoCeres has enough operating proof to
              justify attention to mitigations, yet still too little public internal data to claim those mitigations are
              already fully de-risking the business. This is therefore a company where risk ranking should drive
              diligence sequencing directly.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR015
              - CR026
              - CR036
              - CR038
          - type: figure
