      - number: '2.4'
        title: Growth drivers, constraints, and EcoCeres fit
        blocks:
          - type: paragraph
            body: >-
              The growth drivers are strong but conditional. ReFuelEU and the UK mandate create legal demand,
              Singapore’s levy creates an Asian template for socializing the premium, and IATA, ICAO, and major carriers
              all treat SAF as central to aviation decarbonization. Yet the constraints remain brutally tangible. IATA
              says SAF prices exceed fossil jet fuel by roughly 2x and up to 5x in mandated markets, while ICCT
              calculates an even wider range across pathways and notes that fewer than 30% of SAF projects have reached
              final investment decision. SkyNRG flags intensifying pressure on HEFA feedstocks and the urgency of
              advanced pathways, and EcoCeres’ own executive commentary says feedstock can account for more than 60% of
              total cost. This is why producer selection matters so much. EcoCeres’ market fit is strongest where policy
              support, waste-based feedstock access, and established logistics combine—especially Europe today, Asia
              next, and corporate or airport ecosystems that value traceability and certification. The company’s own
              thought-leadership pieces argue for phased mandates, premium-sharing, and infrastructure support rather
              than blunt immediate quotas, which is economically coherent: in a market where supply is still scarce and
              project bankability fragile, policy sequencing is itself a competitive variable.
