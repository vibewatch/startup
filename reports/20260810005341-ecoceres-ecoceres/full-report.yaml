      - number: '3.3'
        title: Distribution power, switching, and customer access
        blocks:
          - type: paragraph
            body: >-
              Switching risk in SAF is lower at the molecule level than at the contracting and logistics level. Because
              SAF is a drop-in fuel, airline customers are not locked into one producer through software integration or
              physical retrofit in the way an enterprise-software buyer might be. Instead, competitive advantage comes
              from certified supply, dependable delivery, feedstock integrity, and access to airport or distributor
              infrastructure. This is why World Energy’s logistics focus, Delta’s Shell-backed multi-airport model, and
              American’s certificate-backed demand structure are strategically important. The winner is often the
              producer or intermediary that can move fuel through the right storage, blending, and booking channels at
              the right time, not merely the company with a good pathway slide. EcoCeres has real advantages here.
              British Airways extended supply through 2030, Cathay and HSBC launched a flagship Hong Kong SAF
              initiative, and Viva Energy gives EcoCeres a distribution route into Australia. Those are meaningful signs
              that EcoCeres is already in commercial circulation rather than competing only in future tense. But the
              company still lacks the publicly visible airport network, balance-sheet depth, and established
              multi-region logistics footprint of the very largest incumbents, which keeps distribution partnerships and
              local policy alignment central to its competitive position.
            claimRefs:
              - CP026
              - CP027
              - CP028
              - CP030
              - CP033
