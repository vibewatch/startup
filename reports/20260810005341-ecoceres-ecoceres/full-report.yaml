companyProfile:
  summary: >-
    EcoCeres is a Hong Kong-headquartered renewable-fuels platform that grew out of Towngas, raised major private
    backing from Kerogen and Bain, and now operates renewable-fuel plants in Jiangsu and Johor while pursuing further
    SAF expansion in the Greater Bay Area. The company’s product stack spans sustainable aviation fuel, HVO, renewable
    naphtha, and cellulosic ethanol, with visible customer proof across British Airways, Cathay Pacific/HSBC, Viva
    Energy, and data-centre HVO deployments, but public disclosure on revenue, margins, and balance-sheet strength
    remains sparse.
