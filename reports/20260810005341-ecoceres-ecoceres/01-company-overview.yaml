- id: milestones-expansion-and-caution-flags
  title: Milestones, expansion path, and caution flags
  body: 'The chronology now shows a business moving from incubation to international scale-up, but it also surfaces the main caution flags. The public record runs from Towngas incubation in 2008, spinout and Series A in 2021, Bain’s large 2023 investment, and inaugural cellulosic ethanol exports in 2023 through to the Hong Kong SAF ecosystem pilot in 2024, Johor commissioning in 2025, the Johor launch in January 2026, the Dongguan supply-chain letter of intent in May 2026, and new customer agreements in Britain and Australia by mid-2026. The Dongguan plan is especially consequential because it would add another roughly 450,000 tonnes per year of SAF and HVO capacity and create an integrated Greater Bay Area chain from feedstock collection through refining and Hong Kong refueling or trading. The public equity story is also migrating toward capital-markets optionality: China Daily and The Standard both reported active Hong Kong IPO exploration, while earlier Bloomberg-based reporting carried
    by Forbes pointed to a more ambitious valuation aspiration. The caution is that the sector remains supply constrained and expensive. IATA still expects 2026 SAF supply to cover less than 1% of aviation fuel use, and ICCT says SAF generally costs 2x to 5x fossil jet fuel. EcoCeres therefore looks industrially credible, but still exposed to policy timing, feedstock supply, and market-price normalization risk.'
