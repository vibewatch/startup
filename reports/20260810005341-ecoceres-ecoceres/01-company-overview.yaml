- id: capital-ownership-and-commercial-proof
  title: Capital formation, ownership, and commercial proof
  body: 'EcoCeres’ public capital story is unusually clear for a private Asian climate company, even though the current cap table is not. The investor page says Towngas incubated the business in 2008, supported more than 15 years of development, and then raised over US$100 million from Kerogen in 2021 before receiving over US$700 million from Bain in 2022. Towngas later quantified those rounds at about US$108 million and US$700 million respectively, which supports a public-only estimate of roughly US$808 million of disclosed equity capital since independence. Forbes adds the most important ownership datapoint: Towngas sold a 21% stake to Bain in a transaction that valued EcoCeres at nearly US$1.5 billion, and it reportedly still held 44% in mid-2024. The capital has been converted into visible operating milestones rather than just narrative. Malaysia’s first SAF plant is running, British Airways extended supply through 2030, and Hong Kong’s Cathay-HSBC pilot shows EcoCeres can deliver certified
    waste-based fuel into real airline use. For diligence, that combination is meaningful: this is not pre-commercial science capital, but neither is it fully transparent infrastructure equity because pricing, revenue, and exact current ownership dilution are still private.'
