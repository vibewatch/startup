  topStrengths:
    - Real operating footprint with two current plants and roughly 770ktpa of renewable-fuel capacity
    - Blue-chip backing from Towngas, Kerogen, and Bain plus multi-product SAF/HVO platform
    - Named customer proof across British Airways, Cathay/HSBC, Viva Energy, and data-centre HVO pilots
    - Strong strategic positioning in a mandate-driven SAF market with traceability and certification depth
  topRisks:
    - No retained public revenue, gross margin, debt, or cash-runway disclosure
    - Feedstock integrity and UCO fraud scrutiny could damage compliance value and customer trust
    - Expansion into Johor ramp-up, Dongguan, and partner-led logistics raises execution complexity
    - Rumored IPO valuation ambition appears ahead of public financial proof
    - Customer durability and concentration remain only partially visible from public sources
  unresolvedGaps:
    - Audited revenue, gross margin, EBITDA or operating income, cash, and debt disclosures
    - Plant-level utilization, yield, uptime, and maintenance history for Jiangsu and Johor
    - Top-customer revenue and contracted-volume concentration plus pilot-to-production conversion rates
    - Current fully diluted cap table, preference overhang, and project-finance obligations
    - Direct audit evidence for feedstock verification and certification exception handling
