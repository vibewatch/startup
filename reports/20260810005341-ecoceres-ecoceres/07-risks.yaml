- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, monitoring indicators, and kill criteria
  body: EcoCeres has several real mitigants. It emphasizes Level 2 traceability, a 100% traceability objective, multiple ISCC certifications, and at least one fully traceable feedstock pilot. It also has sponsor-quality backing, product proof across aviation and HVO use cases, and some evidence of long-duration relationships such as British Airways. These factors justify continued diligence rather than dismissal. But the thesis should still come with explicit kill criteria. First, any verified feedstock-fraud event, certification suspension, or material regulatory finding should be treated as a thesis-breaker because it would hit market access, customer trust, and valuation simultaneously. Second, visible delay or downsizing in Dongguan, or evidence that Johor utilization is materially below plan, would sharply weaken the scale narrative. Third, if future financing or IPO preparation does not bring revenue, margin, cash, and debt transparency, the capital-intensity risk should force a valuation
    haircut or a pass. Fourth, loss of a flagship customer or channel partner would matter because public customer visibility is still concentrated in a relatively small named set. A disciplined investor should therefore monitor fraud investigations, SAF premium levels, project-milestone timing, public evidence of traceability execution, and the evolution of offtake structures in Europe and Asia rather than relying on generic climate-sector optimism.
