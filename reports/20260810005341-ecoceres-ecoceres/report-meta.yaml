companyProfile:
  summary: >-
    EcoCeres is a Hong Kong-headquartered renewable-fuels platform that grew out of Towngas,
    raised major private backing from Kerogen and Bain, and now operates renewable-fuel plants in
    Jiangsu and Johor while pursuing further SAF expansion in the Greater Bay Area. The company’s
    product stack spans sustainable aviation fuel, HVO, renewable naphtha, and cellulosic ethanol,
    with visible customer proof across British Airways, Cathay Pacific/HSBC, Viva Energy, and
    data-centre HVO deployments, but public disclosure on revenue, margins, and balance-sheet
    strength remains sparse.
  foundedDate: "2021-01-01"
  founders:
    - name: Philip Siu
      role: Co-founder & CEO
      background: >-
        Towngas-backed founder-operator who helped incubate EcoCeres from its earlier R&D roots;
        Bain and IFC both identified him as co-founder and chief executive, while later profiles
        describe him as vice chairman as the company scaled.
      claimRefs: [CO017, CO018, CO022]
  foundingLocation: "Hong Kong"
  headquarters: "Hong Kong"
  productSummary: >-
    Waste-based SAF, HVO, renewable naphtha, and cellulosic ethanol produced through an integrated
    biorefining and traceability platform.
  customerFocus: >-
    Airlines, corporate-travel ecosystems, fuel distributors, and industrial backup-power users,
    with strongest public proof in Europe, Hong Kong, Australia-linked aviation channels, and
    data-centre HVO pilots in Asia.
  businessModel: >-
    Produces and sells SAF and HVO plus related renewable-fuel products to airlines, distributors,
    and industrial customers; monetization is tied to physical fuel supply, certifications,
    traceability, and partner-led delivery channels.
  stage: "Series B / Pre-IPO"
  fundingStatus: >-
    More than US$100M from Kerogen and more than US$700M from Bain are publicly disclosed, with a
    Bain-linked valuation anchor of roughly US$1.5B and later Hong Kong IPO exploration reported.
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO014, CO015, CO016, CO017, CO018, CO025, CO027, CI010, CV002, CV004]

