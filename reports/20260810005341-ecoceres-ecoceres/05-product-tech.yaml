- id: trust-compliance-and-technical-gaps
  title: Trust, compliance, and technical gaps
  body: 'The trust layer for EcoCeres is certification-heavy rather than software-security-heavy, which fits the product category. The most important publicly supported controls are technical standards and sustainability schemes: ASTM D7566 for SAF, EN 15940 for HVO, and ISCC CORSIA / ISCC EU / ISCC PLUS for sustainability and chain-of-custody. ESG News adds that the RSB ICAO CORSIA certification extends scrutiny beyond simple emissions accounting into biodiversity, labour safeguards, and feedstock traceability, while ICAO and IATA frame SAF as a critical lifecycle-decarbonization tool for aviation. These controls matter because they mediate customer trust: airlines and corporate buyers are paying not just for energy content but for a verified compliance story. The remaining gaps are operationally important. No retained source provides a detailed public process diagram, catalyst strategy, uptime record, unplanned outage history, or a patent-by-patent moat review. Public materials also stop
    short of disclosing how traceability data is technically implemented or audited in daily operations. That means EcoCeres’ trust posture looks directionally strong on certification and documentation, but partially opaque on deeper plant reliability and process defensibility. A buyer or investor should view the company as commercially credible and compliance-aware, while still demanding engineering diligence before assuming durable technical superiority.'
