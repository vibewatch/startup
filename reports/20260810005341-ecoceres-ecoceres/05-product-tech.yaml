chapter:
  number: 5
  title: Product & Technology
  summary: EcoCeres is best understood as a waste-biomass conversion platform rather than a single-SKU SAF startup. The retained evidence supports a commercial product stack spanning SAF, HVO, renewable naphtha, and cellulosic ethanol, with differentiation grounded in proprietary process integration, waste-feedstock access, and traceability/certification infrastructure; however, the public record still omits detailed process schematics, patent depth, and reliability data at the plant level.
sections:
- id: product-definition-and-asset-map
  title: Product definition and asset map
  body: 'EcoCeres sells decarbonization products, but its product architecture is broader than “SAF producer” shorthand suggests. Company and independent sources describe a platform that converts waste-based biomass into several outputs: sustainable aviation fuel, hydrotreated vegetable oil, renewable naphtha, and cellulosic ethanol. In customer workflow terms, each product addresses a different hard-to-abate energy use case. SAF is aimed at airlines and corporate aviation decarbonization programs that need a drop-in fuel compatible with existing aircraft and airport systems. HVO serves road transport, heavy-duty diesel, and increasingly data-centre backup power, where equipment replacement is unattractive and reliability matters. Renewable naphtha and cellulosic ethanol matter as co-products or adjacent product lines because they help widen the usable output basket from the same feedstock and process platform. The asset map is similarly multi-layered. EcoCeres now operates a legacy China
    refinery, a large newer Johor facility, and supporting feedstock-collection or traceability systems, while also pursuing a Dongguan expansion concept. This means the core “product” is not only a molecule; it is a combination of feedstock sourcing, conversion, certification, logistics, and customer qualification that turns waste streams into compliant fuels deliverable through existing infrastructure.'
