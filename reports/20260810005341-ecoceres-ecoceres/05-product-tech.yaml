- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Waste feedstock collection
    - Sources UCO and other residues
    - Restaurant relationships, aggregators, logistics
    - Shortage, fraud, contamination, seasonality
  - - Traceability systems
    - Document origin and sustainability credentials
    - Digital tools, audits, customer reporting
    - Weak implementation could undermine premium pricing or compliance
  - - Pretreatment / purification
    - Prepares variable waste inputs for upgrading
    - Process discipline and input quality control
    - Inconsistent feedstock quality can hurt yields
  - - Hydroprocessing / upgrading
    - Converts feedstock into SAF, HVO, and co-products
    - Proprietary know-how, catalysts, plant uptime
    - Public process details are sparse
  - - Certification / standards layer
    - Qualifies product for aviation and diesel use cases
    - ISCC, RSB ICAO CORSIA, ASTM, EN standards
    - Non-compliance can block customer use or policy credit capture
  - - Distribution / blending / terminal interface
    - Moves fuel into customer infrastructure
    - Partner terminals, airport systems, transport
    - Channel bottlenecks can negate technical readiness
  notes: This architecture is operational rather than laboratory-level because the public record is much stronger on workflow layers than on catalyst or reactor specifics.
