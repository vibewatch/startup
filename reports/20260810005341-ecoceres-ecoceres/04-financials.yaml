- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on analysis
  - Why public proxies are insufficient
  - Exact diligence path
  rows:
  - - Revenue by product and geography
    - Blocks revenue-quality and concentration analysis
    - Customer announcements do not reveal booked revenue
    - Request audited revenue by product, region, and top customer
  - - Gross margin by product
    - Blocks valuation and unit-economics assessment
    - Yield claims do not show realized spread after logistics and certification
    - Request gross margin bridge for SAF, HVO, and co-products
  - - Plant utilization and downtime
    - Blocks conversion of nameplate capacity into cash-generation expectations
    - Nameplate capacity is not realized throughput
    - Request monthly throughput, yield, utilization, and maintenance history
  - - Net debt, project debt, and covenants
    - Blocks runway and downside analysis
    - Equity raised does not reveal leverage or covenant risk
    - Request debt schedule and security package by facility
  - - Working-capital cadence
    - Blocks cash-conversion analysis
    - Biofuel businesses can consume cash even while volumes grow
    - Request inventory turns, receivable days, payable days, and tax-credit timing
  notes: These missing metrics are not nice-to-have; they are the minimum package required for underwriting a private industrial-fuels issuer.
