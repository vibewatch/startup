    - Request monthly inventory days, receivable days, and payable days
  - - Public cautionary comparator
    - Aemetis had $0.973M cash and used $12.4M in operating cash in H1/Q2 context disclosed in its June 2026 10-Q
    - High
    - Shows how thin liquidity can become in biofuels when spreads and financing tighten
    - Use as caution only; request EcoCeres cash, debt, and burn directly
