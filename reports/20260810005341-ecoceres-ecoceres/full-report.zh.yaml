      - number: '2.4'
        title: 增长驱动、约束与 EcoCeres 契合度
        blocks:
          - type: paragraph
            body: >-
              增长驱动很强，但有条件。ReFuelEU 和 UK 强制令创造法定需求，Singapore 的收费机制提供了在 Asia 分摊溢价的模板，IATA、ICAO 和主要航司都把 SAF
              视为航空脱碳核心。但约束仍然残酷且具体。IATA 称 SAF 价格约为化石航空燃料的 2x，在强制市场最高可达 5x；ICCT 按路径测算的范围更宽，并指出不到 30% 的 SAF
              项目已经进入最终投资决策阶段。SkyNRG 提醒 HEFA 原料压力正在加剧，先进路径变得紧迫；EcoCeres 高管自己的评论也称，原料可占总成本超过 60%。因此，生产商选择格外重要。EcoCeres
              最契合的市场，是政策支持、废弃物基原料获取和成熟物流结合的地方——今天尤其是 Europe，其次是
              Asia，以及重视可追溯性和认证的企业或机场生态。公司自己的思想领导文章主张分阶段强制、溢价分摊和基础设施支持，而不是粗暴的即时配额；这一点在经济上自洽：在供应仍稀缺、项目可融资性脆弱的市场中，政策排序本身就是竞争变量。
