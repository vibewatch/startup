        - EcoCeres 数据中心 HVO 试点显示真实邻近需求
        - 邻近场景可让收入不再只跟航空周期走
    notes: 买方和付款方分开列示，因为消耗 SAF 的一方往往不是唯一或最终为溢价买单的一方。
