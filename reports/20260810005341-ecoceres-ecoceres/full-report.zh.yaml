      - number: '1.2'
        title: 领导层、治理与创始人延续性
        blocks:
          - type: paragraph
            body: >-
              领导层画像显示出一种有意设计的组合：创始人延续性、工业运营经验和赞助方影响力并存。Philip Siu 在 Bain 与 IFC 材料中均以 EcoCeres
              联合创始人及前首席执行官身份出现，独立人物简介仍称其为副董事长，说明后续管理层调整之后，创始人影响力仍然重要。当前代表公司对外的高管是 Matti Lievonen，EcoCeres 及其 2026
              年合作公告均称其为首席执行官。这一点重要，因为 Forbes 将他的加入与其此前在 Neste 的领导经历相连；Neste 是可再生燃料领域最直接的全球标杆。2025 年和 2026
              年，治理结构也更明显地与赞助方绑定。EcoCeres 与 Towngas 材料将 Alan Chan 和 James Tam 列为联席主席，而 Bain 最初的投资公告已经显示，Tam 作为 Bain
              合伙人公开为公司站台。更深层的治理架构仍不透明。公开材料没有披露委员会结构、否决权或独立董事席位细节。上述缺口并不否定可见领导团队的质量，但尽调应把治理细节列为后续索取事项，而不能把它视为公共领域已经充分证明的事实。
