      - number: '1.4'
        title: 里程碑、扩张路径与警示信号
        blocks:
          - type: paragraph
            body: >-
              时间线显示，公司正从孵化期走向国际化扩张，同时也暴露出主要警示信号。公开记录从 2008 年 Towngas 孵化开始，经过 2021 年拆分和 Series A、2023 年 Bain 大额投资、2023
              年首次出口纤维素乙醇，再到 2024 年 Hong Kong SAF 生态试点、2025 年 Johor 调试、2026 年 1 月 Johor 投产、2026 年 5 月 Dongguan 供应链意向书，以及
              2026 年中在 Britain 和 Australia 获得新客户协议。Dongguan 计划尤其关键，因为它将再增加约 450,000 吨 / 年的 SAF 和 HVO 产能，并打通从原料收集、炼制到
              Hong Kong 加注或交易的一体化 Greater Bay Area 链条。公开股权故事也在转向资本市场可选项：China Daily 和 The Standard 均报道其正在探索 Hong Kong
              IPO；更早由 Forbes 引用的 Bloomberg 报道则指向更雄心勃勃的估值目标。警示在于，这一行业仍受供给约束且成本高昂。IATA 仍预计 2026 年 SAF 供应覆盖不到航空燃料用量的
              1%，ICCT 则称 SAF 通常是化石航空燃料成本的 2x 至 5x。因此，EcoCeres 看起来具备工业可信度，但仍暴露在政策节奏、原料供应和市场价格正常化风险之下。
