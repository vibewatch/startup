      - number: '5.2'
        title: 运营模式与技术工作流
        blocks:
          - type: paragraph
            body: >-
              公开技术工作流从上游开始，而不是从炼厂门口开始。EcoCeres
              反复把废弃物收集和可追溯性表述为产品本身的一部分；这符合逻辑，因为低碳燃料资格不仅取决于化学转化，还取决于能否证明原料来源和可持续状态。公司称其管理广泛的餐厅废弃食用油关系网络，正朝 100%
              原料可追溯努力，并为面向客户的保证提供 Level 2 可追溯性。公司其他评论还指向用于追踪原材料来源的专用工具，以及能跟踪小额贡献的 “easy tracer”
              系统。下游方面，保留来源显示，工作流从原料收集和预处理进入炼制和升级，再进入认证，并经既有机场、柴油或工业基础设施交付。IFC 提供了一个有用的产品化学视角：SAF 在技术上要求高，因为航空有冰点要求；Johor
              设计上可处理废油、棕榈油厂废水和其他残余物。战略重点在于，EcoCeres
              似乎把数字和文档层——可追溯性、认证与合规——视为运营架构的一部分，而非事后补充。这与行业特征一致：不可信原料会使本来可用的燃料分子失去经济价值。
