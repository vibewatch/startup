      - - 产能利用率和收率
        - 中国和 Johor 工厂层面的吞吐量、停机时间、产能利用率和收率
        - 把名义产能换算成真实现金生成潜力
        - 索取运营 KPI 看板，并做工程尽调
      - - 债务和现金跑道
        - 债务到期表、项目融资、契约条款和流动性预测
