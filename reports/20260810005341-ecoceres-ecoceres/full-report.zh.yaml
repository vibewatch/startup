  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与价格敏感性
        blocks:
          - type: paragraph
            body: >-
              投资论点很直接：EcoCeres
              是少数亚洲可再生燃料平台之一，既有真实运营工厂、蓝筹资本、多产品产出，也有覆盖航空公司、分销商和工业用户的可见客户证明。这个组合强过许多同阶段气候公司。反论点同样有力：公司财务仍不透明，资本开支重，暴露在政策变化中，并且在一个越来越担心欺诈、稀缺和高
              SAF 溢价的市场里依赖原料真实性。这两种观点造成了一个异常价格敏感的承销问题。以上一次广泛报道的约 US$1.5 billion 估值锚点看，EcoCeres
              可以被视为一个高质量平台，值得密切跟踪，等待未来通过尽调切入。若按之后传闻中最高 US$5 billion 的 IPO
              目标，证据门槛就高得多，因为公开数据仍没有显示收入、利润率、现金生成或足以支撑高溢价倍数的去风险扩张路径。估值问题因此不是 EcoCeres
              是否有意思——它显然有——而是买方是在为现有证明付钱，还是为一个仍藏着太多变量的未来规模故事付钱。
