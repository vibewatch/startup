      - number: '8.2'
        title: 估值语境与可比框架
        blocks:
          - type: paragraph
            body: >-
              公开可比公司只支持宽口径框架，不能给出精确标记。合适的同业集合很混杂：Gevo、Aemetis 等可再生燃料挑战者，Neste、Darling 等规模化既有玩家，以及 Valero、Phillips 66、PBF
              Energy、World Kinect
              等大型传统炼油或燃料渠道企业。这个集合并不完美，但有用，因为它框住了几项相关维度：路径野心、原料暴露、工业规模、下游分销，以及公开市场对不透明或周期性能源企业的容忍度。可比测算并不乐观。规模较小或财务承压的公开燃料公司，以较低的市值
              / 收入比交易；更具战略性或差异化的公司，也拿不到软件式倍数。EcoCeres 最近披露的约 US$1.5 billion 私募估值，已经高于几家较小的公开挑战者。传闻 US$5 billion 的 IPO
              水平会把公司推得更接近成熟工业平台，尽管它缺少公开收入和利润率披露。这不自动说明价格错误——私募战略稀缺性可能重要——但确实意味着，任何投资者在接受 IPO 式估值合理之前，证明负担应明显转向运营和财务证据。
