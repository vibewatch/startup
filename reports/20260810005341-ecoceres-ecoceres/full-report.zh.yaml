  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与直接同业
        blocks:
          - type: paragraph
            body: >-
              EcoCeres 面对的不是单一竞争者类别。今天最直接的竞争压力来自已经大规模销售 SAF 的现有可再生燃料供应商，尤其是 Neste 和 World Energy。这些公司在路径成熟度上最接近
              EcoCeres，因为它们都依赖当前可融资的可直接替代燃料生产，绑定废弃油脂、脂肪或类似可持续原料，以及既有机场或分销基础设施。第二类是技术导向挑战者，如 LanzaJet 和 Gevo；它们的
              alcohol-to-jet 定位同样争夺航空公司脱碳预算，但使用不同的原料和工艺栈。第三类包括 SkyNRG 这样的生态搭建者，结合市场开发、承购结构设计和如今的自有工厂开发。最后，Aemetis 和
              Darling 等上市生物燃料公司作为产品孪生体的重要性较低，但可作为估值和供应链参照。实际含义是，EcoCeres 同时在多个轴线上竞争：当前 SAF
              可得性、原料获取、进入市场路径、认证可信度，以及当新路径和老牌巨头都涌入同一个政策创造的需求池时继续扩张的能力。
