      - number: '7.3'
        title: 运营、伙伴与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              运营风险集中在放量、物流和对可靠性敏感的应用上。EcoCeres 已不再只是中国起家的出口商；它正在马来西亚运营，规划 Greater Bay Area SAF 走廊，并依赖 Viva Energy 的
              Pinkenba 码头等伙伴基础设施打通下游市场。每多一次交接——原料收集、预处理、码头储存、调混、海关或机场交付——就多一个失效点。数据中心 HVO
              用例凸显另一类运营问题：这些客户属于关键任务运营方，产品或交付失误会造成不成比例的声誉损害。财务模型风险同样重要。Dentons 和 ICCT 都显示，大型 SAF 项目仍难完成
              FID、承担前期开发成本、设计长期承购结构，并缩小生产成本与航空公司可承受价格之间的差距。Aemetis
              的文件是有用的警示样本，因为它说明流动性收紧时，生物燃料运营商会多快依赖股权、税收抵免和债务。Fulcrum 破产则是更严厉的反面案例：行业热度和战略背书都不能阻止项目层面的失败。落到
              EcoCeres，业务看起来已具备商业真实性，但仍暴露在工业可再生能源的经典陷阱里：扩张速度快过资产负债表透明度、物流韧性和承购经济性被公开证明的速度。
