      - number: '3.3'
        title: 分销能力、切换与客户进入
        blocks:
          - type: paragraph
            body: >-
              SAF 的切换风险在燃料分子层面较低，在合约和物流层面较高。由于 SAF
              是可直接替代燃料，航空客户不会像企业软件买方那样，因为软件集成或实体改造而锁定在某一家生产商。竞争优势来自认证供应、可靠交付、原料完整性，以及进入机场或分销商基础设施的能力。这正是 World Energy
              的物流重点、Delta 由 Shell 支持的多机场模式、以及 American
              的证书支持需求结构具备战略意义的原因。赢家往往不是拥有漂亮路径幻灯片的公司，而是能在正确时间把燃料送入正确储存、掺混和预订渠道的生产商或中介。EcoCeres 在这里有真实优势。British Airways
              将供应延长至 2030 年，Cathay 和 HSBC 启动了标志性的 Hong Kong SAF 计划，Viva Energy 则为 EcoCeres 打开进入 Australia 的分销路径。这些都说明
              EcoCeres 已经在商业流通中，而不是只在未来时态里竞争。但公司仍缺少最大现有玩家那种公开可见的机场网络、资产负债表深度和成熟的多区域物流足迹，因此分销合作伙伴和本地政策匹配仍是其竞争位置的核心。
