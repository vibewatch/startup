      - 对投资论点的传导
      - 行动含义
    rows:
      - - 原料或认证完整性失效
        - 任何经验证、影响 EcoCeres 供应的错误标识或认证暂停
        - 打破合规护城河和客户信任叙事
        - 放弃，或大幅下调估值
      - - 扩张延误
        - Dongguan 出现重大且无解释的延误或缩小规模，或 Johor 产能利用率证据偏弱
        - 削弱增长和扩产论点
        - 切到悲观情景，并要求更大折扣
      - - 财务不透明持续
        - 融资或 IPO 过程中没有可信的收入、利润率、现金和债务披露
        - 让溢价估值无法自圆其说
        - 拒绝 IPO 式估值标记，保留在观察名单
      - - 标杆客户流失
        - BA、Cathay 生态或关键渠道关系流失或显著走弱
        - 损害商业验证和集中度画像
