  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、足迹与产品范围
        blocks:
          - type: paragraph
            body: >-
              EcoCeres 应被视为一家基于废弃物的可再生燃料生产商，而不是泛泛的气候软件公司，也不是单一产品 SAF 初创企业。公司称其主要产品是可持续航空燃料和
              HVO，其他产出还包括可再生石脑油和纤维素乙醇。公司官方材料一贯将这些燃料定位为现有化石燃料的可直接替代品，原料来自废弃油脂、废弃食用油和其他可再生原料，而不是粮食作物。运营足迹如今包括 Hong Kong
              总部和两座商业化生产工厂：Jiangsu Zhangjiagang 的老厂，以及位于 Johor Pasir Gudang 的新设施，后者在 2025 年末调试后于 2026 年在 Malaysia
              开始生产。Johor 新产能实质改变了规模叙事。公开来源目前支持两座运营基地合计约 770,000 吨 / 年的可再生燃料产能；SAF 专项生产叙事则更激进，管理层目标远高于公司 2023 年的 SAF
              运行水平。后续章节的关键结论是：EcoCeres 已经进入商业化和工业化阶段，但公开指标在工厂与产品产能上强于公司层面的收入披露。
