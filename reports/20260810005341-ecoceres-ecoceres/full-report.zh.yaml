      - number: '5.4'
        title: 信任、合规与技术缺口
        blocks:
          - type: paragraph
            body: >-
              EcoCeres 的信任层重在认证，而不是软件安全，这与产品类别匹配。最重要且有公开支持的控制包括技术标准和可持续性体系：SAF 对应 ASTM D7566，HVO 对应 EN 15940，可持续性和监管链对应
              ISCC CORSIA / ISCC EU / ISCC PLUS。ESG News 补充称，RSB ICAO CORSIA 认证把审查从简单排放核算延伸到生物多样性、劳工保障和原料可追溯性；ICAO 和
              IATA 则把 SAF
              定位为航空生命周期脱碳的关键工具。这些控制重要，因为它们调节客户信任：航空公司和企业买方支付的不只是能量含量，还有经过验证的合规故事。剩余缺口在运营上很重要。没有保留来源提供详细公开工艺图、催化剂策略、正常运行时间记录、非计划停机历史，或逐项专利护城河审查。公开材料也没有披露可追溯数据在日常运营中如何技术实现和审计。这意味着
              EcoCeres 的信任姿态在认证和文档方面方向强劲，但更深层工厂可靠性和工艺防御性仍部分不透明。买方或投资者可以把公司视为商业可信、合规意识强，但在假设其技术优势可持续之前，仍应要求工程尽调。
