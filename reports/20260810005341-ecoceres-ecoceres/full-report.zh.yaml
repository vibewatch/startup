      - number: '1.3'
        title: 资本形成、所有权与商业验证
        blocks:
          - type: paragraph
            body: >-
              在亚洲私人气候公司中，EcoCeres 的公开资本故事异常清晰，虽然当前股权结构并不清晰。投资者页面称 Towngas 于 2008 年孵化该业务，支持其发展超过 15 年，随后在 2021 年从 Kerogen
              获得超过 US$100M，并在 2022 年获得 Bain 超过 US$700M。Towngas 后续将两轮金额分别量化为约 US$108M 和
              US$700M，支持一个仅基于公开信息的估算：独立以来已披露股权资本约 US$808M。Forbes 补充了最重要的所有权数据点：Towngas 在一笔交易中向 Bain 出售 21% 股权，该交易对
              EcoCeres 的估值接近 US$1.5B；据报道，Towngas 在 2024 年中仍持有 44%。这些资本已经转化为可见运营里程碑，而不只是叙事。Malaysia 首座 SAF 工厂已经运行，British
              Airways 将供应延长至 2030 年，Hong Kong 的 Cathay-HSBC 试点显示 EcoCeres
              能把认证的废弃物基燃料交付到真实航空场景。对尽调而言，这一组合很有意义：这不是商业化前的科学资本，但也不是完全透明的基础设施股权，因为定价、收入和最新所有权稀释情况仍属于私人信息。
