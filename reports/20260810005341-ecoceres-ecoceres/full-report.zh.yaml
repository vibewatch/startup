  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入口径的支出
      - 排除的支出
      - 主要买方 / 付款方
      - 与 EcoCeres 的相关性
    rows:
      - - 强制航空市场的合规 SAF
        - SAF 分子、可持续性认证、调混、储存、分销和合规价值
        - 多数航空公司运营支出、飞机资本开支、与燃料无关的机场资本开支
        - 燃料供应商、航空公司、监管机构、机场、通过 SAFc 购买的企业
        - 近端核心市场，因为 EcoCeres 向强制需求驱动的市场销售认证废弃物基 SAF
      - - 自愿或证书支持的 SAF 需求
        - 企业 SAF 证书、航空公司绿色票价计划、book-and-claim 属性
        - 通用碳抵消和无关的差旅可持续服务
        - 企业差旅买方、航空公司、登记机构
        - 重要的需求加速器，可在实物供应本地化前吸收绿色溢价
      - - 相邻 HVO 和可再生柴油用途
        - 即用型道路燃料、备份电源燃料、物流和工业脱碳
        - 电动车硬件、电网储能、无关电力资本开支
        - 车队运营商、数据中心运营商、物流买方
        - 拓宽 EcoCeres 需求的相邻市场，但不等同于航空合规 SAF 市场
      - - 先进路径和 e-SAF 开发
        - Alcohol-to-jet、power-to-liquid 及其他符合资格的下一代路径
        - 未获资格的生物燃料和无法通过可持续性筛选的化石副产品
        - 开发商、投资人、资助机构、航空公司
        - 具有战略相关性，因为原料限制让 2030 年后的路径多元化变得关键
      - - 排除的宽口径气候 TAM
        - 多数可再生电力投资、多数 EV 充电、通用航空服务
        - 所有未绑定低碳即用型燃料的宽口径清洁能源支出
        - 不直接适用
        - 排除该项是为避免用泛泛转型数字夸大机会
    notes: 边界有意收窄：它覆盖可货币化的 SAF 和相邻可再生燃料需求，而不是所有清洁交通或所有航空支出。
