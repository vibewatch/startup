  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分、买方与付款方
        blocks:
          - type: paragraph
            body: >-
              EcoCeres 服务的是多个不同客户原型，而不是一个同质买方。最清晰的细分是航空公司及航空燃料采购；公司的 SAF 主张围绕监管合规、生命周期减排，以及对气候意识更强旅客的品牌价值。第二类是企业差旅或
              Scope 3 买方，它们不直接燃烧燃料，却希望借航空公司或 SAF 证书项目获得差旅脱碳声明。第三类是燃料渠道伙伴和分销商，例如 Viva Energy，它们负责储存、掺混，并把产品导入航空市场。第四类是
              Bridge Data Centres、GDS 和 Chindata 等工业或基础设施运营商，它们把 HVO
              用作备用电力系统中柴油的可直接替代品。因此，付款方可能不同于使用者。航空公司可能为自身运营买燃料，企业可能为处理差旅排放支付绿色溢价，基础设施运营商则可能为关键韧性站点购买
              HVO。这种多买方结构在战略上有用，因为它拓宽了需求面，但也意味着 EcoCeres 必须同时管理几类采购逻辑：航空认证和机场基础设施、企业可信度和可追溯性，以及任务关键电力应用中的工业可靠性。
