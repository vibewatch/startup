  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与收入质量判断
        blocks:
          - type: paragraph
            body: >-
              EcoCeres 的变现看起来来自实体产品销售，而不是平台费或授权费。官方材料将
              SAF、HVO、可再生石脑油和纤维素乙醇描述为核心产出；客户表面则显示航空公司、燃料渠道伙伴和工业备用电力用户，而非消费者或软件订阅者。这对收入质量很重要，因为商业模式应像工业供应业务一样评估：合约期限、原料成本传导、认证合规、物流可靠性和交易对手组合，比月度经常性收入指标更重要。公开客户证据指向多条变现路径。British
              Airways 将 SAF 供应协议延长至 2030 年，Cathay Pacific 和 HSBC 宣传了 Hong Kong SAF 计划，EcoCeres 也突出展示了与 Bridge Data
              Centres 和 Chindata 的 HVO
              试点。这些披露支持存在可重复产品收入流，并显示收入不只依赖单一航空公司或单一终端市场。公开记录没有显示的内容同样重要：没有已披露实现价格、按客户划分的出货量、毛利率桥接，或收入确认政策。因此，分析师可以得出结论：EcoCeres
              具备真实企业需求和多产品商业路径，但还无法判断这些路径当前是否高毛利、稳定，或高度依赖政策溢价。
