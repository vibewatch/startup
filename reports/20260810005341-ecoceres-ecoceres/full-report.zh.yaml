      - number: '7.4'
        title: 缓释措施、监测指标与否决标准
        blocks:
          - type: paragraph
            body: >-
              EcoCeres 有几项真实缓释。公司强调 Level 2 可追溯性、100% 可追溯目标、多项 ISCC 认证，以及至少一个全程可追溯原料试点。它也有优质赞助方背书，产品在航空和 HVO 用例中得到验证，并有
              British Airways
              等长周期关系的部分证据。这些因素支持继续尽调，而不是直接否定。但投资论点仍应带有明确否决标准。第一，任何经核实的原料欺诈事件、认证暂停或重大监管发现，都应被视为论点破裂，因为它会同时打击市场准入、客户信任和估值。第二，Dongguan
              出现可见延迟或缩编，或 Johor 利用率明显低于计划，都会大幅削弱规模叙事。第三，如果未来融资或 IPO
              准备仍不带来收入、利润率、现金和债务透明度，资本密集风险应迫使估值打折，甚至放弃。第四，失去旗舰客户或渠道伙伴会很重要，因为公开可见的客户仍集中在相对少数的具名集合里。因此，纪律严明的投资者应监测欺诈调查、SAF
              溢价水平、项目里程碑时点、可追溯执行的公开证据，以及欧洲和亚洲承购结构的演变，而不是依赖泛泛的气候赛道乐观。
