        title: 耐久性、扩张与重复使用判断
        blocks:
          - type: paragraph
            body: >-
              EcoCeres 有一些有意义的耐久性迹象，但只有一段关系公开可见程度足以被视为明确续约信号。British Airways 延长至 2030
              年，是这组证据中最强的留存证据，因为它越过公告阶段热度，进入公开续签的商业关系。其他大多数具名账户仍是试点、生态项目或渠道合作。它们并不弱，只是不应被夸大为已经证明的经常性收入。Cathay 和 HSBC 证明
              EcoCeres 能支持更复杂的客户旅程，涉及证书、可追溯性和企业差旅排放核算。Delta、American、Google 和 Lufthansa
              提供了相邻市场证据，说明这一行业的客户扩张循环越来越多地包括航司-企业生态、证书结构和多年掺混供应项目。Project Spark
              同样说明，绿色溢价可能由多个利益相关方共同分摊，而不是由单一航空公司独自承担。EcoCeres
              的扩张最可能来自生态深度——更多机场、更多分销商、更多企业买方和更多工业站点——而不是典型软件式先落地再扩张动作。这一模式可行，但让合作伙伴一致性和政策连续性成为客户耐久性的核心。
