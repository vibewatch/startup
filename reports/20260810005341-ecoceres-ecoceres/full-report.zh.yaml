      - number: '3.2'
        title: 能力、路径与规模对比
        blocks:
          - type: paragraph
            body: >-
              竞争者之间的能力差距，比泛泛的“SAF 公司”标签暗示得更大。EcoCeres 公开材料和 Forbes 报道将公司定位在基于废弃物的 HEFA
              执行能力、高收率、原料可追溯性，以及当前两厂运营足迹之上。Neste 仍是最直接的全球标杆：它描述的 SAF 由可再生废弃物和残余原料制成、可全球供应，并且在公开市场规模上仍远超大多数挑战者。World
              Energy 提供了另一种现有玩家模板，在 California 商业化生产，并强调分销、卡车运输和计划中的 Houston 枢纽。LanzaJet 和 Gevo 以 ATJ 而非 HEFA
              攻击同一航空脱碳预算，这降低了对相同油脂原料的直接竞争，但引入了不同的商业化和融资风险。SkyNRG 处于混合角色：它长期是市场开发专家，如今凭借 DSL-01
              增加自有生产，并公开主张原料和路径多元化不可或缺。最有利于 EcoCeres 的解读是，它披露的商业验证已经多于一些更新的 ATJ
              挑战者，同时仍更接近效率前沿，而不是许多更老的上市生物燃料公司。不利的解读则是，资金最深或全球根基最稳的对手，在品牌、物流或资本市场可见度上更强。
