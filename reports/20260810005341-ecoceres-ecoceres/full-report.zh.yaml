  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 因素
      - 方向
      - 公开证据
      - 为何重要
      - 综合判断
    rows:
      - - ReFuelEU 和 UK 法定强制要求
        - 驱动因素
        - EU 和 UK 规则把 SAF 需求变成强制项，而非可选项
        - 认证生产商因此获得更持久的需求可见度
        - 已向欧洲销售的生产商明显受益
      - - 新加坡征费和亚洲政策试验
        - 驱动因素
        - CAAS 征费把溢价社会化，以满足 2026 年起 1% 目标
        - 不必马上全面强制，也能给亚洲需求形成提供模板
        - 正面，但仍处早期
      - - 企业和证书需求
        - 驱动因素
        - American-Google、Lufthansa 企业票价和 United 计划显示非航司付款方正在出现
        - 扩大买方基础，也能帮助吸收溢价
        - 正面且在增长
      - - 原料稀缺和 HEFA 依赖
        - 约束
        - SkyNRG 和 EcoCeres 都强调原料压力和成本敏感性
        - 即便需求强，也可能限制增长或压缩利润率
        - 重大风险
      - - 项目可融资性和 FID 瓶颈
        - 约束
        - ICCT 称，进入 FID 的 SAF 项目不到 30%
        - 许多已宣布产能可能无法按期落地
        - 重大风险
      - - 相比化石航空燃料的价格溢价
        - 约束
        - IATA 和 ICCT 均报告 SAF 成本是传统航煤的数倍
        - 高价会拖慢采用，也可能扭曲强制市场
        - 重大风险
      - - 政策排序质量
        - 双重
        - IATA 认为，没有产能配套的强制要求可能适得其反
        - 排序不当会制造稀缺租，而不是规模
        - 决定市场健康度的关键因素
    notes: 监管正把市场提前拉动，但供给、融资和原料扩张还没同步把风险降下来。
