      - number: '4.4'
        title: 财务结论与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              财务结论在收入真实性和赞助方背书上方向积极，但真正的承销质量仍不完整。EcoCeres
              显然不是一家尚无收入的概念公司：它向可识别终端市场销售可认证燃料，拥有具名交易对手，并已把资本转化为运营资产。它理应领先于许多开发阶段气候企业。但现有证据基础太薄，无法写出一份经济性清晰的投资备忘录。公开信息仍没有收入数字、毛利率披露、逐厂利用率、净债务数字、营运资本节奏，也没有从铭牌产能到实际现金生成的桥接。公开可比公司显示，即使在相邻可再生燃料类别内，结果也可能大幅分化：Aemetis
              和 Gevo 等较小上市公司只体现有限公开规模标记，而 Neste 和 Darling 等更大现有玩家拥有大得多的收入或市值基础。这一差距可作为背景，但不能替代公司特定的业绩数据。因此，合适结论不是
              EcoCeres 缺少财务质量，而是外部观察者目前只能承销商业模式和资本强度，不能承销利润引擎。任何投资流程都应把客户合同、按产品划分的利润率、工厂利用率和融资义务列为一级尽调问题，然后再对估值或 IPO
