      - number: '6.2'
        title: 具名客户验证与采用表面
        blocks:
          - type: paragraph
            body: >-
              公开客户验证记录范围较广，且相当新。British Airways 是生产级航空需求最清晰的案例，因为双方不仅签署了多年协议，后续还将其延长至 2030 年。Cathay Pacific 和 HSBC
              增加了另一种证据：不是单纯的燃料承购规模，而是 Hong Kong 一个可追溯性很强的 SAF 生态，把航空公司运营、企业差旅排放和政策雄心连在一起。工业侧，Bridge Data Centres、GDS 和
              Chindata 表明 EcoCeres 已经为 HVO 在备用电力应用中打开第二个主要场景。这一点重要，因为这些客户重视可靠性和与现有发电机兼容，不只是低碳品牌。EcoCeres 2026 年在 China 的
              Project Spark 联盟再次拓宽图景，把监管方、燃料供应商、客运航司、货运航司和化工企业放入同一个试点结构。合在一起看，采用证据显示 EcoCeres 不再只销售一个泛泛的“绿色燃料”概念。它已经落地到
              Europe、Hong Kong、Mainland China、Southeast Asia 和 Australia 的多个真实工作流。缺口不是使用证明，而是体量、复购节奏和按细分划分的客户经济性证明。
