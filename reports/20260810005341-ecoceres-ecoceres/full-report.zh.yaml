  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与资产地图
        blocks:
          - type: paragraph
            body: >-
              EcoCeres 销售脱碳产品，但产品架构比“SAF
              生产商”这个简称更宽。公司和独立来源都描述了一个把废弃物基生物质转化为多种产出的平台：可持续航空燃料、HVO、可再生石脑油和纤维素乙醇。按客户工作流看，每种产品都瞄准一种难减排能源场景。SAF
              面向航空公司和企业航空脱碳项目，后者需要与现有飞机和机场系统兼容的可直接替代燃料。HVO
              服务道路运输、重型柴油和越来越多的数据中心备用电力；这些场景不愿更换设备，且重视可靠性。可再生石脑油和纤维素乙醇作为联产品或相邻产品线也很重要，因为它们扩大了同一原料和工艺平台可用产出篮子。资产地图同样多层。EcoCeres
              现在运营一座 China 老炼厂、一座更大的 Johor 新设施，以及配套原料收集或可追溯系统，同时推进 Dongguan
              扩张设想。这意味着核心“产品”不只是一个燃料分子，而是一套组合：原料采购、转化、认证、物流和客户准入，共同把废物流变成可通过既有基础设施交付的合规燃料。
