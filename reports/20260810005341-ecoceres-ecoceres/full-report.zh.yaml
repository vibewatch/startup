      - number: '6.4'
        title: 集中度、采购摩擦与负面信号
        blocks:
          - type: paragraph
            body: >-
              主要客户风险是集中度不透明、采购摩擦和行业层面的供给稀缺。公开材料没有披露任何具名客户贡献多少收入、试点多久转化为经常性供应，或少数航空项目是否主导当前经济性。因此，集中度风险真实存在，但无法量化。采购摩擦也内嵌在市场中：SAF
              买方必须管理合规规则、绿色溢价经济性和有限供给；任务关键基础设施中的 HVO 买方则会关心可靠性、交付确定性和燃料质量。最强的负面信号不是客户不满，而是行业不成熟。IATA 仍预计 2026 年 SAF
              只供应航空燃料的一小部分；即使 United 也称 SAF 仍只占其总燃料使用的 0.1%。这些事实表明，需求意愿不等于规模化采购。EcoCeres 的客户成功不止是赢下
              logo。公司必须保持足够产品可得、保持可追溯性可信，并让合作伙伴主导的交付渠道持续运转，使已公告试点和生态项目变成持久采购行为。公开证据支持前两个方向；第三个方向则远不完整。
