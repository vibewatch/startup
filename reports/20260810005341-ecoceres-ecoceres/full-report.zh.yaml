companyProfile:
  summary: >-
    EcoCeres 是一家总部位于 Hong Kong 的可再生燃料平台，从 Towngas 体系孵化出来，先后获得 Kerogen 和 Bain 的大额私募资金支持，目前在 Jiangsu 和 Johor
    运营可再生燃料工厂，同时推进 Greater Bay Area 的 SAF 扩张。公司产品覆盖可持续航空燃料、HVO、可再生石脑油和纤维素乙醇；British Airways、Cathay Pacific / HSBC、Viva
    Energy 以及数据中心 HVO 部署都给出了可见客户验证，但收入、利润率和资产负债表强度的公开披露仍然稀少。
