      - number: '3.4'
        title: 护城河耐久性、被替代风险与负面信号
        blocks:
          - type: paragraph
            body: >-
              EcoCeres 的护城河成立但并非牢不可破。最可信的防线是废弃原料采购 know-how、可追溯系统、专有工艺整合，以及横跨航空和相邻 HVO 场景的客户验证。这些优势重要，因为 SAF
              市场尚未商品化：认证、原料质量和执行可靠性仍会影响谁能真正交付产品。但如果公共政策过度激励竞争路径、廉价油脂原料获取收紧，或拥有更强物流与资本获取能力的现有玩家在关键市场直接出更高价格，护城河就会削弱。最尖锐的负面证据来自失败或承压的替代燃料项目。Fulcrum
              破产说明，一旦技术执行、融资和进度纪律崩塌，雄心勃勃的路径能以多快速度摧毁股权价值。ICCT 发现不到 30% 的 SAF
              项目已经进入最终投资决策阶段，也强化了同一教训。即使成功挑战者也面临资本市场风险：LanzaJet 2026 年 US$650M
              投前估值融资是对品类的有益验证，但也显示下一波竞争者仍能吸引大额资本。因此，EcoCeres 今天确实拥有竞争窗口，但它所在市场中，规模、融资和原料控制都可能迅速重塑排行榜。
