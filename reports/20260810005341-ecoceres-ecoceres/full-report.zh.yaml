      - number: '2.3'
        title: 买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方图谱比“航空公司买燃料”复杂得多。航空公司仍是 SAF 的实体使用者，但付款结构越来越多地包括航空燃料供应商、机场、监管方，以及希望借 book-and-claim 或证书结构获得排放声明的企业客户。IATA
              明确认为，如果 SAF 要从本地市场变成全球市场，book-and-claim 系统不可或缺；企业需求案例已经说明原因。Lufthansa 使用 SAF 支持的企业票价，American 与 Google
              搭建了创纪录的 SAF 证书协议，United 则为企业客户和零售旅客都提供支持 SAF 部署的机制。Argus 也把客户群定义得很宽，指出航空公司、航空燃料供应商和企业客户都在转向 SAF，以满足减排和 ESG
              目标。分销又增加了一层采用门槛：Delta 的 Shell 交易和 World Energy 的物流评论表明，基础设施、掺混和交付可以与燃料分子供应同样关键。落到 EcoCeres
              身上，公司不只要造出燃料，还需要进入机场系统的路径、可信认证，以及愿意支付或补贴绿色溢价的交易对手。结果是一个多边需求形成市场；最能协调航空公司、企业、物流商和监管方的一方，才能拿到最持久的经济性。
