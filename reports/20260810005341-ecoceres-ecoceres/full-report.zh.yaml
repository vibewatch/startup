  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              EcoCeres 最重要的风险不是抽象的气候科技创业风险，而是可再生燃料放量特有的风险。第一层风险由原料真实性、项目执行、融资和模型风险构成。原料真实性重要，是因为 SAF
              在欧洲等受监管市场的价值，取决于可追溯性、可持续性主张和被认可的监管链条。链条一旦失效，即便分子仍能燃烧，合规价值也可能消失。项目执行风险重要，是因为 EcoCeres
              正从已跑通的两座工厂平台，扩成更大的区域网络，其中包括 Johor 爬坡、与澳大利亚相连的下游分销，以及拟议中的 Dongguan 扩建。融资 / 模型风险重要，是因为行业仍难以完成
              FID、以经济价格锁定长期承购，并扛住营运资本波动。较低层级但仍重要的风险包括客户集中度不透明、合作伙伴 / 渠道依赖、监管变化风险，以及高级技术商业领导层的人才和执行风险。关键分析点在于，EcoCeres
              已有足够运营证明，值得继续核验缓释措施；但公开内部数据仍太少，不能断言这些缓释已经让业务充分去风险。因此，这家公司应让风险排序直接决定尽调顺序。
