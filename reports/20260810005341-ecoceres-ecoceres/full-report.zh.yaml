      - number: '8.4'
        title: 退出准备度、否决触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              相比许多气候制造商，EcoCeres 方向上更接近退出准备，因为它有实物资产、具名客户和优质赞助方背书。但面向公开市场的退出准备不只是公司真实存在，还要让市场看得懂。按这一标准，EcoCeres
              仍不完整。公开市场投资者仍看不到收入、毛利率、利用率、客户集中度、债务或现金跑道。缺少这些，任何上市都会要求市场主要通过战略叙事和政策顺风为一个复杂工业故事定价。乐观窗口中这可能奏效，但如果宏观环境或 SAF
              情绪走弱，容错空间很小。因此，最终尽调议程很明确：拿到审计财务、分部收入和利润率、工厂层面的利用率和收率、债务和项目融资义务、客户销量集中度，以及可追溯系统能够经受监管审查的直接证据。如果这些项目反馈强，EcoCeres
              可能值得相对弱势或更早期同业享有溢价。如果不能，即便最近披露的私募估值，相对公开可比公司也可能偏高。投资姿态应保持开放但有纪律，并明确愿意放弃虚假的精确感。
