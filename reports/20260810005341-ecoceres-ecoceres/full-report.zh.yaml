      - number: '8.3'
        title: 情景推演与建议
        blocks:
          - type: paragraph
            body: >-
              牛市情景假设 EcoCeres 把今天的证明转化为不只是声望：Johor 爬坡顺利，Dongguan 推进，原料可追溯性从成本负担变成市场优势，政策驱动的 SAF
              需求继续奖励真正能交付合规燃料的供应商。在这个世界里，更高的未来估值可以合理，尤其是如果 EcoCeres 开始披露收入或 EBITDA 质量，并证明多区域承购增长。基准情景更保守。EcoCeres
              继续增长并保持战略相关性，但市场仍面对供应瓶颈、原料波动和融资摩擦；EcoCeres
              自身也过于不透明，投资者难以有信心支付峰值倍数。熊市情景不是需求崩塌，而是原料真实性审查、项目延误、利润率压缩或披露不足中的若干因素叠加，让下一轮融资或 IPO
              定价更接近传统能源或承压生物燃料可比公司，而不是带稀缺溢价的气候叙事。沿着这些分支，正确建议是继续研究，而不是买入。公司太有意思，不该忽视；但在传闻 IPO 级估值下，披露太少，不足以激进承销。
