        - 最清晰的公司特定估值锚
        - 不是当前公开市场出清价格
    notes: 这组可比标的故意混合，因为没有一家完美公开同业能覆盖 EcoCeres 的 HEFA 生产、原料策略和私募气候资产稀缺性组合。
