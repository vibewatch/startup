      - number: '4.2'
        title: 成本结构与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              单位经济性主要由原料、工艺收率、物流和资本强度主导。EcoCeres
              自己的思想领导内容认为，原料供应将决定生物燃料赢家和输家；这是一个有用承认，因为它把经济性锚定在实体供应链控制上，而不是纯粹锚定政策。Forbes 又给出一条有利但仍属外部报道的效率主张：Malaysia
              工厂据称目标收率为 85%，而行业常态为 40% 至 55%。如果在稳定状态下准确，这将显著改善毛利率，并提高公司承受高原料成本的能力。即便如此，可再生燃料经济性仍容易受公司控制之外的因素影响。IATA 仍认为
              SAF 供应只覆盖全球航空燃料需求的极小份额，ICCT 也强调，能进入最终投资决策阶段的项目很少。公开可比公司进一步说明波动性。Aemetis 2026
              年季度文件显示，当商品价差走错方向时，生物燃料运营商会多快依赖股权、税收抵免、新债和营运资本管理。World Energy
              对物流的公开强调也点出一个经常被低估的成本项：即使燃料分子已经就绪，储存、掺混和交付仍是经济方程的一部分。结论是，EcoCeres
              可能拥有良好的工艺经济性，但外部分析师仍缺少披露的产量、价差和营运资本数据，无法证明有吸引力的单位经济性。
