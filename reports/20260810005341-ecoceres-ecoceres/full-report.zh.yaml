      - number: '7.2'
        title: 监管、法律与原料真实性风险
        blocks:
          - type: paragraph
            body: >-
              监管叙事有两面。好的一面是，ReFuelEU、瑞士采纳 EU 框架，以及新加坡 2026 年征费，都说明 SAF 正从可选的 ESG
              话题，变成受监管市场的硬要求。坏的一面是，合规价值只和底层原料真实性、监管链条执行一样强。最尖锐的风险证据就在这里。Transport & Environment 显示，欧洲已进口 80% 的废弃食用油，其中
              60% 来自中国；T&E 和 S&P 也警告存在欺诈风险，棕榈来源或其他不合格材料可能被错标为废弃物。EBB 呼吁加强 RED 核验，TIC Council
              的可追溯性白皮书也指向同一个担忧：市场建设速度快过核验体系。EcoCeres 明确把可追溯性作为产品优势的一部分，因此这一点非常关键。这是一项缓释，也把门槛抬高了：如果 EcoCeres
              未来卷入认证争议或错标原料链条，声誉损害很可能超过普通燃料贸易商。因此，Suzhou-to-Zhangjiagang 闭环试点具有战略意义，因为它直接回应当前 SAF 市场最危险的监管和法律风险向量。
