      - number: '2.2'
        title: 规模测算视角与区域需求信号
        blocks:
          - type: paragraph
            body: >-
              测算 EcoCeres 市场规模，正确方式不是抓一个标题式 TAM，而是使用多组受约束视角。第一组视角是真实行业供应：IATA 估计 2025 年 SAF 产量为 1.9 百万吨，2026 年为 2.4
              百万吨，仍只相当于航空燃料总消耗的 0.6% 和 0.8%。第二组视角是政策驱动需求。SkyNRG 和 ICF 估计 2030 年基准情形需求为 12.8 百万吨；UK 的目标是到 2030 年 SAF 至少达到
              10%，Singapore 则已经征收费用，以资助 2026 年末开始的 1% 出境 SAF 目标。第三组视角是生产商产能。SkyNRG 的铭牌产能展望到 2030 年达到 18.5
              百万吨，但该数字假设已公告项目都能准时落地，并忽略爬坡风险。第四组视角是 EcoCeres 自身商业位置。Forbes 称 Europe 是其最大收入区域，这与 Europe 当前是最成熟的强制性 SAF
              市场相吻合。实际含义是：EcoCeres 所处市场具备可信的长期需求拉动，但短期经济性仍取决于产能节奏、路径资格，以及政策支持是否足够可融资，能够把理论需求转化为已签约燃料需求。
