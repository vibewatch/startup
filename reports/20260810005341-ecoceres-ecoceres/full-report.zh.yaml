      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              作为一家私人工业公司，EcoCeres 的资本时间线比经营表现披露得更充分。投资者页面称，公司 2021 年从 Kerogen 融得超过 US$100M，2022 年从 Bain 融得超过
              US$700M；Towngas 后续将两轮量化为约 US$108M 和 US$700M。这支持一个公开估算：自拆分期以来，公司已披露股权资本约 US$808M。Forbes 进一步报道，Bain 在一笔交易中收购
              21% 股权，对 EcoCeres 估值接近 US$1.5B；截至 2024 年中，Towngas 仍持有 44%。这些事实说明，公司获得了可信赞助方融资，战略控制权很可能仍在 Towngas
              手中。它们没有显示当前现金、契约余量或项目融资承诺。因此，融资问题从“EcoCeres 有没有拿到资金？”转为“下一步扩张是靠自有资金、项目融资，还是依赖
              IPO？”公开信号指向前方还需要更多资本。Malaysia 工厂才刚投产，Dongguan 将增加另一座大设施，Hong Kong IPO 报道说明公司已经在探索更大的流动性事件。LanzaJet 2026
              年融资也显示，即使技术已经验证，严肃 SAF 玩家仍需要大量资本。总体看，EcoCeres 的资金足以支撑其达到工业相关性，但披露不足以判断公司能否在不增加股权、结构化债务或两者兼有的情况下完成下一阶段扩张。
