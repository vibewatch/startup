        - 大型炼油 / 能源基准
        - 传统炼油组合占主导
      - - Phillips 66
        - 市值 / 收入
        - 约 US$81.36B / 约 US$134.48B（约 0.6x）
        - 大型既有下游企业基准
        - 不是纯可再生燃料可比公司
      - - PBF Energy
        - 市值 / 收入
