  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与监管定义
        blocks:
          - type: paragraph
            body: >-
              EcoCeres 的核心市场不是全部清洁交通，甚至不是全部生物燃料，而是低碳液体燃料中能够满足难减排交通需求的那一部分，尤其是服务航空公司合规和企业脱碳的可持续航空燃料；HVO
              则是道路运输和工业备用电力中的相邻市场。EcoCeres 官方材料强调，SAF 目前是大规模降低航空碳排放的唯一商业可行路径，其产品可依据 ASTM D7566
              作为可直接替代燃料使用，无需改造飞机或机场燃料基础设施。ICAO 给出更大的政策框架：SAF 被定义为符合可持续性标准的可再生或废弃物衍生航空燃料，并被认为最有潜力降低国际航空 CO2
              排放。因此，纳入测算的支出远窄于泛能源转型 TAM：它包括 SAF 分子、合规价值、机场物流、认证，以及企业 book-and-claim
              需求。排除项包括航空公司其他运营支出、大多数电动交通资本开支，以及航空以外的 HVO 需求。ReFuelEU
              很重要，因为它把上述市场边界变成欧洲范围内可执行的边界；统一规则和绑定比例把讨论从自愿采购推向受监管燃料供应。
