company:
  name: Ionic Digital
chapter:
  number: 1
  title: Company Overview
  summary: Ionic Digital is a newly public Washington, D.C.-based digital-infrastructure company formed in 2024 from Celsius Mining assets. Its transition is anchored by a large Nscale lease and a June 2026 financing, but customer concentration, recent executive turnover, unquantified headcount, and the difference between recognized revenue and collected rent remain central diligence constraints.
sections:
  - id: identity-stage-and-model
    title: Identity, stage, and business model
    body: >-
      Ionic Digital Inc. is a Delaware corporation with its principal executive office in Washington, D.C. The company was formed in January 2024 to acquire Celsius Mining's cryptocurrency-mining assets and initially operated as a bitcoin miner. It now describes its model as monetizing powered sites through leases to high-performance-computing and AI customers while retaining residual mining operations. The July 2026 Nasdaq debut was a direct listing of existing shareholder shares rather than a primary capital raise. That distinction matters: the listing created public-market liquidity, but the capital supporting the transition came principally from a separate June private placement and existing balance-sheet resources.
    claimRefs: [CO001, CO002, CO003, CO004, CO008]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and execution dependence
    body: >-
      The current executive roster comprises Andy Stewart, Chris Hickman, Antonio Piraino, Mark Lambourne, and Richard Carson, covering chief executive, finance, strategy, development, and legal functions. The SEC filing says Stewart became chief executive in November 2025 and brought more than 25 years of digital-infrastructure experience. Governance is formally separated between Stewart and board chair Elizabeth LaPuma; the company presents a seven-member board and characterizes six directors as independent. Those credentials do not remove transition risk. The same filing describes frequent executive turnover, a small employee base, and vacant accounting, finance, and operating roles. No conventional founder cohort is identified because Ionic was created as an asset-acquisition successor.
    claimRefs: [CO001, CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: capital-scale-and-milestones
    title: Capital, operating scale, and milestones
    body: >-
      Ionic sold preferred stock and three warrant tranches for $400.0 million gross in June 2026, before an estimated $16.8 million of transaction fees. The investor presentation framed the transaction at a $2.4 billion post-money valuation; that transaction value is not a current enterprise value, and gross proceeds are not cash available after fees and deployment. Operationally, the Nscale agreement covers 323 MW and approximately $2.6 billion of contracted revenue if the additional 89 MW is energized. Management also presents an 822 MW utility-power pipeline. Q2 revenue was $48.6 million, with 90% attributed to leasing, but $43.8 million of leasing revenue was straight-line non-cash revenue; management said August cash rent began at approximately $3.3 million.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: concentration-and-diligence-boundary
    title: Concentration and diligence boundary
    body: >-
      The SEC filing states that Ionic had one digital-infrastructure customer and that the Nscale arrangement was its only material facility lease at the filing date. This creates a sharp denominator problem: 323 MW of contracted capacity and approximately $2.6 billion of contracted revenue describe one relationship, not a diversified customer base. Public materials also do not disclose an exact company-wide headcount, a complete financing history, or a fully reconciled beneficial-ownership map. The retained evidence supports the current identity, capital transaction, leadership roster, and reported scale, but it does not independently verify rent collections after commencement, a second named AI tenant, or successful conversion of the Midland sites.
    claimRefs: [CO007, CO011, CO012, CO014, CO016]
callouts:
  - calloutType: insight
    title: Contracted scale is not yet diversified scale
    body: The Ward County contract provides a credible transition anchor, but nearly all disclosed AI-infrastructure scale is tied to one tenant and one principal facility relationship.
    claimRefs: [CO011, CO016]
  - calloutType: risk
    title: Accounting revenue leads cash rent
    body: Q2 leasing revenue was recognized on a straight-line non-cash basis, while management said cash rent only began in August 2026; diligence should track collections rather than treating recognized revenue as cash conversion.
    claimRefs: [CO013, CO014]
