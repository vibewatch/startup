    title: Company milestone timeline
    type: timeline
    summary: Ionic moved from a bankruptcy-asset successor and bitcoin miner to a public, lease-led AI-infrastructure operator in roughly two and a half years.
    data:
      items:
        - date: "2024-01"
          label: "Operating launch"
          detail: "Ionic was formed to acquire the cryptocurrency-mining assets of Celsius Mining."
          tone: neutral
        - date: "2025-07"
          label: "Leasing outreach"
          detail: "The investor presentation says leasing outreach began as the company pivoted toward HPC and AI infrastructure."
          tone: neutral
        - date: "2025-10"
          label: "Initial Nscale lease"
          detail: "Ionic executed a 126-month triple-net lease covering Ward County's initial 234 MW."
          tone: positive
        - date: "2025-11"
          label: "CEO transition"
          detail: "Andy Stewart became chief executive officer during the infrastructure pivot."
          tone: neutral
        - date: "2026-02"
          label: "Nscale expansion"
          detail: "The lease added 89 MW, taking contracted capacity to 323 MW subject to energization."
          tone: positive
        - date: "2026-06"
          label: "Private placement"
          detail: "Ionic sold preferred stock and warrants for $400.0M gross at a company-presented $2.4B post-money valuation."
          tone: neutral
        - date: "2026-07"
          label: "Nasdaq direct listing"
          detail: "Existing shareholder shares began public trading through a direct listing rather than a primary offering."
          tone: neutral
        - date: "2026-08"
          label: "Cash rent commencement"
          detail: "Management said Ward County cash rent began at approximately $3.3M for August."
          tone: positive
    approximationNotes: "Month-level dates are used where the retained evidence does not provide an exact day; values remain company-reported and do not imply independent verification."
