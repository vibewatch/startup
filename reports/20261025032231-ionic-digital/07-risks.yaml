    claimRefs: [CR001, CR003, CR006, CR011, CR014, CR015]

callouts:
  - calloutType: risk
    title: Cash conversion is the central near-term test
    body: "The Q2 call separates $43.8 million of straight-line, non-cash infrastructure revenue from cash rent that only commenced in August 2026; diligence should prioritize collections and lease receivables over GAAP revenue growth."
    claimRefs: [CR003, CR014]
  - calloutType: assumption
    title: Pipeline capacity is not yet diversified revenue
    body: "The 822 MW pipeline and prospective customer interest are operating options, not equivalent to contracted, energized, cash-producing sites."
    claimRefs: [CR011, CR012, CR013]

