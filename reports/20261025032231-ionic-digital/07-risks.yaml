      - [Midland conversion takes longer or costs more than planned, medium, high, "Four controlled sites and pre-development work described by management", "Medium-high while the sites remain Bitcoin-mining facilities", "Independent engineering budget, construction schedule, and tenant commitments are missing"]
      - [Bitcoin sales fund development at unfavorable prices, medium-high, high, "Reported cash balance and debt-free balance sheet provide a buffer", "Medium-high because treasury value and timing remain market-sensitive", "Board-approved treasury policy, minimum liquidity, and sale schedule are not public"]
      - [Reliability or security weakness emerges after energization, unknown, high, "No public mitigation package was found in the assigned evidence", "Unscored probability but material downside if service obligations are missed", "Uptime, SLA credits, incident logs, security attestations, and safety records are missing"]
    notes: "Risk ordering is an analytical ranking based on the cited operating, legal, and financial evidence; likelihood and residual exposure are judgment labels, not company guidance. Null values are not used because each row states a monitoring path."
