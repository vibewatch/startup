    notes: "Legal and regulatory status is drawn from the assigned reporting and company earnings transcript; this table does not substitute for primary docket, permit, or counsel review."
    enumerationScope:
      coverage: partial
      basis: "Public legal and regulatory dependencies identified in assigned sources, covering Delaware governance, Texas power processes, and Celsius-origin ownership."
    claimRefs: [CR006, CR007, CR008, CR009, CR011, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Anchor lease", Nscale, "Tenant for Ward County AI/HPC capacity", "234 MW initially; 323 MW after described amendment", "Tenant payment, credit, or expansion fails", critical, "Triple-net lease; NVIDIA guarantee on first five years of initial capacity", "High until independent tenant diversification and collections are demonstrated"]
      - ["Additional-power option", "Nscale and Microsoft", "Options / rights associated with additional power", "Rights touch the incremental capacity described by management", "Option is not exercised or power is not awarded / energized", high, "Management says incremental power can also be marketed broadly", "High until award, customer, and construction milestones close"]
      - ["Grid and approval pathway", "TNMP, ERCOT, PUCT", "Transmission, interconnection, verification, and audit dependencies", "West Texas sites and 822 MW pipeline", "Approval or audit delays defer conversion and revenue", high, "Existing studies and planned participation cited by management", "High because no firm date was disclosed for the relevant process"]
      - ["Legacy ownership and governance", "Celsius-origin shareholders and Ionic board", "Share distribution and corporate oversight", "Ownership originated in the Celsius reorganization plan", "Governance conflict or weak continuity impairs execution and shareholder protection", high, "Court-ordered nomination reopening was reported", "Medium-high until current board remediation and control evidence are reviewed"]
    notes: "Counterparty concentration is described from the assigned transcript and refreshed legal/market evidence; named options and guarantees require contract-level confirmation."
    claimRefs: [CR001, CR006, CR007, CR008, CR010, CR011, CR012, CR013]

