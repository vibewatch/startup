company:
  name: Ionic Digital
chapter:
  number: 7
  title: Risks
  summary: Ionic Digital has made a credible transition from Bitcoin mining to contracted data-center leasing, but the evidence points to material concentration, execution, regulatory-timing, accounting-quality, governance, and capital-allocation risks. The strongest current mitigants are a triple-net anchor lease, reported liquidity, and a debt-free balance sheet; the largest unresolved issue is whether contracted and straight-line revenue convert into cash while the Midland pipeline and power approvals are delivered.
sections:
  - id: risk-ranking
    title: Risk ranking and thesis-break conditions
    body: >-
      The risk profile is high because Ionic is simultaneously changing business model,
      public-market structure, and infrastructure footprint. The Ward County lease gives
      the company a contracted anchor, but one tenant and one Texas site still carry much
      of the current platform. The Q2 earnings call states that $43.8 million of digital
      infrastructure revenue was entirely straight-line non-cash revenue, while cash rent
      only commenced in August 2026; that distinction makes collections and ramp timing
      more important than GAAP revenue alone. The same call describes 822 MW of utility
      capacity in the pipeline, but the company says it has no date for a key Texas
      process and expects the additional 89 MW to energize in the second half of 2027.
      The investment thesis breaks if cash rent materially misses the disclosed ramp,
      the Nscale relationship or rent guarantee weakens, required approvals delay
      energization, or the company funds expansion by selling volatile Bitcoin at
      unfavorable prices.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Legal, regulatory, and governance exposure
    body: >-
      Ionic's legal and governance history is not a clean baseline for a newly public
      infrastructure company. A Delaware Court of Chancery ruling described in the
      assigned legal reporting found that the board failed to prove a valid,
      non-pretextual corporate purpose for reducing the board, and the report says the
      court ordered the nomination window reopened. The same account reports substantial
      turnover among the initial directors and senior officers, as well as shareholder
      frustration over transfer and listing delays. Those facts do not establish a
      current violation, but they raise governance and execution diligence needs around
      board independence, related-party decisions, shareholder communications, and
      continuity after the direct listing. Separately, management says the company will
      participate in PUCT and ERCOT verification and audit processes, while also saying
      that it does not have a date for the relevant process; approval timing therefore
      remains a measurable operating dependency rather than a closed risk.
    claimRefs: [CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: operating-dependencies
    title: Operational, partner, and concentration dependencies
    body: >-
      The current operating model is concentrated by counterparty, geography, and
      infrastructure milestone. The Nscale lease is described as triple net, shifting
      operating costs, taxes, insurance, and maintenance to the tenant, which can
      protect site-level margins but also makes tenant credit and lease performance
      central to the revenue base. The company says NVIDIA guarantees the first five
      years of rent on the initial capacity and that Microsoft has an option on
      additional power; these are useful contractual signals, not proof that the
      broader customer pipeline has converted into independent tenants. Four Midland
      sites totaling 112 MW are still mining Bitcoin while pre-development work for
      HPC and AI conversion proceeds. The operational kill criteria should therefore
      track tenant payment and credit, power approval milestones, energization dates,
      construction and transformer delivery, uptime, and the share of cash revenue
      generated outside Nscale.
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
  - id: financial-model
    title: Financial, accounting, and capital-allocation risk
    body: >-
      The financial picture has improved in mix but remains sensitive to accounting
      presentation and asset prices. Ionic reported Q2 2026 total revenue of $48.6
      million, with 90% from digital infrastructure leasing, yet $43.8 million of that
      segment revenue was straight-line non-cash revenue. The company reported more
      than $400 million of cash and 2,882 Bitcoin valued at approximately $169 million,
      while management said it expects to sell Bitcoin to fund near-term development
      and site acquisitions. That liquidity is not the same as recurring cash
      generation: diligence should reconcile lease receivables, cash collections,
      capex, Bitcoin sales, tax obligations, and committed development spending.
      The direct listing itself raised no new capital for Ionic, so operating cash
      conversion and disciplined use of the existing liquidity pool remain the
      measurable financial safeguards.
    claimRefs: [CR014, CR015, CR016]

