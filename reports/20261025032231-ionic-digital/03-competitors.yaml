    notes: "This is an evidence-backed qualitative matrix, not a performance benchmark. Cells describe the assigned evidence and remain qualified where no comparable public metric or pricing was available."
    claimRefs: [CP004, CP005, CP007, CP008, CP009, CP010, CP013, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Alternative, Price or contract model, Included capability, Discount or unknowns, Competitive implication]
    rows:
      - [Ionic Digital / Nscale, "126-month triple-net lease; approximately $1.9B to $1.95B described for Cedarvale/Ward County", "Powered site and AI/HPC data-center conversion", "Realized price, escalation, SLA credits, and renewal terms unknown", "Long contract can reduce churn after energization but raises tenant and site concentration"]
      - [Ionic Digital guidance, "Infrastructure leasing projected at 90% to 92% of revenue", "Revenue mix indicator, not a customer price list", "No public list price or realized yield by site", "Shows business-model concentration, not unit economics"]
      - [Microsoft campus, "Dedicated campus investment; no customer-facing price disclosed", "Data-center capacity paired with dedicated energy supply", "Customer pricing, margins, and third-party availability unknown", "A scaled incumbent can internalize infrastructure and distribution"]
      - [Internal build, "Capital project and operating-cost model set by the buyer", "Full design and operational control", "Permitting, interconnection, construction, and operating costs unknown", "Avoids landlord margin but increases execution burden"]
    notes: "Contract values and revenue mix are reported figures from assigned sources, not a comparable price-per-MW or price-per-GPU schedule. Missing realized pricing and discount data are diligence gaps."
    claimRefs: [CP009, CP010, CP011, CP012, CP015]
