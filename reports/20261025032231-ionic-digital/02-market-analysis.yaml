  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pipeline-conversion
      missingEvidence: Named tenants, signed leases, pricing and cash-rent schedules for the 112 MW Midland conversion pipeline.
      whyItMatters: Controlled megawatts are not equivalent to contracted revenue, and the distinction drives serviceable market conversion and valuation.
      diligencePath: Request executed leases, tenant credit support, interconnection milestones, construction budgets and rent commencement schedules for each Midland site.
      relatedQuestionRefs: [QM008]
    - type: missing-source
      severity: material
      topic: market-segmentation
      missingEvidence: Public buyer-budget and pricing evidence that isolates Ionic's obtainable SAM from global data-center capacity.
      whyItMatters: Global capacity and capex forecasts measure an ecosystem, not Ionic's obtainable lease revenue.
      diligencePath: Obtain tenant pipeline data, signed LOIs, comparable lease rates, power-delivery milestones and a site-by-site capacity schedule.
      relatedQuestionRefs: [QM003, QM008]
