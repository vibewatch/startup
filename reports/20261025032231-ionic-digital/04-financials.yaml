company:
  name: Ionic Digital
chapter:
  number: 4
  title: Financials
  summary: >-
    Ionic Digital's reported economics have pivoted from Bitcoin mining toward a contracted,
    triple-net data-center lease: 90% of Q2 2026 revenue came from infrastructure leasing and
    the segment reported a 99% adjusted gross margin. The principal underwriting issue is timing
    and concentration, because Q2 lease revenue was entirely non-cash straight-line recognition
    while cash rent only began in August and the public record does not disclose enough tenant,
    project-cost, or realized-pricing detail to validate durable free cash flow.
sections:
  - id: revenue-quality
    title: Lease revenue now dominates, but recognized revenue led cash
    body: >-
      Ionic Digital reported $48.6 million of Q2 2026 revenue, up from $37.2 million a year
      earlier, with 90% generated by digital-infrastructure leasing rather than Bitcoin mining.
      That mix shift is economically important, but the period's $43.8 million of infrastructure
      revenue was entirely straight-line, non-cash recognition. Management said cash rent began
      in August at approximately $3.3 million and guided to about $29 million of cash rent for
      full-year 2026, versus roughly $175 million of annualized GAAP recognition already accruing.
      Revenue, contracted revenue, and cash collections are therefore different measures here;
      none should be presented as ARR. The residual mining operation remains exposed to Bitcoin
      output and price volatility, as April production fell 27.1% month over month to 20.45 BTC.
    claimRefs: [CI001, CI003, CI004, CI005, CI012, CI015]
    tableRefs: [TI001]
  - id: monetization-and-margins
    title: Triple-net terms create high reported margins without proving realized unit economics
    body: >-
      The Nscale arrangement covers 323 MW and approximately $2.6 billion of contracted revenue,
      with the tenant responsible for operating costs, taxes, insurance, and maintenance under
      the triple-net structure. That allocation explains the reported 99% adjusted gross margin
      for infrastructure leasing, compared with 36% for mining and 93% company-wide in Q2 2026.
      It does not reveal realized price per MW, tenant concessions, renewal economics, credit
      exposure, or the return on Ionic-funded site work. Management also described future powered
      shell and turnkey structures, but the assigned public evidence does not quantify target
      yields or signed pricing for those prospective products. Those omissions prevent a
      defensible CAC, payback, or project-level return calculation.
    claimRefs: [CI002, CI011, CI013]
    tableRefs: [TI002]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Near-term liquidity appears substantial, but expansion needs are not fully bounded
    body: >-
      At quarter-end, management reported more than $400 million of cash, 2,882 BTC valued at
      approximately $169 million, and no debt. It guided to $45 million-$60 million of 2026
      capital expenditure excluding possible site acquisitions and said Bitcoin would be treated
      like cash for development and acquisition funding. This supports near-term flexibility, but
      funding raised historically is not the same as cash available today, and volatile Bitcoin
      holdings are not equivalent to cash. The July direct listing itself raised no new capital
      because existing shareholders, not the company, sold the listed shares. Project-level
      budgets, working-capital needs, lease security, and the funding plan beyond near-term Ward
      County and Midland work remain undisclosed.
    claimRefs: [CI008, CI009, CI010, CI014, CI015, CI016]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Attractive lease accounting must convert into collected cash and repeatable returns
    body: >-
      The financial profile is stronger and more predictable than a mining-only model if cash
      rent follows the disclosed ramp and triple-net obligations remain enforceable. Q2 adjusted
      EBITDA was $37.6 million, while the $35.3 million GAAP net loss was driven largely by a
      non-cash Bitcoin fair-value loss and a tax provision; the accounting loss is therefore not
      a measure of cash burn. Full-year guidance calls for $190 million-$195 million of revenue
      and $137.5 million-$142.5 million of adjusted EBITDA, but the company did not reconcile the
      annual non-GAAP forecast to GAAP because taxes could not be reasonably predicted. Underwriting
      should remain conditional on bank evidence of rent collection, tenant-credit protections,
      project-level capex and yield schedules, and a bridge from recognized revenue to operating
      cash flow.
    claimRefs: [CI006, CI007, CI013, CI016]
