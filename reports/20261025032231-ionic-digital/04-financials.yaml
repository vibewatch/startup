      - [Q2 infrastructure revenue, "$43.8M recognized in Q2 2026", "Entirely non-cash straight-line revenue in the quarter", "GAAP recognition should not be read as cash collected", "Monthly cash collections and deferred/accrued rent balances"]
      - [Mining output, "20.45 BTC in April 2026", "Monetization depends on sale timing and market price", "Production fell 27.1% month over month", "Realized BTC price, all-in power cost, and contribution margin"]
