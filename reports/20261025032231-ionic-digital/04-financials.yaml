callouts:
  - calloutType: strength
    title: Contract structure shifts operating costs to the tenant
    body: >-
      The triple-net lease supports unusually high reported infrastructure gross margin and
      reduces direct exposure to site operating costs, subject to tenant performance and the
      precise contract protections not disclosed in the assigned evidence.
    claimRefs: [CI002, CI011]
  - calloutType: risk
    title: Recognized revenue preceded cash
    body: >-
      All Q2 infrastructure revenue was straight-line and non-cash. Investment underwriting
      should use collected rent and project cash flow rather than recognized revenue or the
      headline contracted-revenue total.
    claimRefs: [CI003, CI004, CI016]
