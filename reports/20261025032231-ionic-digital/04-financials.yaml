    notes: "Public sources disclose contract totals and selected operating metrics, not realized price per MW or complete commercial terms; null pricing is intentionally not estimated."
    claimRefs: [CI003, CI010, CI011, CI012]
  - id: TI003
    title: Unit economics and capital-adequacy scorecard
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Adjusted gross margin, "93% in Q2 2026", Medium, "Shows the mix benefit from leasing", "Reconcile to GAAP gross profit and cash operating costs"]
      - [Infrastructure adjusted gross margin, "99% in Q2 2026", Medium, "Reflects triple-net cost allocation", "Validate excluded costs and corporate allocations"]
      - [Mining adjusted gross margin, "36% in Q2 2026", Medium, "Frames residual commodity exposure", "Provide all-in power and fleet-level contribution margins"]
      - [Adjusted EBITDA, "$37.6M in Q2 2026", Medium, "Shows non-GAAP operating earnings", "Provide full reconciliation and cash-flow bridge"]
      - [Normalized quarterly G&A, "Approximately $7.6M excluding $9.0M stock compensation and $2.9M listing/private-placement costs", Medium, "Establishes an overhead proxy", "Provide recurring run-rate payroll, public-company, and development overhead"]
      - [2026 capital expenditure, "$45M-$60M excluding acquisitions", Medium, "Sets a partial near-term cash-use envelope", "Break down maintenance, Ward County, Midland conversion, and committed versus discretionary spend"]
      - [Quarter-end liquidity, "More than $400M cash plus 2,882 BTC valued at approximately $169M; no debt", Medium, "Supports near-term development capacity", "Provide unrestricted cash, custody, tax basis, liquidation policy, and minimum liquidity"]
      - ["CAC, payback, project yield, and working capital", null, Low, "Required to compare growth economics and financing need", "Provide cohort acquisition costs, sales cycle, signed pricing, project IRRs, and monthly working-capital forecast"]
    notes: "Metrics are not normalized across GAAP and non-GAAP bases; the accounting net loss is not cash burn, and BTC is shown separately from cash."
    claimRefs: [CI002, CI006, CI008, CI009, CI013]
