artifact: customers
slug: ionic-digital
runDate: 2026-10-25
company:
  name: Ionic Digital
chapter:
  number: 6
  title: Customers
  summary: "Ionic Digital has one evidenced anchor tenant, Nscale, supporting a contracted Ward County lease whose economics are becoming visible in cash rent. The customer funnel beyond that anchor is still prospective: management reports inbound interest and Microsoft rights attached to incremental power, but public evidence does not yet establish a second operating tenant, retention, or a diversified revenue base."
sections:
  - id: buyer-segmentation
    title: Buyer and use-case segmentation
    body: Ionic's customer model currently separates into a contracted hyperscale or neocloud anchor at Ward County and prospective users for the remaining footprint. The 323 MW Ward County lease is with Nscale, while management describes the 112 MW Midland portfolio as aimed at neocloud customers and two large technology firms that could use grid power for lab environments or sovereign-cloud solutions. The company also describes a distinct future inference product near major metros, aimed at latency-sensitive workloads. These are meaningful buyer hypotheses, not evidence of signed contracts. The commercial value therefore sits in one documented customer relationship and a broader, unconverted pipeline.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and cash-rent trajectory
    body: Adoption is most measurable through energized capacity, lease commencement, and the shift in revenue mix rather than through disclosed account counts or utilization. Ionic reported that the first Ward County data center was energized and cash rent commenced in August 2026; Q2 digital-infrastructure revenue was recognized straight-line and non-cash, so accounting revenue should not be treated as cash collections. Management described approximately $3.3 million of August cash rent, roughly $23 million in Q4 2026, $135 million in 2027, and approximately $183 million at the end of 2028. The trajectory is contract-backed but remains dependent on delivery and collection.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named customer proof and reference quality
    body: Nscale is the only named tenant supported by a described lease, and the evidence distinguishes the initial 234 MW from the later 89 MW amendment. The lease is triple-net, with Nscale responsible for operating costs, taxes, insurance, and maintenance; this supports the quality of the contractual relationship but does not prove that all contracted capacity is already energized or cash-producing. Microsoft appears in the evidence as the counterparty holding an option on additional power secured at the site and as a large regional AI-demand signal, but the Microsoft Pecos announcement does not name Ionic. It should therefore not be counted as a direct Ionic deployment.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: durability-concentration
    title: Retention, expansion, and concentration
    body: "Public evidence does not disclose NRR, GRR, churn, renewal rates, contract length beyond the reported lease term, customer satisfaction, or a customer-level revenue concentration percentage. The available evidence instead points to concentration risk: an independent analyst explicitly states that Ionic has one tenant for its flagship facility. Expansion is partly contractual, through Nscale's 89 MW amendment and rights relating to additional power, but the incremental 466 MW is not itself a signed customer commitment and management says it would also take that power to market broadly. The customer thesis is therefore durable only if the anchor performs and the pipeline converts."
    claimRefs: [CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation table
    columns: [Segment, Buyer/user/payer, Use case, Scale or status, Revenue or strategic value, Gap]
    rows:
      - [Nscale anchor, Nscale; tenant and payer under triple-net lease, HPC/AI capacity at Ward County, 323 MW contracted; 234 MW initial phase plus 89 MW amendment, Primary documented customer and contracted-revenue base, No public retention or collection history beyond lease commencement]
      - [Hyperscaler / neocloud expansion, Hyperscalers and neoclouds; prospective buyers, Large AI/HPC campuses at Ward County, 377 MW described as remaining Ward County expansion capacity, Potential expansion and diversification, No named signed customer for the remaining capacity]
      - [Midland neocloud, Neocloud operators; prospective users, Conversion of four bitcoin-mining sites to HPC/AI, 112 MW grid power across four sites; pre-development underway, Converts controlled power into a second customer surface, No signed tenant or utilization disclosure]
      - ["Enterprise and sovereign-cloud users", "Two large technology firms and enterprise buyers; prospective users", "Lab environments and sovereign-cloud solutions", "Management reports inbound interest; no contract disclosed", "Broadens buyer mix and use cases", "No names, contract values, pilots, or production outcomes disclosed"]
    notes: Sources are current-run public reporting and the Q2 2026 earnings-call transcript; prospective segments are management descriptions rather than signed customer evidence.
    claimRefs: [CU001, CU002, CU003, CU004]
  - id: TU002
    title: Customer growth / adoption trajectory
    columns: [Metric, Value, Date or period, Source, Confidence, Implication, Missing denominator]
    rows:
      - [Ward County initial phase energized, 234 MW, 2023 / Q2 2026 reported status, CU004 source, high, Existing operating base supports the anchor lease, None disclosed for utilization]
      - [Q2 digital-infrastructure revenue, "$43.8M; 90% of $48.6M total revenue", Q2 2026, CU004 and CU003 sources, high, Lease accounting dominates reported mix, Cash-versus-GAAP collection timing is not a denominator]
      - [Cash rent commencement, Approximately $3.3M, August 2026, CU004 source, high, First disclosed cash realization from Ward County lease, No customer payment history or aging disclosed]
      - [Cash-rent outlook, "$23M Q4 2026; $135M FY2027; approximately $183M by end-2028", 2026-2028 outlook, CU004 and CU009 sources, medium, Contracted ramp creates a measurable adoption path, Forecasts are not realized collections]
    notes: Values preserve the source's units and periods; revenue recognition, cash rent, and contracted capacity are different measures and are not converted into a customer count.
    claimRefs: [CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    rows:
      - ["Nscale", "Neocloud / HPC-AI", "10-year triple-net lease at Ward County; initial 234 MW and later 89 MW amendment", "Production lease with first data center energized and rent commenced", "Contracted revenue reported at approximately $2.6B for 323 MW", "Public record does not disclose renewal, service-level, or collection history"]
      - [Nscale, Neocloud / HPC-AI, Initial Ward County phase, Production lease; cash rent began in August 2026, Approximately $3.3M August cash rent reported, Q2 digital-infrastructure revenue was straight-line non-cash and cannot be read as cash received]
      - [Microsoft, Hyperscaler / AI demand signal, Option on additional power secured at the site is described by Ionic; Microsoft separately announced a Pecos campus, Not a publicly confirmed Ionic deployment in the retained Microsoft source, Indicates end-market demand for predictable scalable capacity, Microsoft announcement does not name Ionic or confirm an Ionic contract]
    enumerationScope:
      coverage: partial
      basis: Three named or separately documented customer-proof rows drawn from public sources available through 2026-10-25; this is not a complete customer register.
    notes: The table intentionally separates Nscale's documented lease from Microsoft's broader Pecos demand signal; the Microsoft row is not counted as an Ionic deployment.
    claimRefs: [CU009, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey from contracted anchor to expansion
    type: journey-map
    summary: Ionic's visible customer path runs from one contracted Ward County tenant through cash-rent realization toward uncontracted capacity and prospective metro customers.
    data:
      items:
        - name: Controlled power
          label: Controlled power
          title: Controlled power
          description: Ionic controls energized and pipeline capacity across Ward County and Midland.
          touchpoints: [234 MW initial Ward County phase, 112 MW Midland portfolio]
        - name: Anchor lease
          label: Anchor lease
          title: Anchor lease
          description: Nscale is the named tenant under the Ward County triple-net agreement.
          touchpoints: [323 MW contracted, approximately $2.6B contracted revenue]
        - name: Energization
          label: Energization
          title: Energization
          description: The first Ward County data center was energized before the reported cash-rent ramp.
          touchpoints: [First data center energized, cash rent commenced in August 2026]
        - name: Cash realization
          label: Cash realization
          title: Cash realization
          description: Cash rent is scheduled to ramp after the initial lease commencement.
          touchpoints: [Approximately $3.3M August cash rent, approximately $183M annualized by end-2028]
        - name: Expansion rights
          label: Expansion rights
          title: Expansion rights
          description: Additional power has rights and options associated with Nscale and Microsoft, but capacity delivery remains conditional.
          touchpoints: [89 MW amendment, 466 MW expansion subject to ERCOT and utility work]
        - name: Broad market conversion
          label: Broad market conversion
          title: Broad market conversion
          description: Midland and future metro sites are being positioned for additional customer categories.
          touchpoints: [Inbound prospective-tenant interest, no second signed tenant publicly identified]
    approximationNotes: Sequence shows commercial stages, not conversion rates or guaranteed outcomes.
    claimRefs: [CU013, CU014, CU015]
callouts:
  - calloutType: strength
    title: Contracted anchor with improving cash visibility
    body: "The Nscale relationship is more than a logo: it is tied to a stated triple-net lease, an energized initial phase, and a reported cash-rent commencement. That is stronger adoption evidence than a prospect list, while still leaving collections and service performance to verify."
    claimRefs: [CU005, CU009]
  - calloutType: risk
    title: Customer concentration remains the central diligence risk
    body: The retained independent analysis describes one tenant at the flagship facility, while public evidence does not establish a second signed customer, retention metrics, or customer-level revenue diversification. The 2026-2028 cash-rent outlook should therefore be stress-tested against Nscale performance and expansion timing.
    claimRefs: [CU013, CU016]
