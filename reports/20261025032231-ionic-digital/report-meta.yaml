  topStrengths:
    - 323 MW of contracted Ward County capacity with approximately $2.6 billion of reported contracted revenue.
    - Triple-net lease structure and reported liquidity provide a credible operating and funding anchor.
    - The company has moved beyond a mining-only model into a public AI/HPC infrastructure platform.
  topRisks:
    - Current disclosed digital-infrastructure revenue is concentrated in one anchor tenant and facility relationship.
    - Straight-line lease revenue preceded cash rent, so collections and ramp execution remain unproven.
    - >-
      Power approvals, expansion delivery, governance continuity, and fully diluted capitalization remain material
      uncertainties.
  unresolvedGaps:
    - A second named AI tenant or Midland customer is still missing from the public record.
    - Public evidence on cash collections after August 2026 rent commencement is not yet available.
    - Standardized uptime, reliability, and operating-metric disclosure for the AI campus product remains limited.
    - Post-listing holder overhang, warrant behavior, and long-term governance stability still need monitoring.
