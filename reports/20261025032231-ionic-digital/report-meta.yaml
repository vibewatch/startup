companyProfile:
  summary: >-
    Ionic Digital is a Washington, D.C.-based digital-infrastructure company formed from Celsius Mining assets that is
    transitioning from Bitcoin mining toward AI and high-performance-computing data-center leasing. Its current
    operating anchor is a contracted Ward County relationship with Nscale, while Midland conversion and additional power
    capacity remain prospective.
