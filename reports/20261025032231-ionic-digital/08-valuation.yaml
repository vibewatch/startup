chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a research-more recommendation, medium confidence, high risk, and a stretched valuation stance. Ionic has substantial contracted infrastructure revenue and liquidity, but its $2.4 billion reference value and approximately $2.8 billion first-day close preceded proof that non-cash lease revenue will convert on schedule.
sections:
  - id: recommendation
    title: Recommendation and investment judgment
    body: >-
      Ionic Digital merits continued diligence rather than a price-insensitive buy. Q2 2026
      revenue reached $48.6 million, with 90% attributed to digital-infrastructure leasing,
      while management reaffirmed $190 million to $195 million of full-year revenue and
      $137.5 million to $142.5 million of adjusted EBITDA. The operating pivot is therefore
      visible, not merely aspirational. Yet the initial $2.4 billion reference value equated
      to roughly 12.5 times midpoint revenue guidance and 17.1 times midpoint adjusted EBITDA
      guidance, before adjusting for dilution or distinguishing accounting revenue from cash.
      The appropriate stance is stretched valuation, high risk, and medium confidence until
      cash collections, tenant concentration, and fully diluted capitalization are verified.
    claimRefs: [CV005, CV009, CV010, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context
    title: Financing and public-market context
    body: >-
      The June 2026 preferred financing and Nasdaq reference price both used $53 per share,
      a level reported to imply approximately $2.4 billion of market value. The first trading
      day closed at $62.90, implying approximately $2.8 billion, before an after-hours decline
      to $58.80. These are transaction and trading marks, not an independent fair-value study.
      The direct listing itself sold existing-holder shares and provided no new capital to the
      company. Separately, the preferred financing raised $400 million and included three
      warrant tranches. Entry analysis therefore needs the current share price, fully diluted
      share count, warrant economics, and holder liquidity; none can be inferred safely from
      the reference price or first-day market capitalization alone.
    claimRefs: [CV001, CV002, CV003, CV004, CV014, CV015]
  - id: operating-proof
    title: Operating proof and scenario boundaries
    body: >-
      The strongest support for the thesis is the reported 323 MW contracted footprint and
      approximately $2.6 billion of contracted revenue, reinforced by a debt-free balance
      sheet and more than $400 million of cash at quarter-end. The principal qualification is
      earnings quality: management said all $43.8 million of Q2 digital-infrastructure revenue
      was straight-line non-cash revenue, while August cash rent was approximately $3.3 million.
      Management expects cash rent to rise from approximately $29 million in 2026 to $135
      million in 2027 and a fully ramped $183 million run rate by the end of 2028. Those amounts
      are guidance rather than collections already demonstrated, so scenarios should be keyed
      to payment evidence and energization milestones rather than unsupported probability weights.
    claimRefs: [CV006, CV007, CV008, CV012, CV013]
    tableRefs: [TV003]
  - id: thesis-breaks
    title: Anti-thesis, exit readiness, and diligence asks
    body: >-
      The anti-thesis is that investors capitalize long-duration contracted revenue before
      proving cash conversion, customer diversification, expansion approvals, and dilution.
      A bear outcome does not require contract failure: delayed power delivery, slower cash-rent
      ramp, multiple compression, or warrant exercise could each impair per-share returns.
      Conversely, a bull case requires timely rent receipts, the 89 MW expansion to energize,
      and additional capacity to attract credible tenants without disproportionate capital.
      Exit readiness remains conditional because the assigned evidence lacks a current cap table,
      a current market quote as of the run date, independent tenant-payment confirmation, and a
      defensible probability-weighted valuation. These are diligence gates, not reasons to convert
      missing inputs into false precision.
    claimRefs: [CV003, CV004, CV006, CV011, CV012, CV013, CV014, CV016]
    tableRefs: [TV002]
