    title: Recommendation summary
    columns: [Dimension, Current view, Evidence basis, Decision implication]
    rows:
      - [Recommendation, "Research-more", "Revenue mix and contracted scale are tangible, but cash conversion and dilution remain incompletely verified.", "Do not underwrite a buy until current price, collections, and capitalization are reconciled."]
      - [Confidence, "Medium", "Multiple independent summaries corroborate core metrics, while important valuation inputs remain absent.", "Treat the conclusion as conditional rather than a price target."]
      - [Risk rating, "High", "Cash-rent timing, tenant concentration, expansion execution, warrants, and trading volatility can affect returns.", "Require milestone-based downside protection and explicit thesis-break triggers."]
      - [Valuation stance, "Stretched", "The $2.4B reference value represented about 12.5x midpoint revenue guidance and 17.1x midpoint adjusted EBITDA guidance.", "Demand stronger cash evidence or a lower entry valuation before upgrading."]
    notes: "Judgment as of 2026-10-25; reported market values and derived multiples are reference points, not an independent fair-value estimate."
    claimRefs: [CV005, CV009, CV010, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Lens, Evidence-supported argument, What would change the view]
    rows:
      - ["Thesis: contracted scale", "323 MW and approximately $2.6B of contracted revenue create long-duration visibility.", "Filed evidence that contract terms remain effective and cash receipts match the disclosed ramp."]
      - ["Thesis: balance-sheet capacity", "Quarter-end liquidity included more than $400M of cash, 2,882 bitcoin valued near $169M, and no borrowings.", "Evidence that development spending remains funded without materially dilutive capital."]
      - ["Anti-thesis: earnings quality", "All $43.8M of Q2 digital-infrastructure revenue was described as straight-line non-cash revenue.", "Several quarters of cash collections reconciled to recognized lease revenue."]
      - ["Anti-thesis: per-share overhang", "The $400M preferred financing included warrant tranches, while the direct listing sold existing-holder shares.", "A current fully diluted cap table, warrant schedule, float, and holder-concentration analysis."]
    notes: "Arguments use assigned public evidence; missing contract, payment, and capitalization documents are retained as explicit diligence gaps."
    claimRefs: [CV003, CV006, CV007, CV008, CV012, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Operating assumptions, Valuation / return logic, Probability signal, Key risk or trigger]
    rows:
      - [Bull, "Cash rent follows guidance, 89 MW energizes, and additional capacity attracts credible tenants.", "A value above the $2.8B debut mark becomes supportable only after durable cash and diversification evidence.", "Not quantified; requires multiple unverified milestones.", "Positive trigger: filed collections, energization, and a second material tenant."]
      - [Base, "2026 guidance is broadly achieved, but cash conversion and expansion evidence accumulate gradually.", "The observed $2.4B-$2.8B financing/listing band remains a reference range, not demonstrated fair value.", "Most consistent with current evidence, but no numeric probability is supportable.", "Hold research-more until price-to-cash metrics and dilution are available."]
      - [Bear, "Cash-rent ramp or power expansion slips, dilution rises, or public-market multiples compress.", "Downside below the $2.4B reference mark is plausible; the evidence does not establish a valuation floor.", "Material downside case; no numeric probability is supportable.", "Thesis break: missed cash-rent milestones without a documented cure path."]
    notes: "Scenario bands anchor to observed 2026 transaction and first-day marks; they are not a DCF, price target, current quote, or assigned probability."
    claimRefs: [CV001, CV002, CV004, CV006, CV012, CV013, CV014, CV015, CV016]
