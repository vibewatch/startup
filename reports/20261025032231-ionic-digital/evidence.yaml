evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Exact company-wide headcount, total customer count, and a clearly defined ARR or realized revenue run-rate are not
      disclosed in the retained evidence.
    whyItMatters: >-
      Unsupported cover metrics would create false precision and obscure the one-customer denominator behind disclosed
      infrastructure scale.
    diligencePath: >-
      Obtain the employee roster, customer register, executed lease schedule, and management's metric definitions, then
      reconcile them to subsequent SEC filings.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Complete management depth, succession coverage, retention data, and independent performance references are
      unavailable.
    whyItMatters: The SEC filing identifies recent turnover and vacant functions during a capital-intensive operating transition.
    diligencePath: >-
      Review employment agreements, organizational charts, succession materials, retention metrics, references, and
      later proxy disclosures.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: ownership
    missingEvidence: >-
      A current fully diluted cap table and complete register of financing, warrant, legacy-holder, and
      beneficial-ownership positions are unavailable.
    whyItMatters: >-
      Conversion, warrant exercise, legacy transfers, and public selling can materially change control and per-share
      economics.
    diligencePath: >-
      Reconcile the securities purchase agreement, warrant instruments, effective registration statement, Forms
      3/4/13D/13G, and transfer-agent records.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
