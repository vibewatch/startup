  evidenceGaps:
    - type: missing-source
      severity: material
      topic: controls
      missingEvidence: Public evidence of uptime, latency, PUE, cooling design, cybersecurity certifications, incident history, and tenant SLA performance for Ward County and Midland conversions.
      whyItMatters: A powered site and lease do not establish that AI/HPC workloads can be operated reliably or securely at the required density.
      diligencePath: Request commissioning reports, SLA templates, PUE and availability history, security attestations, incident logs, and customer acceptance documentation.
      relatedQuestionRefs: [QE004, QE006]
    - type: missing-source
      severity: material
      topic: pipeline
      missingEvidence: Independent confirmation of the 89 MW amendment, ERCOT approval path, transformer delivery, and the schedule and cost to convert the four Midland sites.
      whyItMatters: The majority of the reported 822 MW platform is not yet demonstrated as AI/HPC production capacity.
      diligencePath: Obtain executed lease amendments, utility correspondence, EPC and transformer contracts, permitting records, construction budgets, and tenant commitments.
      relatedQuestionRefs: [QE007, QE008, QE010]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: Ionic-specific developer or practitioner-community evidence for a software, API, orchestration, or integration surface.
      whyItMatters: The product may be infrastructure-only, but the absence of a developer signal limits assessment of technical adoption and integration depth.
      diligencePath: Ask for customer integration documentation, API or orchestration materials, public engineering talks, and named practitioner references; if none exist, confirm the infrastructure-only scope.
      relatedQuestionRefs: [QE009]
