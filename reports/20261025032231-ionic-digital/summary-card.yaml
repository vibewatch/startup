  topStrengths:
    - 323 MW of contracted Ward County capacity with approximately $2.6 billion of reported contracted revenue.
    - Triple-net lease structure and reported liquidity provide a credible operating and funding anchor.
    - The company has moved beyond a mining-only model into a public AI/HPC infrastructure platform.
  topRisks:
