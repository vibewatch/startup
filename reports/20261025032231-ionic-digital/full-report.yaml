    title: Customer journey from contracted anchor to expansion
    type: journey-map
    summary: >-
      Ionic's visible customer path runs from one contracted Ward County tenant through cash-rent realization toward
      uncontracted capacity and prospective metro customers.
    data:
      items:
        - name: Controlled power
          label: Controlled power
          title: Controlled power
