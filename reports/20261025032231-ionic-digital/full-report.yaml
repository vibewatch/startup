        title: Leadership, governance, and execution dependence
        blocks:
          - type: paragraph
            body: >-
              The current executive roster comprises Andy Stewart, Chris Hickman, Antonio Piraino, Mark Lambourne, and
              Richard Carson, covering chief executive, finance, strategy, development, and legal functions. The SEC
              filing says Stewart became chief executive in November 2025 and brought more than 25 years of
              digital-infrastructure experience. Governance is formally separated between Stewart and board chair
