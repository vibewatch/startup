          detail: Business-model transition is visible
        - id: contracted-scale
          label: 323 MW and approximately $2.6B contracted revenue
          detail: Long-duration revenue visibility
        - id: cash-quality
          label: $43.8M Q2 infrastructure revenue was non-cash
          detail: Cash-rent conversion remains the key proof point
