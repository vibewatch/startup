            - 112 MW Midland portfolio
        - name: Anchor lease
          label: Anchor lease
          title: Anchor lease
          description: Nscale is the named tenant under the Ward County triple-net agreement.
          touchpoints:
            - 323 MW contracted
            - approximately $2.6B contracted revenue
        - name: Energization
          label: Energization
          title: Energization
          description: The first Ward County data center was energized before the reported cash-rent ramp.
          touchpoints:
