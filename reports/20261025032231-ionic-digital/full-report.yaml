  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and value chain
        blocks:
          - type: paragraph
            body: >-
              Ionic's relevant market is the provision of powered, grid-connected data-center capacity for AI and
              high-performance computing, with Bitcoin mining as a transitional use of some sites. The included spend is
              the lease or infrastructure revenue attached to energized capacity, plus the site-development work
              required to convert power into usable compute space. It does not include the customer's GPU purchases,
              model development revenue, or every dollar of global cloud consumption. That boundary matters because the
              company is monetizing scarce physical inputs—power, interconnection, land, cooling and data-center
              fit-out—rather than selling an undifferentiated AI application. Ionic's own January update describes its
              business as developing “strategic powered land assets for data centers, high-performance computing (HPC)
              and cryptocurrency mining,” while the company-reported Q2 mix shows infrastructure leasing at 90% of
              revenue. The transition therefore increases relevance to AI infrastructure demand, but does not by itself
              prove that all controlled megawatts will become contracted AI capacity.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Sizing through multiple lenses
        blocks:
          - type: paragraph
            body: >-
              The market is large under several non-additive lenses, but those lenses should not be collapsed into one
              TAM. JLL projects global data-center capacity to reach 200 GW by 2030, with 97 GW added between 2025 and
              2030 and a 14% sector CAGR; the Americas is about half of current global capacity and is forecast to grow
              supply at 17%. Deloitte's supporting analysis frames the bottleneck in energy terms and cites at least
              $250 billion of aggregate data-center capital expenditure in 2025 when third-party operators and
              outsourced cloud providers are included. These are ecosystem-level measures, not Ionic's serviceable
              revenue. Ionic's own disclosed footprint is much narrower: 234 MW energized and contracted at Ward County,
              a planned 466 MW expansion subject to ERCOT approval and utility work, and 112 MW across Midland sites
              undergoing pre-development. The defensible conclusion is that the addressable market is substantial, while
              Ionic's near-term SAM is the subset of capacity it can energize, convert, lease and collect cash rent on.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
      - number: '2.3'
        title: Buyer, user and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The immediate buyer is a hyperscaler or AI infrastructure provider seeking reserved power and data-center
              capacity; the user is the cloud, model or enterprise workload consuming the compute; and the payer is the
              tenant under a lease or a downstream cloud customer. Microsoft illustrates the end-user demand pattern by
              describing sustained AI and cloud demand from startups, governments, healthcare providers and educational
              institutions, while its Pecos announcement pairs capacity with dedicated onsite energy. NVIDIA's market
              announcement similarly shows Nscale operating as an AI infrastructure intermediary for model and cloud
              customers. Ionic's Ward County arrangement is therefore a B2B infrastructure sale with a concentrated
              counterparty, not a broad self-serve market. The adoption trigger is access to reliable power and suitable
              density; the budget owner is typically the hyperscaler or infrastructure provider's data-center and
              capacity-planning organization. Midland conversion remains a pipeline rather than a demonstrated
              multi-tenant demand pool because the disclosed evidence says Ionic is only fielding inbound interest from
              prospective tenants.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Demand is being pulled by AI workload growth and the shift from centralized training toward geographically
              distributed inference. JLL expects inference to become the dominant AI requirement in 2027 and says
              inference needs geographic distribution to reduce latency. That supports Ionic's thesis that power and
              location can be valuable together. The constraints are equally material: JLL reports average
              grid-connection waits above four years in primary markets, construction cost rising to $11.3 million per
              MW in 2026, and AI fit-out costs as high as $25 million per MW; Deloitte's source text also documents
              grid, water and community pressures. Ionic's own call says the 466 MW expansion is subject to ERCOT review
              and two utility upgrades, and management expressly says it does not have a date for the regulatory
              process. This creates a timing and capital-intensity discount to any headline TAM. The critical diligence
              question is not whether AI demand exists, but whether Ionic can convert each power right into
              tenant-backed, cash-producing capacity without overrelying on one lessee.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Conversion risk
            body: >-
              The market opportunity is not equivalent to Ionic's obtainable revenue: ERCOT timing, utility upgrades,
              construction cost, tenant credit and cash-rent evidence remain gating variables.
            calloutType: risk
            claimRefs:
              - CM008
              - CM014
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Ionic's addressable job is not simply “running a data center”; it is shortening the path from electricity
              and land to usable AI/HPC capacity. The company describes its offer as power-ready sites, while
              independent profiles describe the business as monetizing powered sites and transitioning from bitcoin
              mining to digital infrastructure. That places Ionic between powered-shell developers, specialist AI-cloud
              operators, hyperscalers, and an internal-build option. The most direct peer set therefore includes Applied
              Digital and similar site developers, CoreWeave and Nscale as infrastructure-led compute operators,
              Microsoft as a scaled build-and-operate incumbent, and the buyer's own campus program. These alternatives
              solve overlapping but not identical jobs, so the competitive comparison should not imply that Ionic and a
              hyperscaler have the same product, customer, or pricing model.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.2'
        title: Differentiation, capability, and trust
        blocks:
          - type: paragraph
            body: >-
              Ionic's strongest observable differentiator is time-to-power rather than software functionality. Its own
              positioning says power scarcity and deployment speed are the industry's two greatest challenges, and its
              Q2 materials report that the first Ward County data center was energized and cash rent had commenced. The
              Nscale lease and the reported 323 MW of contracted capacity provide commercial proof that at least one
              customer has bought the powered-site proposition. However, the same evidence also shows concentration
              around one flagship lease and a still-developing conversion program. Microsoft demonstrates the scale
              alternative: it pairs new infrastructure with dedicated energy supply and emphasizes reliability. Ionic
              can plausibly win where a customer values speed and flexible site access, but the public record does not
              prove superior uptime, financing cost, GPU operations, or customer support against larger operators.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
              - CP013
              - CP014
      - number: '3.3'
        title: Packaging, switching costs, and distribution power
        blocks:
          - type: paragraph
            body: >-
              The public commercial model is closer to long-duration infrastructure leasing than to metered cloud
              software. The disclosed Ward County arrangement is a 126-month triple-net lease, with the customer bearing
              operating expenses under the described structure; Blockspace separately reports that infrastructure
              leasing was projected to provide 90% to 92% of revenue in the relevant periods. This packaging can make
              revenue more predictable after energization, but it also creates high site-specific switching costs and a
              narrow set of potential buyers. A customer can multi-home across providers before committing, while Ionic
              itself depends on power interconnection, construction, and tenant conversion. Microsoft and other scaled
              operators have stronger distribution and procurement reach; internal build has maximum control but slower
              execution and more capital burden. Public list pricing, realized lease yields, SLA credits, and
              discounting are not disclosed in the assigned evidence, so those cells remain unknown rather than being
              inferred from contracted revenue.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Ionic's moat is currently better characterized as an execution window than as a proven network effect.
              Secured utility power, owned land, an operating conversion site, and a signed anchor lease can be
              difficult to replicate quickly in constrained Texas markets. Yet the advantage may commoditize if
              utilities, hyperscalers, and specialist operators bring comparable capacity online. NVIDIA's announcement
              that Nscale, CoreWeave, and Microsoft are scaling AI factories illustrates the depth of well-capitalized
              competition, while Microsoft's Pecos plan illustrates that large buyers can fund and control dedicated
              energy and data-center infrastructure themselves. The adverse case is therefore not that Ionic has no
              asset advantage; it is that the advantage may accrue to whoever can finance, energize, and operate the
              next site at the lowest risk-adjusted cost. Missing evidence includes independent uptime benchmarks,
              tenant pipeline beyond Nscale, renewal economics, and evidence of a repeatable sales channel.
            claimRefs:
              - CP004
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Power-first wedge
            body: >-
              Ionic has a credible wedge in power-ready, speed-to-market infrastructure, supported by its Ward County
              energization and contracted Nscale capacity.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP007
          - type: callout
            title: Concentration and incumbent response
            body: >-
              The competitive risk is concentration in one disclosed anchor lease and a response from hyperscalers and
              AI-infrastructure operators that can fund dedicated capacity at much larger scale.
            calloutType: risk
            claimRefs:
              - CP012
              - CP014
              - CP015
          - type: callout
            title: Diligence priority
            body: >-
              Underwriting should focus on repeatability: named tenants beyond Nscale, independently measured
              reliability, realized lease economics, and the cost and timing of converting the remaining power pipeline.
            calloutType: recommendation
            claimRefs:
              - CP013
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Lease revenue now dominates, but recognized revenue led cash
        blocks:
          - type: paragraph
            body: >-
              Ionic Digital reported $48.6 million of Q2 2026 revenue, up from $37.2 million a year earlier, with 90%
              generated by digital-infrastructure leasing rather than Bitcoin mining. That mix shift is economically
              important, but the period's $43.8 million of infrastructure revenue was entirely straight-line, non-cash
              recognition. Management said cash rent began in August at approximately $3.3 million and guided to about
              $29 million of cash rent for full-year 2026, versus roughly $175 million of annualized GAAP recognition
              already accruing. Revenue, contracted revenue, and cash collections are therefore different measures here;
              none should be presented as ARR. The residual mining operation remains exposed to Bitcoin output and price
              volatility, as April production fell 27.1% month over month to 20.45 BTC.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI012
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI005
              - CI011
              - CI012
      - number: '4.2'
        title: Triple-net terms create high reported margins without proving realized unit economics
        blocks:
          - type: paragraph
            body: >-
              The Nscale arrangement covers 323 MW and approximately $2.6 billion of contracted revenue, with the tenant
              responsible for operating costs, taxes, insurance, and maintenance under the triple-net structure. That
              allocation explains the reported 99% adjusted gross margin for infrastructure leasing, compared with 36%
              for mining and 93% company-wide in Q2 2026. It does not reveal realized price per MW, tenant concessions,
              renewal economics, credit exposure, or the return on Ionic-funded site work. Management also described
              future powered shell and turnkey structures, but the assigned public evidence does not quantify target
              yields or signed pricing for those prospective products. Those omissions prevent a defensible CAC,
              payback, or project-level return calculation.
            claimRefs:
              - CI002
              - CI011
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI010
              - CI011
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI011
              - CI016
      - number: '4.3'
        title: Near-term liquidity appears substantial, but expansion needs are not fully bounded
        blocks:
          - type: paragraph
            body: >-
              At quarter-end, management reported more than $400 million of cash, 2,882 BTC valued at approximately $169
              million, and no debt. It guided to $45 million-$60 million of 2026 capital expenditure excluding possible
              site acquisitions and said Bitcoin would be treated like cash for development and acquisition funding.
              This supports near-term flexibility, but funding raised historically is not the same as cash available
              today, and volatile Bitcoin holdings are not equivalent to cash. The July direct listing itself raised no
              new capital because existing shareholders, not the company, sold the listed shares. Project-level budgets,
              working-capital needs, lease security, and the funding plan beyond near-term Ward County and Midland work
              remain undisclosed.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI006
              - CI008
              - CI009
              - CI013
      - number: '4.4'
        title: Attractive lease accounting must convert into collected cash and repeatable returns
        blocks:
          - type: paragraph
            body: >-
              The financial profile is stronger and more predictable than a mining-only model if cash rent follows the
              disclosed ramp and triple-net obligations remain enforceable. Q2 adjusted EBITDA was $37.6 million, while
              the $35.3 million GAAP net loss was driven largely by a non-cash Bitcoin fair-value loss and a tax
              provision; the accounting loss is therefore not a measure of cash burn. Full-year guidance calls for $190
              million-$195 million of revenue and $137.5 million-$142.5 million of adjusted EBITDA, but the company did
              not reconcile the annual non-GAAP forecast to GAAP because taxes could not be reasonably predicted.
              Underwriting should remain conditional on bank evidence of rent collection, tenant-credit protections,
              project-level capex and yield schedules, and a bridge from recognized revenue to operating cash flow.
            claimRefs:
              - CI006
              - CI007
              - CI013
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Contract structure shifts operating costs to the tenant
            body: >-
              The triple-net lease supports unusually high reported infrastructure gross margin and reduces direct
              exposure to site operating costs, subject to tenant performance and the precise contract protections not
              disclosed in the assigned evidence.
            calloutType: strength
            claimRefs:
              - CI002
              - CI011
          - type: callout
            title: Recognized revenue preceded cash
            body: >-
              All Q2 infrastructure revenue was straight-line and non-cash. Investment underwriting should use collected
              rent and project cash flow rather than recognized revenue or the headline contracted-revenue total.
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Ionic Digital's delivered product is powered digital infrastructure rather than a disclosed software
              platform. Its customer workflow begins with securing utility capacity and an energized site, then offering
              that capacity to hyperscalers, enterprise customers, or other HPC/AI operators. The company's own
              description says it historically monetized powered assets through bitcoin mining and more recently has
              sought to lease them for HPC and AI cloud infrastructure. The Ward County contract is the clearest
              delivered example: a 126-month triple-net lease covering 234 MW, with the tenant responsible for operating
              costs, taxes, insurance, and maintenance. This is an infrastructure-hosting proposition, not evidence that
              Ionic itself supplies GPUs, an orchestration layer, or managed AI services.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE010
              - CE011
      - number: '5.2'
        title: Architecture, footprint, and maturity
        blocks:
          - type: paragraph
            body: >-
              The observable architecture has three layers: utility and interconnection rights, energized or convertible
              data-center shells, and tenant-specific AI/HPC fit-out. Ward County is the mature anchor: the first 234 MW
              phase was energized in 2023, and the Q2 call said the first data center had been energized and cash rent
              had commenced. Ionic reports an additional 89 MW amendment and a broader 822 MW utility pipeline, while
              four Midland sites totaling 112 MW remain bitcoin-mining assets undergoing pre-development for HPC/AI
              conversion. The expansion case depends on utility and ERCOT processes: management described two
              transmission/substation upgrades for the remaining 466 MW and expected energization by the end of 2027.
              These facts show infrastructure maturity at Ward County, but not completion of the full pipeline or proof
              that the Midland conversion has reached production.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE008
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
              - CE011
      - number: '5.3'
        title: Differentiation, operating controls, and technical gaps
        blocks:
          - type: paragraph
            body: >-
              Ionic's proposed differentiation is access to already-controlled power and a flexible deployment model.
              Management describes Ward County as suitable for hyperscale and neocloud customers, while Midland is
              positioned for smaller or more metro-oriented workloads; the call also described both powered-shell and
              turnkey options. That flexibility is a commercial design choice, not a demonstrated technical moat. JLL's
              2026 outlook reinforces why power availability and AI-capable retrofit readiness matter across the sector,
              but it does not validate Ionic's implementation. The public sources reviewed do not establish uptime,
              latency, PUE, cooling design, cybersecurity certification, incident history, integration APIs, or a public
              developer community. ERCOT verification and the uncompleted 466 MW expansion are material dependencies, so
              diligence should focus on commissioning evidence, tenant SLAs, security controls, and conversion budgets.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Product and technology verdict
        blocks:
          - type: paragraph
            body: >-
              The product is credible as a contracted power-and-facility platform, with a directly evidenced Ward County
              deployment and a large but partly prospective expansion path. Its technology risk is therefore
              concentrated less in proprietary software and more in execution: utility approvals, substation and
              transformer delivery, AI-ready fit-out, tenant-specific construction, and the transition of bitcoin sites
              into reliable compute facilities. The Nscale lease and energized first data center reduce product-market
              uncertainty at one site, but the record does not yet demonstrate repeatable multi-site deployment,
              measured service levels, or security/compliance readiness. The appropriate underwriting stance is to treat
              Ward County as verified infrastructure and the broader 822 MW platform as a milestone-dependent roadmap.
            claimRefs:
              - CE005
              - CE007
              - CE009
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Contracted anchor
            body: >-
              Ward County has an energized 234 MW phase and a 126-month Nscale lease; this is stronger evidence than an
              uncontracted power pipeline.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
          - type: callout
            title: Expansion remains dependency-heavy
            body: >-
              The remaining Ward County capacity and Midland conversion depend on utility work, ERCOT verification, and
              technical fit-out that are not yet demonstrated in production.
            calloutType: risk
            claimRefs:
              - CE008
              - CE012
              - CE013
          - type: callout
            title: Architecture disclosure gap
            body: >-
              Public materials describe sites, power, and leasing terms but do not substantiate a proprietary compute
              stack, security certification, or operating SLA.
            calloutType: assumption
            claimRefs:
              - CE010
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and use-case segmentation
        blocks:
          - type: paragraph
            body: >-
              Ionic's customer model currently separates into a contracted hyperscale or neocloud anchor at Ward County
              and prospective users for the remaining footprint. The 323 MW Ward County lease is with Nscale, while
              management describes the 112 MW Midland portfolio as aimed at neocloud customers and two large technology
              firms that could use grid power for lab environments or sovereign-cloud solutions. The company also
              describes a distinct future inference product near major metros, aimed at latency-sensitive workloads.
              These are meaningful buyer hypotheses, not evidence of signed contracts. The commercial value therefore
              sits in one documented customer relationship and a broader, unconverted pipeline.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption and cash-rent trajectory
        blocks:
          - type: paragraph
            body: >-
              Adoption is most measurable through energized capacity, lease commencement, and the shift in revenue mix
              rather than through disclosed account counts or utilization. Ionic reported that the first Ward County
              data center was energized and cash rent commenced in August 2026; Q2 digital-infrastructure revenue was
              recognized straight-line and non-cash, so accounting revenue should not be treated as cash collections.
              Management described approximately $3.3 million of August cash rent, roughly $23 million in Q4 2026, $135
              million in 2027, and approximately $183 million at the end of 2028. The trajectory is contract-backed but
              remains dependent on delivery and collection.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Named customer proof and reference quality
        blocks:
          - type: paragraph
            body: >-
              Nscale is the only named tenant supported by a described lease, and the evidence distinguishes the initial
              234 MW from the later 89 MW amendment. The lease is triple-net, with Nscale responsible for operating
              costs, taxes, insurance, and maintenance; this supports the quality of the contractual relationship but
              does not prove that all contracted capacity is already energized or cash-producing. Microsoft appears in
              the evidence as the counterparty holding an option on additional power secured at the site and as a large
              regional AI-demand signal, but the Microsoft Pecos announcement does not name Ionic. It should therefore
              not be counted as a direct Ionic deployment.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Retention, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not disclose NRR, GRR, churn, renewal rates, contract length beyond the reported
              lease term, customer satisfaction, or a customer-level revenue concentration percentage. The available
              evidence instead points to concentration risk: an independent analyst explicitly states that Ionic has one
              tenant for its flagship facility. Expansion is partly contractual, through Nscale's 89 MW amendment and
              rights relating to additional power, but the incremental 466 MW is not itself a signed customer commitment
              and management says it would also take that power to market broadly. The customer thesis is therefore
              durable only if the anchor performs and the pipeline converts.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Contracted anchor with improving cash visibility
            body: >-
              The Nscale relationship is more than a logo: it is tied to a stated triple-net lease, an energized initial
              phase, and a reported cash-rent commencement. That is stronger adoption evidence than a prospect list,
              while still leaving collections and service performance to verify.
            calloutType: strength
            claimRefs:
              - CU005
              - CU009
          - type: callout
            title: Customer concentration remains the central diligence risk
            body: >-
              The retained independent analysis describes one tenant at the flagship facility, while public evidence
              does not establish a second signed customer, retention metrics, or customer-level revenue diversification.
              The 2026-2028 cash-rent outlook should therefore be stress-tested against Nscale performance and expansion
              timing.
            calloutType: risk
            claimRefs:
              - CU013
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              The risk profile is high because Ionic is simultaneously changing business model, public-market structure,
              and infrastructure footprint. The Ward County lease gives the company a contracted anchor, but one tenant
              and one Texas site still carry much of the current platform. The Q2 earnings call states that $43.8
              million of digital infrastructure revenue was entirely straight-line non-cash revenue, while cash rent
              only commenced in August 2026; that distinction makes collections and ramp timing more important than GAAP
              revenue alone. The same call describes 822 MW of utility capacity in the pipeline, but the company says it
              has no date for a key Texas process and expects the additional 89 MW to energize in the second half of
              2027. The investment thesis breaks if cash rent materially misses the disclosed ramp, the Nscale
              relationship or rent guarantee weakens, required approvals delay energization, or the company funds
              expansion by selling volatile Bitcoin at unfavorable prices.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR009
              - CR011
              - CR012
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR011
              - CR014
              - CR015
      - number: '7.2'
        title: Legal, regulatory, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Ionic's legal and governance history is not a clean baseline for a newly public infrastructure company. A
              Delaware Court of Chancery ruling described in the assigned legal reporting found that the board failed to
              prove a valid, non-pretextual corporate purpose for reducing the board, and the report says the court
              ordered the nomination window reopened. The same account reports substantial turnover among the initial
              directors and senior officers, as well as shareholder frustration over transfer and listing delays. Those
              facts do not establish a current violation, but they raise governance and execution diligence needs around
              board independence, related-party decisions, shareholder communications, and continuity after the direct
              listing. Separately, management says the company will participate in PUCT and ERCOT verification and audit
              processes, while also saying that it does not have a date for the relevant process; approval timing
              therefore remains a measurable operating dependency rather than a closed risk.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
      - number: '7.3'
        title: Operational, partner, and concentration dependencies
        blocks:
          - type: paragraph
            body: >-
              The current operating model is concentrated by counterparty, geography, and infrastructure milestone. The
              Nscale lease is described as triple net, shifting operating costs, taxes, insurance, and maintenance to
              the tenant, which can protect site-level margins but also makes tenant credit and lease performance
              central to the revenue base. The company says NVIDIA guarantees the first five years of rent on the
              initial capacity and that Microsoft has an option on additional power; these are useful contractual
              signals, not proof that the broader customer pipeline has converted into independent tenants. Four Midland
              sites totaling 112 MW are still mining Bitcoin while pre-development work for HPC and AI conversion
              proceeds. The operational kill criteria should therefore track tenant payment and credit, power approval
              milestones, energization dates, construction and transformer delivery, uptime, and the share of cash
              revenue generated outside Nscale.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Financial, accounting, and capital-allocation risk
        blocks:
          - type: paragraph
            body: >-
              The financial picture has improved in mix but remains sensitive to accounting presentation and asset
              prices. Ionic reported Q2 2026 total revenue of $48.6 million, with 90% from digital infrastructure
              leasing, yet $43.8 million of that segment revenue was straight-line non-cash revenue. The company
              reported more than $400 million of cash and 2,882 Bitcoin valued at approximately $169 million, while
              management said it expects to sell Bitcoin to fund near-term development and site acquisitions. That
              liquidity is not the same as recurring cash generation: diligence should reconcile lease receivables, cash
              collections, capex, Bitcoin sales, tax obligations, and committed development spending. The direct listing
              itself raised no new capital for Ionic, so operating cash conversion and disciplined use of the existing
              liquidity pool remain the measurable financial safeguards.
            claimRefs:
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Cash conversion is the central near-term test
            body: >-
              The Q2 call separates $43.8 million of straight-line, non-cash infrastructure revenue from cash rent that
              only commenced in August 2026; diligence should prioritize collections and lease receivables over GAAP
              revenue growth.
            calloutType: risk
            claimRefs:
              - CR003
              - CR014
          - type: callout
            title: Pipeline capacity is not yet diversified revenue
            body: >-
              The 822 MW pipeline and prospective customer interest are operating options, not equivalent to contracted,
              energized, cash-producing sites.
            calloutType: assumption
            claimRefs:
              - CR011
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and investment judgment
        blocks:
          - type: paragraph
            body: >-
              Ionic Digital merits continued diligence rather than a price-insensitive buy. Q2 2026 revenue reached
              $48.6 million, with 90% attributed to digital-infrastructure leasing, while management reaffirmed $190
              million to $195 million of full-year revenue and $137.5 million to $142.5 million of adjusted EBITDA. The
              operating pivot is therefore visible, not merely aspirational. Yet the initial $2.4 billion reference
              value equated to roughly 12.5 times midpoint revenue guidance and 17.1 times midpoint adjusted EBITDA
              guidance, before adjusting for dilution or distinguishing accounting revenue from cash. The appropriate
              stance is stretched valuation, high risk, and medium confidence until cash collections, tenant
              concentration, and fully diluted capitalization are verified.
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV008
              - CV012
              - CV016
      - number: '8.2'
        title: Financing and public-market context
        blocks:
          - type: paragraph
            body: >-
              The June 2026 preferred financing and Nasdaq reference price both used $53 per share, a level reported to
              imply approximately $2.4 billion of market value. The first trading day closed at $62.90, implying
              approximately $2.8 billion, before an after-hours decline to $58.80. These are transaction and trading
              marks, not an independent fair-value study. The direct listing itself sold existing-holder shares and
              provided no new capital to the company. Separately, the preferred financing raised $400 million and
              included three warrant tranches. Entry analysis therefore needs the current share price, fully diluted
              share count, warrant economics, and holder liquidity; none can be inferred safely from the reference price
              or first-day market capitalization alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
              - CV015
      - number: '8.3'
        title: Operating proof and scenario boundaries
        blocks:
          - type: paragraph
            body: >-
              The strongest support for the thesis is the reported 323 MW contracted footprint and approximately $2.6
              billion of contracted revenue, reinforced by a debt-free balance sheet and more than $400 million of cash
              at quarter-end. The principal qualification is earnings quality: management said all $43.8 million of Q2
              digital-infrastructure revenue was straight-line non-cash revenue, while August cash rent was
              approximately $3.3 million. Management expects cash rent to rise from approximately $29 million in 2026 to
              $135 million in 2027 and a fully ramped $183 million run rate by the end of 2028. Those amounts are
              guidance rather than collections already demonstrated, so scenarios should be keyed to payment evidence
              and energization milestones rather than unsupported probability weights.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Anti-thesis, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is that investors capitalize long-duration contracted revenue before proving cash
              conversion, customer diversification, expansion approvals, and dilution. A bear outcome does not require
              contract failure: delayed power delivery, slower cash-rent ramp, multiple compression, or warrant exercise
              could each impair per-share returns. Conversely, a bull case requires timely rent receipts, the 89 MW
              expansion to energize, and additional capacity to attract credible tenants without disproportionate
              capital. Exit readiness remains conditional because the assigned evidence lacks a current cap table, a
              current market quote as of the run date, independent tenant-payment confirmation, and a defensible
              probability-weighted valuation. These are diligence gates, not reasons to convert missing inputs into
              false precision.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV012
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive recommendation
            body: >-
              Research-more. Upgrade only after current valuation, cash collections, fully diluted capitalization, and
              tenant diversification support an acceptable downside-adjusted return.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV014
              - CV015
              - CV016
          - type: callout
            title: Do not equate accounting revenue with cash
            body: >-
              Q2 digital-infrastructure revenue was reported as straight-line non-cash revenue; the disclosed cash-rent
              ramp remains a forecast that requires filed collection evidence.
            calloutType: risk
            claimRefs:
              - CV006
              - CV013
