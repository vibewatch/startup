    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and business model
        blocks:
          - type: paragraph
            body: >-
              Ionic Digital Inc. is a Delaware corporation with its principal executive office in Washington, D.C. The
              company was formed in January 2024 to acquire Celsius Mining's cryptocurrency-mining assets and initially
              operated as a bitcoin miner. It now describes its model as monetizing powered sites through leases to
              high-performance-computing and AI customers while retaining residual mining operations. The July 2026
              Nasdaq debut was a direct listing of existing shareholder shares rather than a primary capital raise. That
              distinction matters: the listing created public-market liquidity, but the capital supporting the
              transition came principally from a separate June private placement and existing balance-sheet resources.
