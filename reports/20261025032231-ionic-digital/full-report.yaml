      - number: '1.4'
        title: Concentration and diligence boundary
        blocks:
          - type: paragraph
            body: >-
              The SEC filing states that Ionic had one digital-infrastructure customer and that the Nscale arrangement
              was its only material facility lease at the filing date. This creates a sharp denominator problem: 323 MW
              of contracted capacity and approximately $2.6 billion of contracted revenue describe one relationship, not
              a diversified customer base. Public materials also do not disclose an exact company-wide headcount, a
              complete financing history, or a fully reconciled beneficial-ownership map. The retained evidence supports
              the current identity, capital transaction, leadership roster, and reported scale, but it does not
              independently verify rent collections after commencement, a second named AI tenant, or successful
              conversion of the Midland sites.
