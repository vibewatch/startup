evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: A dated bridge reconciling public firm counts to paying, active, pilot, and churned accounts.
    whyItMatters: >-
      Customer adoption is a central scale signal, but the public figures are not comparable without a stable
      denominator.
    diligencePath: >-
      Request monthly paying-logo and active-user cohorts with definitions and a bridge to every public customer-count
      claim.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue, ARR, growth, NRR, gross margin, services intensity, cash balance, burn, runway, and headcount.
    whyItMatters: Funding raised and valuation do not establish revenue quality, cash availability, or operating efficiency.
    diligencePath: >-
      Request the latest board reporting package, monthly financial statements, cohort retention, staffing roster, and
      cash reconciliation.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Current executive roster, board composition, voting control, preference stack, secondary components, and
      succession coverage.
    whyItMatters: Founder dependence and investor control cannot be evaluated from public financing announcements alone.
    diligencePath: >-
      Request the current org chart, board minutes and consents, fully diluted cap table, charter, voting agreements,
      and investor-rights agreements.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: litigation
    missingEvidence: The underlying EvenUp complaint, current docket, material rulings, and Eve's response.
    whyItMatters: >-
