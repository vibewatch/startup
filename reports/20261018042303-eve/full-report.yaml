  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product scope
        blocks:
          - type: paragraph
            body: >-
              Eve presents EveOS as an operating layer for plaintiff lawyers rather than a stand-alone drafting tool.
              The current company pages describe a system spanning firm data, case execution, auditing, and analytics,
              while the January 2026 launch organized the product around Agents, Auditor, and Analyst roles. The narrow
              practice focus is strategically important: third-party and company materials agree that Eve is built for
              plaintiff work and not for defense-side or transactional practice. The model therefore seeks depth across
              the plaintiff case lifecycle, but the retained evidence is mostly company-issued and does not
              independently validate the promised operating outcomes.
