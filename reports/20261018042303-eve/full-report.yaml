      - number: '4.3'
        title: Disclosed funding is meaningful, but capital adequacy remains private
        blocks:
          - type: paragraph
            body: >-
              The disclosed Series A and Series B rounds are large enough to explain continued product expansion and
              team build-out, and a current hiring page still emphasizes rapid growth. That said, public materials do
              not disclose current cash on hand, monthly burn, debt obligations, covenant pressure, or runway. The
              chapter can therefore say Eve has raised substantial capital and is still investing across product and
              legal/compliance functions, but it cannot say whether that capital is sufficient for the next twelve to
              eighteen months without finance room data. In underwriting terms, historic fundraising reduces near-term
              financing risk only partially; it does not clear the capital-adequacy question.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial read is that Eve has product breadth, category momentum, and enough
              disclosed capital to keep scaling, but the company still asks investors to trust a narrative more than a
              model. Revenue quality remains hard to score because published pricing is sparse, customer-count
              definitions drift upward without reconciliation, and the public record says nothing durable about gross
              margin, burn, or payback. Competitive intensity also matters: buyer proof-of-value requirements and
              adjacent workflow gaps could pressure both sales efficiency and expansion economics. Financial diligence
              should therefore focus on revenue mix, cohort quality, services burden, and cash runway before using the
              unicorn financing headline as evidence of durability.
            claimRefs:
              - CI010
              - CI012
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital adequacy is still a diligence blocker
            body: >-
              Historic fundraising is substantial, but current cash balance, burn, debt, and runway remain private, so
              the next financing trigger cannot be underwritten from public evidence alone.
            calloutType: risk
            claimRefs:
              - CI003
              - CI012
              - CI016
          - type: callout
            title: Highest-priority finance asks
            body: >-
              Request ARR bridge, gross margin by module and services, cohort retention and expansion, current cash and
              burn, and any debt or covenant schedule before using headline growth or valuation as underwriting
              evidence.
            calloutType: recommendation
            claimRefs:
              - CI012
              - CI013
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow coverage and product surface
        blocks:
          - type: paragraph
            body: >-
              Eve's public product positioning is unusually broad for a plaintiff-law workflow vendor. Across
              company-issued launch materials and multiple third-party reviews, the product is described as handling the
              case lifecycle from intake through resolution rather than only one step such as demand drafting or
              research. The June 2026 EveOS launch matters because it reframes Eve from a point solution into a
              plaintiff-firm operating system with named modules for intake, live case data, legal research, analytics,
              and automated communications. That breadth is the clearest product differentiator: plaintiff-side
              specialization appears consistent across sources, and third-party overviews repeatedly place Eve against
              plaintiff-specific tools rather than general legal copilots. The tradeoff is that the public product story
              still mixes current features, renamed modules, and company-reported adoption statistics, so the most
              defensible conclusion is scope and workflow ambition, not a fully reconciled maturity benchmark.
            claimRefs:
