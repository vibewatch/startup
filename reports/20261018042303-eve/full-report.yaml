  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: plaintiff-firm workflow software, not general legal AI'
        blocks:
          - type: paragraph
            body: >-
              The strongest boundary signal in the pool is how consistently sources describe Eve as plaintiff-specific
              rather than as a general legal-research or enterprise-law product. The AI Agent Index says Eve is "built
              only for plaintiff law firms" and lists workflow coverage from intake through litigation, while Eve's own
              category guide places it in the plaintiff-firm segment rather than alongside broad legal research,
              contract, or ediscovery tools. Third-party comparisons reinforce the same frame: Eve is repeatedly
              discussed as a platform choice for plaintiff practices that want one operating layer across intake,
              chronology, drafting, discovery, communications, and analytics.


              That boundary matters because it defines what should count as included or excluded spend. Included spend
              appears to be the software budget tied to plaintiff-firm execution bottlenecks: intake conversion, record
              review, chronology and demand production, discovery, legal research inside live matters, and firm-level
              operating visibility. Excluded or only adjacent spend includes broad enterprise legal AI, standalone
              research subscriptions, defense-side litigation tools, and upstream record-retrieval services. In other
              words, Eve's relevant market is narrower than "legal AI" but broader than any single point solution, which
              is why category comparisons keep framing the purchase as a platform decision rather than a
              feature-by-feature tool swap.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM011
              - CM012
      - number: '2.2'
        title: 'Sizing and adoption: traction is visible, but public TAM evidence is still proxy-based'
        blocks:
          - type: paragraph
            body: >-
              The pool does not contain a clean, independent dollar-market study for plaintiff-side legal AI, so sizing
              has to rely on bounded adoption proxies instead of a single headline TAM. Those proxies are meaningful but
              imperfect. Eve's September 2026 customer-milestone post says more than 1,000 plaintiff law firms run their
              caseloads on the platform and that the platform supports more than 200,000 active cases. Independent and
              adjacent sources cite higher figures — 1,200+ firms in review-style coverage and 1,400+ firms with
              200,000+ active matters in LawNext's June 2026 launch coverage — which supports the conclusion that the
              category is real and growing, but also shows that public customer-count methodology is not reconciled.


              The consequence is that market sizing can be triangulated only through multiple partial lenses:
              installed-firm counts, active-matter counts, practice-area breadth, and investor willingness to finance
              the category at a unicorn valuation. That is enough to show plaintiff-firm workflow AI has crossed from
              experimentation into budgeted infrastructure for at least a meaningful slice of the market. It is not
              enough to defend a precise TAM, SAM, or SOM in dollars, because public pricing is quote-based and none of
              the assigned sources provide revenue, average contract value, or conversion denominators that would let
              the firm-count proxies convert cleanly into spend.
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM011
      - number: '2.3'
        title: Buyer map, adoption drivers, and the main constraints on monetization
        blocks:
          - type: paragraph
            body: >-
              The buyer inside the firm appears to be management or operations leadership, but the user set is broader.
              Public product descriptions span intake teams, case managers, attorneys, and firm leadership: intake
              agents handle lead capture and signing, workflow agents draft and review case work, communication agents
              automate routine follow-up, and Analyst is explicitly framed around leadership questions such as
              profitability, case distribution, and revenue pacing. That combination makes Eve look less like a
              seat-based research purchase and more like an operating-system sale that must clear both legal-workflow
              and business-operations scrutiny.


              The adoption drivers are consistent across sources: more cases per attorney, faster resolution, less
              manual follow-up, and better visibility across a fragmented plaintiff-firm stack. The constraints are
              equally consistent. Eve still depends on integration with existing case-management and communication
              systems, some 2026 operating-system modules were still in beta when the market narrative accelerated, and
              adjacent vendors can credibly argue for narrower purchases when a firm only needs one bottleneck solved.
              Public evidence also leaves unanswered whether the cited customer counts are fully comparable, how much of
              the footprint is deeply deployed and paying, and how much wallet share Eve captures per firm. Those
              constraints do not negate the market opportunity, but they do limit how confidently public traction can be
              translated into valuation support.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform decision, not just a feature purchase
            body: >-
              Across the pool, Eve is sold and reviewed as a plaintiff-firm operating layer that bundles multiple
              workflow budgets together, which is why adjacent point solutions remain the clearest substitutes.
