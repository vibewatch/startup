      - number: '3.2'
        title: Buyers trade breadth against migration friction, pricing opacity, and integration comfort
        blocks:
          - type: paragraph
            body: >-
              Eve's broadest competitive advantage is that it can cover intake, chronologies, demand drafting,
              discovery, and firm analytics inside one plaintiff-specific platform, but the same breadth makes the
              purchase feel like a platform decision rather than a low-risk wedge. Publicly retained sources
              consistently describe Eve as quote-only, whereas comparison pages publish rough price bands for several
              narrower tools: ProPlaintiff at about $99-$249 per user, Supio at about $150-$400, EvenUp at about
              $200-$500, Clio AI tools at about $90-$150, CaseMark as free to start, and Carly agents from $35 per
              month. That contrast gives point tools a simpler first sale when a firm only wants demand automation,
              medical-record intelligence, or administrative follow-up. CMS-native substitutes strengthen that wedge:
              Clio Duo avoids a second system, while Filevine and Litify let firms keep AI inside the existing record of
              truth or treat a CMS migration as the main decision. Eve partially answers this with integrations into
              Filevine, Litify, CASEpeer, SmartAdvocate, and other plaintiff systems, which lowers near-term switching
              cost without eliminating the broader budget decision.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP008
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP013
              - CP014
      - number: '3.3'
        title: Eve's moat is breadth plus trust posture, but the market can still unbundle around the bottleneck
        blocks:
          - type: paragraph
            body: >-
              The public evidence points to a real strategic advantage for Eve when a plaintiff firm wants one operating
              layer across intake, casework, and reporting, especially because the company reinforces trust posture with
              SOC 2 and HIPAA positioning, multilingual intake, and legal/compliance hiring. But the same sources also
              make the displacement risks clear. Competitor and review pages repeatedly argue that firms often have only
              one urgent problem: demand quality, medical-record analysis, records retrieval, or administrative
              throughput. If that diagnosis is right, buying a platform can create shelfware risk. The adjacent
              record-retrieval category is the clearest example: LlamaLab explicitly says Eve does not operate a
              retrieval service and starts once the firm already has records, leaving upstream budget available for
              another vendor. Public scale signals are healthy but still noisy, moving from 900 firms in one
              company-controlled 2026 release to 1,000+ and 1,200+ on later public surfaces, so buyers can conclude that
              Eve is growing quickly without getting a perfectly benchmarkable adoption denominator.
            claimRefs:
              - CP002
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The category is unbundling around the bottleneck
            body: >-
              The retained evidence repeatedly segments the market by the firm's immediate pain point—valuation,
              medical-record analysis, CMS-native workflow, or admin operations—rather than by a single winner-take-all
              legal AI platform.
            calloutType: insight
            claimRefs:
