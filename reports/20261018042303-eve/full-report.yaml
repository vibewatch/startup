  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Plaintiff AI competition is segmented by job-to-be-done, not by a single feature race
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not show one monolithic "legal AI" buyer set. Instead, it clusters the
              plaintiff-side market into direct point tools, lifecycle platforms, and incumbent workflow systems. EvenUp
              is repeatedly described as the narrow-but-deep option for settlement valuation, demand packages, and
              MedChrons; Supio wins its mentions around medical-record and document intelligence; Anytime AI is framed
              as the deeper case-analysis option for complex plaintiff litigation; and Clio Duo, Filevine, and Litify
              matter because they keep AI inside the system of record that firms already use. Eve's own category framing
              widens the lens further by placing Harvey, Lexis+ Protégé, CoCounsel, Luminance, Everlaw, Lex Machina, and
              Spellbook in adjacent buckets such as research, contracts, ediscovery, and litigation analytics. That
              means the status-quo substitute is often not a single competitor at all, but an incumbent CMS plus one or
              two point tools layered on top. The current pool does not provide strong public evidence on a true
              internal-build entrant, so custom workflow assembly remains a buyer alternative in theory but an evidence
              gap in this chapter rather than a retained competitive fact.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
