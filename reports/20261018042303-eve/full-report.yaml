  - id: FM001
    title: Observed market stack around Eve's public wedge
    type: pyramid
    summary: >-
      The public evidence narrows Eve's relevant market from broad legal AI to a plaintiff-firm operating-layer wedge,
      with adoption proxies only at the bottom of the stack.
    data:
      items:
        - label: Broad legal AI software
          value: research / contracts / ediscovery / analytics
          note: Public comparison guides show a much broader universe than Eve's actual target market.
          tone: neutral
        - label: Plaintiff-law-specific AI
          value: personal injury / mass tort / plaintiff workflows
          note: Multiple sources describe Eve as plaintiff-only rather than cross-practice legal AI.
          tone: neutral
        - label: Full-lifecycle plaintiff platforms
          value: intake → casework → discovery → research
          note: Eve is repeatedly framed as a full-lifecycle workflow platform instead of a point tool.
          tone: opportunity
        - label: Operating-layer expansion
          value: communications, analytics, CMS complement
          note: Atlas, Analyst, and comms agents broaden the wedge beyond drafting alone.
          tone: opportunity
        - label: Public installed-base claims
          value: 1,000+ to 1,400+ firms
          note: 2026 customer-count claims show traction but are not methodologically reconciled.
          tone: warning
        - label: Observed workload proxy
          value: 200,000+ active cases / matters
          note: Useful adoption evidence, but not a dollar TAM, SAM, or SOM.
          tone: warning
    approximationNotes: >-
      Layering is conceptual and derived from source-backed category scope; only the bottom two layers contain explicit
      public quantities.
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM011
      - CM012
