        - Multiple sources agree on category fit and fundraising, while core financial proof remains missing.
        - Confidence can rise only after ARR, retention, and margin diligence.
      - - Risk rating
        - high
        - Valuation opacity, migration friction, and competitive/commercial execution risk remain material.
        - Require clear downside protection or superior diligence access.
      - - Valuation stance
        - expensive
        - Public sources support a >$1B round headline but not the operating metrics needed to validate it.
        - Avoid paying the headline price without hard revenue-quality proof.
      - - Decision implication
        - Track actively with hard diligence gates
        - The company may be a category winner, but present evidence is not sufficient for aggressive entry.
        - Advance only on verified economics or materially better terms.
    notes: >-
      Snapshot synthesized from assigned public evidence; recommendation is qualitative because ARR, NRR, gross margin,
      and cap-table terms are not publicly disclosed.
    claimRefs:
      - CV004
      - CV007
      - CV011
      - CV013
      - CV014
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Support
      - What would change the view
    rows:
      - - 'Thesis: plaintiff-law workflow focus is differentiated'
        - >-
          Competitor and review sources still describe Eve as a broad plaintiff operating layer spanning intake,
          drafting, and analytics.
        - Seeing durable expansion revenue from multiple modules across mature cohorts would strengthen conviction.
      - - 'Thesis: elite investors and continued launches create option value'
        - >-
          Series A and Series B financing plus 2025-2026 launch cadence suggest capacity to keep compounding product
          scope.
        - A documented path from product breadth to efficient monetization would turn momentum into underwritable value.
      - - 'Anti-thesis: public valuation proof is thin'
        - >-
          Public materials do not disclose paid ARR, retention, gross margin, or services mix, while pricing remains
          opaque.
        - Verified SaaS metrics and clean cohort data would remove the biggest underwriting gap.
      - - 'Anti-thesis: workflow breadth can also mean heavier adoption friction'
        - >-
          Competitive sources emphasize platform cost, migration weight, and missing record retrieval as practical
          blockers.
        - Proof of fast deployment, strong retention, and low churn among scaled customers would reduce this concern.
    notes: >-
      Arguments combine issuer, partner, independent, and competitor evidence; changes-in-view focus on diligence items
      that would move recommendation rather than generic optimism.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Firm-count growth converts into deeper wallet share, AI workforce launches expand monetization, and
          plaintiff-law specialization sustains premium multiples.
        - >-
          Current unicorn mark proves conservative and upside comes from operating-system control of plaintiff
          workflows.
        - Execution complexity, legal-AI competition, and dependence on continued capital-market openness.
        - Possible, but public evidence is still mostly qualitative and issuer-led.
      - - Base
        - Eve remains a strong vertical asset, but monetization and retention are solid rather than exceptional.
        - >-
          Most upside was pulled into the 2025 round, so returns from today depend on disciplined entry or long hold
          periods.
        - Metric opacity and adoption friction keep investors from paying materially higher multiples soon.
        - Most consistent with the assigned evidence set.
      - - Bear
        - >-
          Customer counts overstate paying depth, onboarding frictions persist, and the next financing occurs in a
          weaker legal-AI market.
        - A future round prices below or only around the last mark, producing weak or negative mark-to-market returns.
        - Opaque economics, platform cost concerns, and unproven margin structure amplify downside.
        - Material risk until diligence proves recurring revenue quality.
    notes: >-
      Scenario ranges stay qualitative because the assigned pool does not provide public ARR or margin anchors for a
      numeric DCF or revenue-multiple bridge.
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV009
      - CV011
      - CV013
      - CV014
