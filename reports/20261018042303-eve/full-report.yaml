      - number: '4.2'
        title: Public traction implies ROI, but not underwritten unit economics
        blocks:
          - type: paragraph
            body: >-
              Eve's retained public evidence points to real workflow adoption and customer ROI narratives, but those
              signals are still proxies rather than audited economics. The company claimed 5x revenue growth in the
              eight months after its January 2025 financing, later claimed 450+ firms and 200,000+ cases processed
              annually, and highlighted customer examples with sharply faster workflows or more case capacity. By 2026,
              public materials had moved to 1,000+ or 1,200+ firms, which shows momentum but also introduces definition
              risk because the sources do not reconcile whether those figures refer to paying firms, active firms, or
              some broader installed-base measure. The result is a credible growth narrative without the ARR, retention,
              or margin detail needed for underwriting.
