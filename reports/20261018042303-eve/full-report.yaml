  - id: FE001
    title: EveOS product architecture map
    type: stack
    summary: >-
      The assigned evidence describes Eve as a layered plaintiff-firm operating stack anchored by intake, structured
      case data, execution agents, research, analytics, and attorney approval.
    data:
      layers:
        - label: Intake capture
          detail: >-
            Jenny is presented as the always-on front door that screens and signs qualified demand before matters enter
            the case workflow.
          modules:
            - label: 24/7 voice intake
            - label: 28-language call handling
            - label: Engagement-letter signing
        - label: Structured case record
          detail: >-
            Atlas is described as the self-updating case file that standardizes inputs from existing tools into a
            portable live record.
          modules:
            - label: Case-data normalization
            - label: Medical-record extraction
            - label: Cross-system portability
        - label: Case execution agents
          detail: >-
            Drafting and communication agents move operational work forward across intake, pre-litigation, and
            litigation tasks.
          modules:
            - label: Demand / complaint drafting
            - label: Discovery drafting
            - label: Client and records follow-up
        - label: Research layer
          detail: Eve Research adds case-law retrieval and citation linking inside the broader workflow.
          modules:
            - label: Multi-jurisdiction opinions
            - label: Citation-linked source passages
        - label: Portfolio intelligence
          detail: >-
            Analyst is positioned as the reporting layer for plain-English questions about revenue pacing, attorney
            performance, and case distribution.
          modules:
            - label: Natural-language dashboards
            - label: Practice analytics
        - label: Human control point
          detail: >-
            Public descriptions say work is reviewed by attorneys before it leaves the firm, constraining end-to-end
            autonomy claims.
          outputs:
            - label: Attorney approval gate
