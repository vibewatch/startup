  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization surfaces are visible, but realized pricing is not
        blocks:
          - type: paragraph
            body: >-
              Public materials support a workflow-wide legal AI platform sold through a sales-led motion, not a
              transparent self-serve SKU catalog. Third-party reviews consistently describe the core product as
              quote-based and demo-led, while one public data point discloses roughly $350 per case for med-mal
              chronologies rather than a general platform list price. That makes the commercial surface legible enough
              to map the revenue model, but not enough to infer realized ASP, discounting, contract minimums, or
              revenue-recognition policy. The breadth of modules across intake, drafting, discovery, and analytics also
              suggests that revenue may reflect a bundled enterprise workflow sale rather than a single-feature
              subscription.
            claimRefs:
