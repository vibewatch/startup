              - CE009
              - CE010
      - number: '5.3'
        title: Trust posture, maturity signals, and unresolved technical risk
        blocks:
          - type: paragraph
            body: >-
              Product maturity is directionally credible but not fully underwritten by public evidence. Eve's March 2026
              general-availability release cites a year of production deployments and customer-reported workflow gains,
              while official and review surfaces consistently emphasize SOC 2 Type II and HIPAA as table-stakes controls
              for medical-record and plaintiff-case work. Those are useful signals, but the assigned pool does not
              include public audit artifacts, SLA data, uptime reporting, or detailed control documentation. Independent
              and competitor-adjacent reviews also surface practical frictions that the official narrative does not
              resolve: opaque pricing, no public integration roster, no record-retrieval service upstream of chronology
              work, and at least some complaints about inference speed or lack of live-event response. For diligence,
              the product looks specific and workflow-native; the remaining question is not what Eve wants to automate,
              but how repeatably and governably it does so across real firm environments.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Plaintiff-side specialization is the core product thesis
            body: >-
              The strongest product evidence is not a single model claim but the consistent workflow scope across
              sources: Eve is built around plaintiff intake, case development, drafting, auditing, and portfolio
              analytics rather than generic legal research or contract tooling.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: callout
            title: Implementation proof still lags product ambition
            body: >-
              Public materials establish what Eve says it does, but not enough detail on named integrations, retrieval
              dependencies, reliability metrics, or independently audited controls to underwrite deployment risk without
              live diligence.
            calloutType: risk
            claimRefs:
              - CE008
              - CE011
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and ICP
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a narrowly defined but resonant ideal customer profile: plaintiff-side law firms
              that want one workflow layer spanning intake, case development, discovery, and portfolio review. Across
              official copy, job-posting language, and third-party category pages, Eve is repeatedly framed for personal
              injury, labor and employment, medical malpractice, mass tort, workers' compensation, and Social
              Security/disability work rather than defense-side or transactional practices. That focus sharpens the
              buyer story, because the payer is typically the firm itself and the users are intake staff, attorneys,
              legal-operations teams, and firm leadership. It also limits what can be inferred from adoption breadth,
              since public materials emphasize plaintiff workflow fit more than broad legal-market penetration.
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU012
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU008
              - CU012
              - CU014
      - number: '6.2'
        title: Named production proof
        blocks:
          - type: paragraph
            body: >-
              Eve clears the threshold from abstract logo page to named deployment proof. Independent and company-issued
              2026 sources both cite recognizable plaintiff firms including Mike Morse, James Scott Farrin, Frontier Law
              Center, Jeffrey Glassman Injury Lawyers, Ricci Law Firm, Smith Clinesmith, and Earley Law Firm. The value
              evidence is operational rather than aspirational: Frontier described materially higher intake conversion
              and case value, James Scott Farrin described production use for medical summaries and settlement analysis,
              and the March 2026 GA release tied specific customer names to capacity, resolution-time, and
              drafting-speed claims. The limitation is that nearly all quantified outcomes still come from Eve-selected
              customer stories rather than customer-authored case studies or procurement records.
            claimRefs:
              - CU002
              - CU008
              - CU009
              - CU010
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU008
              - CU009
              - CU010
              - CU016
      - number: '6.3'
        title: Durability and expansion
        blocks:
          - type: paragraph
            body: >-
              The clearest durability signal is workflow depth. Public descriptions put Eve inside lead qualification,
              client signing, chronology creation, demand drafting, discovery, nightly auditing, firm communications,
              and analytics, which makes the product look more like an operating layer than a point tool. That breadth
              supports a land-and-expand narrative inside a customer account because more jobs can be attached after
              initial adoption. But public durability evidence remains qualitative: official materials lean on
              statements that attorneys would quit if Eve disappeared or that the product is part of the firm's DNA,
              while open sources do not disclose renewal rates, gross or net revenue retention, churn, contract lengths,
              or cohort curves.
            claimRefs:
              - CU011
              - CU012
              - CU014
      - number: '6.4'
        title: Concentration and open gaps
        blocks:
          - type: paragraph
            body: >-
              The main underwriting problem is measurement discipline, not lack of customer anecdotes. Public
              customer-count claims step from 800+ to 900+ to 1,000+ to 1,200+ firms across 2025-2026 materials, but the
              assigned source set does not define whether those numbers mean paying firms, active firms, firms that ever
              ran a pilot, or total firm logos touched by a workflow module. That makes growth direction credible but
              exact scale hard to underwrite. The same opacity applies to concentration: no assigned public source
              discloses top-customer exposure, channel contribution, or revenue mix by segment, so customer durability
              and concentration still require management data rather than more web searching.
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Expansion seems workflow-deep
            body: >-
              Public evidence suggests Eve usually sells more than a single point solution: the same account narrative
              often expands from intake into drafting, auditing, communications, and analytics.
            calloutType: insight
            claimRefs:
              - CU003
              - CU012
          - type: callout
            title: Retention and concentration are still management-data questions
            body: >-
              Open sources provide strong anecdotes but still do not disclose renewal, churn, NRR/GRR, or top-customer
              exposure, which limits how confidently customer durability can be underwritten from public evidence alone.
            calloutType: risk
            claimRefs:
              - CU011
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The clearest company-specific legal signal in the assigned evidence is Vantaige's report that EvenUp filed
              a federal trade-secret suit against Eve in September 2025 and alleged that a former employee downloaded
              more than 900 proprietary documents before joining Eve. That account is not a substitute for the docket,
              pleadings, or Eve's response, so liability, remedy exposure, and current procedural status remain
              unverified. Separately, Eve's Head of Legal posting says the company is building its legal function and
              explicitly names data handling, privilege, protective orders, commercial agreements, employment disputes,
              and trade-secret matters. The mandate is appropriately broad, but it also indicates that legal capacity is
              being scaled while these exposures are live.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.2'
        title: Product quality, supervision, and client-data risk
        blocks:
          - type: paragraph
            body: >-
              Legal-workflow automation carries asymmetric error costs because a missed fact, faulty case assessment, or
              mishandled client record can affect representation. Eve states that it is SOC 2 Type II certified, HIPAA
              compliant, does not train on client data, and queues agent work for attorney approval before it leaves a
              firm. Those are meaningful controls, not proof of error-free operation. Eve's own buyer guide says every
              legal AI makes mistakes, while Vantaige reports recurring speed complaints and mixed feedback on nuanced
              case evaluation. The investment case therefore depends on testable review controls, audit logs, incident
              response, and production service levels rather than certification labels alone.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR007
              - CR009
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.3'
        title: Operating and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Eve is an operating layer rather than a self-contained legal system. HelloCounsel reports that Eve Atlas
              runs alongside a firm's case-management system, and LlamaLab says Eve does not itself operate record
              retrieval, leaving output quality dependent on records the firm supplies. Eve's hiring material also says
              its teams collaborate directly with OpenAI and Anthropic. Together, those facts create integration,
              upstream-data, and model-provider dependencies whose concentration and fallback arrangements are not
              public. Competitor-authored comparisons also frame Eve as a platform-level purchase when many firms may
              need only one or two workflows, creating adoption, implementation, and renewal friction that should be
              tested against cohort retention and deployment-services intensity.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Residual risk and investment kill criteria
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports mitigation activity but not a low-risk conclusion. Eve claims more than 1,000
              plaintiff-firm customers, which increases the importance of reliable controls and repeatable deployment,
              yet the assigned evidence does not disclose incident frequency, uptime, model-provider concentration,
              renewal performance, or the cost of human review. The CallSphere allocation was successfully fetched but
              yielded only a title, so it cannot close any operational or safety question. Investment should pause if
              primary court records show material injunction or damages risk, if security diligence reveals undisclosed
              material incidents, if sampled outputs cannot meet agreed accuracy and approval thresholds, or if customer
              cohorts show that integration burden prevents durable production use.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Diligence before underwriting residual risk
            body: >-
              Obtain the EvenUp docket and Eve's response, current SOC 2 report and incident log, model and CMS
              subprocessor map, production uptime and latency history, sampled error and override rates, and customer
              cohorts segmented by implementation depth. Treat certifications and claimed attorney review as controls to
              test, not substitutes for operating evidence.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR007
              - CR009
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a real company, not a concept. Eve disclosed a $47 million Series A in January
              2025, partner materials later described a $103 million Series B at a valuation above $1 billion, and
              third-party/product materials consistently portray a plaintiff-specific workflow platform rather than a
              single-feature legal copilot. The problem is underwriting price rather than existence. Public sources in
              the assigned pool do not disclose paid ARR, net revenue retention, gross margin, or services intensity,
              while pricing itself remains quote-based and opaque. That combination supports a research-more
              recommendation and an expensive valuation stance: there is enough traction to stay engaged, but not enough
              revenue-quality evidence to chase the last private mark aggressively.
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV007
              - CV011
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis vs. anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Eve appears to have found a sharp wedge: plaintiff firms need automation
              across intake, records review, drafting, and case management, and even competitor-authored comparisons
              still describe Eve as unusually broad within that workflow. Customer and partner voices add color that
              firms are using the product to scale output, and LawNext shows continued product release cadence after the
              2025 financing cycle. The anti-thesis is just as important. Much of the strongest adoption evidence is
              company-, partner-, or customer-issued; customer-count figures move from 450-plus to 1,000-plus and
              1,200-plus across different periods and contexts; and adverse/competitive sources keep stressing platform
              cost, migration weight, and missing record-retrieval capability. Those frictions make this investment
              thesis highly sensitive to proof on retention, payback, and deployment depth.
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenario framing
        blocks:
          - type: paragraph
            body: >-
              The bull case is that Eve turns category leadership in plaintiff-workflow AI into durable, multi-product
              expansion: Series B capital funds product breadth, the company converts claimed firm counts into deeper
              wallet share, and a strategic acquirer or public market later rewards a control point inside
              plaintiff-firm operations. The base case is less dramatic: Eve remains an important vertical winner, but
              the 2025 unicorn price largely pulled forward future upside and only earns through if hidden revenue
              quality is exceptional. The bear case is straightforward. If public adoption claims overstate paying
              depth, if onboarding and pricing friction slow expansion, or if legal-AI multiples compress before Eve
              proves margins and retention, the next round could reset below the headline mark. That is why downside
              triggers matter more than upside stories here.
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV009
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV009
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: Exit readiness and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is plausible but not yet publicly underwritten. The company clearly knows how to attract
              top-tier capital and keep shipping, yet the assigned public evidence does not reveal board control,
              preference stack, secondary components, or audited operating metrics. That means the next diligence step
              is not more storytelling but document-level proof: current ARR, cohort retention, gross margin after
              implementation costs, deployment mix across claimed customers, and exact financing terms. Until that
              package exists, the most defensible entry discipline is to keep the company on the active list, refuse to
              anchor on the unicorn headline, and require either materially stronger internal proof or better pricing
              before upgrading to a buy-like posture.
            claimRefs:
              - CV003
              - CV007
              - CV011
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Why the call stops short of buy
            body: >-
              Eve may still become the control point for plaintiff-firm workflows, but the current public package proves
              enthusiasm better than it proves software economics. Without verified ARR, retention, margin, and
              financing-term detail, the prudent move is to keep diligence open rather than stretch for the last round
              price.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV007
              - CV011
              - CV013
              - CV014
