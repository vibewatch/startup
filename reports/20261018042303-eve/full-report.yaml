      - number: '5.2'
        title: Operating model, architecture, and deployment
        blocks:
          - type: paragraph
            body: >-
              The product architecture described in the assigned evidence pool has a coherent layered shape. Intake and
              communications sit at the front door, Atlas is presented as the structured case-data layer, drafting and
              execution agents handle day-to-day casework, Research brings cited case law into those workflows, and
              Analyst turns portfolio data into plain-English reporting. That stack suggests Eve is trying to own the
              operational loop inside a plaintiff firm, not only generate isolated documents. Public materials also
              describe a human-review gate: work is queued for attorney approval before it leaves the firm, which is
              important because it limits how much autonomy the product is claiming in production. Deployment, however,
              is not fully transparent. Third-party reviewers say Eve can run beside an existing case-management system
              or stand alone, but they also note that named CMS integrations are not publicly enumerated, so
              compatibility, migration effort, and API depth remain diligence items rather than established product
              proof.
