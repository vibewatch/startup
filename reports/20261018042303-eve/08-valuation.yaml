- calloutType: recommendation
  title: Why the call stops short of buy
  body: Eve may still become the control point for plaintiff-firm workflows, but the current public package proves enthusiasm
    better than it proves software economics. Without verified ARR, retention, margin, and financing-term detail, the prudent
    move is to keep diligence open rather than stretch for the last round price.
