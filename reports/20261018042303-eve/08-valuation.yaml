company:
  name: Eve
chapter:
  number: 8
  title: Valuation
  summary: Eve has clear plaintiff-law workflow fit, elite financing support, and credible signs of adoption, but the public
    package still leaves ARR, retention, gross margin, and capital-stack detail undisclosed. That makes the unicorn mark hard
    to underwrite on public evidence alone, so the disciplined call remains research-more with an expensive valuation stance
    until revenue-quality diligence closes the gap.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: 'Public evidence supports a real company, not a concept. Eve disclosed a $47 million Series A in January 2025, partner
    materials later described a $103 million Series B at a valuation above $1 billion, and third-party/product materials consistently
    portray a plaintiff-specific workflow platform rather than a single-feature legal copilot. The problem is underwriting
    price rather than existence. Public sources in the assigned pool do not disclose paid ARR, net revenue retention, gross
    margin, or services intensity, while pricing itself remains quote-based and opaque. That combination supports a research-more
    recommendation and an expensive valuation stance: there is enough traction to stay engaged, but not enough revenue-quality
    evidence to chase the last private mark aggressively.'
  claimRefs:
  - CV001
  - CV004
  - CV007
  - CV011
  - CV013
  - CV014
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: thesis-vs-anti-thesis
  title: Thesis vs. anti-thesis
  body: 'The positive thesis is that Eve appears to have found a sharp wedge: plaintiff firms need automation across intake,
    records review, drafting, and case management, and even competitor-authored comparisons still describe Eve as unusually
    broad within that workflow. Customer and partner voices add color that firms are using the product to scale output, and
    LawNext shows continued product release cadence after the 2025 financing cycle. The anti-thesis is just as important.
    Much of the strongest adoption evidence is company-, partner-, or customer-issued; customer-count figures move from 450-plus
    to 1,000-plus and 1,200-plus across different periods and contexts; and adverse/competitive sources keep stressing platform
    cost, migration weight, and missing record-retrieval capability. Those frictions make this investment thesis highly sensitive
    to proof on retention, payback, and deployment depth.'
  claimRefs:
  - CV005
  - CV006
  - CV008
  - CV009
  - CV010
  - CV012
  tableRefs:
  - TV002
- id: scenario-framing
  title: Scenario framing
  body: 'The bull case is that Eve turns category leadership in plaintiff-workflow AI into durable, multi-product expansion:
    Series B capital funds product breadth, the company converts claimed firm counts into deeper wallet share, and a strategic
    acquirer or public market later rewards a control point inside plaintiff-firm operations. The base case is less dramatic:
    Eve remains an important vertical winner, but the 2025 unicorn price largely pulled forward future upside and only earns
    through if hidden revenue quality is exceptional. The bear case is straightforward. If public adoption claims overstate
    paying depth, if onboarding and pricing friction slow expansion, or if legal-AI multiples compress before Eve proves margins
    and retention, the next round could reset below the headline mark. That is why downside triggers matter more than upside
    stories here.'
  claimRefs:
  - CV004
  - CV006
  - CV007
  - CV009
  - CV011
  - CV013
  tableRefs:
  - TV003
- id: exit-readiness-and-diligence-asks
  title: Exit readiness and diligence asks
  body: 'Exit readiness is plausible but not yet publicly underwritten. The company clearly knows how to attract top-tier
    capital and keep shipping, yet the assigned public evidence does not reveal board control, preference stack, secondary
    components, or audited operating metrics. That means the next diligence step is not more storytelling but document-level
    proof: current ARR, cohort retention, gross margin after implementation costs, deployment mix across claimed customers,
    and exact financing terms. Until that package exists, the most defensible entry discipline is to keep the company on the
    active list, refuse to anchor on the unicorn headline, and require either materially stronger internal proof or better
    pricing before upgrading to a buy-like posture.'
  claimRefs:
  - CV003
  - CV007
  - CV011
  - CV014
