schemaVersion: report-v2
artifact: company-overview
slug: eve
runDate: 2026-10-18
company:
  name: Eve
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Eve is a San Francisco legal-AI company focused on plaintiff law firms, backed by
    a reported $164 million of financing and a September 2025 Series B valuation above
    $1 billion. Its product and funding milestones are visible, but customer-count
    definitions, current financial performance, headcount, governance rights, and the
    status of reported trade-secret litigation remain material diligence gaps.
sections:
  - id: identity-and-product-scope
    title: Identity and product scope
    body: >-
      Eve presents EveOS as an operating layer for plaintiff lawyers rather than a
      stand-alone drafting tool. The current company pages describe a system spanning
      firm data, case execution, auditing, and analytics, while the January 2026
      launch organized the product around Agents, Auditor, and Analyst roles. The
      narrow practice focus is strategically important: third-party and company
      materials agree that Eve is built for plaintiff work and not for defense-side
      or transactional practice. The model therefore seeks depth across the plaintiff
      case lifecycle, but the retained evidence is mostly company-issued and does not
      independently validate the promised operating outcomes.
    claimRefs: [CO001, CO002, CO005, CO007, CO013]
    tableRefs: [TO001]
  - id: founders-and-governance
    title: Founders, leadership, and governance
    body: >-
      Two independent profiles identify 2020 as the founding year and name Jay
      Madheswaran, Matt Noe, and David Zeng as co-founders. Company launch materials
      identify Madheswaran as CEO, making him the clearest public operating and
      strategic leader in the assigned evidence. The public record is much thinner
      below that founder layer: no complete executive roster, board roster, voting
      structure, preference stack, or succession plan appears in the retained pool.
      Founder continuity can support product vision, but the absence of role detail
      for Noe and Zeng and of a broader leadership map leaves key-person dependence
      and functional coverage unresolved.
    claimRefs: [CO003, CO004, CO006]
    tableRefs: [TO002]
  - id: capital-stakeholders-and-scale
    title: Capital, stakeholders, and scale
    body: >-
      The financing sequence is comparatively well documented: a reported $14 million
      seed in 2023, a $47 million Series A in January 2025, and a $103 million Series B
      in September 2025. YesPress reports $164 million raised in total, while multiple
      sources place the Series B valuation above $1 billion. Spark Capital led the
      Series B, with Andreessen Horowitz, Lightspeed Venture Partners, and Menlo
      Ventures named as participants. Commercial scale is less comparable. Public
      materials move from 450-plus firms around September 2025 to more than 500 in
      January 2026, more than 900 in March, and 1,700-plus on the current homepage,
      without a consistent paying or active-firm denominator.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: evidence-quality-and-adverse-signals
    title: Evidence quality and adverse signals
    body: >-
      The strongest public facts concern financing, positioning, and dated product
      announcements; they do not establish current ARR, revenue, retention, margin,
      headcount, or cash availability. Customer counts are company claims with shifting
      dates and undefined denominators, not independently audited adoption figures.
      A competitor review also says Eve does not operate medical-record retrieval,
      identifying an upstream workflow boundary rather than disproving the broader
      casework proposition. Separately, Vantaige reports that EvenUp filed a
      trade-secret action in September 2025 and described it as ongoing in May 2026.
      The assigned pool contains no court docket, so the allegation and present status
      require primary legal verification.
    claimRefs: [CO014, CO015, CO016]
callouts:
  - calloutType: insight
    title: Funding visibility exceeds operating visibility
    body: >-
      Eve's financing history and product milestones are public, but the evidence does
      not disclose the revenue, retention, margin, or headcount data needed to connect
      the unicorn valuation to current operating performance.
    claimRefs: [CO008, CO009, CO010, CO011, CO012]
  - calloutType: risk
    title: Customer scale and litigation need primary verification
    body: >-
      The latest homepage claim of 1,700-plus firms lacks a defined active or paying
      denominator, while the reported EvenUp lawsuit is supported here only by a
      secondary review rather than the underlying docket.
    claimRefs: [CO013, CO014, CO016]
