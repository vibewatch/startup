  topStrengths:
    - Clear plaintiff-side workflow wedge across intake, casework, drafting, discovery, analytics, and communications.
    - Strong financing signal with a reported $47M Series A, $103M Series B, and roughly $164M raised.
    - Visible adoption momentum, including company claims of 1,700+ firms and named production customers.
  topRisks:
    - ARR, NRR, gross margin, cash burn, and services intensity remain undisclosed.
    - Customer-count definitions shift across sources, so scale is not cleanly reconciled.
    - Reported trade-secret litigation and broader legal/data-governance exposure remain unresolved.
  unresolvedGaps:
