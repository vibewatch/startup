companyProfile:
  summary: >-
    Eve is a San Francisco-based legal AI company that positions EveOS as an AI operating layer for plaintiff lawyers.
    Its public story centers on a broad plaintiff-side workflow stack spanning intake, casework, drafting, discovery,
    analytics, and communications, with product releases in 2026 reframing the company as a plaintiff-firm operating
    system rather than a narrow point tool. Public evidence shows real financing and adoption momentum, but the company
    still withholds the operating metrics needed to underwrite revenue quality or governance with confidence.
