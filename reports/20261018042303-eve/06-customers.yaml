  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Public or management-supplied NRR, GRR, churn, renewal, contract-length, and cohort-retention data.
    whyItMatters: Durability is central to a software-style underwriting case and cannot be inferred from testimonials alone.
    diligencePath: Request cohort tables by customer vintage, seat/workflow expansion, renewal rates, and logo churn for the
      last four quarters.
    relatedQuestionRefs:
    - QU005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, segment revenue mix, and channel or partner contribution to bookings.
    whyItMatters: A narrow plaintiff-law ICP can still be attractive, but concentration risk cannot be judged without customer
      mix data.
