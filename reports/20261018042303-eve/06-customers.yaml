    severity: material
    topic: customer-count-denominator
    missingEvidence: A reconciled customer-count bridge showing logos, active customers, paying firms, and pilot accounts
      by month.
    whyItMatters: Public adoption figures move materially across sources and directly affect how much commercial proof can
      be underwritten.
    diligencePath: Request a monthly customer ledger with definitions for logo, active, paying, and pilot accounts plus gross
      and net adds for 2025-2026.
