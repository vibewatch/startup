schemaVersion: report-v2
artifact: customers
slug: eve
runDate: 2026-10-18
company:
  name: Eve
chapter:
  number: 6
  title: Customers
  summary: 'Eve has real named-customer proof inside plaintiff-side law firms, with multiple 2026 sources showing production
    use across intake, drafting, auditing, and analytics rather than logo-only marketing. The strongest weakness is not absence
    of adoption signals but opacity: public customer counts range from 800+ to 1,200+ firms, and open sources still do not
    reconcile paying-account definitions, retention metrics, or concentration exposure.'
sections:
- id: customer-base-and-icp
  title: Customer base and ICP
  body: 'Public evidence points to a narrowly defined but resonant ideal customer profile: plaintiff-side law firms that want
    one workflow layer spanning intake, case development, discovery, and portfolio review. Across official copy, job-posting
    language, and third-party category pages, Eve is repeatedly framed for personal injury, labor and employment, medical
    malpractice, mass tort, workers'' compensation, and Social Security/disability work rather than defense-side or transactional
    practices. That focus sharpens the buyer story, because the payer is typically the firm itself and the users are intake
    staff, attorneys, legal-operations teams, and firm leadership. It also limits what can be inferred from adoption breadth,
    since public materials emphasize plaintiff workflow fit more than broad legal-market penetration.'
  claimRefs:
  - CU001
  - CU003
  - CU005
  - CU012
  - CU015
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: named-production-proof
  title: Named production proof
  body: 'Eve clears the threshold from abstract logo page to named deployment proof. Independent and company-issued 2026 sources
    both cite recognizable plaintiff firms including Mike Morse, James Scott Farrin, Frontier Law Center, Jeffrey Glassman
    Injury Lawyers, Ricci Law Firm, Smith Clinesmith, and Earley Law Firm. The value evidence is operational rather than aspirational:
    Frontier described materially higher intake conversion and case value, James Scott Farrin described production use for
    medical summaries and settlement analysis, and the March 2026 GA release tied specific customer names to capacity, resolution-time,
    and drafting-speed claims. The limitation is that nearly all quantified outcomes still come from Eve-selected customer
    stories rather than customer-authored case studies or procurement records.'
  claimRefs:
  - CU002
  - CU008
  - CU009
  - CU010
  - CU016
  tableRefs:
  - TU003
- id: durability-and-expansion
  title: Durability and expansion
  body: 'The clearest durability signal is workflow depth. Public descriptions put Eve inside lead qualification, client signing,
    chronology creation, demand drafting, discovery, nightly auditing, firm communications, and analytics, which makes the
    product look more like an operating layer than a point tool. That breadth supports a land-and-expand narrative inside
    a customer account because more jobs can be attached after initial adoption. But public durability evidence remains qualitative:
    official materials lean on statements that attorneys would quit if Eve disappeared or that the product is part of the
    firm''s DNA, while open sources do not disclose renewal rates, gross or net revenue retention, churn, contract lengths,
    or cohort curves.'
  claimRefs:
  - CU011
  - CU012
  - CU014
- id: concentration-and-open-gaps
  title: Concentration and open gaps
  body: 'The main underwriting problem is measurement discipline, not lack of customer anecdotes. Public customer-count claims
    step from 800+ to 900+ to 1,000+ to 1,200+ firms across 2025-2026 materials, but the assigned source set does not define
    whether those numbers mean paying firms, active firms, firms that ever ran a pilot, or total firm logos touched by a workflow
    module. That makes growth direction credible but exact scale hard to underwrite. The same opacity applies to concentration:
    no assigned public source discloses top-customer exposure, channel contribution, or revenue mix by segment, so customer
    durability and concentration still require management data rather than more web searching.'
  claimRefs:
  - CU004
  - CU006
  - CU007
  - CU013
