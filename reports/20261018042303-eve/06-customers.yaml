- id: FU001
  title: Customer journey map
  type: journey-map
  summary: Eve's public adoption narrative expands from plaintiff-firm intake into case execution, nightly review, and firm-level
    analytics.
  data:
    items:
    - label: Initial lead capture
      actor: Intake staff and prospective clients
      phase: Top-of-funnel adoption
      touchpoints:
      - 24/7 AI intake and lead scoring
      - Multilingual caller handling
      note: Public proof is strongest for intake and screening workflows.
      tone: positive
    - label: Qualification and signing
      actor: Intake teams, attorneys, and prospective clients
      phase: Early case conversion
      touchpoints:
      - Case qualification
      - On-call client signing
      note: Frontier Law Center metrics suggest this stage can affect conversion and average case value.
      tone: positive
    - label: Record ingestion and chronology
      actor: Attorneys and case teams
      phase: Core case development
      touchpoints:
      - Medical summaries
      - Chronologies
      - Damages context
      note: Multiple sources say Eve starts from records supplied by the firm rather than running retrieval itself.
      tone: neutral
    - label: Drafting and discovery execution
      actor: Attorneys and legal staff
      phase: Mid-case workflow
      touchpoints:
      - Demand letters
      - Discovery responses
      - Complaint drafting
      note: Official outcomes focus on throughput rather than contract or renewal evidence.
      tone: positive
    - label: Nightly audit and missed-value detection
      actor: Attorneys and reviewers
      phase: Value expansion inside the account
      touchpoints:
      - AI Auditor nightly review
      - Missed injury and mass-tort detection
      note: This is a key expansion surface beyond a single drafting tool.
      tone: positive
    - label: Portfolio analytics and communications
      actor: Firm leadership and operations teams
      phase: Firm-wide expansion
      touchpoints:
      - Firm analytics
      - Client and records communications
      - Cross-matter intelligence
      note: Open sources support breadth but do not quantify seat expansion or retained ARR.
      tone: neutral
  approximationNotes: Sequence reflects the dominant adoption surfaces described in the assigned public sources, not an audited
    implementation order for every customer.
