- id: FP001
  title: Competitive positioning map
  type: quadrant
  summary: Ordinal mapping from the retained public evidence places Eve furthest on workflow breadth, while EvenUp, Supio,
    and Anytime cluster deeper on narrower plaintiff casework jobs.
