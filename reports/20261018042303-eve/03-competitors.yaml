company:
  name: Eve
chapter:
  number: 3
  title: Competitors
  summary: Eve competes most directly with plaintiff-specific point tools such as EvenUp, Supio, and Anytime AI, while CMS-native
    incumbents like Clio Duo, Filevine, and Litify compete by reducing migration friction. The strongest public differentiation
    for Eve is breadth across intake, casework, and analytics, but that breadth also creates quote-only pricing opacity and
    exposes Eve to unbundling by firms that only need one workflow solved well.
sections:
- id: plaintiff-ai-landscape
  title: Plaintiff AI competition is segmented by job-to-be-done, not by a single feature race
  body: "The retained evidence does not show one monolithic \"legal AI\" buyer set. Instead, it clusters the plaintiff-side\
    \ market into direct point tools, lifecycle platforms, and incumbent workflow systems. EvenUp is repeatedly described\
    \ as the narrow-but-deep option for settlement valuation, demand packages, and MedChrons; Supio wins its mentions around\
    \ medical-record and document intelligence; Anytime AI is framed as the deeper case-analysis option for complex plaintiff\
    \ litigation; and Clio Duo, Filevine, and Litify matter because they keep AI inside the system of record that firms already\
    \ use. Eve's own category framing widens the lens further by placing Harvey, Lexis+ Prot\xE9g\xE9, CoCounsel, Luminance,\
    \ Everlaw, Lex Machina, and Spellbook in adjacent buckets such as research, contracts, ediscovery, and litigation analytics.\
    \ That means the status-quo substitute is often not a single competitor at all, but an incumbent CMS plus one or two point\
    \ tools layered on top. The current pool does not provide strong public evidence on a true internal-build entrant, so\
    \ custom workflow assembly remains a buyer alternative in theory but an evidence gap in this chapter rather than a retained\
    \ competitive fact."
  claimRefs:
  - CP001
  - CP003
  - CP004
  - CP005
  - CP006
  - CP007
  - CP010
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: pricing-and-switching-costs
  title: Buyers trade breadth against migration friction, pricing opacity, and integration comfort
  body: 'Eve''s broadest competitive advantage is that it can cover intake, chronologies, demand drafting, discovery, and
    firm analytics inside one plaintiff-specific platform, but the same breadth makes the purchase feel like a platform decision
    rather than a low-risk wedge. Publicly retained sources consistently describe Eve as quote-only, whereas comparison pages
    publish rough price bands for several narrower tools: ProPlaintiff at about $99-$249 per user, Supio at about $150-$400,
    EvenUp at about $200-$500, Clio AI tools at about $90-$150, CaseMark as free to start, and Carly agents from $35 per month.
    That contrast gives point tools a simpler first sale when a firm only wants demand automation, medical-record intelligence,
    or administrative follow-up. CMS-native substitutes strengthen that wedge: Clio Duo avoids a second system, while Filevine
    and Litify let firms keep AI inside the existing record of truth or treat a CMS migration as the main decision. Eve partially
    answers this with integrations into Filevine, Litify, CASEpeer, SmartAdvocate, and other plaintiff systems, which lowers
    near-term switching cost without eliminating the broader budget decision.'
  claimRefs:
  - CP001
  - CP002
  - CP006
  - CP008
  - CP013
  - CP014
  tableRefs:
  - TP002
  - TP003
- id: durability-and-displacement-risk
  title: Eve's moat is breadth plus trust posture, but the market can still unbundle around the bottleneck
  body: 'The public evidence points to a real strategic advantage for Eve when a plaintiff firm wants one operating layer
    across intake, casework, and reporting, especially because the company reinforces trust posture with SOC 2 and HIPAA positioning,
    multilingual intake, and legal/compliance hiring. But the same sources also make the displacement risks clear. Competitor
    and review pages repeatedly argue that firms often have only one urgent problem: demand quality, medical-record analysis,
    records retrieval, or administrative throughput. If that diagnosis is right, buying a platform can create shelfware risk.
    The adjacent record-retrieval category is the clearest example: LlamaLab explicitly says Eve does not operate a retrieval
    service and starts once the firm already has records, leaving upstream budget available for another vendor. Public scale
    signals are healthy but still noisy, moving from 900 firms in one company-controlled 2026 release to 1,000+ and 1,200+
    on later public surfaces, so buyers can conclude that Eve is growing quickly without getting a perfectly benchmarkable
    adoption denominator.'
  claimRefs:
  - CP002
  - CP009
  - CP011
  - CP012
  - CP013
  - CP014
