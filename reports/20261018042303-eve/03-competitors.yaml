      label: Workflow breadth (1=narrow point tool, 5=firm operating layer)
    yAxis:
      label: Plaintiff casework depth (1=light, 5=deep)
    points:
    - label: Eve
      x: 5
      y: 4
      detail: Broadest retained scope across intake, casework, discovery, and analytics.
    - label: EvenUp
      x: 2
      y: 5
      detail: Deepest retained focus on settlement valuation and demand packages.
    - label: Supio
      x: 2
      y: 4
      detail: Document-heavy intelligence and CMS-connected plaintiff workflows.
    - label: Anytime AI
      x: 3
      y: 4
      detail: Plaintiff-case depth with less retained evidence of firm-wide ops coverage.
    - label: Clio Duo
      x: 4
      y: 2
      detail: Broad because it sits inside the incumbent CMS, but with lighter retained casework depth.
    - label: Filevine / Litify
      x: 4
      y: 3
      detail: System-of-record leverage and operations control, with AI scope tied to CMS decisions.
  approximationNotes: Coordinates are ordinal synthesis from retained public descriptions rather than audited benchmarks;
