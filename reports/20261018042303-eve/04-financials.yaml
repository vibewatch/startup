schemaVersion: report-v2
artifact: financials
slug: eve
runDate: 2026-10-18
company:
  name: Eve
chapter:
  number: 4
  title: Financials
  summary: >-
    Eve has enough public evidence to show a broad, workflow-level monetization story and a
    substantial disclosed capital base, but not enough to underwrite revenue quality or runway.
    Public sources show quote-based platform sales, one disclosed per-case chronology price,
    strong company-claimed growth, and real competitive pressure, while leaving ARR, margins,
    burn, cash, and contract realization private.
sections:
  - id: monetization-surfaces
    title: Monetization surfaces are visible, but realized pricing is not
    body: >-
      Public materials support a workflow-wide legal AI platform sold through a sales-led motion,
      not a transparent self-serve SKU catalog. Third-party reviews consistently describe the core
      product as quote-based and demo-led, while one public data point discloses roughly $350 per
      case for med-mal chronologies rather than a general platform list price. That makes the
      commercial surface legible enough to map the revenue model, but not enough to infer realized
      ASP, discounting, contract minimums, or revenue-recognition policy. The breadth of modules
      across intake, drafting, discovery, and analytics also suggests that revenue may reflect a
      bundled enterprise workflow sale rather than a single-feature subscription.
    claimRefs: [CI004, CI005, CI006]
    tableRefs: [TI001, TI002]
  - id: traction-and-operating-leverage
    title: Public traction implies ROI, but not underwritten unit economics
    body: >-
      Eve's retained public evidence points to real workflow adoption and customer ROI narratives,
      but those signals are still proxies rather than audited economics. The company claimed 5x
      revenue growth in the eight months after its January 2025 financing, later claimed 450+
      firms and 200,000+ cases processed annually, and highlighted customer examples with sharply
      faster workflows or more case capacity. By 2026, public materials had moved to 1,000+ or
      1,200+ firms, which shows momentum but also introduces definition risk because the sources do
      not reconcile whether those figures refer to paying firms, active firms, or some broader
      installed-base measure. The result is a credible growth narrative without the ARR, retention,
      or margin detail needed for underwriting.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI013]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Disclosed funding is meaningful, but capital adequacy remains private
    body: >-
      The disclosed Series A and Series B rounds are large enough to explain continued product
      expansion and team build-out, and a current hiring page still emphasizes rapid growth. That
      said, public materials do not disclose current cash on hand, monthly burn, debt obligations,
      covenant pressure, or runway. The chapter can therefore say Eve has raised substantial
      capital and is still investing across product and legal/compliance functions, but it cannot
      say whether that capital is sufficient for the next twelve to eighteen months without finance
      room data. In underwriting terms, historic fundraising reduces near-term financing risk only
      partially; it does not clear the capital-adequacy question.
    claimRefs: [CI001, CI002, CI003, CI012, CI013, CI016]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      The strongest public financial read is that Eve has product breadth, category momentum, and
      enough disclosed capital to keep scaling, but the company still asks investors to trust a
      narrative more than a model. Revenue quality remains hard to score because published pricing
      is sparse, customer-count definitions drift upward without reconciliation, and the public
      record says nothing durable about gross margin, burn, or payback. Competitive intensity also
      matters: buyer proof-of-value requirements and adjacent workflow gaps could pressure both
      sales efficiency and expansion economics. Financial diligence should therefore focus on
      revenue mix, cohort quality, services burden, and cash runway before using the unicorn
      financing headline as evidence of durability.
    claimRefs: [CI010, CI012, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and monetization evidence
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Core Eve platform
        - Quote-based workflow platform sold through demos
        - Contract / account
        - Public list price not disclosed
        - Third-party reviews describe pricing motion, but not realized contracts
        - Provide price book, minimum contract term, and realized discount ranges
      - - Med-mal chronologies
        - Publicly disclosed workflow-specific charge
        - Per case
        - Roughly $350 per case on files up to 40,000 pages
        - One public price point; unclear how representative it is of mix
        - Break out chronology revenue share, attach rate, and gross margin
      - - Intake, discovery, and analytics modules
        - Likely bundled into the broader platform sale
        - Module / bundle
        - Monetization structure not publicly disclosed
        - Feature availability is public; standalone commercial terms are not
        - Clarify whether these modules are bundled, seat-based, or usage-based
      - - Client transformation / deployment support
        - Possible service component around rollout and workflow adoption
        - Implementation / service
        - No public pricing or revenue-separate disclosure found
        - Inferred from customer-transformation language, not directly monetization proof
        - Quantify implementation revenue, gross margin, and time-to-live burden
    notes: >-
      Public evidence mixes direct pricing, feature descriptions, and commercial inferences; null
      or undisclosed fields mean the retained sources did not publish contract terms or revenue mix.
    claimRefs: [CI004, CI005, CI006, CI011, CI012]
  - id: TI002
    title: Pricing and contract transparency
    columns:
      - Offer
      - Price / unit / contract
      - List vs. realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Full platform
        - Quote-based; demo-led sale
        - List pricing not public; realized pricing unknown
        - Unknown contract minimums, seat logic, implementation fees, and expansion terms
        - LlamaLab review and UseCarly alternatives page
      - - Med-mal chronologies
        - Roughly $350 per case for files up to 40,000 pages
        - Publicly disclosed example price, not confirmed realized average
        - Unknown volume discounts, overage logic, and attach rate
        - LlamaLab review
      - - Intake / analytics / discovery modules
        - Not separately priced in retained sources
        - No public list or realized price found
        - Unknown whether bundled, upsold, or usage-metered
        - Official product materials plus third-party reviews
      - - Enterprise contract structure
        - No public term sheet, MSA economics, or revenue-recognition detail found
        - Not observable from public materials
        - Unknown services content, cancellation rights, and multi-year exposure
        - Chapter-wide public-source gap
    notes: >-
      This table separates observed list-like disclosures from unknown realized pricing; the public
      record is too thin to infer discounts, net revenue retention, or revenue-recognition policy.
    claimRefs: [CI004, CI005, CI006, CI012]
  - id: TI003
    title: Public unit-economics proxies and diligence asks
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue growth
        - 5x revenue growth in eight months as of Jan 2025; 2X QoQ revenue growth on a 2026 job post
        - Low
        - Fast growth can support fundraising quality, but the periods and absolute base are undisclosed
        - Provide monthly revenue bridge with comparable periods and booked vs. realized revenue
      - - Customer scale
        - 450+ firms in Sep 2025; 1,000+ or 1,200+ firms in 2026 materials
        - Medium
        - Scale can proxy for distribution strength, but only if customer definitions are consistent
        - Reconcile paying firms, active firms, users, and dormant accounts by date
      - - Workflow ROI proxies
        - 200,000+ cases annually; some customers more than doubled case capacity; discovery work cut from up to 20 hours to 30-45 minutes in one case study
        - Medium
        - Productivity proof can support retention and expansion if it generalizes beyond reference customers
        - Provide cohort-level expansion, logo retention, and product adoption by module
      - - Gross margin / services intensity
        - Not publicly disclosed
        - Low
        - Margin path determines whether growth converts into durable software economics
        - Provide gross margin by product and by services / transformation component
      - - CAC, payback, burn, runway
        - Not publicly disclosed
        - Low
        - These are the gating inputs for financing dependency and next-round timing
        - Provide sales efficiency, cash balance, monthly burn, and debt / covenant schedule
    notes: >-
      Values combine company-claimed traction proxies with explicit nulls for missing private
      metrics; null here means the retained public sources do not support an underwriting-grade
      number.
    claimRefs: [CI007, CI008, CI009, CI010, CI012, CI013]
figures:
  - id: FI001
    title: Revenue model bridge from workflow adoption to monetization
    type: flow
    summary: >-
      Public evidence supports a sales-led, workflow-wide platform monetization path, but not the
      final conversion into disclosed gross profit or cash generation.
    data:
      nodes:
        - id: demo-sale
          label: Demo-led, quote-based sale
          note: Public reviews describe the main platform as quote-based and sold through demos.
        - id: deployment
          label: Workflow-wide deployment
          note: Intake, case development, discovery, and analytics sit inside one operating layer.
        - id: activity
          label: Case activity and module usage
          note: Public materials tie value to legal case volume, workflow automation, and firm operations.
        - id: roi
          label: Customer ROI narrative
          note: Retained sources cite faster drafting, higher capacity, and grow-with-less positioning.
        - id: revenue
          label: Revenue captured under private contract terms
          note: One public price exists for med-mal chronologies, but core platform realization is undisclosed.
        - id: gross-profit
          label: Gross profit and runway remain unverified
          note: Services mix, inference cost, cash burn, and current margins are not public.
      edges:
        - from: demo-sale
          to: deployment
          label: contract closes
        - from: deployment
          to: activity
          label: matters run on platform
        - from: activity
          to: roi
          label: productivity outcomes
        - from: roi
          to: revenue
          label: supports renewals / expansion
        - from: revenue
          to: gross-profit
          label: economics not disclosed
    approximationNotes: >-
      The bridge reflects public commercial logic rather than audited revenue-recognition or margin
      data; the last step is intentionally a diligence gap, not an implied measured conversion.
    claimRefs: [CI004, CI005, CI006, CI009, CI011, CI012, CI016]
callouts:
  - calloutType: risk
    title: Capital adequacy is still a diligence blocker
    body: >-
      Historic fundraising is substantial, but current cash balance, burn, debt, and runway remain
      private, so the next financing trigger cannot be underwritten from public evidence alone.
    claimRefs: [CI003, CI012, CI016]
  - calloutType: recommendation
    title: Highest-priority finance asks
    body: >-
      Request ARR bridge, gross margin by module and services, cohort retention and expansion,
      current cash and burn, and any debt or covenant schedule before using headline growth or
      valuation as underwriting evidence.
    claimRefs: [CI012, CI013, CI016]
