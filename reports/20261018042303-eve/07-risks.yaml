schemaVersion: "report-v2"
artifact: risks
slug: eve
runDate: 2026-10-18
company:
  name: Eve
chapter:
  number: 7
  title: Risks
  summary: >-
    Eve's most consequential public-evidence risks are a reported trade-secret dispute,
    professional-responsibility and client-data exposure inherent in legal AI, and operating
    dependencies on human review, complete source records, case-management systems, and external
    model providers. Company-issued controls reduce but do not eliminate those risks, while primary
    litigation records, incident history, performance service levels, and dependency concentration
    remain diligence gaps.
sections:
  - id: legal-regulatory-exposure
    title: Legal and regulatory exposure
    body: >-
      The clearest company-specific legal signal in the assigned evidence is Vantaige's report that
      EvenUp filed a federal trade-secret suit against Eve in September 2025 and alleged that a
      former employee downloaded more than 900 proprietary documents before joining Eve. That
      account is not a substitute for the docket, pleadings, or Eve's response, so liability,
      remedy exposure, and current procedural status remain unverified. Separately, Eve's Head of
      Legal posting says the company is building its legal function and explicitly names data
      handling, privilege, protective orders, commercial agreements, employment disputes, and
      trade-secret matters. The mandate is appropriately broad, but it also indicates that legal
      capacity is being scaled while these exposures are live.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: product-quality-and-client-data
    title: Product quality, supervision, and client-data risk
    body: >-
      Legal-workflow automation carries asymmetric error costs because a missed fact, faulty case
      assessment, or mishandled client record can affect representation. Eve states that it is SOC
      2 Type II certified, HIPAA compliant, does not train on client data, and queues agent work for
      attorney approval before it leaves a firm. Those are meaningful controls, not proof of
      error-free operation. Eve's own buyer guide says every legal AI makes mistakes, while
      Vantaige reports recurring speed complaints and mixed feedback on nuanced case evaluation.
      The investment case therefore depends on testable review controls, audit logs, incident
      response, and production service levels rather than certification labels alone.
    claimRefs: [CR005, CR006, CR007, CR008, CR015, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: operating-and-partner-dependencies
    title: Operating and partner dependencies
    body: >-
      Eve is an operating layer rather than a self-contained legal system. HelloCounsel reports
      that Eve Atlas runs alongside a firm's case-management system, and LlamaLab says Eve does not
      itself operate record retrieval, leaving output quality dependent on records the firm
      supplies. Eve's hiring material also says its teams collaborate directly with OpenAI and
      Anthropic. Together, those facts create integration, upstream-data, and model-provider
      dependencies whose concentration and fallback arrangements are not public. Competitor-authored
      comparisons also frame Eve as a platform-level purchase when many firms may need only one or
      two workflows, creating adoption, implementation, and renewal friction that should be tested
      against cohort retention and deployment-services intensity.
    claimRefs: [CR009, CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
  - id: residual-risk-and-kill-criteria
    title: Residual risk and investment kill criteria
    body: >-
      Public evidence supports mitigation activity but not a low-risk conclusion. Eve claims more
      than 1,000 plaintiff-firm customers, which increases the importance of reliable controls and
      repeatable deployment, yet the assigned evidence does not disclose incident frequency,
      uptime, model-provider concentration, renewal performance, or the cost of human review. The
      CallSphere allocation was successfully fetched but yielded only a title, so it cannot close
      any operational or safety question. Investment should pause if primary court records show
      material injunction or damages risk, if security diligence reveals undisclosed material
      incidents, if sampled outputs cannot meet agreed accuracy and approval thresholds, or if
      customer cohorts show that integration burden prevents durable production use.
    claimRefs: [CR013, CR014, CR015, CR016]
callouts:
  - calloutType: recommendation
    title: Diligence before underwriting residual risk
    body: >-
      Obtain the EvenUp docket and Eve's response, current SOC 2 report and incident log, model and
      CMS subprocessor map, production uptime and latency history, sampled error and override rates,
      and customer cohorts segmented by implementation depth. Treat certifications and claimed
      attorney review as controls to test, not substitutes for operating evidence.
    claimRefs: [CR001, CR004, CR005, CR007, CR009, CR010, CR011]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk or rule
      - Jurisdiction or scope
      - Public status and likelihood
      - Impact severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Trade-secret litigation
        - U.S. federal court, Northern District of California
        - Third-party review reports a September 2025 filing and says the case is ongoing; current docket status unverified
        - High if claims threaten hiring, product development, damages, or injunctions
        - Not established in the assigned public evidence
        - High pending primary-record review
        - Pull Case 4:25-cv-08199 docket, complaint, answer, motions, discovery orders, insurance notices, and counsel assessment
      - - Client confidentiality, health data, and privilege
        - U.S. legal services and sensitive medical records
        - Continuous exposure inherent in processing plaintiff case files
        - High because mishandling can harm clients and firm obligations
        - Company claims SOC 2 Type II, HIPAA compliance, no client-data training, and attorney approval
        - Medium-high until control operation and incident history are tested
        - Review SOC 2 exceptions, BAA and DPA terms, retention and deletion controls, subprocessors, privilege architecture, and incident log
      - - AI supervision and professional responsibility
        - Lawyer duties vary by jurisdiction and use case
        - Continuous; competitor analysis cites competence, confidentiality, communication, supervision, candor, and reasonable-fee duties
        - High for client-facing or court-bound output
        - Company says work is queued for attorney review before leaving the firm
        - Medium because approval quality and override behavior are undisclosed
        - Test approval gates, auditability, source traceability, escalation, unauthorized-action prevention, and fee disclosures on production samples
      - - Legal-function scaling
        - Commercial, product, compliance, and employment matters
        - Company-issued job content says a Head of Legal will build and own the function from the ground up
        - Medium-high during rapid growth and contracting expansion
        - Dedicated senior legal leadership is being sought
        - Medium until staffing, outside-counsel coverage, and decision rights are confirmed
        - Confirm role fill, team capacity, outside-counsel panel, board reporting, dispute inventory, and approval matrices
    notes: >-
      Partial register based only on the assigned prefetched public evidence as of 2026-10-18;
      likelihood and severity are evidence-linked analyst assessments, not legal conclusions, and
      primary court, regulator, insurance, and incident records were not present in the pool.
    enumerationScope:
      coverage: partial
      basis: >-
        Public legal and compliance exposures identifiable in the assigned eight-source pool through
        2026-10-18; private disputes and nonpublic incidents are not enumerated.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR008]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Evidence and mitigation maturity
      - Residual exposure
      - Monitor or kill criterion
    rows:
      - - Incomplete source records produce incomplete chronologies, audits, or case recommendations
        - Medium-high where record retrieval is fragmented
        - High
        - LlamaLab says Eve works from firm-supplied records and does not operate retrieval; control is process-dependent
        - High until completeness is measured
        - Track requested-versus-received records, missing-provider detection, late-arriving facts, and output changes after record completion
      - - Generated work contains factual, legal, or case-evaluation errors
        - Expected to occur sometimes; frequency not disclosed
        - High
        - Eve acknowledges legal AI mistakes and claims attorney approval; Vantaige reports mixed case-evaluation feedback
        - Medium-high without sampled error and override rates
        - Pause expansion if blinded review misses material facts or unsupported assertions above the firm's agreed tolerance
      - - Latency or throughput degrades under concurrent demand
        - Unknown; one third-party review reports recurring G2 speed complaints
        - Medium-high during deadlines
        - No service-level or capacity mitigation was disclosed in the assigned evidence
        - High evidence gap
        - Require p50, p95, and p99 latency, availability, queue-depth, and deadline-period incident history by workload
      - - Broad deployment creates shelfware, workflow disruption, or excess services burden
        - Medium because competitors describe Eve as a platform decision rather than a point tool
        - Medium-high
        - CMS coexistence is described, but implementation effort and deployment-services intensity are undisclosed
        - Medium-high
        - Track time to production, weekly active users, active matters per customer, services hours, cohort retention, and module adoption
    notes: >-
      Qualitative likelihood and severity preserve the source limitations; no public incident rate,
      service-level history, sampled error rate, or deployment cohort data was available in the
      assigned pool.
    claimRefs: [CR007, CR008, CR009, CR010, CR012, CR015, CR016]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or system
      - Public concentration evidence
      - Failure scenario
      - Severity
      - Mitigation evidence
      - Residual exposure and diligence
    rows:
      - - Foundation-model capability and policy
        - OpenAI and Anthropic are named in company-issued hiring content
        - Workload split, contract terms, portability, and fallback capacity are undisclosed
        - Model change, outage, pricing shift, or policy restriction degrades product quality or economics
        - High
        - Two named model relationships suggest some supplier breadth but do not prove failover
        - Medium-high; obtain spend mix, routing logic, evaluation parity, fallback tests, and termination rights
      - - Case-management-system data and write-back
        - Customer CMS platforms
        - HelloCounsel says Eve Atlas runs alongside rather than replaces the CMS
        - Schema, permission, or synchronization failure produces stale or incorrect matter context
        - High
        - Side-by-side architecture is publicly described
        - High; test supported integrations, field-level write-back, reconciliation, permissions, and rollback
      - - Upstream medical-record retrieval and completeness
        - Law firms, facilities, and retrieval vendors
        - LlamaLab says Eve does not operate the retrieval service
        - Missing or late records undermine chronology, audit, and case-assessment outputs
        - High
        - Eve agents may assist with chasing records, but operating responsibility remains external
        - High; audit retrieval partners, completeness controls, turnaround distribution, and missing-provider discovery
      - - Customer adoption of a broad operating layer
        - Firm leadership, attorneys, and legal operations teams
        - Eve claims more than 1,000 firms, but production depth and renewal cohorts are not disclosed
        - Buyers procure excessive scope, integrations stall, or users revert to legacy workflows
        - Medium-high
        - Broad product scope and attorney-review workflow are described
        - Medium-high; require gross and net retention, active-matter cohorts, module adoption, implementation cost, and reasons for churn
    notes: >-
      Public materials identify dependencies but do not disclose concentration, service levels,
      contract protections, fallback capacity, or customer production-depth cohorts; unsupported
      quantities remain gaps rather than estimates.
    claimRefs: [CR007, CR009, CR010, CR011, CR012, CR013]
figures:
  - id: FR001
    title: Evidence-weighted residual risk heatmap
    type: matrix
    summary: >-
      Qualitative matrix separates source-indicated impact from the maturity of publicly described
      mitigations; it is not a frequency model.
    data:
      columns:
        - label: Evidence-indicated impact
          detail: Consequence if the source-linked failure occurs
        - label: Public mitigation maturity
          detail: Strength of mitigation visible in the assigned evidence
        - label: Residual diligence rating
          detail: Remaining exposure after disclosed controls and evidence gaps
      rows:
        - label: Trade-secret litigation
          note: Primary docket and company response were not in the assigned pool
          values:
            - label: High
              note: Potential product, hiring, damages, or injunction exposure
            - label: Unverified
              note: No company mitigation found in the assigned evidence
            - label: High
              note: Requires primary-record review
        - label: Client data and privilege
          values:
            - label: High
              note: Sensitive legal and medical records
            - label: Partly documented
              note: SOC 2 Type II, HIPAA, and no-training claims
            - label: Medium-high
              note: Control operation and incident history remain private
        - label: Output accuracy and supervision
          values:
            - label: High
              note: Errors can affect representation
            - label: Partly documented
              note: Attorney review is described
            - label: Medium-high
              note: Error and override rates are undisclosed
        - label: Record and CMS completeness
          values:
            - label: High
              note: Output depends on complete case context
            - label: Process-dependent
              note: Retrieval is external and CMS coexistence is required
            - label: High
              note: Integration and completeness metrics are missing
        - label: Model-provider dependency
          values:
            - label: Medium-high
              note: Upstream changes can affect quality, availability, and economics
            - label: Partly documented
              note: OpenAI and Anthropic are both named
            - label: Medium-high
              note: Routing, concentration, and failover are undisclosed
        - label: Legal-function scale-up
          values:
            - label: Medium-high
              note: Broad remit during rapid company growth
            - label: In build-out
              note: Head of Legal role is described as building the function
            - label: Medium
              note: Staffing and governance evidence is needed
    approximationNotes: >-
      Ratings are qualitative analyst judgments tied to cited source signals and explicit gaps; they
      do not estimate incident probabilities or legal outcomes.
    claimRefs: [CR001, CR004, CR005, CR007, CR009, CR010, CR011, CR015, CR016]
