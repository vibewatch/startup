      - number: '3.3'
        title: Eve 的护城河是广度加信任姿态，但市场仍可围绕瓶颈拆分采购
        blocks:
          - type: paragraph
            body: >-
              公开证据表明，当原告律所想用一个操作层覆盖获客、案件处理和报告时，Eve 确有战略优势；公司还以 SOC 2、HIPAA
              定位、多语言获客以及法律/合规招聘来强化信任姿态。但同一批来源也清楚指出了替代风险。竞品和评测页面反复称，律所往往只有一个紧迫问题：索赔材料质量、医疗记录分析、记录提取或行政处理能力。如果这一判断正确，购买平台就会带来闲置软件风险。记录提取这个相邻类别最能说明问题：LlamaLab
              明确称 Eve 不提供提取服务，而是在律所已有记录后才开始工作，上游预算仍可留给其他供应商。公开规模信号健康但仍有噪声：从公司控制的 2026 年发布中的 900 家律所，变为之后公开页面的 1,000+ 和
              1,200+，因此买方可以判断 Eve 增长很快，却无法得到完全可比的采用分母。
            claimRefs:
              - CP002
              - CP009
