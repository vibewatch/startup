  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：原告律所工作流软件，而非通用法律 AI
        blocks:
          - type: paragraph
            body: >-
              证据池中最强的边界信号，是各来源都稳定地将 Eve 描述为原告方专用产品，而非通用法律研究或企业法律产品。AI Agent Index 称 Eve“仅为原告律所打造”，并列出从获客到诉讼的工作流；Eve
              自己的分类指南也将其置于原告律所细分市场，而非广泛法律研究、合同或电子取证工具之列。第三方对比反复采用同一框架：希望用一个操作层覆盖获客、时间线、起草、取证、沟通和分析的原告业务，会把 Eve 作为平台选择。

              这一边界决定了哪些支出应计入或排除。计入的似乎是解决原告律所执行瓶颈的软件预算：获客转化、记录审阅、时间线和索赔材料生成、取证、在真实案件中的法律研究，以及律所层面的运营可视性。排除或仅相邻的支出包括广泛的企业法律
              AI、独立研究订阅、被告方诉讼工具和上游记录提取服务。换言之，Eve 的相关市场比“法律 AI”更窄，却比任何单点方案更宽，这也是各类比较持续将购买描述为平台决策，而不是逐项工具替换的原因。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
