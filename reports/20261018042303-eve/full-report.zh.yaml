      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 是平台决策，而不只是功能采购
            body: 证据池中的材料都将 Eve 销售和评测为把多个工作流预算打包在一起的原告律所操作层，因此相邻单点方案仍是最清晰的替代品。
            calloutType: insight
