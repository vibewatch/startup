    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品范围
        blocks:
          - type: paragraph
            body: >-
              Eve 将 EveOS 呈现为服务原告律师的操作层，而非独立的起草工具。当前公司页面称其覆盖律所数据、案件执行、审计和分析；2026 年 1 月的发布则以 Agents、Auditor 和 Analyst
              三类角色组织产品。其狭窄的业务聚焦具有战略意义：第三方和公司材料都确认 Eve
              为原告方业务打造，而非服务被告方或交易业务。因此，该模型试图覆盖原告案件全生命周期，但现有证据主要来自公司，尚未独立验证其承诺的运营效果。
