      - number: '3.2'
        title: 买方在广度、迁移摩擦、价格不透明和集成便利之间取舍
        blocks:
          - type: paragraph
            body: >-
              Eve 最宽的竞争优势，是在一个原告方专用平台内覆盖获客、时间线、索赔材料起草、取证和律所分析；但同样的广度也让采购更像平台决策，而非低风险切入。留存公开来源一致称 Eve
              仅按报价销售，而比较页面给数个更窄工具披露了大致价格区间：ProPlaintiff 约为每用户 $99-$249，Supio 约 $150-$400，EvenUp 约 $200-$500，Clio AI 工具约
              $90-$150，CaseMark 可免费起步，Carly 代理为每月 $35 起。这种反差让单点工具在律所只想自动生成索赔材料、处理医疗记录或跟进事务时更容易完成首次销售。原生 CMS
              的替代品进一步强化这一点：Clio Duo 不需要第二套系统，Filevine 和 Litify 则允许律所把 AI 留在现有事实记录系统中，或将 CMS 迁移作为主要决策。Eve 以接入
              Filevine、Litify、CASEpeer、SmartAdvocate 和其他原告系统部分回应了这一点，降低了近期切换成本，但没有消除更大的预算决策。
            claimRefs:
