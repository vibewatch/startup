  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 原告 AI 竞争按待完成任务分层，而非单一功能竞赛
        blocks:
          - type: paragraph
            body: >-
              留存证据并未显示一个统一的“法律 AI”买方群体。相反，原告方市场聚集为直接单点工具、全生命周期平台和既有工作流系统。EvenUp 反复被描述为专注但深入的和解估值、索赔材料和 MedChrons
              方案；Supio 的优势集中在医疗记录和文档智能；Anytime AI 被定位为复杂原告诉讼的深度案件分析方案；Clio Duo、Filevine 和 Litify 之所以重要，是因为它们把 AI
              留在律所已经使用的记录系统中。Eve 自己的分类框架又将 Harvey、Lexis+ Protégé、CoCounsel、Luminance、Everlaw、Lex Machina 和 Spellbook
              放入研究、合同、电子取证和诉讼分析等相邻类别。因此，现状替代品往往根本不是单一竞品，而是既有 CMS
              再叠加一两个单点工具。当前证据池没有关于真正内部自建进入者的有力公开证据，因此定制工作流组装在理论上是买方替代方案，但在本章只是证据缺口，而非留存的竞争事实。
            claimRefs:
