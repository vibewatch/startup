  - id: FM001
    title: Eve 公开切入点周边的观测市场层级
    type: pyramid
    summary: 公开证据将 Eve 的相关市场从广义法律 AI 收窄至原告律所运营层切入点，且采用代理指标只出现在层级底部。
    data:
      items:
        - label: 广义法律 AI 软件
          value: research / contracts / ediscovery / analytics
          note: 公开对比指南展示的范围远大于 Eve 的实际目标市场。
          tone: neutral
        - label: 原告法律专用 AI
          value: personal injury / mass tort / plaintiff workflows
          note: 多个来源将 Eve 描述为仅面向原告方，而非跨执业领域法律 AI。
          tone: neutral
        - label: 全生命周期原告平台
          value: intake → casework → discovery → research
          note: Eve 一再被定位为全生命周期工作流平台，而非单点工具。
          tone: opportunity
        - label: 运营层扩展
          value: communications, analytics, CMS complement
          note: Atlas、Analyst 和沟通智能代理将切入点扩展到起草之外。
          tone: opportunity
        - label: 公开装机基数声称
          value: 1,000+ to 1,400+ firms
          note: 2026 年客户数量声称显示出牵引力，但方法未得到协调。
          tone: warning
        - label: 观测工作负载代理
          value: 200,000+ active cases / matters
          note: 有用的采用证据，但不是以美元计的 TAM、SAM 或 SOM。
          tone: warning
    approximationNotes: 分层是基于来源支持的品类范围作出的概念性归纳；只有底部两层含有明确的公开数量。
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM011
      - CM012
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 根据保留的公开证据进行序数映射，Eve 在工作流广度上最突出，而 EvenUp、Supio 和 Anytime 在更窄的原告案件工作上更深入。
    data:
      xAxis:
        label: 工作流广度（1=窄单点工具，5=律所运营层）
      yAxis:
        label: 原告案件工作深度（1=浅，5=深）
      points:
        - label: Eve
          x: 5
          'y': 4
          detail: 在接案、案件工作、证据开示和分析上的保留范围最广。
        - label: EvenUp
          x: 2
          'y': 5
          detail: 在和解估值和索赔材料包上的保留重点最深。
        - label: Supio
          x: 2
          'y': 4
          detail: 以文档为主的智能能力，以及连接 CMS 的原告方工作流。
        - label: Anytime AI
          x: 3
          'y': 4
          detail: 原告案件深度较高，但保留的全所运营覆盖证据较少。
        - label: Clio Duo
          x: 4
          'y': 2
          detail: 因嵌入现有 CMS 而覆盖广，但保留的案件工作深度较浅。
        - label: Filevine / Litify
          x: 4
          'y': 3
          detail: 借助记录系统和运营控制形成杠杆，AI 范围取决于 CMS 决策。
    approximationNotes: 坐标是对保留公开描述的序数综合，而非经审计的基准；它比较相对工作流广度和原告案件工作深度，不代表市场份额或测得的产品质量。
    claimRefs:
      - CP001
      - CP004
      - CP005
      - CP006
      - CP007
      - CP010
  - id: FI001
    title: 从工作流采用到变现的收入模型桥接
    type: flow
    summary: 公开证据支持以销售驱动、覆盖全工作流的平台变现路径，但尚不足以证明最终转化为已披露的毛利或现金创造。
    data:
      nodes:
        - id: demo-sale
          label: 演示驱动、报价制销售
          note: 公开评测将主平台描述为报价制，并通过演示销售。
        - id: deployment
          label: 覆盖全工作流的部署
          note: 接案、案件开发、证据开示和分析位于同一运营层内。
        - id: activity
          label: 案件活动与模块使用
          note: 公开材料将价值与法律案件量、工作流自动化和律所运营联系起来。
        - id: roi
          label: 客户 ROI 叙事
          note: 保留来源提到更快起草、更高产能以及以更少资源扩大规模的定位。
        - id: revenue
          label: 按私人合同条款确认的收入
          note: 医疗过失案件时间线有一个公开价格，但核心平台实现收入未披露。
        - id: gross-profit
          label: 毛利和资金续航仍未验证
          note: 服务收入结构、推理成本、现金消耗和当前利润率均未公开。
      edges:
        - from: demo-sale
          to: deployment
          label: 合同签订
        - from: deployment
          to: activity
          label: 案件在平台上运行
        - from: activity
          to: roi
          label: 生产力结果
        - from: roi
          to: revenue
          label: 支持续约 / 扩张
        - from: revenue
          to: gross-profit
          label: 经济性未披露
    approximationNotes: 该桥接反映公开商业逻辑，而非经审计的收入确认或利润率数据；最后一步刻意保留为尽调缺口，不暗示已测得的转化率。
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI009
      - CI011
      - CI012
      - CI016
  - id: FE001
    title: EveOS 产品架构图
    type: stack
    summary: 指定证据将 Eve 描述为分层的原告律所运营栈，核心包括接案、结构化案件数据、执行智能代理、研究、分析和律师审批。
    data:
      layers:
        - label: 接案捕获
          detail: Jenny 被定位为始终在线的入口，在案件进入工作流前筛选并签署合格委托。
          modules:
            - label: 24/7 语音接案
            - label: 28 种语言通话处理
            - label: 委托书签署
        - label: 结构化案件记录
          detail: Atlas 被描述为自我更新的案件文件，将现有工具的输入标准化为可移植的实时记录。
          modules:
            - label: 案件数据标准化
            - label: 医疗记录提取
            - label: 跨系统可移植性
        - label: 案件执行智能代理
          detail: 起草和沟通智能代理推动接案、诉前和诉讼任务中的运营工作。
          modules:
            - label: 索赔函 / 诉状起草
            - label: 证据开示起草
            - label: 客户与记录跟进
        - label: 研究层
          detail: Eve Research 在更广泛的工作流中增加判例检索和引文链接。
          modules:
            - label: 多司法辖区判决意见
            - label: 与引文链接的来源段落
        - label: 投资组合智能
          detail: Analyst 被定位为报告层，用于回答关于收入节奏、律师表现和案件分布的通俗问题。
          modules:
            - label: 自然语言仪表盘
            - label: 业务分析
        - label: 人工控制点
          detail: 公开描述称，工作在离开律所前会由律师审核，这限制了端到端自主化的说法。
          outputs:
            - label: Attorney approval gate
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE009
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Eve 的公开采用叙事从原告律所接案扩展到案件执行、夜间审核和律所级分析。
    data:
      items:
        - label: 初始线索捕获
          actor: 接案人员和潜在客户
          phase: 漏斗顶部采用
          touchpoints:
            - 24/7 AI 接案和线索评分
            - 多语种来电处理
          note: 公开证据对接案和筛选工作流的支持最强。
          tone: positive
        - label: 资格确认与签署
          actor: 接案团队、律师和潜在客户
          phase: 早期案件转化
          touchpoints:
            - 案件资格确认
            - 随时客户签署
          note: Frontier Law Center 的指标表明，这一阶段可能影响转化率和平均案件价值。
          tone: positive
        - label: 记录摄取与时间线
          actor: 律师和案件团队
          phase: 核心案件开发
          touchpoints:
            - 医疗摘要
            - 时间线
            - 损害背景
          note: 多个来源称 Eve 从律所提供的记录开始，而不是自行运行调取。
          tone: neutral
        - label: 起草与证据开示执行
          actor: 律师和法律工作人员
          phase: 案件中期工作流
          touchpoints:
            - 索赔函
            - 证据开示回应
            - 诉状起草
          note: 官方成果聚焦吞吐量，而非合同或续约证据。
          tone: positive
        - label: 夜间审计与遗漏价值发现
          actor: 律师和审核人员
          phase: 账户内价值扩张
          touchpoints:
            - AI Auditor 夜间审核
            - 遗漏伤情和大规模侵权发现
          note: 这是超越单一起草工具的关键扩张面。
          tone: positive
        - label: 投资组合分析与沟通
          actor: 律所管理层和运营团队
          phase: 全所扩张
          touchpoints:
            - 律所分析
            - 客户与记录沟通
            - 跨案件智能
          note: 公开来源支持其广度，但没有量化席位扩张或留存 ARR。
          tone: neutral
    approximationNotes: 顺序反映指定公开来源描述的主要采用面，并非每位客户经审计的实施顺序。
    claimRefs:
      - CU003
      - CU008
      - CU012
      - CU014
  - id: FR001
    title: 按证据加权的剩余风险热力图
    type: matrix
    summary: 定性矩阵将来源指示的影响与公开描述的缓释措施成熟度分开；它不是频率模型。
    data:
      columns:
        - label: 证据指示的影响
          detail: 来源所述失效发生时的后果
        - label: 公开缓释成熟度
          detail: 指定证据中可见的缓释措施强度
        - label: 剩余尽调评级
          detail: 已披露控制措施和证据缺口之后的剩余风险
      rows:
        - label: 商业秘密诉讼
          note: 指定资料池中没有主要案卷和公司回应
          values:
            - label: 高
              note: 可能面临产品、招聘、损害赔偿或禁令风险
            - label: 未验证
              note: 指定证据中未找到公司的缓释措施
            - label: 高
              note: 需要审查一手记录
        - label: 客户数据与律师特权
          values:
            - label: 高
              note: 敏感的法律和医疗记录
            - label: 部分有记录
              note: SOC 2 Type II、HIPAA 以及不用于训练的声明
            - label: 中高
              note: 控制措施运行情况和事故历史仍属非公开信息
        - label: 输出准确性与监督
          values:
            - label: 高
              note: 错误可能影响代理工作
            - label: 部分有记录
              note: 已描述律师审核
            - label: 中高
              note: 错误率和覆盖率未披露
        - label: 记录与 CMS 完整性
          values:
            - label: 高
              note: 输出依赖完整的案件上下文
            - label: 取决于流程
              note: 调取由外部负责，且必须与 CMS 共存
            - label: 高
              note: 缺少集成和完整性指标
        - label: 模型供应商依赖
          values:
            - label: 中高
              note: 上游变化可能影响质量、可用性和经济性
            - label: 部分有记录
              note: OpenAI 和 Anthropic 均被提及
            - label: 中高
              note: 路由、集中度和故障切换能力未披露
        - label: 法务职能扩张
          values:
            - label: 中高
              note: 公司快速增长期间职责范围广
            - label: 正在搭建
              note: Head of Legal 职位被描述为负责搭建该职能
            - label: 中
              note: 仍需补充人员配置和治理证据
    approximationNotes: 评级是基于引用来源信号和明确证据缺口作出的定性分析判断；不用于估算事件发生概率或法律结果。
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR007
      - CR009
      - CR010
      - CR011
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 只有当产品和采用情况的证明跑赢当前在收入质量和资本结构条款上的证据缺口时，投资判断才会改善。
    data:
      nodes:
        - id: fit
          label: 原告工作流匹配度
          detail: 广泛的工作流覆盖显示出真实的产品市场信号。
          claimRefs:
            - CV008
            - CV010
        - id: funding
          label: 顶级融资支持
          detail: A 轮和 B 轮融资显示出资方持续关注。
          claimRefs:
            - CV001
            - CV004
        - id: traction
          label: 采用情况的口径总体强劲
          detail: 企业数量口径明显上升，但定义各不相同。
          claimRefs:
            - CV005
            - CV006
            - CV012
        - id: gaps
          label: 核心投资判断数据缺失
          detail: ARR、NRR、毛利率和股权结构细节均未公开。
          claimRefs:
            - CV007
            - CV011
        - id: discipline
          label: 需要严守价格纪律
          detail: 在经济性得到验证前，不要按公开标价买入。
          claimRefs:
            - CV013
            - CV014
        - id: call
          label: 建议：research-more
          detail: 密切跟踪，但只有在获得硬核尽调证据或更优条款后才上调判断。
          claimRefs:
            - CV013
            - CV014
      edges:
        - from: fit
          to: funding
          label: 支持
        - from: funding
          to: traction
          label: 放大
        - from: traction
          to: gaps
          label: 仍留下
        - from: gaps
          to: discipline
          label: 迫使
        - from: discipline
          to: call
          label: 导向
    approximationNotes: 基于来源因素综合出的定性决策流程；不是量化估值桥接。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
