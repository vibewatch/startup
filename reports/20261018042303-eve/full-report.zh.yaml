      - number: '2.2'
        title: 市场规模与采用：势头可见，但公开 TAM 证据仍依赖代理指标
        blocks:
          - type: paragraph
            body: >-
              证据池没有关于原告方法律 AI 的清晰、独立美元市场研究，因此市场规模只能依靠有边界的采用代理指标，而不是单一的 headline TAM。这些代理指标有意义但并不完美。Eve 2026 年 9
              月的客户里程碑文章称，超过 1,000 家原告律所用该平台管理案件，平台支持超过 200,000 个活跃案件。独立及相邻来源给出更高数字——评测类报道称 1,200+ 家律所，LawNext 2026 年 6
              月发布报道称 1,400+ 家律所及 200,000+ 个活跃案件——这支持该品类真实且在增长，但也说明公开客户数口径尚未统一。

              因此，市场规模只能从多个不完整视角交叉估算：已安装律所数、活跃案件数、业务领域广度，以及投资者愿意以独角兽估值为该品类融资的程度。这足以表明，至少对市场中有意义的一部分而言，原告律所工作流 AI
              已从试验走向预算化基础设施。但这不足以用美元为 TAM、SAM 或 SOM 做出精确论证，因为公开定价按报价执行，指定来源也没有收入、平均合同金额或转化分母，无法把律所数量代理值干净地换算成支出。
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM011
      - number: '2.3'
        title: 买方图谱、采用驱动因素与变现约束
        blocks:
          - type: paragraph
            body: >-
              律所内的买方似乎是管理层或运营负责人，但用户范围更广。公开产品描述覆盖获客团队、案件经理、律师和律所领导层：获客代理负责线索捕获和签约，工作流代理起草和审阅案件工作，沟通代理自动处理日常跟进，Analyst
              则明确围绕盈利能力、案件分配和收入节奏等领导层问题展开。这使 Eve 更像必须同时通过法律工作流和业务运营审查的操作系统销售，而非按席位购买的研究产品。

              各来源列出的采用驱动因素一致：每名律师处理更多案件、更快结案、减少人工跟进，以及更好地看清碎片化的原告律所技术栈。约束也同样一致。Eve 仍依赖与现有案件管理和沟通系统集成；市场叙事加速时，部分 2026
              年操作系统模块仍处于 beta；当律所只需解决一个瓶颈时，相邻供应商也能有理地推动更窄的采购。公开证据还没有回答：所引客户数是否完全可比，有多少业务已深度部署并付费，以及 Eve
              每家律所拿到多少钱包份额。这些约束并未否定市场机会，但确实限制了将公开采用势头转化为估值支撑时的信心。
            claimRefs:
