              公开证据支持公司在进行缓释活动，但不足以得出低风险结论。Eve 声称拥有超过 1,000
              家原告律所客户，这提高了可靠控制和可重复部署的重要性；但指定证据没有披露事件频率、正常运行时间、模型供应商集中度、续约表现或人工复核成本。CallSphere
              的材料抓取成功，却只有一个标题，因此无法解决任何运营或安全问题。如果一手法院记录显示存在重大禁令或损害赔偿风险，安全尽调发现未披露的重大事件，抽样输出达不到约定的准确率和审批阈值，或客户群显示集成负担阻碍持久生产使用，投资就应暂停。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 在评估残余风险前先做尽调
            body: >-
              获取 EvenUp 案卷及 Eve 的回应、当前 SOC 2 报告和事件日志、模型与 CMS
              子处理方图谱、生产正常运行时间和延迟历史、抽样错误率和人工覆盖率，以及按实施深度拆分的客户群。应把认证和所称律师复核视为待检验的控制，而非运营证据的替代品。
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR007
              - CR009
              - CR010
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据支持这是一家真实公司，而不是一个概念。Eve 披露 2025 年 1 月 $47 million 的 A 轮融资；合作伙伴材料之后称其完成 $103 million 的 B 轮，估值超过 $1
              billion；第三方及产品材料也一致将其描述为原告专用工作流平台，而不是单功能法律 copilot。问题在于如何判断价格，而不是公司是否存在。指定证据池中的公开来源没有披露付费
              ARR、净收入留存、毛利率或服务强度，定价本身也按报价执行且不透明。这一组合支持“继续研究”的建议和偏贵的估值判断：势头足以保持关注，但收入质量证据不足以激进追逐上一轮私人估值。
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV007
              - CV011
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              正向论点是，Eve 似乎找到了清晰切入点：原告律所需要覆盖获客、记录审阅、起草和案件管理的自动化，即便竞品撰写的比较也称 Eve
              在该工作流内异常宽泛。客户和合作伙伴声音进一步表明律所正在用产品扩大产出，LawNext 也显示 2025
              年融资周期后产品仍持续发布。反向论点同样重要。最强的采用证据有很多来自公司、合作伙伴或客户；不同时间和语境下客户数从 450+ 变为 1,000+ 和
              1,200+；不利及竞争来源持续强调平台成本、迁移负担和缺少记录提取能力。这些摩擦使投资论点高度依赖留存、回收期和部署深度的证明。
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 情景框架
        blocks:
          - type: paragraph
            body: >-
              乐观情景是，Eve 将原告工作流 AI 的品类领导地位转化为持久的多产品扩张：B
              轮资本推动产品广度，公司把声称的律所数量转化成更深的钱包份额，之后战略收购方或公开市场会奖励其成为原告律所运营中的控制点。基准情景没那么戏剧化：Eve 仍是重要的垂直赢家，但 2025
              年独角兽价格大部分提前透支未来上行空间，只有在隐藏的收入质量极佳时才能兑现。悲观情景很直接：如果公开采用主张夸大了付费深度，如果 onboarding 和定价摩擦拖慢扩张，或如果法律 AI 倍数在 Eve
              证明利润率和留存前收缩，下一轮融资可能低于 headline 估值重置。因此，这里的下行触发因素比上行故事更重要。
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV009
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV009
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: 退出准备度与尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出准备度看似可行，但尚未得到公开投资判断支持。公司显然知道如何吸引顶级资本并持续发布产品，但指定公开证据没有披露董事会控制权、优先股堆叠、二级交易组成或审计运营指标。因此下一步尽调不是继续讲故事，而是取得文件级证明：当前
              ARR、客户群留存、扣除实施成本后的毛利率、已声称客户中的部署结构，以及准确融资条款。在这套材料出现之前，最稳妥的进入纪律是把公司留在主动跟踪名单，不以独角兽 headline
              为锚，并要求更强的内部证据或更好的价格，再升级为类似买入的姿态。
            claimRefs:
              - CV003
              - CV007
              - CV011
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 为什么结论还不到买入
            body: Eve 仍可能成为原告律所工作流的控制点，但当前公开材料更能证明市场热情，而非软件经济性。没有经过核实的 ARR、留存、利润率和融资条款细节，审慎做法是继续开放尽调，而不是为上一轮价格勉强追价。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV007
              - CV011
              - CV013
              - CV014
