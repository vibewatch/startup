        - Core monetizable layer for Go1
      - - Practice-based / AI-guided extensions
        - AI tutors, labs, simulations, role-based skill practice, partner content
        - General-purpose productivity tools without learning workflows
        - L&D, technical enablement, GTM enablement
        - Expansion vector via partners such as Decidr and CodeSignal
    notes: >-
      The boundary narrows from all training spend to the external content and discovery layer that Go1 can actually
      monetize. Broad TAM and core Go1 SAM should not be treated as the same market.
