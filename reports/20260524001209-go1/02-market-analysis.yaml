  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment / use case
      - Primary buyer
      - Primary user
      - Budget owner
      - Workflow / proof point
      - Adoption trigger
      - Go1 fit
    rows:
      - - Enterprise L&D transformation
        - Head of L&D / CLO
        - Employees and managers
        - CHRO / people budget
        - Catalog breadth, completion, skills pathways, multilingual reach
        - Need to scale upskilling without building content internally
        - Strong fit because Go1 plugs into existing stack with broad content access
      - - AI governance and responsible-use training
        - Compliance manager plus L&D
        - All employees using AI-enabled tools
        - Compliance or enterprise-risk budget with executive sponsorship
        - Approved-tool guardrails, privacy reinforcement, board reporting
        - Shadow-AI risk and need for policy-backed adoption
        - Strong fit because Go1 markets governance, analytics, and approved-use training
      - - HR / onboarding and culture programs
        - HR manager
        - New hires and people managers
        - HR / people-operations budget
        - Role-specific onboarding, policies, soft skills
        - Rising retention pressure and need for consistent employee experience
        - Good fit when content breadth matters more than bespoke authoring
      - - Frontline or distributed workforce enablement
        - Operations L&D leader
        - Frontline employees
        - Business-unit and L&D budgets
        - Mobile learning, multilingual content, short modules
        - Hybrid or distributed operating model with limited classroom time
        - Good fit because digital delivery scales better than local facilitation
      - - Technical / GTM skill acceleration
        - Revenue enablement or technical enablement leader
        - Sales, support, customer success, engineers
        - Functional enablement budget
        - Practice-based skill labs, AI tutors, role-based playlists
        - Faster product cycles and AI-skill inflation
        - Expanding fit via CodeSignal and partner-led practice content
      - - Consolidated learning stack buyer
        - HRIT / procurement with CHRO and CFO
        - Learning admins plus multiple audiences
        - Central enterprise-software budget
        - One dashboard, one contract, integrated analytics across employee, partner, and compliance use cases
        - Vendor-sprawl reduction and ROI scrutiny
        - "Mixed fit: Go1 wins as the content layer if integration is easier than suite replacement"
    notes: >-
      Buyer roles are synthesized from Go1's own role-based pages, partner announcements, and industry spend data showing
      that large enterprises dominate current digital-learning budgets.
