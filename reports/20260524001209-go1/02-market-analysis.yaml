callouts:
  - calloutType: strength
    title: Go1 is aligned with the part of the market buyers still want to fund
    body: >-
      Buyers are not asking for more undifferentiated training hours; they are asking for AI-relevant, governed,
      multilingual learning that fits existing systems and reduces admin work. Go1's aggregation model, provider breadth,
      and role-based positioning line up well with that requirement.
    claimRefs:
      - CM003
      - CM005
      - CM006
      - CM048
  - calloutType: risk
    title: Consolidation can help Go1 or compress it
    body: >-
      Vendor consolidation is a double-edged sword. It helps if Go1 becomes the preferred content layer inside an approved
      stack, but it can cap upside if suites convince buyers to collapse content, discovery, analytics, and compliance into
      one broader contract.
    claimRefs:
      - CM031
      - CM032
      - CM033
      - CM047
      - CM049
  - calloutType: insight
    title: AI upskilling and compliance are converging into one budget story
    body: >-
      The most interesting category shift is that AI training is no longer just an L&D initiative. Risk, compliance, HR,
      and executive teams now care whether employees are using AI safely and effectively, which expands the relevant buyer
      pool for platforms that can prove behavioral change.
    claimRefs:
      - CM007
      - CM008
      - CM011
      - CM034
      - CM044
