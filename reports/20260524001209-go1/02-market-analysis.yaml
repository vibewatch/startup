        - CHRO, line-of-business leaders, finance
        - Context only; too broad for Go1 underwriting
      - - Corporate e-learning
        - Digital content, platforms, cloud delivery, mobile learning, and learning services
        - Classroom-only programs and most internal content-production labor
        - L&D, HR, compliance, procurement
        - Important demand pool and outer edge of Go1 SAM
      - - Corporate learning suites
        - LMS, LXP, content libraries, assessments, analytics, AI personalization
        - Standalone instructor labor and non-learning HR software
        - L&D, HRIT, CFO
        - Directly relevant because suite consolidation can absorb content aggregation
      - - LXP / discovery layer
        - Personalized content discovery, skills mapping, workflow learning, social learning
        - Generic LMS administration and unrelated talent software
        - L&D, HR, capability leaders
        - Directly adjacent to Go1's discovery and curation value proposition
      - - Go1 core content-aggregation layer
        - Third-party course subscriptions, curated playlists, multilingual content access, integration into existing stack
        - Internal content authoring labor, live facilitation, and most standalone services
