chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Go1 sits inside a very large but loosely defined corporate learning market: broad corporate training exceeds
    $395 billion, corporate e-learning is already a $115.7 billion layer, and the more directly comparable
    learning-suites/LXP stack is only a low-double-digit-billions market depending on definition. The evidence
    supports a positive demand outlook driven by AI upskilling, compliance modernization, and distributed-workforce
    learning needs, but the monetizable opportunity is narrower than headline TAMs because buyers are consolidating
    vendors, demanding proof of impact, and favoring platforms that fit existing HR/LMS stacks.
sections:
  - id: market-boundary-and-sizing
    title: Market boundary, included spend, and sizing logic
    body: |
      Go1 should not be framed against the entire global training economy without first drawing a boundary. The broadest
      analyst lens covers all corporate training labor, services, content, software, and delivery models; that is useful
      context for demand but is too inclusive for underwriting a content-aggregation platform. Go1's core monetizable
      layer is narrower: externally procured digital learning content, discovery, and orchestration that plugs into an
      employer's existing LMS, HRIS, or learning stack. That means broad corporate training TAM, digital corporate
      e-learning spend, integrated learning-suite spend, and the LXP/discovery layer are nested rather than interchangeable.

      The market evidence is directionally consistent on growth but inconsistent on category size. 6Wresearch places the
      broad corporate training market at roughly $395.2 billion in 2025, while Mordor sizes corporate e-learning at
      $115.74 billion in 2026 and The Business Research Company sizes corporate learning suites at $6.35 billion in 2026.
      Technavio values LXP at $1.72 billion in 2025, while lower-transparency LXP reports publish materially larger 2026
      estimates around $3.77 billion or higher. That spread is a boundary problem, not proof that Go1 can monetize all of
      the spend.

      A defensible Go1 SAM therefore sits well below broad training TAM and above the narrow learning-suites/LXP core: it
      includes the externally purchased content and discovery layer of digital corporate learning, but excludes instructor-led
      labor, internal content production, and most off-platform services. Public evidence supports a practical SAM band of
      roughly $8-20 billion and only a low-single-digit-billions SOM for an independent aggregator, because suite vendors,
      content marketplaces, and internal content budgets fragment the revenue pool.
