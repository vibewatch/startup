  evidenceGaps:
    - type: missing-source
      severity: material
      topic: go1-som
      missingEvidence: Go1 does not publicly disclose contract-value distribution, renewal rates, or revenue by content, compliance, and AI-use-case cohorts.
      whyItMatters: Exact SOM and the quality of Go1's market position cannot be underwritten from public sources without knowing how much spend concentrates in large, renewing accounts.
      diligencePath: Request ARR by customer cohort, NRR/gross retention, and use-case attach rates for compliance, AI, and partner-enabled products.
    - type: conflicting-data
      severity: material
      topic: lxp-size
      missingEvidence: Paid analyst definitions are needed to reconcile why Technavio sizes LXP far below Global Growth Insights and Business Research Insights.
      whyItMatters: Category-boundary differences can easily overstate or understate Go1's SAM by several billions of dollars.
      diligencePath: Compare full paid analyst methodologies and normalize what is included as LXP, learning suites, and external content spend.
      relatedQuestionRefs:
        - QM005
        - QM006
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: procurement-motion
      missingEvidence: Public sources do not show Go1's real sales-cycle length, implementation cost, win rates against suites, or consolidation-driven displacement rate.
      whyItMatters: Platform-consolidation risk is central to the thesis, and public vendor blogs do not reveal whether Go1 is usually the consolidator, the complement, or the vendor removed.
      diligencePath: Ask management for pipeline stage-conversion data, implementation timelines, ecosystem win/loss notes, and examples of consolidation-led wins and losses.
      relatedQuestionRefs:
        - QM018
        - QM021
