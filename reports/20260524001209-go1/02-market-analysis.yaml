  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Evidence
      - Implication for Go1
      - Diligence ask
    rows:
      - - AI upskilling urgency
        - Tailwind
        - Current to 2030
        - Go1 survey usage, LinkedIn demand surge, Coursera enrollment growth, Udemy trend report
        - Expands budget pool beyond traditional L&D and makes content refresh cadence more important
        - What percentage of Go1 usage and retention is now tied to AI pathways?
      - - Compliance and governance modernization
        - Tailwind
        - Current to 2030
        - Go1 AI page, TechClass compliance analysis, executive demand for safe AI adoption
        - Pulls compliance and risk buyers into the category
        - How much of Go1's contract value is tied to mandatory training versus elective skilling?
      - - Distributed and hybrid workforce delivery
        - Tailwind
        - Ongoing
        - Mordor cloud share, Microsoft work trends, Go1 multilingual/mobile positioning
        - Favors cloud content layers over classroom-first delivery
        - What share of Go1 engagement comes from mobile or frontline workflows?
      - - Retention and skills volatility
        - Tailwind
        - Ongoing
        - D2L retention data, WEF and Training Industry skills-change signals
        - Supports learning as a strategic budget line rather than a discretionary perk
        - Which customer cohorts link Go1 usage to retention or promotion outcomes?
      - - Learning debt and limited time
        - Headwind
        - Current
        - TalentLMS workload data, Docebo AI-readiness findings
        - Generic catalogs risk low utilization unless embedded in daily workflows
        - What completion and repeat-usage benchmarks distinguish high-performing Go1 accounts?
      - - Budget scrutiny and post-COVID normalization
        - Headwind
        - Current to 2027
        - Training Industry budget warning and buyer focus on demonstrable impact
        - Spend may consolidate around fewer vendors with stronger ROI stories
        - How often does Go1 displace spend versus replace internal or redundant external tools?
      - - Platform consolidation
        - Mixed
        - Current to 2030
        - Docebo consolidation data and suite-vendor positioning
        - Helps Go1 if it is the preferred content layer; hurts if suites internalize aggregation
        - What percentage of wins come via existing LMS/HRIS ecosystems versus greenfield buys?
      - - Weak personalization and role relevance
        - Headwind
        - Current
        - Docebo AI-readiness report says most employees cannot apply current AI training to their jobs
        - Raises the bar for curated, role-specific, practice-based learning
        - How effective are Go1's recommendations and partner experiences at driving behavior change?
      - - Partner-enabled product expansion
        - Tailwind
        - Near term
        - Decidr and CodeSignal partnerships
        - Moves Go1 beyond passive library economics toward AI-guided and practice-based learning
        - Can partner-led experiences expand ACV without turning Go1 into a full suite?
    notes: >-
      The table mixes category drivers and headwinds because the central diligence question is not whether digital learning
      grows, but which vendors capture that growth under tighter buyer scrutiny.
