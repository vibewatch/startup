  - id: FP003
    title: Go1 moat / readiness KPIs
    type: kpi
    layout: standard
    summary: >
      Go1's strongest current advantage is neutral breadth across providers and systems, while the highest-severity
      threats are Microsoft bundle pressure, suite consolidation, and limited public proof on realized economics.
    approximationNotes: >
      Labels are analytical judgments from retained evidence. Strong = currently visible advantage; Moderate = real but conditional;
      Weak = structurally limited; High = severe threat; Unknown = critical public proof missing.
    data:
      items:
        - label: Neutral content breadth
          value: Strong
          note: 250+ providers and 75+ integrations remain unusually valuable for mixed-stack enterprises
        - label: Workflow distribution power
          value: Moderate
          note: Go1 embeds into many systems, but Microsoft controls the strongest default shell in Teams and M365
        - label: Owned-content exclusivity
          value: Weak
          note: Go1 aggregates value that LinkedIn, Coursera, Udemy, Skillsoft, and others own directly
        - label: AI curation differentiation
          value: At Risk
          note: AI search, copilots, and coaching are now common category claims rather than unique proof points
        - label: Pricing transparency
          value: Weak
          note: Public list pricing is clearer at Viva, Udemy, and 360Learning than at Go1
        - label: Microsoft bundle pressure
          value: High
          note: Viva can aggregate partner content inside Teams while leveraging Microsoft 365 inclusion and search surfaces
        - label: Suite displacement pressure
          value: High
          note: Cornerstone, Docebo, and 360Learning can sell one contract across content, admin, analytics, and compliance
        - label: Win-rate visibility
          value: Unknown
          note: Public evidence does not show realized win/loss, net pricing, or branded engagement when Go1 is embedded under another shell
