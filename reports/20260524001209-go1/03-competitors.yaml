  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: realized-pricing
      missingEvidence: Signed or customer-validated Go1 contract pricing, discount corridors, and renewal uplift versus public competitor list prices.
      whyItMatters: Public list pricing is visible for some rivals but not for Go1, so underwriting economic competitiveness requires real contract evidence rather than website comparisons.
      diligencePath: Request the last twelve months of new-logo and renewal pricing by segment, with competitor named when a bake-off occurred.
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: win-loss-and-engagement
      missingEvidence: Competitor-coded win-loss data and engagement retention data for accounts where Go1 is embedded under Teams, an LMS, or another suite shell.
      whyItMatters: The core adverse question is whether Go1 remains the user-facing learning destination or becomes an interchangeable connector underneath another platform.
      diligencePath: Request activation, monthly active learner, and renewal cohorts split by direct Go1 usage versus embedded-partner usage, plus top competitor reasons in closed-lost deals.
      relatedTableRefs: [TP004]
