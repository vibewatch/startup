tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / funding
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - - Go1
        - Direct neutral aggregator / LXP
        - Private; 10,000+ organizations; historical funding >$400M
        - Enterprises with mixed stacks, compliance, and broad upskilling needs
        - 250+ providers, 75+ integrations, AI curation, provider-neutral breadth
        - No owned-content moat; public pricing remains opaque
      - - LinkedIn Learning
        - Direct content owner / career platform
        - LinkedIn at 1.2B members; 24,000+ courses; 25 languages
        - Enterprises tying learning to career pathing, skills data, and AI readiness
        - Proprietary talent graph, owned content, AI coaching, career pathways
        - Pricing not public on retained official surfaces; strongest when paired with Microsoft distribution
      - - Microsoft Viva Learning
        - Bundled distribution hub
        - Base experience included in Microsoft 365; $4/user/month standalone or $12/user/month Viva Suite
        - Microsoft 365 and Teams-centric enterprises
        - Teams-native aggregation, Microsoft Search distribution, partner and LMS connectors
        - Not a full LMS/LXP alone; premium licensing needed for richer partner content and tracking
      - - Coursera for Business
        - Direct content owner
        - 4,700+ company customers; 205M cumulative registered learners overall; Q1 2026 revenue $196M
        - Enterprises prioritizing branded credentials, academies, and role-based skilling
        - 10,600+ courses, 1,400+ specializations, 165+ certificates, 1,500+ labs
        - Enterprise pricing is still sales-led and less transparent than Udemy or Viva
      - - Udemy Business
        - Direct content owner
        - Public Team Plan for 2-50 users; Enterprise custom; 30,000+ course enterprise catalog
        - Cost-sensitive teams and enterprises seeking broad catalog coverage
        - Visible list pricing, large catalog, AI assistant, role play, AI fluency packages
        - Less differentiated on branded credentials and talent-data moats than LinkedIn or Coursera
      - - Cornerstone
        - Adjacent suite incumbent
        - 7,000+ organizations; content tiers up to 27,000+ courses
        - Enterprises buying broader workforce readiness and skills architecture
        - Content plus HumanAI, readiness agents, skills architecture, open platform story
        - Not neutral aggregation; pricing opaque and suite adoption can be heavier-weight
      - - Skillsoft
        - Direct content owner / skills platform
        - 105M+ learners; trusted by thousands of organizations; FY2026 revenue $131M
        - Large enterprises spanning leadership, compliance, and technology upskilling
        - Deep technical and compliance catalog, simulations, AI-driven coaching, Percipio release momentum
        - Pricing opaque and workflow distribution weaker than Microsoft's shell advantage
      - - Docebo
        - Adjacent suite LXP/LMS
        - Q1 2026 revenue $65.6M; subscription revenue $60.6M; investor story centers on AI-era workforce
        - Medium-to-large enterprises training employees, partners, and customers
        - AI copilot, compliance tracking, extended enterprise, hundreds of integrations
        - Custom pricing and less neutral than Go1's multi-publisher aggregation model
      - - 360Learning
        - Adjacent collaborative LMS/LXP
        - 2,500+ teams; 50+ partners; starts at $8/user/month
        - Internal and external training audiences seeking one contract and collaborative authoring
        - One platform / one contract story, AI LMS, flexible user models, strong integration pitch
        - Does not own the same breadth of third-party content as broad content marketplaces
      - - Existing LMS/LXP plus direct vendor subscriptions
        - Status-quo substitute
        - Already budgeted stack and incumbent shell
        - Enterprises that prefer to standardize on current workflow tools
        - Avoids paying for a neutral aggregator and keeps discovery inside existing systems
        - Fragmented content sourcing, multi-vendor admin burden, and weaker cross-provider optionality
    notes: >
      Rows mix direct content owners, suite incumbents, and the dominant status-quo substitute because buyers
      frequently compare Go1 against one-shell bundle offers rather than against another pure aggregator.
