  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat
      - Severity
      - Evidence
      - Mitigation / diligence ask
    rows:
      - - Neutral aggregation breadth
        - Microsoft, LinkedIn, Coursera, Udemy, Skillsoft, and Cornerstone all market broad overlapping libraries
        - High
        - Generic business, compliance, leadership, and AI topics are widely available across the set
        - Request top-100 most-used Go1 courses and overlap analysis versus top competitor libraries
      - - Workflow embedding via integrations
        - Microsoft owns Teams and Microsoft Search, while suites own the admin shell
        - High
        - Viva is bundled into Microsoft 365 and can surface partner content inside Teams
        - Request share of active learners entering through Go1 directly versus through embedded partner surfaces
      - - AI curation differentiation
        - AI search, copilots, role play, and assistants are now common category claims
        - Medium
        - Go1, LinkedIn, Udemy, Docebo, 360Learning, and Cornerstone all market AI layers
        - Ask for measurable lift from Go1 curation versus standard search and manual assignment
      - - Pricing flexibility
        - Transparent rivals can set procurement anchors while Go1 remains quote-led
        - Medium
        - Microsoft, Udemy, and 360Learning publish list prices; Go1 does not
        - Request latest pricing cards, discount corridors, and renewal uplift data by cohort
      - - One-contract consolidation
        - Cornerstone, Docebo, and 360Learning collapse content, admin, analytics, and compliance into a suite motion
        - High
        - Adjacent vendors market one-platform, one-contract, or workforce-readiness outcomes
        - Ask what percentage of wins involve replacing a suite versus complementing one
      - - Switching costs and multi-homing
        - Buyers can preserve the same shell and swap content providers underneath it
        - High
        - Independent Viva reviews and suite pitches imply learning discovery is often controlled by another platform
        - Request competitor-coded churn and win/loss data, especially versus Microsoft-centric accounts
      - - User-facing differentiation
        - Go1 may become the content layer beneath another vendor's front end
        - High
        - Essential explicitly frames Go1 as a provider that Viva can surface inside Teams
        - Ask whether Go1 retains branded engagement, reporting leverage, and renewal power when embedded
    notes: >
      This register focuses on durability rather than product quality. Several risks are not about Go1 failing to deliver content;
      they are about whether another vendor can own discovery, administration, or procurement while Go1 becomes a less visible layer.
