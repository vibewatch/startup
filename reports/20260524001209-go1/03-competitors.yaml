  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor
      - Public package / pricing evidence
      - Contract motion
      - Included capabilities
      - What remains unclear
    rows:
      - - Go1
        - Public official pages market a single subscription but do not publish list pricing
        - Enterprise quote-led
        - 250+ providers, AI curation, intelligent learner experience, 75+ integrations
        - Net seat pricing, contract minimums, and discount discipline
      - - Microsoft Viva Learning
        - $4/user/month yearly standalone; Viva Suite $12/user/month yearly; base learning access included in M365 plans
        - Add-on to Microsoft 365 enterprise licenses
        - Teams-native learning hub, partner integrations, recommendations, tracking, Microsoft Learn library
        - Real all-in cost once partner content and enterprise entitlements are layered in
      - - Coursera for Business
        - Retained official business pages do not publish list enterprise price
        - Enterprise sales-led
        - 10,600+ courses, 1,500+ labs, role-based skills tracks, certificates, AI tools
        - Team-vs-enterprise pricing boundaries and realized discounts
      - - Udemy Business
        - Team Plan $30/user/month billed annually for 2-50 people; Enterprise custom
        - Self-serve team motion plus enterprise sales motion
        - 28,000+ Team Plan courses; 30,000+ Enterprise courses; AI assistant and role play
        - Add-on pricing for premium support, labs, and advanced paths
      - - Cornerstone
        - No public platform or content-subscription list pricing on retained official pages
        - Suite sales-led
        - Tiered content subscriptions plus workforce-readiness and AI layers
        - Actual price floors and attach rates between content and broader suite modules
      - - Skillsoft
        - No public list pricing on retained official pages
        - Sales-led
        - Deep technical, business, and compliance catalog plus Percipio platform
        - Realized pricing by learner cohort, content bundle, and platform tier
      - - Docebo
        - Custom pricing by tier and active-user model
        - Sales-led with active-user based contracts
        - AI copilot, compliance tracking, multilingual support, extended enterprise, integrations
        - Unit economics by MAU, YAU, or RAU and the effective price of add-ons
      - - 360Learning
        - Starts at $8/user/month with custom enterprise packaging and flexible user models
        - Transparent starter plan plus custom enterprise motion
        - AI-powered LMS, collaborative authoring, internal/external audience support, integrations
        - Enterprise services, support, and integration charges above entry-level plan
    notes: >
      Public packaging evidence is uneven. Where pricing is not public, the cell intentionally records that fact instead
