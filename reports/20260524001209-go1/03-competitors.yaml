callouts:
  - calloutType: strength
    title: Provider-neutral breadth is still a real buying reason
    body: >
      Go1 remains differentiated for enterprises that do not want to pick one content owner or one suite.
      Its 250+ providers, multilingual coverage, AI curation, and 75+ integrations make it especially useful
      when the customer wants optionality across existing LMS, LXP, HRIS, and collaboration tooling rather
      than a rip-and-replace platform decision.
    claimRefs:
      - CP002
      - CP004
      - CP006
      - CP050

  - calloutType: risk
    title: Microsoft can move Go1 from front door to background layer
    body: >
      The most important adverse scenario is not that Microsoft builds a better neutral aggregator; it is that
      Teams and Microsoft 365 become the default place where employees discover learning, while Viva surfaces
      Microsoft, LinkedIn, partner, and LMS content from that shell. If that happens, Go1 may still be present
      in the stack but lose leverage over user engagement, pricing power, and renewal control.
    claimRefs:
      - CP012
      - CP014
      - CP018
      - CP044
      - CP045

  - calloutType: insight
    title: Public pricing visibility is shaping the competitive story
    body: >
      Buyers can already benchmark Viva, Udemy, and 360Learning with public pricing anchors, while Go1 and most
      suite/content incumbents stay quote-led. That does not mean the transparent vendors are always cheaper,
      but it does mean they can frame value and budget conversations sooner — before Go1's tailored sales motion begins.
    claimRefs:
      - CP014
      - CP023
      - CP040
      - CP048

