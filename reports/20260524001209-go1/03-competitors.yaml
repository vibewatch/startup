chapter:
  number: 3
  title: Competitors
  summary: >
    Go1 competes most directly with broad enterprise learning content owners and adjacent LMS/LXP suites,
    not with a single like-for-like clone. Its neutral aggregation model — 250+ providers, 75+ integrations,
    and AI-led curation — remains useful for mixed-stack enterprises, but Microsoft/LinkedIn has the strongest
    distribution advantage because Viva Learning is bundled into Microsoft 365 and Teams while surfacing partner
    content. The practical competitive verdict is that Go1's moat is real but executional: content overlap,
    suite bundling, and opaque realized pricing make differentiation easier to message than to prove.
sections:
  - id: landscape-overview
    title: Direct peers, suite adjacencies, and the real decision set
    body: >
      The buyer does not evaluate Go1 against only one comparator. The direct overlap starts with broad content
      owners and enterprise learning catalogs — LinkedIn Learning, Coursera for Business, Udemy Business,
      and Skillsoft — because each sells large external course libraries, AI-aided discovery or practice,
      and enterprise distribution into common upskilling categories such as leadership, compliance, technology,
      and AI readiness. The adjacent threat comes from suites that combine content with broader workflow control:
      Microsoft Viva Learning uses Teams and Microsoft 365 as the discovery surface; Cornerstone, Docebo,
      and 360Learning position content inside larger learning, skills, collaboration, and admin stacks. That
      means Go1 is often being compared against “one contract, one shell” offers rather than only against another
      neutral marketplace. Go1’s best comparative story is still breadth plus neutrality — over 10,000 organizations,
      250+ providers, and 75+ integrations — which is attractive when an enterprise wants optionality instead of
      standardizing on one publisher or one suite. The weakness is that several rivals own either the content,
      the learner front door, or both. Once discovery moves into Teams, an incumbent LMS, or a suite-owned home
      page, Go1 risks becoming a connector rather than the destination.
