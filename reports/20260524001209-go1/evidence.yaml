evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: customer-scale
    missingEvidence: >-
      A management-defined metric bridge showing how 10,000+ customers, 180,000+ community customers, 1,600 enterprise
      customers, and 3,000 customers relate to each other.
    whyItMatters: Without a denominator bridge, customer scale can be overstated or compared incorrectly against peers.
    diligencePath: >-
      Request the current paid-customer definition, active-logo count, learner-account count, and any community or
      ecosystem denominator used in marketing dashboards.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee list, observer rights, and founder/investor control map.
    whyItMatters: >-
      Founder-heavy private companies can look well governed publicly while still having concentrated control or unusual
      investor protections.
    diligencePath: >-
      Request the latest board deck cover, cap table summary, charter pack, and side-letter summary during management
      diligence.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited or board-approved FY2024/FY2025 revenue, ARR, gross margin, burn, and net retention figures.
    whyItMatters: >-
      The retained public record contains only third-party estimates, which are insufficient for valuation or
      underwriting work.
    diligencePath: >-
      Request monthly management accounts, ARR bridge, cohort retention tables, and the most recent board reporting
      pack.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headcount-footprint
    missingEvidence: A dated employee census by entity and office, plus a current office/hub list tied to the legal-entity structure.
    whyItMatters: >-
      Conflicting headcount and headquarters labels change the interpretation of operating leverage, regional
      concentration, and management span.
    diligencePath: Request current HRIS headcount by country/entity, office list, remote-vs-hub policy, and legal-entity map.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: adverse-clearance
    missingEvidence: >-
      Company-specific court, regulator, and layoff-clearance results that can be tied directly to Go1 rather than to
      generic trackers or blocked databases.
    whyItMatters: >-
      Absence of an open-web adverse hit is not the same as verified absence of litigation, regulatory issues, or
      restructuring.
    diligencePath: >-
      Run entity-specific litigation and regulatory searches across Australia, the U.S., the U.K., and Singapore, then
      confirm directly with management whether any WARN-equivalent or restructuring events occurred.
    relatedQuestionRefs:
      - QO028
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: go1-som
    missingEvidence: >-
      Go1 does not publicly disclose contract-value distribution, renewal rates, or revenue by content, compliance, and
      AI-use-case cohorts.
    whyItMatters: >-
      Exact SOM and the quality of Go1's market position cannot be underwritten from public sources without knowing how
      much spend concentrates in large, renewing accounts.
    diligencePath: >-
      Request ARR by customer cohort, NRR/gross retention, and use-case attach rates for compliance, AI, and
      partner-enabled products.
  - type: conflicting-data
    severity: material
    topic: lxp-size
    missingEvidence: >-
      Paid analyst definitions are needed to reconcile why Technavio sizes LXP far below Global Growth Insights and
      Business Research Insights.
    whyItMatters: Category-boundary differences can easily overstate or understate Go1's SAM by several billions of dollars.
    diligencePath: >-
      Compare full paid analyst methodologies and normalize what is included as LXP, learning suites, and external
      content spend.
    relatedQuestionRefs:
      - QM005
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: procurement-motion
    missingEvidence: >-
      Public sources do not show Go1's real sales-cycle length, implementation cost, win rates against suites, or
      consolidation-driven displacement rate.
    whyItMatters: >-
      Platform-consolidation risk is central to the thesis, and public vendor blogs do not reveal whether Go1 is usually
      the consolidator, the complement, or the vendor removed.
    diligencePath: >-
      Ask management for pipeline stage-conversion data, implementation timelines, ecosystem win/loss notes, and
      examples of consolidation-led wins and losses.
    relatedQuestionRefs:
      - QM018
      - QM021
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Signed or customer-validated Go1 contract pricing, discount corridors, and renewal uplift versus public competitor
      list prices.
    whyItMatters: >-
      Public list pricing is visible for some rivals but not for Go1, so underwriting economic competitiveness requires
      real contract evidence rather than website comparisons.
    diligencePath: >-
      Request the last twelve months of new-logo and renewal pricing by segment, with competitor named when a bake-off
      occurred.
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-and-engagement
    missingEvidence: >-
      Competitor-coded win-loss data and engagement retention data for accounts where Go1 is embedded under Teams, an
      LMS, or another suite shell.
    whyItMatters: >-
      The core adverse question is whether Go1 remains the user-facing learning destination or becomes an
      interchangeable connector underneath another platform.
    diligencePath: >-
      Request activation, monthly active learner, and renewal cohorts split by direct Go1 usage versus embedded-partner
      usage, plus top competitor reasons in closed-lost deals.
    relatedTableRefs:
      - TP004
  - type: conflicting-data
    severity: material
    topic: customer-denominator-conflict
    missingEvidence: A reconciled breakdown of paying organizations, active learners, community users, and revenue-bearing accounts.
    whyItMatters: >-
      Without a clean denominator, revenue-per-customer, net expansion, and penetration assumptions can all be badly
      overstated or understated.
    diligencePath: >-
      Request a board-level KPI definition sheet and the last 12 months of customer-count reporting split by paying
      orgs, active learners, and free/community accounts.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: consolidated-unit-economics
    missingEvidence: Consolidated gross margin, content-licensing cost, support cost, CAC, payback, GRR, and NRR.
    whyItMatters: >-
      These figures determine whether Go1 is a durable subscription business with efficient renewal economics or simply
      a well-funded aggregator with opaque margins.
    diligencePath: Request the management P&L, gross-margin bridge, cohort-retention tables, and CAC/payback model by segment.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Consolidated cash balance, monthly burn, debt facilities, and runway under base and downside scenarios.
    whyItMatters: >-
      Fundraising history alone cannot tell an investor whether Go1 still needs external capital to sustain growth or
      absorb weaker demand.
    diligencePath: Request a monthly cash bridge, venture-debt schedule, and 12- to 24-month board operating plan.
    relatedQuestionRefs:
      - QI020
      - QI021
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-renewals
    missingEvidence: >-
      Signed-order-form evidence for realized ACV, discounting, seat utilization, renewal uplift, and price-escalator
      enforcement.
    whyItMatters: >-
      Public pricing databases disagree materially, and the official site hides list prices altogether, so contract
      quality is still unknown.
    diligencePath: >-
      Review at least 20 recent contracts across SMB, mid-market, and enterprise cohorts, including renewals and any
      true-up provisions.
    relatedQuestionRefs:
      - QI003
      - QI022
    relatedTableRefs:
      - TI002
      - TI005
  - type: access-blocked
    severity: minor
    topic: australian-parent-document-pack
    missingEvidence: Australian parent extracts, shareholder registers, and lodged fundraising documents for Go1 Pty Limited.
    whyItMatters: >-
      The UK filing is only one legal-entity slice; parent-level obligations, financing instruments, and shareholder
      structure likely sit in Australian registry documents.
    diligencePath: >-
      Pull ASIC company extracts and any lodged fundraising documents for Go1 Pty Limited, then reconcile them against
