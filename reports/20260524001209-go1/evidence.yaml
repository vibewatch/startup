      Request trust-center access, current certificates, most recent pen-test summary, and customer-facing SLA language
      under NDA.
    relatedQuestionRefs:
      - QE015
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: ai-proof
