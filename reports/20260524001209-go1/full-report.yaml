              and about $172 per license annually for a comparable Premium Pro deployment. Yet other public databases
              disagree on the entry point and free-trial availability, which is exactly why list economics should be
              treated as indicative rather than underwritten. Official product pages do show that Go1 is trying to
              monetize around measurable outcomes: Reporting & Insights packages exportable completions, enrollment,
              skills, and engagement data, while the 2025-2026 product refresh adds Go1 Learn, Go1 Pay, and Go1
              Insights. Those features support an enterprise upsell narrative, but the company still does not publish
