      - number: '1.2'
        title: Leadership, governance, and capital base
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is good enough to identify the founder nucleus but not good enough to underwrite
              governance from public materials alone. The current official about-page schema lists Chris Eigeland as
              CEO, Andrew Barnes as director, and Vu Tran and Chris Hood as co-founders. External directories and people
              databases lag that picture: Growjo still lists Andrew Barnes as CEO/co-founder, and several commercial
              databases expose only partial org-chart or legal-entity snippets. That mismatch matters because Go1 still
              reads as a founder-heavy business whose strategic narrative is concentrated in a small set of long-tenured
              executives, while the actual board roster, committee structure, observer rights, and control terms remain
              private. Capital formation is much clearer than governance. TechCrunch reported a $200 million Series D in
              July 2021 at a valuation above $1 billion, making Go1 a unicorn; the official 2022 funding post and OIF
              Ventures’ reposted TechCrunch coverage then support a further round of more than $100 million at a
              valuation above $2 billion, taking total funding above $400 million. Those sources also identify a durable
              investor set that includes SoftBank Vision Fund 2, AirTree, Salesforce Ventures, Madrona, SEEK, Y
              Combinator, and others. The 2022 official post adds an important operating read-through: North America had
              become the largest market, and Go1 was using acquisitions such as Coorpacademy to widen European content
              and language reach.
