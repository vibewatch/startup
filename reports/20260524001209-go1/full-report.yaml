  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization model and public traction signals
        blocks:
          - type: paragraph
            body: >-
              Go1’s official financial story starts with packaging rather than audited revenue. The company sells an
              aggregated learning-content platform through a single-subscription model that is meant to replace multiple
              vendors, and its current plans page presents three commercial packages: Essentials Select for small teams,
              Premium Essentials, and Premium Pro. Official pages emphasize breadth rather than list price, highlighting
              80,000-plus courses from more than 250 providers, 40-plus languages, and 75-plus integration partners.
              That tells investors the revenue model is recurring and enterprise-oriented, but it does not reveal
              realized contract value, discounting, or renewal quality. The strongest official traction evidence is
              customer-outcome marketing: the homepage and customer-stories hub cite 10,000-plus organizations,
              case-study metrics such as a 20% engagement increase and a 3x active-learner increase, and more specific
              wins including Wave Utilities lifting completion from 78% to 98%, Atlas Tech expanding access to 100% of
              employees from 10%, and JCDecaux cutting costs by £75,000 annually while reaching 95% engagement. These
              are useful willingness-to-pay and deployment proofs, but they are company-authored proofs of value rather
              than direct revenue disclosures.
