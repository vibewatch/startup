  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Fresh down-round or tender reset
        - Any priced event below ~$1B
        - Confirms the last multi-billion mark was stale and compresses return potential
        - Stop underwriting on old mark and rebuild from new clearing price
      - - ARR shortfall
        - Audited ARR materially below the $94.8M public proxy
        - Shrinks every scenario numerator and questions growth quality
        - Rebase valuation band lower immediately
      - - Weak retention or margin profile
        - NRR below premium-SaaS territory or gross margin structurally weak
        - Premium multiple case disappears if economics look content-heavy or services-heavy
        - Move toward bear-case multiples
      - - High customer concentration
        - One or a few accounts dominate revenue
        - Raises renewal risk and weakens strategic scarcity
        - Apply concentration discount and revisit exit paths
      - - Product strategy fails to monetize
        - Morgan/contextual learning does not lift expansion, pricing, or attach rates
        - Bull-case assumptions never materialize
        - Keep only base-to-bear valuation range
    notes: Kill criteria are monitorable and tied directly to valuation transmission rather than generic company risk.
    claimRefs:
      - CV046
      - CV050
      - CV051
      - CV052
      - CV058
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited ARR and revenue bridge
        - Monthly and annual ARR/revenue for 2024-2026
        - Core denominator for every implied multiple in this chapter
        - Request audited statements plus board KPI packs
      - - Gross margin and cash flow
        - Gross margin EBITDA FCF and content-cost mix
        - Determines whether Go1 deserves premium SaaS or content-platform multiples
        - Request audited P&L cash flow and margin bridge
      - - Retention quality
        - NRR GRR logo churn cohort expansion and renewal by segment
        - Premium valuation requires proof of durable expansion not just top-line scale
        - Request customer-cohort dashboard and renewal reports
      - - Customer concentration
        - Top 10 customers and any OEM or channel dependency
        - A few large accounts can distort ARR quality and exit value
        - Request revenue concentration schedule
      - - Cap table and preferences
        - Fully diluted ownership preference stack side letters ROFR/ROFO tender rights
        - Realized returns can diverge sharply from enterprise value in markdown scenarios
        - Request cap table and waterfall model
      - - Fresh price discovery
        - Any 2025-2026 tender 409A or secondary clearing price
        - Needed to replace stale 2022/2023 anchors with current market evidence
        - Request latest 409A tender docs or broker indications
    notes: >-
      These asks are blocking rather than optional. Without them, a new investor is underwriting narrative quality more
      than valuation quality.
