      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should start from the latest observable ARR anchor rather than management aspiration.
              The only public estimate with year-over-year detail is Latka's 2024 figure of $94.8 million, up from $68.9
              million in 2023. That growth is strong enough to support some premium versus education-software averages,
              especially because Go1 sells into employers and not just consumers, but it is not enough on its own to
              justify a stale 20x-plus private mark without audited retention and margin evidence.

              The bear case assumes ARR is effectively $90 million to $100 million, that new product direction does not
              translate into materially better monetization, and that buyers price Go1 closer to hard public comps or
              the low end of private SaaS. That produces about $315 million to $450 million at 3.5x-4.5x. The base case
              assumes ARR of $95 million to $110 million and a 6x-7x multiple, which is still a premium to public
              education software but below the top of private SaaS. That yields roughly $570 million to $770 million.
              The bull case assumes ARR grows toward $110 million to $130 million and that Go1's contextual-learning
              strategy proves strong enough for an 8x-10x outcome, producing roughly $880 million to $1.30 billion.

              Even the bull case stays below the last clearly disclosed multi-billion private mark. A 25% bear, 55%
              base, and 20% bull weighting produces a midpoint around $680 million to $700 million. That is not a
              precise fair-value claim; it is the most defensible public-evidence range. The practical conclusion is
              straightforward: multi-billion pricing today needs private evidence that the public record does not
              supply.
            claimRefs:
