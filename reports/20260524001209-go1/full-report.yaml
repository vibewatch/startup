  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product model, and footprint
        blocks:
          - type: paragraph
            body: >-
              Go1’s clearest public identity is not a traditional learning-management system vendor or a course
              producer, but a content-aggregation platform for people-first L&D teams. Official pages consistently say
              the company was created in 2015, aggregates learning content from more than 250 providers into a single
              subscription, and operates with a remote-first team that still maintains a presence in key regions. The
              official address trail anchors the company at 2908 Logan Road, Underwood, Queensland, which matches the
              Logan/Brisbane founding narrative in government and magazine coverage. At the same time, public footprint
              data is not perfectly clean: TechCrunch described offices in London, the U.S., Singapore, and Malaysia in
              2021; Advance Queensland later said Go1 had 13 global offices and more than 1,000 employees; Craft
              currently surfaces a San Francisco HQ and a single office. The diligence read is therefore not “pick one
              city and ignore the rest,” but rather “Brisbane-founded and Underwood-anchored, with a globally
              distributed operating model and noisy third-party database hygiene.” Scale disclosures are similarly
              multi-denominator. Current official careers marketing says Go1 is trusted by 10,000-plus customers,
              another current product page markets 180,000-plus customers in the Go1 community of learning, TechCrunch
              cited 3.5 million users and more than 1,600 enterprise customers in 2021, and external directories later
              cite more than 2 million users or more than 8 million professional learners. Those signals support real
              adoption, but not a single clean headline metric.
