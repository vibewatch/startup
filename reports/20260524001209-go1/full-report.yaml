      - number: '2.3'
        title: Demand drivers, adoption constraints, and adverse evidence
        blocks:
          - type: paragraph
            body: >
              The strongest demand drivers are easy to triangulate across company, analyst, and workforce data. AI
              upskilling has

              moved from a niche technical topic to an enterprise-wide operating issue: Go1's survey says 57% of
              employees used

              AI-enabled learning tools in the past month and nearly 70% use them weekly, Coursera reports 234%
              year-over-year

              growth in enterprise GenAI enrollments, and LinkedIn says AI-skill demand in job postings rose 142% over
              twelve

              months. At the same time, compliance is no longer just annual attestation. Go1 markets AI training around
              data privacy

              and approved-tool governance, while TechClass argues that AI, privacy, and misconduct enforcement are
              shifting buyers

              from box-ticking toward demonstrable operational competence.


              The macro labor backdrop reinforces that growth case. D2L says retention remains a top executive concern
              and learning

              is the leading retention lever; WEF and Training Industry both argue that skills change remains
              substantial even as the

              pace of disruption becomes less chaotic than in the immediate post-pandemic period. That favors platforms
              that can push

              role-specific, multilingual, in-flow learning to distributed teams without standing up new local
              infrastructure.


              The adverse evidence matters just as much. TalentLMS says employees lack time for training, Docebo says
              85% of workers

              cannot apply AI training to their actual jobs, and Training Industry warns that economic uncertainty is
              once again

              putting learning budgets at risk. The practical read-through is that demand is real, but buyers are
              becoming less

              tolerant of generic catalogs, weak personalization, or programs that cannot demonstrate relevance in the
              flow of work.

              Post-COVID normalization does not erase digital learning demand; it shifts spend toward measured outcomes,
              workflow fit,

              and targeted skills or compliance problems.
