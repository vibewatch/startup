      - number: '5.2'
        title: Integrations and implementation model
        blocks:
          - type: paragraph
            body: >-
              Go1 is designed to live inside an existing LMS or HRIS stack. The official integrations page promises
              access through 75+ tech partners, while the implementation guide says customers should whitelist Go1
              domains, then choose between an integrated-platform path, SCORM delivery, or a custom integration. Go1’s
              own help content also says day-to-day content-management behavior depends on the underlying LMS or HRIS in
              use. In other words, Go1’s rollout model is not ‘turn on one new app and ignore the rest’; it is an
              embedded deployment that inherits the complexity of the customer’s existing learning, identity, and
              content-administration environment.


              The partner-update log confirms that the integration layer is still moving. Workday, LearnUpon, Paycor,
              and Schoox each received material updates across 2025 and 2026, with explicit notes on skills-taxonomy
              mapping, real-time search, auto-sync, enrollment tracking, retirement workflows, and migration work.
              LearnUpon’s own integrations page further shows how much surrounding identity and HRIS plumbing sits
              around LMS deployments before Go1 content is even layered in. That supports a core diligence conclusion:
              Go1’s implementation model is credible and well-developed, but it is also integration-heavy and
              operationally non-trivial.
