      - number: '8.4'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Go1 still has real strategic optionality. The platform sits at the intersection of learning content
              aggregation, employer workflow integration, and increasingly AI-assisted delivery. That profile can
              attract strategic buyers, sponsors looking for a recap or structured secondary, or eventually public
              investors if the company can convert product breadth into public-grade unit economics. But the path is not
              IPO-ready on current evidence. Public comparables like Coursera, Skillsoft, Docebo, and Udemy all give
              investors recurring visibility into revenue, margin, and filing cadence; Go1 does not.

              That disclosure gap drives the final recommendation and the kill criteria. If a fresh tender or financing
              clears below roughly $1 billion, if audited ARR comes in materially below the current $94.8 million proxy,
              or if gross margin and retention fail to look like premium SaaS, the current premium story breaks.
              Conversely, the investment case improves meaningfully if diligence shows strong retention, attractive
              margins, low concentration, and a cap table that does not trap common equity under a stale preference
              stack.

              The blocking asks are therefore not abstract. An investor needs audited 2024-2026 ARR and revenue, gross
              margin and cash-flow history, NRR and churn, customer concentration, a cap-table waterfall, and any recent
              secondary or 409A work. Without those, the chapter supports only a research-more posture and a disciplined
              refusal to underwrite the old mark as if it were current.
            claimRefs:
              - CV006
              - CV019
              - CV020
              - CV041
              - CV046
