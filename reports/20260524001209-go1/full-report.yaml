      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Private-mark staleness is the core adverse fact
            body: >-
              Go1 may still be a quality company, but the last clearly disclosed marks are old. The company officially
              said only “above $2B” in 2022, Tracxn shows $2.8B in 2022 and a 2023 extension without fresh post-money,
              and other private databases disagree on total funding and latest round labels. That combination means the
              private mark is not a reliable current fair-value anchor.
            calloutType: risk
            claimRefs:
              - CV008
              - CV012
              - CV013
              - CV014
              - CV020
          - type: callout
            title: Go1 deserves a premium to weak public edtech, but not an infinite premium
            body: >-
              The company's employer focus, content aggregation, and integrations make it stronger than distressed
              public learning names. But current public anchors around 0.1x-2.0x and 2026 private SaaS medians around
              4x-5x still cap how far a rational investor should stretch. A defendable premium is plausible; a stale
              20x-plus ARR anchor is not.
            calloutType: insight
            claimRefs:
              - CV023
              - CV026
              - CV029
              - CV031
              - CV034
              - CV038
              - CV039
              - CV045
              - CV047
          - type: callout
            title: Only a large markdown plus real diligence moves the call
            body: >-
              The chapter supports continued diligence, not a buy recommendation. The threshold for becoming investable
              is a materially lower entry price plus hard evidence on audited ARR, margin, retention, and cap-table
              terms. Without those proofs, investors are underwriting story quality rather than valuation quality.
            calloutType: recommendation
            claimRefs:
              - CV046
              - CV055
              - CV056
              - CV057
