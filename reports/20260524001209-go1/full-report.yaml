      - number: '7.2'
        title: Platform, content-licensing, and competition risk
        blocks:
          - type: paragraph
            body: >-
              Go1's distribution advantage is also one of its largest strategic risks. The company heavily markets
              native delivery inside Microsoft Teams, Viva, Search, and partner systems, while Microsoft's own
              documentation makes clear that Go1 is merely a third-party content source inside a Microsoft-controlled
              surface. Adding Go1 requires a Viva license, admin enablement, and provider-specific terms; personal
              subscriptions to non-Microsoft providers cannot be blended into the same experience. That means Microsoft
              controls discovery, placement, and the surrounding commercial bundle, while LinkedIn Learning and
              Microsoft-owned learning assets sit closer to the operating system. If Microsoft expands LinkedIn Learning
              or Viva-native content bundles, Go1 could be forced into a lower-margin catalog role even if usage remains
              high.


              The same pattern exists across the broader partner ecosystem. Go1's customer terms explicitly define the
              company as a content aggregator, and Docebo, LMS365, and D2L all market Go1 as an embedded content source
              rather than a self-contained destination. That increases exposure to provider churn, rev-share pressure,
              and contract overrides. Competitive data reinforces the risk: 6sense ranks LinkedIn Learning far ahead of
              Go1 in customer count and market share, while SourceForge and SelectHub position Go1, LinkedIn Learning,
              and OpenSesame as direct substitutes in buyer comparisons. SelectHub's own trade-off is revealing—Go1 wins
              on breadth and certification pathways, but curated rivals can win on consistency. In other words, Go1 is
              differentiated by aggregation and convenience, not by exclusive ownership of the underlying learning
              supply.
