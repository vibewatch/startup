  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and privacy risk
        blocks:
          - type: paragraph
            body: >-
              Go1's most concrete legal exposure is not a consumer suit or published regulator action but an active IP
              dispute with OpenSesame. PacerMonitor shows OpenSesame sued GO1 Pty, Ltd. in Oregon District Court in 2021
              and that the matter remained active into May 2026, including a denied motion to dismiss and a
              claim-construction order. A related Federal Circuit / PTAB-linked appeal filed by Go1 in 2024 confirms the
              fight is still absorbing management time and legal budget. For an aggregator whose value proposition
              depends on broad access to third-party catalog assets, live patent and platform litigation is a
              non-trivial distraction risk even without a disclosed damages figure.


              Privacy and contract exposure are broader and more structural. Go1 says it is a controller for its own
              web, marketing, support, and analytics data, but a processor for customer platform data; it also says
              personal information is stored in the United States and Australia by default and that it uses limited
              profiling to personalize learning. Those disclosures sit alongside Australian Privacy Principles, the
              Privacy Act 1988, ACCC contract enforceability, and Fair Work employment-contract rules. Go1's customer
              terms add commercial friction: services auto-renew in 12-month blocks, fees are billed annually in
              advance, and content-provider agreements can override the standard customer terms. The absence of
              disclosed regulator correspondence keeps current regulatory risk in the 'prospective but material' bucket
              rather than 'already crystallized', but the Australia-linked privacy, employment, and contract stack
              clearly matters for diligence.
