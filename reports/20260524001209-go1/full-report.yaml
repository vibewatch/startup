companyProfile:
  summary: >-
    Go1 is an Australian enterprise learning platform founded in 2015 that aggregates third-party training content into
    a single subscription and distributes it through existing HR, LMS, and collaboration workflows. Public evidence
    supports a broad product footprint—250+ content providers, 75+ integrations, workflow products such as Go1 Learn,
    Pay, and Insights, and named customer proof across manufacturing, utilities, education, transport, media, and
    energy. Go1 has clearly scaled beyond early-stage status: official materials cite more than 10,000 organizations,
    official funding posts say total capital exceeded $400 million at a valuation above $2 billion, and retained
    private-database estimates put 2024 ARR near $94.8 million. The core underwriting challenge is not whether Go1 has
    reach, but whether the latest private valuation can be defended from open evidence when profitability, retention,
    and detailed cap-table economics remain undisclosed.
