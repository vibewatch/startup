  - id: FP003
    title: Go1 moat / readiness KPIs
    type: kpi
    layout: standard
    summary: >
      Go1's strongest current advantage is neutral breadth across providers and systems, while the highest-severity
      threats are Microsoft bundle pressure, suite consolidation, and limited public proof on realized economics.
    approximationNotes: >
      Labels are analytical judgments from retained evidence. Strong = currently visible advantage; Moderate = real but
      conditional; Weak = structurally limited; High = severe threat; Unknown = critical public proof missing.
    data:
