      - number: '3.2'
        title: Capability breadth, public packaging, and where Go1 is easier or harder to compare
        blocks:
          - type: paragraph
            body: >
              Capability breadth is not the core weakness for Go1. Its official product pages show AI-assisted search,
              side-by-side course comparison, intelligent homepages, multilingual delivery, and distribution through
              existing LMS, LXP, HRIS, and collaboration tools. The harder comparison is economic and structural.
              Microsoft, Udemy, and 360Learning publish enough pricing to anchor procurement conversations before sales
              even starts, while Go1, Coursera enterprise, Cornerstone, Skillsoft, and Docebo remain mostly quote-led.
              That matters because public anchors affect buyer expectations even when the final contract is negotiated.
              Product scope also differs by vendor class. Coursera and Udemy emphasize owned catalogs, credentials, and
              AI-enabled practice; Cornerstone, Docebo, and 360Learning emphasize broader administration, compliance,
              skills, and collaboration layers around the learning experience; LinkedIn and Microsoft blend content,
              skills data, and workflow distribution. Go1 sits between these camps: stronger as a neutral aggregator
              than a pure content owner, but lighter than a full suite on native admin depth. For buyers who want
              breadth without ripping out their existing systems, that is attractive. For buyers who want one vendor to
              own content, tracking, skills, and front-end distribution, it can look like an extra layer.
