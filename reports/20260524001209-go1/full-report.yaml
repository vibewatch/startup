      - number: '2.2'
        title: Buyer personas, budget owners, and procurement motion
        blocks:
          - type: paragraph
            body: >
              Go1's own positioning makes the buyer map unusually clear for a learning platform. The company markets
              directly to

              L&D managers, HR managers, compliance managers, and C-suite leaders, which implies a multi-stakeholder
              buying unit

              rather than a single "learning admin" persona. In practice, L&D owns content strategy and adoption
              reporting; HR and

              People teams care about safe tool usage, onboarding, and retention; compliance leaders care about
              auditability,

              privacy, and policy enforcement; and executive sponsors want a board-level answer for whether AI and
              skills programs

              are actually changing behavior.


              Budget ownership typically follows use case. Enterprise L&D and CHRO organizations are the default
              economic buyers,

              but large employers still dominate spend in corporate e-learning, which means CFO review, procurement
              controls, SSO,

              data-governance checks, and integration with anchor systems are part of the motion. Technavio explicitly
              says buyer

              evaluation is shifting from feature checklists to ecosystem interoperability and skills-ontology support,
              while Go1's

              partner announcements show why: enterprise buyers increasingly want content, analytics, and role-specific
              practice to

              flow through the same stack rather than sit in disconnected point tools.


              That creates a characteristic adoption path for Go1: executive trigger around AI, skills, or compliance;
              budget-owner

              alignment; stack-fit review against LMS/HRIS and reporting needs; a curated pilot; then broader rollout
              and expansion

              if the platform can prove completion, usage consistency, and business impact. The strength of Go1's
              one-subscription,

              multi-provider model is that it matches this procurement logic; the risk is that the same logic can favor
              a broader

              suite if Go1 is treated as "one more vendor" rather than the content layer inside an already approved
              ecosystem.
