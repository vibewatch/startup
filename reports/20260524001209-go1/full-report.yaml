      - number: '8.2'
        title: Verified marks versus inferred comparable anchors
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to value Go1 is to separate what is actually verified from what must be inferred. The
              verified side is narrow: a 2021 billion-dollar Series D, an official 2022 round of more than $100 million
              at a valuation above $2 billion, and tracker evidence that the same 2022 financing may have cleared nearer
              $2.8 billion. The inferred side is much wider: the latest observable revenue proxy is Latka's $94.8
              million for 2024, and the latest public comp frame comes from learning-software and broader SaaS multiples
              in 2026.

              That separation matters because the implied multiple gap is huge. On Latka's 2021 revenue estimate, the
              2021 $1 billion round already implied about 23.1x revenue. On the 2024 ARR proxy, the 2022 $2.8 billion
              mark implies roughly 29.5x ARR, while even the official company floor of above $2 billion still implies
              more than 21x. Those ratios sit dramatically above current public anchors. Multiples.vc shows education
              software around 1.4x revenue and human capital management software around 2.4x in May 2026. Docebo's
              roughly 1.8x market-cap-to-ARR, Coursera's roughly 2.0x market-cap-to-revenue, Skillsoft's distressed
              roughly 0.13x market-cap-to-revenue, and Udemy's 0.4x EV/revenue all tell the same story from different
              angles.

              The right inference is not that Go1 deserves no premium. It clearly has enterprise reach, integrations,
              and a modern workflow story. The right inference is that any premium has to be measured in turns of ARR,
              not tens of turns. In 2026, the market is paying roughly 4x-5x for ordinary private SaaS, 7x-9x for
              stronger private assets, and far less for many public learning names. Go1 therefore deserves an inferred
              band, not blind acceptance of a stale mark.
