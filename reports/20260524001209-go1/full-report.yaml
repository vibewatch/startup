      - number: '1.3'
        title: Scale, milestones, and risk notes
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence for Go1’s maturity is cumulative rather than singular. Official pages, customer
              stories, and major funding coverage point to a company that has moved from a four-founder Brisbane startup
              into a global learning platform with broad content supply, many integrations, and repeated institutional
              funding. Public valuation milestones escalate from more than $1 billion in 2021 to more than $2 billion in
              2022, and Forbes Australia described the company as a roughly $3 billion business in 2023 after the
              Blinkist acquisition. But the same public record is uneven where an investor would want the most
              precision. Latka reports 2024 revenue of $94.8 million after $68.9 million in 2023; Growjo estimates a
              much higher annual revenue run-rate; LeadIQ places the company in a $50 million to $100 million band; and
              no audited private-company financial statements were located. Headcount is also inconsistent, with
              third-party estimates around 666 to 731 in 2025-2026 while Advance Queensland’s 2023 profile said more
              than 1,000 employees. Adverse signals are lighter than the funding narrative, but not absent: G2 review
              text flags immature AI recommendations and stale technical-course versions, and Gartner peer-review text
              cites document-accessibility and quiz-navigation friction. No major public layoff, lawsuit, or regulatory
              action was retained in this run, but given blocked databases and the limits of open-web adverse discovery,
              that absence should be treated as incomplete clearance rather than a positive finding.
