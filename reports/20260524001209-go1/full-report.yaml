      - number: '2.4'
        title: Market structure, platform consolidation, and evidence-based outlook
        blocks:
          - type: paragraph
            body: >
              Market structure is converging toward three layers. First are broad suites that combine LMS, LXP, content,
              analytics,

              assessments, and increasingly AI personalization in one contract. Second are content aggregators and
              libraries such as

              Go1 that can live inside an existing stack and widen coverage quickly. Third are AI-guided or
              practice-based point tools

              that address specific skill gaps, such as tutoring, simulations, labs, and job-role workflows. The
              Business Research

              Company's definition of corporate learning suites, Docebo's consolidation thesis, and Go1's partnerships
              with Decidr

              and CodeSignal all point in the same direction: buyers increasingly want fewer systems, stronger
              interoperability, and

              evidence that learning changes behavior rather than simply increases catalog breadth.


              That structure cuts both ways for Go1. The company's scale in provider breadth, language coverage, and
              ecosystem fit is

              a real advantage when a buyer wants fast content deployment without replacing an LMS. At the same time,
              consolidation is

              a real strategic threat because the same buyer may prefer a full-suite vendor if procurement is optimizing
              for one

              dashboard, one analytics model, and one owner across employee, customer, partner, and compliance learning.
              Public data

              does not let us isolate Go1's exact win rate or attach rate against those suites, so SOM should be treated
              as a bounded

              estimate rather than a precise number.


              The outlook is therefore constructive but selective. Growth in digital learning should continue through
              2030 because AI,

              compliance modernization, and skills volatility are durable tailwinds. But the revenue will concentrate in
              vendors that

              prove impact, personalize effectively, and reduce stack sprawl. For Go1, the most credible narrative is
              not "we address

              all corporate training" but "we sit in the fastest-moving content and discovery layer of enterprise
              learning, and we can

              compound share if we remain the easiest platform to integrate, govern, and expand with partners."
            claimRefs:
              - CM014
              - CM015
              - CM024
              - CM027
              - CM037
              - CM047
              - CM050
              - CM051
              - CM052
              - CM053
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Go1 is aligned with the part of the market buyers still want to fund
            body: >-
              Buyers are not asking for more undifferentiated training hours; they are asking for AI-relevant, governed,
              multilingual learning that fits existing systems and reduces admin work. Go1's aggregation model, provider
              breadth, and role-based positioning line up well with that requirement.
            calloutType: strength
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM048
          - type: callout
            title: Consolidation can help Go1 or compress it
            body: >-
              Vendor consolidation is a double-edged sword. It helps if Go1 becomes the preferred content layer inside
              an approved stack, but it can cap upside if suites convince buyers to collapse content, discovery,
              analytics, and compliance into one broader contract.
            calloutType: risk
            claimRefs:
              - CM031
              - CM032
              - CM033
              - CM047
              - CM049
          - type: callout
            title: AI upskilling and compliance are converging into one budget story
            body: >-
              The most interesting category shift is that AI training is no longer just an L&D initiative. Risk,
              compliance, HR, and executive teams now care whether employees are using AI safely and effectively, which
              expands the relevant buyer pool for platforms that can prove behavioral change.
            calloutType: insight
            claimRefs:
              - CM007
