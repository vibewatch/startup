  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与规模测算逻辑
        blocks:
          - type: paragraph
            body: >
              给 Go1 定位时，不能先把整个全球培训经济都拿来做参照，必须先画边界。最宽的分析师视角覆盖所有企业培训劳动力、服务、内容、软件和交付模式；这对理解需求有用，但承销一个内容聚合平台时过于宽泛。Go1
              核心可变现层更窄：外采数字学习内容、发现和编排，并插入雇主既有 LMS、HRIS 或学习栈。因此，广义企业培训 TAM、数字企业电子学习支出、集成学习套件支出，以及 LXP/发现层是嵌套关系，不可互换。


              市场证据在增长方向上一致，但在类别规模上不一致。6Wresearch 将广义企业培训市场估在 2025 年约 $395.2 billion，Mordor 将 2026 年企业电子学习估为 $115.74
              billion，The Business Research Company 将 2026 年企业学习套件估为 $6.35 billion。Technavio 将 2025 年 LXP 估为 $1.72
              billion，而透明度更低的 LXP 报告给出 2026 年约 $3.77 billion 或更高的大得多估计。这种跨度是边界问题，不是 Go1 能变现全部支出的证据。


              因此，一个可辩护的 Go1 SAM 应明显低于广义企业培训 TAM，又高于狭义学习套件/LXP 核心：它包括数字企业学习中外采内容和发现层，但排除讲师授课劳动力、内部内容生产和大多数平台外服务。公开证据支撑约
              $8-20 billion 的实际 SAM 区间；独立聚合平台的 SOM 只有低个位数十亿美元，因为套件厂商、内容市场和内部内容预算会切碎收入池。
