          - type: callout
            title: 只有大幅降价加真实尽调才能改变判断
            body: 本章支持继续尽调，而不是买入建议。变得可投的门槛，是显著更低的进入价，加上经审计 ARR、利润率、留存和股权结构条款的硬证据。没有这些证明，投资人承保的是故事质量，而不是估值质量。
            calloutType: recommendation
