      - number: '5.2'
        title: 集成与实施模式
        blocks:
          - type: paragraph
            body: >-
              Go1 设计上就活在既有 LMS 或 HRIS 栈内。官方集成页面承诺可通过 75+ 个技术伙伴访问，实施指南称客户应将 Go1 域名加入白名单，然后在集成平台路径、SCORM 交付或自定义集成之间选择。Go1
              自有帮助内容还说明，日常内容管理行为取决于底层 LMS 或 HRIS。换句话说，Go1 的上线模式不是「打开一个新应用，然后忽略其他系统」；它是嵌入式部署，会继承客户既有学习、身份和内容管理环境的复杂性。


              伙伴更新日志证实集成层仍在迭代。Workday、LearnUpon、Paycor 和 Schoox 在 2025 和 2026
              年均收到实质更新，明确提到技能分类映射、实时搜索、自动同步、注册跟踪、退役工作流和迁移工作。LearnUpon 自身集成页面进一步显示，在 Go1 内容叠进去之前，LMS 部署周围已有大量身份和 HRIS
              管道。这支撑一个核心尽调结论：Go1 的实施模式可信且成熟，但也很重集成，运营上并不轻。
