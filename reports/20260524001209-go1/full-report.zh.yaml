      - number: '7.2'
        title: 平台、内容授权和竞争风险
        blocks:
          - type: paragraph
            body: >-
              Go1 的分发优势也是它最大的战略风险之一。公司大力营销在 Microsoft Teams、Viva、Search 和合作伙伴系统里的原生交付；但 Microsoft 自己的文档说得很清楚：Go1 只是
              Microsoft 控制界面里的第三方内容源。添加 Go1 需要 Viva 许可证、管理员启用和供应商专属条款；非 Microsoft 供应商的个人订阅无法混进同一个体验。也就是说，Microsoft
              控制发现、位置和周边商业组合，而 LinkedIn Learning 以及 Microsoft 自有学习资产离操作系统更近。如果 Microsoft 扩大 LinkedIn Learning 或 Viva
              原生内容包，Go1 可能被压到低毛利的目录角色，即便使用量仍然高。


              更广的合作伙伴生态也有同样模式。Go1 的客户条款明确把公司定义为内容聚合商，Docebo、LMS365 和 D2L 也都把 Go1
              营销成嵌入式内容源，而不是自成一体的目的地。这放大了供应商流失、分成压力和合同覆盖的敞口。竞争数据强化了风险：6sense 按客户数和市场份额把 LinkedIn Learning 排在 Go1
              很前面；SourceForge 和 SelectHub 在买家比较中把 Go1、LinkedIn Learning 和 OpenSesame 列为直接替代品。SelectHub 自己的取舍很有信息量——Go1
              赢在广度和认证路径，但策展型对手能赢在一致性。换句话说，Go1 的差异化来自聚合和便利，不是底层学习供给的独家所有权。
