  - id: FU001
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: Go1 可观察的客户路径通常从系统蔓延或内容缺口切入，再进入嵌入式集成、策划式上线和更广的内部项目扩张。
