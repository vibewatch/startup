chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品模式与足迹
        blocks:
          - type: paragraph
            body: >-
              Go1 最清晰的公开身份，不是传统学习管理系统供应商，也不是课程生产方，而是面向以人为本 L&D 团队的内容聚合平台。官方页面口径一致：公司创建于 2015 年，将 250+
              家提供商的学习内容聚合进单一订阅，采用远程优先团队，同时仍在关键区域保留存在。官方地址线索把公司锚定在 Queensland Underwood Logan Road 2908；这与政府和杂志报道里的
              Logan/Brisbane 创业叙事相互吻合。与此同时，公开足迹数据并不完全干净：TechCrunch 2021 年描述了 London、美国、Singapore 和 Malaysia 办公室；Advance
              Queensland 后来称 Go1 有 13 个全球办公室、1,000+ 名员工；Craft 目前显示 San Francisco
              总部和一个办公室。因此，尽调结论不是「选一个城市、忽略其他信息」，而是「Brisbane 创立、Underwood
              锚定，同时采用全球分布式运营模式，第三方数据库卫生度嘈杂」。规模披露同样有多个分母。当前官方招聘营销称 Go1 获得超过 10,000 家客户信任，另一个当前产品页面宣传 Go1 学习社区有超过 180,000
              名客户，TechCrunch 在 2021 年引用 3.5 million 用户和超过 1,600 家企业客户，外部目录后来引用超过 2 million 用户或超过 8 million
              专业学习者。这些信号支撑真实采用，但不能拼成一个干净的头条指标。
