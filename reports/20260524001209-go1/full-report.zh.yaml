  - id: TV002
    title: 正反投资论点表
    columns:
      - 论点
      - 多头解读
      - 空头解读
      - 会改变判断的证据
    rows:
      - - 平台规模
        - 10,000+ 家组织、数百万学习者、250+ 家供应商和 75+ 个伙伴形成分发杠杆
        - 规模来自公司口径，仍缺少公开市场级别的经济性或留存披露来匹配
        - 审计后的客户 cohort 和扩张数据
      - - AI / 产品策略
        - Morgan 和情境化学习可能提升变现和参与度
        - 新策略可能只是叙事，未必带来可衡量的 ARR 提升
        - 2026 年发布产品带来的附加率或扩张证据
      - - 增长画像
        - Latka 显示 2023 至 2024 年增长 37.6%
        - 增长估算来自第三方且未经审计，收入质量未知
        - 含流失和 NRR 的审计 ARR 桥接
      - - 私募估值标记
        - 后期投资者按 >$2B、可能 $2.8B 的估值支持 Go1
        - 2022 或 2023 年后没有新的公开估值标记，追踪数据对最近一轮说法冲突
        - 要约 / 409A 或新一轮成交价
      - - 可比估值背景
        - Go1 是 B2B 且嵌入工作流，可能应高于上市学习类可比公司
        - 2026 年上市学习类可比公司和私募 SaaS 中位数都不支持 20x+ 倍数
        - 证明 Go1 该拿 8x-10x，而不是 4x-7x
    notes: 反向论点更多来自过时估值标记和公开收入质量证据薄弱，而不是产品怀疑。
