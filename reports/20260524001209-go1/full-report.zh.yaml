      - number: '5.4'
        title: 信任、隐私、可靠性与合规姿态
        blocks:
          - type: paragraph
            body: >-
              Go1 的公开信任姿态可见，但只有一部分可检查。隐私政策清楚表明 Go1 及其关联方会在站点、产品和服务中处理数据，这意味着其隐私和治理界面有实质体量。公开技术帮助集合提供了有用运营细节：Go1 发布了围绕
              SSO、AI 功能和数据处理、第三方内容访问问题，以及面向使用防火墙白名单、API 集成或 webhooks 客户的 2026 年 IP 变更通知的帮助内容。这些都是企业买方预期存在的运营控制和部署现实。


              公开限制在于，抓取到的信任中心界面没有以可读形式披露证书细节。同样，来源包没有暴露公开可用性 SLA 或丰富的官方事件历史。第三方监控 StatusGator 显示服务在运行日期处于可用状态，并提到
              2026-05-11 一次已确认中断；这比没有外部信号要好，但不能替代第一方可靠性报告。因此，信任故事方向上可信，但认证包、控制细节和 SLA 证据仍依赖私下尽调。
