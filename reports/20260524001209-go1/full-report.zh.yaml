      - number: '2.4'
        title: 市场结构、平台整合与基于证据的展望
        blocks:
          - type: paragraph
            body: >
              市场结构正向三层收敛。第一层是广义套件，在一份合同里组合 LMS、LXP、内容、分析、测评，以及越来越多的 AI 个性化。第二层是 Go1 这类内容聚合商和内容库，可以嵌入既有栈，快速扩大覆盖。第三层是 AI
              引导或练习型点工具，解决特定技能缺口，例如辅导、模拟、实验室和岗位工作流。The Business Research Company 对企业学习套件的定义、Docebo 的整合论，以及 Go1 与
              Decidr、CodeSignal 的合作，都指向同一方向：买方越来越想要更少系统、更强互操作性，并看到学习改变行为的证据，而不只是目录变宽。


              这种结构对 Go1 是双刃剑。买方想在不替换 LMS 的情况下快速部署内容时，Go1
              在提供商广度、语言覆盖和生态适配上的规模是真优势。与此同时，整合也是实质战略威胁，因为同一买方如果为了一个仪表盘、一个分析模型，以及覆盖员工、客户、伙伴和合规学习的一个责任方而优化采购，可能更偏向完整套件供应商。公开数据无法拆出
              Go1 面对这些套件的确切胜率或附着率，因此 SOM 应视为有边界的估计，而不是精确数字。


              因此，展望是建设性但有筛选。数字学习增长应延续到 2030 年，因为 AI、合规现代化和技能波动是持久顺风。但收入会集中到能够证明影响、有效个性化并减少栈蔓延的供应商手里。Go1
              最可信的叙事不是“我们覆盖全部企业培训”，而是“我们位于企业学习中变化最快的内容与发现层；如果仍是最容易集成、治理，并借伙伴扩张的平台，就能复利提升份额”。
