              在规模问题上，保留证据足以支撑 Go1 所称的组织覆盖广度，但还不足以完全支撑每一个头部指标。当前官网称超过 10,000 家组织信任 Go1，已明显高于较早的 3,000+ 家组织口径。Learning
              News 也称 Go1 服务超过 3.5 million 名学习者，因此公开材料清楚支撑了百万级学习者规模。它没有做到的是，用新的官方来源验证当前 5M+
              学习者数。更大的承保问题在集中度和证据质量。保留来源没有披露客户或合作伙伴按收入计的集中度，也没有披露 NRR、GRR 或流失率。与此同时，高细节 logo 证据大多来自 Go1
              撰写的案例研究，而不是客户独立撰写的引用。这不让客户故事变弱，但意味着广度的证据比持久性更充分，营销引用的证据比续约经济性更充分。
