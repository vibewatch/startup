              留存的唯一收入线轨迹来自第三方，而非官方。GetLatka 报告 Go1 2024 年收入为 $94.8 million，高于 2023 年 $68.9 million、2022 年 $62.9
              million、2021 年 $43.3 million 和 2020 年 $23.8 million；若按字面接受，这意味着到 2024 年同比增长约 37.6%。公开读数是 Go1
              已显著扩张，但该数字仍是外部估计，不是管理层指引或经审计财务。价格情报同样偏方向性，而非定论。Vendr 的已验证采购数据把 Go1 描述为按授权用户计费的合同，中位年度支出约 $16,000，200 席位
              Premium Essentials 部署每个授权年费约 $80，类似 Premium Pro 部署每个授权年费约
              $172。但其他公开数据库在入门价格和免费试用可用性上并不一致，这正是标价经济性只能作为指示、不能直接承销的原因。官方产品页面确实显示 Go1 正围绕可衡量结果变现：Reporting & Insights
