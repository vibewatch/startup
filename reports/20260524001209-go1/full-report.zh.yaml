        title: 乐观、基准和悲观情景
        blocks:
          - type: paragraph
            body: >-
              情景分析应从最新可观察 ARR 锚点出发，而不是管理层愿景。唯一带有同比细节的公开估算是 Latka 的 2024 年 $94.8 million，较 2023 年 $68.9 million
              上升。这一增长足以支撑相对教育软件均值的一定溢价，尤其因为 Go1 卖给雇主，而不只是消费者；但若没有经审计的留存和利润率证据，仅凭增长本身还不足以证明陈旧的 20x+ 私有估值合理。

              悲观情景假设 ARR 基本为 $90 million 到 $100 million，新产品方向没有转化为实质更好的变现，买家按硬公开可比公司或私有 SaaS 低端给 Go1 定价。按 3.5x-4.5x
              计算，估值约为 $315 million 到 $450 million。基准情景假设 ARR 为 $95 million 到 $110 million，倍数为 6x-7x；这仍高于公开教育软件，但低于私有
              SaaS 顶部。对应约 $570 million 到 $770 million。乐观情景假设 ARR 增至 $110 million 到 $130 million，Go1 的情境化学习策略足以支撑 8x-10x
              结果，对应约 $880 million 到 $1.30 billion。

              即便是乐观情景，也低于最后一个清楚披露的数十亿美元私有估值。25% 悲观、55% 基准、20% 乐观权重给出的中点约为 $680 million 到 $700
              million。这不是精确公允价值主张，而是公开证据下最可辩护的区间。实际结论很直接：今天要支撑数十亿美元定价，需要公开记录没有提供的私下证据。
