      - number: '8.4'
        title: 退出准备度、论点破裂触发项和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Go1 仍有真实的战略可选项。平台踩在学习内容聚合、雇主工作流集成和越来越多 AI
              辅助交付的交叉点。这样的画像可以吸引战略买家、寻求资本重组或结构化二级交易的财务买方；如果公司能把产品广度转化为公开级单位经济性，也可能最终吸引公开市场投资人。但按当前证据，IPO
              路径还没准备好。Coursera、Skillsoft、Docebo 和 Udemy 等公开可比公司，都让投资人持续看到收入、利润率和申报节奏；Go1 还没有。

              披露缺口决定了最终建议和终止标准。如果新一轮要约或融资低于约 $1 billion，如果经审计 ARR 明显低于当前 $94.8 million 代理，或者毛利率和留存不像高溢价
              SaaS，当前溢价故事就会破裂。反过来，如果尽调显示留存强、利润率有吸引力、集中度低，并且股权结构不会让普通股卡在陈旧优先权栈之下，投资案例会明显改善。

              阻断性尽调清单并不抽象。投资人需要经审计的 2024-2026 年 ARR 和收入、毛利率和现金流历史、NRR 和流失率、客户集中度、股权结构清算瀑布，以及任何近期二级交易或 409A
              材料。没有这些，章节只能支持继续研究姿态，并支持有纪律地拒绝把旧估值当成当前估值来承保。
