companyProfile:
  summary: >-
    Go1 是 2015 年成立于澳大利亚的企业学习平台，把第三方培训内容聚合进单一订阅，并通过既有 HR、LMS 与协作工作流分发。公开证据支撑了广泛产品足迹——250+ 家内容提供商、75+ 个集成、Go1
    Learn、Pay、Insights 等工作流产品，以及覆盖制造、公用事业、教育、交通、媒体和能源的具名客户验证。Go1 已明显越过早期阶段：官方材料称服务超过 10,000 家组织，官方融资文章称累计融资超过 $400
    million、估值超过 $2 billion；留存的私有数据库估计 2024 年 ARR 接近 $94.8 million。核心承销问题不是 Go1
    有没有触达，而是公开证据能否守住最新私募估值，尤其在盈利能力、留存和股权结构经济条款仍未披露的情况下。
