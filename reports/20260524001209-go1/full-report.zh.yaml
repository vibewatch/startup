  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面、目录与学习者体验
        blocks:
          - type: paragraph
            body: >-
              Go1 的产品最好理解为内容聚合和交付平台，而不是独立课程创作套件。官方产品包强调庞大的第三方目录、多语言覆盖、经过策展的播放列表、AI
              辅助发现，以及可围绕角色、技能、近期活动和强制期限个性化的学习者体验。Morgan 通过把推荐学习推送到员工已经工作的地方，延展了这个模式；但官方描述谨慎地说明，Morgan 运行在 L&D 团队已在 Go1
              Learn 配置好的项目和作业之上。


              这一区分很重要。公开证明最强的是目录广度、策展工作流和嵌入式交付；在自有教学法或独有内容上较弱。Learning Services 强化同一点：Go1 销售的是软件加人工策展和实施支持。这让精简 L&D
              团队更容易采用产品，但也暗示部分客户价值仍依赖服务层和伙伴内容质量，而不是深度自研的学习引擎。
