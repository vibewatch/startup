      - number: '2.2'
        title: 买方画像、预算归属与采购动作
        blocks:
          - type: paragraph
            body: >
              Go1 自身定位让学习平台的买方图谱异常清楚。公司直接面向 L&D 经理、HR 经理、合规经理和高管层做营销，这意味着采购单元由多方组成，而不是单一的“学习管理员”画像。实际中，L&D
              负责内容策略和采用报告；HR 和人事团队关注工具安全使用、入职和留存；合规负责人关注可审计性、隐私和政策执行；高管赞助人想要一个能上董事会的问题答案：AI 和技能项目是否真的改变行为。


              预算归属通常跟用例走。企业 L&D 和 CHRO 组织是默认经济买方，但大型雇主仍主导企业电子学习支出，这意味着 CFO
              审核、采购控制、SSO、数据治理检查，以及与锚定系统集成都是动作的一部分。Technavio 明确称，买方评估正从功能清单转向生态互操作性和技能本体支持；Go1
              的合作伙伴公告解释了原因：企业买方越来越希望内容、分析和岗位专项练习流经同一套栈，而不是停在彼此断开的点工具里。


              这形成了 Go1 典型采用路径：围绕 AI、技能或合规出现高管触发；预算方对齐；按 LMS/HRIS
              和报告需求评估栈适配；做一个经过策展的试点；如果平台能证明完成率、使用一致性和业务影响，再扩大部署和增购。Go1 单一订阅、多提供商模式的强处，是它契合这种采购逻辑；风险是同一逻辑也可能偏向更宽的套件，尤其当
              Go1 被视为“又一个供应商”，而不是已获批生态里的内容层。
