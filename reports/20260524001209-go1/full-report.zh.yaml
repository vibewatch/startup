  - id: TV005
    title: 论点破坏与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 新一轮下调融资或要约重置
        - 任何低于 ~$1B 的定价事件
        - 确认上一轮数十亿美元估值标记已经过时，并压缩回报潜力
        - 停止按旧估值标记测算，改用新的成交价重建模型
      - - ARR 不达预期
        - 审计 ARR 明显低于 $94.8M 公开代理值
        - 压缩所有情景的分子，并质疑增长质量
        - 立即下调估值区间基准
      - - 留存或利润率画像偏弱
        - NRR 低于高溢价 SaaS 水平，或毛利率结构性偏弱
        - 如果经济性更像重内容或重服务，高溢价倍数论点就会消失
        - 转向空头情景倍数
      - - 客户集中度高
        - 一个或少数账户主导收入
        - 抬高续约风险，削弱战略稀缺性
        - 施加集中度折扣，并重审退出路径
      - - 产品策略无法变现
        - Morgan / 情境化学习没有提升扩张、定价或附加率
        - 多头情景假设没有兑现
        - 只保留基准至空头估值区间
    notes: 否决标准可监测，并直接绑定估值传导，而不是泛泛的公司风险。
    claimRefs:
      - CV046
      - CV050
      - CV051
      - CV052
      - CV058
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 审计 ARR 和收入桥接
        - 2024-2026 年月度和年度 ARR / 收入
        - 本章所有隐含倍数的核心分母
        - 索取审计报表和董事会 KPI 包
      - - 毛利率和现金流
        - 毛利率、EBITDA、FCF 和内容成本结构
        - 决定 Go1 应拿高溢价 SaaS 倍数，还是内容平台倍数
        - 索取审计 P&L、现金流和利润率桥接
      - - 留存质量
        - NRR、GRR、logo 流失、cohort 扩张和分部门续约
        - 高溢价估值需要证明扩张可持续，不能只有收入规模
        - 索取客户 cohort 仪表盘和续约报告
      - - 客户集中度
        - 前 10 大客户，以及任何 OEM 或渠道依赖
        - 少数大客户会扭曲 ARR 质量和退出价值
        - 索取收入集中度明细
      - - 股权结构和优先权
        - 完全摊薄股权、优先权栈、附函、ROFR/ROFO、要约权利
        - 降价情景下，实际回报可能与企业价值大幅背离
        - 索取股权结构和 waterfall 模型
      - - 最新价格发现
        - 任何 2025-2026 年要约、409A 或二级成交价
        - 需要用当前市场证据替换过时的 2022/2023 锚点
        - 索取最新 409A、要约文件或经纪商指征
    notes: 这些要求是阻断项，不是可选项。没有这些材料，新投资者押注的更多是叙事质量，而非估值质量。
    claimRefs:
      - CV020
      - CV046
      - CV055
      - CV057
      - CV058
