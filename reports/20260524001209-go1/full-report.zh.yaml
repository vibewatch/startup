      - number: '3.3'
        title: Microsoft 分发力、平台捆绑，以及为什么外壳重要
        blocks:
          - type: paragraph
            body: >
              最重要的反向动态，是 Microsoft 控制外层工作流外壳。Viva Learning 不只是另一个目录；它是 Teams 和 Microsoft 365 原生枢纽，可以呈现 Microsoft
              Learn、精选 LinkedIn Learning 内容、面向拥有合适订阅客户的完整伙伴库，以及 LMS 托管作业。Microsoft 定价页显示，基础学习访问部分包含在 Microsoft 365
              企业计划中，伙伴内容、推荐和完成跟踪可通过付费 Viva 许可证解锁。这个捆绑意味着既有 Microsoft 客户不必先决定标准化到单独 LXP，就能试用学习枢纽。独立评测强化了这个含义：Viva 仍不是完整
              LMS/LXP，但足以在 Teams 内部占住发现入口，而很多企业员工的一天已经在那里度过。这给 Go1 带来具体风险。如果客户入口变成 Teams，且客户能从这个外壳拉入 LinkedIn、Microsoft
              Learn、Go1、Coursera、Skillsoft 或其他伙伴内容，Go1 的面向用户差异化会变窄。在这种世界里，Go1 只有当其聚合、策展和合规支持足够强，才有理由成为他人界面之下的内容层。
