  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 判断
      - 证据锚点
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 平台规模真实，但估值支撑仍是间接证据
        - 不要按过时的数十亿美元估值标记来测算
      - - 确信度
        - 中低
        - 公开资料显示规模和可比公司差距，但没有审计后的收入质量
        - 保留较宽估值区间，并要求尽调
      - - 风险评级
        - 高
        - 估值标记过时、收入质量指标缺失、股权结构不透明
        - 偏好结构化进入，或场边观察
      - - 估值立场
        - 在 $2B+ 偏贵 / 在 $2.8B 过度拉伸
        - 按最新公开 ARR 代理值隐含 21.1x-29.5x，而上市可比区间为 0.1x-2.0x
        - 只有明显低于上一轮估值标记才有吸引力
      - - 指示性入场纪律
        - 低于 ~$800M，且取得数据室权限
        - 只有大幅降价后，基准区间和下行不对称才改善
        - 只按带价格的尽调推进，不追品牌名气
      - - 可能退出路径
        - 财务投资方二级资本重组或战略出售
        - 当前披露质量还没达到公开市场要求
        - 不要假设近期 IPO 流动性
    notes: 建议明确取决于价格。这是基于 2026 年可观察证据集的判断，不是只看产品质量的结论。
