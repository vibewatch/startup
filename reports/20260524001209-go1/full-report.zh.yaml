      - number: '7.3'
        title: 运营、网络安全和信任不透明风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Go1 更像分布式内容和集成经纪商，而不是数据边界封闭的纯 SaaS 应用。隐私政策称，公司处理职业和雇佣数据、教育经历、地理位置、浏览活动和推断偏好。它还称，Go1
              用有限画像做个性化，并以处理者身份处理客户平台数据。这种组合带来实质性的隐私和泄露面：一旦公司误处理学习者数据、候选人或员工数据，或跨境传输，法律后果会同时落到企业客户流程和 Go1
              自控流程上。评价语料又在隐私风险之外叠加产品质量风险，反复抱怨内容不一致、搜索精度弱、个性化有限，报告能力也比完整 LMS 更薄。


              网络安全尽调也受公开不透明度限制。公开 Trust Center
              确实存在，但未登录入口通过抓取几乎看不到可直接审阅的细节，外部人很难在没有门禁访问的情况下验证公司宣称的安全材料。这不能证明安全薄弱；但意味着外部投资人仅靠公开材料无法独立排除该问题。Go1
              还依赖多个集成和合作伙伴界面，即便是合作伙伴侧的认证失败、同步错误或 API
              变更，也可能先拉低用户体验，而不是以经典「宕机」形式披露。由此留下的剩余风险，不太是一次灾难性技术故障，而是信任、数据处理和目录质量摩擦持续累积，逐步侵蚀续约质量。
