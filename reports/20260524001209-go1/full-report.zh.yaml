  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和隐私风险
        blocks:
          - type: paragraph
            body: >-
              Go1 最具体的法律敞口不是消费者诉讼或已公布的监管行动，而是与 OpenSesame 仍在进行的 IP 纠纷。PacerMonitor 显示，OpenSesame 2021 年在 Oregon District
              Court 起诉 GO1 Pty, Ltd.；该案到 2026 年 5 月仍在推进，包括驳回撤诉动议和一份权利要求解释令。Go1 2024 年提起的一个 Federal Circuit / PTAB
              挂钩上诉也确认，这场争斗仍在消耗管理层时间和法律预算。Go1 是聚合商，价值主张依赖广泛接入第三方目录资产；即便没有披露损害赔偿金额，持续的专利和平台诉讼也不是小干扰。


              隐私和合同敞口更广，也更结构性。Go1 称，对自有网站、营销、支持和分析数据，它是控制者；对客户平台数据，它是处理者。公司还称，个人信息默认存储在美国和澳大利亚，并用有限画像来个性化学习。这些披露与
              Australian Privacy Principles、Privacy Act 1988、ACCC 合同可执行性以及 Fair Work 雇佣合同规则叠在一起。Go1 的客户条款又增加商业摩擦：服务按 12
              个月自动续约，费用按年预付，内容提供商协议可以覆盖标准客户条款。没有已披露的监管函件，所以当前监管风险仍落在「潜在但重要」桶里，而不是「已经兑现」；但与澳大利亚相连的隐私、雇佣和合同栈显然是尽调重点。
