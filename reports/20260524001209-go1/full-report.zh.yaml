      - number: '4.3'
        title: 资本充足性、融资效率与备案证据
        blocks:
          - type: paragraph
            body: >-
              融资比盈利能力更可见。Go1 自有融资文章称，公司在 2022 年轮次融资超过 $100 million，累计融资超过 $400 million，估值超过 $2
              billion。独立市场数据和媒体来源显示，2023 年仍有融资，但相较 2021-2022 年的跃升规模小得多；Tracxn 列出 2023 年 5 月 $30 million Series D，Private
              Equity Media 报道该轮融资将公司估值约 $3.5 billion，资金主要用于支持 Blinkist 收购。这段融资历史意味着 Go1
              获得过有意义的资本通道，但规模效率问题仍然开放，因为留存来源没有披露集团现金余额、烧钱速度或经营利润率。最清晰的硬备案证据来自 Go1 UK Learning Limited。Companies House 显示
              FY2024 账目于 2025 年 7 月提交；账目本身报告 £11.9 million 营业额、仅 £3,928 经营利润、£491 税后利润、负 £6.08 million 净流动资产/负债、欠集团企业
              £6.34 million，以及转为 £0.6 million 流出的经营现金流。该备案不能替代 Go1 合并经济性，但确实显示一个有意义的本地实体；其营运资本位置和公司间余额，使融资依赖很难被当作理论风险略过。
