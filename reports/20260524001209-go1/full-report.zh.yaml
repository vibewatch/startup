            body: >-
              Go1 官方财务故事从包装开始，而不是经审计收入。公司通过单一订阅模式销售聚合学习内容平台，意在替代多个供应商；当前套餐页面展示三档商业套餐：Essentials Select for small
              teams、Premium Essentials 和 Premium Pro。官方页面强调广度而不是标价，突出超过 80,000 门课程、超过 250 家提供商、超过 40 种语言和超过 75
              个集成伙伴。这告诉投资人，收入模式是经常性、面向企业的，但没有透露实际合同价值、折扣或续约质量。最强官方牵引证据来自客户成果营销：首页和客户故事中心提到超过 10,000 家组织，案例指标包括参与度增加
              20%、活跃学习者增加 3x，以及更具体的成果：Wave Utilities 将完成率从 78% 提升到 98%，Atlas Tech 将覆盖从 10% 员工扩大到 100%，JCDecaux 每年节省
