  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同行、套件邻近竞争与真实决策集
        blocks:
          - type: paragraph
            body: >
              买方评估 Go1 时，不会只看一个对标对象。直接重叠从大型内容所有者和企业学习目录开始——LinkedIn Learning、Coursera for Business、Udemy Business 和
              Skillsoft——因为它们都销售大型外部课程库、AI 辅助发现或练习，并把企业分发带入领导力、合规、技术和 AI 准备度等常见技能提升类别。邻近威胁来自把内容和更广工作流控制结合起来的套件：Microsoft
              Viva Learning 用 Teams 和 Microsoft 365 作为发现界面；Cornerstone、Docebo 和 360Learning 把内容放进更大的学习、技能、协作和管理栈。因此，Go1
              经常面对的是“一份合同、一个壳”的方案，而不只是另一个中立市场。Go1 最好的对比叙事仍是广度加中立性——超过 10,000 家组织、250+ 家提供商、75+
              个集成——当企业想要选择权，而不是押注单一出版方或单一套件时，这很有吸引力。弱点是几个对手掌握内容、学习者入口，或两者兼有。一旦发现入口迁入 Teams、既有 LMS 或套件自有主页，Go1
              就有从目的地变成连接器的风险。
