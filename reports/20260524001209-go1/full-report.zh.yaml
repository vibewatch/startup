  - id: TV004
    title: 可比估值表
    columns:
      - 参照
      - 状态
      - 观测指标
      - 隐含倍数 / 估值背景
      - 重要性
      - 关键限制
    rows:
      - - Go1 Jun-2021 Series D 轮
        - 已验证私募估值标记
        - Tracxn 显示投后 $1.0B；独立报道称本轮 $200M
        - 基于 Latka 2021 收入代理值：~23.1x
        - 表明 2021 年投资者已经为学习软件支付溢价倍数
        - 使用第三方历史收入估算
      - - Go1 May/Jun-2022 融资
        - 已验证下限 + 追踪器估值标记
        - 官方下限 >$2B；Tracxn 显示 $100M 融资对应 $2.8B
        - 基于最新公开 ARR 代理值：>21.1x 至 ~29.5x
        - 这是最可能扭曲当前投资测算的过时锚点
        - 没有审计 ARR，也没有披露新的 2023 年投后估值
      - - Docebo May-2026
        - 上市可比公司
        - $440M 市值；$248.9M ARR；Q1 收入 $65.6M
        - ~1.8x 市值 / ARR 代理值
        - 最贴近的上市企业学习 SaaS 可比公司，且增长和利润率为正
        - 股权价值代理值，非完全调整 EV
      - - Coursera May-2026
        - 上市可比公司
        - $1.52B 市值；FY2025 收入 $757.5M
        - ~2.0x 市值 / 收入
        - 规模化学习平台，同时暴露企业和消费者业务
        - 业务结构不同，消费者端足迹大得多
      - - Skillsoft May-2026
        - 困境上市下行样本
        - $64.29M 市值；FY2026 收入 $513M
        - ~0.13x 市值 / 收入
        - 说明学习软件情绪走弱时，下行定价会有多严厉
        - 老牌资产，杠杆和增长画像差异很大
      - - Udemy May-2026
        - 上市可比公司
        - 基于 $797M LTM 收入的 $329M EV
        - 0.4x EV / 收入
        - 显示缺少稀缺溢价的宽口径学习市场，市场愿意支付的价格很低
        - 业务结构包含消费者市场动态
      - - Cornerstone Aug-2021 私有化
        - 战略交易先例
        - $5.2B EV，签约时溢价 31%
        - 零利率市场中的控制权溢价
        - 可作为规模化战略学习 / 人才软件的上限参照
        - 旧利率环境不能直接套用到 2026 年
      - - 2026 年私募 SaaS 区间
        - 推断基准
        - L40 中位数 ~4x-5x，头部层级 ~7x-9x；Flippa 3x-10x
        - Go1 必须落在这些区间内，或清楚证明自己高于区间
        - 把上市可比公司和私募投资测算区间连接起来
        - 通用 SaaS 区间，不是 Go1 专属交易
    notes: 本表刻意拆分已验证私募估值标记，以及推断得来的上市和私募可比区间。Go1 行是估值标记；其余是当前锚点。
    enumerationScope:
      coverage: partial
      basis: >-
        Partial comparable set covering the most relevant disclosed public learning-software references, a strategic
        take-private precedent, and 2026 private SaaS valuation guides; many private learning-platform marks remain
        undisclosed.
