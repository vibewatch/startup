      - number: '1.2'
        title: 领导层、治理与资本基础
        blocks:
          - type: paragraph
            body: >-
              领导层可见度足以识别创始人核心，但不足以仅靠公开材料承销治理。当前官方 About 页面结构化数据将 Chris Eigeland 列为 CEO、Andrew Barnes 列为董事，并将 Vu Tran 和
              Chris Hood 列为联合创始人。外部目录和人物数据库落后于这幅图：Growjo 仍把 Andrew Barnes 列为 CEO/联合创始人，几家商业数据库只暴露局部组织图或法律实体片段。这个错位重要，因为
              Go1 仍像一家创始人色彩很重的公司，战略叙事集中在少数长期任职高管手里；实际董事会名单、委员会结构、观察员权利和控制条款仍属私密。资本形成比治理清楚得多。TechCrunch 报道 2021 年 7 月
              $200 million Series D，估值超过 $1 billion，使 Go1 成为独角兽；2022 年官方融资文章和 OIF Ventures 转发的 TechCrunch 报道又支撑了一轮超过
              $100 million 的融资，估值超过 $2 billion，累计融资超过 $400 million。这些来源还识别出一组稳定投资人，包括 SoftBank Vision Fund
              2、AirTree、Salesforce Ventures、Madrona、SEEK、Y Combinator 等。2022 年官方文章补充了一个重要运营读数：北美已成为最大市场，Go1 正借
              Coorpacademy 等收购扩大欧洲内容和语言覆盖。
