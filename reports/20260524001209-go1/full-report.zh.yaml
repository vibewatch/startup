            body: >-
              Go1 的公开客户基础看起来是横向的，而不是利基型。James Hardie、Wave Utilities、Ivanhoe Grammar、CAMILLA、ABC Companies、Duravant 和
              Arrow Energy 等案例中，买方通常是 L&D、HR、人才或安全/合规负责人；学习者是员工、经理或一线工人；付款方是为员工培训买单的雇主。GetApp 仍把典型客户描述为中型和大型企业，但官网现在称
              Go1 获得超过 10,000 家组织信任，这意味着较早的 3,000+
              家组织说法更像是已向上过时，而非激进口径。具名证明覆盖制造、公用事业、教育、零售、航空、交通、能源、媒体和公共劳动力项目，例子遍布澳大利亚/APAC、英国、美国、新加坡以及全球分布式员工队伍。这种广度符合 Go1
              作为内容层跨雇主类型和地域迁移的定位，尽管公开材料仍很少说明收入究竟如何按细分、规模或地区拆分。
