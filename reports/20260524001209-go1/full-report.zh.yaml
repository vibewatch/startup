          label: 需求识别
          detail: L&D、HR、人才或安全买方在旧系统里看到内容碎片化、合规压力或参与度偏弱。
          tone: warning
        - id: f2
          label: 集成候选
          detail: 客户寻找一层内容，能嵌入 Workday、SAP SuccessFactors、Learn365 或 Microsoft 等既有系统。
          tone: neutral
        - id: f3
          label: 嵌入式上线
          detail: 客户把 Go1 放进现有 LMS、HRIS 或 Microsoft 工作流，而不是一口气替换所有系统。
          tone: positive
        - id: f4
          label: 策划式铺开
          detail: 管理员为合规、入职、技术或领导力场景筛选内容、编排播放列表和配置报表视图。
          tone: positive
        - id: f5
          label: 自助采用
          detail: 员工开始自助选课，经理跟踪完成情况；内容更容易查找和分配后，摩擦下降。
          tone: positive
        - id: f6
          label: 项目扩张
          detail: 账户增加用例、渠道或受众，但公开证据仍不足以看到续约或集中度经济性。
          tone: warning
