      - number: '5.3'
        title: 运营架构与开发者界面
        blocks:
          - type: paragraph
            body: >-
              公开层面，Go1 同时呈现两条技术故事。第一条是内容发现和交付背后的运营架构：提供商摄入、AI 辅助策展、面向学习者的个性化、分析，以及通过 LMS 或 HRIS 环境由伙伴交付的访问。第二条是围绕
              Publishing APIs、集成指南、API 参考和嵌入 SDK 构建的开发者故事。一个带当前构建标签的在线 API 根地址证实有活跃服务端点存在；伙伴更新日志显示 Plan API、Portal
              API、搜索 APIs 和退役 webhooks 等生命周期功能。


              与此同时，公开开发者证明比 URL 足迹最初显示得更浅。文档概览和 API 参考 URLs 能成功解析，但未经认证抓取时主要渲染为 JavaScript 外壳；公开 Postman
              页面也更像存在性证明，而不是完全可读的规格。这并不意味着平台不成熟；它意味着外部开发者更容易确认 APIs
              存在，却较难获得深入、无摩擦的公开技术走查。因此，架构看起来已足够成熟，能支持嵌入式伙伴交付；但开放程度低于完整公开开发者生态。
