      - number: '1.3'
        title: 规模、里程碑与风险提示
        blocks:
          - type: paragraph
            body: >-
              支撑 Go1 成熟度的最强证据是累积性的，而不是单一证据点。官方页面、客户故事和主要融资报道都指向一家公司：它已经从 Brisbane
              四位创始人的创业公司，发展成有广泛内容供应、多项集成和多轮机构融资的全球学习平台。公开估值里程碑从 2021 年超过 $1 billion 升至 2022 年超过 $2 billion；Forbes
              Australia 在 2023 年 Blinkist 收购后称公司规模约 $3 billion。但同一公开记录在投资人最需要精度的地方并不平整。Latka 报告 2024 年收入 $94.8
              million，2023 年为 $68.9 million；Growjo 估计的收入运行率高得多；LeadIQ 将公司放在 $50 million 到 $100 million
              区间；本轮未找到经审计的私营公司财务报表。员工数也不一致，第三方估计 2025-2026 年约 666 到 731，而 Advance Queensland 的 2023 年简介称员工超过
              1,000。反向信号比融资叙事轻，但并非不存在：G2 评论文本指出 AI 推荐不成熟、技术课程版本陈旧；Gartner
              同行评审文本提到文档无障碍和测验导航摩擦。本轮未留存重大公开裁员、诉讼或监管行动，但考虑到受阻数据库和公开网络反向发现的边界，这种缺席应视为排查不完整，而不是正面结论。
