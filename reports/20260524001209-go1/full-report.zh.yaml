      - number: '2.3'
        title: 需求驱动、采用约束与反向证据
        blocks:
          - type: paragraph
            body: >
              最强需求驱动很容易在公司、分析师和劳动力数据之间相互印证。AI 技能提升已从小众技术主题变成企业级运营问题：Go1 调查称 57% 员工在过去一个月使用过 AI 学习工具，近 70% 每周使用；Coursera
              报告企业 GenAI 注册量同比增长 234%；LinkedIn 称招聘启事中的 AI 技能需求在 12 个月内上升 142%。与此同时，合规不再只是年度证明。Go1 围绕数据隐私和获批工具治理营销 AI
              培训；TechClass 认为 AI、隐私和不当行为执法正在把买方从打勾式合规推向可证明的运营能力。


              宏观劳动力背景强化了这个增长逻辑。D2L 称留存仍是高管最关心的问题之一，学习是首要留存杠杆；WEF 和 Training Industry
              都认为，技能变化仍然显著，尽管颠覆节奏比疫情后最混乱时期缓和。这有利于平台把岗位专项、多语言、嵌入工作流的学习推给分布式团队，而无需搭建新的本地基础设施。


              反向证据同样重要。TalentLMS 称员工缺少培训时间，Docebo 称 85% 员工无法把 AI 培训用于实际工作，Training Industry
              警告经济不确定性又一次把学习预算置于风险之下。实际读数是：需求真实存在，但买方对通用目录、弱个性化，或无法在工作流中证明相关性的项目越来越没耐心。COVID
              后常态化并没有抹掉数字学习需求；它把支出转向可衡量结果、工作流适配，以及有针对性的技能或合规问题。
