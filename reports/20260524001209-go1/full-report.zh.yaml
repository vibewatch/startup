      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 私有估值陈旧是核心负面事实
            body: >-
              Go1 也许仍是优质公司，但最后清楚披露的估值已经很旧。公司 2022 年官方只说「超过 $2B」，Tracxn 显示 2022 年 $2.8B，以及 2023
              年一轮没有新投后估值的扩展轮；其他私有数据库对总融资和最新轮次标签并不一致。这组证据意味着，私有估值不是可靠的当前公允价值锚。
            calloutType: risk
            claimRefs:
              - CV008
              - CV012
              - CV013
              - CV014
              - CV020
          - type: callout
            title: Go1 应该相对疲弱的公开教育科技公司有溢价，但不是无限溢价
            body: >-
              公司的雇主焦点、内容聚合和集成，让它强于承压的公开学习公司。但当前公开锚点约 0.1x-2.0x，2026 年私有 SaaS 中位数约 4x-5x，仍限制了理性投资人能拉伸的空间。可辩护的溢价有可能存在；陈旧的
              20x+ ARR 锚点则不成立。
            calloutType: insight
            claimRefs:
