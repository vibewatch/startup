      - number: '3.4'
        title: 护城河耐久性、内容重叠与反对高估差异化的理由
        blocks:
          - type: paragraph
            body: >
              Go1 的护城河应视为有意义，但有条件。耐久部分是提供商中立的广度：如果企业想要一份订阅覆盖 250+ 家提供商、多语言目录、策展，并分发进既有栈，Go1
              明显为这项任务做了优化。较弱部分是排他性。LinkedIn、Coursera、Udemy、Skillsoft 和 Cornerstone 都营销广泛外部内容集；其中几家还营销 AI 辅导、AI
              熟练度、实验室、认证或技能层。换句话说，通用商业、合规、领导力和 AI
              主题并不稀缺。内容重叠度高，使多归属可行，也降低赢家拿走大部分结果的概率。套件厂商通过承诺一份合同覆盖内容、管理、分析、合规、技能和协作，加深了这种压力。Microsoft 另加一层威胁：如果学习发现由
              Teams 和 Microsoft Search 控制，分发力可能比目录广度更重要。严厉但公允的竞争结论是，Go1
              的差异化在混合栈编排中最强，在面向用户的所有权上最弱。承销一条持久边之前，投资人应想看到已实现净定价、按竞争对手编码的赢单/输单，以及 Go1 嵌入另一个平台而非作为主要学习首页时是否仍能驱动参与的证据。
