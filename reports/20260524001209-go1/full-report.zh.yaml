      - number: '3.2'
        title: 能力广度、公开包装以及 Go1 容易/难比较之处
        blocks:
          - type: paragraph
            body: >
              能力广度不是 Go1 的核心短板。官方产品页面展示了 AI 辅助搜索、并排课程比较、智能首页、多语言交付，以及经由既有 LMS、LXP、HRIS
              和协作工具的分发。更难比较的是经济性和结构。Microsoft、Udemy 和 360Learning 公布了足够价格信息，销售开始前就能锚定采购对话；Go1、Coursera
              enterprise、Cornerstone、Skillsoft 和 Docebo 仍主要靠报价。这一点重要，因为即便最终合同需要谈判，公开锚点也会影响买方预期。不同供应商类别的产品范围也不一样。Coursera
              和 Udemy 强调自有目录、证书和 AI 辅助练习；Cornerstone、Docebo 和 360Learning 强调围绕学习体验的更宽管理、合规、技能和协作层；LinkedIn 和 Microsoft
              融合内容、技能数据和工作流分发。Go1
              夹在这些阵营之间：作为中立聚合商强于纯内容所有者，但原生管理深度比完整套件更轻。买方想要广度又不拆掉既有系统时，这很有吸引力。买方想让一个供应商包下内容、跟踪、技能和前端分发时，Go1 可能显得多了一层。
