      - number: '4.4'
        title: 反向财务视角、正常化风险与尽调阻塞
        blocks:
          - type: paragraph
            body: >-
              反向财务视角不是可见困境，而是透明度不足叠加外部数据冲突。评论和价格情报来源显示，买方可能认为 Go1 比替代 LMS 工具更贵，报告能力更弱，或行业专项内容不足。这一点重要，因为 Go1 官方定位明确强调
              ROI 和预算整合：如果不同细分的客户价值不均，实际留存和扩张经济性可能弱于营销表面。公开数据也在关键正常化输入上冲突。官方页面引用超过 10,000 家组织，甚至超过 180,000 名社区客户，而
              GetLatka 列出 3,000 名客户；员工数估计在 GetLatka 和 Tracxn
              之间差异明显；价格数据库在入门价格、免费试用状态和资源广度上也不一致。最重要的是，留存的官方、备案或新闻来源都没有披露合并毛利率、烧钱速度、现金跑道、NRR、CAC
              或经审计集团收入。这意味着投资人可以讨论收入轨迹、包装和已融资本，但没有私有数据室就无法正常化盈利能力或规模效率。正确结论应由证据牵引，而不是想象：Go1
              可能在打造耐久订阅业务，但公开证据仍让盈利能力、融资依赖和正常化单位经济严重欠明确。
