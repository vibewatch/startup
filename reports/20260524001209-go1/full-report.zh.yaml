  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议遵循一条简单链路：真实规模和工作流相关性支撑溢价潜力，但陈旧估值标记和缺失的收入质量证据，挡住了今天的买入结论。
    data:
      nodes:
        - id: n1
          label: 已验证规模
          description: 10,000+ 家组织、数百万学习者、250+ 供应商、75+ 合作伙伴
        - id: n2
          label: 溢价潜力
          description: 面向雇主、嵌入工作流的模式，可能值得高于通用 edtech 倍数
        - id: n3
          label: 陈旧私募估值标记
          description: 2021 $1B 和 2022 >$2B / $2.8B 已过时，且不同追踪口径不一致
        - id: n4
          label: 收入质量缺口
          description: 缺少经审计 ARR、NRR、毛利率、FCF 或股权结构瀑布
        - id: n5
          label: 推断重置区间
          description: 公开证据推断区间为 $380M-$855M，中点约 $680M-$700M
        - id: n6
          label: 继续研究
          description: 只有在低于约 $800M 的结构化入场价，并拿到数据室证明时，才值得重看
      edges:
        - from: n1
          to: n2
          label: 支撑一定溢价
        - from: n2
          to: n5
          label: 但必须落在 2026 市场区间内
        - from: n3
          to: n5
          label: 迫使陈旧估值标记下调
        - from: n4
          to: n6
          label: 挡住买入建议
        - from: n5
          to: n6
          label: 界定价格纪律
    approximationNotes: 逻辑图把本章推理压缩为决策节点。它不是经营表现的因果模型。
