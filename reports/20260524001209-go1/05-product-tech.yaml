- id: architecture-developer-surface
  title: Operating architecture and developer surface
  body: |-
    Publicly, Go1 exposes two technical stories at once. The first is the operating architecture behind content discovery and delivery: provider ingestion, AI-assisted curation, learner-facing personalization, analytics, and partner-delivered access through LMS or HRIS environments. The second is a developer story built around Publishing APIs, integration guides, API references, and an embedding SDK. A live API root with a current build tag confirms that an active service endpoint exists, and the partner-update log shows lifecycle features like Plan API, Portal API, search APIs, and retirement webhooks.

    At the same time, the public developer proof is shallower than the URL footprint initially suggests. The docs overview and API-reference URLs resolve successfully but render mainly as JavaScript shells in unauthenticated fetches, and the public Postman pages are similarly more visible as existence proofs than as fully readable specifications. That does not mean the platform is immature; it means outside developers get a clearer signal that APIs exist than they get a deep, frictionless public technical walkthrough. The architecture therefore looks mature enough for embedded partner delivery, but less open than a fully public developer ecosystem.
