  evidenceGaps:
  - type: missing-source
    severity: material
    topic: scim-lti-docs
    missingEvidence: Publicly readable LTI and SCIM implementation docs, supported scopes, and example request or response payloads.
    whyItMatters: Integration depth is central to the product thesis, and buyers need to know whether standards-based provisioning or launch models are mature or bespoke.
    diligencePath: Request current LTI, SCIM, SSO, and lifecycle-integration documentation or a live technical demo from Go1 solutions engineering.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: certifications
    missingEvidence: Readable public evidence of active SOC 2, ISO 27001, penetration-test, and control reports rather than only a trust-center shell.
    whyItMatters: Security posture affects enterprise adoption, procurement friction, and credibility of AI-data-handling claims.
    diligencePath: Request trust-center access, current certificates, most recent pen-test summary, and customer-facing SLA language under NDA.
    relatedQuestionRefs:
    - QE015
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: ai-proof
    missingEvidence: Benchmarked recommendation-quality, Morgan engagement lift, guardrail design, and customer-outcome evidence for AI features.
    whyItMatters: AI is central to the marketing narrative, but underwriting should distinguish proven workflow value from copy-level positioning.
    diligencePath: Request Morgan adoption metrics, recommendation CTR or completion lift, model-governance documents, and representative customer case studies.
    relatedQuestionRefs:
    - QE010
    - QE028
  - type: access-blocked
    severity: minor
    topic: developer-doc-depth
    missingEvidence: Fully readable public docs and Postman collection detail for unauthenticated users instead of mostly JavaScript shells or metadata pages.
    whyItMatters: A shallow public developer surface can slow third-party technical diligence and makes ecosystem quality harder to assess externally.
    diligencePath: Ask Go1 for public or partner-grade API references, sample collections, SDK docs, and changelog access in a non-interactive format.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: reliability-sla
    missingEvidence: Official public uptime targets, status-history detail, and incident-postmortem evidence.
    whyItMatters: Embedded delivery into enterprise LMS and HRIS environments raises the cost of outages and network or webhook misconfiguration.
    diligencePath: Request official status-page history, SLA commitments, incident review samples, and partner escalation runbooks.
    relatedQuestionRefs:
    - QE016
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: partner-content-governance
    missingEvidence: Public detail on content-removal rates, partner concentration, QA thresholds, and licensing or renewal dependencies across the provider base.
    whyItMatters: Go1’s moat and customer experience both depend on external content supply staying broad, current, and well curated.
    diligencePath: Request provider concentration by share of usage, annual partner churn, QA or retirement metrics, and renewal risk reporting.
    relatedQuestionRefs:
    - QE020
    - QE022
    relatedTableRefs:
    - TE001
    - TE005
