  evidenceGaps:
    - type: stale
      severity: material
      topic: private-mark
      missingEvidence: A dated 2025-2026 tender 409A or secondary-clearing price that refreshes Go1's private mark after the 2022 official raise and 2023 extension.
      whyItMatters: The valuation debate is currently anchored to stale and partially inconsistent private marks so upside and downside are highly path-dependent.
      diligencePath: Request the latest board-approved 409A any tender documents and any secondary-trade references from investors or placement agents.
      relatedQuestionRefs: [QV003, QV030]
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: Audited ARR revenue recognition gross margin EBITDA free cash flow NRR GRR and cohort churn for 2024-2026.
      whyItMatters: Without quality-of-revenue metrics the market cannot distinguish a premium SaaS-like asset from a content-heavy or services-heavy learning platform.
      diligencePath: Request audited financial statements KPI bridge decks and monthly board reporting for 2024-2026.
      relatedQuestionRefs: [QV026]
      relatedTableRefs: [TV006]
    - type: missing-source
      severity: material
      topic: cap-table
      missingEvidence: A current cap table liquidation preferences participation terms and any investor side letters or redemption or liquidity rights.
      whyItMatters: Common-equity outcomes can differ sharply from enterprise-value scenarios when preferred stacks are large and stale marks sit above current clearing prices.
      diligencePath: Request the fully diluted cap table stockholders agreement and waterfall model used for any recent internal valuation.
      relatedQuestionRefs: [QV027, QV029]
      relatedTableRefs: [TV006]
    - type: conflicting-data
      severity: minor
      topic: funding-history
      missingEvidence: A reconciled financing chronology that explains why Latka Tracxn Seedtable and CB Insights show different totals round counts and latest labels.
      whyItMatters: Inconsistent third-party data reduces confidence in mark history and makes preference-stack analysis harder.
      diligencePath: Reconcile the legal-entity funding history against board minutes signed financing docs and the company cap table.
      relatedQuestionRefs: [QV008]
    - type: enumeration-incomplete
      severity: minor
      topic: comparable-set
      missingEvidence: A fuller private comp set spanning directly comparable learning-content aggregation and workforce-development software companies with disclosed ARR or transaction values.
      whyItMatters: The public comp set is informative but imperfect and a better private peer set would tighten the valuation band materially.
      diligencePath: Expand the comparable set with banker databases or investor data-room comps and add any disclosed private secondary marks.
      relatedQuestionRefs: [QV010, QV018]
      relatedTableRefs: [TV004]
acknowledgedWarnings: []
