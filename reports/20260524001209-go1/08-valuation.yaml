figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Recommendation follows a simple chain: real scale and workflow relevance support premium
      potential, but stale marks and missing revenue-quality evidence block a buy call today.
    data:
      nodes:
        - id: n1
          label: Verified scale
          description: 10,000+ organizations, millions of learners, 250+ providers, 75+ partners
        - id: n2
          label: Premium potential
          description: Employer-focused, workflow-integrated model can deserve more than generic edtech multiples
        - id: n3
          label: Stale private marks
          description: 2021 $1B and 2022 >$2B / $2.8B are old and inconsistently tracked
        - id: n4
          label: Missing revenue quality
          description: No audited ARR, NRR, gross margin, FCF, or cap-table waterfall
        - id: n5
          label: Inferred reset range
          description: $380M-$855M inferred public-evidence band with midpoint around $680M-$700M
        - id: n6
          label: research-more
          description: Only revisit for structured entry below ~$800M with data-room proof
      edges:
        - from: n1
          to: n2
          label: supports some premium
        - from: n2
          to: n5
          label: but must fit 2026 market ranges
        - from: n3
          to: n5
          label: forces markdown from stale mark
        - from: n4
          to: n6
          label: blocks buy recommendation
        - from: n5
          to: n6
          label: defines price discipline
    approximationNotes: >-
      Logic figure compresses the chapter's reasoning into decision nodes. It is not a causal model
      for operating performance.
    claimRefs: [CV004, CV005, CV006, CV022, CV045, CV046, CV049, CV053, CV056]
