    {
      "id": "public-revenue-and-unit-economics",
      "title": "Revenue trajectory and unit-economics proxies",
      "body": "The only retained topline trajectory is third-party rather than official. GetLatka reports Go1 at $94.8 million of 2024 revenue, up from $68.9 million in 2023, $62.9 million in 2022, $43.3 million in 2021, and $23.8 million in 2020; taken at face value, that implies roughly 37.6% year-over-year growth into 2024. The public read-through is that Go1 has scaled materially, but the number remains an external estimate, not management guidance or audited financials. Pricing intelligence is similarly directional rather than definitive. Vendr\u2019s verified-purchase data frames Go1 as a per-licensed-user contract with a roughly $16,000 median annual spend, about $80 per license annually for a 200-seat Premium Essentials deployment, and about $172 per license annually for a comparable Premium Pro deployment. Yet other public databases disagree on the entry point and free-trial availability, which is exactly why list economics should be treated as indicative rather than underwritten. Official product pages do show that Go1 is trying to monetize around measurable outcomes: Reporting & Insights packages exportable completions, enrollment, skills, and engagement data, while the 2025-2026 product refresh adds Go1 Learn, Go1 Pay, and Go1 Insights. Those features support an enterprise upsell narrative, but the company still does not publish gross margin, CAC, payback, retention, or consolidated profitability.",
