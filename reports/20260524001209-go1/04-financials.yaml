    {
      "id": "capital-adequacy-and-filing-lens",
      "title": "Capital adequacy, fundraising efficiency, and filing evidence",
      "body": "Fundraising is more visible than profitability. Go1\u2019s own funding post says the business raised more than $100 million in the 2022 round, took cumulative funding above $400 million, and reached a valuation above $2 billion. Independent market-data and media sources suggest that fundraising continued in 2023 on a much smaller scale relative to the 2021-2022 step-up, with Tracxn listing a $30 million Series D in May 2023 and Private Equity Media reporting that the raise valued the company around $3.5 billion and was largely used to support the Blinkist acquisition. That financing history implies Go1 has had access to meaningful capital, but the scale-efficiency question remains open because no retained source discloses the group\u2019s cash balance, burn, or operating margin. The clearest hard filing evidence comes from Go1 UK Learning Limited. Companies House shows FY2024 accounts filed in July 2025, and the accounts themselves report \u00a311.9 million of turnover, just \u00a33,928 of operating profit, \u00a3491 of profit after tax, negative \u00a36.08 million of net current assets/liabilities, \u00a36.34 million owed to group undertakings, and operating cash flow that swung to a \u00a30.6 million outflow. The filing does not stand in for consolidated Go1 economics, but it does show a meaningful local entity whose working-capital position and intercompany balances make financing dependence impossible to dismiss as a theoretical risk.",
