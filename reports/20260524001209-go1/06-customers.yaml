- id: TU007
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Public signal
  - Concentration or proof risk
  - Impact
  - Diligence path
  rows:
  - - Broader program scope inside accounts
    - Ivanhoe, GT’s, Duravant, James Hardie
    - Expansion is visible operationally, but not economically
    - Positive sign for stickiness, but not enough to infer NRR
    - Request cohort expansion revenue and seat growth by account
  - - Embedded partner channels
    - Microsoft, Learn365/LMS365, SAP, Litmos, Workday-linked cases
    - Channel mix may hide dependence on a few ecosystems
    - Good for reach, but partner leverage could compress margins or concentrate growth
    - Request partner-sourced bookings and gross-margin mix
  - - Cross-vertical breadth
    - Named proof across many sectors and regions
    - Breadth is real, but weight by sector is unknown
    - Supports market reach but not risk-adjusted concentration math
    - Request ARR by sector and geography
  - - Learner-count headline
    - 3.5M+ learners in Learning News, but no current official 5M+ source retained
    - Learner-count packaging is weaker than organization-count packaging
    - Creates uncertainty around the exact scale headline used in fundraising or sales
    - Ask management for current learner definitions and reconciliations
  - - Retention and renewal
    - No public NRR, GRR, churn, or contract-term disclosure
    - Durability cannot be underwritten from public materials alone
    - This is the chapter’s biggest underwriting gap
    - Request retention dashboards and sample contracts
  - - Customer or partner concentration
    - No public revenue concentration disclosure
    - Top-account and channel dependency remain unknown
    - Could materially change the quality of the scale story
    - Request top-customer and top-partner concentration tables
  - - Marketing-reference skew
    - Most high-detail proof is vendor-authored
    - ROI and time-to-value could be cherry-picked
    - Weakens confidence in how repeatable the best case studies really are
    - Prioritize independent customer references and procurement records
  notes: This table converts what is publicly visible about expansion into diligence risk tests; most of the material risks arise from missing economic disclosure rather than from weak logo breadth.
