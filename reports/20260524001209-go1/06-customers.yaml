- id: durability-friction
  title: Durability, review signal, and adoption friction
  body: |-
    Durability evidence is directionally positive but mostly operational rather than contractual. Ivanhoe is widening Go1 from leadership into induction and compliance, GT’s describes a much better second year of usage after the platform change, and Duravant says engagement keeps rising while monthly completion counts accumulate. Public review signal is decent: G2 shows 4.3/5 from 63 reviews and a two-month average implementation time; TrustRadius shows 8.7/10 from 43 reviews; GetApp shows 4.5/5 from 69 reviews. But the same independent sources also surface the main friction themes. The library can feel too broad without better recommendations, administrators still want deeper reporting and better automation inside integrations, and buyers mention limited customization, occasional outdated content, and some slow-loading experiences. Case studies echo the same theme in a softer form: change management, legacy-data migration, and reducing clicks or system sprawl are recurring parts of the adoption story.
