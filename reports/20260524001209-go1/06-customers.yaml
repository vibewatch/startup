- id: TU006
  title: Partner channels and procurement friction table
  columns:
  - Channel or friction point
  - Public proof
  - Customer impact
  - Procurement / deployment benefit
  - Residual risk
  rows:
  - - Microsoft Teams / Viva / Search
    - Official Go1 Microsoft integration page and Lumanity customer story
    - Learning appears in tools employees already use
    - Helps adoption happen in the flow of work
    - Still depends on Microsoft ecosystem fit and customer admin quality
  - - Learn365 / LMS365
    - Zensai and PR Newswire partnership announcements plus Atlas case study
    - Customers can buy content under one contract and use native search / filters / GenAI selection
    - Reduces vendor sprawl and speeds activation
    - Public data does not show what share of Go1 growth comes through this channel
  - - SAP SuccessFactors
    - Arrow Energy and SAP PartnerFinder
    - Instant activation, SSO, centralized tracking, and less multi-click friction
    - Makes Go1 easier to procure where SuccessFactors is already incumbent
    - TrustRadius review text still wants better integration detail and reporting automation
  - - Litmos
    - Litmos product page
    - 95,000+ courses, SSO, and tracking inside existing LMS
    - Enables content activation without a separate destination
    - No public evidence on realized usage or renewal through Litmos specifically
  - - Workday
    - JCDecaux story and G2/GetApp integration mentions
    - Learning and tracking move into the HR platform buyers already know
    - Supports consolidation and compliance visibility
    - Workday marketplace detail was thin in the fetched pack
  - - Library overload and manual curation
    - eLearningIndustry, GetApp, and G2 review evidence
    - Learners can struggle to know where to start
    - Admins may need heavier curation to get value
    - Discovery friction can slow expansion and increase deployment fatigue
  - - Reporting / analytics gaps
    - TrustRadius and eLearningIndustry review evidence
    - Advanced analytics may still live in the underlying LMS
    - Keeps procurement easier if customers accept a content-layer role
    - Can weaken value proof if buyers expect Go1 alone to be the system of record
  notes: The partner-channel story is a strength, but it also means some of Go1’s customer experience is mediated by incumbent HRIS/LMS platforms.
