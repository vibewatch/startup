- id: scale-risk
  title: Scale support, concentration risk, and proof skew
  body: |-
    On the scale question, the retained evidence is enough to support Go1’s claimed organization breadth but not enough to fully underwrite every headline metric. The current official site says Go1 is trusted by over 10,000 organizations, which comfortably clears the older 3,000+ organization claim. Learning News also says Go1 serves more than 3.5 million learners, so the public pack clearly supports multi-million learner scale. What it does not do is verify a current 5M+ learner count with a fresh official source. The bigger underwriting issue is concentration and proof quality. None of the retained sources disclose customer or partner concentration by revenue, and none disclose NRR, GRR, or churn. Meanwhile, most high-detail logo proof comes from Go1-authored case studies rather than independent customer-authored references. That does not make the customer story weak, but it does mean breadth is better evidenced than durability, and marketing references are better evidenced than renewal economics.
