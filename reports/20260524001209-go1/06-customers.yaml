figures:
- id: FU001
  title: Adoption / deployment funnel
  type: flow
  layout: wide
  summary: Go1’s observable customer path starts with a system-sprawl or content-gap problem, then moves through embedded integration, curated launch, and wider internal program expansion.
  data:
    nodes:
    - id: f1
      label: Need identified
      detail: A buyer in L&D, HR, talent, or safety sees content fragmentation, compliance pressure, or weak engagement in a legacy setup.
      tone: warning
    - id: f2
      label: Integration shortlist
      detail: The customer looks for a content layer that fits incumbent systems such as Workday, SAP SuccessFactors, Learn365, or Microsoft.
      tone: neutral
    - id: f3
      label: Embedded launch
      detail: Go1 is inserted into the existing LMS, HRIS, or Microsoft workflow rather than replacing every system outright.
      tone: positive
    - id: f4
      label: Curated rollout
      detail: Admins curate content, playlists, and reporting views for compliance, onboarding, technical, or leadership use cases.
      tone: positive
    - id: f5
      label: Self-serve adoption
      detail: Employees start self-enrolling, managers track completions, and friction falls when content is easier to find and assign.
      tone: positive
    - id: f6
      label: Program expansion
      detail: Accounts add more use cases, channels, or audiences, but public evidence still stops short of renewal or concentration economics.
      tone: warning
    edges:
    - from: f1
      to: f2
    - from: f2
      to: f3
    - from: f3
      to: f4
    - from: f4
      to: f5
    - from: f5
      to: f6
  approximationNotes: This figure summarizes the common path implied by retained sources; it is a generalized operating pattern, not a measured portfolio conversion funnel.
