  evidenceGaps:
  - type: missing-source
    severity: material
    topic: learner-scale-gap
    missingEvidence: A current official Go1 source that explicitly verifies 5 million or more learners, ideally split between paid enterprise learners and free or partner-backed learner pools.
    whyItMatters: The retained pack clearly supports organization scale, but the learner-count portion of the headline scale claim is still not fully corroborated.
    diligencePath: Request the latest board or investor metric sheet with paid organizations, paid learners, registered learners, and active learners by channel.
    relatedQuestionRefs:
    - QU004
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: NRR, GRR, logo churn, renewal rates, and standard contract lengths by segment and channel.
    whyItMatters: Operational adoption wins do not substitute for renewal economics, especially in a content-aggregation business where channel mix can mask weak direct retention.
    diligencePath: Request cohort retention tables, renewal dashboards, and representative contract terms for direct and partner-routed customers.
    relatedQuestionRefs:
    - QU015
    - QU025
    relatedTableRefs:
    - TU005
    - TU007
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer, top-sector, and partner-sourced revenue or bookings concentration data.
    whyItMatters: Without concentration disclosure, it is impossible to tell whether scale is truly diversified or concentrated in a handful of large channel or enterprise relationships.
    diligencePath: Ask management for ARR by top 1/5/10 customers, partner-sourced bookings mix, and revenue by sector and geography.
    relatedQuestionRefs:
    - QU023
    - QU025
    relatedTableRefs:
    - TU007
  - type: missing-source
    severity: minor
    topic: proof-skew
    missingEvidence: Independent customer-authored case studies, procurement records, or customer conference talks that validate ROI and time-to-value for named deployments.
    whyItMatters: Most high-detail proof in the retained pack is still vendor-authored, which can bias which logos and outcomes are shown.
    diligencePath: Prioritize customer-reference calls, third-party analyst notes, or customer-hosted webinars for the named accounts with the largest claimed benefits.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: deployment-friction
    missingEvidence: Portfolio-level implementation-time, failed-rollout, admin-hours-saved, and utilization-cohort data across direct and partner channels.
    whyItMatters: Case studies show friction reduction qualitatively, but diligence still lacks a portfolio view on deployment fatigue, time-to-value, and post-launch utilization decay.
    diligencePath: Request implementation scorecards by channel and by customer size, including time-to-live, administrator effort, and 90-day utilization benchmarks.
    relatedQuestionRefs:
    - QU018
    - QU020
    relatedTableRefs:
    - TU004
    - TU005
    - TU006
