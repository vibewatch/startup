chapter:
  number: 6
  title: Customers
  summary: Go1 has broad cross-vertical customer proof and a partner-heavy distribution model that makes the legacy 3,000+ organization claim easy to believe, but the public pack is much stronger on adoption wins than on retention economics. The retained sources do not fully verify a current 5M+ learner count, and most named ROI proof still comes from Go1-authored case studies rather than independent customer references.
sections:
- id: customer-base
  title: Customer base, segments, and geographies
  body: |-
    Go1’s public customer base looks horizontal rather than niche. Across James Hardie, Wave Utilities, Ivanhoe Grammar, CAMILLA, ABC Companies, Duravant, and Arrow Energy, the buyer is usually an L&D, HR, talent, or safety/compliance leader; the learner is an employee, manager, or frontline worker; and the payer is the employer funding workforce training. GetApp still frames typical customers as mid-size and large enterprises, but the official site now says Go1 is trusted by more than 10,000 organizations, which suggests the older 3,000+ organization claim is stale on the upside rather than aggressive. Named proof spans manufacturing, utilities, education, retail, aviation, transport, energy, media, and public workforce programs, with examples in Australia/APAC, the UK, the US, Singapore, and globally distributed workforces. That breadth is consistent with Go1 being a content layer that travels across many employer types and geographies, although the public pack still says little about how revenue actually breaks down by segment, size, or region.
