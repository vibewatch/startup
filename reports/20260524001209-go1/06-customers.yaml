- id: named-proof
  title: Named proof, use cases, and implementation patterns
  body: |-
    The strongest public proof comes from Go1’s own customer stories, and many of them include quantified operational outcomes. Wave Utilities reports completion rising from 78% to 98% and comprehension moving from 2/5 to 4.36/5 for a 350-person workforce. Lumanity logged 60,000 minutes of learning in three months with all early learning self-enrolled, while Atlas says it took training access from 10% of employees to 100% without increasing cost. JCDecaux claims a move from about 20% to 95% active learners, 60% more completions, and £75,000 in annual savings. NTUC LearningHub is the broadest public-scale reference, with 85,000 workers self-registering in under two months and more than 20 million minutes consumed. The implementation pattern behind these wins is consistent: Go1 is rarely presented as a greenfield destination. Instead it is embedded inside Microsoft, Learn365, Workday, SAP SuccessFactors, or a customer’s existing HRIS or LMS, which is exactly where procurement and deployment friction appear to be reduced.
