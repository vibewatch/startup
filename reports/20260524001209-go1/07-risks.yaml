  evidenceGaps:
  - type: missing-source
    severity: material
    topic: regulatory-enforcement
    missingEvidence: Any OAIC, ACCC, or overseas regulator correspondence, notice, complaint, or internal legal memo confirming whether Go1 has received formal privacy or consumer-law scrutiny.
    whyItMatters: The retained public sources frame risk as prospective, but undisclosed regulator contact would materially change the likelihood ranking in the risk register.
    diligencePath: Request external-counsel summary of open regulatory matters plus copies of any regulator notices, undertakings, or threatened claims from the last 36 months.
    relatedQuestionRefs:
    - QR002
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: provider-concentration
    missingEvidence: Provider-level revenue mix, top-provider contract expiries, content removal history, exclusivity terms, and course-consumption concentration across the library.
    whyItMatters: Go1 markets breadth, but the public record does not show whether a small number of providers or channels account for disproportionate revenue or learner usage.
    diligencePath: Request partner concentration schedule by revenue and engagement, plus the top 20 provider agreements with term, termination, MFN, and content-takedown provisions.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: profitability
    missingEvidence: Audited FY2024-FY2025 financials, gross margin, EBITDA or cash burn, customer retention, content gross margin, and renewal cohorts by channel.
    whyItMatters: A $2B+ private valuation can only be underwritten if the company has durable margins and retention; public sources provide only estimated ARR and funding headlines.
    diligencePath: Request board package or QoE with audited statements, ARR bridge, gross margin by content/provider type, churn, NRR, and cash runway.
    relatedQuestionRefs:
    - QR023
    - QR024
    relatedTableRefs:
    - TR004
    - TR005
  - type: access-blocked
    severity: material
    topic: security-assurance
    missingEvidence: SOC 2 report, ISO certificate PDF, technical and organisational measures, penetration-test summary, subprocessor register, and incident history from the trust portal.
    whyItMatters: The public trust entry point is too thin to clear cybersecurity diligence; without the underlying reports, investors cannot verify the maturity of controls or incident response readiness.
    diligencePath: Obtain trust-portal access or vendor due-diligence package containing certifications, pen-test letters, architecture overview, subprocessor list, and incident-response policies.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: microsoft-channel-mix
    missingEvidence: Revenue, pipeline, and renewal mix attributable to Microsoft Viva, LMS365, marketplace, and other embedded partner channels, plus any co-sell or rev-share commitments.
    whyItMatters: Go1 clearly depends on partner surfaces, but the public record does not show whether Microsoft-adjacent channels are incremental demand or a concentrated dependency.
    diligencePath: Request channel attribution by ARR, pipeline, and learner engagement, together with the main Microsoft ecosystem agreements and renewal dates.
    relatedQuestionRefs:
    - QR009
    - QR010
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: litigation-exposure
    missingEvidence: OpenSesame pleadings, insurance coverage, reserve analysis, settlement authority, patent scope view, and board-level assessment of litigation strategy.
    whyItMatters: The public dockets prove the dispute is live, but they do not show the likely damages range, defense cost, or the probability of settlement versus injunction risk.
    diligencePath: Request external-counsel memo, claims reserve, insurance schedule, and most recent board materials covering the OpenSesame matter.
    relatedQuestionRefs:
    - QR001
    relatedTableRefs:
    - TR001
