- id: TR005
  title: Mitigation and kill criteria table
  layout: wide
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Microsoft / LinkedIn bundling risk
    - Partner product change or contract shift
    - Microsoft bundles materially overlapping LinkedIn or Microsoft-owned content into default Viva tiers used by core Go1 accounts
    - Re-underwrite channel dependence and model likely margin compression / displacement
  - - Content-provider concentration risk
    - Top-provider churn or library shrinkage
    - Loss of a provider or catalog slice responsible for a material share of engagement or compliance content coverage
    - Pause conviction until replacement cost and customer impact are quantified
  - - Privacy / security risk
    - Incident or failed assurance review
    - Confirmed breach involving learner or employee data, or inability to produce core trust artifacts in diligence
    - Treat as thesis break for enterprise-grade trust without a documented remediation plan
  - - Active litigation risk
    - OpenSesame docket update
    - Adverse injunction, material claim-construction setback, or damages posture that threatens normal operations
    - Escalate legal contingency and reconsider valuation multiple assumptions
  - - Financial opacity / valuation risk
    - Private data room economics
    - Audited gross margin, churn, or burn prove materially weaker than public valuation implies
    - Move recommendation toward avoid unless price resets materially
  - - Macro / buyer-budget risk
    - Renewal and pipeline data
    - Renewal quality weakens as customers consolidate vendors or de-scope non-core learning spend
    - Assume slower growth and higher customer-acquisition friction in downside case
  notes: Triggers are designed to be observable in diligence or subsequent portfolio monitoring. Most are external events or data-room thresholds rather than abstract operating hopes.
