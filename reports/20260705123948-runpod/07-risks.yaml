  body: StatusGator's 236+ recorded outages over ten months versus RunPod's near-100% self-reported uptime is the single clearest example of a metric that should not be taken at face value without independent verification.
  claimRefs:
  - CR013
  - CR015
- calloutType: assumption
  title: The $500M rejected offer and the $1B mark may both be defensible
  body: Strategic acquirers and growth-equity investors can rationally disagree on price when ARR is growing quickly and unaudited; the gap is a genuine valuation-methodology question, not necessarily evidence that either side mispriced RunPod.
  claimRefs:
  - CR031
  - CR032
  - CR033
