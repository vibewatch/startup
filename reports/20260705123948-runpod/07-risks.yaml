  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: community-host-jurisdiction
    missingEvidence: A breakdown of RunPod's Community Cloud host base by country and jurisdiction, sufficient to confirm none operate in export-control-restricted regions.
    whyItMatters: Export-control jurisdiction exposure is the highest-severity risk in this chapter, but it cannot be confirmed or ruled out from public sources alone.
    diligencePath: Request host-jurisdiction data, export-control screening policy, and any internal compliance audit covering the Community Cloud host network.
    relatedQuestionRefs:
    - QR004
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: litigation-registry-access
    missingEvidence: A direct PACER/Justia federal-court docket search and state-court equivalent for "RunPod Inc" litigation history, which was not accessible via this research pass.
    whyItMatters: Corporate-registry checks show no litigation flags, but that is a weaker signal than a direct docket search and could understate real litigation exposure.
    diligencePath: Commission a paid PACER/Justia/Westlaw docket search for RunPod Inc. and any known subsidiaries before final underwriting.
    relatedQuestionRefs:
    - QR034
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited ARR and revenue-recognition reconciliation, plus a data-room-level financial statement package covering FY2025-2026.
    whyItMatters: Every financial and model-risk judgment in this chapter is downstream of unaudited, self-reported ARR figures; without audited numbers, the revenue-quality risk cannot be resolved.
    diligencePath: Request audited or reviewed financial statements, ARR cohort detail, and a reconciliation between the $120M and $240M figures before committing further capital.
    relatedQuestionRefs:
    - QR035
    relatedTableRefs:
    - TR005
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-register
    missingEvidence: A complete regulatory and legal register covering any confidential audits, regulator inquiries, or non-public settlements behind the public risk set shown in the regulatory/legal risk register.
    whyItMatters: The regulatory and legal table is intentionally partial because the public record cannot reveal every private audit, inquiry, or contract-level obligation RunPod may carry.
    diligencePath: Request RunPod's internal compliance register, any regulator correspondence, and outside-counsel litigation summaries to convert the table into a diligence-complete register.
    relatedTableRefs:
    - TR001
