    - Discount reliability claims and demand independent SLA verification
  - - Compliance-scope confusion
    - Customer contracts and certification registries
    - Evidence that Secure Cloud-only certifications are marketed as platform-wide
    - Treat as a governance and disclosure red flag
  - - Revenue-quality concern
    - Independent ARR verification, subsequent financing terms
    - A down-round or a restated ARR figure below previously reported levels
    - Reduce valuation tolerance and demand audited financials
  - - Community-host disruption
    - Host-network size and pricing commentary, marketplace reviews
    - Evidence of mass host exit or sustained community-tier price increases
    - Reassess capacity-cost assumptions and the marketplace margin model
  - - Macro AI-infrastructure multiple compression
    - Public GPU-cloud comparable multiples (CoreWeave, Lambda)
    - Sustained EV/revenue compression across public and private GPU-cloud comparables
    - Re-underwrite RunPod's implied multiple against the new sector baseline
