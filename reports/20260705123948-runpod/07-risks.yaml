  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Export-control enforcement
    - BIS/Commerce enforcement actions, Federal Register updates
    - Confirmed enforcement action naming RunPod or a Community Cloud host
    - Pause and demand a full jurisdictional host audit before further commitment
  - - Reliability erosion
    - StatusGator outage counts versus RunPod's self-reported uptime
