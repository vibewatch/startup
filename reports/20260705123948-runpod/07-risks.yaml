company:
  name: RunPod
chapter:
  number: 7
  title: Risks
  summary: >-
    RunPod's highest-severity residual risk is a compounding regulatory/operational gap: its distributed "Community
    Cloud" marketplace of third-party GPU hosts sits inside a tightening US BIS export-control regime for advanced AI
    chips, yet RunPod's own compliance disclosures show SOC 2/HIPAA/GDPR certification covers only the pricier "Secure
    Cloud" tier, not the marketplace tier most price-sensitive customers use. Independent monitoring (StatusGator)
    contradicts RunPod's near-100% self-reported uptime with 236+ recorded outage events over ten months, and
    Trustpilot/G2 reviews echo recurring reliability and billing complaints. Financially, RunPod's ~$240M ARR figure
    (doubling in roughly five months) is self-reported and analyst-estimated rather than audited, and its June 2026 $1B
    financing round followed the rejection of $500M+ acquisition offers — a valuation gap public evidence cannot fully
    reconcile. No confirmed litigation or enforcement action names RunPod as of the run date, but that is an
    absence-of-evidence finding given restricted access to court-docket databases, not a clean-record confirmation.
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: >-
    RunPod's core exposure is that US export-control policy for advanced AI chips has tightened and remains in flux
    while RunPod operates a distributed, community-host marketplace model that is harder to jurisdictionally audit
    than a centralized data-center operator. The Commerce Department's Bureau of Industry and Security rescinded the
    Biden-era "AI Diffusion Rule" in 2025 but replaced it with strengthened, evolving chip-related export controls
    that were further tightened through June 2026, and the original Federal Register framework text establishes a
    tiered country compute-export structure with due-diligence and recordkeeping obligations that reach cloud and
    data-center operators, not just direct chip exporters. Law-firm analyses from Greenberg Traurig and Sidley Austin
    both confirm that these obligations extend to entities hosting the chips even when they are not the purchaser,
    and Sidley notes the controls now reach AI model weights trained on covered hardware. Because RunPod's Community
    Cloud tier runs on third-party/individual-operated hardware rather than centrally owned infrastructure, its
    due-diligence posture for host jurisdiction is less legible from the outside than CoreWeave's centralized model.
    RunPod's own compliance page reinforces that ambiguity by stating compliance coverage can vary by workload, region,
    provider, and deployment model and should be confirmed during security review, while its standalone Data Processing
    Agreement shows part of the company's privacy/compliance posture is contractual and configuration-dependent rather
    than a blanket platform-wide certification. Separately, RunPod's cookie policy confirms the company uses both
    first-party and third-party cookies, including targeting/advertising cookies, which is ordinary for a software
    business but still creates a website-level privacy-compliance surface distinct from infrastructure security claims.
    Separately, RunPod's own Terms of Service impose a binding arbitration clause and class-action waiver that limits
    customer litigation recourse, and its Acceptable Use Policy prohibits illegal content and crypto-mining on
    community nodes but relies on automated monitoring plus user reports for enforcement — an imperfect detection
    layer for an anonymous-host marketplace. Sector-wide antitrust commentary on cloud "stickiness" is a secondary,
    non-RunPod-specific legal theme worth monitoring. No material regulatory enforcement action or lawsuit naming
    RunPod was found in public corporate-registry or general web searches as of 2026-07-05, though this reflects an
    absence-of-evidence finding rather than a confirmed clean record, since direct PACER/Justia docket access was not
    available to this research pass.
