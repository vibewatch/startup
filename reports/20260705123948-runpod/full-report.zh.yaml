      - number: '3.4'
        title: 护城河耐久度、商品化风险与负面竞争证据
        blocks:
          - type: paragraph
            body: >-
              RunPod 相对资本密集型同业最清晰的结构性差异，是其宣称的轻资产、市场型模式：自有文档披露了 Hub 创作者收入分成计划（2025 年 9 月推出），按计算收入向发布者支付分层比例——每月 计算小时低于
              100 时为 0%，超过 10,000 小时最高 7%，以 RunPod 积分支付。这至少给 RunPod 提供了一个具体、有文档记录的抽成率 机制，而纯自有基础设施竞争者 CoreWeave
              并不需要这种机制。资本结构上的反差很强：CoreWeave 于 2026 年 3 月完成 $8.5B GPU 抵押「DDTL 4.0」融资工具（首笔获得投资级评级的 HPC 基础设施贷款），此前还有 $7.5B
              Blackstone/Magnetar 领投债务工具；其 SEC 备案 S-1 披露，Microsoft 一家占 2024 年收入 62%（前两大客户占
              77%）。这既是资本密集画像，也是客户集中风险；RunPod 更广泛、更交易型的开发者市场可能部分避开这两点，尽管本语料中任何地方都没有独立披露 RunPod 自身客户集中度。独立、非供应商分析师评论直接质疑
              RunPod 护城河耐久度：AInvest 称，来自 hyperscaler 的激烈竞争是 RunPod 最直接威胁，因为它们「有资源捆绑有竞争力的 GPU 产品，并以低价下切」；AInvest
              还指出，RunPod 的按秒计费创新正在整个品类被复制，侵蚀 RunPod 最初赖以增长的差异化。相比之下，RunPod 自己发布的「最佳 GPU 云提供商」对比文章是公司署名、天然自利的叙事，并正面点名
              RunPod——这说明本章只把供应商署名对比内容视为公司叙事证据，而非其竞争地位的独立证明。合在一起，RunPod 的护城河建立在相对 hyperscaler 的价格 /
              价值定位，以及相对资本密集型对手的市场灵活性上；二者都暴露在下方 Vast.ai 市场地板价、上方 hyperscaler 捆绑和资本规模优势带来的商品化压力之下。
