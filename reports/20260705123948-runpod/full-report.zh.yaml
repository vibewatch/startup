            title: RunPod 自家营销文案在核心可靠性和自动扩缩数字上存在内部不一致
            body: >-
              官网分别声称「99.9% Uptime」和「99.99% uptime guarantee」，也分别声称可在 250ms 内从「0 扩到数百个并发 worker」以及从「0 扩到数千个
              worker」。这些数字未必有任何一个是假的，但不一致本身就是尽调信号：依赖任何单一引用数字的买方，都应要求 RunPod 说明哪个才是当前且具约束力的主张。
