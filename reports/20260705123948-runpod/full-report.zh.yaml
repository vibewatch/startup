      - number: '5.2'
        title: Instant Clusters、API/集成界面与开发者信号生态
        blocks:
          - type: paragraph
            body: >-
              RunPod 的 Instant Clusters 是它对多节点训练和大批量推理的回答；最清楚的公开技术细节来自一篇联合发布的伙伴文章：FarmGPU 与 RunPod 共同推出 Blackwell B200
              HGX Instant Clusters，提供可立即使用的 6 节点集群，底层是 800G 后端网络结构（由 Celestica 和 Hedgehog Cloud Open Network Fabrics
              构建），目标节点间带宽为 400 GB/s，并且每节点本地 NVMe 存储带宽为 116 GB/s。FarmGPU 自己的基准测试声称，在 32-GPU AllReduce 操作中总线带宽达到 390
              GB/s；这是伙伴发布的数字，本次尽调无法独立复现。RunPod 的发布说明还披露了一项运营限制：截至 2026 年 4 月，给现有 Instant Cluster
              扩容新节点仍只能由管理员操作，尚不是自助服务。集成层面，RunPod 发布了 REST API 和 Python SDK；其 GitHub 组织也释放出相当活跃的开发者信号——runpod-python（302
              个星标，2026 年 7 月 4 日推送）和 worker-vllm（455 个星标，2026 年 7 月 1 日推送）——但 worker-template 脚手架仓库（133 个星标）自 2025 年 5
              月后未再推送，存在陈旧缺口。独立生态投入存在，但规模不大：kodxana 的社区维护 Awesome-RunPod 清单，以及一个小型独立维护的 Terraform provider（9 个星标），都不是
              RunPod 官方参与。RunPod 文档新近列出一个 agent skills 包和 MCP servers，可让 Claude Code 与 Cursor 直接管理 RunPod 资源。价格方面，独立 GPU
              价格追踪器和竞品页面（Vast.ai、Modal、Together AI）证实 RunPod 在可直接比较的按秒 / 按小时维度上竞争；Hacker News 评论既称赞 RunPod Community
              Cloud 定价（相对零售硬件成本，GPU 回本期约 212 天），也指出一个反复出现的负面模式：一名开发者的 RunPod 4090 GPU 可用性在约一个月内从持续可用跌到长期低可用失败。
