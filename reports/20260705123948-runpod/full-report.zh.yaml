        - 合理，但有实质下行风险
        - ~4.2x ARR 低于 CoreWeave 的 6.8-12.8x 和 Lambda 的隐含倍数，但 $500M 被拒报价差距以及价格战利润率风险抵消了这点
        - 不能因为低于公开可比公司，就默认该倍数便宜
      - - 退出视角
        - 战略出售、后续融资轮或更晚 IPO
        - Lambda 目标 H2 2026 IPO 是最近的行业流动性测试案例
        - 将退出时点视为取决于行业，而非 RunPod 自身
    notes: 仅基于公开证据；建议有意同时权衡未经审计 ARR 缺口、被拒收购估值信号、Community Cloud 利润率风险，以及真实规模和可信的机构融资流程。
    claimRefs:
      - CV001
      - CV002
      - CV003
