  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与承保框架
        blocks:
          - type: paragraph
            body: >-
              RunPod 达到了严肃机构关注的门槛：它是一家真实且快速增长的 GPU 云平台，刚完成由 Summit Partners 领投、J.P. Morgan 担任唯一配售代理的当前融资事件，不是陈旧
              mark，同时新增机构董事席位。承保问题不是 RunPod 是否已有规模；Sacra 和 ValueAdd VC 都估计其截至 2026 年 6 月 ARR 接近 $240M，高于 2026 年 1 月约
              $120M，RunPod 自己也声称平台上有超过 100 万开发者。问题在于，这种规模完全由自报和分析师估算数字衡量，而不是经审计财务；同时还伴随一个耐人寻味的数据点：RunPod 据称在 $1B
              增长轮前不久拒绝了超过 $500M 的收购要约，意味着战略收购方和成长股权投资者在同几个月内对公允价值得出了很不一样的结论。再叠加风险章节记录的市场模型风险——来自 Vast.ai 及同业的 Community
              Cloud 价格竞争、独立监控正常运行时间缺口，以及社区主机出口管制司法辖区悬而未决——组合结论是：真实规模和当前融资存在，但被未经审计收入、战略方与成长股权之间的宽估值差、以及市场利润率风险抵消。因此应给出跟踪
              / 继续研究判断，中等信心、高风险，并采取公允但有重大下行情境的估值立场，而不是买入。
