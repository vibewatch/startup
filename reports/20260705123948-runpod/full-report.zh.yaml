              G2 评分为 4.7/5（本章直接抓取时因 JavaScript 门控无法复核），而本章直接观察到的 Trustpilot 存档快照显示，192 条评论的评分较低，为 3.9/5。带日期的 Trustpilot
              单条评论暴露出一个反复出现、区别于头部评分的负面模式：Pod 停止但未删除后存储费继续产生，造成账单困惑（评论者 Lucas Rodrigues）；Serverless 任务排队期间被多次计费（评论者
              Vladimir Osipov）；以及几条 2026 年初评论提到 Pod 性能不一致或 UI/API 行为损坏。最值得注意的是，同一独立分析报告称，RunPod 宣传的「sub-200ms cold
              start」只适用于约 48% 的请求，最差 1%（P99）达到 4.2 秒——这比官网营销呈现的图景细腻得多；不过该报告也指出，社区报告的可用性和冷启动投诉集中在 Pod 环境，而不是报告称大多数生产流量运行的
