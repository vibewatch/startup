  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、定价模式与抽成率机制
        blocks:
          - type: paragraph
            body: >-
              RunPod 主要通过三条产品线的直接、按用量计费算力来变现：GPU Pods（分为企业级 Secure Cloud 数据中心伙伴算力，以及成本更低、聚合主机的 Community Cloud
              算力）、Serverless Endpoints（截至 2026 年 6 月融资公告，已处理超过 200 亿次推理请求）和 Instant Clusters（最多 64 个 H100 GPU
              的多节点按需配置）。Sacra 的独立分析印证，驱动 RunPod 绝大多数收入的是这种直接基础设施租赁计费，而不是市场佣金。更新的第四条按用量计费产品线是 Public Endpoints，于 2025 年 8
              月 6 日推出，提供对精选第三方 AI 模型库的即时、按用量计费 API 访问；发布时包括与 ByteDance（TikTok 母公司）的合作，展示其 Seedance 1.0 Pro 和 Seedream
              3.0 生成模型，同时还有 700 亿参数 Llama 2 变体和 OpenAI 的 Whisper 语音转文本模型。这把 RunPod 的可服务用量从原始 GPU
              租赁扩展到托管推理计费。一个更小、另有文档记录的收入机制是 RunPod Hub 创作者计划（其自有产品页确认 Hub 是可部署的开源 AI 模型和模板市场），于 2025 年 9
              月推出，向第三方发布者支付其已发布代码库产生计算收入的分层比例：每月计算小时低于 100 时为 0%，逐级升至超过 10,000 小时的 7%；付款形式是 RunPod 积分，而非现金。这是 RunPod
              收入模型中唯一公开量化的抽成率，因为 RunPod 在供给侧支付给 Community Cloud GPU 托管伙伴的单独百分比，在本语料任何地方都没有披露。RunPod
              自有价格页还列出附属、非算力收入线：按层级不同，持久存储为 $0.05-$0.20/GB/month；托管文本处理费率为每 1,000 字符 $0.10。RunPod
              的所有价格都是官网发布的标价；已审阅来源没有披露实际成交 / 折扣后企业价格、合同条款或混合平均客户收入。
