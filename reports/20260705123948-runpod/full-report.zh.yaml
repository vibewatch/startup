      - CV030
      - CV036
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 估值敏感性显示，ARR 增长得到审计确认是最大上行杠杆；收入质量重述和宏观倍数压缩是最大下行杠杆。
    approximationNotes: 柱状条展示围绕示意性约 $1B 锚点的方向性价值变化（以百万美元计）；这些变化不可相加，只用于展示关键研判变量的杠杆。
    data:
      items:
        - label: 经审计 ARR 确认约 $240M 增长轨迹
          value: 700
        - label: Secure Cloud 占比上升，倍数向 CoreWeave 低端重估
          value: 500
        - label: Lambda IPO 推动 GPU 云板块倍数上修
          value: 300
        - label: Community Cloud 价格战压缩抽佣利润率
          value: -400
        - label: 收入质量重述，使倍数靠近被拒报价隐含水平
          value: -600
        - label: 全行业 AI 基础设施倍数压缩
          value: -500
    claimRefs:
      - CV003
      - CV019
      - CV020
      - CV025
      - CV033
      - CV035
  - id: FV003
    title: 估值回报区间
    type: range
    layout: standard
    summary: 熊、基准、牛三档区间横跨 $1B 入场估值，结果取决于 ARR 能否获得审计确认，以及市场利润率能否守住。
    approximationNotes: 区间是分析师基于公开可比公司和情景假设作出的十亿美元估算，不是完整 DCF 或清算瀑布。
    data:
      items:
        - label: 熊市情景估值
          low: 0.5
          base: 0.65
          high: 0.8
          unit: $B
        - label: 基准情景估值
          low: 0.9
          base: 1
          high: 1.3
          unit: $B
        - label: 牛市情景估值
          low: 3.2
          base: 4
          high: 5
          unit: $B
    claimRefs:
      - CV033
      - CV034
      - CV035
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格打分支持 6/10 的读数：市场位置和增长动能强，但下行保护清晰度和证据质量弱。
    approximationNotes: 分数采用 1-10 编辑评分尺，基于截至 2026-07-05 保留下来的公开证据；它们是分析师判断，不是管理层提供的 KPI。
    data:
      items:
        - label: 入场纪律评分
          value: 6
          unit: /10
          note: 约 4.2x ARR 倍数相对 CoreWeave / Lambda 可比公司可辩护，但高于被拒报价隐含倍数。
        - label: 市场位置强度
          value: 7
          unit: /10
          note: 快速增长的 GPU 云平台，拥有超过 100 万开发者和可信的机构轮融资。
        - label: 增长重估潜力
          value: 6
          unit: /10
          note: ARR 翻倍很亮眼，但持续性和审计状态尚未被公开证明。
        - label: 下行保护清晰度
          value: 3
          unit: /10
          note: 优先权结构、股权结构条款和经审计财务均未披露。
        - label: 可比倍数支撑
          value: 6
          unit: /10
          note: RunPod 隐含倍数低于 CoreWeave 和 Lambda，信号有支撑但不具决定性。
        - label: 退出可选性
          value: 6
          unit: /10
          note: Lambda 目标在 2026 年下半年 IPO，可能为板块打开一个近端流动性测试案例。
        - label: 证据质量
          value: 4
          unit: /10
          note: 私营公司，ARR 来自自报和分析师估算，不是审计数字。
    claimRefs:
      - CV001
      - CV002
      - CV028
      - CV029
      - CV030
      - CV036
