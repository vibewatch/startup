  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型 / 状态
      - 估值或倍数快照
      - 相关性
      - 关键限制
    rows:
      - - 'CoreWeave (NASDAQ: CRWV)'
        - 公开市场 GPU 云纯标的
        - ~$44.6B 市值；6.8-12.8x EV/Revenue；11.8-25x EV/EBITDA（2026 est.）；已向 SEC 提交 10-Q 披露
        - GPU 云基础设施估值最接近、已有规模的公开代理
        - 拥有数据中心基础设施，交易规模远大于 RunPod 的轻资产市场平台模型
      - - Lambda Labs
        - 私营、IPO 前直接竞争者
        - Nov 2025 募资 $1.5B；投后估值估计 $5.9-15B（未确认）；年化收入 ~$505-520M（May 2025）
        - 最接近的直接竞争者，也是近期 IPO 测试案例（H2 2026，Morgan Stanley/J.P. Morgan/Citi 已参与）
        - 估值为分析师估算，未经公司确认；区间过宽限制精度
      - - CoreWeave / Core Scientific 合并
        - 已完成 AI 数据中心 M&A（全股票）
        - $9B 交易价值；0.1235 换股比例；签约时 Core Scientific 约以 21.7x P/S 交易
        - 近期大型 AI 基础设施 M&A 成交案例，显示可达成的交易结构和定价
        - Core Scientific 从比特币挖矿转向 AI 数据中心，因此不是完美的纯 GPU 租赁可比对象
      - - RunPod 自身融资历史
        - 私营、一级融资轮估值抬升
        - 估值从 ~$100M（2024 种子轮）升至 ~$1B（June 2026），在 ~$240M 估算 ARR 上约 10x 抬升（~4.2x）
        - 直接反映 RunPod 自身多轮融资定价轨迹
        - 两个 ARR 数字均为自报 / 分析师估算，未经审计
      - - 被拒收购报价
        - 私下、未完成 M&A 信号
        - 据称在 $1B 轮前不久，超过 $500M 的报价被拒
        - 与一级融资轮接近同一时间窗口的战略买方价格信号
        - 竞标方身份和确切条款未确认；可能反映机会主义低报价，而非公允价值
      - - 2026 年 AI 基础设施行业情绪
        - 分析师 / 机构评论（CNBC、BlackRock）
        - 没有 RunPod 特定倍数；提示全行业杠杆、循环交易，以及估值与变现脱节
        - 为所有 GPU 云估值（包括 RunPod）的下行 / 倍数压缩情景提供锚点
        - 定性且偏宏观；不是公司特定数据点
    notes: >-
      可比集合混合了已有规模的公开纯标的、接近 IPO 的直接私营竞争者、已完成的 AI 基础设施 M&A 交易、RunPod 自身融资历史、被拒报价信号和行业层面情绪，以框定估值，而不是强行给出单一倍数答案；倍数为 2026
      年快照，会随市场变化。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the principal public, private, and M&A GPU-cloud valuation anchors available from retained 2026
        sources (CoreWeave, Lambda Labs, the CoreWeave/Core Scientific merger, RunPod's own round history, and sector
        commentary), but exclude every private secondary trade or smaller competitor financing in the market.
