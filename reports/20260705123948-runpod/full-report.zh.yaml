      - number: '4.4'
        title: 公开财务缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              合在一起看，RunPod 公开财务记录显示：它确实有一个真实且快速增长的按用量计费收入基础（ARR 五个月从 $120M 翻倍至 $240M，净美元留存率 120%，开发者数量越过
              1M），有一个已有文档但仍属局部的市场抽成率机制（Hub，最高 7%），也有资本效率较高的历史（在 $100M Summit Partners 轮前，仅靠单笔 $20M
              种子轮支撑约两年自举、无债增长）。与之相对，标准财务模型所需输入几乎完全缺失：毛利率、收入成本、CAC/LTV、现金头寸、现金消耗速度、可支撑月数 和客户集中度均未披露；本语料中每一个 RunPod
              报告数字都来自公司新闻稿，再由行业媒体复述，没有独立审计验证，因为 RunPod 是私营公司，没有 SEC 备案义务。CoreWeave 的 SEC 备案 10-Q 显示收入增长 112%，同时净亏损
              $(740)M、两大客户集中度 65%，债务栈继续增长且新增 $4.0B 可转债。这不是 RunPod
              专属数据点，但作为直接可比、资本密集型同业的已审计提醒，它说明规模和增长本身并不能化解本赛道的利润率路径或集中度风险。因此结论是：收入增长、留存和资本效率信号方向上积极，但在管理层提供毛利、现金和客户集中度数据前，财务判断仍未闭合；还要额外注意，整个
              GPU 云类别都面临未解决的宏观估值和出口管制 / 供给风险，RunPod 即便自身执行良好也可能受影响。
