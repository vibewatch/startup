      - number: '4.2'
        title: 获客动作、收入质量，以及公开牵引与私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              RunPod 的获客 / 销售动作主要是自助式和产品驱动：公司自有新闻材料称，从注册到首次运行工作负载的中位时间低于一小时，超过 90% 的部署首次尝试即成功，85%
              的已部署工作负载开发者会回来继续构建。这些都是公司自报的留存和激活代理指标，部分由 G2 独立评论印证。已报告收入端牵引力可观：到 RunPod 2026 年 1 月 $120M ARR
              里程碑时，开发者注册同比增长 155%，净美元留存率达 120%（高于公司称为世界一流的 110% 门槛）；随后公司和独立行业媒体均报道 ARR 到 2026 年 6 月约翻倍至 $240M，开发者数量也从约
              500,000（2026 年 1 月）越过 1,000,000（2026 年 6 月）。该增长轨迹方向上符合可比 AI 基础设施同业，但绝对规模更小：据独立分析师画像，Together AI 报告年化收入约
              $1B、同比增长 375%；Modal Labs 在约八个月内 ARR 从 $60M 增至 $300M。尽管有这些牵引，已审阅来源没有披露 RunPod
              的获客成本、生命周期价值、回本周期或正式销售周期长度；独立分析师评论（AInvest）明确把 CAC/LTV 效率和毛利率稳定性列为判断 RunPod
              增长逻辑能否扩展的两个主要未解决观察点。这是本章无法用公开数据关闭的真实负面未决风险。RunPod 还称有「年支出数百万美元」的企业客户，而 RunPod
              自己发布的一个具体、具名、可量化客户案例——Civitai，被称为互联网上最大的 Stable Diffusion 模型中心，使用 RunPod 在单月训练超过 868,000 个 LoRA 模型，并每月生成超过
              2.6 million 张训练预览图——说明确有真实、大规模使用，但没有披露该账户的具体美元收入数字，因此「每年数百万美元」说法只被具名案例部分佐证。
