      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              RunPod 的可服务买方至少分成五个相互重叠的群体，预算负责人和采用触发点各不相同。独立 AI 开发者和研究人员自己付费，靠低摩擦、无承诺、按秒计费转化。独立 ML / 初创团队通常由创始人或 CTO
              负责小额算力预算，并明确避开 hyperscaler 采购流程。运行 Stable Diffusion 或 ComfyUI 类工作流的创意 AI 用户，多是价格敏感的个人或小工作室，会把 RunPod 与
              Replicate 这类按生成次数付费的替代方案比较。企业团队——RunPod 披露有「年支出达数百万美元」客户——通过企业 IT / 采购路径采用，并把 RunPod 的 Secure Cloud
              合规姿态（SOC 2 Type II、HIPAA、GDPR）作为门槛。第五类结构上不同的群体是 RunPod Hub 发布者，他们不是付款方，而是收入接收方，最高可获得其发布模板所产生算力支出的
              7%，把开源分发与 RunPod 自身变现绑定起来。具名客户引用（Deep Cogito、Civitai，以及作为投资方 / 倡导者的 Hugging Face）最明显覆盖创始人主导初创公司和创意 AI
              两个群体；已审阅来源中，企业分层客户证明更薄，只限于 RunPod 自己「Fortune 500 企业团队」的措辞，除 Deep Cogito 的前沿模型叙事外，没有具名企业 logo。
