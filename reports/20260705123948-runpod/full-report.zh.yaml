      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              RunPod 由 Zhen Lu（首席执行官）和 Pardeep Singh（首席技术官）创立。两人在 Comcast 任企业软件开发者时相识并共事，随后创业。按 TechCrunch 引述创始人的说法，Lu 和
              Singh 于 2021 年末从 Ethereum 加密货币挖矿起步，合计投入约 $50,000，在新泽西自家地下室运行 GPU 矿机；Ethereum 「Merge」升级前，挖矿不再盈利，他们便把同一批 GPU
              硬件改用于托管其他开发者的 AI/ML 工作负载，RunPod 由此在 2022 年初成形。融资推进后，治理结构也随之扩展：Mark Rostick（Intel Capital）随 2024
              年种子轮加入董事会，Michael Medici（Summit Partners）随 2026 年 6 月成长轮加入。已审阅来源中，目前没有披露任何独立（非投资方）董事持有 RunPod
              具名董事席位，也没有任何来源提到 Lu 和 Singh 之外的首席财务官、总法律顾问或其他 C-suite 高管。这本身就是关键人依赖信号：成立近五年后，RunPod
              的公开叙事、产品愿景和面向投资人的表述几乎完全由两位联合创始人承担。关于创始人背景还有一个数据点——Lu 拥有计算化学博士学位——只出现在一份独立分析师报告中，未获任何 RunPod
              一手来源佐证，因此标记为单一来源。
