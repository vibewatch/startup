      - number: '7.2'
        title: 运营、安全与可靠性风险
        blocks:
          - type: paragraph
            body: >-
              RunPod 自托管状态页报告接近 100% 的正常运行时间，少数区域（US-CA-2、EU-SE-1 和 CA-MTL cluster）过去 90 天为 98.97%-99.86%，核心区域则为
              100%。该自报结果与独立第三方监控聚合器 StatusGator 形成鲜明对比：后者在约十个月（2025 年 9 月至 2026 年）内记录超过 236
              起不同宕机事件。本章把这一差距视为真实且未解决的可靠性信号，而不是噪音。Trustpilot 和 G2 评论者也分别反复指出 pod 性能不一致、断连、容器 / template 错误和意外账单激增；RunPod
              自家文档承认，community/spot 层 GPU 分配在容量短缺时可能被「stranded」，并建议需要保证正常运行时间的生产负载使用 dedicated 或 reserved
              GPU。这等于直接承认，低成本市场层——也就是 RunPod 很多价格竞争定位的来源——比 Secure Cloud 层承担显著更高的可用性风险。Nudge Security 的独立安全姿态评估指出 RunPod
              的第三方 / 供应链依赖面，但未识别具体未解决漏洞；这是轻微正面信号，但不是审计。最后，CostBench 的独立价格比较显示，RunPod community 层定价可被 Vast.ai
              和其他市场竞品匹配或压低，意味着平台的可靠性取舍并没有被持久价格优势清楚抵消——这是加重运营图景的商品化风险。RunPod 单独的维护页面也暴露了需要在 Serverless、APIs、UI 和 30
              多个区域之间协调变更管理的系统和区域广度；而竞品 GigaGPU 撰写的可靠性批评认为，在市场式 GPU 供给的需求尖峰中，生产用户确实会面对可用性缺口、抢占和硬件差异风险。
