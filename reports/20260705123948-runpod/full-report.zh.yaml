      - number: '8.2'
        title: 当前融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              RunPod 2026 年 6 月由 Summit Partners 领投的 $100M 融资，按分析师估算的约 $240M ARR 推出约 $1B post-money 估值——约 4.2x 收入——相较
              RunPod 2024 年由 Intel Capital 和 Dell Technologies Capital 领投的种子阶段融资所确立的约 $100M 估值，约上跳 10x。J.P. Morgan
              担任唯一配售代理，是轻微正面信号，说明 mark 确定前发生过某种机构级尽调。入场纪律仍要求把约 $240M ARR 当作区间而非点估计：该数字来自 Sacra
              的分析师建模和媒体报道，而非经审计申报；且仅约五个月从约 $120M 翻倍，对一家还在应对 Community Cloud 价格战的公司而言，增速异常陡峭。被拒的 $500M+
              收购要约，是整份文件中最尖锐的入场纪律信号：如果战略收购方轮前出价隐含约 2-4x trailing ARR（取决于具体 ARR 参考点），而主融资轮实现约
              4.2x，那么缺口可能反映战略买方计入了执行或收入质量风险，而成长股权投资者愿意看过去；也可能只是机会主义低价出价。公开证据下两种解读都成立，诚实结论是入场倍数纸面上可辩护，但还没有完全经受尽调证明。
