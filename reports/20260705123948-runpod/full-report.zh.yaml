  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代方案与相邻领域
        blocks:
          - type: paragraph
            body: >-
              RunPod 所在赛道是「GPU-as-a-Service」（GPUaaS），也常被称为专门的「GPU cloud」或「neocloud」算力：核心产品是可租用、通常按秒计费的 GPU 硬件访问，用于 AI
              训练、微调和推理；这不同于通用 hyperscaler 云（AWS/Azure/GCP），后者的 GPU 实例只是更广泛计算 / 存储 / 软件组合中的一个条目。该市场位于更宽的 AI
              基础设施市场之内，但并不等同于后者；AI 基础设施还包括训练、推理、存储、网络和 MLOps 工具。RunPod 的 Serverless 产品最直接覆盖一个更窄的「AI
              inference-as-a-service」子赛道。买方拿 RunPod 比较的现状替代方案包括：（a）自建并运营自有本地 GPU
              硬件，这种资本开支重的方案更适合稳定、规模大的工作负载；（b）hyperscaler 的预留或承诺用量合约，对可预测、多年的工作负载可能压低按需 neocloud 价格；（c）Vast.ai 等纯点对点 GPU
              市场，主要靠价格竞争，但可靠性取决于主机；（d）Together AI、Modal、Replicate 等托管 / Serverless 推理竞品，它们完全抽象掉 GPU 选择，换来更窄、通常更像模型 API
              的产品界面。数据中心托管和电力基础设施属于相邻但排除在 RunPod 直接可服务市场之外的领域，它们是决定 neocloud 供给的上游输入市场，本身不是 GPU 租赁；非 GPU 通用云支出也被排除。
