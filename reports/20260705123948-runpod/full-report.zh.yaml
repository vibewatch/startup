      - number: '8.4'
        title: 可比估值视角
        blocks:
          - type: paragraph
            body: >-
              可比公司集合支持谨慎纪律，而不是简单得出明显折价或明显溢价。CoreWeave 是最接近、已有规模的公开 GPU 云纯业务公司；按 StockAnalysis 和 MarketScreener 的 2026
              年估计，其市值接近 $44.6B，交易区间为 6.8-12.8x EV/Revenue 和 11.8-25x EV/EBITDA，并由 SEC 申报的 10-Q 披露锚定。对照该区间，RunPod 隐含约
              4.2x 看起来保守；但 CoreWeave 的规模、自有基础设施模型和公开市场流动性，不能与 RunPod 更小、轻资产、市场占比较重的业务直接相比。RunPod 最接近的直接竞争对手 Lambda Labs
              在 2025 年 11 月融资 $1.5B，post-money 估算为 $5.9-15B（公司未确认），基于截至 2025 年 5 月约 $505-520M annualized
              revenue——隐含倍数显著高于 RunPod；Lambda 据称正瞄准 2026 年 H2 IPO，并已接触 Morgan Stanley、J.P. Morgan 和 Citi，一旦定价，可能重估整个 GPU
              云可比公司集合。M&A 方面，CoreWeave 以 $9B 全股票收购 Core Scientific，采用 0.1235 交换比率，彼时 Core Scientific 交易接近 21.7x
              P/S；一些分析师指出该倍数反映了 AI 数据中心 M&A 的高估和执行风险，是有用的上限侧警示，而不是底部。RunPod 自身融资历史——从 2024 年种子轮 mark 到 2026 年 6 月轮约上跳
              10x——以及被拒的 $500M+ 收购要约，则作为公司特定数据点，从下方框定倍数。其他公开市场锚点显示区间已经很宽：CompaniesMarketCap 把 2026 年 7 月 4 日 CoreWeave
              市值列为 $44.59B、Core Scientific 市值列为 $6.81B；Yahoo Finance 则显示 Core Scientific 在 2026 年 3 月季度末附近企业价值为
              $7.86B。Sacra 的 CoreWeave 画像强调 2025 年收入 $5.13B、此前 $23B 私有估值，以及截至 2026 年 3 月 31 日 $99.4B 积压订单，凸显这家有规模的公开 GPU
              云领导者在收入深度和已承诺需求上高出 RunPod 很远。SahmCapital 另行警告，Core Scientific 在 2026 年 5 月交易约 21.7x P/S；这提醒我们，AI
              基础设施可比公司可能嵌入亢奋预期，而不是提供可靠底线。行业层面，CNBC 和 BlackRock 对 2026 年 AI 泡沫的评论虽属定性，但方向上重要：公开和私有 GPU 云倍数整体都可能压缩。
