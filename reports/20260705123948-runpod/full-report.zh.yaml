    layout: wide
    summary: RunPod 的客户旅程从低摩擦自助试用开始，进入生产部署；部分账户再跨入由合规门槛把关的企业扩张。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: 开发者从社区（Discord、Reddit、Hacker News）、创始人故事媒体报道，或 GPU 云价格搜索中发现 RunPod。
          tone: positive
        - id: self-serve-trial
