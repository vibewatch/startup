    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              RunPod, Inc. 是 Runpod 背后的运营实体。Runpod 自称「AI 开发者云」，提供 GPU 基础设施平台，用于训练、微调、运行推理并扩展 AI
              工作负载。州级和联邦监管记录显示，公司执行办公室位于 1181 Nixon Drive, Suite 1158, Moorestown, New Jersey，注册管辖地为 Delaware；SEC/NASAA
              Electronic Filing Depository 记录把公司成立时间标记为查询前五年内，与 2022 年相符。RunPod 自己在 2026 年 1 月的新闻稿则使用 Mt. Laurel, New
              Jersey 作为电头，距离 Moorestown 仅数英里；该差异最可能只是南新泽西两个相近办公地址，而非重大事实冲突，但本轮尚未用单一权威备案文件完成校准。商业上，RunPod
              在一个控制台中销售三条产品线：按需 Pods（按秒计费的持久 GPU 实例）、Serverless（自动扩缩推理端点，宣称扩缩低于 250ms，并有「FlashBoot」 快速冷启动）和 Instant
              Clusters（与 FarmGPU 合作推出的多节点 Blackwell 世代训练集群）。平台采用双供给模式：RunPod 运营的「Secure
              Cloud」来自经过审查、具备合规认证的数据中心；成本更低的「Community Cloud」来自第三方主机，以较弱可靠性保证换取价格优势。RunPod 自有文档列出平台上至少 41 个不同的 GPU
              展示型号，从 Tesla V100 到 B300 和 RTX PRO Blackwell 零部件不等，这是首页「30+ 个 GPU SKU」说法的直接一手依据；更宽泛的「200+ 种 GPU
              类型」只出现在二级聚合评论中，尚未在 RunPod 一手页面找到，因此本报告视为未验证。
