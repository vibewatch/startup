      - number: '7.6'
        title: 缓释、监测与论点失效标准
        blocks:
          - type: paragraph
            body: >-
              合适的承保姿态不是立即判定论点破裂，而是在高剩余风险下设置明确、可监测的 kill criteria。RunPod 的真实缓释项包括：Secure Cloud 层的 SOC 2 Type II、SOC 3 和
              HIPAA/GDPR 认证（由 TrustLists 独立交叉验证）；公开发布的——虽为自报——正常运行时间和事故状态页；以及由 J.P. Morgan 顾问参与的机构融资轮，暗示 $1B mark
              确定前发生过某种外部尽调。哪些因素会把品类层面风险转化为公司特定减值，是可以度量的。若出现点名 RunPod 的出口管制执法行动，或有证据显示 Community Cloud
              主机实质性运行在受限司法辖区，将威胁市场模型论点；若 RunPod 自报正常运行时间与 StatusGator 独立宕机计数之间的差距持续扩大——尤其是触及 Secure Cloud /
              企业客户——则说明可靠性缓释没有奏效；若有证据显示 Secure Cloud 专属认证被营销成平台级认证，将构成治理和披露红旗；若 RunPod ARR 增长轨迹被确认下调重述，或后续出现
              down-round，将验证由未经审计财务披露缺口暴露出的收入质量风险。每一项都对应买方在进一步投入资本前应解决的具体尽调问题。
