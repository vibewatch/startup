              RunPod 的时间线从 2021 年末加密货币挖矿转向开始，随后是 2022 年创立、2023 年 Form D 通知、2024 年 5 月种子轮、2025 年安全认证和与 FarmGPU 的
              Blackwell 集群合作，以及 2026 年 1 月和 6 月的收入与融资里程碑。RunPod 自有实时事件历史（2026 年 7 月 5 日抓取）记录了 2026
