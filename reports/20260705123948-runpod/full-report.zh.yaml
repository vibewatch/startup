      - number: '8.3'
        title: 牛、基准与熊情景
        blocks:
          - type: paragraph
            body: >-
              情景框架应围绕 $1B 入场 mark 给出结果区间，而不是假装只有一个答案。牛市情景假设 RunPod 的 ARR 增长继续迈向 $400-500M，Secure
              Cloud（更高利润率、完全认证）占比提升，经审计财务确认增长真实，倍数重估到 CoreWeave 公开 6.8-12.8x EV/Revenue 区间的低端；这一路径支持约 $3.2-5.0B，显著高于入场
              mark，也与 Lambda Labs 在较小收入基数上未获确认的 $5.9-15B post-Series-E 估算一致。基准情景假设 ARR 增长放缓但仍强劲，Community Cloud
              价格战限制利润率扩张，倍数保持在 Summit Partners 轮同意的约 4x 入场水平——价值接近 $0.9-1.3B。熊市情景假设 ARR
              翻倍部分来自一次性或非经常性因素，独立审计揭示实质更低的收入基数（呼应被拒 $500M 要约隐含的较低倍数），且全行业 AI 基础设施「bubble」重估（据 CNBC 和 BlackRock
              评论）压缩整体倍数——组合结果指向约 $0.5-0.8B，等同于较 2026 年 6 月 mark 下调。最大正向杠杆，是经审计确认 ARR 增长及其耐久性；最大负向杠杆，是收入质量重述和 GPU
