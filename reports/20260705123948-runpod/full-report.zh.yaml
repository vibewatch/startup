  - id: TV005
    title: 论点破裂和终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 收入质量重估
        - 审计数据确认 ARR 明显低于约 $240M 的估计值，或更接近被拒 $500M 报价隐含的水平
        - 隐含入场倍数从可辩护转为明显偏高
        - 不要在 2026 年 6 月估值或更高水平加码
      - - Community Cloud 持续商品化
        - Vast.ai 或其他市场型竞品长期压低 RunPod 社区层价格
        - ARR 内含利润率被压缩，削弱增长质量论点
        - 将基准情景倍数下调至情景区间低端
      - - 出口管制或合规事件
        - 确认出现风险章节所提示类型的执法行动或合规范围失守
        - 直接折价市场平台模式的耐久性，并可能触发客户流失
        - 视为估值层面的红旗，而不只是运营问题
      - - 宏观 AI 基础设施重定价
        - 公共市场 GPU 云可比公司（CoreWeave、Lambda 上市后）倍数持续收缩
        - RunPod 的私募估值失去公共市场锚点，难以自证
        - 按新的行业基准重新核算入场倍数
      - - 治理或优先权堆栈披露
        - 融资条款显示清算优先权堆栈沉重，或老股与新股比例不利
        - 账面 $1B 估值可能高估新普通股投资人可实现的价值
        - 因结构性优先级折价有效入场价
    notes: 这些触发项是可监控的尽调阈值，把披露稀薄的私营公司叙事转成明确的推进 / 不推进条件；阈值由分析师设定，不是公司披露。
    claimRefs:
      - CV003
      - CV028
      - CV033
      - CV034
      - CV035
      - CV036
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
      - 可接受阈值
    rows:
      - - 经审计 ARR 与增长
        - 经审计或审阅的 ARR、月度分群增长，以及约 $120M 至约 $240M 轨迹的勾稽
        - 收入基数未经独立确认前，入场倍数无法核算
        - CFO 材料包加审计师确认
        - 一个可辩护的收入数字，且落在可支撑的倍数区间内
      - - 分层毛利率
        - 按 Secure Cloud 与 Community Cloud 拆分的毛利率和抽成率数据
        - 区分有认证支撑的耐久经济性和商品化市场收入
        - 财务和产品复核
        - 证据显示 Community Cloud 利润率稳定，而不是在价格竞争下被侵蚀
      - - 融资结构
        - 2026 年 6 月轮次的清算优先权、棘轮条款，以及新股 / 老股拆分
        - 如果优先权层层堆叠，账面 $1B 估值会高估普通股转让价值
        - 由律师牵头复核股权结构表和条款清单
        - 结构足够干净，才能相信账面估值
      - - 被拒报价勾稽
        - 被拒 $500M+ 收购报价方身份及条款
        - 检验战略买方折价反映真实风险，还是机会主义出价
        - 董事会会议记录和投行（J.P. Morgan）流程复核
        - 对被拒报价与新股轮价格之间差距给出可信解释
      - - 出口管制与合规敞口
        - Community Cloud 主机司法辖区数据和出口管制筛查政策（见风险章节）
        - 一旦确认合规缺口，估值需要单独折价
        - 法务 / 合规尽调与风险章节的问题协同推进
        - 主机基础中未识别出重大出口管制敞口
      - - 退出和流动性计划
        - 董事会和投资方对 IPO 时点、战略出售意愿、二级市场政策的看法
        - 结合 Lambda 更近的 IPO 测试案例，判断现实回报时间
        - 投资方和董事会材料复核
        - 可信且与里程碑挂钩的流动性计划
    notes: 问题按对核算质量影响大小排序；每个问题都对应可监控阈值，而不是按管理层最容易提供什么来排。
    claimRefs:
      - CV003
      - CV028
      - CV029
      - CV036
      - CV037
      - CV038
      - CV039
