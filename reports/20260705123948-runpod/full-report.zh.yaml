    type: flow
    layout: standard
    summary: RunPod 维持「跟踪」评级：真实 ARR 规模和最新融资信号不错，但未经审计收入、战略收购报价与成长股权估值之间的大差距，以及市场利润率风险抵消了上行。
    approximationNotes: 该流程是定性而非概率模型，映射的是截至 2026-07-05 保留下来的公开证据所支撑的决策链。
