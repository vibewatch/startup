      - number: '7.5'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              RunPod 是私有公司，除融资轮新闻稿提及外，管理层深度公开披露有限；仅凭公开来源无法精确评估关键人集中度。2026 年 6 月 Summit Partners 轮新增 Michael Medici
              机构董事席位，标志着 RunPod 在这一规模下首次出现成长股权董事会存在，也意味着一次治理过渡：创始人控制需要与新的机构监督平衡，典型的快速扩张执行风险随之而来。J.P. Morgan
              作为唯一配售代理，暗示定价前进行过某种机构级尽调，是轻微正面信号。近五个月 ARR
              翻倍意味着工程、支持和社区主机管理人员也需要相应扩张，但公开来源没有披露招聘是否跟上增长；这是实质执行风险缺口，而不是已确认问题。保留来源中没有发现 RunPod 2026
              年高管离职或领导层更替的公开证据；鉴于公司私有且披露少，这一点令人安心但未获验证。总体看，RunPod
              必须同时扩张基础设施以满足需求、抵御市场价格竞争，并管理新的机构治理预期——这是快速扩张基础设施创业公司典型的多线执行负担。
