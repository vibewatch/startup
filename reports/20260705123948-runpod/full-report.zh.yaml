  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品模块、GPU 目录与核心开发者工作流
        blocks:
          - type: paragraph
            body: >-
              RunPod 应按单一账户 GPU 云来承保，核心产品有三条：Pods（面向开发和训练的持久化 GPU 实例）、Serverless（自动扩缩、按秒计费的推理端点）和 Instant
              Clusters（多节点分布式计算），另有第四个市场入口 RunPod Hub，叠在 Pods 已经使用的同一套 Templates 系统之上。RunPod 官网声称目录覆盖 31 个全球区域、超过 30 种
              GPU SKU；GPU-types 参考页也证实该目录不只支持 NVIDIA：AMD Instinct MI300X（192GB）与 NVIDIA A100 80GB PCIe 和 SXM4
              卡并列。按工作流看，Serverless 开发者编写 Python handler(event) 函数，把它部署到基于队列或负载均衡的 Endpoint 后面，再交给 RunPod 的 autoscaler 和
              FlashBoot 冷启动缓存管理 worker 生命周期；RunPod 宣传 FlashBoot 可把冷启动压到 200ms 以下，并在新端点默认启用。两点需要压低这些说法的可信度：RunPod
              官网在不同区块宣传的具体自动扩缩和正常运行时间数字存在轻微内部不一致；如果把端点的 active-worker 最小值设为 0 以上来消除冷启动，就要持续为闲置容量付费——RunPod 把这个真实的成本 /
              延迟取舍暴露成配置项，而不是替客户解决。
