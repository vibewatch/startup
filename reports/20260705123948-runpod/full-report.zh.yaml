      - number: '2.5'
        title: 竞争格局与市场规模 / 尽调缺口
        blocks:
          - type: paragraph
            body: >-
              RunPod 的竞争集分四层。CoreWeave 是占主导地位、已上市的专业 GPU 云龙头（Nasdaq: CRWV；2026 年 Q1 收入 $2.08 billion，待履约订单 约 $100
              billion，活跃电力超过 1 gigawatt，目标 2030 年超过 8 gigawatts），靠规模和 hyperscaler 级合同竞争，RunPod 并不追逐这类合同。Lambda
              是偏开发者易用性的同业，据报 2025 年 5 月 ARR 超过 $500 million，并在 2025 年 11 月由 TWG Global 领投融资 $1.5 billion 后，推进 2026 年
              IPO。Vast.ai 是纯点对点 GPU 市场，几乎完全靠价格竞争（旧硬件 GPU 费率低至约 $0.06/hour），可靠性取决于主机。Together AI（到 2026 年 2 月年化收入约 $1.0
              billion，估值 $3.3 billion）和 Modal Labs（到 2026 年 4 月年化收入约 $300 million，估值 $1.1 billion）位于更上层，是托管 / Serverless
              推理平台，完全抽象掉 GPU 选择，与 RunPod 的 GPU 优先模式是不同价值主张。三大 hyperscaler 仍同时是竞争者和潜在掠夺式定价威胁，因为资本和 Nvidia 配额优先级远高于
              RunPod。就市场规模本身而言，本章保留而非化解 Grand View Research 和 Fortune Business Insights 对 GPUaaS 估算之间的矛盾，并提示 RunPod 的
              SOM 份额高度取决于读者选择哪一种 TAM/SAM 口径——这是真实方法论缺口，不是本报告的报道错误。买方采用数据也比价格数据更薄：已审阅来源没有披露 RunPod
              从注册、首次付费工作负载到企业升级之间的实际转化率，因此本章的采用漏斗只能建立在带来源标签的示意比例上，而不是 RunPod 披露数字。
