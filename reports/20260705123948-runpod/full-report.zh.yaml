      - CV030
      - CV036
  - id: TV002
    title: 正反投资论点表
    columns:
      - 框架
      - 支撑证据
      - 重要性
      - 改变判断的因素
    rows:
      - - 正方论点
        - 分析师估计截至 June 2026 ARR 接近 $240M，较 January 2026 的 ~$120M 约翻倍
        - 证明在快速增长的 GPU 云品类中，营收规模和动能真实存在
        - 经审计 ARR 和分群增长数据可确认轨迹真实且可持续
      - - 正方论点
        - 本轮融资由 Summit Partners 领投，J.P. Morgan 担任唯一配售代理
        - 机构成长股权流程提供外部验证，降低持续经营和纯炒作风险
        - 披露融资条款清单和优先权结构，可确认价格是否克制，而非由动量驱动
      - - 正方论点
        - 隐含 ~4.2x ARR 倍数低于 CoreWeave 公开的 6.8-12.8x EV/Revenue 区间，也低于 Lambda 未确认的隐含倍数
        - 说明相对公私市场 GPU 云可比对象，$1B 估值并不明显过贵
        - 若确认 CoreWeave/Lambda 倍数是正确参考组，而不是应套用商品化市场平台折价，该论点会增强
      - - 反方论点
        - 据称 RunPod 在 $1B 轮前不久拒绝了超过 $500M 的收购报价
        - 战略买方与成长投资人的定价存在实质差距，说明估值不确定性仍未解决
        - 披露被拒报价条款和竞标方理由，可弥合大部分缺口
      - - 反方论点
        - 没有经审计财务；ARR 来自自报和分析师估算（Sacra、ValueAdd VC）
        - 收入基数独立验证前，入场倍数无法完整承销
        - 一套 CFO 层级 KPI 包，加上经审计或审阅财务，可解决该问题
      - - 反方论点
        - Community Cloud 市场平台面临 Vast.ai 和同业的直接价格竞争（见风险章节）
        - 即使收入继续增长，商品化也可能压缩 ARR 数字内含的利润率
        - 按层级划分的毛利率，以及相对市场平台竞争者的赢率数据，可厘清持久性
    notes: 将核心增长与融资论点，同未经审计收入和市场平台利润率缺口配对；这些缺口让建议停留在跟踪，而不是买入。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV028
      - CV029
      - CV030
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 示例估值区间
      - 相对 $1B 估值信号
      - 关键下行 / 触发因素
    rows:
      - - 乐观
        - ARR 增至 $400-500M，Secure Cloud 占比提升，经审计财务确认增长，倍数向 CoreWeave 低端重估
        - $3.2B-$5.0B
        - 较入场估值有明确上行
        - 若经审计增长不及预期，或 Secure Cloud 占比未提升，情景失效
      - - 基准
        - ARR 增速放缓但仍强劲，价格战压制利润率扩张，倍数维持在 ~4x 入场水平附近
        - $0.9B-$1.3B
        - 围绕估值大致持平到小幅上行
        - 若 Community Cloud 商品化加速，情景停滞
      - - 悲观
        - ARR 翻倍被证明部分不可重复，审计揭示收入基数更低，全行业 AI 基础设施倍数压缩冲击 GPU 云可比对象
        - $0.5B-$0.8B
        - 相对入场估值有显著下行
        - 由收入质量重述或广泛 AI 泡沫重定价事件触发
    notes: 估值区间为分析师根据公开可比对象和情景假设给出的美元十亿级估算，并非完整股权结构瀑布或 DCF；悲观情景将公开同业倍数压缩套用到按未审计口径调低后的收入估计。
    claimRefs:
