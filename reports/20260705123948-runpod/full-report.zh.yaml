      - number: '3.3'
        title: 切换成本、锁定、多归属，以及分发 / 供应商权力
        blocks:
          - type: paragraph
            body: >-
              RunPod 和包括 Vast.ai 在内的大多数 neocloud，都把「无合同、按秒计费、无锁定」作为相对 hyperscaler 的核心差异点。Hyperscaler
              的长期承诺合同和数据出站费用已受到直接监管审视：独立法律分析记录了美国、英国和欧盟监管机构对 AWS/Azure/GCP 出站费用和最低消费合同作为切换成本机制的关注，部分市场报告年客户切换率低于 1%，并指出
              Google Cloud 在 2024 年初在压力下取消了部分出站费用。这对 RunPod 这类 neocloud 替代方案是结构性顺风，但也说明 hyperscaler
              确实会竞争性回应。鉴于各供应商都可自助、无合同上手，用户同时多归属于 RunPod、Vast.ai、Lambda 和某个 hyperscaler
              在技术上看起来并不难；但本语料没有任何来源记录画像竞争者存在正式排他或反多归属条款，因此唯一有证据的角度是行为上的切换成本，而非合同上的切换成本。按服务质量带来的分发权力看，RunPod 发布了自己的正常运行率
              / 事件历史状态页，并由第三方监控 StatusGator 独立交叉核对，同时也在 G2 和 Trustpilot 等独立平台被评论；这至少给 RunPod 提供了部分独立可靠性信号，而多数更小的
              neocloud 同业似乎没有同样显眼地发布这些信号。供给侧，整个 GPU 云类别，包括 RunPod，都依赖 NVIDIA GPU 配额。McKinsey 独立分析称，neocloud
              的「裸金属经济性很脆弱」，因为旗舰 Blackwell 世代芯片交期为 36-52 周（把新订单推到 2027 年），且依赖 hyperscaler 预先承诺后留下的配额；另有分析师评论指出，RunPod
              没有公开披露向 AMD 或 Intel Gaudi 硬件做有意义的多元化。这是 RunPod 与本章所有画像竞争者共同承担的单一供应商依赖风险。
