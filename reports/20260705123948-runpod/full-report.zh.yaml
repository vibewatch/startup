    type: stack
    layout: wide
    summary: 用五层看一条请求如何从 RunPod 的 API 接入面下沉到物理 GPU 容量；市场层并行存在，承担模板 / 应用分发渠道。
    data:
      layers:
        - label: 客户端 / API 层
          detail: REST API（rest.runpod.io）、控制台 UI、CLI（runpodctl）和 runpod-python SDK（GitHub 302 星）。
        - label: 编排层
          detail: Serverless Endpoints（队列型或负载均衡型）加自动扩缩器（按队列延迟或请求数公式扩缩容）。
        - label: Worker / 容器层
          detail: 客户的 Docker workers 运行 handler(event) 函数，并由 RunPod 的 FlashBoot 冷启动缓存加速。
        - label: GPU 基础设施层
          detail: >-
            Community Cloud（第三方主机）、Secure Cloud（经审查且具备 SOC 2 / ISO 27001 / PCI DSS 的合作伙伴）和 Instant
            Clusters（多节点、InfiniBand / 800G 网络互联）。
        - label: 存储 / 网络层
          detail: Network Volumes、2026 年 6 月高性能卷，以及用于模型 / 数据迁移的 S3 兼容 API。
        - label: 市场层（RunPod Hub）
          detail: 基于与 Pods 相同 Templates 系统搭建的模板 / 应用商店，并为发布方披露了收入分成。
    approximationNotes: 层级边界来自 RunPod 自身文档结构，不是独立逆向工程得出的系统图。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE010
      - CE018
      - CE021
  - id: FE002
    title: 客户工作流 / 运行流程
    type: flow
    layout: wide
    summary: 从编写 handler 函数到上线一个可监控、可自动扩缩的生产端点，公开文档给出的路径。
    data:
      nodes:
        - id: write-handler
          label: 编写 handler(event)
          detail: 开发者按 RunPod SDK 约定编写 Python handler 函数。
          tone: neutral
        - id: build-image
          label: 构建 worker 镜像
          detail: 将 handler 和依赖打进 Docker 容器，也可从模板开始。
          tone: neutral
        - id: deploy-endpoint
          label: 部署 Serverless Endpoint
          detail: 选择队列型或负载均衡型端点；FlashBoot 默认开启。
          tone: positive
        - id: autoscale
          label: 自动从 0 扩到 N 个 workers
          detail: 按队列延迟或请求数触发扩缩器增减 workers；设置 active-worker 下限会增加成本，但可消除冷启动。
          tone: neutral
        - id: monitor
          label: 通过状态页 / 日志监控
          detail: 实时日志和公开状态页提供运营可见性，但事故细节由客户端渲染。
          tone: warning
      edges:
        - from: write-handler
          to: build-image
        - from: build-image
          to: deploy-endpoint
        - from: deploy-endpoint
          to: autoscale
        - from: autoscale
          to: monitor
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE010
      - CE033
