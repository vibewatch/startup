      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 跟踪，不买入，直到 ARR 经审计
            body: RunPod 真实的 ARR 规模和当前机构融资值得严肃关注，但未经审计的收入基数，以及相对被拒 $500M+ 收购要约的巨大差距，使判断应停留在跟踪 / 继续研究，而不是买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV028
          - type: callout
            title: 低于可比公司的倍数不自动等于便宜货
            body: >-
              按隐含 ARR 倍数看，RunPod 约 4.2 倍低于 CoreWeave 的 6.8–12.8 倍，也低于 Lambda 更高的隐含倍数， 表面上偏保守；但只有 RunPod 的 ARR
              和利润率韧性最终能接近公开同行经审计数据所显示的水平，这组比较才站得住。
            calloutType: insight
            claimRefs:
              - CV009
              - CV010
              - CV017
          - type: callout
            title: 被拒报价与融资估值之间的缺口，可能是风险定价，也可能是机会主义出价
            body: 被拒的 $500M+ 收购报价与 $1B 一级市场融资之间的差距，可能说明战略买家准确计入了收入质量和市场毛利风险； 也可能只是一次趁势压价。公开证据无法区分两者。
            calloutType: assumption
            claimRefs:
