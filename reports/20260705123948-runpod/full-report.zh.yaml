      - number: '8.5'
        title: 退出准备度、论点失效与最终尽调
        blocks:
          - type: paragraph
            body: >-
              RunPod 今天还未达到 IPO 准备状态，管理层也没有释放近期上市信号；中期最可能的退出路径，是战略出售、后续增长轮，或等 Lambda 自己 2026 年 H2 上市检验公开市场对 GPU
              云可比公司的胃口后再 IPO。从跟踪升级到买入，完全取决于证据。第一个论点失效条件是披露：没有经审计 ARR、按层级划分的毛利率（Secure Cloud versus Community Cloud），以及对约
              $120M 到约 $240M 增长主张的调节，就无法有信心地承保入场倍数。第二个是结构：主融资轮的 cap table 条款、清算优先权，以及 Summit Partners 投资带来的董事席位 /
              治理含义均未披露，因此 headline $1B mark 未必等于可转移给新普通股投资者的价值。第三个是竞争和监管：Community Cloud 价格战持续商品化，或出现风险章节所标记类型的已确认出口管制 /
              合规事件，都将独立压缩增长和持久倍数。最终尽调应聚焦 CFO 级 KPI 包（经审计
              ARR、按层级划分利润率、净收入留存）、融资条款清单，以及对被拒要约估值缺口的调节。这些缺口都不会直接打破投资故事；它们解释了为什么有纪律的姿态应是跟踪、索要 data room，并只在证据出现后升级。
