  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局——直接同业、市场、hyperscaler 与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              RunPod 的竞争横跨五个相互重叠的类别。直接 neocloud 同业——Lambda Labs、CoreWeave、Vast.ai——按秒或按小时出租 GPU 算力，价值主张同样偏开发者优先；Lambda 在
              2025 年 11 月由 TWG Global 领投融资 $1.5B，此前已有一笔数十亿美元级 Microsoft 供给协议，并另据报道正洽谈 $350M 的 IPO 前融资，目标 2026
              年下半年上市；CoreWeave 已经上市（NASDAQ: CRWV），披露的规模和债务都远高于 RunPod。Vast.ai 是纯点对点 GPU 市场，实时、拍卖式定价经常在可比 H100 硬件上比
              RunPod 按需价低 40-50%，构成最直接的自下而上商品化威胁。Serverless 推理和 API 优先平台——Modal Labs、Replicate、Together AI——属于相邻竞争者，把原始
              GPU 租赁抽象进托管执行或 token 定价层；尤其 Together AI 的计价单位根本不同（token，而不是 GPU-hours），Modal 的按秒 Serverless 计费则直接映射 RunPod
              自身的颗粒度。Hyperscaler（AWS、Azure、Google Cloud）是 RunPod 客户随时可回到的既有替代方案；按独立第三方价格追踪，可比按需 H100 实例每 GPU-hour 价格比
              RunPod 高 2x-4x。许多开发者的现状替代方案很简单：根本不租云 GPU，而是使用个人工作站或大学 / 雇主集群；技术能力强的团队也可以直接对接 hyperscaler 原始计算 API
              自建，而不是订阅任何托管 neocloud 层。未来潜在进入者包括 hyperscaler 包装更便宜、类似 RunPod 的灵活 / 现货 GPU 层以压制 neocloud 份额增长，以及更多 NVIDIA
              支持或主权资本支持的 neocloud 在 GPU 供给扩张后进入；本语料中没有来源点名这些类别威胁之外的具体新进入者。
