  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              RunPod 的核心暴露在于，美国针对先进 AI 芯片的出口管制政策已经收紧且仍在变化，而 RunPod 运营的是分布式、社区主机市场模型，比集中式数据中心运营商更难按司法辖区审计。商务部工业与安全局（BIS）在
              2025 年撤销拜登时期的「AI Diffusion Rule」，但以更强且持续演进的芯片相关出口管制取而代之，并在 2026 年 6 月前进一步收紧；原始 Federal Register
              框架文本建立了分层国家算力出口结构，尽职调查和记录保存义务覆盖云和数据中心运营商，而不只是直接芯片出口商。Greenberg Traurig 和 Sidley Austin
              两家律所分析均确认，即使不是采购方，托管芯片的实体也受这些义务约束；Sidley 还指出，管制现已覆盖在受管硬件上训练的 AI 模型权重。由于 RunPod 的 Community Cloud 层运行在第三方 /
              个人运营硬件上，而非集中自有基础设施，其主机司法辖区尽调姿态从外部看比 CoreWeave 的集中式模型更不透明。RunPod
              自家合规页面也强化了这种模糊性：其称合规覆盖可能随工作负载、区域、供应商和部署模型而变化，并应在安全审查中确认；其独立 Data Processing Agreement 显示，公司隐私 /
              合规姿态的一部分依赖合同和配置，而不是一张覆盖全平台的认证。另外，RunPod cookie 政策确认公司同时使用第一方和第三方 cookies，包括定向 / 广告
              cookies；这对软件企业很常见，但仍构成一个区别于基础设施安全主张的网站层面隐私合规面。另外，RunPod 自家服务条款设置有约束力的仲裁条款和集体诉讼豁免，限制客户诉讼救济；其 Acceptable Use
              Policy 禁止社区节点上的非法内容和加密挖矿，但执法依靠自动监控加用户报告——对匿名主机市场来说，这是一个不完美的检测层。围绕云「stickiness」的行业性反垄断评论，是一个值得跟踪的次要、非
              RunPod 专属法律主题。截至 2026-07-05，公开公司登记和一般网络搜索未发现点名 RunPod 的重大监管执法行动或诉讼；但这是缺乏证据的发现，不是确认记录清白，因为本轮研究无法直接访问
              PACER/Justia 案卷。
