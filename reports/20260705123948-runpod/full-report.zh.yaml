  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 作用
      - 依赖
      - 风险
    rows:
      - - 客户端 / API 层（REST API、控制台、CLI、SDK）
        - 请求、资源供给、计费、模板管理的入口
        - rest.runpod.io API 面；runpod-python SDK（302 个 GitHub star）
        - API / schema 变更可能打断第三方集成，例如独立 Terraform provider 和 agent-skill 工具
      - - 编排层（Endpoints、队列引擎、autoscaler）
        - 路由请求；管理作业队列或直接负载均衡；处理 autoscaling 逻辑
        - RunPod 文档披露内部 queue-delay / request-count 扩缩公式
        - 因闲置而缩下来的 Endpoints 会保持低容量，直到手动调高；这是运营陷阱，可能悄悄卡住容量
      - - Worker / 容器层（Workers、handler functions、FlashBoot）
        - 执行客户 Docker 镜像和 handler 代码；压低冷启动
        - Docker 容器运行时；FlashBoot 缓存；客户编写的 handler(event)
        - 冷启动和可靠性不仅取决于 RunPod 基础设施，也取决于客户镜像大小 / 质量
      - - GPU 基础设施层（Community Cloud、Secure Cloud、Instant Clusters）
        - 跨 30+ SKU 和 31 个区域的物理 / 虚拟化 GPU 容量
        - Community Cloud = 第三方主机；Secure Cloud = 经过筛选、具备 SOC 2 / ISO 27001 / PCI DSS 的伙伴
        - Community Cloud 容量和主机行为取决于第三方，RunPod 无法完全控制
      - - 存储 / 网络层（Network Volumes、高性能卷、S3-compatible API）
        - 支撑 Pods、Serverless 和 Clusters 的持久存储与数据移动
        - 高性能 Network Volumes（2026 年 6 月推出）目标是缩短模型加载时间
        - 除发布说明里的“兼容数据中心”标识外，未披露 SLA 或吞吐保证
      - - 市场层（RunPod Hub、Templates、收入分成）
        - 允许第三方发布可部署模板并变现
        - GitHub 来源模板一键部署；收入分成条款有文档
        - 未披露模板数量、质量审核流程或收入分成争议解决机制
    notes: 架构根据 RunPod 自身文档（docs.runpod.io）重建，而非独立系统审计；依赖和风险两列标出哪些行为 依赖客户控制的镜像，或依赖 RunPod 自身无法完全控制的第三方主机。
