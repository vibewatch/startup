              Technologies Capital，RunPod 此前的种子轮投资方）补充了有用的起源背景：RunPod 最早的客户是用 Disco Diffusion 图像生成模型做实验的创意人群，之后才演化为构建商业
              GenAI 产品的开发者和团队——这意味着当前面向企业的定位，是叠加在爱好者 / 创意社区基础上的相对新近的一层。第五个新近相关的群体，是受监管行业买家（医疗、欧盟企业）；RunPod 2026 年 2 月
              HIPAA/GDPR 验证明确为打开这类需求而设计。本章始终适用两项结构性 caveat：RunPod 未披露正式的分客群收入或账户数拆分；其官网客户证言提到企业级渲染工作（包括一段引语中的 AMD 和
