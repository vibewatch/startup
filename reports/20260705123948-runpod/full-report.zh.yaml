      - number: '2.2'
        title: 用多种口径拆解 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              没有一个单一市场规模数字能概括 RunPod 的机会；即便同看 2025 年基准年、同看 GPUaaS 类别，独立研究机构之间分歧也很大。Grand View Research 估算全球
              GPU-as-a-Service 市场 2025 年为 $4.37 billion，到 2033 年增至 $14.46 billion，2026-2033 年 CAGR 为 16.0%。Fortune
              Business Insights 对同一类别给出不同口径：2025 年 $6.07 billion，2026 年 $8.66 billion，到 2034 年 $162.54 billion，CAGR 高达
              44.3%；相较 Grand View 对名义同一市场的估计，2025 年基数高约 39%，CAGR 近 3 倍。更宽、接近 SAM 的口径是 Fortune Business Insights 的 AI
              Inference 市场：2025 年 $103.73 billion、2026 年 $117.80 billion，至 2034 年 CAGR 为 12.98%。这是 RunPod 的 Serverless
              产品最直接服务的部署 / 执行层，但该数字也包含 RunPod 不覆盖的本地部署和 hyperscaler 原生推理。在这一范围下，RunPod 自己披露的约 $240 million 年化收入（2026 年 6
              月）相当于较窄 $8.66 billion-$4.37 billion 这个 2025/2026 GPUaaS TAM 区间的约 2.8-5.5%，或宽口径 AI 推理 SAM 中的远低于
              1%。这是本报告显式计算的 SOM 对比，而非取自任何单一发布方，因为已审阅来源没有给出 RunPod 专属 SOM 数字。作为规模参照，上市 GPU 云龙头 CoreWeave 仅 2026 年 Q1
              收入就达到 $2.08 billion（2025 年 Q1 为 $982 million），收入待履约订单 接近 $100 billion；即便 RunPod 自身增长率可比，它距离品类最大玩家仍很远。
