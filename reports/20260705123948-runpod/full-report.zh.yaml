      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              RunPod 的增长逻辑建立在真实的结构性供需错配上：Nvidia 2025 年 Q4 数据中心收入达 $57.0 billion（同比 +62.5%），而同季前五大 hyperscaler 资本开支约为
              $130.7 billion。这意味着 hyperscaler 吸收了新 GPU 供给的大多数，用于自身基础设施，独立开发者被 AWS/Azure/GCP 结构性服务不足，只能转向
              neocloud。叠加其上，AI 推理工作负载增长（SAM 口径 CAGR 12.98%）是多年期的世俗驱动。压制 RunPod 的力量也很清楚：hyperscaler
              的预留和承诺用量折扣会压缩表面价格差。本报告自己的价格对比显示，按需 H100 费率在 neocloud 低端约为 $2.64/hour，在 Azure 按需为 $12.29/hour，但 Azure 3
              年预留价降至约 $5.47/hour；愿意承诺资本的买方可把 neocloud 折扣削掉一半以上。资本充足的 neocloud 对手是第二重约束：仅 CoreWeave 一家，在 Blackstone 和
              CoreWeave 自有投资者关系页面披露的过去 12 个月窗口中，就通过债务和股权融资超过 $12 billion；RunPod
              全股权资产负债表无法逐美元匹配这类资本。监管风险真实存在，但当下仍在变化：美国商务部已撤销 Biden 时代 AI Diffusion
              Rule，该规则原本会按国家分层限制芯片出口；截至本报告来源，替代规则仍未落地。任何拥有国际 Community Cloud 主机的提供商，中期 GPU 出口政策都确实不确定。最后，宏观情绪本身也是约束：截至
              2026 年 1 月，公开评论仍在激烈讨论 AI 基础设施支出是否存在泡沫；按 Yahoo Finance 数据，CoreWeave 自身市值在最近几个季度从约 $79.6 billion 摆动到 $44.6
              billion。这提醒我们，包括 RunPod 自身 $1.0 billion 估值在内，neocloud 估值暴露在更广泛资本市场回调风险之下。
