              仅五个月就翻倍。这些数字比一般自报增长主张更有分量，因为多项指标获得独立来源直接印证：TechCrunch 自己的报道（不是新闻稿复述）确认 500,000 名开发者；独立分析报告 Endplan.ai 另行印证
              $120M ARR、收入同比增长 90%、注册同比增长 155%，并按 Series C 前约 $22 million 的总披露融资额，计算 RunPod 资本效率约为 ARR 的 5.5x。RunPod
              还披露了大型使用量代理指标——累计超过 20 billion 次 Serverless 推理请求、年网络流量超过 8 exabytes、内部网络容量超过 20+ terabits per
