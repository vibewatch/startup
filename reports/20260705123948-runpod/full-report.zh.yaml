      - number: '1.3'
        title: 融资历史、估值与投资方基础
        blocks:
          - type: paragraph
            body: >-
              RunPod 已披露融资历史分三段。第一，州级 Form D 通知（EFDID 0002002761-23-000001）记录首次证券销售发生在 2023-11-20，发行规模为 $22,512,951，其中
              $18,517,994 已售出，并在 California、Delaware、New Jersey、Virginia 的蓝天法制度下备案——该文件时间点大约早于公司公开宣布种子轮六个月。第二，RunPod 与
              Intel Capital 于 2024 年 5 月 8 日联合宣布 $20 million 种子轮，由 Intel Capital 和 Dell Technologies Capital
              共同领投，Hugging Face 联合创始人 Julien Chaumond、前 GitHub CEO Nat Friedman 和 Adam Lewis 等天使投资人参与；TechCrunch
              另行报道称该轮对 RunPod 的估值约为 $100 million。第三，2026 年 6 月 24 日，RunPod 宣布由 Summit Partners 领投的 $100 million
              成长股权融资，估值 $1.0 billion；J.P. Morgan Securities LLC 担任唯一配售代理，Cooley LLP 担任 RunPod 法律顾问，Kirkland & Ellis LLP
              担任 Summit 法律顾问；同期报道把这次融资描述为不到两年内相对 2024 年种子轮估值约十倍跃升。包括 Technical.ly 和 CryptoBriefing 在内的多家媒体报道称，RunPod 在接受
              Summit Partners 资本前，拒绝了超过 $500 million 的收购报价；已审阅来源中，RunPod 自身并未直接确认这一说法。不同于更大的 GPU 云同行，RunPod
              没有披露任何公开债务工具。
