      - number: '3.2'
        title: 竞争对手画像、规模与价格 / 能力对比
        blocks:
          - type: paragraph
            body: >-
              按披露规模看，本章画像中的竞争集合横跨两个数量级。CoreWeave 是最大且唯一上市的同业，按 SEC 备案 10-Q，2026 年 Q1 确认收入 $2.078B（同比增长 112%），同时净亏损
              $(740)M、剩余履约义务 $98.8B；RunPod 到 2026 年 6 月据报 ARR 为 $240M，尚远未接近这一规模。Together AI 报告年化收入约 $1B、同比增长 375%、估值
              $8.3B（2026 年 7 月 Series C）；Modal Labs 在约八个月内 ARR 从 $60M 增至 $300M，并于 2026 年 5 月以 $4.65B 估值完成 $355M Series
              C。这些案例说明，RunPod 自身据报 ARR 五个月翻倍（从 $120M 到 $240M）方向上符合行业超高速增长，但绝对规模更小。价格上，RunPod 自有实时价格页列出 Secure Cloud 按需
              H100 SXM $3.29/hr、H100 NVL $3.19/hr、H100 PCIe $2.89/hr、A100 SXM $1.49/hr、A100 PCIe $1.39/hr；Vast.ai
              的市场模式在可比 H100 层级上比 RunPod 低约 40-50%（低至约 $1.47/hr），Lambda Labs 则有溢价（第三方聚合器 Spheron 口径下，PCIe $3.29/hr，8-GPU
              SXM 节点 $3.99/hr）。AWS、Azure、Google Cloud 处在价格阶梯顶部，可比 H100 实例每 GPU 约为 $6.88/hr、$12.29/hr、$10.98/hr。这让 RunPod
              相对 hyperscaler 成为中端性价比选项，但暴露在 Vast.ai 市场地板价的下切之下。能力上，Modal 和 Replicate 都把 GPU 访问包装进全托管 Serverless
              执行层（冷启动计费、自动扩缩、无需服务器管理），买方体验与 RunPod 和 Lambda 更偏基础设施的 GPU Pod 模式存在实质差异；Together AI 的 token 定价则让 LLM
              推理买方完全不再比较 GPU-hour。独立 MLPerf Inference v6.0（2026）基准结果显示，各提供商在标准工作负载上的性能接近，说明原始算力性能本身并不是画像集合中的持久差异化。
