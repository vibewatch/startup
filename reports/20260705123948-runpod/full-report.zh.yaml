              RunPod 触达，而不只依赖开发者直接注册。现有账户内的 land-and-expand 看起来真实存在——Civitai 的使用横跨 Secure 和 Community Cloud，120% NDR
              也意味着部分账户随时间扩大用量——但集中度风险指向公开来源无法解决的另一面：本章没有任何官方或独立来源披露 RunPod 收入中最大客户占比；RunPod 自家案例中心面对其声称的超过 100
              万开发者基础，只列出六个量化账户（外加 Glam Labs）。RunPod 拒绝超过 $500 million 的收购要约、转而选择 $1 billion 主融资轮，释放出管理层信心信号；但这也意味着
