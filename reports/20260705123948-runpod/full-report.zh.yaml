      - number: '7.3'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              RunPod 的轻资产模型依赖租用 GPU
              容量——包括来自个人和社区运营主机的容量——而不是自建数据中心；如果主机退出、涨价，或未能维护硬件和合规标准，公司就暴露在交易对手风险中。监管章节提到的出口管制司法辖区问题，也正是在这个社区主机层最难验证，因为
              RunPod 自家合规文档没有披露主机所在地理分布。上游方面，RunPod 依赖 Nvidia 和 AMD 作为 GPU 硬件供应商，二者都直接受同一 BIS 出口管制体系约束；2026 年关于 Nvidia
              供应约束的报道凸显了更广泛的 GPU 市场配给风险，可能影响 RunPod 以可预测成本获取芯片的能力。McKinsey 关于「neoclouds」的研究把 GPU 云供应商整体描述为结构性依赖
              hyperscaler 邻近资本和自身无法控制的 Nvidia 配额决策。资本侧，RunPod 2026 年 6 月增长轮由 Summit Partners 领投，J.P. Morgan
              担任唯一配售代理，Michael Medici 获得新的董事席位——这是该规模下首次出现机构成长股权董事会席位；而 2023-2024 年种子轮由 Intel Capital 和 Dell
              Technologies Capital 领投，早期战略投资者影响力较集中。最后，RunPod 的需求生成显著依赖有机社区渠道，包括广泛引用的 Reddit 发帖起源故事，以及活跃的 Reddit/Hacker
              News 社区讨论；这使增长营销依赖集中在少数社交 / 社区渠道上，而不是多元化企业销售动作。Ramp 的 vendor-intelligence 页面补充了一个有用的采购端数据点：它在 GPU 云供应商集合中把
              RunPod 排第 1，跟踪品类采用率为 43%；但也显示企业渗透率低于 SMB 采用率，这与 RunPod 仍更强于自下而上的开发者采用、而非大型企业标准化，方向一致。
