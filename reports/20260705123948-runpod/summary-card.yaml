summary:
  headline: >-
    RunPod has scaled to a reported ~$240M ARR with strong developer adoption and clear cost-positioning in GPU cloud,
    but limited disclosure and intense infrastructure competition keep the upside balanced by execution risk.
  overallScore: 7
  recommendation: buy
  confidence: medium
  riskRating: medium
  valuationStance: fair
