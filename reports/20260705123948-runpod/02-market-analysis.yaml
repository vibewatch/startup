callouts:
  - calloutType: insight
    title: TAM/SAM/SOM is a range, not a number, for RunPod's market
    body: >-
      Grand View Research and Fortune Business Insights disagree by roughly 39%
      on the same 2025 GPU-as-a-Service base year, and their forecast CAGRs
      differ by nearly 3x (16.0% vs. 44.3%). Any single-number TAM claim for
      RunPod's market should be treated as a methodology choice, not a
      settled fact.
    claimRefs: [CM007, CM008, CM009]
  - calloutType: risk
    title: Reserved hyperscaler pricing narrows RunPod's core value proposition
    body: >-
      RunPod and neocloud peers price H100 access as low as $2.64-$3.29/hour
      on-demand versus $12.29/hour on Azure on-demand, but Azure's 3-year
      reserved rate falls to roughly $5.47/hour — cutting the effective
      neocloud discount from roughly 5x to under 2x for buyers able to commit
      capital, which is exactly the large, predictable enterprise workload
      profile RunPod's Secure Cloud is trying to win.
    claimRefs: [CM021, CM034, CM035]
  - calloutType: risk
    title: AI-capex sentiment and neocloud valuation volatility
    body: >-
      Public commentary through January 2026 actively debates an AI
      infrastructure spending bubble, and CoreWeave's own market
      capitalization swung from roughly $79.6 billion to $44.6 billion across
      recent quarters per Yahoo Finance data. RunPod's own $1.0 billion mark,
      set June 24, 2026, was not stress-tested against this volatility in any
      source reviewed.
    claimRefs: [CM025, CM026]
