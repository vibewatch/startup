    title: Market sizing lens
    type: pyramid
    layout: standard
    summary: RunPod's ~$240M ARR sits inside a GPUaaS TAM that two research firms size differently, itself nested inside a much larger AI-inference SAM.
    data:
      nodes:
        - label: "Broader AI-inference SAM lens: $103.73B (2025) - $117.80B (2026)"
          detail: "Fortune Business Insights AI Inference market; includes on-prem and hyperscaler-native inference RunPod does not address"
          tone: neutral
        - label: "GPUaaS TAM, higher estimate: $6.07B (2025) - $8.66B (2026)"
          detail: "Fortune Business Insights GPU-as-a-Service market"
          tone: neutral
        - label: "GPUaaS TAM, lower estimate: $4.37B (2025)"
