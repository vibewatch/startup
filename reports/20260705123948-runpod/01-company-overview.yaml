  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: scale-metric
      missingEvidence: "A reconciled, single cumulative Serverless request count from RunPod (the June 2026 blog post and press release disagree by 2x)."
      whyItMatters: "Investors relying on RunPod's own scale disclosures cannot tell whether the company's internal metric reporting is disciplined; a 2x internal discrepancy in the same week is a governance/data-hygiene flag."
      diligencePath: "Request RunPod's internal Serverless request-volume dashboard or ask the company directly to reconcile the blog vs. press-release figures."
      relatedQuestionRefs: [QO020]
    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: "RunPod's current employee headcount."
      whyItMatters: "Headcount is a standard scale/efficiency metric (revenue-per-employee) that cannot be computed without it, and no RunPod primary source discloses it."
      diligencePath: "Request headcount directly from RunPod investor relations, or obtain a LinkedIn/Levels.fyi employee-count pull as a secondary proxy."
      relatedQuestionRefs: [QO017]
      relatedTableRefs: [TO001]
    - type: access-blocked
      severity: minor
      topic: adverse
      missingEvidence: "Verbatim review text from Trustpilot and G2 for RunPod."
      whyItMatters: "Without verbatim text, the specific complaint mix and rating distribution cannot be independently quoted, only summarized at the category level from secondary characterizations."
      diligencePath: "Re-fetch Trustpilot and G2 pages using an authenticated or headless-browser session that can pass anti-bot checks, or request a data export from each platform."
      relatedQuestionRefs: [QO026]
    - type: missing-source
      severity: minor
      topic: legal
      missingEvidence: "A direct PACER, state attorney general, or FTC enforcement-database search naming RunPod."
      whyItMatters: "The current 'no adverse legal action found' conclusion rests on general web search rather than an exhaustive legal-database check, so it could understate real legal exposure."
      diligencePath: "Run a direct PACER federal court search and a state AG consumer-protection database search for 'RunPod' and 'RunPod, Inc.'"
      relatedQuestionRefs: [QO027]
