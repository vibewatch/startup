callouts:
  - calloutType: risk
    title: RunPod's own request-volume figures disagree within the same week
    body: >-
      RunPod's founder-authored blog post (published alongside the June 24, 2026
      financing) states Serverless has processed "more than ten billion" cumulative
      inference requests, while the same-day PR Newswire release states "more than
      20 billion." Both are RunPod's own words, not third-party estimates, which
      makes the internal inconsistency itself noteworthy for diligence on RunPod's
      metric discipline.
    claimRefs: [CO024, CO025]
  - calloutType: strength
    title: Fast, well-corroborated capital step-up
    body: >-
      RunPod's valuation moved from roughly $100 million at its 2024 seed round to
      $1.0 billion in the June 2026 Summit Partners round, a step-up corroborated
      by RunPod's own release, the lead investor's own announcement, and multiple
      independent outlets, alongside ARR that at least doubled over the same
      window on the company's own disclosures.
    claimRefs: [CO013, CO015, CO022, CO023]
  - calloutType: risk
    title: Two-person key-person dependence with no disclosed bench
    body: >-
      Every leadership fact located in this pass — product vision, funding
      narrative, board additions, and public commentary — runs through co-founders
      Zhen Lu and Pardeep Singh. No other named executive (CFO, general counsel,
      COO, or otherwise) appears in any of the 32 sources reviewed, which is a
      material key-person concentration nearly five years into the company's life.
    claimRefs: [CO008, CO009, CO010, CO011]
