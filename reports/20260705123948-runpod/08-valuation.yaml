- id: comparable-valuation-lens
  title: Comparable valuation lens
  body: >-
    The comparable set argues for cautious discipline rather than either a clear discount or a clear premium read.
    CoreWeave, the closest scaled public GPU-cloud pure-play, carries a market cap near $44.6B and trades at
    6.8-12.8x EV/Revenue and 11.8-25x EV/EBITDA on 2026 estimates per StockAnalysis and MarketScreener, anchored by
    SEC-filed 10-Q disclosure; against that band, RunPod's implied ~4.2x looks conservative, though CoreWeave's scale,
    owned-infrastructure model, and public-market liquidity are not directly comparable to RunPod's smaller,
    asset-light, marketplace-heavy business. Lambda Labs, RunPod's closest direct competitor, raised $1.5B in a
    November 2025 round with post-money estimates of $5.9-15B (unconfirmed by the company) on roughly $505-520M of
    annualized revenue as of May 2025 — a considerably higher implied multiple than RunPod's, and Lambda is reportedly
    targeting an IPO in H2 2026 with Morgan Stanley, J.P. Morgan, and Citi engaged, which could re-rate the entire
    GPU-cloud comp set once it prices. On the M&A side, CoreWeave's $9B all-stock acquisition of Core Scientific used
    a 0.1235 exchange ratio at a time Core Scientific traded near 21.7x P/S, a multiple some analysts flagged as
    reflecting overvaluation and execution risk in AI-datacenter M&A generally — a useful ceiling-side caution rather
    than a floor. RunPod's own financing history — a roughly 10x step-up from its 2024 seed mark to the June 2026
    round — and its rejected $500M+ acquisition offers round out the comparable set as company-specific data points
    that bracket the multiple from below. Additional public-market anchors show how wide the band already is:
    CompaniesMarketCap put CoreWeave at $44.59B market cap and Core Scientific at $6.81B on July 4, 2026, while
    Yahoo Finance showed Core Scientific enterprise value at $7.86B around the March 2026 quarter-end. Sacra's
    CoreWeave profile highlights $5.13B of 2025 revenue, a prior $23B private valuation, and a $99.4B backlog by
    March 31, 2026, underscoring how far the scaled public GPU-cloud leader sits above RunPod on revenue depth and
    committed demand. SahmCapital separately warns that Core Scientific traded around 21.7x P/S in May 2026, a useful
    reminder that AI-infrastructure comps can embed exuberant expectations rather than provide a reliable floor.
    Sector-wide, CNBC and BlackRock's 2026 AI-bubble commentary is a qualitative but directionally important caution
    that public and private GPU-cloud multiples broadly could compress.
