  - Decision implication
  rows:
  - - Recommendation
    - Track / research-more
    - Real ARR scale and current financing, but unaudited revenue and a wide strategic-vs-growth-equity valuation gap
    - Stay engaged without underwriting the full $1B headline mark
  - - Overall score
    - 6/10
    - Fast-growing GPU-cloud platform offset by unverifiable ARR and marketplace margin risk
    - Interesting company, not yet a high-conviction entry at the current mark
  - - Confidence
    - Medium
    - Self-reported/analyst-estimated ARR with no audited filing to cross-check
    - Require private KPI diligence before upgrading confidence
  - - Risk rating
    - High
    - Export-control/community-host compliance gap plus unaudited revenue quality (see risk chapter)
    - Underwrite regulatory and revenue-quality downside first
  - - Valuation stance
    - Fair, with material downside risk
    - ~4.2x ARR sits below CoreWeave's 6.8-12.8x and Lambda's implied multiple, but the $500M rejected-offer gap and price-war margin risk cut the other way
    - Do not assume the multiple is automatically cheap just because it is below public comps
  - - Exit lens
    - Strategic sale, follow-on round, or later IPO
    - Lambda's targeted H2 2026 IPO is the nearest sector liquidity test case
    - Treat exit timing as sector-dependent rather than RunPod-specific
  notes: Public evidence only; the recommendation deliberately weights the unaudited-ARR gap, the rejected-acquisition valuation signal, and Community Cloud margin risk alongside genuine scale and a credible institutional financing process.
