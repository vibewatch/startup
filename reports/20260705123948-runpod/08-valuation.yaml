callouts:
- calloutType: recommendation
  title: Track, not buy, until ARR is audited
  body: RunPod's genuine ARR scale and current institutional financing support serious attention, but the unaudited revenue base and the wide gap versus the rejected $500M+ acquisition offer keep the call at track / research-more rather than buy.
  claimRefs:
  - CV001
  - CV003
  - CV028
- calloutType: insight
  title: A below-comp multiple is not automatically a bargain
  body: RunPod's implied ~4.2x ARR multiple looks conservative against CoreWeave's 6.8-12.8x and Lambda's higher implied multiple, but that comparison only holds if RunPod's ARR and margin durability turn out to be as strong as its public peers' audited figures show.
  claimRefs:
  - CV009
  - CV010
  - CV017
- calloutType: assumption
  title: The rejected-offer gap could reflect either risk-pricing or opportunism
  body: The gap between the rejected $500M+ acquisition offer and the $1B primary round may reflect strategic buyers correctly pricing in revenue-quality and marketplace-margin risk, or it may simply reflect an opportunistic lowball bid; public evidence cannot distinguish between the two.
  claimRefs:
