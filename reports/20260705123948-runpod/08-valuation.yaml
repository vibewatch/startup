  rows:
  - - 'CoreWeave (NASDAQ: CRWV)'
    - Public GPU-cloud pure-play
    - ~$44.6B market cap; 6.8-12.8x EV/Revenue; 11.8-25x EV/EBITDA (2026 est.); SEC-filed 10-Q disclosure
    - Closest scaled public proxy for GPU-cloud infrastructure valuation
    - Owns data-center infrastructure and trades at far larger scale than RunPod's asset-light marketplace model
  - - Lambda Labs
    - Private, pre-IPO direct competitor
    - $1.5B raised Nov 2025; post-money estimated $5.9-15B (unconfirmed); ~$505-520M annualized revenue (May 2025)
    - Nearest direct competitor and a near-term IPO test case (H2 2026, Morgan Stanley/J.P. Morgan/Citi engaged)
    - Valuation is analyst-estimated and unconfirmed by the company; wide range limits precision
  - - CoreWeave / Core Scientific merger
    - Completed AI-datacenter M&A (all-stock)
    - $9B deal value; 0.1235 exchange ratio; Core Scientific traded ~21.7x P/S at signing
    - Recent large AI-infrastructure M&A print showing achievable deal structures and pricing
    - Core Scientific's bitcoin-mining-to-AI-datacenter transition makes it an imperfect pure GPU-rental comp
  - - RunPod's own financing history
    - Private, primary round step-up
    - ~$100M valuation (2024 seed) to ~$1B (June 2026), a roughly 10x step-up on ~$240M estimated ARR (~4.2x)
    - Direct read on RunPod's own repeated-round pricing trajectory
    - Both ARR figures are self-reported/analyst-estimated, not audited
  - - Rejected acquisition offers
    - Private, unconsummated M&A signal
    - Offers reportedly exceeding $500M rejected shortly before the $1B round
    - Strategic-buyer price signal from close to the same time window as the primary round
    - Bidder identity and exact terms are unconfirmed; may reflect opportunistic lowball bidding rather than fair value
  - - 2026 AI-infrastructure sector sentiment
    - Analyst/institutional commentary (CNBC, BlackRock)
    - No RunPod-specific multiple; flags leverage, circular deals, and valuation-vs-monetization gaps sector-wide
    - Anchors the downside/multiple-compression case relevant to all GPU-cloud valuations, including RunPod's
    - Qualitative and macro; not a company-specific data point
  notes: The comparable set mixes a scaled public pure-play, a direct private competitor nearing IPO, a completed AI-infrastructure M&A deal, RunPod's own round history, its rejected-offer signal, and sector-level sentiment to bracket valuation rather than force a single-multiple answer; multiples are 2026 snapshots and move with markets.
