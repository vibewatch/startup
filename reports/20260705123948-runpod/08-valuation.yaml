- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue-quality restatement
    - Audited data confirms ARR materially below the ~$240M estimate, or nearer the level implied by the rejected $500M offer
    - The implied entry multiple shifts from defensible to clearly stretched
    - Do not add capital at or above the June 2026 mark
  - - Sustained Community Cloud commoditization
    - Vast.ai or other marketplace competitors durably undercut RunPod's community-tier pricing
    - Margin embedded in the ARR figure compresses, weakening the growth-quality case
    - Reset the base-case multiple toward the lower end of the scenario range
  - - Export-control or compliance event
    - A confirmed enforcement action or compliance-scope failure of the kind flagged in the risk chapter
    - Directly discounts the marketplace model's durability and could trigger customer attrition
    - Treat as a valuation-level red flag, not just an operational one
  - - Macro AI-infrastructure repricing
    - Public GPU-cloud comparables (CoreWeave, Lambda post-IPO) see sustained multiple compression
    - RunPod's private mark loses its public-market anchor for defensibility
    - Re-underwrite the entry multiple against the new sector baseline
  - - Governance or preference-stack disclosure
    - Financing terms reveal a heavy liquidation-preference stack or unfavorable secondary-vs-primary split
    - Headline $1B value may overstate what a new common-equity investor could realize
    - Discount the effective entry price for structural seniority
  notes: Triggers are monitorable diligence thresholds that convert a private, thinly disclosed story into explicit go / no-go conditions; thresholds are analyst-set, not company-disclosed.
