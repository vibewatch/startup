  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited or reviewed ARR, gross margin by tier (Secure Cloud vs. Community Cloud), and net revenue retention data.
    whyItMatters: Every valuation judgment in this chapter is downstream of self-reported, analyst-estimated ARR; without audited figures the entry multiple cannot be underwritten with confidence.
    diligencePath: Request a CFO-level KPI package and, where available, auditor-reviewed financial statements before committing further capital.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: rejected-offer-terms
    missingEvidence: The identity of the bidder(s), deal structure, and exact price of the acquisition offers RunPod reportedly rejected before the June 2026 round.
    whyItMatters: The size of the valuation gap between the rejected offer and the primary round is a central anti-thesis data point, but its interpretation depends on details not publicly disclosed.
    diligencePath: Request board minutes or banker (J.P. Morgan) process summaries covering the rejected-offer negotiation.
    relatedQuestionRefs:
