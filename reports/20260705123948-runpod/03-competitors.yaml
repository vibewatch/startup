  - - NVIDIA single-supplier dependency
    - McKinsey documents 36-52 week GPU lead times for flagship chips and hyperscaler pre-allocation priority, a structural constraint shared by RunPod and every competitor profiled
    - Medium
    - Request RunPod's disclosed or planned AMD/Intel Gaudi diversification roadmap, if any
  - - Customer diversification versus CoreWeave-style concentration
    - RunPod's own customer concentration is not independently disclosed, so this claimed advantage over CoreWeave's 65%-in-two-customers profile cannot be independently verified
    - Medium
    - Request RunPod's top-10-customer revenue concentration from management
