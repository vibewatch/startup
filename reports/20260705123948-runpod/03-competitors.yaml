  - - Price-to-value positioning versus hyperscalers
    - Independent analyst commentary states hyperscalers "have the resources to bundle competitive GPU offerings and undercut on price"
    - High
    - Track hyperscaler flexible/spot GPU tier pricing versus RunPod's on-demand rate over the next 12 months
  - - Per-second billing / no-lock-in differentiation
    - Independent analysts note per-second, contract-free billing is "now standard" and being replicated across neoclouds and even some hyperscaler-adjacent tiers
    - High
    - Identify any RunPod feature (Hub, Instant Clusters) not yet replicated by Lambda, Vast.ai, or Modal
  - - Asset-light marketplace model versus capital-intensive peers
    - CoreWeave's $8.5B+ investment-grade debt facilities demonstrate an alternative, well-capitalized model could still out-scale RunPod on raw GPU supply access
