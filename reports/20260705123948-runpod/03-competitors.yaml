  body: 'RunPod''s clearest structural differentiator versus capital-intensive peers is its claimed asset-light, marketplace-based model: its own documentation discloses a Hub creator revenue-share program (launched September 2025) that pays publishers a tiered percentage of compute revenue -- 0% below 100 monthly compute-hours up to 7% above 10,000 hours, paid in RunPod credits -- giving RunPod at least one concrete, documented take-rate mechanic that a purely owned-infrastructure competitor like CoreWeave does not need. That contrast is stark on capital structure: CoreWeave closed an $8.5B GPU-backed "DDTL 4.0" financing facility in March 2026 (the first HPC infrastructure loan to receive investment-grade ratings) on top of an earlier $7.5B Blackstone/Magnetar-led debt facility, and its SEC-filed S-1 disclosed Microsoft alone represented 62% of 2024 revenue (77% from its top two customers) -- both a capital-intensity profile and a customer-concentration risk that RunPod''s broader, more transactional developer marketplace may partially avoid, though RunPod''s own customer concentration is not independently disclosed anywhere in this corpus. Independent, non-vendor analyst commentary directly questions RunPod''s moat durability: AInvest states that intense competition from hyperscalers, which "have the resources to bundle competitive GPU offerings and undercut on price," is RunPod''s most direct threat, and that RunPod''s pay-per-second billing innovation is being replicated across the category, eroding the differentiation RunPod originally built its growth on. RunPod''s own self-published "best GPU cloud providers" comparison article, by contrast, is a company-authored and inherently self-serving framing that names RunPod favorably -- illustrating why this chapter treats vendor-authored comparison content as evidence of a company''s narrative, not as independent proof of its competitive position. Taken together, RunPod''s moat rests on price-to-value positioning against hyperscalers and on marketplace flexibility versus capital-intensive rivals, both of which are exposed to commoditization from Vast.ai''s marketplace floor below and from hyperscaler bundling and capital-scale advantages above.'
