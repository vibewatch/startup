  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: runpod-host-take-rate
    missingEvidence: The percentage RunPod pays Community Cloud GPU-hosting partners is not disclosed anywhere in RunPod's own Hub documentation, which only publishes the separate creator revenue-share tiers.
    whyItMatters: Without the host-side take rate, the true marketplace unit economics of RunPod's Community Cloud supply side cannot be modeled or compared to Vast.ai's equivalent host payout.
    diligencePath: Request RunPod's host/provider agreement terms directly from the company, or interview a Community Cloud host about actual payout rates.
    relatedQuestionRefs:
    - QP021
  - type: missing-source
    severity: material
    topic: runpod-customer-concentration
    missingEvidence: No independent source discloses RunPod's own customer concentration (its equivalent of CoreWeave's Microsoft/Meta exposure).
    whyItMatters: Customer concentration is a first-order competitive and financial risk factor for GPU-cloud providers; without it, RunPod's risk profile cannot be benchmarked against CoreWeave's disclosed concentration.
    diligencePath: Request RunPod's top-10-customer revenue concentration from management or from a future funding-round disclosure.
    relatedQuestionRefs:
    - QP026
  - type: enumeration-incomplete
    severity: minor
    topic: likely-entrants
    missingEvidence: No source in this corpus directly names a specific likely new entrant into RunPod's competitive set beyond generic categories (hyperscaler bundling, new neoclouds).
    whyItMatters: Without a named likely entrant, the "likely future entrants" content requirement is covered only at the category level, not with a specific company example.
    diligencePath: Track NVIDIA-backed neocloud investment announcements and hyperscaler GPU-bundling product launches for a specific named entrant.
    relatedQuestionRefs:
    - QP023
  - type: missing-source
    severity: minor
    topic: multi-homing-restrictions
    missingEvidence: No source reviewed documents a formal contractual exclusivity or anti-multi-homing clause for RunPod or any profiled competitor.
    whyItMatters: Absence of evidence of a restriction is not the same as confirmed absence; this affects confidence in the "no lock-in" competitive narrative.
    diligencePath: Request a copy of RunPod's and a competitor's standard enterprise terms of service to check for exclusivity clauses.
    relatedQuestionRefs:
    - QP024
  - type: stale
    severity: minor
    topic: trust-compliance-freshness
    missingEvidence: A dedicated, dated 2026 comparison of RunPod's security/compliance certifications against Lambda, CoreWeave, and hyperscaler competitors was not found in this corpus.
    whyItMatters: Trust/regulatory posture is one of the required comparison dimensions for this chapter; without a fresh, dedicated source the comparison rests on RunPod's own certification announcements only.
    diligencePath: Commission a side-by-side compliance-certification audit (SOC 2, ISO 27001, HIPAA) across RunPod, Lambda, CoreWeave, and Vast.ai.
    relatedQuestionRefs:
    - QP025
