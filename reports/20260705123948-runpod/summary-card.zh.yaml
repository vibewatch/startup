  topStrengths:
    - 据报达到 $240M ARR，外部资本投入相对很少，说明 GPU 基础设施领域少见的资本效率。
    - Hybrid Secure Cloud 加 Community Cloud 模式，似乎相对超大规模云替代方案形成了有意义的价格和供给定位优势。
    - 自助式开发者采用量约两年内从约 100,000 增至超过 1 million，证明开发者驱动分发很强。
    - Pods、Serverless 和集群配置覆盖面较宽，让 RunPod 同时暴露于推理和训练工作负载。
  topRisks:
    - AWS、Google、Microsoft、CoreWeave、Lambda 等资金充足的对手可以压价格，或在供给、工具和市场进入上花更多钱。
    - RunPod 不公开披露毛利率、现金消耗、客户集中度或经审计财务，限制承保信心。
    - GPU 供应、出口管制和 NVIDIA 主导的硬件集中度，带来 RunPod 无法直接控制的结构性产能和合规风险。
    - 公开 AI 基础设施可比公司本身也可能嵌入亢奋估值假设，降低当前 $1B 标记仍有充分安全边际的可信度。
  unresolvedGaps:
    - RunPod 实际毛利率、成本结构、烧钱速度和现金跑道仍未披露。
    - 客户集中度、流失率和企业账户结构没有公开数据。
    - 相比超大规模云，可靠性、SLA 表现和工作负载质量在公司控制来源之外只得到部分印证。
