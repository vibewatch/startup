        - id: write-handler
          label: Write handler(event)
          detail: Developer writes a Python handler function per RunPod SDK conventions.
          tone: neutral
        - id: build-image
          label: Build worker image
          detail: Package the handler and dependencies into a Docker container, optionally from a template.
          tone: neutral
        - id: deploy-endpoint
          label: Deploy Serverless Endpoint
          detail: Choose queue-based or load-balancing endpoint type; FlashBoot is on by default.
          tone: positive
        - id: autoscale
          label: Autoscale 0 to N workers
          detail: Queue-delay or request-count scaler adds/removes workers; active-worker minimum trades cost for eliminated cold starts.
