figures:
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: Five-layer view of how a request travels from RunPod's API surface down to physical GPU capacity, with the marketplace layer sitting alongside as a template/app distribution channel.
    data:
      layers:
        - label: Client / API layer
          detail: REST API (rest.runpod.io), console UI, CLI (runpodctl), and the runpod-python SDK (302 GitHub stars).
        - label: Orchestration layer
          detail: Serverless Endpoints (queue-based or load-balancing) plus the autoscaler (queue-delay or request-count scaling formulas).
        - label: Worker / container layer
          detail: Customer Docker workers running handler(event) functions, accelerated by RunPod's FlashBoot cold-start cache.
        - label: GPU infrastructure layer
          detail: Community Cloud (third-party hosts), Secure Cloud (vetted partners with SOC 2/ISO 27001/PCI DSS), and Instant Clusters (multi-node, InfiniBand/800G fabric).
        - label: Storage / network layer
          detail: Network Volumes, June-2026 high-performance volumes, and an S3-compatible API for model/data movement.
        - label: Marketplace layer (RunPod Hub)
          detail: Template/app storefront built on the same Templates system as Pods, with documented revenue sharing for publishers.
    approximationNotes: Layer boundaries are RunPod's own documentation structure, not an independently reverse-engineered systems diagram.
