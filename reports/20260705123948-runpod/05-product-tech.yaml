  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Pods
        - Developers needing persistent dev/training GPU instances
        - GA; Reserved (guaranteed) or Spot (interruptible) pricing
        - Broad GPU catalog (30+ SKUs incl. AMD MI300X) across Community and Secure Cloud
        - No disclosed utilization rate, churn, or revenue mix by tier
      - - Serverless
        - Teams deploying autoscaling inference/API endpoints
        - GA; FlashBoot enabled by default on new endpoints
        - Marketed sub-200ms cold starts; queue-based or load-balancing endpoint choice; scale-to-zero
        - Cold-start figures are RunPod-published, not independently benchmarked by this diligence
      - - Instant Clusters
        - ML teams training/fine-tuning at multi-node scale
        - GA; Blackwell B200 clusters live via the FarmGPU partnership
        - InfiniBand/800G fabric; up to hundreds of GPUs per docs
        - Adding nodes to an existing cluster is admin-only per release notes, an operational bottleneck
      - - RunPod Hub
        - Developers wanting pre-built AI apps/models
        - GA; template marketplace with documented revenue sharing
        - One-click GitHub-sourced deploys; autoscaling endpoints generated from templates
        - No disclosed Hub template count, publisher count, or usage share vs. custom Pods/Serverless
      - - Community Cloud vs. Secure Cloud
        - Cost-sensitive vs. compliance-sensitive buyers
        - GA; Secure Cloud partners hold SOC 2 / ISO 27001 / PCI DSS per docs
        - Tiered cost/compliance tradeoff uncommon among hyperscaler-style competitors
        - No disclosed Community/Secure revenue split, capacity mix, or named certified partners
      - - Agent / coding-tool integrations (skills package, MCP servers)
        - AI agent developers; Claude Code and Cursor users
        - Newly listed in docs navigation as "NEW"
        - Positions RunPod as a compute backend for agentic coding workflows
        - No dated launch announcement found; maturity and adoption are unclear from public sources
    notes: Status/maturity language reflects RunPod's own documentation and release notes as of July 2026; no independent audit of GA status, template counts, or per-tier usage/revenue mix was found, so those remain explicit diligence asks rather than estimates.
