  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: reliability
      missingEvidence: Independent-verifiable historical uptime percentages and incident timelines from RunPod's status page (uptime.runpod.io and /incidents).
      whyItMatters: RunPod's homepage advertises both a 99.9% headline uptime figure and a 99.99% SLA guarantee; without the underlying per-region historical data, this diligence cannot independently confirm either figure or size the frequency/duration of real incidents.
      diligencePath: Request RunPod's raw status-page incident export or subscribe to the status page's webhook/RSS feed over a multi-month window; alternatively request the underlying SLA credit/incident log directly from RunPod under NDA.
      relatedQuestionRefs:
        - QE023
        - QE024
      relatedTableRefs:
        - TE005
    - type: private-evidence-only
      severity: material
      topic: trust-compliance
      missingEvidence: The underlying SOC 2 Type I and Type II audit reports (currently gated behind Drata + signed NDA per RunPod's own blog).
      whyItMatters: A clean audit opinion is asserted only in RunPod's own blog post; without the underlying report, scope, exceptions (if any in Type II), and specific controls tested cannot be independently confirmed.
      diligencePath: Request the SOC 2 Type II report and any bridge letter directly from RunPod under NDA as part of formal diligence.
      relatedQuestionRefs:
        - QE025
      relatedTableRefs:
        - TE004
    - type: missing-source
      severity: material
      topic: hub-marketplace
      missingEvidence: Disclosed count of RunPod Hub templates, publisher count, or usage share relative to custom Pods/Serverless deployments.
      whyItMatters: Without adoption metrics, it is not possible to assess whether Hub is a meaningful differentiator/moat or a lightly used marketing surface.
      diligencePath: Request Hub template catalog size, publisher count, and deployment-share metrics directly from RunPod, or monitor the Hub catalog page over time as a public proxy.
      relatedQuestionRefs:
        - QE016
      relatedTableRefs:
        - TE001
    - type: conflicting-data
      severity: minor
      topic: reliability-claims
      missingEvidence: A single, reconciled uptime/autoscaling figure from RunPod's own marketing copy.
      whyItMatters: RunPod's homepage states both "0 to hundreds of concurrent workers in under 250ms" and "0 to thousands of workers" for autoscaling, and both "99.9% Uptime" and a "99.99% uptime guarantee" for reliability -- minor but real internal inconsistencies a careful buyer would ask RunPod to reconcile.
      diligencePath: Ask RunPod directly which figures are the binding, current marketing claims versus historical/aspirational copy that has not been updated.
      relatedQuestionRefs:
        - QE008
    - type: enumeration-incomplete
      severity: minor
      topic: instant-clusters
      missingEvidence: Independent (non-partner) benchmarking of RunPod/FarmGPU Blackwell Instant Cluster performance claims (390 GB/s AllReduce bandwidth, 2.3x NCCL improvement).
      whyItMatters: The only performance figures found are published by FarmGPU, RunPod's own hardware/network partner for this offering, which has a commercial incentive to present favorable numbers.
      diligencePath: Request an independent benchmark run (e.g., MLPerf-style or third-party lab) on a RunPod Instant Cluster, or seek customer-reported throughput figures from an unaffiliated Instant Clusters user.
      relatedQuestionRefs:
        - QE011
      relatedTableRefs:
        - TE002
    - type: missing-source
      severity: minor
      topic: trust-compliance
      missingEvidence: A specific findings/severity list from the independent Nudge Security vendor-risk profile for runpod.io.
      whyItMatters: The page confirms an external risk-assessment listing exists but this diligence could not extract its substantive findings from the client-rendered content, so its corroborating value is limited to "a profile exists" rather than "here is what it found."
      diligencePath: Access the Nudge Security profile directly through an authenticated session or request the underlying report from Nudge Security or RunPod.
      relatedQuestionRefs:
        - QE028
      relatedTableRefs:
        - TE004
