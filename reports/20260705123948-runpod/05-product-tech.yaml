callouts:
  - calloutType: risk
    title: RunPod's own marketing copy contains internal inconsistencies in headline reliability and autoscaling figures
    body: 'The homepage separately claims ''99.9% Uptime'' and a ''99.99% uptime guarantee,'' and separately claims autoscaling of ''0 to hundreds of concurrent workers in under 250ms'' and ''0 to thousands of workers.'' None of these figures is necessarily false, but the inconsistency itself is a diligence flag: a buyer relying on any single quoted number should ask RunPod which is the current, binding claim.'
    claimRefs:
      - CE011
      - CE012
  - calloutType: risk
    title: Instant Cluster performance and reliability evidence comes only from a commercially interested partner
    body: The only bandwidth and throughput figures for Blackwell Instant Clusters (390 GB/s AllReduce, 2.3x NCCL improvement, 116 GB/s local storage) come from a co-published FarmGPU blog post -- RunPod's own hardware/network partner for this offering -- with no independent reproduction found in this research.
    claimRefs:
      - CE015
      - CE016
  - calloutType: strength
    title: SOC 2 Type I to Type II progression in roughly seven months is a credible, fast compliance cadence
    body: RunPod moved from SOC 2 Type I (March 2025) to SOC 2 Type II (October 2025) within about seven months, and both milestones are corroborated across the company blog and the SafeBase-powered Trust Center -- a faster cadence than many venture-stage infrastructure companies achieve, even though the underlying audit reports remain NDA-gated.
    claimRefs:
      - CE035
      - CE036
  - calloutType: insight
    title: Community Cloud pricing attracts praise and availability complaints in the same independent forum
    body: Hacker News commentary in the same community simultaneously frames RunPod Community Cloud as cheap relative to buying hardware outright (a roughly 212-day 5090 payback period) and documents a developer's GPU availability collapsing to persistent failures within a month -- illustrating that RunPod's lowest-cost tier trades price for capacity predictability.
    claimRefs:
      - CE041
      - CE042
