  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Client / API layer (REST API, console, CLI, SDKs)
        - Entry point for requests, provisioning, billing, template management
        - rest.runpod.io API surface; runpod-python SDK (302 GitHub stars)
        - API/schema changes could break third-party integrations such as the independent Terraform provider and agent-skill tooling
      - - Orchestration layer (Endpoints, queue engine, autoscaler)
        - Routes requests; manages job queue or direct load-balancing; autoscaling logic
        - Internal queue-delay / request-count scaling formulas documented by RunPod
        - Endpoints that scale down from inactivity stay reduced until manually raised, an operational gotcha that can silently cap capacity
      - - Worker / container layer (Workers, handler functions, FlashBoot)
        - Executes customer Docker images and handler code; minimizes cold starts
        - Docker container runtime; FlashBoot caching; customer-authored handler(event)
        - Cold-start and reliability depend on customer image size/quality, not RunPod infrastructure alone
      - - GPU infrastructure layer (Community Cloud, Secure Cloud, Instant Clusters)
        - Physical/virtualized GPU capacity across 30+ SKUs and 31 regions
        - Community Cloud = third-party hosts; Secure Cloud = vetted partners with SOC 2/ISO 27001/PCI DSS
        - Community Cloud capacity and host behavior depend on third parties RunPod does not fully control
      - - Storage / network layer (Network Volumes, high-performance volumes, S3-compatible API)
        - Persistent storage and data movement across Pods, Serverless, and Clusters
        - High-performance network volumes (shipped June 2026) target faster model load times
        - No disclosed SLA or throughput guarantee beyond the "compatible datacenter" labeling in release notes
      - - Marketplace layer (RunPod Hub, Templates, revenue sharing)
        - Lets third parties publish and monetize deployable templates
        - GitHub-sourced one-click deploy; documented revenue-sharing terms
        - No disclosed template count, quality-vetting process, or dispute-resolution mechanism for revenue-share disagreements
    notes: Architecture is reconstructed from RunPod's own documentation (docs.runpod.io) rather than an independent systems audit; the dependency and risk columns flag where behavior relies on customer-controlled images or third-party hosts RunPod itself does not fully control.
