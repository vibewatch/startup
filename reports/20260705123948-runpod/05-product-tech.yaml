chapter:
  number: 5
  title: Product & Technology
  summary: RunPod is a single-account GPU cloud spanning Pods, Serverless, Instant Clusters, and the RunPod Hub marketplace, with a broad 30+ SKU / 31-region catalog, FlashBoot cold-start optimization, and a fast SOC 2 Type I-to-Type II compliance cadence. Public evidence is strong on architecture, developer-signal, and dated roadmap detail, but weak on independent verification of specific uptime, cold-start, and Instant Cluster performance figures, and on Hub/marketplace adoption metrics.
sections:
  - id: product-modules-and-workflow
    title: Product modules, GPU catalog, and the core developer workflow
    body: 'RunPod should be underwritten as a single-account GPU cloud spanning three core products -- Pods (persistent GPU instances for development and training), Serverless (autoscaling, per-second-billed inference endpoints), and Instant Clusters (multi-node distributed compute) -- plus a fourth marketplace surface, RunPod Hub, layered on the same Templates system Pods already uses. RunPod''s own homepage claims a catalog of over 30 GPU SKUs across 31 global regions, and the GPU-types reference confirms the catalog is not NVIDIA-only: AMD''s Instinct MI300X (192GB) sits alongside NVIDIA A100 80GB PCIe and SXM4 cards. In workflow terms, a Serverless developer writes a Python handler(event) function, deploys it behind a queue-based or load-balancing Endpoint, and lets RunPod''s autoscaler and FlashBoot cold-start cache manage worker lifecycle; RunPod markets FlashBoot as delivering sub-200ms cold starts and enables it by default on new endpoints. Two caveats temper these claims: RunPod''s own homepage contains a minor internal inconsistency in the specific autoscaling and uptime figures it advertises in different sections, and setting an endpoint''s active-worker minimum above zero to eliminate cold starts means paying continuously for idle capacity -- a real cost/latency tradeoff RunPod exposes as configuration rather than resolving.'
