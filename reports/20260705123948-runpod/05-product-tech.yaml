  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - Control / certification
      - Status
      - Scope
      - Gap
    rows:
      - - SOC 2 Type I
        - Achieved March 25, 2025 with a "clean audit opinion" per company blog
        - RunPod's own organizational controls at a point in time
        - Underlying report is only available to customers/partners via Drata under NDA, not independently published
      - - SOC 2 Type II
        - Achieved October 13, 2025 after a six-month observation period
        - Same five trust-services criteria, evaluated over time
        - As with Type I, the underlying audit report is NDA-gated, not independently reviewable by this diligence
      - - SOC 3
        - Listed on Trust Center as a current compliance document
        - Public-facing summary counterpart to SOC 2
        - Trust Center listing was the only source found; no independent registry confirms issuance
      - - HIPAA
        - Listed on Trust Center and referenced in homepage FAQ ("depending on location")
        - Secure Cloud / vetted data-center partners, not stated as platform-wide
        - Location-dependent scope is not itemized by region in any public source found
      - - GDPR
        - RunPod states compliance measures for EU-hosted data (consent, data-subject rights, transfer mechanisms)
        - EU/EEA data-center regions
        - No independent regulator or DPA confirmation found; compliance is self-declared
      - - Secure Cloud partner certifications (SOC 2, ISO 27001, PCI DSS)
        - Stated as held by "vetted infrastructure partners" per docs
        - Secure Cloud only, not Community Cloud
        - No named list of certified partners or per-partner certification dates disclosed
      - - Multi-tenant isolation / host-access policy
        - Documented containerized isolation; ToS prohibits hosts from inspecting customer data, with platform removal as the stated penalty
        - All tiers; enforcement strongest on RunPod-operated Secure Cloud
        - Enforcement against Community Cloud third-party hosts relies on contractual terms, not independently verified technical controls
      - - Independent security/vendor-risk profile
        - Nudge Security maintains a public third-party risk-profile page for runpod.io
        - External vendor-risk-assessment signal
        - This diligence could not extract a specific findings/severity list from the page's rendered content
    notes: Compliance rows combine RunPod's own Trust Center/blog disclosures (company-issued, with NDA-gated underlying audit reports) and one independent third-party risk-profile listing; no primary regulator or auditor source was independently reachable, so every row should be treated as company-attested unless marked otherwise.
