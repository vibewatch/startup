  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Prior / alternative workflow
      - RunPod's solution
      - Measurable benefit
      - Limitation
    rows:
      - - Deploy a model behind an autoscaling API
        - Provision GPU VMs and hand-build a custom autoscaler/queue
        - Write a Python handler(event) function and deploy to a Serverless Endpoint
        - Scale-to-zero when idle; FlashBoot targets sub-200ms cold starts
        - Benefit figures are RunPod's own; still depends on customer image/model size
      - - Train or fine-tune across multiple GPUs
        - Negotiate bare-metal or hyperscaler multi-node contracts over months
        - Launch an Instant Cluster (H100/B200) via console, CLI, or API in minutes
        - Partner benchmark reports 390 GB/s AllReduce bandwidth on 32 B200 GPUs
        - Adding nodes to a running cluster is currently admin-only, limiting self-service elasticity
      - - Persist and develop interactively on a GPU
        - Rent a dedicated GPU box or a hyperscaler VM
        - Launch a Pod (Reserved or Spot) from an official, community, or custom template
        - Choice of Community Cloud (cheaper) vs. Secure Cloud (SLA-backed, compliance certs)
        - Community Cloud hosts are third-party operators controlled by RunPod's ToS, not an independent audit
      - - Deploy an existing open-source app or model quickly
        - Containerize and wire up infrastructure by hand
        - Fork a RunPod Hub template and deploy with autoscaling in one click
        - Skips custom container/infra setup; revenue share incentivizes template quality
        - No disclosed count of Hub templates or usage share versus custom deployments
      - - Give a coding agent (Claude Code / Cursor) GPU compute access
        - Manually script cloud API calls inside agent tool-use code
        - Use RunPod's skills package / MCP servers so agents deploy and manage resources directly
        - Reduces custom glue code for agentic workflows
        - Newly listed feature with no dated announcement or independent maturity signal found
    notes: Rows compare a job-to-be-done against RunPod's own documented mechanism; benefit figures (cold-start ms, bandwidth GB/s) are RunPod's or a paid-partner's own published numbers, not independently reproduced benchmarks.
