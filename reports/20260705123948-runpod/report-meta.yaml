companyProfile:
  summary: RunPod is a developer-focused GPU cloud marketplace founded in 2022 by Zhen Lu and Pardeep Singh. The company combines RunPod-managed secure capacity with lower-cost community-hosted GPU supply, and packages that infrastructure into on-demand Pods, Serverless inference, and multi-node clusters for AI training and deployment. After bootstrapping through its early years, RunPod reached a reported roughly $240M ARR by June 2026 and raised $100M from Summit Partners at a $1B valuation.
  foundedDate: '2022-01-01'
  founders:
    - name: Zhen Lu
      role: Co-founder and CEO
      background: Former Comcast software developer who co-built RunPod from a GPU-mining side project into an AI infrastructure company.
      claimRefs: [CO001, CO008]
    - name: Pardeep Singh
      role: Co-founder and CTO
      background: Former Comcast software developer and infrastructure-focused co-founder who helped lead the company's transition from crypto mining to GPU cloud.
      claimRefs: [CO001, CO008]
  foundingLocation: New Jersey, USA
  headquarters: Dover, Delaware, USA
  productSummary: GPU cloud platform spanning on-demand Pods, auto-scaling Serverless inference, and Instant Clusters, layered on top of both secure first-party capacity and community-hosted GPU supply.
  customerFocus: AI developers, ML engineers, startups, and research or enterprise teams seeking lower-cost GPU access for inference and training.
  businessModel: Usage-based GPU compute marketplace with direct secure-cloud supply, community-hosted capacity, and adjacent monetization from serverless and marketplace-style services.
  stage: Growth
  fundingStatus: $100M Summit Partners growth round at a $1B valuation in June 2026; approximately $120M of lifetime disclosed external funding including the 2024 seed round.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO005, CO006, CO008, CO013, CO025, CI019]
summary:
  headline: RunPod has scaled to a reported ~$240M ARR with strong developer adoption and clear cost-positioning in GPU cloud, but limited disclosure and intense infrastructure competition keep the upside balanced by execution risk.
  overallScore: 7
  recommendation: buy
  confidence: medium
