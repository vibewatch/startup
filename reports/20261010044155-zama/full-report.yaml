  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Zama's commercial traction is heavily concentrated in decentralized finance protocols, smart contract
              developers, and institutional digital asset managers seeking programmable privacy. While Zama's long-term
              vision encompasses enterprise machine learning workloads, management openly reports that its current
              commercial engagements originate almost exclusively from the blockchain sector. The buyer persona
              primarily consists of protocol architects, quantitative trading funds, and Web3 infrastructure engineers
              who require on-chain confidentiality without sacrificing EVM composability. Zama commercializes these
              engagements through a hybrid model: traditional institutions and enterprise banking partners are billed on
              a per-transaction basis for private network execution, whereas decentralized protocols pay via native
              token allocations. Within six months of commercialization, Zama disclosed signing more than $50 million in
              contract value, though this valuation reflects rough estimates heavily weighted toward volatile protocol
              tokens rather than audited fiat ARR. Enterprise demand remains early and exploratory, focused on pilot
              integrations with regulated compliance providers.
