      - number: '6.5'
        title: Retention Durability, Procurement Friction, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Customer retention and durability in privacy-preserving infrastructure face acute challenges stemming from
              procurement complexity and severe capital concentration. Unlike plug-and-play settlement solutions such as
              Hinkal that operate without smart contract modifications, building on Zama mandates specialized
              development with encrypted data types and deep architectural expertise. This engineering overhead creates
              substantial procurement friction and lengthens implementation cycles for mainstream enterprises. More
              critically, pooled confidential wrappers carry existential concentration and regulatory contagion risks.
              In late May 2026, stablecoin issuer Circle blacklisted Zama's cUSDC contract following a Delaware federal
              court injunction against an individual depositor whose $12.4 million deposit accounted for over 99% of the
              pool's liquidity. The resulting freeze locked $12.6 million in total assets, trapping innocent third-party
              depositors and forcing Zama to temporarily halt its adjacent cUSDT and cWETH contracts. Although Circle
              lifted the freeze in June 2026, the incident demonstrated that extreme depositor concentration combined
              with centralized asset issuer authority represents a critical operational risk for institutional
              customers.
