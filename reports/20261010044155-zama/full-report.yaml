            body: >-
              Zama has established notable production deployments and pilot partnerships across leading Web3
              infrastructure and compliance vendors. In decentralized finance, Zama powers 16 confidential yield-earning
              vaults on Morpho developed by Steakhouse Financial, managing approximately $40 million in shielded assets
