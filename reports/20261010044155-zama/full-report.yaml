chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding Roots, and Core Mission
        blocks:
          - type: paragraph
            body: >-
              Founded in 2020 and headquartered in Paris, France, Zama operates as a specialized deep-tech cryptography
              company dedicated to making fully homomorphic encryption practical for web3 and machine learning workloads
              [CO001]. Homomorphic encryption enables computations directly over encrypted data without requiring
              intermediate decryption, resolving the long-standing tension between public blockchain transparency, user
              privacy, and institutional compliance obligations [CO014]. Rather than deploying a competing Layer-1
              blockchain, Zama positions itself strictly as horizontal cryptographic infrastructure through its
              open-source TFHE-rs library and fhEVM framework, allowing external EVM-compatible networks to execute
              confidential smart contracts seamlessly [CO001, CO014]. Executive leadership is anchored by co-founder and
              Chief Executive Officer Dr. Rand Hindi alongside co-founder and Chief Technology Officer Dr. Pascal
              Paillier, combining proven venture execution with world-class cryptographic research [CO002, CO003].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO008
      - number: '1.2'
        title: Executive Leadership, Scientific IP, and Key-Person Dependency
        blocks:
          - type: paragraph
            body: >-
              Zama's competitive standing is heavily anchored in the scientific credentials and prior entrepreneurial
              records of its two founders [CO002, CO003]. Dr. Rand Hindi holds a PhD in bioinformatics and previously
              created AI voice platform Snips, which was successfully acquired by Sonos in 2019, giving him proven
              experience in commercializing emerging software [CO002]. Dr. Pascal Paillier is an internationally
              recognized cryptographic pioneer who invented the Paillier cryptosystem and holds roughly 25 patent
              families protecting core homomorphic encryption techniques [CO003]. By late 2025, Zama expanded its
              technical bench to 96 employees across 26 nationalities, with 37 holding PhDs, constituting one of the
              largest dedicated private FHE research teams globally [CO009]. However, key-person risk remains
              concentrated in Dr. Paillier for theoretical cryptographic IP and Dr. Hindi for institutional fundraising
              and commercial partnerships [CO002, CO003, CO006].
            claimRefs:
              - CO002
              - CO003
              - CO006
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO014
      - number: '1.3'
        title: Financing History, Valuation Trajectory, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Zama has demonstrated exceptional capital attraction across successive venture cycles, securing cumulative
              equity financing in excess of $138 million to fund its intensive cryptography research and developer
              tooling [CO004, CO005]. Following an initial $8 million seed investment, the company closed a $73 million
              Series A round in March 2024 co-led by Multicoin Capital and Protocol Labs at an equity valuation
              approaching $400 million [CO004]. In June 2025, Zama completed a $57 million Series B round led by Pantera
              Capital, achieving a $1.0 billion valuation and establishing the firm as the world's first FHE unicorn
              [CO005]. Its cap table and advisory network feature prominent ecosystem figures including Gavin Wood, Juan
              Benet, Anatoly Yakovenko, and venture investor Hack VC [CO006]. While management reported signing north of
              $50 million in contract value in early 2024 and third-party analysts estimate 2025 run-rate revenue near
              $26.4 million, verified GAAP revenue and customer concentration metrics remain undisclosed [CO007, CO008].
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO013
      - number: '1.4'
        title: Milestone Evolution, Mainnet Delivery, and Regulatory Friction
        blocks:
          - type: paragraph
            body: >-
              Between 2020 and late 2025, Zama transitioned from fundamental mathematical research to production-grade
              blockchain infrastructure, culminating in its Ethereum mainnet protocol launch in late December 2025 and
              subsequent $ZAMA token auction in January 2026 [CO012]. In September 2026, the company expanded
              confidential DeFi access by partnering with Morpho to launch 16 curated vaults alongside the Zama Swap
              Protocol [CO013]. However, this operational rollout exposed critical composability vulnerabilities: in
              June 2026, stablecoin issuer Circle blacklisted Zama's Confidential USDC (cUSDC) smart contract under an
              emergency Delaware court injunction involving an Overnight Finance civil dispute, freezing $12.6 million
              in pooled collateral [CO010]. In response, Zama temporarily paused adjacent wrapper contracts while
              coordinating with compliance authorities to isolate the disputed capital, demonstrating that
              privacy-preserving smart contract architectures remain exposed to centralized issuer legal intervention
              [CO010, CO011].
            claimRefs:
