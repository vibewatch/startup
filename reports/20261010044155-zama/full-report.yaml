      - number: '6.4'
        title: Customer Onboarding Lifecycle and Expansion Mechanics
        blocks:
          - type: paragraph
            body: >-
              Customer adoption on the Zama protocol follows a structured five-stage progression from open-source
              evaluation to live multi-chain operations. Developers initially explore Zama's cryptographic primitives
              through the TFHE-rs library and Concrete frameworks, simulating confidential contracts in local
              development environments. Upon progressing to testnet deployment, builders utilize the fhEVM SDK and
              testnet faucets to benchmark encrypted transaction latency and verify off-chain coprocessor execution.
              Production application launches require integrating the Zama Relayer SDK, wrapping standard tokens into
              confidential ERC-7984 equivalents, and routing transactions through threshold key management networks.
              Once in production, enterprise expansion is incentivized through a volume-based protocol fee model that
              reduces per-operation decryption and zero-knowledge verification costs based on trailing 30-day activity.
              To broaden adoption beyond crypto-native developers, Zama has introduced automated compliance hooks and
              acquired turnkey tools like TokenOps, lowering the operational hurdles for corporate treasuries and
