  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Zama designs and commercializes fully homomorphic encryption (FHE) infrastructure, enabling developers to
              build applications that compute on private data without decrypting it at intermediate stages. The core of
              the company's blockchain offering is FHEVM, a full-stack open-source framework that integrates with the
              broader Zama Confidential Blockchain Protocol. FHEVM allows EVM-compatible decentralized applications to
              maintain private transaction amounts, balances, and operational states while preserving composability and
              on-chain data availability. Under this architecture, encrypted state co-exists alongside public state
              without degrading existing decentralized application workflows. To make encrypted execution practical on
              public and private blockchains, Zama employs symbolic execution on host smart contracts. Host contracts
              validate state transitions and record symbolic computation graphs on-chain, while heavy homomorphic math
              is offloaded asynchronously to high-performance coprocessors implemented in Rust using TFHE-rs. Decryption
              authority is distributed across a decentralized multi-party computation (MPC) Key Management System (KMS),
              preventing single-operator key compromise or unauthorized data exposure.
            claimRefs:
              - CE001
              - CE002
              - CE003
