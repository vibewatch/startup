        title: Exit Readiness, Confirmatory Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Zama’s pathway to liquidity is bifurcated between traditional enterprise software acquisition and a public
              protocol token generation event. While strategic tech acquirers in cloud infrastructure or semiconductor
              hardware could seek Zama’s proprietary FHE compilation IP, the company’s recent focus on blockchain
              tokenization and public testnet deployment signals that an ecosystem token launch is the preferred
              liquidity vector [CV002, CV004]. However, institutional exit readiness is hindered by persistent legal and
              financial ambiguities [CV006, CV013]. Confirmatory diligence must address three critical requirements:
              first, auditing recurring cash software ARR versus volatile client token receipts [CV004]; second,
              examining full cap-table liquidation preferences and equity-versus-token sharing mechanics [CV002]; and
              third, verifying legal safeguards against centralized stablecoin proxy freezing [CV006, CV007]. Specific
              thesis-break kill criteria that would mandate immediate downgrade include: regulatory enforcement
              classifying protocol tokens as unregistered securities, loss of key hardware coprocessor partners, or
