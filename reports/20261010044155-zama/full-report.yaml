      - number: '2.3'
        title: Buyer Archetypes, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Customer segmentation and budget authority for Zama's technology diverge along two primary structural
              vectors: decentralized Web3 protocols and regulated institutional enterprises. In the Web3 sector, the
              primary buyer is the protocol architect or decentralized autonomous organization (DAO) governance council.
              These entities procure FHEVM smart contract capabilities and private vault modules to safeguard
              decentralized finance transactions against maximal extractable value (MEV) exploits, front-running, and
              public liquidity tracking. Budgets are funded through DAO treasuries and developer grant allocations, with
              deployment cycles driven by competitive yield differentiation. In the regulated enterprise sector,
              represented by pilot initiatives such as JP Morgan's Project EPIC for confidential tokenized asset
              trading, the procurement path is markedly different. Institutional buyers consist of chief technology
              officers and heads of digital asset innovation, drawing from compliance and strategic transformation
              budgets. Here, adoption triggers require rigorous regulatory auditability, selective disclosure
              mechanisms, and enterprise-grade key management architectures. Finally, network infrastructure operators
              represent a third operational constituency, funding node hardware to participate in multi-party threshold
              decryption and capture validator emission yields under the protocol's burn-and-mint token model.
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM014
      - number: '2.4'
        title: Adoption Catalysts, Composability Headwinds, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The acceleration of enterprise and institutional adoption for fully homomorphic encryption faces
              substantial technical and structural headwinds. On the cryptographic performance frontier, base smart
              contract execution throughput on Ethereum is restricted to approximately 20 transactions per second
              pending the commercial maturity of dedicated FPGA and ASIC hardware accelerators. Furthermore, enterprise
              readiness surveys indicate that 75% of organizations adopting confidential computing encounter an acute
              shortage of specialized cryptographic talent, impeding rapid production deployment. Beyond computational
              constraints, recent legal developments illustrate systemic composability vulnerabilities inherent in
              privacy wrappers. The May 2026 blacklisting of Zama's cUSDC contract by Circle pursuant to a U.S. federal
              court order froze $12.6 million in assets and disrupted innocent third-party balances, proving that pooled
              onchain privacy wrappers remain vulnerable to traditional judicial intervention. Additionally, protocol
              value capture faces structural dilution: with roughly 2.55 billion tokens currently circulating against an
              11.31 billion total supply, substantial token overhang exists, while shielded TVL growth reflects
              third-party asset deposits rather than direct token demand. Critical diligence gaps remain regarding
              realized enterprise cash ARR, customer concentration, and unit gross margins for private computation.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Shielded TVL Growth Diverges From Direct Protocol Token Accrual
            body: >-
              While crossing $100 million in shielded TVL demonstrates genuine utility across 16 curated Morpho vaults,
              depositors lock wrapped third-party assets such as USDC and USDT rather than purchasing native ZAMA.
              Commercial value capture depends on computational gas fees burned during encrypted operations rather than
              passive capital preservation.
            calloutType: insight
            claimRefs:
              - CM001
              - CM009
              - CM011
              - CM014
          - type: callout
            title: Centralized Stablecoin Interventions Threaten Confidential DeFi Composability
            body: >-
              The May 2026 court-ordered blacklisting of Zama's cUSDC contract by Circle immobilized $12.6 million in
              multi-user liquidity, proving that privacy wrappers cannot fully insulate users from traditional
              commercial legal mandates when pooled assets lack transaction-level isolation.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Architecture and Privacy Technologies Taxonomy
        blocks:
          - type: paragraph
            body: >-
              Evaluating Zama's competitive standing requires distinguishing between foundational mathematical
              approaches to blockchain and enterprise confidentiality [CP001]. Zama specializes strictly in Fully
              Homomorphic Encryption (FHE), enabling arbitrary computation over encrypted state on EVM-compatible
              blockchains without intermediate decryption [CP001, CP005]. Across the broader Web3 and enterprise privacy
              market, confidentiality architectures divide into three primary structural archetypes: fully homomorphic
              encryption coprocessors, zero-knowledge proof settlement layers, and multi-party computation or
              confidential shard networks [CP002, CP003, CP004]. Direct peers in homomorphic encryption—including
              enterprise-focused Duality Query, Fhenix, and Sunscreen—target private database querying or specialized
              rollups, while general-purpose blockchains such as NEAR Protocol provide alternative privacy mechanisms
              like NEAR Confidential Intents via private network shards [CP002, CP004]. Meanwhile, institutional privacy
              protocols like Hinkal focus on non-custodial confidential settlements across transparent public
              blockchains, utilizing zero-knowledge proofs to shield sender identities, recipient addresses, and
              transaction amounts [CP002, CP003]. Status-quo alternatives rely on hardware Trusted Execution
              Environments (TEEs) or off-chain bilateral settlement, both of which introduce physical side-channel
              vulnerabilities or centralized custody compromises that cryptographic approaches eliminate [CP001, CP004].
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
