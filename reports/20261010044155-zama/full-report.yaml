        title: Comparable Multiples, Market Benchmarks, and Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Benchmarking Zama’s $1.0 billion valuation requires evaluating both public cybersecurity comparables and
              private blockchain infrastructure rounds. Public cybersecurity and identity providers such as Mitek
              Systems (3.8x EV/Revenue), Yubico (3.9x EV/Revenue), and Asiainfo Security (1.3x EV/Revenue) trade at
              modest single-digit multiples reflecting established cash flows and mature software margins [CV009]. In
              contrast, private Web3 peers like Taiko Labs ($1.0B valuation) command premium marks reflecting
              speculative token upside and deep-tech scarcity [CV010]. Because Zama’s verified cash ARR remains
              undisclosed, its $1.0 billion valuation implies an aggressive enterprise multiple exceeding 30x forward
              software revenues [CV002, CV009]. Under our bull case scenario, successful mainnet launch and
              hardware-accelerated throughput of 10,000+ transactions per second across EVM chains and Solana unlock
              broad financial adoption, driving valuation toward $2.0B to $2.5B [CV011]. Conversely, under our bear case
              scenario, prolonged compute latency and recurring regulatory contract blacklists compress valuation back
              toward the $400 million Series A valuation floor [CV001, CV006, CV012].
