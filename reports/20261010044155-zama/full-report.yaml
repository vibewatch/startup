      - number: '8.2'
        title: Financing History, Cap Table Dynamics, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Zama has systematically navigated capital rounds to finance its capital-intensive cryptographic research
              and development. In March 2024, the company secured a $73 million Series A round co-led by Multicoin
              Capital and Protocol Labs at a post-money valuation approaching $400 million [CV001]. Building upon this
              foundation, Zama completed a $57 million Series B round in June 2025 co-led by Pantera Capital and
              Blockchange Ventures, which elevated the company to unicorn status at a $1.0 billion post-money mark
              [CV002]. Disclosed lifetime venture capital funding exceeds $150 million across institutional equity
              rounds [CV003], though unverified funding aggregators report figures as high as $398 million citing an
              unconfirmed 2026 ICO [CV008]. At a $1.0 billion valuation, entry discipline is paramount: paying full
              unicorn pricing for an infrastructure protocol whose mainnet rollout remains in testnet stages exposes
              late-stage investors to severe downside if token distribution models decouple value accrual from equity
              holders [CV002, CV013]. Investors must demand strict cap-table visibility, secondary mark verification,
              and clear token-to-equity conversion rights before committing growth equity [CV013].
