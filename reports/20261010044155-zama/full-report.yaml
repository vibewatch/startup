      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Composability Paradox of Confidential DeFi
            body: >-
              Circle's blacklisting of Zama's cUSDC contract underscores an existential systemic risk for
              privacy-preserving protocols: smart contract confidentiality cannot override centralized asset control.
              When multi-user funds are commingled in non-custodial privacy pools, centralized stablecoin issuers
              enforcing civil injunctions inevitably freeze innocent depositors along with disputed funds, exposing
              protocols to crippling legal and liquidity contagion.
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Recommendation Framework
        blocks:
          - type: paragraph
            body: >-
              Zama presents a compelling deep-technology investment thesis anchored in its category-defining leadership
              in fully homomorphic encryption (FHE). Through its pure-Rust TFHE-rs library and FHEVM framework, Zama
              enables developers to execute confidential smart contracts on encrypted state across Ethereum Virtual
              Machine chains without requiring advanced cryptography expertise [CV005]. Early commercialization
              demonstrated notable developer appetite, with the company announcing over $50 million in signed contract
              value within six months of commercial launch [CV004]. Operational expansion has been substantial, scaling
              the organization from 75 employees at Series A to 251 personnel [CV014]. However, an institutional
              diligence anti-thesis emerges from acute revenue quality and governance risks: client contracts are
              largely denominated in volatile project tokens rather than recurring fiat software licenses [CV004], and
              onchain operations remain fragile to centralized stablecoin intervention [CV006, CV007]. On May 30, 2026,
              Circle executed a federal court order blacklisting Zama’s cUSDC contract, locking $12.6 million in
              multi-user proxy collateral and illustrating severe composability risks [CV006, CV007]. Given these
              unresolved risks, we assign a research-more recommendation with medium confidence and a high risk rating
              [CV013].
