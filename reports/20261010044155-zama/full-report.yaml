  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Scope, and Structural Adjacencies
        blocks:
          - type: paragraph
            body: >-
              Zama occupies a specialized position at the intersection of cryptography, enterprise privacy, and
              decentralized finance infrastructure. The company's core technological offering centers on Fully
              Homomorphic Encryption (FHE), enabling computation on encrypted data without requiring decryption at any
              intermediate stage. In commercial terms, this boundary delineates addressable enterprise and Web3 IT spend
              into distinct tiers. Included spend covers confidential virtual machine runtime licenses, cryptographic
              coprocessors, protocol-level confidentiality gas fees, and key management service (KMS) threshold
              validation infrastructure. Conversely, general cloud hosting, unencrypted layer-one base gas consumption,
              and standard database infrastructure represent excluded commodity spend. While early market traction has
              been established through decentralized applications—most visibly through confidential yield vaults
              deployed on Morpho across multiple asset curators—Zama's broader strategic vision targets confidential
              machine learning and enterprise cloud analytics. Status-quo substitutes include hardware-based Trusted
              Execution Environments (TEEs) such as Intel SGX or AWS Nitro Enclaves, multi-party computation (MPC), and
              zero-knowledge proofs (ZKPs), each of which presents distinct trade-offs between performance latency,
              trust assumptions, and programmability.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM014
      - number: '2.2'
        title: Multi-Lens Market Sizing and Growth Trajectories
        blocks:
          - type: paragraph
            body: >-
              Evaluating Zama's addressable opportunity requires disaggregating broad macro projections from near-term
              observable market demand. At the macroeconomic tier, third-party industry forecasts estimate the broader
              blockchain privacy computing market will grow from $9.42 billion in 2025 to $23.31 billion by 2033,
              expanding at an annual compound rate of nearly 12%. Within specialized cryptographic software,
              ResearchAndMarkets projects the global secure multi-party computation (SMPC) market will expand from $1.04
              billion in 2025 to $1.18 billion in 2026, ultimately reaching $1.96 billion by 2030 at a 13.4% compound
              annual growth rate. Narrowing from macro estimates to observable protocol traction reveals an early-stage
              but rapidly scaling serviceable market. Zama reported signing over $50 million in contract commitments
              during its initial commercialization phase, spanning token-denominated and transaction-based pricing
              structures. Onchain, verified protocol activity demonstrates material velocity: Total Value Shielded (TVS)
              surpassed $100 million in October 2026, representing a 3.6-fold increase over a ninety-day window across
              sixteen curated lending vaults. Meanwhile, public secondary markets price the protocol at a market
              capitalization of $194.23 million and an $867.14 million fully diluted valuation across its 11.315 billion
              total token supply, establishing an empirical valuation ceiling against current utility volume.
            claimRefs:
              - CM002
              - CM006
              - CM009
              - CM010
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM006
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
