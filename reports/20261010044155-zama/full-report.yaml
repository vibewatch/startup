      - number: '7.2'
        title: 'Operational, Security, and Technical Risk: Key Management, Coprocessor Reliability, and Hardware Bottlenecks'
        blocks:
          - type: paragraph
            body: >-
              Operationally, Zama's confidential computing architecture relies on complex multi-party computation (MPC)
              networks and microservice coprocessors. In the Zama Protocol, the FHEVM Coprocessor service executes
              homomorphic computation offchain across multiple microservices responsible for input verification,
              transaction dispatching, and event listening [CR007]. While fully homomorphic encryption mathematically
              eliminates plaintext exposure during compute, key management remains an acute operational failure mode:
              threshold decryption depends entirely on the decentralized Key Management System (KMS) and node operator
              quorum [CR008]. Official token auction disclosures emphasize that the underlying software stack is
              experimental, carrying residual vulnerabilities to consensus failures, smart contract bugs, DNS attacks,
              or private key loss that could cause total capital destruction without recourse [CR009]. At the compute
              layer, homomorphic operations introduce computational overhead roughly 100x slower than unencrypted
              execution, creating severe throughput bottlenecks on general-purpose CPUs and requiring ongoing hardware
              acceleration efforts targeting custom FPGA Homomorphic Processing Units (HPU) [CR010].
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
