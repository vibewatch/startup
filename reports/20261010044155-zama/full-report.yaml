            body: >-
              Zama's product portfolio extends across developer tooling, decentralized protocol apps, and
              machine-learning frameworks. For smart contract developers, FHEVM exposes native Solidity bindings
              compatible with established toolchains such as Hardhat and Foundry. Developers define encrypted access
              control logic directly in contract code using high-precision encrypted integers supporting up to 256 bits
              of precision, alongside boolean operations, comparisons, and arithmetic primitives. For client
              applications, the Zama TypeScript SDK provides high-level abstractions for key generation, shielding,
              confidential transfers, and unshielding tokens. Beyond blockchain environments, Zama maintains Concrete,
              an LLVM-based compiler translating Python code into homomorphic routines, and Concrete ML, an open-source
              framework compatible with Scikit-learn and PyTorch that enables confidential inference and training.
              Developer adoption across these libraries is open-source under the BSD 3-Clause Clear license, with Zama
              requiring commercial enterprises to acquire patent licenses for production commercial use.
