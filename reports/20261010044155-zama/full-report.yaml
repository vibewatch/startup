      - number: '4.2'
        title: Go-to-Market Mechanics and Channel Economics
        blocks:
          - type: paragraph
            body: >-
              Zama executes a developer-led go-to-market motion anchored by four open-source cryptographic libraries
              hosted on GitHub, including TFHE-rs and the Concrete compiler. By seeding over 3,000 developers with
              zero-barrier cryptographic tooling, Zama establishes an expansive developer adoption top-of-funnel that
              converts builders toward mainnet deployments on its fheVM confidential execution environment. Channel
              partnerships with institutional infrastructure providers, including Ledger, Fireblocks, Etherscan, and
              LayerZero, secure network validation and key management operations while embedding Zama's privacy
              primitives across existing digital asset custody rails. Traction accelerated markedly in January 2026 when
              Zama executed a public sealed-bid Dutch auction on Ethereum mainnet, attracting 11,103 independent
              participants and $118.5 million in total committed capital at a $0.05 clearing price. The auction
              demonstrated substantial market demand for confidential token issuance, briefly generating $121 million in
              total shielded value and becoming the highest-volume application on Ethereum, though sustaining recurring
              fee generation beyond one-off distribution events remains an unproven commercial transition.
            claimRefs:
