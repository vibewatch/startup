  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and Legal Risk: Stablecoin Composability, Privacy Oversight, and Token Liabilities'
        blocks:
          - type: paragraph
            body: >-
              Zama's primary vulnerability lies at the intersection of decentralized privacy infrastructure and
              centralized financial regulation. On May 30, 2026, Circle executed a federal court temporary restraining
              order targeting an alleged $15.77 million treasury diversion from Overnight Finance [CR001]. Because
              approximately $12.4 million of disputed funds were deposited into Zama's pooled ERC-1967 Confidential USDC
              (cUSDC) wrapper, Circle blacklisted the entire smart contract address
              (0xe978F22157048E5DB8E5d07971376e86671672B2), freezing $12,606,386.10 in pooled collateral and locking out
              completely innocent third-party depositors [CR002, CR003]. This event proved that privacy wrappers on
              public blockchains offer no practical insulation against centralized asset issuers enforcing civil
              litigation court orders [CR004]. Although judicial review subsequently cleared Zama of wrongdoing and
              lifted the freeze in June 2026, the incident forced Zama into an emergency overhaul involving an
              accelerated compliance initiative with enhanced KYC and KYT screening [CR005]. Furthermore, token auction
              terms published by Zama Switzerland AG in Zug explicitly warn participants of sweeping regulatory hazards
              under Swiss and international law, disclaiming all utility guarantees and acknowledging that regulators
              may classify the Zama Token as an unauthorized security or financial instrument [CR006].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
