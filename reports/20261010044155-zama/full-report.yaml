      - number: '4.4'
        title: Capital Adequacy, Cash Burn, and Composability Spillover Risks
        blocks:
          - type: paragraph
            body: >-
              Zama maintains strong balance sheet capitalization following successive multi-million dollar equity
              financing rounds, providing substantial runway to underwrite its deep-tech research roadmap. Following a
              $73 million Series A in March 2024 at a valuation approaching $400 million, Zama closed a $57 million
              Series B in June 2025 co-led by Blockchange Ventures and Pantera Capital, elevating cumulative equity
              funding past $150 million and securing a unicorn equity valuation above $1 billion. In addition, the
              January 2026 Dutch auction grossed $118.5 million in committed capital, bolstering liquidity reserves.
              Despite this formidable balance sheet buffer, counterparty and composability risks present acute
              operational hazards. In May 2026, stablecoin issuer Circle blacklisted Zama's Confidential USDC smart
              contract pursuant to a U.S. federal court injunction in a civil dispute involving Overnight Finance.
