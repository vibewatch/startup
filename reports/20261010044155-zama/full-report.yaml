      - number: '5.3'
        title: Compliance Infrastructure, Hardware Scaling, and Composability Risks
        blocks:
          - type: paragraph
            body: >-
              To facilitate institutional adoption and meet strict regulatory standards across decentralized finance,
              Zama has implemented a Compliance by Design framework. At the protocol layer, fine-grained Access Control
              Lists (ACLs) enable selective decryption of transaction histories and balances for authorized auditors and
              regulatory bodies without exposing data to the public. For operational risk management, Zama integrates
              pre-transaction screening through Elliptic for wallet-level KYT and sanctions compliance, combined with
              Hypernative's continuous on-chain monitoring platform for real-time threat detection and automated
              response across host contracts. Scalability remains tightly coupled to compute throughput, prompting Zama
              to optimize software primitives, utilize AWS high-performance cloud instances, and develop hardware
              acceleration designs including the Alveo V80 Homomorphic Processing Unit (HPU). However, operational
              events demonstrate acute composability friction: when stablecoin issuer Circle blacklisted Zama's cUSDC
              contract following a federal civil court injunction against an external depositor, approximately 12.6
              million USDC in pooled liquidity was programmatically frozen, underscoring that cryptographic privacy
              wrappers remain vulnerable to centralized asset control.
            claimRefs:
              - CE011
