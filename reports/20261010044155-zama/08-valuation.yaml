callouts:
  - calloutType: recommendation
    title: 'Investment Discipline: Avoid Chasing Unproven Unicorn Marks'
    body: While Zama has built undeniable technological leadership in fully homomorphic encryption, committing growth capital at a $1.0 billion valuation without audited recurring cash revenue or cap-table visibility represents undisciplined underwriting. Investors should maintain a research-more stance until mainnet metrics and token value accrual are proven.
    claimRefs:
      - CV002
      - CV004
      - CV013
  - calloutType: risk
    title: 'Critical Structural Vulnerability: Centralized Stablecoin Freezes'
    body: Circle’s May 2026 freezing of $12.6 million in cUSDC demonstrates that non-custodial privacy wrappers remain acutely exposed to centralized court injunctions. This composability friction poses an existential adoption barrier for regulated institutional capital.
    claimRefs:
      - CV006
      - CV007
