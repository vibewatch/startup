company:
  name: Zama
chapter:
  number: 8
  title: Valuation
  summary: Zama reached unicorn status at a $1.0B post-money valuation in its June 2025 Series B, cementing its standing as the foremost developer of fully homomorphic encryption infrastructure for confidential blockchain applications. However, with signed contract value heavily denominated in volatile protocol tokens rather than audited cash software subscriptions, recurring revenue unverified, and recent composability vulnerabilities demonstrated by Circle freezing $12.6M in cUSDC, current valuation sits stretched ahead of commercialization proof, supporting a research-more stance.
sections:
  - id: investment-thesis-and-recommendation-framework
    title: Investment Thesis, Anti-Thesis, and Recommendation Framework
    body: 'Zama presents a compelling deep-technology investment thesis anchored in its category-defining leadership in fully homomorphic encryption (FHE). Through its pure-Rust TFHE-rs library and FHEVM framework, Zama enables developers to execute confidential smart contracts on encrypted state across Ethereum Virtual Machine chains without requiring advanced cryptography expertise [CV005]. Early commercialization demonstrated notable developer appetite, with the company announcing over $50 million in signed contract value within six months of commercial launch [CV004]. Operational expansion has been substantial, scaling the organization from 75 employees at Series A to 251 personnel [CV014]. However, an institutional diligence anti-thesis emerges from acute revenue quality and governance risks: client contracts are largely denominated in volatile project tokens rather than recurring fiat software licenses [CV004], and onchain operations remain fragile to centralized stablecoin intervention [CV006, CV007]. On May 30, 2026, Circle executed a federal court order blacklisting Zama’s cUSDC contract, locking $12.6 million in multi-user proxy collateral and illustrating severe composability risks [CV006, CV007]. Given these unresolved risks, we assign a research-more recommendation with medium confidence and a high risk rating [CV013].'
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV007
      - CV013
      - CV014
    tableRefs:
      - TV001
      - TV002
  - id: financing-context-and-entry-discipline
    title: Financing History, Cap Table Dynamics, and Entry Discipline
    body: 'Zama has systematically navigated capital rounds to finance its capital-intensive cryptographic research and development. In March 2024, the company secured a $73 million Series A round co-led by Multicoin Capital and Protocol Labs at a post-money valuation approaching $400 million [CV001]. Building upon this foundation, Zama completed a $57 million Series B round in June 2025 co-led by Pantera Capital and Blockchange Ventures, which elevated the company to unicorn status at a $1.0 billion post-money mark [CV002]. Disclosed lifetime venture capital funding exceeds $150 million across institutional equity rounds [CV003], though unverified funding aggregators report figures as high as $398 million citing an unconfirmed 2026 ICO [CV008]. At a $1.0 billion valuation, entry discipline is paramount: paying full unicorn pricing for an infrastructure protocol whose mainnet rollout remains in testnet stages exposes late-stage investors to severe downside if token distribution models decouple value accrual from equity holders [CV002, CV013]. Investors must demand strict cap-table visibility, secondary mark verification, and clear token-to-equity conversion rights before committing growth equity [CV013].'
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV008
      - CV013
    figureRefs:
      - FV001
  - id: comparable-benchmarking-and-scenario-modeling
    title: Comparable Multiples, Market Benchmarks, and Scenario Analysis
    body: Benchmarking Zama’s $1.0 billion valuation requires evaluating both public cybersecurity comparables and private blockchain infrastructure rounds. Public cybersecurity and identity providers such as Mitek Systems (3.8x EV/Revenue), Yubico (3.9x EV/Revenue), and Asiainfo Security (1.3x EV/Revenue) trade at modest single-digit multiples reflecting established cash flows and mature software margins [CV009]. In contrast, private Web3 peers like Taiko Labs ($1.0B valuation) command premium marks reflecting speculative token upside and deep-tech scarcity [CV010]. Because Zama’s verified cash ARR remains undisclosed, its $1.0 billion valuation implies an aggressive enterprise multiple exceeding 30x forward software revenues [CV002, CV009]. Under our bull case scenario, successful mainnet launch and hardware-accelerated throughput of 10,000+ transactions per second across EVM chains and Solana unlock broad financial adoption, driving valuation toward $2.0B to $2.5B [CV011]. Conversely, under our bear case scenario, prolonged compute latency and recurring regulatory contract blacklists compress valuation back toward the $400 million Series A valuation floor [CV001, CV006, CV012].
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV009
      - CV010
      - CV011
      - CV012
    tableRefs:
      - TV003
  - id: exit-readiness-and-thesis-break-triggers
    title: Exit Readiness, Confirmatory Diligence Asks, and Thesis-Break Triggers
    body: 'Zama’s pathway to liquidity is bifurcated between traditional enterprise software acquisition and a public protocol token generation event. While strategic tech acquirers in cloud infrastructure or semiconductor hardware could seek Zama’s proprietary FHE compilation IP, the company’s recent focus on blockchain tokenization and public testnet deployment signals that an ecosystem token launch is the preferred liquidity vector [CV002, CV004]. However, institutional exit readiness is hindered by persistent legal and financial ambiguities [CV006, CV013]. Confirmatory diligence must address three critical requirements: first, auditing recurring cash software ARR versus volatile client token receipts [CV004]; second, examining full cap-table liquidation preferences and equity-versus-token sharing mechanics [CV002]; and third, verifying legal safeguards against centralized stablecoin proxy freezing [CV006, CV007]. Specific thesis-break kill criteria that would mandate immediate downgrade include: regulatory enforcement classifying protocol tokens as unregistered securities, loss of key hardware coprocessor partners, or down-round equity repricing below $500 million [CV006, CV012].'
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV007
      - CV011
      - CV012
      - CV013
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence Anchor
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - Series B at $1.0B post-money valuation ahead of verified recurring cash revenue proof
        - Withhold capital commitment until audited SaaS ARR and token monetization mechanics are verified
      - - Confidence
        - medium
        - Verified cryptographic moat in TFHE-rs contrasted with commercial and token opacity
        - Maintain active monitoring while seeking primary access to lead venture sponsor materials
      - - Risk Rating
        - high
        - Composability freeze demonstrated by Circle locking $12.6M in cUSDC proxy collateral
        - Require structural legal ringfencing for any deployed capital or protocol liquidity
      - - Valuation Stance
        - stretched
        - $1.0B mark implies steep deep-tech growth multiple relative to public security peers (1.3x–3.9x)
        - Seek secondary market purchase opportunities at meaningful discounts to the $1.0B Series B mark
      - - Target Horizon / Action
        - 12–18 month watch
        - Mainnet rollout, hardware chip development, and token generation scheduled for 2025–2026
        - Re-evaluate for potential upgrade if enterprise fiat ARR exceeds $25M with sustained 80%+ gross margin
    notes: Synthesis of investment stance based on Series A and B financing records, commercial contracts, and comparable software multiples.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV013
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Strategic Pillar
      - Investment Thesis (Bull View)
      - Anti-Thesis (Bear View)
      - Pivot / Falsification Trigger
    rows:
      - - Technology Moat
        - First-mover developer ecosystem around TFHE-rs and FHEVM; enables end-to-end encrypted smart contract execution
        - Homomorphic computation overhead remains substantially slower than unencrypted compute, limiting scaling without custom ASIC chips
        - Production deployment of dedicated hardware accelerating throughput beyond 10,000 transactions per second
      - - Commercial Model
        - Signed over $50M in contract value within six months of launch across diverse blockchain and Web3 projects
        - Contracts heavily denominated in volatile client tokens rather than predictable, cash-settled recurring SaaS subscriptions
        - Independent auditor verification of more than $20M in annualized cash software revenue
      - - Market Valuation
        - World first FHE unicorn ($1.0B valuation) supported by Tier-1 crypto venture sponsors Pantera and Blockchange
        - Public security software comparables trade at 1.3x to 3.9x EV/Revenue, indicating extreme multiple compression risk
        - Institutional adoption of Zama confidentiality layers by Tier-1 regulated banks or major defense contractors
      - - Legal & Regulatory
        - Selective disclosure architecture designed to satisfy compliance and auditability without exposing user data
        - Centralized asset issuers can unilaterally freeze pooled privacy wrappers under private civil court injunctions
        - Complete regulatory clearance and protocol refactoring preventing third-party collateral blacklists
    notes: Comparative assessment of core investment arguments against verifiable operating, commercial, and regulatory counter-evidence.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability Weight
      - Key Operating Assumptions
      - Implied Valuation / Multiple
      - Downside & Exit Triggers
    rows:
      - - Bull Case
        - 25%
        - Mainnet launch triggers massive multi-chain EVM and Solana adoption; custom ASIC hardware achieves 10k+ TPS; token launch accrues liquid value
        - $2.0B - $2.5B (2.0x - 2.5x Series B valuation mark)
        - Ecosystem token generation event provides liquid distribution; enterprise licensing expands into healthcare and AI
      - - Base Case
        - 50%
        - Steady developer traction across niche privacy DeFi; enterprise pilots remain in testing phase; hardware acceleration ships in 2026
        - $900M - $1.1B (Flat to Series B mark; 15x - 20x forward estimated revenue)
        - Growth plateaus; company requires structured insider flat-round or convertible extension to sustain R&D runway
      - - Bear Case
        - 25%
        - Compute latency restrains adoption; recurring regulatory blacklists paralyze DeFi liquidity; token markets fail to support protocol capitalization
        - $350M - $500M (Down-round back toward $400M Series A valuation floor)
        - Severe multiple compression; cash burn forces defensive down-round or distressed asset sale of cryptographic patents
    notes: Probability-weighted valuation scenarios modeled against Series A and Series B entry prices and historical hardware development cycles.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV009
      - CV011
      - CV012
