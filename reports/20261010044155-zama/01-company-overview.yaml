  - calloutType: "insight"
    title: "Composability Vulnerabilities in Pooled Privacy Wrappers"
    body: "The June 2026 Circle blacklisting of Zama's cUSDC contract illustrates a structural friction for confidential DeFi: centralized stablecoin issuers enforcing commercial court orders can mechanically freeze multi-user proxy contracts, creating indiscriminate collateral freezes for innocent depositors."
