    title: "Core Cryptographic Moat vs. Key-Person Exposure"
    body: "While Dr. Pascal Paillier's extensive patent portfolio and academic leadership establish a peerless theoretical moat in TFHE, Zama exhibits acute key-person dependency on its two founding executives for both scientific roadmap execution and institutional business development."
