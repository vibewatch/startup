chapter:
  number: 6
  title: "Customers"
  summary: "Zama has established notable early adoption in the decentralized finance sector, securing over $50 million in reported contract value, deploying 16 yield vaults on Morpho, and logging 6.9 million testnet transactions. However, commercial revenues are heavily weighted toward volatile protocol tokens, implementation requires significant cryptographic engineering overhead, and the May 2026 cUSDC freeze highlighted severe concentration and centralized stablecoin counterparty risks."
sections:
  - id: "customer-segmentation"
    title: "Customer Base Segmentation and Buyer Personas"
    body: "Zama's commercial traction is heavily concentrated in decentralized finance protocols, smart contract developers, and institutional digital asset managers seeking programmable privacy. While Zama's long-term vision encompasses enterprise machine learning workloads, management openly reports that its current commercial engagements originate almost exclusively from the blockchain sector. The buyer persona primarily consists of protocol architects, quantitative trading funds, and Web3 infrastructure engineers who require on-chain confidentiality without sacrificing EVM composability. Zama commercializes these engagements through a hybrid model: traditional institutions and enterprise banking partners are billed on a per-transaction basis for private network execution, whereas decentralized protocols pay via native token allocations. Within six months of commercialization, Zama disclosed signing more than $50 million in contract value, though this valuation reflects rough estimates heavily weighted toward volatile protocol tokens rather than audited fiat ARR. Enterprise demand remains early and exploratory, focused on pilot integrations with regulated compliance providers."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory"
    title: "Developer Adoption and On-Chain Protocol Trajectory"
    body: "Quantitative telemetry indicates robust developer experimentation across Zama's open-source cryptographic repositories and testnet environments. Between the public testnet launch in July 2025 and March 2026, the Zama Confidential Blockchain Protocol logged more than 6.9 million cumulative transactions and recorded the deployment of 27,662 confidential smart contracts. This surge in developer activity was catalyzed by the release of the fhEVM coprocessor and specialized Solidity libraries, enabling standard Ethereum developers to write confidential applications without advanced cryptographic backgrounds. In January 2026, Zama conducted a public utility token auction that served as a live production stress test, shielding over $121 million in USDT on Ethereum mainnet via a sealed-bid Dutch auction. Despite these substantial top-line activity figures, diligence reveals that testnet deployment counts lack granular separation between automated tutorial scripts and production-grade applications. Furthermore, one-time auction commitments cannot be conflated with recurring, fee-generating protocol usage across sustained enterprise cohorts."
    claimRefs:
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU002"
  - id: "named-deployments"
    title: "Named Deployments, Institutional Proof, and Production Pilots"
    body: "Zama has established notable production deployments and pilot partnerships across leading Web3 infrastructure and compliance vendors. In decentralized finance, Zama powers 16 confidential yield-earning vaults on Morpho developed by Steakhouse Financial, managing approximately $40 million in shielded assets across multiple collateral types. To facilitate institutional adoption, Zama partnered with Elliptic in July 2026 to introduce automated wallet risk screening, ensuring that regulated asset managers can enforce AML and sanctions checks before assets enter confidential pools. Additional ecosystem partners include Galactica.com, which integrated Zama's FHE into its Web3 Identity Stack for persistent reputation scoring, and custodial provider Dfns, which connects Zama's confidential transaction capabilities to its enterprise wallet client base. Zama has also expanded its product footprint through acquisitions, purchasing TokenOps in May 2026 to deliver compliant, confidential token vesting, airdrops, and corporate payroll services. These named integrations validate Zama's technical feasibility, although long-term commercial monetization across third-party distribution channels remains opaque."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU015"
    tableRefs:
      - "TU003"
  - id: "customer-journey"
    title: "Customer Onboarding Lifecycle and Expansion Mechanics"
    body: "Customer adoption on the Zama protocol follows a structured five-stage progression from open-source evaluation to live multi-chain operations. Developers initially explore Zama's cryptographic primitives through the TFHE-rs library and Concrete frameworks, simulating confidential contracts in local development environments. Upon progressing to testnet deployment, builders utilize the fhEVM SDK and testnet faucets to benchmark encrypted transaction latency and verify off-chain coprocessor execution. Production application launches require integrating the Zama Relayer SDK, wrapping standard tokens into confidential ERC-7984 equivalents, and routing transactions through threshold key management networks. Once in production, enterprise expansion is incentivized through a volume-based protocol fee model that reduces per-operation decryption and zero-knowledge verification costs based on trailing 30-day activity. To broaden adoption beyond crypto-native developers, Zama has introduced automated compliance hooks and acquired turnkey tools like TokenOps, lowering the operational hurdles for corporate treasuries and regulated payroll applications."
    claimRefs:
      - "CU009"
      - "CU015"
    figureRefs:
      - "FU001"
  - id: "retention-and-concentration-risks"
    title: "Retention Durability, Procurement Friction, and Concentration Risks"
    body: "Customer retention and durability in privacy-preserving infrastructure face acute challenges stemming from procurement complexity and severe capital concentration. Unlike plug-and-play settlement solutions such as Hinkal that operate without smart contract modifications, building on Zama mandates specialized development with encrypted data types and deep architectural expertise. This engineering overhead creates substantial procurement friction and lengthens implementation cycles for mainstream enterprises. More critically, pooled confidential wrappers carry existential concentration and regulatory contagion risks. In late May 2026, stablecoin issuer Circle blacklisted Zama's cUSDC contract following a Delaware federal court injunction against an individual depositor whose $12.4 million deposit accounted for over 99% of the pool's liquidity. The resulting freeze locked $12.6 million in total assets, trapping innocent third-party depositors and forcing Zama to temporarily halt its adjacent cUSDT and cWETH contracts. Although Circle lifted the freeze in June 2026, the incident demonstrated that extreme depositor concentration combined with centralized asset issuer authority represents a critical operational risk for institutional customers."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
