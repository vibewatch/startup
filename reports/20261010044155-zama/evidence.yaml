evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: >-
      Audited financial statements, GAAP revenue breakdown, customer concentration data, and verified recurring fee
      revenues.
    whyItMatters: >-
      Zama operates as a privately held company with undisclosed revenue; third-party estimates ($26.4M ARR) and
      historical contract value claims ($50M+) cannot be verified without audited filings.
    diligencePath: >-
      Request confidential management accounts, historical billing schedules, and customer cohort churn reports under an
      NDA.
    relatedQuestionRefs:
      - QO005
  - type: access-blocked
    severity: minor
    topic: regulatory-compliance
    missingEvidence: >-
      Formal resolution documents and unfreezing order details between Circle, Zama, and Delaware court regarding the
      cUSDC contract freeze.
    whyItMatters: >-
      Validates whether multi-user pooled smart contract architectures can safely segregate disputed assets without
      risking collateral freeze of third-party liquidity.
    diligencePath: >-
      Review public court dockets in Delaware Court of Chancery and request legal counsel memo on smart contract proxy
      compliance isolation.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: material
    topic: enterprise-contract-economics
    missingEvidence: >-
      Audited breakdowns of realized enterprise revenue, recurring contract ARR, and per-transaction infrastructure
      costs versus token-denominated booking figures.
    whyItMatters: >-
      Reported contract figures include non-fiat and pilot commitments, obscuring gross margin economics and actual
      institutional paying demand.
    diligencePath: >-
      Request customer contract schedules, token fee conversion policies, and cloud infrastructure cost-to-serve audits
      under non-disclosure agreement.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: commercial-fhe-contract-pricing
    missingEvidence: >-
      Audited enterprise contract terms, realized license fees, and customer switching cost metrics for private bank and
      enterprise FHE deployments.
    whyItMatters: >-
      Without verified enterprise contract economics, comparing Zama's revenue durability against pure-play software
      competitors remains speculative.
    diligencePath: >-
      Request customer contract schedules, average annual contract values (ACV), and enterprise sales cycle data from
      Zama commercial leadership.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: enterprise-revenue-verification
    missingEvidence: >-
      Audited financial statements confirming recurring enterprise software license ARR, realized fiat cash collections,
      and customer retention metrics.
    whyItMatters: >-
      Reported commercial contract value exceeding $50 million is largely token-denominated and unverified, creating
      high uncertainty regarding underlying cash generation.
    diligencePath: >-
      Request audited income statements, GAAP revenue recognition schedules, and enterprise customer contract exhibits
      under NDA.
    relatedQuestionRefs:
      - QI004
  - type: missing-source
    severity: material
    topic: fhe-compute-unit-economics
    missingEvidence: >-
      Granular server-level compute cost accounting per homomorphic encryption operation, cloud infrastructure hosting
      expenses, and coprocessor subsidy margins.
    whyItMatters: >-
      FHE computational overhead is orders of magnitude higher than plaintext execution; without unit compute costs,
      long-term protocol gross margin sustainability cannot be underwritten.
    diligencePath: >-
      Obtain management engineering cost allocations for cloud and hardware acceleration per million encrypted gas
      units.
    relatedQuestionRefs:
      - QI004
  - type: conflicting-data
    severity: minor
    topic: treasury-liquidations-and-runway
    missingEvidence: >-
      Detailed monthly treasury cash burn schedule, token grant liquidation policies, and secondary share transaction
