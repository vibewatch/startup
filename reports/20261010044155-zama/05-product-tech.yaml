chapter:
  number: 5
  title: "Product & Technology"
  summary: "Zama delivers a full-stack cryptographic computing platform anchored by FHEVM and the TFHE scheme, allowing EVM-compatible smart contracts to execute arbitrary integer arithmetic directly on encrypted state without prior decryption. The operational model decouples lightweight symbolic orchestration on host chains from asynchronous homomorphic processing in off-chain Rust coprocessors, with threshold decryption governed by a decentralized multi-party computation Key Management System. While compliance-by-design integrations with Elliptic and Hypernative address institutional screening requirements, real-world pooled token wrappers remain exposed to composability and censorship contagion from centralized asset issuers."
sections:
  - id: "product-overview-and-stack"
    title: "Product Architecture and Operating Model"
    body: "Zama designs and commercializes fully homomorphic encryption (FHE) infrastructure, enabling developers to build applications that compute on private data without decrypting it at intermediate stages. The core of the company's blockchain offering is FHEVM, a full-stack open-source framework that integrates with the broader Zama Confidential Blockchain Protocol. FHEVM allows EVM-compatible decentralized applications to maintain private transaction amounts, balances, and operational states while preserving composability and on-chain data availability. Under this architecture, encrypted state co-exists alongside public state without degrading existing decentralized application workflows. To make encrypted execution practical on public and private blockchains, Zama employs symbolic execution on host smart contracts. Host contracts validate state transitions and record symbolic computation graphs on-chain, while heavy homomorphic math is offloaded asynchronously to high-performance coprocessors implemented in Rust using TFHE-rs. Decryption authority is distributed across a decentralized multi-party computation (MPC) Key Management System (KMS), preventing single-operator key compromise or unauthorized data exposure."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE007"
      - "CE011"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "module-matrix-and-workflows"
    title: "Module Portfolio, Developer Workflows, and Tooling"
    body: "Zama's product portfolio extends across developer tooling, decentralized protocol apps, and machine-learning frameworks. For smart contract developers, FHEVM exposes native Solidity bindings compatible with established toolchains such as Hardhat and Foundry. Developers define encrypted access control logic directly in contract code using high-precision encrypted integers supporting up to 256 bits of precision, alongside boolean operations, comparisons, and arithmetic primitives. For client applications, the Zama TypeScript SDK provides high-level abstractions for key generation, shielding, confidential transfers, and unshielding tokens. Beyond blockchain environments, Zama maintains Concrete, an LLVM-based compiler translating Python code into homomorphic routines, and Concrete ML, an open-source framework compatible with Scikit-learn and PyTorch that enables confidential inference and training. Developer adoption across these libraries is open-source under the BSD 3-Clause Clear license, with Zama requiring commercial enterprises to acquire patent licenses for production commercial use."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "compliance-security-and-infrastructure-risks"
    title: "Compliance Infrastructure, Hardware Scaling, and Composability Risks"
    body: "To facilitate institutional adoption and meet strict regulatory standards across decentralized finance, Zama has implemented a Compliance by Design framework. At the protocol layer, fine-grained Access Control Lists (ACLs) enable selective decryption of transaction histories and balances for authorized auditors and regulatory bodies without exposing data to the public. For operational risk management, Zama integrates pre-transaction screening through Elliptic for wallet-level KYT and sanctions compliance, combined with Hypernative's continuous on-chain monitoring platform for real-time threat detection and automated response across host contracts. Scalability remains tightly coupled to compute throughput, prompting Zama to optimize software primitives, utilize AWS high-performance cloud instances, and develop hardware acceleration designs including the Alveo V80 Homomorphic Processing Unit (HPU). However, operational events demonstrate acute composability friction: when stablecoin issuer Circle blacklisted Zama's cUSDC contract following a federal civil court injunction against an external depositor, approximately 12.6 million USDC in pooled liquidity was programmatically frozen, underscoring that cryptographic privacy wrappers remain vulnerable to centralized asset control."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
