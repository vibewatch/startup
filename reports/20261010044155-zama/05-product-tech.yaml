callouts:
  - calloutType: "risk"
    title: "Centralized Stablecoin Contagion in Confidential Pools"
    body: "The freezing of 12.6 million USDC across Zama's cUSDC contract illustrates a structural systemic vulnerability in privacy wrapper design. Because fiat-backed stablecoins enforce centralized blacklists at the ERC-1967 contract level, a civil injunction against a single commingled depositor can incapacitate entire liquidity pools, locking out third-party participants regardless of cryptographic confidentiality guarantees."
    claimRefs:
      - "CE015"
      - "CE016"
  - calloutType: "insight"
    title: "Decoupled Symbolic Execution as a Scalability Lever"
    body: "Zama addresses the historic performance limitations of fully homomorphic encryption by separating symbolic transaction routing on the EVM host chain from asynchronous mathematical execution in specialized Rust coprocessors. This off-chain coprocessor model preserves on-chain composability while avoiding prohibitive gas overheads on public base layers."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
