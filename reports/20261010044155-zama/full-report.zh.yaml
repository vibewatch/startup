          - type: paragraph
            body: >-
              定量遥测数据显示，Zama 的开源密码学代码库和测试网环境吸引了大量开发者试验。从 2025 年 7 月公测网发布到 2026 年 3 月，Zama Confidential Blockchain
              Protocol 累计记录超过 6.9 million 笔交易，并记录部署了 27,662 个机密智能合约。开发者活动的激增由 fhEVM 协处理器和专用 Solidity 库的发布推动，使普通 Ethereum
              开发者无需深厚密码学背景即可编写机密应用。2026 年 1 月，Zama 举行公开实用代币拍卖，作为生产环境压力测试；在 Ethereum 主网上通过密封投标荷兰式拍卖保护了超过 $121 million 的
              USDT。尽管这些头部活动数据很可观，尽调发现测试网部署数量无法细分自动化教程脚本与生产级应用。此外，一次性拍卖承诺不能与持续企业队列中的经常性、可产生费用的协议使用混为一谈。
            claimRefs:
              - CU004
              - CU005
