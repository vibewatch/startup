      - number: '1.4'
        title: 里程碑演进、主网交付与监管摩擦
        blocks:
          - type: paragraph
            body: >-
              2020 年至 2025 年底，Zama 从基础数学研究转向生产级区块链基础设施，最终于 2025 年 12 月底推出 Ethereum 主网协议，并于 2026 年 1 月进行 $ZAMA 代币拍卖
              [CO012]。2026 年 9 月，公司与 Morpho 合作，在 Zama Swap Protocol 之外推出 16 个精选金库，扩大机密 DeFi 的使用范围
              [CO013]。不过，这次运营落地也暴露出严重的可组合性漏洞：2026 年 6 月，稳定币发行方 Circle 根据涉及 Overnight Finance 民事纠纷的特拉华州法院紧急禁令，将 Zama 的
              Confidential USDC（cUSDC）智能合约列入黑名单，冻结了池中 $12.6 million 抵押品 [CO010]。作为回应，Zama
              暂停了相邻的包装合约，并与合规机构协调隔离争议资金，说明隐私保护型智能合约架构仍会受到中心化发行方法律干预的影响 [CO010, CO011]。
