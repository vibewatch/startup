chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与核心使命
        blocks:
          - type: paragraph
            body: >-
              Zama 成立于 2020 年，总部位于法国巴黎，是一家专注密码学的深科技公司，致力于让全同态加密在 web3 和机器学习工作负载中真正落地
              [CO001]。同态加密可以直接对加密数据计算，无需中途解密，缓解了公开区块链透明度、用户隐私和机构合规要求之间长期存在的矛盾 [CO014]。Zama 不另建竞争性的 Layer-1 区块链，而是通过开源
              TFHE-rs 库和 fhEVM 框架，严格定位为横向密码学基础设施，让外部兼容 EVM 的网络能够无缝执行机密智能合约 [CO001, CO014]。管理层由联合创始人兼 CEO Rand Hindi
              博士和联合创始人兼 CTO Pascal Paillier 博士带领，兼具经验证的创业执行能力与顶尖密码学研究实力 [CO002, CO003]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO008
      - number: '1.2'
        title: 管理层、科学 IP 与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Zama 的竞争地位高度依赖两位创始人的科研履历和过往创业记录 [CO002, CO003]。Rand Hindi 博士拥有生物信息学博士学位，曾创办 AI 语音平台 Snips；Snips 于 2019 年被
              Sonos 成功收购，证明了他的新兴软件商业化能力 [CO002]。Pascal Paillier 博士是国际知名密码学先驱，发明了 Paillier 密码系统，并拥有约 25 个专利族，保护核心同态加密技术
              [CO003]。截至 2025 年底，Zama 已将技术团队扩充至 96 人，覆盖 26 个国籍，其中 37 人拥有博士学位，成为全球规模最大的专门私有 FHE 研究团队之一 [CO009]。不过，理论密码学
              IP 仍主要依赖 Paillier 博士，机构融资和商业合作则主要依赖 Hindi 博士，关键人物风险依然集中 [CO002, CO003, CO006]。
            claimRefs:
              - CO002
              - CO003
              - CO006
              - CO009
