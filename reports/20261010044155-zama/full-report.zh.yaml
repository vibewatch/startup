  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资主张、反主张与建议框架
        blocks:
          - type: paragraph
            body: >-
              Zama 的深科技投资主张很有吸引力，核心是其在全同态加密（FHE）领域的品类定义级领先地位。借助纯 Rust 编写的 TFHE-rs 库和 FHEVM 框架，Zama
              让开发者无需高深密码学背景，就能在以太坊虚拟机链的加密状态上执行机密智能合约 [CV005]。商业化早期已显示出开发者需求：公司宣布商业发布六个月内，已签合同金额超过 $50m
              [CV004]。运营规模也大幅扩张，从 Series A 时的 75 名员工增至 251 人。机构尽调的反主张同样尖锐，集中在收入质量和治理风险：客户合同大多以波动性较高的项目代币计价，而非经常性法币软件许可
              [CV004]；链上运营也容易受到中心化稳定币干预 [CV006，CV007]。2026 年 5 月 30 日，Circle 执行联邦法院命令，将 Zama 的 cUSDC
              合约列入黑名单，冻结多用户代理抵押品中的 $12.6m，暴露出严重的可组合性风险 [CV006，CV007]。鉴于这些风险尚未解决，我们给出“继续研究”建议，置信度中等，风险评级为高 [CV013]。
