      - number: '8.2'
        title: 融资历史、股权结构表变化与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Zama 通过一轮轮融资，为资本密集型密码学研发提供资金。2024 年 3 月，公司完成由 Multicoin Capital 和 Protocol Labs 共同领投的 7300 万美元 Series
              A，投后估值接近 4 亿美元 [CV001]。在此基础上，Zama 于 2025 年 6 月完成 5700 万美元 Series B，由 Pantera Capital 和 Blockchange
              Ventures 共同领投，投后估值达到 10 亿美元，跻身独角兽 [CV002]。公司披露的机构股权轮累计融资超过 1.5 亿美元 [CV003]；但未经核实的融资聚合平台援引一笔未确认的 2026 年
              ICO，给出的数字最高达 3.98 亿美元 [CV008]。在 10
              亿美元估值下，入场纪律至关重要：主网上线仍处于测试网阶段的基础设施协议若按完整独角兽价格买入，一旦代币分配模式与股权持有人的价值积累脱钩，后期投资者将承受严重下行风险
              [CV002，CV013]。投资者在投入成长资本前，必须要求清晰的股权结构、核实二级市场估值，并明确代币转股权机制 [CV013]。
