        title: 退出准备度、确认性尽调要求与主张失效触发器
        blocks:
          - type: paragraph
            body: >-
              Zama 的流动性路径分成两条：传统企业软件收购，或公开协议代币生成事件。云基础设施或半导体硬件领域的战略买家可能看中 Zama 的专有 FHE 编译
              IP，但公司近期聚焦区块链代币化和公开测试网部署，表明生态代币发行才是更偏好的流动性路径 [CV002，CV004]。不过，持续存在的法律和财务模糊地带拖累了机构退出准备度
              [CV006，CV013]。确认性尽调必须回答三项关键问题：第一，审计经常性现金软件 ARR，并与波动的客户代币收入区分开 [CV004]；第二，核查完整股权结构中的清算优先权，以及股权与代币的分配机制
              [CV002]；第三，验证针对中心化稳定币代理冻结的法律保护措施
              [CV006，CV007]。一旦出现以下主张失效条件，就应立即下调评级：监管执法将协议代币认定为未注册证券、失去关键硬件协处理器伙伴，或股权在下轮融资中被重新定价至 5 亿美元以下 [CV006，CV012]。
