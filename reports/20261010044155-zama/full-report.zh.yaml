        - 严重
        - 多资产金库扩展至 USDT、WBTC、AUSD 和 tGBP
        - USDC 仍是 DeFi 中占主导地位的稳定币抵押品
      - - 借贷与金库基础设施
        - Morpho Protocol
        - 承载 16 个机密金库的核心信贷协议
        - 严重（机密金库套件的 100%）
        - 智能合约漏洞利用或治理失败会停止金库运营
        - 高
        - 在五家独立承保机构之间分散管理方
        - Zama 收益套件在 Morpho 之外缺乏多协议冗余
      - - 风险筛选与做市
        - Steakhouse Financial, Wintermute, Flowdesk
        - 抵押品风险承保与流动性管理
        - 前三大管理方整体为高
        - 管理方坏账事件或金库敞口定价错误
        - 中
        - 采用经验证公共金库的混合金库设计
        - 机密性掩盖了对第三方偿付能力的实时监控
    notes: 按严重性排序。取自公开金库架构公告和链上池构成。
    claimRefs:
      - CR002
      - CR011
      - CR012
  - id: TV001
    title: 建议汇总表
    columns:
      - 维度
      - 评估
      - 证据锚点
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - Series B 投后估值 $1.0B，但经核实的经常性现金收入证据尚未充分
        - 在经审计的 SaaS ARR 和代币变现机制得到验证前，不作出资金承诺
      - - 信心
        - 中
        - TFHE-rs 已验证的密码学护城河，与商业化和代币信息不透明形成对照
        - 保持主动跟踪，同时争取直接取得领投机构材料
      - - 风险评级
        - 高
        - Circle 锁定 cUSDC 代理抵押品中的 $12.6M，说明可组合性被冻结
        - 要求任何已投入资金或协议流动性均有结构化法律隔离
      - - 估值立场
        - 偏高
        - 相比公开市场安全软件可比公司（1.3x–3.9x），$1.0B 估值隐含很高的深科技增长倍数
        - 寻找相对 $1.0B Series B 估值有显著折价的二级市场购买机会
      - - 目标期限 / 行动
        - 12–18 个月观察
        - 主网上线、硬件芯片开发和代币发行计划在 2025–2026 年进行
        - 若企业法币 ARR 超过 $25M 且毛利率持续高于 80%，重新评估是否上调判断
    notes: 基于 Series A、Series B 融资记录、商业合同和可比软件倍数，综合形成投资立场。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV013
  - id: TV002
    title: 正方论点 / 反方论点表
    columns:
      - 战略支柱
      - 投资论点（乐观视角）
      - 反论点（悲观视角）
      - 转向 / 证伪触发条件
    rows:
      - - 技术护城河
        - 围绕 TFHE-rs 和 FHEVM 构建的先发开发者生态；支持端到端加密的智能合约执行
        - 同态计算开销仍显著高于未加密计算，若没有定制 ASIC 芯片，扩展能力受限
        - 专用硬件投入生产，使吞吐量超过每秒 10,000 笔交易
      - - 商业模式
        - 上线六个月内，已在多个区块链和 Web3 项目中签下超过 $50M 的合同金额
        - 合同大量以波动性较高的客户代币计价，而不是以可预测、现金结算的 SaaS 经常性订阅收入计价
        - 独立审计师验证年化现金软件收入超过 $20M
      - - 市场估值
        - 全球首家 FHE 独角兽（估值 $1.0B），由一线加密风投 Pantera 和 Blockchange 支持
        - 公开安全软件可比公司的 EV/Revenue 为 1.3x 至 3.9x，显示倍数大幅压缩风险
        - 一线受监管银行或大型国防承包商采用 Zama 机密层
      - - 法律与监管
        - 选择性披露架构在不暴露用户数据的前提下满足合规和可审计性要求
        - 中心化资产发行方可依据私人民事法院禁令，单方面冻结汇集式隐私封装
        - 取得完整监管许可并重构协议，阻止第三方将抵押品列入黑名单
    notes: 将核心投资论点与可核实的运营、商业和监管反证进行对比评估。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率权重
      - 关键运营假设
      - 隐含估值 / 倍数
      - 下行与退出触发条件
    rows:
      - - 乐观情景
        - 25%
        - 主网上线触发多链 EVM 和 Solana 的大规模采用；定制 ASIC 硬件达到 10k+ TPS；代币发行累积流动价值
        - $2.0B - $2.5B（Series B 估值的 2.0x–2.5x）
        - 生态代币发行事件带来流动性分配；企业授权扩展到医疗健康和 AI
      - - 基准情景
        - 50%
        - 细分隐私 DeFi 的开发者吸引力稳步提升；企业试点仍处于测试阶段；硬件加速于 2026 年交付
        - $900M - $1.1B（与 Series B 估值持平；预估未来收入的 15x–20x）
        - 增长陷入平台期；公司需要结构化的内部人平轮融资或可转债延期，以维持研发现金跑道
      - - 悲观情景
        - 25%
        - 计算延迟抑制采用；监管机构反复列入黑名单使 DeFi 流动性瘫痪；代币市场无法支撑协议资本化
        - $350M - $500M（下轮融资回落至约 $400M 的 Series A 估值底部）
        - 倍数严重压缩；现金消耗迫使公司进行防御性下轮融资或折价出售密码学专利资产
    notes: 以 Series A 和 Series B 入场价格及历史硬件开发周期为基准，建立按概率加权的估值情景。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV009
      - CV011
      - CV012
