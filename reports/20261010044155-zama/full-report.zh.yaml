      - number: '1.3'
        title: 融资历史、估值轨迹与投资人联盟
        blocks:
          - type: paragraph
            body: >-
              Zama 在多轮风险投资周期中展现出极强的募资能力，累计股权融资超过 $138 million，用于支持高强度密码学研究和开发者工具建设 [CO004, CO005]。公司先获得 $8 million
              种子轮投资，随后于 2024 年 3 月完成 $73 million A 轮融资，由 Multicoin Capital 和 Protocol Labs 共同领投，股权估值接近 $400 million
              [CO004]。2025 年 6 月，Zama 完成由 Pantera Capital 领投的 $57 million B 轮融资，估值达到 $1.0 billion，成为全球首家 FHE 独角兽
              [CO005]。其股权结构表和顾问网络包括 Gavin Wood、Juan Benet、Anatoly Yakovenko 及风险投资机构 Hack VC 等生态知名人士 [CO006]。管理层称其在 2024
              年初签署的合同价值超过 $50 million，第三方分析师则估计 2025 年收入运行率接近 $26.4 million，但经核实的 GAAP 收入和客户集中度指标仍未披露 [CO007, CO008]。
