      - number: '3.2'
        title: 密码学能力、吞吐量基准与合规姿态
        blocks:
          - type: paragraph
            body: >-
              Zama 与替代隐私协议之间的核心取舍，在于计算表达能力、交易延迟和多链部署灵活性之间的平衡 [CP004, CP006]。Zama 的 FHEVM
              架构允许开发者执行任意加密状态转换和算术运算，但计算吞吐量严重受限：当前生产基准约为每秒 20 笔交易（TPS），工程路线图则计划借助 GPU 和定制 FPGA 加速提升至 1,000 TPS [CP004,
              CP006]。相比之下，Hinkal 等零知识结算方案继承宿主链的原生吞吐量，例如 Ethereum、Solana、Arbitrum 和 Base，因为计算通过简洁证明验证，而不是在同态加密下执行 [CP003,
              CP004]。从集成和用户体验看，Hinkal 无需逐个为收款方开户，可跨多链金库环境运行；Zama 则要求逐链部署 FHE、使用专门的密码学开发工具，并配置定制协处理器 [CP003,
              CP004]。两种范式也有不同的合规流程：Hinkal 在方案层嵌入 Chainalysis KYT 筛查和选择性查看密钥，以满足监管可审计性；Zama 则通过 Elliptic 和 Hypernative
              实现合规设计的访问控制列表（ACL）及合作方筛查 [CP003, CP008]。
