  - id: TP001
    title: 竞争对手概况表
    columns:
      - 竞争对手 / 方案
      - 类别
      - 规模 / 融资
      - 目标细分
      - 差异化
      - 局限
    rows:
      - - Zama Protocol
        - 直接竞争（FHE 基础设施）
        - 风险融资 $81M 以上（$73M Series A 由 Multicoin/Protocol Labs 共同领投）；代币拍卖 $121M
        - EVM 智能合约 dApp、机密 DeFi、企业 AI
        - 通过 TFHE-rs 和 FHEVM 在加密状态上执行任意计算；25 个专利族
        - 20 TPS 吞吐瓶颈；需逐链部署；暴露于中心化稳定币黑名单风险
      - - Hinkal Protocol
        - 替代方案（ZK 结算层）
        - 已处理 $400M 以上机密交易量；通过 6 次独立安全审计
        - 公链上的机构金库、场外交易台、PSP 和薪资发放
        - 接收方无需设置；多链统一结算（ETH、SOL、Base、Tron）；Chainalysis KYT
        - 隐藏转账数据，但不支持在加密状态上执行任意智能合约计算
      - - Duality Query
        - 直接竞争（FHE 数据安全）
        - 获风险资本支持的网络安全 / 加密数据查询平台
        - 企业数据库查询、网络安全情报、跨边界数据协作
        - 针对敏感表格数据集和分析的专用安全查询执行
        - 聚焦企业数据查询，而非可组合的公链智能合约
      - - NEAR Protocol (Confidential Intents)
        - 相邻方案（L1 机密分片）
        - 拥有大量生态资本和高开发者活跃度的公有 L1 网络
        - 消费者 dApp、跨链 DeFi 和 Web3 自主 AI 代理
        - 通过私有分片执行机密意图，无需外部 FHE 协处理器
        - 机密性仅覆盖受支持的意图和存款；底层基础 L1 仍公开
      - - Hardware TEEs (Intel SGX / AWS Nitro)
        - 现状替代方案
        - 全球超大规模云厂商和硬件供应商基础设施
        - 企业云计算、机密 VM、企业联盟链
        - 借助成熟云工具和 SDK，吞吐接近原生执行速度
        - 硬件侧信道攻击；依赖中心化半导体制造商
    notes: 综合竞争对手披露、密码学文档和独立市场报告。
