      - number: '7.2'
        title: 运营、安全与技术风险：密钥管理、协处理器可靠性与硬件瓶颈
        blocks:
          - type: paragraph
            body: >-
              Zama 的机密计算架构依赖复杂的多方计算（MPC）网络和微服务协处理器。在 Zama Protocol 中，FHEVM Coprocessor
              服务通过多个微服务在链下执行同态计算，分别负责输入验证、交易分发和事件监听
              [CR007]。全同态加密虽然从数学上消除了计算过程中的明文暴露，但密钥管理仍是严重的运营故障点：阈值解密完全依赖去中心化密钥管理系统（KMS）和节点运营者法定人数
              [CR008]。官方代币拍卖披露强调，底层软件栈仍处于实验阶段，残留风险包括共识失败、智能合约漏洞、DNS 攻击或私钥丢失；这些问题可能在没有追索手段的情况下摧毁全部资本
              [CR009]。              在计算层，同态运算带来的开销使其运行速度约慢于未加密执行 100 倍，在通用 CPU 上造成严重吞吐瓶颈，因此团队仍需持续推进硬件加速，目标是定制 FPGA
              同态处理单元（HPU）[CR010]。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
