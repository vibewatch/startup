      - - Hinkal Protocol
        - 对隐私存款、转账和提款收取基于交易的协议费；向 PSP 提供 SDK 集成许可
        - 多链机密支付 SDK、Chainalysis KYT 筛查、查看密钥基础设施、定制池
        - 定制机构池部署的费用表未披露；高交易量 OTC 交易台可享受数量折扣
        - 现金流取决于交易量，但开发者集成摩擦低于完整 FHE 协处理器部署
      - - Duality Query
        - 按查询量和计算实例规模分档的企业年度软件订阅 / SaaS
        - 加密查询引擎、数据协作工作流、监管合规报告
