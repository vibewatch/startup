  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局架构与隐私技术分类
        blocks:
          - type: paragraph
            body: >-
              评估 Zama 的竞争地位，需要区分区块链和企业机密性的基础数学路径 [CP001]。Zama 专注于全同态加密（FHE），让兼容 EVM 的区块链能够在无需中途解密的情况下，对加密状态执行任意计算
              [CP001, CP005]。在更广泛的 Web3 和企业隐私市场中，机密架构分为三类主要结构：全同态加密协处理器、零知识证明结算层，以及多方计算或机密分片网络 [CP002, CP003,
              CP004]。同态加密领域的直接同行包括面向企业的 Duality Query、Fhenix 和 Sunscreen，它们瞄准私有数据库查询或专用 Rollup；NEAR Protocol
              等通用区块链则通过私有网络分片中的 NEAR Confidential Intents 提供替代隐私机制 [CP002, CP004]。与此同时，Hinkal
              等机构隐私协议聚焦于透明公链上的非托管机密结算，利用零知识证明隐藏发送方身份、收款地址和交易金额 [CP002,
              CP003]。现有替代方案依赖硬件可信执行环境（TEE）或链下双边结算，但会引入物理侧信道漏洞或中心化托管风险，而密码学方案可以消除这些问题 [CP001, CP004]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
