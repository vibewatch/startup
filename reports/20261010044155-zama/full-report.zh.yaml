      - number: '7.3'
        title: 合作伙伴集中、财务不确定与执行脆弱
        blocks:
          - type: paragraph
            body: >-
              Zama 的商业扩张高度依赖合作伙伴，变现情况也不透明。协议的机密 DeFi 战略严重依赖第三方策展方和流动性伙伴，包括 Morpho、Steakhouse Financial、Wintermute 旗下
              Armitage 和 Flowdesk；这些伙伴覆盖 16 个机密收益金库 [CR011]。Morpho 或底层策展方一旦出现运营中断、智能合约被攻破或遭监管执法，都会直接威胁 Zama 的费用收入和协议采用
              [CR012]。财务方面，Zama 在 pre-seed、seed 和 $73m Series A 阶段合计融资 $81m，对应估值约 $300m–$400m
              [CR013]。但经核实的财务指标仍不透明：第三方数据库估算其 ARR 为 $26.5m、员工 176 人；Zama 从未公布经审计的收入数据，CEO Rand Hindi
              此前也承认，已签合同大多以波动性较高的客户代币计价，而非稳定法币 [CR014，CR015]。因此，如果代币收入在企业 Web2 和医疗 AI 用例达到商业规模前贬值，Zama 将面临高额现金消耗和估值压顶。
            claimRefs:
