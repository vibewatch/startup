      - number: '6.3'
        title: 已命名部署、机构证明与生产试点
        blocks:
          - type: paragraph
            body: >-
              Zama 已在领先 Web3 基础设施和合规供应商中建立了值得注意的生产部署和试点合作。在去中心化金融领域，Zama 为 Steakhouse Financial 开发的 Morpho 上 16
              个机密收益金库提供支持，管理跨多种抵押品类型的约 $40 million 受保护资产。为推动机构采用，Zama 于 2026 年 7 月与 Elliptic
              合作，引入自动钱包风险筛查，确保受监管资产管理者能在资产进入机密池前执行 AML 和制裁检查。其他生态伙伴包括 Galactica.com，它将 Zama 的 FHE 集成至其 Web3 Identity
              Stack，用于持续声誉评分；托管服务商 Dfns 则把 Zama 的机密交易能力接入企业钱包客户群。Zama 还通过收购扩大产品覆盖，于 2026 年 5 月收购
              TokenOps，提供合规的机密代币归属、空投和企业薪资服务。这些已命名的集成验证了 Zama 的技术可行性，但通过第三方分销渠道实现长期商业变现的路径仍不透明。
