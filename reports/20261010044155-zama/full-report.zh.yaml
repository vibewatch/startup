        title: 产品架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Zama 设计并商业化全同态加密（FHE）基础设施，让开发者能够构建在不解密的情况下直接计算私有数据的应用。公司区块链产品的核心是 FHEVM，这是一个全栈开源框架，与更广泛的 Zama Confidential
              Blockchain Protocol 集成。FHEVM 让兼容 EVM
              的去中心化应用在保留可组合性和链上数据可用性的同时，隐藏交易金额、余额和运营状态。在这一架构下，加密状态与公开状态并存，不会破坏既有去中心化应用工作流。为了让加密执行在公链和私链上真正落地，Zama
              在宿主智能合约上采用符号执行。宿主合约验证状态转换，并在链上记录符号计算图；繁重的同态数学则异步卸载给使用 TFHE-rs、以 Rust
              实现的高性能协处理器。解密权限由去中心化多方计算（MPC）密钥管理系统（KMS）分散持有，防止单一运营方密钥被攻破或数据未经授权暴露。
