  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与结构性相邻领域
        blocks:
          - type: paragraph
            body: >-
              Zama 位于密码学、企业隐私和去中心化金融基础设施的交汇处。公司的核心技术是全同态加密（FHE），能够在数据保持加密的情况下计算，无需中途解密。从商业角度看，这一边界将企业和 Web3 的 IT
              支出划分为不同层级。可计入的支出包括机密虚拟机运行时授权、密码学协处理器、协议层机密 Gas 费用和密钥管理服务（KMS）阈值验证基础设施；通用云托管、未加密的 Layer-1 基础 Gas
              消耗及标准数据库基础设施则属于被排除的商品化支出。早期市场牵引力已由去中心化应用率先验证，最明显的案例是多个资产管理方在 Morpho 上部署的机密收益金库；但 Zama
              更广泛的战略目标是机密机器学习和企业云分析。现有替代方案包括 Intel SGX 或 AWS Nitro Enclaves
              等基于硬件的可信执行环境（TEE）、多方计算（MPC）和零知识证明（ZKP），各自需要在性能延迟、信任假设和可编程性之间取舍。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM014
      - number: '2.2'
        title: 多视角市场规模与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              评估 Zama 的可服务机会，需要把宏观预测与近期可观察的市场需求拆开。宏观层面，第三方行业预测认为，更广义的区块链隐私计算市场将从 2025 年的 $9.42 billion 增长到 2033 年的
              $23.31 billion，年复合增长率接近 12%。在专业密码学软件领域，ResearchAndMarkets 预计全球安全多方计算（SMPC）市场将从 2025 年的 $1.04 billion 增长至
              2026 年的 $1.18 billion，并在 2030 年达到 $1.96 billion，年复合增长率为 13.4%。从宏观估算收窄到可观察的协议牵引力，可以看到一个仍处早期但快速扩张的可服务市场。Zama
              称在最初商业化阶段签署了超过 $50 million 的合同承诺，定价同时包含代币计价和按交易计价。链上经核实的协议活动显示出明显速度：2026 年 10 月，总受保护价值（TVS）超过 $100
              million，在 90 天窗口内增长 3.6 倍，覆盖 16 个精选借贷金库。同时，公开二级市场给出的协议市值为 $194.23 million，按 11.315 billion
              枚代币总供应量计算的完全稀释估值为 $867.14 million，这为当前实用量对应的估值提供了经验上限。
            claimRefs:
              - CM002
