            body: >-
              Zama 的主要护城河来自深厚的自有密码学 IP 和专利保护，由联合创始人 Pascal Paillier 博士主导；他在先进密码系统领域拥有约 25 个专利族
              [CP005]。为了在保持社区采用的同时将科研优势变现，Zama 采用双重授权模式：TFHE-rs 和 Concrete 等核心库以 BSD 3-Clause Clear
              许可开源，但使用自有部署的商业企业必须取得商业专利授权 [CP005, CP009]。不过，开发者切换成本、代币市场波动和中心化资产发行方干预，都给 Zama 的商业防御力带来结构性风险 [CP010,
              CP011, CP012]。在加密资产二级市场，ZAMA 代币通过荷兰式拍卖发行并募集 $121 million，但随后经历剧烈重估，交易价格约为 $0.032–$0.075，市值在 $70M–$191M
              之间；同时，公开网络上还存在与 Philadelphia 的 Zama Sushi 和 Aldea Zama 房地产等无关实体的混淆 [CP010, CP011, CP013]。最关键的是，2026 年 5 月
              Zama 的 cUSDC 合约在联邦民事法院禁令后冻结了 $12.6 million USDC，说明密码学机密包装器无法保护池化流动性免受中心化稳定币黑名单影响，形成竞争隐私平台正在强调的不利运营悬垂
              [CP003, CP012]。
