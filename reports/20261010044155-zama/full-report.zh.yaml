  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险：稳定币可组合性、隐私监管与代币负债
        blocks:
          - type: paragraph
            body: >-
              Zama 的主要脆弱点位于去中心化隐私基础设施与中心化金融监管的交界处。2026 年 5 月 30 日，Circle 执行联邦法院临时限制令，针对 Overnight Finance 被指控的 $15.77
              million 金库挪用 [CR001]。由于约 $12.4 million 争议资金存入 Zama 的池化 ERC-1967 Confidential USDC（cUSDC）包装器，Circle
              将整个智能合约地址列入黑名单 (0xe978F22157048E5DB8E5d07971376e86671672B2)，冻结 $12,606,386.10 池化抵押品，并让完全无辜的第三方存款人无法取用
              [CR002, CR003]。这一事件证明，公链上的隐私包装器无法实际隔绝中心化资产发行方执行民事诉讼法院命令的影响 [CR004]。尽管司法复核随后认定 Zama 没有不当行为，并于 2026 年 6
              月解除冻结，这起事件仍迫使 Zama 紧急整改，加快合规计划并加强 KYC 和 KYT 筛查 [CR005]。此外，Zama Switzerland AG 在 Zug
              发布的代币拍卖条款明确警告参与者注意瑞士及国际法下广泛的监管风险，否认所有效用保证，并承认监管机构可能将 Zama Token 认定为未经授权的证券或金融工具 [CR006]。
