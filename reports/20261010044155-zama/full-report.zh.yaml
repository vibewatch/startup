      - number: '6.4'
        title: 客户接入生命周期与扩张机制
        blocks:
          - type: paragraph
            body: >-
              Zama 协议上的客户采用，沿着从开源评估到实时多链运营的五阶段路径推进。开发者首先通过 TFHE-rs 库和 Concrete 框架研究 Zama
              的密码学原语，在本地开发环境中模拟机密合约。进入测试网部署后，开发者使用 fhEVM SDK 和测试网水龙头，基准测试加密交易延迟并验证链下协处理器执行。生产应用上线需要集成 Zama Relayer
              SDK，将标准代币包装成机密 ERC-7984 等价物，并通过阈值密钥管理网络路由交易。上线后，企业扩张由按交易量计费的协议费用模型推动，该模型根据过去 30
              天的活动量降低每次操作的解密和零知识验证成本。为突破加密原生开发者圈，Zama 引入自动化合规钩子并收购 TokenOps 等交钥匙工具，降低企业金库和受监管薪资应用的运营门槛。
