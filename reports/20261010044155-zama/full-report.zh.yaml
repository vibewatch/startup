      - number: '2.4'
        title: 采用催化剂、可组合性阻力与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              全同态加密在企业和机构中的采用加速，面临显著的技术和结构性阻力。密码学性能仍是首要约束：以太坊基础智能合约执行吞吐量目前约为每秒 20 笔交易，专用 FPGA 和 ASIC
              硬件加速器尚未商业成熟。企业准备度调查还显示，采用机密计算的组织中有 75% 严重缺乏专业密码学人才，阻碍其快速投入生产。除了计算限制，近期法律事件也暴露出隐私包装器固有的系统性可组合性漏洞。2026 年 5
              月，Circle 根据美国联邦法院命令将 Zama 的 cUSDC 合约列入黑名单，冻结 $12.6 million
              资产并打乱无辜第三方余额，证明池化链上隐私包装器仍容易受到传统司法干预。此外，协议价值捕获面临结构性稀释：当前流通代币约 2.55 billion 枚，而总供应量为 11.31 billion
              枚，存在明显的代币供给悬垂；受保护 TVL 的增长反映的是第三方资产存入，而不是直接的代币需求。已实现的企业现金 ARR、客户集中度和私密计算单位毛利仍存在关键尽调缺口。
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
