      - number: '6.5'
        title: 留存持久性、采购摩擦与集中度风险
        blocks:
          - type: paragraph
            body: >-
              隐私保护型基础设施的客户留存和持久性面临严峻挑战，根源在于采购复杂度和资本高度集中。Hinkal 等即插即用的结算方案无需修改智能合约，而在 Zama
              上构建则必须使用加密数据类型并具备深厚架构能力。这一工程负担造成明显采购摩擦，也拉长了主流企业的实施周期。更严重的是，池化机密包装器带来存续性层面的集中度和监管传染风险。2026 年 5 月下旬，稳定币发行方
              Circle 在特拉华州联邦法院针对一名个人存款人的禁令之后，将 Zama 的 cUSDC 合约列入黑名单；该存款人 $12.4 million 的存款占池流动性超过 99%。随后整个池被冻结，锁定了 $12.6
              million 总资产，困住无辜第三方存款人，并迫使 Zama 暂时停止相邻的 cUSDT 和 cWETH 合约。Circle 于 2026 年 6
              月解除冻结，但这起事件证明，极端存款人集中度叠加中心化资产发行方权力，是机构客户面临的关键运营风险。
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
