        - 零知识证明（zk-SNARKs）
        - 私有网络分片
        - 硬件安全隔离区
      - - 任意链上计算
        - 支持（FHEVM 加密状态与整数逻辑）
        - 不支持（仅支持结算和转账隐私）
        - 部分支持（支持意图流程）
        - 支持（不受限的隔离区计算）
      - - 吞吐 / 延迟
        - 当前 20 TPS（路线图目标为 GPU/FPGA 1,000 TPS）
        - 继承宿主链速度（L2/Solana 高吞吐）
        - 平均 40-80 TPS（600ms 区块时间，1.2s 最终性）
        - 接近原生 CPU 速度（延迟开销可忽略）
      - - 跨链架构
        - 需要逐链部署；定制协处理器
        - 统一多链运行（ETH、SOL、Base、Tron）
        - 单一基础 L1，配合跨链签名
        - 特定于云实例；没有原生多链层
      - - 接收方接入摩擦
        - 需要 dApp 集成、FHE SDK 和密钥生成
        - 零设置；连接现有标准钱包
        - 标准 NEAR 账户或跨链签名
        - 需要云证明和隔离区验证
      - - 合规与筛查机制
        - 应用层 ACL、Elliptic KYT、Hypernative
        - 方案层 Chainalysis KYT 和审计查看密钥
        - 应用层披露；没有原生隐私 KYT
        - 企业边界安全和主机操作系统控制
      - - 中心化审查暴露
        - 易受影响（Circle 冻结了 cUSDC 代理中的 1260 万美元）
        - 若法币稳定币池成为目标，则易受影响
        - 桥接中心化资产时易受影响
        - 供应商证明撤销 / 云账户暂停
    notes: 评估标准基于生产环境技术文档、伙伴比较和事件记录。
