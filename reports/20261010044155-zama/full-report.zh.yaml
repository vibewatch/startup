  - id: FE001
    title: Zama FHEVM 机密计算架构
    type: stack
    summary: 多层运营栈展示链上主机编排、链下同态计算、阈值密钥管理与合规控制的分离。
    data:
      layers:
        - label: 应用与接口层
          detail: Solidity 智能合约、ERC-7984 机密代币、Zama TypeScript SDK、React hooks 和 dApp 前端
        - label: 合规与风险筛查层
          detail: 资金进入协议封装前，执行选择性披露 ACL 和 Elliptic KYT 钱包筛查
        - label: 持续监控与响应层
          detail: Hypernative 链上自动监控、业务逻辑告警和 Transaction Guard 模拟
        - label: 主链编排层
          detail: 网关合约和主链智能合约在 EVM 状态上以符号方式执行 FHE 工作流
        - label: 链下计算层
          detail: 基于 Rust 的 FHEVM 协处理器在高内存 AWS 实例和 Alveo V80 HPU 上执行 TFHE 运算
        - label: 密钥管理与密码学核心
          detail: 去中心化 MPC 密钥管理系统（KMS）管理抗量子 TFHE 阈值解密
    approximationNotes: 基于 FHEVM 技术文档和代码库结构的逻辑架构抽象。
