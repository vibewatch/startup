      - number: '2.3'
        title: 买方类型、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              Zama 的客户分层和预算决策权沿两条主要结构性轴线分化：去中心化 Web3 协议与受监管机构企业。在 Web3 领域，主要买方是协议架构师或去中心化自治组织（DAO）治理委员会。这些实体采购 FHEVM
              智能合约能力和私密金库模块，用于保护去中心化金融交易，避免最大可提取价值（MEV）攻击、抢跑和公开流动性追踪。预算来自 DAO 金库和开发者资助，部署周期由收益率差异化驱动。在受监管企业领域，以 JP
              Morgan 的机密代币化资产交易项目 Project EPIC 等试点为代表，采购路径明显不同。机构买方包括 CTO
              和数字资产创新负责人，预算来自合规和战略转型项目。采用触发条件包括严格的监管可审计性、选择性披露机制和企业级密钥管理架构。最后，网络基础设施运营商构成第三类运营主体，为节点硬件提供资金，以参与多方阈值解密，并在协议的销毁与铸造代币模型下获得验证者发行收益。
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM014
