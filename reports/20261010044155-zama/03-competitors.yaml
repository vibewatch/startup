callouts:
  - calloutType: "insight"
    title: "Expressiveness Versus Latency: The Fundamental Privacy Trade-Off"
    body: "The competitive landscape highlights a clear architectural bifurcation. Zero-knowledge protocols like Hinkal achieve immediate multi-chain production readiness and frictionless settlement by limiting their scope to transfer shielding. In contrast, Zama's FHEVM achieves the holy grail of arbitrary computation over encrypted state, but pays a steep performance penalty (20 TPS) and requires custom off-chain coprocessors, making developer adoption dependent on aggressive hardware acceleration roadmaps."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP006"
  - calloutType: "risk"
    title: "Centralized Stablecoin Contagion Across Confidential DeFi Pools"
    body: "The freezing of $12.6 million in USDC across Zama's cUSDC contract underscores that cryptographic moats provide no defense against centralized asset issuer intervention. Because fiat-backed stablecoins enforce address blacklists at the token contract layer, any commingled privacy wrapper remains exposed to emergency civil litigation injunctions, creating an industry-wide vulnerability that competitors also face when handling fiat-backed assets."
    claimRefs:
      - "CP008"
      - "CP012"
