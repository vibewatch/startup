- id: TM004
  title: Growth Drivers and Constraints Register
  columns:
  - Factor
  - Direction
  - Timing
  - Implication for AG1
  - Diligence Ask
  rows:
  - - Preventive healthcare mindset shift
    - Driver
    - Current / structural
    - Expands willingness to pay for premium prophylactic supplements; supports $79/month price tolerance
    - Track CRN annual survey for supplement usage trends and premium tier growth
  - - E-commerce + DTC channel growth
    - Driver
    - Current / accelerating
    - Supports recurring subscription economics; DTC margins ~2× retail; lower CAC for subscription-first brands
    - Benchmark AG1's DTC CAC vs. rising paid media costs and LTV data
  - - Aging population demographics
    - Driver
    - Structural / long-term
    - Grows supplement usage baseline; Baby Boomers contribute highest per-capita spend
    - Assess whether aging segments will adopt greens powder format vs. capsules
  - - Wellness influencer ecosystem (podcasts)
    - Driver
    - Current; maturing
    - Podcast sponsorships built AG1 to $600M; influencer trust drives efficient subscriber acquisition
    - Assess longevity of influencer trust as authenticity scrutiny and competing brands rise
  - - Ingredient transparency / clean-label trend
    - Driver
    - Current / accelerating
    - Rewards science-backed brands like AG1 with NSF cert and published research; raises entry bar for competitors
    - Verify AG1's clinical research publication cadence ($20M commitment, 4 RCTs)
  - - Greens powder category growth (11.2% CAGR)
    - Driver
    - Current
    - AG1 as category leader captures above-market tailwind; category expansion also attracts new entrants
    - Monitor category definition inflation and whether Emergen's 11.2% CAGR holds in 2026 data
  - - Consumer skepticism / trust barrier
    - Constraint
    - Current / increasing
    - High cold-traffic conversion friction; premium pricing vulnerable to efficacy challenges and influencer betrayal
    - Track AG1 clinical trial publications, Bryan Johnson-style public challenges, and subscriber churn
  - - Market saturation / low-cost competition
    - Constraint
    - Current
    - Bloom ($35), Organifi, dozens of generics — AG1's 2× price premium requires continuous brand reinforcement
    - Conduct quarterly competitor pricing audit; track AG1 market share in greens powder category
  - - FDA DSHEA structural risk
    - Constraint / driver
    - Structural
    - Low barrier to entry sustains market growth but creates incumbent risk from copycat brands; health claim limits prevent
      therapeutic messaging
    - Assess AG1 FDA correspondence history and NDI compliance for new ingredients in Next Gen formula
  - - Clinical evidence gap for all-in-one supplements
    - Constraint
    - Ongoing
    - JAMA 2022 meta-analysis and academic critics undermine premium pricing rationale; AG1 trials are small and company-funded
    - Review independence and sample sizes of AG1's planned 4 RCTs; assess peer-review acceptance
  notes: 'Drivers and constraints reflect synthesis of multiple analyst and academic sources. Timing labels: Current = active
    in 2025–2026; Structural = demographic/regulatory; Maturing = trend visible but slowing.'
