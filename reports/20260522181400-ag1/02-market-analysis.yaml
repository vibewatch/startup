chapter:
  number: 2
  title: Market Analysis
  summary: 'AG1 operates in three nested markets: the narrow global greens powders category (~$3.1–5.8B in 2024, 11.2% CAGR),
    the premium DTC supplement subscription segment (~$11.6B globally), and the broad US dietary supplement market (~$68.7B
    in 2025, 8.5% CAGR). Multiple analyst lenses confirm divergent estimates at every layer, making single-TAM claims misleading.
    AG1''s $600M in 2024 revenue represents meaningful category dominance in greens powders (~17% of the Emergen estimate)
    but less than 1% of the broad US supplement market. Consumer skepticism, weak clinical evidence, premium-price saturation,
    and FDA regulatory constraints are the primary headwinds; preventive health tailwinds, e-commerce growth, and aging demographics
    are the primary drivers.

    '
sections:
- id: market-definition-and-boundary
  title: Market Definition and Boundary
  body: 'AG1''s addressable market sits at the intersection of three nested categories that each define a different view of
    total opportunity. At the narrowest level, AG1 competes within the global greens powders and all-in-one superfood powder
    segment — concentrated multi-ingredient dietary supplements combining leafy greens, algae, grasses, adaptogens, probiotics,
    and functional ingredients in a single serving. This segment is defined by its multi-ingredient convenience positioning
    and premium pricing, and it excludes single-ingredient protein powders, standalone mineral supplements, herbal capsule
    products, and sports-specific performance formulas. Within this category, AG1 positions as the premium leader at $79 per
    month against competitors such as Bloom Nutrition at approximately $35 per month.

    The middle layer is the broader dietary supplement market, which encompasses vitamins, minerals, probiotics, herbal supplements,
    amino acids, and specialty blends sold without a prescription. This market is governed in the United States under the
    Dietary Supplement Health and Education Act of 1994 (DSHEA), which classifies supplements as food rather than drugs, exempts
    them from pre-market FDA approval, and limits health claims to structure/function language rather than disease treatment
    claims. All AG1 product pages carry the standard FDA disclaimer asterisk.

    The outermost context is the global wellness economy, estimated at $5.6 trillion in 2024 by the Global Wellness Institute
    — a broad frame that situates dietary supplements as a contested but fast-growing segment of preventive health spending.
    Key exclusions from AG1''s addressable market include prescription nutraceuticals, GLP-1 weight-loss drugs (an emerging
    substitute for some health investment), meal replacement services, conventional food and beverages, and energy drinks
    that compete on stimulants rather than nutritional completeness. Status-quo substitutes include individual supplement
    stacks (multivitamin + probiotic + vitamin D + fish oil), whole-food diets, and competitor greens blends.

    '
