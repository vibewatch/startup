- id: growth-drivers
  title: Growth Drivers and Tailwinds
  body: 'Five structural forces support continued expansion of AG1''s addressable market. First, the shift toward preventive
    healthcare is durable: 74% of US adults reported taking dietary supplements in 2023 (CRN/Grand View Research), up from
    approximately 58% in 2018. The COVID-19 pandemic accelerated health-consciousness, and post-pandemic behaviors have largely
    retained their supplement habits. More than 80% of supplement buyers in 2025 cited ingredient transparency and supply-chain
    traceability as key purchase factors, benefiting science-forward brands that invest in certifications (NSF, third-party
    testing) and clinical research.

    Second, e-commerce channel growth is a direct tailwind for AG1''s DTC model. The US online vitamin and supplement sales
    market reached $25.6B in 2024 (IBISWorld), growing from just 6.7% of total supplement sales in 2018 to approximately 35–40%
    by 2024–2025 (NBJ Supplement Business Report). DTC brands report margins roughly 2× those of retail-distributed brands.
    AG1''s subscription flywheel — direct customer data, recurring revenue, and personalized outreach — is uniquely advantaged
    in this environment.

    Third, the greens powder and all-in-one supplement segment is growing faster (11.2% CAGR per Emergen Research) than the
    broader dietary supplement market (7.78–9.5% CAGR), providing AG1 an above-market category tailwind. This is driven by
    the trend toward convenience, reduced pill burden, and the appeal of all-in-one simplicity among Millennials and Gen Z.

    Fourth, AG1''s new retail channel expansion (Amazon, Costco, Target, Vitamin Shoppe) announced in 2025 opens access to
    a different buyer cohort than DTC-first consumers, potentially expanding the served market without cannibalizing the existing
    subscriber base. CEO Kat Cole noted that retail is framed around increasing lifetime value of existing consumers rather
    than pure new customer acquisition, consistent with the post-omnichannel strategic model articulated at NRF 2025.

    Fifth, the aging population provides a structural long-term driver. Adults over 65 represent a growing segment of supplement
    demand; geriatric consumers contribute approximately 30% of worldwide supplement sales (Grand View Research), and this
    cohort will grow as Baby Boomers age. AG1''s pivot toward clinical validation ($20M research commitment, 4 planned RCTs
    for Next Gen) is positioning for credibility with this more health-literate, physician-influenced segment.

    '
