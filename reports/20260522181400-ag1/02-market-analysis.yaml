- id: buyer-and-user-segmentation
  title: Buyer and User Segmentation
  body: 'AG1''s buyer base skews toward health-conscious adults aged 25–54 with household incomes above $50,000. YouGov data
    show that supplement usage correlates strongly with income: 60% of households earning over $50K use supplements regularly
    versus 40% of lower-income groups. At $79 per month (approximately $2.63 per day), AG1 targets consumers for whom the
    premium is a perceived investment rather than a price barrier.

    Latterly''s analysis of AG1''s marketing architecture identifies five primary segments. Performance optimizers — endurance
    athletes, gym-goers, and recreational competitors — are the most responsive to AG1''s NSF Certified for Sport positioning
    and its partnerships with high-performance figures such as Alex Honnold, Lewis Hamilton, and Allyson Felix. Busy professionals
    (knowledge workers, executives) value the one-scoop ritual that replaces a multi-supplement stack; this segment is reached
    efficiently via podcast sponsorships on shows favored by professional audiences (Huberman Lab, Tim Ferriss, Joe Rogan).
    Health improvers are a broader catchment covering consumers who are nutritionally concerned but not primarily athletic;
    this segment is influenced by physician referrals and peer recommendations, with Millennials (who favor plant-based and
    gut-health products) showing the highest natural affinity for AG1''s probiotic and adaptogen positioning. Frequent travelers
    and executives value travel pack formats and the consistency-through-disruption positioning; AG1''s hotel and endurance
    event partnerships (e.g., 1 Hotels, 29029 Everesting) directly target this group. Finally, the aging wellness segment
    (55+) prioritizes longevity, absorption, and immune support — a growing demographic as Baby Boomers (who have the highest
    supplement usage at 64% for vitamins) enter retirement.

    The payer is almost always the same person as the buyer and user (self-directed consumer wellness spend), with limited
    corporate wellness reimbursement at present. Budget authority sits with the individual, who weighs AG1 against other premium
    health expenditures (gym membership, wearables, dietitian consultations). Adoption is typically triggered by a podcast
    recommendation or influencer content rather than a healthcare provider — a pattern that creates efficient reach but also
    concentration risk if influencer trust erodes.

    '
