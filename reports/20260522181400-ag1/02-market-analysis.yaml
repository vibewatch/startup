      with no consensus methodology or category definition.
    whyItMatters: The variance determines whether AG1's ~$600M revenue represents ~10% or ~20% market share, materially affecting
      assessment of competitive moat and category saturation.
    diligencePath: Commission independent category audit with standardized definition (SKU-level retail scanner data from
      Nielsen/NielsenIQ or IRI SPINS would resolve this).
