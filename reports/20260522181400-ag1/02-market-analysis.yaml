    whyItMatters: Subscriber count and churn are necessary to independently verify market share claims and assess whether
      AG1's revenue concentration in greens powders reflects genuine leadership or subscription lock-in masking trial discontinuations.
    diligencePath: Request financial statements in due diligence; benchmark churn to DTC supplement peer data (Ritual, HUM,
