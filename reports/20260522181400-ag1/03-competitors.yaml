  - id: FP003
    title: "AG1 Moat and Competitive Readiness KPIs"
    type: kpi
    layout: standard
    summary: >
      AG1 holds a strong brand/awareness moat and a unique certification edge, but faces
      high-severity threats on price premium sustainability and retail shelf competition.
      Subscription churn rate and retail sell-through are the critical undisclosed metrics
      for validating moat durability.
    approximationNotes: >
      Moat ratings are qualitative assessments based on publicly available competitive evidence.
      Status labels: Strong = durable with limited near-term erosion risk; At Risk = meaningful
      near-term threat identified with active competitive pressure; Developing = newly
      established position still being contested; Weak = structurally limited or absent;
      Unknown = critical metric not publicly disclosed.
    data:
      items:
        - label: "Podcast Sponsorship Moat"
