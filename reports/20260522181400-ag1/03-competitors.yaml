  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: "subscription retention and churn"
      missingEvidence: "AG1's subscription renewal/churn rate, cohort-level retention curves, and LTV/CAC ratio across pricing tiers."
      whyItMatters: "Subscription retention is the single most important indicator of moat durability; without it, the price premium and switching cost analysis rests on conjecture."
      diligencePath: "Request churn rate by subscription cohort, monthly renewal rates, and LTV/CAC for DTC vs. retail channels under NDA from management."
      relatedQuestionRefs: [QP013]

    - type: missing-source
      severity: material
      topic: "AG1 formulation IP and exclusive sourcing"
      missingEvidence: "Whether AG1 holds trade secrets, exclusive ingredient sourcing contracts, or supplier lock-up agreements that provide competitive protection for its formulation."
      whyItMatters: "Without verifiable sourcing exclusivity, the formulation moat is limited to consumer perception rather than structural supply barrier; any contract manufacturer could replicate the profile."
      diligencePath: "Legal and supply-chain due diligence review of AG1's supplier agreements and any IP filings related to formulation or processing methods."
      relatedQuestionRefs: [QP013]

    - type: missing-source
      severity: material
      topic: "AG1 retail sell-through and cannibalization"
      missingEvidence: "Sell-through data for AG1 at Costco and Target, alongside any evidence of DTC subscription cannibalization caused by retail availability."
      whyItMatters: "Retail expansion is the primary near-term competitive test; without sell-through data it is impossible to assess whether retail channel is additive or cannibalizes DTC subscriber growth."
      diligencePath: "Request retail partner sell-through data and track DTC subscription growth rates pre/post retail launch in overlapping geographies."
      relatedQuestionRefs: [QP016]

    - type: missing-source
      severity: informational
      topic: "Amazing Grass corporate ownership and KDP distribution scope"
      missingEvidence: "Official confirmation of Amazing Grass's current ownership structure under Keurig Dr Pepper, distribution network scope, and whether KDP's bottler network provides Amazing Grass a structural shelf placement advantage versus AG1."
      whyItMatters: "If Amazing Grass leverages the full KDP distributor network, it gains near-universal convenience store, gas station, and mass-market shelf presence that AG1 lacks, which represents a distribution moat for the budget greens segment."
      diligencePath: "Review KDP investor relations filings and Amazing Grass press releases for distribution network scope; confirm via Nielsen or SPINS retail channel data."
      relatedQuestionRefs: [QP012]

    - type: missing-source
      severity: informational
      topic: "Personalized vitamin subscription per-serving cost comparison"
      missingEvidence: "Published per-serving cost data for leading personalized supplement stacks (Persona Nutrition, Care/of, Gainful) to enable direct unit-economics comparison with AG1's $2.63–$3.30/serving retail and subscription pricing."
