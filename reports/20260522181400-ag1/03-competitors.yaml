callouts:
  - calloutType: strength
    title: "NSF Certified for Sport Provides a Verifiable and Unique Trust Anchor"
    body: >
      Among direct daily greens powder and all-in-one nutrition competitors, AG1 is the only
      brand holding NSF Certified for Sport status, which verifies third-party testing for banned
      substances, label accuracy, and purity against rigorous standards. Neither Bloom, Ka'Chava,
      Organifi, nor Amazing Grass hold a comparable named certification as of May 2026. This
      provides a defensible trust signal for athlete, military, collegiate sport, and safety-
      conscious buyers — a consumer segment that commands a premium willingness to pay and
      generates high-quality word-of-mouth. It is also a meaningful differentiator in institutional
      and employer-sponsored wellness program procurement.
    claimRefs:
      - CP025

  - calloutType: risk
    title: "Retail Co-Location with Lower-Priced Rivals Creates Structural Price Comparison Pressure"
    body: >
      AG1's 2025 expansion into Costco and Target places its $79–99 product directly adjacent
      to Amazing Grass ($26.99/30 servings), Bloom Nutrition (~$35/30 servings), and potential
      private-label greens powders at $15–20. For first-time retail buyers unfamiliar with
      AG1's brand story — typically delivered through long-form podcast content — the 3–5×
      price gap is difficult to justify at the point of shelf purchase. Retail expansion is
      a volume opportunity but simultaneously undermines the premium pricing power that
      historically resided in a DTC-only, content-first sales funnel.
    claimRefs:
      - CP023
      - CP024
      - CP036

  - calloutType: risk
    title: "Independent Dietitian Reviews Consistently Recommend Cheaper AG1 Alternatives in 2026"
    body: >
      Multiple registered dietitian review outlets published in 2026 — including Top Nutrition
      Coaching, V Nutrition and Wellness, Live it Up, The Quality Edit, and Freak Naturals —
      rate AG1 as overpriced and recommend Bloom, Huel Daily Greens, Live it Up Super Greens,
      and Amazing Grass as cost-effective alternatives. While several of these outlets have
      affiliate relationships with competing products (a material conflict), the consistency
      and volume of independent expert opinion across 2025–2026 represents a real adverse signal
      for AG1's value perception among new buyers navigating search and social media comparison
      content before their first purchase.
    claimRefs:
      - CP031

