  - id: direct-competitor-profiles
    title: Direct Competitor Profiles — Premium Greens and All-In-One Nutrition
    body: >
      Bloom Nutrition is the most strategically significant direct challenger. Founded by Mari
      Llewellyn and Gregory LaVecchia and backed by approximately $210M from Nutrabolt (itself
      backed by Keurig Dr Pepper), Bloom generated an estimated $175–200M in 2023 revenue and
      targeted $350–400M in 2025. Its core greens and superfoods powder retails at $29.99–$39.99
      for 30 servings (~$1.00–$1.30 per serving), achieving a 2–3× price advantage over AG1.
      Bloom offers nine flavor varieties versus AG1's single option, a meaningful differentiator
      for taste-driven buyers. However, Bloom's seven proprietary blends and unspecified
      third-party testing receive consistent criticism from registered dietitians for potential
      "fairy-dusting" — under-dosing ingredients for marketing appeal rather than clinical
      efficacy. Bloom's strategic pivot toward beverages (energy drinks, sodas) launched in
      2024–2025 may reduce direct greens supplement competition with AG1 while increasing
      broader consumer wellness wallet competition.

      Ka'Chava markets itself as a distinct all-in-one meal replacement rather than a greens
      powder, containing 85+ superfoods, 25g plant-based protein, six mushroom adaptogens, and
      digestive enzymes at $69.95 per 15-serving bag ($4.66/serving) at full price, or
      approximately $59.95 on subscription (~$3.99/serving). Its distribution includes Costco
      (30-serving bags) and Target (single-serve packs). Ka'Chava generates more calories per
      serving (~240 kcal) and justifies its higher price through meal-replacement framing. One
      independent review flagged potential lead content as a safety concern under California
      Proposition 65 standards, a reputational risk that may limit institutional and sports-market
      distribution.

      Organifi Green Juice occupies an organic/clean-label position at approximately $69.99 for
      30 servings ($2.33/serving). Its omnichannel retail expansion — Sprouts nationwide, 600+
      CVS stores, King Sooper, Fresh Thyme — mirrors the DTC-to-retail playbook AG1 is executing,
      having reported 55% year-over-year revenue growth during its DTC phase. Organifi's former
      rank as Vitamin Shoppe's number-two superfood brand demonstrates that taste-driven organic
      positioning can build retail loyalty without AG1's scale.

      Amazing Grass Super Greens is the budget incumbent: USDA organic, non-GMO, 14 core
      ingredients with 1 billion CFU probiotics, retailing at $26.99 per 30 servings ($0.90/
      serving) at Target, Walmart, Walgreens, and Amazon. As a Keurig Dr Pepper subsidiary
      since 2017, Amazing Grass benefits from formidable mass-retail distribution infrastructure.
      AG1 now shares shelf space with Amazing Grass in both Costco and Target.

      Huel Daily Greens positions on breadth and value: 91 ingredients including vitamin D and
      vitamin K (both absent from AG1's standard formula), at approximately $1.50 per serving on
      subscription and $1.88 one-time. Multi-flavor options and a competitive price make it a
      credible alternative for cost-conscious buyers who prioritize ingredient comprehensiveness
      over brand recognition. Huel reported approximately £350M in all-product annual revenues.

      Ritual Essential represents a distinct substitution vector: a $30/month DTC capsule
      multivitamin with full ingredient-level transparency, traceable sources, cancel-anytime
      subscription terms, and a clinically informed formulation. While not a greens powder, Ritual
      competes directly for the same "daily wellness routine" budget at roughly one-third of
      AG1's subscription price.

      Live it Up Super Greens (Nested Naturals) occupies a mid-tier niche: mostly organic
      ingredients, 20+ superfoods, and 5 billion CFU probiotics at approximately $1.33/serving
      on subscription. It is consistently rated by dietitians as the best overall value alternative
      to AG1 in 2026 rankings.
