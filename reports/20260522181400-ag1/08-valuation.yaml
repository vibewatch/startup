  - id: FV004
    title: Investment KPI Scorecard
    type: kpi
    layout: standard
    summary: >
      IC-ready qualitative scoring across eight investment dimensions for AG1. Scores reflect current
      public-evidence quality; market and moat scores are strong, while transparency and regulatory
      scores are materially impaired.
    data:
      items:
        - label: "Market Opportunity"
          value: "Strong"
          note: "Greens powder TAM $3–6B; broader DTC supplement $11.6B; preventive health tailwind confirmed across market chapters"
        - label: "Product Differentiation"
          value: "Strong"
          note: "NSF Certified for Sport; 83-ingredient formulation; 4 RCTs underway; 15-year formula refinement; launched AG1 Next Gen May 2025 and AGZ sleep supplement"
        - label: "Revenue Scale and Growth"
          value: "Strong"
          note: "~$600M 2024 revenue; 56% CAGR 2021–2024; bootstrapped to $100M before external capital; strong relative to comparable private DTC brands"
        - label: "Financial Transparency"
          value: "Critical Gap"
          note: "No audited financials; gross margin undisclosed; NRR/churn undisclosed; all financials are CEO-disclosed; single SEC Form D only"
        - label: "Management Quality"
          value: "Adequate"
          note: "Kat Cole (CEO, former Focus Brands COO); experienced retail executive; team turnover in 2024 (CMO, CFO changes) is a watch item; founder Ashenden exited as CEO Oct 2024"
        - label: "Regulatory and Legal Risk"
          value: "Elevated"
          note: "FDA 118 adverse event reports (liver injury); class action re: unauthorized enrollment; NZ fair trading concern; no confirmed resolution on any front"
        - label: "Exit Optionality"
          value: "Good"
          note: "Grüns/Unilever M&A at 4x revenue in April 2026 confirms strategic premium; FMCG buyer universe (Nestlé, Unilever, Haleon, Reckitt, Hershey); IPO possible if financials clear"
        - label: "Valuation Attractiveness"
          value: "Fair"
          note: "2x implied EV/Revenue is below public comps (1.26–4.2x) but fair given zero disclosure; upgrade to attractive if audited margins confirm >55% gross margin"
    approximationNotes: >
      Scores are qualitative assessments based on publicly available evidence compiled across all eight research
      chapters. There is no numeric scale — qualitative descriptors are: Strong / Good / Adequate / Fair / Elevated /
      Critical Gap. Financial transparency and regulatory scores reflect objective evidence gaps, not editorial bias.
