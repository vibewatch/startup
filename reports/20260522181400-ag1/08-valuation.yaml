    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner or Diligence Path
    rows:
      - ["Audited Financial Statements", "FY2024 and FY2025 audited P&L, balance sheet, and cash flow statement", "Revenue ($600M) and profitability are CEO-disclosed without independent verification — all multiple-based valuations rest on unverified inputs", "Request from company; required before any new capital commitment"]
      - ["Gross Margin and EBITDA by Channel", "Reported gross margin split by DTC subscription vs. retail channel (Amazon, Costco, Target)", "Retail channel (Costco at 31% below DTC pricing) risks compression below 40% blended margin, potentially inverting profitability", "Company-side disclosure; infer from audited COGS if available"]
      - ["Subscription Unit Economics: NRR and Churn", "Monthly churn rate, net revenue retention rate, and customer LTV by cohort and year", "Subscription valuation is entirely predicated on retention; 5% vs. 10% monthly churn is a 2x difference in LTV and dramatically changes entry price", "Company management; third-party billing platform data if accessible"]
      - ["FDA Inquiry Status and Resolution", "Current FDA enforcement posture on the 118 adverse event reports; timeline for review completion", "Active FDA inquiry creates headline and liability risk; a warning letter or consent decree is a thesis-break event", "Direct FDA FOIA request; monitor FDA enforcement database; request management briefing"]
      - ["Cap-Table Waterfall and Preference Terms", "Series B and November 2024 round preference structure, liquidation preference multiples, anti-dilution provisions, and founder equity position", "Preference overhang may mean common equity (and late-entry investor equity) has significantly lower effective recovery in a sub-$1.5B exit scenario", "Legal counsel review of term sheets; request from company counsel"]
      - ["2026 Revenue Guidance and Retail Channel P&L", "Management guidance on 2026 revenue, subscription count, and retail channel contribution", "Retail expansion could be net-new or cannibalistic; without data, forward-revenue assumptions are speculative", "Earnings call / management roadshow; retail sell-through data if available from retailers"]
    notes: >
      Diligence items are ranked by criticality. Items 1–3 are prerequisite to any new capital commitment.
      Items 4–6 are material but not individually blocking if items 1–3 are satisfactory. AG1's private
      status means all items require voluntary company disclosure or regulatory FOIA; no public filing
      contains this information as of May 2026.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV040
      - CV041
      - CV042

figures:
  - id: FV001
    title: Recommendation Logic Flow
    type: flow
    layout: wide
    summary: >
      Chain from evidence base through AG1's key value and risk nodes to the TRACK recommendation, showing
      which factors confirm the thesis, which remain uncertain, and what events would change the call.
    data:
      nodes:
        - id: rev_scale
          label: "Revenue Scale (~$600M, 2024)"
          detail: "CEO-disclosed; 4x growth from $160M in 2021; bootstrapped to $100M before external capital"
        - id: brand_moat
          label: "Brand Moat (15 Years)"
          detail: "NSF Certified; podcast/influencer incumbency; switching friction via subscription pricing gap"
        - id: profitability
          label: "Profitability Claim (Unaudited)"
          detail: "CEO declared profitable Dec 2024; no audited financials available; 40% mktg cut with sales growth"
        - id: financing
          label: "Financing Context ($1.2–1.3B Mark)"
          detail: "Flat valuation since Jan 2022 despite 4x revenue growth; >$230M raised; self-funded per CEO"
        - id: comps
          label: "Comparable Multiples (2–4x Revenue)"
          detail: "Vita Coco 4.2x; Grüns M&A 4x; HIMS 3x; BRBR 1.26x; current AG1 implied ~2x"
        - id: risk_stack
          label: "Risk Stack (High)"
          detail: "FDA 118 adverse events; class actions; no audit; retail margin compression; cap-table opacity"
        - id: exit_path
          label: "Exit Optionality (M&A / IPO)"
          detail: "Grüns/Unilever precedent at 4x; strategic buyer universe intact; IPO possible if financials clear"
        - id: recommendation
          label: "TRACK (Medium Confidence)"
          detail: "Compelling scale and moat; opacity and risk prevent conviction BUY; monitor for disclosure triggers"
      edges:
        - from: rev_scale
          to: recommendation
          label: "confirms scale"
        - from: brand_moat
          to: recommendation
          label: "confirms moat"
        - from: profitability
          to: recommendation
          label: "unverified — limits conviction"
        - from: financing
          to: recommendation
          label: "flat mark — caution signal"
        - from: comps
          to: recommendation
          label: "below-comp implies upside if audited"
        - from: risk_stack
          to: recommendation
          label: "elevates to HIGH risk"
        - from: exit_path
          to: recommendation
          label: "M&A premium available at 4x+"
    approximationNotes: >
      Node labels and edge descriptions are qualitative assessments derived from the evidence in this chapter.
      Flow direction represents analytical causality, not financial modeling.
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV021
      - CV038

  - id: FV002
    title: Valuation Sensitivity to Revenue Multiple (AG1, $600M Revenue Base)
    type: bar
    layout: standard
    summary: >
      Illustrates AG1 implied enterprise value at different EV/Revenue multiples anchored to its ~$600M
      2024 disclosed revenue. Current mark of ~$1.2–1.3B corresponds to ~2x. Public comp range is 1.26–4.2x.
    data:
      items:
        - label: "1.0x (BellRing-like, mass CPG floor)"
          value: 600
        - label: "1.5x (discount to BellRing; distress scenario)"
          value: 900
        - label: "2.0x (current implied mark — base)"
          value: 1200
        - label: "2.5x (modest premium to current)"
          value: 1500
        - label: "3.0x (HIMS analog; subscription premium)"
          value: 1800
        - label: "4.0x (Vita Coco / Grüns M&A precedent)"
          value: 2400
    approximationNotes: >
      Revenue base is CEO-disclosed $600M for 2024; not audited. Enterprise value = EV/Revenue × $600M.
      No premium or discount applied for company-specific features; illustrative sensitivity only.
      Current mark (~$1.2–1.3B) falls between the 2.0x and 2.5x bars.
    claimRefs:
      - CV011
      - CV018
      - CV019
      - CV023
      - CV025

  - id: FV003
    title: Valuation / Return Range — Bull / Base / Bear Scenarios
    type: range
    layout: standard
    summary: >
      AG1 enterprise value ranges under bull, base, and bear scenarios, showing the potential return relative to
      the current ~$1.3B last-known valuation mark. Bull assumes 3.5–4x revenue on $600–750M forward revenue;
      base assumes 2–2.5x; bear assumes 0.5–1x.
    data:
      items:
        - label: "Bear Case: FDA action + audit disappointment + churn spike"
          low: 300
          mid: 600
          high: 900
        - label: "Base Case: Profitability sustained; moderate re-rating; IPO or M&A at 2.5x"
          low: 1000
          mid: 1350
          high: 1800
        - label: "Bull Case: Audit confirms margins; FDA clears; M&A at 4x+ / IPO premium"
          low: 1800
          mid: 2400
          high: 3200
    approximationNotes: >
      All values in USD millions. Ranges represent estimated enterprise values at scenario endpoints.
      Low/high bounds reflect uncertainty around revenue base, multiple expansion, and exit timing.
      Bear case low ($300M) assumes material revenue impairment; base case mid ($1.35B) approximates
      current last-known mark plus modest re-rating; bull case high ($3.2B) assumes a competitive
      M&A process at 4–5x on $650–700M forward revenue.
