  - id: final-recommendation-and-diligence-asks
    title: Final Recommendation and Diligence Asks
    body: >
      The overall recommendation is TRACK with medium confidence and high risk rating. The valuation stance is
      FAIR at current marks ($1.2–1.3B), given that the implied 2x EV/Revenue reflects a substantial
      private-company discount to comparable public and M&A values, but the opacity of financial disclosures
      prevents underwriting conviction at any price. The absence of audited financials, combined with the FDA
      active inquiry, the flat valuation since 2022 despite 4x revenue growth, and undisclosed gross margin and
      unit economics, makes a BUY recommendation unjustifiable within the fund's evidence standard.

      The thesis-break risk is asymmetric: the upside is a 1.5–2.5x return from an M&A or IPO at 3–4x revenue,
      but the downside is a down-round at sub-1x revenue if regulatory, credibility, or financial events break
      against the company. This asymmetry favors engagement (continued monitoring and relationship with the
      company for a future round or secondary purchase at a lower mark) over commitment at the current valuation
      level.

      The specific diligence asks that would upgrade the call from TRACK to BUY are: (1) audited financials for
      FY2024 and FY2025 with gross margin, EBITDA, and operating cash flow disclosed; (2) subscription NRR and
      monthly churn rate, confirmed by third-party billing data; (3) FDA inquiry status update with a clear
      resolution timeline; (4) cap-table waterfall showing preference overhang and effective entry price for
      common versus preferred; (5) retail channel P&L showing whether Costco and Target revenue is incremental
      or cannibalistic; and (6) management guidance on 2026 revenue growth trajectory.
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
