  - id: exit-pathways-and-timeline
    title: Exit Pathways and Strategic Context
    body: >
      Three viable exit pathways exist for AG1 investors: strategic acquisition, IPO, and PE/growth equity
      recapitalization. Strategic acquisition is the highest-probability near-term pathway given the Grüns/Unilever
      precedent and the expressed interest from major FMCG conglomerates in premium health and wellness brands.
      AG1's brand identity, subscriber loyalty, and omnichannel expansion would be highly accretive to a Nestlé
      Health Science, Unilever Wellbeing, Haleon, Reckitt, or Hershey portfolio. The Unilever/Grüns deal closed
      at ~4x revenue for a three-year-old brand with ~$300M revenue and no legacy brand equity comparable to AG1's
      15-year moat. An M&A transaction for AG1 at even a modest discount to Grüns' multiple — say 3x revenue on
      $700M forward revenue — would value the company at ~$2.1B, a 60%+ premium to current marks.

      IPO is possible but contingent on audited financials, revenue transparency, and resolution of the FDA inquiry.
      The company has not filed an S-1 or made any public disclosure of IPO preparation as of May 2026. The Forge
      Global listing notes "IPO Mentioned" and "Confidential Filing" milestones, though these unverified status
      indicators are common for private companies at AG1's scale. The public market would likely apply a 2.5–3.5x
      forward revenue multiple at IPO, depending on growth rate, margin profile, and the regulatory backdrop — lower
      than the 4x+ available from a strategic acquisition, but offering investor liquidity.

      PE recapitalization is less likely given the company's stated self-funding position and CEO's language around
      "choice of paths." However, a secondary transaction or structured liquidity event for founders and early
      investors is possible without a change-of-control transaction. Capstone Partners' June 2025 Vitamins &
      Supplements M&A report identified strong PE and strategic buyer interest in branded supplement companies,
      with EBITDA multiples of 12–18x for differentiated, clinical-backed brands — further supporting a premium
      exit for AG1 if financial disclosures are provided.
