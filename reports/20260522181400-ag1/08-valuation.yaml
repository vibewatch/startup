        external capital, demonstrating early-stage capital efficiency unusual for a consumer DTC brand.
      type: third-party-reported
      topic: capital-efficiency
      sourceRefs: [SV022, SV024]
      confidence: medium
      freshness: historical

    - id: CV003
      statement: >
        AG1 declared operating profitability alongside its ~$600M revenue announcement in December 2024,
