  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-transparency
      missingEvidence: >
        Audited FY2024 and FY2025 financial statements with gross margin, EBITDA, and operating cash flow
        by channel (DTC subscription vs. retail).
      whyItMatters: >
        All multiple-based valuation calculations rest on an unaudited, CEO-disclosed revenue figure. If
        the audited figure diverges materially from $600M, or if gross margin proves below 40%, the bull
        and base cases are invalidated.
      diligencePath: >
        Request directly from AG1 management; would normally be provided in a formal capital raise or
        M&A process data room; no public filing pathway exists.
      relatedQuestionRefs: [QV011, QV012, QV023, QV027]

    - type: private-evidence-only
      severity: material
      topic: subscription-unit-economics
      missingEvidence: >
        Confirmed monthly churn rate, net revenue retention by cohort, and customer lifetime value
        segmented by acquisition channel and vintage.
      whyItMatters: >
        Subscription valuation is entirely predicated on retention; a 5% vs. 10% monthly churn is
        effectively a 2x difference in LTV and dramatically changes the appropriate entry multiple.
      diligencePath: >
        Company management disclosure; third-party billing or analytics platform data; infer from
        revenue per customer if subscriber count is confirmed.
      relatedQuestionRefs: [QV011, QV028]

    - type: missing-source
      severity: material
      topic: regulatory-resolution
      missingEvidence: >
        Current FDA enforcement posture on the 118 adverse event reports and confirmed resolution
        timeline or no-action determination.
      whyItMatters: >
        An FDA warning letter or consent decree is a thesis-break event; absence of resolution leaves
        the single largest downside risk permanently open.
      diligencePath: >
        Direct FDA FOIA request; monitor FDA enforcement database and adverse event database;
        request management briefing on current regulatory status.
      relatedQuestionRefs: [QV010, QV017]

    - type: private-evidence-only
      severity: material
      topic: cap-table-preference-overhang
      missingEvidence: >
        Series B and November 2024 round preference structure, liquidation preference multiples,
        anti-dilution provisions, and founder equity position after both rounds.
      whyItMatters: >
        Preference overhang at $1.2B means common equity holders receive limited value below a
        specific exit threshold; late-entry investors may have better protections than the headline
        valuation implies.
      diligencePath: >
        Legal counsel review of term sheets; request from company counsel as part of a formal
        diligence process.
      relatedQuestionRefs: [QV013, QV019]

    - type: stale
      severity: minor
      topic: AG1-secondary-valuation
      missingEvidence: >
        Secondary market pricing for AG1 shares via Forge Global or Nasdaq Private Market as of
        Q2 2026; Forge listed the last known valuation as November 2025 with limited activity.
      whyItMatters: >
        Secondary market activity can provide real-time price signals ahead of formal rounds;
        thin market means the $1.3B mark may not reflect current arm's-length pricing.
      diligencePath: >
        Monitor Forge Global and Nasdaq Private Market for new AG1 secondary transactions;
        contact secondary brokers with AG1 deal flow.
      relatedQuestionRefs: [QV008]

