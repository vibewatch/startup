  - id: financing-context-and-valuation
    title: Financing Context, Entry Price, and Dilution Overhang
    body: >
      AG1 is a private company incorporated in the Cayman Islands with U.S. operations. Its capital structure is
      opaque: no audited balance sheet, income statement, or cash flow statement has been publicly filed. The company's
      SEC record consists solely of an exempt offering Form D filed May 17, 2021 by Athletic Greens International, Inc.
      (CIK 1862737), raising $9.6M of a $10.5M total offering amount under Rule 506 exemption. The two material
      institutional rounds are: (1) $115M Series B led by Alpha Wave Global in January 2022 at $1.2B pre-money
      valuation; (2) a further $115M round in November 2024 at the same $1.2B pre-money valuation maintained from
      the 2022 round. Total confirmed capital exceeds $230M. At an implied post-money of ~$1.3B after the November
      2024 tranche, the enterprise value approximately equals the post-money valuation, assuming no material debt
      (unconfirmed).

      The flat valuation across three years is analytically unusual. A company growing revenue from $160M to $600M
      (3.75x) in three years, with a declared profitability milestone, would typically see an upward valuation
      revision at a subsequent round. The explanation could be: (a) investors demanded additional dilution via
      below-market-prior terms; (b) a secondary preference structure or ratchet exists that keeps the "headline"
      pre-money flat while protecting late investors; (c) management or founders constrained the markup deliberately
      in advance of an exit; or (d) investors were unwilling to mark up absent audited financials. Any of these
      mechanisms is possible and cannot be resolved without access to the cap table and term sheets. CEO Kat Cole
      stated in April 2026 that AG1 has "its choice of paths" because of profitability and is funding its own
      expansion — suggesting the company is not capital-constrained and could elect an IPO, strategic sale, or
      remain private.

      On secondary markets, Forge Global listed AG1's last known valuation at $1.3B (November 2025) with "limited"
      market activity and no Forge Price available, indicating thin secondary trading. Nasdaq Private Market lists
      AG1 as available only to accredited institutional investors, with no public pricing. No S-1 filing has been
      submitted to the SEC. IPOs.fyi lists "IPO Mentioned" and "Confidential Filing" milestones but no confirmed
      S-1 or IPO date.
