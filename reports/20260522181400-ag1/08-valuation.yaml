  - id: bull-base-bear-scenarios
    title: Bull / Base / Bear Scenarios
    body: >
      The three scenarios below use $600M as the 2024 revenue anchor (CEO-disclosed), apply different revenue
      multiples based on the evidence quality and comparables, and adjust for a private-company illiquidity discount
      of 15–25% versus equivalent public trading prices. All scenarios assume AG1 remains private through 2027
      unless a liquidity event occurs earlier.

      In the bull case, AG1 discloses audited financials confirming >55% gross margin and operating profitability,
      the FDA adverse-event inquiry resolves without recall or enforcement action, the retail channel adds $150–200M
      of incremental revenue in 2025–2026 without material subscription cannibalization, and the company demonstrates
      NRR above 90%. These developments — aligned with Vita Coco and Grüns deal precedent — would support a 3.5–4x
      revenue multiple on $700–800M forward revenue, implying an enterprise value of $2.4–3.2B. Post-dilution
      equity to new investors would represent a 1.8–2.5x return on the current ~$1.3B last-known mark.

      In the base case, the company continues to operate profitably at scale without full financial disclosure. The
      $1.2–1.5B valuation reflects a 2.0–2.5x multiple on $600M disclosed revenue, consistent with a private-company
      discount to Vita Coco's 4.2x. The 2025–2026 retail expansion adds revenue but compresses blended margin.
      Return to a new investor entering at $1.3B is approximately flat-to-moderate over a 3-year horizon unless
      a liquidity event occurs at a premium. IPO or M&A at 2.5x revenue (~$1.5–1.8B) would generate 1.2–1.4x
      return, insufficient for early-stage venture expectations.

      In the bear case, one or more adverse events materialize: the FDA issues a warning letter or requires a
      reformulation; a class action settlement imposes material costs; retail expansion proves to be primarily
      channel-shifting rather than net-new revenue, and subscription churn accelerates as price-elastic customers
      exit. Gross margin at the blended level falls below 40% due to Costco pricing. In this scenario, a down-round
      at 0.5–1.0x revenue ($300–600M) is possible, particularly if investors require audited diligence before
      committing capital at higher marks. Existing preference holders from the November 2024 round would receive
      full return at $1.2B pre-money, but common equity and early investors face impairment.
