companyProfile:
  summary: >
    AG1 (formerly Athletic Greens) is a direct-to-consumer nutritional supplement company founded in
    December 2010 by Chris Ashenden in New Zealand. The company sells a single green powder product
    containing 75–83 vitamins, minerals, probiotics, adaptogens, and whole-food-sourced nutrients at
    $79/month via subscription. Bootstrapped to approximately $100M in annual revenue before taking
    external capital, AG1 achieved unicorn status in January 2022 with a $115M Series B led by Alpha
    Wave Global at a $1.2B pre-money valuation. A second $115M round in November 2024 maintained the
    same valuation. CEO Kat Cole, a veteran consumer-brand executive who succeeded founder Ashenden in
    July 2024, has since led the company's first product diversification (AGZ sleep supplement) and
    retail channel expansion into Amazon, Costco, Vitamin Shoppe, and Target. AG1 declared
    profitability alongside ~$600M 2024 revenue, but has not published audited financials. Key
    metrics—gross margin, NRR, and churn—remain undisclosed. An active FDA adverse-event inquiry
    (118 reports including liver-injury cases) and unresolved consumer class actions add material
    regulatory and legal risk. The company is incorporated in Nevada/Cayman Islands, operates fully
    remotely with employees in 20+ countries, and has no stated IPO timeline.
  foundedDate: "2010-12-01"
  founders:
    - name: "Chris Ashenden"
      role: "Founder (former CEO; current board member)"
      background: "Former New Zealand police officer; bootstrapped AG1 to $100M+ revenue; resigned as CEO in July 2024 after Newsroom NZ investigation revealed NZ Fair Trading Act criminal convictions."
