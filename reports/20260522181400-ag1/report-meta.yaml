  productSummary: >
    AG1's flagship product is the AG1 powder — a daily nutritional supplement containing 75–83
    ingredients per 12-gram scoop, NSF Certified for Sport, vegan, gluten-free, and priced at
    $79/month (subscription) or $99 (one-time purchase). A second product, AGZ (melatonin-free
    nighttime sleep supplement), launched in 2025. Distribution expanded from DTC-only to Amazon
    (April 2025), Costco 600+ US stores (June 2025), Vitamin Shoppe, and Target (April 2026).
  customerFocus: "Health-conscious adults seeking a single-product daily supplement solution; primarily North American and European markets, with growing Asia Pacific presence."
  businessModel: >
    Subscription-led DTC model: customers subscribe at $79/month creating predictable recurring
    revenue and high switching friction. Beginning 2025, retail channel expansion (Amazon, Costco,
    Vitamin Shoppe, Target) adds incremental trial funnel but at structurally lower margin.
    Revenue is approximately 60–70% subscription-origin DTC, with retail increasing. Gross margin
    is not publicly disclosed.
  stage: "Growth (private; self-funded post-2024)"
  fundingStatus: >
    $115M Series B (January 2022, Alpha Wave Global lead, $1.2B pre-money). $115M second round
    (November 2024, Alpha Wave Global lead, same $1.2B pre-money valuation maintained). Total
    confirmed capital exceeds $230M. CEO Cole stated in April 2026 the company is funding its own
    expansion from profitability and has no near-term capital need.
