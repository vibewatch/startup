  topStrengths:
    - >-
      Exceptional capital efficiency and revenue scale: bootstrapped to ~$100M before external capital, then grew ~4x to
      ~$600M by 2024 with declared profitability and no debt-funded losses.
    - >-
      Durable subscription moat: fifteen years of podcast/influencer integration, NSF Certified for Sport status, and a
      $20/month DTC-vs-one-time price gap create high switching friction generic competitors struggle to replicate.
    - >-
      Strategic M&A optionality confirmed by Unilever's ~$1.2B (~4x revenue) acquisition of Grüns in April 2026,
      validating premium valuations for category-leading greens supplement brands.
    - >-
      Retail channel expansion (Amazon, Costco 600+ stores, Vitamin Shoppe, Target) diversifies the acquisition funnel
      and extends addressable subscriber pool without cannibalizing DTC.
    - >-
      CEO transition de-risked: Kat Cole's omnichannel consumer-brand track record directly addresses the operational
      gaps that held AG1 in DTC-only mode for 15 years.
  topRisks:
    - >-
      No audited financials: revenue and profitability are CEO-disclosed without independent verification; gross margin,
      EBITDA, cash position, and NRR remain undisclosed, making independent underwriting speculative.
    - >-
      FDA adverse-event inquiry: 118 adverse event reports including liver-injury cases (2024); active regulatory
      investigation with unconfirmed resolution timeline represents material headline and liability risk.
    - >-
      Flat $1.2B valuation across three years despite 3.75x revenue growth signals potential investor reluctance,
      structural cap-table constraints, or preference terms that disadvantage common equity holders.
    - >-
      Retail channel margin compression: Costco pricing ~31% below DTC subscription equivalent risks eroding the
      economics supporting the profitability claim as retail revenue scales.
    - >-
      Consumer class actions alleging unauthorized subscription enrollment and misleading marketing add litigation
      overhang; founder Ashenden's unresolved NZ criminal history and board seat create residual reputational risk.
    - >-
      No IP moat: AG1's formulation is not patented; well-funded competitors (Bloom Nutrition, Huel, Athletic Greens
      category imitators) replicate the all-in-one format at lower price points.
  unresolvedGaps:
    - >-
      Audited financial statements: gross margin, EBITDA margin, operating cash flow, and balance sheet are not publicly
      available, preventing independent financial underwriting.
    - >-
      Net revenue retention (NRR) and monthly churn: key subscription-health metrics remain undisclosed; estimated at
      80–90% based on market proxies but not confirmed.
    - >-
      FDA adverse-event inquiry resolution: current status, scope, and enforcement risk of FDA investigation into
      liver-injury adverse event reports remain unconfirmed.
    - >-
      Cap-table and preference structure: liquidation preference multiples, anti-dilution provisions, and founder equity
      position are unknown; preference overhang could materially disadvantage common equity in sub-$1.5B exit scenarios.
    - >-
      Retail channel revenue contribution and margin impact: no disclosure of retail vs. DTC revenue split or gross
      margin by channel, making profitability sustainability unverifiable as retail scales.
    - >-
      IPO or exit timeline: no confirmed IPO filing, S-1, or strategic process timeline despite CEO statements about
      'choice of paths'; secondary market activity is limited with no Forge Price available.
