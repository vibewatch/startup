  - id: cost-structure-gross-margin-and-supply-chain
    title: Cost Structure, Gross Margin, and Supply Chain
    body: >
      AG1's cost structure is dominated by three drivers: cost of goods sold (ingredient procurement and contract
      manufacturing), fulfillment and last-mile logistics, and performance marketing. Gross margin is not publicly
      disclosed; premium DTC supplement brands typically report blended gross margins of 55–70%, but the shift to retail
      channels—where club and mass retailers typically leave the supplier with 12–20% gross margin—will compress AG1's
      blended margin as retail revenue scales from zero toward a meaningful percentage of total revenue. The company
      has not disclosed projected channel revenue mix, making margin forecasting speculative.

      Manufacturing underwent material supply chain restructuring between 2022 and 2024. AG1 manufactured almost
      exclusively at Alaron Products in Nelson, New Zealand until approximately 2022–2023, when the company signed a
      new contract with Capstone Nutrition in Utah, shifting primary production to the United States. This transition
      caused Alaron to lay off approximately 180 workers. Newsroom NZ's Powder Keg investigation (November 2024)
      revealed that AG1 continued marketing the product as "made in New Zealand" on its website after most production
      had moved to Utah—a practice the New Zealand Commerce Commission indicated could breach fair trading regulations.
      AG1 removed the "made in New Zealand" claim from its website after Newsroom's inquiries. CEO Cole's team
      acknowledged the transition, stating the NZ and US facilities serve different markets and that label consistency
      lagged during the transition period.

      Fulfillment is handled by Stord, a multi-facility US operator using robotics and proprietary OMS/WMS software,
      selected in October 2023 to support DTC and retail omnichannel scaling. The partnership consolidated third-party
      logistics, last-mile delivery, and inventory management into a single vendor. Supply chain transparency is a
      stated corporate priority: AG1's 2025 Impact Report featured a Sourcemap partnership achieving 100% digital
      mapping of key raw botanical ingredients, with automated supplier risk assessment integrated into operations.

      Marketing spend historically represented the largest variable cost above manufacturing. AG1 spent approximately
      $2.2 million per month on podcast advertising alone—approximately $26 million annually—ranking third-largest
      globally by podcast show count as of 2022 (behind BetterHelp and Manscaped). Affiliates earned a ~20%
      commission per referred sale. In 2025, the company cut its total marketing budget by 40%, redirecting funds to
      four double-blind randomized controlled clinical trials (committing $10 million initially, with $20 million total
      committed 2025–2028). Management reported a 40% Black Friday 2025 sales increase despite reduced marketing
      spend, though the baseline comparison period and channel mix are not disclosed.
