  - id: TI003
    title: Unit Economics
    columns:
      - Metric
      - Value / Estimate
      - Confidence
      - Why It Matters
      - Diligence Ask
    rows:
      - - Annual ARPU (DTC subscription)
        - "~$948/year ($79 × 12 months)"
        - High — derived from public pricing
        - Anchors revenue model; consistent with ~$600M / ~700K subscribers
        - Confirm actual average (partial-year subscribers may lower realized ARPU)
      - - Subscriber count
        - "~700,000 (company-disclosed, December 2024)"
        - Medium — CEO / founder disclosure, no audit
        - Revenue numerator check; ~$600M ÷ ~$948 ARPU implies ~633K at full realization
        - Provide audited active subscriber count and definition (paid vs. active)
      - - Monthly churn rate
        - "~5% estimated (industry DTC benchmark low end; not disclosed by AG1)"
        - Low — estimate only; AG1 does not disclose
        - Drives LTV and CAC payback period directly; 5% = 20-month average tenure
        - Disclose monthly and annual churn; provide cohort retention data
      - - Estimated customer LTV
        - "~$1,580 (at 5% monthly churn, 20-month tenure, $79/month; unadjusted for COGS/CAC)"
        - Low — depends on undisclosed churn; illustrative only
        - Required to assess podcast/affiliate CAC efficiency and retail channel dilution impact
        - Provide actual LTV by acquisition cohort; confirm churn inputs
      - - Podcast/affiliate marketing spend
        - "$26.4M+/yr (~$2.2M/month podcast; plus affiliate commissions); budget cut 40% in 2025"
        - Medium — sourced from industry tracking data (Marketing Brew, Ampifire, OptiMonk)
        - Largest disclosed line-item variable cost; critical to CAC and contribution margin
        - Disclose total marketing spend as % of revenue; break out by channel
      - - Gross margin (DTC vs. retail blended)
        - "DTC: estimated 55–70% (industry benchmark); Retail (Costco): estimated 12–20%; Blended 2025+: unknown"
        - Low — all estimated; AG1 does not disclose
        - Single most important financial metric for underwriting subscription business quality
        - Provide audited gross margin by channel; disclose COGS and manufacturing cost
    notes: >
      All metrics except ARPU and subscriber count are estimated; AG1 does not publicly disclose gross margin, CAC,
      churn, LTV, or NRR. Estimates use industry benchmarks for DTC supplement brands. Subscriber count is per
