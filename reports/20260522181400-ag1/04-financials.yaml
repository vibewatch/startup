  - id: capital-adequacy-and-financing
    title: Capital Adequacy and Financing
    body: >
      AG1 is a private company with no disclosed cash position, balance sheet, or income statement. The company
      bootstrapped to approximately $100 million in run-rate revenue before taking external capital, demonstrating
      a capital-efficient early phase. Confirmed capital raises include: (1) an initial exempt offering filed with
      the SEC on May 17, 2021 by Athletic Greens International, Inc. (CIK 1862737), with a total offering amount of
      $10.5 million ($9.6 million sold), classified under Rule 506 exemption; (2) a $115 million Series B led by Alpha
      Wave Global in January 2022 at a $1.2 billion pre-money valuation; and (3) a further $115 million raised in
      November 2024 at the same $1.2 billion pre-money valuation. Total confirmed capital raised therefore exceeds
      $230 million.

      The November 2024 $115 million round was stated by AG1 to fund product innovation, expand research efforts,
      and enhance customer experience. AG1's own press release language (reproduced on SignalBase, November 2024)
      stated: "This new infusion of capital will allow us to further innovate our products, expand our research
      efforts, and enhance our customer experience." The stable $1.2 billion pre-money valuation—maintained for
      three years despite 4x revenue growth—represents either investor conservatism, a deliberate pre-exit
      stabilization signal, or a cap table dynamic preventing a fresh markup. CEO Cole told Modern Retail in April
      2026 that AG1 has "its choice of paths" because of profitability, adding: "We fund our own innovation. We have
      funded our own expansion and growth."

      The declared profitability from 2024 forward, if accurate, implies the company is at minimum operationally
      self-funding at the DTC level. However, the $115 million November 2024 raise—coinciding with the retail
      channel build-out requiring working capital for inventory, slotting fees, and retail marketing—suggests
      capital is being deployed at scale. Monthly burn rate, cash on hand, and runway are not publicly disclosed.
      No debt or project finance obligations are disclosed publicly, though these cannot be ruled out given the
      capital intensity of multi-retailer omnichannel expansion.
