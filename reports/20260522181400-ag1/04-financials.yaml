  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: >
        Audited income statement, balance sheet, and cash flow statement for AG1 for fiscal years 2022–2025.
        Without audited financials, gross margin, operating leverage, burn rate, and working capital position
        are entirely inferred from industry benchmarks.
      whyItMatters: >
        Underwriting a $1.2 billion private company without audited financials requires investors to rely solely
        on CEO disclosures and industry comparables, creating asymmetric information risk and preventing validation
        of the profitability claim.
      diligencePath: >
        Request management accounts or audited statements as part of due diligence; obtain at minimum an auditor
        comfort letter covering revenue and EBITDA.
      relatedQuestionRefs:
        - QI003
        - QI004
        - QI020

    - type: private-evidence-only
      severity: material
      topic: churn
      missingEvidence: >
        Monthly and annual subscriber churn rate by acquisition cohort; dollar-based net revenue retention (NRR).
        These are foundational SaaS-like metrics for a subscription business at this scale.
      whyItMatters: >
        LTV varies 60%+ between 3% and 8% monthly churn assumptions. Without churn data, financial model
        assumptions span too wide a range to underwrite valuation with confidence.
      diligencePath: >
        Request cohort retention curves from management; cross-validate with Earnest Analytics or Second Measure
        US debit/credit card panel data for DTC subscription continuity proxies.
      relatedQuestionRefs:
        - QI013
        - QI015

    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: >
        Gross margin by channel (DTC subscription, one-time DTC, Costco, Amazon, Vitamin Shoppe, Target) and
        blended gross margin as retail channel revenue scales in 2025–2026.
      whyItMatters: >
        The retail channel shift is the company's biggest strategic transition. Without margin data by channel,
        the impact on overall profitability cannot be modeled; a business generating 55% DTC margins could blend
        down to 40% or less as retail scales.
      diligencePath: >
        Request P&L by channel in management accounts; obtain retail partner-reported sell-through data and
        wholesale pricing agreements to derive implied manufacturer economics.
      relatedQuestionRefs:
        - QI004
        - QI012

    - type: missing-source
      severity: material
      topic: revenue-2025
      missingEvidence: >
        Full-year 2025 revenue disclosure. As of May 2026, no company statement or reliable press report has
        confirmed AG1's 2025 annual revenue following retail channel launches.
      whyItMatters: >
        Retail launch years frequently show non-linear revenue trajectories (initial stocking orders inflating
        Year 1). Without 2025 figures, it is unclear whether the DTC subscription business sustained growth or
        whether retail is supplementing decelerating DTC subscription revenue.
      diligencePath: >
        Seek CEO interview or investor update for 2025 full-year revenue; monitor earnings from Costco/Target
        for any AG1-category data; track Earnest Analytics US card data for DTC trends.
      relatedQuestionRefs:
        - QI026

    - type: private-evidence-only
      severity: minor
      topic: funding
      missingEvidence: >
        Full terms and conditions of the November 2024 $115 million round, including instrument type (equity,
        convertible note, SAFE), liquidation preference, anti-dilution provisions, and any ratchet or guarantee
        clauses.
      whyItMatters: >
        If the round included ratchets or downside protection at $1.2B valuation, the actual effective valuation
        may differ from the headline; this affects cap table and dilution calculations for any exit.
      diligencePath: >
        Review term sheet and capitalization table in formal due diligence; confirm with Alpha Wave Global
        legal counsel.
      relatedQuestionRefs:
        - QI010
