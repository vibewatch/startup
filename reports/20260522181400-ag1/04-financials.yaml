callouts:
  - calloutType: strength
    title: Subscription-First Revenue Quality
    body: >
      AG1's $79/month subscription model generates recurring, predictable revenue with high switching friction.
      The $20 price premium versus one-time purchase and bundled subscriber gifts structurally favor retention.
      At ~$600M revenue with declared profitability, the business has demonstrated the ability to scale a single
      product through a single channel to material scale, bootstrapping to ~$100M before taking external capital.
      The 2025 Black Friday 40% sales increase despite a 40% marketing budget cut suggests genuine brand momentum
      beyond paid acquisition dependency.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI013

  - calloutType: risk
    title: Financial Opacity Limits Underwriting Precision
    body: >
      AG1 publicly discloses only top-line revenue and a profitability claim—both CEO-stated without audit. Gross
      margin, CAC, churn, LTV, NRR, cash on hand, and burn rate are not disclosed. The stable $1.2B valuation
      (unchanged since January 2022 despite 4x revenue growth) and the simultaneous $115M November 2024 capital
      raise raise structural questions about cap table mechanics and the timing of an exit event. Retail channel
      margin dilution creates additional uncertainty for blended margin projections.
    claimRefs:
      - CI004
      - CI028
      - CI034
      - CI038

  - calloutType: risk
    title: Retail Margin Dilution is a Material Unknown
    body: >
      AG1's 2025–2026 retail expansion introduces structurally lower-margin revenue. Costco pricing
      ($72.99/40 servings = $1.82/serving) is 31% below the DTC subscription per-serving rate ($2.63/serving).
      Club and mass retail gross margins for supplement manufacturers are estimated at 12–20%, versus 55–70% for
      premium DTC. The company has not disclosed revenue split by channel or projected blended margin impact.
      Retail channel investments (slotting fees, retail marketing, inventory) add working capital requirements
      that are not separately disclosed.
    claimRefs:
      - CI005
      - CI008
      - CI027
      - CI028
      - CI031

  - calloutType: risk
    title: FDA Adverse Events and Supply Chain Controversy
    body: >
      The FDA received 118 adverse event reports for AG1 in 2024, including 30+ cases of elevated liver enzymes,
      two life-threatening hospitalizations, and nine inpatient admissions. AG1 dismisses the pattern citing
      per-serving incidence rates, but two independent toxicologists called it a safety signal warranting
      regulatory investigation. Separately, AG1 was found marketing the product as "made in New Zealand" after
      primary manufacturing shifted to Utah, prompting the NZ Commerce Commission to flag likely fair-trading
      violations and AG1 to remove the claim from its website. Both issues carry financial and regulatory
      tail risk material to a diligence assessment.
    claimRefs:
      - CI035
      - CI036
      - CI037

