  - id: TI005
    title: Public Financial Gaps
    columns:
      - Missing Metric
      - Impact on Analysis
      - Exact Diligence Path
    rows:
      - - Audited gross margin (DTC and retail)
        - "Without gross margin, underwriting economics of the subscription business vs. retail pivot is speculative"
        - Request audited P&L or management accounts; benchmark against comparable DTC supplement companies (e.g., OLLY, HUM)
      - - Customer acquisition cost (CAC) and payback period
        - "CAC determines whether $26M+/yr podcast spend is ROI-positive; crucial for retail vs. DTC economics comparison"
        - "Request CAC by channel (podcast, paid social, retail) and LTV:CAC ratio; compare to disclosed influencer spend"
      - - Subscriber churn rate and cohort retention
        - "5% monthly churn assumption vs. 3% or 8% changes estimated LTV by ~60%; directly affects valuation"
        - "Request monthly churn, annual retention curves, and dollar-based NRR; validate against Earnest Analytics transaction data"
      - - Cash on hand and monthly burn
        - "AG1 raised $115M in November 2024 simultaneous with retail expansion; without burn data, runway is unknown"
        - Request audited balance sheet; independently verify via bank reference or management accounts with working capital details
      - - Revenue split by channel (DTC subscription vs. one-time vs. retail)
        - "Retail margin dilution impact is unquantifiable without disclosed channel mix; blended margin modeling impossible"
        - Request channel-level revenue disclosure; obtain retail sell-through data from Costco/Target buyer relationships
    notes: >
      All five gaps are currently unresolvable from public sources. AG1 is a private company and has no obligation
      to disclose financials; however, each gap represents a material input to investment underwriting. Partial
      proxies exist through transaction data aggregators (Earnest Analytics, Second Measure) for US card spend trends,
      but these cover only US domestic DTC channels and exclude retail and international revenue.
    claimRefs:
      - CI004
      - CI034
      - CI038

