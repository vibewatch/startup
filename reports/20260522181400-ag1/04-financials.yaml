chapter:
  number: 4
  title: Financials
  summary: >
    AG1 reported approximately $600 million in annual revenue for 2024—a ~4x increase from $160 million in 2021—and
    declared profitability, figures that are CEO-disclosed without independent audit. The subscription model (pricing at
    $79/month DTC) anchors recurring revenue while a 2025–2026 retail push across Amazon, Costco, Vitamin Shoppe, and
    Target diversifies revenue but introduces structurally lower-margin volume. Marketing spend historically ran ~$2.2
    million per month on podcast advertising alone; a 2025 strategic shift cut the total marketing budget 40% to fund
    four double-blind clinical trials ($10–20 million commitment). Total confirmed capital raised exceeds $230 million
    at a $1.2 billion valuation maintained since January 2022. Key metrics—gross margin, CAC, churn, cash on hand, and
    NRR—are not publicly disclosed, making independent underwriting materially dependent on company self-reporting.

sections:
  - id: revenue-model-and-channel-architecture
    title: Revenue Model and Channel Architecture
    body: >
      AG1's primary revenue engine is its direct-to-consumer subscription model: customers subscribe at $79 per month
      (or pay $99 for a one-time 30-serving bag), creating predictable recurring revenue with high switching friction.
      This single-channel, single-product discipline drove reported revenue from approximately $160 million in 2021 to
      approximately $600 million in 2024—a compound annual growth rate of roughly 56% over three years. CEO Kat Cole
      disclosed both the revenue figure and profitability milestone to Forbes in December 2024; no audited financial
      statements have been released publicly.

      The subscription model generates an estimated annual revenue per user (ARPU) of approximately $948 at the $79/month
      price point. AG1 disclosed approximately 700,000 customers in December 2024 (per the Powder Keg investigation
      citing Ashenden), broadly consistent with the ARPU calculation yielding ~$660 million at full realization—though
      subscription mix, trial users, and partial-year cohorts introduce variance. The DTC channel serves customers in
      North America, Europe, and Asia Pacific through drinkag1.com, with the US representing the largest revenue market.

      Beginning in 2025, AG1 executed its first retail channel expansion in 15 years of operations: Amazon (April 2025),
      Costco (June 2025, 600+ US stores with 40-count stick packs at $72.99), Vitamin Shoppe, and Target (April 2026,
      both AG1 powder and AGZ sleep supplement). CEO Cole explicitly positioned retail as incremental rather than
      cannibalistic, aimed at converting customers unwilling to commit to a $79/month subscription without trial.
      Costco pricing ($72.99/40 servings = $1.82/serving) is 31% below the DTC subscription rate ($2.63/serving),
      signaling a deliberate low-margin trial funnel designed to drive subscription conversion over time. Modern Retail
      (April 2026) reported that the Target launch doubled AG1's total retail door count and brought AGZ to mass retail
      shelves for the first time, with custom end-cap displays and multiple SKUs (7-count, 14-count, and starter kits).
      AG1 also markets a second product, AGZ (melatonin-free nighttime sleep supplement), first launched in 2025.
