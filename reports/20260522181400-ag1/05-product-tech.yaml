  - id: roadmap-and-product-evolution
    title: Roadmap and Product Evolution
    body: >
      AG1 executed a substantial product and channel evolution between 2022 and May 2026. Manufacturing was
      restructured from New Zealand to Utah (2022–2024). The Next Gen reformulation (May 2025) represented the
      first material product upgrade in nine years, including expanded ingredient count, improved probiotic
      specificity, enhanced vitamins and minerals, and four clinical trial endorsements. The AGZ sleep supplement
      (August 2025) opened a second product category. Retail distribution went from zero to 2,700+ physical
      doors across Costco (600+), Target, Vitamin Shoppe (640+), and Ulta Beauty (1,500+) between January 2025
      and May 2026.

      The announced 2030 supply-chain goal is 100% origin traceability for all ingredients via Sourcemap. No
      further product pipeline has been publicly disclosed beyond AGZ, though CEO Kat Cole signaled that
      "saying yes" to new products is a strategic priority for the first time in the company's history. The $20M
      research commitment and the new Science and Innovation Advisory Board suggest that future products will
      be required to pass clinical validation before launch. The absence of a mobile app remains a roadmap gap:
      AG1 has neither announced a dedicated app nor provided a timeline. As of May 2026, the product and
      technology roadmap is largely undisclosed beyond the retail expansion arc and the research pipeline.
      Investors and analysts should treat forward pipeline disclosures as company-claimed and require data-room
      evidence for any pre-revenue product claims.
