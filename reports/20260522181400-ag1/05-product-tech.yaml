callouts:
  - calloutType: strength
    title: "NSF Certified for Sport® and Clinical Trial Investment Signal Genuine Quality Intent"
    body: >
      AG1 is one of the few greens powder brands to carry NSF Certified for Sport® status — recognized by
      USADA, MLB, and NHL — which requires per-batch testing for 280+ banned substances and annual facility
      audits. The May 2025 Next Gen reformulation is backed by four placebo-controlled RCTs: a meaningful
      differentiator in a category where most products rely solely on ingredient-level studies. The $20M
      research commitment and an independent Science Advisory Board formalized in 2026 reflect genuine
      investment in evidence-based product development.
    claimRefs:
      - CE018
      - CE024
      - CE028
      - CE029

  - calloutType: risk
    title: "Single Manufacturer Concentration and Proprietary Blend Non-Disclosure Are Structural Risks"
    body: >
      All AG1 and AGZ production flows through Capstone Nutrition in Ogden, Utah, creating a single-point-of-
      failure risk for a company generating ~$600M in revenue. A facility incident, quality recall, or contract
      disruption would directly impact all revenue. Separately, AG1's proprietary blends (Superfood, Antioxidant,
      Adaptogens) do not disclose individual ingredient dosages, making it impossible for independent scientists
      or consumers to verify dose-response claims for specific botanicals. ConsumerLab identified trace heavy
      metals at below-limit levels — not a safety violation, but an ongoing disclosure gap for a premium-priced
      product competing on transparency.
    claimRefs:
      - CE013
      - CE021
      - CE033
      - CE034
      - CE043

  - calloutType: risk
    title: "Modest Clinical Effect Sizes and Pending Replication Limit Differentiation Durability"
    body: >
      AG1's clinical trials are a marketing differentiator today, but the published results show modest
      effect sizes: selective gut bacteria enrichment without large microbiome diversity shifts, and incremental
      improvements in nutrient biomarkers for healthy adults. Bryan Johnson's public critique and McGill
      University's independent analysis both question whether the observed benefits justify the $79/month price
      for a nutritionally sufficient adult. Company-sponsored trials have not yet been independently replicated.
      If independent replication fails to confirm effect sizes, the clinical differentiation narrative will weaken.
    claimRefs:
      - CE026
      - CE038
      - CE039
      - CE044

