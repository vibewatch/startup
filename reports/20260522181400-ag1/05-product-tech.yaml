  - id: manufacturing-supply-chain-quality
    title: Manufacturing, Supply Chain, and Quality Controls
    body: >
      AG1 completed a multi-year shift of its primary contract manufacturing from Alaron in Nelson, New Zealand,
      to Capstone Nutrition in Ogden, Utah, USA, beginning approximately 2022 and substantially complete by 2024.
      The move triggered approximately 180 job losses in New Zealand and drew scrutiny from Newsroom NZ
      over continued use of "Made in New Zealand" marketing claims during and after the transition. Capstone
      Nutrition is FDA-registered and cGMP-certified, providing complete contract services including blending,
      encapsulation, packaging, and quality documentation. The concentration of all primary manufacturing with
      a single contract partner is a material single-point-of-failure risk.

      Quality assurance is structured around three layers. First, NSF Certified for Sport® requires third-party
      testing of every batch against 280+ banned substances, nutrient label verification, and annual audits of
      manufacturing facilities. NSF International's certification is recognized by USADA, MLB, and NHL.
      Second, AG1 issues batch-specific Certificates of Analysis (COA) covering heavy metals (lead, arsenic,
      cadmium, mercury), microbial contaminants, allergens, pesticides, and residual solvents — available on
      request from the company. Third, cGMP facility compliance provides process and documentation controls at
      the manufacturing level. ConsumerLab independent testing in 2025 found detectable but below-regulatory-limit
      heavy metals in AG1 samples — not unusual for plant-based supplements but a transparency-risk flag. The
      facility's GMP audit reports are not publicly disclosed.

      For supply chain traceability, AG1 partnered with Sourcemap to digitally map 100% of key botanical
      ingredient purchases to manufacturing and 90% of key ingredients to geographic origin, with a target of
      100% origin traceability by 2030. Fulfillment logistics are handled by Stord, a cloud-based third-party
      logistics provider integrated with AG1's ecommerce subscription platform. Stord's partnership (announced
      when AG1 was still "Athletic Greens") enabled rapid scaling of DTC shipments as subscription volume grew.
      AG1 also reported a 12% reduction in measured carbon emissions for calendar year 2024 and provided 17
      million meals to food-insecure children since 2019, both disclosed in the 2025 Impact Report.
