  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: formulation-transparency
      missingEvidence: "Per-ingredient dosage disclosure for each component within AG1's proprietary botanical, adaptogen, and antioxidant blends."
      whyItMatters: "Without disclosed dosages, independent scientists and consumers cannot verify dose-response efficacy of individual ingredients such as ashwagandha, rhodiola, or CoQ10, undermining the credibility of formulation differentiation claims."
      diligencePath: "Request full Supplement Facts with per-ingredient weights in the data room; compare against effective clinical doses from published literature for each adaptogen."
      relatedQuestionRefs: [QE003, QE016]

    - type: missing-source
      severity: material
      topic: manufacturing-concentration-risk
      missingEvidence: "Capstone Nutrition's GMP audit reports, production capacity utilization, and contract terms with AG1, including exclusivity provisions and contingency plans."
      whyItMatters: "Single-manufacturer concentration for a $600M revenue business is a material operational risk; without audit reports and contract terms, the true quality assurance posture and supply continuity risk cannot be assessed."
      diligencePath: "Request Capstone GMP audit reports, FDA 483 inspection history for Capstone facility, AG1-Capstone contract duration and minimum purchase commitments, and backup manufacturing vendor identification."
      relatedQuestionRefs: [QE012]

    - type: missing-source
      severity: material
      topic: independent-critic-documentation
      missingEvidence: "Comprehensive independent analyst or academic documentation of AG1's proprietary blend non-disclosure policy and its impact on verifiability of claims."
      whyItMatters: "AG1's proprietary blend non-disclosure has been criticized by multiple independent analysts (Bryan Johnson, McGill OSS, ConsumerLab) but no systematic policy analysis has been published; this limits the depth of risk assessment."
      diligencePath: "Commission independent formulation analysis; request competitor benchmark disclosures; identify any regulatory actions related to supplement labeling non-disclosure in AG1's markets."
      relatedQuestionRefs: [QE028]

    - type: missing-source
      severity: material
      topic: clinical-evidence
      missingEvidence: "Independent replication of AG1's four company-sponsored RCTs by external research groups not funded by AG1."
      whyItMatters: "Company-sponsored trials in the supplement industry carry inherent confirmation bias risk; without independent replication, clinical differentiation claims cannot be treated as definitive for investor or regulatory purposes."
      diligencePath: "Monitor PubMed and ClinicalTrials.gov for registered trials from non-AG1-affiliated investigators; request AG1's full protocol and data-room access for all four RCTs."

    - type: missing-source
      severity: minor
      topic: technology-platform
      missingEvidence: "Confirmed technology stack for AG1's DTC ecommerce and subscription management (Shopify, Recharge, or other platforms); no public disclosure from AG1."
      whyItMatters: "Understanding the tech stack matters for assessing platform switching costs, subscription churn tooling, and the feasibility of a future mobile app."
      diligencePath: "BuiltWith.com technology profile of drinkag1.com; request technology vendor list in data room."

    - type: private-evidence-only
      severity: minor
      topic: product-pipeline
      missingEvidence: "AG1's forward product pipeline beyond AGZ and any planned reformulation cadence post-Next Gen."
      whyItMatters: "AG1 has signaled it intends to launch more products, but no timeline or concept has been disclosed; the value of the science and clinical infrastructure depends on future product cadence."
      diligencePath: "Request multi-year product roadmap and R&D budget allocation plan in the data room."

