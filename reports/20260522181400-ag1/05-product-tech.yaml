chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    AG1 delivers two core products as of May 2026: the AG1 Next Gen greens powder (83 ingredients, 13g scoop,
    launched May 2025 with four placebo-controlled RCTs) and AGZ, a melatonin-free sleep supplement launched
    August 2025 — its first new product in fifteen years. Manufacturing shifted from Alaron (New Zealand) to
    Capstone Nutrition (Utah, USA) by 2024, and NSF Certified for Sport® provides third-party batch testing
    against 280+ banned substances. Supply-chain traceability is embedded via Sourcemap (90% of key botanicals
    traced to origin). AG1 has no mobile app; its subscription operates through a web-only DTC portal. Proprietary
    blend non-disclosure and single-manufacturer concentration remain key product-risk flags.

sections:
  - id: product-portfolio-and-formulation
    title: Product Portfolio and Formulation Science
    body: >
      AG1 operates a two-product portfolio as of May 2026. The flagship AG1 daily greens powder underwent its
      first major reformulation in nine years in May 2025 ("Next Gen"), expanding from 75 to 83 active ingredients,
      increasing the serving scoop from 12g to 13g, and adding choline, molybdenum, boron, and a methylated
      B-vitamin complex for improved bioavailability. The Next Gen formula is available in four flavors (Original,
      Citrus, Berry, Tropical) and ships in 30-day bags and single-serve travel sticks.

      The formulation is organized into five functional complexes: a Superfood and Prebiotic blend (~7,400mg
      total weight), an Antioxidant Complex featuring green tea and grape seed extracts, an Adaptogens and
      Botanicals blend (including ashwagandha, rhodiola, reishi mushroom), a Digestive Support blend (bromelain,
      papain, slippery elm), and a targeted Probiotic blend featuring five clinically studied strains — Lactobacillus
      rhamnosus GG, L. acidophilus NCFM, B. lactis HN019, L. casei LC-11, and L. plantarum LP-115. Vitamins
      and minerals are fully disclosed on the Supplement Facts panel; proprietary blend ingredient dosages are
      not individually disclosed, which limits third-party efficacy verification.

      AGZ, launched August 2025, is a nighttime powder supplement containing Magtein® magnesium L-threonate,
      ashwagandha, saffron, L-theanine, and valerian root, with no melatonin. Both AG1 and AGZ are NSF Certified
      for Sport®, vegan, gluten-free, and dairy-free. AGZ is available in Chocolate, Chocolate Mint, and Mixed Berry.
      At $79/month (or $99 one-time), both products are priced identically to the original AG1 subscription.
      AG1's broader SKU strategy includes 7-count and 14-count trial packs and an AG1 Starter Kit designed for
      retail discovery at Ulta Beauty and other channels.

      The product architecture is differentiated relative to commodity greens powders by three factors: NSF
      Certified for Sport® status (requiring third-party batch testing for 280+ banned substances), the company's
      $20 million clinical research commitment (4 finished-product RCTs for Next Gen), and a formulation science
      team led by Chief Science and Nutrition Officer Dr. Ralph Esposito. Gaps include undisclosed proprietary blend
      dosages, limited published data on AGZ as a finished product, and no disclosed IP (patents) backing the
      formulation. Adaptogens and functional mushrooms are included at blend-level weights with no individual
      dose confirmation, making their contribution to measurable outcomes unverifiable from available sources.
