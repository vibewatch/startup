  title: Regulatory / Legal Risk Register
  layout: wide
  enumerationScope:
    coverage: exhaustive
    basis: 'All confirmed and credibly threatened regulatory, legal, and enforcement proceedings identified
      through public sources as of May 2026, spanning FDA, FTC, NZ Commerce Commission, NZ MPI, California
      courts, and consumer arbitration proceedings.

      '
  columns:
  - Rule / Case / License
  - Jurisdiction
  - Status
  - Likelihood of Adverse Outcome
  - Severity
  - Mitigation
  rows:
  - - FDA adverse event review (118 AERs, liver injury signal)
    - USA (FDA / CFSAN / HFP)
    - Under active review since late 2024; no enforcement action issued as of May 2026
    - Medium — no confirmed causation; AERs alone insufficient for enforcement
    - Critical — mandatory recall or reformulation would disrupt all revenue
    - Company-funded 12-wk RCT found no hepatic impact in healthy adults; NSF cert; safety consultant
  - - FTC health-claim scrutiny (unsubstantiated efficacy marketing)
    - USA (FTC)
    - No enforcement action filed; TruHeight analog settlement April 2026 signals appetite
    - Medium — FTC actively enforcing against supplement health claims category
    - High — could require marketing overhaul, disgorgement, civil penalty
    - Shift to double-blind RCTs; reduced influencer marketing; DSHEA structure/function claims review
  - - Hoke v. AG1 (USA), Inc. auto-renewal class action (C.D. Cal.)
    - USA (California Federal)
    - Active as of May 2026; filed February 2026; no settlement reported
    - Medium-High — California ARL class actions frequently settle pre-trial
    - High — injunctive relief plus restitution for all California subscribers
    - Arbitration clause covers most DTC purchasers; Amazon purchasers potentially exempt
  - - Deceptive nutrition claims — arbitration demands (AAA)
    - USA (AAA Arbitration)
    - Draft arbitration demands filed May 2025; not yet formally adjudicated
    - Medium — arbitration clause limits class risk; individual awards typically small
    - Medium — reputational damage plus aggregate financial exposure at scale
    - Arbitration clause; ongoing RCT investment to build future claims substantiation
  - - NZ Commerce Commission — Made in NZ Fair Trading Act exposure
    - New Zealand (Commerce Commission and MPI)
    - Commission monitoring; declined formal action for now but reserved right to act
    - Low-Medium — complex jurisdiction; NZ market share minimal for AG1
    - Medium — reputational harm and potential fine if formal action taken
    - Production predominantly in Utah since 2022; marketing updated after scrutiny
  - - California Proposition 65 / lead contamination
    - USA (California Prop 65)
    - Prop 65 warning already in place; ConsumerLab April 2025 flagged elevated lead
    - Low-Medium — Prop 65 warning on label; no formal civil penalty action
    - Medium — recall or heightened order if levels violate USP or NSF limits
    - NSF certification; third-party batch testing; Sourcemap traceability; prior 2015 settlement
  notes: 'Likelihood and severity are author qualitative assessments based on publicly available evidence
    as of May 2026; this is not a legal opinion. Enumeration is exhaustive for publicly known proceedings;
    undisclosed regulatory correspondence or private settlements may exist. Note: SR013 and SR016 are
    company-affiliated sources.

    '
