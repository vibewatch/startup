chapter:
  number: 7
  title: Risks
  summary: 'AG1 faces a severity-ranked risk stack led by regulatory and legal exposure: the FDA is actively
    reviewing 118 adverse event reports including liver-injury cases, consumer class actions and arbitration
    demands challenge subscription billing and health-claim completeness, and the New Zealand Commerce
    Commission has flagged potential Fair Trading Act exposure over misleading origin claims. Manufacturing
    concentration on a single US contract manufacturer (Capstone Nutrition) and a 75-plus-ingredient proprietary
    formula dependent on 100+ global suppliers create supply-chain fragility. Subscription churn at industry
    benchmarks of roughly 9% monthly, aggressive competitor price undercutting, and a founder who remains
    on the board despite criminal convictions all raise residual execution and reputational risk. Mitigations
    include NSF Certified for Sport status, $10M+ committed to four RCTs, Sourcemap supply-chain traceability
    integration, and new CEO Kat Cole''s credible operational leadership.

    '
sections:
- id: regulatory-legal-risk
  title: Regulatory and Legal Risk
  body: 'AG1 operates in the US dietary supplement market under the Dietary Supplement Health and Education
    Act (DSHEA) of 1994, which does not require pre-market FDA approval for supplements. Manufacturers
    bear primary responsibility for safety and labeling prior to sale, and the FDA acts post-market when
    adulteration or misbranding is alleged. This framework creates latent regulatory risk: AG1 can be
    sold and marketed with minimal pre-launch scrutiny, but any credible adverse event pattern can trigger
    FDA investigation, public warning, or in extreme cases mandatory recall.

    The FDA''s Center for Food Safety and Applied Nutrition received 118 adverse event reports linked
    to AG1 in 2023 and 2024, of which more than 30 documented elevated liver enzymes or liver injury,
    9 cases required hospitalization, and 2 were classified as life-threatening. The FDA began a formal
    review at the end of 2024. Although adverse event reports do not prove causation, peer-reviewed toxicologists
    at Canterbury University and the University of Hertfordshire publicly called for regulatory investigation.
    Green tea extract, an ingredient in AG1, is associated in the literature with rare hepatotoxicity
    in susceptible individuals.

    AG1''s marketing claims that it supports whole body health, delivers optimal amounts of nutrients,
    and is evidence-based draw FTC scrutiny. The FTC prohibits supplements from making unsubstantiated
    disease-prevention or treatment claims, and its competent and reliable scientific evidence standard
    has been a basis for enforcement. AG1''s first published clinical trial in 2024 enrolled only 30 participants
    over four weeks and was criticized by Harvard Medical School professor Dr. JoAnn Manson as lacking
    rigor. In 2025, the FTC settled with supplement company TruHeight for deceptive health claims and
    fake reviews, demonstrating active enforcement appetite.

    In February 2026, class-action plaintiffs filed Hoke v. AG1 (USA), Inc. in the Central District of
    California, alleging AG1 unlawfully enrolled consumers in auto-renewing subscriptions without clear
    consent and made cancellation unreasonably difficult, violating California''s Automatic Renewal Law,
    Unfair Competition Law, Consumer Legal Remedies Act, and False Advertising Law. Separately, arbitration
    demands filed in May 2025 allege AG1 misrepresented its product as providing comprehensive nutrition
    when it lacks key nutrients including iron, vitamin D, and omega-3 fatty acids. AG1''s terms of service
    route most individual disputes to binding arbitration, though Amazon purchasers may bypass this clause.

    The New Zealand Commerce Commission flagged that AG1''s continued use of Made in New Zealand marketing
    as late as May 2024, after production shifted to Utah, would likely breach the Fair Trading Act if
    confirmed. NZ''s Ministry for Primary Industries also initiated a separate inquiry. AG1 lead content
    triggers California Proposition 65 warnings; the company''s own published heavy metals specification
    allows up to 4.56 micrograms lead per scoop, approximately nine times Prop 65''s 0.5 microgram per
    day safe harbor, though NSF Certified for Sport status confirms the product meets separate USP limits.

    '
