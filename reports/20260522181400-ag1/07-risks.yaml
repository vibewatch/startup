- id: operational-quality-safety-risk
  title: Operational, Quality, and Safety Risk
  body: 'AG1''s formula contains 75 to 83 ingredients sourced from more than 100 global suppliers spanning
    botanical, mineral, probiotic, and adaptogen categories. Each batch must meet NSF Certified for Sport
    standards for purity, accurate labeling, and absence of banned substances, requiring comprehensive
    batch testing and documented supply chain provenance. This complexity creates multiple failure modes:
    contamination at any supplier tier, label inaccuracy for any of the 75-plus ingredients, heavy-metal
    uptake from soils or manufacturing equipment, or probiotic viability degradation during shipping.

    The FDA''s open investigation into liver-injury adverse events is the most immediate safety risk.
    While AG1''s company-funded 12-week RCT in 120 healthy adults found no negative impact on hepatic
    markers, the study design using healthy adult volunteers under controlled diet does not represent
    the broader consumer population, and the real-world adverse event signal remains unexplained. Green
    tea extract''s known hepatotoxicity risk in susceptible individuals is a plausible biological mechanism.
    If the FDA concludes a safety signal exists, potential remedies range from voluntary labeling changes
    to mandatory reformulation or product removal.

    Lead contamination is a continuing operational and reputational risk. ConsumerLab in April 2025 flagged
    significant lead and heavy-metal content in AG1 after independent testing, noting levels unsuitable
    for children and pregnant women. The 2015 settlement over lead levels demonstrates this risk has materialized
    before. AG1''s Sourcemap partnership and commitment to 100% digital ingredient traceability by 2030
    is a positive mitigation, but n-tier traceability is still incomplete and raw material substitution
    by any supplier could introduce new contaminants.

    A former AG1 employee in 2020 alleged the company shipped ingredients that appeared moldy and terminated
    his employment after he raised the concern. The claim was not publicly adjudicated, but it illustrates
    the quality-system risk inherent in managing a 75-plus ingredient formula across a global supply base.
    AG1 has never publicly disclosed a product recall; its NSF certification requires ongoing facility
    audits and batch testing, which provides meaningful quality assurance above the industry average.

    '
