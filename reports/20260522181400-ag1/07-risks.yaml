- id: people-execution-risk
  title: People and Execution Risk
  body: 'Chris Ashenden''s continued presence on AG1''s board of directors represents a persistent governance
    and reputational risk. Ashenden was convicted in 2011 of 43 criminal breaches of New Zealand''s Fair
    Trading Act for operating rent-to-buy property schemes in which buyers lost deposits and improvements
    because title was never transferred. Courts ordered $182,000 NZD in reparations; these were ultimately
    cancelled when his companies were wound up without full payment to victims. Ashenden is believed to
    remain the majority shareholder, meaning the board cannot remove him and his business judgment continues
    to influence company direction. His initial denial of the convictions raises concerns about information
    asymmetry and governance integrity for investors and staff.

    CEO Kat Cole has strong consumer-brand credentials, and her appointment was genuinely stabilizing.
    Black Friday 2025 sales reportedly grew 40% year-over-year under her leadership. However, her tenure
    started only in July 2024, her mandate to build scientific credibility is in direct tension with AG1''s
    legacy of influencer-first marketing, and her ability to drive retail and product diversification
    strategy while simultaneously managing multiple legal and regulatory investigations is operationally
    demanding. Her departure would be a significant risk event given limited brand-trusted executive depth
    below her.

    AG1 operates as a remote-first organization with approximately 300 employees across 20-plus countries.
    Remote-first structures create challenges in culture, quality control, supplier management, and regulatory
    response speed. The company''s regulatory and legal response function must now simultaneously manage
    FDA adverse event review, class action litigation in California, arbitration demands, NZ Commerce
    Commission attention, and planned clinical trials. A product safety crisis requiring rapid consumer
    communication would stress AG1''s organizational bandwidth significantly.

    '
