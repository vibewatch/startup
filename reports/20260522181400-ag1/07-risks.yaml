callouts:
- calloutType: risk
  title: FDA Adverse Event Investigation Is the Headline Risk
  body: 'With 118 adverse event reports (30-plus liver injury cases, 9 hospitalizations, 2 life-threatening)
    submitted to the FDA in 2023-2024 and an active investigation underway, AG1 faces a tail risk scenario
    where a causation determination triggers mandatory reformulation or product removal. This risk is
    currently classified medium-likelihood but critical-impact. No enforcement action has been issued
    as of May 2026; the company-funded 12-week RCT in healthy adults found no hepatic impact, but this
    study design does not address the susceptible population where adverse events were reported. Diligence
    must include the complete FDA correspondence file.

    '
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR028
- calloutType: risk
  title: Capstone Nutrition Single-Source Dependency Is an Unmitigated Structural Risk
  body: 'AG1''s decision to consolidate manufacturing at Capstone Nutrition from Alaron NZ has replaced
    geographic diversification with single-source concentration. No backup manufacturer is publicly identified.
    For a 75-plus ingredient formula with stringent NSF and cGMP requirements, qualifying an alternate
    contract manufacturer would require an estimated 6-18 months and could result in formula-integrity
    questions. This dependency has never been stress-tested in practice.

    '
  claimRefs:
  - CR017
  - CR018
  - CR019
  - CR025
- calloutType: recommendation
  title: Eight Priority Diligence Items Before Commitment
  body: 'The highest-value diligence asks are: full FDA adverse event file and SafetyCall toxicology opinion
    under NDA; complete litigation and arbitration exposure summary; Capstone Nutrition contract covering
    exclusivity, IP ownership, and termination provisions; DTC cohort retention data showing monthly churn
    by vintage; retail sell-through data within three months of launch; four RCT protocols and interim
    results; board governance documentation covering Ashenden''s role and shareholder rights; and NZ regulatory
    correspondence from Commerce Commission and MPI.

    '
  claimRefs:
  - CR001
  - CR009
  - CR017
  - CR019
  - CR029
- calloutType: insight
  title: Retail Expansion Signals DTC Plateau, Not Channel Strength
  body: 'Multiple independent sources indicate AG1''s retail push into Costco, Amazon, and Target is a
    defensive response to DTC subscriber growth stagnation. If retail cannibalizes DTC subscriptions,
    which typically carry 2-3 times the lifetime value of single retail purchases, the net financial impact
    of the channel shift could be negative despite volume growth. Investors should demand granular sell-through
    and DTC migration data before accepting the retail expansion as a net-positive revenue catalyst.

    '
  claimRefs:
  - CR026
  - CR027
  - CR029
  - CR030
