      - number: '2.5'
        title: 市场约束与采用风险
        blocks:
          - type: paragraph
            body: >
              在有利结构性背景下，AG1 仍面对四个持续约束，限制其可触达市场和高端定价的可持续性。

              消费者怀疑是最尖锐的近期约束。补充剂 DTC 品牌的冷流量转化率在电商中处于低位，因为信任门槛很高——消费者必须相信一款每月 $79 的粉剂 明显优于 $10 的 CVS 复合维生素。2026 年 1 月
              Bryan Johnson（Blueprint）与 AG1 的公开争议把可信度风险具体化： Johnson 认为 AG1 临床试验（30 名参与者、4 周）显示血液生物标志物相较安慰剂没有显著变化，且产品最多只值
              $30。 AG1 引用既往 RCT 和营养状态改善发现反驳这一说法，但争论公开发酵，强化了底层疑虑。包括 McGill University Office for Science and Society 和
              Columbia University Institute of Human Nutrition 在内的学术批评者认为，AG1 成分——适应原、大多数益生菌、超级食物混合物——
              缺乏强随机临床证据，且多数目标消费者并不存在需要每月 $79 产品解决的营养缺乏。2022 年 JAMA 对 84 项研究的元分析发现，
              复合维生素补充与预防癌症或心血管疾病「几乎没有或没有益处」相关，直接削弱该品类的临床前提。

              监管约束是结构性的。根据 DSHEA（1994），膳食补充剂不需要 FDA 上市前批准；健康声称被限制在结构 / 功能语言。 该框架一方面允许 AG1
              进入市场，另一方面限制其能作出的疾病预防声称强度。Balance of Nature 因涉嫌夸大治疗益处在 2023 年与 California 达成 $1.1M 消费者保护和解，说明执法风险真实存在。随着
              AG1 扩大零售覆盖、触达比核心播客订阅用户更广且参与度更低的受众， 公司必须谨慎校准临床信息。

              高端价格饱和是中期风险。Bloom Nutrition、Organifi 和数十种白标绿粉以大体相似的成分配置，把 AG1 每月 $79 的价格压低 50–60%。
              随着品类增长、消费者教育提高，比价购物会加剧。AG1 的差异化依托品牌信任、NSF 认证、临床投入和社区——这些因素有韧性，但并非不可攻破。 流失率（AG1 未披露）是关键未知数。

              最后，市场饱和信号——2013 至 2023 年美国补充剂行业发生 776 起 FDA 产品召回、Amazon 上假冒问题高发——制造了环境性不信任，
              尤其影响线上优先品牌。被低质量补充剂伤害过的消费者可能形成一概怀疑。AG1 的第三方认证（NSF Certified for Sport）直接回应这一点， 但公司必须在每个获客触点维持并清楚传达认证。
