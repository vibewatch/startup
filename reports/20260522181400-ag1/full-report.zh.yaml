  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 取值
      - 依据
    rows:
      - - 建议
        - 观察
        - 收入规模和品牌护城河已确认；财务不透明使买入结论站不住
      - - 信心
        - 中
        - 多个公开数据支撑的可比样本；收入数字仅由 CEO 披露，未经审计
