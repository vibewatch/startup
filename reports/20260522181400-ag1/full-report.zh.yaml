      - number: '6.2'
        title: 采用轨迹与零售扩张
        blocks:
          - type: paragraph
            body: >
              AG1 报告 2024 全年收入约 $600 million，高于 2021 年约 $160 million，接近 4× 增长；主要驱动因素是 DTC
              订阅增长、达人驱动获客和产品价值感知。公司没有披露订阅用户数、月活用户或 ARPU。收入是衡量采用规模最可靠的代理指标。截至 2025 年，drinkag1.com 首页引用了超过 60,000
              条五星评价，但该数字由公司提供，未经独立平台验证。

              2025–2026 年，零售扩张显著提速。AG1 于 2025 年进入 Costco 门店，这是 15 年纯 DTC 运营后的首次实体零售发布，40 条装条包覆盖 600+ 网点。2026 年 1 月，The
              Vitamin Shoppe 全国上线，把分销扩至 640+ 家专业营养门店。2026 年 4 月 14 日，AG1 登陆所有 Target 门店和 Target.com，推出 7 条装、14 条装以及 AG1
              Start Here Kit（摇摇杯 + 习惯追踪器），标志着进入大众零售。AG1 也已在 Amazon 上架，带有「Amazon's Choice」标签，并通过 Subscribe & Save 折扣销售。

              转向零售既是增长机会，也是结构性转型。AG1 用 14 年优化 DTC 订阅漏斗，拥有高平均订单价值、生命周期邮件 / SMS
              流和取消挽留干预。零售带来更低的单件毛利、更少的客户数据捕获，也让公司依赖零售伙伴执行。动销数据、零售到订阅转化率和零售渠道单位经济均未公开披露。
