      - number: '1.2'
        title: 创始人、领导层与关键人物风险
        blocks:
          - type: paragraph
            body: >
              Chris Ashenden 于 2010 年 12 月在新西兰创立 Athletic Greens（现 AG1），并担任 CEO 至 2024 年 7 月。 Ashenden
              以狭窄的产品和渠道聚焦、播客影响者营销以及订阅优先模式，把品牌从自举创业公司推成独角兽。 他退出日常运营，源于 Newsroom NZ 的「Powder Keg」播客调查；调查披露其在新西兰有严重刑事记录：
              Ashenden 因租购房产骗局 43 次违反新西兰 Fair Trading Act 被定罪，买家因产权从未转让而损失押金和装修投入。 法院判令其已清算公司支付 $182,000
              赔偿——这笔赔偿仍未支付。最初否认定罪后，Ashenden 承认过往，并在辞任 CEO 后继续留在 AG1 董事会。 他的持续董事席位构成残余关键人物和声誉风险。

              Kat Cole 是资深消费品牌高管，曾在 Focus Brands（Cinnabon、Auntie Anne's、Moe's 和 Carvel 的母公司）任职约十年并担任总裁兼 COO； 2021 年 12
              月，她以总裁兼首席运营官身份加入 AG1。2024 年 7 月 24 日，Cole 被任命为 AG1 CEO，并带领公司完成首次重大产品多元化 （AGZ 睡眠补充剂）和渠道扩张（零售）。Cole 具备把消费品牌从
              DTC 扩展到全渠道的经验，正好对应 AG1 当前执行的战略转型。

              前 YETI CMO Paulie Dery 于 2024 年 8 月加入担任首席营销官，任务是降低 AG1 对播客赞助的重度依赖、让营销更多元。 Dr. Ralph Esposito 于 2025
              年获任首席科学与营养官，为公司 $20M 研究承诺配备正式科学领导。Sam Diacos 担任 CFO。 自 2021 年以来，高管团队已大幅重组并引入职业运营者，降低但未消除创始人关键人物风险。Cole
              作为关键公众面孔和战略推动者， 也形成了新的关键人物依赖集中。
