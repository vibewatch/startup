      - number: '1.3'
        title: 融资、估值与投资人
        blocks:
          - type: paragraph
            body: >
              AG1 在首次接受外部投资前，已靠自举做到约 $100M 年化收入。公司首轮股权融资金额未披露，于 2021 年 7 月完成， 由 SC.Holdings 领投，名人投资者 Hugh Jackman、Cindy
              Crawford、Tim Ferriss 和 Dr. Peter Attia 参与。 这是公司 11 年历史中首次引入外部股权资本。

              公司最重要的风投里程碑发生在 2022 年 1 月 25 日：AG1 完成由 Alpha Wave Global 领投的 $115M Series B。 该轮按 $1.2B 投前估值定价，使 AG1
              成为独角兽。新董事 Rick Gerson（Alpha Wave Global 董事长）和 Mark Vadon （Zulily、Blue Nile 创始人；Chewy 前董事长）随投资加入董事会。老股东包括
              SC.Holdings、David Blitzer 的家族办公室 Bolt Ventures 以及 Dr. Peter Attia。该轮还吸引了大量体育、媒体和商业名人天使投资人。AG1
              将资金投向品牌营销、研发、 产品改进和全球供应链建设。

              2024 年 11 月，AG1 宣布第二笔 $115M 融资，仍由 Alpha Wave Global 领投，并维持同一 $1.2B 投前估值。 SignalBase 的融资公告（2024 年 11 月 12
              日）确认该轮融资，并指出资金将用于产品创新、研究扩展和客户体验改进。

              已知各轮累计确认融资超过 $230M（不含 2021 年 7 月未披露金额）。二级交易、债务或信贷安排均未获公开确认。 AG1 仍是私营公司，尚未公布 IPO 时间表。
