      - number: '3.5'
        title: 渠道与获客竞争动态
        blocks:
          - type: paragraph
            body: >
              AG1 十年来依赖播客赞助，这是它的主要增长引擎，也在健康、养生和效率类听众中建立了鲜明的营销身份。深度植入——主播亲自背书，而不是标准广告口播——让品牌信誉规模化。但这种打法越来越容易被复制：Bloom 借助
              Instagram 和 TikTok 打出类似社区，用达人驱动模型触达更年轻、女性占比更高的人群；Organifi 依托 YouTube 和邮件优先的 DTC 营销；Huel 则投入效果型数字渠道。

              分销上，AG1 2025 年进入 Costco（600+ 家美国门店）、Target 和 Vitamin Shoppe，是一次高风险押注：AG1 相信品牌强到可以在零售端支撑 $79–99
              的价格，而零售端的冲动购买要和旁边的 Amazing Grass（$26.99）、Bloom（约 $35）以及潜在自有品牌替代品（$15–20）同架竞争。Bloom 已经借助 Nutrabolt 的 Keurig
              Dr Pepper 销售基础设施，在 Target 和 Walmart 获得广泛零售覆盖；大众零售分销上，AG1 才刚开始追赶这一结构性优势。Organifi 专门进入 Sprouts 和 600+ 家 CVS
              门店，瞄准偏好有机和洁净标签产品的专业健康零售买家。

              Ka'Chava 作为代餐产品在 Costco 和 Target 上架，限制了直接比价，但也说明 Costco 买家已经面对多个具备资质、价位各异的健康消费选择。AG1
              零售扩张的净效果，是触达更多新买家，同时也带来更强的比价压力，可能削弱过去支撑 AG1 定价权的纯 DTC 品牌溢价。
            claimRefs:
              - CP016
              - CP017
              - CP018
              - CP019
              - CP020
              - CP039
      - number: '3.6'
        title: 证据附录
        blocks:
          - type: callout
            title: NSF Certified for Sport 认证构成可验证、稀缺的信任锚
            body: >
              在直接竞争的日用绿粉和全合一营养品品牌中，AG1 是唯一持有 NSF Certified for Sport 状态的品牌；该认证会按严格标准核验违禁物质第三方检测、标签准确性和纯度。截至 2026 年 5
              月，Bloom、Ka'Chava、Organifi 和 Amazing Grass
              都没有同等的具名认证。运动员、军人、大学体育和重视安全的买家会把它视为可防守的信任信号——这一客群愿意支付溢价，也能带来高质量口碑。机构和雇主赞助的健康项目采购中，这也是重要差异化。
            calloutType: strength
            claimRefs:
              - CP025
          - type: callout
            title: 与低价竞品同架销售，制造结构性比价压力
            body: >
              AG1 2025 年进入 Costco 和 Target 后，$79–99 的产品会直接摆在 Amazing Grass（$26.99/30 份）、Bloom Nutrition（约 $35/30
              份）以及潜在自有品牌绿粉（$15–20）旁边。第一次在线下购买、又不熟悉 AG1 品牌故事的买家——这些故事通常靠长播客内容传递——很难在货架前为 3–5×
              价差找到理由。零售扩张带来销量机会，但也同时削弱了过去存在于纯 DTC、内容优先销售漏斗里的高端定价权。
            calloutType: risk
            claimRefs:
              - CP023
              - CP024
              - CP036
          - type: callout
            title: 2026 年独立营养师评测持续推荐更便宜的 AG1 替代品
            body: >
              2026 年，多家注册营养师评测媒体发布内容——包括 Top Nutrition Coaching、V Nutrition and Wellness、Live it Up、The Quality Edit 和
              Freak Naturals——认为 AG1 定价过高，并推荐 Bloom、Huel Daily Greens、Live it Up Super Greens 和 Amazing Grass
              作为更划算的替代品。虽然其中几家媒体与竞品存在联盟分销关系（这是重要利益冲突），但 2025–2026 年独立专家意见的数量和一致性，仍然对 AG1
              在新买家中的价值感知构成真实反向信号；这些买家首次购买前会浏览搜索和社交媒体里的比较内容。
            calloutType: risk
            claimRefs:
              - CP031
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与渠道架构
        blocks:
          - type: paragraph
            body: >
              AG1 的主要收入引擎是直面消费者（DTC）订阅模式：客户每月订阅价为 $79（或一次性购买 30 份装袋装产品，价格 $99），带来可预测的经常性收入和较高切换摩擦。单渠道、单产品的纪律，把披露收入从 2021
              年约 $160 million 推到 2024 年约 $600 million，三年复合年增长率约 56%。CEO Kat Cole 2024 年 12 月向 Forbes
              披露了收入数字和盈利里程碑；公司尚未公开发布经审计财务报表。

              按 $79/月价格测算，订阅模式产生的每用户年收入（ARPU）估计约为 $948。AG1 2024 年 12 月披露约 700,000 名客户（据 Powder Keg 调查援引 Ashenden 的说法），与
              ARPU 完全兑现时约 $660 million 的计算大体一致——但订阅组合、试用用户和未满全年队列会带来波动。DTC 渠道通过 drinkag1.com 服务北美、欧洲和亚太客户，其中美国是最大收入市场。

              2025 年起，AG1 在运营 15 年后首次扩张零售渠道：Amazon（2025 年 4 月）、Costco（2025 年 6 月，600+ 家美国门店，40 条装条包售价 $72.99）、Vitamin
              Shoppe，以及 Target（2026 年 4 月，同时上线 AG1 粉剂和 AGZ 睡眠补充剂）。CEO Cole 明确把零售定位为增量渠道，而不是蚕食渠道，目标是转化那些不愿在试用前承诺
              $79/月订阅的客户。Costco 定价（$72.99/40 份 = $1.82/份）比 DTC 订阅价（$2.63/份）低 31%，说明公司刻意设计了低毛利试用漏斗，长期导向订阅转化。Modern
              Retail（2026 年 4 月）报道，Target 上线让 AG1 的零售门店总数翻倍，并首次把 AGZ 带入大众零售货架，配有定制端架陈列和多个 SKU（7 条装、14 条装和入门套装）。AG1
              还销售第二个产品 AGZ（不含褪黑素的夜间睡眠补充剂），该产品于 2025 年首次推出。
