      - number: '6.3'
        title: 具名客户证据与证言
        blocks:
          - type: paragraph
            body: >
              AG1 是消费者补充剂，不是 B2B 软件产品，因此「具名客户」表现为个人消费者证言、运动员关系和独立专家评测，而不是机构采购记录。评测生态中的证据质量参差不齐：截至 2025 年 11 月，Trustpilot
              约 1,430 条已验证评价给出 4.2/5（「Great」），并有摘录显示真实互动（多条正面和负面原文评价公开可见）。Innerbody 独立小组在花费 70+ 小时测试成分、安全性和功效后给出
              4.5/5。Healthline 编辑测试者 Christy Snyder（38 岁）试用了该产品，并每天使用约一个月，报告口味可接受且指甲生长有明显变化——这与维生素 / 矿物质补充效果一致。Forbes
              Health 作为可信独立评测者，将其总结为「忙碌生活方式人群或旅行者的一个可靠选择」。

              AG1（Las Vegas, NV）的 BBB 档案为 D- 评级，且未获认证。过去三年中，它只列出两条客户评价和一条投诉，均涉及订阅管理困难（取消和未披露注册）。这一反向信号绝对量很小，但方向上与
              Trustpilot 关于订阅计费和地址变更的投诉一致。UsefulVitamins 汇总了 Reddit（r/supplements、r/AG1、r/nutrition）和 Trustpilot 上 200+
              条用户报告，发现接受药检的运动员满意度最高，价格敏感买家满意度最低。WellnessPulse 评测提示了 2022 年 ConsumerLab 铅检出（此后已改配）以及专有混合物不透明的持续担忧。

              运动员背书存在，但属于品牌合作安排：Cam Smith（LIV Golf）是 AG1 官方营养合作伙伴，AG1 也赞助 LIV Golf Ripper GC
              队。这些是合作伙伴证明，而不是独立客户证据。Innerbody、Healthline、Forbes Health 和 Fortune 等独立专家评测，提供了最强的多源印证，说明目标客群确实接受 AG1。
