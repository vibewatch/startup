      - CV007
      - CV038
  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 论点
      - 证据
      - 哪些证据会改变判断
    rows:
      - - 收入规模和资本效率极突出
        - 2024 年披露收入 $600M；2021–2024 年 CAGR 56%；外部融资前自举做到 $100M
        - 审计后下修，或发现激进收入确认证据，会削弱该点
      - - 品牌护城河和订阅粘性耐久
        - 15 年播客 / 影响者整合；NSF Certified for Sport；订阅价比一次性购买每月低 $20
        - 月流失率超过 7%，或经验证 NRR 低于 85%，会削弱投资逻辑
      - - 品类已验证快消并购溢价
        - Grüns 2026 年 4 月被 Unilever 以约 $1.2B 收购（约 4x 收入）；补充剂并购在 12–18x EBITDA
        - 软糖、胶囊等竞争形态若规模化胜出，会压缩战略溢价
      - - 公司声明 2024 年开始盈利
        - CEO Kat Cole 2024 年 12 月接受 Forbes 采访；公司称营销削减 40%，Black Friday 销售仍增长 40%
        - 审计若显示经营亏损或高债务服务，会推翻该逻辑
      - - 没有经审计财务——不透明是根本风险
        - 没有任何公开经审计财务报表；SEC 记录只有一份 2021 年 Form D
        - 自愿披露 FY2024–2025 经审计报表可补上这一缺口
      - - FDA 调查包括肝损伤在内的不良事件
        - 2023–2024 年提交 118 起不良事件报告；多个公开来源承认 FDA 审查
        - FDA 放行或确认不采取行动会移除该风险；执法则会加速下行
      - - 尽管收入增长 4x，估值自 2022 年 1 月以来持平
        - 2022 年 1 月投前 $1.2B = 2024 年 11 月投前 $1.2B；最近已知标记为 $1.3B（Forge，2025 年 11 月）
        - 新一轮加价融资或 $2B+ 战略流程会验证投资逻辑；继续持平或下轮折价融资会强化担忧
      - - 毛利率未知；零售扩张可能挤压经济性
        - Costco 定价比 DTC 低 31%；零售放大后混合毛利率下行
        - 披露 2024 年经审计毛利率高于 55%，可确认毛利质量
    notes: |
      投资逻辑按证据强度排序，反向逻辑按严重性排序。前四项投资逻辑有证据支撑；在没有经审计披露前，后四项反向逻辑仍未关闭。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
