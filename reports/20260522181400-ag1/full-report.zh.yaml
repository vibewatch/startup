chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              AG1，前称 Athletic Greens，是一家在美国（Nevada）和 Cayman Islands 注册的全球营养补充剂公司。 公司由前新西兰警官 Chris Ashenden 于 2010 年 12
              月创立，起点是想用一款综合日常补充剂解决自己的肠道健康和营养吸收问题。 Ashenden 先在新西兰自举起步，随后把运营转向美国。

              公司旗舰产品——也在其大部分历史中唯一的产品——是 AG1 粉剂，一款每日营养补充剂，每 12 克一勺含 75–83 种维生素、 矿物质、益生菌、适应原、超级食物和全食物来源营养素。每份约 50 卡路里、2
              克蛋白质、6 克碳水化合物， 糖含量低于 1 克。产品通过 NSF Certified for Sport 认证，意味着第三方验证其纯度、标签准确性和不含禁用物质。
              它是纯素、无麸质、无乳制品产品，适合生酮和原始饮食。

              AG1 的市场进入模式是直面消费者（DTC）订阅，价格为每月 $79（一次性购买 $99）。运营前十五年，公司只通过自有网站销售， 并以完全远程组织运作，员工遍布 20 多个国家。收入从 2021 年约
              $160M 增至 2024 年约 $600M，大约增长四倍； 到这一节点，公司宣布实现盈利。AG1 服务北美、欧洲和亚太客户。

              Wikipedia 将 AG1 的公司总部标为 Carson City, Nevada；多篇 2022 年新闻报道则称公司位于 New York， 反映出其远程优先架构和注册地变化。公司同时在美国实体和
              Cayman Islands 注册。
