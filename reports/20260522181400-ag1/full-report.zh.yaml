      - number: '7.5'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >
              Chris Ashenden 继续留在 AG1 董事会，构成持续治理和声誉风险。Ashenden 2011 年因运营租购房产计划、触犯新西兰 Fair Trading Act 43
              项刑事条款而被定罪；买家因产权从未转移而损失押金和装修投入。法院判令赔偿 NZD 182,000；他的公司最终清盘，未向受害者全额付款， 赔偿也被取消。Ashenden
              被认为仍是大股东，意味着董事会无法移除他，他的商业判断仍会影响公司方向。他最初否认定罪， 也让投资者和员工担心信息不对称和治理诚信。

              CEO Kat Cole 拥有强消费品牌履历，她的任命确实起到稳定作用。据报道，在她领导下，2025 年 Black Friday 销售额同比增长 40%。 但她 2024 年 7
              月才上任，建立科学可信度的使命与 AG1 过去影响者优先的营销遗产直接冲突；她一边推动零售和产品多元化战略，
              一边处理多项法律和监管调查，运营负荷很重。考虑到她之下缺少同等受品牌信任的管理层纵深，她离职将是重大风险事件。

              AG1 是远程优先组织，约 300 名员工分布在 20+ 个国家。远程优先结构给文化、质量控制、供应商管理和监管响应速度带来挑战。 公司监管和法律响应团队现在必须同时处理 FDA
              不良事件审查、加州集体诉讼、仲裁请求、新西兰 Commerce Commission 关注以及计划中的临床试验。 若出现需要快速消费者沟通的产品安全危机，AG1 的组织带宽会受到显著挤压。
