      - number: '1.7'
        title: 图表
        blocks:
          - type: callout
            title: 单一产品纪律推动了异常高的收入效率
            body: >
              2021 至 2024 年，AG1 年收入从 $160M 增至约 $600M，同时仍保持单一产品、单一 DTC 渠道。 这种少见的战略纪律——15
              年里抵住产品多元化和零售扩张诱惑——造就了一个高留存订阅业务，使公司在没有消费品牌达到这一规模时常见的多 SKU 或多渠道复杂度下，成为独角兽并宣布盈利。
            calloutType: strength
            claimRefs:
              - CO031
              - CO032
              - CO033
          - type: callout
            title: 创始人刑事记录带来持续声誉和董事会风险
            body: >
              Chris Ashenden 因房产计划 43 次违反新西兰 Fair Trading Act 被刑事定罪，导致买家未取得产权，且法院判令的 $182,000 赔偿仍未支付； 这构成实质声誉负债。虽然
              Ashenden 已退出 CEO 职位，但他仍留在 AG1 董事会，继续保有治理影响力。他最初否认定罪、后来撤回否认， 进一步加重声誉风险。投资者应评估董事会构成变化、赔偿安排，以及 Ashenden
              的股权是否会在未来退出事件中造成治理复杂性。
