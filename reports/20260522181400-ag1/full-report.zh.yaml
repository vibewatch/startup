  - id: TP001
    title: 竞争对手画像表
    enumerationScope:
      coverage: sample
      basis: >
        Representative set of eight direct and adjacent competitors in the premium daily greens and all-in-one nutrition
        supplement category, selected by estimated revenue scale or market search visibility as of May 2026;
        private-company revenues are third-party estimates and should be treated as approximations.
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标客群
      - 核心差异点
      - 局限
      - 渠道
    rows:
      - - AG1 (Athletic Greens)
        - 高端全能每日绿粉
        - ~$600M 收入（2024）；累计融资 $115M；估值 ~$1.2B
        - 注重健康的 25–50 岁成年人；运动人群；高端 DTC 订阅用户
        - 75+ 种成分；NSF Certified for Sport 认证；十余年播客品牌积累
        - 价格最高（$79–99/month）；单一口味；自有配方不透明
        - DTC；Costco（约 600 家美国门店）；Target；Amazon；Vitamin Shoppe
      - - Bloom Nutrition
        - 绿粉与超级食物、饮料品牌
        - ~$175–200M 收入（2023）；2025 年目标 ~$350–400M；来自 Nutrabolt 的 $210M
        - 女性偏多的 20–40 岁健康消费人群；大众零售客群
        - 9 种口味；价格亲民；主打肠道健康；KDP 分销
        - 每份成分剂量低；第三方检测未说明；转向饮料稀释绿粉焦点
        - Target；Walmart；Amazon；Keurig Dr Pepper 饮料分销
      - - Ka'Chava
        - 全能代餐奶昔
        - 私营；DTC、Costco 与 Target；85+ 种成分
        - 植物基生活方式人群；代餐消费者；Costco 客群
        - 25g 植物蛋白；完整代餐定位；超级食物和蘑菇复配丰富
        - 价格高（$4.66/serving）；未获 NSF 认证；潜在含铅担忧（CA Prop 65）
        - DTC；Costco；Target
      - - Organifi
        - 高端有机绿粉
        - 私营；收入估计 ~$10–100M；100 万+ DTC 客户
        - 有机 / 清洁标签买家；看重口味的消费者
        - 有机成分；口味；全渠道零售；Vitamin Shoppe 超级食物品类第 2
        - 成分数量更简单；临床支持有限；价格接近 AG1（$2.33/serving）
        - DTC；Sprouts（全美）；600+ 家 CVS；King Sooper；Fresh Thyme；Amazon
      - - Amazing Grass
        - 平价有机绿粉超级食物
        - Keurig Dr Pepper 子公司（2017 年收购）；大众市场规模
        - 注重性价比的健康消费者；零售健康品买家
        - USDA 有机；$0.90/serving；借助 KDP 拥有强大的大众零售分销
        - 临床证据很少；功能性成分更少；被视为大宗商品层级
        - Target、Walmart、Walgreens、Amazon、iHerb、Vitacost 等零售渠道
      - - Huel Daily Greens
        - 高营养密度每日绿粉
        - ~£350M 全产品年收入；全球品牌
        - 追求均衡饮食的人群；备餐人群；价值型买家；国际消费者
        - 91 种成分，包括 AG1 缺失的维生素 D 和 K；订阅价 $1.50/serving
        - 口感 / 质地问题；益生菌剂量更低；自有配方；美国线下零售有限
        - DTC；Amazon；美国零售有限
      - - Ritual Essential
        - 高端 DTC 复合维生素胶囊
        - 收入估计 ~$100M；Norwest Venture Partners 参与 C 轮融资
        - 20–40 岁女性，寻求证据支持且来源可追踪的补充剂
        - 成分完全透明；来源可追踪；$30/month；可随时取消
        - 胶囊形态，不是绿粉；微量营养素覆盖更窄；无适应原或益生菌
        - DTC；Target；Amazon
      - - Live it Up Super Greens（竞品）
        - 中端每日绿粉（Nested Naturals）
        - 私营；DTC 与 Amazon；品牌规模较小
        - 注重健康且看重性价比的人群；偏好有机；关注营养师推荐的消费者
        - 多为有机；20+ 种超级食物；订阅价 $1.33/serving；持续获得营养师推荐
        - 品牌小；零售存在感有限；消费者认知低于 AG1 或 Bloom
        - DTC；Amazon
    notes: >
      AG1 的收入数字来自公开报道；其他公司为新闻和分析师来源给出的第三方估计；私营公司收入为近似值。订阅价格反映截至 2026 年 5 月的公开网站标价。Ka'Chava 的月度等效成本假设购买两袋 15 份装（$60 × 2 =
      $120/month 订阅价）。
