      - number: '7.4'
        title: 财务与商业模式风险
        blocks:
          - type: paragraph
            body: >
              AG1 约 $79 / 月的 DTC 订阅模式，暴露在订阅电商流失动态的完整光谱下。Recurly Research 的行业基准显示， 消费品 DTC 订阅平均月流失率约 9.1%。按这个速度，AG1 所称约
              700,000 名订阅用户，每月需要获取约 64,000 名新订阅用户才能维持规模。 公司内部来源已经暗示收入增长停滞：Ashenden 在 2024 年底告诉员工客户数已达 700,000，但 AG1
              公开目标只是 2024 年收入 $600M； 这个缺口与高流失和 / 或较低平均订阅价值一致。

              零售渠道扩张从根本上改变 AG1 的财务模型。给 Costco 和 Target 的批发价通常比 DTC 价格低 40% 到 60%；即使保留同等销量， 单位贡献也会塌陷。如果零售蚕食 DTC
              订阅用户，使他们转向 Costco 一次性大包装购买，公司会同时遭遇利润率压缩和客户终身价值破坏。 2026 年关于自动续订做法的集体诉讼，意味着现有 DTC 留存手段可能受到法律和监管约束，进一步放大流失压力。

              AG1 在 2024 年 11 月完成融资时估值 $1.2B，对应约 $600M 收入，意味着 2x 收入倍数；对一家已声明盈利的消费品牌而言算合理。
              不过，流失加速、零售带来的利润率压缩、法律和解以及增加的研发投入叠加，可能显著压迫自由现金流。已融资总额超过 $230M， 说明现金跑道风险有限；但若情况迅速恶化，在当前估值锚点上，股权稀释空间也有限。
            claimRefs:
              - CR026
              - CR027
              - CR029
              - CR030
              - CR035
