      - CV024
      - CV025
      - CV026
  - id: TV005
    title: 投资逻辑破坏与否决触发因素
    columns:
      - 触发因素
      - 门槛 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - FDA 警告信或同意令
        - 正式警告信发出，或公司宣布被迫改配方
        - 直接损伤收入；订阅流失激增；并购溢价消失；很可能折价融资
        - 立即退出或暂停新增投资；按 0.5–1x 收入重新承保
      - - 经审计财务显示毛利率低于 40%
        - FY2024/2025 审计显示含零售组合后的混合毛利率 ≤40%
        - 抹掉盈利说法；订阅单位经济性不可行；EBITDA 很可能转负
        - 按困境资产重构判断；估值下修至 0.75–1x 收入
      - - 净留存率低于 80%
        - 确认 NRR ≤80%，或月流失率高于 8–9%
        - 收入可持续性受损；LTV 假设坍塌；订阅飞轮断裂
        - 下调至回避；投资逻辑被不可逆削弱
      - - 收入重述或审计保留意见
        - CEO 披露的 $600M 数字被大幅下修，或审计出具保留意见
        - 财务可信度彻底丧失；所有基于倍数的估值都必须完全重算
        - 若已持有，立即退出；新资金回避
      - - 诉讼和解超过 $50M
        - 集体诉讼或监管和解造成 >$50M 现金流出，或同意令限制营销
        - 经营杠杆被摧毁；法律成本反复出现；订阅注册受限
        - 减仓；按反映反复法律风险的较低倍数重估
      - - 披露订阅用户数低于 500K
        - 公司披露活跃订阅用户 <500K——低于按 $600M / ~$948 ARPU 推出的约 700K
        - 收入质量受质疑；ARPU 可能被一次性销售抬高；零售占比高于假设
        - 重新承保收入结构；将倍数下调至 1.0–1.5x
    notes: |
      否决触发因素指的是分析基础发生根本改变，而不只是变差。监测指标可来自 FDA 执法数据库、SEC 诉讼公告和 AG1 自愿新闻稿。部分触发因素（NRR、订阅用户数）需要公司披露。
    claimRefs:
      - CV008
      - CV009
      - CV031
      - CV032
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调资料清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计财务报表
        - FY2024 和 FY2025 经审计 P&L、资产负债表和现金流量表
        - 收入（$600M）和盈利仅由 CEO 披露，没有独立验证——所有基于倍数的估值都压在未经验证的输入上
        - 向公司索取；任何新增资本承诺前必须取得
      - - 分渠道毛利率和 EBITDA
        - 按 DTC 订阅 vs. 零售渠道（Amazon、Costco、Target）拆分的报告毛利率
        - 零售渠道（Costco 价格比 DTC 低 31%）可能把混合毛利率压到 40% 以下，甚至反转盈利
        - 公司侧披露；若可取得审计 COGS，可据此推断
      - - 订阅单位经济性：NRR 和流失率
        - 月流失率、净留存率，以及按队列和年份拆分的客户 LTV
        - 订阅估值完全押注留存；5% 与 10% 月流失率会让 LTV 相差 2x，并显著改变入场价格
        - 公司管理层；若可访问，使用第三方计费平台数据
      - - FDA 询问状态和结果
        - FDA 对 118 起不良事件报告的当前执法立场；审查完成时间线
        - 活跃 FDA 询问带来头条和责任风险；警告信或同意令会打破投资逻辑
        - 直接提交 FDA FOIA 请求；监测 FDA 执法数据库；要求管理层说明
      - - 股权结构瀑布和优先权条款
        - Series B 和 2024 年 11 月轮次的优先股结构、清算优先权倍数、反稀释条款，以及创始人持股
        - 优先股包袱可能意味着，低于 $1.5B 退出时普通股（以及晚进入投资人股权）的有效回收显著更低
        - 法律顾问审阅条款清单；向公司律师索取
      - - 2026 年收入指引和零售渠道 P&L
        - 管理层对 2026 年收入、订阅用户数和零售渠道贡献的指引
        - 零售扩张可能是净新增，也可能蚕食 DTC；没有数据，前瞻收入假设就是推测
        - 业绩电话会 / 管理层路演；如能从零售商取得，使用终端动销数据
    notes: >
      尽调事项按关键性排序。第 1–3 项是任何新增资本承诺的前提。第 4–6 项也重大；如果第 1–3 项令人满意， 单独看并不一定构成阻断。AG1 是私营公司，所有事项都需要公司自愿披露或监管 FOIA；截至 2026 年 5
      月，没有公开文件包含这些信息。
    claimRefs:
