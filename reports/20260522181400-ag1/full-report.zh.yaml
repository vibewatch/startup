      - number: '4.4'
        title: 资本充足性与融资
        blocks:
          - type: paragraph
            body: >
              AG1 是私营公司，没有披露现金头寸、资产负债表或利润表。公司在接受外部资本前，把收入运行率自举到约 $100 million，说明早期资本效率较高。已确认融资包括：（1）Athletic Greens
              International, Inc.（CIK 1862737）2021 年 5 月 17 日向 SEC 提交的初始豁免发行，发行总额 $10.5 million（已售 $9.6 million），按 Rule
              506 豁免分类；（2）2022 年 1 月由 Alpha Wave Global 领投的 $115 million Series B，投前估值 $1.2 billion；（3）2024 年 11 月以同样
              $1.2 billion 投前估值再次融资 $115 million。因此，已确认累计融资超过 $230 million。

              AG1 表示，2024 年 11 月的 $115 million 融资将用于产品创新、扩大研究投入和提升客户体验。AG1 自家新闻稿措辞（SignalBase 2024 年 11
              月转载）称：「这笔新资本注入将让我们进一步创新产品、扩大研究投入，并提升客户体验。」投前估值稳定在 $1.2 billion——三年内收入增长 4x
              却没有变化——要么说明投资人保守，要么是公司刻意释放退出前估值稳定信号，也可能是股权结构表机制阻止新一轮估值上调。CEO Cole 2026 年 4 月告诉 Modern Retail，AG1
              因为盈利而「可以选择自己的路径」，并补充：「我们自己资助创新。我们也自己资助扩张和增长。」

              如果 2024 年起盈利的说法准确，公司至少在 DTC 层面可以靠运营自我供血。但 2024 年 11 月 $115 million
              融资与零售渠道建设同步发生，而后者需要库存、进场费和零售营销的营运资金，说明资本已在大规模投入。月烧钱速度、账上现金和现金跑道均未公开披露。没有公开披露债务或项目融资义务，但考虑到多零售商全渠道扩张的资本强度，不能排除这些负债。
