  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >
              AG1 的客户群可分为四个主要分层。最大且最具战略意义的是 DTC 订阅队列：25–44 岁、重视健康的成人，城市人群为主，受过大学教育，年收入 $65,000+。这批人最早通过播客赞助接触 AG1（Tim
              Ferriss Show、Huberman Lab、Joe Rogan Experience、Rich Roll Podcast），接受了品牌的一勺便利叙事，并转化为 $79/月的经常性订阅。估计 AG1
              是全球前六大播客广告主之一，单播客赞助每月支出约 $2.2 million，反映出它对这一获客渠道的深度依赖。

              第二类是接受药检的竞技和职业运动员，他们愿意为 NSF Certified for Sport® 第三方逐批检测支付溢价（一次性 $99/月或订阅 $79/月）。仅认证本身，就足以让 AG1
              相比未认证替代品具有价格理由。第三类是零售发现买家，这是 AG1 2025–2026 年进入实体零售后形成的新渠道，覆盖 Costco（600+ 网点）、The Vitamin Shoppe（640+
              门店）、Target（约 2,000 家全门店和 Target.com）以及 Ulta Beauty（1,500+ 门店）。这些买家在 7 条装、14 条装试用包和 AG1 Start Here Kit 中接触
              AG1，转化为 DTC 订阅是关键漏斗目标。第四类是国际客户：AG1 运营覆盖北美、欧洲和亚太，美国贡献约 48% 网页流量，其余来自英国、德国、澳大利亚和加拿大。

              客户证据质量在不同分层之间差异很大。DTC 订阅客户有最丰富的独立评测证据（Trustpilot、Reddit、Healthline 测试者）。接受药检的运动员分层有强定性证据（运动员大使关系，NSF
              认证作为前提）。零售和国际分层目前独立证据有限。
