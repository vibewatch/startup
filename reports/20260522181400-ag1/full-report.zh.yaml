  - id: FV001
    title: 推荐逻辑流
    type: flow
    layout: wide
    summary: |
      从证据基础出发，串联 AG1 的关键价值与风险节点，最终落到观察建议；图中标明哪些因素验证投资逻辑，哪些仍不确定，以及哪些事件会改变判断。
    data:
      nodes:
        - id: rev_scale
          label: 收入规模（约 $600M，2024）
          detail: CEO 披露；较 2021 年 $160M 增长 4 倍；外部融资前自力更生做到 $100M
        - id: brand_moat
          label: 品牌护城河（15 年）
          detail: NSF 认证；播客 / 影响者先发；订阅价差带来切换摩擦
        - id: profitability
          label: 盈利能力主张（未经审计）
          detail: CEO 2024 年 12 月称已盈利；无经审计财务；营销削减 40% 同时销售增长
        - id: financing
          label: 融资背景（$1.2–1.3B 标记）
          detail: 尽管收入增长 4 倍，估值自 2022 年 1 月以来持平；累计融资 >$230M；CEO 称公司自筹资金
        - id: comps
          label: 可比倍数（2–4x 收入）
          detail: Vita Coco 4.2x；Grüns M&A 4x；HIMS 3x；BRBR 1.26x；AG1 当前隐含约 2x
        - id: risk_stack
          label: 风险堆叠（高）
          detail: FDA 118 起不良事件；集体诉讼；无审计；零售利润率压缩；股权结构表不透明
        - id: exit_path
          label: 退出可选性（M&A / IPO）
          detail: Grüns / Unilever 4x 先例；战略买家池仍完整；若财务清晰，可能 IPO
        - id: recommendation
          label: 观察（中等信心）
          detail: 规模与护城河有吸引力；不透明与风险阻止形成买入信念；关注披露触发点
      edges:
        - from: rev_scale
          to: recommendation
          label: 验证规模
        - from: brand_moat
          to: recommendation
          label: 验证护城河
        - from: profitability
          to: recommendation
          label: 未验证 — 限制信心
        - from: financing
          to: recommendation
          label: 估值标记持平 — 谨慎信号
        - from: comps
          to: recommendation
          label: 低于可比公司，若审计通过则有上行
        - from: risk_stack
          to: recommendation
          label: 抬升至高风险
        - from: exit_path
          to: recommendation
          label: M&A 溢价可达 4x+
    approximationNotes: |
      节点标签和边描述为基于本章证据得出的定性评估。流向代表分析上的因果关系，不代表财务模型。
