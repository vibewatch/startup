      - number: '1.4'
        title: 规模、指标与地域
        blocks:
          - type: paragraph
            body: >
              AG1 已成长为全球商业化最成功的单一产品补充剂公司之一。公司报告 2021 年年收入约 $160M；CEO Kat Cole 在 2024 年向 Forbes 和 Bloomberg 披露，公司当年收入有望超过
              $600M——三年约增长四倍。AG1 在这一收入里程碑同时宣布盈利。

              这些数字由公司披露，未经独立审计；AG1 是私营公司，没有强制财务披露要求。毛利率、净收入留存、客户生命周期价值和订阅用户流失率等具体指标未公开披露。 Cole 在 2022
              年初称订阅用户数为「数十万」；截至本次报告日期，当前数字未披露。

              AG1 完全远程运营，员工分布在 20 多个国家。运营覆盖北美（主要收入市场）、欧洲和亚太，公司注册地包括美国和 Cayman Islands。 第三方数据库估计员工数为 300–500
              人，公司内部沟通提到「300 多名员工」。没有经审计的员工数披露。

              每月 $79 的订阅价格至少自 2021 年以来保持稳定。产品提供 60g、240g 和 360g 包装（约 5、20 和 30 份），另有旅行装。 这一价格把 AG1 定位为补充剂领域的高端产品。
