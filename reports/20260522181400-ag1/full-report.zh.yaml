      - number: '5.4'
        title: 临床证据与科学差异化
        blocks:
          - type: paragraph
            body: >
              2025 年 5 月，AG1 做出重要战略转向：伴随 Next Gen
              改配发布四项随机、安慰剂对照临床试验，这是绿粉品类首次出现此类成品研究。试验考察的是成品（不是单一原料），结果覆盖肠道微生物变化、微量营养素生物标志物状态、消化生活质量和血液安全性。2026 年
              Frontiers in Nutrition 研究（赞助试验之一）发现，补充 AG1 会增加达到估计平均需要量（EAR）的微量营养素数量，尤其是维生素 A、C、E，并选择性富集肠道中的 Lactobacillus
              和 Bifidobacterium。另一项 American Society for Nutrition 研究发现营养状态生物标志物改善。JISSN 研究（PubMed PMC12481523）确认，AG1 在
              12 周内不会负面影响血液安全生物标志物。ClinicalTrials.gov（NCT06332898）列出一项已完成试验，评估 AG1 对健康成人血液营养状态、肠道微生物和生活质量的影响。

              结果真实但幅度有限：Frontiers 研究显示，部分肠道细菌被选择性富集，但整体微生物多样性没有大幅变化；健康成人自报消化生活质量相较安慰剂也没有显著改善。长寿创业者 Bryan Johnson
              公开批评这些临床证据，认为其展示的边际收益不足以支撑 AG1 相比更简单、更便宜替代品的溢价。McGill University's Office for Science and Society
              也独立质疑，多数健康人能否从 AG1 获得超出标准复合维生素的优势。这些批评重要，因为它们来自可信外部声音，而不是竞争品牌。

              AG1 投入超过 $20 million 做临床研究，并在 2026 年成立科学与创新顾问委员会，由五位肌肉生理学、微生物组健康、代谢健康和生物活性物质科学独立专家组成（Drs. Keith
              Baar、Taylor Soderborg、Marcas Bamman、Justin Siegel 和 Grant Tinsley）。顾问委员会任期一年，可续任，并在结构上独立于营销。相比 AG1
              第一个十年由达人驱动的模型，这是真实的科学治理升级；但独立评测者指出，临床效应量仍然有限，而且公司赞助自己的试验，存在潜在偏差风险。
