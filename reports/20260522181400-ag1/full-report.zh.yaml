      - number: '1.6'
        title: 不良事件与科学审视
        blocks:
          - type: paragraph
            body: >
              AG1 面临一组交叉不利风险，横跨创始人行为、产品声称的科学可信度以及新出现的消费者诉讼。

              创始人刑事记录：AG1 创始人 Chris Ashenden 因约 2003 至 2011 年间运营欺诈性租购房产计划，在 Auckland District Court 被判 43 项违反新西兰 Fair
              Trading Act 的刑事罪名。买家被引导相信自己正在购房，却从未取得合法产权。 法院判令 Ashenden 已清算公司（Meguro Ltd、Home Finance Company Ltd、CMA
              Property Investments Ltd）支付 $182,000 赔偿； 这些赔偿尚未支付。Ashenden 起初未支付个人罚款，法院曾对其本人发出逮捕令；他在 2014 年结清罚款以重新入境新西兰。
              Newsroom NZ 的「Powder Keg」播客（2024 年 10 月 31 日发布）由总编辑 Jonathan Milne 在历时一年调查后制作， 将这些细节推向全球视野，并与 Ashenden 退出
              CEO 职位时间重合。公司拒绝确认调查是否导致其离职，仅称交接早已计划。 Ashenden 仍在董事会；他此前否认定罪、之后更正，进一步放大声誉风险。

              科学可信度：AG1 的健康声称持续受到独立科学家批评。McGill University 的 Jonathan Jarry 发表详细批评，结论是 AG1 只有
              「很少科学支持」，理由包括专有成分剂量未披露、适应原缺乏证据，以及益生菌菌株研究并不具体。Harvard Medical School 的 Dr. JoAnn Manson
              认为，与金标准、数千名参与者研究相比，AG1 的临床试验缺乏「严谨性」。Columbia University 的 Prof. David Seres 表示，
              「没有高质量证据表明一般人群服用复合维生素补充剂有任何健康益处」。AG1 自己在 2024 年 12 月的临床试验只有 30 名参与者、持续 4 周； 长寿创业者 Bryan
              Johnson（Blueprint，竞争对手）公开质疑结果，称「血液生物标志物相较安慰剂没有显著变化」。 AG1 引用多项已发表研究和其 $20M 研究承诺予以反驳。

              消费者诉讼：消费者权益律所在 2025 年启动对 AG1 的调查，指控其涉嫌违反州消费者保护法规，重点针对虚假广告声称。 指控包括夸大营养益处，以及对益生菌含量做误导性宣传。据报道，可能的集体诉讼可通过
              Amazon 购买者推进，因为他们不受 AG1 仲裁条款约束。

              截至报告日期，尚未确认 FTC 或 FDA 对 AG1 采取正式执法行动。考虑到补充剂行业结构（无需 FDA 上市前批准）以及 AG1 营销中大量健康益处声称， 监管风险仍处高位。
