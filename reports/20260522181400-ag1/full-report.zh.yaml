companyProfile:
  summary: >
    AG1（前称 Athletic Greens）是一家直面消费者的营养补充剂公司，由 Chris Ashenden 于 2010 年 12 月在新西兰创立。 公司销售单一绿粉产品，含 75–83
    种维生素、矿物质、益生菌、适应原和全食物来源营养素，订阅价为每月 $79。 在接受外部资本前，公司靠自举做到约 $100M 年收入；2022 年 1 月，AG1 完成由 Alpha Wave Global 领投的 $115M
    Series B，投前估值 $1.2B，晋级独角兽。2024 年 11 月第二笔 $115M 融资维持同一估值。2024 年 7 月接替创始人 Ashenden 的 CEO Kat Cole
    是资深消费品牌高管，此后推动公司首次产品多元化（AGZ 睡眠补充剂），并进入 Amazon、 Costco、Vitamin Shoppe 和 Target 等零售渠道。AG1 披露 2024 年收入约
    $600M，同时宣布盈利，但未发布经审计财务报表。 毛利率、NRR 和流失率等关键指标仍未披露。正在进行的 FDA 不良事件调查（118 份报告，包括肝损伤病例）以及尚未解决的消费者集体诉讼， 带来实质监管和法律风险。公司在
    Nevada / Cayman Islands 注册，完全远程运营，员工分布在 20 多个国家，尚未公布 IPO 时间表。
