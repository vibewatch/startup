      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >
              AG1 买方群体偏向 25–54 岁、家庭收入高于 $50,000 的健康意识型成年人。YouGov 数据显示，补充剂使用与收入高度相关： 年收入超过 $50K 的家庭中，60% 经常使用补充剂，低收入群体为
              40%。以每月 $79（约每天 $2.63）计算，AG1 瞄准的是把这笔溢价视为投资、 而非价格障碍的消费者。

              Latterly 对 AG1 营销架构的分析识别出五个主要细分人群。表现优化者——耐力运动员、健身房用户和休闲竞赛参与者—— 对 AG1 的 NSF Certified for Sport 定位以及与 Alex
              Honnold、Lewis Hamilton、Allyson Felix 等高表现人物的合作最有反应。 忙碌专业人士（知识工作者、高管）看重用一勺仪式替代多补充剂组合；通过专业听众偏好的播客赞助（Huberman
              Lab、Tim Ferriss、Joe Rogan）， 公司能高效触达这一群体。健康改善者是更宽的人群池，覆盖关注营养但并非以运动为主的消费者；医生推荐和同伴推荐会影响该群体， 其中
              Millennials（偏好植物基和肠道健康产品）与 AG1 的益生菌和适应原定位天然契合度最高。高频旅行者和高管看重旅行装形式和「打断中保持一致」定位； AG1 的酒店和耐力赛事合作（如 1
              Hotels、29029 Everesting）直接面向该群体。最后，老龄健康人群（55+）优先考虑长寿、吸收和免疫支持—— 随着 Baby Boomers（维生素使用率最高，达
              64%）步入退休，这是一个增长中的人口结构。

              付款人几乎总是买方和用户本人（自主消费者健康支出），目前企业健康报销有限。预算权在个人手中，他们会把 AG1 与其他高端健康支出
              （健身房会员、可穿戴设备、营养师咨询）比较。采用通常由播客推荐或影响者内容触发，而不是医疗服务提供者——这带来高效触达， 但若影响者信任被侵蚀，也会形成集中风险。
