      - number: '7.7'
        title: 展示材料
        blocks:
          - type: callout
            title: FDA 不良事件调查是头号风险
            body: >
              2023–2024 年向 FDA 提交 118 起不良事件报告（30+ 起肝损伤、9 起住院、2 起危及生命）且主动调查正在进行， AG1
              面临尾部风险：一旦认定因果关系，可能触发强制改配方或产品下架。该风险目前被归为中等可能性、关键影响。 截至 2026 年 5 月尚未发布执法行动；公司资助的 12 周健康成年人 RCT
              未发现肝脏影响，但研究设计没有覆盖报告不良事件的易感人群。 尽调必须包含完整 FDA 往来文件。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR028
          - type: callout
            title: Capstone Nutrition 单一来源依赖是未缓释的结构性风险
            body: >
              AG1 决定将制造从 Alaron NZ 集中到 Capstone Nutrition，用地理多元化换成单一来源集中。公开信息没有识别任何备份制造商。 对于一套 75+ 成分、且要求严格 NSF 和 cGMP
              的配方，认证替代合同制造商估计需要 6–18 个月，并可能引发配方完整性问题。 该依赖在实践中从未经过压力测试。
            calloutType: risk
            claimRefs:
