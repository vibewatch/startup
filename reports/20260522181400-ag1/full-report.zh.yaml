      - number: '4.5'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >
              AG1 具备高质量订阅业务的几个特征：耐久的经常性收入、强品牌留存，以及一个单一配方三年内放大 4x 后仍宣称盈利。2024 年 $600 million 收入虽然未经审计，但多家独立媒体与 CEO Kat
              Cole 的接触（Forbes、New Consumer、Retail Brew）相互印证，说明该说法背后有实质支撑。$1.2 billion 稳定估值显示投资人有一定舒适度，但估值没有随 4x
              收入增长刷新，留下股权结构表机制和退出时点问题。

              关键尽调难点是数据不透明。AG1 选择性披露收入和盈利说法，且都来自 CEO
              表述，没有资产负债表、利润表或第三方审计。毛利率、CAC、LTV、流失率、NRR、营运资金和账上现金等关键指标，公开记录中完全缺席。FDA 2024 年收到 118 起 AG1 不良事件报告（包括 30+
              起肝酶升高、两起危及生命的住院事件和九起住院治疗），构成产品安全信号；两位独立毒理学家认为该信号足以触发监管调查。AG1
              反驳这一框架，引用的是按每份食用量计算的发生率，而不是按每名客户计算。供应链从新西兰转移到犹他，同时多数生产转移后仍保留误导性的「新西兰制造」营销说法，使公司在至少两个司法辖区面临监管和声誉风险。

              2025 年零售渠道扩张实质性改变收入组合、毛利率画像和增长算法。投资人必须建模：当零售收入从接近零扩大到总收入中有分量的占比时，混合毛利率可能被压缩。AG1
              公开呈现的财务姿态——盈利说法、以稳定估值融资、战略性零售扩张——内部逻辑上符合一家为退出事件（IPO
              或战略出售）做准备的公司，但没有披露财务数据就无法确认。财务结论对收入质量和订阅耐久性谨慎正面，但在毛利率、资本结构和产品责任风险上受阻。
