      - number: '5.6'
        title: 证据附录
        blocks:
          - type: callout
            title: NSF Certified for Sport® 与临床试验投入显示真实质量意图
            body: >
              AG1 是少数拥有 NSF Certified for Sport® 状态的绿粉品牌之一；该认证获得 USADA、MLB 和 NHL 认可，要求逐批检测 280+ 种违禁物质，并每年审计工厂。2025 年 5 月
              Next Gen 改配有四项安慰剂对照 RCT 支撑；在多数产品只依赖原料层面研究的品类中，这是有意义的差异化。$20M 研究承诺和 2026 年正式设立的独立科学顾问委员会，反映出公司确实在投入循证产品开发。
            calloutType: strength
