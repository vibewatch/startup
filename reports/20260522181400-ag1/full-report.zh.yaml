      - number: '3.3'
        title: 相邻替代品与现状选择
        blocks:
          - type: paragraph
            body: >
              多种非绿粉替代品与 AG1 争夺相同消费者预算和健康目标。个性化维生素订阅服务——Persona Nutrition、Care/of、Gainful—— 让消费者构建自定义日常补充剂包，通常每月
              $40–80，并根据健康评估调整剂量。这些服务对不信任一刀切混合物、且想清楚理解自己在吃什么和为什么吃的健康意识型高端买家，
              构成直接替代风险。功能食品和饮料品牌越来越多地通过饮料、能量棒和蛋白奶昔提供营养益处——包括 AG1 自己的新气泡能量饮料和 Bloom 的汽水线——
              削弱了绿粉作为递送形式的独特性。现状替代方案——从药房或大卖场购买单独维生素、矿物质和益生菌——单位营养成本更低，
              也让消费者完全控制摄入内容，代价是日常摩擦更大。内部自建（自行采购螺旋藻、小球藻、南非醉茄和益生菌胶囊）成本最优， 但制造了显著日常复杂度；AG1 的一勺便利性正是直接解决这一点并为其收取溢价。

              CPG 进入者构成未来结构性威胁：Keurig Dr Pepper 支持 Amazing Grass，同时也支持 Bloom Nutrition 的分销，
              使其一旦消费者数据或货架表现支持战略推进，就能把任一品牌加速推入高端层级。截至 2026 年 5 月，没有证据显示 KDP 已经采取这类动作， 但基础设施已经存在。
            claimRefs:
              - CP032
              - CP033
              - CP039
      - number: '3.4'
        title: 护城河耐久性与被替代风险
        blocks:
          - type: paragraph
            body: >
              AG1 的竞争护城河建立在四根可识别的支柱上，每根支柱都有不同的耐久性风险。第一，过去大约十四年里，AG1 通过激进的播客赞助打出品牌认知——Joe Rogan、Andrew Huberman、Tim
              Ferriss，以及数百位健康与养生垂类主播——带来很高的消费者知名度和购买考虑度。但这道护城河正在部分被侵蚀：品类变大后，竞品加大播客和社交媒体投放；渠道成熟、同类品牌进入同一批头部媒体资产后，AG1
              的播客优先打法也遇到结构性上限。

              第二，NSF Certified for Sport 认证提供了一个信任信号；截至 2026 年，Bloom、Ka'Chava、Organifi 和 Amazing Grass
              都没有这项认证。运动员、军人和重视安全的买家会把它看成有分量的差异化。竞品可以在 6–18 个月内拿到这项认证，或 Informed Sport、USP 等等效项目，未来 1–2 年内会削弱其独占性。

              第三，订阅模式带来习惯性购买和中等锁定效应：AG1 要求提前 7 天通知取消，而 Ritual 和几家竞品允许随时取消，AG1
              因此在摩擦上处于相对劣势，新买家可能会把这一点纳入权衡。订阅流失率是关键但未披露的指标；缺少这一数据，无法承销客户终身价值与获客成本之间的关系。

              第四，75+ 种成分的专有配方作为补充剂混合物，无法在美国法律下获得专利保护，合同制造商也能复刻类似的成分组合。竞品混合物在原始成分数量上已经超过
              AG1（Huel：91），而专有混合物的不透明是整个品类共同的弱点，独立评测者持续批评这一点。

              商品化压力正在变成新的结构性风险。Costco 的 Kirkland Signature、Sam's Club 的 Member's Mark，以及 Target、Walmart
              自有品牌都在扩张绿粉，把大众零售价位上的中端品牌挤出货架。AG1 的高端定位能提供部分缓冲——$0.50–1.00/份的可比自有品牌给 AG1 下方留出价格空间——但 AG1 进入 Costco
              门店后，新买家会在同一货架上看到 Kirkland 自有品牌和 Amazing Grass，AG1 处于 3–5× 的价格劣势。

              反向竞争证据很强。2026 年，多位独立注册营养师和专家评测媒体持续认为 AG1 定价过高，并明确推荐 Bloom、Huel Daily Greens、Live it Up Super Greens 和
              Amazing Grass 作为更划算的替代品。独立评测的压力对 AG1 在新买家中的价值感知构成重要反向信号；零售渠道让直接比价更容易后，这一压力尤其突出。
