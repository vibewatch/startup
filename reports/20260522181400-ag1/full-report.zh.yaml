      - number: '6.5'
        title: 扩张驱动因素与集中风险
        blocks:
          - type: paragraph
            body: >
              AG1 最主要的扩张杠杆是零售渠道多元化：2025–2026 年进入 Costco、Target、Vitamin Shoppe 和 Ulta Beauty，把获客触点从播客 / 影响者漏斗之外打开；7 片、14
              片装和 Start Here Kit 等试用 SKU 降低首购门槛， 也让不听健康类播客的消费者看到品牌。AGZ 睡眠产品把品牌生态延伸到第二个夜间习惯，增加现有订阅用户的钱包份额。 Amazon
              上架则提供了额外便利性和发现入口。

              集中风险很重。客户基础高度集中在播客和影响者获客漏斗：AG1 是全球前六大播客广告主，每月投放约 $2.2M。若与 Andrew Huberman、Tim Ferriss 或 Joe Rogan
              等核心主播的关系破裂——无论源于健康声明争议、竞品代言，还是主播侧业务变化—— AG1 的主获客引擎都会受冲击。单一产品 DTC 起家意味着公司几乎没有交叉销售历史；AGZ
              是首次尝试提高单客变现、降低单品集中度。

              零售扩张也带来新风险：可能蚕食 DTC 订阅经济性，零售伙伴失利或下架，货架价格透明化（Costco 可见定价可能把消费者预期锚定在 DTC 价格以下），以及 AG1
              从未系统管理过该渠道带来的执行风险。竞争格局（Amazing Grass、Grüns / Unilever、Garden of Life、Live It Up）继续向更低价格带扩张，对 AG1
              买家中价格敏感人群形成下行定价压力。
