      - number: '8.5'
        title: 退出路径与战略背景
        blocks:
          - type: paragraph
            body: >
              AG1 投资者有三条可行退出路径：战略收购、IPO、PE / 成长股权资本重组。鉴于 Grüns / Unilever 先例， 以及大型 FMCG
              集团对高端健康与健康生活品牌表达出的兴趣，战略收购是近期概率最高的路径。AG1 的品牌身份、订阅用户忠诚度和全渠道扩张， 对 Nestlé Health Science、Unilever
              Wellbeing、Haleon、Reckitt 或 Hershey 组合都将有强增益。 Unilever / Grüns 交易以约 4x 收入完成，标的是一个三年品牌、收入约 $300M，且没有可与 AG1
              15 年护城河相比的传统品牌资产。 如果 AG1 的并购交易即便相对 Grüns 倍数打一个温和折扣——例如在 $700M 前瞻收入上套 3x——公司估值也将达到约 $2.1B， 较当前估值溢价 60%+。

              IPO 可能发生，但取决于经审计财务、收入透明度和 FDA 调查解决。截至 2026 年 5 月，公司尚未提交 S-1，也没有公开披露 IPO 准备。 Forge Global 列表提到「提及
              IPO」和「保密提交」里程碑，尽管这些未经验证的状态指标在 AG1 规模的私营公司中很常见。 公开市场在 IPO 时可能按 2.5–3.5x
              前瞻收入倍数定价，具体取决于增长率、利润率结构和监管背景——低于战略收购可获得的 4x+， 但能提供投资者流动性。

              考虑到公司声称自筹资金、CEO 也提到「路径选择」，PE 资本重组可能性较低。不过，在不发生控制权变更交易的情况下， 创始人和早期投资者通过二级交易或结构化流动性事件退出仍有可能。Capstone
              Partners 2025 年 6 月 Vitamins & Supplements M&A 报告指出， PE 和战略买家对品牌补剂公司兴趣强劲，差异化、有临床支持品牌的 EBITDA 倍数为
              12–18x——如果 AG1 提供财务披露， 这进一步支持其高溢价退出。
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
      - number: '8.6'
        title: 最终建议与尽调问题
        blocks:
          - type: paragraph
            body: >
              整体建议为观察，置信度中等，风险评级高。估值立场是合理：当前估值（$1.2–1.3B）隐含 2x EV/Revenue，
              相比可比上市公司和并购价值有明显私营公司折价；但财务披露不透明，使任何价格下的承销信心都不足。 缺少经审计财务、FDA 主动调查、2022 年以来收入增长 4x 但估值持平，以及毛利率和单位经济性未披露，
              使其不符合本基金证据标准下的买入建议。

              投资逻辑破裂风险不对称：上行是在 3–4x 收入倍数的并购或 IPO 中获得 1.5–2.5x 回报； 下行则是监管、可信度或财务事件对公司不利时，以低于 1x
              收入进行下轮折价融资。这种不对称更支持保持接触——继续监测、与公司维持关系， 等待未来轮次或更低估值老股购买机会——而不是在当前估值水平承诺投资。

              能把评级从观察提升到买入的具体尽调问题包括：（1）FY2024 和 FY2025 经审计财务，披露毛利率、EBITDA 和经营现金流； （2）订阅 NRR 和月流失率，并由第三方计费数据确认；（3）FDA
              调查状态更新及清晰解决时间表； （4）显示优先权压力和普通股对比优先股有效入场价格的股权结构分配瀑布；（5）零售渠道 P&L，说明 Costco 和 Target 收入是增量还是蚕食； （6）管理层对 2026
              年收入增长轨迹的指引。
            claimRefs:
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
