  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    layout: standard
    summary: |
      面向投委会的 AG1 八项投资维度定性评分。分数反映当前公开证据质量；市场和护城河得分强，透明度与监管得分明显受损。
    data:
      items:
        - label: 市场机会
          value: Strong
          note: 绿粉总可用市场（TAM）$3–6B；更广义 DTC 膳食补充剂市场 $11.6B；市场章节确认预防性健康顺风
        - label: 产品差异化
          value: Strong
          note: NSF Certified for Sport 认证；83 种成分配方；4 项 RCT 进行中；15 年配方打磨；2025 年 5 月推出 AG1 Next Gen 和 AGZ 睡眠补充剂
        - label: 收入规模与增长
          value: Strong
          note: 2024 年收入约 $600M；2021–2024 年 CAGR 56%；外部融资前自力更生做到 $100M；相较可比私营 DTC 品牌表现强
        - label: 财务透明度
          value: Critical Gap
          note: 无经审计财务；毛利率未披露；NRR / 流失率未披露；所有财务数据均由 CEO 披露；只有一份 SEC Form D
        - label: 管理层质量
          value: Adequate
          note: Kat Cole（CEO，前 Focus Brands COO）；经验丰富的零售高管；2024 年团队流动（CMO、CFO 变动）是观察项；创始人 Ashenden 于 2024 年 10 月卸任 CEO
        - label: 监管与法律风险
          value: Elevated
          note: FDA 118 份不良事件报告（肝损伤）；关于未经授权登记的集体诉讼；NZ 公平交易担忧；任何一线问题均未确认解决
        - label: 退出可选性
          value: Good
          note: >-
            2026 年 4 月 Grüns / Unilever 以 4x 收入完成 M&A，确认战略溢价；FMCG 买家池（Nestlé、Unilever、Haleon、Reckitt、Hershey）；若财务清晰，可能
            IPO
        - label: 估值吸引力
          value: Fair
          note: 隐含 EV/Revenue 2x 低于上市可比公司（1.26–4.2x），但考虑零披露仍属合理；若经审计利润率确认毛利率 >55%，可上调为有吸引力
    approximationNotes: |
      分数是基于八个研究章节汇总的公开可得证据作出的定性评估。没有数值尺度 — 定性描述为：强 / 良好 / 够用 / 一般 / 升高 / 关键缺口。财务透明度和监管得分反映客观证据缺口，而非编辑偏见。
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV033
      - CV038
