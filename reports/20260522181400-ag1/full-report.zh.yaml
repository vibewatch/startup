  - id: FP003
    title: AG1 护城河与竞争准备度 KPI
    type: kpi
    layout: standard
    summary: |
      AG1 拥有强品牌 / 认知护城河和独特认证优势，但在价格溢价可持续性和零售货架竞争上面临高严重度威胁。订阅流失率和零售动销是验证护城河耐久性的关键未披露指标。
    approximationNotes: >
      护城河评级为基于公开竞争证据的定性评估。状态标签：Strong = 耐久且近期侵蚀风险有限；At Risk = 已识别出有意义的近期威胁，且竞争压力活跃；Developing = 新建立的位置仍在争夺中；Weak =
      结构性有限或缺失；Unknown = 关键指标未公开披露。
    data:
