        - ~25% — 需要多个正面结果同时落地
        - 审计不及预期；FDA 升级；健康赛道倍数压缩
      - - 基准
        - 收入维持在 $600–700M；保持盈利但不披露毛利；零售渠道贡献收入且没有完全蚕食 DTC； 估值小幅重估；IPO 或并购按 2.5–3x 收入
        - 1,200–1,800
        - 2.0–2.5x EV/Revenue（相对公开可比公司的私营公司折价）
        - ~55% — 最贴近已观察数据；与当前标记一致
        - 当前入场回报持平；FDA 风险未解决；股权结构表仍不透明
      - - 悲观
        - FDA 警告信或召回；集体诉讼和解成本重大；零售扩张产生蚕食；流失加速； 经审计财务显示毛利率低于估计；以低于 1x 收入估值折价融资
        - 300–700
        - 0.5–1.0x EV/Revenue（困境 / 受损情景）
        - ~20% — 需要多个负面事件同时发生，但考虑风险堆叠并非不可能
        - 监管升级 + 诉讼 + 毛利披露同时爆发
    notes: |
      估值区间来自可比公司倍数和 AG1 CEO 披露的约 $600M 收入。所有数字均为指示性企业价值。AG1 没有经审计财务； 这些是分析估计。概率信号是主观评估，不是量化模型。
    claimRefs:
      - CV027
