            title: 健康声称受科学审视，抬高诉讼和监管风险
            body: >
              AG1 的核心价值主张——每天一勺可替代多种补充剂并提供全面营养益处——已受到 Harvard、McGill 和 Columbia 多位独立科学家的质疑。 公司临床试验样本小（通常 30 名参与者）、周期短（4
