  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >
              AG1 的可触达市场位于三层嵌套品类的交叉处，每一层都给出不同的总机会视角。最窄口径下，AG1 竞争的是全球绿粉和一体化超级食物粉细分市场——
              这类浓缩多成分膳食补充剂，把叶菜、藻类、草本、适应原、益生菌和功能性成分合并到单次食用份量中。该细分市场由多成分便利性定位和高端定价定义，
              不包括单一成分蛋白粉、独立矿物质补充剂、草本胶囊产品和运动专用表现配方。在这个品类里，AG1 以每月 $79 的价格对标 Bloom Nutrition 约每月 $35 的竞品，定位为高端领导者。

              中间层是更广泛的膳食补充剂市场，涵盖维生素、矿物质、益生菌、草本补充剂、氨基酸和无需处方销售的特殊配方。 在美国，该市场受 1994 年 Dietary Supplement Health and
              Education Act（DSHEA）监管；该法将补充剂归为食品而非药品， 免除 FDA 上市前审批，并把健康声称限制在结构 / 功能语言，而非疾病治疗声称。所有 AG1 产品页面都带有标准 FDA
              免责声明星号。

              最外层语境是全球健康经济。Global Wellness Institute 估计其 2024 年规模为 $5.6T——这个宽口径框架将膳食补充剂放在预防性健康支出中一个有争议但快速增长的细分市场里。 AG1
              可触达市场的关键排除项包括处方营养品、GLP-1 减重药（正在成为部分健康投资的替代品）、代餐服务、传统食品饮料， 以及靠刺激物而非营养完整性竞争的能量饮料。现状替代品包括个人补充剂组合（复合维生素 + 益生菌
              + 维生素 D + 鱼油）、 全食物饮食和竞品绿粉混合物。
            claimRefs:
