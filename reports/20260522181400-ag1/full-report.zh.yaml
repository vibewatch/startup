      - number: '3.2'
        title: 直接竞争者画像——高端绿粉与一体化营养
        blocks:
          - type: paragraph
            body: >
              Bloom Nutrition 是最具战略意义的直接挑战者。公司由 Mari Llewellyn 和 Gregory LaVecchia 创立，获得 Nutrabolt 约 $210M 支持 （Nutrabolt
              自身由 Keurig Dr Pepper 支持）；Bloom 2023 年收入估计为 $175–200M，2025 年目标为 $350–400M。 其核心绿粉和超级食物粉 30 份零售价为
              $29.99–$39.99（约每份 $1.00–$1.30），相对 AG1 有 2–3× 价格优势。 Bloom 提供九种口味，而 AG1 只有单一选择；这对口味驱动买家是有意义的差异点。不过，Bloom
              的七种专有混合物和未具体说明的第三方测试， 持续受到注册营养师批评，认为可能存在「fairy-dusting」——为了营销吸引力而低剂量添加成分，而非达到临床有效剂量。 Bloom 在 2024–2025
              年转向饮料（能量饮料、汽水）的战略，可能降低与 AG1 在绿粉补充剂上的直接竞争，同时增加更广泛消费者健康钱包竞争。

              Ka'Chava 把自己定位为一体化代餐，而不是绿粉。产品含 85+ 种超级食物、25g 植物蛋白、六种蘑菇适应原和消化酶， 全价为 15 份装 $69.95（$4.66/份），订阅价约 $59.95（约
              $3.99/份）。分销包括 Costco（30 份袋装）和 Target（单份装）。 Ka'Chava 每份热量更高（约 240 kcal），并以代餐框架解释其更高价格。一篇独立评测指出，按 California
              Proposition 65 标准， 潜在铅含量可能构成安全问题；这是一项声誉风险，可能限制其机构和运动市场分销。

              Organifi Green Juice 占据有机 / 清洁标签定位，30 份约 $69.99（$2.33/份）。其全渠道零售扩张——全国 Sprouts、600+ 家 CVS 门店、 King
              Sooper、Fresh Thyme——与 AG1 正在执行的 DTC 到零售打法相似；公司曾报告 DTC 阶段收入同比增长 55%。 Organifi 曾位列 Vitamin Shoppe
              第二大超级食物品牌，说明口味驱动的有机定位可以在没有 AG1 规模的情况下建立零售忠诚。

              Amazing Grass Super Greens 是预算型既有玩家：USDA organic、non-GMO、14 种核心成分、含 10 亿 CFU 益生菌， 在
              Target、Walmart、Walgreens 和 Amazon 的 30 份零售价为 $26.99（$0.90/ 份）。作为 Keurig Dr Pepper 自 2017 年起的子公司， Amazing
              Grass 受益于强大的大众零售分销基础设施。AG1 现在已在 Costco 和 Target 与 Amazing Grass 同架。

              Huel Daily Greens 以广度和价值定位：91 种成分，包括维生素 D 和维生素 K（两者均不在 AG1 标准配方中）， 订阅价约 $1.50/份，一次性购买
              $1.88/份。多口味选择和有竞争力的价格，使其成为重视成分全面性而非品牌认知的成本敏感买家的可信替代。 Huel 报告全产品年收入约 £350M。

              Ritual Essential 代表一条不同替代路径：每月 $30 的 DTC 胶囊复合维生素，具备完整成分级透明度、可追溯来源、随时取消订阅条款和有临床依据的配方。 虽然它不是绿粉，但以约 AG1
              订阅价三分之一的价格，直接争夺同一「日常健康习惯」预算。

              Live it Up Super Greens（Nested Naturals）占据中端利基：多为有机成分、20+ 种超级食物和 50 亿 CFU 益生菌， 订阅价约 $1.33/份。它在 2026
              年排名中持续被营养师评为 AG1 最具整体价值的替代品。
