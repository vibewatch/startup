  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              AG1 在美国膳食补充剂市场运营，受 1994 年《Dietary Supplement Health and Education Act》（DSHEA）约束； 该法不要求补剂上市前取得 FDA
              批准。上市前，制造商对安全性和标签承担主要责任；上市后，若产品被指掺假或错误标示， FDA 才会介入。这个框架留下潜在监管风险：AG1 可以在上市前审查很少的情况下销售和营销，但任何可信的不良事件模式都可能触发
              FDA 调查、公开警告，极端情况下还会强制召回。

              FDA 的 Center for Food Safety and Applied Nutrition 在 2023 和 2024 年收到 118 起与 AG1 相关的不良事件报告， 其中 30
              多起记录肝酶升高或肝损伤，9 起需要住院，2 起被归为危及生命。FDA 于 2024 年底启动正式审查。虽然不良事件报告不能证明因果关系， Canterbury University 和 University
              of Hertfordshire 的同行评审毒理学家公开呼吁监管调查。AG1 的成分之一绿茶提取物， 在文献中与易感人群罕见肝毒性相关。

              AG1 宣称支持全身健康、提供最优剂量营养且有证据支持，可能招来 FTC 审查。FTC 禁止补剂提出缺乏依据的疾病预防或治疗声明， 其「胜任且可靠的科学证据」标准已被用于执法。AG1 于 2024
              年首次发表的临床试验仅纳入 30 名参与者、持续四周，并被 Harvard Medical School 教授 Dr. JoAnn Manson 批评为严谨性不足。2025 年，FTC 与补剂公司
              TruHeight 就欺骗性健康声明和虚假评论达成和解， 显示执法意愿仍然活跃。

              2026 年 2 月，集体诉讼原告在加州中区联邦地区法院提起 Hoke v. AG1 (USA), Inc.，指控 AG1 未经清晰同意将消费者纳入自动续订订阅， 并把取消流程做得不合理地困难，违反
              California Automatic Renewal Law、Unfair Competition Law、Consumer Legal Remedies Act 和 False Advertising
              Law。另有 2025 年 5 月提交的仲裁请求称，AG1 将产品宣传为可提供全面营养，但实际缺少铁、维生素 D 和 omega-3 脂肪酸等关键营养素。AG1 的服务条款把大多数个人争议导向有约束力的仲裁，但
              Amazon 购买者可能绕过该条款。

              新西兰 Commerce Commission 指出，AG1 在生产已迁往 Utah 后，直到 2024 年 5 月仍继续使用 Made in New Zealand 营销；若属实， 可能违反 Fair
              Trading Act。新西兰 Ministry for Primary Industries 也启动了单独调查。AG1 的铅含量触发 California Proposition 65
              警示；公司自己发布的重金属规格允许每勺最高 4.56 微克铅，约为 Prop 65 每日 0.5 微克安全港的 9 倍，不过 NSF Certified for Sport 认证确认产品满足另一套 USP 限值。
