      - number: '4.2'
        title: 成本结构、毛利率与供应链
        blocks:
          - type: paragraph
            body: >
              AG1 的成本结构由三项主导：销货成本（原料采购和合同制造）、履约与最后一公里物流，以及效果营销。毛利率未公开披露；高端 DTC 补充剂品牌通常报告 55–70%
              的混合毛利率，但渠道转向零售后——会员仓储和大众零售商通常只给供应商留下 12–20% 毛利率——零售收入从零扩大到总收入中有分量的占比后，AG1
              的混合毛利率会被压缩。公司没有披露预测渠道收入组合，毛利率预测因此带有猜测性。

              2022 至 2024 年间，制造端经历了重要供应链重组。直到大约 2022–2023 年，AG1 几乎全部在新西兰 Nelson 的 Alaron Products 生产；随后公司与犹他州 Capstone
              Nutrition 签订新合同，把主要生产转移到美国。这次转移导致 Alaron 裁员约 180 人。Newsroom NZ 的 Powder Keg 调查（2024 年 11
              月）披露，多数生产已经迁往犹他后，AG1 仍在官网把产品宣传为「新西兰制造」；新西兰 Commerce Commission 表示，这种做法可能违反公平交易法规。Newsroom 询问后，AG1
              从官网删除了「新西兰制造」表述。CEO Cole 团队承认了转移，称新西兰和美国工厂服务不同市场，过渡期标签一致性存在滞后。

              履约由 Stord 负责；它是美国多仓设施运营商，使用机器人和自研 OMS/WMS 软件，AG1 2023 年 10 月选择 Stord 来支撑 DTC
              与零售全渠道扩张。双方合作把第三方物流、最后一公里配送和库存管理整合到单一供应商。供应链透明度是公司公开提出的优先事项：AG1 2025 Impact Report 重点介绍了与 Sourcemap
              的合作，已对关键植物性原料实现 100% 数字化映射，并把自动化供应商风险评估接入运营。

              历史上，营销开支是制造成本之上最大的可变成本。AG1 单是播客广告每月就花约 $2.2 million，约合每年 $26 million；按 2022 年播客节目数量计算，它是全球第三大播客广告主（仅次于
              BetterHelp 和 Manscaped）。联盟分销方每笔推荐销售获得约 20% 佣金。2025 年，公司把总营销预算削减 40%，将资金转向四项双盲随机对照临床试验（先承诺投入 $10
              million，2025–2028 年总承诺 $20 million）。管理层称，尽管营销开支下降，2025 年 Black Friday 销售额仍增长 40%，但未披露基准比较期和渠道组合。
