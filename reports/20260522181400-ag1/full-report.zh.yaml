        - CAC 决定每年 $26M+ 播客投放是否 ROI 为正；也是比较零售与 DTC 经济性的关键
        - 按渠道索取 CAC（播客、付费社交、零售）和 LTV:CAC 比率；与已披露的达人支出对照
      - - 订阅用户流失率和队列留存
        - 月流失率假设从 5% 改为 3% 或 8%，估算 LTV 会相差约 60%；直接影响估值
        - 索取月流失率、年度留存曲线和按金额计 NRR；用 Earnest Analytics 交易数据交叉验证
      - - 账面现金和月度烧钱
        - AG1 在 2024 年 11 月募资 $115M，同时推进零售扩张；没有烧钱数据，现金跑道未知
        - 索取经审计资产负债表；通过银行证明或含营运资本明细的管理账独立核验
      - - 按渠道拆分收入（DTC 订阅 vs. 一次性购买 vs. 零售）
        - 不披露渠道组合，就无法量化零售毛利稀释影响；混合毛利模型也无法建立
        - 索取渠道级收入披露；通过 Costco/Target 买手关系取得零售终端售出数据
    notes: >
      这五个缺口目前都无法从公开来源解决。AG1 是私营公司，无义务披露财务；但每个缺口都是投资承销的重要输入。Earnest Analytics、Second Measure
      等交易数据聚合商可提供美国刷卡消费趋势的部分代理数据，但只覆盖美国本土 DTC 渠道，不包括零售和国际收入。
