      在乐观、基准和悲观情景下，AG1 企业价值区间相对于当前约 $1.3B 最新已知估值标记的潜在回报。乐观情景假设 $600–750M 前瞻收入适用 3.5–4x 收入倍数；基准假设 2–2.5x；悲观假设 0.5–1x。
