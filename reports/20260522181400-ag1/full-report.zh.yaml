      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: AG1 主导的是小品类，不是大市场
            body: >
              AG1 市场分析的关键框架是：其 2024 年 $600M 收入代表它在小品类（绿粉，全球 $3.1–5.8B）里拥有强势领导地位， 而不是对美国广义补充剂市场（$68.7B）哪怕边际渗透。这使 AG1
              的增长故事本质上成为品类扩张故事——要么绿粉向广义补充剂市场靠拢， 要么 AG1 扩展到相邻品类。2025 年推出 AGZ 睡眠补充剂以及零售扩张，都指向后一条路径。投资者应跟踪品类增长数据（而非总补充剂
              TAM） 以及 AG1 在绿粉中的份额。
            calloutType: insight
            claimRefs:
              - CM010
              - CM016
              - CM006
          - type: callout
            title: 高端定价在结构上容易受到功效审视冲击
            body: >
              AG1 每月 $79 的价格溢价建立在感知功效和品牌信任上，而不是监管保护或独占 IP。2026 年 1 月 Bryan Johnson–AG1 公开争议、 McGill 和 Columbia 的学术批评，以及
              JAMA 2022 年关于复合维生素的元分析，共同构成可信且增长中的公众怀疑。 随着懂健康的消费者增加（同样由推动品类增长的健康趋势带动），临床证据门槛会提高。AG1 的 $20M 研究承诺和计划中的 RCT
              是正确战略回应， 但证据管线距离发表还有 2–3 年。在此期间，半价强势竞品进入是主要市场风险。
            calloutType: risk
            claimRefs:
              - CM034
              - CM035
              - CM036
              - CM037
              - CM039
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              AG1 位于一个碎片化竞争空间的高端顶点，至少横跨五类不同竞争者。直接日常绿粉同业——Bloom Nutrition、Organifi、Amazing Grass 和 Live it Up Super
              Greens——围绕成分配置、口味和价格竞争。相邻的一体化营养和代餐品牌，如 Ka'Chava 和 Huel Daily Greens， 围绕营养广度和便利性竞争。以 Ritual Essential
              为代表的复合维生素替代玩家，吸引那些想要科学透明、成本更低的胶囊型日常补充剂消费者。 现状替代品——全食物习惯、由零售单品维生素自行组装的 DIY
              补充剂组合、功能饮料——对任何高端单一产品健康习惯都构成隐性替代威胁。 可能进入者包括 CPG 和饮料巨头：Keurig Dr Pepper 已支持 Amazing Grass（2017 年收购）和 Bloom
              Nutrition 的分销基础设施， 使其成为该品类最大潜在渠道扰动者。

              AG1 的竞争定位围绕「全覆盖」便利性主张：每天一勺提供 75+ 种维生素、矿物质、益生菌、适应原和全食物浓缩物，通过 NSF Certified for Sport 认证， 月价
              $79–99。该定位锁住了一批忠诚高端用户，但持续承受价格敏感风险，并面对竞品以低 40–70% 的成本提供可比或更宽配方的加剧威胁。 2025 年进入 Costco、Target、Vitamin Shoppe
              和 Amazon 等零售渠道，使 AG1 首次与 Amazing Grass、Bloom 和潜在自有品牌替代品直接同架； 对缺少 DTC 播客赞助传递品牌语境的新买家来说，竞争比较动态已发生实质变化。
            claimRefs:
