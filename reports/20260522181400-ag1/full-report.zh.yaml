      - number: '8.3'
        title: 可比估值——上市可比公司与并购先例
        blocks:
          - type: paragraph
            body: >
              因为 AG1 是私营公司且没有经审计财务，以上市可比公司和近期并购交易为锚的收入倍数框架，是最可辩护的估值视角。 可比组包括高端 DTC /
              健康生活品牌、与订阅相邻的消费健康公司，以及相关并购交易——不包括大众市场 CPG 同业， 因为后者分销经济性和利润率结构差异很大。

              Vita Coco Company（NASDAQ: COCO）是最接近的上市类比，FY2025 收入 $609M，几乎与 AG1 披露的约 $600M 相同； 截至 2025 年底 EV/Revenue 倍数约
              4.2x。Vita Coco 已盈利，毛利率约 36–39%，经营利润率约 14%，FY2025 净利润 $71M。 其订阅经济性弱于
              AG1（大宗饮料对比习惯型补剂），但凭借持续增长和干净财务，市场按纯收入倍数给它定价。 如果 AG1 用 Vita Coco 的 4.2x 倍数套 $600M 收入，隐含企业价值约 $2.5B——接近当前
              $1.3B 最近已知估值的两倍。

              BellRing Brands（NYSE: BRBR）——Premier Protein 和 Dymatize 的所有者——是规模更大的可比公司，FY2025 收入 $2.3B。 其 EV/Revenue 约
              1.26x、EV/EBITDA 约 5.7–14.4x，反映的是增长较慢的传统 CPG，通过会员店和大众渠道分销，且已披露利润率（毛利率约 33%）。 BellRing 相比 Vita Coco 和 AG1
              倍数更低，原因包括：没有 DTC 订阅成分、面向大众市场货架分销、增长适中（同比 16%）。 AG1 更强的品牌溢价和订阅模型，支持高于 BellRing 的倍数。

              Hims & Hers Health（NYSE: HIMS）是数字优先订阅健康平台，FY2025 收入 $2.35B，同比增长 59%，毛利率约 74%，EV/Revenue 约 3.0x。 HIMS
              因订阅收入模型和高毛利，相对传统 CPG 有溢价，但也面对自身监管逆风（GLP-1 复方配制）。AG1 DTC 订阅模型在习惯形成和定价权上与 HIMS 结构相似。Grüns 并购（2026 年 4 月
              Unilever 交易）：据报道，Unilever 以约 $1.2B 收购 Grüns，对应约 $300M 年收入—— 隐含约 4x 收入。Grüns 拥有约 1M 客户、每日出货 10M
              颗软糖、已盈利超过一年，并进入 Target、Walmart、Costco 零售。 该交易确认，战略收购方会为有品牌、盈利、零售渗透强且消费者牵引力足的补剂玩家支付 4x+ 收入。
