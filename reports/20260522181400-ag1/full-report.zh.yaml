      - number: '8.2'
        title: 融资背景、入场价格与稀释压力
        blocks:
          - type: paragraph
            body: >
              AG1 是一家注册于开曼群岛的私营公司，在美国运营。其资本结构不透明：未公开提交经审计资产负债表、利润表或现金流量表。 公司的 SEC 记录仅有 Athletic Greens International,
              Inc.（CIK 1862737）在 2021 年 5 月 17 日提交的一份豁免发行 Form D， 在 Rule 506 豁免下从总发行额 $10.5M 中募得 $9.6M。两个重要机构轮次是：（1）2022
              年 1 月由 Alpha Wave Global 领投的 $115M Series B 轮，投前估值 $1.2B；（2）2024 年 11 月追加 $115M，沿用 2022 年轮次的 $1.2B 投前估值。
              已确认融资总额超过 $230M。2024 年 11 月该笔融资后隐含投后估值约 $1.3B；假设无重大债务（未确认），企业价值约等于投后估值。

              三年估值持平，从分析角度看异常。一家公司三年内收入从 $160M 增至 $600M（3.75x），且声明达到盈利里程碑，通常会在后续融资中上调估值。
              可能解释包括：（a）投资者要求以低于前轮市场价的条款获得额外稀释；（b）存在二级偏好结构或棘轮条款，让「头条」投前估值持平，
              同时保护后期投资者；（c）管理层或创始人为退出前刻意限制估值上调；或（d）缺少审计财务，投资者不愿加价。 没有股权结构表和条款清单，无法判断哪种机制成立。CEO Kat Cole 在 2026 年 4
              月表示，AG1 因盈利而「有多条路径可选」， 并在自筹资金扩张——这意味着公司不受资本约束，可以选择 IPO、战略出售，或继续私有化。

              在二级市场，Forge Global 列示 AG1 最近已知估值为 $1.3B（2025 年 11 月），市场活跃度为「有限」，且没有 Forge Price， 说明二级交易清淡。Nasdaq Private
              Market 将 AG1 列为仅向合格机构投资者开放，未提供公开定价。公司尚未向 SEC 提交 S-1。 IPOs.fyi 列出「提及 IPO」和「保密提交」里程碑，但没有确认的 S-1 或 IPO 日期。
