            body: >
              2022 年至 2026 年 5 月，AG1 完成了大幅产品和渠道演进。制造从新西兰重组到犹他（2022–2024 年）。Next Gen 改配（2025 年 5
              月）是九年来首次实质性产品升级，包含成分数量增加、益生菌特异性提升、维生素和矿物质增强，以及四项临床试验背书。AGZ 睡眠补充剂（2025 年 8 月）打开第二产品品类。2025 年 1 月至 2026 年 5
              月，零售分销从零增加到 2,700+ 个实体网点，覆盖 Costco（600+）、Target、Vitamin Shoppe（640+）和 Ulta Beauty（1,500+）。

              公司宣布的 2030 年供应链目标，是借助 Sourcemap 对所有原料实现 100% 来源可追溯。除 AGZ 外，公司没有进一步公开披露产品管线；但 CEO Kat Cole
              表示，公司历史上第一次把对新产品「说 yes」作为战略优先事项。$20M 研究承诺和新的科学与创新顾问委员会 表明，未来产品在上市前可能需要通过临床验证。没有移动 app 仍是路线图缺口：AG1 既未宣布专属
              app，也未给出时间表。截至 2026 年 5 月，除零售扩张路径和研究管线外，产品与技术路线图大多未披露。投资人和分析师应把前瞻管线披露视为公司主张，并要求数据室证据来验证任何收入前产品声明。
