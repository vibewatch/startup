  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与配方科学
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，AG1 运营两个产品。旗舰日用绿粉 AG1 在 2025 年 5 月完成九年来首次重大改配（「Next Gen」），活性成分从 75 种增加到 83 种，每勺份量从 12g 提高到
              13g，并新增胆碱、钼、硼和甲基化 B 族维生素复合物，以提升生物利用度。Next Gen 配方有四种口味（Original、Citrus、Berry、Tropical），以 30 天袋装和单份旅行条包发货。

              配方分成五个功能复合物：超级食物与益生元混合物（总重量约
              7,400mg）、以绿茶和葡萄籽提取物为特色的抗氧化复合物、适应原与植物成分混合物（包括南非醉茄、红景天、灵芝）、消化支持混合物（菠萝蛋白酶、木瓜蛋白酶、榆树皮）以及定向益生菌
              混合物，包含五种经过临床研究的菌株——Lactobacillus rhamnosus GG、L. acidophilus NCFM、B. lactis HN019、L. casei LC-11 和 L.
              plantarum LP-115。维生素和矿物质在 Supplement Facts 标签中完整披露；专有混合物中各成分剂量没有单独披露，限制了第三方对功效的验证。

              AGZ 于 2025 年 8 月推出，是夜间粉剂补充剂，含 Magtein® 镁 L-苏糖酸盐、南非醉茄、藏红花、L-茶氨酸和缬草根，不含褪黑素。AG1 和 AGZ 都获得 NSF Certified for
              Sport® 认证，且为纯素、不含麸质、不含乳制品。AGZ 有 Chocolate、Chocolate Mint 和 Mixed Berry 三种口味。两个产品价格与原 AG1 订阅相同，均为
              $79/月（或一次性 $99）。AG1 更广的 SKU 策略包括 7 条装、14 条装试用包，以及面向 Ulta Beauty 等渠道零售发现的 AG1 Starter Kit。

              相比商品化绿粉，产品架构有三点差异化：NSF Certified for Sport® 状态（要求第三方对 280+ 种违禁物质逐批检测）、公司 $20 million 临床研究承诺（针对 Next Gen 的
              4 项成品 RCT），以及由首席科学与营养官 Dr. Ralph Esposito 领导的配方科学团队。缺口包括专有混合物剂量不披露、AGZ 成品公开数据有限，以及没有披露支撑配方的
              IP（专利）。适应原和功能蘑菇只披露到混合物层面的重量，没有确认单个剂量，因此无法用现有来源验证它们对可衡量结果的贡献。
