      - number: '2.4'
        title: 增长驱动因素与顺风
        blocks:
          - type: paragraph
            body: >
              五股结构性力量支撑 AG1 可触达市场继续扩张。第一，预防性医疗转向具有持续性：2023 年 74% 的美国成年人报告服用膳食补充剂 （CRN/Grand View Research），高于 2018 年约
              58%。COVID-19 疫情加速健康意识，疫情后的行为很大程度保留了补充剂习惯。 2025 年，超过 80%
              的补充剂买方将成分透明度和供应链可追溯性列为关键购买因素；这有利于投入认证（NSF、第三方测试）和临床研究的科学导向品牌。

              第二，电商渠道增长直接利好 AG1 的 DTC 模式。2024 年，美国线上维生素和补充剂销售市场达到 $25.6B（IBISWorld）， 线上占补充剂总销售比例从 2018 年仅 6.7% 升至
              2024–2025 年约 35–40%（NBJ Supplement Business Report）。 DTC 品牌报告的利润率约为零售分销品牌的 2×。在这种环境下，AG1
              的订阅飞轮——直接客户数据、经常性收入和个性化触达——具备独特优势。

              第三，绿粉和一体化补充剂细分市场增速（Emergen Research 为 11.2% CAGR）快于更广泛的膳食补充剂市场（7.78–9.5% CAGR）， 为 AG1
              提供高于市场的品类顺风。驱动因素包括便利性趋势、减少药片负担，以及 Millennials 和 Gen Z 对一体化简单方案的偏好。

              第四，AG1 于 2025 年宣布的新零售渠道扩张（Amazon、Costco、Target、Vitamin Shoppe），打开了不同于 DTC 优先消费者的买方群体，
              有可能在不蚕食现有订阅用户基础的情况下扩大服务市场。CEO Kat Cole 指出，零售的框架是提升现有消费者生命周期价值，而非单纯获取新客户； 这与 NRF 2025 提出的后全渠道战略模型一致。

              第五，人口老龄化提供长期结构性驱动。65 岁以上成年人是补充剂需求中增长中的细分人群；老年消费者贡献了全球补充剂销售约 30% （Grand View Research），且这一群体会随着 Baby
              Boomers 老去而扩大。AG1 转向临床验证（$20M 研究承诺、Next Gen 计划 4 项 RCT）， 是在为更懂健康、更受医生影响的人群建立可信度。
