      - number: '1.5'
        title: 产品创新与渠道扩张
        blocks:
          - type: paragraph
            body: >
              2010 年至 2024 年，AG1 一直坚持单一产品、单一渠道纪律，在保持产品统一的同时迭代配方超过 50 次。
              配方变化包括移除阻碍维生素吸收的亚麻籽、加入益生菌、提升维生素生物利用度，以及引入适应原和功能性蘑菇。 2025 年，AG1 推出「AG1 Next
              Gen」，这是旗舰产品的重配方版本，由四项金标准临床试验支持，并同步推出三种新口味 （Tropical、Berry 和 Citrus）。

              同样在 2025 年，AG1 推出 AGZ，一款夜间睡眠补充剂——也是公司十五年历史中的首个独立新产品。 该产品随 2026 年 Target 上架完成零售首发。公司承诺在 2025 至 2028 年间投入
              $20M 做临床研究，用人体试验支撑产品声称。

              渠道扩张在 2025 年真正启动。AG1 于 2025 年 4 月上线 Amazon，2025 年 6 月进入 Costco（公司首个实体零售合作伙伴）， 覆盖美国 600 多个门店，并在同年进入 The
              Vitamin Shoppe。2026 年，AG1 在 Target 全国上线，覆盖线上和门店； Target 也成为 AGZ 的零售首发渠道。CEO Cole
              称，每个零售合作伙伴都按高端环境、教育型陈列能力和品牌价值一致性筛选。 AG1 与 Stord 达成 $20M 供应链合作，用于全国履约基础设施。

              推动 DTC 增长的营销引擎依赖大规模播客赞助——AG1 同时与「数百」名播客合作，2022 年按节目数量计是第三大播客广告主。 关键长期合作伙伴包括 Tim Ferriss、Joe Rogan、Andrew
              Huberman、Rich Roll 和 Lex Fridman。AG1 还在 2025 年成为 LIV Golf 的 Ripper GC
              官方营养合作伙伴。这些影响者安排模糊了产品背书和投资关系；多位背书者（Ferriss、Hamilton、Attia）持有股权。
