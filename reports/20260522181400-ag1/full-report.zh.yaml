      - number: '4.3'
        title: 单位经济与订阅飞轮
        blocks:
          - type: paragraph
            body: >
              AG1 的订阅飞轮建立在习惯养成和切换摩擦上。公司在订阅（$79）和一次性购买（$99）之间设置每袋 $20 的价差，并向订阅用户捆绑赠品——摇摇杯、维生素 D
              补充剂、旅行装——提高感知价值，降低早期队列流失。DTC Newsletter（2025 年 3 月）把这些赠品列为核心机制：「订阅用户会获得摇摇杯、旅行装，甚至一瓶维生素
              D，来提高补充剂摄入。」公司还使用个性化达人落地页、购买后引导邮件流和习惯养成信息，把 AG1 固化成每日例行事项。

              关键单位经济指标没有公开披露。公司没有披露获客成本（CAC）、净留存率（NRR）、月流失率或客户终身价值（LTV）。基于可得收入（约 $600 million）和披露客户数（约 700,000），估计 ARPU
              约 $948/年，指向一名 $79/月订阅用户。在假设月流失率为 5% 的情况下（补充剂品牌 DTC 行业基准低端），平均客户生命周期约为 20 个月；在 COGS 和 CAC 分摊前、折现率为 0%
              时，估计每名订阅用户 LTV 约为 $1,580。播客广告渠道每年 $26 million 的开支代表一个已营销曝光成本，但在披露新增订阅用户量之前，无法换算成真实 CAC。联盟 20% 佣金按
              $79/月计算，相当于每名被推荐订阅用户每月 $15.80；若假设留存 20 个月，每名订阅用户联盟成本约 $316，对整体单位经济很重要，但没有确认流失数据就无法验证。

              进入零售渠道会结构性改变单位经济计算。在 Costco，AG1 获得约 $72.99/40 份，而 DTC 订阅等价为 $3.63/份（按 $109/30 Travel Pack
              标价），单件毛利被明显稀释。若零售客户后续仍在零售复购而非转为 DTC，就会形成低毛利收入流；公司则主张，零售服务的是原本不会直接订阅的净新增客户。
