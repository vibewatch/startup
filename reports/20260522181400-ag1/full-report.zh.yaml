              - CR019
              - CR025
          - type: callout
            title: 承诺投资前的八项优先尽调
            body: >
              价值最高的尽调问题包括：在 NDA 下取得完整 FDA 不良事件文件和 SafetyCall 毒理学意见；完整诉讼和仲裁敞口汇总； Capstone Nutrition 合同，覆盖排他性、IP
              所有权和终止条款；按 cohort 显示月流失率的 DTC 留存数据； 上市后三个月内的零售动销数据；四项 RCT 方案和中期结果；覆盖 Ashenden 角色和股东权利的董事会治理文件； 以及新西兰
              Commerce Commission 和 MPI 的监管往来函件。
            calloutType: recommendation
            claimRefs:
              - CR001
