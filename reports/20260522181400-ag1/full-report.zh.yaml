              - CV038
      - number: '8.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 观察：规模吸引人，财务不透明
            body: >
              AG1 的收入轨迹和品牌护城河在私营消费健康领域位居前列。不过，缺少经审计财务、增长 4x 但估值停留在 $1.2B、 以及 FDA
              主动调查，构成实质承销障碍。建议为观察——密切监测，推动公司进行财务披露；若老股入场价格反映 1.5–2x 收入倍数，或经审计财务发布，再重新评估。Grüns 并购先例确认，该品类存在 4x+
              收入的战略退出路径。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV014
              - CV021
              - CV038
          - type: callout
            title: 2022 年以来估值停滞是红旗
            body: >
              一家收入增长 4x 且声明盈利的公司，上一轮已知融资却仍按 2022 年 Series B 相同的 $1.2B 投前估值完成，
              说明它要么没有充分货币化股权，要么在释放结构性约束信号。可能解释包括：缺少审计导致投资者拒绝加价、 存在优先权压力或棘轮条款，或创始人控制定价。任何投资者如果在不了解股权结构的情况下以 $1.3B+ 投入新资本，
              都是在接受显著信息不对称风险。
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV039
          - type: callout
            title: Grüns 并购确认绿粉品类可获得 4x 收入溢价
            body: >
              2026 年 4 月 Unilever / Grüns 交易——以 $1.2B 收购一个三年品牌、收入约 $300M——意味着直接形态竞争者可获得 4x 收入倍数。 AG1 拥有 15 年品牌资产、$600M
              收入和更强临床投入，在战略进程中至少应获得相同、甚至更高倍数。 假设财务披露过关，这一并购先例是当前 $1.2–1.3B 估值低估 AG1 战略资产价值的最强证据。
            calloutType: insight
            claimRefs:
              - CV021
              - CV022
              - CV035
              - CV036
