      - number: '8.4'
        title: 乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >
              下面三个情景以 $600M 作为 2024 年收入锚点（CEO 披露），根据证据质量和可比公司套用不同收入倍数， 并相对同等上市交易价格加入 15–25% 的私营公司流动性折价。所有情景均假设 AG1 到
              2027 年仍保持私有化， 除非更早发生流动性事件。

              乐观情景下，AG1 披露经审计财务，确认毛利率 >55% 且经营盈利；FDA 不良事件调查在无召回或执法行动情况下解决； 零售渠道在 2025–2026 年新增 $150–200M
              收入，且没有实质订阅蚕食；公司展示 NRR 高于 90%。 这些进展与 Vita Coco 和 Grüns 交易先例一致，将支持在 $700–800M 前瞻收入上套 3.5–4x 收入倍数， 隐含企业价值
              $2.4–3.2B。相对当前约 $1.3B 最近已知估值，摊薄后新投资者股权回报为 1.8–2.5x。

              基准情景下，公司在没有完整财务披露的情况下继续保持规模化盈利。$1.2–1.5B 估值反映披露收入 $600M 上的 2.0–2.5x 倍数， 与 Vita Coco 4.2x
              相比体现私营公司折价。2025–2026 年零售扩张带来收入，但压缩综合利润率。若以 $1.3B 入场， 除非发生溢价流动性事件，3 年期回报大致持平到温和上行。若以 2.5x 收入进行 IPO 或并购（约
              $1.5–1.8B）， 回报为 1.2–1.4x，达不到早期风险投资预期。

              悲观情景下，一个或多个不利事件落地：FDA 发出警告信或要求改配方；集体诉讼和解带来重大成本；零售扩张主要是渠道迁移而非净新增收入， 价格敏感客户退出导致订阅流失加速。由于 Costco 定价，综合毛利率跌破
              40%。这种情况下，0.5–1.0x 收入（$300–600M）的下轮折价融资可能出现， 尤其当投资者要求审计尽调后才愿意按更高估值投入资本。2024 年 11 月轮次的现有优先股持有人会在 $1.2B
              投前估值拿回全额回报， 但普通股和早期投资者面临减值。
