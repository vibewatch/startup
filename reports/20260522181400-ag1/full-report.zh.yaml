      - number: '5.2'
        title: 工作流与客户体验
        blocks:
          - type: paragraph
            body: >
              AG1 的主要客户工作流是以订阅为锚的每日习惯：消费者通过播客赞助、社交媒体达人、零售货架或口碑发现产品；购买试用装或入门套装；转化为 $79/月经常性订阅；通过 Stord 的第三方物流网络每月收货；每天把一勺
              13g 粉剂加入 8–10 oz 冷水饮用；并完全通过移动端优化的 drinkag1.com 网页门户管理账户（截至 2026 年 5 月，没有独立 iOS 或 Android app）。

              用户要完成的核心任务是营养「保险」——补齐微量营养素缺口、支持肠道微生物多样性，并用一个每日动作锚定稳定健康习惯。运动员和职业人群还会把 NSF Certified for Sport®
              认证作为额外筛选标准，以确保没有违禁物质风险。AGZ 把工作流延伸到夜间，消费者在睡前 30 分钟服用 AGZ（4 oz 液体），以支持放松入睡和恢复。

              订阅平台支持暂停、跳过、换品和取消，不需要联系客服。截至 2025 年，Trustpilot 数据显示 2,000+ 名评测者给出 4.2/5
              综合评分；正面反馈集中在产品质量，负面反馈集中在发货延迟和缺少独立移动 app。AG1 从纯 DTC 转向全渠道（Costco、Target、Vitamin Shoppe、Ulta
              Beauty），改变了获客漏斗：试用 SKU 和入门套装专为门店发现和低承诺转化设计。缺少移动 app 是 Trustpilot 评价中反复出现的消费者诉求，也是相对数字优先健康竞品的功能缺口。
