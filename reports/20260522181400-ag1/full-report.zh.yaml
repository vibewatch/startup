          - type: callout
            title: 临床效应量有限且有待复现，限制差异化耐久性
            body: >
              AG1 的临床试验今天是营销差异化，但已发表结果显示效应量有限：选择性富集肠道细菌，却没有带来大幅微生物多样性变化；对健康成人的营养生物标志物只是增量改善。Bryan Johnson 的公开批评和 McGill
              University's 独立分析都质疑，这些观察到的收益是否足以支撑 $79/月价格，尤其是对营养已经充足的成人。公司赞助的试验尚未被独立复现。若独立复现不能确认效应量，临床差异化叙事会变弱。
