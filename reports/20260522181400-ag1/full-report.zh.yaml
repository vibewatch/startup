              - CR029
          - type: callout
            title: 零售扩张更像 DTC 见顶信号，而非渠道强势
            body: >
              多个独立来源显示，AG1 推进 Costco、Amazon 和 Target 零售，是对 DTC 订阅用户增长停滞的防御性回应。 如果零售蚕食 DTC 订阅，而后者客户终身价值通常是单次零售购买的 2–3
              倍，渠道切换即便带来销量增长，净财务影响也可能为负。 在接受零售扩张是净正向收入催化剂之前，投资者应要求细颗粒度的动销和 DTC 迁移数据。
