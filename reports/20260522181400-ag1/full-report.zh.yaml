  - id: TV004
    title: 可比估值表
    columns:
      - 公司 / 交易
      - 收入（$M，最近财年）
      - EV/Revenue 倍数
      - 关键指标 / 背景
      - 对 AG1 的参考价值
      - 局限
    rows:
      - - Vita Coco (COCO) — 上市公司
        - 609 (FY2025)
        - ~4.2x
        - 已盈利；毛利率约 37%；净利润 $71M；收入规模与 AG1 相近
        - 最佳可比：收入规模几乎一致，高端品牌化、DTC 与零售并行的消费者健康饮品
        - 产品品类不同（椰子水）；没有订阅模式；未计入上市公司与私营公司的折价
      - - Hims & Hers Health (HIMS) — 上市公司
        - 2,348 (FY2025)
        - ~3.0x
        - 毛利率 74%；收入增长 59%；数字优先订阅健康平台；2025 年净利润 $128M
        - 订阅模式和 DTC 获客引擎可比；品牌溢价和留存经济性相近
        - 收入大 4x；远程医疗模式结构不同；GLP-1 监管逆风
      - - BellRing Brands (BRBR) — 上市公司
        - 2,317 (FY2025)
        - ~1.26x
        - 毛利率 33%；拥有 Premier Protein 和 Dymatize；传统大众渠道 CPG 营养品牌
        - 可作为估值下限：大众市场、没有 DTC 的分销模式交易在 1.26x；AG1 的高端 DTC 模型支撑更高倍数
        - 分销模式不同（大众 / 会员店 vs. DTC 订阅）；毛利率和增速更低；不是 DTC 品牌
      - - Herbalife (HLF) — 上市公司
        - ~5,000 (FY2025)
        - ~0.25x
        - MLM 分销模式；销量下滑；债务负担高；美国市场有结构性逆风
        - 只作下限对比——说明分销模式对倍数的影响大于产品品类
        - 进入市场方式完全不同（MLM）；收入下滑；不适合作为高端可比公司
      - - Grüns / Unilever 并购 — 私营交易
        - ~300 (2025E)
        - ~4.0x
        - 2026 年 4 月据报道被 Unilever 以约 $1.2B 收购；已盈利；1M+ 客户；直接竞争形态（绿粉软糖）
        - 最相关并购先例：同品类、战略买方、相近商业指标、近期交易
        - 成立三年品牌 vs. AG1 的 15 年经营史；形态不同（软糖 vs. 粉剂）；Unilever 组合协同不适用于独立估值
      - - AG1（当前私营标记）
        - ~600（2024，CEO 披露）
        - ~2.0–2.2x
        - 投前估值 $1.2–1.3B；无经审计财务；声明盈利；累计融资 >$230M
        - 标的公司——按当前标记推算的倍数低于所有可比高端品牌公司
        - 私营公司；无审计；CEO 披露收入；监管和法务风险没有体现在可比公司中
    notes: >
      公开可比公司的 EV/Revenue 倍数截至 2026 年初，采用过去十二个月或最近财年收入，数据来自公开文件和股票分析数据库。 BellRing 财年截至 9 月 30 日；Hims & Hers 和 Vita Coco
      为日历年公司。Grüns/Unilever 数字基于媒体报道交易价值 （$1.2B）和估计年收入（约 $300M）；条款没有正式披露。AG1 收入未经审计，仅由 CEO 披露。所有 EV/Revenue 计算使用
      估计企业价值；AG1 隐含倍数用最近已知估值（$1.3B）作为企业价值代理。
    enumerationScope:
      coverage: exhaustive
      basis: >
        All meaningful publicly traded premium DTC/consumer health and supplement comparables with $300M+ revenue plus
        the most relevant M&A transaction in the greens supplement category as of May 2026. Herbalife included as a
        structural floor reference despite MLM model.
    claimRefs:
