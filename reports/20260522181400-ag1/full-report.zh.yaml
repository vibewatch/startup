      - number: '6.4'
        title: 留存、满意度与证据缺口
        blocks:
          - type: paragraph
            body: >
              AG1 不披露 NRR、GRR、队列生存曲线或订阅用户流失率。所有留存分析都必须依赖代理信号：评测情绪、取消流程设计，以及 DTC
              补充剂订阅业务的行业基准。订阅模式设计了明确的留存机制：欢迎套装（摇摇杯、旅行装、维生素 D 瓶）激励初始订阅；生命周期邮件 / SMS 流触达高风险客户；跳过和暂停选项降低自愿流失；首单 90
              天退款保证降低试用摩擦。这些都是记录充分的 DTC 最佳实践，且公司已经规模化执行。

              可得代理指标好坏参半。正面：Trustpilot 约 1,430 条评价给出 4.2/5，Innerbody 4.5/5，多位评测者提到持续每日使用（「我已经服用一年多了」在 Trustpilot
              证言中反复出现）。负面：UsefulVitamins 引用「三个月后取消」作为常见叙事，这与行业基准一致，即 60% 的补充剂订阅取消发生在第 2–3 个月。Trustpilot
              评价记录了订阅管理困难、地址变更摩擦和非自愿重新订阅的反复模式。BBB 为 D- 评级。Reddit（r/supplements）反馈对普通用户的价值感偏批判。

              DTC 补充剂订阅的行业基准数据（Jericommerce，2026 年）显示，普通品牌月流失率为 8–12%，拥有忠诚计划集成的一流品牌为 5–7%。补充剂订阅用户的 LTV 是一次性买家的 4.2×。AG1
              的 $600M 收入和订阅优先模型暗示，其留存指标高于行业平均，但没有披露数据就无法确认。最重要的证据缺口是没有任何公开队列或 NRR 数据；这在 DTC 订阅业务的风险投资尽调中是标准期待。
