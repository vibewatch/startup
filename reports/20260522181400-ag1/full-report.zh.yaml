      - number: '2.2'
        title: 市场规模测算——多重分析口径
        blocks:
          - type: paragraph
            body: >
              如果没有边界语境，任何单一 AG1 TAM 数字都会误导。三个差异明显的市场规模，对应三种不同的 AG1 机会框架。

              最宽口径下，主要分析机构认为 2025 年全球膳食补充剂市场约为 $203–210B；Grand View Research 给出 $209.52B， Precedence Research 给出同年
              $203.42B——3% 的差异来自品类定义、地域范围和方法论不同。两者均预计市场将在 2030 年代中期左右翻倍。 仅看美国，Grand View Research 估计 2025 年规模为 $68.74B，至
              2033 年 CAGR 为 8.5%；ResearchAndMarkets 则按更窄 OTC 口径估计 2024 年为 $54.24B。Nutrition Business Journal（NBJ）将 2024
              年美国市场估为约 $69.3B、接近 $70B。 这些不同估算为美国补充剂定义了 $54–71B 的宽基 TAM。

              补充剂订阅服务子市场——与 AG1 经常性 DTC 模式最直接可比——2024 年全球规模为 $11.6B，预计到 2032 年达到 $27.5B， CAGR 为 11.3%（Verified Market
              Research）。更快增速反映了订阅优先品牌相对于一次性零售购买的结构性优势。

              绿粉品类是 AG1 最窄、也最可防守的细分市场，但分析机构分歧最大：Growth Market Reports 估计 2024 年为 $3.1B， Emergen Research 为
              $3.5B，DataHorizzon Research 为 $5.8B——差距达 87%，源于「绿粉」与更宽功能成分粉之间定义差异。 CAGR 预测同样分化：DataHorizzon 为 7.5%，Growth
              Market Reports 为 8.5%，Emergen Research 预计至 2034 年为 11.2%。 北美占绿粉品类 36–45%，具体取决于来源，是单一最大区域市场。

              按 Emergen Research 基准估算，AG1 2024 年 $600M 收入约占全球绿粉市场 17%；按 Growth Market Reports 较低边界则升至 19%——
              说明它在一个小而快速增长的细分市场中拥有强势品类领导地位。相对整个美国补充剂市场，AG1 收入占比不到 1%，显示相邻品类仍有大量增长空间 （2025 年零售和产品扩张已印证这一点）。
