      执法、集体诉讼、订阅流失落在右上象限。制造失败和创始人治理危机发生概率较低，但属于关键级影响的尾部风险。缓释成熟度最高的是制造质量认证，最低的是创始人治理与法律敞口。
    approximationNotes: |
      发生概率与影响为作者基于截至 2026 年 5 月公开可得证据作出的定性评估。每个单元格列出该概率—影响组合下的主导风险标签；实践中多个风险可能共享同一单元格。
