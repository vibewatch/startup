      - number: '5.3'
        title: 制造、供应链与质量控制
        blocks:
          - type: paragraph
            body: >
              AG1 从大约 2022 年开始，把主要合同制造从新西兰 Nelson 的 Alaron 转移到美国犹他州 Ogden 的 Capstone Nutrition；这场多年迁移到 2024
              年已基本完成。转移导致新西兰约 180 个岗位流失，也引发 Newsroom NZ 对公司在过渡期间及之后继续使用「新西兰制造」营销说法的审视。Capstone Nutrition 已在 FDA 注册并获得
              cGMP 认证，提供完整合同服务，包括混合、胶囊填充、包装和质量文件。所有主要制造集中在单一合同伙伴手中，是重要的单点失效风险。

              质量保证分三层。第一，NSF Certified for Sport® 要求第三方逐批检测 280+ 种违禁物质、核验营养标签，并对制造设施开展年度审计。NSF International 认证获得
              USADA、MLB 和 NHL 认可。第二，AG1 出具按批次区分的分析证书（COA），覆盖重金属（铅、砷、镉、汞）、微生物污染物、过敏原、农药和残留溶剂；客户可向公司索取。第三，cGMP
              设施合规在制造层面提供流程和文件控制。ConsumerLab 2025 年独立测试在 AG1 样本中检出重金属，但低于监管限值——这对植物基补充剂并不罕见，却构成透明度风险提示。工厂 GMP 审计报告未公开披露。

              供应链可追溯性上，AG1 与 Sourcemap 合作，把 100% 关键植物性原料采购数字化映射到制造环节，并把 90% 关键原料追溯到地理来源，目标是在 2030 年实现 100% 来源可追溯。履约物流由
              Stord 处理；它是云端第三方物流商，与 AG1 的电商订阅平台集成。Stord 合作（宣布时 AG1 仍名为「Athletic Greens」）支持 DTC 发货在订阅量增长时快速放大。AG1
              还披露，2024 日历年测量碳排放减少 12%，并自 2019 年以来为缺粮儿童提供了 17 million 餐；两项都出自 2025 Impact Report。
