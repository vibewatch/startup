        - 高
        - FDA 询问仍在进行；监管 / 法务暴露；无经审计财务；股权结构表不透明
      - - 估值立场
        - 合理
        - 隐含 2.0–2.2x EV/Revenue 低于可比公司，但考虑私营公司披露缺口后仍算合理
      - - 决策含义
        - 监测；取得经审计财务，或老股入场价格低于 $1B 时再评估
        - 上调触发条件：审计 + FDA 解决 + 毛利率 >55%
    notes: |
      该建议对价格和证据都敏感。如果财务披露支撑当前收入和盈利说法，1.5x 收入或更低的老股入场价， 或可信 IPO / 战略流程，会重新打开买入逻辑。观察并不等于回避——意思是保持主动尽调，并在条件改变时准备投入。
