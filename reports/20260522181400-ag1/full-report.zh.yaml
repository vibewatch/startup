      - number: '7.6'
        title: 缓释措施、阈值与尽调问题
        blocks:
          - type: paragraph
            body: >
              AG1 的主要缓释组合包括：NSF Certified for Sport 认证及年度工厂审计和批次检测、Sourcemap 供应链可追溯平台、 已承诺超过 $10M 投入四项双盲 RCT 且计划再投入约
              $20M，以及任命 Dr. Ralph Esposito 为首席科学与营养官。 NSF 认证确实有差异化；主要竞争对手没有该认证。公司从资助单一成分试验转向成品安慰剂对照试验，方向正确； 但 2025 年发表的
              12 周、120 名成年人试验，还没有达到 Harvard Medical School 或同级监管者会认为足以定论 AG1 综合健康声明的证据门槛。

              投资者应跟踪的监测指标包括：FDA 对 AG1 本身的咨询或执法行动；Hoke v. AG1 中任何不利裁决或集体认证； AG1 的 NSF 认证状态是否实质恶化；新西兰 Commerce Commission
              是否启动正式调查；DTC 订阅用户数和收入趋势， 尤其是零售扩张到底是增量还是蚕食；Capstone Nutrition 产能或质量事件；以及 Ashenden 是否退出董事会或治理结构是否变化。

              需要重新评估的投资逻辑破裂触发项包括：FDA 基于肝损伤因果认定强制改配方或下架；超过 $50M 的重大不利集体诉讼判决， 迫使订阅做法结构性改造；失去 NSF Certified for Sport
              认证；投资后 12 个月内 Kat Cole 离职； 或披露此前未公开的重大监管违规。上述事件单独或组合出现，都说明系统性治理或产品安全失效，与高端品牌投资逻辑不符。

              关键尽调问题包括：在 NDA 下审阅完整 FDA 不良事件报告文件；汇总所有在进行诉讼和仲裁的法律风险敞口；审阅 Capstone Nutrition 合同条款， 包括排他性、终止触发条件和 IP 所有权；取得按
              cohort 显示月流失率的 DTC 留存数据；按零售商和 SKU 拆分的动销数据； 四项计划中 RCT 的临床试验方案和中期数据；覆盖 Ashenden 角色和股东权利的董事会治理文件；以及新西兰
              Commerce Commission 和 MPI 的监管往来函件。
