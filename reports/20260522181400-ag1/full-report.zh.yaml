          - type: callout
            title: 单一制造商集中与专有混合物不披露是结构性风险
            body: >
              AG1 和 AGZ 的所有生产都流经犹他州 Ogden 的 Capstone Nutrition；一家收入约 $600M
              的公司若押注单一工厂，就承担单点失效风险。工厂事故、质量召回或合同中断都会直接冲击全部收入。另一个问题是，AG1
              的专有混合物（Superfood、Antioxidant、Adaptogens）不披露单个成分剂量，独立科学家和消费者无法验证特定植物成分的剂量—反应主张。ConsumerLab
              发现低于限值的微量重金属——不是安全违规，但一个以透明度竞争、价格居高的产品仍要面对这一持续披露缺口。
