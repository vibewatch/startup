      - number: '7.3'
        title: 合作伙伴、供应商与依赖风险
        blocks:
          - type: paragraph
            body: >
              AG1 最尖锐的集中风险，是依赖 Utah Ogden 的 Capstone Nutrition 作为主要且看似唯一的合同制造商。AG1 约在 2022 年低调将生产从新西兰 Nelson 的 Alaron
              Products 迁出，导致 Alaron 300 名员工中近 180 人被裁。Capstone 是资质齐全的制造商， 持有 NSF、cGMP、TGA 和 Health Canada
              认证；但任何单一来源依赖都会让 AG1 暴露在 Capstone 产能约束、污染事件、劳资行动、 自然灾害或监管停产之下。改配方知识产权转移给 Capstone 还带来进一步风险：嵌入配方和工艺的专业能力如今留在
              AG1 自身组织之外。

              AG1 的影响者和播客营销生态是第二大依赖。公司每月在播客广告上花费约 $2.2M，Andrew Huberman、Joe Rogan、Tim Ferriss 等主播口播广告推动了不成比例的订阅获客。 2025
              年，AG1 将营销预算削减 40%，部分是回应科学可信度担忧。但任何旗舰影响者出现重大负面事件，都可能迅速削弱新增订阅用户流入， 而公司没有现成替代渠道。

              2025 年进入 Costco 600+ 家门店、Amazon、Target 和 Vitamin Shoppe，引入零售伙伴依赖风险。零售伙伴要求批发定价、促销支持和货架图合规，
              相比直面消费者压缩利润率。Costco 的商业模式要求周期性重新谈判货架位置，如果动销不佳可以下架 SKU。一名前 AG1 高管告诉 Newsroom， 零售扩张是 DTC
              收入增长停滞推动，而不是渠道强势，说明这一步偏防御，不是扩大可选项。

              100+ 成分供应商构成的全球供应链集中，会叠加风险。任何关键植物成分（如专有蘑菇混合物）或特定益生菌菌株中断，都可能迫使改配方或停产。
              气候事件、关键种植地区的地缘政治扰动、新原料进口监管限制，都会影响成分可得性。Sourcemap 可追溯平台提供可见性，但不能消除集中度； 为稀缺成分寻找替代供应商需要数月。
