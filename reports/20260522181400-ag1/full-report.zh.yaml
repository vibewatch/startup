      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >
              AG1 配方含 75 到 83 种成分，来自 100 多家全球供应商，横跨植物、矿物、益生菌和适应原类别。每个批次都必须满足 NSF Certified for Sport
              在纯度、标签准确性和禁用物质缺失方面的标准，因此需要完整批次检测和有记录的供应链来源。 复杂度带来多种失效模式：任一供应商层级污染、75+ 成分中任一标签不准确、土壤或制造设备带来重金属吸收，
              或益生菌在运输中活性衰减。

              FDA 对肝损伤不良事件的公开调查，是最迫近的安全风险。虽然 AG1 资助的 120 名健康成年人 12 周 RCT 未发现肝脏指标受负面影响，
              但该研究采用受控饮食下的健康成年志愿者，不能代表更广泛消费者；真实世界不良事件信号仍未解释。绿茶提取物对易感人群已知的肝毒性风险， 是一个合理生物机制。如果 FDA
              认定存在安全信号，补救措施可能从自愿修改标签到强制改配方或下架。

              铅污染是持续的运营和声誉风险。ConsumerLab 在 2025 年 4 月独立检测 AG1 后指出，其铅和重金属含量显著，水平不适合儿童和孕妇。 2015 年关于铅含量的和解显示该风险过去已经落地。AG1 与
              Sourcemap 合作，并承诺到 2030 年实现 100% 数字化成分可追溯，是正向缓释； 但 n 层追溯仍不完整，任何供应商替换原料都可能引入新污染物。

              一名前 AG1 员工在 2020 年称，公司发出了看起来发霉的成分，并在他提出担忧后解雇了他。该主张未公开审理裁决， 但它说明管理一套 75+ 成分配方、且供应基础全球化时，质量体系本身存在风险。AG1
              从未公开披露产品召回； 其 NSF 认证要求持续工厂审计和批次检测，质量保障显著高于行业平均水平。
