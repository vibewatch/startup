  - id: funding-valuation-and-investors
    title: Funding, Valuation, and Investors
    body: >
      AG1 was bootstrapped to approximately $100 million in annual run-rate revenue before taking its
      first external investment. The company's first equity round—amount undisclosed—closed in July
      2021 and was led by SC.Holdings, with participation from celebrity investors including Hugh
      Jackman, Cindy Crawford, Tim Ferriss, and Dr. Peter Attia. This was the first external equity
      in the company's 11-year history.

      The company's principal venture milestone came on January 25, 2022, when AG1 raised $115
      million in a Series B round led by Alpha Wave Global. The round valued AG1 at $1.2 billion
      pre-money, achieving unicorn status. New board members Rick Gerson (Alpha Wave Global chairman)
      and Mark Vadon (founder of Zulily and Blue Nile; former chairman of Chewy) joined as part of
      the investment. Returning investors included SC.Holdings, David Blitzer's family office Bolt
      Ventures, and Dr. Peter Attia. The round attracted a broad roster of sports, media, and
      business-figure angels. AG1 deployed this capital into brand marketing, R&D, product
      improvement, and global supply chain buildout.

      In November 2024, AG1 announced a second $115 million funding round, again led by Alpha Wave
      Global, with the same $1.2 billion pre-money valuation maintained. The SignalBase funding
      announcement (November 12, 2024) confirmed the raise and noted capital would be used for
      product innovation, research expansion, and customer experience improvements.

      Total confirmed capital raised across all known rounds exceeds $230 million (not counting the
      undisclosed July 2021 amount). No secondary transactions, debt, or credit facilities have been
      publicly confirmed. AG1 remains a private company with no stated IPO timeline.
