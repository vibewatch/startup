chapter:
  number: 1
  title: Company Overview
  summary: >
    AG1 (formerly Athletic Greens) is a direct-to-consumer nutritional supplement company founded in
    December 2010 by Chris Ashenden in New Zealand. The company sells a single green powder product
    containing 75–83 ingredients via a $79/month subscription, growing from ~$160M revenue in 2021
    to ~$600M in 2024 with declared profitability. Kat Cole succeeded Ashenden as CEO in July 2024
    following a podcast investigation revealing his New Zealand criminal history. AG1 achieved unicorn
    status in January 2022 with a $1.2B valuation after a $115M Series B led by Alpha Wave Global,
    and raised a further $115M in November 2024 at the same pre-money valuation. Beginning in 2025,
    the company expanded into retail for the first time via Amazon, Costco (600+ US stores), Vitamin
    Shoppe, and Target, while also launching its first new product, AGZ (sleep supplement).

sections:
  - id: identity-and-business-model
    title: Identity and Business Model
    body: >
      AG1, formerly known as Athletic Greens, is a global nutritional supplement company incorporated
      in the United States (Nevada) and the Cayman Islands. The company was founded in December 2010
      by Chris Ashenden, a former New Zealand police officer who sought to solve his own gut-health
      and nutrient-absorption issues with a comprehensive daily supplement. Ashenden bootstrapped the
      business from New Zealand before shifting operations to the United States.

      The company's flagship—and for most of its history, only—product is the AG1 powder, a daily
      nutritional supplement containing between 75 and 83 vitamins, minerals, probiotics, adaptogens,
      superfoods, and whole-food-sourced nutrients in a single 12-gram scoop. Each serving provides
      approximately 50 calories, 2 grams of protein, 6 grams of carbohydrates, and less than 1 gram
      of sugar. The product is NSF Certified for Sport, verifying third-party testing for purity,
      accurate labeling, and absence of banned substances. It is vegan, gluten-free, dairy-free, and
      suitable for ketogenic and paleo diets.

      AG1's go-to-market model is a direct-to-consumer (DTC) subscription priced at $79 per month
      (or $99 for a one-time purchase). For the first fifteen years of operations, the company sold
      exclusively through its own website and operated as a fully remote organization with employees
      in more than 20 countries. Revenue grew approximately four-fold from ~$160M in 2021 to ~$600M
      in 2024, at which point the company declared profitability. AG1 serves customers across North
      America, Europe, and Asia Pacific.

      Wikipedia identifies AG1's corporate headquarters as Carson City, Nevada; multiple 2022 press
      accounts described the company as New York-based, reflecting a remote-first structure with
      changing registrations. The company is incorporated in both US entities and the Cayman Islands.
