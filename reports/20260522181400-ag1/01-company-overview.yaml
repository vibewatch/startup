  - id: founders-leadership-and-key-person-risk
    title: Founders, Leadership, and Key-Person Risk
    body: >
      Chris Ashenden founded Athletic Greens (now AG1) in New Zealand in December 2010 and served as
      CEO until July 2024. Ashenden drove the brand from a bootstrapped startup to a unicorn through
      a narrow product-and-channel focus, podcast influencer marketing, and a subscription-first model.
      His departure from day-to-day operations was triggered by Newsroom NZ's "Powder Keg" podcast
      investigation, which revealed a serious criminal history in New Zealand: Ashenden was convicted
      of 43 breaches of New Zealand's Fair Trading Act for rent-to-buy property scams in which
      buyers lost deposits and improvements because title was never transferred. Courts ordered
      $182,000 in reparations against his wound-up companies—those reparations remain unpaid. After
      initially denying the convictions, Ashenden acknowledged his past and remained on AG1's board
      after his CEO resignation. His continuing board presence represents residual key-person and
      reputational risk.

      Kat Cole, a veteran consumer-brand executive, joined AG1 in December 2021 as President and
      Chief Operating Officer after completing approximately a decade at Focus Brands (parent of
      Cinnabon, Auntie Anne's, Moe's, and Carvel) where she served as President and COO. Cole was
      named CEO of AG1 on July 24, 2024, and has led the company through its first major product
      diversification (AGZ sleep supplement) and channel expansion (retail). Cole's background in
      scaling consumer brands from DTC to omnichannel directly addresses the strategic transitions
      AG1 is now executing.

      Paulie Dery, formerly CMO at YETI, joined as Chief Marketing Officer in August 2024 with a
      mandate to diversify AG1's marketing beyond its heavy reliance on podcast sponsorships. Dr.
      Ralph Esposito was appointed Chief Science and Nutrition Officer in 2025, formalizing scientific
      leadership for the company's $20M research commitment. Sam Diacos serves as CFO. The executive
      team has been materially rebuilt since 2021 with professional operators, reducing but not
      eliminating founder key-person risk. Cole's role as the key public face and strategy driver
      represents a new concentration of key-person dependency.
