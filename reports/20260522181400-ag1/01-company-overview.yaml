  - id: adverse-events-and-regulatory-scrutiny
    title: Adverse Events and Scientific Scrutiny
    body: >
      AG1 faces a cluster of intersecting adverse risks spanning founder conduct, scientific
      credibility of product claims, and emerging consumer litigation.

      Founder criminal history: Chris Ashenden, AG1's founder, was convicted in Auckland District
      Court of 43 criminal breaches of New Zealand's Fair Trading Act for fraudulent rent-to-buy
      property schemes operated between approximately 2003 and 2011. Buyers were led to believe
      they were purchasing homes but never received legal title. Courts ordered $182,000 in
      reparations against Ashenden's wound-up companies (Meguro Ltd, Home Finance Company Ltd, CMA
      Property Investments Ltd); these have not been paid. Ashenden personally received a court
      arrest warrant when he initially failed to pay personal fines; he settled those in 2014 to
      re-enter New Zealand. The Newsroom NZ "Powder Keg" podcast (published October 31, 2024),
      produced by managing editor Jonathan Milne after a year-long investigation, brought these
      details to global attention and coincided with Ashenden's exit as CEO. The company declined
      to confirm the investigation's role in his departure, stating only that transition was planned.
      Ashenden remains on the board; his prior denials of conviction, later corrected, amplify
      reputational risk.

      Scientific credibility: AG1's health claims have attracted consistent criticism from
      independent scientists. McGill University's Jonathan Jarry published a detailed critique
      concluding AG1 is backed by "very little scientific support," citing undisclosed proprietary
      ingredient dosages, lack of evidence for adaptogens, and non-specific probiotic strain
      research. Harvard Medical School's Dr. JoAnn Manson characterized AG1's clinical trials as
      lacking "rigor" compared to gold-standard multi-thousand-participant studies. Columbia
      University's Prof. David Seres stated there is "no high quality evidence of any health
      benefit from multivitamin supplementation in the general population." AG1's own December
      2024 clinical trial involved only 30 participants over 4 weeks; longevity entrepreneur Bryan
      Johnson (Blueprint, a competitor) publicly disputed findings, claiming "no significant changes
      in blood biomarkers compared to placebo." AG1 rebutted these claims citing multiple published
      studies and its $20M research commitment.

      Consumer litigation: Consumer rights law firms initiated investigations of AG1 in 2025 for
      alleged violations of state consumer protection statutes, specifically targeting false
      advertising claims. Allegations include overstating nutritional benefits and deceptive
      promotion of probiotic content. Potential class actions may proceed via Amazon purchasers
      who are reportedly not subject to AG1's arbitration clauses.

      No formal FTC or FDA enforcement action against AG1 has been confirmed as of the run date.
      Regulatory risk remains elevated given the structure of the supplement industry (no pre-market
      FDA approval required) and the volume of health-benefit claims made in AG1's marketing.
