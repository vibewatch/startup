- id: capital-intensity
  title: 'Cost structure and capital intensity: Pasqal still looks like a deep-tech buildout, not a lightweight software company'
  body: 'Public evidence points to a cost base dominated by R&D, specialized technical talent, manufacturing or assembly capability, customer enablement, and infrastructure expansion in France. The March 2026 financing announcement says proceeds will be used primarily to expand domestic infrastructure, double production capacity within 24 months, add roughly 50 hires, and fund an advanced fault-tolerant roadmap by the end of the decade. That spending profile is consistent with hardware-platform economics rather than software-only margins. Earlier financing materials also pointed to headcount growth, system scaling, and roadmap execution as primary uses of capital. Even without audited line items, the direction is clear: Pasqal’s gross-margin path is likely sensitive to system utilization, the mix between services and repeatable platform revenue, the ratio of shared cloud access to dedicated deployments, and the pace at which hardware manufacturing becomes more standardized. This does not
    make the model unattractive, but it means investors should expect continued burn and step-function capital needs until recurring software and production usage become a larger share of revenue. Public sources support capital intensity as a defining feature of the story, not a temporary side note.'
  claimRefs:
