  rows:
  - - Dedicated system deployments
    - Sale or long-term provision of systems to labs, HPC centers, or sovereign buyers
    - Contract / deployment milestone
    - Publicly implied, not quantified
    - Potentially high-value but lumpy
    - Request backlog, delivery cadence, and revenue-recognition policy
  - - Cloud access
    - Usage or target-based access through partner clouds and hosted environments
    - Jobs, shots, subscription, or access plan
    - Visible through provider and marketplace surfaces
    - Can be recurring if usage scales
    - Request usage mix, retention, and gross margin by cloud channel
  - - Software / emulation tooling
    - Pulser, EMU, and workflow tooling supporting development before hardware runs
    - Subscription, bundled access, or enablement fee
    - Visible strategically, not monetization-quantified
    - Could become highest-quality revenue if adopted broadly
    - Request standalone software ARR and attach rates
  - - Codevelopment / professional services
    - Enterprise and research projects that adapt workflows to Pasqal hardware
    - Project milestone or statement of work
    - Strongly implied by customer proofs
    - Useful wedge but lower-quality if nonrepeatable
    - Request services share of revenue and conversion to platform usage
  - - Partner / consortium revenue
    - Joint programs, pilot lines, and publicly funded initiatives
    - Grant tranche, milestone, or program payment
    - Supported directionally but not fully quantified
    - Can offset burn but may be nonrecurring
    - Request grant schedule and restrictions on use
  notes: The key public limitation is not whether these streams exist, but how much each contributes and how recurring each stream is today.
