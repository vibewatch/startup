  title: Pasqal is funded better than before, but still looks financially like a scale-up program rather than a self-funding platform
  body: The 2026 financing is large enough to matter and clearly supports infrastructure, hiring, and roadmap execution. The same disclosures also show that Pasqal is still in a capital-consuming build phase, not yet a publicly transparent recurring-revenue machine.
