- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Why public sources fall short
  - Specific diligence path
  rows:
  - - Revenue by stream
    - Cannot score recurring quality or margin potential precisely
    - Public sources describe business lines but not mix
    - Request audited revenue split across systems, cloud, software, services, and grants
  - - Gross margin and contribution margin
    - Cannot judge scale economics
    - No audited margin disclosure in retained public sources
    - Request 2025 audited statements and 2026 YTD management accounts
  - - Burn and runway
    - Cannot test financing adequacy directly
    - New capital is disclosed, monthly burn is not
    - Request cash balance, burn bridge, and covenant schedule
  - - Customer concentration
    - Cannot judge downside from a small number of flagship logos
    - Customer announcements do not equal revenue concentration data
    - Request top-10 customers by bookings, ARR, and receivables
  - - Pipeline conversion and backlog
    - Cannot connect technical traction to revenue durability
    - Proofs of concept are public, contracted conversion is not
    - Request booked backlog, weighted pipeline, and renewal rates
  - - Dilution and fully diluted cap table
    - Cannot model post-transaction ownership cleanly
    - Convertible and warrant terms are public, cap table roll-forward is not
    - Request pro forma cap table including all warrants, BSPCEs, and conversion assumptions
  notes: These are the exact blockers that prevent the chapter from becoming a full underwriting memo on economics.
