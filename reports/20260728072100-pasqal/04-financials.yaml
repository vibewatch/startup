  title: The main financial blocker is not access to capital alone—it is lack of proof on revenue quality and dilution-adjusted returns
  body: Public sources describe new money and ambitious uses of proceeds, but they do not disclose gross margin, recurring share, customer concentration, or detailed post-transaction dilution. Those omissions limit how confidently investors can value Pasqal today.
