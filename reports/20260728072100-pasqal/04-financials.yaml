- id: capital-adequacy-and-verdict
  title: 'Capital adequacy and verdict: 2026 financing is meaningful, but underwriting still depends on evidence the model can mature faster than dilution risk'
  body: 'The strongest part of Pasqal’s public financial file is financing structure. Official, legal, and filing sources align on at least €340 million of expected financing associated with the 2026 transaction path, including a €170 million private funding round and a committed convertible financing of roughly €170 million / $200 million. The SEC filing adds important texture: the March 2026 financing includes $312.5 million of senior unsecured convertible bonds for a $250 million subscription price, reflecting a 20 percent original issue discount, plus investment warrants equal to 125 percent of the initial conversion share count. The filing also states that closing depends on New Pasqal having access to at least $150 million before transaction expenses, with trust-account cash and future financings still relevant variables. That is enough to say Pasqal improved its funding position materially in 2026. It is not enough to say financing dependency is solved. The next underwriting questions
    are whether new funds are sufficient for roadmap milestones, whether dilution and redemption risk are acceptable, and whether commercial progress can outrun the burn required by a fault-tolerant hardware program. Financially, Pasqal looks funded to keep building; it does not yet look publicly de-risked.'
