  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险：量子的战略属性抬高交易、出口和上市复杂度
        blocks:
          - type: paragraph
            body: >-
              Pasqal 卖的不是普通 SaaS；它所在的技术类别越来越被各国政府视为战略资产。留存监管材料显示两件事叠在一起。第一，公司自己的 SEC
              申报文件列出了新兴技术的典型风险：商业化不确定性、对合作伙伴的依赖、知识产权保护需求，以及上市流程带来的交易完成风险。第二，欧洲监管动态已经把量子技术明确纳入更大的关键技术和两用政策框架。更新后的欧盟审查材料和出口管制规则，并不意味着
              Pasqal
              无法开展国际业务；它们意味着部分资本、所有权和跨境技术转移事件，可能比典型软件公司需要更多审查、许可或交易结构设计。投资人最该看到的是：这里的监管摩擦不在于已有执法记录多明显，而在于潜在复杂度。审批、分类和战略资产敏感性，可能在最需要速度的时候拖慢融资、合作或市场扩张。
