      - number: '8.3'
        title: 乐观、基准与悲观：结果仍取决于收入复合、证据扩张和倍数耐久性
        blocks:
          - type: paragraph
            body: >-
              Pasqal 披露仍太薄，不能假装精确，因此必须做情境分析。悲观情境很直接：客户转化继续缓慢，市场对量子增长倍数降温，Pasqal
              的产业化爬坡消耗现金的速度快过经济证据复合。沿着这条路径，今天的估值可能明显压缩。基准情境更平衡：Pasqal 从 2025
              年收入基础上增长，深化少数旗舰账户，标准化更多部署，并逐步挣进当前估值。乐观情境要求更强的条件——更快的客户转化、明显扩大的装机基础、更清晰的财务披露，以及市场持续相信中性原子相对其他技术路线可以拿到溢价估值倍数。关键在于，当前投资人需要的不是
              Pasqal 仅仅维持既有动能；他们需要公司在相对短的窗口内把动能转成大得多的经济证据。因此，即便公司本身仍显得高质量，当前价格也已经打得很满。
