      - number: '1.3'
        title: 融资历史、上市路径与规模信号
        blocks:
          - type: paragraph
            body: >-
              Pasqal 2026 年 3 月融资是文件里最清晰的公开标记之一，但其周边总额比标题更容易被误读。官方公告称，Pasqal 完成了一轮 EUR 170 million
              私募融资，并在业务合并相关安排中获得约另一个 EUR 170 million 的承诺可转换融资，预期融资总额至少 EUR 340 million。同一公告和同步 SPAC 新闻稿把公司估值定在约 $2.0
              billion，并列出 2026 年先在 Nasdaq 初始上市、同时为 2026 年或 2027 年 Euronext Paris
              上市做准备的计划。这些都是支撑充分的当前事实。没有同样清晰的是「累计融资」故事。官方材料还称 Pasqal 来自投资者的总融资超过 $300 million，而 SPAC 套件称本次交易可能带来超过 $600
              million 的总收益，只是因为该数字把 Bleichroeder 信托现金和 Pasqal 自有资产负债表现金也与新融资一起纳入。


              规模信号方向上很强，尽管经济性披露仍不完整。Pasqal 2026 年 3 月和 6 月官方材料称，公司员工超过 275 人，服务超过 25 个客户和合作伙伴；技术页现在宣称拥有 40 多个全球客户，Tracxn
              则报告 2026 年 6 月员工数为 301 人。产品和上市材料还声称已部署 7 台量子计算机，另有 3 台在产，并且法国和加拿大设施合计有潜力把产能提升到每年 13 台
              QPU。这些对一家私有深科技公司而言是有意义的运营信号，但不应被误认为已证明收入经审计后的耐久性或完整投资判断透明度。
