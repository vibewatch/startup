    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与平台范围
        blocks:
          - type: paragraph
            body: >-
              Pasqal 当前的公开定位，远不只是一个泛泛的「量子初创公司」标签。它在官网首页、关于页面、技术页面、Microsoft 提供商文档和 IBM
              合作伙伴材料中，都把自己呈现为全栈中性原子量子计算供应商，而不是单一实验室项目。核心叙事很一致：Pasqal 用光镊捕获有序排列的铷原子来制造处理器，在其上叠加可上云的软件，并试图把这套栈转化为优化、仿真和 AI
              相邻工业用例中的实用工作流。官方技术页比许多深科技公司网站走得更远，明确解释公司为何把该架构视为模拟和数字双模式、室温运行、并且设计上要接入高性能计算环境，而不只是停留在孤立实验室演示。


              身份和足迹数据也比许多私有深科技同业更扎实。Pasqal 当前地址列为 24 rue Emile Baudot, 91120 Palaiseau，公司现在把该地点标为全球总部，同时还公布了位于
              Riyadh、Boston 和 Seoul 的 MENA、北美和 APAC 总部，并在加拿大 Sherbrooke 设有据点。因此，在留存的 2026 年材料里，Palaiseau——而不是
              Massy——是最有依据的总部标签，尽管两者都处在更大的 Essonne / Paris-Saclay
              圈层内。同一批官方页面也显示，这家公司销售硬件、云访问、仿真和软件，而不是只讲未来科学故事；这为后文估值和客户章节提供了重要背景。
