      - number: '4.3'
        title: 成本结构与资本强度：Pasqal 仍像深科技建设项目，而不是轻资产软件公司
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，成本基础主要由 R&D、专门技术人才、制造或组装能力、客户赋能，以及法国基础设施扩张驱动。2026 年 3 月融资公告称，募集资金将主要用于扩大本土基础设施、在 24 个月内把产能翻倍、增加约 50
              名员工，并为本十年末的先进容错路线图提供资金。这种支出画像更符合硬件平台经济性，而不是纯软件利润率。更早的融资材料也把员工扩张、系统扩展和路线图执行列为主要资金用途。即使没有经审计的科目明细，方向也很清楚：Pasqal
              的毛利率路径可能对系统利用率、服务与可重复平台收入的组合、共享云访问与专用部署的比例，以及硬件制造标准化推进速度敏感。这并不意味着模式缺乏吸引力，但意味着在经常性软件和生产使用占据更大收入比例前，投资者应预期公司会继续烧钱，并出现阶梯式资本需求。公开来源支持把资本强度视为这个故事的定义性特征，而不是暂时性脚注。
