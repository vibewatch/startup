      - number: '1.4'
        title: 里程碑、商业验证与反向解读
        blocks:
          - type: paragraph
            body: >-
              作为一家私有量子公司，Pasqal 的里程碑路径异常清晰。2023 年 Series B 资助公司从约 100 名员工继续扩张，并点名了覆盖金融、化工、汽车、航空航天、制药和防务相邻领域的广泛客户群。2024 年
              IBM 合作随后把 Pasqal 从单独硬件故事重新框定为量子中心型超级计算工作流的参与者。2025 年，EDF 案例研究展示了在物理系统上运行的行业特定能源预测应用；2026 年 6 月，Crédit
              Agricole CIB 公开把双方关系从研究推进到 2026–2028 年工业化路线图。这些里程碑本身不能证明大规模、可重复收入，但确实说明 Pasqal 正在接触可信企业，而不只是发布实验室进展。


              反向解读同样重要，因为公司在行业经济性尚未稳定前就要进入公开市场。TNW 2026 年 7 月对 Pasqal 申报文件的审阅强调，2025 年收入约 €16.5 million，却对应 $2 billion
              价格标签，并突出管理层自己的披露：量子计算的商业牵引力可能永远无法充分出现。SEC
              文件本身比大多数风投支持公司的新闻稿更直白，同时提到新兴技术风险，以及法国外资审查限制可能延迟或阻止重大的非欧盟所有权变更。由此得到的图景不是一家失灵的公司，而是一家具有战略重要性的公司；它在商业化风险完全出清前，就要求公众投资者为长期扩张买单。
