      - number: '2.4'
        title: 增长驱动、采用约束与未解缺口
        blocks:
          - type: paragraph
            body: >-
              市场驱动因素是真实的。McKinsey 看到商业牵引力正在加速，QED-C 看到行业从研究主导的探索转向早期商业机会，多份中性原子市场摘要则把室温运行、云访问和更紧密的 HPC 对接列为顺风。Pasqal
              自己的垂直证据——与 Crédit Agricole CIB 的金融场景、与 EDF 的能源预测、与 IBM 的量子中心型超级计算——也对上了市场报告中最常见的早期用例类别：仿真、优化、材料或化学，以及高价值
              R&D 工作流。这种匹配在战略上有利，因为它意味着公司站在公开市场和行业分析都预期最早商业化的区域。


              但约束同样重要，而且对投资判断可能更关键。QED-C 把人才短缺列为最大扩张瓶颈之一，并称供应链定制化且脆弱。IQM 2026 年报告称，尽管 89% 的组织报告已有上手量子工作，只有 3%
              达到规模化部署；这冷峻地提醒我们，实验仍跑在运营使用前面。Global Market Insights 和 Future Markets 都点出扩展容错系统的成本和软件生态不成熟，Innovation News
              Network 与 PostQuantum 也认为商业采用仍落后于技术标题。结果是，一个市场显然正在形成，但 Pasqal
              可服务的细分市场大小，取决于公司能否在更广泛的「量子寒冬」或平台整合到来前，把联合开发和访问权转化为可重复、生产级的企业支出。
