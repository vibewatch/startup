      - number: '3.3'
        title: 分发与切换成本：云市场扩大竞争场，削弱纯技术路线锁定
        blocks:
          - type: paragraph
            body: >-
              公有云层在战略上很重要，因为它改变了客户感受竞争的方式。Azure Quantum 提供 IonQ 和 Quantinuum targets，并给出详细的提供商文档、target
              IDs、量子比特数、仿真器访问和计费提示。Amazon Braket 同样聚合多种技术路线，并宣传简单定价、工作流管理以及直接访问 QuEra 的 Rydberg
              系统。当云中介处理发现、访问和早期实验时，客户不需要过早押注一个硬件供应商。这降低了切换成本，也让首次接入更容易，但同时意味着 Pasqal
              会在同一买方工作流里与对手逐项比较。相反，推动本地、主权或数据中心部署的供应商——如 IonQ Forte Enterprise 或 IQM
              Radiance——在采购、延迟、合规或基础设施控制重要时，可以建立更黏的关系。Pasqal
              的欧洲身份和主权计算相关性在这种环境中有帮助，但公司仍需要更多公开证据，证明它能把这种定位转化为持续商业锁定，而不只是有利站位。如果没有更强的软件采用、参考部署或专有工作流资产，中性原子差异化可能被专家看见，却很难被买方充分货币化。
