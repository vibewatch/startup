  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Pasqal 最高的剩余风险集中在商业化、制造执行和融资敏感性上，而不是单一法律危机。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: 商业化 / 市场接受度
          values:
            - 3
            - 3
            - 1
            - 3
        - label: 制造和质量爬坡
          values:
            - 2
            - 3
            - 2
            - 3
        - label: 旗舰客户转化
          values:
            - 3
            - 3
            - 2
            - 3
        - label: 出口 / FDI 合规负担
          values:
            - 2
            - 2
            - 2
            - 2
        - label: 人才和跨职能招聘
          values:
            - 3
            - 2
            - 2
            - 2
    approximationNotes: 分数是从留存公开证据推导出的 1–3 序数判断，而不是公司内部风险登记册。
    claimRefs:
      - CR001
      - CR014
      - CR016
      - CR019
      - CR029
      - CR032
  - id: FR002
    title: 风险传导地图
    type: dag
    layout: wide
    summary: 技术和采用风险最关键，因为它们会传导到收入证明、融资灵活性，并最终影响估值。
    data:
      nodes:
        - id: d1
          label: 基准 / 可靠性不确定
          description: 公开证明对正常运行时间和可比性的覆盖并不完整。
        - id: d2
          label: 客户转化缓慢
          description: 试点可能无法足够快地变成生产。
        - id: d3
          label: 收入不透明
          description: 披露的经济性有限，削弱承销信心。
        - id: d4
          label: 融资 / 稀释风险
          description: 未来资本可能取决于里程碑可信度。
        - id: d5
          label: 估值压力
          description: 如果证明和资本效率滞后，叙事会变弱。
        - id: d6
          label: 运营压力
          description: 制造和招聘爬坡会带来执行负担。
      edges:
        - from: d1
          to: d2
        - from: d6
          to: d1
        - from: d2
          to: d3
        - from: d3
          to: d4
        - from: d4
          to: d5
        - from: d6
          to: d4
    approximationNotes: 该图为 IC 讨论简化了传导路径；真实反馈回路更复杂。
    claimRefs:
      - CR012
      - CR014
      - CR017
      - CR029
      - CR030
      - CR032
      - CR040
  - id: FR003
    title: 依赖地图
    type: dag
    layout: standard
    summary: Pasqal 同时依赖监管机构、旗舰客户、平台盟友、公共基础设施、专门人才和资本市场。
    data:
      nodes:
        - id: p1
          label: EU / 国家监管机构
          description: 量子领域的审查和出口管制边界。
        - id: p2
          label: 资本提供方 / 上市路径
          description: 2026 年融资和拟议公开市场路径。
        - id: p3
          label: 旗舰客户
          description: CA-CIB、EDF 和其他具名参考。
        - id: p4
          label: IBM / 生态伙伴
          description: 分发和工作流触达。
        - id: p5
          label: 主权 / HPC 基础设施
          description: GENCI、FZJ、CEA 访问和可信度。
        - id: p6
          label: 专门人才基础
          description: 物理、硬件、软件和解决方案人员。
        - id: p7
          label: Pasqal 执行引擎
          description: 公司必须同时协调这六项依赖。
      edges:
        - from: p1
          to: p7
        - from: p2
          to: p7
        - from: p3
          to: p7
        - from: p4
          to: p7
        - from: p5
          to: p7
        - from: p6
          to: p7
    approximationNotes: 依赖地图根据公开材料综合而成；Pasqal 未明确发布这张图。
    claimRefs:
      - CR021
      - CR022
      - CR024
      - CR025
      - CR028
      - CR034
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: Pasqal 的建议逻辑从真实技术证明出发，经过仍然偏薄的经济性，最后在当前价格下落到观望结论。
    data:
      nodes:
        - id: n1
          label: 差异化技术
          description: 中性原子定位和已安装 QPU 足迹可信。
        - id: n2
          label: 具名客户证明
          description: CA-CIB、EDF、IBM 和其他参考显示真实商业牵引力。
        - id: n3
          label: 经济性披露偏薄
          description: 收入可见性改善，但利润率、集中度和续约数据仍然偏薄。
        - id: n4
          label: 估值要求高
          description: ~$2B 对应早期收入，意味着大量未来成功已经计入价格。
        - id: n5
          label: 观望建议
          description: 密切跟踪，并在认为价格有吸引力之前要求更多证明。
      edges:
        - from: n1
          to: n4
        - from: n2
          to: n4
        - from: n3
          to: n4
        - from: n4
          to: n5
    approximationNotes: 该流程压缩了供 IC 讨论使用的章节逻辑；它不是量化模型。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV010
      - CV034
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 如果投资者把不同收入倍数套用到 Pasqal 披露的 2025 年商业收入基数上，得到的示意企业价值。
    data:
      items:
        - label: €16.5M @ 20x
          value: 330
          detail: 早期前沿硬件 / 软件风险下的严厉重置倍数。
        - label: €16.5M @ 40x
          value: 660
          detail: 仍属高溢价，但远低于当前估值标记。
        - label: €16.5M @ 80x
          value: 1320
          detail: 激进增长倍数，含有显著乐观预期。
        - label: €16.5M @ 120x
          value: 1980
          detail: 大致等于基于 2025 年收入的当前估值。
        - label: €16.5M @ 160x
          value: 2640
          detail: 需要持续的稀缺性溢价和快速执行信心。
    approximationNotes: 每个柱形都是分析师生成的 EV 结果，单位为 €M，使用 Pasqal 披露的 2025 年商业收入。该结果不是管理层指引。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV027
      - CV028
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 按熊市、基准、牛市和当前私募估值参考四种情景，给出示意性估值区间。
    data:
      items:
        - label: 熊市情景估值（$M）
          low: 700
          base: 950
          high: 1200
          unit: $M
          note: 采用仍慢，倍数受压
        - label: 基准情景估值（$M）
          low: 1400
          base: 1800
          high: 2200
          unit: $M
          note: Pasqal 主要靠后续业绩逐步消化当前估值
        - label: 牛市情景估值（$M）
          low: 2600
          base: 3200
          high: 4000
          unit: $M
          note: 收入、部署和溢价叙事同步走强
        - label: 当前私募估值（$M）
          low: 2000
          base: 2000
          high: 2000
          unit: $M
          note: 2026 年交易参考点
    approximationNotes: 区间来自分析师情景：基于公开证据、可比公司区间和里程碑逻辑推导，并非经审计预测。
    claimRefs:
      - CV001
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 面向投委会的简明指标：Pasqal 值得关注，但价格还谈不上明显便宜。
    data:
      items:
        - label: 当前私募估值
          value: $2.0B
          unit: pre-money
          detail: 2026 年交易参考
        - label: 2025 年商业收入
          value: €16.5M
          unit: official deck
          detail: 披露有帮助，但规模仍早期
        - label: 已安装 / 投产 QPU
          value: 7 + 3
          unit: systems
          detail: 作为私营前沿玩家，已有真实运营足迹
        - label: 上市可比公司区间
          value: $5.19B–$13.4B
          unit: market caps
          detail: 截至 2026 年 7 月 27 日的 IonQ、Rigetti、D-Wave
        - label: 建议
          value: Watch
          unit: IC stance
          detail: 公司质地强，价格要求高，还需要更多披露
    approximationNotes: KPI 只是把会影响决策的公开事实收拢起来，不能替代完整财务模型。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV011
      - CV012
      - CV013
      - CV034
      - CV040
