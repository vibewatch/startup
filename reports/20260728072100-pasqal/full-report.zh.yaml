companyProfile:
  summary: >-
    Pasqal 是一家法国量子计算公司，正在商业化中性原子处理器，同时提供面向优化、仿真和混合 HPC 工作流的云与软件栈。公开材料显示，公司采用分层模式，覆盖 QPU
    销售、云访问、联合开发和合作伙伴驱动的集成，并已在金融、能源以及主权 / HPC 场景拿到具名客户验证。公司已筹集大量资本，在 2026 年 6 月投资者材料中披露 2025 年商业收入为
    €16.5M，并在扩大法国工业产能的同时推进上市路径。
