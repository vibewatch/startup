  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义：Pasqal 卖的是一套栈，不只是处理器
        blocks:
          - type: paragraph
            body: >-
              普通投资者最容易犯的关键框定错误，是把 Pasqal 只当作硬件公司。公开材料显示的其实是分层供给：中性原子 QPU、远程和本地仿真器、云执行和任务管理、用于脉冲级编程的 Pulser、用于浏览器端上手的
              Pulser Studio，以及通过 IBM 和 Qiskit 正在形成的混合 HPC 工作流桥接。Pasqal 自己的软件栈页面在这里很有用，因为它明确区分了应用、SDK
              和执行层。商业上，这一点很重要，因为产品买方购买的不只是量子比特；买方购买的是一个工作流，从实验开始，经过仿真，最后才落到硬件执行。这种架构也解释了为什么 Pasqal
              既能服务研究密集型用户，也能服务需要更容易进入中性原子计算的企业团队。实际看，公司产品最适合理解为一个可编程中性原子平台，外面包着软件、云和集成接口。
