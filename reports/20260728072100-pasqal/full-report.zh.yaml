      - number: '4.4'
        title: 资本充足性与判断：2026 年融资有意义，但投资判断仍取决于模式成熟速度能否快过稀释风险
        blocks:
          - type: paragraph
            body: >-
              Pasqal 公开财务文件中最强的一块，是融资结构。官方、法律和申报来源在 2026 年交易路径相关的预期融资上保持一致：至少 €340 million，其中包括 €170 million 私募融资和约 €170
              million / $200 million 的承诺可转换融资。SEC 文件补充了重要细节：2026 年 3 月融资包括 $312.5 million 的高级无担保可转换债券，认购价为 $250
              million，反映 20% 原始发行折扣；同时还包括数量相当于初始转换股份数 125% 的投资认股权证。文件还称，交易完成取决于 New Pasqal 在交易费用前至少能获得 $150
              million，信托账户现金和未来融资仍是相关变量。这足以说明 Pasqal 在 2026
              年实质改善了资金位置，但不足以说明融资依赖已经解决。下一组投资判断问题是：新资金是否足以支持路线图里程碑，稀释和赎回风险是否可接受，以及商业进展能否跑赢容错硬件项目所需的烧钱速度。财务上，Pasqal
              看起来有资金继续建设；但它还没有在公开市场层面完成去风险。
