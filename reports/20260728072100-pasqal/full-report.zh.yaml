      - number: '8.2'
        title: 投资论点、反论点与可比公司：Pasqal 比公开市场量子泡沫便宜，但这还不够
        blocks:
          - type: paragraph
            body: >-
              公开可比公司有参考价值，也容易误导。一方面，IonQ、Rigetti 和 D-Wave 在 2026 年 7 月的公开股权市值都高于 Pasqal 的 $2 billion
              估值，说明公司并没有明显脱离当前量子市场的估值区间。另一方面，这些股票受公开市场动能、散户投机和不同收入披露制度影响，不能被当成 Pasqal 便宜的干净证据。更有说服力的论点来自 Pasqal
              自身属性：中性原子差异化、欧洲战略位置、可见客户项目和有意义的产业化计划。反论点同样强：公司经济性仍早，当前收入小，估值很大一部分依赖未来执行。因此，一组合适的可比公司只能说明估值说得过去，不能说明估值舒服。这个区别很重要，因为它区分的是“这个价格站得住”和“这个价格有吸引力”。
