  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式：多条货币化路径存在，但公开证据仍指向混合且早期的商业引擎
        blocks:
          - type: paragraph
            body: >-
              Pasqal 并不把自己呈现为纯 SaaS 供应商，也不是简单的硬件
              OEM。其公开页面反而暗示四条货币化路径：直接或专用量子系统部署、云访问收入、中性原子工作流周边的软件和仿真工具，以及与企业或主权项目相连的联合开发或专业服务工作。能源、金融、HPC
              和云集成中的客户与合作伙伴材料，都支持这种混合模式。对量子硬件公司来说，这种组合在商业上合理，因为在大规模经常性使用出现前，买方仍需要访问、赋能、基准测试和技术集成。但它也意味着收入质量还不明显同质。一部分收入可能是经常性或按使用量计费，另一部分可能由里程碑驱动、类似咨询，或与硬件部署周期紧密绑定。公开材料没有量化拆分。因此，财务问题不是
              Pasqal 能否货币化——答案显然是能——而是它能否在资本市场或客户耐心下降前，把足够多的货币化转向可重复、质量更高的收入。
