          detail: 只有最强账户公开展示了通向生产使用的路径，Crédit Agricole CIB 最早可能在 2028 年瞄准初始用例。
          tone: positive
    approximationNotes: 旅程阶段根据具名案例研究和负面采用评论综合而成；公开资料未披露各阶段之间的转化率。
    claimRefs:
      - CU001
      - CU005
      - CU008
      - CU027
      - CU031
      - CU032
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: Pasqal 的公开漏斗顶部证据强于底部：具名账户不少，但只有少数账户有新的运营细节。
    data:
      nodes:
        - id: n1
          label: 具名客户标识和用例
          description: 公开名单覆盖金融、能源、航空航天、工业和主权 / HPC。
        - id: n2
          label: 范围明确的技术试点
          description: 投资组合优化、智能充电、调度等具体问题会被共同开发。
        - id: n3
          label: 量子 / 模拟器验证
          description: 客户在 Pasqal 平台上，或通过 Qiskit 等伙伴生态，测试工作负载。
        - id: n4
          label: 产业化路线图
          description: 少数账户公开描述了向运营使用过渡的计划。
        - id: n5
          label: 生产扩张
          description: 这里的公开证明仍很窄，且大多面向未来，而非经收入验证。
      edges:
        - from: n1
          to: n2
          label: 筛出真实问题适配度
        - from: n2
          to: n3
          label: 技术验证
        - from: n3
          to: n4
          label: 证明经济相关性
        - from: n4
          to: n5
          label: 部署并续约
    approximationNotes: 这是一套逻辑模型，不是实测转化漏斗；Pasqal 未披露阶段数量或转化百分比。
    claimRefs:
      - CU010
      - CU016
      - CU017
      - CU031
      - CU034
      - CU035
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 公开证明质量在 CA-CIB 上最强，在 EDF 和 Thales 上也扎实；更宽的工业客户标识集合，在成熟度和留存可见性上弱得多。
    data:
      columns:
        - 证据质量
        - 结果具体性
        - 留存可见性
        - 生产成熟度
      rows:
        - label: Crédit Agricole CIB 账户
          values:
            - 3
