      - number: '1.2'
        title: 创始人、领导层交接与治理
        blocks:
          - type: paragraph
            body: >-
              Pasqal 的创始叙事一半是科学，一半是运营公司。留存材料中证据最充分的创始人组合来自 IBM 和 2023 年融资材料：Georges-Olivier Reymond、Christophe
              Jurczak、Alain Aspect、Antoine Browaeys 和 Thierry Lahaye 于 2019 年基于 Institut d’Optique 的研究创立 Pasqal。Alain
              Aspect 的 2022 年诺贝尔奖仍是公司合法性故事的核心，但 2024 年到 2026 年间，运营领导层图景发生了实质变化。2024 年 IBM 材料仍引用 Georges-Olivier Reymond
              的 CEO 表述，而 2026 年上市和客户合作材料引用的 CEO 已是 Dr. Wasiq Bokhari。Pasqal 自己的领导层页面称，Bokhari 于 2024 年 2 月出任董事长，2025 年 3
              月成为执行董事长，随后担任 CEO；当前领导层名单则把 Reymond 放在首席战略联盟官职位，并让 Loïc Henriet 回到 CTO 席位。


              这次高管重组并不小。TechCrunch 明确指出，它被「埋」在 SPAC 公告里；这意味着投资者不应假设公司在上市前仍保持创始人 CEO 的连续性。治理可见度仍然只是局部的：公开材料支持 Bpifrance
              继续担任董事会角色、未来将有法国非执行主席，以及主权监督的重要战略地位，但没有公布完整的现任董事会委员会图谱，也没有披露新公众投资者最终拿到的权利包。SEC 材料加上 TNW
              的反向解读表明，治理问题与法国外资审查规则和主权关切交织在一起，而不只是普通初创公司董事会动态。
