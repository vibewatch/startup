      - number: '7.3'
        title: 合作伙伴、客户与人才风险：Pasqal 最强证据集中在少数关系上，还要稀缺人才协同执行
        blocks:
          - type: paragraph
            body: >-
              Pasqal 目前的商业叙事靠少数强标杆撑着，而不是靠广泛披露的生产客户底盘。Crédit Agricole CIB、EDF、IBM、GENCI/FZJ 和 Thales
              都有价值，但它们也让证据质量高度集中：如果某个旗舰关系停滞，公司的市场动能观感可能迅速变化。IBM 关系尤其是双刃剑，因为它增强开发者触达，也把 Pasqal 部分市场进入叙事绑在一个更大的生态玩家身上。主权和
              HPC
              关系同样能拓宽分发，但也会引入补助、采购或政策节奏依赖。公司内部还必须同时协调研究、制造、云软件、企业合作和资本市场。任何组织扛这样的人员负担都不轻，量子领域又尤其缺少同时懂物理、工程、产品和解决方案销售的人才。结果是，客户集中、伙伴依赖和人才稀缺并非彼此独立，而是紧紧耦合成一组风险。
