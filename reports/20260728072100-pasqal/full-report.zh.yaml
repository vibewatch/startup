  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值与建议：Pasqal 看起来很扎实，但 $2B 标记已计入大量未来成功
        blocks:
          - type: paragraph
            body: >-
              Pasqal 的估值问题不在于公司缺少实质。到 2026 年中，公开材料显示它拥有真实的量子计算平台、具名企业和主权关系、7 套已安装系统及更多在产系统，并披露了 2025
              年商业收入基础。问题在于，投资人要为这些进展付出的价格。投前估值约 $2 billion 时，Pasqal 已不再是发现阶段的科学赌注；它被定价为领先商业竞争者。分析师材料披露 2025 年商业收入 €16.5
              million，这有帮助，但也让当前估值显得吃力，因为隐含收入倍数按普通标准仍极高。这并不意味着估值不可能成立——前沿赛道赢家在规模清晰前往往看起来昂贵——但它确实要求投资人保持价格敏感。基于公开证据，今天的正确判断是观察而不是投资：尊重资产，但不要把技术可信度误当成自动便宜。
