      - number: '2.2'
        title: 规模测算视角：可衡量收入正在出现，但宽口径 TAM 仍夸大近期现实
        blocks:
          - type: paragraph
            body: >-
              公开来源现在支持多种市场规模测算视角，但这些视角不能互换。McKinsey 2026 年监测估计，量子计算公司 2025 年收入超过 $1 billion，到 2028 年可能达到 $3.2 billion 到
              $4.4 billion，同时把 2035 年行业总潜在价值放在 $1.3 trillion 到 $2.7 trillion。QED-C 略保守，也切得更细：它估算 2025 年全球量子计算市场约 $1.4
              billion，到 2028 年超过 $3 billion；其更广义的行业状态页面则称，包含非计算板块在内的整个量子行业 2025 年达到 $1.9 billion。The Business Research
              Company 采用更宽的「企业量子计算」定义，因此报告 2025 年市场为 $4.78 billion，2026 年增至 $6.28 billion，并在 2030 年达到 $18.54
              billion。这些数字与其说互相矛盾，不如说取决于边界。


              对 Pasqal 而言，中性原子特定视角比企业量子总量更相关。Global Market Insights 估算，中性原子量子计算市场 2025 年为 $134 million，2026 年为 $176.1
              million，到 2035 年为 $1.2 billion。这个规模远小于全企业量子口径，却更接近 Pasqal 的实际技术路线，因此更适合估计其直接竞争池的竞争强度。实际结论是，Pasqal
              参与的是一个高速增长市场，但投资者不应按最大标题 TAM 来做投资判断，除非明确时间跨度和纳入板块。今天的收入池已经可衡量且在上升；大得多的潜在价值数字反映的是工作流影响潜力，不是马上可得的供应商收入。
