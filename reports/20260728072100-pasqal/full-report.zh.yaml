            - 1
        - label: BASF / BMW / Airbus / J&J 队列
          values:
            - 2
            - 2
            - 1
            - 1
    approximationNotes: 分数是基于留存公开语料中的新鲜度、交叉印证和部署细节作出的 1–3 序数判断。
    claimRefs:
      - CU020
      - CU023
      - CU031
      - CU034
      - CU035
  - id: FU004
    title: 留存 / 重复队列
    type: cohort
    layout: standard
    slug: retention-repeat-cohort
    summary: Pasqal 各类关系的说明性连续性代理；之所以采用该口径，只是因为公司未披露队列留存指标。
    approximationNotes: 这些百分比是分析师启发式估计，不是公司报告的留存。它们把 CA-CIB、EDF 和生态关系中可见的公开连续性，转化为仅供尽调使用的耐久性框架。
    claimRefs:
