      - number: '3.2'
        title: 能力比较：Pasqal 的双模式中性原子故事有差异化，但对手往往披露更清晰的包装或更广的平台支持
        blocks:
          - type: paragraph
            body: >-
              Pasqal 最鲜明的竞争论点仍是：其中性原子平台同时支持模拟量子仿真和基于门的数字计算，Pulser
              与云访问路径则让从仿真到硬件之间的切换更可用。这对化学、材料、优化和研究密集型工作流最重要，因为在通用容错到来前，模拟原生结构可能已经有价值。不过，竞争对手的公开页面显示，几家对手已经把买方主张讲得更具体。IonQ
              强调可部署到数据中心的 Forte Enterprise 硬件、native-gate 访问和明确的云计费结构。Quantinuum 把硬件与语法检查器、仿真器以及通过 Azure 暴露的 mid-circuit
              measurement 能力配在一起。IBM 以 100+ 量子比特系统、Qiskit 和免费平台时间打头阵；IQM 则把 Radiance 定位为本地 HPC 集成产品线。QuEra、Atom
              Computing 和 planqc 也在强化一点：中性原子不是 Pasqal 独占的赛道。净效果是，Pasqal 的技术差异化可信，但如果 Pasqal
