      - number: '3.4'
        title: 护城河耐久性：Pasqal 有真实切口，但既有软件生态和资本充足的同业仍能压缩它
        blocks:
          - type: paragraph
            body: >-
              Pasqal
              最好的牛市故事，是它占住了一个有吸引力的中间地带：比非常早期的中性原子初创公司更面向企业，比通用量子软件层更有技术路线辨识度，也比许多美国主导的对手更贴合欧洲主权优先事项。熊市故事则是，量子仍处在足够早期，没有哪种硬件技术路线已经锁定耐久的赢者通吃经济性，因此软件生态、云路径和资本获取能力可能比理论优雅更重要。McKinsey
              和 QED-C 都描述了一个仍在形成的行业：商业化是真实的，但还不成熟。这个框架应压低任何「Pasqal 的物理领先会自动转化为市场权力」的假设。IBM 和 Google
              能在生态和人才上花掉大多数初创公司花不起的钱。IonQ 和 Quantinuum 已经在销售企业级访问和公开产品包装。QuEra、Atom Computing 和 planqc
              等中性原子专门厂商也在攻击同一概念切口。因此，Pasqal
              今天的护城河更像是有条件成立，而不是已经锁死：买方看重模拟仿真、欧洲采购逻辑和中性原子路线图可选性时，它最强；软件熟悉度、广泛开发者心智或既有巨头分发主导购买决策时，它最弱。
