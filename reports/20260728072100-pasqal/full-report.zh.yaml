      - number: '7.4'
        title: 财务模型风险与止损条件：资本真实到位，但投资判断仍取决于转化速度
        blocks:
          - type: paragraph
            body: >-
              财务问题说起来简单，公开材料却难回答：Pasqal 能否在下一个融资或估值节点前，把扩大的资本底盘转化成足够的技术和客户证据？2026
              年融资和上市流程显然缓解了短期资金压力，但并不能让业务自动证明自身。公开来源仍没有披露收入、单位经济性、毛利率或客户集中度，投资人无法把硬件扩产清楚映射到可持续现金生成。这意味着投资逻辑仍高度依赖里程碑。如果旗舰客户进入可信的生产使用，如果制造扩张没有明显质量退化，如果公司开始披露更强的经济性，风险图景可以快速改善。反过来，如果客户合作仍以试点为主，基准清晰度仍薄，或商业证据增强前市场环境恶化，稀释和下轮降价风险也会迅速重现。因此正确框架不是盲信品类动能，而是带明确止损条件的有条件乐观。
