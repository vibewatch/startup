  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：Pasqal 同时面对同技术路线同业、企业平台和主权 HPC 供应商
        blocks:
          - type: paragraph
            body: >-
              Pasqal 并不处在一个整齐的同业集合里。最直接、技术路线相近的对手，是 QuEra、Atom Computing 和 planqc
              等其他中性原子公司，因为它们讲的是同一套核心技术主张：室温运行、或低温负担较低的基于原子的量子系统、围绕原子阵列的可编程性，以及在仿真或混合工作流中的优势。但这些只是最接近的技术类比。评估 Pasqal
              的企业买方，也可以选择 IonQ 和 Quantinuum 等 trapped-ion 厂商、IBM 和 Google 等超导既有厂商，以及 IQM 等面向本地 HPC 的供应商。AWS Braket 和
              Azure Quantum 又加了一层重要竞争，因为它们在一个云入口背后呈现多个硬件后端，从而降低买方切换成本。放到实际投资判断里，Pasqal
              最难的竞争因此不太来自某一家公司复制其精确架构，而来自任何一个足以提供可访问硬件、软件工具和商业验证、并能满足同一优化、仿真或主权计算预算的对手。这个更宽的框架很重要，因为它削弱了单靠技术路线独特性带来的保护。
