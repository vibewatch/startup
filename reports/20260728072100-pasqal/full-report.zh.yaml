      - number: '5.2'
        title: 架构与工作流：模拟控制、数字可选性和仿真器优先开发，是核心运营模式
        blocks:
          - type: paragraph
            body: >-
              Pasqal 的公开技术材料反复强调，中性原子控制并不局限于抽象门编译。Pulser
              及其文档明确说明，用户可以为特定中性原子设备设计和模拟脉冲序列，在标准数字电路范式之外工作，并在设备物理支持时创建模拟量子仿真。这是真正的差异化，因为它让 Pasqal
              能比只做门模型的竞争对手讲出更宽的实验边界，尤其适用于仿真和优化工作负载。云文档把这套架构延伸成运营工作流：用户在 Python 中准备任务，在远程或本地仿真器上测试，选择后端，向 QPU
              提交工作，并通过平台监控或重试任务。IBM 公开的超级计算合作强化了同一故事，把 Pasqal
              硬件定位为更广泛、硬件无关混合计算层的一部分。因此，这个技术产品不像一个静态盒子，更像一套可编程工作流栈；它的价值取决于用户能多顺畅地从仿真走到硬件，再走到混合编排。
