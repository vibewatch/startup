      - number: '7.2'
        title: 技术与运营风险：已经有证明，但可靠性、基准清晰度和制造规模仍未跑通
        blocks:
          - type: paragraph
            body: >-
              产品和客户章节表明，Pasqal
              不是纸面公司；它有硬件、具名工作负载和技术平台。风险来自这些事实与生产级可重复性之间的距离。公开证据仍偏向具体演示和工作流叙事，而不是企业买家和基础设施投资人通常想看的标准化可靠性指标。EDF 在超过 100
              qubits 上的案例有用，但没有回答正常运行时间、可支持性、基准可比性或多工作负载可复现性。与此同时，Pasqal 自己的 2026
              年材料描述了不小的运营爬坡：更多系统、更多产能、更多员工，并继续朝容错能力建设。执行质量因此与技术优劣同样重要。QED-C、IQM
              和反向采用评论的行业证据也说明，量子规模化仍被人才、供应链和商业化瓶颈卡住。因此风险不是技术造假，而是从科学前景走到可靠基础设施，可能比乐观叙事说得更久、更贵。
