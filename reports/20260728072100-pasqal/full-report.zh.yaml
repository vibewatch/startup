            title: 最大商业缺口不是“有没有客户？”，而是“这些关系有多少会续约，并真正付费？”
            body: Pasqal 的公开证据足以证明技术采用真实存在，但留存材料仍缺少续约数学、账户级支出、集中度或 NRR 式指标。因此客户兴趣不难判断，客户质量却更难投资判断。
            calloutType: risk
            claimRefs:
              - CU026
              - CU028
              - CU034
