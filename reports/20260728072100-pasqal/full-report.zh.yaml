              公开定价披露仍很薄。Pasqal 自己的材料强调访问、合作伙伴和产品定位，但没有为主要企业合同发布标准化标价表。云提供商材料显示，IonQ 和 Quantinuum 等可比厂商会通过 Azure 暴露基于
              target 的使用、订阅、语法检查器或仿真器，而 AWS Braket 在市场层强调简单定价和工作流管理。这些信号很重要，因为它们显示买方会如何对 Pasqal 做基准，即便 Pasqal
              没有发布干净的价目卡。其可能的销售动作偏企业级、技术咨询型：价值验证工作、基于云的实验，以及主权或基础设施买方的长周期采购。这与公开点名的行业一致——能源、金融、HPC、工业和先进
              R&D——这些买方往往需要解决方案工程，而不是自助式购买。结果是，CAC 回收期、NRR、logo 转化效率等经典 SaaS
