      - number: '8.4'
        title: 尽调要求与止损触发：下一步应要更多数据，而不是更多故事
        blocks:
          - type: paragraph
            body: >-
              Pasqal 的估值纪律应围绕少数可量化问题展开。第一，投资人需要一条清晰桥接，把新披露的 2025 年 €16.5 million
              商业收入，连到当前订单、积压订单、已确认收入和收入流构成。第二，他们需要客户质量证据：头部账户集中度、续约或追加采购行为，以及具名旗舰项目正从试点式项目转化为可被引用的运营使用证据。第三，他们需要按产品层拆的单位经济性，这样硬件偏重的增长计划才能映射到最终利润率，而不只是技术里程碑。打破论点的触发点同样具体。如果旗舰客户没有成熟，如果制造爬坡滞后，或如果经济性改善前公开市场热情消退，当前估值可能从只是偏贵变成明显没有吸引力。在这些问题得到回答前，正确动作是把
              Pasqal 留在重点观察名单，而不是把它投成明显错价。
