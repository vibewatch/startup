  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：混合企业量子工作流，而不是“所有量子”
        blocks:
          - type: paragraph
            body: >-
              Pasqal 正确的市场边界不是整个量子技术综合体，更不是未来可能与量子沾边的每一美元深科技价值。Pasqal
              真正能付费覆盖的市场位于企业量子计算内部，即便如此，最相关的支出也更窄：硬件访问、云与仿真器访问、联合开发、工作流集成，以及与优化、仿真和混合 HPC 用例相连的技术服务。McKinsey 2026
              年监测、QED-C 市场预测和 The Business Research Company
              的企业量子市场报告，都把这个行业描述为一个可货币化供给横跨硬件、软件、服务和云部署的板块，而不是一次性的硬件销售。这个框定很重要，因为 Pasqal
              不是在竞争所有研究经费、后量子密码支出或量子传感预算。它争夺的是一组特定的企业和政府计算预算：买方在完全容错到来前，先为能力建设付费。


              对 Pasqal 来说，最相关的子边界还要更窄：面向重视仿真、优化或混合量子—经典实验的组织，提供中性原子访问和集成。Future Markets、Global Market Insights 和
              Microsoft 的 Pasqal 提供商页面都支持这一判断：中性原子系统正在被定位为可通过云访问、并且越来越面向企业的资源，而不是孤立的实验室奇观。因此，应纳入的支出包括
              quantum-as-a-service、本地或托管系统访问、应用联合开发、仿真、接入 HPC 或分析工作流，以及垂直行业价值验证。应排除的支出包括对量子股票的纯金融投资、通用 AI
              基础设施、量子传感收入，以及尚未直接转化为供应商收入的广义理论潜在价值数字。
