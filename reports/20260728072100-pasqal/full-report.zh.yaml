      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              这个市场最相关的买方，不是单一同质的「企业」类别。QED-C、McKinsey、IQM/The Quantum Insider、Global Market Insights 以及 Pasqal
              的行业合作材料，都指向四类反复出现的付款方：政府和国家实验室、HPC 中心和研究组织、计算密集行业的大型企业，以及云 /
              平台中介。短期内，许多买方购买的不是完全规模化的生产结果；他们购买的是访问权、内部能力建设和结构化联合开发。McKinsey 明确称，参与模式正在从概念验证转向付费联合开发；IQM 2026
              年市场研究显示，上手量子工作已经常见，但规模化部署仍然稀少。这与 Pasqal 在金融、能源和 HPC 集成中的公开客户路径一致。


              买方、用户和付款方的拆分也随工作流变化。在金融场景，付款方往往是银行或资本市场平台，实际运营用户则是量化、风险和基础设施团队。在能源和化学场景，付款方可能是 R&D
              或先进技术预算，用户则是领域科学家或优化团队。在主权和 HPC 场景，采购可能由国家能力和基础设施目标驱动，研究人员或初创公司是下游用户。IQM 数据显示，46%
              的买方预计三年内本地基础设施会成为其访问模式的一部分；这一点对 Pasqal 也重要，因为它暗示市场可能不会只停留在公有云。混合、主权和本地可控访问，尤其在欧洲和海湾地区，可能比单纯的量子比特营销更能形成差异化。
