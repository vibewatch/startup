companyProfile:
  summary: Pasqal is a French quantum-computing company commercializing neutral-atom processors alongside a cloud and software stack for optimization, simulation, and hybrid HPC workflows. Public materials show a layered model spanning QPU sales, cloud access, codevelopment, and partner-driven integration, with named customer proof in finance, energy, and sovereign/HPC contexts. The company has raised substantial capital, disclosed €16.5M of 2025 commercial revenue in its June 2026 investor deck, and is pursuing a public-listing path while scaling industrial capacity in France.
  foundedDate: '2019-01-01'
  founders:
    - name: Georges-Olivier Reymond
      role: Co-founder; former CEO, now Chief Strategic Alliances Officer
      background: Original operating founder and longtime public face of Pasqal's fundraising and partnership strategy.
      claimRefs: [CO005, CO013]
    - name: Alain Aspect
      role: Co-founder; Scientific Director
      background: Nobel Prize in Physics 2022 laureate whose reputation anchors Pasqal's scientific legitimacy.
      claimRefs: [CO006]
    - name: Antoine Browaeys
      role: Co-founder; Chief Scientific Officer
      background: Neutral-atom scientist and key bridge between research credibility and product roadmap.
      claimRefs: [CO005, CO011]
  foundingLocation: Palaiseau / Massy, France
  headquarters: Palaiseau, France
  productSummary: Pasqal sells neutral-atom quantum processing units, cloud access, pulse-level programming tools, emulation, and hybrid-HPC integration surfaces aimed at optimization and simulation workloads.
  customerFocus: Large enterprises, sovereign / HPC centers, research institutions, and technically sophisticated teams in finance, energy, aerospace, and industrial R&D.
  businessModel: Direct QPU sales, cloud access / QCaaS usage, codevelopment programs, and partner-led workflow integration.
