  topStrengths:
    - Neutral-atom differentiation plus analog-and-digital programmability gives Pasqal a credible technical wedge rather than a generic quantum-hardware story.
    - Named customer proof in finance, energy, and sovereign/HPC contexts is stronger than many frontier deep-tech peers at a similar stage.
    - 2026 capital raised, industrial-capacity plans, and an installed QPU footprint show the company has moved beyond lab-only ambition.
  topRisks:
    - The current valuation is demanding relative to disclosed economics, with only €16.5M of 2025 commercial revenue publicly shown.
    - 'Customer-quality disclosure remains thin: renewals, concentration, unit economics, and true pilot-to-production conversion are still largely opaque.'
    - Manufacturing scale-up, commercialization timing, and strategic-technology regulation can compound if execution slips during the listing transition.
  unresolvedGaps:
    - Audited 2026 revenue, bookings, backlog, gross margin, and cash-burn disclosure remain non-public.
    - Top-customer concentration, renewals, and production-stage account counts are not publicly disclosed.
    - Convertible terms, fully diluted cap-table outcomes, and public-company dilution mechanics need tighter modeling.
    - Product reliability, uptime history, and standardized benchmark comparability versus peers remain incomplete in the retained public file.
