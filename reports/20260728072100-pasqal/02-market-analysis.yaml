  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: pasqal-specific-sam-som
    missingEvidence: >-
      Public sources provide enterprise-wide and modality-specific market estimates, but they do not isolate Pasqal’s realistic serviceable available or obtainable market by geography, vertical, or deployment model.
    whyItMatters: >-
      Valuation depends on how much of the broader quantum and neutral-atom market Pasqal can actually reach before the market consolidates.
    diligencePath: >-
      Request management’s internal segmentation by vertical, geography, delivery model, and pipeline conversion assumptions; compare it with competitor footprints and procurement timing.
    relatedQuestionRefs:
    - QM022
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: production-deployment-counts
    missingEvidence: >-
      Public market studies show the gap between experimentation and deployment, but they do not disclose how many of Pasqal’s own engagements are paid pilots, production systems, or recurring contracts.
    whyItMatters: >-
      That distinction determines whether Pasqal is merely well positioned in an emerging market or already converting positioning into durable commercial advantage.
    diligencePath: >-
      Request Pasqal’s customer funnel split across trials, paid codevelopment, production workloads, and recurring software or cloud usage.
    relatedQuestionRefs:
    - QM015
    - QM025
    relatedTableRefs:
    - TM003
    - TM004
  - type: conflicting-data
    severity: minor
    topic: market-boundary-drift
    missingEvidence: >-
      Major public market estimates use different boundaries, with some measuring all quantum, some only computing, and others only neutral-atom systems.
    whyItMatters: >-
      Without boundary discipline, a valuation model can accidentally capitalize the broadest TAM while pricing against the narrowest revenue base.
    diligencePath: Normalize every external market number by included segment, unit, and time horizon before using it in valuation work.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM001
    - TM002
  - type: stale
    severity: minor
    topic: fault-tolerance-timing
    missingEvidence: >-
      Public sources describe fault-tolerance windows and roadmap expectations, but those timing assumptions can shift quickly with each hardware generation and financing cycle.
    whyItMatters: A one- to two-year slip can materially change when buyers move from experimentation budgets to production procurement.
    diligencePath: >-
      Refresh roadmap assumptions against the latest product disclosures, benchmark results, and competitor guidance during each report update.
    relatedQuestionRefs:
    - QM016
    relatedTableRefs:
