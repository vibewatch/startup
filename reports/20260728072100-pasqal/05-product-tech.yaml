chapter:
  number: 5
  title: Product & Technology
  summary: 'Pasqal delivers a neutral-atom quantum-computing stack that spans hardware, cloud access, pulse-level programming, emulation, and emerging hybrid-HPC integration. The public file supports a differentiated technical posture: programmable 2D and 3D neutral-atom arrays, analog and gate-based workflows, Pulser as an open-source pulse-level framework, and cloud tooling that lets users test on emulators before submitting jobs to QPUs. The same file also shows that some of the hardest underwriting inputs remain incomplete, especially fully comparable fidelity, error-rate, and reliability disclosure versus trapped-ion and superconducting peers.'
sections:
- id: product-definition
  title: 'Product definition: Pasqal sells a stack, not just a processor'
  body: 'The most important framing error a generalist investor can make is to treat Pasqal as only a hardware company. Public materials instead show a layered offering: neutral-atom QPUs, remote and local emulators, cloud execution and job management, Pulser for pulse-level programming, Pulser Studio for browser-based onboarding, and an emerging bridge into hybrid-HPC workflows through IBM and Qiskit. Pasqal’s own software-stack page is unusually helpful here because it explicitly separates applications, SDKs, and execution layers. That matters commercially because the product buyer is not only purchasing qubits; the buyer is purchasing a workflow that begins with experimentation, passes through emulation, and only then lands on hardware execution. This architecture also explains why Pasqal can address both research-heavy users and enterprise teams that need an easier route into neutral-atom computing. In practical terms, the company’s product is best understood as a programmable neutral-atom
    platform with software, cloud, and integration surfaces wrapped around it.'
  claimRefs:
