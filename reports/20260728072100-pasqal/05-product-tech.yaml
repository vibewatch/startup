- id: trust-controls-and-risks
  title: 'Trust, quality, and implementation risk: developer access is visible, but production assurance remains only partly public'
  body: 'Pasqal’s product file is stronger on accessibility than on assurance. On the positive side, the company exposes documentation, cloud access, job-management features, open-source libraries, release activity, installation guidance, and device-specific programming concepts in a way many deep-tech startups do not. Those are real maturity signals because they lower integration friction and suggest an internal productization discipline rather than one-off demos. On the negative side, the public file remains thinner on production-grade trust controls: uptime commitments, incident history, formal security or quality certifications, standardized benchmark reporting, and long-run hardware reliability are not disclosed at the level an infrastructure investor would ideally want. The right conclusion is not that Pasqal lacks controls; it is that the product chapter must carry explicit evidence gaps around benchmark comparability, cloud-service assurances, and operational reliability. For a hardware-plus-cloud
    platform, these gaps are diligence items that bear directly on conversion from experimentation to mission-critical deployment.'
  claimRefs:
  - CE028
  - CE029
