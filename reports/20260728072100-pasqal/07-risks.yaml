- id: technical-operational-risk
  title: 'Technical and operational risk: proof exists, but reliability, benchmark clarity, and manufacturing scale remain open'
  body: 'The product and customer chapters show that Pasqal is not a paper company; it has hardware, named workloads, and a technical platform. Risk comes from the gap between those facts and production-grade repeatability. Public proof still skews toward specific demonstrations and workflow narratives rather than the standardized reliability metrics that enterprise buyers and infrastructure investors usually want. The EDF case on more than 100 qubits is useful, but it does not settle questions about uptime, supportability, benchmark comparability, or multi-workload reproducibility. At the same time, Pasqal’s own 2026 materials describe a sizable operating ramp: more systems, more production capacity, more staff, and continued buildout toward fault tolerance. That makes execution quality as important as technical merit. Sector evidence from QED-C, IQM, and adverse adoption commentary reinforces the point that quantum scaling still faces talent, supply-chain, and commercialization bottlenecks.
    The risk is therefore not that the technology is fake; it is that the path from scientific promise to dependable infrastructure may take longer and cost more than optimistic narratives suggest.'
