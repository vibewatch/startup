chapter:
  number: 7
  title: Risks
  summary: 'Pasqal’s risk profile is that of a serious but still frontier deep-tech company: there is real technical and customer proof, yet several failure modes can still compound together. The biggest risks are slow commercialization, hardware and manufacturing execution, partner and flagship-customer concentration, capital-market sensitivity, and growing regulatory complexity around strategic quantum technologies. European foreign-investment and dual-use rules increasingly treat quantum as critical infrastructure, while Pasqal’s own SEC filing explicitly warns about market acceptance, partner reliance, IP protection, and deal-completion risk. The company’s best mitigants are equally clear—meaningful capital, sovereign positioning, named customer proofs, and a differentiated neutral-atom stack—but the public file still lacks enough renewal, reliability, incident, and unit-economics detail to collapse the risk discount fully.'
sections:
- id: regulatory-and-legal-risk
  title: 'Regulatory and legal risk: quantum’s strategic status raises transaction, export, and public-market complexity'
  body: 'Pasqal is not selling a casual SaaS product; it operates in a technology category that governments increasingly treat as strategic. The retained regulatory corpus shows two overlapping realities. First, the company’s own SEC filing highlights classic emerging-technology hazards: commercialization uncertainty, partner reliance, IP-protection needs, and deal-completion risk tied to the listing process. Second, European regulatory developments now explicitly place quantum technologies inside broader critical-technology and dual-use policy frameworks. Updated EU screening materials and export-control rules do not imply that Pasqal is blocked from doing business internationally, but they do imply that some capital, ownership, and cross-border technology-transfer events may require more review, licensing, or transaction engineering than a typical software company. For an investor, the most important conclusion is that regulatory friction here is less about visible enforcement history
    and more about latent complexity: approvals, classifications, and strategic-asset sensitivity can slow financings, partnerships, or market expansion precisely when speed matters most.'
