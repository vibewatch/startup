evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-listing-governance-rights
    missingEvidence: >-
      The retained public corpus does not provide a full current board roster, committee structure, or the final
      governance and shareholder-rights package that will govern Pasqal after the listing.
    whyItMatters: >-
      Governance detail is necessary to judge founder influence, sovereign control, sponsor economics, and downside
      protections for new investors.
    diligencePath: >-
      Request the latest board deck, cap table, investor-rights summary, committee charter package, and the most recent
      F-4 amendments or board resolutions.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: lifetime-capital-vs-gross-proceeds
    missingEvidence: >-
      Public sources mix private funding raised to date with prospective gross transaction proceeds that include SPAC
      trust cash and Pasqal cash on hand.
    whyItMatters: Confusing lifetime funding with merger proceeds distorts dilution, runway, and capital-efficiency analysis.
    diligencePath: >-
      Request a round-by-round financing schedule that reconciles primary cash raised, convertible instruments, grants,
      and merger-related proceeds.
    relatedQuestionRefs:
      - QO010
      - QO023
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-commercial-economics
    missingEvidence: >-
      The public file gives only limited and partly unaudited revenue disclosure, without audited gross margins, backlog
      conversion, customer concentration, or line-item profitability.
    whyItMatters: >-
      The investment case depends on whether enterprise partnerships translate into durable revenue rather than only
      technical credibility.
    diligencePath: >-
      Request audited 2025 financial statements, 2026 year-to-date management accounts, bookings/backlog definitions,
      and customer-concentration schedules.
    relatedQuestionRefs:
      - QO022
      - QO024
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: customer-and-headcount-definitions
    missingEvidence: >-
      Public sources use different definitions for employees, clients, partners, and total clients, creating ambiguity
      around current scale metrics.
    whyItMatters: >-
      A private deep-tech company can look materially bigger or smaller depending on whether it reports only paying
      clients, clients plus partners, or broader engagements.
    diligencePath: >-
      Request a dated employee count by entity and a customer taxonomy that separates paying production customers,
