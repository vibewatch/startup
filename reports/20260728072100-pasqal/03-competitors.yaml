- id: capabilities-and-buyer-fit
  title: 'Capability comparison: Pasqal’s dual-mode neutral-atom story is differentiated, but rivals often disclose clearer packaging or broader platform support'
  body: Pasqal’s most distinctive competitive argument remains that its neutral-atom platform supports both analog quantum simulation and gate-based digital computing, with Pulser and cloud-access paths designed to make the transition between emulation and hardware more usable. That matters most for chemistry, materials, optimization, and research-heavy workflows where analog-native structure can be valuable before universal fault tolerance arrives. However, public competitor surfaces show that several rivals already communicate their buyer proposition more concretely. IonQ emphasizes data-center-deployable Forte Enterprise hardware, native-gate access, and explicit cloud billing constructs. Quantinuum pairs hardware with syntax checkers, emulators, and mid-circuit measurement capabilities exposed through Azure. IBM leads with 100+ qubit systems plus Qiskit and free platform time, while IQM positions Radiance as an on-prem HPC-integrated product line. QuEra, Atom Computing, and planqc reinforce
    that neutral-atom is not Pasqal’s exclusive lane. The net effect is that Pasqal’s technical differentiation is credible, but a buyer may still perceive rival offers as more packaged, better documented, or easier to benchmark if Pasqal cannot keep publishing comparable developer and deployment proof.
