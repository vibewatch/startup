- id: thesis-antithesis-and-comps
  title: 'Thesis, anti-thesis, and comparable set: Pasqal is cheaper than public quantum froth, but that alone is not enough'
  body: 'Public comparables are informative but treacherous here. On the one hand, July 2026 public-equity marks for IonQ, Rigetti, and D-Wave all sit above Pasqal’s $2 billion valuation, which means the company is not obviously priced outside the current quantum market envelope. On the other hand, those stocks are exposed to public-market momentum, retail speculation, and different revenue-disclosure regimes, which means they cannot be treated as clean evidence that Pasqal is cheap. The more convincing thesis rests on Pasqal-specific attributes: neutral-atom differentiation, a European strategic position, visible customer programs, and a meaningful industrialization plan. The anti-thesis is equally strong: the company is still early on economics, current revenue is small, and much of the valuation depends on future execution. A good comparable set therefore argues for valuation plausibility, not valuation comfort. The distinction matters because it is the difference between saying “this
    price is defensible” and saying “this price is attractive.”'
