- id: scenarios-and-return-logic
  title: 'Bull, base, and bear: outcomes still hinge on revenue compounding, proof expansion, and multiple durability'
  body: 'Scenario work is unavoidable because Pasqal’s disclosure is still too thin for false precision. The bear case is straightforward: customer conversion remains slow, the market cools on quantum-growth multiples, and Pasqal’s industrial ramp consumes cash faster than economic proof compounds. Under that path, today’s valuation can compress materially. The base case is more balanced: Pasqal grows from the 2025 revenue base, deepens a handful of flagship accounts, standardizes more deployments, and gradually earns into its current mark. The bull case requires something stronger—faster customer conversion, a visibly expanding installed base, cleaner financial disclosure, and sustained belief that neutral atoms can command premium valuation multiples relative to other modalities. The key point is that current investors do not need Pasqal merely to keep existing momentum; they need the company to convert that momentum into much larger economic proof within a relatively short window. That
    is why the current price feels full even if the company itself still looks high quality.'
