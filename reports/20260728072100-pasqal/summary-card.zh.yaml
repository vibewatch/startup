  topStrengths:
    - 中性原子差异化，加上模拟与数字可编程能力，让 Pasqal 有了可信的技术楔子，而不只是泛泛的量子硬件故事。
    - 金融、能源、主权 / HPC 场景中已有具名客户证据；放在同阶段前沿 deep-tech 公司里，这份证据更硬。
    - 2026 年融资、工业产能计划和已安装 QPU 足迹显示，公司已经越过只停留在实验室愿景的阶段。
  topRisks:
    - 相对已披露经济性，当前估值要求很高；公开可见的 2025 商业收入只有 €16.5M。
    - 客户质量披露仍薄：续约、集中度、单位经济性、真实试点转生产转化，大多仍不透明。
    - 上市过渡期一旦执行滑坡，制造扩产、商业化节奏和战略技术监管会相互叠加。
  unresolvedGaps:
    - 经审计的 2026 收入、订单、积压、毛利率和烧钱披露仍未公开。
    - 头部客户集中度、续约和生产阶段账户数量未公开披露。
    - 可转债条款、完全摊薄后股权结构结果和上市公司稀释机制需要更细建模。
    - 产品可靠性、正常运行时间历史，以及与同行标准化基准的可比性，在保留的公开资料中仍不完整。
