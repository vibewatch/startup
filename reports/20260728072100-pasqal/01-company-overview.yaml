  rows:
  - - Dr. Wasiq Bokhari
    - Chief Executive Officer
    - MIT-trained physicist and deep-tech operator with prior Amazon and Google experience
    - >-
      Official profile says he moved from Chairman (2024) to Executive Chairman (2025) to CEO, now leading strategy, fundraising, and growth
    - Request exact date and board approval package for the CEO transition and any public-company incentive arrangements.
  - - Dr. Georges-Olivier Reymond
    - Co-Founder & Chief Strategic Alliances Officer
    - Original operating founder and public face of Pasqal in earlier financing and IBM announcements
    - Was CEO in 2023 and still quoted as CEO in late 2024; current team page moves him into strategic alliances
    - Clarify founder retention, voting power, and day-to-day authority after the transition to Bokhari.
  - - Prof. Antoine Browaeys
    - Co-Founder & Chief Scientific Officer
    - Leading neutral-atom scientist and public technical credibility anchor
    - Current leadership page keeps him in a top scientific leadership post
    - Confirm research-to-product governance and how science priorities are translated into commercialization roadmaps.
  - - Dr. Loïc Henriet
    - Chief Technology Officer
    - Previously quoted as co-CEO / sole CEO; now returned to CTO role
    - TechCrunch says the SPAC announcement effectively confirmed the reshuffle back to CTO
    - Request a dated chronology of executive-role changes and succession rationale.
  - - Stéphane Rougeot
    - Chief Financial Officer
    - Current finance lead on the 2026 team page
    - Presence matters because Pasqal is preparing public-company reporting and capital-markets processes
    - Request audited 2025 financial package and readiness plan for public controls.
  - - Bpifrance
    - Strategic shareholder with board involvement
    - Public investor backed Pasqal since 2021 and remains involved in governance
    - Official 2026 financing release says Bpifrance continues on the board and in the capital structure
    - Request current board-seat count, observer rights, and any veto or reserved matters.
  - - French foreign-investment regime
    - External governance constraint
    - Quantum technology is treated as a sensitive sector under French law
    - >-
      F-4 says non-EU investors need Ministry of the Economy approval to cross 25% voting rights, or 10% if shares trade on a regulated market
    - Model how the regime affects future capital raising, M&A, and share liquidity.
