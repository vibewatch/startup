      description: Broad public list spanning finance, energy, aerospace, industrial, and sovereign/HPC.
    - id: n2
      label: Scoped technical pilots
      description: Specific problems like portfolio optimization, smart charging, and scheduling get codeveloped.
    - id: n3
      label: Quantum / emulator validation
      description: Customers test workloads on Pasqal platforms or via partner ecosystems such as Qiskit.
    - id: n4
      label: Industrialization roadmap
