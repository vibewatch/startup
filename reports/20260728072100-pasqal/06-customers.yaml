- id: retention-and-durability
  title: 'Retention and durability: public evidence suggests expansion potential, but renewal math is still missing'
  body: 'This is the chapter’s central caution. Pasqal’s public materials imply that customer relationships can deepen over time: Crédit Agricole CIB progressed from collaboration to strategic partnership, EDF has been referenced across multiple years, and sovereign or HPC relationships such as GENCI and IBM can widen user access beyond a single proof of concept. Those are good durability signals, but they are not substitutes for retention metrics. The retained file contains no disclosed NRR, GRR, churn, renewal rate, contract tenure, account-level ARR, or customer satisfaction benchmark. As a result, investors can reasonably infer that some relationships are becoming deeper, but they cannot yet quantify how repeatable that pattern is across the installed base. The practical outcome is that any retention conclusion must stay framed as a diligence hypothesis rather than a settled fact. Pasqal’s customer evidence looks better than pre-commercial vaporware, yet it still falls short of a mature
    enterprise-cohort story.'
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration-and-constraints
  title: 'Expansion, concentration, and procurement friction: real traction exists, but the journey to production is still long'
  body: 'Pasqal’s go-to-market pattern appears to be land through technical collaboration, prove a narrowly framed workload, then try to expand through deeper integration or ecosystem reach. The best example is Crédit Agricole CIB, where the published roadmap explicitly runs from exploratory projects to operational targeting in 2028. IBM and European HPC relationships could also function as force multipliers by exposing Pasqal hardware to larger developer and research communities. But this same model carries clear risk. Enterprise quantum budgets often stay trapped in evaluation mode, and adverse sources emphasize that many companies remain cautious because technical and commercial uncertainty is still high. The public file also does not disclose top-customer concentration, revenue by segment, or whether any single relationship materially anchors the company’s commercial story. The correct underwriting posture is therefore balanced: Pasqal has enough customer proof to take seriously, but
    not enough durability disclosure to assume a smooth jump from pilots and codevelopment into broad production revenue.'
