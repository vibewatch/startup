chapter:
  number: 6
  title: Customers
  summary: Pasqal has credible named-customer traction for a frontier quantum-computing company, especially in finance and energy, but the public file still proves more about technical adoption than about recurring revenue durability. Crédit Agricole CIB is the strongest enterprise proof because both parties describe a multi-year relationship, specific workflows, and a 2026–2028 industrialization roadmap. EDF, GENCI, Thales, and IBM widen the evidence base, while older media and merger materials support a broader logo set including BASF, BMW, Airbus, and Johnson & Johnson. The underwriting limitation is that Pasqal still does not publicly disclose renewal, contract-value, or concentration metrics, so many customer-quality conclusions remain inferential rather than fully measured.
sections:
- id: segmentation-and-surface
  title: 'Segmentation and customer surface: Pasqal has a real vertical footprint, but the public file is still light on economics'
  body: 'Pasqal’s customer evidence is better than a pure-logo slide, but it is not yet the kind of recurring-revenue disclosure a late-stage software investor would expect. The retained public corpus shows repeat concentration in specific problem classes: financial optimization, energy forecasting and smart charging, aerospace or defense scheduling, chemistry and materials simulation, and sovereign or HPC-enabled research access. That pattern matters because it suggests Pasqal is selling a workflow around hard optimization and simulation tasks rather than a generic compute utility. At the same time, the public record mixes several concepts that should not be conflated: clients, partners, commercial use cases, customer engagements, and named logos. Pasqal’s own pages say 25-plus commercial use cases, 35-plus customer engagements, and more than 25 clients or partners, while media coverage sometimes says 40 customers. Those are directionally positive signals, but they still stop short of revealing
    who pays, how much they pay, or how many of those relationships have converted into durable revenue.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU019
  - CU030
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: named-proof-and-maturity
  title: 'Named proof and maturity: Crédit Agricole CIB and EDF are the best evidence, while the rest of the logo set is more exploratory'
  body: The strongest underwriting takeaway is that Pasqal does have named customer proof, but that proof is uneven by account. Crédit Agricole CIB is by far the most mature public example because there are first-party statements from both sides, multiple independent reprints, a clearly described workflow set, and an explicit transition from earlier research collaboration into strategic industrialization. EDF is also meaningful because Pasqal ties the relationship to a specific smart-charging demand-forecasting result on more than 100 qubits and dates the collaboration back to 2018. Thales offers another useful proof point in critical-systems optimization, while IBM expands distribution and developer reach through Qiskit even if it is not the same thing as a large paying end-customer contract. By contrast, older references to BASF, BMW, Airbus, Johnson & Johnson, Siemens, and other logos are still helpful, but they are mostly best understood as exploratory or pilot-stage evidence unless
    newer deployment detail surfaces.
