figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: Pasqal’s customer motion typically starts with a hard optimization problem, moves through codevelopment and quantum testing, and only later reaches operational deployment.
  data:
    items:
    - label: Problem discovery
      detail: Bank, utility, aerospace, or industrial R&D team identifies an optimization or simulation bottleneck where classical methods struggle.
      tone: neutral
    - label: Codevelopment / pilot scoping
      detail: Pasqal and the customer frame a narrow workload such as portfolio optimization, EV charging, or critical-system scheduling.
      tone: neutral
    - label: Quantum experimentation
      detail: Workloads are tested on emulators, QPUs, or HPC-linked Pasqal systems to evaluate technical feasibility and performance conditions.
      tone: neutral
    - label: Industrialization gate
      detail: Customer asks whether results are reproducible, economically relevant, and operationally supportable inside existing workflows.
      tone: warning
    - label: Operational deployment / expansion
      detail: Only the strongest accounts show a public path toward production usage, with Crédit Agricole CIB targeting initial use cases as early as 2028.
      tone: positive
  approximationNotes: Journey stages are synthesized from named case studies and adverse adoption commentary; public conversion rates between stages are not disclosed.
  claimRefs:
