callouts:
- calloutType: insight
  title: Crédit Agricole CIB is the closest thing Pasqal has to an enterprise-grade reference account in public
  body: It combines a named customer quote, a multi-year relationship, specific workloads, and a staged industrialization roadmap. That is materially better evidence than a generic logo or conference mention.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU027
- calloutType: risk
  title: The biggest commercial gap is not “are there customers?” but “how many of these relationships renew and pay meaningfully?”
  body: Pasqal’s public evidence is credible for technical adoption, yet the retained file still lacks renewal math, account-level spend, concentration, or NRR-style metrics. That makes customer quality harder to underwrite than customer interest.
  claimRefs:
  - CU026
  - CU028
  - CU034
  - CU036
