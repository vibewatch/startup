  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: >-
          Current valuation and recommendation: Pasqal looks serious, but the $2B mark already prices in a lot of future
          success
        blocks:
          - type: paragraph
            body: >-
              Pasqal’s valuation problem is not that the company lacks substance. By mid-2026, the public file shows a
              real quantum-computing platform, named enterprise and sovereign relationships, seven installed systems
              with more in production, and a disclosed 2025 commercial-revenue base. The problem is the price investors
              are being asked to pay for that progress. At roughly $2 billion pre-money, Pasqal is no longer a
              discovery-stage science bet; it is priced as a leading commercial contender. The analyst deck’s €16.5
              million 2025 commercial-revenue disclosure is helpful, but it also makes the current mark feel demanding
              because the implied revenue multiple is still extreme by ordinary standards. That does not make the
              valuation impossible—frontier winners often look expensive before scale becomes obvious—but it does mean
              investors need a price-sensitive posture. The right public-evidence call today is watch rather than
              invest: respect the asset, but do not confuse technical credibility with an automatic bargain.
            claimRefs:
