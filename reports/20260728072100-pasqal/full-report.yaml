      - number: '2.4'
        title: Growth drivers, adoption constraints, and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              The market drivers are real. McKinsey sees commercial traction accelerating, QED-C sees the industry
              moving from research-led exploration to early commercial opportunity, and multiple neutral-atom market
              summaries highlight room-temperature operation, cloud access, and tighter HPC alignment as tailwinds.
              Pasqal’s own vertical evidence—finance with Crédit Agricole CIB, energy forecasting with EDF, and
              quantum-centric supercomputing with IBM—matches the most common early-use-case buckets seen in market
              reports: simulation, optimization, materials or chemistry, and high-value R&D workflows. This alignment is
              strategically favorable because it means the company is positioned where public market and industry
              analyses already expect early commercialization to emerge.


              But the constraints are just as important and arguably more decisive for underwriting. QED-C identifies
              talent shortages as one of the biggest scaling bottlenecks and describes the supply chain as custom and
              fragile. IQM’s 2026 report says only 3 percent of organizations have reached scaled deployment even though
              89 percent report hands-on quantum work, which is a stark reminder that experimentation still outruns
              operational usage. Global Market Insights and Future Markets both call out the cost of scaling
              fault-tolerant systems and the immaturity of the software ecosystem, while Innovation News Network and
              PostQuantum both argue that commercial adoption still lags technical headlines. The result is a market
              that is clearly forming, but whose serviceable segment for Pasqal depends on whether the company can
              convert codevelopment and access into repeatable, production-grade enterprise spending before a broader
              ‘quantum winter’ or platform consolidation hits.
