  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and legal risk: quantum’s strategic status raises transaction, export, and public-market complexity'
        blocks:
          - type: paragraph
            body: >-
              Pasqal is not selling a casual SaaS product; it operates in a technology category that governments
              increasingly treat as strategic. The retained regulatory corpus shows two overlapping realities. First,
              the company’s own SEC filing highlights classic emerging-technology hazards: commercialization
              uncertainty, partner reliance, IP-protection needs, and deal-completion risk tied to the listing process.
              Second, European regulatory developments now explicitly place quantum technologies inside broader
              critical-technology and dual-use policy frameworks. Updated EU screening materials and export-control
              rules do not imply that Pasqal is blocked from doing business internationally, but they do imply that some
              capital, ownership, and cross-border technology-transfer events may require more review, licensing, or
              transaction engineering than a typical software company. For an investor, the most important conclusion is
              that regulatory friction here is less about visible enforcement history and more about latent complexity:
              approvals, classifications, and strategic-asset sensitivity can slow financings, partnerships, or market
              expansion precisely when speed matters most.
            claimRefs:
