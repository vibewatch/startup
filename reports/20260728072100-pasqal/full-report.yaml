      - number: '1.2'
        title: Founders, leadership transition, and governance
        blocks:
          - type: paragraph
            body: >-
              Pasqal’s founder narrative is partly scientific and partly operating-company. The strongest corroborated
              founder set in retained materials comes from IBM and the 2023 financing corpus: Georges-Olivier Reymond,
              Christophe Jurczak, Alain Aspect, Antoine Browaeys, and Thierry Lahaye founded Pasqal in 2019 out of
              Institut d’Optique research. Alain Aspect’s 2022 Nobel Prize remains central to the company’s legitimacy
              story, but the operational leadership picture changed materially between 2024 and 2026. Georges-Olivier
              Reymond was still being quoted as CEO in 2024 IBM materials, while 2026 listing and customer-partnership
              materials quote Dr. Wasiq Bokhari as CEO. Pasqal’s own leadership page says Bokhari became chairman in
              February 2024, executive chairman in March 2025, and then CEO, while the current leadership roster now
              places Reymond in the Chief Strategic Alliances Officer role and Loïc Henriet back in the CTO seat.


              That executive reshuffle is not trivial. TechCrunch explicitly flagged it as ‘buried’ inside the SPAC
              announcement, and it means investors should not assume founder-CEO continuity heading into the listing.
              Governance visibility remains only partial: public materials support Bpifrance’s continued board role, a
              future French non-executive chair, and the strategic importance of sovereign oversight, but they do not
              publish a full current board committee map or the final rights package for new public investors. The SEC
              materials, together with TNW’s adverse reading, make clear that governance is intertwined with French
              foreign-investment rules and sovereignty concerns, not just ordinary startup board dynamics.
