      - number: '1.3'
        title: Funding history, listing path, and scale signals
        blocks:
          - type: paragraph
            body: >-
              Pasqal’s March 2026 financing is one of the cleanest public markers in the file, but the surrounding
              totals are easier to misread than the headline suggests. The official announcement says Pasqal completed a
              EUR 170 million private funding round and secured roughly another EUR 170 million of committed convertible
              financing in connection with the business combination, for expected financing of at least EUR 340 million.
              The same announcement and the parallel SPAC press release put the company around a $2.0 billion valuation
              and lay out a plan for an initial Nasdaq listing in 2026 with Euronext Paris preparation running in
              parallel for 2026 or 2027. Those are well-supported current facts. What is not equally clean is the ‘total
              raised’ story. Official materials also say Pasqal has more than $300 million of total funding from
              investors, while the SPAC package says the transaction could deliver over $600 million of gross proceeds
              only because that figure includes Bleichroeder trust cash and Pasqal’s own balance-sheet cash alongside
              new financing.


              Scale signals are directionally strong even though the economic disclosure is still incomplete. Pasqal’s
              March 2026 and June 2026 official materials say it employs more than 275 people and serves more than 25
              clients and partners, while the technology page now advertises 40-plus global clients and Tracxn reports
              301 employees as of June 2026. The product and listing materials also claim seven deployed quantum
              computers, three more in production, and a potential ramp to 13 QPUs per year across facilities in France
              and Canada. Those are meaningful operating signals for a private deep-tech company, but they should not be
              confused with audited revenue durability or full underwriting transparency.
