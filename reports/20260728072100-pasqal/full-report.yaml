        title: 'Pricing and sales efficiency: public packaging is visible, realized economics are mostly not'
        blocks:
          - type: paragraph
            body: >-
              Public pricing disclosure remains thin. Pasqal’s own materials emphasize access, partnerships, and product
              positioning but do not publish a standardized list-price schedule for major enterprise contracts.
              Cloud-provider materials show that comparable vendors such as IonQ and Quantinuum expose target-based
              usage, subscriptions, syntax checkers, or emulators through Azure, while AWS Braket emphasizes simple
              pricing and workflow management at the marketplace layer. Those signals matter because they show how
              buyers will benchmark Pasqal even when Pasqal does not publish a clean price card. The likely sales motion
              is enterprise-heavy and technically consultative: proof-of-value work, cloud-based experimentation, and
              long-cycle procurement for sovereign or infrastructure buyers. That is consistent with the sectors already
              named publicly—energy, finance, HPC, industrial, and advanced R&D—where the buyer often requires solution
              engineering rather than a self-serve motion. The consequence is that classical SaaS metrics such as CAC
              payback, NRR, and logo-conversion efficiency cannot be derived from public evidence alone. Investors
              therefore need to separate visible packaging from actual revenue recognition and realized gross profit.
              Today, public evidence says the sales motion is credible, but not yet transparent enough to score as
              efficient.
