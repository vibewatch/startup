chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and platform scope
        blocks:
          - type: paragraph
            body: >-
              Pasqal’s current public identity is much stronger than a generic ‘quantum startup’ label. Across its
              homepage, about page, technology page, Microsoft provider documentation, and IBM partner materials, the
              company presents itself as a full-stack neutral-atom quantum computing vendor rather than a single lab
              project. The common thread is consistent: Pasqal builds processors from ordered rubidium atoms trapped
              with optical tweezers, layers cloud-ready software on top, and tries to turn that stack into practical
              workflows in optimization, simulation, and AI-adjacent industrial use cases. The official technology page
              goes further than many deep-tech company sites by explicitly explaining why it views the architecture as
              dual analog-digital, room-temperature, and designed for integration into high-performance computing
              environments rather than isolated lab demonstrations alone.


              The identity and footprint data are also better evidenced than many private deep-tech peers. Pasqal’s
              current address is listed as 24 rue Emile Baudot, 91120 Palaiseau, and the company now labels that site as
              its global HQ while also publishing MENA, North American, and APAC headquarters in Riyadh, Boston, and
              Seoul, plus a Sherbrooke presence in Canada. That makes Palaiseau—not Massy—the most supportable
              headquarters label in retained 2026 materials, though both sit in the same broader Essonne / Paris-Saclay
              orbit. The same official surfaces show a company that sells hardware, cloud access, emulation, and
              software rather than only future science narratives, which is important context for the later valuation
              and customer chapters.
