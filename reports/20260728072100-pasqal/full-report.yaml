      - number: '3.3'
        title: 'Distribution and switching costs: cloud marketplaces widen the field and weaken pure modality lock-in'
        blocks:
          - type: paragraph
            body: >-
              The public cloud layer is strategically important because it changes how competition is felt by the
              customer. Azure Quantum offers IonQ and Quantinuum targets with detailed provider documentation, target
              IDs, qubit counts, emulator access, and billing cues. Amazon Braket similarly aggregates modalities and
              advertises simple pricing, workflow management, and direct access to QuEra’s Rydberg systems. When cloud
              intermediaries handle discovery, access, and early experimentation, the customer does not need to commit
              to one hardware supplier early. That lowers switching costs and makes first access easier, but it also
              means Pasqal can be compared feature-for-feature against rivals inside the same buyer workflow. By
              contrast, vendors that push on-prem, sovereign, or data-center deployment—such as IonQ Forte Enterprise or
              IQM Radiance—can create stickier relationships when procurement, latency, compliance, or infrastructure
              control matter. Pasqal’s European identity and sovereign-compute relevance help in that environment, but
              the company still needs more public proof that it can turn this into sustained commercial lock-in rather
              than just favorable positioning. Without stronger software adoption, reference deployments, or proprietary
              workflow assets, neutral-atom differentiation risks being observed by experts while remaining weakly
              monetized by buyers.
