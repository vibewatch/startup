  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: >-
          Revenue model: multiple monetization paths exist, but public evidence still points to a mixed and early-stage
          commercial engine
        blocks:
          - type: paragraph
            body: >-
              Pasqal does not present itself as a pure SaaS vendor or as a simple hardware OEM. Its public surfaces
              instead imply four monetization paths: direct or dedicated quantum-system deployments, cloud-access
              revenue, software and emulation tooling around neutral-atom workflows, and codevelopment or
              professional-services work tied to enterprise or sovereign projects. Customer and partner materials in
              energy, finance, HPC, and cloud integration all support this mixed model. That mix is commercially
              rational for a quantum hardware company because buyers still need access, enablement, benchmarking, and
              technical integration before large-scale recurring usage exists. The implication, however, is that revenue
              quality is not yet obviously homogeneous. Some portions of revenue may be recurring or usage-based, while
              other portions may be milestone-driven, consulting-like, or tightly linked to hardware deployment cycles.
              Public materials do not quantify the split. As a result, the financial question is not whether Pasqal can
              monetize at all—the answer is clearly yes—but whether it can shift enough of that monetization toward
              repeatable, higher-quality revenue before capital markets or customers become less patient.
