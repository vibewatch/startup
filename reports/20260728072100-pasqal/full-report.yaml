      - number: '8.4'
        title: 'Diligence asks and kill triggers: the next move should be more data, not more storytelling'
        blocks:
          - type: paragraph
            body: >-
              Valuation discipline on Pasqal should revolve around a short list of measurable asks. First, investors
              need a clean bridge from the newly disclosed €16.5 million 2025 commercial-revenue figure to current
              bookings, backlog, recognized revenue, and revenue-stream composition. Second, they need customer-quality
              evidence: concentration by top account, renewal or follow-on behavior, and proof that named flagship
              programs are converting from pilot-style projects into referenceable operational usage. Third, they need
              unit economics by product layer so that a hardware-heavy growth plan can be mapped to eventual margins
              rather than just to technical milestones. The thesis-break triggers are equally concrete. If flagship
              customers do not mature, if the manufacturing ramp lags, or if public-market enthusiasm fades before
              economics improve, the present valuation can go from merely demanding to clearly unattractive. Until those
              asks are answered, the right move is to keep Pasqal on the front watchlist, not to underwrite it as
              obviously mispriced.
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV040
