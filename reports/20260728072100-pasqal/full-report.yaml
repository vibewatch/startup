      - number: '6.4'
        title: >-
          Expansion, concentration, and procurement friction: real traction exists, but the journey to production is
          still long
        blocks:
          - type: paragraph
            body: >-
              Pasqal’s go-to-market pattern appears to be land through technical collaboration, prove a narrowly framed
              workload, then try to expand through deeper integration or ecosystem reach. The best example is Crédit
              Agricole CIB, where the published roadmap explicitly runs from exploratory projects to operational
              targeting in 2028. IBM and European HPC relationships could also function as force multipliers by exposing
              Pasqal hardware to larger developer and research communities. But this same model carries clear risk.
              Enterprise quantum budgets often stay trapped in evaluation mode, and adverse sources emphasize that many
              companies remain cautious because technical and commercial uncertainty is still high. The public file also
              does not disclose top-customer concentration, revenue by segment, or whether any single relationship
              materially anchors the company’s commercial story. The correct underwriting posture is therefore balanced:
              Pasqal has enough customer proof to take seriously, but not enough durability disclosure to assume a
              smooth jump from pilots and codevelopment into broad production revenue.
