      - number: '2.2'
        title: 'Sizing lenses: measurable revenue is emerging, but broad TAM still overstates near-term reality'
        blocks:
          - type: paragraph
            body: >-
              Public sources now support multiple market-sizing lenses, but they are not interchangeable. McKinsey’s
              2026 monitor estimates that quantum-computing companies generated more than $1 billion of revenue in 2025
              and could reach $3.2 billion to $4.4 billion by 2028, while also putting total industry value-at-stake at
              $1.3 trillion to $2.7 trillion by 2035. QED-C is slightly more conservative and more segmented: it pegs
              the global quantum-computing market at about $1.4 billion in 2025 and more than $3 billion by 2028, while
              its broader state-of-industry page says the total quantum industry—including non-computing
              segments—reached $1.9 billion in 2025. The Business Research Company uses a far broader ‘enterprise
              quantum computing’ definition and therefore reports a much larger $4.78 billion market in 2025, growing to
              $6.28 billion in 2026 and $18.54 billion by 2030. Those numbers are not directly contradictory so much as
              boundary-dependent.


              For Pasqal, the neutral-atom-specific lens is more relevant than the enterprise-quantum aggregate. Global
              Market Insights values the neutral-atom quantum computing market at $134 million in 2025, $176.1 million
              in 2026, and $1.2 billion by 2035. That is much smaller than the enterprise-wide quantum figure but much
              closer to Pasqal’s actual modality and therefore more useful for estimating the competitive intensity of
              its immediate pool. The practical takeaway is that Pasqal participates in a fast-growing market, but
              investors should not underwrite against the largest headline TAM unless they are explicit about time
              horizon and included segments. Today’s revenue pool is measurable and rising; the far larger
              value-at-stake figures reflect workflow impact potential, not immediately available vendor revenue.
            claimRefs:
