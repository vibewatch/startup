              access beyond a single proof of concept. Those are good durability signals, but they are not substitutes
              for retention metrics. The retained file contains no disclosed NRR, GRR, churn, renewal rate, contract
              tenure, account-level ARR, or customer satisfaction benchmark. As a result, investors can reasonably infer
              that some relationships are becoming deeper, but they cannot yet quantify how repeatable that pattern is
              across the installed base. The practical outcome is that any retention conclusion must stay framed as a
              diligence hypothesis rather than a settled fact. Pasqal’s customer evidence looks better than
              pre-commercial vaporware, yet it still falls short of a mature enterprise-cohort story.
