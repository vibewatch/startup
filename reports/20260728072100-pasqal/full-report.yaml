    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Illustrative enterprise values if investors applied different revenue multiples to Pasqal’s disclosed 2025
      commercial revenue base.
    data:
      items:
        - label: €16.5M @ 20x
          value: 330
          detail: A harsh reset multiple for early frontier hardware / software risk.
        - label: €16.5M @ 40x
          value: 660
          detail: Still premium, but far below current mark.
        - label: €16.5M @ 80x
          value: 1320
          detail: Aggressive growth multiple with significant optimism.
        - label: €16.5M @ 120x
          value: 1980
          detail: Roughly the current valuation on 2025 revenue.
        - label: €16.5M @ 160x
          value: 2640
          detail: Requires sustained scarcity premium and rapid execution confidence.
    approximationNotes: >-
