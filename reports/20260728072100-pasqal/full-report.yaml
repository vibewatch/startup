      - number: '7.3'
        title: >-
          Partner, customer, and people risk: Pasqal’s best proofs are concentrated and require coordinated execution
          across scarce talent
        blocks:
          - type: paragraph
            body: >-
              Pasqal’s commercial narrative is currently powered by a small number of strong references rather than a
              wide disclosed production base. Crédit Agricole CIB, EDF, IBM, GENCI/FZJ, and Thales are all valuable, but
              they also create concentration in proof quality: if one flagship relationship stalls, the company’s
              perceived momentum could change quickly. The IBM relationship is especially double-edged because it
              strengthens developer reach while also tying part of Pasqal’s market-access story to a much larger
              ecosystem player. Sovereign and HPC links can similarly broaden distribution while introducing grant,
              procurement, or policy timing dependencies. Internally, the company must orchestrate research,
              manufacturing, cloud software, enterprise partnerships, and capital markets at the same time. That is a
              heavy people burden for any organization, especially in a field where the needed mix of physics,
              engineering, product, and solution-selling talent remains scarce. The result is a risk stack where
              customer concentration, partner dependence, and talent scarcity are tightly coupled rather than
              independent.
