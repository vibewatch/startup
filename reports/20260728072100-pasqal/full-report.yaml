      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The market’s most relevant buyers are not one monolithic ‘enterprise’ class. QED-C, McKinsey, IQM/The
              Quantum Insider, Global Market Insights, and sector-specific Pasqal partnership materials point to four
              recurring payer groups: governments and national labs, HPC centers and research organizations, large
              enterprises in compute-intensive sectors, and cloud/platform intermediaries. In the near term, many of
              these buyers are not purchasing fully scaled production outcomes; they are buying access, internal
              capability-building, and structured codevelopment. McKinsey explicitly says the engagement model is moving
              from proof-of-concept to paid codevelopment, while IQM’s 2026 market study shows that hands-on access is
              now common but scaled deployment is still rare. That is consistent with Pasqal’s public customer trail in
              finance, energy, and HPC integration.


              The buyer-user-payer split also varies by workflow. In finance, the payer is often the bank or
              capital-markets platform while the operational users are quant, risk, and infrastructure teams. In energy
              and chemistry, the payer may be an R&D or advanced-technology budget, while users are domain scientists or
              optimization teams. In sovereign and HPC contexts, procurement can be driven by national capability and
              infrastructure goals, with researchers or startups as downstream users. IQM’s data that 46 percent of
              buyers expect on-premises infrastructure to be part of their access model within three years also matters
              for Pasqal because it suggests the market may not remain public-cloud-only. Hybrid, sovereign, and locally
              controlled access could become a larger differentiator than raw qubit marketing alone, especially in
              Europe and the Gulf.
