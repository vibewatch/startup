      - number: '7.4'
        title: 'Financial-model risk and kill criteria: capital is real, but underwriting still hinges on conversion speed'
        blocks:
          - type: paragraph
            body: >-
              The financial question is simple to state and hard to answer publicly: will Pasqal turn its expanded
              capital base into enough technical and customer proof before the next funding or valuation checkpoint? The
              2026 financing and listing process clearly reduce short-term funding stress, but they do not make the
              business self-justifying. Public sources still do not disclose revenue, unit economics, gross margins, or
              customer concentration in a way that would let investors map hardware buildout cleanly to durable cash
              generation. That means the investment case stays milestone-sensitive. If a flagship customer reaches
              credible production use, if manufacturing scales without visible quality degradation, and if the company
              begins disclosing stronger economics, the risk picture can improve fast. If instead customer engagements
              remain pilot-heavy, benchmark clarity stays thin, or market conditions deteriorate before commercial
              evidence strengthens, dilution and down-round risk can reappear quickly. The correct framing is therefore
              conditional optimism with explicit kill criteria rather than blind faith in category momentum.
