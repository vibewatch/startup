  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - No flagship production proof
        - No materially stronger production reference than today by roadmap horizon
        - Weakens customer-quality case and revenue confidence
        - Hold watch or move to pass at current price
      - - Revenue fails to inflect from 2025 base
        - 2026 / 2027 updates do not show meaningful step-up
        - Current multiple becomes hard to defend
        - Require lower entry or abandon thesis
      - - Manufacturing / deployment ramp slips
        - Installed-base or production targets miss visibly
        - Undercuts scale premium and margin assumptions
        - Widen downside valuation range
      - - Public quantum multiples compress
        - Peer caps reset sharply lower
        - Comparability support disappears
        - Mark current private price as full or overfull
      - - Capital structure deteriorates
        - More dilutive financing or adverse listing outcome
        - Reduces upside capture for new investors
        - Demand higher return hurdle or stand aside
    notes: These are actionable triggers rather than generic concerns.
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV036
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue bridge
        - 2025 to 2026 YTD bookings / revenue / backlog by stream
        - Needed to judge whether current mark is being earned into
        - Management / auditor data room
      - - Customer concentration
        - Top accounts, renewals, and production-stage status
        - Revenue quality matters more than logo count at this price
        - Commercial diligence with customer references
      - - Unit economics
        - QPU sale margins, cloud gross margin, service economics
        - Valuation depends on future margin shape, not just growth
        - Finance and ops diligence
      - - Cap-table and convert terms
        - Dilution mechanics, preference stack, and conversion outcomes
        - Investor return depends on capital structure as well as EV
        - Legal / finance review
      - - Manufacturing efficiency
        - Yield, deployment cadence, field reliability
        - Scale premium requires operational repeatability
        - Operations diligence
    notes: >-
      If management cannot answer these asks, the valuation should be discounted more heavily than the technology story
      suggests.
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
