        title: >-
          Architecture and workflow: analog control, digital optionality, and emulator-first development are the core
          operating model
        blocks:
          - type: paragraph
            body: >-
              Pasqal’s public technical materials repeatedly emphasize that neutral-atom control is not limited to
              abstract gate compilation. Pulser and its documentation are explicit that users can design and simulate
              pulse sequences tailored to specific neutral-atom devices, work outside the standard digital-circuit
              paradigm, and create analog quantum simulations when the device physics support it. That is a real
              differentiator because it lets Pasqal pitch a broader experimental envelope than gate-only competitors,
              especially for simulation and optimization workloads. The cloud documentation extends this architecture
              into an operating workflow: users prepare jobs in Python, test them on remote or local emulators, select
              backends, submit work to QPUs, and monitor or retry jobs through the platform. IBM’s public supercomputing
              collaboration strengthens the same story by positioning Pasqal hardware as part of a broader
              hardware-agnostic hybrid compute layer. The technical product therefore looks less like a static box and
              more like a programmable workflow stack whose value depends on how easily users can move from simulation
              to hardware to hybrid orchestration.
