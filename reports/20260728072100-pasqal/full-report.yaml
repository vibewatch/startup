  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Pasqal competes across modality-matched peers, enterprise platforms, and sovereign HPC suppliers'
        blocks:
          - type: paragraph
            body: >-
              Pasqal is not in a single tidy peer set. The direct modality-matched rivals are other neutral-atom
              companies such as QuEra, Atom Computing, and planqc, because they make the same core technical pitch:
              room-temperature or less cryogenically burdensome atom-based quantum systems, programmability around atom
              arrays, and strength in simulation or hybrid workflows. But those are only the closest technology
              analogues. The enterprise buyer evaluating Pasqal can also choose trapped-ion vendors such as IonQ and
              Quantinuum, superconducting incumbents such as IBM and Google, and on-premise HPC-oriented suppliers such
              as IQM. AWS Braket and Azure Quantum add another important layer because they reduce buyer switching costs
              by presenting multiple hardware backends behind one cloud entry point. In practical underwriting terms,
              Pasqal’s hardest competition therefore comes less from one company copying its exact architecture and more
              from any rival that offers enough accessible hardware, software tooling, and commercial proof to satisfy
              the same optimization, simulation, or sovereign-compute budget. That broader frame matters because it
              lowers the protection conferred by modality uniqueness alone.
