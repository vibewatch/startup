  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: hybrid enterprise quantum workflows, not “all quantum”'
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Pasqal is not the entire quantum-technology complex and certainly not every
              dollar of future deep-tech value that might one day touch quantum. Pasqal’s paid addressable market sits
              inside enterprise quantum computing, and even there the most relevant spend is narrower: hardware access,
              cloud and emulator access, codevelopment, workflow integration, and technical services tied to
              optimization, simulation, and hybrid HPC use cases. McKinsey’s 2026 monitor, QED-C’s market forecasts, and
              The Business Research Company’s enterprise quantum market report all describe a sector whose monetizable
              offering spans hardware, software, services, and cloud deployment rather than a single hardware sale. That
              framing matters because Pasqal is not competing to capture all research funding, post-quantum cryptography
              spending, or quantum sensing budgets. It is competing for a specific set of enterprise and government
              compute budgets where buyers pay for capability-building before fault tolerance fully arrives.


              For Pasqal specifically, the most relevant sub-boundary is even tighter: neutral-atom access and
              integration for organizations that care about simulation, optimization, or hybrid quantum-classical
              experimentation. Future Markets, Global Market Insights, and Microsoft’s Pasqal provider page all support
              the idea that neutral-atom systems are being positioned not as isolated lab curiosities, but as
              cloud-accessible and increasingly enterprise-facing resources. Included spend therefore covers
              quantum-as-a-service, on-prem or hosted system access, application codevelopment, emulation, integration
              into HPC or analytics workflows, and vertical proof-of-value work. Excluded spend includes pure financial
              investment in quantum stocks, generic AI infrastructure, quantum sensing revenues, and the broad
              theoretical value-at-stake figures that do not yet convert directly into vendor revenue.
