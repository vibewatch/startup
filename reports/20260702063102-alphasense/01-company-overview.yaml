chapter:
  number: 1
  title: Company Overview
  summary: >-
    AlphaSense is a late-stage AI market-intelligence platform founded in 2011, valued at $7.5B in June 2026 with
    $600M+ reported ARR, 7,000+ enterprise clients, a 500M+ document library, and blue-chip investors, offset by
    company-reported metrics and active trademark and fee-dispute litigation.
sections:
  - id: identity-and-model
    title: Identity, headquarters, and business model
    body: >-
      AlphaSense positions itself as an AI platform "redefining market intelligence and workflow orchestration" for
      the business and financial world, a description repeated consistently across its homepage, About page, and 2026
      newsroom materials. Founded in 2011 with early roots spanning Helsinki and New York, the company has grown into
      a late-stage private enterprise-software business that in June 2026 opened a global headquarters at New York
      City's Hudson Yards while maintaining offices across the United States, the United Kingdom, Finland, Germany,
      India, and Singapore. The core product pairs a proprietary content library of more than 500 million business
      documents — equity research, earnings-call transcripts, expert interviews, filings, and news — with applied AI
      features marketed as Generative Search, Generative Grid, and Deep Research, and, from June 2026, an "always-on"
      agent called SuperAnalyst. The business model is subscription-based enterprise SaaS layered with
      enterprise-grade security and a private-cloud deployment option, targeting professionals who make high-stakes
      investing, corporate-strategy, and market-entry decisions.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO008
      - CO009
      - CO010
      - CO037
      - CO042
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: leadership-governance
    title: Leadership, governance, and key-person dependence
    body: >-
      Leadership centers on founder and CEO Jack Kokko, a Finnish-American former equity-research analyst who
      conceived AlphaSense out of the tedium of manual investment-banking research; his continued centrality is the
      company's clearest key-person dependency. The executive bench deepened materially in 2026 with the appointment
      of Samantha Greenberg as Chief Financial Officer, tasked with leading capital-markets strategy, global financial
      operations, and investor engagement — a hire that typically signals preparation for later-stage financing or an
      eventual public listing. Long-tenured co-founder Raj Neervannan is associated with the CTO role overseeing AI
      and platform engineering. Governance expanded alongside the June 2026 round when Sophie Bower-Straziota, a
      Partner at Vitruvian, joined the board of directors, adding growth-equity oversight. Public materials do not
      publish a complete executive roster, committee structure, or a reconciled cap table, so board composition and
      voting control remain partially opaque. The concentration of vision and external trust around Kokko, combined
      with an incomplete governance disclosure, is a diligence item rather than a red flag.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO027
      - CO037
      - CO038
      - CO039
    tableRefs:
      - TO002
  - id: funding-and-metrics
    title: Funding history, valuation, and cover metrics
    body: >-
      AlphaSense's financing arc is steep and well documented. A September 2023 Series E raised $150 million at a $2.5
      billion valuation led by BOND, when the company reported more than 4,000 enterprise customers and over 1,000
      employees. In June 2024 it raised $650 million at a $4 billion valuation and simultaneously announced the $930
      million acquisition of rival Tegus. In June 2026 it closed a $350 million round at a $7.5 billion valuation —
      nearly double the prior mark — led by Vitruvian Partners, Accenture Ventures, and J.P. Morgan Asset Management,
      with new investors D. E. Shaw Ventures and Pinegrove Opportunity Partners and existing backers CapitalG, Goldman
      Sachs Alternatives, and Viking Global Investors. The company says total funding is now well over $1 billion. On
      cover metrics, AlphaSense reported exceeding $600 million of annual recurring revenue in Q1 2026, up from $500
      million in October 2025, serving more than 7,000 enterprises including over 70% of the S&P 500. These figures
      are company-reported rather than audited; headcount and a precise cumulative raised figure remain the
      least-supported numbers and are flagged as gaps.
    claimRefs:
