  - id: milestones-recognition-adverse
    title: Milestones, recognition, and adverse events
    body: >-
      The chronology of record ties the funding rounds to product and reputational milestones. Product expansion came
      through the 2024 Tegus acquisition, which folded a large expert-interview library into AlphaSense, and a 2025
      acquisition of Carousel to add AI-driven Excel modeling. Recognition accelerated in 2026: AlphaSense was named a
      Leader in the inaugural Gartner Magic Quadrant for Competitive and Market Intelligence Platforms — positioned
      highest on both Ability to Execute and Completeness of Vision — and one of Fast Company's Most Innovative
      Companies for 2026 in the Enterprise category, with additional analyst visibility from Forrester and Forbes.
      Strategically, Accenture became the company's first strategic channel partner, while The D. E. Shaw Group and
      J.P. Morgan appear as both clients and investors, blurring arms-length independence. On the adverse side,
      AlphaSense is a defendant in a trademark-infringement suit brought by AlphaSights in the Southern District of
      New York (Case 1:25-cv-00479), is party to a fee dispute with Financial Technology Partners heard in the New
      York Appellate Division, and operates in an environment of rising generative-AI trade-secret litigation. None
      appears existential, but each warrants monitoring.
    claimRefs:
