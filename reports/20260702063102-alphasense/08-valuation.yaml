  - id: scenarios-comps
    title: Scenarios, comparables, and financing context
    body: >-
      Three scenarios frame the return. The bull case assumes sustained 20%-plus ARR growth plus agentic upsell from
      SuperAnalyst, re-rating the multiple higher; the base case assumes growth moderating to the high teens with
      margin improvement, holding the multiple near 12x; the bear case involves growth deceleration, competitive
      pricing pressure, or a litigation setback that compresses the multiple. On comparables, public data/analytics
      incumbents trade at a spread of trailing-revenue multiples: Moody's around 10.4x, S&P Global around 7.8x, LSEG
      around 4.3x, and FactSet around 3.7x, based on 2026 market-cap-to-revenue data — with AlphaSense's ~12x ARR
      multiple sitting above all four, a private-market growth premium consistent with its faster revenue growth and
      AI-native positioning. High-growth AI software such as Palantir commands premium multiples above the AlphaSense
      level, and private AI market-intelligence peers have raised at rich valuations — placing AlphaSense sensibly
      between mature incumbents and hyper-growth AI names, though the premium over public comps would compress quickly
      if growth decelerates toward incumbent-like rates. On financing context, total funding is well over $1 billion,
      and as a late-stage private round the preference stack and dilution overhang warrant review, along with entry
      discipline given the near-doubling of valuation in two years.
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV009
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV033
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
    tableRefs:
      - TV003
      - TV004
    figureRefs:
      - FV002
      - FV003
  - id: exit-triggers
    title: Exit readiness, triggers, and diligence asks
    body: >-
      Exit readiness is reasonable: realistic paths include a large strategic acquisition by a data, cloud, or
      consulting incumbent, or an eventual IPO once profitability is demonstrated, and category leadership plus scale
      make AlphaSense a plausible target or issuer. Return potential ultimately depends on sustaining growth to
      justify the entry multiple. Several monitorable thesis-break triggers should be tracked: ARR growth falling
      below roughly 20% year over year, an adverse trademark ruling touching the brand, sustained margin compression
      from pricing pressure, loss of the founder-CEO, or a material regulatory penalty under the EU AI Act or GDPR.
      The final diligence asks are concrete and prioritized: audited financials and burn, net revenue retention and
      cohort data, litigation reserves, the cap table and preference terms, and content-licensing agreements. Closing
      these — especially profitability and retention — would convert a conditional proceed into a high-conviction
      call, and their absence is the single largest valuation gap today, making disciplined verification the single
      decisive determinant of whether this attractive franchise becomes a high-conviction investment.
    claimRefs:
      - CV029
      - CV030
      - CV034
      - CV037
      - CV038
      - CV039
