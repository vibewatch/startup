company:
  name: AlphaSense
chapter:
  number: 8
  title: Valuation
  summary: >-
    AlphaSense's June 2026 round priced it at $7.5B on $600M+ ARR (~12x, nearly double its 2024 mark), validated by
    blue-chip investors and Gartner/Forrester leadership; the recommendation is a conditional proceed at a
    full-but-defensible valuation, with growth durability the swing factor and audited profitability, retention, and
    litigation reserves the key diligence asks that would lift conviction.
sections:
  - id: thesis
    title: Investment thesis and anti-thesis
    body: >-
      The investment thesis for AlphaSense rests on five reinforcing pillars. It operates in a large and growing
      market-intelligence market, defends a differentiated moat of more than 500 million proprietary business
      documents deepened by the Tegus acquisition, serves a diversified base of over 7,000 blue-chip enterprises,
      generates more than $600 million of high-quality recurring revenue growing around 20%, and is recognized by both
      Gartner and Forrester as a category leader. The Accenture strategic partnership adds a distribution catalyst.
      Against this, the anti-thesis is credible: generative-AI capabilities risk commoditization, incumbents such as
      Bloomberg and S&P can bundle competing offerings, customer retention is undisclosed, and profitability is not
      public. On balance the thesis outweighs the anti-thesis, but conviction on the specific price is tempered by the
      private-financial gaps, which is why the recommendation is conditional rather than unqualified and why the
      diligence asks below focus on retention and profitability disclosure.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV032
      - CV035
      - CV036
      - CV040
    tableRefs:
      - TV002
    figureRefs:
      - FV001
  - id: recommendation
    title: Recommendation, confidence, and valuation stance
    body: >-
      The recommendation is a conditional proceed: AlphaSense is an attractive, category-leading franchise, but a
      final commitment should be contingent on satisfying key diligence asks. Confidence is medium-to-high — the
      public evidence on valuation, ARR, growth, and market recognition is unusually strong for a private company, yet
      the absence of profitability and retention data caps conviction. The risk rating is moderate, driven chiefly by
      the AlphaSights trademark litigation and by valuation sensitivity to growth. On valuation stance, the June 2026
      round priced AlphaSense at $7.5 billion, nearly double the $4 billion set in June 2024, on more than $600
      million of ARR — implying roughly a 12x ARR multiple. That multiple is full but defensible: it sits above mature
      data incumbents yet below hyper-growth AI names, and blue-chip investor participation from Vitruvian, Accenture
      Ventures, and J.P. Morgan Asset Management validates the pricing. The step-up itself is notable: AlphaSense was
      marked at $2.5 billion in September 2023, doubled to $4 billion by June 2024, and nearly doubled again to $7.5
      billion by June 2026 — roughly a 3x re-rating in under three years, which raises the entry-discipline bar for
      any new capital committed at the current mark.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV025
      - CV026
      - CV027
      - CV028
      - CV031
      - CV041
    tableRefs:
      - TV001
    figureRefs:
