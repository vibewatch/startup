chapter:
  number: 6
  title: Customers
  summary: >-
    AlphaSense serves 7,000+ enterprises including 70%+ of the S&P 500 and nearly all major financial institutions,
    with named clients J.P. Morgan and D. E. Shaw and strong review-site satisfaction; the base is large, diversified,
    and growing, but net revenue retention, churn, and cohort data are undisclosed, making retention the key
    customer-diligence gap alongside client-investor independence.
sections:
  - id: segmentation
    title: Customer base and segmentation
    body: >-
      AlphaSense serves a large, blue-chip enterprise base: more than 7,000 global enterprises as of June 2026,
      including over 70% of the S&P 500, a majority of the Fortune 500, and nearly all of the world's largest
      financial institutions. The base segments cleanly into two families with a third emerging vertical.
      Financial-services customers — asset managers, banks, and hedge funds — are the core, corporate strategy,
      corporate-development, and competitive-intelligence teams form the second pillar, and consulting and advisory
      firms are a growing third. The base skews decisively to large enterprises rather than SMBs, consistent with
      premium enterprise pricing, and spans North America plus expanding EMEA and APAC regions where AlphaSense has
      more than doubled headcount. This breadth across verticals and geographies gives the customer base
      diversification that reduces reliance on any single segment, and it is the foundation of the recurring-revenue
      franchise examined in the financials chapter.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU023
      - CU024
      - CU025
      - CU035
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-proof
    title: Adoption trajectory and named proof
    body: >-
      Adoption has grown steeply: the client count rose from more than 4,000 at the 2023 Series E to over 7,000 by the
      2026 round, and the Tegus acquisition brought an additional expert-research customer base into the franchise. On
      named proof, J.P. Morgan and The D. E. Shaw Group are disclosed client relationships — notably both are also
      investors — and AlphaSense publishes customer stories and case studies as production references, while over 70%
      S&P 500 penetration serves as aggregate proof. Given the enterprise scale, these references appear to be
      production deployments rather than pilots. Third-party evidence reinforces the picture: AlphaSense holds strong
      verified-review ratings on G2, positive reviews on TrustRadius, presence on Gartner Peer Insights, and favorable
      aggregate ratings across independent software directories. Analyst recognition, including the 2026 Gartner
      Leader placement, further strengthens reference quality and buyer trust.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU028
      - CU029
      - CU030
    tableRefs:
      - TU002
      - TU003
    figureRefs:
      - FU002
      - FU003
  - id: retention-satisfaction
    title: Retention, satisfaction, and durability
    body: >-
      Direct retention metrics are the weakest part of the public record: net revenue retention, gross retention, and
      churn are all undisclosed and constitute the main customer-diligence gap. In their place, several proxies point
      to healthy durability. Rapid ARR growth from $500 million to over $600 million on a large existing base implies
      strong retention and expansion, enterprise contract lengths are typically annual or multi-year, and review-site
      evidence suggests high satisfaction with search breadth and time savings. Common criticisms in reviews center on
      pricing and learning curve rather than core value, which is a comparatively benign complaint profile. Still,
      without disclosed cohort data, retention strength is inferred rather than proven, so the analysis treats
      durability as probable but unverified. Obtaining cohort retention, NRR, and churn data is the single most
      valuable customer-diligence step, because it would convert the strongest inference in this chapter into hard
      evidence and directly informs the lifetime-value assumptions used in the valuation chapter.
    claimRefs:
      - CU016
      - CU017
      - CU031
      - CU032
      - CU034
      - CU039
    tableRefs:
      - TU004
    figureRefs:
      - FU004
  - id: expansion-concentration
    title: Expansion and concentration risk
    body: >-
      Expansion and concentration frame the durability of the base. The land-and-expand motion drives account growth
      from a few analyst seats to enterprise-wide deployment, and expansion into agentic workflows such as
      SuperAnalyst creates upsell potential within existing accounts. Concentration risk appears low at the customer
      level: 70%-plus S&P 500 and broad Fortune 500 penetration indicate diversified adoption, and no single-customer
      revenue concentration is publicly disclosed. Two nuances warrant attention. First, the dual client-and-investor
      relationships with J.P. Morgan and The D. E. Shaw Group blur arms-length independence and should be checked for
      market-standard commercial terms. Second, the Accenture channel partnership adds a degree of partner-dependent
      customer acquisition that concentrates future growth in a single go-to-market alliance. A minor brand-confusion
      risk arises from the AlphaSights trademark dispute, which could create modest friction in customer procurement.
      On balance the customer base is large, blue-chip, diversified, and growing, with independence and channel
      dependence the two main items remaining to verify in commercial diligence and legal review.
    claimRefs:
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU026
      - CU027
      - CU033
      - CU037
      - CU038
      - CU040
    tableRefs:
      - TU005
