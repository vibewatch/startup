        title: Product definition and workflows
        blocks:
          - type: paragraph
            body: >-
              AlphaSense is an AI market-intelligence platform that helps professionals search, analyze, and act on
              business and financial information, organized around a searchable library of more than 500 million premium
              documents. In workflow terms, an investment analyst can research a company across filings, earnings calls,
              and expert interviews in one place; a corporate strategist can track competitors and markets;
              corporate-development teams can screen and diligence targets; and consultants can synthesize market
              evidence into client-ready insight. The company markets distinct solutions for financial-services and
              corporate customers, plus a dedicated AI-for-financial-services offering. The product positions AI outputs
              as decision-support that augments rather than replaces analysts, which matters for enterprise trust.
              Content spans equity research, earnings-call transcripts, expert interviews, SEC filings, news, and trade
              journals, giving the platform breadth that generic tools lack. This combination of broad licensed content
              and finance-specific workflows is the product's core identity and the foundation for everything layered on
