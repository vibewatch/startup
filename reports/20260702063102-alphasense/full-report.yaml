    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and business model
        blocks:
          - type: paragraph
            body: >-
              AlphaSense positions itself as an AI platform "redefining market intelligence and workflow orchestration"
              for the business and financial world, a description repeated consistently across its homepage, About page,
              and 2026 newsroom materials. Founded in 2011 with early roots spanning Helsinki and New York, the company
              has grown into a late-stage private enterprise-software business that in June 2026 opened a global
              headquarters at New York City's Hudson Yards while maintaining offices across the United States, the
              United Kingdom, Finland, Germany, India, and Singapore. The core product pairs a proprietary content
              library of more than 500 million business documents — equity research, earnings-call transcripts, expert
              interviews, filings, and news — with applied AI features marketed as Generative Search, Generative Grid,
              and Deep Research, and, from June 2026, an "always-on" agent called SuperAnalyst. The business model is
              subscription-based enterprise SaaS layered with enterprise-grade security and a private-cloud deployment
              option, targeting professionals who make high-stakes investing, corporate-strategy, and market-entry
              decisions.
