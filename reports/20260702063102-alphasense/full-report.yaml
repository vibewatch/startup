        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership centers on founder and CEO Jack Kokko, a Finnish-American former equity-research analyst who
              conceived AlphaSense out of the tedium of manual investment-banking research; his continued centrality is
              the company's clearest key-person dependency. The executive bench deepened materially in 2026 with the
              appointment of Samantha Greenberg as Chief Financial Officer, tasked with leading capital-markets
              strategy, global financial operations, and investor engagement — a hire that typically signals preparation
              for later-stage financing or an eventual public listing. Long-tenured co-founder Raj Neervannan is
              associated with the CTO role overseeing AI and platform engineering. Governance expanded alongside the
              June 2026 round when Sophie Bower-Straziota, a Partner at Vitruvian, joined the board of directors, adding
              growth-equity oversight. Public materials do not publish a complete executive roster, committee structure,
              or a reconciled cap table, so board composition and voting control remain partially opaque. The
              concentration of vision and external trust around Kokko, combined with an incomplete governance
              disclosure, is a diligence item rather than a red flag.
