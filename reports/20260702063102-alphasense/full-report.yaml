        title: Funding history, valuation, and cover metrics
        blocks:
          - type: paragraph
            body: >-
              AlphaSense's financing arc is steep and well documented. A September 2023 Series E raised $150 million at
              a $2.5 billion valuation led by BOND, when the company reported more than 4,000 enterprise customers and
              over 1,000 employees. In June 2024 it raised $650 million at a $4 billion valuation and simultaneously
              announced the $930 million acquisition of rival Tegus. In June 2026 it closed a $350 million round at a
              $7.5 billion valuation — nearly double the prior mark — led by Vitruvian Partners, Accenture Ventures, and
              J.P. Morgan Asset Management, with new investors D. E. Shaw Ventures and Pinegrove Opportunity Partners
              and existing backers CapitalG, Goldman Sachs Alternatives, and Viking Global Investors. The company says
              total funding is now well over $1 billion. On cover metrics, AlphaSense reported exceeding $600 million of
              annual recurring revenue in Q1 2026, up from $500 million in October 2025, serving more than 7,000
              enterprises including over 70% of the S&P 500. These figures are company-reported rather than audited;
              headcount and a precise cumulative raised figure remain the least-supported numbers and are flagged as
              gaps.
