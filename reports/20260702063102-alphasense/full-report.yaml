      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, SOM, and Contradictory Lenses'
        blocks:
          - type: paragraph
            body: >-
              No single analyst publishes an AlphaSense-specific TAM, and the adjacent-category estimates that do exist
              disagree by an order of magnitude depending on how narrowly "competitive and market intelligence" is
              defined. At the broadest lens, the global business intelligence software market is sized at $36.6B (2023,
              Grand View Research) growing to $86.7B by 2030, while Precedence Research puts the 2026 figure at $47.5B
              growing to $168.1B by 2035 — both plausible but non-identical trajectories for a category AlphaSense only
              partially occupies. Narrowing to competitive intelligence specifically, Market Research Intellect sizes
              the software segment at $3.59B (2025) growing to $7.1B by 2033, while Fortune Business Insights sizes a
              narrower "competitive intelligence tools" sub-segment at only $0.71-0.87B in 2025-2026 — roughly one-fifth
              of Market Research Intellect's figure for a nominally similar category, illustrating how much scope
              definition drives the number.


              A second lens is enterprise generative AI, the technology layer AlphaSense's Generative Search and Deep
              Research products sit within: Research and Markets sizes this at $6.52B in 2026 (up from $4.66B in 2025),
              while Straits Research's competing estimate for the same nominal category is $5.25B in 2026 growing to
              $59.25B by 2034 at a 35.4% CAGR — a lower base but steeper growth curve. A third lens is the
              expert-network market AlphaSense entered via Tegus: CleverX estimates this at roughly $2.5B (2024), while
              QYResearch's estimate of $4.05B (2025) rising to $7.12B by 2032 is over 60% higher for a similar scope,
              again showing wide methodological variance. A fourth lens — financial data terminals, the incumbent
              category AlphaSense partially displaces — shows Bloomberg Terminal holding an estimated 27.5-33%
              mindshare/share with 325,000+ subscribers at $24,000-32,000/year, versus FactSet's smaller ~4.5-19.2%
              share and ~240,000 users; one source (BERI) reports AlphaSense's own list pricing at roughly $18,000/seat,
              positioned below Bloomberg but materially above self-serve SaaS research tools.


              Because no lens cleanly isolates AlphaSense's addressable market, this chapter treats these four
              overlapping estimates as constrained sizing inputs rather than a single TAM, and preserves the spread
              (illustrated in the figures below) as a diligence finding in itself: AlphaSense's own $600M+ ARR (restated
              from the company-overview chapter) already represents a double-digit percentage of the narrowest
              ($0.71-0.87B) competitive-intelligence-tools estimate, which would be structurally implausible if that
              estimate is authoritative — suggesting AlphaSense's true addressable market is better approximated by the
              broader BI-software or enterprise-GenAI lenses, or that the narrow analyst categories understate real
              spend.
