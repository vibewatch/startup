      - number: '7.4'
        title: People, execution, and financial risk
        blocks:
          - type: paragraph
            body: >-
              On people and execution, founder-CEO Jack Kokko is a key-person dependency for strategy and vision, and
              the recent appointment of CFO Samantha Greenberg introduces a leadership-transition risk during a pivotal
              scaling phase. Rapid headcount growth across EMEA and APAC strains hiring and culture, scaling an agentic
              product roadmap demands scarce and costly AI talent, and absorbing two acquisitions while growing
              organically is a demanding agenda. Independent employee-review evidence corroborates the culture strain:
              Comparably rates AlphaSense's overall employee-reported culture at 2.9 out of 5 (a C- grade) as of April
              2026, and about a third of surveyed reviews are constructive or critical, with specific comments citing
              micromanagement and post-acquisition friction — a signal worth monitoring for retention of scarce
              technical talent. Financially, high growth typically implies elevated cash burn ahead of durable
              profitability, a roughly 12x ARR valuation embeds high expectations sensitive to deceleration, and
              AI-native rivals plus incumbent bundling by Bloomberg and S&P could pressure pricing and margins.
              Undisclosed profitability and burn are the core financial-risk gap. The mitigation-and-kill-criteria
              framework pairs each principal risk — litigation, growth, security, key-person, regulatory, culture, and
              content licensing — with a monitorable trigger and a clear action implication for the investment thesis.
