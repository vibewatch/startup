  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              AlphaSense does not compete in one market; it sits inside a cluster of adjacent categories that analysts
              size and label inconsistently. Gartner formally recognized the category for the first time in its
              inaugural 2026 Magic Quadrant for Competitive and Market Intelligence (C&MI) Platforms, naming AlphaSense,
              Valona Intelligence, and Northern Light as Leaders. This is a meaningful boundary marker: before 2026
              there was no dedicated analyst-defined category for AI-native market/competitive intelligence platforms,
              and vendors were split across business intelligence, market research, and financial-data-terminal reviews.
              C&MI platforms are defined by the combination of proprietary content licensing (equity research,
              transcripts, expert calls, filings), generative-AI search/summarization, and workflow automation for
              research-intensive knowledge work.


              Included spend covers: enterprise licenses for AI-native research/search platforms, expert-network and
              transcript-library subscriptions, and premium content licensing bundled into these platforms. Excluded
              spend includes: general-purpose BI/analytics tooling used for internal dashboards (Tableau, Power BI
              class), general-purpose enterprise search/knowledge-management tools with no financial or
              competitive-research specialization, and pure sell-side equity research paid for via trading commissions
              or unbundled cash payments. Adjacent categories that overlap in budget and buyer but are not the core
              market include enterprise generative AI platforms (Glean, Writer, and general LLM copilots),
              financial-data terminals (Bloomberg, FactSet, Capital IQ, Refinitiv), and expert networks (GLG,
              AlphaSights, Third Bridge, Guidepoint) — the last of which AlphaSense itself entered via its 2024 Tegus
              acquisition, folding a status-quo substitute into its own product line.


              The status-quo substitute for most buyers remains manual analyst work: reading SEC filings and sell-side
              notes directly, commissioning bespoke expert calls, and assembling findings in spreadsheets and slide
              decks without a dedicated software layer. This manual baseline is the real competitor AlphaSense displaces
              for a large share of its addressable buyers, not merely other software vendors.
