      - number: '7.3'
        title: Operational, security, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, generative-AI hallucination and accuracy risk is the headline concern for a research
              platform whose value rests on trust; AlphaSense mitigates this with grounded, source-linked outputs but
              external accuracy audits would strengthen assurance. Security is addressed through enterprise-grade
              controls and private-cloud deployment, making a client-data breach low-likelihood but high-severity.
              Platform outages and content-source disruptions are lower-severity operational risks, while integrating
              the Tegus and Carousel acquisitions carries execution risk. On dependencies, the Accenture channel
              partnership concentrates a rising share of go-to-market in one alliance, and the platform relies on cloud
              infrastructure, foundation-model providers, and third-party content licensing for equity research, news,
              and filings. The Tegus expert network depends on continued expert participation. A further, less visible
              dependency is customer concentration: AlphaSense reports 7,000+ enterprise customers and has grown ARR per
              customer from roughly $28,000 to $66,000 in about three years, but it has not disclosed net or gross
              revenue retention or a top-account concentration schedule, so how much recurring revenue rests on a small
              number of large accounts cannot be independently verified. None of these dependencies is presently
              alarming, but cloud, content-licensing renewals, and undisclosed retention are the operational triggers
              most worth monitoring given their coverage and durability impact.
