  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              AlphaSense competes in a fragmented field that spans four archetypes plus status-quo substitutes. The
              first archetype is incumbent financial-data and terminal providers — Bloomberg, S&P Global Market
              Intelligence, FactSet, Moody's, and Morningstar — which hold deep installed bases and are now embedding
              generative AI into legacy platforms. The second is expert networks — GLG, Guidepoint, and Third Bridge —
              that compete directly with the Tegus expert-content library AlphaSense acquired in 2024. The third is
              competitive-intelligence software such as Klue and Crayon, which serve product and marketing teams on a
              mid-market SaaS model. The fourth is AI-native research startups like Hebbia and Brightwave targeting
              overlapping financial-research workflows. Within the incumbent group, LSEG Workspace (the rebranded
              Refinitiv terminal) and S&P Capital IQ Pro are the two most directly comparable named rivals to Bloomberg
              and FactSet, each pairing deep structured financial data with a real-time terminal and now layering on
              generative-AI features. AlphaSense's own history folds a fifth, quieter archetype into the picture: legacy
              point competitors it has absorbed, notably Sentieo (acquired 2022) and Tegus (acquired 2024), whose
              workflow-search and expert-transcript products no longer compete as independent alternatives. A newer,
              adjacent fifth archetype is general-purpose AI-native enterprise search and answer engines — Glean for
              internal knowledge search and Perplexity's expanding Enterprise tier — which do not yet match AlphaSense's
              proprietary financial content but represent a workflow-substitution risk if they extend into external
              research data. Beyond named rivals, the most pervasive substitutes are manual research using generic web
              and AI search and internal build, where large banks and funds develop in-house AI research tools. The
              landscape is fragmenting rather than consolidating, which both validates the category and multiplies the
              fronts AlphaSense must defend.
