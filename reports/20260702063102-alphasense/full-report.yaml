      - number: '8.4'
        title: Exit readiness, triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is reasonable: realistic paths include a large strategic acquisition by a data, cloud, or
              consulting incumbent, or an eventual IPO once profitability is demonstrated, and category leadership plus
              scale make AlphaSense a plausible target or issuer. Return potential ultimately depends on sustaining
              growth to justify the entry multiple. Several monitorable thesis-break triggers should be tracked: ARR
              growth falling below roughly 20% year over year, an adverse trademark ruling touching the brand, sustained
              margin compression from pricing pressure, loss of the founder-CEO, or a material regulatory penalty under
              the EU AI Act or GDPR. The final diligence asks are concrete and prioritized: audited financials and burn,
              net revenue retention and cohort data, litigation reserves, the cap table and preference terms, and
              content-licensing agreements. Closing these — especially profitability and retention — would convert a
              conditional proceed into a high-conviction call, and their absence is the single largest valuation gap
              today, making disciplined verification the single decisive determinant of whether this attractive
              franchise becomes a high-conviction investment.
