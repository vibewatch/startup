              - CV026
      - number: '8.2'
        title: Recommendation, confidence, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The recommendation is a conditional proceed: AlphaSense is an attractive, category-leading franchise, but
              a final commitment should be contingent on satisfying key diligence asks. Confidence is medium-to-high —
              the public evidence on valuation, ARR, growth, and market recognition is unusually strong for a private
              company, yet the absence of profitability and retention data caps conviction. The risk rating is moderate,
              driven chiefly by the AlphaSights trademark litigation and by valuation sensitivity to growth. On
              valuation stance, the June 2026 round priced AlphaSense at $7.5 billion, nearly double the $4 billion set
              in June 2024, on more than $600 million of ARR — implying roughly a 12x ARR multiple. That multiple is
              full but defensible: it sits above mature data incumbents yet below hyper-growth AI names, and blue-chip
              investor participation from Vitruvian, Accenture Ventures, and J.P. Morgan Asset Management validates the
              pricing. The step-up itself is notable: AlphaSense was marked at $2.5 billion in September 2023, doubled
              to $4 billion by June 2024, and nearly doubled again to $7.5 billion by June 2026 — roughly a 3x re-rating
              in under three years, which raises the entry-discipline bar for any new capital committed at the current
              mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
