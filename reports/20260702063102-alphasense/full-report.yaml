  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for AlphaSense rests on five reinforcing pillars. It operates in a large and growing
              market-intelligence market, defends a differentiated moat of more than 500 million proprietary business
              documents deepened by the Tegus acquisition, serves a diversified base of over 7,000 blue-chip
              enterprises, generates more than $600 million of high-quality recurring revenue growing around 20%, and is
              recognized by both Gartner and Forrester as a category leader. The Accenture strategic partnership adds a
              distribution catalyst. Against this, the anti-thesis is credible: generative-AI capabilities risk
              commoditization, incumbents such as Bloomberg and S&P can bundle competing offerings, customer retention
              is undisclosed, and profitability is not public. On balance the thesis outweighs the anti-thesis, but
              conviction on the specific price is tempered by the private-financial gaps, which is why the
              recommendation is conditional rather than unqualified and why the diligence asks below focus on retention
              and profitability disclosure.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV032
              - CV035
              - CV036
              - CV040
          - type: table
