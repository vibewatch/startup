      - number: '6.3'
        title: Retention, satisfaction, and durability
        blocks:
          - type: paragraph
            body: >-
              Direct retention metrics are the weakest part of the public record: net revenue retention, gross
              retention, and churn are all undisclosed and constitute the main customer-diligence gap. In their place,
              several proxies point to healthy durability. Rapid ARR growth from $500 million to over $600 million on a
              large existing base implies strong retention and expansion, enterprise contract lengths are typically
              annual or multi-year, and review-site evidence suggests high satisfaction with search breadth and time
              savings. Common criticisms in reviews center on pricing and learning curve rather than core value, which
              is a comparatively benign complaint profile. Still, without disclosed cohort data, retention strength is
              inferred rather than proven, so the analysis treats durability as probable but unverified. Obtaining
              cohort retention, NRR, and churn data is the single most valuable customer-diligence step, because it
              would convert the strongest inference in this chapter into hard evidence and directly informs the
              lifetime-value assumptions used in the valuation chapter.
