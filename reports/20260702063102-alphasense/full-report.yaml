  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              AlphaSense presents a risk profile skewed toward legal, quality, and disclosure risk for a
              category-leading but still-private company. The most material risks, ranked by residual severity, are the
              AlphaSights trademark litigation given the centrality of the brand, generative-AI accuracy and
              hallucination risk that could undermine research trust, and valuation risk from a roughly 12x ARR multiple
              that is sensitive to any growth deceleration. Compounding these, AlphaSense discloses no net or gross
              revenue retention and no top-account concentration figures despite serving 7,000+ enterprise customers,
              and independent employee reviews grade its culture a below-average C- amid the Tegus and Carousel
              integration. Two structural strengths partially cushion the profile: a $350 million 2026 raise provides a
              balance-sheet buffer, and Gartner-recognized category leadership mitigates competitive pressure, but
              neither resolves the litigation, disclosure, or culture risks directly. The chapter organizes risks into
              regulatory/legal, operational/security, partner/dependency, people/execution, and financial/model buckets,
              then maps mitigations and monitorable kill triggers. Overall the analysis concludes that risk is real and
              only partially mitigated by capital, leadership depth, and market position, with litigation, retention
              disclosure, and culture the items most worth active monitoring. Each category below is scored on
              likelihood, severity, and residual exposure so that diligence effort can be prioritized toward the risks
              that most threaten the investment thesis rather than spread evenly across minor or purely hypothetical
              concerns that do not move the valuation.
            claimRefs:
              - CR031
              - CR009
              - CR027
              - CR033
              - CR034
              - CR040
              - CR041
              - CR043
