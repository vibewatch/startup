      - number: '3.3'
        title: Switching cost, distribution, and supply access
        blocks:
          - type: paragraph
            body: >-
              Competitive dynamics hinge on lock-in, multi-homing, distribution, and supply. Incumbent terminals enjoy
              deep workflow lock-in, and buyers frequently multi-home, running AlphaSense alongside a Bloomberg or
              FactSet seat rather than replacing it outright, which caps displacement but also seeds expansion.
              AlphaSense builds its own switching costs through enterprise contracts and workflow integration into
              research processes. On distribution, the June 2026 Accenture channel partnership extends reach into
              agentic enterprise systems, a lever point competitors lack. The company's most defensible edge is supply
              access: a proprietary content library and expert transcripts that are costly and slow to replicate, with
              the Tegus acquisition consolidating a major expert-content source under its control. That consolidation
              followed the 2022 Sentieo acquisition, so two formerly independent research-platform competitors —
              quantitative workflow and search tooling (Sentieo) and expert-call transcripts (Tegus) — now sit inside
              AlphaSense rather than as standalone alternatives, narrowing the field of point substitutes even as it
              raises integration-execution risk. Together these give AlphaSense a supply-and-distribution position
              stronger than pure-play AI startups, even if it cannot match incumbents' total installed base.
