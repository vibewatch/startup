      - number: '6.4'
        title: Expansion and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Expansion and concentration frame the durability of the base. The land-and-expand motion drives account
              growth from a few analyst seats to enterprise-wide deployment, and expansion into agentic workflows such
              as SuperAnalyst creates upsell potential within existing accounts. Concentration risk appears low at the
              customer level: 70%-plus S&P 500 and broad Fortune 500 penetration indicate diversified adoption, and no
              single-customer revenue concentration is publicly disclosed. Two nuances warrant attention. First, the
              dual client-and-investor relationships with J.P. Morgan and The D. E. Shaw Group blur arms-length
              independence and should be checked for market-standard commercial terms. Second, the Accenture channel
              partnership adds a degree of partner-dependent customer acquisition that concentrates future growth in a
              single go-to-market alliance. A minor brand-confusion risk arises from the AlphaSights trademark dispute,
              which could create modest friction in customer procurement. On balance the customer base is large,
              blue-chip, diversified, and growing, with independence and channel dependence the two main items remaining
              to verify in commercial diligence and legal review.
