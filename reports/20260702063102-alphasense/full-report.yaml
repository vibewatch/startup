      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The legal docket is the most concrete risk area. AlphaSense faces an active trademark-infringement suit
              from AlphaSights in the Southern District of New York, where a protective order was signed on May 19, 2026
              and fact discovery is due in November 2026; an adverse ruling or injunction touching the brand would be a
              genuine thesis-break trigger. Separately, a fee-related dispute with Financial Technology Partners is
              before a New York appellate court. On the regulatory side, the EU AI Act imposes phased obligations on
              AI-system providers and GDPR governs personal-data processing across European operations, both raising
              compliance cost but remaining manageable for a well-funded firm. Emerging generative-AI trade-secret
              litigation and copyright exposure over the 500-million-document library are structural IP considerations.
              As a private company, AlphaSense discloses limited compliance detail, so verifying licensing terms and
              litigation reserves is a priority diligence path.
            claimRefs:
