      - number: '8.3'
        title: Scenarios, comparables, and financing context
        blocks:
          - type: paragraph
            body: >-
              Three scenarios frame the return. The bull case assumes sustained 20%-plus ARR growth plus agentic upsell
              from SuperAnalyst, re-rating the multiple higher; the base case assumes growth moderating to the high
              teens with margin improvement, holding the multiple near 12x; the bear case involves growth deceleration,
              competitive pricing pressure, or a litigation setback that compresses the multiple. On comparables, public
              data/analytics incumbents trade at a spread of trailing-revenue multiples: Moody's around 10.4x, S&P
              Global around 7.8x, LSEG around 4.3x, and FactSet around 3.7x, based on 2026 market-cap-to-revenue data —
              with AlphaSense's ~12x ARR multiple sitting above all four, a private-market growth premium consistent
              with its faster revenue growth and AI-native positioning. High-growth AI software such as Palantir
              commands premium multiples above the AlphaSense level, and private AI market-intelligence peers have
              raised at rich valuations — placing AlphaSense sensibly between mature incumbents and hyper-growth AI
              names, though the premium over public comps would compress quickly if growth decelerates toward
              incumbent-like rates. On financing context, total funding is well over $1 billion, and as a late-stage
              private round the preference stack and dilution overhang warrant review, along with entry discipline given
              the near-doubling of valuation in two years.
            claimRefs:
              - CV005
