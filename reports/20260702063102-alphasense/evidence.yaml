evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover metrics (ARR, customers, headcount)
    missingEvidence: Audited financials and a management-confirmed headcount and cumulative-raised figure.
    whyItMatters: Headline ARR, penetration, and headcount are company-reported and shape every downstream valuation lens.
    diligencePath: Request audited or management-certified ARR, customer count, and current headcount in a data room.
    relatedQuestionRefs:
      - QO013
      - QO017
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: Leadership and founder table completeness
    missingEvidence: A full, management-approved executive and board roster.
    whyItMatters: Key-person and governance analysis depends on a complete leadership picture.
    diligencePath: Request an internal org chart and board list.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: Stakeholder or investor map ownership
    missingEvidence: Reconciled cap table with ownership percentages and preference terms.
    whyItMatters: Control and economic rights cannot be assessed from named investors alone.
    diligencePath: Request the current cap table and shareholders' agreement.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: Milestone table chronology gaps
    missingEvidence: Exact dates for month/year-only milestones and any unannounced financings.
    whyItMatters: A precise chronology anchors later chapters.
    diligencePath: Confirm milestone dates against internal records.
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: An AlphaSense-specific SAM/SOM computed from a bottom-up analyst model rather than adjacent-category proxies.
    whyItMatters: >-
      Without an isolated SAM/SOM, investors cannot independently benchmark AlphaSense's $600M+ ARR against a defensible
      ceiling, and must rely on company-disclosed growth alone to judge market-capture headroom.
    diligencePath: >-
      Commission or locate a bottom-up analyst model (e.g., from Gartner, IDC, or a specialist boutique) that explicitly
      sizes the C&MI platform category Gartner named in its 2026 Magic Quadrant.
    relatedQuestionRefs:
      - QM029
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      AlphaSense-disclosed customer mix by vertical (percentage of ARR from banking vs. asset management vs. corporate
      strategy vs. life sciences vs. consulting).
    whyItMatters: >-
      The buyer/segment map in this chapter is constructed from general industry commentary, not AlphaSense-specific
      disclosure, so budget-owner and adoption-trigger claims cannot be verified against the company's actual book of
      business.
    diligencePath: >-
      Request customer-segment ARR breakdown and logo counts by vertical directly from AlphaSense or its investors
      during diligence calls.
    relatedQuestionRefs:
      - QM013
      - QM014
    relatedTableRefs:
      - TM003
  - type: access-blocked
    severity: minor
    topic: evidence-quality
    missingEvidence: >-
      Full text of Gartner Peer Insights user reviews for the competitive and market intelligence tools category, which
      are rendered via JavaScript and not fully retrievable via static fetch.
    whyItMatters: >-
      Peer Insights review detail (ratings distribution, reviewer company size/industry) would strengthen or challenge
      the Gartner Leader positioning claim beyond the press-release-level confirmation available here.
    diligencePath: >-
      Access Gartner Peer Insights directly via a licensed Gartner account or browser session to review the full ratings
      breakdown.
    relatedQuestionRefs:
      - QM011
    relatedTableRefs:
      - TM001
  - type: conflicting-data
    severity: minor
    topic: market-sizing
    missingEvidence: >-
      A reconciled explanation for why AlphaSense's own ARR already exceeds the narrowest published
      competitive-intelligence-tools market estimate.
    whyItMatters: >-
      This inconsistency signals either analyst-category understatement or scope mismatch, either of which materially
      changes how a valuation multiple should be benchmarked against 'market share.'
    diligencePath: >-
      Cross-check AlphaSense's ARR composition against the specific inclusion/exclusion criteria used by Fortune
      Business Insights and Market Research Intellect before citing either figure as a share denominator.
    relatedQuestionRefs:
      - QM028
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-segmentation
    missingEvidence: >-
      Confirmation of whether government/public-sector or academic buyers represent a meaningful segment for AlphaSense,
      which is not covered in the current segment/buyer map.
    whyItMatters: >-
      If public-sector or academic demand is material, the buyer map understates total addressable segments and adoption
      triggers.
    diligencePath: >-
      Search AlphaSense case studies and procurement/RFP databases for government or academic customer references not
      surfaced in this run.
    relatedQuestionRefs:
      - QM013
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: competitor pricing benchmarks
    missingEvidence: Actual contract prices for AlphaSense and named rivals.
    whyItMatters: Price competitiveness and margin comparisons cannot be firmly assessed from public descriptions.
