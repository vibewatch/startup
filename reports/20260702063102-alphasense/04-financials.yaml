company:
  name: AlphaSense
chapter:
  number: 4
  title: Financials
  summary: >-
    AlphaSense reports $600M+ recurring ARR in Q1 2026 (up from $500M in Oct 2025) on enterprise SaaS plus Tegus
    expert content, a $7.5B valuation, and a fresh $350M raise with no evident debt; revenue quality looks high but
    unaudited, while gross margin, NRR, CAC, and burn are undisclosed, making audited statements the decisive
    diligence blocker.
sections:
  - id: revenue-model
    title: Revenue streams, pricing, and mix
    body: >-
      AlphaSense revenue is predominantly recurring enterprise SaaS: institutions pay for platform access spanning
      proprietary content, generative-AI search and grid, and, increasingly, agentic features such as SuperAnalyst. A
      second stream flows from expert content and transcripts folded in through the 2024 Tegus acquisition, which
      extended monetization into primary-research budgets. Monetization is seat-based and enterprise-licensed on a
      quote-based, non-public pricing model, expanding through a land-and-expand motion from a few analyst seats to
      firm-wide deployment. Revenue mix is weighted toward financial-services customers — asset managers, banks, and
      hedge funds — with a growing corporate-strategy and consulting segment, though AlphaSense does not publish a
      revenue-by-stream or by-segment breakdown, so mix is inferred rather than disclosed. The headline figure
      anchoring all of this is company-reported ARR exceeding $600 million in Q1 2026, up from $500 million in October
      2025, implying roughly 20% growth over about eight months and an elevated annualized rate. That growth on a
      large base is the single most important financial fact, but it is company-stated and unaudited.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: gtm-unit-economics
    title: Go-to-market and unit economics
    body: >-
      The go-to-market motion blends direct enterprise sales with the newly announced Accenture channel partnership,
      which is intended to embed AlphaSense intelligence into agentic enterprise systems and widen distribution.
      Enterprise sales cycles for institutional research platforms are typically multi-month and relationship-driven,
      and the land-and-expand path from analyst seats to enterprise deployment is the primary lever for net revenue
      expansion. Beyond that structural picture, the unit economics are largely undisclosed: customer-acquisition
      cost, payback period, and net revenue retention are not public and must be treated as gaps rather than estimated
      with false precision. Gross margin is undisclosed but, by analogy to software-and-content platforms, is likely
      high while offset by meaningful data-licensing and expert-network costs, AI-compute and R&D spend on generative
      features, and near-term operating expense from rapid EMEA and APAC headcount growth. The economics are therefore
      plausibly attractive but cannot be confirmed without management data.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI035
    tableRefs:
      - TI003
    figureRefs:
      - FI002
  - id: traction-gaps
    title: Public traction versus private gaps
    body: >-
      Public traction is strong and multiply corroborated: more than 7,000 enterprise clients, over 70% of the S&P
      500, and rapid ARR scaling, with Reuters and other outlets framing AlphaSense as a fast-growing private
      market-research firm that nearly doubled its valuation. Third-party revenue trackers broadly corroborate the
      reported ARR scale and growth, and independent web-traffic proxies indicate substantial platform usage. Against
      this, the private-metric picture is thin: revenue by segment, gross margin, net revenue retention, and cash-flow
      detail are all undisclosed, and reported ARR is company-stated and not independently audited. Incumbent data
      vendors such as S&P Global, FactSet, and Moody's that compete with AlphaSense do disclose audited financials and
      operate at large, profitable scale, which sets a benchmark AlphaSense cannot yet be measured against. The result
      is a company with credible, externally echoed traction but a material disclosure gap that constrains firm
      financial conclusions.
    claimRefs:
      - CI021
      - CI022
      - CI023
      - CI024
      - CI025
      - CI027
      - CI028
      - CI029
      - CI033
    tableRefs:
      - TI005
    figureRefs:
      - FI003
  - id: capital-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Capital adequacy appears strong. The June 2026 round added $350 million of fresh cash, total funding is stated
      at well over $1 billion, and the $7.5 billion valuation — nearly double the prior $4 billion mark — reflects
      consistent, oversubscribed demand from blue-chip investors, easing financing dependency. Burn rate, runway, and
      planned use of funds are undisclosed, but there is no public evidence of material debt or project-finance
      obligations, and the 2026 CFO appointment signals maturing financial operations and capital-markets readiness.
      The main capital deployment on record is M&A, notably the $930 million Tegus acquisition. On the verdict:
      revenue quality looks high given recurring subscriptions and echoed growth, though it is unaudited; the margin
      path is plausibly attractive but unproven; capital intensity is moderate and well-funded; and an adverse
      litigation-cost overhang from the AlphaSights trademark suit is a minor expense risk. The decisive diligence
      blocker is the absence of audited statements and disclosed margins, which any serious investor should require
      before underwriting the multiple.
    claimRefs:
      - CI015
      - CI016
      - CI017
      - CI018
      - CI019
      - CI020
      - CI030
