  - id: TM004
    title: 增长驱动因素和采用约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 对冲基金和资管机构 AI / 另类数据预算上升
        - 驱动
        - 2026 年，持续
        - 94% 受访管理人计划增加 AI 支出；扩大 AI 原生研究工具的 SAM
        - 确认增量支出有多少流向 AlphaSense 这类平台，而不是自研专有工具
      - - 企业广泛采用 GenAI / 智能体
        - 驱动
        - 2026 年，持续
        - 97% 高管称过去一年部署了 AI 智能体，AI 原生研究工作流因此常态化
        - 评估采用是否真正嵌入业务，还是高管乐观偏差下的汇报假象
      - - 药企专利「超级悬崖」（2026-2030）
        - 驱动
        - 2026-2030
        - 在生命科学领域，CI 从支持职能升到战略必需项；AlphaSense 称药企是其强势阵地
        - 核实 AlphaSense 实际收入结构中生命科学客户贡献的占比和增长率
      - - Gartner 首个 C&MI Magic Quadrant（2026）
        - 驱动
        - '2026'
        - 正式品类认可能加快企业采购背书，并提高进入 RFP 的概率
        - 跟踪 Gartner 认可是否可衡量地改变竞争性交易胜率
      - - MiFID II 研究费用拆分遗留影响
        - 驱动（历史）
        - 2018-2025
        - 卖方公司接触预算被削减约 20%，部分支出转向 AI 原生自助平台
        - 量化 AlphaSense 欧洲 ARR 中有多少来自这一转移
      - - 生成式 AI 试点失败 / ROI 缺口
        - 约束
        - 2025-2026 年，持续
        - MIT 发现 95% 的 GenAI 试点未能进入生产；初次采用后，席位扩张可能被拖住
        - 索取 AlphaSense 客户扩张 / 续约数据，检验其能否顶住这一品类共性模式
      - - EU AI Act 高风险合规截止日
        - 约束
        - 2026 年 8 月
        - 罚款最高 EUR35M / 营业额 7%；给受监管金融服务买方增加合规负担
        - 确认 AlphaSense 产品是否根据该法案被归为高风险 AI 系统
      - - MNPI / 内幕交易合规风险
        - 约束
        - 持续，执法趋严
        - 约束专家网络相邻（Tegus）工作流；SEC 和律所提示审查趋严
        - 审查 AlphaSense / Tegus 在会议记录和专家电话中筛查 MNPI 的合规控制
      - - EU Listing Act 重新打包研究付费（2026）
        - 约束
        - 2026 年 6 月起
        - 部分逆转 MiFID II 带给 AI 原生自助平台的顺风
        - 监测欧洲研究预算是否回流到打包的卖方研究
      - - 品类规模口径模糊 / 缺少 AlphaSense 专属 TAM
        - 约束
        - 持续
        - 独立估值对标变难；投资者只能依赖公司披露的 ARR 增长
        - 推动第三方分析师明确测算 AlphaSense 目前领跑的 C&MI 平台品类规模
    notes: 时间标签是定性判断；方向反映截至 2026 年中对 AlphaSense 可服务市场和采用速度的净影响，不是 AlphaSense 专属披露。
