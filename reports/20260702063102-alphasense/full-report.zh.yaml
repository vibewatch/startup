  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              AlphaSense 不是在一个单一市场里竞争；它处在一组相邻品类的交界处，而分析师对这些品类的规模和命名并不一致。Gartner 在 2026
              年首份竞争与市场情报（C&MI）平台魔力象限中首次正式承认这一品类，并把 AlphaSense、Valona Intelligence 和 Northern Light 评为领导者。这是一个有意义的边界标记：在
              2026 年以前，AI 原生市场 / 竞争情报平台没有专门的分析师定义品类，厂商被分散放进商业智能、市场研究和金融数据终端评测里。C&MI
              平台的定义，是把专有内容授权（股票研究、电话会文字稿、专家电话、监管文件）、生成式 AI 搜索 / 摘要和面向研究密集型知识工作的工作流自动化组合在一起。


              纳入的支出包括：AI 原生研究 / 搜索平台的企业许可、专家网络和电话会文字库订阅，以及打包进这些平台的高端内容授权。排除的支出包括：用于内部仪表盘的通用 BI / 分析工具（Tableau、Power BI
              一类）、没有金融或竞争研究专长的通用企业搜索 / 知识管理工具，以及通过交易佣金或未打包现金付款购买的纯卖方股票研究。预算和买方重叠、但不属于核心市场的相邻品类包括企业生成式 AI 平台（Glean、Writer
              和通用 LLM copilots）、金融数据终端（Bloomberg、FactSet、Capital IQ、Refinitiv），以及专家网络（GLG、AlphaSights、Third
              Bridge、Guidepoint）——最后一类也是 AlphaSense 通过 2024 年收购 Tegus 切入的市场，相当于把一个现状替代方案并入了自己的产品线。


              对多数买方而言，现状替代方案仍是分析师手工工作：直接阅读 SEC 文件和卖方报告，定制专家电话，再把结论拼进电子表格和幻灯片，没有专门的软件层。AlphaSense
              对相当一部分可触达买方真正替代的是这条手工基线，而不只是其他软件厂商。
