        title: 运营、安全与依赖风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，生成式 AI 幻觉和准确性是最大担忧，因为研究平台的价值建立在信任上；AlphaSense
              通过有来源支撑、带链接的输出降低这一风险，但外部准确性审计会让保证更扎实。安全方面，公司采用企业级控制和私有云部署，客户数据泄露概率低、但严重性高。平台宕机和内容来源中断是严重性较低的运营风险；Tegus 和
              Carousel 两项收购的整合也有执行风险。依赖方面，Accenture
              渠道合作让越来越多商业化动作集中在一个联盟上；平台还依赖云基础设施、基础模型提供商，以及股票研究、新闻和申报文件等第三方内容授权。Tegus
              专家网络依赖专家持续参与。还有一个更不显眼的依赖是客户集中度：AlphaSense 披露 7,000+ 家企业客户，单客户 ARR 在约三年内从约 $28,000 增至
              $66,000，但没有披露净收入留存、毛留存或头部账户集中度表，因此外部无法独立验证有多少经常性收入压在少数大客户身上。上述依赖目前没有明显报警，但考虑到覆盖面和耐久性影响，云、内容授权续约和未披露留存最值得监控。
