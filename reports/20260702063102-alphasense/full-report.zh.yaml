              CEO 离任；或在 EU AI Act 或 GDPR
              下出现重大监管处罚。最终尽调事项具体且有优先级：经审计财务和现金消耗、净收入留存和队列数据、诉讼准备金、股权结构表和优先权条款，以及内容授权协议。补齐这些事项——尤其是盈利能力和留存——会把有条件推进转成高确信度判断；缺少这些资料，是今天最大的估值缺口，也让严格核验成为决定这项有吸引力业务能否变成高确信度投资的唯一关键。
