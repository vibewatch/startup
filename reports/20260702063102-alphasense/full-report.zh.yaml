      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              领导层围绕创始人兼 CEO Jack Kokko 展开。他是芬兰裔美国人，曾任股票研究分析师，因为厌倦投行研究中的手工苦活而构想出 AlphaSense；他持续处在核心位置，也是公司最清晰的关键人物依赖。2026
              年，高管团队明显加厚：Samantha Greenberg 出任首席财务官，负责资本市场策略、全球财务运营和投资者沟通——这类任命通常意味着公司在为后期融资或最终上市做准备。长期任职的联合创始人 Raj
              Neervannan 与 CTO 角色相连，负责 AI 和平台工程。2026 年 6 月融资后，Vitruvian 合伙人 Sophie Bower-Straziota
              加入董事会，为公司补上增长股权投资视角。公开材料没有公布完整高管名单、委员会结构或经调和的股权结构表，因此董事会构成和投票控制仍部分不透明。Kokko
              身上的愿景与外部信任高度集中，再叠加治理披露不完整，这是尽调事项，不是红旗。
