      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              AlphaSense 的买方结构因垂直行业而明显不同。在投行和资产管理里，预算所有者通常是研究技术或 CIO / COO
              职能，日常用户是分析师或投资组合经理，付款方是基金或银行本身——采用触发点在于压缩研究时间，并把专家电话、电话会文字稿和监管文件搜索整合进一个工作流。在企业战略和竞争情报团队里，行业评论通常把预算所有权放在首席战略官或企业发展
              VP 手上，CI 分析师是终端用户；采用触发点是董事会要求更快竞争响应，且常由产品 /
              市场职能共同出资。在生命科学和制药行业，随着多年专利到期「超级悬崖」逼近，竞争情报已从边缘支持职能变成发布和定价策略的核心输入，预算所有权也从单纯 R&D 转向商业战略和市场准入领导层。


              AlphaSense 通过 Tegus 进入的专家网络相邻细分里，存在清晰的付款方 / 用户分离：GLG、AlphaSights、Third Bridge 和 Guidepoint
              仍是最大的独立专家网络，这意味着 AlphaSense 的 Tegus 单元既与这些网络竞争，也依赖继续进入一个由前五大玩家拿走多数收入的市场。在价值链的卖方（数据 / 研究）一侧，MiFID II
              的研究费用拆分制度迫使欧洲资产管理公司直接为研究付费，而不再通过交易佣金支付，使卖方研究和企业接触预算估计缩水 20%，并把一部分支出推向 AI 原生自助平台——这是 AlphaSense SAM
              的结构性顺风。但这一趋势正被欧盟 2026 年 Listing Act 部分逆转：该法允许重新打包支付研究费用，可能缓解最初利好 AlphaSense 这类平台的支出压力。


              跨垂直行业看，采用路径通常从单个分析师或团队试点开始，进入采购 / 安全审查（AlphaSense 正因如此突出展示其安全和合规姿态），再走向企业级席位授权；扩张收入取决于能否从最初购买团队外扩到跨职能落地。
