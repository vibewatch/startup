  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              AlphaSense 面对的是一个碎片化市场，横跨四类竞争原型和现状替代方案。第一类是既有金融数据和终端提供商——Bloomberg、S&P Global Market
              Intelligence、FactSet、Moody's、Morningstar——它们握有深厚存量客户基础，并正在把生成式 AI 嵌入传统平台。第二类是专家网络——GLG、Guidepoint、Third
              Bridge——它们直接竞争 AlphaSense 2024 年收购 Tegus 后获得的专家内容库。第三类是 Klue、Crayon 等竞争情报软件，主要服务产品和市场团队，采用中端市场 SaaS
              模式。第四类是 Hebbia、Brightwave 等 AI 原生研究创业公司，瞄准重叠的金融研究工作流。在既有厂商中，LSEG Workspace（更名后的 Refinitiv 终端）和 S&P Capital
              IQ Pro 是与 Bloomberg、FactSet 最直接可比的两家具名对手；它们都把深厚结构化金融数据与实时终端结合起来，并正在叠加生成式 AI 功能。AlphaSense
              自身历史还把第五类更安静的原型纳入图景：它吸收过的传统单点竞争者，尤其是 Sentieo（2022 年收购）和 Tegus（2024
              年收购），它们的工作流搜索和专家文字稿产品已不再作为独立替代方案竞争。更新且相邻的第五类是通用 AI 原生企业搜索和答案引擎——Glean 做内部知识搜索，Perplexity 扩展 Enterprise
              层级——它们尚未匹配 AlphaSense 的专有金融内容，但如果延伸到外部研究数据，就会带来工作流替代风险。除具名对手外，最普遍的替代方案是使用通用网页和 AI
              搜索做手工研究，以及内部自建，即大型银行和基金自己开发 AI 研究工具。格局不是在整合，而是在碎片化；这既验证了品类，也增加了 AlphaSense 必须防守的战线。
