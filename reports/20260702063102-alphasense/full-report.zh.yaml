      - number: '3.3'
        title: 切换成本、分发与供给获取
        blocks:
          - type: paragraph
            body: >-
              竞争动态取决于锁定、多平台并用、分发和供给。既有终端享有很深的工作流锁定；买方也常多平台并用，在 Bloomberg 或 FactSet 席位旁边再跑
              AlphaSense，而不是直接替换，这限制了替代空间，但也埋下扩张种子。AlphaSense 通过企业合同和把工作流嵌入研究流程，构建自己的切换成本。分发上，2026 年 6 月宣布的 Accenture
              渠道合作，把触达延伸进智能体式企业系统，是竞争对手没有的杠杆点。公司最有防御力的边缘在供给侧：专有内容库和专家文字稿复制成本高、耗时长，Tegus 收购又把一个主要专家内容来源整合到自己控制下。此前 2022
              年它还收购 Sentieo，因此两个曾经独立的研究平台竞争者——量化工作流和搜索工具（Sentieo）、专家电话文字稿（Tegus）——现在都在 AlphaSense
              内部，而不是作为独立替代品存在；这压缩了单点替代市场，也抬高了整合执行风险。合在一起，这些因素让 AlphaSense 的供给和分发位置强于纯 AI 创业公司，即便它仍无法匹配既有厂商的总体装机基础。
