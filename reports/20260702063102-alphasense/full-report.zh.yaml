  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              AlphaSense 的风险画像偏向法律、质量和披露风险：它是品类龙头，但仍是私有公司。按剩余严重性排序，最重要的风险包括：AlphaSights 商标诉讼，因为品牌处在核心位置；生成式 AI
              准确性和幻觉风险，因为它可能削弱研究信任；以及估值风险，因为约 12x ARR 倍数对任何增长放缓都敏感。这些风险又被披露缺口放大：尽管服务 7,000+ 家企业客户，AlphaSense
              没有披露净收入留存、毛留存，也没有披露头部账户集中度；在 Tegus 和 Carousel 整合期间，独立员工评价还把公司文化评为低于平均的 C-。两个结构性强项能部分缓冲风险：2026 年 $350M
              融资提供了资产负债表缓冲，Gartner 认可的品类领导地位缓解竞争压力；但二者都不能直接解决诉讼、披露或文化风险。本章把风险归入监管 / 法律、运营 / 安全、伙伴 / 依赖、人才 / 执行、财务 /
              模型几类，并对应缓释措施和可监控的否决触发点。总体结论是：风险真实存在，只被资本、领导层深度和市场地位部分缓释；诉讼、留存披露和文化最值得持续监控。下文按可能性、严重性和剩余敞口给每类风险打分，让尽调精力优先投向最威胁投资逻辑的风险，而不是平均分散到不影响估值的次要或纯假设问题上。
