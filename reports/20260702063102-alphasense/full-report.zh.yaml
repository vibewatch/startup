              ARR——隐含约 12x ARR 倍数。这个倍数偏满，但可以辩护：它高于成熟数据既有厂商，低于超高增长 AI 公司；Vitruvian、Accenture Ventures 和 J.P. Morgan Asset
              Management 等蓝筹投资人参与，也验证了定价。估值台阶本身值得注意：AlphaSense 2023 年 9 月估值为 $2.5B，2024 年 6 月翻倍至 $4B，2026 年 6 月又几乎翻倍至
              $7.5B——不到三年约 3x 重估，这抬高了任何新资本按当前估值进入时的纪律门槛。
