            body: >-
              AlphaSense 的投资逻辑建立在五个相互强化的支柱上：所在市场情报市场规模大且仍在增长；500M+ 份自有商业文档构成差异化护城河，Tegus 收购又加深了护城河；客户基础分散，覆盖 7,000+
              家蓝筹企业；高质量经常性收入超过 $600M，且以约 20% 增长；Gartner 和 Forrester 都把它列为品类领导者。Accenture 战略合作又增加了分销催化剂。反方逻辑同样可信：生成式 AI
              能力可能商品化，Bloomberg 和 S&P
              等既有厂商可以捆绑竞争产品，客户留存未披露，盈利能力也未公开。总体看，正方逻辑压过反方逻辑；但私有公司财务缺口削弱了对具体价格的确信度。因此建议是有条件推进，而非无保留投入；下方尽调事项也聚焦留存和盈利披露。
