  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与工作流
        blocks:
          - type: paragraph
            body: >-
              AlphaSense 是一个 AI 市场情报平台，帮助专业人士搜索、分析并使用商业和金融信息，核心是一个可检索的 500M+
              高端文档库。放到工作流里，投资分析师可在同一处跨监管文件、财报电话会和专家访谈研究公司；企业战略人员可跟踪竞争对手和市场；企业发展团队可筛选并尽调标的；咨询顾问可把市场证据综合成能交付客户的洞察。公司面向金融服务和企业客户推出不同解决方案，并有专门的金融服务
              AI 产品。产品把 AI 输出定位为增强而非替代分析师的决策辅助，这对企业信任很重要。内容覆盖股票研究、财报电话会文字稿、专家访谈、SEC
              文件、新闻和行业期刊，给平台带来通用工具缺少的宽度。广泛授权内容与金融特定工作流的组合，是产品的核心身份，也是上层一切功能的基础。
