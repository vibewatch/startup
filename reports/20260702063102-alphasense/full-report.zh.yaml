      - number: '3.2'
        title: 能力、定价与信任对比
        blocks:
          - type: paragraph
            body: >-
              能力上，AlphaSense 把 500M 份文档的专有库——覆盖高端股票研究、监管文件、财报电话会、新闻和 Tegus 专家文字稿——与生成式 AI 搜索、网格和 SuperAnalyst
              智能体打包，没有单一竞争对手能完整复制。既有终端在数据宽度上可与之抗衡，但原生生成式 AI 落后；专家网络在实时专家访问上领先，却缺少广泛内容和 AI；CI 单点工具更窄。它在 2026 年被 Gartner
              评为领导者，并在两个轴上位置最高，这是新进入者拿不出的信任信号；私有云和企业安全选项也满足机构要求。S&P Capital IQ Pro 是能力层面最尖锐的既有厂商反例：独立买方评价认为，它在结构化基本面、筛选和
              Excel 原生建模上更深；同时也认为 AlphaSense 在生成式 AI 摘要（Generative Grid
              工具）和跨文档搜索上更强——对许多买方来说，两者与其说是替代品，不如说是互补品。定价上，AlphaSense 销售企业级、报价制订阅，处在高端价格层；Bloomberg 终端和 LSEG Workspace
              都有知名的极高单席价格；S&P Capital IQ Pro 按数据模块销售企业订阅，独立评价称其透明度低于 AlphaSense；专家网络按咨询或点数收费；CI 软件价格则落在低于终端经济模型的中端市场
              SaaS 水平。多数厂商不公布标价，因此这些对比只能看方向。总体看，AlphaSense 是一个差异化、高端定位的平台，竞争点不是价格，而是内容 + AI 的整合价值主张。
