  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: AlphaSense 的公开记录从 2011 年创立开始，延伸到融资轮次不断抬升、重大并购、分析师认可，以及仍在推进的诉讼。
    data:
      items:
        - date: '2011'
          label: 创立
          detail: AlphaSense 创立，目标是升级市场研究。
          tone: neutral
        - date: '2023-09-28'
          label: Series E $150M
          detail: 估值 $2.5B，客户 4,000+ 家。
          tone: positive
        - date: '2024-06-11'
          label: Series F $650M
