              公开记录中最薄弱的是直接留存指标：净收入留存、毛留存和流失率都未披露，是客户尽调的主要缺口。替代指标则指向健康的耐久性。ARR 在已有大客户基础上从 $500M 增至
              $600M+，说明留存和扩张较强；企业合同通常是一年期或多年期；评价网站证据也显示，用户满意于搜索广度和节省时间。评论中常见批评集中在定价和学习曲线上，而不是核心价值，投诉画像相对温和。尽管如此，缺少已披露的队列数据，留存强度只能推断，不能证明；因此本分析把耐久性视为大概率存在但尚未验证。拿到队列留存、NRR
              和流失率数据，是客户尽调中价值最高的一步，因为它会把本章最强推断变成硬证据，并直接影响估值章节使用的客户生命周期价值假设。
