              原生定位的增长溢价。Palantir 等高增长 AI 软件享有高于 AlphaSense 的溢价倍数，私有 AI 市场情报同行也以高估值融资——因此 AlphaSense 合理落在成熟既有厂商与超高增长 AI
              公司之间；但如果增长滑向成熟厂商式速度，相对公开可比公司的溢价会迅速压缩。融资背景上，总融资额已远超 $1B；作为后期私募轮，需审查优先权条款栈和稀释压力，同时考虑两年内估值近乎翻倍后，入场纪律是否足够。
