            body: >-
              三种情景框定回报。牛市情景假设 ARR 持续 20%+ 增长，并由 SuperAnalyst 带来智能体追加销售，从而推高倍数；基准情景假设增长放缓到十几个百分点高段，同时利润率改善，倍数维持在接近
              12x；熊市情景则是增长放缓、竞争性价格压力，或诉讼受挫导致倍数压缩。可比公司方面，公开数据 / 分析既有厂商的过去收入倍数分布较宽：Moody's 约 10.4x，S&P Global 约 7.8x，LSEG
