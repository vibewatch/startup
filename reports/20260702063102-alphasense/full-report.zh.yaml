      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求侧驱动强劲，而且时间点落在 2026 年：受访的对冲基金和资产管理专业人士中，94% 预计今年会增加 AI 支出；根据 Exabel 2026 年调查，约 84% 的另类数据预算已经处在每年
              $500K-$2.5M 区间；按 Neudata 口径，2025 年另类数据总支出约达 $2.8B，同比增长 17%。企业层面的生成式 AI 采用也很广：Writer 2026 年调查显示，97%
              的高管称过去一年部署过 AI 智能体，且日常高频使用。生命科学领域，专利「超级悬崖」（2026–2030 年有数千亿美元收入面临风险）正在把竞争情报从支持职能推向战略必需品；考虑到公司声称已渗透全球最大药企，这对
              AlphaSense 的制药 / 生命科学板块构成结构性顺风。


              采用约束同样实质。第一，ROI 落地滞后于投入：MIT 2025 年研究发现，95% 的生成式 AI 试点无法进入生产环境或贡献损益价值；另有 2026 年调查显示，企业 GenAI ROI 中位数仅约
              10%，低于更高目标，AI 项目放弃率也同比约翻倍。第二，监管敞口上升：欧盟《AI Act》的高风险合规义务将在 2026 年 8 月开始执行，禁止系统最高罚款可达 EUR35M 或全球营业额
              7%，高风险不合规最高可罚 EUR15M 或 3%——这直接限制 AI 原生研究工具在受监管金融服务买方内部的部署方式。第三，围绕重大非公开信息（MNPI）的信任和合规风险，限制了 AlphaSense
              业务中靠近专家网络的部分：SEC 指引要求投资顾问维持道德准则，限制利用通过专家电话等研究渠道获取的 MNPI 交易；2026 年律所评论还指出，监管机构正在把 MNPI
              审查扩展到预测市场合约等新工具。第四，卖方研究价值链里的资本 / 切换成本动态仍未稳定：MiFID II 拆分使卖方企业接触预算估计减少 20%，而欧盟 2026 年 Listing Act
