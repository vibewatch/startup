      - number: '2.2'
        title: 市场规模：TAM、SAM、SOM 与相互矛盾的口径
        blocks:
          - type: paragraph
            body: >-
              没有单一分析师发布 AlphaSense 专属 TAM；已有的相邻品类估算也会因为「竞争与市场情报」定义宽窄不同而相差一个数量级。最宽口径下，Grand View Research 把全球商业智能软件市场估为
              $36.6B（2023 年），到 2030 年增长至 $86.7B；Precedence Research 则给出 2026 年 $47.5B、2035 年增长至 $168.1B
              的路径——两条轨迹都说得通，但并不相同，而且 AlphaSense 只部分落在这个品类里。收窄到竞争情报本身，Market Research Intellect 估算软件细分市场为 $3.59B（2025
              年），到 2033 年增长至 $7.1B；Fortune Business Insights 对更窄的「竞争情报工具」子细分给出的 2025–2026 年规模仅 $0.71-0.87B——大约只有 Market
              Research Intellect 对名义相近品类估算的五分之一，说明范围定义足以左右数字。


              第二个口径是企业生成式 AI，也就是 AlphaSense 的 Generative Search 和 Deep Research 所处的技术层：Research and Markets 估算 2026 年规模为
              $6.52B（高于 2025 年 $4.66B），而 Straits Research 对同一名义品类的竞争性估算是 2026 年 $5.25B，并以 35.4% CAGR 增长至 2034 年
              $59.25B——基数更低，但增长曲线更陡。第三个口径是 AlphaSense 通过 Tegus 进入的专家网络市场：CleverX 估计 2024 年约 $2.5B；QYResearch 对相近范围的估算则是
              2025 年 $4.05B，到 2032 年升至 $7.12B，高出 60% 以上，再次显示方法差异很大。第四个口径是金融数据终端，也就是 AlphaSense 部分替代的既有品类：Bloomberg
              Terminal 估计拥有 27.5-33% 心智 / 市占份额、325,000+ 订户，价格为 $24,000-32,000/年；FactSet 份额较小，约 ~4.5-19.2%，用户约
              ~240,000；一个来源（BERI）披露 AlphaSense 自身标价约 $18,000/席位，低于 Bloomberg，但明显高于自助式 SaaS 研究工具。


              由于没有哪个口径能干净隔离 AlphaSense 的可触达市场，本章把上述四组重叠估算作为受约束的规模输入，而不是单一 TAM；同时把区间差异本身（见下方图表）保留下来，作为尽调结论：AlphaSense 自身
              $600M+ ARR（来自公司概览章节）已经占最窄 $0.71-0.87B 竞争情报工具估算的两位数比例。如果该估算权威可靠，这在结构上难以成立——因此，AlphaSense 真正可触达市场更适合用更宽的 BI
              软件或企业 GenAI 口径近似，或者说明狭义分析师品类低估了真实支出。
