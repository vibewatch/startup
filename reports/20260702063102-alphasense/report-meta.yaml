    - Net revenue retention, gross retention, churn, and cohort curves are not public, so durability is inferred not proven.
    - Preference stack, dilution overhang, and cap-table terms of the 2026 round remain undisclosed.
    - Content-licensing terms underpinning the 500M-document moat are not publicly detailed.
