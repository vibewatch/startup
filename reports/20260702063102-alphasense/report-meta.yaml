companyProfile:
  summary: AlphaSense is an AI market-intelligence company whose platform searches more than 500 million proprietary business documents — equity research, earnings calls, expert interviews, filings, and news — with generative search, grids, and agentic workflows for enterprises and financial institutions. It pairs exceptional growth, blue-chip customer scale, and category leadership with the disclosure gaps typical of a late-stage private company.
