  topStrengths:
    - Exceptional demand proof — $600M+ ARR growing roughly 20%, 7,000+ enterprise clients, and 70%+ of the S&P 500.
    - Category leadership validated by a 2026 Gartner Magic Quadrant Leader placement positioned highest on both axes and Forrester recognition.
    - A differentiated moat of 500M+ proprietary documents, deepened by the $930M Tegus acquisition and an Accenture channel partnership.
  topRisks:
    - The active AlphaSights trademark litigation in the SDNY is a material legal risk given the centrality of the brand.
    - A roughly 12x ARR valuation is sensitive to any growth deceleration or competitive pricing pressure from AI-native and incumbent rivals.
    - Generative-AI accuracy and undisclosed retention could undermine research trust and durability if not tightly controlled.
  unresolvedGaps:
