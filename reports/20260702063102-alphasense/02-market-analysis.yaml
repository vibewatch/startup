- id: TM004
  title: Growth Drivers and Adoption Constraints
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Rising AI/alt-data budgets among hedge funds and asset managers
    - Driver
    - 2026, ongoing
    - 94% of surveyed managers plan to increase AI spend; expands SAM for AI-native research tools
    - Confirm what share of incremental spend flows to platforms like AlphaSense vs. proprietary in-house
      tooling
  - - Broad enterprise GenAI/agent adoption
    - Driver
    - 2026, ongoing
    - 97% of executives report deploying AI agents in the past year, normalizing AI-native research workflows
    - Assess whether adoption is genuinely embedded or a reporting artifact of executive optimism bias
  - - Pharma patent "super-cliff" (2026-2030)
    - Driver
    - 2026-2030
    - Elevates CI from support function to strategic imperative in life sciences, AlphaSense's stated
      pharma stronghold
    - Verify AlphaSense's actual revenue mix and growth rate attributable to life-sciences accounts
  - - Gartner's first C&MI Magic Quadrant (2026)
    - Driver
    - '2026'
    - Formal category recognition can accelerate enterprise procurement legitimacy and RFP inclusion
    - Track whether Gartner recognition measurably shifts win rates in competitive deals
  - - MiFID II research-unbundling legacy
    - Driver (historical)
    - 2018-2025
    - Cut sell-side corporate-access budgets ~20%, pushing some spend toward AI-native self-serve platforms
    - Quantify how much of AlphaSense's European ARR is attributable to this shift
  - - Generative-AI pilot failure / ROI gap
    - Constraint
    - 2025-2026, ongoing
    - MIT finds 95% of GenAI pilots fail to reach production; risks stalling seat expansion after initial
      adoption
    - Request AlphaSense customer expansion/renewal data to test resilience against this category-wide
      pattern
  - - EU AI Act high-risk compliance deadline
    - Constraint
    - August 2026
    - Penalties up to EUR35M/7% of turnover; adds compliance burden for regulated financial-services buyers
    - Confirm whether AlphaSense's offerings are classified as high-risk AI systems under the Act
  - - MNPI / insider-trading compliance risk
    - Constraint
    - Ongoing, rising enforcement
    - Constrains expert-network-adjacent (Tegus) workflows; SEC and law firms flag rising scrutiny
    - Review AlphaSense/Tegus compliance controls for MNPI screening on transcripts and expert calls
  - - EU Listing Act re-bundling of research payments (2026)
    - Constraint
    - June 2026 onward
    - Partially reverses the MiFID II tailwind that favored AI-native self-serve platforms
    - Monitor whether European research budgets shift back toward bundled sell-side research
  - - Category sizing ambiguity / lack of AlphaSense-specific TAM
    - Constraint
    - Ongoing
    - Makes independent valuation benchmarking difficult; investors must rely on company-disclosed ARR
      growth alone
    - Push for third-party analyst coverage that explicitly sizes the C&MI platform category AlphaSense
      now leads
  notes: Timing labels are qualitative; direction reflects the net effect on AlphaSense's addressable
    market and adoption pace as of mid-2026, not an AlphaSense-specific disclosure.
