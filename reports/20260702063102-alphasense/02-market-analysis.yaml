- id: growth-drivers-constraints
  title: Growth Drivers and Adoption Constraints
  body: 'Demand-side drivers are strong and dated to 2026: 94% of surveyed hedge-fund and asset-management
    professionals expect to increase AI spending this year, with roughly 84% of alternative-data budgets
    already in the $500K-$2.5M annual range per Exabel''s 2026 survey, and total alternative-data spending
    reaching approximately $2.8B in 2025 (up 17% YoY per Neudata). Enterprise-wide generative-AI adoption
    is also broad: Writer''s 2026 survey finds 97% of executives report deploying AI agents in the past
    year, with heavy daily usage. In life sciences, an approaching patent "super-cliff" (hundreds of billions
    of dollars in revenue at risk 2026-2030) is pushing competitive intelligence from a support function
    to a strategic imperative, a structural tailwind for AlphaSense''s pharma/life-sciences segment given
    the company''s stated penetration of the world''s largest pharmaceutical companies.


    Adoption constraints are equally material. First, ROI realization lags investment: MIT''s 2025 research
    found 95% of generative-AI pilots fail to reach production or deliver bottom-line value, and separate
    2026 surveys report median enterprise GenAI ROI of only about 10% against higher targets, with AI-project
    abandonment rates roughly doubling year-over-year. Second, regulatory exposure is rising: the EU AI
    Act''s high-risk compliance obligations become enforceable in August 2026, carrying penalties up to
    EUR35M or 7% of global turnover for prohibited systems and up to EUR15M or 3% for high-risk non-compliance
    — a direct constraint on how AI-native research tools can be deployed inside regulated financial-services
    buyers. Third, trust and compliance risk around material non-public information (MNPI) constrains
    the expert-network-adjacent portion of AlphaSense''s business: SEC guidance requires investment advisers
    to maintain codes of ethics restricting trading on MNPI obtained through research channels including
    expert calls, and law-firm commentary in 2026 notes regulators are extending MNPI scrutiny to new
    instruments such as prediction-market contracts. Fourth, capital/switching-cost dynamics in the sell-side
    research value chain remain unsettled: MiFID II unbundling cut sell-side corporate-access budgets
    by an estimated 20%, and the EU''s 2026 Listing Act now permits re-bundled research payments, a reversal
    that could dampen some of the shift toward AI-native, self-serve platforms that originally benefited
    AlphaSense.'
