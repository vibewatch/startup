- id: buyer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: 'AlphaSense''s buyer structure varies materially by vertical. In investment banking and asset
    management, the budget owner is typically a research-technology or CIO/COO function, the day-to-day
    user is the analyst or portfolio manager, and the payer is the fund or bank itself — with adoption
    triggered by a need to compress research time and consolidate expert-call, transcript, and filing
    search into one workflow. In corporate strategy and competitive-intelligence teams, industry commentary
    places budget ownership with the Chief Strategy Officer or VP of Corporate Development, with CI analysts
    as end users; adoption is triggered by board-level demand for faster competitive response and is frequently
    co-funded with product/marketing functions. In life sciences and pharma, competitive intelligence
    has moved from a peripheral support function to a core input for launch and pricing strategy amid
    a looming multi-year patent-expiration "super-cliff," pushing budget ownership toward commercial strategy
    and market-access leadership rather than R&D alone.


    A distinct payer/user split exists in the expert-network-adjacent segment AlphaSense entered through
    Tegus: GLG, AlphaSights, Third Bridge, and Guidepoint remain the largest standalone expert networks,
    meaning AlphaSense''s Tegus unit both competes with and depends on continued access to a market where
    the five largest players already capture the majority of revenue. On the sell (data/research) side
    of the value chain, MiFID II''s research-unbundling regime forced European asset managers to pay for
    research directly rather than via trading commissions, shrinking sell-side research and corporate-access
    budgets by an estimated 20% and pushing some of that spend toward AI-native self-serve platforms —
    a structural tailwind for AlphaSense''s SAM that is now partially reversing under the EU''s 2026 Listing
    Act, which permits re-bundled payments and could relieve some of the spend pressure that originally
    favored platforms like AlphaSense.


    Across verticals, the adoption path typically runs from an individual analyst or team pilot, to procurement/security
    review (AlphaSense highlights its security and compliance posture prominently for exactly this reason),
    to an enterprise-wide seat license — with expansion revenue depending on cross-functional rollout
    beyond the initial buying team.'
