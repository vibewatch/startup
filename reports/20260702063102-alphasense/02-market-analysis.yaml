callouts:
- calloutType: insight
  title: Category Just Got a Name — Gartner's 2026 C&MI Magic Quadrant
  body: 'Gartner''s first-ever Magic Quadrant for Competitive and Market Intelligence Platforms, published
    in 2026 with AlphaSense named a Leader alongside Valona Intelligence and Northern Light, is a market-structure
    event as much as a competitive one: it formally separates this category from generic BI and enterprise-search
    analyst coverage for the first time, which should make future sizing estimates more comparable and
    could accelerate enterprise RFP inclusion for named Leaders.'
  claimRefs:
  - CM001
  - CM004
  - CM005
- calloutType: risk
  title: No Sizing Lens Is Authoritative — and AlphaSense's ARR Already Exceeds the Narrowest One
  body: AlphaSense's own $600M+ ARR (restated from the company-overview chapter) already exceeds Fortune
    Business Insights' entire $0.87B 2026 estimate for the "competitive intelligence tools" category,
    which would be structurally implausible if that narrow estimate were authoritative. This is either
    evidence the narrowest analyst category materially understates real spend, or a signal that AlphaSense's
    true addressable market should be benchmarked against the broader BI-software or enterprise-GenAI
    lenses instead — a distinction investors should resolve before anchoring valuation to any single third-party
    TAM figure.
  claimRefs:
  - CM007
  - CM016
  - CM017
  - CM045
- calloutType: risk
  title: Category-Wide GenAI ROI Problem Could Cap Expansion Revenue
  body: MIT's finding that 95% of generative-AI pilots fail to reach production, combined with 2026 survey
    data showing median enterprise GenAI ROI of only about 10%, suggests the adoption funnel's biggest
    leak is post-pilot expansion rather than initial trial — a pattern that would cap AlphaSense's seat-expansion
    and net-revenue-retention upside even where initial deals close easily on the strength of its Gartner
    recognition and reference customers.
  claimRefs:
  - CM026
  - CM027
  - CM037
  - CM039
- calloutType: assumption
  title: Buyer/Budget-Owner Map Is Author-Constructed From Industry Commentary
  body: No source discloses AlphaSense's actual customer mix by segment or confirms which budget-owner
    title (CSO, CIO, Head of Research) most often signs its contracts. The segment/buyer map in this chapter
    is built from general industry commentary on typical CI/research-technology budget ownership, not
    AlphaSense-specific disclosure, and should be treated as a diligence hypothesis rather than a confirmed
    fact pattern.
  claimRefs:
  - CM018
  - CM019
  - CM020
  - CM047
- calloutType: recommendation
  title: Track the EU AI Act and MiFID II Re-Bundling as Twin 2026 Regulatory Swing Factors
  body: 'Two regulatory developments landing in 2026 pull in opposite directions for AlphaSense''s addressable
    market: the EU AI Act''s August 2026 high-risk compliance deadline raises the bar for deploying AI-native
    research tools inside regulated financial-services buyers, while the EU''s Listing Act re-bundling
    of research payments could partially reverse the MiFID II-driven shift toward AI-native self-serve
    platforms. Diligence should track both implementation timelines directly rather than assume either
    resolves favorably for AlphaSense.'
  claimRefs:
  - CM031
  - CM032
  - CM035
  - CM036
