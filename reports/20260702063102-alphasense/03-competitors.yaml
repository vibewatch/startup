      - CP047
      - CP048
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: capability-pricing
    title: Capability, pricing, and trust comparison
    body: >-
      On capability, AlphaSense pairs a proprietary 500-million-document library — spanning premium equity research,
      filings, earnings calls, news, and Tegus expert transcripts — with generative-AI search, grid, and the
      SuperAnalyst agent, a bundle no single competitor fully matches. Incumbent terminals rival it on data breadth
      but trail on native generative AI; expert networks lead on live expert access but lack broad content and AI; CI
      point tools are narrower still. Its 2026 Gartner Leader placement, positioned highest on both axes, is a trust
      signal newer entrants cannot claim, and private-cloud plus enterprise-security options meet institutional
      requirements. S&P Capital IQ Pro is the sharpest incumbent counterpoint on capability: independent buyer
      reviews credit it with deeper structured fundamentals, screening, and Excel-native modeling, while crediting
      AlphaSense with stronger generative-AI summarization (its Generative Grid tool) and cross-document search — the
      two platforms are complements as much as substitutes for many buyers. On pricing, AlphaSense sells enterprise,
      quote-based subscriptions at a premium tier; Bloomberg's terminal and LSEG Workspace both command well-known
      very-high per-seat prices; S&P Capital IQ Pro sells enterprise subscriptions priced by data module with, per
      independent reviews, less transparency than AlphaSense; expert networks charge per consultation or credits; and
      CI software prices at mid-market SaaS levels below terminal economics. Because most vendors do not publish list
      prices, these comparisons are directional. The net picture is a differentiated, premium-positioned platform
      competing on an integrated content-plus-AI value proposition rather than price.
    claimRefs:
      - CP013
      - CP014
      - CP015
