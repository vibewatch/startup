company:
  name: AlphaSense
chapter:
  number: 3
  title: Competitors
  summary: >-
    AlphaSense competes against data incumbents (Bloomberg, LSEG Workspace/Refinitiv, S&P Global/Capital IQ Pro,
    FactSet), expert networks (GLG, Guidepoint, Third Bridge), CI point tools (Klue, Crayon), and AI-native
    entrants (Hebbia, Brightwave, Glean, Perplexity Enterprise); its integrated 500M+ document library, absorbed
    Sentieo/Tegus content and workflow tooling, generative-AI agents, Gartner Leader standing, and $7.5B capital
    base form an above-average moat, with incumbent AI bundling and AI-native workflow substitution the main
    displacement risks.
sections:
  - id: landscape
    title: Competitive landscape and substitutes
    body: >-
      AlphaSense competes in a fragmented field that spans four archetypes plus status-quo substitutes. The first
      archetype is incumbent financial-data and terminal providers — Bloomberg, S&P Global Market Intelligence,
      FactSet, Moody's, and Morningstar — which hold deep installed bases and are now embedding generative AI into
      legacy platforms. The second is expert networks — GLG, Guidepoint, and Third Bridge — that compete directly with
      the Tegus expert-content library AlphaSense acquired in 2024. The third is competitive-intelligence software
      such as Klue and Crayon, which serve product and marketing teams on a mid-market SaaS model. The fourth is
      AI-native research startups like Hebbia and Brightwave targeting overlapping financial-research workflows.
      Within the incumbent group, LSEG Workspace (the rebranded Refinitiv terminal) and S&P Capital IQ Pro are the
      two most directly comparable named rivals to Bloomberg and FactSet, each pairing deep structured financial
      data with a real-time terminal and now layering on generative-AI features. AlphaSense's own history folds a
      fifth, quieter archetype into the picture: legacy point competitors it has absorbed, notably Sentieo (acquired
      2022) and Tegus (acquired 2024), whose workflow-search and expert-transcript products no longer compete as
      independent alternatives. A newer, adjacent fifth archetype is general-purpose AI-native enterprise search and
      answer engines — Glean for internal knowledge search and Perplexity's expanding Enterprise tier — which do not
      yet match AlphaSense's proprietary financial content but represent a workflow-substitution risk if they extend
      into external research data. Beyond named rivals, the most pervasive substitutes are manual research using
      generic web and AI search and internal build, where large banks and funds develop in-house AI research tools.
      The landscape is fragmenting rather than consolidating, which both validates the category and multiplies the
      fronts AlphaSense must defend.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP007
      - CP009
      - CP010
      - CP011
      - CP012
      - CP038
      - CP041
