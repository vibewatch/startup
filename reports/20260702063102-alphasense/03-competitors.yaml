  - id: lockin-supply
    title: Switching cost, distribution, and supply access
    body: >-
      Competitive dynamics hinge on lock-in, multi-homing, distribution, and supply. Incumbent terminals enjoy deep
      workflow lock-in, and buyers frequently multi-home, running AlphaSense alongside a Bloomberg or FactSet seat
      rather than replacing it outright, which caps displacement but also seeds expansion. AlphaSense builds its own
      switching costs through enterprise contracts and workflow integration into research processes. On distribution,
      the June 2026 Accenture channel partnership extends reach into agentic enterprise systems, a lever point
      competitors lack. The company's most defensible edge is supply access: a proprietary content library and expert
      transcripts that are costly and slow to replicate, with the Tegus acquisition consolidating a major
      expert-content source under its control. That consolidation followed the 2022 Sentieo acquisition, so two
      formerly independent research-platform competitors — quantitative workflow and search tooling (Sentieo) and
      expert-call transcripts (Tegus) — now sit inside AlphaSense rather than as standalone alternatives, narrowing
      the field of point substitutes even as it raises integration-execution risk. Together these give AlphaSense a
      supply-and-distribution position stronger than pure-play AI startups, even if it cannot match incumbents' total
      installed base.
    claimRefs:
      - CP016
      - CP017
      - CP018
      - CP019
      - CP020
      - CP021
      - CP030
      - CP031
      - CP045
      - CP046
    figureRefs:
      - FP003
  - id: moat-durability
    title: Moat durability and displacement risk
    body: >-
      The durability question turns on whether content exclusivity and AI leadership can outrun commoditization.
      AlphaSense's content moat is genuinely hard to replicate, and its capital base — a $7.5 billion valuation and
      more than $1 billion raised — funds sustained investment in data and features. But generative-AI research
      capability is becoming a baseline expectation, and the clearest displacement risk is incumbents bundling AI
      directly into terminals with pre-existing distribution, potentially commoditizing the standalone value
      proposition. Regulatory and data-licensing compliance is a barrier that favours well-resourced platforms,
      partially offsetting this. A second, adjacent displacement path is generalist AI-native enterprise search and
      answer engines — Glean's internal-knowledge search and Perplexity's expanding Enterprise tier — which could
      erode the narrow research-workflow value proposition if they add external financial-research content at scale;
      today both trail AlphaSense on proprietary financial content but lead on general-purpose retrieval breadth. A
      rival AI-native vendor's own competitor analysis sharpens the adverse case, arguing AlphaSense's content
      exclusivity is eroding as data providers strike direct distribution deals with AI-native platforms and that its
      generative-AI features remain oriented to summarization rather than end-to-end workflow automation such as
      drafting an investment-committee memo. A narrower brand risk is the AlphaSights trademark dispute, which
      underscores confusion exposure in a field crowded with similar names. On balance the moat is above-average and
      well-funded, but it is not impregnable, and continued AI differentiation plus content exclusivity are the
      load-bearing assumptions of the competitive thesis. In short, AlphaSense holds a defensible but contested
      position that rewards continued reinvestment in proprietary data and agentic capability.
