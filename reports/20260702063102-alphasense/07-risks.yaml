company:
  name: AlphaSense
chapter:
  number: 7
  title: Risks
  summary: >-
    AlphaSense's risk register is led by active AlphaSights trademark litigation, unresolved generative-AI
    hallucination/accuracy and compliance exposure, and a ~12x ARR valuation sensitive to growth deceleration;
    these sit atop opaque customer-concentration and retention disclosure, a below-average C- employee-culture
    grade amid post-acquisition integration, rising EU AI Act/GDPR obligations, channel and content-licensing
    dependencies, key-person exposure, and undisclosed burn — only partially offset by a $350M capital buffer and
    category leadership.
sections:
  - id: risk-overview
    title: Severity-ranked risk overview
    body: >-
      AlphaSense presents a risk profile skewed toward legal, quality, and disclosure risk for a category-leading
      but still-private company. The most material risks, ranked by residual severity, are the AlphaSights
      trademark litigation given the centrality of the brand, generative-AI accuracy and hallucination risk that
      could undermine research trust, and valuation risk from a roughly 12x ARR multiple that is sensitive to any
      growth deceleration. Compounding these, AlphaSense discloses no net or gross revenue retention and no
      top-account concentration figures despite serving 7,000+ enterprise customers, and independent employee
      reviews grade its culture a below-average C- amid the Tegus and Carousel integration. Two structural
      strengths partially cushion the profile: a $350 million 2026 raise provides a balance-sheet buffer, and
      Gartner-recognized category leadership mitigates competitive pressure, but neither resolves the litigation,
      disclosure, or culture risks directly. The chapter organizes risks into regulatory/legal, operational/security,
      partner/dependency, people/execution, and financial/model buckets, then maps mitigations and monitorable kill
      triggers. Overall the analysis concludes that risk is real and only partially mitigated by capital, leadership
      depth, and market position, with litigation, retention disclosure, and culture the items most worth active
      monitoring. Each category below is scored on likelihood, severity, and residual exposure so that diligence
      effort can be prioritized toward the risks that most threaten the investment thesis rather than spread evenly
      across minor or purely hypothetical concerns that do not move the valuation.
    claimRefs:
      - CR031
      - CR009
      - CR027
      - CR033
      - CR034
      - CR040
      - CR041
      - CR043
    tableRefs: []
    figureRefs:
      - FR001
  - id: regulatory-legal
    title: Regulatory and legal risk
    body: >-
      The legal docket is the most concrete risk area. AlphaSense faces an active trademark-infringement suit from
      AlphaSights in the Southern District of New York, where a protective order was signed on May 19, 2026 and fact
      discovery is due in November 2026; an adverse ruling or injunction touching the brand would be a genuine
      thesis-break trigger. Separately, a fee-related dispute with Financial Technology Partners is before a New York
      appellate court. On the regulatory side, the EU AI Act imposes phased obligations on AI-system providers and
      GDPR governs personal-data processing across European operations, both raising compliance cost but remaining
      manageable for a well-funded firm. Emerging generative-AI trade-secret litigation and copyright exposure over
      the 500-million-document library are structural IP considerations. As a private company, AlphaSense discloses
      limited compliance detail, so verifying licensing terms and litigation reserves is a priority diligence path.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR032
      - CR036
    tableRefs:
      - TR001
    figureRefs:
      - FR002
  - id: operational-partner
    title: Operational, security, and dependency risk
    body: >-
      Operationally, generative-AI hallucination and accuracy risk is the headline concern for a research platform
      whose value rests on trust; AlphaSense mitigates this with grounded, source-linked outputs but external accuracy
      audits would strengthen assurance. Security is addressed through enterprise-grade controls and private-cloud
      deployment, making a client-data breach low-likelihood but high-severity. Platform outages and content-source
      disruptions are lower-severity operational risks, while integrating the Tegus and Carousel acquisitions carries
      execution risk. On dependencies, the Accenture channel partnership concentrates a rising share of go-to-market
      in one alliance, and the platform relies on cloud infrastructure, foundation-model providers, and third-party
      content licensing for equity research, news, and filings. The Tegus expert network depends on continued expert
      participation. A further, less visible dependency is customer concentration: AlphaSense reports 7,000+
      enterprise customers and has grown ARR per customer from roughly $28,000 to $66,000 in about three years, but
      it has not disclosed net or gross revenue retention or a top-account concentration schedule, so how much
      recurring revenue rests on a small number of large accounts cannot be independently verified. None of these
      dependencies is presently alarming, but cloud, content-licensing renewals, and undisclosed retention are the
      operational triggers most worth monitoring given their coverage and durability impact.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR035
      - CR043
      - CR044
    tableRefs:
      - TR002
      - TR003
    figureRefs:
      - FR003
  - id: people-financial
    title: People, execution, and financial risk
    body: >-
      On people and execution, founder-CEO Jack Kokko is a key-person dependency for strategy and vision, and the
      recent appointment of CFO Samantha Greenberg introduces a leadership-transition risk during a pivotal scaling
      phase. Rapid headcount growth across EMEA and APAC strains hiring and culture, scaling an agentic product
      roadmap demands scarce and costly AI talent, and absorbing two acquisitions while growing organically is a
      demanding agenda. Independent employee-review evidence corroborates the culture strain: Comparably rates
      AlphaSense's overall employee-reported culture at 2.9 out of 5 (a C- grade) as of April 2026, and about a
      third of surveyed reviews are constructive or critical, with specific comments citing micromanagement and
      post-acquisition friction — a signal worth monitoring for retention of scarce technical talent. Financially,
      high growth typically implies elevated cash burn ahead of durable profitability, a roughly 12x ARR valuation
      embeds high expectations sensitive to deceleration, and AI-native rivals plus incumbent bundling by Bloomberg
      and S&P could pressure pricing and margins. Undisclosed profitability and burn are the core financial-risk
      gap. The mitigation-and-kill-criteria framework pairs each principal risk — litigation, growth, security,
      key-person, regulatory, culture, and content licensing — with a monitorable trigger and a clear action
      implication for the investment thesis.
    claimRefs:
