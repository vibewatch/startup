company:
  name: xAI
chapter:
  number: 6
  title: Customers
  summary: >-
    xAI's customer base spans four distinct segments—consumer Grok app users (38M MAU
    standalone per SensorTower), X Premium subscribers accessing Grok-on-X, API developers,
    and government agencies via the September 2025 GSA OneGov deal. The company claims
    approximately 600 million monthly active users across X and Grok apps combined, but
    that figure is a reach metric dominated by the X platform audience and should not be
    read as Grok paying customers. Named customer proof is thin: the U.S. federal government
    (via GSA OneGov) and Tesla (embedded Grok Voice in vehicles) are the clearest production
    deployments. Paying subscriber counts, API customer counts, NRR, GRR, and churn are
    not publicly disclosed. App store ratings—4.9/5 on iOS (1.2M ratings) and 4.7/5 on
    Android (3.1M reviews)—provide indirect consumer satisfaction evidence. Concentration
    risk is high: the X platform distribution channel, government revenue at nominal entry
    pricing, and Musk brand dependency all represent structural vulnerabilities that a
    diligence buyer must independently probe.

sections:
- id: customer-base-segmentation
  title: Customer base segmentation and channel mix
  body: >-
    xAI routes Grok to end customers through four identifiable channels, each with a different
    buyer, user, and payer structure. The first is the X social platform, where Grok is bundled
    into X Premium (Basic, Premium, and Premium+ tiers); here the buyer and payer is the X
    subscriber, Grok is a product feature rather than a standalone purchase, and usage limits
    scale with subscription tier. The second is the standalone Grok app and web (grok.com),
    which offers a free tier and a SuperGrok paid subscription with higher rate limits and
    access to Grok 4 Heavy. The third is the developer API (console.x.ai), where the buyer
    and payer is a developer or enterprise billed on a usage basis per million tokens; model
    prices for grok-4.3 are $1.25 input / $2.50 output per million tokens as of May 2026.
    The fourth is the government channel, formalized in September 2025 via a GSA OneGov
    agreement that made Grok 4 and Grok 4 Fast available to every U.S. federal agency for
    $0.42 per organization for 18 months—the longest-duration and lowest-price OneGov AI
    deal announced to date—with a FedRAMP and DoD Impact Level upgrade path described but
    not yet confirmed as certified. Enterprise API customers have access to SSO, RBAC, audit
    logging, SOC 2 Type 2, GDPR, CCPA compliance, zero-data-retention options, and data
    residency controls. The developer and enterprise channel has no publicly disclosed customer
    count or revenue attribution. Tesla represents an embedded product-distribution channel
    where Grok Voice is integrated into Tesla vehicles, broadening the addressable audience
    beyond direct consumer sign-ups, but the number of active vehicle users is not separately
    reported by xAI.
