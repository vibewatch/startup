    - CSAM incident (Jan 2026); under investigation in EU, UK, India, Malaysia, France
    - High — regulatory action could block EU/UK enterprise sales; reputational damage affects enterprise sales cycles
    - Monitor investigation outcomes; review current safety guardrails and audit trail for enterprise customers
