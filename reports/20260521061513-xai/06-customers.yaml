- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - X platform distribution (Grok-on-X bundled with X Premium)
    - Single-platform concentration; dependent on X subscriber health and Musk ownership
    - High — if X Premium subscriber growth stalls, Grok's bundled reach stalls proportionally
    - Obtain X subscriber count trend; quantify what share of Grok DAU originates from X vs standalone app
  - - SuperGrok subscription (grok.com direct)
    - No disclosed subscriber count; pricing hidden behind JS-only page
    - Medium — direct subscriber base is the most valuable retention-rich cohort
    - Request subscriber count, monthly revenue, and cohort churn from xAI management
  - - GSA OneGov government channel
    - Low near-term revenue ($0.42/agency/18 months); FedRAMP upgrade path unconfirmed
    - Medium — government channel is currently a credibility builder, not a revenue driver
    - Confirm FedRAMP certification status; obtain agency activation statistics; monitor FY2027 budget cycle for upgrade intent
  - - API/enterprise developer expansion
    - No named customers; SOC 2 certified but hyperscaler listing not confirmed
    - Medium — enterprise channel has the highest unit revenue potential but is early
    - Request API ARR and top-10 customer revenue concentration; confirm hyperscaler marketplace listing timeline
  - - Tesla embedded distribution
    - Related-party; Musk controls both xAI and Tesla; no arm's-length commercial terms
    - High qualitative risk — related-party proof does not establish independent enterprise willingness-to-pay
    - Obtain arm's-length pricing terms and independent customer reference from Tesla; model what revenue would be without Musk-controlled entities
