- id: adoption-trajectory
  title: Adoption trajectory and traction signals
  body: >-
    The clearest public traction signal for Grok comes from two sources: xAI's own January 2026
    Series E announcement and SensorTower mobile data reported by a16z in December 2025.
    xAI stated approximately 600 million monthly active users across X and Grok apps, but
    xAI's Series E blog explicitly attributes that figure to the combined X platform and
    Grok apps; it is an audience reach metric, not a count of Grok-specific or paying users.
    The distinction is material: X had approximately 500–600 million registered accounts
    under prior public disclosures, meaning the Grok-specific user base is considerably
    smaller than the combined figure. SensorTower mobile data cited by a16z shows Grok went
    from zero daily active users at the start of 2025 to 9.5 million DAU and 38 million MAU
    as of mid-December 2025—the fastest app DAU ramp in the consumer AI category in 2025
    according to that analysis. The DAU/MAU ratio of approximately 25% (derived from
    SensorTower's reported 9.5M DAU and 38M MAU) compares favorably to Gemini's 21% but
    lags ChatGPT's 36%, suggesting Grok users return less frequently than ChatGPT's most
    engaged user base. Grok Voice, launched as part of the Grok mobile app and embedded in
    Tesla vehicles, is reported by xAI to serve millions of users, but no separate count is
    provided. The API channel shows activity signals—the developer console is live, API
    pricing is published, and OpenAI/Anthropic SDK compatibility is available—but the number
    of paying API customers is not disclosed. Developer engagement with the open-source
    Grok-1 weights on GitHub provides a secondary proxy: the repository attracted significant
    community interest after the March 2024 open-source release. The government channel
    launched in September 2025; actual agency activation rate under the OneGov agreement
    is not publicly reported.
  claimRefs:
  - CU009
  - CU010
  - CU011
