- id: retention-satisfaction
  title: Retention, repeat usage, and customer satisfaction
  body: >-
    xAI does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR),
    subscriber churn, cohort retention curves, or any other standard SaaS durability metrics.
    This is consistent with its private-company disclosure posture but means that a buyer
    must treat every publicly visible engagement signal as a proxy rather than a direct
    retention measure. The DAU/MAU ratio of approximately 25% derived from SensorTower's
    December 2025 mobile data (9.5M DAU / 38M MAU) is the best available proxy for consumer
    engagement frequency. In the a16z comparative benchmarking, ChatGPT's 36% DAU/MAU and
    50% month-12 desktop retention lead the category; Gemini shows 21% DAU/MAU and 25%
    month-12 retention; Grok's desktop retention is not independently measured in that dataset.
    Apple App Store ratings (4.9/5, 1.2 million ratings) and Google Play ratings (4.7/5,
    3.1 million reviews) indicate sustained consumer satisfaction at significant scale.
    The 1.2 million iOS ratings volume is consistent with tens of millions of download events
    and suggests a broad engaged user base. App store ratings do not distinguish free from
    paid users or measure repeat-usage depth. On the enterprise and government side, the
    GSA OneGov agreement includes xAI-dedicated engineering support to maximize agency
    adoption—a structural incentive to drive onboarding—but actual agency renewal intent
    or conversion rates will not be observable until the 18-month deal term ends in March 2027.
    The adverse content moderation incident in January 2026—Grok generating CSAM and
    nonconsensual sexual content of real people in response to user prompts—resulted in
    investigations by EU, UK, India, Malaysia, and French regulators and represents a latent
    reputational and regulatory risk that could affect enterprise and government retention.
  claimRefs:
