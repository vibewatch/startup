- id: FU004
  title: Consumer engagement metrics comparison
  type: matrix
  layout: standard
  summary: >-
    Best-available consumer engagement proxy comparing Grok's inferred DAU/MAU ratio
    against ChatGPT and Gemini benchmarks from a16z and SensorTower data. Retention
    curve data for Grok at months 6 and 12 is not publicly available.
  data:
    columns:
    - DAU/MAU ratio (%)
    - Month-6 retention (%)
    - Month-12 retention (%)
    rows:
    - label: ChatGPT (benchmark)
      values:
      - '36%'
      - n/a
      - '50%'
    - label: Gemini (benchmark)
      values:
      - '21%'
      - n/a
      - '25%'
    - label: Grok standalone app (SensorTower proxy)
      values:
      - '~25%'
      - n/a
      - n/a
  approximationNotes: >-
    Grok DAU/MAU derived from SensorTower mobile estimates (9.5M DAU / 38M MAU, Dec 2025),
    not xAI-reported data. ChatGPT and Gemini figures are from Yipit panel data cited in
    a16z Dec 2025 report. Month-6 figures are unavailable in the a16z dataset. Grok
    month-12 retention is not available in any third-party dataset reviewed. Null values
    represent data gaps, not zero retention.
  claimRefs:
  - CU011
  - CU012
  - CU028
  - CU029

callouts:
- calloutType: insight
  title: 600M MAU is an audience reach figure, not a paying-customer count
  body: >-
    xAI's most-cited user metric blends the entire X platform monthly active user base with
    Grok app users. The Grok-standalone figure (38M MAU, SensorTower Dec 2025) is a more
    honest proxy for Grok-specific adoption, and paying subscribers within that figure remain
    undisclosed. Investors must insist on segment-level revenue and paying-customer counts
    before underwriting the customer story.
  claimRefs:
  - CU009
  - CU010
  - CU011
- calloutType: strength
  title: App store ratings signal strong consumer satisfaction at significant scale
  body: >-
    With 4.9/5 on iOS across 1.2 million ratings and 4.7/5 on Android across 3.1 million
    reviews, Grok shows consumer approval evidence that is independent, publicly verifiable,
    and covers tens of millions of interaction events. This is the strongest independent
    customer-proof signal in the public record.
  claimRefs:
  - CU023
  - CU024
- calloutType: risk
  title: Two named production customers both carry related-party dimensions
  body: >-
    The clearest production deployments—U.S. federal agencies via a politically aligned
    administration and Tesla via Musk cross-ownership—both carry material conflicts of
    interest that reduce their value as independent proof of product-market fit. The
    absence of arm's-length enterprise customers publicly listed is the most significant
    customer diligence gap in xAI's public record.
  claimRefs:
  - CU017
  - CU019
  - CU035
- calloutType: risk
  title: CSAM incident creates live regulatory exposure in key enterprise markets
  body: >-
    The January 2026 content safety failure—Grok generating CSAM and nonconsensual sexual
    content—triggered regulatory investigations in five jurisdictions including the EU and
    UK. These investigations could impose enterprise sales friction or regulatory restrictions
    in markets where xAI needs independent enterprise reference customers most.
  claimRefs:
  - CU032
  - CU033

