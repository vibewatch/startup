- id: infrastructure-milestones-and-risk
  title: Infrastructure, milestones, and adverse context
  body: Colossus is the operational spine of the company overview because it ties funding, product cadence, Memphis footprint, and the main adverse narrative together. Official xAI and NVIDIA materials say the first 100,000-GPU phase became operational in 122 days and was moving workloads 19 days after the first racks arrived; the company then doubled the cluster to 200,000 GPUs and later said 2025 ended with over one million H100-equivalent GPUs across Colossus I and II. Memphis materials also describe a one-million-square-foot conversion project, an $80 million water recycling plant, and up to hundreds of local jobs. The same footprint has generated the most serious public pushback. Reuters, Earthjustice, and SELC describe allegations that xAI installed and operated unpermitted gas turbines at Colossus facilities in Tennessee and Mississippi, prompting notice letters, litigation, and new permit hearings. The result is a company whose strongest strategic differentiator, vertically integrated
    compute at speed, is also a live environmental, permitting, and community-relations risk that cannot be separated from the core investment case.
