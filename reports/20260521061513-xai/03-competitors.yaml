- id: direct-frontier-model-peers
  title: Direct frontier model peer profiles
  body: |-
    OpenAI is the dominant incumbent by every measurable consumer metric. A16z reports ChatGPT reached approximately 800 to 900 million weekly active users across platforms in 2025, holds roughly 60.6% of US AI chatbot market share, and has a DAU/MAU engagement ratio of 36%, nearly double Gemini's 21%. GPT-5 and its family (GPT-5 mini, GPT-5 nano) are now available via API at different price points, and the ChatGPT enterprise offering includes SAML SSO, SCIM, EKM, audit logging, domain verification, GDPR/CCPA compliance, and a commitment not to train on customer data. OpenAI has also launched Codex for software engineering, Atlas browser, and the Apps infrastructure for third-party developer experiences inside ChatGPT—moves that position it as a potential consumer platform rather than just a chatbot. OpenAI's main constraint is its deep strategic dependency on Microsoft Azure for infrastructure and distribution; the relationship is a compounding advantage in enterprise reach but introduces a single-partner concentration that is a governance risk for investors. Anthropic/Claude is the clearest safety-brand incumbent and the most direct technical peer for enterprise buyers evaluating model quality. A16z reports Claude Code reached a $1 billion annual run rate in six months, signaling that Anthropic has a legitimate coding-and-agent monetization pathway. Claude Opus 4.7 API pricing is $5 input/$25 output per million tokens, positioning it as a premium model; Claude Sonnet 4.6 at $3/$15 targets the mid-tier. The enterprise plan offers HIPAA-ready capability, SCIM, IP allowlisting, a Compliance API, and network-level access control. Anthropic's consumer reach is materially narrower than OpenAI's or Google's; A16z explicitly describes Anthropic as focused on the prosumer and technical user, leaving mass-market consumer distribution as a gap. Google/Gemini is the most dangerous long-run competitive threat to xAI because it can leverage an incumbent distribution surface that neither xAI nor Anthropic can match from outside. A16z reports Gemini is growing desktop users 155% year-over-year and Pro subscriptions nearly 300% year-over-year; Gemini's Nano Banana image model brought in 10 million new Gemini users in its first week. Gemini is embedded in Chrome, Gmail, Google Meet, and Workspace, meaning enterprise buyers already paying for Google services receive AI capability through existing procurement rather than as a new purchase decision. The Gemini Developer API offers a free tier and pay-as-you-go pricing; Gemini 3.5 output is listed at $9 per million tokens for the Priority tier. Google's main constraint is execution legibility: A16z notes that product access is confusing and that AI Mode in Google Search has engaged only about 2% of weekly users despite launching in May.
