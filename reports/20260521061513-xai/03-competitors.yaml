- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - challenger / threat
  - severity
  - current evidence
  - mitigation or diligence ask
  claimRefs:
  - CP017
  - CP018
  - CP022
  - CP023
  - CP028
  - CP036
