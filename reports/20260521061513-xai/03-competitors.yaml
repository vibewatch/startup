  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: OpenAI GPT-5 API token pricing was unavailable from the official pricing page (403 error at access date); enterprise pricing for OpenAI, Anthropic, and Google is custom and not publicly disclosed.
    whyItMatters: Without confirmed GPT-5 API token pricing, the pricing comparison table for the flagship model tier is incomplete and could change the competitive pricing narrative materially.
    diligencePath: Check openai.com/api/pricing directly at a future date or obtain pricing from a developer account console; compare against xAI grok-4.3 pricing.
    relatedQuestionRefs:
    - QP006
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: grok-standalone-share
    missingEvidence: xAI does not disclose standalone Grok MAU as a percentage of total US AI chatbot market share; the 38M MAU figure is A16z/SensorTower estimated for December 2025, not an official xAI metric.
    whyItMatters: Without a confirmed and current standalone Grok market share figure, the competitive positioning assessment uses a six-month-old estimate that may have improved significantly by May 2026.
    diligencePath: Request current standalone Grok MAU, DAU, and retention figures from xAI management; cross-check with SensorTower or similar independent measurement services.
    relatedQuestionRefs:
    - QP004
    - QP020
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: material
    topic: fedramp-status
    missingEvidence: xAI FedRAMP In Process or Authorized status could not be confirmed from public sources; marketplace.fedramp.gov was not checked at access date.
    whyItMatters: FedRAMP authorization is a gating procurement requirement for many civilian federal agency technology purchases; absence would limit the government channel that xAI's OneGov program targets.
    diligencePath: Check marketplace.fedramp.gov for xAI; confirm FedRAMP status with xAI government sales team; compare against OpenAI and Anthropic FedRAMP status.
    relatedQuestionRefs:
    - QP015
    - QP019
  - type: private-evidence-only
    severity: minor
    topic: competitor-benchmark
    missingEvidence: No publicly verified, independent benchmark has established a definitive model capability ranking across Grok 4.3, GPT-5.x, Claude Opus 4.7, and Gemini 3.5 as of May 2026; all available benchmarks are either vendor-published or lack peer review.
    whyItMatters: Buyers using benchmark performance as a primary selection criterion cannot make a fully informed choice without credible third-party evaluation data.
    diligencePath: Monitor HELM, MMLU-Pro, and independent AI evaluation organizations for updated cross-lab benchmark results; note that each lab selectively emphasizes benchmarks on which it performs best.
    relatedQuestionRefs:
    - QP013
    - QP023
