            title: API reliability, SLA, and incident transparency are undisclosed
            body: >-
              xAI does not publish API uptime data, SLA commitments, or historical incident logs. For an enterprise or
              government customer evaluating Grok as a mission-critical AI platform, this is a procurement-blocking gap.
              OpenAI and Anthropic publish uptime pages; xAI's absence of comparable transparency is a diligence flag at
              the current scale of deployment ambition.
