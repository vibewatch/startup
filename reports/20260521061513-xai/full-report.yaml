            title: 600M MAU is an audience reach figure, not a paying-customer count
            body: >-
              xAI's most-cited user metric blends the entire X platform monthly active user base with Grok app users.
              The Grok-standalone figure (38M MAU, SensorTower Dec 2025) is a more honest proxy for Grok-specific
              adoption, and paying subscribers within that figure remain undisclosed. Investors must insist on
              segment-level revenue and paying-customer counts before underwriting the customer story.
