  - id: FE001
    title: xAI technology stack architecture
    type: stack
    layout: wide
    summary: >-
      Four-layer technology stack from proprietary infrastructure through model training to product surfaces and
      developer channels. Colossus compute and X data integration are the two layers with no competitor equivalent.
    data:
      layers:
        - label: Infrastructure layer
          detail: >-
            Colossus Memphis supercluster — 200,000 H100-equivalent GPUs; NVIDIA Spectrum-X networking; on-site natural
            gas turbines (contested permits); water recycling plant. Single-site geography is an operational
            concentration risk.
          items:
            - Colossus Phase I/II (200k H100-eq GPUs)
            - NVIDIA Spectrum-X high-speed networking
            - Memphis on-premise energy and cooling
        - label: Training and research layer
          detail: >-
            Reinforcement learning at pretraining scale drives Grok 4 and derivatives. 6× compute efficiency improvement
            vs. prior RL runs. Unified reasoning/non-reasoning architecture reduces weight-count overhead. X data
            (real-time social graph) is exclusive training and retrieval input.
          items:
            - Scaled RL training (pretraining scale, Grok 4)
            - X social data (exclusive retrieval signal)
            - Model card and RMF safety evaluation pipeline
        - label: Model and inference layer
          detail: >-
            Proprietary model families served via on-cluster inference; 190 TPS demonstrated for code model; no public
            SLA. Context windows from 1M (grok-4.3) to 2M tokens (grok-4.20/grok-4-fast).
          items:
            - Grok 4.3 / 4.20 (flagship text models)
            - Grok Code Fast 1 / Grok Build 0.1 (coding)
            - Grok Voice API / Grok Imagine API (media)
        - label: Product and distribution layer
          detail: >-
            Six consumer/developer access channels. OpenAI/Anthropic SDK compatibility reduces friction. X social
            distribution is unique among frontier AI companies; government channel opens via OneGov.
          items:
            - Grok Web / iOS / Android consumer apps
            - Grok on X (social-integrated AI)
            - xAI Developer API (SDK-compatible)
            - xAI for Government / OneGov
    approximationNotes: >-
      Layer boundaries are analytical constructs; actual implementation boundaries are not publicly documented below GPU
