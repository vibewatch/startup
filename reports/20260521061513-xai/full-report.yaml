      - number: '5.2'
        title: Model lineup, API, and release cadence
        blocks:
          - type: paragraph
            body: >-
              xAI has maintained one of the fastest public model release cadences in the frontier AI industry. From the
              Grok 1 launch in November 2023 through Grok 4.3 in May 2026, the company has shipped roughly fourteen
              named model families in approximately 30 months. Grok 1 open weights (314B parameter Mixture-of-Experts
              architecture, 8 experts with 2 active per token) were released on GitHub under the Apache 2.0 license in
              March 2024, providing public visibility into the base architecture. Subsequent generations abandoned
              open-weight releases in favor of proprietary training at scale on Colossus. Grok 3, launched February
              2025, trained on 10× the compute of prior models on Colossus and achieved a 1M-token context window and an
              Elo score of 1402 on Chatbot Arena. Grok 4 (July 2025) used the full 200,000-GPU Colossus cluster for
              reinforcement learning at pretraining scale, achieving 6× compute efficiency gains versus prior runs, and
              added native tool use. Grok 4 Heavy used parallel multi-agent reasoning and became the first model to
              score 50.7% on Humanity's Last Exam. The API product launched in public beta in November 2024 and is
              OpenAI and Anthropic SDK compatible. As of May 2026, the API model lineup includes grok-4.3 (1M context,
              $1.25/$2.50 per 1M input/output tokens), grok-4.20-reasoning (2M context), grok-4.20-non-reasoning
              (latency-optimized), grok-4-fast-reasoning/$0.20/$0.50 (2M context), grok-code-fast-1 ($0.20/$1.50), a
              Grok Voice API ($3/hour agent, sub-second latency), and a Grok Imagine API ($0.02/image, $0.05/sec video).
              The knowledge cutoff for Grok 3 and 4 families is November 2024; real-time information requires enabling
              web or X search tools. Compared to OpenAI's GPT-5.5 at $5/$30 per 1M tokens and Claude's Opus 4 at $5/$25
              per 1M tokens, grok-4.3 is priced meaningfully below frontier peers, while grok-4-fast is among the most
              cost-efficient reasoning models with independent verification from Artificial Analysis confirming
              state-of-the-art price-to-intelligence ratio.
