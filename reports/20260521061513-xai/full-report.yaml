      - number: '1.2'
        title: Founders, leadership, and disclosure boundaries
        blocks:
          - type: paragraph
            body: >-
              The leadership picture is simultaneously clear at the top and unusually thin below it. Elon Musk is
              unambiguously the public face, chief executive, capital raiser, and strategic integrator across xAI, X,
              Tesla vehicle distribution, and the Memphis compute build-out. Official government-partnership material
              also identifies Ross Nordeen as a cofounder, while launch-era coverage preserved by AP reporting named the
              initial technical founding team, including Igor Babuschkin, Jimmy Ba, Greg Yang, Christian Szegedy, and
              others. What is missing is the normal late-stage private-company disclosure package: current board
              composition, executive committee detail, role definitions for the founding researchers, and cap-table
              governance rights are not laid out on the current company pages. That matters because xAI’s operating
              system depends heavily on founder alignment across adjacent Musk-controlled assets. Investors can
              underwrite the velocity and distribution advantages that come from that concentration, but they also
              inherit key-person dependency and a governance surface that is less transparent than the company’s
              valuation and infrastructure scale would suggest.
