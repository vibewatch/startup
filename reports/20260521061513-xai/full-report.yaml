            title: Vertically integrated compute gives xAI an RL training moat
            body: >-
              xAI's Colossus cluster ownership enables RL training at pretraining scale—a capability that cloud-renting
              competitors must negotiate reserved capacity to approach. The 6× compute efficiency improvement achieved
              for Grok 4 training, and the four-month cycle from Grok 3 to Grok 4, would be structurally difficult to
