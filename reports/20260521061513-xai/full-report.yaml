      - number: '5.5'
        title: Safety posture, trust controls, and compliance
        blocks:
          - type: paragraph
            body: >-
              xAI's compliance posture for the API platform is documented: SOC 2 Type 2, GDPR, CCPA, and Zero Data
              Retention option are listed as enterprise controls on the API product page. Enterprise features include
              Single Sign-On, comprehensive audit logging, role-based access controls, and data residency options. The
              xAI Risk Management Framework (RMF), published in February 2025, committed the company to scalable
              oversight and adversarial robustness as a research priority. Model cards are publicly released for Grok 4
              Fast and Grok Code Fast 1, describing safety training, refusal behavior for CBRN, CSAM, social
              engineering, and cyberattack categories, adversarial robustness (AgentHarm and AgentDojo benchmarks), and
              dual-use capability assessments. The Grok 4 Fast model card confirms a fixed system-prompt prefix
              enforcing safety policy in all API deployments and input filters for abuse detection. xAI for Government
              (announced August 2025) and the GSA OneGov partnership (September 2025) bring Grok into US federal AI
              channels. The compliance gap relevant to government procurement is the absence of a publicly confirmed
              FedRAMP or DoD IL authorization; the OneGov framework initiated the pathway, but ATO status is not
              disclosed in public materials. Compared to OpenAI—which publishes a preparedness framework with
              independent red-team evaluations—xAI's safety disclosures are thinner: the RMF is a planning document
              rather than a post-deployment audit, and no third-party assessor has published evaluation results. This is
              a material diligence gap for regulated-sector enterprise buyers and government contracting officers.
            claimRefs:
