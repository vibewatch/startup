      - number: '6.3'
        title: Named customers, production deployments, and testimonials
        blocks:
          - type: paragraph
            body: >-
              xAI's public customer disclosure is notably thin for a company at its scale and valuation. The clearest
              named production deployment is the U.S. federal government via the GSA OneGov deal. The September 25, 2025
              GSA press release and corresponding xAI announcement both describe the agreement as effective immediately,
              with xAI committing a dedicated team of Grok Engineers to assist agencies with implementation. Federal
              Acquisition Service Commissioner Josh Gruenbaum and xAI cofounder Ross Nordeen are quoted directly. The
              agreement covers all federal government departments, agencies, and bureaus—making this the broadest single
              government customer commitment xAI has publicly confirmed. However, actual agency activation rate, use
              cases deployed, and conversion to higher-priced FedRAMP enterprise subscriptions are not yet publicly
              confirmed as of the runDate. Tesla is the other named production deployment: xAI states in its Series E
              update that Grok Voice serves users across the Grok mobile app and in Tesla vehicles, and Tesla vehicle
              integration is referenced in the Apple App Store description. Tesla and Elon Musk's personal control of
              both companies creates a related-party dimension that reduces the independence quality of this reference.
              Beyond federal agencies and Tesla, no named enterprise customers are listed on official xAI pages. The API
              and enterprise channels do not publish a customer list or case studies. Consumer proof is available
              indirectly through app store ratings: iOS 4.9/5 from 1.2 million ratings and Android 4.7/5 from 3.1
              million reviews provide meaningful aggregate satisfaction evidence at scale. Individual reviewer comments
              on Google Play reference both strong appreciation for Grok's reasoning capabilities and dissatisfaction
              with image-generation moderation tightening. The open-source Grok-1 release on GitHub serves as a
              developer-community proof point, demonstrating that the model architecture earned community validation and
              adoption signals outside the commercial product.
