    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and operating model
        blocks:
          - type: paragraph
            body: >-
              xAI’s current public identity is more expansive than the 2023 launch narrative. Official company pages
              describe a 2023-founded AI company whose mission is to understand the universe and accelerate human
              scientific discovery, while the consumer-facing Grok page shows that the business now spans a
              truth-seeking chatbot, voice and multimodal products, mobile apps, X-native experiences, and a developer
              API. The March 2025 all-stock combination with X materially changed the company profile again: xAI is no
              longer just a model lab selling a chatbot, but an integrated stack that combines model development, a
              consumer application, a social distribution surface, and a proprietary real-time data source. Public
              disclosures therefore support a business model built on three monetization rails: consumer subscriptions
              through Grok and X premium surfaces, usage-based API access for developers, and enterprise or government
              deployments such as the later OneGov agreement. That strategic breadth is a strength, but it also means
              later diligence chapters should treat xAI as a combined AI-platform-and-distribution company rather than a
              narrow model vendor.
