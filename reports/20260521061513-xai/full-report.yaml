              change-of-administration risk that is not present in standard commercial SaaS contracts: a new
              administration could deprioritize or exit the OneGov arrangement, and xAI's FedRAMP upgrade-path strategy
              depends on continued procurement support through at least 2027 contracting cycles.


              The investor composition adds geopolitical complexity. Qatar Investment Authority and MGX (UAE) are
