  - id: TV006
    title: Final diligence asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Revenue and ARR
        - >-
          xAI 2024 full-year, 2025 full-year, and current ARR by revenue stream (consumer, API, enterprise, government,
          external compute)
        - >-
          Without revenue, no revenue multiple can be computed and all scenario analysis is directional at best; this is
          the single most important gap
        - Request directly from xAI CFO; demand audited P&L as a condition of any term sheet
      - - Gross Margin and Unit Economics
        - Gross margin by product segment; cost-of-inference data; GPU depreciation schedule; power cost per token
        - >-
          Infrastructure-heavy AI companies with sub-50% gross margins have fundamentally different valuation frameworks
          from software companies; this determines whether OpenAI's multiple is a fair comp
        - Request from xAI finance team; verify against NVIDIA invoice data if possible
      - - Cash Position and Burn Rate
        - Cash and equivalents post-Series-E; monthly operating burn; runway at current burn
        - >-
          $37B raised does not imply liquidity — capex obligations and debt service could have consumed a significant
          portion; burn rate determines conviction in Series E "sufficient for years" narrative
        - Request from xAI CFO; cross-check with known GPU procurement and construction permits
      - - Capital Structure and Preference Stack
        - >-
          Full cap table with share class rights, liquidation preferences, anti-dilution, and debt covenant terms; X
          legacy debt structure and covenant package
        - >-
          $17B in debt plus unknown preference stack may substantially reduce common-equity value at $230B enterprise
          value; need to understand waterfall
        - Obtain from legal counsel; request cap-table model from company; review $5B secured note terms
      - - Customer Count and Concentration
        - >-
          Paying customer count by segment; top 10 customer revenue share; enterprise contract sizes; NRR; OneGov
          upgrade conversion rate
        - >-
          Revenue quality depends on customer diversification; high concentration plus high churn is a structural risk;
          NRR is the clearest signal of enterprise product-market fit
        - Conduct reference checks with known API and enterprise customers; request from xAI sales leadership
      - - Content-Safety and Regulatory Status
        - >-
          Current status of CSAM investigations in EU, UK, India, Malaysia, France; xAI's remediation commitments;
          FedRAMP audit progress; SOC 2 Type 2 report availability
        - >-
          Active regulatory investigations in five jurisdictions create binary risk events that can materially impair
          enterprise and government revenue channels
        - >-
          Obtain through legal counsel; direct regulatory inquiry in each jurisdiction; request FedRAMP authorization
          letter and timeline
    notes: >-
      These are the six gaps that most directly affect the valuation judgment. None can be resolved from public sources
      as of the run date. Prioritize revenue, margin, and capital structure before advancing a term sheet.
    claimRefs:
