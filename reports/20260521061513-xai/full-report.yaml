      - number: '1.3'
        title: Capital base, valuation path, and public scale markers
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows one of the fastest capital step-ups in private AI. xAI announced a $6 billion Series
              B in May 2024, another $6 billion Series C in December 2024, a combined $10 billion debt-and-equity raise
              in July 2025, and a $20 billion Series E in January 2026. Those disclosed raises alone imply at least $42
              billion of publicly identified capital since May 2024, before any undisclosed earlier financing. Valuation
              references stepped up alongside the capital: CNBC reported xAI at roughly $80 billion in the March 2025 X
              merger and about $230 billion in connection with the January 2026 financing. The company also claims
              approximately 600 million monthly active users across X and Grok, a figure that speaks to reach but should
              not be confused with paying customers. Public scale indicators are strongest around capital, user reach,
              and compute; they are still weak on audited revenue, headcount, customer concentration, and the exact
              cap-table rights attached to the financing stack. That asymmetry is central to the rest of the report: xAI
              has real scale, but not a conventional disclosure package.
