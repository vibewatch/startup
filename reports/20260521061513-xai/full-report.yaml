            title: Real-time X data integration is a structural API moat
            body: >-
              X social data access is exclusively available through xAI's API. DeepSearch and the live search API give
              Grok a retrieval capability for real-time social signals, trending discussions, and X media that no
              competitor can replicate without owning or licensing the X data pipeline.
