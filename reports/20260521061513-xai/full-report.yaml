      - number: '2.4'
        title: Sizing gaps and contradictory signals
        blocks:
          - type: paragraph
            body: >-
              Several important sizing contradictions should be preserved rather than smoothed over. Gartner's $2.53
              trillion worldwide AI-spend figure is a whole-economy envelope, while its $26.38 billion AI-model category
              is much closer to direct frontier-model vendor demand; both are useful, but they are not interchangeable
              TAM numbers. The Business Research Company's $90.91 billion 2026 AI infrastructure market estimate is
              another useful lens, yet it measures a vendor market with a far narrower definition than Gartner's
              category totals. Consumer reach is similarly messy: the official xAI claim of 600 million monthly active
              users across X and Grok should not be treated as equivalent to standalone Grok usage, which
              A16z/SensorTower estimated at 38 million MAU in December 2025. Public data also do not close the most
              important underwriting questions. xAI discloses token pricing and an extremely low-friction government
              entry offer, but it does not disclose paid consumer conversion, API volume, agency activation, enterprise
              contract values, or segment revenue mix. That means a clean xAI-specific TAM, SAM, and SOM cannot be
              defended from public evidence alone. The right analytical posture is therefore evidence-constrained: use
              Gartner's model/software layers as the best upper bound for xAI-relevant spend, treat X-owned reach as a
              distribution asset rather than revenue, and leave conversion, retention, and segment economics as core
              diligence requests for management rather than invented public facts.
            claimRefs:
              - CM014
              - CM015
              - CM035
              - CM036
              - CM037
