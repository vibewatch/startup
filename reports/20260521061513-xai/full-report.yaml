          - type: callout
            title: App store ratings signal strong consumer satisfaction at significant scale
            body: >-
              With 4.9/5 on iOS across 1.2 million ratings and 4.7/5 on Android across 3.1 million reviews, Grok shows
              consumer approval evidence that is independent, publicly verifiable, and covers tens of millions of
              interaction events. This is the strongest independent customer-proof signal in the public record.
