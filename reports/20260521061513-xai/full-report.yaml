companyProfile:
  summary: >-
    xAI is a 2023-founded frontier AI company led by Elon Musk that has evolved from a model lab into an integrated AI
    platform. The March 2025 all-stock acquisition of X combined xAI's model development and Colossus compute
    infrastructure with X's approximately 600 million monthly active user distribution surface and proprietary real-time
    social data. The company monetizes through three rails: consumer Grok subscriptions and X Premium access,
    usage-based API pricing (grok-4.3 at $1.25/$2.50 per million tokens), and an emerging government/enterprise channel
    via the GSA OneGov agreement. Capital formation has been extraordinary — at least $42 billion in disclosed equity
    financing from Series B through E and $5 billion in secured debt — but audited revenue, gross margin, burn rate, and
    customer economics remain undisclosed. The $230 billion reference valuation from the January 2026 Series E is only
    justifiable if xAI is already approaching $3–7 billion in ARR, a figure far above any public evidence.
