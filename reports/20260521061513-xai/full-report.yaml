  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Grok product surfaces and consumer experience
        blocks:
          - type: paragraph
            body: >-
              xAI's consumer-facing AI platform spans five distinct access points, all branded Grok. The primary web
              application at grok.com supports text conversation, document analysis, voice interaction, and image/video
              generation. Grok on X (grok.x.com) integrates directly into the social platform, giving users AI
              assistance inside their existing X workflow and leveraging X's real-time social feed as a native data
              source. iOS and Android apps extend Grok to mobile with voice mode as a first-class interface. A SuperGrok
              subscription tier on grok.com unlocks higher rate limits and access to Grok 4 Heavy (parallel test-time
              compute), Grok Think (extended reasoning), Grok Voice, Grok Imagine (image and video generation), and Grok
              Build (terminal coding agent). The free tier on X gives access to Grok capabilities with lower usage
              quotas, funded by X Premium and Premium+ subscriptions at approximately $8–22 per month. As of May 2026,
              Grok Skills launched persistently across grok.com, iOS, and Android—enabling users to define
              once-and-remember formatting rules, workflow preferences, and document generation templates for Word,
              PowerPoint, Excel, and PDF output. Grok Build 0.1, announced May 15 2026, is a terminal-based coding agent
              available in early beta to SuperGrok Heavy subscribers; it is also accessible via the xAI API as the
              grok-build-0.1 model. The range of surfaces—social, web, mobile, voice, agentic, and enterprise—positions
              xAI as a platform, not merely a chatbot, though it is unclear whether average engagement metrics per
              surface are disclosed publicly.
