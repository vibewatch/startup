      - number: '5.4'
        title: Agentic capabilities, tooling, and developer ecosystem
        blocks:
          - type: paragraph
            body: >-
              xAI's agentic product line has expanded rapidly since Grok 3 introduced DeepSearch in February 2025.
              DeepSearch is a web and X search agent that iteratively queries, browses, and synthesizes information
              across the web and X's proprietary social data graph. This agent has a structural advantage over
              competitors because X's real-time social data is not available via any other AI API. Grok 4 extended
              agentic capability by training the model end-to-end with reinforcement learning on native tool use,
              allowing Grok to call code interpreters, web browsers, and X search autonomously during reasoning. Grok 4
              Heavy uses parallel multi-agent reasoning (multiple concurrent agent instances considering hypotheses
              simultaneously) to tackle extended reasoning tasks that single-thread models cannot efficiently handle.
              The xAI API exposes an Agent Tools API supporting both server-side and client-side tool calling, enabling
              developers to build agentic applications on top of Grok models. Grok Code Fast 1, launched August 2025, is
              a purpose-built coding model (not a general model fine-tuned for code) trained on programming-specific
              pre-training data, common tools such as grep, terminal, and file editing, and real-world pull request
              datasets. It achieves 70.8% on SWE-Bench-Verified and is available as a free integration in GitHub
              Copilot, Cursor, Cline, Roo Code, Kilo Code, opencode, and Windsurf. This partner ecosystem—confirmed by
              GitHub Copilot Chief Product Officer Mario Rodriguez—provides distribution reach into developer workflows
              that xAI could not reach through its own API alone. Grok Build 0.1 is a terminal-native coding agent
              launched May 2026. Grok Skills, launched May 2026, extends the agentic paradigm to persistent workflow
              automation: users define skills once (via conversation or file upload) and Grok applies them automatically
              across future interactions, removing the need to re-specify formatting rules or workflow steps.
