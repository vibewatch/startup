  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Environmental, permitting, and Clean Air Act litigation
        blocks:
          - type: paragraph
            body: >-
              The most concrete adverse risk xAI faces as of May 2026 is an active federal lawsuit filed by the NAACP,
              represented by Earthjustice and the Southern Environmental Law Center (SELC), in the Northern District of
              Mississippi. The suit, filed April 14, 2026, alleges that xAI and its subsidiary MZX Tech have been
              operating 27 methane gas turbines at the Colossus 2 data center site in Southaven, Mississippi, without
              required Clean Air Act permits. These 27 turbines are documented in Earthjustice's press release to have
              the capacity to emit over 1,700 tons of nitrogen oxides, 180 tons of fine particulate matter, 500 tons of
              carbon monoxide, and 19 tons of formaldehyde annually. A Data Center Dynamics report dated May 14, 2026,
              further states that xAI has deployed an additional 19 turbines at the site between late March and early
              May 2026, bringing the total to 46 gas turbines—exceeding the 41-turbine permit that xAI obtained in March
              2026 for a different portion of the facility.


              The remedies sought by the NAACP include a court declaration of Clean Air Act violation, an order to halt
              unpermitted turbine operation, mandatory installation of best-available control technology (BACT) on all
              units, and financial penalties for each day of violation. The penalty exposure under the Clean Air Act can
              run into tens of millions of dollars depending on how many turbine-days are counted. More operationally
              significant would be forced curtailment of turbine use pending permitting, which could reduce inference
              and training capacity at Colossus 2. SELC's February 2026 notice letter also disclosed that xAI officials
              internally acknowledged they planned to replicate the same unpermitted-turbine approach used at Colossus
              1, where xAI removed 35 unpermitted units after a prior NAACP notice and then permitted 15 remaining ones.
              The Memphis metropolitan area already fails national ozone standards and has been rated an "asthma
              capital," creating an elevated community-health narrative that amplifies both litigation risk and
              reputational exposure.


              The MDEQ air division (mdeq.ms.gov) maintains an ongoing permitting and public-notice record for
              Mississippi industrial sources. MDEQ records show active air-quality public review processes for 2026 as
              well as regulatory updates under Clean Air Act provisions. The intersection of the NAACP federal lawsuit,
              the new 19-turbine installation exceeding the permitted threshold, and the pending MDEQ review creates a
              compounding legal and regulatory surface. A third data center is also planned in Southaven with no
              disclosed power infrastructure plan, implying further permitting risk ahead.
