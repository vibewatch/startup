  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引：三条变现轨道，收益率能见度有限
        blocks:
          - type: paragraph
            body: >-
              xAI 公开披露的商业模式现在建立在三条变现轨道上：通过 Grok 应用和 X 平台获得消费者订阅，按量计费的开发者 API 访问，以及正在形成的政府和企业渠道。三条轨道都没有披露收入、订阅者数量或收益率数据。


              开发者 API 是最透明的变现界面，因为 xAI 发布了明确标价。截至 2026 年 5 月，grok-4.3 在 100 万 token 上下文窗口下，定价为每百万输入 token $1.25、每百万输出
              token $2.50。API 页面还显示，语音 API 的智能体使用价格为每小时 $3.00，文本转语音为每百万字符 $15.00，语音转文本为每小时 $0.10。图像生成另有单独定价。相对 Anthropic
              的 Opus 层，这一 token 定价让 xAI 成为有价格竞争力的选项，但在托管 API 市场中更接近中端而非高端。关键投资判断缺口在于，API 标价不等于 API
              收入：用量、组合、批量折扣、企业费率表和实现收益率都不公开。x.ai/api 页面宣传与 OpenAI 和 Anthropic SDK 兼容，以降低迁移摩擦；企业部分列出 SOC 2 Type
              2、GDPR、CCPA、Zero Data Retention、SSO、审计日志、基于角色的访问控制和数据驻留等基础合规功能——这与企业野心一致，但没有披露企业合同经济性。


              消费者变现主要流经 Grok 应用订阅（SuperGrok 及相关层级），并间接流经打包 Grok 访问的 X Premium。x.ai/grok/government 页面与 Series E
              文章共同报告称，截至 2026 年 1 月，X 和 Grok 合计约有 6 亿月活用户。这个标题数字更像触达指标，而不是收入信号：它把旧有 X 社交网络用户与付费 Grok 订阅者混在一起；xAI 也没有披露这
              6 亿人中有多少付费、处于哪个层级，或 ARPU 是什么样子。最可用的第三方收入代理，是 TechCrunch 2024 年 12 月 Series C 报道；该报道称，投资和产品已将 xAI 年收入推至约
              $100M——这是一个中等置信度估计，指向 Series C 前的过去收入，现在至少过时 18 个月，且未获 xAI 确认。


              2025 年 9 月 GSA OneGov 协议建立了政府渠道，让每个联邦部门、机构或局以象征性 $0.42 获得 Grok 4 和 Grok 4 Fast 的 18 个月访问权，有效期至 2027 年 3
              月。xAI 承诺向机构派驻专门的 Grok Engineers，并提供升级至符合 FedRAMP 和 DoD Impact Level 的企业订阅路径。$0.42
              价格作为收入来源在商业上无足轻重；它的财务价值在于为企业和政府规模订阅升级开门，而不是介绍费本身。这些升级收入尚未披露，也可能要到 2027 年之后的合同周期才会兑现。
