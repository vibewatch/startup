      - number: '5.4'
        title: 智能体能力、工具与开发者生态
        blocks:
          - type: paragraph
            body: >-
              自 Grok 3 在 2025 年 2 月引入 DeepSearch 以来，xAI 的智能体产品线迅速扩张。DeepSearch 是 Web 和 X 搜索智能体，会跨 Web 与 X
              自有社交数据图谱反复查询、浏览并综合信息。该智能体相对竞争对手有结构性优势，因为 X 的实时社交数据不能通过其他 AI API 获得。Grok 4
              进一步扩展智能体能力：模型围绕原生工具使用接受端到端强化学习训练，推理过程中可以自主调用代码解释器、Web 浏览器和 X 搜索。Grok 4 Heavy
              使用并行多智能体推理（多个智能体实例同时考虑假设）处理单实例模型难以高效完成的长推理任务。xAI API 暴露 Agent Tools API，支持服务端和客户端工具调用，使开发者可以在 Grok
              模型上构建智能体应用。2025 年 8 月发布的 Grok Code Fast 1
              是专门为编码打造的模型（不是在通用模型上微调代码），训练数据包括编程专用预训练数据、grep、terminal、文件编辑等常用工具，以及真实 pull request 数据集。它在
              SWE-Bench-Verified 上达到 70.8%，并作为免费集成进入 GitHub Copilot、Cursor、Cline、Roo Code、Kilo Code、opencode 和
              Windsurf。这个由 GitHub Copilot 首席产品官 Mario Rodriguez 确认的伙伴生态，把 xAI 带进了其自有 API 单独触达不了的开发者工作流。Grok Build 0.1 是
              2026 年 5 月上线的终端原生编码智能体。2026 年 5 月上线的 Grok Skills 把智能体范式延伸到持久工作流自动化：用户通过对话或文件上传一次定义技能，Grok
              便会在未来交互中自动套用，省去反复说明格式规则或工作流步骤的成本。
