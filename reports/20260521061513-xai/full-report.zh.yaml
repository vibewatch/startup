      - number: '5.6'
        title: 技术差异化与已知局限
        blocks:
          - type: paragraph
            body: >-
              xAI 相对同业的主要技术差异化，来自四个短期难以复制的结构性优势。第一，自有 X 数据整合提供实时社交数据搜索，没有竞争对手能通过 API 提供，使 Grok
              在当前事件、热门讨论和社交情绪上具备独特检索能力。第二，垂直整合的 Colossus 算力资产支持在预训练尺度上进行 RL 训练，并快速迭代——xAI 从 Grok 3 到 Grok 4
              约四个月完成，这一节奏对只租云的实验室来说很难匹配，除非签下大额 GPU 承诺合同。第三，Grok 4 Fast 的推理 /
              非推理一体化架构，减少了每个能力档位管理两套模型权重的运营开销，这一设计尚未被广泛复制。第四，grok-code-fast-1 的伙伴生态（GitHub Copilot、Cursor、Windsurf 等）让
              xAI 一上线就进入开发者工作流，比自然培养开发者社区更快。已知局限和证据缺口也很大。基准测试自报：Humanity's Last Exam、ARC-AGI V2、LMArena Elo 等主要基准主张，均由
              xAI 报告，或使用 xAI 控制评测套件的方法。Artificial Analysis 提供了智能水平与价格的部分独立分析，并确认 Grok 4 Fast 的价格 / 智能排名，但 Grok 4 Heavy 在
              Humanity's Last Exam 50.7% 的主张尚无完整独立审计。可靠性：公开文档页未披露 API 可用性、SLA 承诺或事故历史。上下文窗口限制：grok-4.20+ 不支持
              logprobs，限制统计校准类应用。知识截止日（2024 年 11 月）要求所有对时效敏感的工作流必须集成搜索工具，从而增加延迟。开放权重只发布过 Grok
              1；后续所有模型权重均为闭源，限制了社区微调和离线部署选项。
