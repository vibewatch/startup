      - number: '2.4'
        title: 规模缺口与相互矛盾的信号
        blocks:
          - type: paragraph
            body: >-
              几个重要的规模测算矛盾应被保留，而不是抹平。Gartner 的 $2.53T 全球 AI 支出数字是全经济口径外框；其 $26.38B AI 模型类别更接近前沿模型供应商的直接需求。两者都有用，但不是可互换的
              TAM 数字。The Business Research Company 对 2026 年 AI 基础设施市场 $90.91B 的估计，是另一个有用视角，但它测量的是定义远窄于 Gartner
              类别总额的供应商市场。消费者触达同样混乱：xAI 官方声称 X 和 Grok 合计 6 亿月活，不应等同于独立 Grok 使用量；A16z/SensorTower 估计 2025 年 12 月独立 Grok
              MAU 为 3800 万。公开数据也没有补上最重要的投资判断问题。xAI 披露了 token 定价和摩擦极低的政府入门报价，但没有披露付费消费者转化、API
              用量、机构激活、企业合同额或分部收入组合。这意味着，干净的 xAI 专属 TAM、SAM 和 SOM 无法仅凭公开证据支撑。正确分析姿态应受证据约束：用 Gartner 的模型 / 软件层作为 xAI
              相关支出的最佳上限，把 X 自有触达当作分发资产而不是收入，把转化、留存和分部经济性留作向管理层提出的核心尽调请求，而不是发明公共事实。
