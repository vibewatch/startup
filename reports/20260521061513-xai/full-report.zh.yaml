      - number: '5.5'
        title: 安全态势、信任控制与合规
        blocks:
          - type: paragraph
            body: >-
              xAI 的 API 平台合规态势有公开文档支撑：API 产品页列出 SOC 2 Type 2、GDPR、CCPA
              和零数据留存选项等企业控制项。企业功能包括单点登录、完整审计日志、基于角色的访问控制和数据驻留选项。xAI 于 2025 年 2 月发布的 Risk Management
              Framework（RMF）承诺把可扩展监督和对抗鲁棒性作为研究重点。Grok 4 Fast 和 Grok Code Fast 1 均公开发布模型卡，说明安全训练、针对
              CBRN、CSAM、社会工程和网络攻击类别的拒答行为、对抗鲁棒性（AgentHarm 和 AgentDojo 基准），以及双用途能力评估。Grok 4 Fast 模型卡确认，所有 API
              部署中都有固定系统提示词前缀来执行安全政策，并有输入过滤器检测滥用。xAI for Government（2025 年 8 月宣布）和 GSA OneGov 合作（2025 年 9 月）把 Grok 带入美国联邦
              AI 渠道。与政府采购相关的合规缺口在于，公开材料尚未确认 FedRAMP 或 DoD IL 授权；OneGov 框架启动了路径，但 ATO 状态未披露。相比发布准备度框架并进行独立红队评估的
              OpenAI，xAI 的安全披露更薄：RMF 是规划文件，不是部署后审计；也没有第三方评估者发布评测结果。对受监管行业的企业买家和政府合同官来说，这是实质性尽调缺口。
