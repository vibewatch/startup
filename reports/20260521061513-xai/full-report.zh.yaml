      - number: '1.3'
        title: 资本基础、估值路径与公开规模标记
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，xAI 是私营 AI 公司中资本跃升最快的案例之一。xAI 在 2024 年 5 月宣布 $6B Series B，2024 年 12 月又宣布 $6B Series C，2025 年 7 月完成
              $10B 债权加股权合并融资，2026 年 1 月完成 $20B Series E。仅这些披露融资，就意味着自 2024 年 5 月以来公开可识别资本至少
              $42B，还不包括任何未披露的更早融资。估值参照随资本同步抬升：CNBC 报道称，2025 年 3 月 X 合并时 xAI 约 $80B，2026 年 1 月融资相关估值约 $230B。公司还声称 X 和
              Grok 合计月活约 6
              亿，这说明触达规模，但不应与付费客户混为一谈。公开规模指标在资本、用户触达和算力上最强；在经审计收入、员工数、客户集中度，以及融资堆栈附带的具体股权结构权利上仍然薄弱。这种不对称是本报告其余部分的核心：xAI
              确实有规模，但没有常规披露包。
