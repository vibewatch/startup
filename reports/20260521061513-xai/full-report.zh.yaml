  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Clean Air Act 执法裁定
        - 法院命令限制 Colossus 2 超过 10 台燃气涡轮运行，或财务处罚超过 $100M，或法院强制安装 BACT
        - 直接压缩 Colossus 可用于训练和推理的算力，提高边际成本、拖慢产品节奏；也给任何第三个站点的未来许可风险发出信号
        - 立即重评「算力即护城河」投资逻辑；测算利用率下降对收入的影响；要求公司给出缓释方案
      - - CSAM / 内容安全监管行动
        - 欧盟、英国、印度或法国对消费者版 Grok 部署作出有约束力的禁止，或任何主要市场要求强制算法审计并先行批准
        - 移除受影响市场的消费者收入；严重损害全球企业和政府销售周期；可能引发 X 广告主出走
        - 按投资逻辑破裂处理；重估消费者和企业收入情景概率；要求完整监管状态更新
      - - 收入披露低于 $1B ARR
        - xAI 发布或泄露任何 2025 年或 2026 全年低于 $1B ARR 的收入数字
        - 按 OpenAI 35x 远期倍数，$1B ARR 对应约 $35B 公允价值——较 $230B Series E 价格折价 85% 以上；低于 $500M ARR 则意味着实质降价融资情景
        - 立即按 Series E 估值标记重评持仓；收入轨迹确认前，禁止任何额外老股买入
      - - Elon Musk 离任或重大分心
        - Musk 公开退出 xAI CEO 职位，或承担新义务（例如全职政府职务），实质减少分配给 xAI 的时间
        - 失去关键人：他同时负责融资、定愿景、整合技术并运营 X；董事会 / 治理真空，且没有公开指定继任者
        - 立即标记为关键人风险兑现；要求董事会继任计划和临时领导披露
      - - 正式降价融资或下一轮融资失败
        - xAI 下一轮融资以 $150B 或以下估值完成，或计划中的融资因投资人迟疑而放弃
        - 说明机构投资人对 $230B 标记的胃口已经减弱；降价融资价格意味着 Series E 持有人被稀释，也让债务的持续经营问题浮上台面
        - 重估所有财务情景；视为强悲观信号；要求完整资本结构更新
      - - NVIDIA 供应中断或出口管制升级
        - 美国政府限制 xAI 或任何美国 AI 公司大规模获得 NVIDIA H100/H200，或台海紧张局势中断 TSMC 的 AI 加速器产能
        - Colossus 扩张计划停摆；相对 GPU 可得性一旦趋同，xAI 在算力上的竞争差异就会被削弱
        - 每月跟踪 NVIDIA 财报和出口管制政策；纳入标准地缘政治风险监控
    notes: 触发项和阈值基于公开证据构建，目的是提供可观测的监控标准。截至运行日期（2026-05-21），上述触发项均未发生，但 CAA 诉讼和 CSAM 调查仍在推进。
