  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 环境、许可与 Clean Air Act 诉讼
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，xAI 面临的最具体反向风险，是 NAACP 在密西西比北区联邦地区法院提起的一起联邦诉讼；NAACP 由 Earthjustice 和 Southern Environmental
              Law Center（SELC）代理。该诉讼于 2026 年 4 月 14 日提交，指控 xAI 及其子公司 MZX Tech 在密西西比州 Southaven 的 Colossus 2 数据中心现场运营 27
              台甲烷燃气轮机，却没有取得 Clean Air Act 要求的许可。Earthjustice 新闻稿记录显示，这 27 台涡轮每年可能排放超过 1,700 吨氮氧化物、180 吨细颗粒物、500 吨一氧化碳和
              19 吨甲醛。Data Center Dynamics 于 2026 年 5 月 14 日的报道进一步称，xAI 在 2026 年 3 月底至 5 月初之间，又在该现场部署了 19 台涡轮，使总数达到 46
              台燃气轮机——超过 xAI 于 2026 年 3 月为设施另一部分取得的 41 台涡轮许可。


              NAACP 寻求的救济包括：法院宣告违反 Clean Air Act、命令停止无证涡轮运行、强制所有机组安装最佳可用控制技术（BACT），并按违法天数处以罚款。Clean Air Act
              下的罚款暴露可能达到数千万美元，取决于计入多少个涡轮运行日。更具运营影响的，是在许可待定期间被迫限制涡轮使用，这可能削弱 Colossus 2 的推理和训练容量。SELC 2026 年 2 月通知函还披露，xAI
              官员内部承认，他们计划复制 Colossus 1 使用过的同一种无证涡轮做法；此前 NAACP 发出通知后，xAI 拆除了 35 台无证机组，并为剩余 15 台办理许可。Memphis
              都会区本已未达到国家臭氧标准，并被评为「哮喘之都」，这抬高了社区健康叙事，也放大了诉讼风险和声誉暴露。


              MDEQ 空气部门（mdeq.ms.gov）维护密西西比工业来源的持续许可和公示记录。MDEQ 记录显示，2026 年存在活跃空气质量公共审查流程，以及 Clean Air Act 条款下的监管更新。NAACP
              联邦诉讼、新增 19 台涡轮使装机超过许可阈值、MDEQ 审查仍在等待，三者交叉形成叠加的法律和监管风险面。Southaven 还规划了第三座数据中心，但未披露电力基础设施方案，意味着前方还有更多许可风险。
