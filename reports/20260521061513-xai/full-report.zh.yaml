  - id: FR001
    title: 风险热力图 — xAI 主要风险的可能性与严重性
    type: matrix
    layout: standard
    summary: 把 xAI 的主要风险类别按可能性（行）和对投资影响的严重性（列）映射，并基于截至 2026 年 5 月的公开证据判断剩余敞口。
    data:
