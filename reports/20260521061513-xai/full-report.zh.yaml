  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层与渠道组合
        blocks:
          - type: paragraph
            body: >-
              xAI 通过四个可识别渠道把 Grok 送到终端客户手里，每个渠道的买方、用户和付款方结构不同。第一是 X 社交平台，Grok 被打包进 X Premium（Basic、Premium 和 Premium+
              层级）；这里买方和付款方是 X 订阅用户，Grok 是产品功能而不是独立购买项，使用限制随订阅层级提高。第二是独立 Grok 应用和 Web（grok.com），提供免费层和 SuperGrok
              付费订阅，后者有更高频率限制并可访问 Grok 4 Heavy。第三是开发者 API（console.x.ai），买方和付款方是按每百万 token 用量计费的开发者或企业；截至 2026 年 5
              月，grok-4.3 模型价格为每百万 token 输入 $1.25 / 输出 $2.50。第四是政府渠道，2025 年 9 月通过 GSA OneGov 协议正式化，使 Grok 4 和 Grok 4 Fast
              以每个机构 $0.42、期限 18 个月的价格向所有美国联邦机构开放——这是迄今披露的期限最长、价格最低的 OneGov AI 交易；FedRAMP 和 DoD Impact Level
              升级路径已有描述，但尚未确认获得认证。企业 API 客户可使用 SSO、RBAC、审计日志、SOC 2 Type 2、GDPR、CCPA
              合规、零数据留存选项和数据驻留控制。开发者和企业渠道没有公开披露客户数或收入归因。Tesla 是一个嵌入式产品分发渠道，Grok Voice 已集成进 Tesla 车辆，把可触达受众扩展到直接消费者注册之外，但
              xAI 未单独报告活跃车载用户数。
