      - number: '2.3'
        title: 增长驱动、采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              需求侧信号仍强，但 xAI 面对的市场并不只奖励原始模型野心。Gartner 预测 2026 年 AI 支出同比增长 44%；Deloitte 报告称，2025 年员工 AI 使用权限上升 50%，至少 40%
              项目进入生产的公司占比预计将在六个月内翻倍。White House 2025 AI Action Plan 和 GSA 的 OneGov 动作也显示，联邦市场正在被主动推向前沿模型采用和基础设施扩张。xAI
              在这里确有顺风：通过 X 获得自有分发、政府采购楔子，以及快速扩张的 API 界面。刹车同样实质。Gartner 明确表示，AI 在 2026 年全年处于幻灭低谷期，企业最常从既有软件供应商购买
              AI，而不是从新的登月式供应商购买。Deloitte 称，AI 技能缺口是集成的最大障碍，只有五分之一公司拥有成熟的自主智能体治理模型。OpenAI、Anthropic、Perplexity、Mistral 和
              Meta 都在销售企业级控制、开放权重灵活性，或低成本路径，从而降低买方对任何单一前沿实验室的依赖。xAI 自身资本结构也凸显了该类别的成本负担：2025 年 7 月 $10B 债权加股权融资和 Colossus
              建设表明，这个市场仍需要异常沉重的基础设施资金。结果是，市场预算确实扩张，但定价、信任、治理和渠道控制压力持续存在。
