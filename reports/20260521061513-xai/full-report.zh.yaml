      - number: '3.3'
        title: 开放权重、相邻和既有渠道竞争者
        blocks:
          - type: paragraph
            body: >-
              Meta Llama 是结构上最具破坏性的替代品，因为它把按 token API 费用从买方计算中拿掉。Llama 4 Maverick 提供原生多模态、1000 万 token
              上下文窗口，以及图像加文本理解；Llama 4 Scout 在单块 H100 GPU 上具有效率优势，也拥有同样的 1000 万 token
              上下文。两个模型均可商用，并被企业和超大云厂商部署，且没有增量模型成本。在前沿模型性能差异边际化、且买方愿意投资基础设施的用例中，替代动态最强——例如大型企业知识管理或受监管行业部署，数据治理顾虑本来就会把买方推向自托管。Mistral
              AI 基于类似开放权重逻辑竞争，同时增加了 xAI 目前无法匹配的欧洲司法辖区隐私姿态。Mistral AI Studio 为希望获得前沿模型、完整数据所有权、自托管灵活性和 Mistral
              欧盟数据治理保证的企业买方，提供托管 AI 生命周期平台。Mistral Le Chat Pro 定价 $17/月，与 Perplexity Pro 相当，略低于 ChatGPT Plus。Magistral
              推理模型家族和 Devstral 编码模型扩展了 Mistral 产品宽度。Mistral 的限制在于消费者界面更小，美国政府市场访问也弱于 xAI 的 OneGov 入口。Perplexity 是相邻的 AI
              原生搜索应用，以引用优先架构瞄准生产力和研究工作流。A16z 报告称，Perplexity MAU 超过 2000 万，年化运行率 $100M，付费用量同比增长 6 倍。Perplexity Pro 层定价
              $17/月，Max 层 $167/月；企业产品强调 SOC 2 Type II 认证和内部知识集成。Perplexity 的 Comet 浏览器用户超过 100 万，将 Perplexity
              定位为潜在界面层竞争者，而不只是问答服务。Microsoft Copilot 占据最差异化的分发位置：它嵌入 M365 套件，后者约有 3 亿个企业席位，并拥有约 12.5% 的美国 AI
              聊天机器人市场份额。Microsoft Copilot for M365 企业版定价约为每用户每月 $30，打包进既有 Microsoft 采购关系。这是既有渠道优势——Microsoft
              不需要赢下一场竞争性聊天机器人评估，就能把 AI 能力落到企业买方手里，因为 AI 已经随买方拥有的文字处理器和电子邮件客户端打包。
