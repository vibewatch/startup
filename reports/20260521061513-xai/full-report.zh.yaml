      - number: '8.2'
        title: 可比公司与估值倍数
        blocks:
          - type: paragraph
            body: >-
              xAI 的主要可比对象，是前沿 AI 私营公司队列；次级可比对象，是上市的 AI 邻近基础设施和软件公司。本章所有可比公司都受三项限制约束：私营估值是按融资轮标记，不是按市场成交标记；除 OpenAI
              之外，没有前沿 AI 私营公司披露过经确认的历史收入；2025 年 AI 私营市场重估太快，上一年的倍数已有部分失效。


              OpenAI 是最相关的私营可比公司。CNBC 2026 年 3 月报道，OpenAI 完成创纪录的 $122 billion 融资轮，投后估值 $852 billion；CNBC 还另行确认，OpenAI
              2025 年收入为 $13.1 billion，目前年化收入约 $24 billion。这意味着 OpenAI 历史收入倍数约 65x（$852 billion 除以 2025 年收入 $13.1
              billion），前瞻倍数约 35x（$852 billion 除以约 $24 billion 运行率收入）。OpenAI 2025 年 10 月的老股出售已把估值标记定在 $500 billion；2026 年
              3 月融资轮在经确认商业牵引的支撑下，将其推升至 $852 billion。按 OpenAI 当前倍数，$230 billion 的 xAI 需要约 $3.5 billion 历史收入（按 65x）或约 $6.6
              billion 前瞻 ARR（按 35x）才能成立——公开证据不支持其中任何一个数字。


              Anthropic 是第二接近的私营实验室可比对象。CNBC 2025 年 11 月报道，在 Microsoft 和 NVIDIA 投资后，Anthropic 估值达到 $350 billion
              区间。Anthropic 收入未公开确认，但市场报道引用的分析师估计显示，其收入明显低于 OpenAI，因此 Anthropic 每一美元收入对应的倍数可能高于 OpenAI 的
              65x——这说明，即便是收入领先者，前沿 AI 队列也在按极高的前瞻倍数交易。


              Forge Global 的私营市场指数提供了有用的二级市场参考。CNBC/Forge 2025 年 9 月报道给出的二级市场标记为：OpenAI $324 billion、Anthropic $178
              billion、xAI $90 billion、Databricks $100 billion、SpaceX $456 billion、Stripe $92 billion、Anduril $53
              billion。xAI 的 Forge 标记为 $90 billion（2025 年 9 月），而 2026 年 1 月参考估值为 $230 billion，意味着不到四个月内，xAI
              融资轮价格比二级市场清算水平高出超过 2.5x——这符合高需求市场中激进融资轮定价发现的模式。


              在上市基础设施可比公司中，Cerebras Systems 于 2026 年 5 月 14 日在 Nasdaq IPO，开盘价较 $185 发行价高约 89%，意味着首日交易市值约 $95
              billion——这是自 2019 年 Uber 以来美国最大科技 IPO。AI 基础设施公司 CoreWeave 于 2025 年 3 月上市，目前公开市场估值超过 $58
              billion。这些上市基础设施可比公司相对传统数据中心运营商享有显著溢价，但仍明显低于前沿模型公司估值，说明市场正在给算力基础设施（CoreWeave、Cerebras）与模型加分发公司（OpenAI、Anthropic、xAI）分出不同定价层级。


              防务 AI 公司 Anduril Industries 因防务科技热度延续，在 2026 年 5 月估值翻倍至 $60 billion 以上。虽然它不是直接的模型公司可比对象，但它说明，拥有政府合同的 AI
              邻近私营公司正在跨行业获得溢价标记，也强化了一个判断：AI 私营市场正处在广泛重估周期中。
