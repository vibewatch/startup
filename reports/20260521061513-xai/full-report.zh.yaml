      - number: '6.4'
        title: 留存、重复使用与客户满意度
        blocks:
          - type: paragraph
            body: >-
              xAI 不公开披露净收入留存率（NRR）、总收入留存率（GRR）、订阅用户流失、队列留存曲线或其他标准 SaaS
              耐久性指标。这符合其私营公司的披露姿态，但也意味着买方必须把每个公开可见的互动信号当作代理指标，而不是直接留存指标。由 SensorTower 2025 年 12 月移动数据（9.5M DAU / 38M
              MAU）推导出的约 25% DAU/MAU 比率，是目前可得的最佳消费者互动频率代理指标。在 a16z 的对比基准中，ChatGPT 以 36% DAU/MAU 和 50% 第 12
              个月桌面留存领先全类别；Gemini 为 21% DAU/MAU 和 25% 第 12 个月留存；该数据集没有独立衡量 Grok 的桌面留存。Apple App Store 评分（4.9/5，1.2
              million 条评分）和 Google Play 评分（4.7/5，3.1 million 条评论）显示，消费者满意度在相当规模上持续存在。1.2 million 条 iOS
              评分量与数千万次下载事件一致，也暗示有广泛参与的用户基础。应用商店评分无法区分免费与付费用户，也不能衡量重复使用深度。企业和政府侧，GSA OneGov 协议包含 xAI
              专属工程支持，以最大化机构采用——这是推动入驻的结构性激励——但实际机构续约意愿或转化率要到 18 个月交易期在 2027 年 3 月结束后才可观察。2026 年 1 月的负面内容审核事件——Grok
              按用户提示生成 CSAM 和真实人物的非自愿性内容——引发欧盟、英国、印度、马来西亚和法国监管调查，构成可能影响企业和政府留存的潜在声誉与监管风险。
