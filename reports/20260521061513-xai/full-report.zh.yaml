        - 同样的兼容性也降低客户离开 xAI 转向竞争对手的成本
        - 高（反向）
        - x.ai/api 明确宣传 SDK 兼容；docs.x.ai/quickstart 确认只改一个 URL 即可迁移
        - 评估 xAI 能建立哪些非 API 粘性——专有数据资产、嵌入式工作流、智能体微调
      - - Google Workspace 嵌入带来无需采购的企业 AI 分发
        - Google 继续加快 Gemini 嵌入 Workspace，降低评估需求
        - 高（对 xAI 不利）
        - A16z、workspace.google.com 和 Gartner 都支持 Google 拥有在位软件渠道优势
        - xAI 需要渠道合作或企业软件嵌入，才能在 Workspace 层竞争；目前缺位
      - - 开放权重的 Meta Llama 和 Mistral 模型为价格敏感买家消除 API 费用
        - Llama 和 Mistral 能力持续提升；云厂商打包开放权重模型
        - 中
        - llama.com 已记录 Llama 4 商业许可，Mistral 开放权重发布已有记录；Deloitte 企业数据支持采用摩擦判断
        - 监控开放权重模型与托管前沿模型的能力接近程度；评估哪些 xAI 用例最容易被替代
      - - xAI FedRAMP 授权状态未公开确认
        - 已确认 FedRAMP 授权的竞争对手（OpenAI、Google GCP、Anthropic）可能默认赢得政府合同
        - 中
        - x.ai/api 列出 SOC 2，但未声称 FedRAMP；gsa.gov OneGov 协议存在，但 FedRAMP 状态未确认
        - 向 xAI 核验 FedRAMP In Process 或 Authorized 状态；若没有，评估对民用联邦管线的影响
    notes: 严重程度为分析师序位判断（高 / 中 / 低）；证据引用指向 2026 年 5 月抓取来源；所有护城河主张会随竞争格局变化而修订。
