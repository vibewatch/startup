      - number: '7.5'
        title: 地缘政治、监管、披露与投资逻辑失效风险
        blocks:
          - type: paragraph
            body: >-
              xAI 的政府渠道锚定 GSA OneGov 协议（2025 年 9 月），该协议让每个联邦机构以名义 $0.42 费用使用 Grok 4，期限至 2027 年 3 月。该安排明确关联 Trump 政府的 AI
              Action Plan，并在 GSA 新闻稿中提到 Elon Musk 的 DOGE 角色。这种政治绑定让 xAI 政府收入路径暴露于普通商业 SaaS 合同没有的换届风险：新政府可能降低 OneGov
              安排优先级或退出；xAI 的 FedRAMP 升级路径策略，也依赖至少到 2027 年合同周期仍有持续采购支持。


              投资者构成增加了地缘政治复杂性。Qatar Investment Authority 和 MGX（UAE）是披露的 Series E 投资者。海湾国家主权财富基金参与前沿 AI
              模型，可能引发访问层面的出口管制问题，尤其是在 BIS Entity List 条款和 AI Diffusion Rule 下；不过，目前没有发现具体出口管制行动。Musk 的 DOGE
              角色和政治关联，也给希望远离政治争议的客户带来企业采购风险。


              xAI 隐私政策（2026 年 4 月 4 日生效）通过附录为欧洲用户适用 GDPR 对齐的数据权利，但 CSAM 事件后欧盟和英国的活跃监管调查显示，监管者正在审视的不只是隐私政策文本，而是 xAI
              的数据治理。xAI 服务条款（2026 年 4 月 10 日生效）受内华达州法律管辖。公司 API 条款明确将数据处理从消费者隐私承诺中划出，形成双重治理风险面。FedRAMP 授权不存在；xAI 只通过
              OneGov 协议提供「升级路径」。缓释与一票否决条件表列出了可监控触发点，一旦触发，投资者就需要重新评估投资逻辑。
