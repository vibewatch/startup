              Grok 最清晰的公开牵引力信号来自两处：xAI 自己的 2026 年 1 月 Series E 公告，以及 a16z 在 2025 年 12 月引用的 SensorTower 移动数据。xAI 称 X 和
              Grok 应用合计约 600 million 月活用户，但 xAI 的 Series E 博文明说该数字归属于 X 平台和 Grok 应用的组合；这是受众触达指标，不是 Grok
              专属用户或付费用户数。这个区别很关键：此前公开披露显示 X 约有 500–600 million 注册账户，意味着 Grok 专属用户基数明显小于组合数字。a16z 引用的 SensorTower
              移动数据显示，Grok 从 2025 年初零 DAU 增至 2025 年 12 月中旬 9.5 million DAU 和 38 million MAU；按该分析，这是 2025 年消费者 AI 类别中最快的应用
              DAU 爬坡。约 25% 的 DAU/MAU 比率（由 SensorTower 报告的 9.5M DAU 和 38M MAU 推导）优于 Gemini 的 21%，但落后于 ChatGPT 的 36%，说明
              Grok 用户回访频率低于 ChatGPT 最活跃用户群。作为 Grok 移动应用组成部分并嵌入 Tesla 车辆的 Grok Voice，据 xAI 称服务数百万用户，但没有提供单独计数。API
