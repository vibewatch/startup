      - number: '6.3'
        title: 具名客户、生产部署与客户证言
        blocks:
          - type: paragraph
            body: >-
              以 xAI 的规模和估值衡量，其公开客户披露明显偏薄。最清晰的具名生产部署，是通过 GSA OneGov 交易进入美国联邦政府。2025 年 9 月 25 日的 GSA 新闻稿和 xAI
              对应公告均称协议立即生效，xAI 承诺派出专属 Grok 工程师团队协助各机构实施。Federal Acquisition Service 专员 Josh Gruenbaum 和 xAI 联合创始人 Ross
              Nordeen 被直接引用。协议覆盖所有联邦政府部门、机构和局，使其成为 xAI 公开确认过的最广泛单一政府客户承诺。不过，截至报告日期，实际机构激活率、已部署用例，以及向更高价格 FedRAMP
              企业订阅的转化仍未公开确认。Tesla 是另一项具名生产部署：xAI 在 Series E 更新中称 Grok Voice 服务 Grok 移动应用和 Tesla 车辆中的用户，Apple App Store
              描述也提到 Tesla 车辆集成。Tesla 和 Elon Musk 对两家公司的个人控制，带来了关联方维度，削弱了该参考客户的独立性。除联邦机构和 Tesla 外，xAI 官方页面没有列出具名企业客户。API
              和企业渠道不发布客户名单或案例研究。消费者证据可通过应用商店评分间接获得：iOS 评分 4.9/5、来自 1.2 million 条评分；Android 评分 4.7/5、来自 3.1 million
              条评论，在大规模下提供了有意义的汇总满意度证据。Google Play 的个体评论既提到对 Grok 推理能力的强烈认可，也提到对图像生成审核收紧的不满。GitHub 上开源 Grok-1
              发布是开发者社区证明点，显示模型架构在商业产品之外获得了社区验证和采用信号。
