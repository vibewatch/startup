  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入和 ARR
        - xAI 2024 全年、2025 全年和当前 ARR，按收入流拆分（消费者、API、企业、政府、外部算力）
        - 没有收入数据，就无法计算收入倍数，所有情景分析最多只能指方向；这是最重要的单一缺口
        - 直接向 xAI CFO 索取；把经审计 P&L 作为任何投资条款清单的前提
      - - 毛利率和单位经济性
        - 按产品分部的毛利率；推理成本数据；GPU 折旧进度；每 token 电力成本
        - 基础设施重资产 AI 公司若毛利率低于 50%，估值框架与软件公司根本不同；它决定 OpenAI 的倍数能否作为合理可比
        - 向 xAI 财务团队索取；如可行，用 NVIDIA 发票数据核验
      - - 现金头寸和烧钱速度
        - Series E 后的现金及等价物；月度运营烧钱；按当前烧钱速度计算的现金跑道
        - $37B 融资不等于流动性——资本开支义务和债务服务可能已经吃掉相当一部分；烧钱速度决定对 Series E「足够支撑数年」叙事的信心
        - 向 xAI CFO 索取；用已知 GPU 采购和施工许可交叉核验
      - - 资本结构和优先股堆叠
        - 完整股权结构表，包括股权类别权利、清算优先权、反稀释和债务契约条款；X 遗留债务结构和契约包
        - $17B 债务加未知优先股堆叠，可能在 $230B 企业价值下大幅压缩普通股价值；必须看清分配瀑布
        - 从法律顾问处取得；向公司索取股权结构模型；审查 $5B 有担保票据条款
      - - 客户数量和集中度
        - 按分部划分的付费客户数；前 10 大客户收入占比；企业合同规模；NRR；OneGov 升级转化率
        - 收入质量取决于客户多元化；高集中度叠加高流失是结构性风险；NRR 是企业产品市场契合度最清晰的信号
        - 对已知 API 和企业客户做访谈核验；向 xAI 销售负责人索取
      - - 内容安全和监管状态
        - 欧盟、英国、印度、马来西亚、法国 CSAM 调查的当前状态；xAI 的整改承诺；FedRAMP 审计进展；SOC 2 Type 2 报告可得性
        - 五个司法辖区的活跃监管调查会形成二元风险事件，可能实质损害企业和政府收入渠道
        - 通过法律顾问取得；在各辖区直接做监管询问；索取 FedRAMP 授权函和时间表
    notes: 这六个缺口最直接影响估值判断。截至运行日期，公开来源无法解决任何一个。推进投资条款清单之前，优先核验收入、利润率和资本结构。
