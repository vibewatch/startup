  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与竞争者分类
        blocks:
          - type: paragraph
            body: >-
              xAI 面临四类不同但重叠的竞争。直接前沿模型同行，是构建并销售可比通用智能模型访问权的公司：OpenAI（ChatGPT、GPT-5 系列）、Anthropic（Claude 4.x 系列）和 Google
              DeepMind（Gemini 3.x 系列）。每家公司都有消费应用、开发者 API 和企业产品，直接对应 xAI 的 Grok 加 xAI API
              加政府渠道结构。既有平台玩家把竞争延伸到纯模型实验室之外：Microsoft Copilot 借助约 3 亿个企业席位的 M365 存量基础，把 AI 嵌入工作流层；xAI
              在传统企业软件中没有同等位置。Google 也把 Gemini 嵌入 Search、Gmail、Chrome 和 Workspace，把既有用户关系转化为 AI
              采用路径。开放权重和自托管替代品构成第三个威胁向量。Meta Llama 4（Maverick 和 Scout）以及 Mistral AI 的开源模型家族，让企业买方可以通过自托管彻底消除按 token API
              费用，从而削弱包括 xAI 在内所有前沿实验室的托管 API 定价经济性。相邻 AI 原生应用补齐格局：Perplexity 的 AI 搜索引擎瞄准 Grok
              同样覆盖的生产力和研究工作流，采用引用优先定位，MAU 超过 2000 万；Microsoft 的 Atlas 浏览器和 Perplexity 的 Comet
              浏览器显示，界面层本身正在成为竞争战场。现状——员工使用传统搜索引擎、企业知识库，或完全不用
              AI——仍是最大的单一行为替代类别，尤其是在部署周期很长的受监管行业。内部自建是相关替代：大型企业和政府机构若投资微调或专有开放权重模型，就等于把自己从托管 API 市场移出。
