      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: X 数据访问是 xAI 结构上最可防守的竞争护城河
            body: 没有具名同行在开发者 API 中提供实时 X 社交数据。这创造了一个不签 X 授权就无法复制的差异化；对竞争者而言，也不是单靠模型质量改进就能补上的能力缺口。
            calloutType: strength
            claimRefs:
              - CP018
              - CP031
              - CP039
          - type: callout
            title: SDK 兼容性是一把双刃剑
            body: >-
              xAI 对 OpenAI 和 Anthropic SDK 的兼容，让开发者很容易采用 Grok，也同样容易离开。若没有工作流嵌入、专有数据集成，或在模型 API
              调用之外制造粘性的智能体微调，流失风险仍然结构性偏高。
            calloutType: risk
            claimRefs:
              - CP027
              - CP028
              - CP036
          - type: callout
            title: 企业分发缺口是最重要的未解竞争问题
            body: >-
              Gartner 发现，2026 年 AI 主要由既有软件供应商销售，而不是作为新的登月式产品被购买；这是对 xAI 企业渠道最不利的单一结构性洞察。xAI 没有 M365 等价物，没有 Workspace
              等价物，也没有已披露的企业软件合作伙伴关系，能提供 Google 和 Microsoft 享有的同等既有优势。
            calloutType: insight
            claimRefs:
              - CP015
