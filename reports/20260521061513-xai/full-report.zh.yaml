      - number: '1.2'
        title: 创始人、领导层与披露边界
        blocks:
          - type: paragraph
            body: >-
              领导层图景顶部很清楚，往下却异常稀薄。Elon Musk 毫无疑问是公开门面、首席执行官、融资人，也是 xAI、X、Tesla 车辆分发和 Memphis 算力建设之间的战略整合者。官方政府合作材料也将 Ross
              Nordeen 列为联合创始人；AP 报道保留下来的上线早期信息，则列出了初始技术创始团队，包括 Igor Babuschkin、Jimmy Ba、Greg Yang、Christian Szegedy
              等人。缺失的是后期私营公司常见的披露包：当前董事会构成、执行委员会细节、创始研究员角色定义，以及股权结构治理权利，都没有在现有公司页面上说清。这很重要，因为 xAI 的运营系统高度依赖 Musk
              控制的相邻资产之间创始人协调。投资者可以为这种集中带来的速度和分发优势买单，但也会承接关键人物依赖，以及一个透明度低于其估值和基础设施规模的治理界面。
