      - number: '4.3'
        title: 成本结构与资本强度：算力优先，基础设施主导
        blocks:
          - type: paragraph
            body: >-
              xAI 的成本结构由硬件采购和数据中心基础设施主导，而不是员工数或销售费用。Series E 公告确认，到 2025 年底，xAI 在 Colossus I 和 Colossus II 数据中心部署了超过 100
              万块 H100 GPU 等效算力。按规模化 H100 等效 GPU 市场价格约 $25,000 至 $35,000 计算，100 万块意味着硬件资本开支区间约 $25B 至
              $35B。这个数字是近似且方向性的，不是经审计数据，但它说明了为什么基础设施投资会压过已披露的 $37B 股权融资：相当一部分资本很可能直接流向 GPU 采购和数据中心建设。


              数据中心建设成本也很可观。xAI 已为 Mississippi 州 Southaven 的 Colossus 2 场址提交一栋 $659M、312,000 平方英尺建筑的许可。Colossus 2 数据中心本身于
              2026 年 1 月上线，主动冷却基础设施可管理约 350 兆瓦，低于 Elon Musk 在启动时声称的 1 吉瓦。电力基础设施进一步增加成本：xAI 已在 Colossus 2 部署 46 台天然气轮机，并在
              Colossus I 运行其他轮机作为应急和补充电源。轮机部署正成为一宗活跃 Clean Air Act 诉讼的核心；NAACP 在 Earthjustice 和 SELC 代理下，于 Mississippi
              北区联邦法院起诉，指控 xAI 子公司 MZX Tech 在没有必要空气许可的情况下运行 27 台轮机。法律和整改风险尚未量化，但可能包括罚款、被迫安装最佳可得控制技术，或运营限制。


              推理和训练成本没有公开披露，但鉴于前沿 AI 大规模推理需要密集 GPU 利用，结构上很高。xAI 的模型路线图（Grok 3、Grok 4 系列、Series E 公告时正在训练的 Grok
              5）意味着持续训练周期会消耗公司自有 Colossus 算力，形成资本开支折旧负担和电力成本流。Colossus 集群最终目标为 2 吉瓦总计算电力；按数据中心效率比率，在 Tennessee
              电价下意味着每年电费可能达到数亿美元。$659M 建设许可和 Series E 文章描述的基础设施扩张，都显示资本开支预计至少到 2027
              年会显著增加。一个值得注意的次级收入或成本效率信号，是正在出现的外部算力租赁机会：DCD 2026 年 5 月报道称，Anthropic 计划作为与 SpaceX 合作的一部分使用 xAI Colossus I
              的全部容量，这可能产生外部收入，部分抵消基础设施所有权成本——但商业条款或收入影响尚未披露。
