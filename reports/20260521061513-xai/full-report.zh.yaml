      - number: '3.2'
        title: 直接前沿模型同行画像
        blocks:
          - type: paragraph
            body: >-
              OpenAI 是按所有可衡量消费者指标看都占主导的既有厂商。A16z 报告称，2025 年 ChatGPT 跨平台周活约 8 亿至 9 亿，占美国 AI 聊天机器人市场约 60.6%，DAU/MAU 参与比为
              36%，几乎是 Gemini 21% 的两倍。GPT-5 及其家族（GPT-5 mini、GPT-5 nano）现在可通过 API 以不同价格点使用；ChatGPT 企业版包含 SAML
              SSO、SCIM、EKM、审计日志、域名验证、GDPR/CCPA 合规，并承诺不使用客户数据训练。OpenAI 还推出了面向软件工程的 Codex、Atlas 浏览器，以及 ChatGPT
              内第三方开发者体验所需的 Apps 基础设施——这些动作把它定位成潜在消费者平台，而不只是聊天机器人。OpenAI 的主要约束，是它在基础设施和分发上深度依赖 Microsoft
              Azure；这种关系在企业触达上是复利优势，但也引入了单一合作伙伴集中度，构成投资者的治理风险。Anthropic/Claude 是最清晰的安全品牌既有厂商，也是企业买方评估模型质量时最直接的技术同行。A16z
              报告称，Claude Code 六个月内达到 $1B 年化运行率，说明 Anthropic 拥有真实的编码与智能体变现路径。Claude Opus 4.7 API 定价为每百万 token 输入 $5、输出
              $25，定位高端模型；Claude Sonnet 4.6 的 $3/$15 瞄准中端。企业计划提供 HIPAA-ready 能力、SCIM、IP 允许列表、Compliance API
              和网络级访问控制。Anthropic 的消费者触达明显窄于 OpenAI 或 Google；A16z 明确称 Anthropic 专注专业消费者和技术用户，大众市场消费者分发仍是缺口。Google/Gemini
              是 xAI 长期最危险的竞争威胁，因为它能借助一个 xAI 和 Anthropic 都无法从外部匹配的既有分发界面。A16z 报告称，Gemini 桌面用户同比增长 155%，Pro 订阅同比增长近
              300%；Gemini 的 Nano Banana 图像模型上线第一周带来 1000 万新 Gemini 用户。Gemini 嵌入 Chrome、Gmail、Google Meet 和
              Workspace，意味着已经为 Google 服务付费的企业买方，可以通过既有采购获得 AI 能力，而不是发起新的购买决策。Gemini Developer API 提供免费层和按量付费定价；Gemini
              3.5 Priority 层输出标价为每百万 token $9。Google 的主要约束是执行可读性：A16z 指出产品访问混乱，Google Search 中的 AI Mode 自 5 月上线以来，仅吸引约
              2% 周用户使用。
