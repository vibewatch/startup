      - number: '3.4'
        title: 功能对比、定价与切换成本
        blocks:
          - type: paragraph
            body: >-
              功能上，xAI 相比所有具名竞争者最清晰的差异，是 X 实时数据访问与原生社交界面的组合。xAI 的 API 包含实时网页和 X 搜索工具，开发者无需单独 X 授权，就能访问 OpenAI、Anthropic 或
              Mistral API 无法提供的数据流。这让 xAI 成为需要时事、趋势内容或社交情绪语境的用例的优先选择。企业功能上，xAI 现在已达到主要具名竞争者的基础门槛：x.ai/api 页面列出 SOC 2
              Type 2、GDPR、CCPA、Zero Data Retention、SSO、审计日志、基于角色的访问控制和数据驻留——与 OpenAI Enterprise 和 Anthropic Enterprise
              发布的清单相同。剩下的企业差异化缺口是记录：OpenAI 和 Anthropic 披露的企业客户部署和案例研究多于 xAI；xAI 尚未发布可比的企业客户参考库。定价上，xAI 的 grok-4.3 API
              为每百万输入 token $1.25、每百万输出 token $2.50——低于 Anthropic Sonnet 4.6 的 $3/$15，远低于 Anthropic Opus 4.7 的 $5/$25，使
              xAI 可定位为 OpenAI 中端模型的潜在性价比替代。Gemini API 较低层级定价与 xAI 相当或更低，反映了 Google 补贴大规模开发者采用的能力。托管 API 市场的切换成本结构性偏低。xAI
              明确把 OpenAI 和 Anthropic SDK 兼容性作为迁移优势来营销；同样的兼容性也意味着开发者可以同样轻松地离开 xAI。消费者切换成本也低：A16z 报告称，只有 9% 消费者为超过一个 AI
              订阅付费，意味着消费者忠诚度是集中而非分散的，但每个平台必须持续赢得留存，而不能依靠技术锁定。持久切换成本的主要来源是数据和工作流嵌入：一旦企业部署的智能体会读取内部知识库、写入共享输出格式，或嵌入团队工作流，迁移这些集成的成本——而不是模型本身——就成为主要留存驱动。xAI
              的企业功能（审计日志、基于角色的访问、数据驻留）是这类深度嵌入的必要条件，但还不充分；公司尚未披露一个能够证明嵌入式工作流锁定的集成企业部署库。
