      - number: '7.4'
        title: 竞争与平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              xAI 的算力基础设施完全依赖 NVIDIA 硬件，Colossus 集群使用 NVIDIA Hopper GPU，搭配 Spectrum-X 网络和 BlueField-3 SuperNIC。NVIDIA
              同时是关键硬件供应商，也是 xAI Series E 轮披露的战略投资者，形成潜在定价利益冲突：同一个实体既设定上游 GPU 供应价格，又从 xAI 成功中享有股权上行。Colossus 建设没有披露替代 GPU
              供应商；1-million-GPU 规模意味着 xAI 是 NVIDIA 最大客户之一，既带来集中收益（优先供货），也带来集中风险（在可比时间尺度上没有可行替代）。


              消费者分发高度依赖 X 平台，约 600 million 月活用户是 Grok 产品采用的主要漏斗。X 平台依赖形成单点故障：任何 X 用户互动恶化、针对 X 的监管行动，或影响 Grok 在 X
              上集成的政策变化，都会直接削弱 xAI 的消费者触达。开发者 API 侧，xAI 宣称从 OpenAI 或 Anthropic 迁移只需更换 URL 和 API key；这个特性一方面吸引开发者，另一方面也让离开
              xAI 同样低成本。A16Z 数据显示，截至 2025 年 12 月，Grok 独立消费者 DAU 为 9.5 million、MAU 为 38 million，但美国 AI 用户中只有 9%
              会为超过一个订阅付费，说明转化呈现赢者拿走大半的格局。


              2026 年 5 月 DCD 报道称，Anthropic 计划通过 SpaceX 合作使用 Colossus 1 全部容量，这引入了新的运营依赖：如果 Anthropic 的算力占用没有被严密管理，xAI
              自身用于 Grok 5（截至 Series E 公告时正在训练）的模型训练吞吐可能受限。依赖图显示，硬件、分发和算力租赁关系都穿过高度集中的交易对手。
