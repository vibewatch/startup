          values:
            - label: 高
              tone: warning
              detail: 联邦诉讼已于 2026 年 4 月 14 日提起；46 台涡轮机对照 41 台涡轮机许可
            - label: 严重
              tone: warning
              detail: 涡轮机限发或强制 BACT 改造可能降低 Colossus 2 吞吐量
            - label: 低
              tone: warning
              detail: 许可仍待批；涡轮机继续在许可阈值以上运行
            - label: 涡轮机限发；每日罚款；BACT 改造资本开支
              tone: warning
        - label: CSAM / 内容安全监管调查
          values:
            - label: 高
              tone: warning
              detail: 事件于 2026 年 1 月确认；5 个司法辖区已启动调查
            - label: 高
              tone: warning
              detail: DSA 罚款最高可达全球收入 6%；可能限制市场准入
            - label: 低
              tone: warning
              detail: 事后控制已部署；未发布独立审计
            - label: 多司法辖区罚款；企业信任被侵蚀
              tone: warning
        - label: 关键人集中（Elon Musk）
          values:
            - label: 中
              tone: neutral
              detail: 结构性依赖；概率取决于外部事件
            - label: 严重
              tone: warning
              detail: 未披露继任计划；对单一个人形成二元依赖
            - label: 低
              tone: warning
              detail: 未披露成文继任框架或关键人保险
            - label: 没有缓释路径；结果二元
              tone: warning
        - label: 资本强度与烧钱风险
          values:
            - label: 中
              tone: neutral
              detail: 未披露收入；资本开支和债务负担确认很大
            - label: 高
              tone: warning
              detail: $17B+ 债务；GPU 资本开支估计 $25–35B；烧钱速度未量化
            - label: 低
              tone: warning
              detail: 没有审计财报；未披露烧钱速度或现金跑道
            - label: 没有私有数据室权限，就无法判断现金跑道
              tone: warning
        - label: NVIDIA 供应 / 定价集中
          values:
            - label: 低
              tone: positive
              detail: NVIDIA 也是战略投资方，利益方向一致
            - label: 高
              tone: warning
              detail: 没有替代 GPU 供应商；无法在可比时间内改造集群
            - label: 中
              tone: neutral
              detail: 战略投资方关系带来优先供货通道
