companyProfile:
  summary: >-
    xAI 是一家由 Elon Musk 领导、成立于 2023 年的前沿 AI 公司，已经从模型实验室演进为一体化 AI 平台。2025 年 3 月对 X 的全股票收购，把 xAI 的模型开发和 Colossus 算力基础设施，与 X
    约 6 亿月活用户的分发界面和专有实时社交数据合在一起。公司通过三条路径变现：面向消费者的 Grok 订阅和 X Premium 访问，按量计费的 API 定价（grok-4.3 每百万 token 输入 $1.25、输出
    $2.50），以及通过 GSA OneGov 协议起步的政府 / 企业渠道。融资规模极不寻常——Series B 到 E 已披露股权融资至少 $42B，另有 $5B
    有担保债务——但经审计收入、毛利率、烧钱速度和客户经济性仍未披露。2026 年 1 月 Series E 给出的 $230B 估值参照，只有在 xAI 已接近 $3–7B ARR 时才说得通；这一数字远高于任何公开证据。
