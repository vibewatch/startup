  - id: FE001
    title: xAI 技术栈架构
    type: stack
    layout: wide
    summary: 从自有基础设施到模型训练，再到产品触点和开发者渠道的四层技术栈。Colossus 算力和 X 数据集成是两层没有同等竞争对手替代物的环节。
    data:
      layers:
        - label: 基础设施层
          detail: Colossus Memphis 超级集群——200,000 张 H100 等效 GPU；NVIDIA Spectrum-X 网络；现场天然气轮机（许可存在争议）；水循环工厂。单站点地理布局带来运营集中风险。
          items:
            - Colossus 一 / 二期（200k H100 等效 GPU）
            - NVIDIA Spectrum-X 高速网络
            - Memphis 本地能源和冷却
        - label: 训练与研究层
          detail: 预训练规模的强化学习驱动 Grok 4 及衍生模型。相较以往 RL 训练，算力效率提升 6×。统一的推理 / 非推理架构减少权重数量开销。X 数据（实时社交图谱）是独家训练和检索输入。
          items:
            - 规模化 RL 训练（预训练规模，Grok 4）
            - X 社交数据（独家检索信号）
            - 模型卡和 RMF 安全评估流水线
        - label: 模型与推理层
          detail: 自研模型家族通过集群内推理提供服务；代码模型演示 190 TPS；无公开 SLA。上下文窗口从 1M（grok-4.3）到 2M tokens（grok-4.20/grok-4-fast）。
          items:
            - Grok 4.3 / 4.20（旗舰文本模型）
            - Grok Code Fast 1 / Grok Build 0.1（编码工具）
            - Grok Voice API / Grok Imagine API（媒体）
        - label: 产品与分发层
          detail: 六个消费者 / 开发者访问渠道。兼容 OpenAI/Anthropic SDK 降低摩擦。X 社交分发在前沿 AI 公司中独一份；政府渠道通过 OneGov 打开。
          items:
            - Grok 网页 / iOS / Android 消费者应用
            - X 上的 Grok（社交集成 AI）
            - xAI 开发者 API（兼容 SDK）
            - xAI 政府版 / OneGov
