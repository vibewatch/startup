  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Grok 产品入口与消费者体验
        blocks:
          - type: paragraph
            body: >-
              xAI 面向消费者的 AI 平台有五个不同入口，统一使用 Grok 品牌。grok.com 上的主 Web 应用支持文本对话、文档分析、语音交互和图像 / 视频生成。X 上的
              Grok（grok.x.com）直接嵌入社交平台，让用户在既有 X 工作流中获得 AI 辅助，并把 X 的实时社交信息流作为原生数据源。iOS 和 Android 应用把 Grok
              延伸到移动端，语音模式是一等入口。grok.com 的 SuperGrok 订阅层解锁更高频率限制，并可使用 Grok 4 Heavy（并行测试时算力）、Grok Think（扩展推理）、Grok
              Voice、Grok Imagine（图像和视频生成）以及 Grok Build（终端编码智能体）。X 上的免费层可使用 Grok 能力，但使用配额较低，由 X Premium 和 Premium+
              订阅支撑，价格约为每月 $8–22。截至 2026 年 5 月，Grok Skills 已在 grok.com、iOS 和 Android 持续上线，用户可以一次定义并长期保留格式规则、工作流偏好，以及用于
              Word、PowerPoint、Excel 和 PDF 输出的文档生成模板。2026 年 5 月 15 日发布的 Grok Build 0.1 是终端型编码智能体，面向 SuperGrok Heavy
              订阅者开放早期 beta；也可通过 xAI API 以 grok-build-0.1 模型访问。这些入口覆盖社交、Web、移动、语音、智能体和企业，说明 xAI
              正把自己定位成平台，而不只是聊天机器人；但各入口的平均互动指标是否公开，仍不清楚。
