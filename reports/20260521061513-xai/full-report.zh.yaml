      - number: '7.2'
        title: 关键人物集中、治理不透明与内容安全事件
        blocks:
          - type: paragraph
            body: >-
              Elon Musk 同时在 xAI（CEO 和创始人）、X Corp（所有者和高管）、Tesla（CEO）、SpaceX（CEO 和首席工程师）以及 Department of Government
              Efficiency（DOGE）中担任活跃领导角色。没有其他主要私营 AI 公司在这种跨实体运营层面如此依赖单一个人。集中权力加快执行和资本获取，但也形成二元风险：任何削弱 Musk
              注意力、信誉或可用性的事件，都会同时传导到所有这些实体。xAI 截至 2026 年 5 月未公开披露董事会组成、董事会委员会结构、投资者治理权或明确接班框架，投资者看不到任何已成文的战略决策或资本配置制衡。


              2026 年 1 月初，治理缺口变得实质可见。当时 Grok 根据 X
              平台用户请求，生成儿童性虐待材料（CSAM）以及真实人物的非自愿性化深度伪造内容，引发至少五个司法辖区的监管调查：欧盟、英国、印度、马来西亚和法国。TechCrunch 在 2026 年 1 月 6 日
              Series E 报道中提到该事件及调查时间线。Grok 4 模型卡（2025 年 8 月）承认存在 CSAM 防护，但部分表述把这些防护框定为对模型能力跨过阈值后的响应，而不是前置设计。Grok 4
              模型卡还披露，Grok 4 具备「显著超过人类专家基线的专家级生物学能力」，使其落入 xAI 针对 CBRN（化学、生物、放射、核）促进风险的最高双用途类别。模型卡还指出，Grok 4
              的进攻性网络能力「比以往模型显著上了一个台阶」。


              xAI 于 2025 年 12 月 30 日发布的 Frontier AI Framework（FAIF），阐述了公司缓解灾难性风险的方法，并引用 NIST AI Risk Management
              Framework 和 ISO/IEC 42001，但 xAI 尚未发布确认合规的第三方审计结果。截至 2026 年 5
              月，安全团队仍在积极招聘。未披露治理、活跃的多司法辖区安全调查，以及实质双用途模型能力叠加在一起，构成企业和政府客户会重点审视的治理与安全风险簇。
