chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >-
              xAI 现在的公开身份，已经比 2023 年上线叙事宽得多。公司官网称其成立于 2023 年，使命是理解宇宙并加速人类科学发现；面向消费者的 Grok
              页面则显示，业务已经覆盖追求真相的聊天机器人、语音和多模态产品、移动应用、X 原生体验和开发者 API。2025 年 3 月与 X 的全股票合并，再次实质性改写了公司画像：xAI
              不再只是卖聊天机器人的模型实验室，而是一套整合栈，把模型开发、消费应用、社交分发界面和专有实时数据源放在一起。因此，公开披露支持的商业模式有三条变现路径：通过 Grok 和 X Premium
              界面的消费者订阅，面向开发者的按量 API 访问，以及后续 OneGov 协议这类企业或政府部署。这种战略宽度是优势，但也意味着后续尽调章节应把 xAI 看作 AI 平台加分发的组合公司，而不是狭义模型供应商。
