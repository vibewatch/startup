      - number: '2.2'
        title: 买方分层、预算与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开买方地图比 xAI 的私有披露包更宽。在消费者侧，Grok 作为追求真相的助手，覆盖网页端、移动端和 X 原生界面；CNBC 报道称，Grok 3 功能会推向 X Premium 用户，也会推向单独的
              Grok 网页端和应用订阅者。面向开发者，xAI 提供 token 定价 API、兼容 OpenAI 和 Anthropic
              的迁移路径，以及现在覆盖工具、文件、语音、批处理、成本追踪、预配置吞吐量和编码模型的发布节奏。面向政府，OneGov 以每个机构 $0.42、18 个月的价格创造低摩擦入口，并声明可升级至符合 FedRAMP 和
              DoD 的企业订阅。关键分层细节在于，xAI 最大的公开分发优势，并不自动等于最大付费细分。A16z 2025 年 12 月消费者 AI 综述称，Grok 到 12 月中旬约有 3800 万 MAU；xAI
              2026 年 1 月 Series E 公告则称，X 和 Grok 合计月活约 6 亿。这个差距意味着巨大的漏斗顶部受众，但没有披露转化率。A16z 还称，绝大多数消费者只使用一个通用助手，主要 AI 产品中仅
              9% 用户为超过一个订阅付费。这支持了一个市场判断：分发权重异常高，消费者可能收敛到少数助手，而在企业预算完全可读之前，xAI 的 X 整合已经具备战略重要性。
