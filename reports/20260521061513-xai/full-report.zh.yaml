      - number: '1.4'
        title: 基础设施、里程碑与负面背景
        blocks:
          - type: paragraph
            body: >-
              Colossus 是公司概览里的运营主轴，因为它把融资、产品节奏、Memphis 足迹和主要负面叙事连在一起。xAI 和 NVIDIA 官方材料称，首个 100,000-GPU 阶段在 122
              天内投产，首批机架到场 19 天后就开始迁移工作负载；公司随后把集群翻倍到 200,000 块 GPU，后来又表示 2025 年结束时，Colossus I 和 II 合计已有超过 100 万块 H100 等效
              GPU。Memphis 材料还描述了一个 100 万平方英尺改造项目、一座 $80M 水循环工厂，以及最多数百个本地岗位。同一足迹也引发了最严重的公开反弹。Reuters、Earthjustice 和 SELC
              描述的指控称，xAI 在 Tennessee 和 Mississippi 的 Colossus 设施安装并运行了未获许可的燃气轮机，进而引发通知函、诉讼和新的许可听证。结果是，xAI
              最强的战略差异化——快速垂直整合算力——同时也成为持续的环境、许可和社区关系风险，无法与核心投资逻辑切开。
