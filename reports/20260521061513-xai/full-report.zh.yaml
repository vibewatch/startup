  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              xAI 的相关市场应从其变现界面向外界定，而不是从整个 AI 技术栈向内切。xAI 公开材料显示，今天有三类直接收入界面：通过 Grok 和 SuperGrok/X Premium 路径获得的消费者助手使用，通过
              token 定价的开发者和产品团队 API 使用，以及通过 OneGov 协议建立的政府渠道。这个边界远窄于 AI 经济的标题叙事。Gartner 2026 年 1 月表格将 2026 年全球 AI 支出列为
              $2.53T，但 AI 模型只有 $26.38B，AI 软件为 $452.46B；最大类别是 $1.37T 的 AI 基础设施。判断 xAI 时，这些软件和模型池比硬件与服务器建设更接近可售需求，尽管 xAI 因
              Colossus 本身异常偏重基础设施。实际市场定义因此包括消费级 AI 助手、开发者和智能体工作流、企业知识工作部署，以及公共部门采购。它应排除通用设备更新、大多数超大云厂商资本开支，以及从不通过
              Grok、xAI API 或政府订阅变现的广义 AI 服务支出。xAI 特殊之处在于同时跨越前沿模型市场和通过 X 获得的消费者分发界面，但投资者仍应避免把全部 AI 基础设施或全部 AI 经济价值当作 xAI
              的直接 SAM。
