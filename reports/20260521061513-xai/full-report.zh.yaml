      - number: '5.3'
        title: 技术架构与基础设施绑定
        blocks:
          - type: paragraph
            body: >-
              xAI 的模型训练架构与田纳西州 Memphis 的 Colossus GPU 超级集群高度绑定。该集群第一阶段达到 100,000 块 H100 等效 GPU，并在 Grok 4 训练前扩展到 200,000
              块 GPU。拥有这部分算力，让 xAI 能以租云竞争对手难以复制的规模运行训练实验；后者若想接近，只能谈判大额预留容量合同。Grok 3 和 Grok 4 的核心技术差异点是规模化强化学习。Grok 3
              以空前规模使用 RL 来打磨思维链推理；Grok 4 则把 RL 扩展到「预训练尺度」，靠新基础设施和算法创新把算力效率提高 6×。Grok 4 Fast
              引入统一模型架构，推理（长思维链）和非推理（快速响应）模式使用同一套模型权重，由系统提示词引导；相比维护两个不同模型检查点，这降低了端到端延迟和 token 成本。xAI API 层提供标准 chat
              completions 接口，可与 OpenAI 和 Anthropic SDK 无缝替换兼容，降低开发者切换成本和生态摩擦。上下文窗口从 Grok 1 的 8,192 token 扩展到 grok-4.3 的
              1 million token，以及 grok-4.20 和 grok-4-fast 的 2 million token，使文档级分析无需切块。图像输入支持最高 20 MiB 的 JPEG 和
              PNG，且不限制最大图片数量。关键技术约束是：grok-4.20 及更新模型不支持 logprobs 和 top_logprobs，限制了依赖 token 级概率输出的用例。2024 年 11
              月的知识截止日意味着，所有 Grok 模型面对需要截止日后信息的查询都必须使用搜索工具，这会给实时应用增加延迟。
