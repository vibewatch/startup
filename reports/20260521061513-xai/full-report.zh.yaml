      - number: '5.2'
        title: 模型阵容、API 与发布节奏
        blocks:
          - type: paragraph
            body: >-
              在前沿 AI 行业，xAI 保持了最快的公开模型发布节奏之一。从 2023 年 11 月 Grok 1 上线到 2026 年 5 月 Grok 4.3，公司在约 30 个月里推出了大约 14
              个命名模型族。Grok 1 开放权重（314B 参数专家混合架构，8 个专家、每个 token 激活 2 个）于 2024 年 3 月在 GitHub 以 Apache 2.0
              许可发布，让外界看到了基础架构。后续代际放弃开放权重，转向在 Colossus 上进行规模化闭源训练。2025 年 2 月发布的 Grok 3 在 Colossus 上使用前代模型 10× 算力训练，实现 1M
              token 上下文窗口，并在 Chatbot Arena 获得 1402 Elo。Grok 4（2025 年 7 月）使用完整 200,000-GPU Colossus
              集群，在预训练尺度上进行强化学习，相比此前训练获得 6× 算力效率提升，并加入原生工具使用。Grok 4 Heavy 使用并行多智能体推理，成为第一个在 Humanity's Last Exam 得分 50.7%
              的模型。API 产品于 2024 年 11 月公开 beta，兼容 OpenAI 和 Anthropic SDK。截至 2026 年 5 月，API 模型阵容包括 grok-4.3（1M
              上下文，$1.25/$2.50 每 1M 输入 / 输出 token）、grok-4.20-reasoning（2M
              上下文）、grok-4.20-non-reasoning（延迟优化）、grok-4-fast-reasoning/$0.20/$0.50（2M
              上下文）、grok-code-fast-1（$0.20/$1.50）、Grok Voice API（$3/小时智能体，亚秒级延迟）和 Grok Imagine
              API（$0.02/图像，$0.05/秒视频）。Grok 3 和 4 系列的知识截止日是 2024 年 11 月；实时信息需要启用 Web 或 X 搜索工具。与 OpenAI 的 GPT-5.5（每 1M
              token $5/$30）和 Claude 的 Opus 4（每 1M token $5/$25）相比，grok-4.3 定价明显低于前沿同业；grok-4-fast
              则属于成本效率最高的推理模型之一，Artificial Analysis 的独立验证确认其价格 / 智能比处于领先水平。
