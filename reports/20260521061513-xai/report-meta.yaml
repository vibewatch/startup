summary:
  headline: >-
    xAI has real compute, distribution, and execution advantages at scale, but the $230B valuation
    cannot be underwritten from public data — research-more until private financials are accessible.
  overallScore: 5.5
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: expensive
