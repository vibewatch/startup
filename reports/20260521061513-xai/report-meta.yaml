  foundingLocation: >-
    Palo Alto, California is the publicly disclosed primary headquarters; xAI also has offices in
    Seattle, San Francisco, Memphis (Tennessee), and London.
  headquarters: >-
    Palo Alto, California, with major operational presence in Memphis, Tennessee (Colossus data
    centers) and additional offices in Seattle, San Francisco, and London.
  productSummary: >-
    Grok consumer AI assistant (web, iOS, Android, X-native); xAI developer API with OpenAI and
    Anthropic SDK compatibility; voice, image, and video generation models; Colossus GPU
    supercluster providing proprietary training-to-inference infrastructure; and a government
    channel through the GSA OneGov agreement.
  customerFocus: >-
    Consumer AI assistant users via Grok and X Premium; developers and product teams via the
    xAI API; U.S. federal agencies via GSA OneGov; enterprise deployments including Tesla embedded
    Grok Voice; vertically integrated across consumer, developer, and government segments.
  businessModel: >-
    Three monetization rails: consumer subscriptions (Grok app and X Premium tiers), usage-based
    API token pricing (grok-4.3 at $1.25 input / $2.50 output per million tokens), and
    government/enterprise agreements. Revenue quality, gross margin, and unit economics are
    undisclosed.
  stage: Late-stage private / Series E
  fundingStatus: >-
    Disclosed equity financing includes a $6 billion Series B (May 2024), a $6 billion Series C
    (December 2024), a $5 billion component of a $10 billion combined raise (July 2025), and a
    $20 billion Series E (January 2026), implying at least $37 billion of publicly identified
    equity. Additional $5 billion in secured notes and approximately $12 billion of legacy X debt
    bring total obligations to approximately $54 billion. The January 2026 SEC Form D confirms
    the $20 billion Series E. Investors include NVIDIA, Cisco, Fidelity, QIA, MGX, Valor,
    Stepstone, and Baron Capital.
