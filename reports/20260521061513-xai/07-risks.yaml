  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Clean Air Act litigation (NAACP v. MZX Tech)
        - Court order or MDEQ enforcement action affecting turbine operations
        - Court-ordered turbine curtailment reducing Colossus 2 capacity by more than 20%
        - Revisit infrastructure throughput assumptions; model capex for BACT retrofit; reduce valuation
      - - CSAM / content-safety regulatory enforcement
        - EU DSA enforcement decision or fine notification; UK Online Safety Act enforcement
        - Formal enforcement action or fine exceeding $50M in any single jurisdiction
        - Assess market access restrictions; model enterprise churn from reputational damage
      - - Key-person (Musk) impairment
        - Musk departure, incapacitation, legal disqualification, or sustained attention diversion
        - Any public announcement of involuntary leadership change at xAI
        - Immediate investment thesis review; no documented succession plan exists
      - - Capital market freeze or valuation reset
        - xAI unable to raise follow-on round at or above prior valuation; bridge financing required
        - Failed fundraise at Series F or debt covenant breach within 18 months
        - Reassess runway; prepare for distressed-valuation scenario; review liquidation preference stack
      - - NVIDIA export restriction or supply disruption
        - US BIS export control action targeting H100-class GPUs or NVIDIA's supply to xAI
        - Any BIS rule or executive order materially restricting NVIDIA GPU exports relevant to xAI
        - Model timeline delays for Grok 5 and Colossus 3; re-evaluate competitive positioning
    notes: >-
      Thresholds are indicative for diligence structuring; they are not drawn from disclosed company
      policies. Action implications are investment-framing signals, not company commitments. All
      triggers require continuous monitoring against publicly available legal, regulatory, and
      financial disclosures.
