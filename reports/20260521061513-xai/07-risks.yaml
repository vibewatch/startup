callouts:
  - calloutType: risk
    title: Kill criterion — environmental litigation
    body: >-
      If the federal court issues a preliminary injunction restricting turbine operation before BACT
      installation, or if MDEQ denies permits for the 19 incremental turbines (bringing the
      operational total above the 41-turbine threshold), Colossus 2 effective inference and training
      capacity could be materially curtailed. This is the most time-proximate thesis-break trigger
      because all enabling facts are already in place: the lawsuit is filed, the turbines are running,
      and the permit count is exceeded. Investors should require a documented remediation timeline
      and legal counsel opinion on injunction risk before conviction.
    claimRefs:
      - CR001
      - CR002
      - CR005
  - calloutType: risk
    title: Kill criterion — key-person and CSAM governance
    body: >-
      The CSAM incident (January 2026) demonstrated that content-safety controls were insufficient at
      the time of the Series E close. Multi-jurisdiction investigations remain open. If any EU, UK,
      or Indian enforcement action results in a temporary market access suspension, Grok's
      international revenue trajectory would be materially impaired. Combined with Musk's absence of
      any disclosed succession framework, a simultaneous key-person event and enforcement action
      would represent a compound governance failure with no documented recovery path. Require xAI to
      disclose CSAM safeguard audit results and a board succession plan as preconditions to investment.
    claimRefs:
      - CR009
      - CR011
      - CR012
      - CR015

