- id: growth-drivers-and-constraints
  title: Growth drivers, adoption constraints, and valuation relevance
  body: |-
    Demand-side signals remain strong, but xAI faces a market that rewards more than raw model ambition. Gartner forecasts 44% year-over-year AI spending growth in 2026, and Deloitte reports worker access to AI rose 50% in 2025 while the share of companies with at least 40% of projects in production is expected to double within six months. The White House's 2025 AI Action Plan and GSA's OneGov activity also show the federal market being actively pushed toward frontier-model adoption and infrastructure expansion. xAI has genuine tailwinds here: owned distribution through X, a government procurement wedge, and a fast-expanding API surface. The brakes are equally material. Gartner explicitly says AI is in the Trough of Disillusionment throughout 2026 and will most often be sold to enterprises by incumbent software providers rather than by new moonshot vendors. Deloitte says the AI skills gap is the biggest barrier to integration, and only one in five companies has a mature governance model for autonomous agents. OpenAI, Anthropic, Perplexity, Mistral, and Meta all market either enterprise-grade controls, open-weight flexibility, or lower-cost pathways that reduce buyer dependence on any single frontier lab. xAI's own capital structure also highlights the category's cost burden: the July 2025 $10 billion debt-and-equity financing and the Colossus buildout show that this market still demands unusually heavy infrastructure funding. The result is a market with real budget expansion but persistent pressure on pricing, trust, governance, and channel control.
