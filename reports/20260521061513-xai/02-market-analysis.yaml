- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Consumer AI assistant subscriptions
    - Grok web and app subscriptions, X premium-driven Grok access, SuperGrok upgrades, and paid consumer assistant usage
    - General social-media engagement, generic entertainment time, and ad inventory not tied to Grok monetization
    - Individual consumers, prosumers, and X users paying directly or through bundled premium plans
    - Core market because xAI already uses consumer reach and subscription surfaces as a distribution wedge
  - - Developer and agent platform
    - Token-priced inference, coding workflows, agent tools, voice, files, batch, and multimodal API usage
    - Hyperscaler server spend, unrelated developer tooling, and generic cloud compute not billed through xAI
    - CTO, VP Engineering, startups, product teams, and independent developers
    - Core direct market for xAI’s API monetization
  - - Enterprise knowledge-work deployment
    - Organization-wide assistant seats, secure internal search, workflow automation, and governed enterprise subscriptions
    - Generic office suites, non-AI SaaS seats, and consulting that does not monetize through Grok or the xAI API
    - CIO, COO, central IT, security, and line-of-business budget owners
    - Important but harder channel because incumbents already control much of the software envelope
  - - Federal and public-sector AI deployment
    - OneGov entry agreements, agency subscriptions, training, enablement, and higher-tier compliant deployments
    - General IT modernization spending and infrastructure projects that never purchase xAI access
    - Federal CIOs, procurement offices, program leads, and agency operations owners
    - Distinct wedge because xAI already has a named low-friction procurement route
  - - AI infrastructure adjacency
    - Compute, servers, networking, and data-center systems used to train or serve frontier models
    - Direct xAI software or subscription revenue when the spend never flows through xAI products
    - Hyperscalers, chip vendors, data-center operators, and infrastructure buyers
    - Strategically relevant context, but mostly outside xAI’s practical sellable market boundary
  notes: The underwriting boundary should follow what xAI can plausibly monetize through Grok, APIs, or government subscriptions, not every dollar spent somewhere in the broader AI stack.
