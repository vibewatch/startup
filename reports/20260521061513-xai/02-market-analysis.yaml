  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: 'Market Analysis: What paid conversion and segment revenue mix does xAI actually realize across consumer, API, enterprise, and government channels?'
    missingEvidence: Public materials do not disclose paid consumer conversion, API revenue mix, enterprise contract values, or segment-level retention needed to size xAI-specific TAM, SAM, or SOM.
    whyItMatters: Without these data, investors cannot connect xAI’s large public reach and capital base to durable monetization by segment.
    diligencePath: Request board or management materials showing MAU-to-paid conversion, API usage concentration, enterprise ARR, government activation, churn, and segment gross margin.
    relatedQuestionRefs:
    - QM022
    - QM023
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
    - TM003
  - type: missing-source
    severity: minor
    topic: 'Market Analysis: How much agency activation and upsell has OneGov produced since launch?'
    missingEvidence: Public sources reviewed confirm pricing and procurement path, but not how many agencies activated Grok, what workloads they deployed, or how many upgraded to higher-tier compliant subscriptions.
    whyItMatters: The OneGov price point is too low to evaluate the government channel economically without follow-on activation and upsell data.
    diligencePath: Request agency count, active-seat or active-user data, workload mix, upsell pipeline, and compliance milestone timing for the federal channel.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM003
    - TM004
  - type: missing-source
    severity: minor
    topic: 'Market Analysis: What portion of xAI’s public 600M reach is truly standalone Grok demand rather than X-surface distribution?'
    missingEvidence: Public materials reviewed provide a combined X-and-Grok monthly active figure and a third-party standalone Grok MAU estimate, but not an official breakout between embedded reach and direct product usage.
    whyItMatters: This gap affects any attempt to map consumer audience scale to likely subscription conversion and retention.
    diligencePath: Request a monthly audience bridge separating X-surface reach, standalone Grok MAU, paying subscribers, and multi-product overlap across web, app, and X.
    relatedQuestionRefs:
    - QM013
    - QM023
    relatedTableRefs:
    - TM002
    - TM003
