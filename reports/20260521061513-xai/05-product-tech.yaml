chapter:
  number: 5
  title: Product & Technology
  summary: >-
    xAI has shipped a full-stack AI product portfolio in under three years: the Grok consumer chatbot
    (web, iOS, Android, X-native), a developer API with OpenAI/Anthropic SDK compatibility, and a
    growing suite of specialized models spanning reasoning, coding, voice, and image/video generation.
    Grok 4 Heavy was the first model to score above 50% on Humanity's Last Exam and holds the
    #1 position on ARC-AGI V2 for closed models; Grok 4.1 topped the LMArena text leaderboard at
    1483 Elo. The proprietary Colossus 200,000-GPU cluster provides a vertically integrated
    training-to-inference advantage that no pure-API competitor replicates. Real-time X data
    integration and a six-week average between major model releases are structural moats. Key gaps
    include no independent third-party benchmark audit, a November 2024 knowledge cutoff that requires
    live search workarounds, undisclosed API uptime/SLA metrics, and a product breadth that risks
    execution diffusion at the current headcount.

sections:
- id: grok-product-surfaces
  title: Grok product surfaces and consumer experience
  body: >-
    xAI's consumer-facing AI platform spans five distinct access points, all branded Grok. The primary
    web application at grok.com supports text conversation, document analysis, voice interaction, and
    image/video generation. Grok on X (grok.x.com) integrates directly into the social platform,
    giving users AI assistance inside their existing X workflow and leveraging X's real-time social
    feed as a native data source. iOS and Android apps extend Grok to mobile with voice mode as a
    first-class interface. A SuperGrok subscription tier on grok.com unlocks higher rate limits and
    access to Grok 4 Heavy (parallel test-time compute), Grok Think (extended reasoning), Grok Voice,
    Grok Imagine (image and video generation), and Grok Build (terminal coding agent). The free tier
    on X gives access to Grok capabilities with lower usage quotas, funded by X Premium and
    Premium+ subscriptions at approximately $8–22 per month.
    As of May 2026, Grok Skills launched persistently across grok.com, iOS, and Android—enabling
    users to define once-and-remember formatting rules, workflow preferences, and document generation
    templates for Word, PowerPoint, Excel, and PDF output. Grok Build 0.1, announced May 15 2026,
    is a terminal-based coding agent available in early beta to SuperGrok Heavy subscribers; it is
    also accessible via the xAI API as the grok-build-0.1 model. The range of surfaces—social,
    web, mobile, voice, agentic, and enterprise—positions xAI as a platform, not merely a chatbot,
    though it is unclear whether average engagement metrics per surface are disclosed publicly.
