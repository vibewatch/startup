  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      API uptime history, SLA commitments (e.g., 99.9% monthly uptime), and publicly posted incident
      log or status page for the xAI API platform.
    whyItMatters: >-
      Enterprise and government buyers making mission-critical procurement decisions require documented
      SLA commitments. Absence of a public status page is a diligence flag at xAI's stated scale of
      ambition. OpenAI and Anthropic both publish uptime pages.
    diligencePath: >-
      Request API reliability metrics, incident history, and SLA terms directly from xAI enterprise
      sales; monitor any third-party API monitoring services that cover xAI endpoints.
    relatedQuestionRefs:
    - QE011

  - type: missing-source
    severity: material
    topic: benchmark-audit
    missingEvidence: >-
      Independent third-party replication or audit of xAI's Humanity's Last Exam 50.7% score for
      Grok 4 Heavy, ARC-AGI V2 15.9% for Grok 4, and LMArena Elo rankings.
    whyItMatters: >-
      All headline performance claims are either self-reported using xAI-controlled harnesses or
      derived from crowd-sourced leaderboards that allow model providers to select optimal prompting
      strategies. Without independent replication, benchmark figures are directionally informative
      but not independently verified, which affects the credibility of differentiation claims.
    diligencePath: >-
      Wait for independent reproducing papers or METR/AISI evaluations; engage Artificial Analysis
      for end-to-end re-evaluation of frontier benchmarks; require xAI to provide raw evaluation
      logs under NDA for technical diligence.
    relatedQuestionRefs:
    - QE023

  - type: private-evidence-only
    severity: material
    topic: government-compliance
    missingEvidence: >-
      FedRAMP authorization status, DoD IL level certification, and timeline for government ATO
      (Authority to Operate) for the xAI for Government and OneGov platform.
    whyItMatters: >-
      Without FedRAMP or IL-level authorization, xAI cannot be used for CUI-level (Controlled
      Unclassified Information) federal workloads, limiting the addressable government market to
      unclassified or FOUO-level deployments. The OneGov framework is a procurement vehicle but
      not a security authorization.
    diligencePath: >-
      Check the FedRAMP Marketplace for xAI authorization status; request ATO timeline and
      3PAO engagement status from xAI government sales channel.
    relatedQuestionRefs:
    - QE020
    - QE021

  - type: stale
    severity: minor
    topic: hyperscaler-rollout
    missingEvidence: >-
      Confirmed availability timeline and technical specifications for Grok 4 on hyperscaler
      partners (AWS, Azure, GCP Vertex) noted as "coming soon" in the Grok 4 announcement.
    whyItMatters: >-
      Hyperscaler distribution channels significantly expand enterprise reach without requiring
      direct API integration. The timeline and commercial terms of this rollout affect xAI's
      near-term enterprise revenue opportunity.
    diligencePath: >-
      Monitor AWS Bedrock, Azure AI Foundry, and GCP Vertex AI model catalogs for Grok 4 availability;
      request partnership terms from xAI channel sales.
    relatedQuestionRefs:
    - QE021
    - QE025

acknowledgedWarnings:
- dimension: tableNotes
  reason: >-
    Tables TE001 through TE005 are factual snapshot tables whose notes acknowledge data sources and
    caveats inline; no additional estimation methodology notes are required beyond what is documented
    in each notes field. Adding repeated methodology notes to these purely factual tables would add
    noise without analytical value.
