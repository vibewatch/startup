- id: technical-architecture
  title: Technical architecture and infrastructure coupling
  body: >-
    xAI's model training architecture is tightly coupled to the Colossus GPU supercluster in Memphis,
    Tennessee. The cluster reached 100,000 H100-equivalent GPUs in its first phase and expanded to
    200,000 GPUs before Grok 4 training. This compute ownership gives xAI the ability to run
    training experiments at a scale that cloud-renting competitors cannot replicate without negotiating
    large reserved capacity contracts. The core technical differentiator for Grok 3 and Grok 4 is
    scaled reinforcement learning. Grok 3 used RL at unprecedented scale to refine chain-of-thought
    reasoning; Grok 4 extended this to "pretraining scale" RL with 6× improved compute efficiency
    from new infrastructure and algorithmic innovations. Grok 4 Fast introduces a unified model
    architecture where reasoning (long chain-of-thought) and non-reasoning (quick response) modes
    use identical model weights steered by system prompts, reducing end-to-end latency and token
    costs compared to maintaining two distinct model checkpoints.
    The xAI API layer exposes a standard chat completions interface that is drop-in compatible with
    OpenAI and Anthropic SDKs, lowering developer switching costs and ecosystem friction. Context
    windows have scaled from 8,192 tokens in Grok 1 to 1 million tokens in grok-4.3 and
    2 million tokens in grok-4.20 and grok-4-fast, enabling document-scale analysis without
    chunking. Image input supports JPEG and PNG up to 20 MiB with no maximum image count. Key
    technical constraints: logprobs and top_logprobs are not supported on grok-4.20 and newer,
    limiting use cases that depend on token-level probability outputs. The knowledge cutoff of
    November 2024 means all Grok models require search tools for any queries requiring post-cutoff
    information, which introduces latency for real-time applications.
