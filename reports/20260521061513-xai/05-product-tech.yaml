- id: FE002
  title: Grok consumer query workflow
  type: flow
  layout: standard
  summary: >-
    End-to-end flow from user intent to Grok response, illustrating the unique real-time X data
    retrieval path and the branching between reasoning (slow) and non-reasoning (fast) modes.
  data:
    nodes:
    - id: user
      label: User intent
      detail: Query entered via web, mobile, voice, or X interface; auto-detected or mode-selected.
      tone: neutral
    - id: router
      label: Auto mode router
      detail: Grok Auto selects reasoning depth; simple queries route to non-reasoning, complex to Think.
      tone: neutral
    - id: search
      label: DeepSearch / live retrieval
      detail: >-
        Web search, X social search, and link browsing. Unique X data access provides real-time social
        signals unavailable to competing APIs.
      tone: positive
    - id: reason
      label: Reasoning engine (Think/Heavy)
      detail: >-
        Chain-of-thought RL reasoning; Grok 4 Heavy runs parallel agent instances for highest-difficulty
        tasks. Can take up to ~10 minutes for Grok 4 Heavy on hard tasks.
      tone: positive
    - id: tools
      label: Tool execution (code, browser, file)
