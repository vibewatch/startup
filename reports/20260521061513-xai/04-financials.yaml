  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-and-gross-margin
      missingEvidence: >-
        xAI has disclosed no 2025 or 2026 revenue figure, no gross margin by product line, and no COGS breakdown. The only
        public revenue proxy is TechCrunch's ~$100M ARR estimate from December 2024, which is unconfirmed and 18 months stale.
      whyItMatters: >-
        Without current revenue and gross margin data, the financial model for xAI rests entirely on pricing proxies and
        third-party estimates. Capital returns depend on the bridge from infrastructure investment to sustainable unit
        economics, which cannot be assessed publicly.
      diligencePath: >-
        Request current TTM revenue by channel (API, consumer subscriptions, enterprise, government), COGS waterfall, and
        gross margin by product surface from xAI management.
      relatedQuestionRefs:
        - QI003
        - QI015
        - QI016
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: material
      topic: cash-burn-and-runway
      missingEvidence: >-
        xAI has disclosed no cash on hand, monthly burn, quarterly cash bridge, or debt covenant package. Given the $17B
        in known debt and massive capex obligations, cash adequacy is the largest liquidity risk that cannot be assessed
        from public evidence.
      whyItMatters: >-
        A company with $37B in cumulative equity raises and $5B in new secured debt may still face material liquidity
        pressure if capex deployment is front-loaded and revenue ramp is slow.
      diligencePath: >-
        Request monthly treasury dashboard, quarterly burn by category (infrastructure, headcount, debt service, research),
        and runway under base and high-capex scenarios.
      relatedQuestionRefs:
        - QI017
        - QI019
        - QI020
      relatedTableRefs:
        - TI004
        - TI005
    - type: private-evidence-only
      severity: material
      topic: x-consolidated-financials
      missingEvidence: >-
        xAI acquired X in March 2025 in an all-stock deal but has not published consolidated financial statements covering
        the combined entity. X advertising revenue, X operating costs, and intercompany Grok distribution economics are all
        private.
      whyItMatters: >-
        Two businesses with very different margin profiles (AI model services versus social media advertising) are now
        consolidated without public disclosure, making it impossible to assess the blended economics of the combined entity.
      diligencePath: >-
        Request audited or management-reviewed consolidated P&L and balance sheet for xAI + X; note advertising revenue
        trend and X operating cost structure since the 2022 Twitter acquisition.
      relatedQuestionRefs:
        - QI023
        - QI026
      relatedTableRefs:
        - TI005
    - type: private-evidence-only
      severity: minor
      topic: debt-terms
      missingEvidence: >-
        The interest rate, maturity, covenant package, collateral, and cross-default provisions for the $5B secured notes
        and term loans raised in July 2025 have not been disclosed. X legacy debt terms (approximately $12B) are also
        unknown in the post-acquisition context.
      whyItMatters: >-
        Hidden covenant triggers, material adverse change clauses, or high-interest fixed costs could affect xAI's
        financial flexibility during periods of lower revenue or high capex.
      diligencePath: >-
        Request note purchase agreement, full debt covenant package, interest coverage ratio, and debt maturity schedule for
        all outstanding obligations.
      relatedQuestionRefs:
        - QI020
        - QI026
      relatedTableRefs:
        - TI004
    - type: missing-source
      severity: minor
      topic: consumer-subscription-pricing
      missingEvidence: >-
        xAI's consumer Grok subscription pricing (SuperGrok, Grok Pro) was not accessible from the grok.com/pricing URL
        at access date; x.ai/grok does not publish subscription tier pricing. The consumer ARPU and subscriber economics
        cannot be assessed from public sources.
      whyItMatters: >-
        Consumer subscriptions are a key revenue stream that could represent significant scale given 38M Grok standalone
        MAU, but without pricing and conversion rates the revenue estimate remains ungrounded.
      diligencePath: >-
        Access grok.com subscription pricing page in a logged-in browser context or obtain pricing from xAI; cross-check
        against SuperGrok pricing on the iOS/Android app stores.
      relatedQuestionRefs:
        - QI002
        - QI008
      relatedTableRefs:
        - TI002
