figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      xAI routes customer activity through three monetization surfaces into a gross revenue pool, but compute cost
      intensity and private cost data prevent any reliable gross-profit estimate from public evidence.
    data:
      nodes:
        - id: consumer
          label: Consumer subscriptions
          detail: Grok app and X Premium subscriptions; subscriber count and ARPU undisclosed.
          tone: neutral
        - id: api
          label: Developer API tokens
          detail: Usage-based token pricing; grok-4.3 at $1.25/$2.50 per 1M tokens is the public anchor.
          tone: positive
        - id: enterprise
          label: Enterprise contracts
          detail: Contact-sales enterprise API; compliance table stakes visible; pricing opaque.
          tone: neutral
        - id: government
          label: Government channel
          detail: OneGov $0.42 introductory price; FedRAMP upgrade path stated but unconverted revenue untracked.
          tone: neutral
        - id: compute-lease
          label: Colossus compute lease
          detail: Anthropic partnership at Colossus I reported; no pricing or revenue contribution disclosed.
          tone: neutral
        - id: gross
          label: Gross revenue pool
          detail: All five streams contribute; mix is entirely private.
          tone: neutral
        - id: costs
          label: Inference + training compute
          detail: 1M+ H100 equivalents, power, hardware depreciation; cost per token not disclosed.
          tone: warning
        - id: x-costs
          label: X operating cost base
          detail: Combined X social-media cost structure added via all-stock merger; not consolidated publicly.
          tone: warning
        - id: retained
          label: Retained gross profit
          detail: Cannot be estimated without COGS data; margin quality is a complete diligence gap.
          tone: negative
      edges:
        - from: consumer
          to: gross
