company:
  name: xAI
chapter:
  number: 4
  title: Financials
  summary: |-
    xAI's financial picture as of May 2026 is characterized by extraordinary capital access and extraordinary capital expenditure, with almost no public evidence on realized revenue, gross margin, or operating burn. The company has raised approximately $37 billion in equity across Series B through E plus $5 billion in secured debt, and the March 2025 all-stock acquisition of X added roughly $12 billion of legacy social-network debt. Infrastructure commitments are massive—over one million H100-equivalent GPUs, two operating data centers, a $659 million permit for a new building, and a stated target of 2 gigawatts of compute power—implying GPU and construction capex on the order of tens of billions of dollars before depreciation and operating costs. The clearest public financial evidence is API token list pricing: grok-4.3 at $1.25 input and $2.50 output per million tokens. A third-party estimate from TechCrunch at the time of the Series C round placed xAI's annual revenue at roughly $100 million as of late 2024, but no 2025 or 2026 figure has been publicly disclosed. Revenue quality, gross margin, subscriber economics, enterprise contract terms, cash burn, and runway all remain private. The OneGov government deal ($0.42 per federal agency for 18 months) is a market-entry relationship-building play, not a meaningful revenue source. The financial verdict is that xAI is a capital-formation machine at extraordinary scale, but the bridge from infrastructure investment to sustainable unit economics has not been disclosed and cannot be underwritten from public data alone.

sections:
  - id: revenue-model-and-public-traction
    title: 'Revenue model and public traction: three monetization rails, limited yield visibility'
    body: |-
      xAI's publicly disclosed business model now rests on three monetization rails: consumer subscriptions through the Grok application and X platform, usage-based developer API access, and an emerging government and enterprise channel. None of these rails comes with disclosed revenue, subscriber counts, or yield data.

      The developer API is the most transparent monetization surface because xAI publishes explicit list pricing. As of May 2026, grok-4.3 is priced at $1.25 per million input tokens and $2.50 per million output tokens against a one-million-token context window. The API page also shows voice API pricing at $3.00 per hour for agent usage, $15.00 per million characters for text-to-speech, and $0.10 per hour for speech-to-text. Image generation pricing exists separately. This token pricing positions xAI as a price-competitive option relative to Anthropic's Opus tier but closer to mid-tier than premium in the managed-API market. The key underwriting gap is that API list prices are not API revenue: volume, mix, batch discounts, enterprise rate schedules, and realized yield are all private. The x.ai/api page advertises OpenAI and Anthropic SDK compatibility to reduce migration friction, and the enterprise section lists SOC 2 Type 2, GDPR, CCPA, Zero Data Retention, SSO, audit logging, role-based access control, and data residency as table-stakes compliance features—consistent with enterprise ambitions but without disclosed enterprise contract economics.

      Consumer monetization flows primarily through Grok application subscriptions (SuperGrok and related tiers) and indirectly through X Premium, which packages Grok access. The x.ai/grok/government page and the Series E post together report approximately 600 million monthly active users across X and Grok as of January 2026. That headline is more reach metric than revenue signal: it conflates legacy X social-network users with paying Grok subscribers, and xAI has not disclosed how many of those 600 million pay, at what tier, or what ARPU looks like. The best-available third-party revenue proxy is TechCrunch's December 2024 Series C reporting, which stated that the investments and products had driven xAI's revenue to approximately $100 million a year at that time—a medium-confidence estimate referencing pre-Series-C trailing revenue, now at least 18 months stale, and not confirmed by xAI.

      The government channel, established via the September 2025 GSA OneGov agreement, gives every federal department, agency, or bureau access to Grok 4 and Grok 4 Fast for a nominal $0.42 for an 18-month term valid through March 2027. xAI commits dedicated Grok Engineers to agencies and offers an upgrade path to FedRAMP and DoD Impact Level–aligned enterprise subscriptions. The $0.42 price is commercially immaterial as a revenue source; its financial value lies in the enterprise and government-scale subscription upgrades it is designed to unlock, not in the introductory fee itself. Revenue from those upgrades has not been disclosed and may not materialize until post-2027 contracting cycles.
