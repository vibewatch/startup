  - id: comparable-companies-valuation-multiples
    title: Comparable companies and valuation multiples
    body: >-
      The primary comparable set for xAI is the cohort of frontier-AI private companies plus
      a secondary set of public AI-adjacent infrastructure and software companies. Three
      limitations apply to every comp in this chapter: private valuations are mark-to-round,
      not mark-to-market; no frontier AI private company other than OpenAI has disclosed
      confirmed trailing revenue; and the AI private market repriced so rapidly in 2025 that
      multiples from the prior year are partially stale.


      OpenAI is the most relevant private comparable. CNBC reported in March 2026 that OpenAI
      closed a record $122 billion funding round at an $852 billion post-money valuation, and
      separately confirmed that OpenAI generated $13.1 billion in revenue in 2025 and is now
      running at approximately $24 billion in annualized revenue. That implies an OpenAI trailing
      revenue multiple of roughly 65x ($852 billion divided by $13.1 billion 2025 revenue) and
      a forward multiple of approximately 35x ($852 billion divided by ~$24 billion run-rate
      revenue). OpenAI's October 2025 secondary share sale had already set the $500 billion
      mark; the March 2026 round accelerated it to $852 billion alongside confirmed commercial
      traction. At OpenAI's current multiples, xAI at $230 billion would require approximately
      $3.5 billion in trailing revenue (at 65x) or approximately $6.6 billion in forward ARR
      (at 35x)—neither figure is supported by any public evidence.


      Anthropic is the second-most comparable private lab. CNBC reported in November 2025 that
      Anthropic reached a valuation in the range of $350 billion following investment from
      Microsoft and NVIDIA. Anthropic's revenue is not publicly confirmed, but analyst estimates
      cited in market reporting place it meaningfully below OpenAI's, making Anthropic's per-
      dollar-of-revenue multiple likely higher than OpenAI's 65x—suggesting the frontier AI
      cohort trades at very high forward-looking multiples even for the revenue leaders.


      Forge Global's private-market index provides a useful secondary-market reference. The
      CNBC/Forge reporting from September 2025 placed secondary-market marks at: OpenAI $324
      billion, Anthropic $178 billion, xAI $90 billion, Databricks $100 billion, SpaceX $456
      billion, Stripe $92 billion, and Anduril $53 billion. The xAI Forge mark of $90 billion
      (September 2025) versus the $230 billion January 2026 reference implies xAI's round-price
      outran secondary-market clearing by more than 2.5x in under four months—a pattern
      consistent with aggressive round-price discovery in a high-demand market.


      Among public infrastructure comps, Cerebras Systems IPO'd on Nasdaq on May 14, 2026, with
      shares opening at approximately 89% above the offering price of $185, implying a market
      cap of approximately $95 billion at first-day trading—the largest US tech IPO since Uber
      in 2019. CoreWeave, an AI infrastructure company that went public in March 2025, is now
      valued at more than $58 billion in the public market. These infrastructure public comps
      trade at significant premiums to traditional data-center operators but well below the
      frontier-model valuations, suggesting the market is assigning distinct pricing tiers to
      compute infrastructure (CoreWeave, Cerebras) versus model-plus-distribution companies
      (OpenAI, Anthropic, xAI).


      Anduril Industries, a defense-AI company, doubled its valuation to above $60 billion in
      May 2026 based on continuing defense-tech momentum. While not a direct model-company
      comparable, it illustrates how AI-adjacent private companies with government contracts
      are receiving premium marks across sectors, reinforcing the view that the AI private
      market is in a broad repricing cycle.
