        - xAI publishing audited financials or prospectus-grade disclosure
      - - Anti-thesis
        - Valuation premium vs. peers — at OpenAI's 65x trailing multiple, $230B requires ~$3.5B
          revenue; no public evidence approaches this level
        - CNBC OpenAI $852B round; $13.1B revenue disclosed
        - Confirmed revenue data from xAI showing ARR above $3B
      - - Anti-thesis
