  - id: TV005
    title: Thesis-break and kill-trigger table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Clean Air Act enforcement ruling
        - Court order restricting operation of more than 10 gas turbines at Colossus 2, or
          financial penalties exceeding $100M, or forced BACT installation imposed by court
        - Directly reduces Colossus compute capacity available for training and inference,
          increasing marginal cost and slowing product cadence; also signals future permitting
          risk at any third site
        - Immediately re-evaluate compute-as-moat thesis; model revenue impact of reduced
          utilization; demand mitigation plan from company
      - - CSAM / content-safety regulatory action
        - Binding prohibition on consumer Grok deployment in the EU, UK, India, or France, or
          mandatory algorithmic audit with prior approval requirement imposed in any major market
        - Removes consumer revenue in affected markets; severely damages enterprise and
          government sales cycles globally; may trigger X advertiser exodus
        - Treat as thesis-break; reassess probability of consumer and enterprise revenue
          scenarios; demand full regulatory status update
      - - Revenue disclosure below $1B ARR
        - xAI releases or leaks any revenue figure below $1B ARR for 2025 or full-year 2026
        - At OpenAI's 35x forward multiple, $1B ARR implies a fair value of ~$35B—an 85%+
          discount to the $230B Series E price; below $500M ARR implies an effective down-round
          scenario
        - Immediately re-evaluate position at Series E mark; block any additional secondary
          purchases until revenue trajectory confirmed
      - - Elon Musk departure or major distraction
        - Musk publicly steps back from xAI CEO role, or takes on new obligations (e.g., full-
          time government role) that substantively reduce time allocation to xAI
        - Removes the key-person who is simultaneously fundraiser, vision-setter, technical
          integrator, and X operator; board/governance vacuum with no publicly named successor
        - Flag immediately as key-person risk realization; demand board succession plan and
          interim leadership disclosure
      - - Formal down-round or failed next raise
        - Next xAI financing closes at or below $150B valuation, or a planned raise is
          abandoned due to investor reluctance
        - Signals that institutional appetite for the $230B mark has eroded; down-round pricing
          implies dilution for Series E holders and raises going-concern questions for the debt
        - Reassess all financial scenarios; treat as strong bear-case signal; demand full capital
          structure update
      - - NVIDIA supply disruption or export control escalation
        - US government restricts NVIDIA H100/H200 availability to xAI or any US AI company
          at scale, or China-Taiwan tension interrupts TSMC capacity for AI accelerators
        - Colossus expansion plans stalled; xAI's competitive differentiation on compute erodes
          as relative GPU availability equalizes
        - Monitor NVIDIA earnings and export control policy monthly; include in standard
          geopolitical risk monitoring
    notes: >-
      Triggers and thresholds are constructed from public evidence and are intended as
      observable monitoring criteria. None of these triggers has fired as of the run date
      (2026-05-21), though the CAA lawsuit and CSAM investigations are active events.
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV043
      - CV044

  - id: TV006
    title: Final diligence asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Revenue and ARR
        - xAI 2024 full-year, 2025 full-year, and current ARR by revenue stream (consumer, API,
          enterprise, government, external compute)
        - Without revenue, no revenue multiple can be computed and all scenario analysis is
          directional at best; this is the single most important gap
        - Request directly from xAI CFO; demand audited P&L as a condition of any term sheet
      - - Gross Margin and Unit Economics
        - Gross margin by product segment; cost-of-inference data; GPU depreciation schedule;
          power cost per token
        - Infrastructure-heavy AI companies with sub-50% gross margins have fundamentally
          different valuation frameworks from software companies; this determines whether
          OpenAI's multiple is a fair comp
        - Request from xAI finance team; verify against NVIDIA invoice data if possible
      - - Cash Position and Burn Rate
        - Cash and equivalents post-Series-E; monthly operating burn; runway at current burn
        - $37B raised does not imply liquidity — capex obligations and debt service could
          have consumed a significant portion; burn rate determines conviction in Series E
          "sufficient for years" narrative
        - Request from xAI CFO; cross-check with known GPU procurement and construction permits
      - - Capital Structure and Preference Stack
        - Full cap table with share class rights, liquidation preferences, anti-dilution, and
          debt covenant terms; X legacy debt structure and covenant package
        - $17B in debt plus unknown preference stack may substantially reduce common-equity
          value at $230B enterprise value; need to understand waterfall
        - Obtain from legal counsel; request cap-table model from company; review $5B secured
          note terms
      - - Customer Count and Concentration
        - Paying customer count by segment; top 10 customer revenue share; enterprise contract
          sizes; NRR; OneGov upgrade conversion rate
        - Revenue quality depends on customer diversification; high concentration plus high
          churn is a structural risk; NRR is the clearest signal of enterprise product-market
          fit
        - Conduct reference checks with known API and enterprise customers; request from xAI
          sales leadership
      - - Content-Safety and Regulatory Status
        - Current status of CSAM investigations in EU, UK, India, Malaysia, France; xAI's
          remediation commitments; FedRAMP audit progress; SOC 2 Type 2 report availability
        - Active regulatory investigations in five jurisdictions create binary risk events that
          can materially impair enterprise and government revenue channels
        - Obtain through legal counsel; direct regulatory inquiry in each jurisdiction; request
          FedRAMP authorization letter and timeline
    notes: >-
      These are the six gaps that most directly affect the valuation judgment. None can be
      resolved from public sources as of the run date. Prioritize revenue, margin, and
      capital structure before advancing a term sheet.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV040
      - CV041
      - CV042

