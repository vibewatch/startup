  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: >-
        xAI 2025 full-year and current ARR, broken out by revenue stream (API, consumer
        subscriptions, enterprise, government, external compute). The only public estimate
        ($100M, late 2024) is unconfirmed and stale.
      whyItMatters: >-
        Revenue is the primary input into any revenue-multiple valuation framework. Without
        confirmed revenue, the $230 billion valuation cannot be benchmarked against any
        publicly defensible multiple, and all scenario analysis remains directional.
      diligencePath: >-
        Request audited P&L from xAI as a condition of any term sheet; require quarterly
        cadence; compare against API list pricing and disclosed model volumes.
      relatedQuestionRefs:
        - QV003
        - QV031

    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: >-
        xAI gross margin by segment, cost-of-inference per token, GPU depreciation schedule,
        and power cost per compute unit. None of this data is publicly available.
      whyItMatters: >-
        Infrastructure-heavy AI companies may have sub-50% gross margins, fundamentally
        different from software-native AI peers; this determines whether OpenAI's multiple
        is an appropriate comp or whether a hardware-adjusted discount applies.
      diligencePath: >-
        Request from xAI finance team; model from known GPU procurement costs and API pricing
        volumes if granular usage data is provided.
      relatedQuestionRefs:
        - QV008

    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: >-
        Full cap table with share class rights, liquidation preferences, anti-dilution
        provisions, and $5B secured note covenant terms; X legacy debt structure and maturity.
      whyItMatters: >-
        The preference stack and debt covenants directly determine what equity waterfall
        is available to common investors at the $230B enterprise value; without this data,
        equity fair value cannot be assessed.
      diligencePath: >-
        Obtain from legal counsel; request cap-table model from company; review secured
        note term sheet as part of diligence package.
      relatedQuestionRefs:
        - QV033

    - type: missing-source
      severity: material
      topic: Anthropic-revenue
      missingEvidence: >-
        Anthropic's confirmed 2025 revenue or ARR, which would allow calculation of a
        trailing revenue multiple for the second-most-relevant comparable.
      whyItMatters: >-
        If Anthropic's revenue multiple is materially higher or lower than OpenAI's, it
        changes the implied comp range for xAI valuation and could shift the base-case range.
      diligencePath: >-
        Monitor Anthropic IPO prep documents and investor disclosures; check for any
        public financial disclosure in regulatory filings in any jurisdiction.
      relatedQuestionRefs:
        - QV005

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Paying customer count by segment, top-10 customer revenue share, enterprise contract
        sizes, net revenue retention, and OneGov upgrade conversion rate.
      whyItMatters: >-
        High customer concentration or low NRR would be structural quality risks that reduce
        the sustainable revenue multiple even if headline ARR appears adequate.
      diligencePath: >-
        Conduct reference checks with known API enterprise customers; request CRM data
        summary from sales leadership as part of diligence.
      relatedQuestionRefs:
        - QV025

    - type: missing-source
      severity: material
      topic: investor-thesis-documentation
      missingEvidence: >-
        No publicly available investor communications, term-sheet memos, or analyst reports
        that explicitly articulate the valuation thesis behind the $230B mark. xAI's Series
        E was closed without any published investor letter or LP disclosure.
      whyItMatters: >-
        Understanding what growth and margin assumptions underpin the $230B mark is necessary
        to validate whether the price is grounded in achievable fundamentals or primarily
        reflects strategic option pricing and FOMO.
      diligencePath: >-
        Request board observer rights or LP side letters from lead investors; review any
        existing fairness opinions from investment banks involved in the round.
      relatedQuestionRefs:
        - QV013

    - type: missing-source
      severity: material
      topic: CoreWeave-infrastructure-comparables
      missingEvidence: >-
        CoreWeave has not publicly disclosed its per-GPU count, revenue, or margin profile
        as a newly public company; its EV/compute multiple relative to xAI's Colossus
        cluster cannot be calculated without this data.
      whyItMatters: >-
        CoreWeave is the closest publicly traded pure-play compute-infrastructure comp for
        xAI's Colossus cluster; its implied per-GPU valuation would set a hard reference
        for the hardware-floor scenario in any bear-case analysis.
      diligencePath: >-
        Monitor CoreWeave S-1 follow-on disclosures and quarterly earnings releases for
        infrastructure metrics; model from available GPU lease pricing data.
      relatedQuestionRefs:
        - QV017

    - type: missing-source
      severity: material
      topic: exit-pathways
      missingEvidence: >-
        No secondary-market purchase agreement terms, tender-offer history, or IPO
        registration timeline has been disclosed by xAI. The only public liquidity
        signal is the January 2026 Series E structure itself.
      whyItMatters: >-
        Series E investors at $230B face a structurally illiquid position; exit timing,
        secondary-market liquidity, and IPO optionality are unknown, and NVCA data confirms
        the 2025 exit environment was less than one-third the 2021 peak.
      diligencePath: >-
        Negotiate lock-up duration, secondary-sale rights, and drag-along provisions during
        any term-sheet negotiation; track IPO prep signals such as auditor retention
        and underwriter mandates.
      relatedQuestionRefs:
        - QV026
      relatedTableRefs:
        - TV004

    - type: missing-source
      severity: material
      topic: frontier-AI-market-share-projection
      missingEvidence: >-
        OpenAI's projected $280B revenue by 2030 is the only publicly quantified frontier-AI
        TAM proxy, but xAI's share of that market is entirely unquantified; no analyst has
        published a bottom-up market-share model for xAI's API vs. consumer vs. enterprise
        vs. compute segments.
      whyItMatters: >-
        Without a market-share model, the bull-case revenue scenario for xAI cannot be
        independently validated, and the OpenAI-derived multiple anchor may not transfer.
      diligencePath: >-
        Commission independent market-share analysis; compare xAI API token volume to
        available benchmarks from Artificial Analysis and other AI model tracking services.
      relatedQuestionRefs:
        - QV032

