      whyItMatters: >-
        The current pool proves adoption mainly through store, membership, and
        geography cohorts; without named customer proof, it is hard to test reference
        quality, production-vs-pilot status, or whether a few channels or customer
        groups drive disproportionate revenue.
      diligencePath: >-
        Request IPO / DRHP customer tables, Gold renewal cohorts, top-channel
        contribution, and three referenceable customer interviews split across India
