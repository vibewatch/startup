  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        Named end-customer case studies, independent review cohorts, or disclosed
        enterprise / channel concentration tables that tie deployment, renewal, and
