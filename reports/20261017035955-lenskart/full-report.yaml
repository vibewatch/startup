  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public evidence points to a six-layer omnichannel operating stack rather than a standalone software product.
    data:
      layers:
        - label: Digital discovery
          detail: Website and app surfaces drive browse, shortlist, and order intent before or alongside store visits.
          modules:
            - label: Website
              context: Product browse and purchase entry
            - label: Mobile app
              context: Discovery surface with large installed base
            - label: Virtual try-on
              context: Remote fit-confidence tool
        - label: Vision testing
          detail: Prescription capture is part of the product, not an external prerequisite.
          modules:
            - label: Home Eye Check-up
              context: At-home testing and convenience
            - label: Store eye test
              context: In-person prescription workflow
            - label: Certified refractionists
              context: Human service layer
        - label: Conversion and consultation
          detail: Physical stores and home trials reduce trial friction and support channel handoff.
          modules:
            - label: COCO stores
              context: Controlled customer experience
            - label: FOFO stores
              context: Faster market expansion
            - label: Try Frames @ Home
              context: Pre-purchase physical validation
        - label: Order orchestration and AI
          detail: Management describes shared inventory/CRM logic plus remote optometry and routing intelligence.
          modules:
            - label: Shared channel data
              context: Unified online-offline operations
            - label: Facial-recognition recommendations
              context: Personalization layer
            - label: Routing intelligence
              context: Next-day delivery in 67 cities
        - label: Manufacturing and fulfillment
          detail: Owned production and regional hubs are used to control quality, cost, and delivery speed.
          modules:
            - label: Robotic lens assembly
              context: Precision and quality-control claim
            - label: Bhiwadi and Gurugram facilities
              context: Current India production base
            - label: Singapore and UAE hubs
              context: Regional support nodes
        - label: Portfolio expansion
          detail: International brands and forward programs extend the stack beyond India's original eyewear core.
          modules:
            - label: Owndays
              context: Japan and Southeast Asia footprint
            - label: Meller
              context: Fashion sunglasses brand layer
            - label: Smart glasses and AI self-eye-testing
              context: Roadmap items, not yet evidenced as scaled products
