        title: Milestones, current readthrough, and open risks
        blocks:
          - type: paragraph
            body: >-
              The milestone arc is coherent: legal incorporation, online launch, offline rollout, acquisition-led
              international expansion, larger private funding rounds, then IPO execution. What matters for later
              chapters is not just the chronology but the risk signal embedded in it. The company is now large enough
