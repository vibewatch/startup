      - number: '2.3'
        title: Buyer, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a consumer-led purchase journey rather than an insurer- or employer-funded
              one. Buyers and users are typically the same individual, while payment appears to be mostly household
              out-of-pocket spending, with premiumization and multi-pair behavior emerging only after vision correction
              is already normalized. The adoption path starts with awareness and diagnosis, then moves through frame and
              lens selection, fitting, and fulfillment; this is why omnichannel workflows, remote optometry, and
              proximity-led store rollout matter so much. Management's FY26 operating commentary suggests that first eye
              exams and smaller-city stores are still creating new category demand, which implies the near-term growth
              ceiling is constrained less by headline market size than by how cheaply the company can discover, educate,
              test, and serve the next cohort of users.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
      - number: '2.4'
        title: Drivers, constraints, and confidence in the sizing story
        blocks:
          - type: paragraph
            body: >-
              Several drivers support continued adoption: rising discretionary consumption, growing middle-income
              households, greater social acceptance of eyewear as a lifestyle purchase, and operating models that blend
              digital discovery with neighborhood service. The main constraints are equally clear. Public independent
              commentary still frames the category as under-penetrated but warns that conversion from need to profitable
              demand depends on store economics, supply-chain execution, premiumization, and consumer resilience in a
              discretionary retail environment. Confidence is further limited by evidence quality: the most detailed
              India-specific market numbers in the assigned pool come from a company-hosted Redseer report and
              management commentary, while public segment-level payer mix, reimbursement exposure, and a fully
              independent TAM/SAM/SOM bridge are not disclosed. Lenskart's investor-relations surface improves the
              refresh cadence of company-issued material, but it does not eliminate the need for independent market
              validation.
            claimRefs:
              - CM006
              - CM013
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set is broader than organized chains alone
        blocks:
          - type: paragraph
            body: |
              The core competitive set spans direct organized chains, acquired or owned regional banners,
              local optical stores, and the status-quo substitute of buying eyewear through fragmented offline
              channels rather than through a scaled omnichannel brand. Altius' market map frames Titan Eye Plus
              as the nearest named incumbent in organized retail, while Specsmakers and Vision Express remain
              meaningful regional or premium alternatives rather than equal-scale national challengers. At the
              same time, MarkHub's industry review and the Redseer-hosted industry report both imply that the
              larger battle is still against unorganized optical retail: local shops historically dominated the
              category, and organized retail's share in India was only about one-third in 2024. That matters for
              valuation because Lenskart is competing both for share against chains and for category migration out
              of legacy buying behavior.
            claimRefs:
