      - number: '1.3'
        title: Scale, funding, and public-market transition
        blocks:
          - type: paragraph
            body: >-
              Lenskart’s public-market transition sits on top of already meaningful operating scale. The independent
              FY25 IPO review reports 2,723 global stores, while the February 2026 shareholder letter pushes the
              operating snapshot forward to 2,439 India stores and 705 international stores after 9M FY26 expansion.
              Independent write-ups tied to the FY2025 annual report also report ₹66.5 billion of revenue and ₹2.97
              billion of profit after tax, indicating the business reached accounting profitability before or around
              listing. On capital formation, the evidence stack is directionally strong but not perfectly harmonized:
              the Altius deck describes roughly $1.8 billion raised historically, Wikipedia records a $200 million June
              2024 secondary at a $5 billion valuation, and the IPO review frames the 2025 public offer as a ₹7,278
              crore transaction with a large offer-for-sale component that reduced, but did not eliminate, founder
              ownership.
