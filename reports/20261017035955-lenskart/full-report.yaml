      - number: '5.3'
        title: Differentiation, controls, and product-tech risks
        blocks:
          - type: paragraph
            body: >-
              Lenskart's public moat looks operational first and software-enabled second: stores reduce trial friction,
              owned manufacturing supports price/quality control, and shared digital systems connect the channels.
              Independent sources consistently describe that full-stack combination as the key differentiator versus
              fragmented opticians or more limited organized rivals. The main diligence issue is not whether Lenskart
              has product surfaces; it is whether the harder-to-value technical and control layers are documented
              strongly enough. Current public sources show stale consumer copy on store scale, basic trust promises such
              as returns and warranty, and meaningful disclosed execution risks around franchise conflict, cluster
              concentration, cyber/factory disruption, and compliance. The assigned pool does not verify
              privacy/security architecture, external developer adoption, or rollout metrics for the roadmap programs
              that management frames as long-term bets.
            claimRefs:
