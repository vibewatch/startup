        title: Leadership, governance, and stakeholder perimeter
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence still points to a founder-centric operating structure. Peyush Bansal remains the
              dominant public executive voice: he appears as founder and CEO in independent profiles, and he authors the
              shareholder letter that frames operating performance and strategy. Amit Chaudhary and Sumeet Kapahi still
              appear in public founder narratives as the operations and technology counterparts, while Neha Bansal is
              named on the corporate history page but not clearly surfaced in current executive-role materials inside
              this worker pool. Governance breadth is harder to verify than leadership concentration. The
              investor-relations page confirms a large multinational subsidiary perimeter, including Owndays, Neso
              Brands, Meller-related Stellio entities, and multiple Southeast Asia and Middle East entities, but the
              current board, committee composition, and independent-director mix are not directly supported in the
              assigned pool and remain a diligence gap.
