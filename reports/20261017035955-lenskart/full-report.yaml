  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a retail-plus-membership revenue model rather than a pure software-style
              recurring-revenue story. Independent IPO summaries put FY25 revenue at roughly ₹6,652-6,653 crore with
              profit after tax around ₹297 crore, and the shareholder letter shows that momentum accelerated into Q3
              FY26 with 37.4% YoY revenue growth and a 20.0% EBITDA margin. The core monetization engine still starts
              with eye tests and eyewear units sold through stores, app, and web, but management is also layering a
              meaningful repeat element on top through Gold membership fees and repeat purchases. That matters because
              the public data suggest Lenskart can create demand at the service layer first, then monetize it through
              product mix upgrades and retention, rather than depending only on blunt list-price increases.
            claimRefs:
              - CI001
              - CI004
