  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the status-quo substitute
        blocks:
          - type: paragraph
            body: >-
              The relevant market is broader than online glasses retail and narrower than general fashion accessories.
              Public sources in the assigned pool consistently place Lenskart inside an integrated eyewear workflow that
              spans prescription eyeglasses, sunglasses, contact lenses, eye testing, and omnichannel fulfillment. That
              matters because the status-quo substitute is not another app; it is the fragmented offline optician
              channel that still dominates much of the category and often separates diagnosis, frame choice, lens
              customization, and after-sales service. In that context, organized players win not just on price but on
              standardization, better diagnostics, and more reliable fulfillment. The growth debate is therefore less
              about whether consumers need eyewear and more about how fast a historically unorganized market shifts
              toward trusted, repeatable, branded purchase journeys.
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM012
              - CM015
      - number: '2.2'
        title: Sizing the opportunity with need, channel, and rollout lenses
        blocks:
          - type: paragraph
            body: >-
              The cleanest public sizing lens is still unmet vision-correction need rather than a disclosed wallet-share
              model. In the company-hosted Redseer report, India shows a very large population with refractive errors, a
              much smaller population already wearing prescription eyewear, and a large residual group that still needs
              correction. Management then layers a commercialization lens on top of that need-based market, arguing that
              eye tests, digitally influenced demand, and dense neighborhood stores expand the addressable market
              instead of merely reallocating existing customers. A second lens is channel formalization: organized
              retail still represents a minority of the prescription-eyewear market and the online channel remains
              early, which supports long runway arguments but also means execution quality, supply chain consistency,
              and local trust remain central to conversion. A third lens is physical rollout capacity, where management
              claims thousands of additional stores remain possible, especially outside metros.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
