  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Lenskart's path runs from 2008 incorporation through omnichannel scale-up, private funding, IPO execution, and
      2026 public-company operating updates.
    data:
      items:
        - date: '2008-05-19'
          label: Legal incorporation as Valyoo Technologies
          detail: >-
            Lenskart's corporate history and secondary references anchor legal origin in 2008 under the Valyoo
            Technologies name.
          tone: neutral
          claimRefs:
            - CO002
        - date: '2010'
          label: India online operations begin
          detail: >-
            The company says it commenced operations in India as an online business in 2010, which is the
            commercial-launch date often reused in public storytelling.
          tone: positive
          claimRefs:
            - CO003
            - CO016
        - date: '2013'
          label: First retail store opens in New Delhi
          detail: >-
            The official history places the first offline retail store in New Delhi in 2013, establishing the
            omnichannel pivot.
          tone: positive
          claimRefs:
            - CO003
        - date: '2022-06-30'
          label: Owndays majority acquisition announced
          detail: >-
            Wikipedia says Lenskart announced the acquisition of a majority stake in Owndays in a deal that materially
            expanded its international perimeter.
          tone: positive
          claimRefs:
            - CO013
        - date: 2023-03
          label: ADIA-backed scale funding phase
          detail: Public secondary summaries describe ADIA as a major investor during the late private scaling phase.
          tone: positive
          claimRefs:
            - CO008
        - date: 2024-06
          label: Secondary deal resets valuation marker
          detail: Wikipedia records a $200 million Temasek and Fidelity secondary transaction at a $5 billion valuation.
          tone: neutral
          claimRefs:
            - CO009
        - date: 2024-10 / 2025-01
          label: Franchise-owner allegations surface
          detail: >-
            Wikipedia summarizes franchise-owner allegations filed in Karnataka in October 2024 and a later stay on the
            probe in January 2025.
          tone: risk
          claimRefs:
            - CO014
        - date: 2025-10 / 2025-11
          label: IPO launched and listed
          detail: >-
