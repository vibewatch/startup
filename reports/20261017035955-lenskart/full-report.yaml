chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Lenskart now presents as a listed eyewear company rather than only a late-stage private startup. The
              strongest official surface is the February 2026 shareholder letter, which identifies the company as
              Lenskart Solutions Limited with NSE and BSE tickers and corporate offices in Gurugram and New Delhi.
              Across official and independent sources, the core model is consistent: Lenskart combines design,
              manufacturing, distribution, online storefronts, mobile apps, and physical retail into a vertically
              integrated omnichannel eyewear business. The company’s own corporate history anchors the legal origin in
              2008, then places the commercial operating launch in 2010 and the first retail store in 2013, which is the
              chronology later chapters should reuse rather than a simplified “founded in 2010” line.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO016
