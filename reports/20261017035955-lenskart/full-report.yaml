      - CE006
      - CE009
      - CE011
      - CE015
  - id: FU001
    title: Lenskart customer journey and expansion loop
    type: journey-map
    summary: >-
      The model compounds when digital discovery, eye testing, store trust, Gold membership, and premium / international
      expansion reinforce one another.
    data:
      items:
        - label: Digital discovery
          actor: First-time or lapsed shopper
          channels:
            - Search and social
            - App and website
          touchpoints:
            - Ad or search discovery often starts the journey before any store visit.
            - A meaningful share of sales is digitally influenced rather than purely walk-in.
          tone: neutral
        - label: Vision need capture
          actor: First-time vision-correction customer
          channels:
            - Store eye test
            - Remote optometry
            - Home eye check
          touchpoints:
            - 5.5 million eye tests in Q3 FY26.
            - 49% of those tests were first-time exams.
            - Remote optometry eye exams grew 330% YoY.
          tone: positive
        - label: Trial and trust
          actor: Prescription buyer
          channels:
            - Physical store
            - Home try-on
          touchpoints:
            - Store fitting and eye testing reduce prescription and style friction.
            - Management says "no store nearby" is the main survey reason for not purchasing.
          tone: opportunity
        - label: Purchase and fulfilment
          actor: Buyer / payer
          channels:
            - Store POS
            - Web / app checkout
            - Delivery network
          touchpoints:
            - Stores act as experience centers and order-booking engines.
            - Over 45% of transactions are digitally influenced.
            - Next-day delivery in 40 Indian cities and 3-day delivery in 69 others.
          tone: neutral
        - label: Membership and repeat
          actor: Existing customer
          channels:
            - Gold membership
            - Reminders and reorder prompts
          touchpoints:
            - 8.1 million active Gold members at Q3 FY26 end.
            - 37% of Q3 sales came from Gold members acquired before the quarter.
            - The repeat loop benefits from higher service quality and lower acquisition cost.
          tone: positive
        - label: Upgrade and geographic expansion
          actor: Premium or international shopper
          channels:
            - Owndays
            - International stores
            - Localized app / website
          touchpoints:
            - Premium lens offerings reached 38% of Q3 revenue.
            - Singapore reached 69 stores; UAE 23; Saudi Arabia 18.
            - International stores were reported at 705 in 9M FY26.
          tone: opportunity
    claimRefs:
      - CU002
      - CU006
      - CU008
      - CU009
      - CU011
      - CU012
      - CU013
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual exposure is highest where rapid rollout and AI-led scaling intersect with regulated service delivery and
      still-maturing controls.
    data:
      columns:
        - label: Likelihood
          detail: >-
            Probability implied by current pace of expansion, disclosed complexity, and whether the mitigation is
            already operating at scale.
        - label: Impact
          detail: Potential effect on growth quality, service consistency, margin durability, or public-market confidence.
        - label: Mitigation maturity
          detail: Whether public evidence shows the mitigation is already proven, partly implemented, or still being built.
        - label: Residual exposure
          detail: Net severity after considering the currently disclosed mitigation path.
      rows:
        - label: Optometrist capacity and remote-testing quality
          note: >-
            Growth depends on scaling scarce clinical talent and AI-assisted diagnostics without lowering service
            quality.
          values:
            - Medium-high
            - High
            - Developing
            - High
        - label: Manufacturing and business continuity ramp
          note: Hyderabad reduces single-site concentration only after commissioning and ramp are proven.
          values:
            - Medium
            - High
            - Developing
            - High
        - label: Inventory and customization complexity
          note: Prescription products require fragmented assortments, working capital, and high-accuracy fulfillment.
          values:
            - High
            - High
            - Partial
            - High
        - label: Cybersecurity and privacy governance
          note: A first dedicated CISO is still being recruited while AI, payments, and customer data span 18 countries.
          values:
            - Medium
            - High
            - Partial
            - High
        - label: Competitive replication and pricing pressure
          note: Independent commentary says many peers now offer similar value propositions and technology features.
          values:
            - High
            - Medium-high
            - Partial
            - Medium-high
        - label: Valuation sensitivity to execution misses
          note: Premium IPO commentary leaves less room for missed ramp, margin, or capex assumptions.
          values:
            - Medium-high
            - High
            - Partial
            - Medium-high
    approximationNotes: >-
      Heatmap labels are analyst judgments synthesized from the retained evidence rather than company-published risk
      scores.
    claimRefs:
      - CR004
      - CR005
      - CR007
      - CR008
      - CR009
      - CR011
      - CR012
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Execution quality supports interest, but valuation evidence still points to patience.
    data:
      nodes:
        - id: proof
          label: Execution proof
          note: FY25-FY26 evidence shows profitable growth, store expansion, and positive operating cash generation.
        - id: capital
          label: Capital availability
          note: IPO proceeds and cash on hand give Lenskart room to fund stores, manufacturing, and AI.
        - id: moat
          label: Structural moat
          note: Vertical integration and omnichannel reach remain credible advantages.
        - id: premium
          label: Premium valuation
          note: IPO and aftermarket references still point to high sales and earnings multiples.
        - id: gap
          label: Missing price proof
          note: Retained primary sources do not confirm run-date multiple, free float, or lockup terms.
        - id: call
          label: 'Recommendation: track'
          note: Wait for fresher primary valuation support or a better entry price.
      edges:
        - from: proof
          to: capital
          label: supports
        - from: capital
          to: moat
          label: extends
        - from: moat
          to: premium
          label: improves quality, not price
        - from: premium
          to: gap
          label: limits conviction
        - from: gap
          to: call
          label: sets discipline
    approximationNotes: Flow summarizes the retained evidence chain; it does not infer an intrinsic value.
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV008
      - CV011
      - CV016
      - CV017
