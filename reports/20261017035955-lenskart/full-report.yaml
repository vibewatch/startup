      - number: '5.2'
        title: Operating stack, data layer, and deployment model
        blocks:
          - type: paragraph
            body: >-
              The available evidence points to a vertically integrated stack with six practical layers: digital
              discovery, vision testing, store conversion, centralized order orchestration, owned manufacturing, and
              regional/international brand extensions. Company and IPO-linked materials describe Lenskart as designing,
              manufacturing, branding, and retailing eyewear directly, with facilities in India supported by regional
              hubs abroad. The FY26 shareholder letter adds a more explicit AI operating layer than earlier consumer
              copy, citing remote optometry, facial-recognition recommendations, location intelligence, and routing
              intelligence. At the same time, public materials treat AI self-eye-testing, B smart glasses, and the
              Hyderabad facility as investments in progress rather than already-proven production surfaces, so they
              should be underwritten as roadmap items until launch and adoption evidence is provided.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
