      - number: '3.3'
        title: Moat durability is real, but channel conflict and multibrand complexity are live risks
        blocks:
          - type: paragraph
            body: |
              Lenskart is broadening the field it can attack: the shareholder letter describes a dual-brand
              approach in Singapore, and the investor-relations page lists multiple Owndays entities inside the
              corporate perimeter, confirming that management is competing through owned banners rather than a
              single label. Gold membership adds another retention layer, with management saying active members
              reached 8.1 million and that pre-existing members generated 37% of Q3 sales. Those assets raise
              switching costs, but the moat is not cleanly self-reinforcing. MarkHub and Wikipedia both preserve
              evidence of franchise-owner complaints about COCO versus FOFO conflict, and Zerodha's IPO page still
              highlights intense online and offline competition plus continued tech-investment needs as investor
              risks. In practice, Lenskart looks better positioned than most named peers, but not immune to
              self-inflicted channel friction or incumbent responses in premium and regional pockets.
            claimRefs:
