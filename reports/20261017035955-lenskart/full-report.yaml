              - CI016
      - number: '4.3'
        title: Capital needs and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Lenskart does not look cash-starved on the public numbers now available, but it does remain capital
              intensive. Management disclosed 9M FY26 operating cash flow of ₹4,854 million, said it comfortably
              exceeded new-store and upgrade investment, and still reported another ₹2,666 million of plant and other
              capex, mainly for the Hyderabad manufacturing facility. Cash generation therefore appears good enough to
              fund current expansion partially from operations, while the IPO cash buffer and growth-oriented fresh
              issue provide extra headroom. At the same time, independent IPO reviews consistently describe the fresh
              issue as earmarked for stores, leases, technology, manufacturing, and related expansion, which reinforces
              that this is a store-and-supply-chain scaling story, not a business that has already finished its heavy
              investment phase.
            claimRefs:
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: Verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is directionally positive on revenue quality and margin path, but incomplete for
              full underwriting. Lenskart now has visible scale, recurring membership behavior, and disclosed cash
              generation that supports the next leg of rollout. However, the FY25 profit base still needs normalization
              for one-time acquisition-accounting gains, and adverse investor commentary is right to focus on premium
              valuation, lease-heavy store commitments, and the need for sustained execution across domestic expansion
              and international scaling. The public disclosure surface is also uneven: the investor-relations page
              highlights subsidiary financials and announcements, yet investors still do not get the consolidated CAC,
              cohort renewal, working-capital, or lease-adjusted return data that would make sales efficiency and
              capital adequacy fully underwritable.
            claimRefs:
              - CI003
              - CI011
              - CI012
              - CI016
