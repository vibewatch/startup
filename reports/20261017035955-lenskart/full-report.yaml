        title: Differentiation comes from system-level integration, not a single product feature
        blocks:
          - type: paragraph
            body: |
              Lenskart's public materials and third-party summaries point to a stack that rivals have to match
              across store density, manufacturing control, service design, and digital tooling at the same time.
              The February 2026 shareholder letter shows the scale gap: management reported 2,439 India stores
              and 705 international stores, while Altius still described Titan Eye Plus, Specsmakers, and Vision
              Express in much narrower footprints. MarkHub's analysis goes further by arguing that Lenskart's
              vertically integrated supply chain is what makes its buy-one-get-one style value proposition hard to
              copy without compressing rival margins. Strategy Story's FY2025 recap also links growth to continued
              franchise expansion and media spending, indicating that distribution and brand remain active weapons,
