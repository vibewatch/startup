      - number: '4.2'
        title: Margin drivers and unit economics
        blocks:
          - type: paragraph
            body: >-
              The most credible public financial upside is gross-profit expansion from vertical integration, not
              financial engineering. IPO-prep materials show EBITDA margin moving from 6.86% in FY23 to 14.6% in FY25,
              while management says India product margin rose from 58.2% in FY23 to 63.7% by Q3 FY26 and international
              product margin from 70.8% in FY23 to 75.7% in 9M FY26. Company-hosted industry material argues that
              vertically integrated omnichannel operators convert better than pure online or pure offline models, and
              third-party summaries of the offer documents say Lenskart's integrated supply chain let it sell frames and
              lenses in India at average costs 35% to 40% below industry levels in FY25. Those are attractive signals,
              but they still stop short of showing channel CAC, returns, warranty cost, or cohort retention with enough
              detail to underwrite long-run margin durability.
            claimRefs:
              - CI002
              - CI007
              - CI008
              - CI013
              - CI014
              - CI015
