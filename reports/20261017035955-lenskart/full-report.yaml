              - CI006
              - CI015
          - type: callout
            title: Profitability is improving, but quality and fixed-cost exposure still matter
            body: >-
              FY25 profit included a one-time accounting gain, while adverse commentary continues to flag premium
              valuation and lease-heavy expansion as reasons the current margin path could disappoint if execution
              slips.
            calloutType: risk
            claimRefs:
              - CI003
              - CI016
          - type: callout
            title: Underwrite Lenskart as a scaled retail and manufacturing platform, not as SaaS
            body: >-
              The best-supported upside comes from conversion, local manufacturing, and product margin expansion; the
              biggest remaining diligence ask is still channel efficiency and lease-adjusted returns, not top-line
              demand.
            calloutType: recommendation
            claimRefs:
              - CI007
              - CI009
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Omnichannel offer in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Lenskart is solving an eyewear purchase flow that usually needs both diagnosis and physical trial, so its
              product is built as a blended service rather than a pure ecommerce storefront. The public workflow starts
              with website/app discovery, virtual try-on, or home/store eye checks, then moves into frame selection,
              prescription capture, order placement, and after-sales support. That matters because the strongest public
              differentiation is not a single SKU or software feature; it is the company's ability to connect online
              browsing, in-person confidence, and direct fulfillment inside one consumer journey. Official product copy
              still markets home eye check-ups, home trials, returns, and warranties, while independent write-ups
              describe stores as the operating backbone for eye tests, try-ons, and order fulfillment.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
