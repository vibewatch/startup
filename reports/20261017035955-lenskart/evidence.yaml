evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-date-framing
    missingEvidence: >-
      A single current official profile that reconciles 2008 incorporation, 2010 launch, and the exact founder roster in
      one place.
    whyItMatters: Readers and later chapters can otherwise drift between legal-entity origin and commercial-launch dates.
    diligencePath: >-
      Confirm the canonical wording in the latest annual report, DRHP/RHP, or corporate history page used for
      listed-company disclosures.
    relatedQuestionRefs:
      - QO002
  - type: missing-source
    severity: material
    topic: board-composition-and-headcount
    missingEvidence: Current board roster, committee composition, independent-director list, and exact current employee count.
    whyItMatters: >-
      Governance depth and organizational scale affect execution quality, oversight, and the interpretation of founder
      concentration.
    diligencePath: >-
      Pull the latest annual report, corporate governance filing, and shareholder pattern / secretarial disclosures from
      investor relations or exchange filings.
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table coverage
    missingEvidence: A complete, current named leadership roster beyond the public founder set and Peyush Bansal.
    whyItMatters: The table currently proves founder concentration but not the full management bench around it.
    diligencePath: >-
      Add the current annual report leadership pages or governance disclosures before relying on management-depth
      conclusions.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-or-investor-map coverage
    missingEvidence: A current cap table, lock-up summary, and board-rights map for major investors and subsidiaries.
    whyItMatters: The existing map identifies important stakeholders but cannot quantify today's control rights or overhang risks.
    diligencePath: >-
      Use the latest listed-company ownership disclosures, prospectus, and material subsidiary notes to complete the
      map.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: buyer-payer-map
    missingEvidence: >-
      Public disclosure of payer mix, reimbursement exposure, and segment-level revenue split across prescription
      eyewear, sunglasses, and contact lenses.
    whyItMatters: >-
      Without payer-mix evidence, the buyer map is directionally useful but not precise enough to model budget ownership
      or recession sensitivity by segment.
    diligencePath: >-
      Request IPO or investor-day disclosure that breaks demand by product line, city tier, and self-pay versus any
      reimbursed or enterprise-funded channels.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: independent-market-bridge
    missingEvidence: >-
      An independent India eyewear study that uses explicit TAM, SAM, and SOM definitions consistent with the category
      boundary used in this chapter.
    whyItMatters: >-
      The most detailed public sizing numbers in the assigned pool are company-hosted or management-issued, which limits
      confidence in exact market-conversion math.
    diligencePath: >-
      Obtain a current paid third-party category note or expert network call set that recreates India market sizing
      without relying on company-hosted materials.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: rival-pricing
    missingEvidence: Direct current price cards, memberships, and package terms from Titan Eye Plus, Specsmakers, and Vision Express.
    whyItMatters: >-
      Without direct rival pricing pages, the chapter can compare pricing posture but not precise list-price deltas or
      discount mechanics.
    diligencePath: >-
      Retain direct competitor pricing pages or store brochures in a later pass and rebuild the pricing table with exact
      published terms.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: rival-tech-stack
    missingEvidence: Competitor-authored product, app, and service documentation for Titan Eye Plus, Specsmakers, and Vision Express.
    whyItMatters: >-
      The feature matrix currently distinguishes Lenskart clearly, but several rival cells stay unknown because the
      assigned pool did not retain direct technical surfaces.
    diligencePath: >-
      Add direct competitor app, service, and store-experience pages to the search pool so the capability matrix can
      replace unknown cells with sourced facts.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP002
  - type: conflicting-data
    severity: material
    topic: franchise-conflict
    missingEvidence: Court documents, company rebuttals, or settlement records on the COCO versus FOFO dispute.
    whyItMatters: >-
      The retained record shows the dispute exists, but not whether it is isolated, resolved, or symptomatic of broader
      channel-governance weakness.
    diligencePath: Retain primary legal filings or company disclosures that update the status of the franchise-owner allegations.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Channel-level CAC, repeat rate, LTV, and payback by online, store, and Gold cohorts.
    whyItMatters: >-
      Public growth and margin data look strong, but they do not reveal whether incremental customer acquisition is
      getting more or less efficient.
    diligencePath: >-
      Request cohort economics by acquisition channel and city tier, including paid media, store acquisition, and Gold
      renewal cohorts.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: working-capital-and-liquidity
    missingEvidence: Consolidated working-capital days, debt maturities, supplier terms, and lease obligations by geography.
    whyItMatters: >-
      Cash flow looks healthy in aggregate, but balance-sheet timing and fixed commitments determine how resilient
      expansion funding really is.
    diligencePath: >-
      Request the post-IPO treasury pack with debt schedules, lease schedule, inventory turns, receivable days, and
      payable days by major geography.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-discounts
    missingEvidence: List-price ladders, realized ASP by category, discount incidence, and return or warranty cost by product line.
    whyItMatters: >-
      The public evidence shows mix-driven monetization, but not whether pricing power survives promotion, returns, and
      service costs.
    diligencePath: >-
      Request SKU-level pricing waterfalls for frames, lenses, premium upgrades, and Gold-linked offers across major
      channels.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: security-and-developer-signal
    missingEvidence: >-
      Public trust-center, privacy or security documentation, API or integration docs, repos, or practitioner-community
      signal tied to Lenskart's stack.
    whyItMatters: >-
      The public evidence verifies consumer features and operating scale, but it does not show how much proprietary
      software depth or security maturity sits underneath those claims.
    diligencePath: >-
      Request trust/privacy pages, certifications, public docs or repos, package telemetry, or practitioner references
      for store software, routing, remote optometry, and smart-glasses programs.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: roadmap-readiness
    missingEvidence: >-
      Launch milestones, certification status, pilot KPIs, and commercialization timing for AI self-eye-testing, B smart
      glasses, and the Hyderabad facility.
    whyItMatters: >-
      Management presents these programs as future differentiators, but the assigned evidence does not prove current
      readiness, adoption, or the time to revenue contribution.
    diligencePath: >-
      Ask management for dated launch plans, approval status, pilot outcomes, production-capacity plans, and capex
      milestone tracking for each program.
    relatedQuestionRefs:
      - QE004
      - QE005
  - type: missing-source
    severity: material
    topic: service-reliability
    missingEvidence: >-
      Channel-level uptime, prescription remake or error rates, delivery SLA attainment, refund rates, and
      support-resolution metrics by market.
    whyItMatters: >-
      Omnichannel convenience is central to the product thesis, but public sources do not reveal whether the operating
      stack is dependable at the service level.
    diligencePath: >-
      Request ops-dashboard extracts for delivery OTIF, remakes, refund rate, prescription rework, and ticket-resolution
      performance by channel and geography.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named end-customer case studies, independent review cohorts, or disclosed enterprise / channel concentration
      tables that tie deployment, renewal, and outcomes to specific customers.
    whyItMatters: >-
      The current pool proves adoption mainly through store, membership, and geography cohorts; without named customer
      proof, it is hard to test reference quality, production-vs-pilot status, or whether a few channels or customer
      groups drive disproportionate revenue.
    diligencePath: >-
      Request IPO / DRHP customer tables, Gold renewal cohorts, top-channel contribution, and three referenceable
      customer interviews split across India value, India premium, and one international market.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Public disclosure of GRR, NRR, churn, renewal rates, top-customer or top-channel share, and cohort retention by
      geography or membership tier.
    whyItMatters: >-
      Without concentration and retention denominators, the durability of repeat revenue and the downside from channel
      or geography underperformance remain management assertions rather than independently testable facts.
    diligencePath: >-
      Obtain board or IPO diligence packs with monthly cohort retention, Gold renewal curves, and revenue concentration
      by store format, city tier, and international market.
  - type: missing-source
    severity: material
    topic: litigation-and-enforcement
    missingEvidence: >-
      Direct court, regulator, or incident-reporting sources confirming whether Lenskart faces active litigation, fines,
      privacy complaints, or security incidents beyond what the assigned pool surfaced.
    whyItMatters: >-
      The risks chapter can rank governance exposure, but it cannot cleanly distinguish a control buildout from an
      already-material unresolved incident without direct adverse evidence.
    diligencePath: >-
      Pull the DRHP litigation and risk-factor sections, check court and regulator dockets in India and key overseas
      markets, and request the company's incident and claims history.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: service-quality-and-automation
    missingEvidence: >-
      Store-level prescription redo rates, automated-claim override rates, complaint volumes, and warranty-return
      cohorts by geography.
    whyItMatters: >-
      These metrics would show whether remote optometry and AI service automation are scaling quality, not just
      throughput.
    diligencePath: >-
      Request monthly QA dashboards, NPS decomposition, customer-escalation logs, and post-dispense remake data by
      market and channel.
    relatedQuestionRefs:
      - QR003
      - QR004
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-concentration-and-rollout-returns
    missingEvidence: Franchise concentration, supplier-spend concentration, JV economics, and store-payback by cohort or geography.
    whyItMatters: >-
      Public materials show aggressive rollout and partner dependence, but not whether unit returns remain robust as the
      footprint broadens.
    diligencePath: >-
      Request top-supplier and top-franchisee concentration, store cohort payback, capex hurdle rates, and JV governance
      rights.
    relatedQuestionRefs:
      - QR005
      - QR006
      - QR007
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: ownership-overhang
    missingEvidence: >-
      Current shareholding pattern, free-float math, and any lockup or staged-sell terms for SoftBank and other major
      holders.
    whyItMatters: Overhang can matter as much as operating momentum when a premium-valued stock is already public.
    diligencePath: >-
      Pull the latest exchange shareholding pattern, IPO lockup disclosures, and investor-relations updates covering
      large holder liquidity.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: run-date-multiple
    missingEvidence: Primary run-date market cap, fully diluted share count, and forward revenue or earnings consensus.
    whyItMatters: Without a fresh multiple, the recommendation can only be directional rather than price-specific.
    diligencePath: >-
      Refresh market-data and consensus inputs from exchange filings, current quotes, and management guidance before
      capital deployment.
    relatedQuestionRefs:
      - QV002
      - QV008
  - type: private-evidence-only
    severity: material
    topic: new-cohort-payback
    missingEvidence: >-
      Store-level payback and unit-economics disclosure for newer Tier 2/3 cohorts, smart-glasses efforts, and Hyderabad
      capex.
    whyItMatters: >-
      The premium multiple assumes these investments will keep compounding returns instead of merely increasing
      complexity.
    diligencePath: >-
      Request management or banker materials with cohort economics, capex return hurdles, and milestone KPIs for AI and
      premium initiatives.
    relatedQuestionRefs:
      - QV003
      - QV008
