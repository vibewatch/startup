company:
  name: "Lenskart"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Lenskart looks like a high-quality public retailer with verified FY25-FY26
    profitability, positive operating cash generation, and continuing investment
    in stores, manufacturing, and AI. The harder question is price: retained
    public references still frame the stock and IPO around premium sales and
    earnings multiples, while current run-date market multiples and ownership
    overhang are not confirmed in primary materials. I therefore land at
    track, with medium confidence and a stretched valuation stance until either
    primary valuation evidence improves or the entry price becomes more
    forgiving.
sections:
  - id: "investment-view"
    title: "Investment view: quality is real, but the entry still looks premium"
    body: >-
      The evidence supports a strong underlying business but not an obviously
      cheap security. Official materials show Lenskart entered FY26 with strong
      operating cash generation, cash on hand including IPO proceeds, and a
      still-accelerating store rollout, while independent summaries describe a
      vertically integrated model that has carried profitability higher through
      FY25 and FY26. That operating proof matters. The constraint is valuation:
      retained public references still describe the IPO and aftermarket as rich,
      with premium sales and earnings multiples and little room for execution
      misses. Because retained primary sources do not pin down the exact
      run-date trading multiple, I would not chase the stock purely on business
      quality; the discipline is to track it and upgrade only if valuation
      support catches up.
    claimRefs: ["CV001", "CV002", "CV006", "CV007", "CV008", "CV011", "CV012", "CV017"]
    tableRefs: ["TV001"]
    figureRefs: ["FV001"]
  - id: "financing-and-valuation-context"
    title: "Financing and valuation context"
    body: >-
      Public evidence is enough to frame the financing story even if it is not
      enough to underwrite a precise target price. The shareholder letter says
      Lenskart ended December 2025 with substantial cash including IPO
      proceeds, and the investor-relations page now carries FY2026 subsidiary
      financials and announcements across the listed group, which lowers the
      governance discount versus a still-private company. Independent sources
      provide milestone anchors rather than a clean present-value answer: a
      pre-IPO private mark around $6.1 billion, an IPO around Rs. 70,000-72,700
      crore, and a later sell-side target implying further upside if execution
      continues. Those anchors are directionally useful, but they are not a
      substitute for refreshed primary trading data, current shareholding, and
      lockup disclosure.
    claimRefs: ["CV002", "CV007", "CV009", "CV010", "CV013", "CV014", "CV016"]
    tableRefs: ["TV002"]
  - id: "scenario-framing"
    title: "Bull, base, and bear framing"
    body: >-
      The bull case is straightforward: Lenskart keeps compounding store
      density, uses cash flow to fund expansion, and converts vertical
      integration plus AI investments into durable margin gains and higher
      market share. The base case is less exciting but more investable: growth
      and profitability stay healthy, yet the stock only works if investors
      avoid overpaying for that quality. The bear case is also clear in the
      retained evidence: a premium multiple can compress quickly if store
      productivity, international execution, or smart-glasses and manufacturing
      payback disappoint. Because the public evidence set is stronger on
      business momentum than on precise current pricing, scenario discipline is
      more defensible than a single-point target.
    claimRefs: ["CV003", "CV004", "CV006", "CV008", "CV009", "CV012", "CV015", "CV017"]
    tableRefs: ["TV003"]
  - id: "diligence-asks-and-kill-criteria"
    title: "Final diligence asks and thesis-break triggers"
    body: >-
      The remaining work is mostly valuation diligence, not business-model
      discovery. Before upgrading from track to buy, I would want primary
      confirmation of the current trading multiple, the post-IPO free float,
      and lockup or secondary-overhang terms for major holders such as
      SoftBank. I would also want cleaner evidence on payback in newer India
      cohorts and on the returns expected from AI hardware, smart glasses, and
      the Hyderabad capacity build-out. The thesis breaks if Lenskart stops
      turning store growth into cash generation, if international or premium
      expansion weakens margins, or if the stock continues to command a premium
      multiple without matching growth and earnings delivery.
    claimRefs: ["CV001", "CV002", "CV004", "CV013", "CV014", "CV016", "CV017"]
callouts:
  - calloutType: "recommendation"
    title: "Recommendation: track"
    body: >-
      The company-quality case is investable, but the retained evidence does
      not yet prove a mispriced entry. Wait for fresher primary valuation data
      or a more forgiving multiple before moving to buy.
    claimRefs: ["CV002", "CV007", "CV008", "CV016", "CV017"]
  - calloutType: "assumption"
    title: "Upgrade trigger"
    body: >-
      I would upgrade if primary market data show the multiple has compressed
      into line with sustained FY26-FY27 growth and if ownership-overhang risk
      is clarified without a large new secondary supply shock.
    claimRefs: ["CV006", "CV009", "CV013", "CV016"]
