      - ["FY25 and FY26 public summaries show Lenskart has crossed into sustained profitability and positive operating cash generation.", "Thesis", "A profitable, cash-generative retailer deserves a smaller execution discount than a cash-burning consumer-tech listing.", "If cash generation no longer funds expansion, the quality premium should compress."]
      - ["IPO and aftermarket references still imply rich sales and earnings multiples.", "Anti-thesis", "Premium valuation means even a strong company can be a weak investment if bought at the wrong price.", "A lower multiple or stronger primary disclosure on forward earnings would improve entry support."]
      - ["Retained primary sources do not confirm current trading multiple, free float, or major-holder overhang.", "Anti-thesis", "Without those inputs, valuation confidence is materially lower than business-model confidence.", "Latest exchange filings or IR disclosures that close those gaps would make the recommendation more actionable."]
    notes: "Table separates business-quality support from price-discipline constraints; it is not a full cap-table or model build."
    claimRefs: ["CV006", "CV007", "CV008", "CV011", "CV012", "CV016", "CV017"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation / return logic"
      - "Key risks"
      - "Probability signal"
    rows:
      - ["Bull", "Store density, premium mix, and AI-led service improvements keep revenue and EBITDA compounding above market expectations.", "Premium valuation sustains because earnings catch up quickly enough to justify the price paid.", "Execution misstep in international markets or slower payback from AI and manufacturing capex.", "Would require repeated evidence of margin expansion plus clean ownership and liquidity disclosures."]
      - ["Base", "Healthy growth continues, but the business matures into a high-quality retailer rather than an open-ended hyper-growth platform.", "Returns depend more on entry discipline and moderate multiple support than on heroic rerating.", "Paying too much up front can erase solid operating progress.", "Most consistent with retained evidence: strong company, still price sensitive."]
      - ["Bear", "Growth or margins slow while public-market expectations stay elevated.", "Multiple compression outweighs operating delivery and investors experience mediocre or negative returns.", "Store productivity, discretionary demand, or global rollout disappoints.", "More likely if current premium valuation persists without fresh primary support."]
      - ["Upgrade trigger", "Run-date exchange data and ownership disclosures show a cleaner multiple and manageable secondary overhang.", "Valuation case improves because investors can underwrite both entry price and liquidity risk with confidence.", "Disclosure remains incomplete or reveals larger future selling pressure.", "Needs primary evidence, not just third-party summaries."]
      - ["Downgrade trigger", "Cash generation weakens relative to store and capex expansion or premium ambitions fail to convert into earnings.", "Valuation support breaks because the premium no longer rests on visible operating leverage.", "Multiple compression compounds an operational slowdown.", "Would be signaled by weaker cash conversion, margin slippage, or more cautious external valuation commentary."]
    notes: "Milestone anchors come from retained private-round, IPO, and post-IPO public references rather than a full DCF or peer-sheet."
