figures:
  - id: FM001
    title: Commercialization constraints inside India's eyewear opportunity
    type: pyramid
    summary: >-
      The public sizing story narrows from a very large need-based population to smaller
      channel and rollout layers that organized players still need to capture.
    data:
      items:
        - label: India population
          value: 1454
          unit: mn people
          note: FY2025 population base used in the company-hosted Redseer report.
        - label: Population with refractive errors
          value: 777
          unit: mn people
          note: India estimate for people needing prescription correction in FY2025.
        - label: Uncorrected refractive-error population
          value: 503
          unit: mn people
          note: People with refractive errors but without prescription eyeglasses in FY2025.
        - label: Current prescription-eyewear users
          value: 274
          unit: mn people
          note: Population already wearing prescription eyeglasses in India in FY2025.
        - label: Organized retail share
          value: 23
          unit: "%"
          note: Approximate share of India's prescription-eyeglasses retail sales handled by organized players in FY2025.
        - label: Additional India store potential
          value: 4500
          unit: stores
          note: Management's GeoIQ-based estimate of further India store white space.
    approximationNotes: >-
      The first four layers are population counts, the fifth is a channel-share constraint, and
      the final layer is management's store-rollout estimate; the pyramid is therefore an
      ordered commercialization lens rather than a same-unit funnel.
    claimRefs: [CM003, CM004, CM005, CM010]
