  - id: FI001
    title: 从客户活动到现金生成的公开运营桥接
    type: flow
    summary: 公开披露显示，一条由服务驱动的漏斗从验光和留存延伸至收入增长、利润率扩张和经营现金流；但由于公司没有发布统一的客户群瀑布图，这条桥接由不同报告期拼接而成。
    data:
      nodes:
        - id: eye-tests
          label: 验光
          value: 6.3
          unit: million
          summary: Q3 FY26 tests conducted
          note: 其中 49% 是首次验光。
        - id: purchase-conversion
          label: 购买转化
          value: 60
          unit: '%'
          summary: Approximate company-cited conversion from eye test to purchase
          note: 基于调查的背景信息，并非已披露的经审计季度 KPI。
        - id: gold-members
          label: Gold 会员
          value: 8.1
          unit: million members
          summary: Active members at Q3 FY26 end
          note: 既有 Gold 会员贡献了第三季度销售额的 37%。
        - id: prior-gold-sales
          label: 既有会员销售
          value: 37
          unit: '%'
          summary: Q3 FY26 sales from Gold members acquired before the quarter
          note: 管理层报告的留存信号，并非已披露的续费客户群。
        - id: revenue-growth
          label: 收入增长
          value: 37.4
          unit: '%'
          summary: Q3 FY26 year-over-year growth
          note: 管理层报告的合并口径增长。
        - id: ebitda-margin
          label: EBITDA 利润率
          value: 20
          unit: '%'
          summary: Q3 FY26 consolidated margin
          note: 从上年同期的 14.5% 扩大。
        - id: operating-cash-flow
          label: 经营现金流
          value: 4854
          unit: ₹ million
          summary: 9M FY26 operating cash flow
          note: 占 EBITDA 的 75%（适用 IndAS 116 之前）。
    approximationNotes: 这是一条公开运营桥接，不是单一期间的经审计漏斗：公司没有发布覆盖图中每个节点、且处于同一期间的客户到现金瀑布。
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI009
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据指向一个六层全渠道运营栈，而非独立的软件产品。
    data:
      layers:
        - label: 数字化发现
          detail: 网站和 App 界面在到店前或到店同时推动浏览、筛选和下单意向。
          modules:
            - label: 网站
              context: Product browse and purchase entry
            - label: 移动 App
              context: Discovery surface with large installed base
            - label: 虚拟试戴
              context: Remote fit-confidence tool
        - label: 视力检测
          detail: 处方采集就是产品的一部分，而非外部前置条件。
          modules:
            - label: Home Eye Check-up
              context: At-home testing and convenience
            - label: 门店验光
              context: In-person prescription workflow
            - label: 持证验光师
              context: Human service layer
        - label: 转化与咨询
          detail: 线下门店和上门试戴降低试用摩擦，并支持渠道衔接。
          modules:
            - label: COCO 门店
              context: Controlled customer experience
            - label: FOFO 门店
              context: Faster market expansion
            - label: Try Frames @ Home
              context: Pre-purchase physical validation
        - label: 订单编排与 AI
          detail: 管理层描述了共享库存 / CRM 逻辑，以及远程验光和路由智能。
          modules:
            - label: 共享渠道数据
              context: Unified online-offline operations
            - label: 人脸识别推荐
              context: Personalization layer
            - label: 路由智能
              context: Next-day delivery in 67 cities
        - label: 制造与履约
          detail: 自有生产和区域枢纽用于控制质量、成本和交付速度。
          modules:
            - label: 机器人镜片组装
              context: Precision and quality-control claim
            - label: Bhiwadi 和 Gurugram 设施
              context: Current India production base
            - label: 新加坡和阿联酋枢纽
              context: Regional support nodes
        - label: 产品组合扩张
          detail: 国际品牌和前瞻项目将这一运营栈延伸至印度原有眼镜核心业务之外。
          modules:
            - label: Owndays
              context: Japan and Southeast Asia footprint
            - label: Meller
              context: Fashion sunglasses brand layer
            - label: 智能眼镜和 AI 自助验光
              context: Roadmap items, not yet evidenced as scaled products
    claimRefs:
      - CE001
      - CE006
      - CE009
      - CE011
      - CE015
  - id: FU001
    title: Lenskart 客户旅程与扩张闭环
    type: journey-map
    summary: 数字化发现、验光、门店信任、Gold 会员以及高端化 / 国际扩张相互强化时，这一模式会不断复利。
    data:
      items:
        - label: 数字化发现
          actor: 首次购物者或流失后回访者
          channels:
            - 搜索和社交媒体
            - App 和网站
          touchpoints:
            - 广告或搜索发现往往在到店前启动旅程。
            - 相当一部分销售受到数字渠道影响，而非完全来自进店客流。
          tone: neutral
        - label: 捕捉视力需求
          actor: 首次视力矫正客户
          channels:
            - 门店验光
            - 远程验光
            - 上门视力检查
          touchpoints:
            - FY26 第三季度完成 550 万次验光。
            - 其中 49% 是首次验光。
            - 远程验光次数同比增长 330%。
          tone: positive
        - label: 试戴与信任
          actor: 处方眼镜购买者
          channels:
            - 线下门店
            - 上门试戴
          touchpoints:
            - 门店配镜和验光降低处方与款式选择的摩擦。
            - 管理层称，“附近没有门店”是调查中不购买的主要原因。
          tone: opportunity
        - label: 购买与履约
          actor: 买家 / 付款人
          channels:
            - 门店 POS
            - 网站 / App 结账
            - 配送网络
          touchpoints:
            - 门店既是体验中心，也是订单承接引擎。
            - 超过 45% 的交易受到数字渠道影响。
            - 印度 40 个城市次日送达，另有 69 个城市 3 日送达。
          tone: neutral
        - label: 会员与复购
          actor: 既有客户
          channels:
            - Gold 会员
            - 提醒与复购提示
          touchpoints:
            - FY26 第三季度末有 810 万名活跃 Gold 会员。
            - 第三季度销售额的 37% 来自本季度前已获取的 Gold 会员。
            - 更高的服务质量和更低的获客成本共同推动复购闭环。
          tone: positive
        - label: 升级与地域扩张
          actor: 高端或国际客户
          channels:
            - Owndays
            - 国际门店
            - 本地化 App / 网站
          touchpoints:
            - 高端镜片产品贡献第三季度收入的 38%。
            - 新加坡达到 69 家门店；阿联酋 23 家；沙特阿拉伯 18 家。
            - 9M FY26 国际门店数量为 705 家。
          tone: opportunity
    claimRefs:
      - CU002
      - CU006
      - CU008
      - CU009
      - CU011
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 快速扩张和 AI 驱动的规模化，与受监管的服务交付及仍在成熟的控制措施相交之处，剩余风险暴露最高。
    data:
      columns:
        - label: 可能性
          detail: 当前扩张速度、已披露的复杂度，以及缓释措施是否已规模化运行所隐含的概率。
        - label: 影响
          detail: 对增长质量、服务一致性、利润率持久性或公开市场信心的潜在影响。
        - label: 缓释成熟度
          detail: 公开证据是否显示缓释措施已经得到验证、部分落地，或仍在建设中。
        - label: 剩余暴露
          detail: 考虑当前已披露的缓释路径后的净严重性。
      rows:
        - label: 验光师产能与远程检测质量
          note: 增长依赖于扩大稀缺临床人才和 AI 辅助诊断的规模，同时不能降低服务质量。
          values:
            - 中高
            - 高
            - 发展中
            - 高
        - label: 制造与业务连续性爬坡
          note: 只有在海得拉巴设施完成投产且爬坡得到验证后，才能降低单一地点集中度。
          values:
            - 中
            - 高
            - 发展中
            - 高
        - label: 库存与定制复杂度
          note: 处方产品需要分散的品类组合、营运资金和高准确度履约。
          values:
            - 高
            - 高
            - 部分
            - 高
        - label: 网络安全与隐私治理
          note: 公司仍在招聘首位专职 CISO，而 AI、支付和客户数据覆盖 18 个国家。
          values:
            - 中
            - 高
            - 部分
            - 高
        - label: 竞争复制与定价压力
          note: 独立评论称，许多同行如今提供相似的价值主张和技术功能。
          values:
            - 高
            - 中高
            - 部分
            - 中高
        - label: 估值对执行失误的敏感度
          note: IPO 高溢价评论意味着爬坡、利润率或资本开支假设失误的容错空间更小。
          values:
            - 中高
            - 高
            - 部分
            - 中高
    approximationNotes: 热力图标签是分析师基于保留证据综合得出的判断，而非公司发布的风险评分。
    claimRefs:
      - CR004
      - CR005
      - CR007
      - CR008
      - CR009
      - CR011
      - CR012
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 执行质量支持继续关注，但估值证据仍指向耐心等待。
    data:
      nodes:
        - id: proof
          label: 执行证明
          note: FY25–FY26 证据显示公司实现盈利增长、门店扩张，并产生正经营现金流。
        - id: capital
          label: 资本可用性
          note: IPO 募资和手头现金让 Lenskart 有空间为门店、制造和 AI 提供资金。
        - id: moat
          label: 结构性护城河
          note: 垂直整合与全渠道覆盖仍是可信优势。
        - id: premium
          label: 高估值
          note: IPO 和上市后市场的参考资料仍指向较高的销售额与盈利倍数。
        - id: gap
          label: 缺乏价格依据
          note: 保留的主要来源无法确认运行日估值倍数、自由流通股比例或锁定期条款。
        - id: call
          label: 建议：持续跟踪
          note: 等待更新的一级估值依据，或更好的入场价格。
      edges:
        - from: proof
          to: capital
          label: 支持
        - from: capital
          to: moat
          label: 延伸
        - from: moat
          to: premium
          label: 提升质量，而非价格
        - from: premium
          to: gap
          label: 限制判断信心
        - from: gap
          to: call
          label: 设定纪律
    approximationNotes: 该流程总结保留的证据链，不推断内在价值。
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV008
      - CV011
      - CV016
      - CV017
