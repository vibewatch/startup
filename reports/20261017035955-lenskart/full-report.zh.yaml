        blocks:
          - type: paragraph
            body: >-
              最可信的公开财务上行来自垂直整合带来的毛利扩张，而不是财务工程。IPO 准备材料显示 EBITDA 利润率从 FY23 的 6.86% 升至 FY25 的 14.6%；管理层称印度产品利润率从 FY23 的
              58.2% 升至 FY26 第三季度的 63.7%，国际产品利润率则从 FY23 的 70.8% 升至 9M FY26 的
              75.7%。公司提供的行业材料认为，垂直整合的全渠道运营商比纯线上或纯线下模式转化更好；发行文件的第三方摘要称，Lenskart 的整合供应链让其 FY25 在印度销售镜架和镜片的平均成本比行业水平低 35% 至
              40%。这些信号很有吸引力，但仍不足以判断长期利润率是否稳固，因为渠道 CAC、退货、保修成本或 cohort 留存尚未以足够细节披露。
            claimRefs:
              - CI002
              - CI007
              - CI008
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI014
              - CI016
      - number: '4.3'
        title: 资本需求与融资依赖
        blocks:
          - type: paragraph
            body: >-
              以目前可得的公开数字看，Lenskart 并不像缺现金，但仍然是资本密集型公司。管理层披露 9M FY26 经营现金流为 ₹4,854 million，称其足以轻松覆盖新店和升级投入，同时仍发生了 ₹2,666
              million 的厂房及其他资本开支，主要用于 Hyderabad 制造工厂。因此，现金生成似乎足以让当前扩张部分靠经营自筹，而 IPO 现金缓冲和面向增长的新发行又提供了额外余量。但独立 IPO
              评述一致称，新发行所得将用于门店、租赁、技术、制造及相关扩张，这再次说明公司仍处于门店和供应链扩张阶段，而不是已经完成重投资的成熟业务。
            claimRefs:
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: 结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              财务结论对收入质量和利润率路径总体偏正面，但还不足以完成全面投资判断。Lenskart 已具备可见规模、持续性会员行为和披露的现金生成能力，支持下一阶段铺店。然而，FY25
              利润仍需剔除一次性收购会计收益后再看；不利的投资者评论也有理由聚焦高端估值、租赁密集型门店承诺，以及国内扩张和国际规模化所需的持续执行。公开披露也不均衡：投资者关系页面强调子公司财务和公告，但投资者仍拿不到合并口径的
              CAC、cohort 续费、营运资本或租赁调整后回报数据，无法完整判断销售效率和资本充足性。
            claimRefs:
              - CI003
              - CI011
              - CI012
              - CI016
      - number: '4.5'
        title: 议题
        blocks:
          - type: callout
            title: 会员改善收入质量，但没有让模式变成订阅制
            body: Gold 会员带来经常性费用和复购需求，但经济引擎仍依赖产品销售、门店执行以及镜片或品牌组合，而不是签约的软件式续费收入。
            calloutType: insight
            claimRefs:
              - CI005
              - CI006
              - CI015
          - type: callout
            title: 盈利能力改善，但质量和固定成本敞口仍重要
            body: FY25 利润包含一次性会计收益；不利评论仍将高端估值和租赁密集型扩张列为风险，若执行滑坡，当前利润率路径可能令人失望。
            calloutType: risk
            claimRefs:
              - CI003
              - CI016
          - type: callout
            title: 应把 Lenskart 按规模化零售和制造平台评估，而非 SaaS
            body: 证据最充分的上行来自转化、本地制造和产品利润率扩张；最大的剩余尽调问题仍是渠道效率和租赁调整后回报，而不是营收需求。
            calloutType: recommendation
            claimRefs:
