      - number: '3.3'
        title: 护城河仍在，但渠道冲突和多品牌复杂度是现实风险
        blocks:
          - type: paragraph
            body: >
              Lenskart 正在扩大可进攻的领域：股东信描述了其在新加坡采用双品牌策略，投资者关系页面则列出公司范围内多家 Owndays 实体，确认管理层是通过自有品牌而非单一标签竞争。Gold
              会员又增加了一层留存，管理层称活跃会员达到 8.1 million，且既有会员贡献了 Q3 销售额的 37%。这些资产提高了转换成本，但护城河并非干净地自我强化。MarkHub 和 Wikipedia
              都保留了加盟商关于 COCO 与 FOFO 冲突的证据，Zerodha 的 IPO 页面也将激烈的线上线下竞争和持续技术投入需求列为投资风险。实际上，Lenskart
              的位置好于多数知名同行，但仍不能免受自我造成的渠道摩擦，或高端及区域市场中 incumbent 的反击。
            claimRefs:
              - CP003
              - CP004
              - CP012
              - CP014
              - CP015
