      - number: '3.2'
        title: 差异化来自系统整合，而非单一产品功能
        blocks:
          - type: paragraph
            body: >
              Lenskart 的公开材料和第三方摘要指向一套竞争对手必须同时追赶的体系：门店密度、制造控制、服务设计和数字工具。2026 年 2 月股东信显示了规模差距：管理层报告 2,439 家印度门店和 705
              家国际门店，而 Altius 对 Titan Eye Plus、Specsmakers 和 Vision Express 的描述覆盖范围窄得多。MarkHub 的分析更进一步，认为 Lenskart
              的垂直整合供应链让其买一送一式价值主张难以复制，否则竞争对手利润率会被压缩。Strategy Story 的 FY2025 回顾还将增长与持续加盟扩张和媒体投入联系起来，说明分销和品牌仍是主动武器，而非遗留优势。
