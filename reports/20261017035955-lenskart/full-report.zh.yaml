      - number: '1.4'
        title: 里程碑、当前解读与开放风险
        blocks:
          - type: paragraph
            body: >-
              里程碑脉络清晰：法律设立、线上上线、线下铺开、通过收购进行国际扩张、更大规模的私募融资，随后执行
              IPO。对后续章节而言，重要的不只是时间顺序，还有其中的风险信号。公司如今已大到公开市场估值预期与绝对增速同样重要；独立 IPO
              评述明确指出，发行估值几乎没有给执行失误留下空间。同时，证据池包含一个具体的不利运营 / 治理信号：Wikipedia 总结了 2024
              年加盟商关于收入差异和滥用会计软件的指控，之后法院作出暂缓处理。这本身不足以推翻投资论点，但足以作为渠道冲突和治理纪律的观察事项带入风险与客户章节。
