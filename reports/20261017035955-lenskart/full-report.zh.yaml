          tone: positive
          claimRefs:
            - CO013
        - date: 2023-03
          label: ADIA 支持的规模化融资阶段
          detail: 公开二手摘要将 ADIA 描述为后期私募规模化阶段的主要投资者。
          tone: positive
          claimRefs:
            - CO008
        - date: 2024-06
          label: 老股交易重设估值锚点
