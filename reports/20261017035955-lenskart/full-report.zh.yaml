      - number: '1.3'
        title: 规模、融资与公开市场转型
        blocks:
          - type: paragraph
            body: >-
              Lenskart 的公开市场转型建立在已经相当可观的经营规模之上。独立 FY25 IPO 评述称公司拥有 2,723 家全球门店；2026 年 2 月股东信则将经营快照推进至 9M FY26 扩张后的 2,439
              家印度门店和 705 家国际门店。围绕 FY2025 年报的独立文章还报告营收 ₹66.5 billion、净利润 ₹2.97
              billion，说明公司在上市前或上市前后已实现会计盈利。资本形成方面，证据方向较强但并不完全统一：Altius 演示稿称历史累计融资约 $1.8 billion，Wikipedia 记录 2024 年 6 月以
              $5 billion 估值完成 $200 million 老股交易，IPO 评述则将 2025 年公开发行描述为 ₹7,278 crore 的交易，其中大比例为售股，使创始人持股下降但并未消除。
