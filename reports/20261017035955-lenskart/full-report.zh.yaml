      - number: '2.3'
        title: 买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据支持消费者主导的购买路径，而不是保险公司或雇主出资的路径。买方和使用者通常是同一人，付款似乎主要来自家庭自付；在视力矫正普及后，消费升级和多副眼镜行为才开始出现。采用路径从认知和诊断开始，随后进入镜架与镜片选择、试戴和履约；这正是全渠道流程、远程验光和靠近消费者的铺店如此重要的原因。管理层
              FY26 运营评论显示，首次验光和小城市门店仍在创造新的品类需求，意味着近期增长上限与其说受 headline 市场规模限制，不如说取决于公司能以多低的成本发现、教育、检测并服务下一批用户。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
      - number: '2.4'
        title: 驱动因素、约束与规模叙事的可信度
        blocks:
          - type: paragraph
            body: >-
              多项因素支持持续采用：可选消费上升、中等收入家庭增加、眼镜作为生活方式消费的社会接受度提高，以及把数字发现与社区服务结合的运营模式。约束同样清楚。独立公开评论仍把品类描述为渗透率偏低，但警告从需求转化为盈利需求取决于门店经济性、供应链执行、消费升级和可选零售环境下的消费者韧性。证据质量进一步限制了信心：证据池中最详细的印度市场数据来自公司提供的
              Redseer 报告和管理层评论，公开资料没有披露细分层面的付款方组合、报销敞口，也没有完整且独立的 TAM/SAM/SOM 桥接。Lenskart
              的投资者关系页面提高了公司材料的更新频率，但不能替代独立市场验证。
            claimRefs:
              - CM006
              - CM013
              - CM014
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合不只是组织化连锁
        blocks:
          - type: paragraph
            body: >
              核心竞争集合覆盖直接的组织化连锁、已收购或自有的区域品牌、本地眼镜店，以及通过碎片化线下渠道而非规模化全渠道品牌购买眼镜这一现状替代方案。Altius 市场地图把 Titan Eye Plus
              列为组织化零售中最接近的知名在位者，Specsmakers 和 Vision Express 则是有意义的区域或高端替代者，而非同等规模的全国挑战者。同时，MarkHub 行业评述和 Redseer
              提供的行业报告都暗示，更大的战场仍是无组织眼镜零售：本地商店历史上主导该品类，2024 年印度组织化零售份额仅约三分之一。这对估值很重要，因为 Lenskart
              既要和连锁竞争份额，也要争夺从旧有购买习惯转向新渠道的品类迁移。
