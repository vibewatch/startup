          - type: callout
            title: 升级触发器
            body: 如果一级市场数据显示，在 FY26-FY27 增长持续的情况下，倍数已压缩至合理水平，且所有权供给压力得到澄清、没有新的大规模老股供给冲击，我会升级判断。
            calloutType: assumption
            claimRefs:
              - CV006
              - CV009
              - CV013
