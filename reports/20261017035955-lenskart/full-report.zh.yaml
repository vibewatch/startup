              家眼镜店，合格验光师供应有限会推高招聘成本并使地域扩张困难；同一报告还指出，处方眼镜需要碎片化的品类组合和大量营运资本，因此规模化库存、质量和履约仍是现实挑战。管理层的应对是远程验光、供应链自动化和第二座工厂，但这些缓释措施本身也高度依赖执行。依赖风险还超出内部运营：Lenskart
