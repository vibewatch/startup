  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 论点
      - 类型
      - 当前重要性
      - 哪些事实会改变观点
    rows:
      - - 纵向整合、自有制造和全渠道分销仍是实质性的结构性优势。
        - 正向论点
        - 它们支持价格控制、提高毛利捕获，并比分散的眼镜店提供更快服务。
        - 若出现利润率下滑或服务经济性转弱的证据，这一护城河会收窄。
      - - FY25 和 FY26 的公开摘要显示，Lenskart 已进入持续盈利并产生正经营现金流的阶段。
        - 正向论点
        - 能盈利、能产生现金的零售商，相比烧钱的消费科技上市公司，应享有更低的执行折价。
        - 如果现金生成不再足以支持扩张，质量溢价应当收缩。
      - - IPO 和上市后市场参考仍隐含较高的销售额和盈利倍数。
        - 反向论点
        - 高估值意味着，即便是优秀公司，买入价格不对也可能成为糟糕投资。
        - 更低的倍数或更有力的一手未来盈利披露，会改善入场依据。
      - - 保留的一手来源未确认当前交易倍数、自由流通股或大股东减持压力。
        - 反向论点
        - 缺少这些输入，估值信心明显低于商业模式信心。
        - 最新交易所文件或 IR 披露若能补上这些空白，推荐将更具可执行性。
    notes: 该表将业务质量支撑与价格纪律约束分开；它不是完整的股权结构表或模型。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV011
      - CV012
      - CV016
      - CV017
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 门店密度、高端产品组合和 AI 驱动的服务改善，让收入和 EBITDA 持续复合增长并超过市场预期。
        - 盈利追赶速度足以证明买入价格合理，高估值得以维持。
        - 国际市场执行失误，或 AI 和制造资本开支回收更慢。
        - 需要反复出现利润率扩张证据，同时股权结构和流动性披露清晰。
      - - 基准
        - 健康增长延续，但业务逐渐成熟为高质量零售商，而不是无止境高速增长的平台。
        - 回报更多取决于入场纪律和适度的倍数支撑，而不是依靠大幅重估。
        - 前期付价过高，可能抹去扎实的运营进展。
        - 与保留证据最一致：公司强劲，但仍对价格敏感。
      - - 悲观
        - 增长或利润率放缓，而公开市场预期仍然高企。
        - 倍数收缩超过运营兑现，投资者获得平庸甚至负回报。
        - 门店生产率、可选消费需求或全球扩张令人失望。
        - 如果当前高溢价估值持续、却没有新的一手支撑，悲观情景更可能发生。
      - - 上调触发因素
        - 运行日交易所数据和股权披露显示倍数更合理，且老股出售压力可控。
        - 投资者能够有把握地评估入场价格和流动性风险，估值逻辑因此改善。
        - 披露仍不完整，或揭示未来抛售压力更大。
        - 需要一手证据，不能只靠第三方摘要。
      - - 下调触发因素
        - 相对于门店和资本开支扩张，现金生成能力走弱，或高端化抱负未能转化为盈利。
        - 溢价不再建立在可见的运营杠杆上，估值支撑因此瓦解。
        - 倍数收缩进一步放大运营放缓。
        - 现金转换转弱、利润率下滑或外部估值评论趋于谨慎，都将发出这一信号。
    notes: 里程碑锚点来自保留的私募轮、IPO 和上市后公开资料，而非完整 DCF 或可比公司表。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
      - CV016
      - CV017
