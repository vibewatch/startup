          value: 23
          unit: '%'
          note: FY2025 印度处方眼镜零售销售中由有组织参与者经营的约占比。
        - label: 印度新增门店潜力
          value: 4500
          unit: stores
          note: 管理层基于 GeoIQ 对印度进一步门店空白的估计。
    approximationNotes: 前四层是人口数量，第五层是渠道份额约束，最后一层是管理层的门店扩张估计；因此，该金字塔是有序的商业化视角，而非同一单位的漏斗。
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM010
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 序数评分显示，Lenskart 在分销控制与技术赋能服务整合的综合表现上高于列出的同行。
    data:
      xAxis:
        label: 分销与供应链控制
        min: 1
        max: 5
        lowLabel: Fragmented or outsourced
        highLabel: Owned omnichannel + manufacturing
        description: Ordinal score derived from retained evidence on store footprint, brand structure, and supply-chain control.
      yAxis:
        label: 技术与服务整合
        min: 1
        max: 5
        lowLabel: Basic store model
        highLabel: Remote services + AI + omnichannel data
        description: >-
          Ordinal score derived from retained evidence on eye tests, AI tooling, omnichannel capability, and digital
          service design.
      points:
        - label: Lenskart
          x: 5
          'y': 5
          tone: positive
          detail: 保留资料显示其门店覆盖最大，且拥有纵向整合运营和 AI 赋能服务。
          claimRefs:
            - CP001
            - CP002
            - CP010
            - CP018
        - label: Titan Eye Plus
          x: 3
          'y': 2
          tone: neutral
          detail: 值得信赖的老牌企业，拥有有组织的门店网络，但保留资料认为其线上能力有限。
          claimRefs:
            - CP005
            - CP006
        - label: Specsmakers
          x: 2
          'y': 1
          tone: neutral
          detail: 重要区域连锁，在印度南部拥有 260+ 家门店，但保留资料未将其视为全国性全渠道同等对手。
          claimRefs:
            - CP007
        - label: Vision Express
          x: 2
          'y': 1
          tone: neutral
          detail: 拥有高端连锁存在感，但保留证据未显示其规模或系统整合能力相当。
          claimRefs:
            - CP008
        - label: 本土眼镜店
          x: 1
          'y': 1
          tone: risk
          detail: 即便服务深度和技术较弱，在分散市场中仍是默认替代选择。
          claimRefs:
            - CP009
            - CP011
        - label: 自有品牌 / 区域品牌
          x: 4
          'y': 3
          tone: opportunity
          detail: 以 Owndays 为核心的多品牌扩张扩大了 Lenskart 的竞争覆盖面，不要求每个市场都使用同一品牌。
          claimRefs:
            - CP003
            - CP004
            - CP014
    approximationNotes: 评分为 1–5 的序数判断，综合自保留资料中的覆盖范围、渠道模式和技术姿态；它们不是市场份额百分比，也不是基准化用户评分。
