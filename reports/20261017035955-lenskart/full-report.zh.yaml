        title: 议题
        blocks:
          - type: callout
            title: 上市公司身份改变了基准
            body: 早期报告将 Lenskart 描述为 IPO 前公司，但 2026 年证据显示其已作为上市发行人运营；因此后续章节应把公开市场预期、披露节奏和所有权稀释视为当前事实。
            calloutType: insight
            claimRefs:
