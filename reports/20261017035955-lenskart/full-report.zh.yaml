  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资观点：质量真实存在，但入场仍显昂贵
        blocks:
          - type: paragraph
            body: >-
              证据支持一个强劲的底层业务，却不足以证明这是一只显然便宜的证券。官方材料显示，Lenskart 进入 FY26 时经营现金生成强劲，手头现金包括 IPO 所得，门店扩张仍在加速；独立摘要则描述了一个在 FY25
              和 FY26 推动盈利上升的垂直整合模式。这个运营证明很重要。约束在估值：保留的公开引用仍将 IPO
              和上市后交易描述为昂贵，销售和盈利倍数偏高，几乎不给执行失误留下空间。由于保留的一级来源没有锁定运行日的精确交易倍数，我不会只因业务质量追涨；纪律是跟踪，只有估值支撑跟上后才升级判断。
            claimRefs:
              - CV001
              - CV002
