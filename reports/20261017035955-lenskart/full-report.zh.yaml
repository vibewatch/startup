chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Lenskart 如今是一家上市眼镜公司，而不再只是后期私募创业公司。最有力的官方材料是 2026 年 2 月股东信，其中确认公司为 Lenskart Solutions Limited，并列出 NSE、BSE
              代码以及 Gurugram 和新德里的公司办公室。官方和独立来源对核心模式的描述一致：Lenskart 将设计、制造、分销、线上店铺、移动应用和实体零售合并成垂直整合的全渠道眼镜业务。公司自己的历史将法律起点定在
              2008 年，商业运营于 2010 年启动，首家零售店于 2013 年开业；后续章节应沿用这一时间线，而不是简化成“2010 年成立”。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO016
      - number: '1.2'
        title: 领导层、治理与利益相关方边界
        blocks:
          - type: paragraph
            body: >-
              现有证据仍显示公司以创始人为中心运营。Peyush Bansal 仍是最主要的公开管理层声音：独立资料将其列为创始人兼 CEO，股东信也由他署名并负责讲述经营表现和战略。Amit Chaudhary 和
              Sumeet Kapahi 仍出现在公开创始人叙事中，分别承担运营和技术角色；公司历史页面提到 Neha
              Bansal，但本次证据池中的最新管理层材料没有清晰呈现其当前职位。治理广度比领导层集中度更难核实。投资者关系页面确认公司拥有庞大的跨国子公司范围，包括 Owndays、Neso Brands、与 Meller
              相关的 Stellio 实体，以及多家东南亚和中东实体；但当前董事会、委员会构成和独立董事比例没有得到证据池直接支持，仍是尽调缺口。
