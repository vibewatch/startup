  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场比线上眼镜零售更宽，但比一般时尚配饰更窄。证据池中的公开来源一致将 Lenskart
              放在整合式眼镜流程中，覆盖处方眼镜、太阳镜、隐形眼镜、验光及全渠道履约。这个边界很重要，因为现状替代方案并不是另一款应用，而是仍主导品类的碎片化线下眼镜店渠道；诊断、镜架选择、镜片定制和售后服务往往彼此分开。在这一背景下，组织化玩家赢的不只是价格，还包括标准化、更好的诊断和更可靠的履约。因此，增长争论的重点不是消费者是否需要眼镜，而是一个长期无组织的市场会多快转向可信、可重复、品牌化的购买路径。
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM012
              - CM015
      - number: '2.2'
        title: 从需求、渠道和铺店速度三条线测算机会
        blocks:
          - type: paragraph
            body: >-
              最干净的公开测算仍是未满足的视力矫正需求，而不是已披露的钱包份额模型。公司提供的 Redseer
              报告显示，印度有庞大的屈光不正人群，实际佩戴处方眼镜的人数小得多，仍需矫正的人群规模很大。管理层在需求市场之上再叠加商业化视角，认为验光、数字化影响的需求和密集的社区门店会扩大可服务市场，而不只是重新分配现有客户。第二条线是渠道正规化：组织化零售仍只占处方眼镜市场少数，线上渠道也处于早期，这既支持长期增长空间，也意味着执行质量、供应链一致性和本地信任仍是转化的核心。第三条线是实体铺店能力，管理层称尤其在大都市以外仍可增加数千家门店。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
