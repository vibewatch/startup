              - CV017
      - number: '8.3'
        title: 牛市、基准与熊市框架
        blocks:
          - type: paragraph
            body: >-
              乐观情景很直接：Lenskart 持续提高门店密度，用现金流为扩张提供资金，并将垂直整合和 AI
              投资转化为持久的利润率提升及更高市场份额。基准情景不那么刺激却更可投资：增长和盈利保持健康，但只有在投资者不为这种质量支付过高价格时，股票才有吸引力。悲观情景同样清楚：若门店生产率、国际执行，或智能眼镜和制造的回报令人失望，高倍数可能迅速收缩。由于公开证据更能证明业务动能，而非当前精确价格，情景纪律比单点目标价更站得住脚。
            claimRefs:
              - CV003
