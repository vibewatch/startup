            body: >-
              公开证据支持零售加会员的收入模式，而不是纯软件式经常性收入叙事。独立 IPO 摘要将 FY25 营收列为约 ₹6,652-6,653 crore，净利润约 ₹297 crore；股东信显示动能在 FY26
              第三季度加速，营收同比增长 37.4%，EBITDA 利润率为 20.0%。核心变现仍从门店、应用和网站销售验光服务及眼镜开始，但管理层还通过 Gold
              会员费和复购叠加了有意义的重复收入。这很重要，因为公开数据表明，Lenskart 可以先在服务层创造需求，再靠产品组合升级和留存变现，而不必只依赖直接提高标价。
