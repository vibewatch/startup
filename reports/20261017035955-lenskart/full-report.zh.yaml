      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              即便不足以支撑精确目标价，公开证据已经足以勾勒融资故事。股东信称 Lenskart 截至 2025 年 12 月末拥有包括 IPO 所得在内的大量现金；投资者关系页面现已刊载上市集团各公司的 FY2026
              子公司财务和公告，相比仍为私有公司，这降低了治理折价。独立来源提供的是里程碑锚点，而不是干净的现值答案：IPO 前约 $6.1 billion 的私募估值、约 Rs. 70,000-72,700 crore 的
              IPO，以及一份在执行持续时暗示进一步上行的后续卖方目标。这些锚点有方向性价值，但不能替代更新后的一级交易数据、当前持股结构和锁定期披露。
            claimRefs:
              - CV002
              - CV007
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
