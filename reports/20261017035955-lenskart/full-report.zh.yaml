      - number: '8.4'
        title: 最终尽调问题与论点击穿触发器
        blocks:
          - type: paragraph
            body: >-
              剩余工作主要是估值尽调，而不是发现商业模式。在从跟踪升级为买入前，我希望一级来源确认当前交易倍数、IPO 后自由流通股本，以及 SoftBank 等主要持有人的锁定期或老股供给压力条款。我还希望看到印度新
              cohort 的回本期，以及 AI 硬件、智能眼镜和 Hyderabad 产能建设预期回报的更干净证据。如果 Lenskart
              不再把门店增长转化为现金生成，如果国际或高端扩张削弱利润率，或者股票继续享受高倍数却没有相称的增长和盈利兑现，投资论点就会失效。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV013
              - CV014
              - CV016
              - CV017
      - number: '8.5'
        title: 议题
        blocks:
          - type: callout
            title: 建议：跟踪
            body: 公司质量论点具备投资价值，但保留证据尚未证明入场价格被低估。应等待更新的一级估值数据，或等倍数更宽松后再转为买入。
            calloutType: recommendation
            claimRefs:
