            body: >-
              若执行降温，              竞争和融资风险会共同放大下行。独立评论指出，主要玩家如今都提供类似的虚拟试戴、上门验光和价值主张，因此 Lenskart 不能假定原有打法会永久保持专属性。另一方面，公开
              IPO 评论认为发行定价偏高、容易受到增速放缓影响；大比例售股也限制了交易总规模中真正转为经营资本的部分。实际的击穿标准是可衡量的：Hyderabad 投产或国际整合出现滑坡；远程验光和 AI
              自动化降低而非提升服务质量；或者公开市场重估使进一步铺店的成本显著上升。在这些问题被证伪前，正确姿态不是“回避”，而是只有在控制和回报与门店版图一样快地扩张并有证据支持时才作投资判断。
