figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Lenskart's path runs from 2008 incorporation through omnichannel scale-up, private funding, IPO execution, and 2026 public-company operating updates.
    data:
      items:
        - date: "2008-05-19"
          label: Legal incorporation as Valyoo Technologies
          detail: Lenskart's corporate history and secondary references anchor legal origin in 2008 under the Valyoo Technologies name.
          tone: neutral
          claimRefs: [CO002]
        - date: "2010"
          label: India online operations begin
          detail: The company says it commenced operations in India as an online business in 2010, which is the commercial-launch date often reused in public storytelling.
          tone: positive
          claimRefs: [CO003, CO016]
        - date: "2013"
          label: First retail store opens in New Delhi
          detail: The official history places the first offline retail store in New Delhi in 2013, establishing the omnichannel pivot.
          tone: positive
          claimRefs: [CO003]
        - date: "2022-06-30"
          label: Owndays majority acquisition announced
          detail: Wikipedia says Lenskart announced the acquisition of a majority stake in Owndays in a deal that materially expanded its international perimeter.
          tone: positive
          claimRefs: [CO013]
        - date: "2023-03"
          label: ADIA-backed scale funding phase
          detail: Public secondary summaries describe ADIA as a major investor during the late private scaling phase.
          tone: positive
          claimRefs: [CO008]
        - date: "2024-06"
          label: Secondary deal resets valuation marker
          detail: Wikipedia records a $200 million Temasek and Fidelity secondary transaction at a $5 billion valuation.
          tone: neutral
          claimRefs: [CO009]
        - date: "2024-10 / 2025-01"
          label: Franchise-owner allegations surface
          detail: Wikipedia summarizes franchise-owner allegations filed in Karnataka in October 2024 and a later stay on the probe in January 2025.
          tone: risk
          claimRefs: [CO014]
        - date: "2025-10 / 2025-11"
          label: IPO launched and listed
          detail: The IPO review describes a ₹7,278 crore public offer with a large OFS component and a tentative November 2025 listing window.
          tone: positive
          claimRefs: [CO010]
        - date: "2026-02-11"
          label: Public-company operating update
          detail: The shareholder letter reported 372 net new India stores in 9M FY26, taking India stores to 2,439, while international stores stood at 705.
          tone: positive
          claimRefs: [CO006]
    approximationNotes: null
    claimRefs: [CO002, CO003, CO006, CO008, CO009, CO010, CO013, CO014, CO016]
callouts:
  - calloutType: insight
    title: Listed-company status changes the baseline
    body: >-
      Earlier report context described Lenskart as pre-IPO, but the assigned 2026 evidence now
      shows it operating as a listed issuer, so later chapters should treat public-market
      expectations, disclosure cadence, and ownership dilution as current-state facts.
    claimRefs: [CO004, CO010]
  - calloutType: risk
    title: Scale is real, but margin for error looks narrower
    body: >-
      The business has reached meaningful revenue, profitability, and store scale, yet the
      adverse readthrough in the IPO review is that valuation and a large offer-for-sale component
      reduced the room for execution misses or disappointing public-market follow-through.
    claimRefs: [CO007, CO010, CO015]
