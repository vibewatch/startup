      - number: '1.3'
        title: Funding history and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Funding visibility improved versus the prior report because both official and independent sources now
              point to a November 2025 $100 million financing led by Apax Digital Funds, taking total company-reported
              capital to more than $450 million. RapidSOS also links the financing to continued R&D spending,
              interoperability, and global expansion, while Government Technology adds useful context around
              acquisitions and partnership activity. Even so, the public file still stops short of the items investors
