  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      RapidSOS layers partner data ingestion, incident fusion, HARMONY AI, and workflow distribution across
      public-safety and enterprise surfaces.
    data:
      layers:
        - label: Connected inputs
          detail: Device, app, vehicle, camera, alarm, school, and enterprise signals entering the safety network.
          modules:
            - 540M+ connected devices in the 2024 UNITE launch
            - 600M+ devices / 200+ enterprises in Nov. 2025 company update
            - 723M+ devices / 250+ enterprises in Apr. 2026 AT&T package
          outputs:
            - Caller location
            - Health profile
            - Telematics
            - Alarm / video context
        - label: Incident fusion layer
          detail: Builds a unified emergency picture from heterogeneous safety signals.
          modules:
            - Unified incident pane
            - Agency Share / Chat context
            - GIS mapping and caller context
          outputs:
            - One incident picture for PSAP and field workflows
        - label: HARMONY AI services
          detail: Adds automation and interpretation on top of the fused incident data.
          modules:
            - Live transcript + AI summary
            - Translation / transcription
            - SOP surfacing
            - Non-emergency call automation
            - Intelligent Analyst reporting
          outputs:
            - Operator decision support
            - Faster handoff across jurisdictions
        - label: Interoperability and network transport
          detail: Moves the enriched incident context through cross-agency and private-network paths.
          modules:
            - Real-Time Interoperability
            - Agency Share / Chat
            - AT&T ESInet private-network path
          outputs:
            - Cross-jurisdiction routing support
            - Intelligence that travels with the call
        - label: Enterprise and monitoring surfaces
          detail: Extends the same incident picture into enterprise security and monitoring operations.
          modules:
            - Enterprise GSOC coordination
            - Monitoring API + redundant sites
          outputs:
            - Enterprise escalation
            - 24/7 monitored escalation
        - label: Responder endpoints
          detail: Delivers the unified context to the people and systems making response decisions.
          modules:
            - UNITE telecommunicator workspace
            - Field responder applications
            - CAD-linked dispatch workflows
          outputs:
            - PSAP response
            - Field response
    approximationNotes: >-
      Scale markers come from dated public claims across 2024-2026 and should be read as historical checkpoints, not a
      normalized time series.
    claimRefs:
      - CE002
