  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning from retained evidence places RapidSOS above status-quo monitoring substitutes on
      interoperability breadth and deployment flexibility, while named vendor peers remain less directly evidenced.
    data:
      xAxis:
        label: Workflow interoperability breadth
        min: 1
        max: 5
        low: phone-centric / narrow
        high: digitally integrated / broad
        description: Ordinal 1-5 scale inferred from retained evidence only.
        scale: ordinal
      yAxis:
        label: Buyer control and deployment flexibility
        min: 1
        max: 5
        low: bundled / rigid
        high: overlay / flexible
        description: Higher scores reflect easier layering onto existing systems.
        scale: ordinal
      points:
        - label: RapidSOS
          x: 4.6
          'y': 4.4
          detail: >-
            API-style overlay, digital 911 escalation, GSOC coordination, and 1,300 CAD integrations are all claimed in
            retained evidence.
        - label: Legacy wholesale monitoring
          x: 1.4
          'y': 1.8
          detail: Retained official evidence describes analog voice relay and limited rich-data integration.
        - label: Monitoring point solutions
          x: 1.9
          'y': 2
          detail: >-
            Official comparison says these solutions verify alarms and contact 911 by voice, with limited customization
            and scale.
        - label: Vertically integrated security
          x: 2.2
          'y': 1.7
          detail: Bundled hardware and extra integration work reduce flexibility in retained official comparisons.
        - label: Mass-notification peers
          x: 2.8
          'y': 2.7
          detail: >-
            Buyer-facing directories list peers such as Everbridge, but this pool retains little direct workflow
            evidence.
        - label: Public-safety suite incumbents
          x: 3.2
          'y': 2.5
          detail: >-
            Alternative listings and CAD adjacency imply overlap, but retained public evidence is thinner on exact fit
            versus RapidSOS.
