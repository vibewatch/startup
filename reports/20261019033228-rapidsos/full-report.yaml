              - CO011
              - CO014
              - CO016
      - number: '1.2'
        title: Leadership, governance visibility, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The visible leadership story is concentrated around founder and CEO Michael Martin, who remains the quoted
              spokesperson for financing, AI strategy, and network expansion across both company and independent
              coverage. The assigned public record also surfaces Karin Marquez as a named public-safety workflow
              operator, but it does not expose a broader executive bench, board roster, or investor-control structure.
              That makes leadership continuity reasonably clear but governance quality hard to underwrite from public
              evidence alone. For later diligence chapters, the practical takeaway is that RapidSOS can be treated as
              founder-led, but not as governance-transparent.
