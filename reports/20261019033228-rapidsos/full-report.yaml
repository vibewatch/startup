  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual severity is highest where fragmented public-safety infrastructure intersects with sensitive data and thin
      external control evidence.
    data:
      columns:
        - label: Likelihood
          detail: Probability of the risk surfacing without new controls.
        - label: Impact
          detail: Consequence for outcomes, procurement, or financing.
        - label: Mitigation maturity
          detail: How concrete the public mitigations look today.
        - label: Kill trigger
          detail: Event that would materially worsen the thesis.
      rows:
        - label: Privacy / retention
          note: Automatic emergency-data sharing is public; downstream agency controls are not.
          values:
            - label: Medium
            - label: High
            - label: Low-medium
              detail: Evidence is mostly descriptive rather than audited.
            - label: No DPA, retention, or model-governance package in diligence
        - label: Routing / interoperability
          note: Mission-critical workflows still traverse fragmented jurisdictions and CAD stacks.
          values:
            - label: Medium
            - label: High
            - label: Medium
              detail: Field testing exists, but live error-rate trend is not public.
            - label: Persistent handoff failures or outage disclosures
        - label: Channel / partner dependence
          note: Government access and data richness both depend on external partners.
          values:
            - label: Medium
            - label: Medium-high
            - label: Medium
            - label: Material slowdown in partner-enabled deployments
        - label: Operational scale
          note: The platform spans large agency, responder, and CAD footprints that can amplify a single defect.
          values:
            - label: Low-medium
            - label: High
            - label: Medium
            - label: Module-specific outage or widespread integration breakage
        - label: Financial disclosure opacity
          note: Funding is public; revenue quality and unit economics are not.
          values:
            - label: High
            - label: Medium-high
            - label: Low
              detail: The best public mitigation is only cash raised, not operating proof.
            - label: Next round arrives before unit-economics evidence
        - label: Security / AI governance proof gap
          note: Independent evidence of certifications, breach history, and model controls is still missing.
          values:
            - label: Medium
            - label: High
            - label: Low
            - label: Unable to produce current external control evidence in diligence
    approximationNotes: >-
      Ordinal labels summarize public evidence from this assigned source pool; they are analytical ratings, not
      source-authored scores.
    claimRefs:
      - CR001
      - CR006
      - CR007
      - CR008
      - CR010
      - CR013
      - CR014
