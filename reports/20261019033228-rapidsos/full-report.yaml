              - CU006
      - number: '6.2'
        title: Named customer proof is credible but skewed toward pilots, partner stories, and anecdotes
        blocks:
          - type: paragraph
            body: >-
              The named customer record is real enough to reject a logo-only story, but it remains uneven in quality.
              Public proof ranges from an Uber pilot and consumer-app safety partnership to Honeywell and ecobee
              integrations plus a Walmart GSOC testimonial on the retail vertical page. Those references demonstrate
              that RapidSOS is embedded in multiple workflows across public safety, smart home, and enterprise security
              surfaces. Still, most examples are company-selected proof points or partner case studies, and the public
              materials seldom say whether the relationship is a paid production deployment, a pilot, or an expansion
              from a smaller initial rollout.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU016
