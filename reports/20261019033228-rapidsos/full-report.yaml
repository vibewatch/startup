chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and current scale
        blocks:
          - type: paragraph
            body: >-
              RapidSOS positions itself as mission-critical AI for emergency response, connecting public-safety
              agencies, enterprises, and connected devices into one operating layer for emergency intelligence.
              Independent coverage aligns with the basic company identity: Government Technology describes RapidSOS as a
              New York-based company launched in 2012 that sells emergency detection and response services through
              connected sensors, cameras, and other devices. Current scale disclosures are directionally strong but not
              perfectly consistent across sources. Official 2025 and 2026 materials support more than one billion
              emergencies supported, 22,000-plus to 23,500-plus agency reach, and a broad enterprise footprint, but the
              exact definitions behind those metrics are not explained in the assigned evidence.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO008
              - CO010
              - CO011
