      - number: '4.2'
        title: GTM and delivery economics look services-aware and potentially integration-heavy
        blocks:
          - type: paragraph
            body: >-
              The public record implies that RapidSOS is not a pure low-touch SaaS sale. TechCrunch's reporting shows
              some large partners required custom engineering and product work before integrations could launch, while
              the same article says at least one prospective partner initially waited for broader PSAP coverage before
              committing. Company marketing also emphasizes a single API, human monitoring, workflow customization, and
              geographically redundant operating sites. Taken together, the disclosed model suggests a software business
              with meaningful service-delivery and onboarding components, which can be attractive when embedded deeply
              in emergency workflows but usually makes CAC, payback, and contribution-margin disclosure much more
              important than it is today.
            claimRefs:
              - CI001
              - CI013
              - CI014
              - CI015
              - CI016
