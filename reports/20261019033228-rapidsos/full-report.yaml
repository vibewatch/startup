              - CE007
              - CE009
              - CE010
              - CE011
              - CE015
      - number: '5.3'
        title: Differentiation and visible product risks
        blocks:
          - type: paragraph
            body: >-
              RapidSOS looks differentiated when compared with legacy monitoring and analog 911 escalation, because the
              company can now point to digital escalation, richer data transport, enterprise GSOC coordination, and
              interoperability across agencies instead of a single phone-based alert path. Even so, the strongest risk
              signals in the pool are not about feature breadth; they are about proof quality and ecosystem dependence.
              Independent review says product value scales with connected partners and quote-led enterprise procurement,
              while RapidSOS itself frames outages, disasters, and policy-routed surges as the scenarios where
              coordination breaks down and the product must add the most value. The chapter therefore supports a thesis
              of real workflow breadth, but not yet a thesis of independently validated reliability, control maturity,
              or developer-community pull.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow breadth is the clearest moat
            body: >-
              The strongest product signal is not one AI feature; it is that RapidSOS now shows one incident context
              moving across PSAP intake, cross-jurisdiction coordination, enterprise GSOC escalation, and monitoring
              operations.
            calloutType: strength
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE015
          - type: callout
            title: Proof quality still lags the product story
            body: >-
              Independent evidence supports ecosystem dependence and roadmap direction, but public proof of reliability,
              control maturity, and implementation depth still trails the company-controlled feature narrative.
            calloutType: risk
            claimRefs:
              - CE012
