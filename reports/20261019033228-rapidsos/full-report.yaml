  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer footprint now spans agencies, enterprises, and platform partners
        blocks:
          - type: paragraph
            body: >-
              RapidSOS's customer evidence supports a broadening buyer mix rather than a single public-sector niche.
              Company and independent sources align that the platform serves a large base of public-safety agencies
              while also selling into enterprise security and partnering with connected-device ecosystems. The 2025
              financing announcement frames the platform as used by 22,000+ federal, state, local, and defense agencies
              plus 200+ global enterprises, while the retail vertical page shows deliberate positioning toward Fortune
              500 security teams and logistics operators. That mix matters because it implies RapidSOS is monetizing
              both responder-side workflow adoption and enterprise-to-911 connectivity, but the public file still does
              not separate who pays, who uses, or how much revenue each segment contributes.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
