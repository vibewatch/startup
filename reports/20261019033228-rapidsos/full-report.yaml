          - type: callout
            title: Scale is credible; efficiency is not yet public
            body: >-
              Funding scale, agency coverage, device count, and emergency volumes support commercial relevance, but none
              of those proxies reveal whether the business is generating attractive unit economics.
            calloutType: insight
            claimRefs:
              - CI006
              - CI010
              - CI011
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              RapidSOS is no longer just a location-enrichment utility for emergency calls. The public record in the
              assigned pool shows a layered product family that starts with device/app/sensor data ingestion, then
              packages that context into operator-facing workflows for 911 telecommunicators, first responders,
              enterprise security teams, and monitoring partners. UNITE is the clearest center of gravity: it combines
              the earlier Portal and Premium surfaces, integrates with call-handling and CAD systems, and puts voice,
              text, video, caller context, and connected-device data into a single operating pane. That breadth matters
              because RapidSOS is selling into already fragmented emergency workflows where the operational value comes
              from replacing multiple screens, manual handoffs, and analog phone escalation with a richer incident
              picture.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE008
              - CE009
              - CE012
      - number: '5.2'
        title: Architecture, distribution, and deployment model
        blocks:
          - type: paragraph
            body: >-
              The technical pattern visible in public materials is a network-and-workflow architecture rather than a
              standalone AI feature. RapidSOS aggregates inputs from connected devices, enterprises, and public-safety
              systems; applies fusion and AI assistance through HARMONY; and distributes the resulting incident context
              into CAD-linked dispatch workflows, field responder surfaces, enterprise GSOCs, and monitoring operations.
              Real-Time Interoperability and the AT&T ESInet package are especially important because they move RapidSOS
              beyond a single-agency console into cross-jurisdiction routing and private-network distribution. That
              widens deployment options, but it also means execution depends on interoperability with CAD vendors,
              partner data quality, ESInet/private-network access, and the operational resilience of the routing
              environment itself.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
