      - number: '3.2'
        title: RapidSOS's wedge is overlay interoperability, not CAD replacement
        blocks:
          - type: paragraph
            body: >-
              The most consistent positioning claim in the retained pool is that RapidSOS layers on top of existing
              public-safety and enterprise systems instead of trying to rip them out. Government Tools describes it as
              "not a traditional CAD system," and the EMS1-syndicated company release says HARMONY is interoperable with
              nearly every major public safety software system while RapidSOS UNITE already shares information across
              1,300 CAD integrations. RapidSOS's own pages extend that wedge into enterprise security by promising
              direct digital escalation to 911, GSOC visibility into live incidents, and richer contextual data than
              analog relay workflows can carry. This positioning matters because it lowers the replacement burden versus
              incumbent infrastructure and makes RapidSOS easier to evaluate as an add-on operating layer.
            claimRefs:
              - CP003
              - CP004
              - CP010
              - CP011
              - CP012
              - CP013
