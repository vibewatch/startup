companyProfile:
  summary: >-
    RapidSOS is a New York-based emergency-response AI and interoperability platform founded in 2012 that connects
    devices, enterprises, monitoring workflows, and public-safety agencies into one emergency-intelligence layer. The
    company’s public story is strongest on scale and capital access, including a November 2025 financing led by Apax,
    but public disclosure still does not cover revenue quality, margins, or financing terms well enough to underwrite
    the business on economics alone.
