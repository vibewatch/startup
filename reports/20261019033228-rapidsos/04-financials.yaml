  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-opacity
      missingEvidence: Realized pricing by product, standard contract minimums, discounting policy, and deployment-fee structure.
      whyItMatters: Public descriptions of products are not enough to convert adoption signals into revenue quality or gross-profit assumptions.
      diligencePath: Request current price book, three representative customer contracts, and realized ASPs by product line.
      relatedQuestionRefs: [QI002]
      relatedTableRefs: [TI002]
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: Gross margin, CAC, sales cycle length, payback, renewal, and expansion metrics by segment.
      whyItMatters: Without unit economics, the business cannot be underwritten as software, services, or a hybrid model with confidence.
      diligencePath: Obtain cohort-level bookings, gross-margin bridge, CAC/payback deck, and renewal / churn analysis by enterprise versus public-safety workflow.
      relatedQuestionRefs: [QI007]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Cash-on-hand, monthly burn, debt or credit facilities, covenant package, and management's next-round trigger.
      whyItMatters: Fundraising history shows access to capital, but not whether current liquidity can support growth plans without another financing.
      diligencePath: Request latest monthly cash bridge, debt schedule, board-approved operating plan, and downside runway scenario.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: concentration-and-mix
      missingEvidence: Revenue concentration, partner revenue-share terms, module attach rates, and mix between monitoring, software, and enterprise workflows.
      whyItMatters: The platform may be strategically important, but concentration or low-margin service mix could materially change valuation support.
      diligencePath: Request top-customer revenue concentration, segment mix, partner economics, and module-level gross margin.
      relatedQuestionRefs: [QI001, QI003]
      relatedTableRefs: [TI001]
