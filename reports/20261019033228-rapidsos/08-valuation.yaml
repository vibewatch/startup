      - ["Confidence", "medium", "Public file is broad enough to rule out a buy call but too thin for precise pricing.", "Use diligence gating rather than target-price certainty."]
      - ["Risk rating", "high", "Opaque financing terms, missing revenue quality, and commercialization proof gaps remain material.", "Require downside-protection discipline before entry."]
      - ["Valuation stance", "stretched", "A $1B private marker exists, but public evidence does not support a defendable multiple.", "Only a lower entry price or stronger economics should move the call."]
    notes: "Summary reflects public-source evidence only; no revenue, ARR, gross margin, or preference-stack disclosures were available in the reviewed pool."
    claimRefs: [CV006, CV008, CV009, CV012, CV015, CV016]
