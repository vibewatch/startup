    title: "Thesis / anti-thesis table"
    columns:
      - "Lens"
      - "Argument"
      - "What would change the view"
    rows:
      - ["Investment thesis", "RapidSOS appears to control a scaled interoperability layer across agencies, enterprises, devices, and monitoring workflows, which can support strategic value and continued capital access.", "Independent disclosure of monetization quality—ARR/revenue growth, gross margin, renewal, and module attach rates—would strengthen this from strategic promise to investable economics."]
      - ["Anti-thesis", "The current valuation context may be outrunning public proof: funding totals conflict across sources, the latest 2026 round is undisclosed, and no public file anchors price to revenue quality or cash generation.", "A reconciled financing ledger plus clean cap-table/preference terms and audited operating metrics would reduce the downside case materially."]
      - ["What changes the call", "A buy call requires both better evidence and better price discipline, not just another product or partnership announcement.", "Reopen the call only if management provides clean economics and financing detail while the entry still offers downside protection versus the latest private marker."]
    notes: "This table mixes confirming and disconfirming evidence; it is a judgment framework, not a modeled return forecast."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV008, CV009, CV012, CV015, CV016]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation / return logic"
      - "Key risks"
      - "Probability signal"
    rows:
      - ["Bull", "Management shows strong ARR growth, durable gross margin, healthy renewals, and benign preferences while platform breadth continues to convert into enterprise and agency expansion.", "The current private marker could be defensible or conservative if disclosed economics justify infrastructure-like strategic value.", "Execution on AI product expansion still has to translate into paid usage, not just broader workflow scope.", "Possible, but unsupported by today's public economics."]
      - ["Base", "RapidSOS remains strategically important and well funded, but public disclosure on economics and financing structure stays limited through the next diligence cycle.", "The right move is to track or diligence further rather than underwrite a target return from public evidence alone.", "Stretched pricing could persist without a clearing event, locking investors into a thinly supported entry point.", "Most consistent with the current public file."]
      - ["Bear", "Funding history stays inconsistent, the 2026 round masks pricing or dilution pressure, and monetization lags product ambition or category competition intensifies.", "The latest private marker would look rich versus risk-adjusted fundamentals, creating down-round or multiple-compression risk.", "No public metrics currently refute this downside path.", "Material downside case until financing and economic disclosures improve."]
    notes: "Scenarios are qualitative because the reviewed sources do not disclose the revenue, margin, or cash-flow inputs needed for a reliable model; probability signals are evidence-weighted judgments rather than numeric probabilities."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV007, CV008, CV013, CV015, CV016]
