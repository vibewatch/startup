evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, committee structure, investor-control rights, and governance documents for the latest
      preferred round.
    whyItMatters: >-
      Governance quality and control rights materially affect downside protection, refresh-risk, and founder-dependence
      assessment.
    diligencePath: Request the current board deck, charter package, and financing documents from the data room or management.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding-history
    missingEvidence: Primary archive or investor documentation for older financing rounds and cumulative capital history.
    whyItMatters: >-
      Third-party profiles conflict with the company's later $450 million funding story and make milestone precision
      unreliable.
    diligencePath: Reconcile round history against signed financing documents, investor announcements, and the company cap table.
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: Revenue, ARR, gross margin, burn, debt, and cohort retention or expansion metrics.
    whyItMatters: The company can be sized as a platform, but not underwritten on valuation without basic economic quality metrics.
    diligencePath: Request monthly or quarterly management financials plus customer-cohort revenue bridges.
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: minor
    topic: scale-definitions
    missingEvidence: >-
      Definitions behind the different agency and device counts used across 2025-2026 public materials and
      low-reputation profiles.
    whyItMatters: >-
      Inconsistent denominators can overstate commercial traction or obscure the line between network reach and paying
      customers.
    diligencePath: >-
      Ask management to bridge direct customers, reachable agencies, active integrations, and connected-device counts in
      one metric dictionary.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: tam-pricing
    missingEvidence: >-
      Public TAM, SAM, SOM, pricing tiers, and contract-value benchmarks for RapidSOS's core public-safety and
      enterprise products.
    whyItMatters: >-
      Without a pricing bridge, installed-base reach cannot be converted into a credible revenue opportunity or
      valuation multiple.
    diligencePath: >-
      Obtain sales collateral, customer contracts, or procurement records showing pricing, deployment scale, and renewal
      terms by segment.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-owner
    missingEvidence: Named budget owners and approval chains across ECC, enterprise security, and monitoring-partner deployments.
    whyItMatters: Buyer complexity drives sales-cycle length, expansion logic, and who can actually fund adoption.
    diligencePath: >-
      Interview customers and channel partners, and review RFPs or procurement approvals that identify the signing
      department and spend owner.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: installed-base
    missingEvidence: >-
      A dated company metric ledger reconciling device, enterprise, agency, and emergency totals across 2025 and 2026
      disclosures.
    whyItMatters: >-
      Current public counts are directionally helpful but not internally consistent enough for precise market-share
      math.
    diligencePath: >-
      Request a management bridge that timestamps metric definitions and shows which counts are cumulative, active, or
      partner-enabled.
    relatedQuestionRefs:
      - QM006
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: incumbent-response-benchmarking
    missingEvidence: >-
      Neutral head-to-head benchmarks or buyer references comparing RapidSOS against named incumbents and adjacent
      suites on response-time lift, retention, or deployment ROI.
    whyItMatters: >-
      Without independent comparison evidence, moat durability versus better-funded incumbents remains only partially
      substantiated.
    diligencePath: >-
      Request customer win-loss data, independent case studies, or procurement evaluations covering Everbridge,
      Motorola/RapidDeploy, Axon, and status-quo alternatives.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public contract pricing, module packaging, discounts, and minimum commitments for RapidSOS and the main
      alternatives in the observed buyer set.
    whyItMatters: >-
      Opaque pricing prevents a clean judgment on whether RapidSOS's interoperability wedge also creates pricing power
      or simply hides commoditized competition.
    diligencePath: Obtain sample order forms, enterprise pricing sheets, or procurement records for RapidSOS and key alternatives.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: competitor-scale
    missingEvidence: >-
      Primary-source scale, funding, and product-scope disclosures for named alternatives that appeared only in
      buyer-facing directories.
    whyItMatters: >-
      The chapter can map the field today, but stronger competitor diligence would separate real overlap from noisy
      comparison-list artifacts.
    diligencePath: >-
      Pull official product, pricing, and investor materials for the named alternatives before relying on
      directory-generated peer sets.
    relatedQuestionRefs:
      - QP004
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized pricing by product, standard contract minimums, discounting policy, and deployment-fee structure.
    whyItMatters: >-
      Public descriptions of products are not enough to convert adoption signals into revenue quality or gross-profit
      assumptions.
    diligencePath: Request current price book, three representative customer contracts, and realized ASPs by product line.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Gross margin, CAC, sales cycle length, payback, renewal, and expansion metrics by segment.
    whyItMatters: >-
      Without unit economics, the business cannot be underwritten as software, services, or a hybrid model with
      confidence.
    diligencePath: >-
      Obtain cohort-level bookings, gross-margin bridge, CAC/payback deck, and renewal / churn analysis by enterprise
      versus public-safety workflow.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash-on-hand, monthly burn, debt or credit facilities, covenant package, and management's next-round trigger.
    whyItMatters: >-
      Fundraising history shows access to capital, but not whether current liquidity can support growth plans without
      another financing.
    diligencePath: Request latest monthly cash bridge, debt schedule, board-approved operating plan, and downside runway scenario.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: concentration-and-mix
    missingEvidence: >-
      Revenue concentration, partner revenue-share terms, module attach rates, and mix between monitoring, software, and
      enterprise workflows.
    whyItMatters: >-
      The platform may be strategically important, but concentration or low-margin service mix could materially change
      valuation support.
    diligencePath: Request top-customer revenue concentration, segment mix, partner economics, and module-level gross margin.
    relatedQuestionRefs:
      - QI001
      - QI003
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public developer or practitioner proxy showing how third-party builders adopt RapidSOS surfaces, such as API-doc
      usage, package or repo activity, public integrator talks, or forum traffic.
    whyItMatters: >-
      The chapter can verify product breadth and workflow claims, but not how sticky or extensible the platform is for
      implementers outside company marketing.
    diligencePath: >-
      Request implementation-partner references, API usage metrics, integrator engineering case studies, or
      practitioner-community proxies from public-safety software partners.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Public trust or compliance artifacts for HARMONY, ESInet delivery, and monitoring operations, including uptime
      history, incident disclosures, security architecture detail, and control mappings.
    whyItMatters: >-
      AI-assisted emergency routing and private-network packaging matter only if the operating controls and reliability
      record are independently reviewable.
    diligencePath: >-
      Obtain trust-center materials, uptime and incident history, security review packets, and model-governance
      documentation from management.
    relatedQuestionRefs:
      - QE004
      - QE009
  - type: private-evidence-only
    severity: material
    topic: module-adoption
    missingEvidence: >-
      Cohort-level attach, active-seat, renewal, and pilot-to-production data for UNITE, HARMONY, Monitoring, and
      enterprise modules.
    whyItMatters: >-
      Public launches establish breadth, but not which modules are revenue-critical or defensible once customers move
      from pilot to scaled deployment.
    diligencePath: >-
      Request module-level ARR, attach, renewal, conversion, and customer-segment penetration by agency and enterprise
      cohort.
    relatedQuestionRefs:
      - QE002
      - QE007
  - type: missing-source
    severity: material
    topic: retention-gaps
    missingEvidence: Customer-level NRR, GRR, logo churn, renewal rate, and average contract duration by agency and enterprise cohorts.
    whyItMatters: >-
      Without retention data, the report cannot distinguish broad logo acquisition from durable recurring customer
      value.
    diligencePath: >-
      Request cohort retention schedules, renewal rates, contract terms, and customer references segmented by agency and
      enterprise products.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-deployments
    missingEvidence: >-
      A complete current list of named production customers, pilot customers, and reference accounts with deployment
      status and date.
    whyItMatters: >-
      The public sample shows adoption surfaces, but it is too curated to support claims about breadth, production
      depth, or reference quality across the installed base.
    diligencePath: >-
      Request a current customer list with production versus pilot status, launch dates, use cases, and permissioned
      reference calls.
    relatedQuestionRefs:
