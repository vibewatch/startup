      - ["Rich contextual data or video into ECC workflows", "Yes; video, caller, and incident context are core claims", "Limited per official comparison", "Limited per official comparison", "Limited/unknown in retained pool", "Unknown in retained pool"]
      - ["Works with existing CAD and public-safety systems", "Yes; overlay model plus 1,300 CAD integrations claimed", "Unknown in retained pool", "Unknown in retained pool", "Requires extra integration resources per official comparison", "Overlap implied, but exact interoperability evidence not retained"]
      - ["Enterprise/global operating resilience", "Yes; fifteen geographically redundant sites are claimed", "Unknown in retained pool", "Official comparison says these tools cannot support multiple monitoring centers or global scale", "Unknown in retained pool", "Unknown in retained pool"]
      - ["Enterprise visibility into live 911 incidents", "Yes; GSOC alerts and coordinated updates are core retail claims", "No retained evidence", "No retained evidence", "No retained evidence", "Unknown in retained pool"]
    notes: >-
      Cells marked unknown indicate that the assigned source pool did not retain
