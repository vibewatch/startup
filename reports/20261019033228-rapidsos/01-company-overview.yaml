  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["Apax Digital Funds", "Lead investor in the latest $100M financing", "Likely holds meaningful governance and economic rights in the current preferred stack.", "Request board-seat, preference, and secondary terms from the November 2025 round."]
      - ["Public-safety agencies", "Core deployment base and design partner", "Company says agencies shaped the product and account for 22,000+ to 23,500+ network reach.", "Split paying agencies from reachable agencies, plus retention and procurement-cycle data."]
      - ["Enterprise customers / partners", "Commercial demand surface", "Official posts cite 200+ enterprises and half of the US Fortune 10 as network participants.", "Break out ACV, pilot-to-production conversion, and attach rates by enterprise vertical."]
      - ["Connected-device and data partners", "Input layer for emergency intelligence", "Company ties platform defensibility to 600M+ connected devices, cameras, apps, and sensors.", "Clarify exclusivity, rev-share, data-rights, and outage dependencies."]
      - ["Northern911 and ecosystem partners", "Expansion through M&A and interoperability deals", "GovTech links current expansion to the Northern911 acquisition and partnerships such as Hexagon.", "Quantify revenue contribution, integration risk, and cross-sell evidence from acquired or partner-led channels."]
    notes: "Roles and importance are evidence-backed; control economics remain inference because the assigned public sources stop short of cap-table or contract disclosures."
    enumerationScope:
      coverage: partial
      basis: Most economically important stakeholder groups visible in assigned public evidence as of the 2026-10-19 run date.
    claimRefs: [CO005, CO006, CO007, CO008, CO016]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: RapidSOS has a usable public milestone arc from 2012 launch through 2025 financing, but older round history still relies on low-reputation aggregators rather than primary archives in the assigned pool.
    data:
      items:
        - date: "2012"
          label: Launches as a New York public-safety connectivity company
          detail: Government Technology reports that RapidSOS launched in 2012 and sells emergency detection and response services via connected sensors, cameras, and other devices.
          tone: neutral
          claimRefs: [CO004]
        - date: "2015-09-01"
          label: Seed round appears in third-party archive
          detail: StartupHub lists a $5M seed round, but the assigned pool does not include a primary company or investor archive for this event.
          tone: adverse
          claimRefs: [CO014]
        - date: "2017-03-01"
          label: Series A appears in third-party archive
          detail: StartupHub lists a $15M Series A with Lightspeed Venture Partners, again without primary-archive corroboration in the assigned evidence.
          tone: adverse
          claimRefs: [CO014]
        - date: "2021-03-01"
          label: Series C appears in third-party archive
          detail: StartupHub lists a $150M Series C, highlighting why earlier financing history still needs cap-table verification against company records.
          tone: adverse
          claimRefs: [CO014]
        - period: "Aug 2024"
          label: Alarm Call Automation launches
          detail: The EMS1-syndicated 2025 release says RapidSOS launched Alarm Call Automation in August 2024 before expanding HARMONY automation further.
          tone: positive
          claimRefs: [CO009]
        - date: "2024-12-10"
          label: UNITE special event scheduled for 911 audiences
          detail: RapidSOS used the product update announcement to direct 911 audiences to a Dec. 10, 2024 live event explaining the new workflow features.
          tone: positive
          claimRefs: [CO009]
        - period: "Early 2025"
          label: UNITE and HARMONY workflow upgrades roll out
          detail: EMS1 syndicates RapidSOS claims around real-time transcription, SOP integration, and broader non-emergency automation for telecommunicators.
          tone: positive
          claimRefs: [CO009]
        - date: "2025-11-18"
          label: Latest funding lifts company-reported capital above $450M
          detail: RapidSOS says it raised $100M, bringing total investment to $450M while pushing further R&D into emergency-response AI.
          tone: positive
          claimRefs: [CO005]
        - date: "2025-11-19"
          label: Financing story expands into M&A and partnerships
          detail: Government Technology ties the new round to RapidSOS' Northern911 acquisition, AI investment, and a recent Hexagon commercial fire-alert partnership.
          tone: positive
          claimRefs: [CO006, CO016]
    approximationNotes: "Older 2015-2021 financing markers come from low-reputation aggregators because the assigned pool does not include primary historical funding archives."
    claimRefs: [CO004, CO005, CO006, CO009, CO014, CO016]
callouts:
  - calloutType: strength
    title: Category position is easier to verify than economics
    body: Company-issued 2025-2026 materials consistently support a scaled emergency-response platform with large network reach, one-billion-plus emergencies supported, and meaningful agency and enterprise penetration.
    claimRefs: [CO003, CO007, CO008, CO011]
  - calloutType: risk
    title: Disclosure quality is still the gating diligence issue
    body: Public sources now support the latest financing and expansion story, but they still do not disclose revenue, ARR, current board composition, or financing terms, and low-reputation aggregators conflict with official founding and funding history.
    claimRefs: [CO013, CO014, CO015, CO016]
