artifact: company-overview
slug: rapidsos
runDate: 2026-10-19
company:
  name: RapidSOS
chapter:
  number: 1
  title: Company Overview
  summary: >-
    RapidSOS still presents as a founder-led public-safety software platform
    with meaningful scale claims, including more than $450 million raised and
    22,000-plus agency reach across its AI-enabled emergency-response network.
    The strongest current evidence is still company-issued, while independent
    coverage mainly corroborates launch timing, financing leadership, and
    expansion activity rather than economics. Public disclosure remains thin on
    revenue, ARR, board composition, and financing terms, and low-reputation
    aggregators now conflict with official funding and scale disclosures.
sections:
  - id: identity-and-scale
    title: Identity and current scale
    body: >-
      RapidSOS positions itself as mission-critical AI for emergency response,
      connecting public-safety agencies, enterprises, and connected devices
      into one operating layer for emergency intelligence. Independent coverage
      aligns with the basic company identity: Government Technology describes
      RapidSOS as a New York-based company launched in 2012 that sells
      emergency detection and response services through connected sensors,
      cameras, and other devices. Current scale disclosures are directionally
      strong but not perfectly consistent across sources. Official 2025 and
      2026 materials support more than one billion emergencies supported,
      22,000-plus to 23,500-plus agency reach, and a broad enterprise
      footprint, but the exact definitions behind those metrics are not
      explained in the assigned evidence.
    claimRefs: [CO001, CO002, CO003, CO004, CO007, CO008, CO010, CO011]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance visibility, and key-person dependence
    body: >-
      The visible leadership story is concentrated around founder and CEO
      Michael Martin, who remains the quoted spokesperson for financing, AI
      strategy, and network expansion across both company and independent
      coverage. The assigned public record also surfaces Karin Marquez as a
      named public-safety workflow operator, but it does not expose a broader
      executive bench, board roster, or investor-control structure. That makes
      leadership continuity reasonably clear but governance quality hard to
      underwrite from public evidence alone. For later diligence chapters, the
      practical takeaway is that RapidSOS can be treated as founder-led, but
      not as governance-transparent.
    claimRefs: [CO009, CO012, CO013]
    tableRefs: [TO002]
  - id: funding-and-stakeholders
    title: Funding history and stakeholder map
    body: >-
      Funding visibility improved versus the prior report because both official
      and independent sources now point to a November 2025 $100 million
      financing led by Apax Digital Funds, taking total company-reported
      capital to more than $450 million. RapidSOS also links the financing to
      continued R&D spending, interoperability, and global expansion, while
      Government Technology adds useful context around acquisitions and
      partnership activity. Even so, the public file still stops short of the
      items investors actually need to price the security: round-by-round
      ownership, board rights, liquidation preferences, secondaries, debt, and
      the relationship between agency adoption metrics and enterprise
      monetization.
    claimRefs: [CO005, CO006, CO007, CO008, CO012, CO016]
    tableRefs: [TO003]
  - id: milestones-and-disclosure-gaps
    title: Milestones, conflicting profiles, and unresolved disclosure gaps
    body: >-
      The milestone record is now good enough to anchor the chapter timeline,
      but older financing history still depends on low-reputation aggregators
      rather than primary archives in the assigned pool. Those same
      aggregators create diligence noise by listing RapidSOS with a 2015
      founding date, only $220 million of funding, or much larger device and
      country counts than the company currently discloses elsewhere. None of
      those contradictions invalidate the core thesis that RapidSOS has become
      a scaled emergency-response platform, but they do raise clear
      verification work for the data room. The biggest remaining blind spots
      are economics, governance, and consistent metric definitions rather than
      company identity.
    claimRefs: [CO004, CO005, CO009, CO014, CO015, CO016]
    figureRefs: [FO001]
