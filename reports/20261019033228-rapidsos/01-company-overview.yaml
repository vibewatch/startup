  evidenceGaps:
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: Current board roster, committee structure, investor-control rights, and governance documents for the latest preferred round.
      whyItMatters: Governance quality and control rights materially affect downside protection, refresh-risk, and founder-dependence assessment.
      diligencePath: Request the current board deck, charter package, and financing documents from the data room or management.
      relatedQuestionRefs: [QO007]
      relatedTableRefs: [TO002]
    - type: conflicting-data
      severity: material
      topic: funding-history
      missingEvidence: Primary archive or investor documentation for older financing rounds and cumulative capital history.
      whyItMatters: Third-party profiles conflict with the company's later $450 million funding story and make milestone precision unreliable.
      diligencePath: Reconcile round history against signed financing documents, investor announcements, and the company cap table.
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: economics
      missingEvidence: Revenue, ARR, gross margin, burn, debt, and cohort retention or expansion metrics.
      whyItMatters: The company can be sized as a platform, but not underwritten on valuation without basic economic quality metrics.
      diligencePath: Request monthly or quarterly management financials plus customer-cohort revenue bridges.
      relatedTableRefs: [TO001, TO003]
    - type: conflicting-data
      severity: minor
      topic: scale-definitions
      missingEvidence: Definitions behind the different agency and device counts used across 2025-2026 public materials and low-reputation profiles.
      whyItMatters: Inconsistent denominators can overstate commercial traction or obscure the line between network reach and paying customers.
      diligencePath: Ask management to bridge direct customers, reachable agencies, active integrations, and connected-device counts in one metric dictionary.
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO001, TO003]
