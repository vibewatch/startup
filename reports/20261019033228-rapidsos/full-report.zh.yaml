    summary: 根据保留证据的序数定位，RapidSOS 在互操作性广度和部署灵活性上高于传统监控替代方案；但点名的厂商同业缺少更直接的证据。
    data:
      xAxis:
        label: 工作流互操作性广度
        min: 1
        max: 5
        low: 以电话为中心 / 窄
        high: 数字化集成 / 广
        description: Ordinal 1-5 scale inferred from retained evidence only.
        scale: ordinal
      yAxis:
        label: 买方控制力与部署灵活性
        min: 1
        max: 5
        low: 捆绑式 / 刚性
        high: 叠加式 / 灵活
        description: Higher scores reflect easier layering onto existing systems.
        scale: ordinal
      points:
        - label: RapidSOS
          x: 4.6
          'y': 4.4
          detail: 保留证据称其具备 API 式叠加、数字化 911 升级、GSOC 协同以及 1,300 个 CAD 集成。
        - label: 传统批发监控
          x: 1.4
          'y': 1.8
          detail: 保留的官方证据描述了模拟语音转接，以及有限的丰富数据集成。
        - label: 监控点解决方案
          x: 1.9
          'y': 2
          detail: 官方对比称，这些方案通过语音核验警报并联系 911，但定制能力和规模有限。
        - label: 垂直整合安防
          x: 2.2
          'y': 1.7
          detail: 在保留的官方对比中，捆绑硬件和额外集成工作降低了灵活性。
        - label: 大规模通知同业
          x: 2.8
          'y': 2.7
          detail: 面向买方的目录列出 Everbridge 等同业，但本次来源池保留的直接工作流证据很少。
        - label: 公共安全套件在位厂商
          x: 3.2
          'y': 2.5
          detail: 替代方案列表和 CAD 邻近关系暗示存在重叠，但保留的公开证据不足以明确说明其与 RapidSOS 的匹配度。
    approximationNotes: 坐标是有证据支撑的序数判断，而非第三方基准分数；它们总结的是保留的公开记录，不是实测胜率或市场份额。
    claimRefs:
      - CP003
      - CP004
      - CP008
      - CP009
      - CP010
      - CP011
      - CP012
      - CP013
      - CP014
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据支持从合作伙伴或企业活动走向经常性合同的商业路径，但尚不足以说明最终如何转化为利润率或现金。
    data:
      nodes:
        - id: device-enterprise-signal
          label: 联网设备与企业站点
          detail: 客户活动始于能够触发紧急工作流的设备、应用、传感器、摄像头或企业安防环境。
        - id: platform-integration
          label: RapidSOS 数据与互操作层
          detail: 公司借助 API、数据连接和安全网络链路，把紧急数据接入机构与企业工作流。
        - id: monitoring-workflow
          label: 监控与 AI 工作流
          detail: 人工监控、工作流定制和 AI 辅助分诊位于输入信号与紧急升级之间。
        - id: digital-escalation
          label: 911 / GSOC 协同
          detail: RapidSOS 提供数字化升级、协同和可视化工作流，把企业运营人员与公共安全机构连起来。
        - id: contract-revenue
          label: 订阅与服务收入
          detail: 公开证据暗示收入由经常性合同和服务组成，但没有披露定价、数量或结构。
        - id: margin-cash
          label: 毛利与现金创造
          detail: 利润率和现金结果取决于人工、集成投入、算力及支持成本，而这些成本尚未公开披露。
      edges:
        - from: device-enterprise-signal
          to: platform-integration
        - from: platform-integration
          to: monitoring-workflow
        - from: monitoring-workflow
          to: digital-escalation
        - from: digital-escalation
          to: contract-revenue
        - from: contract-revenue
          to: margin-cash
    approximationNotes: 本图展示机制，不是量化转化漏斗；保留来源没有披露逐阶段的定价或利润率计算。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI013
      - CI015
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: RapidSOS 在公共安全和企业场景中分层搭建合作伙伴数据接入、事件融合、HARMONY AI 与工作流分发能力。
    data:
      layers:
        - label: 联网输入
          detail: 进入安全网络的设备、应用、车辆、摄像头、警报、学校和企业信号。
          modules:
            - 2024 年 UNITE 发布时的 540M+ 联网设备
            - 2025 年 11 月公司更新中的 600M+ 设备 / 200+ 企业
            - 2026 年 4 月 AT&T 套餐中的 723M+ 设备 / 250+ 企业
          outputs:
            - 来电者位置
            - 健康档案
            - 车联网数据
            - 警报 / 视频上下文
        - label: 事件融合层
          detail: 将异质安全信号整合成统一的紧急事件全貌。
          modules:
            - 统一事件面板
            - Agency Share / Chat 上下文
            - GIS 地图与来电者上下文
          outputs:
            - 供 PSAP 与现场工作流使用的一套事件全景
        - label: HARMONY AI 服务
          detail: 在融合后的事件数据之上叠加自动化和解读能力。
          modules:
            - 实时转录 + AI 摘要
            - 翻译 / 转录
            - SOP 呈现
            - 非紧急呼叫自动化
            - Intelligent Analyst 报告
          outputs:
            - 运营人员决策支持
            - 跨辖区更快交接
        - label: 互操作性与网络传输
          detail: 沿跨机构和专用网络路径传递增强后的事件上下文。
          modules:
            - Real-Time Interoperability
            - Agency Share / Chat
            - AT&T ESInet 专用网络路径
          outputs:
            - 跨辖区路由支持
            - 随呼叫传递的情报
        - label: 企业与监控端
          detail: 将同一事件全貌延伸到企业安防和监控运营场景。
          modules:
            - 企业 GSOC 协同
            - 监控 API + 冗余站点
          outputs:
            - 企业升级响应
            - 全天候监控升级响应
        - label: 响应人员端点
          detail: 把统一上下文交给负责响应决策的人员和系统。
          modules:
            - UNITE 接警员工作区
            - 现场响应应用
            - CAD 关联调度工作流
          outputs:
            - PSAP 响应
            - 现场响应
    approximationNotes: 规模标记来自 2024-2026 年不同日期的公开说法，应理解为历史检查点，而不是标准化时间序列。
    claimRefs:
      - CE002
      - CE006
      - CE007
      - CE009
      - CE010
      - CE011
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: RapidSOS 从响应方采用扩展到企业和合作伙伴循环，但业务持续性证据仍落后于其公开覆盖范围的说法。
    data:
      items:
        - label: 机构切入点
          title: Public-safety agencies adopt core workflows
          touchpoints:
            - 2021 年 4,800+ 个 ECC
            - 截至 2025 年 22,000+ 家机构或客户
        - label: 设备与应用接入
          title: Connected-device and software partners feed the data layer
          touchpoints:
            - 2021 年 350M 台设备
            - 2025 年 200+ 家科技公司
        - label: 企业落地
          title: Retail and GSOC teams become a second customer surface
          touchpoints:
            - 面向《财富》500 强与物流行业的定位
            - 2025 年提到覆盖美国《财富》10 强中的 50%
        - label: 点名案例
          title: Public named references span pilots, integrations, and testimonials
          touchpoints:
            - Uber 试点
            - Honeywell 与 ecobee 集成
            - Walmart 用户证言
        - label: 扩张循环
          title: More integrations deepen enterprise and responder utility
          touchpoints:
            - 200+ 个科技公司连接
            - 1 million+ 一线响应人员用户
        - label: 持续性证据缺口
          title: Public evidence still lacks cohort and concentration proof
          touchpoints:
            - 没有公开 NRR 或流失率
            - 没有头部客户或合作伙伴收入分成披露
    claimRefs:
      - CU001
      - CU006
      - CU007
      - CU009
      - CU010
      - CU011
      - CU015
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 碎片化的公共安全基础设施与敏感数据相交、而外部控制证据又薄弱的地方，残余风险最高。
    data:
      columns:
        - label: 发生可能性
          detail: 没有新增控制措施时风险暴露的概率。
        - label: 影响
          detail: 对结果、采购或融资的后果。
        - label: 缓释成熟度
          detail: 当前公开缓释措施的具体程度。
        - label: 致命触发因素
          detail: 会实质性恶化投资逻辑的事件。
      rows:
        - label: 隐私 / 留存
          note: 自动共享紧急数据已有公开说明；下游机构控制措施则没有。
          values:
            - label: 中
            - label: 高
            - label: 低—中
              detail: 证据大多是描述性的，未经审计。
            - label: 尽调中没有 DPA、留存或模型治理材料包
        - label: 路由 / 互操作性
          note: 关键任务工作流仍需穿越碎片化辖区和 CAD 技术栈。
          values:
            - label: 中
            - label: 高
            - label: 中
              detail: 已有现场测试，但实时错误率趋势未公开。
            - label: 持续交接失败或宕机披露
        - label: 渠道 / 合作伙伴依赖
          note: 政府接入和数据丰富度都依赖外部合作伙伴。
          values:
            - label: 中
            - label: 中—高
            - label: 中
            - label: 合作伙伴推动的部署明显放缓
        - label: 运营规模
          note: 平台覆盖庞大的机构、响应人员和 CAD 足迹，单个缺陷可能被放大。
          values:
            - label: 低—中
            - label: 高
            - label: 中
            - label: 模块级宕机或大范围集成中断
        - label: 财务披露不透明
          note: 融资情况公开，但收入质量和单位经济性不公开。
          values:
            - label: 高
            - label: 中—高
            - label: 低
              detail: 最有力的公开缓释信息只有融资金额，而非经营证明。
            - label: 单位经济性证据出现前就启动下一轮融资
        - label: 安全 / AI 治理证明缺口
          note: 认证、漏洞历史和模型控制措施的独立证据仍然缺失。
          values:
            - label: 中
            - label: 高
            - label: 低
            - label: 尽调中无法提供当前外部控制证据
    approximationNotes: 序数标签总结本次来源池中的公开证据；它们是分析评级，不是来源作者给出的分数。
    claimRefs:
      - CR001
      - CR006
      - CR007
      - CR008
      - CR010
      - CR013
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开规模和融资能力确实有证据支撑，但经营数据缺失、融资历史混乱，估值判断仍只能停在继续研究。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: 22,000+ 家机构、200+ 家企业、600M+ 台设备、5,800+ 个集成。
          claimRefs:
            - CV009
        - id: strategic-capital
          label: 战略资本获取
          detail: $100M Apax 领投轮次及持续融资能力，显示投资人信心。
          claimRefs:
            - CV003
            - CV006
            - CV012
        - id: economic-gap
          label: 经营数据披露缺口
          detail: 没有公开收入、ARR、利润率或续约指标为估值倍数提供锚点。
          claimRefs:
            - CV008
        - id: financing-opacity
          label: 融资不透明
          detail: 不同来源的累计金额相互冲突，2026 年 4 月轮次金额未披露。
          claimRefs:
            - CV001
            - CV002
            - CV005
            - CV007
            - CV015
        - id: stretched-stance
          label: 估值立场：偏高
          detail: $1B 估值标记可能真实，但估值的价格支撑仍弱于增长故事。
          claimRefs:
            - CV002
            - CV008
            - CV013
        - id: recommendation
          label: 建议：继续研究
          detail: 等待更好的经营数据或更好的价格，再上调判断。
          claimRefs:
            - CV016
      edges:
        - from: scale
          to: strategic-capital
          label: 支持
          claimRefs:
            - CV009
            - CV012
        - from: strategic-capital
          to: economic-gap
          label: 仅凭此项不足
          claimRefs:
            - CV006
            - CV008
        - from: economic-gap
          to: financing-opacity
          label: 因……而恶化
          claimRefs:
            - CV001
            - CV005
            - CV007
            - CV015
        - from: financing-opacity
          to: stretched-stance
          label: 推动
          claimRefs:
            - CV002
            - CV013
        - from: stretched-stance
          to: recommendation
          label: 导致
          claimRefs:
            - CV016
    approximationNotes: 本图是定性决策链，不是量化估值模型。
    claimRefs:
      - CV006
      - CV008
      - CV009
      - CV012
      - CV013
      - CV015
      - CV016
