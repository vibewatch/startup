        title: 融资能力和运营规模真实存在；现金创造仍不透明
        blocks:
          - type: paragraph
            body: >-
              留存的公开融资证据充分证明了募资规模和当前市场支持。RapidSOS 称其 2024 年 3 月融资新增 $75 million，完成一轮 $150 million 融资；之后的公告和独立报道称，2025
              年融资又增加 $100 million，使累计融资超过 $450 million。同一批材料还描述了可观的运营覆盖：2023 年处理超过 3 billion 条数据流和 171 million 起紧急事件；到
              2025 年融资时，服务已覆盖 22,000 多家机构和超过 600 million 台联网设备。这些采用代理指标支持商业相关性，但不能替代收入、利润率、续约或自由现金流披露。
