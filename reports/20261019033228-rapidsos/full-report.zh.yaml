              现有里程碑记录已经足以支撑本章时间线，但较早的融资历史仍依赖指定材料池中的低信誉聚合网站，而非一手档案。这些聚合网站还制造了尽调噪音：它们将 RapidSOS 的成立年份列为 2015 年、融资额仅 $220
