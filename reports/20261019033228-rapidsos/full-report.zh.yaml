  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现入口清晰，但公开定价缺失
        blocks:
          - type: paragraph
            body: >-
              从 RapidSOS 已公开的商业版图，已经能看出资金很可能从哪些业务流入公司。公司材料描述了面向技术合作伙伴的一站式专业监控、语音和数据连接服务，也描述了将 GSOC 和员工安全工具以数字方式接入 911
              的企业工作流。一家第三方融资数据库将收入模式标为订阅制，这与公司的定位大体一致。投资人真正需要用来评估收入质量的部分却没有公开：留存来源没有披露标价、标准合同条款或任何实际定价证据。因此，公开分析可以识别收入来源，却无法判断这些来源当前的组合、折扣或利润率质量。
            claimRefs:
              - CI001
