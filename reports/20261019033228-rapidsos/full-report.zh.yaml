      - number: '7.2'
        title: 监管与数据治理风险
        blocks:
          - type: paragraph
            body: >
              指定材料池中看不到明显诉讼，法律风险来自敏感应急数据、自动共享以及公开控制披露不足的叠加。RapidSOS
              及其分销商把实时转录、位置、医疗信息和跨机构共享作为产品优势。竞争对手对比同时提出了更难的尽调问题：一旦医疗或事件数据从用户画像进入地方公共安全工作流，后续留存和使用可能不再像医院环境那样受治理。这并不能证明存在不合规，但意味着隐私、记录留存和
              AI 输出治理必须直接通过产品、安全和客户文档核验，而不能从市场材料反推。


              公开记录也不足以单独通过安全尽调。指定材料池缺少外部审计引用、公开漏洞披露或 HARMONY AI 的详细模型治理材料。在管理层能够提供这些信息之前，这仍是一个重大尽调缺口，而不是已解决的优势。
            claimRefs:
              - CR001
              - CR010
              - CR012
              - CR014
