      - number: '1.2'
        title: 领导层、治理透明度与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              目前可见的领导层叙事集中在创始人兼 CEO Michael Martin 身上。无论公司还是独立报道，涉及融资、AI 战略和网络扩张时，他都是主要引述对象。指定公开记录还将 Karin Marquez
              列为公共安全工作流负责人，但没有披露更完整的高管梯队、董事会名单或投资人控制结构。领导层延续性因此相对清晰，但仅凭公开证据仍难以评估治理质量。后续尽调可将 RapidSOS 视为创始人主导，但不能视为治理透明。
