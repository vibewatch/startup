      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              投资人可以判断 RapidSOS
              已经搭建起规模可观的应急响应网络，并且仍能获得资本支持扩张；但不能判断当前业务是否在高效地把这张网络变现。收入质量的方向是正面的，因为业务看起来具有经常性、深度嵌入工作流，并得到知名企业和机构客户采用的支持。核心障碍在于，漏斗顶部以下几乎所有估值所需输入仍属私有信息：公开来源没有披露实际定价、按模块划分的收入组合、毛利率、销售效率、客户集中度、续约行为、现金消耗、债务义务或账上现金。在管理层提供这些信息前，财务判断应保持为“商业平台可信，但公开财务信息不足”。
