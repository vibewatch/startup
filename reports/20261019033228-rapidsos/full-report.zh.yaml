  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险态势
        blocks:
          - type: paragraph
            body: >
              首要风险是关键任务级工作流中的执行风险，而这些工作流仍依赖碎片化的电信、CAD 和机构交接路径。RapidSOS 自己 2026 年的互操作性发布称，跨辖区呼叫仍会迫使团队手工协调；基础设施受损时，错误率超过
              10%。第三方评论还提醒，覆盖范围因地区而异，部分 911 中心尚未支持该集成。因此，可靠性和采用覆盖是首要投资评估问题：平台可能具有战略重要性，但安全结果仍取决于最后一公里的机构和软件环境，而不只是
              RapidSOS 的产品主张。


              第二个风险簇是治理。RapidSOS 正从定位数据延伸到实时转录、摘要、翻译、医疗数据和跨辖区协调，这会放大隐私、留存和模型治理风险。公开证据确认了工作流扩张，但指定材料池没有提供当前安全认证、漏洞历史或
              HARMONY AI 治理控制的独立证据。财务风险确实存在，但排在其次：2025 年融资给了公司继续建设的时间；然而，同一批来源显示资金仍专门用于研发、规模化和互操作性，而非已经成熟、自我造血的商业模式。
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR010
              - CR013
              - CR014
