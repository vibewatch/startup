      - number: '1.3'
        title: 融资历史与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              与上一份报告相比，融资信息更清晰：官方和独立来源都指向 2025 年 11 月由 Apax Digital Funds 领投的 $100 million 融资，公司披露的累计资本由此超过 $450
              million。RapidSOS 还将这轮融资与持续研发、互操作性和全球扩张联系起来，Government Technology
              则补充了并购和合作活动的背景。即便如此，公开材料仍缺少投资人真正需要用来定价的内容：逐轮持股、董事会权利、清算优先权、老股转让、债务，以及机构采用指标与企业变现之间的关系。
