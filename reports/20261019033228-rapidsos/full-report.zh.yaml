chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与当前规模
        blocks:
          - type: paragraph
            body: >-
              RapidSOS 将自己定位为应急响应领域的关键任务级 AI，把公共安全机构、企业和联网设备接入同一应急情报操作层。独立报道与这一基本公司身份一致：Government Technology 将 RapidSOS
              描述为一家总部位于纽约、2012 年成立的公司，通过联网传感器、摄像头及其他设备提供紧急事件探测与响应服务。当前规模披露的方向较为可信，但不同来源并不完全一致。2025 年和 2026 年官方材料支持“已支持超过
              10 亿起紧急事件”、覆盖 22,000 多至 23,500 多家机构，以及广泛的企业覆盖；但指定证据没有解释这些指标的确切口径。
            claimRefs:
