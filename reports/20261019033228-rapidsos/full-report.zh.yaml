      - number: '4.2'
        title: GTM 与交付经济性体现服务属性，且可能高度依赖集成
        blocks:
          - type: paragraph
            body: >-
              公开记录表明，RapidSOS 并非纯粹的低接触 SaaS 销售。TechCrunch 报道称，一些大型合作伙伴在集成上线前需要定制工程和产品工作；同一篇报道还称，至少一家潜在合作伙伴最初等待 PSAP
              覆盖扩大后才承诺合作。公司营销材料也强调单一
              API、人工监控、工作流定制和地理冗余的运营站点。综合来看，这是一家包含重要交付服务和客户导入环节的软件公司。产品深度嵌入应急工作流时，这种模式可能更有吸引力，但也意味着
              CAC、回本周期和贡献利润率的披露比目前重要得多。
