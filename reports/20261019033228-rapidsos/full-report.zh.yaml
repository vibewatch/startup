    rows:
      - - NG911 数据采集和话务员工作流软件
        - 将呼叫者、设备、位置、健康和 CAD 邻近数据送入 ECC 工作流的软件
        - 核心 PSAP 电话硬件、无线电基础设施和通用市政 IT
        - ECC 管理层、公共安全机构、地方或州级公共安全预算
        - 核心市场，因为 Frost 和公司来源都围绕 NG911 采用强调工作流统一。
      - - 企业到 911 的数字升级
        - 将 GSOC、报警系统、摄像头以及楼宇／IoT 告警直接连接到 911 升级流程的软件
        - 不连接响应方而销售的通用摄像头、报警硬件和通用视频分析
        - 企业安全、风险、安全保障和损失预防预算
        - 之所以作为相邻市场列出，是因为企业需求是 RapidSOS 明确的采购路径之一。
      - - 监控与联网设备响应赋能
        - 通过 API 和监控工作流核实紧急事件，并把更丰富的事件数据传给响应人员
        - 没有软件或数据集成的独立监控人力
        - 联网设备平台、监控服务商与嵌入式合作伙伴
        - 与本报告相关，因为 RapidSOS 将合作伙伴集成定位为规模化引擎和分发路径。
      - - 相邻但排除在外的安全支出
        - 无；按范围外市场处理
        - 消费硬件销售、保险理赔处理和广义实体安保服务
        - 产品负责人和采购流程均不同
        - 予以排除，避免把非互操作性支出计入 TAM 而虚增规模。
    notes: 边界表将软件／数据互操作支出与硬件及通用安保服务区分开来；这些排除项是有意设置的范围控制，不是缺乏依据地填入零值。
