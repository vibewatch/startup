      - number: '8.3'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              从战略逻辑看，RapidSOS 具备退出可能性，但公开投资评估质量尚未跟上。最强的退出叙事是：RapidSOS
              已经搭建起连接企业、传感器、监控和公共安全机构的互操作性层，这可能对公共安全软件、保险、工业或安全买方有价值。公司材料也把产品定位为模拟监控的更快替代方案；零售工作流案例以缩短感知时间、改善事件协同，讲出了一套清晰的
              ROI 逻辑。即便如此，剩余要求仍是决定性的：对账后的融资台账、当前股权结构表和优先权条款、收入质量和利润率数据、客户集中度和模块搭售率，以及 AI
              驱动工作流扩张确实带来变现而非仅仅扩充产品范围的证据。只有这些事项得到证明，且入场价格仍能补偿当前公开记录中包含的稀释、执行和商业化风险，买入逻辑才应重新打开。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 当前判断：继续研究
            body: RapidSOS 的规模和投资人质量足以留在尽调名单中，但公开财务披露仍不足以支持按最新私人估值标记支付价格。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV008
              - CV015
              - CV016
          - type: callout
            title: 为何继续关注
            body: 机构、企业、设备和集成数量表明 RapidSOS 已搭建起具有战略意义的应急响应网络，而不是一个狭窄的单一产品点解决方案。
            calloutType: strength
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: callout
            title: 为何估值仍显紧张
            body: 公开来源对累计融资额存在分歧，且仍未披露最新未披露轮次的收入、利润率或融资条款，因此估值支撑比增长势头更薄。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV015
