      - number: '8.2'
        title: 融资背景与情景
        blocks:
          - type: paragraph
            body: >-
              融资背景在方向上积极，但数字混乱。RapidSOS 和 Apax 都称 2025 年 11 月融资为 $100 million，并称累计融资超过 $450
              million；第三方数据库还显示，在这轮融资之后，2026 年 4 月存在一轮未披露融资。问题在于公开记录无法对账：FundedIQ 记录七轮融资合计 $335 million，Tracxn 列出 $508
              million 和 $1 billion 的估值标记，Government Technology 则称公司融资历史包括 2024 年初一轮 $150 million
              融资。因此，投资评估的关键问题不是投资人是否还愿意支持公司——答案显然是愿意——而是外部投资人能否厘清今天的价格所对应的资本结构，并用可靠的收入基础支撑这一价格。情景范围应围绕披露和去风险里程碑，而不是在退出倍数上制造虚假的精确度。
            claimRefs:
              - CV001
