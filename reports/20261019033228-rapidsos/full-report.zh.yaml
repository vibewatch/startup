      - number: '7.3'
        title: 运营与合作伙伴执行风险
        blocks:
          - type: paragraph
            body: >
              从运营角度看，RapidSOS 正试图处在一个庞大且仍高度异质的响应网络中央。公司材料称，2024 年覆盖超过 21,000 家机构；2024 年末已有 1,300 个 CAD 集成和 100
              万名一线响应人员；2026 年企业页面则称覆盖 23,500 多家机构。这些规模指标在方向上积极，但也定义了路由、翻译或跨机构协调功能失灵时的影响半径。RapidSOS
              自己的监控对比仍把在位方案描述为缓慢、以语音为先的工作流，因此买方需要相信，RapidSOS 以 API 为核心的替代方案比它所批评的传统系统更有韧性。


              分发和采用也仍然对合作伙伴敏感。ExecutiveBiz 报道称，Vertosoft 正通过合同工具和渠道赋能扩大机构接入；公司和 GovTech 的融资公告也强调持续合作与互操作性。这支持 RapidSOS
              借助生态系统增长的判断，但也意味着，即使终端市场需求保持健康，停滞的经销商、软件伙伴或公共部门采购伙伴仍可能拖慢部署。
