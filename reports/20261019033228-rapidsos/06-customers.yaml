  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-gaps
      missingEvidence: Customer-level NRR, GRR, logo churn, renewal rate, and average contract duration by agency and enterprise cohorts.
      whyItMatters: Without retention data, the report cannot distinguish broad logo acquisition from durable recurring customer value.
      diligencePath: Request cohort retention schedules, renewal rates, contract terms, and customer references segmented by agency and enterprise products.
      relatedQuestionRefs: [QU005]
    - type: enumeration-incomplete
      severity: material
      topic: named-deployments
      missingEvidence: A complete current list of named production customers, pilot customers, and reference accounts with deployment status and date.
      whyItMatters: The public sample shows adoption surfaces, but it is too curated to support claims about breadth, production depth, or reference quality across the installed base.
      diligencePath: Request a current customer list with production versus pilot status, launch dates, use cases, and permissioned reference calls.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: adverse-customer-evidence
