company:
  name: RapidSOS
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer evidence supports a real two-sided footprint spanning emergency agencies,
    enterprise security teams, and connected-device partners, with adoption metrics rising
    sharply from 2020 through 2025. The gap is durability: retained sources show named
    deployments and outcome anecdotes, but they do not disclose renewal, churn, contract
    length, or concentration data needed to judge customer quality.
sections:
  - id: customer-footprint
    title: Customer footprint now spans agencies, enterprises, and platform partners
    body: >-
      RapidSOS's customer evidence supports a broadening buyer mix rather than a single
      public-sector niche. Company and independent sources align that the platform serves a
      large base of public-safety agencies while also selling into enterprise security and
      partnering with connected-device ecosystems. The 2025 financing announcement frames the
      platform as used by 22,000+ federal, state, local, and defense agencies plus 200+
      global enterprises, while the retail vertical page shows deliberate positioning toward
      Fortune 500 security teams and logistics operators. That mix matters because it implies
      RapidSOS is monetizing both responder-side workflow adoption and enterprise-to-911
      connectivity, but the public file still does not separate who pays, who uses, or how
      much revenue each segment contributes.
    claimRefs: [CU001, CU002, CU006, CU007, CU014]
    tableRefs: [TU001, TU002]
  - id: named-proof
    title: Named customer proof is credible but skewed toward pilots, partner stories, and anecdotes
    body: >-
      The named customer record is real enough to reject a logo-only story, but it remains
      uneven in quality. Public proof ranges from an Uber pilot and consumer-app safety
      partnership to Honeywell and ecobee integrations plus a Walmart GSOC testimonial on the
      retail vertical page. Those references demonstrate that RapidSOS is embedded in
      multiple workflows across public safety, smart home, and enterprise security surfaces.
      Still, most examples are company-selected proof points or partner case studies, and the
      public materials seldom say whether the relationship is a paid production deployment, a
      pilot, or an expansion from a smaller initial rollout.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU016]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability and concentration remain the central diligence gaps
    body: >-
      The strongest customer risk is not lack of logos; it is lack of public durability
      evidence. Across retained sources, RapidSOS discloses platform scale, devices,
      emergency volumes, and selected outcome anecdotes, but not NRR, GRR, gross churn,
      average contract duration, or top-customer concentration. The Neoteric case study also
      preserves an early signal that parts of the workflow once required client-specific
      customization, which is relevant because scaling customer-specific implementations can
      pressure deployment velocity and service margins. Without cohort, renewal, or channel
      mix data, the public customer narrative supports adoption breadth but not the quality
      or resilience of the installed base.
    claimRefs: [CU013, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Public-safety agencies
        - Agency leadership and telecommunicators / ECC and responder users / payer not disclosed
        - Telephony, dispatch, and emergency-intelligence workflows
        - 22,000+ agencies in 2025 company disclosure; 4,800+ ECCs in 2021 disclosure
        - Core installed base and credibility anchor for ecosystem partners
        - No segment revenue, renewal, or attach-rate disclosure
      - - Enterprise security and GSOCs
        - Corporate security leadership / GSOC operators and store or site teams / enterprise payer
        - Digital escalation to 911, incident coordination, employee and asset protection
        - 200+ global enterprises and 50% of the US Fortune 10 in 2025 company disclosure
        - Key land-and-expand vector beyond public agencies
        - No disclosed contract value, deployment count by vertical, or churn
      - - Connected-device and software partners
        - Platform or device provider / end user plus responder workflows / commercial model not disclosed
        - Device, app, vehicle, alarm, and software data routed into emergency workflows
        - 200+ tech companies in 2025 company disclosure; named examples include Honeywell and ecobee
        - Expands data network effects and distribution reach
        - Public sources do not disclose partner revenue share or exclusivity
    notes: >-
      Scale signals are mostly company-reported and mix agencies, enterprises, and partners;
      retained sources do not disclose payer mix, revenue contribution, or cohort quality.
    claimRefs: [CU001, CU002, CU007, CU010, CU011, CU014]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - ECC coverage
        - 4,800+ ECCs; 92% of US population
        - "2021-02-09"
        - PRNewswire company release
        - Medium
        - Shows meaningful agency penetration before later AI upsell narrative
        - Paid vs free mix and active-seat count
      - - Emergency volume
        - 150M emergencies in 2020
        - "2021-02-09"
        - PRNewswire company release
        - Medium
        - Indicates real production usage, not only pilots
        - Share tied to paying customers or premium modules
      - - Network scale
        - 500M+ devices; 15,000+ first responder agencies; 1M+ first responders
        - Profile date not stated; emergency volume is for 2022
        - MVP portfolio review
        - Medium
        - Suggests continued expansion after the 2021 footprint
        - Methodology behind agency and user counts
      - - Current public-safety footprint
        - 22,000+ agencies / customers
        - 2025 financing coverage
        - RapidSOS announcement corroborated by Government Technology
        - High
        - Supports a much larger installed base by late 2025
        - Split between agencies, defense, and enterprise entities
      - - Ecosystem and enterprise scale
        - 200+ tech companies; 50% of US Fortune 10; more than 1B emergencies supported
        - 2025 financing announcement
        - RapidSOS official site
        - Medium
        - Points to enterprise expansion and network-effect storytelling
        - Enterprise logos by module, spend, and production depth
    notes: >-
      Rows mix different units and company-defined populations, so the table shows trajectory
      rather than a like-for-like funnel; public sources omit active-customer, ARR, and cohort denominators.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Uber
        - Mobility platform
        - In-app 911 feature with emergency authorities in multiple cities
        - Pilot
        - Demonstrates early app-platform adoption surface
        - Public proof is historical and does not disclose current commercial scope
      - - Honeywell Building Technologies
        - Enterprise / building safety
        - CLSS linked to RapidSOS to send fire and hazard data to ECCs
        - Production relationship implied
        - Shows enterprise integration path into emergency response workflows
        - Source is company-authored; no contract value or deployment count
      - - ecobee
        - Smart home security
        - Smart Security professional monitoring connection with ECCs powered by RapidSOS
        - Production relationship implied
        - Indicates consumer-device channel proof beyond agencies
        - No renewal, volume, or monetization detail
      - - Walmart
        - Global retail GSOC
        - Public testimonial from Walmart's VP of Global Security - GSOC
        - Production relationship implied
        - Named enterprise reference on the retail vertical page
        - Page does not disclose scope, contract term, or quantified Walmart-specific outcome
    notes: >-
      This is a partial public sample of named proofs, not an exhaustive customer list; logos
      and testimonials do not establish contract size, renewal quality, or uniform production depth.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly named customer and partner examples retained from the assigned source pool for
        the 2018-2025 window; the pool does not provide a complete customer roster.
    claimRefs: [CU008, CU009, CU010, CU011, CU012]
figures:
