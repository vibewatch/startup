    title: Customer journey map
    type: journey-map
    summary: RapidSOS expands from responder-side adoption into enterprise and partner loops, but public durability proof lags public footprint claims.
    data:
      items:
        - label: Agency foothold
          title: Public-safety agencies adopt core workflows
          touchpoints:
            - 4,800+ ECCs in 2021
            - 22,000+ agencies or customers by 2025
        - label: Device and app ingestion
          title: Connected-device and software partners feed the data layer
          touchpoints:
            - 350M devices in 2021
            - 200+ tech companies in 2025
        - label: Enterprise land
          title: Retail and GSOC teams become a second customer surface
          touchpoints:
            - Fortune 500 and logistics positioning
            - 50% of US Fortune 10 cited in 2025
        - label: Named proof
          title: Public named references span pilots, integrations, and testimonials
          touchpoints:
            - Uber pilot
            - Honeywell and ecobee integrations
            - Walmart testimonial
        - label: Expansion loop
          title: More integrations deepen enterprise and responder utility
          touchpoints:
            - 200+ technology-company connections
            - 1 million+ first responder users
        - label: Durability gap
          title: Public evidence still lacks cohort and concentration proof
          touchpoints:
            - No public NRR or churn
            - No top-customer or partner revenue-share disclosure
    claimRefs: [CU001, CU006, CU007, CU009, CU010, CU011, CU015, CU016]
callouts:
  - calloutType: risk
    title: Public traction is credible; public durability is not
    body: >-
      RapidSOS has enough named deployments and scale disclosures to support real adoption, but
      the public file still lacks the renewal, churn, concentration, and contract-value data
      needed to assess customer quality with underwriting confidence.
    claimRefs: [CU001, CU006, CU015, CU016]
