slug: rapidsos
runDate: "2026-10-19"
company:
  name: RapidSOS
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    RapidSOS is selling into an interoperability market that sits between connected devices,
    enterprise security workflows, and 911/public-safety operations rather than into a generic
    hardware or broad "safety tech" bucket. Public evidence supports strong adoption drivers
    around NG911 modernization, rising machine-generated emergency data, and enterprise safety
    pain, but it does not support a clean public TAM/SAM/SOM because pricing, procurement values,
    and segment-level budget ownership remain opaque.
sections:
  - id: market-boundary
    title: Market boundary and status-quo substitutes
    body: >-
      The relevant market boundary is the software and data layer that moves emergency context
      from devices, enterprise systems, and monitoring workflows into emergency communications
      centers and first responders. Frost & Sullivan frames the opportunity around NG911
      deployments plus the proliferation of connected vehicles, wearables, smart-city signals,
      and other machine-generated inputs that need to be normalized for public safety workflows.
      RapidSOS's own enterprise material points to the same boundary from the opposite side:
      the historical substitute is still a 10-digit phone call, verbal incident description, and
      manual data entry between a monitoring center or GSOC and 911. That means the category is
      best understood as an interoperability and workflow-automation layer, not a camera, sensor,
      or consumer-app market by itself.
    claimRefs: [CM001, CM002, CM003, CM004, CM010]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing and adoption lenses
    body: >-
      The public record supports adoption proxies better than it supports revenue TAM. Frost &
      Sullivan provides the cleanest outside demand signal, arguing that sensor-initiated 9-1-1
      calls may surpass human-initiated emergency calls by year-end 2028, which implies rising
      throughput for vendors that can ingest and prioritize non-voice signals. Company and
      partner surfaces then show installed-base reach rather than spend pools: RapidSOS cites a
      network spanning hundreds of millions of connected endpoints, hundreds of enterprise
      partners, tens of thousands of agencies, and more than one billion emergencies supported.
      Those counts are directionally useful but not stable enough to treat as a precise TAM:
      different current and prior publications cite different device and agency totals, while no
      public source discloses pricing tiers, budget conversion, or attach rates needed to bridge
      installed reach into revenue opportunity.
    claimRefs: [CM007, CM008, CM009, CM013, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyer map, demand drivers, and adoption constraints
    body: >-
      The buyer map is multi-sided. Public-safety agencies and emergency call centers are the
      operational users on the receiving side, while enterprise security teams, monitoring
      providers, and connected-device companies are upstream payers or channel partners that need
      verified digital escalation into 911. Demand is supported by several concrete pain points:
      understaffed 911 centers need workflow consolidation, enterprise security teams want earlier
      visibility and fewer analog handoffs, and sectors such as retail explicitly frame violent
      incidents, shrink, and worker safety as budget-level problems. The main constraint is that
      public sources still do not isolate who signs the check by segment, what contract sizes
      look like, or how much of RapidSOS's installed reach translates into recurring software
      spend, so valuation work should anchor on diligence around pricing, procurement, and attach
      rates rather than extrapolating from headline network counts.
    claimRefs: [CM003, CM005, CM006, CM011, CM012, CM014, CM015]
    tableRefs: [TM003]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - NG911 data-ingestion and telecommunicator workflow software
        - Software that brings caller, device, location, health, and CAD-adjacent data into ECC workflows
        - Core PSAP telephony hardware, radio infrastructure, and general municipal IT
        - ECC leadership, public-safety agencies, local or state public-safety budgets
        - Core market because Frost and company sources both center workflow unification around NG911 adoption
      - - Enterprise-to-911 digital escalation
        - Software linking GSOCs, panic systems, cameras, and building/IoT alerts directly into 911 escalation
        - Commodity cameras, alarm hardware, and generic video analytics sold without responder connectivity
        - Corporate security, risk, safety, and loss-prevention budgets
        - Important adjacently because enterprise demand is one of RapidSOS's explicit buying paths
      - - Monitoring and connected-device response enablement
        - APIs and monitoring workflows that verify emergencies and pass richer incident data to responders
        - Standalone monitoring labor without software or data integration
        - Connected-device platforms, monitoring providers, and embedded partners
        - Relevant because RapidSOS positions partner integrations as a scale engine and distribution path
      - - Adjacent but excluded safety spend
        - None; treated as outside the scoped market
        - Consumer hardware sales, insurance claims handling, and broad physical-security services
        - Separate product owners and procurement processes
        - Excluded to avoid inflating TAM with non-interoperability spend
    notes: >-
      Boundary table distinguishes software/data-interoperability spend from hardware and generic
      security services; exclusions are intentional scope controls rather than unsupported zeros.
    claimRefs: [CM001, CM004, CM005, CM010]
  - id: TM002
    title: TAM/SAM/SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value / lens
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - Frost & Sullivan
        - "2024"
        - North America
        - Sensor-initiated 9-1-1 calls may surpass human-initiated emergency calls by year-end 2028
        - null
        - Analyst forecast on NG911 demand and rising machine-generated emergency inputs
        - high
        - Adoption signal, not a spend-based TAM
      - - RapidSOS
        - "2026"
        - Global network footprint
        - 723M+ devices, 250+ enterprises, 23,500+ agencies, 1.1B+ emergencies supported
        - null
        - Company-reported installed-base snapshot from partner page
        - medium
        - Company-controlled metric set with mixed units and no revenue bridge
      - - RapidSOS via PR Newswire
        - "2025"
        - Global network footprint
        - 600M devices, 200+ enterprises, 22,000+ agencies, 1B emergencies supported
        - null
        - Company-issued financing announcement
        - medium
        - Earlier snapshot that conflicts with later company/partner counts
      - - Preqin
        - "2026"
        - US and Canada operating markets
        - Subscription platform for agencies and enterprises; pricing undisclosed
        - null
        - Paywalled market profile with business-model summary
        - medium
        - No public TAM, SAM, SOM, contract value, or margin data
    notes: >-
      Public evidence supports adoption and business-model lenses rather than a defensible
      revenue TAM; null CAGR means the source did not publish a comparable growth rate.
    claimRefs: [CM006, CM007, CM008, CM013, CM014]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Emergency call centers / public safety
        - Agency leadership and ECC administrators
        - Telecommunicators, dispatch supervisors, and first responders
        - Public-safety agency or municipal emergency-communications budget
        - Consolidate caller, device, and responder data into one emergency workflow
        - Publicly unspecified beyond agency ownership
        - Higher call volume, staffing pressure, and NG911 modernization
      - - Enterprise / corporate security
        - GSOC and corporate security leadership
        - Security operators, store or site leaders, crisis managers
        - Corporate security, risk, or loss-prevention budget
        - Digitally escalate incidents to 911 and gain earlier incident visibility
        - Likely security or loss-prevention, but public sources do not show approval chain
        - Violent incidents, shrink, worker-safety exposure, and response-time reduction
      - - Monitoring / connected-device platforms
        - Platform operators and monitoring partners
        - Monitoring specialists and embedded emergency-response teams
        - Partner platform or service budget
        - Verify sensor alerts and pass richer data to ECCs
        - Publicly unspecified
        - Need for richer data handoff than analog voice calls
      - - Large enterprises and public-sector partners
        - Program owners integrating campuses, fleets, schools, or field assets
        - Onsite responders, dispatch liaisons, mutual-aid users
        - Program-specific safety or operations budget
        - Connect assets and facilities into RapidSOS's safety network
        - Not publicly segmented
        - Multi-site coordination and interoperability across jurisdictions
    notes: >-
      Budget-owner fields stay qualitative where sources identify the segment but not the formal
      approver, which is a live diligence gap rather than an omitted column.
    claimRefs: [CM005, CM006, CM011, CM012, CM015]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Public sources support an installed-network adoption lens, not a spend-based TAM, so the
      layers below mix units and should be read as scope markers rather than a conversion funnel.
    data:
      nodes:
        - label: Connected endpoints
          displayValue: 600M-723M
          unit: devices
          note: Earlier and later public snapshots disagree on the exact installed-base count.
          claimRefs: [CM007, CM008, CM009]
        - label: Enterprise ecosystem
          displayValue: 200+-250+
          unit: enterprises
          note: Company publications show enterprise partners in the hundreds rather than an explicit TAM.
          claimRefs: [CM007, CM008]
        - label: Agency reach
          displayValue: 22,000+-23,500+
          unit: agencies
          note: Reach is large but reported agency totals vary across publications.
          claimRefs: [CM007, CM008, CM009]
        - label: Field-user layer
          displayValue: 1M+
          unit: first responder users
          note: User count is an adoption proxy, not a payer count.
          claimRefs: [CM008]
        - label: Covered population
          displayValue: 99.7%
          unit: US population
          note: Coverage is a footprint metric rather than a revenue denominator.
          claimRefs: [CM015]
        - label: Historical throughput
          displayValue: 1.0B-1.1B+
          unit: emergencies supported
          note: Shows cumulative usage scale but not monetized transaction volume.
          claimRefs: [CM007, CM008, CM014]
    approximationNotes: >-
      This figure intentionally uses heterogeneous installed-base and usage markers because public
      sources do not disclose a comparable TAM, SAM, SOM, or pricing bridge.
    claimRefs: [CM007, CM008, CM009, CM014, CM015]
callouts:
  - calloutType: insight
    title: The category is workflow interoperability, not endpoint hardware
    body: >-
      The strongest outside evidence points to demand for software that normalizes and routes
      machine-generated emergency context into 911 workflows, so hardware/device counts should be
      treated as demand inputs rather than as the market itself.
    claimRefs: [CM001, CM002, CM013]
  - calloutType: risk
    title: Public TAM remains too coarse for valuation shortcuts
    body: >-
      Without public pricing, contract values, or budget-owner disclosure, investors cannot
      convert RapidSOS's installed reach into a reliable revenue opportunity model from open
      sources alone.
    claimRefs: [CM006, CM014]
