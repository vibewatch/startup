  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: Signed round documents or a cap-table summary covering liquidation preferences, pro-rata rights, board seats, vetoes, and any compute-credit or strategic side-letter economics.
      whyItMatters: Common-equity returns at a $5.1 billion seed entry can change materially if senior securities or control rights protect new capital ahead of outside minority investors.
      diligencePath: Request the priced-round documents, cap table, and board package; reconcile investor-specific rights with any sovereign or strategic side terms.
      relatedQuestionRefs: [QV008]
    - type: private-evidence-only
      severity: material
      topic: commercialization-proof
      missingEvidence: Public or private evidence of a product roadmap, design partners, pilots, customer commitments, or monetization plan.
      whyItMatters: Without commercialization proof, underwriting relies on founder pedigree and research optionality instead of customer adoption or revenue traction.
      diligencePath: Request the milestone plan, product roadmap, pipeline review, and any design-partner or grant agreements tied to commercial deployment.
      relatedQuestionRefs: [QV003, QV007]
    - type: private-evidence-only
      severity: material
      topic: milestone-governance
      missingEvidence: A board-approved milestone framework covering benchmark targets, safety and governance checkpoints, compute budget, hiring plan, and runway to the next financing.
      whyItMatters: The next round is the primary mark-to-market signal, so missing milestone and runway evidence weakens any price-sensitive buy call.
      diligencePath: Request the internal operating plan, compute commitments, budgeted burn, and milestone gates expected before the next financing.
      relatedQuestionRefs: [QV005, QV007, QV008]
