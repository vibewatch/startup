  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - ["Thesis", "David Silver's pedigree plus a $1.1B war chest can fund a differentiated RL-first frontier lab for longer than a normal seed company.", "Externally credible technical milestones or unusually investor-friendly terms would strengthen conviction."]
      - ["Thesis", "The syndicate quality lowers near-term financing-access risk and may improve talent and infrastructure access.", "A next round led by both existing and new strategic investors on stronger proof would improve the entry case."]
      - ["Anti-thesis", "Public evidence still shows no product, no public roadmap, and no disclosed revenue or customer proof.", "A shipped roadmap, named design partners, or first revenue would weaken this objection."]
      - ["Anti-thesis", "A $5.1B post-money seed already prices the company like a mature profitable scale-up, compressing upside unless execution is exceptional.", "A materially lower entry, a structured downside-protected round, or outsized milestone evidence would change the view."]
    notes: >-
      Arguments combine assigned public financing coverage with valuation
      interpretation; missing commercialization proof is treated as an evidence gap, not as evidence of zero future demand.
    claimRefs: [CV001, CV002, CV005, CV006, CV007, CV008, CV011, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "The company converts capital and founder pedigree into externally credible technical milestones, a visible roadmap, and early strategic demand signals before the next financing.", "Today’s seed mark can still compound if milestone proof turns the round from founder premium into platform scarcity.", "RL scaling or safety progress remains slower than investors expect.", "Independent milestone publication, design-partner evidence, and follow-on financing on stronger proof."]
      - ["Base", "Ineffable remains well funded but mostly research-stage through the next financing, with public evidence still concentrated in thesis and talent rather than customers.", "Current price behaves more like a long-duration research option than an immediately compounding operating-asset entry.", "Time-to-proof stretches while later investors demand more evidence or tighter terms.", "Continued hiring and compute buildout without matching customer, product, or roadmap disclosure."]
      - ["Bear", "The next financing arrives before public product, roadmap, customer, or milestone proof appears, and frontier-AI valuation appetite cools.", "A flat or down round, or structured senior terms, would impair common-equity upside from the current $5.1B seed mark.", "Technical dead ends, governance overhang, or aggressive preferences transfer value to new money.", "Financing delay, strategic investor caution, or diligence findings showing weak governance and milestone control."]
    notes: >-
      Scenario logic is directional and milestone-based because the assigned pool
      contains no public revenue, margin, retention, or cohort data from which to derive precise valuation ranges.
    claimRefs: [CV001, CV005, CV006, CV008, CV011, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public evidence supports a founder-pedigree and capital-scale story, but
      not yet a commercialization-proof story, so valuation discipline dominates the recommendation.
    data:
      nodes:
        - label: Founder pedigree
          detail: David Silver's DeepMind track record is the core credibility anchor.
        - label: Elite syndicate and $1.1B seed
          detail: The round is unusually large and strategically backed for Europe.
        - label: Differentiated RL thesis
          detail: The company is pursuing a superlearner that learns from experience rather than human data.
        - label: Missing commercial proof
          detail: Assigned public evidence still shows no public product, roadmap, or revenue.
        - label: $5.1B seed valuation
          detail: Price already capitalizes exceptional future execution.
        - label: Recommendation = track / research more
          detail: Re-rate only after milestone, governance, or entry-price evidence improves.
    approximationNotes: null
    claimRefs: [CV001, CV002, CV004, CV005, CV011]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Track / research more. The financing is real and strategic, but public
      evidence still does not justify buying common equity at a $5.1B seed mark
      as though commercialization proof already exists.
    claimRefs: [CV001, CV005, CV006, CV011]
  - calloutType: risk
    title: Price-sensitive anti-thesis
    body: >-
      The biggest downside is not that the thesis is impossible; it is that the
      next mark arrives before public milestones, letting new money dictate terms
      from a stronger negotiating position than today's outside investor.
    claimRefs: [CV010, CV012, CV013, CV014]
