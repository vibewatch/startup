    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: >-
      The broadest public lens is frontier-AI capital formation, while the
      narrowest layers are still hypothetical end markets without disclosed demand proof.
    data:
      items:
        - label: Broad frontier AI opportunity set
          displayValue: Frontier-model market narrative
          valueNote: >-
            Includes labs still centered on internet-data pretraining and should
            not be read as Ineffable's actual addressable market.
          claimRefs: [CM001, CM003]
        - label: Founder-led pre-product frontier labs
          displayValue: $1.1B-$2.0B seed checks cited
          valueNote: >-
            Capital-comparable wedge from public private-lab financings, not
            end-customer revenue.
          claimRefs: [CM006, CM007]
        - label: Ineffable-specific underwriting
          displayValue: $1.1B seed / $5.1B valuation
          valueNote: >-
            Hardest public signal of willingness to fund the thesis, but still a
            financing metric rather than market demand.
          claimRefs: [CM006]
        - label: Compute-backed RL experimentation
          displayValue: Google Cloud A5X / Vera Rubin cluster
          valueNote: >-
            Supply-side prerequisite for the thesis; no public conversion into
            shipped product volume is disclosed.
          claimRefs: [CM010, CM011]
        - label: Hypothesized science-led end markets
          displayValue: Science, materials, medicines
          valueNote: >-
            Frequently cited upside applications, but no contracts, pilots, or
            budget owners are publicly named.
          claimRefs: [CM004, CM008]
        - label: Hypothesized enterprise optimization end markets
          displayValue: Engineering, logistics, planning
          valueNote: >-
            Commercial bridge proposed by third-party coverage; public SAM/SOM,
            pricing, and customer proof remain absent.
          claimRefs: [CM004, CM008, CM014]
    approximationNotes: >-
      This is an ordering of evidence-backed commercialization layers, not a
      numeric TAM/SAM/SOM stack. Numeric values appear only where retained
      sources publish financing or infrastructure facts.
    claimRefs: [CM006, CM007, CM010, CM014]
callouts:
  - calloutType: insight
    title: Market proof is currently capital-first
    body: >-
      The underwriteable market signal today is not customer demand but the
      willingness of investors and infrastructure partners to finance an RL-first
      frontier lab at extraordinary scale before product proof.
    claimRefs: [CM006, CM010]
  - calloutType: risk
    title: Buyer segmentation is still a hypothesis tree
    body: >-
      Public sources cite attractive end domains, but no retained source shows a
      buyer, payer, pricing model, or benchmarked deployment that turns those
      domains into an attributable SAM or SOM.
    claimRefs: [CM008, CM009, CM014]
