          outputs:
            - label: Stated mission
              value: Superlearner
        - label: Knowledge source
          detail: Learn from experience instead of from pretraining on human-generated corpora.
          outputs:
            - label: Input regime
              value: Environment feedback
        - label: Learning loop
          detail: Reinforcement learning, self-play lineage, and iterative trial-and-error updates.
          modules:
            - label: RL-first core
            - label: Self-play / environment interaction
        - label: Domain layer
          detail: Publicly described targets include science, mathematics, engineering, and other hard-to-specify problem spaces.
          outputs:
            - label: Example domains
              value: Science / math / technology
        - label: Compute layer
          detail: Reported Nvidia collaboration ties the stack to Grace Blackwell, Vera Rubin, and high-bandwidth systems engineering.
          modules:
            - label: Grace Blackwell
            - label: Vera Rubin
        - label: External surface
          detail: Public productization artifacts are missing from the assigned pool.
          outputs:
            - label: Not public
              value: API / docs / benchmarks / status
    claimRefs: [CE003, CE004, CE007, CE009, CE010]
callouts:
