  evidenceGaps:
    - type: missing-source
      severity: material
      topic: product-maturity
      missingEvidence: First-party product documentation, API surface, roadmap, release notes, or deployment references.
      whyItMatters: Without a real product surface, the chapter can only underwrite a research thesis, not delivery readiness.
      diligencePath: Request product docs, demo environment access, roadmap milestones, and at least two customer or pilot references.
      relatedQuestionRefs: [QE001, QE004, QE008]
      relatedTableRefs: [TE001, TE002]
    - type: private-evidence-only
      severity: material
      topic: verification-gap
      missingEvidence: Benchmark results, evaluation methodology, model-card style disclosures, and technical architecture artifacts.
      whyItMatters: Technical differentiation is central to valuation, but public evidence does not let outsiders test maturity, reproducibility, or scaling claims.
      diligencePath: Obtain internal benchmark decks, evaluation specs, and technical design reviews that show how the superlearner is trained and measured.
      relatedQuestionRefs: [QE003, QE008]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: controls-gap
      missingEvidence: Security, privacy, safety-governance, compliance, and reliability-control documentation.
      whyItMatters: Frontier-model diligence requires evidence for how unsafe behavior, data handling, outages, and release gating are controlled.
      diligencePath: Request security architecture, privacy posture, incident-management process, evaluation governance, and any third-party assurance reports.
      relatedQuestionRefs: [QE006]
