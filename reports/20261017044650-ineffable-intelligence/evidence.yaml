evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-control-rights
    missingEvidence: >-
      Board composition, liquidation preferences, pro rata rights, secondaries, debt or credit facilities, and any
      special governance protections.
    whyItMatters: >-
      The round size is public, but investors still cannot underwrite who controls the company, what downside
      protections exist, or whether capital came with strategic constraints.
    diligencePath: Request the current cap table, board deck, financing documents, and any side letters from the April 2026 round.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-traction-metrics
    missingEvidence: Verified revenue, pricing, customer or pilot count, and a dated headcount snapshot.
    whyItMatters: >-
      Without commercialization and staffing metrics, later chapters cannot separate a well-funded research narrative
      from operating traction or capacity.
    diligencePath: >-
      Request KPI reporting for revenue, customer pipeline, pricing model, employee count, and any active commercial
      engagements.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-bench
    missingEvidence: Named executives beyond Silver, board members, and any formal governance or safety oversight process.
    whyItMatters: >-
      Execution risk is meaningfully harder to assess when founder quality is visible but the broader operating and
      governance bench is opaque.
    diligencePath: >-
      Request an org chart, board list, safety-governance documentation, and leadership biographies for non-founder
      decision-makers.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: roadmap-and-benchmark-milestones
    missingEvidence: Additional dated milestones for benchmarks, productization, customer pilots, or formal technical checkpoints.
    whyItMatters: >-
      The retained six-point timeline establishes sequence but does not yet show how the company plans to convert
      capital and partnerships into measurable operating progress.
    diligencePath: >-
      Request an internal roadmap, benchmark plan, and milestone calendar tied to compute buildout, research outputs,
      and commercialization gates.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: Public or management-provided TAM/SAM/SOM methodology tied to buyer budgets, volumes, or procurement pathways.
    whyItMatters: >-
      Without a demand-backed sizing method, valuation discussion can only lean on capital proxies and narrative
      comparables.
    diligencePath: >-
      Request the company's internal market model with segment definitions, price assumptions, and expected conversion
      milestones.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: target-customer
    missingEvidence: >-
      Named design partners, pilots, contracts, pricing constructs, or product packaging that identifies buyer, user,
      and payer clearly.
    whyItMatters: Buyer segmentation remains hypothetical until a real deployment or procurement motion is disclosed.
    diligencePath: >-
      Ask management for customer conversations, pilot letters, commercial roadmap, and draft packaging or pricing
      materials.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Benchmarks, milestone criteria, and timeline disclosures showing whether RL-first training is progressing toward
      commercial readiness.
    whyItMatters: >-
      The market case depends on technical breakthrough timing, but public evidence does not yet show milestone-based
      de-risking.
    diligencePath: >-
      Obtain benchmark definitions, internal milestone gates, and the first planned external capability demonstration
      timeline.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: missing-source
    severity: material
    topic: pricing-packaging
    missingEvidence: Public per-token, per-seat, pilot, or partnership pricing for Ineffable and other frontier-lab alternatives.
    whyItMatters: >-
      Without a public price surface, the chapter can compare product maturity and distribution posture, but not true
      packaging or willingness-to-pay.
    diligencePath: >-
      Request API pricing pages, pilot term sheets, or enterprise sales decks from Ineffable and the closest
      frontier-lab alternatives.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Named design partners, pilot customers, or benchmark deployments that show where buyers would actually switch from
      incumbent model vendors.
    whyItMatters: >-
      Current switching-cost analysis is mostly structural because public evidence does not show live customer adoption
      or procurement proof.
    diligencePath: >-
      Request customer references, signed pilot summaries, benchmark evaluations, and any public product-access roadmap
      that turns research positioning into a purchasable offer.
    relatedQuestionRefs:
      - QP004
      - QP005
  - type: private-evidence-only
    severity: blocking
    topic: revenue-model
    missingEvidence: Product-level revenue by stream, customer count, contract form, and any revenue-recognition policy.
    whyItMatters: Without disclosed customers or realized pricing, the chapter cannot underwrite revenue quality or timing.
    diligencePath: Request a revenue bridge by product, top-customer concentration, signed-order backlog, and example contract terms.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Post-close cash balance, monthly burn, compute commitments, runway cases, and any debt or structured-finance
      obligations.
    whyItMatters: A $1.1 billion raise reduces financing risk only if burn, committed spend, and contingent obligations are known.
    diligencePath: Obtain the board budget, cash waterfall, committed cloud or GPU contracts, and scenario-based runway model.
    relatedQuestionRefs:
      - QI004
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: funding-chronology
    missingEvidence: Authoritative financing chronology with dates, instrument type, and proceeds by round.
    whyItMatters: Conflicting directory data affects dilution analysis, cap-table reconstruction, and post-money interpretation.
    diligencePath: >-
      Reconcile the cap table and financing ledger against signed closing documents and the latest board-approved share
      register.
    relatedQuestionRefs:
      - QI001
      - QI008
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Current employee count, open req count, and fully loaded payroll plan.
    whyItMatters: Headcount is a central cost driver for frontier AI labs, and conflicting public estimates weaken any burn proxy.
    diligencePath: Request the current org chart, payroll summary, and hiring plan tied to the budget.
    relatedQuestionRefs:
      - QI004
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: product-maturity
    missingEvidence: First-party product documentation, API surface, roadmap, release notes, or deployment references.
    whyItMatters: Without a real product surface, the chapter can only underwrite a research thesis, not delivery readiness.
    diligencePath: Request product docs, demo environment access, roadmap milestones, and at least two customer or pilot references.
    relatedQuestionRefs:
      - QE001
      - QE004
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
  - type: private-evidence-only
    severity: material
    topic: verification-gap
    missingEvidence: Benchmark results, evaluation methodology, model-card style disclosures, and technical architecture artifacts.
    whyItMatters: >-
      Technical differentiation is central to valuation, but public evidence does not let outsiders test maturity,
      reproducibility, or scaling claims.
    diligencePath: >-
      Obtain internal benchmark decks, evaluation specs, and technical design reviews that show how the superlearner is
      trained and measured.
    relatedQuestionRefs:
      - QE003
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: controls-gap
    missingEvidence: Security, privacy, safety-governance, compliance, and reliability-control documentation.
    whyItMatters: >-
      Frontier-model diligence requires evidence for how unsafe behavior, data handling, outages, and release gating are
      controlled.
    diligencePath: >-
      Request security architecture, privacy posture, incident-management process, evaluation governance, and any
      third-party assurance reports.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: Named production customers, pilots, or evaluation partners with start dates, scope, and referenceability.
    whyItMatters: Without direct counterparties, customer existence, segment fit, and willingness to pay are not underwritten.
    diligencePath: Request a top-customer or pilot list, deployment dates, reference calls, and signed commercial documents.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: retention-durability
    missingEvidence: NRR, GRR, churn, renewal timing, contract length, or any cohort-style usage evidence.
    whyItMatters: >-
      Durability cannot be assessed without renewal or cohort behavior, so the chapter cannot distinguish pilot interest
      from lasting adoption.
    diligencePath: Request cohort history, renewal calendars, expansion bookings, and account-level retention summaries.
  - type: missing-source
    severity: material
    topic: pricing-surface
    missingEvidence: Pricing model, API or access surface, commercial packaging, and any disclosed licensing terms.
    whyItMatters: Monetization timing and procurement friction remain speculative without a public or private commercial surface.
    diligencePath: Request rate cards, SKU or access model definitions, and example MSAs or order forms.
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Customer-count disclosure, top-customer share, channel mix, and segment split once any commercialization begins.
    whyItMatters: >-
      Concentration risk and land-and-expand dynamics cannot be measured when the public record shows no named customer
      base.
    diligencePath: Request customer pipeline by segment, expected first-conversion path, and concentration reporting templates.
  - type: private-evidence-only
    severity: material
