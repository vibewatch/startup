      - number: '4.3'
        title: 财务结论：资产负债表实力异常、收入可见度极低，尽调阻塞项尚未解决
        blocks:
          - type: paragraph
            body: >-
              财务结论并不对称。对一家刚刚曝光的实验室而言，Ineffable
