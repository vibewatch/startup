      - number: '2.4'
        title: 上行空间取决于先突破数据上限，再应对算力、奖励与商业化风险
        blocks:
          - type: paragraph
            body: >-
              乐观情景是：强化学习优先系统可以摆脱人类编写数据的上限，在科学和工程领域打开当前 LLM
              技术栈尚不能稳定触达的发现型工作流。这也是来源反复将该论点与科学发现、材料、药物及其他复杂优化问题联系起来的原因。但同一批来源也列出约束：游戏式环境之外的奖励信号含糊、需要逼真的仿真、持续生成轨迹所需的训练与推理基础设施耦合、激烈的人才竞争、不断变化的
              AI 治理，以及缺乏公开路线图。因此，采用时点与其说取决于广泛的市场热情，不如说取决于 Ineffable 能否把一次融资转化为有基准证明的能力和可信的商业化推进。
