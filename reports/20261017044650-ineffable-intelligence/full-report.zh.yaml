      - number: '3.3'
        title: 在 Ineffable 公开交付产品前，转换成本偏向既有厂商
        blocks:
          - type: paragraph
            body: >-
              当前转换成本并不对称。已经使用既有 LLM 平台的买家拥有实时 API、成熟的运营方式和现成的供应商关系；NeuralCoreTech 与 EntrepreneursNews 都暗示 Ineffable
              的商业生命周期还早几个阶段。这并不意味着公司毫无筹码：投资者联盟包含 Google、Nvidia、Sequoia、Lightspeed
              和英国主权支持者，为产品尚未落地的实验室带来非同寻常的算力入口、投资者信号和战略可见度。即便如此，在缺乏公开产品入口的情况下，当前多栖使用更可能意味着企业继续购买既有模型，同时把 Ineffable
              当作战略选项观察，而不是近期替换 OpenAI 或 Anthropic 式部署。
            claimRefs:
              - CP005
              - CP010
              - CP011
              - CP013
      - number: '3.4'
        title: 护城河能否持久，取决于在既有厂商吸收之前证明强化学习优势
        blocks:
          - type: paragraph
            body: >-
              现有证据池中最重要的反证是：仅凭论点新颖性不太可能长期保持专有。Tech Insider 明确指出 OpenAI、Anthropic 和 Google 已经运行有意义的强化学习项目，CNBC
              则描述了前大科技公司研究人员创办 Recursive Superintelligence、AMI Labs 等竞争性前沿实验室的更大浪潮。因此，Ineffable
              的持久护城河集中在创始人可信度、人才吸引力和早期算力入口，而非客户锁定或定价权。如果公司做出明显更强的原生强化学习能力演示，格局可能迅速改变；如果做不到，它希望取代的那些既有厂商也完全有能力把相似思路吸收到已经分发的技术栈中。
            claimRefs:
              - CP007
              - CP012
              - CP014
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 公开变现证据弱于资本化故事
        blocks:
          - type: paragraph
            body: >-
              公开财务证据对资本化的支持最强，对变现的支持最弱。CNBC 报道了 $1.1B 种子轮和 $5.1B 估值，多份现有来源重复了相同的规模与投资者组合。相比之下，NeuronFeed 称截至 2026
              年公司没有公开商业产品，TechnoTrenz 称公司没有产品、没有收入、没有公开路线图。因此，“企业级”定价或“B2B”商业模式等目录式标签只能算宽泛分类，不能证明存在可用
              SKU、已签合同或实现的定价。按当前公开证据，公司可以作为研究资产获得融资，却还不能作为收入业务进行投资判断。
