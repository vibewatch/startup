  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 公司在下一轮融资前，把资本和创始人履历转化为外部可信的技术里程碑、清晰路线图和早期战略需求信号。
        - 如果里程碑证明把本轮融资从创始人溢价变成平台稀缺性，当前种子轮估值仍可持续增值。
        - RL 扩展或安全进展仍慢于投资人预期。
        - 独立发布里程碑、设计合作伙伴证据，以及基于更强证明的后续融资。
      - - 基准
        - Ineffable 在下一轮融资前资金充足但主要仍处于研究阶段，公开证据仍集中于论点和人才，而非客户。
        - 当前价格更像一项长期研究期权，而不是能立即复利增长的运营资产入场价。
        - 证明所需时间拉长，后续投资人要求更多证据或更严格条款。
        - 招聘和算力建设继续推进，但客户、产品或路线图披露没有同步增加。
      - - 悲观
        - 下一轮融资在公开产品、路线图、客户或里程碑证明出现前到来，且市场对前沿 AI 的估值兴趣降温。
        - 平价轮或下调轮，或结构化优先条款，会削弱普通股相对于当前 $5.1B 种子轮估值的上行空间。
        - 技术走入死胡同、治理包袱或激进的优先权条款会把价值转移给新资金。
        - 融资延迟、战略投资人谨慎，或尽调发现治理和里程碑控制薄弱。
    notes: 情景逻辑是方向性且以里程碑为基础，因为指定来源池没有公开收入、利润率、留存或队列数据，无法据此推导精确估值区间。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV008
      - CV011
      - CV012
      - CV013
      - CV014
