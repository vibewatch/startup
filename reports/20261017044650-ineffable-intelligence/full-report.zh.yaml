        - $5.1B 投后种子轮已经按成熟且盈利的规模化公司给它定价；除非执行表现非凡，否则上行空间会被压缩。
        - 明显更低的进入价格、带结构化下行保护的轮次，或超出预期的里程碑证据会改变判断。
    notes: 论点结合指定的公开融资报道与估值解读；商业化证明缺失被视为证据缺口，而不是未来需求为零的证据。
