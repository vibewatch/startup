              $5.1B——这已经公开——而是这个价格下面到底有哪些保护和里程碑证据。现有来源没有披露清算优先权、董事会控制条款、按比例增持权、算力额度附函、现金跑道假设，或通往下一轮的有基准里程碑计划。因此，价值最高的尽调应落到文件层面：融资文件、股权结构表、董事会材料、运营预算、算力承诺，以及任何客户或设计合作伙伴证据。如果公司进入下一轮融资时仍没有发布或私下证明足以抵消当前估值溢价的技术里程碑、商业化意图或治理条款，论点就会失效。
            claimRefs:
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 跟踪 / 继续研究。融资真实且具有战略意义，但公开证据仍不足以支持在 $5.1B 种子估值下买入普通股，仿佛商业化证明已经存在。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV011
          - type: callout
            title: 对价格敏感的反论点
            body: 最大的下行并不是论点不可能实现，而是下一次估值可能在公开里程碑出现之前到来，让新资金以比今天外部投资者更强的议价位置决定条款。
            calloutType: risk
            claimRefs:
              - CV010
              - CV012
              - CV013
              - CV014
