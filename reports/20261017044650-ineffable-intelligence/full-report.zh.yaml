  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 真正的竞争格局是前沿实验室，而非通用 AI 软件
        blocks:
          - type: paragraph
            body: >-
              现有来源并未把 Ineffable 描述成又一家应用型 AI 初创公司。相反，它们反复将公司与筹集资本、试图塑造下一代模型范式的前沿研究实验室比较。AI Market Watch 直接点名
              OpenAI、Anthropic、DeepMind 和 AMI Labs，Tech Insider 又将同行范围扩大到 xAI、Safe Superintelligence、Thinking Machines
              Lab 和 Project Prometheus。EU-Startups 从另一面提出同样观点：Narwhal Labs、BeyondMath
              等更近的英国公司虽处于相邻领域，却不是直接替代者，因为它们的规模和强化学习前沿重心都无法与 Ineffable 匹敌。核心竞争问题因此是前沿研究资源配置——支持 Transformer
              既有厂商、支持另类实验室，还是继续内部建设——而不是针对商品化 AI 工具逐项比较功能。
            claimRefs:
              - CP003
              - CP004
              - CP015
              - CP016
