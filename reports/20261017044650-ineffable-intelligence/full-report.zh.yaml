  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界是前沿自学习 AI，而非通用 AI 软件
        blocks:
          - type: paragraph
            body: >-
              现有来源一致将 Ineffable 放在前沿模型市场，而非应用层。其边界不是宽泛的“AI 软件”，而是从自行生成的经验中学习、而不是从互联网规模的人类语料中学习的系统。Pathfounders、Stack
              Futures、CNBC 和 Sequoia 合伙人说明都将公司描述为构建强化学习“超级学习器”的研究实验室，而非垂直 SaaS
              供应商或通用服务商。这个边界很重要：相关替代方案是其他前沿实验室以及以预训练为主的模型开发现状，而不是工作流工具。因此，当前公开证据更多反映科学抱负和基础设施需求，而非即时的产品市场契合。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
