  summary: >-
    Ineffable Intelligence 是一家总部位于伦敦、处于种子期的私营前沿 AI 实验室，由 David Silver 于 2025 年末创立，并于 2026 年 4
    月公开亮相，主张以强化学习为先构建超级学习器。公开证据充分支持其创始人履历、创纪录的种子融资以及与 NVIDIA 的基础设施合作，但治理深度、商业化指标和运营控制仍大幅未披露。
