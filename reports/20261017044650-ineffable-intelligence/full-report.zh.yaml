        - 用于构建前沿模型和实验室的融资、算力与人才投入，目标是实现能力跃迁。
        - 与前沿模型创建无关的下游 AI 应用、服务收入和普通自动化工具。
        - 投资者、主权资本工具和战略算力伙伴。
        - 这是直接证据最清晰的一层，因为所有保留来源都聚焦融资、基础设施和研究定位。
      - - 强化学习优先的自学习系统
        - 以自行生成的经验、自博弈或环境交互训练的系统，不把人类数据预训练作为核心扩展逻辑。
        - 以 LLM 为先的预训练技术栈，仅把强化学习用于后训练对齐或推理层。
        - 公开终端买家未披露；当前投资判断对象是投资者和供应商。
        - 这是 Ineffable 声称占据的具体切口，也是其公开叙事中差异化的主要原因。
      - - 科学发现与先进研发工作流
        - Sequoia 和媒体报道提到的科学、数学、材料、药物及其他发现型问题等潜在用例。
        - 没有发现成分的普通办公生产力、通用聊天机器人或消费者 AI 助手。
        - 提到研究人员；实际付费机构未披露。
        - 这似乎是价值最高的愿景型终端市场，但尚无合同或试点证据。
      - - 复杂企业优化工作流
        - 工程、物流、规划及其他人类数据可能稀缺或不足的复杂环境。
        - 可以仅用历史企业文本训练的常规 SaaS 自动化或打包式副驾驶。
        - 企业客户是推测对象；没有披露买家名称或预算负责人。
        - 这是合理的商业化桥梁，但现有证据停留在用例建议，而非采用证明。
    notes: 边界受证据约束：保留来源描述了研究、融资、基础设施和假设终端领域，但没有披露打包产品线、定价或客户合同。
