        title: Exhibits
        blocks:
          - type: callout
            title: Market proof is currently capital-first
            body: >-
              The underwriteable market signal today is not customer demand but the willingness of investors and
              infrastructure partners to finance an RL-first frontier lab at extraordinary scale before product proof.
