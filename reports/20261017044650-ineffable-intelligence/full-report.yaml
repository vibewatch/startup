  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and current surface
        blocks:
          - type: paragraph
            body: >-
              The public-facing product is best understood as a frontier-AI research program rather than a deployed
              software SKU. Across Sequoia's partner writeup, CNBC's funding coverage, and multiple independent
              explainers, Ineffable consistently describes the offering as a "superlearner" that learns from its own
              experience instead of from human-generated text or labels. The disclosed workflow therefore starts with
              machine environments and reward signals, not with enterprise users connecting to an API or documented
              application layer. The highest-confidence interpretation is that the company is selling a future
              capability roadmap to capital providers, while the current externally visible product surface remains a
              research platform with no publicly documented customer deployment, API, or commercial product roadmap in
              the assigned evidence set.
            claimRefs:
              - CE001
