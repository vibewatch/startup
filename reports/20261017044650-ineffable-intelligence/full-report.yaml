      - number: '3.3'
        title: Switching costs favor incumbents until Ineffable ships something public
        blocks:
          - type: paragraph
            body: >-
              Current switching costs are asymmetric. For a buyer already using incumbent LLM platforms, the status quo
              comes with live APIs, known operating patterns, and existing vendor relationships; NeuralCoreTech and
              EntrepreneursNews both suggest that Ineffable is still several steps earlier in its commercial lifecycle.
              That does not leave the company empty-handed: the funding syndicate includes Google, Nvidia, Sequoia,
              Lightspeed, and UK sovereign backers, which gives a pre-product lab unusual compute access, investor
              signaling, and strategic visibility. Even so, absent public product access, current multi-homing behavior
              is more likely to mean enterprises keep buying incumbent model access while watching Ineffable as a
              strategic option, not that they replace OpenAI- or Anthropic-style deployments in the near term.
            claimRefs:
              - CP005
              - CP010
              - CP011
              - CP013
      - number: '3.4'
        title: Moat durability depends on proving RL advantages before incumbents absorb them
        blocks:
          - type: paragraph
            body: >-
              The most important disconfirming evidence in the retained pool is that thesis novelty alone is unlikely to
              stay proprietary for long. Tech Insider explicitly argues that OpenAI, Anthropic, and Google already run
              meaningful reinforcement learning programs, while CNBC describes a broader wave of ex-Big-Tech researchers
              spinning up rival frontier labs such as Recursive Superintelligence and AMI Labs. That leaves Ineffable's
              durable moat concentrated in founder credibility, talent attraction, and early compute access rather than
              customer lock-in or pricing power. If the company produces a clearly superior RL-native capability demo,
              that posture could shift quickly; if it does not, the same incumbents it hopes to displace are well
              positioned to incorporate similar ideas into already-distributed stacks.
            claimRefs:
              - CP007
              - CP012
              - CP014
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Public monetization evidence is thinner than the capitalization story
        blocks:
          - type: paragraph
            body: >-
              Public financial evidence is strongest on capitalization and weakest on monetization. CNBC reports a
              record $1.1 billion seed round at a $5.1 billion valuation, and multiple retained sources repeat the same
              scale and investor mix. By contrast, NeuronFeed says the company does not offer a public commercial
              product as of 2026, and TechnoTrenz says it has no product, no revenue, and no public roadmap.
              Directory-style labels such as "Enterprise" pricing or "B2B" business model therefore function as loose
              categorization rather than proof of a live SKU, signed contracts, or realized pricing. On current public
              evidence, the company is financeable as a research asset, not yet underwritable as a revenue business.
