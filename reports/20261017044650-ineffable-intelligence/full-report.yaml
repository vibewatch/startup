  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The real landscape is frontier labs, not generic AI software
        blocks:
          - type: paragraph
            body: >-
              The retained sources do not frame Ineffable as just another applied-AI startup. Instead, they repeatedly
              compare it with frontier research labs that are raising capital to shape the next model paradigm. AI
              Market Watch directly names OpenAI, Anthropic, DeepMind, and AMI Labs as competitors, while Tech Insider
              widens the peer set to xAI, Safe Superintelligence, Thinking Machines Lab, and Project Prometheus.
              EU-Startups makes the same point from the other direction: the nearer UK names such as Narwhal Labs and
              BeyondMath are adjacent, but not direct substitutes, because they do not match Ineffable's scale or
              reinforcement-learning frontier focus. That makes the core competitive question a frontier-research
              allocation decision—back transformer incumbents, back alternative labs, or keep building internally—rather
              than a narrow feature checklist against commodity AI tooling.
