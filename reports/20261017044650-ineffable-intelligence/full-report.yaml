      - number: '5.3'
        title: Maturity, differentiation, and control gaps
        blocks:
          - type: paragraph
            body: >-
              Differentiation is clear at the narrative level: Ineffable positions itself as a pure-RL, post-LLM lab
              pursuing novel knowledge generation rather than better imitation of internet text. That framing is
              coherent and strategically distinct, but public maturity evidence is thin. Multiple sources explicitly
              describe the company as pre-product and pre-revenue, and none of the assigned URLs expose benchmark
              results, technical documentation, support processes, uptime history, security posture, privacy controls,
              or regulatory/compliance artifacts. The result is a sharp diligence asymmetry: investors and partners have
              funded an ambitious architecture bet, yet outsiders still cannot verify whether the lab has solved
              evaluation design, safety governance, reproducibility, or commercialization sequencing. Product diligence
              should therefore treat the technical thesis as credible but the operating maturity as largely unverified.
            claimRefs:
