      - number: '2.3'
        title: End buyers are hypothesized, while current payers are investors and compute partners
        blocks:
          - type: paragraph
            body: >-
              The public buyer map remains aspirational. AI Market Watch proposes enterprises and researchers as target
              customers, and the Sequoia, Mexico Business News, and Pathfounders materials cite science, mathematics,
              technology, engineering, and logistics as potential end domains. But no retained source discloses a
              shipped product, live deployment, pilot, pricing construct, or named buyer. In the observable near-term
              adoption path, the parties actually committing budget are the investor syndicate, sovereign-capital
              participants, and Google Cloud and Nvidia as infrastructure enablers. For diligence purposes, that means
              user and payer segmentation should be treated as a hypothesis tree rather than as validated demand.
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Upside depends on beating data ceilings before compute, reward, and commercialization risks bite
        blocks:
          - type: paragraph
            body: >-
              The bull case is that an RL-first system could escape the ceiling of human-authored data and unlock
              discovery-style workflows in science and engineering that current LLM stacks do not reach reliably. That
              is why sources repeatedly connect the thesis to scientific discovery, materials, medicines, and other
              complex optimization problems. The same sources also outline the constraints: ambiguous reward signals
              outside game-like environments, the need for realistic simulations, the coupling of training and inference
              infrastructure for continuous trajectory generation, severe talent competition, evolving AI governance,
              and the absence of a public roadmap. Adoption timing therefore depends less on broad market enthusiasm
              than on whether Ineffable can turn a financing event into benchmarked capability and a credible
              commercialization motion.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
