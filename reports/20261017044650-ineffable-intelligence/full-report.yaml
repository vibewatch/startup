          - type: paragraph
            body: >-
              The retained evidence points to a cost structure that is unusually capital intensive even by frontier-AI
              standards. Entrepreneurs News explicitly frames the $5.1 billion valuation as support for compute
              infrastructure, researcher salaries, and experimental iteration, while the same piece says the $1.1
              billion war chest can outbid peers for compute, talent, and datasets. The AI Consulting Network reaches a
              similar conclusion from a different angle, arguing that every dollar raised by a frontier AI lab
              eventually flows into compute. Those statements are directionally useful for underwriting cost drivers,
              but they still do not disclose burn rate, cloud commitments, hiring plan, or the split between research,
              infrastructure, and commercialization spend. The only publicly signaled milestone in the retained set is
              an anticipated late-2026 benchmark readout, which suggests a technical milestone may precede any
