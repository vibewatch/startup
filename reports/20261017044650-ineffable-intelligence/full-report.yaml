  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is frontier self-learning AI, not generic AI software
        blocks:
          - type: paragraph
            body: >-
              Retained sources consistently place Ineffable inside the frontier-model market rather than the application
              layer. The defining boundary is not "AI software" broadly, but systems that learn from self-generated
              experience instead of from internet-scale human-authored corpora. Pathfounders, Stack Futures, CNBC, and
              the Sequoia partner note all describe the company as a research lab building a reinforcement-learning
              "superlearner" rather than a vertical SaaS vendor or a generic services shop. That boundary matters
              because the relevant substitutes are other frontier labs and the status quo of pretraining-heavy model
              development, not workflow tools. It also means current public evidence speaks more to scientific ambition
              and infrastructure requirements than to immediate product-market fit.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM010
      - number: '2.2'
        title: Capital formation is the only hard public sizing lens
        blocks:
          - type: paragraph
            body: >-
              No retained source publishes a company-specific TAM, SAM, or SOM, and no source discloses customer counts,
              price points, or contracted demand that could support a bottom-up revenue model. The usable public lenses
              are therefore indirect. CNBC and Pathfounders anchor the company at a $1.1 billion seed round and $5.1
              billion valuation, which measures investor willingness to finance the category rather than end-customer
              budget. TechnoTrenz adds peer seed financings for Reflection AI and Thinking Machines Lab, while Stack
              Futures and Mexico Business News contribute infrastructure and sovereign-capital context. These lenses are
              useful for valuation framing, but they do not isolate commercialization volume for an RL-first
              superlearner.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
