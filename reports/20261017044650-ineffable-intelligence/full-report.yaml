    and publicly launched in April 2026 around a reinforcement-learning-first superlearner thesis. Public evidence
    strongly supports the founder pedigree, the record-sized seed financing, and the NVIDIA infrastructure
    collaboration, while governance depth, commercialization metrics, and operating controls remain materially
    undisclosed.
