    title: "Capital and compute alignment are unusually strong for a seed-stage lab"
    body: "The company paired a record-sized seed round with named strategic backers and a public NVIDIA infrastructure collaboration, which is a stronger early-stage resource base than the typical pre-product research lab."
    claimRefs: ["CO006", "CO007", "CO010"]
