company:
  name: "Ineffable Intelligence"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Ineffable Intelligence is a London-based, seed-stage private frontier AI lab founded by David Silver in late 2025 and publicly launched in April 2026 around a reinforcement-learning-first superlearner thesis. The strongest retained anchors are the official mission statement, CNBC's April 2026 report of a $1.1 billion seed round at a $5.1 billion valuation, and the May 2026 NVIDIA infrastructure collaboration, while public governance depth, commercialization metrics, and full cap-table economics remain materially undisclosed."
sections:
  - id: "identity-thesis-and-stage"
    title: "Identity, thesis, and current stage"
    body: "The retained evidence supports a stable identity even though operating disclosure is still thin. Official materials say Ineffable is building a superlearner that learns from its own experience rather than from human data, while investor and press coverage consistently place the company in London and frame it as a seed-stage private AI research lab rather than a revenue-generating software vendor. Independent sources also tie the public launch to late April 2026, which gives later chapters a reliable starting point for tracking what was actually disclosed versus what remains aspirational."
    claimRefs: ["CO001", "CO003", "CO004", "CO005", "CO011", "CO012"]
    tableRefs: ["TO001"]
  - id: "founder-centrality-and-governance"
    title: "Founder centrality and governance visibility"
    body: "The public story is overwhelmingly founder-led. David Silver's official founder note presents the company as his life's work, and independent reporting consistently leans on his DeepMind reinforcement-learning track record to justify the company's credibility. That is a strength for recruiting and capital formation, but it also creates key-person concentration because the retained public materials do not disclose a fuller executive bench, board composition, or formal governance process. Investors can therefore underwrite founder quality more easily than organizational depth."
    claimRefs: ["CO002", "CO003", "CO008", "CO013", "CO014", "CO015"]
    tableRefs: ["TO002"]
  - id: "funding-and-strategic-stakeholders"
    title: "Funding scale and strategic stakeholder map"
    body: "Public financing disclosure is much stronger than operating disclosure. CNBC and multiple follow-on reports describe a $1.1 billion seed round at a $5.1 billion post-money valuation, with Sequoia and Lightspeed in the lead and Google, NVIDIA, Index, DST Global, and UK sovereign/public capital also named. That syndicate matters because it provides both validation and potential infrastructure access, but it does not by itself answer who controls the company, how the economics are split, or what milestone expectations attach to the capital."
    claimRefs: ["CO006", "CO007", "CO009", "CO010"]
    tableRefs: ["TO003"]
  - id: "milestones-and-open-asks"
    title: "Milestones, partnership sequencing, and open asks"
    body: "The public milestone record is sufficient to establish a founding-to-funding-to-partnership sequence, but not a full operating roadmap. Retained sources support late-2025 formation, a dated founder note in January 2026, a late-April stealth emergence paired with the seed financing, and a May 2026 NVIDIA infrastructure collaboration. What remains missing is equally important: no retained source provides customer traction, revenue, pricing, benchmark milestones, or a formal governance framework. The chapter therefore establishes chronology and underwriting anchors, while preserving commercialization and governance as live diligence gaps."
    claimRefs: ["CO002", "CO005", "CO006", "CO010", "CO012", "CO013", "CO015"]
    figureRefs: ["FO001"]
