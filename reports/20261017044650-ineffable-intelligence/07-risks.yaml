              note: Delays in compute access would quickly affect milestone timing.
        - label: Policy / governance scrutiny
          note: State backing and frontier-AI claims attract extra oversight attention.
          values:
            - label: Medium
              tone: medium
              note: No active enforcement is cited, but multiple sources flag scrutiny.
            - label: High
              tone: high
              note: A governance failure could disrupt funding and public legitimacy.
            - label: Medium
