callouts:
  - calloutType: risk
    title: Kill criteria before the next financing
    body: >-
      Treat the thesis as broken if the company still lacks a verifiable capability demonstration, public safety and
      evaluation framing, or durable compute-access disclosure by the next major financing or partnership milestone.
    claimRefs: [CR010, CR014, CR015, CR016]
  - calloutType: insight
    title: The current mitigants mostly buy access, not proof
    body: >-
      Strategic investors, sovereign support, and partner engineering lower access risk, but they do not resolve the
      public gaps around commercialization, benchmarks, governance terms, or safety readiness.
    claimRefs: [CR008, CR011, CR014, CR016]
