      - number: '8.4'
        title: 退出准备度、尽调要求与投资论点破坏触发点
        blocks:
          - type: paragraph
            body: >-
              Nothing 具备融资可见度和可识别的产品叙事，但公开证据无法从财务质量或治理角度证明其已准备退出。City AM 报道称，2024 年账目逾期后出现 First Gazette
              公告，并称当时最新可用账目覆盖到 2023 年；公司将此解释为不影响运营的文书延误，但这一事件提高了直接审阅申报文件的价值。在为新资金定价前，尽调应取得经审计的 FY2024 和 FY2025
              报表、月度现金与库存数据、债务契约、完全摊薄股权结构表，以及所有优先权或反稀释条款。反复申报失败、没有融资计划却持续亏损、错过 AI
              设备里程碑或出现结构化下轮融资，都应击穿投资论点；经验证的利润率和干净条款则可能改善论点。
