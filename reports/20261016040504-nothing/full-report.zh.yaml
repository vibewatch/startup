    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与当前覆盖面
        blocks:
          - type: paragraph
            body: >-
              本轮刷新证据仍将 Nothing 定义为一家总部在伦敦、以设计为核心的消费电子公司，业务覆盖智能手机、音频设备，以及较新的 AI 导向软件叙事，而不是单一硬件产品发布故事。官方页面称，公司目前已有 30+
              款产品、覆盖 60+ 个国家，并拥有超过 600 万人的全球社区；这可以作为触达范围的代理指标，但不等于经验证的活跃客户数。独立资料也维持了基本身份的一致性：公司由 Carl Pei 于 2020
              年创立，总部在伦敦，定位是让消费科技重新变得有辨识度的挑战者品牌，而不是商品化硬件。公开规模因此大致可见，但若干封面指标仍未得到指定证据池支持。
