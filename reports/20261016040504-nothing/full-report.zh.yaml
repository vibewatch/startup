companyProfile:
  summary: >-
    Nothing 是一家总部位于伦敦的消费电子公司，由 Carl Pei 及 OnePlus 生态的合作伙伴于 2020 年创立。公司销售以设计为核心的 Android 智能手机、无线音频产品和 CMF 品牌性价比配件，靠
    Nothing OS 做软件差异化，并以透明工业设计和 Glyph 界面塑造硬件品牌。公开报道显示，公司 2024 年收入已超过 $500M，累计销售额超过 $1B，并在 2025 年 9 月达到 $1.3B
    投后估值；但它仍是经审计披露稀薄的私营公司，在拓展 AI 邻近设备时也面临明显执行风险。
