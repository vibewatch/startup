        title: Traction 与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开 traction 信号总体向好，但质量参差不齐。最强信号是商业代理指标而非经审计报表：LinkedIn 帖子称，印度首家门店在不到六个月内创造接近 $3M 收入，产品如今已在美国全国 Best Buy
              门店销售；TechResearchOnline 则报道 Phone (2a/2a Plus) 首日售出超过 100,000 台。二手 Wikipedia 汇编进一步放大了规模叙事，称累计销售超过
              $1B、年收入超过 $500M、截至 2024 年已售出超过 700 万台设备。这些数据足以支持 Nothing 已超出爱好者规模的判断，但仍只是代理指标。它们没有揭示 CAC、回本期、各渠道
              sell-through、退货、营运资本周转速度，也无法说明增长是否靠促销或低毛利率零售交易买来。
