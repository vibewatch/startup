              - CM007
              - CM008
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
      - number: '2.3'
        title: 采用驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              采用 Nothing 的驱动力似乎不是硬件规格领先，而是差异化工业设计、Glyph 或 Glyph Matrix
              交互模式，以及一致的软硬件生态叙事。这对估值很重要，因为它支持公司从手机、音频和未来可穿戴设备中扩大钱包份额，而不只依赖一次性手机品牌。另一方面，持久市场力量和预算控制权的证据较弱。Sacra
              指出，Apple、Samsung、Google 和 Meta 仍是 Nothing 试图进入的确切品类中的强大在位者；City AM
              则以逾期账目警告补充了执行风险信号。结果是，市场叙事方向上具备投资吸引力，但仍不完整：公开来源支持消费需求、渠道增长和不断扩大的价格阶梯，却无法单独证明可防守的
              SAM/SOM、复购行为或分部盈利能力。这种不确定性直接限制了估值仅凭“大市场”叙事获得高置信度的空间。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 在位者、同业与现状替代品
        blocks:
          - type: paragraph
            body: >-
              指定证据并没有显示 Nothing 只在对抗一个明确对手，而是呈现出分层的替代集合。Apple 和 Samsung 仍是默认选择，Google Pixel 锚定相机与 AI
              基准，OnePlus、Xiaomi、realme 等 Android
              同业则在价值和升级逻辑上争夺同一批买家。继续使用现有手机是合乎逻辑的现状替代品，但证据池没有量化推迟升级或迁移摩擦，因此这仍是分析假设，而不是测量结果。买方自建并不是消费手机的实际路径，证据池也没有识别出具体的潜在进入者。Nothing
              当前最有证据支持的定位，是轻高端、设计导向的 Android 替代品；进入者和换机周期的覆盖仍是尽调缺口。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP012
              - CP014
