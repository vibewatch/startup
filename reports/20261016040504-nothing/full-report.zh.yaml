  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 融资证据让这家公司具备了市场关注度，但经济性和条款缺失，无法据此评估价格。
    data:
      nodes:
        - id: financing-proof
          label: 融资证据
          value: $200M Series C
          note: 公司披露和媒体报道确认了融资轮次及 Tiger Global 的领投身份。
        - id: valuation-reference
          label: 估值参考
          value: $1.3B reported mark
          note: 该估值水平得到交叉印证，但不是独立计算的公允价值。
        - id: operating-limit
          label: 运营边界
          value: Loss-making; revenue basis unclear
          note: 公开销售描述使用的期间和口径不一致。
        - id: governance-signal
          label: 治理信号
          value: Overdue-account filing episode
          note: 尽管公司称其只是文书问题，但报道中的通知提高了尽调负担。
        - id: terms-gap
          label: 条款缺口
          value: Cap table and preferences unavailable
          note: 融资额与估值之比无法确定持股比例或下行保护。
        - id: decision
          label: 决策
          value: Track / research more
          note: 完成经审计经济性和融资条款审阅后再定价。
      edges:
        - from: financing-proof
          to: valuation-reference
          label: 确立市场参考
        - from: valuation-reference
          to: operating-limit
          label: 需要运营支持
        - from: operating-limit
          to: governance-signal
          label: 提高证据风险
        - from: governance-signal
          to: terms-gap
          label: 增加尽调负担
        - from: terms-gap
          to: decision
          label: 阻止买入判断
    approximationNotes: 15.4% 的融资额与估值之比只是简单算术；该图不推断持股比例、投前与投后口径、稀释或证券优先级。
    claimRefs:
      - CV001
      - CV006
      - CV009
      - CV011
      - CV015
      - CV016
