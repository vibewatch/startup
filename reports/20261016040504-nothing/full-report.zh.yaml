      - number: '4.3'
        title: 成本结构与资本充足性
        blocks:
          - type: paragraph
            body: >-
              审阅的证据池支持硬件式成本结构，但不足以完整判断资本充足性。Sacra
              明确称设备销售是主要收入来源，并说制造外包给中国和印度，而研发与设计留在内部；公司也会承受零部件成本、运费、关税、保修准备金和零售商分成等典型硬件敏感项。融资 headline 也清晰可见：Tracxn 和
              Sacra 都将累计融资放在 $450M 以上，并描述 2025 年 9 月以 $1.3B 估值完成的 $200M Series C。缺失的是从这笔融资到当前 runway 的桥接。City AM 在 2026
              年 3 月报道 Nothing 未能按期提交 2024 年账目，这在财务上很重要，因为最新公开申报账目仍止于 2023 年，过去两个运营年度的毛利率、烧钱、债务和契约空间都无法核实。
            claimRefs:
              - CI009
              - CI010
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: 财务判断
        blocks:
          - type: paragraph
            body: >-
              Nothing 看起来是一家可以融资的设计导向硬件挑战者，但仅凭公开证据还不足以完成投资判断。商业模式、价格阶梯、零售扩张和融资历史都足以支撑收入增长及品类扩张的前瞻叙事。然而，缺失经审计的
              FY2024-FY2025 报表，意味着投资人仍缺少检验收入确认质量、综合毛利率、营运资本强度和 Series C 后 runway 的核心输入。正确的财务结论应当是建设性但谨慎：公开 traction
              暗示需求和渠道触达，但利润路径和融资依赖仍是尽调事项，而不是已解决的优势。
            claimRefs:
              - CI003
              - CI009
              - CI015
              - CI016
      - number: '4.5'
        title: 展品
        blocks:
          - type: callout
            title: 公开证据支持商业模式，不支持变现质量
            body: 审阅的证据池持续把 Nothing 描述为一家拥有清晰价格阶梯和不断扩张零售覆盖的硬件销售商，但保留的来源都没有把标价转化为实际 ASP、净收入或按 SKU 划分的毛利率。
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI008
          - type: callout
            title: 账目逾期在财务上具有实质影响
            body: City AM 报道 Nothing 错过 2024 年账目提交期限，这一点很重要，因为最新公开申报报表仍停留在 2023 年，阻碍了对 2025 年 Series C 后烧钱、营运资本、债务和契约余量的核实。
            calloutType: risk
            claimRefs:
              - CI015
              - CI016
          - type: callout
            title: 按成长阶段硬件看待，而不是按已披露 SaaS 看待
            body: 正确的尽调框架，是把 ASP、毛利率、退货、库存和渠道条款纳入硬件投资判断。当前公开记录不支持软件式效率指标，也不支持清晰的 runway 分析。
            calloutType: recommendation
            claimRefs:
              - CI002
              - CI014
              - CI016
