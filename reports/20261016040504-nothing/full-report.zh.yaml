      - number: '8.3'
        title: 情景与可比限制
        blocks:
          - type: paragraph
            body: >-
              由于证据池没有经审计盈利基础、现金流预测、单位经济性或可用交易倍数，情景框架必须保持定性。乐观情景要求 AI
              原生路线图转化为持久需求和更好的经济性；基准情景假设产品活动持续，但在财务披露前暂缓估值判断；悲观情景则结合持续亏损、执行滑坡和更弱融资条款。SetterVC 将
              OnePlus、Samsung、Apple、Motorola、Google 和 Xiaomi
              列为示例竞争对手，但没有提供可比收入、利润率、增长或估值分母，并警告名单可能不完整或过时。这些名称只是勾勒竞争场，不是独立估值基准，也不能证明某个倍数合理。
            claimRefs:
              - CV009
              - CV010
