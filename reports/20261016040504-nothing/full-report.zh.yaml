            body: >-
              公开领导层证据仍以创始人为中心。Carl Pei 依旧是被点名的创始人和 CEO，Nothing
              的品牌、产品叙事和融资故事都由他主导；这在智能手机和硬件品牌塑造上形成较强创始人与市场匹配，但也带来明确的关键人物依赖。指定证据池对更广泛的高管梯队和正式治理的覆盖，远弱于对产品和融资信息的覆盖。池中唯一具体的治理更新，是
