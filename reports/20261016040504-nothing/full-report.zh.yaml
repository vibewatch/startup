        - 品类采用和执行仍需证明
        - 需要经审计的经济性数据及独立的发布后市场进展证据
      - - 基准
        - 产品继续运营，融资支撑日常经营，但披露仍不完整
        - 仅将 $1.3B 视为最新报道的估值锚点，暂缓公允价值判断
        - 亏损、稀释幅度和现金需求仍未知
