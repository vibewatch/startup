  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              现有证据把 Nothing 描绘成一家消费硬件公司，销售设计统一的智能手机、音频产品、配件和相关软件体验，而不是企业软件、运营商基础设施或纯零部件业务。Wikipedia 和 Sacra
              都称公司覆盖智能手机和音频；当前官方页面也显示，CMF 音箱、耳机和最新旗舰手机仍在积极销售。因此，相关支出池是消费可选电子产品，尤其是消费者购买决策中看重设计、工业身份和轻量生态整合的智能手机与音频市场部分。

              实际的现状替代品不是“什么都不买”，而是从 Apple、Samsung、Google 或低价 Android 品牌购买主流手机和耳机套装。Nothing 的市场边界因此位于高端在位者与性价比 Android
              品牌之间：足够宽，可以纳入邻近音频产品和未来可穿戴设备；但又窄于全球消费电子整体市场。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM010
      - number: '2.2'
        title: 规模测算视角、消费层级与买方结构
        blocks:
          - type: paragraph
            body: >-
              公开证据对已实现的市场 traction 和价格体系的支持强于对经典外部 TAM 数学的支持。City AM 称，前期发布产品在 2025 年带来 $1B 销售额，并在 2024 年增长
              150%；Wikipedia 称，截至 2026 年 5 月，Nothing 的累计收入已超过 $2B。这些数据点并不完美，但至少锚定了已观察到的需求。Sacra 进一步给出最清晰的当前价格阶梯：$799
              旗舰手机、£349 中端手机，以及 $49 起的 CMF 产品；TechResearch 则将 CMF 手机价格放在约
              $199。这个价差说明买方不止一类，而非只有一款明星设备。可能的买方层级包括重视设计的旗舰升级者、主流中端 Android 买家和价格敏感的 CMF 买家，用户和付款人通常是同一家庭消费者。Sacra
              称，Nothing 在印度的实体门店从 2,000 家扩至 7,000 家，且印度占出货量超过 20%，因此印度对近期采用率的影响尤为重要。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM011
