              - CP013
              - CP014
      - number: '3.2'
        title: 差异化存在，但更多是体验而非绝对优势
        blocks:
          - type: paragraph
            body: >-
              在指定来源中，Nothing 的竞争论点异常一致：透明工业设计、Glyph 界面、更干净的软件和可识别的品牌语言承担了大部分战略工作。当前产品页仍在主推 Glyph、Essential Search 和四颗
              50MP 摄像头的旗舰机；一份独立的 2026 年评测也持续强调接近原生 Android、具有竞争力的价格和长期软件支持。这足以让 Nothing 成为 Samsung 和 Apple
              的可识别替代品，但不等于它拥有最好的相机系统、最广的产品组合或最深的生态。在本章证据范围内，护城河首先是品牌和产品体验，而不是竞争对手无法回应的硬技术锁定。
            claimRefs:
              - CP006
              - CP007
              - CP012
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP014
      - number: '3.3'
        title: 分销与切换成本决定真实竞争
        blocks:
          - type: paragraph
            body: >-
              Nothing 的上市路径比在位者窄，但仍有意义。官方商店提供免费配送、退货、灵活融资、保修覆盖和社区更新；价格阶梯证据也说明，公司可以先用低价 CMF 配件把用户吸引进品牌，再让他们购买更高端手机。这支持
              Nothing 家族内部的多产品绑定，但指定证据没有量化这种绑定是否形成可与在位者生态相比的锁定。真正的切换问题是：干净的
              Android、更强的视觉身份和较低的历史入门价格，是否足以克服买家对当前生态的熟悉感。在缺少用户群留存、迁移、多产品绑定率或多归属数据的情况下，这道壁垒的大小仍无法确定。
            claimRefs:
              - CP003
              - CP008
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP013
      - number: '3.4'
        title: 护城河具备持久性，但治理噪音抬高了门槛
        blocks:
          - type: paragraph
            body: >-
              指定证据池中最清晰的反向证据不是直接的产品失败，而是信任风险。Companies House 在抓取时仍显示 Nothing 账目逾期；申报历史记录显示，2026 年 3 月发出的注销公告后来被撤回；City
              AM 也标记了董事变动。这些事实都不能证明运营故事已经失效，但在挑战者已经要求客户牺牲分销广度、相机口碑和装机基础确定性的市场里，它们确实重要。实际而言，Nothing
              的设计护城河仍有价值，但要让换机用户安心，它必须配合比大型在位者更干净的执行。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与价格阶梯
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个直接结论：Nothing 靠销售消费硬件赚钱，而不是靠已披露的订阅或服务业务。审阅的来源显示，公司从旗舰手机开始，向中端和预算型 CMF
              设备下探，再延伸到音频配件。这让收入模式清晰可见，尽管实际变现情况并不清晰。Sacra 提供最清楚的公开价格体系，官方商店和 Phone (3) 页面也确认 Nothing
              正通过自有电商界面积极销售设备。对投资判断而言，公开标价不是实际 ASP，产品页也不是 sell-through 证据。投资人可以有把握地描述价格架构，但在判断收入质量或毛利率韧性前，仍需要按 SKU 划分的
              ASP、退货、折扣和渠道扣除数据。
