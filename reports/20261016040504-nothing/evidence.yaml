evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited FY2024 and FY2025 financial statements, including revenue, gross margin, operating cash burn, debt, and
      covenant detail.
    whyItMatters: >-
      The current valuation and scale story cannot be underwritten without verified recent financial performance and
      reporting quality.
    diligencePath: Request the last two audited annual statements plus current management accounts and debt schedules.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-headcount
    missingEvidence: Verified customer count, active installed base, geographic revenue mix, and current headcount.
    whyItMatters: >-
      The assigned pool supports reach proxies, but not the core operating metrics later valuation and
      market-penetration work will need.
    diligencePath: Request a board KPI pack or investor update covering customers, sell-through, geography mix, and employee count.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Current board slate, ownership percentages, liquidation preferences, observer rights, and community-investment
      instrument terms.
    whyItMatters: >-
      Control rights and downside economics can differ materially from the simple investor list visible in public
      sources.
    diligencePath: Review the cap table, shareholder agreement, board consents, and community-financing legal documents.
    relatedQuestionRefs:
      - QO003
      - QO007
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      A transparent third-party TAM/SAM/SOM build by geography and product tier, including assumptions for phones,
      audio, and future wearables.
    whyItMatters: >-
      Without a disclosed market model, valuation can over-read brand momentum and channel growth as proof of broad
      addressable demand.
    diligencePath: >-
      Obtain current counterpoint-style handset category cuts, audio category data, and internal segment mix to build a
      reconciled market model.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-owner
    missingEvidence: >-
      Cohort-level repeat purchase, channel mix, budget ownership, and attach-rate data across flagship Nothing and CMF
      buyers.
    whyItMatters: >-
      The chapter can infer buyer types from pricing and distribution, but it cannot prove retention quality or
      cross-sell depth without customer-level data.
    diligencePath: >-
      Request management cohort dashboards covering repeat purchases, accessory attach, direct-vs-retail mix, and
      geography-level GMV.
    relatedQuestionRefs:
      - QM003
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: exact-current-pricing
    missingEvidence: >-
      Current official MSRP, carrier promos, and channel discounts for Nothing Phone (3) and the named rival devices
      across the same geographies.
    whyItMatters: >-
      Without matched current pricing, the chapter can position Nothing qualitatively but cannot quantify price undercut
      or premium capture versus each rival.
    diligencePath: >-
      Collect current official product pages or carrier listings for Nothing, Apple, Samsung, Pixel, and the named
      Android peers in the same market.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-retention
    missingEvidence: Cohort-level repeat purchase, cross-device attachment, warranty claim, and return-rate data for Nothing users.
    whyItMatters: >-
      The real durability of a design-led challenger depends on whether first-time switchers stay, rebuy, and expand
      into the ecosystem.
    diligencePath: Request cohort retention, accessory attach, and warranty-return metrics from management or channel partners.
    relatedQuestionRefs:
      - QP004
      - QP006
      - QP008
  - type: missing-source
    severity: minor
    topic: distribution-breadth
    missingEvidence: >-
      A current, geography-by-geography list of carrier, retail, and marketplace partners for Nothing versus the named
      incumbents.
    whyItMatters: Distribution breadth changes how hard it is for incumbents to outspend or out-place Nothing at launch.
    diligencePath: >-
      Gather current regional retail and carrier partner lists from official commerce and channel pages for Nothing and
      benchmark peers.
    relatedQuestionRefs:
      - QP004
  - type: enumeration-incomplete
    severity: minor
    topic: entrants-and-internal-build
    missingEvidence: >-
      A source-backed map of likely new smartphone entrants and any credible buyer-led or private-label internal-build
      path.
    whyItMatters: >-
      The current pool names incumbents and Android peers but cannot establish that the competitive set is exhaustive or
      that no new entrant can emerge.
    diligencePath: >-
      Review current OEM launch trackers, chipset reference-design programs, carrier private-label portfolios, and
      recent market-entry announcements.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Audited FY2024 and FY2025 consolidated financial statements covering revenue, gross margin, opex, debt, and cash
      flow.
    whyItMatters: >-
      Without current statements, investors cannot verify whether post-Series-C scale translated into margin improvement
      or larger financing dependency.
    diligencePath: >-
      Request the latest audited board pack and statutory filings, then bridge legal-entity results to the consolidated
      group.
    relatedQuestionRefs:
      - QI009
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized ASPs, discounting, retailer take-rates, returns, and warranty accruals by product family.
    whyItMatters: >-
      List pricing and product pages do not show whether revenue quality is supported by healthy realized pricing or
      eroded by channel incentives.
    diligencePath: Review SKU-level sales, promo calendars, channel agreements, and reserve policies for phones, audio, and CMF.
    relatedQuestionRefs:
      - QI002
      - QI004
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: cost-structure
    missingEvidence: >-
      Blended gross margin and contribution margin by phones, audio, and CMF, including freight, duties, and warranty
      reserves.
    whyItMatters: >-
      Hardware scale is only investable if product margins and post-sale obligations leave enough contribution to fund
      growth.
    diligencePath: >-
      Obtain a recent margin bridge with BOM, logistics, channel, and warranty assumptions for each major product
      family.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, covenant headroom, and a use-of-funds plan for the 2025 Series C.
    whyItMatters: >-
      The funding headline cannot be translated into runway or next-round timing without current liquidity and
      obligation data.
    diligencePath: Request treasury, debt, and forecast materials that reconcile cash, burn, and minimum-liquidity thresholds.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: enumeration-incomplete
    severity: minor
    topic: public-traction
    missingEvidence: Geographic and product-family revenue mix, repeat purchase, return rates, and sell-through by channel.
    whyItMatters: Headline growth can mask concentration, weak repeat behavior, or inventory build in specific SKUs or markets.
    diligencePath: Break out revenue, units, and returns by country, channel, and product family for the last six quarters.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Public or shared diligence materials showing security audits, privacy architecture, certifications, and
      incident-response controls for Nothing OS, Essential Space, and companion apps.
    whyItMatters: >-
      Product ambition is shifting toward AI-style capture and ecosystem workflows, which increases the underwriting
      importance of trust controls beyond launch marketing.
    diligencePath: >-
      Request security and privacy documentation, external audit results, certification scope, and internal control
      owners for Nothing OS and companion-cloud workflows.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: support-reliability
    missingEvidence: >-
      Verified metrics on returns, warranty claims, software defect rates, uptime/service reliability, and
      customer-support responsiveness by product family and geography.
    whyItMatters: >-
      Hardware breadth only compounds value if launch quality and after-sales support keep pace; otherwise portfolio
      expansion can amplify operational drag.
    diligencePath: >-
      Obtain cohort-level support dashboards, RMA data, post-launch bug/patch timelines, and country-level
      service-network coverage.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Measurable public adoption data for the Glyph SDK, community tools, or other third-party extension surfaces such
      as repository activity, package use, or active developer counts.
    whyItMatters: >-
      Without adoption data, the community/developer layer is a narrative enhancer but not yet strong evidence of a
      platform moat.
    diligencePath: >-
      Ask for SDK usage metrics, active developers, showcase apps, and any public repositories or package-download
      history that demonstrate real extension activity.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: >-
      Cohort retention evidence such as repeat-purchase rates, churn, NRR/GRR, warranty claims, product return rates,
      and attach rates by product family.
    whyItMatters: >-
      Without durability metrics, the chapter can verify acquisition bursts and channel growth but cannot judge whether
      Nothing is building recurring loyalty or simply generating launch spikes.
    diligencePath: >-
      Request cohort dashboards by geography and product line, including repurchase windows, returns, warranty
      incidence, and upgrade behaviour.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Revenue mix by geography, direct webstore vs third-party retail, and exposure to top retail or distribution
      partners.
    whyItMatters: >-
      India appears strategically important, but investors cannot size channel dependence, partner concentration, or
      whether offline expansion is broad-based without internal sell-through detail.
    diligencePath: >-
      Obtain channel revenue mix, top-partner sell-through, and regional concentration data for the latest twelve
      months.
    relatedQuestionRefs:
      - QU004
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table
    missingEvidence: >-
      A fuller public roster of named customer proof objects, ideally customer testimonials, retailer references,
      marketplace reviews, or audited sell-through by channel.
    whyItMatters: >-
      The chapter’s named-proof table is limited to launches, waitlists, and retail-footprint indicators, which are
      weaker than independent customer references for testing real adoption quality.
    diligencePath: >-
      Collect channel-partner references, marketplace review aggregates, customer service metrics, and any retailer or
      operator disclosures tied to specific Nothing SKUs.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: governance-filing
    missingEvidence: >-
      Filed FY2024 and FY2025 audited accounts, auditor sign-off, and direct Companies House extracts confirming current
