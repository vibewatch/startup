chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and current footprint
        blocks:
          - type: paragraph
            body: >-
              The current refresh evidence still frames Nothing as a London-based, design-led consumer-electronics
              company built around smartphones, audio devices, and newer AI-oriented software messaging rather than a
              single-product hardware launch story. Official pages say the company now spans 30+ product releases,
              serves 60+ countries, and speaks to a global community of more than six million people, which is useful as
              a reach proxy even though it is not the same as verified active customers. Independent profiles also keep
              the basic identity stable: founded by Carl Pei in 2020, headquartered in London, and positioned as a
              challenger brand trying to make consumer tech feel distinctive again rather than commodity hardware.
              Public scale is therefore directionally visible, but several cover metrics still remain unsupported by the
              assigned pool. 
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO013
