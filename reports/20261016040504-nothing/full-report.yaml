  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal view of ecosystem power versus brand/design distinctiveness across the main alternative sets named in the
      assigned evidence.
    data:
      xAxis:
        label: Ecosystem / distribution power
        min: 1
        max: 5
        low: low
        high: high
        description: Ordinal score based on cited evidence about installed-base lock-in, channel breadth, and ecosystem depth.
        scale: ordinal
      yAxis:
        label: Design / brand distinctiveness
        min: 1
        max: 5
        low: low
        high: high
        description: Ordinal score based on cited evidence about visual differentiation, community pull, and product identity.
        scale: ordinal
      points:
        - label: Nothing
          x: 2
          'y': 5
          tone: opportunity
          note: Differentiates through transparent hardware, Glyph, clean Android, and creator-community pull.
        - label: Apple iPhone ecosystem
          x: 5
          'y': 2
          tone: high
          note: Ecosystem strength dominates loyalty, making Apple the strongest lock-in benchmark in the assigned evidence.
        - label: Samsung Galaxy
          x: 5
          'y': 2
          tone: high
          note: Broad portfolio and distribution lead make Samsung the scale incumbent on the Android side.
        - label: Google Pixel
          x: 3
          'y': 3
          tone: medium
          note: Pixel is treated as the camera-and-AI benchmark rather than the design benchmark.
        - label: OnePlus
          x: 3
          'y': 2
          tone: medium
          note: Community roots and performance value keep OnePlus in the same switcher conversation.
        - label: Xiaomi / realme
          x: 2
          'y': 1
          tone: warning
          note: These brands pressure the mid-band with aggressive price-spec competition rather than distinctive identity.
    approximationNotes: >-
      Axes are evidence-backed ordinal scores derived from the assigned comparison sources, not inferred market-share
      percentages.
