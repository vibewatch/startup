figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Nothing moved from 2020 formation into a 2025 late-stage financing mark, but the 2026 late-accounts notice
      complicates the refresh narrative.
    data:
      items:
        - date: 2020-10
          label: Founded in London
          detail: Dealroom describes Nothing as founded in October 2020 by Carl Pei and headquartered in London.
          tone: neutral
          claimRefs:
            - CO003
        - date: 2021-07
          label: Ear (1) launches
          detail: Dealroom and Designboom describe Ear (1) as Nothing's first product launch.
          tone: positive
          claimRefs:
            - CO010
        - date: 2022-07
          label: Phone (1) reaches market
          detail: >-
            Dealroom dates Phone (1) to July 2022, and a syndicated 2022 report framed it as the first UK-designed
            smartphone launch in more than five years.
          tone: positive
          claimRefs:
            - CO011
        - period: '2023'
          label: CMF by Nothing launches
          detail: Dealroom says Nothing added the CMF sub-brand in 2023 to address more price-sensitive buyers.
          tone: opportunity
          claimRefs:
            - CO012
        - period: '2024'
          label: Scale crosses $1B lifetime sales
          detail: >-
            Dealroom says Nothing surpassed $1 billion in lifetime sales by 2024 and sold more than 7 million devices
            worldwide.
          tone: positive
          claimRefs:
            - CO013
        - date: 2025-09
          label: Series C resets the valuation mark
