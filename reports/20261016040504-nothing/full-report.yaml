      - number: '1.3'
        title: Funding history and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The strongest supported financial facts in the assigned pool are the September 2025 financing mark and the
              investor mix around it. Sacra says Nothing raised $200 million in a Series C led by Tiger Global at a $1.3
              billion valuation and had raised more than $450 million in total since founding, with existing investors
              GV, Highland Europe, and EQT Ventures participating alongside new investor Qualcomm Ventures and Nikhil
              Kamath. Dealroom also points to community financing as more than a marketing layer, citing more than $16
              million from roughly 13,000 investors, while the current Nothing site confirms that Community Investment
              (3) has already closed. What remains opaque is the cap table beneath those labels: ownership percentages,
              liquidation preferences, board rights, and whether community instruments have any governance consequences.
            claimRefs:
