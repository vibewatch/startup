      - number: '5.2'
        title: Operating stack, software layer, and ecosystem ambition
        blocks:
          - type: paragraph
            body: >-
              Nothing's architecture reads like a vertically curated consumer-device stack rather than a pure software
              platform. Hardware remains the anchor, but the company is layering an Android-based Nothing OS, custom
              interaction surfaces such as Glyph, AI-style capture and organization through Essential Space, and
              first-party companion utilities around that device base. Public materials also show a community/developer
              edge: a Glyph SDK, a creations hub, and product-specific apps that connect phones and audio devices into a
              single user experience. Even so, the evidence suggests an early ecosystem, not a large developer platform
              with measurable third-party adoption. A secondary analysis describes the strategy as moving toward
              integrated ecosystem experiences, but today's proof remains strongest on feature packaging and product
              cohesion rather than on a disclosed technical moat.
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE008
              - CE013
          - type: table
