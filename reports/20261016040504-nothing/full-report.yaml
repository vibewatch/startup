      - number: '1.2'
        title: Leadership, governance, and concentration
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence remains founder-centric. Carl Pei is still the named founder and chief
              executive around whom Nothing's brand, product narrative, and fundraising story are organized, which
              creates strong founder-market fit in smartphones and hardware branding but also a clear key-person
              dependency. The assigned pool is much thinner on the broader executive bench and formal governance than it
              is on product and financing messaging. The one concrete governance update in the pool is City AM's report
              that director Timothy Bruce Warren Holbrow resigned in October 2025 after joining in April 2023. That
              gives a tangible board-change data point, but not enough visibility into board composition, reserved
              matters, or investor control rights.
