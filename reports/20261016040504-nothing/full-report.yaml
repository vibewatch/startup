      - number: '6.2'
        title: Adoption signals show real demand, but mostly top-line demand
        blocks:
          - type: paragraph
            body: >-
              Nothing has enough public demand evidence to clear the “is anyone buying this?” test. Independent sources
              in the pool say the company has sold more than 7 million devices, the Phone (2) crossed 600,000 units in
              its first year, and the Phone (2a) passed 100,000 units on launch day. The same pool also shows community
              investors across 80 countries and flagship-store expansion into Bengaluru, New York, and Tokyo. Together
              these signals support real commercial traction across geographies and price bands, but they are still
              mostly shipment, launch, or community indicators; they do not yet reveal cohort retention, repeat
              purchase, or returns by product family.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
