  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and channel design
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool points to Nothing selling primarily to end consumers, not named enterprise
              accounts. Sacra describes the company as a "B2C hardware business model" with price tiers spanning premium
              Nothing phones, mid-range devices, and budget CMF products, while the official storefront foregrounds
              consumer checkout mechanics such as free delivery, returns, flexible payments, price match, and warranty
              coverage. Public distribution evidence also spans direct web checkout, same-day pickup for the current
              flagship in some markets, and a growing offline footprint in India, suggesting customer acquisition now
              mixes brand-led D2C demand with mainstream retail expansion rather than relying on a single online
              flash-sale channel.
            claimRefs:
              - CU001
              - CU002
              - CU003
