              - CE007
              - CE008
              - CE013
      - number: '5.3'
        title: Maturity, trust, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Product breadth is still expanding. External reporting indicates that Nothing may widen its audio line
              into portable speakers, which would fit the brand's move from earbuds into over-ear products and a broader
              device ecosystem. The larger diligence issue is maturity, not imagination. The public evidence pool
              contains strong launch and feature messaging, but much less direct proof on security controls, uptime,
              quality systems, support performance, or compliance operating rigor. That gap matters because Nothing has
              already had at least one visible software-trust failure in the Nothing Chats episode, and City AM
              separately reported a late-accounts warning in 2026. Together those facts do not prove systemic product
              unreliability, but they do mean trust, governance, and post-launch execution should be treated as open
              diligence items rather than assumed strengths.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Trust proof trails the product narrative
            body: >-
              Nothing's public product story is concrete on design, launches, and feature packaging, but the assigned
              evidence set is much thinner on security controls, support quality, and compliance process. That mismatch
              matters because the 2023 Nothing Chats failure and the 2026 late-accounts warning both show execution risk
              outside industrial design.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE012
          - type: callout
            title: Ecosystem ambition is credible, but still early
            body: >-
              The evidence supports a real move from single-device branding toward a curated ecosystem of phones, audio,
              apps, and AI-style workflows, yet it does not show a scaled external developer or services moat. Today the
              moat is mostly design-led integration rather than a broad platform effect.
            calloutType: insight
            claimRefs:
