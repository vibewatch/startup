      - number: '4.2'
        title: Traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Public traction is directionally encouraging but uneven in quality. The strongest signals are commercial
              proxies rather than audited statements: LinkedIn posts claim the first India store generated close to $3
              million in revenue in less than six months and that products are now available at Best Buy stores
              nationwide in the United States, while TechResearchOnline reports more than 100,000 launch-day units for
              Phone (2a/2a Plus). A secondary Wikipedia compilation pushes the scale narrative further by claiming more
              than $1 billion of lifetime sales, more than $500 million of annual revenue, and more than 7 million
              devices sold by 2024. These datapoints are enough to support a view that Nothing has moved beyond hobbyist
              scale, but they are still proxies. They do not reveal CAC, payback, sell-through by channel, returns,
              working-capital velocity, or whether growth is being bought with promotions or low-margin retail deals.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI011
              - CI013
              - CI015
              - CI016
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The reviewed pool supports a hardware-style cost structure but not a complete capital-adequacy view. Sacra
              explicitly describes device sales as the primary revenue source and says manufacturing is outsourced to
              China and India while R&D and design remain internal, which implies the usual hardware sensitivities
              around component costs, freight, duties, warranty reserves, and retailer take-rates. Funding is also
              visible at the headline level: both Tracxn and Sacra place total capital raised above $450 million and
              describe a $200 million Series C in September 2025 at a $1.3 billion valuation. What remains missing is
              the bridge from that financing to present-day runway. City AM's March 2026 report that Nothing missed the
              filing deadline for 2024 accounts is financially material because it means the latest publicly available
              filed accounts still end in 2023, leaving gross margin, burn, debt, and covenant capacity unverified for
              the last two operating years.
            claimRefs:
              - CI009
              - CI010
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Nothing looks financeable as a design-led hardware challenger, but not yet underwritable on public
              evidence alone. The business model, pricing ladder, retail expansion, and fundraising history are all
              clear enough to support a forward narrative around revenue generation and category expansion. However, the
              missing audited FY2024-FY2025 statements mean investors still lack the core inputs needed to test revenue
              recognition quality, blended gross margin, working-capital intensity, and post-Series-C runway. The right
              financial read is therefore constructive but cautious: public traction suggests demand and channel reach,
              yet margin path and financing dependency remain diligence items rather than resolved strengths.
            claimRefs:
              - CI003
              - CI009
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports the model, not the monetization quality
            body: >-
              The reviewed pool consistently describes Nothing as a hardware seller with a visible pricing ladder and
              expanding retail footprint, but none of the retained sources translate list pricing into realized ASP, net
              revenue, or gross margin by SKU.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI008
          - type: callout
            title: The late-accounts issue is financially material
            body: >-
              City AM's report that Nothing missed the filing deadline for 2024 accounts matters because it leaves the
              latest public filed statements stuck at 2023, which blocks verification of burn, working capital, debt,
              and covenant headroom after the 2025 Series C.
            calloutType: risk
            claimRefs:
              - CI015
              - CI016
          - type: callout
            title: Treat the company as growth-stage hardware, not as disclosed SaaS
            body: >-
              The right diligence frame is a hardware underwriting case centered on ASP, gross margin, returns,
              inventory, and channel terms. The current public record does not support software-style efficiency metrics
              or a clean runway analysis.
            calloutType: recommendation
            claimRefs:
              - CI002
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and buyer-facing workflow
        blocks:
          - type: paragraph
            body: >-
              The visible product map is already broader than a single flagship-phone story. Public sources show Nothing
              selling phones, earbuds, headphones, and companion software experiences, while the CMF line extends the
              portfolio into lower-price hardware without abandoning the parent company's design language. That matters
              because the customer workflow is not just "buy a phone"; it is buy into a recognizable consumer-tech stack
              where industrial design, camera hardware, audio accessories, and branded software features reinforce one
              another. The product proof is strongest at the surface layer: flagship phone features, the signature Glyph
              hardware, and the growing list of audio SKUs are all publicly visible. The weaker part of the evidence is
              not what Nothing sells, but how defensible the resulting ecosystem is beyond aesthetics, iteration speed,
              and community attention.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE009
