          values: [Medium, Medium-High, Low, Medium-High]
        - label: Capital discipline versus launch cadence
          note: Public scale claims and reported layoffs suggest the company is still balancing growth expectations against operating capacity.
          values: [Medium-High, Medium-High, Low, Medium-High]
        - label: Direct-commerce and support execution
          note: Returns, warranty, flexible payments, and pickup promises keep service quality visible to end customers.
          values: [Medium, Medium-High, Medium, Medium-High]
    claimRefs: [CR002, CR005, CR007, CR008, CR015, CR016]
callouts:
  - calloutType: risk
    title: Highest near-term tripwire
    body: >-
      Treat statutory filing hygiene as the first hard stop. If current audited
      accounts and finance-control explanations do not materialize promptly, the
      risk is not just paperwork noise but weak internal controls during a scale
      phase.
    claimRefs: [CR001, CR002, CR003, CR014]
  - calloutType: recommendation
    title: Kill criteria before underwriting upside
    body: >-
      Pause a bullish case if filings slip again, if additional cuts reach
      customer-facing teams, if launch/support quality deteriorates, or if India
      and CMF expansion cannot be tied to better economics and cleaner public
      disclosure.
    claimRefs: [CR005, CR007, CR013, CR015]
