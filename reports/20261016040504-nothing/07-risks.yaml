      severity: material
      topic: governance-filing
      missingEvidence: Filed FY2024 and FY2025 audited accounts, auditor sign-off, and direct Companies House extracts confirming current status.
      whyItMatters: Without current accounts, investors cannot verify burn, margin, working-capital stress, or whether the filing lapse has been fully remediated.
      diligencePath: Request audited financial statements, finance-control memos, and up-to-date Companies House records before underwriting a cleaner risk rating.
      relatedQuestionRefs: [QR008]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: supplier-concentration
      missingEvidence: Contract manufacturer mix, channel economics, warranty reserve data, and return/failure rates for the India and CMF footprint.
      whyItMatters: Public materials confirm India concentration but do not show whether the footprint improves economics or stretches operations.
      diligencePath: Ask management for supplier concentration, inventory turns, warranty claims, and India-region gross-margin contribution by product family.
      relatedQuestionRefs: [QR004]
      relatedTableRefs: [TR003]
    - type: missing-source
      severity: material
