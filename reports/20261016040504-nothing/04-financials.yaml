company:
  name: Nothing
chapter:
  number: 4
  title: Financials
  summary: >-
    Nothing's public financial picture is legible at the business-model level:
    device-led revenue, a tiered hardware pricing ladder, and a broader retail
    push. It is still not underwriting-grade because the reviewed sources do not
    disclose audited FY2024-FY2025 statements, gross margin, burn, or cash
    runway. The September 2025 $200 million Series C and reported commercial
    traction reduce near-term solvency anxiety, but the late-accounts episode
    and thin entity-level disclosure keep capital adequacy and revenue quality as
    material diligence blockers.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing ladder
    body: >-
      Public evidence supports a straightforward conclusion about how Nothing
      makes money: it sells consumer hardware, not a disclosed subscription or
      services business. The reviewed sources show a ladder that starts with
      flagship phones, steps down into mid-range and budget CMF devices, and
      extends into audio accessories. That makes the revenue model legible even
      though realized monetization is not. Sacra provides the clearest public
      pricing stack, while the official storefront and Phone (3) page confirm
      that Nothing is actively merchandising devices through its own commerce
      surface. The important distinction for underwriting is that public list
      pricing is not realized ASP, and a product page is not evidence of
      sell-through. Investors can describe the pricing architecture with
      confidence, but still need SKU-level ASPs, returns, discounts, and channel
      deductions before they can judge revenue quality or gross-margin resilience.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-sales-efficiency-proxies
    title: Traction and sales-efficiency proxies
    body: >-
      Public traction is directionally encouraging but uneven in quality. The
      strongest signals are commercial proxies rather than audited statements:
      LinkedIn posts claim the first India store generated close to $3 million
      in revenue in less than six months and that products are now available at
      Best Buy stores nationwide in the United States, while TechResearchOnline
      reports more than 100,000 launch-day units for Phone (2a/2a Plus). A
      secondary Wikipedia compilation pushes the scale narrative further by
      claiming more than $1 billion of lifetime sales, more than $500 million of
      annual revenue, and more than 7 million devices sold by 2024. These
      datapoints are enough to support a view that Nothing has moved beyond
      hobbyist scale, but they are still proxies. They do not reveal CAC,
      payback, sell-through by channel, returns, working-capital velocity, or
      whether growth is being bought with promotions or low-margin retail deals.
    claimRefs: [CI006, CI007, CI008, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: cost-structure-and-capital-adequacy
    title: Cost structure and capital adequacy
    body: >-
      The reviewed pool supports a hardware-style cost structure but not a
      complete capital-adequacy view. Sacra explicitly describes device sales as
      the primary revenue source and says manufacturing is outsourced to China
      and India while R&D and design remain internal, which implies the usual
      hardware sensitivities around component costs, freight, duties, warranty
      reserves, and retailer take-rates. Funding is also visible at the headline
      level: both Tracxn and Sacra place total capital raised above $450 million
      and describe a $200 million Series C in September 2025 at a $1.3 billion
      valuation. What remains missing is the bridge from that financing to
      present-day runway. City AM's March 2026 report that Nothing missed the
      filing deadline for 2024 accounts is financially material because it means
      the latest publicly available filed accounts still end in 2023, leaving
      gross margin, burn, debt, and covenant capacity unverified for the last
      two operating years.
    claimRefs: [CI009, CI010, CI014, CI015, CI016]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      Nothing looks financeable as a design-led hardware challenger, but not yet
      underwritable on public evidence alone. The business model, pricing ladder,
      retail expansion, and fundraising history are all clear enough to support
      a forward narrative around revenue generation and category expansion.
      However, the missing audited FY2024-FY2025 statements mean investors still
      lack the core inputs needed to test revenue recognition quality, blended
      gross margin, working-capital intensity, and post-Series-C runway. The
      right financial read is therefore constructive but cautious: public
      traction suggests demand and channel reach, yet margin path and financing
      dependency remain diligence items rather than resolved strengths.
    claimRefs: [CI003, CI009, CI015, CI016]
