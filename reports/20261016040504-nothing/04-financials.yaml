figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows a hardware-first model in which Nothing sells
      devices through its own storefront and retail partners, then absorbs
      outsourced manufacturing and channel costs before any gross profit is
      visible.
    data:
      nodes:
        - id: storefront
          label: nothing.tech commerce
          value: "Free delivery, returns, flexible payments, and price match"
        - id: retail
          label: Retail partners and stores
          value: "Best Buy nationwide and India store rollout"
        - id: devices
          label: Phones, audio, and CMF devices
          value: "Flagship, mid-range, budget, and audio SKUs"
        - id: pricing
          label: Public list-pricing ladder
          value: "$799 flagship; £349 mid-range; $49+ CMF"
        - id: revenue
          label: Device revenue
          value: "Commercial traction is public, but audited FY2024-FY2025 revenue is not"
        - id: costs
          label: Manufacturing and channel costs
          value: "China/India outsourcing plus retailer deductions"
        - id: gross-profit
          label: Gross profit / cash generation
          value: "Margin and burn are undisclosed in retained public sources"
      edges:
        - from: storefront
          to: devices
          label: Sells
        - from: retail
          to: devices
          label: Extends reach
        - from: devices
          to: pricing
          label: Segmented by tier
        - from: pricing
          to: revenue
          label: Converts activity into sales
        - from: revenue
          to: costs
          label: Funds fulfillment and production
        - from: costs
          to: gross-profit
          label: Leaves margin if positive
    approximationNotes: "This is a logical operating bridge, not a numeric waterfall; retained sources do not disclose realized conversion rates or product-level margins."
    claimRefs: [CI001, CI002, CI003, CI005, CI008, CI014, CI016]
callouts:
  - calloutType: insight
    title: Public evidence supports the model, not the monetization quality
    body: >-
      The reviewed pool consistently describes Nothing as a hardware seller with
      a visible pricing ladder and expanding retail footprint, but none of the
      retained sources translate list pricing into realized ASP, net revenue, or
      gross margin by SKU.
    claimRefs: [CI001, CI002, CI003, CI005, CI008]
  - calloutType: risk
    title: The late-accounts issue is financially material
    body: >-
      City AM's report that Nothing missed the filing deadline for 2024 accounts
      matters because it leaves the latest public filed statements stuck at
      2023, which blocks verification of burn, working capital, debt, and
      covenant headroom after the 2025 Series C.
    claimRefs: [CI015, CI016]
  - calloutType: recommendation
    title: Treat the company as growth-stage hardware, not as disclosed SaaS
    body: >-
      The right diligence frame is a hardware underwriting case centered on ASP,
      gross margin, returns, inventory, and channel terms. The current public
      record does not support software-style efficiency metrics or a clean runway
      analysis.
    claimRefs: [CI002, CI014, CI016]
