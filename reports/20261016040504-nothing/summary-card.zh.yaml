  topStrengths:
    - Nothing 凭借差异化的工业设计和品牌认知，在同质化严重的 Android 手机市场中脱颖而出。
    - 公开证据显示公司已经获得实质性 traction：2024 年收入超过 $500M，累计销售额超过 $1B，累计出货设备超过 700 万台。
    - 公司从知名投资者处持续筹得大量后续资本，同时保留了轻资产的代工生产模式。
  topRisks:
    - 公开财务披露仍然稀薄：没有经审计的 2024 年账目，也没有利润率披露，对现金消耗、营运资金和退货率的可见度有限。
    - 随着 Nothing 从手机和耳机拓展到原生 AI 设备、智能眼镜以及更广泛的多设备布局，执行风险正在上升。
    - 业务仍容易受到高端 Android 竞争、供应商依赖，以及软件 / 安全或产品营销失误引发的声誉打击。
  unresolvedGaps:
    - 经审计的 FY2024 和 FY2025 财务报表，包括毛利率、经营现金消耗和债务契约细节
    - 按产品家族划分、经过验证的客户与地域结构，包括复购行为和退货率
    - 与 2025 年 9 月 Series C 及后续社区融资相关的详细股权结构表、清算优先权和治理权利
