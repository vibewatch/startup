artifact: customers
slug: nothing
runDate: '2026-10-16'
company:
  name: Nothing
chapter:
  number: 6
  title: Customers
  summary: 'Nothing presents as a consumer-hardware business rather than an enterprise seller: public evidence shows direct checkout terms, launch-day purchase bursts, expanding offline retail in India, and a large enthusiast/community base. What remains missing is the durability layer investors would want most—repeat-purchase, churn, return-rate, and customer-concentration disclosure—so adoption looks real but still only partially transparent.'
sections:
  - id: customer-segments-and-channels
    title: Customer segments and channel design
    body: The assigned source pool points to Nothing selling primarily to end consumers, not named enterprise accounts. Sacra describes the company as a "B2C hardware business model" with price tiers spanning premium Nothing phones, mid-range devices, and budget CMF products, while the official storefront foregrounds consumer checkout mechanics such as free delivery, returns, flexible payments, price match, and warranty coverage. Public distribution evidence also spans direct web checkout, same-day pickup for the current flagship in some markets, and a growing offline footprint in India, suggesting customer acquisition now mixes brand-led D2C demand with mainstream retail expansion rather than relying on a single online flash-sale channel.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU008
      - CU010
      - CU011
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-signals-and-proof
    title: Adoption signals show real demand, but mostly top-line demand
    body: Nothing has enough public demand evidence to clear the “is anyone buying this?” test. Independent sources in the pool say the company has sold more than 7 million devices, the Phone (2) crossed 600,000 units in its first year, and the Phone (2a) passed 100,000 units on launch day. The same pool also shows community investors across 80 countries and flagship-store expansion into Bengaluru, New York, and Tokyo. Together these signals support real commercial traction across geographies and price bands, but they are still mostly shipment, launch, or community indicators; they do not yet reveal cohort retention, repeat purchase, or returns by product family.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU009
    tableRefs:
      - TU002
      - TU003
  - id: durability-expansion-and-concentration-risks
    title: Durability and concentration remain the main blind spots
    body: 'The biggest gap in Nothing’s customer story is not acquisition but durability. None of the assigned sources disclose NRR, GRR, churn, repeat-purchase rates, product return rates, warranty claims, or revenue concentration by channel, geography, or major retail partner. That leaves investors inferring expansion potential from proxies such as India’s retail-footprint expansion and the CMF price ladder rather than from cohort data. The adverse evidence in the pool is also governance-oriented rather than customer-specific: City AM reported a strike-off warning tied to late accounts, which management said was a paperwork delay. That does not prove customer weakness, but it does underline how much of the customer-quality evidence remains private.'
    claimRefs:
      - CU008
      - CU010
      - CU012
      - CU013
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public scale signal
      - Revenue / strategic value and gap
    rows:
      - - Premium Nothing phone buyers
        - End buyer, user, and payer are individual consumers
        - Flagship smartphone plus ecosystem entry
        - Phone (3) priced at $799 internationally with same-day pickup shown on the official page
        - Supports higher ASP and brand halo, but no public split by geography, partner, or repeat purchase
      - - Mid-range smartphone buyers
        - End buyer, user, and payer are individual consumers
        - Design-led mainstream phone purchase
        - Phone (2) passed 600,000 units in its first year and Phone (2a) passed 100,000 units on day one
        - Strong acquisition proof, but no public retention, return-rate, or active-user denominator
      - - Budget / value shoppers via CMF
        - End buyer, user, and payer are individual consumers
        - Lower-price phones, audio, and accessories
        - CMF phone positioned near $199 and budget CMF products start at $49
        - Broadens reach without obvious evidence on margin mix or cannibalization
      - - Community investors / brand fans
        - Consumers who also act as advocates and small equity holders
        - Community-backed launches, feedback loops, and referral energy
        - 13,000 community investors across 80 countries
        - Signals unusually engaged demand, but community ownership is not the same as recurring revenue or retention
      - - India mass-market retail shoppers
        - Consumers reached through offline stores in a price-sensitive market
        - Offline discovery and purchase beyond online-native channels
        - Retail footprint expanded from 2,000 to 7,000 stores; India now exceeds 20% of shipments
        - Important scale channel, but no disclosure on top partners, sell-through, or returns by store cohort
    notes: Combines company-issued channel terms with third-party adoption commentary; public sources identify consumer cohorts and channels but not customer-level revenue mix or retention.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU008
      - CU010
      - CU011
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Lifetime devices sold
        - More than 7 million devices
        - 2026 context
        - m1k.tech; Wikipedia
        - Medium
        - Shows installed-base scale across multiple product cycles
        - No split by active users, product family, or geography
      - - Community investors
        - 13,000 across 80 countries
        - 2026 context
        - m1k.tech
        - Medium
        - Brand converts some enthusiasts into capital and advocacy
        - Not a direct measure of product retention or customer count
      - - Phone (2) sell-through
        - 600,000 units sold globally within first year
        - First year after 2023 launch
        - JuaTech Africa
        - Medium
        - Evidence of global flagship demand for a new entrant
        - No visibility into repeat purchase, returns, or attach rates
      - - Phone (2a) launch-day demand
        - 100,000 units on launch day
        - '2024'
        - TechResearchOnline; Wikipedia
        - Medium
        - Confirms fast uptake for the affordability tier
        - Launch spikes do not prove durable usage or renewal
      - - India retail footprint
        - 2,000 to 7,000 stores; over 20% of shipments
        - 2025/2026 context
        - Sacra
        - Medium
        - Offline reach is becoming a meaningful acquisition lever
        - Store count does not identify top partners, sell-through, or concentration
    notes: Trajectory metrics are heterogeneous launch, installed-base, and channel-expansion signals; public evidence rarely provides the denominator needed to compare cohorts on a like-for-like basis.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof object
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Phone (1) pre-order waitlist
        - Early-adopter smartphone buyers
        - Invite-only pre-order funnel for the first handset
        - Pre-launch demand signal, not production usage
        - 100,000+ registrations in two days
        - Waitlist / preorder interest is weaker than shipped and retained users
      - - Phone (2) buyers
        - Mid-to-premium smartphone buyers
        - Global first-year commercial rollout
        - Production
        - 600,000 units sold globally within the first year
        - Units sold do not show ongoing engagement or repurchase
      - - Phone (2a) buyers
        - Value-conscious smartphone buyers
        - Affordable-phone launch aimed at broader reach
        - Production
        - 100,000 units sold on launch day
        - Day-one velocity does not show channel quality or churn
      - - India offline shoppers
        - Mainstream price-sensitive consumers
        - Purchase via expanded retail footprint
        - Production channel expansion
        - Retail footprint expanded from 2,000 to 7,000 stores and India exceeds 20% of shipments
        - No public disclosure of leading retail partners, store productivity, or concentration
    notes: Because the pool is consumer-hardware oriented, public proof objects are launches, waitlists, and channels rather than named enterprise logos or long-form case studies.
    enumerationScope:
      coverage: partial
      basis: 'Covers only public proof objects disclosed in the assigned source pool: launch metrics, waitlists, community disclosures, and retail-expansion references rather than a complete customer roster.'
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU014
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Nothing’s public customer journey starts with community-led awareness, converts through direct and launch-led purchase, and expands through retail reach and a broader device ladder.
    data:
      items:
        - label: Community discovery
          value: Enthusiast attention
          touchpoints:
            - 13,000 community investors across 80 countries
            - Community updates and offers on nothing.tech
        - label: Direct consideration
          value: D2C checkout
          touchpoints:
            - Free delivery
            - 30-day returns
            - Flexible payments
            - Warranty included
        - label: Launch conversion
          value: Burst demand
          touchpoints:
            - 100,000+ Phone (1) waitlist registrations
            - 100,000 Phone (2a) units on launch day
        - label: Productive ownership
          value: Consumer use
          touchpoints:
            - Phones, audio, and CMF devices serve premium, mid-range, and budget price tiers
        - label: Retail expansion
          value: Offline reach
          touchpoints:
            - Phone (3) page offers pickup as soon as today
            - India retail footprint expanded from 2,000 to 7,000 stores
        - label: Expansion loop
          value: Cross-sell and upgrade
          touchpoints:
            - Premium Nothing line plus CMF ladder broaden the addressable buyer base
            - No public cohort retention or attach-rate disclosure
    approximationNotes: Stages synthesize the channel and adoption evidence in the assigned pool; they show sequence and proof surfaces, not measured conversion rates.
    claimRefs:
      - CU002
      - CU005
      - CU008
      - CU010
      - CU011
callouts:
  - calloutType: strength
    title: Public evidence clears the adoption-exists threshold
    body: 'Nothing has enough third-party evidence to show real customer demand: more than 7 million devices sold, a 600,000-unit first year for Phone (2), a 100,000-unit first day for Phone (2a), and expanding offline retail in India.'
    claimRefs:
      - CU004
      - CU006
      - CU007
      - CU008
  - calloutType: risk
    title: Durability is still mostly private
    body: The pool does not provide public cohort metrics such as repeat purchase, churn, return rates, channel concentration, or top-customer exposure, so the customer chapter rests on acquisition and channel proxies rather than retention economics.
    claimRefs:
      - CU008
      - CU010
      - CU015
