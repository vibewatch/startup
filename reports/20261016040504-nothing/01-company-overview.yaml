company:
  name: Nothing
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Nothing remains a design-led London consumer-electronics challenger built around Carl Pei's founder brand,
    smartphones, audio devices, and an expanding software/AI narrative. The assigned pool supports a September
    2025 $200 million Series C at a $1.3 billion valuation plus scale proxies such as 60+ countries, 30+ product
    releases, and more than 7 million devices sold, but it still leaves core diligence gaps around audited recent
    accounts, current headcount, customer counts, and post-Series C governance terms.
sections:
  - id: identity-footprint
    title: Identity and current footprint
    body: >-
      The current refresh evidence still frames Nothing as a London-based, design-led consumer-electronics company
      built around smartphones, audio devices, and newer AI-oriented software messaging rather than a single-product
      hardware launch story. Official pages say the company now spans 30+ product releases, serves 60+ countries,
      and speaks to a global community of more than six million people, which is useful as a reach proxy even though
      it is not the same as verified active customers. Independent profiles also keep the basic identity stable:
      founded by Carl Pei in 2020, headquartered in London, and positioned as a challenger brand trying to make
      consumer tech feel distinctive again rather than commodity hardware. Public scale is therefore directionally
      visible, but several cover metrics still remain unsupported by the assigned pool. 
    claimRefs: [CO001, CO002, CO003, CO004, CO013]
    tableRefs: [TO001]
  - id: leadership-governance
    title: Leadership, governance, and concentration
    body: >-
      Public leadership evidence remains founder-centric. Carl Pei is still the named founder and chief executive
      around whom Nothing's brand, product narrative, and fundraising story are organized, which creates strong
      founder-market fit in smartphones and hardware branding but also a clear key-person dependency. The assigned
      pool is much thinner on the broader executive bench and formal governance than it is on product and financing
      messaging. The one concrete governance update in the pool is City AM's report that director Timothy Bruce
      Warren Holbrow resigned in October 2025 after joining in April 2023. That gives a tangible board-change data
      point, but not enough visibility into board composition, reserved matters, or investor control rights.
    claimRefs: [CO003, CO014, CO015]
    tableRefs: [TO002]
  - id: funding-stakeholders
    title: Funding history and stakeholder map
    body: >-
      The strongest supported financial facts in the assigned pool are the September 2025 financing mark and the
      investor mix around it. Sacra says Nothing raised $200 million in a Series C led by Tiger Global at a $1.3
      billion valuation and had raised more than $450 million in total since founding, with existing investors GV,
      Highland Europe, and EQT Ventures participating alongside new investor Qualcomm Ventures and Nikhil Kamath.
      Dealroom also points to community financing as more than a marketing layer, citing more than $16 million from
      roughly 13,000 investors, while the current Nothing site confirms that Community Investment (3) has already
      closed. What remains opaque is the cap table beneath those labels: ownership percentages, liquidation
      preferences, board rights, and whether community instruments have any governance consequences.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO003]
  - id: milestones-watchpoints
    title: Milestones and refresh watchpoints
    body: >-
      Nothing's milestone arc is now clear enough to anchor later chapters: 2020 formation, Ear (1) in 2021, Phone
      (1) in 2022, CMF expansion in 2023, and a 2025 financing step-up that put the company back into late-stage
      venture territory. The same pool also gives two important caution flags. First, the company's public scale
      story is still assembled mostly from profile databases and company surfaces rather than recent audited
      statements. Second, City AM reported a March 2026 First Gazette notice tied to overdue 2024 accounts, which
      is not a thesis-breaker on its own but does raise execution and reporting-discipline questions that should be
      carried into financial, risk, and valuation work. 
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
