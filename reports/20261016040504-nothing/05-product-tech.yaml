  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Public or shared diligence materials showing security audits, privacy architecture, certifications, and incident-response controls for Nothing OS, Essential Space, and companion apps.
      whyItMatters: Product ambition is shifting toward AI-style capture and ecosystem workflows, which increases the underwriting importance of trust controls beyond launch marketing.
      diligencePath: Request security and privacy documentation, external audit results, certification scope, and internal control owners for Nothing OS and companion-cloud workflows.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: support-reliability
      missingEvidence: Verified metrics on returns, warranty claims, software defect rates, uptime/service reliability, and customer-support responsiveness by product family and geography.
      whyItMatters: Hardware breadth only compounds value if launch quality and after-sales support keep pace; otherwise portfolio expansion can amplify operational drag.
      diligencePath: Obtain cohort-level support dashboards, RMA data, post-launch bug/patch timelines, and country-level service-network coverage.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: Measurable public adoption data for the Glyph SDK, community tools, or other third-party extension surfaces such as repository activity, package use, or active developer counts.
      whyItMatters: Without adoption data, the community/developer layer is a narrative enhancer but not yet strong evidence of a platform moat.
      diligencePath: Ask for SDK usage metrics, active developers, showcase apps, and any public repositories or package-download history that demonstrate real extension activity.
      relatedQuestionRefs: [QE008]
