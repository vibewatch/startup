      - ["CMF device buyer", "Price-sensitive buyer or younger first-time smartphone/accessory purchaser", "Consumer end user", "Self-pay or family payer", "Affordable entry into the Nothing ecosystem", "Household value-electronics budget", "Accepts simpler hardware to access the brand at a lower price tier"]
