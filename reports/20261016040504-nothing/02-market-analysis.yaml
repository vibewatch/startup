      - ["Wearables adjacency lens", "Sacra", "2025/2027 roadmap context", "Global", "Meta Ray-Ban smart glasses >1m units sold; Nothing AI glasses slated for 2027", null, "Adjacent-category incumbent benchmark", "low", "Competitor category evidence, not proof of Nothing demand"]
    notes: "Publicly accessible sources support pricing, traction, and channel proxies, but they do not supply a transparent third-party TAM/SAM/SOM build with disclosed assumptions; null CAGR values mark unsupported fields rather than missing transcription."
