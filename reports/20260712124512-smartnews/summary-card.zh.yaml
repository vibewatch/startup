  topStrengths:
    - 消费者触达大，下载量超过 50M，在日本品牌认知强
    - 出版方网络深度清晰，在日本本地市场有差异化站位
    - 广告、自助投放扩张、订阅和新 AI 界面带来真实变现选择权
