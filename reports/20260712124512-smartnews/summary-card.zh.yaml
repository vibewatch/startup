    - 广告仍是核心变现引擎，SmartNews 暴露在广告周期波动中
    - 2024 年 venture debt 和偏薄披露，削弱了对资本充足性和当前股权价值的信心
    - 美国增长和使用黏性仍不如日本叙事扎实
    - 法律、平台和出版方权利风险，可能直接影响内容供给和估值
  unresolvedGaps:
    - 经审计的 FY2024-FY2025 财务报表和当前现金流披露尚未公开
