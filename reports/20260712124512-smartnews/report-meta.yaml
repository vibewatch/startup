  foundingLocation: Tokyo, Japan
  headquarters: Tokyo, Japan / San Francisco, CA, USA
  productSummary: >-
    Mobile news aggregation and discovery app with algorithmic curation, premium publisher
    feeds, SmartFormat distribution tooling, SmartNews+ subscription, Rewards, and newer
    AI-assisted surfaces including AI Matome and NewsArc.
  customerFocus: >-
    Consumer mobile news readers in Japan and the United States, publisher partners seeking
    traffic and distribution, and advertisers buying premium mobile news inventory.
  businessModel: >-
    Primarily advertising-led monetization with expanding self-serve ad tools, a smaller
    subscription layer through SmartNews+, and emerging engagement or AI-linked product
    surfaces that may broaden monetization over time.
  stage: Late-stage private / Series F unicorn
  fundingStatus: >-
    Public funding anchors include the 2019 Series E at about $1.2B, the 2021 Series F at
    $2.0B, and a January 2024 venture-debt financing recorded by Tracxn at $69.3M.
  disclosureProfile: private-undisclosed
  claimRefs: [CO006, CO007, CO008, CO025, CO026, CO030, CV004, CV011]
