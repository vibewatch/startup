companyProfile:
  summary: >-
    SmartNews is a Tokyo and San Francisco-based consumer media company built around a
    mobile news-aggregation app. Public sources support a business model centered on
    advertising, with newer layers in subscriptions, rewards, AI-assisted product surfaces,
    and publisher-distribution tooling. The company remains strongest in Japan, where it has
    brand recognition and a large publisher network, while U.S. growth remains a strategic but
    less proven upside case.
  foundedDate: '2012-06-15'
