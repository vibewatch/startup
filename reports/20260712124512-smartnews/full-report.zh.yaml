        title: 竞争对 SmartNews 意味着什么
        blocks:
          - type: paragraph
            body: >-
              竞争图景是混合的，而不是致命的。公开信号仍支持把 SmartNews 视为严肃竞争者：它营销 50 million 以上下载量，向广告主声称日本领先，并在 2025 年获得 Pixalate
              的强广告质量排名。但负面证据同样重要。TechCrunch 报道，SmartNews 的下载量和活跃用户在 2023 年恶化，公司也不再发布那种能让外部人士把它与每个同业精确排序的当前 MAU
              数据。因此，一个结论很难回避：SmartNews
              在日本可能比在美国更可防守，但即便在日本，它对抗的也是生态，而不只是应用。公司需要继续在信任、平衡和广告主质量上取胜——这些领域仍能讲出独特故事——同时接受一个现实：在纯功能广度上，很难持续匹配
              Apple、Google、Microsoft 或 Yahoo/LINE 式捆绑。同样重要的是，管理层需要证明 Rewards、AI
              组织和本地界面等产品增量能改善留存，而不是只增加大对手可以复制或用分发压过的对等功能。
