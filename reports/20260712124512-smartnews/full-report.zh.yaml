      - number: '2.2'
        title: 日本市场动态：规模大、数字化程度高，但结构复杂
        blocks:
          - type: paragraph
            body: >-
              日本仍是有吸引力的本土市场，因为数字受众规模大，广告基盘仍在增长，尽管出版方经济承压。DataReportal 显示，日本进入 2026 年时有 107 million 互联网用户、99 million
              社交身份和 99 million LINE 用户。Dentsu 显示，互联网广告现在已超过日本广告总支出的一半，视频和社交格式增长尤其快。但 Reuters Institute
              把结构性约束讲得很清楚：报纸和电视在文化上仍然重要，Yahoo 和 LINE 保持强大的线上触达力，大多数地方和全国性报纸来自数字销售的收入仍低于 5%。换句话说，SmartNews
              所在市场已经有真实的消费者数字化，但出版方转型并不完整。这种组合利好聚合平台，因为它保留了分发需求；但它也会在版权、变现和平台依赖上制造摩擦。因此，日本给了 SmartNews
              最深的分发机会，却不是一个毫无摩擦的供给环境。
