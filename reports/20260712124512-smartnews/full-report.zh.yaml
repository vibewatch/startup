        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              从财务上看，SmartNews 更像广告驱动的消费媒体平台，加上一个次级订阅试验，而不是订阅优先的出版方。官方材料一贯强调 SmartNews Ads、广告主案例、美国广告库存，以及面向 SMB
              的新自助工具。SmartNews+ 具备战略意义，因为它证明一部分用户愿意为策展后的优质内容付费；但即便累计订阅用户达到 100,000
              这一里程碑，相对核心广告业务内含的规模信号仍然很小。定价披露也不对称。公司愿意公布 SmartNews+
              标价，并描述自助功能、受众定位和活动支持功能，却不披露实际广告定价、贡献利润率或广告主留存。这意味着，公开记录支持模型方向——广告第一、订阅第二——但实际变现效率大体仍未验证。实际含义是，收入结构比名义收入更重要：如果业务更多偏向重复投放的优质广告主和自助留存，就会强于仍依赖高接触销售或促销支出的模式。
