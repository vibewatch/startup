      - number: '2.4'
        title: 市场对 SmartNews 意味着什么
        blocks:
          - type: paragraph
            body: >-
              合并两个地区看，SmartNews
              最强的位置在信任、实用性和移动习惯交汇处，而不是纯规模最大的地方。日本提供了有利组合：数字触达广、受众老龄但高度在线、互联网广告预算快速增长、传统媒体部门仍需要分发帮助。美国给出更大的名义机会，却因信任更低、替代品更多而更快惩罚执行不足。SmartNews
              的产品选择——平衡报道叙事、本地新闻界面、奖励、AI 辅助组织——很好贴合这种市场逻辑。公司在日本转向面向 SMB 的自助广告也一样合理，因为社交媒体之外的触达仍可被营销为差异化。未解问题是份额。没有当前官方
              MAU 披露，公开证据可以框定市场、解释 SmartNews 为什么重要，却无法干净证明公司在任一核心地区仍控制多少可服务机会。
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM040
              - CM039
              - CM016
      - number: '2.5'
        title: 证据要点
        blocks:
          - type: callout
            title: 日本仍是更可承销的市场
            body: 日本给了 SmartNews 最好的组合：官方广告数据、强移动触达，以及仍能从聚合中受益的出版方部门。
            calloutType: insight
