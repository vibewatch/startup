      - number: '6.3'
        title: 耐久性、重复使用与扩张
        blocks:
          - type: paragraph
            body: >-
              耐久性证据比触达证据更薄，但仍有一些信号。SmartNews Rewards 重要，并不是因为它是巨大收入来源，而是因为它通过任务、积分历史和兑换工作流，让重复使用变得运营上可见。SmartNews+
              提供第二个耐久性信号，证明至少部分用户愿意为周期性新闻捆绑付费。在广告主侧，SMB 支出增长和自助动作说明 SmartNews
              正试图扩大付费基础，而不只依赖少数大客户。不过，最重要的耐久性指标——读者留存、订阅用户流失、广告主续投、出版方集中度和合同期限——仍未披露。这意味着 SmartNews
              有可见的互动循环和扩张试验，但缺少证明长期客户经济性的量化留存包。它也意味着，客户故事很大一部分仍依赖管理层数据，而不是公开运营证据，尤其是在同期群、续约时点和按收入加权的客户健康度上。
