      - number: '3.3'
        title: 商业模式和产品差异
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争差异不只是品牌名，而是商业模式。SmartNews 和 Gunosy 主要是广告资助的聚合器，依赖外部出版方供给。Apple
              在聚合之上叠加付费订阅捆绑，因此对优质内容的付费意愿故事更清楚。Google News 免费且分发丰富，由更大的生态支撑，直接新闻变现没那么紧迫。NHK
              以公共服务为导向，自身拥有更多报道投入，信任动态和内容经济都随之改变。Microsoft Start 把新闻捆进重实用的信息流，Flipboard
              则强调社区和新闻通讯。这些差异重要，因为它们塑造各对手优化的目标。当广告主和读者重视平衡、可信出版方环境时，SmartNews
              仍最强；当竞品能以几乎零增量分发成本加入杂志、天气、财经或更宽的默认入口时，SmartNews 就更弱。
