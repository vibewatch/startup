            title: 美国市场更大，也更不宽容
            body: 信任度低、本地既有玩家仍强、替代品横跨 Apple、Google、社交视频和消息应用时，高互联网渗透率不会自动转化为 SmartNews 的可持续份额。
            calloutType: risk
            claimRefs:
