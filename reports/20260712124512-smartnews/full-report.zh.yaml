      - number: '1.3'
        title: 融资历史、规模信号与披露质量
        blocks:
          - type: paragraph
            body: >-
              最干净的估值锚点仍是 2019 年和 2021 年两轮融资。2019 年，TechCrunch 报道 SmartNews 以 $1.1B 估值获得一笔 $28 million
              融资，公司首次跨过独角兽门槛；当年晚些时候，公司又正式完成 $92 million、估值 $1.2B 的 Series E 轮。最后一轮被广泛印证的定价融资仍是 2021 年 9 月的 Series F
              轮，SmartNews 宣布募资 $230 million、估值 $2 billion，并称累计融资超过 $400 million。公开规模信号方向上很强，但噪声也大。公司当前营销材料称下载量超过 50
              million、每日文章超过 400,000 篇、媒体合作伙伴超过 3,000 家，App Store 也显示庞大的评分基础。但部分公司界面又称可信合作伙伴超过 1,500 家，近期公开材料仍没有给出干净的当前
              MAU、收入或官方员工数包。因此，SmartNews 的身份有充分证据支撑，但当前运营规模只得到部分证明。
