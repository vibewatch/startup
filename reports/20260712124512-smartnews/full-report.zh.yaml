      - number: '7.3'
        title: 运营、依赖与执行风险
        blocks:
          - type: paragraph
            body: >-
              SmartNews 的运营风险主要是软件、合作伙伴和商业化落地风险，而不是实体资产风险。公司依赖出版方供稿、应用商店平台、内容权利、代理商关系，以及越来越多的 AI
              工具。公开证据还留下重大盲点：没有公开状态页，没有详细事故历史，也没有深入披露 AI 质量控制。Rewards 又增加了一层运营复杂性，因为产品现在包含积分、任务和第三方奖励履约。人力风险也真实存在。2023
              年裁员和当前较小的员工基础意味着，公司必须用更少犯错空间执行一套很宽的议程——核心稳定、自助变现和 AI
              产品扩张。美国仍是最尖锐的执行测试，因为它同时具备更低信任、更强捆绑对手，以及更弱的当前客户深度公开证明。平台依赖也延伸到功能访问，而不只是应用分发、变现和支持工作流。
