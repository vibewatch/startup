    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、公司足迹与使命
        blocks:
          - type: paragraph
            body: >-
              SmartNews 是一家创立于东京的信息与新闻发现公司，官方公司页面仍把业务锚定在智能手机应用和互联网服务，而不是狭窄的出版细分市场。公司当前足迹实际横跨两岸：东京仍是总部，但官方办公室列表仍包括 Palo
              Alto 和 New York，说明美国曾被当作战略市场，而不是小规模出口试验。SmartNews 各个界面对使命的表述也异常稳定。公司持续把产品定位为传递优质信息的基础设施，而不是泛化的互动软件；CEO
              致辞还明确主张，个性化应该拓宽视角，而不是收窄视角。这一点很重要，因为后文会显示，公司仍依赖注意力和广告，却试图保住不同于纯社交流的公共利益和信任叙事。
