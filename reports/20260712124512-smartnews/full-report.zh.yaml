      - number: '8.2'
        title: 可比公司筛选及其意义
        blocks:
          - type: paragraph
            body: >-
              没有任何上市公司是 SmartNews 的完美可比对象，因此有用的方法是三角测算，而不是一对一匹配。New York Times 相关，因为它是具备订阅深度和强品牌力的规模化数字新闻业务。Nextdoor
              相关，因为它是一个注意力市场，价值依赖习惯、本地相关性和广告变现。Mercari 重要，因为它是日本移动消费互联网公司，拥有公开市场定价和本地投资者语境。Reddit
              重要，因为它是少数仍因增长和网络效应更清晰而获得显著更高收入倍数的注意力平台之一。按当前筛选，若 SmartNews 仍使用旧的 $2 billion 标记，它看起来比 New York
              Times、Nextdoor 和 Mercari 更贵，甚至略高于 Reddit。这是一道很高的门槛，因为 SmartNews 的公开增长、利润率和披露证据都比这些上市同业薄得多。
