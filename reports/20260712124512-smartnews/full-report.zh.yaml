      - number: '2.3'
        title: 美国市场动态与采纳约束
        blocks:
          - type: paragraph
            body: >-
              美国机会纸面上有吸引力，落地却难得多。Reuters Institute 显示，美国人口约 347 million，互联网渗透率很高，并报告线上和社交新闻消费继续小幅上升，而电视下滑。但同一报告显示，2026
              年新闻信任度再次下降，创下新的调查低点，本地电视和地区报纸仍是最受信任的品牌。这很重要，因为 SmartNews 进入的不是空白市场；它要对抗 Apple News、Google
              News、Flipboard、Microsoft Start、TikTok 关联的注意力习惯，以及在许多社区仍拥有信任的本地既有玩家。SmartNews 自己的美国广告定位强调高度互动的 35
              岁以上成年人和品牌安全的新闻库存，这很合理，但也比大众化新闻生态系统的切口更窄。结果形成一个悖论：美国广告池比日本更大，但 SmartNews
              对当前可持续份额的证据更弱，使美国在战略上更重要，在分析上却没那么可靠。
            claimRefs:
