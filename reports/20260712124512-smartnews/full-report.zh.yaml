      - number: '3.2'
        title: 美国竞争对手：平台支持的替代品更强
        blocks:
          - type: paragraph
            body: >-
              美国对手集合更宽，结构也更硬。Apple News 结合了人工编辑、个性化发现、音频、体育，以及包含 500 多个优质标题的付费捆绑。Google News
              仍是免费的个性化聚合器，具备完整报道聚类和强本地定制。Flipboard 通过社区和新闻通讯吸引主题爱好者，其 Samsung Briefing
              入口说明，即便这个看似小众的对手也获得过设备级分发帮助。Microsoft Start 是更宽的实用信息流，把可信出版方新闻与天气、财经和短视频混在一起。这些替代品都能吸收本可能属于 SmartNews
              的用户时段，其中几个还受益于平台分发优势或相邻产品生态。SmartNews 仍可通过非社交、平衡新闻的主张形成可信差异化，但这套主张身处的市场里，主导同业通常不只是新闻产品本身更大。
