      - number: '6.2'
        title: 采纳与公开证明
        blocks:
          - type: paragraph
            body: >-
              公开客户证明在消费者侧最强。SmartNews 仍营销超过 50 million 下载量，美国 App Store 列表显示很大的评分基础和强平均分。历史第三方报道也显示，SmartNews 在 2023
              年重置前达到过可观规模，TechCrunch 曾引用峰值约 30 million MAU。与此同时，公开记录并非一致正面。TechCrunch 后来报道，2023 年下载量和活跃用户明显下滑，包括低得多的全球
              MAU 估算。因此，最好把证据解读为混合但真实：SmartNews 显然拥有或曾经拥有有意义的安装基础，但公司披露并未完全验证当前活跃使用量。在 B2B 侧，最清晰的公开证明来自
              Kashiwaya、CCI、ELLE Japan 等具名案例，以及美国广告界面展示的出版方名称。
