      - number: '1.2'
        title: 创始人、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              SmartNews 仍明显由创始人主导，但 2023 年领导层重置后，创始人控制的形式发生了变化。Kaisei Hamamoto 现在担任 CEO，Ken Suzuki
              转任执行董事长，在保留创始人连续性的同时，也承认公司在美国扩张失足后需要新的运营节奏。同一公告还任命 Cory Ondrejka 为 CTO，这是一个重要信号，因为 SmartNews
              的产品故事依赖机器学习、AI 和移动产品迭代，而不只是内容所有权。2025 年，SmartNews 引入具备 SaaS、AI
              和高管教练背景的知名外部董事，治理变得更容易被外部看见。即便如此，公开图景仍不完整：投资者能看到具名董事会，却看不到详细委员会结构、更宽的高管梯队或完整继任地图。这让关键人依赖仍显著高于招股书级披露应有的水平。
