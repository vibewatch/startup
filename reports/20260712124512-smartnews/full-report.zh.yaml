  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 日本竞争对手：生态力量主导
        blocks:
          - type: paragraph
            body: >-
              在日本，SmartNews 并不处在一个干净的独立品类。Reuters Institute 显示，Yahoo 仍有很强的每周线上新闻触达；LINE News 则嵌在全国主导性的消息习惯里，每天推送多轮摘要。NHK
              从完全不同的角度竞争：它的应用和网页资产依托信任、原创报道和灾害实用性，而不只靠个性化。Gunosy 仍是最接近的本地纯聚合类比，因为它仍是一个由广告资助、建立在外部内容合作伙伴之上的策展业务；Antenna
              则争夺更轻量的生活方式和文章浏览时段。共同点是，日本最强的竞争对手要么嵌在更大的生态里，要么靠实用性和信任做差异化。这让 SmartNews 的平衡报道框架有用，但也意味着公司很少面对只是新闻应用的对手。
