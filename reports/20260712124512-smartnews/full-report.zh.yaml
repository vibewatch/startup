  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              SmartNews 应该放在多边市场里分析，而不是塞进单一、笼统的「新闻应用」桶。核心界面是移动端消费新闻发现，但实际业务横跨出版方供给、广告主需求，以及通过 SmartNews+
              形成的较小优质订阅层。这意味着，最宽的自上而下市场视角不是出版方收入池，而是围绕文章信息流、本地提醒和可信信息界面的数字广告与注意力经济。Dentsu 的 2025 年数据是日本最有用的官方锚点：广告总额达到
              ¥8.1 trillion，互联网广告刚超过 ¥4.0 trillion，单互联网媒体支出就达到 ¥3.3 trillion。这些数字都不是干净的 SmartNews TAM，但合在一起定义了外边界。更保守的
              SAM 应只框定为互联网媒体池的低个位数百分比，因为只有一部分库存对应 SmartNews 实际销售的文章信息流，并具备信任、语境和策展特征。
