  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 已观察估值锚点及其含义
        blocks:
          - type: paragraph
            body: >-
              SmartNews 仍容易描述，却更难定价。最干净的公开估值锚点仍是 2021 年 9 月 Series F 轮，公司披露募资 $230 million、估值 $2
              billion。那在当时是可信的后期私营估值标记，但如今已经落后当前业务好几个运营章节。后来的公开报道显示用户动能转弱，Tracxn 记录的 2024 年 1
              月风险债务融资也把承销语气从纯增长可选性转向资产负债表问题。最佳公开收入分母仍是 GetLatka 对 2025 年约 $104.5 million 的估算。按这个数字，旧的 $2 billion 标记意味着约
              19.1x 收入；对于一家仍依赖广告、仍为私营、且仍缺少招股书级披露的公司来说，这个倍数很高。这并不让旧标记不可能成立，但确实让它显得陈旧，也更难在没有更强当前证据的情况下站住脚。
