  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最高优先级风险
        blocks:
          - type: paragraph
            body: >-
              SmartNews 的风险栈异常交织。最重要的风险不是孤立的合规条目，而是会同时打到产品范围、合作伙伴信心、使用量、收入和融资的连锁问题。最清晰的顶层风险包括：2024
              年债务融资后的融资依赖、核心产品用户再次下滑，以及围绕聚合和 AI 辅助摘要的法律或权利争议。紧随其后的是对 Apple 和 Google 的平台依赖、隐私和 AI
              治理义务，以及美国扩张故事的执行风险。公司确实有缓释措施——出版方合作、安全和隐私政策，以及正式的 AI Transformation
              Division——但多数缓释仍基于治理或路线图，而不是结果证明。这让残余风险保持在有意义的高位；一旦某个关键风险变成管理层可见的运营或法律事件，下行情景会传导得异常快。
