      - number: '6.4'
        title: 集中度风险与仍缺什么
        blocks:
          - type: paragraph
            body: >-
              客户侧主要风险是集中度不透明。SmartNews
              强调出版方广度、代理商项目和订阅用户里程碑，但不披露多少流量依赖头部出版方、多少收入依赖头部广告主或代理商，也不披露美国增长是否集中在狭窄受众切片。客户证据也因地区而异。日本仍像核心安装基础市场，而美国更像由奖励、信任营销和优质受众定位支撑的互动与变现扩张故事。这条路走得通，但也意味着公司必须证明美国同期群
              具备耐久性。因此，正确尽调姿态是把 SmartNews
              视为一个采纳可信、具名证明存在的平台，同时承认集中度和留存问题尚未解决；而这些问题恰好坐在承销通常开始的位置。在这些披露出现前，按今天公开市场的投资者视角，客户质量应被描述为可信但尚未完全证明。
