      - number: '7.2'
        title: 监管、法律与信任风险
        blocks:
          - type: paragraph
            body: >-
              法律和监管侧值得特别关注，因为 SmartNews 正变得更 AI 辅助，同时仍依赖第三方新闻。日本 AI 促进法和 2026 年 AI Basic Plan
              显示，即便还没有出现单一硬禁令，治理预期也在快速移动。隐私方面，PPC 仍是个性化媒体产品的相关监管者，其英文法律和新闻界面也凸显这是一个活跃监督领域。在美国，FTC 继续关注 AI 和平台行为，让
              SmartNews 暴露在变化中的执法预期之下。最直接的法律类比是 AP v. Meltwater；法院在该案中驳回了一个被认为过度替代原新闻的新闻聚合模型的合理使用抗辩。SmartNews 不是
              Meltwater，但这个类比重要，因为 AI 摘要和流量中介产品功能可能以新的技术形式重新打开旧的权利争议。因此，信任风险位于法律、产品设计和合作伙伴经济的交叉点。
