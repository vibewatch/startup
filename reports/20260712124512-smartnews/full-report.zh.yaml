            title: 任何 SAM 估算都必须受证据约束
            body: 没有公开来源能隔离出一个独立、与 SmartNews 规模相当的新闻应用广告市场，因此，谨慎截取互联网媒体池的一部分，比泛泛声称万亿日元 TAM 更站得住脚。
            calloutType: assumption
