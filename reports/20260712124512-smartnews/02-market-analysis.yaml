- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend or activity
  - Excluded spend or activity
  - Buyer / payer
  - Relevance to SmartNews
  rows:
  - - Core consumer news discovery
    - App-based reading, personalization, alerting, local updates
    - Publisher-owned web traffic that bypasses aggregators
    - Reader attention funded mainly by advertisers
    - Directly matches SmartNews core app behavior
  - - Publisher distribution layer
    - Supply-side integrations, SmartView / feed formatting, reach expansion
    - CMS and newsroom systems unrelated to distribution
    - Publishers as suppliers and quasi-customers
    - Determines content breadth and trust supply
  - - Advertising inventory
    - In-feed native, display, brand-safe app inventory, SMB self-serve
    - Search ads unrelated to article consumption
    - Brand, agency, SMB budgets
    - Primary monetization pool
  - - Premium subscription adjacency
    - SmartNews+ access to paid business/economy content
    - Standalone newspaper bundles sold without platform aggregation
    - End users
    - Secondary revenue stream and positioning layer
  - - Attention substitutes
    - Yahoo, LINE, Google News, Apple News, NHK, social/video platforms
    - Non-news leisure apps without meaningful information overlap
    - Reader time and ad budgets
    - Explains share and pricing pressure
  notes: The boundary deliberately separates SmartNews's directly monetized surfaces from broader media attention pools so the chapter does not overstate TAM.
