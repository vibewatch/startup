callouts:
- calloutType: insight
  title: Japan remains the more underwritable market
  body: Japan gives SmartNews the best combination of official advertising data, strong mobile reach, and a publisher sector that still benefits from aggregation.
  claimRefs:
  - CM004
  - CM016
  - CM027
- calloutType: risk
  title: The U.S. market is bigger but less forgiving
  body: High internet penetration does not automatically translate into durable SmartNews share when trust is low, local incumbents remain strong, and substitutes span Apple, Google, social video, and messaging.
  claimRefs:
  - CM021
  - CM023
  - CM025
  - CM038
- calloutType: assumption
  title: Any SAM estimate must stay evidence-constrained
  body: No public source isolates a standalone SmartNews-sized news-app ad market, so using a careful slice of the internet-media pool is more defensible than a generic trillion-yen TAM claim.
  claimRefs:
  - CM005
  - CM037
