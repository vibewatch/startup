company:
  name: SmartNews
chapter:
  number: 2
  title: Market Analysis
  summary: SmartNews operates in a multi-sided market where consumer news discovery, publisher distribution, and digital advertising intersect. Japan remains the best-defined opportunity because Dentsu shows a fast-growing internet ad market and Reuters/DataReportal show deep mobile adoption, while the United States offers a larger but less underwritable market because trust is lower and substitutes are more intense. The market is clearly large enough to matter, but SmartNews's present SOM is not provable from public data because the company does not disclose current MAU or revenue share by geography.
sections:
- id: boundary-and-sizing-lenses
  title: Market boundary and sizing lenses
  body: 'SmartNews should be analyzed inside a multi-sided market rather than a single monolithic \"news app\" bucket. The core surface is consumer news discovery on mobile, but the actual business spans publisher supply, advertiser demand, and a smaller premium-subscription layer through SmartNews+. That means the broadest top-down market lens is not a publisher revenue pool but the digital advertising and attention economy around article feeds, local alerts, and trusted information surfaces. Dentsu''s 2025 data is the most useful official anchor for Japan: total advertising reached ¥8.1 trillion, internet advertising reached just over ¥4.0 trillion, and internet media spend alone reached ¥3.3 trillion. None of those figures is a clean SmartNews TAM, but together they define the outer boundary. A more conservative SAM should be framed as only a low-single-digit slice of the internet-media pool, because only a subset maps to article-feed inventory with the trust, context, and curation characteristics
    that SmartNews actually sells.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM037
  tableRefs:
  - TM001
  - TM002
  figureRefs:
