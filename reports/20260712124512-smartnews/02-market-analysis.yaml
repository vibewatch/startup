- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Mobile internet saturation and older-user migration online
    - Positive
    - Structural
    - Supports habitual news checking on smartphones in Japan and the U.S.
    - How much of SmartNews traffic is still push-driven versus direct habit?
  - - Video and social ad growth in Japan
    - Positive
    - 2025-2026
    - Expands overall digital ad budgets that can spill into news inventory
    - What share of SmartNews revenue is tied to premium brand-safe budgets versus low-priced performance spend?
  - - Publisher digital-revenue weakness
    - Mixed / negative
    - Structural
    - Makes aggregators useful for reach but also creates bargaining friction over monetization and rights
    - What are SmartNews partner economics and renewal patterns?
  - - Messaging and social-video substitutes
    - Negative
    - Structural
    - Compete aggressively for attention and local discovery
    - Where does SmartNews still win on daily time spent and retention?
  - - Low U.S. trust in news
    - Negative
    - Current
    - Raises the cost of winning durable mindshare in America
    - Can SmartNews prove trust and balanced-curation benefits with user retention data?
  - - AI summary and discovery tools
    - Positive with regulatory risk
    - Current
    - Can improve utility and widen the use case if publisher relationships hold
    - What legal and product safeguards govern AI-generated summaries?
  notes: Drivers and constraints are tied to timing and monetization rather than treated as generic market color.
