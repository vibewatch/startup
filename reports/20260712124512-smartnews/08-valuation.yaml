- id: current-stance-and-diligence-needs
  title: Current stance and diligence needs
  body: 'As of the 2026-07-12 run date, the most defensible stance is that SmartNews is a legitimate late-stage asset with meaningful strategic value, but the old $2 billion mark looks stretched relative to public-information evidence. The company still has real positives: a known brand, Japan leadership, 50 million-plus installs, growing monetization experiments, and some governance improvement through added outside directors. The problem is not that upside is absent; it is that disclosure is too thin to let investors pay for that upside confidently. Public listed benchmarks such as LY and Gunosy show how much more transparency markets usually demand, even from businesses with lower growth or smaller scale. Until SmartNews provides audited financials, debt details, cap-table terms, and prospectus-grade KPI disclosure, the safest reading is a valuation range centered below the old peak mark. That supports a research-more recommendation and a stretched valuation stance rather than a clean
    bullish call today for outside investors presently.'
  claimRefs:
  - CV040
  - CV041
  - CV030
  - CV039
  - CV042
