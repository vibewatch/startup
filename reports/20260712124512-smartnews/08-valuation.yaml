company:
  name: SmartNews
chapter:
  number: 8
  title: Valuation
  summary: The last clean public mark for SmartNews is the 2021 $2 billion Series F valuation, but current public information supports more caution than that legacy mark suggests. On the best public revenue estimate, the old valuation implies a premium multiple versus mature media and Japanese consumer-internet peers, while debt, limited disclosure, and stale operating evidence justify a meaningful private-company discount. A plausible upside case still exists, but it depends on renewed growth and IPO-grade disclosure rather than on historical round prices alone.
acknowledgedWarnings:
- dimension: figureType
  reason: The chapter uses timeline, matrix, and DAG figures because they communicate valuation anchors, comparable screens, and dependency logic more clearly than the planned flow, bar, range, or KPI substitutes in this case.
sections:
- id: valuation-anchor-and-what-it-implies
  title: Observed valuation anchors and what they imply
  body: SmartNews is still easy to describe but harder to price. The cleanest public valuation anchor remains the September 2021 Series F round, when the company disclosed a $230 million raise at a $2 billion valuation. That was a credible late-stage private mark at the time, but it now sits several operating chapters behind the current business. Public reporting later showed weaker user momentum, and Tracxn records a January 2024 venture-debt financing that changed the underwriting tone from pure growth optionality toward balance-sheet questions. The best public revenue denominator remains GetLatka's 2025 estimate of roughly $104.5 million. On that number, the old $2 billion mark implies about 19.1x revenue, which is rich for a business still dependent on advertising, still private, and still short of prospectus-grade disclosure. That does not make the old mark impossible, but it does make it stale and much harder to defend without stronger current evidence.
  claimRefs:
  - CV001
  - CV002
  - CV004
  - CV005
  - CV006
  - CV007
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: comparable-screens-and-why-they-matter
  title: Comparable screens and why they matter
  body: No public company is a perfect SmartNews comparable, so the useful exercise is triangulation rather than one-for-one matching. New York Times is relevant because it is a scaled digital-news business with subscription depth and major brand power. Nextdoor is relevant because it is an attention marketplace whose value depends on habit, local relevance, and ad monetization. Mercari matters because it is a Japanese mobile consumer-internet company with public-market pricing and local investor context. Reddit matters because it is one of the few attention platforms still receiving a materially higher revenue multiple due to clearer growth and network effects. On the current screens, SmartNews at the old $2 billion mark looks more expensive than New York Times, Nextdoor, and Mercari, and even somewhat richer than Reddit. That is a high bar because SmartNews has much thinner public growth, margin, and disclosure evidence than any of those listed peers.
  claimRefs:
  - CV018
  - CV021
  - CV024
  - CV027
