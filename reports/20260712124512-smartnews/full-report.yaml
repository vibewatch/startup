              SmartNews appears genuinely differentiated in one narrow sense: it is not merely talking about AI. It has
              shipped AI Matome, launched NewsArc as a separate app, and created an AI Transformation Division with a
              concrete operating brief. At the same time, its differentiation is framed around trusted-publisher
              discovery and balanced information rather than around raw automation. That is important because fully
