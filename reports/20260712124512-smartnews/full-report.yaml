      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              SmartNews appears more operating-expense intensive than capital-expense intensive, but that does not make
              the financing picture easy. The likely cost base is dominated by engineering, editorial curation, cloud
              and AI inference, advertiser sales support, and partner-management operations. That model can scale
              attractively when audience engagement and ad pricing are improving, yet it can compress quickly when user
              momentum weakens or when high-touch sales remain necessary. The public capital record shows a clean
              funding arc through 2021—$92 million Series E, then $230 million Series F at a $2 billion valuation—but
              the January 2024 venture debt round changes the interpretation. Debt suggests management wanted time
              without immediately repricing the equity story. Because no current public source reviewed here provides
              cash, burn, or runway, the debt is better read as a cautionary capital-adequacy signal than as a neutral
              financing footnote. In other words, this is not obviously a distressed asset, but it is also not a
              business whose balance-sheet resilience can be inferred from public signals alone.
