  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              SmartNews looks financially like an advertising-led consumer media platform with a secondary subscription
              experiment, not like a subscription-first publisher. Official materials consistently emphasize SmartNews
              Ads, advertiser case studies, U.S. ad inventory, and new self-serve tools for SMBs. SmartNews+ matters
              strategically because it proves some willingness to pay for curated premium content, but even a cumulative
              100,000-subscriber milestone is small relative to the scale signals embedded in the core ad business.
              Pricing disclosure is also asymmetrical. The company is willing to publish SmartNews+ list pricing and to
              describe self-serve functionality, audience positioning, and campaign-support features, yet it does not
              disclose realized ad pricing, contribution margin, or advertiser retention. That means the public record
              supports the direction of the model—advertising first, subscription second—while leaving the actual
              monetization efficiency largely unverified. The practical implication is that mix matters more than
              headline revenue: a business tilted toward repeat premium advertisers and self-serve retention would be
              stronger than one still dependent on high-touch selling or promotional spend.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI028
