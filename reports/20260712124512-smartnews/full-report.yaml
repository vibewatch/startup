              The main customer-side risk is concentration opacity. SmartNews highlights publisher breadth, agency
              programs, and subscriber milestones, but it does not disclose how much traffic depends on top publishers,
              how much revenue depends on top advertisers or agencies, or whether U.S. growth is concentrated in a
              narrow audience slice. Customer evidence also differs by geography. Japan still appears to be the core
              installed-base market, whereas the United States looks more like an engagement and monetization expansion
