    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, corporate footprint, and mission
        blocks:
          - type: paragraph
            body: >-
              SmartNews is a Tokyo-founded information and news-discovery company whose official corporate page still
              anchors the business in smartphone applications and internet services rather than a narrow publishing
              niche. The company's current footprint is bi-continental in practice: Tokyo remains the headquarters, but
              the official office list still includes Palo Alto and New York, reinforcing that the U.S. was treated as a
              strategic market rather than a small export experiment. The mission language is also unusually stable
              across SmartNews surfaces. The company continues to frame the product not as generic engagement software
              but as infrastructure for delivering quality information, and the CEO message explicitly argues for
              personalization that broadens perspective rather than shrinking it. That positioning matters because later
              chapters show a business still dependent on attention and advertising, yet trying to preserve a
              public-interest and trust narrative distinct from purely social feeds for readers.
