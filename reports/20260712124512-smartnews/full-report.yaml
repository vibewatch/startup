      - number: '7.2'
        title: Regulatory, legal, and trust risk
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory side deserves special attention because SmartNews is becoming more AI-assisted
              while still depending on third-party journalism. Japan's AI promotion law and 2026 AI Basic Plan show that
              governance expectations are moving quickly even before any single hard prohibition appears. On privacy,
              the PPC remains the relevant regulator for a personalized media product, and its English-language legal
              and news surfaces underline that this is a live supervisory area. In the United States, the FTC continues
              to show interest in AI and platform conduct, which keeps SmartNews exposed to changing enforcement
              expectations. The most direct legal analogy is AP v. Meltwater, where a court rejected a fair-use defense
              for a news aggregation model judged too substitutional. SmartNews is not Meltwater, but the analogy
              matters because AI summaries and traffic-intermediating product features can reopen old rights disputes in
              new technical forms. Trust risk therefore sits at the intersection of law, product design, and partner
              economics.
