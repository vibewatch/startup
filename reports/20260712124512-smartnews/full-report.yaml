  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who the customers are
        blocks:
          - type: paragraph
            body: >-
              SmartNews is not a single-customer business. Readers generate attention and usage, advertisers fund most
              of the core experience, and publisher partners supply the inventory that makes the product valuable in the
              first place. That makes customer analysis inherently multi-sided. The clearest reader segments are
              mainstream mobile news readers in Japan and highly engaged adults 35+ in the United States, which is how
              the company still describes its U.S. ad audience. On the supply side, SmartNews highlights a network of
              more than 300 media companies and more than 3,000 brands, while SmartNews+ adds a smaller premium
              subscriber segment tied to paid business and economy content. This structure matters because strength in
              one segment does not automatically prove durability in the others: large download counts do not prove
              advertiser renewal, and broad partner counts do not prove low concentration.
