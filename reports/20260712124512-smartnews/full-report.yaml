      - number: '4.2'
        title: Traction and growth signals
        blocks:
          - type: paragraph
            body: >-
              Public traction signals are real but uneven. SmartNews still markets more than 50 million downloads, and
              its 2022 U.S. ad launch said the platform generated more than 1 billion article views per month. Later
              product and engagement releases still describe millions of loyal readers and even use per-capita daily
              consumption data to create city rankings in the United States. Against that, the best public revenue
              estimate is still secondary: GetLatka estimates SmartNews at $104.5 million of revenue in 2025, up from a
              much smaller 2021 datapoint of $23.2 million. That directionally supports a recovery story after the
              advertising downturn, but it is not audited and may not use the same definition across years. Usage
              transparency is also weak. The company does not publish a current MAU series, leaving outsiders to
              triangulate from older engagement claims and adverse third-party reporting.
            claimRefs:
              - CI010
              - CI009
