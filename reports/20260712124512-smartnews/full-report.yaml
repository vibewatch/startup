      - number: '3.3'
        title: Business-model and product differences
        blocks:
          - type: paragraph
            body: >-
              The most important competitive differences are not just brand names but business models. SmartNews and
              Gunosy are primarily ad-funded aggregators dependent on external publisher supply. Apple layers a paid
              subscription bundle on top of aggregation, giving it a clearer willingness-to-pay story for premium
              content. Google News is free and distribution-rich, supported by a broader ecosystem that makes direct
              news monetization less urgent. NHK is public-service oriented and owns much more of the reporting input
              itself, which changes both trust dynamics and content economics. Microsoft Start bundles news into a
              utility-heavy feed, and Flipboard leans into communities and newsletters. These differences matter because
              they shape what each rival optimizes for. SmartNews is still strongest when advertisers and readers value
              a balanced, trusted-publisher environment; it is weaker when a competing app can add magazines, weather,
              finance, or broader default placement at almost zero incremental distribution cost.
            claimRefs:
              - CP030
              - CP031
              - CP032
              - CP036
              - CP037
          - type: table
            tableRef: TP003
            claimRefs:
              - CP030
