  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Japan competitors: ecosystem power dominates'
        blocks:
          - type: paragraph
            body: >-
              In Japan, SmartNews does not compete in a clean standalone category. Reuters Institute shows that Yahoo
              still has strong weekly online news reach, while LINE News is embedded inside the country's dominant
              messaging habit and pushes multiple digest drops each day. NHK competes from a very different angle: its
              app and web properties lean on trust, original reporting, and disaster utility rather than on
              personalization alone. Gunosy remains the closest local pure-play analogue because it is still an
              ad-funded curation business built on external content partners, while Antenna competes for lighter
              lifestyle and article-browsing sessions. The common thread is that Japan's strongest rivals are either
              bundled into larger ecosystems or differentiated by utility and trust. That makes SmartNews's
              balanced-coverage framing useful, but it also means the company rarely faces rivals that are only news
              apps.
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
              - CP013
