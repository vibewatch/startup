      - CM001
      - CM026
      - CM029
  - id: FM004
    title: Adoption funnel / value-chain map
    type: flow
    layout: standard
    summary: >-
      The market works only when publisher supply, user habit, and advertiser demand all reinforce one another; weakness
      in any one layer reduces the value of the others.
    data:
      nodes:
        - id: publishers
          label: Publisher supply
        - id: curation
          label: Aggregation / curation layer
        - id: readers
          label: Reader habit and retention
        - id: advertisers
