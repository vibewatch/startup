            body: >-
              Trust and safety controls are visible but still not enterprise-grade from an underwriting standpoint.
              SmartNews publicly describes privacy manuals, an ISMS, a web accessibility page, and a broad security
              policy. It also supports users through a help center and feature-level FAQs. Those are positive signals,
              but they do not resolve several meaningful gaps. The review did not surface a public status page, detailed
