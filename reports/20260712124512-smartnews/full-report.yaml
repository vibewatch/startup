  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Observed valuation anchors and what they imply
        blocks:
          - type: paragraph
            body: >-
              SmartNews is still easy to describe but harder to price. The cleanest public valuation anchor remains the
              September 2021 Series F round, when the company disclosed a $230 million raise at a $2 billion valuation.
              That was a credible late-stage private mark at the time, but it now sits several operating chapters behind
              the current business. Public reporting later showed weaker user momentum, and Tracxn records a January
              2024 venture-debt financing that changed the underwriting tone from pure growth optionality toward
              balance-sheet questions. The best public revenue denominator remains GetLatka's 2025 estimate of roughly
              $104.5 million. On that number, the old $2 billion mark implies about 19.1x revenue, which is rich for a
              business still dependent on advertising, still private, and still short of prospectus-grade disclosure.
              That does not make the old mark impossible, but it does make it stale and much harder to defend without
              stronger current evidence.
            claimRefs:
              - CV001
