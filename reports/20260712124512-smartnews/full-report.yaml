      - - Audited financial statements
        - Not public
        - Material
        - Request audited FY2024-FY2025 package
      - - Cap table and liquidation preferences
        - Not public
        - Material
        - Request capitalization table and term summaries
      - - Debt covenants and liquidity runway
        - Not public
        - Material
        - Request treasury and lender package
      - - Prospectus-grade risk and KPI disclosure
        - Not public
        - Material
        - Request draft IPO materials or board pack
    notes: All items are standard blockers to a higher-confidence IPO-style valuation opinion.
    claimRefs:
      - CV032
      - CV039
      - CV040
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: standard
    summary: >-
      The major public inflection points cluster around 2019-2021 fundraising, a 2023 restructuring, and renewed
      AI/product moves in 2025-2026.
    data:
      items:
        - label: Founded
          value: 2012-06
          detail: SmartNews established in Tokyo
        - label: U.S. entry
          value: '2014'
          detail: U.S. subsidiary and U.S. app launch
        - label: Unicorn
          value: 2019-08
          detail: $28M tranche implied $1.1B valuation
        - label: Series E
          value: 2019-11
          detail: $92M at $1.2B
        - label: Series F
          value: 2021-09
          detail: $230M at $2B
        - label: U.S. ads
          value: 2022-10
          detail: Dedicated U.S. ad business launched
        - label: Layoffs
          value: 2023-01
          detail: 40% non-Japan staff reduction reported
        - label: Leadership reset
          value: 2023-10
          detail: Kaisei to CEO, Ken to Chair
        - label: Venture debt
          value: 2024-01
          detail: $69.3M debt round logged
        - label: Board expansion
          value: 2025-03
          detail: Additional outside directors added
        - label: AI Matome / NewsArc
          value: 2025-07/08
          detail: AI summary feature and new app launched
        - label: AI division
          value: 2026-07
          detail: Company-wide AI Transformation Division
    claimRefs:
      - CO001
      - CO016
      - CO024
      - CO022
      - CO025
      - CO037
      - CO039
      - CO010
      - CO045
      - CO012
      - CO050
  - id: FO002
    title: Company snapshot logic
    type: flow
    layout: standard
    summary: >-
      SmartNews combines a news-discovery consumer app with publisher supply, advertiser demand, and founder-led
      governance, but its 2023 restructuring exposed the platform's dependence on advertising and product execution.
    data:
      nodes:
        - id: mission
          label: Quality information mission
        - id: product
          label: Consumer news app
        - id: supply
          label: 3,000+ partner / brand claims
        - id: demand
          label: Advertisers and SmartNews+
        - id: leadership
          label: Founder-led governance
        - id: risk
          label: Ad-cycle and platform risk
      edges:
        - from: mission
          to: product
        - from: supply
          to: product
        - from: product
          to: demand
        - from: leadership
          to: product
        - from: risk
          to: demand
    claimRefs:
      - CO004
      - CO005
      - CO034
      - CO028
      - CO039
  - id: FO003
    title: Snapshot KPIs
    type: kpi
    layout: standard
    summary: >-
      The visible KPI set is strong on distribution and funding history but still weak on audited financial disclosure
      and current MAU clarity.
    data:
      items:
        - label: Downloads
          value: 50
          unit: M+
        - label: Apple ratings
          value: 928
          unit: K
        - label: Articles per day
          value: 400
          unit: K+
        - label: Series F valuation
          value: 2000
          unit: USD M
        - label: 2024 debt round
          value: 69.3
          unit: USD M
        - label: Current headcount
          value: 500
          unit: employees~
