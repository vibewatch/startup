              - CM001
              - CM029
      - number: '2.4'
        title: What the market implies for SmartNews
        blocks:
          - type: paragraph
            body: >-
              Putting the two geographies together, SmartNews looks strongest where trust, utility, and mobile habit
              intersect, not where pure scale is largest. Japan offers a favorable mix of digital reach, aging but
              highly connected audiences, fast-growing internet ad budgets, and a legacy-media sector that still needs
              distribution help. The U.S. offers a larger headline opportunity but punishes weak execution faster
              because trust is lower and substitutes are abundant. SmartNews's product choices—balanced-coverage
              messaging, local-news surfaces, rewards, and AI-assisted organization—fit this market logic well. So does
              the company's move toward self-serve ads for SMBs in Japan, where reach outside social media can still be
              marketed as a differentiator. The unresolved question is share. Without current official MAU disclosure,
              public evidence can frame the market and explain why SmartNews matters, but it cannot cleanly prove how
              much of the addressable opportunity the company still controls in either core geography.
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM040
              - CM039
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Japan remains the more underwritable market
            body: >-
              Japan gives SmartNews the best combination of official advertising data, strong mobile reach, and a
              publisher sector that still benefits from aggregation.
            calloutType: insight
            claimRefs:
              - CM004
              - CM016
              - CM027
          - type: callout
            title: The U.S. market is bigger but less forgiving
            body: >-
              High internet penetration does not automatically translate into durable SmartNews share when trust is low,
              local incumbents remain strong, and substitutes span Apple, Google, social video, and messaging.
            calloutType: risk
            claimRefs:
              - CM021
              - CM023
