        title: Exhibits
        blocks:
          - type: callout
            title: The $2B anchor is real but stale
            body: >-
              The 2021 Series F round is still the cleanest public mark, yet later user softness and 2024 debt mean it
              should not be carried forward mechanically.
            calloutType: risk
