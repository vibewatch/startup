  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Highest-priority risks
        blocks:
          - type: paragraph
            body: >-
              SmartNews's risk stack is unusually intertwined. The most important risks are not isolated compliance line
              items but connected problems that can hit product scope, partner confidence, usage, revenue, and financing
              at the same time. The clearest top-tier risks are financing dependency after the 2024 debt round, renewed
              user decline in the core product, and legal or rights disputes around aggregation and AI-assisted
              summaries. These are followed closely by platform dependency on Apple and Google, privacy and AI
              governance obligations, and execution risk in the U.S. expansion story. The company does have
              mitigations—publisher partnerships, security and privacy policies, and a formal AI Transformation
              Division—but most of those mitigations are governance- or roadmap-based rather than outcome-proven. That
              keeps residual risk meaningfully high and makes downside transmission unusually fast if one key risk
              crystallizes into a visible operational or legal event for management teams.
