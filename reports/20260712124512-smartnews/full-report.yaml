              - CP037
          - type: callout
            title: Bundle power is the core competitive threat
            body: >-
              The hardest peers are not just better news apps; they are products embedded in portals, operating systems,
              messaging networks, or public-service ecosystems.
            calloutType: risk
            claimRefs:
