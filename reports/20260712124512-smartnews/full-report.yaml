      - CO032
      - CO033
      - CO026
      - CO045
      - CO047
  - id: FM001
    title: Market sizing lens
    type: pyramid
    layout: standard
    summary: >-
      A realistic SmartNews market view narrows from total advertising down to internet media and then to the smaller
      subset of trust-sensitive news-discovery inventory.
    data:
      items:
        - label: Total Japan ad market (2025)
          value: 8062.3
        - label: Japan internet advertising (2025)
          value: 4045.9
        - label: Japan internet media spend (2025)
          value: 3309.3
        - label: Trust-sensitive article / news-discovery slice
          value: 99.3
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM037
    approximationNotes: >-
      The bottom layer is an evidence-constrained estimate using a low-single-digit share of the internet-media pool
      rather than a published standalone market total.
  - id: FM002
    title: Evidence-constrained Japan SAM range
    type: range
    layout: standard
    summary: >-
      Because no public source isolates a news-app-only ad market, the Japan SAM range is framed as 1% to 5% of Dentsu's
      internet-media expenditure base.
    data:
      items:
        - label: Low case
          low: 33.1
          high: 33.1
          value: 33.1
        - label: Base case
          low: 99.3
          high: 99.3
          value: 99.3
        - label: High case
          low: 165.5
          high: 165.5
          value: 165.5
    claimRefs:
      - CM005
      - CM037
    approximationNotes: Values are estimated in JPY billions as 1%, 3%, and 5% of Dentsu's 2025 internet-media expenditure pool.
  - id: FM003
    title: Buyer / segment importance KPIs
    type: kpi
    layout: standard
    summary: >-
      Readers, publishers, and advertisers each touch SmartNews through different workflows, which is why the market
      cannot be described as a simple one-sided media app.
    data:
      items:
        - label: Japan daily reader importance
          value: 9
        - label: U.S. engaged adult importance
          value: 6
        - label: Publisher partner importance
          value: 8
        - label: Premium subscriber importance
          value: 4
        - label: SMB advertiser importance
          value: 7
