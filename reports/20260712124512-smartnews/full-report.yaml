      - number: '8.2'
        title: Comparable screens and why they matter
        blocks:
          - type: paragraph
            body: >-
              No public company is a perfect SmartNews comparable, so the useful exercise is triangulation rather than
              one-for-one matching. New York Times is relevant because it is a scaled digital-news business with
              subscription depth and major brand power. Nextdoor is relevant because it is an attention marketplace
              whose value depends on habit, local relevance, and ad monetization. Mercari matters because it is a
              Japanese mobile consumer-internet company with public-market pricing and local investor context. Reddit
              matters because it is one of the few attention platforms still receiving a materially higher revenue
              multiple due to clearer growth and network effects. On the current screens, SmartNews at the old $2
              billion mark looks more expensive than New York Times, Nextdoor, and Mercari, and even somewhat richer
              than Reddit. That is a high bar because SmartNews has much thinner public growth, margin, and disclosure
              evidence than any of those listed peers.
