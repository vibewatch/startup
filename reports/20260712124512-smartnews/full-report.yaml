      - number: '2.2'
        title: 'Japan market dynamics: large, digital, but structurally mixed'
        blocks:
          - type: paragraph
            body: >-
              Japan remains an attractive home market because the digital audience is large and the advertising base is
              still growing, even though publisher economics are under pressure. DataReportal puts Japan at 107 million
              internet users, 99 million social identities, and 99 million LINE users entering 2026. Dentsu shows that
              internet advertising is now more than half of all Japanese ad spend, with video and social formats growing
              especially quickly. Yet Reuters Institute makes the structural constraints clear: newspapers and
              television still matter culturally, Yahoo and LINE retain powerful online reach, and most local and
              national newspapers still derive less than 5% of revenue from digital sales. In other words, SmartNews
              sits in a market with real consumer digitization but incomplete publisher transformation. That combination
              is helpful for aggregators because it preserves distribution demand, but it also creates friction over
              rights, monetization, and platform dependence. Japan therefore offers SmartNews its deepest distribution
              opportunity, but not a frictionless supply environment.
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM004
              - CM007
              - CM008
              - CM016
              - CM017
              - CM018
