      - number: '1.3'
        title: Capital history, scale signals, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              The cleanest valuation anchors are still the 2019 and 2021 financings. SmartNews first crossed the unicorn
              threshold in 2019 when TechCrunch reported a $28 million tranche at a $1.1 billion valuation, then
              officially closed a $92 million Series E at $1.2 billion later that year. The last widely corroborated
              priced round remains the September 2021 Series F, when SmartNews announced a $230 million raise at a $2
              billion valuation and said cumulative capital exceeded $400 million. Public scale signals are
              directionally strong but noisy. Current company marketing says 50 million-plus downloads, 400,000-plus
              daily articles, and 3,000-plus media partners, while the App Store points to a very large rating base. But
              some company surfaces cite 1,500-plus trusted partners instead, and recent public materials still do not
              provide a clean current MAU, revenue, or official headcount pack. As a result, SmartNews's identity is
              well evidenced, while its current operating scale is only partially evidenced.
