      - number: '3.4'
        title: What the competition means for SmartNews
        blocks:
          - type: paragraph
            body: >-
              The competitive picture is mixed rather than fatal. Public signals still support treating SmartNews as a
              serious competitor: it markets 50 million-plus downloads, claims Japan leadership to advertisers, and
              earned a strong Pixalate ad-quality ranking in 2025. But the adverse evidence also matters. TechCrunch
              reported that SmartNews's downloads and active users deteriorated during 2023, and the company no longer
              publishes the kind of current MAU data that would let outsiders rank it precisely against every peer. That
              makes one conclusion hard to avoid: SmartNews is probably more defendable in Japan than in the United
              States, but even in Japan it is fighting ecosystems, not just apps. The company therefore needs to keep
              winning on trust, balance, and advertiser quality—areas where it can still tell a distinct story—while
              accepting that pure feature breadth will be difficult to match against Apple, Google, Microsoft, or
              Yahoo/LINE-style bundles. Just as importantly, management needs to prove that product additions such as
              rewards, AI organization, and local surfaces improve retention rather than simply adding parity features
              that larger rivals can copy or out-distribute consistently.
            claimRefs:
              - CP002
              - CP027
              - CP028
              - CP026
              - CP038
              - CP037
          - type: table
            tableRef: TP004
            claimRefs:
              - CP007
              - CP023
              - CP003
              - CP026
              - CP009
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: SmartNews still has a distinct brand position
            body: >-
              Its non-social, trusted-publisher, balanced-news framing remains clearer than many rivals' broader portal
              or utility propositions.
            calloutType: strength
            claimRefs:
