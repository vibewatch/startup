      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is plausible but not underwritable on public information alone. There is enough
              evidence to say SmartNews still has a meaningful ad business: channel partners are active, the SMB motion
              is being expanded, and premium publisher engagement has not disappeared. There is also enough evidence to
              say the company went through a real reset, because TechCrunch documented the layoffs and subsequent user
              decline, and the later venture debt round fits that harder context. What is missing is the package
              investors actually need: audited revenue, gross margin, geographic mix, advertiser concentration, cash,
              debt covenants, and a time series of current usage. As a result, the right verdict is not that SmartNews
              lacks a business, but that the public record cannot distinguish between a genuinely recovering ad platform
              and a still-fragile one that remains dependent on financing optionality.
