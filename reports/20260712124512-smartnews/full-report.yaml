      - number: '7.3'
        title: Operational, dependency, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk at SmartNews is primarily software, partner, and go-to-market risk rather than
              physical-asset risk. The company depends on publisher feeds, app-store platforms, content rights, agency
              relationships, and increasingly AI tooling. Public evidence also leaves material blind spots: no public
              status page, no detailed incident history, and no deep disclosure on AI quality controls. Rewards create
              another layer of operational complexity because the product now includes points, missions, and third-party
              reward fulfillment. People risk is also real. The 2023 layoffs and current smaller employee base mean the
              company must execute a broad agenda—core stabilization, self-serve monetization, and AI product
              expansion—with less margin for error. The United States remains the sharpest execution test because it
              combines lower trust, more powerful bundled rivals, and weaker public proof of current customer depth.
              Platform dependence also extends into feature access, not just app distribution, monetization, and support
