              SmartFormat documentation makes clear that SmartNews relies on structured publisher feeds and metadata
              rather than on a purely opaque black-box ingestion model. That matters because it implies content quality
              and formatting are jointly produced by SmartNews systems and partner implementation quality. The WordPress
