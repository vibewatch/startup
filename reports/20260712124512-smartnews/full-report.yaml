            body: >-
              Durability evidence is thinner than reach evidence, but some signals do exist. SmartNews Rewards is
              important not because it is a huge revenue source, but because it makes repeat usage operationally visible
              through missions, points history, and redemption workflows. SmartNews+ adds a second durability signal by
              proving that at least some users will pay for a recurring news bundle. On the advertiser side, SMB spend
