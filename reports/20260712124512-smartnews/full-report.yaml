      - number: '1.2'
        title: Founders, governance, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              SmartNews remains visibly founder-led, but the form of that founder control changed after the 2023
              leadership reset. Kaisei Hamamoto now holds the CEO role while Ken Suzuki moved to Executive Chair,
              preserving founder continuity while acknowledging that the company needed a new operating cadence after
              the U.S. expansion stumble. The same announcement added Cory Ondrejka as CTO, an important signal because
              SmartNews's product story depends on machine-learning, AI, and mobile product iteration rather than on
              content ownership alone. Governance became more externally legible in 2025, when SmartNews added prominent
              outside directors with SaaS, AI, and executive-coaching backgrounds. Even so, the public picture is still
              incomplete: investors can see the named board but not a detailed committee structure, a broader executive
              bench, or a full succession map. That keeps key-person dependence materially higher than it would be at a
              prospectus-grade disclosure level.
