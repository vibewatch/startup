      - number: '2.3'
        title: U.S. market dynamics and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The U.S. opportunity is attractive on paper but much harder in practice. Reuters Institute shows a
              population of roughly 347 million with very high internet penetration, and it reports that online and
              social-news consumption continue to edge up while TV declines. But the same report shows that trust in
              news fell again in 2026 to a new survey low, with local television and regional newspapers still the most
              trusted brands. That matters because SmartNews is not entering an empty market; it is competing against
              Apple News, Google News, Flipboard, Microsoft Start, TikTok-linked attention habits, and local incumbents
              that still own trust in many communities. SmartNews's own U.S. advertising positioning emphasizes highly
              engaged adults 35+ and brand-safe news inventory, which is logical, but it is also a narrower wedge than a
              broad mass-market news ecosystem. The result is a paradox: the U.S. ad pool is bigger than Japan's, yet
              SmartNews's evidence of durable current share is weaker, making the U.S. more important strategically than
              it is dependable analytically.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM038
              - CM039
