        title: Mitigations, monitoring, and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              SmartNews does not look unmanaged. It has visible mitigations: security and privacy policies, structured
              publisher documentation, a broad partner base, self-serve monetization experiments, and an AI Control
              Plane meant to centralize governance and cost management. But the question is not whether mitigations
              exist; it is whether they are strong enough to offset the key residual risks. For now, the answer is only
              partly. Investors should monitor usage stabilization, rights-holder sentiment, AI product quality, privacy
              or regulatory developments, and any financing event that suggests the company still needs more time or
              fresh capital. The main thesis-break triggers are straightforward: another clear period of usage decline,
              a credible legal or rights challenge tied to aggregation or summaries, or evidence that capital adequacy
              remains unresolved. If any of those fire, the downside case would stop being theoretical and start
              becoming operational. In practice, the risk framework should be updated continuously rather than treated
