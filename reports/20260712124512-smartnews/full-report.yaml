  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              SmartNews is best understood as a mobile information workflow, not just as a news homepage. The core
              product organizes content from thousands of publishers into a personalized feed for daily reading, local
              updates, and topic discovery. Around that core, the company has added several distinct modules: SmartNews+
              for premium business content, AI Matome for AI-assisted issue synthesis, NewsArc as a separate AI-native
              news app, and Rewards or Missions as a loyalty loop that encourages repeated reading. Public product
              breadth therefore looks wider than it did a few years ago. The important distinction is maturity. The core
              app and publisher-distribution layer look mature, while the AI-native surfaces and loyalty mechanics are
              newer and should be treated as meaningful extensions rather than already-proven franchises. That matters
              because later diligence should not assume all modules contribute equally to retention, monetization, or
              strategic defensibility.
