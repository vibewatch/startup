- calloutType: strength
  title: Rarely matched Japanese distribution footprint
  body: Even after the U.S. reset, SmartNews still presents as one of the few Japanese-born consumer news apps with meaningful cross-border brand recognition, large install history, and a mature publisher supply base.
  claimRefs:
  - CO030
  - CO034
  - CO017
- calloutType: risk
  title: Current scale disclosure is materially thinner than the marketing surface
  body: Installs, ratings, and funding history are public, but current MAU, audited revenue, burn, debt terms, and partner concentration are not. That makes the company easier to admire than to underwrite.
  claimRefs:
  - CO036
  - CO047
  - CO048
- calloutType: insight
  title: The 2023-2024 reset is the key hinge in the diligence story
  body: 'SmartNews looks like two companies at once: the 2021 growth story that supported a $2 billion valuation, and the post-layoff, post-debt business that is still rebuilding evidence of durable U.S. traction.'
