company:
  name: SmartNews
chapter:
  number: 1
  title: Company Overview
  summary: SmartNews is a Tokyo-founded consumer news platform whose last clear equity mark remains the 2021 $2 billion Series F, but whose 2023 layoffs and 2024 venture debt signal a materially different operating posture than the pandemic-era growth story. Official company surfaces still show meaningful consumer reach, a large publisher network, and continued AI/product investment, yet the public record remains thin on current MAU, audited revenue, and precise headcount.
sections:
- id: identity-and-structure
  title: Identity, corporate footprint, and mission
  body: 'SmartNews is a Tokyo-founded information and news-discovery company whose official corporate page still anchors the business in smartphone applications and internet services rather than a narrow publishing niche. The company''s current footprint is bi-continental in practice: Tokyo remains the headquarters, but the official office list still includes Palo Alto and New York, reinforcing that the U.S. was treated as a strategic market rather than a small export experiment. The mission language is also unusually stable across SmartNews surfaces. The company continues to frame the product not as generic engagement software but as infrastructure for delivering quality information, and the CEO message explicitly argues for personalization that broadens perspective rather than shrinking it. That positioning matters because later chapters show a business still dependent on attention and advertising, yet trying to preserve a public-interest and trust narrative distinct from purely social
    feeds for readers.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  tableRefs:
  - TO001
  figureRefs:
  - FO002
  - FO003
- id: founders-governance-and-key-person-risk
  title: Founders, governance, and key-person risk
  body: 'SmartNews remains visibly founder-led, but the form of that founder control changed after the 2023 leadership reset. Kaisei Hamamoto now holds the CEO role while Ken Suzuki moved to Executive Chair, preserving founder continuity while acknowledging that the company needed a new operating cadence after the U.S. expansion stumble. The same announcement added Cory Ondrejka as CTO, an important signal because SmartNews''s product story depends on machine-learning, AI, and mobile product iteration rather than on content ownership alone. Governance became more externally legible in 2025, when SmartNews added prominent outside directors with SaaS, AI, and executive-coaching backgrounds. Even so, the public picture is still incomplete: investors can see the named board but not a detailed committee structure, a broader executive bench, or a full succession map. That keeps key-person dependence materially higher than it would be at a prospectus-grade disclosure level.'
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO012
  - CO013
  - CO014
  tableRefs:
  - TO002
- id: capital-history-and-scale-signals
  title: Capital history, scale signals, and disclosure quality
  body: The cleanest valuation anchors are still the 2019 and 2021 financings. SmartNews first crossed the unicorn threshold in 2019 when TechCrunch reported a $28 million tranche at a $1.1 billion valuation, then officially closed a $92 million Series E at $1.2 billion later that year. The last widely corroborated priced round remains the September 2021 Series F, when SmartNews announced a $230 million raise at a $2 billion valuation and said cumulative capital exceeded $400 million. Public scale signals are directionally strong but noisy. Current company marketing says 50 million-plus downloads, 400,000-plus daily articles, and 3,000-plus media partners, while the App Store points to a very large rating base. But some company surfaces cite 1,500-plus trusted partners instead, and recent public materials still do not provide a clean current MAU, revenue, or official headcount pack. As a result, SmartNews's identity is well evidenced, while its current operating scale is only partially evidenced.
  claimRefs:
  - CO022
  - CO023
  - CO024
  - CO025
  - CO026
  - CO027
  - CO028
  - CO030
