evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current revenue
    missingEvidence: Audited 2024-2025 revenue, gross margin, and cash-flow statements.
    whyItMatters: Without a public P&L, the last valuation anchor cannot be tied to current operating scale or profitability.
    diligencePath: Request management accounts or lender materials.
    relatedQuestionRefs:
      - QO018
  - type: private-evidence-only
    severity: material
    topic: current MAU and retention
    missingEvidence: Current MAU/DAU by geography plus retention and cohort definitions.
    whyItMatters: TechCrunch reported a sharp decline in active users, but the company does not publish updated denominator metrics.
    diligencePath: Request KPI dashboards for Japan and U.S. user cohorts.
    relatedQuestionRefs:
      - QO019
  - type: private-evidence-only
    severity: minor
    topic: current headcount
    missingEvidence: Official headcount by office and function plus post-restructuring hiring plan.
    whyItMatters: Third-party headcount estimates are useful but not precise enough for margin and runway work.
    diligencePath: Ask management for an org chart and current employee census.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: publisher partner count
    missingEvidence: A reconciled definition of partners, media companies, and brands.
    whyItMatters: Company surfaces cite 1,500+, 3,000+, and 300-media-company frameworks that are not obviously apples-to-apples.
    diligencePath: Request a current partner master list and the company's internal counting rules.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: IPO status
    missingEvidence: Any prospectus, exchange filing, or underwriter mandate disclosed by the company.
    whyItMatters: Database-style IPO signals are too weak to treat as a real financing event or timing commitment.
    diligencePath: Monitor official filings and ask management directly about listing status.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: market share
    missingEvidence: Current SmartNews MAU, DAU, and ad-revenue share by geography.
    whyItMatters: Public market context is strong, but current SOM cannot be underwritten without company-level usage disclosure.
    diligencePath: Request recent KPI dashboards for Japan and the U.S.
    relatedQuestionRefs:
      - QM022
      - QM023
  - type: missing-source
    severity: material
    topic: publisher mix
    missingEvidence: Partner-level revenue split across advertising, subscription, and publisher programs.
    whyItMatters: The market is multi-sided, so SmartNews's true SAM depends on which monetization pools it actually converts.
    diligencePath: Request segment revenue and partner monetization disclosures.
    relatedQuestionRefs:
      - QM024
  - type: enumeration-incomplete
    severity: minor
    topic: market definition exclusions
    missingEvidence: A company-authored statement of which adjacent services it treats as competitors, substitutes, and non-markets.
    whyItMatters: Boundary choices materially affect TAM inflation risk.
    diligencePath: Ask management to define included and excluded categories for board and investor materials.
    relatedQuestionRefs:
      - QM002
  - type: private-evidence-only
    severity: material
    topic: current competitive share
    missingEvidence: Recent MAU, DAU, retention, and session-depth metrics versus core peers by geography.
    whyItMatters: Competitive analysis is strongest when public positioning is combined with current behavioral share.
    diligencePath: Request product KPI and cohort dashboards.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: minor
    topic: Yahoo-specific app data
    missingEvidence: Standalone Yahoo News app or product metrics comparable to Apple News / Google News surfaces.
    whyItMatters: Reuters confirms Yahoo reach, but app-specific metrics remain limited.
    diligencePath: Look for LY product disclosures or third-party app-intelligence data.
    relatedQuestionRefs:
      - QP001
  - type: missing-source
    severity: minor
    topic: Antenna scale
    missingEvidence: Current active-user or monetization metrics for Antenna.
    whyItMatters: Antenna is a substitute set participant, but the exact weight is unclear.
    diligencePath: Search for owner disclosures or third-party app intelligence.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: audited financials
    missingEvidence: Audited FY2025 revenue, gross profit, EBITDA, net income, cash balances, and actual revenue mix by stream.
    whyItMatters: >-
      Without audited statements and segment detail, public revenue estimates cannot support a valuation conclusion or
      verify mix quality.
    diligencePath: Request the latest board-approved or audited financial statements plus revenue segmentation.
    relatedQuestionRefs:
      - QI004
      - QI003
      - QI024
  - type: private-evidence-only
    severity: material
    topic: burn and runway
    missingEvidence: Monthly burn, current cash, debt covenant package, and working-capital timing details.
    whyItMatters: >-
      Capital adequacy is the central underwriting blocker after the 2024 debt round, and working-capital timing affects
      how much runway the company actually has.
    diligencePath: Request treasury reporting, debt documents, and a monthly cash-conversion bridge.
    relatedQuestionRefs:
      - QI017
      - QI011
      - QI016
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Advertiser CAC, realized pricing, gross margin, and cohort retention.
    whyItMatters: Without these, the self-serve growth story cannot be translated into margin durability.
    diligencePath: Request advertiser cohort and gross-margin analysis.
    relatedQuestionRefs:
      - QI008
      - QI009
  - type: private-evidence-only
