company:
  name: SmartNews
chapter:
  number: 6
  title: Customers
  summary: 'SmartNews serves a multi-sided customer base: readers create the usage, advertisers fund most of the model, and publishers supply the inventory. Public proof is strongest on consumer adoption and named advertiser / publisher examples, but much weaker on churn, renewal, and concentration. The result is a credible adoption story with visible expansion experiments, especially in Japan and around U.S. rewards, but incomplete durability evidence.'
sections:
- id: who-the-customers-are
  title: Who the customers are
  body: 'SmartNews is not a single-customer business. Readers generate attention and usage, advertisers fund most of the core experience, and publisher partners supply the inventory that makes the product valuable in the first place. That makes customer analysis inherently multi-sided. The clearest reader segments are mainstream mobile news readers in Japan and highly engaged adults 35+ in the United States, which is how the company still describes its U.S. ad audience. On the supply side, SmartNews highlights a network of more than 300 media companies and more than 3,000 brands, while SmartNews+ adds a smaller premium subscriber segment tied to paid business and economy content. This structure matters because strength in one segment does not automatically prove durability in the others: large download counts do not prove advertiser renewal, and broad partner counts do not prove low concentration.'
  claimRefs:
  - CU001
  - CU009
  - CU006
  - CU007
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-and-public-proof
  title: Adoption and public proof
  body: 'Public customer proof is strongest on the consumer side. SmartNews still markets more than 50 million downloads, and the U.S. App Store listing shows a very large ratings base with a strong average score. Historical third-party reporting also shows that SmartNews reached substantial scale before the 2023 reset, with TechCrunch citing about 30 million MAUs at peak. At the same time, the public record is not uniformly positive. TechCrunch later reported material decline in downloads and active users during 2023, including much lower estimated global MAUs. The best way to read the evidence is therefore as mixed but real: SmartNews clearly has or had a meaningful installed base, but current active usage is not fully verified by company disclosure. On the B2B side, the clearest public proof comes from named cases such as Kashiwaya, CCI, ELLE Japan, and the publisher names shown on the U.S. ads surface.'
  claimRefs:
  - CU002
  - CU004
  - CU023
  - CU024
  - CU025
  - CU014
  - CU012
  - CU013
  - CU010
  tableRefs:
