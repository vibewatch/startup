  - FU003
- id: durability-repeat-usage-and-expansion
  title: Durability, repeat usage, and expansion
  body: Durability evidence is thinner than reach evidence, but some signals do exist. SmartNews Rewards is important not because it is a huge revenue source, but because it makes repeat usage operationally visible through missions, points history, and redemption workflows. SmartNews+ adds a second durability signal by proving that at least some users will pay for a recurring news bundle. On the advertiser side, SMB spend growth and the self-serve push suggest SmartNews is trying to broaden the paying base rather than rely only on a handful of large accounts. Yet the most important durability metrics—reader retention, subscriber churn, advertiser renewal, publisher concentration, and contract length—remain undisclosed. That means SmartNews has visible engagement loops and expansion experiments, but not the quantitative retention package needed to prove lasting customer economics. It also means a large share of the customer story still depends on management data rather than on public operating
    evidence, especially for cohorts, renewal timing, and revenue-weighted customer health.
  claimRefs:
  - CU016
  - CU017
  - CU019
  - CU007
  - CU015
  - CU033
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration-and-what-is-still-missing
  title: Concentration risk and what is still missing
  body: The main customer-side risk is concentration opacity. SmartNews highlights publisher breadth, agency programs, and subscriber milestones, but it does not disclose how much traffic depends on top publishers, how much revenue depends on top advertisers or agencies, or whether U.S. growth is concentrated in a narrow audience slice. Customer evidence also differs by geography. Japan still appears to be the core installed-base market, whereas the United States looks more like an engagement and monetization expansion story supported by rewards, trust marketing, and premium-audience positioning. That can work, but it also means the company has to prove the U.S. cohorts are durable. The correct diligence posture is therefore to treat SmartNews as a platform with credible adoption and named proof, but with unresolved concentration and retention questions that sit exactly at the point where underwriting would normally begin. Until those disclosures exist, customer quality should be described
    as plausible rather than fully proven for investors today in public markets.
  claimRefs:
  - CU030
  - CU031
  - CU035
  - CU021
  - CU034
  tableRefs:
  - TU005
