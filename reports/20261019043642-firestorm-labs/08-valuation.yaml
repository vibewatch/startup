company:
  name: Firestorm Labs
chapter:
  number: 8
  title: Valuation
  summary: >-
    Firestorm has credible evidence of product differentiation, defense-program traction,
    and financing momentum, but the public record still does not disclose the Series B
    post-money valuation, preference stack, or operating metrics needed to underwrite price.
    On that evidence set, the supportable stance remains research-more with unknown valuation
    rather than a conviction buy.
sections:
  - id: recommendation-price-discipline
    title: Recommendation and price discipline
    body: >-
      Firestorm looks investable as a company concept before it looks underwritable as a
      priced round. Independent coverage says the company closed an $82 million Series B in
      April 2026 and has raised $153 million in total, while company and partner materials
      support a real expeditionary-manufacturing proposition around xCell and Tempest.
      That is enough to keep the company on the shortlist for defense-manufacturing exposure.
      It is not enough to support an entry price today because the retained public record
      still does not disclose the Series B post-money valuation, liquidation preferences,
      board/control terms, audited revenue, gross margin, burn, or cash balance. The
      recommendation is therefore research-more, with medium confidence, high risk, and an
      unknown valuation stance until management opens the financing and operating data rooms.
    claimRefs: [CV001, CV003, CV004, CV007, CV011, CV012]
    tableRefs: [TV001]
  - id: thesis-versus-underwriting-gap
    title: Upside exists, but public price support does not
    body: >-
      The upside case is evidence-backed: Firestorm is trying to move manufacturing to the
      point of need, not just sell another drone platform. Company materials describe xCell
      as an off-grid containerized microfactory, partner proof says Tempest-family airframes
      can come off the line in roughly nine hours with full aircraft ready in about
      36 hours, and the APFIT award adds real program signal around Indo-Pacific deployment.
      Third-party coverage also frames Firestorm's closest reference set around expeditionary
      manufacturing and additive-logistics plays rather than mature drone-OEM valuation
      multiples. The underwriting gap is just as clear: the public record still lacks priced
      round terms, audited financials, and verified conversion from pilot or award momentum
      into recurring production revenue, while specialized defense-tech commentary says scaled
      adoption remains early and could be slowed by additive-manufacturing quality,
      cybersecurity, and procurement friction.
    claimRefs: [CV004, CV005, CV007, CV009, CV011, CV012, CV013, CV014]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: scenarios-diligence-thesis-breakers
    title: Scenario range, exit readiness, and thesis-break triggers
    body: >-
      Because no retained source discloses the current post-money valuation, the scenario
      range has to stay milestone-based rather than numeric. The bull case requires proof
      that xCell deployments convert into repeat production orders, that hardware-plus-program
      revenue carries acceptable gross margins, and that the next financing does not hide
      punitive preference or control terms. The base case assumes the company keeps winning
      strategic programs but remains too opaque on unit economics for new capital to clear an
      underwriting committee. The bear case is a familiar defense-startup pattern: adoption
      stays pilot-heavy, additive-manufacturing and procurement frictions slow conversion, and
      a later round resets price or introduces structure that dilutes common economics. The
      final diligence asks are straightforward: deliver the signed Series B terms, current cap
      table, customer concentration and backlog schedules, and monthly revenue-margin-cash
      reporting. Until then, the prudent exit posture is watchlist rather than underwriting.
    claimRefs: [CV003, CV007, CV008, CV009, CV011, CV012, CV013]
    tableRefs: [TV003]
