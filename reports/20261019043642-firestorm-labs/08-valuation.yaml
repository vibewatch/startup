  evidenceGaps:
    - type: missing-source
      severity: material
      topic: valuation-terms-gap
      missingEvidence: Verified Series B post-money valuation, liquidation preferences, participation rights, board/control terms, and current cap-table seniority.
      whyItMatters: Those terms determine entry price, dilution downside, and whether a later recap could erase common-equity upside.
      diligencePath: Request the signed term sheet, financing documents, and current cap table from management or counsel.
      relatedQuestionRefs: [QV004]
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure-gap
      missingEvidence: Audited revenue, gross margin, burn, cash runway, backlog conversion, and program-mix reporting for the current period.
      whyItMatters: Scenario underwriting cannot move from narrative to valuation discipline without operating metrics and cash conversion evidence.
      diligencePath: Request current management accounts, backlog schedules, cohort or program revenue detail, and a monthly cash bridge.
      relatedQuestionRefs: [QV005, QV008]
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Named repeat-production customers, concentration by program, and deployment-to-order conversion data across DoD and allied buyers.
      whyItMatters: Strong pilot or award headlines can still mask fragile demand concentration and weak repeat-order durability.
      diligencePath: Request top-customer concentration, booked orders by program, and reference calls tied to repeat deployments rather than demos.
      relatedQuestionRefs: [QV007, QV009]
