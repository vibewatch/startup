    columns: [Side, Argument, What would change the view]
    rows:
      - ["Thesis", "xCell shifts value toward distributed manufacturing and logistics resilience rather than only a drone SKU.", "Downgrade if field deployments fail to convert into repeat production orders."]
      - ["Thesis", "Independent coverage plus partner proof support a fast-build operating concept and meaningful government interest.", "Downgrade if the APFIT and Air Force pathways remain pilot-heavy or non-recurring."]
      - ["Anti-thesis", "The public record does not disclose the current post-money valuation, liquidation preferences, or control terms.", "Upgrade only when the signed round documents and cap table are opened for diligence."]
      - ["Anti-thesis", "Specialized defense-tech commentary still sees additive-manufacturing quality, cyber, and procurement friction as real scaling risks.", "Upgrade only when management shows qualification evidence, secure deployment controls, and repeat procurement velocity."]
    notes: >-
      This table separates company quality from entry-price quality; the view changes mainly on
      disclosed terms, production conversion, and validated unit economics.
    claimRefs: [CV004, CV005, CV007, CV009, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside / trigger]
    rows:
      - ["Bull", "xCell deployments convert into repeat orders and management shows strong gross margin plus cash runway.", "Premium pricing is supportable only if the next disclosed mark is backed by revenue quality rather than narrative alone.", "More follow-on production awards, wider allied deployments, and disclosed backlog conversion.", "Breaks if scale remains demo-led or if new capital adds heavy structure."]
      - ["Base", "Program interest continues but financial disclosure remains private and order conversion remains mixed.", "Fair stance stays watchlist or diligence-only because public evidence cannot anchor a numeric entry price.", "Continued contract headlines without revenue, margin, or cash detail.", "Breaks if the company seeks capital before opening key metrics."]
      - ["Bear", "Procurement friction, qualification gaps, or concentrated demand slow adoption and force a later financing under pressure.", "Down-round or structure-heavy financing risk outweighs upside because the prior mark cannot be verified publicly.", "Delayed deployments, weak repeat-order evidence, or adverse financing signals.", "Triggered by slower production conversion or punitive new terms."]
    notes: >-
      No retained public source discloses a supportable numeric valuation range, so the scenario
      logic is milestone-based rather than point-estimate based.
    claimRefs: [CV003, CV007, CV008, CV009, CV011, CV012, CV013]
