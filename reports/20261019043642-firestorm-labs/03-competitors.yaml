  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-comparability
      missingEvidence: Like-for-like public pricing, delivery cadence, and packaged capability data for other expeditionary or modular UAS competitors.
      whyItMatters: Without comparable public price and delivery data, competitive economics can only be discussed through procurement signals and company claims.
      diligencePath: Obtain competitor proposals, program budget exhibits, or independent procurement comparisons that normalize price, quantity, and sustainment scope.
      relatedQuestionRefs: [QP005]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: contract-conversion
      missingEvidence: Task-order drawdown, delivered unit counts, renewal behavior, and deployment usage data under the USAF IDIQ and APFIT-backed programs.
      whyItMatters: Public award headlines alone do not prove recurring demand or defensible share within military procurement cycles.
      diligencePath: Request contract schedules, exercised options, unit delivery records, and program office references from management or contracting officers.
    - type: missing-source
      severity: material
      topic: direct-peer-benchmarking
      missingEvidence: Independent benchmark evidence comparing Firestorm against direct peer systems on qualification reliability, switching cost, and customer win rates.
      whyItMatters: Moat durability remains partly narrative until buyers or neutral evaluators show why Firestorm wins over competing approaches in repeatable programs.
      diligencePath: Collect win-loss data, third-party evaluations, qualification reports, and named customer references that compare alternatives on the same mission set.
