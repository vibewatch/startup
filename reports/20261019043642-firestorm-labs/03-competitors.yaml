        - label: Firestorm xCell + Tempest
          x: 5
          y: 5
          note: Containerized production, modularity, and third-party integration are explicit parts of the retained product story.
          claimRefs: [CP001, CP004, CP007]
        - label: Legacy prime-led UAS supply
          x: 1
          y: 2
          note: Retained evidence frames the incumbent alternative as centralized and slower to iterate for expeditionary use.
          claimRefs: [CP002, CP006]
        - label: Conventional fixed-wing sUAS vendors
          x: 2
          y: 2
          note: Firestorm's cost and speed claims are made against existing comparable fixed-wing systems, but public architecture details are sparse.
          claimRefs: [CP002, CP006]
        - label: Anduril / CoAspire / Leidos / Zone 5 class
          x: 3
          y: 2
          note: Adjacent containerized programs compete for affordable-mass budgets, but the retained sources do not show equivalent drone microfactories.
          claimRefs: [CP005, CP012]
        - label: Internal military additive build
          x: 4
          y: 3
          note: Localization can be high, but the customer carries process, qualification, and cyber burden.
          claimRefs: [CP010, CP012]
        - label: Centralized resupply status quo
          x: 1
          y: 1
          note: The incumbent logistics model depends on long supply chains rather than forward production.
          claimRefs: [CP001, CP003, CP008]
    approximationNotes: >-
      Scores are ordinal rather than measured benchmarks because the assigned pool does not provide
      standardized competitor pricing, win rates, or independently verified capability scores.
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP007, CP008, CP010, CP012]
callouts:
  - calloutType: insight
    title: Architecture openness is the cleanest anti-lock-in argument
    body: >-
      The most defensible competitive angle in public materials is not just faster airframe production;
      it is the claim that OCTRA and xCell can support third-party integrations and even non-Firestorm
      systems, which gives procurement teams a reason to test the manufacturing stack without fully
      committing to a closed vendor ecosystem.
    claimRefs: [CP004, CP013]
  - calloutType: risk
    title: Adjacent budget competition can dilute the differentiation story
    body: >-
      Even if no retained source shows a perfect like-for-like microfactory rival, Firestorm still competes
      with adjacent affordable-mass and containerized-defense programs plus the status quo of centralized
      supply, and independent adverse coverage says broad adoption remains early.
    claimRefs: [CP005, CP009, CP010, CP012]
