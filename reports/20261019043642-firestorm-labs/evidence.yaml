evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation-gap
    missingEvidence: >-
      Verified post-money valuation, debt instruments, liquidation preferences, and any secondary transactions from the
      Series A or Series B.
    whyItMatters: Capital structure and valuation are core to ownership dilution, downside protection, and return underwriting.
    diligencePath: >-
      Request cap-table summaries, financing docs, and any Form D or side-letter disclosures from management and lead
      investors.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: financial-visibility
    missingEvidence: >-
      Revenue, gross margin, burn, cash balance, and backlog disclosures tied to audited or management-reporting
      periods.
    whyItMatters: >-
      Contract momentum does not show whether the company can convert program wins into durable unit economics and cash
      runway.
    diligencePath: Obtain audited financial statements, current management accounts, and program-level revenue recognition policies.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, independent-director participation, investor governance rights, and reserved-matter
      controls.
    whyItMatters: >-
      Governance depth matters for oversight, future financing flexibility, and founder-control risk in a defense
      company scaling quickly.
    diligencePath: >-
      Request the current board deck, charter documents, investor rights agreements, and an organization chart covering
      legal entities and directors.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: scale-gaps
    missingEvidence: >-
      Current headcount, customer count, named operational units, and independent validation of xCell throughput and
      mission acceptance.
    whyItMatters: >-
      Scale claims drive both topline potential and execution risk, but current public evidence does not verify whether
      deployment volume matches the narrative.
    diligencePath: >-
      Request workforce data, customer references, delivery schedules, and acceptance-test evidence for deployed
      systems.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A third-party market model that isolates expeditionary manufacturing plus modular defense UAS spend by geography,
      buyer, and time basis.
    whyItMatters: >-
      Without a common denominator, public evidence supports only proxy sizing and funded-wedge analysis instead of a
      defensible TAM, SAM, or SOM.
    diligencePath: >-
      Request management's internal market model and any third-party studies used in fundraising, then reconcile them to
      named program budgets and service branches.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: contract-conversion
    missingEvidence: >-
      Task-order history, obligated dollars, backlog, and conversion timing for the Air Force IDIQ and APFIT-related
      programs.
    whyItMatters: >-
      Contract ceilings and awards can materially overstate serviceable demand if they do not convert into recurring
      procurement and sustainment revenue.
    diligencePath: Obtain a management schedule of awarded versus obligated dollars by program, quarter, end user, and vehicle type.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: roi-proof
    missingEvidence: >-
      Independent cost-per-airframe, lifecycle sustainment, or readiness comparisons versus conventional drone supply
      chains.
    whyItMatters: >-
      The one-fifth-cost and faster-build claims are central to buyer ROI, but retained public evidence does not
      independently validate the savings.
    diligencePath: >-
      Request customer after-action reports, procurement analyses, or third-party test data comparing xCell-enabled
      output against baseline production and resupply methods.
    relatedQuestionRefs:
      - QM004
      - QM005
  - type: missing-source
    severity: material
    topic: pricing-comparability
    missingEvidence: >-
      Like-for-like public pricing, delivery cadence, and packaged capability data for other expeditionary or modular
      UAS competitors.
    whyItMatters: >-
      Without comparable public price and delivery data, competitive economics can only be discussed through procurement
      signals and company claims.
    diligencePath: >-
      Obtain competitor proposals, program budget exhibits, or independent procurement comparisons that normalize price,
      quantity, and sustainment scope.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: contract-conversion
    missingEvidence: >-
      Task-order drawdown, delivered unit counts, renewal behavior, and deployment usage data under the USAF IDIQ and
      APFIT-backed programs.
    whyItMatters: Public award headlines alone do not prove recurring demand or defensible share within military procurement cycles.
    diligencePath: >-
      Request contract schedules, exercised options, unit delivery records, and program office references from
      management or contracting officers.
  - type: missing-source
    severity: material
    topic: direct-peer-benchmarking
    missingEvidence: >-
      Independent benchmark evidence comparing Firestorm against direct peer systems on qualification reliability,
      switching cost, and customer win rates.
    whyItMatters: >-
      Moat durability remains partly narrative until buyers or neutral evaluators show why Firestorm wins over competing
      approaches in repeatable programs.
    diligencePath: >-
      Collect win-loss data, third-party evaluations, qualification reports, and named customer references that compare
      alternatives on the same mission set.
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: List pricing, realized ASPs, contract structures, and payment milestones for Tempest, xCell, and sustainment work.
    whyItMatters: Without transaction-level pricing, public sources cannot distinguish marketing claims from durable unit revenue.
    diligencePath: Request executed customer quotes or contracts, invoice samples, and revenue-recognition policy by product line.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: conflicting-data
    severity: material
    topic: financing-history
    missingEvidence: Primary round documentation reconciling seed, Series A, Series B, non-dilutive capital, and net cash proceeds.
    whyItMatters: >-
      Conflicting public round summaries prevent a reliable view of dilution, available cash, and the timing of next
      financing needs.
    diligencePath: >-
      Obtain financing documents, board-approved capitalization tables, and bank-confirmed cash proceeds by round close
      date.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, backlog, debt or covenant obligations, and management runway assumptions.
    whyItMatters: >-
      The core underwriting question is whether current cash and booked demand are enough to fund manufacturing scale-up
      without near-term financing risk.
    diligencePath: >-
      Review current financial statements, monthly cash bridge, backlog aging, debt schedules, and next-round trigger
      metrics.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Revenue mix by product line, sustainment attach rate, customer concentration, and gross margin by Tempest versus
      xCell programs.
    whyItMatters: >-
      Hardware revenue quality depends on recurrence, concentration, and profitability, none of which are observable
      from retained public sources.
    diligencePath: >-
      Request cohort-level customer revenue, program backlog, renewal or sustainment attachment, and segment
      gross-margin reporting.
    relatedQuestionRefs:
      - QI001
      - QI006
    relatedTableRefs:
      - TI001
      - TI003
