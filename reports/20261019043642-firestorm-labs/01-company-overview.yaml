company:
  name: Firestorm Labs
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Firestorm Labs is a San Diego defense manufacturer founded in 2022 around a
    dual thesis: modular drones plus deployable xCell microfactories that move
    production closer to contested operating environments. Public evidence shows
    meaningful government traction and $153 million of cumulative financing by
    April 2026, but it still leaves valuation, detailed governance, customer
    count, revenue, and headcount materially under-disclosed.
sections:
  - id: identity-and-snapshot
    title: Identity, stage, and operating thesis
    body: >-
      Firestorm positions itself as a defense startup building modular unmanned
      aerial systems and containerized expeditionary manufacturing infrastructure
      for contested logistics. Independent reporting and company materials align
      on several core facts: the company is San Diego-based, was founded in
      2022, and sells an xCell manufacturing platform alongside Tempest-family
      drones and related government-contracted hardware programs. The best
      supported current-stage marker is the April 2026 Series B financing, which
      moved disclosed cumulative funding to $153 million and implies a company
      still in venture-backed scale-up rather than at public-company maturity.
      Public sources support the product thesis and selected contract ceilings,
      but not headline operating metrics such as revenue run rate, customer
      count, or current headcount. That makes the overview investable as an
      identity baseline, but not yet sufficient for financial underwriting.
    claimRefs: [CO001, CO002, CO003, CO005, CO007, CO008, CO009, CO010]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership, and governance visibility
    body: >-
      Firestorm's public narrative is founder-led and heavily concentrated around
      CEO Dan Magy. Across retained sources, Magy is the recurring spokesperson
      for product, contracts, and strategic direction, while Chad McCoy and Ian
      Muceus supply military-operations and additive-manufacturing credentials
      that underpin the company's market fit. That founder-market match is a
      strength for a defense manufacturing startup whose value proposition spans
      warfighter workflows and production technology. The tradeoff is governance
      opacity: retained public materials identify the operating founders but do
      not disclose a current board roster, independent directors, or capital
      rights detail for later-stage investors. The result is a clear management
      story but an incomplete governance and control picture.
    claimRefs: [CO004, CO005, CO014]
    tableRefs: [TO002]
  - id: funding-and-stakeholders
    title: Funding history, stakeholder mix, and scale signals
    body: >-
      The disclosed financing arc is rapid. Firestorm's known path runs from a
      March 2024 seed round to a July 2025 $47 million Series A and then an
      April 2026 $82 million Series B led by Washington Harbour Partners, with
      recurring defense-aligned backers including Lockheed Martin Ventures,
      Booz Allen Ventures, In-Q-Tel, and NEA. Government demand is also material
      to the company narrative: reporting and company statements tie Firestorm to
      an Air Force contract with a $100 million ceiling and an APFIT award worth
      up to $30 million for Indo-Pacific deployment of xCell and Tempest systems.
      Even so, current public materials do not verify post-money valuation,
      revenue, cap-table structure, or customer concentration, so the stakeholder
      picture is stronger on strategic alignment than on economics.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: milestones-and-underwriting-constraints
    title: Milestones and current underwriting constraints
    body: >-
      Milestones since 2022 show fast movement from founding to programmatic
      military traction: early venture funding, Air Force contracting, the HP
      exclusivity tie-up, a headquarters expansion, Series B financing, and the
      APFIT award all landed within roughly two years. That pace supports the
      thesis that Firestorm has reached more than concept-stage relevance. It
      does not remove execution risk. Company-controlled sources still dominate
      manufacturing-capacity claims, and an external defense-tech analysis argues
      that procurement reform, additive-manufacturing quality, and cyber-control
      execution remain prerequisites for scaled adoption. The overview therefore
      supports Firestorm as a strategically aligned and well-financed defense
      supplier, while leaving key financial and governance questions open for
      later diligence.
    claimRefs: [CO011, CO012, CO013, CO015]
    figureRefs: [FO001]
