companyProfile:
  summary: >-
    Firestorm Labs is a San Diego defense manufacturer founded in 2022 around a dual thesis: modular drones plus
    deployable xCell microfactories that move production closer to contested operating environments. The company markets
    Tempest-family UAS, xCell expeditionary manufacturing cells, and OCTRA-like control-layer capabilities, with public
    evidence showing meaningful U.S. defense traction and rapid financing momentum but limited disclosure on valuation,
    revenue quality, customer concentration, and governance detail.
