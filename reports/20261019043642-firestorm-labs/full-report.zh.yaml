        - label: xCell 部署
          detail: 集装箱化的远征制造单元被定位为可变现的硬件和现场部署产品。
        - label: Tempest 生产与备件
          detail: Tempest 系列飞行器、零部件和维修活动，是该制造模式最显眼的产出。
        - label: 已交付硬件与支持收入
