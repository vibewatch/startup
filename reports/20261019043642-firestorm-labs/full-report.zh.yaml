  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              公开证据表明，Firestorm 更像一个双边市场故事，而不是普通无人机初创公司。Sacra 明确称其同时参与战术型和可消耗型 UAS
              采购，以及可部署国防制造基础设施，因此相关支出包括模块化飞行器、前沿维修与保障流程，以及替代部分后方补给的制造节点。其边界窄于泛泛的“国防科技”，却宽于纯机体供应商。主要替代方案仍是现状：固定工厂生产、集中物流和单平台无人机供应商。Firestorm
              也有双用途叙事，尤其涉及 HP 支持的应急响应邻近场景，但现有证据显示短期重心仍在国防。
            claimRefs:
              - CM001
              - CM002
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM008
              - CM014
      - number: '2.2'
        title: 买方、用户与付款方匹配
        blocks:
          - type: paragraph
            body: >-
              当前买方路径由政府主导。Sacra 称 Firestorm
              面向美国政府和盟国国防机构销售硬件、制造基础设施、开发合同和保障支持，而非软件订阅。用户是前沿部署的作战单位，付款方通常是军种采购或作战预算部门，需要判断按需生产是否足以改善战备、从而值得设立新的采购类别。公开来源显示其先从空军切入，再扩展到陆军发射效应、海军陆战队远征物流、SOCOM
              简陋环境制造、海军分布式海上行动，以及本地工业基础薄弱的印度—太平洋盟军。Flow 的客户证明也显示，机动性、可运输性和产出速度是买方触发因素，而不只是载荷性能。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM013
              - CM014
      - number: '2.3'
        title: 有证据支撑的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              公开市场规模更适合用一组代理视角，而不是单一市场估值来衡量。最强的数字信号包括五年期 $100 million 空军 IDIQ、最高 $30 million 的 APFIT
              印度—太平洋部署奖项，以及为扩充产能筹得的 $153 million。它们说明 Firestorm
              所处类别确实有大额资金，但分母不同：合同上限不是收入，奖项不是完整战区预算，融资额也不是客户需求。产能主张提供了补充视角：Sacra 称单个 xCell 每月最多可生产 50 架 Group 2
              UAS；公司和合作伙伴材料则强调集装箱化部署、离网运行和产出所需时间。综合来看，这支持受争夺物流任务中的可服务切口，但不能证明完整的 TAM/SAM/SOM 层级。
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM010
              - CM015
