            title: 相邻预算竞争可能稀释差异化叙事
            body: 即使保留来源没有显示完全同类的微型工厂对手，Firestorm 仍要与相邻低成本规模化项目、集装箱化国防项目及集中供给现状竞争；独立的不利报道也称广泛采用仍处早期。
            calloutType: risk
