              A，资金将用于生产设施和招聘工程师；2026 年 APFIT 公告另称，最高 $30 million 的政府支持将用于 xCell 部署及 Tempest
              生产或保障。这些信号符合一家需要设施、工装、现场部署和集成人才、才能把需求变成可重复产出的企业。但不同第三方来源的轮次数据并不一致：Seedlist 将 Firestorm 列为 Series B、累计融资超过
              $82 million；较早的 Defense Tech Signals 仅总结约 $40 million 加非稀释资金，并提到规模小得多的 Series
              A。再加上现金、烧钱、积压订单和债务义务均未公开，现有证据不足以判断资本充足性。
