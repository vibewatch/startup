      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公开可见的里程碑显示，Firestorm 在约两年内从创立走向风险投资支持和项目规模扩张，但核心经济指标仍未充分披露。
    data:
      items:
        - year: '2022'
          label: 创立
          detail: 资料称 Firestorm 于 2022 年由 Dan Magy、联合创始人 Chad McCoy 和 Ian Muceus 在圣迭戈创立。
          tone: positive
          claimRefs:
            - CO001
            - CO004
        - period: March 2024
          label: 种子轮
          detail: 公司控制的回顾材料称，公司完成了由 Lockheed Martin Ventures 领投的 $12.5 million 种子轮融资。
          tone: positive
          claimRefs:
            - CO006
            - CO011
        - period: January 2025
          label: Air Force IDIQ
          detail: 公开报道称，Firestorm 宣布获得一份 $100 million 的 Air Force IDIQ 合同，用于模块化 3D 打印无人机。
          tone: positive
          claimRefs:
            - CO007
            - CO011
        - period: March 2025
          label: STRATFI 支持
          detail: 公司控制的材料称，Firestorm 获得 STRATFI PY25.1 支持，用于模块化 UAS、空射效应和 xCell。
          tone: positive
          claimRefs:
            - CO011
        - period: July 2025
          label: A 轮融资与 HP 合作
          detail: Firestorm 披露完成 $47 million A 轮融资；外部报道将这一时期与 HP Multi Jet Fusion 集成及制造扩张联系起来。
          tone: positive
          claimRefs:
            - CO006
            - CO011
        - period: September 2025
          label: 总部扩张
          detail: 公司控制的回顾材料称，Firestorm 在 2025 年扩张阶段于圣迭戈启用了新总部。
          tone: positive
          claimRefs:
            - CO015
        - date: 2026-04-29T00:00:00.000Z
          label: B 轮融资
          detail: TechCrunch 报道称，Washington Harbour Partners 领投了 $82 million B 轮融资，使累计融资达到 $153 million。
          tone: positive
          claimRefs:
            - CO005
            - CO011
        - date: 2026-05-07T00:00:00.000Z
          label: APFIT 奖项
          detail: Firestorm 宣布获选 APFIT 奖项，金额最高达 $30 million，用于扩大 xCell 和 Tempest 在印度洋—太平洋地区行动中的部署。
          tone: positive
          claimRefs:
            - CO007
            - CO011
    approximationNotes: null
