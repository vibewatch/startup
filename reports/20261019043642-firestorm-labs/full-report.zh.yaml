chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与经营逻辑
        blocks:
          - type: paragraph
            body: >-
              Firestorm 将自己定位为一家国防初创公司，为受争夺的物流环境提供模块化无人机系统和集装箱化远征制造基础设施。独立报道与公司材料共同确认：公司位于圣迭戈、成立于 2022 年，并销售 xCell
              制造平台、Tempest 系列无人机及相关政府合同硬件。最有力的阶段信号是 2026 年 4 月的 Series B，使已披露累计融资达到 $153
              million，说明公司仍处于风险资本支持的扩张期，而非上市公司成熟期。公开来源支持产品逻辑和部分合同上限，但没有披露收入跑速、客户数或当前员工数等核心经营指标，因此可作为身份基线，尚不足以完成财务投资判断。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO007
              - CO008
              - CO009
              - CO010
