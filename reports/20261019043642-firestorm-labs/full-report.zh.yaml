      - number: '4.3'
        title: 财务结论与投资判断阻碍
        blocks:
          - type: paragraph
            body: >
              财务结论需要保留条件：如果国防买方把项目载体和制造部署转化为有资金支持的生产，Firestorm
              似乎有可信的变现路径；但公开证据尚未证明收入质量、利润率持久性或现金跑道。最积极的信号是受争夺物流与现场制造反复形成的产品—市场联系，以及新资本和政府扩张奖项确实指向产能扩张，而非只有叙事性里程碑。风险同样清楚：收入似乎高度依赖国防采购周期；广泛引用的
              $100 million IDIQ 不等于确认收入，因为最初只承诺了很少资金；资本结构的公开报道又不一致，不能只靠公开摘要判断。尽调应聚焦当前现金、已承诺积压订单、各产品线毛利率、xCell
              部署经济性，以及保障或软件层能否在硬件出货之外形成有意义的经常性收入。
