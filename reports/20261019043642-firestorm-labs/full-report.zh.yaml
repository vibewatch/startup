      - number: '3.4'
        title: 壁垒逻辑成立，但持久性尚未获独立证明
        blocks:
          - type: paragraph
            body: >-
              最有支撑的壁垒逻辑是与供应商无关的架构和前沿制造：如果 xCell 真能在接近战场的地方生产并保障具备任务能力的飞行器，Firestorm
              就把买方决策从选机体改成选可部署生产模式。但独立的反向证据显示，大规模采用仍处早期，材料质量、网络安全和采购摩擦都可能削弱优势。因此，本章支持其差异化定位，却不足以完成持久壁垒的投资判断；还需补充直接赢单率、资质可靠性和合同转化证据。
            claimRefs:
              - CP004
              - CP009
              - CP010
              - CP011
              - CP012
