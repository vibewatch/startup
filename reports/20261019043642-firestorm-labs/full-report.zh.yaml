  - id: TV002
    title: 正论 / 反论表
    columns:
      - 立场
      - 论点
      - 哪些变化会改变判断
    rows:
      - - 正论
        - xCell 将价值推向分布式制造和物流韧性，而不只是某个无人机 SKU。
        - 如果前线部署无法转化为重复生产订单，则下调判断。
      - - 正论
        - 独立报道加上合作伙伴证明，支持快速建造的运营模式以及有意义的政府兴趣。
        - 如果 APFIT 和空军路径仍以试点为主或缺乏持续性，则下调判断。
      - - 反论
        - 公开记录没有披露当前投后估值、清算优先权或控制权条款。
        - 只有在签署的融资文件和股权结构表开放供尽调后才上调判断。
      - - 反论
        - 专业国防科技评论仍将增材制造质量、网络安全和采购摩擦视为真实的规模化风险。
        - 只有在管理层展示资格证据、安全部署控制和重复采购速度后才上调判断。
    notes: 本表将公司质量与入场价格质量分开；判断主要取决于披露条款、生产转化和经过验证的单位经济性。
