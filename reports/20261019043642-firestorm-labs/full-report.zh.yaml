  - id: FM001
    title: 公共市场切入点从广泛物流需求收窄到当前获资助项目
    type: pyramid
    summary: 留存来源支持这样一条收窄路径：从总体受争夺物流需求，聚焦到少数当前获得资助、与 Firestorm 相关的项目，而非一套完整量化的 TAM/SAM/SOM。
    data:
