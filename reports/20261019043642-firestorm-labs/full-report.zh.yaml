  - id: FE001
    title: 产品架构图
    type: stack
    summary: 可见的技术栈将通用控制层和模块化飞行器产出，与远征制造及外部依赖层结合起来。
    data:
      layers:
        - label: 任务软件与飞行器管理
          detail: OCTRA 被描述为整个飞行器家族共用的主板和计算层。
          modules:
            - 飞控
            - 任务计算机
            - 飞行器管理 PCBA
        - label: 载荷与飞行器配置
          detail: Tempest 系列飞行器是公开产出的主体，快速重新配置被定位为核心特征。
          modules:
            - 模块化机身
            - ISR 载荷选项
            - 电子战或打击配置
        - label: 增材制造工具链
          detail: xCell 将增材制造与装配结合在可野外部署的集装箱化流程中。
          modules:
            - 3D 打印
            - 机器人辅助装配
            - 测试流程
          outputs:
            - 约 9 小时完成机身
            - 约 36 小时完成整机
        - label: 部署与保障边界
          detail: 运营模式依赖离网供电、可运输性和少量操作员即可执行。
          modules:
            - 发电机供电
            - 拖车或空运转移
            - 前沿保障与维修
        - label: 合作伙伴与渠道界面
          detail: Firestorm 将 xCell 定位为支持合作伙伴及非 Firestorm 系统，而不只是支持自有机身。
          modules:
            - 合作伙伴平台支持
            - 本地化生产项目
            - 工业渠道角色
        - label: 外部依赖与保障层
          detail: 公开证据对资质、网络安全认证和一线用户采用的支持仍然薄弱。
          modules:
            - 打印机与材料
            - 不可打印部件
            - 资质与网络安全证据
    approximationNotes: null
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE007
      - CE009
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Firestorm 的公开客户推进路径从防务项目办公室需求走向作战单位部署，但采购摩擦仍在限制扩张。
    data:
      items:
        - label: 项目办公室需求信号
          actor: 空军 / AFWERX 采购
          stage: 发现
          touchpoints:
            - 独立报道将早期进展与国防部合同及 $100M Air Force IDIQ 联系起来。
            - 初步公开证据是获得预算路径，而不是已披露的经常性收入。
          tone: opportunity
        - label: 设计合作伙伴验证
          actor: AFSOC 与空军国民警卫队
          stage: 验证
          touchpoints:
            - Firestorm 称，早期合作改进了严苛环境下的模块化 UAS 制造。
            - 这些材料证明有任务用户参与，但尚未证明续单行为。
          tone: neutral
        - label: 演习展示
          actor: JIFX / 模拟行动
          stage: 试用
          touchpoints:
            - xCell 说明材料称，JIFX 演习期间生产了 Tempest 无人机和备件。
            - 展示证据强于品牌标识，但弱于明确命名的生产机队。
          tone: neutral
        - label: 作战部署
          actor: 印度洋—太平洋作战单位
          stage: 部署
          touchpoints:
            - APFIT 发布称，向作战单位部署已经开始。
            - 公开来源仍未披露单位身份和使用率。
          tone: positive
        - label: 现场制造闭环
          actor: 操作员与维护人员
          stage: 使用
          touchpoints:
            - Firestorm 和 SiliconANGLE 援引的数据称，每个 xCell 每月最多可生产 50 架 Group 2 无人机。
            - 该工作流的价值主张是在需求发生地生产、保障和维修。
          tone: opportunity
        - label: 扩张决策
          actor: 项目发起方与合同官
          stage: 扩张
          touchpoints:
            - 续单应取决于任务结果、预算释放和采购改革。
            - Defense Tech Signals 警告，初始义务金额很低，意味着采用仍处于早期阶段。
          tone: risk
    claimRefs:
      - CU002
      - CU004
      - CU007
      - CU008
