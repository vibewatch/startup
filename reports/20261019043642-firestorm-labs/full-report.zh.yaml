        title: 展示项
        blocks:
          - type: callout
            title: 架构开放是最清晰的反锁定论据
            body: 公开材料中最站得住脚的竞争角度不只是更快生产机体，而是 OCTRA 和 xCell 据称支持第三方集成乃至非 Firestorm 系统。这让采购团队可以先测试制造栈，不必立即锁定在封闭供应商生态中。
            calloutType: insight
            claimRefs:
