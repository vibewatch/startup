              - CO009
              - CO010
      - number: '1.2'
        title: 创始人、管理层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              Firestorm 的公开叙事由创始团队主导，核心发言人是 CEO Dan Magy。保留来源中，Magy 反复代表公司说明产品、合同和战略方向；Chad McCoy 与 Ian Muceus
              则提供军事行动和增材制造背景，支撑公司的市场匹配度。创始团队与市场的契合是优势，但治理透明度不足：公开材料只确认经营创始人，没有披露当前董事会、独立董事或后期投资人的资本权利。管理层故事清晰，治理与控制结构却仍不完整。
            claimRefs:
              - CO004
              - CO005
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO014
      - number: '1.3'
        title: 融资历史、利益相关方与规模信号
        blocks:
          - type: paragraph
            body: >-
              Firestorm 的融资节奏很快：2024 年 3 月种子轮、2025 年 7 月 $47 million Series A，随后是由 Washington Harbour Partners 领投的 2026
              年 4 月 $82 million Series B；Lockheed Martin Ventures、Booz Allen Ventures、In-Q-Tel 和 NEA
              等国防相关投资人持续出现。政府需求同样重要：报道和公司声明将 Firestorm 与上限 $100 million 的空军合同，以及最高 $30 million、用于印度—太平洋部署 xCell 和
              Tempest 系统的 APFIT 奖项联系起来。但公开材料仍未核实投后估值、收入、股权结构或客户集中度，利益相关方图谱在战略协同上强于经济性。
