            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM009
              - CM010
              - CM013
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM009
              - CM011
      - number: '2.4'
        title: 决定采用时点的约束
        blocks:
          - type: paragraph
            body: >-
              采用时点既取决于采购和资质，也取决于技术新颖性。Beehiiv 指出，空军 IDIQ
              初始只承诺了很少资金，说明公司仍需把兴趣转化为已部署项目和持续采购。同一来源还将材料资质、数字蓝图安全和采购摩擦列为现实障碍；公司来源则把 APFIT
              和印度—太平洋部署描述为受争夺物流问题已获得预算支持的证明。对估值而言，投资人可以评估差异化切口，但公开证据尚未显示广泛预算转化，也没有独立成本基准证明 Firestorm 声称的 TCO
              优势能稳定超过现有方案。
            claimRefs:
              - CM007
              - CM011
              - CM012
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 真正的市场切口是受争夺环境下的物流，而非泛化无人机
            body: 公开证据最有力的部分，是集装箱化制造如何改变分散军事行动的战备与保障经济性；模块化 UAS 是眼下的载荷类别。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
          - type: callout
            title: 预算转化仍不如买方兴趣确定
            body: 奖项、合同上限和公司融资都说明市场在关注，但公开来源仍未说明其中多少会转化为已承诺资金、持续生产和稳定采购行为。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局比已点名的无人机同行更广
        blocks:
          - type: paragraph
            body: >-
              现有证据支持的是广泛竞争集合，而不是一份整齐的直接同类名单。Firestorm 将 xCell 加 Tempest
              定义为按需制造与保障系统；独立报道则显示，资金更充足的现有厂商和其他集装箱化军事项目也在争夺相邻预算。买方还可以用传统主承包商供货、内部仓库或增材制造、集中式补给，或相邻的低成本规模化项目完成同一任务。因此，Firestorm
              的最近替代方案是现状流程与相邻国防项目的组合，而不只是公开市场上的类似初创公司。
