        title: 差异化集中在可部署制造与开放性
        blocks:
          - type: paragraph
            body: >-
              Firestorm 的公开差异化集中在制造本地化、模块化和采购灵活性，而非经过独立基准验证的飞行性能。官方材料声称成本为五分之一、建造速度快十倍、采用开放架构，并支持第三方集成乃至非 Firestorm
              系统。第三方和合作伙伴来源也描述了集装箱化生产、离网运行、快速组装和任务重构。竞争含义是，Firestorm 希望降低国防买方采用“模块化无人机平台加前沿生产节点”时的切换摩擦，但若干关键对比项仍无公开答案。
