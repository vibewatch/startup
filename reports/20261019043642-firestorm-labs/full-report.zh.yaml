      - number: '3.3'
        title: 公开定价证据稀少，采购结构比标价更重要
        blocks:
          - type: paragraph
            body: >-
              现有资料没有提供 Firestorm 与替代方案之间透明的同口径价格，因此最清晰的商业信号是采购结构。USAF IDIQ、APFIT
              奖项和公开融资历史支持其扩张，但不能证明复购或实际单位经济性。独立报道仍将公司视为早期挑战者，其竞争逻辑依赖压缩生产周期并在战术前沿部署。对于现有厂商、相邻集装箱化弹药供应商和内部自建方案，公开价格透明度更低，买方可能更看重进度、集成负担和物流韧性，而非标价。
