      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行情景 / 触发因素
    rows:
      - - Bull
        - xCell 部署转化为重复订单，且管理层展现出较强毛利率和现金续航。
        - 只有下一次披露的估值有收入质量而不只是叙事支撑时，溢价定价才站得住。
        - 更多后续生产奖项、更广泛的盟军部署，以及已披露积压订单的转化。
        - 如果规模化仍由演示驱动，或新资本增加沉重结构，则情景失效。
      - - Base
        - 项目兴趣持续，但财务披露仍属私人信息，订单转化仍然不一。
        - 由于公开证据无法锚定数值入场价，合理立场仍是观察名单或仅限尽调。
        - 持续出现合同新闻，但没有收入、利润率或现金细节。
        - 若公司在关键指标明朗前寻求融资，计划就会受阻。
      - - 熊市
        - 采购摩擦、资质缺口或需求集中会拖慢采用进度，并迫使公司在压力下推迟融资。
        - 由于此前估值无法通过公开渠道验证，下轮融资或复杂条款融资的风险超过上行空间。
        - 部署延迟、重复订单证据薄弱，或出现不利融资信号。
        - 生产转化放缓或新条款惩罚性过强时触发。
    notes: 没有留存的公开来源披露可支持的估值数值区间，因此情景逻辑以里程碑为基础，而不是以点估值为基础。
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV009
      - CV011
