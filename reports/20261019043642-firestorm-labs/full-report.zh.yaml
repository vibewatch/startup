        - label: 广泛防务需求：分布式行动依赖易受干扰的物流网络。
        - label: 可服务用例：在需求发生地开展远征制造、保障和维修。
        - label: 邻近支出池：战术 / 可消耗型 UAS 采购，加上野战制造基础设施。
        - label: 近期扩张路径：空军、陆军空射效应、海军陆战队远征物流、SOCOM，以及海军分布式海上行动。
        - label: 优先战区：美国及其盟友在印度洋—太平洋地区的用户，补给线长且工业深度有限。
        - label: 可见的获资助切入点：$100M Air Force IDIQ、最高 $30M 的 APFIT，以及公司自称已实现的作战部署。
    approximationNotes: 这是一个由证据支持的收窄视角，而不是数字化 TAM/SAM/SOM 金字塔，因为留存的公开来源没有披露贯穿各层的共同分母。
