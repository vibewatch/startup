        title: 里程碑与当前投资判断限制
        blocks:
          - type: paragraph
            body: >-
              自 2022 年以来，Firestorm 从成立走向军事项目进展的速度很快：早期风投资金、空军合同、HP 独家合作、总部扩张、Series B 融资和 APFIT
              奖项都在约两年内落地。这支持公司已超越概念阶段，但并不消除执行风险。产能主张仍主要来自公司控制的来源；外部国防科技分析指出，采购改革、增材制造质量和网络控制执行仍是规模化采用的前提。因此，公司战略匹配度高、资金充足，但财务和治理问题仍待后续尽调。
