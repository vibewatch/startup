companyProfile:
  summary: >-
    Firestorm Labs 是一家总部位于圣迭戈、成立于 2022 年的国防制造商，核心思路是把模块化无人机与可部署的 xCell 微型工厂结合起来，让生产更靠近受争夺的作战环境。公司销售 Tempest 系列 UAS、xCell
    远征制造单元和类似 OCTRA 的控制层能力。公开证据显示其美国国防业务进展和融资势头都很强，但估值、收入质量、客户集中度和治理细节披露有限。
