callouts:
  - calloutType: risk
    title: Key kill criterion
    body: If Firestorm reaches the next financing or deployment cycle without public evidence of qualification or acceptance, clearer obligation conversion under major defense programs, and basic unit-economics disclosure, the current thesis remains too narrative-dependent for an aggressive underwrite.
    claimRefs: [CR004, CR009, CR010, CR011]
  - calloutType: insight
    title: Mitigation quality is real but still mostly self-described
    body: Firestorm is not ignoring the hardest risks - it describes encryption, air-gapped operations, ruggedization, and distributed manufacturing safeguards - but retained public evidence still lacks enough independent proof to lower residual risk below high.
    claimRefs: [CR006, CR007, CR008]
