      - ["Production cycle proxy", "~9 hours for an airframe and ~36 hours for a full aircraft in partner/news coverage", "Medium", "Cycle time is the clearest public proxy for throughput, labor absorption, and working capital turns", "Validated production yield, QA/test duration, scrap rates, and field-ready acceptance timing"]
