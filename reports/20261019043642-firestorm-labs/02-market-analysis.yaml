callouts:
  - calloutType: "insight"
    title: "The real market wedge is contested logistics, not generic drones"
    body: "Public evidence is strongest where containerized manufacturing changes readiness and sustainment economics for dispersed military operations, with modular UAS as the immediate payload category."
    claimRefs: [CM001, CM002, CM006, CM007]
  - calloutType: "risk"
    title: "Budget conversion is still less proven than buyer interest"
    body: "Awards, ceilings, and company financing show attention, but public sources still leave open how much of that interest converts into obligated dollars, recurring production, and durable procurement behavior."
    claimRefs: [CM009, CM010, CM011, CM012]
