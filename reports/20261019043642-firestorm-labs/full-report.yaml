  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape is broader than named drone peers
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence pool supports a broad competitive set rather than a clean list of direct
              like-for-like peers. Firestorm frames xCell plus Tempest as a point-of-need manufacturing and sustainment
              system, while independent coverage describes adjacent budget pressure from better capitalized incumbents
              and other containerized military programs. In practice, the buyer can solve the same mission with legacy
              prime-led UAS supply, internal depot or additive-manufacturing efforts, conventional centralized resupply,
              or adjacent affordable-mass programs that compete for the same contested-logistics budget. That makes
              Firestorm's nearest substitutes a mix of status quo processes and adjacent defense programs, not just one
              set of public startup look-alikes.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP012
