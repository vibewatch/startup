              - CP009
              - CP010
              - CP013
      - number: '3.3'
        title: Public pricing evidence is sparse, so procurement structure matters more than list price
        blocks:
          - type: paragraph
            body: >-
              The pool does not provide transparent like-for-like pricing across Firestorm and alternatives, so the
              clearest commercial signal is procurement structure. Firestorm has a USAF IDIQ, an APFIT award, and public
              funding history, which together support scale-up but do not prove repeat orders or realized unit
              economics. Independent reporting still frames the company as an early-stage challenger whose competitive
              case depends on compressing production cycles and fielding at the tactical edge. For incumbents, adjacent
              containerized-munitions vendors, and internal build substitutes, public price transparency is even weaker,
              so buyers are likely comparing schedule, integration burden, and logistics resilience more than sticker
              price.
            claimRefs:
              - CP002
              - CP006
              - CP008
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat arguments are plausible, but durability is not yet independently proven
        blocks:
          - type: paragraph
            body: >-
              The best-supported moat arguments are vendor-agnostic architecture and manufacturing-at-the-edge: if xCell
              can actually produce and sustain mission-capable aircraft close to the fight, Firestorm changes the buying
              decision from selecting an airframe to selecting a deployable production model. That said, the strongest
              independent adverse evidence is that large-scale adoption remains early and that material quality,
              cybersecurity, and acquisition friction can still blunt the advantage. The chapter therefore supports a
              differentiated position, but not a fully underwritten durable moat; additional evidence is needed on
              direct win rates, qualification reliability, and contract conversion.
            claimRefs:
              - CP004
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architecture openness is the cleanest anti-lock-in argument
            body: >-
              The most defensible competitive angle in public materials is not just faster airframe production; it is
              the claim that OCTRA and xCell can support third-party integrations and even non-Firestorm systems, which
              gives procurement teams a reason to test the manufacturing stack without fully committing to a closed
              vendor ecosystem.
            calloutType: insight
            claimRefs:
              - CP004
              - CP013
          - type: callout
            title: Adjacent budget competition can dilute the differentiation story
            body: >-
              Even if no retained source shows a perfect like-for-like microfactory rival, Firestorm still competes with
              adjacent affordable-mass and containerized-defense programs plus the status quo of centralized supply, and
              independent adverse coverage says broad adoption remains early.
            calloutType: risk
            claimRefs:
              - CP005
              - CP009
              - CP010
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and publicly visible traction
        blocks:
          - type: paragraph
            body: >
              Firestorm's revenue model is only partially visible in public materials, but the retained evidence is
              directionally consistent on where money should come from. Company and partner sources describe a product
              stack built around Tempest-family unmanned systems, xCell deployable manufacturing cells, and related
              sustainment or spare-parts work rather than a subscription-heavy software model. The strongest publicly
              repeated operating proxy is manufacturing speed: third-party and partner coverage both cite roughly nine
              hours for an airframe and about 36 hours for a full aircraft, while company materials frame the value
              proposition around lower total cost of ownership and distributed production. What remains missing is the
              commercial layer that matters most for underwriting: no retained source discloses unit prices, realized
              ASPs, attach rates for sustainment, or revenue split between xCell hardware, aircraft, and follow-on
              support.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI010
              - CI011
              - CI012
