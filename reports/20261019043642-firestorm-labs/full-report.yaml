  - id: FM001
    title: Public market wedge narrows from broad logistics need to current funded programs
    type: pyramid
    summary: >-
      Retained sources support a narrowing wedge from general contested-logistics demand to a small set of currently
      funded Firestorm-aligned programs rather than a fully quantified TAM/SAM/SOM stack.
    data:
      items:
        - label: 'Broad defense need: distributed operations depend on logistics networks that are vulnerable to disruption.'
        - label: 'Serviceable use case: expeditionary manufacturing, sustainment, and repair at the point of need.'
        - label: 'Adjacent spend pools: tactical / attritable UAS procurement plus field manufacturing infrastructure.'
        - label: >-
            Near-term expansion path: Air Force, Army launched effects, Marine expeditionary logistics, SOCOM, and Navy
            distributed maritime operations.
        - label: 'Priority theater: U.S. and allied Indo-Pacific users with long resupply lines and limited industrial depth.'
        - label: 'Visible funded wedge: $100M Air Force IDIQ, up to $30M APFIT, and company-claimed operational fielding.'
