  - id: FI001
    title: Publicly evidenced revenue model bridge
    type: flow
    summary: >
      Public sources point to a defense-procurement bridge from xCell deployment and Tempest production into hardware
      and sustainment revenue, but they stop short of realized pricing or gross-profit disclosure.
    data:
      nodes:
        - label: Defense procurement demand
          detail: Contested-logistics demand from U.S. and allied operators is the clearest buyer need described publicly.
        - label: Award and contract vehicles
          detail: IDIQ, STRATFI, and APFIT-style vehicles create funding paths, but ceilings do not equal recognized revenue.
        - label: xCell deployment
          detail: >-
            Containerized expeditionary manufacturing cells are positioned as a monetizable hardware and
            field-deployment product.
        - label: Tempest production and spares
          detail: Tempest-family aircraft, parts, and repair activity are the most visible outputs of the manufacturing model.
        - label: Delivered hardware and support revenue
          detail: >-
            Revenue likely depends on production orders, deployment count, and sustainment attach rates that are not
            publicly disclosed.
        - label: Gross-profit visibility gap
          detail: Public evidence supports the speed and cost thesis, but not margin, burn, or cash-conversion data.
      edges:
        - from: Defense procurement demand
          to: Award and contract vehicles
          label: Mission need converts into budgeted procurement channels
        - from: Award and contract vehicles
          to: xCell deployment
          label: Program support scales field manufacturing capacity
        - from: xCell deployment
          to: Tempest production and spares
          label: Microfactory output supports aircraft, parts, and sustainment
        - from: Tempest production and spares
          to: Delivered hardware and support revenue
          label: Revenue depends on funded deliveries and service attachment
        - from: Delivered hardware and support revenue
          to: Gross-profit visibility gap
          label: Public disclosures end before ASP, margin, and cash data
    approximationNotes: >-
      The sequence is qualitative and sourced from retained descriptions of products, awards, and manufacturing flow; it
      is not a quantified revenue forecast.
    claimRefs:
      - CI001
      - CI003
      - CI010
      - CI011
      - CI012
      - CI014
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The visible stack pairs a common control layer and modular aircraft outputs with expeditionary manufacturing and
      external dependency layers.
    data:
      layers:
        - label: Mission software and vehicle management
          detail: OCTRA is presented as the common board and compute layer across the vehicle family.
          modules:
            - Flight controller
            - Mission computer
            - Vehicle management PCBA
        - label: Payload and aircraft configuration
          detail: >-
            Tempest-family aircraft are the main public output surface, with rapid reconfiguration positioned as a core
            feature.
          modules:
            - Modular airframe
            - ISR payload options
            - EW or strike configurations
        - label: Additive manufacturing toolchain
          detail: xCell combines additive manufacturing with assembly inside a field-deployable containerized workflow.
          modules:
            - 3D printing
            - Robotic-assisted assembly
            - Testing workflow
          outputs:
            - Airframes in roughly 9 hours
            - Full aircraft in about 36 hours
        - label: Deployment and sustainment envelope
          detail: The operating model depends on off-grid power, transportability, and limited-operator execution.
          modules:
            - Generator power
            - Trailer or airlift movement
            - Forward sustainment and repair
        - label: Partner and channel surface
          detail: Firestorm positions xCell as support for partner and non-Firestorm systems, not only its own airframes.
          modules:
            - Partner platform support
            - Localized production programs
            - Industrial channel role
        - label: External dependency and assurance layer
          detail: Public proof remains thin on qualification, cyber accreditation, and practitioner adoption.
          modules:
            - Printers and materials
            - Non-printable components
            - Qualification and cyber evidence
    approximationNotes: null
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE007
      - CE009
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Firestorm's public customer motion runs from defense program-office demand to field-unit deployment, with
      procurement friction still gating expansion.
    data:
      items:
        - label: Program-office demand signal
          actor: Air Force / AFWERX procurement
          stage: Discovery
          touchpoints:
            - Independent coverage ties early traction to DoD contracts and a $100M Air Force IDIQ.
            - Initial public proof is budget pathway access, not disclosed recurring revenue.
          tone: opportunity
        - label: Design-partner validation
          actor: AFSOC and Air National Guard
          stage: Validation
          touchpoints:
            - Firestorm says early collaborations refined modular UAS manufacturing in austere environments.
            - These references prove mission-user input, but not yet renewal behavior.
          tone: neutral
        - label: Exercise demonstration
          actor: JIFX / simulated operations
          stage: Trial
          touchpoints:
            - The xCell explainer says Tempest drones and spare parts were produced during JIFX exercises.
            - Demonstration evidence is stronger than logos, weaker than named production fleets.
          tone: neutral
        - label: Operational fielding
          actor: Indo-Pacific operational units
          stage: Deployment
          touchpoints:
            - The APFIT release says fielding to operational units has already begun.
            - Public sources still withhold unit identities and utilization rates.
          tone: positive
        - label: On-site manufacturing loop
          actor: Operators and maintainers
          stage: Usage
          touchpoints:
            - Firestorm and SiliconANGLE cite up to 50 Group 2 drones per month per xCell.
            - The workflow value proposition is point-of-need production, sustainment, and repair.
          tone: opportunity
        - label: Expansion decision
          actor: Program sponsors and contracting officers
          stage: Expansion
          touchpoints:
            - Repeat orders should depend on mission outcomes, budget release, and procurement reform.
            - Defense Tech Signals warns that minimal initial obligations keep adoption early-stage.
          tone: risk
    claimRefs:
      - CU002
      - CU004
      - CU007
      - CU008
