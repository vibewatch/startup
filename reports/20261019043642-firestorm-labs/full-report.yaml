  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and incumbent substitutes
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports treating Firestorm as a two-sided market story rather than a generic drone
              startup. Sacra explicitly says the company competes across both tactical and attritable UAS procurement
              and deployable defense manufacturing infrastructure, which means the relevant spend includes modular
              aircraft, forward repair and sustainment workflows, and the manufacturing node that replaces rear-echelon
              resupply for some missions. That framing is narrower than broad “defense tech” rhetoric but broader than a
              pure airframe vendor. The main substitute is still the status quo: fixed-factory production, centralized
              logistics, and specialized single-platform drone vendors. Firestorm’s dual-use story exists, especially
              around HP-enabled emergency-response adjacencies, but retained evidence still shows defense as the
              near-term center of gravity.
            claimRefs:
              - CM001
              - CM002
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM008
              - CM014
      - number: '2.2'
        title: Buyer, user, and payer alignment
        blocks:
          - type: paragraph
            body: >-
              The current buyer path is government-led. Sacra says Firestorm sells to the U.S. government and allied
              defense organizations through hardware, manufacturing infrastructure, development contracts, and
              sustainment support rather than a software subscription. That matters because the user is a
              forward-deployed operational unit, but the payer is usually a service acquisition or operations budget
              deciding whether point-of-need production changes readiness enough to justify a new procurement category.
              Public sources point to an Air Force-origin foothold, then an expansion path across Army launched effects,
              Marine expeditionary logistics, SOCOM austere manufacturing, Navy distributed maritime operations, and
              allied Indo-Pacific forces with weak local industrial depth. Flow’s customer proof reinforces that
              mobility, transportability, and time-to-output are buyer triggers, not just payload performance.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM013
              - CM014
      - number: '2.3'
        title: Evidence-backed sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public sizing is best handled as a set of proxy lenses rather than a single market estimate. The strongest
              numeric signals are a five-year $100 million Air Force IDIQ, an APFIT award of up to $30 million for
              Indo-Pacific fielding, and $153 million of disclosed funding raised to build capacity. Those figures show
              that meaningful dollars are attached to Firestorm’s category, but each lens has a different denominator:
              contract ceilings are not revenue, awards are not full theater budgets, and capital raised is not customer
              demand. Capacity claims supply a complementary operational lens: Sacra says one xCell can produce up to 50
              Group 2 UAS per month, while company and partner materials emphasize containerized deployment, off-grid
              operation, and hours-to-output. Together, the evidence supports a credible serviceable wedge around
              contested-logistics missions without proving a full TAM/SAM/SOM hierarchy.
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM010
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM009
              - CM010
              - CM013
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM009
              - CM011
      - number: '2.4'
        title: Constraints that govern adoption timing
        blocks:
          - type: paragraph
            body: >-
              Adoption timing still depends as much on procurement and qualification as on technical novelty. Beehiiv
              argues the Air Force IDIQ initially carried only minimal obligated funds, implying that the company still
              has to convert interest into fielded programs and recurring procurement. The same source also flags
              material qualification, digital-blueprint security, and acquisition friction as live obstacles, while
              company-issued sources frame APFIT and Indo-Pacific fielding as proof that the contested-logistics problem
              is budgeted now. That combination is important for valuation: investors can underwrite a differentiated
              wedge, but public evidence does not yet show broad-based budget conversion or an independent cost
              benchmark proving that Firestorm’s claimed TCO advantage reliably clears incumbent alternatives.
            claimRefs:
              - CM007
              - CM011
              - CM012
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The real market wedge is contested logistics, not generic drones
            body: >-
              Public evidence is strongest where containerized manufacturing changes readiness and sustainment economics
              for dispersed military operations, with modular UAS as the immediate payload category.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
          - type: callout
            title: Budget conversion is still less proven than buyer interest
            body: >-
              Awards, ceilings, and company financing show attention, but public sources still leave open how much of
              that interest converts into obligated dollars, recurring production, and durable procurement behavior.
            calloutType: risk
            claimRefs:
              - CM009
