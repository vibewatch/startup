        title: Exhibits
        blocks:
          - type: callout
            title: Public underwriting still rests on incomplete economics
            body: >-
              Public sources support Firestorm's strategic relevance and program momentum, but they do not verify
              valuation, revenue run rate, gross margin, customer count, cap-table terms, or a current board structure.
              External commentary also flags procurement friction and quality execution as real adoption risks.
            calloutType: risk
