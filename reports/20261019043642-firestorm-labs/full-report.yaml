      - number: '3.2'
        title: Differentiation centers on deployable manufacturing and openness
        blocks:
          - type: paragraph
            body: >-
              Firestorm's public differentiation is concentrated in manufacturing localization, modularity, and
              procurement flexibility rather than independently benchmarked flight superiority. Official materials claim
              one-fifth cost, ten-times faster build speed, open architecture, and support for third-party integrations
              or even non-Firestorm systems. Third-party and partner sources reinforce the field-deployable story by
              describing containerized production, off-grid use, fast assembly cycles, and mission reconfiguration. The
              competitive implication is that Firestorm tries to lower switching friction for defense buyers who want a
              modular drone platform plus a forward production node, but several important comparison cells remain
              unknown in public sources.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP007
              - CP013
