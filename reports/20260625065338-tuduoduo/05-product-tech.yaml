- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Tuduoduo solution
  - Measurable benefit claimed or implied
  - Visible limitation
  rows:
  - - Find verified coatings / chemical suppliers
    - Search suppliers, compare offers, negotiate manually, verify exporters separately.
    - Marketplace search, verified suppliers, procurement assistant, RFQ submission, quotation comparison.
    - Faster sourcing and lower search friction are implied by one-stop procurement positioning.
    - Supplier-verification methodology is described at a high level, not through audit templates.
  - - Execute enterprise purchase order
    - Offline contracts, bank transfers, phone/email coordination, manual status follow-up.
    - Online ordering, electronic signature, online payment, order center, merchant-side order management.
    - Workflow compression from contracting through payment and order tracking.
    - No public SLA or uptime statistics for these workflow modules.
  - - Manage cross-border shipment
    - Coordinate exporter, freight, customs, warehouse, and tax nodes across multiple providers.
    - TDD Global layers shipping, warehousing, customs/tax, insurance, and finance-related services into one trade flow.
    - Lower coordination burden and more visible handoffs across the shipment chain.
    - Public evidence does not quantify customs lead-time, on-time delivery, or claim ratios.
  - - Operate warehouse-backed fulfillment
    - Track inventory manually and rely on separate warehouse systems and paper handoffs.
    - Cloud warehouse, inventory traceability, scanning, labelling, title transfer, settlement, and inventory supervision.
    - Higher transparency, faster turnover, and less manual reconciliation are explicitly claimed.
    - Dangerous-goods licensing and site-by-site capability detail remain unproven publicly.
  - - Source custom materials for industrial users
    - Translate downstream requirements across supplier, product, and plant teams.
    - Platform uses accumulated user data and supplier coordination to co-develop custom materials with large industrial partners.
    - Potentially tighter fit to downstream performance requirements and better procurement efficiency.
    - Public case proof is partner-authored and does not disclose commercial outcomes.
  notes: This table converts product pages and official workflow descriptions into buyer jobs. Benefits are framed as claimed or implied because public sources rarely publish before/after KPI data.
