  evidenceGaps:
  - type: missing-source
    severity: material
    topic: api-and-connector-docs
    missingEvidence: Public API references, connector lists, customer ERP implementation notes, or integration architecture diagrams for Tuduoduo / TDD Global.
    whyItMatters: The platform markets cloud ERP and digital-supply-chain integration, but technical diligence cannot estimate integration effort or data-mapping risk without connector-level proof.
    diligencePath: Request API documentation, sample integration project plans, supported ERP list, and one named customer implementation walkthrough.
    relatedQuestionRefs:
    - QE025
  - type: missing-source
    severity: material
    topic: dangerous-goods-warehousing
    missingEvidence: A public dangerous-goods storage or handling license, or a clear site-specific statement that the relevant legal entity operates hazardous-chemical warehousing.
    whyItMatters: Coatings and chemical commerce often touches regulated products, and ordinary-warehousing scope that excludes dangerous chemicals changes how much fulfillment risk sits inside the platform.
    diligencePath: Obtain warehouse license packets, site list with permit types, and one hazardous-product SOP covering storage, transport, and emergency response.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: hazardous-document-workflow
    missingEvidence: Proof that Tuduoduo natively stores, versions, translates, validates, or serves SDS/TDS/COA files rather than only surfacing supplier-provided documents or claims.
    whyItMatters: Industrial-chemical buyers need document integrity and lifecycle control; without workflow proof, compliance support may be thinner than the marketing surface implies.
    diligencePath: Request screenshots or live demo of SDS/TDS/COA upload, approval, archival, and buyer-download workflows plus one hazardous-product example.
    relatedQuestionRefs:
    - QE017
    - QE025
  - type: private-evidence-only
    severity: minor
    topic: mobile-adoption-metrics
    missingEvidence: MAU/DAU, retention, order share from app or mini-program, and independent review density across iOS and Android stores.
    whyItMatters: The product clearly has mobile surfaces, but channel importance and user satisfaction cannot be judged from distribution pages alone.
    diligencePath: Request mobile KPI dashboard exports and cross-check with app-store / mini-program analytics screenshots.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: material
    topic: reliability-and-sla-history
    missingEvidence: Public status page, uptime dashboard, SLA disclosures, or incident-postmortem history for the domestic and cross-border product stack.
    whyItMatters: The platform handles contracting, payment, logistics, and compliance-sensitive workflows, so reliability evidence is part of product risk, not just IT hygiene.
    diligencePath: Request internal uptime reports, SLA commitments, incident log summaries, and one recent sev-1 postmortem covering order or logistics flow.
    relatedQuestionRefs:
    - QE022
