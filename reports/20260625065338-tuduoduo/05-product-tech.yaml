  rows:
  - - Domestic B2B mall
    - Chinese buyers and merchants
    - Live / mature
    - Lists coatings, pigments, resins, solvents and related industrial SKUs with order-center and merchant workflows.
    - Deep category coverage and workflow controls beyond a generic storefront.
    - Need GMV, active-user, and repeat-order metrics by module.
  - - SaaS transaction modules
    - Registered enterprise buyers and sellers
    - Live / mature
    - Supports online ordering, e-signature, online payment, cloud ERP, video authentication, and cloud meetings.
    - Explicit module naming suggests platform-embedded execution instead of off-platform coordination.
    - No public module-level pricing or attach-rate disclosure.
  - - TDD Global cross-border platform
    - Overseas buyers, Chinese exporters, procurement teams
    - Live / expanding
    - Extends sourcing, RFQs, ordering, shipping, customs/tax handling, warehousing, and finance-related services to international trade.
    - Combines marketplace, logistics, and service stack inside one coatings/chemicals interface.
    - Need country-level revenue, local compliance ownership, and conversion metrics.
  - - Cloud warehouse network
    - Suppliers, warehouse operators, buyers
    - Live / scaling
    - Offers inventory visibility, online leasing, settlement, e-sign, title transfer, inventory supervision, and order-fulfillment support.
    - Warehouse execution is linked to digital transaction controls rather than marketed as a standalone 3PL.
    - Need proof of licensed hazardous-goods handling and utilization by site.
  - - VR cloud factory / showroom
    - Procurement teams and suppliers
    - Live / emerging
    - Publishes virtual supplier showrooms and cloud-factory discovery pages.
    - Adds remote supplier-inspection and category education to procurement workflow.
    - No public conversion data from VR visits to transactions.
  - - Mobile app / mini-program channels
    - Buyers, sellers, logistics-follow-up users
    - Live / active
    - Supports mobile sourcing, quote requests, order checks, message handling, and logistics tracking.
    - Multilingual app and WeChat distribution reduce workflow friction for repeat usage.
    - Independent adoption and review depth remain limited.
  notes: Rows reflect modules that are explicitly visible in public product surfaces as of 2026-06-25. “Status / maturity” means publicly observable product availability, not internally measured product-market fit.
