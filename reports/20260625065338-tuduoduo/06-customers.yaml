- id: workflow-and-service-needs
  title: Procurement workflow, service needs, and repeat-purchase design
  body: 'The strongest evidence for real usage is workflow depth. Tuduoduo’s live surface exposes order management, shipping requests, funds management, online signatures, after-sales tracking, order reviews, freight queries, tender procurement, online payment, free samples, a price-index layer, and an industry-map tool. Guolian’s annual report makes that workflow more concrete by describing how prospects are brought in through app marketing, WeChat, livestreaming, auction mechanics, and promotional events; then converted into free registrations, app downloads, and direct orders. The same filing also shows the middle and back office that matter for enterprise procurement: contract review, price adjustments, shipping instructions, receipt confirmation, settlement requests, warehousing-logistics coordination, and invoicing. Importantly, management says the platform uses horizontal repeat-selling across the customer value chain and explicitly tracks repurchase and ARPU improvement, so repeat purchase is not a speculative diligence theme — it is a declared operating objective. What is still missing is the hard output: public sources do not quantify actual repeat-purchase rates, renewal cohorts, or contract duration by segment.'
