- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk or expansion vector
  - Evidence
  - Why it matters
  - Current read
  - Diligence path
  rows:
  - - Top-customer concentration disclosure exists only at parent level
    - 2024 annual report says top five customers were 11.22% of annual sales and no severe dependence was disclosed
    - Helpful but not Tuduoduo-specific
    - Moderate comfort at Guolian level; insufficient for subsidiary underwriting
    - Request Tuduoduo standalone top-10 customer schedule and revenue share
  - - Receivables increased with more approved payment terms
    - 2025 regulatory reply says more credit-qualified customers requested account terms and AR increased
    - Signals looser working-capital terms to preserve volume and stickiness
    - Manageable per company, but it raises buyer-quality questions
    - Request aging buckets, DSO by segment, and losses by credit tier
  - - Bad-debt reserves rose materially
    - 2025 regulatory reply says receivable reserves rose by RMB29.12m because balances and expected loss rates increased
    - Shows collections risk moved in the wrong direction
    - A real adverse data point, even if management says overall risk is controllable
    - Request vintage loss curves, write-off history, and policy changes
  - - Large customer-count headline is undefined
    - 2.8m / 2.9m marketing claims are not defined as active or paying accounts
    - Could overstate durable active demand if used uncritically
    - Treat as registration / ecosystem reach until management proves otherwise
    - Request monthly active enterprises, paying accounts, and transacting-account definitions
  - - Public retention metrics are absent
    - No reviewed source gives NRR, churn, or contract tenure
    - Hard to underwrite durability of repeat purchase
    - Disclosure gap remains material
    - Request customer cohorts, merchant renewals, and top-segment retention
  - - Counterparties appear cash-sensitive
    - Regulatory reply says prepayments were increased to preserve upstream and downstream stickiness and trust under pressure
    - Customer and supplier health may matter to growth quality
    - Suggests the ecosystem is supportive but liquidity-sensitive
    - Request customer credit policy, payment-term mix, and stressed-counterparty exposure
  notes: This table separates verified adverse indicators from pure disclosure gaps. The absence of Tuduoduo standalone concentration and retention metrics is itself a diligence risk, even where parent-level figures look manageable.
