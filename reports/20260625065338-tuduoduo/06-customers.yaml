  - - Named factory participants
    - Supplier-side users of VR cloud factory and digital showcasing
    - VR factory lists for coatings, carbon black, lubricants, building materials
    - Domestic factories across multiple verticals
    - Proof that the platform serves upstream manufacturers with digital-marketing surfaces
    - Public proof is showcase-style, not signed-contract disclosure
  - - Warehouse / logistics operators
    - Users and partners supporting import-export fulfillment
    - VR warehouse list and Horgos / Pakistan service pages
    - Qingdao bonded/logistics hubs plus cross-border routes
    - Important for service depth and trade execution
    - No disclosure of warehouse throughput attributable specifically to Tuduoduo
  - - Cross-border exporters / importers
    - Buyer, seller, and exhibitor prospects in overseas channels
    - UAE expo article, Pakistan summit article, English about page
