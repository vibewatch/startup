callouts:
- calloutType: insight
  title: Embedded workflow is real; retention disclosure is not
  body: 'Tuduoduo clearly operates beyond a catalog listing: ordering, contracting, payment, warehousing, after-sales, and merchant services are all visible. But the public set still does not disclose active-account counts, repeat-purchase rates, or cohort retention.'
  claimRefs:
