chapter:
  number: 6
  title: Customers
  summary: Tuduoduo’s public customer evidence is strongest on workflow depth and supplier-side participation rather than audited active-account counts. Official pages, filings, and VR showcase surfaces prove that the platform serves domestic buyers, paying merchants, factories, warehouses, and cross-border enterprise channels, with real order, payment, sample, warehousing, and post-sale tooling. But the largest scale claims — 2.8 million registered corporate members or 2.9 million domestic customers — are marketing-level figures with unclear active-account definitions, while retention, merchant renewal, and Tuduoduo-standalone concentration remain unresolved diligence gaps.
sections:
- id: segmentation-and-footprint
  title: Customer segments and geographic footprint
  body: 'Tuduoduo’s public customer story is broader than a single coatings-buying account. Official materials show at least six meaningful segment buckets: domestic industrial buyers that order through the marketplace and app; merchant or supplier customers that pay for storefront, lead-generation, and data services; named factory participants that use VR cloud-factory exposure; warehouse and logistics operators that help fulfill import-export flows; cross-border exporters and overseas-market entrants using TDD Global; and government-, park-, or embassy-linked enterprise-service counterparts that use the platform as an industrial matchmaking layer. The annual report adds that customer development is regionally organized and that cross-border staff explicitly develop overseas customer resources, which supports a genuinely multi-channel footprint rather than a static online catalog. The company’s own segmentation language also spans coatings, titanium, solvents, resins, lubricants, carbon black, packaging, medical, automotive equipment, cold chain, and building-material-adjacent supply chains, so the customer base should be read as a portfolio of vertical enterprise communities rather than one homogeneous buyer pool.'
