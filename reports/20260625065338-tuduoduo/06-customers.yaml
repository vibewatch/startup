- id: scale-claims-durability-and-risk
  title: Customer-count ambiguity, durability gaps, and credit-risk signals
  body: 'The biggest diligence trap is the very large customer-count headline. TDD Global’s English and Chinese surfaces market 2.8 million-plus registered corporate members and 2.9 million domestic customers, alongside 200-plus country coverage, 50-plus overseas warehouses, and RMB1 billion of transaction volume. Those numbers may be directionally useful as ecosystem-scale marketing, but the reviewed public record never defines them as active enterprises, paying buyers, or a Tuduoduo-standalone subset, so they should not be underwritten as equivalent to live accounts. Durability disclosure is similarly incomplete: management publicly says it pursues repurchase and cross-sell, but no public source gives NRR, GRR, churn, contract length, or segment-level cohort retention. Meanwhile, the adverse evidence is real. At Guolian level, the top five customers represented 11.22% of annual sales, which argues against extreme disclosed concentration at the parent but does not clear Tuduoduo subsidiary concentration. More importantly, accounts receivable rose sharply, and the 2025 regulatory reply says more customers requested approved payment terms while bad-debt reserves rose because online-trading receivable balances and expected losses increased. That does not prove a collections problem, but it does mean customer quality, credit policy, and active-account definitions remain unresolved diligence items.'
