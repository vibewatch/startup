  - - Supplier / merchant customers
    - User and likely payer for storefront, data, leads, VR, exhibition, and membership services
    - TDD Global membership matrix and supplier-service page
    - Cross-border flagship stores and merchant services
    - A monetized B2B service segment, not just a seller acquisition cost
