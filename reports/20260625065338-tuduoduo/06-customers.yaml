  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: active-vs-registered-customer-count
    missingEvidence: A management definition of active enterprise, paying account, and transacting account, plus a monthly bridge from registered accounts to active buyers and active merchants.
    whyItMatters: Without denominator discipline, the 2.8 million and 2.9 million marketed figures cannot be translated into conversion, retention, or revenue-quality conclusions.
    diligencePath: Request a monthly customer funnel covering registered enterprises, KYC-approved accounts, monthly active transacting accounts, paying merchant accounts, and GMV-active accounts for the last 24 months.
    relatedQuestionRefs:
    - QU017
    - QU025
    relatedTableRefs:
    - TU002
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-and-repeat-cohorts
    missingEvidence: Segmented NRR, GRR, churn, repeat-purchase rate, contract tenure, and merchant renewal data for both buyer-side and supplier-side customers.
    whyItMatters: Public sources prove that management cares about repurchase and after-sales support, but they do not show whether those motions produce durable revenue or just episodic trading volume.
    diligencePath: Request buyer and merchant cohort tables by vintage, segment, geography, and product family, plus renewal terms and attach rates for paid merchant services.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: tuduoduo-standalone-concentration-and-credit
    missingEvidence: Top-10 customer concentration, top-10 merchant concentration, DSO by segment, aging buckets, credit policy, write-offs, and loss history for Tuduoduo standalone rather than Guolian consolidated results.
    whyItMatters: Parent-level concentration can look acceptable while a subsidiary’s real exposure is much tighter. The rise in receivables and bad-debt reserves makes standalone customer-quality data essential.
    diligencePath: Request Tuduoduo monthly AR aging, credit-tier mix, top-customer schedules, bad-debt history, and policy exceptions for the last eight quarters.
    relatedQuestionRefs:
    - QU022
    - QU023
    - QU024
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: government-procurement-proof
    missingEvidence: Direct government procurement award pages or tender results that show public-sector entities buying through or from Tuduoduo rather than only cooperating at platform level.
    whyItMatters: The chapter can prove government-affiliated channel support and embassy engagement, but not a clear public-sector purchase case on the open web.
    diligencePath: Search central and provincial procurement portals and request a government-case reference pack from management if public tender data exists behind login or offline channels.
    relatedQuestionRefs:
    - QU019
    - QU025
    relatedTableRefs:
    - TU001
    - TU003
