  - CU045
- calloutType: risk
  title: Treat the multi-million customer headline as a marketing ceiling, not a diligence-ready active-account metric
  body: The 2.8 million and 2.9 million numbers are large enough to distort underwriting if read literally. None of the reviewed filings or app-store pages defines them as active enterprises, paying customers, or standalone Tuduoduo accounts.
