companyProfile:
  summary: "Tuduoduo (涂多多 / Toodudu) is the coatings-and-chemicals marketplace arm of Guolian Co., Ltd. (603613.SH), operating through 北京涂多多电子商务股份有限公司 from Beijing. Founded on 2014-12-18, it has evolved from a coatings-focused industrial e-commerce site into a heavier-service procurement stack spanning domestic B2B trading, cross-border sourcing, warehousing, logistics, payments, and digital factory tooling. Public parent filings make Tuduoduo look more like a scaled industrial intermediary than a venture-stage startup: audited 2024 revenue reached RMB25.52 billion and audited net profit reached RMB1.07 billion. Even so, active-customer definitions, take rate, gross margin, and entity-level compliance detail remain materially under-disclosed."
  foundedDate: "2014-12-18"
  founders:
    - name: "Liu Junzhai"
      role: "Founder, CEO, legal representative, and director"
      background: "Longtime Guolian executive who also appears in public filings as Tuduoduo's founder and key control person across management and ownership layers."
      claimRefs: [CO010, CO011, CO016, CO019]
  foundingLocation: "Beijing, China"
  headquarters: "Beijing, China"
  productSummary: "B2B marketplace and supply-chain platform for paints, coatings, adhesives, related chemicals, and cross-border industrial procurement, with supporting warehousing, logistics, digital trade, and supplier/buyer workflow services."
  customerFocus: "Chinese industrial buyers and suppliers in coatings, chemicals, construction, manufacturing, and export-oriented trade, plus related distributors and channel partners."
  businessModel: "Transaction-led industrial intermediation inside Guolian's online commodity-trading model, supplemented by service layers such as warehousing, logistics coordination, digital trade workflows, and related enterprise services."
  stage: "growth"
  fundingStatus: "Private but parent-disclosed: a January 2024 round was reported at RMB50 million, and Guolian's 2025-12-30 B1 filing set Tuduoduo at RMB15.8 billion pre-money, with RMB70 million first-close capital and up to RMB365 million planned in total."
  disclosureProfile: "private-disclosed"
  claimRefs: [CO001, CO002, CO003, CO018, CO020, CO021, CO022, CO041, CI012, CI013, CU033]
