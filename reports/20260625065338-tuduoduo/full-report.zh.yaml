      - number: '1.3'
        title: 资本结构、母公司关系与已披露规模
        blocks:
          - type: paragraph
            body: >-
              最清晰的股权结构证据来自 Guolian 2025-12-30 关于 Tuduoduo B1 轮融资的公告。首期交割后，Guolian 仍持有 75.5902%，创始人 Liu Junzhai 持有
              11.2468%，员工 / 管理层 LP 持有 7.1505%；即便外部资本进入结构，子公司仍牢牢受上市母公司控制。同一公告以及 Tencent / Sina 的一致报道支持计划募资最高 RMB 365
              million，投前估值 RMB 15.8 billion，首期 RMB 70 million 立即交割。Tencent 2024 年 1 月报道给出更早的公开估值锚点：一轮 RMB 50 million
              战略融资，投前估值 RMB 14.129 billion。尽调中有一个细节需要留意：Guolian 自己的文件称 2025 年融资为 B1 轮，QCC 的融资页面却把同一笔 RMB 70 million 事件标为
              B 轮，因此轮次名称不能直接当作干净的历史事实。经营规模上，证据最扎实的指标是 2024 年收入 RMB 25.52 billion、净利润 RMB 1.07 billion，以及 2025 年前三季度收入
              RMB 22.13 billion、净利润 RMB 871 million。没有已审阅公开来源给出客户数量、2026 年收入 run-rate，或全部计划募资完成后的完全摊薄股权结构。
