      - number: '2.4'
        title: 约束、相互矛盾的估算与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              监管、物流、切换成本和终端市场疲弱仍约束采用逻辑。2026
              年中国通过完整的危险化学品安全法，覆盖生产、储存、经营、运输和应急响应，危险化学品合规因此变得更严。想把高风险流转数字化的市场平台，门槛随之抬高；没有合规仓储、运输、检验和单证，单纯数字撮合不够。信任和营运资本也是真摩擦。TDD-global
              强调已验证供应商和贸易保障，Guolian 公告则称自营采购常常需要大额预付款来锁定供应并维持上下游信任。终端需求不均衡：与中国住宅新开工挂钩的涂料市场仍弱，重涂是主要抵消项，ICIS
              仍显示深重的住房库存压力。最后，公开数据不允许外部人干净拆出 Tuduoduo 仅涂料口径的 SAM 或 SOM。平台整体交易主张可见，但分部
              GMV、抽佣率、活跃买方数量和仅涂料复购情况不可见。这就是达到估值级市场测算前的核心尽调缺口。
