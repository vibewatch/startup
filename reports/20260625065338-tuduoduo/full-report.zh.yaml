  - id: TI001
    title: 收入来源表
    columns:
      - 来源
      - 机制
      - 公开证据
      - 当前状态
      - 收入质量判断
      - 尽调问题
    rows:
      - - 自营工业品电商
        - 平台采购或组织供应，并通过自有商城销售工业品。
        - 官方页面和问询回复描述了自营交易以及采购 / 履约流程。
        - 明确活跃，经济上仍处于核心位置。
        - 对规模有高信心；按品类拆分的贡献利润率信心较低。
        - 要求提供按产品族划分的毛利率、库存周转和坏账历史。
      - - 撮合型电商
        - 在开放平台上做商家入驻、挂牌、竞拍和交易撮合。
        - 官方页面描述了商家旗舰店、挂牌系统和竞拍功能。
        - 明确活跃。
        - 相比自营贸易大概率更轻资本，但变现抽佣率未披露。
        - 要求提供佣金率、挂牌费和撮合交易量占比。
      - - 跨境电商
        - 跨境营销、采购、交易、物流、仓储、报关及相关服务。
        - TDD-global 和官方新闻页面描述了一站式跨境供应链服务。
        - 在增长，但未单独披露独立收入。
        - 服务占比可能更高，但仍绑定贸易流和物流执行。
        - 要求提供跨境收入、毛利和营运资本强度。
      - - SaaS 与工作流工具
        - 在线下单、电子签章、在线支付、云 ERP、视频认证和云会议。
        - 官方关于页面点名了具体模块。
        - 作为增值服务处于活跃状态。
        - 战略上有吸引力，但公开来源没有量化收费收入。
        - 要求提供独立 SaaS ARR 或服务费收入及留存。
      - - 数字供应链 / 仓储服务
        - 智慧物流、数字仓储、货权转移、库存监管和云仓服务。
        - 年报和霍尔果斯云仓页面描述了这些服务。
        - 明确活跃，并在扩张。
        - 提升粘性，但若绑定库存监管，仍可能消耗资本。
        - 要求提供费率表、利用率和损失率。
      - - 产业数字化 / 大数据服务
        - 数据、数字化、云工厂和行业专属决策支持。
        - 官方页面把产业数字化服务和大数据服务定位为核心业务主体。
        - 活跃，但财务不透明。
        - 如果具备经常性，可支撑更高质量收入，但披露不足。
        - 要求提供数字服务收入结构、实施成本和续约率。
    notes: 截至 2026-06-25，公开资料只能部分枚举 Tuduoduo 的变现入口；官方来源描述了机制，但没有披露各条线的收入结构或实际变现。
