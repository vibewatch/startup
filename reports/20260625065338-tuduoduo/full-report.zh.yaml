          - type: paragraph
            body: >-
              财务和运营风险主要卡在干净软件毛利模型之外的系统与交易对手上。公开申报显示，线上商品交易仍贡献 99.65%
              的收入，公司可以向供应商预付款，也可以自主把客户匹配给供应商；当控制权证据不足时，无实物流转交易可能需要按净额法处理。 2025 年 6 月回复还披露了很大的预付款和上升的应收账款准备，B1
              融资又加入了明确的回购义务——如果国联无法设计出后续流动性路径，就会触发。 因此，Tuduoduo 面临的不只是需求走弱，还有现金转化质量、信用损失、合作方履约、母公司治理摩擦。仓储和航运页面进一步说明，
              这是一套围绕港口、海关、库存追踪和伙伴协同搭起来的重执行模型；ESG 报告也显示，数据完整性和算法治理必须跟着运营版图一起扩张。
