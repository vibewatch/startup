      - number: '6.4'
        title: 客户数量歧义、耐久性缺口与信用风险信号
        blocks:
          - type: paragraph
            body: >-
              最大尽调陷阱是非常大的客户数量标题。TDD Global 中英文界面营销 2.8 million-plus 注册企业会员和 2.9 million 国内客户，同时还有 200-plus 国家覆盖、50-plus
              海外仓和 RMB1 billion 交易额。这些数字作为生态规模营销可能有方向性价值，但已审阅公开记录从未把它们定义为活跃企业、付费买方或 Tuduoduo
              独立子集，因此不能把它们按真实账户等价承销。耐久性披露同样不完整：管理层公开称追求复购和交叉销售，但没有公开来源给出 NRR、GRR、流失率、合同期限或分层 cohort 留存。同时，负面证据真实存在。在
              Guolian 层面，前五大客户占年度销售额 11.22%，这反驳了母公司层面披露的极端集中度，但不能消除 Tuduoduo 子公司的集中度问题。更重要的是，应收账款大幅上升；2025
              年监管回复称，更多客户申请获批账期，同时坏账准备上升，因为线上交易应收余额和预期损失增加。这不能证明存在回款问题，但确实意味着客户质量、信用政策和活跃账户定义仍是未解尽调项。
