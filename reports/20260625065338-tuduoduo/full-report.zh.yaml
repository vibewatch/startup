        title: 市场界面与交易工作流
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo
              的公开产品足迹比简单目录网站更宽。国内市场界面展示了订单中心、用户和商户中心、在线支付、在线电子签章、企业认证、账户安全控制，以及帮助中心结构，逐步覆盖买方的合同签署、订单支付、发货请求、开票和商户侧订单管理。公司自己的介绍材料更进一步，定义了四个商业界面：自营电商、第三方
              / 市场电商、跨境电商和 SaaS 服务。同一组材料还明确点名在线下单、电子签章、在线支付、云 ERP、视频认证和云会议等工作流模块。实际含义是，Tuduoduo
              围绕化工和涂料采购销售的是一套交易操作系统，而不仅是流量或销售线索。移动层也支持这一判断：主站宣传 iPhone、Android 和微信小程序渠道，TDD Global app 页面则突出移动产品搜索、RFQ
              提交、报价比较、订单状态查询和物流追踪。因此，产品命题是工作流压缩：把寻源、签约、支付、履约和复购搬进一个垂直专业化的工业界面。
