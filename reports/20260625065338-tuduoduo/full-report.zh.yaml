  - id: TP003
    title: 定价 / 包装和商业模式对比
    columns:
      - 平台 / 渠道
      - 公开价格或套餐
      - 商业模式
      - 包含能力
      - 折扣 / 未知项
      - 含义
    rows:
      - - Tuduoduo / TDD Global 平台
        - 大多先报价；未找到公开买方费用表
        - 自营采购、撮合、跨境和 SaaS 工作流的混合模式
        - 供应商撮合、贸易保障、LC、物流、仓储、海关 / 税务支持
        - 真实抽佣率、买方费用和返利公开未知
        - 可以捆绑服务价值，但价格透明度弱于横向市场
      - - Alibaba 1688
        - 公开可见工厂直供标价和灵活 MOQ 信号
        - 面向国内批发采购的开放市场
        - 商品列表、评分、聊天、样品、国内履约、兼容代理的工作流
        - 国际到岸成本和代理费用因买方差异很大
        - 对标准化投入品的快速价格发现最强
      - - Made-in-China
        - 公开商品列表叠加 RFQ / 易寻源报价流
        - 出口导向开放市场
        - 已验证供应商、安全支付、RFQ、物流支持、样品请求
        - 保留来源未公开供应商高级套餐定价
        - 可作为出口就绪寻源的有用基准，即便买家随后转线下谈判
      - - ChemNet
        - 免费会员加入；付费 Gold Supplier 曝光层级；买方定价大多基于报价
        - 化学品贸易线索、目录和推广生态
        - 贸易线索、提醒、目录曝光、供应商展厅、市场 / 新闻 / 数据工具
        - 保留来源未公布 Gold Supplier 价格
        - 商业模式看起来更接近线索生成 + 数据，而非自营采购
      - - Molbase
        - 市场材料中有部分目录定价公开，但企业服务大多需报价
        - 带金融支持的数字目录和寻源平台
        - 大目录、交易平台、金融服务、一站式解决方案
        - 涂料专属仓储 / 服务定价公开未知
        - 与发现和寻源相关，但完整工作流经济性更难对标
      - - 线下专业经销商
        - 协商账户定价；通常没有公开价目表
        - 关系型销售，技术和仓储服务捆绑进账户经济性
        - 打样、配方帮助、本地库存、客户管理、监管支持
        - 利润结构、返利和信用条款为私有信息
        - 在服务强度比标价更重要的场景，更难被低价击穿
    notes: 本表只比较面向公众的包装和商业信号。不推断返利、融资、运费、质量声明或协商经销条款之后的真实定价。
