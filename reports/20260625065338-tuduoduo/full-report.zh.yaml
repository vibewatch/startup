      - number: '8.4'
        title: 什么会改变判断，什么会打破判断
        blocks:
          - type: paragraph
            body: >-
              剩余工作在概念上很直接，即便政治上可能很难。最重要的缺失证据不是另一篇叙事文章，而是可审计的运营细节。投资者需要 2025 财年经审计的子公司报表、 完整交割后股权结构表，以及真实
              GMV、take-rate、毛利率和客户集中度数据，才能判断平台是否配得上焦点科技式的软件交易平台信用， 还是应继续锚定分销商式倍数。同一逻辑也界定了 thesis-break
              触发器。后续估值持平或下调、母公司再出治理冲击，或利润又一年无法转成现金， 都会支持把业务重新定价到熊市情形。反过来，干净审计、轮次完成和更好的单位经济披露，即便进入价格不低，也可能上调建议。在这些证据出现前，
              审慎做法是把公司留在观察名单，而不是用不完整的公开披露硬凑 conviction。当私人估值标记已经跑赢对公开母公司的简单直觉时，这种纪律尤其重要。
