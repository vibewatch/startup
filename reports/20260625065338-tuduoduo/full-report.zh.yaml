      - number: '5.2'
        title: 架构、履约与 TDD Global 运营栈
        blocks:
          - type: paragraph
            body: >-
              官方公告和产品页面一贯把 Tuduoduo 描述为分层数字供应链系统。Guolian 年报称，多多平台在多个产业链上提供云 ERP、电子合同、在线支付、智能物流、数字工厂、工业互联网和数字仓能力；2025
              年回复称，集团仍在数字供应链、数字云工厂、工业互联网、工业大数据、中心仓、前置仓和云仓上迭代。TDD Global
              是这套架构最清晰的产品化国际前台。其公开页面描述的工作流从询价和供应商匹配开始，随后进入下单、仓库执行、运输、海关和税务处理、保险以及融资相关服务。首页和供应商服务页面营销跨海关、税务、智能物流、云仓和金融的数据共享与流程整合；仓库页面增加库存可追溯、扫描、贴标、订单履约和质量控制操作；货运层增加多报价比较、货运追踪和商业资质上传。VR
              云工厂层和定制材料案例显示，公司试图在一个栈里同时拥有供应商发现、技术选择和履约编排，而不是停留在被动市场平台。
