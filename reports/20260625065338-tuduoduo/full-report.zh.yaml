      - number: '3.4'
        title: 护城河耐久性与负面证据
        blocks:
          - type: paragraph
            body: >-
              负面证据足以让它不成为一个干净的护城河故事。Coatings World 和 China Coatings 都描述了一个增长放缓、价格下行、格局分散、受疲弱建筑需求压制的中国涂料市场。Ibuychem
              更进一步，称内部竞争激烈、价格战严重到中国涂料公司越来越把海外扩张视为必需，而非奢侈选项。ICIS 又叠加宏观压力：北京进入 2026
              年仍在试图稳定深度房地产危机，这对建筑相关涂料需求不利。这些条件重要，因为它们把议价权推向买方和低成本渠道，而 Tuduoduo 面对的正是
              1688、Made-in-China、ChemNet、本地贸易商和专业分销商。公开公告给出第二个负面信号：Guolian
              仍在处理交易单证、总额与净额确认方面的交易所关注；公司同时主张数字仓储和智能物流能创造粘性，信任却可能被稀释。净结果是：Tuduoduo
              的护城河看起来由服务牵引，而非结构性排他。它在重复、工作流重的采购中可以耐久；在可标准化 SKU、疲弱终端市场或已被分销商控制的技术型客户中则显得脆弱。
