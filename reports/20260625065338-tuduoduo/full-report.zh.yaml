      - number: '7.3'
        title: 竞争与终端市场周期性
        blocks:
          - type: paragraph
            body: >-
              即便 Tuduoduo 内部执行良好，公开证据也指向艰难的外部市场。在标准化工业投入品上，1688 仍为工厂直供价格透明度和密集供应商选择设定基准；Made-in-China、ChemNet 和 Molbase
              则为买方提供替代报价、目录和供应商发现路径。Brenntag、Azelis、DKSH
              等线下分销商的竞争方式不同：本地库存、实验室和技术支持比最低报价更重要时，它们会赢。在正常市场，这已足以压低抽佣率和毛利差。但市场并不正常。Coatings World 和 ICIS
              都描述了一个受地产疲弱、工业需求走软、格局分散、产能过剩和出口竞争影响的中国环境。ChinaCoatings 还补充称，2025 年产量、收入和单价均下滑；出口缓冲不均衡，投入成本仍容易受到能源和贸易冲击。
