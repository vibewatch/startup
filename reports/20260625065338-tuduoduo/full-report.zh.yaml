      - number: '8.2'
        title: 收入和利润倍数相对可比公司
        blocks:
          - type: paragraph
            body: >-
              按可支撑数字看，Tuduoduo 不是高风险登月项目，但也不是明显便宜货。使用经审计的 2024 年子公司业绩，披露的 B1 投前估值约等于 0.62x 收入和 14.8x 利润；使用 2025
              年前三季度年化数据，估值降到约 0.54x 收入和 13.6x 利润。公司高于国联公开市场的 0.26x 收入和 9.6x 利润，也高于 DKSH 的收入倍数，并在收入型倍数上大致贴近 Brenntag 和
              Azelis。它仍远低于焦点科技和 Grainger， 但后两者披露更好、资产更轻或分销溢价更清晰，公开市场信任也更强。因此，最接近的方向性解读不是「Tuduoduo 被严重高估」，
              而是「尽管透明度差得多，这一轮已经把它定在重服务工业中介中偏贵的一端」。这和简单贴上独角兽标签得出的投资结论完全不同。
