            title: 危险化学品合规是近期最二元的风险
            body: 中国 2026 年法律扩大合规边界时，Tuduoduo 仍在推广仓储、跨境贸易和托管执行。拿不到实体层面的许可、登记和 SDS 证明， 就不能把公司按低摩擦数字中介来承销。
