  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局概览：直接、相邻和现状竞争者
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo（涂多多 / Toodudu）没有一个显而易见、完全同型的线上对手；它实际面对三类解决重叠采购任务的竞争者。第一类是 1688 和 Made-in-China
              领衔的宽口径横向市场，它们靠公开商品、报价、MOQ 筛选和庞大供应商池降低搜索成本。第二类是 ChemNet、Molbase 等化工垂直数字平台，它们比 1688
              更垂直，但仍更偏发现、贸易线索、媒体、目录深度和金融工具，而不是 Tuduoduo 的自营涂料工作流。第三类是 DKSH、Brenntag、Azelis
              等线下与混合型专业分销商；买方需要库存确定性、配方帮助、监管支持或客户经理服务，而不只是更低挂牌价时，它们会赢。公开公告和 Tuduoduo
              自有页面显示，公司试图站在这些集群之间，把自营采购与撮合、SaaS、跨境、仓储、物流和结算配在一起。这个定位真实存在，但也意味着，一旦涂料投入品呈现标准化大宗品属性、买方能并行比价多个渠道，Tuduoduo
              的暴露度最高。
