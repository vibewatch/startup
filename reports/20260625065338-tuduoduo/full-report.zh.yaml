  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 视角
      - 公开支持的论点
      - 证据
      - 什么会改变判断
    rows:
      - - 投资论点
        - Tuduoduo 规模已经很大，且经审计盈利，因此不是没有盈利基础的故事股。
        - 2024 年经审计收入人民币 255.2 亿元、净利润人民币 10.7 亿元；2025-Q3 收入人民币 221.3 亿元、净利润人民币 8.71 亿元。
        - 如果经审计 FY2025 显示利润率大幅反转，或出现严重非现金质量问题。
      - - 投资论点
        - 对照全球工业分销收入倍数，B1 轮价格并不极端。
        - 隐含 0.54x-0.62x 收入倍数，接近 Brenntag 和 Azelis。
        - 如果业务组合被证明更偏贸易、质量明显低于可比公司组。
      - - 反论点
        - 轮次价格高于母公司和公开市场愿意为 Guolian 或 DKSH 式工业中介支付的价格。
        - Guolian 交易价格约为 0.26x 收入、9.6x 利润；DKSH 约为 0.36x 收入。
        - 如果公开市场显著上调中国工业互联网公司的估值。
      - - 反论点
        - 即使平台已经盈利，母公司的治理和会计阴影仍可能压住子公司的估值倍数。
        - CSRC 调查、披露批评和收入确认更正仍是公开层面的压力。
        - 除非母公司彻底厘清调查并重建披露可信度。
      - - 反论点
        - 独角兽身份证明的是能见度，不是价格支撑。
        - 2026 年独角兽文章确认了身份，但没有新增定价轮或现金交割证据。
        - 如果后续定价轮或老股交易被公开披露。
      - - 反论点
        - 化工需求疲弱、产能过剩，若没有清晰的平台经济性，溢价定价很难守住。
        - C&EN 和 ICIS 都描述了供应过剩、价格压力和 2026 年中国需求疲弱。
        - 如果涂多多在周期压力下仍证明定价权、留存和现金转化。
    notes: 各行拆开呈现最强正反观点，而不是硬揉成单一叙事；反论点刻意以证据为先。
