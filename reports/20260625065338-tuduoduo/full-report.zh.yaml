      - number: '1.4'
        title: 里程碑、合作关系与负面背景
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo 的公开里程碑同时显示延续性和演进。2014 年成立奠定核心实体；2017 年管理层 LP 显示内部持股较早正规化；2020 年一篇集团文章已把 Liu
              描述为平台的公开战略人物。资本市场层面，公开记录随后出现 2024 年 1 月投前 RMB 14.129 billion 的战略融资，以及 2025 年 12 月投前 RMB 15.8 billion 的 B1
              轮。经营演进上，官方页面和合作文章显示，平台正从单纯挂牌转向数字供应链、云工厂、跨境和合作开发产品工作流：Sinopec / Zhong'an 定制聚丙烯案例就是数据驱动的供应链协作，而非简单转售。2026
              年巴基斯坦相关文章进一步推进这一点，记录了巴基斯坦数字经济总部的计划和揭牌。独角兽证据可以支撑，但措辞要谨慎：母公司网站称 Tuduoduo 入选 2026 中国独角兽企业榜，QCC 另行记录了 2025 年
              Hurun 风格的独角兽认定。负面图景主要落在母公司层面：Guolian 在 2026 年仍因早期会计更正处于未结的 CSRC 调查中，投资者索赔文章也让诉讼风险继续存在，即便没有已审阅公开来源显示
              Tuduoduo 本身是重大独立处罚或诉讼的直接对象。
