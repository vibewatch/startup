  - id: TV005
    title: 论点失效与放弃触发表
    columns:
      - 触发项
      - 阈值或事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 下轮信号
        - 2026-2027 年任何融资价格等于或低于首批交割隐含的投后估值。
        - 说明 B1 轮标题价格不稳固，并会把私募市场定价预期下调。
        - 从 research-more 下调至 avoid，直到新证据消化重定价。
      - - 治理冲击
        - 国联新增 CSRC 处罚、交易所批评，或又一次大额收入确认更正。
        - 会让子公司承受更大的控股公司和治理折价。
        - 下调公允区间，并要求硬性下行保护，否则放弃。
      - - 现金转化不及预期
        - FY2025 或 FY2026 经营现金流再次显著落后于报告利润。
        - 会强化「交易规模掩盖经济性偏弱」的判断。
        - 只采用悲观情景低端倍数。
      - - 周期恶化
        - 化工需求进一步转弱，价格下行延续到 2027 年。
        - 会同时压缩收入质量和公开可比公司倍数。
        - 将收入倍数锚点下修至国联或 DKSH 水平。
      - - 披露失败
        - 管理层在尽调中拒绝提供 GMV、抽佣率、毛利率或股权结构明细。
        - 核心承销问题会继续没有答案。
        - 不推进到 research-more 之外。
    notes: 触发项聚焦投后可监测的可观察事件，而不是笼统的管理层质量担忧。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
      - CV047
      - CV050
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - FY2025 审计
        - 涂多多 2025 全年经审计利润表、现金流量表和资产负债表。
        - December 2025 这一轮按一个公开记录中尚未完整审计的期间定价。
        - 管理层 CFO 材料包；审计师安慰沟通。
      - - 单位经济性
        - 按交易模式拆分的 GMV、抽佣率、毛利率、客户留存和分群盈利能力。
        - 这些输入决定可比对象应更偏焦点科技，还是更偏低倍数分销商。
        - 产品财务，以及 NDA 下的数据室上传。
      - - 股权结构和权利
        - 交割后完整股东名册、清算优先权、反稀释和回购条款。
        - 如果下行权利很强，标题估值可能夸大真实经济性。
        - 对已签署 B1 协议做法律尽调。
      - - 轮次完成情况
        - 原计划 B1 轮剩余 RMB 295m 是否完成交割的证据。
        - 如果实际只到账首批 RMB 70m，投后估值计算会改变。
        - 公司秘书更新，以及最新工商档案。
      - - 现金转化
        - 2024-2026 年月度营运资本桥、预付款账龄，以及坏账 / 存货损失历史。
        - 一个盈利但吃现金的模式，不应享有高溢价市场平台倍数。
        - 财务尽调请求和资金管理访谈。
    notes: 每项尽调问题都指向投资决策变化，而不是满足好奇心。清单优先列出会移动估值的文件。
    claimRefs:
      - CV044
      - CV049
      - CV050
