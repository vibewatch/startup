      - - 国联股份（603613）
        - 2024 年收入 / 净利润
        - ~RMB 13.94bn 市值 = 0.26x 收入 / 9.6x 盈利
        - 最接近的上市母公司穿透视角和治理基准。
        - 控股公司折价和非涂多多业务削弱直接可比性。
      - - 焦点科技（002315）
        - 2025 年收入 / 净利润
        - ~RMB 9.86bn 市值 = 5.15x 收入 / 19.6x 盈利
        - 中国 B2B 市场平台同行，披露利润率和市场平台经济性。
        - 比涂多多轻资产得多，也更像软件公司。
      - - Brenntag
        - 2025 年收入 / 税前利润
        - $8.89bn 市值 = 0.51x 收入 / 16.2x 税前盈利
        - 全球工业品分销可比公司，带营运资本敞口。
        - 不是纯数字市场平台；盈利代理指标是税前利润。
      - - Azelis
        - 2025 年收入 / 税前利润
        - $2.7bn 市值 = 0.56x 收入 / 13.5x 税前盈利
        - 处在艰难市场里的特种分销可比公司。
        - 特种业务占比更高，盈利口径是税前利润而非净利润。
      - - DKSH
        - 2025 年收入 / EBIT
        - $5.01bn 市值 = 0.36x 收入 / 12.5x EBIT
        - 亚洲权重较高的分销商，兼具服务和贸易属性。
        - 业务组合更像综合集团，盈利代理指标是 EBIT。
      - - Grainger
        - 2025 年收入 / 税前利润
        - $63.38bn 市值 = 3.53x 收入 / 25.3x 税前盈利
        - 一流上市分销商，展示优质工业执行力的估值天花板。
        - 过于成熟、服务含量过高、也过度偏向美国，不能作为基准情景可比。
    notes: 列举并不完整，只覆盖最能支持决策、且能直接抓取 2026 年估值页面的公开可比公司。各来源盈利口径不同，因此只能做方向性比较，不能完全逐项对齐。
