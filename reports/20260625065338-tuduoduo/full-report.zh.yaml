    rows:
      - - Tuduoduo / TDD Global 平台
        - 公司基线
        - Guolian 旗下；申报文件显示涂料链 2023 年交易额 RMB 470.05bn；宣称 50+ 个海外仓
        - 中国涂料、钛、溶剂、树脂；跨境工业采购
        - 自营 + 撮合 + SaaS + 跨境物流 / 仓储 / 结算的混合模式
        - 公开定价和真实抽佣率大多未披露
      - - Alibaba 1688
        - 横向 B2B 市场
        - Alibaba 生态；数百万商品；国内批发覆盖广
        - 标准化工业投入品、SME、贸易商、转售商
        - 工厂直供定价、灵活 MOQ、密集供应商池、国内交易速度
        - 跨境、合规和技术服务工作流通常需要代理或额外尽调
      - - Made-in-China
        - 出口导向横向 B2B 市场
        - 30+ 年；服务 200+ 个国家；6,000+ 个品类
        - 寻找已验证中国供应商的国际买家
        - 已验证供应商、RFQ 流程、安全支付、面向出口的物流姿态
        - 比 Tuduoduo 更宽泛，也更少贴合涂料工作流
      - - ChemNet
        - 垂直化工市场 / 媒体 / 线索生成平台
        - 1997 年起运营；宣称日访问量 >1m；Gold Supplier 层级
        - 需要曝光、线索和市场数据的化学品供应商与买家
        - 化工垂直流量、贸易线索、数据和供应商营销工具
        - 公开证据更多支持媒体 / 营销能力，而非自营采购深度
      - - Molbase
        - 数字化学品目录和市场
        - '>9m 个产品；130k+ 客户；金融服务'
        - 需要广目录搜索和寻源支持的化学品买家
        - 大型产品目录叠加供应链金融
        - 本组公开证据对涂料专属物流和技术服务深度支撑较弱
      - - DKSH / Brenntag / Azelis
        - 线下 / 混合专业经销商
        - 在中国拥有仓库、实验室和客户覆盖的大型全球经销商
        - CASE、特种化学品、高性能涂料、受监管账户
        - 技术服务、配方支持、本地库存、关系型销售
        - 公开定价不够透明；简单大宗商品发现可能更慢或成本更高
    notes: 仅列代表性的直接和相邻竞争对手；各行强调中国相关的、最可见的涂料和工业化学品采购替代方案。规模字段在私有 GMV 或收入未披露时使用公开代理指标。
