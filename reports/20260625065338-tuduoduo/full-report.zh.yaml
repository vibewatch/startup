  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险栈与排序
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo
              不是简单的分类信息市场；自有页面描述的业务组合包括自营采购、撮合、跨境贸易、SaaS、供应商验证、仓储、物流和海关联动执行。这种服务深度确实能缓解纯搜索商品化，因为它能解决比挂牌板更难的工业工作流。但同样的宽度也扩大了公司的法律和运营边界。一个触及溶剂、钛白粉、颜料、仓储、运输和支付流的平台，会暴露在危险化学品合规、合作伙伴执行和营运资本风险中，程度不是轻量数字中介可比。因此，公开记录支持高残余风险评级，而不是关键风险评级：Tuduoduo
              已经规模大且盈利，但最强风险仍具有二元性且可外部监测，尤其集中在合规、治理和现金转化质量上。
