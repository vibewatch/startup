  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值证据，以及它真正能支撑到哪里
        blocks:
          - type: paragraph
            body: >-
              最强的公开估值证据，比许多标题摘要暗示的要窄。2025 年 12 月 B1 申报，加上新浪和腾讯口径一致的报道，只能支撑一个清晰表述： Tuduoduo 按人民币 158
              亿元投前估值对外推介，首日确定完成的只有人民币 7000 万元，计划总额最高人民币 3.65 亿元。 按这组数字，首关后的投后估值约为人民币 158.7 亿元；只有在计划募资全额完成时，才约为人民币 161.65
              亿元。 这个区别很重要，因为面向用户的独角兽简写——约 $2.3B 或人民币 165 亿元——方向上接近，但本文审阅的一手文件并不能直接证明。 2026 年独角兽榜单文章强化了 Tuduoduo
              属于独角兽类别的判断，但没有增加一笔新的定价交易。换句话说，独角兽身份可以支撑； 干净的人民币 165 亿元融资标记不能支撑。
