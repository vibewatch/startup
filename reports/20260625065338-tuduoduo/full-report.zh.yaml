        blocks:
          - type: paragraph
            body: >-
              最重要的财务警示是，Tuduoduo 的模式看起来能盈利，但吃营运资本。2025 年会计回复公告称，自营业务预测需求、向供应商采购，并可能用预付款要求供应商为后续客户订单备货。这与 Tuduoduo 经审计的
              2024 年经营性现金流出 RMB354 million 相吻合，尽管当年净利润为 RMB1.07 billion；这也较 2023 年正经营现金流出现急剧逆转。母公司层面的监管回复强化了同一模式：集团 2024
              年预付款达到 RMB7.69 billion，预付款减值大幅上升，说明供应商垫款和交付风险对更广的交易模式具有财务重要性。股权支持可见。Tuduoduo 在 2023 年 A 轮以 RMB13.0 billion
              投前估值融资 RMB306 million，随后在 2025 年启动 B1 轮，以 RMB15.8 billion 投前估值，最高 RMB365 million
              新资本拟用于优化资产负债表、营运资金、数字供应链和云工厂。但这些轮次也带有或有回购义务，因此并不是无摩擦资本。
