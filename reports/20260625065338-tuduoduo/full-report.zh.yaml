      - number: '6.2'
        title: 采购工作流、服务需求与复购设计
        blocks:
          - type: paragraph
            body: >-
              真实使用的最强证据是工作流深度。Tuduoduo 线上界面展示了订单管理、发货请求、资金管理、在线签章、售后追踪、订单评价、运费查询、招标采购、在线支付、免费样品、价格指数层和行业地图工具。Guolian
              年报把这套工作流讲得更具体：通过 app
              营销、WeChat、直播、拍卖机制和促销活动导入潜在客户，再转化为免费注册、app下载和直接订单。同一公告还显示了企业采购真正需要的中后台：合同审核、价格调整、发货指令、收货确认、结算请求、仓储物流协调和开票。重要的是，管理层称平台沿客户价值链横向复卖，并明确跟踪复购和
              ARPU 提升，因此复购不是投机性尽调主题，而是已声明的经营目标。仍缺的是硬结果：公开来源没有量化实际复购率、续约 cohort 或各分层合同期限。
