companyProfile:
  summary: >-
    Tuduoduo（涂多多 / Toodudu）是 Guolian Co., Ltd.（603613.SH）旗下的涂料与化工品市场平台，运营主体为位于北京的北京涂多多电子商务股份有限公司。公司成立于
    2014-12-18，早期聚焦涂料工业电商，如今已演进为更重服务的采购栈，覆盖国内 B2B 交易、跨境采购、仓储、物流、支付和数字工厂工具。母公司公开公告让 Tuduoduo
    看起来更像已规模化的工业中介，而不是风险投资阶段的创业公司：经审计的 2024 年收入达到 RMB25.52 billion，净利润达到 RMB1.07
    billion。即便如此，活跃客户定义、抽佣率、毛利率和实体层面合规细节仍明显披露不足。
