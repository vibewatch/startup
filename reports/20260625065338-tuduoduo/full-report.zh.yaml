      - number: '4.2'
        title: 公开规模、盈利能力与轨迹
        blocks:
          - type: paragraph
            body: >-
              公开公告证明，Tuduoduo 已在经审计口径上具备大规模和盈利能力，并不只是一个宣传型增长资产。2023 年 A 轮公告显示，2022 年收入约 RMB20.1 billion，净利润 RMB719
              million。2024 年年报和 2025 年 B1 公告随后显示，经审计的 2023 年收入为 RMB23.63 billion，2024 年收入为 RMB25.52 billion；经审计净利润从 2023
              年 RMB1.01 billion 升至 2024 年 RMB1.07 billion。这意味着收入增长约 8.0%、净利润增长 5.6%、2024 年净利率约 4.2%。相对 Guolian 2024
              年合并业绩，Tuduoduo 似乎贡献了接近一半集团收入和超过 60% 总净利润，是实际利润引擎，而非边缘业务。2025 年 B1 材料进一步披露，截至 2025 年 9 月的前三季度收入为 RMB22.13
              billion，净利润为 RMB871 million，显示规模延续，但公开细节不足以按业务线判断单位经济或收入质量。
