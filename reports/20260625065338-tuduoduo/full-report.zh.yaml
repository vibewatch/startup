      - number: '2.3'
        title: 工业采购数字化的增长驱动
        blocks:
          - type: paragraph
            body: >-
              三个增长引擎最突出。第一，国家政策支持：MIIT 对 2026-2028 工业互联网的解读称，中国已有 340 多个有影响力的工业互联网平台、超过 100 million 台连接设备，并以 2028 年超过
              450 个平台、120 million 台连接设备、平台普及率超过 55% 为目标。文件明确支持订单驱动和供应链金融服务，与 Tuduoduo 的经营模式接近。第二，工业 B2B 需求已非常庞大。Guolian
              2025 年问询回复引用了 2024 年 RMB 35.72 trillion 的中国工业电商市场，并称渗透正深入化工、涂料、电子和物流。第三，地产疲弱的同时，下游制造和出口局部仍有吸引力。MIIT 2026 年
              5 月数据显示，新能源汽车单月产量 1.554 million 辆、出口 446,000 辆；出口许可规则则是在规范贸易渠道，而非关闭渠道。TDD-global
              的海外仓、海关联动和运输栈意味着，出口导向型制造商和贸易商是真实增长楔子，不只是品牌故事。
