      - 指标基准
      - 当前估值 / 倍数
      - 为何可比
      - 主要限制
    rows:
      - - 涂多多 B1（已披露）
        - 2024 年收入 / 净利润
        - RMB 15.8bn 投前 = 0.62x 收入 / 14.8x 盈利
