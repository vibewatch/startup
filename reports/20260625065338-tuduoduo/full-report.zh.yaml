      - number: '7.5'
        title: 缓释因素、监测指标和否决条件
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo 确实有真实的缓释因素。公司已经跑到规模化阶段，对外强调供应商核验和检验，搭出了仓储与物流网络，母公司至少披露了一部分治理和数据控制框架。
              这些因素把它和纯低摩擦的线索撮合平台区分开。但正确的承销姿态，是在实体层面和控制层面验证之前，把缓释因素都视为暂定。第一层监测应当是二元判断：
              所有相关许可和登记是否齐备，母公司能否干净走出调查与纪律处分周期，营运资本指标是改善而不是恶化。第二层应跟踪市场传导：如果中国涂料需求、出口质量或价格实现继续走弱， Tuduoduo
              的托管服务宽度未必能守住价差经济。因此，一份可信的投资备忘录应写入明确否决条件，而不能只靠收入标题或估值标签。
