        - id: r3
          label: 地产和出口疲弱
          description: 中国涂料需求、定价和出口质量仍承受周期和贸易压力。
        - id: r4
          label: 更高运营摩擦
          description: 更多合规步骤、伙伴协同和文件需求，会拖慢交易并抬高执行成本。
        - id: r5
          label: 利润率压缩
          description: 竞争性定价和投入成本波动压窄价差经济性和服务盈利能力。
        - id: r6
          label: 现金转化放慢
          description: 大额预付款、应收款或回购义务消耗现金的速度，可能快于回款补充。
        - id: r7
          label: 融资与估值压力
          description: 如果利润率和现金转化一起走弱，外部投资者议价力上升，估值支撑变弱。
      edges:
        - from: r1
          to: r4
          label: 增加许可、检查和审计暴露
        - from: r2
          to: r5
          label: 迫使降价或降低抽佣率
        - from: r3
          to: r5
          label: 削弱需求和价格实现
        - from: r4
          to: r6
          label: 抬高营运资本和错误成本
        - from: r5
          to: r6
          label: 减少现金生成
        - from: r6
          to: r7
          label: 迫使更依赖外部资本
    approximationNotes: 该图经过简化，聚焦主要公开因果链。它省略了公开记录未披露的二阶缓释因素，例如选择性传导、产品组合升级或私有合同保护。
    claimRefs:
      - CR006
      - CR018
      - CR022
      - CR028
      - CR035
      - CR039
      - CR042
      - CR045
      - CR046
  - id: FR003
    title: 依赖图
    type: dag
    summary: 该有向依赖图展示 Tuduoduo 依靠的外部支柱：母公司治理、监管方、港口 / 海关基础设施、供应商和资本提供方。上述依赖并不等权，但都可能造成单点失效。
    data:
      nodes:
        - id: d1
          label: Tuduoduo / 国联运营栈
          description: 核心工业市场和托管服务工作流，覆盖交易、仓储、物流、结算和数字控制。
        - id: d2
          label: 国联母公司与控制人
          description: 提供治理控制、资本支持和董事会权力，但也传导披露和纪律风险。
        - id: d3
          label: 危化监管机构与海关
          description: MEM、SAMR、海关、交通和环境主管部门决定市场准入和合规边界。
        - id: d4
          label: 港口、仓库与物流伙伴
          description: 与山东港口相关的海外仓执行层，把数字订单转成实物交付。
        - id: d5
          label: 供应商与商户
          description: 为自营和市场交易提供产品可得性、文件材料和质量表现。
        - id: d6
          label: 外部投资者 / 信贷提供方
          description: 营运资本占用上升、估值支撑走弱时，股权资本以及可能的其他资金来源会变得关键。
        - id: d7
          label: 建筑 / 涂料终端市场
          description: 需求底盘带有周期性，最终决定吞吐量、价格兑现和客户健康度。
      edges:
        - from: d2
          to: d1
          label: 控制治理和资本决策
        - from: d3
          to: d1
          label: 授予或限制牌照与市场准入
        - from: d4
          to: d1
          label: 执行仓储、报关和交付承诺
        - from: d5
          to: d1
          label: 供应产品并决定单证质量
        - from: d6
          to: d1
          label: 支撑流动性并设定投资者权利
        - from: d7
          to: d1
          label: 决定需求、定价和交易对手健康度
    approximationNotes: 箭头指向 Tuduoduo，表示它是依赖关系的承受方。图中有意把众多单一主体归并为少数依赖桶，便于看清主要单点风险。
    claimRefs:
      - CR004
      - CR005
      - CR022
      - CR023
      - CR028
      - CR032
      - CR033
      - CR035
      - CR045
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议来自几类证据：规模、可比公司、披露质量、市场周期和治理包袱。
    data:
      nodes:
        - id: n1
          label: 经审计规模
          detail: 2024 年收入 RMB 25.52bn、净利润 RMB 1.07bn，证明 Tuduoduo 业务真实且已经盈利。
        - id: n2
          label: 私募估值
          detail: 官方 B1 文件显示投前估值 RMB 15.8bn，首关募资仅 RMB 70m。
        - id: n3
          label: 可比公司视角
          detail: 收入倍数接近 Brenntag / Azelis，高于 Guolian / DKSH，远低于 Focus / Grainger。
        - id: n4
          label: 披露缺口
          detail: GMV、take rate、毛利率和完整优先权结构仍未披露。
        - id: n5
          label: 周期与治理拖累
          detail: 中国化工需求偏弱，Guolian 仍有调查和披露包袱。
        - id: n6
          label: 建议
          detail: 继续研究；估值更像公允区间上沿到偏紧，而不是明显便宜。
      edges:
        - from: n1
          to: n3
          label: 支撑可比估值
        - from: n2
          to: n3
          label: 形成估值检验
        - from: n3
          to: n6
          label: 框定价格吸引力
        - from: n4
          to: n6
          label: 降低信心
        - from: n5
          to: n6
          label: 推高折现率
    approximationNotes: 该流程把多个估值视角压缩成一条决策路径，用于解释逻辑，并非机械公式。
    claimRefs:
      - CV009
      - CV010
      - CV001
      - CV006
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
      - CV049
