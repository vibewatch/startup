      - number: '5.3'
        title: 信任、质量与合规控制
        blocks:
          - type: paragraph
            body: >-
              关于信任和合规，最强的公开证据来自政策和系统披露，而非客户证言。TDD Global 隐私政策称，平台建在云 ERP
              和云物流之上，并记录了企业认证要求，包括公司注册、法定代表人、发票、收件人和订单数据。政策还称，在完成支付和交付所必需的情况下，订单和交易信息会与支付机构、供应商和第三方物流提供商共享。安全侧，国内主站展示了信息系统安全备案和受监管的在线销售资质；2024
              年可持续发展报告称，集团维持 ISO 9001、ISO/IEC 20000-1 和 ISO/IEC 27001
              管理认证。该报告还描述了合同和客户数据加密、基于角色的访问控制、监测预警系统和灾备规则。产品质量被描述为端到端，而不只是上架前审核：可持续发展报告称质量控制贯穿采购、销售和物流，引用中国产品质量与进出口检验法律，并描述了启用
              Beidou 的云物流追踪系统，用于监控位置和运输条件。结果是，在入驻、隐私和货运可视性上，控制叙事可信；只是每个模块的详细第三方审计并不公开。
