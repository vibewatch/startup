      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公开记录指向一种由创始人经营、母公司监督的治理模式。QCC 和 Askci 均将 Liu Junzhai（也写作 Liu Zhai）列为 Tuduoduo
              的创始人、CEO、法定代表人、董事和经理；同一组履历还显示，她在上市母公司 Guolian Shares 任董事及高级副总裁 / 副总经理。这种集中度重要，因为 Liu 还控制内部持股平台 Beijing
              Tuduoduo Technology Development Center（Limited Partnership），该平台成立于 2017 年，合伙人中还有其他 Tuduoduo 和 Guolian
              管理者。QCC 可见的法定人员名单显示，Liu Quan 任董事长，Qian Xiaojun 任副董事长，An Shenshen 任董事，Shuai Wenyan 任监事，Lü Yanlan
              任财务负责人。由此可得出务实的治理判断：Guolian 在经济层面控制子公司，并把母公司高层放在其周边；Liu
              仍是不可替代的一线经营创始人。公开材料缺失的内容同样关键：没有已审阅来源披露董事会委员会、保留事项、授权边界或继任计划，因此关键人物风险不能被打折处理。
