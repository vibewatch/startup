      - number: '2.2'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方结构和市场规模同样重要。TDD-global 的采购助手、供应商验证、贸易保障、商业报告、LC 支付和运输功能意味着，实际买方通常是采购或贸易团队，而非消费者。但用户往往更宽：Tuduoduo 的 VR
              工厂和企业宣传页面把平台嵌入工厂参观、智能工厂工作流、仓储和云物流，因此运营、质量和物流团队也进入采用链条。预算归属因细分市场而异。涂料配方商和原材料加工商通常动用采购或营运资本预算；汽车、机械、家电、电子或防护涂料等工业终端用户通过运营或品类经理采购；经销商和出口商更在意库存周转、支付工具和海关
              / 物流执行；防腐或工业涂装承包商等项目型买方关注可得性、合规和交付可靠性。这种组合解释了为什么 Tuduoduo
              的服务市场最好理解为跨工厂、经销商、承包商和跨境贸易商的买方—用户—付款方地图，而不是单一同质的“涂料客户”。
