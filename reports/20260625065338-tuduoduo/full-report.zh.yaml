  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - 工业互联网政策和平台扩张目标
        - 正向
        - 2026-2028
        - 工信部明确推动场景驱动的平台使用、数据模型和供应链服务，垂直工业采购更容易制度化落地。
        - 检验 Tuduoduo 是在涂料特定工作流里赢得平台份额，还是只是搭上泛政策顺风车。
      - - 工业 B2B 市场规模和垂直渗透
        - 正向
        - 当前
        - RMB 35.72tn 的工业电商市场意味着 Tuduoduo 乘的是一波大型采购数字化浪潮，而不是从零造浪。
        - 检查 Guolian 的可寻址增长中，还有多少来自涂料 / 化工，而不是其他链条。
      - - NEV 产量和出口
        - 正向
        - 当前
        - 即便整体制造业表现分化，汽车和电池相关制造仍在创造涂料需求。
        - 绘制 Tuduoduo 哪些品类直接受益于 EV、电子和出口 OEM 项目。
      - - 海外仓和关务联动运输
        - 正向
        - 当前至中期
        - 跨境仓和港口联动把服务市场延伸到出口采购和售后物流。
        - 核实海外网络中真实的涂料 / 化学品吞吐，而不只看仓库数量。
      - - 危险化学品安全法
        - 负向
        - 自 2026 年 5 月起
        - 化学品物流要求合规仓储、运输和应急处置，数字市场的执行门槛被抬高。
        - 识别 Tuduoduo 核心品类中哪些在法律上属于危险品，以及已有多大比例通过合规伙伴流转。
      - - 房地产 / 新开工放缓
        - 负向
        - 当前且持续多年
        - 住宅新开工疲弱会拖累建筑涂料和配套化学品需求多年，低线城市尤其明显。
        - 在测算需求时，把建筑相关疲弱与工业 / 出口相关韧性拆开。
      - - 原料和地缘政治成本波动
        - 负向
        - 当前
        - 能源、甲醇、硫和钛白粉相关成本冲击可能挤压利润率，并迫使采购节奏改变。
        - 衡量 Tuduoduo 的信息 / 指数工具是否真的比线下渠道更能帮助客户管理波动。
