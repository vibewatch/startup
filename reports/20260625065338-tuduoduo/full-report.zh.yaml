      - number: '5.4'
        title: 差异化、成熟度与可见产品缺口
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo 的差异化在垂直和运营。产品针对涂料及相邻化工链条调校，发布品类专属技术页面，叠加国内和跨境采购渠道，并越来越多地把交易连接到云仓、供应商验证、货运和定制材料开发。围绕 Horgos
              云仓、印尼海外仓上线和 Sinopec 相关定制材料的合作故事，显示出比通用挂牌市场更强的运营野心。可是，公开尽调记录仍远未达到完整技术透明。没有已审阅公开 API 或连接器文档能证明所称 ERP
              集成到底有多深。公开页面展示了供应商验证，并在原始 HTML 中营销 ISO/REACH/MSDS 认证化学品，但没有记录一套原生 SDS
              编写、翻译或托管文档库工作流，能与专业合规提供商相比。公司范围数据也重要：QCC
              经营范围摘录覆盖普通货物仓储，但明确把危险化学品排除在该仓储条款之外，这意味着已审阅公开记录不能证明该实体拥有持牌自营危险品仓储。最后，移动端和从业者信号仍有限：app 已上线且支持多语言，BOSS 显示 ERP
              / 订单数据岗位在招，但截至运行日，App Store 仍没有足够评分来展示评价概览。
