  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现与收入确认
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo 不是一个纯软件订阅故事。官方公司页面描述的收入栈来自 B2B
              工业品交易、数字供应链服务、工业数字服务、工业大数据服务和跨境层，并在自营电商、撮合电商、跨境电商以及在线下单、电子签章、在线支付、云 ERP 等 SaaS
              模块中给出明确变现场景。母公司公告补充了一个财务上重要的细节：更广的集团仍有 99.65% 收入来自线上大宗商品交易，意味着合并经济性仍由交易流主导，而不是软件费。2025
              年监管回复公告还解释了为什么报告收入可能误导：有实物流转的交易，在公司为主要责任人时通常按总额入账；没有实物流转的货权转移交易，则越来越多基于主要责任人—代理人分析按净额入账。这个会计拆分可能提升收入质量，但也意味着外部人不能只靠表层收入倒推出抽佣率或
              GMV。
