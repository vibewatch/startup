      - number: '3.2'
        title: 能力与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo 最清楚的公开差异化不在标题式宽度，而在工作流深度。TDD Global 页面强调已验证供应商、报价周转、贸易保障、LC 支付、检验、海关、港口协调、50
              多个仓库和一体化运输，比典型开放市场更重服务。Guolian 的公告语言也强化了这一点：国内平台用自营采购、团购、拍卖、直播和数字仓储来加深复购和 ARPU。相比之下，1688
              以宽度、工厂直供价格和密集供应商发现能力竞争，但即便友好指南也承认，海外买家仍需要语言支持、检验和货运帮助。Made-in-China 更接近出口采购，因为它明确营销安全支付、已验证供应商、RFQ
              工作流和国际物流。ChemNet 的强项是化工专属信息、贸易线索和推广，并叠加金融与数据工具；Molbase
              的公开差异化是目录深度加金融。线下分销商在涂料买方需要打样、重配方、本地库存和应用实验室时最强。换句话说，Tuduoduo 的进攻角度是托管式工业工作流；其他玩家要么赢在宽度，要么赢在深技术服务。
