      - number: '4.4'
        title: 承销判断与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              承销答案因此是混合的。正面看，经审计的子公司披露确认 Tuduoduo 规模大、能盈利、在增长，并且对 Guolian 具有战略核心地位。负面看，母公司在采用更保守净额收入处理后不得不重述 2024
              年收入和成本项目，2023 年底宣布的 CSRC 调查仍是真实阴影，SSE 在 2025
              年的纪律处分也批评了披露不准确、监管回复延迟和少量募集资金误用。这些问题不能证明平台经济性不成立，但会显著降低把表层收入当作干净变现质量代理指标的信心。同样重要的是，公开来源仍未披露 Tuduoduo
              独立抽佣率、GMV、毛利率、客户集中度、直接债务余额、流动性 runway，或任何平台专属供应链金融信贷账簿。合理结论是，Tuduoduo
              像一个真实利润中心，并有明确资产负债表需求，但仍需要私有尽调把耐久平台经济性与交易规模观感拆开。
