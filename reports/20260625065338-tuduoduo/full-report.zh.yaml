  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 重要性
      - 缓释 / 尽调问题
    rows:
      - - 采购 + 仓储 + 结算的工作流深度
        - 1688 和 Made-in-China 仍能凭搜索速度和公开价格发现赢下标准化 SKU
        - 高
        - 产品容易定义和比较时，买家可以几乎无摩擦地多平台采购
        - 量化有多少 GMV 来自服务重的复购工作流，而不是一次性大宗商品寻源
      - - 化工链专业化
        - ChemNet 和 Molbase 已经占有化工专属流量、目录、数据或目录搜索
        - 中
        - 如果同行也搭建垂直工具，专业化本身并不排他
        - 展示供应商重叠、复购留存，以及相对化工专属平台的转化优势
      - - 跨境基础设施
        - 大型横向平台和物流服务商可以模仿运输、仓储和关务服务
        - 中
        - 除非 Tuduoduo 执行或经济性更好，服务复制会缩窄差异化
        - 索取各物流产品的仓库利用率、路线密度、交付 SLA 和毛利率
      - - 数字供应链带来的客户黏性
        - 公开文件显示，交易单据和净额 / 总额收入确认仍持续受到审视
        - 高
        - 信任被侵蚀后，数字化工作流整合带来的任何锁定效应都可能被抵消
        - 复核审计轨迹质量、客户投诉，以及企业买家在扩大支出前是否要求额外控制
      - - 对中国涂料需求的敞口
        - 建筑需求疲弱、供给分散、价格战挤压平台议价能力
        - 高
        - 宏观走弱让买家更看价格，供应商忠诚度也更弱
        - 按终端市场压力测试模型，尤其是建筑涂料和建筑相关化学品
      - - 线下渠道替代
        - 经销商靠实验室、样品和本地仓储守住高接触度技术账户
        - 高
        - 规格要求重的 CASE 和高性能涂料，未必只靠价格就迁移到线上
        - 按配方支持需求划分客户队列，并找出线上转化已经真正跑通的场景
    notes: 严重性反映的是对竞争耐久性的承销风险，不等于失败已成定局；每一行都把公开证据转化为尽调议程，而不是二元判断。
