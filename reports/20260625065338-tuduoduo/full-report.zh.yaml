  - id: TM003
    title: 细分市场 / 买方地图
    columns:
      - 细分
      - 买方
      - 用户
      - 付款方 / 预算负责人
      - 工作流
      - 采用触发点
    rows:
      - - 涂料配方商 / 原材料加工商
        - 采购经理或业主
        - 工厂采购、实验室、生产计划
        - 营运资金或原材料预算
        - 重复采购钛白粉、树脂、乳液、助剂、溶剂和包装
        - 价格透明、供应商可信、交付可靠，能减少停工和采购风险。
      - - 工业终端工厂（汽车、家电、机械、电子）
        - 品类买手或运营牵头采购
        - 生产、涂装线、质量、EHS 团队
        - 运营 / 工厂预算
        - 按生产排期采购涂料投入品或成品工业涂料
        - 需要合格产品、合规和准时供应，而不只是低标价。
      - - 经销商 / 批发商
        - 交易台或经销商业主
        - 销售、仓库、财务
        - 库存和贸易融资预算
        - 批量采购、持货，再转售给小型工厂和承包商
        - 需要库存周转、信用工具、发运可视性和供应商验证。
      - - 项目 / 防腐承包商
        - 项目采购负责人
        - 现场执行团队
        - 项目预算负责人或承包商财务
        - 围绕招标采购防护体系和配套化学品
        - 项目延期代价高，因此交付确定性和合规很关键。
      - - 出口贸易商 / 海外买家
        - 贸易公司买手
        - 贸易运营、海关、物流团队
        - 贸易预算和营运资金
        - 跨境采购，并配套仓储、运输、报关和单证支持
        - 海外仓、关务联动和已验证供应商能降低出口摩擦。
      - - 工厂运营 / 物流用户
        - 运营或供应链负责人
        - 仓库、调度、QC、数字工厂人员
        - 运营 / 供应链系统预算
        - 围绕采购使用智能仓储、云物流和 VR / 云工厂工具
        - 数字化工作流只有在明显提升履约速度、库存控制或工厂可视性时，才会启动采用。
