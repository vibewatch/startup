      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              近期最实质的风险是，合规边界抬高，而 Tuduoduo 继续向更重执行的服务扩张。中国危险化学品安全法于 2026-05-01
              生效，现已覆盖全生命周期中的经营、运输、储存、使用和应急响应。独立合规解读称，该法从较窄的清单思维转向更广的属性定义，增加定期安全评估披露，并依赖多部门负责许可、登记、海关检验和环境监管。只有当实体层面的许可证、登记文件、SDS
              和标签控制、仓库审批在每个交易和物流实体中都保持有效时，这才可控。公开层面，这些逐实体许可并不可见。第二个法律阴影来自母公司治理：Guolian 仍在处理一条很长的披露控制尾部，里面包括 CSRC
              调查、分拆式监管回复和后续交易所处分。
