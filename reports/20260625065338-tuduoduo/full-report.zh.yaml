    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律实体与经营范围
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo 可追溯至 2014-12-18，当时 Beijing TDD E-commerce Co., Ltd.
              在北京成立。工商和备案记录显示，法律主体为北京涂多多电子商务股份有限公司，是其他股份有限公司（非上市），总部位于丰台区南四环西路 188 号 6 区 3 号楼。Toodudu.com
              首页仍将业务定位为涂料与化工工业互联网平台和一站式采购网站，TDD Global 的资料则把定位扩展到四种服务模式：自营电商、市场撮合、跨境电商和 SaaS
              工具。官方渠道反复出现的经营垂直品类包括涂料、钛、溶剂、树脂、润滑油、炭黑、包装和医疗用品。公开规模披露更偏选择性，而非全景式：QCC 在 2025 年备案中显示参保员工 310 人、上海分公司 1
              家，但已审阅来源没有披露客户数量或完整仓库与办公室版图，因此后续尽调不应仅凭品牌露出推断其全国覆盖能力。
