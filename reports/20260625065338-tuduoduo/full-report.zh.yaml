      - number: '8.3'
        title: 牛市、基准、熊市与投资建议
        blocks:
          - type: paragraph
            body: >-
              情景框架最好用有纪律的区间处理，而不是制造虚假的精确度。如果化工市场疲弱持续、公开市场折价仍接近国联和 DKSH 水平，或更多披露问题浮出水面， 熊市情形约为人民币 90 亿至 110 亿元。基准情形约为人民币
              130 亿至 150 亿元，更符合当前公开证据：Tuduoduo 规模大且盈利， 因此可以相对国联保有溢价，但不透明的单位经济和治理拖累仍要折价。牛市情形约为人民币 160 亿至 180
              亿元，所需的不只是现有叙事。 它需要 2025 年全年经审计利润达到或高于年化 run-rate，需要剩余 B1 资金到账的证据，也需要母公司阴影有所减轻。
              因此建议是继续研究，而不是买入。现有轮次价格并不荒唐，但它更接近可辩护价值区间的上沿，而不是一个显然有吸引力的进入点。
