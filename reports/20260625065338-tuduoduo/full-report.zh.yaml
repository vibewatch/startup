  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 核心涂料原材料
        - 工业用户反复采购的钛白粉、颜料、填料、树脂、乳液、溶剂、助剂、包装及相关化学品
        - 卖给 DIY 家庭的零售装饰漆罐
        - 采购团队、工厂买家、分销商、贸易商
        - 这与 Tuduoduo 的品类结构和一站式采购定位最干净地匹配。
      - - 工业涂料流程
        - 水性、功能、防腐、汽车和通用工业涂料，以及相关配方投入
        - 不带工业采购复杂度的纯住宅重涂支出
        - 工厂、配方商、项目承包商、品类经理
        - 这是观察经常性 B2B 涂料商务服务需求的最近镜头。
      - - 物流 / 仓储 / 合规服务
        - 仓储、航运、云物流、海关联动、供应商核验、融资相邻流程支持
        - 与化学品或涂料无关的货运
        - 供应链、物流、财务和运营预算
        - Tuduoduo 的变现和切换成本可以落在化学品交易周边服务里，而不只是目录本身。
      - - 跨境化工贸易
        - 面向钛白粉、树脂、溶剂、颜料、PVC 和类似链条的出口导向采购
        - 通用非化工出口交易平台
        - 贸易公司、海外买家、出口销售团队
        - TDD-global 和海外仓把服务市场扩展到出口驱动的采购与交付。
      - - 现状替代方案
        - 电话 / WeChat / 经纪采购、既有分销商、OEM 直采、本地仓网
        - 消费电商和家用家装零售
        - 与数字渠道相同的买方预算
        - 真正的竞争基线是线下信任和信用关系，而不只是其他线上交易平台。
      - - 排除的外围类别
        - 与涂料 / 化学品无重叠的医疗或冷链相邻领域，以及家庭装饰零售
        - N/A
        - N/A
        - 这些类别可能出现在平台表层，但不应计入本章核心市场论点。
    notes: 边界遵循 Tuduoduo 自身产品和服务表层，并排除家庭装饰零售；物流和合规被纳入，是因为危险品执行属于购买决策的一部分。
