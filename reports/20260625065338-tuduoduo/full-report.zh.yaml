  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与测算口径
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo 的正确市场边界不是“所有中国涂料”，也不只是通过零售渠道销售的成品漆。Tuduoduo
              自己的界面显示，它覆盖更广的工业采购栈：钛白粉和矿石、树脂、乳液、助剂、溶剂、润滑油、颜料、炭黑、包装和工业涂料工作流，并叠加仓库、物流和云工厂服务。因此，外层 TAM
              是更广的中国涂料与化工采购经济；更有用的可服务口径，则是工厂、经销商、项目承包商和出口商反复采购、可数字化且可实物履约的工业投入品子集。公开市场规模数据很杂。China Coatings Association
              数据称，2025 年涂料产量为 34.602 million 吨，收入 RMB 388.15 billion；Ibuychem 摘要给出约 36.5 million 吨和约 RMB 427
              billion。IndexBox 使用窄得多的 15 million 吨油漆与清漆口径，MRFR 则把工业涂料单独测为 2025 年 $7.69 billion。尽调结论不是某个数字“正确”，而是
              Tuduoduo 应用多个受限口径估算：总涂料产量、工业子板块，以及平台可观察的交易足迹，同时明确保留边界不匹配。
