      - number: '3.3'
        title: 定价、切换成本与多平台并用动态
        blocks:
          - type: paragraph
            body: >-
              公开商业条款解释了为什么标准化涂料投入品容易被商品化。在 Made-in-China 和 1688 上，买方常常能在联系卖家前看到价格筛选、MOQ 提示或工厂直供定位；Tuduoduo
              的公开工作流则更偏先报价、服务驱动。ChemNet 公开可见的套餐也很说明问题：基础会员免费，非会员也可发布贸易线索，付费 Gold Supplier
              层主要购买曝光和可信度。这说明竞争中至少一部分仍是注意力撮合，而非专有执行。若供应商和买方切换成本保持低位，学术平台文献对 Tuduoduo
              方向性不利：一旦两边都能多平台并用，费用和利润会被挤压，市场奖励的要么是主导性宽度，要么是差异化工作流。因此，Tuduoduo
              只有在同时控制多个步骤——采购、结算、物流、仓储或合规敏感履约——时才有真实锁定。买方若只是想比较钛白粉、溶剂或树脂报价，大型横向平台和本地贸易商就可能足够好。线下分销商制造的是另一种切换壁垒：技术服务、样品和客户关系会让规格要求高的客户不愿把采购迁到更便宜的数字渠道。
