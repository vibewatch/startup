    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与地理足迹
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo 的公开客户故事不止一个涂料采购账户。官方材料显示至少六个有意义的分层：通过市场和 app 下单的国内工业买方；为店铺、销售线索和数据服务付费的商户或供应商客户；使用 VR
              云工厂曝光的具名工厂参与者；帮助履约进出口流的仓储和物流运营商；使用 TDD Global
              的跨境出口商和海外市场进入者；以及政府、园区或使馆连接的企业服务对手方，把平台用作工业撮合层。年报补充称，客户开发按区域组织，跨境人员明确开发海外客户资源，这支持了真实的多渠道足迹，而非静态线上目录。公司自己的分层语言还覆盖涂料、钛、溶剂、树脂、润滑油、炭黑、包装、医疗、汽车装备、冷链和建筑材料相邻供应链，因此客户群应理解为一组垂直企业社群组合，而不是单一同质买方池。
