    question: What does Tuduoduo actually sell and how does it describe its business model?
    type: enumeration
    targets:
    - contentRequirements/0
    - plannedTables/snapshot-kpi-table
    status: answered
    answerSummary: Official pages describe a coatings / chemicals industrial internet platform with self-operated, matching, cross-border, and SaaS service modes.
  - id: QO004
    question: How large is the publicly disclosed workforce and where is it visibly located?
    type: quantification
    targets:
    - contentRequirements/3
