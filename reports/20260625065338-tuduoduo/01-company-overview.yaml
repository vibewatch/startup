  - id: QO010
    question: What are the publicly visible terms of the December 2025 B1 financing?
    type: quantification
    targets:
    - contentRequirements/2
    - plannedTables/stakeholder-or-investor-map
    status: answered
    answerSummary: Up to RMB 365m planned, RMB 70m first tranche closed, pre-money valuation RMB 15.8bn, and Guolian remained the controlling shareholder.
