    question: How concentrated is key-person dependence around Liu Junzhai and parent leaders?
    type: adverse
    targets:
    - contentRequirements/1
    status: answered
    answerSummary: 'High: Liu spans founder, CEO, legal rep, parent executive, and LP manager roles, while Guolian controls the cap table and surrounding governance roles.'
  - id: QO008
    question: How does Guolian control Tuduoduo economically after the December 2025 financing?
    type: mechanism
    targets:
    - contentRequirements/1
    - contentRequirements/2
    - plannedTables/stakeholder-or-investor-map
    status: answered
    answerSummary: Guolian still held 75.5902% after the first tranche, so the subsidiary remained firmly parent-controlled despite new money entering.
  - id: QO009
    question: What are the publicly visible terms of the January 2024 financing event?
    type: quantification
    targets:
    - contentRequirements/2
    - plannedTables/stakeholder-or-investor-map
