- id: capitalization-parent-relationship-and-scale
  title: Capitalization, Parent Relationship, and Disclosed Scale
  body: 'The clearest cap-table evidence comes from Guolian''s 2025-12-30 filing on Tuduoduo''s B1 financing. After the first tranche, Guolian still owned 75.5902%, founder Liu Junzhai held 11.2468%, and the employee/management LP held 7.1505%, leaving the subsidiary firmly controlled by the listed parent despite external capital entering the structure. The same filing and aligned Tencent/Sina coverage support up to RMB 365 million of planned fundraising at a pre-money valuation of RMB 15.8 billion, with the first RMB 70 million closing immediately. A January 2024 Tencent report provides an earlier publicly visible valuation point of RMB 14.129 billion pre-money for a RMB 50 million strategic raise. One nuance matters for diligence: Guolian''s own documents call the 2025 financing a B1 round, while QCC''s financing page labels the same RMB 70 million event as a B round, so round nomenclature should not be treated as clean historical truth. On operating scale, the best-supported metrics are
    RMB 25.52 billion revenue and RMB 1.07 billion net profit for 2024, plus RMB 22.13 billion revenue and RMB 871 million net profit for the first three quarters of 2025. No reviewed public source gives a customer count, 2026 revenue run-rate, or fully diluted post-round cap table after the entire intended raise.'
