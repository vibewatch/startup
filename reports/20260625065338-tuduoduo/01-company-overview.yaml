  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Active customer / account count, buyer concentration, repeat-purchase rates, and GMV split by self-operated vs marketplace models.
    whyItMatters: Without customer-breadth data, it is impossible to judge concentration risk, network effects, or whether the disclosed valuation rests on diversified platform usage versus a small number of large counterparties.
    diligencePath: Request operating KPI decks or board materials from Tuduoduo / Guolian under NDA and reconcile them with audited subsidiary results.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: geographic-footprint
    missingEvidence: A current office, branch, warehouse, subsidiary, and overseas-presence map beyond Beijing HQ, one Shanghai branch, and Pakistan-HQ communications.
    whyItMatters: Physical and international footprint is a scale signal and an execution-risk variable; the public record currently confirms only fragments and marketing-language expansion milestones.
    diligencePath: Request the latest legal-entity map, branch list, warehouse roster, and overseas staffing plan from management, then reconcile against registry records.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO001
    - TO004
  - type: missing-source
    severity: material
    topic: governance-succession
    missingEvidence: Board committee structure, delegated authorities, related-party governance processes, emergency succession plans, and management retention arrangements.
    whyItMatters: The public record shows high leadership concentration and parent control, but does not show how those risks are governed in practice or how the business would operate through founder or parent-management disruption.
    diligencePath: Request board charters, committee terms of reference, reserved-matters schedule, related-party policy, and founder / key-executive retention documentation.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: funding-history
    missingEvidence: A fully reconciled round-by-round funding chronology before January 2024, plus the final post-close cap table if all planned December 2025 investors complete their subscriptions.
    whyItMatters: The current public set cleanly supports the January 2024 and December 2025 events, but cannot yet reconcile full historical dilution, precise earlier round sizing, or the eventual ownership outcome after the whole B1 raise closes.
    diligencePath: Request historical financing resolutions / cap tables from Guolian or retrieve archived transaction databases and parent disclosures that preserve the earlier rounds in more detail.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO003
    - TO004
