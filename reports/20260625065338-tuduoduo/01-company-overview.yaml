    answerSummary: Founder-CEO, legal representative, director, manager of Tuduoduo, plus director and senior executive at Guolian.
  - id: QO006
    question: What current governance roster is publicly visible for the subsidiary?
    type: enumeration
    targets:
    - contentRequirements/1
    - plannedTables/leadership-and-founder-table
