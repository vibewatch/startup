- id: milestones-partnerships-and-adverse-context
  title: Milestones, Partnerships, and Adverse Context
  body: 'Tuduoduo''s public milestone trail shows both continuity and evolution. The 2014 founding established the core entity; the 2017 management LP shows early formalization of insider ownership; and a 2020 group article already cast Liu as the platform''s public strategist. In capital markets, the public record then surfaces a January 2024 strategic raise at RMB 14.129 billion pre-money and a December 2025 B1 round at RMB 15.8 billion pre-money. On operating evolution, official pages and partnership articles show the platform pushing beyond pure listings toward digital supply chain, cloud-factory, cross-border, and partner-developed product workflows: the Sinopec/Zhong''an custom polypropylene case is a good example of data-led supply-chain collaboration rather than simple resale. The 2026 Pakistan articles push that further by documenting a planned and then inaugurated Pakistan digital-economy headquarters. Unicorn evidence is supportable but should be phrased carefully: the parent
    site says Tuduoduo made the 2026 China Unicorn Enterprise list, while QCC separately records a 2025 Hurun-style unicorn recognition. The adverse picture sits mostly at parent level: Guolian remained under unresolved CSRC investigation in 2026 because of earlier accounting corrections, and investor-claim articles kept litigation risk alive even if no reviewed public source showed Tuduoduo itself as the direct target of a major standalone penalty or lawsuit.'
