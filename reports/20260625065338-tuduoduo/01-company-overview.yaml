company:
  name: Tuduoduo
chapter:
  number: 1
  title: Company Overview
  summary: 'Tuduoduo (涂多多 / Toodudu) is a Beijing-based industrial B2B marketplace founded on 2014-12-18 and operated through Beijing TDD E-commerce Co., Ltd., a non-listed joint-stock company controlled by Guolian Shares (603613.SH). Public filings and registry data support a parent-owned but founder-operated structure: Guolian still held 75.5902% after the first tranche of the December 2025 B1 financing, while founder-CEO Liu Junzhai remained the legal representative and second-largest shareholder. The best-supported public scale markers are RMB 25.52 billion of 2024 revenue, RMB 22.13 billion of 2025-Q3 revenue, 310 insured employees in the 2025 registry filing, and a latest publicly disclosed pre-money valuation of RMB 15.8 billion; customer count, current run-rate, and full succession/governance detail remain undisclosed.'
sections:
- id: identity-and-scope
  title: Identity, Legal Entity, and Operating Scope
  body: 'Tuduoduo traces back to 2014-12-18, when Beijing TDD E-commerce Co., Ltd. was established in Beijing. Registry and filing records identify the legal entity as 北京涂多多电子商务股份有限公司, an other joint-stock company (non-listed), headquartered at Building 3, Area 6, No. 188 South Fourth Ring West Road in Fengtai District. The Toodudu.com homepage still brands the business as a coatings-and-chemicals industrial internet platform and one-stop procurement site, while the TDD Global profile expands that positioning into four service modes: self-operated e-commerce, marketplace-style matching, cross-border e-commerce, and SaaS tooling. Across official channels, the consistently named operating verticals are coatings, titanium, solvents, resins, lubricants, carbon black, packaging, and medical supplies. Public scale disclosure is selective rather than comprehensive: QCC reports 310 insured employees in the 2025 filing and one Shanghai branch, but the reviewed sources do not disclose customer count
    or a full warehouse-and-office footprint, so later diligence should not infer national coverage from the brand presence alone.'
