  - id: FU002
    title: Adoption and deployment flow
    type: flow
    summary: >-
      Tuduoduo’s public flow is operationally deep: it starts with acquisition and registration and runs through
      payment, delivery, and merchant-side services.
    data:
      nodes:
        - id: n1
          label: Acquire prospects
          detail: Online marketing, industry events, and regional field teams create lead inflow
        - id: n2
          label: Free registration
          detail: Website, app, mini-program, and knowledge-base surfaces lower onboarding friction
        - id: n3
          label: Place and govern orders
          detail: Orders, pricing adjustments, signatures, invoices, and settlement requests are centrally managed
        - id: n4
