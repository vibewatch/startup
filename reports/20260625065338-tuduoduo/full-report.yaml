companyProfile:
  summary: >-
    Tuduoduo (涂多多 / Toodudu) is the coatings-and-chemicals marketplace arm of Guolian Co., Ltd. (603613.SH), operating
    through 北京涂多多电子商务股份有限公司 from Beijing. Founded on 2014-12-18, it has evolved from a coatings-focused industrial
    e-commerce site into a heavier-service procurement stack spanning domestic B2B trading, cross-border sourcing,
    warehousing, logistics, payments, and digital factory tooling. Public parent filings make Tuduoduo look more like a
    scaled industrial intermediary than a venture-stage startup: audited 2024 revenue reached RMB25.52 billion and
    audited net profit reached RMB1.07 billion. Even so, active-customer definitions, take rate, gross margin, and
    entity-level compliance detail remain materially under-disclosed.
