      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is strong enough to keep this from being a clean moat story. Coatings World and China
              Coatings both describe a Chinese coatings market with slowing growth, lower prices, fragmentation, and
              pressure from weak construction demand. Ibuychem goes further, describing intense internal competition and
              price wars severe enough that Chinese coatings companies increasingly view overseas expansion as a
              necessity, not a luxury. ICIS adds a macro overlay: Beijing still entered 2026 trying to stabilize a deep
              property crisis, which remains bad for construction-linked coatings demand. These conditions matter
              because they shift bargaining power toward buyers and low-cost channels, exactly where Tuduoduo faces
              1688, Made-in-China, ChemNet, local traders, and specialty distributors. Public filings add a second
              adverse signal: Guolian has continued to deal with exchange scrutiny around transaction documentation and
              net-versus-gross recognition, which can dilute trust at the same time the company argues that digital
              warehousing and smart logistics create stickiness. Net result: Tuduoduo’s moat looks service-led rather
              than structurally exclusive. It can be durable in repeat, workflow-heavy procurement; it looks fragile in
              standardizable SKUs, soft end-markets, or technical accounts already controlled by distributors.
            claimRefs:
