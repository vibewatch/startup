        title: Marketplace surface and transaction workflow
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo's public product footprint is broader than a simple catalog site. The domestic marketplace
              surface exposes an order center, user and merchant centers, online payment, online e-signature, enterprise
              authentication, account-security controls, and a help-center structure that walks buyers through
              contracting, order payment, shipment requests, invoicing, and merchant-side order management. The
              company's own about materials go further by defining four commercial surfaces: self-operated e-commerce,
              third-party/marketplace e-commerce, cross-border e-commerce, and SaaS services. Those same materials
              explicitly name workflow modules such as online ordering, electronic signature, online payment, cloud ERP,
              video authentication, and cloud meetings. In practice, that means Tuduoduo sells a transaction operating
              system around chemicals and coatings procurement rather than only traffic or lead generation. The mobile
              layer supports that view: the main site advertises iPhone, Android, and WeChat mini-program channels,
              while the TDD Global app page highlights on-the-go product search, RFQ submission, quotation comparison,
              order-status checks, and logistics tracking. The product thesis is therefore workflow compression: move
              sourcing, contracting, payment, fulfillment, and repeat ordering into a vertically specialized industrial
              interface.
