      - number: '7.3'
        title: Competition and end-market cyclicality
        blocks:
          - type: paragraph
            body: >-
              The public evidence points to a difficult external market even if Tuduoduo executes well internally. On
              standardized industrial inputs, 1688 still sets the benchmark for factory-direct price transparency and
              dense supplier choice, while Made-in-China, ChemNet, and Molbase offer buyers alternative quote, catalog,
              and supplier-discovery paths. Offline distributors such as Brenntag, Azelis, and DKSH compete differently:
              they win where local stock, labs, and technical support matter more than the lowest quoted price. That
              would already pressure take rate and gross spread in a normal market. But the market is not normal.
              Coatings World and ICIS both describe a Chinese environment shaped by property weakness, softer industrial
              demand, fragmentation, excess capacity, and export competition. ChinaCoatings adds that 2025 output,
              revenue, and unit prices all fell, while export relief was uneven and input costs remain vulnerable to
              energy and trade shocks.
            claimRefs:
              - CR028
              - CR029
              - CR030
