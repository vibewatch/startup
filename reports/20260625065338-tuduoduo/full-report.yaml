    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Legal Entity, and Operating Scope
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo traces back to 2014-12-18, when Beijing TDD E-commerce Co., Ltd. was established in Beijing.
              Registry and filing records identify the legal entity as 北京涂多多电子商务股份有限公司, an other joint-stock company
              (non-listed), headquartered at Building 3, Area 6, No. 188 South Fourth Ring West Road in Fengtai
              District. The Toodudu.com homepage still brands the business as a coatings-and-chemicals industrial
              internet platform and one-stop procurement site, while the TDD Global profile expands that positioning
              into four service modes: self-operated e-commerce, marketplace-style matching, cross-border e-commerce,
              and SaaS tooling. Across official channels, the consistently named operating verticals are coatings,
              titanium, solvents, resins, lubricants, carbon black, packaging, and medical supplies. Public scale
              disclosure is selective rather than comprehensive: QCC reports 310 insured employees in the 2025 filing
              and one Shanghai branch, but the reviewed sources do not disclose customer count or a full
              warehouse-and-office footprint, so later diligence should not infer national coverage from the brand
              presence alone.
