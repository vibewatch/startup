      - number: '1.2'
        title: Leadership, Governance, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >-
              The public record points to a founder-operated but parent-supervised governance model. QCC and Askci both
              identify Liu Junzhai (also rendered Liu Zhai) as Tuduoduo's founder, CEO, legal representative, director,
              and manager; the same biographies also place her inside the listed parent as a director and senior vice
              president/deputy general manager of Guolian Shares. That concentration matters because Liu also controls
              the internal holding vehicle Beijing Tuduoduo Technology Development Center (Limited Partnership), which
              was formed in 2017 and includes other Tuduoduo and Guolian managers among its partners. The statutory
              roster visible on QCC names Liu Quan as chair, Qian Xiaojun as vice chair, An Shenshen as director, Shuai
              Wenyan as supervisor, and Lü Yanlan as finance chief. This supports a practical reading of governance:
              Guolian controls the subsidiary economically and places senior parent figures around it, while Liu remains
              the indispensable operating founder. What is missing from the public set is just as important: no reviewed
              source discloses board committees, reserved matters, delegated authorities, or succession planning, so
              key-person risk cannot be discounted.
