      - number: '2.4'
        title: Constraints, contradictory estimates, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The adoption case is still constrained by regulation, logistics, switching cost, and end-market weakness.
              Hazardous-chemical compliance became stricter in 2026 when China adopted a full hazardous-chemicals safety
              law covering production, storage, business operations, transportation, and emergency response. That raises
              the bar for marketplaces that want to digitize high-risk flows; digital matching is not enough without
              compliant warehousing, transport, inspection, and documentation. Trust and working capital are also real
              frictions. TDD-global highlights verified suppliers and trade assurance, while Guolian’s filing says
              self-operated procurement often requires large prepayments to lock supply and maintain upstream/downstream
              trust. End-market demand is uneven: the coatings market tied to Chinese residential new build remains
              weak, repainting is the main offset, and ICIS still shows deep housing inventory overhang. Finally, public
              data does not let an outsider cleanly isolate Tuduoduo’s coatings-only SAM or SOM. Platform-wide
              transaction claims are available, but segment GMV, take rates, active-buyer counts, and coatings-only
              repeat usage are not. That is the core diligence gap for valuation-grade market sizing.
            claimRefs:
