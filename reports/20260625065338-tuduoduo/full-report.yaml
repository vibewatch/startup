              platform pushing beyond pure listings toward digital supply chain, cloud-factory, cross-border, and
              partner-developed product workflows: the Sinopec/Zhong'an custom polypropylene case is a good example of
              data-led supply-chain collaboration rather than simple resale. The 2026 Pakistan articles push that
              further by documenting a planned and then inaugurated Pakistan digital-economy headquarters. Unicorn
              evidence is supportable but should be phrased carefully: the parent site says Tuduoduo made the 2026 China
              Unicorn Enterprise list, while QCC separately records a 2025 Hurun-style unicorn recognition. The adverse
              picture sits mostly at parent level: Guolian remained under unresolved CSRC investigation in 2026 because
              of earlier accounting corrections, and investor-claim articles kept litigation risk alive even if no
              reviewed public source showed Tuduoduo itself as the direct target of a major standalone penalty or
              lawsuit.
