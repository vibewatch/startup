      - number: '7.4'
        title: Dependency, working-capital, and execution risk
        blocks:
          - type: paragraph
            body: >-
              The financial and operational risk picture is dominated by dependence on systems and counterparties that
              sit outside a clean software margin model. Public filings say online commodity trading still makes up
              99.65% of revenue, that the company can prepay suppliers and autonomously match customers to suppliers,
              and that no-physical-movement trades may need net treatment when control evidence is weak. The June 2025
              reply also showed very large prepayments and rising receivable reserves, while the B1 financing added
              explicit repurchase obligations if Guolian cannot engineer a later liquidity path. This means Tuduoduo is
              exposed not just to demand softness but to cash-conversion quality, credit losses, partner
              non-performance, and parent-governance friction. The warehouse and shipping pages reinforce that this is
              an execution-heavy model built around ports, customs, inventory tracking, and partner coordination, while
              the ESG report shows that data integrity and algorithm governance have to scale with the operating
              footprint.
