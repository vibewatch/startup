        title: Customer segments and geographic footprint
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo’s public customer story is broader than a single coatings-buying account. Official materials show
              at least six meaningful segment buckets: domestic industrial buyers that order through the marketplace and
              app; merchant or supplier customers that pay for storefront, lead-generation, and data services; named
              factory participants that use VR cloud-factory exposure; warehouse and logistics operators that help
              fulfill import-export flows; cross-border exporters and overseas-market entrants using TDD Global; and
              government-, park-, or embassy-linked enterprise-service counterparts that use the platform as an
              industrial matchmaking layer. The annual report adds that customer development is regionally organized and
              that cross-border staff explicitly develop overseas customer resources, which supports a genuinely
              multi-channel footprint rather than a static online catalog. The company’s own segmentation language also
              spans coatings, titanium, solvents, resins, lubricants, carbon black, packaging, medical, automotive
              equipment, cold chain, and building-material-adjacent supply chains, so the customer base should be read
