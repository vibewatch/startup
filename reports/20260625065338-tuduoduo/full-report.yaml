    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - FY2025 audit
        - Audited full-year 2025 Tuduoduo income statement, cash flow, and balance sheet.
        - The December 2025 round was priced against a period that is not yet fully audited in the public record.
        - Management CFO package; auditor comfort session.
      - - Unit economics
        - GMV, take rate, gross margin, customer retention, and cohort profitability by transaction mode.
        - These inputs decide whether comp selection should lean toward Focus or toward lower-multiple distributors.
        - Product finance and data-room upload under NDA.
      - - Cap table and rights
        - Full post-close shareholder register, liquidation preferences, anti-dilution, and repurchase clauses.
        - Headline valuation can overstate real economics if downside rights are strong.
        - Legal diligence on signed B1 agreements.
      - - Round completion
        - Evidence on whether the remaining RMB 295m of intended B1 capital ever closed.
        - Post-money math changes if only the first RMB 70m was actually funded.
        - Company secretary update and latest industrial-and-commercial filing.
      - - Cash conversion
        - Monthly 2024-2026 working-capital bridge, prepayment aging, and bad-debt / inventory-loss history.
        - A profitable but cash-hungry model should not command premium marketplace multiples.
        - Finance diligence request and treasury interview.
    notes: >-
      Each diligence ask is framed to change the investment decision rather than to fill curiosity. The list prioritizes
      valuation-moving documents first.
    claimRefs:
      - CV044
      - CV049
      - CV050
