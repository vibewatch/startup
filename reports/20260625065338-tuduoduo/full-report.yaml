  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Tuduoduo is not “all Chinese coatings” and not just finished paint sold
              through retail channels. Tuduoduo’s own surfaces show a broader industrial-procurement stack: titanium
              dioxide and ore, resins, emulsions, additives, solvents, lubricants, pigments, carbon black, packaging,
              and industrial-coatings workflows, plus warehouse, logistics, and cloud-factory services. That means the
              outer TAM is the wider China coatings-and-chemicals procurement economy, while the more useful serviceable
              lens is the subset where factories, distributors, project contractors, and exporters buy repeat industrial
              inputs that can be digitized and physically fulfilled. Public sizing is messy. China Coatings Association
              data says 2025 coating output was 34.602 million tons and revenue RMB 388.15 billion, while an Ibuychem
              summary gives about 36.5 million tons and roughly RMB 427 billion. IndexBox uses a much narrower 15
              million ton paints-and-varnishes lens, and MRFR puts industrial coatings alone at $7.69 billion in 2025.
              The diligence conclusion is not that one figure is “right,” but that Tuduoduo should be sized with
              multiple constrained lenses: total coatings output, industrial sub-segments, and the platform’s observed
              transaction footprint, while explicitly preserving boundary mismatches.
