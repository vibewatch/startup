      - number: '5.2'
        title: Architecture, fulfillment, and the TDD Global operating stack
        blocks:
          - type: paragraph
            body: >-
              Official filings and product pages consistently describe Tuduoduo as a layered digital-supply-chain
              system. Guolian's annual report says the Duoduo platforms provide cloud ERP, electronic contracts, online
              payment, smart logistics, digital factory, industrial internet, and digital-warehouse capabilities across
              multiple industrial chains, and the 2025 reply says the group is still iterating in digital supply chain,
              digital cloud factory, industrial internet, industrial big data, center warehouses, front warehouses, and
              cloud warehouses. TDD Global is the clearest productized international face of that architecture. Its
              public pages describe a workflow that starts with inquiry and supplier matching, then moves into ordering,
