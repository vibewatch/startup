      - number: '5.3'
        title: Trust, quality, and compliance controls
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence on trust and compliance comes from policy and systems disclosures rather
              than customer testimony. TDD Global's privacy policy says the platform is built on cloud ERP and cloud
              logistics, and it documents enterprise-authentication requirements that include company-registration,
              legal-representative, invoice, recipient, and order data. It also says order and transaction information
              is shared with payment institutions, suppliers, and third-party logistics providers where necessary to
              complete payment and delivery. On the security side, the main domestic site displays an information-system
              security filing and regulated online-sales credentials, while the 2024 sustainability report says the
              group maintains ISO 9001, ISO/IEC 20000-1, and ISO/IEC 27001 management certifications. That report also
              describes encryption for contract and customer data, role-based access control, monitoring and
              early-warning systems, and disaster-recovery rules. Product quality is framed as end-to-end rather than
              just pre-listing review: the sustainability report says quality control runs through procurement, sales,
              and logistics, cites Chinese product-quality and import/export inspection laws, and describes a
              Beidou-enabled cloud-logistics tracking system that monitors location and transport conditions. The result
              is a credible control story for onboarding, privacy, and shipment visibility, even though detailed
              third-party audits for every module are not public.
