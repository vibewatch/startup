        title: Milestones, Partnerships, and Adverse Context
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo's public milestone trail shows both continuity and evolution. The 2014 founding established the
              core entity; the 2017 management LP shows early formalization of insider ownership; and a 2020 group
              article already cast Liu as the platform's public strategist. In capital markets, the public record then
              surfaces a January 2024 strategic raise at RMB 14.129 billion pre-money and a December 2025 B1 round at
