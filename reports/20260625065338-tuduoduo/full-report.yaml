  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: standard
    summary: >-
      Two-dimensional heatmap placing Tuduoduo’s main risk clusters by likelihood and impact. The highest-impact cells
      are hazardous-chemical compliance failure, governance enforcement escalation, and working-capital / financing
      stress; price competition and market cyclicality sit one step lower on direct downside but remain highly likely.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
        - label: High Likelihood
          values:
            - ''
            - Data / traceability control gaps
            - Price competition and multi-homing
            - Hazchem licence or registration failure
        - label: Medium Likelihood
          values:
            - ''
            - Warehouse or customs disruption
            - Parent governance or related-party friction
            - Working-capital or repurchase stress
        - label: Low Likelihood
          values:
            - ''
            - Localized incident or outage
            - Distributor lock-in defeats migration
            - Fresh enforcement event that damages financing access
    approximationNotes: >-
      Likelihood and impact are analyst judgments based on the reviewed public evidence rather than disclosed company
      scoring. Empty cells indicate no risk in this evidence set that clearly fits the combination.
    claimRefs:
      - CR006
      - CR012
      - CR018
      - CR022
      - CR027
      - CR035
      - CR039
      - CR045
      - CR047
  - id: FR002
    title: Risk transmission map
    type: dag
    summary: >-
      Directed acyclic graph showing how regulatory burden, market weakness, and price-transparent competition flow
      through Tuduoduo’s managed-service model into margin pressure, slower cash conversion, and eventual financing
      stress.
    data:
      nodes:
        - id: r1
          label: Hazchem compliance burden
          description: >-
            The 2026 law raises the licensing, registration, storage, and transport obligations attached to chemical
            trading and warehousing.
        - id: r2
          label: Price-transparent competition
          description: >-
            1688 and other digital channels give buyers and suppliers cheaper or more visible alternatives for
            standardized inputs.
        - id: r3
          label: Property and export weakness
          description: China coatings demand, pricing, and export quality remain under cyclical and trade pressure.
        - id: r4
          label: Higher operating friction
          description: >-
            More compliance steps, partner coordination, and documentation needs slow transactions and raise execution
            cost.
        - id: r5
          label: Margin compression
          description: Competitive pricing and input-cost volatility narrow spread economics and service profitability.
        - id: r6
          label: Slower cash conversion
          description: Large prepayments, receivables, or repurchase obligations consume cash faster than collections replenish it.
        - id: r7
          label: Financing and valuation pressure
          description: >-
            If margin and cash conversion weaken together, external investors gain leverage and valuation support
            deteriorates.
      edges:
        - from: r1
          to: r4
          label: adds permits, checks, and audit exposure
        - from: r2
          to: r5
          label: forces lower pricing or lower take rate
        - from: r3
          to: r5
          label: weakens demand and price realization
        - from: r4
          to: r6
          label: raises working-capital and error costs
        - from: r5
          to: r6
          label: reduces cash generation
        - from: r6
          to: r7
          label: forces heavier dependence on outside capital
    approximationNotes: >-
      The graph is simplified and focuses on the main public causal chain. It omits second-order mitigants such as
      selective pass-through, product-mix upgrades, or private contract protections that are not disclosed in the public
      record.
    claimRefs:
      - CR006
      - CR018
      - CR022
      - CR028
      - CR035
      - CR039
      - CR042
      - CR045
      - CR046
  - id: FR003
    title: Dependency map
    type: dag
    summary: >-
      Directed dependency graph showing the external pillars Tuduoduo relies on: parent governance, regulators,
      ports/customs infrastructure, suppliers, and capital providers. These dependencies are not equal, but all can
      create single-point failure modes.
    data:
      nodes:
        - id: d1
          label: Tuduoduo / Guolian operating stack
          description: >-
            Central industrial marketplace and managed-service workflow spanning trading, warehousing, logistics,
            settlement, and digital control.
        - id: d2
          label: Guolian parent and controllers
          description: >-
            Provide governance control, capital support, and board authority, but also transmit disclosure and
            discipline risk.
        - id: d3
          label: Hazchem regulators and customs
          description: >-
            MEM, SAMR, customs, transport, and environment authorities determine market-access and compliance
            boundaries.
        - id: d4
          label: Ports, warehouses, and logistics partners
          description: >-
            Shandong Port-linked and overseas-warehouse execution layer that converts digital orders into physical
            delivery.
        - id: d5
          label: Suppliers and merchants
          description: >-
            Provide product availability, documentation, and quality performance for both self-operated and marketplace
            transactions.
        - id: d6
          label: External investors / credit providers
          description: >-
            Equity and potentially other capital sources that matter when working-capital intensity rises or valuation
            support weakens.
        - id: d7
          label: Construction / coatings end markets
          description: The demand base whose cyclicality ultimately determines throughput, price realization, and customer health.
      edges:
        - from: d2
          to: d1
          label: controls governance and capital decisions
        - from: d3
          to: d1
          label: grants or constrains licences and market access
        - from: d4
          to: d1
          label: executes storage, customs, and delivery promises
        - from: d5
          to: d1
          label: supplies products and documentation quality
        - from: d6
          to: d1
          label: backs liquidity and sets investor rights
        - from: d7
          to: d1
          label: sets demand, pricing, and counterparty health
    approximationNotes: >-
      Arrows point toward Tuduoduo as the recipient of the dependency. The map deliberately aggregates many individual
      entities into a few dependency buckets so the principal single-point risks are visible.
    claimRefs:
      - CR004
      - CR005
      - CR022
      - CR023
      - CR028
      - CR032
      - CR033
      - CR035
      - CR045
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows from evidence on scale, comparables, disclosure quality, market cycle, and governance
      overhang.
    data:
      nodes:
        - id: n1
          label: Audited scale
          detail: RMB 25.52bn 2024 revenue and RMB 1.07bn 2024 net profit prove Tuduoduo is real and profitable.
        - id: n2
          label: Private mark
          detail: Official B1 documents show RMB 15.8bn pre-money and only RMB 70m first-close capital.
        - id: n3
          label: Comp lens
          detail: Revenue multiple is near Brenntag/Azelis, above Guolian/DKSH, and far below Focus/Grainger.
        - id: n4
          label: Disclosure gap
          detail: GMV, take rate, gross margin, and full preference stack remain undisclosed.
        - id: n5
          label: Cycle and governance drag
          detail: Chinese chemical demand is weak and Guolian still carries investigation and disclosure overhang.
        - id: n6
          label: Recommendation
          detail: Research-more; valuation is upper-end fair to stretched rather than obviously attractive.
      edges:
        - from: n1
          to: n3
          label: supports comping
        - from: n2
          to: n3
          label: creates valuation test
        - from: n3
          to: n6
          label: frames price appeal
        - from: n4
          to: n6
          label: reduces confidence
        - from: n5
          to: n6
          label: raises discount rate
    approximationNotes: The flow compresses several valuation lenses into a decision path; it is explanatory rather than mechanistic.
    claimRefs:
      - CV009
      - CV010
      - CV001
      - CV006
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
      - CV049
