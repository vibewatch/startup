  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public sources show a workflow that starts with free registration and discovery, then moves through contracting,
      logistics, post-sale service, and cross-sell.
    data:
      items:
        - label: Discover / register
          detail: Search, app, WeChat, livestreams, auctions, promotions, and free registration build the initial funnel
        - label: Source / compare
          detail: >-
            Buyers use price index, industry map, samples, procurement assistant, and supplier verification before
            committing
        - label: Order / contract
          detail: >-
            Direct ordering, contract review, online signature, and online payment support enterprise procurement
            execution
        - label: Deliver / warehouse
          detail: >-
            Shipping requests, warehouse coordination, bonded logistics, and cross-border routes extend the service
            beyond checkout
        - label: Support / review
          detail: After-sales tracking, customer service, and order review surfaces stay visible after delivery
        - label: Expand / repeat
          detail: >-
            Management says it pursues repurchase, ARPU expansion, and horizontal repeat-selling across the customer
            value chain
