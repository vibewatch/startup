      - number: '3.3'
        title: Pricing, switching cost, and multi-homing dynamics
        blocks:
          - type: paragraph
            body: >-
              Public commercial terms show why standardized coatings inputs are vulnerable to commoditization. On
              Made-in-China and 1688, buyers can often see price filters, MOQ cues, or factory-direct positioning before
              speaking to a seller, while Tuduoduo’s public workflow is far more quote-first and service-led. ChemNet’s
              publicly visible packaging is also telling: basic membership is free, trade leads can be posted by
              non-members, and the paid Gold Supplier tier mainly buys visibility and credibility. That suggests at
              least part of the competition is still attention brokerage rather than proprietary execution. Academic
              platform literature is directionally adverse for Tuduoduo if supplier and buyer switching cost remains
              low: once both sides can multihome, fees and profits get squeezed and the market rewards either dominant
              breadth or differentiated workflow. Tuduoduo therefore has real lock-in only where it controls several
              steps at once—procurement, settlement, logistics, warehousing, or compliance-sensitive fulfillment. Where
              a buyer merely wants to compare titanium dioxide, solvent, or resin offers, large horizontal platforms and
              local traders can be good enough. Offline distributors create a different switching barrier: technical
              service, samples, and account relationships can keep spec-heavy customers from moving procurement to a
              cheaper digital channel.
