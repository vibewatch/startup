  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation evidence and how far it really goes
        blocks:
          - type: paragraph
            body: >-
              The strongest public valuation evidence is narrower than many headline summaries imply. The December 2025
              B1 filing, plus aligned Sina and Tencent coverage, supports one clean statement: Tuduoduo was marketed at
              RMB 15.8 billion pre-money, with only RMB 70 million definitively closed on day one and up to RMB 365
              million contemplated in total. That math yields about RMB 15.87 billion post-money for the first close and
              about RMB 16.165 billion only if the full intended raise closes. This distinction matters because the
              user-facing unicorn shorthand of roughly $2.3 billion or RMB 16.5 billion is directionally close but not
              directly evidenced by the primary documents reviewed here. The 2026 unicorn-list article strengthens the
              claim that Tuduoduo belongs in the unicorn category, but it does not add a fresh priced transaction. In
              other words, unicorn status is supportable; a clean RMB 16.5 billion financing mark is not.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
