            title: Embedded workflow is real; retention disclosure is not
            body: >-
              Tuduoduo clearly operates beyond a catalog listing: ordering, contracting, payment, warehousing,
              after-sales, and merchant services are all visible. But the public set still does not disclose
              active-account counts, repeat-purchase rates, or cohort retention.
            calloutType: insight
            claimRefs:
              - CU005
              - CU009
              - CU045
          - type: callout
            title: >-
              Treat the multi-million customer headline as a marketing ceiling, not a diligence-ready active-account
              metric
            body: >-
              The 2.8 million and 2.9 million numbers are large enough to distort underwriting if read literally. None
              of the reviewed filings or app-store pages defines them as active enterprises, paying customers, or
              standalone Tuduoduo accounts.
            calloutType: risk
            claimRefs:
              - CU031
              - CU032
              - CU033
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk stack and ranking
        blocks:
          - type: paragraph
            body: >-
              Tuduoduo is not a simple classifieds marketplace; its own pages describe a business that combines
              self-operated procurement, matchmaking, cross-border trade, SaaS, supplier verification, warehousing,
              logistics, and customs-linked execution. That service depth is a real mitigant against pure search
              commoditization because it can solve harder industrial workflows than a listing board alone. But the same
              breadth also widens the company’s legal and operational perimeter. A platform that touches solvents,
              titanium dioxide, pigments, warehousing, shipping, and payment flows is exposed to hazardous-chemical
              compliance, partner execution, and working-capital risk in a way that a lighter digital intermediary is
              not. The public record therefore supports a high residual risk rating rather than a critical one: Tuduoduo
              is already large and profitable, but the strongest risks are still binary and externally monitorable,
              especially around compliance, governance, and cash-conversion quality.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR021
              - CR046
              - CR047
