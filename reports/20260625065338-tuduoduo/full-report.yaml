      - number: '3.2'
        title: Capability and GTM comparison
        blocks:
          - type: paragraph
            body: >-
              The clearest public differentiation for Tuduoduo is workflow depth rather than headline breadth. TDD
              Global’s pages emphasize verified suppliers, quote turnaround, trade assurance, LC payment, inspection,
              customs, port coordination, 50-plus warehouses, and integrated shipping, which is more service-heavy than
              a typical open marketplace. Guolian’s filing language reinforces that the domestic platform uses
              self-operated procurement, group buying, auctions, live streaming, and digital warehousing to deepen
              repeat purchase and ARPU. By contrast, 1688 competes on breadth, factory-direct pricing, and dense
              supplier discovery, but even friendly guidance admits overseas buyers still need language support,
              inspections, and freight help. Made-in-China is closer to export procurement because it visibly markets
              secure payments, verified suppliers, RFQ workflows, and international logistics. ChemNet’s strength is
              chemical-specific information, trade leads, and promotion layered with finance and data tools, while
              Molbase’s public differentiation is catalog depth plus finance. Offline distributors remain strongest
              where coatings buyers need sampling, reformulation, local stock, and application labs. In other words,
              Tuduoduo’s attack angle is a managed industrial workflow; the others win either on breadth or on deep
              technical service.
