      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The most material near-term risk is that the compliance perimeter moved higher while Tuduoduo kept
              expanding into more execution-heavy services. China’s hazardous chemicals safety law took effect on
              2026-05-01 and now covers business operations, transport, storage, use, and emergency response across the
              full lifecycle. Independent compliance write-ups say the law shifts from a narrower list mindset toward a
              broader property-based definition, adds periodic safety-assessment disclosure, and leans on multiple
              agencies for licensing, registration, customs inspection, and environmental oversight. That is manageable
              only if entity-level permits, registration files, SDS and labeling controls, and warehouse approvals are
              current across every trading and logistics entity. Publicly, those entity-by-entity licenses are not
              visible. The second legal overhang is parent governance: Guolian is still working through a long
              disclosure-control tail that included a CSRC investigation, split regulatory replies, and later exchange
              discipline.
            claimRefs:
              - CR006
              - CR007
              - CR008
