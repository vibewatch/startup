        - id: d1
          label: Supplier verification and product content
          detail: >-
            Verified suppliers, technical product pages, and procurement-assistant workflows generate sourceable
            inventory and specs.
          type: dependency
        - id: d2
          label: Transaction-control software
          detail: Cloud ERP, e-contract, payment, messaging, and enterprise-auth controls govern valid order execution.
          type: dependency
        - id: d3
          label: Warehouse / logistics network
          detail: Cloud warehouses, freight partners, scanning, inventory supervision, and tracking execute orders physically.
          type: dependency
        - id: d4
          label: Cross-border node stack
          detail: Customs, tax, port, shipping, warehousing, finance, and overseas centers enable the TDD Global model.
          type: dependency
        - id: d5
          label: Partner factories and custom-material collaborators
          detail: >-
            Cloud-factory showrooms and Sinopec-linked cooperation extend the stack into supplier operations and
            tailored material supply.
          type: dependency
        - id: d6
          label: User adoption layer
          detail: Mobile app, web, and repeat-order behavior turn the operating stack into sustained workflow usage.
          type: dependency
      edges:
        - from: d1
          to: d2
          label: verified offers become orders
        - from: d2
          to: d3
          label: software releases execution
        - from: d3
          to: d4
          label: cross-border orders need external nodes
        - from: d1
          to: d5
          label: supplier depth enables co-development
        - from: d2
          to: d6
          label: good workflow drives repeat use
        - from: d4
          to: d6
          label: service quality affects adoption
    claimRefs:
