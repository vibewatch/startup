- id: SM-growth-drivers
  title: Growth drivers for industrial procurement digitization
  body: 'Three growth engines stand out. First, national policy is supportive: MIIT’s 2026-2028 industrial-internet interpretation says China already has more than 340 influential industrial-internet platforms, more than 100 million connected devices, and targets more than 450 platforms, 120 million connected devices, and over 55% platform penetration by 2028. It explicitly endorses order-driven and supply-chain-finance services, which is close to Tuduoduo’s operating model. Second, industrial B2B demand is already very large. Guolian’s 2025 filing response cites a RMB 35.72 trillion Chinese industrial e-commerce market in 2024 and says penetration is deepening across chemicals, coatings, electronics, and logistics. Third, downstream manufacturing and export pockets remain attractive even while real estate is weak. MIIT’s May 2026 data shows NEV production of 1.554 million units and exports of 446,000 units in one month, while export licensing rules formalize the trade channel rather than
    shutting it down. TDD-global’s overseas warehouses, customs linkage, and shipping stack mean export-oriented manufacturers and traders are a real growth wedge, not just a branding story.'
