- id: TM001
  title: Market definition table
  columns:
  - segment / category
  - included spend
  - excluded spend
  - buyer / payer
  - relevance
  rows:
  - - Core coatings raw materials
    - Titanium dioxide, pigments, fillers, resins, emulsions, solvents, additives, packaging, and related chemicals bought repeatedly by industrial users
    - Retail decorative paint tins sold to DIY households
    - Procurement teams, factory buyers, distributors, traders
    - This is the cleanest public fit with Tuduoduo’s category structure and one-stop procurement positioning.
  - - Industrial coatings workflows
    - Water-based, functional, anti-corrosion, automotive, and general industrial coatings plus related formulation inputs
    - Pure residential repainting spend without industrial procurement complexity
    - Factories, formulators, project contractors, category managers
    - This is the closest served-demand lens for recurring B2B coatings commerce.
  - - Logistics / warehouse / compliance services
    - Warehousing, shipping, cloud logistics, customs linkage, supplier verification, financing-adjacent workflow support
    - Freight unrelated to chemicals or coatings
    - Supply-chain, logistics, finance, and operations budgets
    - Tuduoduo monetization and switching cost can sit in services around the chemical transaction, not only the catalog itself.
  - - Cross-border chemical trade
    - Export-oriented sourcing for titanium dioxide, resin, solvent, pigment, PVC and similar chains
    - Generic non-chemical export marketplaces
    - Trading companies, overseas buyers, export sales teams
    - TDD-global and overseas warehouses expand the served market into export-led procurement and delivery.
  - - Status-quo substitute
    - Phone / WeChat / broker procurement, incumbent distributors, direct OEM procurement, local warehouse networks
    - Consumer ecommerce and household home-improvement retail
    - Same buyer budgets as the digital channel
    - The real competitive baseline is offline trust-and-credit relationships, not only other online marketplaces.
  - - Excluded outer categories
    - Medical or cold-chain adjacencies with no coatings/chemicals overlap and household decorative retail
    - N/A
    - N/A
    - They may exist on platform surfaces, but they should not be counted inside the core market thesis for this chapter.
  notes: Boundary follows Tuduoduo’s own product and service surfaces and excludes household decorative retail; logistics and compliance are included because hazardous-goods execution is part of the buying decision.
