- id: TM003
  title: Segment / buyer map
  columns:
  - segment
  - buyer
  - user
  - payer / budget owner
  - workflow
  - adoption trigger
  rows:
  - - Coatings formulators / raw-material processors
    - Procurement manager or owner
    - Plant purchasing, lab, production planning
    - Working-capital or raw-material budget
    - Repeat sourcing of titanium dioxide, resins, emulsions, additives, solvents and packaging
    - Price transparency, trusted suppliers, and delivery reliability reduce downtime and sourcing risk.
  - - Industrial end-use factories (auto, appliance, machinery, electronics)
    - Category buyer or operations-led procurement
    - Production, coating line, quality, EHS teams
    - Operations / plant budget
    - Source coating inputs or finished industrial coatings tied to production schedules
    - Need for qualified product, compliance, and just-in-time supply rather than only low headline price.
  - - Distributors / wholesalers
    - Trading desk or distributor owner
    - Sales, warehouse, finance
    - Inventory and trade-finance budget
    - Buy in bulk, hold stock, re-sell to smaller factories and contractors
    - Need inventory turns, credit tools, shipping visibility, and supplier verification.
  - - Project / anti-corrosion contractors
    - Project procurement lead
    - Site execution teams
    - Project budget owner or contractor finance
    - Tender-driven purchase of protective systems and related chemicals
    - Delivery certainty and compliance matter because project delays are expensive.
  - - Export traders / overseas buyers
    - Trading company buyer
    - Trade ops, customs, logistics teams
    - Trade budget and working capital
    - Cross-border sourcing with warehousing, shipping, customs and documentation support
    - Overseas warehouses, customs linkage, and verified suppliers reduce export friction.
  - - Factory operations / logistics users
    - Operations or supply-chain lead
    - Warehouse, dispatch, QC, digital-factory staff
    - Operations / supply-chain systems budget
    - Use smart warehouse, cloud logistics, and VR / cloud-factory tools around procurement
    - Adoption starts when digital workflow visibly improves fulfillment speed, inventory control, or plant visibility.
  notes: Rows separate buyer, user, and payer because Tuduoduo’s value proposition spans catalog procurement, logistics execution, and digital-factory workflow rather than a single self-serve purchase motion.
