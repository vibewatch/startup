figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: The most defensible sizing stack for Tuduoduo starts from China coatings output, narrows to industrial-coatings workflows, and then uses platform-wide transaction scale only as a noisy SOM proxy.
  data:
    items:
    - label: 'Outer TAM: China coatings / paints economy'
      value: 34.6m-36.5m tons; RMB 388bn-427bn
      description: Association, Ibuychem, and IndexBox sources all agree China is huge, but they disagree on the exact boundary and unitization.
    - label: 'SAM proxy: industrial coatings and adjacent raw-material workflows'
      value: General industrial 10.04m tons / RMB 93.7bn; auto RMB 64.5bn; anti-corrosion RMB 66.7bn
      description: Public sub-segment data shows where industrial procurement sits, but the slices overlap and do not isolate Tuduoduo’s exact served subset.
    - label: 'Observed scale proxy: Tuduoduo platform footprint'
      value: 1000bn+ annual transactions; 50万+ members; 100+ warehouses
      description: Useful for judging whether the platform is already large operationally, but not a publishable coatings-only SOM.
  approximationNotes: The middle layer uses overlapping industrial segments as serviceable-market proxies, and the bottom layer is platform-wide operating scale rather than a true market-share denominator.
