  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-size-definition
    missingEvidence: A harmonized public definition that reconciles China coatings output, industrial coatings value, and paints-and-varnishes tonnage across association and analyst sources.
    whyItMatters: Without a common denominator, point TAM claims can look precise while actually mixing incompatible boundaries and units.
    diligencePath: Obtain the full China Coatings Association / Ibuychem segment tables and rebuild one normalized coatings taxonomy before valuation work.
    relatedQuestionRefs:
    - QM004
    - QM022
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: coatings-only-sam
    missingEvidence: A public split of Tuduoduo or Guolian transaction volume, active buyers, and supplier count attributable specifically to coatings or coating-input chains.
    whyItMatters: This is the main blocker to turning broad industrial-ecommerce or platform-wide GMV into a defensible coatings-focused SAM.
    diligencePath: Request management disclosure or customer-level internal dashboards that separate titanium/coatings/resin/solvent chains from the rest of the platform.
    relatedQuestionRefs:
    - QM005
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: som-market-share
    missingEvidence: Cohort data on repeat coatings buyers, take rate, average order size, and coatings-only GMV or revenue contribution.
    whyItMatters: Without transaction-cohort detail, Tuduoduo’s true SOM, retention, and unit economics inside the coatings vertical cannot be estimated from public data.
    diligencePath: Ask for internal KPI packs by vertical and reconcile them to audited revenue / GMV disclosures.
    relatedQuestionRefs:
    - QM024
  - type: access-blocked
    severity: minor
    topic: official-industrial-breakout
    missingEvidence: An open official table that cleanly breaks out industrial coatings by end use, region, and buyer type in machine-readable form.
    whyItMatters: Open-source diligence can size directionally, but not with the precision needed for sub-vertical share assumptions.
    diligencePath: Pull Chinese-language paid reports or direct association tables and link them to NBS / customs series for triangulation.
    relatedQuestionRefs:
    - QM005
    - QM015
    relatedTableRefs:
    - TM002
    - TM003
