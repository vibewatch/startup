- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver / constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Industrial internet policy and platform scaling targets
    - positive
    - 2026-2028
    - MIIT is explicitly pushing scenario-driven platform use, data models, and supply-chain services that make vertical industrial procurement easier to institutionalize.
    - Test whether Tuduoduo is winning platform share in coatings-specific workflows or merely riding generic policy tailwinds.
  - - Industrial B2B market size and vertical penetration
    - positive
    - current
    - A RMB 35.72tn industrial-ecommerce market means Tuduoduo is surfing a large procurement-digitization wave, not creating one from zero.
    - Check how much of Guolian’s addressable growth still comes from coatings/chemicals rather than other chains.
  - - NEV production and exports
    - positive
    - current
    - Automotive and battery-linked manufacturing still creates coating demand even while broader manufacturing is mixed.
    - Map which Tuduoduo categories directly benefit from EV, electronics, and export OEM programs.
  - - Overseas warehouses and customs-linked shipping
    - positive
    - current to medium term
    - Cross-border warehouses and port linkage expand the served market into export procurement and after-sales logistics.
    - Verify actual coatings/chemical throughput through the overseas network, not only warehouse count.
  - - Hazardous chemicals safety law
    - negative
    - from May 2026
    - Chemical logistics requires compliant storage, transport, and emergency handling, raising the execution bar for digital marketplaces.
    - Identify which core Tuduoduo categories are legally hazardous and what share already moves through compliant partners.
  - - Real-estate / new-build slowdown
    - negative
    - current and multi-year
    - Residential new-build weakness drags architectural coatings and associated chemical demand for years, especially in lower-tier cities.
    - Separate construction-linked weakness from industrial/export-linked resilience when sizing demand.
  - - Feedstock and geopolitical cost volatility
    - negative
    - current
    - Energy, methanol, sulfur, and titanium-dioxide-related cost shocks can compress margins and force procurement timing changes.
    - Measure whether Tuduoduo’s information/index tools actually help customers manage volatility better than offline channels.
  - - Trust, prepayments, and offline relationships
    - negative
    - structural
    - Verified suppliers, trade assurance, and large prepayments show that switching from offline to platform procurement is not frictionless.
    - Request churn, repeat-order, and credit-loss data to quantify how sticky buyer behavior really is.
  notes: The same market can be structurally attractive and still adopt slowly; regulation, working capital, and end-market weakness matter as much as the macro digitization story.
