  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: take-rate-and-gmv
    missingEvidence: Standalone Tuduoduo GMV, take rate, and revenue-recognition bridge by self-operated, matchmaking, cross-border, and SaaS lines.
    whyItMatters: Without GMV and take rate, outsiders cannot separate platform economics from gross trading scale or judge the quality of reported revenue.
    diligencePath: Request monthly GMV, net revenue, and recognized gross-versus-net bridge by business mode for 2024, 2025, and the latest trailing twelve months.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-debt
    missingEvidence: Standalone Tuduoduo cash balance, debt balance, bank-credit usage, guarantees, covenant terms, and runway analysis.
    whyItMatters: The 2024 negative operating cash flow and repeated equity support imply financing dependency, but the public record does not reveal whether the platform is comfortably funded or structurally reliant on outside capital.
    diligencePath: Request the latest management balance sheet, debt schedule, facility agreements, guarantee schedule, and monthly cash-burn or cash-generation bridge.
    relatedQuestionRefs:
    - QI023
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-pricing
    missingEvidence: Gross margin, contribution margin, realized pricing, discounting, and service-fee rates for Tuduoduo’s trading, cross-border, and SaaS lines.
    whyItMatters: Revenue alone cannot show whether the platform earns durable economic spreads or relies on thin trading margins plus working-capital leverage.
    diligencePath: Request margin bridge, realized pricing schedules, service-fee cards, and customer-level contribution analysis.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI002
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-and-supplier-concentration
    missingEvidence: Top-customer and top-supplier concentration, aging, bad-debt history, and exposure to stressed counterparties.
    whyItMatters: Supplier concentration and buyer concentration can turn a profitable trading platform into a volatile working-capital business, especially when prepayments and title-transfer trades are meaningful.
    diligencePath: Request top-10 customer and supplier schedules, aging buckets, impairment history, and concentration covenants used internally by risk teams.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: minor
    topic: 2024-january-valuation-step-up
    missingEvidence: An official filing or board-resolution source for the RMB 14.129 billion January 2024 valuation referenced in later news summaries.
    whyItMatters: The exact cadence of valuation step-ups matters for interpreting whether B1 reflected operating progress or secondary-market promotion, but the reviewed public fetches did not produce the primary filing for the January 2024 step.
    diligencePath: Search the board-resolution and equity-change announcements around January 2024 on CNINFO and request the exact cap-table change file from investor relations.
    relatedQuestionRefs:
    - QI023
  - type: private-evidence-only
    severity: material
    topic: platform-credit-book
    missingEvidence: A platform-specific list of supply-chain-finance or credit products, direct credit exposure, guarantee obligations, and loss history attributable to Tuduoduo.
    whyItMatters: Official materials repeatedly describe digital supply chain, warehousing, title transfer, and “产融” services, but they do not show whether Tuduoduo is taking balance-sheet credit risk or mainly facilitating trade.
    diligencePath: Request product-level exposure reports, guarantee schedules, historical losses, and relationships with funding partners or banks.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
