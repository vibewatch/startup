- id: working-capital-financing-and-capital-intensity
  title: Working capital, financing, and capital intensity
  body: 'The most important financial caution is that Tuduoduos model appears profitable but working-capital hungry. The 2025 accounting-reply filings say the self-operated business forecasts demand, procures from suppliers, and may use prepayments to ask suppliers to stock inventory for later customer orders. That is consistent with Tuduoduos audited 2024 operating cash outflow of RMB354 million despite RMB1.07 billion of net profit, a sharp reversal from positive operating cash flow in 2023. Parent-level regulatory replies reinforce the same pattern: group prepayments reached RMB7.69 billion in 2024 and impairment on prepayments rose sharply, showing that supplier advances and delivery risk are financially material to the broader trading model. Equity support is visible. Tuduoduo raised RMB306 million in the 2023 A round at a RMB13.0 billion pre-money valuation, then launched the 2025 B1 round at a RMB15.8 billion pre-money valuation with up to RMB365 million of new capital earmarked for
    balance-sheet optimization, operating capital, digital supply chain, and cloud factories. But those rounds also create contingent repurchase obligations, so they are not frictionless capital.'
