- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Why it matters
  - Evidence quality
  - Diligence ask
  rows:
  - - Cash on hand
    - Undisclosed at standalone Tuduoduo level.
    - Without cash, outsiders cannot judge runway or shock absorption.
    - Not publicly disclosed.
    - Request latest cash, restricted cash, and unused facilities.
  - - Monthly burn / runway months
    - Undisclosed.
    - Needed to judge whether recent financing was opportunistic or necessary.
    - Not publicly disclosed.
    - Request monthly burn, stress-case burn, and runway by scenario.
  - - 2023 A-round equity support
    - RMB 306m at RMB 13.0bn pre-money.
    - Shows Guolian can attract strategic outside capital into the platform.
    - Official filing.
    - Request full cap table after every 2023-2025 round.
  - - 2025 B1 equity support
    - Up to RMB 365m at RMB 15.8bn pre-money; first disclosed closing diluted Guolian to 75.59%.
    - Provides fresh external valuation support and working-capital relief.
    - Official filing.
    - Request proceeds received to date, remaining closings, and investor rights schedule.
  - - Planned use of funds
    - Optimize asset-liability structure, reserve operating capital, expand industrial e-commerce, and build digital supply chain / cloud factories.
    - Implies management sees balance-sheet capacity and expansion funding as active needs.
    - Official filing.
    - Request detailed use-of-proceeds budget and timing.
  - - Debt / contingent obligations
    - No standalone debt balance disclosed, but 2023 and 2025 financing agreements contain 10% and 7.5% repurchase formulas under trigger events.
    - Repurchase clauses can turn strategic equity into future cash obligations.
    - Official filings disclose the formulas but not probability of exercise.
    - Request all debt, guarantees, repurchase triggers, and covenant terms.
  notes: This table separates what is public from what is missing. Equity-round terms are public; standalone liquidity, debt, and runway are not.
