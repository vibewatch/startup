- id: underwriting-view-and-diligence-blockers
  title: Underwriting view and diligence blockers
  body: The underwriting answer is therefore mixed. On the positive side, audited subsidiary disclosures confirm that Tuduoduo is large, profitable, growing, and strategically central to Guolian. On the negative side, the parent has had to restate 2024 revenue and cost lines after more conservative net-revenue treatment, the CSRC investigation announced in late 2023 remains a real overhang, and the SSE disciplinary decision in 2025 criticized inaccurate disclosures, delayed regulatory replies, and misuse of a small amount of proceeds. Those issues do not prove the platform economics are unsound, but they materially reduce confidence in headline revenue as a clean proxy for monetization quality. Just as importantly, public sources still do not disclose Tuduoduos standalone take rate, GMV, gross margin, customer concentration, direct debt balances, liquidity runway, or any platform-specific supply-chain-finance credit book. The right conclusion is that Tuduoduo looks like a real profit center
    with clear balance-sheet needs, but it still requires private diligence to separate durable platform economics from trading-scale optics.
