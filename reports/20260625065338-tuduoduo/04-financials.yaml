- id: TI002
  title: Pricing / monetization table
  columns:
  - Surface
  - Price / unit / contract
  - What is public
  - What is missing
  - Implication
  rows:
  - - Self-operated industrial trading
    - Undisclosed; likely realized through gross merchandise spread or procurement/service economics.
    - Official filings confirm the activity but not price realization.
    - No take rate, no gross margin, no contract economics by vertical.
    - Headline revenue overstates what investors can infer about monetization quality.
  - - Matchmaking / merchant marketplace
    - Undisclosed commission, listing, or service-fee model.
    - Platform functions are public.
    - No public schedule for commissions, merchant fees, or auction monetization.
    - The asset-light portion of the business cannot be valued from public data.
  - - Cross-border services
    - Undisclosed bundled pricing across transaction, customs, logistics, warehousing, and finance-related services.
    - TDD-global markets an integrated service stack.
    - No separate cross-border revenue or margin disclosure.
    - Cross-border may improve mix, but public evidence does not prove it yet.
  - - SaaS modules
    - Undisclosed module pricing.
    - Specific tools are named on official pages.
    - No recurring-fee disclosure or contract structure.
    - SaaS could raise quality of revenue, but that remains hypothetical publicly.
  - - Cloud warehouse / digital supply-chain tools
    - Undisclosed fees for online leasing, settlement, inventory supervision, or title transfer services.
    - Service features are public in Horgos and related official pages.
    - No fee card, utilization data, or loss experience.
    - Service attach may matter economically but is impossible to underwrite from public sources.
  notes: Public evidence proves product surfaces and service modules, not realized pricing or discounting. “Undisclosed” here means the reviewed public sources did not provide list or realized pricing.
