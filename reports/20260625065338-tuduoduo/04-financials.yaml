- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public status
  - Exact diligence path
  rows:
  - - Standalone GMV and take rate
    - Needed to distinguish marketplace economics from gross trading scale.
    - Not publicly disclosed.
    - Request monthly GMV, net revenue, and take rate by business mode.
  - - Gross margin and contribution margin
    - Needed to test whether profitability is durable after logistics, financing, and service costs.
    - Not publicly disclosed.
    - Request audited gross margin bridge by self-operated, matchmaking, cross-border, and service lines.
  - - Cash, debt, and bank-credit usage
    - Needed to judge financing dependency and downside risk.
    - Not publicly disclosed.
    - Request latest balance sheet, facilities, guarantees, and debt maturity ladder.
  - - Customer concentration and bad-debt exposure
    - Needed to test resilience if large buyers or suppliers weaken.
    - Not publicly disclosed.
    - Request top-10 customer and supplier exposure, aging, and impairment history.
  - - Pricing realization and discounting
    - Needed to know whether platform services are high-value or merely bundled into trading spreads.
    - Not publicly disclosed.
    - Request contract samples and realized pricing by service line.
  - - Supply-chain-finance product book
    - Needed to determine whether Tuduoduo is taking direct credit risk or only facilitating trade.
    - Not publicly disclosed in the reviewed sources.
    - Request product list, credit exposure, guarantees, loss history, and funding partners.
  notes: These are the main blockers that prevent a public-only underwriting case despite strong evidence that Tuduoduo is already a scaled and profitable platform.
