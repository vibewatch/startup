company:
  name: Tuduoduo
chapter:
  number: 4
  title: Financials
  summary: 'Tuduoduo is already a large and audited-profitable Guolian subsidiary, with RMB25.52 billion of 2024 revenue and RMB1.07 billion of 2024 net profit disclosed in official filings. But the platform still looks working-capital intensive: 2024 operating cash flow turned negative, parent disclosures show large prepayments and revenue-recognition corrections, and recent financing rounds include contingent repurchase obligations. The result is a credible scale-and-profit story with real diligence blockers around take rate, GMV, margin quality, debt, liquidity, and credit exposure.'
sections:
- id: monetization-and-revenue-recognition
  title: Monetization and revenue recognition
  body: 'Tuduoduo is not a pure software subscription story. Official company pages describe a revenue stack built from B2B industrial-goods trading, digital supply-chain services, industrial digital services, industrial big-data services, and a cross-border layer, with explicit monetization surfaces in self-operated e-commerce, matchmaking e-commerce, cross-border e-commerce, and SaaS modules such as online ordering, e-signature, online payment, and cloud ERP. Parent filings add the financially important detail that the broader group still derives 99.65% of revenue from online commodity trading, which means the consolidated economics remain dominated by trading flows rather than software fees. The 2025 regulatory-reply filings also explain why reported revenue can mislead: transactions with physical movement are generally booked gross when the company is principal, while title-transfer transactions without physical movement are increasingly booked net on a principal-agent analysis. That
    accounting split likely improves revenue quality, but it also means outsiders cannot infer take rate or GMV from headline revenue alone.'
