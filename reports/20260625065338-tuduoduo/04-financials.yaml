- id: public-scale-profitability-and-trajectory
  title: Public scale, profitability, and trajectory
  body: Public filings establish that Tuduoduo is already large and profitable on an audited basis, not just a promotional growth asset. The 2023 A-round filing showed 2022 revenue of about RMB20.1 billion and net profit of RMB719 million. The 2024 annual report and the 2025 B1 filing then showed audited 2023 revenue of RMB23.63 billion and 2024 revenue of RMB25.52 billion, while audited net profit rose from RMB1.01 billion in 2023 to RMB1.07 billion in 2024. That implies roughly 8.0% revenue growth, 5.6% net-profit growth, and a 2024 net margin of about 4.2%. Relative to Guolians 2024 consolidated results, Tuduoduo appears to account for nearly half of group revenue and more than 60% of total net profit, making it a real earnings engine rather than a peripheral business. The 2025 B1 materials further disclosed September 2025 revenue of RMB22.13 billion and net profit of RMB871 million for the first three quarters, showing continued scale but not enough public detail to judge unit economics
    or revenue quality by line.
