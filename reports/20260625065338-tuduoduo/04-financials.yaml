tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public evidence
  - Current status
  - Revenue-quality view
  - Diligence ask
  rows:
  - - Self-operated industrial e-commerce
    - Platform buys or arranges supply and sells industrial goods through its own mall.
    - Official pages and filing replies describe self-operated transactions and procurement/fulfillment flows.
    - Clearly active and still economically central.
    - High confidence on scale; lower confidence on contribution margin by category.
    - Request gross margin, inventory turns, and bad-debt history by product family.
  - - Matchmaking e-commerce
    - Merchant onboarding, listing, auction, and transaction matching on the open platform.
    - Official pages describe merchant flagship stores, listing systems, and auction functionality.
    - Clearly active.
    - Likely lighter-capital than self-operated trading, but monetization take rate is undisclosed.
    - Request commission rates, listing fees, and matched-volume share.
  - - Cross-border e-commerce
    - Cross-border marketing, sourcing, transaction, logistics, warehousing, customs, and related services.
    - TDD-global and official news pages describe one-stop cross-border supply-chain services.
    - Growing but not separately disclosed in standalone revenue.
    - Potentially higher-service mix, but still tied to trade flow and logistics execution.
    - Request cross-border revenue, gross profit, and working-capital intensity.
  - - SaaS and workflow tools
    - Online ordering, e-signature, online payment, cloud ERP, video authentication, and cloud meetings.
    - Official about page names specific modules.
    - Active as value-added services.
    - Strategically attractive, but public sources do not quantify fee revenue.
    - Request standalone SaaS ARR or service-fee revenue and retention.
  - - Digital supply-chain / warehousing services
    - Smart logistics, digital warehousing, title transfer, inventory supervision, and cloud-warehouse services.
    - Annual report and Horgos cloud-warehouse page describe these services.
    - Clearly active and expanding.
    - Improves stickiness but may still consume capital if tied to inventory supervision.
    - Request fee schedules, utilization, and loss ratios.
  - - Industrial digital / big-data services
    - Data, digitalization, cloud-factory, and industry-specific decision support.
    - Official pages position industrial digital services and big-data services as core business bodies.
    - Active but financially opaque.
    - Could support higher-quality revenue if recurring, but disclosure is insufficient.
    - Request digital-service revenue mix, implementation costs, and renewal rates.
  notes: Partial public enumeration of Tuduoduo monetization surfaces as of 2026-06-25; official sources describe the mechanisms but not the revenue mix or realized monetization of each line.
