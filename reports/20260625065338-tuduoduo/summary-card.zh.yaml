  topStrengths:
    - 经审计子公司披露显示出民营平台少见的规模：2024 年收入 RMB25.52 billion，2024 年净利润 RMB1.07 billion。
    - 产品栈不止撮合信息，还延伸到支付、物流、仓储、交易流程和跨境服务，能加深工业买家与供应商的切换成本。
    - Guolian 的控制权、资本入口和品类生态，让 Tuduoduo 在供给侧的位置强于多数独立垂直 marketplace。
  topRisks:
    - Guolian 仍在处理调查、重述和交易所纪律处分余波，母公司治理和会计包袱依然重大。
    - 危险化学品、仓储和跨境履约把合规边界拉大，已经超出轻量 marketplace 模式。
    - 公开证据仍没有清楚界定活跃客户、抽佣率、毛利率或完整单位经济性，难以高确定性支撑 RMB15.8 billion 估值。
  unresolvedGaps:
    - Tuduoduo 子公司 2025 全年经审计报表仍未公开，包括现金流、毛利率以及任何债务或担保细节。
    - 2.8 million 至 2.9 million 客户 / 会员口径，没有与活跃企业、付费账户或仅属于 Tuduoduo 的买家对齐。
    - 公开记录没有确认 RMB70 million 首笔资金后，计划中的 RMB365 million B1 融资是否全部完成。
    - 实体层面的许可、备案以及 SDS / 危险化学品合规证据，尚未在公开渠道完整披露。
