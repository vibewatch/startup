summary:
  headline: >-
    Tuduoduo is a scaled and profitable industrial B2B platform with credible category depth, but unresolved
    parent-governance, compliance, and disclosure gaps keep the supportable call at research-more rather than buy.
  overallScore: 6.4
  recommendation: research-more
