  topStrengths:
    - >-
      Audited subsidiary disclosures show rare scale for a private platform: RMB25.52 billion of 2024 revenue and
      RMB1.07 billion of 2024 net profit.
    - >-
      The product stack goes beyond listings into payments, logistics, warehousing, trade workflows, and cross-border
      services, which can deepen switching costs for industrial buyers and suppliers.
    - >-
      Guolian's control, capital access, and category ecosystem give Tuduoduo a stronger supply-side position than most
      stand-alone vertical marketplaces.
  topRisks:
    - >-
      Parent governance and accounting overhang remain material because Guolian is still dealing with investigation,
      restatement, and exchange-discipline fallout.
    - >-
      Hazardous-chemical, warehousing, and cross-border execution expand the compliance perimeter beyond a lightweight
      marketplace model.
    - >-
      Public evidence still does not define active customers, take rate, gross margin, or full unit economics cleanly
      enough to underwrite the RMB15.8 billion mark with high conviction.
  unresolvedGaps:
    - >-
      Audited full-year 2025 Tuduoduo subsidiary statements, including cash flow, gross margin, and any debt or
      guarantee detail, are still not public.
    - >-
      The 2.8 million to 2.9 million customer/member headline is not reconciled to active enterprises, paying accounts,
      or Tuduoduo-only buyers.
    - >-
      The public record does not confirm whether the full planned RMB365 million B1 financing closed after the RMB70
      million first tranche.
    - >-
      Entity-level permits, registrations, and SDS / hazardous-chemical compliance evidence are not fully disclosed on
      public surfaces.
