- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Workflow depth in procurement + warehousing + settlement
    - 1688 and Made-in-China can still win standardized SKUs on search speed and public price discovery
    - High
    - If products are easy to specify and compare, buyers can multi-home with little friction
    - Quantify how much GMV sits in service-heavy repeat workflows versus one-off commodity sourcing
  - - Chemical-chain specialization
    - ChemNet and Molbase already own chemical-specific traffic, directories, data, or catalog search
    - Medium
    - Specialization alone is not exclusive if peers also build vertical tools
    - Show supplier overlap, repeat-order retention, and conversion advantage versus chemical-specific platforms
  - - Cross-border infrastructure
    - Large horizontal platforms and logistics providers can imitate shipping, warehousing, and customs services
    - Medium
    - Service replication narrows differentiation unless Tuduoduo has better execution or economics
    - Request warehouse utilization, route density, delivery SLA, and gross margin by logistics product
  - - Customer stickiness from digital supply chain
    - Public filings show continued scrutiny around transaction documentation and net-vs-gross recognition
    - High
    - Trust erosion can offset any lock-in claimed from digital workflow integration
    - Review audit trail quality, customer complaints, and whether enterprise buyers require extra controls before scaling spend
  - - Exposure to China coatings demand
    - Weak construction demand, fragmented supply, and price wars compress platform bargaining power
    - High
    - Macro softness makes buyers more price-sensitive and supplier loyalty weaker
    - Stress-test the model by end-market, especially architectural coatings and construction-linked chemicals
  - - Offline channel displacement
    - Distributors keep high-touch technical accounts through labs, samples, and local warehousing
    - High
    - Spec-heavy CASE and performance coatings may not migrate online on price alone
    - Map customer cohorts by need for formulation support and identify where online conversion has actually succeeded
  notes: Severity reflects underwriting risk to competitive durability, not certainty of failure; each row translates the public evidence into a diligence agenda rather than a binary judgment.
