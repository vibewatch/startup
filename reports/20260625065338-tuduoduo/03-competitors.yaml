chapter:
  number: 3
  title: Competitors
  summary: 'Tuduoduo competes less with one perfect like-for-like marketplace than with three clusters: broad horizontal sourcing platforms such as 1688 and Made-in-China, vertical chemical networks such as ChemNet and Molbase, and offline specialty distributors such as DKSH, Brenntag, and Azelis. Its strongest public differentiation is workflow depth—self-operated procurement, warehousing, logistics, settlement, and cross-border services—while its weakest flank is standardized chemical sourcing, where public price discovery, multi-homing, and distributor technical-service lock-in make moat durability only moderate.'
sections:
- id: landscape-overview
  title: 'Landscape Overview: direct, adjacent, and status-quo competitors'
  body: Tuduoduo (涂多多 / Toodudu) does not face a single obvious like-for-like online rival; instead it competes against three clusters that solve overlapping procurement jobs. First are broad horizontal marketplaces led by 1688 and Made-in-China, which reduce search cost through public listings, quotes, MOQ filters, and very large supplier pools. Second are chemical-specialist digital platforms such as ChemNet and Molbase, which are more vertical than 1688 but still skew toward discovery, trade leads, media, catalog depth, and finance tools rather than Tuduoduo’s self-operated coatings workflow. Third are offline and hybrid specialty distributors such as DKSH, Brenntag, and Azelis, which win when buyers need inventory certainty, formulation help, regulatory support, or account management rather than just a lower posted price. Public filings and Tuduoduo’s own pages show that the company tries to sit between these clusters by pairing self-operated procurement with matching, SaaS, cross-border,
    warehousing, logistics, and settlement. That positioning is real, but it also means Tuduoduo is most exposed wherever coatings inputs behave like standardized commodities and buyers can shop several channels in parallel.
