  - type: private-evidence-only
    severity: material
    topic: finance-penetration
    missingEvidence: Adoption, approval, and default data for letter-of-credit, supply-chain finance, and trade-credit products across the compared platforms.
    whyItMatters: Publicly advertised finance tools matter only if buyers use them at scale and if credit performance is sustainable.
    diligencePath: Ask for finance GMV, approval rates, average tenor, delinquency, and loss metrics by platform and by customer cohort.
