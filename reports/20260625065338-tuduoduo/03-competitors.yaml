  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Platform-level realized buyer fees, rebates, take rates, and net revenue economics by service line for Tuduoduo, ChemNet, Molbase, and offline distributors.
    whyItMatters: Without realized economics, the pricing table can compare public packaging only and cannot prove whether Tuduoduo wins on total cost after credit, warehousing, and service fees.
    diligencePath: Request customer contracts, internal pricing decks, and cohort-level monetization by product/workflow.
    relatedQuestionRefs:
