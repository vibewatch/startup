- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Hazchem licence / registration gap
    - Entity-level permit or registration review
    - Any key trading, storage, or warehouse entity lacks required licence, registration, or Chinese SDS / label support
    - Immediate legal red flag; pause new capital until the compliance map is complete and remediated.
  - - Governance overhang re-escalates
    - New CSRC / SSE filing, sanction, or delayed reply
    - Fresh enforcement action, no closure of prior investigation, or another material disclosure correction
    - Raise residual risk toward critical and haircut valuation multiples.
  - - Cash-conversion deterioration
    - Prepayments, receivables, or reserve ratios in periodic disclosures
    - Another step-change in prepayments, reserve ratios, or working-capital intensity without equal improvement in collections
    - Treat margin and liquidity risk as thesis-breaking until underwritten with detailed book data.
  - - Price and demand compression
    - China coatings output, pricing, and construction indicators
    - Another year of negative pricing plus worsening construction or export data
    - Lower volume / spread expectations and underwrite to thinner contribution margins.
  - - Operational interruption
    - Material warehouse, customs, port, or data incident
    - Any disclosed interruption that halts fulfillment, creates safety citation, or corrupts transaction traceability
    - Require incident review, insurance analysis, and revised operational controls before follow-on funding.
  - - Financing structure turns coercive
    - Repurchase-right negotiation or failed liquidity path
    - Investor demands for buyback, bridge financing under pressure, or parent unwillingness to support liquidity
    - Reassess ownership, downside recovery, and governance alignment before committing more capital.
  notes: Triggers are intentionally binary and externally monitorable. They are designed for investment surveillance rather than for operational management dashboards.
