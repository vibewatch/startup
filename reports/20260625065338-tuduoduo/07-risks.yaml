- id: mitigants-monitoring-and-kill-criteria
  title: Mitigants, monitoring, and kill criteria
  body: 'Tuduoduo does have real mitigants. It already operates at scale, it markets supplier verification and inspection, it has an articulated warehousing and logistics network, and the parent at least discloses some governance and data-control frameworks. Those factors distinguish it from a pure low-friction lead-gen platform. But the right underwriting posture is to treat mitigants as provisional until they are validated at the entity and control level. The first monitoring layer should therefore be binary: do all relevant licenses and registrations exist, does the parent exit the investigation-and-discipline cycle cleanly, and do working-capital indicators improve rather than deteriorate? The second layer should track market transmission: if China coatings demand, export quality, or price realization weaken further, Tuduoduo’s managed-service breadth may not protect spread economics. A credible investment memo should therefore embed explicit kill criteria and not rely on headline revenue
    or valuation alone.'
