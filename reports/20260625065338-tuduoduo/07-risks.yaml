  evidenceGaps:
  - type: missing-source
    severity: material
    topic: hazchem-licenses
    missingEvidence: Entity-by-entity hazardous-chemical business licences, storage approvals, registration numbers, and Chinese SDS / label control files for every Tuduoduo trading and warehouse affiliate.
    whyItMatters: The legal framework is now explicit, so the real diligence question is whether every relevant entity is actually authorized for the products and workflows it touches.
    diligencePath: Request a legal-entity compliance matrix covering products handled, warehouse sites, local permits, registration IDs, renewal dates, and regulator correspondence.
    relatedQuestionRefs:
    - QR005
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: end-market-exposure
    missingEvidence: Revenue, GMV, margin, and customer exposure split by construction-linked coatings demand, export-sensitive categories, and major product chains.
    whyItMatters: Public macro sources show cyclicality, but investors still cannot quantify how much of Tuduoduo’s economics sit in the most fragile end markets.
    diligencePath: Request monthly 2024-2026 mix data by chain, domestic versus export channel, gross spread, and top end-use buckets.
    relatedQuestionRefs:
    - QR017
    - QR018
    - QR019
    - QR028
  - type: private-evidence-only
    severity: material
    topic: supply-chain-finance-and-credit
    missingEvidence: Platform-specific supply-chain-finance balances, guarantees, bad-debt history, related-party approval files, and aged prepayment / receivable books.
    whyItMatters: Working-capital stress is already visible in public filings, but the real downside depends on hidden recourse, concentration, and loss history.
    diligencePath: Request financing-book detail, counterparty aging, loss vintages, and all related-party or connected-fund approvals.
    relatedQuestionRefs:
    - QR010
    - QR011
    - QR026
    - QR028
  - type: access-blocked
    severity: minor
    topic: incident-history
    missingEvidence: Thirty-six months of cyber, outage, quality, warehouse-safety, and insurance-loss logs tied specifically to Tuduoduo entities.
    whyItMatters: Public sources describe controls but not failure history, making it impossible to calibrate operational resilience from public evidence alone.
    diligencePath: Request incident registers, external cybersecurity assessments, warehouse inspection records, and claims files.
    relatedQuestionRefs:
    - QR016
    - QR028
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: A complete list of every hazardous-chemical operating entity, warehouse, permit class, and any open litigation or local safety citation.
    whyItMatters: The risk register is directionally robust, but entity-level completeness is what determines whether the legal risk is contained or merely hidden.
    diligencePath: Map every entity and warehouse to permit status, local regulator, inspection cadence, and any open legal matter.
    relatedQuestionRefs:
    - QR005
    - QR029
    relatedTableRefs:
    - TR001
