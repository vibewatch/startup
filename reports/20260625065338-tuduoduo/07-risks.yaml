- id: FR002
  title: Risk transmission map
  type: dag
  summary: Directed acyclic graph showing how regulatory burden, market weakness, and price-transparent competition flow through Tuduoduo’s managed-service model into margin pressure, slower cash conversion, and eventual financing stress.
  data:
    nodes:
    - id: r1
      label: Hazchem compliance burden
      description: The 2026 law raises the licensing, registration, storage, and transport obligations attached to chemical trading and warehousing.
    - id: r2
      label: Price-transparent competition
      description: 1688 and other digital channels give buyers and suppliers cheaper or more visible alternatives for standardized inputs.
    - id: r3
      label: Property and export weakness
      description: China coatings demand, pricing, and export quality remain under cyclical and trade pressure.
    - id: r4
      label: Higher operating friction
      description: More compliance steps, partner coordination, and documentation needs slow transactions and raise execution cost.
    - id: r5
      label: Margin compression
      description: Competitive pricing and input-cost volatility narrow spread economics and service profitability.
    - id: r6
      label: Slower cash conversion
      description: Large prepayments, receivables, or repurchase obligations consume cash faster than collections replenish it.
    - id: r7
      label: Financing and valuation pressure
      description: If margin and cash conversion weaken together, external investors gain leverage and valuation support deteriorates.
    edges:
    - from: r1
      to: r4
      label: adds permits, checks, and audit exposure
    - from: r2
      to: r5
      label: forces lower pricing or lower take rate
    - from: r3
      to: r5
      label: weakens demand and price realization
    - from: r4
      to: r6
      label: raises working-capital and error costs
    - from: r5
      to: r6
      label: reduces cash generation
    - from: r6
      to: r7
      label: forces heavier dependence on outside capital
  approximationNotes: The graph is simplified and focuses on the main public causal chain. It omits second-order mitigants such as selective pass-through, product-mix upgrades, or private contract protections that are not disclosed in the public record.
  claimRefs:
  - CR006
  - CR018
  - CR022
  - CR028
  - CR035
  - CR039
  - CR042
  - CR045
  - CR046
- id: FR003
  title: Dependency map
  type: dag
  summary: 'Directed dependency graph showing the external pillars Tuduoduo relies on: parent governance, regulators, ports/customs infrastructure, suppliers, and capital providers. These dependencies are not equal, but all can create single-point failure modes.'
  data:
    nodes:
    - id: d1
      label: Tuduoduo / Guolian operating stack
      description: Central industrial marketplace and managed-service workflow spanning trading, warehousing, logistics, settlement, and digital control.
    - id: d2
      label: Guolian parent and controllers
      description: Provide governance control, capital support, and board authority, but also transmit disclosure and discipline risk.
    - id: d3
      label: Hazchem regulators and customs
      description: MEM, SAMR, customs, transport, and environment authorities determine market-access and compliance boundaries.
    - id: d4
      label: Ports, warehouses, and logistics partners
      description: Shandong Port-linked and overseas-warehouse execution layer that converts digital orders into physical delivery.
    - id: d5
      label: Suppliers and merchants
      description: Provide product availability, documentation, and quality performance for both self-operated and marketplace transactions.
    - id: d6
      label: External investors / credit providers
      description: Equity and potentially other capital sources that matter when working-capital intensity rises or valuation support weakens.
    - id: d7
      label: Construction / coatings end markets
      description: The demand base whose cyclicality ultimately determines throughput, price realization, and customer health.
    edges:
    - from: d2
      to: d1
      label: controls governance and capital decisions
    - from: d3
      to: d1
      label: grants or constrains licences and market access
    - from: d4
      to: d1
      label: executes storage, customs, and delivery promises
    - from: d5
      to: d1
      label: supplies products and documentation quality
    - from: d6
      to: d1
      label: backs liquidity and sets investor rights
    - from: d7
      to: d1
      label: sets demand, pricing, and counterparty health
  approximationNotes: Arrows point toward Tuduoduo as the recipient of the dependency. The map deliberately aggregates many individual entities into a few dependency buckets so the principal single-point risks are visible.
