tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / case
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation / residual exposure
  - Diligence path
  rows:
  - - 2026 Hazardous Chemicals Safety Law / entity-level permits
    - China
    - Law effective; entity-by-entity platform permits not publicly shown
    - High
    - Critical
    - Public law is clear, but entity coverage is still opaque; residual exposure stays high until every trading, storage, and warehouse entity is mapped to current permits.
    - Request legal-entity chart, hazardous-chemical business permits, storage approvals, and any safety-use licences by entity.
  - - Hazchem registration, Chinese SDS / labels, and customs handling
    - China / import-export
    - Mandatory where products or imports qualify
    - High
    - High
    - Group has digital tools and customs-linked workflows, but no public filing shows platform-wide registration and documentation controls by SKU or importer.
    - Sample the top 50 chemical SKUs for registration status, Chinese SDS, label files, and customs rejection history.
  - - Online sales restrictions for highly toxic or explosive-precursor chemicals
    - China
    - Live prohibition under 2026 regime
    - Medium
    - High
    - Marketplace controls may be able to blacklist restricted SKUs, but no public evidence proves the rules engine or audit logs are deployed across all channels.
    - Review SKU governance rules, restricted-product list, transaction retention logs, and manual override controls.
  - - Parent disclosure investigation and exchange discipline
    - CSRC / SSE
    - Investigation disclosed in 2023; discipline issued in 2025
    - Medium
    - Critical
    - The business remains operating, but unresolved governance overhang can spill into financing, valuation, and customer trust.
    - Obtain formal closure notices, remediation reports, and board-level control-improvement workplans.
  - - Related-party and financing-structure governance
    - Guolian / Tuduoduo
    - Visible in filings but incomplete in public detail
    - Medium
    - High
    - Filing disclosure exists, yet related-party supplier and investor-fund links keep residual governance risk elevated.
    - Request full related-party schedule, board approvals, recusal records, and investor-side side-letter summaries.
  notes: Severity ordering reflects binary downside to licensure, enforcement, or governance rather than probability alone. Residual exposure is judged from public evidence as of 2026-06-25, not from management assurances.
  enumerationScope:
    coverage: partial
    basis: This register covers the main national legal and governance exposures visible in public sources, but public filings do not expose entity-by-entity permit coverage for every trading, storage, warehouse, and cross-border affiliate.
