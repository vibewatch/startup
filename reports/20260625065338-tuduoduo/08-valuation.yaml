slug: tuduoduo
runDate: '2026-06-25'
company:
  name: Tuduoduo
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports Tuduoduo’s December 2025 B1 round at RMB 15.8 billion pre-money and at most about RMB 16.165 billion post-money if the entire intended raise closes, but it does not cleanly support a RMB 16.5 billion / roughly $2.3 billion mark. On 2024 audited and annualized 2025-Q3 numbers, the implied revenue and earnings multiples sit above Guolian and DKSH, around Brenntag and Azelis, and well below Focus Technology and Grainger; given opaque unit economics, weak chemical-market conditions, and parent governance overhang, the current price looks upper-end fair to stretched rather than clearly attractive, so the supportable call is research-more with medium confidence and high risk.
sections:
- id: valuation-evidence-and-supportability
  title: Valuation evidence and how far it really goes
  body: 'The strongest public valuation evidence is narrower than many headline summaries imply. The December 2025 B1 filing, plus aligned Sina and Tencent coverage, supports one clean statement: Tuduoduo was marketed at RMB 15.8 billion pre-money, with only RMB 70 million definitively closed on day one and up to RMB 365 million contemplated in total. That math yields about RMB 15.87 billion post-money for the first close and about RMB 16.165 billion only if the full intended raise closes. This distinction matters because the user-facing unicorn shorthand of roughly $2.3 billion or RMB 16.5 billion is directionally close but not directly evidenced by the primary documents reviewed here. The 2026 unicorn-list article strengthens the claim that Tuduoduo belongs in the unicorn category, but it does not add a fresh priced transaction. In other words, unicorn status is supportable; a clean RMB 16.5 billion financing mark is not.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
