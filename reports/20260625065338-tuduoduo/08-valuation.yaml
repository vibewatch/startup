- id: diligence-asks-and-thesis-breaks
  title: What would change the call, and what would break it
  body: The remaining work is straightforward conceptually even if it may be hard politically. The most important missing evidence is not another narrative article; it is auditable operating detail. Investors need FY2025 audited subsidiary statements, a full post-close cap table, and actual GMV, take-rate, gross-margin, and customer-concentration data to decide whether the platform deserves Focus-like software-marketplace credit or should stay anchored to distributor-style multiples. The same logic defines the thesis-break triggers. A flat or down follow-on mark, another parent governance shock, or another year where profit does not convert into cash would all argue for re-rating the business toward the bear case. Conversely, a clean audit, round completion, and better unit-economics disclosure could move the recommendation upward even without a lower entry price. Until that evidence arrives, the prudent stance is to keep the company on the watchlist rather than force conviction out of incomplete
    public disclosures. That discipline is especially important when a private mark already outruns simple public-parent intuition.
