- id: scenario-range-and-recommendation
  title: Bull, base, bear, and the recommendation
  body: 'The scenario framework is best handled with disciplined ranges rather than false precision. A bear case of roughly RMB 9-11 billion follows if chemical-market weakness persists, public-market discounts stay near Guolian and DKSH levels, or more disclosure issues surface. A base case of roughly RMB 13-15 billion fits the current public evidence better: it allows Tuduoduo to keep a premium to Guolian because the subsidiary is large and profitable, but still imposes a discount for opaque unit economics and governance drag. A bull case of roughly RMB 16-18 billion requires more than the existing narrative. It needs audited full-year 2025 earnings at or above the annualized run-rate, evidence that the remaining B1 capital closed, and some reduction in the parent overhang. That is why the recommendation is research-more rather than buy. The existing round price is not absurd, but it is closer to the upper bound of defensible value than to an obviously attractive entry point.'
