- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Equity range (RMB bn)
  - Assumptions
  - Probability signal
  - Implication at RMB 15.8bn pre-money
  rows:
  - - Bull
    - 16-18
    - Full B1 raise closes, FY2025 audit supports at least the annualized 2025-Q3 run-rate, parent overhang fades, and investors accept Azelis/Brenntag-like multiples.
    - Would require clean follow-on evidence in 2026 rather than just the first close.
    - Current disclosed price becomes defensible; upside exists only if governance discount compresses.
  - - Base
    - 13-15
    - Use about 0.45x-0.50x annualized 2025 revenue and about 11x-13x annualized earnings while keeping a discount for opacity and cycle risk.
    - Best fit with current public evidence set.
    - Current price is slightly above mid-range and near the top end of fair value.
  - - Bear
    - 9-11
    - Public-market discounts stay near Guolian and DKSH levels, chemical demand remains weak, or new disclosures show lower-quality revenue or weaker cash conversion.
    - Any sign of a flat or down round would push this scenario higher probability.
    - Current price would look meaningfully stretched and a follow-on round could reset lower.
  notes: Ranges are directional public-market anchors, not a DCF or board valuation. They intentionally widen because Tuduoduo’s take rate and preference stack are undisclosed.
