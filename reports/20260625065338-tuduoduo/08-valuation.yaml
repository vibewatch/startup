- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Down-round signal
    - Any 2026-2027 financing at or below the first-close implied post-money.
    - Would show the B1 headline price was not durable and would reset private-mark expectations lower.
    - Move from research-more to avoid until fresh evidence clears the reset.
  - - Governance shock
    - New CSRC penalty, exchange criticism, or another large revenue-recognition correction at Guolian.
    - Would justify a larger holdco and governance discount for the subsidiary.
    - Cut fair range and require hard downside protection or walk away.
  - - Cash-conversion miss
    - FY2025 or FY2026 operating cash flow materially trails reported profit again.
    - Would reinforce the view that trading scale is masking weak economics.
    - Use lower-end bear-case multiples only.
  - - Cycle deterioration
    - Chemical demand weakens further and pricing declines continue into 2027.
    - Would compress revenue quality and public comp multiples simultaneously.
    - Reduce revenue-multiple anchors toward Guolian or DKSH levels.
  - - Disclosure failure
    - Management refuses to provide GMV, take rate, gross margin, or cap-table details under diligence.
    - Would keep the core underwriting question unanswered.
    - Do not advance beyond research-more.
  notes: Triggers focus on observable events that can be monitored after the round rather than vague management-quality concerns.
  claimRefs:
  - CV040
  - CV041
  - CV042
  - CV043
  - CV044
  - CV047
  - CV050
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - FY2025 audit
    - Audited full-year 2025 Tuduoduo income statement, cash flow, and balance sheet.
    - The December 2025 round was priced against a period that is not yet fully audited in the public record.
    - Management CFO package; auditor comfort session.
  - - Unit economics
    - GMV, take rate, gross margin, customer retention, and cohort profitability by transaction mode.
    - These inputs decide whether comp selection should lean toward Focus or toward lower-multiple distributors.
    - Product finance and data-room upload under NDA.
  - - Cap table and rights
    - Full post-close shareholder register, liquidation preferences, anti-dilution, and repurchase clauses.
    - Headline valuation can overstate real economics if downside rights are strong.
    - Legal diligence on signed B1 agreements.
  - - Round completion
    - Evidence on whether the remaining RMB 295m of intended B1 capital ever closed.
    - Post-money math changes if only the first RMB 70m was actually funded.
    - Company secretary update and latest industrial-and-commercial filing.
  - - Cash conversion
    - Monthly 2024-2026 working-capital bridge, prepayment aging, and bad-debt / inventory-loss history.
    - A profitable but cash-hungry model should not command premium marketplace multiples.
    - Finance diligence request and treasury interview.
  notes: Each diligence ask is framed to change the investment decision rather than to fill curiosity. The list prioritizes valuation-moving documents first.
  claimRefs:
  - CV044
  - CV049
  - CV050
