- id: multiple-lens-and-comp-set
  title: Revenue and earnings multiples versus the comp set
  body: On supportable numbers, Tuduoduo does not screen as a moonshot but it also does not screen as a clear bargain. Using audited 2024 subsidiary results, the disclosed B1 pre-money valuation equals about 0.62x revenue and 14.8x earnings; using annualized 2025-Q3 figures, the mark softens to about 0.54x revenue and 13.6x earnings. That places the company above Guolian’s public 0.26x revenue and 9.6x earnings, above DKSH on revenue, and roughly alongside Brenntag and Azelis on revenue-style multiples. It remains far below Focus Technology and Grainger, but those are cleaner, more asset-light or premium distribution businesses with better disclosure and stronger public-market trust. The closest directional read is therefore not “Tuduoduo is wildly overvalued,” but rather “the round already prices it around the richer end of heavy-service industrial intermediaries despite much worse transparency.” That is a very different investment conclusion from a simplistic unicorn label.
