- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric base
  - Current valuation / multiple
  - Why relevant
  - Main limitation
  rows:
  - - Tuduoduo B1 (disclosed)
    - 2024 revenue / net profit
    - RMB 15.8bn pre-money = 0.62x revenue / 14.8x earnings
    - Direct platform mark tied to disclosed subsidiary financials.
    - No public take rate, GMV, or full preference stack.
  - - Guolian (603613)
    - 2024 revenue / net profit
    - ~RMB 13.94bn market cap = 0.26x revenue / 9.6x earnings
    - Closest public parent look-through and governance benchmark.
    - Holdco discount and non-Tuduoduo businesses blur direct comparability.
  - - Focus Technology (002315)
    - 2025 revenue / net profit
    - ~RMB 9.86bn market cap = 5.15x revenue / 19.6x earnings
    - China B2B marketplace peer with disclosed margins and marketplace economics.
    - Much more asset-light and software-like than Tuduoduo.
  - - Brenntag
    - 2025 revenue / pretax income
    - $8.89bn market cap = 0.51x revenue / 16.2x pretax earnings
    - Global industrial distribution comp with working-capital exposure.
    - Not a pure digital marketplace; earnings proxy is pretax income.
  - - Azelis
    - 2025 revenue / pretax income
    - $2.7bn market cap = 0.56x revenue / 13.5x pretax earnings
    - Specialty-distribution comp in a challenging market.
    - Higher specialty mix and earnings definition is pretax income, not net income.
  - - DKSH
    - 2025 revenue / EBIT
    - $5.01bn market cap = 0.36x revenue / 12.5x EBIT
    - Asia-heavy distributor with service and trading elements.
    - Broader conglomerate mix and earnings proxy is EBIT.
  - - Grainger
    - 2025 revenue / pretax income
    - $63.38bn market cap = 3.53x revenue / 25.3x pretax earnings
    - Best-in-class public distributor showing the ceiling for premium industrial execution.
    - Too mature, too service-rich, and too US-centric to serve as a base-case comp.
  notes: Enumeration is partial, covering the most decision-useful public comps with directly fetchable 2026 valuation pages. Earnings definitions vary by source and are therefore directional, not perfectly apples-to-apples.
  enumerationScope:
    coverage: partial
    basis: 'Covers the clearest public comp set available through fetched 2026 pages: Guolian as parent, Focus as disclosed Chinese B2B marketplace peer, and four global industrial distribution peers with public valuation data.'
