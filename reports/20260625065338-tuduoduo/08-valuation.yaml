tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Decision
  - Supportable public view
  - Why
  - What would upgrade it
  - What would downgrade it
  rows:
  - - Recommendation
    - Research-more
    - Price is only partly supported and critical unit-economics evidence is missing.
    - Audited FY2025 subsidiary statements and full B1 close at the same or better terms.
    - New down-round evidence or more parent governance stress.
  - - Confidence
    - Medium
    - The round price, 2024 audit, and several public comps are visible, but core platform economics are opaque.
    - Recurring disclosure on take rate, gross margin, and customer retention.
    - Conflicting private marks or sharper revenue-quality questions.
  - - Risk rating
    - High
    - Parent governance overhang, cyclical chemical demand, and working-capital intensity can all compress fair value quickly.
    - Resolution of CSRC and disclosure overhang plus cleaner cash conversion.
    - Another regulatory shock, negative cash conversion, or end-market deterioration.
  - - Valuation stance
    - Stretched
    - RMB 15.8bn is the upper end of what public evidence can defend; RMB 16.5bn is not directly evidenced.
    - Entry price closer to RMB 13bn-RMB15bn or materially better 2025 proof.
    - Any attempt to price above the disclosed B1 terms without new evidence.
  notes: Summary uses only public evidence available through 2026-06-25 and assumes no undisclosed side letters materially improve downside protection.
