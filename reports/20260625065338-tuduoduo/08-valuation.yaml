- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Publicly supported argument
  - Evidence
  - What would change the view
  rows:
  - - Thesis
    - Tuduoduo is already very large and audited-profitable, so it is not a story-stock with no earnings base.
    - 2024 audited revenue RMB 25.52bn and net profit RMB 1.07bn; 2025-Q3 revenue RMB 22.13bn and net profit RMB 871m.
    - If audited FY2025 shows sharp margin reversal or heavy non-cash quality issues.
  - - Thesis
    - The B1 price is not extreme against global industrial-distribution revenue multiples.
    - The implied 0.54x-0.62x revenue multiple sits near Brenntag and Azelis.
    - If the business mix proves much more trading-heavy and lower-quality than the comp set.
  - - Anti-thesis
    - The round price is richer than the parent and public markets are willing to pay for Guolian or DKSH-like industrial intermediation.
    - Guolian trades near 0.26x revenue and 9.6x earnings; DKSH near 0.36x revenue.
    - If public markets materially rerate Chinese industrial internet names upward.
  - - Anti-thesis
    - Parent governance and accounting overhang can cap the subsidiary multiple even when the platform is profitable.
    - CSRC investigation, disclosure criticism, and revenue-recognition corrections remain public overhangs.
    - If the parent fully clears the investigation and rebuilds disclosure credibility.
  - - Anti-thesis
    - Unicorn status proves visibility, not price support.
    - The 2026 unicorn article confirms status but does not add a new financing mark or cash-close evidence.
    - If a later priced round or secondary transaction is publicly disclosed.
  - - Anti-thesis
    - Weak chemical demand and overcapacity make premium pricing hard to defend without clear platform economics.
    - C&EN and ICIS both describe oversupply, price pressure, and weak Chinese demand in 2026.
    - If Tuduoduo demonstrates pricing power, retention, and cash conversion despite the cycle.
  notes: Rows separate the strongest pro and con arguments rather than forcing a single blended narrative; the anti-thesis is intentionally evidence-led.
