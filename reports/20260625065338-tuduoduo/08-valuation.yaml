  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics-disclosure
    missingEvidence: Standalone GMV, take rate, gross margin, and customer concentration for Tuduoduo remain undisclosed publicly.
    whyItMatters: Without unit economics, investors cannot tell whether the round values a durable platform or a working-capital-heavy trading intermediary.
    diligencePath: Request 2024 and 2025 monthly GMV, take-rate bridge, gross margin by transaction mode, top-20 customer concentration, and cash conversion under NDA.
    relatedQuestionRefs:
    - QV019
    - QV025
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: round-completion
    missingEvidence: No reviewed 2026 source confirms that the full RMB 365 million B1 raise closed beyond the first RMB 70 million tranche.
    whyItMatters: A partially closed round supports less post-money value than a fully subscribed one and changes dilution and investor preference analysis.
    diligencePath: Request updated shareholder register, signed investment agreements for remaining investors, and post-close cap table after any later B1 closings.
    relatedQuestionRefs:
    - QV026
  - type: stale
    severity: material
    topic: 2025-audited-results
    missingEvidence: Public sources stop at audited 2024 results and unaudited 2025-Q3 subsidiary figures for Tuduoduo.
    whyItMatters: The round was priced in late 2025, so the absence of audited full-year 2025 results leaves the most relevant earnings base unverified.
    diligencePath: Request 2025 audited Tuduoduo financial statements, audit opinion, and bridge from 2025-Q3 to FY2025 under NDA.
    relatedQuestionRefs:
    - QV019
    - QV024
    - QV027
  - type: private-evidence-only
    severity: material
    topic: investor-rights
    missingEvidence: The public set does not show a full liquidation-preference stack, anti-dilution terms, or any side letters for the B1 investors.
    whyItMatters: Those terms shape real entry economics, dilution risk, and downside protection more than the headline valuation alone.
    diligencePath: Review the signed term sheet, shareholder agreement, and any repurchase or preference waterfall schedules before underwriting the round.
    relatedQuestionRefs:
    - QV025
