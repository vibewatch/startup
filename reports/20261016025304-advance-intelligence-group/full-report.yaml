    sections:
      - number: '6.1'
        title: Segment mix is broad, but vintages are inconsistent
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports a consistent high-level picture that Advance Intelligence Group serves three
              customer surfaces: enterprise buyers via ADVANCE.AI, merchants via Atome and Ginee, and end consumers via
              Atome Financial and Kredit Pintar. The issue is less whether the footprint is real than how current each
              disclosed metric is. Multiples' current profile repeats older traction snapshots with different customer
              counts across enterprise, merchant, and consumer lines, while LinkedIn gives fresher but still
              company-issued statements about 500+ enterprise clients and millions of people served. That makes segment
              breadth credible, but active-customer depth and the revenue weight of each segment remain only partially
              disclosed.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU009
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
              - CU010
              - CU015
      - number: '6.2'
        title: Fresh adoption proof is strongest in the Philippines
        blocks:
          - type: paragraph
            body: >-
              The clearest current adoption signal in the assigned pool is Atome's Philippines card base. LinkedIn posts
              claim more than 3 million Atome cards issued in the Philippines, with use extending beyond Metro Manila
              into Luzon, Visayas, and Mindanao, and management frames up to 80% of card holders as first-time
              cardholders. Those are meaningful expansion signals, but they are still self-reported and attached to
              funding updates rather than an independent customer case study or portfolio cohort disclosure. Independent
              market context from Fintech News Singapore reinforces why this geography matters: digital-wallet and QR
              adoption are rising quickly, yet payment behavior is fragmented market by market, so merchant expansion
              has to track local rails rather than one uniform regional playbook.
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU015
      - number: '6.3'
        title: Named counterparties validate relevance more than retention
        blocks:
          - type: paragraph
            body: >-
              The assigned pool's strongest named proof comes from counterparties and channels, not from end customers
              publishing deployment outcomes. Grab's planned acquisition of 60% of Atome Financial is the sharpest
              external signal that AIG's consumer-finance assets and merchant network matter at regional scale, while
              the AUB facility shows local lenders are willing to fund the Philippine card base in peso terms. Those are
              important proofs of strategic relevance and financing access, but they are not the same as audited
              renewal, repeat-use, or customer-satisfaction evidence. The named proof table therefore shows more
              validation of distribution and balance sheet support than proof of durable customer economics.
            claimRefs:
              - CU006
              - CU007
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU009
              - CU010
              - CU015
      - number: '6.4'
        title: Durability, concentration, and customer quality remain under-evidenced
        blocks:
          - type: paragraph
            body: >-
              Public durability proof remains the weakest part of the customer story in this pool. Neither the assigned
              official surfaces nor the accessible third-party pages disclose GRR, NRR, churn, renewal, or top-customer
              concentration. The official media URL renders brand-permission text rather than a customer-story index,
              Caplight's public profile exposes funding history but keeps filing records behind access controls, and the
              EDBI jobs page contributes no deployment detail. On the adverse side, Indonesia's Kredit Pintar remains
              licensed by OJK, but IDXChannel reports field debt collection for long-overdue borrowers, underscoring
              that part of AIG's customer expansion can create service and consumer-protection friction even when the
              product is regulated.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Freshest proof is concentrated in one geography
            body: >-
              The assigned pool's best current customer evidence is not group-wide retention data but the Philippines
              card base: 3 million cards, a large first-time-cardholder share, and a new local-currency AUB facility
              that supports further issuance.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU015
          - type: callout
            title: The public record is broad on scale and thin on durability
            body: >-
              Accessible surfaces show that AIG has real enterprise, merchant, and consumer reach, but they do not
              disclose GRR, NRR, churn, renewal, or customer concentration, so durability still has to be diligenced
              directly with management and lender data.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure is the top thesis-breaker
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows AIG spans enterprise KYC/KYB and risk products as well as BNPL and digital lending
              across multiple markets, so the company faces a broad licensing, consumer-protection, and
              transaction-approval surface rather than a single-country compliance burden. That burden became more
              immediate once AIG disclosed a proposed sale of 60% of Atome Financial to Grab for US$1.49 billion, with
              completion still subject to regulatory approval and a two-year period in which the businesses would
              continue under their existing brands and licences. Indonesian enforcement data adds context: Kompas,
              citing OJK, reported 94 licensed fintech lenders as of 24 April 2026 after one licence revocation, while
              Satgas PASTI said it had already stopped 951 illegal online-lending entities in the first quarter. The
              mitigant is that AIG explicitly frames compliance and licensing as a supported capability, but residual
              exposure stays high until diligence confirms the legal-entity, licence, complaint, and approval status for
              each lending market and for the Grab transaction.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR008
              - CR009
              - CR011
              - CR012
      - number: '7.2'
        title: Funding and partner dependence can amplify operating shocks
        blocks:
          - type: paragraph
            body: >-
              The second-largest public risk is dependency on external funding and partner infrastructure. LinkedIn
              disclosures describe Atome Financial as backed by multiple institutional funding partners including
              Standard Chartered, HSBC, DBS, SMBC, BlackRock, Evolution X Capital, and InnoVen Capital, and the same
              page cites both an upsized US$345 million syndicated facility and a PHP5 billion facility with AUB. That
              breadth is positive, but public evidence does not disclose concentration by facility, tenor, covenants,
              advance rates, or trigger events, so investors cannot tell whether one banking relationship or one
              warehouse structure carries outsized refinancing risk. The same operating model also spans consumer
              lending, enterprise verification, merchant tools, and wide geographic coverage, which raises execution
              load across compliance, underwriting, product, and collections. The working assumption should be that
              partner and capital access are strategic dependencies until management provides lender concentration,
              covenant headroom, and market-by-market funding resilience data.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
