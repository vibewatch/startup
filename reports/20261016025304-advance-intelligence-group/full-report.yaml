        title: The operating model looks like a layered identity-to-credit-to-merchant workflow
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a plausible operating model even though it does not expose internal system
              diagrams. Preqin says the platform provides anti-fraud services for loan applications including face
              recognition, identity checks, company checks, and credit-score data, while LinkedIn describes ADVANCE.AI
              as an enterprise provider of digital identity verification, KYC/KYB, risk management, and credit
              information services. On the consumer side, LinkedIn says Atome Financial combines BNPL, cash loans,
              cards, and digital lending, and management frames the stack as AI-underwritten and risk-managed. Regional
              payment rails described by Fintech News Singapore help explain distribution and checkout fit: QR and
              account-to-account systems are increasingly the default merchant acceptance layer in AIG's core markets.
              The evidence therefore supports a layered workflow from onboarding and risk scoring into credit products
              and merchant payment experiences, but not the private interfaces, model inputs, or service-level
              architecture behind it.
