          value in 2025.
        - This concern falls if AIG discloses resilient credit quality and approvals stay on schedule across markets.
    notes: >-
      Arguments are analytical syntheses tied back to public evidence; the table distinguishes scale and financing
      support from unresolved valuation plumbing.
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV008
      - CV009
      - CV011
      - CV012
      - CV013
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Grab closes on broadly announced terms; FY2026 run-rate converts to reported revenue; ADVANCE.AI retains
          strategic value.
        - >-
          A buyer can pay for verified Atome realization plus separately evidenced residual value, but still should not
          double-count both.
        - >-
          Requires transaction documents, audited bridge statements, and credible proof that momentum is not
          promotion-led.
        - Regulatory approval slippage, weaker-than-advertised parent proceeds, or adverse credit migration.
      - - Base
        - Deal broadly validates value, but holdco economics remain partially opaque and market adoption stays uneven.
        - Most supportable stance is fair only with a discount to reflect disclosure and execution risk.
        - >-
          Best fit with current public evidence because it combines external price support with unresolved parent-level
          questions.
        - No ownership bridge, no cohort loss metrics, or no clear use of proceeds after closing.
      - - Bear
        - Transaction terms reset, approvals slip, or consumer-finance risk rises before monetization is complete.
        - >-
          Avoid paying any price that assumes the announced Atome mark and the remaining group optionality are both
          fully realizable.
        - >-
          Supported if regulatory pressure intensifies or if disclosed momentum fails to convert into durable reported
          results.
        - >-
          Down-round style repricing, facility dependence without transparency, or new licensing friction in core
          lending markets.
    notes: >-
      Ranges are directional rather than numeric because retained public evidence does not disclose a consolidated group
      valuation or post-transaction capitalization.
    claimRefs:
      - CV004
      - CV006
      - CV008
      - CV009
      - CV012
      - CV013
      - CV016
