        title: Milestones and watchpoints
        blocks:
          - type: paragraph
            body: >-
              The official milestone trail shows an organization that moved from product launches and brand
              consolidation in 2021 into repeated financing and scale claims in 2024-2026. The path matters because it
              shows continuity across e-commerce SaaS, identity infrastructure, and digital credit rather than a
              single-product company. The main public watchpoint in this pool is regulatory, not operational: Kompas
              reports that Kredit Pintar was still on OJK's legal lender list in April 2026, but the same article also
              sits inside an enforcement-heavy context in which OJK revoked another lender's licence and Satgas PASTI
