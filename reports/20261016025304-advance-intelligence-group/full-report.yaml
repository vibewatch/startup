      - number: '5.3'
        title: Deployment maturity is real, but current momentum is concentrated in regulated credit products
        blocks:
          - type: paragraph
            body: >-
              The strongest 2026 deployment signals are around Atome's regulated lending and card footprint. LinkedIn
              says Atome Card has crossed 3 million cards in the Philippines and is also live in Malaysia and Indonesia,
              while the group announced that Grab will acquire a 60% equity interest in Atome Financial subject to
              regulatory approval, with brands and licences remaining in place for two years after closing if the deal
              completes. Fintech Global's older Series D coverage adds that capital was earmarked to deepen AI and
              big-data capabilities while expanding BNPL, digital lending, and enterprise reach. Together, these signals
              suggest product maturity in go-to-market and financing capacity, but also rising dependency on regulatory
              approvals, external funding, and post-transaction execution rather than on a publicly documented technical
              moat.
            claimRefs:
              - CE004
              - CE006
              - CE010
              - CE011
      - number: '5.4'
        title: Trust evidence is concentrated in licensing and legal compliance, not technical disclosure
        blocks:
          - type: paragraph
            body: >-
              Public trust and safety evidence is much stronger on regulatory and legal surfaces than on deep technical
              assurance. Kompas' April 2026 summary of OJK's list shows Kredit Pintar among licensed Indonesian fintech
              lenders, and LinkedIn highlights compliant launches such as the Shariah-compliant Atome Malaysia Card plus
              a responsible-growth approach that starts users with micro limits before expanding access. Those are
              useful signals, but they do not substitute for public security certifications, uptime reporting, privacy
              architecture, model-governance documentation, or cohort loss disclosures. Katadata's OJK-sourced BNPL
              figures for Indonesia underline why those missing artefacts matter: the category is still growing quickly,
              but financing-company BNPL balances and NPFs show that credit loss management remains a core product risk,
              not just a finance-side concern.
