        title: Capital, counterparties, and external stakeholders
        blocks:
          - type: paragraph
            body: >-
              The company looks late-stage on financing depth, but the evidence is uneven across equity, debt, and
              strategic outcomes. Current company surfaces tie the group to SoftBank Vision Fund 2 and Warburg Pincus,
              with LinkedIn additionally naming Ares, Vision Plus Capital, and EDBI among backers. The same surface
