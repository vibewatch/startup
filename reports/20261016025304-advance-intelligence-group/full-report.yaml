  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive surface spans enterprise risk and consumer credit
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not point to one clean peer set because Advance Intelligence Group spans
              enterprise identity/risk software and consumer financial products. Company-controlled LinkedIn disclosures
              describe ADVANCE.AI as an enterprise identity, KYC, KYB, risk management, and credit-information provider,
              while the same source places Atome Financial in BNPL, cash loans, cards, and digital lending. That product
              breadth gives the group more surface area than a single-function vendor, but it also means the competitive
              map fragments across different buyer jobs, regulations, and distribution channels.

              Tracxn's profile reinforces that breadth and the crowding around it: it counts 51 active competitors
              around the group, with 12 funded and 7 exited, and its named peers span treasury software, identity
              verification, fraud tooling, and lending. This means the right diligence frame is not "who is the single
              closest peer," but "which competitor class owns each workflow and budget." In practice, AIG is defending
              enterprise trust/risk workflows on one side and consumer-credit or checkout share on the other.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP011
              - CP013
      - number: '3.2'
        title: Named peers indicate competition by workflow, not by one monolithic category
        blocks:
          - type: paragraph
            body: >-
              The strongest named direct peers in the retained evidence cluster around narrower workflow ownership than
              AIG itself. Tracxn identifies AuthBridge in identity verification and screening, SHIELD in fraud
              intelligence, and Validus Group in digital lending for SMEs. Kompas' April 2026 recap of the OJK lender
              roster adds Kredit Pintar as a regulated Indonesian lending substitute, while Fintech News Singapore shows
              GCash, Maya, ShopeePay, GrabPay, and other wallet-led payment habits shaping how consumers and merchants
              complete transactions in Southeast Asia.

              The implication is that AIG does not need one rival to be displaced. It can lose enterprise identity share
              to focused verification vendors, lose fraud budgets to specialist risk tools, and lose checkout or
              repeat-use volume to wallet-led ecosystems and locally licensed lenders. The assigned public pool
              therefore supports a category-stack view of competition rather than a winner-take-all peer comparison.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
