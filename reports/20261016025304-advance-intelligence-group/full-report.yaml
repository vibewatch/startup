        title: Exhibits
        blocks:
          - type: callout
            title: Multi-sided market exposure is the real boundary
            body: >-
              AIG's addressable market is best understood as overlapping consumer-credit, enterprise-risk, and
              merchant-software budgets; compressing it into a single BNPL TAM would understate both the enterprise and
              merchant workflow surface.
            calloutType: insight
            claimRefs:
