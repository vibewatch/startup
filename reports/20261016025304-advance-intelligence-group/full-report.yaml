            title: Growth is visible, mix is not
            body: >-
              Atome Financial now supplies the clearest public revenue and GMV evidence, but the retained sources still
              do not reconcile how much of consolidated economics comes from consumer finance versus enterprise software
              versus merchant tools.
            calloutType: insight
            claimRefs:
