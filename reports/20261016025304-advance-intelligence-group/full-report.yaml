              - CM015
      - number: '2.3'
        title: Buyer map, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption logic differs by business line. In consumer finance, merchant acceptance and underwriting
              infrastructure are upstream to consumer usage, so retailer footprint and loan-origination capacity matter
              before user-scale claims do. In enterprise identity and risk, the functional buyer is more likely to sit
              inside risk, compliance, fraud, and operations teams than generic IT, because the cited use cases center
              on KYC, KYB, KYT, and transaction monitoring for banks, fintechs, marketplaces, and payment networks. The
              major adoption tailwinds are financial inclusion demand and merchant digitization, but the pool also shows
              constraints: regulatory approval still matters for structural transactions, and the chapter lacks a
              readable independent 2026 market benchmark or standalone disclosed credit-quality data to turn these
              adoption signals into a clean current-year SOM.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
