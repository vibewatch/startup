        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Publicly named leadership remains concentrated around founders or founder-like operators. Jefferson Lanjie
              Chen is presented as chairman and chief executive of the group and chief executive of Atome Financial,
              while Dong Shou is described as co-founder and chairman of ADVANCE.AI. That concentration is useful
