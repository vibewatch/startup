              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR013
      - number: '7.3'
        title: Disclosure quality remains a material diligence risk
        blocks:
          - type: paragraph
            body: >-
              Several retained URLs in the assigned pool currently resolve to generic or low-fidelity pages instead of
              durable evidence for financing, hiring, or third-party profile claims. The URL titled as a Series D
              announcement on AIG's own domain now resolves to a generic contact page, the company's media URL exposes
              trademark-permission guidance rather than an accessible archive, an EDBI path for Advance Intelligence
              Group resolves to a generic EDBI page, and an Endeavor page headed "Advance Intelligence Group" displays
              ShopBack founder biographies. Even the assigned Nikkei Asia URL exposes only a subscription shell in the
              fetched artifact rather than reviewable company-specific text. None of those issues proves an operating
              failure, but together they do raise the cost of verifying historical fundraising, executive, hiring, and
              risk assertions from public materials alone. The investment implication is straightforward: require a
              dated licence pack, audited legal-entity financials, delinquency and loss-vintage reporting, and archived
              board-approved transaction materials before underwriting downside.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Approval and licensing evidence is the first diligence gate
            body: >-
              The proposed Grab transaction and AIG's multi-market lending footprint create a binary risk surface around
              approvals, licence continuity, and regulator posture that public materials do not fully close.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
          - type: callout
            title: Public-source traceability is weaker than the operating ambition
            body: >-
              Several retained URLs now resolve to generic, stale, or mismatched pages, so management should be expected
              to replace public marketing artifacts with a clean diligence archive before investors rely on historical
              claims.
            calloutType: insight
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The public record is stronger than in the prior report because it now includes an announced strategic
              transaction: Grab says it will acquire 60% of Atome Financial for US$1.49 billion, with the remaining 40%
              intended roughly two years after completion and still subject to regulatory approvals. That is a real
              asset-level price signal, not just a venture mark, and it sits on top of company-disclosed FY2025 revenue
              of US$470 million, second-consecutive pre-tax profitability, and a US$345 million syndicated debt renewal.
              Even so, the retained evidence does not disclose how much of the announced consideration ultimately
              accrues to Advance Intelligence Group, what obligations remain at holdco, or what liquidation preferences
              sit ahead of common equity. That gap makes a buy call too aggressive; the defensible posture is track,
              with entry discipline tied to transaction terms and post-deal perimeter clarity rather than to a headline
              revenue multiple alone.
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.2'
        title: Upside case supported by public evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest long thesis in the retained evidence is that AIG still sits on a large inclusion and
              digitization runway. The official Atome page says 6 in 10 consumers in Southeast Asia still lack inclusive
              access to credit and financial services, while Fintech News reports that Philippine digital wallets
              already represented 41% of e-commerce and 29% of point-of-sale value in 2025. Company disclosures also
              show scale: Atome Financial says FY2025 revenue reached US$470 million, total operating income US$360
              million, GMV above US$4 billion, and annualized June 2026 net revenue US$800 million. The lender stack is
              also meaningful. AIG says Atome Financial is backed by major funding partners, and Digital News Asia
              reports that bank support expanded from a US$200 million 2024 facility to US$345 million in 2026. If those
              operating and funding signals persist, the announced Grab transaction could mark only part of the value
              already created inside the consumer-finance perimeter.
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: What limits precision
        blocks:
          - type: paragraph
            body: >-
              The downside case is less about whether AIG has built valuable assets and more about how much of that
              value outside investors can actually underwrite from public evidence. Kompas reports that OJK's roster of
              licensed fintech lenders fell to 94 after a license revocation, which is a reminder that consumer-finance
              operators still live inside an active regulatory filter. Fintech News also notes that cash remained 42% of
              Philippine in-store transaction value in 2025, so digital-finance adoption is real but not complete.
              Meanwhile, the retained official media page is still operational rather than investor oriented, and no
              retained public source in this chapter discloses consolidated group valuation, post-transaction proceeds
              to the parent, or liquidation preferences. KPMG's observation that conventional approaches to risk and
              regulatory compliance are no longer fit for purpose fits the same conclusion: this is a cross-border
              fintech that still deserves valuation haircuts for complexity, disclosure limits, and execution risk.
            claimRefs:
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: Scenarios and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The most supportable base case is not a precise fair-value range but a conditional framework. In the bull
              case, the Grab transaction closes on broadly announced terms, Atome's 2026 run-rate converts into reported
              revenue, and investors can separately value the remaining ADVANCE.AI asset and any residual Atome stake.
              In the base case, the deal still helps validate value, but limited disclosure means investors should pay
              only a modest look-through value for undeclared holdco optionality. In the bear case, approvals slip,
              consumer-credit performance weakens, or the public mark proves less transferable to the parent. The final
              diligence asks are straightforward: obtain post-transaction ownership and proceeds mechanics, audited
              consolidated statements, country-level credit quality metrics, and the preference stack before
              underwriting a buy or high-conviction fair-value range.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV008
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV009
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track pending deal mechanics
            body: >-
              The announced Grab transaction is the first strong public price anchor in the retained evidence set, but
              it is still not enough to justify a buy at the parent level without post-transaction ownership, proceeds,
              and preference detail.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV016
          - type: callout
            title: What would move this to buy
            body: >-
              Publish audited consolidated statements, disclose the post-deal capitalization and proceeds bridge, and
              show country-level credit-performance durability after growth financing expands.
            calloutType: assumption
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV016
