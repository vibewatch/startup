  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Advance Intelligence Group should be analyzed as a multi-surface fintech and commerce platform, not as a
              standalone BNPL vendor. Across company and partner descriptions, the recurring boundary is consumer credit
              access through Atome Financial, enterprise identity and fraud infrastructure through ADVANCE.AI, and
              merchant operating software through Ginee. That means the relevant spend pools include consumer-finance
              balances, verification and risk budgets, and commerce-software budgets. The key substitutes therefore
              differ by workflow: status-quo card and installment finance on the consumer side, in-house compliance and
              fraud operations in regulated enterprises, and point solutions or manual multi-channel store management
              for merchants.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM012
      - number: '2.2'
        title: Served-scale lenses instead of a clean TAM stack
        blocks:
          - type: paragraph
            body: >-
              The strongest quantitative evidence in the assigned pool is served-scale disclosure, not independent
              market sizing. A company-issued 2021 financing announcement syndicated by Warburg Pincus gave one
              historical operating lens across 12 markets, 800-plus enterprise clients, 100,000 merchants, and 20
              million consumers, while a later fintech directory profile described a larger footprint of 500-plus
              enterprise clients, 235,000 merchants, and 40 million consumers. Those snapshots show directionally large
              demand and cross-segment reach, but they are not directly comparable enough to be treated as TAM or SAM
              because they mix different business units, dates, and denominators. The chapter therefore uses a
              constrained pyramid of reported reach as an observed market lens rather than inventing a broad third-party
              TAM estimate from outside the assigned pool.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
