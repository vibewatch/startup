    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and current scope
        blocks:
          - type: paragraph
            body: >-
              The cleanest identity anchors come from the group's own surfaces. LinkedIn describes Advance Intelligence
              Group as headquartered in Singapore and founded in 2016, while the same page frames the company as an
              AI-native financial and data platform. The operating portfolio that is easiest to verify in the assigned
              pool is not a generic holding-company narrative but a product stack anchored by ADVANCE.AI on the
              enterprise side and Atome Financial on the consumer side, with Ginee still visible in the historical
              milestone stream. The official media centre is also active through August 2026, which matters because it
              confirms the group still maintains a live corporate communications surface even as several core cover
              metrics remain only partially disclosed in public.
