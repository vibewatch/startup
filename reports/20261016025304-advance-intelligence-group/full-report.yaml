      - number: '4.2'
        title: Capital stack and regulatory intensity
        blocks:
          - type: paragraph
            body: >-
              Company Overview owns the historical funding chronology; the forward financial question here is whether
              the consumer-finance arm still needs meaningful external funding to sustain growth. Current disclosures
              show continued reliance on debt facilities, capital injections, and a proposed strategic transaction.
              Atome Philippines publicly announced a PHP5 billion wholesale facility with Asia United Bank, the group
              highlighted an upsized US$345 million syndicated debt facility, and an independent archive reported
              further capital support for Atome Financial. Those facilities and injections indicate financing access,
              not cash on hand or runway; likewise, proposed transaction consideration cannot be treated as available
              parent liquidity before closing and allocation details are known. The activity improves flexibility, but
              it also underlines working-capital intensity and exposure to lender appetite. At the same time,
              Indonesia's new BNPL regime makes disclosure, complaints handling, and operational controls financially
              relevant because sanctions can reach fines and business-stoppage orders.
            claimRefs:
