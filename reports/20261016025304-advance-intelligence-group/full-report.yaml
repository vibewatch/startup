      - number: '4.3'
        title: Verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial picture is directionally positive but still underwriting-incomplete. Atome's disclosed
              revenue, GMV, profitability-before-tax claim, and continuing access to bank facilities suggest a business
              that has reached material scale rather than a pre-revenue experiment. The accounting profitability claim
              does not establish cash generation, and available facilities do not establish current liquidity. Regional
              payment behavior also supports demand: cash is falling sharply in Indonesia and digital wallets are
              mainstream in the Philippines, even if cash-on-delivery and in-store cash still matter. The problem is
              disclosure quality. The retained public sources describe growth, funding, licensing, and market context,
              but they do not disclose realized pricing, take rates, credit losses, CAC, payback, consolidated cash, or
              runway with enough specificity to underwrite margin durability or capital adequacy. The practical verdict
              is that public evidence supports momentum, but not a clean view on revenue quality or downside resilience
              without management materials.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI013
              - CI014
              - CI015
              - CI016
