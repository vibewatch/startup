              - CP008
              - CP009
              - CP011
              - CP013
      - number: '3.3'
        title: Switching costs come more from embedded workflows and licences than transparent pricing
        blocks:
          - type: paragraph
            body: >-
              The public evidence retained here points to switching costs that are more operational than price-list
              driven. AIG claims 500+ enterprise clients and millions of users across Southeast Asia, which suggests
              some embedded workflow depth, while the proposed Grab transaction highlights Atome Financial's merchant
              network and regulatory footprint across five markets. In other words, the most defensible switching
              friction appears to be distribution, licensing, and already-embedded data flows rather than a visibly
              published package that rivals must match.

              The downside is that this same public record does not give investors much clean pricing transparency. The
              assigned official media-centre page is a trademark-permissions page, and the partner-hosted pages in the
              pool contribute classification context but not a usable third-party benchmark. That leaves public pricing,
              take-rate, or feature- by-feature comparisons under-evidenced and forces diligence to focus on workflow
              reach, partner access, and local regulatory standing instead.
            claimRefs:
              - CP004
              - CP009
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP010
              - CP011
              - CP013
              - CP015
              - CP016
      - number: '3.4'
        title: Durability is plausible, but public proof is thinner than the breadth story
        blocks:
          - type: paragraph
            body: >-
              The public record supports a plausible integration moat: AIG combines enterprise identity and risk tooling
              with a large consumer-finance arm, and Tracxn still ranks it first by total funding among the peer set it
              tracks. That combination can matter where lenders and merchants value both underwriting capability and
              customer-distribution reach. The proposed Grab deal also suggests the consumer arm is strategically
              relevant enough for a regional super- app to buy into rather than merely compete head-on.

              Even so, moat durability remains only partially proven in this pool. Wallet-led substitutes and national
              payment rails are scaling quickly, specialist vendors remain active in identity and fraud, and the
              retained evidence does not provide independent loss-rate, approval-rate, conversion, pricing, or
              customer-retention benchmarks that would demonstrate category leadership against those rivals. For now,
              the most defensible conclusion is that AIG has breadth and strategic relevance, but public evidence still
              stops short of proving hard-to-replicate category dominance.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is the moat claim
            body: >-
              The retained evidence supports AIG's broadest competitive claim not as "best single-feature vendor," but
              as a platform spanning enterprise identity/risk workflows and consumer-credit distribution.
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP014
          - type: callout
            title: Public proof lags the breadth story
            body: >-
              Public sources show crowding, wallet substitution, and local licensed lenders, but they do not supply an
              independent benchmark proving superior pricing, conversion, loss rates, or retention versus those
              alternatives.
            calloutType: risk
            claimRefs:
              - CP005
              - CP010
              - CP011
              - CP012
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Business mix and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              Public evidence identifies three monetization surfaces at the group level: consumer finance through Atome
              Financial, enterprise verification and risk products through ADVANCE.AI, and merchant software through
              Ginee. The historical group release is still the clearest source for the breadth of that model, while the
              freshest disclosed financial data comes from Atome Financial's own 2026 posts rather than a consolidated
              group filing. That creates an immediate modeling asymmetry: investors can see current consumer-finance
              growth, but they cannot yet see how much of group revenue or gross profit comes from enterprise software
              versus merchant tooling versus credit products. Ginee's disclosed GMV and order volume show that the
              merchant-software arm can ride transaction activity, while Atome's FY2025 and June 2026 metrics show the
              consumer-finance arm currently contributes the strongest public scale signal.
