  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope is broad, but the freshest proof clusters around Atome and ADVANCE.AI
        blocks:
          - type: paragraph
            body: >-
              The clearest recurring product description is that Advance Intelligence Group operates an ecosystem rather
              than a single application. Independent 2023 coverage and Preqin's profile both describe a portfolio that
              includes Atome for BNPL and consumer finance, ADVANCE.AI for enterprise identity, KYC/KYB, risk and credit
              services, Kredit Pintar for Indonesian digital lending, and Ginee for merchant software. The freshest
              company-controlled surface is narrower: LinkedIn updates emphasise ADVANCE.AI's enterprise identity/risk
              products and Atome Financial's lending, cards, and merchant network, while current public detail on Ginee
              inside the assigned pool is thin. That matters for diligence because the portfolio story is credible, but
              the newest product evidence is uneven across modules.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE007
          - type: table
