callouts:
  - calloutType: insight
    title: Multi-sided market exposure is the real boundary
    body: AIG's addressable market is best understood as overlapping consumer-credit, enterprise-risk, and merchant-software budgets; compressing it into a single BNPL TAM would understate both the enterprise and merchant workflow surface.
    claimRefs: [CM001, CM002, CM003, CM009]
  - calloutType: risk
    title: Market-size confidence is limited by evidence quality
    body: The assigned pool supports a credible boundary and buyer map, but not an independently benchmarked 2026 TAM or current credit-quality view, so valuation should treat market-size upside as partially unverified.
    claimRefs: [CM006, CM010, CM014, CM015]
