company:
  name: Advance Intelligence Group
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Advance Intelligence Group operates across three linked markets rather than
    one: consumer digital finance, enterprise identity and risk infrastructure,
    and merchant commerce software. The assigned source pool supports a
    constrained served-market lens built from company-reported operating scale,
    but it does not provide a clean independent 2026 TAM or SAM benchmark, so
    valuation work should treat market size as partially evidenced rather than
    settled.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Advance Intelligence Group should be analyzed as a multi-surface fintech
      and commerce platform, not as a standalone BNPL vendor. Across company and
      partner descriptions, the recurring boundary is consumer credit access
      through Atome Financial, enterprise identity and fraud infrastructure
      through ADVANCE.AI, and merchant operating software through Ginee. That
      means the relevant spend pools include consumer-finance balances,
      verification and risk budgets, and commerce-software budgets. The key
      substitutes therefore differ by workflow: status-quo card and installment
      finance on the consumer side, in-house compliance and fraud operations in
      regulated enterprises, and point solutions or manual multi-channel store
      management for merchants.
    claimRefs: [CM001, CM002, CM003, CM012]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Served-scale lenses instead of a clean TAM stack
    body: >-
      The strongest quantitative evidence in the assigned pool is served-scale
      disclosure, not independent market sizing. A company-issued 2021 financing
      announcement syndicated by Warburg Pincus gave one historical operating lens across 12 markets,
      800-plus enterprise clients, 100,000 merchants, and 20 million consumers,
      while a later fintech directory profile described a larger footprint of
      500-plus enterprise clients, 235,000 merchants, and 40 million consumers.
      Those snapshots show directionally large demand and cross-segment reach,
      but they are not directly comparable enough to be treated as TAM or SAM
      because they mix different business units, dates, and denominators. The
      chapter therefore uses a constrained pyramid of reported reach as an
      observed market lens rather than inventing a broad third-party TAM
      estimate from outside the assigned pool.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyer map, adoption drivers, and constraints
    body: >-
      Adoption logic differs by business line. In consumer finance, merchant
      acceptance and underwriting infrastructure are upstream to consumer usage,
      so retailer footprint and loan-origination capacity matter before
      user-scale claims do. In enterprise identity and risk, the functional
      buyer is more likely to sit inside risk, compliance, fraud, and
      operations teams than generic IT, because the cited use cases center on
      KYC, KYB, KYT, and transaction monitoring for banks, fintechs,
      marketplaces, and payment networks. The major adoption tailwinds are
      financial inclusion demand and merchant digitization, but the pool also
      shows constraints: regulatory approval still matters for structural
      transactions, and the chapter lacks a readable independent 2026 market
      benchmark or standalone disclosed credit-quality data to turn these
      adoption signals into a clean current-year SOM.
    claimRefs: [CM009, CM010, CM011, CM013, CM014]
    tableRefs: [TM003]
