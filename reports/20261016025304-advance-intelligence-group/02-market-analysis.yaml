  evidenceGaps:
    - type: missing-source
      severity: material
      topic: independent-market-benchmark
      missingEvidence: A readable independent 2026 market-size or category-growth source for Southeast Asian BNPL, enterprise identity and risk, or merchant-commerce software that can be tied directly to AIG's served segments.
      whyItMatters: Without an external benchmark, the chapter can only present served-scale lenses and cannot defend a source-clean TAM or SAM estimate for valuation.
      diligencePath: Obtain a usable analyst, public-company, government, or trade-association source that sizes one or more of AIG's core segments in Southeast Asia and aligns the denominator with AIG's business lines.
      relatedQuestionRefs: [QM006]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: served-scale
      missingEvidence: Date-stamped definitions for enterprise clients, merchants, and consumers across Warburg's 2021 financing release and the later fintech directory profile.
      whyItMatters: The scale metrics are directionally useful but not directly comparable enough to combine into one market-size narrative without clearer denominators.
      diligencePath: Request an investor factsheet or audited operating-metrics bridge that reconciles business-line scope and measurement dates for the public scale claims.
      relatedQuestionRefs: [QM007]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: credit-quality
      missingEvidence: Standalone Atome or Kredit Pintar cohort delinquency, loss-rate, and underwriting performance data by market and vintage.
      whyItMatters: Market attractiveness in digital lending and BNPL depends not only on demand but also on whether scale can be monetized with controlled credit losses.
      diligencePath: Request lender cohort performance packs, warehouse-facility reporting, or regulatory filings that disclose delinquency and loss trends by product and market.
      relatedQuestionRefs: [QM005]
