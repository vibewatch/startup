    rows:
      - [AuthBridge, Enterprise identity / screening, "$11.2M funding (Tracxn)", "Banks, employers, compliance workflows", "Identity verification, employee screening, due diligence", "Visible scope is narrower than AIG's two-business platform"]
      - [SHIELD, Fraud / risk intelligence, "$31.7M funding (Tracxn)", "Digital commerce and fintech risk teams", "Fraud protection specialization", "Evidence does not show consumer-credit or wallet distribution reach"]
      - [Validus Group, Digital lending platforms, "$138M funding (Tracxn)", "SME lenders and merchants", "Focused lending-platform and SME-credit position", "Not positioned in the retained evidence as consumer BNPL plus enterprise identity"]
      - [GCash, Wallet-led substitute, "94M users and 6M+ merchants (Fintech News Singapore)", "Consumers and merchants in the Philippines", "Very large consumer and merchant distribution base", "Retained evidence does not disclose underwriting depth comparable to Atome/ADVANCE.AI"]
      - [Kredit Pintar, Licensed digital lender, "OJK-licensed lender on April 2026 roster", "Indonesian borrowers", "Local licence and regulated lending presence", "Roster evidence does not disclose pricing, scale, or adjacent enterprise software scope"]
    notes: Publicly named peers and substitutes from the assigned prefetched pool; scope is partial, not an exhaustive landscape.
    enumerationScope:
      coverage: partial
      basis: Publicly named peers and substitutes retained from the assigned 2026 prefetched pool, grouped by workflow rather than exhaustive market share.
    claimRefs: [CP006, CP007, CP008, CP011, CP013]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Advance Intelligence Group
      - Specialist / incumbent alternative
      - Wallet / lender substitute
      - Evidence-backed implication
    rows:
      - [Identity verification and KYC, "ADVANCE.AI offers identity verification, KYC, and KYB", "AuthBridge is named as an identity / screening peer", "Not the core wallet-led substitute motion in retained evidence", "Enterprise trust workflows face focused specialist competition"]
      - [Fraud and risk tooling, "AIG claims risk-management capability", "SHIELD is named as a fraud / risk competitor", "Consumer wallets compete more through checkout habit than fraud tooling", "AIG must defend both enterprise risk and consumer usage surfaces"]
      - [Consumer lending and BNPL, "Atome Financial covers BNPL, cash loans, cards, and digital lending", "Validus is a lending-platform peer with different SME focus", "Kredit Pintar is a regulated Indonesian lending substitute", "The credit stack faces both platform peers and locally licensed lenders"]
      - [Embedded consumer distribution, "Merchant network and multi-market presence are claimed by AIG / Atome", "Specialists in the retained pool do not show equivalent wallet reach", "GCash, GrabPay, ShopeePay, and Maya benefit from existing payment habits", "Distribution can outweigh pure feature depth at checkout"]
      - [Public benchmarking transparency, "No retained public pricing or benchmark page", "Tracxn provides profiles, not tariff detail", "Industry and roster sources show adoption or licence status, not price lists", "Competitive analysis is stronger on scope and reach than on unit economics"]
    notes: Cells reflect only the retained prefetched evidence; "no retained public pricing" means absent from this pool, not proof of internet-wide absence.
    enumerationScope:
      coverage: partial
      basis: Matrix compares the buying criteria covered by the assigned sources and marks unsupported pricing or benchmark detail as unknown in this evidence set.
    claimRefs: [CP002, CP003, CP007, CP008, CP011, CP013, CP015]
  - id: TP003
    title: Pricing / packaging comparison from retained public evidence
    columns:
      - Offer set
      - Public pricing observed in retained evidence
      - Contract or pricing model signal
      - Included capabilities visible in retained evidence
      - Implication
    rows:
      - [ADVANCE.AI enterprise stack, null, "Enterprise-sales motion implied; exact pricing not disclosed in retained sources", "Identity verification, KYC, KYB, risk, credit information", "Buyers likely negotiate based on workflow scope rather than list pricing"]
      - [Atome Financial consumer products, null, "Credit economics not publicly broken out in retained sources", "BNPL, cash loans, cards, digital lending", "Consumer monetization cannot be benchmarked cleanly from this public pool"]
      - [Named specialist peers, null, "Tracxn profiles disclose scope and funding but not tariff detail", "Identity screening, fraud tooling, SME lending", "Peer comparisons are credible on workflow positioning, weak on pricing"]
      - [Wallet-led and regulated substitutes, null, "Industry and regulatory sources show usage or licence status, not package prices", "Wallet checkout habits, QR rails, licensed lending", "Distribution and regulatory access are more visible than monetization"]
    notes: Null means no public list price or take-rate was visible in the assigned retained evidence for the row's offer set.
    enumerationScope:
      coverage: partial
      basis: Pricing table is limited to what the assigned public evidence explicitly disclosed; the retained pool did not include product tariff pages for the named competitors.
    claimRefs: [CP003, CP010, CP011, CP013, CP015, CP016]
figures:
