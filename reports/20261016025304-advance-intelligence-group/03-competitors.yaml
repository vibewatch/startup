    data:
      xAxis:
        label: Workflow breadth
        min: 1
        max: 5
        lowLabel: Single workflow
        highLabel: Multi-product stack
      yAxis:
        label: Embedded distribution / regulatory leverage
        min: 1
        max: 5
        lowLabel: Limited channel depth
        highLabel: Scaled channels or licences
      points:
        - label: Advance Intelligence Group
          x: 5
          y: 4
          note: Two-business platform spanning enterprise identity/risk and consumer finance.
        - label: Atome Financial
          x: 4
          y: 5
          note: Multi-market consumer-finance distribution and merchant network are emphasized in the retained evidence.
        - label: AuthBridge
          x: 2
          y: 2
          note: Specialist identity and screening competitor.
        - label: SHIELD
          x: 2
          y: 3
          note: Focused fraud and risk-intelligence positioning.
        - label: Validus Group
          x: 3
          y: 3
          note: Lending-platform peer with SME orientation.
        - label: GCash / wallet-led substitutes
          x: 3
          y: 5
          note: Very large user and merchant reach can outweigh narrower workflow breadth.
    approximationNotes: >-
      Scores are ordinal synthesis from retained evidence, not an external benchmark. X estimates product breadth visible
      in the source set; Y estimates embedded distribution or regulatory leverage visible in the same sources.
    claimRefs: [CP002, CP003, CP004, CP007, CP008, CP009, CP011, CP013]
callouts:
  - calloutType: insight
    title: Breadth is the moat claim
    body: >-
      The retained evidence supports AIG's broadest competitive claim not as "best single-feature vendor," but as a
      platform spanning enterprise identity/risk workflows and consumer-credit distribution.
    claimRefs: [CP002, CP003, CP004, CP014]
  - calloutType: risk
    title: Public proof lags the breadth story
    body: >-
      Public sources show crowding, wallet substitution, and local licensed lenders, but they do not supply an
      independent benchmark proving superior pricing, conversion, loss rates, or retention versus those alternatives.
    claimRefs: [CP005, CP010, CP011, CP012, CP015]
