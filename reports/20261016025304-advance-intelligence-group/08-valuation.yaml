company:
  name: Advance Intelligence Group
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence now provides a meaningful asset-level anchor through Grab's proposed
    US$1.49 billion purchase of 60% of Atome Financial, alongside stronger disclosed FY2025-H1
    2026 operating momentum and deeper bank funding support. But the retained public set still
    does not disclose consolidated group valuation, post-transaction proceeds to the parent, or
    liquidation-preference overhang, so the chapter's recommendation stays at track with a
    conditional rather than aggressive valuation stance.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The public record is stronger than in the prior report because it now includes an
      announced strategic transaction: Grab says it will acquire 60% of Atome Financial for
      US$1.49 billion, with the remaining 40% intended roughly two years after completion and
      still subject to regulatory approvals. That is a real asset-level price signal, not just
      a venture mark, and it sits on top of company-disclosed FY2025 revenue of US$470 million,
      second-consecutive pre-tax profitability, and a US$345 million syndicated debt renewal.
      Even so, the retained evidence does not disclose how much of the announced consideration
      ultimately accrues to Advance Intelligence Group, what obligations remain at holdco, or
      what liquidation preferences sit ahead of common equity. That gap makes a buy call too
      aggressive; the defensible posture is track, with entry discipline tied to transaction
      terms and post-deal perimeter clarity rather than to a headline revenue multiple alone.
    claimRefs: [CV004, CV006, CV009, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: upside-case-supported-by-public-evidence
    title: Upside case supported by public evidence
    body: >-
      The strongest long thesis in the retained evidence is that AIG still sits on a large
      inclusion and digitization runway. The official Atome page says 6 in 10 consumers in
      Southeast Asia still lack inclusive access to credit and financial services, while
      Fintech News reports that Philippine digital wallets already represented 41% of
      e-commerce and 29% of point-of-sale value in 2025. Company disclosures also show scale:
      Atome Financial says FY2025 revenue reached US$470 million, total operating income
      US$360 million, GMV above US$4 billion, and annualized June 2026 net revenue US$800
      million. The lender stack is also meaningful. AIG says Atome Financial is backed by
      major funding partners, and Digital News Asia reports that bank support expanded from a
      US$200 million 2024 facility to US$345 million in 2026. If those operating and funding
      signals persist, the announced Grab transaction could mark only part of the value already
      created inside the consumer-finance perimeter.
    claimRefs: [CV003, CV006, CV007, CV008, CV009, CV011, CV012]
  - id: what-limits-precision
    title: What limits precision
    body: >-
      The downside case is less about whether AIG has built valuable assets and more about how
      much of that value outside investors can actually underwrite from public evidence. Kompas
      reports that OJK's roster of licensed fintech lenders fell to 94 after a license
      revocation, which is a reminder that consumer-finance operators still live inside an
      active regulatory filter. Fintech News also notes that cash remained 42% of Philippine
      in-store transaction value in 2025, so digital-finance adoption is real but not complete.
      Meanwhile, the retained official media page is still operational rather than investor
      oriented, and no retained public source in this chapter discloses consolidated group
      valuation, post-transaction proceeds to the parent, or liquidation preferences. KPMG's
      observation that conventional approaches to risk and regulatory compliance are no longer
      fit for purpose fits the same conclusion: this is a cross-border fintech that still
      deserves valuation haircuts for complexity, disclosure limits, and execution risk.
    claimRefs: [CV012, CV013, CV015, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-diligence-asks
    title: Scenarios and diligence asks
    body: >-
      The most supportable base case is not a precise fair-value range but a conditional
      framework. In the bull case, the Grab transaction closes on broadly announced terms,
      Atome's 2026 run-rate converts into reported revenue, and investors can separately value
      the remaining ADVANCE.AI asset and any residual Atome stake. In the base case, the deal
      still helps validate value, but limited disclosure means investors should pay only a
      modest look-through value for undeclared holdco optionality. In the bear case, approvals
      slip, consumer-credit performance weakens, or the public mark proves less transferable
      to the parent. The final diligence asks are straightforward: obtain post-transaction
      ownership and proceeds mechanics, audited consolidated statements, country-level credit
      quality metrics, and the preference stack before underwriting a buy or high-conviction
      fair-value range.
    claimRefs: [CV002, CV004, CV005, CV008, CV013, CV014, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: ["Dimension", "Assessment", "Public evidence", "Decision implication"]
    rows:
      - ["Recommendation", "track", "Grab's announced 60% Atome Financial transaction adds a real external mark, but only at the asset level.", "Do not underwrite a buy without post-deal economics and perimeter clarity."]
      - ["Confidence", "medium", "Operating momentum and bank support are disclosed, but core valuation inputs remain missing for the parent.", "Use the transaction as a diligence anchor, not as a full-group clearing price."]
      - ["Risk rating", "high", "Cross-border lending still faces regulatory tightening, heterogeneous adoption, and undisclosed credit-quality detail.", "Demand a wider margin of safety than for a single-jurisdiction software business."]
      - ["Valuation stance", "conditional / fair only with a discount", "Public evidence supports value creation, but not a precise group fair-value range.", "Avoid paying for both announced Atome value and unproven holdco upside at the same time."]
      - ["Exit / hold logic", "strategic or event-driven", "The clearest public exit marker is strategic monetization of Atome Financial rather than a disclosed near-term IPO path.", "Track for deal closure, proceeds use, and any residual ADVANCE.AI monetization plan."]
    notes: "Synthesis of retained public sources; no retained source discloses a consolidated group valuation, cap table, or liquidation-preference stack."
    claimRefs: [CV004, CV005, CV006, CV008, CV009, CV013, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: ["Argument", "Direction", "Support", "What would change the view"]
    rows:
      - ["Atome has real scale and momentum", "thesis", "FY2025 revenue US$470M, GMV above US$4B, annualized June 2026 net revenue US$800M.", "A weaker view would follow if audited results or later filings fail to support the disclosed run-rate."]
      - ["Capital access is improving rather than tightening", "thesis", "Institutional funding partners plus a syndicated facility upsized to US$345M suggest continued lender support.", "A stronger view would require more disclosure on pricing, loss rates, and covenant headroom."]
      - ["Regional demand remains structurally attractive", "thesis", "Official messaging cites a large underbanked base, while digital-wallet adoption in core SEA markets continues to rise.", "A stronger view would require proof that demand converts into durable, profitable cohorts rather than one-time promotional growth."]
      - ["Public valuation evidence is still incomplete at parent level", "anti-thesis", "The announced Grab deal values 60% of Atome Financial, but retained public sources do not show post-transaction proceeds, parent liabilities, or preference overhang.", "This concern falls if management publishes transaction mechanics and a reconciled post-deal ownership bridge."]
      - ["Regulatory and market-friction risk still deserves a discount", "anti-thesis", "OJK's lender roster fell after a revocation, and cash still represented 42% of Philippine in-store transaction value in 2025.", "This concern falls if AIG discloses resilient credit quality and approvals stay on schedule across markets."]
    notes: "Arguments are analytical syntheses tied back to public evidence; the table distinguishes scale and financing support from unresolved valuation plumbing."
    claimRefs: [CV003, CV004, CV006, CV008, CV009, CV011, CV012, CV013, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Probability signal", "Downside trigger"]
    rows:
      - ["Bull", "Grab closes on broadly announced terms; FY2026 run-rate converts to reported revenue; ADVANCE.AI retains strategic value.", "A buyer can pay for verified Atome realization plus separately evidenced residual value, but still should not double-count both.", "Requires transaction documents, audited bridge statements, and credible proof that momentum is not promotion-led.", "Regulatory approval slippage, weaker-than-advertised parent proceeds, or adverse credit migration."]
      - ["Base", "Deal broadly validates value, but holdco economics remain partially opaque and market adoption stays uneven.", "Most supportable stance is fair only with a discount to reflect disclosure and execution risk.", "Best fit with current public evidence because it combines external price support with unresolved parent-level questions.", "No ownership bridge, no cohort loss metrics, or no clear use of proceeds after closing."]
      - ["Bear", "Transaction terms reset, approvals slip, or consumer-finance risk rises before monetization is complete.", "Avoid paying any price that assumes the announced Atome mark and the remaining group optionality are both fully realizable.", "Supported if regulatory pressure intensifies or if disclosed momentum fails to convert into durable reported results.", "Down-round style repricing, facility dependence without transparency, or new licensing friction in core lending markets."]
    notes: "Ranges are directional rather than numeric because retained public evidence does not disclose a consolidated group valuation or post-transaction capitalization."
    claimRefs: [CV004, CV006, CV008, CV009, CV012, CV013, CV016]
