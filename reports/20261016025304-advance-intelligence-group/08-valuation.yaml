callouts:
  - calloutType: recommendation
    title: Track pending deal mechanics
    body: >-
      The announced Grab transaction is the first strong public price anchor in the retained
      evidence set, but it is still not enough to justify a buy at the parent level without
      post-transaction ownership, proceeds, and preference detail.
    claimRefs: [CV004, CV016]
  - calloutType: assumption
    title: What would move this to buy
    body: >-
      Publish audited consolidated statements, disclose the post-deal capitalization and
      proceeds bridge, and show country-level credit-performance durability after growth
      financing expands.
    claimRefs: [CV006, CV008, CV009, CV016]
