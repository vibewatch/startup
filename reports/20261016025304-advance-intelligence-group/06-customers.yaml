schemaVersion: report-v2
artifact: customers
slug: advance-intelligence-group
runDate: 2026-10-16
company:
  name: Advance Intelligence Group
chapter:
  number: 6
  title: Customers
  summary: >-
    Advance Intelligence Group's public customer evidence still shows a broad
    three-sided base across enterprise clients, merchants, and consumer
    borrowers, but the strongest fresh proof is concentrated in company-issued
    2026 updates from Atome in the Philippines. Third-party corroboration is
    thinner on retention, concentration, and named customer outcomes, so the
    chapter leans on adoption signals and flags durability as a live diligence
    gap rather than a verified strength.
sections:
  - id: segment-mix
    title: Segment mix is broad, but vintages are inconsistent
    body: >-
      The assigned pool supports a consistent high-level picture that Advance
      Intelligence Group serves three customer surfaces: enterprise buyers via
      ADVANCE.AI, merchants via Atome and Ginee, and end consumers via Atome
      Financial and Kredit Pintar. The issue is less whether the footprint is
      real than how current each disclosed metric is. Multiples' current profile
      repeats older traction snapshots with different customer counts across
      enterprise, merchant, and consumer lines, while LinkedIn gives fresher but
      still company-issued statements about 500+ enterprise clients and millions
      of people served. That makes segment breadth credible, but active-customer
      depth and the revenue weight of each segment remain only partially
      disclosed.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-expansion
    title: Fresh adoption proof is strongest in the Philippines
    body: >-
      The clearest current adoption signal in the assigned pool is Atome's
      Philippines card base. LinkedIn posts claim more than 3 million Atome
      cards issued in the Philippines, with use extending beyond Metro Manila
      into Luzon, Visayas, and Mindanao, and management frames up to 80% of card
      holders as first-time cardholders. Those are meaningful expansion signals,
      but they are still self-reported and attached to funding updates rather
      than an independent customer case study or portfolio cohort disclosure.
      Independent market context from Fintech News Singapore reinforces why this
      geography matters: digital-wallet and QR adoption are rising quickly, yet
      payment behavior is fragmented market by market, so merchant expansion has
      to track local rails rather than one uniform regional playbook.
    claimRefs: [CU005, CU006, CU008, CU015]
    tableRefs: [TU002]
  - id: named-proof
    title: Named counterparties validate relevance more than retention
    body: >-
      The assigned pool's strongest named proof comes from counterparties and
      channels, not from end customers publishing deployment outcomes. Grab's
      planned acquisition of 60% of Atome Financial is the sharpest external
      signal that AIG's consumer-finance assets and merchant network matter at
      regional scale, while the AUB facility shows local lenders are willing to
      fund the Philippine card base in peso terms. Those are important proofs of
      strategic relevance and financing access, but they are not the same as
      audited renewal, repeat-use, or customer-satisfaction evidence. The named
      proof table therefore shows more validation of distribution and balance
      sheet support than proof of durable customer economics.
    claimRefs: [CU006, CU007, CU015]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability, concentration, and customer quality remain under-evidenced
    body: >-
      Public durability proof remains the weakest part of the customer story in
      this pool. Neither the assigned official surfaces nor the accessible
      third-party pages disclose GRR, NRR, churn, renewal, or top-customer
      concentration. The official media URL renders brand-permission text rather
      than a customer-story index, Caplight's public profile exposes funding
      history but keeps filing records behind access controls, and the EDBI jobs
      page contributes no deployment detail. On the adverse side, Indonesia's
      Kredit Pintar remains licensed by OJK, but IDXChannel reports field debt
      collection for long-overdue borrowers, underscoring that part of AIG's
      customer expansion can create service and consumer-protection friction even
      when the product is regulated.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale signal
      - Strategic value
      - Gap
    rows:
      - - ADVANCE.AI enterprise
        - Enterprise risk/compliance teams buy; onboarding, fraud, and credit teams use; enterprise customer pays
        - KYC, KYB, credit information, and risk management
        - 300 enterprise customers in a 2019 Multiples snapshot; 500+ enterprise clients in AIG's 2026 LinkedIn profile
        - Anchors recurring B2B workflows and regional bank/fintech relationships
        - No vertical mix, retention, or average contract value disclosed
      - - Merchant network
        - Merchant operations teams onboard; merchant is user and economic partner
        - Checkout financing, merchant acceptance, and commerce tooling
        - 100,000 merchants in the 2021 traction snapshot and 200,000+ merchants in another Multiples profile block
        - Merchant breadth is the distribution bridge between enterprise scoring and consumer financing
        - No active-merchant denominator, repeat merchant rate, or geography split disclosed
      - - Consumer lending and cards
        - Consumer applies, borrows, and repays
        - BNPL, cash loans, cards, and digital lending
        - 20 million consumers in the 2021 traction snapshot; 3 million Atome cards in the Philippines in 2026
        - Largest visible current adoption signal in the assigned pool
        - No disclosed delinquency, vintage, or repeat-purchase cohorts
      - - Indonesia Kredit Pintar borrowers
        - Borrower is user and payer
        - Online consumer loans
        - OJK-licensed lender in April 2026; field debt collection reported for long-overdue borrowers
        - Extends AIG into mass-market lending beyond merchant checkout
        - Collections friction can hurt brand trust and repeat usage
    notes: >-
      Mixes company-claimed and third-party-reported metrics from different
      vintages; null-style gaps mean the assigned pool does not disclose active,
      retained, or revenue-weighted customer counts.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU009, CU010]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Enterprise customers
        - 300
        - 2019-09
        - Multiples Series C summary
        - Medium
        - Establishes early enterprise traction across five Asian markets
        - No active-account or renewal denominator
      - - Enterprise / merchant / consumer footprint
        - 800 enterprise clients; 100,000 merchants; 20 million consumers
        - 2021 snapshot cited on Multiples
        - Multiples May 2023 profile block
        - Medium
        - Shows the business had already scaled across all three customer surfaces before the 2023 round
        - No split by active vs. cumulative accounts
      - - Enterprise clients
        - 500+
        - 2026
        - LinkedIn company update
        - Medium
        - Suggests enterprise scale has remained material into the current refresh window
        - No disclosure of paying vs. free, retained, or expanding clients
      - - Consumer card issuance
        - 3 million Atome cards in the Philippines
        - 2026-06
        - LinkedIn Atome Financial update
        - Medium
        - Current strongest disclosed adoption proof in the assigned pool
        - No MAU, spend-per-card, or repayment-vintage detail
      - - First-time cardholder mix
        - Up to 80%
        - 2026-06
        - LinkedIn Atome Philippines / AUB facility post
        - Medium
        - Suggests new-to-credit acquisition rather than only deepening existing borrower relationships
        - No approval-rate, loss-rate, or repeat-activation denominator
    notes: >-
      The trajectory combines heterogeneous metrics from current company posts
      and older third-party round summaries, so it indicates scale direction
      rather than a clean like-for-like cohort series.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU015]
  - id: TU003
    title: Named customer proof table
    columns:
      - Counterparty or proof surface
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Outcome signal
      - Limitation
    rows:
      - - Grab
        - Consumer finance / channel expansion
        - Proposed acquisition of 60% of Atome Financial across five Southeast Asian markets
        - Strategic transaction; not yet closed
        - External validation that Atome's lending and merchant surfaces matter to a scaled regional platform
        - Regulatory approval runs to Q32027 and does not prove standalone retention
      - - Asia United Bank (AUB)
        - Philippines consumer finance
        - PHP5 billion wholesale facility supporting Atome's local card growth
        - Live funding relationship
        - Bank underwriting supports continued issuance around a 3 million card base
        - Counterparty validates funding access, not end-customer satisfaction or repeat use
      - - Kredit Pintar under OJK oversight
        - Indonesia consumer lending
        - Licensed online lender with formal collections activity
        - Live operating surface
        - Confirms AIG still runs a regulated lending business in Indonesia
        - Adverse service friction is visible, but borrower retention and complaint rates are undisclosed
    notes: >-
      This is a partial sample of the strongest named proof visible in the
      assigned pool; it skews toward counterparties and regulators because no
      fresh independent customer case studies survived in accessible form.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample limited to named counterparties and regulated customer-facing
        surfaces explicitly identified in the assigned accessible source pool.
    claimRefs: [CU006, CU007, CU009, CU010, CU015]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      AIG's disclosed journey runs from enterprise risk tools into merchant
      distribution and then consumer credit usage, with funding partners and
      collections quality shaping how far expansion can compound.
    data:
      items:
        - label: Enterprise verification sale
          actor: Banks, fintechs, telcos, and enterprise risk teams
          stage: Enterprise acquisition
          touchpoints:
            - ADVANCE.AI is presented as the B2B identity, KYC, KYB, and risk-management entry point.
            - Public scale moved from 300 enterprise customers in 2019 to 500+ enterprise clients in 2026 disclosures.
        - label: Merchant network onboarding
          actor: Merchants and commerce operators
          stage: Distribution buildout
          touchpoints:
            - Third-party round summaries cite 100,000 to 200,000+ merchants across the platform.
            - Merchant breadth appears to be the bridge between enterprise scoring infrastructure and consumer-finance demand.
        - label: Consumer credit activation
          actor: Consumers
          stage: User acquisition
          touchpoints:
            - Company and database disclosures point to millions of consumers across Southeast Asia.
            - The freshest disclosed metric is 3 million Atome cards in the Philippines.
        - label: Everyday spend expansion
          actor: Atome cardholders
          stage: Usage deepening
          touchpoints:
            - Management says millions of Filipinos use the card for groceries, utilities, and telco bills.
            - Up to 80% of cardholders are framed as first-time cardholders, implying acquisition beyond an existing credit base.
        - label: Partner-funded scaling
          actor: Banks and strategic channels
          stage: Capacity expansion
          touchpoints:
            - AUB provided a PHP5 billion wholesale facility in the Philippines.
            - Grab agreed to acquire 60% of Atome Financial, subject to regulatory approval.
        - label: Collections and trust loop
          actor: Borrowers and regulators
          stage: Retention risk
          tone: risk
          touchpoints:
            - Kredit Pintar remains on OJK's April 2026 licensed-lender list.
            - IDXChannel reported field debt collection for long-overdue borrowers, highlighting customer-experience friction.
    approximationNotes: >-
      Stages combine enterprise, merchant, consumer, and funding touchpoints in
      logical order; the figure is directional and does not imply conversion
      rates between stages.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU009, CU010, CU015]
callouts:
  - calloutType: insight
    title: Freshest proof is concentrated in one geography
    body: >-
      The assigned pool's best current customer evidence is not group-wide
      retention data but the Philippines card base: 3 million cards, a large
      first-time-cardholder share, and a new local-currency AUB facility that
      supports further issuance.
    claimRefs: [CU005, CU006, CU015]
  - calloutType: risk
    title: The public record is broad on scale and thin on durability
    body: >-
      Accessible surfaces show that AIG has real enterprise, merchant, and
      consumer reach, but they do not disclose GRR, NRR, churn, renewal, or
      customer concentration, so durability still has to be diligenced
      directly with management and lender data.
    claimRefs: [CU011, CU012, CU013, CU014]
