        - FY2025 收入 US$470M，GMV 高于 US$4B，2026 年 6 月年化净收入 US$800M。
        - 如果审计结果或后续申报无法支持已披露的运行速率，判断就会转弱。
      - - 资本获取在改善，而非收紧
        - 论点
        - 机构资金伙伴加上扩容至 US$345M 的银团融资，说明贷款方仍在持续支持。
        - 若要得出更强的判断，还需要更多关于定价、损失率和契约余量的披露。
      - - 区域需求仍具结构性吸引力
        - 论点
        - 官方口径提到大量银行服务不足人群，而核心 SEA 市场的数字钱包渗透率仍在上升。
        - 若要得出更强的判断，需要证明需求最终沉淀为持久且盈利的用户群，而不是一次性的促销拉动增长。
      - - 母公司层面的公开估值证据仍不完整
        - 反方论点
        - 已宣布的 Grab 交易对 Atome Financial 的 60% 进行估值，但保留的公开来源没有披露交易后所得款项、母公司负债或优先权悬置。
        - 若管理层公布交易机制及经核对的交易后持股桥接表，这一担忧会减弱。
      - - 监管和市场摩擦风险仍应计入折价
