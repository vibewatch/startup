      - number: '4.2'
        title: 资本结构与监管强度
        blocks:
          - type: paragraph
            body: >-
              历史融资时间线由公司概览负责；本节的前瞻性财务问题是，消费金融业务是否仍需要大量外部资金来维持增长。 当前披露显示，公司继续依赖债务额度、注资和拟议中的战略交易。Atome Philippines 公开宣布了与
              Asia United Bank 的 PHP5 billion 批发融资， 集团强调了一笔增额至 US$345 million 的银团债务融资，独立档案还报道了对 Atome Financial
              的进一步资本支持。 这些额度和注资说明的是融资渠道，而不是手头现金或 runway；同样，在交割和资金分配细节明确前，拟议交易的对价不能视为母公司的可用流动性。
              这些活动提升了灵活性，但也凸显营运资金强度和对贷款方意愿的敞口。与此同时，印尼新的 BNPL 制度让披露、投诉处理和运营控制具有直接财务意义， 因为制裁可能包括罚款和责令停业。
            claimRefs:
