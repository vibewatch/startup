  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              应将 Advance Intelligence Group 视为覆盖多个场景的金融科技与商业平台，而不是单独的 BNPL 供应商。 在公司和合作伙伴的描述中，反复出现的边界是：Atome Financial
              提供消费信贷，ADVANCE.AI 提供企业身份与欺诈基础设施， Ginee 提供商户运营软件。因此，相关支出池包括消费金融余额、验证与风险预算以及商业软件预算。
              替代方案也随工作流而变：消费端是现有银行卡和分期金融，受监管企业内部的合规与反欺诈运营，以及商户使用的单点解决方案或手工多渠道店铺管理。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM012
      - number: '2.2'
        title: 用服务规模观察市场，而不是拼接一套干净的 TAM
        blocks:
          - type: paragraph
            body: >-
              指定证据池中最有力的量化证据是服务规模披露，而不是独立市场测算。Warburg Pincus 联合发布的一则公司 2021 年融资公告， 给出了一组历史运营视角：覆盖 12 个市场、800
              多家企业客户、100,000 家商户和 20 million 名消费者；之后一家金融科技目录则描述了更大的覆盖面， 包括 500 多家企业客户、235,000 家商户和 40 million
              名消费者。这些快照显示需求规模大、跨客群触达广， 但由于业务单元、日期和分母不同，无法直接比较，也不足以当作 TAM 或 SAM。本章因此使用一座受约束的“已报告触达”金字塔作为观测市场视角，
              而不是从指定证据池之外编造广泛的第三方 TAM 估算。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
