  - id: TV003
    title: 乐观情景 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观情景
        - Grab 按大体已公布的条款完成交易；FY2026 年化运行水平转化为报告收入；ADVANCE.AI 保留战略价值。
        - 买方可以为已验证的 Atome 兑现价值以及有独立证据支持的剩余价值付费，但仍不应将两者重复计价。
        - 需要交易文件、经审计的桥接报表，以及可信证据证明增长势头并非由促销驱动。
        - 监管审批延迟、母公司所得款项弱于宣传，或信贷迁徙恶化。
      - - 基准
        - 交易大体验证了价值，但控股公司经济状况仍部分不透明，市场采用也依然不均衡。
        - 最有依据的立场是：只有计入披露和执行风险的折价后，估值才算合理。
        - 这最符合当前公开证据，因为它将外部价格支撑与尚未解决的母公司层面问题结合起来。
        - 没有持股桥接表、没有用户群损失指标，或交割后资金用途不清晰。
      - - 悲观情景
        - 变更交易条款、审批延迟，或在完成变现前消费金融风险上升。
        - 不要支付任何建立在已宣布的 Atome 估值和集团剩余期权价值均可完全兑现这一假设上的价格。
        - 若监管压力加剧，或披露的增长势头无法转化为持久的报告业绩，则该情景得到支持。
        - 类似下轮融资的重新定价、缺乏透明度却依赖融资额度，或核心放贷市场出现新的许可摩擦。
    notes: 这些区间是方向性的而非数值性的，因为保留的公开证据没有披露集团合并估值或交易后资本结构。
