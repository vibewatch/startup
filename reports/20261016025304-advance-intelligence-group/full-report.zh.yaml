      - number: '4.3'
        title: 结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              财务图景方向上积极，但仍不足以完成投资判断。Atome 披露的收入、GMV、税前盈利主张和持续获得银行额度的能力，
              表明这是一项已达到实质规模的业务，而不是尚无收入的试验。会计口径的盈利不等于现金创造，已有额度也不等于当前流动性。
              区域支付行为同样支持需求：印尼现金支付正在大幅下降，数字钱包已在菲律宾普及，但货到付款和店内现金仍然重要。
              问题在披露质量。保留的公开来源描述了增长、融资、牌照和市场背景，却没有足够具体地披露已实现定价、take-rate、信贷损失、CAC、回本周期、
              合并现金或资金续航，无法据此判断利润率的持久性或资本充足性。实际结论是：公开证据支持动能，但若没有管理层材料， 仍无法清晰判断收入质量或下行韧性。
            claimRefs:
