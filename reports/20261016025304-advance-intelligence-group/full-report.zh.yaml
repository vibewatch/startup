        title: 资本、交易对手与外部利益相关方
        blocks:
          - type: paragraph
            body: >-
              公司的融资深度看起来已处于后期阶段，但股权、债务和战略结果方面的证据并不均衡。公司当前渠道将集团与 SoftBank Vision Fund 2 和 Warburg Pincus 联系起来，LinkedIn
              还列出 Ares、Vision Plus Capital 和 EDBI 等支持方。同一渠道列出广泛的贷款方与融资伙伴， 2026 年 LinkedIn 更新又增加了一个更具影响力的信号：Grab 计划以
              US$1.49 billion 收购 Atome Financial 60% 的股份， 预计须在 2027
              年第三季度前获得监管批准。这具有战略意义，但不等于当前的集团整体估值；本章仍缺少公开股权结构表或优先权结构， 无法将已宣布的子公司交易换算为集团普通股权益价值。
