        - label: Atome Financial
          x: 4
          'y': 5
          note: 保留证据重点体现其多市场消费金融分销和商户网络。
        - label: AuthBridge
          x: 2
          'y': 2
          note: 专注身份与筛查的竞争者。
        - label: SHIELD
