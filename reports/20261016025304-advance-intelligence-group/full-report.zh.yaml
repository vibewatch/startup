      - number: '3.3'
        title: 转换成本更多来自嵌入式工作流和牌照，而不是透明定价
        blocks:
          - type: paragraph
            body: >-
              这里保留的公开证据表明，转换成本更多由运营因素驱动，而不是价格表。AIG 自称在东南亚拥有 500+ 家企业客户和数百万名用户， 这暗示工作流已有一定嵌入深度；拟议中的 Grab 交易则凸显 Atome
              Financial 在五个市场的商户网络和监管覆盖。 换言之，最能站得住脚的转换阻力来自分销、牌照和已嵌入的数据流，而不是竞争对手必须匹配的公开产品套餐。

              不利之处在于，同一公开记录并没有给投资人多少清晰的定价透明度。指定的官方媒体中心页面其实是商标许可页面，
              证据池中的合作伙伴托管页面提供的是分类背景，而不是可用的第三方基准。因此，公开定价、抽成率或逐项功能比较的证据都不足， 尽调只能转向工作流覆盖、合作伙伴接入和本地监管地位。
            claimRefs:
              - CP004
              - CP009
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP010
              - CP011
              - CP013
              - CP015
              - CP016
      - number: '3.4'
        title: 持久性有一定可能，但公开证明弱于业务宽度叙事
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一种合理的整合护城河：AIG 将企业身份与风险工具和大型消费金融业务结合起来，且 Tracxn 仍按总融资额将其排在所追踪同业之首。
              当贷款方和商户同时看重承销能力与客户分发触达时，这种组合可能有价值。拟议的 Grab 交易也说明，消费业务在战略上足够重要， 以至于一家区域超级应用愿意买入，而不只是正面竞争。

              即便如此，本证据池对护城河持久性的证明仍不完整。钱包替代品和全国性支付轨道正在快速扩张，身份与反欺诈领域仍有专业供应商活跃；
              保留证据也没有提供独立的损失率、批准率、转化率、定价或客户留存基准，无法证明其相对于这些对手的品类领导地位。 目前最稳妥的结论是：AIG 业务覆盖广且具有战略意义，但公开证据仍不足以证明难以复制的品类支配力。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
