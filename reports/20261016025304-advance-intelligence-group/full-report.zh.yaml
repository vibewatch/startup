      - number: '2.3'
        title: 买方地图、采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              不同业务线的采用逻辑并不相同。消费金融中，商户受理和承销基础设施先于消费者使用，因此在讨论用户规模主张前，
              零售商覆盖和贷款发放能力更重要。企业身份与风险业务的实际买方，更可能位于风险、合规、欺诈和运营团队，而非泛 IT 部门， 因为引用的用例围绕银行、金融科技公司、市场平台和支付网络的 KYC、KYB、KYT
              及交易监控。金融普惠需求和商户数字化是主要顺风， 但证据池也显示出约束：结构性交易仍需监管批准；本章缺少可读的独立 2026 年市场基准或单独披露的信贷质量数据， 因而无法将这些采用信号转化为干净的当年 SOM。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
