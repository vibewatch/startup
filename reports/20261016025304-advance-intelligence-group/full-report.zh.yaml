        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开点名的领导层仍集中在创始人或类似创始人的运营者身上。Jefferson Lanjie Chen 被介绍为集团董事长兼 CEO， 同时担任 Atome Financial CEO；Dong Shou 则被描述为
              ADVANCE.AI 联合创始人兼董事长。这种集中有助于后续章节在产品、 信贷和战略责任上使用稳定的人名，但也带来关键人物依赖：同一小组高管反复出现在融资、产品和面向市场的沟通中。
              当前证据池没有提供可靠的公开董事会名单、委员会架构或其他治理细节，因此治理尽调仍需直接管理层材料，而不能只靠公开网络证据。
