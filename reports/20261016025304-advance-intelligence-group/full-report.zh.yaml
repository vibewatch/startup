        title: 业务组合与已披露规模
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，集团整体有三类变现业务：Atome Financial 的消费金融、ADVANCE.AI 的企业验证与风险产品，以及 Ginee 的商户软件。
              历史集团公告仍是说明该模式广度最清晰的来源，而最新披露的财务数据来自 Atome Financial 自己 2026 年的帖子，而不是集团合并报表。
              这造成了明显的建模不对称：投资人能看到当前消费金融增长，却看不到集团收入或毛利中有多少来自企业软件、商户工具和信贷产品。 Ginee 披露的 GMV 和订单量说明商户软件业务可以搭乘交易活动增长；Atome 的
              FY2025 和 2026 年 6 月指标则显示， 消费金融业务目前提供了最强的公开规模信号。
