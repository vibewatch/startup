  - id: FI001
    title: 公开收入模型桥接
    type: flow
    summary: 消费金融规模是当前最明确的增长引擎，而企业软件和商户软件的贡献披露较少。
    data:
      nodes:
        - label: 需求背景
          detail: 菲律宾钱包占电商交易额的 41%，印度尼西亚现金占比从 77% 降至 36%，这支持了数字金融使用，但并未消除现金行为。
          tone: positive
        - label: 产品入口
          detail: 集团通过 Atome Financial、ADVANCE.AI 企业风险 / KYC 和 Ginee 商户软件变现。
          tone: neutral
        - label: 活动与规模基础
          detail: Atome FY2025 GMV 超过 US$4B，Jun 2026 年化 GMV 超过 US$6B；2021 年 9 月公司公告报告 Ginee 年化 GMV 约为 US$2B。
          tone: positive
        - label: 收入转化
          detail: Atome 披露 FY2025 收入为 US$470M、总经营收入为 US$360M，但企业和商户定价仍未披露。
          tone: positive
        - label: 融资层
          detail: 2026 年的公开信号包括 PHP5B 的 AUB 融资额度、US$345M 银团债务融资额度，以及有关新资本注入的独立标题。
          tone: risk
        - label: 投资判断
          detail: 公开证据支持规模和增长势头，但无法说明合并现金、资金续航、抽成率或信用损失情况。
          tone: risk
