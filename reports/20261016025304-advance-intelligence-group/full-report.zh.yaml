            title: 审批与牌照证据是第一道尽调关口
            body: 拟议的 Grab 交易和 AIG 的多市场借贷覆盖，围绕审批、牌照连续性和监管态度形成了一个二元风险面， 公开材料尚未完全消除这些疑问。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
          - type: callout
            title: 公开来源可追溯性弱于运营雄心
            body: 多个保留 URL 现在解析到通用、过时或不匹配的页面，因此在投资人依赖历史主张前，应要求管理层用一套干净的尽调档案替换公开营销材料。
            calloutType: insight
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              相比上一版报告，公开记录更强，因为现在包含一项已宣布的战略交易：Grab 表示将以 US$1.49 billion 收购 Atome Financial 60%， 剩余 40%
              计划在交割约两年后完成，且仍须取得监管批准。这是真实的资产层价格信号，而不只是风险投资估值标记； 其基础还包括公司披露的 US$470 million FY2025 收入、连续第二年税前盈利，以及 US$345
              million 的银团债务续期。 即便如此，保留证据没有披露已宣布对价最终有多少归属于 Advance Intelligence Group、控股公司仍承担哪些义务，
              或普通股之前存在怎样的清算优先权。这个缺口使得直接给出买入判断过于激进；更稳妥的姿态是跟踪， 入场纪律应绑定交易条款和交易后边界清晰度，而不是只看标题收入倍数。
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.2'
        title: 公开证据支持的上行情景
        blocks:
          - type: paragraph
            body: >-
              保留证据中最强的长期看多逻辑，是 AIG 仍处于巨大的金融普惠和数字化增长跑道上。官方 Atome 页面称，东南亚每 10 名消费者中仍有 6 名缺少包容性的信贷和金融服务； Fintech News
              报道，2025 年菲律宾数字钱包已占电商交易额的 41% 和销售点交易额的 29%。公司披露也显示了规模： Atome Financial 称 FY2025 收入达到 US$470 million、总经营收入
              US$360 million、GMV 超过 US$4 billion， 2026 年 6 月年化净收入达到 US$800 million。贷款方组合也颇具分量。AIG 称 Atome Financial
              得到主要融资伙伴支持， Digital News Asia 报道银行支持从 2024 年的 US$200 million 额度扩大到 2026 年的 US$345 million。
              若这些运营和融资信号持续，已宣布的 Grab 交易可能只反映了消费金融边界内已经创造的部分价值。
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: 限制精确度的因素
        blocks:
          - type: paragraph
            body: >-
              下行情景的关键不在于 AIG 是否打造了有价值的资产，而在于外部投资人究竟能凭公开证据承销其中多少价值。 Kompas 报道，OJK 持牌金融科技贷款方名录在一次牌照吊销后降至 94
              家，这提醒我们消费金融运营商仍处于活跃的监管筛选之中。 Fintech News 还指出，2025 年现金仍占菲律宾店内交易额的 42%，因此数字金融采用真实存在，但尚未完成。
              与此同时，保留的官方媒体页面仍在运营，却并非面向投资人的页面；本章没有任何保留的公开来源披露集团合并估值、交易后流向母公司的收益或清算优先权。 KPMG
              认为传统风险与监管合规方法已不再适用，这与同一结论相符：这是一家跨境金融科技公司，仍应因复杂性、披露限制和执行风险而接受估值折价。
            claimRefs:
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: 情景与尽调要求
        blocks:
          - type: paragraph
            body: >-
              最有依据的基准情景不是精确的公允价值区间，而是一套有条件的框架。乐观情景下，Grab 交易按已公布的大致条款完成， Atome 的 2026 年 run-rate 转化为报告收入，投资人可以分别为剩余的
              ADVANCE.AI 资产和 Atome 的任何剩余持股估值。 基准情景下，交易仍有助于验证价值，但披露有限意味着投资人对未披露的控股公司期权价值只能给予适度的穿透估值。
              悲观情景下，审批延误、消费信贷表现恶化，或者公开价格标记无法转移到母公司。最终的尽调要求很直接：
              在评估是否买入或给出高确信度公允价值区间前，取得交易后所有权和收益分配机制、经审计的合并报表、国家层面的信贷质量指标以及优先股堆叠。
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV008
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV009
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 跟踪待定交易机制
            body: 已宣布的 Grab 交易是保留证据集中第一个强有力的公开价格锚点，但在缺少交易后所有权、收益和优先权细节的情况下， 仍不足以支持买入母公司。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV016
          - type: callout
            title: 哪些信息会推动买入判断
            body: 发布经审计的合并报表，披露交易后资本结构和收益桥接，并展示增长融资扩大后各国信贷表现的持久性。
            calloutType: assumption
            claimRefs:
              - CV006
              - CV008
