  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争面横跨企业风险与消费信贷
        blocks:
          - type: paragraph
            body: >-
              保留的证据无法指向一组干净的可比公司，因为 Advance Intelligence Group 同时覆盖企业身份/风险软件和消费金融产品。 公司控制的 LinkedIn 披露将 ADVANCE.AI
              描述为企业身份、KYC、KYB、风险管理和信用信息供应商；同一来源则将 Atome Financial 放在
              BNPL、现金贷款、卡和数字借贷领域。这种产品宽度让集团比单一功能供应商覆盖更广，但也意味着竞争地图会按买方任务、监管和分销渠道分裂。

              Tracxn 的资料进一步印证了这种宽度及其拥挤程度：它统计集团周围有 51 家活跃竞争者，其中 12 家已融资、7 家已退出；
              点名的同业覆盖资金管理软件、身份验证、反欺诈工具和借贷。因此，正确的尽调框架不是“谁是最接近的单一对手”， 而是“每类竞争者掌握哪种工作流和预算”。实际上，AIG
              一边守住企业信任/风险工作流，另一边守住消费信贷或结账份额。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP011
              - CP013
      - number: '3.2'
        title: 点名的同业显示竞争按工作流展开，而非属于一个单一大类
        blocks:
          - type: paragraph
            body: >-
              保留证据中最有力的直接同业，集中在比 AIG 更窄的工作流上。Tracxn 将 AuthBridge 归入身份验证与筛查， 将 SHIELD 归入欺诈情报，将 Validus Group
              归入面向中小企业的数字借贷。Kompas 对 OJK 贷款方名录的 2026 年 4 月回顾， 又将 Kredit Pintar 列为受监管的印尼借贷替代者；Fintech News Singapore
              则显示，GCash、Maya、ShopeePay、GrabPay 以及其他钱包支付习惯， 正在塑造东南亚消费者和商户完成交易的方式。

              AIG 不需要被某一个竞争者整体取代。它可能把企业身份份额输给专注的验证供应商，把欺诈预算输给专业风险工具，
              也可能把结账或复用量输给钱包生态和本地持牌贷款方。因此，指定公开证据池支持的是按类别堆叠的竞争视角，而不是赢家通吃式同业比较。
            claimRefs:
