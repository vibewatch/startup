    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与当前业务范围
        blocks:
          - type: paragraph
            body: >-
              最清晰的身份锚点来自集团自有渠道。LinkedIn 将 Advance Intelligence Group 描述为总部位于新加坡、成立于 2016 年的公司， 同一页面还将其定位为 AI
              原生金融与数据平台。在指定证据池中最容易核实的运营组合，并不是泛泛的控股公司叙事， 而是一套由企业端 ADVANCE.AI 和消费端 Atome Financial 支撑的产品矩阵；历史里程碑流中仍能看到
              Ginee。 官方媒体中心一直更新至 2026 年 8 月，这一点很重要：即使若干核心封面指标在公开资料中仍只部分披露， 集团依然维护着活跃的企业沟通渠道。
