  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据支持一个六层产品栈，从数据和开户延伸至信贷产品、商户分销及特定司法辖区的合规。
    data:
      layers:
        - label: 数据与市场背景
          summary: External rails and market signals shaping distribution
          detail: 影响信贷产品采用的共享基础设施和品类环境
          items:
            - label: 区域支付基础设施
              detail: SGQR、DuitNow QR、QR Ph、QRIS / BI-FAST、PromptPay 和 VietQR 等 QR / A2A 系统
            - label: BNPL 市场背景
              detail: 印度尼西亚 BNPL 余额和 NPF 均在增长，同时伴随内生信用风险
        - label: 身份与开户
          summary: Enterprise verification and screening surface
          modules:
            - label: ADVANCE.AI
              detail: 身份验证、KYC/KYB、风险管理和征信服务
            - label: 反欺诈检查
              detail: 人脸识别、身份检查、企业检查和信用评分数据
        - label: 信贷决策
          summary: Risk outputs turned into lending actions
          items:
            - label: AI 驱动的信贷评估
              detail: 公司和合作伙伴口径将 Atome 放贷描述为由 AI 评估并进行风险管理
          outputs:
            - label: Credit limits and approvals
        - label: 消费信贷产品
          summary: User-facing lending and card products
          detail: 通过集团品牌界面提供的在营消费金融产品
          items:
            - label: Atome BNPL / 现金贷款 / 卡 / 数字放贷
            - label: Kredit Pintar 持牌放贷
        - label: 商户赋能
          summary: Checkout and seller-facing distribution layer
          detail: 将金融产品接入商户工作流的分销界面
          items:
            - label: 商户网络
              detail: Atome 商户关系和消费金融分销
            - label: Ginee 商户 SaaS
              detail: 已公开确认的商户软件产品，但该来源池中的最新细节有限
        - label: 合规与执行
          summary: Jurisdiction-specific permissions and launch governance
          detail: 决定产品能否推出的本地审批和法律执行
          items:
            - label: OJK 许可
            - label: 符合伊斯兰教法的 Atome Malaysia Card
            - label: Grab / Atome 监管审批路径
    approximationNotes: 分层是根据产品、许可和市场证据推断的；指定来源池没有公开披露内部服务、数据流和正常运行时间依赖关系。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
      - CE008
      - CE009
      - CE011
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: AIG 披露的旅程从企业风险工具延伸到商户分销，再进入消费信贷使用；融资伙伴和催收质量决定扩张能否持续复利。
    data:
      items:
        - label: 企业验证销售
          actor: 银行、金融科技公司、电信运营商和企业风险团队
          stage: 企业获客
          touchpoints:
            - ADVANCE.AI 被定位为 B2B 身份、KYC、KYB 和风险管理入口。
            - 公开规模从 2019 年的 300 家企业客户，增长到 2026 年披露的 500+ 家企业客户。
        - label: 商户网络接入
          actor: 商户和商业运营商
          stage: 分销扩张
          touchpoints:
            - 第三方融资轮次摘要称该平台拥有 100,000 至 200,000+ 家商户。
            - 商户覆盖面似乎是企业评分基础设施与消费金融需求之间的桥梁。
        - label: 消费信贷激活
          actor: 消费者
          stage: 用户获客
          touchpoints:
            - 公司和数据库披露显示，其覆盖东南亚数百万消费者。
            - 最新披露指标是菲律宾 3 million 张 Atome 卡。
        - label: 日常消费扩张
          actor: Atome 持卡人
          stage: 使用深化
          touchpoints:
            - 管理层称数百万菲律宾人使用该卡支付杂货、水电和电信账单。
            - 管理层称最高 80% 的持卡人是首次持卡者，由此可见，获客范围超出了既有信贷人群。
        - label: 伙伴融资扩张
          actor: 银行和战略渠道
          stage: 产能扩张
          touchpoints:
            - AUB 在菲律宾提供了 PHP5 billion 的批发融资额度。
            - Grab 同意收购 Atome Financial 的 60%，但须获得监管批准。
        - label: 催收与信任循环
          actor: 借款人和监管机构
          stage: 留存风险
          tone: risk
          touchpoints:
            - Kredit Pintar 仍在 OJK 2026 年 4 月的持牌贷款方名单中。
            - IDXChannel 报道了针对长期逾期借款人的线下催收，凸显客户体验摩擦。
    approximationNotes: 各阶段按逻辑顺序组合企业、商户、消费者和融资触点；该图是方向性的，不代表阶段之间存在转化率。
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU009
      - CU010
      - CU015
