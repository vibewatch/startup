  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 公开估值逻辑从需求和增长势头出发，经过融资支持，最终止步于监管和披露约束。
    data:
      nodes:
        - id: demand
          label: 需求续航
          detail: 东南亚消费者中仍有 6 成无法普惠地获得信贷。
          claimRefs:
            - CV011
        - id: momentum
          label: 运营势头
          detail: FY2025 收入 US$470M；2026 年 6 月年化净收入 US$800M。
          claimRefs:
            - CV006
            - CV008
        - id: capital
          label: 资本支持
          detail: 机构支持者加上 US$345M 银团融资额度。
          claimRefs:
            - CV003
            - CV009
        - id: mark
          label: 外部价格锚点
          detail: Grab 宣布以 US$1.49B 收购 Atome Financial 的 60%。
          claimRefs:
            - CV004
        - id: friction
          label: 监管与采用摩擦
          detail: OJK 许可审查和消费者偏好现金支付仍然重要。
          claimRefs:
            - CV012
            - CV013
        - id: outcome
          label: 结论
          detail: 持续跟踪；在为全集团上行空间付费前，先等待交易后的经济状况。
          claimRefs:
            - CV016
      edges:
        - from: demand
          to: momentum
          label: 支持
        - from: momentum
          to: capital
          label: 有助于吸引
        - from: capital
          to: mark
          label: 强化
        - from: mark
          to: friction
          label: 受到……制约
        - from: friction
          to: outcome
          label: 导向
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV008
      - CV009
      - CV011
      - CV012
      - CV013
      - CV016
