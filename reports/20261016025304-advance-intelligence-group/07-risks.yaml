chapter:
  number: 7
  title: Risks
  summary: >-
    Advance Intelligence Group's highest public-evidence risks are regulatory and
    funding-partner dependence inside a multi-jurisdiction lending model, compounded
    by a pending Grab transaction that still needs approvals and by thin public
    disclosure on credit performance. Public source hygiene is itself a diligence
    risk because several retained URLs now resolve to generic, stale, or
    misattributed pages, which weakens independent verification of historical
    claims.
sections:
  - id: regulatory-and-legal-exposure
    title: Regulatory and legal exposure is the top thesis-breaker
    body: >-
      Public evidence shows AIG spans enterprise KYC/KYB and risk products as well
      as BNPL and digital lending across multiple markets, so the company faces a
      broad licensing, consumer-protection, and transaction-approval surface rather
      than a single-country compliance burden. That burden became more immediate
      once AIG disclosed a proposed sale of 60% of Atome Financial to Grab for
      US$1.49 billion, with completion still subject to regulatory approval and a
      two-year period in which the businesses would continue under their existing
      brands and licences. Indonesian enforcement data adds context: Kompas,
      citing OJK, reported 94 licensed fintech lenders as of 24 April 2026 after
      one licence revocation, while Satgas PASTI said it had already stopped 951
      illegal online-lending entities in the first quarter. The mitigant is that
      AIG explicitly frames compliance and licensing as a supported capability, but
      residual exposure stays high until diligence confirms the legal-entity,
      licence, complaint, and approval status for each lending market and for the
      Grab transaction.
    claimRefs: [CR001, CR002, CR003, CR004, CR006, CR007]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: funding-and-partner-dependency
    title: Funding and partner dependence can amplify operating shocks
    body: >-
      The second-largest public risk is dependency on external funding and partner
      infrastructure. LinkedIn disclosures describe Atome Financial as backed by
      multiple institutional funding partners including Standard Chartered, HSBC,
      DBS, SMBC, BlackRock, Evolution X Capital, and InnoVen Capital, and the same
      page cites both an upsized US$345 million syndicated facility and a PHP5
      billion facility with AUB. That breadth is positive, but public evidence does
      not disclose concentration by facility, tenor, covenants, advance rates, or
      trigger events, so investors cannot tell whether one banking relationship or
      one warehouse structure carries outsized refinancing risk. The same operating
      model also spans consumer lending, enterprise verification, merchant tools,
      and wide geographic coverage, which raises execution load across compliance,
      underwriting, product, and collections. The working assumption should be
      that partner and capital access are strategic dependencies until management
      provides lender concentration, covenant headroom, and market-by-market
      funding resilience data.
    claimRefs: [CR001, CR002, CR003, CR005, CR013]
    tableRefs: [TR002, TR003]
  - id: disclosure-and-diligence-gaps
    title: Disclosure quality remains a material diligence risk
    body: >-
      Several retained URLs in the assigned pool currently resolve to generic or
      low-fidelity pages instead of durable evidence for financing, hiring, or
      third-party profile claims. The URL titled as a Series D announcement on
      AIG's own domain now resolves to a generic contact page, the company's media
      URL exposes trademark-permission guidance rather than an accessible archive,
      an EDBI path for Advance Intelligence Group resolves to a generic EDBI page,
      and an Endeavor page headed "Advance Intelligence Group" displays ShopBack
      founder biographies. Even the assigned Nikkei Asia URL exposes only a
      subscription shell in the fetched artifact rather than reviewable
      company-specific text. None of those issues proves an operating failure, but
      together they do raise the cost of verifying historical fundraising,
      executive, hiring, and risk assertions from public materials alone. The
      investment implication is straightforward: require a dated licence pack,
      audited legal-entity financials, delinquency and loss-vintage reporting, and
      archived board-approved transaction materials before underwriting downside.
    claimRefs: [CR008, CR009, CR010, CR011, CR012]
