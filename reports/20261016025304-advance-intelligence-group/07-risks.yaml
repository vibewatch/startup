callouts:
  - calloutType: risk
    title: Approval and licensing evidence is the first diligence gate
    body: >-
      The proposed Grab transaction and AIG's multi-market lending footprint
      create a binary risk surface around approvals, licence continuity, and
      regulator posture that public materials do not fully close.
    claimRefs: [CR003, CR004, CR006, CR007]
  - calloutType: insight
    title: Public-source traceability is weaker than the operating ambition
    body: >-
      Several retained URLs now resolve to generic, stale, or mismatched pages,
      so management should be expected to replace public marketing artifacts with a
      clean diligence archive before investors rely on historical claims.
    claimRefs: [CR008, CR009, CR010, CR011, CR012]
