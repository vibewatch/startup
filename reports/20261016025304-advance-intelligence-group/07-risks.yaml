  evidenceGaps:
    - type: missing-source
      severity: material
      topic: credit-performance-disclosure
      missingEvidence: Market-by-market delinquency vintages, charge-off curves, recoveries, and NPL ratios for Atome and any AIG-controlled lending entities.
      whyItMatters: Credit quality is the core downside variable for a scaled BNPL and digital-lending platform and cannot be inferred from revenue or facility announcements alone.
      diligencePath: Request monthly cohort dashboards, underwriting policy changes, and 12-quarter vintage performance by product and jurisdiction.
      relatedQuestionRefs: [QR005]
      relatedTableRefs: [TR002]
    - type: missing-source
      severity: material
      topic: licence-and-approval-pack
      missingEvidence: A dated legal-entity chart, full licence register, open examination log, and current regulatory workplan for the Grab transaction.
      whyItMatters: Approval or licence friction could delay liquidity, restrict operations, or force remediation spending in AIG's highest-risk business lines.
      diligencePath: Obtain external counsel memo plus regulator correspondence for each lending market and the proposed transaction.
      relatedQuestionRefs: [QR001, QR003]
      relatedTableRefs: [TR001, TR003]
    - type: access-blocked
      severity: minor
      topic: independent-benchmark-access
      missingEvidence: Reviewable current independent reporting on regional fintech risk, credit conditions, and competitive benchmarks from major publishers.
      whyItMatters: Better independent context would help calibrate whether AIG's risk posture is better or worse than regional peers instead of relying on company framing.
      diligencePath: Replace blocked or low-fidelity publisher URLs with accessible current articles or analyst notes in a refreshed evidence pack.
      relatedQuestionRefs: [QR008]
