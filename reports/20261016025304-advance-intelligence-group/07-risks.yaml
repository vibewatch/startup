    notes: >-
      This table mixes operational and disclosure-control risks because the
      assigned pool offers stronger evidence on verification quality than on
      incident history.
    claimRefs: [CR001, CR002, CR005, CR008, CR009, CR010, CR011, CR012, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / group
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - [Warehouse and bank funding, Standard Chartered HSBC DBS SMBC BlackRock Evolution X InnoVen AUB and syndicate lenders, Debt and liquidity support for Atome Financial growth, Publicly undisclosed, One or two facilities tighten covenants or stop renewing during a credit-cycle shock, High, Diversified named lender set and local-currency facility expansion, High]
      - [Strategic transaction approvals, Grab and relevant regulators, Exit route and future operating integration, Binary on approval path, Delayed or denied approvals prolong uncertainty and operating separation, High, Maintain standalone brands and licences during transition period, High]
      - [Investor and ecosystem signalling, Warburg Pincus EDBI and tertiary profile channels, External validation hiring visibility and ecosystem access, Moderate but unquantified, Stale or low-fidelity partner pages weaken diligence confidence and recruiting signal, Medium, Direct management data room and verified cap-table support, Medium]
    notes: >-
      Concentration percentages are not publicly disclosed, so the concentration
      column records only what can be inferred from named counterparties.
    claimRefs: [CR004, CR005, CR010, CR013]
