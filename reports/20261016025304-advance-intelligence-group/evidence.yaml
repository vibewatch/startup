evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and any independent-director disclosures for the parent company.
    whyItMatters: Governance quality and founder control cannot be assessed from the assigned public pool alone.
    diligencePath: Request the current board pack, governance memo, and cap-table overview directly from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: group-financials
    missingEvidence: >-
      Audited consolidated FY2025/FY2026 revenue, profitability, balance-sheet, and cash-burn figures for Advance
      Intelligence Group.
    whyItMatters: >-
      Public milestones show subsidiary-level revenue and facility activity, but not enough to underwrite the parent on
      consolidated economics.
    diligencePath: Obtain audited group financial statements or lender/investor reporting packages.
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Current parent-company cap table, preference stack, and any implied mark from the planned Grab-Atome transaction.
    whyItMatters: >-
      A subsidiary transaction headline cannot be translated into whole-group equity value without ownership and
      security terms.
    diligencePath: >-
      Request the current capitalization table, major financing documents, and any fairness or valuation materials tied
      to the planned transaction.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: credit-quality
    missingEvidence: Vintage delinquency, loss, and restructuring data for Atome and Kredit Pintar lending books.
    whyItMatters: >-
      The chapter can identify regulatory context and funding scale, but not whether credit growth is producing durable
      unit economics.
    diligencePath: Request cohort-level credit-performance decks by market, product, and vintage from the lending team.
  - type: missing-source
    severity: material
    topic: independent-market-benchmark
    missingEvidence: >-
      A readable independent 2026 market-size or category-growth source for Southeast Asian BNPL, enterprise identity
      and risk, or merchant-commerce software that can be tied directly to AIG's served segments.
    whyItMatters: >-
      Without an external benchmark, the chapter can only present served-scale lenses and cannot defend a source-clean
      TAM or SAM estimate for valuation.
    diligencePath: >-
      Obtain a usable analyst, public-company, government, or trade-association source that sizes one or more of AIG's
      core segments in Southeast Asia and aligns the denominator with AIG's business lines.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: served-scale
    missingEvidence: >-
      Date-stamped definitions for enterprise clients, merchants, and consumers across Warburg's 2021 financing release
      and the later fintech directory profile.
    whyItMatters: >-
      The scale metrics are directionally useful but not directly comparable enough to combine into one market-size
      narrative without clearer denominators.
    diligencePath: >-
      Request an investor factsheet or audited operating-metrics bridge that reconciles business-line scope and
      measurement dates for the public scale claims.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: credit-quality
    missingEvidence: >-
      Standalone Atome or Kredit Pintar cohort delinquency, loss-rate, and underwriting performance data by market and
      vintage.
    whyItMatters: >-
      Market attractiveness in digital lending and BNPL depends not only on demand but also on whether scale can be
      monetized with controlled credit losses.
    diligencePath: >-
      Request lender cohort performance packs, warehouse-facility reporting, or regulatory filings that disclose
      delinquency and loss trends by product and market.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public or customer-verified pricing, take-rate, APR, or contract-structure disclosures for ADVANCE.AI, Atome, and
      named peers.
    whyItMatters: >-
      Without monetization detail, the chapter can compare reach and scope, but not economic competitiveness or
      price-based switching friction.
    diligencePath: >-
      Request pricing decks, customer contracts, underwriting disclosures, and competitor proposals from management or
      customers.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat-benchmarking
    missingEvidence: >-
      Independent benchmarks on approval quality, fraud losses, conversion lift, retention, or customer win rates versus
      named rivals.
    whyItMatters: >-
      Public breadth claims are not enough to prove a durable moat if specialist competitors outperform on core
      operating metrics.
    diligencePath: >-
      Ask for cohort, loss-rate, fraud-rate, conversion, and retention comparisons by country and product line, plus
      customer references lost or won.
    relatedQuestionRefs:
      - QP008
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: >-
      A segmented competitor list that separates enterprise identity, fraud, consumer lending, wallet substitutes,
      internal build, and likely entrants by market.
    whyItMatters: The current pool supports a partial workflow map, but not an exhaustive share-by-segment landscape.
    diligencePath: >-
      Build a market-by-market landscape from management battlecards, customer RFPs, regulatory licence rosters, and
      lost-deal logs.
    relatedQuestionRefs:
      - QP001
      - QP003
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: group-liquidity
    missingEvidence: >-
      Audited FY2025 and FY2026 consolidated financials with segment revenue mix, gross margin, cash, debt, burn, and
      runway.
    whyItMatters: >-
      Without group-level liquidity and segment economics, Atome's subsidiary profitability claim cannot be translated
      into holding-company underwriting.
    diligencePath: >-
      Request audited management accounts, a cash bridge, debt maturities, and a 12-18 month liquidity forecast with
      segment P&Ls.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: credit-performance
    missingEvidence: >-
      Vintage delinquency, NPL, write-off, recovery, and reserve data for Atome BNPL, cards, Kredit Pintar, and other
      lending books.
    whyItMatters: Credit losses can erase reported revenue growth and determine whether funding facilities scale economically.
    diligencePath: Obtain monthly static-pool, roll-rate, and recovery tables by geography, product, and origination cohort.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Merchant discount rates, consumer fee schedules, enterprise contract pricing, CAC, payback, renewal, and retention
