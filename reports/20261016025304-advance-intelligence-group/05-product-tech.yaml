      - ["Fraud / scoring", "Face recognition, identity checks, company checks, and credit-score inputs for application screening", "Access to reliable data feeds and underwriting rules", "Public evidence does not show precision, recall, or drift monitoring"]
      - ["Credit decisioning", "Translate risk outputs into BNPL, loans, and card limits", "AI-powered underwriting and market-by-market licensing", "Fast BNPL growth raises sensitivity to approval quality and loss control"]
      - ["Merchant / commerce layer", "Distribute financing and merchant services into checkout and selling workflows", "Merchant acceptance plus local payment rails such as QR / A2A systems", "No public integration docs or merchant retention evidence in assigned pool"]
