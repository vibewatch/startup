companyProfile:
  summary: >-
    Advance Intelligence Group is a Singapore-founded, growth-stage fintech platform whose public identity is anchored
    by Atome Financial on the consumer side and ADVANCE.AI on the enterprise side, with Ginee still visible in the
    historical launch trail. The current public record shows a multi-product operating model spanning BNPL, digital
    lending, identity verification, risk products, and merchant services, but consolidated financial disclosure and
    governance detail remain limited.
