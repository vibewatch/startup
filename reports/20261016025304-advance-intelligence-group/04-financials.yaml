          tone: neutral
        - label: Activity and volume base
          detail: "Atome FY2025 GMV was > US$4B and Jun 2026 annualised GMV > US$6B; the September 2021 company release reported Ginee annualised GMV of about US$2B."
          tone: positive
        - label: Revenue conversion
          detail: "Atome disclosed FY2025 revenue of US$470M and total operating income of US$360M, but enterprise and merchant pricing remain undisclosed."
          tone: positive
        - label: Funding layer
          detail: "2026 public signals include a PHP5B AUB facility, a US$345M syndicated debt facility, and independent headlines about fresh capital injection."
          tone: risk
        - label: Underwriting outcome
          detail: "Public evidence supports scale and momentum, but not consolidated cash, runway, take rates, or credit-loss visibility."
          tone: risk
    claimRefs: [CI003, CI004, CI005, CI007, CI009, CI010, CI011, CI014, CI015, CI016]
callouts:
  - calloutType: insight
    title: Growth is visible, mix is not
    body: >-
      Atome Financial now supplies the clearest public revenue and GMV evidence, but the retained sources still do not reconcile how much of consolidated economics comes from consumer finance versus enterprise software versus merchant tools.
    claimRefs: [CI003, CI005, CI007, CI016]
  - calloutType: risk
    title: Facilities prove access to capital and dependence on it
    body: >-
      The 2026 debt facilities, independent capital-injection headlines, and the proposed Grab transaction all point to a business with momentum, but also one whose funding stack remains strategically important to growth and resilience.
    claimRefs: [CI008, CI009, CI010, CI011]
