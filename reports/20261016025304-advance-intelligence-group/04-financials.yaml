artifact: financials
slug: advance-intelligence-group
runDate: 2026-10-16
company:
  name: Advance Intelligence Group
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a diversified revenue model across consumer finance, enterprise risk/KYC, and merchant software, with the clearest current scale disclosure concentrated at Atome Financial. Atome's FY2025 revenue and 2026 annualized run-rate claims indicate strong growth, but missing consolidated cash, credit-loss, pricing, and segment-margin disclosure still leaves underwriting dependent on diligence rather than public proof.
sections:
  - id: business-mix-and-disclosed-scale
    title: Business mix and disclosed scale
    body: >-
      Public evidence identifies three monetization surfaces at the group level: consumer finance through Atome Financial, enterprise verification and risk products through ADVANCE.AI, and merchant software through Ginee. The historical group release is still the clearest source for the breadth of that model, while the freshest disclosed financial data comes from Atome Financial's own 2026 posts rather than a consolidated group filing. That creates an immediate modeling asymmetry: investors can see current consumer-finance growth, but they cannot yet see how much of group revenue or gross profit comes from enterprise software versus merchant tooling versus credit products. Ginee's disclosed GMV and order volume show that the merchant-software arm can ride transaction activity, while Atome's FY2025 and June 2026 metrics show the consumer-finance arm currently contributes the strongest public scale signal.
    claimRefs: [CI002, CI003, CI004, CI005, CI006, CI007, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital-stack-and-regulatory-intensity
    title: Capital stack and regulatory intensity
    body: >-
      Company Overview owns the historical funding chronology; the forward financial question here is whether the consumer-finance arm still needs meaningful external funding to sustain growth. Current disclosures show continued reliance on debt facilities, capital injections, and a proposed strategic transaction. Atome Philippines publicly announced a PHP5 billion wholesale facility with Asia United Bank, the group highlighted an upsized US$345 million syndicated debt facility, and an independent archive reported further capital support for Atome Financial. Those facilities and injections indicate financing access, not cash on hand or runway; likewise, proposed transaction consideration cannot be treated as available parent liquidity before closing and allocation details are known. The activity improves flexibility, but it also underlines working-capital intensity and exposure to lender appetite. At the same time, Indonesia's new BNPL regime makes disclosure, complaints handling, and operational controls financially relevant because sanctions can reach fines and business-stoppage orders.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: verdict-and-diligence-blockers
    title: Verdict and diligence blockers
    body: >-
      The financial picture is directionally positive but still underwriting-incomplete. Atome's disclosed revenue, GMV, profitability-before-tax claim, and continuing access to bank facilities suggest a business that has reached material scale rather than a pre-revenue experiment. The accounting profitability claim does not establish cash generation, and available facilities do not establish current liquidity. Regional payment behavior also supports demand: cash is falling sharply in Indonesia and digital wallets are mainstream in the Philippines, even if cash-on-delivery and in-store cash still matter. The problem is disclosure quality. The retained public sources describe growth, funding, licensing, and market context, but they do not disclose realized pricing, take rates, credit losses, CAC, payback, consolidated cash, or runway with enough specificity to underwrite margin durability or capital adequacy. The practical verdict is that public evidence supports momentum, but not a clean view on revenue quality or downside resilience without management materials.
    claimRefs: [CI005, CI006, CI007, CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and disclosed scale
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Atome consumer finance
        - BNPL, cards, and digital-lending monetization tied to financed transaction volume and credit usage
        - Revenue and GMV
        - "FY2025 revenue US$470M; FY2025 GMV > US$4B; Jun 2026 annualised net revenue US$800M and GMV > US$6B"
        - Strong current scale signal, but disclosed at subsidiary level and mostly management-issued
        - Request take rate, funding cost, loss rate, and contribution margin by market and product
      - - Kredit Pintar / ND Finance lending
        - Consumer-lending monetization inside Atome Financial
        - Loans and lending balances
        - "Kredit Pintar remained on OJK's licensed lender list in Apr 2026; current revenue, book size, and loss data are not disclosed in retained sources"
        - Regulatory legitimacy is visible, economics are not
        - Request loan-book size, yield, NPL, write-off, and reserve data by geography
      - - ADVANCE.AI enterprise risk / KYC
        - API- and workflow-based identity verification, fraud, and risk products for enterprise clients
        - Contracts / usage volume
        - Public sources confirm the business line, but no current revenue or pricing disclosure appears in the retained evidence
        - Revenue stream is real, but public monetization detail is thin
        - Request contract model, average contract value, renewal rates, and gross margin
      - - Ginee merchant software
        - Merchant-services and commerce-enablement software linked to order and marketplace activity
        - GMV and processed orders
        - "The September 2021 company release reported >130M processed orders and annualised GMV of approximately US$2B"
        - Useful volume proxy, but realized subscription, SaaS, or payments economics are not disclosed
        - Request subscription pricing, merchant tiers, attach rates, and churn/retention by cohort
    notes: >-
      This table separates business-line evidence from economics disclosure. Public sources disclose segment existence and some volume metrics, but not a reconciled group revenue mix or segment-level gross margins.
    claimRefs: [CI003, CI004, CI005, CI007, CI012, CI016]
  - id: TI002
    title: Public pricing and monetization disclosure
    columns:
      - Product / stream
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source signal
    rows:
      - - Atome BNPL / cards
        - null
        - Public sources disclose revenue and GMV, not merchant discount rates or consumer fee schedules
        - Unknown by market, merchant category, and funding partner
        - "Atome LinkedIn posts disclose FY2025 and Jun 2026 growth, not pricing mechanics"
      - - Kredit Pintar / digital lending
        - null
        - Public sources disclose licensing and historical scale, not realized yield or fee mix
        - APR, late-fee policy, and net interest margin are not disclosed
        - "Kompas confirms licensing status; retained sources do not disclose unit pricing"
      - - ADVANCE.AI enterprise products
        - null
        - Public evidence confirms the product family, but not contract structure or realized enterprise pricing
        - No current rate card, ACV, or retention data in retained sources
        - "The company-issued release hosted by EDBI confirms product scope, not economics"
      - - Ginee merchant software
        - null
        - Public evidence discloses GMV and orders, not subscription, payments, or take-rate realization
        - Marketplace rebates, partner fees, and merchant pricing ladders are undisclosed
        - "EDBI discloses throughput proxies; retained sources do not disclose realized pricing"
    notes: >-
      Nulls are intentional. The retained current public evidence does not provide underwriting-grade price books, take rates, or realized-yield disclosure for any major stream.
    claimRefs: [CI003, CI004, CI005, CI012, CI016]
  - id: TI003
    title: Public unit-economics and capital-adequacy signals
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - FY2025 Atome revenue
        - "US$470M"
        - Medium
        - Confirms current operating scale at the consumer-finance subsidiary
        - Reconcile to consolidated group revenue and segment mix
      - - FY2025 Atome GMV
        - "> US$4B"
        - Medium
        - Shows volume throughput behind revenue, but not take rate or credit quality
        - Request GMV-to-revenue bridge and loss-adjusted margin
      - - FY2026 run-rate
        - "Annualised net revenue US$800M; annualised GMV > US$6B as of Jun 2026"
        - Medium
        - Indicates rapid growth, but run-rate figures can overstate seasonally uneven books
        - Request monthly revenue, GMV, and delinquency bridge from Jan-Jun 2026
      - - External funding facilities
        - "PHP5B AUB facility; US$345M syndicated debt facility"
        - Medium
        - Confirms access to capital and ongoing dependence on wholesale funding
        - Request weighted-average cost of funds, covenants, maturities, and collateral terms
      - - Strategic monetization event
        - "Grab agreed to buy 60% of Atome Financial for US$1.49B, with the remaining 40% to follow subject to approvals"
        - Medium
        - Could change ownership, liquidity, and future capital strategy for the group's main disclosed earnings engine
        - Request transaction timetable, retained economics, and pro forma impact on group cash flows
      - - Credit performance disclosure
        - null
        - Low
        - Charge-offs, NPLs, and vintage performance determine whether growth converts into durable profit
        - Request monthly roll-rate, loss, recovery, and reserve data by product and geography
      - - CAC / payback / sales efficiency
        - null
        - Low
        - Revenue growth without acquisition economics leaves efficiency and durability unknown
        - Request CAC, payback, channel mix, conversion rates, and renewals by segment
      - - Consolidated liquidity / runway
        - null
        - Low
        - Without cash, burn, and runway, public investors cannot judge capital adequacy or next-round timing
        - Request audited cash bridge, debt schedule, and 12-18 month liquidity forecast
    notes: >-
      This table mixes disclosed scale signals with intentional nulls for private metrics. Null does not mean zero; it means the assigned public evidence did not disclose the metric.
    claimRefs: [CI005, CI007, CI008, CI009, CI010, CI013, CI016]
