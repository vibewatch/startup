      - number: '4.2'
        title: GTM Motion and Unit-Economics Proxies
        blocks:
          - type: paragraph
            body: >-
              The available proxies point to a relatively high-ACV, low-logo-count enterprise model. If GetLatka’s
              26-customer estimate is directionally right, Ontic is monetizing a small number of sizable deployments
              rather than broad seat-based penetration. That implies sales cycles are likely long, implementation work
              meaningful, and customer success central to expansion. Public customer stories reinforce this: Ally cites
              up to eight hours saved per site risk assessment, Visa highlights consolidated research workflows, and the
              broader ROI story is about proving program value to executives rather than about low-cost viral adoption.
              These are positive willingness-to-pay indicators, but they are not substitutes for CAC, payback, gross
              margin, or retention data. The tracker conflict is also important. GetLatka shows 324 employees and $35.6M
              ARR while Growjo estimates 272 employees and $42.4M revenue. That produces a wide public
              revenue-per-employee band and underlines why Ontic’s GTM efficiency cannot be underwritten confidently
