              homepage, clients pages, and case-story archive consistently point to corporate and government security
              teams, Fortune 500 environments, and functionally complex use cases spanning executive protection,
              investigations, risk assessment, and intelligence operations. Named or semi-named stories cover financial
              services, travel technology, insurance, enterprise software, and broader large-enterprise security teams,
              while FedRAMP-related materials indicate active public-sector relevance as well. GetLatka’s estimate of 26
              customers in 2025 fits that picture: this is not a volume-logo motion, but a concentrated, high-touch
              enterprise base. That structure has positive and negative consequences. On the positive side, customers
              appear large enough to justify meaningful implementation effort and cross-functional workflow adoption. On
              the negative side, a relatively small number of logos can create concentration sensitivity if even a
              handful of accounts are disproportionately large, and public evidence does not yet disclose the
