      - number: '2.2'
        title: Market Sizing and Growth Projections
        blocks:
          - type: paragraph
            body: >-
              The risk intelligence solutions market was valued at $58.84 billion in 2025 according to Frost & Sullivan
              research cited in Ontic's 2026 press release, with a projected compound annual growth rate of 19.4%
              reaching $170.14 billion by 2030. This represents the broadest addressable market for Ontic's platform. A
              narrower lens on the cyber threat intelligence segment sizes the market at approximately $13.4-16.8
              billion in 2025, growing to $15.8-19.3 billion in 2026, with long-term CAGRs of 14-18% through 2035
              reaching $53-65 billion. The physical security market overall is approximately $129-131 billion in 2026,
              growing at a more modest 4-5% CAGR. The most relevant serviceable addressable market (SAM) for Ontic lies
              within the corporate security software and intelligence segment, estimated at $3-8 billion globally for
              pure software platforms targeting corporate security operations centers, protective intelligence, and
              investigation workflows in Fortune 1000 enterprises and government agencies.
