            body: >-
              Financially, Ontic looks like a credible but still partially opaque late-growth SaaS company. There is
              clear evidence of institutional investor confidence, customer-level ROI narratives, and enterprise-scale
              contracts, all of which support the idea that real revenue exists and that the product solves expensive
              problems. What is missing is the operating quality layer required for underwriting: audited revenue
              composition, gross margin, renewal behavior, cohort expansion, CAC, payback, burn, and runway. The most
              practical conclusion is that Ontic’s financial profile is investable only if investors can verify that the
              large 2025 raise is accelerating efficient growth rather than compensating for weak economics or prolonged
              federal/enterprise deployment cycles. The conflict between public trackers should be treated as a
              diligence signal, not a rounding issue. Until management opens the data room on retention, services mix,
