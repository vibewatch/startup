  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legacy, Legal, and Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              The highest-salience risk is the lingering shadow of the Banjo controversy and its broader implications
              for privacy, procurement, and trust. Multiple independent sources describe how Banjo’s Utah surveillance
              contract unraveled after scrutiny of the company’s claimed capabilities, surveillance posture, and founder
              history. Even if Ontic’s current operating model is more enterprise-security-oriented and substantially
              cleaner, diligence processes will continue to revisit that legacy because it raises uncomfortable
              questions about data ethics, vendor vetting, public-sector suitability, and reputational resilience.
              Ontic’s 2026 FedRAMP win is an important counterweight, but it also increases the compliance burden.
              FedRAMP Moderate and an ATO are not endpoints; they introduce continuing control, documentation, and
              monitoring obligations. Broader compliance literature from KPMG, Thomson Reuters, Deloitte, Celent, and
              CMMC/FedRAMP commentary reinforces the same conclusion: AI-enabled security vendors face a rising burden
              around privacy, governance, documentation, and regulator expectations. For Ontic, the risk is not simply
              formal noncompliance. It is that any lapse could reactivate legacy skepticism precisely where trust
              matters most—in government and large-enterprise security use cases.
            claimRefs:
