      - number: '1.5'
        title: Key Milestones and Timeline
        blocks:
          - type: paragraph
            body: >-
              Ontic's history includes both the company's own trajectory since 2017 and its complex predecessor
              relationship with Banjo Inc. The original entity Banjo was founded in 2010 by Damien Patton, operating as
              a real-time surveillance AI platform. In 2020, founder Patton's past involvement with white supremacist
              groups in the 1990s was publicly reported, leading to contract cancellations and his resignation as CEO.
              The company rebranded first to safeXai and then to Ontic Technologies in 2021 under new leadership. Major
              milestones since the re-launch include securing a $40M Series B in November 2021, achieving sustained
              product-market fit in the enterprise security vertical, raising the transformational $230M Series C led by
              KKR in August 2025, achieving FedRAMP Moderate Authorization in April 2026, and being named Frost &
              Sullivan Growth and Innovation Leader in Risk Intelligence Solutions for the third consecutive year in
              2026 plus Frost & Sullivan Company of the Year for the fourth time. In 2026, Ontic also introduced Ontic
              Dispatch, extending Connected Intelligence into physical security response and coordination.
