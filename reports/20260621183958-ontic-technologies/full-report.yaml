  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundary
        blocks:
          - type: paragraph
            body: >-
              Ontic Technologies operates squarely at the critical intersection of several key overlapping markets
              today: risk intelligence solutions, corporate physical security software, threat intelligence platforms,
              and protective intelligence tools. The core addressable market is risk intelligence solutions, which Frost
              & Sullivan defines to encompass platforms that operationalize data across physical security,
              cybersecurity, IT, and other internal business functions into unified threat detection and response
              capabilities. This broad market boundary explicitly includes OSINT aggregation, social media monitoring,
              executive protection software, workplace violence prevention systems, investigation and case management
              tools, and critical event management platforms. Excluded from the primary market boundary are pure-play
              cybersecurity products (endpoint protection, SIEM), physical security hardware (cameras, access control),
              manned guarding services, and general-purpose business intelligence platforms. Adjacent markets include
              cyber threat intelligence (narrower digital focus), mass notification systems, and physical
              security-as-a-service offerings that may compete for overlapping budget dollars.
            claimRefs:
              - CM001
              - CM002
              - CM003
