              - CR040
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Banjo Is Still A Live Diligence Problem
            body: >-
              Even after rebranding and governance reset, Ontic will keep inheriting questions about surveillance
              ethics, vendor vetting, and public-sector trust because the Banjo episode remains easy for skeptics to
              revive.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: FedRAMP Is A Moat And A Burden
            body: >-
              FedRAMP Moderate improves credibility, but it also commits Ontic to a continuous control burden that can
              directly affect cost, roadmap speed, and public-sector eligibility.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: callout
            title: The Most Important Risk Is Compounding Complexity
            body: >-
              Ontic is strongest when its integrated product works cleanly across customers, regulators, and data
              systems—and weakest when those same connections create failure chains that reach trust and retention.
            calloutType: insight
            claimRefs:
