  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Buyer Overlap
        blocks:
          - type: paragraph
            body: >-
              The competitive field around Ontic is broader than a simple protective-intelligence niche. Seerist's 2026
              Frost Radar for risk intelligence solutions evaluates Ontic alongside Dataminr, Everbridge, Kroll,
              Flashpoint, Crisis24, ZeroFox, and other vendors, while Gartner and G2 alternative pages show that buyers
              compare Ontic against adjacent tools rather than only direct lookalikes. That matters because enterprise
              security leaders often assemble shortlists based on the job to be done: real-time threat detection,
              incident orchestration, investigations, executive protection, or broad operational resilience. Ontic's
              direct competition is strongest when a CSO or GSOC leader wants a single operating system for protective
              intelligence, investigations, and internal-external data correlation. It competes less effectively when
              the purchase is dominated by mass-notification depth, public-signal speed, or a highly verticalized
              incident-reporting requirement. The category therefore contains direct peers, communications incumbents,
              and workflow substitutes, which keeps pricing opaque and makes demonstrated deployment fit more important
              than category labels alone.
            claimRefs:
              - CP001
              - CP002
              - CP003
