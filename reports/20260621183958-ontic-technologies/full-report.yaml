      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Several macro forces are accelerating demand for risk intelligence platforms in 2026 and beyond. The fatal
              shooting of a UnitedHealth Group executive in late 2024 dramatically elevated corporate board awareness of
              executive security threats, driving increased budget allocation for protective intelligence solutions
              across multiple industry verticals. The convergence of physical and cyber threats is forcing security
              teams to break down organizational silos between CSO and CISO functions, creating demand for unified
              platforms that bridge both domains. AI and automation adoption is enabling resource-constrained security
              teams to do more with less, filtering noise and surfacing actionable intelligence from vast data volumes.
              Regulatory pressure including FedRAMP requirements for government contracts and international standards
              like ISO 27001 create compliance-driven purchasing motives. On the constraint side, enterprise sales
              cycles are long (6-12 months typical), switching costs from incumbent systems are high, data privacy
              regulations (GDPR, CCPA, EU AI Act) create compliance complexity around surveillance and monitoring
              capabilities, and budget competition from cybersecurity tools can crowd out physical security software
              spending.
            claimRefs:
              - CM013
              - CM014
