      - number: '7.2'
        title: Operational and Technology Risk
        blocks:
          - type: paragraph
            body: >-
              Ontic’s product advantage is inseparable from operational complexity. A platform that promises connected
              investigations, integrated research, executive protection, and response coordination depends on data
              quality, integration reliability, permissions discipline, and low-latency workflow execution across many
              moving parts. The March 2026 Dispatch launch raises the stakes further because real-time response failures
              are more visible and more operationally damaging than slower research or documentation workflows. Ontic’s
              own product materials highlight integrated public data, security systems, social inputs, dark-web
              monitoring, and AI-driven workflow acceleration. Those features are commercially attractive, but they also
              multiply failure modes: noisy or stale data, false positives, identity-resolution errors, broken
              integrations, and user workarounds can all degrade trust. Public sources do not provide uptime,
              incident-history, or model-error metrics, which leaves meaningful operational risk unquantified. This is
              not unusual for a private security software company, but it matters because Ontic is increasingly asking
              buyers to run mission-critical processes inside the platform rather than use it only as an intelligence
              adjunct.
