      - number: '3.4'
        title: Moat Durability and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Ontic's moat is real but conditional. The strongest evidence of defensibility is not raw signal breadth or
              public-market scale; it is Ontic's ability to anchor a system of record for protective intelligence and
              security investigations that crosses departmental boundaries. That workflow position can become sticky
              once a customer embeds cases, playbooks, evidence, and internal controls. The company also benefits from a
              trust-and-governance story that matters more in 2026 as buyers weigh AI accountability, privacy, and
              public-sector readiness. However, the moat is vulnerable on several fronts. Dataminr can outgun Ontic on
              event detection scale; Everbridge can bundle broader resilience and communications; AlertMedia can compete
              on simplicity and response workflows; Omnigo can win verticals where tailored incident-reporting matters
              more than connected intelligence; and Resolver/Kroll can appeal to compliance-minded buyers that value
              risk documentation. The practical conclusion is that Ontic has a defendable wedge, but it must keep
              deepening integrations, proof of ROI, and public-sector credibility to prevent the category from
              collapsing into adjacent-suite competition or commoditized OSINT-plus-workflow bundles.
            claimRefs:
