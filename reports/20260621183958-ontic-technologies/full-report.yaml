        title: Funding History and Valuation
        blocks:
          - type: paragraph
            body: >-
              Ontic Technologies has raised approximately $287 million in total funding across four institutional
              rounds. The company completed a $4.65M seed round in January 2019 from Silverton Partners, Floodgate, and
              Village Global. The $14M Series A followed in April 2020 led by Felicis Ventures with participation from
              Silverton Partners and Floodgate. The $40M Series B in November 2021 was led by JMI Equity with
              participation from Felicis Ventures, Silverton Partners, and Ridge Ventures. The landmark $230M Series C
              in August 2025 was led by KKR via its Next Generation Technology III Fund, with participation from JMI
              Equity, Silverton Partners, Ridge Ventures, and Ten Eleven Ventures. The Series C valuation was not
              publicly disclosed, though third-party estimates place it at approximately $1 billion. KKR has invested
              approximately $24 billion in technology-focused growth companies since 2016 and brings a dedicated team of
