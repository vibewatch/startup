  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The current valuation puzzle starts with a fact pattern that is simultaneously bullish and incomplete.
              Official sources confirm a $230M KKR-led Series C in August 2025 and roughly $287M of total funding, but
              the company did not publish the post-money valuation. Third-party revenue trackers offer the only public
              operating anchors, and those anchors are modest relative to the round size: GetLatka reports $35.6M ARR in
              2025 while Growjo estimates roughly $42.4M in revenue. If outside investors are using a valuation near
              $1B—as implied by multiple private-market references and market chatter—then Ontic is either priced on
              hidden quality metrics not visible publicly or on a very aggressive forward view of government expansion,
              workflow depth, and AI-enabled category leadership. That does not make the round irrational; late-stage
              private investors often pay for strategic option value. But it does mean entry discipline matters. Without
              retention, margin, burn, or concentration disclosure, the current public evidence supports a stretched
              valuation stance rather than an obviously attractive one.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV031
              - CV032
              - CV040
          - type: table
            tableRef: TV002
            claimRefs:
              - CV011
              - CV018
              - CV031
              - CV033
              - CV036
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV012
              - CV031
      - number: '8.2'
        title: Comparable Set and Multiple Framework
        blocks:
          - type: paragraph
            body: >-
              The most useful valuation lens is triangulation rather than precision. Public SaaS benchmark sources place
              median 2026 revenue multiples in the low single digits, with the best security, AI, infrastructure, or
              vertical-SaaS names earning materially higher premiums when growth, retention, and Rule-of-40 quality are
              strong. That is encouraging for Ontic because the company sits at the intersection of security, vertical
              workflows, and AI-flavored automation. However, the same benchmark sources repeatedly emphasize that
              premium multiples now require efficient growth, durable retention, and proof that AI is embedded in a
              defensible workflow rather than a marketing wrapper. Ontic’s adjacent-private comparables also cut both
              ways. Everbridge’s $1.8B take-private and AlertMedia’s reported >$1B sale exploration show real strategic
              value in resilience and communications platforms. Dataminr’s capital formation shows investors will
              support scaled signal leaders. Yet those comps are not plug-and-play. They each have different scale,
              maturity, or market structure. The takeaway is that Ontic may deserve a premium to generic public SaaS,
              but public evidence does not yet prove it deserves the kind of premium required to make a ~$1B valuation
              obviously conservative.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
