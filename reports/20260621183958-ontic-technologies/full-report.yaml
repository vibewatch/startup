        title: Cost Structure and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              The capital picture is simultaneously reassuring and incomplete. Official 2025 announcements confirm a
              $230M Series C led by KKR and roughly $287M raised to date, which gives Ontic a meaningful financing
              cushion relative to the public ARR estimate. Even using the more conservative $35.6M ARR figure, the
              implied cumulative funding-to-ARR ratio is about 8.1x, signaling that Ontic remains heavily capitalized
              relative to disclosed recurring revenue. That is not automatically negative for a category-defining
              platform, especially one investing in AI, public-sector readiness, and international expansion, but it
              does raise the bar for future operating leverage. Public data do not reveal cash on hand, monthly burn,
              runway, debt, deferred revenue, or gross margin. Nor do they isolate services, onboarding, or compliance
              costs associated with enterprise and government deployments. The result is that capital adequacy can only
              be judged at a coarse level: Ontic likely has near-term strategic flexibility because of the Series C, but
              investors cannot yet quantify whether that flexibility is being converted into efficient growth or simply
