            body: >-
              Dependency risk sits at three levels. First, Ontic depends on external data sources, enterprise
              integrations, and cloud or platform infrastructure to make its connected-intelligence thesis real. Second,
              it depends on regulators and compliance frameworks—especially FedRAMP—to unlock and preserve public-sector
              credibility. Third, it depends on people: CEO Lukas Quanstrom and the rest of the reconstituted leadership
              team are central to strategy, trust repair, and commercial execution after the Banjo era. The company’s
              careers and jobs pages suggest active ongoing hiring, which is positive for capacity but also a reminder
              that product, engineering, and customer-success talent are competitive bottlenecks. A security platform
              that sells into complex enterprises cannot tolerate weak implementation, thin support, or high turnover in
              go-to-market and product leadership roles. Public evidence also does not disclose top-customer
              concentration or account-level dependency, which means concentration could exist simultaneously on the
              customer and leadership sides. Those are manageable risks, but they become thesis-threatening if growth
