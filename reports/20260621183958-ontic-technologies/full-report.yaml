chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Ontic Technologies is a privately-held enterprise SaaS company headquartered in Austin, Texas, providing
              AI-powered Connected Intelligence software for corporate and government security teams. The platform
              unifies security operations and data into a centralized system of record, enabling organizations to
              conduct risk assessments, protect against workplace violence, manage threats and incidents, and coordinate
              investigations efficiently. Ontic aggregates open-source intelligence (OSINT) and external threat signals
              alongside internal data from systems like HR, legal, IT, and facilities. The company's revenue model is
              SaaS subscription-based, serving Fortune 500 companies and federal agencies. Ontic was officially founded
              in 2017, though the company's history traces back to Banjo Inc., a real-time intelligence platform founded
              by Damien Patton in 2010 that was later rebranded to safeXai and then Ontic Technologies following a
              leadership scandal in 2020-2021.
