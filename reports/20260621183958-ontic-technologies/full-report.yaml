  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Public Traction
        blocks:
          - type: paragraph
            body: >-
              Ontic’s public materials support an enterprise SaaS revenue model built around connected-intelligence
              software sold to corporate and government security teams. The company markets a unified platform, promotes
              ROI and time-savings through customer stories, and does not publish self-serve pricing, all of which are
              consistent with a high-touch enterprise contract motion. The best available public traction figure is
              GetLatka’s estimate of $35.6M 2025 ARR, 26 customers, 324 employees, and roughly $1.4M average contract
              value. That is directionally consistent with a concentrated enterprise-customer base rather than
              high-volume SMB sales. However, the public record is messy: Growjo estimates materially different revenue,
              funding, and headcount, and the company itself still does not publish audited income statement or balance
              sheet detail. That forces investors to treat revenue, ARR, and customer economics as proxies rather than
              settled facts. The encouraging signal is that customer stories repeatedly frame Ontic as a workflow
              platform with measurable value; the caution is that revenue quality remains inferred rather than
              disclosed.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
