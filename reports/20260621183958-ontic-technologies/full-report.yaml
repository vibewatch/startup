              - CV035
              - CV036
              - CV037
              - CV038
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV003
              - CV006
              - CV012
              - CV013
              - CV031
              - CV040
      - number: '8.4'
        title: Recommendation, Thesis Breaks, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The investment recommendation at the current valuation is best framed as research-more with a stretched
              valuation stance and medium confidence. Ontic has enough positive evidence—credible institutional backing,
              a differentiated workflow thesis, named enterprise proof, FedRAMP progress, and adjacency to strategically
              valuable security-software categories—to justify continued interest. But there is not enough public
              evidence to justify price confidence. The company needs to prove that revenue quality, retention,
              concentration, and public-sector conversion are materially better than what the public record suggests.
              The anti-thesis is straightforward: if Ontic is really a ~$35M-$40M ARR company with heavy capital
              intensity and incomplete durability proof, then a unicorn-like mark bakes in too much future success too
              early. The thesis only improves if management can show high-quality ARR, strong net retention, expanding
              module depth, and a plausible path to scale that narrows the current multiple gap. Until then, valuation
              is an optimism tax rather than an edge.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV039
              - CV040
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public Fundamentals Do Not Cleanly Support A Unicorn Mark
            body: >-
              On public ARR proxies alone, even premium SaaS multiples do not obviously justify a ~$1B valuation. The
              round only looks comfortable if hidden ARR, retention, or government option value are materially better
              than public evidence suggests.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV013
              - CV021
          - type: callout
            title: Ontic Has Category Attributes That Can Support A Premium
            body: >-
              Security-critical workflows, FedRAMP progress, named enterprise proof, and a connected-intelligence
              product thesis all argue that Ontic should trade above generic public SaaS medians if quality metrics are
              strong.
            calloutType: strength
            claimRefs:
              - CV015
              - CV018
              - CV019
              - CV020
          - type: callout
            title: The Key Question Is Hidden Quality, Not Surface Narrative
            body: >-
              If Ontic can prove high-quality ARR, strong retention, and expanding modules in large accounts, the
              current price may be defendable. If not, today’s valuation mainly reflects optimism rather than evidence.
            calloutType: insight
            claimRefs:
              - CV024
              - CV029
              - CV033
              - CV040
