      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The primary buyer persona for Ontic's platform is the Chief Security Officer (CSO) or VP of Corporate
              Security at Fortune 500 enterprises, who owns the physical security and protective intelligence budget.
              Secondary buyers include Directors of Global Security Operations Centers (GSOCs), heads of executive
              protection programs, and chief risk officers in industries with elevated physical threat profiles. In the
              public sector, buyers are agency security directors and protective intelligence program leads. The end
              users are security analysts, investigators, and GSOC operators who interact with the platform daily. The
              payer is typically the corporate security budget holder, though IT procurement may control vendor
              approvals and technical compliance. Budget ownership sits under the CSO function in most enterprises,
              separate from the CISO's cybersecurity budget. Adoption triggers include high-profile threat incidents,
              executive protection needs, regulatory mandates, workplace violence prevention requirements, and the
              desire to consolidate multiple point solutions into a single platform.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
