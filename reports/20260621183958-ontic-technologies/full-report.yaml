  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Ontic’s product story is coherent: the company sells an AI-powered connected-intelligence platform for
              corporate and government security teams, not a collection of isolated point tools. Official pages describe
              a unified environment where incidents, investigations, integrated research, executive protection, and
              response workflows share data and context. That module structure matters strategically because the
              customer problem is fragmented by default—external signals live in one tool, case documentation in
              another, and guard response somewhere else entirely. Ontic’s product thesis is that value comes from
              connecting those surfaces into a defensible system of record. The March 2026 Dispatch launch strengthens
              that thesis by pulling physical response into the same operating model as intelligence and investigations.
              The case-management and integrated-research pages reinforce the same architecture pattern: connect
              signals, centralize case work, automate triage, and preserve evidence. Product breadth is therefore no
              longer just intelligence plus documentation; it now extends into real-time operational coordination as
              well.
