        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Ontic is led by CEO and Co-Founder Lukas Quanstrom, who guides the company's strategic direction and AI
              investment agenda. The executive team includes Brian Mazza as Chief Revenue Officer, Nitin Navare as Chief
              Technology and Product Officer, Kyle Giunta as Chief Operating Officer, Ryan Suneson as Chief Financial
              Officer, Scott Shepherd as Chief Legal Officer, Manish Mehta as Chief Solutions and Innovation Officer,
              Amy Sullivan as EVP of Alliances, and Murph Holder as VP of People. The board of directors includes Lukas
              Quanstrom, Mike Dodd (Silverton Partners), Jake Heller (KKR), Bob Nye (JMI Equity), and Murali
              Swaminathan. The company also maintains an advisory board of recognized security industry thought leaders
              including Fred Burton, Dave Komendat, Rich Davis, Thomas Kopecky, and Gagan Jain who help guide Ontic's
              product strategy and provide guidance on protective intelligence, enterprise software, and corporate
              security trends. Notably, the leadership team has been entirely reconstituted since the predecessor
              company's controversy, with no executives from the original Banjo leadership remaining in senior
