    - Medium-High
    - AI governance claims can commoditize quickly if every vendor markets responsible AI
    - Request concrete procurement win/loss data tied to FedRAMP and privacy controls
  - - Cross-functional workflow breadth differentiates Ontic from alerting tools
    - Suite vendors bundle adjacent modules at lower incremental price
    - High
