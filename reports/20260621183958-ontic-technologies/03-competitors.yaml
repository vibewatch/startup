- id: pricing-switching-and-distribution
  title: Pricing, Switching Costs, and Distribution Power
  body: 'The pricing environment is structurally difficult for Ontic because the relevant vendors mostly sell through enterprise demo-led motions with negotiated contracts rather than transparent list prices. Everbridge and AlertMedia explicitly describe custom pricing, while Ontic, Dataminr, Resolver, and Omnigo similarly route buyers into sales-led evaluation paths. That makes feature fit, trust, deployment speed, and executive sponsorship central to deal conversion. Switching costs are moderate to high after deployment because these systems connect to HR, travel, communications, incident, and case-management workflows, but multi-homing remains possible: a buyer can retain Dataminr for external signal discovery while adopting Ontic for investigations, or keep Everbridge for mass notification while adding Ontic for protective intelligence. This mixed-stack reality is strategically important. Ontic does not need to displace every incumbent to win, but it also cannot assume a winner-take-all
    position. Distribution scale favors larger brands such as Everbridge and Dataminr, while public-sector trust posture and cross-functional workflow depth are areas where Ontic can punch above its size.'
  claimRefs:
  - CP018
  - CP019
  - CP020
  - CP021
