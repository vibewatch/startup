  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized pricing, discounting, and module packaging by vendor and customer segment.
    whyItMatters: Negotiated enterprise contracts can change competitive win rates and payback assumptions materially.
    diligencePath: Request recent customer proposals, redlined order forms, and competitive bake-off pricing notes.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: Win-loss, replacement, and share-shift data against Dataminr, Everbridge, AlertMedia, Resolver, and Omnigo.
    whyItMatters: Without real competitive displacement data, moat claims stay directional instead of underwritten.
    diligencePath: Obtain CRM-level win-loss analysis by competitor and segment for the last 12-18 months.
    relatedQuestionRefs:
    - QP024
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Module expansion, renewal, and retention metrics by customer cohort and competitive context.
    whyItMatters: System-of-record stickiness is only durable if customers renew and expand after initial deployment.
    diligencePath: Request cohort retention, expansion ARR, renewal narratives, and top 20 account history.
    relatedQuestionRefs:
    - QP025
