callouts:
  - calloutType: "strength"
    title: "Massive TAM with Strong Growth Trajectory"
    body: "The risk intelligence market's projected 19.4% CAGR to $170.14B by 2030 provides a large and expanding addressable opportunity for Ontic, with the current $35.6M ARR representing less than 0.1% penetration even of the narrower SAM."
    claimRefs: [CM004, CM008]
  - calloutType: "risk"
    title: "Market Sizing Uncertainty"
    body: "Published market estimates vary by 4x or more depending on boundary definitions. The Frost & Sullivan $58.84B figure cited by Ontic may include spend categories where Ontic doesn't directly compete, potentially overstating the practical addressable opportunity."
    claimRefs: [CM004, CM005, CM006]
  - calloutType: "insight"
    title: "UnitedHealth Executive Shooting as Demand Catalyst"
    body: "The high-profile shooting of a Fortune 50 executive in late 2024 served as a watershed moment for corporate security budgets, accelerating investment in protective intelligence platforms and executive protection programs across Fortune 500 companies."
    claimRefs: [CM013, CM014]
