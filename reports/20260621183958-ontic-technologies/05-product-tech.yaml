- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow pain
  - Ontic solution
  - Measurable benefit
  - Limitation
  rows:
  - - Investigate a threat report
    - Signals and evidence scattered across tools
    - Unified incidents, case management, and research
    - Faster triage and better evidence continuity
    - Public proof on throughput is limited
  - - Monitor a principal / executive
    - Noisy online and physical signals are disconnected
    - Executive protection workflow connects disparate signals
    - Earlier pattern recognition before escalation
    - False-positive and alert-fatigue rates are not public
  - - Run a site risk assessment
    - Manual collection and reporting effort
    - Structured workflow and reusable assessments
    - Ally cites up to 8 hours saved per assessment
    - Single case study is not a population-level metric
  - - Respond to a physical incident
    - Dispatch lives outside investigation record
    - Dispatch links response into incidents and investigations
    - Time-stamped response documentation and SLA visibility
    - New module still needs production-scale proof
  - - Share insights across functions
    - Security, HR, legal, and operations use separate systems
    - Connected intelligence and integrations unify context
    - Better coordination and a defensible record
    - Integration setup burden is not publicly quantified
  notes: Benefits use public case-study and product-messaging signals; they should be treated as directional rather than benchmarked outcomes.
