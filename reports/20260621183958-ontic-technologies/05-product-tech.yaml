- id: trust-compliance-and-operational-maturity
  title: Trust, Compliance, and Operational Maturity
  body: Trust and compliance are becoming central parts of Ontic’s moat rather than back-office hygiene. The April 2026 FedRAMP Moderate authorization and associated ATO materially strengthen Ontic’s readiness for public-sector deployments and create a harder-to-replicate posture versus less regulated competitors. FedRAMP and the government-focused PR describe the platform as purpose-built for centralized threat management, integrated intelligence, AI-driven workflows, and mission-critical operations. The Dispatch launch adds another dimension of maturity because it implies the product can handle real-time response documentation, SLA visibility, and defensible records during active incidents, not just post-incident case management. These are strong signals for enterprise and federal buyers that care about auditability, chain of action, and defensible operating procedures. Still, the trust story has limits in public evidence. We do not see public SLA data, public model-governance disclosures,
    or transparent evidence about false-positive management. In other words, Ontic has crossed an important compliance threshold, but not all technology-risk questions are answered by authorization alone.
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  tableRefs:
  - TE004
  - TE005
  figureRefs:
  - FE004
- id: roadmap-risk-and-technical-verdict
  title: Roadmap Risk and Technical Verdict
  body: 'The product roadmap looks strategically sensible: deepen the system-of-record thesis, add real-time response, and use AI to reduce analyst workload. The risk is that each of those moves also increases architectural burden. A platform that promises integrations, OSINT, investigations, dispatch, government-grade security, and AI workflow automation must maintain data quality, permissions, audit trails, latency, and explainability across many surfaces simultaneously. That complexity does not make the strategy wrong; in fact, it is part of what makes the product differentiated. But it does mean the company’s technical moat is execution-dependent rather than self-proving. Careers and jobs pages show the company is still building, which is encouraging for roadmap capacity but also implies continuing platform investment. The right technical verdict is positive with diligence conditions: Ontic appears to have a real platform and meaningful compliance progress, yet buyers and investors still
    need direct proof on reliability, model governance, infrastructure scale, and the operating burden of maintaining a deeply integrated security system.'
  claimRefs:
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
