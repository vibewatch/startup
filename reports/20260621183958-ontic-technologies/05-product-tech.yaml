- id: architecture-integrations-and-ai
  title: Architecture, Integrations, and AI Workflow
  body: 'Public technical detail is high level, but the architecture signals that do exist are directionally strong. Ontic repeatedly frames the product as a centralized system that unifies disparate data sources, security systems, public data, and workflow records. The integrations page explicitly positions interoperability as a core product principle rather than an optional ecosystem feature. The incidents and investigations page says that case management connects to risk intelligence and integrated research, while the integrated-research page highlights OSINT-driven identity, watchlist, and international research checks. FedRAMP-related materials further state that the platform supports AI-driven workflows including summarization, entity resolution, and workflow automation. Taken together, that points to a cloud platform organized around an entity database, connected workflows, and external data ingestion rather than around a single analytics model. The main technical caveat is opacity:
    Ontic does not publish detailed infrastructure diagrams, model architecture, uptime metrics, or data-retention specifics publicly, so the real complexity cost of its integration-heavy design still requires direct technical diligence.'
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
