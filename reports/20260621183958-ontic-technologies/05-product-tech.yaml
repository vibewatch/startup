  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: SLA, uptime, latency, disaster-recovery, and scale metrics for the production platform.
    whyItMatters: Mission-critical security software needs reliability evidence beyond product marketing and authorization labels.
    diligencePath: Request architecture review, uptime history, incident postmortems, and customer SLA commitments.
    relatedQuestionRefs:
    - QE012
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: ai-governance
    missingEvidence: Model lineage, evaluation, override controls, and false-positive / false-negative monitoring.
    whyItMatters: AI workflow quality directly affects trust and defensibility in security operations.
    diligencePath: Request AI governance policy, model cards, human-in-the-loop controls, and error-tracking dashboards.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: integration-burden
    missingEvidence: Implementation timelines, connector maintenance burden, and customer-side integration effort.
    whyItMatters: The more integration-dependent the platform, the more execution risk sits in deployment and support rather than just feature breadth.
    diligencePath: Request implementation plans, connector inventory, and customer deployment benchmarks.
    relatedQuestionRefs:
    - QE019
    - QE024
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: minor
    topic: dispatch-adoption
    missingEvidence: Production adoption, mobile workflow performance, and SLA attainment for Dispatch after launch.
    whyItMatters: Dispatch is strategically important but new, so adoption quality matters more than launch messaging.
    diligencePath: Request post-launch adoption metrics, reference customers, and response-time benchmarks.
    relatedQuestionRefs:
    - QE007
    - QE008
    relatedTableRefs:
    - TE001
