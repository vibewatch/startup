- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Entity / system-of-record layer
    - Centralizes people, incidents, cases, and relationships
    - Data model quality and permissions
    - Bad identity resolution or permissions could contaminate investigations
  - - Integrated research / OSINT ingestion
    - Pulls public and watchlist signals into workflows
    - External data sources and licensing
    - Source outages or licensing shifts can reduce coverage
  - - Integrations layer
    - Connects security, HR, identity, and operational systems
    - API access and partner ecosystem maintenance
    - Integration breakage can erode product value quickly
  - - AI workflow layer
    - Summarization, entity resolution, automation
    - Model governance and human oversight
    - Opaque model behavior can create compliance and trust issues
  - - Dispatch / response layer
    - Coordinates real-time response and documentation
    - Latency, mobile reliability, and staffing adoption
    - Real-time failures are more operationally visible than case-work delays
  - - Compliance / control layer
    - Supports FedRAMP and defensible operations
    - Continuous monitoring and control maintenance
    - Authorization drift can jeopardize public-sector use
  notes: The architecture is reconstructed from public materials; Ontic does not publish a detailed system diagram or control-plane specification publicly.
