evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Official Series C pre-money or post-money valuation figure
    whyItMatters: Valuation determines investor return expectations and provides a benchmark for exit analysis
    diligencePath: Request valuation disclosure from KKR IR or Ontic management via NDA-protected data room
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: debt and credit
    missingEvidence: Information on any debt facilities, venture debt, or credit lines
    whyItMatters: Debt changes capital structure calculations and impacts liquidation preferences
    diligencePath: Request cap table and debt schedule from company management
    relatedQuestionRefs:
      - QO020
  - type: missing-source
    severity: minor
    topic: secondary transactions
    missingEvidence: Data on any secondary share sales or employee liquidity events
    whyItMatters: Secondaries provide signal on insider valuation confidence
    diligencePath: Check secondary market platforms (Forge, EquityZen) or ask management directly
    relatedQuestionRefs:
      - QO021
  - type: missing-source
    severity: material
    topic: legal and regulatory
    missingEvidence: Court records or regulatory filings indicating pending litigation or enforcement actions
    whyItMatters: Pending legal issues could materially affect valuation and operations
    diligencePath: Search PACER, state court records, and regulatory databases for Ontic Technologies or predecessor Banjo Inc.
    relatedQuestionRefs:
      - QO022
  - type: enumeration-incomplete
    severity: minor
    topic: milestone timeline completeness
    missingEvidence: >-
      Additional milestones between 2019-2025 including product launches, partnership announcements, and customer wins
      not captured in public sources
    whyItMatters: >-
      A complete milestone timeline would better contextualize the company's growth trajectory and product evolution for
      diligence purposes
    diligencePath: Request internal company timeline from management or investor materials deck covering key milestones year by year
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: investment terms
    missingEvidence: KKR Series C liquidation preferences, anti-dilution provisions, and board control rights
    whyItMatters: Preferential terms may disadvantage earlier investors and employees in a downside scenario
    diligencePath: Request term sheet or certificate of incorporation amendments from company counsel
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: market penetration
    missingEvidence: Quantified penetration rate of modern risk intelligence platforms among Fortune 500 companies
    whyItMatters: Understanding current penetration directly impacts Ontic's growth potential estimation
    diligencePath: Commission primary research survey of Fortune 500 CSOs on platform adoption status
    relatedQuestionRefs:
      - QM013
  - type: conflicting-data
    severity: material
    topic: market sizing methodology
    missingEvidence: >-
      Reconciliation of the 4x difference between Frost & Sullivan TAM ($58.84B) and threat intelligence estimates
      ($13.4-16.8B)
    whyItMatters: Affects investor thesis on market size and Ontic's potential scale
    diligencePath: Obtain full Frost & Sullivan methodology and compare category definitions against narrower threat intel reports
    relatedQuestionRefs:
      - QM020
      - QM022
  - type: missing-source
    severity: minor
    topic: federal spending
    missingEvidence: Specific federal security software spending projections for 2026-2028 broken out from broader IT budgets
    whyItMatters: FedRAMP authorization opens a new market segment whose size drives growth forecasts
    diligencePath: Review USASpending.gov and OMB budget submissions for relevant NAICS codes
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized pricing, discounting, and module packaging by vendor and customer segment.
    whyItMatters: Negotiated enterprise contracts can change competitive win rates and payback assumptions materially.
    diligencePath: Request recent customer proposals, redlined order forms, and competitive bake-off pricing notes.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
