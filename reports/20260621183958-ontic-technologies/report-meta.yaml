  summary: "Ontic Technologies is an Austin-based enterprise SaaS company providing AI-powered Connected Intelligence software that helps corporate and government security teams identify threats, assess risk, and respond faster. The platform unifies security operations data into a centralized system of record, aggregating open-source intelligence and external threat signals alongside internal organizational data. Founded in 2017 and backed by $287M in total funding including a $230M Series C led by KKR in August 2025, Ontic serves Fortune 500 companies and federal agencies with programs spanning executive protection, threat intelligence, investigations, and workplace violence prevention."
