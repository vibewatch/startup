- id: comparable-framework
  title: Comparable Set and Multiple Framework
  body: The most useful valuation lens is triangulation rather than precision. Public SaaS benchmark sources place median 2026 revenue multiples in the low single digits, with the best security, AI, infrastructure, or vertical-SaaS names earning materially higher premiums when growth, retention, and Rule-of-40 quality are strong. That is encouraging for Ontic because the company sits at the intersection of security, vertical workflows, and AI-flavored automation. However, the same benchmark sources repeatedly emphasize that premium multiples now require efficient growth, durable retention, and proof that AI is embedded in a defensible workflow rather than a marketing wrapper. Ontic’s adjacent-private comparables also cut both ways. Everbridge’s $1.8B take-private and AlertMedia’s reported >$1B sale exploration show real strategic value in resilience and communications platforms. Dataminr’s capital formation shows investors will support scaled signal leaders. Yet those comps are not plug-and-play.
    They each have different scale, maturity, or market structure. The takeaway is that Ontic may deserve a premium to generic public SaaS, but public evidence does not yet prove it deserves the kind of premium required to make a ~$1B valuation obviously conservative.
