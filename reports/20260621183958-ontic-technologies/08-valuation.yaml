- id: recommendation-and-diligence-asks
  title: Recommendation, Thesis Breaks, and Final Diligence Asks
  body: 'The investment recommendation at the current valuation is best framed as research-more with a stretched valuation stance and medium confidence. Ontic has enough positive evidence—credible institutional backing, a differentiated workflow thesis, named enterprise proof, FedRAMP progress, and adjacency to strategically valuable security-software categories—to justify continued interest. But there is not enough public evidence to justify price confidence. The company needs to prove that revenue quality, retention, concentration, and public-sector conversion are materially better than what the public record suggests. The anti-thesis is straightforward: if Ontic is really a ~$35M-$40M ARR company with heavy capital intensity and incomplete durability proof, then a unicorn-like mark bakes in too much future success too early. The thesis only improves if management can show high-quality ARR, strong net retention, expanding module depth, and a plausible path to scale that narrows the current
    multiple gap. Until then, valuation is an optimism tax rather than an edge.'
