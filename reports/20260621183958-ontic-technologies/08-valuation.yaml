- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - True ARR materially above public trackers; strong NRR; government and enterprise expansion accelerate
    - ~$80M-$100M ARR at ~10x-12x supports ~$800M-$1.2B
    - Execution, concentration, and compliance still matter
    - Needs private data proving premium quality
  - - Base
    - Public ARR range roughly right but quality is solid and premium justified
    - ~$40M-$45M ARR at ~6x-8x supports ~$240M-$360M
    - Current round likely priced ahead of public fundamentals
    - Most plausible on current public evidence
  - - Bear
    - Public ARR range right and durability weaker than hoped
    - ~$35M-$40M ARR at ~4x-5x supports ~$140M-$200M
    - Retention, concentration, or margin disappoint
    - Downside if premium narrative breaks
  - - Stretch-to-round
    - Current implied valuation near ~$1B requires hidden metrics or unusually strong forward underwriting
    - Either ARR is far above public proxies or investors are paying for future option value
    - Multiple compression if hidden quality does not materialize
    - Possible, but not proven publicly
  notes: Scenario values are analytical estimates that combine public ARR proxies with benchmark multiple ranges from current SaaS-market sources.
