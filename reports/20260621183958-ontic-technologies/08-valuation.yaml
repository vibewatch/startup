- id: TV002
  title: Thesis / Anti-thesis Table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Ontic owns a differentiated connected-intelligence workflow in a strategically important category
    - Proof of weak retention or heavy services mix would weaken the thesis materially
  - - FedRAMP and public-sector readiness create optionality beyond enterprise accounts
    - Failure to convert public-sector readiness into real customers would reduce premium justification
  - - Named enterprise customer proof shows the product solves costly problems
    - Evidence that case-story customers do not expand or renew would weaken conviction
  - - Institutional sponsorship by KKR suggests serious upside ambition
    - A round-sized capital base without efficient growth would imply overfunding, not validation
  - - Security / AI / vertical-workflow categories can command premium multiples
    - If Ontic’s AI is mostly marketing wrapper rather than defensible workflow, the premium should compress
  notes: The anti-thesis focuses on the few facts that could most directly collapse the valuation bridge rather than on generic software risk.
