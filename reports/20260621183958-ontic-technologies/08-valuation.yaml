- id: scenario-analysis
  title: Bull, Base, and Bear Scenarios
  body: 'The scenario math is blunt. On public ARR proxies alone, even generous premium multiples struggle to support a unicorn valuation. Using the low end of the visible revenue range, a 4x-5x multiple produces a bear valuation around $140M-$210M. A base case that grants Ontic the benefit of better quality and a security premium—say 6x-8x on roughly $40M of ARR—still lands around $240M-$340M. The bull case only becomes compelling if one of two things is true: either public revenue trackers materially understate the company’s true recurring revenue, or Ontic can sustain premium growth and retention such that investors underwrite much higher forward ARR than outsiders can see today. In practical terms, a $1B+ private mark looks supportable only if hidden ARR is closer to $80M-$100M, or if investors believe Ontic can grow into that scale quickly with strong retention and government expansion. That gap between visible fundamentals and required upside is why the valuation stance should be stretched
    rather than fair on public evidence alone.'
  claimRefs:
