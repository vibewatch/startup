chapter:
  number: 8
  title: Valuation
  summary: Valuation is the hardest part of the Ontic story. Public ARR proxies of $35.6M-$42.4M do not obviously support a ~$1B implied private valuation against 2026 public SaaS medians, even after allowing for security and AI premiums. The round only looks clearly justified if private metrics are materially better than public proxies or if investors are underwriting unusually strong future expansion, retention, and public-sector option value.
sections:
- id: current-valuation-context
  title: Current Financing Context and Entry Discipline
  body: 'The current valuation puzzle starts with a fact pattern that is simultaneously bullish and incomplete. Official sources confirm a $230M KKR-led Series C in August 2025 and roughly $287M of total funding, but the company did not publish the post-money valuation. Third-party revenue trackers offer the only public operating anchors, and those anchors are modest relative to the round size: GetLatka reports $35.6M ARR in 2025 while Growjo estimates roughly $42.4M in revenue. If outside investors are using a valuation near $1B—as implied by multiple private-market references and market chatter—then Ontic is either priced on hidden quality metrics not visible publicly or on a very aggressive forward view of government expansion, workflow depth, and AI-enabled category leadership. That does not make the round irrational; late-stage private investors often pay for strategic option value. But it does mean entry discipline matters. Without retention, margin, burn, or concentration disclosure,
    the current public evidence supports a stretched valuation stance rather than an obviously attractive one.'
