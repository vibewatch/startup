- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR quality disappoints
    - Private ARR is close to public proxy and retention is weak
    - Current premium collapses into stretched-to-untenable territory
    - Re-rate valuation to base or bear case
  - - Customer concentration is high
    - Top accounts dominate ARR without durable renewals
    - Downside becomes account-loss driven
    - Increase discount rate and downside weighting
  - - FedRAMP / public-sector conversion stalls
    - No meaningful federal wins or referenceability
    - Public-sector option value should be removed from bull case
    - Cut premium scenario weighting
  - - Margin / services mix is weaker than expected
    - Implementation or services drag lowers software economics
    - Rule-of-40 style premium cannot be justified
    - Value on lower public multiple bands
  - - Leadership or trust stumble emerges
    - Brand or governance issues reignite skepticism
    - Valuation premium for mission-critical trust erodes quickly
    - Pause investment case pending remediation
  notes: The kill triggers focus on valuation-transmitting facts, not every operating issue covered elsewhere in the report.
  claimRefs:
