  - CV035
  - CV036
  - CV037
  - CV038
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - ARR and revenue bridge
    - Board-approved ARR, GAAP revenue, and deferred-revenue bridge
    - Primary input to every valuation scenario
    - CFO / finance data room
  - - NRR / GRR / churn
    - Cohort retention and expansion by segment
    - Determines whether Ontic deserves premium multiple support
    - Revenue operations
  - - Customer concentration
    - Top-10 ARR share and contract end dates
    - Needed to assess downside concentration and renewal risk
    - Finance + sales ops
  - - Gross margin and services mix
    - Software GM, services drag, implementation cost
    - Separates premium SaaS economics from labor-heavy delivery
    - FP&A / operations
  - - Public-sector conversion
    - Live federal customers, pipeline, and deployment metrics
    - Validates whether FedRAMP creates real option value
    - Government sales leadership
  - - Round terms and preference stack
    - Series C structure, liquidation preferences, dilution overhang
    - Needed to assess real return to new money at current price
    - Company counsel / financing docs
  notes: These are the minimum valuation blockers; without them, price confidence remains materially lower than product or customer confidence.
