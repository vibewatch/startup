chapter:
  number: 1
  title: "Company Overview"
  summary: "Ontic Technologies is an Austin-based AI-powered connected security intelligence platform provider that raised $230M in Series C funding led by KKR in August 2025, building on approximately $287M in total funding across four rounds since its 2017 founding."
sections:
  - id: "identity-and-business"
    title: "Identity and Business Model"
    body: "Ontic Technologies is a privately-held enterprise SaaS company headquartered in Austin, Texas, providing AI-powered Connected Intelligence software for corporate and government security teams. The platform unifies security operations and data into a centralized system of record, enabling organizations to conduct risk assessments, protect against workplace violence, manage threats and incidents, and coordinate investigations efficiently. Ontic aggregates open-source intelligence (OSINT) and external threat signals alongside internal data from systems like HR, legal, IT, and facilities. The company's revenue model is SaaS subscription-based, serving Fortune 500 companies and federal agencies. Ontic was officially founded in 2017, though the company's history traces back to Banjo Inc., a real-time intelligence platform founded by Damien Patton in 2010 that was later rebranded to safeXai and then Ontic Technologies following a leadership scandal in 2020-2021."
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
    figureRefs: [FO003]
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: "Ontic is led by CEO and Co-Founder Lukas Quanstrom, who guides the company's strategic direction and AI investment agenda. The executive team includes Brian Mazza as Chief Revenue Officer, Nitin Navare as Chief Technology and Product Officer, Kyle Giunta as Chief Operating Officer, Ryan Suneson as Chief Financial Officer, Scott Shepherd as Chief Legal Officer, Manish Mehta as Chief Solutions and Innovation Officer, Amy Sullivan as EVP of Alliances, and Murph Holder as VP of People. The board of directors includes Lukas Quanstrom, Mike Dodd (Silverton Partners), Jake Heller (KKR), Bob Nye (JMI Equity), and Murali Swaminathan. The company also maintains an advisory board of recognized security industry thought leaders including Fred Burton, Dave Komendat, Rich Davis, Thomas Kopecky, and Gagan Jain who help guide Ontic's product strategy and provide guidance on protective intelligence, enterprise software, and corporate security trends. Notably, the leadership team has been entirely reconstituted since the predecessor company's controversy, with no executives from the original Banjo leadership remaining in senior positions. This governance reset was a precondition for the institutional investor support that followed."
    claimRefs: [CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO002]
  - id: "funding-and-valuation"
    title: "Funding History and Valuation"
    body: "Ontic Technologies has raised approximately $287 million in total funding across four institutional rounds. The company completed a $4.65M seed round in January 2019 from Silverton Partners, Floodgate, and Village Global. The $14M Series A followed in April 2020 led by Felicis Ventures with participation from Silverton Partners and Floodgate. The $40M Series B in November 2021 was led by JMI Equity with participation from Felicis Ventures, Silverton Partners, and Ridge Ventures. The landmark $230M Series C in August 2025 was led by KKR via its Next Generation Technology III Fund, with participation from JMI Equity, Silverton Partners, Ridge Ventures, and Ten Eleven Ventures. The Series C valuation was not publicly disclosed, though third-party estimates place it at approximately $1 billion. KKR has invested approximately $24 billion in technology-focused growth companies since 2016 and brings a dedicated team of 28 technology growth equity investment professionals."
    claimRefs: [CO012, CO013, CO014, CO015, CO016, CO017, CO018]
    tableRefs: [TO003]
  - id: "scale-metrics"
    title: "Scale and Key Performance Indicators"
    body: "As of late 2025, Ontic reported annual recurring revenue of $35.6M according to third-party tracking sources, with headcount in the range of 309-324 employees. The company services Fortune 50 companies across technology, financial services, and consumer goods verticals. Ontic clients collectively generate nearly $30 billion in revenue and employ over 14 million people. The company reports measurable client outcomes including reducing staffing needs by 33%, cutting investigation time in half, centralizing incident response across 400+ locations, and generating over $4.5M in cost avoidance over three years at a global enterprise. Employee growth rate in 2025 was approximately 9-10%. The company maintains distributed offices with approximately 40% of 2025 sales reportedly coming from EMEA and APAC regions, indicating meaningful international traction."
    claimRefs: [CO019, CO020, CO021, CO022, CO023, CO024]
    tableRefs: [TO004]
    figureRefs: [FO001]
  - id: "milestones-and-timeline"
    title: "Key Milestones and Timeline"
    body: "Ontic's history includes both the company's own trajectory since 2017 and its complex predecessor relationship with Banjo Inc. The original entity Banjo was founded in 2010 by Damien Patton, operating as a real-time surveillance AI platform. In 2020, founder Patton's past involvement with white supremacist groups in the 1990s was publicly reported, leading to contract cancellations and his resignation as CEO. The company rebranded first to safeXai and then to Ontic Technologies in 2021 under new leadership. Major milestones since the re-launch include securing a $40M Series B in November 2021, achieving sustained product-market fit in the enterprise security vertical, raising the transformational $230M Series C led by KKR in August 2025, achieving FedRAMP Moderate Authorization in April 2026, and being named Frost & Sullivan Growth and Innovation Leader in Risk Intelligence Solutions for the third consecutive year in 2026 plus Frost & Sullivan Company of the Year for the fourth time. In 2026, Ontic also introduced Ontic Dispatch, extending Connected Intelligence into physical security response and coordination."
    claimRefs: [CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032, CO033]
    figureRefs: [FO002]
