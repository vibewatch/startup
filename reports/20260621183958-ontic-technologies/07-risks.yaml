chapter:
  number: 7
  title: Risks
  summary: 'Ontic’s risk profile is defined by four intertwined issues: legacy reputational overhang from the Banjo surveillance scandal, continuous privacy/compliance burden as AI and government use expand, operational complexity from a deeply integrated security platform, and concentration around large customers and key leaders. None of these risks is thesis-fatal on its own, but several could transmit quickly into trust, growth, and valuation if they combine.'
sections:
- id: legacy-legal-and-regulatory-risk
  title: Legacy, Legal, and Regulatory Risk
  body: 'The highest-salience risk is the lingering shadow of the Banjo controversy and its broader implications for privacy, procurement, and trust. Multiple independent sources describe how Banjo’s Utah surveillance contract unraveled after scrutiny of the company’s claimed capabilities, surveillance posture, and founder history. Even if Ontic’s current operating model is more enterprise-security-oriented and substantially cleaner, diligence processes will continue to revisit that legacy because it raises uncomfortable questions about data ethics, vendor vetting, public-sector suitability, and reputational resilience. Ontic’s 2026 FedRAMP win is an important counterweight, but it also increases the compliance burden. FedRAMP Moderate and an ATO are not endpoints; they introduce continuing control, documentation, and monitoring obligations. Broader compliance literature from KPMG, Thomson Reuters, Deloitte, Celent, and CMMC/FedRAMP commentary reinforces the same conclusion: AI-enabled security
    vendors face a rising burden around privacy, governance, documentation, and regulator expectations. For Ontic, the risk is not simply formal noncompliance. It is that any lapse could reactivate legacy skepticism precisely where trust matters most—in government and large-enterprise security use cases.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
