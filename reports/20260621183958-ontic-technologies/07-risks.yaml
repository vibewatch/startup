- id: financial-model-risk-and-kill-criteria
  title: Financial / Model Risk and Kill Criteria
  body: 'Ontic’s financial-model risk is less about imminent insolvency and more about whether the company can convert heavy capital, strong product ambition, and a referenceable customer base into efficient, durable growth. Public evidence does not disclose cash burn, retention, or concentration. GetLatka’s low customer count estimate and the chapter 4 capital-intensity math imply that a modest number of large accounts may carry substantial economic weight. That creates sensitivity to procurement delays, contract losses, or slower-than-expected public-sector conversions. The competitive backdrop compounds the issue: better-capitalized and better-known rivals can frame evaluations around their own strengths while Ontic is still investing in product breadth, compliance, and trust restoration. The right way to manage these risks is to define thesis-break triggers early. If FedRAMP slips, if major reference accounts fail to expand, if turnover hits the top team, or if privacy and surveillance
    narratives reattach to the brand, the investment case weakens quickly. Conversely, if Ontic demonstrates stable retention, disciplined compliance operations, and module expansion across a diversified base, many of these risks become manageable rather than fatal.'
