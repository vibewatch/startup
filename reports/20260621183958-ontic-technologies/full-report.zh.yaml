      - number: '7.3'
        title: 依赖与人员风险
        blocks:
          - type: paragraph
            body: >-
              依赖风险分三层。第一，Ontic 要靠外部数据源、企业集成，以及云或平台基础设施，才能把 connected-intelligence 这套论点做实。第二，它要靠监管机构和合规框架——尤其是
              FedRAMP——打开并守住公共部门可信度。第三，它要靠人：CEO Lukas Quanstrom 和重组后的领导团队，是 Banjo
              时代之后战略、信任修复和商业执行的核心。公司职业和招聘页面显示仍在持续招人，这有利于补产能，但也提醒投资人：产品、工程和客户成功人才都是竞争瓶颈。卖给复杂企业的安全平台，不能容忍实施薄弱、支持不足，或
              go-to-market
              与产品领导岗位高流失。公开证据也没有披露头部客户集中度或账户级依赖，意味着客户侧和领导层侧可能同时存在集中风险。这些风险可以管理，但一旦增长放慢、关键高管离职，或实施债开始在参考客户中暴露，就会威胁投资论点。
