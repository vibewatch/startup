  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 真实 ARR 明显高于公开追踪数据；NRR 强劲；政府和企业扩张加速
        - ~$80M-$100M ARR 乘 ~10x-12x，支撑 ~$800M-$1.2B
        - 执行、集中度和合规仍然重要
        - 需要私有数据证明溢价质量
      - - 基准
        - 公开 ARR 区间大致正确，但质量扎实，溢价有理由
        - ~$40M-$45M ARR 乘 ~6x-8x，支撑 ~$240M-$360M
        - 当前轮次定价可能跑在公开基本面之前
        - 以当前公开证据看最可信
      - - 悲观
        - 公开 ARR 区间正确，耐久性弱于预期
        - ~$35M-$40M ARR 乘 ~4x-5x，支撑 ~$140M-$200M
        - 留存、集中度或利润率不及预期
        - 若溢价叙事破裂则出现下行
      - - 撑到本轮
        - 当前隐含估值接近 ~$1B，需要隐藏指标或异常强的前瞻承销支撑
        - 要么 ARR 远高于公开代理值，要么投资者在为未来期权价值付费
        - 如果隐藏质量没有兑现，倍数会压缩
        - 可能成立，但公开层面尚未证明
    notes: 情景估值是分析估算，结合了公开 ARR 代理值和当前 SaaS 市场来源给出的基准倍数区间。
