      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Ontic 平台的主要买方画像，是 Fortune 500
              企业中掌管物理安全和保护性情报预算的首席安全官（CSO）或企业安全副总裁。次级买方包括全球安全运营中心（GSOC）总监、高管保护项目负责人，以及在物理威胁更高行业里的首席风险官。公共部门买方则是机构安全主管和保护性情报项目负责人。终端用户是每天使用平台的安全分析师、调查员和
              GSOC 操作员。付款方通常是企业安全预算负责人，但 IT 采购可能控制供应商审批和技术合规。多数企业中，预算归 CSO 职能所有，与 CISO
              的网络安全预算分开。采用触发因素包括高关注度威胁事件、高管保护需求、监管要求、职场暴力预防需求，以及把多个点状方案整合到单一平台的意愿。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
