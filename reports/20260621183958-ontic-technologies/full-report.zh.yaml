chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Ontic Technologies 是一家私营企业 SaaS 公司，总部位于 Texas 州 Austin，为企业和政府安全团队提供 AI 驱动的 Connected Intelligence
              软件。平台把安全运营和数据统一到一个中心化记录系统中，帮助组织开展风险评估、防范职场暴力、管理威胁和事件，并高效协调调查。Ontic 汇聚开源情报（OSINT）和外部威胁信号，同时接入
              HR、法务、IT、设施等内部系统数据。公司的收入模式基于 SaaS 订阅，服务 Fortune 500 公司和联邦机构。Ontic 于 2017 年正式成立，但公司历史可追溯到 Damien Patton
              2010 年创办的实时情报平台 Banjo Inc.；2020-2021 年领导层丑闻之后，该公司先后更名为 safeXai 和 Ontic Technologies。
