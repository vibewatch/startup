              驱动的品类领导力。这不代表该轮融资不理性；后期私募投资人常为战略期权价值付费。但这也意味着入场纪律很重要。没有留存、毛利、消耗或集中度披露，当前公开证据支持的是偏高估值，而不是明显有吸引力的估值。
