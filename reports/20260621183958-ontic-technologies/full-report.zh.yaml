      - number: '8.2'
        title: 可比公司组与倍数框架
        blocks:
          - type: paragraph
            body: >-
              最有用的估值视角是三角校准，而不是追求精确。公开 SaaS 基准来源显示，2026 年收入倍数中位数在低个位数；只有增长、留存和 Rule-of-40 质量很强时，最好的安全、AI、基础设施或垂直 SaaS
              公司才能拿到明显更高的溢价。这对 Ontic 是鼓励，因为公司处在安全、垂直工作流和带 AI 色彩的自动化交汇处。不过，同样的基准来源也反复强调，现在的高倍数要求高效增长、持久留存，并证明 AI
              已嵌进可防守工作流，而不是营销包装。Ontic 相邻的私有可比公司也有两面性。Everbridge 以 $1.8B 私有化、AlertMedia 据称探索超过 $1B
              出售，说明韧性和通信平台有真实战略价值。Dataminr 的融资轨迹显示，投资人愿意支持规模化信号领导者。但这些可比案例不能直接套用。它们的规模、成熟度或市场结构各不相同。结论是，Ontic 可能应当相对普通公开
              SaaS 享有溢价，但公开证据尚未证明，它配得上让约 $1B 估值显得明显保守的那种溢价。
