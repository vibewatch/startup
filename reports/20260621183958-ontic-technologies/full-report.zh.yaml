      - number: '3.3'
        title: 定价、转换成本与分销力量
        blocks:
          - type: paragraph
            body: >-
              对 Ontic 来说，定价环境天然困难，因为相关供应商多数通过企业级演示驱动销售和谈判合同成交，而不是公开标价。Everbridge 和 AlertMedia
              明确采用定制定价；Ontic、Dataminr、Resolver 和 Omnigo
              也类似，会把买方导入销售主导的评估路径。因此，功能匹配、信任、部署速度和高管支持会成为交易转化的核心。部署之后，转换成本中到高，因为这些系统会接入
              HR、差旅、通信、事件和案件管理工作流；但多供应商并存仍然可行：买方可以保留 Dataminr 做外部信号发现，同时采用 Ontic 做调查；也可以保留 Everbridge 做大规模通知，再加 Ontic
              做保护性情报。这种混合技术栈现实具有战略意义。Ontic 不必替换每一个既有厂商才能赢，但也不能假设自己能拿到赢家通吃的位置。Everbridge 和 Dataminr
              等更大品牌在分销规模上占优，而公共部门信任姿态和跨职能工作流深度，是 Ontic 能以小搏大的地方。
