            body: >-
              Ontic 的历史既包括公司自 2017 年以来的自身轨迹，也包括其与前身 Banjo Inc. 的复杂关系。原实体 Banjo 由 Damien Patton 于 2010 年创立，定位为实时监控 AI
              平台。2020 年，媒体公开报道创始人 Patton 在 1990 年代曾参与白人至上主义团体，随后合同被取消，他也辞任 CEO。新领导层接手后，公司先更名为 safeXai，2021 年又更名为 Ontic
              Technologies。重新启动后的主要里程碑包括：2021 年 11 月获得 $40M Series B；在企业安全垂直领域持续跑通产品市场匹配；2025 年 8 月完成由 KKR 领投、具有转型意义的
              $230M Series C；2026 年 4 月获得 FedRAMP Moderate Authorization；连续第三年被 Frost & Sullivan 评为 Risk Intelligence
              Solutions 增长与创新领导者，并第四次获得 Frost & Sullivan Company of the Year。2026 年，Ontic 还推出 Ontic Dispatch，把 Connected
              Intelligence 延伸到物理安全响应和协调。
