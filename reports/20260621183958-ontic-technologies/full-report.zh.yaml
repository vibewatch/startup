      - number: '2.2'
        title: 市场规模与增长预测
        blocks:
          - type: paragraph
            body: >-
              Ontic 2026 年新闻稿引用的 Frost & Sullivan 研究显示，风险情报解决方案市场在 2025 年规模为 $58.84 billion，预计复合年增长率 19.4%，到 2030 年达到
              $170.14 billion。这是 Ontic 平台最宽口径的可服务市场。若用更窄的网络威胁情报视角，2025 年市场约 $13.4-16.8 billion，2026 年增至 $15.8-19.3
              billion，长期 CAGR 到 2035 年为 14-18%，规模达 $53-65 billion。整体物理安全市场在 2026 年约 $129-131 billion，增长更温和，CAGR 为 4-5%。对
              Ontic 最相关的可服务可获取市场（SAM）位于企业安全软件和情报细分，针对 Fortune 1000 企业和政府机构的企业安全运营中心、保护性情报和调查工作流的纯软件平台，全球估计为 $3-8
              billion。
