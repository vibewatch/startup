  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Ontic Technologies 目前处在几个关键重叠市场的交叉点：风险情报解决方案、企业物理安全软件、威胁情报平台和保护性情报工具。核心可服务市场是风险情报解决方案。Frost & Sullivan
              将其定义为一类平台，能够把物理安全、网络安全、IT 和其他内部业务职能的数据操作化，形成统一的威胁检测和响应能力。这个宽口径市场边界明确包含 OSINT
              聚合、社交媒体监测、高管保护软件、职场暴力预防系统、调查和案件管理工具，以及关键事件管理平台。主要市场边界之外，则是纯网络安全产品（终端保护、SIEM）、物理安全硬件（摄像头、门禁）、人力安保服务和通用商业智能平台。相邻市场包括网络威胁情报（数字侧更窄）、大规模通知系统，以及可能争夺重叠预算的物理安全即服务产品。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
