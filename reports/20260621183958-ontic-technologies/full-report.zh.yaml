      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Ontic 由 CEO 兼联合创始人 Lukas Quanstrom 领导，他主导公司战略方向和 AI 投资议程。高管团队包括首席营收官 Brian Mazza、首席技术与产品官 Nitin
              Navare、首席运营官 Kyle Giunta、首席财务官 Ryan Suneson、首席法务官 Scott Shepherd、首席解决方案与创新官 Manish Mehta、联盟执行副总裁 Amy
              Sullivan，以及人力副总裁 Murph Holder。董事会成员包括 Lukas Quanstrom、Mike Dodd（Silverton Partners）、Jake Heller（KKR）、Bob
              Nye（JMI Equity）和 Murali Swaminathan。公司还设有顾问委员会，成员是安全行业知名思想领袖，包括 Fred Burton、Dave Komendat、Rich
              Davis、Thomas Kopecky 和 Gagan Jain，他们为 Ontic 的产品战略提供建议，并就保护性情报、企业软件和企业安全趋势提供指导。值得注意的是，前身公司争议之后，领导团队已经完全重组，原
              Banjo 领导层没有人继续担任高级管理职位。这个治理重置，是后续获得机构投资者支持的前提。
