      - number: '8.3'
        title: 牛市、基准与熊市场景
        blocks:
          - type: paragraph
            body: >-
              场景测算很直接。仅看公开 ARR 代理指标，即使给出慷慨的高倍数，也很难支撑独角兽估值。用可见收入区间低端计算，4x-5x 倍数对应的熊市估值约 $140M-$210M。基准情形给 Ontic
              更好质量和安全溢价的好处——例如对约 $40M ARR 使用 6x-8x——估值仍落在约 $240M-$340M。牛市情形只有在两件事之一成立时才有说服力：要么公开收入追踪器显著低估公司真实经常性收入，要么
              Ontic 能维持高溢价增长和留存，让投资人承销远高于外部可见水平的前瞻 ARR。实际看，$1B+ 私募标记只有在隐藏 ARR 接近 $80M-$100M，或投资人相信 Ontic
              能凭强留存和政府扩张迅速长到这一规模时，才站得住。可见基本面与所需上行空间之间的缺口，解释了为什么仅凭公开证据，估值立场应是偏高，而不是公平。
