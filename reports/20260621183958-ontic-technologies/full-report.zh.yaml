          detail: 集成、AI、响应工作流
        - id: customers
          label: 客户影响
          detail: 续约、扩展、可推荐性
        - id: economics
          label: 经济性影响
          detail: 增长、支持成本、销售周期拖累
        - id: valuation
          label: 估值影响
          detail: 倍数压缩 / 更高折现率
      edges:
        - from: legacy
          to: customers
          label: 侵蚀信任
        - from: compliance
          to: economics
          label: 抬高成本
        - from: operations
          to: customers
          label: 拖累采用
        - from: customers
          to: valuation
          label: 削弱证据
        - from: economics
          to: valuation
          label: 压缩上行空间
    claimRefs:
      - CR004
      - CR007
      - CR014
      - CR032
      - CR035
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: 最影响 Ontic 风险画像的外部系统和参与方。
    data:
      nodes:
        - id: ontic
          label: Ontic
          detail: 核心运营公司
        - id: data
          label: 外部数据源
          detail: OSINT、观察名单、公开数据
        - id: systems
          label: 企业系统
          detail: HR、身份、安全平台
        - id: regulators
          label: 监管机构 / 合规机构
          detail: FedRAMP 与隐私制度
        - id: customers
          label: 大客户
          detail: Fortune 500 与公共部门
        - id: leaders
          label: 关键领导层
          detail: CEO 以及产品 / 合规骨干
      edges:
        - from: data
          to: ontic
          label: 供给
        - from: systems
          to: ontic
          label: 连接
        - from: regulators
          to: ontic
          label: 约束
        - from: customers
          to: ontic
          label: 出资
        - from: leaders
          to: ontic
          label: 指挥
    claimRefs:
      - CR022
      - CR023
      - CR024
      - CR026
      - CR027
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 市场、产品、客户与财务证据如何导向估值偏紧的判断。
    data:
      nodes:
        - id: proof
          label: 已有真实验证
          detail: 客户、产品深度、机构背书
        - id: opacity
          label: 财务仍不透明
          detail: ARR 质量、留存、集中度未公开
        - id: benchmarks
          label: 公开市场倍数更低
          detail: 2026 年中位数为低个位数
        - id: premium
          label: 安全 / AI 溢价仍可能
          detail: 但前提是质量指标足够强
        - id: decision
          label: 建议
          detail: 继续研究，估值偏紧
    claimRefs:
      - CV001
      - CV003
      - CV011
      - CV012
      - CV031
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 以约 $40M ARR 为基准，展示不同收入倍数假设下的估值敏感性。
    data:
      items:
        - label: 收入 4x
          value: 160
          detail: 基于公开代理指标的熊市倍数
        - label: 收入 6x
          value: 240
          detail: 基准低溢价情景
        - label: 收入 8x
          value: 320
          detail: 基准高溢价情景
        - label: 收入 10x
          value: 400
          detail: 未计入隐藏 ARR 的激进溢价
        - label: 收入 12x
          value: 480
          detail: 高溢价下，约 $40M ARR 仍低于约 $1B
    approximationNotes: 使用取整后的 $40M ARR 基准，说明若没有更高的真实 ARR 或强得多的未来承销假设，单靠倍数变化无法撑到独角兽估值。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 在熊市、基准、牛市假设下，基于公开证据的估值区间。
    data:
      items:
        - label: 熊市情景价值
          low: 140
          high: 200
          unit: USDm
        - label: 基准情景价值
          low: 240
          high: 360
          unit: USDm
        - label: 牛市情景价值
          low: 800
          high: 1200
          unit: USDm
        - label: 可见 ARR 代理指标
          low: 35.6
          high: 42.4
          unit: USDm
    approximationNotes: 区间结合公开 ARR 代理指标与基准倍数带，因此属于情景分析，不是直接市场报价。
    claimRefs:
      - CV003
      - CV004
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格计分卡，列出 2026 年判断 Ontic 估值时最关键的输入。
    data:
      items:
        - label: 可见 ARR 基础
          value: $35.6M-$42.4M
          detail: 公开代理指标区间
        - label: 隐含融资估值判断
          value: ~$1B?
          detail: 未披露，外界广泛推断的私募估值标记
        - label: 公开市场倍数基准
          value: 2.6x-4.0x
          detail: 2026 年公开 SaaS 中位倍数带
        - label: 溢价带
          value: ~5x-8x
          detail: 安全 / 高质量 SaaS 经验区间
        - label: 估值判断
          value: Stretched
          detail: 仅基于公开证据
        - label: 建议
          value: Research-more
          detail: 私有指标必须缩小差距
    claimRefs:
      - CV003
      - CV006
      - CV012
      - CV013
      - CV031
      - CV040
