            body: 仅看公开 ARR 代理指标，即便套用高溢价 SaaS 倍数，也不明显支持约 $1B 估值。只有隐藏 ARR、留存或政府业务期权价值显著好于公开证据，该轮价格才显得舒服。
            calloutType: risk
