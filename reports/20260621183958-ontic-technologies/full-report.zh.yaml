companyProfile:
  summary: >-
    Ontic Technologies 是一家总部位于 Austin 的企业 SaaS 公司，提供 AI 驱动的 Connected Intelligence
    软件，帮助企业和政府安全团队识别威胁、评估风险并更快响应。平台把安全运营数据统一到一个中心化记录系统中，将开源情报和外部威胁信号与组织内部数据汇聚在一起。公司成立于 2017 年，累计融资 $287M，其中包括 2025 年 8
    月由 KKR 领投的 $230M Series C。Ontic 服务 Fortune 500 公司和联邦机构，场景覆盖高管保护、威胁情报、调查和职场暴力预防。
