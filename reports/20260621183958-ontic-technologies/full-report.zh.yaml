  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 历史遗留、法律与监管风险
        blocks:
          - type: paragraph
            body: >-
              最醒目的风险，是 Banjo 争议留下的阴影，以及它对隐私、采购和信任的更广影响。多家独立来源描述了 Banjo 的 Utah 监控合同如何在外界审视公司所称能力、监控姿态和创始人历史后瓦解。即便 Ontic
              当前运营模式更偏企业安全，也明显更干净，尽调流程仍会不断回到这段历史，因为它提出了令人不舒服的问题：数据伦理、供应商审查、公共部门适配性和声誉韧性。Ontic 2026 年获得 FedRAMP
              是重要的反向砝码，但也提高了合规负担。FedRAMP Moderate 和 ATO 不是终点；它们带来持续的控制、文档和监测义务。KPMG、Thomson Reuters、Deloitte、Celent 以及
              CMMC/FedRAMP 评论中的更广合规文献，也强化了同一个结论：AI 驱动安全供应商正面对更高的隐私、治理、文档和监管预期。对 Ontic
              来说，风险不只是形式上的不合规，而是任何疏漏都可能在最需要信任的地方——政府和大型企业安全用例中——重新激活历史质疑。
