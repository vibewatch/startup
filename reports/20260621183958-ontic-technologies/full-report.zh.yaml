      - number: '8.4'
        title: 建议、论点破裂点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              当前估值下，投资建议最适合定义为继续研究，估值立场偏高，信心中等。Ontic 有足够正面证据——可信的机构背书、差异化工作流论点、具名企业验证、FedRAMP
              进展，以及与具战略价值的安全软件品类相邻——足以支持继续关注。但公开证据不足以支持价格信心。公司需要证明，收入质量、留存、集中度和公共部门转化都显著好于公开记录所暗示的水平。反论点很直接：如果 Ontic
              实际上是一家 ARR 约 $35M-$40M、资本强度高、耐久性证据不完整的公司，那么类独角兽标记过早计入了太多未来成功。只有管理层能展示高质量
              ARR、强净留存、持续加深的模块深度，以及一条能缩小当前倍数缺口的可信规模化路径，投资论点才会改善。在那之前，估值更像乐观税，而不是优势。
