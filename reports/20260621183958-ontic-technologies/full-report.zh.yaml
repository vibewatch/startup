      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              2026 年及以后，几股宏观力量正在推高风险情报平台需求。2024 年末 UnitedHealth Group
              一名高管遭枪杀，显著提升了企业董事会对高管安全威胁的认知，推动多个行业增加保护性情报解决方案预算。物理和网络威胁正在融合，迫使安全团队打破 CSO 与 CISO
              职能之间的组织孤岛，催生能够连接两个领域的统一平台。AI 和自动化采用让资源紧张的安全团队能用更少人手处理更多工作，从海量数据中过滤噪音并浮出可行动情报。监管压力也在创造合规驱动的采购动机，包括政府合同所需的
              FedRAMP 要求，以及 ISO 27001 等国际标准。约束端则包括：企业销售周期长（通常 6-12 个月）、从既有系统迁移的转换成本高、数据隐私法规（GDPR、CCPA、EU AI
              Act）让监控能力的合规复杂度上升，以及网络安全工具的预算竞争可能挤出物理安全软件支出。
            claimRefs:
