        title: 直接竞争者画像与定位
        blocks:
          - type: paragraph
            body: >-
              Dataminr、Resolver、Everbridge、AlertMedia 和 Omnigo 是最相关的竞争集合，因为它们都覆盖了同一企业安全采购工作流中的重要部分，只是切入点不同。Dataminr 以 AI
              驱动的实时外部信号检测和全球告警见长。Resolver 强调风险情报、事件工作流和调查文档。Everbridge 在关键事件管理和大型企业韧性通信上领先。AlertMedia
              围绕统一风险情报、响应、应急通信和高管保护用例定位。Omnigo 更垂直，事件报告和公共安全工作流更适配医疗、教育等运营环境。Ontic
              的定位差异，在于它明确把人员、案件、证据和工作流连接起来，横跨企业安全、法务、HR 和高管保护场景。这让 Ontic
              在复杂企业中有很强叙事，但也意味着公司要与更大装机基础和更广产品套件竞争；这些对手可能靠熟悉度、相邻模块或采购标准化赢单，而不是靠更强的互联调查工作流。
