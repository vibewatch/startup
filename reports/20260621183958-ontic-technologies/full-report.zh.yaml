    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              Ontic 的公开材料支持这样一个企业 SaaS 收入模式：向企业和政府安全团队销售 Connected Intelligence 软件。公司营销统一平台，通过客户故事强调 ROI
              和节省时间，也不公布自助式定价，这些都符合高接触企业合同销售。现有最好公开牵引力数据来自 GetLatka：估计 2025 年 ARR 为 $35.6M，客户 26 个，员工 324 人，平均合同价值约
              $1.4M。这与集中型企业客户基础一致，而不是高销量 SMB 销售。但公开记录很混乱：Growjo
              对收入、融资和员工数的估计明显不同，公司自己仍未披露经审计的损益表或资产负债表细节。因此，投资者只能把收入、ARR 和客户经济性视为代理指标，而不是定论。积极信号是，客户故事反复把 Ontic
              描述为带来可衡量价值的工作流平台；需要警惕的是，收入质量仍靠推断，而非公司披露。
