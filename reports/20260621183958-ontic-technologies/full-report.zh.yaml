        title: 财务 / 模型风险与止损标准
        blocks:
          - type: paragraph
            body: >-
              Ontic 的财务模型风险，不是眼前会不会破产，而是公司能否把重资本投入、强产品野心和可背书客户基础，转成高效、持久的增长。公开证据没有披露现金消耗、留存或集中度。GetLatka 对客户数的低估算，以及第 4
              章的资本强度测算，都指向一个可能：少数大客户可能承载相当大的经济权重。这会让公司对采购延迟、合同流失，或公共部门转化慢于预期更敏感。竞争背景又放大了问题：资金更足、知名度更高的对手，可以围绕自身优势设定评估框架；Ontic
              仍在投入产品广度、合规和信任修复。管理这些风险的正确方式，是尽早定义论点破裂触发器。如果 FedRAMP
