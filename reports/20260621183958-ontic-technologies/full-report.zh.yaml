      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              Ontic 的产品优势与运营复杂性无法切开。一个承诺连接调查、集成研究、高管保护和响应协调的平台，依赖数据质量、集成可靠性、权限纪律和跨多环节的低延迟工作流执行。2026 年 3 月 Dispatch
              发布后，风险进一步提高，因为实时响应失败比慢速研究或文档工作流更显眼，也更伤运营。Ontic 自己的产品材料强调集成公共数据、安全系统、社交输入、暗网监测和 AI
              驱动的工作流加速。这些功能有商业吸引力，但也放大了失效模式：噪音或过期数据、误报、身份解析错误、集成中断和用户绕行，都会侵蚀信任。公开来源没有提供正常运行时间、事故历史或模型错误指标，留下了无法量化的重大运营风险。这对一家私营安全软件公司并不反常，但很重要，因为
              Ontic 正越来越多要求买方把关键任务流程放进平台，而不只是把它当作情报辅助工具。
