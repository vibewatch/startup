      - number: '1.3'
        title: 融资历史与估值
        blocks:
          - type: paragraph
            body: >-
              Ontic Technologies 已在四轮机构融资中累计融得约 $287M。2019 年 1 月，公司完成 $4.65M 种子轮，投资方包括 Silverton Partners、Floodgate 和
              Village Global。2020 年 4 月，公司完成 $14M Series A，由 Felicis Ventures 领投，Silverton Partners 和 Floodgate 参投。2021
              年 11 月，公司完成 $40M Series B，由 JMI Equity 领投，Felicis Ventures、Silverton Partners 和 Ridge Ventures 参投。2025 年 8
              月，公司完成标志性的 $230M Series C，由 KKR 通过其 Next Generation Technology III Fund 领投，JMI Equity、Silverton
              Partners、Ridge Ventures 和 Ten Eleven Ventures 参投。Series C 估值未公开披露，但第三方估计约为 $1 billion。自 2016 年以来，KKR
              已向科技成长型公司投资约 $24 billion，并配有 28 名科技成长股权投资专业人士的专门团队。
