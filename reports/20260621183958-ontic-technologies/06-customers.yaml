company:
  name: Ontic Technologies
chapter:
  number: 6
  title: Customers
  summary: Public customer evidence for Ontic is stronger on named enterprise proof and workflow outcomes than on retention math. The company can point to Visa, Ally, Honeywell-oriented ROI narratives, multiple Fortune 500 anonymized stories, and external review surfaces, but durability metrics such as NRR, GRR, churn, contract length, and concentration are still largely private—making customer quality positive yet only partially underwritten.
sections:
- id: customer-base-and-segmentation
  title: Customer Base and Segmentation
  body: 'Ontic’s public customer footprint is clearly enterprise-led rather than mass-market. The company’s homepage, clients pages, and case-story archive consistently point to corporate and government security teams, Fortune 500 environments, and functionally complex use cases spanning executive protection, investigations, risk assessment, and intelligence operations. Named or semi-named stories cover financial services, travel technology, insurance, enterprise software, and broader large-enterprise security teams, while FedRAMP-related materials indicate active public-sector relevance as well. GetLatka’s estimate of 26 customers in 2025 fits that picture: this is not a volume-logo motion, but a concentrated, high-touch enterprise base. That structure has positive and negative consequences. On the positive side, customers appear large enough to justify meaningful implementation effort and cross-functional workflow adoption. On the negative side, a relatively small number of logos can create
    concentration sensitivity if even a handful of accounts are disproportionately large, and public evidence does not yet disclose the top-account mix needed to dismiss that risk.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: named-customer-proof-and-outcomes
  title: Named Customer Proof and Outcomes
  body: 'Ontic’s strongest customer evidence is its library of applied workflow outcomes. Ally says Ontic saved up to eight hours per site risk assessment. Visa says Ontic centralized threat research and integrated multiple investigative tools. A Fortune 500 insurance company reportedly cut manual work by 85 percent. A Fortune 500 travel-technology customer describes better investigations and more efficient information sharing. Additional enterprise-software stories emphasize turning disjointed research into a stronger investigations program and scaling a small security team. These are meaningful proofs because they map to specific security jobs to be done rather than vague “digital transformation” claims. They also suggest Ontic is used in production-like workflows across multiple verticals, not only in pilot or innovation-lab settings. Still, the quality of this evidence has an obvious limit: nearly all of it is company-authored, selectively curated, and biased toward successful deployments.
    Public case stories are useful proof of adoption and use-case fit, but they do not replace cohort retention data or independently audited usage metrics.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  tableRefs:
