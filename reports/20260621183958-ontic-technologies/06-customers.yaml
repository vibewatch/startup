- id: satisfaction-retention-and-durability
  title: Satisfaction, Retention, and Durability Signals
  body: 'Satisfaction signals are present, but they are thinner than the case-study volume might suggest. FeaturedCustomers maintains an Ontic vendor page that advertises dozens of customer reviews and references, while G2, Gartner Peer Insights, and GetApp each host product-review surfaces for Ontic. That matters because it shows public customer feedback exists beyond the company’s own website. However, these surfaces do not solve the central durability problem for underwriting. Public review availability is not the same thing as high renewal rates, multi-year contract stickiness, or healthy expansion economics. No public source reviewed for this chapter provides NRR, GRR, logo churn, renewal cohorts, median contract length, or customer lifetime value. Even review pages that may speak to user sentiment are too shallow from an underwriting standpoint without underlying usage and commercial data. The result is a mixed but still favorable read: there is enough public evidence to believe Ontic
    has real and referenceable customers, but not enough to conclude those customers renew and expand at the rate an investor would want to see from a high-valuation enterprise-security platform.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  tableRefs:
  - TU004
  figureRefs: []
- id: expansion-and-concentration-risk
  title: Expansion and Concentration Risk
  body: The expansion story is plausible but not yet numerically proven. Ontic’s multi-module product surface—assessments, research, incidents, investigations, executive protection, and now response—creates a logical land-and-expand path inside large accounts. Public-sector readiness through FedRAMP could also diversify the customer base beyond purely commercial enterprises over time. Customer stories further imply cross-functional value that can move from one team to others within the same organization. But every positive expansion narrative has a matching concentration caveat. If the public estimate of roughly 26 customers is directionally right, then Ontic likely depends on a modest number of high-value relationships. That raises exposure to procurement friction, slow federal cycles, budget resets, and account-level deployment disappointments. Because public sources do not disclose top-customer concentration, contract duration, or renewal history, investors cannot conclude that the current
    base is broadly de-risked. The proper customer verdict is therefore favorable on adoption proof, but incomplete on durability and concentration.
  claimRefs:
  - CU026
