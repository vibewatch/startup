  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, logo churn, and renewal cohorts by vintage and segment.
    whyItMatters: Without retention math, referenceable adoption cannot be translated into durable recurring-revenue quality.
    diligencePath: Request cohort tables, renewal data, and expansion ARR from revenue operations.
    relatedQuestionRefs:
    - QU013
    - QU014
    - QU022
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-10 customer ARR concentration, contract lengths, and renewal dates.
    whyItMatters: A small number of high-ACV accounts can create outsized downside if one or two contracts slip.
    diligencePath: Request customer concentration table and contract schedule from finance.
    relatedQuestionRefs:
    - QU015
    - QU024
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: public-sector
    missingEvidence: Live public-sector customers, federal ARR, and deployment outcomes.
    whyItMatters: FedRAMP improves eligibility, but diversification only matters if it converts into real customers and renewals.
    diligencePath: Request public-sector pipeline, wins, and customer references from government sales leadership.
    relatedQuestionRefs:
    - QU017
    - QU023
    relatedTableRefs:
    - TU001
  - type: private-evidence-only
    severity: minor
    topic: deployment-depth
    missingEvidence: Module adoption, active users, and workflow breadth inside major reference customers.
    whyItMatters: Depth of deployment determines whether case-story customers are truly sticky expansion accounts.
    diligencePath: Request reference-account module maps and user adoption dashboards.
    relatedQuestionRefs:
    - QU016
    relatedTableRefs:
    - TU003
