- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing metric
  - Impact
  - Exact diligence path
  rows:
  - - Audited revenue and ARR bridge
    - Prevents clean underwriting of revenue quality
    - Request monthly recurring revenue bridge, deferred revenue, and GAAP revenue walk
  - - Gross margin by software vs services
    - Hides real scalability and implementation drag
    - Request segment gross margin and services utilization detail
  - - CAC, payback, and pipeline conversion
    - Blocks sales-efficiency analysis
    - Request S&M spend, new ARR, win rates, and payback by segment
  - - NRR, GRR, and churn
    - Blocks durability analysis
    - Request cohort renewal and expansion data for 2023-2026 vintages
  - - Cash balance, burn, and runway
    - Blocks capital adequacy analysis
    - Request latest board package with cash forecast and downside plan
  - - Public-sector revenue mix and implementation cost
    - Blocks judgment on federal expansion economics
    - Request federal ARR, margin, deployment timeline, and compliance cost detail
  notes: These are the exact financial blockers that prevent a full underwriting view from public evidence alone.
