chapter:
  number: 4
  title: Financials
  summary: 'Ontic shows credible enterprise-software traction but the public financial record is thin, inconsistent, and mostly third-party estimated: GetLatka reports $35.6M ARR on 26 customers in 2025, while Growjo reports a different revenue and headcount profile. The $230M Series C materially reduced near-term financing pressure, yet absent cash, margin, retention, and burn disclosure, underwriting depends more on inferred capital intensity and diligence gaps than on clean audited metrics.'
sections:
- id: revenue-model-and-public-traction
  title: Revenue Model and Public Traction
  body: 'Ontic’s public materials support an enterprise SaaS revenue model built around connected-intelligence software sold to corporate and government security teams. The company markets a unified platform, promotes ROI and time-savings through customer stories, and does not publish self-serve pricing, all of which are consistent with a high-touch enterprise contract motion. The best available public traction figure is GetLatka’s estimate of $35.6M 2025 ARR, 26 customers, 324 employees, and roughly $1.4M average contract value. That is directionally consistent with a concentrated enterprise-customer base rather than high-volume SMB sales. However, the public record is messy: Growjo estimates materially different revenue, funding, and headcount, and the company itself still does not publish audited income statement or balance sheet detail. That forces investors to treat revenue, ARR, and customer economics as proxies rather than settled facts. The encouraging signal is that customer stories
    repeatedly frame Ontic as a workflow platform with measurable value; the caution is that revenue quality remains inferred rather than disclosed.'
  claimRefs:
