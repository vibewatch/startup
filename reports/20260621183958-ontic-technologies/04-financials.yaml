  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash
    missingEvidence: Cash on hand, restricted cash, and monthly burn by function.
    whyItMatters: Without cash and burn, runway and next-round risk cannot be quantified responsibly.
    diligencePath: Request latest board package, treasury schedule, and cash forecast.
    relatedQuestionRefs:
    - QI016
    - QI017
    - QI018
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: margin
    missingEvidence: Software gross margin, services gross margin, hosting cost, and implementation drag.
    whyItMatters: Margin quality determines whether the large capital base is building a scalable SaaS asset or funding labor-heavy delivery.
    diligencePath: Request segment gross margin, services utilization, and cost-to-serve by customer cohort.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, pipeline conversion, and fully loaded sales productivity.
    whyItMatters: Sales efficiency is the missing bridge between high ACV and durable capital efficiency.
    diligencePath: Request sales & marketing spend, bookings, quota attainment, and new ARR by segment.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, and cohort expansion by vintage and vertical.
    whyItMatters: System-of-record claims are only valuable if accounts renew and expand after initial deployment.
    diligencePath: Request renewal history, cohort tables, and top-20 account expansion logs.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI005
  - type: conflicting-data
    severity: material
    topic: tracker-conflict
    missingEvidence: A reconciled company-approved table of revenue, headcount, and funding history.
    whyItMatters: Public-source conflicts distort every efficiency and capital-intensity calculation in this chapter.
    diligencePath: Ask management to reconcile third-party tracker errors against board-approved operating metrics.
    relatedQuestionRefs:
    - QI009
    - QI014
    relatedTableRefs:
    - TI003
    - TI005
