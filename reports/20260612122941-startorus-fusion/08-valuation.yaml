- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Present valuation logic
  - Probability signal
  - Key risks
  rows:
  - - Bull case
    - NTST reaches rated operation in 2027; Q greater than 1 lands around 2028-2030; state-backed capital remains available; customer dialogue matures into real pre-offtake evidence.
    - USD 2.0-4.0B present valuation as investors price a credible Chinese first-mover path to a 2030s demonstration reactor.
    - Low-to-medium; requires both technical execution and continued financing support.
    - Independent proof disappoints, permitting slows, or domestic competitors capture narrative leadership.
  - - Base case
    - Startorus keeps building in Shanghai, but power commercialization stays a 2030s story and another large financing is needed before any bankable plant case.
    - USD 0.8-1.4B present valuation, roughly around the current mark but without obvious upside until disclosure and proof improve.
    - Medium; matches sector surveys that still place commercial pilots mostly in the 2030-2035 window.
    - Dilution, long timelines, and weak customer evidence cap multiple expansion.
  - - Bear case
    - NTST or successor milestones slip; follow-on round prices below the current mark; the market re-rates toward earlier-stage fusion comps.
    - USD 0.4-0.8B present valuation, reflecting a funded but still speculative platform rather than a premium commercialization candidate.
    - Material; the sector remains pre-breakeven and capital intensive.
    - Capital-market fatigue, technical setbacks, and opaque terms amplify downside.
  notes: Ranges are analyst estimates based on milestone probabilities, peer funding depth, and public-sector timing references rather than on current cash flow.
