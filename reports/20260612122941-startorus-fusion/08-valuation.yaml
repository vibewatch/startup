  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap table and preference stack
    missingEvidence: Current ownership, liquidation preferences, anti-dilution terms, and any investor rights from the 2026 A and A+ rounds.
    whyItMatters: Without the preference stack, investors cannot translate enterprise-value scenarios into likely common-equity outcomes.
    diligencePath: Request the latest cap table, financing documents, side letters, and any employee-option overhang summary.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: China licensing path
    missingEvidence: A machine-by-machine environmental, radiation-safety, tritium, and future reactor licensing roadmap for NTST and successor devices.
    whyItMatters: Permitting and safety obligations can alter timeline, capex, and site risk even if the physics program keeps advancing.
    diligencePath: Request regulator correspondence, environmental filings, site permits, and the internal milestone map for China approvals.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: future customer demand
    missingEvidence: Any letters of intent, paid pilots, data-center discussions, utility studies, or industrial heat demand evidence tied to future fusion output.
    whyItMatters: The valuation currently leans on category TAM and policy support rather than on customer-backed demand for Startorus power products.
    diligencePath: Request the customer pipeline, counterparties, use cases, and any non-binding or binding commercial documents.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: independent plasma proof
    missingEvidence: Third-party validation of NTST and successor-machine performance targets, including confinement, temperature, pulse duration, and any Q-style metrics.
    whyItMatters: Independent validation is the cleanest way to decide whether the unicorn mark deserves to move toward the bull range rather than collapse toward the bear range.
    diligencePath: Request external test reports, peer-reviewed data, advisor memos, or independent technical due-diligence packages.
    relatedQuestionRefs:
    - QV007
    - QV024
    - QV025
    - QV026
