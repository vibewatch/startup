- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - 2025-2026 valuation or capital signal
  - Status / proof level
  - Why relevant to Startorus
  - Main limitation
  rows:
  - - Startorus Fusion
    - '>USD 1B reported valuation; >RMB 2B cumulative funding'
    - Pre-revenue fusion developer; NTST not yet operating at rated parameters
    - Direct subject; tests whether China-policy support can justify a unicorn mark before commercial proof.
    - Disclosure remains thin on cap table, independent machine data, and customer demand.
  - - Helion Energy
    - USD 15.5B post-money; USD 1.5B total funding
    - Plant under construction; named customer; private D-T milestone claims
    - Shows what a premium private fusion mark looks like when commercial narrative is stronger.
    - Still pre-revenue and still not at proven commercial breakeven.
  - - Commonwealth Fusion Systems
    - Nearly USD 3B total funding; USD 863M B2 in 2025
    - SPARC first plasma still targeted for 2026; ARC early 2030s
    - Best-capitalized magnetic-confinement peer for schedule realism and funding depth.
    - Valuation not publicly disclosed in the retained sources.
  - - TAE Technologies
    - '>USD 1.3B raised; >USD 6B merger framing'
    - Late-stage private fusion company seeking public-market capital
    - Shows that even a long-funded platform still needs financing creativity before revenue.
    - Merger value is not the same as a clean third-party round valuation.
  - - Tokamak Energy
    - USD 335M total raised; HTS magnet side business
    - Private spherical-tokamak company with enabling-technology monetization
    - Closest reactor-shape analogy and a useful funding-scale benchmark.
    - Different jurisdiction, funding environment, and business mix.
  - - Realta Fusion
    - USD 36M Series A plus USD 9.5M debt facility
    - Early magnetic-mirror company targeting industrial heat and power
    - Useful lower-capital benchmark for how early-stage private fusion is still financed.
    - Much smaller scale and different technical approach.
  - - Energy Singularity
    - 2026 Series A disclosed without amount after earlier ~CNY 800M rounds
    - Chinese HTS-tokamak peer with 1,337-second plasma run claim
    - Shows domestic competition for policy support, talent, and investor attention.
    - No disclosed 2026 valuation in the retained public sources.
  - - Oklo / NuScale public references
    - ~USD 10.0B and ~USD 3.5B public market caps in June 2026
    - Public advanced-nuclear companies, with Oklo still pre-revenue
    - Useful price-discipline reference for how frontier-energy stories are valued once they face public comparability.
    - Fission is not fusion, so these are discipline anchors, not true operating comps.
  notes: Rows mix private fusion peers and public advanced-nuclear references because no clean public pure-play fusion comparable set exists in June 2026.
