- id: thesis-breaks-and-diligence
  title: The call only improves with better evidence on proof, dilution, and commercialization demand
  body: 'The anti-thesis is not that Startorus lacks talent or ambition. It is that fusion history is crowded with well-funded programs that looked persuasive before first-of-kind engineering and financing reality caught up with them. The adverse reading from the Bulletin, Belfer, and TechCrunch is useful precisely because it attacks the premise behind many late-stage private marks: money and publicity are not substitutes for commercial proof. Startorus can overcome that critique, but only with evidence that is not yet public. Investors need the 2026 cap table and preference stack, a machine-by-machine budget through 2032, independent plasma-performance validation, an explicit China permitting map, and proof that counterparties want future fusion energy rather than just a good narrative. Until those items exist, the right posture is disciplined curiosity. The thesis breaks if NTST slips materially, if follow-on financing lands below the current mark, if independent machine evidence disappoints,
    or if the company cannot move from policy-backed project status toward customer-backed commercialization. Those are the triggers that matter more than headline valuation alone.'
