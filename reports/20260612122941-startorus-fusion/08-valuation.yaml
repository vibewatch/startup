- id: price-vs-stage-and-capital-intensity
  title: Compared with global peers, Startorus is early on proof and still modest on capital scale
  body: 'The cleanest way to test the unicorn mark is to compare it with what better-known fusion peers have already bought with much larger pools of capital. Helion has raised USD 1.5 billion, disclosed a USD 15.5 billion post-money valuation, and can point to a named customer, a plant under construction, and a public technical milestone cadence. CFS has raised almost USD 3 billion and still describes SPARC first plasma as a 2026 event, with grid power only in the early 2030s. TAE has raised more than USD 1.3 billion and sought public-market capital through a merger framed at more than USD 6 billion. Tokamak Energy, by contrast, sits closer to Startorus in funding scale and is still pairing fusion claims with a magnets side business. The sector survey is even more important than any single peer: it says the median fusion company still needs about USD 694 million more to reach a first plant and that the group collectively needs more than USD 77 billion. Against that backdrop, Startorus at
    USD 1 billion plus is not crazy, but it is a price for possibility, not for de-risked deployment.'
