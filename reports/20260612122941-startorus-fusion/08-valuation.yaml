- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Thesis argument
  - Conviction
  - Anti-thesis argument
  - What would change the view
  rows:
  - - State-backed capital and Shanghai industrial policy give Startorus a better runway than many Western venture-only peers.
    - Medium-High
    - Strategic backers can also tolerate weaker disclosure and delay price discipline, leaving outside investors blind on terms and pace.
    - Disclose the cap table, governance rights, and objective milestone gates for each financing tranche.
  - - Spherical tokamak plus HTS magnets and AI controls is a differentiated engineering story with visible local build activity.
    - Medium
    - Differentiation is not proof; no public source verifies reactor-grade economics, independent Q metrics, or customer-grade reliability.
    - Publish third-party validation of confinement, temperature, pulse length, and machine availability.
  - - China’s fusion cluster is deepening, which could help sourcing, talent, and follow-on financing.
    - Medium
    - A stronger local cluster also means Startorus does not own the China-fusion narrative and may face rapid domestic competition for capital and attention.
    - Show machine-level performance advantage or customer pull that clearly separates Startorus from Energy Singularity and other local peers.
  - - A USD 1B+ valuation is still small versus Helion, CFS, and TAE, so there is upside if Startorus executes.
    - Medium
    - Those peers bought their marks with far more capital, better disclosed milestones, or public-market liquidity paths; Startorus is earlier in the curve.
    - Hit NTST milestones on time and raise the next round without punitive dilution while broadening independent evidence.
  - - Electronics and control-product sales provide a weak signal that some spinout monetization is possible before fusion power.
    - Low-Medium
    - Those sales do not yet prove future demand for fusion electricity or industrial heat, so they should not carry the core valuation.
    - Produce letters of intent, pilot studies, or binding counterparties for future heat or power use cases.
  notes: This table contrasts strategic upside drivers with the adverse evidence that makes the current price sensitive to proof quality.
