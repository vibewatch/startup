company:
  name: Startorus Fusion
chapter:
  number: 8
  title: Valuation
  summary: Startorus Fusion’s reported unicorn valuation is understandable as a China-policy-backed option on a credible spherical-tokamak platform, but the public evidence still prices future milestones far more than present traction. Relative to disclosed funding, customer proof, and sector-wide commercialization timelines, the current mark looks stretched rather than clearly cheap.
sections:
- id: bottom-line-stance
  title: The unicorn mark prices strategic option value more than underwritten operating evidence
  body: 'Startorus has assembled a real venture case: Shanghai state-backed capital, a differentiated spherical-tokamak and HTS narrative, a visible Jiading buildout, and enough momentum to claim China’s first fusion unicorn. Those are not trivial signals. They explain why a reported valuation above USD 1 billion could happen in 2026 even though the company is still pre-revenue as a power producer. But the same evidence also defines the limit of the bull story. Public materials still point to funded engineering intent rather than independently verified reactor economics, contracted electricity demand, or a disclosed regulatory path for a future power machine. That means the right frame is scenario value, not intrinsic value from current cash flow. The market is paying for an option on NTST execution, a Q greater than 1 milestone, and China-specific policy leverage. With that lens, the right recommendation is Research More, confidence is medium, and the valuation stance is stretched rather
    than obviously irrational or obviously attractive.'
  claimRefs:
