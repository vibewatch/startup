- id: TP003
  title: Pricing / packaging comparison
  enumerationScope:
    coverage: partial
    basis: Rows compare the public contract model or commercialization package visible in retained sources as of the 2026 run date; most fusion companies do not disclose list pricing, so “unknown” is preserved where appropriate.
  columns:
  - company
  - price / unit / contract model
  - packaging / plant strategy
  - included capability
  - implication
  rows:
  - - Startorus Fusion
    - No public list price or offtake disclosed
    - Integrated future plant developer backed by Jiading base and apparatus roadmap
    - Tokamak system development, NTST installation, CTRFR-1 iteration, future demo-plant ambition
    - Commercial model is still narrative-heavy and depends on engineering milestones more than signed revenue structures
  - - CFS
    - Google agreement for 200 MW / half of ARC output; no public retail power price disclosed
    - Integrated SPARC demo leading to ARC grid-scale plant
    - HTS tokamak, demo machine, first commercial plant development
    - Most concrete tokamak commercialization signal in retained sources
  - - Helion
    - Microsoft PPA targets 50+ MW by 2028; Constellation to manage transmission
    - Direct-electricity fusion plant sold to named corporate offtaker
    - Plant construction, power-marketing structure, corporate customer benchmark
    - Most explicit private-company revenue path, even if delivery risk is high
  - - Realta
    - Initial modeled power cost of about $100/MWh with goal toward $40/MWh per TechCrunch; no signed customer disclosed
    - Compact scalable modular industrial heat and power systems
    - Magnetic-mirror plant modules and Anvil prototype design
    - Shows a smaller-scale industrial-energy wedge rather than hyperscaler-style grid offtake
  - - Tokamak Energy
    - No public list power price disclosed
    - ST40 / ST80 proof path plus future ST-E1 pilot plant and magnet business
    - Fusion pilot-plant development and HTS magnet commercialization
    - Broader business mix may diversify revenue earlier than a pure single-plant bet
  - - First Light Fusion
    - No public plant price; strategy shifted toward licensing / enabling technology
    - Technology-platform and demonstrator path rather than self-owned power plant
    - Pulsed-power and target technology that other developers could use
    - Commercial packaging is earlier but less direct as a utility-scale competitor
  - - Renaissance Fusion
    - No public price; no customer contract disclosed
    - Stellarator platform plus HTS-coil and liquid-metal technology commercialization
    - Reactor-enabling components and longer-term plant ambition
    - Could monetize components before whole plants, but scale is still far earlier than Startorus or CFS
  notes: Because fusion firms rarely publish comparable list pricing, this table uses contract structure, cost targets, and packaging posture as the closest public equivalent to pricing evidence.
