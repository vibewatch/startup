- id: TP004
  title: Moat durability / competitive risk register
  enumerationScope:
    coverage: partial
    basis: Rows isolate the highest-signal moat claims and countervailing risks affecting Startorus’s position in the global fusion field as of June 2026.
  columns:
  - moat claim
  - threat
  - severity
  - evidence
  - mitigation / diligence ask
  rows:
  - - Shanghai state capital and Jiading ecosystem support are hard to replicate quickly
    - Capital can still concentrate around companies with stronger machine proof and named customers
    - High
    - CFS, Helion, and TAE still command much larger absolute capital pools while Startorus remains pre-commercial
    - Ask whether Shanghai support is milestone-conditional and whether future rounds are pre-committed
  - - Negative-triangularity spherical-tokamak thesis could differentiate Startorus inside China
    - Energy Singularity and Tokamak Energy already show more public machine-level proof on adjacent tokamak paths
    - High
    - HH70 long-pulse record and ST40 / ST80 progress set an external proof bar that Startorus has not yet matched publicly
    - Request independently benchmarked plasma and magnet data before underwriting route superiority
  - - Tsinghua lineage and apparatus stack create technical credibility
    - Fusion timelines are still vulnerable to the same slippage ITER just publicized
    - High
    - ITER moved SRO to 2034 and DT to 2039 despite deep institutional resources
    - Demand a milestone plan that shows why Startorus can compress risk faster than public programs
  - - Integrated future-plant narrative can attract strategic capital early
    - No public offtake or customer contract means commercial demand is less validated than at CFS or Helion
    - High
    - Google and Microsoft have already signed visible structures with peers while Startorus has not
    - Ask for LOIs, pilot-partner detail, or state-backed procurement structures that validate market pull
  - - China supply-chain localization could speed execution
    - A crowded global field means capital, talent, and suppliers can still be pulled toward other winning concepts
    - Medium
    - FIA counted 53 reporting fusion companies and TechCrunch described funding-fragmentation pressure
    - Map critical suppliers, talent retention, and exclusivity around magnets, controls, and vacuum systems
  - - Raising fast can itself signal leadership
    - Rapid fundraising without benchmarkable proof can inflate expectations and narrow room for schedule slips
    - Medium
    - TechCrunch reports cracks in the sector’s funding boom and First Light has already shifted its business model
    - Underwrite Startorus on milestone velocity and proof quality, not on unicorn optics alone
  notes: Severity is an analytical judgment based on retained evidence, not a company-disclosed risk taxonomy.
