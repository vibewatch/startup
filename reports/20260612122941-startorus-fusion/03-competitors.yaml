- id: durability-and-adverse-view
  title: Startorus has real differentiation, but the moat is moderate and the proof-point deficit is still material
  body: The bullish case for Startorus is not that it already leads the world. The stronger case is that it combines a Tsinghua-rooted spherical-tokamak lineage, a negative-triangularity engineering thesis, and unusually strong Shanghai ecosystem backing for a company that is still pre-revenue. That combination is meaningful, especially relative to smaller European or U.S. entrants. The adverse case is equally clear. Energy Singularity and Tokamak Energy already show more public machine-level evidence. CFS and Helion have stronger capital scale and clearer customer-signaling. TAE remains better capitalized, and the broader sector is crowded enough that investors can keep rotating toward whichever team produces the next credible proof event. Startorus therefore looks investable as a serious second-wave contender, but not yet as the global frontrunner. The missing de-risking events are externally benchmarkable machine performance, disclosed commercialization structures, and evidence that the
    2028 milestone changes the company’s position versus peers rather than simply keeping pace with them. That gap matters because global fusion investors are increasingly choosing among several credible narratives, not funding Startorus in a vacuum.
