- id: TP001
  title: Competitor profile table
  enumerationScope:
    coverage: partial
    basis: Rows cover the most decision-relevant Chinese and global fusion peers plus ITER as the public benchmark, based on retained 2024-2026 official and independent sources visible to this run.
  columns:
  - competitor
  - category
  - scale / funding
  - target segment
  - differentiation
  - limitation
  rows:
  - - Startorus Fusion
    - Direct Chinese spherical-tokamak peer
    - RMB 1.5B raised in 2026; >RMB 2B cumulative; unicorn valuation reported
    - China-based future power-plant and fusion-development ecosystem buyers
    - Shanghai-backed negative-triangularity spherical tokamak with Tsinghua lineage
    - No public offtake, public power-price, or externally benchmarked machine-performance record in retained sources
  - - Energy Singularity
    - Direct Chinese HTS tokamak peer
    - Public milestone proof strong; precise cumulative funding not retained in reviewed sources
    - Tokamak systems, future plants, and China fusion ecosystem buyers
    - World-first all-HTS tokamak HH70 and 1,337-second pulse record
    - Commercial contracting structure and funding scale less transparent in retained public sources
  - - Commonwealth Fusion Systems
    - Global tokamak leader
    - ~$3B total funding after $863M Series B2
    - Grid-scale utility and hyperscaler power buyers
    - SPARC-to-ARC path, HTS magnets, Google-backed commercial signaling
    - Still pre-commercial and running a much heavier-capex path than Startorus narratively implies
  - - Helion
    - Compact-reactor substitute leader
    - $1.5B total; $15.5B post-money after 2026 Series G
    - Corporate offtakers seeking direct electricity supply
    - Field-reversed-configuration design plus Microsoft PPA benchmark
    - Most aggressive timeline in the set and a non-tokamak physics path with its own scale risk
  - - TAE Technologies
    - Alternative magnetic-confinement substitute
    - $1.3B+ official equity raised; ~$1.79B cited by TechCrunch
    - Long-run grid-scale clean power buyers
    - Beam-stabilized FRC and aneutronic long-term ambition
    - Still commercializing later than the boldest PPA-led narratives and pursuing a technically harder fuel thesis
  - - Tokamak Energy
    - Direct global spherical-tokamak peer
    - $335M total after 2024 $125M round
    - Fusion pilot-plant and magnet-technology customers
    - Spherical tokamak plus HTS magnet stack with ST40 and ST80 proof points
    - Much smaller capital base than CFS and no public customer commitment on Helion/CFS terms
  - - Realta Fusion
    - Compact industrial-energy substitute
    - $36M Series A plus DOE milestone backing
    - Industrial heat and modular power customers
    - Compact scalable magnetic-mirror design oriented to modular deployment
    - Earlier-stage funding and proof than the tokamak leaders
  - - First Light Fusion
    - Alternative inertial-fusion substitute
    - $108M cited by TechCrunch
    - Technology partners, defense/science users, future fusion developers
    - Projectile-based inertial fusion and willingness to monetize enabling tech first
    - No longer pursuing its own full power plant in the near term
  - - Renaissance Fusion
    - European stellarator / component entrant
    - €15M seed publicly disclosed
    - European industrial and future stellarator ecosystem partners
    - HTS coils and liquid-metal shielding wrapped around stellarator ambition
    - Funding scale is far below the lead global cohort
  - - ITER
    - Public scientific benchmark
    - State-funded international megaproject
    - Fusion-science and industrial-integration benchmark rather than private customers
    - Most advanced public proof framework for power-plant-scale integration
    - Commercial timetable is far slower than venture startup narratives
  notes: Scale rows mix disclosed cumulative funding, recent rounds, and explicit “undisclosed in retained sources” flags; unknowns are preserved instead of backfilled from memory.
