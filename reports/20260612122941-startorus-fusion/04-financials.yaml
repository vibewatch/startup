- id: funding-dependency-and-financial-verdict
  title: Funding dependency remains the decisive adverse financial issue
  body: >-
    The adverse case is that Startorus’s impressive fundraising may tempt readers to overread de-risking. Peer and sector evidence cuts the other way. Helion and CFS have each raised far more capital in absolute terms while still remaining pre-commercial and still directing new money into manufacturing, demonstrations, and future plants. Industry-wide data also show that capital is concentrated and that many companies still expect to need very large additional sums before pilot plants come online. Meanwhile, the strongest skeptical sources in this chapter argue that fusion startups are monetizing future power narratives well before fusion plants exist, that side businesses can become distractions when funding gets tight, and that governments may need to act as early customers or financing enablers because private capital alone may not carry the supply chain. For Startorus, the practical conclusion is balanced but cautious: the company probably has enough backing and political alignment to keep moving through the current apparatus-and-base phase if execution remains on schedule, but there is still no public evidence base strong enough to underwrite a self-funded path to pilot-scale commercialization. The likely next financing pressure point is before or around the 2028 engineering-validation milestone, and the main financial risks remain opacity, dilution, schedule slip, and dependence on continued state and strategic capital.
