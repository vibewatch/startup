company:
  name: Startorus Fusion
chapter:
  number: 4
  title: Financials
summary: Startorus Fusion is still a pre-revenue fusion-power developer whose 2026 financial profile is dominated by RMB 1.5 billion of fresh capital, state-backed industrial support, and only limited early equipment revenue rather than electricity sales. Public evidence suggests the company may be adequately financed for near-term facility and apparatus milestones, but not for a full pilot-plant path without more capital, more disclosure, and likely future dilution.
sections:
- id: revenue-reality-and-emerging-monetization
  title: Revenue reality — no fusion-power revenue yet, with only limited early monetization visible
  body: >-
    The first financial conclusion is negative but important: Startorus does not yet look like a revenue-producing fusion-power company. Official company materials and the reviewed independent coverage still center on engineering milestones, site buildout, and future demonstration targets rather than delivered electricity sales. The roadmap keeps the core value-creation event in engineering verification around 2028 and a power-exporting demonstration facility in the early 2030s, which means investors in 2026 are still underwriting an R&D-and-capex story rather than a mature commercial utility model. Public materials also do not disclose named utility offtakers, power prices, backlog, recognized revenue, gross margin, or customer concentration for the core reactor business. The cleanest treatment is therefore to classify Startorus as pre-revenue on fusion electricity, even though it is no longer a pure lab project.
  claimRefs:
