- id: capital-stack-burn-and-runway
  title: Capital stack, burn, and runway are directionally supportable but still estimate-heavy
  body: >-
    Startorus’s real 2026 financial story is capital formation. The company closed a RMB 1 billion Series A in January 2026 and a RMB 500 million A+ in May 2026, taking cumulative disclosed financing above RMB 2 billion. Those rounds were tightly linked to Shanghai and Jiading industrial-policy execution: reviewed official sources tie the money directly to the Jiading experimental base, NTST installation, CTRFR-1 engineering work, fusion-grade HTS magnets, and AI plasma-control systems. That is strategically positive because the capital is aligned with concrete hardware milestones rather than generic corporate overhead. It also means the company is inherently capital-intensive. A 25-mu, 50,000-square-meter base, a 140-plus technical team, apparatus construction, and magnet manufacturing imply a burn profile far above salary alone. Using the publicly visible staffing range plus explicit deep-tech compensation assumptions, salary cost alone plausibly lands in the tens of millions of renminbi per year; once facilities, magnets, procurement, and test operations are layered on, a working burn range of roughly RMB 240 million to RMB 480 million annually appears reasonable enough for scenario analysis, but it is still an estimate rather than reported company guidance.
