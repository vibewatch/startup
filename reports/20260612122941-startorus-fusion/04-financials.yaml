- id: TI005
  title: Public financial gaps table
  enumerationScope:
    coverage: partial
    basis: Rows isolate the highest-signal missing private metrics that stop investors from underwriting Startorus with normal growth-equity confidence.
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Current cash balance and monthly cash bridge
    - Runway remains scenario-based and dilution timing is uncertain
    - Request the latest management accounts, cash waterfall, and restricted-cash schedule
  - - Recognized revenue and gross margin by product line
    - Early commercialization may be overstated or underappreciated
    - Request monthly revenue detail, customer concentration, and gross-margin bridge by product
  - - Cost-to-complete for Jiading base, NTST, and CTRFR-1
    - Investors cannot tell whether the current war chest is enough to hit 2028 milestones
    - Request board-approved capex budget, supplier contracts, and contingency assumptions
  - - Grant, subsidy, and tax-incentive ledger
    - Government support is visible but its cash value is opaque
    - Request signed subsidy documents, tax rebates, and land-use concessions
  - - Debt, vendor finance, or municipal credit support
    - Unknown leverage could alter dilution and downside risk
    - Request debt schedule, covenants, guarantees, and off-balance-sheet obligations
  - - Cap table economics and governance rights
    - State-heavy capital can reshape control and future financing flexibility
    - Request investor rights agreement, board composition, protective provisions, and liquidation preferences
  - - Named pilot customers or industrial LOIs
    - No public demand proof yet links the hardware roadmap to bankable future revenue
    - Request LOIs, MOUs with commercial economics, or procurement structures
  notes: These are not generic asks; each missing metric directly changes the underwriting of runway, dilution, or future revenue quality.
