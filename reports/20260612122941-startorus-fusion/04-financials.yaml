- id: ancillary-revenue-and-unit-economics
  title: Ancillary revenue exists, but public unit economics are still largely absent
  body: >-
    The positive counterpoint is that Startorus has at least the outline of pre-power monetization. Its May 2026 A+ announcement says Startorus Electronics already sells electrical and electronic products to universities and research institutions, while Jiemian reports early revenue from research institutions and industrial customers through fusion-related electronics and power-control equipment. That matters because it separates Startorus from a company with literally zero customer contact. But the available evidence still points to a small, adjunct business line rather than a revenue base that can carry a fusion-reactor company. No public sources reviewed for this chapter disclose list prices, average selling prices, contract values, gross margin, recurring-service revenue, or the share of total company costs covered by those sales. In practice, the early monetization story should therefore be treated as evidence of ecosystem fit and engineering commercialization optionality, not as proof that the company has solved its financial model.
