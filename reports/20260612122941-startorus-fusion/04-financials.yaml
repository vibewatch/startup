- id: TI002
  title: Pricing / monetization table
  enumerationScope:
    coverage: partial
    basis: Public sources do not disclose a complete pricing card, so rows focus on visible monetization surfaces and preserve unknowns instead of guessing realized pricing.
  columns:
  - Price / unit / contract
  - List vs realized pricing
  - Discounts / unknowns
  - Source
  - Implication
  rows:
  - - Fusion electricity offtake pricing
    - No public list or realized price
    - Unknown customer economics, penalties, and escalation terms
    - Official Startorus roadmap pages plus reviewed media
    - Core power-business valuation cannot be revenue-modeled from public data
  - - Startorus Electronics instrumentation
    - No public list price
    - Unknown ASP, volume discounts, and customer concentration
    - A+ announcement and Jiemian reporting
    - Ancillary revenue exists, but margin quality remains opaque
  - - Research / engineering support contracts
    - No public contract values
    - Unknown milestone billing and deliverable acceptance rules
    - Jiading / Shanghai support disclosures
    - Partnership visibility does not equal bankable revenue quality
  - - Potential HTS magnet or subsystem sales
    - No public unit pricing
    - Unknown whether capability is internal-only or sold externally at scale
    - Official product and planning disclosures plus patent filings
    - Component-business optionality exists but is not underwritten
  - - 'Comparator lens: Helion PPA / Tokamak magnet business'
    - Peers disclose structure but not always realized pricing
    - Benchmarks are directional, not transferable to Startorus
    - Helion and Tokamak public announcements
    - Shows how fusion companies monetize before full plant operation without proving Startorus economics
  notes: Because Startorus does not publish a commercial price book, this exhibit uses monetization structure as the public equivalent of pricing evidence.
