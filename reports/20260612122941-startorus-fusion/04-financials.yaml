tables:
- id: TI001
  title: Revenue streams table
  enumerationScope:
    coverage: partial
    basis: Rows cover only publicly evidenced current or plausible near-term monetization paths visible in reviewed 2025-2026 sources; private internal projects, undisclosed grants, and confidential customer contracts are not backfilled.
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Fusion electricity sales
    - Sale of generated electricity or power capacity
    - MWh / MW offtake
    - No public current revenue; demo-power timing still framed for early 2030s
    - Low for current revenue, high for long-term strategic intent
    - Request any LOIs, PPAs, pricing assumptions, and interconnection or siting documents
  - - Startorus Electronics product sales
    - Instrumentation, power electronics, and related equipment sold to universities and research institutions
    - Per unit / per project
    - Officially disclosed as already sold, but revenue amount undisclosed
    - Medium for existence, low for scale
    - Request product-line revenue, gross margin, repeat-order rate, and top customers
  - - Research or engineering partnerships
    - Institutional collaboration tied to Jiading, Tsinghua, or other research programs
    - Per contract / milestone
    - Partnership structure is visible; economics are not public
    - Low for revenue value
    - Request contract values, milestone schedules, and revenue-recognition policy
  - - Potential HTS magnet or subsystem sales
    - Component sales or technical cooperation around fusion-grade magnets and control systems
    - Per component / program
    - Capability and possible cooperation are disclosed; signed commercial scale not public
    - Low to medium
    - Ask for pipeline, named counterparties, and expected contribution margin
  - - Government support and project facilitation
    - Land, policy, project-priority treatment, and possible subsidy channels
    - Project support package
    - Support is clearly visible, but cash subsidy amounts are undisclosed
    - Medium for existence, low for monetary value
    - Request grant ledger, land terms, milestone subsidies, and tax incentives
  - - Future pilot-plant collaborations
    - Long-dated demo or pilot development relationships before power sales
    - Per pilot / consortium
    - No named commercial counterparties disclosed yet
    - Low
    - Ask for industrial partners, pilot sponsors, or state procurement structures
  notes: This table deliberately separates disclosed existence of a monetization path from proof of its scale. Current value / status often reflects the absence of disclosed financial detail rather than the absence of activity.
