  productSummary: >-
    Compact spherical-tokamak reactor platform using HTS magnets and magnetic-reconnection heating,
    with SUNIST-2 as the current validation lineage, NTST as the next engineering step, and
    CTRFR-1 as the larger follow-on machine toward engineering verification and later power-demo
    deployment.
  customerFocus: >-
    Near-term users are research institutions and industrial buyers of electronics, diagnostics,
    power-control, and related fusion subsystems; long-term target customers are future utility,
    industrial, and other high-load buyers of fusion-generated electricity.
  businessModel: >-
