      - number: '3.3'
        title: Capital concentration and commercialization structure favor the best-funded teams, but geography still matters
        blocks:
          - type: paragraph
            body: >-
              The most important competitive split in 2026 is not just physics; it is who has enough capital and partner
              structure to survive the long engineering march. CFS, Helion, and TAE sit in the top global funding tier,
              while Tokamak Energy, Realta, First Light, Renaissance, and Proxima represent smaller but still serious
              bets with sharper strategic focus. Startorus has become a standout Chinese contender because Shanghai
              state capital and Jiading industrial-policy support compressed two very large rounds into one year, while
              Energy Singularity shows that China can also produce visible hardware milestones. Commercial models differ
              materially. CFS and Helion already market future power output through named counterparties. Realta
              emphasizes modular industrial heat and power. First Light has moved toward monetizing enabling technology
              rather than owning a full plant. Renaissance similarly highlights component and reactor-enabling
              technologies. Startorus, by contrast, still reads as an integrated future plant developer whose near-term
