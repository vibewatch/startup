  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold to watch
      - Why it breaks the thesis
      - Action implication
    rows:
      - - NTST schedule slip
        - Installation or rated-parameter milestones miss 2026-2027 targets by a wide margin
        - The company’s premium depends on visible machine progress compressing the path to later milestones.
        - Re-cut the scenario range toward the bear case and assume more dilution.
      - - Weak follow-on financing
        - Next financing round prices below the current unicorn mark or carries heavy downside protection
        - A lower-priced round would reveal that strategic capital no longer accepts the implied option value.
        - Treat the current mark as non-durable and reassess ownership economics.
      - - Independent technical diligence disappoints
        - External review cannot validate claimed performance, or key metrics remain unpublished
        - The bull case needs proof quality to improve, not just capital availability.
        - Move stance from Research More toward Avoid until proof quality recovers.
      - - China permitting path stays opaque
        - No credible licensing or environmental map emerges as machines scale
        - Timeline and capex assumptions become too soft to underwrite.
        - Increase discount rate and defer any new capital decision.
      - - No future power customers emerge
        - Commercial dialogue remains limited to electronics products or generic TAM language
        - The valuation remains a science-and-policy option with no customer pull.
        - Do not pay a premium multiple for market readiness.
      - - Peer proof outpaces Startorus
        - Domestic or global peers deliver stronger validated machine milestones first
        - Relative scarcity value falls quickly in frontier-energy markets.
        - Re-rate Startorus as a follower rather than a platform leader.
    notes: These triggers are chosen for direct transmission to valuation rather than for generic operating risk coverage.
    claimRefs:
      - CV005
      - CV006
      - CV028
      - CV039
      - CV043
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Cap table and preferences
        - Latest ownership table, liquidation stack, anti-dilution, and investor rights from 2026 rounds
        - Scenario value can look acceptable while common-equity outcomes are still poor.
        - Company CFO / lead investors / counsel room.
      - - 2027-2032 financing plan
        - Detailed build budget, burn profile, and financing assumptions through NTST and successor machines
        - The unicorn mark is sensitive to how many more rounds are required before a bankable plant case exists.
        - Management model review plus board materials.
      - - Independent machine validation
        - Third-party review of confinement, temperature, pulse duration, availability, and any Q-style targets
        - The technical proof gap is the single biggest reason the current valuation is not yet underwritten.
        - External technical advisor and lab-quality test package.
      - - China licensing path
        - Environmental, radiation, tritium, and site-approval roadmap by machine generation
        - Permitting could dominate timeline once the company leaves pure R&D mode.
        - Regulatory counsel plus company permitting lead.
      - - Future customer demand
        - Letters of intent, utility studies, data-center heat or power discussions, and target use cases
        - A power valuation needs eventual buyer evidence, not just investor enthusiasm.
        - Commercial lead and counterparties.
      - - Preference for follow-on capital sources
        - Evidence on whether future funding is expected from state funds, strategic industrials, or financial investors
        - Who writes the next checks affects pricing discipline, governance, and exit paths.
        - Board chair / lead investors / financing plan memo.
    notes: >-
      Every diligence ask maps directly to one of the unresolved conversion points between a credible science project
      and a financeable infrastructure story.
    claimRefs:
      - CV037
      - CV039
      - CV044
      - CV046
