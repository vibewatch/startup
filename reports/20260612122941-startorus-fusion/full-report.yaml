  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The field is crowded across direct spherical-tokamak peers, compact-reactor substitutes, and public benchmarks
        blocks:
          - type: paragraph
            body: >-
              Startorus does not compete in a tidy one-company lane. Its most direct private peers are other compact
              magnetic-confinement teams that promise smaller or faster-to-build reactors, especially Energy Singularity
              inside China and Tokamak Energy abroad. Commonwealth Fusion Systems belongs in the same serious tokamak
              set even though its machine is larger and better capitalized, because it is chasing the same end state of
              grid-scale commercial power with HTS magnets. Helion, TAE, and Realta are not tokamaks, but they are still
              real substitutes for the same future firm-clean-power and industrial-energy budgets. First Light,
              Renaissance Fusion, and Proxima widen the competitive envelope further by showing that investors are also
              backing inertial and stellarator routes. ITER should be treated differently: it is not a venture
              competitor for customers today, but it remains the public scientific benchmark that shapes what counts as
              credible proof in fusion.
