      - number: '7.2'
        title: >-
          Regulation, export controls, and fuel-cycle constraints are still open workstreams rather than solved
          prerequisites
        blocks:
          - type: paragraph
            body: >-
              The regulatory story for fusion is improving in the abstract, but that does not mean Startorus has a
              de-risked approval path. The 2026 NRC proposal is useful context because it shows what a serious regulator
              thinks an early fusion licensing package must address: radiation safety, tritium handling, waste,
              emergency procedures, environmental review, and documentation that can be reviewed by both federal and
              state authorities. Law-firm analysis of the same rule also makes clear that export-control questions are
              not gone merely because fusion is not regulated like fission; fusion machines remain in a dual-use
              ecosystem under Commerce rules, and the NRC explicitly asked whether additional fusion-specific export
              controls should exist later. For a China-based developer like Startorus, that matters in two directions.
              Cross-border collaboration can trigger end-user and technology-transfer scrutiny, while China’s own
              2025-2026 rare-earth controls create procurement and compliance risk around magnet-intensive supply
              chains. The fuel-cycle issue is even harder. Official and quasi-official sector sources repeatedly say
              that tritium availability, lithium-6, and waste or activation management are among the least solved
              commercial-fusion bottlenecks. Public Startorus materials describe financing, facilities, and machine
              ambition, but they do not yet disclose a reactor-specific licensing sequence, tritium strategy, or
              activated-material disposal pathway. That gap does not prove failure; it does mean regulatory and
              fuel-cycle diligence remains a major unresolved gating item.
            claimRefs:
