            body: >-
              The company's own materials point first to large-scale power stations, distributed power stations,
              offshore or deep-sea platforms, and large-vessel propulsion. Those are plausible because Startorus is
              pitching a compact, high-power-density spherical-tokamak architecture and because some strategic partners
              have adjacent maritime or equipment exposure. Beyond those company-stated targets, the broader 2026 fusion
              market shows where anchor demand is likely to appear first: hyperscalers and data-center operators that
              want always-on clean power, plus industrial users with large steady loads. Google's 200 MW commitment to
              Commonwealth Fusion Systems and Microsoft's earlier Helion agreement are important external proof that
              sophisticated buyers will sign pre-delivery fusion contracts when the developer looks credible enough. The
              IEA data-center demand backdrop makes that interest understandable. Even so, Startorus has not publicly
              named a utility, hyperscaler, or heavy-industry power buyer of its own. Hydrogen, ammonia, and
              steel-adjacent buyers also matter strategically because DOE's hydrogen materials show how large industrial
              clean-power demand could become, but Startorus has not yet published a customer-specific go-to-market
              motion for those segments. For now, the segment thesis is stronger than the company-specific pipeline.
