companyProfile:
  summary: >-
    Startorus Fusion is a Tsinghua-rooted Chinese fusion company founded in 2021 to commercialize a compact
    spherical-tokamak approach. The company now operates with Shanghai Jiading as its visible execution center while
    still retaining a legacy Xi'an footprint in public materials. Its core proposition combines HTS magnets and
    magnetic-reconnection heating with a staged apparatus roadmap from SUNIST-2 to NTST and CTRFR-1. In 2026, Startorus
    raised a RMB 1.0 billion Series A and a RMB 0.5 billion A+ that pushed cumulative disclosed funding above RMB 2.0
    billion and public valuation above USD 1 billion. Even so, the business remains pre-revenue on fusion-power sales,
    with only limited early revenue disclosed from electronics and power-control products sold to research and
    industrial users.
