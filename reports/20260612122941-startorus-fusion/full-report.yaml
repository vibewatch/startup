      - number: '2.2'
        title: Commercialization timing and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The 2026 fusion market is best sized through timing and financing lenses rather than one generic TAM
              number. Public and quasi-public evidence supports a large capital wave: the F4E Fusion Observatory says
              tracked private-sector funding jumped to EUR 13 billion by late 2025, with 77 companies identified and
              China already representing 34 percent of tracked funding despite only eight companies. Yet that capital
              wave does not settle commercialization timing. ITER still presents fusion as a feasibility project rather
              than a power plant and keeps deuterium-tritium operation on a 2035 schedule, while DOE's 2026 roadmap
              frames U.S. pilot and commercial power ambitions around the mid-2030s. Against that, Helion and other
              private companies market late-2020s or early-2030s delivery narratives, and Startorus itself is reported
              as targeting technical verification by 2028 and a pilot plant by 2032. The correct market conclusion is
              therefore a wide commercialization range: early contracts can be signed now, but routine grid-relevant
              electricity sales remain far less proven than the funding headlines suggest.
