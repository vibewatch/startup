          system
        blocks:
          - type: paragraph
            body: >-
              There are some encouraging signals on engineering discipline. Startorus's Feishu case study shows a
              company trying to industrialize itself through task tracking, procurement workflows, and parameter
              knowledge management rather than relying only on lab heroics. The public hiring portal likewise suggests a
              formal recruiting process that can support organizational growth. On the machine side, lithium coating,
              impurity reduction, and expanded diagnostics show that the team is working through standard plasma-quality
              and operations problems in a credible way. But these signals are not substitutes for formal trust
              disclosures. Retained public sources do not show an independent safety audit, a disclosed fusion-specific
              licensing path, or a published software-quality framework for the control stack. Nor do they disclose many
              of the parameters that outside investors would need to really underwrite machine readiness, including
              pulse length, duty cycle, cryogenic loads, achieved Q, neutron output, or a full CTRFR-1 specification. In
              other words, the company has visible engineering process, but not yet the public transparency package that
