      nodes:
        - label: Induce two plasma rings
          detail: PF coils and startup systems create dual rings in the spherical tokamak
        - label: Push rings together
          detail: Axial-field control drives the rings toward reconnection at the equatorial plane
        - label: Heat through reconnection
          detail: Magnetic energy converts into plasma internal energy during merging
        - label: Sustain current
          detail: Central solenoid supports the merged high-temperature plasma
        - label: Measure and diagnose
          detail: Synchronized diagnostics, anomaly detection, and parameter capture instrument the shot
        - label: Update controls and hardware
          detail: Task boards, parameter knowledge base, and subsystem engineering feed the next iteration
