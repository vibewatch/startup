            body: >-
              Startorus is not yet selling fusion electricity, so the most concrete way to define the product in 2026 is
              as a reactor-development stack with a small but real hardware surface around it. Public materials show two
              layers. The first is the future reactor path: high-field spherical tokamaks, negative-triangularity NTST,
              and later fusion-grade devices intended to turn plasma milestones into a commercial plant program. The
              second is immediately visible instrumentation and control hardware such as isolation amplifiers, analog
              integrators, and the CoaxLink Nano acquisition device for plasma diagnostics and HTS-magnet monitoring.
              That matters because it shows Startorus acting less like a single academic prototype and more like a
              vertically integrated engineering shop that already builds some of the diagnostic and control plumbing
              around its machines. The limit is just as important: none of these public products change the fact that
              the economic thesis still rests on future reactor success, not on a disclosed current revenue engine. The
              core technical bet is a compact HTS spherical tokamak using repetitive magnetic-reconnection heating,
