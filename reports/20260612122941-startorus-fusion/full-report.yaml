  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Illustrative valuation drivers showing which variables matter most to Startorus around the current unicorn mark.
    data:
      items:
        - label: Independent plasma proof improves
          value: 0.6
          note: Could add roughly USD 0.6B of present value by making the base case more credible.
        - label: Clear China permitting path disclosed
          value: 0.2
          note: Reduces timeline discount and infrastructure risk.
        - label: Customer-backed power or heat demand emerges
          value: 0.4
          note: Moves the story from generic TAM to buyer-anchored commercialization.
        - label: Next round below unicorn mark
          value: -0.5
          note: Would directly reset the market-clearing price lower.
        - label: NTST milestone slips by 12 months+
          value: -0.4
          note: Pushes the platform toward the bear path because funding need arrives before proof.
        - label: State-backed capital remains abundant
          value: 0.3
          note: Supports runway even before commercial proof exists.
    approximationNotes: Dollar effects are analytical sensitivities, not negotiated term-sheet outcomes.
