              What public evidence does show is a real but narrow customer-proxy surface. Startorus's 2026 funding
              materials say Startorus Electronics has already sold products to universities and research institutions,
              while Tencent's January 2026 profile adds that the company has formed complete signal-conditioning,
              acquisition, pulsed-power, and diagnostics product lines that are drawing attention in nuclear power,
              aerospace, and high-energy-physics contexts, with multiple cooperation agreements and development or
              processing agreements tied to its HTS magnet stack. Tsinghua University remains the clearest named
              user-side counterparty because SUNIST-2 was developed in collaboration with Tsinghua and still anchors
              Startorus's machine lineage. Jiading district is the clearest government counterparty: it signed the
              project landing agreement, elevated the Shanghai base into a 2026 major project, and publicly committed
              land, policy, and project support. Industrial investors also signal future counterparties rather than
              current demand. Deye explicitly markets offshore platforms and vessel propulsion as future application
              scenarios, while CIMC HuanKe says it invested RMB 30 million, holds only a small stake, and wants to
              become a core supplier while exploring specialized fusion equipment. These are useful validation signals,
              but they are still ecosystem proof, not bankable electricity demand proof.
