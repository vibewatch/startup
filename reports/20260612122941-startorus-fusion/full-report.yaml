  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The core risk is cumulative schedule slippage, not a single fatal flaw
        blocks:
          - type: paragraph
            body: >-
              Startorus now has enough public momentum that the right adverse question is no longer whether the company
              exists or can raise money; it is whether enough independent bottlenecks can be closed on the company’s
              stated timeline. The company has raised over RMB 2 billion, secured Jiading government support, and
              publicly mapped a path from SUNIST-2 to NTST and then to a power-producing demonstration reactor. Those
              are real strengths. They also create a more exacting burden of proof because each milestone now depends on
              synchronized progress in machine integration, materials, magnets, cryogenics, tritium or fuel-cycle
              planning, regulatory preparation, and specialist hiring. Official U.S. and congressional fusion sources
              still describe the sector as facing unresolved scientific, engineering, fuel-cycle, and permitting gaps
              even for the best-funded developers. Adverse sector examples reinforce the same point from the market
              side: when timelines stretch, fusion startups do not fail neatly on one physics result; they get squeezed
              by funding terms, side-business pivots, workforce cuts, or project resets. For Startorus, that makes
              schedule risk the organizing lens for the whole chapter. If NTST integration, supplier delivery, or
              licensing preparation slips, the impact is not isolated. It can weaken partner confidence, complicate
              follow-on financing, and postpone the first moment when outside investors can test the company’s claims
              against reactor-grade evidence rather than roadmap language.
            claimRefs:
