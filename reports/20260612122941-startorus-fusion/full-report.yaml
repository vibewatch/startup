  - id: FE002
    title: Operating flow from startup coils to engineering iteration
    type: flow
    layout: wide
    summary: How Startorus describes a shot cycle and the engineering loop around it.
    approximationNotes: The flow condenses multiple sources into one operating narrative and is not a direct company graphic.
    claimRefs:
      - CE007
      - CE009
      - CE016
      - CE017
      - CE023
      - CE040
