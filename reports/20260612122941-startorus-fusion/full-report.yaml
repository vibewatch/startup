chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origin, and Technical Route
        blocks:
          - type: paragraph
            body: >-
              Startorus Fusion is now one of the most visible private fusion companies in China, but its identity is
              best understood as a commercialization wrapper around a long-running Tsinghua University spherical-tokamak
              research lineage rather than as a conventional software-style startup. Official company pages say the team
              comes largely from Tsinghua University's Department of Engineering Physics and has spent more than two
              decades operating China's first spherical tokamak, SUNIST. Public English and Chinese materials also show
              the company balancing two narratives at once: a deep-tech institutional origin rooted in Tsinghua's fusion
              laboratory and a faster-moving venture-backed operating company trying to compress apparatus iteration
              cycles from decades to a few years.


              The technical route is a compact spherical tokamak architecture using high-temperature superconducting
              magnets and magnetic-reconnection heating. Startorus argues this route can make fusion devices smaller and
              structurally simpler than conventional tokamak programs that rely on more cumbersome heating systems. That
              claim fits the company's broader commercialization pitch: lower build cost, faster iteration, and
              applicability not just to grid-scale plants but eventually to more compact high-integration settings.
              Independent spherical-tokamak literature is directionally supportive of the architecture's promise, but it
              does not remove the engineering burden. The evidence therefore supports treating Startorus as a
              technically differentiated fusion developer with a credible research heritage, while still recognizing
              that its promised economic advantage remains a forward-looking company thesis rather than a proven
              commercial outcome.
            claimRefs:
              - CO001
              - CO002
