  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and firm-clean-power demand context
        blocks:
          - type: paragraph
            body: >-
              Startorus Fusion should not be underwritten against the whole future electricity system. The broad
              backdrop is real: official 2026 energy sources show that electricity demand is still rising, that
              electrification and data-center growth are strengthening demand for reliable low-carbon supply, and that
              planners increasingly care about system flexibility and firm power. But the included spend relevant to
              Startorus in 2026 is much narrower than the eventual multi-trillion-dollar power market. The real
              near-term market is the fusion-development stack: research facilities, pilot-device engineering,
              high-performance components, AI and controls, milestone-funded design work, and government-backed
              experimental bases. Long-duration storage, advanced fission, geothermal, gas with carbon capture, and
              ordinary grid capex remain substitutes or adjacent budgets competing for the same future firm-clean-power
              problem. That boundary matters because it keeps the chapter from translating broad energy-transition
              demand directly into near-term Startorus revenue.
