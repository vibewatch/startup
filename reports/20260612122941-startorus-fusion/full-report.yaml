      - number: '2.4'
        title: Near-term revenue pathways and underwriting implications
        blocks:
          - type: paragraph
            body: >-
              That ecosystem suggests a staged market path for Startorus. The most concrete 2026 buyers are not retail
              electricity customers or even utilities buying delivered fusion power; they are governments funding bases,
              national labs and institutes buying capability, strategic investors backing devices, and industrial
              partners helping stand up a supply chain. DOE's milestone-program expansion shows how public-private
              development contracts can become an actual market category before energy sales exist, and Helion's
              Microsoft agreement shows that long-dated electricity offtake structures can be sold before plants
              operate. Startorus's likely near-term commercial market therefore consists of research partnerships,
              milestone-style institutional programs, engineering contracts, component procurement, and eventually
              demonstration-plant collaborations. The long-term prize is electricity licensing or sales into a much
              larger firm-clean-power market, but the adverse view has to remain visible: Belfer and MIT Technology
              Review both argue that investor enthusiasm can outrun the still-unproven path from experimental success to
              repeatable, economical, grid-ready fusion power. For underwriting, the implication is simple: value
              near-term ecosystem participation more heavily than near-term power-sales claims.
