      - number: '8.3'
        title: China-specific support helps the floor, but commercialization distance still drives the range
        blocks:
          - type: paragraph
            body: >-
              China changes the downside and upside in opposite directions. On the supportive side, Shanghai has clearly
              chosen fusion as an industrial priority, and Startorus has already shown it can attract state-linked
              capital, land, and supplier attention faster than most Western startups can. Energy Singularity’s 2026
              funding and machine progress also suggest Startorus is not trying to build alone in a vacuum; there is now
              a genuine local ecosystem. That lowers near-term financing-access risk and makes the company easier to
              keep alive through multiple machine generations. Yet the same context can weaken market discipline because
              strategic backers may tolerate longer timelines and thinner disclosure than pure financial investors.
              Public evidence still lacks the items that matter most for valuation conversion: cap-table terms,
              independent machine data, a China-specific approval path, and customer-backed demand for actual fusion
              output. The scenario range therefore stays wide. Bull value requires on-time NTST execution and later
              proof that the roadmap compresses into the early 2030s. Base value assumes the platform keeps moving but
              remains a funded R&D story. Bear value assumes milestone slippage and a lower-priced follow-on round.
