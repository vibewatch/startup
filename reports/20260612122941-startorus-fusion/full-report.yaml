      - number: '3.2'
        title: Reactor approach and milestone proof already separate leaders from narrative-heavy challengers
        blocks:
          - type: paragraph
            body: >-
              Startorus markets a spherical-tokamak route with magnetic-reconnection heating, a Jiading apparatus stack,
              and an aggressive 2028 engineering-verification plus 2032 power-demo storyline. That is credible enough to
              matter, but the proof burden rises when benchmarked against peers. Energy Singularity already points to
              HH70 first plasma, all-HTS construction, and a 1,337-second steady-state pulse. Tokamak Energy has public
              ST40 performance records and an ST80 facility build at Culham. CFS has the deepest tokamak capital base
              and a public SPARC-to-ARC sequence. Helion has a customer-facing PPA timeline, while Realta has DOE
              milestone backing for a modular magnetic-mirror path. ITER, despite its slower public schedule, is still a
              reminder that fusion timelines stretch when hardware, materials, and integration move from concept to
              full-system execution. Against that set, Startorus still looks earlier and less externally benchmarked
              than the global leaders.
