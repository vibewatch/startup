tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Startorus
  rows:
  - - Firm clean power problem backdrop
    - Rising demand for reliable low-carbon electricity and system flexibility
    - The entire electricity market or all generation capex
    - Governments, grid planners, utilities, large power users
    - Explains why fusion matters strategically but does not equal near-term Startorus revenue
  - - Fusion R&D and test infrastructure
    - Tokamaks, test stands, magnets, controls, diagnostics, AI tooling, and engineering services
    - General scientific funding unrelated to fusion hardware or commercialization
    - National labs, universities, local governments, state vehicles
    - Most credible current commercial wedge for Chinese fusion startups
  - - Pilot-plant development programs
    - Milestone contracts, design studies, siting, licensing preparation, component qualification
    - Mature merchant power revenues
    - Public-private programs, strategic investors, development partners
    - Fits DOE-style programs and likely Chinese equivalents before power sales
  - - Future electricity licensing / sales
    - Long-dated PPAs, plant licensing, regulated generation revenue, corporate clean-power supply
    - Conventional generation revenues from non-fusion assets
    - Utilities, large corporates, power marketers, industrial buyers
    - Large eventual prize but not yet de-risked for 2026 underwriting
  - - Adjacent or substitute technologies
    - Advanced fission, geothermal, long-duration storage, gas plus CCS, grid flexibility tools
    - N/A
    - The same buyers as above
    - These technologies compete for the same future firm-clean-power budget and can delay fusion adoption
  notes: The table separates the long-run electricity problem from the much narrower 2026 monetizable market for fusion-development
    activity.
