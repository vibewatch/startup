- id: FM002
  title: Market estimate range
  type: range
  layout: standard
  summary: Range of calendar years for first commercially meaningful fusion electricity sales, preserving the gap between
    optimistic company narratives and skeptical expert views.
  data:
    items:
    - label: Aggressive company-sales view
      low: 2028
      mid: 2030
      high: 2032
      displayValue: 2028-2032
      detail: Anchored on Helion’s 2028 target and Startorus reporting around 2028 verification / 2032 pilot timing.
      tone: positive
    - label: Public-roadmap pilot window
      low: 2033
      mid: 2035
      high: 2037
      displayValue: mid-2030s
      detail: Anchored on DOE’s mid-2030s commercialization roadmap and ITER’s 2035 deuterium-tritium schedule.
      tone: neutral
    - label: Skeptical expert commercialization window
      low: 2040
      mid: 2045
      high: 2050
      displayValue: 2040-2050
      detail: Reflects Belfer and MIT Technology Review caution that funding and announcements are well ahead of proven grid-ready
        fusion plants.
      tone: warning
  approximationNotes: Each band represents a source-backed timing narrative, not a probabilistic forecast. The point is to
    preserve disagreement rather than force consensus.
