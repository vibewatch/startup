  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: startorus-commercial-pipeline
    missingEvidence: Public sources do not show Startorus-specific backlog, paid partnership revenue, component sales, or
      contracted milestone awards.
    whyItMatters: Without those data, investors cannot distinguish ecosystem visibility from monetized commercial traction.
    diligencePath: Request a pipeline table covering research partnerships, signed engineering contracts, grant awards, backlog
      value, and conversion from funded R&D to revenue.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: fusion-electricity-economics
    missingEvidence: Source-backed cost curves, licensing milestones, and plant-level reliability assumptions for first commercial
      fusion power plants remain absent from the public chapter record.
    whyItMatters: Those inputs are required before underwriting merchant or contracted electricity revenue in any base case.
    diligencePath: Obtain management's assumed LCOE, capacity factor, outage model, fuel-cycle assumptions, and regulatory
      workplan for the first pilot and first commercial plant.
    relatedQuestionRefs:
    - QM025
  - type: conflicting-data
    severity: material
    topic: commercialization-timing
    missingEvidence: Public sources preserve a wide gap between aggressive company timelines and skeptical expert views, but
      do not reconcile which prerequisite milestones should dominate valuation.
    whyItMatters: Timing assumptions drive discount rate, terminal value credibility, and how much present value should be
      assigned to power-sales scenarios.
    diligencePath: Map each company timeline to explicit technical, regulatory, and supply-chain gates and test management
      against those gates rather than against calendar claims alone.
    relatedQuestionRefs:
    - QM021
    - QM025
    relatedTableRefs:
    - TM002
    - TM004
