- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Electricity-demand growth and AI-led load growth
    - Growth driver
    - Current / structural
    - Rising need for reliable clean power keeps fusion strategically relevant even before revenue proof
    - Identify which customer segments explicitly value firm zero-carbon power over intermittency
  - - State industrial policy and strategic funding
    - Growth driver
    - Current / medium term
    - China and the U.S. are both using public tools to build fusion ecosystems and supply chains
    - Separate durable programmatic support from one-off local subsidies
  - - Milestone-based public-private programs
    - Growth driver
    - Current / medium term
    - Development contracts can create real revenue pathways before power sales exist
    - Ask which Chinese or cross-border programs could resemble DOE-style milestone funding
  - - Public-project timelines remain long
    - Constraint
    - Current / structural
    - ITER and other public programs still imply that commercial electricity is not imminent
    - Map what technical milestones must be cleared before any licensing or offtake assumption enters the base case
  - - Economics and engineering are still unproven
    - Constraint
    - Current / structural
    - Capital markets can run ahead of tritium, materials, reliability, and cost proof
    - Request levelized-cost assumptions, component sourcing plans, and maintenance expectations
  - - Hype-cycle risk in funding and offtake announcements
    - Constraint
    - Current / cyclical
    - Press releases and power contracts may overstate near-term commercial readiness
    - Stress-test the plan against slippage to the late 2030s or 2040s
  notes: 'The key underwriting issue is timing: the strategic market is large, but monetization still has to progress through
    long engineering and institutional gates.'
