- id: china-policy-and-ecosystem-support
  title: China policy and ecosystem support
  body: 'China''s policy and ecosystem context materially improve Startorus''s odds of staying funded and institutionally
    connected, even though they do not eliminate engineering risk. Central-government 2026 policy messaging emphasizes innovation-driven
    growth, strategic industries, and stronger investment support, while cross-cutting analyses of the new Five-Year Plan
    emphasize self-reliance and industrial upgrading. In fusion specifically, China has moved beyond isolated laboratory work.
    The IPP/CAS CRAFT and CFETR program gives a formal bridge from ITER participation toward domestic engineering-test and
    eventual power-generation objectives, while Global Times reports BEST moving toward late-2027 completion for burning-plasma
    experiments. At the commercial layer, Shanghai and Jiading are emerging as a local fusion cluster: Jiemian reports that
    Startorus won state-led capital, signed a Jiading cooperation agreement, and plugged into a broader supply-chain buildout.
    SCMP''s reporting on China Fusion Energy Inc reinforces the same point at national scale: China is deliberately coordinating
    a fusion ecosystem in which state vehicles, labs, local governments, and startups all play roles.'
  claimRefs:
