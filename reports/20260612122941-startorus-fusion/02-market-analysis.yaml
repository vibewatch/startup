company:
  name: Startorus Fusion
chapter:
  number: 2
  title: Market Analysis
  summary: 'Startorus Fusion participates in a very large long-term firm-clean-power opportunity, but the defensible 2026
    market is much narrower: a China-centered fusion-development ecosystem funded by state capital, research infrastructure,
    and pilot-program budgets rather than delivered electricity sales. Power-demand growth and industrial policy support the
    category, yet ITER, DOE roadmaps, and skeptical experts still imply that commercial fusion timing is wide and that early-2030s
    project claims should be treated as option value, not base-case grid revenue.'
sections:
- id: market-boundary-and-demand-context
  title: Market boundary and firm-clean-power demand context
  body: 'Startorus Fusion should not be underwritten against the whole future electricity system. The broad backdrop is real:
    official 2026 energy sources show that electricity demand is still rising, that electrification and data-center growth
    are strengthening demand for reliable low-carbon supply, and that planners increasingly care about system flexibility
    and firm power. But the included spend relevant to Startorus in 2026 is much narrower than the eventual multi-trillion-dollar
    power market. The real near-term market is the fusion-development stack: research facilities, pilot-device engineering,
    high-performance components, AI and controls, milestone-funded design work, and government-backed experimental bases.
    Long-duration storage, advanced fission, geothermal, gas with carbon capture, and ordinary grid capex remain substitutes
    or adjacent budgets competing for the same future firm-clean-power problem. That boundary matters because it keeps the
    chapter from translating broad energy-transition demand directly into near-term Startorus revenue.'
  claimRefs:
