      - number: '6.4'
        title: 反向观点是，在 Startorus 证明反应堆性能、耐久性和采购就绪度之前，客户转化仍带有推测性
        blocks:
          - type: paragraph
            body: >-
              客户侧的反向情景很直接。Startorus 可能确实已有早期产品销售，也有可见的公共部门支持和上海周边可信的工业生态，但这些还没有回答承销的核心问题：谁会向 Startorus
              购买聚变电力，以什么条款购买，在哪个验证里程碑之后购买？外部怀疑来源始终盯着这个缺口。MIT Technology Review
              指出，聚变公司在可运行电站出现之前就能融资，甚至签下巨额购电协议；报道也强调，主要开发商仍没有运行中的反应堆。DOE 的 2026
              路线图同样说，聚变要可靠并网之前，关键材料、燃料循环、组件和工程缺口仍待补上。这意味着 Startorus
              面临双重转化问题。第一，把研究和子系统需求转化为可作为参考案例的系统可信度。第二，把技术可信度转化为公用事业式、超大规模云厂商式或工业式采购；这些采购周期长，需要许可，也要求可靠性，远超一次实验室仪器销售。审慎的客户结论因此偏谨慎：早期生态拉力确实存在，但真正的电力市场拉力仍未验证、未点名，而且很可能还要等数年。
