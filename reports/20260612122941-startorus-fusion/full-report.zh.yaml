        blocks:
          - type: paragraph
            body: >-
              Startorus 不在一条整齐的单公司赛道里竞争。最直接的民营同行，是其他承诺反应堆更小或建造更快的紧凑磁约束团队，尤其是中国的 Energy Singularity 和海外的 Tokamak
              Energy。Commonwealth Fusion Systems 也应放在同一组严肃托卡马克公司里，尽管其机器更大、资本更充足，因为它追逐的终点同样是采用 HTS 磁体的电网级商业电力。Helion、TAE
              和 Realta 不是托卡马克，但它们仍是同一未来稳定清洁电力和工业能源预算的真实替代项。First Light、Renaissance Fusion 和 Proxima
              进一步拉宽竞争边界，说明投资人也在支持惯性和仿星器路线。ITER 应区别对待：它今天不是争夺客户的风险投资竞争对手，但仍是塑造聚变可信证明标准的公共科学基准。
