      - number: '7.4'
        title: 资本、人才厚度和伙伴集中度会放大其他所有风险
        blocks:
          - type: paragraph
            body: >-
              执行层面正是许多聚变故事断裂的地方，即便底层科学仍然有趣。Startorus
              的公开融资历史对一家中国民营聚变初创公司而言很强，但公司没有披露聚变电力收入、没有公开承购支持，也没有外部运行证据能让后续融资变成纯机会主义动作，因此仍意味着高度依赖持续外部支持。最好的独立行业类比显示，融资叙事可以多快改变：General
              Fusion 从长期可信走向裁员、项目收缩、救命融资，随后在达到盈亏平衡前尝试 SPAC；Zap 公开增加裂变业务，因为聚变并网时间线对当前电力需求来说仍太远。Startorus
              也仍是一个专业人才故事。公司自己的招聘页和高校招聘帖显示，磁体、低温工程、脉冲功率、诊断和控制系统等方向都有开放需求。这种广度令人鼓舞，因为它暗示真实建设活动；但这也意味着，任何一个难替代职能出现短缺或流失，都可能拖慢执行。公开专利证据和招聘证据合起来说明，这仍是一家在搭建组织厚度的年轻公司。投资含义很清楚：跟踪
              Startorus 时，不能像看软件路线图那样看，而应把它当成资本密集型项目；组织成熟度、采购纪律和里程碑可信度，决定技术承诺能否撑到真正有意义。
