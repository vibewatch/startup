      - number: '2.2'
        title: 商业化时点与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              2026 年聚变市场更适合用时间和融资视角测算，而不是用一个泛泛的 TAM 数字。公开和半公开证据支持一个大型资本浪潮：F4E Fusion Observatory 称，截至 2025
              年底，跟踪到的私营部门融资跃升至 EUR 13 billion，识别出 77 家公司；中国虽只有 8 家公司，却已占跟踪融资的 34%。但这轮资本浪潮并不能锁定商业化时点。ITER
              仍把聚变呈现为可行性项目，而不是发电厂，并把氘氚运行排到 2035 年；DOE 2026 年路线图则把美国试点和商业电力目标放在 2030 年代中期。与此相对，Helion 和其他私营公司营销的是 2020
              年代末或 2030 年代初交付叙事，Startorus 本身据报道目标是在 2028 年完成技术验证、2032
              年建设试点电站。因此，正确市场结论是一段很宽的商业化区间：早期合同现在可以签，但常规、与电网相关的电力销售，远没有融资新闻暗示的那样被证明。
