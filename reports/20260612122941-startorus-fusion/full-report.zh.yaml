companyProfile:
  summary: >-
    Startorus Fusion 是一家源自清华的中国聚变公司，成立于 2021 年，目标是把紧凑型球形托卡马克路线商业化。公司如今以上海嘉定作为可见执行中心，同时公开材料仍保留早期西安足迹。核心主张把 HTS
    磁体、磁重联加热和分阶段装置路线图结合起来，装置从 SUNIST-2 走向 NTST 和 CTRFR-1。2026 年，Startorus 完成 RMB 1.0 billion Series A 和 RMB 0.5 billion
    A+，累计披露融资超过 RMB 2.0 billion，公开估值超过 USD 1 billion。即便如此，公司在聚变发电销售上仍处于收入前阶段，只披露了来自电子和电力控制产品的有限早期收入，客户包括科研和工业用户。
