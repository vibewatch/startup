      - number: '5.5'
        title: 物理假设有意思，但最难的商业聚变风险仍在 Startorus 自身营销之外
        blocks:
          - type: paragraph
            body: >-
              对 Startorus
              的反向观点不是公司缺少想法，而是整个行业仍面对坚硬、缓慢的工程问题，公开创业叙事可能把这些问题压缩得过头。独立负三角形变文献在部分维度上支持这条路线，但并非一边倒乐观：它提示稳定性取舍、运行区间约束，以及在该构型看起来具备反应堆就绪度前，需要满足多项成形和安全因子条件。SUNIST-2
              手稿本身也同样克制，称高场约束验证、最优场景和高效加热，对球形托卡马克商业化仍未解决。Holdren 的 Belfer 文章把警示扩展到整个 D-T
              聚变事业，强调氚管理、中子损伤、连续运行压力和废物处理。这些担忧不是针对 Startorus 的具体指控，但重要，因为 Startorus
              的公开路线图最终指向同一个商业聚变终点。因此，合理承销解读既不是否定，也不是亢奋：Startorus 有一条值得跟踪的技术差异化路径，但下一步降风险必须是可测量的机器证明，而不是又一个雄心勃勃的里程碑标题。
