      - number: '2.3'
        title: 中国政策与生态支持
        blocks:
          - type: paragraph
            body: >-
              中国政策和生态环境显著提高了 Startorus 持续获得融资和机构连接的概率，尽管它们不能消除工程风险。2026
              年中央政府政策信息强调创新驱动增长、战略产业和更强投资支持；对新五年规划的横向分析也强调自立自强和产业升级。聚变领域里，中国已不再停留在孤立实验室工作。IPP/CAS 的 CRAFT 和 CFETR
              计划，提供了从参与 ITER 走向本土工程测试和最终发电目标的正式桥梁；Global Times 报道 BEST 正向 2027
              年末完工、开展燃烧等离子体实验推进。商业层面，上海和嘉定正在形成地方聚变集群：界面报道，Startorus 获得国资领投、签署嘉定合作协议，并接入更广泛的供应链建设。SCMP
              对中国聚变能源有限公司的报道在全国尺度上强化了同一点：中国正有意协调一个聚变生态，国资平台、实验室、地方政府和创业公司都在其中扮演角色。
