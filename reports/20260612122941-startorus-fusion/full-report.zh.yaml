  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 当前估值逻辑
      - 概率信号
      - 核心风险
    rows:
      - - 乐观情景
        - NTST 在 2027 年达到额定运行；Q 大于 1 大约落在 2028-2030 年；国资支持仍能接续；客户沟通沉淀成真正的预购证据。
        - 当前估值 USD 2.0-4.0B，投资人把中国先发者在 2030 年代跑出演示反应堆的可信路径计入价格。
        - 低到中；需要技术执行和持续融资支持同时兑现。
        - 独立验证不及预期、许可放慢，或国内竞争者抢走叙事主导权。
      - - 基准情景
        - Startorus 继续在上海建设，但电力商业化仍是 2030 年代的故事；在形成可融资的电站案例前，还需要另一轮大额融资。
        - 当前估值 USD 0.8-1.4B，大体围绕当前标记；披露和验证改善前，上行空间并不明显。
        - 中；符合行业调查，商业试点大多仍落在 2030-2035 年窗口。
        - 稀释、长周期和薄弱客户证据压住估值倍数扩张。
      - - 悲观情景
        - NTST 或后续里程碑延后；后续融资价格低于当前标记；市场按更早期核聚变可比公司重新定价。
        - 当前估值 USD 0.4-0.8B，反映一个已获资金支持但仍偏投机的平台，而不是享受溢价的商业化候选者。
        - 显著；行业仍未达到盈亏平衡，且资本开支很重。
        - 资本市场疲劳、技术挫折和条款不透明会放大下行。
    notes: 区间是分析师估计，依据里程碑概率、同业融资深度和公共部门时间表参照，而不是当前现金流。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 2025-2026 年估值或资本信号
      - 状态 / 验证水平
      - 与 Startorus 的相关性
      - 主要限制
    rows:
      - - Startorus Fusion
        - 据报道估值 >USD 1B；累计融资 >RMB 2B
        - 尚无收入的核聚变开发商；NTST 尚未按额定参数运行
        - 直接标的；检验中国政策支持能否在商业验证前支撑独角兽标记。
        - 股权结构表、独立设备数据和客户需求披露仍很薄。
      - - Helion Energy
        - 投后估值 USD 15.5B；累计融资 USD 1.5B
        - 电站在建；有具名客户；私下宣称 D-T 里程碑
        - 商业叙事更强时，私有核聚变公司能拿到怎样的溢价标记。
        - 仍无收入，也尚未证明商业盈亏平衡。
      - - Commonwealth Fusion Systems
        - 累计融资接近 USD 3B；2025 年 B2 轮 USD 863M
        - SPARC 首次等离子体目标仍为 2026 年；ARC 预计 2030 年代初
        - 资金最充足的磁约束同业，可校准进度现实性和融资深度。
        - 保留来源未公开估值。
      - - TAE Technologies
        - 已融资 >USD 1.3B；合并框架 >USD 6B
        - 寻求公开市场资本的后期私有核聚变公司
        - 即便长期获资的平台，在收入前仍需要融资结构创新。
        - 合并价值不等于干净的第三方轮次估值。
      - - Tokamak Energy
        - 累计融资 USD 335M；拥有 HTS 磁体副业
        - 私有球形托卡马克公司，已变现使能技术
        - 反应堆形态最接近的参照，也是有用的融资规模基准。
        - 司法辖区、融资环境和业务组合不同。
      - - Realta Fusion
        - Series A 轮 USD 36M，另有 USD 9.5M 债务额度
        - 早期磁镜公司，瞄准工业热力和电力
        - 低资本基准有参考价值，显示早期私有核聚变仍如何融资。
        - 规模小得多，技术路线也不同。
      - - Energy Singularity
        - 此前约 CNY 800M 轮次后，2026 年披露 Series A 轮但未披露金额
        - 中国 HTS 托卡马克同业，宣称实现 1,337 秒等离子体运行
        - 显示国内围绕政策支持、人才和投资人注意力的竞争。
        - 保留公开来源未披露 2026 年估值。
      - - Oklo / NuScale 公开参照
        - 2026 年 6 月公开市值约 USD 10.0B 和约 USD 3.5B
        - 公开上市的先进核能公司，其中 Oklo 仍无收入
        - 前沿能源故事进入公开可比框架后会如何被估值，这是有用的价格纪律参照。
        - 裂变不是聚变，因此这些只是纪律锚点，不是真正的经营可比对象。
    notes: 表中混合私有核聚变同业和公开先进核能参照，因为截至 2026 年 6 月并不存在干净的公开纯核聚变可比公司组。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-useful public private-fusion and public-nuclear comparables retained for this
        chapter; many private rounds still lack disclosed valuations.
    claimRefs:
      - CV002
      - CV011
      - CV014
      - CV016
      - CV018
      - CV032
      - CV033
      - CV034
      - CV035
  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发项
      - 关注阈值
      - 为何打破投资逻辑
      - 行动含义
    rows:
      - - NTST 进度延误
        - 安装或额定参数里程碑大幅错过 2026-2027 年目标
        - 公司溢价取决于可见设备进展能否压缩通往后续里程碑的路径。
        - 将情景区间重新切向悲观情景，并假设更多稀释。
      - - 后续融资偏弱
        - 下一轮融资价格低于当前独角兽标记，或带有沉重的下行保护
        - 低价轮会暴露战略资本不再接受隐含期权价值。
        - 把当前标记视为不可持续，并重新评估所有权经济性。
      - - 独立技术尽调不及预期
        - 外部评审无法验证所宣称表现，或关键指标仍未发表
        - 乐观情景需要证据质量提升，而不只是资金可得。
        - 在证据质量恢复前，将立场从继续研究移向回避。
      - - 中国许可路径仍不透明
        - 设备放大后，仍看不到可信的许可或环境路线图
        - 时间表和资本开支假设会软到难以承销。
        - 提高折现率，并推迟任何新增资本决定。
      - - 未来电力客户没有出现
        - 商业沟通仍局限于电子产品或泛泛的 TAM 语言
        - 估值仍是科学与政策期权，没有客户拉动。
        - 不为市场就绪支付溢价倍数。
      - - 同业验证领先 Startorus
        - 国内或全球同业率先交付更强、已验证的设备里程碑
        - 在前沿能源市场，相对稀缺价值会快速下滑。
        - 将 Startorus 重新定价为跟随者，而不是平台领导者。
    notes: 这些触发项直接传导到估值，而不是覆盖泛泛的经营风险。
    claimRefs:
      - CV005
      - CV006
      - CV028
      - CV039
      - CV043
      - CV045
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构表和优先权
        - 2026 年轮次后的最新持股表、清算堆叠、反稀释条款和投资人权利
        - 情景价值可能看起来可接受，但普通股回报仍然很差。
        - 公司 CFO / 领投方 / 律师资料室。
      - - 2027-2032 年融资计划
        - 覆盖 NTST 和后续设备的详细建设预算、烧钱曲线和融资假设
        - 在出现可融资电站案例前还需要多少轮融资，会显著影响独角兽标记。
        - 管理层模型审阅加董事会材料。
      - - 独立设备验证
        - 第三方评审约束、温度、脉冲时长、可用率和任何 Q 类目标
        - 技术证据缺口是当前估值尚难承销的最大单一原因。
        - 外部技术顾问和实验室级测试包。
      - - 中国许可路径
        - 按设备代际列出的环境、辐射、氚和场址审批路线图
        - 公司离开纯研发模式后，许可可能主导时间表。
        - 监管律师加公司许可负责人。
      - - 未来客户需求
        - 意向书、公用事业研究、数据中心热力或电力讨论，以及目标用例
        - 电力估值需要最终买方证据，而不只是投资人热情。
        - 商务负责人和交易对手。
      - - 后续资本来源偏好
        - 未来资金预计来自国家基金、战略产业方还是财务投资人的证据
        - 下一批支票由谁签，会影响定价纪律、治理和退出路径。
        - 董事长 / 领投方 / 融资计划备忘录。
    notes: 每个尽调问题都直接对应一个尚未解决的转换点：如何从可信科学项目，变成可融资的基础设施故事。
    claimRefs:
      - CV037
      - CV039
      - CV044
      - CV046
