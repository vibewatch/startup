      - number: '7.3'
        title: 技术逻辑有差异化，但最难的工程和供应链风险仍是行业级问题
        blocks:
          - type: paragraph
            body: >-
              Startorus
              的负三角度球形托卡马克策略，让公司比普通紧凑聚变故事有更鲜明的技术身份；但差异化不等于去风险。留存的技术文献比公司营销更有层次。一篇负三角度论文强调其在稳态约束和偏滤器性能上的重要潜力，同时也指出，宽压力剖面构型在低
              n MHD 模式下可能更不稳定，并且可能难以实现 H-mode
              约束。后续一项集成设计空间研究，把正三角度和负三角度之间的选择描述为一组权衡：运行约束、资本成本、氚增殖比、排热限制和高场磁体假设，而不是单向简化。这一点重要，因为 Startorus
              的公开页面对下一步机器仍处在验证前：NTST 公告是就绪声明，不是反应堆级可用性、Q、脉冲长度、氚系统或中子损伤韧性的展示。供应链证据也指向同一方向。行业报告和同业案例持续强调 HTS
              磁体、氚、专业材料和定制制造是关键瓶颈。即便其他公开机器证据更强的聚变公司，也仍在把自己的路线图与外部磁体伙伴、公私里程碑项目或明确的供应链工作绑定。Startorus
              因此更像一个雄心很大的首创型集成商，而不是已经穿过最难技术卡点的机器制造商。
