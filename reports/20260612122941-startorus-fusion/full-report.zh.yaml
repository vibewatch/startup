        title: 与全球同业相比，Startorus 的证明仍早，资本规模也仍不算大
        blocks:
          - type: paragraph
            body: >-
              检验独角兽标记最干净的方法，是把它与更知名聚变同业已经用大得多的资本池买到的东西相比。Helion 已融资 USD 1.5 billion，披露投后估值 USD 15.5
              billion，并能指出一个具名客户、一座在建电站和公开技术里程碑节奏。CFS 已融资接近 USD 3 billion，但仍把 SPARC 首等离子体描述为 2026 年事件，并网发电要到 2030
              年代早期。TAE 已融资超过 USD 1.3 billion，并曾通过一项估值超过 USD 6 billion 的合并寻求公开市场资本。相比之下，Tokamak Energy 在融资规模上更接近
              Startorus，并且仍把聚变主张与磁体副业配套。行业调查比任何单个同业更重要：它显示，聚变公司中位数还需要约 USD 694 million 才能抵达首座电站，整个群体合计需要超过 USD 77
              billion。在这个背景下，Startorus 超过 USD 1 billion 的估值并不疯狂，但这是为可能性付费，不是为去风险部署付费。
