chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起源与技术路线
        blocks:
          - type: paragraph
            body: >-
              Startorus Fusion
              现在是中国最受关注的民营聚变公司之一，但它的身份更适合理解为一条长期清华大学球形托卡马克研究谱系外面的商业化载体，而不是常规软件式创业公司。公司官方页面称，团队主要来自清华大学工程物理系，并已运行中国首台球形托卡马克
              SUNIST 超过二十年。公开中英文材料还显示，公司同时讲述两套叙事：一套是扎根清华聚变实验室的深科技机构源流，另一套是节奏更快、由风险资本支持的运营公司，试图把装置迭代周期从几十年压缩到几年。


              技术路线是采用高温超导磁体和磁重联加热的紧凑型球形托卡马克架构。Startorus
              认为，这条路线可让聚变装置比依赖更笨重加热系统的传统托卡马克项目更小、结构更简单。这个说法契合公司的商业化主张：降低建造成本、加快迭代，并且应用场景不止电网级电站，最终还可进入更紧凑、高集成度的场景。独立球形托卡马克文献大体支持该架构的潜力，但并不会拿掉工程负担。因此，证据支持把
              Startorus 视为一家技术上有差异化、研究传承可信的聚变开发商；同时也要承认，它承诺的经济优势仍是面向未来的公司论点，不是已经验证的商业结果。
