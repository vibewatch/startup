  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 独角兽标记定价的是战略期权价值，而不是可承销的经营证据
        blocks:
          - type: paragraph
            body: >-
              Startorus 已经拼出一个真实的风险投资案例：上海国资背景资本、差异化球形托卡马克和 HTS
              叙事、可见的嘉定建设，以及足以宣称中国首家聚变独角兽的势能。这些信号并不轻。它们解释了为什么即便公司作为电力生产商仍未产生收入，2026 年仍可能出现据报道超过 USD 1 billion
              的估值。但同一组证据也定义了乐观故事的边界。公开材料仍指向有资金支持的工程意图，而不是经过独立验证的反应堆经济性、已签约电力需求，或未来电力机器的已披露监管路径。正确框架因此是情景价值，而不是来自当前现金流的内在价值。市场买的是
              NTST 执行、Q 大于 1 里程碑和中国特定政策杠杆的期权。按这个视角，正确建议是继续研究，信心为中，估值立场是偏高，而不是明显不理性或明显有吸引力。
