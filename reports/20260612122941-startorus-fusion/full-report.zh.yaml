      - - Energy Singularity
        - 中国直接 HTS 托卡马克同业
        - 公开里程碑证明较强；所审阅来源未留存精确累计融资
        - 托卡马克系统、未来电厂和中国聚变生态买方
        - 全球首个全 HTS 托卡马克 HH70，以及 1,337 秒脉冲记录
        - 留存公开来源中，商业合同结构和融资规模透明度较低
      - - Commonwealth Fusion Systems
        - 全球托卡马克龙头
        - $863M Series B2 后总融资约 $3B
        - 电网级公用事业公司和超大规模云厂商购电方
        - SPARC 到 ARC 路径、HTS 磁体、Google 背书的商业信号
        - 仍处商业化前，且资本开支路径远重于 Startorus 叙事暗示
      - - Helion
        - 紧凑反应堆替代龙头
        - 总额 $1.5B；2026 年 Series G 后投后估值 $15.5B
        - 寻求直接电力供应的企业购电方
        - 场反位形设计，加上 Microsoft PPA 标杆
        - 同组中时间表最激进，且非托卡马克物理路径自带规模化风险
      - - TAE Technologies
        - 替代磁约束路线竞争者
        - 官方股权融资 $1.3B+；TechCrunch 引述约 $1.79B
        - 长期电网级清洁电力买方
        - 束流稳定 FRC，以及长期无中子化雄心
        - 商业化时间仍晚于最激进的 PPA 驱动叙事，且燃料路线技术难度更高
      - - Tokamak Energy
        - 全球直接球形托卡马克同业
        - 2024 年 $125M 轮后总额 $335M
        - 聚变中试电厂和磁体技术客户
        - 球形托卡马克加 HTS 磁体堆栈，已有 ST40 和 ST80 证明点
        - 资本基础远小于 CFS，且没有 Helion/CFS 条款下的公开客户承诺
      - - Realta Fusion
        - 紧凑工业能源替代者
        - $36M Series A 加 DOE 里程碑支持
        - 工业热和模块化电力客户
        - 面向模块化部署的紧凑可扩展磁镜设计
        - 融资和证明都早于托卡马克龙头阶段
      - - First Light Fusion
        - 替代惯性聚变竞争者
        - TechCrunch 引述 $108M
        - 技术伙伴、国防 / 科研用户、未来聚变开发商
        - 基于弹丸的惯性聚变，并愿意先变现使能技术
        - 短期内不再推进自有完整电厂
      - - Renaissance Fusion
        - 欧洲仿星器 / 零部件入局者
        - 公开披露 €15M 种子轮
        - 欧洲工业伙伴和未来仿星器生态伙伴
        - HTS 线圈和液态金属屏蔽，包裹在仿星器雄心之上
        - 融资规模远低于全球领先梯队
      - - ITER
        - 公共科研标杆
        - 国家出资的国际大型项目
        - 聚变科学和工业集成标杆，而非私营客户
        - 电厂级集成最先进的公共证明框架
        - 商业时间表远慢于风险投资创业公司的叙事
