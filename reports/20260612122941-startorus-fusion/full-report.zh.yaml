      - number: '1.5'
        title: 批判视角与未决风险
        blocks:
          - type: paragraph
            body: >-
              对 Startorus 最强的警示不是公司特定丑闻，而是聚变本身带来的时间线和商业化风险。来自 Belfer、美国国会研究服务部、AIP FYI、China Daily 和 IEEE
              超导综述的独立来源都在讲同一个核心：聚变已从纯科学走向工程，但商业可行性的证明仍远不止等离子体里程碑或融资轮。真正的商业成功需要电站层面的真实能量增益、耐用磁体和材料、长时或高重复运行、燃料循环可行性，以及最终接入电网。这些障碍直接映射到
              Startorus，因为公司正用资本效率叙事支撑一条快于历史节奏的时间表。


              这并不否定公司的进展。事实上，可信的清华源流团队、大额国资支持的 Series A、快速搭建的装置栈，让 Startorus 成为更严肃的中国民营聚变力量之一。但外部怀疑仍有必要。Holdren 明确把
              2030-2035 年商业聚变预测称为「hype」，美国国会研究部门称商业可行性障碍仍未解决，行业报道也继续指出，全球没有任何聚变公司在电网级商业输出上运行。因此，Chapter 1
              的合理承销立场是谨慎建设性：Startorus 看起来真实、融资充足、具备战略相关性，但它的价值仍取决于 2028 年工程验证能否成为真正的降风险事件，而不是又一个把聚变行业著名「移动地平线」往后推的里程碑。
