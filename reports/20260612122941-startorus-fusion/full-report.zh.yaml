            body: >-
              反向情景是，Startorus 亮眼融资可能诱导读者过度解读降风险。同行和行业证据指向相反方向。Helion 和 CFS
              绝对融资额都高得多，却仍处于商业化前阶段，新资金仍投向制造、示范和未来电站。行业数据也显示，资本高度集中，许多公司仍预计在试点电站上线前需要非常大规模的额外资金。与此同时，本章最强的怀疑来源认为，聚变创业公司早在电站存在前就开始变现未来电力叙事；资金收紧时，副业可能变成干扰；政府可能需要充当早期客户或融资推动者，因为单靠私人资本未必能撑起供应链。对
              Startorus
              而言，实际结论是平衡但谨慎：如果执行按计划推进，公司大概有足够支持和政策对齐度穿过当前装置加基地阶段；但公开证据基础仍不足以承销一条自筹资金走向试点规模商业化的路径。下一次融资压力点很可能出现在 2028
              年工程验证里程碑之前或附近，主要财务风险仍是透明度不足、稀释、进度滑坡，以及继续依赖国家和战略资本。
