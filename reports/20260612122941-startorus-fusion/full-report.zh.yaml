        title: 中国特定支持托住下限，但商业化距离仍决定区间
        blocks:
          - type: paragraph
            body: >-
              中国因素把下行和上行推向相反方向。支持面上，上海显然已把聚变选为产业优先方向，Startorus 也已经证明，相比多数西方初创公司，它能更快吸引国资关联资本、土地和供应商注意力。Energy
              Singularity 2026 年的融资和机器进展也说明，Startorus
              不是在真空中独自建设；本地生态已经真实形成。这降低了近期融资可得性风险，也让公司更容易穿越多代机器周期。但同一背景也可能削弱市场纪律，因为战略支持方或许能容忍更长时间线和更薄披露，而纯财务投资人未必会。公开证据仍缺少最影响估值转化的项目：股权结构表条款、独立机器数据、中国特定审批路径，以及客户支持的真实聚变产出需求。因此情景区间仍然很宽。乐观价值要求
              NTST 按时执行，并在之后证明路线图能压缩到 2030 年代早期。基准价值假设平台继续推进，但仍是一个有资金支持的研发故事。悲观价值假设里程碑滑坡，后续融资以更低价格完成。
            claimRefs:
