  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Startorus 已经露出产品表面，但核心投资逻辑仍是反应堆开发平台
        blocks:
          - type: paragraph
            body: >-
              Startorus 尚未销售聚变电力，所以 2026
              年定义其产品最具体的方式，是把它看作一套反应堆开发栈，周围带有一个小而真实的硬件表面。公开材料显示两层结构。第一层是未来反应堆路径：高场球形托卡马克、负三角形变
              NTST，以及后续聚变级装置，目标是把等离子体里程碑转成商业电站计划。第二层是当前可见的仪器和控制硬件，例如用于等离子体诊断和 HTS 磁体监测的隔离放大器、模拟积分器和 CoaxLink Nano
              采集设备。这很重要，因为它显示 Startorus
              不像单个学术原型，而更像一家垂直整合工程商店，已经在围绕自己的机器搭建部分诊断和控制管线。限制同样关键：这些公开产品都不能改变一个事实——经济逻辑仍押在未来反应堆成功上，而不是已披露的当前收入引擎上。核心技术押注是采用重复磁重联加热的紧凑型
              HTS 球形托卡马克；Startorus 称，相比传统大型托卡马克栈，这应能简化加热硬件。
