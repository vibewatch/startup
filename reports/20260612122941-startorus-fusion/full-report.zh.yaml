      - number: '5.2'
        title: SUNIST-2 提供近期证据基础，NTST 则是通向更像反应堆机器栈的桥梁
        blocks:
          - type: paragraph
            body: >-
              最强公开技术证据仍停留在 SUNIST-2 和 NTST 层面，而不是任何发电装置。IAEA 的 SUNIST-2 手稿给了 Startorus
              一样许多创业公司主张缺少的东西：一台已披露的中间机器，带有真实参数、首次等离子体时间、三角形变范围和具体科学目标。它显示 Startorus
              不是从幻灯片起步；这里有一条机器谱系，包含重联加热实验、壁处理工作和增强的等离子体控制能力。NTST 是下一步，公开材料把它描述成工程桥梁，而不是成品。Startorus 称 NTST
              将验证磁体、真空系统、低温系统、电源、控制系统和排热，其几何形态更接近后续聚变级装置。关键细节是，Startorus
              最吸睛的差异化——负三角形变加球形托卡马克几何和重联加热——仍在从有前景的物理和子系统想法，转化为一台集成机器证明。公开证据支持路线的新颖性，但也把主要放大风险留在桌面上。
