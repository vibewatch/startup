      - number: '5.4'
        title: 控制栈信号正在改善，但对核相邻系统而言，信任和质量披露仍薄
        blocks:
          - type: paragraph
            body: >-
              工程纪律上有一些鼓励信号。Startorus
              的飞书案例显示，公司正尝试用任务跟踪、采购流程和参数知识管理把自己工业化，而不是只靠实验室英雄主义。公开招聘门户同样暗示，公司具备支持组织扩张的正式招聘流程。机器侧，锂涂层、杂质降低和诊断扩展说明团队正以可信方式处理标准等离子体质量和运行问题。但这些信号不能替代正式信任披露。保留的公开来源没有显示独立安全审计、已披露聚变专属许可路径，或控制栈的软件质量框架。它们也没有披露许多外部投资人真正承销机器就绪度所需的参数，包括脉冲长度、占空比、低温负荷、已实现
