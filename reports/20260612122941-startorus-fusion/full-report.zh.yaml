      - number: '1.2'
        title: 创始人、领导层与运营足迹
        blocks:
          - type: paragraph
            body: >-
              领导层可见度不宽，但足以判断谁最影响执行。官方和独立报道都稳定地把陈锐标注为创始人兼 CEO，把谭熠标注为创始人兼首席科学家；谭熠同时也是清华工程物理领域学者。这个组合很关键，因为 Startorus
              的风险异常集中在创始型经营者身上，他们同时连接物理、工程、融资和政策资源。公开材料没有披露庞大的外部高管梯队、独立董事或详细治理结构，所以实际结论是：虽然其下团队看起来技术实力较强，关键人依赖仍然偏高。


              公司的公开足迹也需要细分看。Startorus 如今强烈围绕上海嘉定塑造品牌，实验基地和产业化推进都集中在那里；2026 年 1
              月融资也明确绑定公司落地上海未来产业规划。与此同时，官网材料同时列出上海嘉定和陕西西安地址，SCMP 在 2026 年 1 月仍称公司总部在西安。最干净的综合判断是：Startorus
              的重心已转向上海，但并未完全丢掉早期西安足迹。尽调时，运营管辖、补贴暴露和人才集中度应跨两座城市评估，不能直接假设公司只以上海为基地。
