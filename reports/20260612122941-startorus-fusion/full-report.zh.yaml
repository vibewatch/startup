      - CV037
      - CV039
      - CV040
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 用示例估值驱动因素说明，在当前独角兽估值附近，哪些变量对 Startorus 最关键。
    data:
      items:
        - label: 独立等离子体验证改善
          value: 0.6
          note: 基准情景更可信后，现值可能增加约 USD 0.6B。
        - label: 披露清晰的中国许可路径
          value: 0.2
          note: 降低时间线折价和基础设施风险。
        - label: 出现客户背书的电力或热力需求
          value: 0.4
          note: 叙事从泛化 TAM 转向由买家锚定的商业化。
        - label: 下一轮低于独角兽估值
          value: -0.5
          note: 将直接把市场出清价格下调。
        - label: NTST 里程碑延后 12 个月以上
          value: -0.4
          note: 验证之前融资需求先到，会把平台推向熊市路径。
        - label: 国资背景资本仍然充裕
          value: 0.3
          note: 即便商业验证尚未出现，也能支撑资金续航。
    approximationNotes: 美元影响是分析敏感性，不是谈判出来的投资条款清单结果。
    claimRefs:
      - CV021
      - CV022
      - CV037
      - CV038
      - CV043
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 一家尚未产生收入、由里程碑驱动的聚变公司，在熊市、基准和牛市情景下的当前估值区间。
    data:
      items:
        - label: 熊市情景
          low: 0.4
          mid: 0.6
          high: 0.8
          note: 里程碑延后，融资把公司重新定价到独角兽以下。
        - label: 基准情景
          low: 0.8
          mid: 1.1
          high: 1.4
          note: 上海平台继续推进，但商业化仍是 2030 年代的故事。
        - label: 牛市情景
          low: 2
          mid: 3
          high: 4
          note: NTST 落地，Q 里程碑可信度提升，后续资本继续支持。
    approximationNotes: 所有数字都是基于公开证据和明确假设、以十亿美元计的现值式情景区间。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 截至 2026-06-12，Startorus 在市场、验证、融资和披露维度的 IC 式评分卡。
    data:
      items:
        - label: 市场机会
          value: 8/10
          note: 聚变瞄准长期规模巨大的电力和工业热力市场。
        - label: 中国政策支持
          value: 8/10
          note: 上海和国资背景资本明显改善资金续航和生态准入。
        - label: 技术差异化
          value: 6/10
          note: 球形托卡马克叠加 HTS 和 AI 控制具备差异化，但仍处早期。
        - label: 独立验证质量
          value: 3/10
          note: 公开来源仍缺少第三方对反应堆级性能的验证。
        - label: 客户验证
          value: 2/10
          note: 保留证据中没有披露公开的电力或热力购销协议。
        - label: 融资位置
          value: 6/10
          note: 已募 RMB 2B+ 在本土较强，但相对全球头部公司和行业资本需求仍不算大。
        - label: 估值支撑
          value: 4/10
          note: 独角兽估值可以解释，但披露出来的业务进展支撑偏薄。
        - label: 披露质量
          value: 3/10
          note: 股权结构、许可路径和独立技术数据仍然缺失。
    approximationNotes: 分数是 0-10 分制的定性投资判断，不是模型输出。
    claimRefs:
      - CV001
      - CV002
      - CV008
      - CV036
      - CV037
      - CV039
      - CV045
