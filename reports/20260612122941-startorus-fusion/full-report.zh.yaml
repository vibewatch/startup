      - number: '8.4'
        title: 只有在证明、稀释和商业化需求证据改善后，判断才会好转
        blocks:
          - type: paragraph
            body: >-
              反向逻辑不是 Startorus 缺少人才或雄心，而是聚变历史里挤满了资金充足的项目；它们在首创型工程和融资现实追上来之前，看起来都很有说服力。Bulletin、Belfer 和 TechCrunch
              的反向解读之所以有用，正因为它攻击了许多后期私募估值背后的前提：资金和曝光不能替代商业证明。Startorus 可以推翻这个批评，但只能靠尚未公开的证据。投资人需要看到 2026 年股权结构表和优先股堆叠、到
              2032 年逐台机器预算、独立等离子体性能验证、明确的中国许可地图，以及交易对手真正想要未来聚变能源而不只是好故事的证据。在这些项目出现前，正确姿态是有纪律的好奇。若 NTST
              明显滑坡、后续融资低于当前估值、独立机器证据令人失望，或公司无法从政策支持项目状态走向客户支持商业化，投资逻辑就会破裂。这些触发因素比标题估值本身更重要。
