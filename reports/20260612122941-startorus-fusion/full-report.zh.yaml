      - number: '1.3'
        title: 融资历史、投资者基础与资本位置
        blocks:
          - type: paragraph
            body: >-
              Startorus 从有潜力的实验室衍生项目跨入全国重要聚变公司，靠的是一段高度压缩的资本形成过程。中国商业报道指向 2022 年天使轮、2024 年 Pre-A 轮、2026 年 1 月由国资领投的 RMB 1
              billion Series A，以及仅数月后的 RMB 500 million Series A+。1
              月轮最影响控制权和信号：它由上海国资背景资本领投，引入嘉定相关投资方，并且当时似乎是中国大陆民营聚变公司单笔融资纪录。披露的财团混合了国资、机构金融、产业投资者和专业基金，这符合中国战略硬科技项目的融资方式。


              2026 年 5 月 A+ 轮再次改变外部观感。官方和媒体口径称累计融资超过 RMB 2 billion，界面和新浪报道估值超过 US$1
              billion。估值并不因此变成完全审计过的数字，但足以说明，在工程验证完成前，投资人已愿意按独角兽给 Startorus
              承销。这既是优势，也是压力。优势来自耐心资本和政策支持；压力来自必须把资本强度转化成里程碑速度，因为一家收入前聚变公司带着国家关联投资方和独角兽估值，外界评判它更看重进度可信度，而不是近期财务指标。
