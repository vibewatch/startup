  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: Startorus 公开客户旅程目前始于子系统或实验室合作，而不是公用事业 PPA。
    data:
      items:
        - id: discover
          label: 发现技术需求
          actor: 研究实验室、工业工程团队或公共部门出资方
          description: 第一层可见需求不是采购电力，而是诊断、脉冲电源或参与聚变项目的需求。
          channels:
            - Startorus 产品中心
            - 融资新闻
            - 嘉定项目宣传
        - id: evaluate
          label: 评估子系统验证
          actor: 实验室采购方或工程评估方
          description: 买家可以先评估电子设备、数据采集和控制硬件，不必等到评估电站。
          channels:
            - 产品页面
            - 技术演示
            - 合作伙伴报道
        - id: transact
          label: 购买设备或支持项目
          actor: 高校、研究机构、工业买家或地方政府交易方
          description: 当前证据显示的是设备销售和项目支持关系，而不是能源购电。
          channels:
            - Startorus A+ 公告
            - Jiemian
            - 上海 / 嘉定政府页面
        - id: validate
          label: 验证反应堆开发可信度
          actor: 战略合作伙伴或未来电力买家
          description: 未来能源买家大概率会先观察 NTST、Startorus-1 和等效 Q 里程碑，再进入采购。
          channels:
            - 技术里程碑
            - 重大项目更新
            - 独立行业报道
        - id: procure-power
          label: 谈判电力采购
          actor: 公用事业、工业、海事或超大规模买家
          description: 这一阶段对 Startorus 仍属假设，需要漫长且依赖标杆案例的企业销售流程。
          channels:
            - 直接企业 BD
            - 公私合作
            - 双边 PPA 讨论
        - id: expand
          label: 扩展到多站点部署
          actor: 复购型战略买家
          description: 扩张取决于首个部署成为可信的参考电站；公开层面尚无这一闭环。
          channels:
            - 参考站点
            - 后续 PPA
            - 产业集群合作
    claimRefs:
      - CU003
      - CU004
      - CU011
      - CU013
      - CU018
      - CU022
      - CU039
      - CU042
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: 证据栈在认知和子系统交易阶段最强，到反应堆采购和重复电力部署阶段则迅速变薄。
    data:
      nodes:
        - id: market-interest
          label: 市场兴趣
          description: 聚变兴趣体现在国家支持、战略投资人，以及围绕清洁稳定电力的广泛需求叙事中。
        - id: subsystem-sale
          label: 子系统销售
          description: Startorus 在这里有直接验证：高校、研究机构和工业客户都为电子设备提供了参考。
        - id: reactor-reference
          label: 反应堆参考案例
          description: 需要补上的桥梁阶段，是未来电力买家可尽调的运行装置或示范项目。
        - id: first-power-buyer
          label: 首个电力买家
          description: 公开层面还看不到公用事业、超大规模云厂商或重工业 Startorus 客户。
        - id: first-delivery
          label: 首次交付
          description: 公司材料把外送电放在 2030 年代初，因此交付仍是未来事件。
        - id: repeat-fleet
          label: 重复舰队扩张
          description: 公开证据尚不支持未来电力业务的续约、扩张或多站点采用。
      edges:
        - from: market-interest
          to: subsystem-sale
          label: 购买电子设备或支持基地建设
        - from: subsystem-sale
          to: reactor-reference
          label: 组件可信度反哺系统可信度
        - from: reactor-reference
          to: first-power-buyer
          label: Q>1 和工程验证打开买家尽调
        - from: first-power-buyer
          to: first-delivery
          label: 选址、许可和建设
        - from: first-delivery
          to: repeat-fleet
          label: 参考电站支持扩张
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU022
      - CU025
      - CU039
      - CU042
