      - number: '2.4'
        title: 近期收入路径与承销含义
        blocks:
          - type: paragraph
            body: >-
              这个生态意味着 Startorus 的市场路径是分阶段的。2026
              年最具体的买家不是零售电力客户，甚至不是购买已交付聚变电力的公用事业；而是出资建设基地的政府、购买能力的国家实验室和研究院、押注装置的战略投资者，以及协助搭建供应链的产业伙伴。DOE
              里程碑计划扩容说明，能源销售出现前，公私合作开发合同就能成为一个真实市场类别；Helion 与 Microsoft 的协议也说明，电站运行前就能出售长期电力承购结构。因此，Startorus
              可能的近期商业市场包括科研合作、里程碑式机构项目、工程合同、部件采购，并最终走向示范电站合作。长期大奖是面向更大稳定清洁电力市场的电力许可或销售，但反向观点必须保留：Belfer 和 MIT Technology
              Review 都认为，投资人热情可能跑在从实验成功走向可重复、经济、可并网聚变电力的未验证路径之前。承销含义很简单：近期生态参与价值应比近期发电销售主张更重。
