  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心风险是进度滑坡累积，而不是某一个致命缺陷
        blocks:
          - type: paragraph
            body: >-
              Startorus 现在已有足够公开势能，正确的反向问题不再是公司是否存在、能否融资，而是能否按公司声称的时间线关掉足够多相互独立的瓶颈。公司已融资超过 RMB 2 billion，获得嘉定政府支持，并公开画出从
              SUNIST-2 到
              NTST、再到发电示范反应堆的路径。这些都是真实强项。它们也带来更严苛的举证责任，因为每个里程碑现在都依赖机器集成、材料、磁体、低温工程、氚或燃料循环规划、监管准备和专业人才招聘同步推进。美国官方和国会聚变资料仍称，即便对资金最充足的开发商，行业也面临未解决的科学、工程、燃料循环和许可缺口。行业反向案例从市场侧强化同一点：一旦时间线拉长，聚变初创公司通常不会因为某一个物理结果而干净利落地失败；它们会被融资条款、副业转向、裁员或项目重置挤压。对
              Startorus 而言，进度风险因此成为本章的组织视角。如果 NTST
              集成、供应商交付或许可准备滑坡，影响不会孤立存在。它会削弱伙伴信心，让后续融资更复杂，也会推迟外部投资人第一次用反应堆级证据而不是路线图语言检验公司主张的时间点。
