      - number: '7.2'
        title: 监管、出口管制和燃料循环限制仍是未完成的工作流，而不是已解决的前置条件
        blocks:
          - type: paragraph
            body: >-
              聚变监管叙事在抽象层面有所改善，但这不等于 Startorus 已有去风险的审批路径。2026 年 NRC
              提案是有用背景，因为它说明，严肃监管者认为早期聚变许可包必须覆盖哪些内容：辐射安全、氚处理、废物、应急程序、环境审查，以及可供联邦和州级主管机关审阅的文件。同一规则的律所分析也说得很清楚，聚变不像裂变那样监管，并不意味着出口管制问题已经消失；聚变机器仍处在美国商务部规则下的军民两用生态里，NRC
              还明确询问，未来是否应设置额外的聚变专属出口管制。对 Startorus 这样位于中国的开发商，这会从两个方向产生影响。跨境合作可能触发最终用户和技术转移审查，而中国 2025-2026
              年稀土管制也会让磁体密集型供应链面临采购和合规风险。燃料循环问题更难。官方和准官方行业来源反复指出，氚可得性、lithium-6，以及废物或活化管理，都是商业聚变最未解决的瓶颈之一。Startorus
              的公开材料描述了融资、设施和机器雄心，但还没有披露反应堆专属许可顺序、氚策略或活化材料处置路径。这个缺口不能证明公司会失败；它意味着监管和燃料循环尽调仍是一个重大未解决闸口。
