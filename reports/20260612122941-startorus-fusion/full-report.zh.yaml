            body: >-
              公司自己的材料先指向几类场景：大型电站、分布式电站、海上或深海平台，以及大型船舶推进。这些方向说得通，因为 Startorus
              主打紧凑、高功率密度的球形托卡马克架构，部分战略伙伴也有相邻的海事或装备敞口。跳出公司已说明的目标，2026
              年更广义的聚变市场也显示，锚定需求可能最先从哪里出现：需要全天候清洁电力的超大规模云厂商和数据中心运营商，以及负荷大且稳定的工业用户。Google 对 Commonwealth Fusion Systems 的
              200 MW 承诺，以及 Microsoft 更早与 Helion 达成的协议，是重要的外部证据：只要开发商看起来足够可信，成熟买家会在交付前签聚变购电合同。IEA
              关于数据中心需求的背景，也解释了这种兴趣为何成立。即便如此，Startorus 还没有公开点名自己的公用事业、超大规模云厂商或重工业电力买家。氢、氨和钢铁相邻买家也有战略意义，因为 DOE
