            body: >-
              相比一年前，Startorus 现在拥有更具体的设施和项目管理故事。嘉定项目页面描述了一个专门建设的上海实验基地，官方融资沟通也明确把资本用途连到该基地和未来装置。这有意义，因为聚变时间线常被抽象讨论，而
              Startorus 现在把故事锚定在具体地点、建设序列和硬件栈上。与此同时，公开路线图并不完全稳定。一份 2026 年公司披露指向 2028 年工程验证和 2032 年可发电示范堆，另一份则称 Startorus
              One 在 2027 年开工，并计划 2029 年实现等效 Q 大于等于 1 的全参数运行。这种漂移并不致命，但是真实尽调信号：项目定义仍在变化。同行比较让问题更尖锐。CFS 和 Tokamak Energy
              使用同样的紧凑加 HTS 逻辑，Energy Singularity 则已经在中国公开更多机器证明数字。因此，Startorus 看起来有差异化，但披露证明早于最强基准同行。
