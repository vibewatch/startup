      - number: '1.4'
        title: 装置管线、场地与执行里程碑
        blocks:
          - type: paragraph
            body: >-
              当前执行故事围绕三代装置展开。SUNIST-2 与清华共同运行，是运营中的验证平台，也是公司声称该路线可以快速建造和迭代的主要证据点。NTST
              是下一步工程装置，被描述为全球首台原生负三角形变球形托卡马克，安装与嘉定基地绑定。CTRFR-1 是更大的路径验证机器，Startorus
              称它将测试球形托卡马克和重复重联路线能否扩展到聚变级性能。官方材料一直把这些项目同嘉定基地建设、HTS 磁体生产和 AI 辅助等离子体控制工作连在一起。


              路线图日期激进，但内部口径基本一致。Startorus 称工程验证应在 2028 年左右完成，此后公司希望开始建设商业示范堆，并在 2032 年左右交付可发电的聚变示范堆。关键尽调区分在于，2028
              年不是收入里程碑，而是工程里程碑。同样，2032 年目标仍被表述为示范堆，而非成熟发电业务。这个框架降低了把进度表解读成立即电网经济性承诺的风险，但装置延期、超导磁体受挫或场地建设滑坡的容错空间仍很小。
