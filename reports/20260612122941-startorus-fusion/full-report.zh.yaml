  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与稳定清洁电力需求背景
        blocks:
          - type: paragraph
            body: >-
              不应按整个未来电力系统给 Startorus Fusion 承销。大背景是真实的：2026
              年官方能源来源显示，电力需求仍在上升，电气化和数据中心增长正在强化对可靠低碳供给的需求，规划者也越来越重视系统灵活性和稳定电源。但 2026 年与 Startorus
              相关的可纳入支出，远窄于最终可能达到数万亿美元的电力市场。真正的近期市场是聚变开发栈：科研设施、试点装置工程、高性能部件、AI
              和控制、按里程碑拨款的设计工作，以及政府支持的实验基地。长时储能、先进裂变、地热、带碳捕集的天然气和普通电网资本开支，仍是解决同一个未来稳定清洁电力问题的替代项或相邻预算。这个边界很重要，因为它避免把广义能源转型需求直接翻译成
              Startorus 的近期收入。
