  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从政策背书的平台优势，到验证和披露缺口，再到当前「继续研究」立场的决策链。
    data:
      nodes:
        - id: n1
          label: 长期清洁电力上行空间大，AI 推动用电需求
        - id: n2
          label: 上海国资背景资本和本地聚变集群降低近期融资风险
        - id: n3
          label: Startorus 的机器路线图和嘉定建设可见
        - id: n4
          label: 没有公开聚变电力收入、没有签约购电、没有独立净能量验证
        - id: n5
          label: 行业调查仍把多数商业试点放在 2030 年代，且需要更多资本
        - id: n6
          label: 当前报道估值 > USD 1B 有战略逻辑，但披露偏薄
        - id: n7
          label: 建议：继续研究 / 估值立场：偏高
      edges:
        - from: n1
          to: n7
          label: 支撑上行
        - from: n2
          to: n7
          label: 托住底线
        - from: n3
          to: n7
          label: 支撑叙事
        - from: n4
          to: n7
          label: 限制信心
        - from: n5
          to: n7
          label: 推高折价
        - from: n6
          to: n7
          label: 确定立场
    approximationNotes: 逻辑权重是定性判断，不是模型推导结果。
    claimRefs:
