- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - Startorus solution
  - measurable benefit
  - limitation
  rows:
  - - Fusion physicist testing negative-triangularity spherical-tokamak behavior
    - Run shots on a compact experimental machine, vary shaping and heating, inspect diagnostics
    - SUNIST-2 now and NTST next provide a dedicated ST platform with reconnection-heating focus
    - Faster iteration than waiting for a giant public tokamak campaign
    - Public data still stop well short of plant-level proof
  - - Shot operator / control engineer
    - Coordinate PF coils, solenoid timing, diagnostics, and parameter tracking across each discharge
    - Startorus links tokamak control, prediction/simulation algorithms, and an evolving autopilot concept
    - Potentially compresses shot-cycle engineering and machine reproducibility
    - No public reliability or software-quality statistics
  - - Diagnostics engineer or lab user needing synchronized measurements
    - Acquire fast analog plasma and magnet signals and align them across distributed nodes
    - CoaxLink Nano plus signal-conditioning hardware provide a coherent instrumentation layer
    - 2 MS/s, 16-bit capture with IEEE-1588v2 synchronization is useful for fusion diagnostics
    - Public sources do not show customer adoption or installed base
  - - Municipal / strategic sponsor tracking milestone progress
    - Fund facilities, hardware, and local ecosystem buildout before commercialization
    - Jiading base and phased machine roadmap turn the program into a place-based engineering project
    - Makes capital deployment more concrete than a pure research narrative
    - Roadmap versions still drift across public disclosures
  - - Future industrial or utility buyer evaluating the reactor thesis
    - Compare Startorus against better-known compact-fusion peers on cost, footprint, and proof
    - Startorus sells a smaller-machine thesis built around reconnection heating and negative triangularity
    - Could lower future plant complexity if the thesis survives scale-up
    - No public customer contract, price, or delivered energy benchmark exists yet
  notes: The workflow view is partly internal because Startorus remains pre-revenue on fusion power; public evidence is richer on development users than on end customers.
