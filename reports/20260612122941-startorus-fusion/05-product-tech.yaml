- id: roadmap-facility-and-peer-benchmark
  title: Facilities and roadmap ambition are real, but peers disclose stronger machine proof today
  body: Startorus now has a more tangible facility and program-management story than it did a year earlier. The Jiading project page describes a purpose-built Shanghai experimental base, and official funding communications explicitly tie capital use to that base and to future devices. This is meaningful because fusion timelines are often discussed abstractly, whereas Startorus is now anchoring the story to a specific place, construction sequence, and hardware stack. At the same time, the roadmap is not perfectly stable in public. One 2026 company disclosure points to 2028 engineering verification and a 2032 power-producing demonstration reactor, while another says Startorus One construction starts in 2027 and full-parameter operation with equivalent Q greater than or equal to 1 is planned for 2029. That drift is not fatal, but it is a real diligence signal that the program definition is still evolving. Peer comparison sharpens the point. CFS and Tokamak Energy use the same compactness-and-HTS
    logic, while Energy Singularity has already put more public machine-proof numbers on the table in China. Startorus therefore looks differentiated, but earlier in disclosed proof than the best benchmarked peers.
