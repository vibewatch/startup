- id: sunist2-to-ntst-architecture
  title: SUNIST-2 provides the near-term evidence base, while NTST is the bridge to a more reactor-like machine stack
  body: 'The strongest public technical evidence is still at the SUNIST-2 and NTST level rather than at any power-producing device. The IAEA SUNIST-2 manuscript gives Startorus something valuable that many startup claims lack: a disclosed intermediate machine with real parameters, first-plasma timing, triangularity range, and specific scientific aims. It shows Startorus is not starting from a slide deck; there is a machine lineage with reconnection-heating experiments, wall-conditioning work, and growing plasma-control capability. NTST is the next step, and public materials describe it less as a finished product than as an engineering bridge. Startorus says NTST is supposed to validate magnets, vacuum systems, cryogenics, power supplies, control systems, and heat exhaust in a geometry closer to later fusion-grade devices. The important nuance is that Startorus''s most eye-catching differentiation — negative triangularity plus spherical tokamak geometry and reconnection heating — is still
    being translated from promising physics and subsystem ideas into an integrated machine proof. Public evidence supports the novelty of the approach, but it also leaves the main scale-up risks on the table.'
