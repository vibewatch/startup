company:
  name: Startorus Fusion
chapter:
  number: 5
  title: Product & Technology
  summary: Startorus Fusion's product story is best understood as a compact spherical-tokamak development stack anchored in SUNIST-2, negative-triangularity NTST, and a supporting diagnostics/control toolchain rather than as a near-term power product. Public evidence supports the distinctiveness of its reconnection-heating and negative-triangularity thesis, but peers still disclose stronger machine proof and Startorus still withholds many of the parameters that would let investors underwrite its 2028-2032 ambitions with confidence.
sections:
- id: product-surface-and-core-thesis
  title: Startorus already exposes a product surface, but the core investment case is still a reactor-development platform
  body: 'Startorus is not yet selling fusion electricity, so the most concrete way to define the product in 2026 is as a reactor-development stack with a small but real hardware surface around it. Public materials show two layers. The first is the future reactor path: high-field spherical tokamaks, negative-triangularity NTST, and later fusion-grade devices intended to turn plasma milestones into a commercial plant program. The second is immediately visible instrumentation and control hardware such as isolation amplifiers, analog integrators, and the CoaxLink Nano acquisition device for plasma diagnostics and HTS-magnet monitoring. That matters because it shows Startorus acting less like a single academic prototype and more like a vertically integrated engineering shop that already builds some of the diagnostic and control plumbing around its machines. The limit is just as important: none of these public products change the fact that the economic thesis still rests on future reactor success,
    not on a disclosed current revenue engine. The core technical bet is a compact HTS spherical tokamak using repetitive magnetic-reconnection heating, which Startorus says should simplify heating hardware versus conventional large-tokamak stacks.'
