  evidenceGaps:
  - type: missing-source
    severity: material
    topic: NTST-operating-envelope
    missingEvidence: Pulse length, repetition rate, duty cycle, and detailed thermal / cryogenic load targets for NTST and later machines.
    whyItMatters: Without those numbers it is hard to judge whether Startorus's compactness thesis survives beyond single-shot or short-pulse demonstrations.
    diligencePath: Request the latest NTST design package or technical investor deck with operating-envelope tables and subsystem budgets.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
    - TE005
  - type: conflicting-data
    severity: material
    topic: roadmap-consistency
    missingEvidence: A single authoritative milestone sequence reconciling the 2027/2029 Jiading roadmap with the 2028/2032 fundraising roadmap.
    whyItMatters: The investment case depends on whether the company is merely rewording milestones or actually changing expected device sequence and timing.
    diligencePath: Ask management for a dated master program plan that maps SUNIST-2, NTST, Startorus One / CTRFR-1, engineering verification, equivalent Q, and demo-reactor targets.
    relatedQuestionRefs:
    - QE016
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: machine-proof-metrics
    missingEvidence: Independent or at least company-published data on achieved Q, neutron output, confinement time, power balance, and sustained-operation performance.
    whyItMatters: These are the metrics that would move Startorus from an interesting architecture story to an underwritable reactor-development story.
    diligencePath: Obtain a technical data room, conference slides with full shot tables, or third-party review of recent machine results.
    relatedQuestionRefs:
    - QE022
    - QE024
    - QE026
  - type: missing-source
    severity: material
    topic: safety-and-software-quality
    missingEvidence: Formal safety program documents, licensing strategy, and software quality or validation procedures for the control stack.
    whyItMatters: As Startorus moves from lab-scale iteration toward larger reactor hardware, safety governance and software assurance become investment-relevant rather than optional.
