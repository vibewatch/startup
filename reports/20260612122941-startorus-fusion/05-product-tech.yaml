- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / process / component
  - role
  - dependency
  - risk
  rows:
  - - PF-coil startup and merging system
    - Creates two plasma rings and drives magnetic reconnection heating
    - Precise coil timing, power-supply performance, and discharge prediction
    - Poor timing or power performance weakens heating and shot repeatability
  - - Central solenoid and current sustainment
    - Maintains ring current after reconnection and helps hold hot plasma
    - Reliable induced electric field and shot control
    - Public data do not show sustained high-performance duty cycle
  - - TF / CS / PF / CC magnet set
    - Provides confinement and shaping for SUNIST-2 and planned NTST operations
    - HTS engineering, current leads, structural supports, and cooling
    - Magnet integration is one of the main steps still being validated
  - - Vacuum vessel and cryogenic system
    - Maintains plasma environment and cools reactor-relevant hardware
    - Complex vessel geometry, vacuum integrity, baking, and cryogenic reliability
    - Startorus has disclosed concept but not full operating loads or lifetime data
  - - Modular power-supply system
    - Powers multiple NTST magnets with standardized series/parallel architecture
    - Internal power-electronics design and manufacturing quality
    - No public endurance or fault-tolerance data
  - - Diagnostics and control stack
    - Measures plasma behavior, reconstructs signals, and supports shot operations
    - Sensors, synchronized acquisition, algorithms, and operating software
    - No published control-software QA regime or independent benchmark
  - - Wall conditioning and heat exhaust
    - Reduces impurities and handles heat as devices move toward reactor relevance
    - Lithium coating, divertor performance, and materials resilience
    - Heat handling at scale remains unresolved in public evidence
  notes: This architecture table mixes disclosed hardware, software, and operating processes because Startorus itself presents machine progress as an integrated engineering stack.
