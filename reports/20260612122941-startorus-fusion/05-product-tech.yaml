  - TE004
- id: adverse-feasibility-view
  title: The physics thesis is interesting, but the hardest commercial fusion risks remain outside Startorus-specific marketing
  body: 'The adverse view on Startorus is not that the company lacks ideas; it is that the entire sector still faces hard, slow engineering problems that public startup narratives can compress too aggressively. Independent negative-triangularity literature is supportive on some dimensions, but it is not uniformly bullish: it flags stability trade-offs, operating-regime constraints, and the need to satisfy multiple shaping and safety-factor conditions before the configuration looks reactor-ready. The SUNIST-2 manuscript itself is similarly sober, stating that high-field confinement validation, optimal scenarios, and efficient heating are still unresolved for spherical-tokamak commercialization. Holdren''s Belfer essay broadens the caution to the whole D-T fusion enterprise by highlighting tritium management, neutron damage, continuous-operation stress, and waste handling. Those concerns are not specific accusations against Startorus, but they matter because Startorus''s public roadmap ultimately
    points toward the same commercial-fusion destination. The right underwriting interpretation is therefore neither dismissive nor euphoric: Startorus has a technically differentiated path worth tracking, but the next de-risking step has to be measured machine proof rather than another ambitious milestone headline.'
  claimRefs:
  - CE027
