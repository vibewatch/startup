  topStrengths:
    - >-
      Tsinghua-rooted team and real spherical-tokamak lineage give Startorus more technical credibility than a generic
      fusion concept.
    - >-
      Shanghai and Jiading backing provide unusually strong capital access, policy support, land, and industrial
      ecosystem alignment.
    - >-
      2026 funding velocity was exceptional, with RMB 1.5 billion raised across the Series A and A+ rounds and
      cumulative capital above RMB 2 billion.
    - >-
      The company has at least limited early commercialization evidence through electronics, diagnostics, power-control,
      and related subsystem sales.
    - >-
      Public roadmap milestones are concrete enough to define the next de-risking checkpoints around NTST and 2028
      engineering validation.
  topRisks:
    - >-
      No publicly disclosed fusion-power customer, utility offtake, hyperscaler PPA, or bankable demand proof exists
      yet.
    - >-
      The 2028 engineering-validation and early-2030s demo timeline compresses many first-of-kind machine, magnet, and
      site-execution steps.
    - >-
      Public evidence still lacks reactor-grade operating data, licensing sequence, tritium strategy, and waste or
      fuel-cycle plan.
    - >-
      The company remains dependent on follow-on capital and could face dilution or a lower-mark raise if milestones
      slip.
    - >-
      Strategic and policy-backed investors may support the company through longer timelines, but that can also weaken
      disclosure and valuation discipline.
  unresolvedGaps:
    - >-
      Current cap table, investor rights, liquidation preferences, and anti-dilution terms from the 2026 rounds are not
      public.
    - A detailed 2027-2032 budget, burn profile, and cash-runway plan have not been disclosed.
    - Independent plasma-performance evidence and reactor-grade metrics are still missing from the public record.
    - The China-specific licensing, tritium, fuel-cycle, and activated-material-disposal workplan is not yet public.
    - >-
      Public evidence still does not show named future power buyers or firm demand beyond electronics and subsystem
      sales.
