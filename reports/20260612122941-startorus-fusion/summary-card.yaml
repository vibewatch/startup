summary:
  headline: >-
    Startorus Fusion looks like one of China's more credible private fusion platforms, but the current unicorn valuation
    still depends more on milestone delivery, policy support, and future disclosure than on proven commercial traction.
  overallScore: 5.9
  recommendation: research-more
