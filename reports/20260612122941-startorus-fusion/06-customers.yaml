    missingEvidence: Named utilities, hyperscalers, industrial baseload users, government buyers, LOIs, MOUs, or draft PPAs tied to future Startorus power projects.
    whyItMatters: The core underwriting gap is still whether technical progress can convert into bankable energy procurement.
