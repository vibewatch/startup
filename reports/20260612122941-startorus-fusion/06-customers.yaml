- id: TU003
  title: Named customer proof table
  enumeration: true
  enumerationScope:
    coverage: partial
    basis: Public evidence shows a handful of named or at least segment-specific counterparties, but most actual equipment buyers are still undisclosed. The table therefore mixes named customer proxies with explicit unnamed-buyer proof.
  columns:
  - Customer / counterparty
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / proof
  - Limitation
  rows:
  - - Universities and research institutions (undisclosed)
    - Research-lab buyers
    - Purchase of Startorus Electronics instrumentation and control products
    - Production electronics sales
    - Company says products are already sold to universities and research institutions
    - No institution names, contract values, or repeat-purchase data
  - - Research institutions and industrial customers (undisclosed)
    - Mixed lab and industrial buyers
    - Early revenue from fusion-related electronics and power-control equipment
    - Production electronics sales
    - Jiemian says the subsidiary is already generating early revenue
    - Customer list, revenue split, and margins are all undisclosed
  - - Tsinghua University
    - Research-platform user and origin collaborator
    - Joint development and use of SUNIST-2
    - Active research deployment
    - Repeatedly named as the collaboration base behind SUNIST-2
