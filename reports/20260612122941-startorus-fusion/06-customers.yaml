figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: Startorus's public customer journey currently begins with subsystem or lab engagement, not with a utility PPA.
  data:
    items:
    - id: discover
      label: Discover technical need
      actor: Research lab, industrial engineering team, or public-sector sponsor
      description: The first visible demand surface is not electricity procurement but a need for diagnostics, pulsed power, or fusion-program participation.
      channels:
      - Startorus product center
      - Funding news
      - Jiading project publicity
    - id: evaluate
      label: Evaluate subsystem proof
      actor: Lab buyer or engineering evaluator
      description: Buyers can assess electronics, data-acquisition, and control hardware before they ever evaluate a power plant.
      channels:
      - Product pages
      - Technical demonstrations
      - Partner writeups
    - id: transact
      label: Buy equipment or support project
      actor: University, research institution, industrial buyer, or local government counterparty
      description: Current evidence shows equipment sales and project-support relationships rather than energy offtake.
      channels:
      - Startorus A+ announcement
      - Jiemian
      - Shanghai / Jiading government pages
    - id: validate
      label: Validate reactor-development credibility
      actor: Strategic partner or future power buyer
      description: Future energy buyers will likely watch NTST, Startorus-1, and equivalent-Q milestones before entering procurement.
      channels:
      - Technical milestones
      - Major-project updates
      - Independent sector coverage
    - id: procure-power
      label: Negotiate power procurement
      actor: Utility, industrial, maritime, or hyperscale buyer
      description: This stage is still hypothetical for Startorus and would require a long, reference-heavy enterprise sales process.
      channels:
      - Direct enterprise BD
      - Public-private partnership
      - Bilateral PPA discussions
    - id: expand
      label: Expand to multi-site deployments
      actor: Repeat strategic buyer
      description: Expansion would depend on the first deployment becoming a credible reference plant; no such loop is public yet.
      channels:
      - Reference site
      - Follow-on PPAs
      - Industrial cluster partnerships
