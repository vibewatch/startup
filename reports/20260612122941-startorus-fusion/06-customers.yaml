company:
  name: Startorus Fusion
chapter:
  number: 6
  title: Customers
summary: >-
  Startorus Fusion has no disclosed fusion-electricity customers, PPAs, or LOIs as of June 2026.
  The only public customer proof sits lower in the stack: Startorus says its electronics
  subsidiary already sells diagnostic and power-control products to universities, research
  institutions, and some industrial users, while Jiading district and strategic industrial
  investors act more like sponsors and ecosystem validators than bankable power buyers. The
  eventual buyer logic is plausible for utilities, distributed/offshore power, and other
  high-load users, but conversion from lab sales to multi-decade energy procurement remains
  unproven and is the chapter's core adverse risk.
sections:
- id: SU001
  title: 'Reality check: there are still no public fusion-power customers, only early equipment buyers and sponsor relationships'
  body: >-
    The first customer conclusion is negative but important: Startorus has no publicly disclosed
    fusion-electricity customer, utility offtaker, hyperscaler PPA, or industrial power purchase
    commitment as of June 2026. The company still frames exported electricity as an early-2030s
    event, not a current commercial reality. Public customer proof therefore sits one layer down,
    in Startorus Electronics and in partner-like relationships around the Jiading base. Startorus's
    own A+ materials say its signal-conditioning, acquisition, sensing, and pulsed-power products
    are already sold to universities and research institutions, and Jiemian says the subsidiary is
    generating early revenue from research institutions and industrial customers. That is materially
    better than pure pre-customer fusion narratives, but it does not prove that any future utility,
    data-center, or industrial baseload buyer is ready to sign a long-dated fusion-energy contract.
    The current buyer/user/payer map is therefore highly uneven: today's real users appear to be
    labs and engineering teams buying instrumentation, while tomorrow's intended power buyers are
    still mostly aspirational segments rather than disclosed pipeline names.
