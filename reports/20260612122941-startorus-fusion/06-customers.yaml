tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Current proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Universities and research institutions
    - Buyer and payer appear to be labs or institutions; users are plasma, diagnostics, and controls teams
    - Purchase of signal-conditioning, acquisition, sensing, and pulsed-power products
    - Startorus says products are already sold to universities and research institutions
    - Real but likely small current revenue; strongest direct customer proof today
    - No named institutions, contract values, reorder rates, or concentration disclosure
  - - Industrial electronics and engineering customers
    - Buyer and payer appear to be industrial engineering teams; users are technical operators
    - Fusion-related electronics and power-control equipment
    - Jiemian says the subsidiary generates early revenue from research institutions and industrial customers
    - Useful proof that demand extends beyond academia
    - No named logos, revenue split, or product-level margins disclosed
  - - Tsinghua-linked research user base
    - User is the joint machine-development and physics team; payer is not publicly disclosed
    - SUNIST-2 research platform and machine iteration
    - Startorus repeatedly says SUNIST-2 was developed in collaboration with Tsinghua University
    - High strategic value as a real reference user and origin partner
    - Collaboration is not proof of an external paying customer relationship
  - - Jiading district / Shanghai public counterparties
    - Buyer-like sponsor is local government; users are Startorus R&D and project teams
    - Experimental-base siting, project facilitation, and policy support
    - Public strategic cooperation agreement and major-project designation are disclosed
    - Important non-dilutive validation and deployment support
    - Government sponsorship does not equal recurring customer demand for electricity
  - - Industrial ecosystem partners and investor-proxies
    - Buyers are not disclosed; current named counterparties are Deye and CIMC HuanKe as strategic backers
    - Supplier development, maritime or offshore application exploration, and future equipment cooperation
    - Deye and CIMC discuss industrial application potential and supplier roles
    - Strengthens commercialization ecosystem and future channel credibility
    - Still no signed power offtake or disclosed recurring product spend
  - - Future utility and grid buyers
    - Buyer would be utility or grid-connected project developer; payer tied to long-dated power contracts
    - Baseload or clean firm power procurement
    - No public Startorus utility customer has been named
    - Potentially the largest long-run revenue pool
    - No utility-specific pipeline, siting, licensing, or interconnection proof disclosed
  - - Future distributed, offshore, and maritime buyers
    - Buyer could be offshore-platform operator, ship owner, or microgrid operator
    - Compact power for distributed stations, vessels, or remote installations
    - Company and partner materials explicitly point to these scenarios
    - Differentiated segment if compactness matters more than grid integration
    - Safety, certification, and deployment path remain entirely unproven in public sources
  - - Future hyperscale and industrial baseload buyers
    - Buyer would be hyperscaler or large industrial operator; users are data centers or industrial sites
    - 24/7 low-carbon electricity for compute or continuous processes
    - Buyer appetite is evidenced by peer fusion PPAs, not by Startorus-specific disclosures
    - Large strategic upside if fusion procurement becomes a real category in China
    - No Startorus-specific customer names, pilots, or negotiation evidence disclosed
  notes: Rows separate current evidence-backed customer surfaces from future buyer hypotheses. Future rows are segment logic, not disclosed Startorus contracts.
