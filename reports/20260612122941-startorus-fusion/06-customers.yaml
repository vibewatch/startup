- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Impact
  - Diligence path
  rows:
  - - Convert instrumentation buyers into reactor references
    - Labs may validate components without ever becoming plant buyers
    - Early sales can overstate true customer de-risking
    - Separate subsystem buyers from prospective energy buyers in the pipeline review
  - - Lean on Jiading and Shanghai public support
    - Public support is geographically concentrated and potentially policy-dependent
    - Strong local execution help, but concentration in one ecosystem raises path-dependency risk
    - Request support agreements, milestone conditions, and contingency plans outside Shanghai
  - - Build around unnamed current customers
    - Undisclosed logos limit referenceability in later enterprise sales
    - Harder to shorten future procurement cycles without citeable proof
    - Ask for named customer references under NDA and detailed case studies by product line
  - - Target maritime / offshore niches first
    - These niches need severe safety and certification proof before purchase
    - Could be strategically differentiated but practically slow to close
    - Request certification path, design basis, and any maritime counterparties already in discussion
  - - Pursue utilities or hyperscalers later
    - No current anchor power buyer means the company may face a long first-of-a-kind sales cycle
    - Delays revenue timing and raises financing needs before commercialization
    - Request detailed GTM milestones from Q>1 to first signed PPA
  - - Depend on a small number of strategic industrial backers
    - Investor enthusiasm can fade if reactor milestones slip
    - Commercialization support may prove less durable than headline financing
    - Request rights, follow-on commitments, and non-financial partnership obligations from strategic investors
  notes: Expansion logic exists, but every major path still hinges on technical proof that has not yet been delivered.
