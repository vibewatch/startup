  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-current-customer-list
    missingEvidence: Names, contract values, and reorder histories for the universities, research institutions, and industrial buyers already referenced by Startorus and media.
    whyItMatters: The chapter can prove current product sales exist, but not whether those customers are referenceable, diversified, or recurring.
    diligencePath: Request top-customer list by product line, contract value, reorder history, and at least three reference calls.
    relatedQuestionRefs:
    - QU004
    - QU013
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration-metrics
    missingEvidence: Customer concentration, reorder cadence, returns or warranty data, NRR, GRR, churn, and satisfaction metrics for the electronics business.
    whyItMatters: Without these metrics, investors cannot tell whether current customer proof is durable or just a handful of one-off engineering purchases.
    diligencePath: Request customer dashboards showing top buyers, repeat-purchase rate, gross revenue retention, complaint rate, and any support SLA history.
    relatedQuestionRefs:
    - QU011
