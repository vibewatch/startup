- id: SU004
  title: The adverse view is that customer conversion remains speculative until Startorus can prove reactor performance, durability, and procurement readiness
  body: >-
    The adverse customer case is straightforward. Startorus may have authentic early product sales,
    visible public-sector backing, and a credible industrial ecosystem around Shanghai, but none of
    that yet answers the core underwriting question: who will buy fusion electricity from Startorus,
    on what terms, and after which proof milestone? External skeptical sources stay focused on that
    gap. MIT Technology Review notes that fusion companies are raising capital and even signing huge
    power agreements before working plants exist, and stresses that major developers still do not
    have operating reactors. DOE's 2026 roadmap likewise says critical materials, fuel-cycle,
    component, and engineering gaps remain before fusion can reliably reach the grid. That means
    Startorus faces a double conversion problem. First, it must convert research and subsystem demand
    into reference-grade system credibility. Second, it must convert technical credibility into
    utility-style, hyperscaler-style, or industrial-style procurement with long diligence cycles,
    permitting demands, and reliability requirements far beyond a lab-instrument sale. The prudent
    customer verdict is therefore cautious: early ecosystem pull is real, but real power-market pull
    is still unproven, unnamed, and likely years away.
  claimRefs:
  - CU001
