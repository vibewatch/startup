  - CU013
  - CU014
  - CU017
  - CU018
  - CU022
  - CU037
  - CU040
  - CU042
- id: TU006
  title: Buyer procurement hurdles table
  columns:
  - Target segment
  - What they would buy
  - Minimum proof likely required
  - Likely buying motion
  - Blocker today
  - Investor implication
  rows:
  - - Utilities / grid buyers
    - Long-dated baseload clean-power offtake
    - Stable reactor performance, licensing path, siting, interconnection, and price visibility
    - Bilateral project development and regulatory diligence
    - No Startorus utility customer, site-specific project, or regulatory package disclosed
    - Utility GTM should be treated as long-cycle and highly back-loaded
  - - Hyperscalers / data-center operators
    - 24/7 clean power for AI and cloud loads
    - Reference plant credibility, delivery certainty, and contractable power timeline
    - Direct corporate PPA or strategic capacity reservation
    - Startorus has no disclosed hyperscaler engagement despite strong external market logic
    - Demand may be real, but pipeline evidence is absent
  - - Heavy industry / baseload plants
    - Reliable low-carbon electricity for continuous operations
    - Availability, outage tolerance, integration economics, and site fit
    - Direct enterprise sale with long technical diligence
    - No disclosed steel, chemical, hydrogen, or ammonia buyer relationship
    - Industrial GTM remains thesis-level rather than evidenced
  - - Distributed-power / remote installations
    - Compact clean power for remote or islanded loads
    - Compactness proof, safety case, and serviceability
    - Project-by-project engineering sale
    - No pilot deployment disclosed
    - Could be differentiated, but only after hardware proof
  - - Offshore platforms
    - High-density power for offshore or deep-sea operations
    - Extreme reliability, marine certification, and safety approvals
    - Strategic industrial or SOE-led procurement
    - Only scenario-level company and partner statements exist
    - Interesting wedge segment, but currently speculative
  - - Large-vessel propulsion
    - Onboard power or propulsion system integration
    - Maritime certification, thermal management, and long-life maintenance proof
    - Very long-cycle capital procurement
    - No vessel partner or pilot has been named
    - Do not underwrite near-term revenue here
  - - Government research / public-private programs
    - Funding, milestone contracts, or hosted research infrastructure
    - Technical credibility plus alignment with public research goals
    - Milestone-based public-private partnership or local industrial policy support
    - Startorus has local-government support but no disclosed national fusion procurement program customer
    - Government-backed demand may arrive earlier than commercial utility demand, but at lower direct revenue quality
  notes: This table mixes company-stated target scenarios with external procurement analogs and should be read as a GTM-hurdle map, not as disclosed customer pipeline.
