  evidenceGaps:
  - id: EGO001
    type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: Public sources do not disclose a current board roster, board committees, or exact cap-table ownership percentages.
    whyItMatters: Founder control, investor rights, and dilution sensitivity directly affect governance and financing risk in a capital-intensive company.
    diligencePath: Request the latest cap table, board observer list, voting thresholds, and any side letters or strategic-rights agreements.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO002
    - TO003
  - id: EGO002
    type: private-evidence-only
    severity: material
    topic: commercial-revenue
    missingEvidence: Public sources do not disclose revenue, signed electricity offtake contracts, customer deposits, or any current recurring commercial sales base for the fusion program.
    whyItMatters: Without commercial-revenue evidence, valuation must rest almost entirely on technical progress and financing optionality.
    diligencePath: Request any paid pilot, equipment-sales, grant, or engineering-services revenue breakout plus customer-contract status.
    relatedQuestionRefs:
    - QO026
  - id: EGO003
    type: missing-source
    severity: material
    topic: headcount-precision
    missingEvidence: Public pages describe the team as both 100+ and nearly 180 employees, but do not provide a dated exact headcount or org split.
    whyItMatters: Staffing scale is a useful proxy for burn, technical capacity, and execution readiness, especially in fusion hardware programs.
    diligencePath: Request a dated headcount snapshot by R&D, manufacturing, construction, software, and corporate functions.
    relatedQuestionRefs:
    - QO005
  - id: EGO004
    type: missing-source
    severity: material
    topic: enumeration-coverage
    missingEvidence: Public disclosures name major milestones and apparatus plans, but do not provide auditable milestone-completion criteria for the 2028 engineering-verification target.
    whyItMatters: A vague milestone can be interpreted optimistically by investors even when the actual de-risking threshold is lower than assumed.
    diligencePath: Request the internal definition of engineering verification, the Q or power thresholds involved, and the hardware subsystems that must pass.
    relatedQuestionRefs:
    - QO020
    - QO023
    relatedTableRefs:
    - TO004
