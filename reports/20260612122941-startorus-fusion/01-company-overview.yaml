- id: apparatus-roadmap-and-milestones
  title: Apparatus Pipeline, Sites, and Execution Milestones
  body: >-
    The current execution story is organized around three apparatus generations. SUNIST-2, run with Tsinghua, is the operating validation platform and is the main proof-point behind company claims that the route can be built and iterated quickly. NTST is the next engineering step and is presented as the world's first native negative-triangularity spherical tokamak, with installation tied to the Jiading base. CTRFR-1 is the larger proof-of-path machine that Startorus says will test whether its spherical-tokamak and repetitive-reconnection approach can scale toward fusion-grade performance. Official materials consistently tie these programs to Jiading-base construction, HTS magnet production, and AI-assisted plasma-control work.


    The roadmap dates are aggressive but internally consistent. Startorus says engineering verification should be completed around 2028, after which the company wants to begin building a commercial demonstration reactor and then deliver a power-producing fusion demonstration reactor around 2032. The important diligence distinction is that 2028 is not a revenue milestone; it is an engineering milestone. Likewise, the 2032 objective is still phrased as a demonstration reactor rather than a mature power business. That framing lowers the risk of reading the schedule as a promise of immediate grid economics, but it still leaves very little room for apparatus delays, superconducting-magnet setbacks, or site-construction slippage.
