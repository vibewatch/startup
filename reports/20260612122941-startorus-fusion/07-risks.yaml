- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Timeline compression across financing and engineering
    - Critical-path milestone slippage
    - NTST civil, procurement, or commissioning milestones slip by multiple quarters without compensating proof elsewhere.
    - Re-rate commercialization timeline and assume another funding round before reactor-grade evidence.
  - - Regulatory / fuel-cycle non-readiness
    - No disclosed licensing and fuel-cycle package
    - By the next major financing or machine milestone, the company still lacks a concrete tritium, waste, and approvals plan.
    - Treat deployment claims as research milestones only, not investable commercialization milestones.
  - - Magnet / materials procurement fragility
    - Long-lead supplier stress
    - Rare-earth controls tighten further, supplier contracts are delayed, or alternative sourcing remains unspecified.
    - Increase schedule-risk discount and demand procurement contingency evidence before underwriting capex.
  - - Capital-dependence escalation
    - Rescue-style financing behavior in peers or company
    - Follow-on capital is raised on visibly defensive terms or after workforce / scope cuts.
    - Assume dilution and downshift confidence in the 2032 narrative unless technical proof meaningfully improves.
  - - Key-person and org-depth concentration
    - Retention or hiring misses in specialist functions
    - Open critical roles remain unfilled for long periods or senior technical turnover rises.
    - Treat integration schedule as fragile and ask for succession / bench-depth proof before increasing conviction.
  - - Commercialization credibility gap
    - No reactor-grade operating proof or customer-side validation
    - The company reaches another roadmap headline without disclosing integrated operating metrics, licensing milestones, or buyer/regulator engagement.
    - Cap valuation upside to option value on technical progress rather than near-term plant commercialization.
  notes: These kill criteria are designed to turn abstract fusion risk into monitorable events investors can track between funding rounds.
