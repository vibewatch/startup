- id: technology-supply-chain-and-commercialization
  title: The technology thesis is differentiated, but the hardest engineering and supply-chain risks remain sector-scale
  body: 'Startorus’s negative-triangularity spherical-tokamak strategy gives the company a sharper technical identity than a generic compact-fusion story, but differentiation is not the same as de-risking. The retained technical literature is more nuanced than company marketing. One negative-triangularity paper highlights meaningful promise for steady-state confinement and divertor performance, yet also states that broad-pressure-profile configurations can be more unstable for low-n MHD modes and may struggle to achieve H-mode confinement. A later integrated design-space study frames the choice between positive and negative triangularity as a trade-off among operating constraints, capital cost, tritium breeding ratio, power-exhaust limits, and high-field magnet assumptions rather than as a one-way simplification. That matters because Startorus’s public pages still read as pre-proof for the next-step machine: the NTST announcement is a readiness statement, not a demonstration of reactor-grade
    availability, Q, pulse length, tritium systems, or neutron damage resilience. Supply chain evidence points in the same direction. Sector reports and peer examples keep stressing HTS magnets, tritium, specialist materials, and custom manufacturing as critical bottlenecks. Even other fusion companies with stronger public machine proof are still pairing their roadmaps with external magnet partners, public-private milestone programs, or explicit supply-chain work. Startorus therefore looks more like an ambitious first-of-kind integrator than a machine builder already through its hardest technical choke points.'
