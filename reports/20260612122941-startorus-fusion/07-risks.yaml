- id: people-capital-and-kill-criteria
  title: Capital, talent depth, and partner concentration can amplify every other risk
  body: 'The execution layer is where many fusion stories break even when the underlying science remains interesting. Startorus’s public funding history is strong for a Chinese private fusion startup, but it still implies heavy dependence on continued external support because the company has no disclosed fusion-power revenue, no public offtake support, and no external operating proof that would make later capital raises purely opportunistic. The best independent sector analogues show how quickly the financing narrative can change: General Fusion moved from long-standing credibility into layoffs, a scaled-back program, a lifeline financing, and then a SPAC attempt before breakeven; Zap openly added a fission business because fusion-to-grid timelines remained too far out for current electricity demand. Startorus also remains a specialist-talent story. Its own jobs page and university recruiting posts show open demand across magnets, cryogenics, pulsed power, diagnostics, and control systems.
    That breadth is encouraging because it suggests real build activity, but it also means execution can be delayed by shortages or turnover in any one hard-to-replace function. Public patent evidence and recruiting evidence together suggest a young organization still building institutional depth. The investment consequence is clear: Startorus should be monitored less like a software roadmap and more like a capital-intensive program where org maturity, procurement discipline, and milestone credibility decide whether technical promise survives long enough to matter.'
