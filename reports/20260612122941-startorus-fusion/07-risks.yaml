  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: China licensing path
    missingEvidence: A documentable China-specific approvals map covering radiation controls, tritium handling, waste, environmental review, and machine commissioning for NTST and later devices.
    whyItMatters: Without a named approvals sequence, investors cannot tell whether the roadmap is being paced by engineering or by invisible permitting dependencies.
    diligencePath: Request the complete regulator-and-permit tracker with filing dates, owning teams, status, and next gating approvals.
    relatedQuestionRefs:
    - QR007
    - QR026
    - QR031
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: Integrated machine metrics
    missingEvidence: Latest subsystem and machine performance dashboards showing pulse length, plasma parameters, reliability, cryogenic readiness, neutron expectations, and any Q-adjacent metrics.
    whyItMatters: The company’s commercial timeline cannot be underwritten from funding headlines alone; the missing proof is operating evidence.
    diligencePath: Request the latest internal technical review pack and milestone acceptance criteria for NTST and Startorus One.
    relatedQuestionRefs:
    - QR018
    - QR019
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: Supplier resilience
    missingEvidence: Contracted vendor list, lead times, inventory buffers, QA status, and contingency plans for HTS magnets, rare-earth inputs, cryogenics, vacuum systems, and pulsed power.
    whyItMatters: Public sources show the supply-chain risk category clearly, but not Startorus’s actual preparedness against it.
    diligencePath: Request procurement tracker, top-20 long-lead items, and a supplier substitution plan by subsystem.
    relatedQuestionRefs:
    - QR027
    - QR030
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: Key-person retention and org depth
    missingEvidence: Org chart below founders, retention data for critical technical leaders, and explicit succession coverage for magnets, cryogenics, controls, and program management.
    whyItMatters: A first-of-kind fusion machine can slip materially if one or two specialist leaders become bottlenecks or depart.
    diligencePath: Request a key-role dependency matrix, attrition history, and board-reviewed succession or deputy coverage plan.
    relatedQuestionRefs:
    - QR024
    - QR029
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: Commercialization proof
    missingEvidence: Evidence of buyer-side, grid-side, or regulator-side engagement beyond municipal support and fundraising announcements.
    whyItMatters: The current roadmap still reads like an R&D-to-demo narrative more than a validated plant-development funnel.
    diligencePath: Ask for utility, industrial, or grid counterpart discussions; site-development memos; and any commercial diligence milestones tied to the post-NTST phase.
    relatedQuestionRefs:
    - QR019
    - QR032
    relatedTableRefs:
    - TR005
