company:
  name: Startorus Fusion
chapter:
  number: 7
  title: Risks
  summary: 'Startorus Fusion’s risk profile is dominated by timetable compression across too many hard fronts at once: a first-of-kind negative-triangularity spherical-tokamak program, heavy dependence on continued financing and municipal execution in Jiading, and a sector-wide supply chain that still lacks easy answers on tritium, HTS magnets, materials durability, and export-control friction. Public sources support the seriousness of the company’s capital base and local-policy backing, but they do not yet provide the reactor-grade operating data, licensing path, or fuel-cycle plan that would turn a 2028-to-2032 narrative into an underwritten deployment case.'
sections:
- id: risk-stack-and-timeline
  title: The core risk is cumulative schedule slippage, not a single fatal flaw
  body: 'Startorus now has enough public momentum that the right adverse question is no longer whether the company exists or can raise money; it is whether enough independent bottlenecks can be closed on the company’s stated timeline. The company has raised over RMB 2 billion, secured Jiading government support, and publicly mapped a path from SUNIST-2 to NTST and then to a power-producing demonstration reactor. Those are real strengths. They also create a more exacting burden of proof because each milestone now depends on synchronized progress in machine integration, materials, magnets, cryogenics, tritium or fuel-cycle planning, regulatory preparation, and specialist hiring. Official U.S. and congressional fusion sources still describe the sector as facing unresolved scientific, engineering, fuel-cycle, and permitting gaps even for the best-funded developers. Adverse sector examples reinforce the same point from the market side: when timelines stretch, fusion startups do not fail neatly
    on one physics result; they get squeezed by funding terms, side-business pivots, workforce cuts, or project resets. For Startorus, that makes schedule risk the organizing lens for the whole chapter. If NTST integration, supplier delivery, or licensing preparation slips, the impact is not isolated. It can weaken partner confidence, complicate follow-on financing, and postpone the first moment when outside investors can test the company’s claims against reactor-grade evidence rather than roadmap language.'
