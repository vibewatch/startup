  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: technical-controls
      missingEvidence: "A current architecture and control package covering service boundaries, identity, data lineage, encryption, access review, monitoring, incident response, disaster recovery, and model governance."
      whyItMatters: "Yubi spans high-stakes lending, investment, and collections workflows, so product breadth cannot establish consistent security, privacy, resilience, or explainability."
      diligencePath: "Request architecture diagrams, API and integration documentation, SOC 2 or ISO evidence if available, penetration-test summaries, RTO/RPO, incident register, and AI model-risk policies."
      relatedQuestionRefs: [QE006, QE008]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: reliability
