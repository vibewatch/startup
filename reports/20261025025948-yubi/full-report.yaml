  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is debt-market workflow infrastructure, not the full principal value of Indian credit.
              Included activity comprises discovery, matching, underwriting, documentation, execution, monitoring,
              collections, securitisation, and distribution tools used by enterprises, banks, NBFCs, and investors. Yubi
              is described across third-party, investor, and supplier sources as spanning loans, co-lending, pool
              finance, supply-chain finance, bonds, and collections. The boundary excludes bank balance-sheet capital,
              loan and bond principal, and unrelated consumer origination because those values are not platform revenue.
              The status quo remains fragmented: BadCredit.org's interview-based account describes calls, emails, and
              data exchanges in loan applications and says co-lender integration can take three to six months because of
              legal, operational, and security reviews. Yubi's opportunity is therefore the friction around debt
              transactions, not every rupee of debt outstanding.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.2'
        title: Multiple sizing lenses and their limits
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports several non-additive market lenses. Economic Times Spotlight, in content
              for which the featured brand bears responsibility, reports a ₹226 lakh crore Indian bond market, including
              more than ₹53.6 lakh crore of corporate bonds outstanding, and ₹9.9 lakh crore of FY25 corporate-bond
              issuance, up 28% year over year. Business Standard separately reports approximately ₹73,000 crore of
              securitisation in Q2FY26 versus ₹70,000 crore a year earlier, while CRISIL's cited H1FY26 measure was
              ₹1.24 trillion, up 8% from ₹1.15 trillion. These measures cover different stocks, flows, periods, and
              participant sets. They demonstrate activity around workflows Yubi serves, but they cannot be summed or
              multiplied by an assumed take rate to produce a defensible TAM, SAM, SOM, or revenue estimate.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buying motion is multi-sided. Enterprises and MSMEs use debt-access and receivables workflows; banks
              and NBFCs fund, underwrite, originate, and monitor credit; institutional investors evaluate and allocate
              capital; and Yubi's 2026 company release extends the investor-side proposition to family offices, HNIs,
              and institutional allocators. Multiples characterises the business as B2B with a commission revenue model,
              but no retained source discloses segment-level pricing or budget ownership. Demand is supported by credit
              activity: RBI reports 15.9% year-over-year bank-credit growth to the commercial sector and 13.3% growth
              from non-bank sources in FY2025-26. Adoption is constrained by regulated workflows and market structure.
              TReDS requirements include transparent multi-financier bidding, MSME validation, assignment notices, cyber
              audits, and a ₹25 crore net-worth threshold; sponsored corporate-bond commentary also points to
              concentrated institutional holdings and uneven secondary-market liquidity.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Sizing and adoption diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not disclose Yubi's product-level take rates, fee-bearing transaction volume,
              conversion rates, retention, or market share by workflow. Public descriptions also mix facilitated debt
              volume, enterprises, lenders, and investors without a consistently dated denominator. A diligence-grade
              sizing bridge must begin with each product's eligible transaction population, remove activity handled
              outside Yubi, identify the actual payer and pricing unit, and then apply evidenced adoption and retention
              assumptions. That bridge should be built separately for marketplace lending, co-lending, supply-chain
              finance, securitisation, bond distribution, collections, and asset management. Until management provides
              audited cohort and monetisation data, the broad market figures should serve as directional context only,
              and valuation should use sensitivity ranges rather than a single headline market estimate.
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Yubi competes for the job of moving credit from borrowers to capital providers, not only for a software
              budget. Its own product surface describes credit infrastructure and integrations, while independent and
              partner descriptions place the platform across discovery, execution, fulfillment and collections. That
              creates a broad direct category: debt marketplaces and embedded credit infrastructure. Recur Club is a
              visible adjacent marketplace for startups and SMEs, with debt products tailored to business stage and a
              lender-partner network. Incumbent banks, NBFCs and internal lender workflows remain substitutes because
              they can retain origination, underwriting and servicing in-house. A borrower can also use a specialist
              bond, co-lending or collections provider rather than a unified stack. The evidence therefore supports a
              landscape of direct platforms, specialist adjacencies, regulated balance-sheet incumbents, internal build
              and manual status quo processes; it does not support a complete market census or a claim that any named
              competitor matches Yubi's entire scope.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: Capability, distribution and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Yubi's defensibility appears to come from combining several workflow layers with distribution and data
              feedback. CardRates reports a unified platform spanning the debt lifecycle and describes a network of more
              than 750 lenders and 3,000 verified borrowers; TVS Capital separately describes five group companies and
              reports debt volumes above ₹1,40,000 crore with 17,000+ enterprises and 6,200+ investors and lenders.
              These figures differ in scope and period, so they should not be combined into one funnel or treated as
              independently audited. NetBramha's customer work provides a narrower proof point around bond discovery,
              onboarding and investor tracking, including ₹13+ crore processed and a stated 45% market share in MLDs.
              The differentiation is consequently strongest where a buyer values multi-party workflow coordination,
              embedded underwriting or collections, and visibility across a transaction. It is weaker where a buyer
              needs transparent realized pricing, independently benchmarked approval performance or a single-purpose
              component. Public evidence does not establish that Yubi's integrations or data advantages are hard to
              replicate, nor does it establish switching costs or multi-homing rates.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP012
      - number: '3.3'
        title: Moat durability, pricing uncertainty and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat case is conditional. A larger network can improve matching and lender choice, while workflow
              standardization can reduce manual coordination; however, those benefits depend on sustained lender
              participation, data quality, compliance controls and the willingness of banks and NBFCs to expose core
              processes to a platform. The public record supplies no comparable competitor price sheet, take rate,
              retention cohort or implementation-cost benchmark. Lapaas identifies platform services fees, collection or
              interest revenue, fee-based services and corporate database offerings in Yubi's FY24 model, but those are
              company-model descriptions, not a competitor-normalized price comparison. A competitor can therefore
              displace Yubi through a narrower low-cost workflow, a bank's internal build, a balance-sheet relationship,
              or a regulated distribution channel even if Yubi remains broader. Recur Club demonstrates that a narrower
              debt marketplace can target a distinct startup and SME segment. The key diligence question is whether
              Yubi's breadth produces measurable customer retention and margin advantages rather than merely
              product-surface breadth.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated workflow is the clearest differentiator
            body: >-
              Yubi is described across discovery, execution, fulfillment, underwriting and collections, with
              integrations and lender distribution; this is a stronger differentiation signal than any unsupported claim
              of lowest price.
            calloutType: strength
            claimRefs:
              - CP001
              - CP006
              - CP007
          - type: callout
            title: Breadth is not yet proven as a durable moat
            body: >-
              Public evidence does not disclose comparable retention, realized pricing, implementation cost, approval
              quality or switching-cost data, leaving displacement by specialists, incumbents or internal builds
              unresolved.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Public material supports several monetization lines but not an audited revenue bridge. Lapaas Voice
              reports FY24 platform-services fees of ₹220.54 crore, equal to 45.6% of operating income, alongside
              ₹133.95 crore of collection revenue or interest on loans, ₹89.38 crore of fee-based services, and ₹44.46
              crore of corporate-database offerings. These figures describe accounting revenue categories, not ARR,
              contracted backlog, or cash collections. More recent third-party pages use materially different labels:
              Inc42 displays “Revenue” of ₹394.7 crore-plus for FY25, while Multiples VC reports “operating revenue” of
              ₹660.1 crore for FY25. Their consolidation perimeters and accounting definitions are not supplied, so
              deriving growth, mix, or margins across the two would create false precision.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Monetization, distribution, and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Yubi appears to sell through an institutional marketplace and infrastructure motion rather than a
              transparent self-serve price card. A 2022 company interview reported more than 3,000 corporates and 750
              lenders on the network, with facilitated loans ranging from $2 million to $50 million. Those are
              transaction and network boundaries, not Yubi prices or take rates. The Ajman Bank deployment supplies
              partner evidence for an enterprise-credit and supply-chain-finance channel in MENA, but no contract value,
              fee schedule, or realized margin is public. The same 2022 interview described baseline co-lender
              integrations of three to six months. That implementation burden may support switching costs, yet it does
              not establish CAC, payback, quota attainment, or renewal economics. An investor-reported 57%
              collections-cost reduction is a value proxy, not an independently benchmarked unit-economics result.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI011
              - CI013
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.3'
        title: Cost base, losses, and capital dependency
        blocks:
          - type: paragraph
            body: >-
              Cost and liquidity evidence is fragmented across periods. Lapaas Voice reports FY23 employee-benefit
              expense of ₹432 crore, up 4.7 times from ₹92 crore in FY22, and total FY23 expenditure of ₹895 crore, up
              314% year over year. Multiples VC separately reports an FY25 net loss of ₹416.1 crore. Accounting expense
              and loss cannot be treated as cash burn because working-capital movements, capitalization, non-cash
              charges, debt service, and acquisition effects are not disclosed. The Economic Times reports that a
              November 2025 financing included ₹75 crore from founder Gaurav Kumar and ₹336 crore from EvolutionX in a
              mix of debt and equity. Funding raised is not cash available: the debt share, covenants, repayment
              schedule, current cash balance, and post-raise burn remain unknown.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality is not underwritable from the available public record. Multiple monetization categories
              and institutional distribution suggest potential diversity, but there is no audited segment bridge,
              realized take rate, gross margin, customer concentration, retention cohort, contract-duration profile, or
              product-level contribution margin. Transaction size, integration time, and claimed collection-cost savings
              are useful commercial proxies but cannot substitute for unit economics. Capital dependence remains
              material because a reported FY25 net loss and mixed debt-equity financing are visible while cash, burn,
              runway, and obligations are not. VCCircle’s April 2025 report that Aspero faced regulatory scrutiny over
              rule violations also raises potential remediation and revenue-quality questions. Investment underwriting
              should remain conditional on reconciled audited statements, bank and debt schedules, and customer-level
              cohort data.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI010
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue bases do not reconcile publicly
            body: >-
              FY25 “Revenue” of ₹394.7 crore-plus and “operating revenue” of ₹660.1 crore come from different
              third-party pages with no disclosed perimeter bridge, so neither should be selected as canonical without
              audited statements.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
          - type: callout
            title: Make liquidity evidence a gating diligence item
            body: >-
              Obtain cash, burn, debt terms, and covenant headroom before interpreting the November 2025 financing as
              adequate runway; the public financing amount alone cannot answer that question.
            calloutType: recommendation
            claimRefs:
              - CI007
              - CI010
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: A debt-lifecycle platform rather than a single marketplace
        blocks:
          - type: paragraph
            body: >-
              Yubi's public product surface is best understood as a set of connected debt-workflow products rather than
              one undifferentiated lending marketplace. Independent coverage describes a digital marketplace that
              matches borrowers, lenders, and financial institutions, while investor material describes five group
              companies spanning origination, credit decisioning, fulfillment, and collections. The evidence therefore
              supports a lifecycle proposition: Yubi can mediate discovery and matching, help lenders evaluate
              borrowers, support co-lending and supply-chain finance, facilitate bonds, and continue into collections.
              That breadth is strategically useful because a lender or borrower can encounter several adjacent workflows
              in one ecosystem, but it also increases implementation and control complexity. Public descriptions do not
              show whether the modules share a common data model, identity layer, event bus, or service boundary. Those
              are material diligence questions, not assumptions that can be inferred from the product names.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE007
              - CE008
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE007
              - CE010
      - number: '5.2'
        title: Workflow evidence and deployment surfaces
        blocks:
          - type: paragraph
            body: >-
              The strongest public proof is workflow-specific. Yubi Co.Lend is described as reducing the operational
              burden of co-lender integration, including legal, operations, and security reviews that can otherwise take
              three to six months. A separate customer-linked deployment with Ajman Bank activates Yubi Enterprise
              Credit Market for SME trade working capital and supply-chain finance through a fully digital process. The
              DRA Homes transaction shows another operating surface: Yubi Group and Aspero were described as powering
              the structuring, issuance, and distribution of secured NCDs through a regulated bond platform and investor
              network. NetBramha's project account adds product-interaction evidence, including deal insights, return
              estimation, performance visualizations, and real-time investment tracking. These examples establish
              identifiable user jobs and deployment contexts, but partner and design-studio descriptions are not
              substitutes for production service-level objectives, integration documentation, incident history, or
              independently audited performance.
            claimRefs:
              - CE004
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE008
              - CE009
              - CE010
              - CE011
      - number: '5.3'
        title: Differentiation is workflow integration; control proof remains thin
        blocks:
          - type: paragraph
            body: >-
              Yubi's differentiation is more visible in workflow integration and distribution reach than in disclosed
              core infrastructure. Public descriptions point to matching, lender preference profiles, analytics,
              underwriting support, digital collections, bond discovery, and advisor tooling. The group also says it is
              developing proprietary AI products and presents a LOS/LMS/Collections end-to-end demo surface. These are
              useful signals of product ambition, but they do not prove model performance, explainability, data
              provenance, access controls, privacy compliance, resilience, or safe-collection outcomes. The regulated
              Aspero operating model is a positive boundary marker for the bond workflow, while the evidence does not
              establish that all Yubi modules carry the same regulatory perimeter. A buyer or investor should request
              architecture diagrams, integration and API specifications, uptime and recovery metrics, security
              attestations, model-governance documentation, and evidence that roadmap AI capabilities have moved from
              demonstration into repeatable production use.
            claimRefs:
              - CE005
              - CE006
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE007
              - CE009
              - CE013
      - number: '5.4'
        title: Product verdict
        blocks:
          - type: paragraph
            body: >-
              The product thesis is credible at the workflow level: Yubi has public evidence of multi-party debt
              matching, co-lending enablement, digital SME finance, bond issuance, investment distribution, and
              collections support. The main technical risk is not a missing use case; it is whether one operating
              platform can maintain consistent data, controls, reliability, and customer outcomes across many regulated
              and high-stakes workflows. Current evidence warrants a positive product assessment with medium confidence,
              not a conclusion that the platform is mature across every layer. The diligence priority is production
              proof: module-level adoption, integration depth, architecture ownership, security and privacy controls,
              incident and recovery history, and independent evidence of AI decision or collection quality.
            claimRefs:
              - CE001
              - CE004
              - CE008
              - CE010
              - CE012
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow breadth is externally visible
            body: >-
              The evidence spans debt matching, co-lending, SME finance, secured bond issuance, investment distribution,
              and collections rather than relying only on a generic platform description.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE007
              - CE008
              - CE010
          - type: callout
            title: Architecture and control evidence is the gating gap
            body: >-
              Public sources do not establish shared data architecture, uptime, security attestations, model governance,
              privacy controls, or production outcomes across the full lifecycle.
            calloutType: risk
            claimRefs:
              - CE005
              - CE006
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer model and segmentation
        blocks:
          - type: paragraph
            body: >-
              Yubi's customer model is a multi-sided institutional marketplace rather than a single end-user product.
              The platform connects enterprises and other borrowers to lenders and investors, while its lender-facing
              infrastructure supports discovery, underwriting, co-lending, disbursement, servicing, and collections. The
              public materials identify banks, NBFCs, institutional investors, retail investors, wealth managers,
              real-estate developers, and supply-chain anchors as distinct participants. That breadth creates strategic
              value because a financing workflow can span origination, bond issuance, portfolio monitoring, and
              collections, but it also makes customer quality heterogeneous: a logo or marketplace registration does not
              prove funded production activity, renewal, or revenue contribution. The evidence is strongest for the
              existence of these segments and their use cases, not for segment-level economics.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              Public adoption indicators point to a sizeable network and active transaction workflows. TVS Capital
              reports more than 17,000 enterprises and 6,200 investors and lenders on the platform, while a January 2026
              report based on anonymised and aggregated April-December 2025 platform data reports more than 1 million
              loans, more than INR 25,000 crore of credit enabled, and an average application-to-disbursement turnaround
              of under five hours. These are useful scale and activity signals, but they are not a retention cohort,
              net-revenue-retention measure, or independently audited customer count. Named proof is more concrete in
              the DRA Homes transaction: the company entered a INR 250 crore secured NCD platform for land acquisition,
              with Yubi and Aspero responsible for structuring, issuance, and distribution. The transaction demonstrates
              a real capital-markets use case, while its public materials do not disclose repeat issuance, realised
              investor outcomes, or Yubi's revenue from the mandate.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU008
              - CU010
              - CU016
      - number: '6.3'
        title: Durability, expansion, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              Yubi's expansion logic is visible in the breadth of its product surfaces and partnerships: Yubi Loans,
              Co.Lend, Flow, Invest, Pools, and Build address different financing jobs, and the platform has worked with
              large lenders such as State Bank of India. A lender or borrower can therefore use more than one workflow,
              creating a plausible land-and-expand path. The public record does not show whether users actually expand
              across products, how long contracts run, or how much volume comes from the largest accounts, channels, or
              geographies. The FY26 partnership-lending evidence also shows geographic concentration: five states
              account for approximately 53% of disbursement volume, and three asset classes account for nearly 73% of
              disbursed value. Those figures describe platform activity rather than customer concentration, but they
              indicate where diligence should test regional, product, and partner dependence. Retention and
              concentration remain material unresolved questions. A 2022 interview also reported that co-lender
              integration could take three to six months because of legal, operational, and security reviews; that
              historical range is not a current implementation benchmark, but it identifies procurement and integration
              friction that should be re-tested.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU009
              - CU010
              - CU015
              - CU016
      - number: '6.4'
        title: Customer evidence exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate customer segments, measurable adoption signals, and named deployments so that
              platform scale is not mistaken for durable customer economics. The journey map follows the institutional
              financing workflow from borrower need through lender matching, issuance or loan execution, and post-close
              servicing. It reflects documented product roles and a reported DRA Homes deployment, while leaving
              retention, repeat usage, and outcome measurement as explicit diligence gaps for underwriting decisions and
              investment review.
            claimRefs:
              - CU002
              - CU007
              - CU009
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad institutional surface area
            body: >-
              Yubi's platform spans borrowers, lenders, investors, distributors, and post-close servicing, with public
              evidence of both network scale and multiple financing workflows.
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
              - CU010
          - type: callout
            title: Scale is not retention
            body: >-
              Public sources disclose network and transaction activity but not NRR, GRR, churn, renewal, contract
              duration, customer-level revenue, or top-account concentration.
            calloutType: risk
            claimRefs:
              - CU008
              - CU012
              - CU014
          - type: callout
            title: Underwrite repeat usage directly
            body: >-
              Request cohort-level volumes, renewal and churn data, top-account shares, product attach rates, and
              customer-level contribution margins before treating platform activity as durable recurring demand.
            calloutType: recommendation
            claimRefs:
              - CU014
              - CU016
          - type: callout
            title: Public activity is not a retention cohort
            body: >-
              Customer and transaction counts are retained with their attribution and periods; they should not be read
              as active accounts, recurring revenue, or evidence of renewal without customer-level reconciliation.
            calloutType: assumption
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and control exposure
        blocks:
          - type: paragraph
            body: >-
              Yubi operates across origination, underwriting, bond distribution, collections, and investment products,
              so regulatory perimeter and control ownership are material risks rather than a single licensing question.
              TVS Capital describes Aspero as independently operated and SEBI-regulated, while a recent company-issued
              release says the investment-solutions and Aspero operations serve different mandates and are managed
              independently in accordance with SEBI guidelines. That separation is a useful mitigation, but the public
              record does not establish the full control map across Yubi, Accumn, Spocto X, YuCollect, Aspero, or any
              cross-border deployment. A diligence process should obtain current licenses, compliance attestations,
              regulator correspondence, audit findings, privacy and outsourcing controls, and evidence that
              customer-facing claims are consistent with the relevant regulated entity. Until those documents are
              reviewed, regulatory cleanliness and remediation maturity remain open questions.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operating, quality, and security resilience
        blocks:
          - type: paragraph
            body: >-
              The platform's breadth creates execution and reliability exposure: Yubi's public descriptions combine
              marketplace matching, credit evaluation, bond issuance, portfolio monitoring, and collections, while the
              partner case study describes complex institutional workflows and real-money investment decisions.
              BadCredit.org reports that co-lender integration can take three to six months because of legal,
              operational, and security reviews, which is evidence of implementation friction even though it is not an
              incident report. NetBramha says the redesign aimed to improve clarity, speed, onboarding, tracking, and
              investment decisions; those are product mitigations, not independent proof of uptime, security, or control
              effectiveness. The key diligence path is a current SOC or equivalent control report, penetration-test
              summary, material incident and outage log, recovery objectives, vendor register, and
              production-versus-pilot evidence for critical workflows.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR007
              - CR011
              - CR012
      - number: '7.3'
        title: Dependency, financial, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Yubi's scale narrative depends on a multi-sided network of enterprises, lenders, investors, distributors,
              and regulated or strategic partners. BadCredit.org describes invited institutions, a State Bank of India
              partnership, and a network model in which counterparties are matched to preferences; Stride Ventures and
              TVS Capital likewise emphasize the lender and investor ecosystem. This structure can improve liquidity but
              also creates counterparty, concentration, procurement, and funding sensitivity. Public financial snapshots
              are inconsistent in scope and vintage: Inc42 reports FY25 revenue of ₹394.7 crore+, while Multiples
              reports FY25 operating revenue of ₹660.1 crore and a FY25 net loss of ₹416.1 crore. The disagreement is
              itself a model risk. Investors should require audited consolidated statements, segment revenue bridges,
              cash flow, debt terms, customer and partner concentration, unit economics, and a runway model before
              treating growth or financing claims as durable.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority diligence
            body: >-
              Obtain regulator, audit, security, concentration, and audited-financial evidence before underwriting the
              platform's expansion claims.
            calloutType: risk
            claimRefs:
              - CR003
              - CR007
              - CR011
              - CR012
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat a material undisclosed incident, adverse regulatory finding, loss of a critical lender or funding
              source, or inability to reconcile audited revenue and loss figures as a thesis-break event.
            calloutType: assumption
            claimRefs:
              - CR004
              - CR008
              - CR010
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Yubi is building a broad operating layer for debt origination, underwriting, bond
              distribution, and collections rather than a single-product lending marketplace. Public descriptions
              support a large network and end-to-end positioning, while the TVS Capital profile reports more than
              ₹1,40,000 crore of facilitated debt volume, 17,000+ enterprises, and 6,200+ investors and lenders. That
              scale can create network effects and cross-sell potential across origination and servicing. The
              anti-thesis is that platform breadth is not the same as durable monetization: the public record does not
              provide current audited margins, retention, account concentration, or product-level contribution
              economics. The reported $1.5 billion secondary mark therefore remains a reference point, not a verified
              current fair value.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV007
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV012
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The strongest valuation anchor in the retained evidence is historical financing: Yubi was reported at $1.3
              billion in its March 2022 Series B, while later reporting described a $1.5 billion valuation in a
              secondary sale. A separate 2025 financing is described as ₹411 crore of structured debt and equity,
              including a ₹75 crore founder investment and up to ₹336 crore from EvolutionX Debt Capital. These
              transactions show continued financing access but do not reveal a current primary price, liquidation
              preferences, debt covenants, or the amount of cash available to equity holders. A disciplined entry should
              require a current cap table, instrument terms, audited financials, and a bridge from facilitated debt
              volume to net revenue and free cash flow before underwriting a return.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
      - number: '8.3'
        title: Scenarios and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              A precise bull/base/bear valuation range is not supportable from this assigned public pool because Yubi is
              private and the available sources do not provide a current transaction price plus consistent revenue,
              margin, and dilution inputs. The scenario framework therefore uses evidence-backed drivers rather than
              manufactured multiples. The bull case requires monetization to scale with the reported network and debt
              volume, while the base case assumes platform adoption continues but economics remain unproven. The bear
              case is a down-round or preference-overhang outcome if growth, collections, regulation, or lender
              concentration weakens. Public-company valuation pages and an NBFC IPO report provide context for
              financing-market comparability, but they are not direct Yubi comps and should not be used as a false
              mark-to-market.
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV010
              - CV011
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: Decision, exit readiness, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports research-more rather than buy or avoid. Yubi appears strategically relevant and has
              recognizable institutional backing, but valuation confidence is low because the public record leaves the
              current price, recurring revenue mix, gross margin, cash burn, retention, and preference stack unresolved.
              The investment committee should make entry conditional on a current financing term sheet, audited
              three-year financials, product-level revenue bridges, lender and borrower concentration, and
              regulatory-control evidence. Thesis-break triggers are a material down-round, inability to reconcile
              reported scale with net revenue or cash generation, adverse regulatory findings, or evidence that
              collections and underwriting economics do not improve with scale. Exit readiness is likewise unproven
              without a credible public-market or strategic-acquirer pathway.
            claimRefs:
              - CV006
              - CV007
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: research-more'
            body: >-
              The platform story is credible enough to continue diligence, but the price cannot be judged confidently
              until current financing terms and audited unit economics are available.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV007
              - CV012
          - type: callout
            title: Primary valuation risk
            body: >-
              A historical secondary mark may overstate present equity value if growth, margins, concentration, or
              financing preferences have changed.
            calloutType: risk
            claimRefs:
              - CV004
              - CV007
              - CV014
