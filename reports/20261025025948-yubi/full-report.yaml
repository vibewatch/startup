        - >-
          Multiple compression, down-round risk, preference overhang, or regulatory/commercialization setbacks reduce
          common-equity value
        - Downside cannot be numerically bounded from the retained public record
        - Material risk
        - Down-round, adverse regulatory finding, or inability to reconcile scale with economics
    notes: >-
      Scenario values are deliberately qualitative because the assigned sources do not support defensible current
      valuation ranges or probability percentages.
    claimRefs:
      - CV007
      - CV010
      - CV011
      - CV012
      - CV014
