            body: >-
              Public materials consistently identify Gaurav Kumar as founder and chief executive, while Lapaas also
              names Vineet Sukumar as co-founder without establishing his current operating remit. A September 2026
              company release identifies TVS Capital chairman Gopal Srinivasan as a Yubi Group board member,
              demonstrating at least one investor-linked governance connection. The assigned pool does not disclose the
              complete board, committee structure, voting rights, succession plan, or material leadership departures.
              Gaurav Kumar's central role in strategy, fundraising, and public communications therefore creates an
