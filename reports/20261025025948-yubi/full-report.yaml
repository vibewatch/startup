    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and platform scope
        blocks:
          - type: paragraph
            body: >-
              Most current sources describe Yubi, formerly CredAvenue, as founded in 2020 and headquartered in Chennai,
              although Multiples lists a 2017 founding date. That discrepancy likely reflects entity or incubation
              history, but the assigned evidence does not resolve it. Yubi remains privately held; the clearest priced
              reference is a $1.3 billion Series B mark from March 2022, not a current valuation. Across company,
              investor, supplier, event, and interview material, the business spans loan origination, co-lending,
              supply-chain finance, bond distribution, securitisation, underwriting, collections, and investment
              solutions. Public sources do not provide a product-level revenue bridge or current headcount.
