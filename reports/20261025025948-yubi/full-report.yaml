  - id: FE001
    title: Publicly evidenced debt-lifecycle stack
    type: stack
    summary: >-
      Public sources place Yubi across discovery, decisioning, fulfillment, distribution, and collections, while leaving
      shared-platform controls unverified.
    data:
      layers:
        - label: Discovery and origination
          detail: Match borrowers, lenders, investors, and institutional users.
          items:
            - label: Debt marketplace
              detail: Borrower and lender matching with preference-based discovery.
            - label: Supply-chain finance
              detail: Trade working-capital workflow described for enterprise users.
        - label: Decisioning
          detail: Credit and risk evaluation support for lenders.
          items:
            - label: Underwriting
              detail: Credit decisioning technology and corporate data support.
        - label: Fulfillment and distribution
          detail: Digital execution across loans, co-lending, and bonds.
          items:
            - label: Co.Lend
              detail: Joint-loan integration and partner workflow.
            - label: Aspero
              detail: Regulated bond issuance and investor distribution surface.
            - label: Advisor tools
              detail: Earnings dashboard, digital onboarding, and goal-based assistance.
        - label: Servicing and collections
          detail: Post-origination monitoring and repayment support.
          items:
            - label: Collections
              detail: Digital outreach and channel-selection capability.
            - label: Investment tracking
              detail: Deal status and performance visibility for investors.
        - label: Data and risk
          detail: Public descriptions reference underwriting, corporate data, and lender risk tools.
          items:
            - label: Risk evaluation
              detail: Lender-facing risk evaluation is described, but validation is not public.
        - label: Governance boundary
          detail: Regulated and partner-operated surfaces require explicit control mapping.
          items:
            - label: Regulatory controls
              detail: Aspero is described as regulated; group-wide control scope remains unverified.
    approximationNotes: >-
      Layer order represents the lifecycle described by sources, not a measured system dependency graph or proof that
      every module shares one technical stack.
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE007
      - CE010
