company:
  name: Yubi
chapter:
  number: 6
  title: Customers
  summary: Yubi serves a two-sided institutional debt ecosystem, with enterprises and borrowers seeking capital and banks, NBFCs, investors, and distributors supplying or placing it. Public evidence supports meaningful platform scale and several named use cases, but does not establish retention, account concentration, or durable repeat usage.
sections:
  - id: customer-model
    title: Customer model and segmentation
    body: >-
      Yubi's customer model is a multi-sided institutional marketplace rather than a single end-user product. The platform connects enterprises and other borrowers to lenders and investors, while its lender-facing infrastructure supports discovery, underwriting, co-lending, disbursement, servicing, and collections. The public materials identify banks, NBFCs, institutional investors, retail investors, wealth managers, real-estate developers, and supply-chain anchors as distinct participants. That breadth creates strategic value because a financing workflow can span origination, bond issuance, portfolio monitoring, and collections, but it also makes customer quality heterogeneous: a logo or marketplace registration does not prove funded production activity, renewal, or revenue contribution. The evidence is strongest for the existence of these segments and their use cases, not for segment-level economics.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption trajectory and named proof
    body: >-
      Public adoption indicators point to a sizeable network and active transaction workflows. TVS Capital reports more than 17,000 enterprises and 6,200 investors and lenders on the platform, while a January 2026 report based on anonymised and aggregated April-December 2025 platform data reports more than 1 million loans, more than INR 25,000 crore of credit enabled, and an average application-to-disbursement turnaround of under five hours. These are useful scale and activity signals, but they are not a retention cohort, net-revenue-retention measure, or independently audited customer count. Named proof is more concrete in the DRA Homes transaction: the company entered a INR 250 crore secured NCD platform for land acquisition, with Yubi and Aspero responsible for structuring, issuance, and distribution. The transaction demonstrates a real capital-markets use case, while its public materials do not disclose repeat issuance, realised investor outcomes, or Yubi's revenue from the mandate.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: retention-and-concentration
    title: Durability, expansion, and concentration gaps
    body: >-
      Yubi's expansion logic is visible in the breadth of its product surfaces and partnerships: Yubi Loans, Co.Lend, Flow, Invest, Pools, and Build address different financing jobs, and the platform has worked with large lenders such as State Bank of India. A lender or borrower can therefore use more than one workflow, creating a plausible land-and-expand path. The public record does not show whether users actually expand across products, how long contracts run, or how much volume comes from the largest accounts, channels, or geographies. The FY26 partnership-lending evidence also shows geographic concentration: five states account for approximately 53% of disbursement volume, and three asset classes account for nearly 73% of disbursed value. Those figures describe platform activity rather than customer concentration, but they indicate where diligence should test regional, product, and partner dependence. Retention and concentration remain material unresolved questions.
      A 2022 interview also reported that co-lender integration could take three to six months because of legal, operational, and security reviews; that historical range is not a current implementation benchmark, but it identifies procurement and integration friction that should be re-tested.
    claimRefs: [CU010, CU011, CU012, CU013, CU015, CU016]
    tableRefs: [TU003]
  - id: exhibits
    title: Customer evidence exhibits
    body: >-
      The exhibits separate customer segments, measurable adoption signals, and named deployments so that platform scale is not mistaken for durable customer economics. The journey map follows the institutional financing workflow from borrower need through lender matching, issuance or loan execution, and post-close servicing. It reflects documented product roles and a reported DRA Homes deployment, while leaving retention, repeat usage, and outcome measurement as explicit diligence gaps for underwriting decisions and investment review.
    claimRefs: [CU002, CU007, CU009, CU013]
callouts:
  - calloutType: strength
    title: Broad institutional surface area
    body: Yubi's platform spans borrowers, lenders, investors, distributors, and post-close servicing, with public evidence of both network scale and multiple financing workflows.
    claimRefs: [CU001, CU005, CU010]
  - calloutType: risk
    title: Scale is not retention
    body: Public sources disclose network and transaction activity but not NRR, GRR, churn, renewal, contract duration, customer-level revenue, or top-account concentration.
    claimRefs: [CU008, CU012, CU014]
  - calloutType: recommendation
    title: Underwrite repeat usage directly
    body: Request cohort-level volumes, renewal and churn data, top-account shares, product attach rates, and customer-level contribution margins before treating platform activity as durable recurring demand.
    claimRefs: [CU014, CU016]
  - calloutType: assumption
    title: Public activity is not a retention cohort
    body: Customer and transaction counts are retained with their attribution and periods; they should not be read as active accounts, recurring revenue, or evidence of renewal without customer-level reconciliation.
    claimRefs: [CU005, CU006, CU007, CU014]
