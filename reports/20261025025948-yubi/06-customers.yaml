      whyItMatters: "Network size and transaction volume can grow without durable account economics or recurring customer value."
      diligencePath: "Request monthly cohort files for the last 24 months, with gross and net retention reconciled to contracts, renewals, churn reasons, and product attach rates."
      relatedQuestionRefs: [QU005, QU006]
    - type: enumeration-incomplete
      severity: material
      topic: concentration
