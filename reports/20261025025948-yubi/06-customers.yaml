      severity: material
      topic: customer-outcomes
      missingEvidence: "Independent outcome evidence for the reported loans, turnaround time, collections savings, and customer repeat behavior."
      whyItMatters: "Company or partner-reported platform statistics do not establish realized borrower outcomes, investor returns, or repeat production."
