  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sizing-gap
      missingEvidence: Product-level SAM, SOM, fee schedules, take rates, fee-bearing transaction volumes, conversion, and retention by workflow and geography.
      whyItMatters: Broad debt-market stocks and transaction flows cannot establish Yubi's monetisable market or support a precise valuation bridge.
      diligencePath: Request an audited product-by-product bridge from eligible transaction volume to fee-bearing volume and net revenue, segmented by payer, workflow, and geography.
      relatedQuestionRefs: [QM004, QM008]
    - type: conflicting-data
      severity: material
      topic: network-scale
      missingEvidence: A consistently dated and defined denominator for active enterprises, lenders, investors, transactions, and facilitated debt volume.
      whyItMatters: Public descriptions mix populations and periods, preventing reliable penetration or adoption estimates.
      diligencePath: Reconcile monthly active counterparties, funded transactions, repeat usage, and gross-versus-net volume definitions against audited reporting.
      relatedQuestionRefs: [QM008]
    - type: missing-source
      severity: material
      topic: buyer-economics
      missingEvidence: Verified budget owners, procurement paths, implementation time, contract values, and switching costs for each buyer segment.
      whyItMatters: A large underlying credit market may not translate into rapid adoption or attractive platform economics.
      diligencePath: Review customer contracts and interview treasury, credit, operations, compliance, and investment decision-makers across each workflow.
      relatedQuestionRefs: [QM005, QM006, QM007, QM008]
