artifact: market-analysis
slug: yubi
runDate: 2026-10-25
company:
  name: Yubi
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Yubi addresses workflow infrastructure across India's lending, co-lending,
    supply-chain finance, securitisation, corporate-bond, and credit-investment
    markets. Public market stocks and transaction volumes establish substantial
    activity, but they do not isolate Yubi's fee-bearing SAM or achievable SOM.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      The relevant market is debt-market workflow infrastructure, not the full
      principal value of Indian credit. Included activity comprises discovery,
      matching, underwriting, documentation, execution, monitoring, collections,
      securitisation, and distribution tools used by enterprises, banks, NBFCs,
      and investors. Yubi is described across third-party, investor, and supplier
      sources as spanning loans, co-lending, pool finance, supply-chain finance,
      bonds, and collections. The boundary excludes bank balance-sheet capital,
      loan and bond principal, and unrelated consumer origination because those
      values are not platform revenue. The status quo remains fragmented:
      BadCredit.org's interview-based account describes calls, emails, and data
      exchanges in loan applications and says co-lender integration can take
      three to six months because of legal, operational, and security reviews.
      Yubi's opportunity is therefore the friction around debt transactions, not
      every rupee of debt outstanding.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Multiple sizing lenses and their limits
    body: >-
      The available evidence supports several non-additive market lenses.
      Economic Times Spotlight, in content for which the featured brand bears
      responsibility, reports a ₹226 lakh crore Indian bond market, including
      more than ₹53.6 lakh crore of corporate bonds outstanding, and ₹9.9 lakh
      crore of FY25 corporate-bond issuance, up 28% year over year. Business
      Standard separately reports approximately ₹73,000 crore of securitisation
      in Q2FY26 versus ₹70,000 crore a year earlier, while CRISIL's cited H1FY26
      measure was ₹1.24 trillion, up 8% from ₹1.15 trillion. These measures cover
      different stocks, flows, periods, and participant sets. They demonstrate
      activity around workflows Yubi serves, but they cannot be summed or
      multiplied by an assumed take rate to produce a defensible TAM, SAM, SOM,
      or revenue estimate.
    claimRefs: [CM008, CM009, CM010, CM011, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption path, and constraints
    body: >-
      The buying motion is multi-sided. Enterprises and MSMEs use debt-access
      and receivables workflows; banks and NBFCs fund, underwrite, originate, and
      monitor credit; institutional investors evaluate and allocate capital; and
      Yubi's 2026 company release extends the investor-side proposition to family
      offices, HNIs, and institutional allocators. Multiples characterises the
      business as B2B with a commission revenue model, but no retained source
      discloses segment-level pricing or budget ownership. Demand is supported by
      credit activity: RBI reports 15.9% year-over-year bank-credit growth to the
      commercial sector and 13.3% growth from non-bank sources in FY2025-26.
      Adoption is constrained by regulated workflows and market structure.
      TReDS requirements include transparent multi-financier bidding, MSME
      validation, assignment notices, cyber audits, and a ₹25 crore net-worth
      threshold; sponsored corporate-bond commentary also points to concentrated
      institutional holdings and uneven secondary-market liquidity.
    claimRefs: [CM005, CM006, CM007, CM012, CM013, CM014]
    tableRefs: [TM003]
  - id: diligence-gaps
    title: Sizing and adoption diligence gaps
    body: >-
      The assigned evidence does not disclose Yubi's product-level take rates,
      fee-bearing transaction volume, conversion rates, retention, or market
      share by workflow. Public descriptions also mix facilitated debt volume,
      enterprises, lenders, and investors without a consistently dated
      denominator. A diligence-grade sizing bridge must begin with each product's
      eligible transaction population, remove activity handled outside Yubi,
      identify the actual payer and pricing unit, and then apply evidenced
      adoption and retention assumptions. That bridge should be built separately
      for marketplace lending, co-lending, supply-chain finance, securitisation,
      bond distribution, collections, and asset management. Until management
      provides audited cohort and monetisation data, the broad market figures
      should serve as directional context only, and valuation should use
      sensitivity ranges rather than a single headline market estimate.
    claimRefs: [CM015, CM016]
    callouts:
      - calloutType: risk
        title: Broad debt totals are not Yubi revenue pools
        body: >-
          Outstanding bond stock and securitisation volume establish market
          activity, but neither reveals Yubi's fee-bearing share, take rate, or
          achievable penetration.
        claimRefs: [CM002, CM015, CM016]
      - calloutType: insight
        title: Regulation creates demand and implementation burden
        body: >-
          Formal bidding, validation, assignment, cyber-audit, and capital
          requirements can reward compliant workflow infrastructure while also
          lengthening implementation and increasing operating cost.
        claimRefs: [CM004, CM013]
