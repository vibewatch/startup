callouts:
  - calloutType: risk
    title: Current valuation and liquidity remain unverified
    body: "The $1.3 billion mark is tied to March 2022, cumulative funding totals conflict, and the November 2025 financing mixes debt and equity; none establishes cash available at the run date."
    claimRefs: [CO006, CO008, CO009, CO010]
  - calloutType: risk
    title: Profitability definitions require reconciliation
    body: "Filing-based reports cite a Rs 416.1 crore FY25 net loss, while the founder cited about Rs 60 crore in a later interview; audited statements and a metric bridge are required before treating either as cash burn."
    claimRefs: [CO012, CO013]
