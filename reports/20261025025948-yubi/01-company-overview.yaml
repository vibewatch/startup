company:
  name: Yubi
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Yubi is a Chennai-based private debt-market infrastructure company whose public materials
    describe a broad lending, underwriting, collections, bond, and wealth-management platform.
    Public evidence supports meaningful scale and FY25 revenue growth, but founding-date,
    funding-total, profitability, current-valuation, governance, customer-activity, and
    headcount questions remain unresolved.
sections:
  - id: identity-and-platform
    title: Identity, stage, and platform scope
    body: >-
      Most current sources describe Yubi, formerly CredAvenue, as founded in 2020 and
      headquartered in Chennai, although Multiples lists a 2017 founding date. That discrepancy
      likely reflects entity or incubation history, but the assigned evidence does not resolve
      it. Yubi remains privately held; the clearest priced reference is a $1.3 billion Series B
      mark from March 2022, not a current valuation. Across company, investor, supplier, event,
      and interview material, the business spans loan origination, co-lending, supply-chain
      finance, bond distribution, securitisation, underwriting, collections, and investment
      solutions. Public sources do not provide a product-level revenue bridge or current
      headcount.
    claimRefs: [CO001, CO002, CO003, CO006]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person dependence
    body: >-
      Public materials consistently identify Gaurav Kumar as founder and chief executive, while
      Lapaas also names Vineet Sukumar as co-founder without establishing his current operating
      remit. A September 2026 company release identifies TVS Capital chairman Gopal Srinivasan as
      a Yubi Group board member, demonstrating at least one investor-linked governance connection.
      The assigned pool does not disclose the complete board, committee structure, voting rights,
      succession plan, or material leadership departures. Gaurav Kumar's central role in strategy,
      fundraising, and public communications therefore creates an unquantified key-person
      dependency rather than evidence of a governance failure.
    claimRefs: [CO004, CO010, CO016]
    tableRefs: [TO002]
  - id: capital-scale-and-economics
    title: Capital history, operating scale, and economics
    body: >-
      The financing chronology is clearer than the cumulative funding total. Public profiles
      broadly agree on a roughly $90 million Series A in September 2021, a $137 million Series B
      in March 2022, and Rs 411 crore of mixed debt and equity in November 2025. They disagree on
      total capital raised: Lapaas tracks $303.4 million across four rounds, while Multiples
      reports $236 million across three. Filing-based reporting places FY25 operating revenue at
      Rs 660.1 crore and net loss at Rs 416.1 crore, whereas the founder told Moneycontrol the
      loss was about Rs 60 crore. Different definitions may explain that gap, but the public
      evidence does not reconcile it.
    claimRefs: [CO005, CO006, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: milestones-and-refresh-evidence
    title: Milestones, expansion, and refresh evidence
    body: >-
      Yubi's documented trajectory moves from marketplace formation and venture financing into
      acquisitions, regulated bond distribution, broader investment infrastructure, and
      asset-management services. The January 2026 DRA Homes partnership gives a concrete current
      example: Yubi and Aspero were selected to structure, issue, and distribute a Rs 250 crore
      secured NCD platform. The September 2026 asset-management launch extends the group toward
      portfolio management, but its own release says the new offering has no inherited track
      record or assets under management from Yubi's other businesses. These milestones establish
      breadth, not recurring revenue quality, customer concentration, regulatory cleanliness, or
      international unit economics.
    claimRefs: [CO003, CO005, CO006, CO007, CO010, CO011, CO012, CO015, CO016]
    figureRefs: [FO001]
