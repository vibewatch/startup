  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: valuation-gap
      missingEvidence: "Current arm's-length primary or secondary price, cap table, liquidation preferences, dilution, and debt or preference terms."
      whyItMatters: "Without current price and seniority terms, historical marks cannot establish common-equity value or expected return."
      diligencePath: "Obtain the latest financing documents, capitalization table, preference schedule, and an investor-led secondary transaction reference."
      relatedQuestionRefs: [QV002, QV003, QV008]
    - type: missing-source
      severity: material
      topic: financials
      missingEvidence: "Audited three-year statements with product-level revenue, gross margin, cash flow, burn, and working-capital bridges."
      whyItMatters: "Reported operating revenue and net loss do not show recurring quality, contribution margin, or financing need."
      diligencePath: "Request audited statements, management accounts, revenue recognition policy, and a product and geography margin bridge."
      relatedQuestionRefs: [QV006, QV007]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: "Top-account concentration, retention, contract length, repeat usage, and lender or distributor dependency by product."
      whyItMatters: "Network scale can overstate durability if a small number of accounts or partners drive volume."
      diligencePath: "Review anonymized cohort tables, top-20 account shares, renewal data, and counterparty concentration schedules."
      relatedQuestionRefs: [QV001, QV007]
    - type: missing-source
      severity: material
      topic: regulation
      missingEvidence: "Current regulator correspondence, remediation status, and legal-control mapping for co-lending, Aspero, privacy, and international deployments."
      whyItMatters: "Regulatory or control failures could impair commercialization, distributions, and exit readiness."
      diligencePath: "Obtain compliance reports, licenses, regulator correspondence, material litigation schedules, and control-testing results."
      relatedQuestionRefs: [QV005, QV008]
    - type: stale
      severity: minor
      topic: comparables
      missingEvidence: "A current, business-model-matched private or public comparable set with consistent revenue and valuation definitions."
      whyItMatters: "Northern Arc and InCred provide market context but are not direct substitutes for Yubi's private platform economics."
      diligencePath: "Build a comp set using current filings, arm's-length transactions, and clearly defined EV/revenue or price/gross-profit metrics."
      relatedQuestionRefs: [QV004]
