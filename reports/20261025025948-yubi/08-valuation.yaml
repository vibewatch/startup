company:
  name: Yubi
chapter:
  number: 8
  title: Valuation
  summary: Yubi has credible debt-infrastructure scale and a reported $1.5 billion secondary valuation, but the retained public evidence does not establish a current mark, recurring revenue quality, or an auditable path to returns. The appropriate stance is research-more with strict entry discipline until financial, concentration, and preference data are disclosed.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The thesis is that Yubi is building a broad operating layer for debt origination,
      underwriting, bond distribution, and collections rather than a single-product lending
      marketplace. Public descriptions support a large network and end-to-end positioning,
      while the TVS Capital profile reports more than ₹1,40,000 crore of facilitated debt
      volume, 17,000+ enterprises, and 6,200+ investors and lenders. That scale can create
      network effects and cross-sell potential across origination and servicing. The anti-thesis
      is that platform breadth is not the same as durable monetization: the public record does
      not provide current audited margins, retention, account concentration, or product-level
      contribution economics. The reported $1.5 billion secondary mark therefore remains a
      reference point, not a verified current fair value.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV015, CV016]
    tableRefs: [TV001, TV002]
  - id: price-and-financing
    title: Financing context and entry discipline
    body: >-
      The strongest valuation anchor in the retained evidence is historical financing: Yubi
      was reported at $1.3 billion in its March 2022 Series B, while later reporting described
      a $1.5 billion valuation in a secondary sale. A separate 2025 financing is described as
      ₹411 crore of structured debt and equity, including a ₹75 crore founder investment and
      up to ₹336 crore from EvolutionX Debt Capital. These transactions show continued
      financing access but do not reveal a current primary price, liquidation preferences,
      debt covenants, or the amount of cash available to equity holders. A disciplined entry
      should require a current cap table, instrument terms, audited financials, and a bridge
      from facilitated debt volume to net revenue and free cash flow before underwriting a
      return.
    claimRefs: [CV004, CV005, CV006, CV007]
  - id: scenarios-and-comparables
    title: Scenarios and comparable evidence
    body: >-
      A precise bull/base/bear valuation range is not supportable from this assigned public
      pool because Yubi is private and the available sources do not provide a current
      transaction price plus consistent revenue, margin, and dilution inputs. The scenario
      framework therefore uses evidence-backed drivers rather than manufactured multiples.
      The bull case requires monetization to scale with the reported network and debt volume,
      while the base case assumes platform adoption continues but economics remain
      unproven. The bear case is a down-round or preference-overhang outcome if growth,
      collections, regulation, or lender concentration weakens. Public-company valuation
      pages and an NBFC IPO report provide context for financing-market comparability, but
      they are not direct Yubi comps and should not be used as a false mark-to-market.
    claimRefs: [CV002, CV008, CV009, CV010, CV011]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Decision, exit readiness, and thesis-break triggers
    body: >-
      The evidence supports research-more rather than buy or avoid. Yubi appears strategically
      relevant and has recognizable institutional backing, but valuation confidence is low
      because the public record leaves the current price, recurring revenue mix, gross margin,
      cash burn, retention, and preference stack unresolved. The investment committee should
      make entry conditional on a current financing term sheet, audited three-year financials,
      product-level revenue bridges, lender and borrower concentration, and regulatory-control
      evidence. Thesis-break triggers are a material down-round, inability to reconcile
      reported scale with net revenue or cash generation, adverse regulatory findings, or
      evidence that collections and underwriting economics do not improve with scale. Exit
      readiness is likewise unproven without a credible public-market or strategic-acquirer
      pathway.
    claimRefs: [CV006, CV007, CV012, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: "Recommendation: research-more"
    body: The platform story is credible enough to continue diligence, but the price cannot be judged confidently until current financing terms and audited unit economics are available.
    claimRefs: [CV004, CV007, CV012]
  - calloutType: risk
    title: Primary valuation risk
    body: A historical secondary mark may overstate present equity value if growth, margins, concentration, or financing preferences have changed.
    claimRefs: [CV004, CV007, CV014]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, "Continue diligence; do not underwrite a buy at an unverified current price"]
      - [Confidence, low, "Public evidence supports the business narrative but not current equity economics"]
      - [Risk rating, high, "Financing terms, regulation, concentration, and cash-generation evidence remain incomplete"]
      - [Valuation stance, fair, "Historical marks exist, but current fair value is not established"]
    notes: "Assessment is an analyst synthesis of the retained public evidence; fair is a provisional stance, not a current transaction price."
    claimRefs: [CV004, CV007, CV012, CV014]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [End-to-end infrastructure can compound network value, "Yubi is described as covering origination through collections and serving a large lender and enterprise network", "Audited product economics show whether cross-sell and retention convert scale into cash generation"]
      - [Institutional financing access is a positive signal, "Series B and later structured debt/equity financing are publicly reported", "Current cap table, preferences, covenants, and primary pricing show whether access benefits common equity"]
      - [Historical valuation may be a credible reference point, "A $1.3B Series B mark and a later reported $1.5B secondary mark are available", "A current arm's-length round or secondary transaction confirms or resets the mark"]
      - [Breadth may conceal weak economics, "Current public sources do not disclose audited margins, retention, or concentration", "Three-year audited statements and customer cohort data close the gap"]
    notes: "The table separates positive signals from unresolved tests; it does not treat company or investor descriptions as independent validation."
    claimRefs: [CV001, CV004, CV005, CV007, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Evidence-backed assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Network scale and end-to-end products produce durable monetization and improving operating leverage", "Potential upside is not quantified because current revenue, margin, dilution, and price inputs are unavailable", "Plausible but unverified", "Scale does not translate into recurring net revenue or cash generation"]
      - [Base, "Platform remains strategically useful while financial disclosure and product economics improve gradually", "Track or research-more; defer a target return until a current price and audited inputs are available", "Most decision-useful interim case", "No evidence of improving retention, margins, or concentration"]
      - [Bear, "Multiple compression, down-round risk, preference overhang, or regulatory/commercialization setbacks reduce common-equity value", "Downside cannot be numerically bounded from the retained public record", "Material risk", "Down-round, adverse regulatory finding, or inability to reconcile scale with economics"]
    notes: "Scenario values are deliberately qualitative because the assigned sources do not support defensible current valuation ranges or probability percentages."
    claimRefs: [CV007, CV010, CV011, CV012, CV014]
