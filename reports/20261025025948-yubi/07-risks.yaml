    claimRefs: [CR003, CR007, CR011, CR012]
callouts:
  - calloutType: risk
    title: Highest-priority diligence
    body: Obtain regulator, audit, security, concentration, and audited-financial evidence before underwriting the platform's expansion claims.
    claimRefs: [CR003, CR007, CR011, CR012]
  - calloutType: assumption
    title: Thesis-break trigger
    body: Treat a material undisclosed incident, adverse regulatory finding, loss of a critical lender or funding source, or inability to reconcile audited revenue and loss figures as a thesis-break event.
    claimRefs: [CR004, CR008, CR010, CR012]
