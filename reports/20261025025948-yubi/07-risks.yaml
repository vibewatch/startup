company:
  name: Yubi
chapter:
  number: 7
  title: Risks
  summary: Yubi's principal risks are control complexity across a regulated debt lifecycle, dependence on financial-sector counterparties, and limited public visibility into economics and loss drivers. Public sources show broad platform reach and recent expansion, but they do not establish regulator correspondence, incident history, concentration, or product-level profitability.
sections:
  - id: regulatory-and-control-exposure
    title: Regulatory and control exposure
    body: Yubi operates across origination, underwriting, bond distribution, collections, and investment products, so regulatory perimeter and control ownership are material risks rather than a single licensing question. TVS Capital describes Aspero as independently operated and SEBI-regulated, while a recent company-issued release says the investment-solutions and Aspero operations serve different mandates and are managed independently in accordance with SEBI guidelines. That separation is a useful mitigation, but the public record does not establish the full control map across Yubi, Accumn, Spocto X, YuCollect, Aspero, or any cross-border deployment. A diligence process should obtain current licenses, compliance attestations, regulator correspondence, audit findings, privacy and outsourcing controls, and evidence that customer-facing claims are consistent with the relevant regulated entity. Until those documents are reviewed, regulatory cleanliness and remediation maturity remain open questions.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operating-and-security-resilience
    title: Operating, quality, and security resilience
    body: "The platform's breadth creates execution and reliability exposure: Yubi's public descriptions combine marketplace matching, credit evaluation, bond issuance, portfolio monitoring, and collections, while the partner case study describes complex institutional workflows and real-money investment decisions. BadCredit.org reports that co-lender integration can take three to six months because of legal, operational, and security reviews, which is evidence of implementation friction even though it is not an incident report. NetBramha says the redesign aimed to improve clarity, speed, onboarding, tracking, and investment decisions; those are product mitigations, not independent proof of uptime, security, or control effectiveness. The key diligence path is a current SOC or equivalent control report, penetration-test summary, material incident and outage log, recovery objectives, vendor register, and production-versus-pilot evidence for critical workflows."
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependency-financial-and-execution-risk
    title: Dependency, financial, and execution risk
    body: "Yubi's scale narrative depends on a multi-sided network of enterprises, lenders, investors, distributors, and regulated or strategic partners. BadCredit.org describes invited institutions, a State Bank of India partnership, and a network model in which counterparties are matched to preferences; Stride Ventures and TVS Capital likewise emphasize the lender and investor ecosystem. This structure can improve liquidity but also creates counterparty, concentration, procurement, and funding sensitivity. Public financial snapshots are inconsistent in scope and vintage: Inc42 reports FY25 revenue of ₹394.7 crore+, while Multiples reports FY25 operating revenue of ₹660.1 crore and a FY25 net loss of ₹416.1 crore. The disagreement is itself a model risk. Investors should require audited consolidated statements, segment revenue bridges, cash flow, debt terms, customer and partner concentration, unit economics, and a runway model before treating growth or financing claims as durable."
    claimRefs: [CR009, CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or control area, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - [Entity and product perimeter, India, "Public descriptions span five group companies and multiple debt stages; complete perimeter not established", Medium, High, "Separate operating mandates are described for Aspero and the investment-solutions business", High, "Obtain entity-by-entity licenses, regulated-activity map, compliance owners, and regulator correspondence"]
      - [Bond distribution and investor protection, India, "Aspero is described as SEBI-regulated and retail bond access is described; current control evidence not independently reviewed", Medium, High, "Independent operation and SEBI-guideline compliance are stated", Medium-High, "Review current SEBI registration, complaints, suitability, disclosure, settlement, and audit records"]
      - ["Privacy, outsourcing, and information security", "India and cross-border markets", "Control framework and remediation status are not disclosed in the assigned sources", Medium, High, "Technology infrastructure and security reviews are referenced for integrations", High, "Request DPA, vendor register, penetration tests, incident log, recovery tests, and cross-border data assessments"]
      - [Collections conduct and credit decisioning, India, "AI-powered risk and ethical-collections positioning is described; outcome and complaint evidence is missing", Medium, High, "AI tools, monitoring, and ethical collections are stated as platform capabilities", Medium-High, "Test model governance, adverse-action controls, collection complaints, bias monitoring, and portfolio outcomes"]
    notes: "Rows synthesize assigned public sources; status is limited to what those sources disclose, and null or unresolved control evidence is not evidence of non-compliance."
    enumerationScope:
      coverage: partial
      basis: "Publicly described India-facing products and control areas in the assigned 2026 refresh evidence; not a legal-entity or license inventory."
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Slow or failed lender integration, Medium, High, "Partial: integration workflow and security reviews are described", High, "Production cycle-time distribution, implementation backlog, and failure/rework rates"]
      - [Incorrect or delayed debt-lifecycle data, Medium, High, "Partial: unified workflows and tracking are described", Medium-High, "Reconciliation controls, data lineage, SLAs, and exception rates"]
      - [Security incident or service outage, Medium, Critical, "Unknown: no current incident or resilience evidence in assigned sources", High, "Incident history, uptime, RTO/RPO, penetration-test results, and tabletop evidence"]
      - [Collections or underwriting model error, Medium, High, "Partial: AI risk and collections capabilities are claimed", Medium-High, "Model validation, drift, override, complaint, and loss-rate evidence by product"]
    notes: "Likelihood and severity are analyst risk ratings grounded in the documented failure modes and missing control evidence; they are not company-reported probabilities."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Institutional lender network", "Banks, NBFCs, and investors", "Capital supply and underwriting access", "Network scale is disclosed; individual concentration is not", "Loss of a large lender or reduced risk appetite", High, "Matching and tailored institution profiles", High]
      - ["Strategic banking relationship", "State Bank of India", "Partner described by BadCredit.org", "Share of volume not disclosed", "Partner exit, procurement delay, or integration failure", High, "Multi-sided network and co-lending workflow", Medium-High]
      - ["Distribution channel", "Wealth managers, IFAs, MFDs, and family offices", "Advisor-led product distribution", "Growing channel described; partner concentration not disclosed", "Slow adoption or conduct issue in a key channel", Medium-High, "COO appointment, branch network, digital onboarding, and advisor tools", Medium-High]
      - ["Capital and liquidity", "Founder and EvolutionX Debt Capital", "Growth and working-capital funding", "November 2025 financing reported; runway and obligations not disclosed", "Funding gap, covenant pressure, or expensive capital", High, "Mix of debt and equity and continued investor backing", High]
    notes: "Counterparty and concentration fields distinguish disclosed network participation from unreported share-of-volume, revenue, or funding dependence."
    claimRefs: [CR009, CR010, CR011, CR012, CR013]
