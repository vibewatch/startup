artifact: financials
slug: yubi
runDate: 2026-10-25
company:
  name: Yubi
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence indicates a diversified fee, collections, and data monetization model,
    but reported FY25 revenue labels conflict and the available material does not disclose
    audited margins, cash burn, runway, or customer-level economics. The financial case
    therefore remains dependent on primary diligence rather than public traction proxies.
sections:
  - id: revenue-architecture
    title: Revenue architecture and disclosure quality
    body: >-
      Public material supports several monetization lines but not an audited revenue bridge.
      Lapaas Voice reports FY24 platform-services fees of ₹220.54 crore, equal to 45.6% of
      operating income, alongside ₹133.95 crore of collection revenue or interest on loans,
      ₹89.38 crore of fee-based services, and ₹44.46 crore of corporate-database offerings.
      These figures describe accounting revenue categories, not ARR, contracted backlog, or
      cash collections. More recent third-party pages use materially different labels:
      Inc42 displays “Revenue” of ₹394.7 crore-plus for FY25, while Multiples VC reports
      “operating revenue” of ₹660.1 crore for FY25. Their consolidation perimeters and
      accounting definitions are not supplied, so deriving growth, mix, or margins across
      the two would create false precision.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI001]
  - id: monetization-and-gtm
    title: Monetization, distribution, and sales-efficiency proxies
    body: >-
      Yubi appears to sell through an institutional marketplace and infrastructure motion
      rather than a transparent self-serve price card. A 2022 company interview reported
      more than 3,000 corporates and 750 lenders on the network, with facilitated loans
      ranging from $2 million to $50 million. Those are transaction and network boundaries,
      not Yubi prices or take rates. The Ajman Bank deployment supplies partner evidence for
      an enterprise-credit and supply-chain-finance channel in MENA, but no contract value,
      fee schedule, or realized margin is public. The same 2022 interview described baseline
      co-lender integrations of three to six months. That implementation burden may support
      switching costs, yet it does not establish CAC, payback, quota attainment, or renewal
      economics. An investor-reported 57% collections-cost reduction is a value proxy, not
      an independently benchmarked unit-economics result.
    claimRefs: [CI011, CI012, CI013, CI014, CI015]
    tableRefs: [TI002]
    figureRefs: [FI001]
  - id: cost-base-and-capital
    title: Cost base, losses, and capital dependency
    body: >-
      Cost and liquidity evidence is fragmented across periods. Lapaas Voice reports FY23
      employee-benefit expense of ₹432 crore, up 4.7 times from ₹92 crore in FY22, and total
      FY23 expenditure of ₹895 crore, up 314% year over year. Multiples VC separately reports
      an FY25 net loss of ₹416.1 crore. Accounting expense and loss cannot be treated as cash
      burn because working-capital movements, capitalization, non-cash charges, debt service,
      and acquisition effects are not disclosed. The Economic Times reports that a November
      2025 financing included ₹75 crore from founder Gaurav Kumar and ₹336 crore from
      EvolutionX in a mix of debt and equity. Funding raised is not cash available: the debt
      share, covenants, repayment schedule, current cash balance, and post-raise burn remain
      unknown.
    claimRefs: [CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      Revenue quality is not underwritable from the available public record. Multiple
      monetization categories and institutional distribution suggest potential diversity,
      but there is no audited segment bridge, realized take rate, gross margin, customer
      concentration, retention cohort, contract-duration profile, or product-level
      contribution margin. Transaction size, integration time, and claimed collection-cost
      savings are useful commercial proxies but cannot substitute for unit economics. Capital
      dependence remains material because a reported FY25 net loss and mixed debt-equity
      financing are visible while cash, burn, runway, and obligations are not. VCCircle’s
      April 2025 report that Aspero faced regulatory scrutiny over rule violations also raises
      potential remediation and revenue-quality questions. Investment underwriting should
      remain conditional on reconciled audited statements, bank and debt schedules, and
      customer-level cohort data.
    claimRefs: [CI005, CI006, CI007, CI010, CI016]
tables:
  - id: TI001
    title: Reported FY24 revenue streams
    columns:
      - Stream
      - Reported amount
      - Reported basis
      - Quality assessment
      - Diligence ask
    rows:
      - ["Platform services fees", "₹220.54 crore", "45.6% of FY24 operating income", "Third-party profile; accounting definition and perimeter unavailable", "Reconcile to audited entity-level and consolidated revenue"]
      - ["Collection revenue / interest on loans", "₹133.95 crore", "FY24", "Collection fees and loan interest are grouped together", "Split fee income from interest income and disclose principal at risk"]
      - ["Fee-based services", "₹89.38 crore", "FY24", "Service scope and recurrence are not disclosed", "Provide product, contract term, renewal, and gross-margin detail"]
      - ["Corporate database offerings", "₹44.46 crore", "FY24", "Database product retention and delivery cost are unavailable", "Provide ARR or recognized revenue bridge, retention, and contribution margin"]
    notes: >-
      Amounts and labels are reproduced from Lapaas Voice's public-source profile; they are
      not audited here and must not be treated as ARR, cash receipts, or a complete revenue bridge.
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Commercial surface
      - Public value or status
      - Unit / contract basis
      - What is unknown
      - Underwriting implication
    rows:
      - ["Platform services", "₹220.54 crore reported FY24 revenue", "No public list price or take rate", "Realized pricing, discounts, minimums, and recognition policy", "Revenue exists as a category, but price quality is untested"]
      - ["Debt marketplace", "$2 million to $50 million facilitated-loan range reported in 2022", "Loan principal, not Yubi revenue", "Fee payer, fee basis, conversion, and take rate", "Large transaction sizes do not establish monetization"]
      - ["Ajman Bank MENA deployment", "Corporate loans and supply-chain-finance platform activated", "Contract value and charging model unavailable", "Implementation fee, recurring license, usage fee, and margin", "Partner proof supports distribution, not economics"]
      - ["Collections proposition", "57% collections-cost reduction reported by an investor", "Customer saving; not Yubi price", "Benchmark cohort, measurement period, pricing, and delivery cost", "Potential ROI is visible but not independently validated"]
    notes: >-
      Values mix accounting revenue, transaction principal, deployment status, and a claimed
      customer-cost outcome; they are deliberately not combined into a take-rate or pricing estimate.
    claimRefs: [CI001, CI011, CI013, CI015]
  - id: TI003
    title: Unit economics and capital-adequacy diligence matrix
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["FY25 revenue", "Inc42: ₹394.7 crore+ “Revenue”; Multiples VC: ₹660.1 crore “operating revenue”", "Low — labels and perimeters differ", "The base metric for growth and margin analysis is unresolved", "Reconcile both figures to audited consolidated and entity-level statements"]
      - ["FY25 net loss", "₹416.1 crore reported by Multiples VC", "Medium — third-party reported", "Indicates loss-making operations but not cash burn", "Provide audited P&L and bridge EBITDA, PAT, and operating cash flow"]
      - ["Employee-benefit expense", "₹432 crore in FY23; 4.7x ₹92 crore in FY22", "Low — stale third-party profile", "Labor intensity may pressure operating leverage", "Provide FY24-FY26 headcount, cash compensation, ESOP, and function mix"]
      - ["Total expenditure", "₹895 crore in FY23; reported 314% YoY increase", "Low — stale and incompletely defined", "Cost scaling cannot be assessed without category and consolidation detail", "Provide three-year expense bridge and acquisition normalization"]
      - ["November 2025 financing", "₹75 crore founder infusion; ₹336 crore EvolutionX mix of debt and equity", "Medium — reported by The Economic Times", "Financing mix can create dilution and debt-service obligations", "Provide instrument split, covenants, maturity, security, and use of proceeds"]
      - ["Cash burn and runway", null, "Unavailable", "Determines ability to fund losses and expansion", "Provide current cash, restricted cash, monthly burn, and board-approved forecast"]
      - ["Gross and contribution margin", null, "Unavailable", "Separates scalable software economics from service and credit intensity", "Provide product-level revenue, direct delivery costs, credit costs, and allocations"]
      - ["Retention and concentration", null, "Unavailable", "Determines durability and account-level downside", "Provide top-10 concentration, NRR, GRR, cohort revenue, and contract duration"]
    notes: >-
      Null means no supportable public value was available in the assigned evidence pool;
      accounting loss is not cash burn, and funding raised is not cash available.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010]
figures:
  - id: FI001
    title: Revenue model bridge from institutional activity to monetization
    type: flow
    summary: >-
      The sequence shows the reported commercial workflow and monetization surfaces; values
      use different units and periods and do not form a proportional conversion funnel.
    data:
      nodes:
        - id: enterprise-demand
          label: Enterprise credit demand
          value: "3,000+ corporates"
          unit: "reported network participants in 2022"
          detail: "Borrowers seek loans and other debt solutions through the marketplace."
        - id: lender-network
          label: Lender access
          value: "750+ lenders"
          unit: "reported network participants in 2022"
          detail: "Banks, NBFCs, and other lenders receive matched opportunities."
        - id: integration
          label: Integration and underwriting workflow
          value: "3–6 months"
          unit: "reported baseline co-lender integration time in 2022"
          detail: "Legal, operational, and security reviews precede joint lending."
        - id: execution
          label: Financing execution
          value: "$2m–$50m"
          unit: "reported facilitated-loan principal range in 2022"
          detail: "Principal range is not Yubi revenue and does not establish a take rate."
        - id: servicing
          label: Servicing and collections
          value: "57%"
          unit: "investor-reported collections-cost reduction"
          detail: "The outcome lacks a public benchmark cohort and measurement period."
        - id: monetization
          label: Monetization surfaces
          value: "Platform fees + collections/interest + services + data"
          unit: "reported FY24 revenue categories"
          detail: "Public evidence does not disclose realized pricing or gross profit by stream."
      edges:
        - from: enterprise-demand
          to: lender-network
          label: matched demand
        - from: lender-network
          to: integration
          label: institutional onboarding
        - from: integration
          to: execution
          label: approved workflow
        - from: execution
          to: servicing
          label: post-disbursement support
        - from: servicing
          to: monetization
          label: multiple fee and income surfaces
    approximationNotes: >-
      Values are source-reported snapshots with unlike denominators and periods; node order
      describes the operating sequence and does not imply conversion rates or value-proportional scale.
    claimRefs: [CI002, CI003, CI004, CI012, CI013, CI014, CI015]
callouts:
  - calloutType: risk
    title: Revenue bases do not reconcile publicly
    body: >-
      FY25 “Revenue” of ₹394.7 crore-plus and “operating revenue” of ₹660.1 crore come from
      different third-party pages with no disclosed perimeter bridge, so neither should be
      selected as canonical without audited statements.
    claimRefs: [CI005, CI006]
  - calloutType: recommendation
    title: Make liquidity evidence a gating diligence item
    body: >-
      Obtain cash, burn, debt terms, and covenant headroom before interpreting the November
      2025 financing as adequate runway; the public financing amount alone cannot answer that question.
    claimRefs: [CI007, CI010]
