companyProfile:
  summary: >-
    Yubi, formerly CredAvenue, is a Chennai-based private fintech company building infrastructure for debt origination,
    underwriting, co-lending, bond distribution, securitisation, and collections. Its public materials describe a
    multi-sided institutional network and a group of specialised operating businesses, but the available record does not
    establish product-level recurring revenue, customer concentration, or current profitability.
