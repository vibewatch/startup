  topStrengths:
    - Broad debt-market infrastructure spanning origination, underwriting, distribution, and collections.
    - Institutional network and reported transaction scale provide credible strategic relevance.
    - Continued access to venture and structured capital, including the 2025 financing.
  topRisks:
