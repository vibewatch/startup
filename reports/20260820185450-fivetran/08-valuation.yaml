- id: section-2
  title: Why a premium can be justified
  body: Fivetran does deserve a strategic premium versus smaller or less enterprise-ready ELT tools. The market is still growing, the product has serious trust controls, customer proof is unusually strong, and the dbt merger broadens the story from ingestion into a wider governed-data workflow. Partner breadth and ecosystem fit further improve adoption odds. Taken together, these factors make a high-quality late-stage asset narrative credible. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete;
    it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
  claimRefs:
