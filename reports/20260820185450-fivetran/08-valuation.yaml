- id: section-3
  title: Why the current mark still looks stretched
  body: 'The premium case runs into a hard problem: missing denominators. Investors still do not have public revenue, margin, retention, or cap-table detail that would normally support confidence in an 8B-plus entry. Pricing compression risk is real, broader platforms loom, and the lower secondary marks are too close to ignore. That combination means the company can be excellent while the specific mark still looks rich. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly
    what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.'
