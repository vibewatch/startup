company:
  name: Fivetran
chapter:
  number: 8
  title: Valuation
  summary: 'Fivetran clearly deserves a premium versus smaller ELT vendors because it has stronger enterprise proof, broader trust controls, and a larger ecosystem footprint. The main issue is not whether it is valuable, but whether a May 2026 mark around $8.42B is justified given conflicting secondary-market data and the absence of public revenue, margin, and retention denominators. The resulting valuation stance is cautious: plausible strategic premium, but entry price still looks stretched without private financial disclosure.'
sections:
- id: section-1
  title: The public mark clearly stepped up, but exact price remains disputed
  body: There is no serious dispute that Fivetran is worth substantially more than its 2021 $5.6B official Series D mark. The dispute is about how much more. Caplight and PM Insights support a premium 2026 mark near $8.4B to $8.42B, while Stock Analysis / Hiive points to a materially lower last confirmed level. Tracxn’s slower-moving profile reinforces the problem by still centering the older 2021 picture. This means the qualification event is directionally believable, but the exact entry number is still not fully settled from public sources alone. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts scattered public
    signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
