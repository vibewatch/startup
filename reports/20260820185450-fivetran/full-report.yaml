      - number: '2.4'
        title: Where Fivetran fits and where the market pushes back
        blocks:
          - type: paragraph
            body: >-
              Fivetran’s serviceable market is narrower than the whole integration TAM, which is important for
              underwriting. Open-source and self-hosted tools pressure pricing at the lower end, while Boomi,
              Informatica, Qlik Talend, and SnapLogic can win broader platform deals that include API and app
              integration. dbt remains adjacent on transformation rather than upstream extraction, and reverse ETL
              expands budgets without fully defining the same market. The result is a good but bounded category
              position: Fivetran is well placed in managed ELT for warehouse-centric enterprises, but it cannot assume
              ownership of every workflow, orchestration, or integration budget line. From a diligence perspective, this
              section matters because it converts scattered public signals into reusable ground truth for later
