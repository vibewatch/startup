      - number: '1.1'
        title: Identity, history, and what the company is in 2026
        blocks:
          - type: paragraph
            body: >-
              Fivetran’s current public identity is much broader than the old shorthand of managed ETL. Official pages
              anchor the business as an automated data movement platform founded in 2012, headquartered in Oakland, and
              expanded through Y Combinator roots into a globally distributed infrastructure vendor. The June 2026
              merger with dbt Labs pushes that identity further: Fivetran now describes the combined platform as
              infrastructure for trusted AI agents, not just connector automation. The safest reusable ground truth for
              the rest of this report is therefore an Oakland-based late-stage private data-integration platform with
              managed connectors, heavy enterprise trust requirements, and a widening product narrative around governed
              data movement plus transformation. From a diligence perspective, this section matters because it converts
              scattered public signals into reusable ground truth for later chapters. The point is not to pretend the
              public record is complete; it is to state clearly what is supported, what is still only company-claimed,
              and where private diligence would most likely change the investment conclusion. From a diligence
