          - type: paragraph
            body: >-
              The public product and pricing record is coherent on the commercial model even if it is not financially
              complete. Fivetran documents 700-plus connectors and the homepage advertises 900-plus sources and
              destinations, which is best understood as a documented-connector subset versus a wider endpoint count.
