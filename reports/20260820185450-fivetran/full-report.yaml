        title: Market size is large, but category boundaries matter
        blocks:
          - type: paragraph
            body: >-
              The retained market sources all support a large data-integration opportunity, but they describe different
              slices of it. Precedence Research points to roughly $19.2B in 2026 and more than $51B by 2035 for data
              integration, while Research and Markets frames a broader path toward more than $33B by 2030. ETL- and
              pipeline-focused summaries from Integrate.io and Peliqan show smaller present-day numbers but similar
              growth direction. The right conclusion is not to pick a single magical TAM number. It is to acknowledge
              that Fivetran operates in a multi-billion-dollar market with durable growth, while remembering that ELT,
              data pipeline, and broader integration-platform labels are not interchangeable. From a diligence
