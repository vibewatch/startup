      - number: '2.3'
        title: Who buys and what they are really buying
        blocks:
          - type: paragraph
            body: >-
              The buyer is usually not a casual business user. Data engineering, analytics engineering, platform,
              security, and IT leadership are the typical selecting functions, with budget authority closer to the CIO,
              CDO, or platform organization. These teams are most often standardizing around Snowflake, Databricks, or
              adjacent cloud data platforms and therefore care about reliability, governance, and ecosystem fit as much
              as initial setup speed. Large enterprises dominate current spend because they have more systems to connect
              and more risk if pipelines fail. SMB growth exists, but lower-cost alternatives capture a meaningful share
              of that demand. From a diligence perspective, this section matters because it converts scattered public
