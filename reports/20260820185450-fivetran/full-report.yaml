  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The public mark clearly stepped up, but exact price remains disputed
        blocks:
          - type: paragraph
            body: >-
              There is no serious dispute that Fivetran is worth substantially more than its 2021 $5.6B official Series
              D mark. The dispute is about how much more. Caplight and PM Insights support a premium 2026 mark near
              $8.4B to $8.42B, while Stock Analysis / Hiive points to a materially lower last confirmed level. Tracxn’s
              slower-moving profile reinforces the problem by still centering the older 2021 picture. This means the
              qualification event is directionally believable, but the exact entry number is still not fully settled
              from public sources alone. From a diligence perspective, this section matters because it converts
              scattered public signals into reusable ground truth for later chapters. The point is not to pretend the
              public record is complete; it is to state clearly what is supported, what is still only company-claimed,
              and where private diligence would most likely change the investment conclusion. From a diligence
              perspective, this section matters because it converts scattered public signals into reusable ground truth
              for later chapters. The point is not to pretend the public record is complete; it is to state clearly what
              is supported, what is still only company-claimed, and where private diligence would most likely change the
