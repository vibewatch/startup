- id: section-4
  title: Where Fivetran is exposed
  body: 'The company’s main competitive vulnerabilities are equally clear. Usage-based pricing is frequently criticized as hard to predict, open-source and self-hosted rivals pressure the mid-market, and broader suites can outflank the company when procurement wants a single vendor with more application-level scope. The dbt merger broadens the story in a helpful way, but it also raises expectations: if the combined platform cannot show better economics, trust, and integrated workflow value than cheaper or broader alternatives, the ingestion layer alone will look increasingly commoditized. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters
    because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.'
