companyProfile:
  summary: Fivetran is a late-stage private data-integration company that built its reputation on managed, schema-aware ELT into modern warehouses and has since widened its story toward governed transformation and AI-ready data workflows through the 2026 dbt Labs merger. The platform has meaningful enterprise trust features, strong named-customer proof, and broad cloud / warehouse ecosystem reach, but the company still discloses far less operating and capital detail than investors would usually want for an 8B-plus mark.
