  topStrengths:
  - Managed, schema-aware product with strong trust controls and hybrid deployment support.
  - Broad connector catalog and deep ecosystem fit with Snowflake, Databricks, and hyperscalers.
  - Unusually strong named-customer proof across regulated and global enterprises.
  - dbt Labs merger broadens the strategic story from ingestion into governed data workflows.
  - Market category remains large and still growing as AI and multicloud increase data-movement complexity.
  topRisks:
  - Public revenue, margin, retention, and concentration disclosure is far too thin for an 8B-plus late-stage mark.
  - Usage-based MAR pricing creates repeated public concern about cost predictability.
  - Current tracker sources disagree materially on the exact 2026 valuation mark.
  - The business depends on source APIs, cloud platforms, and warehouse partners that can alter economics or complexity.
  - Merger integration must prove real cross-sell and workflow expansion rather than narrative alone.
  unresolvedGaps:
  - Audited revenue, gross-margin, burn, and cash-flow package.
  - Customer concentration, NRR, GRR, and renewal-duration data.
  - Current cap table, rights stack, and settled 2026 financing terms.
  - Post-merger dbt attach rates, product revenue mix, and cross-sell evidence.
  - Incident history and SLA-credit performance by severity cohort.
