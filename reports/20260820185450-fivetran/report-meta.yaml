  productSummary: Fivetran sells a usage-based managed data movement platform with hundreds of pre-built connectors, hybrid deployment, strong trust controls, destination-native warehouse and lakehouse delivery, custom connector tooling, and a widening workflow story that now includes dbt-linked transformation and AI-agent readiness.
  customerFocus: Mid-market and enterprise data teams, platform teams, and regulated organizations that need reliable pipelines into Snowflake, Databricks, and other cloud data platforms without owning connector maintenance.
  businessModel: Primarily usage-based monetization on Monthly Active Rows, with Free, Standard, Enterprise, and Business Critical packages, annual contracts / ELAs, and higher-value deployment and security controls for regulated enterprise buyers.
  stage: Late-stage private / post-merger growth stage
  fundingStatus: Officially at least $730M raised by the 2021 Series D; 2026 tracker sources imply additional financing and a current mark between roughly $5.9B and $8.4B, with the qualification event centered on a May 2026 D-1 extension at $8.42B.
  disclosureProfile: private-disclosed
