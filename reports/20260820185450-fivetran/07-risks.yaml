- id: section-3
  title: Operational transparency is partial, not comprehensive
  body: Fivetran’s public status page shows the company accepts some obligation to expose reliability, but the readable history surface does not provide enough detail to quantify outage patterns or SLA-credit risk. The retained evidence also did not surface a major unresolved public breach headline, but that should not be over-read as proof of zero incident exposure. Unknown customer concentration, unknown retention, and limited filing detail mean that several important downside scenarios remain more narrative than measurable. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts scattered public signals into reusable
    ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
  claimRefs:
  - CR007
  - CR008
  - CR011
  - CR017
  - CR026
  - CR031
  figureRefs:
  - FR003
- id: section-4
  title: The key question is whether execution risks are adequately priced
  body: The most likely downside cases are pricing compression, support friction, merger mis-execution, and overconfidence in a private-market mark that lacks public operating denominators. None of these is existential in the near term. But any one of them could be enough to break the late-stage valuation case if investors are underwriting aggressive retention and expansion assumptions. The strongest counterweight is that Fivetran appears to operate in mission-critical environments with serious trust controls. That pushes the final risk read toward “execution-risky but not obviously fragile.” From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section
    matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
