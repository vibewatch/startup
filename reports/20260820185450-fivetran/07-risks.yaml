chapter:
  number: 7
  title: Risks
  summary: Fivetran’s biggest risks are valuation-opacity risk, usage-pricing backlash, partner and API dependency, and the operational complexity of serving regulated enterprise data flows. The company’s security posture and deployment controls are meaningful mitigants, but the public record still leaves major gaps around incident detail, financial resilience, contract economics, and merger-execution risk after dbt Labs. The right read is not that Fivetran looks unsafe; it is that the downside cases are easier to imagine than to quantify from public evidence alone.
sections:
- id: section-1
  title: The main public risks are pricing, dependency, and opacity
  body: Fivetran’s strongest publicly visible risks are not sensational; they are economically serious and operationally plausible. Usage-based pricing backlash shows up repeatedly in third-party commentary, while dependency on clouds, warehouses, source APIs, and partner channels is inherent to the business model. At the same time, underwriting risk is amplified because public financing and operating disclosure remain incomplete. These are exactly the kinds of risks that can matter a lot to investors even when the product is real and the company is clearly viable. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts
    scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
  claimRefs:
