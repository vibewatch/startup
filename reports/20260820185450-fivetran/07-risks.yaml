- id: section-2
  title: Security, privacy, legal, and regulatory execution matter enormously
  body: 'The company’s core function—moving customer data across systems—creates permanent privacy and compliance exposure. GDPR, HIPAA, customer privacy expectations, SLAs, and free-plan rules all mean that execution errors could become contractual, regulatory, or reputational problems. The good news is that official materials show serious mitigants: hybrid deployment, private networking, customer-managed keys, and a broad compliance badge set, including a 2026 HITRUST announcement. The correct conclusion is that risk is real but more executional than reckless. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts scattered
    public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.'
