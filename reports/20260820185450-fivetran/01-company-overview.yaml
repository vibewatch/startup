- id: section-4
  title: Scale signals and reusable operating facts
  body: Fivetran’s best public scale signals come from company-reported operating metrics and corroborating outside surfaces. The company still references more than 5,000 customers in 2022 and, post-merger, more than 100,000 data teams across the combined ecosystem. It advertises 99.97% uptime, more than 2T monthly rows synced, more than 9.1PB moved, more than 33.5M schema changes handled, and more than 156.5M syncs per month. Tracxn’s employee estimate around 1,797 suggests the workforce is likely well above the user-provided 1,000-plus shorthand, while Gartner, FeaturedCustomers, GitHub, and partner pages all show the company has a credible external footprint. These facts are reusable, but they still do not substitute for audited revenue, board, or cap-table disclosure. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly
    what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
