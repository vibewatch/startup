- id: section-2
  title: Business model and product shape
  body: The public product and pricing record is coherent on the commercial model even if it is not financially complete. Fivetran documents 700-plus connectors and the homepage advertises 900-plus sources and destinations, which is best understood as a documented-connector subset versus a wider endpoint count. Pricing is usage-based around Monthly Active Rows, with Free, Standard, Enterprise, and Business Critical packages that progressively add sync-frequency, deployment, and security features. Hybrid deployment, private networking, customer-managed keys, and a long compliance list are important because they explain why the company sells into regulated enterprises rather than only cost-sensitive SMB automation buyers. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed,
    and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
