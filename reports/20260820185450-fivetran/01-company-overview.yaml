- id: section-3
  title: Capital formation and the current mark
  body: Older funding history is well evidenced while the exact 2026 mark is not fully settled. Fivetran’s own press releases cleanly establish the 2020 $100M Series C at a $1.2B valuation, the 2021 $565M Series D plus HVR acquisition, total funding of $730M by that point, and a $5.6B valuation. In 2026, however, secondary and market-data trackers diverge. Caplight shows roughly an $8.4B post-money signal and PM Insights reports a May 2026 Series D-1 extension near $257.4M at $8.42B, while Stock Analysis / Hiive still shows a materially lower confirmed mark. That disagreement is the most important company-overview diligence warning because investors can confirm strategic momentum without yet confirming exact entry price quality. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only
    company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
