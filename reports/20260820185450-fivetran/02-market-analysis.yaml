- id: section-3
  title: Who buys and what they are really buying
  body: The buyer is usually not a casual business user. Data engineering, analytics engineering, platform, security, and IT leadership are the typical selecting functions, with budget authority closer to the CIO, CDO, or platform organization. These teams are most often standardizing around Snowflake, Databricks, or adjacent cloud data platforms and therefore care about reliability, governance, and ecosystem fit as much as initial setup speed. Large enterprises dominate current spend because they have more systems to connect and more risk if pipelines fail. SMB growth exists, but lower-cost alternatives capture a meaningful share of that demand. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment
    conclusion. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
