- id: section-3
  title: The customer footprint is global and warehouse-centric
  body: The retained proof spans North America, Europe, and APAC and is deeply tied to mainstream warehouse and lakehouse ecosystems. Snowflake, Databricks, and AWS surfaces reinforce that customer deployments sit inside common enterprise cloud-data stacks rather than bespoke on-prem reporting projects. That ecosystem fit matters because it increases the probability that customer adoption expands with broader data-platform standardization. It also suggests the company’s best customers are sophisticated teams with meaningful long-term data estates. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts scattered public
    signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
