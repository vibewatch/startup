  - FU004
- id: section-4
  title: Customer quality looks strong, but customer economics remain mostly private
  body: The main limitation is that nearly all of this evidence is public-proof-quality evidence, not customer-economics evidence. The record does not disclose concentration, ARR by logo, renewal duration, NRR, or GRR. Public case studies are likely skewed toward success stories, and community commentary does show some cost and support friction. The safest conclusion is that customer quality appears credible and probably a strength, but real underwriting still requires internal cohort, concentration, and churn data. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth
    for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
