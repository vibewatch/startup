- id: section-2
  title: The strongest public cases point to production-scale, cross-functional usage
  body: The best cases look like enterprise programs, not isolated tests. Pfizer connects Fivetran to clinical-trial acceleration, NAB to customer experience and GenAI, Coke to 35,000-user SAP insight delivery, Cemex to 1,800-plus facilities, and HubSpot to clear cost savings. These are exactly the kinds of outcomes that suggest a data-movement vendor has become embedded in production operations. They also imply cross-functional expansion across analytics, operational reporting, and AI-adjacent workflows. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later
    chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
