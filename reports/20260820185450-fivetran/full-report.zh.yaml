          value: 80
          description: 属于结构性风险，但已有一定分散。
        - label: 合规与隐私执行
          value: 75
          description: 已有缓释，但风险后果仍然很高。
        - label: 并购执行
          value: 70
          description: 重要，但现在还太早，难以精确打分。
    approximationNotes: 数值是分析师给出的序数严重度评分，不是事件概率。
