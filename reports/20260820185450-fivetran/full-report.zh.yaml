            body: >-
              Fivetran 最好的公开规模信号来自公司披露的运营指标，以及外部页面的交叉印证。公司仍引用 2022 年超过 5,000 家客户的数据；合并后，它又引用合并生态内超过 100,000 个数据团队。官网宣传
              99.97% 正常运行时间、每月同步超过 2T 行、移动超过 9.1PB 数据、处理超过 33.5M 次 schema 变更，以及每月超过 156.5M 次同步。Tracxn 对员工数的估计约为
              1,797，说明员工规模可能明显高于用户给出的 1,000 多人概括；Gartner、FeaturedCustomers、GitHub
              和合作伙伴页面也都显示公司拥有可信的外部足迹。这些事实可以复用，但仍不能替代经审计的收入、董事会或股权结构披露。从尽调角度看，本节的价值在于把分散的公开信号整理成后续章节可复用的底层事实。重点不是假装公开记录已经完整，而是说清楚哪些有证据支撑、哪些仍只是公司单方面说法，以及私下尽调最可能在哪些地方改写投资结论。从尽调角度看，本节的价值在于把分散的公开信号整理成后续章节可复用的底层事实。重点不是假装公开记录已经完整，而是说清楚哪些有证据支撑、哪些仍只是公司单方面说法，以及私下尽调最可能在哪些地方改写投资结论。
