  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值明显上台阶，但具体价格仍有争议
        blocks:
          - type: paragraph
            body: >-
              Fivetran 现在的价值显著高于 2021 年官方 Series D 的 $5.6B 估值，这一点没有太大争议。争议在于高出多少。Caplight 和 PM Insights 支持 2026 年接近
              $8.4B 至 $8.42B 的溢价估值；Stock Analysis / Hiive 指向的最后确认水平则明显更低。Tracxn 更新更慢，仍围绕旧的 2021
              年图景，也放大了这个问题。也就是说，合格事件在方向上可信，但仅靠公开来源，确切入场价仍没有完全定案。站在尽调角度，本节把零散公开信号整理成后续章节可复用的基础事实。重点不是假装公开记录已经完整，而是讲清哪些有证据支撑、哪些仍只是公司单方声称，以及私下尽调最可能在哪些地方改变投资结论。站在尽调角度，本节把零散公开信号整理成后续章节可复用的基础事实。重点不是假装公开记录已经完整，而是讲清哪些有证据支撑、哪些仍只是公司单方声称，以及私下尽调最可能在哪些地方改变投资结论。
