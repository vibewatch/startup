    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、历史，以及 2026 年的公司形态
        blocks:
          - type: paragraph
            body: >-
              Fivetran 当前的公开身份已经远不止“托管式 ETL”这个旧简称。官方页面把公司锚定为一家自动化数据移动平台：2012 年成立，总部在 Oakland，从 Y Combinator
              起步，扩展成全球分布的基础设施厂商。2026 年 6 月与 dbt Labs 合并后，这个身份又向前推了一步：Fivetran 现在把合并后的平台描述为可信 AI
              智能体的基础设施，而不只是连接器自动化。因此，本报告后续最稳妥的可复用事实底座是：这是一家总部位于 Oakland
              的后期私有数据集成平台，拥有托管连接器、重企业级信任要求，并围绕有治理的数据移动加转换扩展产品叙事。从尽调角度看，本节的价值在于把分散的公开信号整理成后续章节可复用的底层事实。重点不是假装公开记录已经完整，而是说清楚哪些有证据支撑、哪些仍只是公司单方面说法，以及私下尽调最可能在哪些地方改写投资结论。从尽调角度看，本节的价值在于把分散的公开信号整理成后续章节可复用的底层事实。重点不是假装公开记录已经完整，而是说清楚哪些有证据支撑、哪些仍只是公司单方面说法，以及私下尽调最可能在哪些地方改写投资结论。
