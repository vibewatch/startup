      - number: '2.4'
        title: Fivetran 的位置，以及市场反推的边界
        blocks:
          - type: paragraph
            body: >-
              Fivetran 可服务市场小于整个集成 TAM，这一点对承销很重要。开源和自托管工具在低端压制定价，而 Boomi、Informatica、Qlik Talend 和 SnapLogic
              能赢下更宽的平台交易，范围包括 API 和应用集成。dbt 仍更靠近转换环节，而不是上游抽取；反向 ETL 会扩大预算，但并不完全定义同一个市场。结果是一个好但有边界的品类位置：Fivetran
              在面向数据仓库的企业托管式 ELT
              中位置不错，但不能假定自己能拿下每一条工作流、编排或集成预算线。从尽调角度看，本节的价值在于把分散的公开信号整理成后续章节可复用的底层事实。重点不是假装公开记录已经完整，而是说清楚哪些有证据支撑、哪些仍只是公司单方面说法，以及私下尽调最可能在哪些地方改写投资结论。从尽调角度看，本节的价值在于把分散的公开信号整理成后续章节可复用的底层事实。重点不是假装公开记录已经完整，而是说清楚哪些有证据支撑、哪些仍只是公司单方面说法，以及私下尽调最可能在哪些地方改写投资结论。
