    title: 财务情况
    sections:
      - number: '4.1'
        title: 业务如何赚钱
        blocks:
          - type: paragraph
            body: >-
              Fivetran 的变现模式是财务叙事中最清晰的部分之一。公司主要按月活跃行数（MAR）定价，用免费层播种采用，然后随着数据量、同步需求和安全要求增长，把客户推向 Standard、Enterprise 或
              Business Critical 套餐。年度合同和 ELA 提供可预测性，但基本经济现实仍与数据量挂钩。客户集中更多系统时，Fivetran
              因此拥有有意义的扩张上行；但预算收紧时，客户也可能遭遇账单冲击，或激进优化行数。从尽调角度看，本节的价值在于把分散的公开信号整理成后续章节可复用的底层事实。重点不是假装公开记录已经完整，而是说清楚哪些有证据支撑、哪些仍只是公司单方面说法，以及私下尽调最可能在哪些地方改写投资结论。从尽调角度看，本节的价值在于把分散的公开信号整理成后续章节可复用的底层事实。重点不是假装公开记录已经完整，而是说清楚哪些有证据支撑、哪些仍只是公司单方面说法，以及私下尽调最可能在哪些地方改写投资结论。
