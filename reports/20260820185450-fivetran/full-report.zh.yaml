companyProfile:
  summary: >-
    Fivetran 是一家后期私有数据集成公司，凭托管式、感知 schema 的 ELT 进入现代数据仓库成名；2026 年与 dbt Labs 合并后，叙事进一步扩展到有治理的转换和面向 AI
    的数据工作流。平台具备有分量的企业级信任功能、强有名客户证据和广泛的云 / 数据仓库生态触达，但公司披露的运营和资本细节仍远少于投资人通常会要求匹配超过 $8B 估值的水平。
