  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场规模很大，但品类边界很重要
        blocks:
          - type: paragraph
            body: >-
              保留的市场来源都支持数据集成是一个大机会，但它们描述的是不同切片。Precedence Research 指向数据集成市场在 2026 年约 $19.2B、到 2035 年超过 $51B；Research and
              Markets 则给出一个更宽口径、到 2030 年超过 $33B 的路径。Integrate.io 和 Peliqan 的 ETL / 管道聚焦摘要显示当前数字更小，但增长方向相近。正确结论不是挑一个神奇的
              TAM 数字，而是承认 Fivetran 所在的是一个拥有持久增长的数十亿美元级市场，同时记住
              ELT、数据管道和更宽的数据集成平台标签不能互换。从尽调角度看，本节的价值在于把分散的公开信号整理成后续章节可复用的底层事实。重点不是假装公开记录已经完整，而是说清楚哪些有证据支撑、哪些仍只是公司单方面说法，以及私下尽调最可能在哪些地方改写投资结论。从尽调角度看，本节的价值在于把分散的公开信号整理成后续章节可复用的底层事实。重点不是假装公开记录已经完整，而是说清楚哪些有证据支撑、哪些仍只是公司单方面说法，以及私下尽调最可能在哪些地方改写投资结论。
