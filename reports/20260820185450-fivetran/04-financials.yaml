- id: section-3
  title: What we can and cannot infer about financial quality
  body: The strongest positive inference is that enterprises appear willing to pay for the product when reliability, trust, and regulated deployment matter. Customer-proof pages cite large operational benefits such as HubSpot’s $100,000 savings and NAB’s cost and ML gains, and product pages claim significant ingestion-cost reductions through managed landing patterns. But those anecdotes do not solve the missing denominator problem. There is still no reviewed public ARR, gross margin, burn, cash, or NRR disclosure. That makes the financial story plausible, not proven. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts
    scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
