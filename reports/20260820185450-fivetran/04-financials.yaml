chapter:
  number: 4
  title: Financials
  summary: Fivetran’s public financial picture is strongest on business-model mechanics and historical financing rather than on operating statement disclosure. Usage-based MAR pricing, enterprise packaging, and trust-driven upsell paths are clear; actual revenue, margin, burn, and retention remain undisclosed. That means underwriting depends heavily on pricing design, customer ROI anecdotes, capital history, and the degree to which 2026 secondary-market marks imply confidence in sustained growth and durable unit economics.
sections:
- id: section-1
  title: How the business makes money
  body: Fivetran’s monetization model is one of the clearest parts of the financial story. The company prices primarily on Monthly Active Rows, uses a free tier to seed adoption, and then pushes customers toward Standard, Enterprise, or Business Critical packages as data volume, sync needs, and security requirements grow. Annual contracts and ELAs offer predictability, but the basic economic reality remains volume-linked. That gives Fivetran meaningful expansion upside when customers centralize more systems, yet it also creates the risk that customers experience bill shock or optimize rows aggressively when budgets tighten. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence
    perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
