- id: section-2
  title: Public funding history is real; public operating metrics are not
  body: Official financing history is strong through 2021. Fivetran’s own releases establish the 2020 Series C and the 2021 $565M Series D at a $5.6B valuation, with at least $730M raised by that point. After that, the record becomes much noisier. Independent trackers imply additional financing activity and higher marks, but the company does not provide a public 2026 revenue run-rate, ARR, margin, burn, or retention framework to match those marks. The result is a late-stage capital story with credible momentum but weak operating transparency. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts scattered public signals
