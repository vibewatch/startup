- id: section-4
  title: The main financial underwriting issue is opacity, not category demand
  body: The central financial question is therefore not whether customers spend money on data integration. It is whether Fivetran’s usage-based model can sustain premium growth and margins without creating enough pricing friction to invite down-market substitution. Critics repeatedly focus on surprise bills and MAR inflation, while competitor pricing pages emphasize simpler packaging. Secondary-market marks suggest some investors remain bullish anyway, but those marks cannot replace internal revenue, cohort, and margin disclosure. Any serious underwriting case must ask management for the real operating model behind the public pricing shell. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
    From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
