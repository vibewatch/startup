- id: section-3
  title: The platform is broadening beyond connector sync alone
  body: The product story in 2026 is broader than classic SaaS-to-warehouse ingestion. Official materials point to managed data lake landing, transformations and activations in the pricing surface, and post-merger expansion through dbt workflows and trusted AI-agent positioning. That does not mean Fivetran has escaped dependence on core ingestion, but it does mean the company is trying to widen the value chain it owns. The product now looks more like a governed data movement layer with adjacent workflow capture than a narrow pipe vendor. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts scattered public signals into
    reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion.
  claimRefs:
