- id: section-4
  title: Developer and ecosystem surfaces improve extensibility, but the moat is still operational
  body: The Connector SDK documentation, GitHub repositories, Terraform provider, PyPI package, and partner pages all show that extensibility matters. That helps offset the common critique that only open-source platforms can cover the long tail. Still, the visible moat is not the existence of SDK docs by itself. It is the operational ability to keep many connectors working across partner destinations with minimal customer maintenance. That moat is real but also exposed to third-party API changes and the limits of company-reported performance claims. From a diligence perspective, this section matters because it converts scattered public signals into reusable ground truth for later chapters. The point is not to pretend the public record is complete; it is to state clearly what is supported, what is still only company-claimed, and where private diligence would most likely change the investment conclusion. From a diligence perspective, this section matters because it converts scattered public
