evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: company-identity
    missingEvidence: An authoritative company or incorporation record establishing whether CertiK was founded in 2017 or 2018.
    whyItMatters: >-
      The conflicting dates affect the company timeline and how readers interpret operating tenure and funding
      milestones.
    diligencePath: Obtain formation documents or a company-approved corporate history and reconcile it with the public profiles.
    relatedQuestionRefs:
      - QO001
  - type: private-evidence-only
    severity: material
    topic: financials-and-scale
    missingEvidence: >-
      Audited revenue and ARR, services-versus-subscription mix, growth, gross margin, retention, client concentration,
      and a dated employee count.
    whyItMatters: >-
      Company-reported client reach and third-party funding figures do not establish recurring economics, profitability,
      or current operating scale.
    diligencePath: >-
      Request audited financial statements, metric definitions and periods, customer cohort and concentration schedules,
      and a current employee roster.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-and-ownership
    missingEvidence: >-
      A current board and executive roster, cap table, share classes, investor rights, secondary transactions, and debt
      or credit terms.
    whyItMatters: Public investor names do not show current ownership, control, dilution, preferences, or governance depth.
    diligencePath: >-
      Request the current cap table, charter and financing documents, board materials, debt schedule, and governance
      policies.
    relatedQuestionRefs:
      - QO009
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: material
    topic: ipo-and-valuation
    missingEvidence: >-
      A current independent valuation, definitive IPO timetable or filing, and evidence of internal-control and
      public-company readiness.
    whyItMatters: The $2 billion figure is associated with 2022 financing and management has described IPO plans as non-concrete.
    diligencePath: >-
      Request current investor marks or transaction terms, any board-approved IPO plan, and an internal-controls or
      readiness assessment.
    relatedQuestionRefs:
      - QO004
      - QO010
  - type: missing-source
    severity: material
    topic: web3-security-market-sizing
    missingEvidence: >-
      A current global spend estimate with its market boundary, geography, component definitions, forecast assumptions,
      and a separately supported CertiK SAM/SOM.
    whyItMatters: >-
      Component-level forecast gains and attack losses do not establish addressable vendor revenue, limiting any
      defensible market-growth or penetration conclusion.
    diligencePath: >-
      Obtain the full TBRC model and full Research and Markets report with disclosed definitions; reconcile the scope to
      CertiK's paid products and verified revenue by product.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: certik-commercial-economics
    missingEvidence: >-
      Public pricing, realized contract values, buyer-level budgets, recurring versus project revenue, and market-share
      calculations for CertiK.
    whyItMatters: >-
      Product availability and stated institutional interest do not demonstrate willingness to pay, actual spending, or
      the company's capture of the addressable market.
