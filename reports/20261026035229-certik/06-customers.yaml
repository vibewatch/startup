      - ["Aptos", "Digital-asset ecosystem project named in both the Quasa profile and Web3Security.ai's audit directory.", "Named audit/client signal; no deployment status or contract terms are established by these pages.", "No customer outcome is independently quantified.", "Directory entries and promotional profiles do not prove current production use, repeat work, or paid status."]
      - ["Polygon", "Digital-asset ecosystem project named in both the Quasa profile and Web3Security.ai's audit directory.", "Named audit/client signal; no deployment status or contract terms are established by these pages.", "No customer outcome is independently quantified.", "Directory entries and promotional profiles do not prove current production use, repeat work, or paid status."]
      - ["OKX AI marketplace", "TechCrunch reports CertiK among the early builders, offering an agent service to assess wallet or token security.", "Early-builder participation; transaction volume and paid status are not reported.", "No customer outcome or usage measure is reported.", "A marketplace presence is not evidence of recurring or scaled adoption."]
    enumerationScope:
      coverage: partial
      basis: >-
        Partial sample of named public project and engagement mentions in the
        assigned sources for this chapter; it is not a complete customer roster.
    notes: >-
      Two named projects are directory or review mentions rather than customer
      confirmations; Gate is the only source-backed scoped engagement in this
      sample. No row establishes retention or customer economics.
    claimRefs: [CU001, CU004, CU006, CU007, CU008, CU011, CU016]
