      - ["Audited projects / findings / formally verified projects", "6,206+ / 93,145+ / 1,233+", "Figures reported from company pages, reviewed October 2026", "Self-reported figures reproduced by Web3Security.ai; medium confidence", "Project throughput and technical activity, not a count of active customers.", "No project-to-account mapping, revenue, repeat use, or unique-customer denominator."]
      - ["Gate Dubai proof-of-reserves review", "10 tokens; 9 networks; 22 reserve wallets; reserve ratios at least 100% by native token units", "Liability snapshot dated 2025-12-31; report describes a March 2026 completion", "Crowdfund Insider report; medium confidence", "A named, scoped verification engagement.", "Point-in-time only; no repeat period, fee, renewal, or customer outcome data."]
      - ["CoinMarketCap Security Score integration", "Integration announced; CertiK claimed audits of over 70% of the top 500 Web3 projects ranked by CoinMarketCap", "Company release dated 2023-05-18", "Company-issued GlobeNewswire release syndicated by Yahoo Finance; medium confidence", "Historical distribution signal, not current customer penetration.", "No user engagement, paid conversion, or current coverage denominator beyond the top-500 reference."]
      - ["OKX AI marketplace participation", "CertiK listed as an early builder; its service assesses wallet or token security before a transaction", "TechCrunch article dated 2026-06-30", "Independent customer-proof reporting; medium confidence", "A named product-distribution surface.", "No paid status, transaction volume, active-user count, or customer outcome is disclosed."]
