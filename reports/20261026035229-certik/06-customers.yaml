      - ["Financial institutions and digital-asset businesses", "Compliance officers, AML investigators, risk leaders; buyers may include banks, exchanges, VASPs, and fintechs", "A CertiK job brief names these customer personas; a paid company release claims institutional and regulatory adoption.", "Potential higher-value compliance use; no named deployed institution or contract terms are disclosed.", "Named production deployments, usage, procurement cycle, ACV, and implementation outcomes."]
      - ["Hub71 portfolio companies", "Early-stage digital-asset startups and their compliance or security leads", "CertiK says eligible companies receive a 20% service discount, a share of a $200,000 subsidy pool, and free compliance-tool access.", "Channel access and subsidized onboarding may support ecosystem reach.", "Partner-side confirmation, uptake, subsidy utilization, conversion, and repeat purchases."]
