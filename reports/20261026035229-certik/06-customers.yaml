schemaVersion: "report-v2"
artifact: customers
slug: certik
runDate: "2026-10-26"
company:
  name: CertiK
chapter:
  number: 6
  title: Customers
  summary: >-
    CertiK's public materials show a broad intended buyer set, customer-acquisition
    offers, and isolated named audit or partnership examples, but most customer
    scale figures are company-reported and do not establish active use or durable
    recurring revenue. Named examples include a point-in-time Gate Dubai
    proof-of-reserves review and CertiK's early-builder participation in OKX's AI
    marketplace; retention, outcomes, and concentration remain unverified.
sections:
  - id: buyer-segments
    title: Buyers, users, and customer-acquisition routes
    body: >-
      CertiK's AML and digital-asset compliance product role describes institutional
      buyers including financial institutions, exchanges, VASPs, and fintechs, with
      day-to-day users such as compliance officers, investigators, and risk teams
      (CU001). This is a company hiring brief, not evidence that each segment has
      deployed or paid for the product. Its stated product success measures include
      adoption, usage, enterprise wins, and expansion (CU002), which are metrics the
      company says it intends to manage rather than disclosed results. CertiK's
      public X profile lists smart-contract audits, on-chain monitoring, and
      penetration testing, but it supplies no customer or usage measure (CU003).
      CertiK also says Hub71 portfolio companies receive discounted services and
      free access to a compliance tool (CU011). These are product and channel
      signals, not proof of paid conversion. Public materials do not quantify the
      mix of these segments, their revenue contribution, or the number of active
      users within them.
    claimRefs: [CU001, CU002, CU003, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-record
    title: Public adoption signals and what they establish
    body: >-
      A paid CertiK release carried by CoinDesk says the company has served more
      than 5,500 clients across over 150 countries and regions, and says its
      compliance product is already adopted by financial institutions and
      regulatory authorities (CU004, CU005). Those are company claims, without a
      named deployment, active-customer definition, or usage denominator. A
      separate Web3Security.ai profile attributes broadly similar totals to
      CertiK's own pages and explicitly calls the figures self-reported (CU004,
      CU008). Its audit-volume totals describe project throughput, not current
      paying accounts. A stronger named engagement is Crowdfund Insider's account
      of a CertiK proof-of-reserves review for Gate Technology FZE; the work covered
      a dated reserve snapshot and does not establish ongoing monitoring or renewal
      (CU006, CU007). TechCrunch reports CertiK among OKX AI's early builders, a
      named distribution surface but not usage, revenue, or repeat-purchase
      evidence (CU016). Historical CoinMarketCap integration and Hub71 offers
      likewise add distribution and partnership signals, not retention evidence
      (CU010, CU011).
    claimRefs: [CU004, CU005, CU006, CU008, CU010, CU011, CU016]
    tableRefs: [TU002, TU003]
  - id: durability-and-risk
    title: Durability, concentration, and diligence gaps
    body: >-
      The available customer record is a mix of self-reported totals, marketing
      offers, directory listings, and isolated project engagements. It does not
      disclose net or gross revenue retention, renewal rates, churn, contract
      duration, repeat-purchase cohorts, customer-level revenue, or top-account
      concentration (CU013, CU014). The Gate review is expressly a snapshot rather
      than perpetual assurance, so it is useful evidence of one scoped engagement
      but not proof of a recurring customer relationship (CU006). Quasa displays
      a 4.8/5 rating without a visible review sample or methodology in the assigned
      page, which is not a defensible satisfaction benchmark (CU015). DL News
      reporting carried by Yahoo describes criticism related to Kraken, Huione,
      and an account compromise (CU012); this warrants customer-reference and
      procurement diligence, but does not show customer losses or churn. Obtain
      customer-level cohort, renewal, use, and concentration schedules before
      assigning durable recurring economics.
    claimRefs: [CU006, CU012, CU013, CU014, CU015]
    tableRefs: []
