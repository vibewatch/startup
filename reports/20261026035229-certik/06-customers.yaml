    notes: >-
      Figures retain each source's metric and period. Client totals are company
      claims, audit totals are self-reported activity, and the Gate review is a
      point-in-time engagement rather than a recurring-revenue measure.
    claimRefs: [CU004, CU005, CU006, CU008, CU010, CU011, CU016]
  - id: TU003
