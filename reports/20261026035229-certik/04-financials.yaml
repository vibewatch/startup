schemaVersion: "report-v2"
artifact: financials
slug: certik
runDate: 2026-10-26
company:
  name: CertiK
chapter:
  number: 4
  title: Financials
  summary: CertiK's public materials describe a broad mix of audit, monitoring, and compliance offerings and report substantial customer and platform reach, but the assigned evidence does not establish recognized revenue, recurring mix, margins, or cash runway. Historical valuation and financing reports are not substitutes for current liquidity or unit economics, so underwriting remains blocked on company-provided financials and contract-level evidence.
sections:
  - id: revenue-model
    title: Revenue model and sales motion
    body: >-
      CertiK presents a portfolio that spans project-scoped code audits, penetration testing and formal verification, alongside Skynet monitoring and compliance or risk products. That breadth supports several plausible revenue mechanisms—one-off assessments and potentially ongoing monitoring or institutional services—but the reviewed materials do not disclose which offerings are paid subscriptions, how contracts are priced, or how much revenue each contributes. The company's product descriptions and institutional positioning are evidence of commercial scope, not proof of booked demand or recurring revenue. Public pricing is not listed in the Web3Security.AI profile, which says to request a quote; no retained source supplies realized rates, discounting, contract duration, or revenue-recognition policy. These omissions prevent a defensible estimate of revenue quality or sales efficiency.
    claimRefs:
      - CI001
      - CI007
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: traction-and-pricing
    title: Public traction is not revenue
    body: >-
      CertiK's website displays 5,500 clients served, $471 billion in market cap assessed, more than 21,000 projects monitored, and more than 1.8 million monthly active users. These are company-reported reach or activity measures with different denominators; none is revenue, ARR, paying-customer count, retention, or collected cash. A 2023 company-issued release also claimed audits of more than 70% of the top 500 Web3 projects ranked by CoinMarketCap, a specific historical company claim rather than a current share of spend. A 2026 press release describes compliance intelligence spanning more than 20 blockchains and 400 million labeled addresses, but does not quantify commercial conversion. The customer and platform statistics therefore signal distribution and potential demand, while the bridge from reach to paid contracts remains unverified.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI009
    tableRefs:
      - TI002
  - id: unit-economics
    title: Cost structure and unit economics
    body: >-
      Audit and formal-verification work plausibly requires specialist review, while ongoing monitoring and compliance products imply software, data, and support costs; the retained sources do not quantify these cost drivers or show their allocation by product. No source provides gross margin, utilization, delivery hours, rework, partner fees, acquisition cost, sales cycle, payback, renewal, or working-capital data. Crypto Careers displays a $115,000–$230,000 salary range for an unspecified role, without a date or role/location basis, so it is not a reliable labor-cost benchmark. The available material consequently supports no defensible customer-level contribution margin or service-to-software margin path. A diligence model should keep these inputs unavailable rather than back-solving them from market-cap-assessed, client, or monitoring counts.
    claimRefs:
      - CI008
      - CI014
    tableRefs:
      - TI003
  - id: capital-and-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      Public reporting describes a roughly $2 billion valuation and IPO interest, while DL News reports a Binance follow-on investment described by the CEO as “multi-eight figures.” The same reporting places the last priced valuation in 2022 and reports historical aggregate funding; neither historical capital raised nor an investor commitment establishes current cash available. The assigned evidence contains no current cash balance, burn, debt schedule, runway, financing terms, or use-of-funds plan, and IPO discussion is not evidence of a committed timetable or funding need. Separately, HOGE Wire documents adverse trust controversies but does not quantify any resulting churn, pricing, or collection impact. The financial verdict is therefore scale-positive but financially unproven: obtain audited revenue and cash-flow statements, product-level contract data, and a current capitalization/debt schedule before underwriting margin expansion, liquidity, or an IPO case.
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI013
      - CI015
      - CI016
tables:
  - id: TI001
    title: Revenue streams and monetization evidence
    columns:
      - Stream / mechanism
      - Publicly evidenced status
      - Price, unit, or contract terms
      - Underwriting implication / diligence ask
    rows:
      - - Code audits, penetration testing, and formal verification
        - Company materials describe these as services; project-level scope is not a disclosed revenue measure.
        - No list price, realized price, discount, or recognition policy in the assigned evidence.
        - Obtain signed contracts, scoped fees, delivery hours, billing milestones, and revenue-recognition treatment.
      - - Skynet monitoring and security ratings
        - The company reports more than 21,000 projects monitored and more than 1.8 million monthly active users.
        - No paid-user count, subscription price, renewal rate, or usage-to-payment conversion disclosed.
        - Separate free reach from paying accounts; obtain cohort retention, attach rate, and recurring revenue.
      - - Compliance, AML, and institutional risk products
        - Company materials describe compliance and risk offerings, including intelligence across more than 20 blockchains.
        - No contract values, customer count by product, implementation fees, or recurring terms disclosed.
        - Request product-level bookings, implementation effort, partner costs, and renewal terms.
      - - DLT advisory and other institutional assessments
        - The 2026 company press release describes expanded institutional risk-management positioning.
        - No service volume, realized rate, revenue share, or customer concentration disclosed.
        - Request revenue by service line, top-customer exposure, and signed pipeline conversion.
    notes: >-
      Sources are company web pages and company-issued releases plus the assigned third-party profile. Null or “not disclosed” means not present in this retained evidence set, not zero and not proof that the information is unavailable elsewhere; all operating scale metrics remain distinct from recognized revenue.
    claimRefs:
      - CI001
      - CI007
      - CI009
      - CI013
  - id: TI002
    title: Public traction and commercial-quality limits
    columns:
      - Public signal
      - Issuer and measure
      - What it does not establish
      - Diligence follow-up
    rows:
      - - 5,500 clients served
        - CertiK website; company-issued CoinDesk release says more than 5,500 clients.
        - Paying or active customers, concentration, contract value, or period.
        - Reconcile the count to paying accounts, active contracts, and customer cohorts.
      - - $471 billion market cap assessed
        - CertiK website's label; no period or valuation methodology shown in the retained page.
        - Assets under custody, transaction volume, company revenue, or client value.
        - Request the metric definition, time window, deduplication method, and assurance.
      - - 21,000+ projects monitored; 1.8M+ monthly active users
        - CertiK website company-reported platform indicators.
        - Paid conversion, contract renewal, user monetization, or project-level fees.
        - Reconcile active users and monitored projects to billing and retention cohorts.
      - - More than 70% of top 500 projects audited
        - May 2023 CertiK/GlobeNewswire company release, using CoinMarketCap's top-500 cohort.
        - Current share of paid audit spend, pricing power, or share of all Web3 projects.
        - Refresh the cohort definition and compare signed audit value with addressable spend.
      - - Public pricing absent
        - Web3Security.AI profile states “not published; quote on request.”
        - Realized prices, discounts, or consistent pricing across service lines.
        - Obtain price lists and a sample of anonymized realized contracts.
    notes: >-
      The source metrics have different issuers, dates, denominators, and meanings. The company-reported measures are not independent verification and should not be combined into a revenue estimate.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
  - id: TI003
    title: Underwriting inputs and current evidence gaps
    columns:
      - Input
      - Public value in assigned evidence
      - Confidence / limitation
      - Required diligence evidence
    rows:
      - - Recognized revenue and revenue mix
        - null
        - No audited or period-specific value in the retained sources.
        - Audited income statements and revenue by audit, monitoring, and compliance line.
      - - ARR, NRR, GRR, churn, and renewal
        - null
        - No recurring-revenue or cohort measure disclosed.
        - Contract-level recurring revenue, cohort retention, cancellations, and customer definitions.
      - - Gross margin and delivery cost
        - null
        - No margin, utilization, delivery-hour, or rework data.
        - Product-level direct labor, cloud/data, partner, remediation, and support costs.
      - - CAC, payback, and sales efficiency
        - null
        - No acquisition spend, sales cycle, or payback evidence.
        - Channel-level pipeline, bookings, sales expense, and cohort payback.
      - - Cash, burn, runway, debt, and working capital
        - null
        - No current balance-sheet, cash-flow, debt, or liquidity value in the assigned evidence.
        - Latest balance sheet, monthly cash flow, debt instruments, covenant schedule, and 18–24-month plan.
      - - Financing proceeds and IPO readiness
        - Historical funding and valuation reported; current available cash and IPO timetable are unknown.
        - Historical capital raised and an investor-reported follow-on are not cash-on-hand or committed runway.
        - Current cap table, preferences, option pool, financing documents, audit status, and IPO-readiness plan.
    notes: >-
      “null” is an evidence gap, not a zero. The salary range on the Crypto Careers profile has no stated role, location, or date and is not used to estimate company payroll. Historical funding and valuation are retained only as context and not treated as liquidity.
    claimRefs:
      - CI008
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
figures:
  - id: FI001
    title: Illustrative commercial path, with unmeasured economics
    type: flow
    summary: Company-described assessment and monitoring products may feed contract revenue, but pricing, cost, and cash conversion are not disclosed in the assigned evidence.
    data:
      nodes:
        - id: assessment
          label: Project assessment
          detail: Audits, penetration testing, and formal verification; scope and price are not public.
        - id: ongoing
          label: Monitoring and compliance
          detail: Skynet and institutional compliance/risk offerings; paid attachment and renewal are unknown.
        - id: quoted-terms
          label: Quoted commercial terms
          detail: Third-party audit-price estimates vary by scope; CertiK's list and realized prices are not disclosed.
        - id: revenue
          label: Contract revenue
          detail: One-off versus recurring mix, billing terms, and revenue recognition are undisclosed.
        - id: contribution
          label: Gross profit and cash
          detail: Delivery labor, data costs, rework, collections, and cash conversion are unavailable.
        - id: underwriting
          label: Underwriting inputs
          detail: CAC, renewal, gross margin, burn, and runway require private diligence.
    approximationNotes: >-
      Ordered stages are an illustrative commercial pathway, not a measured funnel, revenue bridge, or claim that each customer buys every stage.
    claimRefs:
      - CI001
      - CI007
      - CI009
      - CI013
      - CI014
callouts:
  - calloutType: risk
    title: Reach metrics are not monetization
    body: Company-reported client, monitored-project, user, and assessed-market-cap figures do not establish paying accounts, revenue, retention, or cash generation.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
  - calloutType: recommendation
    title: Require primary financial diligence
    body: Do not underwrite margins, runway, or IPO readiness from historical financing, public scale indicators, or the reported investor follow-on; obtain audited statements and current liquidity evidence.
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
