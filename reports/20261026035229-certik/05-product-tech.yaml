schemaVersion: "report-v2"
artifact: product-tech
slug: certik
runDate: 2026-10-26
company:
  name: CertiK
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Public sources describe CertiK as combining formal verification, security
    audits, continuous monitoring, risk intelligence, and compliance services,
    with a customer-published audit example and an open-source agent-skills
    repository. The evidence establishes a broad product surface, but not
    independently measured reliability, comparative efficacy, or a complete
    technical architecture.
sections:
  - id: product-landscape
    title: A portfolio spanning assurance, monitoring, and compliance
    body: >-
      A paid company release on October 19, 2026 describes CertiK's expansion
      from smart-contract security into broader risk management, including
      audits, formal verification, penetration testing, and compliance
      services. Web3 Security.AI's external profile also lists audits,
      penetration testing, formal verification, and Skynet monitoring. These
      sources establish a broad marketed portfolio, not proof that every
      capability is delivered through one integrated software platform. The
      assigned IQ.wiki profile returned only the publisher's own branding and
      contact text, so it adds no CertiK-specific product detail. Public
      materials reviewed do not expose complete module boundaries or a common
      customer workflow; the map therefore separates named services rather
      than inferring a unified technical stack.
    claimRefs:
      - CE001
      - CE002
      - CE015
    tableRefs:
      - TE001
  - id: customer-workflows
    title: Audits, project monitoring, and identity checks
    body: >-
      The clearest customer-level technical example comes from Gem Wallet, which
      says CertiK assessed its iOS and Android applications against OWASP mobile
      security standards using manual code review, static analysis, and dynamic
      runtime testing across Swift, Kotlin, and Rust code. Gem Wallet reports
      eleven findings total: zero critical, zero high, six medium, and five low.
      It says all six medium findings were resolved before publication; of the
      five low findings, one was resolved and four were acknowledged. This is a
      customer-published account, not an independently reviewed audit report.
      A CertiK job listing also describes a KYC-badge
      workflow involving interviews, open-source investigation, identity
      documents, and written decision records; it is evidence of a described
      service workflow, not proof of its current throughput or control quality.
    claimRefs:
      - CE003
      - CE004
      - CE008
      - CE009
    tableRefs:
      - TE002
  - id: technical-evidence-and-gaps
    title: Public technical signals do not establish system performance
    body: >-
      The strongest technical detail in the assigned sources is a customer
      account of a mobile audit: Gem Wallet says CertiK used manual review,
      static analysis, and dynamic runtime testing across Swift, Kotlin, and
      Rust code. Web3 Security.AI describes the firm's audit service as using
      manual expert review, AI-assisted analysis, and optional formal
      verification, but does not provide independent efficacy data. CertiK's
      public GitHub repository documents agent-facing skills for Skynet Score,
      SkyInsights, Skylens, and Token Scan, including differing authentication
      requirements. This demonstrates a public developer surface, not adoption,
      security review coverage, or production reliability. Crypto Careers'
      profile reports Skynet monitoring for over 20,000 projects and 1.8
      million monthly users, but does not give metric definitions or an
      underlying source, so neither figure is independently verified.
      Web3 Security.AI cautions that project-page audit counts may include work
      by other firms. CertiK's 2026 prediction-markets release describes its
      Skynet Top Board risk framework and identifies oracle manipulation,
      administrative-key exposure, and front-running as sector risks; these
      are not findings about CertiK's own products. The profile also recounts a
      June 2024 Kraken bug-bounty dispute, with conflicting accounts of whether
      CertiK's live-system testing was authorized. The original parties'
      statements are not in the assigned pool, so this is a diligence lead, not
      a resolved finding. Quasa's generic review cautions that audits do not
      eliminate all risk but supplies no methodology or outcome data. No
      assigned source supplies independently measured audit efficacy, uptime,
      API performance, or a full architecture diagram.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE011
      - CE012
      - CE013
      - CE014
      - CE016
    tableRefs:
      - TE003
    figureRefs:
      - FE001
tables:
  - id: TE001
    title: Product and capability map
    columns:
      - Product or capability
      - User or job
      - Publicly described status
      - Distinct capability in the evidence
      - Diligence limitation
    rows:
      - - Smart-contract assurance
        - Protocol teams commissioning security review
        - Current company and third-party descriptions
        - Formal verification and security auditing are listed together
        - Methodology, scope, reviewer allocation, and outcome benchmarks are not independently documented here
      - - Skynet
        - Web3 users and project teams seeking project-level risk information
        - Described as monitoring and project-rating product
        - Public profile/monitoring surface; exact scoring method is not established by the assigned sources
        - Reliability, score calibration, and data coverage need independent verification
      - - SkyInsights and compliance services
        - Institutions handling transaction-risk or compliance workflows
        - Named in company materials and the public skills repository
        - Transaction and AML risk services are described; repository marks SkyInsights as authenticated
        - API documentation, regulatory-control mapping, and service levels are not supplied
      - - KYC badge
        - Web3 project teams seeking identity and background screening
        - Job listing describes an operating service workflow
        - Interviews, open-source investigation, and identity-document verification are described
        - Current review criteria, privacy controls, appeal process, and throughput are not evidenced
      - - CertiK agent skills
        - Developers and AI-agent users
        - Public GitHub repository
        - Repository lists Skynet Score, SkyInsights, Skylens, and Token Scan skills
        - Public code and documentation do not prove adoption or security assurance
      - - Skynet prediction-market research
        - Web3 users assessing prediction-market sector risk
        - Company-published research report and Top Board framework
        - Report discusses sector risks and a risk-profile evaluation framework
        - Underlying data, signal weighting, and independent validation are not supplied
    notes: >-
      Product status and capabilities are attributed to the cited company,
      customer, or third-party profile source; this is not an exhaustive product
      inventory. “Not evidenced” means the assigned sources do not establish
      the item, not that the capability is absent.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
      - CE010
      - CE012
  - id: TE002
    title: Documented workflows and limits of the public proof
    columns:
      - User job
      - Described workflow
      - Evidence source
      - Supported outcome
      - Limitation
    rows:
      - - Assess a mobile wallet
        - Manual review plus static and dynamic testing of iOS and Android apps
        - Gem Wallet customer account of its CertiK audit
        - "Customer reports 11 total: zero critical/high, six medium, and five low; it reports all medium findings resolved"
        - Customer-published account; underlying report and test coverage were not independently checked
      - - Obtain a KYC badge
        - Interviews, open-source investigation, identity-document checks, and documented decisions
        - CertiK employer text reproduced in a job listing
        - A described process for assessing project-team identity and risk
        - Job description does not establish current controls, accuracy, privacy safeguards, or service outcomes
      - - Use market and security context
        - Review security and regulatory risks across prediction-market platforms
        - CertiK's February 2026 report release, distributed through PR Newswire and Yahoo Finance
        - Company describes a Skynet Top Board framework and sector risk analysis
        - The release is company-issued and does not independently validate the analysis
    notes: >-
      The table distinguishes a company-described process from a customer
      report and third-party profiles; it does not treat intended benefits as
      measured results.
    claimRefs:
      - CE004
      - CE003
      - CE008
      - CE009
      - CE012
  - id: TE003
    title: Technical components, dependencies, and evidence gaps
    columns:
      - Component or layer
      - Documented role
      - Evidenced dependency or interface
      - Remaining technical question
    rows:
      - - Formal verification and audit
        - Company says formal verification and security auditing support risk management
        - No implementation details or workload measures in assigned sources
        - What properties, languages, and scopes are covered per engagement?
      - - Skynet intelligence
        - Project monitoring, ratings, and a sector-specific Top Board evaluation framework
        - Company profile and company-published prediction-markets report
        - How are signals validated, weighted, updated, and governed?
      - - Live-system testing
        - A third-party profile recounts a 2024 dispute over authorization and testing conduct
        - Original Kraken and CertiK statements are not in the assigned pool
        - What written rules of engagement, scope, and escalation controls applied?
      - - SkyInsights and KYC
        - Transaction/AML risk and identity-screening services
        - Public skills mark SkyInsights as authentication-required; job listing describes identity documents
        - What privacy, access-control, retention, and regulatory controls apply?
      - - Agent tooling
        - Public skills connect agent workflows to CertiK security tools
        - GitHub repository documents Python-based skills and API access requirements
        - What threat model, release controls, and independent security review cover the tools?
    notes: >-
      This is a source-bounded component map, not a verified deployment
      architecture. The assigned materials do not specify internal data flows,
      system boundaries, availability targets, or security-control evidence.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE006
      - CE010
      - CE012
      - CE014
      - CE016
