  evidenceGaps:
    - type: missing-source
      severity: material
      topic: product-performance
      missingEvidence: Independent audit-efficacy results, service availability, API latency, and customer-outcome measures tied to defined periods and denominators.
      whyItMatters: Product breadth and company-reported scale do not establish reliable delivery or improved security outcomes.
      diligencePath: Request representative engagement reports, uptime and incident history, API service-level data, and customer references with comparable pre/post outcome definitions.
      relatedQuestionRefs:
        - QE009
    - type: missing-source
      severity: material
      topic: security-controls
      missingEvidence: Current product-specific security and privacy controls, certification scope and dates, retention policies, and independent assurance reports.
      whyItMatters: The reviewed product evidence includes identity data and authenticated risk tooling, but does not establish how sensitive data and access are governed.
      diligencePath: Obtain current certification reports and scopes, privacy/data-flow documentation, access-control design, and independent penetration-test summaries.
      relatedQuestionRefs:
        - QE010
    - type: missing-source
      severity: material
      topic: live-testing-governance
      missingEvidence: The original Kraken and CertiK statements, engagement scope, authorization records, and applicable rules of engagement for the June 2024 live-system testing dispute.
      whyItMatters: The third-party profile presents conflicting accounts, so the public evidence reviewed cannot establish the scope, authorization, or adequacy of the testing conduct.
      diligencePath: Obtain both parties' original statements and the relevant engagement authorization, scope, escalation, and remediation records.
