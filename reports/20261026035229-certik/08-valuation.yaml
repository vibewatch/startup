schemaVersion: "report-v2"
artifact: valuation
slug: certik
runDate: 2026-10-26
company:
  name: CertiK
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports continued diligence on CertiK's expanded security and
    compliance proposition, but it does not establish a current valuation or the
    financial inputs needed to underwrite one. Treat the reported $2 billion mark
    as historical, not as a current price; the evidence-based call is research-more.
sections:
  - id: evidence-and-price-anchor
    title: Evidence base and price anchor
    body: >-
      The available financing record is inconsistent and stale for entry pricing.
      The Yahoo Finance article reports $296 million raised and a $2 billion valuation by early 2022
      (CV001, CV003), while StartupHub's October 5, 2026 profile lists $242 million
      and a Series B as its total (CV002). These are reported figures, not audited
      financing records, and the sources do not reconcile the later funding total
      or disclose a current priced round (CV004). A historical valuation mark is
      not a current offer, equity value, or cash balance. The assigned public-source
      set also does not establish audited revenue, ARR, growth, margins, retention,
      or cap-table terms (CV014, CV015). Without those inputs, neither a revenue
      multiple nor a defensible absolute valuation range can be calculated.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV014
      - CV015
  - id: thesis-and-antithesis
    title: Thesis versus anti-thesis
    body: >-
      The positive case is a broader product surface: CertiK says it is moving
      beyond smart-contract security toward risk management for financial
      institutions and regulators (CV005), and a current company job listing
      describes regulatory-technology product discovery for banks, VASPs, and
      regulators (CV007). Both are company-issued evidence of strategic intent,
      not evidence of contracts or repeat usage. The anti-thesis is that product
      breadth and hiring do not demonstrate paid institutional deployment,
      software-like margins, retention, or customer concentration (CV016). The Yahoo Finance article
      also reports reputational controversies and an IPO ambition, which raises
      diligence needs rather than proving readiness or failure (CV010, CV011).
    claimRefs:
      - CV005
      - CV007
      - CV010
      - CV011
      - CV016
    tableRefs:
      - TV002
  - id: scenario-and-entry-discipline
    title: Scenarios and entry discipline
    body: >-
      The scenarios below are conditional decision cases, not forecasts. The bull
      case requires verifiable recurring revenue, retention, margins, and paid
      institutional adoption; the base case assumes a mixed services-and-software
      model with no evidence-backed multiple; the bear case tests weak economics,
      delayed commercialization, and reputation or execution setbacks. Sherlock's
      February 2026 article gives broad smart-contract audit engagement ranges, but
      Sherlock is itself an audit provider and those prices are not CertiK revenue,
      a valuation benchmark, or a comparable-company multiple (CV009). Public-market
      context is limited: CompaniesMarketCap reports CrowdStrike's $263.73 billion
      market capitalization on October 25, 2026, while Macrotrends reports annual
      revenue for 2026 of $4.812 billion, up 21.71% from 2025 (CV006, CV008).
      Macrotrends describes CrowdStrike as an endpoint-protection and threat-
      intelligence provider (CV012), not a direct proxy for CertiK's audit and
      compliance mix. No multiple, absolute scenario valuation range, or target
      return follows from these data because CertiK's current price, economics, and
      security terms are missing.
    claimRefs:
      - CV003
      - CV006
      - CV008
      - CV009
      - CV012
      - CV014
      - CV015
    tableRefs:
      - TV003
  - id: recommendation-and-diligence
    title: Recommendation and diligence priorities
    body: >-
      Recommendation: research-more, with medium confidence in the conclusion that
      public evidence is insufficient to support a price-sensitive investment call.
      This is not a finding that CertiK lacks value; the assigned evidence shows a
      substantial security-services footprint and a stated move into institutional
      risk management, but financial conversion and current share price remain
      unproven (CV005, CV007, CV016). Do not treat lifetime funding raised as
      available cash, and do not apply the historical valuation to a new security
      without a current financing record and its preference stack (CV001, CV003,
      CV015). Request audited financials, segment economics, retention and
      concentration data, current capitalization and preference terms, and
      independently verifiable paid deployments before setting an entry price or
      target return.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
      - CV015
      - CV016
    tableRefs:
      - TV001
    figureRefs:
      - FV001
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision dimension
      - Assessment
      - Evidence basis
      - Investment implication
    rows:
      - - Recommendation
        - research-more
        - Current valuation and financial underwriting inputs are not established in the assigned public-source evidence.
        - Defer a price-sensitive commitment pending primary financial and capitalization evidence.
      - - Confidence
        - medium
        - The evidence supports an insufficiency-of-proof conclusion, not an intrinsic-value estimate.
        - Confidence is limited to the diligence call, not to a point valuation.
      - - Risk rating
        - high
        - Valuation opacity, unverified commercial conversion, and reported reputational controversies.
        - Require downside protection and evidence of repeatable economics.
      - - Valuation stance
        - unpriced; historical $2B mark is not current
        - The Yahoo Finance article dates the reported $2B valuation to early 2022.
        - Do not use the historical mark as a current entry price.
    notes: >-
      Historical and company-reported figures retain their stated dates and attribution; "unknown" means the assigned sources do not establish a current mark.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV010
      - CV011
      - CV014
      - CV015
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Evidence and limitation
      - What would change the view
    rows:
      - - Broader risk-management product could expand the addressable buyer set.
        - CertiK's paid release describes a move toward institutions and regulators; it is company-issued positioning.
        - Named, independently verifiable paid deployments with renewal and contract-value evidence.
      - - Product strategy and hiring may support continued investment.
        - Company-issued positioning and a job listing describe work for regulated customers, but neither establishes paid deployments or recurring economics.
        - Audited segment revenue, customer retention, gross margin, and concentration.
      - - Service-heavy economics or weak conversion could constrain value.
        - Sherlock's audit-price observations are competitor-published, not CertiK prices or valuation multiples.
        - Contract mix, utilization, delivery costs, software attach rates, and cohort economics.
      - - Reputation and execution risk may impair institutional adoption or exit readiness.
        - The Yahoo Finance article reports past controversies and an IPO ambition; the ambition is not evidence of readiness.
        - Independent control, governance, customer-reference, and IPO-readiness diligence.
      - - Public-market reference is directional, not a direct comparable.
        - CompaniesMarketCap reports CrowdStrike market capitalization of $263.73B on October 25, 2026; Macrotrends reports annual revenue for 2026 of $4.812B. Its endpoint-security model and scale differ from CertiK's audit and compliance mix; no multiple is calculated.
        - Build a model-matched peer and transaction set after CertiK revenue mix, growth, margins, and capitalization terms are verified.
    notes: >-
      Company statements are labeled as such; evidence of product positioning or hiring is not treated as proof of revenue, retention, or exit readiness. CrowdStrike's market capitalization and annual revenue remain separate reported metrics, with no multiple inferred.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV012
      - CV009
      - CV010
      - CV011
      - CV016
  - id: TV003
    title: Conditional bull, base, and bear cases
    columns:
      - Case
      - Explicit assumptions
      - Valuation and return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - Recurring monitoring and compliance adoption compounds beyond audit engagements; audited retention and margins support software-like economics.
        - Absolute valuation range and target return are unavailable until audited financials, current share price, and security terms are provided.
        - Low signal on current public evidence; strengthen only with verified paid deployments and durable recurring cohorts.
      - - Base
        - A mixed services-and-software business continues, but public sources do not establish revenue mix, margin, growth, or current financing price.
        - No defensible absolute range or multiple; CrowdStrike data is directional only, while the reported $2B valuation is a historical early-2022 mark.
        - Central evidence case, not a probability estimate; trigger review when current financial and cap-table data are available.
      - - Bear
        - Services concentration, weak recurring conversion, customer concentration, or reputational setbacks constrain growth and exit options.
        - Downside range cannot be sized without financial statements, debt, preferences, and dilution data; do not infer a floor from capital raised.
        - Material risk signal given disclosure gaps and reported controversies; trigger reassessment on failed deployments, churn, or financing stress.
    notes: >-
      These are conditional cases rather than forecasts. No numerical probability, valuation range, or return is assigned because the necessary financial, price, and ownership inputs are missing.
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV008
      - CV012
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
