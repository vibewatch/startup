      - CV016
      - CV003
      - CV014
callouts:
  - calloutType: recommendation
    title: Entry discipline
    body: >-
      Do not anchor a new investment to the reported early-2022 $2B mark; require a current price, audited financials, and capitalization terms first.
    claimRefs:
      - CV003
      - CV014
      - CV015
