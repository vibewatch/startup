  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: normalized-pricing-and-packaging
      missingEvidence: Current scope-matched proposals, realized fees, discounting, renewal terms, bundle inclusions and service-level commitments for CertiK and named peers.
      whyItMatters: Directory hourly bands cannot be compared with audit contracts or used to infer pricing power, margin or buyer switching behavior.
      diligencePath: Obtain anonymized executed proposals and renewal schedules for comparable chain, code-size, reviewer-seniority and monitoring scopes.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: switching-costs-and-multihoming
      missingEvidence: Customer-level contract duration, renewal, multi-vendor use, migration effort, monitoring dependence and internal-build decisions.
      whyItMatters: Without buyer behavior, broad product scope alone does not demonstrate retention, lock-in or a durable competitive moat.
      diligencePath: Interview current and former customers and review cohort-level renewals, churn reasons and multi-homing by product.
      relatedQuestionRefs: [QP006, QP007]
      relatedTableRefs: [TP001, TP002]
    - type: missing-source
      severity: material
      topic: comparative-security-outcomes
      missingEvidence: Independent, scope-normalized evidence on vulnerability discovery, false positives, remediation, post-audit incidents and audit-quality outcomes by provider.
      whyItMatters: Product claims and directory rankings do not establish relative security effectiveness or whether claimed differentiation changes customer risk.
      diligencePath: Request blinded customer references and independent studies that normalize codebase size, chain, review method and post-deployment exposure.
      relatedQuestionRefs: [QP005, QP007]
      relatedTableRefs: [TP002]
    - type: missing-source
      severity: minor
      topic: entrant-and-substitute-landscape
      missingEvidence: Evidence of new entrants, entry barriers, customer use of internal teams or open-source tools, and the economics of those alternatives.
      whyItMatters: A static provider roster does not show whether entry, tooling or in-house capability is eroding external audit demand.
      diligencePath: Validate the provider funnel with protocol buyers, security leads and procurement teams, including build-versus-buy decisions.
      relatedQuestionRefs: [QP008, QP006]
      relatedTableRefs: [TP001]
