figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      An ordinal map of service families and ongoing-support language documented
      in the assigned pages; positions are not rankings of capability or outcomes.
    data:
      xAxis:
        label: Distinct service families described (count)
        min: 3
        max: 8
        low: "3 listed"
        high: "8 listed"
        description: >-
          Analyst-coded count of service families named in each assigned page;
          company-page wording and coverage differ.
        scale: ordinal
      yAxis:
        label: Ongoing or lifecycle support stated in assigned text
        min: 1
        max: 2
        low: "Not stated"
        high: "Explicitly stated"
        description: >-
          A value of 1 means no explicit ongoing or lifecycle support was located
          in that assigned page; it does not mean the provider lacks it.
        scale: ordinal
      points:
        - label: CertiK
          x: 8
          y: 2
          detail: "Eight listed product families; page explicitly describes real-time monitoring."
          claimRefs: [CP001, CP002]
        - label: Quantstamp
          x: 3
          y: 2
          detail: "Audits, managed post-deployment security and insurance; ongoing monitoring is explicit."
          claimRefs: [CP005]
        - label: Trail of Bits
          x: 4
          y: 1
          detail: "Security reviews, research, open-source tools and talks; ongoing support was not located in its assigned page."
          claimRefs: [CP006]
        - label: OpenZeppelin
          x: 3
          y: 2
          detail: "Contract Libraries, professional services and Defender platform; supplier listing describes lifecycle integration."
          claimRefs: [CP007]
        - label: Halborn
          x: 3
          y: 1
          detail: "Auditing, penetration testing and offensive-security engineering; ongoing support was not located in its assigned listing."
          claimRefs: [CP008]
        - label: ChainSecurity
          x: 3
          y: 1
          detail: "Audit, code review and architecture assessment; ongoing support was not located in its assigned listing."
          claimRefs: [CP009]
    approximationNotes: >-
      The x counts are transcribed as analyst-coded category tallies: CertiK
      (audit, penetration testing, Skynet, proof of reserves, SkyInsights, DLT
      security, VARA compliance, DORA/MiCA compliance); Quantstamp (audit, managed
      monitoring, insurance); Trail of Bits (reviews, research, open-source tools,
      talks); OpenZeppelin (Contract Libraries, professional services, Defender);
      Halborn (audit, penetration testing, offensive-security engineering);
      ChainSecurity (audit, code review, architecture assessment). These source
      descriptions use different levels of detail and are not complete capability
      inventories. The y scores encode explicit ongoing/lifecycle wording only; a
      low score is not evidence of absence. Midpoint dividers are visual aids, not
      ranking zones or performance thresholds.
    claimRefs: [CP001, CP002, CP005, CP006, CP007, CP008, CP009]
