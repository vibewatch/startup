schemaVersion: "report-v2"
artifact: competitors
slug: certik
runDate: 2026-10-26
company:
  name: CertiK
chapter:
  number: 3
  title: Competitors
  summary: >-
    CertiK presents a broader Web3 security and compliance suite than a point-in-time
    audit, while Quantstamp also describes post-deployment monitoring and insurance,
    and Trail of Bits emphasizes security research and reviews. The assigned evidence
    supports product-scope comparisons but not normalized pricing, relative audit
    efficacy, customer lock-in, or a durable moat.
sections:
  - id: competitive-field
    title: Competitive field includes specialist and broader-scope alternatives
    body: >-
      The available landscape includes direct smart-contract assurance providers,
      technical-security specialists, and adjacent developer-security tools. The
      Business Research Company names CertiK, Quantstamp, OpenZeppelin, Halborn,
      PeckShield, Hacken, Runtime Verification and other suppliers; Alchemy's Dapp
      Store page separately displays 92 CertiK alternatives. These are discovery
      inventories, not counts of direct substitutes, market shares, or controlled
      quality rankings. Quantstamp describes audit work plus managed post-deployment
      security and insurance, while Trail of Bits emphasizes security reviews,
      research and open-source tools. OpenZeppelin, Halborn and ChainSecurity appear
      in GoodFirms supplier listings with different audit, platform and engineering
      emphases. Internal security teams and open-source tooling could substitute for
      selected outsourced tasks, but the assigned evidence does not show customer
      build-versus-buy rates, contract overlap or provider market shares.
    claimRefs: [CP003, CP004, CP005, CP006, CP007, CP008, CP009, CP016]
    tableRefs: [TP001]
  - id: documented-capability
    title: Documented portfolio breadth is a positioning claim, not proof of outcomes
    body: >-
      CertiK's company pages describe smart-contract audits, penetration testing,
      Skynet monitoring, proof-of-reserves, AML and regulatory-compliance offerings.
      Its official About page frames those services as a unified risk-management
      framework, but no source documents attach rates, bundled contract terms,
      implementation quality or savings from consolidation. Quantstamp describes
      audits, continuous monitoring and Chainproof insurance; Trail of Bits describes
      security reviews, research, tools and talks. GoodFirms' supplier listings
      describe OpenZeppelin, Halborn and ChainSecurity, but these listings are not
      independent assessments of security performance. In the matrix, “not located”
      means only that the assigned page did not document the capability; it does not
      mean the vendor lacks it. The positioning figure counts source-described
      service families and continuity language, not capability quality or market
      standing.
    claimRefs: [CP001, CP002, CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: pricing-and-scale
    title: Public pricing and scale signals are not normalized
    body: >-
      GoodFirms displays supplier-listing hourly-rate bands, including $50 - $99/hr
      for CertiK and OpenZeppelin and $25 - $49/hr for Quantstamp, Trail of Bits,
      Halborn and ChainSecurity. The listing does not define audit scope, deliverables,
      reviewer seniority, contract basis or whether those figures are current
      executed rates. A Web3 Security.AI profile says CertiK pricing is quote-on-request,
      while a Quasa review calls it premium and typically enterprise-priced without
      publishing an amount or method. Those signals can coexist: none is a
      scope-matched quote. CertiK-branded page metrics and the separate profile's
      reported figures also use different labels and periods, and are not
      independently verified. Funding, revenue, discounts, contract packaging and
      comparable customer or headcount data remain unavailable for underwriting.
    claimRefs: [CP010, CP011, CP012, CP013, CP014]
    tableRefs: [TP003]
  - id: durability-and-displacement
    title: Differentiation durability remains unproven
    body: >-
      The most supportable differentiation hypothesis is breadth: CertiK markets
      audit work plus monitoring, transaction-risk and compliance products, while
      several named peers describe additional tools, managed security or research.
      That breadth may reduce vendor coordination for a buyer, but the assigned
      sources do not measure renewal, multi-homing, switching costs, customer
      preference or provider-level loss prevention. A Web3 Security.AI profile flags
      the 2024 Kraken bug-bounty dispute as relevant to live-system testing and
      explicitly distinguishes it from an audit; this is a buyer-process and
      reputation consideration, not evidence that an audited contract failed.
      Company marketing, supplier listings and alternative directories are not
      independent, scope-normalized outcome benchmarks. The available record
      therefore supports continued testing of scope, reviewer seniority, remediation
      quality, alert coverage, incident attribution and commercial terms, but not a
      conclusion that service breadth creates a durable moat.
    claimRefs: [CP010, CP011, CP012, CP014, CP015]
