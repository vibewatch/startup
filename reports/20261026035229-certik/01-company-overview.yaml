schemaVersion: "report-v2"
artifact: company-overview
slug: certik
runDate: 2026-10-26
company:
  name: CertiK
chapter:
  number: 1
  title: Company Overview
  summary: >-
    CertiK is a New York-based Web3 security provider whose described offering spans
    smart-contract audits, monitoring, formal verification, and compliance tooling.
    Public sources disagree on whether it was founded in 2017 or 2018, and its $2
    billion valuation is a historical 2022 financing mark rather than a current
    independently established value.
sections:
  - id: identity-and-business
    title: Identity, founders, and operating model
    body: >-
      The available profiles place CertiK in New York and identify co-founders
      Ronghui Gu and Zhong Shao, but they do not settle the founding year: Tracxn
      and a September 2026 research profile say 2017, while CertiK-issued material
      and the World Economic Forum profile say 2018. Preserve that discrepancy
      rather than choosing one date. The described business combines project-based
      smart-contract audits and formal verification with ongoing monitoring,
      penetration testing, and compliance or risk-management products. These are
      company and profile descriptions, not evidence of recurring-revenue mix,
      audit quality, or customer retention. The assigned sources identify founders
      but do not establish a complete current executive or board roster, succession
      arrangements, or governance controls; those remain diligence items.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO002
  - id: funding-and-stakeholders
    title: Funding, valuation, and investor relationships
    body: >-
      Tracxn reports $296 million across nine rounds and dates CertiK's first seed
      round to July 2018; The Block separately reports $296 million raised. The
      latest financing and valuation detail in the assigned independent coverage
      is historical: reporting describes an $88 million 2022 Series B3 and a $2
      billion mark associated with that period. Cointelegraph also reports Gu
      describing about $2 billion in a 2026 Davos interview, without a newly
      priced round. In January 2026, CEO Ronghui Gu
      described Binance as the largest investor and a follow-on investment as
      “multi-eight figures”; the amount and present ownership are not disclosed.
      Gu has described an IPO as a goal while saying there was no concrete plan.
      None of these reports establishes cash available, current fair value,
      liquidation preferences, secondary transactions, debt, or investor control
      rights. The investor map therefore records named relationships, not a
      complete cap table or ownership ranking beyond the CEO's attributed
      description of Binance.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO015
    tableRefs:
      - TO003
  - id: milestones-scale-and-open-questions
    title: Scale claims, milestones, and diligence limits
    body: >-
      CertiK's October 2026 paid release says the company has served more than
      5,500 clients across over 150 countries and regions; that is a company
      statement, not audited customer or revenue evidence. Its dated public
      milestones include a 2023 Security Score integration announcement with
      CoinMarketCap, the 2022 financing and valuation reporting, and an October
      2026 brand upgrade describing a broader institutional risk-management
      position. The Block and Yahoo Finance report criticism involving work connected to
      Huione Guarantee, CertiK's handling of a Kraken bug discovery, and a
      compromised X account; these are reported controversies, not adjudicated
      findings or a complete incident record. Tracxn's retrieved profile gives
      an employee count without a year for its “Sep 26” date. The assigned evidence
      does not establish audited revenue or ARR, margins, customer concentration,
      current headcount, board composition, or IPO readiness. Those gaps constrain
      any conclusion about scale, recurring economics, governance depth, or the
      durability of the historical valuation.
    claimRefs:
      - CO006
      - CO007
      - CO013
      - CO014
      - CO016
    tableRefs:
      - TO001
    figureRefs:
      - FO001
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value or status
      - Date or period
      - Confidence
      - Gap
    rows:
      - - Founding year
        - "Conflicting: 2017 (Tracxn and Web3 Security.AI) or 2018 (CertiK-issued and WEF profiles)"
        - "Undated profiles; company-issued material dated 2023 and 2026"
        - Medium
        - Resolve against authoritative incorporation or company records.
      - - Total funding reported
        - "$296 million in reported historical funding; a separate 2026 follow-on is undisclosed"
        - "Tracxn's listed rounds run through 2022; The Block reports an additional Binance follow-on in 2026"
        - Medium
        - Reconcile the follow-on with cumulative funding; funding raised is not cash available.
      - - Last reported valuation
        - "$2 billion; tied to 2022 financing, with a later CEO statement but no new priced round"
        - "2022 financing; CEO interview reported in 2026"
        - Medium
        - Obtain a current transaction or independently supported mark; do not treat the old round as current fair value.
      - - Clients served
        - "More than 5,500, company-reported"
        - "October 2026 release"
        - Medium
        - No definition of active, unique, or paying client; no independent validation.
      - - Audited project and finding indicators
        - "6,206+ projects audited; 93,145+ findings; 1,233+ formally verified projects, as reported from company pages"
        - "Web3 Security.AI profile accessed September 2026; underlying metric dates not stated"
        - Medium
        - Verify definitions, periods, unique projects, and whether counts include non-CertiK work.
      - - Revenue, ARR, and gross margin
        - null
        - "No audited period disclosed"
        - Low
        - Obtain audited financials and services-versus-subscription mix.
      - - Headcount
        - "Tracxn reports 210 employees 'as of Sep 26'; year is unspecified in the fetched text"
        - "Tracxn profile; date basis unclear"
        - Low
        - Verify current employees and contractor treatment directly.
    notes: >-
      Funding and valuation are attributed third-party reports, not cash available
      or a current mark. Client and audit counts are company-reported. Null or
      unavailable private metrics are evidence gaps, not zero values.
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO008
      - CO009
      - CO010
      - CO016
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role and background reported
      - Founder-market fit or functional coverage
      - Key-person dependence and diligence ask
    rows:
      - - Ronghui Gu
        - "Co-founder and CEO; reported as a Columbia professor"
        - "Academic computer-science background and public executive spokesperson"
        - "CEO dependence is visible; verify succession, executive-team depth, and board oversight."
      - - Zhong Shao
        - "Co-founder; associated with Yale in public founding profiles"
        - "Academic background associated with the company's founding"
        - "Current operating role and ongoing decision authority are not established in the assigned sources."
    enumerationScope:
      coverage: partial
      basis: >-
        Public founder references in the assigned sources through 2026-10-26;
        this is not an exhaustive current leadership or board roster.
    notes: >-
      The table names the two reported co-founders only; it does not imply that
      either person is the sole technical or operational decision-maker.
    claimRefs:
      - CO003
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Reported role or economic importance
      - Evidence period and status
      - Diligence ask
    rows:
      - - Binance
        - "CEO-described largest investor; reported follow-on investment"
        - "January 2026; CEO characterized the follow-on as multi-eight figures"
        - "Confirm current ownership, security class, rights, and whether the investment closed."
      - - "Insight Partners"
        - "Named as a co-lead of the $88 million Series B3"
        - "2022 financing coverage"
        - "Confirm current holdings, preferences, and governance rights."
      - - "Tiger Global"
        - "Named among historical investors and as a co-lead of the $88 million Series B3"
        - "2022 financing coverage"
        - "Confirm current holdings, preferences, and governance rights."
      - - "Advent International"
        - "Named as a co-lead of the $88 million Series B3"
        - "2022 financing coverage"
        - "Confirm current holdings, preferences, and governance rights."
      - - "SoftBank Vision Fund 2, Sequoia Capital, and Goldman Sachs"
        - "Named among historical investors in third-party coverage and company profiles"
        - "Historical listings; current positions not established"
        - "Reconcile round participation and current beneficial ownership."
    enumerationScope:
      coverage: partial
      basis: >-
        Named investors found in assigned profiles and 2026 coverage; not a
        complete cap table or current ownership schedule.
    notes: >-
      Investor roles and amounts are reported, not independently reconciled to
      company filings. The map does not imply that listed investors retain current
      ownership or equal control.
    claimRefs:
      - CO011
      - CO009
      - CO015
