          tone: neutral
          claimRefs:
            - CO008
        - date: "2023-05-18"
          label: CoinMarketCap Security Score integration announced
          detail: "CertiK announced the integration in a company-issued GlobeNewswire release."
          tone: positive
          claimRefs:
            - CO007
        - date: "2024"
