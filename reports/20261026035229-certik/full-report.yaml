      - number: '6.2'
        title: Public adoption signals and what they establish
        blocks:
          - type: paragraph
            body: >-
              A paid CertiK release carried by CoinDesk says the company has served more than 5,500 clients across over
              150 countries and regions, and says its compliance product is already adopted by financial institutions
              and regulatory authorities (CU004, CU005). Those are company claims, without a named deployment,
              active-customer definition, or usage denominator. A separate Web3Security.ai profile attributes broadly
              similar totals to CertiK's own pages and explicitly calls the figures self-reported (CU004, CU008). Its
              audit-volume totals describe project throughput, not current paying accounts. A stronger named engagement
              is Crowdfund Insider's account of a CertiK proof-of-reserves review for Gate Technology FZE; the work
              covered a dated reserve snapshot and does not establish ongoing monitoring or renewal (CU006, CU007).
              TechCrunch reports CertiK among OKX AI's early builders, a named distribution surface but not usage,
              revenue, or repeat-purchase evidence (CU016). Historical CoinMarketCap integration and Hub71 offers
              likewise add distribution and partnership signals, not retention evidence (CU010, CU011).
