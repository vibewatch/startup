  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and scope
        blocks:
          - type: paragraph
            body: >-
              For diligence, the relevant market is paid security and risk-management products and services for
              blockchain networks, smart contracts, decentralized applications, and digital-asset operators. It includes
              scoped code and protocol reviews, formal verification, penetration testing, and ongoing monitoring or
              compliance tools when customers pay for them. It excludes the value of crypto assets, general-purpose
              cybersecurity spend, and losses from attacks: those can indicate exposure but are not vendor revenue. The
              TBRC report groups Web3 security into software, hardware, and services, a useful taxonomy but not a
              disclosure of where CertiK's own revenue falls. The distinction matters because a large loss pool or a
              broad industry label cannot be multiplied into an addressable market without spend, buyer, and
              product-boundary evidence.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
      - number: '2.2'
        title: Sizing evidence and comparability
        blocks:
          - type: paragraph
            body: >-
              The available market-research page gives projected five-year component “market gains” through 2030, not a
              current market value or a complete forecast of total addressable spend. It does not establish CertiK's SAM
              or SOM, and its accessible summary does not disclose the underlying model or market-share assumptions.
              Separate risk measures help test whether the problem is economically salient, but they measure different
              populations: CertiK's H1 2026 Hack3D report records $1.316 billion of losses across 344 incidents, while
              KuCoin relays an Immunefi figure of approximately $972 million across 207 hacking incidents. CertiK says
              H1 2026 losses were approximately 28% higher than H1 2025 on a comparable basis after excluding the Bybit
              event; these loss measures should not be combined or relabeled as security revenue. Chainalysis'
              lower-bound estimate of illicit crypto receipts is another risk lens, not a security-market denominator.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM008
              - CM019
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM008
              - CM019
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM016
              - CM017
              - CM018
      - number: '2.3'
        title: Buyers, users, and purchase logic
        blocks:
          - type: paragraph
            body: >-
              Public materials point to several buyer groups rather than one uniform customer: protocol and application
              builders, exchanges and wallets, and institutions or virtual-asset service providers facing compliance and
              operational-risk requirements. Security and product teams are the likely users for code assessment and
              monitoring, while compliance or risk teams are likely users for screening and regulatory tools; the
              sources do not identify who controls budgets or quantify typical contract size. Investors and end users
              may consume public ratings, but the evidence does not show that they are the paying buyer. CertiK's paid
              release describes products for banks, VASPs, and regulators, but its adoption statements are not
              independently measured purchase rates or proof of security-software spending.
            claimRefs:
              - CM009
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM014
              - CM015
      - number: '2.4'
        title: Adoption constraints and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by the persistence and severity of exploits, but audit work does not remove residual
              risk: attack exposure spans code defects, wallet compromise, phishing, and infrastructure or
              access-control failures. The H1 datasets also differ in stated coverage, so a buyer or investor should not
              infer a single market incident denominator from their headline totals. The TBRC outlook names talent
              shortages, technical complexity, and regulatory uncertainty as restraints, all of which can slow
              procurement even when risk is high. The sponsored CBS Brand Studio article's claim that CertiK controls
              more than 65% of the global blockchain-auditing market has no market definition or supporting calculation
              in the retrieved text and is not an independent benchmark. Underwriting therefore still needs disclosed
              pricing, realized revenue by product, buyer budgets, retention, and a reproducible market-share
              methodology before assigning a CertiK serviceable market.
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive field includes specialist and broader-scope alternatives
        blocks:
          - type: paragraph
            body: >-
              The available landscape includes direct smart-contract assurance providers, technical-security
              specialists, and adjacent developer-security tools. The Business Research Company names CertiK,
              Quantstamp, OpenZeppelin, Halborn, PeckShield, Hacken, Runtime Verification and other suppliers; Alchemy's
              Dapp Store page separately displays 92 CertiK alternatives. These are discovery inventories, not counts of
              direct substitutes, market shares, or controlled quality rankings. Quantstamp describes audit work plus
              managed post-deployment security and insurance, while Trail of Bits emphasizes security reviews, research
              and open-source tools. OpenZeppelin, Halborn and ChainSecurity appear in GoodFirms supplier listings with
              different audit, platform and engineering emphases. Internal security teams and open-source tooling could
              substitute for selected outsourced tasks, but the assigned evidence does not show customer
              build-versus-buy rates, contract overlap or provider market shares.
            claimRefs:
