      - number: '6.3'
        title: Durability, concentration, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The available customer record is a mix of self-reported totals, marketing offers, directory listings, and
              isolated project engagements. It does not disclose net or gross revenue retention, renewal rates, churn,
              contract duration, repeat-purchase cohorts, customer-level revenue, or top-account concentration (CU013,
              CU014). The Gate review is expressly a snapshot rather than perpetual assurance, so it is useful evidence
              of one scoped engagement but not proof of a recurring customer relationship (CU006). Quasa displays a
              4.8/5 rating without a visible review sample or methodology in the assigned page, which is not a
              defensible satisfaction benchmark (CU015). DL News reporting carried by Yahoo describes criticism related
              to Kraken, Huione, and an account compromise (CU012); this warrants customer-reference and procurement
              diligence, but does not show customer losses or churn. Obtain customer-level cohort, renewal, use, and
              concentration schedules before assigning durable recurring economics.
            claimRefs:
