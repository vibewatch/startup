      - number: '5.2'
        title: Audits, project monitoring, and identity checks
        blocks:
          - type: paragraph
            body: >-
              The clearest customer-level technical example comes from Gem Wallet, which says CertiK assessed its iOS
              and Android applications against OWASP mobile security standards using manual code review, static
              analysis, and dynamic runtime testing across Swift, Kotlin, and Rust code. Gem Wallet reports eleven
              findings total: zero critical, zero high, six medium, and five low. It says all six medium findings were
              resolved before publication; of the five low findings, one was resolved and four were acknowledged. This
              is a customer-published account, not an independently reviewed audit report. A CertiK job listing also
              describes a KYC-badge workflow involving interviews, open-source investigation, identity documents, and
              written decision records; it is evidence of a described service workflow, not proof of its current
              throughput or control quality.
            claimRefs:
              - CE003
              - CE004
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE003
              - CE008
              - CE009
              - CE012
      - number: '5.3'
        title: Public technical signals do not establish system performance
        blocks:
          - type: paragraph
            body: >-
              The strongest technical detail in the assigned sources is a customer account of a mobile audit: Gem Wallet
              says CertiK used manual review, static analysis, and dynamic runtime testing across Swift, Kotlin, and
              Rust code. Web3 Security.AI describes the firm's audit service as using manual expert review, AI-assisted
              analysis, and optional formal verification, but does not provide independent efficacy data. CertiK's
              public GitHub repository documents agent-facing skills for Skynet Score, SkyInsights, Skylens, and Token
              Scan, including differing authentication requirements. This demonstrates a public developer surface, not
              adoption, security review coverage, or production reliability. Crypto Careers' profile reports Skynet
              monitoring for over 20,000 projects and 1.8 million monthly users, but does not give metric definitions or
              an underlying source, so neither figure is independently verified. Web3 Security.AI cautions that
              project-page audit counts may include work by other firms. CertiK's 2026 prediction-markets release
              describes its Skynet Top Board risk framework and identifies oracle manipulation, administrative-key
              exposure, and front-running as sector risks; these are not findings about CertiK's own products. The
              profile also recounts a June 2024 Kraken bug-bounty dispute, with conflicting accounts of whether CertiK's
              live-system testing was authorized. The original parties' statements are not in the assigned pool, so this
              is a diligence lead, not a resolved finding. Quasa's generic review cautions that audits do not eliminate
              all risk but supplies no methodology or outcome data. No assigned source supplies independently measured
              audit efficacy, uptime, API performance, or a full architecture diagram.
            claimRefs:
