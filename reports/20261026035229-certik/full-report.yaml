              - CP013
              - CP015
      - number: '3.4'
        title: Differentiation durability remains unproven
        blocks:
          - type: paragraph
            body: >-
              The most supportable differentiation hypothesis is breadth: CertiK markets audit work plus monitoring,
              transaction-risk and compliance products, while several named peers describe additional tools, managed
              security or research. That breadth may reduce vendor coordination for a buyer, but the assigned sources do
              not measure renewal, multi-homing, switching costs, customer preference or provider-level loss prevention.
              A Web3 Security.AI profile flags the 2024 Kraken bug-bounty dispute as relevant to live-system testing and
              explicitly distinguishes it from an audit; this is a buyer-process and reputation consideration, not
              evidence that an audited contract failed. Company marketing, supplier listings and alternative directories
              are not independent, scope-normalized outcome benchmarks. The available record therefore supports
              continued testing of scope, reviewer seniority, remediation quality, alert coverage, incident attribution
              and commercial terms, but not a conclusion that service breadth creates a durable moat.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and sales motion
        blocks:
          - type: paragraph
            body: >-
              CertiK presents a portfolio that spans project-scoped code audits, penetration testing and formal
              verification, alongside Skynet monitoring and compliance or risk products. That breadth supports several
              plausible revenue mechanisms—one-off assessments and potentially ongoing monitoring or institutional
              services—but the reviewed materials do not disclose which offerings are paid subscriptions, how contracts
              are priced, or how much revenue each contributes. The company's product descriptions and institutional
              positioning are evidence of commercial scope, not proof of booked demand or recurring revenue. Public
              pricing is not listed in the Web3Security.AI profile, which says to request a quote; no retained source
              supplies realized rates, discounting, contract duration, or revenue-recognition policy. These omissions
              prevent a defensible estimate of revenue quality or sales efficiency.
            claimRefs:
