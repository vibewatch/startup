chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founders, and operating model
        blocks:
          - type: paragraph
            body: >-
              The available profiles place CertiK in New York and identify co-founders Ronghui Gu and Zhong Shao, but
              they do not settle the founding year: Tracxn and a September 2026 research profile say 2017, while
              CertiK-issued material and the World Economic Forum profile say 2018. Preserve that discrepancy rather
              than choosing one date. The described business combines project-based smart-contract audits and formal
              verification with ongoing monitoring, penetration testing, and compliance or risk-management products.
              These are company and profile descriptions, not evidence of recurring-revenue mix, audit quality, or
              customer retention. The assigned sources identify founders but do not establish a complete current
              executive or board roster, succession arrangements, or governance controls; those remain diligence items.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
      - number: '1.2'
        title: Funding, valuation, and investor relationships
        blocks:
          - type: paragraph
            body: >-
              Tracxn reports $296 million across nine rounds and dates CertiK's first seed round to July 2018; The Block
              separately reports $296 million raised. The latest financing and valuation detail in the assigned
              independent coverage is historical: reporting describes an $88 million 2022 Series B3 and a $2 billion
              mark associated with that period. Cointelegraph also reports Gu describing about $2 billion in a 2026
              Davos interview, without a newly priced round. In January 2026, CEO Ronghui Gu described Binance as the
              largest investor and a follow-on investment as “multi-eight figures”; the amount and present ownership are
              not disclosed. Gu has described an IPO as a goal while saying there was no concrete plan. None of these
              reports establishes cash available, current fair value, liquidation preferences, secondary transactions,
              debt, or investor control rights. The investor map therefore records named relationships, not a complete
              cap table or ownership ranking beyond the CEO's attributed description of Binance.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO011
              - CO009
              - CO015
      - number: '1.3'
        title: Scale claims, milestones, and diligence limits
        blocks:
          - type: paragraph
            body: >-
              CertiK's October 2026 paid release says the company has served more than 5,500 clients across over 150
              countries and regions; that is a company statement, not audited customer or revenue evidence. Its dated
              public milestones include a 2023 Security Score integration announcement with CoinMarketCap, the 2022
              financing and valuation reporting, and an October 2026 brand upgrade describing a broader institutional
              risk-management position. The Block and Yahoo Finance report criticism involving work connected to Huione
              Guarantee, CertiK's handling of a Kraken bug discovery, and a compromised X account; these are reported
              controversies, not adjudicated findings or a complete incident record. Tracxn's retrieved profile gives an
              employee count without a year for its “Sep 26” date. The assigned evidence does not establish audited
              revenue or ARR, margins, customer concentration, current headcount, board composition, or IPO readiness.
              Those gaps constrain any conclusion about scale, recurring economics, governance depth, or the durability
              of the historical valuation.
