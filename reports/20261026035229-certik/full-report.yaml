        - >-
          Recurring monitoring and compliance adoption compounds beyond audit engagements; audited retention and margins
          support software-like economics.
        - >-
          Absolute valuation range and target return are unavailable until audited financials, current share price, and
          security terms are provided.
        - >-
          Low signal on current public evidence; strengthen only with verified paid deployments and durable recurring
          cohorts.
      - - Base
        - >-
          A mixed services-and-software business continues, but public sources do not establish revenue mix, margin,
          growth, or current financing price.
        - >-
          No defensible absolute range or multiple; CrowdStrike data is directional only, while the reported $2B
          valuation is a historical early-2022 mark.
        - >-
          Central evidence case, not a probability estimate; trigger review when current financial and cap-table data
          are available.
      - - Bear
