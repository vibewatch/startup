      - number: '7.2'
        title: Testing conduct, security, and assurance limits
        blocks:
          - type: paragraph
            body: >-
              DL News reports a 2024 employee-phishing compromise of CertiK's X account and describes criticism tied to
              a platform associated with cybercriminals and the Kraken dispute (CR001, CR002). Blockchain Intelligence
              Group gives a separate account of the dispute and quotes Kraken's security chief confirming the funds were
              returned minus a small amount in fees; its analysis is a vendor-authored account, not a court finding or
              engagement authorization record (CR004, CR005). A competitor-oriented Web3Security.ai profile summarizes
              the Telcoin and Huione examples but notes limits in its own corroboration, so these are diligence leads
              rather than independently verified audit failures (CR006, CR007). CertiK's Hunt terms define
              program-scoped authorization and disclaim guarantees about rewards and vulnerability findings (CR008,
              CR009, CR010). Together, the evidence supports strict scope, escalation, account-security, and outcome-
              validation diligence; it does not establish recurrence rates or product-wide audit failure.
            claimRefs:
