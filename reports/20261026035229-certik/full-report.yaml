  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Evidence base and price anchor
        blocks:
          - type: paragraph
            body: >-
              The available financing record is inconsistent and stale for entry pricing. The Yahoo Finance article
              reports $296 million raised and a $2 billion valuation by early 2022 (CV001, CV003), while StartupHub's
              October 5, 2026 profile lists $242 million and a Series B as its total (CV002). These are reported
              figures, not audited financing records, and the sources do not reconcile the later funding total or
              disclose a current priced round (CV004). A historical valuation mark is not a current offer, equity value,
              or cash balance. The assigned public-source set also does not establish audited revenue, ARR, growth,
              margins, retention, or cap-table terms (CV014, CV015). Without those inputs, neither a revenue multiple
              nor a defensible absolute valuation range can be calculated.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
              - CV015
      - number: '8.2'
        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is a broader product surface: CertiK says it is moving beyond smart-contract security
              toward risk management for financial institutions and regulators (CV005), and a current company job
              listing describes regulatory-technology product discovery for banks, VASPs, and regulators (CV007). Both
              are company-issued evidence of strategic intent, not evidence of contracts or repeat usage. The
              anti-thesis is that product breadth and hiring do not demonstrate paid institutional deployment,
              software-like margins, retention, or customer concentration (CV016). The Yahoo Finance article also
              reports reputational controversies and an IPO ambition, which raises diligence needs rather than proving
              readiness or failure (CV010, CV011).
            claimRefs:
              - CV005
              - CV007
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
