      - number: '4.4'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Public reporting describes a roughly $2 billion valuation and IPO interest, while DL News reports a
              Binance follow-on investment described by the CEO as “multi-eight figures.” The same reporting places the
              last priced valuation in 2022 and reports historical aggregate funding; neither historical capital raised
              nor an investor commitment establishes current cash available. The assigned evidence contains no current
              cash balance, burn, debt schedule, runway, financing terms, or use-of-funds plan, and IPO discussion is
              not evidence of a committed timetable or funding need. Separately, HOGE Wire documents adverse trust
              controversies but does not quantify any resulting churn, pricing, or collection impact. The financial
              verdict is therefore scale-positive but financially unproven: obtain audited revenue and cash-flow
              statements, product-level contract data, and a current capitalization/debt schedule before underwriting
              margin expansion, liquidity, or an IPO case.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI015
              - CI016
