  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyers, users, and customer-acquisition routes
        blocks:
          - type: paragraph
            body: >-
              CertiK's AML and digital-asset compliance product role describes institutional buyers including financial
              institutions, exchanges, VASPs, and fintechs, with day-to-day users such as compliance officers,
              investigators, and risk teams (CU001). This is a company hiring brief, not evidence that each segment has
              deployed or paid for the product. Its stated product success measures include adoption, usage, enterprise
              wins, and expansion (CU002), which are metrics the company says it intends to manage rather than disclosed
              results. CertiK's public X profile lists smart-contract audits, on-chain monitoring, and penetration
              testing, but it supplies no customer or usage measure (CU003). CertiK also says Hub71 portfolio companies
              receive discounted services and free access to a compliance tool (CU011). These are product and channel
              signals, not proof of paid conversion. Public materials do not quantify the mix of these segments, their
