              and Chainproof insurance; Trail of Bits describes security reviews, research, tools and talks. GoodFirms'
              supplier listings describe OpenZeppelin, Halborn and ChainSecurity, but these listings are not independent
              assessments of security performance. In the matrix, “not located” means only that the assigned page did
              not document the capability; it does not mean the vendor lacks it. The positioning figure counts
