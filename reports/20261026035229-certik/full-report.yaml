  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: A portfolio spanning assurance, monitoring, and compliance
        blocks:
          - type: paragraph
            body: >-
              A paid company release on October 19, 2026 describes CertiK's expansion from smart-contract security into
              broader risk management, including audits, formal verification, penetration testing, and compliance
              services. Web3 Security.AI's external profile also lists audits, penetration testing, formal verification,
              and Skynet monitoring. These sources establish a broad marketed portfolio, not proof that every capability
              is delivered through one integrated software platform. The assigned IQ.wiki profile returned only the
              publisher's own branding and contact text, so it adds no CertiK-specific product detail. Public materials
              reviewed do not expose complete module boundaries or a common customer workflow; the map therefore
              separates named services rather than inferring a unified technical stack.
            claimRefs:
