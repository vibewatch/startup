      - number: '3.3'
        title: Public pricing and scale signals are not normalized
        blocks:
          - type: paragraph
            body: >-
              GoodFirms displays supplier-listing hourly-rate bands, including $50 - $99/hr for CertiK and OpenZeppelin
              and $25 - $49/hr for Quantstamp, Trail of Bits, Halborn and ChainSecurity. The listing does not define
              audit scope, deliverables, reviewer seniority, contract basis or whether those figures are current
              executed rates. A Web3 Security.AI profile says CertiK pricing is quote-on-request, while a Quasa review
              calls it premium and typically enterprise-priced without publishing an amount or method. Those signals can
              coexist: none is a scope-matched quote. CertiK-branded page metrics and the separate profile's reported
              figures also use different labels and periods, and are not independently verified. Funding, revenue,
              discounts, contract packaging and comparable customer or headcount data remain unavailable for
              underwriting.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
