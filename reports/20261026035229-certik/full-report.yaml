        title: Exhibits
        blocks:
          - type: callout
            title: Reach metrics are not monetization
            body: >-
              Company-reported client, monitored-project, user, and assessed-market-cap figures do not establish paying
              accounts, revenue, retention, or cash generation.
            calloutType: risk
            claimRefs:
