  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory perimeter and compliance delivery
        blocks:
          - type: paragraph
            body: >-
              CertiK's paid October 2026 release markets licensing preparation, AML/KYT screening, and AI-assisted
              regulatory mapping, while its job-board vacancy describes AML framework and transaction-monitoring
              responsibilities (CR011, CR012). These are company-issued descriptions, not proof of service quality,
              licensing, or a filled position. ADGM's consultation page lists a 2026 proposal to enhance its AML
              framework, and VARA describes a virtual-asset regime for services in or from Dubai (CR014); neither source
              establishes CertiK's legal-entity footprint or authorization status. The main diligence risk is therefore
              a potentially consequential mismatch between product scope, client reliance, and jurisdiction-specific
              obligations, not a verified breach. Obtain a product/entity/ jurisdiction map and verify material
              permissions directly with regulators before underwriting regulated-client revenue.
            claimRefs:
              - CR011
              - CR012
              - CR014
