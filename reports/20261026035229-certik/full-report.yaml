      - number: '4.3'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              Audit and formal-verification work plausibly requires specialist review, while ongoing monitoring and
              compliance products imply software, data, and support costs; the retained sources do not quantify these
              cost drivers or show their allocation by product. No source provides gross margin, utilization, delivery
              hours, rework, partner fees, acquisition cost, sales cycle, payback, renewal, or working-capital data.
              Crypto Careers displays a $115,000–$230,000 salary range for an unspecified role, without a date or
              role/location basis, so it is not a reliable labor-cost benchmark. The available material consequently
              supports no defensible customer-level contribution margin or service-to-software margin path. A diligence
              model should keep these inputs unavailable rather than back-solving them from market-cap-assessed, client,
              or monitoring counts.
            claimRefs:
              - CI008
              - CI014
