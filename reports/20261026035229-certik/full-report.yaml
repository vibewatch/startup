      - number: '4.2'
        title: Public traction is not revenue
        blocks:
          - type: paragraph
            body: >-
              CertiK's website displays 5,500 clients served, $471 billion in market cap assessed, more than 21,000
              projects monitored, and more than 1.8 million monthly active users. These are company-reported reach or
              activity measures with different denominators; none is revenue, ARR, paying-customer count, retention, or
              collected cash. A 2023 company-issued release also claimed audits of more than 70% of the top 500 Web3
              projects ranked by CoinMarketCap, a specific historical company claim rather than a current share of
              spend. A 2026 press release describes compliance intelligence spanning more than 20 blockchains and 400
              million labeled addresses, but does not quantify commercial conversion. The customer and platform
              statistics therefore signal distribution and potential demand, while the bridge from reach to paid
              contracts remains unverified.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
