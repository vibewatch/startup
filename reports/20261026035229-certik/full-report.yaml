              - CV012
              - CV009
              - CV010
              - CV011
              - CV016
      - number: '8.3'
        title: Scenarios and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The scenarios below are conditional decision cases, not forecasts. The bull case requires verifiable
              recurring revenue, retention, margins, and paid institutional adoption; the base case assumes a mixed
              services-and-software model with no evidence-backed multiple; the bear case tests weak economics, delayed
              commercialization, and reputation or execution setbacks. Sherlock's February 2026 article gives broad
              smart-contract audit engagement ranges, but Sherlock is itself an audit provider and those prices are not
              CertiK revenue, a valuation benchmark, or a comparable-company multiple (CV009). Public-market context is
              limited: CompaniesMarketCap reports CrowdStrike's $263.73 billion market capitalization on October 25,
              2026, while Macrotrends reports annual revenue for 2026 of $4.812 billion, up 21.71% from 2025 (CV006,
              CV008). Macrotrends describes CrowdStrike as an endpoint-protection and threat- intelligence provider
              (CV012), not a direct proxy for CertiK's audit and compliance mix. No multiple, absolute scenario
              valuation range, or target return follows from these data because CertiK's current price, economics, and
              security terms are missing.
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV009
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV012
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.4'
        title: Recommendation and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Recommendation: research-more, with medium confidence in the conclusion that public evidence is
              insufficient to support a price-sensitive investment call. This is not a finding that CertiK lacks value;
              the assigned evidence shows a substantial security-services footprint and a stated move into institutional
              risk management, but financial conversion and current share price remain unproven (CV005, CV007, CV016).
              Do not treat lifetime funding raised as available cash, and do not apply the historical valuation to a new
              security without a current financing record and its preference stack (CV001, CV003, CV015). Request
              audited financials, segment economics, retention and concentration data, current capitalization and
              preference terms, and independently verifiable paid deployments before setting an entry price or target
              return.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV015
              - CV016
