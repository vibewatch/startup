              - CI005
          - type: callout
            title: Require primary financial diligence
            body: >-
              Do not underwrite margins, runway, or IPO readiness from historical financing, public scale indicators, or
              the reported investor follow-on; obtain audited statements and current liquidity evidence.
            calloutType: recommendation
            claimRefs:
