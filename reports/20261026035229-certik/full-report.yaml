            body: >-
              TechCrunch identifies CertiK as an early builder in OKX's AI-agent marketplace, but reports no CertiK
              service usage, revenue, exclusivity, or performance data (CR013). CertiK's paid release describes a
              September 2026 memorandum with the National Bank of the Kyrgyz Republic as an intended exploration of
              cooperation, not a deployed service or committed revenue contract (CR015). DL News reports the CEO
              described Binance as CertiK's largest investor after a follow-on investment characterized as "multi-eight
              figures"; the amount and terms are not disclosed (CR016). The assigned sources do not establish present
              cash, burn, audited revenue, customer concentration, renewal rates, or contract dependence (CR017). Treat
              the marketplace and memorandum as execution options, not proven channels; request counterpart terms,
              fallback routes, a current financing bridge, and account-level retention and concentration data. The
