schemaVersion: "report-v2"
artifact: risks
slug: certik
runDate: 2026-10-26
company:
  name: CertiK
chapter:
  number: 7
  title: Risks
  summary: >-
    The assigned public record documents trust and conduct exposures around a 2024 Kraken
    testing dispute and a separate employee-phishing compromise, while company materials
    describe expanding into AI-assisted compliance and agent-security workflows. Current
    licensing, control effectiveness, customer concentration, and financial resilience remain
    unverified; the absence of evidence in this pool is not evidence that no exposure exists.
sections:
  - id: regulatory-execution
    title: Regulatory perimeter and compliance delivery
    body: >-
      CertiK's paid October 2026 release markets licensing preparation, AML/KYT screening,
      and AI-assisted regulatory mapping, while its job-board vacancy describes AML framework
      and transaction-monitoring responsibilities (CR011, CR012). These are company-issued
      descriptions, not proof of service quality, licensing, or a filled position. ADGM's
      consultation page lists a 2026 proposal to enhance its AML framework, and VARA describes
      a virtual-asset regime for services in or from Dubai (CR014); neither source establishes
      CertiK's legal-entity footprint or authorization status. The main diligence risk is
      therefore a potentially consequential mismatch between product scope, client reliance,
      and jurisdiction-specific obligations, not a verified breach. Obtain a product/entity/
      jurisdiction map and verify material permissions directly with regulators before
      underwriting regulated-client revenue.
    claimRefs:
      - CR011
      - CR012
      - CR014
    tableRefs:
      - TR001
  - id: operational-trust
    title: Testing conduct, security, and assurance limits
    body: >-
      DL News reports a 2024 employee-phishing compromise of CertiK's X account and describes
      criticism tied to a platform associated with cybercriminals and the Kraken dispute
      (CR001, CR002). Blockchain Intelligence Group gives a separate account of the
      dispute and quotes Kraken's security chief confirming the funds were returned minus a
      small amount in fees; its analysis is a vendor-authored account, not a court finding or
      engagement authorization record (CR004, CR005). A competitor-oriented Web3Security.ai
      profile summarizes the Telcoin and Huione examples but notes limits in its own
      corroboration, so these are diligence leads rather than independently verified audit
      failures (CR006, CR007). CertiK's Hunt terms define program-scoped authorization and
      disclaim guarantees about rewards and vulnerability findings (CR008, CR009, CR010).
      Together, the evidence supports strict scope, escalation, account-security, and outcome-
      validation diligence; it does not establish recurrence rates or product-wide audit
      failure.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
    tableRefs:
      - TR002
  - id: dependencies-and-resilience
    title: Partner, capital, and customer dependencies
    body: >-
      TechCrunch identifies CertiK as an early builder in OKX's AI-agent marketplace, but
      reports no CertiK service usage, revenue, exclusivity, or performance data (CR013).
      CertiK's paid release describes a September 2026 memorandum with the National Bank of
      the Kyrgyz Republic as an intended exploration of cooperation, not a deployed service
      or committed revenue contract (CR015). DL News reports the CEO described Binance as
      CertiK's largest investor after a follow-on investment characterized as "multi-eight
      figures"; the amount and terms are not disclosed (CR016). The assigned sources do not
      establish present cash, burn, audited revenue, customer concentration, renewal rates, or
      contract dependence (CR017). Treat the marketplace and memorandum as execution options,
      not proven channels; request counterpart terms, fallback routes, a current financing
      bridge, and account-level retention and concentration data. The matrix below ranks
      exposure qualitatively and leaves likelihood unquantified.
    claimRefs:
      - CR013
      - CR015
      - CR016
      - CR017
    tableRefs:
      - TR003
    figureRefs:
      - FR001
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk / ranked exposure
      - Likelihood
      - Impact
      - Evidence and mitigation maturity
      - Residual exposure
      - Monitor / diligence path
    rows:
      - - "1 / Authorization and legal-entity perimeter"
        - "Unknown for CertiK; no entity-level exposure denominator is in the assigned sources"
        - "Potentially high if a service is misclassified or relied on without required authorization"
        - "The company markets licensing-preparation support; the assigned evidence contains no CertiK-specific license or counsel-verified perimeter"
        - "Material and unresolved; do not infer non-compliance or authorization"
        - "Obtain a product/entity/jurisdiction matrix; verify licenses, exemptions, and regulated activities with relevant authorities"
      - - "2 / AI-assisted AML and regulatory delivery"
        - "Unknown; no control-performance or incident denominator is disclosed"
        - "Potentially high if screening or regulatory mapping materially misdirects a client"
        - "Company materials describe AI-assisted mapping and AML/KYT screening; vacancy text describes review of AI outputs, but neither proves operating effectiveness"
        - "Unknown until model governance and output validation are tested"
        - "Review independent model validation, false-positive/negative rates, human approval, change control, audit logs, and client escalation"
      - - "3 / Regulatory change across target markets"
        - "Framework activity is evidenced; CertiK's own jurisdictional exposure is not"
        - "Potentially material where the company or its clients fall within the applicable perimeter"
        - "ADGM lists a 2026 AML-framework proposal and VARA describes its Dubai virtual-asset regime; no CertiK-specific application is shown"
        - "Unknown by legal entity, service, and market"
        - "Map each service to applicable rules and monitor licensing registers, consultations, enforcement notices, and client obligations"
    notes: >-
      Partial register of public-evidence exposures, not an exhaustive legal inventory.
      Likelihood is unquantified and severity is conditional on the stated scenario; regulatory
      pages describe general frameworks and do not establish CertiK's presence or status.
    enumerationScope:
      coverage: partial
      basis: "Assigned public sources accessed 2026-10-26; no company license register, legal-entity schedule, or internal compliance testing was supplied."
    claimRefs:
      - CR011
      - CR012
      - CR014
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Risk / ranked exposure
      - Likelihood
      - Impact
      - Evidence and mitigation maturity
      - Residual exposure
      - Monitor / diligence path
    rows:
      - - "1 / Live-system testing and authorization boundary"
        - "One 2024 dispute is reported; recurrence is unknown"
        - "High potential trust and counterparty impact if testing exceeds agreed scope"
        - "Two third-party accounts describe disputed Kraken testing; Hunt terms now state program-scoped authorization, but no case-specific consent or remediation record is available"
        - "High until engagement controls and the 2024 timeline are verified"
        - "Inspect signed scopes, approvals, stop conditions, escalation records, asset custody, return controls, and incident notices"
      - - "2 / Account compromise and access control"
        - "One 2024 compromise is reported; recurrence is unknown"
        - "Material credibility exposure; customer-system impact is not established in the assigned evidence"
        - "DL News reports an employee-phishing compromise of CertiK's X account; remediation controls are not evidenced"
        - "Unknown pending post-incident control testing"
        - "Review incident response, MFA and privileged access, recovery procedures, phishing controls, and independent retesting"
      - - "3 / Audit scope and customer reliance"
        - "Unknown; the assigned profile offers examples but no incident-rate denominator"
        - "Potentially high if a buyer treats an audit as a guarantee or relies outside its stated scope"
        - "Web3Security.ai summarizes Telcoin and Huione examples with explicit corroboration limits; Hunt terms disclaim guarantees about vulnerability findings"
        - "Material evidence gap; do not treat the profile as independently verified audit-performance data"
        - "Obtain primary post-mortems, audit scopes, remediation closure, customer outcomes, and independent evidence for any cited incident"
      - - "4 / AI and agent-mediated security outputs"
        - "Unknown; no false-result or production-incident denominator is available"
        - "Potentially high if an inaccurate assessment informs a transaction or regulated-client decision"
        - "Company release promotes AI-assisted compliance mapping; a vacancy describes human review; TechCrunch reports an agent-facing wallet/token assessment service; performance is untested here"
        - "Unknown until model, human-review, and release controls are independently validated"
        - "Test adversarial cases, abstention and escalation behavior, approval gates, versioning, auditability, and rollback/kill switches"
    notes: >-
      Ranks reflect conditional customer and trust impact, not a calibrated probability.
      Reported historical events establish exposure only; the sources do not establish
      recurrence, broad product failure, or the effectiveness of current controls.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR013
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Risk / ranked exposure
      - Dependency
      - Failure scenario
      - Likelihood / concentration
      - Mitigation maturity
      - Residual exposure and diligence path
    rows:
      - - "1 / Platform access and distribution"
        - "OKX AI-agent marketplace"
        - "Access, terms, or marketplace adoption changes before the CertiK service demonstrates reliability"
        - "Early-builder presence is reported; usage, revenue, and concentration are unreported"
        - "No platform rights, service levels, or fallback routes are shown"
        - "Material execution uncertainty / verify contract terms, service metrics, and independent distribution alternatives"
      - - "2 / Institutional-partner execution"
        - "National Bank of the Kyrgyz Republic memorandum"
        - "Exploratory cooperation does not become a deployment or recurring contract"
        - "The release describes an intent to explore; no deployment or revenue is established"
        - "Company announcement only; milestones and operating responsibility are not disclosed"
        - "Unknown / verify signed scope, procurement status, milestones, counterpart obligations, and delivery owner"
      - - "3 / Capital-provider concentration and liquidity"
        - "Reported Binance follow-on investment and investor position"
        - "Undisclosed rights or financing terms could affect future funding flexibility"
        - "DL News attributes a 'multi-eight figures' description to the CEO; exact amount, terms, and current concentration are unknown"
        - "A reported investment is not evidence of cash available or runway"
        - "Unknown / obtain current cap table, investor rights, financing instruments, and cash/burn bridge"
      - - "4 / Customer and contract concentration"
        - "Customer renewals, top accounts, and commercial terms"
        - "Loss or repricing of a material account could impair revenue or utilization"
        - "No current concentration, renewal, or contract-level data appears in the assigned sources"
        - "Not assessable from public evidence in this pool"
        - "Unknown / request top-customer revenue share, renewal cohorts, termination rights, and channel dependence"
    notes: >-
      These are diligence scenarios, not evidence of an existing partner failure or customer
      concentration. A reported investment does not establish current liquidity, and an
      exploratory memorandum does not establish deployment.
    claimRefs:
      - CR013
      - CR015
      - CR016
      - CR017
