        - Expected five-year incremental market gain in hardware
        - Low
        - Market gain, not current TAM or total 2030 market size; model not shown in retrieved summary
      - - CertiK Hack3D; H1 2026
        - Crypto/Web3 incidents covered by the report
        - $1,315,676,432 across 344 incidents
        - Reported gross losses; adjusted losses after frozen and returned funds were $1,200,364,925
