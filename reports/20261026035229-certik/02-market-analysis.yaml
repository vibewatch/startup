      - - Continuous monitoring and risk tools
        - Included when paid
        - Projects, exchanges, wallets, and institutions
        - Monitoring, alerts, ratings, and risk-management products
        - Separate ongoing tools from one-time assessment fees
      - - Compliance and institutional risk services
        - Adjacent included segment
        - Banks, VASPs, and regulators
        - AML/KYT, compliance mapping, and digital-asset risk visibility
        - Evidence is mainly company-issued; budget ownership is not established
      - - Crypto-asset value and transaction value
        - Excluded
        - Not a direct security buyer measure
        - Asset value or attributed transaction volume
        - Economic exposure does not equal vendor spend
      - - Exploit and illicit-activity losses
        - Excluded from market revenue
        - Security teams, risk teams, and public authorities may use as a risk signal
        - Incident losses or illicit flows
        - Demand context only; neither is a measure of addressable security revenue
    notes: >-
      Analyst-defined boundary synthesized from the cited market taxonomy and
      product descriptions; no source provides transaction-level spend or a
