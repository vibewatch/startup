  evidenceGaps:
    - type: missing-source
      severity: material
      topic: web3-security-market-sizing
      missingEvidence: >-
        A current global spend estimate with its market boundary, geography,
        component definitions, forecast assumptions, and a separately supported
        CertiK SAM/SOM.
      whyItMatters: >-
        Component-level forecast gains and attack losses do not establish
        addressable vendor revenue, limiting any defensible market-growth or
        penetration conclusion.
      diligencePath: >-
        Obtain the full TBRC model and full Research and Markets report with
        disclosed definitions; reconcile the scope to CertiK's paid products
        and verified revenue by product.
      relatedQuestionRefs:
        - QM002
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: certik-commercial-economics
      missingEvidence: >-
        Public pricing, realized contract values, buyer-level budgets, recurring
        versus project revenue, and market-share calculations for CertiK.
      whyItMatters: >-
        Product availability and stated institutional interest do not demonstrate
        willingness to pay, actual spending, or the company's capture of the
        addressable market.
      diligencePath: >-
        Request anonymized pricing and contract cohorts, revenue by product and
        customer segment, renewal and attach rates, and the denominator and
        methodology behind any market-share claim.
      relatedQuestionRefs:
        - QM010
    - type: conflicting-data
      severity: minor
      topic: web3-security-loss-estimates
      missingEvidence: >-
        Reconciled inclusion rules and incident definitions for the H1 2026
        CertiK and Immunefi loss datasets.
      whyItMatters: >-
        Their different reported totals and counts are not evidence of a trend
        until scope, inclusion criteria, and treatment of recoveries are aligned.
      diligencePath: >-
        Compare the underlying incident lists and definitions before using either
        series for market sizing or year-over-year extrapolation.
      relatedQuestionRefs:
        - QM007
        - QM009
      relatedTableRefs:
        - TM002
