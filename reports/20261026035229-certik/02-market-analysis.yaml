      - - Chainalysis; 2025
        - Global on-chain activity observed by Chainalysis
        - At least $154 billion received by illicit addresses
        - Lower-bound estimate; illicit share of attributed transaction volume remained below 1%
        - Medium; analyst estimate with stated scope limitations
        - Illicit flows are not addressable security-market spend
      - - CertiK-specific TAM, SAM, and SOM
        - Not established
        - Not disclosed in the assigned evidence
        - No verified current spend, company-specific serviceable pool, or obtainable share
        - Gap
        - Requires independent market definitions and company product/revenue disclosures
      - - Research and Markets; report page
        - Global market taxonomy in visible contents
        - No numeric market value visible in the fetched text
        - Component, deployment-mode, security-type, organization-size, and end-user segmentation; historic 2020-2025 and forecast 2025-2030F/2035F
