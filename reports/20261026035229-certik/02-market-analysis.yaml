        - Loss exposure, not security spend; period and incident coverage are source-defined
      - - KuCoin summary of Immunefi data; H1 2026
        - Crypto projects in the cited report
        - Approximately $972 million across 207 hacking incidents
        - Secondary report of third-party attack-loss data
        - Low; secondary summary of a competitor's research
