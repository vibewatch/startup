slug: certik
runDate: 2026-10-26
company:
  name: CertiK
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Web3 security is a narrower paid-services and software market than the value of
    crypto assets or the losses those assets experience. Available market research
    offers component-level growth opportunities, while incident and illicit-flow
    data signal risk exposure rather than security spend; public evidence does not
    establish CertiK's addressable revenue pool or share.
sections:
  - id: market-boundary
    title: Market boundary and scope
    body: >-
      For diligence, the relevant market is paid security and risk-management
      products and services for blockchain networks, smart contracts, decentralized
      applications, and digital-asset operators. It includes scoped code and
      protocol reviews, formal verification, penetration testing, and ongoing
      monitoring or compliance tools when customers pay for them. It excludes the
      value of crypto assets, general-purpose cybersecurity spend, and losses from
      attacks: those can indicate exposure but are not vendor revenue. The TBRC
      report groups Web3 security into software, hardware, and services, a useful
      taxonomy but not a disclosure of where CertiK's own revenue falls. The
      distinction matters because a large loss pool or a broad industry label
      cannot be multiplied into an addressable market without spend, buyer, and
      product-boundary evidence.
    claimRefs:
      - CM001
      - CM002
    tableRefs:
      - TM001
  - id: sizing-evidence
    title: Sizing evidence and comparability
    body: >-
      The available market-research page gives projected five-year component
      “market gains” through 2030, not a current market value or a complete
      forecast of total addressable spend. It does not establish CertiK's SAM or
      SOM, and its accessible summary does not disclose the underlying model or
      market-share assumptions. Separate risk measures help test whether the
      problem is economically salient, but they measure different populations:
      CertiK's H1 2026 Hack3D report records $1.316 billion of losses across 344
      incidents, while KuCoin relays an Immunefi figure of approximately $972
      million across 207 hacking incidents. CertiK says H1 2026 losses were
      approximately 28% higher than H1 2025 on a comparable basis after
      excluding the Bybit event; these loss measures should not be combined or
      relabeled as security revenue. Chainalysis' lower-bound estimate of
      illicit crypto receipts is another risk lens, not a security-market
      denominator.
    claimRefs:
      - CM003
      - CM005
      - CM006
      - CM008
      - CM019
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-and-purchase-path
    title: Buyers, users, and purchase logic
    body: >-
      Public materials point to several buyer groups rather than one uniform
      customer: protocol and application builders, exchanges and wallets, and
      institutions or virtual-asset service providers facing compliance and
      operational-risk requirements. Security and product teams are the likely
      users for code assessment and monitoring, while compliance or risk teams
      are likely users for screening and regulatory tools; the sources do not
      identify who controls budgets or quantify typical contract size. Investors
      and end users may consume public ratings, but the evidence does not show
      that they are the paying buyer. CertiK's paid release describes products
      for banks, VASPs, and regulators, but its adoption statements are not
      independently measured purchase rates or proof of security-software
      spending.
    claimRefs:
      - CM009
      - CM014
      - CM015
    tableRefs:
      - TM003
  - id: adoption-constraints
    title: Adoption constraints and diligence implications
    body: >-
      Demand is supported by the persistence and severity of exploits, but audit
      work does not remove residual risk: attack exposure spans code defects,
      wallet compromise, phishing, and infrastructure or access-control failures.
      The H1 datasets also differ in stated coverage, so a buyer or investor
      should not infer a single market incident denominator from their headline
      totals. The TBRC outlook names talent shortages, technical complexity, and
      regulatory uncertainty as restraints, all of which can slow procurement
      even when risk is high. The sponsored CBS Brand Studio article's claim that
      CertiK controls more than 65% of the global blockchain-auditing market has
      no market definition or supporting calculation in the retrieved text and
      is not an independent benchmark. Underwriting therefore still needs
      disclosed pricing, realized revenue by product, buyer budgets, retention,
      and a reproducible market-share methodology before assigning a CertiK
      serviceable market.
    claimRefs:
      - CM008
      - CM011
      - CM012
      - CM014
      - CM015
