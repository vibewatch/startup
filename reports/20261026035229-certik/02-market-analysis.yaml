        - Segmentation breadth does not isolate CertiK's serviceable market
    notes: >-
      Currency and periods are preserved as reported. TBRC component figures are
      expected incremental gains, not total market values. Loss and illicit-flow
      figures are risk-exposure lenses, not revenue; the H1 2026 incident datasets
      have unreconciled scopes.
    claimRefs:
      - CM002
      - CM003
      - CM005
      - CM006
      - CM008
      - CM019
  - id: TM003
    title: Buyer and adoption map
    columns:
      - Segment
      - User and likely budget function
      - Evidenced problem or purchase trigger
      - Product or status-quo alternative
      - Evidence limit
    rows:
      - - Protocols and Web3 application builders
        - Security and product teams; budget signer not identified
        - Code or protocol risk before deployment and during upgrades
        - External audit, formal verification, penetration testing, internal review, and bug bounty
        - No public typical fee, budget, or conversion data
      - - Exchanges and wallets
        - Security, operations, or risk teams; budget owner not identified
        - Asset custody, monitoring, project screening, and operational risk
        - Monitoring and risk tools; internal controls remain a substitute
        - Source descriptions do not quantify adoption or spend
      - - Banks and virtual-asset service providers
        - Compliance, security, and risk functions; budget owner not established
        - Licensing preparation, ongoing AML/KYT, and security assessment
        - Compliance products and internal or external compliance workflows
        - Product adoption claims are company-issued, not independently measured
      - - Regulators and public authorities
        - Supervisory teams; procurement path and budget not evidenced
        - Oversight and continuous visibility into digital-asset risks
        - Regulatory analysis and existing supervisory systems
        - A paid company release asserts adoption without naming or quantifying deployments or spend
      - - Investors and end users
        - Users of public risk scores; payer status is not established
        - Assess project-level risk and monitor public security signals
        - Public ratings, direct research, or other third-party diligence
        - Public information use does not establish a customer relationship
    notes: >-
      Segment functions synthesize publisher and company descriptions. Budget
      ownership, contract value, and adoption rates remain unverified.
    claimRefs:
      - CM009
      - CM014
      - CM015
