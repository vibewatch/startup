      - number: '1.3'
        title: 资本化轨迹、运营规模与尽调审视
        blocks:
          - type: paragraph
            body: >
              Zum 的资本化轨迹体现出估值快速扩张：从 Sequoia Capital 和 Spark Capital 的早期风险投资，发展到主权基金和私募股权轮次。2024 年 1 月，公司以新加坡主权财富基金 GIC
              领投的 $140M E 轮、$1.3B 估值达到独角兽地位，并获得 EPA Clean School Bus 计划补助支持。2026 年 4 月，TPG's Rise Funds 追加投资
              $100M，使累计机构融资达到 $430M，投后估值升至 $1.7B。


              运营指标确认了显著的地域扩张：截至 2026 年中，Zum 已将运营范围扩大至 17 个州、4,500 多所学校，服务 Los Angeles Unified、San Francisco
              Unified、Boston Public Schools、Seattle Public Schools 和 Philadelphia 等知名学区。公司自报 2025 年收入为 $333M，同比增长
              35%，累计总合同价值超过 $2B。然而，外部财务审视指出，Zum $1.7B 的私营估值对应未经验证利润率下的 5.1 倍收入倍数。尽调观察者还指出，高额运营资本支出、持续的司机工资负担、电池基础设施成本，以及
              Rhode Island 等新区域的学区抵触，都使现金消耗和可持续经营杠杆存在未解问题。
