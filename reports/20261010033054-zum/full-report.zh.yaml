      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              最新披露的融资锚点是 2026 年 4 月完成的 $100M F 轮，投后估值 $1.7B；多个独立数据库都将 TPG 列为投资人或领投方。此前，Zum 于 2024 年 1 月宣布完成 $140M E
              轮融资，估值 $1.3B。由此得到的 30.8% 涨幅可以观察到，但证据无法说明其中有多少来自经营表现、证券条款或谈判条件。公开数据库对累计融资额也存在分歧，分别报出 $430M、$439M 和
              $444.11M；因此，已募集资金不应视为可用现金。Forge 列出的 F 轮清算优先权倍数为 1.3 倍、股息率为
              6.0%，但完整股权结构表、优先级之间的相互影响、转换经济性、期权池和债务情况均不可得。入场纪律应依据完全摊薄后的持股和清算瀑布结果，而不能只看标题估值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 估值情景与可比证据
        blocks:
          - type: paragraph
            body: >-
              目前有两个公开估值锚点，但都不是完整估值。融资估值为 $1.7B，QuantLogix 则于 2026 年 10 月 10 日发布 $1.4B 的模型估算，比上一轮低 16%。AInvest 将 $1.7B
              估值与公司自报、未经审计的 2025 年收入 $333M 结合，得出约 5.1 倍收入倍数。该计算不是 ARR
              倍数，也不能证明企业价值；如果没有净债务、稀释、利润率、现金消耗和退出时点，就无法将其转换为回报预测。现有证据包含融资轮次引用，但没有一套可辩护的上市公司、私募轮次或并购可比案例，能够对业务组合和盈利能力进行标准化处理。因此，情景表采用有证据支持的决策阈值，而不虚构目标价格或概率百分比。
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度、论点失效与最终尽调
        blocks:
          - type: paragraph
            body: >-
              公开退出准备度尚未得到证明。QuantLogix 报告称 Zum 仍是私有公司，且没有公开备案的 S-1；Forge 则表示公司尚未公开支持 IPO
              计划。这一缺失并不能证明不存在保密准备，只说明公开市场投资人缺少招股书级别的披露和可观察的上市时间表。只有经审计报表证明合同利润率具备持续性、现金转换能力和续约表现可靠，且车队融资可控，同时补齐完整的优先权瀑布和客户集中度明细后，投资建议才会改善。论点失效触发条件以证据为基础：收入持续增长但单位经济性不改善、合同流失或续约走弱、单次乘车成本上升，或在按证券条款调整后融资估值低于上一轮。在这些问题得到解决前，仅凭公开证据无法负责任地量化目标回报或持有期。
            claimRefs:
              - CV008
              - CV009
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 公开证据不支持买入
            body: $1.7B 融资估值确实反映了投资人谈判形成的价格，但不能证明内在价值。在设定目标回报或接受私募市场流动性不足前，应先要求经审计的单位经济性、完全摊薄资本化瀑布、合同队列和退出证据。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV014
              - CV016
