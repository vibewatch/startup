      - number: '2.3'
        title: 买方、用户与付款方细分及采用路径
        blocks:
          - type: paragraph
            body: >-
              学生交通的采用路径，将组织买方、日常系统用户和机构付款方清晰分开。正式经济买方通常是公立学区教育委员会和学监，他们依据交通主管、首席财务官和采购委员会建议决策。用户包括乘车学生、监测日程的家长与监护人，以及驾驶城市动态路线的司机；付款则由市政税收、地方学校运营预算和州级学生交通拨款共同承担。因此，采购高度依赖共识、风险厌恶，并锚定通常为
              3 至 5 年的多年期 RFP
              周期。大型城市学区面临长期司机短缺、复杂特殊教育接送要求和家长对可靠性的严格监督，因而寻求能提升路线效率、保障司机配置并提供实时可视化应用的托管交通合作。郊区和中型学区则常优先考虑补充交通、学区外特殊教育线路或拆分的软件订阅。两类客户都要求供应商通过严格背景核查、监管安全合规审查，并处理与地方工会的市政集体谈判协议。
            claimRefs:
              - CM003
              - CM006
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM010
              - CM014
      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              学区采用现代学生交通平台主要受两项因素推动：服务长期不可靠，以及市政可持续发展要求。多年对传统路线和纸质调度投入不足，造成普遍运营摩擦、家长挫败和教学时间损失。University of Chicago 的
              NORC 研究显示，54% 的家长称孩子对校车交通感到焦虑，全国每年因此损失的教学价值估计达 $15B。采用 Zum 的学区已获得可量化改善：Kansas City Public Schools 准时率达
              95%，交通相关缺勤下降 86%，出勤率上升 2.5%；San Francisco Unified School District 通过将重复线路减少约 10%，每年节省约
              $3.5M。联邦和州清洁能源计划也推动配备双向 V2G
              技术的电动校车，把闲置电池转化为市政公用事业的分布式能源资产。另一方面，采用仍受运营和财务摩擦限制：司机短缺、车辆资本成本、维护车场租赁承诺和复杂工会谈判都增加负担。Zum 2023 年秋季在 Howard
              County Public Schools
              的初始上线暴露出执行脆弱性：线路取消和司机不足迫使公司空运外州司机，并触发独立运营审计，指出过渡时间表和协调存在缺陷。尽调还缺少底层单位经济性、毛利率、软件与车队服务收入结构及学区贡献利润的经审计披露；公司
              35% 的收入增长和 $1.7B 私营估值虽反映出强劲的公开市场关注，却仍无法判断多年期合同规模化是否带来经营杠杆。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 交通焦虑危机是采用催化剂
            body: 对“交通焦虑危机”的量化——将每日校车延误与每年 $15B 的教学价值损失、54% 家长报告的学生焦虑联系起来——把学生交通从同质化物流支出提升为学监和教育委员会关注的战略教育结果指标。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
          - type: callout
            title: 合同规模摩擦与利润率不透明
            body: >-
              Zum 虽然展现了拿下大型都市学区合同的能力，但快速实施带来严重运营风险，2023 年 Howard County 上线期间的司机短缺就是例证。没有经审计的毛利率数据，投资人无法验证 35%
              的收入增长究竟带来经营杠杆，还是仅反映资本密集型车队间接费用。
            calloutType: risk
            claimRefs:
