      - number: '6.4'
        title: 客户旅程、扩张循环与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Zum 的扩张遵循机构客户旅程：从公开竞争性招标进入日常重复执行，再通过技术扩大合同。拿到学区合同后，公司启动 GIS
              路线建模和本地车队基础设施部署，为学区调度员上线系统并分发家长追踪工具，以减少支持工单、提升社区透明度。成功交付形成“落地并扩张”机制，让 Zum
              在既有学区获得更多线路、交叉销售车队电动化基础设施，并利用参考客户赢得相邻市政招标。但该模式带来严重客户和地域集中风险：收入集中在少数大型公立学区，市政预算赤字、教育委员会选举或供应商更换都可能突然威胁数千万美元经常性收入。Johnston
              和 Scituate 等 Rhode Island 小型区域市场的扩张还暴露招聘和设施摩擦，司机配置瓶颈直接限制线路上线速度。关键是，Zum 既未披露
              NRR，也未披露毛利率桥接，投资人无法验证知名合同增长是否产生持久经营现金流。
            claimRefs:
              - CU008
              - CU011
              - CU012
              - CU013
              - CU014
