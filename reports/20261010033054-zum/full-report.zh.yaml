  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代类别
        blocks:
          - type: paragraph
            body: >-
              美国学生交通市场约有 500,000 辆校车，年度支出 $50B，是学区仅次于教学人员工资的第二大成本类别。竞争主要分为三种模式：大型全国性在位承包商、分散的区域或市政巴士运营商，以及学区内部交通部门。First
              Student
              是北美主导在位承包商，运营数万辆校车，拥有广泛车场基础设施、成熟教育委员会关系和商业车队采购规模。较小的区域运营商服务本地县或郊区合同，主要凭本地关系和低间接费用竞争，而非技术投入。公立学区还经常权衡维持自有车队与外包运营，在车队现代化高资本支出和承包商管理风险之间取舍。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 平台能力与技术差异化
        blocks:
          - type: paragraph
            body: >-
              传统黄色校车承包商主要依靠重资产人员配置和车辆租赁、数字集成有限；Zum 则把托管实体运营与自有 Connected Mobility Experience 平台结合。CMX 架构协调实时调度、AI
              路线生成、司机逐向导航和面向家庭的追踪应用，减少重复线路和家长不确定性。真实学区部署显示，算法路线优化可使所需线路数最多减少 10%，每年节省数百万美元交通运营成本。First Student
              等在位者已部署附加车联网和第三方追踪门户，但传统车队架构和分散的软件收购经常造成运营割裂。此外，Zum 早期整合一站式 V2G 电动车队，为面临法定清洁空气和电动化要求的大都市学区提供战略切入口。
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP007
              - CP009
              - CP010
