  - id: TV001
    title: 建议总结
    columns:
      - 维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 规模已显现，但缺乏经审计的盈利能力和现金流证据。
        - 不要只凭私募市场的显眼标价决定买入。
      - - 置信度
        - 中
        - 多个独立数据库相互印证最新轮次；运营披露仍未经审计或由公司发布。
        - 只有取得并审阅财务和合同数据后，才能提高置信度。
      - - 风险评级
        - 高
        - 运营强度、成本敞口、非上市股权流动性差以及资本条款不完整，限制了下行空间的可见度。
        - 相比信息披露充分的上市发行人，需要更大的信息和价格安全边际。
      - - 估值立场
        - 对价格敏感；$1.7B 缺乏充分支撑
        - 可观察锚点包括 $1.7B 融资估值和 $1.4B 第三方模型估值。
        - 两者都只能作为参考，不能视为内在价值结论。
      - - 回报 / 持有 / 退出
        - 缺乏公开证据支撑
        - 没有公开 S-1、退出时间表、经审计现金流、净债务或完全摊薄持股数据。
        - 在尽调缺口补齐前，暂缓目标回报和持有期建模。
    notes: 评估采用公开融资和模型锚点；这不是目标价、投资要约，也不是可用现金估算。
    claimRefs:
      - CV001
      - CV008
      - CV013
      - CV014
      - CV015
      - CV016
  - id: TV002
    title: 正方与反方论点
    columns:
      - 视角
      - 论点
      - 已观察证据
      - 改变判断的条件
    rows:
      - - 正方论点
        - Zum 已实现广泛的运营覆盖。
        - 公司页面称已覆盖 19 个州的 7,500+ 所学校。
        - 独立客户和合同数据确认覆盖范围、留存率和集中度。
      - - 正方论点
        - 运营系统可能提升服务可靠性。
        - Zum 定义并报告 SY 2025-26 准时率为 98%。
        - 披露罚金和排除项的经审计学区级绩效队列。
      - - 正方论点
        - 路线优化可能创造可量化的客户价值。
        - 公司托管的 Fresno 客户证言称每年节省约 $3.5M，并立即减少 10% 的路线。
        - 在具有代表性的学区和不同合同年份中复现节省效果。
      - - 反方论点
        - 管理式交通可能仍然高度依赖劳动力和资产。
        - 反向分析强调司机、燃油和折旧成本，同时指出缺乏毛利率和现金流披露。
        - 经审计的每次乘车成本下降、毛利率扩张和现金转化为正的证据。
      - - 反方论点
        - 头部估值可能掩盖投资人特定的经济权益。
        - Forge 列出 Series F 1.3x 清算优先权倍数和 6.0% 股息率。
        - 完整股权结构表和瀑布表，展示多种退出情景下普通股等价收益。
    notes: 公司自行发布的运营主张和客户证言不是独立基准；所需证据明确了待完成的验证。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
  - id: TV003
    title: 乐观、中性与悲观决策阈值
    columns:
      - 情景
      - 有证据支撑的估值参考
      - 必要假设
      - 概率信号
      - 下行 / 上行触发条件
    rows:
      - - 乐观
        - 只有新增证据支持，估值才可高于 2026 年 4 月 $1.7B 融资估值
        - 经审计的毛利率扩张、正现金转化、稳健续约和有限的优先权收益侵蚀。
        - 无法依据公开证据估算
        - 上行空间需要经过验证的运营杠杆，以及普通股等价收益的退出路径。
      - - 中性 / 观察
        - $1.4B 模型估值至 $1.7B 上轮参考区间；不是公允价值区间
        - 增长延续，但毛利率、现金流、集中度和稀释证据仍不完整。
        - 不确定
        - 只有审阅经审计的经济数据和完整资本化瀑布表后，才调整判断。
      - - 悲观
        - 低于 $1.4B 模型估值；没有可支撑的数值下限
        - 成本结构性偏高、续约质量恶化，或新融资包含更强的下行保护。
        - 重大但无法量化
        - 估值下调轮、合同流失、每次乘车成本上升或不利的优先权结果会击穿论点。
    notes: 情景参考是锚定公开可观察估值的决策阈值，不是预测；由于缺少关键财务和资本化输入，未赋予概率或目标回报。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV009
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Zum 从共享出行起步到电动大规模学生交通平台的历程。
    data:
      items:
        - label: 2014 年 11 月
          detail: Ritu Narayan 在加利福尼亚州 Redwood City 创办 Zum Services, Inc.，旨在解决学生通勤难题。
          tone: neutral
        - label: 2016 年 2 月
          detail: 完成 $2.5 million 种子轮融资，在旧金山湾区试点适合儿童的共享出行。
          tone: positive
        - label: 2017 年 8 月
          detail: 由 Sequoia Capital 领投，完成 $5.5 million A 轮融资，扩展学校交通软件。
          tone: positive
        - label: 2018 年 3 月
          detail: 由 Spark Capital 领投，完成 $19 million B 轮融资，转向全面的学区合同业务。
          tone: positive
        - label: 2021 年 10 月
          detail: 由 SoftBank Vision Fund 2 领投，完成 $130 million D 轮融资，估值 $930 million。
          tone: positive
        - label: 2024 年 1 月
          detail: 由 GIC 领投的 $140 million E 轮融资使其成为独角兽，估值 $1.3 billion；并获得首批 EPA Clean School Bus 补助。
          tone: positive
        - label: 2024 年 8 月
          detail: 在加利福尼亚州 Oakland 部署全国首支 100% 电动、双向车网互动（V2G）校车车队。
          tone: positive
        - label: 2026 年 4 月
          detail: TPG's Rise Funds 以 $1.7 billion 估值投资 $100 million F 轮；Steve Ellis 加入董事会。
          tone: positive
        - label: 2026 年 5 月
          detail: 与 SFUSD 启动 104 辆双向电动车队项目；赢得 Philadelphia School District 的重要合同。
          tone: positive
        - label: 2026 年 6 月
          detail: 在罗得岛州扩张受阻之际，市场开始审视 5.1x 收入倍数和未经验证的运营利润率。
          tone: negative
    approximationNotes: 里程碑日期源自经核实的公司公告、PR Newswire 发布、监管通知和财务分析。
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO006
      - CO007
      - CO010
      - CO012
      - CO013
      - CO015
      - CO016
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 从美国学校交通总支出到 Zum 合同学校基础的受限市场规模分层。
    approximationNotes: 市场规模分层综合行业报告、公司披露和 IPO 前分析师估算；合同制 SAM/SOM 数字代表可触达的合同细分市场和已服务细分市场。
    claimRefs:
      - CM001
      - CM002
      - CM008
      - CM010
      - CM014
    data:
      items:
        - label: 美国学生交通总市场（TAM）
          value: $50B
          unit: annual spend
          detail: 学校第二大成本项；每天由 500k 辆巴士运送 26M 名学生
          tone: neutral
        - label: 合同制学生交通细分市场（SAM）
          value: $15B–$20B
          unit: addressable outsourced
          detail: 外包的学区交通运营历来由传统承包商主导
          tone: neutral
        - label: 技术驱动的 CMX 现代化细分市场
          value: $5B–$8B
          unit: near-term target
          detail: 寻求整合 AI 路线规划、家长追踪应用和交钥匙运营的学区
          tone: positive
        - label: 交钥匙车队电气化与 V2G 层
          value: $2B–$3B
          unit: fleet transition
          detail: 采用电动校车、充电车库和双向电网服务的学区
          tone: positive
        - label: Zum 总合同价值（TCV）管线
          value: '>$2.0B'
          unit: multi-year contracts
          detail: 包括 LAUSD、SFUSD、Seattle 和 Howard County 在内的主要都市学区累计获授合同
          tone: positive
        - label: Zum FY2025 收入基础（SOM）
          value: $333M
          unit: unaudited revenue
          detail: 约占 $50B 总市场的 0.7%，收入同比增长 35%
          tone: neutral
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 按技术整合度和实体车队规模，对学生交通服务商进行排序定位。
    data:
      points:
        - label: Zum
          x: 4
          'y': 9
        - label: First Student
          x: 10
          'y': 5
        - label: 区域公交承包商
          x: 6
          'y': 2
        - label: 学区自有车队
          x: 8
          'y': 3
        - label: HopSkipDrive
          x: 3
          'y': 7
        - label: 市政交通替代方案
          x: 5
          'y': 2
    approximationNotes: X 轴代表实体车队规模和地理覆盖范围（1-10 序位尺度）；Y 轴代表软件现代化和电气化整合程度（1-10 序位尺度）。
    claimRefs:
      - CP006
      - CP008
      - CP012
      - CP013
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 展示学区合同和 EV 充电资产如何转化为运营收入，扣除劳动力与车队费用后形成净运营利润率的完整运营链条。
    data:
      nodes:
        - id: district-rfp
          label: 1. 多年期学区 RFP 授予
          detail: 学区基于安全、技术和成本节省，授予 3-5 年专属巴士合同。
        - id: fleet-deployment
          label: 2. 车队部署与路线规划
          detail: 由 Zum CMX AI 调度系统统筹部署柴油和电动巴士车队。
        - id: contract-billing
          label: 3. 学区合同收入
          detail: 在市政预算下按路线和车辆计费的可预测经常性收入（2025 年收入 $333M）。
        - id: operating-expenses
          label: 4. 直接运营成本（COGS）
          detail: 司机薪酬、保证福利、车队维护和车库充电带来的大量可变现金流出。
        - id: subsidies-grants
          label: 5. 公共补贴与拨款
          detail: 通过 EPA Clean School Bus 代金券（$35M+）和 PG&E 基础设施支持抵消资本支出。
        - id: v2g-monetization
          label: 6. 双向电网变现
          detail: 来自 V2G 峰值需求放电的第二收入流（2.1 至 3 GWh/yr 容量）。
        - id: operating-margin
          label: 7. 净运营贡献
          detail: 最终合同利润率画像目前尚未清晰，且受劳动力密集度和未经验证的独立软件杠杆效应制约。
    approximationNotes: 基于学区合同机制、已报告收入和公开电气化补贴的示意性运营流程；COGS 与软件利润率的精确拆分尚未披露。
    claimRefs:
      - CI001
      - CI005
      - CI007
      - CI012
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 基于指定公开证据梳理出的产品与运营界面功能栈。
    data:
      layers:
        - label: 家庭与学生体验
          detail: 家长和学生应用，提供追踪、预计到达时间、更新、取消、路线详情和账户访问。
        - label: 学区与学校监督
          detail: 展示车队、路线、校园、学生和异常情况的仪表盘。
        - label: 运营方协调
          detail: 指挥中心工作流，处理任务分配、覆盖、待命司机、拼车和行程复核。
        - label: 路线与司机工作流
          detail: AI 驱动的路线优化、导航、学生照护指引、监控和辅导。
        - label: 车队与车库运营
          detail: 管理司机、巴士和厢式车、停车场、车库及充电基础设施。
        - label: V2G 与公用事业接口
          detail: Oakland 部署所代表的双向充电和公用事业容量。
    approximationNotes: 该排序是分析性的功能视图，不是已披露的技术拓扑；未推断协议、供应商或数据流。
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
      - CE012
      - CE013
  - id: FU001
    title: 客户旅程与运营采用图
    type: journey-map
    summary: 描绘多方参与者从市政采购、路线优化到日常运营追踪和合同扩张的推进路径。
    approximationNotes: 工作流阶段综合标准公立学区采购周期和已记录的 Zum CMX 运营触点。
    claimRefs:
      - CU007
      - CU008
      - CU013
    data:
      items:
        - label: 1. 市政 RFP 与采购
          detail: 学区评估出行方案、车队电气化承诺和软件能力。
          touchpoints:
            - 提交学区 RFP 投标
            - 学校董事会公开听证
            - 执行多年期主合同
        - label: 2. 路线规划与车队设置
          detail: AI 驱动的路线优化取代旧路线；建立本地司机车库和充电基础设施。
          touchpoints:
            - 导入学区 GIS 和学生入学数据
            - 司机招聘和 SafeGuard 背景调查
            - 准备 EV 充电和巴士车库设施
        - label: 3. 入驻与应用激活
          detail: 学校管理人员和家长获得数字平台访问权限，并接受 10+ 种语言的培训。
          touchpoints:
            - 设置管理员门户
            - 下载家长移动追踪应用
            - 发放学生 RFID / 数字巴士通行证
        - label: 4. 日常运营与实时追踪
          detail: 实时车辆追踪、乘车验证和实时预计到达通知确保 98% 准时到达。
          touchpoints:
            - 早晚实时 GPS 追踪
            - 自动推送延误和到达通知
            - 应用内出勤与缺勤管理
        - label: 5. 运营复核与绩效报告
          detail: 学区管理人员复核准时绩效仪表盘、车队利用率和家长满意度评分。
          touchpoints:
            - 月度 KPI 仪表盘（98% 准时率指标）
            - 家长评价汇总（4.9/5 评分）
            - 车队排放与燃油节省报告
        - label: 6. 路线扩张与车队现代化
          detail: 满意的学区增加路线数量、改造更多路线，并将柴油车队转换为电动巴士。
          touchpoints:
            - 行使多年期合同选择权
            - 新增路线协议（例如 Seattle +130 条路线）
            - V2G 双向充电集成（如 SFUSD）
