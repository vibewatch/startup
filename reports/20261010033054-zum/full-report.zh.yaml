  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据链最终只能给出“继续研究”，因为融资和运营规模可观察，但内在价值与退出所需数据不可得。
    data:
      nodes:
        - id: scale
          label: 运营规模
          detail: 7,500+ 所学校、覆盖 19 个州是公司自称，并非经审计的收入质量。
        - id: customer-proof
          label: 客户验证
          detail: 一则 Fresno 客户证言提到节省成本和减少路线，但缺少广泛客群的证据。
        - id: financing-mark
          label: 融资定价
          detail: 2026 年 4 月，Series F 融资 $100M，投后估值 $1.7B。
        - id: price-check
          label: 价格核验
          detail: QuantLogix 于 2026 年 10 月发布了 $1.4B 的模型估值。
        - id: missing-underwriting
          label: 缺失的投资判断输入
          detail: 经审计的利润率、现金流、客户集中度、股权结构表和退出时间均不可得。
        - id: recommendation
          label: 继续研究
          detail: 在没有价格和收益瀑布证据前，不应把公司质量直接转化为买入决策。
    approximationNotes: 仅为按顺序排列的定性逻辑；节点顺序不代表转化率、概率或估值计算。
