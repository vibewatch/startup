      - number: '7.2'
        title: 监管合规、市政竞标审查与学生安全要求
        blocks:
          - type: paragraph
            body: >-
              学生交通受到多层严格公共监督，涵盖联邦车辆标准、州教育部门和地方教育委员会采购规则。Zum 扩展至 Rhode Island 的 Johnston、Scituate
              等新区域时，因外州技术承包商以更高报价击败传统供应商而遭遇社区审查和竞争摩擦。集体谈判义务进一步放大法律风险，Seattle 与 Teamsters Local 174 的持续谈判就是例证。Zum 通过自有
              SafeGuard Driver 项目强制背景核查和培训，以降低学生交通安全责任；但在不断扩大的区域内无法保持零缺陷合规，可能立即导致合同终止。
            claimRefs:
              - CR002
              - CR003
              - CR008
              - CR013
