chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与平台架构
        blocks:
          - type: paragraph
            body: >
              Zum Services, Inc. 于 2014 年 11 月在 California 的 Redwood City
              创立，最初是一款面向儿童的拼车和通勤平台，后来转型为公立学区的一站式交通管理服务商。在创始人兼首席执行官 Ritu Narayan 带领下，公司解决北美学生交通中的系统性运营失灵问题——这一规模达 $50B
              的大众交通行业长期受纸质路线规划、调度不透明和普遍校车短缺困扰。


              核心产品是 Zum Connected Mobility Experience（CMX），一套自有操作系统，把实时 GPS 追踪、自动动态路线、司机调度工作流、车辆维护监测和双向家长沟通整合到一个界面。Zum
              将算法优化与实体运营结合，管理不同规格车队、电动校车和学区合同线路。官方学区部署显示，相比传统私营运营商合同，表现显著改善：平均准时到达率 98%，所需校车规模最多减少 20% 至
              25%，并为市政学区预算节省大量成本。
