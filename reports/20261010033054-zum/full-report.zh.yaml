        blocks:
          - type: paragraph
            body: >
              Zum 由创始人兼首席执行官 Ritu Narayan 领导。她创办公司，是为解决职场家长安排日常上学通勤时承受的物流压力。Narayan
              对产品愿景、学区合作战略和高管招聘拥有集中的职能权力。运营管理团队还包括通信副总裁 Jenny Mayfield，负责协调新市政区域的公共事务和合同上线公告。


              公司治理由活跃的董事会支撑，成员包括早期风险投资发起方、机构成长投资人和私募股权合作伙伴。早期机构治理代表包括 Sequoia Capital 的 Bryan Schreier、Spark Capital 的
              Nabeel Hyatt 和 Arif Lakhani，以及早期领导者 Vivek Garg、Abhishek Garg。Zum 于 2026 年 4 月完成 $100M F 轮融资后，TPG's Rise
              Funds 管理合伙人 Stephen Ellis 加入董事会。一级风险投资和影响力投资方的加入带来结构化监督，但日常学区竞标和资本配置仍高度依赖 Narayan 的领导和战略判断。
