  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公共合同机制
        blocks:
          - type: paragraph
            body: >-
              Zum 的绝大多数收入来自公立学区教育委员会通过竞争性 RFP 周期授予的多年期学生交通服务合同。合同通常为 3 至 5 年并带续约选项，依托法定教育资金，带来较高的未来收入可见度。在这些一站式协议下，Zum
              提供专用车队、持 CDL 司机、燃油或充电基础设施、维护和 CMX 软件平台。公司不拆分软件订阅费，而是按完整运营服务向学区收费，通常按每条校车线路固定年度付款，再加专业交通调整项。San Francisco
              Unified School District（SFUSD）等大型城市部署据称每年估计节省约 $3.5M 交通成本，相当于预算减少 10%。整体可服务市场约为美国公立学区每年 $50B
              的交通支出，是学区仅次于教育人员工资的第二大运营成本。
