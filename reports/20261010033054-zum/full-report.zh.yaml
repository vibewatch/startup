      - number: '7.3'
        title: 运营规模化阻力、司机短缺与路线可靠性
        blocks:
          - type: paragraph
            body: >-
              Zum 对学区的核心价值主张依赖软件驱动的运营可靠性：平均准时到达率 98%，通勤时长最多减少 20%，所需车队规模最多减少
              25%。但在数十个学区扩展日常学生交通，会带来巨大的执行复杂度。全国司机短缺迫使技术运营商提供更高薪酬，直接与根深蒂固的市政承包商竞争。实时家长追踪、自动 ETA
              更新和数字乘员核验可缓解运营脆弱性；即便软件工具完善，早晨接送时意外调度瓶颈或局部安全异常仍可能造成严重的局部中断，并触发合同罚则。
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR009
          - type: table
