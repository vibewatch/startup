              - CR009
      - number: '7.4'
        title: 学区交易对手集中度、工会谈判与融资结构
        blocks:
          - type: paragraph
            body: >-
              Zum 的收入和区域运营密度高度依赖集中度较高的公立学区合同，例如覆盖 280
              多条线路的西雅图公立学校多线路合作，以及费城近期的大额合同承诺。如果未能与司机工会顺利谈妥续签集体谈判协议，或在首个学年铺开服务时发生不利的履约争议，关键学区背书就可能受损。融资方面，公开私募股权资料对资本披露口径不一，从早期追踪数据的
              3,200 万美元到 Sequoia、SoftBank 和 TPG 支持的累计股权资本 4.3 亿美元不等。这种资本集中意味着，在经营现金流转正前，Zum
              需要持续获得投资人支持，才能为车队电动化和营运资金提供融资。
            claimRefs:
              - CR002
              - CR004
