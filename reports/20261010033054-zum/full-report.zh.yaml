      - number: '3.3'
        title: 合同模式、定价结构与转换成本
        blocks:
          - type: paragraph
            body: >-
              学生交通合同受正式公共采购流程约束，具有多年期 RFP 周期、严格保证金要求和强烈机构惯性。赢得学区业务需要提交按车按日计价或多年固定合同的竞争性报价，并保证车辆可用和司机配置。合同授予后通常运行 3 至 5
              年并带续约选项，形成客户锁定和可预测收入，保护在位者免受快速替代。但学区越来越在不同运营类别中多供应商采购，将特殊教育和 McKinney-Vento 无家可归学生交通交给 HopSkipDrive
              等小型面包车网络，同时保留主要黄色校车合同。Zum 年收入 $333M、TCV 超过 $2B，说明其整合模式能够替换根深蒂固的区域承包商，拿下全学区合同。
            claimRefs:
              - CP002
              - CP005
              - CP011
              - CP014
