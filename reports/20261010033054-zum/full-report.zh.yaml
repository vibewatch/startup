      - number: '6.5'
        title: 图表
        blocks:
          - type: callout
            title: 多方利益相关者切入口带来高学区转换成本
            body: Zum 为管理员、司机和家长提供不同的软件界面，把市政交通合同转化为稳固的公共关系。教育委员会负责出资，但 1.7M+ 条家长评价所代表的日常应用参与，会让学区重新切换到不透明的传统巴士运营商面临显著政治摩擦。
            calloutType: insight
            claimRefs:
              - CU001
              - CU007
          - type: callout
            title: 市政采购周期中的合同集中度
            body: >-
              Zum 的收入高度依赖 Los Angeles、San Francisco 和 Seattle 等旗舰城市学区，因此任一多年期招标流失或利润率压缩，都可能对其 $1.7B
              估值倍数构成生存性威胁；尤其公司完全没有公布队列续约数据。
            calloutType: risk
            claimRefs:
              - CU004
              - CU011
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 高管风险评估与剩余严重性排序
        blocks:
          - type: paragraph
            body: >-
              Zum 的运营风险体现出高增长市政合同扩张与重资产车队物流之间的根本张力。独立 IPO 前分析指出，长期司机短缺、工会劳动力、燃油价格波动和校车折旧等宏观成本压力无法靠软件优化消除。2026 年 4 月，Zum
              以 $1.7B 估值获得 $100M 成长融资，相当于未经审计的 2025 年 $333M 收入的估计约 5.1
              倍。该溢价估值已计入激进的利润率扩张和经营杠杆预期；若各条线路的经济性在进入公开市场前无法盈亏平衡，而公司又没有经审计损益表或经核实的毛利率桥接，投资论点将承受更高剩余风险。
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR014
          - type: figure
