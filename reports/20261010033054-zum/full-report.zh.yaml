        title: 成本结构、利润率驱动因素与披露缺口
        blocks:
          - type: paragraph
            body: >-
              尽管收入增长迅速，Zum 的成本结构仍由实体服务交付支出主导，而非纯软件间接费用。直接销售成本主要包括司机工资、健康福利、车辆折旧或租赁、车场租赁和充电基础设施。与轻资产软件公司不同，学生交通需要持 CDL
              资质人员；Zum 通过自有 SafeGuard Driver
              培训项目、竞争性工资和保证工时缓解全行业司机短缺。关键是，公司尚未公布经审计财务报表、线路贡献利润率或毛利润，投资人因此面临重大私有指标缺口。外部分析师强调，在缺乏经核实利润率数据的情况下，无法证明 AI
              调度和路线优化是否产生经营杠杆，或合同扩张是否要求运营支出线性增长。各学区合同的真实盈利能力仍是核心尽调要求。
