      - number: '3.4'
        title: 壁垒持久性与竞争定位
        blocks:
          - type: paragraph
            body: >-
              评估学生交通壁垒的持久性，必须承认软件本身无法形成不可逾越的进入壁垒。车队能力、车辆维护车场和商用司机招聘渠道仍是大众学生交通的根本运营约束。Zum 将运营范围扩大至 15 个州、4,000
              多所学校后，也必须面对传统承包商面临的劳动力动态，包括集体谈判及 Seattle Teamsters Local 174
              等工会谈判。其竞争壁垒依赖三项相互强化的运营支柱：降低每名学生运营成本的自有路线密度算法、促进教育委员会续约支持的高家长满意度，以及可在上学时段闲置期间实现 V2G
              电力变现的自有车场充电基础设施。无法匹配这一软件—车队—能源一体化生态的竞争者，可能在大都市竞标中被商品化。
            claimRefs:
              - CP006
              - CP008
              - CP012
              - CP013
