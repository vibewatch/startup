  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              美国学生交通行业是嵌入市政 K-12 教育体系的高度本地化、非可自由裁量公共事业。市场年度总支出估计达
              $50B，是北美最大的大众出行细分。校车出行受学生安全、家校铃声时刻表、车辆规格和专业司机认证等严格法规约束。学区历来通过市政员工运营的自有车队，或授予传统私营巴士承包商的多年期外包合同来履行职责。现状替代方案还包括家长私家车接送、学区发放的市政交通票和非标准线路的辅助交通面包车。市场边界将合同学生交通与消费出行、一般市政交通分开；前者包括黄色校车运营、司机薪酬与招聘、路线规划、维护车场、调度和特殊教育辅助交通，公共公交网络、长途学生包车及未经审核的私人拼车不在正式采购边界内。Zum
              等联网出行平台把资产支持的托管交通运营与 CMX 企业软件结合，以实时追踪、自动调度和统一车队管理替代割裂的模拟调度、人工排班和不透明沟通。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
      - number: '2.2'
        title: 可服务市场规模、估算视角与市场份额
        blocks:
          - type: paragraph
            body: >-
              评估现代技术赋能学生出行的市场规模，需要把 $50B 总可服务支出拆分为运营子项。全国约 2,600 万名儿童每天乘坐校车往返两次，使用约 500,000
              辆车，数量超过商业航空、铁路和市政公交车辆总和。但目前只有约 30% 至 40% 的学区把交通运营外包给商业承包商，因此合同学生出行的 SAM 约为每年 $15B 至
              $20B。其余市场由学区自有车队管理，历史上采购的是拆分的路线软件和车联网，而非一站式运营合同。Zum 同时瞄准传统合同替换和技术驱动的车队现代化；公司 FY2025 未经审计收入为 $333M，同比增长
              35%。尽管主要城市学区累计获授 TCV 超过 $2B，Zum 当前仍只占全国可服务总支出的
              <1%。这一渗透率显示郊区和农村学区仍有扩张空间，也暴露既有巴士运营商带来的漫长销售周期和地域黏性。各州资金公式、合同交通报销上限和车队电动化时间表不同，也限制了市场估算。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM009
              - CM010
