            body: >-
              Zum 报告 2025 年未经审计收入为 $333M，同比增长 35%，运营范围扩大至 15 至 17 个州、4,000
              多所学校。合同变现受公共采购约束，价格靠竞争性竞标而非软件标价决定。一站式定价把司机工资、车辆资本成本、车场间接费用和家长实时追踪应用打包进学区全包费率。客户活动从学区 RFP
              授标转为日常线路运营，产生经常性市政收入；但经营利润率高度依赖可变路线执行成本、司机可得性和车队维护。为改善 SFUSD、Oakland 等电动化学区的项目经济性，Zum 使用 EPA Clean School
