      - number: '4.4'
        title: Capital Adequacy, Financing Commitments, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Zum's capital structure and balance sheet requirements reflect the intense capital intensity of fleet
              electrification and depot infrastructure construction. In January 2025, the U.S. Department of Energy Loan
              Programs Office announced a conditional commitment for a loan guarantee of up to $705.1 million to
              subsidiary Zum Energy Geo, LLC for Project Marigold. This project financing facility is structured to fund
              battery-electric buses and seventeen bidirectional charging depots across at least thirteen school
              districts in eight states. On the equity side, Zum raised $100 million in April 2026 led by TPG's Rise
              Funds, lifting total private capital raised to $430 million and establishing a $1.7 billion valuation. At
              a 5.1x revenue multiple on $333 million in revenue, Zum trades at a premium that implies imminent margin
              expansion toward public market readiness. However, because cash on hand, operating burn rate, and debt
              service obligations remain undisclosed, financial underwriting requires verifying whether TPG's equity
              provides sufficient runway to achieve operational cash flow breakeven before public listing.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Private Gross Margin Opacity at 5.1x Valuation
            body: >-
              Zum's $1.7 billion private valuation reflects an aggressive 5.1x multiple on unaudited 2025 revenue
              ($333M), yet the company has not published gross margins, unit contribution economics, or cash burn rates.
              In an operationally intensive sector dominated by union labor, driver wage pressure, and vehicle
              depreciation, lack of margin transparency is a primary diligence barrier.
            calloutType: risk
            claimRefs:
              - CI004
              - CI006
              - CI010
              - CI013
          - type: callout
            title: Capital Subsidization via DOE Loan Guarantees and Public Grants
            body: >-
              Zum's transition toward capital-intensive electric fleets relies heavily on external non-dilutive capital
              and loan guarantees, notably the DOE Loan Programs Office conditional commitment of up to $705.1 million
              for Project Marigold and over $35 million in EPA Clean School Bus vouchers, mitigating balance sheet
              exposure for municipal depot electrification.
            calloutType: insight
            claimRefs:
