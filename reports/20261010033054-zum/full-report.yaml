      - number: '3.3'
        title: Contract Models, Pricing Structures, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Student transportation contracts are governed by formal public procurement processes, characterized by
              multi-year request-for-proposal cycles, strict bonding requirements, and high institutional inertia.
              Winning school district business requires submitting competitive bids structured on a per-bus, per-day
              basis or as multi-year fixed-contract commitments that guarantee vehicle availability and driver staffing.
              Once awarded, contracts typically run for three to five years with renewal options, creating substantial
              customer lock-in and predictable revenue visibility that protects incumbents from rapid displacement.
              However, school districts increasingly multi-home across operational categories, carving out specialized
              transportation requirements such as special education and McKinney-Vento homeless student transit for
              smaller van networks like HopSkipDrive while maintaining primary yellow bus contracts. For Zum, achieving
              $333 million in annual revenue and over $2 billion in total contract value demonstrates that its
              integrated model can win whole-district replacements against entrenched regional contractors.
            claimRefs:
              - CP002
              - CP005
              - CP011
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP005
              - CP011
              - CP014
      - number: '3.4'
        title: Moat Durability and Competitive Positioning
        blocks:
          - type: paragraph
            body: >-
              Evaluating moat durability in student transportation requires recognizing that software alone does not
              establish an insurmountable barrier to entry. Fleet capacity, vehicle maintenance depots, and commercial
              driver recruitment pipelines remain the fundamental operational constraints in mass pupil transit. As Zum
              expands its operating footprint across more than 4,000 schools in 15 states, it must navigate the same
              labor dynamics that challenge legacy contractors, including collective bargaining and union negotiations
              such as discussions with Teamsters Local 174 in Seattle. The durability of Zum's competitive moat rests on
              three compounding operational pillars: proprietary route densification algorithms that lower operating
              cost per student, high parent satisfaction scores that build school board renewal support, and proprietary
              depot charging infrastructure that enables vehicle-to-grid power monetization during idle school hours.
              Competitors unable to match this integrated software-fleet-energy ecosystem risk commoditization in major
              metropolitan bid competitions.
            claimRefs:
              - CP006
              - CP008
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP008
              - CP012
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Physical Infrastructure Remains the Primary Defensibility Anchor
            body: >-
              While software-driven route optimization and real-time parent tracking create meaningful customer
              satisfaction advantages, physical fleet capacity, driver recruiting pipelines, and depot infrastructure
              represent the dominant barriers to displacement in municipal student transportation.
            calloutType: insight
            claimRefs:
              - CP002
              - CP008
          - type: callout
            title: Legacy Incumbent Competitive Response and Labor Friction
            body: >-
              Incumbent operators such as First Student have responded to digitization by deploying digital tracking and
              telematics, while ongoing union bargaining and regional driver shortages constrain operational agility
              across all providers.
            calloutType: risk
            claimRefs:
              - CP001
              - CP008
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Public Contract Mechanisms
        blocks:
          - type: paragraph
            body: >-
              Zum generates the vast majority of its revenue through multi-year student transportation service contracts
              awarded by public school district boards following competitive Request for Proposal (RFP) procurement
              cycles. These municipal contracts typically feature three- to five-year terms with renewal options,
              providing high forward revenue visibility backed by statutory educational funding. Under these turnkey
              agreements, Zum provides dedicated vehicle fleets, CDL-certified drivers, fuel or charging infrastructure,
              maintenance, and its proprietary Connected Mobility Experience (CMX) software platform. Rather than
              unbundling software subscription fees, Zum bills districts on a comprehensive operational basis, typically
              structured as fixed annual payments per bus route supplemented by specialized transport adjustments. In
              large urban deployments such as the San Francisco Unified School District (SFUSD), Zum's software-driven
              route consolidation delivered an estimated $3.5 million in annual transportation cost savings,
              representing a 10 percent budget reduction. The overall addressable market comprises approximately $50
              billion in annual public school district transportation expenditures across the United States,
              representing school districts' second-largest operating cost category behind educator salaries.
            claimRefs:
              - CI001
