      - number: '4.3'
        title: Cost Structure, Margin Drivers, and Disclosure Gaps
        blocks:
          - type: paragraph
            body: >-
              Despite rapid top-line growth, Zum's underlying cost structure is dominated by physical service-delivery
              expenses rather than pure software overhead. Direct cost of goods sold primarily comprises driver wages,
              health benefits, vehicle depreciation or lease expense, depot leaseholds, and electricity charging
              infrastructure. Unlike asset-light software businesses, school transportation requires CDL-licensed
              personnel, and Zum maintains an in-house SafeGuard Driver training program with competitive wages and
              guaranteed hours to mitigate chronic industry-wide driver shortages. Crucially, Zum has not published
              audited financial statements, route-level contribution margins, or gross profit figures, leaving investors
              with significant private-metric gaps. Outside financial analysts emphasize that without verified margin
              data, it remains unproven whether Zum's AI dispatch and route optimization generate meaningful operating
              leverage or whether expanding contract commitments require linear operational expenditure growth. The true
              profitability of individual district contracts remains an essential diligence requirement.
