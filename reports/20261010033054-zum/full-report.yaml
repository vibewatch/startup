      - number: '5.2'
        title: Public architecture is functional, not implementation-level
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a four-part operating architecture: user applications and dashboards; routing and
              real-time coordination; driver, yard, and fleet execution; and physical vehicles, charging equipment, and
              utility connections. Zum's own narrative links cloud-based software and AI with mixed vehicle sizes and
              shared regional infrastructure, but it does not disclose algorithms, data models, hosting design,
              interface specifications, or integration patterns. Oakland provides the most concrete physical deployment
              proof in the pool. Zum says the district received 74 electric school buses and bidirectional chargers
              managed through its AI-enabled platform, with a 2.7-megawatt utility load and a projected 2.1
              gigawatt-hours of annual grid return. Those quantities are company-issued operating claims, not
              independent measurements. A September 2026 press listing shows a San Francisco electric-bus rollout, but
              the retained page supplies no fleet count or performance result for that rollout.
