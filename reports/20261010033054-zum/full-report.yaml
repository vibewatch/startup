  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Lens
      - Argument
      - Observed Evidence
      - What Would Change the View
    rows:
      - - Thesis
        - Zum has reached broad operating distribution.
        - Company pages claim 7,500+ schools across 19 states.
        - Independent customer and contract data confirming scope, retention, and concentration.
      - - Thesis
        - The operating system may improve service reliability.
        - Zum defines and reports 98% on-time performance for SY 2025-26.
        - Audited district-level performance cohorts with penalties and exclusions disclosed.
      - - Thesis
        - Route optimization may create measurable customer value.
        - A company-hosted Fresno testimonial reports about $3.5M annual savings and a 10% immediate route reduction.
        - Replicated savings across a representative set of districts and contract vintages.
      - - Anti-thesis
        - Managed transportation may remain labor- and asset-intensive.
        - >-
          Adverse analysis highlights driver, fuel, and depreciation costs while noting missing margin and cash-flow
          disclosure.
        - Audited evidence of falling cost per ride, expanding gross margin, and positive cash conversion.
      - - Anti-thesis
        - Headline valuation may obscure investor-specific economics.
        - Forge lists a 1.3x Series F liquidation-preference multiplier and a 6.0% dividend rate.
        - A complete cap table and waterfall showing common-equivalent proceeds under multiple exits.
    notes: >-
      Company-hosted operating claims and testimonials are not independent benchmarks; requested evidence identifies the
      verification needed.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
  - id: TV003
    title: Bull, Base, and Bear Decision Thresholds
    columns:
      - Case
      - Evidence-Backed Valuation Reference
      - Required Assumptions
      - Probability Signal
      - Downside / Upside Trigger
    rows:
      - - Bull
        - Above the $1.7B April 2026 financing mark only with new evidence
        - Audited margin expansion, positive cash conversion, durable renewals, and limited preference leakage.
        - Not estimable from public evidence
        - Upside requires verified operating leverage and an exit path with common-equivalent proceeds.
      - - Base / watch
        - $1.4B model estimate to $1.7B last-round reference band; not a fair-value range
        - Growth persists, but margin, cash-flow, concentration, and dilution evidence remains incomplete.
        - Uncertain
        - Move the call only after audited economics and a complete capitalization waterfall are reviewed.
      - - Bear
        - Below the $1.4B model estimate; no numeric floor supportable
        - Costs remain structurally high, renewal quality weakens, or new financing embeds greater downside protection.
        - Material but unquantifiable
        - A down round, contract losses, rising cost per ride, or adverse preference outcomes break the thesis.
    notes: >-
      Scenario references are decision thresholds anchored to observed public marks, not forecasts; no probability or
      target return is assigned because key financial and capitalization inputs are unavailable.
    claimRefs:
      - CV001
      - CV006
      - CV007
