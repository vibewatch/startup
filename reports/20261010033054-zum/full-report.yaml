  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Alternative Categories
        blocks:
          - type: paragraph
            body: >-
              The student transportation market spans approximately 500,000 school buses across the United States,
              representing a $50 billion annual expenditure that forms the second-largest cost category for school
              districts after instructional salaries. Within this massive mobility segment, competition divides into
              three primary structural models: large incumbent national contractors, fragmented regional or municipal
              bus operators, and in-house school district transportation departments. First Student represents the
              dominant incumbent contractor across North America, operating tens of thousands of school buses backed by
              extensive physical depot infrastructure, established school board relationships, and commercial fleet
              procurement scale. Smaller regional operators serve localized county or suburban contracts, competing
              primarily on local relationship proximity and low overhead rather than technology investment.
              Additionally, public school districts frequently evaluate whether to maintain status-quo in-house fleets
              or outsource operations, balancing the high capital expenditure of fleet modernization against contractor
              management risks.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
