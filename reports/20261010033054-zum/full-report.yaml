      - number: '5.3'
        title: Integration is visible; technical defensibility remains unproven
        blocks:
          - type: paragraph
            body: >-
              Zum's differentiation claim rests on coordinating software and physical operations across families,
              districts, drivers, fleets, and utilities. The company reports 98% average on-time performance, up to 20%
              fewer commute hours, and up to 25% lower fleet size, but its homepage identifies those figures as
              company-provided results and, for the reduction measures, actual results from one customer. An independent
              AInvest article argues that the missing margin and cash-flow disclosures leave proof of AI-enabled
              operating leverage unresolved; that source is AI-generated and therefore useful as an adverse question,
              not as conclusive technical validation. The retained VCBacked page contains only citation metadata and
              contributes no product corroboration. Public materials describe driver screening, training, monitoring,
              coaching, and ridership verification, yet the pool contains no security or privacy certification,
              penetration-test summary, uptime history, incident record, developer documentation, or external
              performance benchmark. Those omissions constrain conclusions about defensibility, reliability, and trust
              controls.
