      - number: '3.2'
        title: Platform Capabilities and Technology Differentiation
        blocks:
          - type: paragraph
            body: >-
              Unlike traditional yellow bus contractors that historically competed as asset-heavy staffing and vehicle
              leasing providers with minimal digital integration, Zum combines managed physical operations with its
              proprietary Connected Mobility Experience platform. The CMX architecture coordinates real-time dispatch,
              AI-optimized route generation, driver turn-by-turn navigation, and family-facing tracking applications
              that reduce route redundancies and parent uncertainty. Real-world district deployments illustrate that
              algorithmic route optimization can reduce required route counts by up to 10 percent, producing millions of
              dollars in annual transportation operating savings. Incumbents like First Student have responded by
              deploying add-on telematics and third-party tracking portals, but legacy fleet architectures and disparate
              software acquisitions frequently create operational fragmentation. Furthermore, Zum's early integration of
              turnkey vehicle-to-grid electric fleets provides a strategic wedge in metropolitan districts facing
              statutory clean-air mandates and electrification requirements.
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP013
