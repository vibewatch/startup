        title: Commercial Traction and Pricing Dynamics
        blocks:
          - type: paragraph
            body: >-
              Zum reported unaudited 2025 revenue of $333 million, representing 35 percent year-over-year growth as the
              company expanded operations across more than 4,000 schools in 15 to 17 states. Contract monetization
              reflects public procurement constraints, where pricing is determined through competitive bidding rather
              than list software pricing. Turnkey pricing packages driver wages, vehicle capital costs, depot overhead,
              and real-time parent tracking apps into an all-inclusive district rate. As illustrated in the revenue
              model bridge, customer activity converts from initial district RFP contract awards into daily route
              operations, generating recurring municipal revenue. However, operating margins are heavily dependent on
              variable route execution costs, driver availability, and fleet maintenance. To improve project economics
              in electrified districts like SFUSD and Oakland, Zum leverages non-dilutive public subsidies, including
              EPA Clean School Bus program vouchers and utility make-ready investments. Additionally, Zum has begun
              piloting bidirectional Vehicle-to-Grid (V2G) technology, with SFUSD deploying 104 electric buses capable
              of discharging approximately 3 gigawatt-hours of clean power back to local grids annually, establishing an
              emerging secondary revenue mechanism.
