      - number: '1.2'
        title: Executive Leadership, Governance, and Board Architecture
        blocks:
          - type: paragraph
            body: >
              Zum operates under the leadership of Founder and Chief Executive Officer Ritu Narayan, who conceived the
              company around the logistical strain faced by working parents managing daily school commutes. Narayan
              maintains concentrated functional authority over product vision, district partnership strategy, and
              executive hiring. The operational management team also includes Vice President of Communications Jenny
              Mayfield, who coordinates public affairs and contract rollout announcements across new municipal regions.


              Corporate governance is anchored by an active Board of Directors combining early venture capital sponsors,
              institutional growth investors, and private equity partners. Early institutional governance representation
              was established through Bryan Schreier of Sequoia Capital, Nabeel Hyatt of Spark Capital, and Arif
              Lakhani, alongside early leaders Vivek Garg and Abhishek Garg. Following Zum's $100 million Series F
              financing in April 2026, Stephen Ellis, Managing Partner of TPG's Rise Funds, joined Zum's Board of
              Directors. The presence of Tier-1 venture and impact sponsors establishes structured oversight, though
              day-to-day district bidding and capital allocation remain highly dependent on Narayan's leadership and
              strategic vision.
