  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: A managed mobility product with role-specific software
        blocks:
          - type: paragraph
            body: >-
              Zum's customer proposition combines transportation operations with software rather than offering routing
              software in isolation. The company describes CMX as a system that coordinates people, vehicles, and
              operations in real time, while its homepage separately identifies professional drivers, routing, tracking,
              and parent-facing applications as parts of the service. Families can use the parent and student
              application for live location, estimated arrival times, automated updates, ride cancellations, and route
              details; Zum says that interface is available in more than ten languages. District, school, operator, and
              driver surfaces cover route monitoring, exception handling, assignments, student care instructions, and
              ride review. This role-specific workflow coverage is the clearest product strength in the assigned
              evidence. The same evidence does not establish implementation effort, integration breadth, or whether
              software can be purchased independently from managed transportation.
            claimRefs:
