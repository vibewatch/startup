  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: Chronological development of Zum from founding rideshare roots to electric mass student transit platform.
    data:
      items:
        - label: November 2014
          detail: Zum Services, Inc. founded in Redwood City, California by Ritu Narayan to solve school commute challenges.
          tone: neutral
        - label: February 2016
          detail: Closes $2.5 million seed round to pilot child-friendly ridesharing in the San Francisco Bay Area.
          tone: positive
        - label: August 2017
          detail: Raises $5.5 million Series A led by Sequoia Capital to expand school transit software.
          tone: positive
        - label: March 2018
          detail: Secures $19 million Series B led by Spark Capital to transition into comprehensive district contracts.
          tone: positive
        - label: October 2021
          detail: Raises $130 million Series D led by SoftBank Vision Fund 2 at a $930 million valuation.
          tone: positive
        - label: January 2024
          detail: >-
            Achieves unicorn status with $140 million Series E led by GIC at a $1.3 billion valuation; secures initial
            EPA Clean School Bus grants.
          tone: positive
        - label: August 2024
          detail: >-
            Deploys the nation's first 100% electrified bidirectional vehicle-to-grid (V2G) school bus fleet in Oakland,
            California.
          tone: positive
        - label: April 2026
          detail: Raises $100 million Series F from TPG's Rise Funds at a $1.7 billion valuation; Steve Ellis joins board.
          tone: positive
        - label: May 2026
          detail: >-
            Groundbreaking on 104-bus bidirectional electric fleet with SFUSD; wins major Philadelphia School District
            contract.
          tone: positive
        - label: June 2026
          detail: >-
            Financial scrutiny emerges regarding 5.1x revenue multiple and unproven operating margins amidst Rhode
            Island expansion friction.
          tone: negative
