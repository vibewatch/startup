  - id: TV001
    title: Recommendation Summary
    columns:
      - Dimension
      - Assessment
      - Evidence Basis
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - Scale is visible, but audited profitability and cash-flow evidence are absent.
        - Do not underwrite a purchase from the headline private-market mark alone.
      - - Confidence
        - medium
        - >-
          Multiple independent databases corroborate the latest round; operating disclosures remain unaudited or
          company-issued.
        - Increase confidence only after source-reviewed financial and contract data are available.
      - - Risk rating
        - high
        - >-
          Operational intensity, cost exposure, private-share illiquidity, and incomplete capital terms limit downside
          visibility.
        - Require a larger information and price margin of safety than for a disclosed public issuer.
      - - Valuation stance
        - price-sensitive; insufficiently supported at $1.7B
        - The observable anchors are a $1.7B financing mark and a $1.4B third-party model estimate.
        - Treat both as references, not intrinsic-value conclusions.
      - - Return / hold / exit
        - not supportable from public evidence
        - No public S-1, exit timetable, audited cash flow, net debt, or fully diluted ownership data.
        - Defer target-return and hold-period modeling until the diligence gaps close.
    notes: >-
      Assessments use public financing and model anchors; they are not a price target, investment offer, or estimate of
      cash available.
