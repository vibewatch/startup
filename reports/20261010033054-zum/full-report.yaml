chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Platform Architecture
        blocks:
          - type: paragraph
            body: >
              Zum Services, Inc. was founded in November 2014 in Redwood City, California, originally incorporating as a
              child-oriented ridesharing and commute platform before evolving into a turnkey transportation management
              provider for public school districts. Led by Founder and Chief Executive Officer Ritu Narayan, the company
              addresses systemic operational dysfunction across North American student transportation—a $50 billion mass
              transit sector burdened by paper-based routing, opaque driver dispatch, and widespread bus shortages.


              The core product offering is Zum Connected Mobility Experience (CMX), a proprietary operating system that
              integrates real-time GPS tracking, automated dynamic routing, driver dispatch workflows, vehicle
              maintenance monitoring, and bidirectional parent communications into a single interface. By pairing
              algorithmic optimization with physical operations, Zum operates multi-size fleets, electric school buses,
              and contracted district routes. Official district implementations show substantial performance
              improvements over legacy private-operator contracts, including an average 98% on-time arrival rate, up to
              20% to 25% reductions in required bus fleet size, and material cost savings for municipal school budgets.
            claimRefs:
              - CO001
              - CO002
