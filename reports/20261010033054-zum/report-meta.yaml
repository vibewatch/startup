companyProfile:
  summary: >-
    Zum Services, Inc. is a late-stage private student transportation company that combines managed transportation
    operations with its Connected Mobility Experience (CMX) software, parent-facing apps, driver workflows, and an
    expanding electric fleet and bidirectional charging layer. The company says it serves thousands of schools across
    multiple states and has scaled through municipal district contracts, with operating performance and EV deployment
    claims published primarily through its own materials and partner releases.
