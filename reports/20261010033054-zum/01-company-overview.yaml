callouts:
  - calloutType: strength
    title: Proven Municipal District Contract Scale and Retention
    body: Zum has demonstrated durable traction within traditionally conservative public school procurement, securing long-term contracts across more than 4,500 schools and major metropolitan districts including Los Angeles, San Francisco, Seattle, Boston, and Philadelphia while maintaining a 98% on-time record.
    claimRefs:
      - CO002
      - CO008
      - CO010
      - CO015
  - calloutType: risk
    title: Operating Margin Opacity Against Premium Valuation
    body: Zum's $1.7 billion post-money valuation represents a 5.1x multiple on $333 million of unaudited 2025 revenue. The company has not published GAAP margins, operating cash flows, or district-level profitability, leaving unit economics exposed to high driver wages, bus lease debt, and charging infrastructure costs.
    claimRefs:
      - CO011
      - CO014
      - CO016
