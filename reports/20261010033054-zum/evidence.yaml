      New investment brings total funding to $430 million and valuation to $1.7 billion REDWOOD CITY, Calif., April 16,
      2026 — Zūm, the leader in Connected Mobility Experience (CMX™), today announced a $100 million investment from
      TPG, bringing the company’s total funding to $430 million and valuing Zum at $1.7 billion. TPG is making its
      investment through The Rise Funds, the multi-sector strategy of its global impact investing platform, and in
      connection with the investment, Steve Ellis, a Managing Partner of The Rise Funds, will join Zum’s Board of
      Directors.
