    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: margin-structure
    missingEvidence: >-
      Audited district-level gross margins, cost-per-ride unit economics, and software-versus-turnkey fleet service
      revenue breakdown.
