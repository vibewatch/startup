      Without segmented gross-margin disclosures, it is impossible to verify whether Zum's 35% top-line revenue growth
      produces operating leverage or merely scales high-cost driver and vehicle overhead.
    diligencePath: >-
      Review pre-IPO S-1 registration statement disclosures or request audited cohort-level contribution margin data
      from district implementations.
