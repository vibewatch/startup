    keyQuote: >-
      On May 21, 2026, Zūm, a leader in electric student mobility, announced the rollout of an all-electric school bus
      fleet for the San Francisco Unified School District. Powered by Zum’s Connected Mobility Experience (CMX™)
      platform, the initiative combines electric buses, charging infrastructure, intelligent routing, real-time fleet
      operations, and family communication into one integrated transportation system. The deployment will also feature
      bidirectional vehicle-to-grid (V2G) charging technology, making it the largest bidirectional electric school bus
      fleet in the United States.
