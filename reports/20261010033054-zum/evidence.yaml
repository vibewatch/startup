evidenceGaps:
  - type: missing-source
    severity: material
    topic: profitability-and-margins
    missingEvidence: >-
      Audited GAAP income statements, gross profit margin by contract, and operational cash flow figures for FY 2024 and
      FY 2025.
    whyItMatters: >-
      Essential to evaluate whether Zum's 5.1x revenue multiple and $1.7 billion valuation are justified by
      software-like operating leverage or compressed by transportation contractor cost structures.
    diligencePath: Review private financial disclosures or confidential information memorandum (CIM) in a pre-IPO data room.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: executive-and-board-enumeration
    missingEvidence: >-
      Full list of current functional executive officers (CFO, COO, CTO, General Counsel) and comprehensive board
      committee charters.
    whyItMatters: >-
      Establishes complete managerial depth and governance controls beyond the founder and primary institutional
      sponsors.
    diligencePath: Request an updated management organization chart and corporate governance committee roster.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: cap-table-rights
    missingEvidence: >-
      Detailed capitalization table including liquidation preferences and voting rights between common founder shares
      and preferred Series D/E/F investors.
    whyItMatters: >-
      Clarifies downside protection and liquidation watermarks for institutional equity holders if an exit occurs below
      $1.7 billion.
    diligencePath: Request certificate of incorporation amendments and investor rights agreements directly from company counsel.
    relatedQuestionRefs:
