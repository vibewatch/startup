figures:
  - id: FU001
    title: Customer Journey and Operational Adoption Map
    type: journey-map
    summary: Multi-stakeholder progression from municipal procurement through route optimization to daily operational tracking and contract expansion.
    approximationNotes: Workflow stages synthesize standard public school district procurement cycles and documented Zum CMX operational touchpoints.
    claimRefs:
      - CU007
      - CU008
      - CU013
    data:
      items:
        - label: 1. Municipal RFP & Procurement
          detail: School district evaluates mobility proposals, fleet electrification commitments, and software capabilities.
          touchpoints:
            - District RFP tender submission
            - School board public hearings
            - Multi-year master contract execution
        - label: 2. Routing & Fleet Setup
          detail: AI-driven route optimization replaces legacy routes; local driver depot and charging infrastructure established.
          touchpoints:
            - District GIS and student enrollment data ingestion
            - Driver recruitment and SafeGuard background checks
            - EV charging and bus depot facility preparation
        - label: 3. Onboarding & App Activation
          detail: School administrators and parents receive digital platform access and training in 10+ languages.
          touchpoints:
            - Administrator portal setup
            - Parent mobile tracking app download
            - Student RFID / digital bus pass issuance
        - label: 4. Daily Operations & Real-Time Tracking
          detail: Live vehicle tracking, ridership verification, and real-time ETA notifications ensure 98% on-time arrival.
          touchpoints:
            - Morning and afternoon live GPS tracking
            - Automated delay and arrival push notifications
            - In-app attendance and absence management
        - label: 5. Operational Review & Performance Reporting
          detail: District administrators review on-time performance dashboards, fleet utilization, and parent satisfaction scores.
          touchpoints:
            - Monthly KPI dashboards (98% on-time metric)
            - Parent review aggregation (4.9/5 rating)
            - Fleet emissions and fuel savings reporting
        - label: 6. Route Expansion & Fleet Modernization
          detail: Satisfied districts expand route counts, convert additional routes, and transition diesel fleets to electric buses.
          touchpoints:
            - Multi-year contract option exercise
            - Route addition agreements (e.g. Seattle +130 routes)
            - V2G bidirectional charging integration (e.g. SFUSD)
callouts:
  - calloutType: insight
    title: Multi-Stakeholder Wedge Drives High District Switching Costs
    body: Zum converts municipal transportation contracts into entrenched public relationships by providing distinct software surfaces for administrators, drivers, and parents. While the school board funds the contract, the daily app engagement across 1.7 million+ parent reviews creates significant political friction against switching back to opaque legacy bus operators.
    claimRefs:
      - CU001
      - CU007
  - calloutType: risk
    title: Contract Concentration in Municipal Procurement Cycles
    body: Because Zum's revenue relies heavily on flagship urban school districts like Los Angeles, San Francisco, and Seattle, loss or margin compression in any single multi-year tender represents an existential threat to its $1.7 billion valuation multiple, especially given the complete absence of published cohort renewal data.
    claimRefs:
      - CU004
      - CU011
      - CU012
