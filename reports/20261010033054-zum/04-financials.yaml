callouts:
  - calloutType: "risk"
    title: "Private Gross Margin Opacity at 5.1x Valuation"
    body: "Zum's $1.7 billion private valuation reflects an aggressive 5.1x multiple on unaudited 2025 revenue ($333M), yet the company has not published gross margins, unit contribution economics, or cash burn rates. In an operationally intensive sector dominated by union labor, driver wage pressure, and vehicle depreciation, lack of margin transparency is a primary diligence barrier."
    claimRefs:
      - "CI004"
      - "CI006"
      - "CI010"
      - "CI013"
  - calloutType: "insight"
    title: "Capital Subsidization via DOE Loan Guarantees and Public Grants"
    body: "Zum's transition toward capital-intensive electric fleets relies heavily on external non-dilutive capital and loan guarantees, notably the DOE Loan Programs Office conditional commitment of up to $705.1 million for Project Marigold and over $35 million in EPA Clean School Bus vouchers, mitigating balance sheet exposure for municipal depot electrification."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI015"
