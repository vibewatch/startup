callouts:
  - calloutType: "recommendation"
    title: "Public Evidence Does Not Support a Buy"
    body: >-
      The $1.7 billion financing mark is real evidence of an investor-negotiated price,
      not proof of intrinsic value. Require audited unit economics, a fully diluted
      capitalization waterfall, contract cohorts, and exit evidence before setting a
      target return or accepting private-market illiquidity.
    claimRefs:
      - "CV001"
      - "CV008"
      - "CV014"
      - "CV016"
