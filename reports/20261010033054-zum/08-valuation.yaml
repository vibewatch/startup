        - "Audited margin expansion, positive cash conversion, durable renewals, and limited preference leakage."
        - "Not estimable from public evidence"
        - "Upside requires verified operating leverage and an exit path with common-equivalent proceeds."
      - - "Base / watch"
        - "$1.4B model estimate to $1.7B last-round reference band; not a fair-value range"
        - "Growth persists, but margin, cash-flow, concentration, and dilution evidence remains incomplete."
        - "Uncertain"
        - "Move the call only after audited economics and a complete capitalization waterfall are reviewed."
      - - "Bear"
        - "Below the $1.4B model estimate; no numeric floor supportable"
        - "Costs remain structurally high, renewal quality weakens, or new financing embeds greater downside protection."
        - "Material but unquantifiable"
        - "A down round, contract losses, rising cost per ride, or adverse preference outcomes break the thesis."
    notes: "Scenario references are decision thresholds anchored to observed public marks, not forecasts; no probability or target return is assigned because key financial and capitalization inputs are unavailable."
