chapter:
  number: 8
  title: "Valuation"
  summary: "Zum's April 2026 financing established a $1.7 billion private-market mark, while a third-party model estimated $1.4 billion in October 2026. The evidence supports a research-more recommendation: operating scale is visible, but audited margins, cash flow, customer concentration, a complete preference stack, and defensible comparable-company data are not."
sections:
  - id: "recommendation-and-thesis"
    title: "Recommendation, Thesis, and Anti-Thesis"
    body: >-
      The appropriate recommendation is research-more with medium confidence and high
      underwriting risk. The thesis is that Zum has reached meaningful operating scale:
      company pages claim more than 7,500 schools in 19 states, define a 98% on-time
      performance measure for school year 2025-26, and publish a Fresno district
      testimonial reporting about $3.5 million of annual savings after a 10% immediate
      route reduction. The anti-thesis is more consequential for valuation. An adverse
      review reports that Zum has not published detailed margins, free cash flow, or an
      earnings trajectory and describes persistent driver, fuel, and fleet-depreciation
      costs. Those omissions prevent a reliable separation of software economics from
      managed-transportation economics. A high-quality service proposition can support
      growth, but it does not by itself establish operating leverage, cash generation, or
      a price that compensates for execution risk.
    claimRefs:
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV016"
    tableRefs:
      - "TV001"
      - "TV002"
  - id: "financing-and-entry-discipline"
    title: "Financing Context and Entry Discipline"
    body: >-
      The latest disclosed financing anchor is a $100 million Series F in April 2026 at
      a $1.7 billion post-money valuation, with TPG identified as the investor or lead
      across independent databases. That followed the January 2024 Series E, when Zum
      announced $140 million and a $1.3 billion valuation. The resulting 30.8% mark-up is
      observable, but the evidence does not show how much was driven by operating
      performance, security terms, or negotiating conditions. Public databases also
      disagree on cumulative capital raised, reporting $430 million, $439 million, and
      $444.11 million; funding raised should therefore not be treated as cash available.
      Forge lists a 1.3x liquidation-preference multiplier and a 6.0% dividend rate for
      the Series F, but the full cap table, seniority interactions, conversion economics,
      option pool, and debt are unavailable. Entry discipline should be based on
      fully-diluted ownership and waterfall outcomes rather than headline valuation alone.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV014"
    figureRefs:
      - "FV001"
  - id: "valuation-scenarios-and-comparables"
    title: "Valuation Scenarios and Comparable Evidence"
    body: >-
      Two public valuation anchors are available but neither is a complete appraisal. The
      financing mark is $1.7 billion, while QuantLogix published a $1.4 billion model
      estimate on October 10, 2026, 16% below the last round. AInvest combines the
      $1.7 billion mark with company-reported, unaudited 2025 revenue of $333 million to
      describe an approximately 5.1x revenue multiple. That calculation is not an ARR
      multiple, does not establish enterprise value, and cannot be converted into a
      return forecast without net debt, dilution, margins, cash burn, and exit timing.
      The assigned evidence contains funding-round references but no defensible set of
      public-company, private-round, or M&A comparables with normalized business mix and
      profitability. Accordingly, the scenario table uses evidence-backed decision
      thresholds rather than invented target prices or probability percentages.
    claimRefs:
      - "CV001"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-diligence"
    title: "Exit Readiness, Thesis Breaks, and Final Diligence"
    body: >-
      Public exit readiness is unproven. QuantLogix reports that Zum remains private and
      has no public S-1 on file, while Forge says the company has not publicly endorsed
      an IPO plan. That absence is not proof that no confidential preparation exists; it
      means public investors lack prospectus-grade disclosure and an observable listing
      timetable. The recommendation would improve only after audited statements show
      durable contract-level margins, cash conversion, renewal performance, and manageable
      fleet financing, alongside a complete preference waterfall and customer concentration
      schedule. Thesis-break triggers are evidence based: sustained revenue growth without
      improving unit economics, contract losses or renewal weakness, rising cost per ride,
      or a financing below the prior mark after adjusting for security terms. Until those
      questions close, neither a target return nor a hold period can be responsibly
      quantified from public evidence.
    claimRefs:
      - "CV008"
      - "CV009"
      - "CV013"
      - "CV014"
      - "CV016"
