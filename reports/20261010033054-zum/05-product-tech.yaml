chapter:
  number: 5
  title: "Product & Technology"
  summary: "Zum sells a managed student-transportation system rather than a standalone software product: CMX joins family and district interfaces, driver and dispatch workflows, fleet operations, and an emerging EV/V2G layer. Public evidence supports the functional product map and an Oakland deployment, but does not expose APIs, security certifications, service-level history, or independently verified operating leverage."
sections:
  - id: "product-and-workflow"
    title: "A managed mobility product with role-specific software"
    body: >-
      Zum's customer proposition combines transportation operations with software rather than
      offering routing software in isolation. The company describes CMX as a system that
      coordinates people, vehicles, and operations in real time, while its homepage separately
      identifies professional drivers, routing, tracking, and parent-facing applications as parts
      of the service. Families can use the parent and student application for live location,
      estimated arrival times, automated updates, ride cancellations, and route details; Zum says
      that interface is available in more than ten languages. District, school, operator, and
      driver surfaces cover route monitoring, exception handling, assignments, student care
      instructions, and ride review. This role-specific workflow coverage is the clearest product
      strength in the assigned evidence. The same evidence does not establish implementation
      effort, integration breadth, or whether software can be purchased independently from managed
      transportation.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE006"
      - "CE012"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-and-deployment"
    title: "Public architecture is functional, not implementation-level"
    body: >-
      The evidence supports a four-part operating architecture: user applications and dashboards;
      routing and real-time coordination; driver, yard, and fleet execution; and physical vehicles,
      charging equipment, and utility connections. Zum's own narrative links cloud-based software
      and AI with mixed vehicle sizes and shared regional infrastructure, but it does not disclose
      algorithms, data models, hosting design, interface specifications, or integration patterns.
      Oakland provides the most concrete physical deployment proof in the pool. Zum says the
      district received 74 electric school buses and bidirectional chargers managed through its
      AI-enabled platform, with a 2.7-megawatt utility load and a projected 2.1 gigawatt-hours of
      annual grid return. Those quantities are company-issued operating claims, not independent
      measurements. A September 2026 press listing shows a San Francisco electric-bus rollout, but
      the retained page supplies no fleet count or performance result for that rollout.
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE011"
      - "CE013"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "differentiation-and-risk"
    title: "Integration is visible; technical defensibility remains unproven"
    body: >-
      Zum's differentiation claim rests on coordinating software and physical operations across
      families, districts, drivers, fleets, and utilities. The company reports 98% average on-time
      performance, up to 20% fewer commute hours, and up to 25% lower fleet size, but its homepage
      identifies those figures as company-provided results and, for the reduction measures, actual
      results from one customer. An independent AInvest article argues that the missing margin and
      cash-flow disclosures leave proof of AI-enabled operating leverage unresolved; that source is
      AI-generated and therefore useful as an adverse question, not as conclusive technical
      validation. The retained VCBacked page contains only citation metadata and contributes no
      product corroboration. Public materials describe driver screening, training, monitoring,
      coaching, and ridership verification, yet the pool contains no security or privacy
      certification, penetration-test summary, uptime history, incident record, developer
      documentation, or external performance benchmark. Those omissions constrain conclusions
      about defensibility, reliability, and trust controls.
    claimRefs:
      - "CE005"
      - "CE010"
      - "CE014"
      - "CE015"
      - "CE016"
