callouts:
  - calloutType: insight
    title: "Core Differentiator: Unified Multi-Channel Architecture"
    body: Unlike legacy programmatic point solutions that require external systems integration across display, CTV, audio, and DOOH, StackAdapt built an end-to-end orchestration platform with native AI bidding and transaction-level measurement.
    claimRefs:
      - CO002
      - CO009
  - calloutType: risk
    title: Private Disclosure and Agentic Technology Headwinds
    body: StackAdapt operates with significant disclosure opacity regarding audited net margins and capitalization structure, while external evaluators score its current agentic readiness as developing (40/100), highlighting potential exposure as programmatic media transitions toward autonomous agents.
    claimRefs:
      - CO006
      - CO007
