chapter:
  number: 5
  title: "Product & Technology"
  summary: "StackAdapt provides an AI-powered omnichannel demand-side platform spanning programmatic and owned channels, powered by a real-time contextual analysis engine evaluating over 1.2 billion bid requests daily across 50+ exchanges. In 2026, the company expanded beyond traditional media buying with proactive AI workflows including Ivy Studio, a Model Context Protocol (MCP) server for Claude integration, and an early-stage advertising partnership in ChatGPT. Key diligence considerations center on operational spend commitment floors ($15,000 monthly minimums), reporting pipeline dependencies for custom attribution, and private server-side latency economics."
sections:
  - id: "product-scope-workflows"
    title: "Omnichannel Platform Definition and Media Buying Workflows"
    body: "StackAdapt operates as a unified omnichannel demand-side platform (DSP) engineered to plan, execute, and analyze digital advertising campaigns across multiple inventory channels from a single operating console. The platform natively supports connected TV (CTV), digital out-of-home (DOOH), display, native, online video, audio, and email marketing. In mid-2026, StackAdapt expanded this multi-channel execution perimeter by introducing programmatic direct mail in the United States, enabling digital media buyers to trigger personalized physical letters and postcards based on verified online user engagement signals. The platform is packaged across six distinct market tiers—Digital, Basic, Gold, Accelerate, Platinum, and Enterprise—designed to accommodate lean independent media buyers through self-serve workflows while providing dedicated account management, enhanced creative services, and custom reporting configurations for high-volume enterprise organizations."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE005"
      - "CE010"
    tableRefs:
      - "TE001"
  - id: "contextual-ai-engine"
    title: "Contextual AI Decisioning Core and Bidding Infrastructure"
    body: "At the architectural core of StackAdapt's media buying engine is a proprietary real-time contextual analysis pipeline that evaluates over 1.2 billion bid requests daily across more than 50 supply-side platforms and ad exchanges. Rather than depending on third-party cookie graphs or blunt keyword whitelists, the system parses full-page text content, contextual metadata, and behavioral intent signals in real time to establish ad placement relevance. Independent empirical testing conducted across 847 campaigns demonstrated that this contextual bidding infrastructure achieved cost-per-click rates between $0.12 and $0.31 in competitive finance and wellness verticals, alongside video completion rates averaging 87% across premium CTV placements. Media buying operations also benefit from streamlined campaign configuration interfaces, reducing full multi-channel setup duration from approximately 45 minutes on legacy DSP architectures to under 12 minutes through unified drag-and-drop audience layering."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE011"
      - "CE014"
    tableRefs:
      - "TE002"
  - id: "agentic-orchestration-roadmap"
    title: "Agentic Workflows, MCP Integration, and Emerging AI Touchpoints"
    body: "During its Conversion 2026 product summit, StackAdapt unveiled a coordinated shift toward proactive and agentic campaign execution frameworks. The central release, Ivy Studio, upgrades the company's conversational AI assistant into an immersive full-screen workspace where marketers can model reach, execute real-time budget reallocations, and train customized domain 'Skills' directly through natural language. To extend platform intelligence into external corporate environments, StackAdapt published an official Model Context Protocol (MCP) server, allowing external agentic orchestrators such as Anthropic's Claude to query campaign performance, audit creative assets, and trigger pacing adjustments via conversational prompts without manual portal logins. Furthermore, through an early-stage advertising partnership with OpenAI, StackAdapt established exploratory ad placements within ChatGPT conversational discovery sessions, connecting emerging AI research journeys with programmatic attribution and creative delivery."
    claimRefs:
      - "CE002"
      - "CE003"
      - "CE008"
      - "CE009"
      - "CE013"
    figureRefs:
      - "FE001"
  - id: "technical-dependencies-limitations"
    title: "Architecture Dependencies, Integration Constraints, and Diligence Blockers"
    body: "Despite its rapid feature velocity and modern user experience, StackAdapt exhibits clear architectural dependencies and operational tradeoffs that institutional underwriters must evaluate. The real-time bidding infrastructure relies fundamentally on uninterrupted external exchange connectivity and standardized OpenRTB communication protocols across 50+ SSP partners. Operational access remains restricted by significant spending floors, with third-party platform audits documenting minimum monthly commitments starting at $15,000 for self-serve accounts and reaching $50,000 for managed media campaigns. Furthermore, while the platform provides intuitive UI dashboards and attribution path modeling, advanced enterprise data exports and custom attribution models remain constrained without dedicated API pipeline engineering. Finally, StackAdapt has not publicly disclosed server-side latency telemetry, bidder infrastructure cluster sizing, or cloud hosting cost breakdowns, leaving unit-level processing efficiency unverified."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE003"
