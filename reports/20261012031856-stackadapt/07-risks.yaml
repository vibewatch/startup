    title: "Default IVT Filtering Creates Hidden Margin Drag for Media Buyers"
    body: "StackAdapt's open-exchange native inventory exhibits bot-flagged impression ratios between 8% and 14% prior to enabling pre-bid filtering. Because pre-bid protection requires an explicit line-item opt-in and incurs an incremental fee of $0.15 to $0.40 CPM, uninformed or cost-sensitive operators face severe margin erosion or brand safety risks."
    claimRefs:
      - "CR001"
      - "CR002"
  - calloutType: "insight"
    title: "Multi-SSP Supply Path Redundancy Buffers Sell-Side Platform Risk"
    body: "Unlike walled gardens, StackAdapt integrates with multiple major SSPs including Magnite, Index Exchange, OpenX, and PubMatic, and maintains published sellers.json files. This multi-vendor topology prevents single-supplier auction capture, although domain transparency remains uneven on aggregated native bundles."
    claimRefs:
      - "CR005"
      - "CR012"
