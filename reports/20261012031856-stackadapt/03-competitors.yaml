callouts:
  - calloutType: insight
    title: Convergence of Adtech and Martech as a Structural Differentiator
    body: >-
      StackAdapt's transition from a pure-play DSP to an integrated marketing platform that unifies programmatic media
      buying with native email automation and first-party Data Hub orchestration provides a unique operational
      efficiency advantage over point-solution DSPs that require disparate third-party CDP and ESP integrations.
    claimRefs:
      - CP003
      - CP004
  - calloutType: risk
    title: Mid-Market Moat Vulnerability to Enterprise DSP Downmarket Expansion
    body: >-
      While StackAdapt benefits from low entry barriers and superior mid-market customer satisfaction, the platform
      faces ongoing displacement risks if enterprise incumbents like The Trade Desk lower minimum commitments or if
      walled-garden platforms enhance direct programmatic access.
    claimRefs:
      - CP002
      - CP013
      - CP014
