  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Platform
      - Pricing Model
      - Minimum Spend / Commitment
      - Included Capabilities
      - Discounts & Unknowns
      - Strategic Implication
    rows:
      - - StackAdapt
        - Usage-based media markup (dynamic CPM/CPC)
        - None for self-serve; custom tiers for enterprise
        - Full omnichannel DSP, Academy access, Data Hub
        - Tiered support access; managed services require custom spend
        - Low barrier to entry attracts fast-growing mid-market spend
      - - The Trade Desk
        - Tech fee markup on media spend (typically 15-20%)
        - High monthly minimums (often $20,000+/mo)
        - Enterprise DSP access, Kokai AI, premium marketplace
        - Volume rebates for agency holding companies undisclosed
        - Prohibitive for SMB/mid-market without agency representation
      - - Basis Technologies
        - SaaS platform fee plus media percentage
        - Annual agency contract commitment
        - Media planning, search/social buying, DSP orchestration
        - Software licensing fees separate from media spend
        - Optimized for agencies wanting single-pane-of-glass operations
      - - Simpli.fi
        - Dynamic CPM with localized margin markup
        - Moderate minimums depending on direct vs agency tier
        - Household geofencing, multi-location campaign setup
        - Inventory quality markups and data cost pass-throughs
        - Cost-effective for multi-unit local retail but margin-opaque
      - - Viant Technology
        - Dynamic CPM with tech fee or managed markup
        - Annual commitment for enterprise self-serve tier
        - Household ID graph, CTV buying, closed-loop attribution
        - Higher average CPMs compared to standard mid-market DSPs
        - Suited for brands prioritizing identity resolution over low cost
      - - Vibe.co
        - Transparent CPM / CPV model starting at $0.02/view
        - Zero minimum spend; self-serve credit card billing
        - Self-serve CTV campaign builder and real-time reporting
        - Limited inventory tiers compared to open-internet exchanges
        - Ideal entry ramp for performance brands testing connected TV
