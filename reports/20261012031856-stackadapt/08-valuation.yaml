- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar / Dimension
  - Core Investment Thesis
  - Anti-Thesis Counterpoint
  - What Would Change The View
  rows:
  - - Platform Scale & Positioning
    - Rapidly scaling multi-channel demand-side platform with self-serve and enterprise access across 19 markets.
    - Intense competition from scaled adtech incumbents and platform walled gardens capping fee take-rates.
    - Documented net revenue retention exceeding 115% across recurring brand and agency accounts.
  - - Product & AI Innovation
    - Unified programmatic workflow integrating CTV, DOOH, display, and proactive AI campaign tools.
    - Generic AI features face swift competitive commoditization across rival programmatic buying tools.
    - Independent evidence demonstrating superior client return on ad spend and durable pricing power.
  - - Financing & Investor Base
    - Backed by tier-1 institutional capital including Teachers' Venture Growth and Summit Partners.
    - Substantial secondary liquidity in the 2025 financing round signals potential insider de-risking.
    - Full cap table verification demonstrating equal-ranking equity terms and limited preference overhang.
  - - Valuation & Multiple Headroom
    - $2.5B valuation supported by $500M+ total investment and large-scale global workforce.
    - 5.0x revenue multiple leaves no safety buffer against multiple compression in a slowing ad market.
    - Multiple contraction toward 3.5x revenue or audited validation of sustainable net profit margins.
  notes: Comparative assessment of primary bull thesis drivers versus adverse market structure and valuation counterpoints.
