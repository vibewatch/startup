callouts:
- calloutType: recommendation
  title: 'Underwriting Stance: Maintain Track Posture'
  body: "StackAdapt demonstrates impressive operational scale with over 1,300 employees and a sophisticated multi-channel\
    \ DSP platform. However, the reported $2.5B valuation mark from its February 2025 round\u2014which included substantial\
    \ secondary liquidity\u2014prices the business at approximately 5.0x estimated revenue run rate without audited confirmation\
    \ of profitability or retention. We recommend a disciplined 'track' stance pending audited financial disclosure."
  claimRefs:
  - CV001
  - CV002
  - CV005
  - CV006
  - CV007
  - CV014
- calloutType: risk
  title: 'Key Valuation Friction: Secondary Liquidity and Multiple Overhang'
  body: The substantial secondary component in the 2025 growth round, combined with compressed public adtech trading multiples,
    leaves little room for valuation expansion. In a demand contraction, multiple compression to public peer levels would
    imply downside toward $1.6B.
  claimRefs:
  - CV002
  - CV006
  - CV007
  - CV008
  - CV013
