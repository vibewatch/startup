      whyItMatters: Survey optimism may overstate operational maturity, concealing whether mid-market buyers genuinely orchestrate cross-channel journeys or simply run isolated campaigns.
      diligencePath: Commission blind buyer interviews assessing multi-touch attribution usage, frequency capping enforcement across CTV and display, and martech integration depth.
