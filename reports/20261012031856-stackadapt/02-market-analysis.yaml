callouts:
  - calloutType: insight
    title: The Fragmentation Tax in Programmatic Buying
    body: Programmatic execution across disconnected point tools creates substantial margin drag. With two-thirds of marketers estimating that up to 30% of media budgets are lost to siloed systems, the economic incentive has swung decisively from best-of-breed tool accumulation toward consolidated operating platforms that unite bid decisioning, creative generation, and cross-channel attribution.
    claimRefs:
      - CM003
      - CM004
  - calloutType: risk
    title: The Omnichannel Execution Bottleneck
    body: While 75% of enterprise marketers report running omnichannel campaigns, the overwhelming majority remain constrained by fragmented workflows and delayed post-campaign reporting. Platforms that fail to provide real-time, closed-loop attribution across CTV, programmatic, and owned channels risk seeing client budgets revert to walled gardens.
    claimRefs:
      - CM002
      - CM010
