chapter:
  number: 6
  title: "Customers"
  summary: >-
    StackAdapt addresses buyers from self-serve independent marketers through global
    enterprises, with packaging that adds managed support, analytics, and orchestration as
    customer complexity rises. Public evidence shows broad campaign usage and several strong
    named outcomes, but it does not disclose a verified customer count, portfolio retention,
    contract duration, or revenue concentration.
sections:
  - id: "segments-and-buying-models"
    title: "Segments and Buying Models"
    body: >-
      StackAdapt's customer architecture is broader than a single enterprise-DSP motion. Its
      current plans page describes five profiles, beginning with independent marketers and lean
      organizations and ending with global enterprises requiring tailored planning, execution,
      measurement, and service. Platform access can be self-serve or managed, while support,
      reporting, training, orchestration, and payment terms deepen by package. The product itself
      spans programmatic and owned channels, including CTV, DOOH, display, native, audio, video,
      and email. This creates a plausible entry-to-expansion path: a customer can begin with
      controlled self-service and add service or orchestration as its channels and operating
      complexity increase. The evidence establishes intended segmentation and packaging, not the
      number, spend, or retention of customers in each tier.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: "adoption-and-usage-signals"
    title: "Adoption and Usage Signals"
    body: >-
      StackAdapt's 2026 research provides useful product-usage signals but should not be read as a
      customer census. The report paired a survey of 484 senior marketers with platform data from
      a global sample of more than 6,000 advertisers; neither denominator is defined as paying,
      active customer accounts. Within the vendor's platform data, first-party attribution usage
      grew threefold year over year, Snowflake integrations doubled, and SMBs represented 76% of
      cross-channel-attribution users. Reported DCO benchmarks were also favorable, with 32%
      higher click-through rates and 56% lower cost per click than the cited comparison. These
      signals support adoption and expansion potential around measurement and creative tooling,
      but missing baselines, account counts, spend weighting, cohort construction, and
      methodology prevent conversion into revenue durability or market-share conclusions.
    claimRefs:
      - CU001
      - CU002
      - CU008
      - CU009
      - CU010
      - CU011
    tableRefs:
      - TU002
  - id: "named-customer-proof"
    title: "Named Customer Proof"
    body: >-
      The strongest public proof consists of discrete campaign case studies rather than
      customer-level longitudinal reporting. StackAdapt reports a 43% brand-consideration lift for
      Hyatt Asia Pacific, a 60% click-through-rate lift for Global Industrial, and a 22% retention
      boost for Viceroy. Separately, Cuspera reports that White Spider Media reached 1.3 million
      users for a B2B gaming-developer campaign. These cases span travel, industrial commerce,
      luxury, and agency-led B2B execution, supporting genuine use-case breadth. They remain
      selected success stories: the sources do not disclose contract values, control groups for
      every outcome, renewal behavior, deployment duration, or whether the campaigns expanded
      into durable account-wide commitments. The results therefore validate capability and
      reference quality more strongly than recurring revenue quality.
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU015
    tableRefs:
      - TU003
  - id: "durability-expansion-and-concentration"
    title: "Durability, Expansion, and Concentration"
    body: >-
      Expansion is supported qualitatively by packaging and by StackAdapt's current agency-channel
      effort. A company-issued job posting seeks adoption across Publicis, WPP, and Havas
      Programmatic Centers of Excellence, with progress tracked through engagement, platform
      usage, campaign activation, and influenced opportunities. That motion can unlock many brand
      accounts through a few institutional relationships, but the public record does not quantify
      agency, brand, or top-customer revenue concentration. Durability is similarly unresolved:
      the Viceroy case includes a campaign-level retention lift, but that is not StackAdapt's NRR,
      GRR, churn, renewal, or contract-term evidence. An independent PPC Land analysis adds
      adoption friction, reporting that only 6% of surveyed marketers almost always act on
      in-platform AI recommendations. Underwriting should therefore treat land-and-expand as a
      credible mechanism whose portfolio economics still require private cohort and concentration
      data.
    claimRefs:
      - CU006
      - CU007
      - CU014
      - CU016
