  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: "retention-durability"
      missingEvidence: >-
        StackAdapt NRR, GRR, logo churn, renewal rate, contract duration, and cohort expansion
        separated by package, agency, and direct-brand customer.
      whyItMatters: >-
        A customer campaign's retention lift cannot establish the platform vendor's own recurring
        revenue durability or the quality of land-and-expand economics.
      diligencePath: >-
        Request audited quarterly cohort schedules, renewal files, and contract-term distributions
        for at least the latest three fiscal years.
      relatedQuestionRefs:
        - QU004
    - type: private-evidence-only
      severity: material
      topic: "customer-concentration"
      missingEvidence: >-
        Revenue and gross-profit concentration by top customer, brand, agency, holding company,
        geography, vertical, and channel.
      whyItMatters: >-
        Agency Centers of Excellence can create efficient distribution while also concentrating
        procurement leverage and media-spend exposure in a small number of relationships.
      diligencePath: >-
        Obtain top-10 and top-25 customer schedules, agency-to-brand mappings, media-spend
        commitments, and sensitivity to loss of each major holding-company relationship.
      relatedQuestionRefs:
        - QU009
    - type: missing-source
      severity: material
      topic: "adoption-denominators"
      missingEvidence: >-
        Absolute active-account counts, feature-user cohorts, baseline metric values, spend
        weighting, and methodology for the reported platform adoption and performance benchmarks.
      whyItMatters: >-
        Relative growth and lift metrics cannot be translated into customer growth, revenue
        expansion, or representative performance without their denominators.
      diligencePath: >-
        Request metric definitions, cohort extracts, baseline values, sample sizes, and independent
        validation for each platform benchmark.
      relatedQuestionRefs:
        - QU002
      relatedTableRefs:
        - TU002
    - type: enumeration-incomplete
      severity: material
      topic: "named-customer-proof"
      missingEvidence: >-
        A complete named-customer deployment roster with start date, production status, contract
        value, spend, renewal, and externally validated outcome methodology.
      whyItMatters: >-
        Selected successful cases demonstrate capability but cannot establish deployment success
        rates, median outcomes, or customer durability across the full account base.
      diligencePath: >-
        Reconcile the public reference set to an anonymized customer master and independently
        confirm a stratified sample of agency, brand, SMB, and enterprise accounts.
      relatedQuestionRefs:
        - QU003
        - QU007
      relatedTableRefs:
        - TU003
