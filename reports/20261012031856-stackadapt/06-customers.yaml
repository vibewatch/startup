callouts:
  - calloutType: risk
    title: "Platform Sample Is Not a Customer Count"
    body: >-
      The 6,000-plus figure is explicitly a global advertiser sample used in platform analysis.
      Without an active-account definition, it should not be presented as StackAdapt's current
      paying-customer total.
    claimRefs:
      - CU001
      - CU002
  - calloutType: recommendation
    title: "Underwrite Retention With Private Cohort Data"
    body: >-
      A 22% retention boost in one advertiser campaign validates a use case, not StackAdapt's own
      customer durability. Request NRR, GRR, logo churn, contract length, and expansion by package,
      agency, and direct-brand cohort.
    claimRefs:
      - CU014
