chapter:
  number: 4
  title: "Financials"
  summary: "StackAdapt operates a scaled programmatic demand-side platform monetized primarily through media spend take rates, reporting $500 million in 2025 revenue following a $235 million Series B round that valued the business at $2.5 billion. While profitability claims and rapid employee expansion to over 1,400 staff suggest strong commercial momentum, the lack of audited net revenue, gross margin, take rate, and cash-flow disclosures prevents complete underwriting of its underlying unit economics."
sections:
  - id: "revenue-model-and-monetization"
    title: "Revenue Streams and Monetization Structure"
    claimRefs:
      - "CI001"
      - "CI005"
      - "CI006"
      - "CI008"
      - "CI009"
      - "CI014"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
    body: "StackAdapt operates as a multi-channel demand-side platform (DSP) that unifies programmatic advertising across connected TV (CTV), digital out-of-home (DOOH), video, display, native, audio, and email marketing channels. The company's core monetization engine functions on a programmatic media margin structure, capturing platform fees calculated as a percentage of gross advertising spend rather than charging separate software seat licenses or opaque technology markups. In addition to primary media execution margins, StackAdapt generates secondary software revenue through optional premium modules, including advanced CRM integrations, email marketing automation, and dynamic creative optimization suites billed on fixed annual schedules or tiered commitments. Commercial packaging spans three primary delivery tiers: self-serve access for independent performance agencies and lean in-house marketing teams, managed campaign services for brands requiring hands-on tactical execution, and hybrid arrangements that combine automated platform access with strategic account support. Entry-level Digital Basic packages permit flexible credit card settlement, while high-volume Gold, Accelerate, and Enterprise tiers offer standard corporate net terms and negotiated platform commitments. Although the platform claims massive processing scale—delivering 465 billion automated machine learning optimizations per second across global bidstreams—StackAdapt remains privately held and does not disclose its realized average take rate or gross-to-net revenue conversion. Consequently, while third-party press reports indicated an annual revenue run-rate of $500 million in early 2025, underwriting cannot independently verify the proportion of this top line representing true recognized net revenue versus gross media spend under management."
  - id: "gtm-motion-and-channel-economics"
    title: "Go-to-Market Motion and Channel Economics"
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI009"
    tableRefs: []
    figureRefs: []
    body: "StackAdapt's commercial distribution strategy relies on a hybrid go-to-market motion balancing direct agency sales with scaled channel partnerships and developer-friendly onboarding. A key competitive differentiator for StackAdapt in mid-market digital advertising has been its self-serve onboarding velocity, supported by StackAdapt Academy and automated workflow tools that allow regional agencies to configure multi-channel programmatic campaigns without entering multi-year minimum spend locks. To accelerate enterprise penetration without incurring proportional direct sales overhead, StackAdapt actively secures strategic alliances with scaled marketing technology networks and agency holding groups. A prominent example is the company's August 2026 strategic DSP partnership with Ansira, an enterprise brand-to-local marketing platform that oversees more than 500 brands and manages over $7.2 billion in annual marketing spend across franchise and multi-location retail ecosystems. By embedding its demand-side bidding and geolocation attribution technology into Ansira's workflow, StackAdapt captures high-volume programmatic media activation at attractive distribution economics. Furthermore, the company's ongoing expansion into proactive AI marketing tooling—such as Command Center campaign guidance, Ivy Studio conversational workspaces, and unified cross-channel attribution—enhances net customer retention by increasing software stickiness and platform utilization across established agency books."
  - id: "capital-adequacy-and-growth-scale"
    title: "Capital Adequacy and Financial Trajectory"
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI003"
    figureRefs: []
    body: "Since its founding in 2014, StackAdapt has raised over $535 million across four private financing rounds, establishing a substantial balance-sheet cushion that separates it from capital-constrained adtech startups. In 2022, private equity firm Summit Partners led a $300 million minority growth investment, providing foundational expansion capital as the business approached profitability. StackAdapt strengthened this capital structure in February 2025 by securing an additional $235 million minority investment round led by Teachers' Venture Growth (TVG), with participation from Intrepid Growth Partners and existing backers. This financing reportedly established a $2.5 billion post-money equity valuation and coincided with reported annual revenues reaching $500 million, implying an entry revenue multiple of approximately 5.0x. Capital has been deployed aggressively into international expansion and talent acquisition: company disclosures and investor announcements indicate global headcount grew from roughly 700 employees at the time of Summit's entry to more than 1,400 employees by early 2026, while external industry directory datasets tracked 1,839 employees as of September 2026. Financial filings from international subsidiaries offer a rare partial window into regional unit scale: StackAdapt UK Limited reported annual revenues between £10 million and £50 million with 107 staff for the period ending December 2025. Given its multi-hundred-million-dollar funding total and reported operational profitability prior to the 2025 financing, StackAdapt maintains strong capital adequacy with minimal immediate financing dependency or near-term liquidity pressure."
  - id: "financial-verdict-and-underwriting-gaps"
    title: "Financial Verdict and Underwriting Blockers"
    claimRefs:
      - "CI001"
      - "CI012"
      - "CI013"
      - "CI014"
    tableRefs: []
    figureRefs: []
    body: "From an underwriting standpoint, StackAdapt demonstrates the commercial momentum, revenue scale, and institutional backing characteristic of an emerging category leader in independent programmatic advertising. The reported $500 million top-line run-rate, $2.5 billion market valuation, and backing by Tier-1 growth investors such as Summit Partners and Teachers' Venture Growth validate strong market adoption among performance-focused brands and agencies. However, from an investment diligence perspective, significant disclosure deficits preclude formal underwriting. Foremost among these blockers is the complete absence of audited financial statements reconciling gross client media spend with recognized GAAP net revenue, platform take rates, and cash contribution margins. In programmatic advertising, gross revenue reporting can mask underlying gross margin volatility driven by SSP auction dynamics, third-party data licensing costs, and cloud infrastructure expenses. Additionally, external legal scrutiny introduces potential downside variance: in June 2026, a class action titled Rodriguez et al v. StackAdapt was filed challenging the platform's tracking technologies under digital privacy frameworks, while employee litigation in Australia highlighted cross-border compliance challenges. Coupled with strategic dependence on third-party AI foundation models for its latest conversational tools, StackAdapt presents an attractive top-line growth profile that cannot be de-risked without access to private audited financial statements, customer cohort retention data, and contractually realized take rates."
