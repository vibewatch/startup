callouts:
  - calloutType: "risk"
    title: "The Private Financial Disclosure Deficit"
    body: "StackAdapt's reported $500 million revenue and $2.5 billion valuation represent impressive top-line scale, but absence of audited financial statements obscures the exact boundary between gross media billings and recognized net revenue. In digital advertising, take-rate compression or high media cost-of-goods can substantially alter perceived software multiples."
    claimRefs:
      - "CI001"
      - "CI014"
  - calloutType: "insight"
    title: "Operating Leverage via Platform Automation"
    body: "Generating between $270,000 and $355,000 in revenue per employee across 1,400 to 1,800 staff indicates strong operational automation. The company's expansion into higher-margin software orchestration modules provides potential margin expansion beyond commoditized DSP take rates."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI009"
      - "CI011"
