        - 受众可触达性与再营销
        - 高
        - 未认证库存上的受众可触达性下降
        - 高
        - 上下文定向引擎与替代身份合作
        - 高
      - - 对话式 AI 渠道分发与合作伙伴条款
        - OpenAI（ChatGPT 试点）
        - 新兴对话式广告渠道测试
        - 中
        - OpenAI 平台政策变化、广告格式取消或渠道费用上涨
        - 中
        - 在原生广告、CTV 与展示广告之间保持全渠道定位
        - 低
      - - 交易支持的归因数据合作
        - Affinity Solutions
        - 平台内经济影响衡量
        - 中
        - 合同终止、数据访问费重新谈判或面板覆盖衰减
        - 中
        - 多源归因方法与像素跟踪备用方案
        - 低
    notes: 对交易所基础设施、身份图谱和新兴 AI 渠道的合作伙伴依赖。
    claimRefs:
      - CR004
      - CR005
      - CR008
      - CR011
      - CR012
  - id: TV001
    title: 建议汇总表
    columns:
      - 指标 / 维度
      - 评估
      - 估值立场
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 偏高
        - 保持主动监测；在获得经审计的财务证明前，暂缓新增股权配置。
      - - 信心等级
        - 中
        - 合理至溢价
        - 一级投资者联合投资和产品规模提供支持，但未披露的毛利率数据构成制约。
      - - 风险评级
        - 高
        - 下行敏感性
        - 二级股份供给压力与程序化广告支出的周期性带来股权重估风险。
      - - 估值立场
        - 偏高
        - 5.0x 收入运行率
        - 报告中的 $2.5B 投后估值已计入强劲扩张，宏观收缩的容错空间很小。
    notes: 建议综合评估了报告中的 $2.5B 估值标记，并将其与广告技术行业宏观倍数和私募二级市场流动性风险对照。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV014
  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 支柱 / 维度
      - 核心投资论点
      - 反论点
      - 什么会改变判断
    rows:
      - - 平台规模与定位
        - 快速扩张的多渠道需求方平台，在 19 个市场提供自助式和企业级接入。
        - 规模化广告技术巨头与平台封闭生态竞争激烈，限制抽成率。
        - 有记录显示，经常性品牌和代理商账户的净收入留存超过 115%。
      - - 产品与 AI 创新
        - 统一的程序化工作流，整合 CTV、DOOH、展示广告和主动式 AI 活动工具。
        - 通用 AI 功能会在竞争对手的程序化购买工具中迅速商品化。
        - 独立证据证明客户广告支出回报更高，且定价能力持久。
      - - 融资与投资者基础
        - 获得包括 Teachers' Venture Growth 和 Summit Partners 在内的一级机构资本支持。
        - 2025 年融资轮的大量二级流动性，可能意味着内部人正在降低风险。
        - 完整核验股权结构表，证明股权条款同等排序，且优先权悬置有限。
      - - 估值与倍数空间
        - $500M+ 的总投资和大规模全球员工队伍为 $2.5B 估值提供支持。
        - 在广告市场放缓时，5.0x 收入倍数没有应对倍数压缩的安全缓冲。
        - 倍数向 3.5x 收入收缩，或经审计验证净利润率可持续。
    notes: 将主要看多论据驱动因素与不利的市场结构及估值反论点进行对比评估。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 运营假设
      - 隐含估值
      - 主要下行 / 上行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 净收入以 25% 的同比增速加速超过 $650M；企业级 AI 平台分层扩大软件利润率。
        - $3.5B (5.4x 远期收入)
        - 企业在国际市场成功采用，数字媒体预算保持韧性。
        - 25%（需要广告技术宏观环境持续扩张，且软件增购成功）
      - - 基准情景
        - 收入运行率维持在约 $500M，增速稳定在 15%；当前抽成率和毛利率保持稳定。
        - $2.5B (5.0x 收入运行率)
        - 代理商持续续约保持稳定，但二级流动性悬置阻碍倍数扩张。
        - 50%（反映当前市场运营基础和已建立的代理商关系）
      - - 悲观情景
        - 程序化广告预算收缩；代理商客户流失上升；倍数向上市同业水平压缩。
        - $1.6B (3.2x 收入运行率)
        - 广告业全面收缩、竞争对手侵蚀费用，以及降价轮融资的二级市场压力。
        - 25%（若上市广告技术同业倍数进一步收缩，风险显著）
    notes: 投资判断情景分析模拟了估值对增长速度、利润率假设和倍数收缩的敏感性。
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV008
      - CV013
