      - number: '4.4'
        title: 财务结论与投资评估障碍
        blocks:
          - type: paragraph
            body: >-
              从投资评估角度看，StackAdapt 展现出独立程序化广告领域新兴品类领导者常见的商业动能、收入规模和机构支持。报告中的 $500m 收入运行率、$2.5b 市场估值，以及 Summit Partners 和
              Teachers' Venture Growth
              等一级成长投资者的支持，都验证了效果导向品牌和代理商对市场的强劲采用。不过，投资尽调仍因重大披露缺口无法正式完成评估。首要障碍是完全缺少经审计财务报表，无法把客户媒体总支出与确认的 GAAP
              净收入、平台抽成率和现金贡献利润率对账。在程序化广告中，毛收入报告可能掩盖由 SSP 竞价动态、第三方数据许可成本和云基础设施支出造成的底层毛利率波动。此外，外部法律审查带来潜在下行差异：2026 年 6
              月，Rodriguez et al v. StackAdapt 集体诉讼提起，依据数字隐私框架质疑平台追踪技术；澳大利亚员工诉讼也凸显跨境合规挑战。再加上最新对话式工具对第三方 AI
              基础模型的战略依赖，StackAdapt 的收入增长画像颇具吸引力，但若无法取得私人经审计财务报表、客户群留存数据和合同约定的实际抽成率，就无法降低风险。
