              - CU015
      - number: '6.4'
        title: 持久性、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              产品包装和 StackAdapt 当前的代理商渠道动作，为扩张提供定性支持。一则公司发布的招聘信息寻求推动 Publicis、WPP 和 Havas 的 Programmatic Centers of
              Excellence
              采用平台，并通过互动、平台使用、活动激活和受影响商机跟踪进展。这一动作可以通过少数机构关系解锁大量品牌账户，但公开记录没有量化代理商、品牌或头部客户收入集中度。持久性同样未解决：Viceroy
              案例包含活动层面的留存提升，但这不是 StackAdapt 自身的 NRR、GRR、客户流失、续约或合同期限证据。独立媒体 PPC Land 还报告了采用摩擦：受访营销人员中几乎总会采纳平台内 AI 建议的仅
              6%。因此，投资评估应将 land-and-expand 视为可信机制，但其组合经济性仍需私人客户群和集中度数据验证。
            claimRefs:
              - CU006
              - CU007
              - CU014
              - CU016
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 平台样本不是客户数量
            body: 6,000 多人的数字明确是平台分析使用的全球广告主样本。由于没有活跃账户定义，不应把它呈现为 StackAdapt 当前付费客户总数。
