      - number: '7.5'
        title: 缓释措施、监测触发器与止损标准
        blocks:
          - type: paragraph
            body: >-
              缓释 StackAdapt
              核心运营和依赖风险，需要持续验证出价前反欺诈过滤器、合同条款和报告准确性。营销人员与投资评估者必须监测关键运营阈值，包括开放交易所机器人比例、支持工单升级周转时间，以及在非点击互动带来大量转化时的归因准确性。明确的投资论点破坏触发器包括：出价前
              IVT 控制系统性失效并造成买方大范围追回款项；主要 SSP
              联盟突然终止合同或惩罚性重新定价；以及中端代理商客户因客户支持恶化未获解决而严重流失。全面尽调必须要求披露头部代理商账户的收入集中度，并提供经验证的净留存指标。
            claimRefs:
              - CR002
              - CR003
              - CR009
              - CR014
      - number: '7.6'
        title: 展示项
        blocks:
          - type: callout
            title: 默认 IVT 过滤为媒体买家制造隐性利润拖累
            body: >-
              在启用竞价前过滤之前，StackAdapt 的开放交易所原生广告库存中，被机器人标记的曝光比例为 8% 至 14%。竞价前保护需要明确勾选单独的行项目，并额外收取每千次曝光 $0.15 至 $0.40
              的费用；不了解这一点或对成本敏感的运营者，可能面临严重的利润率侵蚀或品牌安全风险。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 多 SSP 供应路径冗余缓冲卖方平台风险
            body: >-
              与封闭生态不同，StackAdapt 接入 Magnite、Index Exchange、OpenX 和 PubMatic 等多家主要 SSP，并持续发布 sellers.json
              文件。这种多供应商架构避免了单一供应商捕获竞价，但聚合原生广告包的域名透明度仍不均衡。
            calloutType: insight
            claimRefs:
