            body: 某个广告主活动中 22% 的留存提升证明了一个使用场景，而不是 StackAdapt 自身的客户持久性。应索取按套餐、代理商和直营品牌客户群拆分的 NRR、GRR、客户标识流失、合同期限和扩张数据。
