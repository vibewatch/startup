    title: 公司里程碑时间线
    type: timeline
    summary: StackAdapt 从基础 DSP 启动到全渠道 AI 编排平台的按时间顺序发展历程。
    data:
      items:
        - date: '2014'
          label: 在多伦多成立
          detail: Vitaly Pecherskiy、Ildar Shar 和 Yang Han 在安大略省多伦多创立 StackAdapt。
          tone: positive
          claimRefs:
