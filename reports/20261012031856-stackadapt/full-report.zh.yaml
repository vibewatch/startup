  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 通过提供统一的 AI
              驱动需求方平台，连接媒体执行与营销编排，已在程序化广告领域占据有吸引力的位置。看多逻辑的核心在于，公司覆盖联网电视、数字户外、原生广告、展示广告、音频和电子邮件等多个渠道，让现代营销人员能把割裂的采买流程收拢到一个界面中。公司还获得了
              Teachers' Venture Growth、Summit Partners 等一线投资机构的持续支持，并将全球员工规模扩展到 19 个市场、超过 1,300
              人。不过，反论点也指出了几项关键的结构性脆弱点。需求方平台竞争依然激烈，主导市场的封闭生态和其他独立 DSP
              都在积极争夺媒体预算。此外，数字广告支出天然具有周期性，宏观经济下行时，程序化广告中间商可能遭遇交易量迅速回落。由于 StackAdapt
              此轮成长融资包含相当规模的老股转让，而非纯粹扩充资产负债表，潜在投资者需要在平台创新、潜在股权供给压力与费率压缩之间权衡。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: 资本化与估值背景
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 的融资轨迹在 2025 年 2 月迎来重大拐点：公司获得由 Teachers' Venture Growth 领投的 $235 million 美元成长融资，Intrepid Growth
              Partners 及其他机构投资者跟投。此前 Summit Partners 于 2022 年投资 $300 million 美元，使公司累计募资超过 $500 million 美元。本次交易由 J.P.
              Morgan 和 RBC Capital Markets 提供配售顾问服务，对应的投后估值为 $2.5 billion 美元。按估计约 $500 million 美元的年化收入运行率计算，入场收入倍数约为
              5.0x。相比之下，成熟的上市程序化广告科技可比公司通常以 2.5x 至 4.0x 的压缩收入倍数交易，StackAdapt 的私募估值已属高价。此外，2025
              年融资中显著的老股流动性部分，带来了潜在的优先权悬置与清算顺位复杂性，因此，在追加股权资本之前必须严格执行估值纪律。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV013
      - number: '8.3'
        title: 建议与决策框架
        blocks:
          - type: paragraph
            body: >-
              综合 StackAdapt 的运营势头、产品能力和资本结构，我们的总体建议是“跟踪”，估值判断为“偏高”，风险评级为“高”。StackAdapt
              的运营实力毋庸置疑：公司提供透明的自助式和企业级套餐，能有效服务中型市场代理商及不断扩张的全球品牌。Conversion 2026 上公布的近期平台升级——包括 Command Center、Ivy Studio
              和自动化跨渠道归因等主动式人工智能工具——进一步强化了其竞争差异化。不过，投资决策不能把业务质量与估值价格割裂开来。若按未经调整的 $2.5 billion
              美元估值建立新仓位，就必须计入收入持续加速，同时假设未经验证的毛利率扩张。鉴于历史上存在老股流动性，且尚未披露经审计的净收入，我们的决策框架要求潜在投资者跟踪业绩里程碑，而不是按当前溢价条款投入资本。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
              - CV011
              - CV014
      - number: '8.4'
        title: 退出准备度与尽调重点
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 已具备晚期成长型资产在考虑未来流动性时通常拥有的组织成熟度和银行关系，并聘请了 J.P. Morgan、RBC Capital Markets
              等顶级配售代理。待成长型广告科技的资本市场全面重启后，公司最终进行首次公开募股，或被全球营销云厂商战略收购，都是合理的流动性路径。不过，要成功进入公开市场，必须先建立干净、经审计的财务基准，解决尚未消除的尽调疑问。尽调应聚焦三项主要核验要求。第一，投资者必须查阅经审计财务报表，确认毛利率和净收入确认政策，核实高额平台总账单是否掩盖了较低的按广告花费抽成的软件利润率。第二，尽调需要评估客户群留存、代理商集中度，以及
              Economic Impact Report 等交易支持型衡量方案的持久性。最后，承销方必须检查完整的股权结构表文件，核实清算优先权层级和老股股东权利；如果净留存率跌破
              105%，或费率利润率恶化，就应明确触发论点失效。
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV012
              - CV014
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: “承销立场：维持跟踪姿态”
            body: >-
              StackAdapt 拥有超过 1,300 名员工和成熟的多渠道 DSP 平台，运营规模可观。不过，其 2025 年 2 月融资轮报告的 $2.5B 估值——其中包含大量老股流动性——相当于约 5.0x
              的预计收入运行率，但盈利能力和留存率均未经审计确认。我们建议在经审计财务披露出台前，保持纪律性的“跟踪”姿态。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV014
          - type: callout
            title: “估值摩擦点：老股流动性与倍数悬置”
            body: 2025 年成长融资中较大的老股部分，加上公开市场广告科技公司的交易倍数受到压缩，使估值上行空间很小。若需求收缩，倍数压缩至上市同业水平，意味着下行至 $1.6B。
            calloutType: risk
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV013
