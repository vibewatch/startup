      - number: '7.4'
        title: 生态依赖与市场脆弱性
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 依赖库存供应商、测量合作伙伴和身份提供商等关键上下游生态。在供应侧，平台依赖 Magnite、Index Exchange、OpenX 和 PubMatic
              等供应方平台（SSP）提供竞价流动性。在新兴渠道，StackAdapt 与 OpenAI 合作探索 ChatGPT 广告位，并与 Affinity Solutions 合作进行模型化线下交易归因。然而，第三方
              Cookie 淘汰构成持久的战略挑战：StackAdapt 的身份解析合作关系和联网电视覆盖仍窄于 The Trade Desk
              等机构竞争者。此外，由于原生供应部分依赖聚合商关系，在专业垂直领域，域名层面的透明度可能逐渐变薄。
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR011
              - CR012
