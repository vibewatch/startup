companyProfile:
  summary: >-
    StackAdapt 是一家总部位于多伦多、由 AI 驱动的程序化广告与营销编排平台，成立于 2014 年。公司服务中端市场代理商和品牌，覆盖程序化及自有渠道，主要通过按媒体支出的平台费和服务层级变现。2025—2026
    年，公司凭借 2.35 亿美元成长轮、新 AI 工作流产品以及据报道约 1,839 名员工进一步扩大规模。业务已具备真实运营规模，但私人公司财务不透明、客户集中度未知和股权表复杂，仍限制投资评估的确定性。
