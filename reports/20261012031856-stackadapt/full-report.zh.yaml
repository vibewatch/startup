  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现结构
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 是多渠道需求方平台（DSP），将
              CTV、DOOH、视频、展示广告、原生广告、音频和电子邮件营销的程序化广告整合起来。公司的核心变现引擎采用程序化媒体利润结构，按广告总支出的一定比例收取平台费，而不是另收软件席位费或隐性技术加价。除主要媒体执行利润外，StackAdapt
              还通过可选的高级模块获得次级软件收入，包括高级 CRM
              集成、电子邮件营销自动化和动态创意优化套件，这些模块按固定年度计划或分层承诺计费。商业包装分为三类主要交付层级：面向独立效果代理商和精简内部营销团队的自助接入；面向需要实操执行的品牌的代运营活动服务；以及把自动化平台接入与战略客户支持结合起来的混合安排。入门级
              Digital Basic 套餐支持灵活的信用卡结算；高交易量 Gold、Accelerate 和 Enterprise
              层级则提供标准企业账期和协商的平台承诺。尽管平台声称具备庞大处理规模——在全球出价流中每秒完成 4,650 亿次自动机器学习优化——StackAdapt
              仍是私人公司，没有披露实际平均抽成率或毛收入转净收入的转换比例。因此，尽管第三方媒体报道称公司 2025 年初年收入运行率为 5
              亿美元，投资评估无法独立验证这部分营收中有多少是真正确认的净收入，有多少只是代管毛媒体支出。
