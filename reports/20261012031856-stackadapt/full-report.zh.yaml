  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险架构与严重性层级
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 运营由 AI 驱动的需求方平台，在原生广告、展示广告、联网电视和对话式 AI
              渠道进行高速程序化竞价。公司面临多重运营取舍：平台灵活性和自助可及性，必须与供应链脆弱性、客户支持分层约束及宏观广告周期敏感性平衡。固有风险最集中于程序化供应链卫生，因为开放交易所出价流可能使买方面临无效流量和机器人欺诈。此外，行业范围的
              Cookie 淘汰提高了对稳健身份解析合作伙伴的依赖，也给公司带来相对于机构巨头的竞争风险。总体上，风险管理要求严格的出价前验证，并主动监测外部交易所网络的供应商透明度。
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR010
      - number: '7.2'
        title: 监管、隐私与合规暴露
        blocks:
          - type: paragraph
            body: >-
              程序化广告面临不断加严的全球和州级监管执法体系，限制行为定向和跨站追踪。StackAdapt 作为每日接收数十亿出价请求的
              DSP，处理设备标识符、地理遥测和上下文信号，必须严格遵守欧盟《通用数据保护条例》（GDPR）及美国州级综合隐私法规，包括《加州隐私权法案》（CPRA）。围绕自动竞价透明度、通过 IAB Europe TCF
              v2.2 传递同意，以及 COPPA 下儿童隐私的监管审查不断加码，要求持续的工程监督。StackAdapt 保持独立 DSP
              架构且不拥有专有交易所，因此避免了直接反垄断审查；但围绕敏感定向参数的监管收紧，仍会持续增加合规开销。
            claimRefs:
              - CR001
              - CR005
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR013
      - number: '7.3'
        title: 供应链卫生、IVT 与运营摩擦
        blocks:
          - type: paragraph
            body: >-
              运营尽调揭示了 StackAdapt 自助和中端执行层的具体摩擦。独立审计显示，在启用出价前过滤之前，美国开放交易所的原生库存中被标记为机器人的展示比例为 8%—14%。由于通过 DoubleVerify 或
              IAS 防范出价前无效流量（IVT）默认未启用，且每千次展示另收 $0.15—$0.40
              美元，成本敏感或信息不足的买方会面临明显利润率恶化。此外，客户支持服务水平存在显著分层：企业客户有专属客户管理，而中端运营商报告称，在活动高峰期工单解决周转时间超过 48
              小时。管理聚合原生供应线的库存质量仍是关键运营要求。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
          - type: table
            tableRef: TR002
            claimRefs:
