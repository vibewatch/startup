chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立与高管领导
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 由 Vitaly Pecherskiy、Ildar Shar 和 Yang Han 于 2014 年在安大略省多伦多创立，定位为独立的多渠道需求方平台。公司执行团队以联合创始人兼首席执行官
              Vitaly Pecherskiy 为核心，由其推动全球公司战略和商业市场拓展。联合创始人兼首席技术官 Yang Han 负责技术架构与算法创新，统筹机器学习研究、自动出价系统以及平台内 AI
              产品集成。联合创始人 Ildar Shar 在公司早期发展阶段参与奠定广告技术系统；随着运营规模扩大，管理团队已覆盖多项职能的高级负责人，包括广告技术高级副总裁 Michael Shang。StackAdapt
              总部位于多伦多，并已将运营范围扩展至国际市场，在 20 个国家拥有估计 1,001—5,000 名员工。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO009
      - number: '1.2'
        title: 融资历史、估值与运营规模
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 于 2025 年 2 月完成重要机构资本化里程碑，融资 2.35 亿美元成长股权，领投方为 Teachers' Venture Growth，估值据估计超过 20
              亿美元。这是当年广告技术行业规模最大的成长阶段融资之一，推动了公司人工智能开发和国际扩张。商业运营已具备较大规模：加拿大 Best Managed Companies 项目的官方基准参与资料确认公司年收入超过
              5,000 万美元，外部商业情报报告则估算年化收入约 5 亿美元。就平台本身而言，StackAdapt 声称其机器学习出价引擎每秒执行超过 4,650 亿次优化决策，为全球 40,000
              多个品牌和代理商媒体买家提供广告活动执行支持。不过，StackAdapt 仍是未上市的加拿大企业，也没有法定申报披露，因此净收入率、客户群留存和经审计现金流等关键投资评估指标仍属机密。
            claimRefs:
              - CO005
              - CO006
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO013
      - number: '1.3'
        title: 治理架构与利益相关者协同
        blocks:
          - type: paragraph
            body: >-
              公司的治理与所有权架构结合了创始人集中领导和一流机构成长资本支持。Vitaly Pecherskiy、Yang Han 与 Ildar Shar 共同掌握基础股权控制，并确立平台的核心运营原则。2025 年 2
              月 Teachers' Venture Growth 成为主要机构股东后，公司引入了机构董事会监督和更成熟的资本治理，但具体清算优先权与投票契约仍未披露。除股权投资者外，Deloitte Private 和加拿大
              Best Managed Companies 项目的赞助金融机构每年也会评估公司的运营和财务实践。由于 Vitaly Pecherskiy 和 Yang Han 在客户互动及专有 AI
              开发中承担核心角色，关键人员依赖仍处于中等偏高水平；确认性尽调应审阅管理层留任协议和股权归属安排。
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO006
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO006
              - CO014
      - number: '1.4'
        title: 平台演进、产品扩张与战略里程碑
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 自 2014
              年成立以来，已从专业化原生广告平台转型为统一的全渠道广告与营销编排引擎。如今，平台在一个操作界面内整合程序化展示广告、联网电视、原生广告、数字户外、音频、视频、电子邮件和直邮。2026
              年第一季度，Forrester Research 在《Forrester Wave：全渠道广告平台》中将 StackAdapt 评为 Strong
              Performer，理由包括定价透明、总拥有成本低和客户支持响应迅速。2026 年 7 月，公司发布 Economic Impact Report，继续推进产品创新：该平台内测量能力整合 Affinity
              Solutions 覆盖 4 万亿美元消费者支出的交易数据，以支持实时广告支出回报优化。公司按媒体支出比例透明收费，并提供自助、代运营和混合服务层级。然而，NeuronFeed 等新兴第三方评估给
              StackAdapt 的代理式就绪度打出 40/100，表明在自主营销工具不断演进之际，代理驱动执行和标准化开发者 API 仍在发展。
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO010
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO011
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 核心差异化：统一多渠道架构
            body: 与需要在展示广告、CTV、音频和 DOOH 之间接入外部系统的传统程序化单点工具不同，StackAdapt 构建了端到端编排平台，原生支持 AI 出价和交易级测量。
            calloutType: insight
            claimRefs:
              - CO002
              - CO009
          - type: callout
            title: 私有披露与代理式技术逆风
            body: StackAdapt 的经审计净利润率和资本结构信息披露明显不足；外部评估者将其当前代理式就绪度评为发展中（40/100），显示程序化媒体转向自主代理时，公司可能面临暴露风险。
            calloutType: risk
            claimRefs:
              - CO006
              - CO007
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、类别范围与结构边界
        blocks:
          - type: paragraph
            body: >-
              程序化需求方平台的可服务市场位于开放网络数字广告、多渠道媒体采买与企业营销编排的交叉点。该类别将独立需求方平台与 Google、Meta、Amazon
              等封闭式围墙花园区分开，为广告主提供透明的多渠道入口，覆盖展示广告、原生广告、视频、联网电视（CTV）、数字户外（DOOH）和音频库存
              [CM001]。市场正经历关键结构转变：聚焦出价调整或单独节奏控制的单点优化工具，正让位于将创意生成、受众定向、媒体投放和归因接入同一运营架构的统一平台 [CM001, CM008]。StackAdapt
              已逐步将运营边界从独立原生广告扩展到全漏斗全渠道执行和集成 martech 工作流，把程序化媒体直接连接到电子邮件营销和 CRM 数据触发器 [CM006]。这一边界扩张覆盖旅游、医疗保健和 B2B
              营销等专业垂直领域；通用横向广告网络难以满足这些领域对受众合规和现实结果测量的不同要求 [CM014]。
            claimRefs:
              - CM001
              - CM006
              - CM008
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
      - number: '2.2'
        title: 市场规模：TAM、SAM 与受限规模视角
        blocks:
          - type: paragraph
            body: >-
              评估 StackAdapt 的市场潜力，需要把宏观数字广告支出与可触达的独立程序化库存结合起来看。全球数字广告支出超过 $800b，但绝大部分仍锁在封闭式围墙花园中；独立程序化 RTB 交易所对应的全球 TAM
              为 $150b—$200b [CM003]。在展示媒体中，随着消费转向移动环境、上下文与信息流广告位缓解横幅广告盲视，原生广告已成为规模超过 $100b+ 且仍在扩张的行业 [CM007]。StackAdapt
              的 SAM 由开放网络独立 DSP 和 martech 编排软件支出构成，估计为 $15b—$25b，CTV 与零售媒体需求快速增长是主要驱动 [CM002, CM011]。按 SOM
              口径，公司瞄准中端市场品牌和独立数字代理商，对应 $3b—$5b 的可触达交易池 [CM009, CM012]。公司技术规模巨大，在全球出价流中每秒处理 465b 次自动出价优化，平台毛交易额运行率超过
              $500m [CM009]。
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM009
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: 买方细分、工作流经济性与预算归属
        blocks:
          - type: paragraph
            body: >-
              程序化广告技术的商业采用分为三类买方，其采购经济性不同：独立代理商、中端市场内部品牌团队和专业企业垂直组织。独立代理商是平台的主要交易量引擎，使用自助或代运营层级执行多客户广告活动，无需承担传统企业 DSP
              强制设置的高额最低支出承诺 [CM005]。定价遵循广告技术行业惯例，主要按代管毛媒体支出的一定比例收取，平台费表透明且不隐藏技术加价
              [CM005]。内部品牌营销团队管理跨渠道获客预算，需要把付费广告执行与自有一方数据资产衔接起来的统一工作流
              [CM005]。此外，旅游局和基于位置的商户等专业垂直买方，越来越需要交易支持的归因方案，将实时媒体投放连接到已验证的支付卡支出和现实客流，而不是数字代理点击 [CM010, CM014]。
            claimRefs:
              - CM005
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM010
              - CM014
      - number: '2.4'
        title: 增长催化剂、AI 编排与结构性市场约束
        blocks:
          - type: paragraph
            body: >-
              CTV 和零售媒体网络快速扩张，以及市场对整合营销技术栈的普遍需求，推动了市场动能
              [CM011]。不过，广告技术生态的结构性采用约束仍很明显。调查数据显示，碎片化税负严重：三分之二的高级营销人员估计，由于工具割裂、执行孤岛和数据管道断开，最多 30% 的程序化预算被浪费
              [CM003]。随后，75% 的营销人员表示在运行全渠道广告活动，但绝大多数缺少统一基础设施和运营工作流，无法在投放过程中利用跨渠道情报 [CM002]。成功整合技术栈并务实部署
              AI、克服这些运营障碍的营销人员，在收入增长和运营效率上胜过同业的可能性高四倍 [CM004]。因此，表现最佳的广告主对超过一半营销技术栈进行改造、消除执行摩擦并释放自主跨渠道编排能力的可能性也高四倍
              [CM013]。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM011
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 程序化采买中的碎片化税负
            body: 在彼此割裂的单点工具上执行程序化投放，会显著拖累利润率。三分之二的营销人员估计媒体预算最多有 30% 损失于孤岛系统，经济激励已明确从堆叠最佳单点工具转向统一运营平台，把出价决策、创意生成和跨渠道归因接在一起。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: 全渠道执行瓶颈
            body: 虽然 75% 的企业营销人员表示在运行全渠道广告活动，但绝大多数仍受制于碎片化工作流和延迟的活动后报告。无法在 CTV、程序化和自有渠道之间提供实时闭环归因的平台，可能看到客户预算回流围墙花园。
            calloutType: risk
            claimRefs:
              - CM002
              - CM010
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与核心竞争者层级
        blocks:
          - type: paragraph
            body: >-
              程序化广告软件市场按目标买方、媒体预算最低额和技术编排复杂度分成不同层级。高端市场的 The Trade Desk、Google Display and Video 360
              等企业需求方平台服务全球大型品牌和代理商控股集团，在开放互联网提供无可匹敌的库存规模，但要求高额月度广告支出，交易界面也更复杂。StackAdapt 直接参与增长迅速的中端市场竞争，对手包括独立全渠道 DSP
              Basis Technologies、Simpli.fi 和 Viant Technology。Basis Technologies 强调跨搜索、社交和程序化采买的代理商工作流自动化；Simpli.fi
              专注于本地化、家庭层级的非结构化数据地理围栏。StackAdapt 则凭借自助易用性、多渠道执行和更高的中端买方满意度实现差异化，同时不强制设置支出门槛。
            claimRefs:
              - CP001
              - CP002
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
      - number: '3.2'
        title: 功能能力与全漏斗 Martech 集成
        blocks:
          - type: paragraph
            body: >-
              程序化媒体采买的一项核心结构性演进，是广告技术媒体激活与 martech
              客户旅程自动化的融合。过去，需求方平台只是孤立的媒体采买引擎，需要另行使用客户数据平台和外部电子邮件服务商才能执行全漏斗营销活动。StackAdapt 发布正式可用的 martech
              套件，打破了这一架构分界：该套件把程序化展示广告、原生广告、视频、联网电视、数字户外和游戏内广告采买，与原生自动电子邮件消息和一方数据接入整合起来。借助 HubSpot、Klaviyo、Braze 和
              Salesforce 等 CRM 与客户平台集成，营销人员可以从单个转化事件触发协调的多渠道互动流程。此外，StackAdapt 参与 ChatGPT
              内广告试点，作为首发技术合作伙伴，快速探索新兴对话式广告格式，使广告主能在用户进行对话式研究和产品比较时触达潜在买家。
            claimRefs:
              - CP003
              - CP007
              - CP009
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP009
      - number: '3.3'
        title: 定价模式、最低支出与包装比较
        blocks:
          - type: paragraph
            body: >-
              程序化广告平台的变现模式决定客户可及性，也决定各供应商能有效守住哪些客户群。企业 DSP 往往收取高额平台技术费，并要求长期年度承诺或每月至少 20,000 美元的严格最低支出；StackAdapt
              则采用易于进入的按使用量计费媒体定价，自助客户最低支出为零。透明的模式让效果代理商、中端市场企业和新兴 DTC 品牌可以在完全灵活的预算下测试渠道，再逐步增加支出。相比之下，Vibe.co
              等专业单点方案以极低门槛提供自助联网电视广告，透明按观看计费，起价每次观看 2 美分，但缺少成熟品牌活动所需的跨设备全渠道格式、数字户外库存和原生 martech 电子邮件能力。
