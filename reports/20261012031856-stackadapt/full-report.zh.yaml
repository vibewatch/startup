      - number: '6.3'
        title: 已命名客户证明
        blocks:
          - type: paragraph
            body: >-
              最强的公开证明是离散的广告活动案例，而不是客户层面的纵向报告。StackAdapt 报告称，Hyatt Asia Pacific 的品牌考虑度提升 43%，Global Industrial 的点击率提升
              60%，Viceroy 的留存提升 22%。此外，Cuspera 报告 White Spider Media 在一项 B2B 游戏开发商活动中触达 130 万用户。这些案例覆盖旅游、工业商业、奢侈品和代理商主导的
              B2B
              执行，支持真实的使用场景广度。但它们仍是精选成功故事：来源没有披露合同金额、每项结果的对照组、续约行为、部署时长，也没有说明活动是否扩展成持久的全账户承诺。因此，这些结果对能力和参考客户质量的验证强于对经常性收入质量的验证。
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU012
              - CU013
