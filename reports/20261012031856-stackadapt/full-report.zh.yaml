      - number: '4.2'
        title: 市场进入动作与渠道经济性
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 的商业分销采用混合市场进入模式，在直接代理商销售、规模化渠道合作和便于开发者使用的入驻之间取得平衡。StackAdapt Academy
              和自动化工作流工具支持自助入驻速度，这是公司在中端数字广告市场的一项关键差异化：区域代理商可以配置多渠道程序化广告活动，不必签下多年最低支出锁定。为在不同比例增加直接销售开支的情况下加快企业渗透，公司积极与大型营销技术网络和代理商控股集团建立战略联盟。一个突出例子是
              2026 年 8 月与 Ansira 达成的战略 DSP 合作；Ansira 是企业品牌到本地营销平台，管理超过 500 个品牌，在特许经营和多门店零售生态中管理超过 72
              亿美元年度营销支出。StackAdapt 将需求方出价和地理位置归因技术嵌入 Ansira 工作流，以有吸引力的分销经济性获得高交易量程序化媒体激活。此外，公司持续扩展主动式 AI 营销工具，如 Command
              Center 活动指导、Ivy Studio 对话式工作空间和统一跨渠道归因，借助提高软件黏性与平台使用率，增强既有代理商客户组合中的净客户留存。
            claimRefs:
              - CI006
              - CI007
              - CI009
      - number: '4.3'
        title: 资本充足性与财务轨迹
        blocks:
          - type: paragraph
            body: >-
              StackAdapt 自 2014 年成立以来已在四轮私人融资中筹资超过 $535m，形成了让其区别于资本受限广告技术初创公司的充足资产负债表缓冲。2022 年，私募股权公司 Summit Partners 领投
              $300m 少数股成长投资，为公司接近盈利时提供基础扩张资本。2025 年 2 月，StackAdapt 由 Teachers' Venture Growth（TVG）领投，获得 $235m
              额外少数股投资，Intrepid Growth Partners 和现有投资者参与，进一步强化资本结构。据报道，这轮融资建立了 $2.5b 投后股权估值，同时公司报告年收入达到 $500m，意味着约 5.0
              倍的入场收入倍数。资本已大举投入国际扩张和人才招聘：公司披露及投资者公告显示，全球员工数从 Summit 入股时约 700 人增至 2026 年初超过 1,400 人；外部行业目录数据则记录截至 2026 年 9
              月有 1,839 名员工。国际子公司的财务申报提供了难得的区域规模窗口：StackAdapt UK Limited 报告截至 2025 年 12 月期间年收入为 £10m—£50m，员工 107
              人。凭借数亿美元级融资总额，以及 2025 年融资前据报道已实现运营盈利，StackAdapt 资本充足，近期融资依赖和短期流动性压力都很低。
