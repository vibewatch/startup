        title: Exhibits
        blocks:
          - type: callout
            title: Contextual ML Scale and Cookie-Independent Targeting
            body: >-
              StackAdapt processes over 1.2 billion bid requests daily across 50+ ad exchanges using real-time
              contextual analysis, offering substantial campaign efficiency gains and cookie-independent audience
              discovery in finance and high-intent verticals.
            calloutType: strength
            claimRefs:
              - CE006
              - CE007
          - type: callout
            title: Enterprise Pricing Commitments and Reporting API Overhead
            body: >-
              Third-party platform evaluations document steep entry thresholds, including minimum monthly commitments of
              $15,000 for self-serve and $50,000 for managed accounts, with granular data export and custom attribution
              requiring dedicated API development.
            calloutType: risk
            claimRefs:
