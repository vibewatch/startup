      - number: '6.2'
        title: Adoption and Usage Signals
        blocks:
          - type: paragraph
            body: >-
              StackAdapt's 2026 research provides useful product-usage signals but should not be read as a customer
              census. The report paired a survey of 484 senior marketers with platform data from a global sample of more
              than 6,000 advertisers; neither denominator is defined as paying, active customer accounts. Within the
              vendor's platform data, first-party attribution usage grew threefold year over year, Snowflake
              integrations doubled, and SMBs represented 76% of cross-channel-attribution users. Reported DCO benchmarks
              were also favorable, with 32% higher click-through rates and 56% lower cost per click than the cited
              comparison. These signals support adoption and expansion potential around measurement and creative
              tooling, but missing baselines, account counts, spend weighting, cohort construction, and methodology
              prevent conversion into revenue durability or market-share conclusions.
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Named Customer Proof
        blocks:
          - type: paragraph
            body: >-
              The strongest public proof consists of discrete campaign case studies rather than customer-level
              longitudinal reporting. StackAdapt reports a 43% brand-consideration lift for Hyatt Asia Pacific, a 60%
              click-through-rate lift for Global Industrial, and a 22% retention boost for Viceroy. Separately, Cuspera
              reports that White Spider Media reached 1.3 million users for a B2B gaming-developer campaign. These cases
              span travel, industrial commerce, luxury, and agency-led B2B execution, supporting genuine use-case
              breadth. They remain selected success stories: the sources do not disclose contract values, control groups
              for every outcome, renewal behavior, deployment duration, or whether the campaigns expanded into durable
              account-wide commitments. The results therefore validate capability and reference quality more strongly
              than recurring revenue quality.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Durability, Expansion, and Concentration
        blocks:
          - type: paragraph
            body: >-
              Expansion is supported qualitatively by packaging and by StackAdapt's current agency-channel effort. A
              company-issued job posting seeks adoption across Publicis, WPP, and Havas Programmatic Centers of
              Excellence, with progress tracked through engagement, platform usage, campaign activation, and influenced
              opportunities. That motion can unlock many brand accounts through a few institutional relationships, but
              the public record does not quantify agency, brand, or top-customer revenue concentration. Durability is
              similarly unresolved: the Viceroy case includes a campaign-level retention lift, but that is not
              StackAdapt's NRR, GRR, churn, renewal, or contract-term evidence. An independent PPC Land analysis adds
              adoption friction, reporting that only 6% of surveyed marketers almost always act on in-platform AI
              recommendations. Underwriting should therefore treat land-and-expand as a credible mechanism whose
              portfolio economics still require private cohort and concentration data.
            claimRefs:
              - CU006
              - CU007
              - CU014
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform Sample Is Not a Customer Count
            body: >-
              The 6,000-plus figure is explicitly a global advertiser sample used in platform analysis. Without an
              active-account definition, it should not be presented as StackAdapt's current paying-customer total.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
          - type: callout
            title: Underwrite Retention With Private Cohort Data
            body: >-
              A 22% retention boost in one advertiser campaign validates a use case, not StackAdapt's own customer
              durability. Request NRR, GRR, logo churn, contract length, and expansion by package, agency, and
              direct-brand cohort.
            calloutType: recommendation
            claimRefs:
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Architecture & Severity Hierarchy
        blocks:
          - type: paragraph
            body: >-
              StackAdapt operates an AI-powered demand-side platform running high-velocity programmatic auctions across
              native, display, connected TV, and conversational AI channels. The company's risk profile reflects a
              multi-faceted operational posture where platform agility and self-serve accessibility are balanced against
              supply-chain vulnerabilities, customer support tiering constraints, and macroeconomic advertising cycle
              sensitivity. Inherent risks cluster most acutely in programmatic supply chain hygiene, where open-exchange
              bidstreams expose buyers to invalid traffic and bot fraud. Furthermore, industry-wide cookie deprecation
              heightens dependence on robust identity resolution partnerships, creating distinct competitive risks
              against institutional giants. Overall risk management requires rigorous pre-bid verification and proactive
              monitoring of supplier transparency across external exchange networks.
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR010
      - number: '7.2'
        title: Regulatory, Privacy & Compliance Exposure
        blocks:
          - type: paragraph
            body: >-
              Programmatic advertising faces an intensifying patchwork of global and state-level regulatory enforcement
              frameworks that constrain behavioral targeting and cross-site tracking. As a DSP ingesting billions of
              daily bid requests containing device identifiers, geographic telemetry, and contextual signals, StackAdapt
              must maintain rigorous compliance with the European Union General Data Protection Regulation (GDPR) and
              comprehensive US state privacy statutes including the California Privacy Rights Act (CPRA). Heightened
              regulatory scrutiny regarding automated auction transparency, consent propagation via IAB Europe TCF v2.2,
              and children's privacy under COPPA demands continuous engineering oversight. While StackAdapt avoids
              direct antitrust scrutiny by maintaining an independent DSP architecture unencumbered by proprietary
              exchange ownership, regulatory tightening around sensitive targeting parameters represents an ongoing
              compliance overhead.
            claimRefs:
              - CR001
              - CR005
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR013
      - number: '7.3'
        title: Supply Chain Hygiene, IVT & Operational Friction
        blocks:
          - type: paragraph
            body: >-
              Operational diligence reveals specific friction points within StackAdapt's self-serve and mid-market
              execution layers. Independent auditing indicates that broad US open-exchange native inventory carries
              bot-flagged impression ratios between 8% and 14% prior to activating pre-bid filtering. Because pre-bid
              invalid traffic (IVT) prevention via DoubleVerify or IAS is not enabled by default and incurs an
              incremental fee of $0.15 to $0.40 CPM, cost-sensitive or uninformed buyers face meaningful margin
              degradation. In addition, customer support service levels exhibit noticeable tiering: while enterprise
              clients receive dedicated account management, mid-market operators report ticket resolution turnaround
              times extending past 48 hours during peak campaign periods. Managing inventory quality on aggregated
              native supply lines remains an essential operational requirement.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
      - number: '7.4'
        title: Ecosystem Dependencies & Market Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              StackAdapt maintains critical upstream and downstream ecosystem dependencies across inventory suppliers,
              measurement partners, and identity providers. On the supply side, the platform relies on external
              supply-side platforms (SSPs) such as Magnite, Index Exchange, OpenX, and PubMatic to deliver auction
              liquidity. In emerging channels, StackAdapt has partnered with OpenAI for exploratory ChatGPT ad
              placements and with Affinity Solutions for modeled offline transaction attribution. However, third-party
              cookie deprecation poses an enduring strategic challenge: StackAdapt's identity resolution partnerships
              and connected TV footprint remain narrower than those of institutional competitors like The Trade Desk.
              Furthermore, because native supply leans partly on aggregator relationships, domain-level transparency can
              thin out across specialized vertical segments.
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR011
              - CR012
      - number: '7.5'
        title: Mitigations, Monitoring Triggers & Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Mitigating StackAdapt's core operational and dependency risks requires continuous validation of pre-bid
              fraud filters, contract terms, and reporting fidelity. Marketers and underwriters must monitor key
              operating thresholds, including open-exchange bot ratios, support ticket escalation turnaround, and
              attribution accuracy where non-click interactions drive significant conversion volume. Clear investment
              thesis-break triggers include any systemic failure of pre-bid IVT controls resulting in widespread buyer
              clawbacks, sudden contractual termination or punitive repricing by major SSP syndicates, or severe client
              attrition among mid-market agencies stemming from unaddressed customer support degradation. Comprehensive
              diligence mandates audited disclosures regarding revenue concentration across top agency accounts and
              verified net retention metrics.
            claimRefs:
              - CR002
              - CR003
              - CR009
              - CR014
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Default IVT Filtering Creates Hidden Margin Drag for Media Buyers
            body: >-
              StackAdapt's open-exchange native inventory exhibits bot-flagged impression ratios between 8% and 14%
              prior to enabling pre-bid filtering. Because pre-bid protection requires an explicit line-item opt-in and
              incurs an incremental fee of $0.15 to $0.40 CPM, uninformed or cost-sensitive operators face severe margin
              erosion or brand safety risks.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Multi-SSP Supply Path Redundancy Buffers Sell-Side Platform Risk
            body: >-
              Unlike walled gardens, StackAdapt integrates with multiple major SSPs including Magnite, Index Exchange,
              OpenX, and PubMatic, and maintains published sellers.json files. This multi-vendor topology prevents
              single-supplier auction capture, although domain transparency remains uneven on aggregated native bundles.
            calloutType: insight
            claimRefs:
              - CR005
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              StackAdapt has established a compelling position in programmatic advertising by offering a unified,
              AI-driven demand-side platform that bridges media execution and marketing orchestration. The bull thesis
              centers on the company's multi-channel reach across connected television, digital out-of-home, native,
              display, audio, and email, enabling modern marketers to consolidate fragmented buying workflows into a
              single interface. Furthermore, StackAdapt has maintained institutional backing from tier-1 investors
              including Teachers' Venture Growth and Summit Partners while scaling its global workforce to over 1,300
              professionals across 19 markets. However, the anti-thesis highlights critical structural vulnerabilities.
              The demand-side platform landscape remains fiercely contested, with dominant walled gardens and competing
              independent DSPs competing aggressively for media budgets. Additionally, digital advertising expenditures
              are inherently cyclical, exposing programmatic intermediaries to rapid volume pullbacks during
              macroeconomic downturns. Because StackAdapt's growth round featured meaningful secondary share liquidity
              rather than pure balance-sheet expansion, prospective investors must weigh platform innovation against
              potential equity overhang and fee compression.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: Capitalization and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              StackAdapt's financing trajectory reached a major inflection point in February 2025 when it secured a $235
              million USD growth financing round led by Teachers' Venture Growth, with participation from Intrepid
              Growth Partners and other institutional backers. This injection followed a $300 million investment by
              Summit Partners in 2022, pushing total lifetime capital raised past $500 million USD. The transaction,
              structured with placement advisory from J.P. Morgan and RBC Capital Markets, established an implied
              post-money valuation mark of $2.5 billion USD. Against an estimated annualized revenue run rate of
              approximately $500 million, this valuation translates to an entry multiple of roughly 5.0x revenue. In the
              context of mature publicly traded programmatic adtech comparables—which frequently trade at compressed
              revenue multiples between 2.5x and 4.0x—StackAdapt's private valuation represents a full price.
              Furthermore, the significant secondary liquidity component of the 2025 financing introduces potential
              preference overhang and liquidation ranking complexities, underscoring the necessity of strict valuation
              discipline before deploying additional equity capital.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV013
      - number: '8.3'
        title: Recommendation and Decision Framework
        blocks:
          - type: paragraph
            body: >-
              Synthesizing StackAdapt's operational momentum, product capabilities, and capital structure leads to an
              overall recommendation of 'track' paired with a 'stretched' valuation stance and a 'high' risk rating.
              StackAdapt demonstrates undeniable operational strength, providing transparent self-serve and enterprise
              packages that cater effectively to mid-market agencies and expanding global brands. Recent platform
              enhancements—including proactive artificial intelligence tools unveiled at Conversion 2026 such as Command
              Center, Ivy Studio, and automated cross-channel attribution—reinforce its competitive differentiation.
              Nevertheless, an investment decision cannot detach business quality from valuation pricing. Underwriting a
              new position at an unadjusted $2.5 billion valuation mark requires pricing in continuous top-line
              acceleration while assuming unverified gross margin expansion. Given the secondary liquidity history and
              the absence of audited net revenue disclosures, our decision framework requires prospective investors to
              track performance milestones rather than committing capital at current premium terms.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
              - CV011
              - CV014
      - number: '8.4'
        title: Exit Readiness and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              StackAdapt possesses the organizational maturity and banking relationships typical of late-stage growth
              assets contemplating eventual liquidity, having engaged premier placement agents including J.P. Morgan and
              RBC Capital Markets. An eventual initial public offering or strategic acquisition by a global marketing
              cloud represents a plausible liquidity pathway once capital markets fully reopen for growth adtech.
              However, successful public market positioning requires establishing clean, audited financial benchmarks
              that resolve lingering diligence questions. Diligence priorities must focus on three primary verification
              requirements. First, investors must inspect audited financial statements to confirm gross profit margins
              and net revenue recognition policies, verifying whether gross platform billing masks lower take-rate
              software margins. Second, diligence must evaluate customer cohort retention, agency concentration, and the
              durability of transaction-backed measurement solutions like the Economic Impact Report. Finally,
              underwriters must examine full cap table documentation to verify liquidation preference stacks and
              secondary shareholder rights, defining a clear thesis-break trigger if net retention drops below 105% or
              if fee margins deteriorate.
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV012
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Underwriting Stance: Maintain Track Posture'
            body: >-
              StackAdapt demonstrates impressive operational scale with over 1,300 employees and a sophisticated
              multi-channel DSP platform. However, the reported $2.5B valuation mark from its February 2025 round—which
              included substantial secondary liquidity—prices the business at approximately 5.0x estimated revenue run
              rate without audited confirmation of profitability or retention. We recommend a disciplined 'track' stance
              pending audited financial disclosure.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV014
          - type: callout
            title: 'Key Valuation Friction: Secondary Liquidity and Multiple Overhang'
            body: >-
              The substantial secondary component in the 2025 growth round, combined with compressed public adtech
              trading multiples, leaves little room for valuation expansion. In a demand contraction, multiple
              compression to public peer levels would imply downside toward $1.6B.
            calloutType: risk
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV013
