chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding, and Executive Leadership
        blocks:
          - type: paragraph
            body: >-
              StackAdapt was founded in 2014 by Vitaly Pecherskiy, Ildar Shar, and Yang Han in Toronto, Ontario,
              positioning itself as an independent, multi-channel demand-side platform. The company's executive
              leadership is anchored by co-founder and Chief Executive Officer Vitaly Pecherskiy, who drives global
              corporate strategy and commercial go-to-market execution. Technical architecture and algorithmic
              innovation are led by co-founder and Chief Technology Officer Yang Han, who oversees machine learning
              research, automated bidding systems, and AI product integration across the platform. While co-founder
              Ildar Shar contributed to foundational adtech systems during early company development, operational
              management has scaled to encompass senior functional leadership, including Michael Shang as Senior Vice
              President of Advertising Technologies. Headquartered in Toronto, StackAdapt has expanded its operational
              footprint internationally, maintaining an active workforce estimated between 1,001 and 5,000 professionals
              across 20 countries.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO009
      - number: '1.2'
        title: Financing History, Valuation, and Operational Scale
        blocks:
          - type: paragraph
            body: >-
              StackAdapt achieved a major institutional capitalization milestone in February 2025, raising a $235
              million growth equity investment round led by Teachers' Venture Growth at an estimated valuation exceeding
              $2 billion. This transaction represented one of the largest growth-stage adtech financings of the year,
              accelerating the company's artificial intelligence development and international expansion. Commercial
              operations demonstrate substantial scale: official benchmark participation in Canada's Best Managed
              Companies program confirms annual corporate revenues exceeding $50 million, while external business
              intelligence reports estimate annualized revenues reaching approximately $500 million. At the platform
              layer, StackAdapt reports that its machine-learning bidding engines execute over 465 billion optimization
              decisions per second, supporting campaign execution for more than 40,000 brands and agency media buyers
              globally. However, because StackAdapt remains a privately held Canadian enterprise without statutory
              filing disclosures, key underwriting metrics including net revenue margins, cohort retention, and audited
              cash flows remain confidential.
            claimRefs:
              - CO005
              - CO006
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO013
      - number: '1.3'
        title: Governance Architecture and Stakeholder Alignment
        blocks:
          - type: paragraph
            body: >-
              The company's governance and ownership architecture reflects a combination of concentrated founder
              leadership and top-tier institutional growth backing. Foundational equity control is distributed among
              founders Vitaly Pecherskiy, Yang Han, and Ildar Shar, who established the platform's core operating
              principles. The entry of Teachers' Venture Growth as a primary institutional stakeholder in February 2025
              introduced institutional board oversight and sophisticated capitalization governance, though specific
              liquidation preferences and voting covenants remain undisclosed. In addition to equity backers, external
              operational and financial practices have been vetted through annual evaluations by Deloitte Private and
              sponsoring financial institutions under Canada's Best Managed Companies program. Key-person dependency
              remains moderately elevated around CEO Vitaly Pecherskiy and CTO Yang Han given their central roles in
              customer engagement and proprietary AI development, underscoring the necessity of reviewing management
              retention agreements and equity vesting schedules during confirmatory diligence.
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO006
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO006
              - CO014
      - number: '1.4'
        title: Platform Trajectory, Product Expansion, and Strategic Milestones
        blocks:
          - type: paragraph
            body: >-
              Since its inception in 2014, StackAdapt has transformed from a specialized native advertising platform
              into a unified omnichannel advertising and marketing orchestration engine. Today, the platform unifies
              programmatic display, connected television, native, digital out-of-home, audio, video, email, and direct
              mail into a single operational interface. In Q1 2026, Forrester Research recognized StackAdapt as a Strong
              Performer in The Forrester Wave for Omnichannel Advertising Platforms, citing transparent pricing, low
              total cost of ownership, and responsive customer support. Product innovation continued in July 2026 with
              the release of the Economic Impact Report, an in-platform measurement capability integrating Affinity
              Solutions transaction data across $4 trillion in consumer spending to enable real-time return-on-ad-spend
              optimization. Monetization follows a transparent percentage-of-media-spend structure with self-serve,
              managed, and hybrid service tiers. Nonetheless, emerging third-party evaluations such as NeuronFeed have
              assigned StackAdapt an agentic readiness score of 40/100, reflecting that agent-driven execution and
              standardized developer APIs remain developing capabilities as autonomous marketing tools evolve.
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO010
