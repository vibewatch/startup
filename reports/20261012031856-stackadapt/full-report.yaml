  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segments and Buying Models
        blocks:
          - type: paragraph
            body: >-
              StackAdapt's customer architecture is broader than a single enterprise-DSP motion. Its current plans page
              describes five profiles, beginning with independent marketers and lean organizations and ending with
              global enterprises requiring tailored planning, execution, measurement, and service. Platform access can
              be self-serve or managed, while support, reporting, training, orchestration, and payment terms deepen by
              package. The product itself spans programmatic and owned channels, including CTV, DOOH, display, native,
              audio, video, and email. This creates a plausible entry-to-expansion path: a customer can begin with
              controlled self-service and add service or orchestration as its channels and operating complexity
              increase. The evidence establishes intended segmentation and packaging, not the number, spend, or
              retention of customers in each tier.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
