  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Category Scope, and Structural Boundaries
        blocks:
          - type: paragraph
            body: >-
              The addressable market for programmatic demand-side platforms sits at the intersection of open-web digital
              advertising, multi-channel media buying, and enterprise marketing orchestration. The category boundary
              separates independent demand-side platforms from closed walled gardens like Google, Meta, and Amazon,
              providing advertisers with transparent, multi-channel access across display, native, video, connected TV
              (CTV), digital out-of-home (DOOH), and audio inventory [CM001]. A critical structural transition is
              underway: point optimization tools focused narrowly on bid shading or isolated pacing are giving way to
              unified platforms that connect creative generation, audience targeting, media delivery, and attribution
              into a single operating architecture [CM001, CM008]. StackAdapt has progressively widened its operational
              footprint from standalone native advertising into full-funnel omnichannel execution and integrated martech
              workflows, connecting programmatic media directly to email marketing and CRM data triggers [CM006]. This
              boundary expansion addresses specialized vertical needs across travel, healthcare, and B2B marketing,
              where generic horizontal ad networks fail to satisfy distinct audience compliance and real-world outcome
              measurement demands [CM014].
            claimRefs:
              - CM001
              - CM006
              - CM008
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Constrained Sizing Lenses'
        blocks:
          - type: paragraph
            body: >-
              Evaluating StackAdapt market potential requires synthesizing macro digital advertising spend against
              addressable independent programmatic inventory. Total global digital ad spend exceeds $800 billion, yet
              the vast majority remains locked inside closed walled gardens; independent programmatic RTB exchanges
              represent an addressable global TAM between $150 billion and $200 billion [CM003]. Within display media,
              native advertising constitutes an expanding $100 billion-plus industry as consumption shifts toward mobile
              environments where contextual and in-feed placements overcome banner blindness [CM007]. StackAdapt
              serviceable addressable market (SAM) is defined by open-web independent DSP and martech orchestration
              software spend, estimated between $15 billion and $25 billion, driven by surging CTV and retail media
              demand [CM002, CM011]. On a serviceable obtainable market (SOM) basis, StackAdapt targets mid-market
              brands and independent digital agencies, representing a $3 billion to $5 billion addressable volume pool
              [CM009, CM012]. The company operates at massive technical scale, processing 465 billion automated bid
              optimizations per second across global bid streams, generating more than $500 million in platform gross
              volume run-rate [CM009].
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM009
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: Buyer Segmentation, Workflow Economics, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption in programmatic adtech is divided across three distinct buyer categories with
              differing procurement economics: independent agencies, mid-market in-house brand teams, and specialized
              enterprise vertical organizations. Independent agencies represent the platform primary volume engine,
              utilizing self-serve or managed tiers to execute multi-client campaigns without the punitive minimum spend
              commitments imposed by legacy enterprise DSPs [CM005]. Pricing follows prevailing adtech industry
              conventions, structured primarily as a percentage of gross media spend under management with transparent
              platform fee schedules and no hidden tech markups [CM005]. In-house brand marketing teams manage
              cross-channel acquisition budgets, demanding unified workflows that bridge paid ad execution with owned
              first-party data assets [CM005]. Furthermore, specialized vertical buyers—such as tourism boards and
              location-based merchants—increasingly require transaction-backed attribution solutions that connect live
              media delivery to verified payment card spending and real-world foot traffic rather than digital proxy
              clicks [CM010, CM014].
            claimRefs:
              - CM005
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM010
              - CM014
      - number: '2.4'
        title: Growth Catalysts, AI Orchestration, and Structural Market Constraints
        blocks:
          - type: paragraph
            body: >-
              Market momentum is propelled by the rapid expansion of CTV and retail media networks alongside pervasive
              demand for marketing technology stack consolidation [CM011]. However, structural adoption constraints
              remain pronounced across the adtech ecosystem. Survey data reveals a severe fragmentation tax: two-thirds
              of senior marketers estimate that up to 30% of programmatic budgets are wasted due to disjointed tools,
              siloed execution, and disconnected data pipes [CM003]. While 75% of marketers report running omnichannel
              campaigns, the overwhelming majority lack the unified infrastructure and operational workflows necessary
              to act on cross-channel intelligence in flight [CM002]. Marketers who successfully overcome these
              operational hurdles by consolidating tech stacks and deploying AI pragmatically are 4 times more likely to
              outperform peers across revenue growth and operational efficiency [CM004]. Consequently, top-performing
              advertisers are 4 times more likely to overhaul more than half of their marketing tech stacks to eliminate
              execution friction and unlock autonomous cross-channel orchestration [CM013].
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM011
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Fragmentation Tax in Programmatic Buying
            body: >-
              Programmatic execution across disconnected point tools creates substantial margin drag. With two-thirds of
              marketers estimating that up to 30% of media budgets are lost to siloed systems, the economic incentive
              has swung decisively from best-of-breed tool accumulation toward consolidated operating platforms that
              unite bid decisioning, creative generation, and cross-channel attribution.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: The Omnichannel Execution Bottleneck
            body: >-
              While 75% of enterprise marketers report running omnichannel campaigns, the overwhelming majority remain
              constrained by fragmented workflows and delayed post-campaign reporting. Platforms that fail to provide
              real-time, closed-loop attribution across CTV, programmatic, and owned channels risk seeing client budgets
              revert to walled gardens.
            calloutType: risk
            claimRefs:
              - CM002
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Core Competitor Tiers
        blocks:
          - type: paragraph
            body: >-
              The programmatic advertising software landscape is structured into distinct tiers based on target buyer
              profiles, media budget minimums, and technical orchestration complexity. At the high end of the market,
              enterprise demand-side platforms such as The Trade Desk and Google Display and Video 360 serve massive
              global brands and agency holding companies, providing unmatched inventory scale across the open internet
              but imposing prohibitive monthly ad spend commitments and complex trading interfaces. StackAdapt competes
              directly in the fast-growing mid-market tier alongside independent omnichannel DSPs including Basis
              Technologies, Simpli.fi, and Viant Technology. While Basis Technologies emphasizes agency workflow
              automation across search, social, and programmatic buying, and Simpli.fi specializes in localized
              household-level unstructured data geo-fencing, StackAdapt differentiates through self-serve accessibility,
              multi-channel execution, and superior mid-market buyer satisfaction without enforcing mandatory spend
              thresholds.
            claimRefs:
              - CP001
              - CP002
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
      - number: '3.2'
        title: Feature Capabilities and Full-Funnel Martech Integration
        blocks:
          - type: paragraph
            body: >-
              A central structural evolution in programmatic media buying is the convergence between adtech media
              activation and martech customer journey automation. Historically, demand-side platforms operated as
              isolated media-buying engines requiring separate customer data platforms and external email service
              providers to execute full-funnel marketing campaigns. StackAdapt has broken this architectural divide by
              releasing a generally available martech suite that unites programmatic display, native, video, connected
              TV, digital out-of-home, and in-game ad buying with native automated email messaging and first-party data
              onboarding. Supported by integrations with CRM and customer platforms such as HubSpot, Klaviyo, Braze, and
              Salesforce, marketers can trigger coordinated multi-channel engagement flows from single conversion
              events. Furthermore, StackAdapt has demonstrated rapid innovation in emerging conversational ad formats by
              participating as a launch technology partner for advertising pilots within ChatGPT, allowing advertisers
              to engage prospective buyers during conversational research and product comparison sessions.
            claimRefs:
              - CP003
              - CP007
              - CP009
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP009
      - number: '3.3'
        title: Pricing Models, Minimum Spend, and Packaging Comparison
        blocks:
          - type: paragraph
            body: >-
              Monetization models across programmatic advertising platforms dictate customer accessibility and determine
              which customer segments each vendor can effectively defend. While enterprise DSPs charge high platform
              technology fees and require long-term annual commitments or strict monthly minimum spends of twenty
              thousand dollars or more, StackAdapt utilizes an accessible usage-based media pricing model with zero
              spend minimums for self-serve clients. This transparent approach enables performance agencies, mid-market
              enterprises, and emerging direct-to-consumer brands to test channels with full budgetary flexibility
              before scaling spend. In contrast, specialized point solutions like Vibe.co offer hyper-accessible
              self-serve connected TV advertising with transparent pay-per-view pricing starting at two cents per view,
              but lack the cross-device omnichannel formats, digital out-of-home inventory, and native martech email
              capabilities required by sophisticated brand campaigns.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
      - number: '3.4'
        title: Competitive Positioning, Switching Dynamics, and Adverse Threats
        blocks:
          - type: paragraph
            body: >-
              StackAdapt occupies a defensible and differentiated position within the mid-market programmatic ecosystem
              by pairing comprehensive multi-channel execution breadth with accessible self-serve onboarding and
              proactive customer support. However, moat durability is constrained by low industry switching costs and
              persistent multi-homing practices, where agencies regularly operate multiple DSP platforms concurrently to
              access niche data segments and optimize inventory pricing. In addition, customer feedback highlights
              limitations in custom reporting and multi-account campaign pacing as friction points when scaling
              enterprise spend. While proprietary first-party Data Hub capabilities and native email journey
              orchestration create deeper workflow stickiness than standard media-buying utilities, StackAdapt faces
              continuous long-term displacement risks from dominant walled-garden advertising systems and potential
              downmarket expansion by enterprise DSP incumbents.
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP010
              - CP011
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Convergence of Adtech and Martech as a Structural Differentiator
            body: >-
              StackAdapt's transition from a pure-play DSP to an integrated marketing platform that unifies programmatic
              media buying with native email automation and first-party Data Hub orchestration provides a unique
              operational efficiency advantage over point-solution DSPs that require disparate third-party CDP and ESP
              integrations.
            calloutType: insight
            claimRefs:
              - CP003
              - CP004
          - type: callout
            title: Mid-Market Moat Vulnerability to Enterprise DSP Downmarket Expansion
            body: >-
              While StackAdapt benefits from low entry barriers and superior mid-market customer satisfaction, the
              platform faces ongoing displacement risks if enterprise incumbents like The Trade Desk lower minimum
              commitments or if walled-garden platforms enhance direct programmatic access.
            calloutType: risk
            claimRefs:
              - CP002
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Structure
        blocks:
          - type: paragraph
            body: >-
              StackAdapt operates as a multi-channel demand-side platform (DSP) that unifies programmatic advertising
              across connected TV (CTV), digital out-of-home (DOOH), video, display, native, audio, and email marketing
              channels. The company's core monetization engine functions on a programmatic media margin structure,
              capturing platform fees calculated as a percentage of gross advertising spend rather than charging
              separate software seat licenses or opaque technology markups. In addition to primary media execution
              margins, StackAdapt generates secondary software revenue through optional premium modules, including
              advanced CRM integrations, email marketing automation, and dynamic creative optimization suites billed on
              fixed annual schedules or tiered commitments. Commercial packaging spans three primary delivery tiers:
              self-serve access for independent performance agencies and lean in-house marketing teams, managed campaign
              services for brands requiring hands-on tactical execution, and hybrid arrangements that combine automated
              platform access with strategic account support. Entry-level Digital Basic packages permit flexible credit
              card settlement, while high-volume Gold, Accelerate, and Enterprise tiers offer standard corporate net
              terms and negotiated platform commitments. Although the platform claims massive processing
              scale—delivering 465 billion automated machine learning optimizations per second across global
              bidstreams—StackAdapt remains privately held and does not disclose its realized average take rate or
              gross-to-net revenue conversion. Consequently, while third-party press reports indicated an annual revenue
              run-rate of $500 million in early 2025, underwriting cannot independently verify the proportion of this
              top line representing true recognized net revenue versus gross media spend under management.
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI008
              - CI009
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI005
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI005
              - CI008
              - CI009
              - CI014
      - number: '4.2'
        title: Go-to-Market Motion and Channel Economics
        blocks:
          - type: paragraph
            body: >-
              StackAdapt's commercial distribution strategy relies on a hybrid go-to-market motion balancing direct
              agency sales with scaled channel partnerships and developer-friendly onboarding. A key competitive
              differentiator for StackAdapt in mid-market digital advertising has been its self-serve onboarding
              velocity, supported by StackAdapt Academy and automated workflow tools that allow regional agencies to
              configure multi-channel programmatic campaigns without entering multi-year minimum spend locks. To
              accelerate enterprise penetration without incurring proportional direct sales overhead, StackAdapt
              actively secures strategic alliances with scaled marketing technology networks and agency holding groups.
              A prominent example is the company's August 2026 strategic DSP partnership with Ansira, an enterprise
              brand-to-local marketing platform that oversees more than 500 brands and manages over $7.2 billion in
              annual marketing spend across franchise and multi-location retail ecosystems. By embedding its demand-side
              bidding and geolocation attribution technology into Ansira's workflow, StackAdapt captures high-volume
              programmatic media activation at attractive distribution economics. Furthermore, the company's ongoing
              expansion into proactive AI marketing tooling—such as Command Center campaign guidance, Ivy Studio
              conversational workspaces, and unified cross-channel attribution—enhances net customer retention by
              increasing software stickiness and platform utilization across established agency books.
            claimRefs:
              - CI006
              - CI007
              - CI009
      - number: '4.3'
        title: Capital Adequacy and Financial Trajectory
        blocks:
          - type: paragraph
            body: >-
              Since its founding in 2014, StackAdapt has raised over $535 million across four private financing rounds,
              establishing a substantial balance-sheet cushion that separates it from capital-constrained adtech
              startups. In 2022, private equity firm Summit Partners led a $300 million minority growth investment,
              providing foundational expansion capital as the business approached profitability. StackAdapt strengthened
              this capital structure in February 2025 by securing an additional $235 million minority investment round
              led by Teachers' Venture Growth (TVG), with participation from Intrepid Growth Partners and existing
              backers. This financing reportedly established a $2.5 billion post-money equity valuation and coincided
              with reported annual revenues reaching $500 million, implying an entry revenue multiple of approximately
              5.0x. Capital has been deployed aggressively into international expansion and talent acquisition: company
              disclosures and investor announcements indicate global headcount grew from roughly 700 employees at the
              time of Summit's entry to more than 1,400 employees by early 2026, while external industry directory
              datasets tracked 1,839 employees as of September 2026. Financial filings from international subsidiaries
              offer a rare partial window into regional unit scale: StackAdapt UK Limited reported annual revenues
              between £10 million and £50 million with 107 staff for the period ending December 2025. Given its
              multi-hundred-million-dollar funding total and reported operational profitability prior to the 2025
              financing, StackAdapt maintains strong capital adequacy with minimal immediate financing dependency or
              near-term liquidity pressure.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI010
              - CI011
      - number: '4.4'
        title: Financial Verdict and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              From an underwriting standpoint, StackAdapt demonstrates the commercial momentum, revenue scale, and
              institutional backing characteristic of an emerging category leader in independent programmatic
              advertising. The reported $500 million top-line run-rate, $2.5 billion market valuation, and backing by
              Tier-1 growth investors such as Summit Partners and Teachers' Venture Growth validate strong market
              adoption among performance-focused brands and agencies. However, from an investment diligence perspective,
              significant disclosure deficits preclude formal underwriting. Foremost among these blockers is the
              complete absence of audited financial statements reconciling gross client media spend with recognized GAAP
              net revenue, platform take rates, and cash contribution margins. In programmatic advertising, gross
              revenue reporting can mask underlying gross margin volatility driven by SSP auction dynamics, third-party
              data licensing costs, and cloud infrastructure expenses. Additionally, external legal scrutiny introduces
              potential downside variance: in June 2026, a class action titled Rodriguez et al v. StackAdapt was filed
              challenging the platform's tracking technologies under digital privacy frameworks, while employee
              litigation in Australia highlighted cross-border compliance challenges. Coupled with strategic dependence
              on third-party AI foundation models for its latest conversational tools, StackAdapt presents an attractive
              top-line growth profile that cannot be de-risked without access to private audited financial statements,
              customer cohort retention data, and contractually realized take rates.
            claimRefs:
              - CI001
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Private Financial Disclosure Deficit
            body: >-
              StackAdapt's reported $500 million revenue and $2.5 billion valuation represent impressive top-line scale,
              but absence of audited financial statements obscures the exact boundary between gross media billings and
              recognized net revenue. In digital advertising, take-rate compression or high media cost-of-goods can
              substantially alter perceived software multiples.
            calloutType: risk
            claimRefs:
              - CI001
              - CI014
          - type: callout
            title: Operating Leverage via Platform Automation
            body: >-
              Generating between $270,000 and $355,000 in revenue per employee across 1,400 to 1,800 staff indicates
              strong operational automation. The company's expansion into higher-margin software orchestration modules
              provides potential margin expansion beyond commoditized DSP take rates.
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
              - CI009
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Omnichannel Platform Definition and Media Buying Workflows
        blocks:
          - type: paragraph
            body: >-
              StackAdapt operates as a unified omnichannel demand-side platform (DSP) engineered to plan, execute, and
              analyze digital advertising campaigns across multiple inventory channels from a single operating console.
              The platform natively supports connected TV (CTV), digital out-of-home (DOOH), display, native, online
              video, audio, and email marketing. In mid-2026, StackAdapt expanded this multi-channel execution perimeter
              by introducing programmatic direct mail in the United States, enabling digital media buyers to trigger
              personalized physical letters and postcards based on verified online user engagement signals. The platform
              is packaged across six distinct market tiers—Digital, Basic, Gold, Accelerate, Platinum, and
              Enterprise—designed to accommodate lean independent media buyers through self-serve workflows while
              providing dedicated account management, enhanced creative services, and custom reporting configurations
              for high-volume enterprise organizations.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
      - number: '5.2'
        title: Contextual AI Decisioning Core and Bidding Infrastructure
        blocks:
          - type: paragraph
            body: >-
              At the architectural core of StackAdapt's media buying engine is a proprietary real-time contextual
              analysis pipeline that evaluates over 1.2 billion bid requests daily across more than 50 supply-side
              platforms and ad exchanges. Rather than depending on third-party cookie graphs or blunt keyword
              whitelists, the system parses full-page text content, contextual metadata, and behavioral intent signals
              in real time to establish ad placement relevance. Independent empirical testing conducted across 847
              campaigns demonstrated that this contextual bidding infrastructure achieved cost-per-click rates between
              $0.12 and $0.31 in competitive finance and wellness verticals, alongside video completion rates averaging
              87% across premium CTV placements. Media buying operations also benefit from streamlined campaign
              configuration interfaces, reducing full multi-channel setup duration from approximately 45 minutes on
              legacy DSP architectures to under 12 minutes through unified drag-and-drop audience layering.
            claimRefs:
              - CE006
              - CE007
              - CE011
              - CE014
          - type: table
            tableRef: TE002
