              - CE008
              - CE013
      - number: '5.4'
        title: Architecture Dependencies, Integration Constraints, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Despite its rapid feature velocity and modern user experience, StackAdapt exhibits clear architectural
              dependencies and operational tradeoffs that institutional underwriters must evaluate. The real-time
              bidding infrastructure relies fundamentally on uninterrupted external exchange connectivity and
              standardized OpenRTB communication protocols across 50+ SSP partners. Operational access remains
              restricted by significant spending floors, with third-party platform audits documenting minimum monthly
              commitments starting at $15,000 for self-serve accounts and reaching $50,000 for managed media campaigns.
              Furthermore, while the platform provides intuitive UI dashboards and attribution path modeling, advanced
              enterprise data exports and custom attribution models remain constrained without dedicated API pipeline
              engineering. Finally, StackAdapt has not publicly disclosed server-side latency telemetry, bidder
              infrastructure cluster sizing, or cloud hosting cost breakdowns, leaving unit-level processing efficiency
              unverified.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
