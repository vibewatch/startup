      - number: '5.3'
        title: Agentic Workflows, MCP Integration, and Emerging AI Touchpoints
        blocks:
          - type: paragraph
            body: >-
              During its Conversion 2026 product summit, StackAdapt unveiled a coordinated shift toward proactive and
              agentic campaign execution frameworks. The central release, Ivy Studio, upgrades the company's
              conversational AI assistant into an immersive full-screen workspace where marketers can model reach,
              execute real-time budget reallocations, and train customized domain 'Skills' directly through natural
              language. To extend platform intelligence into external corporate environments, StackAdapt published an
              official Model Context Protocol (MCP) server, allowing external agentic orchestrators such as Anthropic's
              Claude to query campaign performance, audit creative assets, and trigger pacing adjustments via
              conversational prompts without manual portal logins. Furthermore, through an early-stage advertising
              partnership with OpenAI, StackAdapt established exploratory ad placements within ChatGPT conversational
              discovery sessions, connecting emerging AI research journeys with programmatic attribution and creative
              delivery.
            claimRefs:
              - CE002
              - CE003
              - CE008
              - CE009
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
