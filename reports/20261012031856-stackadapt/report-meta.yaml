companyProfile:
  summary: >-
    StackAdapt is a Toronto-based AI-powered programmatic advertising and marketing orchestration platform founded in
    2014. It serves mid-market agencies and brands across programmatic and owned channels, monetizes primarily through
    media-spend-based platform fees and service tiers, and scaled further in 2025-2026 with a $235 million growth round,
    new AI workflow products, and a reported workforce of roughly 1,839 employees. The business shows real operating
    scale, but its private-company financial opacity, customer concentration unknowns, and cap-table complexity still
    limit underwriting confidence.
