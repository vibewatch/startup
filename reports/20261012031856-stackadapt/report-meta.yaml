  topStrengths:
    - Real operating scale across a broad omnichannel DSP and orchestration footprint.
    - Strong funding support and institutional validation from tier-1 growth investors.
    - Product expansion into AI workflows, attribution, and martech integration.
    - Meaningful market reach across agencies, brands, and global advertiser accounts.
  topRisks:
    - Audited revenue, margin, cash-flow, and cap-table disclosure remain unavailable.
    - Customer concentration, retention, and NRR are still not verified.
    - The reported valuation sits at a premium multiple for a private adtech business.
    - Regulatory, privacy, and supply-chain risks remain material in programmatic adtech.
  unresolvedGaps:
    - >-
      Audited net revenue, gross margin, free-cash-flow, and balance-sheet disclosure sufficient to validate
      profitability.
    - Customer concentration, NRR, and cohort-retention data separating agency, brand, and vertical exposure.
    - Liquidation preferences, ownership structure, and the exact secondary-versus-primary split in the 2025 round.
    - A cleaner bridge reconciling official, press, and database estimates for headcount, valuation, and revenue.
