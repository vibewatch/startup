evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosures
    missingEvidence: >-
      Audited financial statements confirming net revenue, gross margin, EBITDA, and free cash flow conversion for 2024
      through 2026.
    whyItMatters: >-
      StackAdapt is a private Canadian corporation with undisclosed statutory filings; public metrics are limited to
      broad qualification thresholds ($50M+) and media estimates ($500M).
    diligencePath: >-
      Request audited financial statements, historical income statements, and management presentation under
      non-disclosure agreement.
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: ownership-and-cap-table
    missingEvidence: >-
      Full capitalization table detailing founder equity stakes, options pool, Teachers' Venture Growth share class, and
      primary versus secondary proceeds from the 2025 transaction.
    whyItMatters: >-
      Without cap table disclosure, investor governance rights, liquidation preferences, and founder voting control
      cannot be independently verified.
    diligencePath: Obtain certified cap table and shareholders agreement during confirmatory legal diligence.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: net-take-rate-disclosure
    missingEvidence: >-
      Audited breakdown of gross merchandise volume (media spend under management) versus net platform fee revenue and
      client net retention across agency tiers.
    whyItMatters: >-
      Without segmented gross-versus-net revenue disclosure, estimating StackAdapt precise addressable SOM and margin
      expansion durability relies on private benchmarks.
    diligencePath: >-
      Request audited revenue statements or confidential information memorandum (CIM) segment disclosures detailing
      platform take-rate percentages by channel and cohort.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: omnichannel-adoption-measurement
    missingEvidence: >-
      Reconciliation between self-reported 75% omnichannel campaign execution and third-party estimates indicating
      pervasive multi-tool fragmentation.
    whyItMatters: >-
      Survey optimism may overstate operational maturity, concealing whether mid-market buyers genuinely orchestrate
      cross-channel journeys or simply run isolated campaigns.
    diligencePath: >-
      Commission blind buyer interviews assessing multi-touch attribution usage, frequency capping enforcement across
      CTV and display, and martech integration depth.
    relatedTableRefs:
      - TM001
  - type: missing-source
    severity: minor
    topic: agency-churn-and-concentration
    missingEvidence: >-
      Historical gross and net revenue retention rates, client concentration metrics, and logo churn broken out between
      holding companies and independent agencies.
    whyItMatters: >-
      Independent agency accounts may exhibit higher churn volatility or lower platform lock-in than direct enterprise
      brand accounts during advertising downturns.
    diligencePath: Review cohort retention schedules and annual contract value distributions in private diligence data room.
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitor-win-rates
    missingEvidence: >-
      Granular win/loss telemetry and contract displacement statistics detailing StackAdapt account transitions against
      The Trade Desk and Basis Technologies.
    whyItMatters: >-
      Direct customer displacement data would clarify whether StackAdapt is capturing net-new programmatic budgets or
      actively taking share from incumbent agency trading desks.
    diligencePath: >-
      Request customer cohort migration reports and agency partner retention data by competitor displacement category
      during management diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: audited-net-revenue-and-margins
    missingEvidence: >-
      Audited financial statements confirming GAAP net revenue, gross margin, take rate, and free cash flow for fiscal
      years 2024 through 2026.
    whyItMatters: >-
      Without audited gross-to-net revenue reconciliation, underwriting cannot determine whether the $500 million top
      line reflects recognized net revenue or gross platform spend.
    diligencePath: >-
      Request audited financial statements, gross-to-net revenue bridges, and monthly cohort contribution margin reports
      under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics-and-retention
    missingEvidence: >-
      Customer net revenue retention (NRR), gross revenue retention, customer acquisition cost (CAC), and customer
      lifetime value (LTV) across agency versus direct-brand accounts.
    whyItMatters: >-
      Unit economics reveal whether customer expansion offsets agency account churn and validate the durability of
      StackAdapt's growth trajectory.
    diligencePath: >-
      Obtain historical cohort retention curves and unit-level contribution margins segmented by enterprise, mid-market,
      and agency customers.
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: infrastructure-throughput
    missingEvidence: >-
      Direct server-side latency telemetry, cluster sizing, and cloud infrastructure cost disclosures verifying bidder
      throughput.
    whyItMatters: >-
      Independent operational throughput and hosting costs determine gross margin durability as bid request volume
      scales.
    diligencePath: >-
      Request engineering architecture documentation and cloud infrastructure expense line items during technical due
      diligence.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: >-
      StackAdapt NRR, GRR, logo churn, renewal rate, contract duration, and cohort expansion separated by package,
      agency, and direct-brand customer.
    whyItMatters: >-
      A customer campaign's retention lift cannot establish the platform vendor's own recurring revenue durability or
      the quality of land-and-expand economics.
    diligencePath: >-
      Request audited quarterly cohort schedules, renewal files, and contract-term distributions for at least the latest
      three fiscal years.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Revenue and gross-profit concentration by top customer, brand, agency, holding company, geography, vertical, and
      channel.
    whyItMatters: >-
      Agency Centers of Excellence can create efficient distribution while also concentrating procurement leverage and
      media-spend exposure in a small number of relationships.
    diligencePath: >-
      Obtain top-10 and top-25 customer schedules, agency-to-brand mappings, media-spend commitments, and sensitivity to
      loss of each major holding-company relationship.
    relatedQuestionRefs:
      - QU009
  - type: missing-source
    severity: material
    topic: adoption-denominators
    missingEvidence: >-
      Absolute active-account counts, feature-user cohorts, baseline metric values, spend weighting, and methodology for
      the reported platform adoption and performance benchmarks.
    whyItMatters: >-
      Relative growth and lift metrics cannot be translated into customer growth, revenue expansion, or representative
      performance without their denominators.
    diligencePath: >-
      Request metric definitions, cohort extracts, baseline values, sample sizes, and independent validation for each
      platform benchmark.
    relatedQuestionRefs:
      - QU002
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete named-customer deployment roster with start date, production status, contract value, spend, renewal,
      and externally validated outcome methodology.
    whyItMatters: >-
      Selected successful cases demonstrate capability but cannot establish deployment success rates, median outcomes,
      or customer durability across the full account base.
    diligencePath: >-
      Reconcile the public reference set to an anonymized customer master and independently confirm a stratified sample
      of agency, brand, SMB, and enterprise accounts.
    relatedQuestionRefs:
      - QU003
      - QU007
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: financial-concentration
    missingEvidence: >-
      Audited revenue concentration disclosures separating top agency holding company spend, direct brand spend, and
      gross-to-net take rates.
    whyItMatters: >-
      High customer or agency concentration could expose platform revenue to sudden programmatic budget shifts, agency
      review cycles, or contractual renegotiations.
    diligencePath: >-
      Request audited revenue concentration schedules across top 10 accounts and client tenure cohorts under standard
      M&A or pre-IPO diligence.
    relatedQuestionRefs:
      - QR009
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-compliance
    missingEvidence: >-
      Exhaustive legal register of all localized state-level privacy rulemakings and international data transfer
      adequacy rulings.
    whyItMatters: >-
      State-by-state statutory divergence in US privacy regulations increases operational and legal compliance overhead
      for real-time bidstream processing.
    diligencePath: >-
      Review internal legal team compliance matrix and external counsel opinion letters regarding cross-border data
      transfer mechanisms.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Audited financial disclosure confirming net revenue recognition, gross margin profiles, EBITDA profitability, and
      the exact primary-versus-secondary allocation of the 2025 growth round.
    whyItMatters: >-
      The reported $2.5B valuation represents a full ~5.0x run-rate multiple that cannot be justified without verifying
      audited profitability and preference seniority.
    diligencePath: >-
      Request confidential disclosure from StackAdapt management and lead placement agents detailing audited financial
      statements, unit economics, and cap table liquidation priorities.
    relatedQuestionRefs:
      - QV009
