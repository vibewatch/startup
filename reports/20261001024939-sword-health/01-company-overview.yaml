company:
  name: "Sword Health"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Sword Health is a late-stage private, New York-headquartered digital-care company founded in Portugal in 2015. Its $40 million June 2025 financing at a company-reported $4 billion valuation and June 2026 Portugal-wide contract show scale, but total funding, revenue, headcount, governance, and ownership remain dependent on company disclosures or inconsistent third-party profiles."
sections:
  - id: "identity-and-care-model"
    title: "Identity, Operating Model, and Product Scope"
    body: >-
      A third-party profile dates Sword Health's founding to 2015 in Portugal by
      Virgílio Bento and Márcio Colunas, identifies the business as private, and
      places its headquarters in New York while listing Porto among its offices.
      The operating model is benefit-sponsored digital care: Sword's member site
      says participating employers, health plans, and organizations cover access,
      while licensed clinicians tailor programs delivered through the app and
      associated technology. The current member-facing portfolio spans physical
      therapy, pelvic health, movement, cardiometabolic support, and mental health
      through Thrive, Bloom, Move, Pulse, and Mind. These facts establish a
      diversified care platform, but they do not establish product-level revenue,
      utilization, or margin contribution.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "capital-and-stakeholders"
    title: "Financing History and Stakeholder Structure"
    body: >-
      Sword's financing record shows progression from an $85 million Series C in
      June 2021 to a company-announced $40 million round at a $4 billion valuation
      in June 2025. The later round was led by General Catalyst and included Khosla
      Ventures, Comcast Ventures, Lince Capital, Oxy Capital, Armilar, Indico
      Capital, and Shilling; the announcement also identified General Catalyst's
      Chris Bischoff as a Sword board director. An August 2026 tear sheet reports
      $541.1 million of cumulative funding across nine rounds and labels the June
      2024 $130 million Series E at a $3 billion post-money valuation as reported
      but not confirmed. Neither figure is cash available, and the assigned
      evidence does not disclose the cap table, preference stack, ownership
      percentages, or complete board composition.
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
  - id: "leadership-and-governance"
    title: "Leadership Coverage and Governance Gaps"
    body: >-
      The August 2026 profile names Virgílio Bento as founder, chairman, and chief
      executive; Márcio Colunas as chief scientific officer; Valentina Longo as
      chief financial officer; and Jorge Meireles as chief technology officer.
      This roster covers corporate leadership, scientific oversight, finance, and
      technology, but the evidence does not provide biographies sufficient to
      assess each executive's prior operating record. Bento's combined founder,
      chair, and CEO offices, together with his repeated role as the spokesperson
      in financing and product announcements, indicate material key-person
      concentration. Public evidence confirms one investor-affiliated director,
      not the full board, its committee structure, voting arrangements, or
      succession plan; those remain primary-diligence requests rather than facts.
    claimRefs:
      - "CO001"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "scale-and-milestones"
    title: "Scale Signals, Milestones, and Evidence Quality"
    body: >-
      Sword's expansion is visible in dated operating milestones, but scale
      metrics require careful denominator and vintage control. A November 2023
      company release said Atlas launched in 150 countries and described more
      than 10,000 employers across three continents and over 1.5 million AI-led
      sessions during 2023. STAT later reported that Portugal's National Health
      Service contracted in June 2026 to make Sword's physical therapy available
      to a population of 10 million after physician referral. Those figures are
      employers, sessions, eligible population, and product availability—not
      interchangeable customer or active-user counts. Current workforce evidence
      also conflicts: an August 2026 tear sheet lists 650 employees, while LeadIQ
      assigns a 1,001-5,000 employee band. Nelson Advisors' approximately $240
      million annualized revenue run-rate estimate is neither disclosed ARR nor
      audited revenue and implies a stated 17.3x valuation multiple, making
      financial verification a material investment condition.
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
