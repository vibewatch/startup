            body: >-
              第三方资料将 Sword Health 的创立时间列为 2015 年，创办人为 Virgílio Bento 和 Márcio
              Colunas，创立地为葡萄牙；公司目前是非上市企业，总部位于纽约，并在波尔图设有办公室。Sword
              面向会员的网站称，雇主、健康险计划及其他机构承担服务费用，持牌临床医生会为会员定制方案，再通过应用及配套技术交付。现有产品包括物理治疗、盆底健康、运动、心血管代谢支持和心理健康项目，分别对应
              Thrive、Bloom、Move、Pulse 和 Mind。产品线虽然多元，但现有信息无法说明各线的收入、使用率或利润贡献。
