      - number: '8.2'
        title: 核心投资逻辑与反向论点博弈
        blocks:
          - type: paragraph
            body: >-
              看多 Sword Health 的逻辑在于其技术差异化、自研机器学习模型，以及在自保雇主健康计划中初步显现的运营杠杆。Phoenix AI 平台和 37+ 项专利支撑其为超过 1,000,000
              名会员提供远程护理；据报，公司竞标胜率为 70%，并减少了手术需求。此外，管理层称公司已实现正向经营现金流，这让 Sword 有别于 2021
              年融资热潮后陷入困境的高烧钱同行。反方逻辑则指出，企业福利主管已厌倦单点采购，越来越倾向选择综合福利平台，而非独立 MSK 方案。Sword
              大举切入女性盆底健康（Bloom）与行为健康（Mind），拉高了执行复杂度，加剧了同细分垂直龙头的正面竞争。一旦客户净留存率跌破
              100%，或多专科交叉销售未能跨越核心物理治疗形成规模，支撑其溢价软件估值倍数的逻辑便不复存在。
