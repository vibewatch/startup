      - number: '7.3'
        title: 估值倍数、退出周期与平台扩张依赖
        blocks:
          - type: paragraph
            body: >-
              Sword Health 于 2025 年 6 月以 $4.0B 估值融资 $40M，较上一轮估值上升 33%；管理层还表示，后续融资估值可能高达 $5.0B [CR007]。CEO Virgílio Bento
              同时透露，公司已将 IPO 时间从原先可能的 2025 年推迟至至少 2028 年；他提到公司需要熟悉公开市场，也希望上市前先在多个业务领域建立规模化验证 [CR010]。流动性兑现推迟到 2028
              年之后，拉长了投资期限风险，也加深了股东和员工对私募老股市场的依赖 [CR011]。此外，扩大临床服务还需持续招聘持牌临床人员，例如葡萄牙和北美的远程物理治疗师；他们既要承担临床工作，也要熟练使用 AI 工具
              [CR012]。在宏观经济与企业福利预算趋紧的背景下，要想相对于公开市场同行基准维持一级市场高溢价倍数，必须依赖无懈可击的临床交付与经得起考验的单体经济模型。
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR012
