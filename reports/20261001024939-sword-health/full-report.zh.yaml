companyProfile:
  summary: >-
    Sword Health 是一家成长期后期的非上市数字医疗公司，2015 年创立于葡萄牙，现总部位于纽约。平台以 AI
    辅助肌肉骨骼诊疗为核心，也提供盆底健康、运动、心血管代谢和心理健康项目；服务由持牌临床医生支持，主要面向雇主、健康险计划和公共部门买方。公开资料显示，公司已打入企业客户和国家级医疗系统，包括 2025 年 6 月按 $4.0B
    估值融资，以及 2026 年 6 月在葡萄牙获得全国性合约；但财务与股权细节仍只披露了一部分。
