      - number: '3.3'
        title: 定价模式、GTM 渠道分发与转换成本
        blocks:
          - type: paragraph
            body: >-
              数字 MSK 领域的商业竞争深度受制于企业福利采购逻辑、健康险渠道分发合作与风险共担合约结构。Sword Health 采用 100% 按疗效计费（Outcome
              Pricing）：只有参保会员达到经临床验证的康复里程碑和疼痛缓解目标，企业客户和健康险计划才需付费。相比之下，老牌厂商通常按参保人数收费，或收取每人每月（PEPM）管理费，并附带节省共享等绩效承诺。Hinge
              Health 凭借与 Express Scripts、CVS Caremark 等主流全国性健康险及 PBM
              目录深度绑定的渠道合作，保持着结构性的渠道分发优势。由于企业雇主通常按多年期合同采购数字医疗方案，且极度不愿接管过多割裂的单病种供应商，Sword 必须依靠强有力的经纪人赋能、临床 ROI
              实证以及平台捆绑折扣，方能打破买方的替换惯性。
