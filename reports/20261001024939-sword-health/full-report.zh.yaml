      - number: '5.2'
        title: AI 专科诊疗引擎与图编排决策架构
        blocks:
          - type: paragraph
            body: >
              Sword 临床交付的技术核心是其自研的 AI 专科诊疗助手 Phoenix [CE003, CE006]。传统的数字化康复平台往往要么依赖非实时的真人理疗师答疑，要么沦为无指导的健身视频库。Phoenix
              则在每次实时训练中充当主动介入的数字协同治疗师：利用计算机视觉与互联传感器反馈，系统持续追踪动作轨迹、评估关节角度，向患者输出实时的听觉与视觉纠错指导，并全程记录依从性数据 [CE003,
              CE004]。更为关键的是，该运营模式始终将持牌医生留在闭环之中（Clinician-in-the-loop）——每位会员的长周期治疗方案均由专业医生审核、监控与微调，确保自动化生物反馈绝不逾越临床安全红线
              [CE003, CE004]。


              为了在自然语言交互和临床分诊中杜绝幻觉与状态漂移，Sword 打造了专用框架 Arbor，引导大语言模型（LLM）沿着结构化临床决策树精准导航 [CE007]。传统的单 Prompt
              方法将整棵临床决策树（序列化后往往突破 10 万 Token）全部塞进系统提示词中，极易诱发上下文退化、指令遵循失效以及路线乱窜 [CE007]。Arbor
              借助边列表（Edge-list）表达与基于图的编排，将决策树逻辑与回复生成彻底解耦 [CE007, CE008]。在每个交互节点上，Arbor 仅动态检索出边判别规则，由 LLM
              判定状态转移的合法性，随后再由独立的生成步骤输出自然语言回复 [CE008]。在针对多款主流基座模型的临床测评中，Arbor 使导航准确率平均提升 29 个百分点，单轮延迟降低 57.1%，Token
              推理成本骤降至原先的 1/14.4（降幅达 14.4 倍）[CE007]。
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
