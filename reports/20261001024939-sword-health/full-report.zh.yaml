      - Sword Health
      - Hinge Health
      - Omada Health
      - Traditional In-Person PT
    rows:
      - - 定价结构
        - 100% 按疗效付费，与临床康复里程碑挂钩
        - 按参保人数与每人每月（PEPM）混合计费，并附带绩效保障
        - 按实际活跃参与人次计费，并采用风险分担收费结构
        - 按每次就诊的服务收费（按 CPT 计费代码 / 自付挂号费）
      - - 财务风险绑定机制
        - 若会员未达到预设康复目标，Sword 的费用就面临不获支付的风险
        - 对照约定的雇主节支目标分担财务风险
        - 价值医疗激励，与会员减重成果及糖化血红蛋白（HbA1c）下降挂钩
        - 医疗服务方不承担财务风险；按实际完成的就诊次数结算
      - - 员工自付成本分摊
        - 100% 由雇主或健康险计划承担（会员 $0 自费）
        - 由合作雇主全额承担（会员成本为 $0）
        - 合作雇主福利包全额覆盖
        - 需支付专科挂号门诊自付（每次 $20-$60）及免赔额
      - - 分销渠道
        - 企业直销团队、健康险计划、经纪人 / 福利顾问网络
        - 广泛进入 PBM 采购名录（Express Scripts、CVS）、健康险计划、企业直销
