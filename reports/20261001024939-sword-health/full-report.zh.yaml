      - number: '8.4'
        title: 退出准备、资本结构与尽调指引
        blocks:
          - type: paragraph
            body: >-
              Sword Health 的融资路径显示，公司正把短期上市变现推后，选择继续独立经营。创始人兼 CEO Virgílio Bento 将 IPO 从 2025 年推迟至至少 2028
              年，希望在接受公开市场审视前，先积累更多病种的临床验证；这也延长了 pre-IPO 投资者的持有期限。Forge Global 的老股交易数据表明，私下交易量有限；2026 年 1 月记录的一笔次级估值为
              $4.15B。流动性有限，更凸显投前尽调的重要性。投资者出资前应索取经审计的 GAAP 财务报表，核实毛利率和硬件部署成本；索取按客户签约年份划分、经独立验证的续约队列；并查阅完整股权结构表及清算分配顺序，量化
              Series D、Series E 和 Series F 股份对应的清算优先权。
            claimRefs:
              - CV001
