            body: >-
              尽管 Sword 核心 Thrive 动作追踪系统获得 FDA 510(k) 许可，但新上线的 LLM 对话分诊（Arbor）与 Sword Intelligence
              运营智能体目前仍套用数字健康福利及企业软件分类，未来可能面临 FDA 执法尺度的调整冲击 [CE003, CE010]。
            calloutType: risk
