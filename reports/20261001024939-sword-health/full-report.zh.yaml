      - number: '6.3'
        title: 标杆客户落地与整合风险
        blocks:
          - type: paragraph
            body: >
              Sword 的商业实证涵盖跨国企业、商业健康险及国家级公费医疗系统。代表性企业客户包括 Pearson。Pearson 全球福利副总裁 Stacey Rodgers 表示，该公司选择 Atlas
              平台以应对全球员工的疼痛和缺勤问题，并将 Sword 的临床严谨性及覆盖 40 多个国家的交付能力列为选择依据。在公立医疗领域，Sword 与葡萄牙 国家卫生服务局（SNS）签订全国性合约，提供 AI
              辅助的虚拟物理治疗，扩大乡村及服务不足地区的康复服务，并缓解公立医院的候诊积压。在英国公共医疗领域，Sword 收购了 Surgery Hero，并与 Guy's and St Thomas' NHS
              Foundation Trust 建立合作。


              尽管有这些客户案例，Sword 仍面临客户留存、平台整合和客户集中度风险。2026 年 1 月，Sword 完成对慕尼黑竞品 Kaia Health 的收购，交易金额为 $285M，意在获得覆盖 7,000
              万人口的德国法定 DiGA 医保报销护城河。然而，这笔收购带来了巨大的客户迁移阻力：Kaia 在美国的既有客户（包括 Mutual of Omaha 以及与 UnitedHealth Group
              的重磅合作）当初明确相中了其无需外接硬件、轻量化的手机摄像头计算机视觉方案。Sword 若强推将美国 Kaia
              客户迁移至其传感器加理疗师的重资产平台，一旦买方抵触硬件物流负担和更高的单次诊疗成本，将面临严重的客户流失风险。此外，Sword
              从未公开披露经审计的分客群净收入留存率（NRR）或毛续约率，企业端长期续约韧性依然未经核验。
