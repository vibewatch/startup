      - number: '2.2'
        title: 市场测算视角、增长驱动力与结构性阻力
        blocks:
          - type: paragraph
            body: >-
              数字物理治疗与虚拟医疗的市场规模测算存在显著分歧，根源在于测算口径是严格聚焦于专用数字 MSK 软件与远程诊疗交付，还是将间接社会生产力损失汇总在内。Physitrack 的独立行业分析显示，受财富 500
              强雇主普遍采纳每人每月（PMPM）及基于参与度计费模式的推动，2024 年全球数字 MSK 市场规模达到 $4.4B。公司口径声称，全球受肌肉与关节疼痛困扰的潜在流行病学目标人群超过 20
              亿人，其中下背部疾患是导致职业致残的首要病因。尽管如此，将庞大的人群患病基数转化为实际软件年经常性收入（ARR）面临重重结构性阻碍。企业采购周期漫长且链条冗长，需同时获得福利总监、首席医疗官、财务团队和信息安全审核人员的一致批准。此外，数字医疗采购正从未经充分验证的单一病种单点方案转向综合集成平台，推动全行业走向整合。推迟外科手术所带来的可量化成本节约、员工留存率改善以及国际福利扩张支撑着行业增长，但买方支付方对未经精算核实的
              ROI 数据持保留态度，拉低了整体推进节奏。
