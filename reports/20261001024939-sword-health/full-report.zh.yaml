  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合架构与客户工作流
        blocks:
          - type: paragraph
            body: >
              Sword Health 以全人 AI 诊疗为核心，在雇主或健康险资助的福利模式下将服务直接送到患者家中。产品已从最初的肌肉骨骼康复拓展至五个临床模块和一套企业运营基础设施 [CE001,
              CE003]。会员服务以旗舰物理治疗平台 Thrive 为核心，针对下背、颈部、肩部、膝盖、脚踝、足部、手腕、手部和髋部九个身体区域的急慢性疼痛提供治疗 [CE001,
              CE004]。在常见的企业服务流程中，符合条件的会员先在线完成问诊信息采集和注册，再获得定制治疗方案及持牌物理治疗师（DPT）的支持 [CE003, CE004]。


              在核心 MSK 诊疗之外，Sword 陆续推出临床模块以拓展服务范围、提高会员留存 [CE001]。Bloom
              专注女性盆底健康，针对盆腔脏器脱垂、大小便失禁、孕期护理、产后康复及更年期相关疼痛提供精准靶向治疗与生物反馈 [CE001]。Mind
              整合认知与行为层面的疼痛应对机制、睡眠管理及情绪韧性，直击往往会加剧慢性躯体疼痛的心理共病问题 [CE001, CE002]。Pulse 是 Sword
              最新的临床扩张支线，瞄准心血管代谢健康、高血压与糖尿病前期，并通过持续的行为干预和生物体征监测辅助提升 GLP-1 药物依从性 [CE001, CE002]。Atlas 则作为国际企业健康福利档位落地 150
              个国家，为跨国企业雇主提供可规模化铺开的自主节奏锻炼计划与人体工学防工伤培训 [CE005]。
            claimRefs:
