      - number: '7.2'
        title: 方法论选择性偏差、临床实证与运营执行
        blocks:
          - type: paragraph
            body: >-
              Sword Health 商业立足的一大核心支柱，在于向自保雇主做出的临床疗效与投资回报率（ROI）担保。然而，Milliman 于 2026 年 9 月开展的独立精算审查揭示出 Sword 扩张版 ROI
              测算模型中存在的重大方法论缺陷 [CR001]。具体而言，Milliman 重点指出，Sword
              是按“实际参与项目”而非“具备参保资格或接入权限”来划定干预人群的，从而引入了实质性的选择性偏差——真正持续参与的样本在主观意愿与基础健康水平上，与全员整体存在系统性差异 [CR005]。此外，针对同时参保多项
              Sword 项目（如治疗肌肉骨骼的 Thrive、女性盆底健康 Bloom 以及心理健康 Mind）等会员，Sword 的测算方法简单将人群全数归入首个收费项目，未曾单独剥离各项干预措施独立的财务收益贡献
              [CR006]。尽管 Sword 对外宣称“72% 的会员在完成疗程后摆脱功能受限性疼痛”，但此类数据仅基于顺利完赛的活跃人群，而非全员意向性治疗分析（ITT）口径
              [CR008]。随着成熟的企业福利买方愈发要求严苛的精算验证，上述统计缺陷构成实质性商业竞争风险。
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
