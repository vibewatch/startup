              平台需要寄送可穿戴惯性测量单元（IMU）和平板电脑，并承担设备物流，因此推高销售成本（COGS）并带来库存管理负担。临床人员薪酬是另一项主要运营成本；随着 AI 专科助手 Phoenix
              承担了更多自动化监督职责，Sword 于 2024 年底重组团队、精简临床岗位以提升效率。收购 Kaia Health 后，公司也获得了无需标记点的计算机视觉（“Motion
              Coach”）技术；病情较轻的会员因此可以不寄送硬件，降低边际履约成本和获客成本（CAC）。但公司没有公开经审计的 GAAP
              报表，毛利率、客户回本周期、净收入留存率（NRR）及单会员服务成本等关键指标仍未得到核实。
