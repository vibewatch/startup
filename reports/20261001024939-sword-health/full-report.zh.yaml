      - number: '6.2'
        title: 会员使用走势与扩张机制
        blocks:
          - type: paragraph
            body: >
              Sword Health 的客户采纳走势反映出其在参保企业员工群体中的高速业务扩张。综合公司披露与商业招聘信息，              Sword 的版图已从服务 1,000 余家企业客户、70
              万名会员、完成 10M 次 AI 诊疗，跃升至跨越北美与欧洲服务 2,000 余家企业客户、覆盖超 100 万名会员并累计完成逾 15M 次 AI
              诊疗。这一扩张节奏由不断扩充的企业客户成功团队保驾护航，该团队专职负责售后的交付部署、用户建档引导及会员使用活跃度管理。企业客户成功总监密切监控客户覆盖率、季度业务复盘（QBR）及年度续约预案，确保企业员工切实达成临床康复里程碑。


              会员的参与度直接与其自研的疗效定价（Outcome
              Pricing）变现模型相挂钩。在该定价机制下，雇主客户仅在参保员工达成预设的、经临床验证的健康改善指标（如患者自评结果中明确记录的疼痛缓解门槛）时，方才支付全额合同款项。为证明其经济回报，Sword
              委托第三方精算与咨询机构进行了评审（例如 Risk Strategies Consulting 的方法论分析），测算出约 3.2:1
              的投资回报率（ROI）。然而外部尽调表明，不同人群画像的员工在参与度上存在巨大落差，数字技能水平、智能手机普及度以及长期存在的硬件物流摩擦，持续阻碍着会员的长效依从。
