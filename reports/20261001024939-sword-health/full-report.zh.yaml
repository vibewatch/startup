        title: 图表
        blocks:
          - type: callout
            title: 商业履约担保面临的精算脆弱性
            body: >-
              Milliman 开展的独立精算审查明确指出，Sword 的 ROI
              担保依赖于针对“实际使用会员”而非“全部合规员工”的双重差分（DID）观察模型。鉴于深度参与会员天生具备更高治疗动力，所宣称的医疗费用降幅很可能归因于无法观测的样本自选择效应，而非纯粹的项目干预成效
              [CR005]。在自保雇主严审数字医疗开支的当下，依赖未经独立理赔数据复现的自述节约金额，会让 Sword 暴露于合同追回条款或采购阻力之中 [CR001]。
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
          - type: callout
            title: IPO 推迟至 2028 年的战略利弊权衡
            body: >-
              将 IPO 推迟至至少 2028 年，让 Sword 避开了公开市场数字医疗同业 4–6 倍市销率的估值压缩，并为 Bento 预留了在心血管、胃肠道及语言康复等专科验证临床实效的时间 [CR007,
              CR010]。然而，在长达数年的拉长周期中维持 $4.0B+ 的一级市场估值，会积聚流动性悬顶风险，不得不依赖持续的员工老股要约收购来稳定团队核心队伍 [CR011]。
            calloutType: insight
            claimRefs:
              - CR007
              - CR010
              - CR011
  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 投资建议与估值框架
        blocks:
          - type: paragraph
            body: >-
              Sword Health 在虚拟肌肉骨骼诊疗领域展现了令人瞩目的临床与运营重塑能力，但其当前一级市场定价与公开市场基本面严重脱节。在 $4B 的 F 轮估值下，公司对应其对外宣称的 $240M 年化营收
              Run-rate，测算的市销率高达约 16.7x。相比之下，公开上市的数字医疗与虚拟诊疗同业的企业价值倍数中位数仅在 3.0x 至 6.0x 收入区间。尽管公司宣称经营现金流转正且在 2,000
              余家企业客户中快速铺开，为其防范短期偿债危机提供了底线支撑，但过高的估值倍数使其在面对业绩降速或合同续约阻力时毫无安全边际可言。我们对 Sword Health
              给出“跟踪（track）”的综合投资建议，风险评级定为“高”，估值立场定为“偏高（stretched）”。在老股转让市场出清价格回落向同业基准靠拢，或多病种 ARR
              扩张得到经审计财务报表确证之前，应暂停注入大额成长期资金。
