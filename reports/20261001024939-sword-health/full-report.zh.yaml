  - id: FV001
    title: 投资建议决策逻辑链
    type: flow
    summary: 从临床与商业化规模出发，经由估值倍数与风险评级，层层推导至“保持跟踪”的投资建议。
    data:
      nodes:
        - id: n1
          label: 临床与会员规模
          detail: 1M+ 入组会员和自研 AI 临床方案为核心 MSK 产品提供了有效性依据
          tone: positive
        - id: n2
          label: 商业化收入基本盘
          detail: 据报 ARR 为 $240M，且经营现金流为正，显示业务具备持续运营能力
          tone: positive
        - id: n3
          label: 估值倍数分析
          detail: 16.7x ARR 估值倍数（对应 $4.0B 估值）较公开市场数字健康对标公司溢价 3x-5x
          tone: risk
        - id: n4
          label: 退出周期与流动性
          detail: IPO 延至至少 2028 年，拉长了投资久期，且退出需依赖一级半市场私募二手交易
          tone: risk
        - id: n5
          label: 公司治理与信息缺口
          detail: 缺少经审计的 GAAP 利润率数据和独立精算 ROI 数据，因此暂不适合参与成长期融资
          tone: risk
        - id: n6
          label: 投资决策
          detail: 维持跟踪建议：盯紧私募二手交易出清估值，等待多专科规模化业务实证
          tone: neutral
    approximationNotes: 逻辑决策树将已核实的运营里程碑与估值门槛映射至具体的投资立场。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV014
