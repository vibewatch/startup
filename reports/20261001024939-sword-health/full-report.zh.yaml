              Sword Health 在 Series F 轮中获得 $4.0B 估值，对应据报 $240M ARR 的 16.7x 倍数。鉴于公开市场数字医疗同行的市销率仅在 3x 至 6x
              区间，任何增速放缓或上市估值倍数回落都会严重压缩股权价值；若无显著价格折让，当前介入缺乏吸引力。
