      - number: '5.3'
        title: Sword Intelligence 企业端扩张、数据平台与合规认证
        blocks:
          - type: paragraph
            body: >
              2025 年 7 月，Sword Health 将内部运营自动化体系独立成军，组建商业化业务单元 Sword Intelligence [CE009, CE010]。截至 2025 年中，Sword
              在内部已累计完成超 700 万场 AI 诊疗、服务超 50 万名会员，以此为基础，公司将其行政端 AI 护理管理智能体（Care Manager
              agents）打包为模块化软件，对外输出给商业健康险、医院网络及政府卫生管理机构 [CE009, CE010,
              CE011]。这些模块化智能体将阻力重重的非临床流程全面自动化，涵盖患者接待问卷、福利资格自动审核、智能分诊转诊、预约挂号，以及高危会员的主动预警随访 [CE009, CE010, CE011]。Sword
              Intelligence 在公司内部独立运营，旨在降低企业行政管理负担，而不是取代现有的人工医疗协调团队 [CE010, CE012]。


              支撑临床 AI 引擎与运营工作流的，是一套分布式企业级数据平台 [CE002]。Sword 的底层技术架构围绕现代流式湖仓（Streaming
              Lakehouse）搭建，依靠分布式流处理引擎和持久化工作流调度，在三大洲之间实时同步传感器遥测指标、生物特征追踪及会员交互记录 [CE002]。在严苛的医疗合规红线内，所有临床与运营方案均严格对齐
              HIPAA、SOC 2 Type II 和 HITRUST 认证标准 [CE009, CE010]。然而，核心尽调风险依然存在：尽管 Phoenix 的核心物理治疗算法获得 FDA 510(k)
              医疗器械许可，但新上线的自然语言分诊功能与预测性护理管理智能体目前均套用通用数字健康福利（Wellness）豁免条款；随着 FDA 对生成式 AI 医疗工具监管指南的收紧，未来面临监管重新定性的潜在风险
              [CE003, CE010]。
            claimRefs:
