            title: 推迟 IPO 延长投资久期，重心转向拓宽平台版图
            body: >-
              CEO Virgílio Bento 将 IPO 推迟至至少 2028 年的战略决策，使 Sword 的投资属性从短期流动性催化转向需要多年深耕的执行型标的。投资者对 Sword 的评估，不能仅视其为 MSK
              细分龙头，而应视为一家正在向盆底健康与心理健康延伸的横向综合诊疗平台。
