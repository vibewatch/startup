      - number: '6.4'
        title: 图表
        blocks:
          - type: callout
            title: 迁移 Kaia Health 带来的投后客户流失风险
            body: >-
              Sword 以 $285M 收购 Kaia Health 固然通过德国 DiGA 准入斩获了可观的欧洲医保报销资产，却让 Kaia 在美国的商业存量客户面临剧烈的客户留存风险。如 Mutual of Omaha
              等客户当初特意选定 Kaia 基于智能手机摄像头的计算机视觉方案，正是为了避开繁琐的硬件邮寄物流并压低人均成本。若强迫这些企业客户切换至 Sword 重度依赖理疗师与传感器的模式，恐招致严重的客户流失与合同解约。
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
          - type: callout
            title: 疗效定价成为撬动企业采购的攻坚利器
            body: >-
              在充斥着供应商疲劳与福利委员会质疑的数字医疗市场中，Sword 的疗效定价（Outcome Pricing）结构充当了极为有效的差异化采购敲门砖。Sword
              将合同款项与患者自评疗效的实际改善硬性挂钩，摒弃了旱涝保收的每人每月（PEPM）被动收费，既消除了买方的决策顾虑，又为财务团队提供了可审计核算的医疗支出考核框架。
            calloutType: insight
            claimRefs:
              - CU010
              - CU011
  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 监管合规、执业资质准入与数据隐私
        blocks:
          - type: paragraph
            body: >-
              Sword Health 的数字医疗技术直接参与临床服务交付，因此身处监管严格的医疗领域。在加拿大，各省及地区对医疗专业人员设有执业要求；Sword
              的企业法人实体并不直接提供医疗服务，而是由持牌物理治疗师及临床心理医生等合规执业人员提供诊疗 [CR002]。这种组织架构需要完善的数据治理，以管理跨境流动的敏感健康记录、生物特征和运动传感器数据
              [CR003]。公司采集详细的生理、心理及传感器遥测数据，必须遵守加拿大及国际隐私法规 [CR004]。若不符合医疗器械法规、器械注册要求或各地临床人员执业规定，公司将持续面临运营风险 [CR009]。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
