  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范畴与临床延伸
        blocks:
          - type: paragraph
            body: >-
              评估 Sword Health 的可服务市场，先要划清直接数字肌肉骨骼（MSK）护理、相邻慢病管理和传统临床替代方案的边界。数字 MSK
              服务把传感器或计算机视觉辅助的物理治疗、持牌物理治疗师远程问诊，以及预防性运动健康计划送到会员家中。相关支出包括软件使用、临床团队管理、远程治疗监测和可穿戴运动追踪器等硬件；不包括急诊手术、住院、侵入性骨科治疗、脊柱注射，也不包括缺少医疗监督和临床疗效验证的通用健康或健身应用。品类还在从
              MSK
              康复延伸至女性盆底健康（Bloom）、慢性疼痛相关的行为健康（Mind）和临床正念。传统替代方案包括线下物理治疗门诊、骨科诊所、介入性疼痛管理机构及雇主现场职业治疗中心。诊所通常采购软件，用于医生处方的居家训练和远程监测；企业平台则直接与自保雇主福利计划和商业健康险签约，提供一体化诊疗服务。
            claimRefs:
