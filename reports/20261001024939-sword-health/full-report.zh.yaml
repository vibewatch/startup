  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 企业买方分层与支付方生态
        blocks:
          - type: paragraph
            body: >
              Sword Health 面向三类机构买方：自保雇主、商业健康险计划和国家级医疗系统。企业端的经济买方通常是全球福利副总裁、全面薪酬总监或首席人力资源官，他们希望控制不断增加的肌肉骨骼（MSK）理赔支出（这里的
              claims 指保险理赔，不是公司声称）。MSK 疾病是自保雇主医疗支出的主要来源之一；可避免的脊柱手术、影像检查和长期缺勤都会带来高额直接成本。Sword
              为会员提供虚拟物理治疗，安排持牌物理治疗师（DPT）并配备 FDA 列名的传感器引导型 Digital Therapist，力求在病情发展到需要手术前缓解疼痛。


              Sword 还通过中间渠道拓展企业客户，与 Mercer、WTW、Aon、Lockton 和 Gallagher 等员工福利顾问及经纪机构合作。这些机构评估临床证据，也是财富 1000
              强企业设计健康福利的重要把关方。除雇主直销外，Sword 也与健康险计划和转售渠道合作，例如将 MSK 康复接入 Alphabet 旗下 Onduo
              的慢病管理项目，覆盖心血管代谢疾病和糖尿病。在国际市场，Sword 面向公共医疗支付方，并与葡萄牙国家卫生服务局（SNS）及英国 NHS 基金会信托等机构签订全国性公共采购合约。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
