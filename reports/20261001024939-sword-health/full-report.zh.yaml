      - number: '8.3'
        title: 情景测算、估值倍数与回报周期
        blocks:
          - type: paragraph
            body: >-
              我们按 2028 年退出测算三种情景，分别设定不同的增长速度、多业务拓展进度和估值倍数。乐观情景的概率为 25%：Atlas、Bloom 和 Mind 加速增长，2028 年 ARR 达到 $600M；按
              12.0x 退出倍数计算，企业价值为 $7.2B，上行空间可观。基准情景的概率为 50%：ARR 复合年增长率放缓至 20%，2028 年达到 $400M；按 8.0x 软件估值倍数计算，企业价值为
              $3.2B，较当前 $4.0B 私募估值低 20%。悲观情景的概率为 25%：企业级单点方案日趋同质化，叠加健康险预算收紧，营收停滞在 $300M ARR；若按 4.0x 倍数估值，企业价值将缩水至
              $1.2B，引发严重的下调估值融资（down-round）稀释，并侵蚀后置轮次股份的清算优先权。
            claimRefs:
