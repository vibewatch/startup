  - number: 3
    title: 竞品分析
    sections:
      - number: '3.1'
        title: 竞争格局与主要同业画像
        blocks:
          - type: paragraph
            body: >-
              数字肌肉骨骼（MSK）市场已从零散的试点项目演变为高度集中的企业福利品类，由两大领头羊主导：Sword Health 与 Hinge Health。Hinge Health 凭借 2017
              年抢先上线的先发优势构筑了巨大的规模壁垒，最终完成公开上市，企业版图覆盖超过 2,800 家雇主客户、60 余家健康险公司与药品福利管理机构（PBM），覆盖保障人群超 2000 万人。在 Hinge
              之外，Omada Health
              等更广泛的慢病管理平台亦切入肌肉骨骼领域，将数字物理治疗与糖尿病、高血压及心血管代谢疾病管理打包。除风险投资支持及已上市的数字医疗公司外，传统线下门诊物理治疗机构和无指导的居家锻炼仍是根深蒂固的既有替代方案；尽管患者常年面临预约繁琐、门诊脱落率高及缺乏客观依从性监控等问题，这类方案依然分流了绝大多数商业保险理赔支出（业内统称为传统理赔存量）。
            claimRefs:
