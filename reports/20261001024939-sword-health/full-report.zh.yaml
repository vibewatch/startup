              Sword Health 展现了极强的私募资本号召力：其估值从 2021 年的 $1.8B 跃升至 2024 年 6 月的 $3B（通过 $130M 融资完成，含 $30M 新股与 $100M
              老股套现），随后又在 2025 年 6 月由 General Catalyst 领投的 $40M F 轮中抬升至 $4B。公司自述在 2025 年中已实现现金流转正，年化收入运行率达 $240M。CEO
              Virgílio Bento 未急于上市，而是将目标 IPO 窗口延至至少 2028
              年，理由是私募资本和老股二级市场仍可提供资金，并希望上市前先在多个业务领域建立规模化验证。这些私募资金支持了公司的并购整合，2026 年初以 $285M 收购 Kaia Health
              是其中一例。从投资判断看，Sword 仍有多项重大尽调障碍：缺少公开的经审计利润表；累计融资额从 $380M+ 到 $541M
              不等，各轮清算优先权的分配顺序不透明；快速并购和人员重组带来整合风险；估值也高度依赖未经公开市场检验的私募融资溢价。
