      - number: '3.2'
        title: 能力对比与技术护城河持久度
        blocks:
          - type: paragraph
            body: >-
              Sword Health 将其核心差异化建立在临床交付架构与自主知识产权之上。竞品方案在历史上多将可穿戴硬件传感器与非临床健康教练相结合来辅导会员锻炼，而 Sword Health 的 Thrive
              平台则把计算机视觉动作追踪与持牌物理治疗师（DPT）搭配，由治疗师负责设计、监督并推进个性化疗程。Sword 围绕运动追踪传感器、计算机视觉算法与临床反馈机制布局了超过 40
              项已授权专利筑牢护城河，其数字治疗平台亦获得 FDA 510(k) 医疗器械许可。为扩大业务覆盖面并反制竞品的平台整合策略，Sword 相继推出多款延伸临床模块：面向女性盆底健康的 Bloom、面向心血管代谢及
              GLP-1 伴随治疗的 Pulse，以及提供持续心理支持的 Mind。这些解决方案精准替代传统员工援助计划（EAP）与单一病种慢病管理单点方案，构建起横跨躯体与行为健康关联需求的多元病种服务平台。
