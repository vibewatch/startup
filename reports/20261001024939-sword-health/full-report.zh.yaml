        title: 收入来源、商业变现与定价机制
        blocks:
          - type: paragraph
            body: >-
              Sword Health 的收入主要来自与自保雇主、商业健康险和公共医疗系统签订的企业合约。核心服务按每人每月（PMPM）或每名参保会员计费，费用由赞助机构承担，会员无需自付。Thrive 交付的核心 MSK
              物理治疗是其历史收入的最主要来源，但 Sword 已开启多产品交叉销售，相继推出面向盆底健康的 Bloom、预防运动损伤的 Move、心血管代谢管理的 Pulse 以及心理健康的
              Mind。定价模式依企业档位运作，雇主买断全员接入权限；部分基于价值医疗的合同则引入了与临床疗效及手术规避挂钩的风险共担或里程碑付款机制。此外，2026 年 1 月以 $285M 收购 Kaia Health
              后，Sword 顺利打通 Kaia 的德国法定医疗保险（DiGA）报销通道，新增覆盖高达 7300 万人的公费报销网络。然而，真实的净成交价、客群折扣梯度，以及单一 MSK
