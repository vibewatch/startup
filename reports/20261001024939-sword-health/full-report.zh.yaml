      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 市场整合推动价值从单点方案流向统一平台
            body: >-
              企业级数字医疗市场正经历快速的横向整合。雇主与健康险对同时管理 MSK、心理健康和女性健康等多款割裂应用的繁琐局面日渐抵触。主流平台顺势借助战略并购拓宽品类边界——例如 Sword Health 计划收购
              Headspace，以及 Hinge Health 收购 Cylinder Health——推动垂直物理治疗供应商转型为综合虚拟医疗网络。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM011
          - type: callout
            title: 预算归属不明确与采购摩擦制约高速扩张
            body: >-
              尽管虚拟医疗理论上的总潜在市场庞大，但厂商面临漫长的企业采购周期。B2B 销售流程必须同时取得企业 HR
              福利负责人、临床评审委员会、财务部门和数据安全团队的共识。此外，会员参保率难以预测且使用参与度波动较大，致使企业 CFO 极难对多年期预算影响做出准确测算。
            calloutType: risk
            claimRefs:
