      - number: '2.3'
        title: 买方客群划分、预算分配与商业策略
        blocks:
          - type: paragraph
            body: >-
              虚拟肌肉骨骼和行为健康服务要实现商业化，必须适应不同支付方的预算归属和采购流程。企业市场中，自保雇主是主要买方，预算来自企业健康计划的理赔支出（这里的 claims
              指保险理赔，不是公司声称）和健康福利拨款。福利副总裁及人力资源高管关注降低整体医疗成本、减少员工缺勤和避免手术。在区域和全国性健康险计划中，首席医疗官、网络管理副总裁负责纯行政管理服务（ASO）及商业团险、Medicare
              Advantage、ACA 交易所等承担保险风险的业务；他们要求严格的精算证据，并要求服务接入现有控费流程。第三类是面向消费者的服务，以及由国家医疗系统赞助的项目；Sword
              在葡萄牙的全国部署就是一例。年度开放选保、福利续约和骨科理赔支出突然上升，往往会触发采购。供应商过多也让买方疲于应对，推动他们转向把 MSK、盆底和心理健康合并到同一企业协议中的方案。
