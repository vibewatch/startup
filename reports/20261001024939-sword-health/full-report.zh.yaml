          detail: 按决策树的局部边逐步评估路径，引导分诊对话，减少模型幻觉。
        - label: 临床协同与督导门户
          detail: 为持牌物理治疗师（DPT）提供自动化风险预警、依从性分析与疗程进阶建议。
        - label: 流式数据平台与持久工作流引擎
          detail: 管理分布式事件流水线、Iceberg 流式湖仓以及协调跨系统状态的 Temporal 持久工作流。
        - label: Sword Intelligence 企业级 Agent 网络
          detail: 在支付方与医疗机构环境中部署模块化运营 AI Agent，自动化处理待遇资格核验、分诊与高危会员触达。
    approximationNotes: 分层架构基于公开的工程招聘需求、技术白皮书及产品披露对各功能层作概念化梳理。
    claimRefs:
      - CE002
      - CE003
      - CE007
      - CE008
      - CE009
      - CE010
  - id: FU001
    title: 企业客户旅程与业务拓展动态
    type: journey-map
    summary: 企业客户从最初福利采购，到走向全球分支与全平台模块交叉销售的端到端演进路径。
    data:
      items:
        - label: 1. 福利评估与采购
          description: 企业福利委员会与经纪咨询机构（Mercer、Aon、WTW）评估 MSK 理赔支出（统称肌骨开支）、手术升级率及 ROI 测算模型。
          touchpoints:
            - 联合福利顾问开展方案征询（RFP）分析
            - 精算理赔审核与 ROI 预估
            - 明确疗效挂钩定价（Outcome Pricing）合同条款
        - label: 2. 试点启动与会员入组
          description: 借助内部沟通、HR 门户以及向员工家中寄送 FDA 列名传感器套件，针对高危员工群体展开首期落地。
          touchpoints:
            - 定向员工触达与健康宣讲会入组引导
            - 线上匹配物理治疗师并完成初诊评估
            - 将硬件传感器平板配送到员工家中
        - label: 3. 临床执行与实时跟踪
          description: 会员在运动学实时反馈指导下完成传感器引导的运动疗法，持牌物理治疗师同步监测依从性。
          touchpoints:
            - 借助动作传感器反馈运行 AI 治疗课时
            - 与持牌物理治疗师（DPT）展开异步图文沟通和视频随访
            - 收集患者自报疗效指标（PROM）
        - label: 4. 价值医疗计费与合同对账
          description: 客户财务与福利团队审阅季度业务回顾（QBR）报告，依照经核实的疼痛缓解疗效核对结算账单。
          touchpoints:
            - 季度业务回顾（QBR）理赔对账
            - 审核经验证的疼痛改善达标阈值
            - 依照实际临床改善成效结算发票
        - label: 5. 企业拓展与交叉销售
          description: 核心 MSK 疗效达标促成向海外分支机构的地域扩张（Atlas），并交叉销售盆底健康（Bloom）和心理健康（Mind）。
          touchpoints:
            - 推广至覆盖 40+ 个国家的海外分支机构
            - 延伸至 Bloom 女性健康与更年期护理
            - 引入 Mind 及数字分诊平台模块
        - label: 6. 合同续约与长期背书
          description: 年度续约谈判会审视多年期总留存率和净留存率、客户推荐案例及顾问背书。
          touchpoints:
            - 年度福利回顾与续约周期推进
            - 联合撰写案例研究并打造客户标杆
            - 签订多年期企业续约合同
    approximationNotes: 客户旅程各阶段综合自企业商业招聘说明书与 Sword 价值医疗合同框架。
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU008
      - CU010
      - CU011
