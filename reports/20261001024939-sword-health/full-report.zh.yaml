        title: 护城河持久度与负面竞争压力
        blocks:
          - type: paragraph
            body: >-
              尽管 Sword Health 展现出强劲的商业势头，截至 2025 年 6 月年化营收 Run-rate 达 $240M 且经营现金流转正，但仍面临若干结构性竞争风险。首先，Hinge Health
              的上市公司地位带来了更低的资金成本、可用作并购对价的公开流通股以及更高的财务透明度，而 Sword 已将预期上市窗口推迟至约 2028 年。其次，Sword 自述的 70% 竞标胜率与 3.7:1 的 ROI
              指标缺乏第三方的同台独立精算验证，可能引发严谨的机构福利买方质疑。第三，主流健康险整合方与导诊平台（如 Quantum Health）正加速整合平价通用型虚拟物理治疗模块，形成长期压价态势。为支撑其 $4.0B
              的高估值溢价，Sword 必须在持牌治疗师监督这一环节维持临床差异化，同时证明 Pulse 与 Mind 的跨病种渗透足以抵消纯 MSK 业务的增速放缓。
            claimRefs:
