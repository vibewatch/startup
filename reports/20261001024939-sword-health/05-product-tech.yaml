  - id: TE002
    title: Customer Journey and Clinical Workflow Transformation Table
    columns:
      - Care Workflow Stage
      - Traditional Care Workflow
      - Sword Health Technology Solution
      - Measurable Efficiency / Clinical Benefit
      - Technical / Operational Limitation
    rows:
      - - Member Onboarding & Triage
        - Primary care visit referral, manual phone scheduling, weeks of wait time
        - Digital intake with Arbor graph-orchestrated decision tree evaluation
        - Immediate 24/7 symptom screening; 57% lower latency vs single-prompt LLM triage
        - Edge-based tree requires pre-authored clinical branches; forward-only traversal limits backtracking
      - - Physical Therapy Delivery
        - In-clinic visits 2x/week, manual visual posture monitoring by therapist
        - At-home sessions guided by Phoenix AI Specialist with real-time biofeedback
        - 15M+ completed AI sessions; members report 3:1 average client gross ROI
        - Requires physical device / sensor setup and patient compliance in home environment
      - - Longitudinal Clinical Escalation
        - Asynchronous patient calls during office hours; missed warning signs
        - Continuous sensor telemetry analysis alerting dedicated Doctors of Physical Therapy
        - Clinicians review objective angle and completion metrics before modifying exercise progressions
        - Clinician caseload scaling caps gross margins compared to fully autonomous software
      - - Care Coordination & Administration
        - Call center staff handling eligibility, manual claim filing, and intake routing
        - Sword Intelligence Care Manager agents integrating with payer systems
        - Automated eligibility checks and high-risk member outreach without human staff scaling
        - Complex integration with disparate legacy payer eligibility and EHR architectures
    notes: "Workflow comparisons contrast conventional US outpatient rehabilitation pathways against Sword Health's hybrid AI-clinician model. Session metrics and ROI represent company-reported marketing and whitepaper figures."
