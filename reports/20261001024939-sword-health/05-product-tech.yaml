    title: Sword Health Multi-Tier Technology Architecture Stack
    type: stack
    summary: Six-tier technology stack illustrating Sword Health's transition from client-side biomechanical capture to enterprise operational intelligence.
    data:
      layers:
        - label: Member Interaction & Perception Layer
          detail: Captures real-time patient movement kinematics, pressure sensors, and conversational inputs via Thrive Pad, mobile app, and wearable devices.
        - label: Phoenix Real-Time Biomechanical AI
          detail: Processes video and sensor telemetry during active therapy sessions to provide instantaneous biofeedback and track movement compliance.
        - label: Arbor Graph-Orchestrated Conversational Triage
          detail: Traverses complex clinical decision trees using localized LLM edge evaluation to guide triage dialogues without hallucination.
        - label: Clinical Collaboration & Oversight Portal
          detail: Serves licensed Doctors of Physical Therapy with automated risk alerts, adherence analytics, and treatment progression recommendations.
        - label: Streaming Data Platform & Durable Workflow Engine
          detail: Manages distributed event pipelines, Iceberg streaming lakehouses, and Temporal durable workflows coordinating cross-system state.
        - label: Sword Intelligence Enterprise Agent Network
          detail: Deploys modular operational AI agents into payer and provider environments to automate eligibility, triage, and high-risk member outreach.
    approximationNotes: "Layer breakdown conceptualizes functional tiers based on published engineering hiring specifications, technical whitepapers, and product disclosures."
