  - id: TE003
    title: Technology Architecture and Operating Infrastructure Matrix
    columns:
      - Architecture Layer
      - Component / Engine
      - Technical Role & Capabilities
      - Underlying Dependency
      - Operational & Diligence Risk
    rows:
      - - Client & Perception Layer
        - Thrive Pad & Smartphone Vision
        - Motion capture, joint angle detection, and real-time auditory/visual feedback
        - Device cameras, Bluetooth BLE sensors, local on-device inference
        - Sensor calibration errors, ambient lighting variations, hardware replacement costs
      - - Clinical Reasoning Engine
        - Phoenix AI Care Specialist
        - Evaluates patient biomechanics, movement adherence, and session pacing
        - Clinical protocol rule engines paired with Doctor of Physical Therapy portal
        - False negatives in detecting compensatory movements or acute patient distress
      - - Conversational Triage
        - Arbor Decision Framework
        - Decomposes 400+ node clinical decision trees into normalized edge evaluations
        - Foundation LLM inference APIs (proprietary and open-weight models)
        - Latency overhead on real-time voice; state drift over extended conversational turns
      - - Data Lakehouse & Streaming
        - Distributed Lakehouse Infrastructure
        - Real-time ingestion of session telemetry, event streaming, and ML feature stores
        - Apache Iceberg table format, streaming engines (Flink/Spark), durable execution (Temporal)
        - High-throughput streaming costs; distributed pipeline degradation across global regions
      - - Enterprise Operational AI
        - Sword Intelligence Agents
        - Autonomous intake, benefit eligibility checking, and member retention outreach
        - Payer clearinghouse APIs, EHR HL7/FHIR interfaces, telephony/SMS gateways
        - Payer API rate limits, eligibility data inaccuracies, member contact fatigue
      - - Security & Governance
        - Compliance Control Harness
        - End-to-end encryption, audit logging, annotator feedback loops, clinical guardrails
        - SOC 2 Type II, HIPAA, and HITRUST certified cloud infrastructure
        - Shifting state and federal AI governance rules regarding automated clinical triage
    notes: "Architecture components and dependencies compiled from Sword Health engineering disclosures, job specifications, and technical whitepapers. Ingestion throughput and specific cloud hosting tiers are undisclosed private metrics."
