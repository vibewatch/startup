evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Complete board roster, committee charters, voting arrangements, founder ownership, and executive succession plan.
    whyItMatters: >-
      One disclosed investor director and a partial officer list cannot establish governance independence, control, or
      continuity.
    diligencePath: >-
      Request the current board and committee materials, charter documents, cap table, voting agreements, and succession
      plan from management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: Audited revenue, ARR reconciliation, gross margin, cash balance, debt, and customer cohort schedules.
    whyItMatters: >-
      Public funding and analyst run-rate figures cannot establish operating performance, liquidity, or valuation
      support.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, bank and debt statements, and contract-level ARR
      and retention schedules.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated HR roster reconciling third-party workforce figures of 650 and the 1,001-5,000 employee band.
    whyItMatters: Workforce scale affects operating leverage, burn assessment, and the credibility of current company profiles.
    diligencePath: >-
      Request a dated employee census by function, geography, employment status, and recent hiring or reduction
      activity.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: Exhaustive investor ownership, preference, transfer, and customer-concentration schedules.
    whyItMatters: >-
      Named financing participants and buyer groups do not reveal economic control, downside seniority, or revenue
      concentration.
    diligencePath: Review the fully diluted cap table, financing documents, secondary transfers, and top-customer revenue schedule.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-breakdown
    missingEvidence: >-
      Independent actuarial breakdown isolating Serviceable Addressable Market (SAM) specifically for enterprise
      employer-sponsored digital MSK benefits versus Medicaid or direct consumer spend.
    whyItMatters: >-
      Broad global disease burden figures (2B people) overstate the immediate commercially billable software market
      available to venture-backed platforms.
    diligencePath: >-
      Review employer health benefit surveys (e.g. Mercer, Willis Towers Watson) and actuaries' commercial adoption
      forecasts.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - id: gap-roi-validation
    type: private-evidence-only
    severity: material
    topic: roi-actuarial-audit
    missingEvidence: >-
      Third-party audited claims data verifying Sword's $1B+ claimed cost savings and specific medical loss ratio
      reduction figures across mature employer cohorts.
    whyItMatters: >-
      Value-based fees and enterprise contract renewals depend on proving hard medical cost reduction rather than
      self-reported model assumptions.
    diligencePath: >-
      Request blinded Milliman or equivalent actuarial audit reports comparing matched-cohort claims spend between
      active participants and control groups.
    relatedQuestionRefs:
      - QM004
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitive-benchmarking
    missingEvidence: >-
      Independent, head-to-head actuarial evaluation comparing net claims cost reduction and sustained recovery rates
      between Sword Health and Hinge Health on identical employer cohorts.
    whyItMatters: >-
      Without third-party comparative actuarial data, commercial selection relies on vendor-reported clinical studies
      and pricing guarantees, obscuring true relative ROI differences across risk profiles.
    diligencePath: >-
      Request third-party actuarial studies or anonymized claims analyses from shared enterprise benefit consultant
      brokerages (e.g., Mercer, Aon, Willis Towers Watson).
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: gaap-financial-statements
    missingEvidence: Audited GAAP financial statements including detailed income statements, balance sheets, and cash flow statements.
    whyItMatters: >-
      Without audited financials, self-reported cash-flow positivity, revenue run rates, and operating leverage cannot
      be confirmed for underwriting.
    diligencePath: >-
      Request audited GAAP financial statements for FY2023-FY2025 under non-disclosure agreement during management
      diligence.
  - type: missing-source
    severity: material
    topic: cogs-breakdown
    missingEvidence: >-
      Granular cost of goods sold (COGS) breakdown distinguishing hardware sensor manufacturing/shipping logistics from
      clinical labor.
    whyItMatters: >-
      Prevents independent determination of gross margin profiles between sensor-dependent MSK therapy and software-only
      modules.
    diligencePath: Obtain per-member unit economic schedule and sensor BOM/amortization accounting models from company finance.
  - type: private-evidence-only
    severity: material
    topic: client-retention-nrr
    missingEvidence: Net Revenue Retention (NRR) and gross revenue retention cohorts segmented by client vintage and contract type.
    whyItMatters: >-
      Verifies whether top-line expansion is driven by sustainable enterprise expansion and renewals versus aggressive
      new client acquisition.
    diligencePath: Request historical customer cohort retention matrix and annual contract value renewal schedules.
  - type: private-evidence-only
    severity: material
    topic: retention-and-nrr
    missingEvidence: >-
      Audited gross revenue retention (GRR) and net revenue retention (NRR) cohorts broken down by enterprise client
      vintage year.
    whyItMatters: >-
      Without audited retention curves, investors cannot verify whether revenue expansion is driven by genuine employer
      account durability versus one-time upfront hardware deployments.
    diligencePath: >-
      Request confidential customer cohort retention tables, logo churn logs, and contract renewal bridge schedules
      during formal pre-IPO diligence.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: kaia-client-retention
    missingEvidence: >-
      Empirical customer renewal and churn figures for former Kaia Health U.S. payer and employer accounts undergoing
      platform migration.
    whyItMatters: >-
      Determines whether the $285 million acquisition generates accretive recurring revenue or triggers high customer
      contract attrition.
    diligencePath: >-
      Review post-acquisition customer migration audit logs and interview benefits leadership at Mutual of Omaha and
      former Kaia health plan accounts.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: employer customer concentration
    missingEvidence: >-
      Disclosed revenue and covered life concentration across top self-insured employer clients and national Blue Cross
      Blue Shield health plan partners.
    whyItMatters: >-
      Concentration in a small number of enterprise accounts or risk-bearing health plans creates elevated revenue
      volatility if renewal terms change.
    diligencePath: Request customer-level revenue breakdowns and health plan distribution partner contract terms during diligence.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: regulatory legal risk register
    missingEvidence: >-
      Comprehensive regulatory audit across US states regarding corporate practice of medicine (CPOM) and physical
      therapy telehealth licensing reciprocity.
    whyItMatters: >-
      Telehealth clinical operations require multi-state therapist licensure and compliant management services
      organization (MSO) structures.
    diligencePath: Examine Sword's professional corporation (PC/MSO) legal agreements and state-by-state clinician license filings.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-margins
    missingEvidence: Audited GAAP financial statements disclosing gross margin, clinician labor expenses, and hardware logistics costs.
    whyItMatters: >-
      Without audited gross margin data, evaluating long-term software operating leverage versus services-heavy delivery
      is impossible at 16.7x ARR.
    diligencePath: >-
      Request audited 2024-2025 financial statements and contribution margin breakdown by product module in management
      diligence.
  - type: private-evidence-only
    severity: material
    topic: cap-table-liquidation-waterfall
    missingEvidence: >-
      Full capitalization table and liquidation preference waterfall across Series D, Series E, Series F, and Junior
      classes.
    whyItMatters: >-
      Senior liquidation preferences and non-participating conversion ratios directly determine common equity recovery
      thresholds in downside M&A or down-round scenarios.
    diligencePath: >-
      Review the full certificate of incorporation, preference stack, and option pool dilution terms in the legal data
      room.
