callouts:
  - calloutType: "risk"
    title: "Actuarial Vulnerability in Commercial Performance Guarantees"
    body: "Milliman's independent actuarial review underscores that Sword's ROI guarantees rely on an observational difference-in-differences model applied to utilized members rather than eligible employee populations. Because engaged members inherently possess higher treatment motivation, reported healthcare cost reductions may reflect unobserved member selection rather than isolated program efficacy [CR005]. As self-insured employers scrutinize digital health expenditures, reliance on self-reported savings without independent claims replication exposes Sword to contractual clawbacks or procurement friction [CR001]."
    claimRefs:
      - "CR001"
      - "CR005"
  - calloutType: "insight"
    title: "Strategic Trade-Off of IPO Deferral into 2028"
    body: "Postponing the IPO to at least 2028 protects Sword from public digital health multiple compression—where peers trade at 4x-6x revenue—while allowing Bento to build clinical proof points across cardio, gastrointestinal, and speech verticals [CR007, CR010]. However, maintaining a $4.0B+ private valuation across an extended multi-year window creates liquidity overhang and necessitates recurring secondary tender offers for staff retention [CR011]."
    claimRefs:
      - "CR007"
      - "CR010"
      - "CR011"
