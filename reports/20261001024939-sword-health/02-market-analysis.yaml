callouts:
  - calloutType: "insight"
    title: "Market Consolidation Shifts Value from Point Solutions to Unified Platforms"
    body: "The enterprise digital health market is undergoing rapid horizontal consolidation. Employers and health plans are resisting vendor fatigue caused by managing disconnected apps for MSK, mental health, and women's health. Major platforms are responding by expanding their category boundaries via strategic M&A—such as Sword Health's planned acquisition of Headspace and Hinge Health's acquisition of Cylinder Health—transforming specialized physical therapy vendors into comprehensive virtual care networks."
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM010"
      - "CM011"
  - calloutType: "risk"
    title: "Budget Attribution and Procurement Friction Constrain Rapid Expansion"
    body: "Despite sizable theoretical total addressable markets, virtual care vendors face elongated enterprise procurement cycles. B2B sales cycles require simultaneous consensus among corporate HR benefit leaders, clinical oversight committees, finance departments, and data security teams. Furthermore, unpredictable member enrollment and varying engagement rates make multi-year budget impact forecasting challenging for employer CFOs."
    claimRefs:
      - "CM001"
      - "CM013"
      - "CM014"
