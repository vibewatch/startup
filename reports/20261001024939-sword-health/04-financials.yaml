company:
  name: "Sword Health"
chapter:
  number: 4
  title: "Financials"
  summary: "Sword Health reported an annual revenue run rate of $240M as of mid-2025 alongside self-reported cash-flow positivity, powered by enterprise employer and health plan adoption of its virtual physical therapy platform. However, underwriting the business is constrained by the complete absence of audited GAAP financial disclosures, undisclosed gross margins, unverified hardware amortization schedules, and reliance on private step-up rounds and debt-or-equity M&A including its $285M acquisition of Kaia Health."
sections:
  - id: "revenue-streams-and-pricing-architecture"
    title: "Revenue Streams, Commercial Monetization, and Pricing Mechanics"
    body: "Sword Health generates revenue primarily through enterprise commercial agreements with self-insured employers, commercial health plans, and public healthcare systems. The core commercial engine is contracted on a per-member-per-month (PMPM) or per-enrolled-member basis, with programs provided at no direct out-of-pocket cost to members as coverage is fully absorbed by sponsoring organizations. While core MSK physical therapy through Thrive represents the primary historical revenue contributor, Sword has introduced multi-product cross-selling through Bloom for pelvic health, Move for injury prevention, Pulse for cardiometabolic care, and Mind for mental health support. Pricing models operate on enterprise tiers where employers sponsor comprehensive access, with certain value-based contracts incorporating risk-sharing or milestone payments tied to clinical outcomes and surgical avoidance. Furthermore, the $285M acquisition of Kaia Health in January 2026 integrated Kaia's German statutory health insurance (DiGA) pathway, adding public reimbursement covering up to 73 million lives. However, realized net pricing, cohort-level discount schedules, and revenue mix across standalone MSK versus bundled offerings remain tightly held private data."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "unit-economics-and-cost-structure"
    title: "Cost Structure, Unit Economics, and Operational Efficiency"
    body: "Evaluating Sword Health's unit economics requires analyzing the structural cost divergence between sensor-based hardware delivery and software-driven AI care. Historically, Sword's primary cost driver was the delivery of its Digital Therapist platform, requiring physical shipment of wearable inertial measurement units (IMUs), tablet hardware, and device logistics, which introduced meaningful Cost of Goods Sold (COGS) and inventory friction. Clinician labor represents the other primary operating cost; however, Sword implemented efficiency-driven restructurings in late 2024 that trimmed clinician roles as its AI care specialist Phoenix assumed broader automated supervision. The acquisition of Kaia Health provided markerless computer vision ('Motion Coach') technology, enabling a hybrid model where lower-acuity members avoid hardware shipments altogether, reducing marginal fulfillment costs and customer acquisition cost (CAC). Nevertheless, without audited GAAP filings, fundamental unit economic metrics—including gross margin percentages, customer payback periods, Net Revenue Retention (NRR), and per-member servicing expenses—remain unverified company assertions."
    claimRefs:
      - "CI005"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-diligence-verdict"
    title: "Capital Adequacy, Cash Runway, M&A Expansion, and Diligence Blockers"
    body: "Sword Health has demonstrated substantial access to private capital, lifting its valuation from $1.8B in 2021 to $3B in June 2024 (via a $130M round including $30M primary and $100M secondary liquidity), and subsequently to $4B in June 2025 via a $40M Series F round led by General Catalyst. The company reported reaching cash-flow positivity by mid-2025 and achieving an annual revenue run rate of $240M. Rather than pursuing an immediate public listing, CEO Virgílio Bento shifted Sword's target IPO timeline to at least 2028, citing the availability of private capital and secondary markets while positioning the company for multi-vertical proof points. This private capital buffer financed programmatic consolidation, culminating in the $285M acquisition of Kaia Health in early 2026. However, from an underwriting standpoint, Sword presents serious diligence blockers: the lack of public audited income statements, opaque liquidation preference waterfalls across its $380M+ to $541M cumulative capital base, integration churn from rapid M&A, workforce restructurings, and heavy valuation dependence on private venture step-ups in contrast to public peer scrutiny."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
