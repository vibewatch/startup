callouts:
  - calloutType: "risk"
    title: "Opaque Private Unit Economics vs. Public Scrutiny"
    body: "While Sword Health achieved a $4B valuation and a reported $240M revenue run rate, its financials remain completely unaudited in the public domain. The company's delay of its IPO to at least 2028 insulates it from public scrutiny but prevents independent validation of its gross margins, clinical labor expenses, and true organic churn."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI016"
  - calloutType: "insight"
    title: "Strategic Margin Expansion via Kaia Computer Vision M&A"
    body: "Sword's $285M acquisition of Kaia Health directly addresses its primary cost vulnerability—the logistics, inventory, and COGS burden of physical sensor kits. Integrating Kaia's computer vision for lower-acuity populations creates a bifurcated delivery architecture designed to protect gross margins."
    claimRefs:
      - "CI005"
      - "CI007"
      - "CI014"
