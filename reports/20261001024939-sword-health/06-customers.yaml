  - id: "named-deployments-and-retention-risks"
    title: "Named Client Implementations and Consolidation Risks"
    body: |
      Sword's commercial proof includes deployments across multinational corporations, commercial health plans, and national healthcare systems. Key enterprise accounts include Pearson, where Vice President of Global Benefits Stacey Rodgers cited Sword's clinical rigor and international deployment capacity across 40+ countries in selecting the Atlas platform to address global workforce pain and absenteeism. In public healthcare, Sword achieved a major milestone by contracting with Portugal's National Health Service (SNS) to deliver AI-supported virtual physical therapy nationwide, expanding rehabilitative care access across rural and underserved populations while relieving public hospital waitlists. In the UK public sector, Sword acquired Surgery Hero and established partnerships with Guy's and St Thomas' NHS Foundation Trust.

      Despite these reference customer wins, Sword faces significant customer retention, platform expansion, and concentration risks. In January 2026, Sword completed the $285 million acquisition of Munich-based competitor Kaia Health to capture Germany's statutory DiGA reimbursement moat covering 70 million lives. However, this acquisition introduces substantial customer migration friction: Kaia's U.S. clients, including major relationships such as Mutual of Omaha and UnitedHealth Group partnerships, originally selected a lightweight, camera-based computer vision solution without external hardware. Sword's strategy of migrating U.S. Kaia accounts to its sensor-and-therapist platform carries severe risk of client churn if buyers resist increased hardware logistics and higher per-episode costs. Furthermore, Sword has not publicly disclosed audited cohort net revenue retention (NRR) or gross renewal rates, leaving long-term enterprise renewal durability unverified.
