callouts:
  - calloutType: "risk"
    title: "Post-Merger Customer Attrition Risk from Kaia Health Migration"
    body: "Sword's $285M acquisition of Kaia Health brings substantial European reimbursement assets via German DiGA approvals, but poses acute customer retention risks across Kaia's U.S. commercial book. Accounts such as Mutual of Omaha specifically chose Kaia's camera-based smartphone computer vision solution to avoid hardware shipping logistics and keep per-member costs low. Forcing these enterprise accounts to transition to Sword's therapist-intensive, sensor-dependent model risks substantial customer churn and contract non-renewals."
    claimRefs:
      - "CU014"
      - "CU015"
  - calloutType: "insight"
    title: "Outcome-Based Billing as an Enterprise Procurement Weapon"
    body: "In a digital health market plagued by vendor fatigue and skeptical benefits committees, Sword's Outcome Pricing structure serves as an effective procurement differentiator. By tying contract fees to verifiable patient-reported outcome improvements rather than passive per-employee-per-month (PEPM) fees, Sword overcomes buyer hesitation and provides finance teams with an auditable framework for healthcare expenditure."
    claimRefs:
      - "CU010"
      - "CU011"
