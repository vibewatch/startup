  title: "Customers"
  summary: "Sword Health serves over 1,000 to 2,000 enterprise employer clients and public health institutions globally, delivering 15 million AI care sessions across self-insured benefit plans, health systems, and national public-sector contracts. While outcome-based pricing, DiGA statutory reimbursement in Germany, and a nationwide rollout with Portugal's National Health Service demonstrate institutional traction, commercial expansion faces platform integration hurdles, employer renewal opacity, and customer migration friction following the $285M acquisition of Kaia Health."
sections:
  - id: "customer-segmentation-and-buyer-dynamics"
    title: "Enterprise Buyer Segmentation and Payer Ecosystem"
    body: |
      Sword Health structures its commercial go-to-market around three primary institutional customer segments: self-insured enterprise employers, commercial health plans, and public national health systems. The primary enterprise economic buyer is typically a Vice President of Global Benefits, Total Rewards Director, or Chief Human Resources Officer seeking to curb escalating musculoskeletal (MSK) claims expenditures. Musculoskeletal conditions represent one of the largest drivers of self-insured medical spend, characterized by high direct costs from avoidable spinal surgeries, diagnostic imaging, and prolonged absenteeism. Sword targets these corporate accounts by delivering virtual digital physical therapy that pairs members with licensed Doctors of Physical Therapy (DPTs) alongside an FDA-listed sensor-guided Digital Therapist, aiming to resolve pain upstream before costly surgical intervention occurs.

      To scale distribution across commercial accounts, Sword relies on intermediary channel relationships, partnering with leading employee benefits consulting and brokerage firms including Mercer, WTW, Aon, Lockton, and Gallagher. These advisory firms evaluate clinical evidence and act as gatekeepers for Fortune 1000 employer health plan designs. Beyond employer direct sales, Sword has expanded into health plan partnerships and reseller channels, including collaborations with Alphabet's Onduo precision health platform to integrate MSK rehabilitation into broader chronic condition programs covering cardiometabolic disease and diabetes. In international markets, Sword targets public healthcare payers, securing nationwide public procurement contracts such as its partnership with Portugal's National Health Service (Serviço Nacional de Saúde, SNS) and NHS foundation trusts in the United Kingdom.
