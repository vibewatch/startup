  topStrengths:
    - Scaled enterprise and public-sector traction across employers, health plans, and national health systems.
    - Broadening care platform beyond core musculoskeletal therapy into adjacent clinical categories.
    - Large June 2025 financing at a $4.0 billion valuation signals investor confidence and continued growth capacity.
  topRisks:
    - Independent actuarial and clinical validation of ROI and outcomes remains incomplete.
    - Private-market valuation remains stretched relative to public digital-health peers.
    - IPO timing pushed to at least 2028 extends duration risk and illiquidity.
  unresolvedGaps:
    - Independent actuarial validation of ROI and pain-reduction claims across engaged and non-engaged cohorts.
    - Audited GAAP financial statements with gross margin and hardware deployment cost breakdowns.
    - Renewal cohorts and net revenue retention by vintage year for enterprise customers.
    - Cap table, preference stack, and liquidation waterfall for downside valuation modeling.
    - Commercial contribution from Bloom and Mind relative to core musculoskeletal revenue.
