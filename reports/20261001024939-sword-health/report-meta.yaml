companyProfile:
  summary: >-
    Sword Health is a late-stage private digital-care company founded in Portugal in 2015 and now headquartered in New
    York. The platform combines AI-guided musculoskeletal care with adjacent programs in pelvic health, movement,
    cardiometabolic support, and mental health, delivered through licensed clinicians and sold primarily to employers,
    health plans, and public-sector buyers. Public evidence indicates meaningful enterprise and national-system
    traction, including a June 2025 financing at a $4.0 billion valuation and a June 2026 Portugal-wide contract, but
    core financial and ownership details remain only partially disclosed.
