        - $1.2B Enterprise Value based on 4.0x ARR multiple; liquidation preferences absorb equity value
        - Down-round financing or distressed M&A; common equity dilution and option impairment
        - 25%
    notes: Valuation models project enterprise value at targeted 2028 exit against normalized revenue multiples.
