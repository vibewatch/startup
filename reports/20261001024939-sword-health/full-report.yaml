              - CU015
      - number: '6.2'
        title: Member Utilization Trajectory and Expansion Mechanics
        blocks:
          - type: paragraph
            body: >
              Sword Health's customer adoption trajectory reflects rapid operational expansion across enrolled
              enterprise employee populations. According to company disclosures and commercial enterprise postings,
              Sword's footprint has scaled from 700,000 members and 10 million completed AI sessions across 1,000+
              enterprise clients to more than 1,000,000 members completing over 15 million AI sessions across 2,000+
              enterprise accounts in North America and Europe. This operational velocity is supported by a growing
              enterprise customer success team responsible for post-sale implementation, user onboarding, and member
              utilization metrics. Enterprise customer success directors oversee customer coverage ratios, quarterly
              business reviews (QBRs), and annual renewal readiness plans to ensure client workforces achieve meaningful
              clinical milestones.


              Customer engagement is tied directly to Sword's commercial monetization model through its proprietary
              Outcome Pricing framework. Under this arrangement, employer clients do not pay full contract fees unless
              enrolled employees achieve predefined, clinically validated health improvements, such as documented pain
              reduction thresholds on patient-reported outcome measures. To validate economic returns, Sword has
              commissioned third-party actuarial and consulting reviews, such as methodology analyses by Risk Strategies
              Consulting, pointing to an estimated 3.2:1 return on investment (ROI). However, external diligence reveals
              that member engagement varies widely across employee demographics, with digital literacy, smartphone
              access, and persistent hardware logistics posing ongoing barriers to sustained member adherence.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
