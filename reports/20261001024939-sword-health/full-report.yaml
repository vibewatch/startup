        title: Financing History and Stakeholder Structure
        blocks:
          - type: paragraph
            body: >-
              Sword's financing record shows progression from an $85 million Series C in June 2021 to a
              company-announced $40 million round at a $4 billion valuation in June 2025. The later round was led by
              General Catalyst and included Khosla Ventures, Comcast Ventures, Lince Capital, Oxy Capital, Armilar,
              Indico Capital, and Shilling; the announcement also identified General Catalyst's Chris Bischoff as a
