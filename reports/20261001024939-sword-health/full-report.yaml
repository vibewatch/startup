      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Post-Merger Customer Attrition Risk from Kaia Health Migration
            body: >-
              Sword's $285M acquisition of Kaia Health brings substantial European reimbursement assets via German DiGA
              approvals, but poses acute customer retention risks across Kaia's U.S. commercial book. Accounts such as
              Mutual of Omaha specifically chose Kaia's camera-based smartphone computer vision solution to avoid
              hardware shipping logistics and keep per-member costs low. Forcing these enterprise accounts to transition
              to Sword's therapist-intensive, sensor-dependent model risks substantial customer churn and contract
              non-renewals.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
          - type: callout
            title: Outcome-Based Billing as an Enterprise Procurement Weapon
            body: >-
              In a digital health market plagued by vendor fatigue and skeptical benefits committees, Sword's Outcome
              Pricing structure serves as an effective procurement differentiator. By tying contract fees to verifiable
              patient-reported outcome improvements rather than passive per-employee-per-month (PEPM) fees, Sword
              overcomes buyer hesitation and provides finance teams with an auditable framework for healthcare
              expenditure.
            calloutType: insight
            claimRefs:
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, Professional Licensure, and Data Privacy
        blocks:
          - type: paragraph
            body: >-
              Sword Health operates across highly regulated healthcare environments where digital health technology
              interfaces directly with clinical care delivery. In Canada, provincial and territorial rules govern
              healthcare professionals, and Sword's corporate entity does not directly provide health services; rather,
              care is rendered by regulated health professionals such as licensed physiotherapists and clinical
              psychologists [CR002]. This organizational structure requires robust data governance mechanisms to manage
              sensitive personal health records, biometrics, and exercise sensor feeds across borders [CR003]. Under
              Canadian and international privacy standards, the company collects detailed physical, mental, and sensor
              telemetry that must comply with strict statutory protections [CR004]. Failure to maintain rigorous
              compliance with medical device regulations, device listings, and regional clinician licensing frameworks
              creates ongoing operational exposure [CR009].
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
