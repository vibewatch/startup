      - number: '2.3'
        title: Buyer Segmentation, Budget Allocation, and Commercial Strategy
        blocks:
          - type: paragraph
            body: >-
              Commercial traction in virtual musculoskeletal and behavioral care depends on navigating distinct payer
              architectures, each governed by specific budget ownership and procurement mechanics. In the commercial
              enterprise segment, self-insured employers act as primary buyers, funding benefits out of corporate health
              plan claims budgets and wellness allocations. Benefits vice presidents and human resource executives
              prioritize total cost-of-care reduction, employee absenteeism mitigation, and measurable surgical
              avoidance. Within regional and national health plans, Chief Medical Officers and Vice Presidents of
              Network Management manage Administrative Services Only (ASO) and fully insured risk-bearing lines of
              business (commercial group, Medicare Advantage, ACA exchanges), demanding rigorous actuarial proof and
              integration with core utilization workflows. A third emerging segment involves direct-to-consumer and
              national health system sponsorships, exemplified by Sword's nationwide public deployment in Portugal.
              Commercial adoption triggers typically align with annual open enrollment cycles, benefits renewals, and
              sudden spikes in orthopedic claims spend. However, vendor proliferation has created buyer fatigue,
              accelerating demand for bundled cross-condition offerings that combine MSK, pelvic health, and mental
              health under unified enterprise agreements.
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM013
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
