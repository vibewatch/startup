      - number: '3.2'
        title: Capability Comparison and Technical Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Sword Health anchors its core differentiation on clinical delivery architecture and proprietary
              intellectual property. Whereas competitor models have historically combined wearable hardware sensors with
              non-clinical health coaches to guide member sessions, Sword Health's Thrive platform pairs computer vision
              motion tracking with licensed Doctors of Physical Therapy who design, monitor, and clinically advance
              treatment protocols. Sword protects this approach with more than 40 granted patents covering
              motion-tracking sensors, computer vision algorithms, and clinical feedback mechanisms, achieving FDA
              510(k) clearance for its digital therapy platform. To expand its addressable footprint and counter
              competitor platform consolidation, Sword has introduced adjacent clinical modules: Bloom for women's
              pelvic health, Pulse for cardiometabolic health and GLP-1 companion care, and Mind for continuous mental
              health support. These solutions deliberately target legacy employee assistance programs and chronic
              disease point solutions, establishing a multi-condition platform capable of serving enterprise employers
              across interconnected physical and behavioral health needs.
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
