      - number: '7.2'
        title: Methodological Selection Bias, Clinical Evidence, and Operational Execution
        blocks:
          - type: paragraph
            body: >-
              A central pillar of Sword Health's commercial positioning is its guarantee of clinical outcomes and return
              on investment for self-insured employers. However, an independent actuarial review conducted by Milliman
              in September 2026 identified significant methodological limitations in Sword's expanded ROI framework
              [CR001]. Specifically, Milliman emphasized that Sword defines its intervention cohort by program
              utilization rather than general eligibility or access, creating material selection bias where engaged
              participants differ systematically from the broader population in motivation and baseline health [CR005].
              Furthermore, for members enrolled concurrently across multiple Sword programs—such as Thrive for
              musculoskeletal care, Bloom for women's pelvic health, and Mind for mental health—Sword's methodology
              assigns members solely to the first charged engagement and does not isolate the independent financial
              effect of each intervention [CR006]. While Sword markets clinical outcomes such as 72% of members becoming
              free of limiting pain by program completion, these results rely on engaged cohort completions rather than
              intention-to-treat employer-wide populations [CR008]. These analytical limitations represent a material
              commercial risk as sophisticated enterprise benefits buyers demand rigorous actuarial validation.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
      - number: '7.3'
        title: Valuation Multiples, Exit Timelines, and Platform Expansion Dependencies
        blocks:
          - type: paragraph
            body: >-
              Sword Health raised $40 million at a $4.0 billion valuation in June 2025, representing a 33% step-up over
              its prior valuation, and management has signaled intentions to pursue further capital rounds at valuations
              up to $5.0 billion [CR007]. Concurrently, CEO Virgílio Bento disclosed that the company postponed its
              initial public offering timeline from a possible 2025 listing to at least 2028, citing an educational
              journey on public markets and a strategic preference to establish multi-vertical proof points at scale
              before listing [CR010]. Delaying liquidity into late 2028 concentrates duration risk and heightens
              dependency on private secondary markets for shareholder and employee liquidity [CR011]. Scaling the
              clinical model also requires sustained hiring of licensed clinicians, such as remote physiotherapists in
              Portugal and North America, who must demonstrate AI tool proficiency while managing clinical duties
              [CR012]. As macroeconomic and enterprise benefit budgets tighten, sustaining premium private multiples
              against public peer benchmarks will require flawless clinical execution and demonstrable unit economics.
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Actuarial Vulnerability in Commercial Performance Guarantees
            body: >-
              Milliman's independent actuarial review underscores that Sword's ROI guarantees rely on an observational
              difference-in-differences model applied to utilized members rather than eligible employee populations.
              Because engaged members inherently possess higher treatment motivation, reported healthcare cost
              reductions may reflect unobserved member selection rather than isolated program efficacy [CR005]. As
              self-insured employers scrutinize digital health expenditures, reliance on self-reported savings without
              independent claims replication exposes Sword to contractual clawbacks or procurement friction [CR001].
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
          - type: callout
            title: Strategic Trade-Off of IPO Deferral into 2028
            body: >-
              Postponing the IPO to at least 2028 protects Sword from public digital health multiple compression—where
              peers trade at 4x-6x revenue—while allowing Bento to build clinical proof points across cardio,
              gastrointestinal, and speech verticals [CR007, CR010]. However, maintaining a $4.0B+ private valuation
              across an extended multi-year window creates liquidity overhang and necessitates recurring secondary
              tender offers for staff retention [CR011].
            calloutType: insight
            claimRefs:
              - CR007
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Recommendation and Valuation Framework
        blocks:
          - type: paragraph
            body: >-
              Sword Health presents a compelling clinical and operational transformation in virtual musculoskeletal
              care, but its current private market pricing disconnects from prevailing public market fundamentals. At a
              $4.0 billion Series F valuation, the company trades at an estimated 16.7x multiple on its reported $240
              million annual revenue run rate. In contrast, publicly traded digital health and virtual care peers trade
              at median enterprise value multiples between 3.0x and 6.0x revenue. While Sword's reported positive cash
              flow and rapid expansion across 2,000+ enterprise clients provide downside protection against immediate
              solvency distress, the stretched valuation multiple leaves zero margin of safety for growth deceleration
              or contract renewal friction. We assign Sword Health an overall recommendation of track with a high risk
              rating and a stretched valuation stance. Meaningful growth capital deployment should be withheld until
              secondary market clearing prices normalize closer to peer benchmarks or multi-condition ARR expansion is
              validated by audited financial reporting.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV010
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV014
      - number: '8.2'
        title: Core Thesis and Counter-Thesis Dynamics
        blocks:
          - type: paragraph
            body: >-
              The bull thesis for Sword Health rests on genuine technology differentiation, proprietary machine learning
              models, and early operational leverage within self-insured employer health plans. Sword's Phoenix AI
              platform and 37+ patents have enabled over 1,000,000 enrolled members to receive remote care, achieving
              reported 70% competitive win rates and significant surgical avoidance. Furthermore, management's ability
              to reach cash-flow positive operations distinguishes Sword from capital-consumptive peers that struggled
              following aggressive 2021 funding cycles. Conversely, the anti-thesis highlights substantial single-point
              buyer fatigue among enterprise benefits managers who increasingly favor comprehensive benefits aggregators
              over standalone MSK point solutions. In addition, Sword's aggressive expansion into women's pelvic health
              (Bloom) and behavioral health (Mind) creates execution complexity and increases direct competition against
              specialized incumbents. If client net retention falters below 100% or multi-specialty cross-selling fails
              to scale beyond core physical therapy, the rationale supporting a premium software valuation multiple
              collapses.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenario Modeling, Multiples, and Return Horizons
        blocks:
          - type: paragraph
            body: >-
              To evaluate potential investment outcomes across a 2028 exit horizon, we model three distinct scenario
              trajectories reflecting divergent growth rates, multi-vertical adoption, and valuation multiples. In our
              bull-case scenario (25% probability), Sword accelerates growth across its Atlas, Bloom, and Mind product
              lines, scaling to $600 million ARR by 2028; at a premium 12.0x exit multiple, enterprise value reaches
              $7.2 billion, delivering attractive upside. In the base-case scenario (50% probability), ARR growth
              decelerates to a normalized 20% compound annual rate, reaching $400 million by 2028; applied against an
              8.0x software multiple, enterprise value totals $3.2 billion, representing a 20% discount to the current
              $4.0 billion private valuation. Under our bear-case scenario (25% probability), enterprise point-solution
              commoditization and health plan budget compression stall revenue at $300 million ARR; valued at a 4.0x
              multiple, enterprise value falls to $1.2 billion, triggering severe down-round dilution and liquidation
              preference impairment for junior share classes.
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Exit Readiness, Capital Structure, and Diligence Roadmap
        blocks:
          - type: paragraph
            body: >-
              Sword Health's financing trajectory reveals a deliberate shift away from near-term public market liquidity
              toward long-term private independence. Founder and CEO Virgílio Bento's decision to delay an initial
              public offering from 2025 to at least 2028 reflects a calculated strategy to build broader multi-condition
              clinical proof points prior to public scrutiny, yet it significantly extends holding period risk for
              pre-IPO investors. Secondary transaction data from Forge Global reveals limited private trading volume
              alongside a junior valuation mark of $4.15 billion recorded in January 2026. This illiquidity heightens
              the necessity of strict pre-investment diligence. Prior to capital commitment, investors must demand
              audited GAAP financial statements detailing gross margin economics and hardware deployment costs,
              independently verified client renewal cohorts by vintage year, and the full capitalization table waterfall
              to quantify senior liquidation preference overhang across Series D, Series E, and Series F shares.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Stretched Multiple Limits Near-Term Multiple Expansion
            body: >-
              Sword Health's $4.0 billion Series F valuation represents a 16.7x multiple on reported $240 million ARR.
              With public digital health peers trading at 3x to 6x revenue, any growth deceleration or public listing
              multiple contraction would severely compress equity value, making current entry unattractive without
              significant pricing concessions.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV010
          - type: callout
            title: IPO Delay Extends Duration and Prioritizes Platform Breadth
            body: >-
              The strategic decision by CEO Virgílio Bento to push the IPO out to at least 2028 shifts Sword's
              investment profile from a near-term liquidity catalyst to a multi-year execution play. Investors must
              evaluate Sword not merely as an MSK leader, but as an emerging horizontal care platform expanding into
              pelvic health and mental health.
            calloutType: insight
            claimRefs:
              - CV003
              - CV007
              - CV014
