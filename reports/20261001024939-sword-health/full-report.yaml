      - number: '4.3'
        title: Capital Adequacy, Cash Runway, M&A Expansion, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Sword Health has demonstrated substantial access to private capital, lifting its valuation from $1.8B in
              2021 to $3B in June 2024 (via a $130M round including $30M primary and $100M secondary liquidity), and
              subsequently to $4B in June 2025 via a $40M Series F round led by General Catalyst. The company reported
              reaching cash-flow positivity by mid-2025 and achieving an annual revenue run rate of $240M. Rather than
              pursuing an immediate public listing, CEO Virgílio Bento shifted Sword's target IPO timeline to at least
              2028, citing the availability of private capital and secondary markets while positioning the company for
              multi-vertical proof points. This private capital buffer financed programmatic consolidation, culminating
              in the $285M acquisition of Kaia Health in early 2026. However, from an underwriting standpoint, Sword
              presents serious diligence blockers: the lack of public audited income statements, opaque liquidation
              preference waterfalls across its $380M+ to $541M cumulative capital base, integration churn from rapid
              M&A, workforce restructurings, and heavy valuation dependence on private venture step-ups in contrast to
              public peer scrutiny.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Opaque Private Unit Economics vs. Public Scrutiny
            body: >-
              While Sword Health achieved a $4B valuation and a reported $240M revenue run rate, its financials remain
              completely unaudited in the public domain. The company's delay of its IPO to at least 2028 insulates it
              from public scrutiny but prevents independent validation of its gross margins, clinical labor expenses,
              and true organic churn.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI016
          - type: callout
            title: Strategic Margin Expansion via Kaia Computer Vision M&A
            body: >-
              Sword's $285M acquisition of Kaia Health directly addresses its primary cost vulnerability—the logistics,
              inventory, and COGS burden of physical sensor kits. Integrating Kaia's computer vision for lower-acuity
              populations creates a bifurcated delivery architecture designed to protect gross margins.
            calloutType: insight
            claimRefs:
              - CI005
              - CI007
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio Architecture and Customer Workflows
        blocks:
          - type: paragraph
            body: >
              Sword Health structures its core offering around whole-person AI care delivered directly to patients'
              homes under employer- and health-plan-sponsored benefit models. The product portfolio has expanded well
              beyond its foundational musculoskeletal rehabilitation program into five specialized clinical modules
              alongside an enterprise operational infrastructure [CE001, CE003]. At the center of the member experience
              is Thrive, the company's flagship digital physical therapy platform designed to treat acute and chronic
              pain across nine primary anatomical regions, including low back, neck, shoulder, knee, ankle, foot, wrist,
              hand, and hip conditions [CE001, CE004]. In typical enterprise workflows, eligible members complete a
              digital intake and onboarding flow before receiving customized therapeutic programs paired with a licensed
              Doctor of Physical Therapy [CE003, CE004].


              Beyond core MSK therapy, Sword has rolled out specialized clinical modules to capture broader healthcare
              spending and improve member retention [CE001]. Bloom addresses women's pelvic health, delivering targeted
              therapy and biofeedback for pelvic organ prolapse, bladder and bowel incontinence, pregnancy, postpartum
              recovery, and menopause-related pain [CE001]. Mind integrates cognitive and behavioral pain coping
              mechanisms, sleep hygiene, and emotional resilience to address the psychological comorbidities that
              frequently exacerbate chronic physical pain [CE001, CE002]. Pulse represents Sword's newest clinical
              expansion, targeting cardiometabolic health, hypertension, pre-diabetes, and support for GLP-1 therapy
              adherence through continuous behavior modification and biometric monitoring [CE001, CE002]. Atlas
              functions as an international enterprise wellness tier deployed across 150 countries, providing
              cross-border employers with scalable, self-paced exercise regimens and ergonomic injury prevention
              education [CE005].
