      - number: '2.2'
        title: Market Sizing Lenses, Growth Drivers, and Structural Headwinds
        blocks:
          - type: paragraph
            body: >-
              Market sizing for digital physical therapy and virtual care exhibits significant divergence depending on
              whether estimates focus strictly on specialized digital MSK software and remote care delivery or aggregate
              indirect societal productivity burdens. Independent industry analysis by Physitrack valued the global
              digital MSK market at $4.4 billion in 2024, supported by enterprise adoption of per-member-per-month
              (PMPM) and engagement-based pricing models across Fortune 500 employers. Company claims identify an
              underlying epidemiological addressable population of over 2 billion people worldwide afflicted by muscle
              and joint pain, with lower back disorders representing the predominant cause of occupational disability.
              Nevertheless, translating broad population prevalence into realized software annual recurring revenue is
              constrained by structural hurdles. Enterprise purchasing cycles are lengthy and multi-layered, requiring
              simultaneous buy-in from benefits directors, clinical officers, finance teams, and information security
              reviewers. Furthermore, digital health procurement is shifting away from unvetted single-condition point
              solutions toward integrated platforms, driving consolidation across the sector. Growth is sustained by
              demonstrated cost-avoidance from deferred surgical procedures, improved employee retention, and
              international benefit expansion, but tempered by payer reluctance to commit to unverified actuarial
              return-on-investment figures.
            claimRefs:
              - CM001
