      - number: '4.2'
        title: Cost Structure, Unit Economics, and Operational Efficiency
        blocks:
          - type: paragraph
            body: >-
              Evaluating Sword Health's unit economics requires analyzing the structural cost divergence between
              sensor-based hardware delivery and software-driven AI care. Historically, Sword's primary cost driver was
              the delivery of its Digital Therapist platform, requiring physical shipment of wearable inertial
              measurement units (IMUs), tablet hardware, and device logistics, which introduced meaningful Cost of Goods
              Sold (COGS) and inventory friction. Clinician labor represents the other primary operating cost; however,
              Sword implemented efficiency-driven restructurings in late 2024 that trimmed clinician roles as its AI
              care specialist Phoenix assumed broader automated supervision. The acquisition of Kaia Health provided
              markerless computer vision ('Motion Coach') technology, enabling a hybrid model where lower-acuity members
              avoid hardware shipments altogether, reducing marginal fulfillment costs and customer acquisition cost
              (CAC). Nevertheless, without audited GAAP filings, fundamental unit economic metrics—including gross
              margin percentages, customer payback periods, Net Revenue Retention (NRR), and per-member servicing
              expenses—remain unverified company assertions.
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
              - CI010
