      - number: '1.1'
        title: Identity, Operating Model, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              A third-party profile dates Sword Health's founding to 2015 in Portugal by Virgílio Bento and Márcio
              Colunas, identifies the business as private, and places its headquarters in New York while listing Porto
              among its offices. The operating model is benefit-sponsored digital care: Sword's member site says
              participating employers, health plans, and organizations cover access, while licensed clinicians tailor
              programs delivered through the app and associated technology. The current member-facing portfolio spans
              physical therapy, pelvic health, movement, cardiometabolic support, and mental health through Thrive,
              Bloom, Move, Pulse, and Mind. These facts establish a diversified care platform, but they do not establish
              product-level revenue, utilization, or margin contribution.
