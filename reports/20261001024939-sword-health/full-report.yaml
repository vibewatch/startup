      - Core Assumptions (2028 Target)
      - Valuation & Multiple Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Reaches $600M ARR; successful multi-vertical expansion (Mind, Bloom, Atlas); sustained 35%+ growth
        - $7.2B Enterprise Value based on 12.0x ARR premium multiple at public IPO
        - Execution stumbles in mental health; renewed price competition from Hinge Health
