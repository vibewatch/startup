        - Reaches $400M ARR; moderate growth deceleration to 20%; core MSK dominance with minor adjacencies
        - $3.2B Enterprise Value based on 8.0x ARR multiple reflecting normalized digital health valuations
        - Multiple contraction below Series F $4.0B mark; extended illiquidity past 2028
