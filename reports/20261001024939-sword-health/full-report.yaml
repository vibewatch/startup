      - number: '5.2'
        title: AI Care Specialist Engine and Graph-Orchestrated Decision Architecture
        blocks:
          - type: paragraph
            body: >
              The technical core of Sword's clinical delivery is Phoenix, its proprietary AI Care Specialist [CE003,
              CE006]. In traditional digital rehabilitation, platforms either rely on asynchronous human physical
              therapy check-ins or unguided exercise video libraries. Phoenix operates as an active digital co-therapist
              during live sessions: using computer vision and connected sensor feedback, the system monitors movement
              trajectory, evaluates joint angles, and provides real-time corrective auditory and visual feedback to the
              patient while logging session compliance [CE003, CE004]. Crucially, the operating model maintains a
              licensed clinician in the loop—every member's longitudinal treatment plan is approved, monitored, and
              adjusted by a clinician, ensuring that automated biofeedback does not operate outside clinical safety
              boundaries [CE003, CE004].


              To govern natural-language conversations and clinical triage without hallucinations or state drift, Sword
              introduced Arbor, a specialized framework designed for LLM navigation over structured clinical decision
              trees [CE007]. Conventional single-prompt approaches embed entire clinical decision trees—often exceeding
              100,000 serialized tokens—into the system prompt, causing context degradation, instruction-following
              failures, and unpredictable navigation [CE007]. Arbor decouples decision-tree logic from response
              generation through an edge-list representation and graph-based orchestration [CE007, CE008]. At each
              interaction node, Arbor dynamically retrieves only outgoing edge criteria, uses an LLM to evaluate
              transition validity, and then employs a separate generation step to produce natural language responses
              [CE008]. In clinical evaluation across foundation models, Arbor demonstrated an average 29 percentage
              point gain in navigation accuracy, a 57.1% reduction in per-turn latency, and 14.4-fold lower token
              inference costs [CE007].
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE008
