  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Clinical Adjacencies
        blocks:
          - type: paragraph
            body: >-
              Defining the addressable market for Sword Health requires establishing clear operational boundaries
              between direct digital musculoskeletal (MSK) care, adjacent chronic disease management, and status-quo
              clinical substitutes. Digital MSK platforms deliver sensor-guided or computer-vision-assisted physical
              therapy, remote clinical consultations with licensed physical therapists, and preventative movement health
              regimens directly into members' homes. This spend encompasses software platform access, clinician
              care-team management, remote therapeutic monitoring, and dedicated hardware such as wearable motion
              trackers. However, the market excludes acute surgical interventions, hospital inpatient episodes, invasive
              orthopedics, spinal injections, and generic wellness or fitness apps that lack medical oversight and
              clinical outcomes validation. Beyond core MSK rehabilitation, the category is actively expanding into
              adjacencies such as women's pelvic floor health (Sword's Bloom program), chronic pain-related behavioral
              health (Sword's Mind program), and clinical mindfulness. Status-quo substitutes include traditional
              in-person outpatient physical therapy clinics, brick-and-mortar orthopedic practices, interventional pain
              management facilities, and employer on-site occupational therapy centers. Whereas clinics typically
              license software for clinician-prescribed home exercise programs and remote monitoring, enterprise
              platforms contract directly with self-insured employer benefit plans and commercial health plans to
              deliver turnkey care models.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
