      - number: '3.3'
        title: Pricing Models, GTM Distribution, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Commercial competition in digital MSK is heavily mediated by enterprise benefit procurement dynamics,
              health plan distribution partnerships, and risk-sharing contract structures. Sword Health employs a
              disruptive 100% outcome-based pricing model, guaranteeing that enterprise clients and health plans pay
              only when enrolled members achieve validated clinical recovery milestones and pain reduction targets. In
              contrast, incumbent vendors typically structure contracts around blended per-enrolled-participant models
              or per-employee-per-month (PEPM) administrative fees with shared-savings performance guarantees. Hinge
              Health retains a structural distribution advantage through entrenched channel partnerships with major
              national health plans and pharmacy benefit manager formularies, including Express Scripts and CVS
              Caremark. Because enterprise employers typically procure digital health solutions on multi-year contract
              cycles and exhibit low willingness to manage disjointed single-condition vendors, Sword must deploy
              aggressive broker enablement, clinical ROI proof points, and platform bundle discounts to overcome buyer
              switching inertia.
            claimRefs:
              - CP001
              - CP006
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Moat Durability and Adverse Competitive Pressures
        blocks:
          - type: paragraph
            body: >-
              Although Sword Health demonstrates strong commercial traction with an annual revenue run rate of $240
              million and positive operating cash flow as of June 2025, several structural competitive risks remain.
              First, Hinge Health's public company status provides lower cost of capital, public equity acquisition
              currency, and greater financial transparency, whereas Sword has deferred its anticipated IPO window to
              approximately 2028. Second, Sword's self-reported 70% win rate in competitive evaluations and 3.7-to-1
              return on investment metrics lack head-to-head independent actuarial verification, creating potential
              skepticism among rigorous institutional benefits buyers. Third, incumbent health plan aggregators and
              navigation platforms (such as Quantum Health) are increasingly integrating commoditized virtual PT
              modules, creating long-term pricing pressure. To defend its $4 billion valuation premium, Sword must
              sustain clinical differentiation across licensed PT oversight while proving that cross-condition adoption
              across Pulse and Mind can offset slowing growth in pure-play MSK.
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP011
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Divergent Public Markets Strategy
            body: >-
              While primary peers Hinge Health and Omada Health pursued public listings to access public equity and
              brand visibility, Sword Health has deliberately deferred an IPO to approximately 2028, prioritizing
              multi-vertical scale and private capital flexibility.
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
          - type: callout
            title: Distribution Channel Concentration
            body: >-
              Hinge Health's established integration across 60+ health plans and PBM networks creates significant
              procurement lock-in, requiring Sword Health to rely heavily on its direct broker relationships and
              outcomes-based pricing guarantees to displace the incumbent.
            calloutType: risk
            claimRefs:
