  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Commercial Monetization, and Pricing Mechanics
        blocks:
          - type: paragraph
            body: >-
              Sword Health generates revenue primarily through enterprise commercial agreements with self-insured
              employers, commercial health plans, and public healthcare systems. The core commercial engine is
              contracted on a per-member-per-month (PMPM) or per-enrolled-member basis, with programs provided at no
              direct out-of-pocket cost to members as coverage is fully absorbed by sponsoring organizations. While core
              MSK physical therapy through Thrive represents the primary historical revenue contributor, Sword has
              introduced multi-product cross-selling through Bloom for pelvic health, Move for injury prevention, Pulse
              for cardiometabolic care, and Mind for mental health support. Pricing models operate on enterprise tiers
              where employers sponsor comprehensive access, with certain value-based contracts incorporating
              risk-sharing or milestone payments tied to clinical outcomes and surgical avoidance. Furthermore, the
              $285M acquisition of Kaia Health in January 2026 integrated Kaia's German statutory health insurance
              (DiGA) pathway, adding public reimbursement covering up to 73 million lives. However, realized net
              pricing, cohort-level discount schedules, and revenue mix across standalone MSK versus bundled offerings
              remain tightly held private data.
