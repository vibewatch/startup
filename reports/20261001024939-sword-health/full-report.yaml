              - CM008
              - CM013
              - CM014
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Market Consolidation Shifts Value from Point Solutions to Unified Platforms
            body: >-
              The enterprise digital health market is undergoing rapid horizontal consolidation. Employers and health
              plans are resisting vendor fatigue caused by managing disconnected apps for MSK, mental health, and
              women's health. Major platforms are responding by expanding their category boundaries via strategic
              M&A—such as Sword Health's planned acquisition of Headspace and Hinge Health's acquisition of Cylinder
              Health—transforming specialized physical therapy vendors into comprehensive virtual care networks.
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM011
          - type: callout
            title: Budget Attribution and Procurement Friction Constrain Rapid Expansion
            body: >-
              Despite sizable theoretical total addressable markets, virtual care vendors face elongated enterprise
              procurement cycles. B2B sales cycles require simultaneous consensus among corporate HR benefit leaders,
              clinical oversight committees, finance departments, and data security teams. Furthermore, unpredictable
              member enrollment and varying engagement rates make multi-year budget impact forecasting challenging for
              employer CFOs.
            calloutType: risk
            claimRefs:
              - CM001
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Direct Peer Profiles
        blocks:
          - type: paragraph
            body: >-
              The digital musculoskeletal (MSK) market has transitioned from fragmented pilot programs into a
              consolidated enterprise benefits category dominated by two primary category leaders: Sword Health and
              Hinge Health. Hinge Health established significant scale advantages by launching in 2017, ultimately
              achieving a public listing and building an enterprise footprint spanning more than 2,800 employer clients,
              60+ health plans and pharmacy benefit managers (PBMs), and over 20 million covered lives. Alongside Hinge,
              broader chronic care platforms such as Omada Health have expanded into musculoskeletal care, pairing
              digital physical therapy with diabetes, hypertension, and cardiometabolic disease management. Beyond
              venture-backed and publicly traded digital health vendors, traditional in-person outpatient physical
              therapy clinics and unguided home exercise regimens remain the entrenched status-quo substitute, capturing
              the vast majority of commercial claims spend despite persistent patient scheduling friction, high clinic
              drop-out rates, and lack of objective compliance monitoring.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP011
              - CP013
