      - number: '5.3'
        title: Sword Intelligence Enterprise Expansion, Data Platform, and Compliance
        blocks:
          - type: paragraph
            body: >
              In July 2025, Sword Health formalized its internal operational automation into an independent commercial
              division named Sword Intelligence [CE009, CE010]. Having completed over 7 million cumulative AI sessions
              and supported over 500,000 members internally by mid-2025, Sword packaged its administrative AI Care
              Manager agents into modular software for external health plans, hospital networks, and government health
              authorities [CE009, CE010, CE011]. These modular agents automate friction-heavy non-clinical workflows,
              including patient intake, automated benefits eligibility verification, triage routing, appointment
              scheduling, and proactive high-risk member outreach [CE009, CE010, CE011]. Operating as an autonomous unit
              within the company, Sword Intelligence aims to address enterprise administrative overhead without
              displacing existing human healthcare coordination teams [CE010, CE012].


              Supporting both clinical AI engines and operational workflows is a distributed enterprise data platform
              [CE002]. Sword's technical infrastructure is built around a modern streaming lakehouse, utilizing
              distributed streaming engines and durable execution workflows to synchronize telemetry, biometric
              tracking, and member communications across three continents [CE002]. Operating within strict healthcare
              regulatory boundaries, all clinical and operational solutions adhere to HIPAA, SOC 2 Type II, and HITRUST
              compliance standards [CE009, CE010]. However, key diligence risks remain: while Phoenix's core physical
              therapy algorithms carry FDA 510(k) medical device clearance, newer natural language triage features and
              predictive care-management agents operate under general digital health wellness exemptions, creating
              future regulatory classification exposure as FDA guidance around generative AI tools tightens [CE003,
              CE010].
            claimRefs:
              - CE002
              - CE003
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Decoupling via Arbor Graph Orchestration
            body: >-
              Sword's Arbor framework solves the critical medical reasoning failure of single-prompt LLM triage by
              decomposing complex 120k-token decision trees into localized edge evaluations, achieving 29% higher
              navigation accuracy and 14.4x cost reduction [CE007, CE008].
            calloutType: strength
            claimRefs:
              - CE007
              - CE008
          - type: callout
            title: Regulatory Boundary Disparity Across Clinical Versus Operational AI
            body: >-
              While Sword's core Thrive motion tracking has 510(k) clearance, newly deployed LLM conversational triage
              (Arbor) and Sword Intelligence operational agents rely on digital wellness and enterprise software
              classifications that may face shifting FDA enforcement [CE003, CE010].
            calloutType: risk
            claimRefs:
              - CE003
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise Buyer Segmentation and Payer Ecosystem
        blocks:
          - type: paragraph
            body: >
              Sword Health structures its commercial go-to-market around three primary institutional customer segments:
              self-insured enterprise employers, commercial health plans, and public national health systems. The
              primary enterprise economic buyer is typically a Vice President of Global Benefits, Total Rewards
              Director, or Chief Human Resources Officer seeking to curb escalating musculoskeletal (MSK) claims
              expenditures. Musculoskeletal conditions represent one of the largest drivers of self-insured medical
              spend, characterized by high direct costs from avoidable spinal surgeries, diagnostic imaging, and
              prolonged absenteeism. Sword targets these corporate accounts by delivering virtual digital physical
              therapy that pairs members with licensed Doctors of Physical Therapy (DPTs) alongside an FDA-listed
              sensor-guided Digital Therapist, aiming to resolve pain upstream before costly surgical intervention
              occurs.


              To scale distribution across commercial accounts, Sword relies on intermediary channel relationships,
              partnering with leading employee benefits consulting and brokerage firms including Mercer, WTW, Aon,
              Lockton, and Gallagher. These advisory firms evaluate clinical evidence and act as gatekeepers for Fortune
              1000 employer health plan designs. Beyond employer direct sales, Sword has expanded into health plan
              partnerships and reseller channels, including collaborations with Alphabet's Onduo precision health
              platform to integrate MSK rehabilitation into broader chronic condition programs covering cardiometabolic
              disease and diabetes. In international markets, Sword targets public healthcare payers, securing
              nationwide public procurement contracts such as its partnership with Portugal's National Health Service
              (Serviço Nacional de Saúde, SNS) and NHS foundation trusts in the United Kingdom.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
