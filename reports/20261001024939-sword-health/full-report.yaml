  - id: FU001
    title: Enterprise Customer Journey and Expansion Dynamics
    type: journey-map
    summary: >-
      End-to-end enterprise client progression from initial benefits procurement to international and platform-wide
      module cross-selling.
    data:
      items:
        - label: 1. Benefit Evaluation & Procurement
          description: >-
            Enterprise benefits committee and broker consultants (Mercer, Aon, WTW) evaluate MSK claims spend, surgical
            escalation rates, and ROI modeling.
          touchpoints:
            - RFP analysis with benefits consultants
            - Actuarial claims review and ROI projection
            - Outcome Pricing contract definition
        - label: 2. Pilot Launch & Member Enrollment
          description: >-
            Initial rollout targeting high-risk employee cohorts via internal communications, HR portals, and home
            delivery of FDA-listed sensor kits.
          touchpoints:
            - Targeted employee outreach and health fair onboarding
            - Digital physical therapist match and intake evaluation
            - Hardware sensor tablet delivery to employee homes
        - label: 3. Clinical Execution & Real-Time Tracking
          description: >-
            Members complete sensor-guided exercise therapy with live kinematic feedback while licensed physical
            therapists monitor adherence.
          touchpoints:
            - AI session execution via motion sensor feedback
            - Asynchronous chat and video check-ins with licensed DPT
            - Patient-reported outcome measure (PROM) collection
        - label: 4. Value-Based Billing & Contract Reconciliation
          description: >-
            Client finance and benefits teams review quarterly business review (QBR) reports to reconcile billing
            against validated pain reduction outcomes.
          touchpoints:
            - Quarterly Business Review (QBR) claims reconciliation
            - Audit of validated pain improvement thresholds
            - Invoice settlement based on realized clinical impact
        - label: 5. Enterprise Expansion & Cross-Selling
          description: >-
            Successful core MSK outcomes trigger geographic expansion to international divisions (Atlas) and
            cross-selling into pelvic health (Bloom) and mental health (Mind).
          touchpoints:
            - Global rollout to international subsidiaries across 40+ countries
            - Expansion into Bloom women's health and menopause care
            - Adoption of Mind and digital triage platform modules
        - label: 6. Contract Renewal & Long-Term Advocacy
          description: >-
            Annual renewal negotiations evaluating multi-year gross and net retention, client references, and consultant
            advisory endorsements.
          touchpoints:
            - Annual benefits review and renewal schedule execution
            - Joint case study and client reference development
            - Multi-year enterprise contract extension
