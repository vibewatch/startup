      - - Integrated Collaborative Behavioral Therapy
        - Adjunctive individual psychotherapy conducted in coordination with an overseeing psychiatrist
        - Standalone talk therapy, self-referral counseling, and life coaching
        - Commercial payers and insured patients seeking bundled psychiatric care
        - Secondary attach offering provided exclusively to active Talkiatry psychiatric patients
      - - Direct-to-Consumer Digital Mental Health
        - Asynchronous messaging, self-care software tools, and out-of-pocket cash subscriptions
