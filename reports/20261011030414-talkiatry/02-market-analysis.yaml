  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User / Patient
      - Payer
      - Workflow Integration
      - Budget Owner
      - Adoption Trigger
    rows:
      - - Commercial Insured Patients
        - Individual health plan subscriber
        - Adults and adolescents (ages 5-18) with anxiety, depression, OCD, or ADHD
        - Commercial health plans (Aetna, BCBS, Cigna, UnitedHealthcare, Optum)
        - Zocdoc directory, digital intake assessment, and Healow patient portal
        - Consumer out-of-pocket deductible and copayment budget ($15-$30/visit)
        - Inability to find local in-network psychiatrist accepting new patients
      - - Medicare Enrollees
        - Medicare beneficiary or senior caregiver
        - Older adults requiring psychopharmacologic evaluation and chronic care
        - Traditional Medicare and Medicare Advantage plans
        - Electronic health record scheduling and virtual video consultation
        - Federal Medicare Part B and supplemental plan benefits
        - Transportation barriers and specialist shortage in suburban and rural areas
      - - Regional Health Systems
        - Hospital chief medical officer or VP of ambulatory care
        - Hospital network patients lacking ambulatory outpatient psychiatric follow-up
        - Health system operating budget or shared-savings value-based contract
        - Mindshare Partner Program bi-directional referral integration
        - Health system ambulatory strategy and clinical service line budget
        - Severe psychiatric bed shortages and emergency department boarding crisis
      - - Digital Health Referral Partners
        - Partner business development and clinical partnerships leadership
        - Consumers seeking higher-acuity psychiatric medication management
        - Commercial insurance or direct partner integration fee
        - Cross-platform digital referral workflow (e.g., BetterHelp, NOCD, Quest)
        - Partner care management and patient retention budget
        - Patient clinical escalation beyond standalone therapy or digital app scope
    notes: Buyer and payer segmentation details purchasing authority, user workflow, and commercial reimbursement triggers across commercial, Medicare, health system, and DTC channels.
