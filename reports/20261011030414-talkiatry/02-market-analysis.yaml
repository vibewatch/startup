  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing-and-som
      missingEvidence: Independent third-party econometric sizing of the addressable in-network telepsychiatry TAM and serviceable obtainable market (SOM) disaggregated from broader behavioral telehealth.
      whyItMatters: Broad commercial market figures conflate talk therapy, asynchronous digital apps, and physician-level psychiatric prescribing, obscuring Talkiatry's true addressable market share.
      diligencePath: Request CMS claims data, private health plan claims carve-outs, and independent actuarial evaluations of specialty psychiatric billing codes (CPT 99213/99214 with psychotherapy add-ons).
      relatedQuestionRefs:
        - QM009
      relatedTableRefs:
        - TM002
    - type: conflicting-data
      severity: material
      topic: telehealth-prescribing-regulations
      missingEvidence: Finalized post-2026 Drug Enforcement Administration (DEA) rules governing telemedicine prescribing of Schedule II-V controlled substances without an initial in-person examination.
      whyItMatters: A reversion to strict in-person Ryan Haight Act mandates would force Talkiatry to establish physical clinic partnerships or discontinue controlled substance management for a significant share of patients.
      diligencePath: Monitor the Federal Register for DEA permanent telemedicine rulemaking, congressional legislative extensions, and state medical board interstate telepsychiatry licensing compacts.
      relatedQuestionRefs:
        - QM010
