evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capitalization-and-unit-economics
    missingEvidence: >-
      Audited financial statements, ARR breakdown, GAAP gross margins, physician compensation expense ratios, and Series
      D equity-versus-debt capitalization.
    whyItMatters: >-
      Without audited financial disclosures, investors cannot verify Talkiatry's revenue run-rate, clinical unit
      economics, or valuation multiples relative to public telebehavioral peers.
    diligencePath: >-
      Request private audited income statements, cap table summaries, and debt covenant documents from Talkiatry
      management under an NDA.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-and-investor-map
    missingEvidence: >-
      Complete cap table and institutional equity ownership breakdown for venture capital syndicates and growth equity
      investors.
    whyItMatters: >-
      Complete stakeholder mapping requires transparency into preferred equity voting rights, board seat allocations,
      and liquidation preferences.
    diligencePath: >-
      Obtain corporate charter documents, Series D voting agreements, and Schedule of Shareholders from company legal
      counsel.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-and-som
    missingEvidence: >-
      Independent third-party econometric sizing of the addressable in-network telepsychiatry TAM and serviceable
      obtainable market (SOM) disaggregated from broader behavioral telehealth.
    whyItMatters: >-
      Broad commercial market figures conflate talk therapy, asynchronous digital apps, and physician-level psychiatric
      prescribing, obscuring Talkiatry's true addressable market share.
    diligencePath: >-
      Request CMS claims data, private health plan claims carve-outs, and independent actuarial evaluations of specialty
      psychiatric billing codes (CPT 99213/99214 with psychotherapy add-ons).
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: telehealth-prescribing-regulations
    missingEvidence: >-
      Finalized post-2026 Drug Enforcement Administration (DEA) rules governing telemedicine prescribing of Schedule
      II-V controlled substances without an initial in-person examination.
    whyItMatters: >-
      A reversion to strict in-person Ryan Haight Act mandates would force Talkiatry to establish physical clinic
      partnerships or discontinue controlled substance management for a significant share of patients.
    diligencePath: >-
      Monitor the Federal Register for DEA permanent telemedicine rulemaking, congressional legislative extensions, and
      state medical board interstate telepsychiatry licensing compacts.
    relatedQuestionRefs:
      - QM010
  - type: missing-source
    severity: material
    topic: competitor-unit-economics
    missingEvidence: >-
      Audited retention cohorts, clinician turnover rates, and gross margin comparisons across employed psychiatrist
      models versus 1099 contractor marketplace models.
