    title: "Billing Friction and Ancillary CPT Codes"
    body: "Independent reviews reveal recurring patient disputes regarding unexpected out-of-pocket charges. While marketed around an average $30 copay, actual expenses fluctuate based on deductible status and psychiatric billing codes, specifically supportive psychotherapy add-on codes billed alongside standard evaluation visits."
    claimRefs:
      - "CE012"
  - calloutType: "insight"
    title: "Employed Clinician Model as Technology Enabler"
    body: "Talkiatry's reliance on directly employed W-2 psychiatrists enables standardized adoption of proprietary scheduling, documentation, and measurement-based care protocols that 1099 contractor-based telehealth aggregators struggle to enforce."
    claimRefs:
      - "CE007"
      - "CE014"
