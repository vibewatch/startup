  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议立场
        blocks:
          - type: paragraph
            body: >
              Talkiatry 是美国规模最大的专门远程精神科网络之一，采用由精神科主导的网络内模式，将商业医保和 Medicare
              患者连接到获得委员会认证的精神科临床医生。核心投资论点建立在精神科服务严重的全国性结构缺口上：超过 60% 的美国县没有执业精神科医生，到 2030 年预计短缺最多 30,000 名医生。Talkiatry
              通过建立全职雇佣的医生队伍，消除行政负担并简化资质认证、账单和排班，直接应对这一可及性瓶颈。公司提供主要全国性支付方承保的网络内服务，患者通常只需支付 $15 至 $30 的共付额，就能获得负担得起的精神科服务。

              但临床规模也被显著的投资判断不确定性抵消。Talkiatry 的公开披露有限：收入运行率未披露，毛利率未经验证，队列留存数据也属机密。尽管私募融资轮次显示，继 2024 年 6 月融资 $130
              million、累计融资超过 $245 million 后，市场期待其达到独角兽级估值，但公开数字医疗和虚拟行为健康可比公司的企业价值 / 收入倍数仅为 0.5x 至 3.5x。因此，Talkiatry
              应维持“继续研究”的建议，估值立场偏高；在作出投资判断前，必须完成财务确认性尽调。
