    data:
      items:
        - label: 美国未治疗精神疾病需求（60% 的成年人）
          detail: 每年超过 60% 的可诊断精神疾病成年人因医疗可及性和临床医生短缺而未接受治疗
          value: 60
          unit: '%'
        - label: 面临精神科医生短缺的美国县（60% 的县）
          detail: 60% 的美国县没有一名执业精神科医生，形成结构性供给缺口
          value: 60
          unit: '%'
        - label: 预计 2030 年全国临床医生缺口（3 万名精神科医生）
          detail: 预计到 2030 年全国最多缺少 3 万名精神科医生，推动对可规模化线上照护的需求
          value: 30000
          unit: psychiatrists
        - label: Talkiatry 网络内覆盖人群（170M+）
          detail: 覆盖 100 多个健康保险计划签约的商业保险和 Medicare 人群
          value: 170
          unit: M lives
        - label: 在职精神科医生能力（800 多名全职 W-2 医生）
          detail: 美国最大的私营精神科医疗机构，使用自有排班和医生赋能系统
          value: 800
          unit: physicians
        - label: 已交付患者问诊（累计 3M+ 次）
          detail: 自成立以来在 30 多个州完成的线上精神科问诊累计次数
          value: 3
          unit: M visits
    approximationNotes: 数据点反映公司公告和独立医疗新闻报道中的结构性供需约束及 Talkiatry 签约能力。
    claimRefs:
      - CM004
      - CM005
      - CM011
      - CM012
  - id: FP001
    title: 竞争定位：临床深度 vs. 商业保险整合
    type: quadrant
    summary: 按临床专科深度和网络内商业保险整合程度定位远程精神医疗与行为健康平台。
    data:
      xAxis:
        label: 临床专科化与处方医生深度
        min: 1
        max: 10
      yAxis:
        label: 网络内保险整合
        min: 1
        max: 10
      points:
        - label: Talkiatry
          x: 9.5
          'y': 9
          tone: positive
          note: 100% 为经委员会认证的精神科医生；100 多份健康保险计划合同
        - label: Brightside Health
          x: 6.5
          'y': 8
          tone: neutral
          note: 分层抑郁 / 焦虑治疗方案；主要支付方均接受
        - label: Talkspace
          x: 5.5
          'y': 8.5
          tone: neutral
          note: 整合心理治疗与精神科；商业合同覆盖广泛
        - label: Teladoc Health
          x: 5
          'y': 9
          tone: neutral
          note: 庞大的雇主 / 支付方分销网络；通科临床团队
        - label: Cerebral
          x: 4.5
          'y': 3.5
          tone: risk
          note: 照护团队模式；保险接受度有限；现金订阅
        - label: Grow Therapy
          x: 3.5
          'y': 7.5
          tone: neutral
          note: 网络内治疗师市场；依赖外部处方医生
        - label: Circle Medical
          x: 4
          'y': 6.5
          tone: neutral
          note: 快速接入初级保健处方医生；保险覆盖不一
    approximationNotes: 分数为基于证据的 1–10 序数排名，依据截至 2026 年公开的临床人员配置模式和保险网络广度得出。
    claimRefs:
      - CP001
      - CP005
      - CP008
      - CP010
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 展示患者数量和保险理赔如何转化为已实现收入及医生利润率的流程。
    data:
      nodes:
        - id: patient-intake
          label: 患者初诊与评估
          detail: 潜在患者完成数字化临床评估，再按专科和网络内保险匹配精神科医生。
        - id: coverage-verification
          label: 保险核验
          detail: 在 100 多个签约健康保险计划中核验保险覆盖和福利，并在预约前确定共付额或免赔额条款。
        - id: clinical-visit
          label: 全面视频评估
          detail: 由全职、经委员会认证的精神科医生通过视频平台完成 60 分钟初次精神科评估。
        - id: claim-submission
          label: 按服务收费理赔提交
          detail: 就诊按评估与管理（E&M）及心理治疗 CPT 代码编码，直接提交给商业保险方。
        - id: payer-reimbursement
          label: 支付方理赔裁定与共付额收取
          detail: 支付方按签约专科费率裁定理赔；患者支付共付额（通常为 $15–$30）或计入免赔额的共同保险。
        - id: provider-compensation
          label: W-2 医生薪酬与间接成本
          detail: 从总收入中扣除固定的 W-2 精神科医生薪资、行政支持、EHR 基础设施和医疗计费成本。
        - id: net-margin
          label: 运营贡献
          detail: 剩余现金流覆盖集中式临床运营和技术间接成本；网络内行为健康服务通常净利润率较薄。
    claimRefs:
      - CI001
      - CI004
      - CI007
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 覆盖患者数字化初诊、临床远程医疗交付和行政赋能的六层功能运营架构。
    data:
      layers:
        - label: 接入与初诊层
          detail: 患者数字化自评、资格核验和医生匹配
          modules:
            - 数字化症状评估
            - 保险覆盖资格核验
            - 自动匹配医生名册
        - label: 参与与通信层
          detail: 患者消息、门户界面和异步通信
          modules:
            - Healow 移动患者门户
            - 安全的临床医生异步消息
            - 预约排班与续方请求
        - label: 临床远程医疗交付层
          detail: 同步视频问诊和预约评估就诊
          modules:
            - 符合 HIPAA 的加密视频引擎
            - 60 分钟全面精神科评估
            - 30 分钟维持性用药复诊
        - label: 临床方案与治理层
          detail: 处方边界、诊断标准和质量管理
          modules:
            - 管制药物处方方案
            - 诊断性精神状态检查流程
            - 临床质量与同行评审监督
        - label: 医生赋能与运营层
          detail: 在职团队排班、执照管理和医疗机构运营
          modules:
            - 在职 W-2 临床医生排班调度
            - 多州医疗执照与资质认证
            - 临床医生工作量与职业倦怠管理
        - label: 企业计费与清算层
          detail: 支付方理赔提交、代码捕获和患者费用裁定
          modules:
            - CPT 代码捕获（评估与支持性治疗）
            - 网络内保险理赔处理
            - 患者共付额与免赔额裁定
    approximationNotes: 功能分层综合自患者门户端点、临床医生赋能披露及第三方软件集成。
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE011
      - CE012
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 六阶段旅程图详细展示患者从数字分诊、保险核验，到评估、用药管理和长期照护的进程。
    data:
      items:
        - label: 1. 初诊与数字分诊
          touchpoints:
            - Talkiatry 线上 10 分钟临床评估
            - 诊断性症状筛查（抑郁、焦虑、ADHD）
            - 排除范围外疾病（精神分裂症、活动性进食障碍）
          description: 潜在患者完成数字化初诊筛查，评估临床需求、地理位置和治疗适配性。
        - label: 2. 保险核验与费用透明
          touchpoints:
            - 自动实时核验保险资格
            - 确认支付方网络（100 多个健康保险计划）
            - 估算共付额（通常自付 $15–$30）
          description: 对照网络内商业保险和 Medicare 计划进行实时核验，确认保险覆盖，但意外账单仍是有报道的客户风险。
        - label: 3. 临床医生匹配与排班
          touchpoints:
            - 算法引导的精神科医生匹配
            - 州执照与亚专科匹配
            - 预约排班（42% 的患者等待 4 至 14 天）
          description: 患者从匹配的经委员会认证 W-2 精神科医生中选择，医生具备相应州执照、亚专科经验和可用时段。
        - label: 4. 初次全面精神科评估
          touchpoints:
            - 60 分钟视频远程医疗初次问诊
            - 完成会前问卷
            - 诊断制定与共同决策
          description: 60 分钟深度线上问诊建立治疗关系，诊断心理健康疾病，并共同制定治疗目标。
        - label: 5. 用药方案与照护协调
          touchpoints:
            - 将处方电子传送至当地药房
            - 州监管下的管制药物合规评估
            - 可选心理治疗转诊（内部或外部合作伙伴）
          description: 临床医生在临床适当时开具循证精神科药物，并与门诊治疗师或专业转诊伙伴协调。
        - label: 6. 长期照护与治疗监测
          touchpoints:
            - 每 4–8 周一次、每次 30 分钟的定期复诊
            - 基于测量的照护跟踪（PHQ-9、GAD-7）
            - 通过 Healow 应用在患者门户中安全消息通信
          description: 持续开展纵向精神科护理：标准化跟踪治疗结果、调整药物剂量，并通过数字门户沟通。
    approximationNotes: 患者旅程的阶段和触点细节，来自 Talkiatry 的患者接诊流程、用户调查结果及患者门户工作流。
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按固有严重性、发生可能性、缓释成熟度和剩余暴露，评估运营、监管、用工、品牌及融资等核心风险。
