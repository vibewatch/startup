            title: 计费摩擦与附加 CPT 代码
            body: 独立评价显示，患者反复就意外自付费用提出争议。虽然市场宣传以平均 $30 共付额为卖点，但实际费用会随免赔额状态和精神科计费代码变化，尤其是标准评估就诊之外另行计费的支持性心理治疗附加代码。
