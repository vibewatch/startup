  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、处方与执照风险
        blocks:
          - type: paragraph
            body: >-
              Talkiatry 处在复杂且不断变化的医疗监管环境中，COVID-19 疫情期间引入的处方灵活性仍可能因监管日落和立法修订而改变。根据联邦 Ryan Haight Online Pharmacy
              Consumer Protection Act，除非有特定监管豁免或放宽，未先进行面对面医疗评估通常不得开具受控物质。Drug Enforcement Administration（DEA）已将 Schedule
              II 至 Schedule V 药物的虚拟处方临时灵活措施维持至 2026 年 12 月 31 日；但长期规则仍未最终确定，DEA 拟议草案过去也曾考虑强制面对面评估或特殊注册框架。Talkiatry
              的精神科医生需要大量管理 ADHD、重度抑郁障碍和严重焦虑患者，这些患者可能需要兴奋剂或镇静剂治疗；任何收紧远程医疗处方权限的措施，都可能直接冲击业务量和收入。除联邦 DEA
              监管外，跨州行医还受到州医疗委员会执照要求和医疗行业公司执业规则的限制。在多个司法辖区，州法律要求在开始受控药物治疗前进行面对面评估；Talkiatry
              的纯虚拟临床模式无法满足这一要求，除非设立实体诊所或建立转诊合作。因此，Talkiatry 被迫在部分地区限制受控物质治疗，或将患者转介至当地机构，限制了可获取患者的范围。此外，Talkiatry 目前未在
              Alaska、Delaware、Hawaii、North Dakota 和 Wyoming 运营，这反映出州级执照摩擦和本地 payer 签约壁垒正在阻碍全国统一服务交付。
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR013
