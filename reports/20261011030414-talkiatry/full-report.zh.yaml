      - number: '6.2'
        title: 采用轨迹、就诊规模化与循证结果
        blocks:
          - type: paragraph
            body: >-
              Talkiatry 的采用曲线显示，其雇用医生团队实现了快速运营规模化：从 2020 年远程医疗启动起，三年半内超过 100 万次已完成就诊，14 个月后达到 200 万次，最终在 2026 年累计超过 300
              万次。这一交付能力由 800 多名通过专科委员会认证的 W-2 精神科医生支撑，构成美国最大的专门精神科医疗集团。不同于依赖独立 1099 合同医生网络的交易型直接面向消费者数字医疗平台，Talkiatry
              的雇用模式强制执行基于 PHQ-9 和 GAD-7 标准化临床评估的循证照护协议。《Journal of Medical Internet Research》发表的 1,826
              名患者回顾性同行评审数据表明，焦虑患者中 67%、抑郁患者中 62% 在 15 周平均五次就诊后，症状下降至临床显著性阈值以下。此外，26% 的焦虑患者和 29% 的抑郁患者达到临床缓解，为 payer
              合同的持久性提供了客观疗效证据。
