          - type: callout
            title: 投资判断需要经审计的 payer 费率表和队列实现率
            body: 潜在投资者应把累计就诊里程碑视为采用信号，而非财务代理指标；投资条款应以披露每次就诊的净实际报销额和患者治疗周期留存曲线为前提。
            calloutType: recommendation
