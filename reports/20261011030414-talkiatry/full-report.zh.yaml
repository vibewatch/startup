      - number: '7.4'
        title: 缓释措施、监测指标与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              为维持投资判断的可行性，尽调必须跟踪 Talkiatry 法律、临床和财务运营中的明确缓释措施，以及可量化的论点失效触发条件。Talkiatry
              通过临床筛查算法缓解处方监管风险：算法会标记有严重药物滥用史或双相情感障碍不稳定的患者，并将其转介给当地线下服务提供者。公司还通过 Mindshare Partner Program
              扩大与商业医疗系统的整合，开展医院临床协作；如果联邦规则要求线下检查，这一合作理论上可充当线下锚点。为应对劳动力生产率风险，Talkiatry
              使用专有人工智能排班和行政工作流软件，据报道可将医生倦怠较全国基准降低 80%。但机构投资者必须设定具体的监测指标和论点失效标准。关键监测信号包括：联邦立法及 DEA 关于 Ryan Haight
              特别注册路径的规则制定公告；800 多名受雇精神科医生群体的离职率和净招聘速度；以及 BBB、Trustpilot 账单投诉的解决速度。足以推翻正面投资判断的确定性触发条件包括：（1）DEA
              最终规则要求所有管制药物续方均须线下问诊，且不为远程精神科提供豁免，这将使 Talkiatry 的虚拟 ADHD 业务在多个州不合规；（2）终止或不利地重新谈判前五大全国商业支付方的合同，而这些支付方覆盖超过
              15% 的患者就诊量；（3）年化医生离职率超过 25%，显示医生倦怠或对薪酬不满已不可持续；（4）州检察长或 FTC 围绕消费者账单披露和取消费采取正式监管执法或调查行动。
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR010
              - CR013
              - CR014
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
