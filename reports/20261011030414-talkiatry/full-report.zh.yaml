      - number: '6.4'
        title: 客户体验、留存动态与负面质量信号
        blocks:
          - type: paragraph
            body: >-
              虽然临床结果较强，但客户满意度信号显示，医生质量和行政执行之间存在明显运营张力。独立用户调查显示，医生基础满意度较高：90% 的受访患者表示愿意推荐 Talkiatry，并称赞 60 分钟初诊的全面性以及 $15
              至 $30 的可负担共付额。结构化患者旅程引导用户完成数字 intake、保险预核验、医生匹配、视频评估和持续门户沟通。但入组等待仍是摩擦点，42% 的受访用户等待 4 天至 2
              周才能获得初次预约。更严重的是，消费者评价聚合平台显示其行政工作流引发强烈不满：Talkiatry 在 Trustpilot 上评分 1.5 / 5，在 Better Business Bureau 获得
              F，投诉主要集中于意外收费、共付额账单延迟和强硬催收通知。学术远程精神科研究也证实，较高的初次就诊成本和较弱的早期医生关系会显著加速患者流失。再加上 Talkiatry 不披露队列层面的净收入留存和 payer
              集中度数据，这些负面动态构成主要投资判断不确定性。
