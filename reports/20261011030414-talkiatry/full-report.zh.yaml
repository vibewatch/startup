            title: W-2 劳动力开支与支付方利润率脆弱性
            body: >-
              直接雇用 800 多名 W-2 精神科医生让 Talkiatry 区别于平台型承包商，也带来更稳定的临床质量，但会形成僵化的固定运营支出。如果支付方重新谈判费率、报销延迟，或医生利用率下滑，Talkiatry
              没有承包商型远程医疗平台那样的可变成本弹性，资本需求将进一步上升。
