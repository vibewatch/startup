chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、临床使命与服务交付模式
        blocks:
          - type: paragraph
            body: >-
              Talkiatry 于 2020 年 4 月成立，是一家面向全国的心理健康机构，目标是解决门诊精神科服务中的结构性障碍。公司由 CEO Robert Krayn 和首席医疗官 Dr. Georgia
              Gaveras, D.O. 共同创办，运营 100% 虚拟的远程精神科平台，提供完整诊断评估和持续药物管理。不同于直接面向消费者的现金付费心理健康平台或由合同医生驱动的市场聚合平台，Talkiatry 以全职
              W-2 模式雇用临床医生，并直接接入主要商业健康保险 payer。纳保患者每次精神科就诊通常平均支付约 $30 共付额，既避开网络外现金价格，也能获得现有医疗福利覆盖的专业精神科治疗。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO006
              - CO008
              - CO009
      - number: '1.2'
        title: 创始团队、临床治理与高管架构
        blocks:
          - type: paragraph
            body: >-
              Talkiatry 的高管治理在创业运营纪律和严格临床监督之间保持平衡。联合创始人兼 CEO Robert Krayn
              在一次暴力入室事件导致自己患上创伤后应激障碍后，亲身经历了医疗导航瓶颈，发现寻找具备资质且在保险网络内的精神科医生存在严重系统摩擦，随后创办了公司。联合创始人 Dr. Georgia Gaveras, D.O.
              是三项专科委员会认证的精神科医生，拥有丰富的医院管理经验，负责 Talkiatry
              的临床规范、质量保障和医生督导体系。两位高管共同把临床质量、医生留任和网络内保险支付方签约作为核心重点，但公司的运营和监管连续性仍高度依赖这两位创始高管。
            claimRefs:
              - CO001
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO005
      - number: '1.3'
        title: 临床团队规模、payer 接入与就诊里程碑
        blocks:
          - type: paragraph
            body: >-
              自 2020 年开始临床运营以来，Talkiatry 已从地方区域诊所扩展为美国最大的专门门诊精神科医疗集团。公司全职雇用的临床团队从 2025 年年中超过 600 名精神科医生，增至 2026 年末覆盖 45
              个州的 800 多名持证精神科医生；其中超过 46% 的临床医生自称有色人种，并会说 30 多种语言。截至 2025 年 5 月的 12 个月内，累计临床就诊量从 100 万次翻倍至 200 万次，随后在
              2026 年超过 300 万次已完成患者就诊。临床结果披露显示，前来治疗焦虑或抑郁的患者中，超过 65% 在平均 5 次虚拟就诊后达到临床缓解。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO007
              - CO008
              - CO010
      - number: '1.4'
        title: 运营瓶颈、排期等待时间与计费限制
        blocks:
          - type: paragraph
            body: >-
              独立临床评估和患者调查显示，Talkiatry 网络存在明显运营摩擦和服务交付限制。HelpGuide 的独立测试发现，42% 的受访患者初次预约等待时间为 4 天至 2
              周，与数字医疗所期待的快速接入相悖。另有约 9% 的受访者表示遇到意外医疗账单，反映出实时保险共付额核验和就诊前费用沟通存在系统性摩擦。平台服务也受地域限制：Talkiatry 目前无法覆盖
              Alaska、Delaware、Hawaii、North Dakota、Wyoming
              以及美国以外地区。此外，其临床服务主要集中于诊断评估和药物管理；当临床需要完整的独立心理治疗时，患者必须转由外部机构或通过转诊协调。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO013
      - number: '1.5'
        title: 利益相关方生态、资本结构透明度与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Talkiatry 处在由商业医疗 payer、机构成长型股权投资者和全职临床雇员组成的高度互联生态中。公司与包括 Blue Cross Blue Shield
              affiliates、UnitedHealthcare、Optum、Aetna、Cigna 和 Humana 在内的全国性商业 payer 保持核心网络合作。但由于 Talkiatry
              仍是风险投资支持的私营实体，重要财务指标——包括经审计的年度经常性收入、GAAP
              毛利率、医生薪酬费用率和净现金消耗率——均未公开。历史融资公告虽提到大额成长融资，但高级债务额度与优先股类别之间的确切拆分仍未验证，这是机构评估的主要尽调缺口。
            claimRefs:
              - CO012
              - CO014
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO012
