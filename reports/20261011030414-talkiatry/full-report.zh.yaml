  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与 payer 网络覆盖
        blocks:
          - type: paragraph
            body: >-
              Talkiatry 采用双主体客户模式：终端用户是寻求虚拟门诊照护的精神科患者，经济买方和 payer 则是主要商业健康保险公司与 Medicare
              项目。平台的主要业务量来自患有轻至中度精神科疾病的商业保险成年人，典型疾病包括广泛性焦虑障碍、重度抑郁障碍、双相障碍和创伤后应激障碍。通过与 100 多个健康计划签订网络内医疗提供者合同——包括
              Aetna、Blue Cross Blue Shield、Cigna、Humana 和 UnitedHealthcare 等全国性保险公司——Talkiatry 在 45 个州为超过 1.7
              亿商业和公共保险参保人提供合同覆盖。除商业人群外，Talkiatry 还服务 Medicare 受益人，扩大了老年成人精神科照护的覆盖。除患者直接自我转诊外，Talkiatry
              还通过专业机构和医疗提供者渠道获得流入业务量，包括与内部精神科人手不足的医疗系统和初级保健医生集团建立结构化合作。
