figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 Talkiatry 自 2020 年成立以来的发展，直至 2026 年扩充团队并完成 300 万次问诊。
    data:
      items:
        - date: 2020-04
          label: 公司成立
          detail: Robert Krayn 与 Dr. Georgia Gaveras 在纽约市创立 Talkiatry，提供网络内精神科医疗服务。
          tone: neutral
        - date: 2020-10
          label: 商业支付方上线
          detail: Talkiatry 开始提供线上门诊服务，并接入主要商业健康保险计划。
          tone: positive
        - date: 2023-06
          label: 媒体与行业认可
          detail: 全国医疗商业简报纷纷报道 Talkiatry，重点介绍其门诊行为健康服务整合。
          tone: neutral
        - date: 2023-12
          label: 100 万次问诊里程碑
          detail: 运营三年半后，Talkiatry 累计完成的患者问诊超过 100 万次。
          tone: positive
        - date: 2024-07
          label: 覆盖 30 州的网络
          detail: Forbes Health 评述显示，公司已扩展至 30 个州，完成 25 万次问诊，并实行 $100 延迟取消费政策。
          tone: neutral
        - date: 2025-05
          label: 200 万次问诊与 600 名精神科医生
          detail: Talkiatry 在 12 个月内将问诊次数翻倍至 200 万次，在职精神科医生团队扩大到 600 多人。
          tone: positive
        - date: 2026-02
          label: 扩展至 45 州
          detail: 临床服务覆盖 45 个美国州，在职全职精神科医生超过 800 人。
          tone: positive
        - date: 2026-10
          label: 300 万次问诊与质量摩擦
          detail: 完成问诊超过 300 万次；独立评述指出预约等待时间和预付账单存在摩擦。
          tone: warning
    approximationNotes: 里程碑时间线日期和运营指标综合自 Talkiatry 公司公告、PR Newswire 新闻稿、Forbes Health 报道及 HelpGuide 临床服务评述。
