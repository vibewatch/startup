      - number: '5.4'
        title: 信任、合规、数据安全与质量控制
        blocks:
          - type: paragraph
            body: >-
              临床质量保障和监管合规是 Talkiatry 运营框架的关键支柱。公司拥有 LegitScript 认证、HIPAA 合规政策，并对临床团队实施严格的继续医学教育监督。在治疗结果研究中，Talkiatry
              记录到焦虑临床症状缓解率为 26%、抑郁为
              29%，相较传统社区基准验证了照护效果。但数据安全和收入周期管理方面仍存在技术及运营风险。公司披露过一次供应商安全事件：第三方服务环境中的受保护健康信息曾被未经授权访问，凸显供应商供应链风险。此外，高免赔额适用以及支持性心理治疗的附加计费代码，常常产生意外自付费用，损害患者满意度。在应对联邦远程医疗处方规则变化的同时维持临床治理，对于保持
              Talkiatry 的临床完整性和商业 payer 地位至关重要。
            claimRefs:
              - CE009
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: 展示材料
        blocks:
