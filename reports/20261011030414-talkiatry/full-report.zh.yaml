      - number: '6.3'
        title: 临床合作与生态渠道扩张
        blocks:
          - type: paragraph
            body: >-
              为扩大获客而不承担高昂的消费者营销费用，Talkiatry 建立了战略性临床交叉转诊合作，在心理健康生态中承担关键照护协调者角色。针对复杂精神科疾病，Talkiatry 与 NOCD
              建立双向转诊流程，让接受专业暴露与反应预防治疗的 OCD 患者获得虚拟精神科药物管理。为满足儿童和青少年心理健康需求，Talkiatry 与 Charlie Health
              合作，为从虚拟强化门诊项目降阶到维持性门诊照护的年轻患者建立清晰临床路径。面向企业雇主客户时，Talkiatry 与 BetterHelp Business
              合作，为希望在治疗之外获得医学照护的雇主客户提供网络内精神科服务。最近，Talkiatry 又与 American Medical Group Association
              合作，让其所属的多专科医疗集团和整合式医疗系统接入 Talkiatry 的虚拟精神科网络。这些战略联盟拓宽了 Talkiatry 的临床转诊漏斗，也加深了不同患者群体中的机构切换成本。
