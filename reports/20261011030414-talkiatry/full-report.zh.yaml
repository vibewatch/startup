      - number: '7.2'
        title: 运营执行、计费声誉与临床质量
        blocks:
          - type: paragraph
            body: >-
              Talkiatry 快速扩张至完成超过 200 万次就诊后，消费者触点出现明显摩擦，负面公开评分和账单纠纷都在威胁患者留存。独立调查及消费者评价聚合分析显示，客户对费用透明度和账单做法存在严重不满。在
              Trustpilot 上，Talkiatry 的综合评分为 5 星中的 1.5 星；评论称其账单做法存疑、未经告知就扣取信用卡费用，且自付成本不透明。此外，Better Business Bureau
              因消费者投诉账单超额收费及客户服务纠纷未解决，给 Talkiatry 评为 F。这些声誉风险也得到 HelpGuide 对 100 名 Talkiatry 活跃用户开展的独立调查印证：9%
              的受访者表示遇到意外收费和出乎预期的共付金额。Talkiatry 还执行严格的取消政策：患者若在预约前不足 48 小时取消或改期，需支付 $100
              的罚金；患者处于脆弱的精神科治疗阶段时，这进一步激化了负面情绪。与此同时，运营瓶颈造成预约延迟：调查显示，19% 至 42% 的潜在患者要等待 4 天至超过 2
              周，才能完成首次诊断评估，这与远程精神科承诺的无缝可及性相矛盾。临床交付也存在结构性限制。学术临床医生指出，虚拟远程精神科就诊会限制标准精神状态检查（MSE），精神科医生难以通过视频观察细微的运动协调、外在表现和复杂行为信号。远程诊疗适合稳定的药物维持，但对尚未诊断的复杂或共病情况，会带来诊断精确度风险，增加调整治疗或出现不良药理结果的可能性。
            claimRefs:
