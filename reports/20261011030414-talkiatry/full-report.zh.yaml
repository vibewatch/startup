              - CE012
      - number: '5.2'
        title: 产品线与临床服务矩阵
        blocks:
          - type: paragraph
            body: >-
              公司的商业服务围绕三条主要临床产品线组织：成人远程精神科、儿童与青少年精神科，以及辅助性协作治疗。成人远程精神科面向 18 岁及以上人群，覆盖 50 个州和 Washington
              D.C.，处理焦虑症、重度抑郁、双相障碍、强迫症及相关疾病。儿童与青少年服务线面向 5 至 18 岁患者，回应全国儿童心理健康专科医生的严重短缺。Talkiatry
              明确不在直接面向消费者的目录中提供独立谈话治疗；只有在患者的主治精神科医生开具处方时，才将心理治疗作为辅助服务提供。通过专注于精神科医生主导的诊断评估和药物治疗，Talkiatry
              避免与高业务量谈话治疗平台直接竞争。其运营基础是直接雇用 800 多名通过专科委员会认证的精神科医生作为全职 W-2 临床医生，形成结构化的医生供给壁垒，使平台区别于合同撮合型远程医疗模式。
            claimRefs:
