  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 服务定义与临床照护流程
        blocks:
          - type: paragraph
            body: >-
              Talkiatry 是一家专业化虚拟精神科诊所，而非按需治疗应用，重点提供全面精神科评估和长期药物管理。患者旅程从自动化数字 intake 开始，用时 10 至 20
              分钟，收集当前症状、诊断史和健康保险信息。符合临床纳入标准的患者会匹配到在其所在司法辖区具备资质的持证精神科医生。首次临床咨询为深入的 60 分钟视频就诊，随后每 4 至 8 周安排一次 30
              分钟复诊，用于治疗监测和药物调整。异步患者沟通、预约排期和续方请求在两次就诊之间通过集成患者门户软件完成。处方流程遵守州和联邦受控物质要求，在开具任何兴奋剂或镇静剂治疗前必须进行严格临床评估。公开临床结果数据显示，在开始治疗后的
              15 周内，这一结构化照护路径可让超过 60% 的坚持治疗患者实现有意义的症状减轻。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE008
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
