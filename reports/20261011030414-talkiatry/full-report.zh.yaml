        - 最大的专科精神科医疗机构，拥有 800 多名在职精神科医生和 60 多份网络内支付方合同，形成较高进入壁垒。
        - 网络规模带来巨额固定薪资负担，在按服务收费报销模式下，一旦利用率下滑就会拖累业绩。
        - 已证明转向共享节余或按人头计费风险合同，并带来持久的利润率扩张。
      - - 照护模式与结果
        - 由精神科主导的模式已验证症状改善率超过 60%，并将临床医生职业倦怠降低 80%，有助于提升患者留存。
        - 排除现金支付和 Medicaid 限制了可触达市场；预约等待时间可能超过一周。
