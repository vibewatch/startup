      - number: '3.4'
        title: 护城河持久性、替代风险与战略展望
        blocks:
          - type: paragraph
            body: >-
              Talkiatry 的长期竞争韧性取决于其雇用的临床医生团队和保险支付方合作关系是否足够可守，以及它与资本强度更低的合同医生市场之间的差距。通过直接雇用 800 多名全职精神科医生，Talkiatry
              已建立较高的结构性进入壁垒；复制一个全国性的 W-2 医疗专科医生网络，需要大规模资质认证基础设施、医疗责任管理和大量营运资金。这一高临床标准也让公司免受 Cerebral 等同行在 2022
              年因联邦政府严查兴奋剂处方而遭遇的严重声誉和监管后果。不过，Talkiatry
              仍面对三类持续替代威胁：提供当日预约的快速接入初级保健新进入者、承接轻度焦虑和抑郁患者的低成本异步平台，以及医疗系统内部自建的远程医疗服务。为守住市场领先地位，Talkiatry 必须简化患者入组、缩短
              intake 延迟、解决计费争议，并扩大与医院系统的合作以覆盖更高复杂度的门诊照护。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP012
              - CP013
      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 临床模式分化：优先诊所模式与照护团队经济性
            body: >-
              虚拟精神科的竞争分水岭在于临床医生资质：Talkiatry
              直接雇用通过专科委员会认证的精神科医生，承担较重的薪酬负担，以承接复杂、高严重度的保险转诊；风险投资支持的同行则越来越多地采用成本更低的执业护士或市场目录，以保护运营利润率。
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP005
          - type: callout
            title: 入组延迟与计费争议威胁患者留存
            body: >-
              Talkiatry 保持着可守的临床深度，但 1 至 2 周的等待时间和公共论坛上反复出现的消费者计费投诉，使其在面对 Circle Medical 等按需初级保健处方平台和 Brightside Health
              等透明订阅平台时存在流失风险。
            calloutType: risk
            claimRefs:
              - CP006
