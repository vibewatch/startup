  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将规模、成本结构、监管风险和估值标记串成一条逻辑链，形成投资立场。
    approximationNotes: null
    data:
      nodes:
        - id: n1
          label: 运营规模
          description: 800+ 名受雇精神科医生和 3M+ 次就诊证明了临床需求。
          tone: positive
        - id: n2
          label: 报销覆盖广度
          description: 纳入 60+ 个商业保险计划和 Medicare 网络，患者共付额为 $15-$30。
          tone: positive
        - id: n3
          label: 用工成本结构
          description: 高额固定 W-2 医生开支令利润率容易承压。
          tone: risk
        - id: n4
          label: 监管暴露
          description: 2026 年之后，DEA 永久性远程医疗处方规则仍待确定。
          tone: risk
        - id: n5
          label: 估值基准
          description: 私募融资估值意味着独角兽估值，而公开市场可比公司为 1x-3x。
          tone: neutral
        - id: n6
          label: 最终立场：继续研究
          description: 在投入资本前，必须审计毛利率和股权结构表。
          tone: neutral
      edges:
        - from: n1
          to: n2
          label: 由……支持
        - from: n2
          to: n3
          label: 受……约束
        - from: n3
          to: n4
          label: 叠加于
        - from: n4
          to: n5
          label: 对照……评估
        - from: n5
          to: n6
          label: 最终形成
