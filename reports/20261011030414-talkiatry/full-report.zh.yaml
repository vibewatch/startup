            body: >-
              Talkiatry 的临床模式高度依赖治疗经常需要 Schedule II-IV 管制药物的精神疾病，例如 ADHD 和重度抑郁障碍。后疫情时代 DEA
              不断变化、且即将到期或收紧的远程医疗灵活政策构成生存性风险：如果永久特别注册机制未被写入法规，患者可能被迫接受线下问诊，而 Talkiatry 纯虚拟基础设施无法直接提供这种服务。
            calloutType: risk
            claimRefs:
