  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与 payer 报销
        blocks:
          - type: paragraph
            body: >-
              Talkiatry
              采用商业网络内心理健康医疗模式，与直接面向消费者的数字医疗订阅平台有根本差异。公司不是向患者收取平台访问或精神科服务的月度会员费，而是完全通过向签约健康保险计划提交医疗索赔，以及收取患者分摊费用来变现。Talkiatry
              直接与 Aetna、Cigna、UnitedHealthcare、Blue Cross Blue Shield affiliates、Oscar 和 Oxford 等主要商业 payer 签约，同时接入传统
              Medicare 按服务收费项目。在这一框架下，商业保险公司会为 Talkiatry 覆盖的评估和管理（E&M）就诊，以及配套心理治疗服务报销。

              患者价格由个人健康计划的福利设计决定，而非统一零售价目表。拥有标准共付额福利的纳保患者，每次完成临床就诊通常自付 $15 至
              $30。但加入高免赔额健康计划（HDHP）的患者，在年度免赔额满足之前必须承担全部签约费率，因此每次就诊支出为 $150 至 $300。关键在于，Talkiatry
              没有公开的现金自费价目表，也不服务无保险人群，因此完全依赖机构 payer 网络。患者获客依靠网络内医疗提供者目录和 Zocdoc 等外部预约渠道，并辅以数字化患者 intake；预约规则规定，48
              小时内取消预约需支付 $100 迟取消费。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
