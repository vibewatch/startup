        title: 展示材料
        blocks:
          - type: callout
            title: 网络内保险匹配带来业务量，但限制单位利润率
            body: Talkiatry 依赖商业保险报销而不是现金订阅，既消除了直接消费者订阅疲劳，也把服务扩展到 100+ 个健康计划；但临床就诊受固定按服务收费费率约束，而精神科报销历史上只能带来较薄的利润率。
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI012
          - type: callout
            title: 高额 W-2 医生开支在两个方向上都形成固定成本杠杆
            body: 直接雇用 600 多名全职、通过专科委员会认证的精神科医生，能确保医生与公司目标一致并保持临床连续性，但也建立了僵化的薪酬基座；若临床利用率不能持续保持较高水平，运营现金会快速消耗。
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI008
