  topStrengths:
    - Category-leading in-network psychiatry scale with 800+ employed psychiatrists across 45 states.
    - Broad payer coverage and low patient copays broaden access across commercially insured lives.
    - Published clinical outcomes and visit growth support durable demand.
  topRisks:
    - Audited revenue, gross margin, burn, and cap-table detail remain undisclosed.
    - W-2 psychiatrist payroll creates fixed-cost leverage and margin compression risk.
    - DEA telemedicine and state prescribing rules could constrain controlled-substance volume.
    - Consumer billing friction and billing complaints threaten retention and reputation.
  unresolvedGaps:
