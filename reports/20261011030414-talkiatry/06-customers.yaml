figures:
  - id: "FU001"
    title: "Customer journey map"
    type: "journey-map"
    summary: "Six-stage journey map detailing patient progression from digital triage and insurance verification through evaluation, medication management, and longitudinal care."
    data:
      items:
        - label: "1. Intake & Digital Triage"
          touchpoints:
            - "Talkiatry online 10-minute clinical assessment"
            - "Diagnostic symptom screening (depression, anxiety, ADHD)"
            - "Exclusion of out-of-scope conditions (schizophrenia, active eating disorders)"
          description: "Prospective patients complete a digital intake screening evaluating clinical needs, geographic location, and treatment suitability."
        - label: "2. Insurance Verification & Cost Transparency"
          touchpoints:
            - "Automated real-time insurance eligibility check"
            - "Payer network confirmation (100+ health plans)"
            - "Estimated copay calculation ($15-$30 typical out-of-pocket)"
          description: "Real-time verification against in-network commercial and Medicare plans confirms coverage, though surprise billing remains a reported customer risk."
        - label: "3. Clinician Matching & Scheduling"
          touchpoints:
            - "Algorithm-guided psychiatrist matching"
            - "State licensing and subspecialty alignment"
            - "Appointment booking (wait times 4 to 14 days for 42% of patients)"
          description: "Patients select from matched board-certified W-2 psychiatrists with appropriate state licensure, subspecialty expertise, and schedule availability."
        - label: "4. Initial Comprehensive Psychiatric Evaluation"
          touchpoints:
            - "60-minute video telehealth initial consultation"
            - "Pre-session questionnaire completion"
            - "Diagnostic formulation and shared decision-making"
          description: "In-depth 60-minute virtual session establishes therapeutic alliance, diagnoses mental health conditions, and collaboratively formulates treatment goals."
        - label: "5. Medication Formulation & Care Coordination"
          touchpoints:
            - "Prescription electronic transmission to local pharmacy"
            - "State-regulated controlled substance compliance evaluation"
            - "Optional therapy referral (internal or external partner)"
          description: "Clinicians prescribe evidence-based psychiatric medications where clinically appropriate and coordinate with outpatient therapists or specialized referral partners."
        - label: "6. Longitudinal Care & Treatment Monitoring"
          touchpoints:
            - "30-minute recurring follow-up visits every 4-8 weeks"
            - "Measurement-based care tracking (PHQ-9, GAD-7)"
            - "Patient portal secure messaging via Healow app"
          description: "Ongoing longitudinal psychiatric care with standardized outcome tracking, medication dose adjustments, and digital portal communication."
    approximationNotes: "Journey stages and touchpoint details derived from Talkiatry patient intake protocols, user survey results, and patient portal workflows."
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU014
callouts:
  - calloutType: "strength"
    title: "Ecosystem In-Network Advantage and Clinical Efficacy"
    body: "Talkiatry has differentiated itself from direct-to-consumer cash-pay apps by securing in-network contracts across 100+ health plans covering 170M+ lives, enabling affordable $15 to $30 copays. Combined with peer-reviewed data showing 67% anxiety and 62% depression symptom resolution, this in-network alignment drives sustained patient volume."
    claimRefs:
      - CU003
      - CU005
      - CU008
  - calloutType: "risk"
    title: "Billing Friction, Scheduling Delays, and Payer Opacity"
    body: "Despite high clinician satisfaction, Talkiatry suffers from significant customer friction around billing transparency, evidenced by an F rating on the Better Business Bureau, a 1.5 out of 5 Trustpilot score, and 42% of patients waiting up to two weeks for initial visits. Furthermore, the absence of public cohort retention disclosures leaves unit economic durability unverified."
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU015
