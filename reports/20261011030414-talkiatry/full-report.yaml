            body: >
              Talkiatry represents one of the largest dedicated telepsychiatry networks in the United States, operating
              an in-network, psychiatry-led model that connects commercial and Medicare patients with board-certified
              psychiatric clinicians. The core investment thesis rests on the severe national structural deficit in
              psychiatric care, where over 60 percent of U.S. counties lack a practicing psychiatrist and a projected
              shortfall of up to 30,000 clinicians looms by 2030. Talkiatry directly addresses this access bottleneck by
              building a full-time, employed clinician base that removes administrative burdens and streamlines
              credentialing, billing, and scheduling. By delivering in-network care covered by major national payers,
              the company provides affordable psychiatric access with typical patient copays between $15 and $30.


              However, this clinical scale is counterbalanced by significant underwriting uncertainty. Talkiatry
              maintains a private disclosure profile with undisclosed revenue run-rate, unverified gross margin, and
              confidential cohort retention data. While private financing rounds indicate unicorn-level valuation
              expectations following its $130 million raise in June 2024 and over $245 million in cumulative funding,
              public digital health and virtual behavioral peers trade at modest multiples of 0.5x to 3.5x enterprise
              value to revenue. Consequently, Talkiatry warrants a research-more recommendation with a stretched
              valuation stance, requiring confirmatory financial diligence before an investment underwrite.
