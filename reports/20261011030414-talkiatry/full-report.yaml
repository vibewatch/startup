  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Service Definition and Clinical Care Workflow
        blocks:
          - type: paragraph
            body: >-
              Talkiatry operates as a specialized virtual psychiatric practice rather than an on-demand therapy
              application, focusing primarily on comprehensive psychiatric evaluation and longitudinal medication
              management. The core patient journey begins with an automated digital intake assessment requiring 10 to 20
              minutes to capture presenting symptoms, diagnostic history, and health insurance credentials. Patients
              matching clinical inclusion criteria are paired with licensed psychiatrists credentialed in their home
              jurisdiction. The initial clinical consultation is structured as an in-depth 60-minute video session,
              followed by recurring 30-minute follow-up appointments scheduled every four to eight weeks for therapeutic
              monitoring and medication adjustment. Asynchronous patient communication, appointment scheduling, and
              refill requests are mediated between visits through integrated patient portal software. Prescribing
              workflows adhere to state and federal controlled substance mandates, requiring rigorous clinical
              evaluation prior to issuing any stimulant or sedative treatments. Published clinical outcome data indicate
              that this structured care pathway achieves meaningful symptom reduction for over 60% of adhering patients
              within 15 weeks of treatment initiation.
