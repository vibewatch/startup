      - number: '5.2'
        title: Product Lines and Clinical Service Matrix
        blocks:
          - type: paragraph
            body: >-
              The company's commercial offering is organized around three primary clinical product lines: Adult
              Telepsychiatry, Child and Adolescent Psychiatry, and Adjunctive Collaborative Therapy. Adult
              Telepsychiatry serves individuals aged 18 and older managing anxiety disorders, major depression, bipolar
              disorder, obsessive-compulsive disorder, and related conditions across 50 states and Washington D.C. The
              Child and Adolescent service line extends specialized care to patients aged 5 to 18, addressing severe
              national shortages in pediatric behavioral health specialists. Standalone talk therapy is explicitly
              excluded from Talkiatry's direct consumer catalog; psychotherapy is provided strictly as an adjunctive
              service when prescribed by the patient's primary treating psychiatrist. By maintaining an exclusive focus
              on psychiatrist-led diagnostic evaluation and pharmacological management, Talkiatry avoids competing
              directly with high-volume talk therapy platforms. The operational foundation rests upon directly employing
              over 800 board-certified psychiatrists as full-time W-2 clinicians, establishing a structured provider
