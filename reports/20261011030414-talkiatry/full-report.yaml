  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Prescribing, and Licensure Risks
        blocks:
          - type: paragraph
            body: >-
              Talkiatry operates in a complex, evolving healthcare regulatory environment where prescribing
              flexibilities introduced during the COVID-19 pandemic remain subject to regulatory sunset and legislative
              revision. Under the federal Ryan Haight Online Pharmacy Consumer Protection Act, prescribing controlled
              substances without prior in-person medical evaluation is generally prohibited absent specific regulatory
              exemptions or waivers. The Drug Enforcement Administration (DEA) has maintained temporary flexibilities
              for virtual prescribing of Schedule II through Schedule V medications through December 31, 2026; however,
              long-term rules remain unfinalized, and proposed DEA draft regulations have historically contemplated
              mandatory in-person evaluations or special registration frameworks. For Talkiatry, whose psychiatric
              clinicians manage high volumes of patients with attention-deficit/hyperactivity disorder (ADHD), major
              depressive disorder, and severe anxiety requiring stimulant or sedative therapies, any tightening of
              telehealth prescribing authorities poses direct volume and revenue disruption. Beyond federal DEA
              oversight, interstate medical practice is constrained by state medical board licensing requirements and
              corporate practice of medicine doctrines. In several jurisdictions, state statutes mandate in-person
              evaluations prior to initiating controlled pharmacotherapy, which Talkiatry’s virtual-only clinical model
              cannot satisfy without establishing physical clinics or referral partnerships. Consequently, Talkiatry has
              been forced to restrict controlled-substance treatments in certain geographies or refer patients to local
              facilities, limiting addressable patient acquisition. In addition, Talkiatry does not currently operate in
              Alaska, Delaware, Hawaii, North Dakota, and Wyoming, reflecting state-level licensing friction and
              localized payer contracting barriers that impede nationwide uniform service delivery.
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
