      - number: '7.2'
        title: Operational Execution, Billing Reputation, and Clinical Quality
        blocks:
          - type: paragraph
            body: >-
              Talkiatry’s rapid scaling to over two million completed visits has generated significant friction across
              consumer touchpoints, evidenced by adverse public ratings and billing disputes that jeopardize patient
              retention. Independent investigations and consumer review aggregator analyses reveal substantial customer
              dissatisfaction regarding financial transparency and billing practices. On Trustpilot, Talkiatry holds an
              aggregated score of 1.5 out of 5 stars, where customer reviews allege questionable billing practices,
              unannounced credit card charges, and opaque out-of-pocket costs. Furthermore, the Better Business Bureau
              has assigned Talkiatry an F rating due to consumer complaints regarding billing overcharges and unresolved
              customer service disputes. These reputational liabilities are corroborated by HelpGuide’s independent
              survey of 100 active Talkiatry users, where 9% of respondents reported experiencing surprise charges and
              unexpected copayment amounts. Talkiatry also enforces a rigid cancellation policy that levies a $100
              penalty fee on patients who cancel or reschedule appointments with less than 48 hours notice, generating
              negative patient sentiment during vulnerable psychiatric episodes. In parallel, operational bottlenecks
              create appointment delays: survey findings indicate that between 19% and 42% of prospective patients wait
              from four days to over two weeks for their initial diagnostic evaluation, contradicting the seamless
              access promised by telepsychiatry. Clinical delivery also presents structural limitations. Academic
              clinicians highlight that virtual telepsychiatry encounters constrain the standard Mental Status
              Examination (MSE), making it challenging for psychiatrists to observe subtle motor coordination, physical
              presentation, and nuanced behavioral indicators over video interfaces. While effective for stable
              medication maintenance, remote care delivery creates diagnostic precision risks for undiagnosed complex or
              comorbid conditions, increasing the likelihood of treatment adjustments or adverse pharmacological
              outcomes.
            claimRefs:
              - CR004
