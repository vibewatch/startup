            title: In-Network Psychiatrist Employment Scale
            body: >-
              Talkiatry differentiates itself in digital behavioral health by employing over 800 licensed psychiatrists
              as full-time W-2 clinicians rather than independent 1099 contractors, establishing direct in-network
              contracts with national insurers covering over 45 states.
            calloutType: strength
