    title: "Heavy W-2 Physician Overhead Creates Fixed Cost Leverage in Both Directions"
    body: "Directly employing over 600 full-time board-certified psychiatrists ensures clinician alignment and clinical continuity, but establishes an inflexible payroll base that requires sustained high clinical utilization to avoid rapid operational cash burn."
