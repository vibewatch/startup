    body: "Talkiatry's reliance on commercial insurance reimbursement rather than cash subscriptions eliminates direct consumer subscription fatigue and expands access across 100+ health plans, but subjects clinical encounters to fixed fee-for-service schedules where psychiatry reimbursement historically yields thin margins."
