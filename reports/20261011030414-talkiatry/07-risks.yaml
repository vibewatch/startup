callouts:
  - calloutType: risk
    title: DEA Telehealth Cliff and Controlled-Substance Vulnerability
    body: >-
      Talkiatry's clinical model depends heavily on treating psychiatric conditions that frequently require Schedule
      II-IV controlled substances, such as ADHD and major depressive disorders. Evolving post-COVID DEA telemedicine
      flexibilities set to expire or tighten present an existential risk if permanent special registration mechanisms
      are not codified, potentially forcing in-person consultations that Talkiatry's virtual-only infrastructure cannot
      directly provide.
    claimRefs:
      - CR001
      - CR002
      - CR013
  - calloutType: insight
    title: W-2 Labor Overhead and Payer Margin Vulnerability
    body: >-
      While directly employing over 800 W-2 psychiatrists distinguishes Talkiatry from marketplace contractors and
      drives clinical consistency, it creates rigid fixed operating expenditures. In the event of payer fee
      renegotiations, reimbursement delays, or clinician utilization slippage, Talkiatry lacks the variable cost
      flexibility of contractor-based telehealth platforms, intensifying capital requirements.
    claimRefs:
      - CR003
      - CR010
      - CR012
      - CR014
