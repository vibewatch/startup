  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory-legal-risk-register
      missingEvidence: >-
        Comprehensive state-by-state telepsychiatry compliance audits detailing in-person prescribing waivers, Ryan
        Haight Act enforcement exceptions, and commercial Medicaid contract mandates.
      whyItMatters: >-
        State-level variance in controlled substance prescribing rules creates operational fragmentation and potential
        legal liabilities across Talkiatry's operating footprint.
      diligencePath: >-
        Review state medical board filing histories, DEA registration records, and legal compliance disclosures during
        confirmatory legal diligence.
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: financial-model-risk
      missingEvidence: >-
        Detailed psychiatrist utilization metrics, contribution margins per visit, clinician turnover rates, and
        post-Series-D cash burn schedule.
      whyItMatters: >-
        Without unit-level physician economics, underwriters cannot assess whether Talkiatry can achieve positive
        operating margins under full commercial insurance rate contracts.
      diligencePath: >-
        Request audited financials, clinician retention cohorts, and payer-level fee schedules under non-disclosure
        agreement.
