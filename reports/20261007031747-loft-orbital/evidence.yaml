evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited GAAP/IFRS income statements, recognized GAAP revenue, cash burn rate, and gross margin profiles across
      flight missions.
    whyItMatters: >-
      Reported revenue figures range widely from modeled estimates of $10M-$100M (IncFact) and $139.6M ARR (Latka) to
      $6M historical run rate, preventing precise margin and burn evaluation.
    diligencePath: >-
      Request audited financial statements, historical income statements, and management revenue recognition schedules
      during formal diligence.
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: board-governance
    missingEvidence: >-
      Comprehensive voting agreement, full cap table share register, and formal committee composition for the Board of
      Directors.
    whyItMatters: >-
      While core founder and independent seats are recorded, exact institutional board observer rights and Series C
      investor board designation seats remain private.
    diligencePath: Review board governance agreements, voting rights agreements, and Series C investor rights documentation.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: investor-syndicate
    missingEvidence: Full schedule of the 43+ institutional investors and secondary ownership share allocations across funding rounds.
    whyItMatters: >-
      Ownership concentration and pro-rata rights held by major leads like Tikehau, Axial, BlackRock, and Bpifrance
      influence future governance and exit approvals.
    diligencePath: Obtain fully diluted capitalization table and investor stock purchase schedules.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A reputable market study with a defined category boundary, current spend base, geography, period, and CAGR for
      outsourced hosted-payload and satellite-infrastructure services.
    whyItMatters: >-
      Without a comparable top-down denominator, ecosystem funding and company traction cannot support a defensible TAM
      or growth-rate claim.
    diligencePath: >-
      Obtain government and industry procurement datasets plus a methodology-disclosed analyst study, then reconcile
      overlapping launch, bus, operations, and data spend.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: serviceable-market
    missingEvidence: >-
      Program-level pricing, qualified pipeline, win rates, awarded task orders, cancellation rights, backlog duration,
      and bookings-to-recognized-revenue conversion.
    whyItMatters: >-
      These inputs are required to distinguish available budgets from Loft's serviceable and realistically obtainable
      share.
    diligencePath: >-
      Review the customer contract register, bid pipeline, IDIQ task orders, pricing schedules, and audited
      revenue-recognition bridge in the data room.
    relatedQuestionRefs:
      - QM004
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Customer-level budget ownership, dedicated-satellite alternative cost, time-to-orbit baseline, renewal behavior,
      and realized return on investment.
    whyItMatters: >-
      The evidence shows use cases but not whether buyers consistently save money, renew, or expand after an initial
      mission.
    diligencePath: >-
      Interview reference customers and inspect procurement files, renewal cohorts, mission budgets, and post-deployment
      value assessments.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM007
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: commercial-evidence-gap
    missingEvidence: >-
      Comparable customer proposals and executed contracts covering mission price, unit basis, discounts, service
      levels, renewal, termination, exclusivity, and liability allocation.
    whyItMatters: >-
      Without like-for-like commercial terms, the analysis cannot establish price advantage, switching cost, margin
      quality, or whether customers can multi-home.
    diligencePath: >-
      Obtain redacted contracts and losing as well as winning proposals, then interview reference and churned customers
      using a common mission specification.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-win-loss
    missingEvidence: >-
      Procurement-level win-loss data against launch integrators, spacecraft primes, internal builds, and outcome
      substitutes.
    whyItMatters: >-
      Directory competitor labels do not show which alternatives reach the same shortlist or why buyers select one
      delivery model.
    diligencePath: >-
      Review bid debriefs, pipeline loss reasons, and customer procurement records segmented by commercial and sovereign
      missions.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: recognized-revenue-and-margins
    missingEvidence: >-
      Audited financial statements showing recognized GAAP/IFRS annual revenue, cost of goods sold, gross margin
      percentage, and operating cash burn for 2024 through 2026.
    whyItMatters: >-
      Reported cumulative bookings of $500 million span multi-year delivery timelines; without recognized revenue and
      margin data, investors cannot verify the conversion velocity from bookings to realized cash flows.
    diligencePath: >-
      Request audited historical financial statements, program-level gross margin schedules, and current cash burn
      reports in management diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: program-level-unit-economics
    missingEvidence: >-
      Program-level unit economics separating satellite hardware pass-through costs (bus, launch, insurance) from
      software and compute subscription margins.
    whyItMatters: >-
      Evaluating whether orbital AI and virtual missions earn SaaS-like software gross margins or behave as pass-through
      aerospace systems integration contracts.
    diligencePath: >-
      Obtain program-level margin waterfalls and customer contract contribution margin schedules across physical,
      virtual, and on-demand missions.
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: supplier-terms
    missingEvidence: >-
      Audited delivery lead times, unit pricing, and master supply agreements with Airbus and LeoStella for satellite
      buses.
    whyItMatters: >-
      Determines whether bus supply bottlenecks or price adjustments can compress Loft's gross margins and delay
      constellation deliveries.
    diligencePath: Review supplier contracts, minimum commitment clauses, and historical delivery variance in diligence data room.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: minor
    topic: gpu-thermal-performance
    missingEvidence: >-
      Detailed thermal telemetry and GPU throttling data during sustained continuous on-orbit AI inference runs on
      YAM-6.
    whyItMatters: >-
      Limits the duty cycle and operational uptime of intensive machine learning workloads in high-radiation space
      vacuum environments.
    diligencePath: Request on-orbit thermal and power telemetry logs from YAM-6 edge AI demonstrations.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, logo and revenue churn, renewal cohorts, contract duration, satisfaction, and repeat-purchase data.
    whyItMatters: Without cohort evidence, contract momentum cannot be translated into durable recurring demand.
    diligencePath: >-
      Request customer-level cohorts for 2023-2026, renewal schedules, cancellations, and reference calls across
      government and commercial segments.
    relatedQuestionRefs:
      - QU009
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Top-one, top-five, and top-ten customer shares of revenue, bookings, backlog, receivables, and remaining
      performance obligations.
    whyItMatters: >-
      Large institutional programs can make headline traction depend on a small number of procurements or acceptance
      events.
    diligencePath: >-
      Review the contract and bookings ledger by counterparty, program, stage, cancellation right, and expected
