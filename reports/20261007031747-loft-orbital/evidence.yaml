  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Fully diluted capitalization, liquidation preferences, participation rights, anti-dilution terms, option pool,
      debt, and pro forma ownership for a new round.
    whyItMatters: >-
      Headline valuation does not determine investor proceeds when senior securities, dilution, or debt can change the
      economic outcome.
    diligencePath: >-
      Review the current cap table, charter, financing documents, debt schedule, and a proceeds waterfall under base and
      downside exits.
    relatedQuestionRefs:
      - QV007
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited recognized revenue, revenue recognition policy, gross margin by program, cash, burn, runway, and
      bookings-to-revenue conversion.
    whyItMatters: >-
      The public revenue references are not comparable and cannot support a current revenue multiple,
      probability-weighted valuation, or target return.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, contract-level backlog schedules, and reconciliations from
