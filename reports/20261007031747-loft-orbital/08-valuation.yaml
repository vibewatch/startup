        - "Do not set an entry price before private financial and cap-table diligence"
      - - "Confidence"
        - "Medium-low"
        - "Round amount is consistent; total funding, revenue, and current valuation evidence diverge"
        - "Treat public market-data pages as directional rather than audit-grade"
      - - "Risk rating"
        - "High"
        - "Backlog conversion depends on launch and integration execution, while margin and liquidity are undisclosed"
        - "Require milestone, cancellation, cash, and supplier exposure schedules"
      - - "Valuation stance"
        - "Insufficient public support"
        - "$954M October 2026 mark versus $1B January 2025 round benchmark"
        - "Use both as market anchors, not as an intrinsic-value conclusion"
      - - "Return / hold / exit"
        - "Not supportable publicly"
        - "Loft is privately held and public evidence does not establish exit timing or terms"
        - "Model returns only after fully diluted ownership, preferences, and an exit route are verified"
    notes: "Assessments distinguish financing raised from cash available and market marks from intrinsic value; missing private-company financial and security terms are shown as gaps rather than estimated."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
