company:
  name: "Loft Orbital"
chapter:
  number: 8
  title: "Valuation"
  summary: "Loft Orbital's $170M Series C is consistently reported, but public databases disagree on total funding, current valuation signals span a $954M secondary-market mark and a $1B round benchmark, and available revenue estimates are not comparable enough for a defensible intrinsic valuation. The evidence supports research-more rather than underwriting a price or target return."
sections:
  - id: "recommendation-and-price-discipline"
    title: "Recommendation and Price Discipline"
    body: "The evidence supports a research-more recommendation with medium-low confidence and high underwriting risk. Multiple independent databases agree that Loft Orbital raised a $170M Series C in January 2025, while the two most relevant price signals are a $1B January 2025 round benchmark and a $954M October 2026 private-market mark. Those signals describe transaction and secondary-market context, not intrinsic value. Public evidence does not disclose a fully diluted share count, liquidation preferences, recognized current revenue, gross margin, cash balance, or burn. Without those inputs, neither a target return nor a defensible hold period can be calculated, and the modest difference between the two headline marks is not itself a margin of safety."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "The thesis is that an end-to-end service can shorten customer adoption cycles by combining payload integration, launch booking, licensing, insurance, financing, and satellite operations. A current industry profile reports five deployed satellites, about 30 satellites in backlog, and approximately $500M of aggregate contract value, which is meaningful demand evidence. The anti-thesis is that backlog is not recognized revenue, funding is not cash available, and launch-dependent delivery can defer conversion. Public revenue references range from a $6M November 2021 recorded figure to a $10M-$100M statistical band and a separate $139.6M 2025 estimate. Those measures differ in vintage, methodology, and likely accounting basis, so they cannot be blended into a growth rate or valuation multiple."
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
    tableRefs:
      - "TV002"
  - id: "valuation-method-and-comparables"
    title: "Valuation Method and Comparable Context"
    body: "A revenue-multiple method is directionally relevant for a service platform, but the denominator is presently unreliable. Multiples.vc reports a 91.7x revenue multiple for Loft Orbital's November 2021 Series B using a $6M recorded revenue figure; that is a historical transaction observation, not a current multiple. Its comparison set reports LTM revenue multiples from 6.9x for BlackSky to 20.7x for Satellogic, but these companies have different asset intensity, customer mixes, maturity, and disclosure quality. Applying that range to either the IncFact band or GetLatka estimate would create an extremely wide, methodologically weak output. The $954M and $1B marks should therefore remain market anchors rather than a claimed fair-value range."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
  - id: "scenarios-exit-readiness-and-diligence"
    title: "Scenarios, Exit Readiness, and Diligence"
    body: "The scenario framework is conditional rather than numerically probabilistic because public evidence does not support probability estimates or a downside floor. A bull case requires timely backlog conversion, audited revenue approaching the upper public estimate, and evidence of repeatable margins; only then would a premium to the $1B round benchmark be supportable. The base case treats $954M-$1B solely as the current observable indication range while diligence remains open. A bear case begins below the $954M mark if launches slip, bookings cancel, or financing terms subordinate new capital, but its magnitude cannot be quantified without the cap table and liquidity data. Loft remains privately held, so exit timing and route also remain unverified."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV009"
      - "CV010"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
