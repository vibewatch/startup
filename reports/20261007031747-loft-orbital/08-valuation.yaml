    title: "Recommendation logic"
    type: "flow"
    summary: "The recommendation follows from commercial proof through financial comparability and price evidence to a diligence-gated decision."
    data:
      nodes:
        - id: "commercial-proof"
          label: "Commercial proof"
          detail: "Five deployed satellites, about 30 in backlog, and approximately $500M aggregate contract value are reported."
        - id: "conversion-test"
          label: "Conversion test"
          detail: "Backlog must be separated from recognized revenue and tested for cancellation and timing."
        - id: "financial-test"
          label: "Financial test"
          detail: "Public revenue references are inconsistent in vintage, definition, and method."
        - id: "price-context"
          label: "Price context"
          detail: "$954M secondary-market mark and $1B round benchmark are indications, not intrinsic value."
        - id: "terms-test"
          label: "Terms test"
          detail: "Fully diluted ownership, preferences, cash, and burn remain private diligence items."
        - id: "decision"
          label: "Research more"
          detail: "Withhold an entry valuation and target return until the conversion, financial, and terms tests clear."
      edges:
        - from: "commercial-proof"
          to: "conversion-test"
        - from: "conversion-test"
          to: "financial-test"
        - from: "financial-test"
          to: "price-context"
        - from: "price-context"
          to: "terms-test"
        - from: "terms-test"
          to: "decision"
    approximationNotes: "The flow is qualitative and does not imply probability, proportional magnitude, or a calculated valuation."
    claimRefs:
