callouts:
  - calloutType: "risk"
    title: "Airbus Bus Dependency and Margin Compression"
    body: "Loft Orbital's operating model relies fundamentally on standardizing payloads around Airbus-manufactured Longbow satellite buses. While standardizing bus platforms accelerates mission integration, it exposes Loft to single-supplier pricing power, potential component shortages, and competing Airbus internal priorities as the company attempts to scale its launch manifest beyond ten satellites per year."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR008"
  - calloutType: "insight"
    title: "Orbital Debris Mandates as a Structural Compliance Tax"
    body: "The formal enforcement of the EU Zero Debris Charter and US ORBITS Act in 2026 converts post-mission disposal from best practice into hard regulatory liability. Because Loft Orbital hosts third-party payloads, it bears direct operational and legal responsibility for ensuring ninety-five percent deorbiting compliance within five years, adding engineering verification costs and potential schedule friction."
    claimRefs:
      - "CR001"
      - "CR002"
