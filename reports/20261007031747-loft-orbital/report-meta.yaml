  topStrengths:
    - Standardized space-infrastructure platform with real sovereign, defense, and commercial use cases.
    - Repeated satellite mission execution and a reported backlog above $500 million.
    - Multi-source corroboration of the January 2025 Series C and current secondary-market price marks.
  topRisks:
    - Audited revenue, gross margin, cash balance, burn, and runway remain undisclosed.
    - Launch cadence and supplier dependencies can delay backlog conversion and compress margins.
    - Cap-table and preference-stack opacity make dilution and return modeling difficult.
  unresolvedGaps:
    - Audited revenue, gross margin, cash balance, burn, and runway by mission type.
    - Fully diluted ownership, liquidation preferences, and downside dilution terms.
    - Active customer count, renewal/churn behavior, and concentration by program.
    - Current headcount, board structure, and governance rights.
    - Mission insurance, warranty allocation, and failure-economics disclosure on major programs.
