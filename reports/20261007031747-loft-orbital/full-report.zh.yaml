  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 这项建议从商业验证出发，经过财务可比性和价格证据，最终落到以尽调结果为门槛的决策上。
    data:
      nodes:
        - id: commercial-proof
          label: 商业验证
          detail: 据报道，已有 5 颗卫星部署，积压订单约 30 颗，合同总额约为 $500M。
        - id: conversion-test
          label: 转化测试
          detail: 必须将积压订单与已确认收入分开，并检验取消风险和交付时点。
        - id: financial-test
          label: 财务测试
          detail: 公开收入数据在年份、定义和计算方法上并不一致。
        - id: price-context
          label: 价格背景
          detail: $954M 二级市场报价和 $1B 轮融资基准只是参考，并非内在价值。
        - id: terms-test
          label: 条款测试
          detail: 完全摊薄后的持股、优先权、现金和烧钱情况仍需通过私下尽调确认。
        - id: decision
          label: 继续研究
          detail: 在转化、财务和条款测试通过前，暂不确定入场估值和目标回报。
      edges:
        - from: commercial-proof
          to: conversion-test
        - from: conversion-test
          to: financial-test
        - from: financial-test
          to: price-context
        - from: price-context
          to: terms-test
        - from: terms-test
          to: decision
    approximationNotes: 该流程是定性的，不代表概率、比例大小或计算所得的估值。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV014
