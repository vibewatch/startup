chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、平台概念与商业模式
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital Solutions Inc. 于 2017 年 1
              月成立，目标是消除轨道空间任务长期面临的复杂性和资本门槛。公司总部位于加利福尼亚州旧金山，并在科罗拉多州和法国图卢兹设有工程设施。Loft Orbital
              开创了太空基础设施即服务模式，为政府机构和商业企业提供近地轨道的一站式接入。公司不要求客户定制卫星平台，而是预先采购标准化模块化航天器，将多个客户的有效载荷集成到共享任务中。其专有任务控制软件 Cockpit
              可近实时完成卫星任务调度、数据访问和有效载荷监控，把定制化航天采购变成可预期的软件定义公用服务。
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO008
              - CO010
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO010
              - CO011
      - number: '1.2'
        title: 创始人、高管领导层与治理结构
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital 由联合创始人兼 CEO Pierre-Damien Vaujour 领导；他拥有丰富的欧美航天项目经验。联合创始人兼 COO Alex Greenberg
              负责航天器交付和技术任务执行。创始团队还包括董事 Antoine de Chassy，他为公司连接欧洲国防机构和法国国家空间研究中心 CNES 提供了重要纽带。公司由活跃的董事会负责治理，成员既有创始人高管，也有
              Foundation Capital 的 Steve Vassallo
              等独立代表。航天系统和软件工程等职能由经验丰富的负责人日常管理，但高管团队早已承担争取关键国家安全飞行器和机构客户合同的角色，关键人物依赖仍集中于该团队。
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.3'
        title: 融资历史、投资人阵容与估值轨迹
        blocks:
          - type: paragraph
            body: >-
              自 2017 年成立以来，Loft Orbital 通过多轮机构融资累计筹集 $316 million 至 $330 million 风险股权资金。最初是 Uncork Capital 的种子轮支持；2019
              年，Foundation Capital 领投 $13 million A 轮；2021 年 12 月，BlackRock 又领投 $140 million B 轮。2025 年 1 月，公司完成 $170
              million C 轮融资，由法国资产管理机构 Tikehau Capital 与 Axial Partners 共同领投，Temasek 和法国主权银行 Bpifrance 参投。该轮融资将投后估值定在
              $1.0 billion，公司由此跻身独角兽。截至 2026 年 10 月，Nasdaq Private Market、Forge Data 等另类交易系统的私募二级市场交易指示，对应的股权标记估值约为 $954
              million。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO009
      - number: '1.4'
        title: 运营飞行里程碑、积压规模与关键执行风险
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital 已成功执行 5 次卫星任务，将 25 个以上不同客户的有效载荷送入近地轨道，客户包括 NASA、Eutelsat 和欧洲空间局。公司早期完成 YAM-2 和 YAM-3
              飞行演示，随后借助 YAM-6 拓展边缘计算，验证了在轨人工智能推理和纯软件虚拟任务。运营动能来自超过 $500 million 的合同积压，涉及 30 多颗计划于 2026
              年及以后发射的已签约卫星。不过，战略审查指出，快速扩张也带来严重运营风险，包括高资本强度、对卫星平台供应商的依赖，以及外部发射载具延期；这些因素会直接压缩交付利润率并推迟客户开票。
            claimRefs:
              - CO011
              - CO012
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO005
              - CO007
              - CO012
              - CO013
      - number: '1.5'
        title: 图表
        blocks:
          - type: callout
            title: 平台标准化降低进入太空的门槛
            body: >-
              Loft Orbital 的核心架构创新，是把客户传感器有效载荷与定制航天器工程解耦。公司提供标准化接口、预购卫星平台和专有 Cockpit
              任务控制软件，把卫星部署周期从数年压缩到数月，同时搭建可重复收费的服务模式。
            calloutType: insight
            claimRefs:
              - CO002
              - CO011
          - type: callout
            title: 资本强度与第三方发射脆弱性
            body: 尽管合同积压已超过 5 亿美元，Loft Orbital 的增长仍受航天供应链依赖和第三方发射排期天然约束。要确保可预测的轨道部署计划并维持卫星平台库存，公司需要持续资本支出和稳健的供应商协同。
            calloutType: risk
            claimRefs:
              - CO011
              - CO013
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital
              的相关市场小于整个太空经济：它面向不想自建完整航天器项目、却需要集成、发射、获批、运营和调度有效载荷或软件工作负载的机构，提供外包的近地轨道基础设施。服务组合覆盖标准化卫星容量、有效载荷集成、发射预订、监管与保险事务、在轨调试、日常运营和软件控制层。因此，核心支出属于托管有效载荷、一站式任务、共享卫星容量和在轨软件工作负载。专用定制航天器、纯发射服务、地面云和下游数据产品属于相邻或替代预算，不在核心边界内。现状是买方自行采购定制卫星和运营栈，以更高资本投入和项目复杂度换取专属控制权。
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
      - number: '2.2'
        title: 避免虚假精确的市场规模估算
        blocks:
          - type: paragraph
            body: >-
              审阅过的资料不足以支持传统 TAM/SAM/SOM 计算。最宽泛的数字市场指标是 Tracxn 报告的 2026 年迄今美国太空科技融资 $6.91 billion，但风险融资是资本供给，不是客户支出。$237
              million 的 STEP 2.0 上限是多供应商采购工具，不是 Loft 的收入；约 $500 million 的报告合同总额代表公司牵引，但其期间、取消权和收入转化计划均未披露。5 颗已部署卫星、约 30
              颗积压卫星，以及自 2026 年起每年发射超过 10 次的计划，提供的是产能和采用信号，而非市场分母。因此，下方证据梯保留不同单位并明确拒绝相加；要得出可辩护的 SAM 和
              SOM，还需要项目级预算、服务定价、赢单率和积压转化数据。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM015
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              已有资料显示，需求来自政府和国防机构、商业地球观测及通信运营商、民用科学项目，以及寻求在轨算力的软件开发者。经济买方通常是任务或项目办公室；有效载荷工程师、科学家、分析师或应用开发者是用户；付款方则是公共采购机构或商业任务所有者。当有资金支持的有效载荷或软件目标能够接受共享或标准化基础设施，并且更看重确定的排期而非定制平台时，采用就会启动。公开案例包括
              NASA、通过 Honeywell 合作的加拿大航天局、EarthDaily、Wyvern，以及 Little Place Labs 和 SkyServe
              的软件部署。这些案例证明了细分市场的相关性，但不能证明市场规模、客户集中度、复购率或可迁移的单位经济性。
            claimRefs:
              - CM003
              - CM005
              - CM011
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM011
              - CM016
      - number: '2.4'
        title: 驱动因素、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              需求受到地球观测、通信、科学研究、国家安全以及向有效载荷中心或软件定义任务转型的支持。在标准化平台上托管多个有效载荷，可以减少重复的航天器工作并加快客户进入轨道；据报道，C
              轮融资将用于扩大机队和服务模式。采用仍受第三方发射排期、卫星产能、资本强度、集成复杂度、监管和买方共享基础设施意愿影响。2026 年 10 月约 9.54
              亿美元的私募市场标记明确只是二级定价估算，可能依赖有限数据，不能替代市场需求。估值因此应绑定经验证的合同转化、利润率、利用率和重复采购，而不是广泛生态资本或缺乏依据的 TAM 倍数。
            claimRefs:
              - CM005
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 牵引力不等于市场规模
            body: 报告的合同金额、积压数量、已部署卫星、融资额和采购上限对应不同分母和期间；它们应作为采用和产能信号，而不能相加成 TAM。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM014
          - type: callout
            title: 通往 SOM 的缺失桥梁
            body: 没有服务定价、多供应商上限中的获授份额、合同取消条款和订单到收入的转化数据，可获取市场及估值敏感性仍无法量化。
            calloutType: risk
            claimRefs:
              - CM011
              - CM013
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 分层而非单一类别的竞争格局
        blocks:
          - type: paragraph
            body: >-
              指定资料没有收敛出单一直接同业群。Tracxn 将 Exolaunch、Spaceflight 等发射与集成服务商列入比较集；Owler 提到 Satellogic、Capella Space
              等地球观测运营商；一份聚焦法国的目录还加入发射、推进、连接、航天器和国防领域的老牌企业。这种分歧本身就有决策价值：买方可以在多个层级替代，从采购发射集成到购买垂直整合星座提供的结果。传统航天器和发射巨头属于相邻方案，并非已证实的逐项替代者。内部自建和由主承包商主导的定制采购仍是可信的现状路径，但指定证据没有可比成本、排期或输赢记录，无法据此排序。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
