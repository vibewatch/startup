  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现机制
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital
              以太空基础设施即服务构建商业模式，把卫星任务交付与定制硬件制造解耦。公司主要通过三条路径变现：实体有效载荷托管任务、部署到在轨航天器上的虚拟软件任务，以及按需传感器调度。实体任务中，客户可购买专用微型卫星部署，或购买
              Loft YAM 系列航天器上的共享搭载位置；小型有效载荷位置历史年价约为 $1 million 至 $2 million。对法国 DESIR 合成孔径雷达演示等大型机构项目，Loft
              作为主承包商承接数百万欧元合同。虚拟任务允许分析服务商和政府机构直接向在轨算力节点上传算法，无需承担硬件发射费用。超过 30 颗已签约卫星累计报告客户订单额超过 $500
              million，体现商业牵引。但已确认收入仍大体不透明；最近披露的历史年收入为与 2021 年 11 月融资相关的 $6 million，说明大量已签合同仍在积压，等待按计划部署入轨。
