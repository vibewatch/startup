      - number: '4.3'
        title: 单位经济、市场可比与牵引披露
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital 的商业签约速度可观，但独立财务分析指出，单个有效载荷和单次推理交易的单位经济仍未经证明。公司与阿联酋合作伙伴 Marlan Space 宣布建设 50 颗卫星、总额 $1 billion
              的在轨 AI 星座；这类大型承诺需要国家持续支持，才能覆盖硬件成本。商业地球观测影像价格不断下滑，除非在轨算力能卖出软件溢价，否则利润率将承压。二级市场交易报价约为每股 $25，截至 2026 年 10 月对应
              Loft Orbital 隐含股权估值约 $954 million。相较历史收入披露，这一估值倍数偏高，定价反映的是增长预期，而非经审计的盈利能力。ICEYE、SpinLaunch
              等太空科技同业同样面临资本密集的部署周期，已宣布的积压订单往往跑在投运轨道产能前面。Loft 已部署 5 颗卫星，另有约 30 颗积压订单；评估这笔投资，关键是把确定的商业现金流与投机性的星座公告分开。
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI016
