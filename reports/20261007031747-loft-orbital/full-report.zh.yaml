      - number: '4.2'
        title: 成本结构、毛利率驱动因素与价值链衔接
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital 的成本结构建立在硬件抽象之上。公司不运营专用航天器生产线、承担沉重资本支出，而是向 Airbus、LeoStella 等商业供应商采购经过飞行验证的标准卫星平台。通用 Payload
              Hub 适配器统一不同客户传感器的电气、数据和机械接口，降低一次性工程费用并缩短集成周期。公司通过向 SpaceX 等发射商预订火箭舱位管理发射费用，以取得可预测排期和批量价格。凭借这一资本效率结构，公司在 C
              轮前仅筹集 $160 million 股权资本，却积累了超过 $500 million 客户订单。国防项目是服务交付收入的重要驱动，Loft 已签署超过 $100 million
              美国国防合同，包括为国家安全星座供应 Longbow 卫星平台。随着任务从实体集成转手转向多租户在轨软件执行，毛利率扩张取决于把固定空间段采购成本摊入持续的软件订阅。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
