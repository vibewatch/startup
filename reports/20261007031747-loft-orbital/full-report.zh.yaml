              Tracxn 描述 Loft 的服务覆盖平台制造与集成、标准接口、发射预订与集成、监管合规、许可、保险、调试和日常运营。NewSpace Tracker 另称其模式采用预制标准化卫星。这支持“广度”判断：Loft
              协调的任务生命周期比发射经纪商或发射载具运营商更长，但不能证明任何单个组件独特，也不能证明老牌企业无法打包类似服务。公开规模信号同样不一致。融资和积压目录显示资本与需求均有一定规模，而三个当前员工数快照从约
              200 人到 361 人不等。这些数字应视为目录估算，而非可靠的运营规模基准。
            claimRefs:
