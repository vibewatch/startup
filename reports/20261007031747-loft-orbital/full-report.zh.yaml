        blocks:
          - type: paragraph
            body: >-
              Loft Orbital 的主要技术护城河在于硬件抽象层和运营标准化。通过 Payload Hub 将有效载荷设计与卫星平台工程解耦，Loft 把传统多年航天周期压缩到 12
              个月以内，使异构客户仪器可以共存于同一飞行平台。但这一策略也带来关键运营和架构脆弱性。Loft 不自行制造航天器平台，因此在平台交付和价格稳定性上结构性依赖 Airbus、LeoStella
