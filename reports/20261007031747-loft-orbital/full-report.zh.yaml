        title: 商业持久性取决于尚未公开的执行证据
        blocks:
          - type: paragraph
            body: >-
              当前 Loft Federal
              招聘描述是公司发布的证据，显示联邦业务正从运营者主导转向更成熟的项目组织，并明确关注成本、排期、供应商、合同交付物、利润率和客户承诺。如果执行能够复现，这可能成为信任和分销优势；但也说明运营体系仍在建设。一份声誉较低的面试指南描述了复杂、长周期、多利益相关方的销售，这与上述姿态方向一致，但不是基准。最重要的是，指定资料没有披露可比标价、实际合同条款、折扣、续约行为、多归属、服务水平或竞争赢单率。因此，在完成客户和合同尽调前，投资判断应把切换成本和定价权视为待验证假设。
