      - number: '7.2'
        title: 工业供应链集中与平台硬件依赖
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital 平台的工业基础高度结构性依赖第三方卫星平台制造商和商业发射商。公司的标准 Longbow 平台架构与 Airbus 国防和航天生产线紧密结合 [CR005,
              CR006]。这种标准平台策略虽然消除了定制航天器工程，把一站式集成周期从数年缩短到数月，却带来严重供应商集中 [CR005, CR007]。Airbus
              内部任何工业瓶颈、零部件涨价或项目优先级调整，都会直接影响 Loft 的硬件集成排期和毛利率 [CR005]。此外，Loft 从定制单星部署转向每年超过 10 颗卫星的机队节奏，会放大卫星测试和入轨交付的运营风险
              [CR008, CR009]。为缓解 30 颗积压卫星的子系统集成瓶颈（合同总额约 5 亿美元），Loft 高度依赖硬件在环自动化测试台和资源共享架构 [CR007,
              CR009]。但执行脆弱性仍集中在轨道共享搭载发射节奏：主要商业发射商的发射载具延误或助推器异常，可能波及多个托管客户有效载荷 [CR005, CR008, CR009]。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
