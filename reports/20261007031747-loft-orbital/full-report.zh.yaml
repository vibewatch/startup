      - number: '7.3'
        title: 资本强度、积压执行与估值标记压缩
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital 的商业模式要求在确认任务收入前，先投入大量资本采购卫星平台、锁定发射载具舱位并维持有效载荷适配器安全库存 [CR008, CR010]。公司 2025 年 1 月完成 1.7 亿美元 C
              轮后，名义投后估值超过 10 亿美元，但私募二级市场显示定价摩擦和倍数压缩明显 [CR008, CR011, CR012]。私募流动性平台的二级市场指示价约为每股 24.77—25 美元，对应估算企业价值约
              9.54 亿美元 [CR011, CR012, CR013]。2025 年末较早的私募交易显示隐含估值最低约 6.09 亿美元，反映市场对长期烧钱的高资本强度太空基础设施供应商更广泛的怀疑
              [CR011]。Rogue Space Systems、Exotrail 等新兴轨道转移和小卫星平台运营商加剧托管有效载荷竞争，也使商业共享搭载任务的定价权承压 [CR014]。因此，Loft
              的利润率走势高度依赖把软件定义虚拟任务和边缘算力有效载荷变现，以抵消实体平台制造和发射成本上涨 [CR006, CR014]。
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: Airbus 平台依赖与利润率压缩
            body: >-
              Loft Orbital 的运营模式根本上依赖围绕 Airbus 制造的 Longbow 卫星平台标准化有效载荷。平台标准化虽能加快任务集成，却让 Loft 暴露于单一供应商定价权、潜在零部件短缺和 Airbus
              内部优先级冲突；公司正试图把发射排期扩大到每年 10 颗以上。
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR008
          - type: callout
            title: 轨道碎片要求构成结构性合规成本
            body: >-
              欧盟零碎片宪章和美国 ORBITS 法案于 2026 年正式执行，把任务后的处置从最佳实践变成硬性监管责任。由于 Loft Orbital
              托管第三方有效载荷，公司直接承担确保五年内达到百分之九十五离轨合规率的运营和法律责任，并增加工程核验成本和潜在排期摩擦。
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持“继续研究”的建议，置信度中低，投资判断风险高。多个独立数据库确认 Loft Orbital 于 2025 年 1 月完成 1.7 亿美元 C 轮；最相关的两个价格信号是 2025 年 1 月 10
              亿美元轮融资基准和 2026 年 10 月 9.54
              亿美元私募市场标记。这些信号反映交易和二级市场背景，不是内在价值。公开证据没有披露完全摊薄股数、清算优先权、当前已确认收入、毛利率、现金余额或烧钱速度。没有这些输入，既无法计算目标回报，也无法确定可辩护的持有期；两个名义估值之间的有限差额本身不是安全边际。
            claimRefs:
              - CV001
