      - number: '4.4'
        title: 资本充足性、未来烧钱与投资判断
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital 于 2025 年 1 月完成由 Tikehau Capital 与 Axial Partners 共同领投的 $170 million C
              轮融资，资产负债表明显增强；按已记录融资事件计算，机构累计融资约 $326 million 至 $330 million。这笔融资为执行 2025、2026 年卫星集成排期，以及扩大阿布扎比 Orbitworks
              等国际合资项目提供了即时资本充足性。但投资判断必须设置严格尽调护栏。自 2021
              年以来，公司没有公开披露经审计损益表、已确认毛利率或月度经营现金烧钱速度。此外，当主权方同时充当锚定客户和本土工厂赞助方时，主权合作合同可能限制商业定价上限。我们的财务结论是：Loft Orbital
              是一个潜力较高、拥有强国防合同支持的太空基础设施平台，但若无法取得私有经审计财务报表和客户留存数据，就无法判断订单转化为实际自由现金流的速度。
            claimRefs:
              - CI001
              - CI013
              - CI015
