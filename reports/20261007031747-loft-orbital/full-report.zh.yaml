      - number: '5.2'
        title: 模块化架构：Payload Hub、卫星平台与地面工具
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital 的技术基础，是贯穿空间、地面、硬件和软件层的模块化解耦架构。核心硬件接口 Payload Hub 是通用适配器，可把不同客户有效载荷接入标准卫星平台。Hub
              统一机械和嵌入式领域的配电、数据总线、热控以及指挥控制接口，免去每个有效载荷的一次性工程。客户在实体集成前，使用标准化 HubKit 验证电气、机械和软件接口。在太空中，Loft 将 Hub 安装到从
              Airbus（源自 OneWeb 的 Longbow 平台）和 LeoStella 等工业航天制造商采购的经飞行验证卫星平台上。在地面，客户调度、遥测跟踪和数据下行通过 Cockpit 管理；Cockpit
              是基于网页且可通过 API 访问的任务运营门户，并配合与 Microsoft Azure 合作托管的 Ultimate Edge 运行环境部署在轨 AI 应用。
