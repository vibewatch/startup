      - number: '5.3'
        title: 在轨 AI 处理、边缘算力与虚拟测试台
        blocks:
          - type: paragraph
            body: >-
              为支持软件定义太空任务，Loft Orbital 引入边缘计算能力，把卫星变成近地轨道分布式算力节点。在 YAM-6 等卫星上，Loft 集成辐射加固算力平台，包括 NVIDIA Jetson 图形处理器和
              ARM 处理器，与客户软件运行时并行运行。通过与美国太空军和 Wallaroo.AI
              的合作演示，虚拟任务流水线允许运营者在地面构建、打包并测试机器学习模型，再上传容器化推理微服务。在轨道上，机载相机采集原始高光谱和光学影像，经过预处理与对齐后，送入 YOLO、SSDLite
              等计算机视觉模型，识别舰船等目标。Loft 在轨道过滤影像并提取边界框和元数据，从而实现低延迟情报下行，缓解射频下行带宽和地面站联系窗口的严重瓶颈。
            claimRefs:
              - CE009
              - CE010
              - CE012
              - CE013
      - number: '5.4'
        title: 产品组合、星座成熟度与积压执行
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital 的产品组合围绕一站式卫星容量、共享搭载位置、专用星座和软件运行环境展开。截至 2026 年末，公司已通过 YAM（“Yet Another
              Mission”）飞行系列发射多颗运营卫星，包括 YAM-2、YAM-3、YAM-5 和 YAM-6，同时积压约 30 颗待交付卫星。主要商业合同包括托管 EarthDaily 的 10 颗地球观测星座、搭载
              Esper 的 Four Leaf Clover 高光谱传感器，以及托管 Helsing 的实时防务态势感知星座。此外，Loft Federal 还根据 Space Development Agency 的
              NExT 项目和 Space Force STEP 2.0 采购工具等合同执行国防演示。商业动能证明客户接受外包基础设施，但从单次发射扩展到多卫星机队运营，会带来显著集成排期风险和供应链依赖。
