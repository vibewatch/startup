        title: 图表
        blocks:
          - type: callout
            title: 价格尚不足以形成投资判断
            body: 只能把 $954 million 和 $1 billion 视为可观察的私募市场锚点。要形成可投资价格判断，还需要经审计的已确认收入、毛利率、现金和烧钱速度、积压转化、完全摊薄所有权、清算优先权以及可信退出路径。
            calloutType: recommendation
            claimRefs:
              - CV005
