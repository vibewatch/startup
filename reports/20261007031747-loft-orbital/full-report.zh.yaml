  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 展示从客户任务签约、总线采购、载荷集成和轨道运营，到软件驱动利润实现的运营流程。
    data:
      nodes:
        - id: mission-contracting
          label: 1. 任务签约
          description: 客户签署物理载荷托管合同（$1M-$2M 拼车或专用任务）或虚拟计算部署合同。
        - id: bus-procurement
          label: 2. 总线采购
          description: Loft 从库存合作伙伴（Airbus OneWeb Longbow、LeoStella）采购预组装标准卫星总线，不投入自有制造资本开支。
        - id: universal-integration
          label: 3. 通用集成
          description: Loft 用专有 Payload Hub 将客户载荷集成到标准总线上，免除定制非经常性工程。
        - id: launch-deployment
          label: 4. 发射与启用
          description: 任务通过预订的 SpaceX 拼车或专用火箭窗口发射至低地球轨道，随后启用。
        - id: cockpit-operations
          label: 5. Cockpit 运营
          description: Loft 用 Cockpit 软件运营在轨资产，提供原始遥测、载荷指令和下行带宽。
        - id: virtual-compute
          label: 6. 虚拟 AI 增购
          description: 其他客户无需发射新硬件，即可将软件工作负载和 AI 模型（Ultimate Edge）部署到在轨 GPU。
        - id: margin-expansion
          label: 7. 利润率扩张
          description: 固定硬件集成转收费逐步摊薄，使高毛利的经常性软件和数据服务驱动盈利。
      edges:
        - from: mission-contracting
          to: bus-procurement
          label: 资本承诺
        - from: bus-procurement
          to: universal-integration
          label: 总线交付
        - from: universal-integration
          to: launch-deployment
          label: 可飞行航天器
        - from: launch-deployment
          to: cockpit-operations
          label: 轨道启用
        - from: cockpit-operations
          to: virtual-compute
          label: 多租户容量
        - from: virtual-compute
          to: margin-expansion
          label: 软件变现
    approximationNotes: 流程架构展示运营价值链；专用主权合同和共享商业拼车在各阶段的财务贡献不同。
    claimRefs:
      - CI004
      - CI006
      - CI007
      - CI010
  - id: FE001
    title: Loft Orbital 全栈产品与运营架构
    type: stack
    summary: 分层图展示 Loft Orbital 覆盖客户应用、任务控制、飞行软件、通用适配器硬件和航天器总线平台的端到端技术栈。
    data:
      layers:
        - label: 客户应用层
          detail: Cockpit 网页 UI、客户任务调度 API 和 Virtual Mission 容器化边缘应用
        - label: 地面基础设施与运营层
          detail: 全球地面站网络、自动过境排期和云端数据分发管线
        - label: 飞行软件与边缘运行时
          detail: 机载软件（OBSW）、Ultimate Edge Azure 环境和容器化推理引擎
        - label: 通用 Payload Hub 层
          detail: 专有物理适配器，统一电力、数据、机械安装和热总线
        - label: 卫星总线与发射层
          detail: 经飞行验证的第三方卫星总线（Airbus Longbow、LeoStella）和签约运载器
        - label: 在轨电力与推进子系统
          detail: 太阳能阵列发电、电池储能、反作用轮和轨道推进单元
    approximationNotes: 展示 Loft Orbital 平台从地面接口到物理航天器的功能架构拆解。
    claimRefs:
      - CE004
      - CE005
      - CE007
      - CE008
      - CE009
      - CE011
  - id: FU001
    title: 客户旅程与证据检查点
    type: journey-map
    summary: 商业路径清晰可见，但部署后公开证据变弱，因为使用、续约和扩张指标未披露。
    data:
      items:
        - label: 任务定义
          detail: 买方提出物理载荷、虚拟应用或按需感知需求。
          touchpoints:
            - 可行性
            - 定价
            - 服务等级协议
        - label: 集成与验证
          detail: 载荷或应用对照 Loft 的标准化接口测试。
          touchpoints:
            - HubKit
            - 虚拟测试环境
            - 环境测试
        - label: 发射与启用
          detail: Loft 协调发射、许可、集成和初始运营。
          touchpoints:
            - 发射行动
            - 启用
            - 验收里程碑
        - label: 任务调度与运营
          detail: Cockpit 提供载荷任务调度和近实时数据访问。
          touchpoints:
            - 仪表盘
            - API
            - 任务运营
        - label: 机载洞察
          detail: 公司报告的 YAM-6 案例在下行前将影像转换为紧凑元数据。
          touchpoints:
            - 边缘处理
            - 缩小下行载荷
            - 低延迟用例
        - label: 续约或扩张
          detail: 潜在路径包括增加载荷、卫星、应用或重复任务调度，但实际扩张情况未披露。
          touchpoints:
            - 续约
            - 星座扩容
            - 使用量增长
    approximationNotes: 按顺序呈现的定性旅程；不代表转化率、经过时间或同一客户群体。
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU013
      - CU015
