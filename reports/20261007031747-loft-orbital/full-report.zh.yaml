      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是，一站式服务把有效载荷集成、发射预订、许可、保险、融资和卫星运营结合起来，可以缩短客户采用周期。当前行业资料显示，公司已部署 5 颗卫星、积压约 30 颗，合同总额约 $500
              million，构成有意义的需求证据。反论点是，积压不是已确认收入，融资不是可用现金，依赖发射的交付可能推迟转化。公开收入口径从 2021 年 11 月记录的 $6 million，到 $10
              million-$100 million 统计区间，再到另一项 2025 年 $139.6 million 估算不等。这些指标的年份、方法和可能的会计基础不同，不能混合成增长率或估值倍数。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.3'
        title: 估值方法与可比背景
        blocks:
          - type: paragraph
            body: >-
              对服务平台而言，收入倍数法在方向上相关，但分母目前不可靠。Multiples.vc 根据 $6 million 记录收入，报告 Loft Orbital 2021 年 11 月 B 轮收入倍数为 91.7
              倍；这只是历史交易观察，不是当前倍数。其可比公司集合的 LTM 收入倍数从 BlackSky 的 6.9 倍到 Satellogic 的 20.7
              倍不等，但这些公司的资产强度、客户组合、成熟度和披露质量不同。把该区间套用到 IncFact 区间或 GetLatka 估算，会得到极宽且方法薄弱的结果。因此，$954 million 和 $1 billion
              标记应继续作为市场锚点，而不是宣称的公允价值区间。
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 情景、退出准备度与尽调
        blocks:
          - type: paragraph
            body: >-
              由于公开证据不支持概率估计或下行底线，情景框架是条件式而非数值概率式。乐观情景要求积压及时转化、经审计收入接近公开估算上限，并证明利润率可重复；只有这样才有理由支持高于 $1 billion
              轮融资基准的溢价。基准情景仅把 $954 million 至 $1 billion 视为当前可观察指示区间，尽调仍在进行。若发射延误、订单取消或融资条款使新资本处于次级，悲观情景将低于 $954
              million；但没有股权结构表和流动性数据，跌幅无法量化。Loft 仍是私有公司，因此退出时点和路径也未经验证。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
