  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管要求、碎片治理与主权数据合规
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital
              在美国和欧洲两套司法辖区内同时运营多租户及专用太空基础设施，因而共享平台模式暴露于不断变化的监管框架。轨道治理从自愿指南转向具有约束力的法律执行，会形成运营和财务合规负担。欧盟零碎片宪章和美国参议院 ORBITS
              法案等国际要求，规定卫星运营商必须保证任务结束后五年内成功离轨概率达到百分之九十五 [CR001]。对 Loft
              的模块化共享搭载和托管有效载荷架构而言，公司必须核验并保证异构第三方实体有效载荷的寿命终止处置方案，形成合规成本 [CR001, CR002]。同时，法国武装部委托 Loft
              建造法国首颗主权合成孔径雷达卫星，体现其不断扩大的主权国防业务，也对数据治理设下严格技术边界 [CR003, CR004]。在主权采购框架下，加密下行、任务调度和遥测不能经过外国或商业公共服务器，因此需要
              Loft 虚拟任务运营中心等隔离环境 [CR004]。若无法维持严格的密码隔离或离轨监管保证，公司将与 FCC、CNES 和国防采购机构等监管方产生严重许可摩擦 [CR001, CR004]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
