  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、服务交付与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital 通过抽象轨道任务的机械、电气、监管和运营复杂性，提供太空基础设施即服务。过去，把传感器送入近地轨道需要定制卫星工程、多年采购周期和直接拥有卫星。Loft
              采用替代模式，以标准化、经飞行验证的航天器平台提供一站式轨道接入。客户可使用三种主要交付模式：实体任务、虚拟任务和按需任务。实体任务中，客户提供传感器或仪器，由 Loft
              集成、测试、发射并运营。虚拟任务中，软件开发者和国防终端用户把容器化软件模型直接部署到配备 GPU 和软件定义无线电的 Loft 在轨卫星上。按需任务中，用户通过云软件调度 Loft
              已部署星座中的活跃传感器采集数据，无需发射专用硬件即可获得处理后的数据流。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
