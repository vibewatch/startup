figures:
  - id: "FI001"
    title: "Revenue Model Bridge"
    type: "flow"
    summary: "Operating flow from customer mission contracting through bus procurement, payload integration, and orbital operations to software-driven margin realization."
    data:
      nodes:
        - id: "mission-contracting"
          label: "1. Mission Contracting"
          description: "Customer signs contract for physical payload hosting ($1M-$2M rideshare or dedicated mission) or virtual compute deployment."
        - id: "bus-procurement"
          label: "2. Bus Procurement"
          description: "Loft procures pre-assembled standard satellite bus from inventory partners (Airbus OneWeb Longbow, LeoStella) without in-house manufacturing capex."
        - id: "universal-integration"
          label: "3. Universal Integration"
          description: "Loft integrates customer payload onto standard bus using proprietary Payload Hub, eliminating bespoke non-recurring engineering."
        - id: "launch-deployment"
          label: "4. Launch & Commissioning"
          description: "Mission is launched to Low Earth Orbit via pre-booked SpaceX rideshare or dedicated rocket slot and commissioned."
        - id: "cockpit-operations"
          label: "5. Cockpit Operations"
          description: "Loft operates the on-orbit asset using Cockpit software, delivering raw telemetry, payload command, and downlink bandwidth."
        - id: "virtual-compute"
          label: "6. Virtual AI Upsell"
          description: "Additional customers deploy software workloads and AI models (Ultimate Edge) to on-orbit GPUs without launching new hardware."
        - id: "margin-expansion"
          label: "7. Margin Expansion"
          description: "Fixed hardware integration pass-through amortizes, allowing high-margin recurring software and data services to drive profitability."
      edges:
        - from: "mission-contracting"
          to: "bus-procurement"
          label: "Capital commitment"
        - from: "bus-procurement"
          to: "universal-integration"
          label: "Bus delivery"
        - from: "universal-integration"
          to: "launch-deployment"
          label: "Flight-ready spacecraft"
        - from: "launch-deployment"
          to: "cockpit-operations"
          label: "Orbital commissioning"
        - from: "cockpit-operations"
          to: "virtual-compute"
          label: "Multi-tenant capacity"
        - from: "virtual-compute"
          to: "margin-expansion"
          label: "Software monetization"
    approximationNotes: "Flow architecture illustrates the operational value chain; financial contribution per stage varies between dedicated sovereign contracts and shared commercial rideshares."
    claimRefs:
      - "CI004"
      - "CI006"
      - "CI007"
      - "CI010"

callouts:
  - calloutType: "risk"
    title: "Unproven Unit Economics and Margin Pressure on Orbital Compute"
    body: "While Loft Orbital markets orbital AI compute as a high-margin software business, the underlying unit economics remain unproven in operational deployments. Satellite operating costs, thermal constraints, and potential launch delays risk compressing margins unless recurring per-inference software revenue materializes."
    claimRefs:
      - "CI011"
      - "CI012"
  - calloutType: "insight"
    title: "Capital Efficiency Enabled by Bus Hardware Abstraction"
    body: "By avoiding vertical integration and procuring standardized satellite buses from commercial partners such as Airbus and LeoStella, Loft achieved over $500 million in lifetime bookings on approximately $160 million in capital prior to its Series C."
    claimRefs:
      - "CI002"
      - "CI006"
      - "CI008"

