company:
  name: Loft Orbital
chapter:
  number: 1
  title: Company Overview
  summary: Loft Orbital is a French-American space infrastructure company providing standardized microsatellite payload hosting and Space Infrastructure as a Service. Founded in 2017, the company reached a $1.0 billion Series C valuation in January 2025 and holds an estimated $500 million contract backlog across defense, civil government, and commercial customers.
sections:
  - id: company-identity-and-mission
    title: Corporate Identity, Platform Concept, and Business Model
    body: Loft Orbital Solutions Inc. was founded in January 2017 to eliminate the complexity and capital barriers traditionally associated with orbital space missions. Headquartered in San Francisco, California, the company operates across engineering facilities in Colorado and Toulouse, France. Loft Orbital pioneered a Space-Infrastructure-as-a-Service model that delivers turnkey access to low Earth orbit for government agencies and commercial enterprises. Rather than requiring customers to commission custom satellite buses, Loft Orbital pre-procures standardized modular spacecraft and integrates multiple customer payloads onto shared missions. The company proprietary mission control software, Cockpit, facilitates routine satellite tasking, data access, and payload monitoring in near-real time, effectively transforming bespoke spaceflight procurement into a predictable, software-defined utility.
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO008
      - CO010
      - CO011
    tableRefs:
      - TO001
  - id: founders-leadership-and-governance
    title: Founders, Executive Leadership, and Governance Structure
    body: Loft Orbital is led by co-founder and Chief Executive Officer Pierre-Damien Vaujour, who brings extensive background in European and American aerospace programs, alongside co-founder and Chief Operating Officer Alex Greenberg, who oversees spacecraft delivery and technical mission execution. The founding team also includes director Antoine de Chassy, providing vital connectivity to European defense institutions and the French space agency CNES. Corporate governance is anchored by an active board of directors featuring both founder executives and independent representatives, including Steve Vassallo of Foundation Capital. While day-to-day operations benefit from experienced functional heads across aerospace systems and software engineering, key-person dependencies remain concentrated in the executive leadership team due to their established roles in securing critical national security vehicles and institutional customer contracts.
    claimRefs:
      - CO003
      - CO004
    tableRefs:
      - TO002
  - id: capitalization-investors-and-valuation
    title: Financing History, Investor Syndicate, and Valuation Trajectory
    body: Loft Orbital has raised cumulative venture equity funding between $316 million and $330 million across multiple institutional financing rounds since its 2017 inception. The financing trajectory advanced from early seed backing by Uncork Capital and a $13 million Series A led by Foundation Capital in 2019, to a $140 million Series B led by BlackRock in December 2021. In January 2025, the company secured a landmark $170 million Series C round co-led by French asset manager Tikehau Capital and Axial Partners, with participation from Temasek and French sovereign bank Bpifrance. The Series C round established a $1.0 billion post-money valuation, conferring unicorn status. In secondary private markets, trading indications on alternative trading systems including Nasdaq Private Market and Forge Data have reflected indicative equity marks around $954 million as of October 2026.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO014
    tableRefs:
      - TO003
  - id: operational-milestones-and-scaling-risks
    title: Operational Flight Milestones, Backlog Scale, and Key Execution Risks
    body: Loft Orbital operational track record includes five successful satellite missions deployed to low Earth orbit carrying over 25 distinct customer payloads for NASA, Eutelsat, and the European Space Agency. Beginning with early YAM-2 and YAM-3 flight demonstrations, the company expanded into edge computing with YAM-6, which validated onboard artificial intelligence inference and virtual software-only missions in orbit. Operational momentum is supported by an aggregate contract backlog exceeding $500 million across more than 30 contracted satellites scheduled for launch through 2026 and beyond. However, strategic reviews emphasize that rapid scaling exposes Loft Orbital to severe operational risks, including high capital intensity, satellite bus supplier dependencies, and external launch vehicle schedule delays, which can directly compress delivery margins and delay customer billing.
    claimRefs:
      - CO011
      - CO012
      - CO013
    figureRefs:
      - FO001
