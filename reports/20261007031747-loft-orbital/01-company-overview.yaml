callouts:
  - calloutType: insight
    title: Platform Standardization Lowers Space Barrier to Entry
    body: Loft Orbital core architectural innovation is decoupling customer sensor payloads from custom spacecraft engineering. By offering standardized interfaces, pre-purchased satellite buses, and proprietary Cockpit mission control software, the company compresses satellite deployment schedules from multiple years to several months while building a recurring service model.
    claimRefs:
      - CO002
      - CO011
  - calloutType: risk
    title: Capital Intensity and Third-Party Launch Vulnerabilities
    body: Despite accumulating over $500 million in contracted backlog, Loft Orbital growth is inherently constrained by aerospace supply chain dependencies and third-party launch manifests. Securing predictable orbital deployment schedules and maintaining bus inventory requires continuous capital expenditure and robust supplier coordination.
    claimRefs:
      - CO011
      - CO013
