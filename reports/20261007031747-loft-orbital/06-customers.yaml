artifact: customers
slug: loft-orbital
runDate: "2026-10-07"
company:
  name: Loft Orbital
chapter:
  number: 6
  title: Customers
  summary: >-
    Loft Orbital has credible customer proof across government, defense, civil-space,
    Earth-observation, and software-defined missions, with secondary sources reporting
    roughly $500 million of contract or booking scale and about 30 satellites in backlog
    or waitlist. The evidence is much weaker on durability: no retained source discloses
    renewals, churn, contract length, or customer concentration.
sections:
  - id: customer-segments
    title: Customer segments and buying architecture
    body: >-
      Loft sells infrastructure rather than a single data product, so its customer base
      spans several buying centers. Contrary describes government agencies, commercial
      enterprises, and international institutions using physical, virtual, or on-demand
      missions, while Multiples names NASA, the U.S. Space Force, the Space Development
      Agency, Microsoft, BAE Systems, Eutelsat, ESA, and CNES. The strongest public
      evidence therefore points to institutional and defense-led demand alongside a
      smaller commercial cohort in Earth observation, climate analytics, and edge
      computing. GetLatka's broad description of companies, governments, and institutions
      supports that segmentation only at low confidence. Public sources do not disclose
      payer-level revenue mix, geography mix, or average contract value by segment, so
      the table treats strategic value qualitatively rather than converting named logos
      into revenue contribution.
    claimRefs: [CU001, CU002, CU009, CU010, CU014, CU015]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and operating scale
    body: >-
      Adoption evidence is meaningful but not yet cohort-quality. NewSpaceTracker reports
      five deployed satellites and around 30 in backlog, most scheduled for 2025-2026,
      representing approximately $500 million in aggregate contract value. Contrary
      separately reports more than $500 million of signed contracts from 2021 through
      2025 and a roughly 30-satellite waitlist. Multiples adds a different operating lens:
      more than 30 satellites sold and more than 25 customer missions deployed across five
      launched satellites. These are bookings, contract, backlog, satellite, and mission
      measures with different denominators; none is revenue, active-customer count, or
      proof that the entire backlog has converted to launch. The directional signal is
      strong demand and a growing delivery obligation, while the investment question is
      conversion speed and realized utilization rather than headline order volume alone.
    claimRefs: [CU007, CU008, CU011]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named deployments and reference quality
    body: >-
      The named-customer set covers several distinct stages of proof. Contrary describes
      EarthDaily's constellation, Esper's planned 2026 sensor deployments, Helsing's
      planned constellation, and in-orbit applications from SkyServe, Little Place Labs,
      and Wyvern. Loft's own account says the Helsing constellation is still being
      developed, so it should not be presented as an operating production reference.
      Loft does describe a YAM-6 workload that analyzes imagery onboard, counts and
      identifies boats, and turns a full image into kilobyte-scale metadata; that is a
      concrete company-reported outcome but not an independently measured customer ROI.
      Simera Sense's statement that it supplied ten imagers over the preceding twelve
      months is partner evidence of capacity expansion, not end-customer adoption. The
      resulting proof set is credible for technical use and procurement, but mixed on
      production status and independent outcome verification.
    claimRefs: [CU003, CU004, CU005, CU006, CU009, CU010, CU012]
    tableRefs: [TU003]
  - id: durability-and-expansion
    title: Durability, expansion, and concentration
    body: >-
      The public customer record does not support conventional retention analysis. None
      of the retained sources discloses NRR, GRR, churn, renewal rates, contract duration,
      repeat-purchase cohorts, satisfaction measures, or the share of revenue and bookings
      attributable to the largest customers. The three mission modes create plausible
      expansion paths from a hosted payload to a constellation, or from a virtual
      application to repeated tasking, and Tracxn describes a dashboard for payload
      tasking and near-real-time data access. Those mechanics are not evidence that
      expansion has occurred. Delivery risk also matters: Loft says autonomous
      satellite-to-satellite self-tasking remains in progress, and the large reported
      backlog makes launch and commissioning execution central to customer durability.
      Diligence should therefore request contract-level cohorts, conversion of bookings
      to launched and accepted missions, renewal rights, cancellation provisions, and
      top-customer concentration before assigning recurring-platform economics.
    claimRefs: [CU002, CU006, CU013, CU016]
    figureRefs: [FU001]
