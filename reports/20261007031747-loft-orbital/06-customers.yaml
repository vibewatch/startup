figures:
  - id: FU001
    title: Customer journey and evidence checkpoints
    type: journey-map
    summary: "The commercial path is visible, but public evidence weakens after deployment because usage, renewal, and expansion metrics are not disclosed."
    data:
      items:
        - label: Mission definition
          detail: "Buyer specifies physical payload, virtual application, or on-demand sensing need."
          touchpoints: [Feasibility, Pricing, "Service-level agreement"]
        - label: Integration and validation
          detail: "Payload or application is tested against Loft's standardized interfaces."
          touchpoints: [HubKit, "Virtual test environment", "Environmental testing"]
        - label: Launch and commissioning
          detail: "Loft coordinates launch, licensing, integration, and initial operations."
          touchpoints: ["Launch campaign", Commissioning, "Acceptance milestone"]
        - label: Tasking and operations
          detail: "Cockpit provides payload tasking and near-real-time data access."
          touchpoints: [Dashboard, API, "Mission operations"]
        - label: Onboard insight
          detail: "Company-reported YAM-6 examples convert imagery into compact metadata before downlink."
          touchpoints: ["Edge processing", "Reduced downlink payload", "Low-latency use case"]
        - label: Renewal or expansion
          detail: "Potential paths include additional payloads, satellites, applications, or repeated tasking, but realized expansion is undisclosed."
          touchpoints: [Renewal, "Constellation expansion", "Usage growth"]
    approximationNotes: "Ordered qualitative journey; it does not imply conversion rates, elapsed time, or a common customer cohort."
    claimRefs: [CU002, CU005, CU006, CU013, CU015]
callouts:
  - calloutType: risk
    title: Contract scale is not retention
    body: >-
      Roughly $500 million of reported contracts or backlog supports demand, but the
      retained evidence does not disclose recognized revenue, renewal, churn, acceptance,
      or customer concentration.
    claimRefs: [CU007, CU008, CU016]
