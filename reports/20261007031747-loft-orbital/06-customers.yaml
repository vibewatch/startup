      - [Helsing, "European defense technology", "AI-first multi-sensor constellation for change detection and maritime monitoring", "Under development", "Target is faster onboard insight generation", "Company-issued evidence; no launched-fleet outcome in the retained sources"]
      - [SkyServe, "Commercial edge analytics", "STORM application hosted for wildfire, irrigation, and mining predictions", "Described as hosted application", "Onboard processing use case", "No customer-reported ROI, usage, or renewal data"]
      - ["Little Place Labs", "Maritime domain awareness", "Low-latency application on YAM-6", "Described as deployed", "Actionable insights with reduced downlink delay", "Outcome is reported by a secondary profile rather than the customer"]
      - [Wyvern, "Hyperspectral data provider", "On-demand access to sensor-equipped satellites", "Commercial partnership", "Intended increase in revisit rate and data volume", "No disclosed utilization or commercial impact"]
      - ["NASA / U.S. Space Force / SDA", "Government and defense", "Mission support, small-satellite procurement, and defense programs", "Contracted / procurement-stage mix", "Named institutional demand and more than $100M of U.S. defense contracts", "Program contribution and top-customer concentration are undisclosed"]
