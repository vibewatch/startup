    title: "Traction is not market size"
    body: "Reported contract value, backlog count, deployed satellites, financing, and procurement ceilings describe different denominators and periods; they should be used as adoption and capacity signals, not summed into TAM."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM010"
      - "CM011"
      - "CM014"
  - calloutType: "risk"
    title: "The missing bridge to SOM"
    body: "Without service pricing, awarded share of multi-vendor ceilings, contract cancellation terms, and bookings-to-revenue conversion, the obtainable market and valuation sensitivity remain unquantified."
    claimRefs:
      - "CM011"
      - "CM013"
      - "CM014"
