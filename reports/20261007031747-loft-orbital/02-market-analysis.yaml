company:
  name: "Loft Orbital"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Loft Orbital addresses an outsourced space-infrastructure market in which government, commercial, and scientific buyers pay to place and operate payloads without owning a complete satellite program. The assigned evidence demonstrates buyer breadth and company traction, but it does not disclose a defensible category TAM, Loft-specific SAM, or obtainable-market conversion model, so the sizing conclusion remains evidence-constrained."
sections:
  - id: "market-boundary"
    title: "Market boundary and status quo"
    body: >-
      Loft Orbital's relevant market is narrower than the total space economy: it is outsourced
      low-Earth-orbit infrastructure for organizations that need a payload or software workload
      integrated, launched, licensed, operated, and tasked without building a complete spacecraft
      program. The service bundle spans standardized satellite capacity, payload integration,
      launch booking, regulatory and insurance work, commissioning, routine operations, and a
      software control layer. Included spend therefore belongs to hosted payloads, turnkey
      missions, shared satellite capacity, and on-orbit software workloads. Dedicated custom
      spacecraft, launch-only services, terrestrial cloud, and downstream data products are
      adjacent or substitute budgets rather than the core boundary. The status quo is a buyer
      procuring a bespoke satellite and operating stack internally, accepting greater capital
      commitment and program complexity in exchange for dedicated control.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM004"
    tableRefs:
      - "TM001"
  - id: "sizing-without-false-precision"
    title: "Sizing without false precision"
    body: >-
      The reviewed pool does not support a conventional TAM/SAM/SOM calculation. Its broadest
      numeric market indicator is Tracxn's report of $6.91 billion in United States space-tech
      funding during 2026 to date, but venture funding is capital supply, not customer spend.
      The $237 million STEP 2.0 ceiling is a multi-vendor procurement vehicle, not Loft revenue,
      while the reported approximately $500 million of aggregate contract value is company
      traction whose period, cancellation rights, and revenue-conversion schedule are not
      disclosed. Five deployed satellites, around 30 in backlog, and a plan for more than ten
      launches annually from 2026 provide capacity and adoption signals rather than a market
      denominator. The evidence ladder below therefore preserves unlike units and explicitly
      refuses to add them; a defensible SAM and SOM require program-level budgets, service
      pricing, win rates, and backlog conversion.
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM009"
      - "CM010"
      - "CM011"
      - "CM014"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption-path"
    title: "Buyer, user, payer, and adoption path"
    body: >-
      The documented demand base spans government and defense agencies, commercial Earth
      observation and communications operators, civil-science programs, and software developers
      seeking on-orbit compute. The economic buyer is typically a mission or program office;
      payload engineers, scientists, analysts, or application developers are the users; and the
      payer is a public procurement authority or a commercial mission owner. Adoption starts
      when a funded payload or software objective can accept shared or standardized
      infrastructure and values schedule certainty more than a bespoke bus. Public examples
      include NASA, the Canadian Space Agency through Honeywell, EarthDaily, Wyvern, and software
      deployments by Little Place Labs and SkyServe. These examples establish segment relevance,
      not segment size, customer concentration, repeat purchase rates, or transferable unit
      economics.
    claimRefs:
      - "CM003"
      - "CM005"
      - "CM011"
      - "CM016"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-valuation-relevance"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Demand is supported by Earth observation, communications, scientific research, national
      security, and a shift toward payload-centric or software-defined missions. Hosting multiple
      payloads on standardized platforms can reduce duplicated spacecraft work and speed a
      customer's entry into orbit, while the Series C was reported as funding for fleet and
      service-model expansion. Adoption remains exposed to third-party launch schedules,
      satellite production capacity, capital intensity, integration complexity, regulation, and
      the buyer's willingness to share infrastructure. The roughly $954 million October 2026
      private-market mark is explicitly a secondary pricing estimate that may rely on limited
      data; it cannot stand in for market demand. Valuation should therefore be tied to verified
      contract conversion, margins, utilization, and repeat procurement rather than broad
      ecosystem capital or an unsupported TAM multiple.
    claimRefs:
      - "CM005"
      - "CM012"
      - "CM013"
      - "CM015"
      - "CM016"
