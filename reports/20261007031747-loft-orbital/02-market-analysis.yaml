    - type: "private-evidence-only"
      severity: "material"
      topic: "serviceable-market"
      missingEvidence: "Program-level pricing, qualified pipeline, win rates, awarded task orders, cancellation rights, backlog duration, and bookings-to-recognized-revenue conversion."
      whyItMatters: "These inputs are required to distinguish available budgets from Loft's serviceable and realistically obtainable share."
      diligencePath: "Review the customer contract register, bid pipeline, IDIQ task orders, pricing schedules, and audited revenue-recognition bridge in the data room."
