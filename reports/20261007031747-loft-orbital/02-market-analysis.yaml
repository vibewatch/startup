    - type: "missing-source"
      severity: "material"
      topic: "market-sizing"
      missingEvidence: "A reputable market study with a defined category boundary, current spend base, geography, period, and CAGR for outsourced hosted-payload and satellite-infrastructure services."
      whyItMatters: "Without a comparable top-down denominator, ecosystem funding and company traction cannot support a defensible TAM or growth-rate claim."
      diligencePath: "Obtain government and industry procurement datasets plus a methodology-disclosed analyst study, then reconcile overlapping launch, bus, operations, and data spend."
      relatedQuestionRefs:
