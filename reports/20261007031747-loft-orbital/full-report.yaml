        title: Breadth of execution is the differentiator, not a proven exclusive feature
        blocks:
          - type: paragraph
            body: >-
              Tracxn describes Loft's offer as spanning platform manufacturing and integration, standard interfaces,
              launch booking and integration, regulatory compliance, licensing, insurance, commissioning, and routine
              operations. NewSpace Tracker separately characterizes the model as using pre-built standardized
              satellites. This supports a breadth thesis: Loft coordinates more of the mission lifecycle than a launch
              broker or a launch vehicle operator. It does not prove that individual components are unique or that
              incumbents cannot bundle comparable services. Public scale signals are also inconsistent. Funding and
              backlog directories indicate meaningful capitalization and demand, while three current headcount snapshots
