      Partner concentration reflects supply-side single points of failure across core spacecraft manufacturing and
      launch logistics.
    claimRefs:
      - CR005
      - CR008
      - CR010
      - CR014
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision Dimension
      - Assessment
      - Evidence
      - Decision Implication
    rows:
      - - Recommendation
        - Research more
        - $170M Series C is corroborated, but current financial statements and security terms are unavailable
        - Do not set an entry price before private financial and cap-table diligence
      - - Confidence
        - Medium-low
        - Round amount is consistent; total funding, revenue, and current valuation evidence diverge
        - Treat public market-data pages as directional rather than audit-grade
      - - Risk rating
        - High
        - Backlog conversion depends on launch and integration execution, while margin and liquidity are undisclosed
        - Require milestone, cancellation, cash, and supplier exposure schedules
      - - Valuation stance
        - Insufficient public support
        - $954M October 2026 mark versus $1B January 2025 round benchmark
        - Use both as market anchors, not as an intrinsic-value conclusion
      - - Return / hold / exit
        - Not supportable publicly
        - Loft is privately held and public evidence does not establish exit timing or terms
        - Model returns only after fully diluted ownership, preferences, and an exit route are verified
    notes: >-
      Assessments distinguish financing raised from cash available and market marks from intrinsic value; missing
      private-company financial and security terms are shown as gaps rather than estimated.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV014
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence-Supported View
      - What Would Change the View
    rows:
      - - 'Thesis: integrated service'
        - The service covers integration, launch, licensing, insurance, financing, and operations
        - Customer references showing faster deployment and repeat purchases at acceptable margins
      - - 'Thesis: commercial proof'
        - >-
          A current profile reports five deployed satellites, about 30 in backlog, and approximately $500M in aggregate
          contract value
        - A contract-level backlog schedule with delivered, cancellable, and funded portions
      - - 'Anti-thesis: revenue opacity'
        - >-
          Public references show a $6M historical record, a $10M-$100M statistical band, and a $139.6M estimate with
          different bases
        - Audited recognized revenue, gross margin, and bookings-to-revenue reconciliation
      - - 'Anti-thesis: data quality'
        - One estimator names a CEO that conflicts with a current industry profile
        - Company-verified management, governance, and KPI data-room materials
    notes: >-
      The revenue references are intentionally not reconciled because their periods, metric definitions, and
      methodologies differ; backlog is not treated as revenue.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / Return Logic
      - Key Risks
      - Probability Signal
    rows:
      - - Bull
        - >-
          Backlog launches on schedule; recognized revenue is audited near the upper public estimate; margins and
          renewals are repeatable
        - >-
          A premium to the $1B round benchmark becomes supportable, but no public evidence supports an upper bound or
          target return
        - Launch delays, customer cancellation rights, and capital intensity
        - Not quantified; requires audited conversion and margin evidence
      - - Base
        - Backlog converts gradually while current revenue, margins, and cash remain private
        - $954M-$1B is an observable indication range, not an intrinsic-value range; no target return is supportable
        - Stale round pricing and uncertain secondary-market liquidity
        - Not quantified; consistent with unresolved public-data gaps
      - - Bear
        - Launch or integration slippage delays revenue, bookings cancel, or financing terms subordinate new capital
        - Value falls below the $954M mark; a downside floor cannot be estimated without liquidity and preference data
        - Cash shortfall, down round, preference overhang, and failed backlog conversion
        - Not quantified; triggered by slippage, cancellation, or financing stress
    notes: >-
      Scenario thresholds use only the cited $954M market mark and $1B round benchmark; probabilities, downside floors,
      and return multiples remain unquantified because required private evidence is unavailable.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
