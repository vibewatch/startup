      - number: '3.3'
        title: Commercial durability depends on execution evidence that is not public
        blocks:
          - type: paragraph
            body: >-
              The current Loft Federal job description is company-issued evidence that the federal unit is moving from
              an operator-led business toward a more mature program organization, with explicit attention to cost,
              schedule, suppliers, contract deliverables, margin, and customer commitments. This can become a trust and
