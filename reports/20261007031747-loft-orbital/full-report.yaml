  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A layered rather than single-category competitor set
        blocks:
          - type: paragraph
            body: >-
              The assigned sources do not converge on one direct peer group. Tracxn places launch and integration
              providers such as Exolaunch and Spaceflight in the comparison set, Owler names Earth-observation operators
              including Satellogic and Capella Space, and a France-focused directory adds launch, propulsion,
              connectivity, spacecraft, and defense incumbents. That divergence is itself decision-useful: buyers can
              substitute at several layers, from procuring launch integration to buying an outcome from a vertically
              integrated constellation. Traditional spacecraft and launch incumbents are adjacent rather than proven
              feature-for-feature replacements. Internal build and bespoke prime-led procurement remain credible
              status-quo paths, but the assigned evidence provides no comparable cost, schedule, or win/loss record with
