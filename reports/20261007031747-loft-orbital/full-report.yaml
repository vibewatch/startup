  - id: FI001
    title: Revenue Model Bridge
    type: flow
    summary: >-
      Operating flow from customer mission contracting through bus procurement, payload integration, and orbital
      operations to software-driven margin realization.
    data:
      nodes:
        - id: mission-contracting
          label: 1. Mission Contracting
          description: >-
            Customer signs contract for physical payload hosting ($1M-$2M rideshare or dedicated mission) or virtual
            compute deployment.
        - id: bus-procurement
          label: 2. Bus Procurement
          description: >-
            Loft procures pre-assembled standard satellite bus from inventory partners (Airbus OneWeb Longbow,
            LeoStella) without in-house manufacturing capex.
        - id: universal-integration
          label: 3. Universal Integration
          description: >-
            Loft integrates customer payload onto standard bus using proprietary Payload Hub, eliminating bespoke
            non-recurring engineering.
        - id: launch-deployment
          label: 4. Launch & Commissioning
          description: >-
            Mission is launched to Low Earth Orbit via pre-booked SpaceX rideshare or dedicated rocket slot and
            commissioned.
        - id: cockpit-operations
          label: 5. Cockpit Operations
          description: >-
            Loft operates the on-orbit asset using Cockpit software, delivering raw telemetry, payload command, and
            downlink bandwidth.
        - id: virtual-compute
          label: 6. Virtual AI Upsell
          description: >-
            Additional customers deploy software workloads and AI models (Ultimate Edge) to on-orbit GPUs without
            launching new hardware.
        - id: margin-expansion
          label: 7. Margin Expansion
          description: >-
            Fixed hardware integration pass-through amortizes, allowing high-margin recurring software and data services
            to drive profitability.
      edges:
        - from: mission-contracting
          to: bus-procurement
          label: Capital commitment
        - from: bus-procurement
          to: universal-integration
          label: Bus delivery
        - from: universal-integration
          to: launch-deployment
          label: Flight-ready spacecraft
        - from: launch-deployment
          to: cockpit-operations
          label: Orbital commissioning
        - from: cockpit-operations
          to: virtual-compute
          label: Multi-tenant capacity
        - from: virtual-compute
          to: margin-expansion
          label: Software monetization
    approximationNotes: >-
      Flow architecture illustrates the operational value chain; financial contribution per stage varies between
      dedicated sovereign contracts and shared commercial rideshares.
    claimRefs:
      - CI004
      - CI006
      - CI007
      - CI010
  - id: FE001
    title: Loft Orbital Full-Stack Product and Operating Architecture
    type: stack
    summary: >-
      Layered diagram showing Loft Orbital's end-to-end technology stack across customer applications, mission control,
      flight software, universal adapter hardware, and spacecraft bus platforms.
    data:
      layers:
        - label: Customer Application Layer
          detail: Cockpit web UI, customer tasking APIs, and Virtual Mission containerized edge applications
        - label: Ground Infrastructure & Ops Layer
          detail: Global ground station network, automated pass scheduling, and cloud data distribution pipelines
        - label: Flight Software & Edge Runtime
          detail: Onboard software (OBSW), Ultimate Edge Azure environment, and containerized inference engine
        - label: Universal Payload Hub Layer
          detail: Proprietary physical adapter standardizing power, data, mechanical mounting, and thermal buses
        - label: Satellite Bus & Launch Layer
          detail: Flight-proven third-party satellite buses (Airbus Longbow, LeoStella) and contracted launch vehicles
        - label: On-Orbit Power & Propulsion Subsystems
