      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The documented demand base spans government and defense agencies, commercial Earth observation and
              communications operators, civil-science programs, and software developers seeking on-orbit compute. The
              economic buyer is typically a mission or program office; payload engineers, scientists, analysts, or
              application developers are the users; and the payer is a public procurement authority or a commercial
              mission owner. Adoption starts when a funded payload or software objective can accept shared or
              standardized infrastructure and values schedule certainty more than a bespoke bus. Public examples include
              NASA, the Canadian Space Agency through Honeywell, EarthDaily, Wyvern, and software deployments by Little
              Place Labs and SkyServe. These examples establish segment relevance, not segment size, customer
              concentration, repeat purchase rates, or transferable unit economics.
            claimRefs:
              - CM003
              - CM005
              - CM011
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM011
              - CM016
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by Earth observation, communications, scientific research, national security, and a
              shift toward payload-centric or software-defined missions. Hosting multiple payloads on standardized
              platforms can reduce duplicated spacecraft work and speed a customer's entry into orbit, while the Series
              C was reported as funding for fleet and service-model expansion. Adoption remains exposed to third-party
              launch schedules, satellite production capacity, capital intensity, integration complexity, regulation,
              and the buyer's willingness to share infrastructure. The roughly $954 million October 2026 private-market
              mark is explicitly a secondary pricing estimate that may rely on limited data; it cannot stand in for
              market demand. Valuation should therefore be tied to verified contract conversion, margins, utilization,
              and repeat procurement rather than broad ecosystem capital or an unsupported TAM multiple.
            claimRefs:
              - CM005
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Traction is not market size
            body: >-
              Reported contract value, backlog count, deployed satellites, financing, and procurement ceilings describe
              different denominators and periods; they should be used as adoption and capacity signals, not summed into
              TAM.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM014
          - type: callout
            title: The missing bridge to SOM
            body: >-
              Without service pricing, awarded share of multi-vendor ceilings, contract cancellation terms, and
              bookings-to-revenue conversion, the obtainable market and valuation sensitivity remain unquantified.
            calloutType: risk
            claimRefs:
