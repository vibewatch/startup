  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital structures its commercial model around space infrastructure as a service, decoupling
              satellite mission delivery from bespoke hardware manufacturing. The company monetizes through three
              principal avenues: physical payload hosting missions, virtual software missions deployed to operational
              spacecraft, and on-demand sensor tasking. In physical missions, customers contract for dedicated
              microsatellite deployments or purchase shared rideshare slots on Loft's YAM series spacecraft, with small
              payload slots historically priced in the range of $1 million to $2 million annually. For larger
              institutional programs, such as the French DESIR synthetic aperture radar demonstration, Loft acts as
              prime contractor on multi-million-euro commitments. Virtual missions allow analytics providers and
              government agencies to upload algorithms directly to on-orbit compute nodes without hardware launch
              expenses. Commercial traction is evidenced by over $500 million in cumulative customer bookings reported
              across more than 30 contracted satellites. However, recognized revenue remains largely opaque; the most
              recent disclosed historical annual revenue figure is $6 million associated with its November 2021
              financing round, indicating that substantial booked contract value remains in backlog awaiting scheduled
              orbital deployment.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI004
              - CI005
              - CI009
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI005
              - CI009
      - number: '4.2'
        title: Cost Structure, Gross Margin Drivers, and Value Chain Bridge
        blocks:
          - type: paragraph
            body: >-
              The foundation of Loft Orbital's cost structure is hardware abstraction. Rather than sustaining heavy
              capital expenditure by operating dedicated spacecraft production lines, Loft procures flight-proven,
              standardized satellite buses from commercial suppliers including Airbus and LeoStella. Non-recurring
              engineering expenses and integration timelines are reduced through Loft's universal Payload Hub adapter,
              which standardizes electrical, data, and mechanical interfaces across disparate customer sensors. Launch
              expenses are managed by pre-booking rocket berths with launch providers such as SpaceX, securing
              predictable scheduling and bulk volume pricing. This capital-efficient structure allowed the company to
              amass over $500 million in customer bookings on only $160 million of equity capital raised prior to its
              Series C. Defense programs represent a major driver of service-delivery revenue, with Loft surpassing $100
              million in signed United States defense contracts, including supplying Longbow satellite platforms for
              national security constellations. As missions transition from physical integration pass-throughs to
              multi-tenant on-orbit software execution, gross margin expansion depends on amortizing fixed space segment
              procurement across recurring software subscriptions.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI010
      - number: '4.3'
        title: Unit Economics, Market Comps, and Traction Disclosures
        blocks:
          - type: paragraph
            body: >-
              While Loft Orbital has demonstrated substantial commercial contracting velocity, independent financial
              analysis emphasizes that unit economics at the individual payload and inference transaction level remain
              unproven. Big constellation commitments, such as the fifty-satellite, $1 billion orbital AI constellation
              announced with UAE partner Marlan Space, require sustained state backing to underwrite hardware costs. In
              commercial Earth observation, falling imagery pricing creates margin pressure unless onboard compute can
              command premium software pricing. Secondary market transactions quote Loft Orbital shares around $25 per
              share, indicating an implied equity valuation near $954 million as of October 2026. This valuation
              multiple is substantial relative to historical revenue disclosures, reflecting growth expectations rather
              than audited profitability. Public and private space technology peers, including synthetic aperture radar
              provider ICEYE and launch innovator SpinLaunch, similarly navigate capital-intensive deployment schedules
              where announced backlog frequently outpaces commissioned orbital capacity. With five deployed satellites
              and roughly 30 satellites in backlog, underwriting Loft requires distinguishing firm commercial cash flow
              from speculative constellation announcements.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI008
              - CI011
      - number: '4.4'
        title: Capital Adequacy, Forward Burn, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital's balance sheet was substantially reinforced in January 2025 through a $170 million Series C
              funding round co-led by Tikehau Capital and Axial Partners, bringing total institutional capital raised to
              approximately $326 million to $330 million across recorded funding events. This financing provides
              immediate capital adequacy to execute scheduled 2025 and 2026 satellite integration manifests and expand
              international joint ventures such as Orbitworks in Abu Dhabi. However, underwriting Loft Orbital requires
              severe diligence safeguards. The company has not publicly disclosed audited income statements, recognized
              gross margins, or monthly operating cash burn rates since 2021. Furthermore, sovereign partnership
              contracts can constrain commercial pricing ceilings when the state operates as both anchor customer and
              domestic factory sponsor. Our financial verdict classifies Loft Orbital as a high-potential space
              infrastructure platform with strong defense contract backing, but one whose conversion velocity from
              bookings to realized free cash flow cannot be underwritten without access to private audited financial
              statements and customer retention data.
            claimRefs:
              - CI001
              - CI013
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Unproven Unit Economics and Margin Pressure on Orbital Compute
            body: >-
              While Loft Orbital markets orbital AI compute as a high-margin software business, the underlying unit
              economics remain unproven in operational deployments. Satellite operating costs, thermal constraints, and
              potential launch delays risk compressing margins unless recurring per-inference software revenue
              materializes.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
          - type: callout
            title: Capital Efficiency Enabled by Bus Hardware Abstraction
            body: >-
              By avoiding vertical integration and procuring standardized satellite buses from commercial partners such
              as Airbus and LeoStella, Loft achieved over $500 million in lifetime bookings on approximately $160
              million in capital prior to its Series C.
            calloutType: insight
            claimRefs:
              - CI002
              - CI006
              - CI008
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Service Delivery, and Customer Workflows
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital provides space infrastructure as a service by abstracting the mechanical, electrical,
              regulatory, and operational complexities of orbital missions. Traditionally, deploying sensors into Low
              Earth Orbit required bespoke satellite engineering, multi-year procurement cycles, and direct satellite
              ownership. Loft operates an alternative model that provides turnkey access to orbit using standardized,
              flight-proven spacecraft platforms. Customers access Loft's infrastructure across three primary delivery
              modes: Physical Missions, Virtual Missions, and On-Demand Missions. In Physical Missions, customers supply
              physical sensors or instruments that Loft integrates, tests, launches, and operates. In Virtual Missions,
              software developers and defense end-users deploy containerized software models directly to Loft's orbiting
              satellites equipped with onboard GPUs and software-defined radios. In On-Demand Missions, users schedule
              data collection tasks against active sensors across Loft's deployed constellation via cloud software,
              receiving processed feeds without launching any dedicated hardware.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE009
              - CE010
              - CE011
      - number: '5.2'
        title: 'Modular Architecture: Payload Hub, Satellite Buses, and Ground Tooling'
        blocks:
          - type: paragraph
            body: >-
              The core technical foundation of Loft Orbital's offering is its modular decoupling architecture across
              space, ground, hardware, and software segments. The central hardware interface is the Payload Hub, a
              universal adapter that bridges disparate customer payloads with standard satellite buses. The Hub
              standardizes electrical power distribution, data buses, thermal control, and command-and-control
              interfaces across mechanical and embedded domains, eliminating non-recurring engineering for each payload.
              Customers validate electrical, mechanical, and software interfaces prior to physical integration using a
              standardized HubKit. In space, Loft mounts the Hub onto flight-proven satellite buses procured from
              industrial aerospace manufacturers such as Airbus (the OneWeb-derived Longbow platform) and LeoStella. On
              the ground, customer tasking, telemetry tracking, and data downlinks are managed via Cockpit, a web-based
              and API-accessible mission operations portal, alongside the Ultimate Edge runtime environment hosted in
              partnership with Microsoft Azure for on-orbit AI application deployment.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE008
              - CE009
              - CE011
              - CE012
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE008
              - CE009
              - CE011
      - number: '5.3'
        title: On-Orbit AI Processing, Edge Compute, and Virtual Test Benches
        blocks:
          - type: paragraph
            body: >-
              To support software-defined space missions, Loft Orbital introduced edge-compute capabilities that
              transform satellites into distributed compute nodes in Low Earth Orbit. On satellites such as YAM-6, Loft
              integrates radiation-hardened compute platforms, including NVIDIA Jetson graphics processing units and ARM
              processors, running alongside customer software runtimes. Demonstrated through partnerships with the
              United States Space Force and Wallaroo.AI, the virtual mission pipeline allows operators to build,
              package, and bench-test machine learning models on the ground before uplinking containerized inference
              microservices. On orbit, raw hyperspectral and optical imagery is captured via onboard cameras,
              pre-processed and aligned, and passed through computer vision models such as YOLO and SSDLite to detect
              objects like naval vessels. By filtering imagery and extracting bounding boxes and metadata in orbit, Loft
              enables low-latency intelligence downlinks that overcome severe RF downlink bandwidth and ground station
              contact window bottlenecks.
            claimRefs:
              - CE009
              - CE010
              - CE012
              - CE013
      - number: '5.4'
        title: Product Portfolio, Constellation Maturity, and Backlog Execution
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital's product portfolio is organized around turnkey satellite capacity, shared rideshare slots,
              dedicated constellations, and software runtime environments. As of late 2026, Loft has launched multiple
              operational satellites across its YAM ('Yet Another Mission') flight heritage line, including YAM-2,
              YAM-3, YAM-5, and YAM-6, while maintaining a backlog of approximately 30 satellites slated for delivery.
              Major commercial contracts include hosting EarthDaily's 10-satellite Earth observation constellation,
              flying Esper's Four Leaf Clover hyperspectral sensors, and hosting Helsing's real-time defense situational
              awareness constellation. In addition, Loft Federal executes defense demonstrations under contracts such as
              the Space Development Agency's NExT program and the Space Force STEP 2.0 procurement vehicle. While this
              commercial momentum confirms customer acceptance of outsourced infrastructure, scaling from individual
              launches to multi-satellite fleet operations creates substantial integration scheduling risks and
              supply-chain dependencies.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE007
              - CE008
              - CE013
              - CE015
      - number: '5.5'
        title: Technical Differentiation, Supplier Dependencies, and Downlink Constraints
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital's primary technical moat lies in its hardware abstraction layer and operational
              standardization. By decoupling payload design from satellite bus engineering via the Payload Hub, Loft
              compresses mission timelines from traditional multi-year aerospace cycles to under 12 months, allowing
              heterogeneous customer instruments to co-exist on a single flight bus. However, this strategy introduces
              critical operational and architectural vulnerabilities. Loft does not manufacture spacecraft buses
              in-house, creating structural reliance on suppliers like Airbus and LeoStella for bus deliveries and price
              stability. Furthermore, operating shared multi-tenant satellites introduces complex thermal dissipation,
              power allocation, and fields-of-view management trades. Finally, for high-bandwidth physical sensor
              missions without onboard edge processing, downlink throughput remains constrained by intermittent
              line-of-sight passes over commercial ground station networks.
            claimRefs:
              - CE006
              - CE008
              - CE011
              - CE015
              - CE016
      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Decoupling Hardware Iteration from Aerospace Lead Times
            body: >-
              By standardizing electrical and mechanical interfaces into the Payload Hub adapter and providing
              pre-flight HubKits, Loft shifts payload integration from customized aerospace non-recurring engineering
              into repeatable modular hardware assembly.
            calloutType: insight
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: callout
            title: Structural Reliance on Third-Party Bus Manufacturers
            body: >-
              Unlike vertically integrated satellite manufacturers, Loft depends on third-party suppliers including
              Airbus for its Longbow bus platform. Delays or cost increases from bus suppliers directly jeopardize
              Loft's delivery schedule and margin structure.
            calloutType: risk
            claimRefs:
              - CE008
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying architecture
        blocks:
          - type: paragraph
            body: >-
              Loft sells infrastructure rather than a single data product, so its customer base spans several buying
              centers. Contrary describes government agencies, commercial enterprises, and international institutions
              using physical, virtual, or on-demand missions, while Multiples names NASA, the U.S. Space Force, the
              Space Development Agency, Microsoft, BAE Systems, Eutelsat, ESA, and CNES. The strongest public evidence
              therefore points to institutional and defense-led demand alongside a smaller commercial cohort in Earth
              observation, climate analytics, and edge computing. GetLatka's broad description of companies,
              governments, and institutions supports that segmentation only at low confidence. Public sources do not
              disclose payer-level revenue mix, geography mix, or average contract value by segment, so the table treats
              strategic value qualitatively rather than converting named logos into revenue contribution.
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU010
              - CU014
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU009
              - CU010
              - CU014
      - number: '6.2'
        title: Adoption trajectory and operating scale
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is meaningful but not yet cohort-quality. NewSpaceTracker reports five deployed
              satellites and around 30 in backlog, most scheduled for 2025-2026, representing approximately $500 million
              in aggregate contract value. Contrary separately reports more than $500 million of signed contracts from
              2021 through 2025 and a roughly 30-satellite waitlist. Multiples adds a different operating lens: more
              than 30 satellites sold and more than 25 customer missions deployed across five launched satellites. These
              are bookings, contract, backlog, satellite, and mission measures with different denominators; none is
              revenue, active-customer count, or proof that the entire backlog has converted to launch. The directional
              signal is strong demand and a growing delivery obligation, while the investment question is conversion
              speed and realized utilization rather than headline order volume alone.
            claimRefs:
              - CU007
              - CU008
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU007
              - CU008
              - CU011
              - CU012
      - number: '6.3'
        title: Named deployments and reference quality
        blocks:
          - type: paragraph
            body: >-
              The named-customer set covers several distinct stages of proof. Contrary describes EarthDaily's
              constellation, Esper's planned 2026 sensor deployments, Helsing's planned constellation, and in-orbit
              applications from SkyServe, Little Place Labs, and Wyvern. Loft's own account says the Helsing
              constellation is still being developed, so it should not be presented as an operating production
              reference. Loft does describe a YAM-6 workload that analyzes imagery onboard, counts and identifies boats,
              and turns a full image into kilobyte-scale metadata; that is a concrete company-reported outcome but not
              an independently measured customer ROI. Simera Sense's statement that it supplied ten imagers over the
              preceding twelve months is partner evidence of capacity expansion, not end-customer adoption. The
              resulting proof set is credible for technical use and procurement, but mixed on production status and
              independent outcome verification.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU009
              - CU010
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU009
              - CU010
      - number: '6.4'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The public customer record does not support conventional retention analysis. None of the retained sources
              discloses NRR, GRR, churn, renewal rates, contract duration, repeat-purchase cohorts, satisfaction
              measures, or the share of revenue and bookings attributable to the largest customers. The three mission
              modes create plausible expansion paths from a hosted payload to a constellation, or from a virtual
              application to repeated tasking, and Tracxn describes a dashboard for payload tasking and near-real-time
              data access. Those mechanics are not evidence that expansion has occurred. Delivery risk also matters:
              Loft says autonomous satellite-to-satellite self-tasking remains in progress, and the large reported
              backlog makes launch and commissioning execution central to customer durability. Diligence should
              therefore request contract-level cohorts, conversion of bookings to launched and accepted missions,
              renewal rights, cancellation provisions, and top-customer concentration before assigning
              recurring-platform economics.
            claimRefs:
              - CU002
              - CU006
              - CU013
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU013
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Contract scale is not retention
            body: >-
              Roughly $500 million of reported contracts or backlog supports demand, but the retained evidence does not
              disclose recognized revenue, renewal, churn, acceptance, or customer concentration.
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Mandates, Debris Governance, and Sovereign Data Compliance
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital operates as a multi-tenant and dedicated space-infrastructure provider across dual United
              States and European jurisdictions, exposing its shared platform model to shifting regulatory frameworks.
              The transition of orbital governance from voluntary guidelines to binding statutory enforcement creates an
              operational and financial compliance overhang. Specifically, international mandates including the European
              Union Zero Debris Charter and the United States Senate ORBITS Act establish stringent requirements
              requiring satellite operators to guarantee a ninety-five percent successful deorbiting probability within
              five years of mission termination [CR001]. For Loft Orbital's modular rideshare and hosted-payload
              architecture, this framework imposes a compliance tax because the company must verify and guarantee
              end-of-life disposal protocols across heterogeneous, third-party physical payloads [CR001, CR002]. In
              addition, Loft Orbital's expanding sovereign defense portfolio—exemplified by the French Ministry of Armed
              Forces commissioning Loft to build France's first sovereign Synthetic Aperture Radar satellite—imposes
              strict technical fences around data governance [CR003, CR004]. Under sovereign procurement frameworks,
              encrypted downlinks, mission tasking, and telemetry cannot traverse foreign or commercial public servers,
              necessitating isolated virtual operations environments such as Loft's Virtual Mission Operations Center
              [CR004]. Failure to maintain rigorous cryptographic segregation or regulatory deorbit assurances
              introduces severe licensing friction with national regulators including the FCC, CNES, and defense
              procurement authorities [CR001, CR004].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Industrial Supply Chain Concentration and Platform Hardware Dependencies
        blocks:
          - type: paragraph
            body: >-
              At the industrial foundation of Loft Orbital's platform lies a high structural dependency on third-party
              satellite bus manufacturers and commercial launch providers. The company's standard Longbow bus
              architecture is tightly integrated with Airbus defense and space manufacturing lines [CR005, CR006]. While
              this standard bus strategy eliminates bespoke spacecraft engineering and enables turnkey integration
              timelines measured in months rather than years, it introduces acute supplier concentration [CR005, CR007].
              Any industrial bottleneck, component inflation, or internal program re-prioritization within Airbus
              directly impacts Loft's hardware integration schedules and gross margins [CR005]. Furthermore, Loft
              Orbital's manifest scaling ambitions—transitioning from bespoke individual satellite deployments to a
              fleet-scale cadence exceeding ten satellites per year—amplify operational risk across satellite testing
              and orbital delivery [CR008, CR009]. To mitigate subsystem integration bottlenecks across thirty
              backlogged satellites representing approximately five hundred million dollars in aggregate contract value,
              Loft relies heavily on hardware-in-the-loop automated testbeds and resource-sharing architectures [CR007,
              CR009]. However, execution vulnerabilities remain concentrated in orbital rideshare launch cadence, where
              launch vehicle delays or booster anomalies from primary commercial launch providers can cascade across
              multiple hosted customer payloads [CR005, CR008, CR009].
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR008
              - CR010
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR008
              - CR011
              - CR014
      - number: '7.3'
        title: Capital Intensity, Backlog Execution, and Valuation Mark Compression
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital's business model requires substantial upfront capital commitments to procure satellite buses,
              secure launch vehicle slots, and maintain buffer inventories of payload adapters before recognizing
              mission revenue [CR008, CR010]. While the company achieved a headline post-money valuation exceeding one
              billion dollars following its one hundred and seventy million dollar Series C financing in January 2025,
              private secondary markets indicate significant pricing friction and multiple compression [CR008, CR011,
              CR012]. Indicative secondary market marks on private liquidity platforms quote Loft Orbital at
              approximately twenty-four dollars and seventy-seven cents to twenty-five dollars per share, corresponding
              to an estimated enterprise valuation of approximately nine hundred and fifty-four million dollars [CR011,
              CR012, CR013]. Earlier private transactions in late 2025 tracked implied valuation marks as low as
              approximately six hundred and nine million dollars, reflecting broader market skepticism toward
              capital-intensive space infrastructure providers facing protracted cash burn [CR011]. Commercial execution
              is further complicated by intensified hosted-payload competition from emerging orbital transfer and
              smallsat platform operators such as Rogue Space Systems and Exotrail, threatening pricing power in
              commercial rideshare missions [CR014]. Consequently, Loft Orbital's margin trajectory depends heavily on
              monetizing high-margin software-defined virtual missions and edge compute payloads to counterbalance
              physical bus manufacturing and launch cost inflation [CR006, CR014].
            claimRefs:
              - CR006
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Airbus Bus Dependency and Margin Compression
            body: >-
              Loft Orbital's operating model relies fundamentally on standardizing payloads around Airbus-manufactured
              Longbow satellite buses. While standardizing bus platforms accelerates mission integration, it exposes
              Loft to single-supplier pricing power, potential component shortages, and competing Airbus internal
              priorities as the company attempts to scale its launch manifest beyond ten satellites per year.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR008
          - type: callout
            title: Orbital Debris Mandates as a Structural Compliance Tax
            body: >-
              The formal enforcement of the EU Zero Debris Charter and US ORBITS Act in 2026 converts post-mission
              disposal from best practice into hard regulatory liability. Because Loft Orbital hosts third-party
              payloads, it bears direct operational and legal responsibility for ensuring ninety-five percent deorbiting
              compliance within five years, adding engineering verification costs and potential schedule friction.
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a research-more recommendation with medium-low confidence and high underwriting
              risk. Multiple independent databases agree that Loft Orbital raised a $170M Series C in January 2025,
              while the two most relevant price signals are a $1B January 2025 round benchmark and a $954M October 2026
              private-market mark. Those signals describe transaction and secondary-market context, not intrinsic value.
              Public evidence does not disclose a fully diluted share count, liquidation preferences, recognized current
              revenue, gross margin, cash balance, or burn. Without those inputs, neither a target return nor a
              defensible hold period can be calculated, and the modest difference between the two headline marks is not
              itself a margin of safety.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
      - number: '8.2'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that an end-to-end service can shorten customer adoption cycles by combining payload
              integration, launch booking, licensing, insurance, financing, and satellite operations. A current industry
              profile reports five deployed satellites, about 30 satellites in backlog, and approximately $500M of
              aggregate contract value, which is meaningful demand evidence. The anti-thesis is that backlog is not
              recognized revenue, funding is not cash available, and launch-dependent delivery can defer conversion.
              Public revenue references range from a $6M November 2021 recorded figure to a $10M-$100M statistical band
              and a separate $139.6M 2025 estimate. Those measures differ in vintage, methodology, and likely accounting
              basis, so they cannot be blended into a growth rate or valuation multiple.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.3'
        title: Valuation Method and Comparable Context
        blocks:
          - type: paragraph
            body: >-
              A revenue-multiple method is directionally relevant for a service platform, but the denominator is
              presently unreliable. Multiples.vc reports a 91.7x revenue multiple for Loft Orbital's November 2021
              Series B using a $6M recorded revenue figure; that is a historical transaction observation, not a current
              multiple. Its comparison set reports LTM revenue multiples from 6.9x for BlackSky to 20.7x for Satellogic,
              but these companies have different asset intensity, customer mixes, maturity, and disclosure quality.
              Applying that range to either the IncFact band or GetLatka estimate would create an extremely wide,
              methodologically weak output. The $954M and $1B marks should therefore remain market anchors rather than a
              claimed fair-value range.
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Scenarios, Exit Readiness, and Diligence
        blocks:
          - type: paragraph
            body: >-
              The scenario framework is conditional rather than numerically probabilistic because public evidence does
              not support probability estimates or a downside floor. A bull case requires timely backlog conversion,
              audited revenue approaching the upper public estimate, and evidence of repeatable margins; only then would
              a premium to the $1B round benchmark be supportable. The base case treats $954M-$1B solely as the current
              observable indication range while diligence remains open. A bear case begins below the $954M mark if
              launches slip, bookings cancel, or financing terms subordinate new capital, but its magnitude cannot be
              quantified without the cap table and liquidity data. Loft remains privately held, so exit timing and route
              also remain unverified.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is not yet underwritable
            body: >-
              Treat $954M and $1B as observable private-market anchors only. An investable price requires audited
              recognized revenue, gross margin, cash and burn, backlog conversion, fully diluted ownership, liquidation
              preferences, and a credible exit path.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
