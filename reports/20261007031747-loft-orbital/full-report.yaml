chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Platform Concept, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital Solutions Inc. was founded in January 2017 to eliminate the complexity and capital barriers
              traditionally associated with orbital space missions. Headquartered in San Francisco, California, the
              company operates across engineering facilities in Colorado and Toulouse, France. Loft Orbital pioneered a
              Space-Infrastructure-as-a-Service model that delivers turnkey access to low Earth orbit for government
              agencies and commercial enterprises. Rather than requiring customers to commission custom satellite buses,
              Loft Orbital pre-procures standardized modular spacecraft and integrates multiple customer payloads onto
              shared missions. The company proprietary mission control software, Cockpit, facilitates routine satellite
              tasking, data access, and payload monitoring in near-real time, effectively transforming bespoke
              spaceflight procurement into a predictable, software-defined utility.
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO008
              - CO010
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO010
              - CO011
      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital is led by co-founder and Chief Executive Officer Pierre-Damien Vaujour, who brings extensive
              background in European and American aerospace programs, alongside co-founder and Chief Operating Officer
              Alex Greenberg, who oversees spacecraft delivery and technical mission execution. The founding team also
              includes director Antoine de Chassy, providing vital connectivity to European defense institutions and the
              French space agency CNES. Corporate governance is anchored by an active board of directors featuring both
              founder executives and independent representatives, including Steve Vassallo of Foundation Capital. While
              day-to-day operations benefit from experienced functional heads across aerospace systems and software
              engineering, key-person dependencies remain concentrated in the executive leadership team due to their
              established roles in securing critical national security vehicles and institutional customer contracts.
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.3'
        title: Financing History, Investor Syndicate, and Valuation Trajectory
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital has raised cumulative venture equity funding between $316 million and $330 million across
              multiple institutional financing rounds since its 2017 inception. The financing trajectory advanced from
              early seed backing by Uncork Capital and a $13 million Series A led by Foundation Capital in 2019, to a
              $140 million Series B led by BlackRock in December 2021. In January 2025, the company secured a landmark
              $170 million Series C round co-led by French asset manager Tikehau Capital and Axial Partners, with
              participation from Temasek and French sovereign bank Bpifrance. The Series C round established a $1.0
              billion post-money valuation, conferring unicorn status. In secondary private markets, trading indications
              on alternative trading systems including Nasdaq Private Market and Forge Data have reflected indicative
              equity marks around $954 million as of October 2026.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO009
      - number: '1.4'
        title: Operational Flight Milestones, Backlog Scale, and Key Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital operational track record includes five successful satellite missions deployed to low Earth
              orbit carrying over 25 distinct customer payloads for NASA, Eutelsat, and the European Space Agency.
              Beginning with early YAM-2 and YAM-3 flight demonstrations, the company expanded into edge computing with
              YAM-6, which validated onboard artificial intelligence inference and virtual software-only missions in
              orbit. Operational momentum is supported by an aggregate contract backlog exceeding $500 million across
              more than 30 contracted satellites scheduled for launch through 2026 and beyond. However, strategic
              reviews emphasize that rapid scaling exposes Loft Orbital to severe operational risks, including high
              capital intensity, satellite bus supplier dependencies, and external launch vehicle schedule delays, which
              can directly compress delivery margins and delay customer billing.
            claimRefs:
              - CO011
              - CO012
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO005
              - CO007
              - CO012
              - CO013
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform Standardization Lowers Space Barrier to Entry
            body: >-
              Loft Orbital core architectural innovation is decoupling customer sensor payloads from custom spacecraft
              engineering. By offering standardized interfaces, pre-purchased satellite buses, and proprietary Cockpit
              mission control software, the company compresses satellite deployment schedules from multiple years to
              several months while building a recurring service model.
            calloutType: insight
            claimRefs:
              - CO002
              - CO011
          - type: callout
            title: Capital Intensity and Third-Party Launch Vulnerabilities
            body: >-
              Despite accumulating over $500 million in contracted backlog, Loft Orbital growth is inherently
              constrained by aerospace supply chain dependencies and third-party launch manifests. Securing predictable
              orbital deployment schedules and maintaining bus inventory requires continuous capital expenditure and
              robust supplier coordination.
            calloutType: risk
            claimRefs:
              - CO011
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital's relevant market is narrower than the total space economy: it is outsourced low-Earth-orbit
              infrastructure for organizations that need a payload or software workload integrated, launched, licensed,
              operated, and tasked without building a complete spacecraft program. The service bundle spans standardized
              satellite capacity, payload integration, launch booking, regulatory and insurance work, commissioning,
              routine operations, and a software control layer. Included spend therefore belongs to hosted payloads,
              turnkey missions, shared satellite capacity, and on-orbit software workloads. Dedicated custom spacecraft,
              launch-only services, terrestrial cloud, and downstream data products are adjacent or substitute budgets
              rather than the core boundary. The status quo is a buyer procuring a bespoke satellite and operating stack
              internally, accepting greater capital commitment and program complexity in exchange for dedicated control.
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
      - number: '2.2'
        title: Sizing without false precision
        blocks:
          - type: paragraph
            body: >-
              The reviewed pool does not support a conventional TAM/SAM/SOM calculation. Its broadest numeric market
              indicator is Tracxn's report of $6.91 billion in United States space-tech funding during 2026 to date, but
              venture funding is capital supply, not customer spend. The $237 million STEP 2.0 ceiling is a multi-vendor
              procurement vehicle, not Loft revenue, while the reported approximately $500 million of aggregate contract
              value is company traction whose period, cancellation rights, and revenue-conversion schedule are not
              disclosed. Five deployed satellites, around 30 in backlog, and a plan for more than ten launches annually
              from 2026 provide capacity and adoption signals rather than a market denominator. The evidence ladder
              below therefore preserves unlike units and explicitly refuses to add them; a defensible SAM and SOM
              require program-level budgets, service pricing, win rates, and backlog conversion.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
          - type: figure
