  topStrengths:
    - 聚焦视频专用基础模型，定位有差异：Marengo 3.0 做搜索 / embeddings，Pegasus 1.5 做视频转文本；多数对手仍把视频当作通用多模态能力的附加项。
    - >-
      战略和财务股东质量高，包括 NEA、NAVER Ventures、Amazon、Radical Ventures、Index Ventures、Korea Investment Partners、Quadrille
      Capital 和 Red Bull Ventures。
    - AWS 在多年 Trainium 承诺下成为首选云服务商，再叠加 Amazon Bedrock 和 AWS Marketplace 分发，有机会改善推理经济性并触达企业客户。
    - 所处市场规模大且增长快，覆盖视频分析、生成式和多模态 AI、视频监控、体育分析；多个测算口径都能支撑空间。
  topRisks:
    - ARR、收入运行率、毛利率、烧钱速度、现金跑道和投后估值都未公开；假定约 $1B 的价格，无法靠公开证据完成承销。
    - 大厂多模态基础模型会带来商品化压力：Google Gemini、OpenAI、Microsoft / Amazon 原生视频服务都能把视频理解打包进去。
    - 监管和法律暴露不低：EU AI Act 高风险 / 生物识别监控分类、GDPR 和生物识别隐私法，以及生成式 AI 训练数据 / 版权诉讼都会压上来。
    - 集中度和关键人风险并存：公司依赖 CEO Jae Lee，也依赖 AWS / NVIDIA / NAVER 的伙伴和云关系。
  unresolvedGaps:
    - 收入、ARR、毛利率、净烧钱速度和现金跑道均未披露，阻断承销判断。
    - 投后估值、股权结构表、清算优先权和期权池条款均未公开。
    - 客户集中度，以及已点名部署中生产环境与试点的比例仍不清楚。
    - 净收入留存、总留存和流失指标均不可得。
