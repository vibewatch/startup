      - ["Regulated biometric use", "EU AI Act/GDPR/BIPA deployment map", "Unreviewed face, voiceprint, sensitive-attribute, or consequential-decision use", "Block regulated vertical expansion and require control plan"]
      - ["Model reliability", "Customer-specific evaluation logs", "False positives/negatives exceed customer-defined tolerance in high-stakes workflows", "Limit use cases to search-assist; no autonomous or consequential workflows"]
      - ["Cloud concentration", "AWS commitment and gross-margin model", "Minimum spend or Trainium performance gap makes target margin unattainable", "Reprice valuation or require multi-cloud portability milestones"]
