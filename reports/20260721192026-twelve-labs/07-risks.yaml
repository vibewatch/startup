      - ["Illinois BIPA biometric identifiers and private-action damages", "Illinois / U.S.", "Statute and amendment litigation remain active", "Medium", "High", "AUP restricts identity verification and sensitive inference unless legally permitted", "Face or voiceprint use in uploaded video could create customer and vendor exposure", "Confirm BIPA notices, written release allocation, retention schedule, and indemnity caps"]
