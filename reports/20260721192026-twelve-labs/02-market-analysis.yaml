callouts:
  - calloutType: insight
    title: Use multiple sizing lenses, not a single TAM headline
    body: >-
      The same 2026 video-analytics market is reported between roughly $11.6B and $18.5B, while broad generative-AI estimates differ by more than $100B. The investable question is therefore which slice of video understanding Twelve Labs can monetize, not whether adjacent AI markets are large.
    claimRefs:
      - CM003
      - CM013
      - CM014
      - CM029
  - calloutType: risk
    title: Privacy, integration, and ROI friction can delay video-AI adoption
    body: >-
      Video AI reaches sensitive surveillance, biometric, employee, and customer data workflows. EU restrictions, NIST risk-management expectations, false-positive risk, and RAND's AI-project failure analysis all point to slower enterprise conversion than headline market-growth rates imply.
    claimRefs:
      - CM040
      - CM041
      - CM042
      - CM043
      - CM045
