    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to Twelve Labs
    rows:
      - - Video understanding APIs
        - Search, analyze, summarize, embed, and reason over video through API or SDK workflows
        - Manual tagging labor; generic text-only LLM seats
        - Product, data, engineering, media-ops, or innovation budget
        - Core monetizable layer for Twelve Labs' models and agents
      - - Video analytics software
        - Object/activity detection, alerts, retrieval, incident review, crowd or traffic analysis
        - Cameras, monitors, storage appliances, and commodity VMS hardware
        - Security operations, public safety, retail operations, facilities, government
        - Closest established analyst category, but surveillance-heavy definitions overstate fit
      - - Multimodal AI
        - Models combining video, image, audio, and text for search, generation, and reasoning
        - Pure text generation or non-video analytics
        - AI platform teams, application developers, enterprise innovation teams
        - Best narrow proxy for video-native model demand and API buyers
      - - Enterprise video / MAM
        - Video content management, archive discovery, compliance review, metadata enrichment
        - Video conferencing hardware and generic content delivery without understanding
        - Media operations, brand teams, compliance, corporate communications
        - Strong fit where archives are large and metadata is incomplete
      - - Sports analytics
        - Player tracking, tactical analysis, scouting clips, broadcast insights, fan workflows
        - Ticketing, venue operations, and non-video fan CRM
        - Teams, leagues, broadcasters, performance departments
        - Attractive vertical with video-rich workflows but smaller absolute spend
      - - Automotive and physical-world perception
        - Clip retrieval, annotation, scenario search, video reasoning for ADAS/autonomy datasets
        - Vehicle hardware, sensors, and non-AI automotive software
        - ADAS/autonomy engineering and data-platform teams
        - Expansion adjacency where video search reduces data-engineering burden
    notes: >-
      Boundary is analytical and intentionally narrower than broad AI or camera-market estimates. Rows identify where market-report spend likely maps, only partially maps, or should be excluded for Twelve Labs.
