  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: diligence gaps
      missingEvidence: Twelve Labs customer-level ARR, usage by vertical, pilot-to-production conversion, and gross margin by video workload.
      whyItMatters: Without private operating evidence, public market estimates cannot be converted into a defensible share-capture or valuation model.
      diligencePath: Request management cohort data by vertical, API usage, expansion rates, churn, compute cost, and reference calls with production customers.
      relatedQuestionRefs:
        - QM024
        - QM025
    - type: conflicting-data
      severity: material
      topic: sizing contradiction
      missingEvidence: A market study that isolates video-understanding API/software revenue from surveillance hardware, VMS, conferencing, and generic AI spend.
      whyItMatters: Reported market sizes overlap and vary widely, so a single TAM can misstate the investable market available to Twelve Labs.
      diligencePath: Build a bottom-up SAM from customer workflows, spend per hour of indexed video, developer usage, and comparable API contract values.
      relatedQuestionRefs:
        - QM024
      relatedTableRefs:
        - TM002
