- id: TV003
  title: Bull / base / bear scenario table
  targetSlug: bull-base-bear-scenario-table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Probability signal
  - Downside trigger
  rows:
  - - Bull
    - Enterprise ARR is scaling quickly; AWS lowers unit cost; retention is strong
    - Presumed $1B entry can compound if exit reaches $4B to $6B after dilution
    - Large customers expand into multiple video workflows
    - ARR or margin evidence fails to appear
  - - Base
    - Category is real but public metrics remain insufficient
    - Track until private metrics justify price or entry resets toward lower risk
    - Strategic investors and market comps keep option value alive
    - No data-room access or terms worse than standard 1x nonparticipating preferred
  - - Bear
    - Revenue is early, gross margin weak, and hyperscalers commoditize video understanding
    - Presumed $1B entry risks down-round or flat secondary outcome
    - Adverse market concentration and compute-risk evidence dominate
    - AWS economics are credit-led or customer concentration is high
  notes: Scenario values are underwriting ranges, not company-disclosed forecasts; actual returns require cap-table and dilution data.
