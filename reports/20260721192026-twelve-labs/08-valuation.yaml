- id: downside-dilution-and-market-risk
  title: Downside, dilution, and market risk
  body: 'The anti-thesis is not that Twelve Labs lacks a real market; it is that the 2026 AI financing tape can overpay for narrative before revenue quality is visible. Market sources describe record AI funding, extreme capital concentration, shrinking deal counts, selective liquidity, and substantial AI valuation premiums. Those conditions validate why Twelve Labs could raise a strategic round, but they also make entry discipline more important. More than $200M of reported lifetime funding creates a real possibility of preference and option-pool overhang, yet public records do not disclose liquidation terms or ownership. The Companies House filing confirms a UK entity but not operating revenue or capitalization depth. Strategic AWS backing can be a moat if it lowers cost and improves distribution; it can also become dependency risk if economics are credit-driven, nonexclusive, or inferior to hyperscaler-native video products. The same evidence also argues for a disciplined syndicate process:
    reserve capital for a priced allocation only after preference waterfalls, cloud obligations, and customer economics are tied to measurable downside triggers.'
  claimRefs:
