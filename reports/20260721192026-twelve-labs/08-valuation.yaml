- id: TV006
  title: Final diligence asks table
  targetSlug: final-diligence-asks-table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Valuation and terms
    - Post-money, pre-money, option pool, liquidation preference, pro rata, side letters
    - Determines whether presumed $1B entry can produce venture returns
    - Company CFO / counsel; review financing docs
  - - Revenue quality
    - ARR, recognized revenue, backlog, NRR, gross retention, customer concentration
    - Separates strategic hype from repeatable enterprise demand
    - Finance data room plus top-customer cohort analysis
  - - Unit economics
    - Gross margin by indexing, search, generative output, storage, and support
    - Video AI can be compute-heavy; multiple depends on margin path
    - Cloud invoice and workload-cost review
  - - AWS economics
    - Trainium benchmarks, credits, committed spend, exclusivity, and data-residency terms
    - Validates whether AWS partnership improves or constrains economics
    - Review MSA, order forms, and benchmark tests
  - - Customer proof
    - Named production customers, ACV, expansion, churn, and deployment status
    - Supports bull case and exit readiness
    - Customer calls and contract sampling
  - - Competitive benchmarks
    - Accuracy, latency, and price vs Google, OpenAI, Runway, and other video models
    - Tests defensibility against hyperscalers and specialists
    - Technical diligence and blinded benchmark
  - - Exit path
    - Strategic acquirer map, secondary interest, IPO readiness, and required scale milestones
    - Determines hold period and target return
    - Banker/secondary-market checks and board plan review
  notes: Every ask is designed to move the recommendation from track to buy, price-reset, or avoid.
  claimRefs:
