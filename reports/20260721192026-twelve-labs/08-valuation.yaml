- id: TV005
  title: Thesis-break and kill triggers table
  targetSlug: thesis-break-and-kill-triggers-table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue proof missing
    - No current ARR, cohort expansion, or backlog disclosure under NDA
    - Cannot underwrite presumed $1B price
    - Stay track / no term-sheet recommendation
  - - Weak unit economics
    - Gross margin by workload does not improve with scale or Trainium optimization
    - Video inference cost erodes software-like multiple
    - Require price reset or pass
  - - Strategic dependence
    - AWS terms are promotional, nonportable, or create high committed spend
    - Partner validation becomes margin/dependency risk
    - Demand contract review and downside model
  - - Cap-table overhang
    - Participating preferred, high liquidation stack, or large option-pool refresh
    - Common-equity return impaired even if enterprise value grows
    - Renegotiate entry or avoid
  - - Competition shock
    - Hyperscaler-native product matches retrieval quality at lower price
    - Standalone video-intelligence value compresses
    - Pause until win/loss and benchmark proof
  - - Liquidity compression
    - Secondary or exit market reprices applied-AI multiples materially lower
    - Holding period and mark risk increase
    - Only proceed with larger ownership or lower price
  notes: Kill criteria convert unresolved valuation risks into monitorable investment actions.
  claimRefs:
