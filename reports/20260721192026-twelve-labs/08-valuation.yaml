- id: scenarios-final-asks
  title: Scenarios and final diligence asks
  body: The decision framework is therefore conditional. Bull case requires evidence that Twelve Labs is not just a promising model vendor but a production video intelligence layer with expanding enterprise budgets, strong retention, and durable unit economics. Base case assumes the company remains strategically important but private-data-light, so investors should maintain access, diligence rights, and price discipline rather than chase a headline valuation. Bear case assumes ARR is still early, gross margin is compressed by video inference, and big-tech competition or customer concentration limits exit optionality. The highest-value diligence work is not another generic market survey; it is a data-room request for ARR, cohort expansion, workload gross margin, cloud commitments, cap table terms, pipeline conversion, and customer proof by vertical. A buy recommendation should require those materials to clear explicit thresholds, while failure to produce them should keep the company on watchlist
    only.
  claimRefs:
