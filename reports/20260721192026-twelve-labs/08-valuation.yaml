- id: TV002
  title: Thesis / anti-thesis table
  targetSlug: thesis-anti-thesis-table
  columns:
  - Argument
  - Evidence support
  - What would change the view
  rows:
  - - 'Thesis: video is a differentiated AI modality'
    - Twelve Labs describes native video perception, memory, and reasoning architecture
    - Customer workload proof across multiple verticals with repeat spend
  - - 'Thesis: strategic backing validates category'
    - Amazon, NEA, NAVER, and prior investors joined latest round
    - Evidence that backing converts into revenue, not only infrastructure sponsorship
  - - 'Thesis: comps support premium AI pricing'
    - Runway, Synthesia, Mistral, and Perplexity show high AI private valuations
    - Twelve Labs must show revenue quality comparable to enterprise winners
  - - 'Anti-thesis: valuation is not public'
    - Official and independent sources omit post-money valuation
    - Signed term sheet and cap table with investor protections
  - - 'Anti-thesis: revenue is opaque'
    - CB Insights and Tracxn do not expose usable revenue or multiple
    - ARR, NRR, gross margin, and backlog by customer cohort
  - - 'Anti-thesis: compute and big-tech pressure'
    - Adverse sources cite expensive compute and Google/OpenAI-style competition
    - Trainium benchmarks, durable cloud pricing, and defensible accuracy data
  notes: Arguments are paired with falsifiable diligence items rather than treated as permanent conclusions.
