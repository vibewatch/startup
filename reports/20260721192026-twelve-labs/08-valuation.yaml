  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap table and preferences
    missingEvidence: Latest priced-round term sheet, security stack, option pool, liquidation preferences, and side letters.
    whyItMatters: Common-share entry value and downside protection cannot be assessed from public financing coverage.
    diligencePath: Request financing documents from company counsel and reconcile to investor allocation model.
    relatedQuestionRefs:
    - QV022
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: revenue and margin proof
    missingEvidence: Current ARR, recognized revenue, NRR, customer concentration, workload-level gross margin, net burn, and runway.
    whyItMatters: These metrics determine whether the presumed entry price is supported by enterprise traction or only by market momentum.
    diligencePath: Finance data-room review, revenue-quality analysis, and customer cohort calls.
    relatedQuestionRefs:
    - QV005
    - QV028
    - QV029
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: AWS economics
    missingEvidence: AWS committed spend, credit schedule, Trainium performance benchmarks, exclusivity, and data-residency terms.
    whyItMatters: The AWS relationship is a core upside lever but could also create dependency or margin risk.
    diligencePath: Review AWS contracts and reproduce benchmarks on representative workloads.
    relatedQuestionRefs:
    - QV025
    - QV029
    relatedTableRefs:
