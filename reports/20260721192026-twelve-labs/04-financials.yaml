- id: TI005
  title: Public Financial Gaps Table
  targetSlug: public-financial-gaps-table
  notes: >-
    Gap table converts private-undisclosed metrics into diligence requests; null means no reviewed public
    source disclosed the metric.
  columns:
  - Missing metric
  - Public evidence status
  - Impact
  - Exact diligence path
  rows:
  - - Current ARR / revenue run-rate
    - Not officially disclosed; Latka has only a 2023 revenue datapoint
    - Blocks revenue scale and multiple analysis
    - Obtain ARR bridge by month, product, customer, and geography
  - - Revenue mix
    - List meters are public; mix by indexing/search/analyze/enterprise is not
    - Blocks revenue quality and gross margin analysis
    - Export revenue by SKU, usage meter, and enterprise plan
  - - Gross margin / COGS
    - No public margin; AI benchmarks are only external comparables
    - Blocks unit economics and valuation confidence
    - Provide gross margin bridge and cloud-cost ledger
  - - Realized pricing and discounts
    - List prices are public; private offers and AWS credits are not
    - Can make heavy users unprofitable
    - Review top 20 contracts, discounts, credits, and minimum commits
  - - CAC, payback, sales cycle
    - No public sales-efficiency metrics
    - Enterprise GTM may consume large capital before ARR scales
    - Provide cohort CAC, payback, pipeline conversion, and sales cycle
  - - Burn and runway
    - Funding disclosed; cash and burn undisclosed
    - Blocks capital adequacy assessment
    - Provide cash, burn, hiring plan, and committed cloud spend
  - - Debt, leases, and commitments
    - No public obligations found
    - Hidden commitments could consume Series B proceeds
    - Provide debt schedule, leases, AWS contracts, and off-balance obligations
  - - Customer concentration / NRR
    - No public customer economics
    - Usage-based model should show expansion if healthy
    - Provide top-customer ARR, GRR, NRR, and churn reasons
