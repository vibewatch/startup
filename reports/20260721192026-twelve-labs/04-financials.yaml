  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-arr
    missingEvidence: Current ARR, revenue run-rate, and monthly revenue bridge by product.
    whyItMatters: Revenue scale and multiple cannot be underwritten from list pricing or a historical
      Latka datapoint.
    diligencePath: Request management ARR export by month, SKU, customer, geography, and cohort with finance-system
      tie-out.
    relatedQuestionRefs:
    - QI014
    - QI015
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin and cost ledger by Marengo indexing, search, Embed, Pegasus Analyze,
      and enterprise deployments.
    whyItMatters: AI-native benchmarks imply margin pressure, but company-specific AWS terms could materially
      change the outcome.
    diligencePath: Review cloud invoices, AWS contracts, model-serving telemetry, and product-level P&L
      for the last six quarters.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI019
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC payback, sales cycle, pipeline conversion, GRR, NRR, and enterprise discounting.
    whyItMatters: Enterprise custom plans can create attractive commits or expensive bespoke support;
      public sources do not separate them.
    diligencePath: Obtain CRM cohort analysis, top-20 contract summaries, discount schedules, and renewal/churn
      bridge.
    relatedQuestionRefs:
    - QI008
    - QI009
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: burn-runway
    missingEvidence: Cash on hand, monthly net burn, committed spend, and board-approved operating plan.
    whyItMatters: The $100M Series B is gross financing, not a verified runway calculation.
    diligencePath: Review bank statements, cash forecast, budget-vs-actuals, hiring plan, and cloud commitments
      through 2028.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: debt-cloud-commitments
    missingEvidence: Debt schedule, credit facilities, cloud credits, AWS committed spend, and lease obligations.
    whyItMatters: Public sources do not disclose obligations that could consume proceeds or alter gross-margin
      quality.
    diligencePath: >-
      Request all financing agreements, AWS private offer documents, side letters, leases, guarantees,
      and off-balance commitments.
    relatedQuestionRefs:
    - QI020
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: conflicting-data
    severity: minor
    topic: historical-revenue
    missingEvidence: Management confirmation of 2023 revenue and reconciliation to Latka's bootstrapped
      label.
    whyItMatters: Latka's $4.2M historical revenue datapoint is useful but partially contradicted by funding
      evidence.
    diligencePath: Ask management for audited or board-approved 2023 revenue and an explanation of third-party
      data discrepancies.
