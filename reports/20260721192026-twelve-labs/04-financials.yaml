company:
  name: Twelve Labs
chapter:
  number: 4
  title: Financials
  summary: >-
    Twelve Labs has a coherent usage-based API revenue model, visible list prices, AWS distribution, and
    a fresh $100 million Series B, but it remains private-undisclosed on current ARR, gross margin, burn,
    runway, CAC payback, and cloud commitments. The diligence stance is therefore positive on monetization
    architecture and unresolved on unit economics until management provides a product-level P&L, AWS cost
    ledger, and burn forecast.
sections:
- id: revenue-model
  title: Revenue model and pricing architecture
  body: >-
    Twelve Labs monetizes a video-understanding API rather than a seat-first SaaS application. The public
    pricing surface shows a stack of usage meters: video indexing for Marengo, monthly embedding infrastructure,
    Search API queries, Embed API calls by modality, and Pegasus analysis plus output tokens. That creates
    a clean bridge from customer activity to revenue because more indexed minutes, searches, and analyzed
    segments produce more billable events. Enterprise contracts add a second layer: high-volume customers
    can move away from list rates into committed-use or custom plans, and AWS Marketplace provides a partner
    distribution surface for Bedrock-style consumption. The model is financially attractive because usage
    pricing partly matches compute COGS, but it also makes realized pricing, discounting, and workload
    mix critical diligence variables. Official pricing is list pricing, not ARR, gross margin, or net
    retention; the chapter therefore treats all private financial metrics as undisclosed until Twelve
    Labs provides a customer-level revenue schedule.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  - CI010
  - CI014
  - CI033
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: unit-economics
  title: Unit economics and margin drivers
  body: >-
    The core unit-economic question is whether billed minutes and queries cover the cost of ingesting,
    embedding, storing, retrieving, and generating from video. Public AI-infrastructure benchmarks are
    cautionary: inference and observability costs remain variable after launch, and AI-native gross margins
    are commonly cited below classic SaaS margins. Twelve Labs has two mitigating factors. First, the
    pricing page exposes usage units granular enough to charge heavy users for heavy workloads. Second,
    the Amazon relationship could improve infrastructure economics if Trainium optimization and SageMaker
    resiliency lower training and serving cost. Neither point proves margin quality. The missing diligence
    is a dated cost ledger by product line: cost per indexed minute, cost per Pegasus minute, cache hit
    rates, AWS credit and committed-spend terms, customer support burden, and margin by enterprise cohort.
    Until those data arrive, list prices should be read as a monetization framework rather than proof
    of attractive gross margin.
  claimRefs:
  - CI009
  - CI015
  - CI018
  - CI019
  - CI029
  - CI030
  - CI031
  - CI032
  - CI034
  - CI039
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: capital-adequacy
  title: Capital adequacy and financing dependency
  body: >-
    Financials can reference the funding chronology only through locally sourced claims. The latest public
    financing evidence shows a $100 million Series B in July 2026 and market-data coverage indicating
    roughly $207 million of total funding. The announced use of proceeds—R&D, model development, geographic
    expansion, and offices in New York and London—signals growth investment rather than a claim of self-sufficiency.
    That gross capital injection likely improves the company's negotiating runway, but cash on hand, net
    burn, runway months, committed cloud spend, and debt are not public. Twelve Labs' capital intensity
    is concentrated in frontier-model R&D, video inference, enterprise support, and cloud commitments,
    not in inventory or lending assets. The AWS relationship is strategically valuable, but it may also
    create contractual spend obligations or concentration risk that are invisible in public articles.
    Investors should underwrite capital adequacy only after reviewing bank statements, board-approved
    budget, AWS order forms, and revenue-to-burn trajectory.
  claimRefs:
  - CI016
  - CI017
  - CI018
  - CI020
  - CI021
  - CI022
  - CI023
  - CI037
  - CI038
  - CI039
