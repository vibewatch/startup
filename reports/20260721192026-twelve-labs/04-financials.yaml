  - TI004
  figureRefs:
  - FI003
  - FI004
- id: financial-gaps-verdict
  title: Public financial gaps and underwriting verdict
  body: >-
    The public record supports the existence of a coherent revenue engine, not the scale or quality of
    that engine. Latka's historical $4.2 million 2023 revenue datapoint is useful only as a dated signal
    and is internally weakened by a bootstrapped label that conflicts with widely reported venture rounds.
    The official pages and third-party profiles do not disclose current ARR, gross margin, net revenue
    retention, payback, customer concentration, cloud credits, or burn multiple. That leaves the investment
    conclusion conditional: Twelve Labs deserves credit for usage-based packaging, enterprise distribution,
    and a fresh Series B, but financial underwriting should remain research-more until private metrics
    prove that video inference margins can scale. The first diligence packet should include ARR by product,
    gross margin bridge, top-customer concentration, monthly burn, AWS commitments, realized discounts,
    and a two-year forecast tying consumption growth to compute cost. This packet should also reconcile
    board forecasts to metered usage cohorts so growth and cost assumptions remain auditable.
  claimRefs:
  - CI026
  - CI027
  - CI028
  - CI036
  - CI037
  - CI038
  - CI040
