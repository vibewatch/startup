      - number: '3.3'
        title: Distribution, switching cost, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Twelve Labs has a credible technical moat but not a distribution moat comparable with hyperscalers. AWS,
              Microsoft, Google, OpenAI, and Meta can convert platform control into defaults, procurement convenience,
              security review shortcuts, committed-use discounts, and model bundling. Twelve Labs can counter with
              specialization, video-first APIs, developer-friendly entry pricing, and proof that its embeddings and
              analysis are meaningfully better for long-form and multimodal video retrieval. Still, the moat is
              vulnerable to multi-homing: customers can index some archives in Twelve Labs, run classic CV through
              Rekognition or Azure, use Gemini/OpenAI for reasoning, and keep transcript-only workflows with speech
              APIs. Switching cost rises only after indexes, evaluation sets, compliance reviews, and application
              integrations become embedded. The main diligence ask is therefore not whether competitors exist; it is
              whether Twelve Labs wins recurring production workloads where native video understanding materially beats
              cheaper, bundled, or internally hosted alternatives.
