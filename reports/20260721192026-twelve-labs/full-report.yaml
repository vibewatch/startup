        - Quantify hours saved per workflow and compare against API and compute cost
      - - AI-enabled detection, embeddings, and reasoning
        - Driver
        - Current / near-term
        - >-
          Enables search, automated review, alerts, structured output, and corpus-level reasoning that were hard with
          metadata alone
        - Benchmark accuracy, latency, and retrieval quality on customer-owned video
      - - Smart-city, surveillance, and edge-compute expansion
        - Driver
        - Current / medium-term
        - Expands raw camera/video data and need for real-time or post-event analytics
        - Separate privacy-safe analytics use cases from restricted biometric surveillance
      - - Multimodal and generative-AI budget expansion
        - Driver
        - Current / medium-term
        - Pulls AI-platform teams toward video-capable models rather than text-only tools
        - Confirm whether video budgets are new, reallocated, or experimental pilots
      - - Cloud enterprise-video modernization
        - Driver
        - Current
        - Supports API adoption and integration with content-management and collaboration platforms
        - Map integration partners, data residency, and enterprise security requirements
      - - EU AI Act and biometric restrictions
        - Constraint
        - 2025-2026 implementation
        - >-
          Limits or raises compliance cost for CCTV scraping, biometric identification, emotion recognition, and
          high-risk uses
        - Assess product controls for biometric, law-enforcement, workplace, and EU deployments
      - - AI project failure and ROI skepticism
        - Constraint
        - Current
        - >-
          Buyers may demand proof beyond demos because many AI projects fail from data, workflow, infrastructure, and
          scope mismatch
        - Collect pilot-to-production conversion, payback period, and referenceable ROI evidence
      - - Integration, data privacy, false positives, and compute/storage cost
        - Constraint
        - Current
        - Slows deployment into VMS, MAM, and data-platform environments even when use cases are attractive
        - >-
          Diligence implementation burden, false-positive rates, data-retention controls, and gross margin under heavy
          video workloads
    notes: >-
      Drivers and constraints are intentionally paired because market demand can grow while deployments still stall at
      compliance, integration, and ROI gates.
