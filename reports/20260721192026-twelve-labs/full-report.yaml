      - number: '7.3'
        title: Partner, financial, and execution risk
        blocks:
          - type: paragraph
            body: >-
              The Series B creates both runway and concentration. Multiple reports say Twelve Labs raised $100 million
              in 2026, with NAVER Ventures and NEA co-leading and Amazon participating; Edaily reports cumulative
              funding above $207 million, while AWS is described as the preferred cloud provider and future models as
              launching first through AWS, optimized on Trainium. That may be commercially powerful because AWS can
              distribute the models through Bedrock and underwrite compute scale, but it also concentrates product
              roadmap, unit economics, launch sequencing, and buyer perception around a single cloud partner's chip
              strategy. The company also carries a countervailing NVIDIA history: earlier NVIDIA backing validates
              technical ambition but highlights exposure to the GPU-versus-Trainium infrastructure race. Financial risk
              is capital-intensity rather than immediate solvency: video foundation models require large training and
              inference budgets while public revenue, gross margin, usage concentration, and committed cloud spend are
              undisclosed. Execution risk is similarly specific. Jae Lee is a visible founder-CEO, the funding narrative
              quotes his thesis heavily, and the company is expanding across San Francisco, Seoul, New York, London,
              developer APIs, Bedrock distribution, and application products such as Rodeo. That breadth raises
              key-person, hiring, product-focus, and cloud-cost risks that should have explicit kill criteria.
            claimRefs:
