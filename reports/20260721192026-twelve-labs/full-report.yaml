      - number: '7.4'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The investable path is not to wait for every regulatory question to disappear; it is to require evidence
              that Twelve Labs can identify and fence risk faster than the product expands. The most actionable
              diligence package would include SOC 2 report access, cloud commitment economics, model evaluation and
              hallucination benchmarks by use case, customer abuse/escalation logs, dataset provenance files,
              DPA/security exhibits, EU AI Act role mapping, biometric and content-moderation policies, and board-level
              succession planning. The kill criteria should be measurable. A no-go is triggered if Twelve Labs cannot
              prove rights to training and evaluation video datasets, if enterprise contracts shift uncapped
              biometric/IP indemnity onto the company without matching controls, if AWS minimum-spend or Trainium
              optimization terms make gross margin structurally unattractive, if model-evaluation logs show unacceptable
              false-positive/false-negative rates for regulated or security use cases, or if leadership concentration
              has no credible continuity plan. Conversely, risk falls materially if the company can show
              customer-specific deployments avoid prohibited or high-risk uses, human review is enforced in
              consequential workflows, model and abuse monitoring are logged, and partner concentration has economic
              floors rather than open-ended compute exposure.
