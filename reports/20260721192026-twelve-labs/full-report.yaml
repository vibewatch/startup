  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product modules and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Twelve Labs is best understood as a video-understanding API and platform, not a generic video-generation
              tool. The customer workflow starts with ingesting or pointing the system at video, selecting model
              modalities, processing the asset through asynchronous tasks or analysis endpoints, and then using search,
              structured metadata, summaries, classification, or compliance review inside downstream applications.
              Marengo 3.0 is the retrieval and embedding layer; Pegasus 1.5 is the generative video-to-text and
              time-based metadata layer. That division is commercially important because buyers can start with search
              and indexing, then expand into summarize, moderate, segment, or automate workflow decisions. Public
              evidence supports a developer-first surface through REST/JSON APIs, Python and JavaScript SDKs, GitHub
              repositories, npm packaging, and AWS Bedrock access. The main product gap is not whether an API exists; it
              is whether private customers achieve repeatable precision, recall, latency, cost, and human-review
              outcomes on their own video libraries. For underwriting, the practical test is whether those modules
              shorten a real customer task without forcing teams to rebuild their storage, metadata, and reviewer
              workflows around a fragile proof of concept.
