  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk stack
        blocks:
          - type: paragraph
            body: >-
              The legal risk is not a generic AI-compliance overhang; it is tightly tied to the company's
              video-understanding modality. Twelve Labs' AUP already prohibits several uses that map directly to the EU
              AI Act and privacy-law danger zone, including prohibited AI Act practices, unauthorized face or
              physical-characteristic identification, sensitive-attribute inference from images or videos,
              disinformation, surveillance, and high-consequence decisions without oversight. That mitigation is useful
              but contractual: it does not prove that every customer has consent, data provenance, retention schedules,
              or deployment controls. The EU AI Act classifies remote biometric identification, emotion recognition, and
              biometric categorisation as high-risk, and GDPR/EDPB guidance keeps biometric and personal-data model
              reuse under strict purpose, lawful-basis, and anonymization analysis. In the United States, BIPA-style
              damages and Colorado AI Act duties create plaintiff or regulator hooks for video deployments in
              employment, access, security, or other consequential settings. Copyright litigation adds a separate
              dataset-provenance exposure: recent AI training cases distinguish transformative training arguments from
              unlawful acquisition or retention of pirated material. Twelve Labs' diligence path should therefore start
              with the dataset bill of materials, opt-out/deletion process, EU AI Act role classification, biometric-use
              guardrails, and indemnity limits rather than assuming model quality alone will carry the risk.
            claimRefs:
