  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status quo
        blocks:
          - type: paragraph
            body: >-
              Twelve Labs should not be underwritten as a generic foundation-model company or as a camera/VMS hardware
              vendor. Its public product surfaces define a narrower job: make video searchable, analyzable, embeddable,
              and reasoned over through APIs, SDKs, video-native models, and agents that operate on a knowledge store.
              Included spend therefore covers video understanding APIs, video search and retrieval, video-to-text and
              summarization, multimodal embeddings, corpus-level reasoning agents, and workflow automation built on
              video archives. Adjacent spend includes enterprise video platforms, media asset management, video
              surveillance analytics, sports analytics, advertising-content analytics, and automotive perception.
              Explicit exclusions are base cameras, monitors, storage appliances, commodity video conferencing, generic
              LLM subscriptions that do not process video, and manual tagging labor except as a status-quo substitute.
              That boundary matters because published market pages often mix software, hardware, services, surveillance,
              and broad AI, so the chapter preserves multiple lenses instead of forcing one headline TAM.
