      - number: '3.2'
        title: 'Capabilities and pricing: where Twelve Labs is differentiated'
        blocks:
          - type: paragraph
            body: >-
              The strongest Twelve Labs differentiation is the packaged combination of video-native embeddings/search
              and video-to-text analysis. Marengo and Pegasus address the temporal, speech, audio, and visual structure
              of video; the cloud-video APIs remain very useful for labels, OCR, faces, scenes, moderation, and
              transcription, but they are generally organized as classic annotation services or general multimodal model
              calls. Pricing reinforces the comparison. Twelve Labs publishes usage meters for indexing, search, Analyze
              input, output tokens, and embedding infrastructure; Google, AWS, and Azure price many video features by
              minute; Gemini and OpenAI lean into model-token pricing; and creative tools publish creator or enterprise
              subscriptions. That makes apples-to-apples cost comparisons difficult, but it also means procurement teams
              can multi-home and use the cheapest adequate tool for each workflow. Unsupported cells in the matrix are
              intentional: public sources rarely disclose realized discounts, latency, or head-to-head retrieval
              quality.
