  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Twelve Labs monetizes a video-understanding API rather than a seat-first SaaS application. The public
              pricing surface shows a stack of usage meters: video indexing for Marengo, monthly embedding
              infrastructure, Search API queries, Embed API calls by modality, and Pegasus analysis plus output tokens.
              That creates a clean bridge from customer activity to revenue because more indexed minutes, searches, and
              analyzed segments produce more billable events. Enterprise contracts add a second layer: high-volume
              customers can move away from list rates into committed-use or custom plans, and AWS Marketplace provides a
              partner distribution surface for Bedrock-style consumption. The model is financially attractive because
              usage pricing partly matches compute COGS, but it also makes realized pricing, discounting, and workload
              mix critical diligence variables. Official pricing is list pricing, not ARR, gross margin, or net
              retention; the chapter therefore treats all private financial metrics as undisclosed until Twelve Labs
              provides a customer-level revenue schedule.
