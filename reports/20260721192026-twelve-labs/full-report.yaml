      - number: '7.2'
        title: Operational, security, and model-quality risk
        blocks:
          - type: paragraph
            body: >-
              Twelve Labs publishes a relatively mature security posture for a private AI startup: encryption at rest
              and in transit, least privilege, audit logging, vulnerability scanning, incident response, vendor risk
              review, AWS infrastructure, and a SOC 2 Type 2 announcement. Those controls reduce enterprise-procurement
              friction, but they are not the same as model assurance for video cognition. The highest operating risk is
              that customers treat search, segmentation, summaries, or structured extraction as ground truth in
              workflows where false positives, missed incidents, or hallucinated events have legal or financial
              consequences. Academic work on video hallucination notes that large multimodal models can produce
              plausible but incorrect answers, and security research on visual prompt injection shows that image/video
              inputs can carry adversarial instructions. SOC 2 can evidence information-security controls, but
              AI-specific controls still require evaluation sets, red-team logs, prompt/model change management, abuse
              monitoring, customer-specific thresholds, and human-in-the-loop review. Until those artifacts are
              inspected, the residual risk remains medium-high even though official security materials are directionally
              positive.
            claimRefs:
              - CR015
              - CR016
