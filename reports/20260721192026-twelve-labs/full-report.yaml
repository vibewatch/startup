      - number: '2.4'
        title: Growth drivers, adoption constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The growth case is strong because video volume, smart cameras, edge computing, cloud-native enterprise
              video, and multimodal generative AI all push organizations toward automated video understanding. Twelve
              Labs' own product claims match that pull: search moments with text or image queries, analyze videos,
              generate embeddings, and reason across an entire knowledge store. The constraint case is equally
              important. Polaris flags VMS integration complexity, compute and storage requirements, data privacy, and
              false positives. RAND's AI-project research warns that more than 80% of AI projects fail and that only 14%
              of organizations in the cited survey were fully ready to integrate AI, with root causes in problem
              definition, data, infrastructure, workflow fit, and technical feasibility. The EU AI Act bans or restricts
              several biometric and CCTV uses, while NIST emphasizes AI risk management and Stanford documents
              accelerating regulation and incidents. The largest diligence gap is not whether video AI is growing; it is
              how much of these overlapping pools Twelve Labs can capture profitably after pilots, governance review,
              and integration work.
