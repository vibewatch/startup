      - number: '2.2'
        title: Sizing lenses and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              Public market estimates are directionally favorable but materially inconsistent. For the core
              video-analytics pool, 2026 estimates range from The Business Research Company's $11.59B, through Mordor
              Intelligence's $15.04B, to Precedence Research's $18.53B, while Polaris reports $17.62B. CAGR estimates
              cluster in the mid-teens to low-twenties, but vendors define the category differently and often include
              surveillance, retail, government, and VMS layers that Twelve Labs may only partially address. A broader
              TAM lens is generative AI, where Precedence estimates $55.51B in 2026 and Fortune estimates $161B in 2026;
              that gap is useful as a warning that broad AI TAMs can overstate the near-term revenue pool for a
              video-understanding API. A narrower beachhead is multimodal AI, where Precedence estimates $3.43B in 2026
              and MarketsandMarkets lists Twelve Labs among providers in a market expected to reach $4.5B by 2028. The
              underwriting conclusion is large and growing, but precision is low.
