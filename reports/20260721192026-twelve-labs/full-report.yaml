      - number: '2.3'
        title: Buyer, user, payer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer changes by segment, but the common adoption path is a workflow owner with too much
              video, an integration team that must connect archives or streams, and a budget owner who needs measurable
              time savings, search quality, compliance lift, or revenue impact. In media and entertainment, the buyer is
              often media operations, archive, product, or post-production leadership; editors, compliance reviewers,
              producers, and research teams are users. In security and surveillance, the buyer is public safety,
              security operations, or facilities; analysts and dispatch teams use the system; privacy/legal teams can
              block deployment. Sports teams, leagues, and broadcasters buy performance, tactical, scouting, and
              fan-experience analytics, while advertising and marketing teams use video intelligence for content
              classification, personalization, and campaign workflows. Automotive buyers are ADAS/autonomy engineering
              and data teams that need visual perception and clip retrieval. The buyer map supports APIs first, but
              larger deployments still require data governance, model evaluation, procurement, and change management.
            claimRefs:
