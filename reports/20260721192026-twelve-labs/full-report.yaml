  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Recommendation: research-more / track at a presumed roughly $1B entry, not buy on the public record alone.
              The strongest evidence is that Twelve Labs raised a large 2026 Series B from high-quality strategic and
              financial investors, has a differentiated video-understanding thesis, and gained an AWS infrastructure
              commitment that may matter for inference economics. The weakest evidence is valuation support: the
              official announcement and reviewed coverage do not disclose a post-money valuation, CB Insights and Tracxn
              keep valuation or revenue fields masked, and no fetched public source closes ARR, gross margin, net burn,
              customer concentration, or preference terms. That makes the final stance price-sensitive rather than
              company-dismissive. If private diligence shows meaningful enterprise ARR, repeat expansion, and durable
              Trainium cost advantage, the company could merit a premium. Without that proof, public evidence supports
              category conviction more than immediate $1B underwriting. In committee terms, this means the next step is
              not pass/fail on the company but conversion of private evidence into price, ownership, and downside
              protection. A clean round with ordinary preferences and accelerating usage would change the recommendation
              faster than another press article.
            claimRefs:
              - CV001
