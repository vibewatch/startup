      - number: '8.2'
        title: Comparable support and limits
        blocks:
          - type: paragraph
            body: >-
              The comp set supports a wide valuation envelope but not a simple read-through. Runway, Synthesia, Pika,
              Perplexity, and Mistral show that investors still pay major premiums for AI companies with perceived
              category leadership, but the evidence splits between revenue-backed enterprise software and frontier-scale
              capital narratives. Synthesia is the cleanest enterprise-video comp because Sacra reports substantial ARR
              and a $4B post-money valuation; Runway is a larger video-AI creation/world-model comp; Pika is a smaller
              consumer-creation comp whose cited risks map directly to Twelve Labs downside; Perplexity and Mistral show
              how extreme foundation-model premiums can become when investors believe a platform shift is under way.
              Twelve Labs sits between these categories: it has foundation-model language and strategic backers, but
              public sources do not show the revenue proof that would translate the comp set into a confident multiple.
