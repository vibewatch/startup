companyProfile:
  summary: >-
    Twelve Labs (TwelveLabs) is a San Francisco-headquartered video-intelligence company, founded in 2021, that builds
    foundation models focused exclusively on video understanding. Its platform exposes Search, Analyze, and Embed
    workflows powered by the Marengo model family (multimodal video embeddings and retrieval) and the Pegasus
    video-language model (video-to-text description, summarization, and structured metadata). The company distributes
    its models through its own API, Amazon Bedrock, and the AWS Marketplace, and serves media and entertainment,
    advertising, sports, security, government, and automotive use cases. In July 2026 it raised a $100M Series B
    co-led by NEA and NAVER Ventures, adding to roughly $207M raised to date.
  foundedDate: "2021-03-31"
  founders:
    - name: Jae Lee
      role: Co-founder & CEO
      background: Traces the company's origin to 2021 work with close friends from Korean Cyber Command; consistently named as co-founder and CEO across sources.
      claimRefs: [CO005, CO006]
    - name: Aiden Lee
      role: Co-founder
      background: Named among Twelve Labs founders in the CB Insights profile alongside Dave Chung, SJ Kim, and Soyoung Lee.
      claimRefs: [CO007]
  foundingLocation: San Francisco, California, USA (with founding-team roots in Korea)
  headquarters: San Francisco, California, USA (additional operations in Seoul; New York and London expansion in 2026)
  productSummary: >-
    Video-understanding foundation models and APIs — Marengo 3.0 for multimodal search and 512-dimension embeddings,
    Pegasus 1.5 for schema-first video-to-text and time-based metadata, and an Embed API — sold via self-serve API,
    Amazon Bedrock, and AWS Marketplace.
  customerFocus: Enterprises and developers in media & entertainment, advertising, sports, security/surveillance, government, and automotive that need to search, analyze, and operationalize large video archives.
  businessModel: Usage-based API monetization (indexing/inference) plus enterprise plans, distributed directly and through AWS Marketplace / Amazon Bedrock.
  stage: Series B
  fundingStatus: $100M Series B announced July 1, 2026 (co-led by NEA and NAVER Ventures); approximately $207M raised to date across seed, Series A ($50M, 2024), and Series B.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO009, CO017, CO020, CO033]
