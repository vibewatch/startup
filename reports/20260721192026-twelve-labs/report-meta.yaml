  topStrengths:
    - Differentiated, video-only foundation-model focus (Marengo 3.0 search/embeddings and Pegasus 1.5 video-to-text) in a category most rivals treat as a general-multimodal add-on.
    - High-quality strategic and financial backing — NEA, NAVER Ventures, Amazon, Radical Ventures, Index Ventures, Korea Investment Partners, Quadrille Capital, and Red Bull Ventures.
    - AWS named preferred cloud provider under a multiyear Trainium commitment, plus Amazon Bedrock and AWS Marketplace distribution, which can improve inference economics and enterprise reach.
    - Exposure to large, fast-growing markets (video analytics, generative and multimodal AI, video surveillance, sports analytics) with multiple credible sizing lenses.
  topRisks:
    - No public disclosure of ARR, revenue run-rate, gross margin, burn, runway, or post-money valuation — the presumed ~$1B price cannot be underwritten on public evidence.
    - Commoditization risk from big-tech multimodal foundation models (Google Gemini, OpenAI, Microsoft/Amazon native video services) that can bundle video understanding.
    - Regulatory and legal exposure — EU AI Act high-risk/biometric surveillance classification, GDPR and biometric-privacy laws, and generative-AI training-data / copyright litigation.
    - Concentration and key-person risk — dependence on CEO Jae Lee and on AWS/NVIDIA/NAVER partner and cloud relationships.
  unresolvedGaps:
    - Revenue, ARR, gross margin, net burn, and runway are undisclosed and block underwriting.
    - Post-money valuation, cap-table structure, liquidation preferences, and option-pool terms are not public.
    - Customer concentration and the production-vs-pilot mix of named deployments are unclear.
    - Net revenue retention, gross retention, and churn metrics are unavailable.
