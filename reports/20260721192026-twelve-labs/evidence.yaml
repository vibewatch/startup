evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private metrics
    missingEvidence: Audited or management-provided revenue, ARR, gross margin, burn, runway, and paying-customer count by segment.
    whyItMatters: >-
      These metrics determine whether the company is a research-led platform with early traction or a scaled enterprise
      software business.
    diligencePath: Request a management KPI pack, cohort exports, cloud spend, bookings bridge, and customer concentration schedule.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      Primary financing terms or a reliable independent article disclosing post-money valuation and share class details
      for the Series B.
    whyItMatters: Valuation is central to the investment stance and cannot be inferred from round size or investor quality.
    diligencePath: >-
      Ask the company or lead investors for the Series B term sheet, capitalization table, and any secondary/tender
      allocation.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: Leadership and founder table coverage
    missingEvidence: Complete current executive roster, board members, observer rights, and founder operating roles.
    whyItMatters: The public record supports founder-led identity but not a complete governance or succession-risk assessment.
    diligencePath: Request an org chart, board deck, investor-rights schedule, and management biographies from the company.
    relatedQuestionRefs:
      - QO005
      - QO006
      - QO007
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: funding conflict
    missingEvidence: >-
      Reconciled funding ledger that explains the difference between current $207M+ sources and the stale Crunchbase
      $107.1M profile.
    whyItMatters: Later chapters need one canonical capital figure and should not mix stale and current totals.
    diligencePath: Triangulate with PitchBook, company cap table, investor confirmations, and updated Crunchbase/Tracxn exports.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: diligence gaps
    missingEvidence: >-
      Twelve Labs customer-level ARR, usage by vertical, pilot-to-production conversion, and gross margin by video
      workload.
    whyItMatters: >-
      Without private operating evidence, public market estimates cannot be converted into a defensible share-capture or
      valuation model.
    diligencePath: >-
      Request management cohort data by vertical, API usage, expansion rates, churn, compute cost, and reference calls
      with production customers.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: conflicting-data
    severity: material
    topic: sizing contradiction
    missingEvidence: >-
      A market study that isolates video-understanding API/software revenue from surveillance hardware, VMS,
      conferencing, and generic AI spend.
    whyItMatters: >-
      Reported market sizes overlap and vary widely, so a single TAM can misstate the investable market available to
      Twelve Labs.
    diligencePath: >-
      Build a bottom-up SAM from customer workflows, spend per hour of indexed video, developer usage, and comparable
      API contract values.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: win/loss
    missingEvidence: >-
      Customer-level win/loss data against Google, AWS, Azure, OpenAI, Coactive, Hive, Reka, and internal-build
      alternatives.
    whyItMatters: >-
      Competitive durability depends on whether Twelve Labs wins production workloads, not only whether it has a
      differentiated public API.
    diligencePath: >-
      Request anonymized CRM opportunity exports, proof-of-concepts, renewal cohorts, and three customer reference calls
      focused on evaluated alternatives.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized enterprise committed-use pricing, discounts, minimums, and gross-margin impact versus list pricing.
    whyItMatters: >-
      Published pricing does not reveal whether Twelve Labs can defend premium economics against cloud bundles or
      specialist peers.
    diligencePath: >-
      Review top ten contracts, usage curves, discount schedules, AWS/partner pass-through economics, and
      expansion-renewal price changes.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmarks
    missingEvidence: >-
      Independent head-to-head benchmarks for Marengo 3.0 and Pegasus 1.5 against Gemini, OpenAI, Reka, and open-source
      video-language models on long-form retrieval and reasoning.
    whyItMatters: The moat claim is technical; without independent benchmarks, ordinal capability scores remain author estimates.
    diligencePath: >-
      Run a blind benchmark on customer-like long videos with fixed latency, recall, reasoning-quality, and
      dollar-per-hour metrics.
    relatedQuestionRefs:
      - QP028
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: current-arr
    missingEvidence: Current ARR, revenue run-rate, and monthly revenue bridge by product.
    whyItMatters: Revenue scale and multiple cannot be underwritten from list pricing or a historical Latka datapoint.
    diligencePath: Request management ARR export by month, SKU, customer, geography, and cohort with finance-system tie-out.
    relatedQuestionRefs:
      - QI014
      - QI015
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin and cost ledger by Marengo indexing, search, Embed, Pegasus Analyze, and enterprise deployments.
    whyItMatters: AI-native benchmarks imply margin pressure, but company-specific AWS terms could materially change the outcome.
    diligencePath: Review cloud invoices, AWS contracts, model-serving telemetry, and product-level P&L for the last six quarters.
    relatedQuestionRefs:
      - QI010
      - QI011
      - QI019
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC payback, sales cycle, pipeline conversion, GRR, NRR, and enterprise discounting.
    whyItMatters: >-
      Enterprise custom plans can create attractive commits or expensive bespoke support; public sources do not separate
      them.
    diligencePath: Obtain CRM cohort analysis, top-20 contract summaries, discount schedules, and renewal/churn bridge.
    relatedQuestionRefs:
      - QI008
      - QI009
      - QI025
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: burn-runway
    missingEvidence: Cash on hand, monthly net burn, committed spend, and board-approved operating plan.
    whyItMatters: The $100M Series B is gross financing, not a verified runway calculation.
    diligencePath: Review bank statements, cash forecast, budget-vs-actuals, hiring plan, and cloud commitments through 2028.
    relatedQuestionRefs:
      - QI018
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: debt-cloud-commitments
    missingEvidence: Debt schedule, credit facilities, cloud credits, AWS committed spend, and lease obligations.
    whyItMatters: Public sources do not disclose obligations that could consume proceeds or alter gross-margin quality.
    diligencePath: >-
      Request all financing agreements, AWS private offer documents, side letters, leases, guarantees, and off-balance
      commitments.
    relatedQuestionRefs:
      - QI020
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: conflicting-data
    severity: minor
    topic: historical-revenue
    missingEvidence: Management confirmation of 2023 revenue and reconciliation to Latka's bootstrapped label.
    whyItMatters: Latka's $4.2M historical revenue datapoint is useful but partially contradicted by funding evidence.
    diligencePath: Ask management for audited or board-approved 2023 revenue and an explanation of third-party data discrepancies.
    relatedQuestionRefs:
      - QI015
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: soc2-gap
    missingEvidence: Current SOC 2 Type 2 report, subprocessor list, data-retention schedule, and customer data/model-training terms.
    whyItMatters: >-
      Sensitive video archives create privacy, confidentiality, and customer-data-use risk that cannot be underwritten
      from a blog post alone.
    diligencePath: Request the trust packet under NDA and map controls to customer video data flows and deployment regions.
    relatedQuestionRefs:
      - QE014
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: reliability-gap
    missingEvidence: >-
      Official Twelve Labs SLA, historical uptime export, incident postmortems, rate-limit policy, and support
      commitments.
    whyItMatters: >-
      Search and moderation workflows become operational dependencies once customers route production video through the
      API.
    diligencePath: Ask for customer contract SLA terms, 12-month incident history, and quota/latency commitments by deployment path.
    relatedQuestionRefs:
      - QE017
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: benchmark-gap
    missingEvidence: >-
      Independent or customer-reproducible benchmark pack comparing Marengo 3.0 and Pegasus 1.5 against alternatives on
