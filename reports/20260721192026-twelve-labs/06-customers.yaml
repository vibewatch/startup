  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, renewal rate, renewal cohort, contract length, and support satisfaction data by customer
      segment.
    whyItMatters: Retention determines whether named workflows translate into durable recurring revenue rather than isolated
      deployments.
    diligencePath: Request cohort tables from management and validate them through at least five customer reference calls.
    relatedQuestionRefs:
    - QU016
    - QU017
    - QU018
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Revenue concentration by top customer, top-ten customers, AWS Marketplace channel, and largest partner-sourced
      accounts.
    whyItMatters: A few archive-heavy or channel-heavy accounts could overstate customer breadth and expose revenue to procurement
      changes.
    diligencePath: Request ARR by customer, channel, and vertical with anonymized account sizes and renewal status.
    relatedQuestionRefs:
    - QU020
    - QU024
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: Full customer roster, active production account count, and status for logos or private references not
      included in public case studies.
    whyItMatters: The public customer list is a strong sample but not an exhaustive population for estimating penetration
      or concentration.
    diligencePath: Ask for current customer count, production account count, and segmented reference list with permission
      for diligence calls.
    relatedQuestionRefs:
    - QU001
    - QU009
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: pilot-production-risk
    missingEvidence: Dated go-live, renewal, usage, and expansion evidence for cases where public stories describe phases
      or opportunities.
    whyItMatters: Pilot-only or early partnership evidence can look like adoption without proving repeat production spend.
    diligencePath: For SBS, Dyn, security, public-sector, and automotive accounts, request deployment status, paid term, usage
      volumes, and renewal plan.
    relatedQuestionRefs:
    - QU011
    - QU012
    - QU025
  - type: access-blocked
    severity: minor
    topic: independent-satisfaction
    missingEvidence: Accessible third-party review exports from G2, Capterra, Gartner Peer Insights, or customer-support surveys.
    whyItMatters: Company-published testimonials do not reveal support quality, implementation friction, or churn risk.
    diligencePath: Request customer support CSAT, NPS, implementation SLA metrics, and permission to review unfiltered review-site
      exports.
    relatedQuestionRefs:
    - QU017
    - QU021
