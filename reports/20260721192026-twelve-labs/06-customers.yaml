- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Public evidence supports a path from manual video pain to API, marketplace, or partner-led workflow embedding.
  data:
    nodes:
    - label: Manual video pain
      detail: Editors, compliance teams, campaign managers, and archive owners cannot find or review footage fast enough.
    - label: Representative-content test
      detail: Customers test long-form, multilingual, brand-safety, sports, commerce, or archive edge cases.
    - label: Procurement path
      detail: Teams buy through direct API, AWS Marketplace, Amazon Bedrock, partner integrations, or self-serve plans.
    - label: Workflow integration
      detail: Models are embedded in encoding, media-asset, editor, recommendation, or archive-search workflows.
    - label: Operational outcome
      detail: Time savings, conversion lift, content verification speed, or dataset delivery speed become the local ROI case.
    - label: Expansion loop
      detail: More indexed libraries, more use cases, additional partner surfaces, and new model capabilities can expand usage.
  approximationNotes: Journey stages synthesize public case-study paths and are not a measured conversion funnel.
