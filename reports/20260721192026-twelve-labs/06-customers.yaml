  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale or proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Media & entertainment
    - Media ops buyer; editors and licensing teams; enterprise budget
    - Archive search, scene metadata, promo and licensing workflows
    - Twelve Labs solution page and MLSE/SBS proof
    - High strategic value because archives become searchable inventory
    - No disclosed segment revenue or renewal rate
  - - Sports & broadcasting
    - Sports media ops; producers and editors; club or league budget
    - Highlight search, fan personalization, performance and archive search
    - MLSE and Dyn stories; sports solution page
    - High because speed and personalization are repeat workflows
    - Dyn public proof lacks dated production metrics
  - - Advertising / brand safety
    - Ad product, compliance and campaign teams; publisher or marketplace payer
    - Brand-safety decisions, contextual ad breaks, creator-post verification
    - Mantis and AffiliateNetwork case studies; advertising solution page
    - Potentially high because it protects ad spend and compliance
    - Advertised lift lacks sample-size disclosure
  - - Commerce video
    - Search and recommendation teams; ecommerce product budget
    - Video-context recommendation and short-clip search
    - GS SHOP case study with conversion and order metrics
    - Strategic because it ties video AI to commerce KPIs
    - One named commerce customer in public evidence
  - - Nonprofit / archive operations
    - Communications and campaign staff; nonprofit operations budget
    - Search fragmented field footage and campaign media
    - UNICEF Korea case study with 8TB archive and 95% retrieval-time reduction
    - Strategic reference; revenue value unknown
    - No renewal or contract term disclosed
  - - Developer / API builders
    - Developers and product teams; self-serve or enterprise platform budget
    - Build semantic search, Analyze, Embed, and custom apps
    - Developer Hub, pricing free plan, TechCrunch 30,000+ developers
    - Broad funnel and ecosystem value
    - Developer-to-paid conversion not disclosed
  - - Security / surveillance
    - Security operations and analysts; agency/facility budgets
    - Incident reconstruction, behavioral search, anomaly detection
    - Official solution page and vertical-demand press
    - Potential high ACV in regulated environments
    - No named public security customer fetched
  notes: Segment map is based on public customer stories and official solution pages; revenue value is qualitative because
    revenue by segment is not disclosed.
