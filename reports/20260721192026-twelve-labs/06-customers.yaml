- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - More indexed minutes and retained embeddings
    - Large archive customers could dominate usage if pricing is tied to indexed minutes
    - High upside but potential gross-margin and concentration sensitivity
    - Request usage distribution by top 10 accounts and indexed-minute cohorts
  - - AWS Marketplace and Bedrock channel
    - AWS may become a large procurement and infrastructure dependency
    - Channel accelerates enterprise purchasing but could concentrate pipeline
    - Request direct vs AWS Marketplace bookings, renewal, and margin split
  - - Partner integrations with Databricks, Snowflake, Monks, Avid, Qencode
    - Partner-sourced usage may be indirect and harder to attribute
    - Can widen reach into enterprise workflows
    - Request partner-sourced ARR, active deployments, and attach rate
  - - Additional models and use cases
    - Customers may pilot multiple modes without renewing production workloads
    - Expansion plausible but not proven by public NRR
    - Request expansion ARR by product module and renewal cohort
  - - Security, government, and automotive demand
    - Named proof is sparse in these sensitive verticals
    - Large ACV possible but procurement and trust hurdles are high
    - Request named references, deployment status, data-residency controls, and compliance packages
  - - Self-serve developer funnel
    - Many developers may stay free or experimental
    - Broad adoption may not convert to durable revenue
    - Request free-to-paid conversion, developer churn, and usage by company domain
  - - Cloud-only and multi-meter pricing friction
    - Regulated customers may prefer own-storage or single-tenant alternatives
    - Could slow large archive expansion or trigger competitive displacement
    - Test buyer objections with security, legal, and procurement references
  notes: Risk table combines public evidence and explicit evidence gaps; top-customer concentration and channel concentration
    are not disclosed.
