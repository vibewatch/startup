- id: retention-repeat-use-and-satisfaction
  title: Retention, repeat use, and satisfaction evidence
  body: 'Retention quality is the weakest part of the public customer record. The chapter found strong testimonials and operational
    outcomes, but no public NRR, GRR, churn, renewal, cohort-retention, support satisfaction, or contract-length disclosure.
    There are positive retention proxies: customers describe replacing manual work, embedding Twelve Labs into ongoing pipelines,
    automatic indexing of new content, and partner panels that sit inside daily creative tools. Those proxies imply workflow
    stickiness once footage is indexed and search becomes part of operations. They are not the same as renewal proof. Independent
    satisfaction is also thin: public named stories are company-published and a competitor comparison is available, but the
    retained evidence did not yield accessible third-party review pages with enough detail to score support quality. A customer
    can like the product while still limiting spend to a pilot, a single library, or a short-term project, so diligence must
    separate usage enthusiasm from renewal evidence and budget expansion.'
  claimRefs:
  - CU010
  - CU011
  - CU022
  - CU024
  - CU025
  - CU028
  - CU034
  - CU039
  - CU040
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration-and-adverse-view
  title: Expansion, concentration, and adverse view
  body: 'Expansion can come from more indexed minutes, additional models, new use cases, AWS Marketplace procurement, Bedrock
    availability, integrations with data platforms, editor panels, and systems integrators. That makes the account-expansion
    thesis plausible even without disclosed NRR. The adverse view is also specific. Public evidence does not disclose customer
    count, production-account count, top-customer share, revenue by vertical, or channel concentration. A competitor argues
    Twelve Labs has multiple billing meters, cloud-only deployment, processed-in-region limitations, and video hosted in Twelve
    Labs cloud. Those issues matter for large archives, regulated customers, and buyers with data-residency requirements.
    Diligence should therefore ask for cohort retention, repeat usage by indexed minutes, renewal rates, AWS Marketplace pipeline
    mix, security/public-sector named deployments, and revenue concentration before treating public traction as durable revenue.
    The result is a two-sided diligence posture: public proof is strong enough to justify reference calls and data-room follow-up,
    but not strong enough to assume high retention, low concentration, or frictionless expansion without private customer
    and usage data.'
