chapter:
  number: 6
  title: Customers
  summary: Twelve Labs has credible named-customer proof across media, sports, advertising, commerce, nonprofit archive, video
    infrastructure, creator-marketing, and AI-data workflows. The evidence is strongest for production-like workflow adoption
    and time-savings outcomes, but retention, renewal, customer count, and concentration metrics remain private.
sections:
- id: segments-and-buyer-map
  title: Customer segmentation and buyer map
  body: 'Public customer evidence supports a segmented customer base rather than a single horizontal buyer. The strongest
    proof clusters around media and entertainment, sports and broadcasting, advertising and brand safety, commerce video,
    nonprofit archives, creator-marketing compliance, AI-training-data workflows, and developer/API adoption. Economic buyers
    vary by segment: media operations, product and technology leaders, content operations, advertising compliance, ecommerce
    recommendation teams, archive owners, and developer platform teams. Users are usually editors, producers, campaign managers,
    data teams, or developers, while payers are enterprise procurement teams, AWS Marketplace buyers, or self-serve developers.
    The key nuance is that Twelve Labs has broad solution messaging for security, automotive, public sector, and government,
    but named customer proof is much heavier in media, sports, advertising, commerce, and archival workflows. This matters
    for diligence because segmentation evidence is not the same as revenue mix. Named references demonstrate that the product
    solves concrete workflow pain, yet the public record does not identify which vertical contributes most bookings, which
    buyer controls renewals, or whether usage is concentrated in a handful of archive-heavy accounts.'
  claimRefs:
  - CU001
  - CU002
  - CU009
  - CU013
  - CU014
  - CU016
  - CU018
  - CU024
  - CU027
  - CU028
