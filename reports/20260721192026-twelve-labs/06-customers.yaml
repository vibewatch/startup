  - CU036
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-production-proof
  title: Adoption trajectory and production proof
  body: 'The best customer proof is not logo-only. Mantis moved from a Q4 2025 proof-of-concept into a March 2026 production
    deployment through AWS Marketplace; GS SHOP describes a proof-of-concept that shifted to full-scale rollout; UNICEF Korea
    reports an indexed archive with automatic ingestion; MLSE reports a material production-time reduction; Qencode embeds
    Twelve Labs as a native intelligence output in the encoding pipeline; and Protege describes two-week delivery for video
    datasets that otherwise would have required months. These stories show a common adoption path: painful manual search or
    review, a representative-content test, API or partner integration, then operational rollout. The caveat is that some references,
    notably SBS and Dyn, use partnership and opportunity language without public renewal, contract value, or dated expansion
    evidence. For diligence, the important distinction is not named versus unnamed logos; it is tested content, production
    use, embedded workflow, measured outcome, renewal, and expansion. Public sources support the first four stages for several
    accounts, but rarely the final two.'
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
