    targetSlug: recommendation-logic
    type: flow
    layout: wide
    summary: 决策先看战略验证，再过私有数据关口，之后才可能给出买入判断。
    data:
      nodes:
        - id: funding
          label: 战略融资轮
          detail: $100M Series B 轮和一线投资人名单
        - id: category
          label: 品类质量
          detail: 原生视频理解逻辑与 AWS 合作关系
        - id: disclosure
          label: 披露缺口
          detail: 未公开估值、ARR、毛利率或交易条款
        - id: market
          label: 市场风险
          detail: 2026 年 AI 溢价向头部集中，资金更挑剔
        - id: diligence
          label: 尽调关口
          detail: ARR、毛利率、股权结构表、AWS 经济性、客户证据
        - id: call
          label: 最终判断
          detail: 关口打通前，维持观察 / 继续研究
      edges:
        - - funding
          - category
        - - category
          - disclosure
        - - disclosure
          - market
        - - market
          - diligence
        - - diligence
          - call
