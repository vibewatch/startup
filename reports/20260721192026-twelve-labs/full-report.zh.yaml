      - CV029
      - CV030
      - CV034
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    targetSlug: bull-base-bear-scenario-table
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发
    rows:
      - - 乐观
        - 企业 ARR 快速扩张；AWS 降低单位成本；留存强
        - 若摊薄后退出估值达到 $4B 至 $6B，推定 $1B 入场价可继续复利
        - 大客户扩展到多个视频工作流
        - ARR 或利润率证据未出现
      - - 基准
        - 品类真实，但公开指标仍不足
        - 持续跟踪，直到私下指标支撑价格，或入场价重置到更低风险
        - 战略投资者和市场可比公司保留期权价值
        - 无法进入数据室，或条款差于标准 1x 非参与优先股
      - - 悲观
        - 收入仍早期、毛利率弱，超大云厂商把视频理解商品化
        - 推定 $1B 入场价可能遇到降价轮或二级退出持平
        - 不利的市场集中和算力风险证据占主导
        - AWS 经济性由抵扣额度驱动，或客户集中度高
    notes: 情景数值是承销区间，不是公司披露的预测；实际回报需要股权结构和摊薄数据。
    claimRefs:
