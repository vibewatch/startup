  - id: TV005
    title: 论点失效与淘汰触发表
    targetSlug: thesis-break-and-kill-triggers-table
    columns:
      - 触发项
      - 阈值或事件
      - 对论点的影响
      - 行动含义
    rows:
      - - 收入证据缺失
        - NDA 下仍不披露当前 ARR、客户分群扩张或待履约订单
        - 无法承销推定 $1B 价格
        - 继续跟踪 / 不建议发投资条款清单
      - - 单位经济性弱
        - 按工作负载拆分的毛利率没有随规模或 Trainium 优化改善
        - 视频推理成本侵蚀软件式倍数
        - 要求价格重置，否则放弃
      - - 战略依赖
        - AWS 条款偏促销、不可迁移，或造成高额承诺支出
        - 伙伴验证变成毛利率 / 依赖风险
        - 要求合同审查和下行情景模型
      - - 股权结构包袱
        - 参与型优先股、高额清算优先栈，或大规模期权池刷新
        - 即使企业价值增长，普通股回报也受损
        - 重新谈入场条件，或回避
      - - 竞争冲击
        - 超大云厂商原生产品以更低价格达到同等检索质量
        - 独立视频智能价值被压缩
        - 暂停，直到拿到赢单 / 输单和基准证据
      - - 流动性压缩
        - 二级或退出市场将应用 AI 倍数大幅下调
        - 持有期和估值标记风险上升
        - 只有拿到更高持股或更低价格才推进
    notes: 淘汰标准把未解决的估值风险转成可监控的投资动作。
    claimRefs:
      - CV017
      - CV022
      - CV023
      - CV024
      - CV029
      - CV030
      - CV035
      - CV040
      - CV041
      - CV045
  - id: TV006
    title: 最终尽调问题表
    targetSlug: final-diligence-asks-table
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 估值和条款
        - 投后估值、投前估值、期权池、清算优先权、按比例认购权、补充协议
        - 决定推定 $1B 入场价能否产生 VC 回报
        - 公司 CFO / 法务；审查融资文件
      - - 收入质量
        - ARR、确认收入、待履约订单、NRR、总留存、客户集中度
        - 区分战略热度和可重复的企业需求
        - 财务数据室，加上头部客户分群分析
      - - 单位经济性
        - 按索引、搜索、生成输出、存储和支持拆分的毛利率
        - 视频 AI 可能很吃算力；倍数取决于毛利率路径
        - 云账单和工作负载成本审查
      - - AWS 经济性
        - Trainium 基准、抵扣额度、承诺支出、排他性和数据驻留条款
        - 验证 AWS 伙伴关系改善还是束缚经济性
        - 审查 MSA、订单表和基准测试
      - - 客户证明
        - 具名生产客户、ACV、扩张、流失和部署状态
        - 支撑乐观情景和退出准备度
        - 客户访谈和合同抽样
      - - 竞争基准
        - 准确率、延迟和价格对比 Google、OpenAI、Runway 及其他视频模型
        - 检验面对超大云厂商和专业厂商时的防守能力
        - 技术尽调和盲测基准
      - - 退出路径
        - 战略收购方地图、二级市场兴趣、IPO 准备度和必要规模里程碑
        - 决定持有期和目标回报
        - 投行 / 二级市场核查和董事会计划审查
    notes: 每个尽调问题都服务于一个目标：把建议从跟踪推进到买入、重定价或回避。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV042
      - CV043
      - CV044
      - CV045
