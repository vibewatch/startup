      - number: '2.2'
        title: 规模测算视角与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              公开市场估计方向有利，但差异很大。核心视频分析池中，2026 估计从 The Business Research Company 的 $11.59B，到 Mordor Intelligence 的
              $15.04B，再到 Precedence Research 的 $18.53B；Polaris 则报告 $17.62B。CAGR 估计集中在中双位数到二十出头，但供应商对品类定义不同，常纳入监控、零售、政府和
              VMS 层，而 Twelve Labs 可能只部分覆盖。更宽的 TAM 视角是生成式 AI，Precedence 估计 2026 为 $55.51B，Fortune 估计 2026 为
              $161B；这个差距提醒我们，宽口径 AI TAM 可能夸大视频理解 API 的近期收入池。更窄的切入口是多模态 AI，Precedence 估计 2026 为 $3.43B，MarketsandMarkets
              将 Twelve Labs 列为供应商之一，并预计该市场到 2028 达到 $4.5B。投资结论是：市场大且在增长，但精度低。
