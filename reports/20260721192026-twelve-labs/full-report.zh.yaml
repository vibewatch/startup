  - id: TV002
    title: 投资论点 / 反论点表
    targetSlug: thesis-anti-thesis-table
    columns:
      - 论点
      - 证据支持
      - 什么会改变判断
    rows:
      - - 论点：视频是差异化 AI 模态
        - Twelve Labs 描述了原生视频感知、记忆和推理架构
        - 多个垂直领域出现客户工作负载证明，并有重复支出
      - - 论点：战略投资验证品类
        - Amazon、NEA、NAVER 和既有投资者参与最新一轮
        - 需要证明背书能转化为收入，而不只是基础设施赞助
      - - 论点：可比公司支持 AI 溢价定价
        - Runway、Synthesia、Mistral 和 Perplexity 显示 AI 私募估值处于高位
        - Twelve Labs 必须拿出可比企业级赢家的收入质量
      - - 反论点：估值未公开
        - 官方和独立来源都未披露投后估值
        - 已签署的投资条款清单和带投资者保护的股权结构表
      - - 反论点：收入不透明
        - CB Insights 和 Tracxn 没有给出可用收入或倍数
        - 按客户分群拆分的 ARR、NRR、毛利率和待履约订单
      - - 反论点：算力和大厂压力
        - 反向来源指出算力昂贵，以及 Google / OpenAI 式竞争
        - Trainium 基准测试、可持续云价格和可防守的准确率数据
    notes: 每个论点都配有可证伪的尽调项，而不是被当成永久结论。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV014
      - CV017
