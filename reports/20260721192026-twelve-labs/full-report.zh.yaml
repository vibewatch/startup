        title: 格局：直接对手、巨头、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              Twelve Labs 所在的视频 AI 格局拥挤但碎片化。最接近的直接对手不是数字人或文生视频厂商，而是
              Coactive、Hive、Reka、Memories.ai、Vidrovr，以及试图把非结构化视频变成可搜索、可查询、可治理数据的内部团队。大型科技巨头很重要，因为 Google Cloud Video
              Intelligence、Gemini、Azure AI Video Indexer、Amazon Rekognition、OpenAI 和 Meta
              能把视频理解打包进既有采购和开发者入口。Runway、Synthesia、HeyGen 和 Pika 等相邻生成工具争夺 AI
              视频预算和买方注意力，但它们的公开产品界面以创作为中心，而不是企业档案理解。AssemblyAI 和 Deepgram 等音频优先厂商，在转录、摘要或语音智能足够时就是替代方案。开源的
              VideoLLaMA、InternVideo 和 Video-ChatGPT 让复杂买方仍可相信内部自建，而人工打标仍是受监管或低量工作流的后备选项。
