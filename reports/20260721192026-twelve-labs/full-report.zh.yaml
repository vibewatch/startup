  - id: TM004
    title: 增长驱动因素与约束因素表
    columns:
      - 驱动因素 / 约束因素
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 视频体量与档案搜索痛点
        - 驱动因素
        - 当前
        - 媒体、企业和安防团队靠人工打标、抽帧越来越不划算
        - 量化每个工作流节省的工时，并与 API 和计算成本对比
      - - AI 驱动的检测、向量嵌入与推理
        - 驱动因素
        - 当前 / 近期
        - 支持搜索、自动审核、告警、结构化输出和语料库级推理；这些过去只靠元数据很难跑通
        - 在客户自有视频上基准测试准确率、延迟和检索质量
      - - 智慧城市、监控与边缘计算扩张
        - 驱动因素
        - 当前 / 中期
        - 扩大原始摄像头 / 视频数据量，也抬高实时或事后分析需求
        - 把隐私安全的分析用例与受限生物识别监控拆开
      - - 多模态与生成式 AI 预算扩张
        - 驱动因素
        - 当前 / 中期
        - AI 平台团队会转向具备视频能力的模型，而不是只用文本工具
        - 确认视频预算是新增、重新分配，还是实验性试点
      - - 企业视频云端现代化
        - 驱动因素
        - 当前
        - 支撑 API 采用，并接入内容管理和协作平台
        - 梳理集成伙伴、数据驻留和企业安全要求
      - - EU AI Act 与生物识别限制
        - 约束因素
        - 2025-2026 年实施
        - 限制 CCTV 抓取、生物识别、情绪识别和高风险用途，或抬高合规成本
        - 评估面向生物识别、执法、工作场所和 EU 部署的产品控制
      - - AI 项目失败与 ROI 怀疑
        - 约束因素
        - 当前
        - 许多 AI 项目因数据、工作流、基础设施和范围错配而失败，买方可能要求 demo 之外的证明
        - 收集试点转生产转化率、回本周期和可引用 ROI 证据
      - - 集成、数据隐私、误报与计算 / 存储成本
        - 约束因素
        - 当前
        - 即使用例有吸引力，部署进 VMS、MAM 和数据平台环境也会变慢
        - 尽调实施负担、误报率、数据留存控制，以及高视频工作负载下的毛利率
    notes: 驱动因素和约束因素刻意成对呈现，因为市场需求可以增长，但部署仍会卡在合规、集成和 ROI 关口。
