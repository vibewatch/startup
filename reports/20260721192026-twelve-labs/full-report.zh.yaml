  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险栈
        blocks:
          - type: paragraph
            body: >-
              法律风险不是泛泛的 AI 合规阴影，而是与公司的视频理解模态紧密绑定。Twelve Labs 的 AUP 已经禁止若干直接落入 EU AI Act 和隐私法危险区的用途，包括被禁止的 AI Act
              实践、未经授权的人脸或身体特征识别、从图像或视频推断敏感属性、虚假信息、监控，以及缺少监督的高后果决策。这种缓释有用，但本质上是合同安排：它不能证明每个客户都有同意、数据来源、保留计划或部署控制。EU AI
              Act 将远程生物识别、情绪识别和生物特征分类列为高风险；GDPR/EDPB 指引也让生物识别和个人数据模型复用处在严格的目的、合法基础和匿名化分析之下。在美国，BIPA 式损害赔偿和 Colorado AI
              Act 义务，为就业、准入、安全或其他重大场景下的视频部署提供了原告或监管抓手。版权诉讼又增加了单独的数据集来源风险：近期 AI 训练案件区分了转化性训练论点，与非法获取或保留盗版材料。因此，Twelve
              Labs 的尽调路径应从数据集物料清单、退出 / 删除流程、EU AI Act 角色分类、生物识别用途护栏和赔偿限制开始，而不是假设模型质量本身就能承载风险。
