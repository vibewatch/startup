  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议：继续研究 / 观察，在假设约 $1B 入场价位跟踪，不应仅凭公开记录买入。最强证据是 Twelve Labs 在 2026 年从高质量战略和财务投资人处完成大额 Series B
              轮，有差异化视频理解逻辑，并拿到可能影响推理经济性的 AWS 基础设施承诺。最弱证据是估值支撑：官方公告和已审阅报道没有披露投后估值，CB Insights 和 Tracxn
              的估值或收入字段仍被隐藏，已抓取公开来源也没有补齐 ARR、毛利率、净烧钱、客户集中或优先权条款。因此，最终立场对价格敏感，而不是否定公司。如果私下尽调证明企业 ARR 有规模、重复扩张跑得通、Trainium
              成本优势可持续，公司可以配得上溢价。没有这些证据时，公开证据支撑的是品类信念，而不是立刻按 $1B 承销。放到投委会语境，下一步不是对公司给出通过 /
              否决，而是把私下证据转成价格、持股和下行保护。一个优先权普通、使用量加速的干净轮次，比又一篇媒体报道更快改变建议。
