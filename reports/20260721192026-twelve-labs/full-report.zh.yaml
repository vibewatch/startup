      - number: '2.3'
        title: 买方、用户、付款方分层与采纳路径
        blocks:
          - type: paragraph
            body: >-
              经济买方随细分市场变化，但共同采纳路径是：某个工作流负责人有太多视频，集成团队必须连接档案或视频流，预算负责人需要可衡量的节省时间、搜索质量、合规改善或收入影响。在媒体与娱乐领域，买方通常是媒体运营、档案、产品或后期制作负责人；编辑、合规审核员、制片人和研究团队是用户。在安全与监控领域，买方是公共安全、安全运营或设施团队；分析员和调度团队使用系统；隐私
              / 法务团队可能阻断部署。体育队、联盟和广播商购买表现、战术、球探和球迷体验分析；广告和营销团队把视频智能用于内容分类、个性化和活动工作流。汽车买方是需要视觉感知和片段检索的 ADAS/autonomy
              工程与数据团队。这个买方图谱支持 API 优先，但更大规模部署仍需要数据治理、模型评估、采购和变更管理。
