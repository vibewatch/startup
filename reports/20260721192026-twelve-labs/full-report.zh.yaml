  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 替代方案
      - 类别
      - 公开规模或融资信号
      - 目标细分市场
      - 产品范围
      - 相对 Twelve Labs 的差异化
      - 局限 / 尽调问题
    rows:
      - - Twelve Labs
        - 视频原生基础模型 API
        - 2026 年 $100M Series B；公开 Developer 定价
        - 开发者、媒体、体育、广告、政府、企业视频档案
        - Marengo 搜索 / 向量嵌入，加 Pegasus 分析
        - 一个 API 覆盖深度时序视频检索与视频转文本
        - 需要私有胜率、实际企业定价和独立基准测试
      - - Google Gemini + Video Intelligence
        - 大科技多模态 + 传统 CV
        - Google Cloud 平台；token 和按分钟定价
        - 云开发者与企业工作负载
        - Gemini 视频理解 + Video Intelligence 标注
        - 采购触达强，多模态生态广
        - 传统 CV 和通用模型界面可能达不到视频原生检索效果
      - - OpenAI GPT-4o / Sora
        - 大科技多模态 + 视频生成
        - OpenAI API 生态；token 定价；Sora API 文档
        - 开发者、创作者、构建多模态应用的企业
        - 通用多模态推理和生成视频
        - 开发者心智强，多模态模型迭代很快
        - 没有公开证据证明其专用长档案语义视频搜索达到同等水平
      - - Microsoft Azure AI Video Indexer 服务
        - 云视频分析既有厂商
        - Azure 按分析预设和输入分钟定价
        - 企业媒体、合规、企业视频档案
        - 转写、主题、OCR、人脸、场景、标签
        - Azure 采购能力强，媒体工作流集成深
        - 对基础模型检索和向量嵌入的专精程度较低
      - - Amazon Rekognition Video
        - 云 CV / 审核既有厂商
        - AWS 按分钟定价；AWS 账户集成
        - 安防、审核、媒体分析、AWS 用户
        - 物体 / 人员 / 文本 / 活动检测和审核
        - AWS 分发、账单和数据重力
        - 传统识别服务；新客户使用流式视频能力受限
      - - Coactive
        - 直接视觉搜索同业
        - $30M Series B；企业 demo 驱动 GTM
        - 拥有图像 / 视频库的媒体、零售、平台
        - 无元数据多模态视觉搜索和激活
        - 直击人工元数据和视觉数据激活痛点
        - 定价和正面对比质量未公开
      - - Hive
        - 直接审核 / 内容 AI 同业
        - 用量定价；企业 / 视频特殊费率
        - 信任与安全、审核、内容平台
        - 跨模态审核、搜索、生成、识别
        - 审核分类体系强，内容安全工作流成熟
        - 对企业档案长视频推理的定位不够清晰
      - - Runway
        - 相邻生成式视频
        - 2026 年 $315M Series E；套餐从 $12/month 起
        - 创作者、工作室、广告、企业创意团队
        - 生成视频和世界模拟工具
        - 争夺 AI 视频预算和创意端心智
        - 不是直接的档案搜索或视频理解 API
      - - Synthesia / HeyGen / Pika
        - 相邻 AI 视频创作
        - Synthesia 从 $18/month 起；HeyGen 据报道 ARR 为 $200M；Pika 2.5 生成
        - 营销、培训、销售赋能、创作者团队
        - 数字人、本地化、生成式商务视频
        - 相邻预算池大，企业采用度高
        - 主要是创作，而不是理解既有视频
      - - Reka / Memories.ai 阵营
