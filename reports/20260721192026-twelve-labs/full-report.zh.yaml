companyProfile:
  summary: >-
    Twelve Labs (TwelveLabs) 是一家总部位于旧金山的视频智能公司，成立于 2021，专注构建视频理解基础模型。其平台通过 Marengo 模型家族（多模态视频嵌入与检索）和 Pegasus
    视频语言模型（视频转文本描述、摘要和结构化元数据）提供 Search、Analyze 和 Embed 工作流。公司通过自有 API、Amazon Bedrock 和 AWS Marketplace
    分发模型，服务媒体与娱乐、广告、体育、安全、政府和汽车等场景。July 2026，公司完成由 NEA 和 NAVER Ventures 共同领投的 $100M Series B 轮，累计融资约 $207M。
  foundedDate: '2021-03-31'
  founders:
    - name: Jae Lee
      role: 联合创始人兼 CEO
      background: 将公司起点追溯到 2021 与 Korean Cyber Command 几位密友的合作；多方来源均将其列为联合创始人兼 CEO。
      claimRefs:
        - CO005
        - CO006
    - name: Aiden Lee
      role: 联合创始人
      background: CB Insights 资料将其列入 Twelve Labs 创始人名单，与 Dave Chung、SJ Kim 和 Soyoung Lee 并列。
      claimRefs:
        - CO007
  foundingLocation: San Francisco, California, USA (with founding-team roots in Korea)
  headquarters: San Francisco, California, USA (additional operations in Seoul; New York and London expansion in 2026)
  productSummary: >-
    视频理解基础模型和 API——Marengo 3.0 用于多模态搜索和 512 维嵌入，Pegasus 1.5 用于 schema 优先的视频转文本和基于时间的元数据，另有 Embed API；通过自助 API、Amazon
    Bedrock 和 AWS Marketplace 销售。
  customerFocus: 需要搜索、分析大规模视频档案并让其进入业务流程的媒体与娱乐、广告、体育、安全 / 监控、政府和汽车企业及开发者。
  businessModel: 按用量变现 API（索引 / 推理）叠加企业计划，通过直销以及 AWS Marketplace / Amazon Bedrock 分发。
  stage: Series B
  fundingStatus: $100M Series B 轮于 July 1, 2026 宣布（NEA 和 NAVER Ventures 共同领投）；从种子轮、Series A（$50M，2024）到 Series B，累计融资约 $207M。
