  - id: FV003
    title: 估值 / 回报区间
    targetSlug: valuation-return-range
    type: range
    layout: standard
    summary: 在确切持股和稀释未知前，区间围绕假定 $1B 入场价展示投资测算结果。
    data:
      items:
        - label: 悲观退出企业价值
          low: 0.5
          high: 1
          unit: USD billions
          basis: Flat/down outcome if revenue or margin proof fails
        - label: 基准可支撑入场估值
          low: 0.6
          high: 1
          unit: USD billions
          basis: Track until private metrics justify upper end
        - label: 乐观退出企业价值
          low: 4
          high: 6
          unit: USD billions
          basis: Requires Synthesia/Runway-like category proof plus enterprise economics
        - label: 稀释前所需投资回报倍数
          low: 3
          high: 5
          unit: x gross MOIC
          basis: Venture target before preference and dilution haircut
    approximationNotes: 数值区间是为尽调框架设定的情景估计；公开来源未披露 Twelve Labs 的 ARR 或估值。
    claimRefs:
