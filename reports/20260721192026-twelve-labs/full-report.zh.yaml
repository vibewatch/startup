  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与现状
        blocks:
          - type: paragraph
            body: >-
              不能把 Twelve Labs 当作泛基础模型公司或摄像头 / VMS 硬件厂商来投资评估。其公开产品界面定义了更窄的任务：通过
              API、SDK、视频原生模型，以及在知识库上运行的智能体，让视频可搜索、可分析、可嵌入、可推理。因此，纳入的支出覆盖视频理解
              API、视频搜索与检索、视频转文本和摘要、多模态嵌入、语料库级推理智能体，以及建立在视频档案上的工作流自动化。相邻支出包括企业视频平台、媒体资产管理、视频监控分析、体育分析、广告内容分析和汽车感知。明确排除基础摄像头、显示器、存储设备、商品化视频会议、不处理视频的通用
              LLM 订阅，以及除作为现状替代之外的人工打标劳动力。这个边界很重要，因为公开市场页面常把软件、硬件、服务、监控和广义 AI 混在一起；本章因此保留多重视角，而不是强行给出一个 TAM 标题。
