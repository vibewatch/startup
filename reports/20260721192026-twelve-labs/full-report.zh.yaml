    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品模块与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Twelve Labs 更适合被理解为视频理解 API
              和平台，而不是通用视频生成工具。客户工作流从导入视频或把系统指向视频开始，随后选择模型模态，通过异步任务或分析端点处理资产，再在下游应用中使用搜索、结构化元数据、摘要、分类或合规审核。Marengo 3.0
              是检索和嵌入层；Pegasus 1.5 是生成式视频转文本和基于时间的元数据层。这个分工在商业上重要，因为买方可以从搜索和索引起步，再扩展到摘要、审核、切分或自动化工作流决策。公开证据支持开发者优先界面，包括
              REST/JSON API、Python 和 JavaScript SDK、GitHub 仓库、npm 包以及 AWS Bedrock 接入。主要产品缺口不是 API
              是否存在，而是私人客户能否在自己的视频库上反复获得精度、召回率、延迟、成本和人工审核结果。承保时，实际测试应看这些模块能否缩短真实客户任务，而不是迫使团队围绕脆弱的概念验证重建存储、元数据和审核员工作流。
