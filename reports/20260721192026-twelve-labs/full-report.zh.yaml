        title: 运营、安全与模型质量风险
        blocks:
          - type: paragraph
            body: >-
              对一家私营 AI 初创公司而言，Twelve Labs 公布了相对成熟的安全姿态：静态和传输加密、最小权限、审计日志、漏洞扫描、事件响应、供应商风险审查、AWS 基础设施和 SOC 2 Type 2
              公告。这些控制降低企业采购摩擦，但不等于视频认知的模型保证。最高运营风险在于，客户把搜索、切分、摘要或结构化抽取当作事实真相，用在误报、漏报或幻觉事件会产生法律或财务后果的工作流中。关于视频幻觉的学术工作指出，大型多模态模型可能给出看似可信但错误的答案；关于视觉提示注入的安全研究显示，图像
              / 视频输入可以携带对抗性指令。SOC 2 可以证明信息安全控制，但 AI 特定控制仍需要评估集、红队日志、提示 /
              模型变更管理、滥用监控、客户特定阈值和人在回路审核。在检查这些材料之前，尽管官方安全材料方向积极，剩余风险仍为中高。
