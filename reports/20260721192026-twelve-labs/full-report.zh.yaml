  - id: TV004
    title: 可比估值表
    targetSlug: comparable-valuation-table
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 适用性
      - 局限
    rows:
      - - Twelve Labs
        - 融资和披露指标
        - $100M Series B；累计融资 $207M-$210M；公开估值未披露
        - 直接标的和入场价锚点
        - 缺少 ARR、收入倍数和优先权条款
      - - Runway
        - 视频 AI 生成 / 世界模型
        - CB Insights：2026 年 2 月估值 $5.0B-$5.315B；2025 年收入 $90M
        - 专业视频 AI 估值上界可比对象
        - 生成工作流不同于视频理解 API
      - - Synthesia
        - 企业 AI 视频 SaaS
        - Sacra：2026 年 1 月投后 $4B；2025 年收入估计 $145.91M
        - 收入支撑最强的企业视频可比对象
        - 数字人 / 培训 SaaS 不同于搜索 / 推理基础设施
      - - Pika
        - 消费者 / 创作者 AI 视频
        - Sacra：2024 年估值 $470M；融资 $135M
        - 视频 AI 商品化和算力成本的下行可比对象
        - 消费者生成业务模式不同于企业 API
      - - Perplexity
        - AI 应用 / 搜索
        - CB Insights：2025 年 9 月估值 $20B；2025 年收入参照 $100M
        - 当使用量可见时，AI 应用可拿到极端溢价
        - 搜索应用，不是视频基础设施
      - - Mistral AI
        - 基础模型实验室
        - CB Insights：2025 年 9 月估值 $11.7B-$13.7B；2026 年收入参照 $400M
        - 界定基础模型溢价和战略稀缺性
        - 更宽的 LLM 平台，规模和资本需求不同
    notes: 本章抓取的估值可比私有 AI 公司样本清单；数值混合了公司表述和分析师 / 市场数据页面。
    enumerationScope:
      coverage: sample
      basis: >-
        Representative private AI and video-AI comparables fetched from analyst profiles and official funding pages in
        July 2026.
