      - number: '5.2'
        title: 架构、部署与技术依赖
        blocks:
          - type: paragraph
            body: >-
              可见架构有四层：客户视频和元数据输入；跨视觉、音频和转录信号的模态处理；通过 Marengo 嵌入 / 搜索和 Pegasus 分析执行模型；再通过
              API、SDK、Bedrock、合作伙伴面板或客户应用交付应用输出。Twelve Labs 没有公开完整训练栈，但来源显示其对超大规模云厂商和加速器基础设施有显著依赖。AWS 描述了 Bedrock
