      - number: '2.4'
        title: 增长驱动、采纳约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              增长逻辑很强，因为视频量、智能摄像头、边缘计算、云原生企业视频和多模态生成式 AI 都把组织推向自动化视频理解。Twelve Labs
              自身产品主张也匹配这种拉力：用文本或图像查询搜索片段、分析视频、生成嵌入，并跨整个知识库推理。约束逻辑同样重要。Polaris 提醒 VMS 集成复杂度、算力和存储需求、数据隐私以及误报。RAND 的 AI
              项目研究警告称，超过 80% 的 AI 项目失败；引用调查中只有 14% 的组织已完全准备好集成 AI，根因在问题定义、数据、基础设施、工作流匹配和技术可行性。EU AI Act 禁止或限制若干生物识别和
              CCTV 用途，NIST 强调 AI 风险管理，Stanford 记录了加速中的监管和事故。最大尽调缺口不是视频 AI 是否在增长，而是 Twelve Labs
              在试点、治理审查和集成工作之后，能从这些重叠池中盈利捕获多少。
