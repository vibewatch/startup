              毛利率。Twelve Labs 有两个缓释因素。第一，定价页披露的用量单位足够细，可以让重度用户为重度工作负载付费。第二，如果 Trainium 优化和 SageMaker 韧性降低训练与服务成本，Amazon
              关系可能改善基础设施经济性。两点都不能证明利润率质量。缺失的尽调材料是按产品线分列、带日期的成本台账：每索引分钟成本、每 Pegasus 分钟成本、缓存命中率、AWS
              额度和承诺支出条款、客户支持负担，以及按企业队列划分的利润率。在这些数据到来之前，标价应被视为变现框架，而不是有吸引力毛利率的证明。
