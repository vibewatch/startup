        title: 情景与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              因此，决策框架是有条件的。乐观情景需要证明 Twelve Labs
              不只是有前景的模型供应商，而是生产级视频智能层，能撬动扩张中的企业预算、强留存和可持续单元经济。基准情景假设公司仍有战略重要性，但私下可验证数据仍薄，投资人应守住准入、尽调权和价格纪律，而不是追逐新闻标题里的高估值。悲观情景假设
              ARR 仍处早期，毛利率被视频推理压缩，大型科技公司竞争或客户集中限制退出选择。最高价值尽调不是再做一份通用市场扫描，而是向数据室索取
