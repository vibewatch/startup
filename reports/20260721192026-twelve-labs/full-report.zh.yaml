        - 偏高 / 未验证
        - 可比公司体现溢价，但 Twelve Labs 缺少公开收入证据
        - 入场必须绑定指标
      - - 决策触发
        - 只有 ARR、利润率、留存和条款过线，才转向买入
        - 尽调要求明确且可衡量
        - 维持关系，并谈判信息权
    notes: 该建议对价格敏感；抓取到的公开来源没有独立披露推定 $1B 背景。
