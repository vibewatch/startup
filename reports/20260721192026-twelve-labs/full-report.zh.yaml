              Series B 同时创造了现金跑道和集中度。多篇报道称 Twelve Labs 在 2026 融资 $100 million，由 NAVER Ventures 和 NEA 共同领投，Amazon
              参与；Edaily 报道累计融资超过 $207 million，而 AWS 被描述为首选云供应商，未来模型将率先通过 AWS 发布，并在 Trainium 上优化。这在商业上可能很强，因为 AWS 可以通过
              Bedrock 分发模型并承托算力规模，但它也让产品路线图、单位经济模型、发布顺序和买方感知都围绕单一云合作伙伴的芯片战略集中。公司也有一段反向平衡的 NVIDIA 历史：早期 NVIDIA
              投资验证了技术雄心，但也凸显其暴露在 GPU 与 Trainium
              基础设施竞赛之中。财务风险是资本强度，而不是即时偿付能力：视频基础模型需要大量训练和推理预算，而公开收入、毛利率、用量集中度和承诺云支出均未披露。执行风险同样具体。Jae Lee 是可见的创始人
              CEO，融资叙事大量引用其投资逻辑，公司还在 San Francisco、Seoul、New York、London、开发者 API、Bedrock 分发和 Rodeo
              等应用产品之间扩张。这样的广度带来关键人、招聘、产品聚焦和云成本风险，应设置明确的终止标准。
