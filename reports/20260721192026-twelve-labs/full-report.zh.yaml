      - number: '8.2'
        title: 可比公司支撑与边界
        blocks:
          - type: paragraph
            body: >-
              可比公司给出很宽估值区间，但不能简单套读。Runway、Synthesia、Pika、Perplexity 和 Mistral 显示，只要投资人认为 AI
              公司有品类领导地位，仍会支付高额溢价；但证据分成两类：有收入支撑的企业软件，和前沿级资本叙事。Synthesia 是最干净的企业视频可比项，因为 Sacra 报告其 ARR 可观、投后估值 $4B；Runway
              是规模更大的视频 AI 创作 / 世界模型可比项；Pika 是更小的消费创作可比项，其被引用的风险直接映射到 Twelve Labs 的下行；Perplexity 和 Mistral
              则说明，一旦投资人相信平台迁移正在发生，基础模型溢价可以走到多极端。Twelve Labs 卡在这些类别之间：它有基础模型叙事和战略投资人，但公开来源没有给出收入证据，无法把可比组合转成有把握的倍数。
