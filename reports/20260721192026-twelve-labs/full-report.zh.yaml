      - number: '8.3'
        title: 下行、稀释与市场风险
        blocks:
          - type: paragraph
            body: >-
              反向逻辑不是 Twelve Labs 没有真实市场，而是 2026 年 AI 融资行情可能在收入质量可见前就为叙事付太多钱。市场来源描述了创纪录 AI 融资、资本极度集中、交易数量收缩、流动性选择性释放和显著
              AI 估值溢价。这些条件解释了 Twelve Labs 为什么能募到战略轮，也让入场纪律更重要。已报道累计融资超过
              $200M，确实可能带来优先权和期权池悬挂，但公开记录没有披露清算条款或所有权。Companies House 文件确认了英国实体，却不能证明经营收入或资本结构深度。AWS
              战略背书若能降低成本并改善分销，就是护城河；若经济账靠云信用额度驱动、非排他，或不如云厂商原生视频产品，也会变成依赖风险。同一组证据也要求辛迪加流程有纪律：只有当优先权瀑布、云义务和客户经济性被绑定到可衡量下行触发器后，才为定价配额预留资本。
