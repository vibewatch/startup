company:
  name: Twelve Labs
chapter:
  number: 1
  title: Company Overview
  summary: TwelveLabs is a San Francisco-headquartered video-intelligence company founded in 2021, led by co-founder and CEO
    Jae Lee, and newly funded by a $100M July 2026 Series B. The overview is strongest on identity, product stack, locations,
    funding, and strategic partnerships, while valuation, revenue/ARR, cap-table ownership, and complete governance remain
    explicit diligence gaps.
sections:
- id: identity-and-product
  title: Identity, operating footprint, and product model
  body: 'TwelveLabs should be treated as a San Francisco-headquartered video-intelligence foundation-model company rather
    than a generic media-search vendor. The best current source set says the company enables machines to perceive, understand,
    and reason about video through an architecture that unifies perception, knowledge, and reasoning. Its product surface
    is concrete: Search and Embed are anchored in Marengo, while Analyze and structured video-to-text workflows are anchored
    in Pegasus. The company also exposes routes through its own API, AWS Marketplace, and Amazon Bedrock. Geographic evidence
    is unusually fresh because the careers page lists San Francisco, Seoul, New York, London, and Pangyo offices, while the
    Series B wire says headquarters are in San Francisco with operations in Seoul, New York, Los Angeles, and London. That
    gives later chapters a usable identity baseline, while still requiring caution around exact office maturity and role distribution.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO009
  - CO010
  - CO011
  - CO014
  - CO032
  - CO033
  - CO041
