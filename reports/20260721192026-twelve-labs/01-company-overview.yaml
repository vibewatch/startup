- id: open-metrics-and-adverse-signals
  title: Open metrics, adverse signals, and diligence gaps
  body: 'The overview has one adverse source and several non-red-flag but material uncertainty points. First, funding databases
    are not synchronized: Tracxn, CB Insights, Digital Today, and the 2026 funding coverage converge around $207 million or
    more after the Series B, while the fetched Crunchbase snapshot still showed $107.1 million and a last funding round before
    the July 2026 announcement. Second, no retained public source disclosed revenue, ARR, gross margin, burn, runway, exact
    paying-customer count, valuation, cap-table ownership, or detailed board rights. Third, the partnership story introduces
    concentration questions because AWS is both investor-adjacent and preferred cloud under a multiyear Trainium commitment.
    Fourth, no fetched source surfaced a lawsuit, sanction, or enforcement action; this is a negative finding, not proof of
    absence. Later chapters should therefore use this overview as a verified identity and funding baseline, while keeping
    valuation and private operating metrics out of cover facts until management or a reliable source supplies them.'
