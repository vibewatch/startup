- id: capital-and-stakeholders
  title: Capital formation and stakeholder map
  body: 'The financing record is strong but not perfectly reconciled across public databases. The cleanest current event is
    the July 1, 2026 $100 million Series B, co-led by NEA and NAVER Ventures with Amazon, Radical Ventures, Korea Investment
    Partners, Index Ventures, Quadrille Capital, and Red Bull Ventures participating. Earlier financing includes the 2024
    $50 million Series A co-led by NEA and NVIDIA’s NVentures, a December 2022 $12 million seed extension led by Radical Ventures,
    and a 2022 $5 million seed led by Index Ventures. Current market-data sources support roughly $207 million to $207.1 million
    raised, but Crunchbase lagged at $107.1 million in the fetched snapshot. The stakeholder implication is important: TwelveLabs
    combines classic venture sponsorship, Korean strategic links, Amazon/AWS infrastructure distribution, and NVIDIA compute
    validation. The unresolved items are valuation, ownership, board rights, and any secondary components.'
  claimRefs:
