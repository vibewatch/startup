  - FO003
- id: leadership-and-governance
  title: Founders, leadership bench, and governance visibility
  body: 'The leadership picture is founder-led and Jae-centric. Multiple independent and partner sources identify Jae Lee
    as co-founder and CEO; NEA’s interview is especially useful because Lee connects the origin story to 2021 work with four
    close friends from Korean Cyber Command. CB Insights supplies the broadest founder enumeration, naming Aiden Lee, Dave
    Chung, Jae Lee, SJ Kim, and Soyoung Lee, but it does not give role detail for each founder. Public governance evidence
    is therefore adequate for an overview but not enough for a board-control assessment. The company publishes an advisor
    bench including Fei-Fei Li, Silvio Savarese, Jeffrey Katzenberg, Alex Wang, Lukas Biewald, Nicolas Dessaigne, and Jay
    Simons, and WEF adds Jae’s Korea Foundation Model Association board role. The main diligence risk is key-person dependence:
    fundraising, investor quotes, and product narrative consistently route through Jae Lee.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO037
  - CO038
  - CO039
  - CO043
  - CO046
  tableRefs:
