- id: milestones-scale-and-partnerships
  title: Milestones, product maturity, and scale signals
  body: 'The milestone sequence shows a company moving from API-enabled video search toward a larger video cognition stack.
    In 2022, the public story was contextual video search: a seed-backed product that could find precise moments inside video
    rather than metadata around files. By the 2024 Series A, the company was announcing Marengo 2.6, Pegasus-1 beta, an Embeddings
    API, 30,000 API users, and plans to hire aggressively. By the current run, sources describe Marengo 3.0 as the embedding
    model behind Search and Embed, Pegasus 1.5 as a structured time-based metadata engine, and Rodeo as an application-layer
    step. The partnership milestones matter as much as the product milestones. AWS is now preferred cloud with Trainium optimization
    and model-first-launch commitments; NVIDIA remains a GPU acceleration and strategic financing signal. Reported customer
    proof includes MLSE, AMC Global Media, UNICEF, creators, sports franchises, and Hollywood studios, but current paying-customer
    count is not public.'
