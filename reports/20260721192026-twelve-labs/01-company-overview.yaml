  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private metrics
    missingEvidence: Audited or management-provided revenue, ARR, gross margin, burn, runway, and paying-customer count by
      segment.
    whyItMatters: These metrics determine whether the company is a research-led platform with early traction or a scaled enterprise
      software business.
    diligencePath: Request a management KPI pack, cohort exports, cloud spend, bookings bridge, and customer concentration
      schedule.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Primary financing terms or a reliable independent article disclosing post-money valuation and share class
      details for the Series B.
    whyItMatters: Valuation is central to the investment stance and cannot be inferred from round size or investor quality.
    diligencePath: Ask the company or lead investors for the Series B term sheet, capitalization table, and any secondary/tender
      allocation.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: Leadership and founder table coverage
    missingEvidence: Complete current executive roster, board members, observer rights, and founder operating roles.
    whyItMatters: The public record supports founder-led identity but not a complete governance or succession-risk assessment.
    diligencePath: Request an org chart, board deck, investor-rights schedule, and management biographies from the company.
    relatedQuestionRefs:
    - QO005
    - QO006
    - QO007
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: minor
    topic: funding conflict
    missingEvidence: Reconciled funding ledger that explains the difference between current $207M+ sources and the stale Crunchbase
      $107.1M profile.
    whyItMatters: Later chapters need one canonical capital figure and should not mix stale and current totals.
    diligencePath: Triangulate with PitchBook, company cap table, investor confirmations, and updated Crunchbase/Tracxn exports.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
    - TO004
