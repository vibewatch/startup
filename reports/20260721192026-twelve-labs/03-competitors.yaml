  title: Competitors
  summary: Twelve Labs is differentiated by video-native search and analysis, but the competitive set spans hyperscaler video
    APIs, general multimodal models, direct visual-search peers, adjacent generation vendors, audio substitutes, open-source/internal
    build, and manual tagging. The moat appears real but medium-durable until private win/loss data and independent benchmarks
    prove buyers cannot multi-home around it.
sections:
- id: landscape-and-substitutes
  title: 'Landscape: direct peers, incumbents, adjacencies, and substitutes'
  body: Twelve Labs competes in a crowded but fragmented video-AI landscape. The closest direct peers are not the avatar or
    text-to-video vendors; they are Coactive, Hive, Reka, Memories.ai, Vidrovr, and internal teams trying to turn unstructured
    video into searchable, queryable, governed data. Big-tech incumbents matter because Google Cloud Video Intelligence, Gemini,
    Azure AI Video Indexer, Amazon Rekognition, OpenAI, and Meta can bundle video understanding into existing procurement
    and developer surfaces. Adjacent generators such as Runway, Synthesia, HeyGen, and Pika compete for AI-video budget and
    buyer attention, but their public product surfaces center creation rather than enterprise archive understanding. Audio-first
    providers like AssemblyAI and Deepgram are substitutes whenever transcripts, summaries, or voice intelligence are enough.
    Open-source VideoLLaMA, InternVideo, and Video-ChatGPT keep internal build credible for sophisticated buyers, while manual
    tagging remains the fallback in regulated or low-volume workflows.
