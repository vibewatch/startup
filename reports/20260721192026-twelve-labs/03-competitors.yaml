  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win/loss
    missingEvidence: Customer-level win/loss data against Google, AWS, Azure, OpenAI, Coactive, Hive, Reka, and internal-build
      alternatives.
    whyItMatters: Competitive durability depends on whether Twelve Labs wins production workloads, not only whether it has
      a differentiated public API.
    diligencePath: Request anonymized CRM opportunity exports, proof-of-concepts, renewal cohorts, and three customer reference
      calls focused on evaluated alternatives.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized enterprise committed-use pricing, discounts, minimums, and gross-margin impact versus list pricing.
    whyItMatters: Published pricing does not reveal whether Twelve Labs can defend premium economics against cloud bundles
      or specialist peers.
    diligencePath: Review top ten contracts, usage curves, discount schedules, AWS/partner pass-through economics, and expansion-renewal
      price changes.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: benchmarks
    missingEvidence: Independent head-to-head benchmarks for Marengo 3.0 and Pegasus 1.5 against Gemini, OpenAI, Reka, and
      open-source video-language models on long-form retrieval and reasoning.
    whyItMatters: The moat claim is technical; without independent benchmarks, ordinal capability scores remain author estimates.
    diligencePath: Run a blind benchmark on customer-like long videos with fixed latency, recall, reasoning-quality, and dollar-per-hour
      metrics.
    relatedQuestionRefs:
    - QP028
    relatedTableRefs:
    - TP002
