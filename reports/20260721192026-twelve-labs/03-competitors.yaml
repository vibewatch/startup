- id: adverse-view-and-diligence-gaps
  title: 'Adverse view: commoditization, pricing pressure, and evidence gaps'
  body: 'The adverse case is that video understanding becomes a feature of broader multimodal platforms before Twelve Labs
    locks in a durable application layer. Mixpeek directly attacks cost predictability and storage/control trade-offs. Google,
    Microsoft, and AWS can underprice or bundle classic video analytics, while OpenAI and Meta can keep improving general
    multimodal models that absorb more video-reasoning tasks. Open-source projects preserve a credible internal-build threat
    for teams with infrastructure talent. The resulting diligence agenda is specific: obtain win/loss data against cloud incumbents
    and direct peers, compare realized committed-use pricing rather than list pricing, and test independent benchmarks for
    Marengo 3.0 and Pegasus 1.5 against Gemini, OpenAI, Reka, and open-source systems. Without those private or benchmarked
    inputs, the chapter can support a nuanced competitive view but cannot prove a durable pricing umbrella. A further nuance
    is timing: Twelve Labs may enjoy a specialist lead in production video retrieval today, while the largest platforms can
    wait for the category to mature and then bundle adequate capability into existing AI suites. That creates a window-of-execution
    question rather than a binary winner-take-all market. Contract evidence should decide.'
