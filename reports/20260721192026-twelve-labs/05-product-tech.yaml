  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: soc2-gap
      missingEvidence: Current SOC 2 Type 2 report, subprocessor list, data-retention schedule, and customer data/model-training terms.
      whyItMatters: >-
        Sensitive video archives create privacy, confidentiality, and customer-data-use risk that cannot be underwritten
        from a blog post alone.
      diligencePath: Request the trust packet under NDA and map controls to customer video data flows and deployment regions.
      relatedQuestionRefs:
        - QE014
      relatedTableRefs:
        - TE004
    - type: missing-source
      severity: material
      topic: reliability-gap
      missingEvidence: >-
        Official Twelve Labs SLA, historical uptime export, incident postmortems, rate-limit policy, and support
        commitments.
      whyItMatters: >-
        Search and moderation workflows become operational dependencies once customers route production video through
        the API.
      diligencePath: >-
        Ask for customer contract SLA terms, 12-month incident history, and quota/latency commitments by deployment
        path.
      relatedQuestionRefs:
        - QE017
      relatedTableRefs:
        - TE004
    - type: missing-source
      severity: material
      topic: benchmark-gap
      missingEvidence: >-
        Independent or customer-reproducible benchmark pack comparing Marengo 3.0 and Pegasus 1.5 against alternatives
        on the buyer video corpus.
      whyItMatters: >-
        Official benchmark claims may not transfer to domain-specific archives, compliance taxonomies, languages, or
        low-quality video.
      diligencePath: >-
        Run a blinded evaluation on representative customer clips with precision, recall, latency, cost, and
        reviewer-disagreement metrics.
      relatedQuestionRefs:
        - QE020
      relatedTableRefs:
        - TE001
        - TE002
    - type: private-evidence-only
      severity: minor
      topic: developer-signal
      missingEvidence: SDK download counts, issue resolution SLAs, API support tickets, and enterprise developer adoption cohorts.
      whyItMatters: Public GitHub and package pages prove availability but not depth of adoption or support quality.
      diligencePath: Request package analytics, support dashboards, and top developer integration references.
      relatedQuestionRefs:
        - QE022
