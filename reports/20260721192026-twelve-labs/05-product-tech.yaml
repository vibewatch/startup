  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow pain
      - Twelve Labs solution
      - Measurable benefit signal
      - Limitation
    rows:
      - - Semantic archive search
        - Manual tags and transcript search miss visual/audio context
        - Marengo Search API over visual, audio, and text modalities
        - Official benchmark and product claims indicate richer retrieval
        - Independent buyer-specific recall remains unverified
      - - Structured media metadata
        - Humans segment long video and enter metadata manually
        - Pegasus 1.5 time-based metadata extraction to JSON schemas
        - PRWeb and official posts describe timestamped outputs up to two hours
        - Requires validation on each domain schema
      - - Compliance review
        - Human reviewers watch large content libraries
        - Pegasus plus Mux workflow flags contextual compliance events
        - Official Mux post says it accelerates video review at scale
        - Human review remains needed for high-stakes decisions
      - - Embeddings for recommendations
        - Teams need searchable vectors from video assets
        - Marengo Embed API produces cross-modal embeddings
        - 512-dimension claim may reduce storage cost
        - No public customer-side vector-cost benchmark
      - - Developer prototyping
        - Teams need quick API access and examples
        - REST API, Python SDK, JavaScript SDK, developer hub
        - Docs show index/task examples and package installs
        - Support quality and SDK adoption metrics are private
    notes: Benefit column records public evidence signals, not guaranteed customer ROI.
