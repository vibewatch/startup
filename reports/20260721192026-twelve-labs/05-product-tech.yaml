  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - Control, certification, or quality issue
      - Status
      - Scope visible publicly
      - Gap
    rows:
      - - SOC 2 Type 2
        - Completed per company blog
        - Security/privacy commitment for the platform at audit timing
        - Need current report, auditor period, carved-out systems, and exceptions
      - - Privacy controls
        - Industry controls mapped by CSA source
        - Access controls, encryption, minimization, retention are relevant criteria
        - Need Twelve Labs-specific retention and subprocessor details
      - - Content moderation support
        - Supported as compliance workflow with Mux
        - Contextual video understanding across visual/audio/action/object signals
        - Need false-positive/false-negative rates and escalation policy
      - - Reliability/status
        - Third-party status page lists components and recent incident
        - AIWatch reported a resolved July 16, 2026 incident affecting some API features
        - Need official SLA, uptime history, and customer credits
      - - Hallucination/accuracy controls
        - Risk acknowledged by independent AI guidance
        - Human-in-the-loop verification is the control pattern
        - Need workflow-specific QA thresholds and reviewer tooling
    notes: >-
      Trust controls are public claims or industry control analogs; customer diligence should request private security
      and reliability artifacts.
