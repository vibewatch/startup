        - Multimodal embeddings for semantic video, audio, image, and text retrieval
        - Validate private precision/recall, latency, and cost on customer libraries
      - - Pegasus 1.5
        - Editors, compliance analysts, developers
        - Current generative video-to-text model with TBM release evidence
        - Schema-driven timestamped metadata and long-form video analysis
        - Obtain false-positive and hallucination rates by workflow
      - - Search API
        - Developers and archive operators
        - Public product/API surface
        - Natural-language and multimodal search over indexed video
        - Benchmark against buyer legacy search and hyperscaler alternatives
      - - Embed API
        - ML/data teams
        - Public API/model docs and AWS model docs
        - Portable embeddings for similarity search, clustering, and retrieval
        - Confirm vector-database cost and refresh strategy
      - - SDKs and developer hub
        - Application engineers
        - Python and JavaScript SDKs plus docs and repos
        - Reduces time to first integration
        - Audit version cadence, issue response, and SDK compatibility
      - - Bedrock deployment
        - AWS enterprise buyers
        - Partner-documented availability
        - Procurement and governance shortcut for AWS accounts
        - Confirm regional availability, quotas, pricing, and SLA ownership
    notes: >-
      Rows synthesize public product/docs/partner evidence; maturity is public-surface maturity, not private revenue or
      renewal proof.
