      - - Modality selection
        - Choose visual, audio, and transcription processing
        - Twelve Labs model options and search options
        - Wrong modality selection can increase cost or miss signal
      - - Marengo embedding layer
        - Convert multimodal content into searchable vectors
        - Twelve Labs model runtime and vector/index infrastructure
        - Official benchmarks need buyer-specific reproduction
      - - Pegasus analysis layer
        - Generate summaries, answers, segmentation, and structured metadata
        - Model quality, prompt/schema design, and long-context handling
        - Hallucination and schema drift require review controls
      - - AWS / Bedrock pathway
        - Enterprise procurement and managed inference path
        - Amazon Bedrock, SageMaker HyperPod, MediaConvert, S3
        - Cloud outage, region, quota, or economics can constrain adoption
      - - NVIDIA acceleration
        - GPU-enabled training/inference performance path
        - NVIDIA GPU software and infrastructure
        - Accelerator availability and cost remain external dependencies
