      - number: '1.3'
        title: 融资历史、投资人组合与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Eve 的资本形成有官方和第三方证据支撑。公司于 2025 年 1 月宣布完成由 Andreessen Horowitz 领投、Lightspeed 和 Menlo Ventures 参投的 $47
              million Series A，八个月后又完成由 Spark Capital 领投、Andreessen Horowitz、Lightspeed 和 Menlo 继续参与的 $103 million
              Series B，估值超过 $1 billion。仅这两轮就意味着自 2025 年 1 月以来已披露融资至少 $150
              million，也把公司明确放在后期私营公司位置，而不是早期实验性法律科技。投资人评论也解释了资金用途：Spark、Lightspeed 和 Eve 管理层都把公司定位为建设「AI-native
              law」新类别，资金用于更深入的产品开发、转型服务、onboarding，以及更广的案件生命周期覆盖。公开档案仍未回答的问题是：Series B
              后治理如何变化，是否涉及老股交易，以及投资人组合与创始人之间的持股如何分布。
