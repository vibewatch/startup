        - 只有模块被广泛采用，而不只是发布，广度才会带来粘性
        - 要求提供模块级 DAU/WAU 和按队列划分的渗透率
      - - 律所数量规模
        - 公开来源显示，2026 年多个渠道上的叙事从 500+ 家上升到 1200+ 家
        - 活跃 logo、留存 logo，以及按模块划分的付费律所
        - 规模质量比标题 logo 数更重要
        - 要求提供活跃客户数、GRR/NRR，以及付费与试点拆分
      - - 产品结果
        - 案例研究显示真实使用、笔录触发和法庭支持
        - 大多数生产率和和解提升指标
        - ROI 声明会推动估值和切换成本叙事
        - 要求提供前后对比队列、基线和可独立审阅的案件样本
      - - 验证质量
        - 内联引用和人工审阅控制是真实产品概念
        - 公开基准化的幻觉率、引用质量和批准通过率
        - 法庭风险取决于控制的实际表现，而不是 UI 声明
        - 要求提供评估包、抽样方法和事后 RCA 流程
      - - 集成和数据可携带性
        - Clio 同步和 Atlas 意图已确认
        - 支持系统广度、导出完整性和 API 成熟度
        - 操作系统级定位取决于真实互操作性
        - 要求提供 API 文档、伙伴名单和导出 / 导入测试数据
      - - 安全 / 合规
        - 公开声明覆盖 SOC 2、HIPAA、AES-256、隔离和零保留
        - 认证范围、已测试控制和事件历史
        - 买方需要控制细节，而不只是标签
        - 要求提供信任中心材料、最新报告日期和安全架构审阅
      - - 部署速度
        - 公司称律所可以在 90 天或更短时间内转为 AI-native
        - 上线时间中位数、失败实施和服务负担
        - 快速部署是销售叙事的一部分，也影响真实切换成本
        - 要求提供入职漏斗指标和实施人员配置模型
