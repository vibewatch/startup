  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景，以及 2025 年 9 月轮次实际披露了什么
        blocks:
          - type: paragraph
            body: >-
              公开记录里最干净的事实很简单：Eve 2025 年 9 月 Series B 融资 $103M，投后估值超过 $1B。Eve 在自己的融资文章和分发的新闻稿中重复了这个数字，LawNext 和
              Artificial Lawyer 的独立法律科技报道也呼应了同一标题。但对估值来说，重要的不只是轮次规模，而是这个价格落在怎样的规模点上。Series B 公告前后，Eve 公开称八个月内新增超过 350
              家律所、客户律所超过 450 家、每年处理超过 200,000 个法律案件，并帮助律所追回超过 $3.5B 的和解金与判决款。这些都是有意义的牵引力标记，但它们不是收入披露。

              与 Eve 自己 2025 年 1 月 Series A 的对比很有用，因为它显示叙事加速得多快。Series A 时，公司宣布 $47M 融资，并称超过 100 家律所采用了产品，同时声称收入同比增长
              500%。到 2026 年 6 月运行日期，Eve 首页已变成更大的 1,200+ 家律所标题，以及覆盖获客承接、诉前、诉讼、AI-ready 数据和律所级智能的更广「原告法 AI
              操作系统」叙事。这表明轮后增长可能显著，但也引入一个尽调问题：公开记录从未解释 450 家律所和 1,200+ 家律所是否按同一口径定义、是否全是付费客户，或其下的平均合同价值是多少。

              缺失的收入桥，是核心估值问题。对一家正在快速成为原告律所记录系统和行动层的公司而言，$1B+ 投后标记可以成立。但公开证据仍没有披露 ARR、NRR、毛利率或 Series B
              背后的优先权结构。因此，这个轮次应被理解为投资人对 Eve 品类潜力的强信号，而不是一个已被公开市场式收入证据验证的价格。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
