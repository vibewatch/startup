  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流深度现在从 intake 延伸到诉讼执行
        blocks:
          - type: paragraph
            body: >-
              Eve 的公开产品形态已不再只是起草助手。2026 年 6 月官网、2026 年 1 月 Eve 2.0 发布材料，以及 2026 年 6 月 EveOS 发布报道，都描述了一套工作流栈：从多语言 intake
              开始，进入诉前时间线和索赔起草，再延伸到 discovery、证词审阅、交叉询问支持和全案件审计。这种宽度很重要，因为原告律所不会孤立购买点工具；运营痛点在
              intake、记录审阅、起草、客户沟通和诉讼准备之间的交接。基于这里审阅的证据，Eve 试图占据这些交接点，而不是一次只帮忙处理一份文档。


              模块级证据最强的是 intake、医疗概览和起草。Eve 称其 intake 层 24/7 接听电话和邮件，在通话中签下合格客户，并支持 28 种语言；intake GA 文章补充了 40+ 家 beta
              律所、线索评分、结构化摘要和 CMS 集成。医疗概览页面在法律 AI 营销中异常具体：它列明时间线、不利事实、ICD 代码、损害赔偿台账、回链到记录页面的超链接、手写记录 OCR，以及 15–20
              分钟生成时间。客户案例随后把这些模块绑定到真实工作流：Laurel 的 demand agent 从证词自动触发，并把人工接触时间降到数分钟；Hershey Law 则描述从 intake 到庭审支持都使用
              Eve。这足以得出结论：工作流深度真实存在，尽管大多数量化结果仍来自公司可控或赞助来源。
