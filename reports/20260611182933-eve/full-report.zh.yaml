      - number: '2.4'
        title: 采用约束、监管与信任要求
        blocks:
          - type: paragraph
            body: >-
              原告侧工作流不同于 BigLaw 或被告侧，不仅因为案件不同，也因为商业模式和风险模型不同。Thomson Reuters
              指出，大型律所历史上负责抗辩原告胜诉收费案件，而规模通常较小的原告律所在案件成功时获得上行收益。在胜诉收费经济下，更快的
              intake、更干净的案件筛选、更好的医疗综合、更快的索赔生产和更紧的和解处理，都会直接进入现金转化。监管进一步强化了这种运营特殊性。ABA Formal Opinion 512 称，律师使用生成式 AI
              时仍负有胜任、保密、沟通、监督、坦诚和合理收费义务。Rule 1.5 要求书面胜诉收费机制，并在回收款结束时提供书面汇款说明。Rule 1.15 和 ABA
              信托账户记录规则要求客户资金隔离，并维护拨付记录。NYSBA 的 2026 年 guardrails 文章称，幻觉仍会导致制裁；Thomson Reuters 的伦理指南强调，律师仍必须核验引用，并把 AI
              当作助手，而不是自动律师。这使信任控制、来源可追溯、人工复核和达到和解级别的运营纪律，成为原告律所的核心购买条件。
