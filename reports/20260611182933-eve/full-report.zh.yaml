        - 索取模块附加率、转化提升，以及任何用量计费组成
      - - Agents / EveOS 扩展
        - 客户在同一平台内增加起草、审计、分析和其他 AI workers
        - 按律所 / 工作流 / 用户
        - 已上线；公开叙事强调扩展，但无公开价格
        - 如果模块层层叠加进现有账户，具备很强 NRR 杠杆潜力
        - 索取按模块划分的收入结构，以及来自现有账户的扩展 ARR
