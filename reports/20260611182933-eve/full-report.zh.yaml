      - number: '8.4'
        title: 正向论点、反向论点与上行 / 下行情景
        blocks:
          - type: paragraph
            body: >-
              Eve 的建设性论点是连贯的。原告法不是玩具楔子。PI 和更广的原告工作流宇宙足够大、运营上足够重复、经济上也足够敏感，因此会奖励更好的获客承接、起草和和解执行。Eve 的公开故事也符合成长投资人想在垂直 AI
              赢家身上看到的东西：logo 快速增长、广泛工作流覆盖，以及成为操作系统而不是点状解决方案的野心。如果管理层能证明当前 1,200+ 家律所标题转化为真实付费 ARR、强留存和可扩展的轻服务部署模式，那么
              2025 年 9 月估值会开始像一笔激进但可理解的品类领导权押注。

              反向论点同样清楚。公开证据支持市场机会，但不支持价格。Clio 已披露轮次是在大得多的 ARR 规模上完成的。Intapp 的公开市场比率低得多。SaaS Capital 的基准说明 SaaS
              中位数环境仍然清醒，而不是亢奋。EvenUp 和 Harvey 说明 AI 稀缺溢价可以出现，但 Harvey 是泛化法律 AI 离群值，EvenUp 仍不披露绝对 ARR。因此，Eve
              处在一个尴尬估值区间：太贵，无法用公开法律软件可比公司证明；又不够透明，无法获得 Harvey 式免于传统纪律的待遇。

              于是只剩三个实用情景。牛市情景要求 Eve 把当前牵引力转化为类似 $250-300M 的退出 ARR，并拿到 12-14x 的高端退出定价，带来约 $3.0-4.2B 价值，相对 $1B
              标记产生体面的多倍回报。基础情景严苛得多：$120-160M 退出 ARR、7-9x 倍数，只产生约 $0.84-1.44B，几乎只是保护本金。熊市情景——$60-90M、4-6x——只产生
              $0.24-0.54B，并毁损价值。这种不对称意味着投资判断高度敏感于证据质量，而不只是公司质量。
            claimRefs:
              - CV044
              - CV045
              - CV046
              - CV047
              - CV048
