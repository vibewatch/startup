  - id: TP005
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重度
      - 缓释措施 / 尽调问题
    rows:
      - - 只做原告侧的定位让工作流适配和销售话术更锋利
        - EvenUp、Supio、CloudLex、CasePeer、LawPro 和 ProPlaintiff 也直接卖进 PI 工作流
        - 中
        - 验证 Eve 赢单更多靠广度、品牌，还是可衡量的案件结果
      - - 从线索接收到证据开示的广度支撑 operating-system 叙事
        - Harvey、CoCounsel、Lexis+ 和 Paxton 可能把起草和研究层商品化
        - 高
        - 按工作流衡量日活使用，而不只看 logo 数量
      - - 原告侧原生数据结构可能形成可防守飞轮
        - EvenUp 推广最大 PI 数据集，Supio 推广已验证输出和案件情报
        - 高
        - 索取专有数据优势、反馈循环和结果随时间改善的证据
      - - 可选 CMS 叠加降低采用摩擦
        - 同样的可选性会保留多归属，降低锁定
        - 高
        - 检查 Eve 能否成为主运营层，而不是生产力附加工具
      - - 资本和品类动能让 Eve 在企业式交易中具备相关性
        - EvenUp 披露融资规模更大，Harvey 在资本可得性上远超原告侧品类
        - 中
        - 对比同样融资充足的对手，审查招聘速度、服务产能和销售效率
      - - 既有案件管理厂商在 AI 创新上可能动作更慢
        - 它们已经掌握案件数据、线索接收流程、报表、支付和用户习惯
        - 高
        - 研究对 Litify、Filevine、CloudLex 和 CasePeer 的真实替换赢单率
      - - 买方信任可能偏向已验证、原告侧专用工作流，而非通用 copilots
        - Supio 直接在幻觉、集成和诉讼级验证上攻击 Eve
        - 高
        - 审查复杂诉讼案件中的质量控制、来源可追溯性和客户推荐
      - - 定价不透明保留灵活性
        - 也让 ROI 更难与 Clio、MyCase 和 PracticePanther 的透明套件价格对标
        - 中
        - 索取当前价格卡、实施费和按律所规模划分的回本基准
    notes: 核心耐久度问题在于，Eve 能否在既有厂商和通用 AI 抹平可见功能差距之前，把广度和原告侧专业化转成每日运营依赖。
