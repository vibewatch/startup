  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Clio（2024 年 F 轮）
        - 估值相对已披露 ARR
        - '>$200M ARR 对应 $3B 估值（<15x）'
        - vLex 抬升估值前，披露最好的私有法律软件轮次锚点
        - 广义法律工作流平台，不是原告原生 AI
      - - Clio（2025 年 G 轮 + vLex）
        - 估值相对已披露 ARR
        - $400M ARR 对应 $5B 估值（~12.5x）
        - 展示大 ARR 规模下，优质法律平台定价长什么样
        - 包含 vLex 交易背景和债务融资
      - - Intapp（上市，2026 年 6 月）
        - 市值相对年化收入
        - ~$584M 年化收入对应 $1.78B 市值（~3.0x）
        - 面向有法律敞口的受监管专业软件公开可比
        - 并非原告律所专用，且公开市场通常更苛刻
      - - Harvey（2026 年 3 月）
        - 估值相对已披露 ARR
        - $190M ARR 对应 $11B（~58x）
        - 仅可作为已标注的 AI 异常值上限，用于前沿稀缺定价
        - 通用法律 / 专业服务 AI，不是原告工作流
      - - EvenUp（2025 年 10 月）
        - 私有轮次 / 规模标记
        - $2B+ 估值；2,000+ 家律所；ARR 同比翻倍
        - 最接近的已披露原告 AI 估值可比，且有有意义的规模标记
        - 未披露绝对 ARR
      - - Supio（2025 年 4 月）
        - 私有轮次 / 增长标记
        - 累计融资 $91M；A 轮以来 ARR 增长 4x
        - 相关的原告 AI 可比，定位强调验证
        - 未公开估值或绝对 ARR
      - - Filevine（2025 年 9 月）
        - 私有规模 / 留存标记
        - $400M 融资；约 6,000 名客户；96% 总留存；120%+ NDR
        - 展示法律软件中既有工作流平台的规模和留存质量
        - 无公开估值倍数
      - - Litify（2023 + 当前规模）
        - 私有规模 / 所有权标记
