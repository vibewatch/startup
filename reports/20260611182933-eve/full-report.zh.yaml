      - number: '5.3'
        title: 验证控制可见，但公开档案没有消除模型风险担忧
        blocks:
          - type: paragraph
            body: >-
              Eve 在营销中对其验证姿态表达得异常明确。医疗概览页面称，每个数据点都回链到来源文档和页码，直接引文与 AI 摘要做视觉区隔。Working With Eve 又补充了内联来源、一键验证和 AI
              验证框架等说法；安全页面则强调隔离、提示和输出不用于基础模型训练的 zero-retention 处理、年度审计、HIPAA 合规和 SOC 2 Type
              II。这些控制方向上契合原告律所买方应该想要的东西：来源可追溯、人工批准，以及敏感工作流中的数据隔离。


              但公开证据也说明，应该把这些控制视为缓释措施，而不是证明。Eve
              的隐私政策描述了与服务提供商、分析伙伴和广告伙伴共享网站个人数据；这是营销网站行为，不是案卷处理，但仍显示公司有不同隐私表面，风险画像也不同。更重要的是，2026
              年反向来源直接挑战任何简单的「幻觉已解决」解读。LLRX 强调了一封 2026 年 3 月律师道歉信，其中称 Eve 培训强调防护和「Trust but
              Verify」，但一段不准确引用仍进入法院。该律师无法判断失败来自软件还是自己的工作流，而这正是重点：验证必须经受混乱真实使用，而不只是营销 demo。EDRM、LawAccounting 和
              TechNewsWorld 都显示了更严峻的 2026 年背景：制裁、逻辑层幻觉和影子 AI 治理失败，让原生可审计性和人工复核成为入场门槛，而不再只是差异化本身。
