  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支撑
      - 制衡因素
      - 什么会改变判断
    rows:
      - - 原告律所是真实的垂直软件市场
        - 135k+ PI 律师、约 400k 起年度索赔，以及不断上升的 AI 支出支撑品类规模
        - 大市场并不自动支撑异常高的入场倍数
        - 在有意义规模上证明可持续变现和留存
      - - Eve 似乎正走向操作系统级宽度
        - 当前产品叙事覆盖案源接收、诉前、诉讼、适配 AI 的数据和律所智能
        - 如果毛利率偏弱，产品宽度可能掩盖重服务交付
        - 披露毛利率和产品化部署指标
      - - 快速客户增长可以支撑溢价
        - 公开记录显示，客户从 A 轮时 100+ 家律所，增长到 B 轮时 450+ 家，以及当前首页的 1,200+ 家
        - 公开记录未界定付费与试点，也未说明按办公室还是律所计数
        - 提供付费客户、席位和 ACV 定义
      - - 法律 AI 存在稀缺价值
        - Harvey 和 EvenUp 显示，投资人愿意为品类领导者支付高价
        - Harvey 是 AI 异常值，Clio 在 ARR 高得多时拿到的倍数更低
        - 说明为什么 Eve 属于溢价集群，而不是中位数集群
      - - 平台上行仍可能很大
        - 原告原生工作流胜者可能支撑数十亿美元退出价值
        - 如果公开市场倍数保持克制，$1B 入场价下的基准退出算术偏弱
        - 证明通向 $250M+ ARR 和高留存的路径
    notes: 本表把公司投资逻辑质量与当前价格公允性拆开；两者可以同时成立。
