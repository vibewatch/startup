        title: 创始人、领导梯队与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始团队是 Eve 公开档案中最强的部分之一。公司官方页面确认 Jay Madheswaran、Matt Noe 和 David Zeng 为核心创始团队，投资人和访谈报道则给出连贯的创始人—市场匹配故事：Jay
              曾在 Facebook、Rubrik 和 Lightspeed Venture Partners 工作，Matt 与 David 被描述为技术深厚的 Rubrik 前员工。这一背景很重要，因为 Eve 把工作流
              AI 卖进一个高风险、重文档的法律垂直市场，产品质量和信任是战略差异点，而不是锦上添花。公开来源也支持 2020
              年的起点，尽管市场发布明显更晚。真正不透明的是治理。已审阅来源没有以足够精度披露董事会构成、投票控制、保护性条款，或创始人之外的内部管理梯队。因此，创始人匹配和产品可信度看起来很强，但机构治理和股权结构控制仍是尽调问题，而非已验证事实。
