  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 平台
      - 价格 / 单位 / 合同模式
      - 包含能力
      - 折扣 / 未知项
      - 竞争含义
    rows:
      - - Eve
        - 所审阅来源没有公开标价；销售主导或演示主导打法
        - 原告原生 AI 平台，覆盖线索受理、起草、证据开示和分析
        - 具体最低席位数、实施费和按使用量计费条款未披露
        - 定价不透明可能有利于企业级打包，但削弱了与更简单套件快速对标的能力
      - - EvenUp
        - 所审阅来源没有公开价格卡
        - 索赔情报、PLAAS、起草、沟通和生命周期支持
        - 具体到单案、席位或页数的经济模型未公开
        - 让 EvenUp 能按价值定价，但也让并排成本尽调更难做
      - - Supio
        - 公开材料承诺固定价格、无平台费、无页数限制；未发布价目卡
        - 线索接收、案件时间线、诉讼文书起草、案件经济模型和律所情报
        - 未披露公开席位档、最低承诺或服务成本
        - 信息对买方比 Eve 或 EvenUp 更友好，但采购仍需直接接洽
      - - Litify / Filevine / CloudLex / CasePeer
        - 审阅到的公开材料多为定制报价或演示驱动
        - 案件管理、线索接收、分析、文档，以及越来越多的 AI 功能
        - 公开比价空间有限，净价很可能取决于实施范围
        - 有利于既有厂商追加销售和打包，尤其在厂商已经掌握核心工作流时
      - - Clio
        - 起价 $49/user，大型律所采用定制报价
        - 线索接收、CRM、工作流自动化、计费、文档、客户门户和 Manage AI
        - 最终套餐随档位、附加组件和企业谈判而变
        - 适合希望看到入门价、需要广泛功能、但不强调原告侧专业化的小型律所
      - - MyCase
        - 年付 $50 到 $130/user/month，或按档位月付 $60 到 $150
        - 线索接收、工作流自动化、计费、律所管理和法律 AI 功能
        - 附加组件和实际律所组合仍会影响价格，但定价远比原告侧原生 AI 同行清晰
        - 对尚未准备更换系统的中小律所，试点测算更容易
      - - PracticePanther
        - 年付 $49 到 $89/user/month，月付价格更高，最高 $99
        - 线索表单、自定义工作流、日程、计费、会计和法律执业管理
        - 高级财务功能位于更高档位
        - 对预算敏感律所路径最透明，但原告侧原生差异化最弱
    notes: 这张表比较的是公开包装信号，不是谈判后的净价或特定工作负载 ROI。
