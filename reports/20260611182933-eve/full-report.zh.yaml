        - 既有工作流套件
        - 企业 / 定制报价软件，法律工作流覆盖面广
        - 高量 PI 律所，以及更广泛的律所和法务部门用户
        - 线索受理、事项管理、分析、沟通、支付、嵌入工作流的 AI
        - 最接近原告操作系统的既有厂商类比，尤其适合已经需要记录系统的律所
      - - Filevine
        - 既有工作流套件
        - 留存来源未公开量化规模；定价通过演示 / 定制打包推进
        - 诉讼、PI 和事项管理负载重的律所
        - AI 医疗时间线、证言情报、验证、文档、日程、支付
        - 既有厂商威胁强，因为即使没有 Eve 式营销语言，工作流深度也真实存在
      - - CloudLex / CasePeer
        - 原告专用既有套件
        - 所审阅公开材料中，定价大多为定制或演示主导
        - 原告精品律所和区域 PI 律所
        - 线索受理、事项管理、文档、医疗时间线、和解支持、报告、法律 AI
        - 前沿模型光环弱于 Eve，但嵌入式工作流和原告侧可信度强
      - - Harvey / CoCounsel / Lexis+ / Paxton
        - 通用法律 AI 替代品
        - Harvey 估值 $11B；其他产品通过大型法律科技平台或 SaaS 订阅销售
        - 覆盖律所和法律团队的广义法律买方
        - 研究、起草、文档分析、尽调、助手或智能体工作流
        - 在起草和研究层是强替代品，但不是原告原生的线索受理到和解系统
    notes: 本表区分直接原告原生 AI 同业、既有记录系统和更广义法律 AI 替代品；规模数值只使用公开披露数字。
