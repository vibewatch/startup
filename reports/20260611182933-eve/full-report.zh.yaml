      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个建设性但不完整的财务结论。Eve
              几乎可以确定通过直接合同，把经常性软件卖进一个真实且有预算的痛点。客户故事显示，intake、起草和诉讼准备中的劳动力杠杆很实在。赞助方质量强，已披露资本有分量，公司仍以成长阶段业务而非收缩中业务的方式招聘。这些事实支持一个判断：Eve
              正在成为面向原告律所的重要垂直软件平台。


              但这仍不同于说，该业务可以在公开信息基础上以 $1 billion-plus 估值承销。最大的缺失项，正是决定估值纪律的项目：绝对 ARR 或收入、已实现定价、ACV
              分布、毛利率、服务组合、CAC、回本周期、留存、客户集中度、现金、烧钱和债务。反向档案也重要。2026 年 3 月引用事件并不能证明系统性产品失败，但说明法律 AI 供应商可能需要持续投入
              QA、审计、人工复核和客户培训。综合看，Eve 像一个快速增长的合同型 SaaS 平台，拥有可信的类别领导地位和清晰 ROI
              叙事，但财务论证仍更多依赖增长信号和客户轶事，而不是已披露收入质量。正确的下一步不是新故事，而是一套指标包。
