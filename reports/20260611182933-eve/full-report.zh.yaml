  - id: FR001
    title: 风险热力图 — Eve 风险栈
    type: matrix
    layout: wide
    summary: 从发生可能性和影响程度看 Eve 最主要的法律、隐私、平台和竞争风险。
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
        - 严重影响
      rows:
        - label: 高可能性
          values:
            - ''
            - 客户变革管理摩擦
            - 既有玩家竞争挤压；复核人员过度依赖
            - ''
        - label: 中可能性
          values:
            - ''
            - 参考客户集中
            - 云 / CMS 依赖；保密处理失误
            - UPL / 监督边界漂移；客户工作中出现事实幻觉
        - label: 低可能性
          values:
            - ''
            - 正式 HIPAA 角色争议
            - 公开制裁点名 Eve 输出
            - 重大病历或特权信息泄露
    approximationNotes: 单元格是基于公开法律指引、产品声明和负面判例作出的定性判断，不是已披露事件概率。
    claimRefs:
