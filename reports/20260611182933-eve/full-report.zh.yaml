        title: 直接原告 AI 同行以及与 Eve 最接近的重叠
        blocks:
          - type: paragraph
            body: >-
              与 Eve 最直接重叠的是 EvenUp 和 Supio，而不是更广泛的法律 AI 领域。EvenUp 已远远超出索赔函，扩展为面向原告的专用 claims 平台，覆盖
              intake、治疗、索赔、谈判、discovery、庭审、管理层分析和沟通智能体。这让它不只是一个诉前点工具，但其公开叙事仍根植于 claims intelligence 和人身伤害规模。Supio 与 Eve
              当前方向的重叠更直接。它明确营销 intake、时间线、索赔函、诉讼起草、跨案件分析和律所 intelligence，同时强调大规模侵权和人工验证输出。换句话说，Supio
              想拥有的不只是一个工作流，而是围绕原告诉讼的记录、论证和洞察层。Darrow 相关但不同：它更上游，做法律风险暴露发现和案件发起，而不是日常运营一家原告律所。ProPlaintiff 和 LawPro.ai
              等更小进入者也说明，医疗时间线、索赔生成和智能体式案件支持已经催生更窄的挑战者。
