        - 确认所有权、董事会权利和任何投资人 pro rata 承诺
      - - 手上现金
        - null
        - 低
        - 没有当前现金时，无法精确估算 runway
        - 索取最新董事会现金余额和受限现金明细
      - - 月度 burn
        - null
        - 低
