      - number: '6.4'
        title: 扩张上行、持久性边界与商业约束
        blocks:
          - type: paragraph
            body: >-
              Eve 的扩张机会真实存在，因为它的楔子不是单一文档任务。官方材料和客户案例显示，产品可以从获客承接一路延伸到诉前、诉讼支持和律所智能；参考客户也覆盖高量 PI 律所和原告侧雇佣法律所。与既有 CMS
              共存也扩大了可触达买方，降低了替换压力；Eve 现在把自己定位为案件管理系统的补充，公开引用也提到 CRM 同步和即将上线的 Jove 集成。但耐久性证据仍明显薄于采用证据。公开来源没有披露
              NRR、GRR、流失、合同期限或头部客户集中度，可见评论样本也太小，不能替代续约证据。定价不透明是另一重拖累：买方仍需演示和报价，外部评测也指出集成、迁移、上线和培训成本都会真实影响预算。最后，法律 AI
              治理仍是准入门槛。纽约州律师协会指引和制裁评论都强调，任何规模化部署仍需要保密控制、监督、核验和费用敏感度。因此，Eve 最好的扩张飞轮是在成熟原告律所内部做顾问式
              land-and-expand；但这套打法也比轻量席位销售更慢、更贵，且更受治理约束。
