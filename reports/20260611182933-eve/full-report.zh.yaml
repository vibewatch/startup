      - number: '7.3'
        title: 隐私、HIPAA、特权与平台依赖
        blocks:
          - type: paragraph
            body: >-
              Eve 的公开材料反复强调，它为敏感的原告律所数据而建。首页称客户数据是私密、隔离且受特权保护的；安全页面称公司遵循 SOC 2 标准、每年做渗透测试、采用最小权限访问控制、每季度做访问审查，并把服务托管在
              AWS 和 Azure，AWS 数据库位于美国；医疗概览页面称 Eve 符合 HIPAA，医疗记录在传输和静态存储中加密，受保护健康信息不会用于训练 AI
              模型。这些都是有意义的信号，企业条款还通过要求安全保障、持有 E&O 和网络保险、定义客户数据所有权，加入了更正式的结构。但同一批文件也暴露了为什么隐私和平台风险仍然重要。Eve
              获得许可，可在提供服务所需范围内托管、复制、传输和展示客户数据；它可因安全风险或法院命令暂停服务；它不保证服务不中断或无错误；并明确称子处理方可能停止托管，且 Eve 不对这些中止负责。

              HIPAA 风险需要谨慎刻画。HHS 指引和 45 CFR 164.410 清楚规定了 covered entity 和 business associate 的泄露义务，包括 business
              associate 必须在无不合理延迟且不超过 60 天内通知 covered entity。HHS 也把 business associate 定义为代表 covered entity 或另一 business
              associate 创建、接收、维护或传输 PHI 的供应商。公开来源没有显示 Eve 是否在每个客户工作流中都扮演 HIPAA business
              associate，因为原告律所常通过授权获取医疗记录，并非每个事项都会形成直接的 covered-entity / vendor 链条。因此，公开来源无法完全证明精确的 HIPAA 角色。不过，Eve
              显然在规模化处理敏感医疗记录，这意味着一旦发生泄露、模型误路由或访问控制失败，即便支配理论是合同保密、州隐私法或职业过失，而不只是 HIPAA 执法，也会产生严重暴露。

              特权风险同样微妙。该领域最强的 2026 年公开案例是 Warner v. Gilbarco，密歇根联邦法院在该案中认定 AI 辅助诉讼材料保留工作产品保护，且使用 ChatGPT
              不会自动放弃该保护。这有利于乐观情形。但它不是一张全面的特权通行证，也不会把产品营销变成法律原则。法院处理的是具体诉讼事实，其他 2026 年评论和案卷动态显示，公众或第三方 AI
              使用如何影响特权仍存在真实分歧。对 Eve 客户来说，实务教训是：特权是工作流属性，不是软件功能；它取决于数据选择纪律、合同控制、平台保密和律师监督。再加上 SLA
              把云服务商和集成应用的故障排除在宕机计算之外，运营结论就很尖锐：如果 AWS、Azure 或关键 CMS 集成在临近期限时失败，即使 Eve 自身技术上没有做错，原告律所仍会暴露在风险中。
