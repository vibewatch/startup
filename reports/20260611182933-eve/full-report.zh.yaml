      - number: '4.2'
        title: GTM 动作、客户 ROI 与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Eve 的商业论证在客户故事暴露工作流算术的地方最强。Archuleta 称，该律所每月处理约 1,000 条来自全美 50 个州的线索，约一半来电者自愿选择 AI
              intake，且未增加员工就把产能翻倍。Laurel 称，索赔函起草从两到四小时降到约 15 分钟，其 demand agent 还把每周邮寄的索赔函从 48 封提高到 104
              封，并把人工接触时间降至每封三到五分钟。Frontier 称，Eve 把数天的 interrogatory 工作压缩到 45
              分钟，现在让团队在同样时间内完成五倍工作量。这些不是经审计的财务报表，但它们是最清晰的公开证据，说明 Eve 卖的是劳动力杠杆和吞吐量，而不只是更漂亮的起草。


              更难的问题是，这种工作流杠杆能否转化为有吸引力的软件经济性。上市公司代理指标显示可以：Intapp 提交的 2026 年 3 月数据为 SaaS 增长 27%、云 ARR 增长 31%、云 NRR
              123%；DISCO 则显示收入继续增长，但 GAAP 盈利仍为负。这对 Eve 是有用的模式。规模化法律软件公司可以复合递增经常性收入，同时比通用 SaaS 更久地吸收增长投入。但 Eve
              没有披露自己的毛利率、服务组合、CAC、回本周期或留存。因此，投资人有足够证据相信模型可能有吸引力，但没有足够信息在缺少 data room 支持的情况下，把客户 ROI 闭环到单位经济。
