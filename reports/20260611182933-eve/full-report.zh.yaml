      - number: '5.4'
        title: 切换成本看起来真实，但关键技术尽调项仍未披露
        blocks:
          - type: paragraph
            body: >-
              Eve 可能的护城河是运营嵌入，而不是某个单一突破性模型声明。Atlas 意在把记录、文件、沟通和案件管理数据标准化进一个案卷；Clio sync 直接把联系人、笔记和案件详情拉入 Eve；客户故事描述了律所专用
              playbook、由证词驱动的起草触发，以及 overnight review loops。一旦这些工作流按一家律所的模板、intake
              逻辑和审批检查点调好，替换成本就会上升，因为买方换掉的不只是软件席位，还包括已编码的流程。内部搜索基础设施文章强化了这一推断：按案件设计的检索适合需要案由专用召回和可追溯性的律所，也说明切换将涉及工作流和数据架构迁移。


              即便如此，从技术尽调角度看，产品还不能完全用公开信息承销。已审阅来源没有找到公开状态页、正常运行时间指标、事故披露、外部 API 参考、除 Clio 和通用 CMS
              声称之外的具名集成目录，也没有关于幻觉率、引用精度或 review-pass 表现的基准证据。公司可控的规模声明也变化很快——1 月 500+ 家律所，3 月赞助报道 800+，招聘中 1,000+，6 月官网
              1,200+——却没有独立分母来说明活跃使用、留存或模块渗透。综合看，Eve 像少数几个正在为原告律所构建 workflow-native OS 的法律 AI
              供应商之一，具备真实开发者信号深度和可见产品宽度。但技术尽调论证仍依赖私有 data room 来确认可靠性、评估纪律、部署摩擦，以及验证控制在 courtroom-grade 压力下是否稳定发挥。
