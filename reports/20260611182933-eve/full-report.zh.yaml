  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、伦理与未经授权执业风险
        blocks:
          - type: paragraph
            body: >-
              Eve 并没有把自己包装成后台记笔记工具。它的首页和平台页面称，产品处理获客承接、医疗时间线、动议、索赔函、证据开示回复、研究和律所分析；2026
              年发布材料还描述了会在新信息到来时自动行动、起草所需文件、管理常规获客和状态更新的 agent，律师在成果离开律所前审阅并批准。这一定位商业上很有力量，但也把 Eve 推到律师协会指引眼中的法律 AI
              核心风险边界附近：软件不再只是起草辅助，而开始像法律服务交付中的准代理人一样运作。Eve 自己的表述试图把人类留在控制位，但它的差异化恰恰取决于继续深入监管者和法院视为专业判断领域的工作流。

              约束底线仍然很传统。ABA Formal Opinion 512 规定，律师使用生成式 AI 时，仍负有胜任、保密、客户沟通和合理计费义务。Model Rule 1.1 要求胜任代理，Rule 1.6
              要求采取合理措施防止未经授权披露或访问，Rule 5.5 禁止协助未经授权执业。更尖锐的 2026 年来源是 California 更新后的实务指引，它明确覆盖 agentic
              AI，并指出律师不得部署会在缺乏有意义律师监督和审查的情况下作出实质性法律判断、传达法律意见、准备并提交诉状，或以其他方式以代理身份行动的系统。这一点很关键，因为 Eve 现在把产品描述为带有执行、审查和智能层的
              AI 劳动力，而不是被动软件工具。

              眼前风险不是 Eve 明天会被认定为律所。真正的问题是，产品越多地自动化获客资格判断、法律起草、问题识别和下一步建议，州别 UPL、监督和披露问题就越会从抽象政策争论进入客户采购和索赔处理。Thomson
              Reuters Institute 的 2026 年 UPL 分析强调，各州对法律执业仍没有统一定义，敏感边界在于把法律适用于具体事实并建议行动路径。对 Eve
              来说，这种模糊性有双面性：它保留了运营空间，也意味着少数不利的州律师协会或法院案例，可能比缓慢推进的成文法更快冷却采用。在风险章节里，应把它评为高严重度、中等可能性的事项，因为即便没有任何正式执法行动直接点名
              Eve，下行也可能先通过客户犹豫、法院审视或保险人 / 律所政策收紧体现出来。
