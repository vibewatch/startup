      - number: '8.3'
        title: 用谨慎情景框架推算隐含 ARR 倍数
        blocks:
          - type: paragraph
            body: >-
              关键纪律步骤，是把 $1B 轮次翻译成 ARR 要求，而不是重复标题估值。公开基准让门槛变得清楚。若按 SaaS Capital 的 6.7x 公开 SaaS 中位数交易，Eve 需要约 $149M
              ARR。若要像 Clio 2025 年融资，需要约 $80M ARR。若要像 Clio 2024 年轮次，需要约 $67M ARR。若要像 Intapp 更严苛的公开市场比率，需要超过 $330M
              ARR。这些阈值不是精确目标，但展示了公开市场支撑与主要按私人期权价值定价的轮次之间，数量级差异有多大。

              由于 Eve 不披露 ARR，公开可用的轮次翻译方式只能是用已披露客户数和谨慎合同价值区间。按轮次时 450 家律所披露，假设混合 ARR / 律所为 $20,000，仅意味着约 $9M ARR 和约 111x
              倍数。$40,000 假设意味着约 $18M ARR 和约 56x 倍数。即便采用非常慷慨的 $80,000 混合 ARR / 律所，仍只意味着约 $36M ARR 和约 27.8x 倍数。这些数字对热门 AI
              平台并非不可能，但显著高于已披露法律科技和公开 SaaS 可比公司通常能支撑的水平。

              唯一能软化这一结论的公开事实，是 Eve 当前首页披露 1,200+ 家律所。如果其中大多数是付费客户，且混合 ARR / 律所在约 $50,000，当前 ARR 可能接近 $60M，并回头把 2025 年 9
              月价格压缩到约 16.7x ARR。这仍然偏贵，但远没有轮次时 450
              客户数学那么极端。问题在于，这个去风险情形依赖公开记录没有提供的信息：付费与试点状态、每家律所席位数、服务组合、续约行为，以及高端计划客户占比。因此，正确结论不是该轮次显然错误，而是它是一个押注执行的期权式价格，仍需要私下验证。
