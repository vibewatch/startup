        title: 资本充足性、烧钱代理与资本强度
        blocks:
          - type: paragraph
            body: >-
              财务上，关键正面因素是 Eve 不再像脆弱的前产品创业公司。仅已披露的 2025 年 Series A 和 Series B 就贡献至少 $150 million，多项 2026
              年公司可控来源还把总额四舍五入到超过 $160 million 或 $164 million。这很重要，因为公司仍在积极招聘。Jobera 2026 年 6 月列出 34
              个开放岗位，横跨工程、数据、产品营销、安全、财务、收入运营、客户成功、销售和法务。公开薪酬区间从低端约 $82,000 到高级工程领导岗位
              $450,000，同时公司还宣传股权、福利、津贴和退休匹配。这些披露无法揭示实际薪资总额，但确实显示出一个风投支持的成本基础，与仍在大力投入产品、GTM、合规和客户运营的公司相符。


              问题在于，资本充足性仍无法被精确承销。已审阅来源没有公布账上现金、月度烧钱、现金跑道月数、债务或授信额度。即便招聘数据也有两面性：它说明公司能花钱，但不能说明 2025
              年融资后还剩多少现金。最可辩护的判断是，Series B 实质性降低了近期融资压力，且赞助方质量让 Eve 相比多数垂直 AI 创业公司拥有更好的再融资位置。但公开记录仍无法让投资人判断 Eve
              是距离下一轮融资还有十二个月，还是已经舒适融资到更远时间点。
