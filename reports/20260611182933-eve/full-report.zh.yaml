  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分、执业领域匹配与可见证据
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个比「法律 AI」泛称更窄也更可信的客户故事。Eve 明确面向原告律所，而不是整个律所宇宙；其公开执业领域足迹已经覆盖人身伤害、劳动与雇佣、工伤赔偿、Social Security
              disability 和医疗过失。具名客户组合也比纯 auto-PI 切口更多元。Mike Morse 和 Jeffrey Glassman 构成大型人身伤害引用，James Scott Farrin
              增加了一个具备工伤赔偿和 SSDI 深度的 Mid-Atlantic 原告平台，Hershey Law 与 Frontier Law Center 则显示 Eve
              能进入原告侧雇佣业务。从地理看，可见引用以美国为中心但范围较广：Michigan、North and South Carolina、California 和 Massachusetts
              都出现在公开材料中。这足以说明产品可以跨原告子细分和州级工作流迁移，但不足以证明均衡的全国客户组合或强国际覆盖。最佳解读是，Eve 已从单一律所或单一执业证据点，推进到多 logo
              原告样本，但仍依赖经过策划的公开故事，而不是完整披露的客户名册。
