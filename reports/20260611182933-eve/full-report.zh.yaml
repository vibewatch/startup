        - 客户数量、2X QoQ 收入说法和基准价格带
        - 未公开披露
        - 索取月度经常性收入、ARR 桥和按模块划分的收入结构
      - - 实际成交定价 / ACV / 席位组合
        - 需要用它把「1,000+ 律所」转成实际变现
        - Clio、MyCase 和 PracticePanther 的法律软件价格卡
        - 未公开披露
        - 索取价格手册、每客户平均席位，以及前十分位 ACV
      - - 毛利率和软件 vs 服务结构
        - 需要判断收入质量，以及入驻或人工审查是否拖累利润率
        - 客户故事加法律软件可比代理
        - 未公开披露
        - 索取毛利率桥和服务附加 / 服务毛利率
      - - CAC、回本和销售周期转化
        - 决定增长是否高效，还是只靠资本堆出来
        - Head of Legal 职位、客户成功招聘和交易复杂度线索
        - 未公开披露
        - 索取漏斗转化、销售周期、按渠道划分的 CAC 和按分群划分的回本
      - - 留存、流失和集中度
        - 对理解 $1B+ 估值背后的客户基础耐久度至关重要
        - 2025 年 450+ 律所和 2026 年 1,000+ 暗示扩张，但不说明留存质量
        - 未公开披露
        - 索取 NRR、总留存、流失、cohort 扩展和头部客户集中度
      - - 现金、burn、runway 和债务
        - 是承销资本充足性和下一轮时点的核心
        - 已披露融资，加上激进招聘和高薪资区间
        - 未公开披露
        - 索取董事会现金文件、月度 burn、runway 模型和债务明细表
    notes: 这些是从叙事尽调推进到财务承销所需的最低缺失项。
