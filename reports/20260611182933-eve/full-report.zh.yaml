      - number: '1.4'
        title: 客户证据、里程碑节奏与反向信号
        blocks:
          - type: paragraph
            body: >-
              牵引力是 Eve 不止于融资头条的最清晰原因。已审阅材料显示，2025 至 2026 年规模口径快速上行：Series B 前后超过 450 家律所，2026 年 1 月超过 500 家，3 月超过 800
              家，当前官网为 1,200+，2026 年 6 月 LawNext 报道为 1,400+。这些数字方向上亮眼，但并不完全对齐，因此精确当前客户数仍是尽调项，不是确定事实。尽管如此，客户证据异常具体。公开来源点名
              Mike Morse Law Firm、James Scott Farrin、Barrett & Farahany、Disparti Law Group、Frontier Law Center、Laurel
              Employment Law 和 Hershey Law，案例研究则把每周节省 20+ 小时律师时间、产能翻倍或增长两倍、部分工作流平均周期四个月，以及 $27.5 million 判决归因于使用 Eve
              的律所。融资后产品里程碑也继续推进，包括 2026 年 1 月 AI Workforce 发布和 2026 年 6 月 EveOS 扩展。反向面同样重要：LLRX 和 2026 年 3 月一份法院文件把 Eve
              关于幻觉防护的营销与培训说法，同一名律师的不准确引用事件联系起来，尽管该律师称无法判断错误究竟来自 Eve 本身，还是来自自己的复制粘贴工作流。此事不否定这门生意，但说明信任、验证和法律流程控制是实质性尽调风险。
