      - number: '2.2'
        title: 规模测算视角、细分结构与有边界的 TAM 逻辑
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是有边界的多视角市场判断，而不是一张被吹大的 TAM 幻灯片。最宽口径下，ABA 称美国 2025 年有 1.37 million 名律师。Clio 的 2026
              年人身伤害市场综合再把这个大分母缩窄到 135,000+ 名人身伤害律师，约占执业律师 10%，且每年近 400,000 起 PI 索赔主要在州法院提交。同一来源引用美国人身伤害律师与律师事务所 2025
              年行业收入 $61.7 billion；这是一块很大的经济池，尽管它不是软件支出。常规 PI 之外的复杂度也有意义。Lex Machina 称，premises-liability 和 motor-vehicle
              tort 案件在其 2025 年联邦侵权报告中达到历史高位。PFAS AFFF 多地区诉讼页面称，仅这一个 MDL 就有 10,000+ 起相关案件和数万名原告；Duane Morris 则审阅了上一年超过
              1,441 份集体诉讼裁判。合在一起，这些视角说明原告律师群体规模可观、结构分散、运营密度足以支撑垂直工作流软件。公开数据无法清楚揭示的是，各细分原告律所的精确数量，或这块法律收入池中已有多少美元份额被指定给
              AI 和工作流软件。
