      - number: '8.2'
        title: 可比公司、市场规模支撑，以及公开基准说明了什么
        blocks:
          - type: paragraph
            body: >-
              最有用的法律科技基准是 Clio，不是因为它与 Eve 完全可比，而是因为它是少数在相当规模上公开披露估值和 ARR 的私人法律软件平台之一。Clio 2024 年 7 月融资把公司定价为 $3B，当时 ARR
              已超过 $200M，隐含 ARR 倍数低于 15x。收购 vLex 并在 2025 年 11 月融资后，Clio 估值为 $5B，ARR 为 $400M，隐含约 12.5x
              ARR。这些标记仍带有高端法律科技定位，但它们是在 Eve 尚未公开披露的收入水平上完成的。相比之下，Harvey 明确是离群值：CNBC 报道其 2026 年 3 月 ARR 为 $190M、估值 $11B，约
              58x ARR。Harvey 的作用只是提醒市场存在前沿 AI 稀缺溢价，而不能作为原告律所工作流软件的直接承销锚。

              私人原告侧和工作流同行方向上支持，但不是干净的倍数锚。EvenUp 2025 年 10 月 Series E 将其定价为 $2B+，管理层称 ARR 同比翻倍，平台上有 2,000+ 家律所。Supio
              披露总融资 $91M，且自 Series A 以来 ARR 增长 4 倍，但没有披露绝对 ARR 基数。Filevine 披露近 6,000 个客户、100,000 名法律专业人士、96% gross
              retention 和超过 120% 的 NDR，但没有披露估值。Litify 披露 450+ 家企业客户和 70,000+ 名法律专业人士，并曾融资 $50M Series A，但同样没有披露当前 ARR。

              公开市场框架更严格。Intapp 是一家有法律业务敞口的上市专业软件平台，披露 2026 年 3 月季度收入 $146.0M，2026 年 6 月市值约 $1.78B，约为年化收入的 3.0x。SaaS
              Capital 的公开基准把 2025 年 6 月 SaaS ARR 中位数倍数放在 6.7x，并把当前环境描述为 6-8x 的「新常态」。市场规模支撑足以支持相对通用 SaaS 落后者的溢价：ABA
              统计美国律师基数为 1.37M，Clio 的人身伤害统计页面把 PI 子集放在 135,000 名以上律师、每年近 400,000 起索赔。但 Thomson Reuters 2026
              年法律市场报告提醒，买方是在不稳定经济基础上投资 AI，这支持价格纪律，而不是自动的 AI 倍数膨胀。
