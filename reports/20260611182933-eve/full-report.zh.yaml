  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 估值判断不该只看融资标题，更取决于当前付费 ARR 和留存能否撑住法律科技的溢价倍数。
    data:
      nodes:
        - id: n1
          label: 真实原告市场
          detail: 135k+ 名人身伤害律师和约 400k 起索赔案
        - id: n2
          label: Eve 牵引力
          detail: 融资时 450+ 家律所；当前官网为 1,200+ 家律所
        - id: n3
          label: 基准现实
          detail: Clio 约 12.5x-<15x；Intapp 约 3x；SaaS 中位数 6.7x
        - id: n4
          label: 输入不透明
          detail: 无公开 ARR、留存或股权结构条款
        - id: n5
          label: 情景测算
          detail: 按谨慎的融资时点情景，该轮隐含约 28x-111x ARR
        - id: n6
          label: 估值立场
          detail: 除非当前付费 ARR 和留存已达溢价水平，否则估值偏紧
        - id: n7
          label: 建议
          detail: 跟踪 / 要求证据，或降低入场价格
      edges:
        - - n1
          - n5
        - - n2
          - n5
        - - n3
          - n5
        - - n4
          - n6
        - - n5
          - n6
        - - n6
          - n7
    claimRefs:
      - CV034
      - CV036
      - CV037
      - CV039
      - CV041
      - CV050
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 要支撑 $1B 估值，所需 ARR 会随采用的倍数体系大幅变化。
    data:
      items:
        - label: Intapp 式约 3x
          value: 333.3
        - label: 公开 SaaS 中位数 6.7x
          value: 149.3
        - label: 慷慨溢价 10x
          value: 100
        - label: Clio 2025 约 12.5x
          value: 80
        - label: Clio 2024 <15x
          value: 66.7
    approximationNotes: 数值只是用 $1,000M 除以参考倍数，意在给出估值门槛，不是经审计预测。
    claimRefs:
      - CV031
      - CV032
      - CV036
      - CV037
      - CV038
      - CV051
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 以 $1B 入场后的前瞻回报高度不对称，取决于 Eve 能否做到支撑溢价的 ARR 规模。
    data:
      items:
        - label: 熊市情景
          low: 240
          high: 540
        - label: 基准情景
          low: 840
          high: 1440
        - label: 牛市情景
          low: 3000
          high: 4200
    approximationNotes: 数值是由宽口径 ARR 和倍数区间推导出的未来股权价值，单位为百万美元，不是贴现现金流结果。
    claimRefs:
      - CV046
      - CV047
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投委会式打分对市场和产品宽度偏正面，但估值支撑和证据质量偏弱。
