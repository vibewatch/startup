  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - UPL / 监督风险
        - 州律师协会或保险公司认为，若没有更严格的人工复核，智能体式起草 / 案源接收已超出获批用途
        - 主要原告律法州、保险公司或前 20 大客户发布任何限制
        - 暂停扩张自主功能，直到复核控制和允许使用边界重新验证
      - - 幻觉 / 制裁风险
        - 与 Eve 支持输出有关的法院命令、制裁或公开更正文件
        - 一起确认的公开事件点名 Eve 输出，或出现客户险些出问题的模式
        - 升级为红色尽调；要求事故根因、补救证明和客户封堵措施
      - - 隐私 / HIPAA / 特权风险
        - 涉及医疗或特权案件数据的安全事件或保密性质疑
        - 与平台设计有关的重大泄露、监管询问或不利特权裁定，而非孤立误用
        - 围绕法律责任准备金、客户流失和更慢商业化推进重新定价
      - - 平台依赖风险
        - 云 / CMS 故障阻断有时限要求的工作流
        - 反复宕机，或单次关键截止期故障且缺乏可信恢复能力
        - 在增加敞口前，要求修复故障切换、建立离线工作流，并强化合同保护
      - - 买方集中风险
        - 标杆客户标识流失或使用量急剧收缩
        - 失去一个头部参考客户，或有证据显示大型律所在试点后缩小范围
        - 重新评估留存韧性和销售效率假设
      - - 竞争 / 执行风险
        - 既有厂商把经过验证的法律内容与可比的原告工作流打包
        - 对 Lexis / Westlaw 相关工具的赢率持续恶化，或 CAC 上升且没有扩张抵消
        - 除非 Eve 证明原告原生 ROI 有韧性，否则估值立场转向执行折价
    notes: 否决标准不是机械交易信号，而是触发投资人复核的升级条件；每一项都可能比收入指标更早击穿信任。
