  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 退出 ARR 达 $250-300M，退出倍数 12-14x；Eve 证明平台级留存，并把 1,200+ 家律所版图变现
        - $3.0-4.2B 价值，或从 $1B 入场价获得约 3.0-4.2x 总 MOIC
        - 执行、留存和溢价倍数可持续性
        - 低到中；需要溢价集群级执行
      - - 基准
        - 退出 ARR 达 $120-160M，退出倍数 7-9x；增长仍好，但公开市场纪律持续
        - $0.84-1.44B 价值，或约 0.8-1.4x 总 MOIC
        - 倍数压缩、中等 ACV 和有限经营杠杆
        - 没有超常证明时最可能
      - - 悲观
        - 退出 ARR 达 $60-90M，退出倍数 4-6x；变现落后于客户标识增长，或竞争压缩定价
        - $0.24-0.54B 价值，或资本大幅减值
        - 客户标识质量、留存偏弱、服务拖累，或定价硬重置
        - 如果证明质量仍薄弱，下行风险实质性存在
    notes: 情景输出刻意保持粗颗粒度，目的是展示回报敏感性，而不是给出精确估值点估计。
