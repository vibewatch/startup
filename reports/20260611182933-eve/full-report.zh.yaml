      - number: '7.2'
        title: 幻觉、证据与职业过失风险
        blocks:
          - type: paragraph
            body: >-
              近期判例已经打消了任何幻想：法院不会因为用了工具就宽恕 AI 错误。Mata v. Avianca 仍是标准警示案例：律师提交并随后辩护 ChatGPT 生成的虚假案例后，Castel
              法官制裁了律师及其律所，并强调既有规则要求律师守门。2026 年第九巡回法院在 Lnu v. Blanche
              的命令把这一原则推进得更远，且尤其重要，因为它来自上诉层级、时间很近、表述明确：法院称，规则不是在研究或起草阶段被违反，而是在签署和提交阶段被违反。律师提交含有不存在案例的案情摘要后，又没有就 AI
              是错误来源及时、坦诚披露，法院因此施加金钱制裁和六个月停职。主线很简单：法律 AI 可以辅助，但不会稀释责任。

              这些先例直接关系到
              Eve，因为产品被营销用于真实案件中的索赔函、动议、证据开示回复、质询书、时间线和研究。部分输出不是法院提交文件，但仍会带来证据和职业过失暴露。错误时间线会扭曲案件估值。幻觉或夸大的医疗事实会污染索赔函、和解谈判、调解摘要或证词提纲。核验不足的证据开示回复会触发证据问题、制裁或信誉损害。Eve
              显然知道这一风险存在：平台称研究引用可打开并核验，医疗概览称每个数据点都链接到页级来源，证据开示工作流称律师审查必不可少，同时应把特权或工作产品材料排除在所选输入之外。这些是好的控制，但也等于承认准确性和过度披露都是现实失效模式。

              2025 年 Morgan & Morgan 制裁令进一步说明，内部法律 AI 不是安全港。该案中，律所自有平台生成了虚假案例，法官强调核验义务不可委托。这才是 Eve 尽调的正确框架。关键问题不是 Eve
              是否比消费级聊天机器人使用了更好的检索、模板或引用，而是处在期限压力下的原告律所，能否可靠地用足够的人类核验，在输出抵达保险人、对方律师、调解员或法院之前，拦住事实漂移、引用幻觉和过度主张。公开材料没有披露
              Eve 自身的独立错误率、索赔经验或制裁记录。没有这些指标，投资人应假设输出完整性风险会随客户工作量和产品自主性放大，而不只是随模型质量变化。
