companyProfile:
  summary: >-
    Eve 是一家总部位于旧金山的法律 AI 公司，聚焦原告侧律所，而不是 Big Law 或通用法律研究。公开产品和客户证据显示，其平台覆盖获客 intake、病历综合、索赔函起草、discovery
    支持、研究、沟通，以及一个较新的案件数据层，意在横跨律所工作流。公司的市场叙事很强：Eve 于 2025 年 1 月完成 $47 million Series A，并于 2025 年 9 月以超过 $1 billion 的估值完成
    $103 million Series B，Andreessen Horowitz、Lightspeed、Menlo 和 Spark
    均公开背书。客户证据也真实存在，既有具名律所引用，也反复声称显著节省时间、提升转化。核心尽调问题不是 Eve 是否有势能，而是当前付费 ARR、留存和法律风险控制是否足够强，能支撑此前估值，并在现有厂商和相邻法律 AI
    供应商追赶时守住长期领先。
