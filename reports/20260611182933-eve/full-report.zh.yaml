        - 低-中
        - 高
        - Eve 公开声称符合 HIPAA，且不使用 PHI 训练
        - 如果客户数据流实际上构成商业伙伴身份，泄露义务和合同暴露会明显变尖锐
        - 核验 Eve 何时签署 BAA、哪些数据流会触发，以及分包商是否继承义务
      - - 州律协或保险方发布不利指引，限制智能体法律 AI
        - 州律协 / 职业过失保险承保方
        - 未发现针对 Eve 的公告
        - 中
        - 高
        - 人类在环定位和客户披露指引
        - 如果职业过失保险承保方或大型律所收窄获批使用场景，采用可能快速放缓
        - 收集客户承保方政策、采购异议，以及头部账户取得的任何外部伦理意见
    notes: 各行按剩余严重性排序，依据是截至 2026-06-11 的公开法律指引和已披露产品范围。公开来源未显示任何针对 Eve 的律协行动或保险方限制。
