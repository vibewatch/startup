  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块
      - 主要用户
      - 成熟度 / 状态
      - 已确认能力
      - 差异化 / 转换成本
      - 尽调缺口
    rows:
      - - Intake / Jenny
        - 线索接收团队和前台
        - 已上线；自 2025 年 10 月 GA，并在 EveOS 中扩展
        - 24/7 语音和邮件处理、实时签约、多语言 intake、线索评分、CMS 同步
        - 掌握首次接触，并可将结构化数据直接送入下游案件工作流
        - 索取经审计的转化提升、假阳性 / 假阴性率和电话升级政策
      - - Medical Overview
        - 律师助理和诉前员工
        - 已上线
        - 时间线、不利事实、ICD 编码、损害赔偿台账、页级来源链接，以及疑难扫描件 OCR
        - 把原始医疗包转成可复用的结构化案件上下文
        - 要求提供基准准确率、审阅者改写率，以及大文件失败日志
      - - 起草 Agents
        - 律师助理、律师、法律运营
        - 已上线
        - 按律所风格起草索赔函、起诉状、动议和证据开示草稿，并由笔录触发
        - 固化律所模板，减少重复起草瓶颈
        - 要求提供提示词 / 版本控制、红线修改遥测，以及律师采纳率
      - - Auditor
        - 律师和审阅负责人
        - 已上线；2026 年增强
        - 每晚审阅活跃事项，查找缺口、遗漏伤情、缺失文档和下一步动作
        - 增加一层持续 QA，而不是一次性提示
        - 要求提供问题标记的精确率 / 召回率，以及重大误报率
      - - Analyst
        - 律所领导层和运营
        - 2026 年测试版 / 早期访问
        - 用自然语言查询运营问题，并提供收入节奏、绩效和案件分布仪表盘
        - 可能把产品使用痕迹转成管理报告和流程调优
        - 要求提供正式可用日期、数据模型覆盖度，以及基于角色的访问控制
      - - Atlas / AI-ready 数据
        - 整个律所
        - 2026 年测试版 / 早期访问
        - 自更新案件文件，从 CMS、邮件、诉讼文件、记录和通信中拉取数据
        - 带来数据可携带性和共享上下文，使用越多复利越强
        - 要求提供血缘模型、冲突解决逻辑和导出工具
      - - Communication Agents
        - 案件经理和接案团队
        - 2026 年新增
        - 以 31 种语言处理外呼跟进、记录请求、入职引导和案件更新
        - 把自动化延伸到繁琐但高频的客户 / 服务方沟通
        - 要求提供退订控制、通话录音治理和语言质量审计
      - - Research
        - 律师和起草人员
        - 2026 年新增
        - 按司法辖区检索判例，标记被推翻案例，并链接来源段落
        - 如果可靠，可把法律研究嵌进工作流，而不是另起一个工具
        - 要求提供权威来源覆盖度、漏检率测试和引用核验日志
    notes: 各行把有直接公开证据的模块，与仍处于测试版或早期访问状态的模块分开；多数已量化的结果声明仍由公司掌控。
