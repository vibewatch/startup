  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Eve 服务的市场比「法律 AI」更窄，又比单一人身伤害点解决方案更宽。Eve 官方页面称，产品为原告律所打造，贯穿 intake、医疗概览、索赔函起草、discovery 回复和更广泛运营。Eve
              还明确列出原告侧执业领域，包括人身伤害、工伤赔偿、医疗过失、劳动与雇佣、大规模侵权和 Social Security disability。这一点重要，因为原告律所的现状不只是 Westlaw
              式研究或通用聊天机器人。Smokeball、CloudLex、CasePeer 和 Paxton 等竞争对手和工作流来源都把原告工作描述为从 intake
              到和解的操作系统：客户筛选、病历收集、时间线构建、起草、和解跟踪、留置权处理和款项分配。换句话说，纳入范围的是胜诉收费原告业务的案件生命周期工作流劳动力和软件；排除范围是大多数仅服务被告的
              e-discovery、通用 BigLaw 知识工具，或从不触及原告运营的广义法律研究预算。核心替代集合是人力、传统案件管理软件、外包记录与留置权供应商，以及仍需要大量原告专用提示和审阅的通用 AI。
