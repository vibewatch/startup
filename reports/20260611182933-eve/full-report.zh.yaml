        title: 通用法律 AI、相邻进入者以及它们能替代什么
        blocks:
          - type: paragraph
            body: >-
              Harvey、CoCounsel、带 Protégé 的 Lexis+ 和 Paxton 很重要，因为它们可以吸收 Eve 工作流的一部分，却不必成为原告操作系统。Harvey
              现在销售能端到端执行法律工作的智能体，并拥有规模、融资和律所采用度；只要买方想要一个覆盖多个执业领域的高端 AI 伙伴，它就可能成为严肃的采购替代。CoCounsel 和带 Protégé 的 Lexis+
              带来另一种分发力：受信任的法律内容、法律研究工作流、尽调工具和有依据的引用基础设施。这些平台并非围绕原告 intake、医疗时间线、和解运营或律所专用 PI 分析打造，但仍能商品化研究、起草和审阅。Paxton
              则更偏 copilot 光谱一端。其公开材料强调起草、文档分析、上下文研究、医疗时间线和计费摘要，因此对想要 AI 辅助、但不替换当前 system of record
              的小型律所来说，它是一个合理层。结论是，Eve 不能只靠起草或研究质量防守；它需要原告原生的工作流深度和运营杠杆，而这些更宽的法律 AI 公开尚未显示出来。
