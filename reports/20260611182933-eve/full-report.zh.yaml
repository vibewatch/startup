      - number: '7.5'
        title: 缓释措施、监控与止损标准
        blocks:
          - type: paragraph
            body: >-
              Eve 并没有忽视这些风险。公开可见的缓释因素包括：发布材料中的律师审查关卡、链接来源的医疗和研究输出、映射到 SOC 2 的安全计划、年度渗透测试、最小权限控制、明确的客户数据所有权语言、E&O
              和网络保险，以及一项虽然有限但至少构成合同基线的可用性承诺。公司似乎也理解安全采用的组织面：其博客内容鼓励律所制定负责任 AI 政策、客户披露、培训要求，以及针对畸形输出或泄露的升级流程。这些都是合规级法律 AI
              供应商应有的组件。

              问题在于，大多数可见缓释因素是流程主张，而不是独立测量的结果。本报告审阅的公开来源没有显示外部引用准确性审计、公开事件历史、披露的制裁记录、客户留存数据，或 Eve
              自主工作流已在多个司法辖区经受对抗性或监管审查的证据。这意味着投资人应把管理成熟度视为有希望但尚未被证明；证明强度还不足以承销一个嵌入真实诉讼和和解工作流的平台。因此，下一阶段尽调应聚焦硬证据：QA
              仪表盘样本、红队结果、泄露响应演练、保险人历史、模型治理政策、特权数据架构，以及客户级续约 / cohort 数据。

              从承销角度看，最清晰的论点失效触发器也可以监控。若公开制裁、律师协会投诉或不利法院命令把 Eve 输出与律师不当行为相连，将是重大红旗，因为它会攻击 Eve
              想成为工作系统的那个信任节点。涉及医疗记录或特权案件数据的重大安全事件也会带来同样不成比例的后果。旗舰律所出现有意义流失，或证据显示大型既有巨头可以把可信法律内容、可接受 AI
              治理和「足够好」工作流工具以更低价格打包进既有订阅，也一样危险。若没有这些事件，Eve
              仍有一条合理路径走向品类领导。但投资论证应以持续的人在回路纪律、低事件率、耐久参考客户，以及治理扩展速度跟上自主产品范围为条件。
