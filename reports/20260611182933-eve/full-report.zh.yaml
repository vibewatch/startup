        - 高
        - 回报结果高度取决于证明质量和倍数压缩
        - 基准和悲观情景会很快抹掉风险投资式上行
      - - 估值立场
        - 偏高
        - 把 $1B 视为稀缺溢价标记，而不是有公开可比公司支撑的公允价值
        - 融资时客户数叠加谨慎 ACV 假设，意味着倍数偏高
      - - 新资金纪律
        - 无证明时 $700-800M；只有当前 ARR 证明强劲时才接受 $1B
        - 要么要求价格让步，要么证明当前付费 ARR 已明显高于 $60-80M
        - 10-12.5x 这类法律科技倍数，需要远高于公开披露水平的 ARR
    notes: 建议仅基于公开证据；对 ARR、留存和优先权条款的私有尽调可能显著改变立场。
