            body: >-
              Eve 竞争的不只是新原告原生 AI 公司，也包括已经控制原告律所内部 intake、日程、文档、计费、报告和日常案件推进的软件系统。Litify、Filevine、CloudLex 和 CasePeer
              是最重要的例子，因为它们已经贴近 matter-management 核心。Litify 和 CloudLex 尤其公开使用操作系统语言：从 intake 到和解、可配置工作流、分析和嵌入式
              AI。Filevine 的公开功能集说明，即便品牌听起来没有 Eve 那么「agentic」，既有厂商仍然重要。它已经提供 AI 病历分析、证词
              intelligence、验证工作流、日程和支付运营。CloudLex 和 CasePeer 更窄，但原告原生、运营嵌入深，这意味着它们可以靠切换成本守住预算，而不是靠前沿模型话术。现状还包括
              Clio、MyCase、PracticePanther 等更通用的律所套件，以及 Smokeball 这类重文档工具。它们在原告深度上较弱，但价格更简单公开，对尚不想引入新 AI-first
