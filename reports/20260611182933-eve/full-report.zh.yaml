  - id: TV005
    title: 逻辑击穿与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 付费 ARR 证明未达到当前降风险阈值
        - 当前付费 ARR 仍低于约 $60M
        - 1,200+ 家律所的标题口径无法把入场倍数压到足够低
        - 不支付上一轮估值；要求重置价格或不参与
      - - 留存质量普通，不是溢价级
        - 总留存或净留存低于软件领导者常模
        - 稀缺溢价定价不再匹配平台逻辑
        - 重估到公开市场中位数或更低
      - - 客户数高度偏向试点
        - 当前律所客户标识中很大一部分是试点、低 ACV 试用或非付费席位
        - 客户标识增长会高估已变现规模
        - 任何承销前，仅从付费队列重建 ARR
      - - 新融资增加沉重优先权包袱
        - 后续轮次加入激进优先权、参与权或反稀释条款
        - 标题估值会高估普通股价值
        - 按瀑布模型重新计算回报，或避开交易
      - - 竞争性定价压力冲击原告 AI
        - 可比原告 AI 产品压缩有效 ACV，或迫使销售走向重服务
        - 退出 ARR 和退出倍数同时恶化
        - 立即切换到悲观情景假设
    notes: 这些触发因素聚焦会直接击穿估值逻辑的事实，而不是一般创业噪音。
    claimRefs:
      - CV050
      - CV053
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - ARR 与留存
        - 2025 年 9 月至今，按队列拆分的实际 ARR、NRR、GRR 和毛利率
        - 这是连接稀缺溢价轮次与可支撑估值倍数的核心桥梁
        - CFO 数据室加董事会报告
      - - 客户定义
        - 付费客户、席位数、按细分市场拆分的 ACV，以及 450+ 与 1,200+ 家律所披露的口径核对
        - 情景算术取决于当前客户标识数代表付费收入，还是更宽泛的采用声明
        - CRO / 销售副总裁复核并导出队列
      - - 股权结构表和瀑布
        - 股份类别、清算优先权、参与权和反稀释条款
        - 不能只看标题估值来评估普通股回报
        - 公司法律顾问加股权结构表导出
      - - 单位经济
        - 服务组合、CAC、回本周期，以及按队列拆分的贡献毛利
        - 如果实施高效、软件毛利率强，溢价定价可信度会高得多
        - 财务和 RevOps 尽调
      - - 老股与内部定价
        - B 轮之后的任何老股交易或内部标记
        - 如果内部悄悄打折，会实质性改变对 $1B 标题标记的解读
        - 领投方和公司财务尽调
    notes: 这些要求是从估值框架走向实际承销所需的最低材料包。
    claimRefs:
      - CV049
      - CV050
      - CV052
