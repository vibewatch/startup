  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 证据
      - 含义
      - 尽调问题
    rows:
      - - 或有收费经济性奖励更快周期
        - 驱动因素
        - 当前
        - 现金回收取决于案件筛选、速度和结果
        - 工作流自动化能在原告律所直接体现 ROI
        - 按案件类型对标和解时间和案头停留时间
      - - 线索受理响应更快，签约转化更高
        - 驱动因素
        - 立即
        - Eve 在线索受理案例研究中引用 40% 转化提升和低于 30 秒的响应时间
        - 24/7 线索受理是切入产品，不是锦上添花
        - 在客户队列中验证转化差异
      - - 医疗记录和索赔函工作重复且量大
        - 驱动因素
        - 立即
        - 原告工作流来源聚焦记录、时间线、起草和证据开示
        - 专用自动化比通用聊天更贴合反复出现的原告任务
        - 抽样检查错误率和律师审阅负担
      - - 以和解为主的案件组合更利好庭前运营，而非仅庭审工具
        - 驱动因素
        - 当前
        - Clio 称约 95% 的 PI 案件在庭审前和解
        - 诉前工作流速度比通用研究广度更重要
        - 衡量和解周期压缩和积压下降
      - - 法律 AI 使用已进入主流
        - 驱动因素
        - 当前
        - 8am、Clio 和 Wolters 的数据中，法律工作流 AI 使用率为 69% 至 90%+
        - 教育负担低于 2023 式试点市场
        - 按律所规模和业务组合拆分采用情况
      - - 治理和培训缺口拖慢推广
        - 约束
        - 当前
        - 8am / ABA 称，许多律所仍缺少正式政策、培训和治理框架
        - 全所部署需要管理层监督和变革管理
        - 审阅部署手册和管理员归属
