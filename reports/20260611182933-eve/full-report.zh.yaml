    title: Eve 竞争耐久性计分卡
    type: kpi
    layout: compact
    summary: 用顺序评分卡梳理公开维度中最可能决定 Eve 能否守住差异化的因素，对手包括原告侧同类、既有厂商和更广义法律 AI。
    data:
