  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 流程 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - Web 应用栈
        - 运行面向操作人员的产品和内部工具
        - Built In 列出 Django、PostgreSQL、Python、React 和 TypeScript
        - 技术栈可见性有帮助，但没有公开架构文档说明租户边界或服务拆分
      - - 案件数据层（Atlas）
        - 把诉讼文件、记录、邮件、CMS 数据和通信规范化为实时事项视图
        - 访问上游系统，并处理模式映射和冲突
        - 公开材料展示的是意图，不是数据血缘细节或对账 SLA
      - - 单案搜索 / 检索
        - 面向特定事项建立索引，用于搜索、检索和上下文锚定
        - OpenSearch 分片不稳定且 AWS 成本高之后迁移到 Turbopuffer
        - 召回指标、权限模型或索引重建频率没有公开披露
      - - Agent 编排
        - 监控事项变化，并触发起草、审阅和沟通动作
        - 工作流规则、案件状态识别和人工批准关卡
        - 如果触发逻辑薄弱，自主触发可能造成无声错误传播
      - - 验证层
        - 输出离开律所前提供内联引用、来源段落链接和人工批准
        - 可靠的引用绑定和 UI 层审阅体验
        - 法庭级失败案例显示，验证在真实使用中仍可能失效
      - - 集成层
        - 从外部系统同步案件详情、联系人、备注和其他记录
        - 目前有 Clio 同步；Atlas 暗示更广泛的 CMS / 邮件 / 会计连接
        - 公开 API 文档和支持伙伴名单不可得
      - - 模型开发和评估
        - 针对法律工作流 AI 系统做微调、评估和部署
        - 特定领域数据、使用信号，以及与基础模型提供商合作
        - 幻觉、延迟或批准通过率没有公开基准包
      - - 工程自动化
        - 内部 WALL-E agent 加速软件交付
        - Slack 触发后台执行、完整应用启动、浏览器测试和 MR 创建
        - 开发者生产率提升不会自动转化为终端用户法律输出可靠性
    notes: 架构行结合了直接技术披露，以及基于招聘和工程文章的谨慎推断；缺少公开文档仍是重大问题。
