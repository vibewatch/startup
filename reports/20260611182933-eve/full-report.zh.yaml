  - id: TP004
    title: 转换成本 / 分销权力表
    columns:
      - 竞争者类别
      - 锁定或多归属驱动因素
      - 公开证据
      - 对 Eve 的含义
      - 尽调问题
    rows:
      - - Eve 本身
        - 可接入现有 CMS，也可独立运行，降低部署摩擦，但也可能限制硬锁定
        - Eve 称其 AI-ready 数据可与现有 CMS 配合，也可独立使用
        - 落地动作强；除非 Eve 成为每日系统记录，否则护城河较弱
        - 询问有多少客户把 Eve 作为主系统运行，而非叠加层
      - - Supio 及类似叠加层
        - 集成优先架构让 AI 层更容易接上，无需替换 CMS
        - Supio 点名集成 Westlaw、Litify、MyCase 和 CasePeer
        - 买方可能先同时运行多个 AI 层，再做整合
        - 索取附加率、共存模式，以及与叠加式部署竞争时的赢单 / 输单情况
      - - EvenUp
        - 专用数据和工作流训练可在 PI 运营中形成流程依赖
        - EvenUp 推广 Piai，并覆盖 PI 案件全生命周期自动化
        - 即便 Eve 扩展到全律所，诉前专业化仍可能有粘性
        - 询问 EvenUp 是从 demand letter 扩展到系统记录，还是保持模块化
      - - Litify / Filevine / CloudLex / CasePeer
        - 既有案件数据、线索接收流程、报表、日程和计费，构成典型系统记录转换成本
        - 公开产品页强调线索接收、案件计划、分析、文档和支付
        - 对 Eve 来说，这是最难撬动的既有厂商障碍，尤其在成熟原告律所中
        - 衡量迁移成本、实施时间，以及 Eve 是替换还是与各套件共存
      - - Clio / MyCase / PracticePanther
        - 较低公开入门价和更宽执业覆盖，降低小型律所试点摩擦
        - 公开披露分层定价和通用律所管理广度
        - 如果律所偏好更便宜、够用的软件加附加 AI，Eve 的 SMB 触达可能被封顶
        - 询问哪些律所规模和案件复杂度会稳定触发升级到 Eve
      - - Harvey / CoCounsel / Lexis+
        - 借助高端法律订阅、研究习惯和既有采购渠道分销
        - Harvey 规模、CoCounsel 工作流主张，以及 Lexis 基于来源的起草 / 研究能力均已公开
        - 在 Eve 赢下整个工作流之前，这些厂商可能先吃掉起草和研究预算
        - 询问 Eve 多常与通用法律 AI 而非原告侧专用软件一同被评估
    notes: 这个市场的转换成本耐久度并不均匀；最硬的锁定在系统记录，而不是独立 AI copilots。
