      - number: '7.4'
        title: 买方集中、竞争与执行风险
        blocks:
          - type: paragraph
            body: >-
              Eve 的牵引力真实存在，但风险画像由牵引力所在位置决定。2026 年 1 月，公司称拥有超过 500 家领先原告律所且收入增长 10 倍；到 6 月，公司称更广的平台已在 900
              多家原告律所投入生产；首页现在称 1,200+ 家律所。这些都是强采用信号，但公开客户证据仍集中在 Mike Morse 和 James Scott Farrin
              等相对可见的旗舰原告律所周围。这不能证明存在危险的收入集中度，但确实说明参考价值、工作流学习和声誉杠杆集中在少数大型、成熟客户身上。公开材料没有披露流失、NRR、平均合同价值、席位集中度，或最大 logo
              贡献的使用占比。缺口很重要：如果少数高量律所暂停、切换或缩小范围，Eve 可能同时失去收入和推动新客获取的可信度。

              Eve 试图构建的东西本身放大了执行风险。一个窄口径法律 copilot 让人失望，不一定会压垮业务。一个承诺获客承接、分析、起草、夜间审计和跨案件智能的「AI
              操作系统」，必须同时同步产品质量、数据摄取、集成、客户变革管理和法律风险控制。Eve 自己的案例研究提到，需要 Chief AI
              Officer、可接受使用政策、治理审查和有意设计的变革管理，才能克服员工恐惧和工作流扰动。这一面是利好，因为它表明严肃客户正在深度嵌入产品；另一面是利空，因为部署成功取决于客户运营成熟度，而不只是产品需求。如果客户需要专职
              AI 负责人、定制 playbook 和大量实施支持，毛利率杠杆和续约耐久性可能低于纯自助 SaaS 叙事所暗示的水平。

              竞争风险也不再是假设。Thomson Reuters 和 RELX 没有等着看法律 AI 是否成立；它们已经在用 AI 采用推动核心法律业务增长。Thomson Reuters Institute
              的市场数据显示，法律 GenAI 采用在上升，而政策和培训滞后；RELX 的 2025 Form 20-F 称，其 Law Firms & Corporate Legal 分部在 Lexis+ AI 和
              Protégé 带动下实现两位数增长。同一份申报也警告，法律市场高度竞争且动态变化，AI 和新竞争者会迅速改变需求，隐私、网络安全、云、软件和大语言模型依赖都会伤害业绩。这些表述针对 RELX，但也说明 Eve
              的护城河为什么脆弱：既有巨头拥有经核验的法律内容、根深蒂固的分发渠道，以及吸收产品错误的资本。只要原告侧专业化和工作流深度仍显著领先这些既有巨头，Eve 仍能赢；但证明责任已经落在执行、治理和可量化客户 ROI
              上，而不只是功能新颖性。
