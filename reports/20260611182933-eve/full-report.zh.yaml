      - number: '2.3'
        title: 买方、用户、付款方与采用动态
        blocks:
          - type: paragraph
            body: >-
              原告律所的一线用户，就是已经接触案卷的人：intake 团队、律师助理、associate、partner 和运营人员。Eve 自家页面明确把
              partner、associate、律师助理和运营专业人士放入工作流，其他供应商的原告运营指南则聚焦 intake 表单、病历、起草、案件管理和和解后工作。但购买和付款并不是单个律师的决定。Wolters
              Kluwer 报告称，超过 90% 的受访者现在日常工作中至少使用一种 AI 工具，ABA Law Practice 对 8am 报告的摘要称，法律 AI 采用率同比增长超过一倍。但同一 8am
              摘要称，许多律所仍缺少正式政策、结构化培训和治理框架，这意味着规模化部署仍掌握在 managing partner、运营负责人、IT 或其他律所领导手中，而不是某个 associate
              单独选工具。原告侧采用由非常直接的 ROI 杠杆拉动：低于 30 秒的 intake 响应时间可以改善转化，大多数 PI
              案件会在庭审前和解，重复起草和记录工作会造成大量案头时间瓶颈。因此，原告律所的软件需求更像运营预算，而不是纯研究软件条线。
