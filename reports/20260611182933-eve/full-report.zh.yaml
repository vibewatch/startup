  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价不透明与客户推导的收入线索
        blocks:
          - type: paragraph
            body: >-
              Eve 在财务形态上更像面向原告法律的直销型 B2B SaaS 平台，而不是自助式法律工具。公开网站持续销售一整套操作系统——EveOS、AI Intake、Agents、起草、discovery
              和分析——但从不公布价目表。公司把潜在客户推向 demo 和销售电话；Head of Legal 职位还明确提到 MSA、Deal Desk
              审查、客户协议和合作合同。这一组合强烈暗示，销售由合同牵引、价格经谈判确定，并且收入确认前存在一定实施或法律开销。


              最好的公开牵引信号是客户数和工作流量，而不是美元收入。官方 Series B 材料称，截至 2025 年 9 月 Eve 已增长到 450 多家律所、每年 200,000 多个法律案件、客户回收金额超过 $3.5
              billion。到 2026 年，官方招聘把规模口径提高到 1,000+ 家律所，甚至称收入环比翻倍，但公司仍未披露绝对 ARR 或收入。因此只能做谨慎的基准建模。相邻法律软件供应商公开收费大约为每用户每月
              $49 至 $130，足以说明原告律所已经支付有意义的软件预算。但即便把这些基准套到 1,000 家律所，得出的也只是个位数百万到数千万美元的宽泛年化支出区间。换句话说，Eve
              明显已有可货币化规模，但公开档案仍无法精确锁定已实现 ACV、席位数或确认收入。
