    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与公开运营足迹
        blocks:
          - type: paragraph
            body: >-
              Eve 把自己定位为专为原告律所打造的法律 AI 平台，而不是通用法律研究助手。从官网、发布材料到独立报道，公司都在描述一套横跨 intake、评估、诉前、诉讼支持，并越来越延伸到全所运营的软件。到 2026 年
              6 月，公开产品表述已从案件工作助手转向「EveOS」：一个面向原告法律业务的 AI 操作系统，承诺提供 24/7 intake、AI
              生成起草、分析能力，以及面向律所的实时数据层。总部披露比产品披露更薄。独立融资报道一致称公司位于旧金山，但官网没有公布街道地址。法律实体层面的身份也没有品牌叙事那么干净：面向公众的品牌是
              Eve，但隐私材料反复提到 Butler Labs，SiliconANGLE 则称其为 Butler Labs Inc.。因此，Eve 的商业身份清楚，但其精确法律命名规则比营销表面更不透明。
