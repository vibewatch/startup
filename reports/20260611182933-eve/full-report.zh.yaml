      - number: '7.6'
        title: 图表
        blocks:
          - type: callout
            title: 核心法律风险是 agentic 范围，而不是一般 AI 使用
            body: Eve 最安全的时候，是它仍作为可审查的起草和分诊层。客户一旦让 agent 制定策略、传达法律意见，或在缺乏有意义人类审查时推进提交文件，风险就会陡升。
            calloutType: risk
            claimRefs:
              - CR013
              - CR015
              - CR016
          - type: callout
            title: 特权不是一次买断的产品功能
            body: 公开材料称 Eve 受特权保护，但 2026 年判例显示，特权和工作产品结果仍取决于平台保密、律师参与、所选输入和具体法院的法律原则。
            calloutType: risk
            claimRefs:
              - CR026
              - CR027
              - CR033
          - type: callout
            title: 既有巨头不需要复制 Eve 的工作流宽度，也能伤害 Eve 经济性
            body: 如果 LexisNexis 或 Thomson Reuters 能把可信内容、可接受 AI 治理和「足够好」工作流工具打包进既有订阅，Eve 的原告律所专业化必须持续证明可量化 ROI，才能守住价格和留存。
