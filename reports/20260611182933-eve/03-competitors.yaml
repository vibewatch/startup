- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Price / unit / contract model
  - Included capabilities
  - Discount / unknowns
  - Competitive implication
  rows:
  - - Eve
    - No public list pricing in reviewed sources; sales-led or demo-led motion
    - Plaintiff-native AI platform spanning intake, drafting, discovery, and analytics
    - Exact seat minimums, implementation fees, and usage-based terms are undisclosed
    - Pricing opacity may help enterprise packaging but weakens quick benchmarking against simpler suites
  - - EvenUp
    - No public list card in reviewed sources
    - Claims intelligence, PLAAS, drafting, communications, and lifecycle support
    - Exact per-case, per-seat, or page-based economics are not public
    - Lets EvenUp price to value, but makes side-by-side cost diligence harder
  - - Supio
    - Public materials promise flat pricing, no platform fees, and no page limits; no list card published
    - Intake, chronologies, litigation drafting, case economics, and firm intelligence
    - No public seat tiers, floor commitments, or services costs disclosed
    - Messaging is more buyer-friendly than Eve or EvenUp, but procurement still requires direct engagement
  - - Litify / Filevine / CloudLex / CasePeer
    - Mostly custom quote or demo-led in reviewed public materials
    - Matter management, intake, analytics, documents, and increasingly AI features
    - Public comparison-shopping is limited and net price likely depends on implementation scope
    - Favors incumbent upsell and bundling, especially where the vendor already owns the core workflow
  - - Clio
    - Starting at $49/user, with custom quotes for large firms
    - Intake, CRM, workflow automation, billing, documents, client portal, and Manage AI
    - Final package varies by tier, add-ons, and enterprise negotiation
    - Strong for smaller firms that want visible entry pricing and broad functionality without plaintiff specialization
  - - MyCase
    - $50 to $130/user/month billed annually, or $60 to $150 monthly depending on tier
    - Intake, workflow automation, billing, practice management, and legal AI features
    - Add-ons and actual firm mix still matter, but pricing is far more legible than plaintiff-native AI peers
    - Easier pilot math for small and midsize firms that are not ready to swap systems
  - - PracticePanther
    - $49 to $89/user/month billed annually, with higher monthly prices up to $99
    - Intake forms, custom workflows, calendaring, billing, accounting, and legal practice management
    - Advanced financial features sit in higher tiers
    - Most transparent path for budget-conscious firms, but weakest plaintiff-native differentiation
  notes: This table compares public packaging signals, not negotiated net price or workload-specific ROI.
  claimRefs:
  - CP012
  - CP027
  - CP029
  - CP031
  - CP046
  - CP049
- id: TP004
  title: Switching cost / distribution power table
  columns:
  - Rival class
  - Lock-in or multi-homing driver
  - Public evidence
  - Implication for Eve
  - Diligence ask
  rows:
  - - Eve itself
    - Works with an existing CMS or stands alone, which lowers deployment friction but can limit hard lock-in
    - Eve says its AI-ready data works with an existing CMS or on its own
    - Strong land motion, weaker moat unless Eve becomes daily system of record
    - Ask what share of customers run Eve as primary system versus overlay
  - - Supio and similar overlays
    - Integration-first architecture makes AI layering easier without ripping out the CMS
    - Supio names integrations with Westlaw, Litify, MyCase, and CasePeer
    - Buyers may run multiple AI layers before consolidating
    - Request attach rates, coexistence patterns, and win-loss against overlay deployments
  - - EvenUp
    - Specialized data and workflow training can create process dependence inside PI operations
    - EvenUp markets Piai and broad lifecycle automation across PI cases
    - Pre-lit specialization could remain sticky even if Eve broadens across the firm
    - Ask whether EvenUp expands from demands into system-of-record territory or remains modular
  - - Litify / Filevine / CloudLex / CasePeer
    - Existing matter data, intake flows, reporting, calendars, and billing create classic system-of-record switching cost
    - Public product pages emphasize intake, matter plans, analytics, documents, and payments
    - Hardest incumbent obstacle for Eve, especially in established plaintiff firms
    - Measure migration cost, implementation time, and whether Eve displaces or coexists with each suite
  - - Clio / MyCase / PracticePanther
    - Lower public entry pricing and broader practice coverage reduce pilot friction for smaller firms
    - Public tiered pricing and general practice management breadth are clearly disclosed
    - Can cap Eve's SMB reach if the firm prefers cheaper good-enough software plus add-on AI
    - Ask what firm size and case complexity reliably trigger upgrade into Eve
  - - Harvey / CoCounsel / Lexis+
    - Distribution through premium legal subscriptions, research habits, and existing procurement channels
    - Harvey scale, CoCounsel workflow claims, and Lexis grounded drafting/research are all public
    - These vendors can swallow drafting and research budget before Eve wins the whole workflow
    - Ask how often Eve is evaluated against general legal AI versus plaintiff-specific software
  notes: Switching-cost durability is uneven across this landscape; the hardest lock-in sits with systems of record, not with stand-alone AI copilots.
