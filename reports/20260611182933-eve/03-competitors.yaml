- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Plaintiff-only positioning sharpens workflow fit and sales language
    - EvenUp, Supio, CloudLex, CasePeer, LawPro, and ProPlaintiff also sell directly into PI workflows
    - Medium
    - Validate whether Eve wins more often because of breadth, brand, or measured case outcomes
  - - Breadth from intake through discovery supports an operating-system thesis
    - Drafting and research layers can be commoditized by Harvey, CoCounsel, Lexis+, and Paxton
    - High
    - Measure daily active usage by workflow, not just logo count
  - - Plaintiff-native data structure could become a defensible flywheel
    - EvenUp markets the largest PI dataset and Supio markets verified outputs and case intelligence
    - High
    - Request evidence of proprietary data advantage, feedback loops, and outcome improvement over time
  - - Optional CMS overlay lowers adoption friction
    - The same optionality can preserve multi-homing and reduce lock-in
    - High
    - Check whether Eve can become the primary operating layer rather than a productivity add-on
  - - Capital and category momentum make Eve relevant in enterprise-style deals
    - EvenUp is larger on disclosed funding and Harvey dwarfs the plaintiff category in capital access
    - Medium
    - Review hiring pace, services capacity, and sales efficiency versus peer-funded rivals
  - - Incumbent case-management vendors may move slower on AI innovation
    - They already own matter data, intake flows, reporting, payments, and user habits
    - High
    - Study actual rip-and-replace win rates against Litify, Filevine, CloudLex, and CasePeer
  - - Buyer trust can favor verified, plaintiff-specific workflows over generic copilots
    - Supio directly attacks Eve on hallucination, integrations, and litigation-grade verification
    - High
    - Review quality controls, source traceability, and customer references on complex litigated matters
  - - Pricing opacity preserves flexibility
    - It also makes ROI harder to benchmark against transparent suite pricing from Clio, MyCase, and PracticePanther
    - Medium
    - Request current price cards, implementation fees, and payback benchmarks by firm size
  notes: The core durability question is whether Eve can turn breadth and plaintiff specialization into daily operating dependence before incumbents and generalized AI flatten the visible feature gap.
