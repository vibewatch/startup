company:
  name: Eve
chapter:
  number: 3
  title: Competitors
  summary: |-
    Eve sits in an unusually crowded plaintiff-legal-AI lane. EvenUp and Supio are the closest direct peers, but they attack from
    different angles: EvenUp from scaled pre-litigation claims operations and Supio from medical-record depth, litigation readiness,
    and human-verified outputs. The more durable threat may be two-sided: incumbent plaintiff case-management suites such as Litify,
    Filevine, CloudLex, and CasePeer already own the system-of-record layer, while Harvey, CoCounsel, Lexis+ with Protégé, and Paxton
    can commoditize research and drafting wedges. Eve’s strongest public differentiation remains the combination of plaintiff
    specialization, intake through discovery breadth, and explicit “operating system” ambition, but pricing opacity, multi-homing,
    and incumbent distribution all limit how hard that edge can become.
sections:
- id: direct-plaintiff-ai-peers
  title: Direct plaintiff-AI peers and the closest overlap with Eve
  body: |-
    The closest direct overlaps with Eve are EvenUp and Supio, not the broader legal-AI field. EvenUp has expanded well beyond demand
    letters into a plaintiff-specific claims platform spanning intake, treatment, demands, negotiation, discovery, trial, executive
    analytics, and communication agents. That makes it more than a pre-lit point tool, but its public story is still rooted in
    claims intelligence and personal-injury volume. Supio overlaps even more directly with Eve’s current direction. It explicitly
    markets intake, chronologies, demand letters, litigation drafting, cross-case analysis, and firm intelligence, while also
    emphasizing mass torts and human-verified outputs. In other words, Supio is trying to own not just one workflow but the record,
    argument, and insight layer around plaintiff litigation. Darrow is relevant but different: it works upstream on legal-exposure
    detection and matter origination rather than on running a plaintiff firm day to day. Smaller entrants such as ProPlaintiff and
    LawPro.ai also show that medical chronology, demand generation, and agentic case support are already spawning narrower challengers.
