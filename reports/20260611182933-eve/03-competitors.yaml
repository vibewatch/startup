  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Current 2026 order forms, minimum seat commitments, implementation fees, and realized net pricing for Eve, EvenUp, Supio, Litify, Filevine, CloudLex, and CasePeer.
    whyItMatters: Public ROI benchmarking is weak without real contract structure, which limits underwriting on replacement risk and expansion potential.
    diligencePath: Request current price cards, sample MSAs/SOWs, and three anonymized recent customer quotes by firm size.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: Net revenue retention, gross logo retention, seat expansion, and module-attach data for Eve and the direct plaintiff-AI peers.
    whyItMatters: Durable software moats depend on repeat usage and expansion, not just logo growth or funding headlines.
    diligencePath: Request cohort-level retention dashboards, board materials, and pipeline-to-renewal data by product module.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP005
  - type: conflicting-data
    severity: material
    topic: customer-scale
    missingEvidence: Apples-to-apples run-date customer counts for Eve, EvenUp, and Supio using one consistent definition of active firm or paying account.
    whyItMatters: Public scale claims are directionally impressive but hard to compare because they mix dates, definitions, and marketing surfaces.
    diligencePath: Ask management for a dated competitive scale table using the same definition of customer, firm, and active matter.
    relatedQuestionRefs:
    - QP014
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: material
    topic: multi-homing
    missingEvidence: Public or customer-backed evidence on how often firms keep Litify, Filevine, CloudLex, or CasePeer as system of record while layering Eve, Supio, EvenUp, or Paxton on top.
    whyItMatters: Multi-homing can cap platform stickiness even if the AI layer delivers clear productivity gains.
    diligencePath: Request implementation maps from recent wins and losses, including coexistence duration and module replacement sequence.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: medical-accuracy-benchmark
    missingEvidence: Neutral head-to-head benchmarks comparing Eve, Supio, EvenUp, LawPro, and other vendors on chronology accuracy, source traceability, and litigation-grade output quality.
    whyItMatters: Public marketing claims on verification and chronology quality are central to competitive positioning but remain largely vendor-authored.
    diligencePath: Run a blinded benchmark using shared case files and externally scored chronology, demand, and discovery tasks.
    relatedQuestionRefs:
    - QP011
    - QP018
    relatedTableRefs:
    - TP002
