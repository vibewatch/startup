- id: differentiation-durability-and-competitive-risk
  title: Differentiation durability, switching cost, and where Eve can still win
  body: |-
    Eve’s best public case is not that it does one plaintiff task better than everyone else. It is that it is trying to connect the
    whole plaintiff operating loop: always-on intake, case qualification, medical synthesis, drafting, research, discovery, and
    firm-level analytics in one plaintiff-native surface. That is more ambitious than EvenUp’s public pre-lit scale story, broader
    than LawPro or ProPlaintiff’s point-solution wedges, and more AI-native than incumbent case-management suites. But durability is
    still conditional. Supio’s messaging shows that litigation-depth and human verification are already active attack lines against
    Eve. EvenUp’s funding and customer scale show that pre-lit specialization can still outrun broader-platform narratives. Litify,
    Filevine, CloudLex, and CasePeer hold the system-of-record relationships that create real switching friction. And general legal AI
    vendors can compress the value of drafting and research into broader subscriptions. So Eve’s moat likely depends on whether it can
    turn plaintiff specialization plus workflow breadth into data flywheels, daily operating dependence, and measurable ROI before
    incumbents and generalized AI vendors catch up on the visible feature set.
