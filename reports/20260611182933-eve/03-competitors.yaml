- id: general-legal-ai-and-adjacent-substitutes
  title: General legal AI, adjacent entrants, and what they can substitute
  body: |-
    Harvey, CoCounsel, Lexis+ with Protégé, and Paxton matter because they can absorb portions of Eve’s workflow without becoming
    plaintiff operating systems. Harvey now sells agents that execute legal work end to end and has the scale, funding, and law-firm
    adoption to become a serious procurement alternative whenever a buyer wants one premium AI partner across many practice areas.
    CoCounsel and Lexis+ with Protégé bring a different kind of distribution power: trusted legal content, legal research workflows,
    due-diligence tooling, and grounded citation infrastructure. Those platforms are not built around plaintiff intake, medical
    chronology, settlement operations, or firm-specific PI analytics, but they can still commoditize research, drafting, and review.
    Paxton sits even further toward the copilot end of the spectrum. Its public materials emphasize drafting, document analysis,
    contextual research, medical chronologies, and billing summaries, which makes it a plausible layer for smaller firms that want AI
    assistance without replacing their current system of record. The implication is that Eve cannot defend itself only on drafting or
    research quality; it needs plaintiff-native workflow depth and operating leverage that broader legal AI does not publicly show.
  claimRefs:
  - CP033
  - CP034
  - CP035
  - CP036
  - CP037
  - CP038
  - CP042
  - CP045
