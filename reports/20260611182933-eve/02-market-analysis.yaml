chapter:
  number: 2
  title: Market Analysis
  summary: 'Eve is serving a real but much narrower market than generic legal AI: U.S. plaintiff-side firms whose economics are driven by intake speed, medical-record throughput, demand generation, discovery execution, and settlement operations. Public data supports a bounded sizing view rather than a clean universal TAM: the U.S. bar reached 1.37 million lawyers in 2025, Clio estimates 135,000-plus personal injury lawyers and roughly 400,000 annual PI claims, and plaintiff economics are reinforced by a $61.7 billion PI-lawyer revenue pool plus heavy class-action and MDL activity. Adoption drivers are strong because plaintiff firms live on contingency and settlement velocity, but trust, confidentiality, client-funds controls, and uneven AI governance make plaintiff deployment more controls-intensive than BigLaw or defense experimentation.'
sections:
- id: market-boundary-and-status-quo
  title: Market boundary, adjacencies, and status-quo substitutes
  body: 'Eve’s served market is narrower than “legal AI” and wider than a single personal-injury point solution. Official Eve pages say the product is built for plaintiff law firms and is used across intake, medical overview, demand drafting, discovery responses, and broader operations. Eve also explicitly names plaintiff-side practice areas including personal injury, workers’ compensation, medical malpractice, labor and employment, mass torts, and Social Security disability. That matters because the status quo in plaintiff firms is not just Westlaw-style research or generic chatbots. Competitor and workflow sources from Smokeball, CloudLex, CasePeer, and Paxton all describe plaintiff work as an intake-to-settlement operating system: client screening, medical-record collection, chronology building, drafting, settlement tracking, lien handling, and disbursement. In other words, the included spend is case-lifecycle workflow labor and software for contingency plaintiff practices; the excluded
    spend is most defense-only e-discovery, generalized BigLaw knowledge tools, or broad legal-research budgets that never touch plaintiff operations. The core substitute set is human labor, legacy case-management software, outsourced records and lien vendors, and generic AI that still needs heavy plaintiff-specific prompting and review.'
