- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Evidence
  - Implication
  - Diligence ask
  rows:
  - - Contingency economics reward faster cycle time
    - Driver
    - Current
    - Cash realization depends on case selection, speed, and outcomes
    - Workflow automation has direct ROI in plaintiff firms
    - Benchmark time-to-settlement and time-on-desk by matter type
  - - Intake responsiveness lifts signed-case conversion
    - Driver
    - Immediate
    - Eve cites a 40% conversion lift and sub-30-second response times in an intake case study
    - 24/7 intake is a wedge product, not a nice-to-have
    - Validate conversion delta in customer cohorts
  - - Medical-record and demand work is repetitive and high-volume
    - Driver
    - Immediate
    - Plaintiff workflow sources center on records, chronologies, drafting, and discovery
    - Purpose-built automation fits recurring plaintiff tasks better than generic chat
    - Sample error rates and attorney review burden
  - - Settlement-heavy case mix favors pre-trial ops over trial-only tools
    - Driver
    - Current
    - Clio says ~95% of PI cases settle before trial
    - Pre-litigation workflow speed matters more than generic research breadth
    - Measure settlement-cycle compression and backlog reduction
  - - Legal AI use is already mainstream
    - Driver
    - Current
    - 69% to 90%+ legal-workflow AI use rates appear across 8am, Clio, and Wolters
    - Education burden is lower than in 2023-style pilot markets
    - Segment adoption by firm size and practice mix
  - - Governance and training gaps slow rollout
    - Constraint
    - Current
    - 8am / ABA says many firms still lack formal policies, training, and governance frameworks
    - Firmwide deployment requires leadership oversight and change management
    - Review deployment playbooks and admin ownership
  - - Confidentiality, hallucination, and verification risk
    - Constraint
    - Current
    - ABA 512, NYSBA, and Thomson Reuters ethics guidance all stress competence and verification
    - Human review and source traceability are mandatory purchase conditions
    - Inspect citation traceability and QC workflow
  - - Trust accounting and contingent-fee compliance
    - Constraint
    - Current
    - Rules 1.5, 1.15, and trust-record rules govern remittance and client funds
    - Settlement/disbursement errors can block adoption even if drafting quality is good
    - Audit settlement statement, trust-ledger, and disbursement controls
  notes: Rows focus on factors that materially change adoption pace, renewal durability, or valuation relevance. Evidence blends direct workflow sources, legal-market surveys, and binding professional-responsibility rules.
