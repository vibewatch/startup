- id: constraints-regulation-and-trust
  title: Adoption constraints, regulation, and trust requirements
  body: Plaintiff-side workflow differs from BigLaw or defense not only because the matters are different, but because the business model and risk model are different. Thomson Reuters notes that large firms historically defended against plaintiff contingent-fee cases while generally smaller plaintiff firms captured the upside when those cases worked. Under contingency economics, faster intake, cleaner case selection, better medical synthesis, faster demand production, and tighter settlement handling all feed directly into cash conversion. Regulation reinforces that operational specificity. ABA Formal Opinion 512 says lawyers using generative AI still owe competence, confidentiality, communication, supervision, candor, and reasonable-fee duties. Rule 1.5 requires written contingent-fee mechanics and written remittance statements at the end of a recovery. Rule 1.15 and the ABA trust-account-record rules require segregated client funds and maintained disbursement records. NYSBA’s 2026 guardrails
    article says hallucinations continue to produce sanctions, and Thomson Reuters’ ethics guidance stresses that lawyers still have to verify citations and treat AI like an assistant rather than an autonomous lawyer. This makes trust controls, source traceability, human review, and settlement-grade operational discipline central purchase conditions for plaintiff firms.
