- calloutType: risk
  title: Trust and governance can be stronger purchase gates than raw feature breadth
  body: Plaintiff firms can see clear ROI from faster intake and lower desk time, but they also face sanctions risk, confidentiality duties, client-funds rules, and remittance obligations. Tools that cannot show source traceability, human review, and settlement-grade controls will struggle to become system-of-record workflow products even if the drafting looks good.
  claimRefs:
