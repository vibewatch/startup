- id: buyer-user-payer-and-adoption
  title: Buyer, user, payer, and adoption dynamics
  body: 'The day-to-day users in plaintiff firms are the people already touching the case file: intake teams, paralegals, associates, partners, and operations staff. Eve’s own pages explicitly place partners, associates, paralegals, and operations professionals in the workflow, while plaintiff-operations guides from other vendors focus on intake forms, medical records, drafting, case management, and post-settlement work. Buying and paying, however, are not individual-attorney decisions. Wolters Kluwer reports that more than 90% of respondents now use at least one AI tool in daily work, and the ABA Law Practice summary of the 8am report says legal-AI adoption has more than doubled year over year. But the same 8am summary says many firms still lack formal policies, structured training, and governance frameworks, which implies that scaled deployment still sits with managing partners, operations leaders, IT, or other firm leadership rather than with a single associate choosing a tool. Plaintiff-side
    adoption is pulled by unusually direct ROI levers: sub-30-second intake response times can improve conversion, most PI cases settle before trial, and repetitive drafting and records work create major desk-time bottlenecks. That is why plaintiff-firm software demand behaves like an operations budget, not a pure research-software line item.'
