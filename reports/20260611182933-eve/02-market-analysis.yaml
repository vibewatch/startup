  evidenceGaps:
  - type: missing-source
    severity: material
    topic: plaintiff-firm-count
    missingEvidence: A current public census of U.S. plaintiff firms segmented across personal injury, mass tort, and class action.
    whyItMatters: Without a clean firm-count denominator, SAM and SOM can only be bounded with lawyer, claims, and litigation-volume proxies.
    diligencePath: Compile state-bar directories, legal-market databases, and plaintiff-association rosters into a deduped firm census.
    relatedQuestionRefs:
    - QM024
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: Actual plaintiff-firm software budget line items, approval chains, and willingness-to-pay by firm size.
    whyItMatters: The buyer/user/payer model is clear directionally, but exact ACV and budget-owner assumptions affect go-to-market and TAM quality.
    diligencePath: Request win/loss notes, customer contracts, and deployment-owner interviews segmented by small, regional, and mass-tort firms.
    relatedQuestionRefs:
    - QM012
    - QM025
    relatedTableRefs:
    - TM003
  - type: enumeration-incomplete
    severity: material
    topic: segment-volume
    missingEvidence: Consistent public counts splitting plaintiff case volume across state-court PI, federal torts, MDLs, and class actions in one normalized dataset.
    whyItMatters: Different public datasets illuminate different parts of the plaintiff bar, making apples-to-apples segment sizing difficult.
    diligencePath: Normalize NCSC, U.S. Courts, FJC, and MDL docket data into a single segmentation model with explicit overlap rules.
    relatedQuestionRefs:
    - QM008
    - QM024
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: minor
    topic: deployment-roi
    missingEvidence: Independent cohort data showing plaintiff-firm ROI by workflow after onboarding, including review burden and error rates.
    whyItMatters: Vendor claims show strong potential, but valuation-quality market analysis needs customer-level proof of repeatable gains and trust-control performance.
    diligencePath: Collect anonymized before/after metrics from reference customers across intake, drafting, and settlement workflows.
    relatedQuestionRefs:
    - QM014
    - QM015
    - QM016
    relatedTableRefs:
    - TM004
