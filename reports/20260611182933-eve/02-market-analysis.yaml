tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend / workflows
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Personal injury plaintiff firms
    - Intake, medical records, chronologies, demand drafting, discovery, settlement tracking, disbursement
    - Defense research, defense-only doc review, generic knowledge tools not tied to plaintiff operations
    - Firm operating budget controlled by leadership; used by intake staff, paralegals, attorneys
    - Primary served market
  - - Mass tort plaintiff platforms
    - Claimant screening, records review, fact sheets, MDL coordination, settlement administration
    - Defense common-benefit or product-defense workflows outside claimant operations
    - Litigation leadership and operations budget
    - Core plaintiff adjacency with bursty volume
  - - Class action / employment plaintiff firms
    - Claimant intake, communications, pleadings, discovery, settlement notice/admin workflows
    - Defense-side compliance investigations and hourly defense research
    - Practice leadership plus operations budget
    - Expandable plaintiff segment with similar workflow logic
  - - Adjacent plaintiff specialties
    - Workers’ compensation, medical malpractice, SSDI, and similar contingency or claimant workflows
    - General legal practice outside claimant-heavy operations
    - Department head or managing partner budget
    - Supports same workflow engine beyond auto PI
  - - Status-quo substitute stack
    - Human intake teams, paralegals, case-management suites, records/lien vendors, generic AI tools
    - Pure research-only spend with no operational embed
    - Same firm operating budget already paying for people and point tools
    - Defines the real replacement baseline
  notes: Included and excluded spend are bounded around plaintiff-side workflow execution, not the full legal-software universe; buyer/payer labels summarize the evidence-backed operating pattern rather than a universal job title.
