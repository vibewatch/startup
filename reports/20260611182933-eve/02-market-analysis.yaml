callouts:
- calloutType: insight
  title: Plaintiff law behaves like an operations market, not a pure research market
  body: 'The consistent pattern across Eve, plaintiff-workflow vendors, and legal-market surveys is that the economic wedge is operational throughput: intake conversion, medical-record processing, drafting speed, and settlement handling. That makes the plaintiff bar a better fit for vertical workflow AI than for generic research-only tools.'
  claimRefs:
