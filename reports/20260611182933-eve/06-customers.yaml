- id: adoption-trajectory-and-roi
  title: Adoption trajectory and publicly disclosed ROI signals
  body: Eve now has enough dated public milestones to show real adoption momentum, even if the exact live total still moves with each announcement. LawNext reported more than 500 plaintiff firms in January 2026, Above the Law cited 800-plus in March, Eve and its April release said 1,000-plus firms and more than 200,000 cases, and June materials move the public range to 1,200-plus on Eve’s own site and as high as 1,400 in LawNext’s EveOS coverage. That progression is directionally strong even though the June denominator is not perfectly harmonized across sources. The ROI evidence is also stronger than a generic “saves time” promise, but it remains case-study grade rather than audited cohort data. Mike Morse says capacity doubled or tripled; James Scott Farrin says medical summaries dropped from weeks to minutes and one attorney’s case cycle fell from seven to eight months to four; Frontier says lead conversion rose from 10% to 35%, intake time dropped by 50 minutes, and average case value
    rose 90%; Jeffrey Glassman says 90% of demands were running through Eve within roughly three months. These are meaningful operating metrics because they touch conversion, cycle time, capacity, and case economics, but they are self-reported by featured customers and should be treated as proof of possibility, not portfolio-average performance.
