- id: expansion-durability-and-constraints
  title: Expansion upside, durability limits, and commercial constraints
  body: 'The expansion opportunity is real because Eve’s wedge is not a single document task. Official materials and customer stories show a path from intake to pre-litigation, litigation support, and firm intelligence, while the reference customers span both high-volume PI and plaintiff-side employment. Existing-CMS coexistence also expands the addressable buyer set by lowering rip-and-replace pressure; Eve now describes itself as complementary to case-management systems, and public references mention CRM sync and upcoming Jove integration. But the durability evidence is still materially thinner than the adoption evidence. Public sources do not disclose NRR, GRR, churn, contract duration, or top-customer concentration, and the visible review sample is too small to stand in for renewals. Pricing opacity is another drag: buyers still need a demo and quote, with outside reviewers pointing to integration, migration, onboarding, and training costs as real budget variables. Finally, legal-AI
    governance remains a gating factor. New York bar guidance and sanctions commentary reinforce that any scaled deployment still needs confidentiality controls, supervision, verification, and fee sensitivity. That means Eve’s best expansion loop is consultative land-and-expand inside sophisticated plaintiff firms—but that same motion is slower, more expensive, and more governance-bound than a lightweight seat-sale product.'
