- id: buyer-user-payer-and-onboarding
  title: Buyer, user, payer, and onboarding motion
  body: 'The user map is now fairly clear from the customer stories. Eve gets used by intake teams, paralegals, attorneys, practice heads, operations staff, and legal-tech leaders because it sits in the case workflow rather than on the periphery. The buyer and payer map is less explicit but still inferable: public deployments are championed by owners, managing partners, firm operations leaders, and legal-technology heads, not by one associate swiping a card. Eve’s own site reinforces that pattern because the commercial motion is schedule-a-call, walkthrough, and waitlist-driven rather than a posted self-serve plan. Implementation also looks consultative. James Scott Farrin built an implementation team, verified SOC2 and HIPAA posture, and signed an Acceptable Use Policy; Mike Morse led internal demos to address fear; Hershey built playbooks by phase; Frontier framed adoption around demonstrating a real use case live. The recurring pattern is land on one acute bottleneck—intake, medical chronology,
    demand drafting, or trial prep—then expand into adjacent workflows and eventually firm-level intelligence. That is a sensible plaintiff-firm sales motion, but it also means onboarding is labor-intensive and change-management heavy, which likely favors regional and scaled firms over pure solo self-service today.'
