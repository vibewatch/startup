- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Constraint / concentration risk
  - Impact
  - Current public read
  - Diligence path
  rows:
  - - Expand from intake into pre-lit, litigation, and analytics
    - Workflow breadth raises implementation scope
    - Can raise ACV and stickiness, but slower onboarding
    - Supported by official product map and customer stories
    - Request module-by-module attach rates and implementation times
  - - Move across plaintiff practice areas
    - Need playbooks and data models tuned for each specialty
    - Increases TAM beyond auto PI
    - Supported by employment, workers’ comp, SSDI, med-mal references
    - Request customer count by practice area and proof beyond curated stories
  - - Coexist with existing CMS / CRM
    - Integration depth may become a bottleneck
    - Lowers rip-and-replace friction but may cap system-of-record control
    - Supported by CMS-complement messaging and Jove integration reference
    - Request live integrations, data write-back scope, and failure rates
  - - Firm-wide rollout from one champion team
    - Change-management and policy work can stall expansion
    - Critical for scaling beyond pilot success
    - Strongly supported by Mike Morse, Farrin, and Hershey stories
    - Request implementation playbook, admin burden, and time to multi-team rollout
  - - Use marquee reference firms as sales leverage
    - Top-customer concentration remains undisclosed
    - Great for sales efficiency, but revenue concentration cannot be assessed
    - Publicly unresolved
    - Request top-10 customer revenue share and logo-level ARR concentration
  - - Sales-led pricing and services
    - Opaque pricing can widen procurement friction for smaller firms
    - May bias fit toward larger or more urgent buyers
    - Supported by review pages and no public pricing
    - Request price book, package definitions, and services vs software mix
  notes: Expansion paths are evidence-backed; concentration fields remain open because no public source discloses top-customer revenue share, channel mix, or renewal cohorts.
