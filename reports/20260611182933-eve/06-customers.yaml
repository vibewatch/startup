  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: Cohort-level renewal, churn, GRR, NRR, contract term, and seat expansion data by customer segment.
    whyItMatters: Without retention disclosure, the chapter can show adoption and anecdotes but not true durability or payback quality.
    diligencePath: Request board or investor reporting on gross retention, net retention, logo churn, and median contract duration for the last 4 quarters.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: A real price book or signed-order examples showing package structure, implementation fees, seat logic, and services mix.
    whyItMatters: Pricing opacity limits assessment of SMB fit, sales efficiency, and whether growth is software-led or services-heavy.
    diligencePath: Request standard pricing tiers, implementation-scoping template, discount ranges, and 5 anonymized recent deals across different firm sizes.
    relatedQuestionRefs:
    - QU013
    - QU014
    relatedTableRefs:
    - TU005
    - TU006
  - type: conflicting-data
    severity: minor
    topic: customer count
    missingEvidence: A reconciled company statement explaining whether June 2026 live customer count is 1,200-plus or 1,400-plus and what each number measures.
    whyItMatters: Trajectory is clear, but the exact current installed base is a visible diligence question for market-share and sales-efficiency analysis.
    diligencePath: Ask management to reconcile homepage, press, and independent-media counts against the internal definition of paying customer and active matter.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-customer revenue share, channel contribution, and whether any marquee plaintiff firms account for an outsized share of ARR or references.
    whyItMatters: A reference-heavy enterprise motion can look strong publicly while still carrying real concentration or channel dependence risk.
    diligencePath: Request top-10 customer ARR share, revenue by customer-size cohort, channel-sourced ARR share, and reference-program dependency metrics.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU005
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: buyer budget owner
    missingEvidence: Actual procurement records showing which title signs and pays for Eve across boutique, regional, and scaled plaintiff firms.
    whyItMatters: Public stories identify champions and users but not the precise budget owner, which affects sales-cycle forecasting and expansion strategy.
    diligencePath: Request CRM extracts or anonymized deal summaries showing buyer title, payer entity, procurement steps, and sales-cycle length by segment.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU001
    - TU006
