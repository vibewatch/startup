company:
  name: Eve
chapter:
  number: 6
  title: Customers
  summary: 'Eve has credible public customer proof across multiple U.S. plaintiff-firm segments, with named references in personal injury and employment plus visible adoption growth from 500+ firms in January 2026 to 1,000+ in April and 1,200+ to 1,400 by June depending on source and date. The strongest evidence points to a consultative, workflow-led sales motion sold to firm leadership and rolled out across intake, paralegals, attorneys, and operations rather than as a self-serve seat purchase. What remains weak is durability evidence: public sources do not disclose retention, renewal, concentration, or contract terms, and deployment still appears gated by pricing opacity, change management, security review, and human-verification requirements.'
sections:
- id: customer-segments-and-proof
  title: Customer segments, practice-area fit, and visible proof
  body: 'Public evidence supports a narrower and more credible customer story than the generic phrase “legal AI.” Eve is clearly marketed for plaintiff firms, not for the whole law-firm universe, and its public practice-area footprint already spans personal injury, labor and employment, workers’ compensation, Social Security disability, and medical malpractice. The named customer set is also more varied than a pure auto-PI wedge. Mike Morse and Jeffrey Glassman anchor large personal-injury references, James Scott Farrin adds a scaled Mid-Atlantic plaintiff platform with workers’ compensation and SSDI depth, while Hershey Law and Frontier Law Center show that Eve can land in plaintiff-side employment work. Geographically, the visible references are U.S.-centric but broad: Michigan, North and South Carolina, California, and Massachusetts are all represented in public materials. That is enough to show the product can travel across plaintiff subsegments and state-level workflows, but not enough
    to prove a balanced national customer mix or strong international reach. The best reading is that Eve has moved beyond a single-firm or single-practice proof point into a multi-logo plaintiff sample, yet still relies on a curated set of public stories rather than a fully disclosed customer roster.'
