- id: TU006
  title: Sales motion and onboarding table
  columns:
  - Stage
  - Who leads
  - Public evidence
  - Why it matters
  - Observed friction
  rows:
  - - Discovery / demo request
    - Founder, managing partner, ops, or legal-tech lead
    - Schedule-a-call, walkthrough, demo, and quote-led pages dominate public motion
    - Commercial entry is consultative, not self-serve
    - Pricing opacity and vendor dependence early
  - - Problem mapping
    - Implementation team + Eve
    - Farrin interviewed departments; Frontier focused on real use cases; Mike Morse led live demos
    - Sale appears to anchor on the worst workflow bottleneck first
    - Requires internal time and champion bandwidth
  - - Security / policy review
    - Ops / legal-tech / firm leadership
    - Farrin verified SOC2 and HIPAA; NYC and NYSBA guidance stress confidentiality and supervision
    - Necessary gate before scaled deployment
    - Governance review can slow cycle time
  - - Champion pilot
    - Skeptics or power users
    - Jeffrey Glassman used skeptical attorneys; Mike Morse and Hershey built tailored playbooks
    - Adoption sticks when respected users convert
    - Change resistance and job-fear are real blockers
  - - Department rollout
    - Operations + department heads
    - Hershey staged rollout by team; Farrin expanded across a 300-person firm
    - Turns a successful use case into embedded workflow
    - Training and support load rises quickly
  - - Expansion / feedback loop
    - Leadership + Eve team + developers
    - Weekly Farrin meetings, Jove integration, CMS-complement messaging
    - Land-and-expand depends on customization and integration quality
    - Customer success burden may constrain smaller accounts
  notes: This table synthesizes a recurring public pattern from named deployments and official CTAs. It reflects how Eve appears to sell and implement in practice, not a disclosed internal sales playbook.
