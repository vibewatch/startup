- id: TE006
  title: Confirmed vs. company-claimed table
  columns:
  - Topic
  - What is confirmed
  - What remains company-claimed
  - Why the distinction matters
  - Diligence ask
  rows:
  - - Workflow breadth
    - Independent coverage and customer stories confirm intake, drafting, auditing, analytics, and trial-support usage
    - Exact attach rates and production usage by module
    - Breadth creates stickiness only if modules are widely adopted, not just launched
    - Request module-level DAU/WAU and penetration by cohort
  - - Firm-count scale
    - Public sources show a rising narrative from 500+ to 1200+ firms across 2026 surfaces
    - Active logos, retained logos, and paying firms by module
    - Scale quality matters more than headline logo count
    - Request active customer count, GRR/NRR, and paid-vs-pilot split
  - - Product outcomes
    - Case studies show real use, transcript triggers, and courtroom support
    - Most productivity and settlement uplift metrics
    - ROI claims drive valuation and switching-cost narratives
    - Request pre/post cohorts, baselines, and independently reviewable case samples
  - - Verification quality
    - Inline sourcing and human review controls are real product concepts
    - Publicly benchmarked hallucination, citation, and approval-pass rates
    - Courtroom risk depends on realized control performance, not UI claims
    - Request eval pack, sampling methodology, and post-incident RCA process
  - - Integration and data portability
    - Clio sync and Atlas intent are confirmed
    - Breadth of supported systems, export completeness, and API maturity
    - OS-level positioning depends on real interoperability
    - Request API docs, partner list, and export/import test data
  - - Security / compliance
    - Public claims cover SOC 2, HIPAA, AES-256, isolation, and zero-retention
    - Certification scope, controls tested, and incident history
    - Buyers need control detail, not just labels
    - Request trust center materials, latest report dates, and security architecture review
  - - Deployment speed
    - Company says firms can go AI-native in 90 days or less
    - Median time to live, failed implementations, and services burden
    - Fast deployment is part of the sales narrative and affects real switching cost
    - Request onboarding funnel metrics and implementation staffing model
  notes: This table separates product facts visible in the public file from marketing claims that still need technical or operating-data confirmation.
