  - CE042
- calloutType: risk
  title: Verification marketing is helpful, but not enough to underwrite legal-output risk
  body: Eve has visible controls—inline sources, human review, and trust-language—but the March 2026 filing incident and wider sanction wave show that citation and logic failures can still survive into court if workflow discipline breaks down.
  claimRefs:
