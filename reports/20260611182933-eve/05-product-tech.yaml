  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: deployment-benchmarks
    missingEvidence: Median implementation time, services burden, failed rollouts, and onboarding staffing by customer segment.
    whyItMatters: Deployment speed is part of Eve’s switching-cost and expansion narrative, but the public file does not show whether implementations really land quickly and repeatedly.
    diligencePath: Request onboarding funnel metrics, sample implementation plans, and a cohort of recent go-lives with target versus actual timelines.
    relatedQuestionRefs:
    - QE012
    relatedTableRefs:
    - TE006
  - type: missing-source
    severity: material
    topic: status-and-reliability
    missingEvidence: Public status page, uptime history, incident disclosures, and service-level reporting for customer-facing workflows.
    whyItMatters: A workflow-native legal product becomes operationally critical; without reliability evidence, buyers cannot judge whether automation risk is merely model risk or also platform risk.
    diligencePath: Request SLA terms, incident log, uptime reports, and any postmortem examples for production outages or degraded model behavior.
    relatedQuestionRefs:
    - QE022
  - type: missing-source
    severity: material
    topic: integration-docs
    missingEvidence: Named partner list, API reference, export schema, and data-mapping documentation for non-Clio systems.
    whyItMatters: EveOS and Atlas only become durable system-of-record candidates if interoperability is broader than a single public integration page.
    diligencePath: Request API docs, supported-source matrix, sample data mappings, and proof of production integrations across CMS, email, accounting, and communications tools.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
    - TE006
  - type: missing-source
    severity: blocking
    topic: model-evals
    missingEvidence: Public or diligence-room benchmark pack covering hallucination rate, citation precision, source-link completeness, reviewer acceptance rate, and post-release monitoring.
    whyItMatters: The core product promise is not just speed but trustworthy legal work. Without eval evidence, it is impossible to underwrite whether the trust layer works at courtroom-grade reliability.
    diligencePath: Request model-evaluation methodology, held-out test sets, reviewer sampling protocol, incident escalation workflow, and longitudinal metrics by module.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
    - TE006
