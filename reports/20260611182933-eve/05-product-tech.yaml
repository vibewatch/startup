- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Web application stack
    - Runs the operator-facing product and internal tools
    - Built In lists Django, PostgreSQL, Python, React, and TypeScript
    - Tech stack visibility is helpful, but no public architecture doc shows tenancy boundaries or service decomposition
  - - Case data layer (Atlas)
    - Normalizes filings, records, email, CMS data, and communications into a live matter view
    - Access to upstream systems plus schema-mapping and conflict handling
    - Public materials show intent, not data-lineage detail or reconciliation SLAs
  - - Per-case search / retrieval
    - Matter-specific indexing for search, retrieval, and context grounding
    - Turbopuffer migration after OpenSearch shard instability and high AWS cost
    - No public disclosure on recall metrics, permissioning model, or index rebuild frequency
  - - Agent orchestration
    - Monitors matter changes and triggers drafting, review, and communication actions
    - Workflow rules, case-state detection, and human approval gates
    - Autonomous triggers can create silent error propagation if trigger logic is weak
  - - Verification layer
    - Inline sourcing, source-passage links, and human approval before outputs leave the firm
    - Reliable citation binding and UI-level review ergonomics
    - Court-grade failure cases show verification can still break in real use
  - - Integration layer
    - Syncs case details, contacts, notes, and other records from external systems
    - Clio sync today; broader CMS/email/accounting hookups implied by Atlas
    - Public API docs and supported-partner list are not available
  - - Model development and eval
    - Fine-tuning, evaluation, and deployment of legal-workflow AI systems
    - Domain-specific data, usage signals, and collaboration with foundation-model providers
    - No public benchmark pack on hallucination, latency, or approval-pass rates
  - - Engineering automation
    - Internal WALL-E agent accelerates software shipping
    - Slack-triggered background execution, full-app boot, browser testing, and MR creation
    - Developer productivity gains do not automatically translate into end-user legal-output reliability
  notes: Architecture rows combine direct technical disclosures with careful inference from hiring and engineering posts; missing public docs remain material.
