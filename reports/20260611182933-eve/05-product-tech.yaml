  rows:
  - - Intake / Jenny
    - Intake teams and front desk
    - Live; GA since Oct. 2025 and expanded in EveOS
    - 24/7 voice and email handling, live signing, multilingual intake, lead scoring, CMS sync
    - Owns the first contact and can feed structured data directly into downstream matter workflows
    - Request audited conversion lift, false-positive/false-negative rates, and call-escalation policy
  - - Medical Overview
    - Paralegals and pre-litigation staff
    - Live
    - Chronology, bad facts, ICD codes, damages ledgers, page-level source links, OCR on difficult scans
    - Turns raw medical packets into reusable structured case context
    - Request benchmark accuracy, reviewer override rate, and large-file failure logs
  - - Drafting agents
    - Paralegals, associates, legal ops
    - Live
    - Demands, complaints, motions, and discovery drafts in firm style with transcript-driven triggers
    - Encodes firm templates and reduces repetitive drafting bottlenecks
    - Request prompt/version control, redlining telemetry, and attorney acceptance rates
  - - Auditor
    - Attorneys and review leads
    - Live; enhanced in 2026
    - Nightly review of active matters for gaps, missed injuries, missing docs, and next actions
    - Adds a persistent QA layer rather than one-off prompting
    - Request precision/recall on issue flags and material false-alarm rate
  - - Analyst
    - Firm leadership and ops
    - Beta / early access in 2026
    - Plain-English operational queries plus dashboards on revenue pacing, performance, and case distribution
    - Could turn product exhaust into management reporting and process tuning
    - Request GA date, data-model coverage, and role-based access controls
  - - Atlas / AI-ready data
    - Entire firm
    - Beta / early access in 2026
    - Self-updating case file pulling from CMS, emails, filings, records, and communications
    - Creates data portability and shared context that compound with more usage
    - Request lineage model, conflict-resolution logic, and export tooling
  - - Communication Agents
    - Case managers and intake teams
    - New in 2026
    - Outbound follow-ups, records requests, onboarding, and case updates across 31 languages
    - Extends automation into tedious but high-frequency client/provider communication
    - Request opt-out controls, call recording governance, and language-quality audits
  - - Research
    - Attorneys and drafters
    - New in 2026
    - Jurisdiction-aware opinion retrieval with overruled-case flags and source-passage links
    - If reliable, embeds legal research into the workflow instead of a separate tool
    - Request authority coverage, miss-rate testing, and citation verification logs
  notes: Rows separate modules with direct public proof from those still in beta or early-access status; most quantified outcome claims remain company-controlled.
