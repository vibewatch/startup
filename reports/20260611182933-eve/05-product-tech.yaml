- calloutType: strength
  title: Eve’s strongest product moat is encoded workflow, not one model claim
  body: 'The public file consistently points to system-level embedding: transcript-triggered drafting, CMS sync, Atlas-style case data, nightly audit loops, and reusable firm playbooks. That creates switching costs because a buyer would need to replace both software and operating process.'
  claimRefs:
