  title: The engineering disclosures are the best public architecture clue
  body: The ML Engineer posting, the Turbopuffer migration post, and the WALL-E post are more revealing than the product copy. They indicate real work on per-matter retrieval, eval and deployment, and agent operations—useful signals that the company is building infrastructure, not just demos.
