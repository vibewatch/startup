- id: verification-security-and-model-risk
  title: Verification controls are visible, but the public file does not clear model-risk concerns
  body: 'Eve is unusually explicit in marketing its verification posture. The medical-overview page says every data point links back to a source document and page number, with direct quotes visually separated from AI summaries. Working With Eve adds claims around inline sourcing, one-click verification, and an AI validation framework, while security pages emphasize isolation, zero-retention treatment of prompts and outputs for foundation-model training, annual audits, HIPAA compliance, and SOC 2 Type II. Those controls are directionally aligned with what a plaintiff-firm buyer should want: source traceability, human approval, and data segregation inside a sensitive workflow.


    But the public evidence also shows why those controls should be treated as mitigation rather than proof. Eve’s privacy policy describes sharing website personal data with service providers, analytics partners, and advertising partners; that is marketing-site behavior rather than matter-file handling, yet it still shows the company has different privacy surfaces with different risk profiles. More importantly, 2026 adverse sources push directly against any simplistic “hallucination solved” reading. LLRX highlighted a March 2026 attorney apology letter that said Eve training stressed safeguards and “Trust but Verify,” yet an inaccurate quotation still reached the court. The lawyer could not determine whether the failure came from the software or his own workflow, which is precisely the point: verification must survive messy real use, not just marketing demos. EDRM, LawAccounting, and TechNewsWorld all show a harsher 2026 backdrop in which sanctions, logic-level hallucinations, and shadow-AI
    governance failures make native auditability and human review table stakes rather than differentiation by themselves.'
