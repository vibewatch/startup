- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Eve solution
  - Measured / claimed benefit
  - Limitation
  rows:
  - - Capture after-hours leads
    - Receptionist, voicemail, or outsourced answering service
    - AI intake answers and qualifies calls, signs clients live, and routes structured summaries
    - Company claims no missed high-value calls and sponsored coverage reports 10% to 35% conversion lift at one firm
    - No public denominator on lead-quality drift or abandonment rate
  - - Summarize medical records
    - Manual chronology building across providers
    - Medical Overview generates chronology, bad facts, ICD codes, and damages views with source links
    - Company says 15–20 minute generation; customer quotes say minutes instead of hours or weeks
    - No public benchmark on extraction error rate or reviewer correction burden
  - - Prepare demand letters
    - Manual drafting from transcripts, forms, and records
    - Agents auto-trigger demand drafts in firm style from case data
    - Laurel reports 3–5 minutes of human touch time and 48 to 104 letters per week
    - Case-study data is company-controlled and not cohort-adjusted
  - - Respond to discovery
    - Templates and manual issue spotting
    - Discovery guide and product pages position Eve for requests, responses, objections, and summaries
    - Claims faster turnaround and reduced repetitive drafting
    - No public comparison set versus specialist litigation-review tools
  - - Support trial prep
    - Manual transcript search and overnight preparation
    - Hershey cites real-time impeachment support, limine tracking, and overnight strategy summaries
    - Customer proof shows workflow depth beyond pre-lit only
    - Evidence comes from one company case study rather than independent court observers
  - - Review the entire docket
    - Partner review and spreadsheet dashboards
    - Auditor reviews matters nightly while Analyst answers operational questions in plain English
    - Could compress QA and management loops into the product itself
    - Analyst is still beta and public analytics screenshots are limited
  - - Coordinate with existing systems
    - Separate CMS, email, docs, and call tools
    - Atlas and Clio sync aim to normalize and port data across systems
    - Potentially reduces swivel-chair work and data drift
    - Public API and supported-integration documentation remain thin
  notes: Measured benefits blend direct customer anecdotes, sponsored coverage, and company claims; none appear independently audited.
