- id: comparable-benchmarks-and-market-support
  title: Comparable set, market size support, and what public benchmarks say
  body: |-
    The most useful legal-tech benchmark is Clio, not because it is perfectly comparable to Eve, but because it is one of the few private legal-software platforms that has publicly disclosed both valuation and ARR at material scale. Clio’s July 2024 financing priced the company at $3 billion with ARR already above $200 million, implying a sub-15x ARR multiple. After the vLex acquisition and a November 2025 financing, Clio was valued at $5 billion with $400 million ARR, implying roughly 12.5x ARR. Those marks still carry premium legal-tech positioning, but they were struck at revenue levels that Eve has not publicly disclosed. Harvey, by contrast, is explicitly an outlier: CNBC reported $190 million ARR at an $11 billion valuation in March 2026, or roughly 58x ARR. That makes Harvey useful only as a reminder that frontier-AI scarcity premiums exist, not as a direct underwriting anchor for plaintiff-law workflow software.

    Private plaintiff and workflow peers are directionally supportive but not clean multiple anchors. EvenUp’s October 2025 Series E priced it at $2B+ and management said ARR was doubling year over year with 2,000+ firms on platform. Supio disclosed $91 million total funding and 4x ARR growth since Series A, but not the absolute ARR base. Filevine disclosed nearly 6,000 customers, 100,000 legal professionals, 96% gross retention, and NDR above 120%, but not valuation. Litify disclosed 450+ enterprise customers and 70,000+ legal professionals and previously raised $50 million Series A, but again without current ARR.

    Public-market framing is even stricter. Intapp, a public professional-software platform with legal exposure, reported $146.0 million of March 2026 quarterly revenue and was worth about $1.78 billion in June 2026, or roughly 3.0x annualized revenue. SaaS Capital’s public benchmark put the median SaaS ARR multiple at 6.7x in June 2025 and framed the current environment as a 6-8x “new normal.” Market size support is real enough to justify a premium over generic SaaS laggards: the ABA puts the U.S. lawyer base at 1.37 million, and Clio’s personal-injury statistics page puts the PI subset above 135,000 lawyers with nearly 400,000 claims annually. But Thomson Reuters’ 2026 legal-market report is a reminder that buyers are investing in AI on unstable economic footing, which argues for price discipline rather than automatic AI multiple inflation.
