- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Support
  - Counterweight
  - What would change the view
  rows:
  - - Plaintiff law is a real vertical software market
    - 135k+ PI lawyers, ~400k annual claims, and rising AI spend support category size
    - Large market does not automatically support outlier entry multiples
    - Show durable monetization and retention at meaningful scale
  - - Eve appears to be moving toward operating-system breadth
    - Current product story spans intake, pre-lit, litigation, AI-ready data, and firm intelligence
    - Breadth can mask services-heavy delivery if gross margin is weak
    - Disclose gross margin and productized deployment metrics
  - - Fast customer growth can justify premium pricing
    - Public record shows a move from 100+ firms at Series A to 450+ at Series B and 1,200+ on the current homepage
    - The public record does not define paid versus pilot or office versus firm counting
    - Provide paid-customer, seat, and ACV definitions
  - - Scarcity value exists in legal AI
    - Harvey and EvenUp show investors will pay up for category leaders
    - Harvey is an AI outlier and Clio achieved lower multiples at much higher ARR
    - Show why Eve belongs in the premium cluster, not the median cluster
  - - Platform upside can still be large
    - A plaintiff-native workflow winner could support multi-billion exit value
    - Base-case exit math is weak from a $1B entry if public multiples stay sober
    - Prove a path to $250M+ ARR and premium retention
  notes: This table separates the quality of the company thesis from the fairness of the current price; both can be true at the same time.
