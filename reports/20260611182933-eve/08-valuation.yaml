company:
  name: Eve
chapter:
  number: 8
  title: Valuation
  summary: |-
    Disclosed facts support that Eve reached a $1B+ post-money valuation in September 2025 at a far earlier disclosed scale point than Clio, while public SaaS and legal-software benchmarks remained much lower than Harvey-style AI outlier pricing. Using Eve’s disclosed 450-firm round-time customer count and cautious ACV scenarios, the round implies roughly 28x-111x ARR; even the current 1,200+ firm homepage claim only compresses the math into the mid-teens unless most of those firms are paying at premium ACVs. The evidence-backed stance is that $1B was a scarcity-premium price for category leadership optionality and remains stretched for new money unless management can prove current paid ARR, retention, and cap-table terms that pull Eve closer to Clio-like rather than Harvey-like valuation logic.
sections:
- id: financing-valuation-context
  title: Financing context and what the September 2025 round actually disclosed
  body: |-
    The cleanest disclosed fact in the public record is simple: Eve’s September 2025 Series B priced the company at more than $1 billion post-money on a $103 million raise. Eve repeated that number in its own funding post and in the distributed press release, while independent legal-tech coverage from LawNext and Artificial Lawyer echoed the same headline. What matters for valuation, however, is not just the round size. It is the scale point at which that price was struck. Around the Series B announcement, Eve publicly said it had added more than 350 firms in eight months, reached more than 450 customer firms, processed more than 200,000 legal cases annually, and helped firms recover over $3.5 billion in settlements and judgments. Those are meaningful traction markers, but they are not revenue disclosures.

    The contrast with Eve’s own January 2025 Series A is useful because it shows how quickly the narrative accelerated. At Series A, the company announced a $47 million round and said more than 100 firms had adopted the product, alongside a 500% year-over-year revenue growth claim. By the June 2026 run date, Eve’s homepage had moved to a much larger headline of 1,200+ firms and a broader “AI operating system for plaintiff law” narrative spanning intake, pre-litigation, litigation, AI-ready data, and firm-level intelligence. That suggests meaningful post-round growth, but it also introduces a diligence problem: the public record never explains whether the 450-firm figure and the 1,200+ figure are defined the same way, whether they are fully paying customers, or what average contract value sits underneath them.

    That missing revenue bridge is the core valuation issue. A $1B+ post-money mark can be defensible for a company that is rapidly becoming the system of record and action layer for plaintiff firms. But public evidence still does not disclose ARR, NRR, gross margin, or the preference stack behind the Series B. So the round should be understood as a strong signal of investor conviction in Eve’s category potential, not as a price already validated by public-market-style revenue evidence.
