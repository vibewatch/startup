  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: eve-arr-proof
    missingEvidence: Audited or board-level ARR, NRR, GRR, gross margin, and cohort retention for Eve at the September 2025 round and at the 2026 run date.
    whyItMatters: ARR and retention are the core variables that determine whether the $1B price maps to Clio-like legal-tech multiples or Harvey-like AI outlier pricing.
    diligencePath: Request CFO reporting packs, board materials, and cohort retention tables in the data room.
    relatedQuestionRefs:
    - QV021
    - QV027
  - type: private-evidence-only
    severity: material
    topic: cap-table-overhang
    missingEvidence: Full cap table, share classes, liquidation preferences, participation rights, anti-dilution terms, and any secondary pricing since Series B.
    whyItMatters: A headline valuation can materially overstate common-equity value if preferred terms or secondary discounts are aggressive.
    diligencePath: Obtain the cap-table export, financing docs, and counsel memo describing the liquidation waterfall.
    relatedQuestionRefs:
    - QV018
    - QV029
  - type: private-evidence-only
    severity: material
    topic: customer-definition
    missingEvidence: Definitions behind the 450-firm September 2025 customer count and the 1,200+ firm June 2026 homepage claim, including paid versus pilot or multi-office treatment.
    whyItMatters: The valuation scenario math changes materially depending on whether the current firm count reflects full-pay customers, pilots, or broader logos.
    diligencePath: Ask management for active-paying-customer counts, average seats, ACV by segment, and gross logo-to-paid conversion data.
    relatedQuestionRefs:
    - QV021
  - type: enumeration-incomplete
    severity: minor
    topic: private-comps-coverage
    missingEvidence: Public ARR disclosures for EvenUp, Supio, Filevine, and Litify sufficient to compute apples-to-apples valuation multiples.
    whyItMatters: The comparable set is informative on scale and round appetite, but private peers still lack enough disclosed ARR to serve as clean multiple anchors.
    diligencePath: Supplement public work with PitchBook, management references, or direct diligence on private peer revenue scale.
    relatedQuestionRefs:
    - QV011
    - QV013
    - QV014
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Blended ACV, seats per firm, implementation revenue, services mix, CAC, payback, and contribution margin by customer cohort.
    whyItMatters: Cautious ARR scenarios for Eve rely on ACV assumptions because the public record provides no direct pricing or unit-economics disclosure.
    diligencePath: Request pipeline-to-booking bridge, pricing schedules, and cohort economics by firm segment.
    relatedQuestionRefs:
    - QV020
    - QV027
