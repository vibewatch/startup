  rows:
  - - Clio (2024 Series F)
    - Valuation vs disclosed ARR
    - $3B valuation on >$200M ARR (<15x)
    - Best disclosed private legal-software round anchor before the vLex step-up
    - Broad legal workflow platform, not plaintiff-native AI
  - - Clio (2025 Series G + vLex)
    - Valuation vs disclosed ARR
    - $5B valuation on $400M ARR (~12.5x)
    - Shows how premium legal-platform pricing looks at large ARR scale
    - Includes vLex deal context and debt facility
  - - Intapp (public, Jun 2026)
    - Market cap vs annualized revenue
    - $1.78B market cap on ~$584M annualized revenue (~3.0x)
    - Public comp for regulated professional software with legal exposure
    - Not plaintiff-law specific and public markets are usually harsher
  - - Harvey (Mar 2026)
    - Valuation vs disclosed ARR
    - $11B on $190M ARR (~58x)
    - Useful only as labeled AI-outlier ceiling for frontier scarcity pricing
    - General legal/pro services AI, not plaintiff workflow
  - - EvenUp (Oct 2025)
    - Private round / scale markers
    - $2B+ valuation; 2,000+ firms; ARR doubled YoY
    - Closest disclosed plaintiff-AI valuation peer with meaningful scale markers
    - No absolute ARR disclosed
  - - Supio (Apr 2025)
    - Private round / growth markers
    - $91M total funding; 4x ARR growth since Series A
    - Relevant plaintiff-AI peer with verification-heavy positioning
    - No public valuation or absolute ARR
  - - Filevine (Sep 2025)
    - Private scale / retention markers
    - $400M financing; ~6,000 customers; 96% gross retention; 120%+ NDR
    - Shows incumbent workflow scale and retention quality in legal software
    - No public valuation multiple
  - - Litify (2023 + current scale)
    - Private scale / ownership markers
    - 450+ enterprise customers; 70,000+ legal pros; majority stake sold to Bessemer
    - Signals platform breadth and buyer value in plaintiff and high-volume practices
    - No public valuation multiple and stale financing disclosure
  notes: Rows mix clean multiple anchors with directional private-scale markers because most private legal-tech peers do not disclose enough ARR to support apples-to-apples math.
