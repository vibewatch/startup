coverageNotes: >-
  Public evidence is better than for many private legal-tech companies because Eve has official
  funding announcements, product pages, customer case studies, and independent legal-tech coverage.
  The biggest remaining gaps are still material: no disclosed ARR, retention, gross margin, CAC,
  burn, or cap-table terms; public customer-count disclosures diverge from 450+ in September 2025
  to 1,200+ and 1,400+ in June 2026; and legal-AI risk mitigation depends more on workflow design
  and human review than on any single published compliance claim.
