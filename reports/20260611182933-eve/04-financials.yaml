tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Core platform subscription
    - Direct contract for plaintiff-law operating system spanning intake, drafting, discovery, and analytics
    - Per firm / per user / contract
    - Live; pricing undisclosed publicly
    - Likely recurring and sticky if embedded in daily workflow, but list price and billing cadence are not public
    - Request ACV, billing frequency, seat counts, and logo retention by cohort
  - - AI Intake module
    - Workflow module that qualifies leads and automates front-office intake
    - Per firm / module add-on
    - GA in 2026 after beta with 40+ firms
    - Could increase expansion ARR by tying revenue to lead capture, but attach rate and pricing are undisclosed
    - Request module attach rate, conversion lift, and any usage-based billing component
  - - Agents / EveOS expansion
    - Customers add drafting, auditing, analytics, and other AI workers inside the same platform
    - Per firm / workflow / user
    - Live; public expansion narrative, no public price
    - Strong potential NRR lever if modules layer into existing accounts
    - Request revenue mix by module and expansion ARR from existing accounts
  - - Onboarding / implementation layer
    - High-touch deployment, legal review, customer success, and workflow design implied by customer stories and hiring
    - Project / bundled service / included
    - Implied, not publicly priced
    - Could help adoption but depress near-term gross margin versus pure software
    - Request services revenue, implementation cost, and time-to-live by customer segment
  - - Renewal and cross-sell
    - Existing firms expand from one workflow into broader firm operations
    - Account expansion
    - Supported by case studies and evolving product line, but no renewal metrics disclosed
    - Potentially high quality if workflows are sticky; unproven publicly without retention data
    - Request NRR, gross retention, churn, and multi-product adoption rates
  notes: Rows distinguish live product surfaces from implied services and expansion mechanics; public sources do not disclose actual price cards or revenue mix.
