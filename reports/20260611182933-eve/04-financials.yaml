- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Disclosed capital base
    - $150M from the two official 2025 rounds; 2026 company materials round total to $160M+ / $164M+
    - High
    - Capital raised is the clearest public runway buffer even if exact remaining cash is unknown
    - Reconcile seed history, secondary components, and current unrestricted cash
  - - Investor quality
    - Spark, Andreessen Horowitz, Lightspeed, Menlo
    - High
    - Strong sponsors improve access to future financing if the company keeps compounding
    - Confirm ownership, board rights, and any investor-pro rata commitments
  - - Cash on hand
    - null
    - Low
    - Runway cannot be estimated precisely without current cash
    - Request latest board cash balance and restricted-cash detail
  - - Monthly burn
    - null
    - Low
    - Hiring data suggests spending intensity but not actual burn
    - Request monthly net burn, payroll, cloud, and customer-success spend
  - - Hiring intensity
    - 34 open roles in June 2026 across technical, GTM, finance, and legal functions
    - Medium
    - Shows continued growth investment and likely rising opex
    - Request current filled headcount, hiring plan, and attrition
  - - Named salary bands
    - $82k to $450k base across listed openings
    - Medium
    - Premium hiring ranges imply meaningful fully loaded labor cost
    - Request fully loaded payroll budget, SBC expense, and hiring prioritization
  - - Debt / project finance
    - null
    - Low
    - Absence of public disclosure does not prove no obligations exist
    - Request debt schedule, credit facilities, vendor financing, and any recourse obligations
  notes: Null means the metric is not disclosed in reviewed public sources, not that the company lacks the item.
