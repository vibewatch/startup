chapter:
  number: 4
  title: Financials
  summary: Eve’s public file supports a strong growth and capital-access narrative—a $47M Series A, a $103M Series B at $1B+ valuation, 450+ firms by late 2025, and 1,000+ law-firm scale claims in 2026—but it does not disclose actual ARR, pricing, gross margin, or runway. Customer case studies and benchmark legal-software pricing imply real monetization potential and meaningful labor leverage, yet the underwrite still depends on private metrics for realized pricing, retention, burn, and revenue quality.
sections:
- id: revenue-model-pricing-and-public-traction
  title: Revenue model, pricing opacity, and customer-derived revenue clues
  body: 'Eve looks financially like a direct-sales B2B SaaS platform for plaintiff law rather than a self-serve legal tool. The public site consistently sells a full operating system—EveOS, AI Intake, Agents, drafting, discovery, and analytics—but never posts a price card. Instead, the company pushes prospects into demos and sales calls, while the Head of Legal role explicitly references MSAs, Deal Desk review, customer agreements, and partnership contracts. That combination strongly suggests contract-led selling, negotiated pricing, and some implementation or legal overhead before revenue is recognized.


    The best public traction signals are customer counts and workflow volume, not dollar revenue. Official Series B materials said Eve had grown to more than 450 firms by September 2025, more than 200,000 legal cases annually, and over $3.5 billion of customer recoveries. By 2026, official job postings raised the scale claim to 1,000-plus law firms and even said revenue was doubling quarter over quarter, but the company still did not disclose absolute ARR or revenue. That leaves only cautious benchmark modeling. Adjacent legal-software vendors publicly charge roughly $49 to $130 per user per month, which is enough to show that plaintiff firms already pay meaningful software budgets. But even applying those benchmarks to 1,000 firms produces only a wide single-digit-to-tens-of-millions annualized spend band. In other words, Eve clearly has monetizable scale, yet the public file still cannot pin down realized ACV, seat counts, or recognized revenue with precision.'
