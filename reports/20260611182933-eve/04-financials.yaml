- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Best public proxy today
  - Current status
  - Exact diligence path
  rows:
  - - Absolute ARR / revenue by product line
    - Without it, the valuation case cannot be tied to scale or growth efficiency
    - Customer counts, 2X QoQ revenue claim, and benchmark price bands
    - Not publicly disclosed
    - Request monthly recurring revenue, ARR bridge, and revenue mix by module
  - - Realized pricing / ACV / seat mix
    - Needed to translate “1,000+ firms” into actual monetization
    - Legal-software price cards from Clio, MyCase, and PracticePanther
    - Not publicly disclosed
    - Request price book, average seats per customer, and top-decile ACV
  - - Gross margin and software vs services mix
    - Needed to judge revenue quality and whether onboarding or human review drags margins
    - Customer stories plus legal-software comp proxies
    - Not publicly disclosed
    - Request gross margin bridge and services attach / services gross margin
  - - CAC, payback, and sales-cycle conversion
    - Determines whether growth is efficient or just funded by capital
    - Head of Legal role, customer-success hiring, and deal-complexity clues
    - Not publicly disclosed
    - Request funnel conversion, sales cycle, CAC by channel, and payback by segment
  - - Retention, churn, and concentration
    - Critical for understanding durability of the customer base behind the $1B+ valuation
    - 450+ firms in 2025 and 1,000+ in 2026 imply expansion but not retention quality
    - Not publicly disclosed
    - Request NRR, gross retention, churn, cohort expansion, and top-customer concentration
  - - Cash, burn, runway, and debt
    - Core to underwriting capital adequacy and next-round timing
    - Disclosed raises plus aggressive hiring and premium salary bands
    - Not publicly disclosed
    - Request board cash file, monthly burn, runway model, and debt schedule
  notes: These are the minimum missing items needed to move from narrative diligence to financial underwriting.
