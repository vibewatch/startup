  evidenceGaps:
  - type: missing-source
    severity: material
    topic: funding-gap
    missingEvidence: A source that reconciles the undisclosed pre-Series-A capital implied by the 2026 “$160M+ / $164M+” totals.
    whyItMatters: Without the seed history, investors cannot verify the full dilution path, investor entry points, or whether secondary transactions are embedded in the headline capital figure.
    diligencePath: Request the full financing history table with date, round type, primary vs. secondary proceeds, lead investor, and post-money valuation for each round.
    relatedQuestionRefs:
    - QI003
  - type: private-evidence-only
    severity: blocking
    topic: runway-gap
    missingEvidence: Current cash balance, monthly burn, runway model, and hiring plan tie-out.
    whyItMatters: Capital adequacy is the core financial underwriting question for a still-scaling private SaaS company, and public raises alone do not answer it.
    diligencePath: Request the latest board cash report, last twelve months of monthly net burn, and management runway forecast under base and downside cases.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: debt-gap
    missingEvidence: Debt schedule, vendor-financing agreements, credit facilities, and any off-balance-sheet commitments.
    whyItMatters: Even a software company can accumulate financing obligations that materially change runway, covenant risk, or enterprise value.
    diligencePath: Request the debt register, borrowing base (if any), lender agreements, and legal confirmation of guarantees or other recourse obligations.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-gap
    missingEvidence: Gross margin, software vs. services mix, CAC, payback, NRR, logo retention, and cohort expansion data.
    whyItMatters: These are the metrics that determine whether Eve’s strong workflow ROI actually converts into durable, efficient, high-quality recurring revenue.
    diligencePath: Request a KPI pack with gross margin bridge, cohort retention tables, CAC by channel, sales-cycle conversion, and services attachment economics.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-count-gap
    missingEvidence: Exact paying-customer count, paid seat counts, ACV distribution, and customer concentration behind the “1,000+ law firms” claim.
    whyItMatters: Without that breakdown, customer-derived revenue scenarios remain too wide and it is impossible to separate many small customers from a smaller number of large enterprise accounts.
    diligencePath: Request the customer ledger by ARR band, seat count, product mix, top-20 accounts, and share of ARR represented by the largest customers.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI001
    - TI005
