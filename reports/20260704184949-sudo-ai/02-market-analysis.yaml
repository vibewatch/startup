company:
  name: Sudo AI
chapter:
  number: 2
  title: Market Analysis
  summary: Sudo AI is entering a market with abundant narrative upside but unusually wide quantitative
    dispersion. Conservative analysts still frame humanoids as a small multi-billion-dollar category,
    while aggressive forecasters already price a US$165–249 billion market by 2034–2036. The consistent
    cross-source signal is not the exact TAM number; it is the adoption order. Industrial manufacturing
    and warehouse/logistics applications come first, because they combine labor scarcity, repetitive workflows,
    and human-designed infrastructure that favors general-purpose manipulation. China is the fastest-scaling
    commercialization arena thanks to policy support, supply-chain depth, and faster iteration cycles,
    but it is also becoming more concentrated around early leaders. For Sudo AI, the relevant opportunity
    is a narrow subset of industrial and logistics budgets where a simulation-trained picking system can
    beat fixed automation on flexibility without failing on safety, reliability, or ROI.
sections:
- id: market-boundary
  title: Market Boundary and Included Spend
  body: The cleanest way to define Sudo AI’s market is not “all robotics” and not even “all warehouse
    automation,” but humanoid or human-form physical AI systems that can operate in environments already
    built for people. IFR’s humanoid position paper frames the category around general-purpose robots
    for human-centric settings, spanning industrial and service use. That boundary matters because broad
    automation budgets are much larger than the pure humanoid market. Warehouse automation, industrial
    robot installations, AMRs, cobots, fixed arms, and software orchestration platforms are all adjacent
    spend pools, but they are not the same thing as a human-form manipulation system. For Sudo, this means
    the relevant market should include robotic hardware, embodied control software, deployment services,
    and workflow integration for human-designed facilities, while excluding pure WMS software, fixed-arm
    cells, and simple mobile transport systems unless they are being displaced. This narrower framing
    avoids the common mistake of assigning every automation dollar to humanoids.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM014
  - CM015
  - CM016
  tableRefs:
  - TM001
- id: sizing-dispersion
  title: Sizing Lenses and Why Estimates Diverge So Widely
  body: 'Public market estimates for humanoid robotics are directionally bullish but numerically inconsistent.
    Grand View Research remains relatively conservative, taking the market from about US$1.55 billion
    in 2024 to US$4.04 billion in 2030. MarketsandMarkets and Fortune Business Insights are materially
    more aggressive, while Future Market Insights is more aggressive still at US$10.69 billion in 2026
    and US$248.90 billion in 2036. These are not trivial differences; they imply very different underwriting
    assumptions about pricing, reliability, and whether household or service use cases unlock at scale.
    The practical lesson is that one broad TAM estimate is not diligence. A better approach is to keep
    multiple lenses on the page: pure humanoid market forecasts, adjacent warehouse and industrial automation
    pools, and region-specific commercialization signals. That preserves contradiction rather than washing
    it away and keeps Sudo’s opportunity tied to real deployment conditions instead of to the largest
    headline number.'
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
