callouts:
- calloutType: insight
  title: The biggest market fact is the disagreement itself
  body: Humanoid market forecasts range from conservative single-digit billions to highly optimistic triple-digit
    outcomes. That spread is a signal that underwriting should preserve scenario bands, not pick the biggest
    number.
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
- calloutType: strength
  title: Industrial and logistics are the most credible first wave
  body: Across analyst, official, and operator sources, the most believable near-term humanoid market
    is manufacturing and warehouse/logistics, where labor pain and repetitive workflows are already budgeted
    problems.
  claimRefs:
  - CM013
  - CM017
  - CM021
  - CM028
- calloutType: risk
  title: Safety and regulation remain commercialization gates
  body: Current systems still face work-cell, cooperative-safety, and workplace-liability hurdles. Those
    constraints slow the path from promising demos to scaled site deployments.
  claimRefs:
  - CM023
  - CM024
  - CM025
  - CM033
