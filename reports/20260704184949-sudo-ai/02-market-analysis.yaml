- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer / budget owner
  - Workflow
  - Adoption trigger
  rows:
  - - Automotive and discrete manufacturing
    - Plant operations and automation leaders
    - Line workers, material handlers, supervisors
    - Capex / plant productivity budgets
    - Repetitive handling, line support, machine tending
    - Labor pressure, injury reduction, flexible re-tasking
  - - Electronics assembly
    - Factory GM or automation engineering
    - Operators and quality teams
    - Operations and yield-improvement budgets
    - Small-part handling, inspection, material movement
    - Need for precision plus human-space flexibility
  - - Warehouse / 3PL / distribution
    - Fulfillment and supply-chain leaders
    - Warehouse associates and site managers
    - Fulfillment automation budgets
    - Depalletizing, picking, tote movement, exception handling
    - Throughput gains, labor shortages, service-level pressure
  - - Retail / hospitality / customer-facing service
    - Store operations or venue management
    - Front-of-house staff
    - Operating-expense and labor budgets
    - Greeting, guidance, repetitive service interactions
    - Staff shortages and brand differentiation
  - - Healthcare and elder care
    - Hospital operations or care-facility administrators
    - Nurses, care workers, patients
    - Clinical support and labor budgets
    - Transport, companionship, reminders, simple assistance
    - Aging demographics and caregiver burnout
  - - Household
    - Consumers
    - Residents / family caregivers
    - Disposable income / home-tech budget
    - Cleaning-adjacent assistance, lifting, reminders
    - Sharp price drop plus trusted safety assurance
  notes: Budget owners differ materially by segment, which is why one generic GTM model does not fit the
    whole humanoid market.
