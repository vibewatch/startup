- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Labor shortages in manufacturing and logistics
    - Driver
    - Now
    - Supports early industrial and warehouse adoption.
    - Quantify Sudo target-customer labor pain by workflow.
  - - Wage inflation and injury reduction
    - Driver
    - Now
    - Improves ROI for repetitive handling automation.
    - Model payback against human shift costs and injury exposure.
  - - AI / simulation / foundation-model progress
    - Driver
    - Now → medium term
    - Expands tasks a robot can generalize across without heavy reprogramming.
    - Test whether Sudo can transfer beyond curated demos.
  - - China policy support and supply-chain density
    - Driver
    - Now
    - Speeds iteration, talent concentration, and production readiness in China.
    - Assess whether Sudo can match local leaders on scale and cost.
  - - Reliability, cycle time, energy, maintenance
    - Constraint
    - Now
    - Humanoids must beat or at least match incumbent automation economics.
    - Collect real uptime, MTBF, and cycle-time data from pilots.
  - - Cooperative safety / certification
    - Constraint
    - Now → medium term
    - Limits deployment beyond work cells and slows rollouts.
    - Verify current safety architecture and certification roadmap.
  - - AI workplace liability and regulation
    - Constraint
    - Now → medium term
    - Raises explainability, monitoring, and accountability burden in workplaces.
    - Map regulatory exposure by geography and deployment type.
  - - Integration and procurement friction
    - Constraint
    - Now
    - MES/WMS links, training, and site onboarding slow revenue conversion.
    - Measure deployment services burden per customer site.
  notes: The key market tension is strong demand pull versus real-world deployment friction across safety,
    economics, and enterprise integration.
