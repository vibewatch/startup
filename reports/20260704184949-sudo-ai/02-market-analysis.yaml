  rows:
  - - Humanoid / human-form robots
    - Robot hardware, embodied control stack, deployment and integration
    - N/A — core category
    - Industrial ops, logistics ops, service operators
    - This is the direct category Sudo wants to enter.
  - - Wheeled human-form service robots
    - Some adjacent embodied platforms with human-centric interfaces
    - Pure AMR fleets without manipulation
    - Facility, logistics, and service operators
    - Useful as substitute and pricing benchmark.
  - - Warehouse automation
    - Picking, handling, sortation, fulfillment automation budgets
    - Generic WMS software if no robot embodiment
    - Supply-chain and fulfillment leaders
    - Large adjacent spend pool for Sudo’s logistics wedge.
  - - Industrial robot installations
    - Factory automation capex and robot deployment budgets
    - Pure software upgrades or conveyors alone
    - Plant automation and manufacturing ops
    - Sets the upper bound for factory automation spend.
  - - AMRs / AGVs
    - Transport and movement automation budgets
    - Manipulation-heavy workflows
    - Warehouse and plant operators
    - Direct substitute in simpler transport tasks.
  - - Fixed industrial arms / cobots
    - Station-specific repetitive automation budgets
    - Human-mobility or multi-station flexibility needs
    - Plant engineering and capex teams
    - Main incumbent alternative where layout redesign is acceptable.
  - - Household / care robots
    - Consumer or institutional care-assistance budgets
    - Generic appliances like robot vacuums
    - Consumers, elder-care providers, hospitals
    - Long-term expansion option, but not Sudo’s current wedge.
  notes: The table distinguishes direct humanoid spend from adjacent automation pools so Sudo is not credited
    with every robotics or warehouse dollar.
