  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: forecast dispersion
    missingEvidence: A reconciled market model that normalizes analyst scope, time horizon, and application
      inclusion before converting TAM into an investable scenario set.
    whyItMatters: Published humanoid forecasts differ by tens or hundreds of billions of dollars, which
      can distort valuation narratives if treated as interchangeable.
    diligencePath: Build a bottoms-up scenario model using explicit application, price, and deployment
      assumptions rather than one headline report.
    relatedQuestionRefs:
    - QM004
    - QM005
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: china-specific sizing
    missingEvidence: A trustworthy China-specific humanoid market size series with transparent methodology
      and consistent year definitions.
    whyItMatters: China is the critical commercialization arena for Sudo, but reviewed public sources
