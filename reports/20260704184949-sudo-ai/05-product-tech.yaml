- id: deployment
  title: Deployment, integration, and maturity
  body: 'The company’s strongest maturity signal is that it has chosen a hard, measurable skill benchmark and shown a long continuous test rather than a short montage. The 60-minute uncut picking evaluation under varied lighting, clutter, and interference is meaningful because it tests reliability rather than just single-shot capability. Still, the public deployment story remains early-stage. The hiring footprint for sim-to-real evaluation, real-robot evaluation, and field support suggests that real-world hardening remains a substantial operational loop. That is normal for enterprise robotics, but it means customers should not equate “zero-shot initial performance” with “no integration work.” A more realistic reading is that Sudo is attempting to reduce the most expensive and least scalable part of deployment—site-specific data collection—while still investing heavily in validation, support, and workcell adaptation. Maturity therefore appears asymmetric: manipulation reliability has unusually
    strong public evidence, while repeatable multi-site deployment, broad skill coverage, and enterprise hardware transparency are still maturing.'
  claimRefs:
  - CE004
