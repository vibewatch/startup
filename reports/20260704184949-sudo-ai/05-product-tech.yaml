- id: differentiation
  title: Differentiation and dependency risks
  body: 'Sudo’s best-documented differentiation is training economics. Where many embodied-AI teams still lean on teleoperation, real-world demonstrations, or few-shot adaptation for each new environment, Sudo is arguing that high-fidelity simulation can shoulder more of the data burden up front. If true, that changes iteration speed and customer roll-out economics materially. The caveat is that this advantage depends on hidden technical dependencies: simulator fidelity, contact modeling, sensor simulation quality, localization, tactile robustness, and the company’s ability to keep real-world performance aligned as it expands beyond picking. External literature makes the same point from a different angle. Sim-to-real RL is increasingly credible, but it remains task sensitive and failure prone when embodiment gaps, contact dynamics, and perception errors widen. Sudo’s moat is therefore real but conditional. It rests less on an openly documented hardware spec sheet and more on whether the
    company truly owns a compounding simulation and evaluation flywheel.'
  claimRefs:
  - CE008
