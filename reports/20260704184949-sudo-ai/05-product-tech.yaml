- id: trust-safety
  title: Trust, safety, and compliance posture
  body: 'Trust and safety are where the public record is weakest. Sudo’s privacy wedge is relatively clear: the company says customers do not need to hand over sensitive production data for initial deployment, which is attractive in manufacturing environments and plausibly lowers one adoption barrier. Beyond that, however, the reviewed record is sparse. There is no public safety certification, no published battery or payload specification, no formal uptime or MTBF metric, and no external quality-assurance artifact comparable to what conservative industrial buyers often demand. Even the developer-story remains more aspirational than operational because the site does not yet expose a public SDK or repository despite repeated ecosystem messaging. None of those gaps invalidate the technology, but they are precisely the items that separate a compelling robotics demo from an enterprise product that procurement, legal, and safety teams can approve quickly. Technical diligence should ask for simulator
    documentation, failure-mode analysis, safety case materials, and deployment QA evidence before treating the system as de-risked.'
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE034
  - CE035
