  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: latest-valuation
    missingEvidence: A company-confirmed financing summary stating the exact latest valuation, round size and investor roster.
    whyItMatters: The public record supports a >$2B neighborhood but not a clean, reconciled financing denominator for underwriting
      entry.
    diligencePath: Obtain management-approved financing materials or signed closing data.
    relatedQuestionRefs:
    - QV008
    - QV009
  - type: private-evidence-only
    severity: blocking
    topic: commercial-kpis
    missingEvidence: Revenue, gross margin, customer concentration, pilot-conversion, deployment uptime and cash burn.
    whyItMatters: Without commercial KPIs, investors cannot distinguish a premium frontier asset from a richly priced research
      story.
    diligencePath: Request monthly operating dashboard and current budget under NDA.
    relatedQuestionRefs:
    - QV006
    - QV027
    - QV029
  - type: private-evidence-only
    severity: material
    topic: term-sheet
    missingEvidence: Preference stack, liquidation overhang, dilution expectations and any structured downside terms.
    whyItMatters: Entry economics depend on downside protection and future dilution, especially for capital-intensive humanoid
      startups.
    diligencePath: Review the cap table, charter and latest term sheet.
    relatedQuestionRefs:
    - QV011
  - type: enumeration-incomplete
    severity: minor
    topic: public-comps
    missingEvidence: A clean set of pure-play public humanoid filings with standardized revenue and margin disclosure.
    whyItMatters: The current comparable set mixes private rounds, a public-path transaction and adjacent public robotics
      references because direct public peers are scarce.
    diligencePath: Refresh the comp set once Agility files fuller public disclosures or additional humanoid issuers list.
