  - FV004
- id: financing-context
  title: Financing Context, Entry Discipline and Term-Sheet Risk
  body: 'The main financing fact in public view is directionally clear and numerically fuzzy: Sohu reports that Sudo''s latest
    valuation is above $2B and attributes backing to CATL-linked capital, Alibaba, Tencent and Ant, while the company''s own
    public materials do not confirm exact round size, investor list, preference stack or use of proceeds. That is enough to
    know investors are paying up for frontier optionality, but not enough to know whether common-equity returns are well protected.
    Entry discipline should therefore focus on three items before price: how much capital Sudo really has left relative to
    commercialization needs, whether the next round is likely to be raised from a position of proof or hope, and how much
    preference or structured downside already sits above new money. This matters more in humanoids than in software, because
    data, hardware, safety validation and manufacturing all consume capital together. A company can be technically right and
    still be a weak late-stage entry if financing terms and milestone timing are misaligned.'
  claimRefs:
  - CV016
  - CV017
  - CV018
  - CV019
  - CV020
  - CV021
  - CV022
- id: scenarios
  title: Bull, Base and Bear Cases
  body: 'Scenario analysis is necessarily milestone-based because public revenue is undisclosed. Our base case (about 40%)
    assumes Sudo converts early industrial validation into limited paid deployments by 2027, expands from picking into a few
    adjacent workcell skills, and retains enough financing flexibility to justify roughly $1.5-2.2B. The bull case (about
    25%) assumes its simulation-first system proves more general than expected, customer ROI becomes visible, and the company
    rides China''s faster hardware ecosystem into a $3.0-4.5B outcome. The bear case (about 35%) assumes the sim-to-real gap
    stays stubborn, pilots do not convert fast enough, and the next raise happens under pressure, producing something closer
    to $0.8-1.2B or at least a flat round. The asymmetry here is unusual: upside is very large, but the bear case is plausible
    precisely because so much of the current mark depends on future proof rather than current unit economics. That is why
    milestone discipline matters more than spreadsheet precision.'
  claimRefs:
  - CV023
  - CV024
  - CV025
  - CV026
  - CV027
  - CV028
  - CV029
  tableRefs:
  - TV003
  figureRefs:
  - FV003
- id: comparables
  title: Comparable Set and Valuation Context
  body: 'The comparable set argues for caution. Figure''s $2.6B 2024 mark and later $39B step-up show how dramatically humanoid
    leaders can rerate once capital, branding and deployment proof compound. PI''s multi-billion valuation path shows investors
    will also pay software-model premiums for teams seen as owning the cognition layer. 1X represents the opposite risk: narrative
    and consumer optionality can push valuations far ahead of monetization. Agility offers the cleanest grounding comp because
    it has public cash-burn, order and operating-hour disclosures, while Unitree is the most useful Chinese anchor because
    it shows a revenue-generating robotics business can still be valued below the loudest frontier narratives. Sudo sits somewhere
    in between: stronger scientific novelty than a generic hardware startup, but far less commercial proof than the best-capitalized
    leaders. On that basis, a reported mark above $2B already looks like upper-tier optionality pricing rather than conservative
    entry.'
  claimRefs:
  - CV030
  - CV031
  - CV032
  - CV033
  - CV034
  - CV035
  - CV036
  - CV037
  tableRefs:
  - TV004
  figureRefs:
  - FV002
- id: exit-diligence
  title: Exit Readiness, Thesis-Break Triggers and Final Diligence
  body: 'It is too early to underwrite a clean exit path today. The plausible near-term outcomes are another private financing,
    a strategic industrial partnership, or a later IPO only after repeatable deployment economics emerge. The most important
    diligence items are therefore the ones that compress uncertainty fast: the exact round terms and cap table, pilot-to-paid
    conversion, named customer economics, manufacturing readiness, safety and certification roadmap, and the hardware and
    compute dependencies that could gate scale. The clearest thesis-break triggers are inability to reproduce the picking
    results in adjacent tasks, safety setbacks, burn outrunning access to capital, or evidence that Unitree, AgiBot or Figure-scale
    leaders are locking in the supply chain and design wins first. Until those questions are answered, the return-maximizing
    posture is to keep Sudo on the active tracking list and look for a later entry anchored to commercialization proof instead
    of paying a pure frontier premium now.'
  claimRefs:
  - CV038
  - CV039
  - CV040
  - CV041
  - CV042
