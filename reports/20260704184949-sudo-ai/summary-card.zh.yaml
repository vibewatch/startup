  topStrengths:
    - 纯仿真训练路线确实有差异化；如果在抓取之外也能成立，Sudo 的迭代速度和成本可能优于重度依赖遥操作的对手。
    - 成立不到一年，公司已吸引顶尖技术人才和中国战略产业 / 科技投资人，组合并不常见。
    - 公开演示和技术材料显示 Sudo 有一个具备闭环控制的真实系统，而不只是 pitch deck 概念。
  topRisks:
    - 公开证据尚未显示已披露收入、具名付费部署或可持续客户 ROI，因此估值走在经营验证前面。
    - 对一家已经按一线赢家定价的公司来说，创始人归属、治理和股权结构条款仍过于不透明。
    - 仿真到现实迁移的适用范围可能比当前叙事更窄，商业化速度也可能更慢。
    - 供应链、芯片获取，以及更广泛的中美安全 / 监管紧张关系，可能让扩张和退出路径更复杂。
  unresolvedGaps:
    - 2026 年 4 月融资后，审计或管理层口径的收入、烧钱速度、毛利率和现金跑道数据。
    - 具名客户部署或已签署付费试点，用以区分产业意向和真正生产使用。
    - 第三方验证零样本操作主张在更广任务和更严苛环境下是否成立。
    - 据报 Pre-A 轮的完整股权结构、投资人权利、清算优先权和治理结构。
