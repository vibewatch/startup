- id: china-market-battlefield
  title: China Is the Hardest Near-Term Battlefield Because Price and Speed Are Visible
  body: 'China is where Sudo''s competitive pressure is most immediate. Unitree has the clearest public price anchor in the sector, with G1 listed at US$13.5K, while still pushing the full-size H1 line and accessing new IPO capital. Agibot is dangerous for a different reason: it presents itself as a broad embodied-AI platform, claims large-scale A2 deployments, and is lining up public-market financing while targeting manufacturing and logistics. UBTECH brings a listed-company trust profile and an explicitly industrial Walker roadmap, even if its historical Walker sales were small and expensive. Fourier is less directly warehouse-centric, but its care and rehab lineage gives it a differentiated human-interaction story. DEEP Robotics appears adjacent rather than fully direct today because its humanoid remains more exploratory than commercial, while EngineAI represents the fast-moving low-cost edge of the market. In short, Sudo is not entering an empty Chinese lane; it is entering the world''s
    most active price-and-speed arena for embodied hardware.'
