- id: global-benchmark-set
  title: Global Benchmarks Already Show More Deployment Proof than Sudo
  body: 'The Western benchmark set is defined by two very different competitive models. Figure, Agility, Boston Dynamics, and Apptronik are trying to prove that vertically integrated humanoid systems can move from pilots into repeatable industrial deployments. Figure''s BMW record and Apptronik''s Mercedes, Jabil, GXO, and Google-linked roadmap are especially relevant because they marry physical hardware with data and manufacturing scale. Agility is important for a different reason: its value proposition is narrower than the most ambitious generalist narratives, but its commercial language is much sharper and more warehouse-native. Physical Intelligence and Sanctuary complicate the picture by attacking the intelligence layer instead of a single robot SKU, which means Sudo is not only competing against complete humanoids but also against reusable control systems that could run on many bodies. 1X sits farther from Sudo''s immediate wedge, yet its public consumer pricing shows how fast public
    expectations can reset once humanoids become products rather than demos.'
