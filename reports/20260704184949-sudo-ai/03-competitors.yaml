- id: moat-durability-and-underwriting
  title: Moat Durability Depends on Converting a Strong Model Story into Industrial Proof
  body: 'Sudo''s strongest public advantage is conceptual: it claims near-production manipulation robustness from a zero-real-data, simulation-first training path, and that is a real differentiator if it scales. The problem is that competitors are converging on different ways to erase that novelty. Figure and Apptronik are pairing AI narratives with manufacturing partners; PI and Sanctuary are abstracting the intelligence layer away from any one body; Unitree and EngineAI are moving public price anchors down; Agibot and UBTECH are turning certification, deployment, and public-market credibility into trust signals. Gartner''s January 2026 warning is the right adverse frame: only a small subset of humanoid vendors is likely to reach production scale by 2028, and many buyers may prefer polyfunctional robots with better throughput-per-dollar. For Sudo, that means moat durability will be earned by uptime, cycle time, and customer conversion—not by capital raised or demo quality alone.'
