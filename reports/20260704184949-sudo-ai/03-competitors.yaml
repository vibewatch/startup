- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Simulation-first data engine
    - PI, Figure, Apptronik, and Sanctuary keep scaling alternative data and control loops
    - High
    - Request evidence that Sudo's sim-only advantage persists on throughput, uptime, and new-task transfer
  - - Industrial picking wedge
    - Figure, Agility, Apptronik, Unitree, Agibot, and UBTECH already present more industrial proof points
    - High
    - Ask for named paid pilots, intervention rates, and task expansion beyond staged demos
  - - China speed and cost advantage
    - Unitree and EngineAI are moving the public price floor downward
    - High
    - Request Sudo's bill of materials, target ASP, and margin path versus China peers
  - - Capital signal as moat
    - Figure, PI, and Apptronik now have even larger disclosed funding pools
    - Medium
    - Separate capital availability from commercial readiness in the underwriting case
  - - Trust and partner access
    - Agibot certifications, UBTECH listing status, Mercedes/BMW/Schaeffler relationships, and Gartner caution all change buyer comfort
    - High
    - Request certification plans, integrator pipeline, and customer-reference quality from Sudo
  - - Humanoid form factor itself
    - Gartner argues polyfunctional robots may win on throughput-per-dollar before humanoids mature
    - High
    - Force Sudo to prove why a humanoid or human-form manipulator beats cheaper substitutes in each target workflow
  notes: The core underwriting question is whether Sudo's technical differentiation hardens into operating proof before rival data loops, prices, or partners commoditize the category.
