- id: pricing-distribution-and-switching
  title: Public Pricing Is Rare, So Distribution and Switching Costs Matter More
  body: A notable feature of this category is how little durable public pricing exists. Unitree, 1X, and EngineAI expose more visible price anchors than the rest of the field, while Sudo, Figure, Agility, Apptronik, Agibot, and current industrial UBTECH offerings still rely on contact-sales, pilots, or partnership-led motions. That means buyer choice will be driven less by a clean list-price comparison and more by deployment risk, integration speed, safety validation, and who already owns the account relationship. Agility and Apptronik lean on warehouse, automotive, and manufacturing partners. Figure has BMW and a manufacturing narrative. UBTECH and Agibot emphasize industrial certifications or factory-friendly operation. Sudo's problem is that its public story is still more technical than commercial. Until it can show paid fleet evidence, the practical switching cost in this market will accrue around site integration, workflow software, and proprietary data loops rather than around humanoid
    form factor alone.
