  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: fleet-economics
    missingEvidence: Like-for-like paid fleet counts, runtime, intervention rates, and utilization metrics for Sudo, Figure, Agility, Apptronik, Unitree, Agibot, and UBTECH.
    whyItMatters: Without standardized operating metrics, the chapter can rank narrative strength and visible deployments but cannot underwrite who truly wins on throughput, uptime, or payback.
    diligencePath: Request redacted customer deployment dashboards or cohort operating summaries from management and compare them against rival public claims.
    relatedQuestionRefs:
    - QP027
    - QP028
    relatedTableRefs:
    - TP001
    - TP004
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Signed pricing, lease, service, or RaaS terms for Sudo and most industrial rivals.
    whyItMatters: Public list prices exist for only a subset of the market, so the real competitive battleground on price and support economics remains partially hidden.
    diligencePath: Ask for redacted quotes, support contracts, and maintenance terms from Sudo plus customer reference calls on competing proposals.
    relatedQuestionRefs:
    - QP023
    - QP028
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: safety-and-integrator-readiness
    missingEvidence: Facility-specific safety approvals, integrator obligations, and warranty coverage for Sudo versus direct industrial rivals.
    whyItMatters: Competitive win rates in factories and warehouses often depend on trust, certification scope, and integrator burden more than on robot demos alone.
    diligencePath: Request certification packs, deployment checklists, and integrator playbooks from Sudo and compare them with customer requirements.
    relatedQuestionRefs:
    - QP021
    - QP022
    relatedTableRefs:
    - TP002
    - TP004
  - type: private-evidence-only
    severity: material
    topic: sudo-commercial-proof
    missingEvidence: Customer names, paid pilot scope, revenue contribution, and expansion evidence for Sudo itself.
    whyItMatters: Sudo's current competitive case rests on technical promise and capital backing more than on verified commercial adoption.
    diligencePath: Ask management for current pilot roster, conversion funnel, and site-level proof of repeat purchasing or task expansion.
    relatedQuestionRefs:
    - QP003
