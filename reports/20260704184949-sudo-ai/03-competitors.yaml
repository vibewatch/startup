company:
  name: Sudo AI
chapter:
  number: 3
  title: Competitive Landscape
  summary: Sudo AI is entering a crowded humanoid field where the strongest direct threats are not generic 'robotics' peers but a small group of vendors with either much deeper deployment proof or much sharper price disclosure. Figure, Agility, Apptronik, Unitree, Agibot, and UBTECH are the most relevant current benchmarks for industrial adoption, while Physical Intelligence and Sanctuary attack the embodied-AI control layer itself. Sudo's simulation-first picking thesis is still differentiated, but it is competing against rivals that already show BMW, Schaeffler, Mercedes, GXO, battery-swap factories, or public price anchors. The underwriting question is therefore not whether Sudo has an interesting model story; it is whether that story converts into throughput, uptime, and customer adoption before cheaper or better-deployed rivals define the category.
sections:
- id: landscape-and-substitutes
  title: 'Landscape: Sudo Competes with Humanoids, Model Layers, and Non-Humanoid Substitutes'
  body: 'Sudo AI should not be benchmarked against every robotics company equally. Its public positioning is a simulation-trained, manipulation-first system aimed at industrial picking and adjacent warehouse or factory workflows, and the closest threats are the companies already proving that human-form automation can survive real sites. That puts Figure, Agility, Unitree, Agibot, Apptronik, and UBTECH in the direct line of fire. A second tier matters almost as much: Physical Intelligence and Sanctuary attack the control layer rather than the body, which means they can erode the uniqueness of Sudo''s sim-first stack even if they do not sell the same humanoid shell. A third tier consists of 1X, Fourier, DEEP Robotics, and EngineAI, which widen the category, influence pricing expectations, or prove adjacent embodied-AI capabilities. The final substitute is not another humanoid at all but a cheaper polyfunctional, wheeled, or fixed automation stack combined with internal integration work.'
