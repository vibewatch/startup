evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: leadership-conflict
    missingEvidence: >-
      An official company leadership page or legal filing that unambiguously defines founder, co-founder, CEO, and
      technical-advisor roles.
    whyItMatters: Founder-market-fit and key-person-risk assessment depend on who actually founded and runs the company.
    diligencePath: >-
      Request the company’s cap table, incorporation records, and current officer list; reconcile with investor
      communications.
    relatedQuestionRefs:
      - QO010
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: round-terms
    missingEvidence: >-
      Primary documentation for the April 2026 financing round, including exact round label, amount, valuation, and
      board / investor rights.
    whyItMatters: Media widely cite a US$500M Pre-A round, but no filing or company-issued term summary was publicly reviewed.
    diligencePath: >-
      Request board-approved financing documents, investor rights agreements, and any press release circulated directly
      by the company.
    relatedQuestionRefs:
      - QO011
      - QO012
      - QO014
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: blocking
    topic: operating-metrics
    missingEvidence: >-
      Revenue, customer count, deployment count, backlog, gross margin, and headcount data tied to a consistent
      reporting date.
    whyItMatters: >-
      Without operating metrics, valuation can be described but not underwritten in a conventional venture or
      growth-equity framework.
    diligencePath: Request a current KPI dashboard and monthly operating review package from management.
    relatedQuestionRefs:
      - QO016
      - QO018
  - type: missing-source
    severity: material
    topic: product-form-factor
    missingEvidence: >-
      A company-issued specification sheet describing the full commercial hardware configuration, locomotion
      assumptions, and deployment envelope of Sudo R1.
    whyItMatters: >-
      The investment case changes materially depending on whether Sudo is selling a full humanoid platform or a more
      constrained manipulation-focused robot system.
    diligencePath: Request the current hardware BOM summary, mechanical spec sheet, and customer deployment architecture deck.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: >-
      Board composition, shareholder-control terms, and governance processes for a newly minted unicorn with many
      strategic investors.
    whyItMatters: >-
      Governance quality matters for follow-on financing, customer trust, and decision speed in a capital-intensive
      hardware company.
    diligencePath: Request the current board list, voting thresholds, reserved matters, and any investor-specific strategic rights.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: forecast dispersion
    missingEvidence: >-
      A reconciled market model that normalizes analyst scope, time horizon, and application inclusion before converting
      TAM into an investable scenario set.
    whyItMatters: >-
      Published humanoid forecasts differ by tens or hundreds of billions of dollars, which can distort valuation
      narratives if treated as interchangeable.
    diligencePath: >-
      Build a bottoms-up scenario model using explicit application, price, and deployment assumptions rather than one
      headline report.
