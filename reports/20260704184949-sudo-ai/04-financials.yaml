  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Signed price lists, pilot fee schedules, and any lease or RaaS proposal terms.
    whyItMatters: Without realized pricing, revenue quality and margin path remain guesswork.
    diligencePath: Request current sales deck, contract templates, and top five active proposals.
    relatedQuestionRefs:
    - QI003
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: BOM, gross margin, deployment labor, warranty burden, and support cost per customer.
    whyItMatters: These inputs determine whether scale improves economics or simply accelerates burn.
    diligencePath: Review management accounts and per-deployment contribution analysis.
    relatedQuestionRefs:
    - QI010
    - QI023
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, debt, and 12-24 month runway scenario model.
    whyItMatters: Capital adequacy cannot be judged from round size alone.
    diligencePath: Request current balance sheet, cash bridge, and financing covenant package.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI004
