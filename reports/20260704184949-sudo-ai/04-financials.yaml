- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on underwriting
  - what public evidence exists
  - exact diligence path
  rows:
  - - Revenue / ARR
    - Cannot separate pilot narrative from commercial traction
    - No reviewed source discloses revenue or ARR
    - Request monthly revenue by customer, product, and services mix
  - - Gross margin / contribution margin
    - Cannot assess whether scale increases or destroys unit economics
    - No BOM or realized price disclosure
    - Review BOM, contract pricing, deployment labor, and warranty assumptions
  - - Cash balance / runway
    - Cannot know survival horizon after the April 2026 raise
    - Only round size is public
    - Obtain current balance sheet and 12-24 month cash forecast
  - - Customer concentration by value
    - Cannot size downside from CATL or partner-led slippage
    - Only a few relationships are publicly named
    - See top-customer revenue, pipeline stage, and contracted volume
  - - Support cost per deployment
    - Cannot tell if zero-shot claims really lower CAC or merely shift cost to services
    - Hiring shows support effort but not cost
    - Measure deployment labor hours, travel, and failure rate per site
  - - Debt and off-balance-sheet obligations
    - Could materially change capital adequacy view
    - No public debt disclosure found
    - Collect financing agreements and capex commitments
  notes: Each row names a blocker that prevents confident revenue-quality or runway underwriting from public evidence alone.
