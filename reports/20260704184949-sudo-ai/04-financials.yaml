- id: financial-verdict
  title: Financial verdict and diligence blockers
  body: 'Financially, Sudo AI is not yet an underwritable operating business from public evidence alone; it is an underwritable thesis on capital access plus technical differentiation. The company has done the hard part of attracting a syndicate that can finance an expensive humanoid buildout and of presenting a technically differentiated simulation-first story. It has not done the equally important public part of showing revenue quality, pricing realization, support burden, customer concentration by value, or any stable path to margin. That gap does not make the company weak; it makes the current diligence problem private-data dependent. The most useful next package for investors is straightforward: current cash balance, monthly burn, price and cost by deployment type, customer-by-customer stage and value, and a milestone map from CATL-style validation toward repeatable paid rollouts. Until those materials are in hand, the appropriate financial posture is that Sudo is well funded relative
    to peers but still too opaque to price on conventional startup software or industrial-hardware metrics. Public peers that disclose more—UBTech through filings, Unitree through IPO coverage, and Agility through its transaction announcement—show that commercialization still demands either visible hardware revenue, major production investment, or fresh capital. Sudo discloses none of the corresponding internal metrics yet.'
