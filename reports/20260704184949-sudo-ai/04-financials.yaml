- id: sales-efficiency
  title: Sales motion and customer-development proxies
  body: 'Public materials suggest a strategic-account sales motion rather than a scaled self-serve or channel-led one. The most specific 2026 customer-development evidence points to CATL joint validation in battery-production and logistics workflows, with other reported cooperation ties to Mitsubishi Electric and COSCO Shipping. Even if some of those reports are lower-confidence than a signed case study, they still imply enterprise pursuit through partner introductions, investor networks, and custom workflow work rather than broad open-market demand. That matters for sales efficiency: strategic pilots can accelerate credibility and learning, but they often bring bespoke engineering, long procurement cycles, and uneven conversion into repeatable bookings. Sudo’s claim that customers can begin deployment without sharing sensitive production data is economically interesting because it could reduce pre-sale legal, IT, and security review. Yet no public source discloses cycle length, pilot fees,
    deployment team size, or customer-acquisition cost. Financially, the company looks like it may have a stronger path to reference accounts than to measurable sales-efficiency metrics at this stage.'
  claimRefs:
  - CI008
