company:
  name: Sudo AI
chapter:
  number: 1
  title: Company Overview
  summary: Publicly verifiable sources portray Sudo AI (上海苏度科技) as a Shanghai-founded embodied-AI robotics
    startup launched in May 2025 that unveiled the simulation-trained Sudo R1 manipulation system in April
    2026. The company is reported to have raised a US$500 million Pre-A round at roughly US$1.89–2.0 billion
    valuation less than a year after founding, backed by major Chinese strategic and financial investors.
    Its strongest disclosed differentiator is a simulation-first, world-model-plus-reinforcement-learning
    stack that claims near-100% zero-shot grasping success without real-world training data. However,
    the public record remains unusually inconsistent on founder attribution and sparse on core underwriting
    metrics such as revenue, customers, headcount, and governance. That combination—elite technical pedigree
    plus thin commercial disclosure—is the defining diligence pattern at this stage.
sections:
- id: identity-and-product
  title: Identity, Product Positioning, and Public Footprint
  body: The public record consistently identifies Sudo AI as Shanghai-based embodied-AI startup 上海苏度科技,
    founded in May 2025 and focused on building a general-purpose manipulation stack rather than selling
    a single-purpose automation appliance. Its official website introduces “#sudo R1” as a fully integrated
    hardware-software robot system centered on object picking, framed as the gateway primitive for broader
    physical intelligence. The company claims the system can handle transparent, reflective, deformable,
    and irregular objects in a 60-minute uncut evaluation, with about 98% first-attempt success and nearly
    100% success within two attempts, while remaining fully observation-conditioned at 15–25 Hz. Public
    evidence also shows the company already hiring across Shanghai, Beijing, Mountain View, Boston, and
    Zurich, which suggests an ambition larger than a local demo lab. That said, the official materials
    stop short of giving a complete product specification sheet or a clear description of whether the
    commercial product should be understood as a full humanoid platform or a manipulation-first dual-arm
    system.
