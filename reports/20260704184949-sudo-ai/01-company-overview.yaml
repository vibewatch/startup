- id: commercialization-and-milestones
  title: Commercialization Path, Product Readiness, and Milestones
  body: 'Sudo’s public milestone arc is compressed but coherent. The company was founded in May 2025,
    remained relatively low-profile for most of its first year, then surfaced publicly in April 2026 with
    its first technical blog and the Sudo R1 launch. The core message was not general humanoid theatrics
    but a specific claim: a simulation-only training stack, built around a 3D world model plus reinforcement
    learning, can transfer into real-world picking with near-production reliability. Coverage in April
    and June 2026 repeatedly linked this launch to industrial use cases such as manufacturing, industrial
    sorting, warehouse depalletizing, and logistics. Public reports also say Sudo has worked with CATL
    in battery-production and logistics scenarios, and that the company demonstrated the robot publicly
    at ICRA 2026 in Vienna. Even supportive sources, however, stop short of claiming scaled deployment
    or full production readiness; the official site itself says true production-grade performance still
    lies ahead. That tempers the otherwise aggressive capital and media narrative.'
  claimRefs:
  - CO021
  - CO022
  - CO023
  - CO024
  - CO025
