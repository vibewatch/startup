- id: diligence-flags
  title: Diligence Flags and Public-Record Gaps
  body: 'Sudo AI’s current diligence pattern is “impressive technical proof point plus unusually thin
    operating disclosure.” The simulation-first narrative is differentiated and widely repeated; the round
    size and valuation are also well publicized. But the underwriting blind spots are material. Public
    sources do not give revenue, backlog, customer count, unit economics, headcount, board governance,
    or the detailed legal structure of the round. They also do not cleanly settle the leadership story:
    one investor release names Su Hao as founder, while most Chinese media identify Han Zheng as co-founder/CEO
    and Su Hao as advisor. The public technical record likewise emphasizes picking and dual-arm manipulation,
    not a complete, commercially specified full-body humanoid product. Finally, a broader adverse sector
    read-through matters: ChinaBizInsider’s H1 2026 survey argues that embodied-AI startups are raising
    at extraordinary speed but may face a harsh consolidation cycle between 2027 and 2028 if deployment
    and cash generation lag. Sudo’s valuation therefore rests more on future-option value than disclosed
    operating proof.'
