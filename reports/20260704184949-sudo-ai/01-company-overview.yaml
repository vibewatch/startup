- id: leadership-and-governance
  title: Leadership, Technical Depth, and Key-Person Dependence
  body: Public Chinese coverage overwhelmingly names Han Zheng as Sudo AI’s co-founder and CEO, describing
    him as a former Microsoft Research Asia young scientist and serial entrepreneur who previously helped
    build ZEPP and Rocket Science before those ventures were acquired or merged. The same sources describe
    Su Hao—now a Fudan University professor and formerly at UC San Diego—as chief technical advisor, with
    deep credentials across ImageNet, ShapeNet, PointNet, SAPIEN, and embodied-AI evaluation systems.
    Several reports also name supporting leaders such as former Adobe 3D Gen AI executive Xu Zexiang and
    hardware lead Chen Runze, implying Sudo is deliberately combining academic frontier research, startup
    execution, and industrial systems building. The governance picture is still incomplete, however. No
    reviewed public source disclosed board composition, independent directors, or meaningful governance
    controls. More importantly, Hengdian Capital’s own English-language release describes Su Hao as the
    founder, which conflicts with the broader media consensus that Han Zheng is the operating co-founder/CEO
    and Su Hao the chief technical advisor. That inconsistency is material because Sudo’s underwriting
    case is heavily key-person driven.
  claimRefs:
  - CO013
  - CO014
  - CO015
