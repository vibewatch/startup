chapter:
  number: 6
  title: Customers
  summary: 'Sudo AI’s public customer story is promising but still validation heavy. The strongest evidence points to manufacturing and logistics as the first target segments, with CATL publicly linked to joint development in battery-production and logistics workflows and lower-confidence coverage naming Mitsubishi Electric and COSCO Shipping as additional partners or customer-side relationships. Those names matter because they move the story beyond anonymous demos, but the disclosed evidence still stops short of production-scale metrics, customer counts, contract values, or renewal data. Industry benchmarks from TechCrunch, China Daily, SCIO, and CKGSB suggest that this is normal for 2026-era humanoid deployments: structured manufacturing and warehouse tasks are the earliest realistic beachheads, while safety, battery life, ROI, and service support still block broader scale. Sudo therefore looks strongest as a strategic design-partner and pilot-validation company, not yet as a broadly commercialized
    fleet supplier. Customer diligence should focus on per-account stage, paid status, conversion into multi-workcell rollout, and whether current proof depends too heavily on investor-linked introductions rather than independent market pull.'
sections:
- id: segments
  title: Target segments, buyers, and workflow fit
  body: 'Sudo’s customer map is narrow in sector but logically coherent. The company’s own materials and investor-linked coverage consistently anchor the first use cases in manufacturing and logistics, especially industrial sorting and warehouse depalletizing. Those are the right workflows for an early humanoid system because they are repetitive, structured, and economically legible. The implied buyer is not a CIO buying generic AI; it is an operations, automation, or plant-engineering owner trying to remove labor bottlenecks without exposing sensitive production data. That also means the end user and the economic buyer are different: line operators or warehouse staff use the robot, but factory or logistics management underwrites the capex or project budget. Public evidence is weaker on who exactly pays in each case, yet the overall pattern is clear enough to treat Sudo as a B2B industrial automation supplier rather than a consumer robotics company. The strategic implication is that Sudo
    can focus its GTM effort on a relatively small number of high-value enterprise accounts, but it also inherits the long evaluation cycles and concentration risks that come with that segment.'
  claimRefs:
  - CU001
  - CU002
  - CU010
  - CU011
