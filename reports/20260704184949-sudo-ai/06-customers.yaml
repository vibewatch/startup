- id: adoption
  title: Adoption trajectory and enterprise friction
  body: 'The adoption trajectory is easier to describe qualitatively than quantitatively. Sudo was founded in May 2025 and publicly launched Sudo R1 in April 2026, so there has been very little elapsed time for enterprise pilots to mature into renewals or scaled rollouts. That timing itself explains why there are no public customer-count or retention metrics. Industry benchmarks nonetheless clarify the challenge. TechCrunch, SCIO, China Daily, and CKGSB all say 2026 demand is strongest in structured manufacturing and warehouse environments, but they also agree that ROI proof, safety, battery life, and serviceability remain hard gates before large-scale deployment. Sudo’s “no customer data needed initially” message is helpful because it may remove one procurement obstacle, especially in sensitive production settings. Even so, the rest of the gate remains: customers still need to believe the robot will keep working, pay back quickly enough, and scale from one workcell into many. Public sources
    do not yet show that those later hurdles are cleared.'
  claimRefs:
  - CU013
  - CU018
  - CU020
  - CU026
  - CU027
  - CU028
  tableRefs:
  - TU004
  figureRefs:
  - FU002
- id: retention
  title: Durability, support, and expansion logic
  body: 'Durability is currently the weakest public part of the Sudo story. There are no disclosed renewal, churn, NRR, GRR, contract-length, or pilot-conversion figures, so customer retention must be inferred from product and organizational behavior instead of measured. Hiring is useful here. The presence of sim-to-real evaluation and real-robot evaluation roles indicates that deployment success will depend on hands-on support and ongoing hardening, not just on shipping a robot. That does not mean the business is unattractive; it means customer success likely carries a services burden that public materials do not quantify. The upside case is clear: if a CATL-style validation converts into multi-workcell rollout, one account can become a high-value reference and open adjacent use cases in similar factories. The downside case is equally clear: if pilots stay bespoke and support heavy, the expansion loop may never outrun the company’s burn and valuation expectations. Customer durability therefore
    hinges on whether Sudo can convert early design-partner wins into repeatable, lower-friction expansions.'
  claimRefs:
  - CU019
  - CU021
  - CU022
  - CU023
  - CU033
  - CU034
  tableRefs:
  - TU005
  figureRefs:
  - FU004
- id: verdict
  title: Customer verdict and diligence priorities
  body: 'Sudo AI has enough public customer evidence to support seriousness, but not enough to support durability. The positive case is that the company is pointed at the right early segments, has at least one strategically important named validation partner in CATL, and is trying to solve an adoption blocker—data sensitivity—that matters in factories. The negative case is that almost every commercial denominator is still missing: there is no public customer count, no deployment count, no contract value, no renewal data, and no conversion data from pilot to repeat purchase. Concentration risk is also nontrivial because the strongest public proof overlaps with strategic investors and partner networks. The right customer diligence request is therefore a customer-by-customer pipeline that shows stage, paid status, success metric, workcell count, support burden, and next expansion trigger. Until then, Sudo should be treated as a strategically promising pilot-stage industrial robotics vendor
    rather than as a company with proven scaled customer demand.'
