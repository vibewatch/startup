- id: proof
  title: Named customer proof and current deployment stage
  body: The most important fact in Sudo’s public customer record is that it has moved beyond purely anonymous “top customer” language. CATL is repeatedly tied to joint development in battery-production and logistics workflows, while Mitsubishi Electric and COSCO Shipping appear in financing-related coverage as additional deep-cooperation relationships. That is real signal. It shows the company is engaging counterparties that matter in industrial automation and logistics. But the signal has limits. The CATL case is still described as validation or joint development, not as a disclosed production rollout. Mitsubishi Electric and COSCO add breadth but much less stage specificity. No source provides units deployed, paid contract value, uptime, throughput gain, or timeline from pilot to plant-wide adoption. Publicly, then, Sudo’s customer proof looks like design-partner validation rather than scaled commercial reference-account success. That is still valuable for a 13-month-old robotics company;
    it is simply not the same as a repeatable production customer base yet.
  claimRefs:
  - CU003
