  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - CATL reference account
    - Single named concrete use case can dominate the narrative
    - A failed conversion would weaken the strongest public proof point
    - Review milestone plan, paid status, and reference-account readiness with CATL
  - - Multi-workcell transfer
    - Promised expansion may not survive real factory variation
    - Without transfer, services burden stays high and land-and-expand weakens
    - Inspect per-workcell adaptation effort and success rates
  - - Investor-led introductions
    - Customer pipeline may overlap excessively with investors and strategic backers
    - Market pull could be overstated if independent demand is weak
    - Separate investor-sourced leads from organically won opportunities
  - - Manufacturing / logistics focus
    - Scenario mix is narrow and China heavy
    - Any sector slowdown or ROI miss could hit most demand at once
    - Map pipeline by geography, vertical, and use case
  - - After-sales support scaling
    - Retention may depend on a services team that scales slower than bookings
    - Could pressure gross margin and customer success
    - Review field-service model, intervention rate, and support staffing plan
  notes: The central customer risk is not absence of logos; it is insufficient proof that current logos convert into broad, durable, economically attractive demand.
