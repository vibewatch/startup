      - number: '5.5'
        title: 信任、安全与合规姿态
        blocks:
          - type: paragraph
            body: >-
              信任和安全是公开记录最弱的地方。Sudo
              的隐私切口相对清晰：公司称，客户初始部署不需要交出敏感生产数据；这对制造环境有吸引力，也可能降低一个采用障碍。除此之外，已审阅记录很稀疏。没有公开安全认证，没有发布电池或载荷规格，没有正式 uptime 或
              MTBF 指标，也没有类似保守工业买方常要求的外部质量保证材料。即便开发者故事，也仍比运营现实更像愿景，因为网站反复传递生态信息，却尚未开放公共 SDK
              或代码仓库。这些缺口并不否定技术，但它们正是区分“有说服力的机器人演示”和“采购、法务、安全团队能快速批准的企业产品”的项目。技术尽调应要求仿真器文档、故障模式分析、安全案例材料和部署 QA
              证据，然后再把系统视为已降险。
