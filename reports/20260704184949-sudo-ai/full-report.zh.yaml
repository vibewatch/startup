      - number: '7.6'
        title: 缓释、监测与否决标准
        blocks:
          - type: paragraph
            body: >-
              Sudo 的缓释叙事是连贯的，但大多仍停留在前瞻。最强缓释因素恰恰也是风险来源：如果仿真优先训练真的能降低数据成本和迭代时间，Sudo
              在特定任务上可能比依赖大量遥操作的对手进步更快。公司似乎也在押注工业场景；数据敏感、障碍丰富运动和多工位迁移，可能让闭环、zero-shot
              系统尤其有价值。投资人仍应坚持可衡量节点。关键监测项包括：试点到付费的转化、从抓取扩展到相邻技能、已披露安全 /
              认证进展、客户环境里的硬件可用率、每新增一次部署所需总资本，以及供应链依赖没有卡住规模化的证据。最清楚的投资假设失效触发条件包括：无法在策划过的抓取任务之外复现结果；到下一轮融资窗口前仍无法证明付费生产部署；重大安全事故；或有证据表明品类领导者锁定客户和供应商的速度快过
              Sudo 构建差异化。上述里程碑可见之前，即便技术上限令人兴奋，剩余风险仍高。
            claimRefs:
              - CR040
              - CR041
              - CR042
