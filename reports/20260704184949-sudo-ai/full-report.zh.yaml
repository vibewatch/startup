      - number: '4.5'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，Sudo AI
              还不是一家可被按经营数据定价的公司；它更像一个可投资判断的命题：资本获取能力加技术差异化。公司已经完成了困难部分：吸引一个能够为昂贵人形机器人建设提供资金的投资财团，并提出一个技术差异化的仿真优先故事。它尚未完成同样重要的公开部分：展示收入质量、定价兑现、支持负担、按价值划分的客户集中度，或任何稳定走向利润率的路径。这个缺口不说明公司弱，而是说明当前尽调问题依赖私有数据。对投资人最有用的下一组材料很直接：当前现金余额、月度
              burn、不同部署类型的价格和成本、逐客户阶段与价值，以及从 CATL 式验证走向可重复付费铺开的里程碑地图。在这些材料到手之前，合适的财务姿态是：Sudo
              相对同行资金充足，但仍过于不透明，无法按传统创业软件或工业硬件指标定价。披露更多的公开同行——通过申报披露的 UBTech、通过 IPO 报道披露的 Unitree，以及通过交易公告披露的
              Agility——都显示，商业化仍需要可见硬件收入、重大生产投资或新资本。Sudo 目前还没有披露相应内部指标。
