              评估和真机评估岗位说明，部署成败不只靠交付一台机器人，还要靠现场支持和持续加固。业务并不因此失去吸引力；真正的含义是，客户成功大概率背着一块服务负担，而公开材料没有量化。上行情景很清楚：如果 CATL
