        title: 差异化与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Sudo 文档最充分的差异化在训练经济性。许多具身智能团队仍依赖遥操作、真实世界示范，或针对每个新环境做少样本适配；Sudo
              则主张，高保真仿真可以在前期承担更多数据负担。如果为真，这会实质改变迭代速度和客户铺开经济性。限制在于，这个优势依赖一组隐藏技术前提：仿真器保真度、接触建模、传感器仿真质量、定位、触觉稳健性，以及公司在超出抓取后继续让真实世界表现对齐的能力。外部文献从另一个角度提出同样观点。Sim-to-real
              RL 越来越可信，但它仍对任务敏感；一旦本体差距、接触动力学和感知误差扩大，失败风险仍高。因此，Sudo
              的护城河真实但有条件。它不太建立在公开文档化的硬件规格表上，而更多取决于公司是否真正拥有一个可复利的仿真与评测飞轮。
