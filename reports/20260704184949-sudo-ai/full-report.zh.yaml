  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Sudo 的多头案例始于技术野心。公司官方材料展示了一个仅靠仿真的操作技术栈，在 zero-shot 抓取、避障运动和闭环控制上看起来异常强。如果这套方法真的能规模化，Sudo
              可能比依赖大量遥操作的对手复合得更快、更便宜，因为更多数据来自仿真，而不是人工采集。反论点同样强。公开证明仍集中在狭窄的抓取原语上，而不是已披露收入、多技能部署或稳定的现场经济性。Sudo
              自己也说，生产级性能仍在前方；这意味着投资人承保的是一次科学转化，而不是一台商业机器。实际投资问题不是论点是否令人兴奋，而是当前价格是否已经假设 Sudo
              会跻身少数人形机器人赢家，把研究新意转成可重复的工厂价值。在证明面扩大之前，多头和空头案例都异常有生命力。
