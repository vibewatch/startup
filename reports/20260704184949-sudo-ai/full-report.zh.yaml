  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现状态
        blocks:
          - type: paragraph
            body: >-
              Sudo AI
              的公开商业叙事，在工作流上远比在会计口径上具体。官方和投资方相关材料持续把近期机会锚定在工业分拣、仓库拆垛，以及其他重操作能力的流程；可靠抓取是这些流程的关口。这些证据支持一个先以硬件加部署工作为锚的收入模式，而不是一个已经披露的经常性软件业务。媒体和投资方报道还称，Sudo
              正支持工业制造和物流客户的二次开发，这意味着围绕仍在成熟的基础模型，会有可计费项目工作或集成投入。缺失的是任何已落地合同结构：没有公开标价，没有具名租赁计划，没有 RaaS
              费率，没有披露服务费，也没有确认收入指标。因此，最稳妥的结论是，Sudo 的变现仍处在技术证明与商业标准化之间的过渡区。April 2026
              的技术发布很重要，因为如果零数据部署真能在生产中站住，实施投入可能缩短；但今天，这个好处仍是商业化假设，而不是公开收入桥梁。公开可比公司强化了这一点：早期人形机器人收入通常硬件驱动，并受价格纪律约束。Unitree
              的 March 2026 IPO 报道援引招股书称，2025 年前九个月，人形机器人已贡献主营业务收入超过 51%，而平均 humanoid ASP 降至 167,600 yuan。UBTech 的 2025
              年申报业绩同样显示，工业人形机器人收入计入产品与服务经济模型，而不是纯软件模式。
