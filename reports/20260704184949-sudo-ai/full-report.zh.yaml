      - number: '8.2'
        title: 建议、置信度与价格纪律
        blocks:
          - type: paragraph
            body: >-
              我们给予 Sudo AI「跟踪」评级，置信度中等，风险高，估值立场偏紧。正确心智模型是「公司有意思，价格很难」，不是「公司很差，不惜一切代价回避」。如果 Sudo 证明自己属于 Figure、Agility
              或最强中国在位者那一组未来领导者，传闻中超过 $2B 的估值可以自洽。但公开记录尚未显示这些可比对象正在积累的商业化证据。Agility 已经有订单和运营小时记录；Figure 和 PI
              资本基础深得多；Unitree 有真实收入和更便宜的硬件位置。这不会推翻 Sudo 的论点，但意味着投资人应按里程碑纪律承保。高溢价入场需要证明相邻技能部署、更清晰的客户
              ROI，以及一份能扛住商业化周期慢于预期的资本计划。中等置信度反映的是：定性上行空间很强，但定量承销基础仍稀薄。
