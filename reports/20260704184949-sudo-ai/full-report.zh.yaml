              Sudo AI
              当前的尽调画像是“亮眼技术证明点，加上异常稀薄的经营披露”。仿真优先叙事有差异化，也被广泛复述；融资规模和估值同样被充分传播。但投资判断盲区很实质。公开来源没有给出收入、在手订单、客户数量、单位经济、员工数、董事会治理或本轮融资的详细法律结构。领导层故事也没有被干净地厘清：一份投资方新闻稿称
              Su Hao 为创始人，但多数中文媒体把 Han Zheng 识别为联合创始人 / CEO、Su Hao
