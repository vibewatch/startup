            body: >-
              Sudo
              的架构，公开层面最容易从技术报告和招聘地图的组合中读懂。报告称，模型完全在仿真中训练，并以全闭环方式运行；每一步控制都基于最新观测，而不是执行一大段长开环动作块。投资方相关材料和媒体反复提到世界模型加强化学习的设计。招聘补上了栈边缘：运动规划、3D
              视觉、触觉传感、具身学习、LLM/VLM 工作、sim-to-real
              评测和真实机器人测试，都作为活跃工作流出现。合在一起看，产品像一个分层系统，依赖仿真器保真度、感知、学习策略和部署打磨。这个架构方向上符合外部 sim-to-real 机器人文献，也与 NVIDIA 的 2026
              人形机器人栈一致，尽管 Sudo 的公开故事比多数外部基准更激进地押注纯仿真。主要尽调问题不是架构看起来不可信，而是许多子系统只能从公开证据推断，并没有被完整文档化。
