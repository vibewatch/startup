        blocks:
          - type: paragraph
            body: >-
              中文公开报道压倒性地把 Han Zheng 称为 Sudo AI 的联合创始人兼 CEO，并描述其为前 Microsoft Research Asia 青年科学家、连续创业者，曾参与打造 ZEPP 和
              Rocket Science，后者分别被收购或合并。同一批来源把 Su Hao 描述为首席技术顾问；他目前是 Fudan University 教授，此前在 UC San Diego 任职，在
              ImageNet、ShapeNet、PointNet、SAPIEN 和具身智能评测系统等领域履历很深。多篇报道还提到前 Adobe 3D Gen AI 高管 Xu Zexiang、硬件负责人 Chen Runze
              等支持型领导者，暗示 Sudo 有意把学术前沿研究、创业执行和工业系统建设拼在一起。不过，治理图景仍不完整。已审阅公开来源均未披露董事会构成、独立董事或有意义的治理控制。更关键的是，Hengdian
              Capital 自己的英文新闻稿把 Su Hao 描述为创始人，这与多数媒体认为 Han Zheng 是运营联合创始人 / CEO、Su Hao 是首席技术顾问的共识冲突。这个不一致很重要，因为 Sudo
              的投资判断高度依赖关键人物。
