          detail: 模型和工作流针对特定工位适配。
        - id: a4
          label: 验证试点
          detail: 在真实运营中衡量表现。
        - id: a5
          label: 标杆账户决策
          detail: 客户决定是否扩展到更多产线或站点。
        - id: a6
          label: 规模化铺开
          detail: 只有复现性得到证明后，账户才会变成耐久收入。
      edges:
        - from: a1
          to: a2
        - from: a2
          to: a3
        - from: a3
          to: a4
        - from: a4
          to: a5
        - from: a5
          to: a6
