      - number: '5.3'
        title: 部署、集成与成熟度
        blocks:
          - type: paragraph
            body: >-
              公司最强的成熟度信号，是它选择了一个困难且可衡量的技能基准，并展示了长时间连续测试，而不是一段短剪辑。60
              分钟不剪辑抓取评测覆盖不同光照、杂乱和干扰，这很有意义，因为它测的是可靠性，而不只是单次能力。不过，公开部署故事仍处早期。sim-to-real
              评测、真实机器人评测和现场支持的招聘足迹显示，真实世界打磨仍是一个重要运营闭环。这对企业机器人很正常，但意味着客户不应把“零样本初始表现”等同于“没有集成工作”。更现实的读法是，Sudo
              试图减少部署中最昂贵、最难规模化的部分——面向现场的数据采集——同时仍在重投验证、支持和工作单元适配。因此，成熟度呈现不对称：操作可靠性有异常强的公开证据，而可重复多站点部署、广泛技能覆盖和企业硬件透明度仍在成熟中。
