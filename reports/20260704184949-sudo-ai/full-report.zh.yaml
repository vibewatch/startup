              detail: 匿名引用不能作为尽调终点。
            - label: 早期
              tone: warning
              detail: 二次开发暗示仍在规模化前阶段。
            - label: 低
              tone: warning
              detail: 没有公开 KPI 或合同证据。
            - label: 隐性
