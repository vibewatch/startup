companyProfile:
  summary: >-
    Sudo AI（上海苏度科技）是一家创立于上海的具身智能创业公司。公司在 April 2026 推出 Sudo R1 后进入公众视野；Sudo R1 是一个聚焦操作能力的机器人系统，训练完全依赖仿真数据。公司把技术边界定义为
    Real2Sim2Real 工作流：用 3D 世界模型结合强化学习，在没有真实世界示范的情况下完成零样本物体抓取。公开来源显示，公司成立于 May 2025，并在 April 2026 完成一笔重大 Pre-A 融资，估值约
    US$1.89-2.0B，背后有高知名度投资人与技术生态。公开记录中同样重要的是缺口：收入、客户数量、已部署机队规模、董事会构成和清晰的投资条款仍未披露，因此尽调判断更多落在期权价值和技术履历上，而不是已验证的经营表现。
  foundedDate: '2025-05-19'
  founders:
    - name: Han Zheng
      role: 联合创始人兼 CEO
      background: 中文公开报道把 Han Zheng 描述为前 Microsoft Research Asia 青年科学家和连续创业者，早期项目包括 ZEPP 和 Rocket Science。
