      - number: '2.2'
        title: 规模测算视角，以及估算为何差异巨大
        blocks:
          - type: paragraph
            body: >-
              公开的人形机器人市场估算方向上偏乐观，但数字彼此不一致。Grand View Research 相对保守，认为市场会从 2024 年约 US$1.55 billion 增至 2030 年 US$4.04
              billion。MarketsandMarkets 和 Fortune Business Insights 明显更激进，而 Future Market Insights 更进一步，给出 2026 年
              US$10.69 billion、2036 年 US$248.90 billion。这些差异并不小；它们隐含着对定价、可靠性，以及家庭或服务场景能否规模打开的完全不同判断。实践上的教训是，一个宽泛 TAM
              估算不是尽调。更好的做法是在同一页上保留多组视角：纯人形机器人市场预测、相邻仓库和工业自动化支出池，以及区域商业化信号。这样能保留矛盾，而不是把矛盾抹平，也能让 Sudo
              的机会绑定真实部署条件，而不是最大那个标题数字。
