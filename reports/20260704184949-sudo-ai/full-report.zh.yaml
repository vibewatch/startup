        title: 格局：Sudo 与人形机器人、模型层和非人形替代品竞争
        blocks:
          - type: paragraph
            body: >-
              不应把 Sudo AI 与每一家机器人公司等量对标。它的公开定位是一个仿真训练、操作优先的系统，面向工业抓取及相邻仓库或工厂工作流；最直接的威胁，是那些已经在证明类人形自动化能在真实现场存活的公司。这让
              Figure、Agility、Unitree、Agibot、Apptronik 和 UBTECH 进入直接火线。第二层几乎同样重要：Physical Intelligence 和 Sanctuary
              攻击的是控制层，而不是本体，这意味着即便它们不卖同一种人形外壳，也可能削弱 Sudo 仿真优先栈的独特性。第三层包括 1X、Fourier、DEEP Robotics 和
