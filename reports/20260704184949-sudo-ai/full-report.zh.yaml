            - label: 不明
              tone: warning
              detail: 未公开部署阶段。
            - label: 有限
              tone: warning
              detail: 工作流具体度很薄。
            - label: 中
              tone: neutral
              detail: 支撑物流相关性，但不能证明规模。
        - label: 未具名头部客户
