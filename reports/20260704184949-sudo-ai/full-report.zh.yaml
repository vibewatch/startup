      - number: '8.4'
        title: 多头、基准与空头情景
        blocks:
          - type: paragraph
            body: >-
              由于公开收入未披露，情景分析必须围绕里程碑。我们的基准情景（约 40%）假设 Sudo 到 2027 年把早期工业验证转成有限付费部署，从抓取扩展到少数相邻工位技能，并保留足够融资弹性，支撑约 $1.5-2.2B
              估值。多头情景（约 25%）假设其仿真优先系统比预期更通用，客户 ROI 可见，公司借中国更快硬件生态走向 $3.0-4.5B 结果。空头情景（约 35%）假设 sim-to-real
              缺口依然顽固，试点转化不够快，下一轮融资在压力下完成，结果更接近
              $0.8-1.2B，或至少是平轮。这里的不对称很不寻常：上行空间很大，但空头情景可信，恰恰因为当前估值很大一部分依赖未来证明，而不是当前单位经济性。这就是为什么里程碑纪律比表格精度更重要。
