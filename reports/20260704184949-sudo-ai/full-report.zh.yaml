  - id: FE004
    title: 产品成熟度 / 能力图谱
    type: matrix
    layout: wide
    summary: Sudo 的公开证据，在反复展示操控行为的环节最强；企业级硬件披露仍然缺位的环节最弱。
    data:
      columns:
        - 公开证据质量
        - 落地成熟度
        - 差异化强度
        - 关键缺口
      rows:
        - label: 零样本抓取
          values:
            - label: 强
              tone: positive
              detail: 官方长视频演示与媒体佐证相互印证。
            - label: 中
              tone: neutral
              detail: 已有验证，但主要集中在一个任务族。
            - label: 强
              tone: positive
              detail: 仿真优先的泛化能力，是清晰的切入口。
            - label: 技能宽度
              tone: warning
              detail: 更宽的操控集合，公开层面仍未验证。
        - label: 避障执行
          values:
            - label: 中
              tone: positive
              detail: 公开片段和文章支撑这一主张。
            - label: 中
              tone: neutral
              detail: 在受限工位里可能有用。
            - label: 中
              tone: positive
              detail: 把空间推理接进策略。
            - label: 安全边界
              tone: warning
              detail: 尚未披露正式安全论证或认证。
        - label: 开发者生态
          values:
            - label: 有限
              tone: warning
              detail: 有开发者中心的表述，但工具公开信息很少。
            - label: 早期
              tone: warning
              detail: 招聘信息显示仍在搭建。
            - label: 中
              tone: neutral
              detail: 如果实际工具出现，可能变成护城河。
            - label: 无公开 SDK
              tone: warning
              detail: 外部开发者还不能自助接入。
        - label: 企业级硬件就绪度
          values:
            - label: 有限
              tone: warning
              detail: 未公开电池、载荷或认证细节。
            - label: 早期
              tone: warning
              detail: 公开材料看起来仍处验证阶段。
            - label: unknown
              tone: neutral
              detail: 硬件护城河的文档化程度弱于软件护城河。
            - label: 规格透明度
              tone: warning
              detail: 部署所需的关键事实仍未披露。
    approximationNotes: 单元格评估的是证据质量和成熟度，不是绝对工程水平。
    claimRefs:
      - CE010
      - CE011
      - CE019
      - CE020
      - CE021
      - CE033
      - CE034
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: Sudo 隐含的企业客户旅程，是先发现工作流，再验证；只有经济性成立后，才进入多工位铺开。
    data:
      nodes:
        - id: j1
          label: 发现
          detail: 运营或自动化团队通过投资人 / 合作伙伴网络或媒体报道听说 Sudo。
          tone: neutral
        - id: j2
          label: 技术资格评估
          detail: 客户评估零样本抓取和数据安全姿态是否匹配工作流。
          tone: warning
        - id: j3
          label: 联合开发
          detail: Sudo 为特定工位或物流任务支持二次开发。
          tone: warning
        - id: j4
          label: 试点验证
          detail: 客户在受限生产场景中测试可靠性、干预率和 ROI。
          tone: warning
        - id: j5
          label: 多工位扩展
          detail: 如果试点成功，同一模型会适配到更多工位或产品。
          tone: positive
        - id: j6
          label: 规模化账户
          detail: 只有到这个阶段，客户才成为真正耐久的标杆账户。
          tone: positive
    approximationNotes: 阶段基于已审阅客户证据和人形机器人采购惯例推断；公开资料尚未显示任何账户走到最后阶段。
