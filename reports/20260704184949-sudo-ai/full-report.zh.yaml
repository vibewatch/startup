      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              跨来源看，最早具备商业相关性的买方是大型工业和物流运营商，不是家庭。MarketsandMarkets 和 Fortune 都指向制造、仓储和物流这些最早高速增长的部署场域，McKinsey 对 Agility
              的访谈则称，今天产品 - 市场匹配最清晰的地方在物流。在这些细分场景中，用户是工厂车间或配送中心的一线员工和主管，但买方和付款方通常是背负 capex
              和生产率目标的运营、自动化或供应链负责人。医疗、酒店、零售和家庭场景仍然重要，但它们对可负担性、人机互动质量和安全保证更敏感。这个区分对 Sudo
              很关键，因为公司围绕抓取和工业操作的公开定位，正好对齐那些把劳动力替代、错误减少和班次覆盖列入预算的问题，而不是投机性的消费功能。
            claimRefs:
