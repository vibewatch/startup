            body: >-
              Sudo 的公开里程碑压缩但连贯。公司成立于 May 2025，第一年大部分时间相对低调，随后在 April 2026 通过第一篇技术博客和 Sudo R1
              发布进入公众视野。核心信息不是泛泛的人形机器人表演，而是一个具体主张：围绕 3D 世界模型和强化学习搭建的纯仿真训练栈，可以把真实世界抓取做到接近生产级可靠性。April 2026 和 June 2026
              的报道反复把这次发布与制造、工业分拣、仓库拆垛和物流等工业场景联系起来。公开报道还称，Sudo 已在电池生产和物流场景中与 CATL 合作，并在 Vienna 的 ICRA 2026
