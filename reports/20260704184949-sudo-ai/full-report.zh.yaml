      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              人形机器人多头叙事建立在一组熟悉但仍有力量的驱动因素上：结构性劳动力短缺、工资压力、人体工学和工伤减少、更高吞吐预期，以及基于 AI
              的感知、运动规划和仿真驱动机器人训练快速进步。在仓库自动化领域，Research and Markets 称 80% 的仓库仍靠人工，仅 5% 实现自动化；Symbotic 和 Interact Analysis
              也显示移动自动化继续强劲增长。但约束同样重要。IFR 认为，人形机器人仍需证明可靠性、能效、维护经济性和工业耐用性能够对标传统自动化。McKinsey 和 Mobile World Live
              都强调，许多当前系统仍受限于工作单元，或受制于尚未解决的人机协作安全问题。European Parliament 和 Harvard Journal on Legislation 的材料又加上一层：职场 AI
              仍带来可解释性、监控、问责和责任归属问题。因此，采用并不只被需求卡住；信任、监管和集成复杂度才是关口。
            claimRefs:
