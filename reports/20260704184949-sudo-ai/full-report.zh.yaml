  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与用例范围
        blocks:
          - type: paragraph
            body: >-
              公开产品不是泛泛的“AI 机器人”抽象概念，而是 Sudo
              R1：一个以物体抓取为验证场的全栈、操作中心机器人系统。公司自己的表述很重要，因为它揭示了管理层认为瓶颈在哪里：不是为了人形行走本身，而是要可靠处理真实物体的长尾。官方文案反复把机器人放在仓库、厨房和工厂地面，并强调抓取是许多有经济价值工作流的入口能力。这比“通用人形智能”窄得多，也更可执行。它也解释了为什么当前公开演示看起来强，但更广泛的人形机器人问题仍有大部分未解。今天最强的产品信号，是对陌生物体的特定任务可靠性。较弱的信号是广度。公开材料尚未验证装配、工具使用、高精度操作或多技能服务任务。因此，投资人和客户应把
              Sudo R1 理解为一个早期但有差异化的工作流机器人平台，而不是一个已经披露的全能人形机器人。
