  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Sudo AI
              正在挑战机器人领域最难的技术和商业问题之一：用仿真优先强化学习，在真实环境里做出可靠的人形机器人操作能力。公开上行空间很清楚。官网展示了一个有说服力的零真实数据抓取演示，中国画像报道也显示投资人愿意为这个故事大手笔融资。但最高严重度的风险集中在尚未被证明的部分。Sudo
              自己的材料也称，生产级性能仍在前方，这意味着公司还卡在研究成功与可复制部署之间。这个缺口很重要，因为该赛道已经围绕少数领导者资本化；这些玩家资金更深、数据项目更大、商业牵引更可见。因此，现实风险栈从
              sim-to-real 迁移和灵巧操作开始，延伸到供应链和制造爬坡，再进入市场采用时点、现金消耗，以及 Figure、Physical Intelligence、Agility、Unitree、AgiBot
              带来的战略拥挤。今天的严重程度不是由某个法律事件驱动，而是由一种可能性驱动：在 Sudo 抵达付费、安全、高频的生产环境使用之前，多重未解约束先叠加起来。
