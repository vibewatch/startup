            - 末端执行器 / 手
            - 机载计算和电源
        - label: 第 2 层
          detail: 感知和状态估计
          modules:
            - 3D 视觉
            - 障碍物感知
            - 可能的 VSLAM / 场景状态估计
        - label: 第 3 层
          detail: 策略和推理
          modules:
            - 世界模型信号
            - 强化学习操控策略
            - 闭环动作生成
        - label: 第 4 层
          detail: 训练和评估系统
          modules:
            - 高保真仿真器
            - 域随机化
            - 仿真到现实 / 真机评估
        - label: 第 5 层
          detail: 部署和生态
          modules:
            - 二次开发
            - 现场支持
            - 开发者中心建设
    approximationNotes: 部分模块由 Sudo 直接声称，其他模块则基于招聘信息和标准仿真到现实人形机器人工作流推断。
    claimRefs:
      - CE001
      - CE008
      - CE016
      - CE017
      - CE018
      - CE026
      - CE030
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: standard
    summary: 公开运营叙事，是从仿真训练能力出发，通过加固循环进入客户现场验证。
    data:
      nodes:
        - id: p1
          label: 仿真数据生成
          detail: 无需客户现场采集即可训练操控策略。
        - id: p2
          label: 策略学习
          detail: 世界模型 / RL 栈学习抓取和恢复行为。
        - id: p3
          label: 零样本初始部署
          detail: 客户无需采集本地数据，就能看到第一版能力。
        - id: p4
          label: 真机评估
          detail: Sudo 在真实约束和扰动下衡量性能。
        - id: p5
          label: 二次开发
          detail: 团队把基础模型适配到工位或相邻工站。
        - id: p6
          label: 生产候选
          detail: 只有反复通过现场验证后，机器人才能成为真正的工作流组件。
      edges:
        - from: p1
          to: p2
        - from: p2
          to: p3
        - from: p3
          to: p4
        - from: p4
          to: p5
        - from: p5
          to: p6
    approximationNotes: 流程基于官方和招聘证据；它不是已发布的 SOP。
    claimRefs:
      - CE008
      - CE018
      - CE022
      - CE027
      - CE029
