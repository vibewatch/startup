      - number: '8.6'
        title: 退出准备度、投资假设失效触发条件与最终尽调
        blocks:
          - type: paragraph
            body: >-
              今天承销一条清晰退出路径还太早。近期更可能的结果是再来一轮私募融资、达成战略工业合作，或等可重复部署经济性出现后再走
              IPO。最重要的尽调项，是那些能最快压缩不确定性的事项：确切轮次条款和股权结构表、试点到付费转化、具名客户经济性、制造准备度、安全和认证路线图，以及可能卡住规模化的硬件与算力依赖。最清楚的投资假设失效触发条件包括：无法在相邻任务中复现抓取结果、安全挫折、烧钱速度跑过融资渠道，或有证据表明
              Unitree、AgiBot 或 Figure 级领导者先锁定供应链和设计定点。在这些问题得到回答之前，回报最大化姿态是把 Sudo
              留在主动跟踪名单上，等待一个由商业化证明锚定的后续入场点，而不是现在为纯前沿溢价买单。
