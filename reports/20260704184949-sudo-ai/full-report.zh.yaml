      - number: '7.3'
        title: 运营、技术与可靠性风险
        blocks:
          - type: paragraph
            body: >-
              技术风险仍是投资判断的核心问题。Sudo
              网站同时提供了最强的希望证据和脆弱性证据：它展示了一个只有仿真的系统，抓取表现很强；但它也清楚说明，泛化性、敏捷性、鲁棒性和空间智能要一起解出，仍是开放问题。学术和综述文献强化了这点。Sim-to-real
              迁移在运动控制上比在接触密集的操作上更好做；灵巧手、触觉反馈、力传感、可变形物体和长尾环境变化仍然很难。因此，把一个高性能抓取原语当成更广泛工厂或仓库自动化的证明，很冒险。即便控制策略够强，公司仍必须证明硬件可靠性、可重复良率、校准纪律、现场服务、信息物理安全和事故响应。公开证据尚未显示
              Sudo 已在多个客户工位上规模化、重复跑通，因此运营案例仍是前瞻性投资假设，而不是已经降风险的部署记录。
