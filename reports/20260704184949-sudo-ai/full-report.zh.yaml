  - id: FU004
    title: 扩张与集中度循环
    type: flow
    layout: wide
    summary: Sudo 第一批客户切入口之所以有吸引力，也正来自同一组因素；一旦试点停滞，这些因素会变成集中度和转化风险。
    data:
      nodes:
