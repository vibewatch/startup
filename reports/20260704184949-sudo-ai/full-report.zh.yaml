      - number: '8.3'
        title: 融资背景、入场纪律与条款清单风险
        blocks:
          - type: paragraph
            body: >-
              公开视野里最主要的融资事实方向清楚、数字模糊：Sohu 报道 Sudo 最新估值超过 $2B，并称 CATL 关联资本、Alibaba、Tencent 和 Ant
              参与支持；但公司自己的公开材料没有确认准确轮次规模、投资人名单、清算优先权结构或资金用途。这足以说明投资人正在为前沿可选性付高价，却不足以判断普通股回报是否受到良好保护。因此，入场纪律应在价格之前先看三件事：Sudo
              相对商业化需求到底还剩多少资本；下一轮融资更可能基于证据还是希望；新钱之上已经堆了多少优先权或结构化下行保护。这在人形机器人里比软件更重要，因为数据、硬件、安全验证和制造会一起吃资本。公司技术上可以正确，但如果融资条款和里程碑时点错配，晚期入场仍可能很差。
            claimRefs:
              - CV016
              - CV017
