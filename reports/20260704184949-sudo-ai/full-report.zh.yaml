      - number: '7.2'
        title: 监管、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              短期看，Sudo 面临的法律负担不在单一许可证，而在不断扩大的责任暴露面。人形机器人在员工或客户周围运行，即便还没实现完全自主，也会带来产品责任、合同、隐私和工作场所安全暴露。Hill Dickinson 和
              K&L Gates 都把 2026 年视为 AI 产品责任法理和人形机器人部署治理走向具体化的阶段，尤其聚焦责任分配、安全保护和文档留痕。地缘政治也叠加进来。BIS
              指引称，出口到特定中国关联实体的高级计算物项需要许可证，高级计算管制的规则制定仍在推进。Sudo 也许能把部分技术栈本地化，但在没有公开物料清单或算力来源披露的情况下，投资人无法判断公司对跨境
              GPU、工具链或传感器约束的暴露程度。西方监管谨慎也可能拖慢全球商业化落地；中国部署环境更快，或许能提升执行速度，却会制造监管分化，让跨国销售和安全保证更复杂。
            claimRefs:
