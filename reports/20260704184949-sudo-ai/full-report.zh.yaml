    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品定位与公开足迹
        blocks:
          - type: paragraph
            body: >-
              公开记录一致把 Sudo AI 识别为总部在上海的具身智能创业公司上海苏度科技，成立于 May 2025，重点不是销售单一用途自动化设备，而是搭建通用操作栈。官网把 “#sudo R1”
              介绍为一个软硬件全栈一体化机器人系统，以物体抓取为核心，并把抓取定义为更广泛物理智能的入口能力。公司称，该系统在一段 60 分钟不剪辑评测中，能够处理透明、反光、可变形和不规则物体，首次尝试成功率约
              98%，两次内成功率接近 100%，并且全程以 15–25 Hz 基于观测闭环运行。公开证据还显示，公司已在 Shanghai、Beijing、Mountain View、Boston 和 Zurich
              招聘，这说明目标不只是本地演示实验室。不过，官方材料没有给出完整产品规格表，也没有清楚说明商业产品应被理解为完整人形平台，还是一个操作优先的双臂系统。
