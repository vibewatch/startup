      - number: '7.4'
        title: 合作伙伴、竞争与市场采用风险
        blocks:
          - type: paragraph
            body: >-
              Sudo 所在市场还没有完成广泛商业化，竞争已经变得拥挤。Figure、Physical Intelligence、1X、Agility、Unitree 和 AgiBot
              共同说明，人形机器人投资人正在把资本集中到几类团队：模型叙事更强、部署证据更清晰，或中国硬件生态成本更低。TrendForce 预计中国人形机器人产量将在 2026 年激增，并称 Unitree 和 AgiBot
              可能拿下近 80% 份额；这利好生态成熟，却不利于错过第一波平台窗口的新进入者。Sudo 也有交易对手依赖。Sohu 画像称公司正与 CATL
              在制造场景联合开发，并在海内外建设开发者中心；这些都是有用信号，但也会带来客户、路线图和生态集中。原则上市场需求存在，但 KraneShares 和 Hill Dickinson
              都提示，人形机器人广泛采用仍会循序渐进、对安全敏感，并高度依赖其相较更便宜单用途自动化的经济性证明。也就是说，Sudo 不能只靠演示赢；它还要靠可重复性、切换价值和总拥有成本赢。
            claimRefs:
