      - number: '7.5'
        title: 财务、人才与执行风险
        blocks:
          - type: paragraph
            body: >-
              财务和执行画像是：公司还在证明科学问题，却按未来平台的节奏花钱。公开可见招聘显示，Sudo 在上海、北京、波士顿、苏黎世和 Mountain View 有 30
              个开放岗位；这符合严肃野心，也意味着在清晰商业收入披露前，公司已经开始高成本全球扩张。公司仍很年轻，公开记录强调研究实力、连续创业和生态关系，多过已被证明的规模化硬件制造。这不代表团队无法执行；它意味着投资人被要求为制造、安全、销售和财务能力承保，而这些能力尚未在公开证据中得到证明。资金更充足的同行说明，即便
              $500 million
              级融资准确，也未必足以把操作演示撑到生产机队，尤其在重复训练、硬件迭代和客户定制集成仍有必要时。换句话说，现金跑道风险不只是现金能烧几个月；关键是商业化能否在下一轮融资必须启动之前到来，而且届时公司是带着证据融资，还是带着希望融资。
