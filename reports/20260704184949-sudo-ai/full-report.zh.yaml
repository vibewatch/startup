      - number: '8.5'
        title: 可比公司组与估值背景
        blocks:
          - type: paragraph
            body: >-
              可比公司组提示谨慎。Figure 2024 年 $2.6B 估值和后来的 $39B 跳升，说明一旦资本、品牌和部署证据复合，人形机器人领导者可以被多么剧烈地重估。PI
              的数十亿美元估值路径说明，投资人也会为被认为掌握认知层的团队支付软件模型溢价。1X 代表相反风险：叙事和消费者可选性会把估值推到远超变现的位置。Agility
              是最清晰的落地参照，因为它公开披露了现金消耗、订单和运营小时；Unitree 是最有用的中国锚点，因为它说明一家有收入的机器人公司，估值仍可能低于最响亮的前沿叙事。Sudo
              介于两者之间：科学新意强过普通硬件初创，但商业证明远弱于资本最充足的领导者。在这个基础上，传闻中超过 $2B 的估值已经像是上层可选性定价，而不是保守入场价。
