      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              关于 Sudo 最干净的公开财务事实，是 April 2026 融资规模。约 USD 500 million 的一轮融资，对于一家 May 2025
              才成立的公司来说异常庞大，也给管理层留下真实运营空间，用于招聘、验证客户和打磨产品。这是上行面。下行面是，资本充足性不能只从轮次规模判断。已审阅公开来源仍让账面现金、烧钱速度、债务、设备融资、跑道和 capex
              承诺全部不透明。更广泛的具身智能报道在这里主要是警示：标杆报道把许多人形机器人创业公司描述为有 18-24 个月现金支持，并面对 2027-2028
              证明期；只有把技术进展转化为真实商业闭环的公司才可能活下来。因此，Sudo
              的资本结构读起来强，但有条件。强在融资是真实的，且战略投资人占比高；有条件在于，公司仍需把这笔融资转化为可重复部署、可衡量经济性，并更清楚地展示从试点工作单元走向多工作单元铺开时，毛利是改善还是恶化。可比龙头仍高度依赖融资。Agility
              在 June 2026 的上市交易，把超过 $300 million 的多年订单与超过 $620 million 的预期总募资配对，用于生产和部署扩张；Figure 和 1X
              也仍在以数十亿美元估值寻求十亿美元级私人融资。这些可比公司说明，Sudo 在 April 2026 的融资买来了时间，但如果部署继续高度定制，融资依赖并没有消失。
