      - number: '4.3'
        title: 成本结构与单位经济能见度
        blocks:
          - type: paragraph
            body: >-
              Sudo 的成本画像只能从技术野心和招聘结构推断，而不是从明确公开财务中读取。公司在搭建全栈人形平台，已披露招聘覆盖强化学习、运动规划、触觉传感、世界模型、3D 视觉、sim-to-real
              评测，以及三大洲多个城市的现场支持。这个足迹强烈暗示，成本结构会由高技术人力、可观算力开支、硬件原型和面向客户的部署支持共同构成。仿真优先训练可能相对依赖真实数据的同行减少一部分数据采集和遥操作成本，但它不会让系统变轻资产；它只是把成本组合转向仿真器质量、基础设施和工程迭代。行业基准也提示谨慎。中国人形机器人市场仍面对高硬件成本、未解决的电池和灵巧性约束，以及企业按两到三年回本窗口判断的
              ROI 门槛。Sudo 没有披露 BOM、毛利率、保修成本或部署人工曲线，因此任何超过“资本密集，但可能有集成效率上行空间”的单位经济结论都为时过早。UBTech 的 2025 HKEX
              披露是最清晰的公开锚点：收入达到 RMB 2.001 billion，人形机器人产品与服务成为最大业务线，收入 RMB 820.6 million，毛利率升至 37.7%，管理层仍强调 1,000
              台小规模交付和产能建设。这个组合说明，规模化后毛利方向可以改善，但前提是创业公司先吸收大量制造和部署开销。
