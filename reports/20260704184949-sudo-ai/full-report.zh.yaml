      - number: '2.5'
        title: 对 Sudo AI 切入点的含义
        blocks:
          - type: paragraph
            body: >-
              具体到 Sudo AI，市场含义很直接：可投资机会不是未来整个人形机器人品类，而是仿真训练抓取系统能够跨过工业性能门槛的第一个切口。Sudo 已披露的公开重点——物体抓取、仓库与物流场景、CATL
              相关工业验证——正落在市场来源描述的第一波商业化之内。这是正面信号。更难的问题是，公司能否把有说服力的演示转化成采购级可靠性、现场集成、安全审批和可接受的总拥有成本。公开市场数据还无法精准测算这个切口，因为没有已审阅来源把真正需要人形或类人形操作系统、而不是固定自动化或更简单移动机器人的仓库或工厂工作流占比单独拆出来。因此，Sudo
              的市场故事应被框定为更大自动化预算中的一个狭窄但可能有价值的切入点，而不是自动拥有最宽的人形机器人 TAM。
