  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              定义 Sudo AI 市场边界，最干净的方式不是“所有机器人”，甚至也不是“所有仓库自动化”，而是能够在人类既有环境中运行的人形或类人形物理 AI 系统。IFR
              的人形机器人立场文件把该类别界定为面向以人为中心场景的通用机器人，覆盖工业和服务用途。这个边界重要，因为广义自动化预算远大于纯人形机器人市场。仓库自动化、工业机器人装机、AMR、协作机器人、固定机械臂和软件编排平台都是相邻支出池，但它们并不等同于类人形操作系统。对
              Sudo 而言，相关市场应包括面向人类设计设施的机器人硬件、具身控制软件、部署服务和工作流集成；纯 WMS
              软件、固定臂工作站和简单移动运输系统，除非正在被替代，否则应排除在外。这个更窄的口径能避开一个常见错误：把每一美元自动化支出都归给人形机器人。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
              - CM015
