summary:
  headline: >-
    Sudo AI is a credible frontier robotics company to track, but the current public evidence supports technical promise
    more strongly than commercial proof, making the reported ~US$1.9B valuation look stretched rather than clearly
    investable today.
  overallScore: 5.2
  recommendation: track
