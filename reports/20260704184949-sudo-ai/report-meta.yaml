companyProfile:
  summary: >-
    Sudo AI (上海苏度科技) is a Shanghai-founded embodied-AI startup that surfaced publicly in April 2026 with the
    launch of Sudo R1, a manipulation-focused robot system trained entirely on simulation data. The company frames its
    technical edge as a Real2Sim2Real workflow combining a 3D world model with reinforcement learning to deliver
    zero-shot object picking without real-world demonstrations. Public sources indicate a May 2025 founding, a major
    April 2026 Pre-A round at roughly US$1.89-2.0B valuation, and a high-profile investor and technical ecosystem.
    What remains missing from the public record is equally important: revenue, customer count, deployed fleet size,
    board composition, and clean term-sheet detail are still undisclosed, so the diligence case rests more on option
    value and technical pedigree than on proven operating performance.
  foundedDate: '2025-05-19'
  founders:
    - name: Han Zheng
      role: Co-founder and CEO
      background: >-
        Public Chinese reporting describes Han Zheng as a former Microsoft Research Asia young scientist and serial
        entrepreneur whose earlier ventures included ZEPP and Rocket Science.
      claimRefs:
        - CO013
        - CO014
        - CO015
    - name: Su Hao
      role: Chief technical advisor; founder attribution disputed in public sources
      background: >-
        Fudan professor and former UC San Diego researcher associated with ImageNet, ShapeNet, PointNet, SAPIEN,
        and other core embodied-AI and 3D-vision work.
      claimRefs:
        - CO016
        - CO017
        - CO019
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: >-
    Sudo R1 is a manipulation-first embodied-AI robot system that combines self-developed hardware with a simulation-
    trained control stack for zero-shot object picking, obstacle-aware motion, and closed-loop execution.
  customerFocus: >-
    Industrial manufacturing, warehouse logistics, sorting, and related workcell automation use cases where flexible
    manipulation matters more than scripted single-purpose robotics.
  businessModel: >-
    Likely a mix of robot-system sales, deployment services, and longer-term software/data platform monetization,
    though realized pricing and revenue mix are not publicly disclosed.
  stage: Pre-A
  fundingStatus: >-
    Multiple reviewed reports say Sudo AI announced a US$500M Pre-A round in April 2026 at roughly RMB 13.6B
    (about US$1.89-2.0B) valuation, backed by a mix of strategic and financial investors including CATL-linked,
    Alibaba, Tencent, Ant Group, IDG, and Hengdian-related capital.
