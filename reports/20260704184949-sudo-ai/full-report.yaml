  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >-
              Sudo AI is attempting one of the hardest technical and commercial problems in robotics: using
              simulation-first reinforcement learning to produce reliable humanoid manipulation in real environments.
              The public upside is clear. The official site shows a compelling zero-real-data picking demo, and the
              Chinese profile coverage suggests investors are willing to finance the story aggressively. But the
              highest-severity risks cluster around what has not yet been proven. Sudo's own materials state that
              production-grade performance remains ahead, meaning the company is still between research success and
              repeatable deployment. That gap matters because the sector is already capitalizing around a handful of
              leaders with deeper funding, larger data programs, and more visible commercial traction. The practical
              risk stack therefore runs from sim-to-real transfer and dexterous manipulation, through supply chain and
              manufacturing scale-up, into market-adoption timing, cash burn, and strategic crowding by Figure, Physical
              Intelligence, Agility, Unitree and AgiBot. Severity is not driven by any one legal event today; it is
              driven by the chance that multiple unresolved constraints compound before Sudo reaches paid, safe,
              high-frequency use in production environments.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
      - number: '7.2'
        title: Regulatory, Legal and Geopolitical Risk
        blocks:
          - type: paragraph
            body: >-
              The near-term legal burden on Sudo is less about a single license and more about a widening liability
              surface. Humanoids operating around workers or customers can create product-liability, contractual,
              privacy, and workplace-safety exposure even before full autonomy is achieved. Hill Dickinson and K&L Gates
              both frame 2026 as a period when AI product-liability doctrine and humanoid deployment governance are
              becoming more concrete, especially around responsibility allocation, safeguards, and documentation. For
              Sudo, that combines with geopolitics. BIS guidance says advanced-computing items exported to certain
              China-linked entities require licenses, and the rulemaking docket around advanced computing controls
              remains active. Sudo may be able to localize some of its stack, but without a public bill of materials or
              compute-sourcing disclosure, investors cannot know how exposed it is to cross-border GPU, toolchain, or
              sensor constraints. Western regulatory caution could also slow global go-to-market, while faster Chinese
              deployment environments may increase execution speed but create regulatory divergence that complicates
              multinational sales and safety assurance.
            claimRefs:
              - CR009
              - CR010
              - CR011
