  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case for Sudo starts with technical ambition. The company's official materials show a
              simulation-only manipulation stack that appears unusually strong on zero-shot picking, obstacle-aware
              motion and closed-loop control. If that approach truly scales, Sudo could compound faster and cheaper than
              teleoperation-heavy rivals because more data would come from simulation rather than manual collection. The
              anti-thesis is just as strong. Public proof still centers on a narrow picking primitive, not on disclosed
              revenue, multi-skill deployments or stable field economics. Sudo itself says production-grade performance
              remains ahead, which means investors are still underwriting a scientific transition rather than a
              commercial machine. In practice, the investment question is not whether the thesis is exciting; it is
              whether the current price already assumes Sudo joins the small set of humanoid winners that turn research
              novelty into repeatable factory value. Until the proof surface broadens, both the bull and bear cases
              remain unusually live.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
