      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The bull case for humanoids rests on a familiar but still powerful set of drivers: structural labor
              scarcity, wage pressure, ergonomics and injury reduction, higher throughput expectations, and rapid
              improvements in AI-based perception, motion planning, and simulation-led robot training. In warehouse
              automation, Research and Markets says 80% of warehouses remain manual and only 5% are automated, while
              Symbotic and Interact Analysis show continued strong growth in mobile automation. Yet the constraint side
              is equally important. IFR argues humanoids must still prove reliability, energy efficiency, maintenance
              economics, and industrial durability against traditional automation. McKinsey and Mobile World Live both
              emphasize that many current systems remain bounded by work cells or by the unfinished cooperative-safety
              challenge. European Parliament and Harvard Journal on Legislation material add a different layer:
              workplace AI still raises explainability, surveillance, accountability, and liability questions. So
              adoption is not blocked by demand alone; it is gated by trust, regulation, and integration complexity.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM031
              - CM033
          - type: table
            tableRef: TM004
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM031
              - CM033
      - number: '2.5'
        title: Implications for Sudo AI’s Entry Wedge
        blocks:
          - type: paragraph
            body: >-
              For Sudo AI specifically, the market implication is straightforward: the investable opportunity is not the
              entire future humanoid category but the first wedge where a simulation-trained picking system can clear
              industrial performance thresholds. Sudo’s disclosed public focus on object picking, warehouse and
              logistics scenarios, and CATL-linked industrial validation sits directly inside the first wave of
              commercialization described by market sources. That is positive. The harder question is whether the
              company can translate a compelling demo into procurement-grade reliability, site integration, safety
              approval, and acceptable total cost of ownership. Public market data cannot yet size that wedge precisely,
              because no reviewed source isolates the share of warehouse or factory workflows that truly require a
              humanoid or human-form manipulation system instead of fixed automation or simpler mobile robots. As a
              result, Sudo’s market story should be framed as a narrow but potentially valuable entry wedge inside much
              larger automation budgets—not as automatic ownership of the broadest humanoid TAM.
            claimRefs:
              - CM028
              - CM029
              - CM030
              - CM032
              - CM034
              - CM035
