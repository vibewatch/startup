      - number: '3.4'
        title: Public Pricing Is Rare, So Distribution and Switching Costs Matter More
        blocks:
          - type: paragraph
            body: >-
              A notable feature of this category is how little durable public pricing exists. Unitree, 1X, and EngineAI
              expose more visible price anchors than the rest of the field, while Sudo, Figure, Agility, Apptronik,
