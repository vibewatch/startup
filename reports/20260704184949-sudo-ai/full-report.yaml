      - number: '7.4'
        title: Partner, Competition and Market-Adoption Risk
        blocks:
          - type: paragraph
            body: >-
              Sudo is competing in a market that is becoming crowded before broad commercialization is settled. Figure,
              Physical Intelligence, 1X, Agility, Unitree and AgiBot all show that humanoid investors are concentrating
              capital around teams with either stronger model narratives, clearer deployment evidence, or lower-cost
              Chinese hardware ecosystems. TrendForce expects China's humanoid output to surge in 2026 and says Unitree
              and AgiBot could capture nearly 80% share, which is good for ecosystem maturity but bad for newcomers that
              miss the first platform wave. Sudo also carries counterparty dependence. The Sohu profile says it is
              jointly developing with CATL in manufacturing scenes and building developer centers at home and abroad,
              both of which are useful signals but can create customer, roadmap, and ecosystem concentration. Market
              demand exists in principle, yet KraneShares and Hill Dickinson both suggest broad humanoid adoption
              remains gradual, safety-sensitive, and highly dependent on proving economics against cheaper
              single-purpose automation. That means Sudo must win not just on spectacle, but on repeatability, switching
              value, and total cost of ownership.
            claimRefs:
              - CR026
