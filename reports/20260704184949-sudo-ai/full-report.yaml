      - number: '7.5'
        title: Financial, People and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              The financial and execution profile is that of a company still proving science while spending like a
              future platform. Publicly visible hiring shows 30 open roles across Shanghai, Beijing, Boston, Zurich and
              Mountain View, which is consistent with serious ambition but also with a costly global buildout before
              clear commercial revenues are disclosed. The company is still young, and the public record emphasizes
              research excellence, serial entrepreneurship, and ecosystem ties more than proven scaled hardware
              manufacturing. That does not mean the team cannot execute; it means investors are being asked to
              underwrite manufacturing, safety, sales and finance muscles that are not yet proven in public evidence.
              Better-funded peers imply that $500 million class financing, even if accurate, may not be enough to bridge
              from manipulation demos to production fleets, especially if repeated training, hardware iteration, and
              customer-specific integration remain necessary. In other words, runway risk is not just about months of
              cash; it is about whether commercialization arrives before the next capital round must be raised from a
              position of proof or from a position of hope.
            claimRefs:
              - CR034
              - CR035
