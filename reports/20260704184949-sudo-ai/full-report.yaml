  - id: FU004
    title: Expansion and concentration loop
    type: flow
    layout: wide
    summary: >-
      The same factors that make Sudo’s first customer wedge attractive also create concentration and conversion risk if
      pilots stall.
    data:
      nodes:
        - id: c1
          label: Zero-data deployment wedge
          detail: Reduces security friction in sensitive factories.
        - id: c2
          label: Structured pilot in manufacturing / logistics
          detail: High-fit initial environment.
        - id: c3
          label: Reference-account potential
          detail: Successful pilot can unlock more workcells and adjacent plants.
        - id: c4
          label: Investor / partner overlap
          detail: Pipeline may rely heavily on strategic relationships.
        - id: c5
          label: Concentration risk
          detail: A few accounts can dominate the narrative and economics.
        - id: c6
          label: Need for repeatable conversion
          detail: Only paid expansions turn proof into durable demand.
      edges:
