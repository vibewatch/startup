      - number: '8.3'
        title: Financing Context, Entry Discipline and Term-Sheet Risk
        blocks:
          - type: paragraph
            body: >-
              The main financing fact in public view is directionally clear and numerically fuzzy: Sohu reports that
              Sudo's latest valuation is above $2B and attributes backing to CATL-linked capital, Alibaba, Tencent and
              Ant, while the company's own public materials do not confirm exact round size, investor list, preference
              stack or use of proceeds. That is enough to know investors are paying up for frontier optionality, but not
              enough to know whether common-equity returns are well protected. Entry discipline should therefore focus
              on three items before price: how much capital Sudo really has left relative to commercialization needs,
              whether the next round is likely to be raised from a position of proof or hope, and how much preference or
              structured downside already sits above new money. This matters more in humanoids than in software, because
              data, hardware, safety validation and manufacturing all consume capital together. A company can be
              technically right and still be a weak late-stage entry if financing terms and milestone timing are
              misaligned.
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
      - number: '8.4'
        title: Bull, Base and Bear Cases
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is necessarily milestone-based because public revenue is undisclosed. Our base case
              (about 40%) assumes Sudo converts early industrial validation into limited paid deployments by 2027,
              expands from picking into a few adjacent workcell skills, and retains enough financing flexibility to
              justify roughly $1.5-2.2B. The bull case (about 25%) assumes its simulation-first system proves more
              general than expected, customer ROI becomes visible, and the company rides China's faster hardware
              ecosystem into a $3.0-4.5B outcome. The bear case (about 35%) assumes the sim-to-real gap stays stubborn,
              pilots do not convert fast enough, and the next raise happens under pressure, producing something closer
              to $0.8-1.2B or at least a flat round. The asymmetry here is unusual: upside is very large, but the bear
              case is plausible precisely because so much of the current mark depends on future proof rather than
              current unit economics. That is why milestone discipline matters more than spreadsheet precision.
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
          - type: table
            tableRef: TV003
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
