            body: >-
              Sudo’s cost profile is inferable only from its technical ambition and hiring mix, not from explicit public
              financials. The company is building a full-stack humanoid platform whose disclosed hiring spans
              reinforcement learning, motion planning, tactile sensing, world models, 3D vision, sim-to-real evaluation,
              and field support across multiple cities on three continents. That footprint strongly suggests a cost
              structure combining high technical headcount, meaningful compute expenditure, hardware prototyping, and
              customer-facing deployment support. Simulation-first training may reduce some data-collection and
              teleoperation expense relative to real-data-heavy peers, but it does not make the system asset-light; it
              simply shifts the cost mix toward simulator quality, infrastructure, and engineering iteration. Sector
              benchmarks reinforce the caution. China’s humanoid market still operates under high hardware cost,
              unresolved battery and dexterity constraints, and ROI thresholds that enterprises judge in a two- to
              three-year payback window. Since Sudo discloses no BOM, gross margin, warranty cost, or deployment labor
              curve, any unit-economics conclusion beyond “capital intensive with possible integration-efficiency
              upside” would be premature. UBTech's 2025 HKEX disclosures are the clearest public anchor: revenue reached
              RMB 2.001 billion, humanoid products and services became the largest line at RMB 820.6 million, gross
              margin rose to 37.7%, and management still emphasized 1,000-unit small-scale delivery plus capacity
              build-out. That combination suggests margin direction can improve with scale, but only after a startup
