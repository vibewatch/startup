              - CV028
              - CV029
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV027
              - CV029
      - number: '8.5'
        title: Comparable Set and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              The comparable set argues for caution. Figure's $2.6B 2024 mark and later $39B step-up show how
              dramatically humanoid leaders can rerate once capital, branding and deployment proof compound. PI's
              multi-billion valuation path shows investors will also pay software-model premiums for teams seen as
              owning the cognition layer. 1X represents the opposite risk: narrative and consumer optionality can push
              valuations far ahead of monetization. Agility offers the cleanest grounding comp because it has public
              cash-burn, order and operating-hour disclosures, while Unitree is the most useful Chinese anchor because
              it shows a revenue-generating robotics business can still be valued below the loudest frontier narratives.
              Sudo sits somewhere in between: stronger scientific novelty than a generic hardware startup, but far less
              commercial proof than the best-capitalized leaders. On that basis, a reported mark above $2B already looks
              like upper-tier optionality pricing rather than conservative entry.
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
          - type: table
            tableRef: TV004
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV016
              - CV023
              - CV024
              - CV025
              - CV037
      - number: '8.6'
        title: Exit Readiness, Thesis-Break Triggers and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              It is too early to underwrite a clean exit path today. The plausible near-term outcomes are another
              private financing, a strategic industrial partnership, or a later IPO only after repeatable deployment
              economics emerge. The most important diligence items are therefore the ones that compress uncertainty
              fast: the exact round terms and cap table, pilot-to-paid conversion, named customer economics,
              manufacturing readiness, safety and certification roadmap, and the hardware and compute dependencies that
              could gate scale. The clearest thesis-break triggers are inability to reproduce the picking results in
              adjacent tasks, safety setbacks, burn outrunning access to capital, or evidence that Unitree, AgiBot or
              Figure-scale leaders are locking in the supply chain and design wins first. Until those questions are
              answered, the return-maximizing posture is to keep Sudo on the active tracking list and look for a later
              entry anchored to commercialization proof instead of paying a pure frontier premium now.
            claimRefs:
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV005
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV006
            claimRefs:
              - CV040
              - CV041
              - CV042
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Track the company, not the premium story
            body: >-
              Sudo is too technically interesting to ignore, but the public record does not yet justify paying an
              upper-tier humanoid multiple without stronger deployment and financing proof.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV010
              - CV041
          - type: callout
            title: This is a milestone valuation, not a revenue valuation
            body: >-
              Because revenue, margins and retention are undisclosed, the right question is whether Sudo will hit the
              next commercialization milestones before the next financing event, not whether today's multiple is
              statistically cheap.
            calloutType: risk
            claimRefs:
