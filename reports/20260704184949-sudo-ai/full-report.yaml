      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Across sources, the first commercially relevant buyers are large industrial and logistics operators, not
              households. MarketsandMarkets and Fortune both point to manufacturing, warehousing, and logistics as the
              earliest high-growth deployment arenas, while McKinsey’s Agility interview says product–market fit is
              clearest in logistics today. In these segments, the user is the worker or supervisor on the factory floor
              or in the distribution center, but the buyer and payer are usually operations, automation, or supply-chain
              leaders with capex and productivity mandates. Healthcare, hospitality, retail, and household use cases
              remain important, but they are more sensitive to affordability, human-interaction quality, and safety
              assurance. That distinction matters for Sudo because its public positioning around picking and industrial
              manipulation aligns with segments where labor substitution, error reduction, and shift coverage are
              budgeted problems rather than speculative consumer features.
