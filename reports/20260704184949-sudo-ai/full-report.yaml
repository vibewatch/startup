  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to define Sudo AI’s market is not “all robotics” and not even “all warehouse automation,”
              but humanoid or human-form physical AI systems that can operate in environments already built for people.
              IFR’s humanoid position paper frames the category around general-purpose robots for human-centric
              settings, spanning industrial and service use. That boundary matters because broad automation budgets are
              much larger than the pure humanoid market. Warehouse automation, industrial robot installations, AMRs,
              cobots, fixed arms, and software orchestration platforms are all adjacent spend pools, but they are not
              the same thing as a human-form manipulation system. For Sudo, this means the relevant market should
              include robotic hardware, embodied control software, deployment services, and workflow integration for
              human-designed facilities, while excluding pure WMS software, fixed-arm cells, and simple mobile transport
              systems unless they are being displaced. This narrower framing avoids the common mistake of assigning
              every automation dollar to humanoids.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
