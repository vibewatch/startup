            body: >-
              Sudo AI’s public commercial narrative is much more concrete on workflows than on accounting. Official and
              investor-linked materials consistently frame the near-term opportunity around industrial sorting,
              warehouse depalletizing, and other manipulation-heavy operations where reliable picking is the gating
              capability. That evidence supports a revenue model anchored first in hardware plus deployment work, not in
              an already disclosed recurring software business. Media and investor coverage also say Sudo is supporting
              secondary development for industrial-manufacturing and logistics customers, which implies billable project
              work or integration effort around a still-maturing base model. What is missing is any realized contract
              structure: there is no public list price, no named lease schedule, no RaaS tariff, no disclosed services
              fee, and no recognized revenue metric. The most defensible conclusion is therefore that Sudo’s
              monetization is still in a transition zone between technology proof and commercial standardization. The
              April 2026 technical release matters because it may shorten implementation effort if zero-data deployment
              really holds up in production, but today that benefit remains a commercialization hypothesis rather than a
              public revenue bridge. Public comparables reinforce that early humanoid revenue usually stays hardware-led
              and price-disciplined: Unitree's March 2026 IPO coverage, citing its prospectus, says humanoids became
              more than 51% of main business revenue while average humanoid ASP fell to 167,600 yuan in the first nine
              months of 2025. UBTech's 2025 filed results likewise show industrial-humanoid revenue booking inside
