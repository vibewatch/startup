      - number: '7.6'
        title: Mitigations, Monitoring and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Sudo's mitigation story is coherent, but still mostly prospective. The strongest mitigation is the same
              thing that creates the risk: if simulation-first training really lowers data cost and iteration time, Sudo
              could improve faster than teleoperation-heavy rivals on selected tasks. The company also appears to be
              leaning into industrial settings where data sensitivity, obstacle-rich motion, and multi-workcell transfer
              may make a closed-loop, zero-shot system especially valuable. Investors should still insist on measurable
              checkpoints. The critical monitors are pilot-to-paid conversion, expansion from picking into adjacent
              skills, disclosed safety/certification progress, hardware uptime in customer environments, gross capital
              required per new deployment, and evidence that supply-chain dependencies are not gating scale. The
              clearest thesis-break triggers are failure to reproduce results outside curated picking tasks, inability
              to demonstrate paid production deployments by the next financing window, material safety incidents, or
              proof that category leaders are locking in customers and suppliers faster than Sudo can build
              differentiation. Until those milestones are visible, residual risk remains high even if the technical
              ceiling is exciting.
            claimRefs:
              - CR040
              - CR041
              - CR042
