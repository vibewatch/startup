  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Sudo Competes with Humanoids, Model Layers, and Non-Humanoid Substitutes'
        blocks:
          - type: paragraph
            body: >-
              Sudo AI should not be benchmarked against every robotics company equally. Its public positioning is a
              simulation-trained, manipulation-first system aimed at industrial picking and adjacent warehouse or
              factory workflows, and the closest threats are the companies already proving that human-form automation
              can survive real sites. That puts Figure, Agility, Unitree, Agibot, Apptronik, and UBTECH in the direct
              line of fire. A second tier matters almost as much: Physical Intelligence and Sanctuary attack the control
              layer rather than the body, which means they can erode the uniqueness of Sudo's sim-first stack even if
              they do not sell the same humanoid shell. A third tier consists of 1X, Fourier, DEEP Robotics, and
              EngineAI, which widen the category, influence pricing expectations, or prove adjacent embodied-AI
              capabilities. The final substitute is not another humanoid at all but a cheaper polyfunctional, wheeled,
              or fixed automation stack combined with internal integration work.
            claimRefs:
