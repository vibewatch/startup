        title: Product definition and use-case scope
        blocks:
          - type: paragraph
            body: >-
              The public product is not a generic “AI robot” abstraction; it is Sudo R1, a full-stack
              manipulation-centric robot system whose proving ground is object picking. The company’s own framing
              matters because it reveals what management believes the bottleneck is: not humanoid walking for its own
              sake, but reliable manipulation across the long tail of real objects. Official copy repeatedly places the
              robot in warehouses, kitchens, and factory floors and stresses that picking is the gateway primitive
              underlying many economically useful workflows. That is a much narrower, and more actionable, definition
              than “general humanoid intelligence.” It also explains why the current public demo can look impressive
              while still leaving much of the broader humanoid problem open. The strong product signal today is
              specific-task reliability on unfamiliar objects. The weaker signal is breadth. Public materials do not yet
              validate assembly, tool use, high-precision manipulation, or multi-skill service tasks. Investors and
              customers should therefore read Sudo R1 as an early but differentiated workflow robot platform, not yet as
              a disclosed all-purpose humanoid.
