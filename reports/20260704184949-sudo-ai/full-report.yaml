        - Simulation-first thesis narrows into point solution
        - Do not pay premium multiples
      - - Pilot conversion stalls
        - No repeatable paid deployment evidence
        - Commercialization timeline slips
        - Cut valuation range
      - - Safety setback
        - Material incident or no certification path
        - Regulatory and customer trust risk rises
        - Pause investment
      - - Capital squeeze
        - Need new round before proof
        - Dilution and bargaining power worsen
        - Assume weak entry economics
      - - Competitive lockout
        - Unitree/AgiBot/Figure secure key design wins and suppliers
        - Share assumptions compress
        - Lower terminal outcome odds
    notes: These are the specific events most likely to break the current frontier-optionalities thesis.
