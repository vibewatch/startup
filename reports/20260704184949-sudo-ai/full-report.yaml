  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Public proof is strongest where Sudo has shown repeated manipulation behavior and weakest where enterprise-grade
      hardware disclosure is still absent.
    data:
      columns:
        - Public proof quality
        - Operational maturity
        - Differentiation strength
        - Key gap
      rows:
        - label: Zero-shot picking
          values:
            - label: strong
              tone: positive
              detail: Official long-form demonstration plus media corroboration.
            - label: moderate
              tone: neutral
              detail: Validation exists, but mostly for one task family.
            - label: strong
              tone: positive
              detail: Simulation-first generalization is a clear wedge.
            - label: skill breadth
              tone: warning
              detail: Broader manipulation set still unproven publicly.
        - label: Obstacle-aware execution
          values:
            - label: moderate
              tone: positive
              detail: Public clips and writeup support the claim.
            - label: moderate
              tone: neutral
              detail: Likely useful in constrained cells.
            - label: moderate
              tone: positive
              detail: Integrates spatial reasoning into policy.
            - label: safety envelope
              tone: warning
              detail: No formal safety case or certification disclosed.
        - label: Developer ecosystem
          values:
            - label: limited
              tone: warning
              detail: Developer-center rhetoric exists but tooling is sparse publicly.
            - label: early
              tone: warning
              detail: Hiring implies ongoing buildout.
            - label: moderate
              tone: neutral
              detail: Could become a moat if actual tools appear.
            - label: no public SDK
              tone: warning
              detail: Outside builders cannot yet self-serve.
        - label: Enterprise hardware readiness
          values:
            - label: limited
              tone: warning
              detail: No public battery, payload, or certification detail.
            - label: early
              tone: warning
              detail: Public materials read like validation stage.
            - label: unknown
              tone: neutral
              detail: Hardware moat is less documented than software moat.
            - label: spec transparency
              tone: warning
              detail: Critical deployment facts remain undisclosed.
    approximationNotes: Cells rank evidence quality and maturity, not absolute engineering merit.
    claimRefs:
      - CE010
      - CE011
      - CE019
      - CE020
      - CE021
      - CE033
      - CE034
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Sudo’s implied enterprise journey runs from workflow discovery to validation and then to multi-workcell rollout if
      economics hold.
    data:
      nodes:
        - id: j1
          label: Discovery
          detail: Operations or automation team hears about Sudo through investor / partner network or media coverage.
          tone: neutral
        - id: j2
          label: Technical qualification
          detail: Customer evaluates whether zero-shot picking and data-security posture fit the workflow.
          tone: warning
        - id: j3
          label: Joint development
          detail: Sudo supports secondary development for the specific workcell or logistics task.
          tone: warning
        - id: j4
          label: Pilot validation
          detail: Customer tests reliability, intervention rate, and ROI in a constrained production setting.
          tone: warning
        - id: j5
          label: Multi-workcell expansion
          detail: If the pilot succeeds, the same model is adapted across more stations or products.
          tone: positive
        - id: j6
          label: Scaled account
          detail: Only at this stage does the customer become a true durable reference account.
          tone: positive
    approximationNotes: >-
      Stages are inferred from reviewed customer proof and humanoid procurement norms; no public account has been shown
      at the final stage yet.
    claimRefs:
      - CU003
      - CU005
      - CU020
      - CU021
      - CU026
      - CU032
  - id: FU002
    title: Adoption / deployment flow
    type: flow
    layout: standard
    summary: >-
      Public customer evidence suggests a long deployment path with multiple drop-off points before scaled commercial
      adoption.
    data:
      nodes:
        - id: a1
          label: Use-case fit
          detail: Structured manufacturing or logistics workflow identified.
        - id: a2
          label: Security and ROI review
          detail: Customer tests zero-data wedge, safety, and payback assumptions.
        - id: a3
          label: Secondary development
          detail: Model and workflow are adapted for the specific cell.
        - id: a4
          label: Validation pilot
          detail: Performance is measured in real operations.
        - id: a5
          label: Reference-account decision
          detail: Customer decides whether to expand to more lines or sites.
        - id: a6
          label: Scaled rollout
          detail: Only after repeatability is proven does the account become durable revenue.
      edges:
        - from: a1
          to: a2
        - from: a2
          to: a3
        - from: a3
          to: a4
        - from: a4
          to: a5
        - from: a5
          to: a6
    approximationNotes: Flow expresses the decision path, not public customer counts.
    claimRefs:
      - CU005
      - CU020
      - CU022
      - CU026
      - CU027
      - CU035
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Named proof exists, but evidence quality varies materially by counterparty and by how specific the workflow
      description is.
    data:
      columns:
        - Named counterparty quality
        - Production maturity
        - Outcome specificity
        - Concentration implication
      rows:
        - label: CATL
          values:
            - label: strong
              tone: positive
              detail: Named and repeated across several sources.
            - label: pilot
              tone: warning
              detail: Validation / joint development rather than disclosed scale.
            - label: moderate
              tone: neutral
              detail: Battery production and logistics are specified; KPI is not.
            - label: high
              tone: warning
              detail: Most concrete public proof sits here.
        - label: Mitsubishi Electric
          values:
            - label: moderate
              tone: positive
              detail: Named in financing coverage.
            - label: unclear
              tone: warning
              detail: Stage not disclosed.
            - label: limited
              tone: warning
              detail: Workflow and economics not public.
            - label: moderate
              tone: neutral
              detail: Helpful breadth signal, weak conversion signal.
        - label: COSCO Shipping
          values:
            - label: moderate
              tone: positive
              detail: Named in financing coverage.
            - label: unclear
              tone: warning
              detail: No public deployment stage.
            - label: limited
              tone: warning
              detail: Workflow specificity is thin.
            - label: moderate
              tone: neutral
              detail: Supports logistics relevance but not scale.
        - label: Unnamed head customers
          values:
            - label: weak
              tone: warning
              detail: Anonymous references cannot be diligence endpoints.
            - label: early
              tone: warning
              detail: Secondary development suggests pre-scale stage.
            - label: low
              tone: warning
              detail: No public KPI or contract evidence.
            - label: hidden
              tone: warning
              detail: Could mask both upside and concentration risk.
    approximationNotes: Matrix scores evidence quality, not intrinsic customer value.
