companyProfile:
  summary: >-
    Sudo AI (上海苏度科技) is a Shanghai-founded embodied-AI startup that surfaced publicly in April 2026 with the launch of
    Sudo R1, a manipulation-focused robot system trained entirely on simulation data. The company frames its technical
    edge as a Real2Sim2Real workflow combining a 3D world model with reinforcement learning to deliver zero-shot object
    picking without real-world demonstrations. Public sources indicate a May 2025 founding, a major April 2026 Pre-A
    round at roughly US$1.89-2.0B valuation, and a high-profile investor and technical ecosystem. What remains missing
    from the public record is equally important: revenue, customer count, deployed fleet size, board composition, and
    clean term-sheet detail are still undisclosed, so the diligence case rests more on option value and technical
    pedigree than on proven operating performance.
