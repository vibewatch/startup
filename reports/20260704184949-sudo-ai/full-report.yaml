      - number: '8.2'
        title: Recommendation, Confidence and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              We rate Sudo AI track with medium confidence, high risk and a stretched valuation stance. The right mental
              model is “interesting company, difficult price,” not “bad company, avoid at all costs.” A reported
              valuation above $2B can be rational if Sudo proves it belongs in the same future leader set as Figure,
              Agility or the strongest Chinese incumbents. But the public record does not yet show the commercialization
              evidence those analogs are starting to accumulate. Agility already has orders and operating hours on
              record; Figure and PI have far deeper capital bases; Unitree has actual revenue and a cheaper hardware
              position. That does not invalidate Sudo's thesis, but it means investors should underwrite with milestone
              discipline. The premium entry case requires proof of adjacent-skill deployment, clearer customer ROI, and
              a capital plan that can survive a slower-than-hoped commercialization cycle. Medium confidence reflects
              that the qualitative upside is strong while the quantitative underwriting base is still sparse.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
