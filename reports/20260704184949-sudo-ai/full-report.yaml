      - number: '6.5'
        title: Customer verdict and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Sudo AI has enough public customer evidence to support seriousness, but not enough to support durability.
              The positive case is that the company is pointed at the right early segments, has at least one
              strategically important named validation partner in CATL, and is trying to solve an adoption blocker—data
              sensitivity—that matters in factories. The negative case is that almost every commercial denominator is
              still missing: there is no public customer count, no deployment count, no contract value, no renewal data,
              and no conversion data from pilot to repeat purchase. Concentration risk is also nontrivial because the
              strongest public proof overlaps with strategic investors and partner networks. The right customer
              diligence request is therefore a customer-by-customer pipeline that shows stage, paid status, success
              metric, workcell count, support burden, and next expansion trigger. Until then, Sudo should be treated as
              a strategically promising pilot-stage industrial robotics vendor rather than as a company with proven
              scaled customer demand.
            claimRefs:
              - CU016
