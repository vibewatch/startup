      - number: '1.3'
        title: Funding, Stakeholders, and Early Operating Signals
        blocks:
          - type: paragraph
            body: >-
              The clearest quantified part of Sudo AI’s story is capital formation. Multiple independent reports say the
              company announced a US$500 million Pre-A round in April 2026 at about RMB 13.6 billion / US$1.89–2.0
              billion valuation, less than a year after inception. Reported investors include CATL, Alibaba, Tencent,
              Ant Group, IDG Capital, GL Ventures, LanChi Ventures, China Life Equity, and other strategic or growth
              funds; Hengdian Capital separately says it extended its investment in the company. This syndicate matters
              because Sudo is still very early by operating disclosures: no reviewed source gave revenue, audited
              financials, customer count, deployed fleet count, or even a reliable public headcount. The careers page
              does show roughly 30 open positions, and the role mix spans algorithms, robot software, data validation,
              testing, developer operations, and field service. That is enough to signal broad capability build-out, but
              not enough to support a traditional commercialization-underwriting case. At this stage, the capital base
              is more legible than the business model.
