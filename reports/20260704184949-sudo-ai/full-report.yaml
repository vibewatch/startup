      - number: '2.2'
        title: Sizing Lenses and Why Estimates Diverge So Widely
        blocks:
          - type: paragraph
            body: >-
              Public market estimates for humanoid robotics are directionally bullish but numerically inconsistent.
              Grand View Research remains relatively conservative, taking the market from about US$1.55 billion in 2024
              to US$4.04 billion in 2030. MarketsandMarkets and Fortune Business Insights are materially more
              aggressive, while Future Market Insights is more aggressive still at US$10.69 billion in 2026 and
              US$248.90 billion in 2036. These are not trivial differences; they imply very different underwriting
              assumptions about pricing, reliability, and whether household or service use cases unlock at scale. The
              practical lesson is that one broad TAM estimate is not diligence. A better approach is to keep multiple
              lenses on the page: pure humanoid market forecasts, adjacent warehouse and industrial automation pools,
              and region-specific commercialization signals. That preserves contradiction rather than washing it away
              and keeps Sudo’s opportunity tied to real deployment conditions instead of to the largest headline number.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
