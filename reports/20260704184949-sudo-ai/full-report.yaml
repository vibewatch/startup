chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Positioning, and Public Footprint
        blocks:
          - type: paragraph
            body: >-
              The public record consistently identifies Sudo AI as Shanghai-based embodied-AI startup 上海苏度科技, founded in
              May 2025 and focused on building a general-purpose manipulation stack rather than selling a single-purpose
              automation appliance. Its official website introduces “#sudo R1” as a fully integrated hardware-software
              robot system centered on object picking, framed as the gateway primitive for broader physical
              intelligence. The company claims the system can handle transparent, reflective, deformable, and irregular
              objects in a 60-minute uncut evaluation, with about 98% first-attempt success and nearly 100% success
              within two attempts, while remaining fully observation-conditioned at 15–25 Hz. Public evidence also shows
              the company already hiring across Shanghai, Beijing, Mountain View, Boston, and Zurich, which suggests an
              ambition larger than a local demo lab. That said, the official materials stop short of giving a complete
              product specification sheet or a clear description of whether the commercial product should be understood
              as a full humanoid platform or a manipulation-first dual-arm system.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
