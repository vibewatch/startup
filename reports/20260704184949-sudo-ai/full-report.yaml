              Sudo’s customer map is narrow in sector but logically coherent. The company’s own materials and
              investor-linked coverage consistently anchor the first use cases in manufacturing and logistics,
              especially industrial sorting and warehouse depalletizing. Those are the right workflows for an early
              humanoid system because they are repetitive, structured, and economically legible. The implied buyer is
              not a CIO buying generic AI; it is an operations, automation, or plant-engineering owner trying to remove
              labor bottlenecks without exposing sensitive production data. That also means the end user and the
              economic buyer are different: line operators or warehouse staff use the robot, but factory or logistics
              management underwrites the capex or project budget. Public evidence is weaker on who exactly pays in each
              case, yet the overall pattern is clear enough to treat Sudo as a B2B industrial automation supplier rather
              than a consumer robotics company. The strategic implication is that Sudo can focus its GTM effort on a
              relatively small number of high-value enterprise accounts, but it also inherits the long evaluation cycles
