      - number: '7.3'
        title: Operational, Technology and Reliability Risk
        blocks:
          - type: paragraph
            body: >-
              Technology risk is still the central underwriting issue. Sudo's website is strongest evidence of both
              promise and fragility: it shows a simulation-only system with strong picking performance, but it also
              makes clear that solving generalizability, agility, robustness and spatial intelligence together is an
              open problem. The academic and survey literature reinforces that message. Sim-to-real transfer works
              better for locomotion than for contact-rich manipulation, and dexterous hands, tactile feedback, force
              sensing, deformable objects and long-tail environmental variation remain hard. That makes it risky to
              treat a high-performing picking primitive as proof of broader factory or warehouse automation. Even if the
              control policy is strong, the company must still demonstrate hardware reliability, repeatable yields,
              calibration discipline, field servicing, cyber-physical security, and incident response. No public
              evidence yet shows Sudo at scale across repeated customer workcells, so the operational case remains a
              forward-looking thesis rather than a de-risked deployment record.
            claimRefs:
              - CR017
