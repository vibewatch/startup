schemaVersion: "report-v2"
artifact: valuation
slug: zocdoc
runDate: "2026-05-18"
company:
  name: Zocdoc

chapter:
  number: 8
  title: Valuation
  summary: >-
    Zocdoc's valuation is characterized by a sharp contradiction between its legacy $1.8 billion headline (from the 2015
    Series D) still cited in media, a COI-implied post-money mark of $2.62 billion from the 2021 Series D-2, and current
    secondary-market evidence placing the company at approximately $446 million as of May 2026—an approximate 83%
    markdown from the 2021 COI mark. Both Forge Global ($5.00/share implied ~$446 M) and PremierAlts ($446.5 M, July 2025)
    independently corroborate the secondary market figure. On disclosed revenue proxies and marketplace software
    benchmarks, the current secondary mark implies 3–6× estimated revenue, which is below Doximity's public trading
    multiple (~10×) but reflects the illiquidity premium, lack of financial disclosure, and uncertainty around the
    Francisco Partners debt structure. We assess the company's current fair-value range at $350 M–$600 M (equity value)
    pending audited financials, with a midpoint of approximately $450 M. The research-more verdict reflects the
    materiality of unknown variables—revenue trajectory, debt terms, and gross margin—that must be resolved before
    investment conviction is appropriate.

sections:
  - id: current-valuation-marks
    title: Current Valuation Evidence and Conflicting Marks
    body: >-
      Three materially different valuation marks exist for Zocdoc as of May 2026, and they represent contradictory
      assessments rather than different methodologies applied to the same data. The first is the legacy $1.8 billion
      figure: this traces to Zocdoc's 2015 Series D led by Baillie Gifford, Fidelity, and LionTree (reportedly at
      $3.6B pre-money on $130M raised), and continues to appear in third-party database entries and media coverage
      without update. Inc.com's July 2025 profile titled "$1.8 Billion Business" perpetuates this as current when it
      is a decade-old mark. The second mark is the COI-implied $2.62 billion post-money from the February 2021
      Series D-2: Forge Global, which sources from Certificate of Incorporation filings, shows $100M raised at
      $29.29 per share on a COI-computed post-money of $2.62 billion. The third, and most market-current, mark is
      Forge's secondary-market price of $5.00 per share as of May 18, 2026, which implies approximately $446 million
      in total equity value. PremierAlts independently reported a $446.5 million valuation as of July 31, 2025.
      These three marks diverge by a factor of nearly 6× from the low to the high. No single mark is definitively
      authoritative: the legacy $1.8B is clearly stale; the COI mark reflects a stated cap table value at the time of
      the 2021 round that has since been repriced by the secondary market; and the secondary market mark is based on
      illiquid over-the-counter transactions that may not reflect a control or strategic-buyer premium. The
      secondary-market-implied $446M is, however, the most recent price discovery available for a private company
      that has not disclosed audited financials publicly.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV040]
    tableRefs: [TV001, TV003]
    figureRefs: [FV001, FV002]

  - id: historical-funding-rounds
    title: Historical Funding History and Capital Trajectory
    body: >-
      Zocdoc has raised approximately $426 million in total across twelve disclosed funding events per Tracxn data.
      The funding trajectory shows several distinct phases: early venture (2007–2012, Series A–C, approximately
      $95 million total), growth equity (2015 Series D, $130 million at the $1.8 billion mark), and the 2021 growth
      financing ($150 million from Francisco Partners). The 2015–2021 gap (six years between equity rounds) is
      explained in part by the company's own public commentary: the subscription model created unit-economics losses
      that needed to be fixed before a new round was viable, and once fixed, the 2021 profitability claim supported
      the Francisco Partners transaction. The five-year gap from 2021 to May 2026 (no new public financing) is the
      most critical signal for current valuation analysis: if the company is truly cash-flow-positive, no new
      funding is needed and secondary market pricing reflects true equity sentiment absent an IPO catalyst. If the
      company is burning cash or has restrictive Francisco Partners covenants, the absence of funding reflects
      investor reluctance or covenant restrictions—not financial strength. The most recent SEC Form D filing on
      EDGAR is from August 2015 for the Series D, confirming no equity exemption filings since. The absence of a
      Form D for the 2021 Francisco Partners round is consistent with a credit facility or structured debt
      instrument not requiring Form D disclosure. Forge Global's COI data confirms a Series D-2 authorization at
      the 2021 date, but Zocdoc's own Form D record does not show it, further supporting a non-standard equity
      structure for that round.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV002]

  - id: comparable-analysis
    title: Comparable Company Analysis
    body: >-
      Direct public comparables for Zocdoc are limited. The closest analog is Doximity (NYSE: DOCS), a physician
      professional network and health IT platform with disclosed revenue. Doximity's FY2026 revenue was approximately
      $520–540 million with EBITDA margins of approximately 35–40%, and the stock trades at approximately $65–70 per
      share as of early May 2026, implying a market capitalization of approximately $11–12 billion and a revenue
      multiple of approximately 20–22×. Doximity's premium multiple reflects its physician network moat, high
      recurring pharmaceutical marketing revenue, and strong organic growth, making it a premium rather than median
      comp for Zocdoc. Teladoc Health (NYSE: TDOC), while not a marketplace analog, is the most visible
      "digital health went public and crashed" cautionary benchmark: from a 2020 peak of ~$60 billion market cap to
      approximately $1–1.5 billion as of May 2026, its trajectory illustrates the range of downside in this sector.
      On private comparables, Kyruus Health (scheduling and access management) was acquired by symplr in a deal
      reported at approximately $1.4 billion in 2021 at the height of digital health valuations—likely 10–15× revenue
      at the time. Healthgrades, a physician directory and review platform, was sold by Internet Brands in portions
      with limited public price discovery. Given these data points, a reasonable median blended multiple for
      Zocdoc using marketplace software benchmarks at $100–150 million estimated revenue would imply a range of
      $500 million (3–4× revenue, illiquidity discount) to $1.5 billion (10× revenue, optimistic scenario).
      The secondary market mark of $446 million sits at the bottom of this reasonable range, consistent with
      the market applying a maximum illiquidity and opacity discount to a company with no disclosed financials.
    claimRefs: [CV016, CV017, CV018, CV019, CV020, CV021, CV022, CV023, CV024]
    tableRefs: [TV004]
    figureRefs: [FV003]

  - id: valuation-methodology
    title: Valuation Methodology and Approach
    body: >-
      Three valuation approaches are available for Zocdoc: (1) comparable company trading multiples, (2) secondary
      market price discovery, and (3) a provider-count-times-revenue-per-provider unit economics model. The
      comparable company approach produces the widest range given the opacity of Zocdoc's financials. Using the
      $100M–$250M estimated revenue range from the financials chapter and a 3–10× NTM revenue multiple
      calibrated to the digital health marketplace peer group, an EV range of $300M–$2.5B results; discounted
      for illiquidity and opacity, a reasonable range is $350M–$800M. The secondary market approach provides a
      single data point: approximately $446M as of May 2026. This is the most direct price signal but suffers
      from thin secondary market liquidity, no control premium, and the possibility that Francisco Partners debt
      instruments rank ahead of the equity class reflected in Forge's COI. The unit economics approach applies
      roughly 100,000 providers × estimated $800–$2,000 average annual spend per active provider = $80M–$200M
      gross revenue, then applies a 3–5× multiple for an EV of $240M–$1B. The convergence across all three
      methods is approximately $350M–$600M equity value, with the secondary market at $446M near the midpoint
      of that range. No DCF model can be constructed without disclosed revenue, EBITDA, or growth rate. Capital
      efficiency metrics are unfavorable at face value: PremierAlts reports a capital efficiency ratio of 0.39×
      (current implied valuation / total capital raised), meaning the market currently values the company at only
      39 cents for every dollar invested. This is significantly below a healthy marketplace company's expected
      1.5–3× efficiency range and reflects the dramatic markdown from peak valuations.
    claimRefs: [CV025, CV026, CV027, CV028, CV029, CV030, CV031, CV032]
    tableRefs: [TV005, TV006]
    figureRefs: [FV004]

  - id: risks-and-conclusion
    title: Valuation Risks and Investment Verdict
    body: >-
      The primary valuation risk factors are: (1) the unknown structure of the Francisco Partners $150M financing,
      which could represent a senior debt instrument ranking ahead of common equity and effectively reducing equity
      value below the secondary market mark; (2) the complete absence of public financial disclosure—if revenue
      has declined from a 2021 peak due to provider churn, the multiple-implied value would compress further;
      (3) the five-year absence of equity financing, which removes positive signal from willingness-to-dilute
      and may indicate the company has been unable to achieve a new-round valuation above the 2021 COI; (4) adverse
      provider billing disputes documented on TrustPilot and TrustRadius, which may contribute to elevated churn and
      constrain net revenue retention on the per-booking model; and (5) competitive pressure from payer-driven
      scheduling (e.g., Blue Cross Blue Shield internal scheduling portals) and EHR-native scheduling tools
      (Epic MyChart scheduling) that could commoditize the Zocdoc value proposition. Against these risks, the
      most significant upside lever is the Zo AI agent: if Zo can capture a meaningful share of non-marketplace
      phone scheduling volume at $2/booking across a national provider base, this represents a genuinely new
      revenue stream that the current secondary-market mark does not credit. The Blue Shield of California
      partnership (2025) and payer channel strategy also represent potential upside scenarios where Zocdoc becomes
      infrastructure-layer scheduling software for payers, not just a consumer-facing marketplace. The verdict is
      research-more: at $446M implied equity value, the company may represent value if revenue is growing and
      debt terms are manageable, but the opacity is too severe for investment conviction without private data access.
    claimRefs: [CV033, CV034, CV035, CV036, CV037, CV038, CV039, CV041, CV042]

