      - number: '8.4'
        title: 估值方法与路径
        blocks:
          - type: paragraph
            body: >-
              Zocdoc 可用三种估值路径：（1）可比公司交易倍数；（2）二级市场价格发现；（3）服务方数量乘以单服务方收入的单位经济模型。由于 Zocdoc 财务不透明，可比公司法给出的区间最宽。用财务章节中的
              $100M–$250M 估计收入区间，并套用按数字医疗市场同业校准的 3–10× NTM 收入倍数，EV 区间为 $300M–$2.5B；再对流动性不足和不透明性打折，合理区间为
              $350M–$800M。二级市场法给出单一数据点：截至 2026 年 5 月约 $446M。这是最直接的价格信号，但受二级市场流动性薄、没有控制权溢价，以及 Francisco Partners 债务工具可能排在
              Forge COI 所反映股权类别之前的可能性影响。单位经济法使用约 100,000 家服务方 × 每活跃服务方估计年均支出 $800–$2,000 = $80M–$200M 总收入，再套用 3–5× 倍数得到
              $240M–$1B EV。三种方法的收敛结果约为 $350M–$600M 股权价值，二级市场 $446M 接近区间中点。没有披露收入、EBITDA 或增速时，无法构建 DCF
              模型。从表面看，资本效率指标不利：PremierAlts 报告资本效率比率为 0.39×（当前隐含估值 / 累计融资），意味着市场目前只按每投入 1 美元给公司估值 39 美分。这显著低于健康市场型公司预期的
              1.5–3× 效率区间，也反映出峰值估值后的剧烈下调。
