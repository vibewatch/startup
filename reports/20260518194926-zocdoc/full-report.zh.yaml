      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >
              医疗预约排班市场涉及四类经济角色不同的主体：患者、个人医疗服务方与诊所、医疗体系，以及健康险计划。

              患者是终端用户和受益者，但在数字排班层很少是付费方——Zocdoc 和大多数竞品都免费提供消费者体验。只要数字渠道可用，患者采用意愿较高：现在超过 40%
              偏好在线预约，是否接受保险、是否有可约时间、地点是前三大决策标准。超过 80%
              的消费者在选择新服务方时认为可约时间“非常或极其重要”。采用触发点是便利与信任——一次顺畅预约同时确认保险网络内状态，就移除了就诊前最大的摩擦点。

              在多数消费者市场模型中，个人医疗服务方和诊所才是付费方。按 Zocdoc 的按预约收费模型，诊所为每名经平台导入的新患者支付
              $30-$140。服务方采用的触发点是新患者获客经济账：如果预约费低于其他获客渠道成本（广告、转诊网络、闲置产能），模型就有明确价值。历史上，只要感知到的单次预约成本超过获客价值，服务方流失就会升高。

              医疗体系和大型医院集团构成企业级付费方，签署网络级或系统级协议。Kyruus 用服务方数据和患者访问解决方案服务超过 1,400 家医院和 550 个医疗集团。Zocdoc 则用诊所管理工具和 EHR
              集成切入同一层级。

              健康险计划是新兴分发伙伴：把排班嵌入保险目录，可以减少行政摩擦，并把预约导向保险网络内服务方。Headway 的 70,000+ 名参保心理健康服务方，以及 Kyruus 的 100
              个健康险计划品牌客户，说明计划侧参与已经具备规模。
