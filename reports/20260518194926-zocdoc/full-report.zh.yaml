      - number: '4.2'
        title: Zo AI 代理与扩展收入线
        blocks:
          - type: paragraph
            body: >-
              除核心市场预约费外，Zocdoc 在 2024 年 Q3 面向既有市场客户试点后，于 2025 年 Q1 推出 Zo——一款用于排班的 AI 电话代理。Zo 按每次成功预约收费
              $2，不收前期费用、实施费用或长期合约费用，因此非 Zocdoc Marketplace 客户的诊所也能使用。大规模企业定价包含按预约折扣费率。2025 年 Q1 的早期表现数据显示，Zo
              无需人工介入即可解决最高 70% 的排班来电，平均通话解决时间低于 3 分 30 秒。Zo 采用确定性优先的 AI
              架构：大语言模型负责把语音转成结构化数据，确定性代码负责执行排班政策、资格检查和日历事实源核验。许多患者仍用电话预约，潜在可服务量很大；这次发布让 Zocdoc
              能从依赖电话预约、而非在线市场渠道的服务方那里捕获排班收入。Zo 收入流可能把 Zocdoc 从单纯依赖市场预约费，拓展到软件服务模型，但 Zo 总收入贡献未披露。Zocdoc 还通过 2023 年中推出的
              Integration Partner Program 获得间接平台价值，该项目把 EHR 和 PMS 厂商分为 Basic、Complete、Advanced 合作层级。Advanced
              集成伙伴获得完整功能访问和产品改进，加深与 Zocdoc 的分发关系；但该项目的直接变现条款未公开披露。
