      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Zocdoc 由三名背景互补的创始人于 2007 年共同创立，覆盖医学、技术和运营。Oliver Kharraz, MD, PhD 是 CEO 兼联合创始人，出生于德国，拥有
              Ludwig-Maximilians-Universität München 医学博士和神经科学博士学位，以及 Hochschule für Philosophie München 哲学文学硕士学位。创立
              Zocdoc 前，Kharraz 在 McKinsey & Company 任副董事七年，为国家医疗服务设计患者利用率模型。他在 2007 年 1 月公司创立时以总裁身份加入，并于 2015 年 11 月出任
              CEO。联合创始人、现任首席 AI 官 Nick Ganju 负责包括 Zo 电话助手在内的公司 AI 战略。第三位联合创始人 Cyrus Massoumi 是最初的 CEO，直到董事会在 2015 年末因
              Inc. 文章所称的“更多人事问题”将其免职。Massoumi 随后以欺诈为由起诉 Zocdoc；据报道，该案在 2024 年被驳回。按 Tracxn 董事会登记，他仍被列为独立董事。


              Tracxn 列出截至 2026 年的六名在任董事：Cyrus Massoumi、David Weiden、Oliver Kharraz、Ken Howery、Joaquin Gamboa 和 Netta
              Samroengraja。关键人风险较高：Kharraz 是商业模式转向和 Zocdoc AI 议程的公开核心设计者，尚未识别出公开的当然继任者。员工数在不同来源之间冲突——Tracxn 报告截至 2026 年
              4 月有 1,332 名员工；美国公司实体（ZOCDOC, INC.）在法律文件中显示截至 2024 年 12 月 31 日有 646 名员工；Yahoo Finance/Forge 列出 501
              名全职员工，说明 Tracxn 数字可能包含印度子公司的全球员工。
