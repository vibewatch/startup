      - number: '4.5'
        title: 财务缺口与尽调结论
        blocks:
          - type: paragraph
            body: >-
              以 Zocdoc 的规模看，财务画像明显不透明。公司自约 2020 年以来没有公开披露收入、EBITDA、烧钱速度或毛利率；印度子公司 $7.14M 的收入也不能代表美国业务。公开领域唯一财务说法，是 CEO
              2021 年 2 月关于盈利的表述；这份盈利能力是否延续到 2025–2026 年仍未知。Forge、PremierAlts 在 2025–2026 年均隐含约 $446M 的二级市场估值，说明市场并不认可旧有
              $1.8B 估值或 COI 隐含的 $2.62B 估值，相当于较 2021 年 COI 标记下调约
              83%。形成投资信念前，几项关键尽调缺口必须补齐：实际收入轨迹和增速、按预约计费模型的毛利率、运营成本结构、2021 年 Francisco Partners
              融资的债务条款、员工数轨迹，以及盈利说法是否延续。TrustPilot 和 TrustRadius
              上医疗服务方关于账单的负面投诉显示，争议仍在持续；如果服务方关系在规模化后恶化，可能带来收入确认和流失风险。集成合作伙伴计划和 Zo 发布带来收入多元化机会，结构上是正向信号，但财务贡献尚无法量化。
