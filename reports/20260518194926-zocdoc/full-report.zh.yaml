            body: >-
              公开采用证据明显强于典型早期数字医疗创业公司。Zocdoc 的 iOS 列表称每月有数百万患者使用服务，Bitscale 估计其覆盖 2,000+ 城市、月用户超过 6 million，iOS App 约
              160,000 个评分、4.9 星。Google Play 又提供一个规模信号：市场支持 18,000+ 保险计划；在美国医疗搜索中，保险匹配是核心转化驱动。供给侧，Zocdoc 的集成合作伙伴计划称近
              100,000 家医疗服务方连接到平台，Elation 集成则打开了独立初级保健医生的大池子。2025–2026 年的新渠道发布说明采用引擎仍在扩张：Yelp 合作把预约嵌入每周数百万次健康相关搜索，Zo AI
              电话助手则把患者触达面扩展到网页搜索和 App 流程之外。历史证据也重要。Forbes 报道 Zocdoc 曾支撑 City of Chicago COVID
              疫苗预约系统，说明产品能在有名有姓的公共部门生产环境运行，而不只是用于私人诊所获客。
