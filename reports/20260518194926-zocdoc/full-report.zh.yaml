      - number: '6.4'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开记录里，耐久性是软肋。没有可见来源披露 Zocdoc 的 NRR、GRR、服务方流失率、续约率、合同期限或预约队列留存。最好的公开代理指标都是间接的：新的 App 评论、数百万月用户、持续合作伙伴发布和
              2025 年盈利侧写，说明平台仍有商业动能；但这些信号不能替代服务方队列数据或重复预约曲线。Summit Partners 描述的 2018 年商业模式转型很有启发：服务方流失后，Zocdoc
              不得不放弃纯订阅列表模式，说明线索质量和变现设计在结构上很重要。今天的扩张逻辑似乎落在四个杠杆上：更多服务方集成、更广保险覆盖、心理健康等专科增长，以及 Yelp 等外部需求渠道。但集中度风险仍难承销。接近
              100,000 家服务方的网络反驳了单一账户依赖，但 Zocdoc
              没有披露头部服务方、头部渠道或头部地理收入表。考虑到服务方持续抱怨线索质量和账单，尽调应聚焦服务方续约队列、取消经济性、渠道组合，以及已集成诊所是否比未集成诊所留存更好。
