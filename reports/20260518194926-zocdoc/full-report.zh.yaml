      - number: '4.3'
        title: 单位经济模型与平台运营指标
        blocks:
          - type: paragraph
            body: >-
              Zocdoc 的市场经济模型具备双边市场软件业务典型的高毛利特征：主要收入成本是基础设施、平台运营和支付处理，而不是实物商品或人工服务交付。毛利率数字未公开披露；不过医疗科技市场平台在预约费上的毛利率通常为
              60-80%，其中服务方获客成本是主要变量。公司成本结构主要由销售和营销（服务方获取与留存）、研发（平台、AI、集成）以及一般和行政费用构成。由于业务纯软件属性，实物资本开支很小。服务方端，只要达到足够预约量，按预约收费模型的单位经济理论上有利：城市市场一名皮肤科医生每年产生
              500+ 个预约，会支付 $15,000-$70,000，但也获得具备显著生命周期价值的患者。患者端，Zocdoc 通过
              SEO、付费媒体和合作伙伴承担获客成本；平台自身服务一笔增量患者预约的边际成本接近零。服务方侧存在负面信号：TrustPilot 和 TrustRadius
              评价提到，服务方因未转化或超出其专科范围的患者转诊被收费，说明计费模型存在争议摩擦。截至 2024 年 12 月，按 Tracxn 数据，Zocdoc 美国实体约有 646 名员工；Yahoo Finance
              则报告截至 2026 年 5 月约有 501 名全职员工——这一显著差异可能反映近期裁员或报告口径不同。按 Tracxn MCA 申报数据，印度工程子公司员工数未说明，截至 2025 年 3 月财年收入为
              $7.14M。
