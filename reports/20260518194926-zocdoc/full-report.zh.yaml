  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              数字医疗排班和患者访问市场没有单一主导平台，而是分散在四类结构性竞争者中：（1）面向消费者的发现目录（Healthgrades、WebMD、Vitals、US News
              Health）；（2）带嵌入式预约或分发的平台聚合器（Google Health、Yelp
              Health）；（3）服务医疗体系和保险计划的企业级服务方数据与访问平台（Kyruus、NexHealth、Relatient、Luma
              Health）；（4）垂直聚焦的排班加临床交付混合体（Headway、Grow Therapy、Teladoc、One Medical）。Zocdoc
              的位置很独特：消费者优先、多专科、保险核验、可直接实时预约的市场；已识别的单一竞品没有完全复制这一组合。

              市场结构证据：服务方评分与目录空间汇集了数百万医生档案的评分（WebMD 有 3M+ 个医生档案；Healthgrades 声称有 10M+ 条医生评分），但这些目录过去缺少实时可约时间或保险筛选。Google
              的医疗搜索和 Yelp 的健康类别产生巨大的消费者意图流量，即便最终导流到 Zocdoc 这类平台完成预约，它们仍是漏斗顶端发现的结构性替代。Tracxn 数据识别出 Zocdoc 的 12
              个竞争对手，其中美国总部玩家包括 Healthgrades、NexHealth 和 RealSelf。

              Zocdoc 在 2025 年签下的 Yelp 分发合作，是一次值得注意的战略转向：Zocdoc 不再与 Yelp 的漏斗顶端流量竞争，而是把预约直接嵌入 Yelp 服务方页面，把结构性威胁转化为分发渠道。这让
              Yelp 从竞争者变成伙伴，但不能解决 Google 去中介化风险。
