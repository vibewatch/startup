      - number: '3.3'
        title: 功能与能力对比
        blocks:
          - type: paragraph
            body: >
              在已审阅竞品中，Zocdoc 在“面向消费者的保险核验深度（覆盖 18,000+ 个计划）+ 多专科广度（250+）+
              直接实时预约”这一组合上领先。最接近的同行能在单一维度匹配，却无法匹配交集：Healthgrades 有可比的消费者流量，但缺少实时保险核验；Kyruus 服务方数据更深，但没有消费者市场；Headway
              在心理健康保险资质认证上更强，但只覆盖一个专科簇。

              相比竞品集合，Zocdoc 的关键功能缺口包括：没有医生社区网络（Doximity 的核心护城河）、没有远程医疗视频交付模块（One Medical、Teladoc），也没有订阅式初级保健关系（One
              Medical、Forward）。服务方评价将其按预约收费定价模型列为流失主因之一，尤其在预约转化率较低时。

              AI 差异化：Zocdoc 的 Zo 语音排班助手无需员工介入即可解决最高 70% 的来电；已审阅竞品尚未宣布部署达到这一解决率的同类 AI 电话排班代理。Zo 的技术架构优先可靠性而非探索性，使 Zocdoc
              在电话渠道获得先发位置，EHR 集成型竞品（Epic、Kyruus）尚未复制。

              应用商店质量方面，Zocdoc iOS 应用评分 4.9/5、评分数 160,000+，Android 应用评分 4.8/5；相比应用评分更难核验的竞品，这显示其消费者端执行力较强。Zocdoc 在
              Trustpilot 和 TrustRadius 上的评价分裂：患者体验以正面评价为主；负面评价集中在服务方，主题包括计费争议、日历同步失败，以及未转化转诊仍被收费。
