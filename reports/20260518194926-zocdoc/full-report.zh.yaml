      - number: '2.5'
        title: 监管与报销动态
        blocks:
          - type: paragraph
            body: >
              数字医疗排班的监管环境，最关键的传导路径是远程医疗报销；它直接决定患者在 Zocdoc 这类平台上预约的线上就诊，能否为服务方带来可报销服务收入。

              CMS 在 2021 年 Medicare 医师收费表中，对一部分 CPT 代码永久扩大远程医疗覆盖，成为疫情后第一项耐久监管变化。但公共卫生紧急状态期间新增的数十个 CPT
              代码仍处于临时豁免状态——国会多次延期续上了这些安排，但尚未出台永久性立法修复。截至 2026 年 3 月，KFF 报告称，多数疫情时期 Medicare
              远程医疗弹性仍通过最近一次延期生效，同时提示永久性问题仍有立法不确定性。依赖虚拟就诊量来支撑价值主张的排班平台，因此面临规划周期风险：一旦回滚，将不成比例地影响远程医疗占比较高的专科，以及非农村地区患者（这些地区适用被豁免的地理限制）。

              州级远程医疗执照要求增加了第二层合规：服务方通常必须持有患者接受护理所在州的执照，这让促成跨州虚拟就诊的数字平台面临多州资质复杂度。HHS 远程医疗指南和 CMS 服务方注册规则约束运营机制，HIPAA
              和州隐私法则适用于排班数据处理。Zocdoc 已获得 SOC 2、HIPAA 和 PCI 合规，建立了基线合规资质；但远程医疗报销的更广监管格局，仍是市场增长预测的主导风险。
