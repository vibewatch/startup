      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              增长驱动足够强，也有多层来源。消费者对数字排班的偏好五年提升 15 个百分点，达到 40%+，背后是智能手机普及、用户习惯应用内交易，以及疫情带来的行为变化。服务方组织面临结构性人手压力：最高 20%
              的患者来电无人接听，每通未接电话让诊所损失 $200-$300 收入，因此 AI 或数字排班工具能直接算出 ROI。Zocdoc 的 AI 电话助手 Zo 在 3.5 分钟内、无需员工介入即可解决最高 70%
              的排班来电。公司与 Yelp 的分发合作，把平台触达扩展到每周数百万次医疗搜索；这一模型可把高意图平台流量直接转化为预约。

              监管顺风包括 CMS 在 2021 年收费表中永久扩大远程医疗 CPT 代码报销，以及国会多次延长疫情期间 Medicare 远程医疗弹性。数字健康领域的 AI 投资仍处高位。

              采用约束同样明显。报销同价尚未解决：McKinsey 调查中 54% 的医生表示，即便虚拟护理价格比线下低 15%，他们也不会提供，限制了远程医疗在行为健康之外的扩张。Medicare
              远程医疗弹性在法律上仍是临时安排，多类 CPT
              代码的报销存在不确定性。服务方侧的技术阻力具有结构性：小诊所同时面对变革管理成本和集成复杂度。保险数据准确性是长期失效点——患者预约后才发现页面列出的保险网络内服务方实际并不在网络内，侵蚀平台信任。服务方关于日历同步失败、未转化转诊仍被收费、争议解决有限的投诉，也会制造摩擦。尽管需求强，农村宽带缺口仍压制服务不足地区的远程医疗需求。
