              2018 年按预约收费的定价转型，使服务方成本与交付价值对齐，消除了系统性服务方流失，并让公司到 2021 年达到其所称的盈利。平台 175+ 个 EHR 集成、约 100K 名服务方网络和 Zo AI
              层共同形成复合网络效应壁垒：新服务方改善患者供给，吸引更多患者，又进一步强化服务方付费意愿。
