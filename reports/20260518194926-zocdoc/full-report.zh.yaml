      - number: '4.4'
        title: 资本结构、融资与现金跑道
        blocks:
          - type: paragraph
            body: >-
              Zocdoc 历史上披露的股权和成长融资合计约 $370–426 million，最近一次是 2021 年 2 月 Francisco Partners 提供的 $150 million 成长融资。CEO
              在该轮融资时说：“今天，Zocdoc 属于最罕见的私有科技公司：我们已经盈利，而且增长在加速”，这是公司最近一次公开描述财务状态，之后再没有用量化经营数据更新。2021
              年融资被描述为“成长融资”（不是传统风险股权轮），结合 Francisco Partners 信用和结构化解决方案团队参与，可能是混合债务 / 信用结构。自 2021 年 2
              月以来，公司没有公开宣布股权或债务融资；截至 2026 年 5
              月，这段空窗约五年。没有新融资可能意味着：（a）公司确实现金流为正、能自我维持；（b）公司无法以可接受估值融资；或（c）两者都有。现金余额、月度烧钱速度和现金跑道均未公开披露。美国实体在 SEC 的 CIK 为
              0001417902，并在 2015 年前就股权发行提交过 Form D 豁免备案；近年没有 Form D，说明 2015 年后可能没有股权融资，也可能通过非 Form-D 渠道安排（例如信用额度）。Forge
              基于 COI 文件的资本结构数据显示，2021 年 Series D-2 轮以每股 $29.29 的 $100M 股权计算，隐含投后估值 $2.62B，明显高于 2015 年 $1.8B 估值和当前二级市场隐含的
              $446M。往后资本强度仍低于制造业或医疗服务企业，预计投入主要落在 AI 产品开发、医疗服务方销售和支付方合作。
