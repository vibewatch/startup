      - number: '8.3'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >-
              Zocdoc 可直接对标的上市公司有限。最接近的参照是 Doximity（NYSE: DOCS），一个医生职业网络和医疗 IT 平台，并披露收入。Doximity FY2026 收入约 $520–540
              million，EBITDA 利润率约 35–40%；截至 2026 年 5 月初，股价约 $65–70，隐含市值约 $11–12 billion、收入倍数约 20–22×。Doximity
              的溢价倍数来自医生网络护城河、高度经常性的药企营销收入和强劲有机增长，因此更适合作为 Zocdoc 的高端参照，而不是中位数参照。Teladoc Health（NYSE:
              TDOC）虽不是市场型参照，却是最显眼的“数字医疗上市后暴跌”警示基准：从 2020 年约 ~$60 billion 市值峰值跌到 2026 年 5 月约 $1–1.5
              billion，其轨迹展示了该领域的下行范围。私有可比方面，Kyruus Health（排班和触达管理）在 2021 年数字医疗估值高点被 symplr 收购，据报道交易金额约 $1.4
              billion，当时收入倍数可能为 10–15×。Healthgrades 作为医生目录和评论平台，被 Internet Brands 分拆出售，公开价格发现有限。基于这些数据点，用市场型软件基准和 Zocdoc
              $100–150 million 的估计收入计算，合理的中位混合倍数会隐含 $500 million（3–4× 收入，计入流动性折价）到 $1.5 billion（10× 收入，乐观情景）的区间。$446
              million 的二级市场标记位于合理区间底部，说明市场对一家没有披露财务的公司给出了最大流动性和不透明折价。
