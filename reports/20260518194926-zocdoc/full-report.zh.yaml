      - number: '8.2'
        title: 历史融资与资本轨迹
        blocks:
          - type: paragraph
            body: >-
              按 Tracxn 数据，Zocdoc 在十二次已披露融资事件中累计融资约 $426 million。融资轨迹分成几个清晰阶段：早期风险投资（2007–2012 年，Series A–C，合计约 $95
              million）、成长股权（2015 年 Series D，在 $1.8 billion 标记下融资 $130 million），以及 2021 年 Francisco Partners 的 $150
              million 成长融资。2015–2021 年之间的空窗（两次股权轮相隔六年）部分可由公司自己的公开评论解释：订阅模式造成单位经济亏损，必须先修复才能推动新一轮融资；修复后，2021 年盈利说法支撑了
              Francisco Partners 交易。从 2021 年到 2026 年 5 月的五年空窗（没有新的公开融资）是当前估值分析最关键的信号：如果公司确实现金流为正，就不需要新融资，二级市场价格在没有 IPO
              催化剂时反映真实股权情绪。如果公司在烧钱或受 Francisco Partners 限制性契约约束，没有融资就反映投资人犹豫或契约限制，而不是财务强劲。EDGAR 上最新 SEC Form D 文件来自 2015
              年 8 月的 Series D，确认之后没有股权豁免备案。2021 年 Francisco Partners 轮没有 Form D，与不需要 Form D 披露的信用额度或结构化债务工具相符。Forge
              Global 的 COI 数据确认 2021 年日期有 Series D-2 授权，但 Zocdoc 自身 Form D 记录没有显示，进一步支持该轮采用非标准股权结构。
