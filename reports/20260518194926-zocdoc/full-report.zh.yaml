      - number: '1.4'
        title: 平台规模、技术与合规
        blocks:
          - type: paragraph
            body: >
              截至 2025-2026 年，Zocdoc 平台把患者连接到 250 多个专科、约 100,000 名医疗服务方，并接受近 18,000 至 20,000 个保险计划。公司 Apple App Store
              页面称，患者通常在预约后 24 至 72 小时内就能看医生；应用评分为 4.9/5，评价超过 160,000 条。Google Play 页面同样把 Zocdoc 定位为连接患者与“近 100,000
              名医疗服务方”的平台。Bitscale 报告称，其在美国 2,000 多个城市拥有约 6 million 月活用户。Trustpilot 将消费者情绪概括为“压倒性正面”，评价者称赞预约方便、保险匹配和当日可约。


              技术层面，Zocdoc 运营 175 个以上 EHR 日历集成，使使用第三方诊所管理软件的服务方能够实时排班。2025 年 5 月，Zocdoc 推出 Zo，这是一款 AI
              电话助手，建立在近二十年排班数据和确定性规则编排之上。早期采用者报告称，Zo 无需员工介入即可解决约 70% 的来电排班需求，平均通话解决时间低于 3 分 30 秒。Zo 按每次成功管理的预约收费
              $2，不收前期费用；在 2024 年 Q3 面向既有市场客户内部试点后，现在已更广泛提供。Integration Partner Program（2023 年推出）与 EHR 厂商建立分层合作关系（Elation
              和 EverHealth 旗下 DrChrono 是 Advanced Integration Partners），Zocdoc 也为服务方网站、Google Business Profiles
              和保险目录提供排班能力。合规认证包括 HIPAA、SOC 2、PCI、GDPR 和 ISO 27001。
