              Zocdoc 已超过五年没有公开股权融资，也没有宣布战略交易（2021 年 2 月–2026 年 5 月）。若按当前二级市场价格 IPO，估值将低于 COI
              标记，会给员工留存和投资人回报带来不利叙事。公开记录没有识别出战略收购方。
            calloutType: risk
