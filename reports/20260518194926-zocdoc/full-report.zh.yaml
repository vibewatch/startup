  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Zocdoc 所处赛道是美国更广义健康信息技术市场中的数字化患者访问与医疗预约排班。纳入的支出包括面向患者、按专科、保险计划、地点和可约时间搜索并筛选医疗服务方；实时预约基础设施（包括 EHR
              日历集成）；嵌入预约环节的保险资格核验；以及多渠道分发（市场、服务方网站、保险方目录、第三方搜索）。排除的类别包括 EHR
              工作流和临床文档软件、远程医疗视频交付基础设施、医院账单和收入周期管理、远程患者监测硬件，以及药房或处方平台。

              相邻但非核心的重叠支出包括：（1）医疗体系数字前门平台（如 Kyruus，向医疗体系和保险计划提供服务方数据管理，而不是直接消费者市场）；（2）排班只是临床交付附属功能的远程医疗订阅模型（如 One
              Medical、Teladoc）；（3）处在排班与临床交付边界上的特定病种心理健康市场（如 Headway、Grow Therapy）。现状替代方案仍很强：美国大多数门诊预约仍靠电话完成，诊所来电最高 20%
              无人接听，34% 打不通电话的患者会完全放弃预约。自助患者门户、现场免预约就诊和转诊预约，构成其余非数字替代方案。
