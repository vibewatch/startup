          - type: callout
            title: SAM 和 SOM 无法用公开来源确认
            body: >
              已审阅来源中没有对数字预约排班子市场的权威独立测算。McKinsey 的 $250B 数字是虚拟护理 TAM，不是预约平台可服务市场。本章所有 SAM/SOM
              描述，都是基于服务方数量和预约费代理指标的有边界推断；在尽调获得私营公司数据前，只应视为方向性判断。
