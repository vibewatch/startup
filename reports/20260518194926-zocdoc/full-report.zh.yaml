        - id: marketplace
          label: Zocdoc 市场
          description: 将患者匹配到网内医疗服务提供者；确认实时可约；处理预约
        - id: provider
          label: 医疗服务提供者
          description: 每个新患者预约支付 $30–$140；收到已确认预约；通过 EHR 日历集成
        - id: booking_fee
          label: 预约费收入
          description: $30–$140/新患者；按专科和市场变化；回访患者不收费
        - id: zo_channel
          label: Zo AI 电话渠道
          description: 每通成功预约来电 $2；70% 来电无需员工介入即可解决；Q1 2025 推出
        - id: gross_profit
          label: 平台毛利
          description: 预约费减去托管、支付处理和支持成本；估计 60–75% 毛利率（参照市场平台）
