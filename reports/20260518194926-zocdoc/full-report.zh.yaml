  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心平台与产品架构
        blocks:
          - type: paragraph
            body: >-
              Zocdoc 提供的是医疗触达工作流，而不是单个 App
              功能。患者侧的核心任务是：找到保险网络内医生，确认医生匹配所需专科，看到真实可预约档期，并在不打电话给诊所的情况下完成预约或改期。移动端列表和消费者评论显示，前端体验已经成熟、对患者免费且采用广泛，不过
              Apple 和 Google 披露的服务方与专科数量并不一致。供给侧看，Zocdoc 真正的护城河不只是消费者流量，而是围绕 175+ 日历、EHR、诊所管理系统集成，以及覆盖 18,000+
              保险计划映射搭起来的服务方档期控制层。这一运营层把碎片化诊所排班变成可搜索的市场。同一调度底座现在也支撑 Yelp 等合作伙伴渠道和更早的 Zocdoc for Developers API，意味着 Zocdoc
              越来越像预约基础设施，同时仍是一个市场。核心架构最大的尽调缺口是数据完整性：公开的服务方投诉显示，只要日历同步或服务方分类出错，产品承诺就在转化那一刻失效。
