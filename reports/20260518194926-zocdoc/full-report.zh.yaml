      - number: '2.6'
        title: 展示项
        blocks:
          - type: callout
            title: 心理健康是确定性最高的数字排班子市场
            body: >
              精神科远程医疗渗透率已约 50%，是所有专科中最高；McKinsey 预测心理健康“几乎完全转向远程”。再叠加保险方支持的市场（Headway，70,000+ 名参保治疗师）和美国 56%
              县份持续存在的服务方短缺，心理健康为数字排班平台提供了最清晰的近端单位经济模型案例。
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
              - CM027
          - type: callout
            title: Medicare 远程医疗能否永久化是最大监管变数
            body: >
              国会延期让疫情时期远程医疗弹性延续到 2026 年，但没有永久立法。一旦回滚，虚拟就诊量会下降——尤其是 Medicare 患者——并不成比例地冲击支持远程医疗的排班平台。KFF 最晚在 2026 年 3
              月仍将其标记为开放的政策不确定性。
            calloutType: risk
            claimRefs:
              - CM032
              - CM033
          - type: callout
            title: 保险数据准确性是结构性平台弱点
            body: >
              患者评价和服务方投诉持续把保险不准确列为头号失效模式：列为网络内的服务方有时实际不在网络内，日历同步失败则造成重复预约。这些问题损害患者信任，也为服务方制造退款争议。任何可信竞品只要做出更高的保险准确性，就会获得实质性差异化优势。
            calloutType: risk
