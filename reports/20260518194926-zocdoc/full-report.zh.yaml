      - number: '2.2'
        title: 市场规模测算——多个证据视角
        blocks:
          - type: paragraph
            body: >
              数字化医疗预约排班作为独立市场类别，并没有单一可信的 TAM 数字；证据基础更多来自更宽的虚拟护理和数字健康视角，彼此重叠、只部分适用。

              McKinsey 最常被引用的估算认为，美国每年最高 $250 billion 医疗支出有可能转向虚拟或虚拟赋能护理，这构成了支持这类转移平台的理论外沿。另一个视角是，到 2021
              年中，远程医疗使用率稳定在美国全部门诊和诊室就诊的 13-17%，约为疫情前基线的 38 倍；心理健康在精神科中的渗透率继续上行，接近 50%。仅 2021 年 H1，数字健康 VC 投资就达到 $14.7
              billion，即便具体排班平台收入池不公开，也显示生态投资仍在持续。

              测算 Zocdoc 的可服务可获得市场时，有几个自下而上的代理指标：Zocdoc 自称覆盖 250+ 个专科、近 100,000 名活跃服务方和 18,000+ 个保险计划，说明平台已渗透美国约 3
              million 名 NPI 注册服务方中相当可观、但仍属少数的一部分。Kyruus 引用的 40%+ 消费者偏好在线预约、五年提升 15 个百分点，说明需求池在扩大。Solv 声称支持 100M+
              次医疗就诊，也显示同一预约类别已具备不可忽视的平台规模。

              针对 Zocdoc 特定细分市场（多专科、保险核验、消费者市场模型），公开渠道没有权威 SAM 或 SOM；尽调估算只能作为由上述代理指标推导出的有边界推断，并应保持这一定位。
