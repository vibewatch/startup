  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价架构
        blocks:
          - type: paragraph
            body: >-
              Zocdoc 的主要收入流，是向医疗服务方收取基于成效的按预约费用：每一名通过市场预约的新患者，都对应一笔收费。公司公开收费为每名新患者预约 $30 至 $140，具体费用随专科、市场和手术 /
              服务类型变化。一名服务方如果每年获得 215 个新患者预约，年应付费用最高可达 $30,100。该模型取代了约 2012 至 2018 年实行的每名服务方 $3,000
              固定年费订阅。订阅时代的价值交付极不均衡：需求旺盛的城市专科医生和只能拿到十个预约的乡村低量执业者支付同样价格，却获得数千个预约。CEO Oliver Kharraz 在 2022
              年直接承认，公司当时“停止增长，每笔销售都亏钱，并在医生中制造负面认知”。按预约收费模型让收入与实际交付价值对齐，消除了订阅时代的负单位经济陷阱。该模型从 2018
              年开始推出，一些纽约市医生提起诉讼反对，但最终完成铺开。模型带来随需求波动的收入，随供给侧增长（更多服务方、更多专科）和需求侧增长（更多患者会话）共同放大。Zocdoc
              不向患者收费；消费者端可免费使用市场。服务方侧定价透明度仍有限：$30-$140 区间来自 CEO 说法；实际实现的平均预约费和任何批量折扣都未公开披露。
            claimRefs:
