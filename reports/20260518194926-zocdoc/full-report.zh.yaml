            body: >
              该领域大多数竞品是私营公司，已审阅来源没有披露数字排班子细分的具体收入、预约量或市场份额数据。本章相对定位评估基于已披露的服务方数量、消费者评价、伙伴公告和公开产品文档。在尽调拿到私营数据前，这些评估只应作为方向性指标。
