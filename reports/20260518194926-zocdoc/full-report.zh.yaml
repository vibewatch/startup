      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: Zocdoc 的 Yelp 合作把结构性威胁变成分发渠道
            body: >
              Zocdoc 没有继续与 Yelp 庞大的医疗消费者搜索流量正面竞争，而是在 2025 年把实时预约直接嵌入 Yelp 服务方页面。原本可能是零和去中介化风险的路径（Yelp
              直接把患者导向服务方网站），被转化为增量预约渠道。如果能谈下更深的预约集成，同一打法也可能适用于 Google。
            calloutType: insight
            claimRefs:
              - CP005
              - CP030
          - type: callout
            title: 服务方计费争议是最常被提及的竞争弱点
            body: >
              TrustRadius 给 Zocdoc 的服务方体验评分为 1/10，评价提到未转化转诊仍被收费、日历同步失败和争议解决有限。BBB
              投诉文件也呼应了同样主题。任何竞品只要提供固定费或免费增值排班模型，并具备可比的消费者触达，就有直接机会承接小诊所流失。NexHealth 和未来的 EHR
              原生排班功能（Epic、Athena），是这一服务方细分中最可能的替代者。
            calloutType: risk
            claimRefs:
              - CP034
              - CP035
          - type: callout
            title: Google 去中介化是最难量化的风险
            body: >
              Google 的 Health Knowledge Panels 和直接预约集成，可以不经过 Zocdoc 市场而把患者导向服务方网站，同时绕开患者获客价值和预约费。Healthgrades 或 WebMD
              的竞争，Zocdoc 可以用消费者品牌投入应对；但 Google 在健康查询中的搜索主导地位是结构性的。Yelp 合作能部分说明如何处理这类风险，但已审阅来源中，Zocdoc 目前没有同等 Google
              集成协议。
            calloutType: risk
