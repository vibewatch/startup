            body: >-
              客户证据并不对称。消费者侧证据强、当下且高频：应用商店评分很高，App 评论明确提到成功预约当日门诊，Trustpilot 评论聚焦预约方便和保险网络内发现。这一点重要，因为它把产品效用直接连到 Zocdoc
              声称要解决的真实痛点上。具名生产环境证据也存在，但不完整。最清晰的公开例子是 City of Chicago 疫苗预约系统、Elation 支持的医生集成，以及 2026 年 Yelp
              预约渠道。每个例子都证明了真实部署，但没有给出按收入排序的客户名单或重复使用队列。服务方侧证据要不利得多。TrustRadius 和 BBB
              投诉面显示，错专科转介、账单争议、日历同步故障、涨价以及患者取消后救济有限等问题反复出现。最终形成的是一组质量分裂的证据：患者似乎足够满意，可以验证漏斗顶部需求和预约效用；服务方则提出变现和工作流投诉，可能压制续约质量。
