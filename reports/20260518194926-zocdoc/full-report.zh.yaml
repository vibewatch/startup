      - number: '5.4'
        title: 路线图、部署模型与战略依赖
        blocks:
          - type: paragraph
            body: >-
              Zocdoc 的路线图更像是从自有市场逐步扩展到基础设施和自动化层。公司已在 2018 年把商业模式从年度 SaaS 订阅改为按成功预约患者收费的平台模式，随后又上线
              Zo，采用单独的按成功预约付费结构且无需预付承诺。这一定价降低了采用摩擦，但也把经济性紧紧绑在预约准确率、来电解决质量和合作伙伴渠道转化上。公开路线图信号指向外呼语音工作流、处方续配协调、多语言支持，以及
              Yelp 分发从 iOS 进一步扩展到 Android 和桌面端。与此同时，CNBC 关于远程医疗的评论说明，公司长期价值仍锚定本地医疗服务方发现和预约，而不是纯虚拟医疗逻辑：COVID
              期间远程医疗激增，但只要有选项，多数患者仍会选择开车可达的医生。因此战略依赖很清楚：服务方日历和 EHR 连接器、保险计划数据质量、合作伙伴分发渠道、AI 模型可靠性，以及服务方数据和 AI
              支持中的人工运营团队。任何依赖项漂移，都会很快表现为重复预约、低质量转介或服务方流失。
