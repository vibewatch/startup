      - number: '7.3'
        title: 财务、估值与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              承销难题不是 Zocdoc 是否已经有规模，而是公司披露太少，无法有把握地定价耐久性。Inc 报道，Zocdoc 虽把自己描述为盈利，但自 2020 年以来没有公开披露收入；Forge
              Global、SEC/Form D 历史、Contrary、Sacra 和 Tracxn
              等二级数据来源主要提供资本历史背景，而不是经审计的经营证据。也就是说，投资人可以看到旧融资、私有市场参考价格和资料聚合，却无法用公开证据测试当前收入质量、利润率结构、专科组合或按投诉调整后的留存。


              商业模式历史让这种不透明更危险。Inc 对定价从订阅转向按成功预约患者付费的叙述显示，Zocdoc
              已经不得不根据服务方行为和公司经济性重做变现。这不必然是坏事——战略重置可能是健康的——但它证明变现层并不固定。如果服务方投诉仍集中在账单公平性或低质量转介上，未来任何提高抽成率、改变合格线索逻辑或深化工作流变现的努力，都可能重新激起同样反弹。自
              2021 年以来没有新披露融资，只能依赖二级市场参考点，谨慎投资人应假设估值重置可能快于叙事动能。
