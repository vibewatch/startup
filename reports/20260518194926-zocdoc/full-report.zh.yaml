chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Zocdoc, Inc. 是一家私营医疗科技公司，总部位于 568 Broadway, 9th Floor, New York, NY 10012，并在印度 Maharashtra 邦 Pune
              设有第二工程办公室。公司于 2007 年 7 月 2 日在美国注册成立（CIN 260971827），印度子公司 ZOCDOC ONLINE HEALTH MANAGEMENT INDIA PRIVATE
              LIMITED 于 2013 年 5 月 29 日注册。Zocdoc
              运营的是一个双边医疗服务市场：患者按专科、保险计划和地点搜索保险网络内的医疗服务方，查看实时可约时间，并免费即时预约。从个人执业医生到大型医疗体系，服务方只要通过平台获得新患者，就按次支付预约费。


              当前定价模型按专科和市场向服务方每个新患者预约收取约 $30-$140。公司从 2018 年开始引入这一结构，此前放弃了最初每名服务方约 $3,000
              的固定年费订阅。原模型带来严重的价值捕获不均：需求旺盛的城市专科医生和勉强回本的低需求乡村执业者支付同样年费，却能获得数千名新患者，最终造成服务方流失、增长停滞，并且每笔销售都亏钱。Kharraz
              形容订阅模式“差点杀死这门生意”。按预约收费的转向约在 2020 年全面铺开，使服务方经济账重新贴合平台价值，也恢复了增长。平台对患者免费，可通过 zocdoc.com 以及 iOS、Android
              原生应用使用，并接受约 18,000 至 20,000 个保险计划。按 Nudge Security 的供应商资料，安全认证包括 HIPAA、SOC 2、PCI、GDPR 和 ISO 27001 合规。
