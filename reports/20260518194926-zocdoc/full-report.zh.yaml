          - type: callout
            title: 收入估计具有推测性
            body: >-
              所有基于收入倍数的估值方法都建立在 $100M–$250M 的收入估计上，而该估计来自市场结构分析。Zocdoc 没有披露收入。若实际收入显著偏离该区间，倍数隐含估值区间会按比例移动。$446M
              的二级市场标记是唯一不依赖收入假设的估计。
