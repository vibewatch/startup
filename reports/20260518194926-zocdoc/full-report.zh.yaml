  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值证据与相互冲突的标记
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，Zocdoc 有三个实质不同的估值标记；它们代表相互矛盾的判断，而不是把不同方法套在同一数据上。第一个是旧有 $1.8 billion 数字：它来自 Zocdoc 2015 年由
              Baillie Gifford、Fidelity 和 LionTree 领投的 Series D（据报道以 $3.6B pre-money 融资
              $130M），并在没有更新的情况下持续出现在第三方数据库条目和媒体报道中。Inc.com 2025 年 7 月题为“$1.8 Billion
              Business”的侧写把它延续成当前数字，但这个标记已经有十年历史。第二个标记是 2021 年 2 月 Series D-2 的 COI 隐含 $2.62 billion 投后估值：Forge Global
              引用 Certificate of Incorporation 文件，显示以每股 $29.29 融资 $100M，按 COI 计算投后估值为 $2.62 billion。第三个、也最贴近当前市场的标记，是
              Forge 截至 2026 年 5 月 18 日的二级市场价格每股 $5.00，隐含总股权价值约 $446 million。PremierAlts 也独立报告了截至 2025 年 7 月 31 日的 $446.5
              million 估值。三个标记从低到高相差近 6×。没有一个标记绝对权威：旧有 $1.8B 明显过时；COI 标记反映的是 2021
              年融资当时写在股权结构中的价值，之后已被二级市场重新定价；二级市场标记则基于流动性很弱的场外交易，可能不反映控制权或战略买家溢价。不过，对一家未公开披露经审计财务的私有公司来说，二级市场隐含的 $446M
              是目前最新的价格发现。
