      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              运营风险栈更多出现在独立投诉里，而不是正式事故披露中。TrustRadius、BBB 投诉、Serchen、ComplaintsBoard 和 Choosing Therapy
              都指向同一类问题的变体：服务方和患者认为账单可能不公平，保险匹配可能不准确，预约可能失败或制造支持负担。任何单一来源都不能证明系统性失败，但合在一起看，平台核心工作流依赖数据质量和争议解决，而这两件事很难干净地规模化。在市场里，可靠性失败不只是退款问题；它会削弱服务方信任，降低诊所把
              Zocdoc 需求视为高质量需求的意愿。


              AI 路线图又加了一层风险。Zocdoc 自己的技术博客说，真实来电者会带来口音、背景噪声、打断和 prompt
              drift，这些在沙盒里不会出现；这正是医疗预约场景里投资人需要担心的模式。语音自动化可能提高人员杠杆，但如果误导患者、错误处理保险语境或造成排班错误，运营问题会很快变成声誉和合规问题。Zocdoc
              的隐私和安全页面显示其有缓释意图，但公开来源没有提供详细事故历史、错误率披露或控制测试证据，不足以把缓释成熟度评为高。
