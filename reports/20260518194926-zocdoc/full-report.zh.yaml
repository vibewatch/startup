      - number: '3.2'
        title: 竞品画像与规模
        blocks:
          - type: paragraph
            body: >
              Healthgrades 是最接近 Zocdoc 消费者目录与预约模型的单一市场类比对象，年访问量超过 300 million，拥有 10M+ 条医生评分，并在扩展实时预约功能。不同于
              Zocdoc，Healthgrades 靠服务方档案订阅、医疗体系合作和赞助搜索位的组合变现，按预约收入有限。Healthgrades 于 2022 年被 RVO Health（由 Red Ventures 和
              Optum 拥有）收购，因此获得企业级医疗体系分发，以及消费者健康意图上的重要数据资产。

              Doximity 是最强的平台层竞争者：其医生优先网络覆盖美国 85%+ 医生，可支持远程就诊、安全消息和 EHR 集成；在服务方关系侧，Zocdoc 达不到这个规模。Zocdoc
              促成虚拟就诊预约的场景，Doximity 的远程医疗模块直接竞争，不过 Doximity 以医生为中心，而不是消费者优先。

              Kyruus Health 是 Zocdoc 的主要企业级竞争者，借 B2B 服务方数据管理模型服务超过 1,400 家医院和 550 个医疗集团。Kyruus
              不运营消费者市场；它向医疗体系和保险计划提供准确的服务方目录和排班基础设施。关键战略风险在于：医疗体系一旦搭建由 Kyruus 或 Epic MyChart
              驱动、更复杂的数字前门，可能减少对第三方市场获取新患者的依赖。

              Headway 代表垂直专科挑战者：平台拥有 70,000+ 名参保治疗师和精神科医生，并在远程医疗渗透率最高的专科里增长更快。其直接保险资质认证，消除了其他专科中让 Zocdoc 具备价值的保险网络内搜索摩擦。

              One Medical（Amazon）运营礼宾式初级保健订阅（$199/年或由雇主赞助），提供当日和次日预约——尽管变现模型不同于按预约收费，但在患者体验层面直接竞争。
