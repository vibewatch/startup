      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              自 2008 年 6 月首次融资以来，Zocdoc 至少完成了六轮可识别融资。2008 年 8 月，Khosla Ventures 参与的 Series A 融资 $5.38 million，确立约 $13.44
              million 的投后估值。2010 年 7 月，Founders Fund 和 Khosla Ventures 参与的 Series B 融资 $16.67 million，投后估值 $82.53
              million。2011 年 9 月，Goldman Sachs 参与的 Series C 融资 $37.5 million，暗示投后估值 $771.93 million。2015 年 7-8 月，Series
              D 从 Atomico、Baillie Gifford 和 Founders Fund 融资 $130 million（Tracxn）至 $152.57 million（Forge），确立 $1.8
              billion 投后估值，也就是长期被引用的“独角兽”里程碑。最近一次披露融资发生在 2021 年 2 月，Francisco Partners 提供 $100 million（Forge 的 Series
              D-2 标签）或 $150 million（Forbes、Tracxn 以及公司新闻稿称其为“Zocdoc 单次获得的最大融资总额”）。差异可能来自不同分期或数据时点；本报告将 Forbes 和公司公告中的
              $150M 视为更权威数字。所审阅来源均显示，2021 年 2 月以后公司未再融资。


              2021 年融资后，二级市场估值估算明显下滑。Forge 截至 2026 年 5 月 15-18 日的推导价格暗示公司估值约 $446.48 million；如果 2021 年那轮按 $2.62 billion
              投后估值定价（按 Forge 轮次数据），这相当于约 83% 的折价。PremierAlts 引用的 2025 年 7 月估值为 $446.5 million。累计融资额存在争议：Tracxn 报告十二轮合计
              $426 million；Forbes 在 2021 年公告时称累计“成长资本”超过 $370 million；Forge 数据库显示总额 $1.15
              billion，该数字可能包含债务或其他未反映在股权轮总额中的工具。
