      - number: '7.5'
        title: 缓释措施、监控与否决条件
        blocks:
          - type: paragraph
            body: >-
              Zocdoc 并不是毫无准备地走进这些风险。公开材料显示，公司有一定合规姿态、安全姿态、真实集成策略，并持续围绕 AI
              和产品执行招聘。这些都是实在的缓释因素。问题在于，它们大多是流程信号，不是结果信号。公开证据仍看不到投诉队列、按投诉类型划分的服务方流失、逐州转介费用结构的法律放行，或达到管理层质量的隐私和安全事故台账。因此，对最高风险的缓释成熟度最多应按中等处理，不能当作风险已经关闭的证明。


              实用的否决条件很直接。如果尽调发现账单争议在经济上有实质影响、投诉密集专科贡献了不成比例的预约、管理层缺少当前患者中介或费用分成备忘录，或事故历史比公开记录显示的更差，风险调整后的投资逻辑会快速变弱。同样，如果融资或二级市场重置先于披露质量改善出现，投资人应假设估值更多靠叙事而非承销级证据支撑。下一轮尽调应聚焦投诉队列、法律备忘录、集中度表、事故历史和合作伙伴依赖图谱，而不是又一个顶线增长故事。
