      - number: '1.5'
        title: 里程碑时间线与负面事件
        blocks:
          - type: paragraph
            body: >
              Zocdoc 十八年历史可分为几个清晰阶段：创立与早期增长（2007-2012）、订阅模式承压与领导层危机（2013-2017）、转向按预约收费并恢复增长（2018-2021），以及 AI 驱动扩张（2022
              至今）。创始团队在 2007 年 7 月注册公司后，于 2008 年商业化推出平台。约 2012-2013 年采用的订阅定价模型造成结构性问题，到 2015 年拖停增长，并促使董事会解除 Massoumi 的
              CEO 职务。Kharraz 随后的按预约收费转向是一场从 2018 年真正启动、持续多年的努力，期间遭遇纽约市医疗服务方的强烈抵制，包括围绕定价变化的诉讼，也需要逐市场铺开。


              负面事件包括 CEO 继任争议：Massoumi 被免职后以欺诈为由起诉 Zocdoc；Inc. 文章称该诉讼据报在 2024 年被驳回。Trustpilot 和 BBB 对患者体验的评价总体正面，但
              TrustRadius 上有服务方负面评价，指称不道德计费做法——具体包括因错误专科转诊、以及未建立就医关系的患者而被收费。这些投诉强化了按预约收费模式内在的结构性张力：所谓“新患者”的归因本身存在争议。2021
              年融资以来，公司推进了多项产品和合作：2022 年 7 月的 Zocdoc for Developers API、2023 年的 Integration Partner Program、2025 年 5 月的
              Zo AI 电话助手、2025 年 6 月与 Blue Shield of California 的付费方合作，以及 2025 年 7 月的 Patient Choice 服务方质量项目。2025 年，公司还推出
              Yelp 集成，使用户可直接从 Yelp 商家页面预约。收入数据自 2020 年后未再公开披露；公司在 2021 年称已实现盈利。
