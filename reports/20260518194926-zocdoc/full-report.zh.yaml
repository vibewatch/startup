    layout: standard
    summary: 追踪 2015 年 Series D、2021 年 Series D-2 COI 与 2026 年二级市场这三个关键估值标记，展示相对 COI 峰值约 83% 的大幅下调。
    data:
      nodes:
        - id: series_d_2015
          label: 2015 年 Series D
