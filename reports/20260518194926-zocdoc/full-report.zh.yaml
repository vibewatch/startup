  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Zocdoc 不是药企或保险公司，但仍处在密集的医疗规则体系里。HHS HIPAA 指引和 HHS
              远程医疗指引明确说明，涉及受保护健康信息的医疗工作流即便通过数字方式协调，仍受隐私、安全和泄露通知义务约束。FTC 健康隐私指引把风险面进一步放大，因为消费者健康数据实践即使不落在最窄的 HIPAA
              框架内，也可能触发执法；FTC 已在 2023 年起诉过为广告共享敏感健康信息的公司。对一个价值主张依赖在大规模消费者漏斗中匹配患者、医疗服务方、保险和预约数据的平台来说，这一点很关键。


              转介经济性才是更锋利的法律边缘。OIG 培训材料称，旨在诱导联邦医保项目转介的报酬可能触及 Anti-Kickback Statute；Inc 则报道，Zocdoc
              从订阅定价转向按成功预约患者付费后，引发医生诉讼。即便 Zocdoc
              认为自身模式在商业上站得住，服务方争议、与转介挂钩的账单，以及邻近远程医疗的工作流叠在一起，说明法律风险并非假设。关键尽调问题是：管理层是否有当前逐州费用分成或患者中介分析，投诉模式是孤立摩擦，还是结构性争议收入模型的信号。
            claimRefs:
