      - number: '5.3'
        title: 安全、合规与信任控制
        blocks:
          - type: paragraph
            body: >-
              Zocdoc 的信任姿态既有较强表面信号，也有未补齐的证据缺口。公司设有专门的隐私和安全页面；对处理患者、医疗服务方、保险和沟通数据的医疗预约平台来说，这是最低限度的信任界面。第三方 SaaS 安全档案还列出
              HIPAA、PCI、SOC 2、GDPR、ISO 27001、FedRAMP 和 CSA STAR Level 1 声明，并支持 SSO
              和双因素认证；但该档案不能替代一手审计报告、签署证明或公开信任中心，因此尽调前只能把这些标签当作方向性信号。质量证据同样好坏参半。面向患者的证据很强：Apple 显示约 160,000 个评分、4.9
              星，独立评论也强调预约方便和保险网络内发现。面向服务方的证据较弱：TrustRadius 投诉提到错专科转介、定价挫败和日历同步故障导致重复预约。换句话说，消费者 UX
              看起来打磨充分，但运营信任层取决于准确的服务方数据、稳定的集成，以及不会疏远供给侧的服务方经济性。
