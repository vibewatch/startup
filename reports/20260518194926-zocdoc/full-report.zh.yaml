      - number: '5.2'
        title: AI、自动化与技术差异化
        blocks:
          - type: paragraph
            body: >-
              Zo 是观察 Zocdoc 当前技术策略最清晰的公开窗口。Zocdoc 2025 年 5
              月的工程文章并未把端到端预约权限交给模型，而是描述了一个混合系统：确定性的排班逻辑继续掌控流程，大语言模型层负责语音转写和意图分类。这个设计选择很关键：预约是高错误成本的交易型工作流，因此 Zocdoc 明确把
              AI 用作硬业务规则之上的交互层。对早期语音产品而言，公开性能披露有参考价值：Zo 到 2024 年 Q3 已随市场客户部署，可全天候接听电话，在无需员工介入的情况下解决最高 70%
              的预约来电，约四分钟完成预约、约两分半完成改期，并报告 CSAT 超过 80。配套运营模型也值得注意。Zocdoc 称护栏就是产品功能，发布门槛要求 100% eval 测试通过，公司还投入了广泛 AI
              培训。确定性核心、AI 语音层、运营培训和明确 eval 闸门组合在一起，比泛泛的“AI 助手”营销更可信。
