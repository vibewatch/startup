  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Zocdoc 本质上是一个美国医疗双边市场。一边是患者，通过 Zocdoc
              网页和移动端寻找保险网络内医生、比较可约时间并预约就诊；另一边是医疗服务方，向公司付费以获取患者并填充排班库存。公开分层在患者侧最丰富。应用商店和评论证据显示至少三类可重复消费者场景：寻找紧急或当日预约的人、受保险约束并希望留在网络内的患者，以及心理健康等专科用户，他们可能受益于数字或远程医疗可用性。供给侧分层更多靠推断，但仍可见：独立诊所和专科医生构成变现基础，而连接
              EHR 的临床医生，尤其是 Elation 的 24,000+ 独立初级保健医生，代表进入碎片化 SMB 服务方市场的导入渠道。地理覆盖看起来更偏全国而非本地：第三方追踪提到超过 2,000 个城市，平台覆盖
              18,000+ 保险计划，也说明全国支付方筛选深度。主要缺口在于分层经济性：Zocdoc 没有公开按专科、地理或诊所规模拆分预约、收入或留存。
