            title: 已发布估值标记严重冲突
            body: >-
              三个相互矛盾的估值标记——$1.8 billion（过时的 2015 年）、$2.62 billion（2021 年 COI）和 $446 million（2026 年二级市场）——造成重大不确定性。高低标记近
              6× 的差距反映的是缺少财务披露，而不是真正的分析分歧。任何未提示二级市场限制、却依赖 $1.8 billion 或 $2.62 billion 数字的分析，都具有实质误导性。
