      - number: '7.4'
        title: 合作伙伴、市场与执行风险
        blocks:
          - type: paragraph
            body: >-
              Zocdoc 的增长依赖它无法完全控制的交易对手。Healthcare IT News 报道其与 EHR 和诊所管理系统供应商建立集成合作伙伴计划，HIT Consultant 报道其与 Yelp
              预约集成，说明上游工作流连接和下游流量获取都依赖第三方。同时，LinkedIn 招聘和 Built In 档案显示，公司仍需要稀缺的 AI
              和工程人才，才能让自动化、集成和平台质量规模化跑起来。正常情况下，这些依赖可管理；但多个问题叠加时会变脆弱——合作伙伴宕机、支持债务、人才流失或分发变化，都可能在管理层来得及反应前打击预约。


              竞争也限制了修复选项。Headway 和 Solv 显示，聚焦预约或医疗触达的竞争者可以围绕更窄场景做专门化；Healthgrades、WebMD、Kyruus 和 Doximity
              则说明，消费者发现、企业触达编排和医生网络控制都是被争夺的层。Zocdoc
              面对的不是单一竞争者类别；它夹在广义目录、服务方工作流平台和专科触达工具之间。最大的执行未知数是集中度：公开证据没有清楚显示投诉、预约或收入是否按专科、地理或服务方队列集中。缺少这项披露，投资人无法判断可见摩擦只是可管理的长尾，还是更广泛市场疲劳的领先信号。
