summary:
  headline: Zocdoc 已有真实 marketplace 规模，按预约收费模型显著改善，AI 和合作伙伴扩张路径也可信；但财务严重不透明、服务方摩擦风险以及远低于历史独角兽叙事的当前估值信号，仍限制承销判断。
