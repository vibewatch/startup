schemaVersion: "report-v2"
artifact: financials
slug: zocdoc
runDate: "2026-05-18"
company:
  name: Zocdoc

chapter:
  number: 4
  title: Financials
  summary: >-
    Zocdoc operates a per-booking marketplace fee model ($30–$140 per new patient appointment) after a 2018 pivot away from
    a failed flat subscription, and the CEO publicly claimed profitability by February 2021. No revenue figures have been
    disclosed since 2020; secondary-market data and analyst marks imply a valuation far below the legacy $1.8 B database
    figure, pointing to a company that may be operationally self-sustaining at modest scale but faces significant
    diligence gaps around actual revenue, burn, and capital structure.

sections:
  - id: revenue-model
    title: Revenue Model and Pricing Architecture
    body: >-
      Zocdoc's primary revenue stream is a performance-based per-booking fee charged to healthcare providers for each new
      patient appointment booked through the marketplace. The company publicly charges $30 to $140 per new patient booking,
      with the exact fee varying by specialty, market, and procedure type. A provider generating 215 new patient bookings
      per year could owe up to $30,100 annually. This model replaced a flat annual subscription of $3,000 per provider
      that was in place from roughly 2012 to 2018. The subscription era was characterized by deeply unequal value delivery:
      high-demand urban specialists received thousands of bookings for the same price a rural low-volume practitioner paid
      for ten. CEO Oliver Kharraz acknowledged this directly in 2022, stating the company had "stopped growing, were losing
      money on every sale, and were creating negative perceptions among doctors." The per-booking model aligns revenue to
      actual value delivered, eliminating the negative-unit-economics trap of the subscription era. The rollout began in
      2018, was contested by some New York City physicians who filed lawsuits, but was eventually completed. The model
      generates variable, demand-correlated revenue that scales with both supply-side growth (more providers, more
      specialties) and demand-side growth (more patient sessions). Zocdoc does not charge patients; the marketplace is
      free-to-use for the consumer side. Pricing transparency on the provider side remains limited: the $30–$140 range
      is from CEO statements; actual realized average booking fees and any volume discounts are not publicly disclosed.
    claimRefs: [CI001, CI002, CI003, CI023, CI024, CI025, CI026, CI027, CI040]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]

  - id: zo-ai-revenue
    title: Zo AI Agent and Expanded Revenue Lines
    body: >-
      Beyond the core marketplace booking fee, Zocdoc launched Zo, an AI-powered phone agent for scheduling, in Q1 2025
      after a pilot period beginning Q3 2024 with existing marketplace customers. Zo is priced at $2 per successfully
      booked appointment with no upfront fees, implementation costs, or long-term contracts, making it accessible to
      practices that are not Zocdoc Marketplace customers. Enterprise pricing at scale involves discounted per-booking
      rates. Early performance data from Q1 2025 shows Zo resolves up to 70% of scheduling calls without human
      intervention, with an average call resolution time of under 3 minutes and 30 seconds. Zo is built using a
      deterministic-first AI architecture in which large language models handle speech-to-structured-data translation while
      deterministic code enforces scheduling policies, eligibility checks, and calendar source-of-truth verification. The
      launch positions Zocdoc to capture scheduling revenue from providers who rely on phone-based booking rather than
      online marketplace channels—an estimated large addressable volume given that many patients still schedule via phone.
      The Zo revenue stream could diversify Zocdoc's income from purely marketplace-dependent booking fees toward a
      software-services model, though total Zo revenue contribution is undisclosed. Zocdoc also earns indirect platform
      value through its Integration Partner Program, launched in mid-2023, which tiers EHR and PMS vendors into Basic,
      Complete, and Advanced partnership levels. Advanced integration partners receive full feature access and product
      improvements, deepening their distribution relationship with Zocdoc, though direct monetization terms for the
      program are not publicly disclosed.
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI031, CI032, CI035]
    tableRefs: [TI006]

  - id: unit-economics
    title: Unit Economics and Platform Operating Metrics
    body: >-
      Zocdoc's marketplace economics are characterized by high gross margins typical of two-sided marketplace software
      businesses: the primary cost of revenue is infrastructure, platform operation, and payment processing, not physical
      goods or human service delivery. Gross margin figures are not publicly disclosed; however, marketplace platform
      businesses in healthcare technology typically operate at gross margins of 60–80% on booking fees, with customer
      acquisition cost for providers being the primary variable. The company's cost structure is dominated by sales and
      marketing (provider acquisition and retention), research and development (platform, AI, integrations), and general
      and administrative expenses. Physical capex is minimal given the purely software nature of the business.
      At the provider end, the unit economics of the per-booking model are theoretically favorable once a provider
      reaches sufficient booking volume: a dermatologist in an urban market generating 500+ bookings per year would pay
      $15,000–$70,000 but would receive patients with significant lifetime value. At the patient end, Zocdoc bears
      acquisition costs through SEO, paid media, and partnerships, and the marginal cost of serving an incremental patient
      booking is near-zero for the platform itself. Provider-side adverse signals exist: TrustPilot reviews and TrustRadius
      reviews cite cases where providers were charged for patient referrals that did not convert or were outside the
      provider's specialty, indicating dispute friction in the billing model. As of December 2024, Zocdoc employed
      approximately 646 people in its US entity per Tracxn data, while Yahoo Finance reports approximately 501 full-time
      employees as of May 2026—a meaningful discrepancy that may reflect recent headcount reductions or reporting
      methodology differences. The India engineering subsidiary employed an unspecified number and reported $7.14M in
      revenue for FY March 2025 per Tracxn MCA filing data.
    claimRefs: [CI018, CI019, CI020, CI021, CI022, CI033, CI034, CI037, CI015]
    tableRefs: [TI003]
    figureRefs: [FI002]

  - id: capital-structure
    title: Capital Structure, Financing, and Runway
    body: >-
      Zocdoc has raised a total of approximately $370–426 million in disclosed equity and growth financing across its
      history, culminating in a $150 million growth financing from Francisco Partners in February 2021. The CEO's statement
      accompanying that round—"today, Zocdoc is the rarest type of private technology company: we are profitable with
      accelerating growth"—is the most recent public financial characterization of the business, and it has not been
      updated with quantified performance data since. The 2021 round was described as "growth financing" (not a traditional
      venture equity round), suggesting possible hybrid debt/credit structure consistent with Francisco Partners' credit
      and structured solutions team's involvement. No public equity or debt financing has been announced since February
      2021, a period of approximately five years through May 2026. The absence of new funding could indicate (a) the
      company is genuinely cash-flow positive and self-sustaining, (b) it has been unable to raise at an acceptable
      valuation, or (c) some combination. Cash on hand, monthly burn, and runway are not publicly disclosed. The US entity
      has CIK 0001417902 with the SEC and filed Form D exemptions for equity offerings through 2015; the absence of more
      recent Form D filings suggests either no equity raises since 2015 or structuring through non-Form-D channels (e.g.,
      credit facilities). Forge's capitalization data based on COI filings shows the 2021 Series D-2 round implying a
      post-money valuation of $2.62B based on $100M of equity at $29.29 per share—significantly above both the 2015
      $1.8B mark and the current secondary-market-implied $446M. Capital intensity going forward remains low relative to
      manufacturing or healthcare services businesses, with expected investment primarily in AI product development,
      provider sales, and payer partnerships.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014, CI016, CI017, CI036, CI038, CI039]
    tableRefs: [TI004]
    figureRefs: [FI003]

  - id: financial-gaps
    title: Financial Gaps and Diligence Verdict
    body: >-
      Zocdoc's financial profile is materially opaque for a company of its scale. No revenue, EBITDA, burn rate, or gross
      margin figures have been publicly disclosed since approximately 2020, and the $7.14M India subsidiary revenue is not
      indicative of the US business. The only financial claim in the public domain is the CEO's February 2021 profitability
      statement; whether that profitability has been maintained through 2025–2026 is unknown. Secondary-market valuation
      signals (Forge, PremierAlts both implying approximately $446M in 2025–2026) imply the market does not credit the
      legacy $1.8B or COI-implied $2.62B valuation, and represent an approximately 83% markdown from the 2021 COI mark.
      Several critical diligence gaps must be addressed before investment conviction is possible: actual revenue trajectory
      and growth rate, gross margin on the per-booking model, operating cost structure, debt terms of the 2021 Francisco
      Partners financing, headcount trajectory, and whether the profitability claim has been sustained. The adverse
      provider billing complaints on TrustPilot and TrustRadius indicate ongoing dispute dynamics that could create
      revenue recognition and churn risk if provider relationships deteriorate at scale. The integration partner program
      and Zo launch represent revenue diversification opportunities that are structurally positive but financially
      unquantified.
    claimRefs: [CI012, CI028, CI029, CI030]
    tableRefs: [TI005]

