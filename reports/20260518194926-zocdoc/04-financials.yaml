figures:
  - id: FI001
    title: Zocdoc Revenue Model Flow
    type: flow
    layout: standard
    summary: Patient books via Zocdoc; provider pays per new patient booking; platform captures fee net of platform costs.
    data:
      nodes:
        - id: patient
          label: "Patient (free)"
          description: "Searches Zocdoc by specialty, location, insurance; books appointment online or via app"
        - id: marketplace
          label: "Zocdoc Marketplace"
          description: "Matches patient to in-network provider; confirms real-time availability; processes booking"
        - id: provider
          label: "Healthcare Provider"
          description: "Pays $30–$140 per new patient booking; receives confirmed appointment; integrates via EHR calendar"
        - id: booking_fee
          label: "Booking Fee Revenue"
          description: "$30–$140/new patient; variable by specialty and market; no fee for returning patients"
        - id: zo_channel
          label: "Zo AI Phone Channel"
          description: "$2/successfully booked call; resolves 70% of calls without staff; launched Q1 2025"
        - id: gross_profit
          label: "Platform Gross Profit"
          description: "Booking fee minus hosting, payment processing, support; estimated 60–75% GM (marketplace comp)"
    approximationNotes: "Gross margin is a marketplace software benchmark estimate; Zocdoc has not disclosed actual gross margins."
    claimRefs: [CI001, CI004, CI037, CI040]

  - id: FI002
    title: Unit Economics Bridge (Provider Perspective)
    type: flow
    layout: standard
    summary: Provider CAC, booking volume, and fee range determine whether Zocdoc's per-booking model is value-accretive for a given practice.
    data:
      nodes:
        - id: provider_onboarding
          label: "Provider Onboarding"
          description: "Integration via EHR calendar (175+ integrations); setup is free; no subscription commitment"
        - id: patient_acquisition
          label: "Patient Discovery"
          description: "Millions of patient sessions/month; patients see real-time availability; typical booking within 24–72h"
        - id: booking_event
          label: "New Patient Booking"
          description: "Provider charged $30–$140 per new patient; returned patients are free"
        - id: provider_value
          label: "Provider Revenue Value"
          description: "Avg primary care visit ~$150–$300; specialist visit $200–$600; LTV >> single booking fee for retained patients"
        - id: dispute_risk
          label: "Billing Dispute Risk"
          description: "Adverse: some providers charged for wrong-specialty referrals or no-shows; TrustPilot/TrustRadius adverse reviews"
        - id: churn_decision
          label: "Provider Churn Decision"
          description: "Providers with low booking volume or billing disputes may leave; urban high-volume practices retain well"
    approximationNotes: "Provider revenue value is a benchmark estimate from published CMS fee schedules; actual patient LTV for Zocdoc providers is undisclosed."
    claimRefs: [CI001, CI003, CI030, CI033, CI034]

  - id: FI003
    title: Zocdoc Financial Parameter Ranges
    type: range
    layout: standard
    summary: Source-backed ranges for key financial parameters; wide confidence intervals reflect private company opacity.
    data:
      items:
        - label: "Estimated Annual Revenue (USD M)"
          low: 80
          mid: 150
          high: 250
          unit: "$M"
          note: "Analyst estimates only; no company disclosure. Based on ~100K providers × avg ~$1K-$2.5K annual fee. Sacra/Contrary estimates not accessible behind paywalls."
        - label: "Post-Money Valuation Implied (USD M)"
          low: 446
          mid: 800
          high: 2620
          unit: "$M"
          note: "Low = Forge/PremierAlts secondary market May 2026 ($446M). Mid = speculative analyst midpoint. High = Forge COI-implied 2021 Series D-2 ($2.62B)."
        - label: "Estimated Provider Headcount"
          low: 100000
          mid: 100000
          high: 100000
          unit: "providers"
          note: "Company states 100,000+ providers; this is an exact claim not a range."
        - label: "Employee Count (full-time)"
          low: 501
          mid: 573
          high: 646
          unit: "FTEs"
          note: "Low = Yahoo Finance (501 FTEs, May 2026). High = Tracxn US entity (646, Dec 2024). Mid = midpoint."
    approximationNotes: >-
      Revenue range is speculative analyst estimation from market structure; Zocdoc has not disclosed revenue since 2020.
      Valuation range reflects conflicting secondary-market ($446M), speculative mid, and COI-based ($2.62B) marks.
    claimRefs: [CI013, CI014, CI018, CI019, CI022]

callouts:
  - calloutType: strength
    title: Per-Booking Model Alignment
    body: >-
      The pivot from flat subscription to per-booking fee in 2018 eliminated the negative-unit-economics trap of the
      subscription era. The current model generates revenue proportional to value delivered, which CEO Kharraz credits
      for achieving profitability and accelerating growth by 2021.
    claimRefs: [CI001, CI002, CI009, CI023]

  - calloutType: risk
    title: Significant Financial Opacity
    body: >-
      No revenue figures have been publicly disclosed since approximately 2020. Secondary-market valuation signals imply
      a valuation approximately 83% below the 2021 COI mark, raising questions about revenue trajectory and whether
      profitability has been sustained through 2025–2026. Investors must treat any financial model as speculative without
      private data access.
    claimRefs: [CI012, CI036, CI038]

  - calloutType: risk
    title: Adverse Provider Billing Complaints
    body: >-
      TrustPilot and TrustRadius reviews from providers indicate recurring billing disputes: charges for
      wrong-specialty referrals, no-show patients, and unilateral price increases. These adverse signals suggest
      friction in the provider relationship that could elevate churn and constrain net revenue retention.
    claimRefs: [CI033, CI034]

  - calloutType: assumption
    title: Profitability Claim Not Independently Verified
    body: >-
      The company's last public financial characterization was CEO Oliver Kharraz's February 2021 statement of
      profitability. This claim has not been independently verified or updated with quantified metrics. The absence of
      new funding over five years is consistent with—but does not confirm—continued profitability.
    claimRefs: [CI009, CI038]

