- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Integration partner program
    - Supply growth depends on EHR and practice-management partners
    - Positive for onboarding efficiency; negative if key integrations stall or terminate
    - Request bookings and retention split between integrated and non-integrated providers
  - - Yelp booking channel
    - Demand acquisition may become reliant on one large discovery partner
    - Positive top-of-funnel reach; potential CAC or dependency risk
    - Request Yelp-sourced traffic, booking conversion, and economic terms
  - - Insurance-plan breadth
    - Breadth may hide concentration in a handful of plans or states
    - Positive conversion driver for consumers searching in-network care
    - Request booking mix by payer, state, and specialty
  - - Mental-health and telehealth category depth
    - Specialty growth could concentrate activity in a few remote-friendly categories
    - Positive repeat-use and category-expansion vector
    - Request booking growth and repeat rates for mental-health providers
  - - Provider lead-quality dissatisfaction
    - Poor-fit referrals, cancellations, or billing disputes can trigger provider churn
    - High renewal risk if monetization does not track real patient value
    - Request provider churn by complaint cohort and cancellation-adjusted ROI
  - - Missing concentration disclosure
    - No top-provider, top-channel, or top-geography revenue table is public
    - High underwriting uncertainty around hidden dependency
    - Request top-10 providers, channels, states, and specialties by bookings and revenue
  notes: Expansion logic is visible in partnerships and category breadth, but concentration is still largely an inference
    because Zocdoc does not publish revenue-ranked customer or channel tables.
