- id: TU003
  title: Named customer proof table
  enumerationScope:
    coverage: partial
    basis: Publicly visible named deployments and partner-linked cohorts found across marketplace listings, public-sector
      reporting, and integration announcements; this is not a full customer roster or revenue-ranked account list.
  columns:
  - Customer / cohort
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome
  - Limitation
  rows:
  - - City of Chicago
    - Public-sector vaccination campaign
    - COVID-19 vaccine scheduling workflow
    - Production
    - Forbes reported Zocdoc deployed a vaccine scheduler for the city
    - Pandemic deployment is real but not proof of recurring core marketplace revenue
  - - Elation clinician base
    - Independent primary-care providers
    - EHR-integrated appointment discovery and scheduling
    - Production
    - Healthcare IT News says Elation serves 24,000+ independent primary care clinicians tied to the integration program
    - Partner footprint is not equal to active Zocdoc bookings or paid-provider count
  - - Yelp health-search channel
    - Consumer acquisition and participating providers
    - Appointment booking from Yelp healthcare searches
    - Production
    - 2026 launch embeds booking into a channel with millions of weekly healthcare searches
    - Channel proof is fresh but does not disclose conversion or retention
  - - iOS patient cohort
    - Consumer patients
    - App-based provider discovery and booking
    - Production
    - 4.9-star rating base of roughly 160,000 ratings and millions of monthly users
    - Aggregate reviews are not a named enterprise account
  - - Trustpilot patient reviewer cohort
    - Consumer patients
    - Web booking and in-network search
    - Production
    - Reviews repeatedly praise easy booking and finding in-network doctors
    - Self-selected reviews do not provide transaction-weighted satisfaction data
  notes: Named customer proof is strongest for public-sector and partner-linked deployments plus very large consumer review
    cohorts. The full provider roster and top accounts remain private.
