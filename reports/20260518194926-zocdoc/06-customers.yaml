callouts:
- calloutType: strength
  title: Patient adoption proof is unusually visible for a healthcare marketplace
  body: 'Zocdoc has public customer evidence that many private healthcare marketplaces lack: millions of monthly patient users,
    a very large iOS review base, and fresh 2025-2026 partner launches that keep expanding the access surface.'
  claimRefs:
  - CU002
  - CU003
  - CU006
  - CU017
  - CU019
  - CU040
- calloutType: risk
  title: Provider-side complaints are the main durability warning
  body: TrustRadius and BBB surfaces repeatedly point to wrong-fit referrals, billing disputes, calendar synchronization issues,
    and cancellation pain. If those complaints map to lower provider renewal, patient growth may not translate cleanly into
    durable revenue.
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU016
  - CU031
- calloutType: insight
  title: Channels and integrations broaden reach but obscure concentration
  body: Yelp, app stores, and EHR integrations clearly help Zocdoc widen both demand and supply, but public reporting still
    does not show how dependent bookings or revenue are on any one channel, geography, or specialty.
  claimRefs:
  - CU017
  - CU019
  - CU034
  - CU035
  - CU036
  - CU039
