- id: adoption-trajectory-and-scale
  title: Adoption Trajectory and Scale
  body: 'Public adoption proof is materially stronger than a typical early-stage digital health startup. Zocdoc''s iOS listing
    says millions of patients use the service each month, Bitscale estimates more than 6 million monthly users across 2,000+
    cities, and the iOS app shows a 4.9-star rating from about 160,000 ratings. Google Play adds another scale signal: the
    marketplace supports 18,000+ insurance plans, which matters because insurance matching is a central conversion driver
    in U.S. care search. On the supply side, Zocdoc''s integration partner program says nearly 100,000 providers are connected
    to the platform, while the Elation integration opens a large pool of independent primary care clinicians. Fresh 2025-2026
    channel launches show the adoption engine is still expanding: the Yelp partnership inserts booking into millions of weekly
    health-related searches, while the Zo AI phone assistant broadens the patient access surface beyond web search and app
    flows. Historical proof also matters. Forbes reported that Zocdoc powered a City of Chicago COVID vaccine scheduler, demonstrating
    that the product can run in a named, production public-sector deployment rather than only in private-practice acquisition
    use cases.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
