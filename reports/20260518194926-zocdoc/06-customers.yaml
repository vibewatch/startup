  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table coverage
    missingEvidence: A revenue-ranked list of top provider groups, enterprise partners, and public-sector deployments by bookings
      or revenue contribution.
    whyItMatters: The visible proof set is credible but partial, so investors cannot tell whether City of Chicago, Yelp, or
      Elation are representative of the most important accounts.
    diligencePath: Request the top 20 provider groups and top 10 channel partners by bookings, revenue, and renewal status,
      with production-vs-pilot flags.
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention / repeat usage / satisfaction table
    missingEvidence: Provider GRR, NRR, churn, contract length, repeat-booker cohorts, and cancellation-adjusted provider
      ROI by segment.
    whyItMatters: Positive patient reviews do not prove durable monetization if provider lead quality or renewal performance
      is weak.
    diligencePath: Request provider renewal cohorts split by specialty, integrated vs non-integrated practices, and gross
      dollar retention after refunds or disputed leads.
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: expansion and concentration risk table
    missingEvidence: Top-channel, top-geography, and top-provider concentration metrics plus renewal calendars for the largest
      accounts.
    whyItMatters: A large provider count does not rule out hidden dependence on a small number of specialties, markets, or
      demand channels.
    diligencePath: Request top-10 states, specialties, providers, and partner channels by bookings and revenue, including
      growth and churn over the last 24 months.
    relatedTableRefs:
    - TU005
