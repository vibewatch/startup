  - FU003
- id: retention-expansion-and-concentration-risk
  title: Retention, Expansion, and Concentration Risk
  body: 'Durability is the soft spot in the public record. No visible source discloses Zocdoc''s NRR, GRR, provider churn,
    renewal rates, contract length, or cohort booking retention. The best public proxies are indirect: fresh app reviews,
    millions of monthly users, continuing partner launches, and a profitable 2025 profile suggest the platform still has commercial
    momentum; however, those signals are not substitutes for provider cohort data or repeat-booker curves. The 2018 business-model
    shift described by Summit Partners is instructive: Zocdoc had to move away from a pure subscription listing model after
    provider churn, implying that lead quality and monetization design are structurally important. Today''s expansion logic
    appears to rest on four levers: more provider integrations, broader insurance coverage, specialty growth such as mental
    health, and external demand channels like Yelp. Yet concentration risk remains hard to underwrite. A network approaching
    100,000 providers argues against single-account dependence, but Zocdoc discloses no top-provider, top-channel, or top-geography
    revenue tables. Given persistent provider complaints about lead quality and billing, diligence should focus on provider
    renewal cohorts, cancellation economics, channel mix, and whether integrated practices retain better than non-integrated
    cohorts.'
