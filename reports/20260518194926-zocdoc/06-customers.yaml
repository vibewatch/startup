slug: zocdoc
runDate: '2026-05-18'
company:
  name: Zocdoc
chapter:
  number: 6
  title: Customers
  summary: 'Zocdoc shows strong, current patient adoption proof: public sources say millions of patients use the platform
    each month, the iOS app carries a 4.9-star rating from roughly 160,000 ratings, and the marketplace appears to span more
    than 18,000 insurance plans and nearly 100,000 providers. Named production proof exists but is partial, concentrated in
    examples such as the City of Chicago vaccine scheduler, Elation-enabled clinicians, and the 2026 Yelp booking partnership.
    The weakest area is durability: no public NRR, GRR, or provider-renewal cohort data was found, while provider reviews
    surface billing, lead-quality, and cancellation friction.'
sections:
- id: customer-base-and-segmentation
  title: Customer Base and Segmentation
  body: 'Zocdoc is fundamentally a two-sided U.S. healthcare marketplace. On one side are patients who use Zocdoc''s web and
    mobile surfaces to find in-network clinicians, compare availability, and book visits; on the other are providers who pay
    the company to acquire patients and fill schedule inventory. Public segmentation is richest on the patient side. App-store
    and review evidence shows at least three repeatable consumer use cases: urgent or same-day appointment seekers, insurance-constrained
    patients trying to stay in network, and specialty users such as mental-health patients who may benefit from digital or
    remote care availability. Supply-side segmentation is more inferred but still visible: independent practices and specialists
    form the monetized base, while EHR-connected clinicians, especially Elation''s 24,000+ independent primary care clinicians,
    represent an onboarding channel into the fragmented SMB provider market. Geography appears broad rather than local: third-party
    tracking cites more than 2,000 cities, and the platform''s 18,000+ insurance-plan coverage suggests national payer-filter
    depth. The main missing piece is economics by segment: Zocdoc does not publicly break out bookings, revenue, or retention
    by specialty, geography, or practice size.'
  claimRefs:
