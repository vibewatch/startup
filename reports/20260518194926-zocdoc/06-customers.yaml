tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Patients seeking in-network primary or urgent care
    - Patient buyer/user; provider pays Zocdoc; insurer/public program pays medical claim
    - Find clinicians who take insurance and book quickly
    - Millions of patients monthly; 18,000+ insurance plans searchable
    - Largest demand pool and core brand promise
    - No booking or revenue split by visit type or payer mix
  - - Same-day / urgent-need patients
    - Patient buyer/user; provider pays Zocdoc
    - Book appointments within days or same day
    - App reviews repeatedly cite same-day wins
    - High-intent demand likely improves conversion for open schedule inventory
    - Same-day share of bookings is not disclosed
  - - Mental-health therapy seekers
    - Patient buyer/user; provider pays Zocdoc
    - Find therapists, psychiatrists, and remote mental-health visits
    - Mental-health discovery appears on review surfaces and category commentary
    - Could drive repeat usage and specialist category depth
    - No public mental-health booking count or repeat rate
  - - Independent practices and specialists
    - Practice owner/admin buyer; clinician user; provider payer
    - Acquire new patients and fill calendars
    - Nearly 100,000 providers in integration program scope
    - Core monetized supply base for the marketplace
    - Provider ROI, churn, and contract terms are undisclosed
  - - EHR-integrated primary-care clinicians
    - Practice/EHR admin buyer; clinicians and front desk users; provider payer
    - Sync schedules and reduce workflow friction through partners such as Elation
    - Elation serves 24,000+ independent primary care clinicians
    - Important onboarding and retention wedge into fragmented SMB supply
    - Integrated clinicians are not the same as active Zocdoc customers
  - - Demand and discovery partners
    - Partner/channel operator influences demand; patient user; provider payer
    - Drive discovery and booking handoff through Yelp and app stores
    - Millions of weekly Yelp healthcare searches plus large app-store review base
    - Can widen acquisition funnel without direct field sales
    - Economics, attribution, and channel dependence are undisclosed
  notes: Segmentation is strongest on the consumer side and more inferred on the provider side. Zocdoc does not publicly disclose
    bookings, ARR, or retention by segment, geography, or specialty.
