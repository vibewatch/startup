company:
  name: Zocdoc
chapter:
  number: 1
  title: Company Overview
  summary: >
    Zocdoc is a New York City-based healthcare marketplace founded in 2007 by Oliver Kharraz, Cyrus Massoumi,
    and Nick Ganju that connects millions of patients monthly with approximately 100,000 providers across 250+
    specialties. After a near-fatal subscription-model crisis in 2015, CEO Oliver Kharraz pivoted to a
    per-booking model starting in 2018, reaching profitability by 2021 when Francisco Partners invested $150M.
    Secondary-market data as of May 2026 implies a valuation of roughly $446M—a sharp discount from the 2021
    implied peak—with no new funding raised since, and revenue undisclosed since 2020.

sections:
  - id: identity-business-model
    title: Identity and Business Model
    body: >
      Zocdoc, Inc. is a private healthcare technology company headquartered at 568 Broadway, 9th Floor,
      New York, NY 10012, with a secondary engineering office in Pune, Maharashtra, India. The company was
      incorporated in the United States on July 2, 2007 (CIN 260971827), with the Indian subsidiary
      ZOCDOC ONLINE HEALTH MANAGEMENT INDIA PRIVATE LIMITED incorporated on May 29, 2013. Zocdoc operates
      as a two-sided healthcare marketplace: patients search for in-network providers by specialty,
      insurance plan, and location, view real-time availability, and book appointments instantly at no
      charge. Providers—ranging from solo practitioners to large health systems—pay a per-booking fee
      when new patients are acquired through the platform.


      The current pricing model charges providers approximately $30 to $140 per new patient booking
      depending on specialty and market, a structure introduced starting in 2018 after the company
      abandoned its original flat-fee annual subscription of roughly $3,000 per provider. That original
      model created severe value-capture inequities: high-demand urban specialists received thousands of
      new patients for the same annual fee as low-demand rural practitioners who could barely break even,
      leading to provider churn, stalled growth, and losses on every sale. Kharraz described the
      subscription model as one that "nearly killed the business." The per-booking pivot, fully rolled out
      by approximately 2020, realigned provider economics with platform value and restored growth. The
      platform is free to patients, available via zocdoc.com and native iOS and Android apps, and
      accepting approximately 18,000 to 20,000 insurance plans. Security certifications include HIPAA,
      SOC 2, PCI, GDPR, and ISO 27001 compliance per Nudge Security's vendor profile.
