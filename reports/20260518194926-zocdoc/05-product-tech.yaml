- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Find an in-network doctor
    - Patient checks insurer directory, searches the web, and often calls offices to verify acceptance
    - Zocdoc filters providers by insurance, specialty, and availability in one flow
    - 18,000+ plans mapped into booking experience
    - Public evidence does not disclose match precision or denial/error rate by plan
  - - Book outside office hours
    - Patient leaves voicemail or waits on hold
    - Zo answers 24/7 and can replace legacy IVR / hold workflows
    - No hold time / first-ring answer per launch coverage
    - Success still depends on accurate schedule sync and office rules
  - - Reschedule an appointment
    - Patient calls office staff and waits for manual update
    - Zo handles rescheduling requests in voice workflow
    - Average reschedule time ~2.5 minutes
    - Public sources do not specify edge-case escalation rate
  - - Fill provider inventory
    - Practice staff manually publish or confirm open slots
    - Provider-side sync layer feeds Zocdoc marketplace with live availability
    - 175+ integrations expand supply capture
    - Provider complaints suggest reconciliation failures can create double-bookings
  - - Book from third-party discovery channel
    - User leaves discovery platform and restarts search elsewhere
    - Zocdoc powers booking inside Yelp business pages and Yelp Assistant AI
    - Reduces drop-off from off-platform discovery
    - 2026 rollout is still expanding beyond iOS
  - - Choose visit modality
    - Patient and provider negotiate in-person vs remote separately
    - Zocdoc can surface telehealth where offered
    - Telehealth reached 40% during COVID peak
    - Most patients still choose local doctors when offered telehealth choices
  notes: |-
    The measurable-benefit column uses only metrics disclosed publicly; where no operational KPI is public, the limitation column makes the missing denominator explicit.
