- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Patient channels (iOS, Android, web, Yelp embed)
    - Acquire demand and capture booking intent
    - Mobile app stores, web UX, Yelp distribution agreement
    - Inconsistent published inventory counts can weaken trust; partner-channel outages reduce conversion
  - - Provider / insurance data layer
    - Normalize provider attributes, specialties, insurance acceptance, and office details
    - Provider data ops teams, payer mappings, provider self-service updates
    - Wrong-specialty referrals or stale insurance mappings create failed bookings
  - - Calendar / EHR / PMS integration layer
    - Read and write appointment availability across provider systems
    - 175+ vendor integrations and partner program relationships
    - Sync drift or connector breakage can cause double-bookings or false availability
  - - Deterministic scheduling engine
    - Apply office rules, eligibility constraints, and transaction logic
    - Accurate provider rules and integration data
    - If rule coverage is incomplete, AI front-end cannot safely automate edge cases
  - - Zo speech + LLM translation layer
    - Convert phone conversations into intents and structured actions
    - Speech stack, model quality, eval gates, escalation paths
    - Hallucination or misclassification risk if deterministic boundaries are not enforced
  - - API / partner distribution layer
    - Expose booking capability to external channels
    - Developer API, Yelp integration, partner support operations
    - Partner dependence can raise support cost and concentrate incremental growth
  - - Trust + operations control plane
    - Privacy/security governance, AI support operations, and release quality controls
    - Official trust surfaces, SSO / 2FA, AI eval tests, provider data operations
    - Public certifications and incident history are not fully substantiated in primary documents
  notes: |-
    This table combines documented components with clearly labeled analyst inference where Zocdoc has not published a canonical architecture diagram. The risk column highlights where transactional healthcare scheduling is fragile in practice.
