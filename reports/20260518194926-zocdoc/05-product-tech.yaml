- id: trust-compliance
  title: Security, Compliance, and Trust Controls
  body: |-
    Zocdoc's trust posture has both strong surface signals and unresolved proof gaps. The company maintains dedicated privacy and security pages, which is the minimum expected trust surface for a healthcare scheduling platform handling patient, provider, insurance, and communication data. A third-party SaaS security profile further lists HIPAA, PCI, SOC 2, GDPR, ISO 27001, FedRAMP, and CSA STAR Level 1 claims plus support for SSO and two-factor authentication; however, that profile is not a substitute for primary audit reports, signed attestations, or a public trust center, so diligence should treat those labels as directional until verified. Quality proof is similarly mixed. Patient-facing evidence is strong: Apple shows a 4.9-star score from roughly 160,000 ratings, and independent reviews emphasize easy booking and in-network discovery. Provider-facing evidence is weaker: TrustRadius complaints cite wrong-specialty referrals, pricing frustration, and calendar-sync failures that cause double-bookings. In other words, consumer UX appears polished, but the operational trust layer depends on accurate provider data, stable integrations, and provider economics that do not alienate the supply side.
  claimRefs:
  - CE002
  - CE033
  - CE034
  - CE035
  - CE036
  - CE037
  - CE038
  - CE042
