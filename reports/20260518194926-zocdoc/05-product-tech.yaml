- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification / quality metric
  - Status
  - Scope
  - Gap
  rows:
  - - Official privacy page
    - Present
    - Explains company privacy posture and data handling disclosures
    - Public page exists, but detailed data-retention / deletion workflow evidence is limited in this chapter
  - - Official security page
    - Present
    - Signals security posture and trust surface for enterprise / consumer stakeholders
    - No public SOC 2 report, penetration-test summary, or uptime history linked here
  - - HIPAA / SOC 2 / ISO 27001 / FedRAMP / related labels on Nudge profile
    - Third-party profile claims
    - External signal that Zocdoc markets or is associated with multiple compliance frameworks
    - Treat as directional until primary attestations or audit reports are provided
  - - SSO and two-factor authentication
    - Third-party profile claims
    - Identity and access-control features for enterprise / staff security
    - Feature depth, admin controls, and coverage are not independently documented
  - - Apple App Store rating 4.9/5 from ~160K ratings
    - Strong positive quality proof
    - Consumer UX signal for self-service booking experience
    - Does not measure provider economics, sync reliability, or claim resolution
  - - Zo release gate requiring 100% eval pass
    - Explicit engineering control
    - AI quality control for shipped voice workflows
    - Eval coverage, benchmark design, and post-release monitoring are not public
  - - Provider complaint pattern on TrustRadius / BBB
    - Adverse signal present
    - Billing practices, referrals, and calendar-sync reliability
    - Need complaint-rate denominator and root-cause breakdown to assess severity
  notes: |-
    The table intentionally separates primary trust surfaces from third-party profile claims and user-reported quality signals. That prevents certification labels from being mistaken for fully verified audit evidence.
