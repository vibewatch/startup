tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset / product line
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Patient marketplace app + web
    - Patients
    - GA; mature consumer surface
    - Insurance-aware search, direct booking, and free-to-patient UX with very high app-store ratings
    - No public conversion, cancellation, or repeat-booking cohort disclosed
  - - Provider schedule + calendar sync layer
    - Practice staff / providers
    - GA; mission-critical operating layer
    - 175+ integrations with EHR, PMS, and calendars convert fragmented office inventory into bookable slots
    - Sync latency, reconciliation logic, and double-book root-cause data are not public
  - - Insurance matching and provider-data layer
    - Patients and practice staff
    - GA; core matching asset
    - 18,000+ insurance-plan mapping helps filter to in-network options before booking
    - Accuracy by payer / specialty / geography is not publicly benchmarked
  - - Zo AI phone assistant
    - Patients and front-desk teams
    - Piloted 2024; publicly launched 2025; scaling
    - 24/7 voice scheduling with deterministic-first transaction logic and measured automation outcomes
    - No public uptime SLA, false-action rate, or rollout penetration disclosed
  - - Partner/API booking surfaces
    - Distribution partners and product teams
    - Live and expanding
    - Developers API plus Yelp embed extend Zocdoc beyond owned channels
    - API adoption, partner economics, and downstream support burden are not public
  - - Telehealth visit option
    - Patients and providers
    - Mature but use-case-specific
    - Complements scheduling when providers offer remote visits; sticky in mental health
    - Current share of bookings by virtual vs in-person modality is not public
  notes: |-
    Rows focus on externally visible product lines and enabling assets that materially affect the customer workflow. Internal tooling, fraud, analytics, and revenue-operations systems are excluded because public evidence is insufficient to enumerate them cleanly.
