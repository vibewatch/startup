schemaVersion: "report-v2"
artifact: competitors
slug: zocdoc
runDate: "2026-05-18"
company:
  name: Zocdoc
chapter:
  number: 3
  title: Competitive Landscape
  summary: >
    Zocdoc competes in a multi-dimensional competitive space: consumer-facing doctor-discovery and booking
    platforms (Healthgrades, WebMD Doctor Directory, Yelp Health, Google health search), enterprise
    patient-access and scheduling platforms (Kyruus, NexHealth, Relatient), vertical mental-health
    marketplaces (Headway, Grow Therapy, Alma), and concierge or subscription primary care (One Medical,
    Forward). No single competitor matches Zocdoc's breadth across multi-specialty, insurance-verified,
    real-time consumer booking at national scale. Zocdoc's sharpest threats are: (1) zero-cost Google and
    Yelp health search features that disintermediate marketplace discovery; (2) Doximity's physician network
    dominance enabling deeper provider-side integration; and (3) vertical-specialist marketplaces (Headway)
    that capture high-value mental-health provider relationships. Adverse provider reviews indicate
    per-booking pricing friction, calendar sync failures, and disputed charges as structural vulnerability
    points that competitors can exploit.

sections:
  - id: competitive-landscape
    title: Competitive Landscape Overview
    body: >
      The digital healthcare scheduling and patient-access market lacks a single dominant platform and
      is instead fragmented across four structural competitor archetypes: (1) consumer-facing discovery
      directories (Healthgrades, WebMD, Vitals, US News Health), (2) platform aggregators with embedded
      booking or distribution (Google Health, Yelp Health), (3) enterprise provider-data and access
      platforms serving health systems and plans (Kyruus, NexHealth, Relatient, Luma Health), and
      (4) vertically-focused scheduling-plus-clinical-delivery hybrids (Headway, Grow Therapy, Teladoc,
      One Medical). Zocdoc occupies a distinct position as a consumer-first, multi-specialty, insurance-
      verified marketplace with direct real-time booking—a combination that no single identified competitor
      replicates exactly.

      Market-structure evidence: the provider-rating and directory space consolidates ratings from millions
      of physician profiles (WebMD has 3M+ physician profiles; Healthgrades claims 10M+ physician ratings),
      but these directories historically lacked real-time availability or insurance-filtering. Google's
      healthcare search and Yelp's health category generate enormous consumer intent traffic, making them
      structural substitutes for top-of-funnel discovery even when they route through to platforms
      like Zocdoc for booking. Tracxn data identifies 12 competitors to Zocdoc, with US-headquartered
      players including Healthgrades, NexHealth, and RealSelf.

      The Yelp distribution partnership Zocdoc signed in 2025 is a notable strategic shift: rather than
      competing with Yelp's top-of-funnel traffic, Zocdoc embeds booking directly into Yelp provider pages,
      converting a structural threat into a distribution channel. This transforms Yelp from a competitor
      into a partner but does not resolve the Google disintermediation risk.
    claimRefs: [CP001, CP002, CP003, CP004, CP005]
    tableRefs: [TP001]
    figureRefs: [FP001]

  - id: competitor-profiles
    title: Competitor Profiles and Scale
    body: >
      Healthgrades is the closest single-market analog to Zocdoc's consumer directory and booking model,
      serving over 300 million annual visits with 10M+ physician ratings and a growing real-time appointment
      booking feature. Unlike Zocdoc, Healthgrades monetizes through a mix of provider profile subscriptions,
      health system partnerships, and sponsored search placements, with limited per-booking revenue.
      Healthgrades was acquired by RVO Health (owned by Red Ventures and Optum) in 2022, giving it access
      to enterprise health system distribution and a significant data asset in consumer health intent.

      Doximity is the most formidable platform-layer competitor: its physician-first network with 85%+ of
      US physicians enables telehealth visits, secure messaging, and EHR integration at a scale Zocdoc does
      not match on the provider-relationship side. Doximity's telehealth module competes directly where
      Zocdoc facilitates virtual-visit booking, though Doximity is physician-focused rather than
      consumer-first.

      Kyruus Health is Zocdoc's primary enterprise competitor, serving over 1,400 hospitals and 550 medical
      groups through a B2B provider data management model. Kyruus does not operate a consumer marketplace;
      it provides health systems and plans with accurate provider directories and scheduling infrastructure.
      The key strategic risk: as health systems build more sophisticated digital front doors powered by
      Kyruus or Epic MyChart, they may reduce reliance on third-party marketplaces for new-patient acquisition.

      Headway exemplifies the vertical-specialist challenger: 70,000+ insured therapists and psychiatrists,
      growing faster in the highest-telehealth-penetration specialty. Its direct insurance credentialing
      eliminates the in-network search friction that makes Zocdoc valuable in other specialties.

      One Medical (Amazon) operates a concierge primary care subscription ($199/year or employer-sponsored)
      with same-day and next-day appointments—directly competing at the patient experience level even though
      its monetization model differs from per-booking fees.
    claimRefs: [CP006, CP007, CP008, CP009, CP010, CP011, CP012, CP013, CP014, CP015, CP016]
    tableRefs: [TP002]
    figureRefs: [FP002]

  - id: feature-capability-comparison
    title: Feature and Capability Comparison
    body: >
      Across the reviewed competitor set, Zocdoc leads on the combination of consumer-facing insurance
      verification depth (18,000+ plan coverage), multi-specialty breadth (250+), and direct real-time
      booking. Its closest peers match on individual dimensions but not their intersection: Healthgrades
      has comparable consumer traffic but lacks real-time insurance verification; Kyruus has superior
      provider data depth but no consumer marketplace; Headway has superior insurance credentialing in
      mental health but covers only one specialty cluster.

      Key feature gaps versus the competitive set include: Zocdoc lacks a physician-community network
      (Doximity's core moat), lacks a telehealth video-delivery module (One Medical, Teladoc), and lacks
      a subscription primary care relationship (One Medical, Forward). Its per-booking pricing model is
      cited in provider reviews as a principal cause of churn when booking conversion rates are low.

      AI differentiation: Zocdoc's Zo voice scheduling assistant resolves up to 70% of inbound calls
      without staff intervention; no reviewed competitor has announced an equivalent deployed AI phone
      scheduling agent at this resolution rate. Zo's technical architecture (built for dependability
      over exploration) gives Zocdoc a first-mover position in the phone channel that EHR-integrated
      competitors (Epic, Kyruus) have not yet replicated.

      On app-store quality, Zocdoc's iOS app carries a 4.9/5 rating with 160,000+ ratings and its Android
      app 4.8/5, indicating strong consumer execution relative to competitors where app ratings are harder
      to verify. Trustpilot and TrustRadius reviews for Zocdoc are split: positive reviews dominate patient
      experience; adverse reviews are concentrated among providers disputing billing, calendar sync failures,
      and charging for non-converting referrals.
    claimRefs: [CP017, CP018, CP019, CP020, CP021, CP022, CP023, CP024, CP025]
    tableRefs: [TP003]

  - id: moat-durability
    title: Moat Durability and Competitive Risk
    body: >
      Zocdoc's defensible moat elements are: (1) insurance-data depth—18,000+ plans with eligibility
      verification is operationally hard to replicate quickly; (2) provider network density in urban
      markets—100,000 providers across 250+ specialties with 175+ EHR calendar integrations is a
      structural integration cost barrier; (3) patient-side brand and trust—4.9/5 App Store rating
      and strong consumer NPS signal high patient satisfaction; and (4) distribution leverage through
      the Yelp and Google partnerships that route high-intent search traffic into Zocdoc bookings.

      Moat risks: (1) Google disintermediation—Google's direct booking panel in health search reduces
      the share of searches that route to Zocdoc's marketplace; (2) per-booking pricing model churn—
      providers who attribute high referral fees to low conversion rates may multi-home or defect to
      competing platforms with flat-fee or freemium models; (3) EHR-native patient scheduling (Epic
      MyChart, Athena) is increasingly available as a built-in feature and competes without per-booking
      fees; (4) TrustRadius shows a 1/10 provider score citing billing disputes, indicating potential
      provider-side attrition risk in medium-sized practices.

      Secondary market pricing context: Premier Alts reports Zocdoc's implied secondary market valuation
      at $446.5M as of July 2025, down from its 2015 peak of $1.8B. The Series D-2 round of $100M
      (July 2025) raised at a significant discount to the 2015 peak, suggesting investor recalibration
      of growth expectations. Forge price data shows $5.00/share as of May 2026 (not necessarily
      a trading price).

      Competitive entry barriers remain high in the insurance-data layer and consumer brand, but the
      enterprise-scheduling and AI-phone-channel layers are contested and will require sustained investment
      to defend. Headway, NexHealth, and Doximity are the three competitors most likely to win specific
      sub-segments at Zocdoc's expense over a 3–5 year horizon.
    claimRefs: [CP026, CP027, CP028, CP029, CP030, CP031, CP032, CP033, CP034, CP035, CP036, CP037]
    tableRefs: [TP004]
    figureRefs: [FP003]

