      - number: '5.1'
        title: Core Platform and Product Architecture
        blocks:
          - type: paragraph
            body: >-
              Zocdoc delivers healthcare access as a workflow product rather than a single app feature. On the patient
              side, the core job is: identify an in-network clinician, verify that the clinician matches the needed
              specialty, see real appointment inventory, and book or reschedule without calling an office. The mobile
              listings and consumer reviews show that this front-end experience is mature, free to patients, and broadly
              adopted, although Apple and Google disclosures disagree on the exact provider and specialty counts. On the
              supply side, Zocdoc's real moat is not just consumer traffic; it is the provider-inventory control plane
              built around 175+ calendar, EHR, and practice-management integrations plus insurance-plan mapping across
              18,000+ plans. That operating layer turns fragmented practice schedules into a searchable marketplace. The
              same scheduling substrate now powers partner channels such as Yelp and the earlier Zocdoc for Developers
              API, which means Zocdoc increasingly behaves like booking infrastructure as well as a marketplace. The
              biggest diligence gap in the core architecture is data integrity: public provider complaints show that if
              calendar sync or provider classification is wrong, the product promise fails at the exact moment of
              conversion.
