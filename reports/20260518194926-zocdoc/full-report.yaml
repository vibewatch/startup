          - type: callout
            title: Competitor Revenue and Growth Figures Are Largely Undisclosed
            body: >
              Most competitors in this space are private, and none of the reviewed sources disclose specific revenue,
              booking volume, or market share data for the digital scheduling sub-segment. Relative positioning
              assessments in this chapter are based on disclosed provider counts, consumer reviews, partner
              announcements, and publicly available product documentation. They should be treated as directional
              indicators pending access to private data in diligence.
