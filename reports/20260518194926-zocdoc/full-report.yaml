      - number: '1.4'
        title: Platform Scale, Technology, and Compliance
        blocks:
          - type: paragraph
            body: >
              Zocdoc's platform connects patients to approximately 100,000 providers across more than 250 specialties,
              accepting nearly 18,000 to 20,000 insurance plans as of 2025–2026. The company's Apple App Store listing
              reports that patients typically see a doctor within 24 to 72 hours of booking, and the app carries a 4.9
              out of 5 rating from more than 160,000 reviews. The Google Play listing similarly positions Zocdoc as
              connecting patients to "nearly 100,000 providers." Bitscale reports approximately 6 million monthly users
              across more than 2,000 US cities. Trustpilot summarizes consumer sentiment as "overwhelmingly positive,"
              with reviewers praising ease of booking, insurance matching, and same-day appointment availability.


              On the technology front, Zocdoc operates more than 175 EHR calendar integrations, enabling real-time
              scheduling for providers using third-party practice management software. In May 2025, Zocdoc launched Zo,
              an AI-powered phone assistant built on nearly two decades of scheduling data and deterministic rules-based
              orchestration. Early adopters report that Zo resolves approximately 70% of inbound scheduling calls
              without staff intervention, with an average call resolution under 3 minutes 30 seconds. Zo is priced at $2
              per successfully managed appointment with no upfront fees, and is now offered more broadly after an
              internal Q3 2024 pilot with existing marketplace customers. The Integration Partner Program (launched
              2023) establishes tiered partnerships with EHR vendors (Elation and DrChrono by EverHealth are Advanced
              Integration Partners), and Zocdoc powers scheduling through provider websites, Google Business Profiles,
              and insurance directories. Compliance certifications include HIPAA, SOC 2, PCI, GDPR, and ISO 27001.
            claimRefs:
