      - number: '4.2'
        title: Zo AI Agent and Expanded Revenue Lines
        blocks:
          - type: paragraph
            body: >-
              Beyond the core marketplace booking fee, Zocdoc launched Zo, an AI-powered phone agent for scheduling, in
              Q1 2025 after a pilot period beginning Q3 2024 with existing marketplace customers. Zo is priced at $2 per
              successfully booked appointment with no upfront fees, implementation costs, or long-term contracts, making
              it accessible to practices that are not Zocdoc Marketplace customers. Enterprise pricing at scale involves
              discounted per-booking rates. Early performance data from Q1 2025 shows Zo resolves up to 70% of
              scheduling calls without human intervention, with an average call resolution time of under 3 minutes and
              30 seconds. Zo is built using a deterministic-first AI architecture in which large language models handle
              speech-to-structured-data translation while deterministic code enforces scheduling policies, eligibility
              checks, and calendar source-of-truth verification. The launch positions Zocdoc to capture scheduling
              revenue from providers who rely on phone-based booking rather than online marketplace channels—an
              estimated large addressable volume given that many patients still schedule via phone. The Zo revenue
              stream could diversify Zocdoc's income from purely marketplace-dependent booking fees toward a
              software-services model, though total Zo revenue contribution is undisclosed. Zocdoc also earns indirect
              platform value through its Integration Partner Program, launched in mid-2023, which tiers EHR and PMS
              vendors into Basic, Complete, and Advanced partnership levels. Advanced integration partners receive full
              feature access and product improvements, deepening their distribution relationship with Zocdoc, though
              direct monetization terms for the program are not publicly disclosed.
