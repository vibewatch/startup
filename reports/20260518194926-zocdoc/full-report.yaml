  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >-
              Zocdoc is fundamentally a two-sided U.S. healthcare marketplace. On one side are patients who use Zocdoc's
              web and mobile surfaces to find in-network clinicians, compare availability, and book visits; on the other
              are providers who pay the company to acquire patients and fill schedule inventory. Public segmentation is
              richest on the patient side. App-store and review evidence shows at least three repeatable consumer use
              cases: urgent or same-day appointment seekers, insurance-constrained patients trying to stay in network,
              and specialty users such as mental-health patients who may benefit from digital or remote care
              availability. Supply-side segmentation is more inferred but still visible: independent practices and
              specialists form the monetized base, while EHR-connected clinicians, especially Elation's 24,000+
              independent primary care clinicians, represent an onboarding channel into the fragmented SMB provider
              market. Geography appears broad rather than local: third-party tracking cites more than 2,000 cities, and
              the platform's 18,000+ insurance-plan coverage suggests national payer-filter depth. The main missing
              piece is economics by segment: Zocdoc does not publicly break out bookings, revenue, or retention by
              specialty, geography, or practice size.
