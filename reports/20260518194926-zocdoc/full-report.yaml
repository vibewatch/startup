      - number: '7.4'
        title: Partner, Market, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Zocdoc’s growth depends on counterparties it does not fully control. Healthcare IT News reported an
              integration partner program with EHR and practice-management vendors, while HIT Consultant reported Yelp
              appointment booking integration, indicating that both upstream workflow connectivity and downstream
              traffic acquisition depend on third parties. At the same time, LinkedIn hiring and Built In’s profile
              suggest the company still needs scarce AI and engineering talent to make automation, integrations, and
              platform quality work at scale. Those dependencies are manageable in normal conditions but become fragile
              when several issues stack at once—partner outages, support debt, talent turnover, or distribution changes
              can all hit bookings before management has time to react.


              Competition also constrains recovery options. Headway and Solv show that focused booking or care-access
              competitors can specialize around narrower use cases, while Healthgrades, WebMD, Kyruus, and Doximity
              demonstrate that consumer discovery, enterprise access orchestration, and physician-network control are
              all contested layers. Zocdoc therefore does not just face one rival class; it sits between broad
              directories, provider-workflow platforms, and specialty access tools. The biggest execution unknown is
              concentration: public evidence does not clearly show whether complaints, bookings, or revenue are
              concentrated by specialty, geography, or provider cohort. Without that disclosure, investors cannot tell
              whether visible friction is a manageable tail or a leading signal of broader marketplace fatigue.
