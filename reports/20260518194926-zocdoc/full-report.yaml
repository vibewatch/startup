  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Valuation Evidence and Conflicting Marks
        blocks:
          - type: paragraph
            body: >-
              Three materially different valuation marks exist for Zocdoc as of May 2026, and they represent
              contradictory assessments rather than different methodologies applied to the same data. The first is the
              legacy $1.8 billion figure: this traces to Zocdoc's 2015 Series D led by Baillie Gifford, Fidelity, and
              LionTree (reportedly at $3.6B pre-money on $130M raised), and continues to appear in third-party database
              entries and media coverage without update. Inc.com's July 2025 profile titled "$1.8 Billion Business"
              perpetuates this as current when it is a decade-old mark. The second mark is the COI-implied $2.62 billion
              post-money from the February 2021 Series D-2: Forge Global, which sources from Certificate of
              Incorporation filings, shows $100M raised at $29.29 per share on a COI-computed post-money of $2.62
              billion. The third, and most market-current, mark is Forge's secondary-market price of $5.00 per share as
              of May 18, 2026, which implies approximately $446 million in total equity value. PremierAlts independently
              reported a $446.5 million valuation as of July 31, 2025. These three marks diverge by a factor of nearly
              6× from the low to the high. No single mark is definitively authoritative: the legacy $1.8B is clearly
              stale; the COI mark reflects a stated cap table value at the time of the 2021 round that has since been
              repriced by the secondary market; and the secondary market mark is based on illiquid over-the-counter
              transactions that may not reflect a control or strategic-buyer premium. The secondary-market-implied $446M
              is, however, the most recent price discovery available for a private company that has not disclosed
              audited financials publicly.
