      - number: '5.4'
        title: Roadmap, Deployment Model, and Strategic Dependencies
        blocks:
          - type: paragraph
            body: >-
              Zocdoc's roadmap is best understood as a gradual expansion from owned marketplace into infrastructure and
              automation layers. The company already shifted its business model in 2018 from an annual SaaS subscription
              to a platform model priced per booked patient, then added Zo with a separate pay-per-successful-booking
              structure and no upfront commitment. That pricing design lowers adoption friction but ties economics
              tightly to booking accuracy, call resolution quality, and partner-channel conversion. Public roadmap
              signals point toward outbound voice workflows, prescription refill coordination, multilingual support, and
              further expansion of Yelp distribution from iOS into Android and desktop. Meanwhile, CNBC's telehealth
              commentary suggests the company's long-term value remains anchored in local provider discovery and
              scheduling rather than a pure virtual-care thesis: telehealth surged during COVID, but most patients still
              choose doctors within driving distance when given options. The strategic dependencies are therefore clear:
              provider calendars and EHR connectors, insurance-plan data quality, partner distribution channels,
              AI-model reliability, and human operations teams in provider data and AI support. Any drift in those
              dependencies can show up quickly as double-bookings, poor referrals, or provider churn.
