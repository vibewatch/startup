      - number: '7.2'
        title: Operational and Technical Risk
        blocks:
          - type: paragraph
            body: >-
              The operational risk stack is visible in independent complaints more than in formal incident disclosures.
              TrustRadius, BBB complaints, Serchen, ComplaintsBoard, and Choosing Therapy all point to variations of the
              same problem: providers and patients say billing can feel unfair, insurance matching can be inaccurate,
              and bookings can fail or create support pain. None of those sources alone proves systemic failure, but
              together they show that the platform’s core workflow depends on data quality and dispute resolution that
              are hard to scale cleanly. In a marketplace, reliability failures do not just create refunds; they
              undermine provider trust and reduce the willingness of practices to treat Zocdoc demand as high-quality
              demand.


              The AI roadmap adds another layer. Zocdoc’s own tech blog says that real callers bring accents, background
              noise, interruptions, and prompt drift that do not show up in a sandbox, which is exactly the pattern
              investors should worry about in healthcare scheduling. Voice automation may improve staffing leverage, but
              if it misroutes patients, mishandles insurance context, or causes scheduling errors, the operational issue
              can quickly become a reputational and compliance issue. Zocdoc’s privacy and security pages signal
              mitigation intent, yet public sources do not provide a detailed incident history, error-rate disclosure,
              or control-test evidence that would justify treating mitigation maturity as high.
