              data. The funding trajectory shows several distinct phases: early venture (2007–2012, Series A–C,
              approximately $95 million total), growth equity (2015 Series D, $130 million at the $1.8 billion mark),
              and the 2021 growth financing ($150 million from Francisco Partners). The 2015–2021 gap (six years between
              equity rounds) is explained in part by the company's own public commentary: the subscription model created
              unit-economics losses that needed to be fixed before a new round was viable, and once fixed, the 2021
              profitability claim supported the Francisco Partners transaction. The five-year gap from 2021 to May 2026
              (no new public financing) is the most critical signal for current valuation analysis: if the company is
              truly cash-flow-positive, no new funding is needed and secondary market pricing reflects true equity
              sentiment absent an IPO catalyst. If the company is burning cash or has restrictive Francisco Partners
              covenants, the absence of funding reflects investor reluctance or covenant restrictions—not financial
              strength. The most recent SEC Form D filing on EDGAR is from August 2015 for the Series D, confirming no
              equity exemption filings since. The absence of a Form D for the 2021 Francisco Partners round is
              consistent with a credit facility or structured debt instrument not requiring Form D disclosure. Forge
              Global's COI data confirms a Series D-2 authorization at the 2021 date, but Zocdoc's own Form D record
              does not show it, further supporting a non-standard equity structure for that round.
            claimRefs:
