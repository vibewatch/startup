  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >
              Zocdoc operates within the digital patient-access and healthcare-appointment-scheduling segment of the
              broader US health-information technology market. The included spend encompasses patient-facing search and
              filtering of providers by specialty, insurance plan, location, and availability; real-time
              appointment-booking infrastructure (including EHR calendar integrations); insurance eligibility
              verification embedded at point of scheduling; and multi-channel distribution (marketplace, provider
              website, insurer directory, third-party search). Excluded categories include EHR workflow and clinical
              documentation software, telehealth video-delivery infrastructure, hospital billing and revenue-cycle
              management, remote patient monitoring hardware, and pharmacy or prescription platforms.

              Adjacent spend that overlaps but is not core includes: (1) health-system digital-front-door platforms
              (e.g., Kyruus, which provides provider data management to health systems and plans rather than a direct
              consumer marketplace), (2) telehealth subscription models where scheduling is ancillary to clinical
              delivery (e.g., One Medical, Teladoc), and (3) condition-specific mental-health marketplaces (e.g.,
              Headway, Grow Therapy) that occupy the scheduling–clinical delivery boundary. Status-quo substitutes
              remain powerful: most US outpatient appointments are still booked by phone, with up to 20% of calls to
              practices going unanswered and 34% of patients who cannot get through abandoning scheduling entirely.
              Self-service patient portals, walk-in visits, and referral-based scheduling round out the non-digital
              substitutes.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
