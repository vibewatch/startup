  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: Five-layer view of the Zocdoc product stack from trust controls through partner and patient interfaces.
    data:
      layers:
        - id: L1
          label: Trust / governance layer
          detail: Privacy and security pages, identity controls, AI eval gates, and provider-data / AI support operations
        - id: L2
          label: Data normalization layer
          detail: Provider attributes, specialties, insurance mappings, office details, and appointment inventory
        - id: L3
          label: Integration layer
          detail: 175+ calendar / EHR / PMS connections plus integration-partner program relationships
        - id: L4
          label: Scheduling intelligence layer
          detail: Deterministic booking logic, rules engine, and Zo speech / intent translation services
        - id: L5
          label: Channel layer
          detail: Zocdoc mobile apps, web marketplace, phone assistant Zo, Developers API, and Yelp embedded booking
    approximationNotes: >-
      Zocdoc has not published a canonical architecture diagram. Layering is inferred from product pages, integration
      announcements, and the Zo engineering write-up.
    claimRefs:
      - CE007
      - CE011
      - CE023
      - CE025
      - CE033
      - CE039
      - CE043
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: How patients move from discovery to booking or rescheduling across digital and phone-assisted entry points.
    data:
      nodes:
        - id: N1
          label: Need identified
          description: Patient needs a provider and often begins with specialty and insurance constraints
        - id: N2
          label: Discovery
          description: Patient searches Zocdoc app/web or discovers a provider through Yelp
        - id: N3
          label: Eligibility + availability match
          description: Zocdoc matches insurance, provider metadata, and live schedule inventory
        - id: N4
          label: Book online or by phone
          description: Patient self-books digitally or uses Zo for 24/7 phone scheduling
        - id: N5
          label: Confirmation / reschedule
          description: Appointment is confirmed or changed using synced calendars and office rules
        - id: N6
          label: Visit modality selected
          description: Patient ultimately attends in person or, where offered, by telehealth
      edges:
        - from: N1
          to: N2
          label: Search begins
        - from: N2
          to: N3
          label: Provider and plan filtered
        - from: N3
          to: N4
          label: Slot chosen
        - from: N4
          to: N5
          label: Booking transaction
        - from: N5
          to: N6
          label: Care delivered
    claimRefs:
      - CE005
      - CE006
      - CE012
      - CE018
      - CE021
      - CE032
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Zocdoc depends on accurate supply data, integrations, partner channels, and AI quality controls to turn demand
      into reliable bookings.
    data:
      nodes:
        - id: D1
          label: Provider data quality
          description: Specialties, insurance acceptance, office details, and practice policies must be correct
        - id: D2
          label: Calendar / EHR / PMS integrations
          description: 175+ connector estate that exposes and updates appointment inventory
        - id: D3
          label: Insurance-plan mapping
          description: Plan-level matching that powers in-network filtering
        - id: D4
          label: Zo model + speech stack
          description: Voice understanding layer wrapped around deterministic scheduling logic
        - id: D5
          label: Partner distribution channels
          description: Developers API and Yelp expand demand beyond owned Zocdoc surfaces
        - id: D6
          label: Human operations teams
          description: Provider data ops and AI support ops maintain edge-case quality and operational continuity
        - id: D7
          label: Reliable booking outcome
          description: 'The end-state users perceive: correct match, correct slot, and successful appointment'
      edges:
        - from: D1
          to: D7
          label: Bad metadata causes bad referrals
        - from: D2
          to: D7
          label: Sync failures cause double-bookings
        - from: D3
          to: D7
          label: Plan errors cause failed in-network promises
        - from: D4
          to: D7
          label: Misclassification creates failed phone automation
        - from: D5
          to: D7
          label: Channel outages reduce conversion
        - from: D6
          to: D7
          label: Ops teams catch exceptions and maintain quality
    approximationNotes: >-
      Dependency relationships are inferred from public product descriptions, partner announcements, review complaints,
      and hiring signals rather than an official reliability postmortem.
    claimRefs:
      - CE007
      - CE011
      - CE023
      - CE036
      - CE039
      - CE043
  - id: FE004
    title: Product maturity / capability map
    type: matrix
