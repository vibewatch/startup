      - number: '4.4'
        title: Capital Structure, Financing, and Runway
        blocks:
          - type: paragraph
            body: >-
              Zocdoc has raised a total of approximately $370–426 million in disclosed equity and growth financing
              across its history, culminating in a $150 million growth financing from Francisco Partners in February
              2021. The CEO's statement accompanying that round—"today, Zocdoc is the rarest type of private technology
              company: we are profitable with accelerating growth"—is the most recent public financial characterization
              of the business, and it has not been updated with quantified performance data since. The 2021 round was
              described as "growth financing" (not a traditional venture equity round), suggesting possible hybrid
              debt/credit structure consistent with Francisco Partners' credit and structured solutions team's
              involvement. No public equity or debt financing has been announced since February 2021, a period of
              approximately five years through May 2026. The absence of new funding could indicate (a) the company is
              genuinely cash-flow positive and self-sustaining, (b) it has been unable to raise at an acceptable
              valuation, or (c) some combination. Cash on hand, monthly burn, and runway are not publicly disclosed. The
              US entity has CIK 0001417902 with the SEC and filed Form D exemptions for equity offerings through 2015;
              the absence of more recent Form D filings suggests either no equity raises since 2015 or structuring
              through non-Form-D channels (e.g., credit facilities). Forge's capitalization data based on COI filings
              shows the 2021 Series D-2 round implying a post-money valuation of $2.62B based on $100M of equity at
              $29.29 per share—significantly above both the 2015 $1.8B mark and the current secondary-market-implied
              $446M. Capital intensity going forward remains low relative to manufacturing or healthcare services
              businesses, with expected investment primarily in AI product development, provider sales, and payer
