      - number: '1.5'
        title: Milestone Chronology and Adverse Events
        blocks:
          - type: paragraph
            body: >
              Zocdoc's eighteen-year history encompasses distinct phases: founding and early growth (2007–2012),
              subscription-model strain and leadership crisis (2013–2017), per-booking pivot and recovery (2018–2021),
              and AI-driven expansion (2022–present). The founding team launched the platform commercially in 2008 after
              the July 2007 incorporation. The subscription pricing model adopted around 2012–2013 created structural
              problems that halted growth by 2015 and led to the board removing Massoumi as CEO. Kharraz's subsequent
              pivot to per-booking pricing was a multi-year effort starting in earnest in 2018, involving substantial
              resistance from NYC providers—including lawsuits over the pricing change—and requiring market-by-market
              rollout.


              Adverse events include the CEO succession dispute: Massoumi sued Zocdoc alleging fraud following his
              removal; the Inc. article states the lawsuit was reportedly dismissed in 2024. Trustpilot and BBB reviews
              are broadly positive for the patient experience, but TrustRadius hosts adverse provider reviews alleging
              unethical billing practices—specifically, being charged for referrals to wrong specialties and for
              patients who did not establish care. These complaints reinforce the structural tension inherent in a
              per-booking model where attribution of "new patient" is contested. Since the 2021 funding, the company has
              made several product and partnership moves: the Zocdoc for Developers API in July 2022, the Integration
              Partner Program in 2023, the Zo AI phone assistant in May 2025, a Blue Shield of California payer
              partnership in June 2025, and the Patient Choice provider quality program in July 2025. A Yelp integration
              to enable appointment booking directly from Yelp business pages was launched in 2025. Revenue figures have
              not been publicly disclosed since 2020; the company claimed profitability in 2021.
