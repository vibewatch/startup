      - number: '4.3'
        title: Unit Economics and Platform Operating Metrics
        blocks:
          - type: paragraph
            body: >-
              Zocdoc's marketplace economics are characterized by high gross margins typical of two-sided marketplace
              software businesses: the primary cost of revenue is infrastructure, platform operation, and payment
              processing, not physical goods or human service delivery. Gross margin figures are not publicly disclosed;
              however, marketplace platform businesses in healthcare technology typically operate at gross margins of
              60–80% on booking fees, with customer acquisition cost for providers being the primary variable. The
              company's cost structure is dominated by sales and marketing (provider acquisition and retention),
              research and development (platform, AI, integrations), and general and administrative expenses. Physical
              capex is minimal given the purely software nature of the business. At the provider end, the unit economics
              of the per-booking model are theoretically favorable once a provider reaches sufficient booking volume: a
              dermatologist in an urban market generating 500+ bookings per year would pay $15,000–$70,000 but would
              receive patients with significant lifetime value. At the patient end, Zocdoc bears acquisition costs
              through SEO, paid media, and partnerships, and the marginal cost of serving an incremental patient booking
              is near-zero for the platform itself. Provider-side adverse signals exist: TrustPilot reviews and
              TrustRadius reviews cite cases where providers were charged for patient referrals that did not convert or
              were outside the provider's specialty, indicating dispute friction in the billing model. As of December
              2024, Zocdoc employed approximately 646 people in its US entity per Tracxn data, while Yahoo Finance
              reports approximately 501 full-time employees as of May 2026—a meaningful discrepancy that may reflect
              recent headcount reductions or reporting methodology differences. The India engineering subsidiary
              employed an unspecified number and reported $7.14M in revenue for FY March 2025 per Tracxn MCA filing
              data.
