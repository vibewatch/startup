      - number: '3.3'
        title: Feature and Capability Comparison
        blocks:
          - type: paragraph
            body: >
              Across the reviewed competitor set, Zocdoc leads on the combination of consumer-facing insurance
              verification depth (18,000+ plan coverage), multi-specialty breadth (250+), and direct real-time booking.
              Its closest peers match on individual dimensions but not their intersection: Healthgrades has comparable
              consumer traffic but lacks real-time insurance verification; Kyruus has superior provider data depth but
              no consumer marketplace; Headway has superior insurance credentialing in mental health but covers only one
              specialty cluster.

              Key feature gaps versus the competitive set include: Zocdoc lacks a physician-community network
              (Doximity's core moat), lacks a telehealth video-delivery module (One Medical, Teladoc), and lacks a
              subscription primary care relationship (One Medical, Forward). Its per-booking pricing model is cited in
              provider reviews as a principal cause of churn when booking conversion rates are low.

              AI differentiation: Zocdoc's Zo voice scheduling assistant resolves up to 70% of inbound calls without
              staff intervention; no reviewed competitor has announced an equivalent deployed AI phone scheduling agent
              at this resolution rate. Zo's technical architecture (built for dependability over exploration) gives
              Zocdoc a first-mover position in the phone channel that EHR-integrated competitors (Epic, Kyruus) have not
              yet replicated.

              On app-store quality, Zocdoc's iOS app carries a 4.9/5 rating with 160,000+ ratings and its Android app
              4.8/5, indicating strong consumer execution relative to competitors where app ratings are harder to
              verify. Trustpilot and TrustRadius reviews for Zocdoc are split: positive reviews dominate patient
              experience; adverse reviews are concentrated among providers disputing billing, calendar sync failures,
              and charging for non-converting referrals.
