      - number: '8.4'
        title: Valuation Methodology and Approach
        blocks:
          - type: paragraph
            body: >-
              Three valuation approaches are available for Zocdoc: (1) comparable company trading multiples, (2)
              secondary market price discovery, and (3) a provider-count-times-revenue-per-provider unit economics
              model. The comparable company approach produces the widest range given the opacity of Zocdoc's financials.
              Using the $100M–$250M estimated revenue range from the financials chapter and a 3–10× NTM revenue multiple
              calibrated to the digital health marketplace peer group, an EV range of $300M–$2.5B results; discounted
              for illiquidity and opacity, a reasonable range is $350M–$800M. The secondary market approach provides a
              single data point: approximately $446M as of May 2026. This is the most direct price signal but suffers
              from thin secondary market liquidity, no control premium, and the possibility that Francisco Partners debt
              instruments rank ahead of the equity class reflected in Forge's COI. The unit economics approach applies
              roughly 100,000 providers × estimated $800–$2,000 average annual spend per active provider = $80M–$200M
              gross revenue, then applies a 3–5× multiple for an EV of $240M–$1B. The convergence across all three
              methods is approximately $350M–$600M equity value, with the secondary market at $446M near the midpoint of
              that range. No DCF model can be constructed without disclosed revenue, EBITDA, or growth rate. Capital
              efficiency metrics are unfavorable at face value: PremierAlts reports a capital efficiency ratio of 0.39×
              (current implied valuation / total capital raised), meaning the market currently values the company at
              only 39 cents for every dollar invested. This is significantly below a healthy marketplace company's
              expected 1.5–3× efficiency range and reflects the dramatic markdown from peak valuations.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
