      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              Growth drivers are substantial and multi-layered. Consumer preference for digital scheduling has grown 15
              percentage points over five years, reaching 40%+, supported by smartphone ubiquity, comfort with app-based
              transactions, and pandemic-induced behavior change. Provider organizations face structural staffing
              pressure: up to 20% of incoming patient calls go unanswered, costing practices $200–300 per missed call in
              lost revenue, creating a direct ROI case for AI-powered or digital scheduling tools. Zocdoc's AI phone
              assistant Zo resolves up to 70% of scheduling calls without staff intervention in under 3.5 minutes. The
              company's Yelp distribution partnership extends the platform's reach to millions of weekly healthcare
              searches, a model that converts high-intent platform traffic directly to bookings.

              Regulatory tailwinds include CMS permanently expanding telehealth CPT code reimbursement in the 2021 fee
              schedule and repeated congressional extensions of pandemic-era Medicare telehealth flexibilities. AI
              investment across digital health continues at elevated levels.

              Adoption constraints are equally significant. Reimbursement parity is unresolved: 54% of physicians in a
              McKinsey survey said they would not offer virtual care at even a 15% discount to in-person rates, limiting
              telehealth expansion outside behavioral health. Medicare telehealth flexibilities remain legally
              temporary, with reimbursement uncertainty for multiple CPT code categories. Provider-side tech resistance
              is structural: small practices face both change-management costs and integration complexity. Insurance
              data accuracy is a chronic failure mode—patients discover post-booking that listed in-network providers
              are actually out-of- network, eroding platform trust. Provider complaints of calendar sync failures,
              charges for non-converting referrals, and limited dispute resolution also create friction. Rural broadband
              gaps constrain telehealth demand in underserved geographies despite strong need.
