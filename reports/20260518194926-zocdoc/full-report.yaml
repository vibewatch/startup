  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Zocdoc's primary revenue stream is a performance-based per-booking fee charged to healthcare providers for
              each new patient appointment booked through the marketplace. The company publicly charges $30 to $140 per
              new patient booking, with the exact fee varying by specialty, market, and procedure type. A provider
              generating 215 new patient bookings per year could owe up to $30,100 annually. This model replaced a flat
              annual subscription of $3,000 per provider that was in place from roughly 2012 to 2018. The subscription
              era was characterized by deeply unequal value delivery: high-demand urban specialists received thousands
              of bookings for the same price a rural low-volume practitioner paid for ten. CEO Oliver Kharraz
              acknowledged this directly in 2022, stating the company had "stopped growing, were losing money on every
              sale, and were creating negative perceptions among doctors." The per-booking model aligns revenue to
              actual value delivered, eliminating the negative-unit-economics trap of the subscription era. The rollout
              began in 2018, was contested by some New York City physicians who filed lawsuits, but was eventually
              completed. The model generates variable, demand-correlated revenue that scales with both supply-side
              growth (more providers, more specialties) and demand-side growth (more patient sessions). Zocdoc does not
              charge patients; the marketplace is free-to-use for the consumer side. Pricing transparency on the
              provider side remains limited: the $30–$140 range is from CEO statements; actual realized average booking
              fees and any volume discounts are not publicly disclosed.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI023
