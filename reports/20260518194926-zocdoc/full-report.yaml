      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Zocdoc was co-founded in 2007 by three individuals with complementary backgrounds in medicine, technology,
              and operations. Oliver Kharraz, MD, PhD, is CEO and co-founder, a German-born physician who earned his MD
              and PhD in Neuroscience from Ludwig-Maximilians-Universität München and a Master of Arts in Philosophy
              from the Hochschule für Philosophie München. Before Zocdoc, Kharraz spent seven years as Associate
              Principal at McKinsey & Company, where he designed patient utilization models for national health
              services. He joined Zocdoc as President at founding in January 2007 and became CEO in November 2015. Nick
              Ganju, co-founder and current Chief AI Officer, oversees the company's AI strategy including the Zo phone
              assistant. Cyrus Massoumi, the third co-founder, served as original CEO until the board removed him from
              the role in late 2015 amid what the Inc. article describes as "additional personnel problems." Massoumi
              subsequently filed a lawsuit against Zocdoc alleging fraud; his case was reportedly dismissed in 2024. He
              remains listed as an independent board member per Tracxn's board registry.


              Tracxn lists six active board members as of 2026: Cyrus Massoumi, David Weiden, Oliver Kharraz, Ken
              Howery, Joaquin Gamboa, and Netta Samroengraja. Key-person risk is elevated: Kharraz is the publicly
              visible architect of both the business-model pivot and Zocdoc's AI agenda, with no public heir apparent
              identified. Headcount is conflicted across sources—Tracxn reports 1,332 employees as of April 2026; the US
              corporate entity (ZOCDOC, INC.) showed 646 employees as of December 31, 2024 in legal filings; and Yahoo
              Finance/Forge list 501 full-time employees, suggesting the Tracxn figure may include global headcount with
              the Indian subsidiary.
