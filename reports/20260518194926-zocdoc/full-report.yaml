      - number: '8.3'
        title: Comparable Company Analysis
        blocks:
          - type: paragraph
            body: >-
              Direct public comparables for Zocdoc are limited. The closest analog is Doximity (NYSE: DOCS), a physician
              professional network and health IT platform with disclosed revenue. Doximity's FY2026 revenue was
              approximately $520–540 million with EBITDA margins of approximately 35–40%, and the stock trades at
              approximately $65–70 per share as of early May 2026, implying a market capitalization of approximately
              $11–12 billion and a revenue multiple of approximately 20–22×. Doximity's premium multiple reflects its
              physician network moat, high recurring pharmaceutical marketing revenue, and strong organic growth, making
              it a premium rather than median comp for Zocdoc. Teladoc Health (NYSE: TDOC), while not a marketplace
              analog, is the most visible "digital health went public and crashed" cautionary benchmark: from a 2020
              peak of ~$60 billion market cap to approximately $1–1.5 billion as of May 2026, its trajectory illustrates
              the range of downside in this sector. On private comparables, Kyruus Health (scheduling and access
              management) was acquired by symplr in a deal reported at approximately $1.4 billion in 2021 at the height
              of digital health valuations—likely 10–15× revenue at the time. Healthgrades, a physician directory and
              review platform, was sold by Internet Brands in portions with limited public price discovery. Given these
              data points, a reasonable median blended multiple for Zocdoc using marketplace software benchmarks at
              $100–150 million estimated revenue would imply a range of $500 million (3–4× revenue, illiquidity
              discount) to $1.5 billion (10× revenue, optimistic scenario). The secondary market mark of $446 million
              sits at the bottom of this reasonable range, consistent with the market applying a maximum illiquidity and
              opacity discount to a company with no disclosed financials.
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
