      - number: '5.2'
        title: AI, Automation, and Technology Differentiation
        blocks:
          - type: paragraph
            body: >-
              Zo is the clearest public window into Zocdoc's current technology strategy. Rather than handing end-to-end
              booking authority to a model, Zocdoc's May 2025 engineering write-up describes a hybrid system in which
              deterministic scheduling logic stays in control while the large-language-model layer handles speech
              translation and intent classification. That design choice matters: scheduling is a transactional workflow
              with high cost of error, so Zocdoc is explicitly using AI as an interface layer on top of hard business
              rules. Public performance disclosures are meaningful for an early voice product: Zo was already deployed
              with marketplace customers by Q3 2024, answers calls around the clock, resolves up to 70% of scheduling
              calls without staff intervention, books in roughly four minutes, reschedules in roughly two and a half
              minutes, and reports CSAT above 80. The supporting operating model is also notable. Zocdoc says guardrails
              are product features, release gates require 100% of eval tests to pass, and the company invested in broad
              AI training programs. That combination—deterministic core, AI translation layer, operational training, and
              explicit eval gates—is a more credible differentiation story than generic “AI assistant” marketing.
