            body: >-
              Zocdoc's financial profile is materially opaque for a company of its scale. No revenue, EBITDA, burn rate,
              or gross margin figures have been publicly disclosed since approximately 2020, and the $7.14M India
              subsidiary revenue is not indicative of the US business. The only financial claim in the public domain is
