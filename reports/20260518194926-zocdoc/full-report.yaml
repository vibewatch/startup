          - type: callout
            title: SAM and SOM Cannot Be Confirmed From Public Sources
            body: >
              No authoritative independent sizing of the digital appointment-scheduling sub-market exists in the
              reviewed sources. The $250B McKinsey figure is a virtual-care TAM, not a booking-platform addressable
              market. All SAM/SOM characterizations in this chapter are bounded inferences from provider-count and
              booking-fee proxies and should be treated as directional only until private company data is made available
