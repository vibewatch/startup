      - number: '3.2'
        title: Competitor Profiles and Scale
        blocks:
          - type: paragraph
            body: >
              Healthgrades is the closest single-market analog to Zocdoc's consumer directory and booking model, serving
              over 300 million annual visits with 10M+ physician ratings and a growing real-time appointment booking
              feature. Unlike Zocdoc, Healthgrades monetizes through a mix of provider profile subscriptions, health
              system partnerships, and sponsored search placements, with limited per-booking revenue. Healthgrades was
              acquired by RVO Health (owned by Red Ventures and Optum) in 2022, giving it access to enterprise health
              system distribution and a significant data asset in consumer health intent.

              Doximity is the most formidable platform-layer competitor: its physician-first network with 85%+ of US
              physicians enables telehealth visits, secure messaging, and EHR integration at a scale Zocdoc does not
              match on the provider-relationship side. Doximity's telehealth module competes directly where Zocdoc
              facilitates virtual-visit booking, though Doximity is physician-focused rather than consumer-first.

              Kyruus Health is Zocdoc's primary enterprise competitor, serving over 1,400 hospitals and 550 medical
              groups through a B2B provider data management model. Kyruus does not operate a consumer marketplace; it
              provides health systems and plans with accurate provider directories and scheduling infrastructure. The
              key strategic risk: as health systems build more sophisticated digital front doors powered by Kyruus or
              Epic MyChart, they may reduce reliance on third-party marketplaces for new-patient acquisition.

              Headway exemplifies the vertical-specialist challenger: 70,000+ insured therapists and psychiatrists,
              growing faster in the highest-telehealth-penetration specialty. Its direct insurance credentialing
              eliminates the in-network search friction that makes Zocdoc valuable in other specialties.

              One Medical (Amazon) operates a concierge primary care subscription ($199/year or employer-sponsored) with
              same-day and next-day appointments—directly competing at the patient experience level even though its
              monetization model differs from per-booking fees.
