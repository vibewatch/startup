      - number: '2.2'
        title: Market Sizing — Multiple Evidence Lenses
        blocks:
          - type: paragraph
            body: >
              No single credible TAM figure exists for digital healthcare appointment scheduling as a stand-alone market
              category; the evidence base instead offers overlapping, partially applicable estimates from broader
              virtual-care and digital-health lenses.

              McKinsey's most widely cited estimate places up to $250 billion of annual US healthcare spend as
              potentially shiftable to virtual or virtually-enabled care, representing the theoretical outer bound for
              platforms that enable that shift. Separately, telehealth utilization stabilized at 13–17% of all US
              outpatient and office visits by mid-2021—roughly 38x the pre-pandemic baseline—and mental health has
              continued upward toward 50% penetration in psychiatry. Digital-health venture-capital investment totaled
              $14.7 billion in H1 2021 alone, signaling sustained ecosystem investment even if specific
              scheduling-platform revenue pools are private.

              For Zocdoc's serviceable addressable market, several bottom-up proxies exist: Zocdoc itself claims nearly
              100,000 active providers across 250+ specialties and 18,000+ insurance plans, suggesting the platform has
              penetrated a significant but still-minority share of the ~3 million NPI-registered US providers. The
              Kyruus-cited 40%+ consumer online-booking preference with a 15-point five-year increase signals an
              expanding demand pool. Solv's claim of powering 100M+ healthcare visits reflects non-trivial platform
              scale in the same booking category.

              No authoritative SAM or SOM for the Zocdoc-specific segment (multi-specialty, insurance-verified,
              consumer-marketplace model) is publicly available; diligence estimates must be treated as bounded
              inference from the above proxies and preserved as such.
