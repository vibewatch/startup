      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              The healthcare appointment-scheduling market involves four distinct principals with different economic
              roles: patients, individual providers and practices, health systems, and health plans.

              Patients are the end-users and beneficiaries but rarely payers in the digital scheduling layer—Zocdoc and
              most competitors offer the consumer experience for free. Patient willingness to adopt is high when digital
              channels are available: over 40% now prefer online booking, and insurance acceptance, appointment
              availability, and location are their top three decision criteria. Over 80% of consumers call appointment
              availability "very or extremely important" when selecting a new provider. The adoption trigger is
              convenience and trust—a seamless booking that confirms in-network status removes the single biggest point
              of friction before the visit.

              Individual providers and practices are the payers in most consumer-marketplace models. Under Zocdoc's
              per-booking model, practices pay $30–$140 per new patient routed through the platform. The adoption
              trigger for providers is new-patient acquisition economics: if a booking fee is lower than the cost of
              other patient- acquisition channels (advertising, referral network, idle capacity), the model creates
              clear value. Provider churn is historically high when perceived per-booking costs exceed the value of
              acquired patients.

              Health systems and large hospital groups represent an enterprise payer segment, signing network-wide or
              system-level agreements. Kyruus serves over 1,400 hospitals and 550 medical groups with provider data and
              patient-access solutions. Zocdoc targets the same tier through practice-management tools and EHR
              integrations.

              Health plans are an emerging distribution partner: integrating scheduling into insurance directories
              reduces administrative friction and drives appointments to in-network providers. Headway's 70,000+ insured
              mental health providers and Kyruus's 100 health-plan brand customers illustrate the scale of plan-side
              engagement.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM019
              - CM021
