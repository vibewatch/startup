      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Zocdoc has raised capital through six or more identifiable rounds since its first funding in June 2008.
              The Series A of $5.38 million came from Khosla Ventures in August 2008, establishing a post-money
              valuation of approximately $13.44 million. The Series B of $16.67 million arrived in July 2010 from
              Founders Fund and Khosla Ventures at a $82.53 million post-money valuation. The Series C raised $37.5
              million from Goldman Sachs in September 2011, implying a post-money valuation of $771.93 million. The
              Series D in July–August 2015 raised $130 million (Tracxn) to $152.57 million (Forge) from Atomico, Baillie
              Gifford, and Founders Fund, establishing a $1.8 billion post-money valuation—the long-cited "unicorn"
              milestone. The most recent disclosed round was in February 2021, with Francisco Partners providing either
              $100 million (Forge's Series D-2 label) or $150 million (Forbes, Tracxn, and the company's own press
              release describing it as the "single largest total amount of funding Zocdoc has received at once"). The
              discrepancy may reflect different tranches or data vintage; the $150M figure from Forbes and the company's
              own announcement is treated as the more authoritative number. No new capital has been raised since
              February 2021, per all sources reviewed.


              Secondary-market valuation estimates have declined sharply since the 2021 raise. Forge's derived price as
              of May 15–18, 2026 implies a company valuation of approximately $446.48 million—a roughly 83% markdown
              from the post-money valuation implied at the time of the 2021 round if that round was priced at a $2.62
              billion post-money (per Forge's round data). PremierAlts cites $446.5 million as of July 2025. Total
              capital raised is contested: Tracxn reports $426 million across twelve rounds, Forbes described cumulative
              "growth capital" of more than $370 million at the time of the 2021 announce, while Forge's database shows
              $1.15 billion total—a figure that may include debt or other instruments not reflected in equity-round
              totals.
