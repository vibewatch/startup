      - number: '7.5'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Zocdoc is not walking into these risks blind. Public materials show some compliance posture, some security
              posture, a real integration strategy, and continued hiring against AI and product execution. Those are
              genuine mitigants. The problem is that they are mostly process signals rather than outcome signals. Public
              evidence still does not show complaint cohorts, provider churn by complaint type, state-by-state legal
              clearance on referral-fee structure, or a management-quality incident ledger for privacy and security. As
              a result, mitigation maturity should be treated as medium at best for the top risks, not as proof that the
              risks are closed.


              The practical kill criteria are straightforward. If diligence finds that billing disputes are economically
              material, that complaint-heavy specialties drive a disproportionate share of bookings, that management
              lacks a current patient-brokering or fee-splitting memo, or that incident history is worse than the public
              record suggests, the risk-adjusted case weakens sharply. Likewise, if a financing or secondary reset
              arrives before disclosure quality improves, investors should assume valuation is being carried by
              narrative more than by underwriting-grade proof. The next diligence round should therefore focus on
              complaint cohorts, legal memos, concentration tables, incident history, and partner-dependency mapping
              rather than on another top-line growth story.
