  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Zocdoc is not a drug maker or insurer, but it still sits inside a dense healthcare rule stack. HHS HIPAA
              guidance and HHS telehealth guidance make clear that healthcare workflows involving protected health
              information remain subject to privacy, security, and breach-notification duties even when care is
              coordinated digitally. FTC health-privacy guidance broadens that risk surface because consumer health-data
              practices can trigger enforcement even outside the narrowest HIPAA framing, and the FTC has already
              brought a 2023 case against companies that shared sensitive health information for advertising. That
              matters for a platform whose value proposition depends on matching patients, providers, insurance, and
              appointment data across a large consumer funnel.


              The referral-economics question is the sharper legal edge. OIG training materials say remuneration
              designed to induce federal-program referrals can implicate the Anti-Kickback Statute, while Inc reported
              that Zocdoc’s move from subscription pricing to pay-per-booked-patient pricing sparked lawsuits from
              doctors. Even if Zocdoc believes its model is commercially defensible, the combination of provider
              disputes, referral-linked billing, and telehealth-adjacent workflows means the legal risk is not
              hypothetical. The key diligence issue is whether management has a current state-by-state fee-splitting or
              patient-brokering analysis and whether complaint patterns show isolated friction or a structurally
              contentious revenue model.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
