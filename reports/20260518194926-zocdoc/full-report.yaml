      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Zocdoc's Yelp Partnership Converts a Structural Threat Into a Distribution Channel
            body: >
              Rather than competing with Yelp's massive healthcare consumer search traffic, Zocdoc embedded its
              real-time booking directly into Yelp provider pages in 2025. This transforms what would have been a
              zero-sum disintermediation risk (Yelp routes patients to provider websites directly) into an incremental
              booking channel. The same playbook may be applicable to Google if a deeper booking integration can be
              negotiated.
            calloutType: insight
            claimRefs:
              - CP005
              - CP030
          - type: callout
            title: Provider-Side Billing Disputes Are the Most Cited Competitive Vulnerability
            body: >
              TrustRadius gives Zocdoc a 1/10 provider experience score, with reviews citing charges for unconverted
              referrals, calendar sync failures, and limited dispute resolution. BBB complaint filings echo the same
              themes. Any competitor offering a flat-fee or freemium scheduling model with comparable consumer reach
              would have a direct opening to capture small-practice churn. NexHealth and a future EHR-native scheduling
              feature (Epic, Athena) are the most plausible displacers in this provider segment.
            calloutType: risk
            claimRefs:
              - CP034
              - CP035
          - type: callout
            title: Google Disintermediation Is the Hardest Risk to Quantify
            body: >
              Google's Health Knowledge Panels and direct-booking integrations can route patients to provider websites
              without passing through Zocdoc's marketplace, bypassing both the patient-acquisition value and the booking
              fee. Unlike Healthgrades or WebMD competition—which Zocdoc can address with consumer brand spend—Google's
              search dominance in health queries is structural. The Yelp partnership is a partial proxy for how to
              manage this, but Zocdoc currently has no equivalent Google integration agreement in the reviewed sources.
            calloutType: risk
            claimRefs:
              - CP029
