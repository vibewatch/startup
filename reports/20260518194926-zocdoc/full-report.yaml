        title: Customer Proof and Satisfaction
        blocks:
          - type: paragraph
            body: >-
              Customer proof is asymmetrical. On the consumer side, the evidence is strong, current, and high-volume:
              app-store ratings are exceptional, app reviews specifically cite same-day appointment wins, and Trustpilot
              reviews focus on easy booking and in-network discovery. That is meaningful because it ties product utility
              to the real pain point Zocdoc claims to solve. Named production proof also exists, but it is partial
              rather than exhaustive. The cleanest public examples are the City of Chicago vaccine scheduler,
              Elation-enabled clinician integrations, and the 2026 Yelp booking channel. Each demonstrates real
              deployment, but none gives a revenue-ranked customer roster or repeat-usage cohort. Provider-side proof is
              much less favorable. TrustRadius and BBB complaint surfaces show recurring issues around wrong-specialty
              referrals, billing disputes, calendar sync failures, price increases, and patient cancellations with
              limited recourse. The result is a split-quality proof set: patients appear happy enough to validate
              top-of-funnel demand and booking utility, while providers raise monetization and workflow complaints that
              could pressure renewal quality.
