  - id: FV001
    title: Zocdoc Valuation Timeline (2015–2026)
    type: flow
    layout: standard
    summary: >-
      Tracks the three key valuation marks from the 2015 Series D through the 2021 Series D-2 COI to the 2026 secondary
      market, illustrating the sharp ~83% markdown from the COI peak.
    data:
      nodes:
        - id: series_d_2015
          label: 2015 Series D
          description: $130M raised at $1.8B post-money; Baillie Gifford, Fidelity, LionTree lead
        - id: gap_2016_2020
          label: '2016–2020: Model Pivot'
          description: No external equity; subscription-to-per-booking transition; negative unit economics resolved
        - id: series_d2_2021
          label: 2021 Series D-2
          description: '$100M from Francisco Partners; COI-implied $2.62B; CEO: ''profitable with accelerating growth'''
        - id: secondary_2025
          label: 2025 Secondary
          description: PremierAlts $446.5M (July 2025); Forge price implied ~$446M; -83% from COI
        - id: secondary_may_2026
          label: May 2026 Secondary
          description: Forge $5.00/share; ~$446M implied; 5 years since last equity funding round
    approximationNotes: >-
      The 2016–2020 gap node represents estimated period; no public valuation event or disclosed mark between the 2015
      Series D and the 2021 round. Mid-2023 market pricing is inferred, not sourced from Forge quotes.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
  - id: FV002
    title: Valuation Mark Spectrum
    type: range
    layout: standard
    summary: >-
      Places Zocdoc's three contradictory valuation marks on a single spectrum to visualize the ~6× spread from legacy
      $1.8B to COI $2.62B to secondary market $446M.
    data:
      items:
        - label: Legacy mark ($1.8B)
          low: 1800
          mid: 1800
          high: 1800
          unit: $M
          note: Stale 2015 Series D; still cited in media and databases as of 2025–2026. Not reflective of current market.
        - label: COI-implied 2021 ($2.62B)
          low: 2620
          mid: 2620
          high: 2620
          unit: $M
          note: >-
            Certificate of Incorporation based; Francisco Partners $100M at $29.29/share. Historical market context at
            2021 peak.
        - label: Secondary market 2026 (~$446M)
          low: 400
          mid: 446
          high: 500
          unit: $M
          note: >-
            Forge Global $5.00/share May 2026; PremierAlts $446.5M July 2025. Most current but illiquid OTC. ±$50M
            liquidity band.
        - label: Analyst triangulation (base case)
          low: 350
          mid: 450
          high: 600
          unit: $M
          note: >-
            Blended multiple + secondary + unit-economics bottom-up. All inputs speculative. Brackets secondary market
            price.
    approximationNotes: >-
      All non-secondary marks are either stale or COI-based. Secondary market band of ±$50M reflects thin OTC liquidity.
      Analyst triangulation is an estimate; no DCF can be built without disclosed revenue.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV025
      - CV026
      - CV027
      - CV028
  - id: FV003
    title: Comparable Company Revenue Multiple Spectrum
    type: range
    layout: standard
    summary: >-
      Maps digital health and health IT peer companies by NTM revenue multiple to contextualize where Zocdoc's
      secondary-market-implied multiple falls in the spectrum.
    data:
      items:
        - label: Teladoc (TDOC) — distressed
          low: 1.5
          mid: 1.8
          high: 2
          unit: × NTM revenue
          note: Public; distressed; declining revenue; BetterHelp write-downs. Floor reference.
        - label: Zocdoc secondary market (~$446M / ~$150M rev est.)
          low: 2.5
          mid: 3.5
          high: 5
          unit: × NTM revenue
          note: Implied from Forge $5.00/share and $100–150M estimated revenue. Wide range due to revenue uncertainty.
        - label: Median digital health SaaS marketplace (private)
          low: 4
          mid: 6
          high: 8
          unit: × NTM revenue
          note: Approximate private market comp range for growing digital health marketplace businesses; 2026 benchmarks.
        - label: Kyruus Health (2021 peak transaction)
          low: 9
          mid: 11.5
          high: 14
          unit: × NTM revenue
          note: 2021 M&A transaction at symplr acquisition; peak market valuation; not representative of 2026 pricing.
        - label: Doximity (DOCS) — premium comp
          low: 18
          mid: 21
          high: 24
          unit: × NTM revenue
          note: >-
            Public; high-margin pharma-marketing revenue; physician network moat. Premium outlier, not directly
            comparable.
    approximationNotes: >-
      Teladoc and Doximity multiples from Yahoo Finance / Doximity investor relations as of May 2026. All
      private-company revenue and multiple estimates are speculative from analyst benchmarks. Zocdoc range is wide due
      to unconfirmed revenue.
    claimRefs:
      - CV016
      - CV017
      - CV019
      - CV021
      - CV022
      - CV023
  - id: FV004
    title: Capital Efficiency Comparison
    type: range
    layout: standard
    summary: >-
      Compares Zocdoc's capital efficiency (implied valuation / total capital raised) against peer benchmarks to
      contextualize the ~0.4–1.0× efficiency at the current secondary market mark.
    data:
      items:
        - label: Zocdoc (secondary market $446M / $426M raised)
          low: 0.39
          mid: 0.72
          high: 1.05
          unit: × (EV / capital raised)
          note: >-
            Low = PremierAlts reported 0.39×; High = $446M / $426M = 1.05×; mid uses partial capital credit to Francisco
            Partners.
        - label: Typical early-stage venture (exit)
          low: 5
          mid: 10
          high: 30
          unit: × (EV / capital raised)
          note: Benchmark for top-decile venture-backed company at exit. Zocdoc far below this range.
        - label: Comparable late-stage digital health (2026)
          low: 1
          mid: 2
          high: 4
          unit: × (EV / capital raised)
          note: Approximate benchmark for late-stage digital health companies not at peak valuations. Zocdoc below the low.
        - label: Doximity capital efficiency (FY2026)
          low: 8
          mid: 12
          high: 16
          unit: × (EV / capital raised)
          note: >-
            Rough benchmark: Doximity ~$11B market cap / ~$700–800M total capital raised. Strong efficiency for public
            health IT.
    approximationNotes: >-
      All figures except Zocdoc secondary market mark are approximate benchmark estimates. Doximity total capital raised
      is estimated from public disclosures; exact figure may differ. Zocdoc range reflects uncertainty in whether
      Francisco Partners round is 100% equity.
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV040
