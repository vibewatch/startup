schemaVersion: "report-v2"
artifact: market-analysis
slug: zocdoc
runDate: "2026-05-18"
company:
  name: Zocdoc
chapter:
  number: 2
  title: Market Analysis
  summary: >
    The digital healthcare appointment-scheduling market sits at the intersection of consumer digital-health adoption,
    insurance complexity, and physician-practice economics. McKinsey's oft-cited $250 billion virtual-care opportunity
    establishes the outer bound; stable telehealth utilization at 13–17% of US ambulatory visits and accelerating
    online-booking preference (40%+ of consumers) define real, near-term demand. The segment most directly
    addressable by Zocdoc—insurance-verified, cross-specialty patient–provider matching and real-time booking—lacks
    a single auditable TAM figure but is constrained by the roughly $1 trillion US ambulatory-care market, variable
    provider adoption, insurance-data accuracy issues, and unresolved Medicare telehealth reimbursement permanence.

sections:
  - id: market-boundary
    title: Market Boundary and Definition
    body: >
      Zocdoc operates within the digital patient-access and healthcare-appointment-scheduling segment of the broader
      US health-information technology market. The included spend encompasses patient-facing search and filtering of
      providers by specialty, insurance plan, location, and availability; real-time appointment-booking infrastructure
      (including EHR calendar integrations); insurance eligibility verification embedded at point of scheduling;
      and multi-channel distribution (marketplace, provider website, insurer directory, third-party search).
      Excluded categories include EHR workflow and clinical documentation software, telehealth video-delivery
      infrastructure, hospital billing and revenue-cycle management, remote patient monitoring hardware, and
      pharmacy or prescription platforms.

      Adjacent spend that overlaps but is not core includes: (1) health-system digital-front-door platforms
      (e.g., Kyruus, which provides provider data management to health systems and plans rather than a direct
      consumer marketplace), (2) telehealth subscription models where scheduling is ancillary to clinical delivery
      (e.g., One Medical, Teladoc), and (3) condition-specific mental-health marketplaces (e.g., Headway, Grow
      Therapy) that occupy the scheduling–clinical delivery boundary. Status-quo substitutes remain powerful: most
      US outpatient appointments are still booked by phone, with up to 20% of calls to practices going unanswered
      and 34% of patients who cannot get through abandoning scheduling entirely. Self-service patient portals,
      walk-in visits, and referral-based scheduling round out the non-digital substitutes.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]

  - id: market-sizing
    title: Market Sizing — Multiple Evidence Lenses
    body: >
      No single credible TAM figure exists for digital healthcare appointment scheduling as a stand-alone market
      category; the evidence base instead offers overlapping, partially applicable estimates from broader virtual-care
      and digital-health lenses.

      McKinsey's most widely cited estimate places up to $250 billion of annual US healthcare spend as potentially
      shiftable to virtual or virtually-enabled care, representing the theoretical outer bound for platforms that
      enable that shift. Separately, telehealth utilization stabilized at 13–17% of all US outpatient and office
      visits by mid-2021—roughly 38x the pre-pandemic baseline—and mental health has continued upward toward 50%
      penetration in psychiatry. Digital-health venture-capital investment totaled $14.7 billion in H1 2021 alone,
      signaling sustained ecosystem investment even if specific scheduling-platform revenue pools are private.

      For Zocdoc's serviceable addressable market, several bottom-up proxies exist: Zocdoc itself claims nearly
      100,000 active providers across 250+ specialties and 18,000+ insurance plans, suggesting the platform has
      penetrated a significant but still-minority share of the ~3 million NPI-registered US providers. The
      Kyruus-cited 40%+ consumer online-booking preference with a 15-point five-year increase signals an expanding
      demand pool. Solv's claim of powering 100M+ healthcare visits reflects non-trivial platform scale in the
      same booking category.

      No authoritative SAM or SOM for the Zocdoc-specific segment (multi-specialty, insurance-verified,
      consumer-marketplace model) is publicly available; diligence estimates must be treated as bounded inference
      from the above proxies and preserved as such.
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM011, CM016, CM017, CM024, CM025, CM028]
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]

  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >
      The healthcare appointment-scheduling market involves four distinct principals with different economic roles:
      patients, individual providers and practices, health systems, and health plans.

      Patients are the end-users and beneficiaries but rarely payers in the digital scheduling layer—Zocdoc and
      most competitors offer the consumer experience for free. Patient willingness to adopt is high when digital
      channels are available: over 40% now prefer online booking, and insurance acceptance, appointment availability,
      and location are their top three decision criteria. Over 80% of consumers call appointment availability "very
      or extremely important" when selecting a new provider. The adoption trigger is convenience and trust—a seamless
      booking that confirms in-network status removes the single biggest point of friction before the visit.

      Individual providers and practices are the payers in most consumer-marketplace models. Under Zocdoc's
      per-booking model, practices pay $30–$140 per new patient routed through the platform. The adoption trigger
      for providers is new-patient acquisition economics: if a booking fee is lower than the cost of other patient-
      acquisition channels (advertising, referral network, idle capacity), the model creates clear value. Provider
      churn is historically high when perceived per-booking costs exceed the value of acquired patients.

      Health systems and large hospital groups represent an enterprise payer segment, signing network-wide or
      system-level agreements. Kyruus serves over 1,400 hospitals and 550 medical groups with provider data and
      patient-access solutions. Zocdoc targets the same tier through practice-management tools and EHR integrations.

      Health plans are an emerging distribution partner: integrating scheduling into insurance directories reduces
      administrative friction and drives appointments to in-network providers. Headway's 70,000+ insured mental
      health providers and Kyruus's 100 health-plan brand customers illustrate the scale of plan-side engagement.
    claimRefs: [CM013, CM014, CM015, CM019, CM021, CM022, CM023, CM027]
    tableRefs: [TM003]
    figureRefs: [FM003]

  - id: growth-drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: >
      Growth drivers are substantial and multi-layered. Consumer preference for digital scheduling has grown 15
      percentage points over five years, reaching 40%+, supported by smartphone ubiquity, comfort with app-based
      transactions, and pandemic-induced behavior change. Provider organizations face structural staffing pressure:
      up to 20% of incoming patient calls go unanswered, costing practices $200–300 per missed call in lost
      revenue, creating a direct ROI case for AI-powered or digital scheduling tools. Zocdoc's AI phone assistant
      Zo resolves up to 70% of scheduling calls without staff intervention in under 3.5 minutes. The company's
      Yelp distribution partnership extends the platform's reach to millions of weekly healthcare searches, a model
      that converts high-intent platform traffic directly to bookings.

      Regulatory tailwinds include CMS permanently expanding telehealth CPT code reimbursement in the 2021
      fee schedule and repeated congressional extensions of pandemic-era Medicare telehealth flexibilities.
      AI investment across digital health continues at elevated levels.

      Adoption constraints are equally significant. Reimbursement parity is unresolved: 54% of physicians in
      a McKinsey survey said they would not offer virtual care at even a 15% discount to in-person rates, limiting
      telehealth expansion outside behavioral health. Medicare telehealth flexibilities remain legally temporary,
      with reimbursement uncertainty for multiple CPT code categories. Provider-side tech resistance is structural:
      small practices face both change-management costs and integration complexity. Insurance data accuracy is a
      chronic failure mode—patients discover post-booking that listed in-network providers are actually out-of-
      network, eroding platform trust. Provider complaints of calendar sync failures, charges for non-converting
      referrals, and limited dispute resolution also create friction. Rural broadband gaps constrain telehealth
      demand in underserved geographies despite strong need.
    claimRefs: [CM005, CM012, CM018, CM020, CM029, CM030, CM031, CM032, CM033, CM034, CM035, CM036, CM037]
    tableRefs: [TM004]
    figureRefs: [FM004]

  - id: regulatory-reimbursement
    title: Regulatory and Reimbursement Dynamics
    body: >
      The regulatory environment for digital healthcare scheduling is most consequential through its effect on
      telehealth reimbursement, which directly governs whether virtual appointments booked on platforms like
      Zocdoc generate covered-service revenue for providers.

      CMS permanently expanded telehealth coverage for a subset of CPT codes in the 2021 Medicare physician
      fee schedule, marking the first durable post-pandemic regulatory change. However, dozens of CPT codes
      added during the public health emergency remain on temporary waiver status—congressional extensions
      have repeatedly renewed them, but no permanent legislative fix has been enacted. As of March 2026, KFF
      reports that most pandemic-era Medicare telehealth flexibilities remain operative through the latest
      extension, while flagging active legislative uncertainty over permanence. This creates a planning horizon
      risk for scheduling platforms whose value proposition depends on virtual-visit volume: a rollback would
      disproportionately affect telehealth-heavy specialties and patients in non-rural areas (where waived
      geographic restrictions apply).

      State licensure requirements for telehealth add a second compliance layer: providers must generally hold
      licensure in the state where the patient receives care, creating multi-state credentialing complexity for
      digital platforms facilitating cross-state virtual visits. HHS telehealth guidance and CMS provider
      enrollment rules govern the operational mechanics, while HIPAA and state privacy laws apply to scheduling
      data handling. Zocdoc has achieved SOC 2, HIPAA, and PCI compliance, establishing baseline compliance
      credentials, but the broader regulatory landscape for telehealth reimbursement remains the dominant
      risk for market-growth forecasts.
    claimRefs: [CM031, CM032, CM033, CM034]
    tableRefs: [TM005]

