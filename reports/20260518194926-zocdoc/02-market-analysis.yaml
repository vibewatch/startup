  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "digital booking market share"
      missingEvidence: "Authoritative independent survey of the share of US ambulatory appointments currently booked via digital/online channels versus phone or walk-in, broken down by care type and payer."
      whyItMatters: "Without this data, the growth narrative relies on preference surveys rather than actual transaction flows, making SAM estimation unreliable."
      diligencePath: "Commission or license a healthcare consumer transaction dataset (e.g., MGMA, IQVIA, CMS encounter data) or request internal conversion metrics from Zocdoc management."
      relatedQuestionRefs: [QM008]

    - type: private-evidence-only
      severity: material
      topic: "Zocdoc SAM and SOM"
      missingEvidence: "Internal Zocdoc data on active provider count, booking volume, revenue per provider by specialty, and geographic penetration to build a defensible SAM/SOM estimate."
      whyItMatters: "Without a SAM, the $250B virtual-care TAM cannot be reliably scaled down to Zocdoc's specific multi-specialty, insurance-verified consumer marketplace."
      diligencePath: "Request management data room access covering annualized bookings, active provider count, revenue run rate, and cohort booking frequency."
      relatedQuestionRefs: [QM014]

    - type: missing-source
      severity: minor
      topic: "market saturation / competitive saturation"
      missingEvidence: "Provider cohort retention data across scheduling platforms and evidence on whether provider multi-homing or platform switching has increased materially since 2020."
      whyItMatters: "Saturation or commoditization of the scheduling marketplace would cap lifetime value per provider and compress per-booking pricing."
      diligencePath: "Run provider sentiment surveys; request Zocdoc's gross provider churn rate and average provider tenure on platform."
      relatedQuestionRefs: [QM018]

    - type: stale
      severity: minor
      topic: "forward digital scheduling growth rate"
      missingEvidence: "Post-2022 independent analyst estimate of the CAGR for the digital patient-scheduling sub-market as a standalone category, distinct from the broader telehealth TAM."
      whyItMatters: "Growth-rate assumptions underpin valuation multiples; the McKinsey estimate is from 2021 and may not reflect post-pandemic normalization."
      diligencePath: "License or commission an updated market research report specifically covering digital appointment-scheduling platforms (e.g., Gartner, Frost & Sullivan, IDC Health)."
      relatedQuestionRefs: [QM021]

    - type: private-evidence-only
      severity: material
      topic: "SAM/SOM sizing methodology"
      missingEvidence: "Verified methodology for segmenting the $250B virtual-care TAM into the sub-segment specifically addressable by an insurance-verified, cross-specialty consumer booking marketplace like Zocdoc."
      whyItMatters: "Without a defensible sizing methodology, the platform's addressable market cannot be compared to valuation benchmarks or peer companies."
      diligencePath: "Request Zocdoc investor materials, any independent market study, or commission bottom-up sizing using CMS claims data and provider fee schedules."
      relatedQuestionRefs: [QM025]

