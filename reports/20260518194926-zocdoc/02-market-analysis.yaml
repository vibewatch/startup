figures:
  - id: FM001
    title: Market Sizing Pyramid — TAM / SAM / Addressable Proxy
    type: pyramid
    layout: standard
    summary: Nested sizing layers from US virtual-care TAM down to Zocdoc's observed provider network as an addressable proxy; values are source-backed estimates, not authoritative SAM/SOM figures.
    data:
      nodes:
        - label: "US Virtual/Virtually-Enabled Care TAM"
          value: "Up to $250B (McKinsey 2021)"
          note: "Total potential virtual care spend, all modalities"
        - label: "Digitizable Ambulatory Scheduling Layer"
          value: "13–17% of ~$1T ambulatory care = est. $130–170B"
          note: "Outpatient visits that could be scheduled digitally (telehealth + in-person booking); estimated from McKinsey utilization data and CMS ambulatory spend benchmarks"
        - label: "Zocdoc Observable Addressable Proxy"
          value: "~100K active providers × $30–140/new patient (booking fees only)"
          note: "Not a SAM figure; reflects disclosed platform scale and pricing as an activity proxy"
    approximationNotes: "Layer values mix distinct methodologies and vintages. The $250B is a 2021 McKinsey virtual-care shift estimate, not a booking-platform revenue figure. Middle layer is a derived estimate. Bottom layer is an activity proxy, not a revenue run-rate."
    claimRefs: [CM006, CM007, CM016, CM019]

