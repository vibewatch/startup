    claimRefs: [CM003, CM005, CM013, CM016]

callouts:
  - calloutType: insight
    title: Mental Health Is the Highest-Conviction Digital Scheduling Sub-Market
    body: >
      Psychiatry already has approximately 50% telehealth penetration—the highest of any specialty—and McKinsey
      predicts mental health "goes nearly completely remote." Combined with insurer-backed marketplaces (Headway,
      70,000+ insured therapists) and persistent provider shortages in 56% of US counties, mental health represents
      the clearest near-term unit-economics case for digital scheduling platforms.
    claimRefs: [CM010, CM011, CM027]

  - calloutType: risk
    title: Medicare Telehealth Permanence Is the Single Largest Regulatory Wildcard
    body: >
      Congressional extensions have kept pandemic-era telehealth flexibilities alive through 2026, but no
      permanent legislation exists. A rollback would reduce virtual-visit volume—particularly for Medicare
      patients—and disproportionately affect telehealth-enabled scheduling platforms. KFF flagged this as an
      open policy uncertainty as recently as March 2026.
    claimRefs: [CM032, CM033]

  - calloutType: risk
    title: Insurance Data Accuracy Is a Structural Platform Vulnerability
    body: >
      Patient reviews and provider complaints consistently surface insurance inaccuracy as a top failure mode:
      providers listed as in-network are sometimes not, and calendar sync failures create double-booking.
      These issues damage trust for patients and create charge-back disputes for providers. Any credible
      competitor achieving superior insurance accuracy would have a material differentiation advantage.
    claimRefs: [CM035, CM036]

  - calloutType: assumption
    title: SAM and SOM Cannot Be Confirmed From Public Sources
    body: >
      No authoritative independent sizing of the digital appointment-scheduling sub-market exists in the reviewed
      sources. The $250B McKinsey figure is a virtual-care TAM, not a booking-platform addressable market.
      All SAM/SOM characterizations in this chapter are bounded inferences from provider-count and booking-fee
      proxies and should be treated as directional only until private company data is made available in diligence.
    claimRefs: [CM006, CM007, CM009]

