companyProfile:
  summary: >-
    Zocdoc is a New York City-based healthcare marketplace founded in 2007 by Oliver Kharraz, Cyrus Massoumi, and Nick Ganju.
    The platform helps patients find in-network doctors, dentists, and other clinicians, compare reviews, and book in-person or
    virtual appointments, while monetizing providers through a per-booking model and newer workflow products such as the Zo AI
    phone agent. Public sources indicate the marketplace reaches millions of patients monthly, approximately 100,000 providers,
    and more than 18,000 insurance plans, but current revenue, margin, and churn remain undisclosed.
