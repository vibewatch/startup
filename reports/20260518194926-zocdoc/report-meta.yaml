summary:
  headline: >-
    Zocdoc has real marketplace scale, a materially improved per-booking model, and credible AI / partner expansion paths,
    but the underwriting case remains constrained by severe financial opacity, provider-friction risk, and a current valuation
    signal that is far below its legacy unicorn headline.
