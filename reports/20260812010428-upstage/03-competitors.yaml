- id: document-ai-and-status-quo
  title: Document AI expands the battlefield beyond LLM vendors alone
  body: 'Upstage is unusually exposed to document-workflow competition because Document Parse gives the company a second buying center beyond model APIs. That helps, but it also means Upstage must contend with dedicated IDP and automation incumbents such as ABBYY, Hyperscience, UiPath, and Automation Anywhere. Those vendors enter procurement from the opposite direction: they already sit inside enterprise document, RPA, or back-office automation budgets and can add generative-AI capabilities without asking the customer to switch platform categories. This is especially important in insurance, finance, and healthcare, where the immediate budget owner may care more about straight-through document processing than about which foundation model sits underneath. The status quo alternative is also real. Enterprises can assemble open models, OCR or IDP modules, and internal workflows themselves. Upstage therefore benefits when a buyer wants one integrated Korean enterprise stack, but it loses leverage
    whenever document automation is treated as just another interchangeable component in a broader internal-build architecture.'
