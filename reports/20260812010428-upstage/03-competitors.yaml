  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-share
    missingEvidence: Independent market-share or usage-share data that corroborates the reported 35% share of Korea's private LLM market.
    whyItMatters: A single secondary estimate is not enough to underwrite durable competitive leadership.
    diligencePath: Request third-party market-share surveys, cloud-usage data, or customer-count comparisons from management and channel partners.
    relatedQuestionRefs:
    - QP022
  - type: private-evidence-only
    severity: material
    topic: pricing-comparability
    missingEvidence: Normalized enterprise TCO comparisons across Upstage, Naver, LG, OpenAI, Anthropic, Mistral, Cohere, and IDP alternatives.
    whyItMatters: Public list prices and custom enterprise quotes are too inconsistent to prove a durable cost advantage.
    diligencePath: Collect anonymized customer proposals or procurement screenshots and normalize them by tokens, pages, seats, and infrastructure assumptions.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: head-to-head-wins
    missingEvidence: Named or anonymized bakeoff outcomes showing Upstage winning or losing against Naver and LG inside Korean regulated enterprises.
    whyItMatters: Distribution power and technical quality matter less than actual procurement win rates once the account is enterprise-scale.
    diligencePath: Ask for three recent regulated-sector deal dossiers with shortlisted vendors, evaluation criteria, and reasons for win or loss.
    relatedQuestionRefs:
    - QP024
  - type: stale
    severity: material
    topic: frontier-ranking-durability
    missingEvidence: A refreshed cross-vendor benchmark view after the next major release cycle from OpenAI, Anthropic, Google, Mistral, Cohere, and LG.
    whyItMatters: A frontier top-10 claim can decay quickly when the rest of the field ships new reasoning or multimodal models.
    diligencePath: Re-run the competitive benchmark screen after the next release cycle or ask Upstage for rolling benchmark governance materials.
    relatedQuestionRefs:
    - QP025
  - type: missing-source
    severity: material
    topic: internal-build-substitute
    missingEvidence: Usage data showing how often Korean enterprises choose internal build plus open-source and third-party IDP over a turnkey Korean proprietary stack.
    whyItMatters: The true substitute set includes not only rival vendors but also the choice to assemble a stack internally.
    diligencePath: Interview Korean banks, insurers, and SI partners about build-vs-buy patterns and attach rates for OCR, RAG, and model-serving components.
    relatedQuestionRefs:
    - QP026
  - type: enumeration-incomplete
    severity: minor
    topic: procurement-landscape-coverage
    missingEvidence: A fuller row set covering internal build, system integrators, and additional Korean sovereign-AI contenders such as SK Telecom or KT.
    whyItMatters: TP001 is deliberately partial and prioritizes the most decision-relevant alternatives rather than every possible supplier.
    diligencePath: Expand the landscape with a channel-oriented long list if the investment proceeds to commercial due diligence.
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: minor
    topic: customer-retention-and-multi-homing
    missingEvidence: Retention, seat expansion, or workload-share data showing whether customers multi-home across Upstage and global APIs.
    whyItMatters: Moat durability depends on whether private deployment and Korean quality reduce multi-homing in production.
    diligencePath: Ask management for account-level expansion and displacement data by vertical and deployment mode.
