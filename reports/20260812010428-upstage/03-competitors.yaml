    - Roughly at parity on deployment posture; Upstage appears more startup-agile while LG has larger enterprise relationships.
  - - Industrial or manufacturing domain access
    - Moderate
    - LG EXAONE
    - LG retains the stronger captive industrial-data and manufacturing wedge.
  - - Consumer distribution reach
    - Low to moderate
    - Kakao or Naver
    - Upstage trails both incumbents badly on daily-user distribution and must win via enterprise ROI instead.
  - - Global frontier breadth
    - Below OpenAI, Anthropic, and Google on raw general-purpose breadth
    - OpenAI GPT-4o
    - Upstage competes with localization and efficiency, not broad capability supremacy.
  - - Open-weight / private-enterprise alternative to US APIs
    - Strong among Korean vendors
    - Mistral or Cohere
    - Upstage is locally advantaged in Korean tasks; Mistral and Cohere are stronger on global sovereign-enterprise branding.
