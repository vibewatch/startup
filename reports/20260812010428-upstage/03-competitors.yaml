- id: TP004
  title: Moat durability and competitive risk register
  columns:
  - Moat claim
  - Main threat
  - Severity
  - Evidence from this run
  - Diligence ask
  rows:
  - - Korean-language leadership plus enterprise fit
    - Naver or LG narrowing the quality gap while retaining larger distribution
    - High
    - Naver and LG both have strong Korean or industrial moats, while Upstage's benchmark lead is recent rather than deeply entrenched.
    - Request customer win-loss evidence versus Naver and LG by sector.
  - - Single-GPU and lower-cost inference narrative
    - Open-weight and frontier labs compress cost or quality gaps quickly
    - High
    - Seoulz and Pebblous both frame efficiency as Upstage's wedge, but global model pace remains a live threat.
    - Ask management for current production cost curves versus OpenAI, Mistral, and DeepSeek.
  - - Private deployment and compliance readiness
    - Peers match on-prem posture and then out-distribute Upstage
    - Medium-high
    - LG, Mistral, Cohere, and several IDP incumbents all emphasize private or controlled deployment.
    - Test whether Upstage closes materially faster because of its private-deployment package.
  - - Document Parse adjacency
    - IDP incumbents own the automation budget and workflow footprint
    - High
    - ABBYY, UiPath, Hyperscience, and Automation Anywhere all enter through existing document or RPA budgets.
    - Check attach rates when Solar and Document Parse are sold together.
  - - AWS procurement leverage
    - Hyperscaler channels stay non-exclusive and support multiple model vendors
    - Medium
    - AWS presence helps, but cloud marketplaces are also available to rivals or their substitutes.
    - Quantify how much pipeline or ARR originates from AWS-partnered motions.
  - - Estimated domestic market share
    - Share leadership proves less durable than implied because it is based on sparse public data
    - Medium
    - The 35% share figure comes from a single secondary source and is not independently reconciled.
    - Obtain third-party market-share or usage-share data before underwriting moat from share claims.
  notes: Risk severity is an investment-diligence judgment based on public evidence, not a company-provided ranking.
