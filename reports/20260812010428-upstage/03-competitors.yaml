- id: durability-and-switching-costs
  title: The moat is plausible but still more operational than structural
  body: Upstage's moat today comes from the package, not from an irreplaceable monopoly asset. The package includes strong Korean benchmarks, credible single-GPU efficiency, private deployment, document-AI adjacency, and increasing AWS-based enterprise distribution. Those are meaningful advantages, especially for Korean regulated sectors. But the chapter treats them as operational advantages rather than permanent barriers. Naver can always leverage broader proprietary data and user reach. LG can keep pushing industrial domain fit with deeper group-level data access. OpenAI, Anthropic, Google, Mistral, Cohere, and open-weight ecosystems can compress quality and cost gaps quickly. Even DeepSeek matters indirectly because low-cost open-weight competition resets buyer expectations around what should be cheap. That means switching costs are real mainly where Upstage is already embedded into sensitive workflows and compliance reviews, not where the customer is still piloting. The right diligence
    question is therefore not whether Upstage has a moat in the abstract, but whether it can turn benchmark credibility and private deployment into enough production entrenchment before the field normalizes around cheaper, broader substitutes.
