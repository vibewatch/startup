  rows:
  - - Korean-language benchmark strength
    - Among the strongest Korean enterprise-focused models; only Korean model repeatedly described as frontier top 10
    - Naver HyperCLOVA X
    - Upstage has stronger recent benchmark momentum, while Naver retains a larger domestic corpus and distribution base.
  - - Private deployment / sovereignty fit
    - 'High: explicit on-prem, private cloud, and AWS-residency posture'
