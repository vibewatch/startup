evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters-conflict
    missingEvidence: >-
      Public sources do not reconcile whether Upstage's principal Korean base should be described as Seoul, Yongin, or a
      broader remote hub model, and they also vary on the US office city.
    whyItMatters: >-
      Location labeling affects legal-entity diligence, tax nexus, and how investors interpret the company's domestic
      versus international operating footprint.
    diligencePath: >-
      Request legal-entity filings, lease or office records, and a management-confirmed office map covering principal
      place of business and satellite hubs.
    relatedQuestionRefs:
      - QO007
      - QO030
  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      The exact post-Series-C cap table, board rights, and economic terms tied to the National Growth Fund package are
      not public.
    whyItMatters: >-
      Without ownership and governance economics, investors cannot assess dilution, control, or whether sovereign
      capital changes downside protection and exit dynamics.
    diligencePath: >-
      Request the current cap table, shareholder agreements, board materials, and documents describing the sovereign
      capital instrument.
    relatedQuestionRefs:
      - QO029
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: >-
      No public source gives an exact current employee count; official materials stop at 100+ while third-party profiles
      cite higher estimates.
    whyItMatters: >-
      Headcount is a core input for burn, execution capacity, and assessing whether a pre-IPO AI company can support its
      product and go-to-market agenda.
    diligencePath: Request current headcount by function and geography, plus contractor counts and the forward hiring plan.
    relatedQuestionRefs:
      - QO027
  - type: missing-source
    severity: material
    topic: 2026-revenue
    missingEvidence: >-
      Public evidence provides growth-rate snippets and a 2024 ARR data point, but not a clean 2026 revenue or
      profitability number.
    whyItMatters: >-
      A later-stage AI company's IPO readiness depends on revenue quality and path to profitability, not just growth
      percentages and valuation optics.
    diligencePath: >-
      Request audited 2024 and 2025 financials, 2026 year-to-date revenue, gross margin, and profitability or burn
      metrics.
    relatedQuestionRefs:
      - QO031
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Board composition, committee structure, and broader executive-bench responsibilities remain largely undisclosed in
      public materials.
    whyItMatters: Governance depth matters more once a company is taking sovereign capital and preparing for a public listing.
    diligencePath: >-
      Request a governance pack covering the board, committees, officers, independent oversight, and
      conflict-of-interest controls.
    relatedQuestionRefs:
      - QO012
  - type: missing-source
    severity: material
    topic: sovereign-ai-terms
    missingEvidence: >-
      Public sources verify sovereign-AI selection and national backing, but not the exact procurement, GPU-allocation,
      subsidy, or milestone terms attached to that designation.
    whyItMatters: >-
      The commercial and political value of sovereign-AI status depends on how much hard funding, compute access, and
      customer pull it actually guarantees.
    diligencePath: Request the relevant MSIT or growth-fund term sheets, award notices, and any KPI-based disbursement schedules.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: korea-private-llm-denominator
    missingEvidence: >-
      No public source discloses the total dollar size of Korea's private LLM market that would let the reported 35%
      share convert into a clean revenue-pool estimate.
    whyItMatters: >-
      Without the denominator, Upstage's domestic share is directionally useful but cannot anchor a high-confidence SAM
      model.
    diligencePath: >-
      Request market-sizing backup from management or obtain an industry database that quantifies Korean private-LLM
      spending by sector.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM001
  - type: conflicting-data
    severity: material
    topic: tam-overlap
    missingEvidence: >-
      Public market reports do not harmonize the overlap between enterprise LLM and document-AI spend, so additive TAM
      modeling remains approximate.
    whyItMatters: >-
      Headline TAM can be overstated if document understanding and workflow automation are double counted across
      overlapping categories.
    diligencePath: Build a bottoms-up customer-spend model that separates stand-alone document-AI software from LLM platform budgets.
    relatedQuestionRefs:
      - QM017
      - QM018
    relatedTableRefs:
      - TM001
  - type: private-evidence-only
    severity: material
    topic: sector-mix
    missingEvidence: >-
      Public sources do not disclose what share of Upstage's pipeline comes from public-sector buyers versus private
      enterprise accounts.
    whyItMatters: Public procurement can validate the moat but can also lengthen collection cycles and concentration risk.
    diligencePath: Ask management for booked revenue or pipeline by sector, deployment model, and public/private customer type.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: sales-cycle-length
    missingEvidence: >-
      There is little public, Korea-specific evidence quantifying how long regulated enterprise AI procurement takes
      from pilot to production.
    whyItMatters: >-
      Commercial timing determines how much of the macro market Upstage can actually monetize before competitors catch
      up.
    diligencePath: >-
      Interview Korean bank, hospital, and public-sector buyers or collect case studies with explicit procurement
      timelines.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
      - TM004
  - type: stale
    severity: minor
    topic: regulatory-coverage-outside-finance
    missingEvidence: >-
