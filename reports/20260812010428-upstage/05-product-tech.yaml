- id: deployment-trust-and-regulated-sector-fit
  title: Deployment, trust, and regulated-sector fit
  body: 'Upstage’s commercial wedge is inseparable from how it deploys. Public pages emphasize three deployment surfaces at once: hosted APIs, marketplace distribution, and private infrastructure. Solar Pro was launched through Amazon Bedrock Marketplace, Amazon SageMaker JumpStart, and AWS Marketplace, while current pricing pages also position products across API, cloud marketplaces, and on-prem packages. For regulated users, the stronger message is private control. Financial-services and healthcare pages both highlight air-gapped or on-prem operation, auto-masking of sensitive fields, and integration into existing systems rather than rip-and-replace workflows. Studio adds governance features such as retention settings, RBAC, SSO or directory integration, guardrails, and execution monitoring; the on-prem page claims SOC 2, HIPAA, and ISO 27001/27701 coverage. Those are meaningful trust signals, but they remain mostly company-published claims rather than a public deep technical or operational
    trust dossier. In practice, the product looks well shaped for buyers who need data residency, private deployment, and document automation, but the diligence burden remains on independent validation of security controls, SLAs, and benchmark reproducibility.'
