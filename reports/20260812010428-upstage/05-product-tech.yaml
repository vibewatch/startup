  evidenceGaps:
  - type: missing-source
    severity: material
    topic: solar-mini-speed-cost
    missingEvidence: Independent reproducibility materials for the 2.5x speed and 3-8x cost claims versus GPT-3.5 or larger models are not public.
    whyItMatters: Efficiency is central to the investment thesis, so investors need workload assumptions and side-by-side methods rather than only company or profile-level summaries.
    diligencePath: Request benchmark notebooks, prompt sets, latency hardware assumptions, and cost methodology for Solar Mini and successor models.
    relatedQuestionRefs:
    - QE007
  - type: private-evidence-only
    severity: material
    topic: compliance-controls
    missingEvidence: Public pages name SOC 2, HIPAA, ISO 27001 and 27701, RBAC, guardrails, and auditing, but they do not publish detailed control mappings, certifications, or security architecture artifacts.
    whyItMatters: Regulated buyers care about exact scope, recency, inherited controls, and operational procedures, not just marketing-level control labels.
    diligencePath: Request current certificates, trust-center materials, architecture diagrams, data-flow maps, and enterprise security questionnaires.
    relatedQuestionRefs:
    - QE022
  - type: missing-source
    severity: material
    topic: compute-dependency
    missingEvidence: Public materials describe AWS distribution and externally reported GPU expansion, but they do not quantify what portion of model training or serving depends on partner infrastructure versus dedicated internal capacity.
    whyItMatters: Partner dependence affects margin structure, bargaining power, sovereign-AI positioning, and the realism of rapid model-iteration roadmaps.
    diligencePath: Request compute-capacity breakdowns by owned, leased, sovereign-program, and hyperscaler resources, plus model-training utilization plans.
    relatedQuestionRefs:
    - QE027
  - type: missing-source
    severity: material
    topic: ip-moat
    missingEvidence: Beyond the DUS paper, model cards, and company explanations, the public record does not surface a clear patent portfolio or enforceable proprietary boundary around the method.
    whyItMatters: Technical efficiency matters more if it is difficult for peers to replicate or work around.
    diligencePath: Request patent filings, trade-secret boundaries, and legal analysis of how DUS or adjacent training recipes are protected.
    relatedQuestionRefs:
    - QE028
  - type: missing-source
    severity: material
    topic: operational-reliability
    missingEvidence: Public sources do not disclose uptime, latency SLOs, incident postmortems, or support-response metrics for Solar or Studio.
    whyItMatters: Enterprise deployment quality depends on operational reliability, not just benchmark or compliance claims.
    diligencePath: Request SLA documents, incident history, rate-limit policies, latency distributions, and support metrics by product surface.
    relatedQuestionRefs:
    - QE029
  - type: enumeration-incomplete
    severity: minor
    topic: product portfolio table coverage
    missingEvidence: The exact boundary between flagship products, adjacent SKUs like AI Space or Embed, and packaging variants is not fully explicit in current public materials.
    whyItMatters: A complete product map helps distinguish durable commercial platforms from marketing wrappers or bundled features.
    diligencePath: Request a SKU map covering product names, pricing units, GA/beta status, and which items are standalone versus bundled.
    relatedQuestionRefs:
    - QE030
    relatedTableRefs:
    - TE001
