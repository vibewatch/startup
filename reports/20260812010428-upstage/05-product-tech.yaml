- id: TE004
  title: Build vs. buy IP assessment table
  columns:
  - Capability
  - Build / buy / partner
  - Rationale
  - Risk
  rows:
  - - Core Korean and multilingual foundation-model architecture
    - Build
    - Solar family differentiation depends on proprietary training choices such as DUS plus local-language tuning
    - If frontier benchmarks slip, model economics may look less defensible against larger global providers
  - - Japanese localization and go-to-market
    - Partner
    - Syn Pro is explicitly co-developed with Karakuri and positioned around local language and sector fit
    - Partner dependence can dilute margin capture or roadmap control
  - - Document parsing and layout understanding
    - Build
    - Document Parse is the original commercial wedge and central to the stack’s document-native workflow story
    - Independent accuracy and reliability proof is still limited in public materials
  - - Structured key-value extraction
    - Build
    - Information Extract extends the same document moat into operational workflows
    - Less public technical disclosure makes product depth harder to judge from outside
  - - Marketplace distribution and cloud delivery
    - Partner
    - AWS and other marketplaces reduce enterprise procurement friction and bring managed infrastructure
    - Marketplace policy or economics can constrain pricing power and customer ownership
  - - Private deployment, governance, and integration surface
    - Build with selective partner hooks
    - On-prem packaging, API exposure, SSO, and workflow governance are integral to regulated-sector adoption
    - Operational trust is only partially visible until private security review, SLA review, and reference checks
  notes: The moat appears strongest where Upstage builds language-model efficiency, document understanding, and deployment packaging together; the weakest visibility is around how much of that moat is independently proven versus company-described.
