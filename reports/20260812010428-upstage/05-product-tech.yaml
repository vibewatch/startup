- id: TE003
  title: Technology stack and architecture table
  columns:
  - Component
  - Description
  - Differentiation
  - Maturity
  - Risk
  rows:
  - - Depth Up-Scaling (DUS)
    - Training methodology that deepens smaller pretrained transformers and continues pretraining
    - Lets Upstage argue for frontier-competitive capability at smaller parameter counts than dense-model peers
    - Production-proven through Solar 10.7B and later family positioning
    - Public documentation is mostly paper plus company explanation; patent moat visibility is low
  - - Solar model layer
    - Compact-to-frontier LLM family spanning open-weight and API models
    - Combines Korean and Japanese specialization with reasoning and tool-use positioning
    - High for commercial availability; medium for independently verified frontier claims
    - Fast-moving frontier competition can compress relative advantage
  - - Document Parse engine
    - Document understanding layer for PDFs, scans, handwriting, tables, charts, and layouts
    - Moves beyond plain OCR by producing structured representations usable by downstream LLMs
    - High
    - Published metrics are company-disclosed and need independent replication
  - - Information Extract layer
    - Key-value extraction layer for invoices, claims, contracts, and similar business forms
    - Provides structured extraction rather than only parsed text output
    - Medium to high
    - Public materials are lighter on standalone technical detail than Parse
  - - Studio orchestration layer
    - Agent editor, templates, monitoring, and tuning wrapped around document workflows
    - Turns components into auditable document agents instead of one-off API calls
    - Medium to high
    - Public docs do not yet expose deep API schemas, connector details, or SLA history
  - - Deployment and control plane
    - API, marketplace, VPC, private cloud, and on-prem package with governance controls
    - Matches regulated-sector data-residency and network-isolation requirements
    - High
    - Trust surface relies heavily on vendor-published compliance and control claims
  notes: Architecture table distinguishes what is technically surfaced in public materials from where the diligence burden still depends on customer references or private technical review.
