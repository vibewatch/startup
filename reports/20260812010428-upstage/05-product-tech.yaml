chapter:
  number: 5
  title: Product & Technology
  summary: 'Upstage AI now exposes a coherent document-centric stack: compact and frontier-oriented Solar models, Document Parse and Information Extract for unstructured business documents, and Studio for agentic document workflows. The clearest technical strengths are efficient Korean- and Japan-focused model design, flexible private deployment, and tight document-to-agent integration; the main diligence gaps are independent replication of performance claims, the depth of public SLA/compliance evidence, and how much of the compute moat remains partner-dependent.'
sections:
- id: product-portfolio-and-user-workflow
  title: Product portfolio and customer workflow
  body: Upstage AI’s product definition is stronger in workflow terms than in abstract model-marketing terms. The company publicly sells a document-centric enterprise stack rather than a single chatbot API. At the front end, Document Parse converts messy PDFs, scans, spreadsheets, charts, and handwriting into machine-readable HTML or Markdown. Information Extract then pulls structured fields from the parsed output for invoice, claim, contract, and other document-heavy business processes. Solar models provide the reasoning layer, from the older open-weight Solar Mini and Solar Pro family to the newer Solar Pro 2, Solar Preview, Solar Pro 4, and Japan-specific Syn Pro line. Studio sits above those components as the orchestration layer where teams build, deploy, monitor, and tune document agents. That architecture matters because it explains why Upstage shows strongest commercial fit in insurance, healthcare, finance, legal, and similar sectors where the core job is not casual chat but turning
    regulated documents into action, analysis, and workflow outputs with controlled deployment options.
