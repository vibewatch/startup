- id: sovereign-ai-and-korean-market-structure
  title: Sovereign AI and Korean market structure
  body: 'Korea’s AI market structure is unusually shaped by national policy. The state is not merely subsidizing research; it is openly building K-AI, adding GPU capacity, and selecting domestic sovereign-model contenders. That favors local providers that can frame themselves as strategic infrastructure rather than optional SaaS tools. Upstage benefits from that environment because it is both a commercial enterprise vendor and a national-champion candidate, with reported domestic private-LLM share and a role in the five-team sovereign-model field. The competitive field, however, is intense. Naver has data and platform distribution, LG has enterprise and manufacturing depth, SK Telecom has telecom reach plus government credibility, and Kakao retains unrivaled consumer distribution even without the same sovereign-model positioning. Upstage’s advantage is focus: it is the startup specialist built around document-heavy enterprise work and compact model efficiency. Its disadvantage is scale,
    because it competes against conglomerates with larger data estates, channel access, and balance sheets. The Korean-language data scarcity problem sharpens both sides of that equation by making domestic model quality harder to build but also harder for generic foreign models to replicate cleanly.'
