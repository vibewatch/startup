- id: regulation-and-commercialization-constraints
  title: Regulation and commercialization constraints
  body: 'Regulation cuts both ways for Upstage. Korea’s financial-sector AI guidelines and related privacy guidance raise the governance bar by requiring human accountability, explicit oversight, model and data reliability, security controls, and consumer-protection measures. Those obligations slow deployments, because regulated buyers must clear private-data pilots, legal review, security testing, and approval workflows before production rollout. At the same time, the same rules make private deployment, documentation quality, and local support more valuable, which is favorable to a domestic vendor that already sells on-premises and document-processing products. Korea’s reaction to DeepSeek shows the second side of the moat: privacy scrutiny and geopolitical caution can narrow the practical availability of Chinese models in regulated settings. The result is a market with healthy macro tailwinds but slower conversion than headline CAGR numbers imply. Upstage’s most realistic near-term market
    is therefore not the whole sovereign-AI or global-LLM spend pool; it is the subset of Korean and adjacent enterprise workflows where compliance, language specificity, and deployment control matter enough to justify a domestic specialist.'
