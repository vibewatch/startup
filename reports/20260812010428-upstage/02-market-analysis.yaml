- id: TM003
  title: Customer buying decision factors
  columns:
  - Factor
  - Why it matters
  - How Upstage addresses it
  rows:
  - - Korean-language and local-context quality
    - Generic global models often underperform on Korean nuance, local documents, and domain context
    - Solar is positioned as a Korean-optimized enterprise LLM and benefits from local training focus
  - - Private deployment / data residency
    - Banks, hospitals, and public agencies cannot freely send sensitive data to foreign cloud APIs
    - Solar Pro is marketed for on-premises deployment and controlled enterprise environments
  - - Document accuracy on messy inputs
    - Many workflows start with scans, PDFs, invoices, claims, and contracts rather than clean databases
    - Document Parse and Information Extract attack the document-ingestion problem directly
  - - Auditability and human oversight
    - Regulated buyers need explainability, traceability, and accountable final decisions
    - Upstage sells into high-stakes sectors and benefits from document-centric workflow design rather than pure chat UX
  - - Integration into existing operations
    - Enterprise ROI comes from workflow integration, not just model demos
    - Upstage Studio and document agents extend parsing into broader automation flows
  - - Vendor stability and national alignment
    - Large enterprises want suppliers that will survive procurement cycles and policy changes
    - Sovereign-AI positioning, public backing, and pre-IPO scale improve credibility
  - - Total cost / efficiency
    - Compact models and targeted workflows can beat brute-force scaling economics for many enterprise tasks
    - Solar emphasizes enterprise efficiency, while document products monetize focused automation jobs
  notes: This table describes buyer logic rather than disclosed customer mix; it synthesizes product pages, regulatory guidance, and competitive-market reporting.
