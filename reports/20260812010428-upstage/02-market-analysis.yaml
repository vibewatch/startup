  evidenceGaps:
  - type: missing-source
    severity: material
    topic: korea-private-llm-denominator
    missingEvidence: No public source discloses the total dollar size of Korea's private LLM market that would let the reported 35% share convert into a clean revenue-pool estimate.
    whyItMatters: Without the denominator, Upstage's domestic share is directionally useful but cannot anchor a high-confidence SAM model.
    diligencePath: Request market-sizing backup from management or obtain an industry database that quantifies Korean private-LLM spending by sector.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM001
  - type: conflicting-data
    severity: material
    topic: tam-overlap
    missingEvidence: Public market reports do not harmonize the overlap between enterprise LLM and document-AI spend, so additive TAM modeling remains approximate.
    whyItMatters: Headline TAM can be overstated if document understanding and workflow automation are double counted across overlapping categories.
    diligencePath: Build a bottoms-up customer-spend model that separates stand-alone document-AI software from LLM platform budgets.
    relatedQuestionRefs:
    - QM017
    - QM018
    relatedTableRefs:
    - TM001
  - type: private-evidence-only
    severity: material
    topic: sector-mix
    missingEvidence: Public sources do not disclose what share of Upstage's pipeline comes from public-sector buyers versus private enterprise accounts.
    whyItMatters: Public procurement can validate the moat but can also lengthen collection cycles and concentration risk.
    diligencePath: Ask management for booked revenue or pipeline by sector, deployment model, and public/private customer type.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: sales-cycle-length
    missingEvidence: There is little public, Korea-specific evidence quantifying how long regulated enterprise AI procurement takes from pilot to production.
    whyItMatters: Commercial timing determines how much of the macro market Upstage can actually monetize before competitors catch up.
    diligencePath: Interview Korean bank, hospital, and public-sector buyers or collect case studies with explicit procurement timelines.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
    - TM004
  - type: stale
    severity: minor
    topic: regulatory-coverage-outside-finance
    missingEvidence: Finance has the clearest published AI rule set, but healthcare- and public-sector-specific Korean AI controls are less consolidated in accessible English-language sources.
    whyItMatters: Upstage sells into multiple regulated verticals, so incomplete visibility can hide implementation friction outside BFSI.
    diligencePath: Pull Korean-language ministry guidance and sector procurement documents for healthcare and government AI deployments.
