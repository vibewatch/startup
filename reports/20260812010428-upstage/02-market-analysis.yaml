chapter:
  number: 2
  title: Market Analysis
  summary: Upstage is not competing for the whole generative-AI universe; it is targeting the narrower overlap of enterprise LLM deployment, Korean-language sovereignty, and document-heavy workflow automation. That wedge sits inside a fast-growing global market, but the monetizable Korean-language SAM is constrained by regulation, procurement friction, and fierce local competition from larger chaebol-backed model providers.
sections:
- id: market-boundary-and-sizing
  title: Market boundary and sizing
  body: 'Upstage sits at the intersection of two enterprise software budgets rather than inside a single clean market category. The first is enterprise LLM spend: Grand View estimates the global enterprise LLM market at $4.59 billion in 2024 and $5.65 billion in 2025, while Straits Research pegs 2025 at $6.5 billion and highlights sustained 25%+ growth. The second is intelligent document processing, where Grand View and Mordor frame a 2026 market in the low single-digit billions, covering invoices, claims, KYC, contracts, and other structured extraction workflows. Upstage matters because it participates in both pools: Solar addresses the private-deployment and Korean-language enterprise LLM layer, while Document Parse and related document products monetize document-heavy automation directly. The correct TAM is therefore not “all AI.” It is the combined enterprise LLM and document-AI spend that maps to Korean-language, private-deployment, and workflow-automation use cases, with an overlap
    discount because some document understanding budgets are already counted inside enterprise LLM platforms.'
