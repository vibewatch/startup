- id: concentration-risk-and-expansion-path
  title: Concentration risk and expansion path
  body: |-
    Customer concentration is the main unresolved risk. The geography is still Korea-heavy, the strongest vertical proof sits in finance, insurance, government, and manufacturing, and the most strategically important logos are likely large accounts. Hyundai Motor, Kia, and the sovereign-AI mandate are valuable because they de-risk adoption and create reference power, but those same anchors may imply a customer base where a small number of accounts matter disproportionately. Public sources consistently portray Korea as the commercial base and Japan as the main next frontier, with the United States emerging through insurance and workflow-specific references rather than broad go-to-market scale. That is a sensible expansion sequence, but it is not yet diversification at revenue level.

    Commercial momentum is visible, but not evenly verifiable. Third-party sources point to 130%+ annual growth and around 35% share of Korea’s private LLM market, while a public tracker cites 2024 revenue of $25.1 million and a blocked third-party page lists roughly $56.5 million for 2026. Those figures are directionally supportive but not disclosure-grade. The better-supported conclusion is qualitative: Upstage has crossed the threshold from pilot theater into referenceable enterprise adoption, yet still lacks the transparency needed to fully underwrite top-customer exposure, renewal quality, and ex-Korea diversification. In other words, customer quality looks strong; customer mix durability still needs diligence.
