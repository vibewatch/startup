- id: named-customer-proof-and-deployment-depth
  title: Named customer proof and deployment depth
  body: |-
    The strongest part of the chapter is named customer proof. Hanwha Life’s case study goes well beyond a logo: it describes a production workflow over 5 million insurance claims from the prior decade, reports 240,000-plus documents processed per day, and cites 96%+ accuracy. Amwins shows U.S. insurance usage in a live underwriting operation, with 1,100-plus invoices processed in the first month and daily operational throughput. Best Option and TrueAdvance show the same category from a different angle: Upstage becomes the document-intelligence layer inside a lending workflow and replaces three separate tools with one API. Verra, the Korea Press Foundation, Chosun Ilbo, and ConnectWave add proof that the technology is not limited to one vertical or one country.

    That breadth changes the underwriting of the company. Upstage is no longer just claiming that Document AI and Solar can work in enterprise settings; it is publishing measured outcomes in those settings. Importantly, many of these deployments sit in systems where errors have obvious operational costs: underwriting files, medical claims, public-information retrieval, translation at newsroom scale, and schema extraction from sustainability documents. What remains missing is not proof of use. The missing piece is proof of portfolio durability: customer count, cohort retention, contract length, and expansion economics are still undisclosed. So the chapter can verify production relevance, but it cannot yet verify how repeatable the motion is across the whole installed base.
