- id: TU005
  title: Retention and concentration risk table
  columns:
  - Risk area
  - Current evidence
  - Implication
  - Diligence ask
  rows:
  - - Customer-count opacity
    - Public materials show many proof points but no total customer count
    - Logo quality can look strong while base breadth remains unknown
    - Request customer count by segment and geography
  - - Retention opacity
    - No public NRR, GRR, churn, cohort, or renewal disclosure
    - Durability cannot be fully underwritten from case studies alone
    - Request cohort retention and renewal rates for top segments
  - - Top-account concentration
    - Strategic anchors are likely large Korean enterprise or public-sector accounts
    - A few accounts may drive a disproportionate share of ARR
    - Request top 1 / top 5 customer revenue mix and expansion history
  - - Geographic concentration
    - Korea remains the center of gravity; Japan is early and U.S. proof is selective
    - Macroeconomic and policy dependence on Korea remains high
    - Request ex-Korea ARR mix and pipeline conversion
  - - Sector concentration
    - Finance, insurance, government, and manufacturing dominate visible proof
    - Strong fit, but concentration can tighten procurement-cycle dependence
    - Request sector ARR mix and diversification plan
  - - Channel dependence
    - AWS and partner channels improve reach but may shape margin and roadmap power
    - Indirect distribution can help scale while limiting pricing control
    - Request channel-sourced ARR, gross margin, and co-sell contribution
  notes: Risk table translates the current disclosure gaps into diligence actions rather than asserting unseen problems as established facts.
