  topStrengths:
    - Solar LLMs 在 Hugging Face Open LLM Leaderboard 上拿到全球基准可信度
    - 战略投资人阵容很深，覆盖云基础设施（Amazon、AMD）、韩国企业（Hyundai、Kia、SK Networks、KT）和主权 AI 资本，IPO 前的短期融资风险因此下降。
    - Document AI 在保险、金融、医疗等受监管行业形成用例锁定，有具名企业客户，也能本地部署，护城河比 API 商品化竞争对手更宽。
  topRisks:
    - 经审计收入、毛利率、烧钱速度、股权结构表优先权条款和队列留存仍未披露；只靠当前公开数据，很难给 IPO 定价提供扎实支撑。
    - 主权 AI 政策依赖带来双向风险——政府支持推高短期动能，也让执行更容易受韩国政策周期和监管审查影响。
    - 开放权重竞争（Qwen、LLaMA、Mistral、EXAONE）加剧，挤压 API 和 marketplace 收入定价权；DeepSeek 入局已触发监管审查，短期利好 Upstage，却也缩短主权差异化窗口。
    - 市场讨论的 KRW 1.3 trillion–1.6 trillion KOSPI IPO 区间隐含较高收入倍数；只有在上市前证明高质量经常性收入和国际牵引力，估值才站得住。
  unresolvedGaps:
    - 公开渠道拿不到经审计或管理层口径收入、收入分部、毛利率或月度烧钱数据。
    - 股权结构表条款没有公开，包括清算优先权、反稀释条款和内部人士老股仓位。
    - Korea National Growth Fund KRW 560 billion 数字被不同来源写成投资批准、项目承诺或股权；具体工具和时间仍未确认。
    - 国际收入牵引力（日本、美国）仍停留在个案层面——非韩国客户没有披露队列数据、留存数字或合同金额。
