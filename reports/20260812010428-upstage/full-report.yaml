  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segment mix
        blocks:
          - type: paragraph
            body: >-
              Upstage’s customer evidence is much stronger than its consumer-facing brand would suggest. The official
              site is not centered on broad chatbot adoption; it is centered on enterprise document workflows where
              accuracy, compliance, and deployment control matter more than model novelty. The strongest recurring
              pattern is regulated, document-heavy work: insurance claims, underwriting, KYC, audit reporting,
              public-sector search, newsroom translation, healthcare record processing, and manufacturing paperwork.
              That pattern matters because it implies Upstage is selling into buyers with real budgets and painful
              manual processes, not just experimentation budgets. It also explains why the company emphasizes on-prem,
              private cloud, and marketplace deployment. The visible customer mix is therefore not random. It is
              concentrated in segments where Korean-language quality, auditability, and data residency can outweigh the
              scale advantages of hyperscaler APIs.


              Public proof also spans more than one geography or workflow. Korea is still the center of gravity, but the
              roster now includes domestic insurers, a Korean public institution, a major media company, an e-commerce
              platform, and international references such as Verra and Amwins. That breadth is strategically important
              because it shows the company is not dependent on a single flashy logo to prove product-market fit. At the
              same time, the proof remains skewed toward sectors where documents are the wedge. Upstage still looks more
              like a mission-critical workflow vendor for regulated enterprises than a horizontally adopted general AI
              platform. That is a strength for monetization, but it also implies concentration risk if a few regulated
              verticals continue to dominate revenue.
