      - number: '1.4'
        title: Products, milestones, and public-sector role
        blocks:
          - type: paragraph
            body: >-
              Upstage's milestone path shows a company that first won attention through model efficiency and then used
              that credibility to broaden into enterprise workflow automation and sovereign-AI positioning. Solar 10.7B
              reached the top of Hugging Face's Open LLM Leaderboard in December 2023, establishing global visibility
              for the company's depth up-scaling approach. Solar Pro Preview followed in 2024 as a 22B single-GPU model,
              then expanded into AWS marketplaces, and Solar Pro 2 launched in July 2025 as a 31B reasoning and
              tool-using model. In parallel, Document Parse and Information Extract positioned Upstage around documents,
              back-office workflows, and regulated deployment. Public sources also place the company inside Korea's
              sovereign foundation-model effort and K-Moonshot Mission 7. That policy role is strategic, but it also
              raises diligence risk: ahead of IPO, Upstage has already encountered governance scrutiny around political
              ties and technical scrutiny around model originality.
