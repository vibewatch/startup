    title: Financials
    sections:
      - number: '4.1'
        title: Capital base and funding dependency
        blocks:
          - type: paragraph
            body: >-
              Upstage's strongest financial attribute is not public profitability but repeated access to increasingly
              strategic capital. The financing stack has moved from domestic venture investors in 2021, to telecom and
              corporate strategics in 2024, to Amazon, AMD, and Korea Development Bank in the 2025 bridge, and then to
              Hyundai, Kia, and sovereign-style capital in 2026. That progression matters because it suggests buyers,
              infrastructure partners, and policy-linked institutions all see commercial value in Upstage's combination
              of Solar LLMs, document AI, and private deployment. It also means investors are underwriting more than
              software growth: they are funding GPU capacity, sovereign-AI relevance, and a Korea-led IPO narrative. The
              supportive read is that near-term financing risk is low after the Series C and KNGF package. The harder
              read is that public disclosures still do not show cash, burn, or debt, so capital adequacy is visible only
              through fundraising, not through balance-sheet transparency.
