      - number: '7.4'
        title: Mitigations and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The encouraging feature of Upstage's risk profile is that most major risks are monitorable. If sovereign
              status is retained, Korean-language moat metrics keep improving, on-prem and regulated-industry wins
              continue, and Japan/U.S. revenue becomes material before IPO pricing, the current concerns narrow into
              standard scale-up risk. If those milestones do not land, the thesis weakens quickly. The sharpest triggers
              would be loss of sovereign-AI champion status, clear benchmark slippage against frontier foreign
              alternatives without a compensating cost or compliance advantage, evidence that open-weight alternatives
              are collapsing pricing power, and an IPO process that must accept materially worse terms than
              private-round expectations. Investors should therefore treat Upstage as a company with visible mitigants
              but little room for strategic drift: it has to prove that sovereign fit, workflow integration, and
              enterprise trust produce durable economics before market conditions or model commoditization make that
