  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Upstage AI’s product definition is stronger in workflow terms than in abstract model-marketing terms. The
              company publicly sells a document-centric enterprise stack rather than a single chatbot API. At the front
              end, Document Parse converts messy PDFs, scans, spreadsheets, charts, and handwriting into
              machine-readable HTML or Markdown. Information Extract then pulls structured fields from the parsed output
              for invoice, claim, contract, and other document-heavy business processes. Solar models provide the
              reasoning layer, from the older open-weight Solar Mini and Solar Pro family to the newer Solar Pro 2,
              Solar Preview, Solar Pro 4, and Japan-specific Syn Pro line. Studio sits above those components as the
              orchestration layer where teams build, deploy, monitor, and tune document agents. That architecture
              matters because it explains why Upstage shows strongest commercial fit in insurance, healthcare, finance,
              legal, and similar sectors where the core job is not casual chat but turning regulated documents into
              action, analysis, and workflow outputs with controlled deployment options.
