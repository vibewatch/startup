  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing
        blocks:
          - type: paragraph
            body: >-
              Upstage sits at the intersection of two enterprise software budgets rather than inside a single clean
              market category. The first is enterprise LLM spend: Grand View estimates the global enterprise LLM market
              at $4.59 billion in 2024 and $5.65 billion in 2025, while Straits Research pegs 2025 at $6.5 billion and
              highlights sustained 25%+ growth. The second is intelligent document processing, where Grand View and
              Mordor frame a 2026 market in the low single-digit billions, covering invoices, claims, KYC, contracts,
              and other structured extraction workflows. Upstage matters because it participates in both pools: Solar
              addresses the private-deployment and Korean-language enterprise LLM layer, while Document Parse and
              related document products monetize document-heavy automation directly. The correct TAM is therefore not
              “all AI.” It is the combined enterprise LLM and document-AI spend that maps to Korean-language,
              private-deployment, and workflow-automation use cases, with an overlap discount because some document
              understanding budgets are already counted inside enterprise LLM platforms.
