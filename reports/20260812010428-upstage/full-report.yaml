companyProfile:
  summary: >-
    Upstage AI, founded in October 2020 by Sung Kim, Lucy Park, and Stan Lee, is a South Korean enterprise AI company
    built around two linked product families: Solar LLMs (Solar Mini 10.7B and Solar Pro 2 31B) using a proprietary
    depth up-scaling technique, and Document AI tools for parsing and extracting structured data from business
    documents. Target verticals are finance, insurance, healthcare, and manufacturing, with a strong emphasis on private
    and on-premises deployment for data-sovereignty-sensitive customers. By April 2026 the company had closed a KRW 180
    billion Series C first close at above KRW 1 trillion valuation — becoming South Korea's first generative-AI unicorn
    — and subsequently received KRW 560 billion in Korea National Growth Fund support. A KOSPI IPO is being prepared for
    H2 2026.
  foundedDate: '2020-10-01'
  founders:
