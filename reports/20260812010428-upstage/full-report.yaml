  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The Korean enterprise race is defined by distribution versus deployability
        blocks:
          - type: paragraph
            body: >-
              Upstage's closest domestic contest is not against a single startup category but against three very
              different Korean incumbents. Naver brings the country's deepest Korean-language data moat and the broadest
              native distribution through search, commerce, user-generated content, and enterprise tooling. LG brings
              industrial and manufacturing credibility, a growing EXAONE ecosystem, and an explicit on-prem package that
              resonates with large enterprises. Kakao brings unmatched daily consumer reach through KakaoTalk and
              adjacent services, which matters if AI adoption is pulled through existing consumer or SMB workflows.
              Upstage's counter-position is narrower but sharper: it is the most purpose-built Korean enterprise AI pure
              play, with a 31B flagship model, document-processing adjacency, and a private-deployment posture that maps
              directly to regulated buyers. In Korea, that means Upstage wins less by matching Naver or Kakao's traffic
              and more by offering a compliance-friendly, document-centric, enterprise-ready alternative that can slot
              into bank, insurer, healthcare, and manufacturing environments faster than consumer platforms can rewire
              themselves for regulated workflows.
