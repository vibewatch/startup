      - number: '8.4'
        title: The premium depends on sovereign relevance, product monetization, and international proof
        blocks:
          - type: paragraph
            body: >-
              What can expand value from here is visible. Upstage has a more concrete commercial story than many
              frontier-model companies because its Document AI products are already packaged, priced, and deployable
              across API, AWS, and on-prem environments. Official materials also show real customer proof and a broader
              workflow proposition than a bare LLM endpoint. Those are the ingredients that make a sovereign-AI premium
              somewhat believable rather than purely symbolic. Japan matters disproportionately because it is the
              cleanest near-term proof that the company can translate a Korean base into regional enterprise demand.
              What can destroy value is equally visible. KOSPI appetite is not guaranteed, US model progress can
              commoditize a 31B-parameter niche faster than expected, and larger domestic players such as Naver and LG
              can narrow any temporary moat with more capital and distribution. Most importantly, if Upstage cannot show
              that Document AI economics and Solar-based enterprise adoption reinforce one another, the market may stop
              treating it as a scarcity asset and start valuing it more like a specialized but ordinary software
              company. That is the pivot investors should watch.
            claimRefs:
