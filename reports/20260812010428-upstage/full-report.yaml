      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The public leadership story is founder-led and technically credible. Silicon Valley Invest Club identifies
              Sung Kim, Lucy Park, and Stan Lee as the founding trio, with Kim as CEO, Park as CPO, and Lee as CTO. The
              same profile ties them back to Naver's Clova and Papago efforts and, in Kim's case, to prior academic
              leadership at HKUST. That background maps well onto Upstage's current stack: model research, NLP
              productization, and document or visual AI. In diligence terms, the founder-market fit is strong. The
              weakness is disclosure depth. Public materials still do not describe board composition, committees, or
              broader executive coverage beyond the founders. As a result, investors can underwrite technical pedigree
              with reasonable confidence, but not yet the full governance architecture or second-line management bench
              that should support a pre-IPO company.
