      - number: '1.3'
        title: Funding, stage, and stakeholders
        blocks:
          - type: paragraph
            body: >-
              Upstage's financing arc is the clearest explanation for why the company now reads as a pre-IPO unicorn.
              Public sources point to a 2021 Series A, a $72 million Series B in April 2024, a $45 million bridge in
              August 2025 backed by Amazon, AMD, and Korea Development Bank, and then a KRW 180 billion Series C first
              close in April 2026 that moved valuation above KRW 1 trillion. A separate 2026 Korea National Growth Fund
              package or investment approval, reported at KRW 560 billion, reinforces that Upstage has become a
              sovereign-AI capital recipient rather than only a venture-backed startup. The investor mix matters:
              strategic corporates, Korean financial investors, sovereign capital, and cloud or hardware-adjacent names
              all appear around the cap table narrative. The gap is economic clarity. Public materials name investors
              and headline amounts, but not ownership percentages, liquidation terms, or how the sovereign capital is
              instrumented. That asymmetry is especially important because sovereign-AI support may improve execution
              odds while also increasing policy sensitivity. Investors therefore need to separate headline capital
              abundance from the still-unresolved questions about control, governance discipline, and how much of the
              public capital is true equity versus programmatic support.
