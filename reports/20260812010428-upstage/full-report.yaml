    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and positioning
        blocks:
          - type: paragraph
            body: >-
              Upstage enters the file as a South Korean enterprise AI company rather than a consumer chatbot startup.
              Across its homepage, product pages, and third-party profiles, the company is consistently framed around
              two linked product families: Solar, its small-to-mid-sized language model line, and Document AI tools that
              turn messy business documents into structured data and workflow inputs. The target verticals are also
              consistent. Official pages repeatedly highlight finance, healthcare, insurance, and manufacturing, while
              emphasizing private deployment and data sovereignty for customers that cannot ship sensitive records to
              public APIs. What is not consistent is the location story. Official pages speak in terms of South Korean
              roots plus hubs in Seoul, San Francisco, and Tokyo, while third-party databases add San Jose, Yongin, Hong
              Kong, and Palo Alto. That makes the commercial identity clear but leaves the exact legal or operating
              headquarters map unresolved.
