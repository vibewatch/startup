      - number: '3.3'
        title: Document AI expands the battlefield beyond LLM vendors alone
        blocks:
          - type: paragraph
            body: >-
              Upstage is unusually exposed to document-workflow competition because Document Parse gives the company a
              second buying center beyond model APIs. That helps, but it also means Upstage must contend with dedicated
              IDP and automation incumbents such as ABBYY, Hyperscience, UiPath, and Automation Anywhere. Those vendors
              enter procurement from the opposite direction: they already sit inside enterprise document, RPA, or
              back-office automation budgets and can add generative-AI capabilities without asking the customer to
              switch platform categories. This is especially important in insurance, finance, and healthcare, where the
              immediate budget owner may care more about straight-through document processing than about which
              foundation model sits underneath. The status quo alternative is also real. Enterprises can assemble open
              models, OCR or IDP modules, and internal workflows themselves. Upstage therefore benefits when a buyer
              wants one integrated Korean enterprise stack, but it loses leverage whenever document automation is
              treated as just another interchangeable component in a broader internal-build architecture.
            claimRefs:
              - CP032
              - CP033
              - CP034
              - CP035
              - CP036
              - CP037
              - CP045
      - number: '3.4'
        title: The moat is plausible but still more operational than structural
        blocks:
          - type: paragraph
            body: >-
              Upstage's moat today comes from the package, not from an irreplaceable monopoly asset. The package
              includes strong Korean benchmarks, credible single-GPU efficiency, private deployment, document-AI
              adjacency, and increasing AWS-based enterprise distribution. Those are meaningful advantages, especially
              for Korean regulated sectors. But the chapter treats them as operational advantages rather than permanent
              barriers. Naver can always leverage broader proprietary data and user reach. LG can keep pushing
              industrial domain fit with deeper group-level data access. OpenAI, Anthropic, Google, Mistral, Cohere, and
              open-weight ecosystems can compress quality and cost gaps quickly. Even DeepSeek matters indirectly
              because low-cost open-weight competition resets buyer expectations around what should be cheap. That means
              switching costs are real mainly where Upstage is already embedded into sensitive workflows and compliance
              reviews, not where the customer is still piloting. The right diligence question is therefore not whether
              Upstage has a moat in the abstract, but whether it can turn benchmark credibility and private deployment
              into enough production entrenchment before the field normalizes around cheaper, broader substitutes.
            claimRefs:
              - CP006
              - CP013
