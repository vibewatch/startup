              The unit-economics story is promising but still inferred rather than disclosed. Upstage's smaller-model
              positioning and Seoulz's reported 3-8x inference-cost advantage suggest a better cost posture than
              frontier-scale models that need much larger inference footprints. At the same time, management has
              publicly directed new capital toward GPU infrastructure, overseas hiring, and continued model R&D, which
              means the business is still capital intensive enough that gross margin and burn cannot be guessed safely
              from software analogies alone. The most realistic finance view is therefore mixed: regulated on-prem deals
              and enterprise document workflows can produce large, sticky contracts, but they can also lengthen sales
              cycles and increase implementation content. That ambiguity feeds directly into valuation sensitivity. If
              the H2 2026 IPO arrives near the 2-3 trillion won range discussed in public coverage, investors will
