            body: >-
              The technical core of Upstage’s differentiation is efficiency, not maximal parameter count. Solar Mini
              established the pattern by pairing a 10.7B model with the proprietary Depth Up-Scaling method, which the
              company and the arXiv paper describe as depthwise scaling plus continued pretraining rather than a
              mixture-of-experts design. Official and developer-facing sources tie that method to compact performance,
              open-weight release, and strong leaderboard placement. Solar Pro and Solar Pro 2 then extend the same
              thesis into single-GPU or relatively compact enterprise models with structured-output, multilingual,
              reasoning, and tool-use narratives aimed at production business tasks. On the document side, Document
              Parse and Information Extract are not described as generic OCR utilities; the public materials repeatedly
              frame them as layout-aware and workflow-ready systems for transforming invoices, claims, medical records,
              and contracts into LLM-ready inputs or structured key-value outputs. Studio closes the loop by treating
              those capabilities as composable agent steps rather than disconnected APIs. The overall technical story is
              therefore coherent: compact model architecture, document understanding, and orchestration are meant to
