      - number: '2.2'
        title: Buyer demand and document workflows
        blocks:
          - type: paragraph
            body: >-
              The strongest near-term demand is not from generic chatbot buyers. It comes from enterprises that handle
              high volumes of sensitive documents and need Korean-language accuracy, auditability, and deployability
              inside controlled environments. Upstage’s own product surfaces emphasize document parsing for PDFs, scans,
              and emails; structured extraction for invoices, claims, and contracts; and industry solutions for
              insurance, healthcare, financial services, and manufacturing. Those sectors share the same buying logic:
              the budget owner is usually a CIO, CTO, digital transformation leader, operations owner, or compliance
              sponsor rather than an end user, and the adoption trigger is a painful document workflow that cannot be
              solved with a general public API alone. Solar’s enterprise positioning and on-premises option matter
              because these buyers need model quality and groundedness, but also data residency, system integration, and
              traceability. That makes Upstage’s Document AI heritage strategically useful: document work is not just an
              adjacent product line but a customer-acquisition wedge into broader enterprise AI deployments.
