      - number: '8.5'
        title: Track, with a fair-to-stretched stance until disclosures tighten the range
        blocks:
          - type: paragraph
            body: >-
              The chapter’s recommendation is Track with medium confidence and a high risk rating. That is not a
              judgment that the company is weak. It is a judgment that the price discussion is moving faster than the
              disclosure discussion. Upstage has enough evidence of product breadth, policy relevance, and market
              momentum to deserve continued attention and a real premium to median SaaS. It does not yet have enough
              public evidence on unit economics, cap-table terms, or international cohort durability to justify a strong
              buy call at a live private mark that may already be around KRW 1.3 trillion to KRW 1.6 trillion and could
              be marketed much higher into IPO. Put differently, the anti-thesis is still too well supported. If the
              next refresh surfaces audited or management-grade revenue segmentation, gross margin, retention, and IPO
              terms, the stance could upgrade quickly because the bull case is plausible. If instead the story remains
              promotional while the valuation pushes toward the most aggressive Korean IPO narratives, the stance should
              flip from fair-to-stretched to expensive. The right diligence posture today is therefore disciplined
              curiosity: stay close, but do not underwrite away the missing facts.
