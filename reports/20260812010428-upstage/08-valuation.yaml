company:
  name: Upstage AI
chapter:
  number: 8
  title: Valuation
  summary: Upstage already trades like a premium AI asset on trailing ARR, but the current unicorn mark looks closer to fair-to-stretched than obviously expensive if growth holds. Public evidence supports a current base case around $0.75B-$1.0B, a bull case above $1.5B on IPO rerating, and a Track recommendation until disclosures improve.
sections:
- id: current-valuation-anchors
  title: Current valuation anchors are real, but still noisy
  body: 'Public evidence does support a clear headline: Upstage has already crossed into unicorn territory. The April 2026 Series C first close at roughly KRW 180 billion is well corroborated, and the same reporting wave framed the company as worth more than KRW 1 trillion. The strategic overlay matters too. Korea’s National Growth Fund context and sovereign-AI backing are not normal late-stage startup signals; they lower financing-risk perception and can support a scarcity premium in a domestic market that wants a national AI champion. At the same time, the exact private mark is still fuzzier than the unicorn label suggests. Independent outlets talk about current values ranging from roughly KRW 1.3 trillion to KRW 1.6 trillion, while the most promotional IPO previews stretch as high as KRW 3.5 trillion to KRW 5 trillion. That spread is itself a valuation fact: it means the market is underwriting narrative and strategic positioning faster than it is underwriting audited disclosure. For a
    diligence-grade chapter, the right move is to anchor on the best-supported current range and treat the most bullish figures as scenario endpoints rather than as fair value today.'
