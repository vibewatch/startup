- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Why it matters
  - Action implication
  rows:
  - - IPO valuation marketing runs beyond base-case economics
    - Live mark or IPO range moves into the 3.5T-5T narrative without new disclosure
    - Turns a fair-to-stretched case into an expensive one
    - Step back until disclosures or price reset
  - - International pipeline fails to convert
    - Japan and US expansion remain case-study heavy with weak paid production evidence
    - Bull case loses its main rerating engine
    - Keep stance at Track or downgrade
  - - Software multiples compress again
    - Public AI/software leaders re-rate sharply lower
    - Upstage loses support from comp set even with solid execution
    - Tighten bear-case probability
  - - Retention or gross-margin data disappoint
    - Cohorts show weak expansion or inference economics
    - AI-native premium thesis breaks at the unit-economics layer
    - Rebase valuation toward ordinary software
  - - Preference stack proves punitive
    - Hidden terms give insiders superior downside protection
    - Headline EV no longer maps to new-investor return potential
    - Avoid regardless of story quality
  notes: These are the discrete events most likely to break the valuation thesis rather than merely slow it.
