- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Cap table and preferences
    - Preferred stack, liquidation waterfall, option pool, and anti-dilution protections
    - Determines whether the headline mark is investable for a new buyer
    - Request legal and financing documents
  - - Verified 2026 revenue outlook
    - Management plan or analyst model with methodology for the mid-$50M case
    - Forward revenue is the cleanest lens for price discipline
    - Obtain budget, board deck, or working financial model
  - - Unit economics
    - Gross margin, inference-cost trend, CAC payback, and NRR / renewals
    - Separates a durable AI premium from a narrative premium
    - Request cohort and margin schedules by product
  - - IPO mechanics
    - Bookbuilding range, cornerstone orders, expected float, and lock-up
    - Supply overhang can dominate early public-market returns
    - Review underwriter materials once filed
  - - International customer proof
    - Named production customers and paid usage in Japan and the US
    - Bull case depends on exportable demand, not only local champion status
    - Ask for references, contracted volumes, and renewal data
  notes: These asks are the shortest path to turning a wide narrative-driven range into an investable valuation call.
