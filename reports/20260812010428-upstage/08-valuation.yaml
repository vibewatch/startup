  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table
    missingEvidence: A current cap table showing preferred share stack, liquidation preferences, employee option dilution, and any anti-dilution terms tied to the Series C and pre-IPO rounds.
    whyItMatters: Private-market valuation can look fair on headline EV while still being unattractive for a new investor if preferences or stacked liquidation rights are heavy.
    diligencePath: Request the latest cap table, term sheet, and shareholder rights summary from management or lead counsel.
    relatedQuestionRefs:
    - QV035
    - QV046
    relatedTableRefs:
    - TV006
  - type: access-blocked
    severity: material
    topic: forward-revenue
    missingEvidence: A directly reviewable source for the chapter’s 2026 revenue planning case rather than an inaccessible or broken profile page.
    whyItMatters: Forward-revenue valuation is the cleanest way to compare Upstage with software and AI peers, but the precise 2026 number is still model-based rather than publicly verified.
    diligencePath: Obtain management guidance, board materials, or a functioning analyst profile with methodology notes; otherwise treat the $56.5M case as only a scenario input.
    relatedQuestionRefs:
    - QV010
    - QV046
    relatedTableRefs:
    - TV001
    - TV003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, inference cost trend, customer payback, and any net-revenue-retention or renewal disclosures by product line.
    whyItMatters: These metrics determine whether Upstage deserves an AI-native premium or should revert toward ordinary SaaS multiples as growth decelerates.
    diligencePath: Request cohort retention, gross-margin bridges, and customer-level expansion data for Solar and Document AI separately.
    relatedQuestionRefs:
    - QV037
    relatedTableRefs:
    - TV004
    - TV006
  - type: missing-source
    severity: material
    topic: ipo-terms
    missingEvidence: Bookbuilding range, cornerstone allocations, and expected 6-12 month lock-up provisions for major investors ahead of listing.
    whyItMatters: IPO liquidity, supply overhang, and insider sell pressure can overwhelm a theoretically fair valuation range in the first year after listing.
    diligencePath: Obtain underwriter materials from KB Securities and Mirae Asset or review the eventual listing prospectus when filed.
    relatedQuestionRefs:
    - QV005
    - QV035
    relatedTableRefs:
    - TV003
    - TV005
  - type: enumeration-incomplete
    severity: minor
    topic: local-public-comps
    missingEvidence: A directly comparable listed Korean generative-AI issuer with disclosed revenue and margins.
    whyItMatters: Without a local public peer, Upstage’s valuation discussion must triangulate across global private AI names and US software comps that differ in scale, geography, and disclosure.
    diligencePath: Refresh the comp set once Upstage files or if another Korean generative-AI company lists with meaningful disclosure.
    relatedQuestionRefs:
    - QV022
    relatedTableRefs:
    - TV002
  - type: stale
    severity: material
    topic: customer-proof
    missingEvidence: Named enterprise customers, live production volumes, and renewal or expansion evidence for the US and Japan pipelines.
    whyItMatters: The bull case depends on international commercialization, but current public proof still leans more on case studies and policy narrative than on repeat revenue cohorts.
    diligencePath: Request customer references, production contract counts, and regional pipeline conversion metrics before underwriting the IPO rerating.
    relatedQuestionRefs:
    - QV025
    - QV037
    relatedTableRefs:
    - TV004
    - TV006
