- id: scenarios-and-dcf
  title: Scenario analysis is more honest than a point estimate
  body: The range is wide because Upstage is balancing two different underwriting stories at once. One story is a Korean sovereign-AI champion with product-market proof in document workflows, a credible Japan expansion angle, and enough growth to re-rate sharply into IPO. The other is a still-private company whose most important value drivers — cohort retention, gross margin, preference stack, and the exact composition of revenue between Document AI and Solar — remain undisclosed. That is why a scenario framework is more credible than a single “right” number. The base case assumes that the current unicorn mark is broadly fair and that the next step up depends on more disclosure, not just more enthusiasm. The bull case assumes Japan and US commercialization compound with policy support and make a $1.5B-plus outcome defensible, with the public-market IPO window doing additional work. The bear case assumes delays, multiple compression, and deteriorating confidence in independent non-US model
    vendors. A rough DCF lens does not rescue precision, but it does show that today’s public evidence can support a broad valuation band that overlaps with the present private mark. The real question is not whether Upstage deserves a range. It does. The question is how much of the future IPO upside is already embedded before investor-grade operating disclosure arrives.
