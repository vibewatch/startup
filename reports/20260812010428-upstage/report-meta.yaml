  topStrengths:
    - Solar LLMs achieved global benchmark credibility (Hugging Face Open LLM Leaderboard #1, Dec 2023) on a fraction of frontier model size and cost, supporting a differentiated efficiency narrative.
    - Deep strategic investor syndicate spanning cloud infrastructure (Amazon, AMD), Korean corporates (Hyundai, Kia, SK Networks, KT), and sovereign-AI capital, reducing near-term financing risk before IPO.
    - Document AI use-case lock-in in regulated sectors (insurance, finance, healthcare) with named enterprise customers and on-prem deployment optionality that widens moat against API-commodity competitors.
  topRisks:
    - Audited revenue, gross margin, burn rate, cap-table preference terms, and cohort retention remain undisclosed, making precise IPO price support analytically weak on current public data.
    - Sovereign-AI policy dependence creates bilateral risk — government support boosts near-term momentum but increases execution sensitivity to Korean policy cycles and regulatory oversight.
    - Intensifying open-weight competition (Qwen, LLaMA, Mistral, EXAONE) compresses pricing power for API and marketplace revenue, and DeepSeek's entry has already triggered regulatory scrutiny that benefits Upstage but also shortens the sovereign differentiation window.
    - A KOSPI IPO at the KRW 1.3 trillion–1.6 trillion range being discussed publicly implies revenue multiples that are only defensible if the company can show high-quality recurring revenue and international traction before listing.
  unresolvedGaps:
    - No audited or management-grade revenue disclosure, revenue segment split, gross margin, or monthly burn accessible through public sources.
    - Cap-table terms including liquidation preferences, anti-dilution provisions, and insider secondary positions are not publicly disclosed.
    - Korea National Growth Fund KRW 560 billion figure is variously reported as an investment approval, a programmatic commitment, or equity; the exact instrument and timing are unconfirmed.
    - International revenue traction (Japan, US) remains anecdotal — no cohort data, retention figures, or contract values have been disclosed for non-Korean customers.
