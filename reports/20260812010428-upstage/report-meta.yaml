companyProfile:
  summary: >-
    Upstage AI, founded in October 2020 by Sung Kim, Lucy Park, and Stan Lee, is a South Korean enterprise AI company built around two linked product families: Solar LLMs (Solar Mini 10.7B and Solar Pro 2 31B) using a proprietary depth up-scaling technique, and Document AI tools for parsing and extracting structured data from business documents. Target verticals are finance, insurance, healthcare, and manufacturing, with a strong emphasis on private and on-premises deployment for data-sovereignty-sensitive customers. By April 2026 the company had closed a KRW 180 billion Series C first close at above KRW 1 trillion valuation — becoming South Korea's first generative-AI unicorn — and subsequently received KRW 560 billion in Korea National Growth Fund support. A KOSPI IPO is being prepared for H2 2026.
  foundedDate: '2020-10-01'
  founders:
    - name: Sung Kim
      role: CEO and Co-founder
      background: Former head of Naver's Clova AI research division and prior academic leadership at HKUST.
      claimRefs: [CO010, CO011]
    - name: Lucy Park
      role: CPO and Co-founder
      background: Naver Clova and Papago NLP background underpinning product and research leadership.
      claimRefs: [CO012]
    - name: Stan Lee
      role: CTO and Co-founder
      background: Former Naver Clova researcher with model development and visual AI expertise.
      claimRefs: [CO013]
  foundingLocation: South Korea
  headquarters: Seoul, South Korea
  productSummary: >-
    Upstage sells Solar LLMs (API, marketplace, and on-premises deployment), Document Parse and Information Extract for structured document workflows, AI Space for document-based knowledge work, and Studio for no-code document AI agent building.
  customerFocus: >-
    Enterprises in regulated industries — finance, insurance, healthcare, and manufacturing — plus public-sector and sovereign-AI deployments requiring private or on-prem deployment.
  businessModel: >-
    Hybrid monetization: API pay-per-use and prepaid commitment tiers, enterprise custom contracts, on-premises deployment licenses, marketplace distribution (AWS, Azure, Snowflake), and workflow product subscriptions.
  stage: Series C pre-IPO unicorn
  fundingStatus: >-
