- id: disclosure-gaps-and-diligence-blockers
  title: Disclosure gaps and diligence blockers
  body: |-
    For diligence purposes, the central weakness is not a lack of fundraising or product monetization, but a lack of board-grade financial disclosure. Public sources do not provide cash on hand, monthly burn, runway months, gross margin, EBITDA, debt obligations, product-level revenue split, or customer concentration. Even simple scale markers remain fuzzy: the official website says 100+ team members, while Growjo estimates 165 employees, and no source breaks out Korea versus international revenue. The filing channel is also thin for a private-company underwrite; DART is Korea's public filing repository, but the reviewed source set did not surface audited Upstage financials comparable to a listed issuer's revenue and profit disclosure. That leaves this chapter with a clear verdict. Upstage likely has enough capital to pursue the sovereign-AI and enterprise-document thesis through an IPO window, but investors still need a private-data room to evaluate revenue quality, margin durability, and the degree to which future results depend on Korean public-sector and domestic enterprise concentration.
