- id: TI005
  title: Capital adequacy and financing dependency
  columns:
  - Lever
  - Public signal
  - Underwriting implication
  - Diligence ask
  rows:
  - - Strategic syndicate quality
    - Amazon, AMD, Hyundai, Kia, KT, SK Networks, and KDB appear in disclosed rounds
    - Capital comes with potential channel, infrastructure, and customer validation
    - Request evidence of commercial commitments tied to strategic investors
  - - Sovereign-capital overlay
    - KNGF and Strategic Industries Fund materially expand available capital
    - Near-term financing risk falls, but policy dependence rises
    - Clarify whether the package is equity, staged program funding, or mixed vehicles
  - - GPU expansion plan
    - Series C proceeds explicitly target GPU infrastructure and model R&D
    - Runway quality depends on compute procurement efficiency, not just cash raised
    - Request capex / opex split for model training and inference infrastructure
  - - Regulated-enterprise mix
    - On-prem, insurance, financial-services, and document-heavy workflows dominate public messaging
    - Potential for large ACVs and retention, but longer sales cycles and services load
    - Request cohort-level payback, implementation effort, and realized gross margin by deployment type
  - - Domestic concentration risk
    - Most disclosed customers, investors, and policy support are Korea-centered
    - IPO story needs proof that U.S./Japan expansion can diversify revenue
    - Request revenue split by Korea, Japan, U.S., and public-sector accounts
  notes: Capital adequacy is interpreted through the financing stack and disclosed uses of funds because no public cash-flow statement or runway disclosure is available.
