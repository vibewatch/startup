    rows:
      - - 韩语基准实力
        - 面向韩国企业的模型中属于最强梯队；也是唯一反复被描述为前沿前 10 的韩国模型
        - Naver HyperCLOVA X
        - Upstage 近期基准动能更强，但 Naver 仍有更大的本土语料库和分发基础。
      - - 私有部署 / 主权适配
        - 高：明确支持本地部署、私有云和 AWS 数据驻留姿态
        - LG EXAONE
        - 部署姿态大致相当；Upstage 看起来更有创业公司敏捷性，LG 则握有更大的企业关系。
      - - 工业或制造行业触达
        - 中等
        - LG EXAONE
        - LG 仍保有更强的自有工业数据和制造切入口。
      - - 消费者分发触达
        - 低到中等
        - Kakao 或 Naver
        - Upstage 在日活用户分发上明显落后两家既有玩家，必须靠企业 ROI 取胜。
      - - 全球前沿广度
        - 原始通用能力广度低于 OpenAI、Anthropic 和 Google
        - OpenAI GPT-4o
        - Upstage 靠本地化和效率竞争，不靠广泛能力上的绝对领先。
      - - 美国 API 的开放权重 / 私有企业替代方案
        - 在韩国厂商中较强
        - Mistral 或 Cohere
        - Upstage 在韩语任务上有本地优势；Mistral 和 Cohere 的全球主权企业品牌更强。
      - - 文档工作流相邻能力
        - 强：Solar 加 Document Parse 位于同一栈
        - UiPath 或 ABBYY
        - Upstage 的 LLM 集成更紧，但既有玩家掌握更成熟的自动化预算和流程据点。
