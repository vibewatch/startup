      - number: '7.4'
        title: 缓释措施与投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              Upstage 风险画像里较积极的一点是，大多数主要风险都能跟踪。如果主权地位保住，韩语护城河指标继续改善，本地部署和受监管行业客户持续落地，日本 / 美国收入在 IPO
              定价前变得可观，那么当前担忧会收窄为标准的扩张期风险。反过来，如果这些里程碑没有兑现，投资逻辑会很快变弱。最尖锐的触发点包括：失去主权 AI
              冠军地位；相对海外前沿替代品的基准明显滑坡，又没有成本或合规优势补偿；开放权重替代品压垮定价权的证据；以及 IPO 流程不得不接受明显差于私募轮预期的条款。因此，投资者应把 Upstage
              视为一家缓释因素清晰、但几乎没有战略漂移空间的公司：它必须先证明主权适配、工作流集成和企业信任能带来耐久经济性，否则市场条件或模型商品化会让这个故事更难讲。
