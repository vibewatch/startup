  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 股权结构表与优先权
        - 优先股堆叠、清算瀑布、期权池和反稀释保护
        - 决定头部估值对新买方是否可投
        - 索取法律和融资文件
      - - 经验证的 2026 年收入展望
        - 管理层计划或分析师模型，并说明中位 $50M 情景的方法论
        - 前瞻收入是约束价格纪律最干净的视角
        - 获取预算、董事会材料或工作版财务模型
      - - 单位经济性
        - 毛利率、推理成本趋势、CAC 回本周期、NRR / 续约
        - 区分可持续 AI 溢价和叙事溢价
        - 按产品索取队列和利润率明细
      - - IPO 机制
        - 簿记区间、基石订单、预期流通盘和禁售期
        - 供应压力可能主导早期公开市场回报
        - 申报后审阅承销商材料
      - - 国际客户验证
        - 日本和美国的具名生产客户与付费使用
        - 乐观情景依赖可出口需求，而不只是本土冠军地位
        - 索取客户证明、合同量和续约数据
    notes: 这些问题是把叙事驱动的宽区间，压缩成可投资估值判断的最短路径。
