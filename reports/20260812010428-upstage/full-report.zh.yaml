  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Upstage 有连贯的技术楔子，但它位于 AI 技术栈中最残酷的部分。Solar Pro 2 是 31B 模型，定位为面向韩国企业工作负载的近前沿模型；Solar Mini 和 Solar Open
              则强调效率与可部署性，而不是纯规模。只要客户继续把韩语质量、本地部署、可预测成本和工作流集成，看得比绝对基准领先更重要，这一策略就成立。风险在于，前沿实验室可能持续拉大原始能力差距，速度快到让部分韩国企业愿意接受外国模型或云依赖，换取更强推理、工具和智能体表现。第二个压力点是商品化：Llama、Qwen
              和 DeepSeek 都在持续发布能力足够的开放或低成本模型，让单靠基准分数防守模型定价变得更难。因此，Upstage 真正的缓释因素不只是「更好的权重」，而是一整套受监管行业适配、Document AI
              集成、微调支持和数据主权部署选项。这是有意义的护城河，但它是商业和执行型的，不是永久的。
