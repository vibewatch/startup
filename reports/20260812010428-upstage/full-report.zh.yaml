        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开领导层叙事由创始人主导，技术可信度也足。Silicon Valley Invest Club 将 Sung Kim、Lucy Park 和 Stan Lee 确认为创始三人组，Kim 任 CEO，Park 任
              CPO，Lee 任 CTO。同一资料还把他们追溯到 Naver 的 Clova 和 Papago 项目，Kim 还曾在 HKUST 担任学术领导职务。上述背景与 Upstage
              当前技术栈高度匹配：模型研究、NLP 产品化，以及文档或视觉
              AI。按尽调口径，创始人与市场的匹配度强。短板在披露深度。公开材料仍没有说明董事会构成、委员会设置，也没有覆盖创始人之外的更完整高管层。因此，投资人可以较有信心地承销技术履历，但还不能承销一家 IPO
              前公司应具备的完整治理架构和第二梯队管理层。
