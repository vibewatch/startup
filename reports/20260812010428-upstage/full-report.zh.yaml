    layout: wide
    summary: Upstage 的价值叙事从常规风投融资，跃升到独角兽级定价，并在 2026 年进入 IPO 叙事膨胀。
    data:
      items:
        - date: '2021'
          label: Series A 轮
          note: KMJ 称 Upstage 在 Series A 轮融资 KRW 31.6B。
        - date: '2024'
          label: Series B 轮
          note: KMJ 称 Series B 增加 KRW 100B，随后又有 KRW 62B 过桥融资。
        - date: 2026-04
          label: Series C 首次交割
          note: 公开报道显示融资约 KRW 180B，估值超过 KRW 1T。
        - date: 2026-05
          label: 战略基金信号
          note: National Growth Fund 关联资金包带来战略资本支持和政策光环。
        - date: 2026-H2
          label: IPO 目标
          note: 共识预期集中在 KRW 2T-3T，部分韩国本地评论给出更高区间。
