  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与细分组合
        blocks:
          - type: paragraph
            body: >-
              Upstage
              的客户证据，比其面向消费者的品牌感要强得多。官网并不围绕广泛聊天机器人采用，而是围绕企业文档工作流：准确性、合规和部署控制比模型新鲜感更重要。最强的重复模式是受监管、文档密集型工作：保险理赔、承保、KYC、审计报告、公共部门搜索、新闻编辑部翻译、医疗记录处理和制造业文书。这一模式很重要，因为它意味着
              Upstage
              卖给的是有真实预算、手工流程痛点强的买方，而不只是实验预算。它也解释了公司为何强调本地部署、私有云和市场平台部署。因此，可见客户组合并非随机，而是集中在韩语质量、可审计性和数据驻留可以压过超大规模云 API
              规模优势的细分市场。


              公开证明也跨越不止一个地区或工作流。韩国仍是重心，但客户名单已包括国内保险公司、一家韩国公共机构、一家大型媒体公司、一个电商平台，以及 Verra 和 Amwins
              等国际案例。这种广度具备战略意义，因为它显示公司不依赖单一亮眼客户标识来证明产品市场匹配。与此同时，证明仍偏向以文档为楔子的行业。Upstage
              看起来仍更像面向受监管企业的关键任务工作流供应商，而不是横向采用的通用 AI 平台。这有利于变现，但如果少数受监管垂直行业继续主导收入，也意味着集中度风险。
