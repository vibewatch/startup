      - number: '7.2'
        title: 主权项目与运营集中度风险
        blocks:
          - type: paragraph
            body: >-
              Upstage 受益于韩国主权 AI 推进，但这份支持也是它最大的单点依赖之一。公司作为唯一的风投阶段幸存者，推进到主权模型锦标赛后续阶段；但赛制明确是淘汰型：五个联盟入场，三支通过第一轮筛选，2026
              年预计进行第二阶段评审，到 2027 年只应留下两个冠军。这创造了不同于普通企业软件创业公司的风险画像。Upstage
              同时在市场中竞争、为政府合法性竞争，也在争夺稀缺算力。运营基本盘也集中：多个来源将韩国描述为收入锚点，而日本和美国扩张仍是证明点，不是已建立的对冲。人员侧，公司仍只有约 100+ 名员工，并与创始人 CEO
              Sung Kim 高度绑定，因此要为 IPO 足够快地扩团队、补管理层梯队和搭建上市公司流程，是实打实的执行门槛。因此，Upstage
              的运营挑战不只是做出更好的模型，而是在保住国家支持动能的同时，不被这股动能绑架。
