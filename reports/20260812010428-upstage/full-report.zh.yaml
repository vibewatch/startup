  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 韩国企业赛道由分发能力与部署能力共同定义
        blocks:
          - type: paragraph
            body: >-
              Upstage 最接近的国内竞争，不是单一创业公司类别，而是三个很不同的韩国既有企业。Naver 带来韩国最深的韩语数据护城河，并通过搜索、电商、用户生成内容和企业工具拥有最广的本土分发。LG
              带来工业和制造可信度、不断扩大的 EXAONE 生态，以及能打动大型企业的明确本地部署包。Kakao 通过 KakaoTalk 和相邻服务拥有无可匹敌的日活消费者触达；如果 AI 采用由现有消费者或 SMB
              工作流拉动，这一点很重要。Upstage 的反向定位更窄但更锋利：它是最为专门化的韩国企业 AI 纯玩家，拥有 31B 旗舰模型、文档处理相邻能力，以及直接映射受监管买方的私有化部署姿态。在韩国，这意味着
              Upstage 不是靠匹配 Naver 或 Kakao 的流量取胜，而是提供一个合规友好、以文档为中心、企业就绪的替代方案，能比消费者平台更快插入银行、保险、医疗和制造环境，而后者还需要为受监管工作流重接系统。
