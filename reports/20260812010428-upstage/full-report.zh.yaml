        - 法国
        - 前沿主权式基础模型公司
        - 2026 年画像 $23B / 2024 年 6 月里程碑 $6B
        - 基于标题口径的 2026 年 ARR 估计约 $400M
        - 按当前画像约 57.5x ARR；单看 2024 年里程碑，相对规模更贵
        - 最接近的私有主权 LLM 溢价参照，但全球融资通道大得多
      - - Cohere
        - 加拿大
        - 面向企业的基础模型与平台供应商
        - 2025 年轮次估值 $6.8B-$7.0B
        - 2025 年 ARR 约 $240M
        - ~29.2x ARR
        - 商业化组合上最接近的企业 AI 可比公司，但规模更大、资金更足
      - - OpenAI
        - 美国
        - 同时具备消费者与企业规模的前沿 AI 平台
        - 2026 年 3 月投后估值 $852B
        - 按每月 $2B 表述年化，收入约 $24B
        - 约 35.5x 收入
        - 可用于衡量稀缺性溢价，但规模和治理结构使它更像上限，而非直接可比对象
      - - Snowflake
