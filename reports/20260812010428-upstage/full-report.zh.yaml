    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与定位
        blocks:
          - type: paragraph
            body: >-
              Upstage 进入本报告时，更像一家韩国企业 AI 公司，而不是消费级聊天机器人创业公司。无论官网、产品页还是第三方资料，公司都被稳定地放在两条相连的产品线里：Solar，即其中小型语言模型系列；以及
              Document AI 工具，把杂乱商业文档转成结构化数据和工作流输入。目标垂直行业也一致。官方页面反复突出金融、医疗、保险和制造，同时强调为无法把敏感记录送入公共 API
              的客户提供私有化部署和数据主权。唯一不一致的是地点叙事。官方页面说的是韩国根基，加上首尔、旧金山和东京枢纽；第三方数据库则补充了 San Jose、Yongin、Hong Kong 和 Palo
              Alto。这让商业身份很清楚，但确切的法律总部或运营总部地图仍未解决。
