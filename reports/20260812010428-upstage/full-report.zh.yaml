              按尽调目的，核心弱点不是缺融资或缺产品变现，而是缺董事会级财务披露。公开来源没有提供账上现金、月度烧钱速度、现金跑道月数、毛利率、EBITDA、债务义务、产品级收入拆分或客户集中度。即便简单规模指标也仍模糊：官网说团队
              100+ 人，Growjo 估计 165 名员工，且没有任何来源拆出韩国与国际收入。面向私营公司承销的申报渠道也偏薄；DART 是韩国公开申报资料库，但本次审阅的来源集没有发现可与上市发行人收入和利润披露相比的
              Upstage 审计财务。由此，本章结论清楚。Upstage 可能有足够资本穿越 IPO 窗口，推进主权 AI
              和企业文档逻辑；但投资人仍需要私有数据室，才能评估收入质量、利润率耐久性，以及未来业绩在多大程度上依赖韩国公共部门和国内企业集中度。
