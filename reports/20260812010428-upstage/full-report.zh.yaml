      - number: '1.3'
        title: 融资、阶段与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Upstage 的融资轨迹，最能解释公司为何已呈现为 IPO 前独角兽。公开来源指向 2021 年 Series A、2024 年 4 月 $72 million Series B、2025 年 8 月由
              Amazon、AMD 和 Korea Development Bank 支持的 $45 million 过桥融资，随后是 2026 年 4 月 KRW 180 billion 的 Series C
              首次交割，将估值推到 KRW 1 trillion 以上。另有 2026 年 Korea National Growth Fund 支持包或投资批准，据报道规模为 KRW 560 billion，进一步说明
              Upstage 已成为主权 AI
              资本接收方，而不只是风投支持的创业公司。投资方组合很关键：战略企业、韩国金融投资人、主权资本，以及云或硬件相邻玩家，都出现在股权结构叙事周围。缺口在经济条款清晰度。公开材料列出了投资方和披露金额，但没有披露持股比例、清算条款，也没有说明主权资本如何工具化。这种不对称尤其重要，因为主权
              AI 支持可能提高执行概率，同时也增加政策敏感性。因此，投资人需要把表面资本充裕，与控制权、治理纪律以及公共资本中有多少是真股权、有多少是项目性支持等未解问题分开看。
