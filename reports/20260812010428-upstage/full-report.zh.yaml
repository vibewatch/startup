  - id: TE003
    title: 技术栈和架构表
    columns:
      - 组件
      - 描述
      - 差异化
      - 成熟度
      - 风险
    rows:
      - - Depth Up-Scaling (DUS)
        - 训练方法：加深较小的预训练 transformer，并继续预训练
        - 让 Upstage 能主张：参数量低于稠密模型同行，也能达到前沿级竞争力
        - 已通过 Solar 10.7B 和后续家族定位获得生产验证
        - 公开文档主要是论文加公司解释；专利护城河可见度低
      - - Solar 模型层
        - 从紧凑到前沿的 LLM 家族，覆盖开放权重和 API 模型
        - 结合韩语、日语专门化，以及推理和工具使用定位
        - 商业可用性高；前沿主张的独立验证为中
        - 快速变化的前沿竞争可能压缩相对优势
      - - Document Parse 引擎
        - 面向 PDF、扫描件、手写、表格、图表和版式的文档理解层
        - 产出下游 LLM 可用的结构化表示，超越普通 OCR
        - 高
        - 已发布指标由公司披露，需要独立复现
      - - 信息抽取层
        - 面向发票、理赔、合同及类似业务表单的键值抽取层
        - 输出结构化抽取结果，而不只是解析后的文本
        - 中到高
        - 与 Parse 相比，公开材料对独立技术细节披露更少
      - - Studio 编排层
        - 围绕文档工作流封装智能体编辑器、模板、监控和调优
        - 把组件变成可审计的文档智能体，而不是一次性 API 调用
        - 中到高
        - 公开文档尚未披露深层 API schema、连接器细节或 SLA 历史
      - - 部署与控制平面
        - API、云市场、VPC、私有云、本地部署包，以及治理控制
        - 贴合受监管行业的数据驻留和网络隔离要求
        - 高
        - 信任面很大程度上依赖供应商发布的合规与控制声明
    notes: 架构表区分两件事：公开材料已经露出的技术面，以及尽调仍需要客户访谈或私下技术审查补足的部分。
