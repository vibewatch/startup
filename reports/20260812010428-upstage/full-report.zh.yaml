              Upstage 的里程碑路径显示，公司先靠模型效率获得关注，再把这份可信度拓展到企业工作流自动化和主权 AI 定位。Solar 10.7B 于 2023 年 12 月登上 Hugging Face Open
              LLM Leaderboard 榜首，为公司的 depth up-scaling 方法建立全球可见度。2024 年随后推出 Solar Pro Preview，作为 22B 单 GPU 模型；之后进入 AWS
              市场平台；2025 年 7 月推出 Solar Pro 2，定位为 31B 推理和工具使用模型。与此同时，Document Parse 和 Information Extract 将 Upstage
