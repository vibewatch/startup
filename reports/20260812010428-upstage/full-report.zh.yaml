      - number: '2.3'
        title: 主权 AI 与韩国市场结构
        blocks:
          - type: paragraph
            body: >-
              韩国 AI 市场结构受到国家政策的异常强塑造。政府不只是补贴研究，而是在公开建设 K-AI、增加 GPU 产能，并遴选本土主权模型候选方。这有利于能把自己包装为战略基础设施、而非可选 SaaS
              工具的本土供应商。Upstage 从这一环境受益，因为它既是商业企业软件供应商，也是国家冠军候选者，据报道拥有国内私有 LLM 份额，并进入五支团队组成的主权模型赛场。不过，竞争场同样激烈。Naver
              有数据和平台分发，LG 有企业与制造深度，SK Telecom 有电信触达加政府可信度，Kakao 即便没有同等主权模型定位，也保有无可匹敌的消费者分发。Upstage
              的优势是聚焦：它是围绕文档密集型企业工作和紧凑模型效率搭建的创业公司专家。劣势是规模，因为对手是数据资产、渠道入口和资产负债表都更大的财阀。韩语数据稀缺问题让等式两边都更尖锐：本土模型质量更难做出来，但通用海外模型也更难干净复制。
