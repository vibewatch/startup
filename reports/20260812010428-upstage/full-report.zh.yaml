  - id: TM003
    title: 客户购买决策因素
    columns:
      - 因素
      - 重要性
      - Upstage 如何应对
    rows:
      - - 韩语与本地语境质量
        - 通用全球模型在韩语细微差别、本地文档和领域语境上经常表现不足
        - Solar 被定位为面向韩国优化的企业 LLM，并受益于本地训练重点
      - - 私有部署 / 数据驻留
        - 银行、医院和公共机构不能随意把敏感数据发往海外云 API
        - Solar Pro 面向本地部署和受控企业环境营销
      - - 复杂输入上的文档准确性
        - 许多工作流从扫描件、PDF、发票、理赔和合同开始，而不是干净数据库
        - Document Parse 和 Information Extract 直接解决文档摄取问题
      - - 可审计性与人工监督
        - 受监管买家需要可解释性、可追溯性和可问责的最终决策
        - Upstage 卖进高风险行业，并受益于以文档为中心的工作流设计，而不是纯聊天 UX
      - - 集成进既有运营
        - 企业 ROI 来自工作流集成，不只是模型演示
        - Upstage Studio 和文档智能体把解析延伸到更广泛的自动化流程
      - - 供应商稳定性与国家一致性
        - 大型企业需要能撑过采购周期和政策变化的供应商
        - 主权 AI 定位、公共支持和 IPO 前规模提升可信度
      - - 总成本 / 效率
        - 对许多企业任务来说，紧凑模型和定向工作流能够胜过蛮力扩展经济性
        - Solar 强调企业效率，文档产品则变现聚焦的自动化任务
    notes: 本表描述买方逻辑，而不是已披露客户组合；它综合了产品页面、监管指引和竞争市场报道。
