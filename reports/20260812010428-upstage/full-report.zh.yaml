        - 公司叙事与他的 Naver 背景和主权 AI 能见度高度绑定。
        - 联合创始人和产品资产存在，但继任安排尚未公开说明。
        - 中高
      - - 招聘管线
        - Upstage 无法足够快地扩充工程、市场拓展和上市公司职能。
        - IPO 准备度和国际支持需要比研究导向创业团队更厚的板凳。
        - 远程优先招聘、枢纽和优厚安置福利提高吸引力。
        - 中
      - - 国际扩张渠道
        - 日本和美国桥头堡在 IPO 前无法转成重复业务。
        - 韩国集中度会在最糟糕的时点仍未解决。
        - 主权 AI 可信度和企业产品套件支持初始触达。
        - 中高
      - - 开放权重分发层
        - 竞争对手微调或重新包装可比模型的速度，快于 Upstage 变现专有层的速度。
        - 如果客户认为 Solar 可被更便宜替代品互换，定价权会被压缩。
        - 工作流工具、支持和受监管部署让产品差异化。
        - 中高
    notes: 登记表合并伙伴、基础设施、领导力和扩张依赖，因为这些风险会传导到增长和估值。
