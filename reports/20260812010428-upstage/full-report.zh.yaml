      - number: '5.3'
        title: 部署、信任与受监管行业适配
        blocks:
          - type: paragraph
            body: >-
              Upstage 的商业楔子离不开部署方式。公开页面同时强调三个部署界面：托管 API、市场平台分发和私有基础设施。Solar Pro 通过 Amazon Bedrock Marketplace、Amazon
              SageMaker JumpStart 和 AWS Marketplace 发布；当前定价页也把产品放在
              API、云市场平台和本地部署包之间。对受监管用户而言，更强的信息是私有控制。金融服务和医疗页面都强调隔离或本地运行、敏感字段自动遮蔽，以及集成进现有系统，而不是推倒重来式工作流。Studio
              增加了保留设置、RBAC、SSO 或目录集成、护栏和执行监控等治理功能；本地部署页声称覆盖 SOC 2、HIPAA 和 ISO
              27001/27701。这些是有意义的信任信号，但大多仍是公司发布的声明，而不是公开、深入的技术或运营信任档案。实践中，产品看起来很适合买方对数据驻留、私有化部署和文档自动化有要求的场景；但尽调负担仍在于独立验证安全控制、SLA
              和基准可复现性。
