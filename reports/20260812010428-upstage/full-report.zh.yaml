  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Upstage AI 的产品定义，用工作流语言看比用抽象模型营销语言看更强。公司公开销售的是以文档为中心的企业技术栈，而不是单一聊天机器人 API。在前端，Document Parse 将杂乱的
              PDF、扫描件、电子表格、图表和手写内容转成机器可读的 HTML 或 Markdown。Information Extract
              随后从解析结果中拉取结构化字段，用于发票、理赔、合同和其他文档密集型业务流程。Solar 模型提供推理层，从较早的开放权重 Solar Mini 和 Solar Pro 系列，到较新的 Solar Pro
              2、Solar Preview、Solar Pro 4，以及面向日本的 Syn Pro 系列。Studio 位于这些组件之上，是团队搭建、部署、监控和调优文档智能体的编排层。这个架构很重要，因为它解释了
              Upstage 为什么在保险、医疗、金融、法律等类似行业中商业适配最强：核心任务不是闲聊，而是在受控部署选项下，把受监管文档转成行动、分析和工作流输出。
