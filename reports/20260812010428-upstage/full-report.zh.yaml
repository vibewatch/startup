      - number: '6.2'
        title: 具名客户证明与部署深度
        blocks:
          - type: paragraph
            body: >-
              本章最强部分是具名客户证明。Hanwha Life 的案例研究远不止一个客户标识：它描述了覆盖过去十年 5 million 保险理赔的生产工作流，披露每日处理 240,000+ 份文档，并引用 96%+
              准确率。Amwins 展示了美国保险业务在真实承保运营中的使用，首月处理 1,100+ 张发票，并形成日常运营吞吐。Best Option 和 TrueAdvance 从另一角度展示同一类别：Upstage
              成为借贷工作流中的文档智能层，并用一个 API 替代三套工具。Verra、Korea Press Foundation、Chosun Ilbo 和 ConnectWave
              又证明该技术并不限于单一垂直行业或单一国家。


              这种广度改变了对公司的承销。Upstage 不再只是宣称 Document AI 和 Solar
              可以在企业场景中工作；它已经在这些场景中发布了可衡量结果。重要的是，许多部署都处在错误会产生明显运营成本的系统里：承保文件、医疗理赔、公共信息检索、新闻编辑部规模化翻译，以及从可持续发展文档中抽取结构。缺的不是使用证明，而是组合耐久性的证明：客户数、队列留存、合同期限和扩张经济仍未披露。因此，本章可以验证生产相关性，但还不能验证这套销售动作在整个已安装客户基础中的可重复性。
