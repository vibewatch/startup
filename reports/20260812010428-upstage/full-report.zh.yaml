      - number: '5.4'
        title: 路线图、差异化与技术风险
        blocks:
          - type: paragraph
            body: >-
              Upstage 今天最强的产品差异化，是面向韩国及相邻亚洲市场受监管企业的紧凑多语言模型、文档原生工作流和私有化部署选项组合。外部来源反复称 Solar Pro 2 是全球前十中唯一由韩国开发的
              LLM，而官方材料显示 Solar Pro 4 正继续走向更智能体化的工作负载，Syn Pro 则面向日本本地化。公开报道中可见的路线图指向更快模型迭代、多模态扩展、更多 GPU
              产能，以及继续扩张美国和日本。这一方向有战略合理性，但仍有三个技术风险可见。第一，Solar Mini 和后续模型标志性的成本与速度优势，并没有完整公开的复现包支撑，投资人仍依赖公司或资料层面的摘要。第二，围绕
              DUS 的公开 IP 故事仍集中在论文、模型卡和公司解释中，而不是清晰可见的专利护城河。第三，Solar Open 100B
              的公开原创性审视之后，公司的技术可信度现在承担更高透明度要求。技术栈真实且商业可读，但前沿可信度将越来越依赖独立验证和运营证明，而不是叙事本身。
