  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模
        blocks:
          - type: paragraph
            body: >-
              Upstage 位于两类企业软件预算的交汇处，而不是单一清晰的市场类别。第一类是企业 LLM 支出：Grand View 估计全球企业 LLM 市场 2024 年为 $4.59 billion、2025 年为
              $5.65 billion；Straits Research 则将 2025 年定在 $6.5 billion，并强调 25%+ 的持续增长。第二类是智能文档处理，Grand View 和 Mordor 将
              2026 年市场框定在低个位数十亿美元，覆盖发票、理赔、KYC、合同和其他结构化抽取工作流。Upstage 的意义在于同时参与两块预算池：Solar 面向私有化部署和韩语企业 LLM 层，Document
              Parse 及相关文档产品则直接变现文档密集型自动化。因此，正确的总可用市场（TAM）不是「所有 AI」，而是映射到韩语、私有化部署和工作流自动化用例的企业 LLM 与文档 AI
              支出之和；由于部分文档理解预算已被计入企业 LLM 平台，还要做重叠折扣。
