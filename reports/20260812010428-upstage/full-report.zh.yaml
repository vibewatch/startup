      - number: '8.3'
        title: 情景分析比单点估值更诚实
        blocks:
          - type: paragraph
            body: >-
              区间之所以宽，是因为 Upstage 同时承载两套不同的承销故事。一套故事是：韩国主权 AI 冠军，在文档工作流里已有产品市场验证，日本扩张角度可信，增长足以在 IPO
              前大幅重估。另一套故事是：它仍是一家私营公司，最重要的价值驱动因素——队列留存、毛利率、优先股堆叠，以及 Document AI 与 Solar
              之间的收入构成——仍未披露。因此，情景框架比单一“正确”数字更可信。基准情景假设当前独角兽估值大体合理，下一步上行取决于更多披露，而不只是更多热情。乐观情景假设日本和美国商业化与政策支持叠加，让 $1.5B
              以上结果变得可辩护，并由公开市场 IPO 窗口继续抬升。悲观情景假设延误、倍数压缩，以及市场对非美国独立模型厂商信心恶化。粗略 DCF
              视角救不了精确性，但能说明今天的公开证据可支撑一个宽估值带，并且与当前私募标记重叠。真正的问题不是 Upstage 是否配得上一个区间；它配得上。问题是，在投资级经营披露到来之前，未来 IPO
              上行已经提前嵌入了多少。
