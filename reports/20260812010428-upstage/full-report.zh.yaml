  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 资本基础与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Upstage 最强的财务属性不是公开盈利能力，而是反复获得越来越具战略性的资本。融资栈从 2021 年国内风投，推进到 2024 年电信和企业战略方，再到 2025 年过桥融资中的 Amazon、AMD 和
              Korea Development Bank，最后进入 2026 年的 Hyundai、Kia 和主权风格资本。这个进展很重要，因为它说明买方、基础设施伙伴和政策相关机构，都在 Upstage 的 Solar
              LLMs、Document AI 和私有化部署组合中看到了商业价值。它也意味着，投资人承销的不只是软件增长：他们还在出资支持 GPU 产能、主权 AI 相关性和韩国主导的 IPO 叙事。积极解读是，Series
              C 和 KNGF 支持包之后，短期融资风险较低。更严苛的解读是，公开披露仍没有现金、烧钱速度或债务，因此资本充足性只能通过融资事件看见，而不是通过资产负债表透明度看见。
