            body: >-
              Document Parse 让 Upstage 在模型 API 之外拥有第二个买方中心，因此公司异常暴露于文档工作流竞争。这有帮助，但也意味着 Upstage 必须面对
              ABBYY、Hyperscience、UiPath 和 Automation Anywhere 等专门 IDP 与自动化 incumbent。这些供应商从相反方向进入采购：它们已经位于企业文档、RPA
              或后台自动化预算里，可以增加生成式 AI
              能力，而不要求客户切换平台类别。在保险、金融和医疗场景中，这一点尤其重要，因为直接预算负责人可能更关心文档直通处理，而不是底层是哪一个基础模型。现状替代方案也真实存在。企业可以自己组装开放模型、OCR 或 IDP
              模块以及内部工作流。因此，当买方想要一套集成的韩国企业技术栈时，Upstage 受益；但只要文档自动化被当作更大内部自建架构里的又一个可替换组件，它的议价力就会下降。
