  - id: TR005
    title: 缓释措施、监测指标和投资逻辑破裂触发器
    columns:
      - 风险
      - 可监测触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 主权 AI 依赖
        - 项目评审结果
        - Upstage 失去决赛资格，或官方支持明显减弱。
        - 除非商业替代需求已经可见，否则视为投资逻辑破裂。
      - - 前沿性能差距
        - 基准 / 客户标杆漂移
        - 尽管存在主权权衡，企业买家越来越多选择外国前沿 API。
        - 以服务驱动而非模型驱动重新承销护城河，并下调倍数假设。
      - - 开放权重商品化
        - 定价 / 胜率压力
        - 面对自托管替代方案，Solar 定价、附着率或续约质量走弱。
        - 要求证明 Document AI 和工作流层能在基础模型之上守住利润率。
      - - 地域集中
        - 国际收入结构
        - 尽管持续投入，日本 / 美国到 IPO 申报时仍不重要。
        - 下调 IPO 准备度，并提高对韩国单一收入天花板的担忧。
      - - 治理 / 扩张深度
        - 领导层板凳和上市公司准备度
        - 上市前看不到继任、财务、安全或合规板凳扩张。
        - 将关键人和执行风险视为缓释不足。
      - - IPO 窗口风险
        - 簿记建档反馈 / 估值重置
        - 营销需要显著低于私募预期的估值，或上市延期。
        - 预期士气、招聘和叙事受损；重新评估估值立场。
    notes: 终止标准强调投资者从现在到 IPO 之间可外部监测的触发器，而不是泛泛的创业公司担忧。
