      - number: '8.5'
        title: 继续跟踪；披露收窄区间前，估值姿态为合理到偏高
        blocks:
          - type: paragraph
            body: >-
              本章建议为观察，信心中等，风险评级高。这不是说公司弱，而是说价格讨论跑在披露讨论前面。Upstage 已有足够证据证明产品宽度、政策相关性和市场动能，值得持续关注，也配得上相对 SaaS
              中位数的真实溢价。但在单位经济性、股权结构条款或国际队列耐久性方面，公开证据还不足以支持在一个实时私募标记上给出强买入判断；该标记可能已经在 KRW 1.3 trillion 到 KRW 1.6 trillion
              左右，并且 IPO 营销时还可能被推得更高。换句话说，反向逻辑仍有太多支撑。如果下一次刷新出现经审计或管理层级别的收入分拆、毛利率、留存和 IPO
              条款，立场可能快速上调，因为乐观情景是可信的。如果故事仍偏宣传，而估值朝最激进的韩国 IPO 叙事推进，立场就应从合理到偏高转为昂贵。因此，今天正确的尽调姿态是有纪律的好奇：贴近跟踪，但不要把缺失事实直接承销掉。
