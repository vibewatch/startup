      - number: '8.4'
        title: 溢价取决于主权相关性、产品变现和国际验证
        blocks:
          - type: paragraph
            body: >-
              价值从这里继续扩张的路径是看得见的。Upstage 的商业故事比许多前沿模型公司更具体，因为它的 Document AI 产品已经打包、定价，并能通过 API、AWS
              和本地部署环境交付。官方材料也展示了真实客户证明，以及比裸 LLM 端点更宽的工作流主张。这些要素让主权 AI
              溢价显得有些可信，而不是纯象征。日本尤其重要，因为它是近期最干净的证据：公司能否把韩国基地转成区域企业需求。价值被摧毁的路径同样清晰。KOSPI 需求并无保证，美国模型进展可能比预期更快地商品化 31B
              参数的小众定位，Naver、LG 等更大的本土玩家也能用更多资本和渠道压缩任何临时护城河。最重要的是，如果 Upstage 不能证明 Document AI 经济性和基于 Solar
              的企业采用能相互强化，市场可能不再把它当作稀缺资产，而会按一家专业但普通的软件公司给估值。这才是投资者应盯住的转折点。
