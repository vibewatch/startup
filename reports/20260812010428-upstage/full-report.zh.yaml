  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值锚点真实存在，但噪音仍大
        blocks:
          - type: paragraph
            body: >-
              公开证据确实支持一个明确标题：Upstage 已经跨入独角兽区间。2026 年 4 月 Series C 首关约 KRW 180 billion 的融资有较充分交叉印证，同一轮报道也把公司估值描述为超过 KRW
              1 trillion。战略叠加同样重要。韩国 National Growth Fund 背景和主权 AI 背书不是普通后期创业公司的信号；它们降低融资风险感知，也能在一个想要国家级 AI
              冠军的国内市场里支撑稀缺溢价。与此同时，具体私募标记仍比“独角兽”标签暗示的更模糊。独立媒体谈到的当前估值大约从 KRW 1.3 trillion 到 KRW 1.6 trillion 不等，而最宣传化的 IPO
              预览把上限拉到 KRW 3.5 trillion 至 KRW 5
              trillion。这个跨度本身就是估值事实：市场对叙事和战略位置的承销，快过对审计披露的承销。尽调级章节应采用证据最扎实的当前区间，把最乐观数字视为情景端点，而不是今天的公允价值。
