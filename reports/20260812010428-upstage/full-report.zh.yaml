      - number: '6.3'
        title: 获客动作与耐久性
        blocks:
          - type: paragraph
            body: >-
              可见获客模型是企业优先，而不是经典 SaaS 意义上的自助 PLG。Upstage
              确实有低摩擦入口——市场平台部署、API、伙伴集成和演示流程——但公开证据表明，这些界面更像进入更大工作流销售的楔子，而不是终点。典型路径似乎是：拿下一条痛苦的文档或知识检索用例，在真实数据上证明准确率和节省时间，部署到买方偏好的云或私有环境，然后扩展到相邻团队或更复杂的
              AI 工作负载。Hanwha、Amwins、Best Option、Verra 和 Korea Press Foundation 的故事中，都能看见这套逻辑。


              分发支持强化了这一动作。AWS 通过 SageMaker、Bedrock 和市场平台计费给 Upstage 全球部署可信度，Samsung SDS 则把 Upstage
              嵌入企业自动化产品。Amazon、AMD、Hyundai Motor 和 Kia
              的战略资本降低买方疑虑，也可能打开一家独立创业公司很难进入的门。问题在于，这些优势都不能替代透明的留存指标。公开材料没有披露客户数、NRR、GRR、流失或续约队列。收入增长和不断扩展的案例研究暗示留存强，但证据仍是间接的。投资人因此应把耐久性读作有前景但未在组合层面证明：真实部署已经存在，续约数学仍被藏起来。
