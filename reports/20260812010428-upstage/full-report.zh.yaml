      - number: '2.2'
        title: 买方需求与文档工作流
        blocks:
          - type: paragraph
            body: >-
              短期最强需求并不来自泛聊天机器人买方，而来自处理大量敏感文档、同时需要韩语准确率、可审计性和受控环境内部署能力的企业。Upstage 自己的产品界面强调解析
              PDF、扫描件和邮件中的文档；为发票、理赔和合同抽取结构化数据；并提供面向保险、医疗、金融服务和制造的行业方案。这些行业共享同一套采购逻辑：预算负责人通常是
              CIO、CTO、数字化转型负责人、运营负责人或合规负责人，而不是终端用户；采用触发点是一条痛苦的文档工作流，单靠通用公共 API 无法解决。Solar
              的企业定位和本地部署选项之所以重要，是因为这些买方既要模型质量和有据性，也要数据驻留、系统集成和可追溯性。这让 Upstage 的 Document AI
              积累具备战略价值：文档工作不只是相邻产品线，而是进入更广泛企业 AI 部署的获客楔子。
