      - number: '7.3'
        title: 监管、财务与 IPO 风险
        blocks:
          - type: paragraph
            body: >-
              Upstage 的法律与财务风险交织得格外紧：公司把 AI 卖进受监管工作流，同时又在为公开市场审视做准备。隐私政策确认，Upstage 会在韩国《个人信息保护法》和补充地区条款下处理对话内容、上传文档、API
              输入输出、计费数据和跨境传输。服务条款又加上输出监控、服务暂停，以及明令禁止用 Upstage 输出训练竞争模型等运营控制。上述保护是合理的，但也说明文档密集型企业 AI
              自带很大的法律暴露面。外部环境里，NIST、CISA 和 EU AI Act 生态都在抬高可信度、安全部署和可解释性的门槛。财务上，估值已经嵌入很强假设：增长继续超过
              130%、韩国市场领导地位稳住、国际扩张成功、KOSPI 窗口友好。如果公开市场情绪转弱，或投资者认为主权 AI 估值已经跑在变现之前，Upstage 可能面临估值压缩、上市节奏推迟，甚至一次伤害品牌的 IPO
              估值重置。
