      - number: '5.2'
        title: 核心模型与文档技术
        blocks:
          - type: paragraph
            body: >-
              Upstage 差异化的技术核心是效率，而不是最大参数量。Solar Mini 通过把 10.7B 模型与自研 Depth Up-Scaling 方法配对，确立了这一模式；公司和 arXiv 论文将其描述为
              depthwise scaling 加持续预训练，而不是 mixture-of-experts 设计。官方和开发者面向资料将该方法与紧凑性能、开放权重发布和强榜单表现联系起来。Solar Pro 和 Solar
              Pro 2 随后把同一逻辑扩展到单 GPU 或相对紧凑的企业模型，并围绕结构化输出、多语言、推理和工具使用，讲述面向生产业务任务的叙事。文档侧，Document Parse 和 Information
              Extract 并未被描述成通用 OCR 工具；公开材料反复把它们框定为布局感知、工作流就绪的系统，用于把发票、理赔、医疗记录和合同转成 LLM 可用输入或结构化键值输出。Studio
              通过把这些能力作为可组合智能体步骤，而非彼此断开的 API，闭合了这条链。整体技术故事因此是连贯的：紧凑模型架构、文档理解和编排，意在彼此强化。
