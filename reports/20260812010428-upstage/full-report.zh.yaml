companyProfile:
  summary: >-
    Upstage AI 由 Sung Kim、Lucy Park 和 Stan Lee 于 2020 年 10 月创立，是一家韩国企业 AI 公司，围绕两条相连的产品线搭建：Solar LLMs（Solar Mini 10.7B 和
    Solar Pro 2 31B）使用自研 depth up-scaling 技术，Document AI
    工具则负责从商业文档中解析并抽取结构化数据。目标垂直行业包括金融、保险、医疗和制造，公司尤其强调面向数据主权敏感客户的私有化和本地部署。截至 2026 年 4 月，公司完成 KRW 180 billion 的 Series C
    首次交割，估值超过 KRW 1 trillion，成为韩国首家生成式 AI 独角兽，随后又获得 KRW 560 billion 的 Korea National Growth Fund 支持。公司正在筹备 2026 年下半年
    KOSPI IPO。
