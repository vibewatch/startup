      - number: '2.4'
        title: 监管与商业化约束
        blocks:
          - type: paragraph
            body: >-
              监管对 Upstage 是双刃剑。韩国金融行业 AI
              指引及相关隐私指引，要求人类问责、明确监督、模型和数据可靠性、安全控制以及消费者保护措施，抬高了治理门槛。这些义务会拖慢部署，因为受监管买方在生产上线前，必须完成私有数据试点、法律审查、安全测试和审批流程。与此同时，同一套规则也让私有化部署、文档质量和本地支持更值钱，这对已经销售本地部署和文档处理产品的本土供应商有利。韩国对
              DeepSeek 的反应展示了护城河的另一面：隐私审查和地缘政治谨慎，会压缩中国模型在受监管场景中的实际可用性。结果是，一个宏观顺风健康、但转化速度慢于 headline CAGR 的市场。因此，Upstage
              最现实的短期市场不是整个主权 AI 或全球 LLM 支出池，而是韩国及相邻企业工作流中的子集：合规、语言特异性和部署控制足够重要，足以为本土专业供应商买单。
