      - number: '6.4'
        title: 集中度风险与扩张路径
        blocks:
          - type: paragraph
            body: >-
              客户集中度是主要未解风险。地域仍偏韩国，最强的垂直证明位于金融、保险、政府和制造，最具战略意义的客户标识也可能是大客户。Hyundai Motor、Kia 和主权 AI mandate
              有价值，因为它们降低采用风险并创造背书力量；但同样的锚点也可能意味着客户基础里少数账户权重过高。公开来源一致把韩国描述为商业基本盘，把日本描述为下一个主要前沿；美国则通过保险和特定工作流案例浮现，而不是通过广泛商业化规模出现。这一扩张顺序合理，但还不是收入层面的多元化。


              商业动能可见，但并非均匀可验证。第三方来源指向 130%+ 年增长和约 35% 韩国私有 LLM 市场份额；一个公开跟踪器引用 2024 年收入 $25.1 million，另一个受阻的第三方页面列出 2026
              年约 $56.5 million。这些数字方向上支持判断，但达不到披露级别。证据更充分的结论是定性的：Upstage
              已经跨过从试点剧场到可引用企业采用的门槛，但仍缺少足以完整承销头部客户敞口、续约质量和韩国以外多元化的透明度。换句话说，客户质量看起来强；客户组合耐久性仍需要尽调。
