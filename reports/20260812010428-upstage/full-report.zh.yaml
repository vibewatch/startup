    columns:
      - 触发因素
      - 阈值 / 事件
      - 重要性
      - 行动含义
    rows:
      - - IPO 估值营销跑过基准情景经济性
        - 若无新增披露，实时估值或 IPO 区间进入 3.5T-5T 叙事
        - 把合理至偏高的情景推成昂贵情景
        - 后退一步，等披露改善或价格重置
      - - 国际管线未能转化
        - 日本和美国扩张仍以案例研究为主，付费生产证据弱
        - 乐观情景失去主要重估引擎
        - 维持观察，或下调
      - - 软件倍数再次压缩
        - 公开 AI / 软件龙头大幅下修估值
        - 即便执行稳健，Upstage 也会失去可比公司支撑
        - 上调悲观情景概率
      - - 留存或毛利率数据令人失望
        - 队列显示扩张弱，或推理经济性不佳
        - AI 原生溢价逻辑在单位经济性层面失效
        - 将估值重锚到普通软件
      - - 优先股堆叠被证明苛刻
        - 隐藏条款给内部人更强的下行保护
        - 头部企业价值不再对应新投资人的回报潜力
        - 不论故事质量如何，均应回避
    notes: 这些离散事件最可能打破估值逻辑，而不是仅仅拖慢逻辑兑现。
