            body: >-
              单位经济故事有希望，但仍是推断而非披露。Upstage 的小模型定位，以及 Seoulz 报道的 3-8x 推理成本优势，暗示其成本姿态优于需要更大推理足迹的前沿规模模型。同时，管理层公开表示新资本将投向 GPU
              基础设施、海外招聘和持续模型
              R&D，这意味着业务资本密集度仍足够高，不能仅凭软件类比安全猜测毛利率和烧钱速度。最现实的财务视角因此是混合的：受监管本地部署交易和企业文档工作流可以带来大额、粘性合同，但也会拉长销售周期并增加实施内容。这种模糊性会直接进入估值敏感性。如果
              2026 年下半年 IPO 接近公开报道讨论的 2-3 trillion won 区间，投资人实际支付的将是较高的估计收入倍数，并承销公开来源尚未证明的利润率扩张。
