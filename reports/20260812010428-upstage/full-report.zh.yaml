      - number: '3.4'
        title: 护城河说得通，但仍更多是运营型而非结构型
        blocks:
          - type: paragraph
            body: >-
              Upstage 今天的护城河来自一整套组合，而不是不可替代的垄断资产。这套组合包括强韩语基准、可信的单 GPU 效率、私有化部署、Document AI 相邻能力，以及不断增强的 AWS
              企业分发。对韩国受监管行业而言，这些优势有意义。但本章把它们视为运营优势，而非永久壁垒。Naver 随时可以利用更广的自有数据和用户触达。LG
              可以凭更深的集团级数据访问，继续推进工业领域适配。OpenAI、Anthropic、Google、Mistral、Cohere 和开放权重生态可以迅速压缩质量和成本差距。即便 DeepSeek
              也会间接影响，因为低成本开放权重竞争会重置买方对「什么应该便宜」的预期。这意味着，切换成本主要在 Upstage
              已嵌入敏感工作流和合规审查的地方真实存在，而不是客户仍处于试点阶段的地方。因此，正确的尽调问题不是抽象地问 Upstage
              有没有护城河，而是它能否在市场围绕更便宜、更宽的替代品正常化之前，把基准可信度和私有化部署转成足够深的生产环境嵌入。
