company:
  name: Upstage AI
chapter:
  number: 1
  title: Company Overview
  summary: Upstage AI is a South Korean enterprise AI company built around efficient Solar LLMs and document-centric workflow automation. By mid-2026 it had reached unicorn status, accumulated strategic and sovereign backing around a planned KOSPI IPO, and still left material gaps around exact headquarters labeling, headcount, governance, and cap-table economics.
sections:
- id: identity-and-positioning
  title: Identity and positioning
  body: 'Upstage enters the file as a South Korean enterprise AI company rather than a consumer chatbot startup. Across its homepage, product pages, and third-party profiles, the company is consistently framed around two linked product families: Solar, its small-to-mid-sized language model line, and Document AI tools that turn messy business documents into structured data and workflow inputs. The target verticals are also consistent. Official pages repeatedly highlight finance, healthcare, insurance, and manufacturing, while emphasizing private deployment and data sovereignty for customers that cannot ship sensitive records to public APIs. What is not consistent is the location story. Official pages speak in terms of South Korean roots plus hubs in Seoul, San Francisco, and Tokyo, while third-party databases add San Jose, Yongin, Hong Kong, and Palo Alto. That makes the commercial identity clear but leaves the exact legal or operating headquarters map unresolved.'
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO037
  - CO048
  tableRefs:
