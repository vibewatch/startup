chapter:
  number: 7
  title: Risks
  summary: Upstage's risk profile is dominated by the speed of global model competition, dependence on Korea's sovereign-AI program, and the challenge of converting a Korea-heavy enterprise base into IPO-quality diversification. The company has real mitigants—on-prem deployment, Document AI workflow value, and regulatory switching costs—but most of them reduce rather than eliminate exposure.
sections:
- id: technology-and-competitive-risk
  title: Technology and competitive risk
  body: 'Upstage has a coherent technical wedge, but it sits inside the most brutal part of the AI stack. Solar Pro 2 is a 31B model positioned as frontier-adjacent for Korean enterprise workloads, while Solar Mini and Solar Open emphasize efficiency and deployability rather than sheer scale. That strategy works as long as customers continue to value Korean-language quality, on-prem deployment, predictable cost, and workflow integration more than absolute benchmark leadership. The risk is that frontier labs keep widening the raw capability gap fast enough that some Korean enterprises accept foreign-model or cloud dependency in exchange for better reasoning, tooling, and agentic performance. A second pressure point is commoditization: Llama, Qwen, and DeepSeek all continue to ship capable open or low-cost models, which makes it harder to defend model pricing with benchmark scores alone. Upstage''s real mitigation is therefore not merely “better weights,” but a bundle of regulated-industry
    fit, Document AI integration, fine-tuning support, and data-sovereignty deployment options. That is a meaningful moat, but it is commercial and executional rather than permanent.'
