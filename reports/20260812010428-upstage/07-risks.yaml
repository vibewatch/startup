  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: public-sector-revenue-mix
    missingEvidence: No retained public source quantifies what share of revenue or bookings comes from sovereign-AI or public-sector contracts.
    whyItMatters: Government dependency cannot be sized rigorously without knowing how much of the revenue base is tied to policy-backed demand.
    diligencePath: Request segment revenue disclosure for sovereign-AI, public-sector, and private-enterprise customers.
    relatedQuestionRefs:
    - QR031
  - type: private-evidence-only
    severity: material
    topic: gpu-commitments
    missingEvidence: Exact GPU ownership, lease, cloud-commit, or training-budget commitments for the next model cycle are not public.
    whyItMatters: Compute economics and model cadence are central to the moat, and the current public record is too high level to underwrite them.
    diligencePath: Obtain internal compute plan, GPU sourcing contracts, and model-training budget assumptions.
    relatedQuestionRefs:
    - QR032
  - type: missing-source
    severity: material
    topic: international-revenue-split
    missingEvidence: The retained sources describe Japan and U.S. expansion, but they do not disclose actual non-Korea revenue contribution.
    whyItMatters: Revenue concentration risk cannot be retired without measurable geographic diversification before IPO marketing.
    diligencePath: Request geography-level ARR, pipeline conversion, and customer count by Korea, Japan, and U.S.
    relatedQuestionRefs:
    - QR015
  - type: private-evidence-only
    severity: material
    topic: succession-planning
    missingEvidence: No public evidence describes succession planning, management depth, or contingency planning around Sung Kim.
    whyItMatters: CEO concentration is a real underwriting variable for fundraising, sovereign relationships, and IPO execution.
    diligencePath: Review executive bench, board composition, and written succession or key-person contingency plans.
    relatedQuestionRefs:
    - QR018
    - QR020
  - type: conflicting-data
    severity: material
    topic: valuation-expectations
    missingEvidence: Public sources cite different private and IPO valuation ranges, but none provide the actual cap-table terms or bookbuilding feedback.
    whyItMatters: Valuation compression risk depends on the spread between private expectations and real public-market demand.
    diligencePath: Request current preferred terms, latest internal marks, and underwriter scenario materials.
    relatedQuestionRefs:
    - QR016
    - QR017
    - QR029
  - type: missing-source
    severity: material
    topic: thesis-break-prioritization
    missingEvidence: The public record does not rank which single adverse event management views as the first thesis-break trigger across policy, pricing, and IPO paths.
    whyItMatters: Investors need a prioritized contingency map rather than a generic risk list because several risks can transmit at once during an IPO window.
    diligencePath: Request management's internal risk register, escalation thresholds, and board-level monitoring cadence for top risks.
    relatedQuestionRefs:
    - QR030
  - type: private-evidence-only
    severity: material
    topic: open-weight-licensing
    missingEvidence: The retained public record does not fully map which Solar family components are open-weight, commercial-only, or contractually restricted.
    whyItMatters: Licensing ambiguity affects how much IP leakage or derivative competition investors should expect.
    diligencePath: Request a product-by-product licensing matrix covering Solar Open, Solar Pro, Studio, and enterprise fine-tuning rights.
    relatedQuestionRefs:
    - QR024
    - QR025
