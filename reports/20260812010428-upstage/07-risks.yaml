- id: regulatory-financial-and-ipo-risk
  title: Regulatory, financial, and IPO risk
  body: 'Upstage''s legal and financial exposures are unusually intertwined because the company sells AI into regulated workflows while simultaneously preparing for public-market scrutiny. The privacy policy confirms that Upstage processes conversation content, uploaded documents, API I/O, billing data, and cross-border transfers under Korea''s Personal Information Protection Act and supplementary regional provisions. The terms of service add operational controls such as output monitoring, service suspension, and explicit prohibitions on using Upstage outputs for competitive model training. Those are sensible protections, but they also highlight how much legal surface area comes with document-heavy enterprise AI. Externally, NIST, CISA, and the EU AI Act ecosystem all raise the bar for trustworthiness, secure deployment, and explainability. Financially, the valuation already embeds strong assumptions: continued 130%+ growth, durable Korean market leadership, successful international expansion,
    and a receptive KOSPI window. If public-market sentiment weakens or investors decide sovereign-AI valuations have run ahead of monetization, Upstage could face valuation compression, delayed timing, or a brand-damaging IPO reset.'
  claimRefs:
