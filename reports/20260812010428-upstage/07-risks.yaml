- id: TR005
  title: Mitigations, monitoring indicators, and thesis-break triggers
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Sovereign-AI dependency
    - Program review outcome
    - Upstage loses finalist status or receives materially weaker official backing.
    - Treat as a thesis-break unless commercial replacement demand is already visible.
  - - Frontier performance gap
    - Benchmark / customer reference drift
    - Enterprise buyers increasingly choose foreign frontier APIs despite sovereignty trade-offs.
    - Re-underwrite moat as services-led rather than model-led and cut multiple assumptions.
  - - Open-weight commoditization
    - Pricing / win-rate pressure
    - Solar pricing, attach rate, or renewal quality weakens against self-hosted alternatives.
    - Require proof that Document AI and workflow layers defend margin above the base model.
  - - Geographic concentration
    - International revenue mix
    - Japan/U.S. remain immaterial by IPO filing despite continued spend.
    - Discount IPO readiness and raise concern about Korea-only revenue ceiling.
  - - Governance / scaling depth
    - Leadership bench and public-company readiness
    - No visible succession, finance, security, or compliance bench expansion before listing.
    - Treat key-person and execution risk as under-mitigated.
  - - IPO window risk
    - Bookbuilding feedback / valuation reset
    - Marketing requires valuation materially below private expectations or listing slips.
    - Expect morale, recruiting, and narrative damage; reassess valuation stance.
  notes: Kill criteria emphasize externally visible triggers that investors can monitor between now and IPO rather than generic startup concerns.
