- id: TR004
  title: Partner / dependency and people risk register
  columns:
  - Dependency / function
  - Failure scenario
  - Why it matters
  - Visible mitigant
  - Residual exposure
  rows:
  - - Sovereign-AI program sponsorship
    - Upstage loses champion status or receives reduced support in later rounds.
    - Would damage credibility, access to compute, and public-sector momentum simultaneously.
    - Existing commercial products and private investors provide some fallback.
    - high
  - - NVIDIA / GPU ecosystem
    - Training or inference economics worsen as GPU prices or availability tighten.
    - Model cadence and international expansion both depend on compute efficiency.
    - Efficient architecture plus sovereign compute allocations help at the margin.
    - high
  - - Founder-CEO external role
    - Sung Kim departure or reduced public role weakens fundraising and policy relationships.
    - The company narrative is tightly coupled to his Naver pedigree and sovereign-AI visibility.
    - Co-founders and product assets exist, but succession is not publicly articulated.
    - medium-high
  - - Hiring pipeline
    - Upstage cannot scale engineering, go-to-market, and public-company functions quickly enough.
    - IPO readiness and international support require a broader bench than a research-forward startup team.
    - Remote-first hiring, hubs, and generous setup benefits improve attraction.
    - medium
  - - International expansion channels
    - Japan and U.S. beachheads fail to become repeat business before IPO.
    - Korea concentration then remains unresolved at the worst possible time.
    - Sovereign-AI credibility and enterprise product suite support initial outreach.
    - medium-high
  - - Open-weight distribution layer
    - Competitors fine-tune or repackage comparable models faster than Upstage can monetize proprietary layers.
    - This compresses pricing power if customers see Solar as interchangeable with cheaper alternatives.
    - Workflow tooling, support, and regulated deployments differentiate the offer.
    - medium-high
