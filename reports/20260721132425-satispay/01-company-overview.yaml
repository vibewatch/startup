- id: founders-leadership-and-governance
  title: Founders, leadership visibility, and governance control
  body: "The founder story is strong, but the broader governance picture is only partly public. Multiple independent sources identify Alberto Dalmasso, Dario Brignone, and Samuele Pinta as the founding trio, with Dalmasso still the dominant public face and Brignone still identified as CTO. Careers pages and team pages show a growing organization with many functions, but they do not give investors a complete executive-bench map, nor do they surface current board committees, reserved matters, or a full beneficial-ownership schedule. In practical terms, later diligence should treat Satispay as founder-led with material key-person concentration around Dalmasso even though the organization is obviously larger than one spokesperson.\n\nControl dynamics also matter. The 2024 follow-on round coverage says founders regained majority voting control, while the 2026 capital-increase reporting says that founder control would remain intact after the new raise. Those statements are directionally encouraging\
    \ for continuity, but they are not a substitute for cap-table mechanics. Public materials do not reconcile how much control comes from voting-right design, what investor protections remain in place, or how board influence is distributed across long-time backers such as Lightrock, Addition, and Greyhound. The right chapter-one conclusion is therefore not that governance is weak, but that it is only partially inspectable from public evidence and should be underwritten as a real diligence task rather than an assumption."
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO042
