  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Current board composition, committee charters, reserved matters, and a post-2024 / post-2026 voting-right schedule.
    whyItMatters: Founder-control headlines do not reveal investor protections, approval thresholds, or succession risk.
    diligencePath: Request the latest cap table, shareholder agreement summary, and current board / observer list from management.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: funding-gap
    missingEvidence: A reconciled lifetime funding schedule separating closed rounds, planned capital increases, and any secondary proceeds.
    whyItMatters: Valuation context and dilution analysis depend on clean capital-history math, which public summaries currently do not reconcile.
    diligencePath: Obtain management's round-by-round capitalization table and legal close notices for each financing since 2013.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: minor
    topic: leadership-gap
    missingEvidence: A complete executive-bench map beyond the founders, including finance, risk, operations, and regulated-entity leaders.
    whyItMatters: The public record supports scale, but underwriting operational depth requires more than founder biographies and job pages.
    diligencePath: Request an org chart, regulated-entity management roster, and biographies for finance/compliance leadership.
    relatedQuestionRefs:
    - QO004
    relatedTableRefs:
    - TO002
  - type: stale
    severity: minor
    topic: headcount-precision
    missingEvidence: A run-date headcount figure that confirms whether the planned 2025 hiring wave was fully executed.
    whyItMatters: Public sources disclose hiring plans and opening roles, but not a clean as-of-2026 employee count.
    diligencePath: Ask management for current total employees, by geography and legal entity, as of the report run date.
