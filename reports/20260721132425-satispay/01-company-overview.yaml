- id: capital-history-and-scale
  title: Capital history, scale metrics, and product broadening
  body: "Satispay's capital history clearly supports unicorn status, but not perfect simplicity. The 2022 Series D is the cleanest publicly corroborated event: TechCrunch, Cleary Gottlieb, and Financial IT all support a roughly €320 million round at a valuation above €1 billion, led by Addition with a wide investor syndicate including Greyhound, Coatue, Lightrock, Block, Tencent, and Mediolanum. The next major disclosed event is the November 2024 €60 million round from existing investors, which EU-Startups framed as an acceleration round for payments, welfare, and investment services. By June 2026, management and press sources were discussing a further capital increase of up to €120 million, half pre-committed, while reaffirming unicorn valuation.\n\nThe scale signals are also strong, though source-sensitive. The company homepage still markets more than 6 million users and over 450,000 merchants; June 2026 coverage pushes that to 6.5 million users and more than 450,000 merchants. The same\
    \ coverage adds annualised revenue above €116 million, deposits of about €670 million, and meaningful welfare traction. Public hiring data adds another scale cue: Satispay planned to add 400 employees in 2025 to a workforce already above 700. Put together, the evidence supports a real and fast-scaling platform. The unresolved caution is that lifetime-funding totals and exact operating-profit quality are not yet presented with audited, consolidated transparency in the public record."
  claimRefs:
