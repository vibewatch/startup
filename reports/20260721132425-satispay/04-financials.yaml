  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-econ-gap
    missingEvidence: GMV, effective take rate, CAC, payback, chargeback / fraud losses, and margin by product line.
    whyItMatters: Without those, it is impossible to judge whether reported topline momentum translates into durable equity value.
    diligencePath: Request monthly financial packs and cohort economics by product line.
    relatedQuestionRefs:
    - QI016
    - QI021
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Cash on hand, monthly burn, downside runway, and working-capital lockup under the current hiring and product roadmap.
    whyItMatters: The 2026 raise cannot be fully judged as offensive or defensive without runway and settlement-float context.
    diligencePath: Request treasury view, board-approved cash plan, and customer-funds segregation / settlement schedule.
    relatedQuestionRefs:
    - QI013
    - QI012
    - QI011
  - type: missing-source
    severity: minor
    topic: filings-detail
    missingEvidence: Direct machine-readable statutory line items for Satispay Europe and Satispay Invest annual accounts.
    whyItMatters: Open-source filing surfaces proved existence and recency of filings but not clean numerical extraction.
    diligencePath: Obtain official register extracts or management-provided statutory accounts.
    relatedQuestionRefs:
