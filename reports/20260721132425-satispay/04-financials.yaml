- id: capital-adequacy-and-funding-context
  title: Capital adequacy and funding context
  body: "Satispay's financing chronology is easy to summarize even if its current balance sheet is not. The 2022 Series D brought roughly €320 million at a unicorn valuation. The 2024 round added €60 million and pushed total funding above €500 million while restoring founder majority control. In 2026, management sought up to €120 million more, with nearly half already committed, explicitly to accelerate product rollout, strengthen liquidity, and preserve optionality for technological development and acquisitions.\n\nThat pattern matters. Satispay is not raising capital because the business lacks demand evidence; if anything, the demand evidence is improving. It is raising because expanding into welfare, investing, and cards while supporting European scale likely demands more balance-sheet strength and execution room than current internally generated cash flows can comfortably provide. The financial interpretation is therefore mixed: the new capital is not obviously a rescue, but it is also\
    \ not a sign that the company is fully self-funding its strategic ambitions."
  claimRefs:
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
  - CI021
  - CI022
  - CI023
  - CI024
  - CI041
  tableRefs:
  - TI004
  figureRefs:
  - FI003
- id: filings-compliance-and-what-still-blocks-underwriting
  title: Filings, compliance, and what still blocks underwriting
  body: "The public filing record confirms organizational seriousness but not full financial transparency. Luxembourg filing rules require annual accounts to be approved within six months and filed within seven months, and the public register makes those accounts consultable. North Data and other filing-linked surfaces show current publications for both Satispay Europe and Satispay Invest during June 2026, which is useful confirmation that the entities remain active and current. The 2026 Italian merchant-compliance changes likewise show that the company operates in an ecosystem where settlement, fiscal integration, and regulatory implementation can alter service-delivery economics.\n\nStill, the key diligence blockers remain unresolved. Reviewed public filing surfaces do not give clean revenue line items, margin by product, cash-on-hand, monthly burn, working-capital lockup, default or fraud loss rates, or CAC/payback. Without those, investors can form a directional view on growth quality\
    \ but not a fully underwritten one. This is why the financial call on Satispay remains more about confidence ranges and diligence asks than about false precision."
