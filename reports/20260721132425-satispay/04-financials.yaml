company:
  name: Satispay
chapter:
  number: 4
  title: Financials
  summary: 'Public evidence suggests Satispay has become a real multi-line revenue platform rather than a single-wallet experiment, with merchant fees, welfare volumes, investing assets, card subscriptions, and value-added services all contributing to the story. The best public current revenue proxy is management-reported annualised revenue above €116 million as of May 2026, alongside reported gross operating profitability across core lines, €670 million of deposits, and significant welfare and investment traction. The main underwriting problem is not lack of momentum but lack of line-item transparency: public filing surfaces confirm legal-entity activity and filing cadence, yet do not expose enough clean revenue, margin, take-rate, CAC, or cash-burn data to fully underwrite unit economics.'
sections:
- id: revenue-model-and-what-is-visible
  title: Revenue model and what is visible
  body: "Satispay's public economic model is broader than the simple slogan of 'cheap payments' implies. Official pricing pages show clear merchant monetization in-store and online. The 2026 product stack adds cards that appear to be tied to subscription plans, while welfare, investments, top-ups, and gift cards create additional monetization vectors beyond base payment fees. Public press also indicates that management now thinks in terms of business lines, not just one wallet product: EU-Startups explicitly references payments, welfare, and value-added services when describing operating profitability.\n\nThe problem is that visibility is uneven. Pricing is clear, but realized take rate is not. Revenue is reported at the company level, but line mix is not. Some new products, like Invested Money Box, appear strategically important but fee-light or even zero-fee at present, which may prioritize engagement over direct monetization. That means the public record is strong enough to map the revenue\
    \ architecture, but not strong enough to prove which streams are already economically decisive."
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI007
  - CI012
  - CI035
  tableRefs:
  - TI001
  - TI002
