- id: traction-growth-and-cost-structure
  title: Traction, growth, and cost structure
  body: "The strongest positive financial evidence comes from management-reported 2026 scale. Annualised revenue above €116 million, 80% YoY growth over the prior two quarters, €670 million of deposits, fast-rising welfare volumes, 500,000-plus investors, and early BNPL usage all point to a platform with meaningful transaction intensity rather than vanity adoption alone. In addition, the company's 2025 hiring program suggests management was still willing to add hundreds of employees across engineering, cloud, and business functions rather than shifting immediately into austerity mode.\n\nThose same facts also imply cost. A workforce above 700 with 400 incremental hires, stock-option programs, new offices, cards rollout, welfare support, and investment expansion all raise the likely burn base and operating complexity. Public sources therefore support the conclusion that Satispay is growing into a heavier operating model. What they do not show is whether contribution margins, customer-acquisition\
    \ efficiency, or fixed-cost absorption are good enough to turn gross operating profitability into durable free-cash-flow quality."
  claimRefs:
  - CI006
  - CI008
  - CI009
  - CI010
  - CI011
  - CI013
  - CI025
  - CI026
  - CI027
  - CI039
