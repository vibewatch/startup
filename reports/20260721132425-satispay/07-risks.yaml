company:
  name: Satispay
chapter:
  number: 7
  title: Risks
  summary: Satispay’s risk profile is not dominated by one existential issue; it is a stacked risk story. The company operates regulated wallet, welfare, investing, and cards surfaces across multiple entities while scaling quickly and still relying on external capital. The strongest visible risks are regulatory-governance burden, partner / outage dependency, pricing and margin pressure, and the opacity of key control metrics such as safeguarding, complaints backlog, retention, and runway. The business remains investable directionally, but only with tight diligence on governance, operating controls, and economics.
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: "Satispay’s regulatory profile is both a strength and a risk. The company visibly operates under licensed entities for payments and investments, and it repeatedly surfaces those identifiers across legal and public pages. That transparency is a positive sign. But regulation also becomes heavier as the product surface broadens. The Luxembourg legal hub explicitly references documentation checks tied to identity, bank-account ownership, and source of funds, while 2026 CSSF guidance for EMIs and payment institutions raises the bar on governance, risk management, and internal controls. For a business moving deeper into investing and cards, this is not a light-touch compliance environment.\n\nThe real risk is not licensing status today; it is whether governance, safeguarding, and controls stay strong enough as transaction volumes, product count, and jurisdictions expand. Public sources show the obligation. They do not prove the quality of internal execution. A sanction, missed governance\
    \ deadline, or weakness in AML / safeguarding practice would therefore be much more damaging than a generic software bug. This is why regulatory diligence here should focus on board process, internal audit, escalation logs, and evidence of actual control testing rather than on the existence of licenses alone."
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR009
  - CR010
  - CR014
  - CR034
  - CR042
  tableRefs:
  - TR001
  figureRefs:
  - FR001
  - FR002
- id: operational-and-partner-risk
  title: Operational and partner risk
  body: "Operational risk rises with every layer Satispay adds. Refund policies reveal real edge-case support work: physical-store refunds are time-limited, some terminal flows have extra constraints, and online refunds run for much longer windows. Merchant compliance is also changing underneath the business. Italy’s 2026 rules on electronic-money acceptance and terminal-to-register linkage create integration and support obligations that can increase merchant friction even when they expand the addressable market. On top of that, Satispay depends on partners for key surfaces—Worldpay for merchant distribution, Mastercard and IDEMIA for cards, and broader acceptance infrastructure across the ecosystem.\n\nPublic outage evidence is limited but not zero. A severe PPRO degradation in April 2026 shows that third-party failure can directly hit Satispay transaction flows. Because payments and trust are tightly linked, short outages can have disproportionate reputational impact. The operational risk\
    \ question is therefore not whether Satispay has ever had an issue; every scaled payments system will. The question is whether internal observability, escalation, and partner governance are strong enough to keep such incidents small and recover quickly. Diligence should therefore ask for incident-response playbooks, partner SLAs, and actual postmortem evidence, not just customer-facing help-center content."
  claimRefs:
  - CR006
  - CR007
  - CR008
  - CR017
  - CR018
  - CR022
  - CR023
  - CR024
  - CR019
  - CR036
  tableRefs:
  - TR002
  - TR003
  figureRefs:
  - FR003
- id: financial-customer-and-execution-risk
  title: Financial, customer, and execution risk
  body: "The financial and execution risks are tightly coupled. Satispay is clearly growing, but it still chose to raise more capital in 2026 and has already changed pricing once for sustainability reasons. That combination suggests the model is promising but not yet fully de-risked. The public record still does not disclose the key control metrics investors would want: runway, loss-adjusted margins, customer concentration, merchant churn, and unit economics by line. Multi-product expansion amplifies the problem. Cards can create support and margin pressure. Investing brings suitability and governance expectations. Welfare adds employer-side complexity. Rapid hiring and geographic spread can improve execution capacity, but also make coordination harder.\n\nCustomer breadth helps offset concentration risk directionally, yet the lack of disclosed concentration data means a hidden dependency could still exist at the merchant, employer, or partner level. In other words, the core risk is not\
    \ a visible collapse; it is the possibility that several moderate risks—pricing pressure, control burden, partner reliance, and capital need—compound before public metrics make the deterioration obvious. The practical implication is that Satispay may look safer in a headline summary than it does in a control-and-metrics workroom, where missing retention, loss, and runway data would matter immediately. That gap between visible brand strength and invisible operating detail is itself an investment risk, because it can delay detection of deterioration until corrective options are more limited."
  claimRefs:
  - CR015
  - CR016
  - CR026
  - CR027
  - CR028
  - CR029
