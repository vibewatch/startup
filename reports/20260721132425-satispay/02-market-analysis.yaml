  - FM004
- id: drivers-constraints-and-what-still-needs-proving
  title: Drivers, constraints, and what still needs proving
  body: "Several structural drivers support the market. Europe keeps shifting from cash to digital payments; younger consumers already rely heavily on wallets; POS density is rising; instant-payment infrastructure is improving; and the Digital Markets Act weakens Apple's prior NFC exclusivity on iPhone in the EU. These are all helpful for domestic wallet challengers and account-to-account approaches. Satispay also benefits from expanding into welfare and investments, because those categories enlarge its addressable budget pools beyond checkout alone.\n\nThe constraints are just as important. Europe remains fragmented, US card and wallet infrastructure still dominates much of the stack, and local incumbents such as Bancomat retain strong acceptance advantages. Most importantly, public evidence does not yet give a neat market map by active merchant cohort, geography, or take-rate bucket. That means market size is not the core debate; accessible share, switching friction, and monetization durability\
    \ are. A good investment case should therefore treat Satispay's market as real and growing, but still require primary diligence before converting growth headlines into a firm SAM or long-term-margin assumption."
