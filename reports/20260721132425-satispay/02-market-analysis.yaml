  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-gap
    missingEvidence: A bottom-up SAM by active merchant vertical, geography, and paying cohort.
    whyItMatters: Headline payment-market statistics overstate what Satispay can actually reach and monetize today.
    diligencePath: Request active merchant counts, payment frequency, and revenue by country / merchant vertical.
    relatedQuestionRefs:
    - QM021
    - QM025
  - type: private-evidence-only
    severity: material
    topic: merchant-cohorts
    missingEvidence: Merchant cohort conversion from signup to active recurring payment flow, including post-repricing retention.
    whyItMatters: Market attractiveness depends on density and repeat usage, not just logo count.
    diligencePath: Request merchant activation, churn, and repeat-use cohorts before and after pricing changes.
  - type: private-evidence-only
    severity: minor
    topic: cross-border-penetration
    missingEvidence: Country-level adoption for France, Luxembourg, and any newer EU expansion markets.
    whyItMatters: A pan-European market narrative is only as credible as country-by-country traction.
    diligencePath: Obtain user, merchant, and volume splits by market from management.
  - type: conflicting-data
    severity: minor
    topic: wallet-share-conflict
