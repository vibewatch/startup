    - Merchant pays acceptance fee; consumer chooses wallet
    - Core current market
  - - Consumer wallet services
    - P2P transfers, bill pay, top-ups, gift cards, savings pots
    - Full primary current-account relationship
    - Consumer as end user; some premium subscriptions
    - Boosts app frequency and retention
  - - Corporate welfare
    - Meal vouchers, benefits, reimbursement-like employer flows
    - Full HRIS / payroll outsourcing
    - Employer budget owner, worker end user
    - Important adjacency that broadens TAM
  - - Retail investing and savings
    - Money-box, funds, planned stock/ETF trading
    - High-touch advisory, institutional investing
    - Consumer funds account / subscription relationship
    - Extends share of wallet beyond payments
  - - Cross-border pan-European wallet layer
    - Future interoperability and expansion opportunity
    - Global card-scheme replacement in the near term
    - Mixed banks, merchants, consumers
    - Strategic upside, not yet the core business
  notes: The table defines Satispay's addressable market by workflow rather than by a generic all-payments TAM; included and excluded spend intentionally separate current reality from long-term optionality.
