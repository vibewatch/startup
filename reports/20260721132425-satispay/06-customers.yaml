- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Merchant discoverability in app
    - Unknown share from largest merchant groups
    - Could inflate perceived breadth versus transacting depth
    - Request spend and transactions by merchant cohort
  - - Employer welfare rollout
    - Unknown share from largest employers or channels
    - Could create hidden B2B concentration
    - Request employer revenue concentration
  - - Adjacency cross-sell
    - Unknown attachment by investing / BNPL / cards
    - Could overstate durability if modules are shallowly adopted
    - Request module attachment and repeat usage
  - - Partner channels like Worldpay
    - Unknown share of merchant acquisition via partners
    - Could weaken direct GTM control
    - Request direct vs indirect merchant-origin split
  - - Geographic concentration in Italy
    - Italy still appears dominant
    - Could limit resilience of pan-European narrative
    - Request country-by-country active cohorts
  notes: The network looks broad, but concentration remains unquantified.
