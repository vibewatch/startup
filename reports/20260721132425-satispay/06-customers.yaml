company:
  name: Satispay
chapter:
  number: 6
  title: Customers
  summary: 'Satispay has real multi-sided customer proof: millions of consumers, hundreds of thousands of merchants, tens of thousands of welfare-company buyers, and hundreds of thousands of welfare workers. Named customer evidence is stronger than simple logo-dropping because multiple sources describe live national rollout at Carrefour and repeated brand participation from Decathlon, Trenitalia, Eataly, and others. The major customer diligence gaps are durability and concentration, because public sources still do not reveal churn, retention, cohort activity, or dependence on any single merchant, employer, or partner channel.'
sections:
- id: who-pays-and-who-uses
  title: Who pays and who uses
  body: "Satispay's customer base is structurally multi-sided. Consumers use the app to pay, transfer money, and increasingly invest or use BNPL. Merchants buy acceptance and, in e-commerce, buy access to a customer base that Satispay says already has the app installed. Employers buy welfare or voucher programs, while employees are the end users of those benefits. That split matters because the company is not growing only by adding more consumer downloads; it is also selling distribution, checkout, or benefits infrastructure to businesses and employers.\n\nThis segmentation helps explain why Satispay can widen its product scope without changing its brand entirely. A single user can be a consumer, a worker using meal vouchers, and an investor within the same app. A merchant can start with checkout acceptance and then benefit from discoverability, loyalty points, or welfare spend. The stronger the overlap across these roles, the more durable the customer base could become—but public sources\
    \ still expose breadth much better than retention."
  claimRefs:
  - CU001
  - CU014
  - CU033
  - CU034
  - CU035
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-scale-proof
  title: Adoption trajectory and scale proof
  body: "The public adoption trajectory is one of the strongest parts of the diligence file. TechCrunch reported 3 million consumers and 200,000 merchants in 2022. EU-Startups reported more than 5 million users and 380,000 merchants in 2024. By June 2026, EU-Startups reported 6.5 million users and more than 450,000 affiliated merchants. Welfare shows a similarly steep climb, from 12,000 corporate clients and 50,000 users in 2024 to 43,000 companies and more than 400,000 workers in 2026.\n\nThose numbers do not answer everything. They do not show activity frequency, churn, or monetization by cohort. But they do show that Satispay has moved beyond anecdotal adoption into a scaled multi-cohort network. The existence of investor users and BNPL users adds another signal that the customer base is broadening, not just growing in one narrow payment use case."
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU009
  - CU010
  - CU012
  - CU013
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-customer-proof-and-reference-quality
  title: Named customer proof and reference quality
  body: "Named customer evidence is materially better than a typical private-fintech logo wall. Carrefour is the clearest example: Satispay's newsroom, blog, and independent coverage all describe a national meal-voucher rollout across approximately 1,200 stores, with completion planned in early 2025 and app-based discovery of enabled locations. That is not a pilot; it is a production deployment with concrete customer workflow details. Other sources name Decathlon, Trenitalia, Trenord, Eataly, Autogrill, Esselunga, Coop, Conad, and other recognizable brands or chains.\n\nStill, the quality of proof differs by row. Carrefour has direct rollout detail. Supermarket welfare acceptance is well supported but broader and more category-oriented. Brand mentions such as Decathlon or Trenitalia are persuasive evidence of network relevance, yet they reveal less about transaction intensity or contract durability. The right conclusion is that named proof is real and varied, but not yet rich enough to substitute\
    \ for cohort-level merchant, employer, or repeat-usage data."
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU023
  - CU025
  - CU030
  - CU039
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: durability-expansion-and-concentration-risk
  title: Durability, expansion, and concentration risk
  body: "The public record gives several imperfect durability proxies. App-store and Trustpilot ratings are strong overall. TheBanks.eu also reports good customer sentiment. Satispay claims high online conversion and emphasizes app-based discoverability, which both suggest users understand the workflow once it is enabled. Welfare, investing, and BNPL all create reasons for existing customers to stay inside the same ecosystem longer. These are constructive signals, especially for a product that competes in habit-driven payments.\n\nBut the critical caution is unchanged: public retention evidence is thin. There is no NRR, GRR, renewal-rate, merchant churn, employer retention, or top-customer concentration disclosure. The network appears broad and diversified, which lowers the probability that one named brand defines the whole story, but the degree of dependence on large merchants, welfare employers, or partner channels is still unknown. That makes durability directionally positive and quantitatively\
    \ underproven. Investors should therefore treat the visible customer proof as strong scope evidence, not as a substitute for cohort reporting today."
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
