  topStrengths:
    - 公开证据能支撑真实网络效应：到 2026 年 6 月已有 650 万用户、超过 450,000 家商户。
    - 产品边界已经从钱包支付扩到福利、投资和借记卡，平台可选性不再只是叙事。
    - 创始人控制权和多轮投资人支持，降低了公司只是短期本地 App 故事的风险。
    - 绝对估值低于已规模化的上市和准上市 fintech 龙头；如果经济模型成熟，仍有上行空间。
  topRisks:
    - 公开披露仍未给出 GMV、抽成率、CAC、回本周期、流失率或经审计单位经济细节，难以支撑买入级估值判断。
    - 护城河目前最强的地方仍是意大利和本地商户密度，还没达到全球主导支付平台的层级。
    - 产品扩到卡、投资和福利之后，监管、运营和客服复杂度都会上升。
    - 商户定价调整叠加盈利证据不完整，使增长质量可能没有标题故事看起来那么耐久。
  unresolvedGaps:
    - 当前 GMV、净抽成率、毛利率和自由现金流质量。
    - 主要客户分层下的队列留存、流失率、CAC 和回本周期。
    - 当前股权结构表、投资人权利、优先股堆叠，以及计划中 2026 年增资带来的稀释。
    - 福利、卡和投资相邻业务的经济模型与附着率。
