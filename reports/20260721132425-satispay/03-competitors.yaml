- id: pricing-breadth-and-distribution
  title: Pricing, breadth, and distribution power
  body: "Satispay still competes with a recognizable wedge: low-friction mobile payments and transparent pricing, especially for Italian merchants and shoppers. Its business pages stress no activation fees or monthly subscriptions, while the e-commerce page emphasizes 98% conversion and direct user approval. That compares differently across rivals. SumUp is a merchant operating system with explicit transaction pricing, POS tools, loyalty, next-day payouts, and a business account. Apple Pay and Google Pay do not sell merchant software; instead they ride enormous device and issuer distribution, making them powerful substitutes wherever the merchant already accepts cards. Revolut and Sumeria compete less on merchant acceptance directly and more on overall financial breadth, making them relevant once Satispay moves further into cards and investing.\n\nThe public record therefore points to a very specific competitive truth: Satispay's differentiation is strongest where local merchant onboarding,\
    \ low-ticket economics, and app-led network density matter. Its differentiation is weaker where a rival owns the device default, the primary bank relationship, or a deeper merchant operating stack."
  claimRefs:
  - CP002
  - CP003
  - CP004
  - CP006
