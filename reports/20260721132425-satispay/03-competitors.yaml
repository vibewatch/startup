company:
  name: Satispay
chapter:
  number: 3
  title: Competitors
  summary: 'Satispay competes across several layers at once: merchant-tool providers such as SumUp, device wallets such as Apple Pay and Google Wallet, domestic and European wallet initiatives such as Bancomat Pay or Wero, and super-app-style consumer-finance challengers such as Revolut and Sumeria. Public evidence suggests Satispay is differentiated by its local merchant network, low-ticket relevance, welfare adjacency, and growing in-app breadth, but also exposed to stronger distribution and broader ecosystem power from larger rivals. The main competitive diligence gap is the lack of apples-to-apples public data on active usage, churn, take rate, and GMV across competitors.'
sections:
- id: landscape-classes-and-where-satispay-sits
  title: Landscape classes and where Satispay sits
  body: "Satispay's competitive set is easy to underestimate if it is defined only as 'other payment apps'. In practice it competes against several classes at once. SumUp and similar merchant-tool companies fight for merchant checkout, settlement, and operational workflow. Apple Pay and Google Wallet fight for consumer default behavior on-device and at contactless checkout. Domestic options such as Bancomat Pay, plus European interoperability efforts like Wero and EuroPA, compete for local-bank and account-to-account relevance. Revolut and Sumeria pull the frame even wider by offering broader money-management, savings, and investing experiences that compete for share of wallet rather than just share of checkout.\n\nThat broader map matters because Satispay is no longer just a local QR app either. Its own app-store and website materials now position it as a pay-and-invest product with BNPL, cards, points, and welfare ties. The question is therefore not whether Satispay has competitors; it\
    \ is which competitor class dominates the user job in each workflow and whether Satispay can stay distinctive across more than one of those jobs at once."
  claimRefs:
  - CP001
  - CP007
  - CP008
  - CP012
  - CP016
  - CP019
