  evidenceGaps:
  - type: missing-source
    severity: material
    topic: data-gap
    missingEvidence: Comparable public GMV, active users, churn, take rate, and merchant-activation cohorts across Satispay and peers.
    whyItMatters: Competitive claims are much easier to narrate than to underwrite without normalized usage and monetization data.
    diligencePath: Request cohort metrics from management and benchmark against private-market data sources or diligence room materials.
    relatedQuestionRefs:
    - QP025
  - type: private-evidence-only
    severity: material
    topic: multi-homing
    missingEvidence: Merchant and consumer multi-homing rates across Satispay, cards, Apple/Google wallets, and competing merchant stacks.
    whyItMatters: Switching cost is central to moat durability, and public product pages do not reveal real exclusivity or habit strength.
    diligencePath: Run merchant and user survey work or request internal share-of-wallet data.
    relatedQuestionRefs:
    - QP013
  - type: conflicting-data
    severity: minor
    topic: pricing-comparability
    missingEvidence: Like-for-like pricing by geography, vertical, and blended realized take rate across competitors.
    whyItMatters: Headline public pricing often excludes discounts, subscription bundles, or issuer economics.
    diligencePath: Normalize on effective merchant cost by representative basket and merchant size.
  - type: private-evidence-only
    severity: minor
    topic: review-depth
    missingEvidence: Longitudinal app ratings, support-resolution performance, and complaint categories by geography.
    whyItMatters: Static app-store ratings and review snippets do not show whether satisfaction is durable or improving.
    diligencePath: Pull review-history analytics and customer-support SLAs before relying on current ratings.
    relatedQuestionRefs:
    - QP024
