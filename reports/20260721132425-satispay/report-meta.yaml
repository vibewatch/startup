      background: Public reporting consistently identifies him as part of Satispay's founding trio, though his current operating remit is less visible.
      claimRefs: [CO003]
  foundingLocation: Milan, Italy
  headquarters: Milan, Italy
  productSummary: Account-linked consumer and merchant payments, P2P transfers, welfare benefits, savings and investment services, and subscription debit cards.
  customerFocus: Consumers, merchants, corporate welfare programs, and adjacent financial-services users in Italy with broader EU expansion ambitions.
  businessModel: Consumer payments are mostly free, while monetization comes from merchant subscriptions and broader financial-services attachment across welfare, cards, and investing.
  stage: Series D+ / Unicorn
  fundingStatus: Raised about €320M in the 2022 Series D at unicorn valuation, added €60M in 2024 from existing investors, and in 2026 planned up to €120M more with roughly half already committed.
