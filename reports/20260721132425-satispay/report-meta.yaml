  topStrengths:
    - Real public network proof, including 6.5 million users and more than 450,000 merchants by June 2026.
    - Product scope now extends beyond wallet payments into welfare, investing, and debit cards, creating real platform optionality.
    - Founder control and repeated investor support reduce the risk that the company is only a short-lived local app story.
    - The absolute valuation is smaller than scaled public and near-public fintech leaders, preserving upside if economics mature.
  topRisks:
    - Public disclosures still do not provide GMV, take rate, CAC, payback, churn, or audited unit-economics detail sufficient for a buy-grade valuation call.
    - The moat looks strongest in Italy and in local merchant density, not yet at the level of a globally dominant payments platform.
    - Product expansion into cards, investing, and welfare increases regulatory, operational, and support complexity.
    - Merchant-pricing changes and incomplete profitability evidence raise the risk that growth quality is less durable than the headline story implies.
  unresolvedGaps:
    - Current GMV, net take rate, gross margin, and free-cash-flow quality.
    - Cohort retention, churn, CAC, and payback by major customer segment.
    - Current cap table, investor rights, preference stack, and dilution from the planned 2026 capital increase.
    - Economics and attachment rates for welfare, card, and investing adjacencies.
disclaimer: This report is a public-information diligence snapshot prepared as of 2026-07-21. It is not investment advice. Satispay is a private company, and several core underwriting inputs remain undisclosed or only partially reported in secondary coverage.
