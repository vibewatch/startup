companyProfile:
  summary: Satispay is a Milan-founded Italian fintech that started with account-linked mobile payments and has widened into merchant acceptance, welfare benefits, savings and investment products, and debit cards. Public evidence supports a real local network with 6.5 million users and more than 450,000 merchants by June 2026, plus a Luxembourg EMI structure for payments and separate entities for investing and welfare. The company has crossed the unicorn threshold and retained founder control through successive financings, but it still does not disclose enough audited economics, retention data, or cap-table detail to treat the current valuation like a fully underwritten public-market story.
  foundedDate: '2013-01-01'
  founders:
    - name: Alberto Dalmasso
      role: Co-founder & CEO
      background: Publicly identified as the co-founder and CEO who remains Satispay's main public spokesperson.
      claimRefs: [CO003, CO004]
    - name: Dario Brignone
      role: Co-founder & CTO
      background: Publicly identified as a co-founder and the continuing technology leader behind the platform.
      claimRefs: [CO003, CO005]
    - name: Samuele Pinta
