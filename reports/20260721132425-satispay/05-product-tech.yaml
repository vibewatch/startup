    - Online merchants
    - Live
    - Plugins, PSP routes, direct APIs, app approval flow
    - Need conversion and fraud outcomes by merchant cohort
  - - Corporate welfare
    - Employers and employees
    - Live
    - Meal vouchers, benefits, FlexBen, broad spendability network
    - Need revenue and retention disclosure by employer cohort
  - - Investing
    - Retail consumers
    - Live but still expanding
    - Separate regulated entity with in-app access to instruments
    - Need AUM, funded-account, and monetization data
  - - Subscription-linked cards
    - Retail consumers
    - New in 2026
    - Physical Mastercard cards layered onto digital ecosystem
    - Need issuance volume, usage mix, and unit economics
