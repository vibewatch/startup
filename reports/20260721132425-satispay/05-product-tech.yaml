company:
  name: Satispay
chapter:
  number: 5
  title: Product & Technology
  summary: 'Satispay has evolved from a single mobile-payment flow into a multi-module financial product stack spanning consumer payments, merchant acceptance, e-commerce, welfare, debit cards, and investing. The public developer and partner surface is stronger than many private fintechs: Satispay publishes API docs, direct integration guidance, and partner implementations through Stripe and Worldpay, while job-market evidence suggests a real mobile, data, and software engineering organization. The main technical diligence limits are not whether a product exists, but how resilient and efficient the underlying architecture is, because public materials do not expose internal ledger design, fraud tooling, uptime telemetry, or formal security assurance evidence.'
sections:
- id: product-scope-and-customer-workflow
  title: Product scope and customer workflow
  body: "Satispay's product should not be analyzed as a single QR payment tool anymore. Official pages and app-store surfaces show a layered offering: the core consumer app handles in-store and online payments, P2P transfers, bill payments, top-ups, and gift cards; merchant products cover local business acceptance and e-commerce checkout; welfare covers meal vouchers and employer benefits; investing adds funds, stocks, and ETFs under a separate legal entity; and the 2026 card launch adds a physical debit-card layer to the same ecosystem.\n\nThe workflow is relatively coherent across these modules. Merchants can onboard without dedicated POS hardware, then accept user-approved payments online or offline. Consumers authenticate through the Satispay app rather than exposing card credentials directly to each merchant. Welfare and investing extend the same app relationship into adjacent money-management jobs. That coherence is strategically useful: it means Satispay's product architecture is\
    \ best understood as a wallet-centric operating surface with several regulated and partner-mediated modules attached to it, not as a set of unrelated side products."
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE005
  - CE006
  - CE004
  - CE024
  - CE025
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
  - FE002
- id: technical-surface-and-integration-model
  title: Technical surface and integration model
  body: "Public technical evidence is better than the average private fintech provides. Satispay maintains developer documentation, a direct API surface, and merchant help articles that point implementers to Shopify, WooCommerce, and multiple PSPs. The integration logic is also externally observable through partners. Stripe documents Satispay as a redirect-style payment method implemented through PaymentIntents, while Worldpay documents QR and phone-number flows, transaction limits, and settlement behavior. Satispay's own create-payment docs explain state transitions, refund mechanics, and API-only operations in enough detail to confirm that the company supports a real transactional platform rather than a purely manual merchant product.\n\nAt the same time, the public architecture stops at the boundary that merchants and partners need. We can verify API behavior, payment states, partner integrations, and documented workflows, but not the internal ledger model, fraud stack, orchestration\
    \ layer, cloud architecture, or uptime engineering. For diligence, the question is therefore not whether technical substance exists; it clearly does. The question is whether the unexposed internals are robust enough to support a broader financial platform with cards, welfare, and investing layered onto the same brand promise."
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE014
  - CE015
  - CE017
  - CE018
  - CE020
  - CE035
  - CE036
  tableRefs:
  - TE003
  figureRefs:
  - FE003
- id: trust-compliance-and-product-maturity
  title: Trust, compliance, and product maturity
  body: "Satispay publicly emphasizes regulated-entity structure and secure user authorization rather than classic bank-charter branding. Payments, welfare, and investments are split across separate legal entities, with the legal hub and careers pages repeatedly surfacing CSSF and Luxembourg Business Register identifiers. The app-store descriptions emphasize PIN or biometric confirmation, while the developer and partner docs describe explicit payment states and server-side integration patterns. Those are useful trust signals because they show operational seriousness and product maturity.\n\nThe trust picture is still incomplete. Reviewed materials did not surface a public status page, quantified uptime history, or detailed external security-certification evidence. That does not imply weak engineering, but it does limit how much confidence a third party can assign to reliability and control maturity from open sources alone. Publicly visible maturity is therefore strongest in workflow clarity,\
    \ regulated structure, and partner integration breadth; it is weakest in internal assurance transparency."
  claimRefs:
  - CE007
  - CE039
  - CE026
  - CE039
  - CE037
  - CE038
  - CE040
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: roadmap-and-dependency-profile
  title: Roadmap and dependency profile
  body: "The 2026 roadmap is unusually visible. Press and app-store sources point to live or near-live expansion into cards, Pay in 3, stock and ETF trading, pension products, and other financial-adjacency features. That visibility is a strength because it shows Satispay is shipping more than one-off experiments. It is also a warning because each new layer brings external dependencies. The card stack depends on Mastercard acceptance and IDEMIA delivery. E-commerce distribution depends partly on PSP partners such as Stripe and Worldpay. Merchant breadth still depends on integrations and local acceptance habits. Even recurring-payment support is not uniform across partners, with Stripe enabling it while Worldpay's published profile still marks recurring as unavailable.\n\nThe resulting product posture is ambitious but partner-mediated. Satispay appears capable of building differentiated customer experiences on top of payments, yet some of the most important module launches still rely on counterparties\
    \ for issuance, distribution, or integration. That does not negate product quality, but it means diligence should treat partner resilience and API-layer reliability as central product risks rather than back-office details."
  claimRefs:
  - CE016
  - CE019
  - CE028
  - CE029
  - CE030
  - CE031
  - CE032
  - CE022
  - CE021
