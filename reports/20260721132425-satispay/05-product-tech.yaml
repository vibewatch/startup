  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: architecture-gap
    missingEvidence: Internal ledger design, fraud stack, cloud / data architecture, uptime SLAs, and incident history.
    whyItMatters: Cards, investing, and recurring payments increase operational complexity, but public docs only expose the partner and API edge.
    diligencePath: Request architecture review, incident history, third-party audits, and reliability dashboards.
    relatedQuestionRefs:
    - QE025
    - QE020
  - type: missing-source
    severity: material
    topic: trust-gap
    missingEvidence: Publicly visible security certifications, SOC / ISO coverage, or equivalent external assurance package.
    whyItMatters: Regulated status is not a substitute for operational-control evidence.
    diligencePath: Request formal security/compliance matrix and audit reports.
    relatedQuestionRefs:
    - QE021
  - type: private-evidence-only
    severity: minor
    topic: module-maturity
    missingEvidence: Attachment rates, monthly active usage, and monetization by module for welfare, cards, and investing.
    whyItMatters: The breadth thesis depends on cross-sell depth, not just module existence.
    diligencePath: Request cohort-level module adoption and revenue contribution.
  - type: conflicting-data
    severity: minor
    topic: partner-feature-parity
    missingEvidence: Like-for-like feature matrix across direct API, Stripe, Worldpay, and other PSP routes.
    whyItMatters: Public partner docs already show non-uniform support for recurring and settlement behaviors.
    diligencePath: Build a partner feature matrix from merchant technical docs and live merchant references.
    relatedQuestionRefs:
    - QE024
    - QE016
