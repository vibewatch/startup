  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图类型与 Satispay 的位置
        blocks:
          - type: paragraph
            body: >-
              如果只把竞争集定义成「其他支付应用」，Satispay 很容易被低估。实际情况是，它同时对抗几类玩家。SumUp 等商户工具公司争夺商户结账、清算和运营工作流。Apple Pay 和 Google Wallet
              争夺设备端与非接触结账时的消费者默认行为。Bancomat Pay 等国内选项，加上 Wero、EuroPA 这类欧洲互联互通努力，争夺本地银行和账户到账户相关性。Revolut 和 Sumeria
              则把框架拉得更宽：它们提供更广的钱财管理、储蓄和投资体验，争的是钱包份额，不只是结账份额。


              这张更宽的地图很重要，因为 Satispay 也不再只是一个本地 QR 应用。它自己的应用商店和网站材料，现在把它定位成带 BNPL、卡、积分和福利连接的支付加投资产品。因此问题不是 Satispay
              有没有竞争对手，而是在每个工作流里哪类竞争者主导用户任务，以及 Satispay 能否同时在多个任务上保持差异化。
