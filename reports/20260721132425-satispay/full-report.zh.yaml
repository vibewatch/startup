  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Satispay 的监管画像既是优势，也是风险。公司明确通过持牌实体经营支付和投资业务，并在法律和公开页面反复露出这些标识。这种透明度是正面信号。但产品表面越宽，监管也越重。Luxembourg
              法律中心明确提到与身份、银行账户所有权和资金来源相关的文件检查；2026 CSSF 面向 EMI 和支付机构的指引，又抬高了治理、风险管理和内部控制门槛。对于一家更深入进入投资和卡的公司，这不是轻触式合规环境。


              真正风险不是今天有没有牌照，而是随着交易量、产品数量和司法辖区扩张，治理、资金保护和控制能否继续够强。公开来源显示了义务，却没有证明内部执行质量。因此，一次处罚、错过治理截止日期，或 AML /
              资金保护实务中的弱点，都会比普通软件 bug 伤害大得多。这也是为什么此处监管尽调应关注董事会流程、内部审计、升级日志和实际控制测试证据，而不是只看牌照是否存在。
