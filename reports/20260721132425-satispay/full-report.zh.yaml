            body: >-
              公开监管文件记录确认了组织严肃性，但没有给出完整财务透明度。Luxembourg 申报规则要求年度账目在 6 个月内批准、7 个月内提交，公共登记册也让这些账目可查询。North Data
              和其他申报相关页面显示，Satispay Europe 和 Satispay Invest 在 2026 年 6 月都有当前发布记录，这有助于确认这些实体仍活跃且保持更新。2026
              意大利商户合规变化同样说明，公司所在生态里，清算、税务集成和监管落地都可能改变服务交付经济性。


              关键尽调阻碍仍未解决。已审阅的公开申报页面没有给出清晰收入科目、按产品拆分的利润率、账上现金、月度烧钱、营运资本占用、违约或欺诈损失率，也没有 CAC /
              回本周期。缺少这些，投资人可以对增长质量形成方向性看法，但不能形成完整承销结论。所以，对 Satispay 的财务判断，更多是置信区间和尽调问题，而不是虚假的精确度。
