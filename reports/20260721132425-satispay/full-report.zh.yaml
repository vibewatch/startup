      - number: '8.4'
        title: 佐证材料
        blocks:
          - type: callout
            title: 这家公司值得更深入尽调，不是公开数据层面的稳赢。
            body: 规模和宽度真实存在，但要有信心给一轮融资定价，仍需要私有经济性和控制数据。
            calloutType: insight
            claimRefs:
              - CV001
              - CV025
              - CV026
          - type: callout
            title: 最大估值风险是假精确。
            body: 公开信号足以支持兴趣，但太不完整，无法支撑干净的买入结论。
            calloutType: risk
            claimRefs:
              - CV027
