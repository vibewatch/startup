      - number: '7.2'
        title: 运营与合作伙伴风险
        blocks:
          - type: paragraph
            body: >-
              Satispay 每加一层，运营风险都会上升。退款政策暴露出真实边界场景支持工作：实体店退款有时限，部分终端流程有额外约束，线上退款窗口则长得多。商户合规也在业务底层变化。意大利 2026
              年针对电子货币受理和终端到收银机连接的规则，创造了集成和支持义务；即使这些规则扩大可触达市场，也可能增加商户摩擦。除此之外，Satispay 在关键界面上依赖合作伙伴——Worldpay
              负责商户分发，Mastercard 和 IDEMIA 负责卡，更广受理基础设施贯穿整个生态。


              公开宕机证据有限，但不是零。2026 年 4 月一次严重的 PPRO 降级显示，第三方故障可以直接打到 Satispay 交易流程。支付和信任紧密相连，短时宕机也可能带来不成比例的声誉影响。因此，运营风险问题不是
              Satispay 是否曾经出过问题；任何规模化支付系统都会出问题。问题是内部可观测性、升级机制和合作伙伴治理是否足够强，能把这类事件控制在小范围并快速恢复。尽调因此应要求事故响应手册、合作伙伴 SLA
              和实际复盘证据，而不只是面向客户的帮助中心内容。
