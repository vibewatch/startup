  - id: TV005
    title: 投资逻辑失效与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 如何传导到投资逻辑
      - 行动含义
    rows:
      - - 监管 / 治理失效
        - 重大处罚或治理整改方案
        - 打破信任，并抬高退出折价
        - 暂停或终止流程
      - - 经济模型低于预期
        - 新数据表明留存偏弱或抽佣率偏薄
        - 打破变现质量逻辑
        - 大幅下修估值
      - - 资本压力加剧
        - 再次以更弱条款融资，或出现无法解释的紧迫融资
        - 表明模型自我造血不足
        - 仅保留在观察名单
      - - 商户 / 网络流失
        - 调价或竞争导致商户端明显走弱
        - 打破本地密度护城河逻辑
        - 降低信心，转向悲观情景
    notes: 触发因素聚焦可衡量变化，应该足以改变投委会建议。
