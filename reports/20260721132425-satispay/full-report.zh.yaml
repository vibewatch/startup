  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 交叉销售跑通、增长延续、监管可控
        - 若长成后期 fintech，当前独角兽估值会显得仍偏早
        - 执行摊子铺开、竞争压缩
        - 有可能，但证据不完整
      - - 基准
        - 增长延续、经济性缓慢改善、披露仍不完整
        - 指标改善前，倍数扩张受限
        - 估值仍合理，但并不明显便宜
        - 最符合当前公开记录
      - - 悲观
        - 定价承压、留存走弱、控制负担加重、需要更多资本
        - 上行空间被压缩，下一轮持平 / 艰难融资的下行风险上升
        - 经济性不透明成为核心问题
        - 公开证据无法排除
    notes: 这些情景是有证据支撑的方向性案例，不是 DCF 输出。
