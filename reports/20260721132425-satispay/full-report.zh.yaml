      - number: '2.4'
        title: 驱动因素、约束与仍需证明的事项
        blocks:
          - type: paragraph
            body: >-
              几个结构性驱动支撑这个市场。欧洲持续从现金转向数字支付；年轻消费者已经高度依赖钱包；POS 密度在上升；即时支付基础设施在改善；Digital Markets Act 削弱了 Apple 此前在 EU
              iPhone 上的 NFC 独占。这些都利好本土钱包挑战者和账户到账户路径。Satispay 还受益于福利和投资扩张，因为这些类别把可触达预算池从结账本身向外放大。


              约束同样重要。欧洲仍然碎片化，美国卡和钱包基础设施仍主导大量技术栈，本土既有玩家 Bancomat 等保有很强的受理优势。最重要的是，公开证据还没有按活跃商户队列、地域或 take-rate
              桶给出清晰市场地图。这意味着核心争议不是市场规模，而是可获取份额、切换摩擦和变现耐久性。好的投资案例应把 Satispay 的市场视为真实且增长中，但在把增长标题转成扎实 SAM
              或长期利润率假设前，仍需一手尽调。
