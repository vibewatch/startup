      - number: '2.3'
        title: 买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              只有把买方、用户和付款方压成同一个角色，支付市场才显得简单。Satispay
              不是这样。商户决定是否受理这种方式，并支付核心受理费用。消费者决定应用是否足够方便、商户覆盖是否足够广、订阅或卡等相邻服务是否值得付费。雇主出资企业福利预算，并判断 Satispay
              的受理网络和员工体验是否足以替代或补充既有券类系统。多边结构意味着采用路径不是简单的「更多用户」或「更多商户」；每一边都会解锁下一边。


              市场证据也解释了 Satispay
              的切入点为什么有效。小额支付、透明费用和移动原生结账在意大利重要，因为商户和消费者仍在便利性、银行卡经济性和习惯之间权衡。但同一组证据也说明路径脆弱：定价楔子会变，国际竞争对手会设定用户预期，仅有钱包采用并不保证跨境相关性。因此，Satispay
              的市场机会由关系和密度驱动，而不是单纯按全欧洲支付量等比例放大。
