  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与客户工作流
        blocks:
          - type: paragraph
            body: >-
              不能再把 Satispay 的产品当成单一 QR 支付工具分析。官方页面和应用商店页面显示，它已经是分层供给：核心消费者应用处理线下和线上支付、P2P
              转账、账单支付、充值和礼品卡；商户产品覆盖本地商户受理和电商结账；福利覆盖餐券和雇主福利；投资业务在独立法律实体下加入基金、股票和 ETF；2026 卡发布又给同一生态加上一层实体借记卡。


              这些模块之间的工作流相对连贯。商户无需专用 POS 硬件即可入驻，然后在线上或线下接受用户批准的支付。消费者通过 Satispay
              应用认证，而不是把卡凭证直接暴露给每个商户。福利和投资把同一个应用关系延伸到相邻的钱财管理任务。这种连贯性有战略价值：Satispay
              的产品架构最好理解为一个以钱包为中心的操作界面，外接几个受监管和由合作伙伴中介的模块，而不是一组互不相关的副产品。
