  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Satispay
              的真实市场比「数字支付」这个泛标签更窄，也更有意思。今天公司至少参与三个相邻支出池：日常消费者与商户支付、企业福利受理、入门级零售投资。核心边界仍是商户受理和消费者钱包使用，尤其是小额、移动端主导的流程；在这些场景里，账户绑定、摩擦更低的支付方式可以胜过现金和昂贵的银行卡受理。因此，银行卡、现金、银行转账、PayPal
              式钱包，以及 Bancomat Pay 这类国内替代方案，才是最重要的现状替代。


              哪些东西应留在边界之外？公开证据不支持把 Satispay 当成完整银行、广义企业资金管理服务商或全球发卡方。它自己的法律结构把支付、投资和福利分开，也强化了一个判断：Satispay
              是围绕具体用例拼出更广金融平台，而不是一次性攻击所有金融工作流。因此，做市场分析时，最佳框架是意大利及近欧洲日常支出，加上相邻的钱包份额机会，而不是整个全球金融科技宇宙。
