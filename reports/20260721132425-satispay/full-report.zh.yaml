      - number: '8.3'
        title: 情景逻辑和建议
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求 Satispay 继续复合增长收入、守住本地商户密度，并把相邻产品转化成更高的钱包份额。如果做到，今天的独角兽估值仍可能显得早。
              基准情景更谨慎：增长仍有吸引力，但倍数扩张要等单位经济性、留存和现金生成更清楚。悲观情景假设定价压力、监管或伙伴 / 控制摩擦揭示增长质量弱于标题叙事。


              在这些可能性下，最站得住脚的建议是继续研究 / 观察。这不是否定公司，而是承认当前公开记录更支持方向性兴奋，尚不足以形成可承销的确信。 若 Satispay
              打开核心指标的数据室，或估值纪律改善，投资人可以很快转向建设性判断。在此之前，信心应保持中，风险评级高。


              落到 IC 语境，Satispay 应归入「保持跟踪、追问硬问题、避免无视价格的热情」这一类。公司已经值得更深入尽调，但仅凭公开证据，
              还没有拿到盲目溢价倍数的资格。纪律严明的投资人可以认可方向，同时拒绝把动能、可选性和品牌强度混同为被充分承销的估值支撑。
