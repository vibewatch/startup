chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、模式与受监管运营边界
        blocks:
          - type: paragraph
            body: >-
              Satispay 对外讲得很清楚：公司想成为什么；但法律结构怎么摆，公开信息仍有层次。独立来源和市场数据库给出的基本锚点一致：公司成立于 2013，总部在
              Milan，品牌围绕一个独立移动支付网络建立，承诺让消费者和商户的日常支付更顺。TechCrunch 的 2022
              融资报道尤其有用，因为它解释了最早的商户痛点：意大利小商户不喜欢小额交易上的银行卡费率经济性，Satispay 于是绕开传统卡优先流程，改用应用绑定账户的模式。


              到 2026，运营边界已经比最初的支付故事宽得多。官方页面现在销售消费者支付、P2P 转账、账单支付、充值、福利服务、储蓄、投资产品和订阅绑定借记卡。当前条款页也能看见支撑这套广度的法律架构：支付服务由
              Luxembourg 的 Satispay Europe S.A. 提供；投资服务放在 Satispay Invest S.A.；福利服务由 Milan 的 SatisWelfare S.p.A.
              承接。关键在于，这说明 Satispay 建的是多实体金融平台，不只是一个意大利应用。它也说明公司并不把自己包装成银行。公开姿态基于 EMI 和投资公司，合规、AML
              和反欺诈控制在法律中心被明确讨论，而不是讲银行牌照故事。
