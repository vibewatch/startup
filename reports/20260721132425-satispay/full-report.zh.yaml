      - number: '6.2'
        title: 采用轨迹与规模证明
        blocks:
          - type: paragraph
            body: >-
              公开采用轨迹是这份尽调文件里最强的部分之一。TechCrunch 报道 2022 有 3 million 消费者和 200,000 家商户。EU-Startups 报道 2024 有超过 5 million
              用户和 380,000 家商户。到 2026 年 6 月，EU-Startups 报道 6.5 million 用户和超过 450,000 家关联商户。福利业务也呈现类似陡峭爬升：从 2024 的 12,000
              家企业客户和 50,000 名用户，到 2026 的 43,000 家公司和超过 400,000 名员工。


              这些数字不能回答所有问题。它们没有显示活动频率、流失或按队列拆分的变现。但它们确实说明，Satispay 已经从轶事式采用进入有规模的多队列网络。投资者用户和 BNPL
              用户的存在又增加一个信号：客户基础在变宽，不只是某一个狭窄支付用例在增长。
