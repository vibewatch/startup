      - number: '2.2'
        title: 规模测算视角与已安装基础
        blocks:
          - type: paragraph
            body: >-
              支付市场很容易把自上而下规模讲大，所以更严谨的做法是多视角测算。ECB 数据显示，欧元区非现金市场很大，2024 年上半年有 72.1 billion 笔交易，银行卡仍占支付量多数。Cross-Border
              Magazine 给出一个更贴近 Satispay 的意大利视角：2025 年电商约 €52 billion，到 2027 走向 €82 billion，钱包已拿到线上约 35% 份额。这些数字不等同于
              Satispay 的 TAM，但能为可数字化触达的消费者支出池划边界。


              最有用的 SOM 锚点是 Satispay 自己的网络。公开来源支持到 2026 有 6 到 6.5 million 用户和 450,000 家商户，按意大利标准已经有分量。但 Edgar Dunn 拿它和
              Bancomat 大得多的受理网络相比也同样重要，因为这说明即使不离开意大利，扩张空间仍然存在。换句话说，公司已经证明相关性，但没有管理层披露时，公开数据还不能把这种相关性转成按地域和队列拆分的清晰 SAM。
