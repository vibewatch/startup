            body: >-
              Satispay 公开呈现的经济模型，比「便宜支付」这个简单口号更宽。官方定价页清楚显示，线下和线上商户都在变现。2026
              产品栈加入了看似绑定订阅计划的卡；福利、投资、充值和礼品卡又在基础支付费之外创造额外变现向量。公开媒体也表明，管理层现在按业务线思考，不再只是一个钱包产品：EU-Startups
              描述经营盈利时，明确提到支付、福利和增值服务。


              问题在于可见度不均。定价清楚，实际 take rate 不清楚。收入以公司层面报告，业务线组合不报告。Invested Money Box
              等新产品看起来战略重要，但目前收费很轻，甚至零费用，可能是在把参与度放在直接变现之前。因此，公开记录足以画出收入架构，但还不足以证明哪些收入流已经在经济性上起决定作用。
