      - number: '5.4'
        title: 路线图与依赖画像
        blocks:
          - type: paragraph
            body: >-
              2026 路线图异常可见。媒体和应用商店来源都指向已经上线或接近上线的扩张：卡、Pay in 3、股票和 ETF 交易、养老金产品，以及其他金融相邻功能。这种可见度是优势，因为它说明 Satispay
              推出的不只是一次性实验。它也是警示，因为每一层新功能都会带来外部依赖。卡栈依赖 Mastercard 受理和 IDEMIA 交付。电商分发部分依赖 Stripe、Worldpay 等 PSP
              合作伙伴。商户广度仍依赖集成和本地受理习惯。即便是循环支付支持，在合作伙伴之间也不统一：Stripe 启用该能力，而 Worldpay 公开画像仍把循环支付标为不可用。


              由此形成的产品姿态是有野心，但由合作伙伴中介。Satispay
              看起来有能力在支付之上做出差异化客户体验，但一些最重要模块的发布，仍依赖交易对手完成发行、分发或集成。这并不否定产品质量，但意味着尽调应把合作伙伴韧性和 API 层可靠性当成核心产品风险，而不是后台细节。
