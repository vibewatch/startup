        - 审阅事故指挥和 on-call 成熟度
      - - 相邻产品线的产品领导力
        - 支付 + 福利 + 投资 + 卡片
        - 中
        - 中
        - 分阶段上线并借助伙伴支持
        - 审阅模块级 KPI 和负责人
      - - 客户支持运营
        - 投诉、退款、KYC 文件
        - 中
        - 中
        - 已有正式渠道
        - 审阅积压量、FRT 和 CSAT
    notes: 多个相邻产品同时扩张，执行风险随之上升。
    claimRefs:
      - CR030
      - CR005
      - CR036
      - CR037
  - id: TR005
    title: 缓释与止损标准表
    columns:
      - 风险
      - 可监控触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 监管 / 治理失效
        - 监管行动
        - 任何重大处罚或治理整改计划
        - 立即暂停 / 重新尽调
      - - 合作伙伴中断集中
        - 可用性事故
        - 多次严重支付中断或恢复时间过长
        - 新增资本前，要求先降低伙伴风险
      - - 经济性恶化
        - 定价 / 利润率压力
        - 继续调整定价且商户明显反弹
        - 重新检验护城河和商户弹性假设
      - - 执行摊子铺开
        - 模块上线速度超过控制能力
        - 卡片 / 投资上线，但看不到支持准备度
        - 把投资逻辑收窄到核心支付
      - - 隐性集中
        - 头部账户依赖
        - 意外依赖少数商户 / 雇主 / 合作伙伴
        - 压低估值，并要求集中度约束条款
    notes: 这些触发器设计为可在尽调中和投后持续监控。
