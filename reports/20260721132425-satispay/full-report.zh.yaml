    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              核心投资逻辑很直接：Satispay 已经长成一家真正的多产品金融科技公司，在消费者、商户、福利和投资场景都有实质验证。它不是原型，也不是单一功能。
              公开证据支持几个判断：规模真实、收入继续增长、产品范围变宽、本地商户网络也不容易忽视。2026 年资本计划看起来也不只是防守，更有进攻意味， 说明管理层仍看到较宽的机会集。


              反向逻辑同样清楚。Satispay 对外披露的经济性仍然不完整。它的护城河更像实用且本地化的壁垒，而不是全球统治力。
              商户定价调整说明经济模型仍在调校，受理覆盖仍落后于更强的存量巨头；公司所在市场仍是监管重、伙伴居中、欧洲支付格局碎片化。 这些条件仍能孕育一家很好的公司，但不意味着每个进入价格都值得买。


              一个有用框架是：投资逻辑最强的地方在战略方向，最弱的地方在现金质量证明。投资人若愿意在透明度完全打开前为平台可选性付费，这个故事可以成立。
              投资人若要求先看到可承销的证据再支付增长倍数，那么眼下反向逻辑占上风。这个区分很重要，因为估值错误常常来自在证据还不足以支撑领导者级经济性之前， 就先为未来品类龙头买单。
            claimRefs:
              - CV001
              - CV002
