        - id: proof
          label: 规模与产品宽度证据
        - id: risk
          label: 经济性 / 管控风险
        - id: price
          label: 当前估值背景
        - id: call
          label: 继续研究 / 观察
      edges:
        - - proof
          - call
        - - risk
          - call
        - - price
          - call
    claimRefs:
      - CV001
      - CV025
      - CV029
      - CV026
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 敏感性最高的是经济性质量和估值抬升假设，而不只是收入叙事。
    data:
      items:
        - label: 经济性透明度
          value: 9
        - label: 留存质量
          value: 8
        - label: 增长持久性
          value: 7
        - label: 入场估值
          value: 9
        - label: 监管 / 管控负担
          value: 7
    claimRefs:
      - CV025
      - CV027
      - CV028
      - CV030
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 用于方向性判断：事后回看，今天的入场价可能落在哪个回报区间。
    data:
      items:
        - label: 悲观结果
          low: 0.6
          base: 0.8
          high: 1
          unit: x current valuation
          note: 如果管控和经济性不及预期，估值支撑可能压缩到持平私募估值附近，甚至更低。
        - label: 基准结果
          low: 1
          base: 1.6
          high: 2.2
          unit: x current valuation
          note: 如果增长延续但披露仍不完整，上行空间存在，但可能有限。
        - label: 乐观结果
          low: 2
          base: 3.5
          high: 5
          unit: x current valuation
          note: 需要强交叉销售、可持续单位经济性，以及后续溢价平台重估。
    approximationNotes: 这些是用于约束决策的情景区间，不是模型推导的公允价值。
    claimRefs:
      - CV031
      - CV033
      - CV034
      - CV036
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 面向投委会的现有证据评分。
    data:
      items:
        - label: 市场机会
          value: 8/10
          note: 意大利及邻近 EU 的大市场机会仍然真实。
        - label: 客户证据
          value: 8/10
          note: 多边采用在非上市金融科技公司中罕见地清晰可见。
        - label: 护城河质量
          value: 6/10
          note: 本地网络真实存在，但全球主导地位尚未证明。
        - label: 经济性透明度
          value: 3/10
          note: 核心单位经济性仍未公开。
        - label: 风险 / 管控
          value: 4/10
          note: 治理义务和合作伙伴依赖不可忽视。
        - label: 估值吸引力
          value: 5/10
          note: 并不荒唐，但相对现有证据也不算明显便宜。
    claimRefs:
      - CV020
      - CV025
      - CV028
      - CV029
