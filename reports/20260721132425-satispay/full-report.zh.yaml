      - number: '3.3'
        title: 切换成本、信任姿态与当前护城河
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Satispay
              的护城河是实用型，而非绝对型。正面看，公司有真实已安装基础、意大利商户网络、福利受理，以及不断增长的产品广度。应用商店页面显示，用户现在看到的是一个覆盖支付、BNPL、投资和卡的单一应用。这些相邻业务把更多支付和储蓄行为留在同一处，可以逐步抬高切换成本。信任姿态也重要：Satispay
              反复突出 CSSF 监管、生物识别或 PIN 保护，以及支付和投资分属不同法律实体。


              但这些优势也有明显边界。商户可以在多种支付方式之间多栖。消费者可以把 Satispay 和 Apple Wallet、Google Wallet、银行 app、Revolut
              并用。设备钱包嵌入更广的操作系统例行行为，SumUp 这类商户既有玩家则把支付包进报表、账户和企业银行。由此得到的图景是：公司有真实本地护城河，但还没有锁定型护城河。分发和默认位置仍是大对手最强的武器。
