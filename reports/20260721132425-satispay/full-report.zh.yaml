            body: >-
              公开技术证据好于一般私营金融科技公司。Satispay 维护开发者文档、直接 API 界面，以及把实施方指向 Shopify、WooCommerce 和多个 PSP
              的商户帮助文章。集成逻辑也能通过合作伙伴从外部观察。Stripe 将 Satispay 记录为一种通过 PaymentIntents 落地的重定向式支付方式；Worldpay 则记录 QR
              和手机号流程、交易限额及清算行为。Satispay 自己的 create-payment 文档对状态转换、退款机制和仅 API 操作解释得足够细，能确认公司支撑的是真实交易平台，而不是纯手工商户产品。


              同时，公开架构止步于商户和合作伙伴需要的边界。我们可以验证 API
              行为、支付状态、合作伙伴集成和已记录工作流，但看不到内部账本模型、欺诈栈、编排层、云架构或可用性工程。尽调问题因此不是有没有技术实质；答案显然是有。问题是，未暴露的内部系统是否足够稳，能支撑一个把卡、福利和投资都叠到同一品牌承诺上的更广金融平台。
