        - 证明相邻产品能转化为持久变现和留存
      - - 强增长和局部盈利叙事
        - 经审计或董事会层面的经济性数据，确认现金生成质量
      - - 本地商户网络和福利业务牵引力
        - 证据显示受理密度和切换成本强于当前公开可比对象所暗示的水平
      - - 反向逻辑：定价、控制和披露缺口
        - 更有利的进入价格，或显著更好的披露，会削弱反向逻辑
