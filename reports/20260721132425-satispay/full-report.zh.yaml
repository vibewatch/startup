      - number: '7.3'
        title: 财务、客户与执行风险
        blocks:
          - type: paragraph
            body: >-
              财务风险和执行风险绑在一起。Satispay 增长明确，但 2026 年仍选择继续募资，而且已经因为可持续性调整过一次定价。这个组合说明模型有潜力，
              但风险还没有完全出清。公开记录仍没有披露投资人最想看的关键控制指标：现金跑道、扣除损失后的利润率、客户集中度、商户流失率，
              以及分业务线的单位经济性。多产品扩张会放大问题。卡业务可能带来客服和利润率压力；投资业务会引入适当性和治理要求。福利业务增加雇主侧复杂度。 快速招聘和地域扩张能提升执行能力，也会让协同更难。


              客户覆盖面更宽，方向上有助于分散集中度风险；但集中度数据没有披露，商户、雇主或合作伙伴层面仍可能藏着依赖。换句话说，核心风险不是眼前可见的崩塌；
              而是几类中等风险——定价压力、控制负担、伙伴依赖和资本需求——在公开指标显现恶化之前先叠加。实际含义是，Satispay
              在标题式摘要里可能比在控制与指标尽调室里看起来更安全；在后者，留存、损失和现金跑道数据缺失会立刻影响判断。 可见的品牌强度与不可见的经营细节之间的落差，本身就是投资风险，因为它可能拖到纠偏空间变窄后才暴露恶化。
