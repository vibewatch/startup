        - 消费金融 / BNPL 基准
        - 商业模式更偏信用
      - - SumUp
        - 私人估值 / IPO 目标
        - IPO 目标约 $10-15B；2022 年估值 €8B
        - 商户金融科技 / SMB 操作系统可比公司
        - 商户结构和商业模式不同
    notes: 这张表用于设定区间和校准雄心，不用于一对一套用倍数。
