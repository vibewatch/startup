      - number: '1.2'
        title: 创始人、领导层可见度与治理控制
        blocks:
          - type: paragraph
            body: >-
              创始人故事扎实，但更广的治理图谱只公开了一部分。多个独立来源都把 Alberto Dalmasso、Dario Brignone 和 Samuele Pinta 标为创始三人组；Dalmasso
              仍是最突出的公开面孔，Brignone 仍被标识为
              CTO。招聘页和团队页显示组织在扩张、职能很多，但没有给投资人一张完整的高管梯队图，也没有披露当前董事会委员会、保留事项或完整受益所有权表。落到尽调上，即使组织显然已经大于一个发言人，后续仍应把 Satispay
              视为创始人主导，并把 Dalmasso 周围的关键人集中度当作实质问题。


              控制权动态同样重要。2024 追加轮报道称创始人重新取得多数投票控制权；2026
              增资报道则称新融资后创始人控制仍会保持。这些表述对连续性是正面信号，但不能替代股权结构机制。公开材料没有解释多少控制来自投票权设计、哪些投资者保护仍然存在，也没有说明
              Lightrock、Addition、Greyhound 等长期支持者在董事会影响力上如何分布。因此，第一章的正确结论不是治理薄弱，而是公开证据只能检查一部分治理，后续应把它当成真正的尽调任务，而不是默认假设。
