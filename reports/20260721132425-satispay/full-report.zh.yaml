      - number: '3.2'
        title: 定价、广度与分发能力
        blocks:
          - type: paragraph
            body: >-
              Satispay 仍靠一个可识别楔子竞争：低摩擦移动支付和透明定价，尤其面向意大利商户和购物者。商业页面强调没有激活费或月订阅，电商页面则强调 98% 转化和用户直接批准。不同对手的可比点不一样。SumUp
              是商户操作系统，带明确交易定价、POS 工具、忠诚度、次日打款和企业账户。Apple Pay 和 Google Pay
              不卖商户软件；它们借助巨大的设备和发卡方分发，只要商户已经收卡，就能成为强替代。Revolut 和 Sumeria 不太直接争商户受理，而更多争整体金融广度；当 Satispay
              进一步进入卡和投资后，它们就变得相关。


              因此，公开记录指向一个非常具体的竞争事实：只要本地商户入驻、小额经济性和应用主导的网络密度重要，Satispay 的差异化就最强；如果对手掌握设备默认位、主银行关系或更深的商户操作栈，它的差异化就更弱。
