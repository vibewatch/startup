      - number: '1.4'
        title: 里程碑、未解风险与反向信号
        blocks:
          - type: paragraph
            body: >-
              最近最强的里程碑不是又一次融资，而是 Satispay 扩大的野心。官方和独立来源都显示，平台正从账户绑定移动支付，推进到福利、借记卡、类似货币市场的储蓄产品、投资基金，以及计划中的股票和 ETF
              交易。产品拓宽可能加深参与度并分散收入，尤其是福利业务看起来已经达到有意义的企业规模。但执行风险也随之上升。每一个新产品类别都会带来额外监管、支持和经济性复杂度，而公开文件还看不全这些复杂度。


              反向信号存在，尽管还不到真正丑闻。商户定价在 2025 出现实质调整，并且针对 2026 年 9 月入驻再次变化，说明简单的「€10 以下免费」楔子已经需要修订。Trustpilot
              整体评分仍然扎实，但客户也抱怨充值和易用性摩擦。最值得注意的是，一篇带怀疑态度的 2026 AInvest 文章认为，计划增资更像延长现金跑道，而不是显然的超额需求。这个观点并非定论，来源声誉也低于
              TechCrunch 或 Il Sole 24 Ore，但它抓住了第一章的核心谨慎点：Satispay 显然有采用度，可公开记录仍未完整证明其新多产品超级应用策略的盈利耐久性。
