              具名客户证据明显好于典型私营金融科技公司的标识墙。Carrefour 是最清楚的例子：Satispay 新闻室、博客和独立报道都描述了一个覆盖约 1,200 家门店的全国餐券上线，计划在 2025
              年初完成，并通过应用发现已启用地点。这不是试点；这是带有具体客户工作流细节的生产部署。其他来源还点名
              Decathlon、Trenitalia、Trenord、Eataly、Autogrill、Esselunga、Coop、Conad，以及其他可识别品牌或连锁。


              不过，每一行证据质量不同。Carrefour 有直接上线细节。超市福利受理支撑充分，但更宽泛、更偏类别。Decathlon 或 Trenitalia
              这类品牌提及，是网络相关性的有力证据，却较少揭示交易强度或合同耐久性。正确结论是，具名证明真实且多样，但还没有丰富到可以替代商户、雇主或重复使用的队列级数据。
