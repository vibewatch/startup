      - number: '1.3'
        title: 资本历史、规模指标与产品拓宽
        blocks:
          - type: paragraph
            body: >-
              Satispay 的资本历史足以支撑独角兽身份，但并不完全简单。2022 Series D 是公开交叉验证最干净的一次事件：TechCrunch、Cleary Gottlieb 和 Financial IT
              都支持一轮约 €320 million 的融资，估值超过 €1 billion，由 Addition 领投，投资者阵容包括 Greyhound、Coatue、Lightrock、Block、Tencent 和
              Mediolanum。下一次重大披露是 2024 年 11 月由现有投资者出资的 €60 million 轮，EU-Startups 将其描述为支付、福利和投资服务的加速轮。到 2026 年 6
              月，管理层和媒体来源已经在讨论最多 €120 million 的进一步增资，其中一半已预承诺，同时重申独角兽估值。


              规模信号也强，只是对来源敏感。公司首页仍宣传超过 6 million 用户和超过 450,000 家商户；2026 年 6 月报道把数字推到 6.5 million 用户和超过 450,000
              家商户。同一报道还给出年化收入超过 €116 million、约 €670 million 存款和有意义的福利业务进展。公开招聘数据又提供一个规模线索：Satispay 计划在 2025 新增 400
              名员工，而原有员工数已经超过 700。合在一起，证据支持一个真实且快速放大的平台。未解决的谨慎点在于，累计融资总额和确切经营利润质量还没有以经审计、合并口径在公开记录里透明呈现。
