  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 谁付费、谁使用
        blocks:
          - type: paragraph
            body: >-
              Satispay 的客户基础在结构上是多边的。消费者用应用支付、转账，并越来越多地投资或使用 BNPL。商户购买受理能力；在电商里，还购买 Satispay
              所称已安装应用的客户基础访问权。雇主购买福利或券类计划，员工则是这些福利的最终用户。这种拆分很重要，因为公司增长不只是增加消费者下载；它也在向企业和雇主销售分发、结账或福利基础设施。


              这种分层有助于解释，为什么 Satispay
              能在不彻底改变品牌的情况下拓宽产品范围。同一个用户可以在同一个应用里既是消费者、使用餐券的员工，又是投资者。商户可以从结账受理开始，然后受益于可发现性、忠诚积分或福利支出。这些角色重叠越强，客户基础可能越耐久——但公开来源对广度的披露仍远好于留存。
            claimRefs:
              - CU001
              - CU014
              - CU033
              - CU034
              - CU035
