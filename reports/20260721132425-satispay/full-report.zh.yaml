companyProfile:
  summary: >-
    Satispay 是一家创立于米兰的意大利金融科技公司，起家于账户绑定的移动支付，之后扩展到商户受理、企业福利、储蓄和投资产品以及借记卡。公开证据支持一个真实本地网络：到 2026 年 6 月已有 6.5 million 用户和超过
    450,000 家商户；支付业务采用 Luxembourg EMI
    架构，投资和福利另由独立实体承接。公司已经跨过独角兽门槛，并在连续融资中保住创始人控制权，但经审计经济性、留存数据和股权结构细节披露仍不足，不能把当前估值当作已经完整承销的公开市场故事。
