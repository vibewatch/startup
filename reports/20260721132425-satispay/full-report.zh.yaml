        title: 牵引力、增长与成本结构
        blocks:
          - type: paragraph
            body: >-
              最强的正面财务证据来自管理层报告的 2026 规模。年化收入超过 €116 million、过去两个季度 80% YoY 增长、€670 million 存款、快速上升的福利体量、超过 500,000
              名投资者和早期 BNPL 使用，都指向一个有实质交易强度的平台，而不是只有虚荣采用度。与此同时，公司 2025 招聘计划显示，管理层仍愿意在工程、云和业务职能中新增数百名员工，而不是立刻转入紧缩模式。


              同一组事实也意味着成本。员工数超过 700、增招 400 人、股票期权计划、新办公室、卡推出、福利支持和投资扩张，都会抬高可能的烧钱基线和运营复杂度。因此，公开来源支持一个结论：Satispay
              正在长成更重的运营模型。它们没有显示的是，贡献利润率、获客效率或固定成本吸收是否足够好，能把毛经营盈利转成耐久的自由现金流质量。
