- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Regulatory / governance failure
    - Material sanction or governance remediation program
    - Breaks trust and increases exit discount
    - Pause or stop process
  - - Economics disappointment
    - New data shows weak retention or thin take rates
    - Breaks monetization-quality thesis
    - Re-cut valuation sharply
  - - Further capital stress
    - Another raise on weaker terms or unexplained urgency
    - Signals model not self-funding enough
    - Move to watchlist only
  - - Merchant / network erosion
    - Pricing changes or competition cause clear merchant weakness
    - Breaks local-density moat thesis
    - Lower conviction to bear case
  notes: Triggers focus on measurable changes that should move an IC recommendation.
