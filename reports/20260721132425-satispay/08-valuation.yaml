  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: GMV, take rate, CAC, payback, loss rates, cash burn, and cohort retention by business line.
    whyItMatters: Those variables determine whether the current unicorn valuation is cheap, fair, or expensive in a real underwriting model.
    diligencePath: Request finance and cohort packs before moving from track to buy.
    relatedQuestionRefs:
    - QV022
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Current preference stack, liquidation preferences, detailed dilution terms, and current round economics.
    whyItMatters: Private-round valuation without term detail can misstate effective entry price materially.
    diligencePath: Request cap-table, financing docs, and counsel review.
    relatedQuestionRefs:
    - QV025
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: control-and-risk
    missingEvidence: Detailed control metrics, complaint volumes, incident history, safeguarding tests, and audit outcomes.
    whyItMatters: Valuation confidence is inseparable from control maturity in a regulated payments / investing platform.
    diligencePath: Request governance, audit, and operations-control package.
