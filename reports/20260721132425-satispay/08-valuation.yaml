- id: scenario-logic-and-recommendation
  title: Scenario logic and recommendation
  body: "The bull case requires Satispay to keep compounding revenue, defend its local merchant density, and convert adjacent products into higher share of wallet. If that happens, today’s unicorn mark can still look early. The base case is more cautious: growth remains attractive, but multiple expansion waits for clearer proof on unit economics, retention, and cash generation. The bear case assumes that pricing pressure, regulation, or partner / control friction reveal that growth quality is weaker than the headline narrative suggests.\n\nGiven those possibilities, the most supportable recommendation is research-more / track. This is not a rejection of the company. It is a recognition that the current public record supports directional enthusiasm more than underwritten conviction. An investor could become constructive quickly if Satispay opens the data room on core metrics or if valuation discipline improves. Until then, confidence should remain medium and risk rating high.\n\nIn practical\
    \ IC terms, this means Satispay belongs in the “stay close, ask hard questions, and avoid price-insensitive enthusiasm” bucket. The company has earned deeper diligence. It has not yet earned a blind premium multiple from public evidence alone. A disciplined investor can still like the direction of travel while refusing to confuse momentum, optionality, and brand strength with fully underwritten valuation support."
