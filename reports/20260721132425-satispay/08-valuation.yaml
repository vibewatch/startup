    - Today's unicorn mark proves early relative to later-stage fintech outcomes
    - Execution sprawl, competitive compression
    - Possible but evidence incomplete
  - - Base
    - Growth persists, economics improve slowly, disclosure remains partial
    - Multiple expansion limited until metrics improve
    - Valuation stays reasonable but not obviously cheap
    - Most consistent with current public record
  - - Bear
    - Pricing pressure, weaker retention, control burdens, more capital need
    - Upside compresses and downside to a flat / difficult next round rises
    - Opaque economics become the central issue
    - Cannot be ruled out from public evidence
