evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: >-
      Current board composition, committee charters, reserved matters, and a post-2024 / post-2026 voting-right
      schedule.
    whyItMatters: Founder-control headlines do not reveal investor protections, approval thresholds, or succession risk.
    diligencePath: Request the latest cap table, shareholder agreement summary, and current board / observer list from management.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding-gap
    missingEvidence: >-
      A reconciled lifetime funding schedule separating closed rounds, planned capital increases, and any secondary
      proceeds.
    whyItMatters: >-
      Valuation context and dilution analysis depend on clean capital-history math, which public summaries currently do
      not reconcile.
    diligencePath: Obtain management's round-by-round capitalization table and legal close notices for each financing since 2013.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: leadership-gap
    missingEvidence: >-
      A complete executive-bench map beyond the founders, including finance, risk, operations, and regulated-entity
      leaders.
    whyItMatters: >-
      The public record supports scale, but underwriting operational depth requires more than founder biographies and
      job pages.
    diligencePath: Request an org chart, regulated-entity management roster, and biographies for finance/compliance leadership.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: stale
    severity: minor
    topic: headcount-precision
    missingEvidence: A run-date headcount figure that confirms whether the planned 2025 hiring wave was fully executed.
    whyItMatters: Public sources disclose hiring plans and opening roles, but not a clean as-of-2026 employee count.
    diligencePath: Ask management for current total employees, by geography and legal entity, as of the report run date.
    relatedQuestionRefs:
      - QO013
  - type: missing-source
    severity: material
    topic: sam-gap
    missingEvidence: A bottom-up SAM by active merchant vertical, geography, and paying cohort.
    whyItMatters: Headline payment-market statistics overstate what Satispay can actually reach and monetize today.
    diligencePath: Request active merchant counts, payment frequency, and revenue by country / merchant vertical.
    relatedQuestionRefs:
      - QM021
      - QM025
  - type: private-evidence-only
    severity: material
    topic: merchant-cohorts
    missingEvidence: Merchant cohort conversion from signup to active recurring payment flow, including post-repricing retention.
    whyItMatters: Market attractiveness depends on density and repeat usage, not just logo count.
    diligencePath: Request merchant activation, churn, and repeat-use cohorts before and after pricing changes.
  - type: private-evidence-only
    severity: minor
    topic: cross-border-penetration
    missingEvidence: Country-level adoption for France, Luxembourg, and any newer EU expansion markets.
    whyItMatters: A pan-European market narrative is only as credible as country-by-country traction.
    diligencePath: Obtain user, merchant, and volume splits by market from management.
  - type: conflicting-data
    severity: minor
    topic: wallet-share-conflict
    missingEvidence: Consistent offline and online wallet-share definitions for Italy.
    whyItMatters: Different market reports mix e-commerce, in-store, and mobile-wallet usage in non-comparable ways.
    diligencePath: Normalize market research to one channel definition before using it in a model.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: data-gap
    missingEvidence: Comparable public GMV, active users, churn, take rate, and merchant-activation cohorts across Satispay and peers.
    whyItMatters: Competitive claims are much easier to narrate than to underwrite without normalized usage and monetization data.
    diligencePath: >-
      Request cohort metrics from management and benchmark against private-market data sources or diligence room
      materials.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: multi-homing
    missingEvidence: >-
      Merchant and consumer multi-homing rates across Satispay, cards, Apple/Google wallets, and competing merchant
      stacks.
    whyItMatters: >-
      Switching cost is central to moat durability, and public product pages do not reveal real exclusivity or habit
      strength.
    diligencePath: Run merchant and user survey work or request internal share-of-wallet data.
    relatedQuestionRefs:
      - QP013
  - type: conflicting-data
    severity: minor
    topic: pricing-comparability
    missingEvidence: Like-for-like pricing by geography, vertical, and blended realized take rate across competitors.
    whyItMatters: Headline public pricing often excludes discounts, subscription bundles, or issuer economics.
    diligencePath: Normalize on effective merchant cost by representative basket and merchant size.
  - type: private-evidence-only
    severity: minor
    topic: review-depth
    missingEvidence: Longitudinal app ratings, support-resolution performance, and complaint categories by geography.
    whyItMatters: Static app-store ratings and review snippets do not show whether satisfaction is durable or improving.
    diligencePath: Pull review-history analytics and customer-support SLAs before relying on current ratings.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: unit-econ-gap
    missingEvidence: GMV, effective take rate, CAC, payback, chargeback / fraud losses, and margin by product line.
    whyItMatters: Without those, it is impossible to judge whether reported topline momentum translates into durable equity value.
    diligencePath: Request monthly financial packs and cohort economics by product line.
    relatedQuestionRefs:
      - QI016
      - QI021
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: >-
      Cash on hand, monthly burn, downside runway, and working-capital lockup under the current hiring and product
      roadmap.
    whyItMatters: The 2026 raise cannot be fully judged as offensive or defensive without runway and settlement-float context.
    diligencePath: Request treasury view, board-approved cash plan, and customer-funds segregation / settlement schedule.
    relatedQuestionRefs:
      - QI013
      - QI012
      - QI011
  - type: missing-source
    severity: minor
    topic: filings-detail
    missingEvidence: Direct machine-readable statutory line items for Satispay Europe and Satispay Invest annual accounts.
    whyItMatters: Open-source filing surfaces proved existence and recency of filings but not clean numerical extraction.
    diligencePath: Obtain official register extracts or management-provided statutory accounts.
    relatedQuestionRefs:
      - QI020
  - type: conflicting-data
    severity: minor
    topic: pricing-history
    missingEvidence: Clean history of how merchant pricing evolved across 2025 and 2026 by merchant cohort.
    whyItMatters: >-
      Reported pricing changes show monetization pressure, but public pages emphasize current or future list rates
      rather than cohort realization.
    diligencePath: Request cohort-level merchant pricing migration and churn around price changes.
    relatedQuestionRefs:
      - QI022
  - type: private-evidence-only
    severity: material
    topic: architecture-gap
    missingEvidence: Internal ledger design, fraud stack, cloud / data architecture, uptime SLAs, and incident history.
    whyItMatters: >-
      Cards, investing, and recurring payments increase operational complexity, but public docs only expose the partner
      and API edge.
    diligencePath: Request architecture review, incident history, third-party audits, and reliability dashboards.
    relatedQuestionRefs:
      - QE025
      - QE020
  - type: missing-source
    severity: material
    topic: trust-gap
    missingEvidence: Publicly visible security certifications, SOC / ISO coverage, or equivalent external assurance package.
    whyItMatters: Regulated status is not a substitute for operational-control evidence.
    diligencePath: Request formal security/compliance matrix and audit reports.
    relatedQuestionRefs:
      - QE021
  - type: private-evidence-only
    severity: minor
    topic: module-maturity
    missingEvidence: Attachment rates, monthly active usage, and monetization by module for welfare, cards, and investing.
    whyItMatters: The breadth thesis depends on cross-sell depth, not just module existence.
    diligencePath: Request cohort-level module adoption and revenue contribution.
  - type: conflicting-data
    severity: minor
    topic: partner-feature-parity
    missingEvidence: Like-for-like feature matrix across direct API, Stripe, Worldpay, and other PSP routes.
    whyItMatters: Public partner docs already show non-uniform support for recurring and settlement behaviors.
    diligencePath: Build a partner feature matrix from merchant technical docs and live merchant references.
    relatedQuestionRefs:
      - QE024
      - QE016
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, renewal, merchant retention, employer retention, and cohort activity by segment.
    whyItMatters: Customer breadth is visible, but durability is the core unanswered underwriting variable.
    diligencePath: Request cohort tables by consumers, merchants, employers, and investors.
    relatedQuestionRefs:
      - QU012
      - QU025
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue and transaction concentration by merchant, employer, and channel partner.
    whyItMatters: Named-brand breadth does not prove low concentration.
    diligencePath: Request top-10 customer concentration and partner-origin split.
    relatedQuestionRefs:
      - QU017
      - QU018
      - QU025
  - type: missing-source
    severity: minor
    topic: activity-quality
    missingEvidence: Active-user, active-merchant, and active-employer denominators behind headline counts.
    whyItMatters: Registered or affiliated counts can overstate true recurring usage.
    diligencePath: Request MAU / MTU and active-merchant thresholds.
  - type: conflicting-data
    severity: minor
    topic: brand-proof-depth
    missingEvidence: Transaction volumes and contract depth for named brands such as Decathlon and Trenitalia.
    whyItMatters: Brand mentions are useful proof of presence but weaker than rollout or contract detail.
    diligencePath: Request merchant references with production volumes and duration.
    relatedQuestionRefs:
      - QU023
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer, top-employer, and partner-origin concentration plus churn and renewal by cohort.
    whyItMatters: Public breadth does not reveal whether risk is actually diversified.
    diligencePath: Request concentration tables and cohort-retention metrics.
    relatedQuestionRefs:
      - QR013
    relatedTableRefs:
      - TR001
      - TR003
      - TR005
  - type: private-evidence-only
    severity: material
    topic: control-effectiveness
    missingEvidence: >-
      Internal audit, safeguarding policy detail, incident history, status metrics, complaint backlog, and security
      assurance reports.
    whyItMatters: Public evidence shows the compliance burden, not whether the control system is strong enough.
    diligencePath: Request governance deck, audit results, SLA / incident dashboard, and certification package.
    relatedQuestionRefs:
      - QR007
      - QR025
  - type: private-evidence-only
    severity: material
    topic: working-capital
    missingEvidence: >-
      Segregation mechanics, liquidity stress testing, and treasury / runway detail for customer funds and expansion
      plans.
    whyItMatters: Payments, investing, and rapid growth can create hidden balance-sheet stress.
    diligencePath: Request treasury pack, safeguarding controls, and downside-liquidity scenarios.
    relatedQuestionRefs:
      - QR015
      - QR012
  - type: conflicting-data
    severity: minor
    topic: pricing-elasticity
    missingEvidence: Merchant churn or GMV impact around the 2025 / 2026 pricing changes.
    whyItMatters: A pricing fix can improve economics or quietly weaken adoption.
    diligencePath: Request merchant-cohort retention and volume around repricing.
    relatedQuestionRefs:
      - QR009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: GMV, take rate, CAC, payback, loss rates, cash burn, and cohort retention by business line.
    whyItMatters: >-
      Those variables determine whether the current unicorn valuation is cheap, fair, or expensive in a real
      underwriting model.
    diligencePath: Request finance and cohort packs before moving from track to buy.
    relatedQuestionRefs:
      - QV022
      - QV030
    relatedTableRefs:
      - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Current preference stack, liquidation preferences, detailed dilution terms, and current round economics.
    whyItMatters: Private-round valuation without term detail can misstate effective entry price materially.
    diligencePath: Request cap-table, financing docs, and counsel review.
    relatedQuestionRefs:
