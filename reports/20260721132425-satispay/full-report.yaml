      - number: '2.3'
        title: Buyers, payers, and the adoption path
        blocks:
          - type: paragraph
            body: >-
              Payments markets only look simple if buyer, user, and payer are collapsed into one actor. For Satispay
              they are not. Merchants decide whether to accept the method and pay the core acceptance fee. Consumers
              decide whether the app is convenient enough to use, whether merchant coverage is broad enough, and whether
              adjacent services like subscriptions or cards are worth paying for. Employers fund welfare budgets and
              choose whether Satispay's acceptance network and employee experience are good enough to replace or
              complement incumbent voucher systems. That multi-sided structure means the adoption path is not just 'more
              users' or 'more merchants'; each side unlocks the next.


              The market evidence also suggests why Satispay's wedge works. Low-ticket payments, transparent fees, and
              mobile-native checkout matter in Italy because merchants and consumers still balance convenience against
              card economics and habit. But the same evidence shows the path is fragile: the pricing wedge can change,
              international competitors set user expectations, and wallet adoption alone does not guarantee cross-border
              relevance. Satispay's market opportunity is therefore relational and density-driven rather than purely
              proportional to all European payment volumes.
            claimRefs:
