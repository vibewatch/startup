chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, model, and regulated operating footprint
        blocks:
          - type: paragraph
            body: >-
              Satispay's public identity is unusually clear on what it wants to be and still somewhat nuanced on how the
              legal structure is arranged. Independent sources and market databases converge on the basic anchors: the
              company was founded in 2013, is headquartered in Milan, and built its brand around an independent mobile
              payment network that promises lower-friction everyday payments for consumers and merchants. TechCrunch's
              2022 funding coverage is especially useful because it explains the original merchant pain point: small
              Italian merchants disliked card-fee economics on low-ticket purchases, and Satispay tried to route around
              that problem with an app-linked account model rather than a traditional card-first flow.


              The operating perimeter is broader in 2026 than the original payment story. Official pages now market
              consumer payments, P2P transfers, bill pay, top-ups, welfare services, savings, investment products, and
              subscription-linked debit cards. The legal stack behind that breadth is visible on current terms pages.
              Payment services are provided by Luxembourg-based Satispay Europe S.A.; investment services sit in
              Satispay Invest S.A.; welfare services sit in Milan-based SatisWelfare S.p.A. That matters because it
              shows Satispay is building a multi-entity financial platform, not just a single Italian app. It also
              clarifies that the company is not presenting itself as a bank. The public posture is EMI- and
              investment-firm based, with compliance, AML, and fraud controls explicitly discussed in the legal hub
              rather than a bank-charter narrative.
