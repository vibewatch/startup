      - number: '3.3'
        title: Switching costs, trust posture, and current moat
        blocks:
          - type: paragraph
            body: >-
              The public evidence suggests Satispay's moat is practical rather than absolute. On the positive side, the
              company has a real installed base, a merchant network in Italy, welfare acceptance, and growing product
              breadth. App-store surfaces show that users now see a single app spanning payments, BNPL, investing, and
              cards. Those adjacencies can raise switching costs gradually by keeping more payment and savings behavior
              in one place. Trust posture also matters: Satispay repeatedly foregrounds CSSF regulation, biometric or
              PIN protection, and separate legal entities for payments and investments.


              But those advantages coexist with obvious limits. Merchants can multi-home across payment methods.
              Consumers can keep Satispay alongside Apple Wallet, Google Wallet, bank apps, and Revolut. Device wallets
              embed themselves in broader operating-system routines, while merchant incumbents like SumUp wrap payments
              inside reporting, accounts, and business banking. The resulting picture is of a company with a real local
              moat, but not yet a lock-in moat. Distribution and default positioning remain the strongest weapons of
              larger rivals.
