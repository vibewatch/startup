      - number: '1.4'
        title: Milestones, open risks, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The strongest recent milestone is not just another funding event; it is Satispay's widening ambition.
              Official and independent sources show the platform moving from account-linked mobile payments into
              welfare, debit cards, money-market-like savings products, investment funds, and planned stock and ETF
              trading. That broadening could deepen engagement and diversify revenue, especially because welfare already
              appears to have reached meaningful corporate scale. But it also increases execution risk. Each new product
              category introduces additional regulatory, support, and economics complexity that is not fully visible in
              public filings.


              Adverse signals exist, even if they stop short of a true scandal. Merchant pricing changed materially
              during 2025 and again for September 2026 onboarding, showing that the simple 'free under €10' wedge has
              already needed revision. Trustpilot still shows solid overall ratings, but customers also complain about
              top-ups and usability friction. Most notably, a skeptical 2026 AInvest note argues that the planned
              capital increase looks more like runway extension than obviously excess demand. That view is not
              definitive and comes from a lower-reputation source than TechCrunch or Il Sole 24 Ore, but it captures the
              core chapter-one caution: Satispay clearly has adoption, yet the public record still does not fully prove
              the earnings durability of its new multi-product super-app strategy.
