  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Satispay’s regulatory profile is both a strength and a risk. The company visibly operates under licensed
              entities for payments and investments, and it repeatedly surfaces those identifiers across legal and
              public pages. That transparency is a positive sign. But regulation also becomes heavier as the product
              surface broadens. The Luxembourg legal hub explicitly references documentation checks tied to identity,
              bank-account ownership, and source of funds, while 2026 CSSF guidance for EMIs and payment institutions
              raises the bar on governance, risk management, and internal controls. For a business moving deeper into
              investing and cards, this is not a light-touch compliance environment.


              The real risk is not licensing status today; it is whether governance, safeguarding, and controls stay
              strong enough as transaction volumes, product count, and jurisdictions expand. Public sources show the
              obligation. They do not prove the quality of internal execution. A sanction, missed governance deadline,
              or weakness in AML / safeguarding practice would therefore be much more damaging than a generic software
              bug. This is why regulatory diligence here should focus on board process, internal audit, escalation logs,
              and evidence of actual control testing rather than on the existence of licenses alone.
            claimRefs:
