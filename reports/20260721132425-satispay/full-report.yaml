        title: Who pays and who uses
        blocks:
          - type: paragraph
            body: >-
              Satispay's customer base is structurally multi-sided. Consumers use the app to pay, transfer money, and
              increasingly invest or use BNPL. Merchants buy acceptance and, in e-commerce, buy access to a customer
              base that Satispay says already has the app installed. Employers buy welfare or voucher programs, while
              employees are the end users of those benefits. That split matters because the company is not growing only
              by adding more consumer downloads; it is also selling distribution, checkout, or benefits infrastructure
              to businesses and employers.


              This segmentation helps explain why Satispay can widen its product scope without changing its brand
              entirely. A single user can be a consumer, a worker using meal vouchers, and an investor within the same
              app. A merchant can start with checkout acceptance and then benefit from discoverability, loyalty points,
              or welfare spend. The stronger the overlap across these roles, the more durable the customer base could
              become—but public sources still expose breadth much better than retention.
