  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: A directionally framed range for how today’s entry could feel ex post.
    data:
      items:
        - label: Bear outcome
          low: 0.6
          base: 0.8
          high: 1
          unit: x current valuation
          note: If control and economics disappoint, valuation support could compress toward or below flat private marks.
        - label: Base outcome
          low: 1
          base: 1.6
          high: 2.2
          unit: x current valuation
          note: If growth continues but disclosure remains partial, upside exists but may be moderate.
        - label: Bull outcome
          low: 2
          base: 3.5
          high: 5
          unit: x current valuation
          note: Requires strong cross-sell, durable unit economics, and a later premium-platform re-rating.
    approximationNotes: These are scenario ranges for decision discipline, not model-derived fair values.
    claimRefs:
      - CV031
      - CV033
      - CV034
      - CV036
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: IC-ready scoring of the present evidence set.
    data:
      items:
        - label: Market opportunity
          value: 8/10
          note: Large Italian and adjacent EU opportunity remains real.
        - label: Customer proof
          value: 8/10
          note: Multi-sided adoption is unusually visible for a private fintech.
        - label: Moat quality
          value: 6/10
          note: Local network is real, but global dominance is unproven.
        - label: Economics transparency
          value: 3/10
          note: Core unit economics remain private.
        - label: Risk / controls
          value: 4/10
          note: Governance obligations and partner dependencies are meaningful.
        - label: Valuation attractiveness
          value: 5/10
          note: Not absurd, but not clearly cheap relative to evidence.
    claimRefs:
      - CV020
      - CV025
      - CV028
      - CV029
