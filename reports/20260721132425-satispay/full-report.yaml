  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The core thesis is straightforward: Satispay has become a genuine multi-product fintech with meaningful
              consumer, merchant, welfare, and investment proof. It is not a prototype or a feature. Public evidence
              supports real scale, continued revenue growth, widening product scope, and a local merchant network that
              is hard to dismiss. The 2026 capital plan also looks partly offensive rather than purely defensive,
              suggesting management still sees a broad opportunity set.


              The anti-thesis is just as clear. Satispay still has only partial public economic disclosure. Its moat
              appears practical and local rather than globally dominant. Merchant-pricing changes show economics are
              still being tuned, acceptance still trails stronger incumbents, and the company remains in a heavily
              regulated, partner-mediated, fragmented European payments market. Those conditions can still produce a
              very good company, but not necessarily an attractive price at every entry point.


              A useful framing device is that the thesis is strongest on strategic direction and weakest on cash-quality
              proof. If an investor is comfortable paying for platform optionality before full transparency, the story
              can work. If the investor requires underwritten evidence before paying growth multiples, the anti-thesis
              dominates for now. That distinction matters because valuation mistakes often come from paying for a future
              category leader before the evidence supports leader-level economics.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV010
              - CV020
              - CV021
              - CV022
              - CV023
          - type: table
            tableRef: TV001
            claimRefs:
