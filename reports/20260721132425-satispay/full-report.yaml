      - number: '3.4'
        title: Adverse evidence and strategic direction
        blocks:
          - type: paragraph
            body: >-
              Adverse competitive evidence is real even without a single knockout rival. Edgar Dunn's comparison shows
              that Satispay's acceptance network still trails Bancomat materially, which matters because merchant
              ubiquity is a core part of any wallet moat. The same source also preserves the original zero-fee-under-€10
              wedge, making the later repricing on official pages an implicit admission that early growth pricing was
              not necessarily the steady-state model. Meanwhile, Apple, Google, and global card rails retain
              distribution power that local challengers rarely match.


              At the same time, Satispay is not standing still. Cards, investment products, and Luxembourg-based talent
              expansion show a company deliberately broadening its competitive scope. That can improve defensibility if
              execution is strong, but it also moves Satispay closer to better-funded super-app and platform rivals.
