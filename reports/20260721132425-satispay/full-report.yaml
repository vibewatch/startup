companyProfile:
  summary: >-
    Satispay is a Milan-founded Italian fintech that started with account-linked mobile payments and has widened into
    merchant acceptance, welfare benefits, savings and investment products, and debit cards. Public evidence supports a
    real local network with 6.5 million users and more than 450,000 merchants by June 2026, plus a Luxembourg EMI
    structure for payments and separate entities for investing and welfare. The company has crossed the unicorn
    threshold and retained founder control through successive financings, but it still does not disclose enough audited
    economics, retention data, or cap-table detail to treat the current valuation like a fully underwritten
    public-market story.
