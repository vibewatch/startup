            body: >-
              Operational risk rises with every layer Satispay adds. Refund policies reveal real edge-case support work:
              physical-store refunds are time-limited, some terminal flows have extra constraints, and online refunds
              run for much longer windows. Merchant compliance is also changing underneath the business. Italy’s 2026
              rules on electronic-money acceptance and terminal-to-register linkage create integration and support
              obligations that can increase merchant friction even when they expand the addressable market. On top of
              that, Satispay depends on partners for key surfaces—Worldpay for merchant distribution, Mastercard and
              IDEMIA for cards, and broader acceptance infrastructure across the ecosystem.


              Public outage evidence is limited but not zero. A severe PPRO degradation in April 2026 shows that
              third-party failure can directly hit Satispay transaction flows. Because payments and trust are tightly
              linked, short outages can have disproportionate reputational impact. The operational risk question is
              therefore not whether Satispay has ever had an issue; every scaled payments system will. The question is
              whether internal observability, escalation, and partner governance are strong enough to keep such
              incidents small and recover quickly. Diligence should therefore ask for incident-response playbooks,
              partner SLAs, and actual postmortem evidence, not just customer-facing help-center content.
