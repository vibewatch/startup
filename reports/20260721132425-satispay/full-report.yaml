  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: Satispay layers consumer, merchant, welfare, investment, and cards experiences over a wallet-centric core.
    data:
      layers:
        - label: Consumer surface
          detail: The app acts as the primary user-facing shell for everyday money tasks.
          modules:
            - In-store pay
            - Online pay
            - P2P
            - Bills / top-ups
            - Gift cards
            - Pay in 3
        - label: Merchant surface
          detail: Merchant acceptance can be delivered through local business onboarding, plugins, or PSP routes.
          modules:
            - Business app
            - In-store acceptance
            - E-commerce checkout
            - PSP integrations
        - label: Adjacency modules
          detail: Adjacent money workflows expand usage beyond checkout and transfers.
          modules:
            - Welfare
            - Investing
            - Subscription cards
        - label: Trust / control
          detail: Regulated entities, app authorization, and partner-distributed APIs support the product shell.
          modules:
            - Legal-entity split
            - App auth
            - API docs
            - Partner integrations
