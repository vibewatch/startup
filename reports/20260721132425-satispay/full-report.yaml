  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape classes and where Satispay sits
        blocks:
          - type: paragraph
            body: >-
              Satispay's competitive set is easy to underestimate if it is defined only as 'other payment apps'. In
              practice it competes against several classes at once. SumUp and similar merchant-tool companies fight for
              merchant checkout, settlement, and operational workflow. Apple Pay and Google Wallet fight for consumer
              default behavior on-device and at contactless checkout. Domestic options such as Bancomat Pay, plus
              European interoperability efforts like Wero and EuroPA, compete for local-bank and account-to-account
              relevance. Revolut and Sumeria pull the frame even wider by offering broader money-management, savings,
              and investing experiences that compete for share of wallet rather than just share of checkout.


              That broader map matters because Satispay is no longer just a local QR app either. Its own app-store and
              website materials now position it as a pay-and-invest product with BNPL, cards, points, and welfare ties.
              The question is therefore not whether Satispay has competitors; it is which competitor class dominates the
              user job in each workflow and whether Satispay can stay distinctive across more than one of those jobs at
              once.
            claimRefs:
              - CP001
              - CP007
