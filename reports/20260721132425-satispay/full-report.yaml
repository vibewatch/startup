              - CR024
              - CR005
              - CR001
      - number: '7.3'
        title: Financial, customer, and execution risk
        blocks:
          - type: paragraph
            body: >-
              The financial and execution risks are tightly coupled. Satispay is clearly growing, but it still chose to
              raise more capital in 2026 and has already changed pricing once for sustainability reasons. That
              combination suggests the model is promising but not yet fully de-risked. The public record still does not
              disclose the key control metrics investors would want: runway, loss-adjusted margins, customer
              concentration, merchant churn, and unit economics by line. Multi-product expansion amplifies the problem.
              Cards can create support and margin pressure. Investing brings suitability and governance expectations.
              Welfare adds employer-side complexity. Rapid hiring and geographic spread can improve execution capacity,
              but also make coordination harder.


              Customer breadth helps offset concentration risk directionally, yet the lack of disclosed concentration
              data means a hidden dependency could still exist at the merchant, employer, or partner level. In other
              words, the core risk is not a visible collapse; it is the possibility that several moderate risks—pricing
              pressure, control burden, partner reliance, and capital need—compound before public metrics make the
              deterioration obvious. The practical implication is that Satispay may look safer in a headline summary
              than it does in a control-and-metrics workroom, where missing retention, loss, and runway data would
              matter immediately. That gap between visible brand strength and invisible operating detail is itself an
              investment risk, because it can delay detection of deterioration until corrective options are more
              limited.
            claimRefs:
              - CR015
              - CR016
              - CR026
              - CR027
              - CR028
