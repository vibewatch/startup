      - number: '2.2'
        title: Sizing lenses and installed base
        blocks:
          - type: paragraph
            body: >-
              Top-down market size is easy to exaggerate in payments, so the disciplined approach is to use multiple
              lenses. ECB data shows a very large euro-area non-cash market, with 72.1 billion transactions in the first
              half of 2024 and cards still accounting for the majority of payment volume. Cross-Border Magazine gives a
              more Satispay-relevant Italian lens: around €52 billion of e-commerce in 2025, rising toward €82 billion
              by 2027, with wallets already taking around 35% share online. Those figures are not the same thing as
              Satispay's TAM, but they help bound the pool of digitally reachable consumer spend.


              The most useful SOM anchor is Satispay's own network. Public sources support 6 to 6.5 million users and
              450,000 merchants by 2026, which is material by Italian standards. Yet Edgar Dunn's comparison to
              Bancomat's much larger acceptance network is equally important because it shows there is still room to
              expand even before leaving Italy. In other words, the company has already proven relevance, but public
              data still cannot translate that relevance into a clean geography- and cohort-specific SAM without
              management disclosure.
