  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Satispay's real market is narrower and more interesting than the generic label 'digital payments'. Today
              the company participates in at least three adjacent pools of spend: everyday consumer and merchant
              payments, corporate welfare acceptance, and entry-level retail investing. The core boundary is still
              merchant acceptance and consumer wallet usage, especially in low-ticket and mobile-led flows where an
              app-linked, lower-friction payment method can outperform cash and expensive card acceptance. That makes
              cards, cash, bank transfers, PayPal-style wallets, and domestic alternatives like Bancomat Pay the status
              quo substitutes that matter most.


              What should stay outside the boundary? Public evidence does not support treating Satispay as a full bank,
              a broad enterprise treasury provider, or a global card issuer. Its own legal structure separates payments,
              investments, and welfare, reinforcing the idea that Satispay is assembling a broader financial platform
              from targeted use cases rather than attacking every financial workflow at once. For market analysis, the
              best frame is therefore Italian and near-European daily spend plus adjacent share-of-wallet opportunities,
              not the entire global fintech universe.
            claimRefs:
              - CM037
              - CM032
              - CM033
              - CM034
              - CM035
