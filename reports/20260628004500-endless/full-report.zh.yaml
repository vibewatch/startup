      - 行动含义
    rows:
      - - 牌照 / 合规滑坡
        - 法律实体和牌照地图不清晰
        - 管理层无法说明哪个实体拥有哪个受监管产品，或香港规则如何适用
        - 在拿出律师支持的地图前，视为投资逻辑破裂。
      - - 安全不透明
        - 审计缺口持续存在
        - 尽调中未分享桥审计包、漏洞历史或漏洞赏金证据
        - 只能折价承销，或暂停。
      - - 旗舰应用集中
        - 使用集中度过高
        - 一个应用或关联界面贡献了 MAU、GMV 或登录量的主导份额
        - 提高集中度折价，并要求多元化计划。
      - - 变现脆弱
        - 缺少已验证收入引擎
        - 收入仍分散在理论路径上，没有占主导、可留存的收入流
        - 将投资逻辑从平台业务调整为投机性生态期权。
      - - 运营方可靠性
        - 节点或桥事件频繁
        - 私有日志中出现反复严重事件或恢复纪律差
