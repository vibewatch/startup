          label: 消耗存储 / 带宽
        - from: builders
          to: network
          label: 提交交易
        - from: components
          to: output
          label: 抽取费用
        - from: sdk
          to: output
          label: 用量 / 订阅费用
        - from: infra
          to: output
          label: 服务费
        - from: network
          to: output
          label: Gas 相关价值捕获
