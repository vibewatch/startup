  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 当前判断从真实融资信号出发，经过披露过滤，最终落在谨慎推荐上。
    data:
      nodes:
        - id: n1
          label: 融资证明
          detail: 估值 $1B 的 $110M 融资轮得到官方和第三方来源交叉印证。
        - id: n2
          label: 产品野心
          detail: 文档描述了 AI 加 Web3 基础设施、SDK、API、资助和生态增长计划。
        - id: n3
          label: 披露缺口
          detail: 没有公开 ARR、客户数、员工数或轮次条款细节。
        - id: n4
          label: 推荐
          detail: 继续研究 / 高风险 / 估值偏紧的立场。
      edges:
        - from: n1
          to: n2
          label: 支撑
        - from: n2
          to: n3
          label: 撞上
        - from: n3
          to: n4
          label: 推动
