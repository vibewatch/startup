          high: 0.9
        - label: 悲观情景
          low: 0.25
          mid: 0.375
          high: 0.5
        - label: 当前观察标记
          low: 1
          mid: 1
          high: 1
    approximationNotes: 区间是基于留存可比样本和 Endless 披露缺口幅度的情景估计，不基于公司报告的预测。
