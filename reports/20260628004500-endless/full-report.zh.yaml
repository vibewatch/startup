  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面围绕降低 Web2 到 Web3 的采用摩擦
        blocks:
          - type: paragraph
            body: >-
              Endless 的产品故事建立在一个具体工作流承诺上：让 Web2 开发者和主流用户无需吸收传统区块链工具的全部复杂性，也能使用 Web3 功能。公司官网、发现文档和愿景材料一致把 Endless
              描述为分布式云端智能组件协议，或 Web3 Genesis Cloud，把区块链基础设施、AI
              能力、模块化组件和钱包功能打包进更熟悉的软件体验。这个承诺不是单一应用，而是一个分层平台，意在缩短从开发者想法到可部署 DApp 的路径。


              面向用户和面向建设者的产品表面围绕这一目标对齐。快速开始页面把开发者引向 CLI、本地节点、SDK、水龙头、首笔交易和 Move 模块流程。商业和 readme 文档突出组件市场、开发者中心和
              SDK。钱包页面强调无需下载的浏览器访问、Google 或 Apple 登录，以及多签、私钥轮换和安全交易等安全控制。合在一起，这些元素表明 Endless 试图在一个栈里掌握引导、交易执行和组件复用。


              这一架构在战略上连贯，尽管公开深度不均。Endless 清楚暴露了许多产品表面，但有些表面的文档好于另一些。钱包引导和 SDK 工作流很具体；桥接内部和市场运营细节在公开资料包里薄得多。
