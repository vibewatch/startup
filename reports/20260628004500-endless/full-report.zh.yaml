      - number: '8.4'
        title: 尽调闸门与 thesis-break
        blocks:
          - type: paragraph
            body: >-
              下一轮尽调应少听故事，多看少数决定 $1 billion mark 是否可融资的事实。第一，投资人需要收入和使用数据包：活跃开发者、活跃应用、企业客户、付费 API 或基础设施使用，以及任何可重复的收入 run
              rate。第二，需要 cap table 机制：清算优先权、secondary、pro rata 权利、token 相关 side letter，以及 headline mark
              是否能转化为有吸引力的普通股入场经济性。第三，需要 token-specific 供给细节，包括流通 float、unlock schedule、treasury policy，以及任何 grants 或
              incentives 如何稀释生态参与者。


              也有清晰的 thesis-break 触发点。Endless 自己的 funding terms 免责声明警告，grants 不是背书，Endless
              不保证协议上第三方项目的合法性、安全性或性能。香港虚拟资产政策开放但明确有
              guardrail，这意味着不能假设监管天然宽松。如果管理层无法展示干净的使用增长，如果下一轮融资揭示会压低新普通股投资人的保护性条款，或 token governance 引入重大
              overhang，公允价值区间会快速下移。这些不是边缘情景，而是核心承销问题。
