        - 机构链平台
        - 保留材料里，规模通过具名合作伙伴和机构客户参考体现，而不是通过风险融资估值体现
        - 推出发行、支付和交易产品的机构
        - 合规优先的分发和伙伴生态
        - 比完全抽象的中间件层更偏特定链，也更依赖伙伴
      - - Chainlink
        - 互操作 / 合规层
        - 保留材料未引用风险融资轮；在金融用例中具备行业标准定位
        - 稳定币、代币化资产、交易所、银行、托管方
        - 合规、数据和互操作框架强
        - 不是面向通用 Web2 团队的完整应用入驻环境
