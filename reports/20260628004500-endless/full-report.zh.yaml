        - 偏紧
        - 可比轮次证据表明，该价格已经假设了尚未公开证明的执行力。
        - 中
      - - 决策含义
        - 承销前先尽调
        - 股权结构、使用情况和代币供应证据都可能实质性改变公允区间。
        - 高
      - - 安全边际
        - 公开证据下有限
        - 如果下一批数据令人失望，当前估值几乎没有缓冲。
        - 中
    notes: 本表总结的是当前可观察估值下的可投资性，而不是孤立评价公司的技术野心。
    claimRefs:
      - CV001
      - CV015
      - CV036
      - CV038
      - CV042
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 投资逻辑
      - 反向逻辑
      - 什么会改变观点
    rows:
      - - 品类匹配
        - Endless 所在品类里，真正的基础设施赢家可能变得非常有价值。
        - 品类规模不能证明这支团队已经拿到商业牵引力或可持续变现。
        - 展示付费使用、企业部署和开发者留存。
      - - 融资信号
        - 以 $1B 估值融资 $110M，说明成熟资本愿意在早期承销这个故事。
        - 如果后续证明点滞后，早期大额融资也会集中未来 down round 风险。
        - 披露本轮以来的 KPI 进展，以及下一轮条款纪律。
      - - 产品广度
        - 文档描述了 SDK、API、云服务、staking、市场费用和 gas 费通道。
        - 一串计划中的变现路径，不等于已经披露的收入引擎。
        - 提供实时变现组合，以及按产品线拆分的客户采用情况。
      - - 代币与生态动作
        - 只要治理干净，赠款和代币挂钩激励就能加快生态成形。
        - 供应悬顶、解锁不清，或第三方质量偏弱，都会削弱价值捕获逻辑。
        - 披露流通供应、解锁安排，以及赠款接受方的绩效数据。
      - - 今日价格
        - 如果 Endless 已走上强势基础设施赢家的类似路径，$1B 可能合理。
        - 以当前披露质量看，投资人可能只是在为叙事期权支付溢价。
        - 补充轮次条款、使用 KPI，以及下一次估值应上调而非下调的证据。
    notes: 反方观点主要针对证据质量和未来稀释风险，而不是不相信这个产品品类本身存在。
    claimRefs:
      - CV002
      - CV003
      - CV010
      - CV015
      - CV036
      - CV038
      - CV043
  - id: TV003
    title: 牛市 / 基准 / 熊市场景表
    columns:
      - 场景
      - 核心假设
      - 示例估值区间（USD B）
      - 概率信号
      - 主要失败模式
    rows:
      - - 牛市
        - 开发者和企业采用变得可见，代币治理干净，下一轮融资也没有明显保护投资人的结构。
        - 1.0-1.4
        - 有可能，但需要尚未公开的新证据。
        - 采用证据出现得比本轮估值假设更慢。
      - - 基准
        - Endless 仍具备战略可信度，但公开 KPI 依然偏少，因此投资人会折价看待当前估值。
        - 0.6-0.9
        - 这是基于当前公开证据最站得住脚的判断。
        - 公司无法把技术势能转成可量化的商业牵引力。
      - - 熊市
        - 使用证据持续单薄，代币或合规摩擦上升，或新轮次条款暴露议价能力偏弱。
        - 0.25-0.5
        - 如果下一份尽调包令人失望，风险就很实质。
        - 下轮融资估值下调，或融资结构明显保护投资人，会重置普通股逻辑。
      - - 当前观察到的估值
        - 2025 年 3 月轮次标题。
        - '1.0'
        - 已知事实，不是新的估值意见。
        - 如果新数据削弱叙事，当前估值可能不再是可投资的入场价。
    notes: 区间来自留存证据集推导出的场景估计；它们不是市场报价、经审计预测，也不是 DCF 输出。
    claimRefs:
      - CV001
      - CV039
      - CV040
      - CV041
      - CV042
      - CV044
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Endless
        - 私募轮次标题
        - '2025: $110M 融资，估值 $1B'
        - 当前判断的直接锚点。
        - 该估值没有同步披露公开 ARR、客户或条款清单。
      - - QuickNode
        - 私募融资可比
        - '2024: $60M Series B，估值 $800M'
        - 留存样本中最接近、且低于 Endless 估值的已定价基础设施轮次。
        - CoinDesk 参考资料中只保留了有限公开细节。
      - - Alchemy
        - 已规模化私有基础设施可比
        - '2022: $200M Series C1，估值 $10.2B'
        - 说明当基础设施变现和规模可见时，估值可以升到多高。
        - 经营披露远强于 Endless，市场时点也不同。
      - - Coinbase
        - 公开披露基准
        - 2026 年 6 月市值约 $39.27B；TTM 收入约 $6.56B
        - 可用来校准成熟加密平台的规模和披露标准。
        - 交易所加基础设施的混合体，不是纯早期协议可比。
      - - LayerZero 经营规模参考
        - 品类采用信号
        - 700+ 家公司、$75B+ 资产受保护、$200B+ 历史交易量；未留存私募估值
        - 说明高溢价互操作性叙事需要达到的采用门槛。
        - 仅是经营规模参考，不是干净的已定价估值可比。
    notes: 覆盖并不完整：这些行优先放入留存来源包中可得的直接已定价私募轮次、一个公开基准和一个采用规模参考。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the priced comparables and operating-scale references retained in this chapter for Endless’s
        valuation work; they do not represent an exhaustive census of all Web3 infrastructure companies or every private
        financing in the sector.
    claimRefs:
      - CV001
      - CV019
      - CV022
      - CV024
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
  - id: TV005
    title: 论点破裂与放弃触发表
    columns:
      - 触发项
      - 阈值或事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 采用证据持续模糊
        - 下一轮尽调周期仍不披露活跃开发者、活跃应用、企业客户或付费使用指标。
        - 平台故事仍是投机叙事，无法被承销。
        - 转向基准区间低端或熊市区间。
      - - 轮次条款保护投资人
        - 优先权堆栈、老股转让，或代币挂钩附带权利实质压低普通股上行空间。
        - 标题估值不再能有效代表回报潜力。
        - 未调整 cap table 前，不要依赖 $1B 估值。
      - - 代币悬顶沉重
        - 流通盘、解锁或金库释放政策意味着持续供给压力。
        - 生态增长不再能干净地转成持有人或股权价值。
        - 下调公允价值，并要求额外保护。
      - - 合规路径不清
        - 管理层无法说明代币挂钩扩张如何适配有护栏的 VA 制度。
        - 监管执行风险开始压过增长期权。
        - 延长尽调，并折减上行假设。
      - - 后续轮次价格低于预期
        - 新融资明显低于当前估值，或辛迪加支持偏弱。
        - 市场正在否定高溢价叙事。
        - 在证明相反之前，把它视作下轮下调信号。
    notes: 这些触发项服务于下一轮融资和经营更新，不只是为遥远的 IPO 决策准备。
    claimRefs:
      - CV010
      - CV030
      - CV038
      - CV041
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调追问表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 收入与使用桥接
        - ARR 或运行收入、付费 API 量、活跃开发者、活跃应用、企业客户，以及流失 / 留存数据
        - 这些事实决定基础设施可比是否成立。
        - 管理层 KPI 包加产品分析复核。
      - - 轮次机制
        - 优先权堆栈、老股转让、反稀释、附函，以及代币挂钩经济权利
        - 回报经济性可能和标题 post-money 估值大幅背离。
        - Cap table、条款清单和律师备忘录。
      - - 代币供应与解锁
        - 流通供应、归属安排、金库政策、验证者激励，以及赠款代币释放条款
        - 代币悬顶会削弱生态价值捕获和融资杠杆。
        - Tokenomics 备忘录、金库仪表盘和法律复核。
      - - 监管与司法辖区地图
        - 实体结构、代币分发限制，以及香港或其他 VA 合规姿态
        - 需要用它检验增长假设在运营上是否合法、可重复。
        - 合规律师、实体图和司法辖区备忘录。
      - - 客户质量证明
        - 具名设计伙伴、案例研究、扩张行为，以及重复变现证据
        - 区分生态表演和足以支撑可比估值的商业引擎。
        - 客户访谈、客户 cohort 复核和账单数据。
    notes: 这些追问都不是装饰项；每一项都可能改变推荐、可比集合或场景区间。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV038
      - CV042
      - CV043
