  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 产品 / 竞争对手
      - 公开价格 / 单位 / 合同模式
      - 包含能力
      - 折扣 / 未知项
      - 影响
    rows:
      - - Endless
        - 保留来源未找到公开定价或支持层级
        - 协议、代币经济、开发者模块、UX 抽象叙事
        - 费率表、免费层、企业 SLA 和使用指标细节未知
        - 对照模块化供应商做采购基准更难
      - - Alchemy
        - 免费 30M CU；按量从每 1M CU $0.40 起；企业定制
        - 节点 API、数据 API、钱包、gas 赞助、webhooks、rollups
        - 批量折扣和完整企业经济条款为定制
        - 团队比较托管基础设施供应商时，入门价格非常清晰
      - - QuickNode
        - 免费层；$49 Build；$249 Accelerate；$499 Scale；$999 Business；企业定制
        - RPC、streams、webhooks、IPFS、分析、SLAs、企业控制
        - 实际总成本取决于 credits 和超额用量
        - 打包透明，对采购非常友好
      - - Helius
        - 免费；$49 Developer；$499 Business；$999 Professional；专用节点 $2,900 起
        - Solana RPCs、质押连接、streaming、sender、专用解决方案
        - 附加项和年度定价会变化
        - 可作为 Solana 专用经济模型的有用基准
      - - Gelato
        - 免费；$99 Pro；$399 Growth；企业定制
        - 横跨 paymaster、bundler、private RPCs 和 functions 的计算单元
        - 自动扩容和 gas 溢价随计划变化
        - 说明专用钱包 / bundler 工具可以在不押注完整生态的情况下采购
      - - Moralis
        - 保留了公开定价页，但抓取文本没有清楚提取数字费率表
        - 钱包、代币、NFT、DeFi、价格、streams、数据 feeds、AI 导向工具
        - 精确计划经济性需要直接查看网站或联系销售
        - 仍比 Endless 更具商业可读性，因为存在专门定价页面
      - - AWS Managed Blockchain / Web3
        - 保留落地页显示的是按用量云采购，而非加密原生层级费率卡
        - 托管节点、查询 API、分析、安全、签名模式、创业公司计划
        - 具体成本取决于服务组合和 AWS 合同结构
        - 传统企业采购仍是可信替代路径
    notes: 关键对比不只是绝对价格，而是买方能否不经过销售电话就理解打包方式。公开证据显示，Endless 目前在这一点上落后于基础设施供应商。
    claimRefs:
      - CP017
      - CP020
      - CP027
      - CP034
      - CP039
  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓解措施 / 尽调问题
    rows:
      - - 打包式 Web2-to-Web3 入驻具有差异化
        - Aptos、Gelato 和 Alchemy 现在也在营销赞助交易、钱包抽象、无 gas UX 或开发者简化
        - 高
        - 要求提供并排 win/loss 案例，说明 Endless 胜出不只是叙事相似
      - - 同时拥有协议和工具会提高生命周期价值
        - 买方可以多栖：把更大的链、钱包层、互操作层和模块化 API 供应商组合起来
        - 高
        - 梳理实际转换成本、集成摩擦和留存客户扩张路径
      - - 代币经济和稳定币感知设计扩大产品面
        - 更大的产品面也会提高执行风险，尤其是对比任务更窄、更简单的 API 供应商
        - 中
        - 要求提供路线图排序、毛利率假设和按产品线划分的资源配置
      - - Move 取向带来技术杠杆
        - Sui 和 Aptos 已经锚定更知名的 Move 生态，公开文档更丰富，产品版图更宽
        - 高
        - 量化 Endless 比这些生态更好解决哪些开发者问题，以及买方多频繁认同
      - - 机构需求会奖励更新的打包平台
        - Solana SDP、Chainlink、LayerZero 和 AWS 对机构买方来说可能风险更低，因为它们是更清晰的采购选择
        - 高
        - 要求提供真实企业客户证明和合规架构文件
      - - 围绕基础设施既有厂商做商品化很难
        - Forbes 关于 RPC 瓶颈的批评显示，基础设施可能具备战略重要性，但仍呈寡头化，价格也可比较
        - 中
        - 测试当买方只比较价格透明度、正常运行时间和模块质量时，Endless 的差异化是否还站得住
    notes: 严重性衡量的是竞争承销风险，不是技术优劣。反复出现的模式是，许多相邻竞争者让买方可以只买技术栈中的一层，而不必押注完整生态。
