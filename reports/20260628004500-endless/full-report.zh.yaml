  - id: FI002
    title: 单位经济桥接图
    type: flow
    layout: standard
    summary: 协议层费用机制已经公开，但要把它们换算成软件式单位经济，还缺少必要的运营指标。
    approximationNotes: 该图为定性分析，因为公开材料披露了机制输入，却没有披露实际 CAC、回本周期或毛利输出。
    data:
      nodes:
        - id: activity
          label: 用户 / 开发者活动
          detail: 交易、API 调用、存储消耗和质押参与。
        - id: fees
          label: 费用表机制
          detail: 执行、IO 和存储费用定义协议层成本与收费逻辑。
        - id: rewards
          label: 验证者和质押激励
          detail: 奖励率和质押门槛决定激励支出形态。
        - id: burn
          label: 销毁 / 回购抵消
          detail: 费用销毁和计划中的回购销毁用于抵消稀释。
        - id: missing
          label: 缺失的商业指标
          detail: 收入、毛利率、CAC、回本周期和 NRR 均未公开。
        - id: underwrite
          label: 承销输出
          detail: 目前只能做机制层面的局部分析。
      edges:
        - from: activity
          to: fees
          label: 产生 Gas 和存储需求
        - from: fees
          to: rewards
          label: 支撑验证者经济
        - from: fees
          to: burn
          label: 支持销毁逻辑
        - from: rewards
          to: underwrite
          label: 影响激励成本
        - from: burn
          to: underwrite
          label: 影响稀释平衡
        - from: missing
          to: underwrite
          label: 阻断完整单位经济视角
    claimRefs:
      - CI021
      - CI022
      - CI023
      - CI024
      - CI031
