chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与当前阶段
        blocks:
          - type: paragraph
            body: >
              Endless 的公开材料一贯把公司描述成不止一条区块链或一个钱包产品。官网、愿景文件和商业模式文档都把 Endless 定位为分布式或去中心化的智能组件协议，目标是让 Web2 团队更容易开发
              Web3。直白说，它的主张是：开发者应当能用模块化工具、熟悉的软件模式来构建带区块链能力的应用，同时少接触那些通常拖慢 Web2 向 Web3 迁移的底层复杂性。


              这个定位很关键，因为它把 Endless 放在基础设施层，而不是纯应用层。公司反复强调基于 Move 的公链、组件化开发、SDK、API、钱包引导、跨链操作和 AI 辅助功能。因此，检索到的材料支持把
              Endless 描述为带协议属性的 Web3 开发和运行时平台，而不只是代币项目或消费应用。


              公开证据也支持另一层判断：即便 Endless 以其年龄来看资金异常充足，公司成熟度仍处早期。Tracxn 将 Endless 列为 2024 年创立的 Series A 公司；官方来源则聚焦 2025 年 3
              月融资、2025 年 3 月主网上线和 2025 年 4 月开发者资助，而不是运营历史或经常性收入。最稳妥的公司概览结论是，Endless 是一个非常年轻的协议平台，正试图从技术上线加速走向生态形成。
