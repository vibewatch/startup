  - id: FU001
    title: 公开客户证据漏斗
    type: flow
    layout: wide
    summary: Endless 的公开客户证据从宽泛的目标客群表述，收窄到少数具名证明实体；最强证据集中在开发者工具和一个旗舰应用。
    data:
      nodes:
        - id: segments
          label: 目标客群
          detail: Web2 开发者、Web3 开发者、项目团队、普通用户和集成商被明确点名。
        - id: tooling
          label: 工具层
          detail: SDK、API、钱包标准、文档和 GitHub 仓库降低构建者激活摩擦。
        - id: surfaces
          label: 在线入口
          detail: 钱包、桥、浏览器、多签和市场页面展示了可用工作流。
        - id: seed
          label: 种子生态
          detail: 资助计划和开发者社区旨在招募外部构建者。
        - id: proof
          label: 具名证明
          detail: Luffa 和 University of Surrey 是公开材料中与使用或合作绑定最清楚的实体。
        - id: gap
          label: 持久性缺口
          detail: 没有公开 NRR、流失率、付费客户数或集中度表来闭环。
        - id: docs
          label: 文档深度
          detail: 庞大的文档树降低激活摩擦。
        - id: git
          label: GitHub 工具
          detail: 公开仓库支持构建者和集成商。
        - id: grants
          label: 资助激励
          detail: 资本用于把构建者招募进技术栈。
        - id: market
          label: 市场支出
          detail: 组件购买为经常性使用打开路径。
        - id: partner
          label: 机构可信度
          detail: University of Surrey 及类似伙伴增强信任。
        - id: enterprise
          label: 企业证明缺口
          detail: 具名付费 API 或订阅客户仍未披露。
      edges:
