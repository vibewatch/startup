      - number: '7.2'
        title: 运营、安全和产品表面风险真实存在，因为 Endless 暴露了大量用户流程
        blocks:
          - type: paragraph
            body: >-
              Endless 已有足够多在线或有文档的界面，运营风险应被视为真实，而不是假设。钱包、桥、scan、多签管理、token 部署、token 经济工具和组件 marketplace
              都是面向公众的流程。这种宽度有利于 onboarding，但也放大了 bug、滥用、糟糕 UX 或安全失误破坏信任的触点。桥尤其关键，因为它处理跨链转账、收款地址和跨 Endless、Ethereum、BSC
              及其他链的合约部署。跨链表面通常比单链钱包风险更高，Endless 自己的文档也强调，桥依赖多个网络上的 message 和 executor 合约。


              公司确实发布了一些信任脚手架。钱包标准旨在规范 dapp 与钱包互操作。安全指南提醒开发者注意访问控制错误和不安全的 Move 模式。多签指南记录了基于阈值的控制，可降低 treasury
              和账户被攻破的风险。节点要求明确建议关闭 admin、inspection 和 public REST
              端口，除非已有适当保护；也警告资源不足或隔离不良的节点可能导致性能下降、共识失败和奖励损失。这些都是正面信号，因为它们说明 Endless 至少在记录安全敏感行为。但文档不等于审计证据。桥的 audit
              report 页面存在，但抓取到的页面没有实质审计内容；这本身是尽调缺口，而不是安全证明。


              面向消费者和开发者的 onboarding 选择也带来风险。通过 Google 或其他熟悉方式登录钱包降低摩擦，但把信任集中到身份和 session 管理设计上。scan 指南允许 token
              部署、minting 和 token 经济流程，使平台从被动观察扩展到用户生成资产行为。组件 marketplace 指南包含支付二维码、API key、SSE session
              和工具调用流程。每多一个功能都有助于激活，但若工程和监控不成熟，也给滥用、用户困惑或 exploit chain 留出更多空间。对早期平台而言，运营和安全成熟度应直接测试，不能从产品宽度推断。
