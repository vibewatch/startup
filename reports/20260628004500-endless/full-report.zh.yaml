      - number: '4.2'
        title: 代币经济披露明确；运营单位经济仍然间接
        blocks:
          - type: paragraph
            body: >-
              Endless 公开资料包里最具体的财务披露是代币经济，而不是损益表表现。经济模型文件和白皮书披露 10 billion EDS 初始供应、详细分配计划，以及从 8% 开始、每年下降 15%、最终降至 1.5%
              的通胀模型。同一批材料称，通胀发行被分配给质押奖励、生态发展和中继网络激励，交易费用则部分销毁、部分回流给验证者或生态支持。与许多早期加密项目相比，这让代币层相对可读。


              不够可读的是运营单位经济层。Endless 有公开材料解释 Gas
              和存储费如何运作、质押奖励如何计算、锁定如何安排，以及验证者经济如何受治理设定的质押门槛约束。这些披露说明激励设计和网络成本机制。它们没有披露已实现毛利率、获客成本、回本期、销售周期长度，或每个活跃开发者或项目团队带来的支持负担。


              实际结论是，Endless
              的公开财务模型在协议本身通过代码或政策定义经济的地方最强，在需要管理层披露业务表现的地方最弱。投资者今天可以研究费用路径和代币稀释机制，但还无法检验这些机制是否在实践中产生有吸引力的利润率或有纪律的增长。
