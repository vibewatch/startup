      - number: '1.3'
        title: 融资历史、里程碑，以及真正公开的信息
        blocks:
          - type: paragraph
            body: >
              公开记录中最强、且完全相互印证的公司事实，是 2025 年 3 月 4 日的融资。Endless 自己的公告、U.Today 和 Web3 OClock 都指向同一个标题：以 $1B 估值完成 $110M
              融资。仅凭这一事实，Endless 就应进入以独角兽为导向的尽调管线，尽管公司很年轻，运营披露也仍偏少。


              独角兽轮之前不久也有融资活动证据。NewsBTC 报道称，Foresight Ventures 于 2025 年 2 月 26 日进行了 $1M 战略投资，支持 AI agent 和 Luffa
              社交应用。公开资料包没有明确说明这笔战略支票与随后 $110M 融资之间的法律关系和股权结构关系，但时间顺序显示，2025 年初的资本形成过程安排得很紧凑。


              融资之后的里程碑节奏异常密集。官方材料称主网于 2025 年 3 月 6 日上线；University of Surrey 合作于 3 月 20 日公布；首阶段 $1M 开发者资助计划于 4 月 1
              日公布；Hong Kong 活动报道随后在 4 月 7 日出现。这样的节奏显示，公司正试图把融资势能快速转化为生态形成、技术可信度和开发者获取。
