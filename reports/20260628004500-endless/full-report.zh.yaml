      - number: '4.3'
        title: 资本充足性由融资标题支撑，但 runway 未公开
        blocks:
          - type: paragraph
            body: >-
              最重要的资本事实仍是 2025 年 3 月融资。Endless 自己的公告和独立报道一致称，公司以 $1B 估值融资 $110M。公司还在主网上线后数周内宣布 $1M
              开发者资助计划，显示其早期愿意把钱花在生态形成上，而不是单纯保存资本。代币侧，经济模型材料还描述了涵盖基金会储备、生态发展资金，以及验证者或中继激励的金库结构。


              这些事实意味着可观的初始资本基础，但没有披露承销方真正会用来计算 runway 的数字。公开材料没有提供手头现金、月度运营
              burn、按资产拆分的金库构成、债务义务，或把代币储备转换为预期法币运营能力的时间表。在加密基础设施中，这个缺口尤其重要，因为金库资产可能波动，而平台增长常常依赖持续激励支出。


              外部背景让缺失披露更重要，而不是更不重要。SEC 的投资者警示强调，加密资产发行可能缺少审计财务报表和其他投资者保护。Hong Kong 的 SFC 和 HKMA
              正在构建更严格的虚拟资产制度，提高基础设施供应商以及钱包或稳定币相邻产品的合规负担。换言之，Endless 可能有一轮大标题融资，但市场和监管背景仍让有纪律的资本管理成为现实尽调议题。
