      - number: '1.4'
        title: 足迹、封面指标与未解的身份问题
        blocks:
          - type: paragraph
            body: >
              封面指标好坏参半。估值和融资规模有力、明确、容易引用。主网上线和开发者资助规模也已公开。除此之外，公开记录就远不够具体。检索到的来源没有提供审计收入、当前员工数、账户基础或清晰的客户总数；材料花更多篇幅描述
              Endless 希望开发者构建什么，而不是量化已经大规模部署了什么。


              地点信息同样嘈杂。2025 年 4 月资助公告使用 Hong Kong 日期线，后续 Hong Kong 会议报道也强化了这一运营中心。但 Tracxn 将公司列为位于
              London，审阅到的官方材料没有调和这种差异。正确解读不是认定某个来源必然错误，而是公开记录还不够干净，不能把总部、法律注册地和运营枢纽视为同一件事。


              由此得到的尽调姿态很直接。Endless
              显然真实存在，已经融资、上线，并积极推动生态。它还没有足够公开透明，支撑对规模、治理或财务质量的高置信表述。后续章节应把融资和上线事实作为事实底座反复使用，同时保留地点、创始人和指标缺口，而不是把它们抹平。
