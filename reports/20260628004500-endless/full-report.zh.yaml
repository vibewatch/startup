      - number: '5.3'
        title: 钱包标准和信任控制清楚；桥接细节不清楚
        blocks:
          - type: paragraph
            body: >-
              钱包和信任层是 Endless 公开材料中较强的产品区域之一。浏览器钱包被定位为无需下载的访问层，提供社交登录选项，直接回应主流用户采用 Web3
              时最大的摩擦之一。钱包页面和钱包标准文档还暴露出比许多同业更具体的控制表面：BIP44 账户派生、dapp 连接 API、签名并提交交易流程、多签支持、私钥轮换，以及安全交易或模拟功能。


              周边技术文档扩展了这组控制。赞助交易被记录为一种由合约覆盖 Gas 的方式；安全交易材料强调在签名前预览结果，并用交易模拟防范意外代币转移或钱包访问。随机数和 multisig 文档显示，Endless
              不只针对简单转账，也瞄准更高级的合约和治理模式。隐私政策和服务条款又增加一层，披露数据收集类别，以及与生态绑定的已运营网站资产。


              未解决的问题是桥接细节。Endless 法律材料明确列出 bridge.endless.link，钱包也有公开 /bridge 路由，因此桥接功能属于产品边界。但审阅过的公开材料没有披露桥架构、支持网络、验证者或
              relayer 假设、流动性模型，或桥接专属安全控制等有意义技术细节。这个缺口重要，因为桥通常承载加密基础设施中最高的 exploit 风险。
