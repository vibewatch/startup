      - - 监管制度硬化快于合规建设
        - Endless 准备好之前，新规则已经落地
        - 公司缺少资源或批准来适应新的香港或跨境要求
        - 假设增长放慢、资本需求加重。
    notes: 这些触发项旨在把宽泛的风险语言转成具体的通过 / 否决尽调测试。
