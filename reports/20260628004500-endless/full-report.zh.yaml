  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层、买方，以及 Endless 实际在卖什么
        blocks:
          - type: paragraph
            body: >-
              公开客户故事从分层开始，而不是从 logo 开始。Endless 自己的商业模式文档明确列出四类核心用户——Web2 开发者、Web3
              开发者、项目团队和普通用户——并通过应用集成指南加入第五个经济上重要的群体：想要 API、SDK 或链连接服务的系统集成商和企业买方。这一点重要，因为它说明 Endless
              不是在推销单一消费钱包或纯基础设施协议，而是试图把工具、组件、托管界面和生态访问卖给处在采用链不同位置的多类参与者。


              买方、用户和付款方并不总是同一个角色。对 Web2 和 Web3 开发者来说，用户是建设者，而可能的付款方是购买
              SDK、API、组件、存储或流量容量的应用团队或平台运营者。对项目团队来说，用户通常是使用代币、支付和私域工具的社区或产品运营者；付款方大概是项目金库或创始团队。对普通用户来说，用户是与钱包、桥、市场或社交应用互动的终端参与者，但付款方可能转而是使用赞助
              Gas 机制的开发者，或通过交易和订阅收费的应用。企业式变现已有描述，但尚未验证：Endless 称 SDK 和 API
              服务可以按调用或订阅条款销售，但本次审阅没有任何公开来源列出一个在生产规模使用该套餐的付费企业账户。


              这种区分是本章的核心诚实测试。Endless 确实有连贯的客户设计：先要开发者，再要应用，再要用户，随后才是更广的机构采用。但公开记录对设计的支持强于对转化的支持。Endless
              已经为不同用户类型构建引导表面，并认真获取开发者，这方面证据不错；成熟企业客户基础已经存在的证据则弱得多。
