      - number: '7.3'
        title: 依赖、执行和财务模型风险可能直接传导到客户信任和估值
        blocks:
          - type: paragraph
            body: >-
              Endless 仍是一个生态搭建故事，这意味着依赖风险和执行风险异常交织。公司依赖外部 builder 验证平台 thesis，依赖 Luffa 提供大部分最强的公开使用证据，依赖 University of
              Surrey 等合作伙伴信誉强化 AI 叙事，也依赖钱包、桥和 marketplace 等产品表面把兴趣转化成真实活动。资助免责声明在这里很有说明力：Endless
              公开表示，自己不控制也不验证使用协议的第三方项目。这限制了法律责任，但也意味着生态健康可能脱离公司的直接控制。


              基础设施和运营要求构成第二层依赖。节点要求页面建议分离 validator 和 VFN 机器、大额硬件预算、谨慎端口管理，以及跨 AWS 或 GCP
              的云部署模式。对于一条严肃链而言，这些要求合理，但也意味着规模和可靠性并不便宜。如果 Endless 需要许多合作伙伴、operator
              或项目先配置大量基础设施，采用才会顺滑，执行摩擦就可能拖慢生态增长。桥文档也显示了对多条外部链和合约端点的依赖。更多链可以扩大 reach，但也会增加集成复杂度、监控负担，并提高外部网络问题变成 Endless
              用户问题的概率。


              财务模型风险仍披露不足。商业模式文件描述了多条变现路径——组件 marketplace 抽成、API 和 SDK 订阅、云 / 存储费用、节点 staking、交易费、分发费，以及 NFT 或 gaming
              经济——但没有公开证据说明哪一条今天已贡献有意义收入。Tracxn 和 Crunchbase 有助于理解融资背景，而不是单位经济。公开披露没有揭示 burn、runway、margin、支持负担、gross
              take rate、付费转化，或单一旗舰应用是否贡献了不成比例的可见使用。因此，投资人应把收入模型视为合理但未证实，并假设执行失误会迅速外溢到融资需求、客户信心和估值。
