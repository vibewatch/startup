          label: 由其支撑
        - from: docs
          to: git
          label: 由其强化
        - from: surfaces
          to: market
          label: 可通过其变现
        - from: seed
          to: grants
          label: 由其资助
        - from: proof
          to: partner
          label: 包括
        - from: gap
          to: enterprise
