  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现设计很宽，但公开定价大多仍是定性
        blocks:
          - type: paragraph
            body: >-
              Endless 并不把自己呈现为单一收费协议。相反，公开商业模式材料描述了一个分层变现栈，覆盖组件销售、SDK 和 API 使用、基础设施消耗、质押相关经济、交易费用、应用分发，以及游戏或 NFT
              活动。这在财务上重要，因为它意味着公司试图同时从开发者工具和链上使用中捕获价值，而不只是靠一次性代币发行或投机交易。


              最清楚的变现披露来自商业模式文档。Endless 称其组件市场对组件销售收取固定比例费用，SDK 和 API 服务可按调用计费或通过企业订阅计费，云存储服务则通过按量使用的存储和带宽套餐销售。同一文件还描述了
              DApp 分发的推广费或收入分成经济，以及从游戏和 NFT 市场活动中捕获费用。这些表述确立了预期收入架构，但没有进一步披露标价、折扣政策、已实现抽成率，或目前有多少使用是付费而不是补贴。


              因此，Endless 有一套可信的公开解释，说明收入可能如何产生；但还没有一组公开证据证明收入实际上正在产生。对尽调来说，这一区分比变现菜单的宽度更重要。当前证据支持绘制收入机制，而不支持承销收入质量。
