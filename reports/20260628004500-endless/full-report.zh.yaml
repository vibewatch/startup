      - CU011
      - CU012
      - CU023
      - CU024
      - CU039
  - id: FR001
    title: 风险传导图
    type: dag
    layout: wide
    summary: Endless 的主要风险从合规、产品表面安全和生态集中度，传导到客户信任、变现持久性和估值。
    data:
      nodes:
        - id: reg
          label: 监管 / 法律
          detail: 香港牌照、网站条款、隐私义务和投资者保护环境。
        - id: sec
          label: 安全 / 运营
          detail: 钱包、桥、浏览器、节点和市场入口扩大攻击面和可靠性暴露。
        - id: deps
          label: 依赖 / 生态
          detail: Luffa、外部链、运营方和伙伴可信度仍是重要依赖。
        - id: trust
          label: 客户信任
          detail: 企业买家和用户需要相信可靠性、数据处理和生态质量。
        - id: rev
          label: 收入持久性
          detail: 信任不足或生态过度集中会压制付费转化和留存。
        - id: val
          label: 估值 / 融资
          detail: 如果收入证明仍薄、风险仍高，估值支撑会被压缩。
        - id: ops
          label: 运营方纪律
          detail: 验证者和伙伴必须维护安全、配置充足的节点。
        - id: apps
          label: 应用集中度
          detail: 少数可见应用可能主导证明质量。
        - id: compliance
          label: 合规运营
          detail: 牌照和实体映射需要真实执行能力。
        - id: support
          label: 支持 / 滥用处理
          detail: 钱包、桥和市场流程会带来用户支持和欺诈处理工作量。
        - id: margin
          label: 利润率压力
          detail: 基础设施成本和支持负荷会稀释经济质量。
        - id: downside
          label: 下行情景
          detail: 多重失灵可能同时压缩采用率、融资和估值。
      edges:
        - to: trust
          label: 提高其合规负担
          from: reg
        - to: trust
          label: 可直接损害
          from: sec
        - to: trust
          label: 让证明集中于
