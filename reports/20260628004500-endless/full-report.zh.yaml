      - number: '6.4'
        title: 留存、扩张与集中度仍是客户故事最弱的部分
        blocks:
          - type: paragraph
            body: >-
              公开记录最缺的，恰恰是投资人最想看的耐久性证据。本报告保留的来源里，没有任何材料披露 Endless 本身的付费客户数、活跃开发者数、NRR、GRR、流失率、续约率、合同期限、客户集中度或 cohort
              留存。就连满意度也主要靠间接信号推断——在线文档、持续存在的产品界面、GitHub 活动，以及支持和 marketplace
              流程已有文档——而不是第三方评价平台或量化用户调研。公司显然想具备企业级能力，但能力叙事不等于商业耐久性。


              不过，扩张逻辑是看得见的。Endless 试图走一条 land-and-expand 链条：先赋能开发者，再推进应用部署，随后延伸到钱包、桥、组件购买、staking，以及潜在的企业 API 订阅。组件
              marketplace 指南在这里很有用，因为它描述了组件版本、订阅时长、订单管理和 API key 发放——平台若想让生态参与者持续花钱，就需要这些机制。但同一份指南也暴露了集中风险：买方流程中很大一部分依赖
              Luffa 完成二维码登录和支付。若 Luffa 采用停滞、发生信任事件，或主要只是关联流量而非广泛独立需求，Endless 可见客户证据中的一大块也会随之变弱。


              因此，审慎结论应是有条件的。Endless
              很可能已有真实的早期客户和用户活动，尤其集中在开发者和生态优先的应用。但公开层面还没有足够披露，让投资人能有把握地承销耐久性。管理层在证明按细分统计的账户数、第三方与第一方或关联使用占比、续约行为，以及是否有单一应用或合作伙伴贡献了不成比例的
              traction 之前，集中度和重复使用风险都应继续悬而未决。
