      - number: '8.2'
        title: 结构性可比公司与市场证据
        blocks:
          - type: paragraph
            body: >-
              Endless 没有发布收入 bridge，因此常规 SaaS multiple 练习会假装知道公开材料里并不存在的事实。更好的方法是用结构性可比公司锚定。可比集合的正面很清楚。Alchemy
              说明，当增长、变现和 uptime 可见时，开发者基础设施可以拿到很高的私募 mark；QuickNode 说明，更聚焦的 infra 平台在 2024 年仍达到 $800 million 估值；Coinbase
              为成熟 crypto 基础设施和分发在规模化后的样子提供了公开披露基准。LayerZero、Mysten、Solana、Chainlink、Moralis 和 Gelato
              共同说明，更广泛品类里确实存在具备产品深度、throughput 或机构定位的真实平台。


              这个可比集合也是警告，不只是估值理由。Alchemy 达到 $10.2 billion 时，运营叙事远比 Endless 丰富。QuickNode 已披露的 mark 低于 Endless，但其公开定位更明显是
              infrastructure-first 且商业包装更清晰。Coinbase 的公开市值和收入显示，品类成熟端存在多大规模的已审计业务，而这个差距很重要。因此，Endless 并不是按普通 pre-seed
              protocol 定价；它被放在一个最终赢家会披露真实使用、合作伙伴、收入机制，或至少比 Endless 目前更清晰产品包装的行业里定价。
