  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 争夺开发者心智的直接协议同业
        blocks:
          - type: paragraph
            body: >-
              Endless 最接近的概念替代品，是同样承诺主流可用开发者体验的 Move 取向生态。Mysten Labs 将 Sui 定位为用 Web2 的易用性提供 Web3 的好处；Sui
              文档强调高吞吐、低延迟、面向资产的编程、代币化资产、zkLogin、支付工具，以及面向主流建设者的引导指南。Aptos 从另一个角度采取类似动作：Aptos Labs 谈的是把未来带到链上，Aptos
              文档则强调赞助交易、无密钥账户、无序交易和面向 AI 的开发者工具。


              这很重要，因为 Endless 不只是在竞争链选择。它在争夺同一块叙事领地：帮助开发者构建有用的链上产品，同时不把终端用户推入传统钱包摩擦。以此比较，Endless
              有一个可信的架构故事，但公开证据基础更薄。Mysten 和 Aptos 都展现出更可见的生态广度和更成熟的文档表面，Aptos 还额外宣传当前在 AI 和机构工作负载上的投入。


              关键尽调含义是，Endless 应被视为拥挤的“让 Web3 更像 Web2”赛道中的挑战者。买方选择 Endless，并不只是决定是否使用区块链；买方是在判断 Endless 的组合是否显著优于更大的 Move
              相关生态，而后者已经发布更丰富的产品地图和生态工具。
