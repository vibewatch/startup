      - number: '1.2'
        title: 领导层可见度、法律实体与治理缺口
        blocks:
          - type: paragraph
            body: >
              领导层可见度不完整，但有实质信息。官方融资和合作伙伴文章持续将 Xiong Yu 识别为联席总裁，将 Amit Kumar Jaiswal 识别为 CTO；2025 年 3 月融资公告还提到 Ned
              担任首席代币经济学家。这些角色指向一个希望在 AI 与区块链交叉领域显得具有学术可信度的团队，University of Surrey 合作也强化了这条叙事。


              更难的问题是治理深度。Endless 服务条款将 Stiftung Endless
              列为管理公开网站资产的基金会，至少给出了一个具体法律锚点。不过，同一份条款没有提供公开董事会名单、委员会架构，也没有清楚说明基金会治理如何与协议开发、代币经济或资助决策互动。


              第三方数据库没有缩小不确定性，反而拉大了它。Tracxn 将 Uriah Ferruccio 和 Yu Xiong 列为创始人，并把公司基地列在 London；官方资助材料署名地点为 Hong
              Kong，官方新闻报道则突出高管，而不是完整的创始人或董事会叙事。出于尽调目的，领导层质量可能有吸引力，但公开治理可见度仍然薄，关键人集中度也仍高。
