      - number: '2.2'
        title: 受证据约束的规模测算视角，而不是单一 TAM 标题
        blocks:
          - type: paragraph
            body: >-
              保留下来的公开来源支持几种规模测算视角，但不足以假装 Endless 已经拥有清晰、量化的 SAM。在最宽口径上，SFC 的 2025 ASPIRe 路线图描述了一个 2024 年价值超过 $3
              trillion、年交易量超过 $70 trillion 的全球虚拟资产市场。这说明外围品类有实质经济体量。Chainalysis 随后把增长叙事收窄到由稳定币驱动的支付、代币化真实世界资产，以及 agentic
              或 AI 介导支付；这些方向比泛泛的代币市值数字更接近 Endless 对外宣称的产品雄心。


              开发者供给证据进一步收紧了视角。Electric Capital 的 2024 开发者报告显示，加密开发仍然庞大且越来越多链化：1.7 million 个代码库中有 902 million
              次提交，三分之一开发者跨链工作，长期开发者即使在开发者总数下滑时仍在增长。这一点重要，因为 Endless 不只是在卖链访问；它试图在一个已经有成熟建设者和既有生态的市场里，争夺开发者时间和工具选择的一部分。


              资本市场证据形成支持，但解读应谨慎。CB Insights 报告称，2025 年 Q1 全球风险融资为 $121 billion，交易规模中位数创纪录达到 $3.5 million，AI
              占风险交易的五分之一。Endless 自己的 $110M 融资处在这个支持性的融资窗口内。结论是，市场足够大，值得关注；但公开数据更清楚衡量的是相邻资本池和生态活动，而不是 Endless 真实的近期捕获潜力。
