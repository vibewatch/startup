      - number: '5.2'
        title: 架构主张足够具体，可以映射栈和开发者工作流
        blocks:
          - type: paragraph
            body: >-
              与许多停留在口号上的早期加密项目不同，Endless 发布了一套相当可映射的技术栈。发现文档把 AI、serverless 架构、完整分布式框架、中继网络、SDK、API、去中心化存储和 Endless
              公链描述为一个可组合环境的组成部分。快速开始和技术文档索引随后把这层营销语言转换成具体开发者任务：安装或运行 CLI、启动本地节点、给账户注资、构建交易、学习 Move、连接 RPC 或 indexer
              端点，并使用钱包、可替代资产和数字资产标准。


              SDK 和代码库表面进一步显示，公司试图支持真实开发工作流。官方文档和 GitHub 材料显示，Endless 有官方 TypeScript SDK、官方 Go SDK、Move framework
              代码库，以及带语言服务器的 VS Code 插件。SDK 文档不止列出库名，还包括账户生成、水龙头注资、签名、提交和网络配置模式。网络文档也发布了主网和测试网的公共 RPC 与 indexer 端点，以及
              chain ID 和 epoch 时间。


              这并不能证明大规模生产成熟度。公共端点、release binaries 和代码库证明有真实的公开构建表面，但没有揭示正常运行时间、吞吐量、事故率或企业支持质量。架构可见；背后的运营质量只部分可见。
