      - number: '6.3'
        title: 具名证明存在，但参考质量参差，且大多处于早期
        blocks:
          - type: paragraph
            body: >-
              最好的具名公开证明是 Luffa。多个第三方来源把 Luffa 描述为第一个建立在 Endless 上的去中心化社交应用，组件市场指南也通过要求买方经由 Luffa app
              认证和支付，间接强化了这种关系。Odaily 报道最进一步，称 Luffa 拥有超过 100,000 用户和数万日活用户；NewsBTC 和 Analytics Insight 则在上线状态、隐私功能、AI
              agent 和主流用户引导上使用更保守表述。因此，Luffa 是 Endless 最清楚能指向通用文档之外应用层的证明，但证明质量仍不完美，因为最强的用户数来自一篇访谈文章，而不是审计后的平台分析或中立市场看板。


              University of Surrey 是第二个有意义的具名实体，但更应理解为合作者，而不是传统客户。官方合作公告和 Surrey 相关高管引语显示，Endless
              正把学术合作用作可信度和共同开发渠道，尤其围绕 AI 和区块链研究。这支持机构相关性，但不证明经常性软件支出或可引用的采购关系。产品展示文档——游戏、订单平台、内容平台和 Endless
              Legends——作为客户证明更弱。它们展示具体用例模式和开发者引导深度，但最好理解为参考实现或规范化构建路径，而不是活跃生产客户证据。


              因此，这里必须标注证明质量。Luffa 是具名旗舰应用，采用证据质量中等。University of Surrey
              是具名机构伙伴，协作证据质量高，但不是客户经济。展示文档是有用的机制证明，但生产证明质量低。Goldust 出现在 Endless 官网作为生态表面，但外部 Goldust 网站没有独立解释与 Endless
              的关系，因此只能视为弱佐证。Endless 有足够公开证明说明一个生态存在；但还没有足够独立企业证明，支持声称生态转化已经广泛、耐久，并且实现规模化变现。
