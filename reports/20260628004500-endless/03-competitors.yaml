- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Bundled Web2-to-Web3 onboarding is differentiated
    - Aptos, Gelato, and Alchemy now market sponsored transactions, wallet abstraction, gasless UX, or developer simplification too
    - High
    - Ask for side-by-side win/loss examples showing why Endless wins beyond narrative similarity
  - - Owning protocol plus tooling raises lifetime value
    - Buyers can multi-home by combining a larger chain, a wallet layer, an interoperability layer, and a modular API vendor
    - High
    - Map actual switching costs, integration friction, and retained customer expansion paths
  - - Tokenomics and stablecoin-aware design create a wider product surface
    - The wider surface also increases execution risk versus simpler API vendors with narrower jobs-to-be-done
    - Medium
    - Request roadmap sequencing, gross-margin assumptions, and resource allocation by product line
  - - Move orientation provides technical leverage
    - Sui and Aptos already anchor better-known Move ecosystems with richer public docs and broader product maps
    - High
    - Quantify which developer problems Endless solves better than those ecosystems and how often buyers agree
  - - Institutional demand will reward a newer bundled platform
    - Solana SDP, Chainlink, LayerZero, and AWS can look lower-risk to institutional buyers because they are more legible procurement choices
    - High
    - Request live enterprise references and compliance architecture documents
  - - Infrastructure incumbents are hard to commoditize around
    - Forbes’ RPC-bottleneck critique suggests infrastructure can be strategically important yet still oligopolistic and price-comparable
    - Medium
    - Test whether Endless’s differentiation survives when buyers compare on price transparency, uptime, and module quality only
  notes: Severity rates competitive underwriting risk, not technical merit. The recurring pattern is that many adjacent competitors make it easy to buy one layer of the stack without taking a full ecosystem bet.
