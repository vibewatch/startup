tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Endless
    - Bundled Web2-to-Web3 platform
    - Publicly known $110M round at $1B valuation; operating metrics undisclosed
    - Web2 developers, project teams, AI/web3 builders
    - Integrated story across onboarding, tokenomics, stablecoin-aware design, and developer tooling
    - Pricing, customer scale, and ecosystem depth are not publicly clear
  - - Sui / Mysten Labs
    - Direct protocol peer
    - Mysten funding article cites $300M at $2B valuation
    - Builders wanting Move, low-latency apps, tokenized assets, and Web2-like UX
    - Broader product map and stronger public ecosystem surface
    - Still requires choosing the Sui ecosystem rather than a chain-agnostic stack
  - - Aptos
    - Direct protocol peer
    - Aptos committed $50M in 2026 to trading and AI infrastructure
    - Builders wanting Move plus gasless onboarding and AI-friendly tooling
    - Sponsored transactions, keyless accounts, institutional and AI emphasis
    - Public evidence in the retained pack says less about packaged commercial pricing
  - - Solana Developer Platform
    - Institutional chain platform
    - Scale expressed through named partners and institutional customer references rather than venture valuation in retained pack
    - Institutions launching issuance, payments, and trading products
    - Compliance-forward distribution and partner ecosystem
    - More chain-specific and partner-dependent than a fully abstracted middleware layer
  - - Chainlink
    - Interoperability / compliance layer
    - No venture round cited in retained pack; industry-standard positioning across finance use cases
    - Stablecoins, tokenized assets, exchanges, banks, custodians
    - Strong compliance, data, and interoperability framing
    - Not a full app-onboarding environment for general Web2 teams
  - - Alchemy
    - API / platform incumbent
    - Yahoo cites $200M at $10.2B valuation
    - Developers and fintechs needing multi-chain infra with known packaging
    - Clear pricing, broad platform, 100+ chains, gas sponsorship and rollups
    - Less opinionated ecosystem bundle than Endless; can still look like infrastructure commodity
  - - QuickNode
    - API / platform incumbent
    - TechCrunch cites $60M at $800M valuation
    - Developers and enterprises needing RPC, webhooks, streams, and SLA-backed infra
    - Detailed tiered pricing and enterprise posture
    - Does not own the end-to-end product environment; mostly infrastructure layer
  - - Moralis
    - Data / API vendor
    - No public funding figure retained in this pack
    - Teams needing wallet, token, price, NFT, DeFi, and data feeds quickly
    - Audit-grade data feeds, multi-chain APIs, AI-pipeline positioning
    - More data-centric than protocol-centric
  - - Gelato
    - Wallet / rollup / gasless tooling
    - No retained funding figure; public product metrics stress usage scale
    - Teams needing gasless UX, smart wallets, bundlers, or custom rollups
    - Best-in-class wallet and rollup tooling with public pricing
    - More specialist tooling than full ecosystem environment
  - - AWS Managed Blockchain / Web3
    - Status-quo substitute
    - Incumbent cloud scale rather than crypto-native funding metric
    - Regulated or conservative teams preferring conventional cloud procurement
    - Security, analytics, managed nodes, and internal-build familiarity
    - Not purpose-built to make Web3 feel consumer-simple in the same way Endless claims
  notes: 'The profile table is intentionally curated rather than exhaustive. It focuses on the competitors most relevant to Endless’s public narrative: direct Move peers, institutional platform adjacents, infrastructure vendors, and internal-build substitutes.'
