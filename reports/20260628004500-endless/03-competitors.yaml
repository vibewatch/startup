- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Offer / competitor
  - Public price / unit / contract model
  - Included capabilities
  - Discount / unknowns
  - Implication
  rows:
  - - Endless
    - No public pricing or support ladder found in retained sources
    - Protocol, tokenomics, developer modules, UX abstraction narrative
    - Rate card, free tier, enterprise SLA, and usage metric details unknown
    - Procurement is harder to benchmark against modular vendors
  - - Alchemy
    - Free 30M CU; pay-as-you-go from $0.40 per 1M CUs; enterprise custom
    - Node API, data APIs, wallets, gas sponsorship, webhooks, rollups
    - Volume discounts and full enterprise economics are custom
    - Very clear entry price for teams comparing managed infrastructure vendors
  - - QuickNode
    - Free tier; $49 Build; $249 Accelerate; $499 Scale; $999 Business; enterprise custom
    - RPC, streams, webhooks, IPFS, analytics, SLAs, enterprise controls
    - Actual total cost depends on credits and overages
    - Packaging is transparent and highly procurement-friendly
  - - Helius
    - Free; $49 Developer; $499 Business; $999 Professional; dedicated nodes from $2,900
    - Solana RPCs, staked connections, streaming, sender, dedicated solutions
    - Add-ons and annual pricing vary
    - Useful benchmark for Solana-specialist economics
  - - Gelato
    - Free; $99 Pro; $399 Growth; enterprise custom
    - Compute units across paymaster, bundler, private RPCs, and functions
    - Autoscaling and gas premiums vary by plan
    - Shows how specialist wallet / bundler tooling can be bought without a full ecosystem bet
  - - Moralis
    - Public pricing page retained but numeric rate card not clearly extracted from fetched text
    - Wallet, token, NFT, DeFi, price, streams, data feeds, AI-oriented tooling
    - Exact plan economics need direct site inspection or sales contact
    - Still more commercially legible than Endless because a dedicated pricing surface exists
  - - AWS Managed Blockchain / Web3
    - Usage-based cloud procurement rather than crypto-native tier card on retained landing pages
    - Managed nodes, query APIs, analytics, security, signing patterns, startup programs
    - Specific cost depends on service mix and AWS contract structure
    - Conventional enterprise procurement remains a credible substitute path
  notes: The key comparison is not just absolute price but whether a buyer can understand packaging without a sales call. Endless currently trails the infrastructure vendors on that dimension in public evidence.
