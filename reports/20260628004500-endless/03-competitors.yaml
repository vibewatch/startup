  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-clarity
    missingEvidence: Endless pricing, SLA, support tier, and contract-packaging details that can be compared directly against Alchemy, QuickNode, Helius, or Gelato.
    whyItMatters: Without a public or private pricing pack, it is impossible to prove that Endless wins total integration cost rather than just telling a broader story.
    diligencePath: Request sales collateral, pricing model, SLA terms, free-tier logic, and enterprise support structure.
    relatedQuestionRefs:
    - QP024
    - QP025
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Named customer references, win/loss cases, and production usage metrics showing where Endless beats direct or adjacent competitors.
    whyItMatters: Most rivals already have stronger public scale, partner, or packaging evidence, so proof of actual conversion is critical.
    diligencePath: Ask for customer references, pipeline by segment, renewal data, and competitor displacement examples.
    relatedQuestionRefs:
    - QP018
    - QP024
    - QP025
  - type: missing-source
    severity: material
    topic: benchmarking
    missingEvidence: Independent performance or TCO benchmarking versus Sui, Aptos, Solana SDP, Alchemy, QuickNode, and Gelato.
    whyItMatters: Marketing claims about easier onboarding or better architecture do not establish a durable moat without measurable performance or cost advantages.
    diligencePath: Commission or request third-party benchmark studies and architecture comparisons.
    relatedQuestionRefs:
    - QP019
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: minor
    topic: switching-costs
    missingEvidence: Detailed migration paths and lock-in features for customers moving from incumbent APIs or other ecosystems to Endless.
    whyItMatters: Multi-homing risk remains high unless the company can prove concrete migration advantages or expansion loops.
    diligencePath: Review implementation plans, time-to-first-app data, and customer success playbooks.
