    - Documented platform concept plus live public web surface
    - Combines chain, AI, component model, and developer tooling in one pitch
    - Need production metrics showing how much of the stack is used in practice.
  - - Component marketplace
    - Developers building reusable modules
    - Explicitly referenced in docs; public depth is limited
    - Promises reusable auth, payment, storage, and admin modules
    - Need public guide detail, transaction model, and supported component catalogue.
  - - Browser wallet
    - End users and DApp teams
    - Public route and product copy visible
    - No-download access plus social login and embedded DApp flow
    - Need user counts, bridge detail, and wallet-security audit evidence.
  - - TypeScript and Go SDKs
    - Application developers
    - Official docs plus public repos
    - Multi-language integration path lowers Web2 migration friction
    - Need package-adoption metrics and release / issue velocity.
