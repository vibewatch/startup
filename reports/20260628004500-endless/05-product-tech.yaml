  - FE002
- id: architecture-and-developer-workflow
  title: Architecture claims are specific enough to map the stack and developer workflow
  body: |-
    Unlike many early crypto projects that stop at slogans, Endless publishes a reasonably mappable technical stack. The discovery documents describe AI, serverless architecture, full distributed frameworks, relay networks, SDKs, APIs, decentralized storage, and the Endless public chain as parts of one composable environment. The quick-start and technical-documentation indexes then translate that marketing layer into concrete developer tasks: install or run the CLI, start a local node, fund accounts, build transactions, learn Move, connect to RPC or indexer endpoints, and use standards for wallets, fungible assets, and digital assets.

    The SDK and repo surface reinforces that the company is trying to support a real development workflow. Official docs and GitHub materials show an official TypeScript SDK, an official Go SDK, a Move framework repository, and a VS Code plugin with a language server. The SDK docs go beyond naming the libraries and include account generation, faucet funding, signing, submission, and network configuration patterns. Network docs also publish public RPC and indexer endpoints for mainnet and testnet, along with chain IDs and epoch timing.

    What this does not prove is production maturity at scale. Public endpoints, release binaries, and code repositories demonstrate a real public build surface, but they do not reveal uptime, throughput, incident rates, or enterprise support quality. The architecture is visible; the operating quality behind it is only partially visible.
  claimRefs:
