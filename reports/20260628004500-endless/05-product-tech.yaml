    - Public repo and standards docs
    - Publishes wallet, digital-asset, and fungible-asset conventions
    - Need clearer compatibility guarantees and upgrade policy.
  - - Developer tooling and IDE support
    - Move developers
    - Public VS Code plugin and release artifacts
    - Language-server workflow lowers tooling friction for Move development
    - Need evidence of ongoing maintenance cadence and user adoption.
