companyProfile:
  summary: >-
    Endless is an early-stage Web3 infrastructure company building a Move-based protocol and development platform aimed
    at reducing the friction for Web2 teams entering blockchain applications. Its public materials emphasize
    componentized tooling, AI integration, cross-chain and wallet primitives, and a Web2-like user experience, while
    public disclosures remain far stronger on funding and ecosystem announcements than on commercial operating results.
  foundedDate: '2024-01-01'
  founders:
    - name: Yu Xiong
      role: Co-president; named founder in Tracxn
      background: Public company materials present him as an AI and blockchain academic leader associated with the University of Surrey.
      claimRefs: [CO009, CO010]
    - name: Uriah Ferruccio
      role: Named founder in Tracxn
      background: Public company materials reviewed for this run did not provide an official operating biography.
      claimRefs: [CO009]
  foundingLocation: Hong Kong / London (public sources conflict)
  headquarters: Hong Kong (operating base; London also appears in third-party databases)
  productSummary: >-
    Endless offers a protocol-centric development stack spanning a Move-based chain, wallet and bridge tooling,
    component marketplace, SDKs, developer APIs, and tokenized ecosystem incentives intended to make Web2-to-Web3
    application development and onboarding easier.
  customerFocus: >-
    Primary public target users are Web2 developers, Web3 developers, project teams, and ecosystem builders rather
    than already-proven large enterprise customers.
  businessModel: >-
    Public materials describe monetization through SDK/API usage, marketplace fees, storage and bandwidth fees,
    staking or validator economics, gas-related network fees, and ecosystem distribution or promotion revenue shares.
  stage: Series A private
  fundingStatus: >-
