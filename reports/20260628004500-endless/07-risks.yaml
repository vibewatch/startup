  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: licensing-map
    missingEvidence: Entity chart, legal opinions, and product-by-product licensing analysis for Hong Kong and cross-border
      operations.
    whyItMatters: The public file shows a tightening regulatory regime but not how Endless is positioned against it.
    diligencePath: Request outside-counsel memo, entity chart, regulator-engagement log, and current / planned licence inventory.
    relatedQuestionRefs:
    - QR019
    - QR030
    relatedTableRefs:
    - TR001
  - type: access-blocked
    severity: material
    topic: bridge-audit
    missingEvidence: A substantive public or private bridge audit report, remediation log, and incident history.
    whyItMatters: Bridge risk is one of the highest-severity technical exposures, and the fetched audit page did not provide
      assurance content.
    diligencePath: Request full bridge audit packet, auditor identity, findings severity, remediation dates, and any exploit
      history.
    relatedQuestionRefs:
    - QR012
    - QR020
    - QR030
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: security-operations
    missingEvidence: Bug bounty terms, vulnerability disclosures, incident-response runbooks, and abuse / fraud metrics.
    whyItMatters: Documentation alone cannot establish operational security maturity for a live wallet, bridge, and marketplace
      stack.
    diligencePath: Request last 12 months of incidents, mean-time-to-detect / resolve, and security staffing or outsourced
      SOC coverage.
    relatedQuestionRefs:
    - QR020
    - QR030
    relatedTableRefs:
    - TR002
