- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Licensing / compliance slippage
    - No clear legal-entity and licensing map
    - Management cannot show which entity owns which regulated product or how HK rules apply
    - Treat as thesis-break until counsel-backed map is produced.
  - - Security opacity
    - Audit gap persists
    - No bridge audit packet, vuln history, or bug-bounty evidence is shared in diligence
    - Underwrite only at a discount or pause.
  - - Flagship-app concentration
    - Usage concentration too high
    - One app or affiliated surface drives a dominant share of MAU, GMV, or sign-ins
    - Raise concentration discount and require diversification plan.
  - - Monetization fragility
    - No proved revenue engine
    - Revenue remains spread across theoretical lines with no dominant, retained stream
    - Shift thesis from platform business to speculative ecosystem option.
  - - Operator reliability
    - Node or bridge incidents are frequent
    - Repeated severe incidents or poor recovery discipline appear in private logs
    - Escalate operational-risk rating and shorten hold horizon.
  - - Regulatory regime hardens faster than compliance buildout
    - New rules arrive before Endless is ready
    - Company lacks resources or approvals to adapt to new Hong Kong or cross-border requirements
    - Assume slower growth and heavier capital needs.
  notes: These triggers are designed to convert broad risk language into concrete go / no-go diligence tests.
