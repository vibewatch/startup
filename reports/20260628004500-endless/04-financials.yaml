  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Numeric API, subscription, marketplace, and cloud pricing plus effective realized take rates.
    whyItMatters: Without price realization and discount data, revenue quality and commercial power cannot be assessed.
    diligencePath: Request price cards, sample customer contracts, and realized net pricing by cohort.
    relatedQuestionRefs:
    - QI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-burn
    missingEvidence: Cash balance, treasury composition, monthly burn, and any debt or market-making obligations.
    whyItMatters: Runway and financing dependency cannot be estimated from a headline fundraise alone.
    diligencePath: Request treasury statement, monthly burn bridge, and obligation schedule.
    relatedQuestionRefs:
    - QI018
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: Audited financial statements or equivalent filing-grade disclosure specific to Endless.
    whyItMatters: A filing-quality financial package would sharply reduce underwriting uncertainty around reserves, liabilities, and revenue.
    diligencePath: Request audited statements, management accounts, and legal analysis of any token-related fundraising structure.
    relatedQuestionRefs:
    - QI019
  - type: private-evidence-only
    severity: material
    topic: cac-payback
    missingEvidence: Paid acquisition, incentive spend, cohort conversion, and payback data for developers or enterprise customers.
    whyItMatters: Public monetization logic does not show whether growth is capital efficient.
    diligencePath: Request cohort dashboards for grants, incentives, paid conversion, and retained spend.
    relatedQuestionRefs:
    - QI021
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top customer, top validator, and treasury-owned stake concentration data.
