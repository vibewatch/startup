- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Current public substitute
  - Impact on judgment
  - Exact diligence path
  rows:
  - - Revenue / ARR
    - Core input for quality-of-revenue underwriting
    - Only monetization pathways are public
    - Cannot test valuation against operating traction
    - Request monthly revenue by stream and last-twelve-month trend.
  - - Cash balance and burn
    - Required for runway and financing-dependency view
    - Funding headline only
    - Cannot estimate months of runway or urgency of next round
    - Request treasury statement, cash policy, and monthly burn bridge.
  - - Realized pricing and take rates
    - Tests commercial power and discounting
    - List-style logic only
    - Cannot assess revenue quality or enterprise willingness to pay
    - Request contracts, price cards, and effective net pricing by cohort.
  - - Developer conversion and retention
    - Needed to understand paid adoption durability
    - Grant program and community claims only
    - Cannot separate ecosystem noise from monetized usage
    - Request paid-builder cohorts and retention / spend curves.
  - - Customer concentration / validator concentration
    - Needed to understand fragility and governance power
    - Stake thresholds and role model only
    - Concentration risk remains hidden
    - Request top accounts, validator distribution, and treasury-owned stake percentage.
  notes: This table turns absent operating disclosure into a concrete diligence checklist rather than treating the gaps as narrative caveats only.
