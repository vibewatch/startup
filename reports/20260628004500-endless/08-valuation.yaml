  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: Exact liquidation preferences, secondaries, anti-dilution terms, and any side-letter economics from the March 2025 round.
    whyItMatters: Headline valuation can materially overstate common-equity attractiveness when preferred protections are heavy.
    diligencePath: Obtain the cap table, lead term sheet, and counsel summary before treating the $1B mark as an entry price.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: token-overhang
    missingEvidence: Circulating supply, unlock schedule, treasury release policy, and grant-token distribution mechanics for EDS-related incentives.
    whyItMatters: Token overhang can weaken ecosystem value capture and financing leverage even if product adoption improves.
    diligencePath: Request the current tokenomics memo, treasury dashboard, and vesting schedule from management.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: adoption-kpis
    missingEvidence: Active developers, active applications, enterprise customers, paid API or infrastructure usage, and any recurring revenue bridge.
    whyItMatters: These KPIs determine whether Endless deserves to be comped to scaled infrastructure platforms or to narrative-stage protocols.
    diligencePath: Request a product-and-finance KPI pack covering the last four quarters plus current quarter-to-date usage.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: TV004 comparable coverage
    missingEvidence: A fuller priced comparable set for private crypto infrastructure rounds and more current transaction-level valuation references around Endless’s stage.
    whyItMatters: The current comparable table is intentionally partial because the retained public pack has only a few directly priced infrastructure references, which limits how tightly the scenario ranges can be triangulated.
    diligencePath: Add more dated private-round disclosures, public market benchmarks, or secondary marks before relying on a narrower valuation range.
