    - 1.0-1.4
    - Possible, but requires fresh proof not yet public.
    - Adoption evidence arrives slower than the current round assumed.
  - - Base
    - Endless remains strategically credible but still light on public KPIs, so investors haircut the current mark.
    - 0.6-0.9
    - Most defensible on current public evidence.
    - The company cannot convert technical momentum into measurable commercial traction.
  - - Bear
    - Usage proof stays thin, token or compliance friction rises, or new round terms reveal weak bargaining power.
    - 0.25-0.5
    - Material risk if the next diligence pack disappoints.
    - A down-round or structurally investor-protective financing resets the common-equity case.
  - - Current observed mark
    - March 2025 round headline.
    - '1.0'
    - Known fact, not a fresh valuation opinion.
    - Can stop being an investable entry price if new data undermine the narrative.
