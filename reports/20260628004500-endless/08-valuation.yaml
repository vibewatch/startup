- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Adoption proof stays vague
    - No disclosed active developers, active apps, enterprise customers, or paid usage metrics in the next diligence cycle.
    - The platform story remains speculative rather than underwritten.
    - Move toward the low end of the base or bear range.
  - - Round terms are investor-protective
    - Preference stack, secondaries, or token-linked side rights materially reduce common-equity upside.
    - Headline valuation stops being a good proxy for return potential.
    - Do not rely on the $1B mark without cap-table adjustment.
  - - Token overhang is heavy
    - Circulating float, unlocks, or treasury release policy imply persistent supply pressure.
    - Ecosystem growth no longer cleanly converts into holder or equity value.
    - Lower fair value and demand additional protections.
  - - Compliance path is unclear
    - Management cannot show how token-linked expansion fits guardrailed VA regimes.
    - Regulatory execution risk starts dominating growth optionality.
    - Extend diligence and haircut upside assumptions.
  - - Follow-on round prices below expectations
    - A new financing lands meaningfully below the current mark or with weak syndicate support.
    - The market is rejecting the premium narrative.
    - Treat it as a down-round signal until proven otherwise.
  notes: These triggers are designed for the next financing and operating update, not only for a distant IPO decision.
  claimRefs:
  - CV010
  - CV030
  - CV038
  - CV041
  - CV043
  - CV044
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue and usage bridge
    - ARR or run rate, paid API volume, active developers, active applications, enterprise customers, and churn/retention data
    - These facts decide whether infrastructure comps belong at all.
    - Management KPI pack plus product analytics review.
  - - Round mechanics
    - Preference stack, secondaries, anti-dilution, side letters, and token-linked economic rights
    - Return economics can diverge sharply from the headline post-money mark.
    - Cap table, term sheet, and counsel memo.
  - - Token supply and unlocks
    - Circulating supply, vesting schedule, treasury policy, validator incentives, and grant-token release terms
    - Token overhang can weaken ecosystem value capture and financing leverage.
    - Tokenomics memo, treasury dashboard, and legal review.
  - - Regulatory and jurisdictional map
    - Entity structure, token distribution restrictions, and Hong Kong or other VA compliance posture
    - Needed to test whether growth assumptions are operationally legal and repeatable.
    - Compliance counsel, entity chart, and jurisdiction memo.
  - - Customer-quality proof
    - Named design partners, case studies, expansion behavior, and evidence of repeated monetization
    - Separates ecosystem theater from a comp-worthy commercial engine.
    - Reference calls, customer cohort review, and billing data.
  notes: None of these asks are cosmetic; each one can move the recommendation, the comp set, or the scenario range.
