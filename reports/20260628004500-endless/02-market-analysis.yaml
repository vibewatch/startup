tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Developer middleware for onchain apps
    - SDKs, APIs, wallet abstraction, identity, storage, developer support
    - Base chain token speculation or consumer-trading apps without tooling budgets
    - Product engineering, platform engineering, innovation teams
    - This is the clearest public lane for Endless based on its own docs.
  - - Tokenized payments and stablecoin workflows
    - Stablecoin issuance support, onchain payment logic, treasury / settlement tooling
    - General fintech payments spend with no blockchain requirement
    - Payments, treasury, compliance, digital-asset product owners
    - Relevant because Endless economics and Hong Kong regulation both point toward stablecoin-enabled workflows.
  - - AI-assisted onchain applications
    - Agent tooling, AI service payments, autonomous transaction logic
    - General-purpose AI software not tied to blockchain settlement or wallets
    - Product teams building AI-enabled apps
    - Endless repeatedly pairs AI with Web3 as a differentiator.
  - - Community and ecosystem acquisition
    - Developer grants, hackathon-style support, ecosystem education
    - Mass-market consumer marketing unrelated to builder activation
    - Ecosystem, BD, developer-relations budgets
    - Public documents show this as part of the go-to-market motion.
  - - Status-quo substitute set
    - Internal engineering build, managed cloud / node vendors, larger chain ecosystems
    - Pure token trading or mining economics
    - CTO office, internal platform teams, procurement
    - These alternatives cap how much of the broad market Endless can realistically claim.
  notes: The table defines the market from the job-to-be-done described in Endless’s documents rather than from a single external industry taxonomy. Included and excluded spend are analytical judgments backed by the retained sources.
  enumerationScope:
    coverage: partial
    basis: Rows capture the public market buckets most directly supported by Endless product documents and the retained regulatory sources; they do not attempt an exhaustive crypto taxonomy.
