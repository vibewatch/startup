- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: standard
  summary: Adoption requires more than developer interest; it runs through product, compliance, and end-user execution layers.
  data:
    nodes:
    - id: need
      label: Workflow need
      detail: A team needs payments, wallets, tokenization, or agentic onchain actions.
    - id: dev
      label: Developer evaluation
      detail: Builders test whether Endless reduces the Web2-to-Web3 migration burden.
    - id: prod
      label: Product integration
      detail: SDKs, identity, storage, gas handling, and app logic must fit the product roadmap.
    - id: comp
      label: Compliance / treasury fit
      detail: Stablecoin, reserve, legal, and operating controls must pass internal review.
    - id: launch
      label: Production launch
      detail: Only then can an external customer or user experience ship at scale.
    edges:
    - from: need
      to: dev
      label: creates demand for tooling
    - from: dev
      to: prod
      label: if the stack is usable
    - from: prod
      to: comp
      label: once money movement becomes real
    - from: comp
      to: launch
      label: after controls are acceptable
