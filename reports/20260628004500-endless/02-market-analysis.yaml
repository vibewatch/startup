- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Web2 developer teams
    - Product or platform teams at firms wanting onchain features
    - Application developers used to JS / Python / mainstream stacks
    - Engineering / product budgets
    - Evaluate SDKs and modules, prototype, then ship user-facing app flows
    - Product engineering with CTO oversight
    - Need for blockchain capability without retraining around a fully crypto-native stack
  - - Web3-native project teams
    - Builders already operating inside crypto ecosystems
    - Smart-contract and integration teams
    - Protocol, treasury, or ecosystem budgets
    - Choose whether Endless improves speed, UX, or distribution versus incumbent ecosystems
    - Protocol leadership and ecosystem teams
    - Need for Move-based or AI-enabled features with better onboarding
  - - Payments or treasury innovators
    - Firms testing stablecoin or tokenized-settlement use cases
    - Treasury ops, finance engineering, compliance teams
    - Treasury / innovation budgets
    - Assess compliant rails, reserve logic, redemption, settlement and monitoring
    - Treasury plus compliance
    - Availability of regulated stablecoin rails and real business use cases
  - - AI application builders
    - Teams building agentic or autonomous transaction flows
    - AI engineers and product developers
    - R&D or product budgets
    - Connect model-driven workflows to wallets, data, and onchain execution
    - Product + research leads
    - Need for programmable payment or transaction agents
  - - End users reached through partner apps
    - Consumers or business operators using apps built on Endless
    - Wallet users and application operators
    - Indirectly paid through the app provider
    - Use OAuth / wallet abstractions instead of touching raw chain infrastructure
    - App operator, not end user
    - Comparable UX to Web2 with onchain benefits kept in the background
  notes: Buyer, user, payer, and budget-owner fields are partly inferred because Endless does not publish a formal commercial org or ICP memo. The map is intended to show who would need to say yes for adoption to move beyond experimentation.
  enumerationScope:
    coverage: partial
    basis: Rows cover the main adoption personas explicitly described or strongly implied by Endless product documents and Hong Kong policy sources, but they are not a full universe of potential buyers.
