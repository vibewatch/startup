- id: sizing-and-adoption-lenses
  title: Evidence-constrained sizing lenses rather than a single TAM headline
  body: 'The retained public sources support several sizing lenses, but they do not justify pretending that Endless already owns a clean, quantified SAM. At the broadest level, the SFC’s 2025 ASPIRe roadmap describes a global virtual-asset market worth more than $3 trillion in 2024, with annual trading volumes above $70 trillion. That establishes that the surrounding category is economically material. Chainalysis then narrows the growth narrative toward stablecoin-powered payments, tokenized real-world assets, and agentic or AI-mediated payments, which are much closer to Endless’s stated product ambition than a generic token market-cap number.


    Developer-supply evidence sharpens the lens further. Electric Capital’s 2024 developer report shows that crypto development remains large and increasingly multi-chain: 902 million commits across 1.7 million repositories, one in three developers working across chains, and long-tenured developers still growing even as total developers fell. That matters because Endless is not only selling chain access; it is trying to win a slice of developer time and tooling choice inside a market that already has experienced builders and entrenched ecosystems.


    Capital-market evidence is supportive but should be interpreted carefully. CB Insights reported $121 billion of global venture funding in Q1 2025 and a record $3.5 million median deal size, while AI captured one in five venture deals. Endless’s own $110 million round sits inside that supportive funding window. The result is a market large enough to matter, but still one where public data measures adjacent capital pools and ecosystem activity more clearly than Endless’s true near-term capture potential.'
