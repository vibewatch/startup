evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: >-
      Full board roster, committee structure, and legal-entity map across Stiftung Endless, protocol ops, and token
      governance.
    whyItMatters: Governance opacity makes it hard to judge control, treasury authority, and key-person dependence.
    diligencePath: Request foundation documents, board list, and governance charter.
    relatedQuestionRefs:
      - QO013
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: headquarters-and-domicile
    missingEvidence: >-
      Authoritative statement reconciling Hong Kong operating presence, London database listing, and named legal
      entities.
    whyItMatters: Location and jurisdiction affect regulation, hiring, treasury, and enforceability of claims.
    diligencePath: Request certificate of incorporation, foundation domicile, and principal office disclosures.
    relatedQuestionRefs:
      - QO009
      - QO022
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Verified employee count, revenue/ARR, active accounts, developer retention, and live-customer metrics.
    whyItMatters: The public pack proves financing and launch, but not durable usage or commercial quality.
    diligencePath: Request management KPI dashboard and audited or board-level operating metrics.
    relatedQuestionRefs:
      - QO016
      - QO017
      - QO023
  - type: conflicting-data
    severity: minor
    topic: founder-roster
    missingEvidence: Direct official confirmation of founder names and roles.
    whyItMatters: Conflicting founder data weakens identity certainty in an early-stage company.
    diligencePath: Request official corporate history or founder bios from management.
    relatedQuestionRefs:
      - QO010
      - QO022
      - QO025
  - type: stale
    severity: minor
    topic: stakeholder-map
    missingEvidence: Current post-round investor list and rights package.
    whyItMatters: Only one investor is explicitly named in retained sources, leaving the syndicate and governance rights opaque.
    diligencePath: Request cap table summary, board observer rights, and round documents.
    relatedQuestionRefs:
      - QO005
      - QO006
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: traction-gap
    missingEvidence: Revenue, active developer count, customer count, and usage by shipped applications.
    whyItMatters: >-
      Without operating metrics, the public market story cannot be converted into a defensible capture model or
      sales-efficiency view.
    diligencePath: Request KPI deck with active builders, live applications, gross payment volume, and revenue by product line.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: missing-source
    severity: material
    topic: sam-definition
    missingEvidence: A company-specific SAM/SOM model tied to explicit buyer segments, pricing, and conversion assumptions.
    whyItMatters: >-
      The surrounding market is large, but investors still need to know how much of it Endless can reach before stronger
      incumbents or substitutes win the budget.
    diligencePath: Ask management for bottom-up segmentation, pricing assumptions, and pipeline conversion data by ICP.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: institutional-readiness
    missingEvidence: Named enterprise design partners or regulated financial institutions using Endless in production.
    whyItMatters: Hong Kong policy tailwinds matter only if the company can map them into actual regulated customer demand.
    diligencePath: >-
      Request customer references, pilot contracts, and implementation timelines for stablecoin or tokenization
      workflows.
    relatedQuestionRefs:
      - QM014
      - QM024
  - type: stale
    severity: minor
    topic: regulatory-timing
    missingEvidence: >-
      Updated public confirmation of which licensed Hong Kong stablecoin issuers have launched and what use cases they
      are serving.
    whyItMatters: Launch timing and live use cases will materially affect how fast adjacent infrastructure demand becomes real.
    diligencePath: Refresh HKMA, SFC, and issuer-specific announcements after the first live launches.
    relatedQuestionRefs:
      - QM017
  - type: private-evidence-only
    severity: material
    topic: pricing-clarity
    missingEvidence: >-
      Endless pricing, SLA, support tier, and contract-packaging details that can be compared directly against Alchemy,
      QuickNode, Helius, or Gelato.
    whyItMatters: >-
      Without a public or private pricing pack, it is impossible to prove that Endless wins total integration cost
      rather than just telling a broader story.
    diligencePath: Request sales collateral, pricing model, SLA terms, free-tier logic, and enterprise support structure.
    relatedQuestionRefs:
      - QP024
      - QP025
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Named customer references, win/loss cases, and production usage metrics showing where Endless beats direct or
      adjacent competitors.
    whyItMatters: >-
      Most rivals already have stronger public scale, partner, or packaging evidence, so proof of actual conversion is
      critical.
    diligencePath: Ask for customer references, pipeline by segment, renewal data, and competitor displacement examples.
    relatedQuestionRefs:
      - QP018
      - QP024
      - QP025
  - type: missing-source
    severity: material
    topic: benchmarking
    missingEvidence: Independent performance or TCO benchmarking versus Sui, Aptos, Solana SDP, Alchemy, QuickNode, and Gelato.
    whyItMatters: >-
      Marketing claims about easier onboarding or better architecture do not establish a durable moat without measurable
      performance or cost advantages.
    diligencePath: Commission or request third-party benchmark studies and architecture comparisons.
    relatedQuestionRefs:
      - QP019
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: minor
    topic: switching-costs
    missingEvidence: >-
      Detailed migration paths and lock-in features for customers moving from incumbent APIs or other ecosystems to
      Endless.
    whyItMatters: Multi-homing risk remains high unless the company can prove concrete migration advantages or expansion loops.
    diligencePath: Review implementation plans, time-to-first-app data, and customer success playbooks.
    relatedQuestionRefs:
      - QP016
      - QP017
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Numeric API, subscription, marketplace, and cloud pricing plus effective realized take rates.
    whyItMatters: Without price realization and discount data, revenue quality and commercial power cannot be assessed.
    diligencePath: Request price cards, sample customer contracts, and realized net pricing by cohort.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-burn
    missingEvidence: Cash balance, treasury composition, monthly burn, and any debt or market-making obligations.
    whyItMatters: Runway and financing dependency cannot be estimated from a headline fundraise alone.
    diligencePath: Request treasury statement, monthly burn bridge, and obligation schedule.
    relatedQuestionRefs:
      - QI018
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: Audited financial statements or equivalent filing-grade disclosure specific to Endless.
    whyItMatters: >-
      A filing-quality financial package would sharply reduce underwriting uncertainty around reserves, liabilities, and
      revenue.
    diligencePath: Request audited statements, management accounts, and legal analysis of any token-related fundraising structure.
    relatedQuestionRefs:
      - QI019
  - type: private-evidence-only
    severity: material
    topic: cac-payback
    missingEvidence: Paid acquisition, incentive spend, cohort conversion, and payback data for developers or enterprise customers.
    whyItMatters: Public monetization logic does not show whether growth is capital efficient.
    diligencePath: Request cohort dashboards for grants, incentives, paid conversion, and retained spend.
    relatedQuestionRefs:
      - QI021
  - type: private-evidence-only
    severity: material
    topic: concentration
