      - number: '4.2'
        title: Token economics are explicit; operating unit economics are still indirect
        blocks:
          - type: paragraph
            body: >-
              The most concrete financial disclosure in Endless’s public pack is token economics rather than
              income-statement performance. The economics document and white paper disclose a 10 billion EDS initial
              supply, a detailed allocation schedule, and an inflation model that starts at 8%, declines by 15%
              annually, and bottoms at 1.5%. The same materials say inflationary issuance is split across staking
              rewards, ecosystem development, and relay-network incentives, while transaction fees are partially burned
              and partially routed back to validators or ecosystem support. That makes the token layer relatively
              legible compared with many early-stage crypto projects.


              What is less legible is the operating unit-economics layer. Endless has public material on how gas and
              storage fees work, how staking rewards are calculated, how lockups are structured, and how validator
              economics are bounded by governance-set stake thresholds. Those disclosures explain incentive design and
              network-cost mechanics. They do not disclose realized gross margin, customer acquisition cost, payback,
              sales cycle length, or support burden per active developer or project team.


              The practical conclusion is that Endless’s public financial model is strongest where the protocol itself
              defines the economics in code or policy and weakest where management would need to disclose business
              performance. Investors can study fee pathways and token dilution mechanics today, but cannot yet test
              whether those mechanics are producing attractive margins or disciplined growth in practice.
