      - number: '8.4'
        title: Diligence Gates and Thesis-Breaks
        blocks:
          - type: paragraph
            body: >-
              The next diligence cycle should focus less on storytelling and more on the handful of facts that decide
              whether the $1 billion mark is financeable. First, investors need the revenue and usage pack: active
              developers, active applications, enterprise customers, paid API or infrastructure usage, and any
              repeatable revenue run rate. Second, they need cap-table mechanics: liquidation preferences, secondaries,
              pro rata rights, token-related side letters, and whether the headline mark translates into attractive
              common-equity entry economics. Third, they need token-specific supply detail, including circulating float,
              unlock schedule, treasury policy, and how any grants or incentives dilute ecosystem participants.


              There are also clear thesis-break triggers. Endless’s own funding-terms disclaimer warns that grants are
              not endorsements and that Endless does not warrant the legality, security, or performance of third-party
              projects on the protocol. Hong Kong’s virtual-asset policy is open but explicitly guardrailed, which means
              regulatory permissiveness should not be assumed. If management cannot show clean usage growth, if the next
              financing reveals protective terms that subordinate new common investors, or if token governance
              introduces material overhang, the fair-value range moves down fast. Those are not edge cases; they are the
              central underwriting questions.
            claimRefs:
              - CV010
              - CV030
              - CV038
              - CV042
              - CV043
