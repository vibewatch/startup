  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct protocol peers for developer mindshare
        blocks:
          - type: paragraph
            body: >-
              The closest conceptual substitutes for Endless are the Move-oriented ecosystems that also promise
              mainstream-ready developer experiences. Mysten Labs positions Sui as delivering the benefits of Web3 with
              the ease of Web2, while Sui documentation highlights high throughput, low latency, asset-oriented
              programming, tokenized assets, zkLogin, payment tooling, and onboarding guides aimed at mainstream
              builders. Aptos makes a similar move from a different angle: Aptos Labs talks about bringing the future
              onchain, and Aptos documentation emphasizes sponsored transactions, keyless accounts, orderless
              transactions, and AI-oriented developer tooling.


              That matters because Endless is not just competing for chain selection. It is competing for the same
              narrative territory: help developers build useful onchain products without forcing end users through
              classic wallet friction. On that comparison, Endless has a plausible architectural story, but its public
              evidence base is thinner. Mysten and Aptos each show more visible ecosystem breadth and more mature
              documentation surfaces, while Aptos additionally advertises current AI and institutional-workload
              investment.


              The key diligence implication is that Endless should be viewed as a challenger inside an already crowded
              “make Web3 feel more like Web2” lane. A buyer choosing Endless is not simply deciding whether to use
              blockchain at all; the buyer is deciding whether Endless’s bundle is meaningfully better than larger
              Move-linked ecosystems that already publish richer product maps and ecosystem tooling.
