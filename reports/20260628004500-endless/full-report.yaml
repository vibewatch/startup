      - number: '4.3'
        title: Capital adequacy is supported by financing headlines, but runway is not public
        blocks:
          - type: paragraph
            body: >-
              The most important capital fact is still the March 2025 financing round. Endless’s own announcement,
              together with independent coverage, consistently states that the company raised $110 million at a $1
              billion valuation. The company also announced a $1 million developer-grant program within weeks of mainnet
              launch, which indicates an early willingness to spend on ecosystem formation rather than simply preserve
              capital. On the token side, the economics materials further describe a treasury structure spanning
              foundation reserves, ecosystem-development funding, and validator or relay incentives.


              Those facts imply a sizable initial capital base, but they do not disclose the numbers an underwriter
              would actually use to calculate runway. Public materials do not provide cash on hand, monthly operating
              burn, treasury composition by asset, debt obligations, or a schedule translating token reserves into
              expected fiat operating capacity. That gap is especially important in crypto infrastructure, where
              treasury assets can be volatile and where platform growth often depends on continued incentive spending.


              External context makes the missing disclosures more consequential rather than less. The SEC’s investor
              alert stresses that crypto-asset offerings may lack audited financial statements and other investor
              protections. Hong Kong’s SFC and HKMA are building tighter virtual-asset regimes that raise the compliance
              burden for infrastructure providers and wallet or stablecoin-adjacent products. In other words, Endless
              may have a large headline round, but the market and regulatory backdrop still make disciplined capital
              management a live diligence issue.
