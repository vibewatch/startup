  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure is the highest-severity risk bucket
        blocks:
          - type: paragraph
            body: >-
              The regulatory backdrop for digital-asset platforms has become more defined in Hong Kong, not less. The
              government's 2025 digital-asset policy statement and HKMA materials show that stablecoin issuance is now a
              licensed activity with an explicitly high bar, strong investor-protection framing, and early expectations
              that only a handful of licences may be granted initially. Even if Endless is not publicly claiming to be a
              stablecoin issuer, these sources matter because they show what the company would face if it wants to
              deepen tokenized-finance, payments, or enterprise use cases in Hong Kong. The regime is becoming
              institutionally legible, but also more demanding. The SFC homepage reinforces that point by foregrounding
              licensed virtual-asset trading platforms, licensing guides, and scam warnings.


              Endless's own legal documents add a second layer of risk. The Terms of Service place the web properties
              under Stiftung Endless, disclaim website availability and accuracy, require users to bear substantial
              risk, and point to California governing law. The privacy policy makes clear that wallet-linked and usage
              data may be collected, processed, shared with service providers, and disclosed to regulators or law
              enforcement where required. The grants disclaimer goes further by explicitly distancing Endless from the
              legality, functionality, security, and performance of third-party projects built on the protocol. None of
              this is unusual for a Web3 infrastructure platform, but it means investors cannot treat ecosystem growth
              and legal responsibility as cleanly separated.


              A third layer is market-conduct and investor-protection scrutiny. Investor.gov and the SEC alert materials
              are not Endless-specific, yet they are directly relevant because they show the U.S. regulatory mindset
              around crypto-asset scams, custody risk, and misuse of perceived legitimacy. If Endless expands toward
              broader retail-facing distribution, tokens, or cross-border user acquisition, that enforcement climate
              becomes part of the company's operating environment whether or not Endless itself is the immediate target.
              The legal bottom line is therefore not that Endless has a known fatal breach today; it is that the company
              operates in a regime where compliance expectations, disclosure burdens, and liability boundaries can
              tighten quickly.
            claimRefs:
              - CR001
