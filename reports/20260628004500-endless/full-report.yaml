      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Real company, under-evidenced entry price
            body: >-
              Endless looks credible enough to keep diligencing, but the public record still does not justify treating
              the $1B mark as a clean underwriting opportunity.
            calloutType: recommendation
