disclaimer: >-
  This report is based on public sources fetched on 2026-06-28. Endless remains a private, early-stage protocol company
  with limited operating disclosure, so several conclusions are necessarily based on mechanism design, third-party
  reporting, and explicit evidence gaps rather than audited financial statements or management data-room materials. The
  recommendation should be refreshed if the company discloses verified usage, treasury, governance, or round-term
  information.
