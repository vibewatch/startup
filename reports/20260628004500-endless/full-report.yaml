  - id: FR001
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Endless's major risks flow from compliance, product-surface security, and ecosystem concentration into customer
      trust, monetization durability, and valuation.
    data:
      nodes:
        - id: reg
          label: Regulatory / legal
          detail: Hong Kong licensing, website terms, privacy obligations, and investor-protection climate.
        - id: sec
          label: Security / operational
          detail: Wallet, bridge, scan, node, and marketplace surfaces widen attack and reliability exposure.
        - id: deps
          label: Dependency / ecosystem
          detail: Luffa, external chains, operators, and partner credibility remain meaningful dependencies.
        - id: trust
          label: Customer trust
          detail: Enterprise buyers and users need confidence in reliability, data handling, and ecosystem quality.
        - id: rev
          label: Revenue durability
          detail: Weak trust or ecosystem concentration can suppress paid conversion and retention.
        - id: val
          label: Valuation / financing
          detail: If revenue proof stays thin while risk stays high, valuation support compresses.
        - id: ops
          label: Operator discipline
          detail: Validators and partners must maintain secure, well-provisioned nodes.
        - id: apps
          label: Application concentration
          detail: A small number of visible apps can dominate proof quality.
        - id: compliance
          label: Compliance operations
          detail: Licensing and entity mapping require real execution capability.
        - id: support
          label: Support / abuse handling
          detail: Wallet, bridge, and marketplace flows create user-support and fraud workloads.
        - id: margin
          label: Margin pressure
          detail: Infra cost and support load can dilute economic quality.
        - id: downside
          label: Downside scenario
          detail: Combined failures can compress adoption, financing, and valuation at once.
