      - number: '8.2'
        title: Structural Comps and Market Proof
        blocks:
          - type: paragraph
            body: >-
              Because Endless publishes no revenue bridge, a normal SaaS-style multiple exercise would pretend to know
              facts that the public file does not contain. The better method is structural comp anchoring. The positive
              side of that comp set is clear. Alchemy shows that developer infrastructure can achieve very large private
              marks when growth, monetization, and uptime are visible; QuickNode shows that a more focused infra
              platform still reached an $800 million valuation in 2024; Coinbase provides a public disclosure benchmark
              for what mature crypto infrastructure and distribution look like at scale. LayerZero, Mysten, Solana,
              Chainlink, Moralis, and Gelato collectively show that the broader category contains real platforms with
              meaningful product depth, throughput, or institutional positioning.


              The comp set is also a warning, not only a justification. Alchemy had a far richer operating narrative
              than Endless when it reached $10.2 billion. QuickNode’s disclosed mark is lower than Endless’s while its
              public positioning is more obviously infrastructure-first and commercially packaged. Coinbase’s public
              market cap and revenue show how much audited scale exists at the mature end of the category, and that gap
              matters. Endless is therefore not being valued as a generic pre-seed protocol; it is being priced against
              a sector where the winners eventually disclose real usage, partners, revenue mechanics, or at least
              clearer product packaging than Endless has provided so far.
