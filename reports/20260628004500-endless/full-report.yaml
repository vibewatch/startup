  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization design is broad, but public pricing remains mostly qualitative
        blocks:
          - type: paragraph
            body: >-
              Endless does not present itself as a single-fee protocol. Instead, the public business-model materials
              describe a layered monetization stack that spans component sales, SDK and API usage, infrastructure
              consumption, staking-related economics, transaction fees, application distribution, and gaming or NFT
              activity. That is financially important because it means the company is trying to capture value from both
              developer tooling and on-chain usage, not merely from one-time token issuance or speculative trading.


              The clearest monetization disclosures come from the business-model documentation. Endless says its
              component marketplace charges a fixed percentage on component sales, its SDK and API services can be
              billed on a pay-per-call basis or via enterprise subscriptions, and its cloud storage services are sold
              through usage-based storage and bandwidth packages. The same document also describes promotion-fee or
              revenue-share economics for DApp distribution and fee capture from gaming and NFT marketplace activity.
              Those statements establish the intended revenue architecture, but they stop short of disclosing list
              prices, discounting policy, realized take rates, or what proportion of usage is currently paid rather than
              subsidized.


              As a result, Endless has a credible public explanation of how revenue could be earned, but not yet a
              public proof set showing what revenue is actually being earned. For diligence, that distinction matters
              more than the breadth of the monetization menu. The current evidence supports revenue-mechanism mapping,
              not revenue-quality underwriting.
