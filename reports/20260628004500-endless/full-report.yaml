  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      Endless’s public revenue design converts developer activity and on-chain usage into several fee paths, but public
      materials stop before disclosing realized commercial output.
    data:
      nodes:
        - id: builders
          label: Developers / project teams
          detail: Target users building apps, components, and services.
        - id: components
          label: Component marketplace
          detail: Marketplace charges a fixed percentage on component sales.
        - id: sdk
          label: SDK / API services
          detail: Usage pricing plus enterprise subscription option.
        - id: infra
          label: Storage / cloud services
          detail: Usage-based storage and bandwidth packages.
        - id: network
          label: On-chain transactions
          detail: Gas fees paid in EDS, then burned or redistributed.
        - id: output
          label: Potential platform revenue
          detail: Realized mix is undisclosed in public materials.
      edges:
        - from: builders
          to: components
          label: buy / sell components
        - from: builders
          to: sdk
          label: consume SDKs and APIs
        - from: builders
          to: infra
          label: consume storage / bandwidth
        - from: builders
          to: network
          label: submit transactions
        - from: components
          to: output
          label: take fee
        - from: sdk
          to: output
          label: usage / subscription fees
        - from: infra
          to: output
          label: service fees
        - from: network
          to: output
          label: gas-related value capture
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
      - CI007
  - id: FI002
    title: Unit economics bridge
    type: flow
    layout: standard
    summary: >-
      Protocol-defined fee mechanics are public, but the operating metrics needed to turn them into software-style unit
      economics are absent.
    approximationNotes: >-
      The figure is qualitative because public materials disclose mechanism inputs but not realized CAC, payback, or
      gross-margin outputs.
    data:
      nodes:
        - id: activity
          label: User / developer activity
          detail: Transactions, API calls, storage consumption, and staking participation.
        - id: fees
          label: Fee statement mechanics
          detail: Execution, IO, and storage fees define protocol-level cost and charge logic.
        - id: rewards
          label: Validator and staking incentives
          detail: Reward rates and staking thresholds shape incentive spend.
        - id: burn
          label: Burn / buyback offsets
          detail: Fee burning and planned buyback-and-burn aim to offset dilution.
        - id: missing
          label: Missing commercial metrics
          detail: Revenue, gross margin, CAC, payback, and NRR are not public.
        - id: underwrite
          label: Underwriting output
          detail: Only partial, mechanism-level analysis is possible today.
      edges:
        - from: activity
          to: fees
          label: creates gas and storage demand
        - from: fees
          to: rewards
          label: funds validator economics
        - from: fees
          to: burn
          label: supports burn logic
        - from: rewards
          to: underwrite
          label: influences incentive cost
        - from: burn
          to: underwrite
          label: influences dilution balance
        - from: missing
          to: underwrite
          label: blocks full unit-economics view
    claimRefs:
      - CI021
      - CI022
      - CI023
      - CI024
      - CI031
