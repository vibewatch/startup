      - number: '1.4'
        title: Footprint, cover metrics, and the unresolved identity questions
        blocks:
          - type: paragraph
            body: >
              The cover-metric picture is mixed. Valuation and round size are strong, explicit, and easy to cite.
              Mainnet launch and developer-grant size are also public. Beyond those points, the public record becomes
              far less concrete. Retrieved sources do not provide audited revenue, a current employee count, an account
              base, or a clear customer total, and they spend far more time describing what Endless hopes developers
              will build than quantifying what has already been deployed at scale.


              Location is similarly noisy. The April 2025 grant announcement uses a Hong Kong dateline and later Hong
              Kong conference coverage reinforces that operating center. Yet Tracxn lists the company as based in
              London, and the official materials reviewed do not reconcile the difference. The correct reading is
              therefore not that one source must be wrong, but that the public record is not yet clean enough to treat
              headquarters, legal domicile, and operating hub as the same thing.


              The resulting diligence posture is straightforward. Endless is clearly real, funded, launched, and active
              in ecosystem promotion. It is not yet publicly transparent enough to support confident statements about
              scale, governance, or financial quality. Later chapters should therefore reuse the funding and launch
              facts as ground truth while preserving the location, founder, and metrics gaps rather than smoothing them
              away.
