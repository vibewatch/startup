      - number: '7.2'
        title: Operational, security, and product-surface risks are real because Endless exposes many user workflows
        blocks:
          - type: paragraph
            body: >-
              Endless has enough live or documented surfaces that operational risk should be treated as real, not
              hypothetical. Wallet, bridge, scan, multisignature management, token deployment, token-economics tooling,
              and a component marketplace are all public-facing workflows. That breadth is strategically useful for
              onboarding, but it also multiplies the points where bugs, abuse, poor UX, or security mistakes could
              damage trust. The bridge is especially important because it handles cross-chain transfers, recipient
              addressing, and contract deployments across Endless, Ethereum, BSC, and other chains. Cross-chain surfaces
              tend to be higher-risk than single-chain wallets, and Endless's own docs underline that the bridge relies
              on message and executor contracts across several networks.


              The company does publish some trust scaffolding. The wallet standard is designed to normalize dapp-wallet
              interoperability. The security guide warns developers about access-control mistakes and unsafe Move
              patterns. The multisignature guide documents threshold-based controls that can reduce treasury and
              account-compromise risk. Node requirements include explicit recommendations to close admin, inspection,
              and public REST ports unless properly protected, and they warn that under-provisioned or poorly isolated
              nodes can lead to degradation, consensus failures, and reward losses. These are all positive signals
              because they show Endless is at least documenting security-sensitive behavior. But documentation is not
              the same as audit evidence. The bridge audit-report page exists yet the fetched page contains no
              substantive audit content, which is itself a diligence gap rather than proof of safety.


              Consumer and developer onboarding choices also introduce risk. Wallet login via Google or other familiar
              methods lowers friction, but it concentrates trust in identity and session-management design. The scan
              guide allows token deployment, minting, and token-economics workflows, which expands the platform from
              passive observation into user-generated asset behavior. The component marketplace guide includes payment
              QR codes, API keys, SSE sessions, and tool invocation flows. Each additional feature helps activation, yet
              each adds more room for abuse, user confusion, or exploit chains if engineering and monitoring are not
              mature. For an early platform, operational and security maturity should therefore be tested directly
              rather than inferred from product breadth.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
