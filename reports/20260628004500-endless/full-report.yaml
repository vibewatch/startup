      - number: '2.4'
        title: Growth drivers, regulatory tailwinds, and the constraints that still dominate
        blocks:
          - type: paragraph
            body: >-
              The clearest external driver in the current evidence pack is that regulated digital-asset infrastructure
              is moving from theory toward implementation in Hong Kong. The HKMA stablecoin regime took effect on 1
              August 2025, 36 applications were received in the first window, two licences were granted in April 2026,
              and officials said regulated Hong Kong dollar stablecoins could launch as early as mid-2026. In parallel,
              the February 2026 policy speech cited $14 billion of digital assets under custody at Hong Kong banks, $29
              billion of tokenized deposits, and a $10 billion tokenized green bond issuance. Those signals matter
              because Endless is trying to sell into exactly the zone where stablecoins, tokenized assets, and compliant
              developer tooling converge.


              But the constraints are equally visible. Investor.gov continues to warn that crypto-asset securities are
              highly volatile and that platforms can lack critical protections. IOSCO’s tokenization report and the SFC
              roadmap both emphasize market integrity, investor protection, concentration, and fragmented regulation.
              Endless’s own public record still lacks the operating metrics that would show whether the company has
              converted market excitement into durable traction.


              That tension shapes the diligence conclusion. The market is not too small; if anything, the surrounding
              opportunity is broad and getting more institutionally legible. The harder question is whether Endless has
              evidence of fit inside the narrower, compliance-sensitive slice it actually needs to win first. Until
              customer count, revenue quality, developer activation, and post-launch stablecoin usage become public, the
              chapter should be read as supportive on market existence but cautious on capture certainty.
            claimRefs:
