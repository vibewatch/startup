      - - Operator reliability
        - Node or bridge incidents are frequent
        - Repeated severe incidents or poor recovery discipline appear in private logs
        - Escalate operational-risk rating and shorten hold horizon.
      - - Regulatory regime hardens faster than compliance buildout
        - New rules arrive before Endless is ready
        - Company lacks resources or approvals to adapt to new Hong Kong or cross-border requirements
        - Assume slower growth and heavier capital needs.
