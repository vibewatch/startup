- id: capital-and-milestones
  title: Funding history, milestones, and what is actually public
  body: |
    The strongest fully corroborated company fact in the public record is the March 4, 2025 financing. Endless’s own announcement, U.Today, and Web3 OClock all align on the same headline: a $110 million round at a $1 billion valuation. That fact alone explains why Endless belongs in a unicorn-oriented diligence pipeline even though the company is young and still light on operating disclosure.

    There is also evidence of financing activity immediately before the unicorn round. NewsBTC reported a $1 million strategic investment from Foresight Ventures on February 26, 2025, describing support for AI agents and the Luffa social application. While the exact legal and cap-table relationship between that strategic check and the subsequent $110 million round is not made explicit in the public pack, the sequence suggests a tightly staged early-2025 capital formation process.

    The milestone sequence after financing is unusually compressed. Official materials say mainnet launched on March 6, 2025; the University of Surrey partnership was announced on March 20; the first-stage $1 million developer grant program was announced on April 1; and Hong Kong festival coverage followed on April 7. That pacing indicates a company trying to convert financing momentum rapidly into ecosystem formation, technical credibility, and developer acquisition.
