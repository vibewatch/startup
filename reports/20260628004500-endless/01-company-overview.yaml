company:
  name: Endless
chapter:
  number: 1
  title: Company Overview
  summary: Endless is a newly launched Web3 infrastructure company whose public identity is clear on product ambition but still incomplete on corporate basics. Official materials and corroborating press agree on a March 2025 $110 million funding round at a $1 billion valuation, a Move-based protocol stack, and a rapid sequence of post-round milestones including mainnet launch, a University of Surrey partnership, and a $1 million developer grants program. What remains less clear is the exact founder roster, headquarters, governance structure, and operating scale, so later chapters should treat funding and launch facts as ground truth while preserving the unresolved identity gaps.
sections:
- id: identity-and-positioning
  title: Identity, product scope, and current stage
  body: |
    Endless’s public materials consistently present the company as more than a single blockchain or wallet product. The homepage, vision document, and business-model documentation all frame Endless as a distributed or decentralized intelligent component protocol designed to make Web3 development easier for Web2 teams. In plain terms, the pitch is that developers should be able to build blockchain-enabled applications with modular tools, familiar software patterns, and less exposure to the underlying complexity that usually slows Web2-to-Web3 migration.

    That framing matters because it places Endless in the infrastructure layer rather than the pure application layer. The company repeatedly emphasizes a Move-based public chain, componentized development, SDKs, APIs, wallet onboarding, cross-chain operations, and AI-assisted functionality. Retrieved materials therefore support describing Endless as a Web3 development and runtime platform with protocol characteristics, not simply as a token project or consumer app.

    Public evidence also supports the view that Endless is still early in corporate maturity even if it is unusually well funded for its age. Tracxn lists Endless as a 2024-founded Series A company, while official company sources focus on the March 2025 financing, March 2025 mainnet launch, and April 2025 developer grants rather than on operating history or recurring revenue. The safest company-overview conclusion is that Endless is a very young protocol platform trying to accelerate from technical launch into ecosystem formation.
