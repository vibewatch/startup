- id: leadership-and-governance
  title: Leadership visibility, legal entity, and governance gaps
  body: |
    Leadership visibility is partial but meaningful. Official financing and partnership posts consistently identify Xiong Yu as Co-President and Amit Kumar Jaiswal as CTO, while the March 2025 funding announcement also names Ned as Chief Token Economist. Those roles point to a team that wants to be seen as academically credible at the AI-and-blockchain intersection, and the University of Surrey partnership reinforces that narrative.

    The harder question is governance depth. The Endless terms of service name Stiftung Endless as the foundation governing the public web properties, which gives at least one concrete legal anchor. The same terms, however, do not provide a public board roster, committee structure, or a clear explanation of how foundation governance interacts with protocol development, token economics, or grant decision-making.

    Third-party databases widen the uncertainty rather than closing it. Tracxn names Uriah Ferruccio and Yu Xiong as founders and lists London as the company base, while official grant materials are datelined Hong Kong and official news coverage foregrounds executives rather than a complete founder or board narrative. For diligence purposes, leadership quality may be promising, but public governance visibility is still thin and key-person concentration remains high.
