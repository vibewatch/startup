  topStrengths:
    - Corroborated $110M / $1B financing shows real investor conviction and ample early capital.
    - >-
      Product thesis around Web2-to-Web3 migration, AI-linked tooling, and componentized development is coherent across
      official materials.
    - Management moved quickly from financing into mainnet launch, grants, and partnership signaling.
  topRisks:
    - No public revenue, ARR, headcount, or enterprise customer disclosures support the headline valuation.
    - Governance, headquarters, and founder data remain partially conflicting across public sources.
    - Token, grant, and ecosystem economics may depend on subsidy-led growth before durable paid usage is proven.
  unresolvedGaps:
    - Exact headquarters, legal domicile, and board structure across Stiftung Endless and operating entities.
    - Paid usage, active developers, enterprise customers, and retention metrics.
    - Treasury composition, cash burn, and token unlock or overhang exposure.
    - >-
      Cap-table terms, preferences, and whether the headline valuation translates into attractive common-equity
      economics.
