  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: enterprise-proof-gap
    missingEvidence: Named paying enterprise API or SDK customers, contract terms, and production deployment references.
    whyItMatters: Without named enterprise customers, the B2B monetization path remains a design claim rather than verified
      commercial traction.
    diligencePath: Request top ten paying customers by product, contract type, annual spend, and deployment status.
    relatedQuestionRefs:
    - QU013
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, renewal, and cohort retention data by segment and product surface.
    whyItMatters: Durability cannot be underwritten from public evidence if repeat usage is inferred only from workflows and
      product availability.
    diligencePath: Obtain 12- and 24-month cohort tables for developers, project teams, and application users.
    relatedQuestionRefs:
    - QU014
    - QU025
    relatedTableRefs:
    - TU004
  - type: conflicting-data
    severity: material
    topic: luffa-quality
    missingEvidence: Independent analytics or marketplace reporting validating Luffa user and DAU claims.
    whyItMatters: Luffa is the strongest public adoption proof, so weak verification of its scale can distort the entire customer
      chapter.
    diligencePath: Request MAU, DAU, wallet-connects, funded users, and paid-feature usage directly from management or independent
      analytics.
    relatedQuestionRefs:
    - QU010
    - QU025
    relatedTableRefs:
    - TU003
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: A full list of independent production applications or institutional customers built on Endless.
    whyItMatters: The enumeration table is intentionally partial because the public roster is not broad enough to assess concentration
      cleanly.
    diligencePath: Request a complete ecosystem roster split between first-party, affiliated, grant-funded, and truly independent
      third-party projects.
    relatedQuestionRefs:
    - QU013
    - QU021
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Share of user activity, GMV, marketplace payments, or app engagement attributable to Luffa or any single
      application.
    whyItMatters: If one flagship app dominates visible traction, the customer story is more fragile than the broad ecosystem
      framing implies.
    diligencePath: Request product-level MAU, transaction volume, paid accounts, and concentration by application and partner.
    relatedQuestionRefs:
    - QU019
    - QU025
    relatedTableRefs:
    - TU005
