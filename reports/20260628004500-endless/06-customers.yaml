company:
  name: Endless
chapter:
  number: 6
  title: Customers
  summary: 'Endless''s public customer evidence is real but mostly ecosystem- and developer-centric rather than enterprise-heavy.
    Official docs clearly define target users, monetization paths, and multiple live product surfaces, while third-party coverage
    gives one named flagship application—Luffa—and one large institutional collaborator—the University of Surrey. The weakest
    part of the record is durability: public materials do not disclose paying-customer counts, NRR/GRR, churn, top-account
    concentration, or a deep roster of independent enterprise deployments, so the honest read is that adoption proof exists
    but remains early, uneven, and partially first-party.'
sections:
- id: customer-segments-and-buyers
  title: Customer segments, buyers, and what Endless is actually selling
  body: |-
    The public customer story starts with segmentation rather than logos. Endless's own business-model documentation explicitly names four core user groups—Web2 developers, Web3 developers, project teams, and general users—and adds a fifth economically important cohort through the application-integration guide: system integrators and enterprise buyers that want API, SDK, or chain-connectivity services. That matters because it shows Endless is not pitching a single consumer wallet or a pure infrastructure protocol. It is trying to sell tooling, components, hosted interfaces, and ecosystem access to multiple participant types that sit at different points in the adoption chain.

    The buyer, user, and payer are not always the same. For Web2 and Web3 developers, the user is the builder while the likely payer is the application team or platform operator buying SDK, API, component, storage, or traffic capacity. For project teams, the user is often a community or product operator using token, payment, and private-domain tooling; the payer is presumably the project treasury or founder team. For general users, the user is the end participant interacting with wallets, bridges, marketplaces, or social apps, but the payer may instead be the developer using sponsored-gas mechanics or the application charging through transactions and subscriptions. Enterprise-style monetization is described, but not validated: Endless says SDK and API services can be sold on pay-per-call or subscription terms, yet no public source reviewed here names a paying enterprise account using that package at production scale.

    That distinction is the core honesty test for this chapter. Endless does have a coherent customer design: it wants developers first, then applications, then users, and only later broader institutional adoption. But the public record supports the design more strongly than the conversion. There is good evidence that Endless has built onboarding surfaces for different user types and that the company is serious about developer acquisition. There is much weaker evidence that a mature enterprise customer base already exists.
