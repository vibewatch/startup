- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - primary use case
  - public scale signal
  - revenue / strategic value
  - key gap
  rows:
  - - Web2 developers
    - 'Buyer=user: external builder; payer: app team or employer'
    - Use pre-built modules, SDKs, wallet, gas abstraction, and Web2-like onboarding to launch Web3 apps
    - Official docs repeatedly target Web2 migration and familiar languages
    - Most important top-of-funnel cohort for ecosystem expansion
    - No public count of active builders or paying Web2-origin teams
  - - Web3 developers
    - 'Buyer=user: crypto-native builder; payer: project treasury or dev team'
    - Use Move-based chain, bridge, scan, SDKs, and AI components for DApp or agent development
    - Docs, GitHub repos, and grant program all target this cohort
    - Adds technical credibility and helps seed reusable modules
    - No public data on retained builders or production app count
  - - Project teams
    - 'Buyer=payer: founder or project treasury; user: operators and communities'
    - Manage tokens, payments, smart contracts, community tools, and private-domain growth
    - Business-model doc and bridge/marketplace workflows describe this path
    - Could become higher-ARPU cohort if teams subscribe for tools and infra
    - No named paying project-team customer is publicly disclosed
  - - General users
    - Buyer often indirect; user=end user; payer may be developer via sponsored gas
    - Use wallet, bridge, scan, NFTs, social and AI-enabled applications
    - Wallet, bridge, scan, and Luffa references show end-user intent
    - Necessary for network effects and app distribution
    - Public end-user counts are only visible through Luffa-related reporting
  - - System integrators / enterprise API buyers
    - Buyer=enterprise engineering or platform team; user=developers / integrators; payer=company budget
    - Add Endless blockchain support through APIs, SDKs, and managed connectivity
    - Application Integration Guide and business-model doc describe pay-per-call and subscription options
    - Best path to durable B2B revenue if conversion happens
    - No named enterprise subscriber or integrator reference is public
  notes: Segmentation separates who uses the product from who likely pays; Endless publicly defines the funnel but not the
    conversion by cohort.
