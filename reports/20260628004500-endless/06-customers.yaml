- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Developer grants and technical support
    - Grant funnel may create many experiments but few retained paying teams
    - High variance between top-of-funnel interest and durable revenue
    - Request applicant count, winner retention, and post-grant conversion to paid usage
  - - Wallet + gas abstraction + Google login
    - User onboarding may depend heavily on a small number of consumer-facing applications
    - If flagship apps stall, user-conversion proof weakens materially
    - Request wallet MAU by app, direct vs affiliated traffic, and sponsored-gas spend
  - - Bridge, scan, and multisig utilities
    - Utility usage may be transactional rather than sticky
    - Can inflate activity without proving enduring software adoption
    - Request repeat-wallet cohorts and product-level retention curves
  - - Component marketplace and API key issuance
    - Marketplace economics appear tied to Luffa-mediated login and payment flows
    - A single app-layer dependency can become a bottleneck for ecosystem monetization
    - Request payment-flow architecture and share of marketplace volume routed through Luffa
  - - Enterprise API subscriptions
    - The most valuable monetization path is described but not evidenced publicly
    - Could be material upside or still only a roadmap-like motion
    - Request named reference customers, contract term ranges, and top-account concentration
  notes: This table treats expansion as a hypothesis chain and records where public proof stops short of durability.
