  topStrengths:
    - >-
      Kodiak now offers public-company disclosure plus real 2026 revenue, a rarity among independent autonomous trucking
      peers.
    - >-
      Asset-light customer-owned deployment model can reduce capital intensity relative to vertically integrated fleet
      ownership.
    - >-
      Atlas-led commercial expansion and 35 deployed customer-owned driverless trucks provide more operating proof than
      most private AV trucking companies.
    - >-
      Platform scope spans trucking, industrial hauling, and defense logistics, creating multiple demand vectors for the
      same core autonomy stack.
    - Founder-market fit is strong, with Don Burnette bringing Google, Otto, and Uber autonomous trucking experience.
  topRisks:
    - >-
      Revenue and customer concentration risk appears high, with public commercial evidence clustered around a small set
      of flagship programs.
    - The May 2026 discounted PIPE signaled fragile capital-market support even after the public listing.
    - >-
      Autonomous trucking remains exposed to safety, regulatory, and public-perception shocks that can quickly compress
      valuation.
    - >-
      Better-capitalized rivals, especially Aurora and Daimler-backed Torc, may lock up important corridors, carriers,
      and OEM relationships first.
    - >-
      Unit economics remain under-disclosed; public revenue growth has not yet been matched with a transparent margin or
      payback profile.
  unresolvedGaps:
    - Exact revenue concentration by customer, especially Atlas, is not publicly disclosed.
    - >-
      Gross margin, contribution margin, and per-mile economics remain too opaque for a high-conviction underwriting
      case.
    - >-
      Post-close dilution, warrant overhang, and long-run capital requirements need fuller modeling from SEC filings and
      future earnings.
    - >-
      Customer contract duration, take-or-pay obligations, and renewal behavior are not sufficiently visible in public
      materials.
    - >-
      Defense and industrial programs broaden the narrative, but their revenue scale and persistence versus freight are
      still unclear.
