  topStrengths:
    - Kodiak 现在同时有上市公司披露和真实 2026 年收入，在独立自动驾驶卡车同行中很罕见。
    - 客户自有部署的轻资产模式，相比垂直整合自有车队，可以降低资本强度。
    - Atlas 主导的商业扩张和 35 辆已部署的客户自有无人驾驶卡车，比多数私有 AV 卡车公司给出更多运营证明。
    - 平台覆盖卡车运输、工业运输和国防物流，为同一套核心自动驾驶栈创造多条需求线。
    - 创始人与市场匹配度强，Don Burnette 带来 Google、Otto 和 Uber 的自动驾驶卡车经验。
  topRisks:
    - 收入和客户集中度风险看起来偏高，公开商业证据集中在少数旗舰项目。
    - 2026 年 5 月折价 PIPE 显示，即便上市之后，资本市场支持仍然脆弱。
    - 自动驾驶卡车仍暴露在安全、监管和公众感知冲击之下，估值可能很快被压缩。
    - 资本更厚的对手，尤其是 Aurora 和 Daimler 支持的 Torc，可能先锁住重要走廊、承运商和 OEM 关系。
    - 单位经济性披露不足；公开收入增长还没有配上透明的利润率或回本画像。
  unresolvedGaps:
    - 按客户划分的精确收入集中度，尤其是 Atlas，尚未公开披露。
    - 毛利率、贡献利润率和每英里经济性仍过于不透明，难以支撑高确信承保。
    - 交割后稀释、认股权证悬挂和长期资本需求，需要结合 SEC 文件和未来财报做更完整建模。
    - 客户合同期限、take-or-pay 义务和续约行为，在公开材料中还不够可见。
    - 国防和工业项目拓宽了叙事，但相对货运，它们的收入规模和持续性仍不清楚。
