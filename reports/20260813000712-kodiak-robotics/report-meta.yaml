companyProfile:
  summary: Kodiak Robotics, now publicly branded as Kodiak AI, was founded in 2018 in Mountain View by Don Burnette and Paz Eshel to build highway-first autonomous trucking technology. Its core product, the Kodiak Driver, is positioned as a vehicle-agnostic autonomy platform sold through asset-light customer-owned deployments rather than fleet ownership. After early venture rounds, Kodiak announced a business combination with Ares Acquisition Corporation II in 2025 at an approximately $2.5B pre-money value and entered 2026 as a public company reporting revenue, customer-owned driverless fleet growth, and commercial expansion led by Atlas.
  foundedDate: '2018-04-01'
  founders:
    - name: Don Burnette
      role: Founder / CEO
      background: Former engineer on Google's self-driving project; co-founder of Otto; later part of Uber's autonomous trucking effort before starting Kodiak.
      claimRefs: [CO009, CO010]
    - name: Paz Eshel
      role: Co-founder
      background: Identified in early Kodiak founding coverage and Series A materials as co-founder; brought venture and company-building experience to formation.
      claimRefs: [CO011, CO012]
  foundingLocation: Mountain View, California, USA
  headquarters: Mountain View, California
  productSummary: Kodiak Driver autonomy platform combining AI software, modular hardware SensorPods, and offboard services for Class 8 trucking, industrial hauling, and public-sector defense applications.
  customerFocus: Freight carriers, industrial logistics operators, and government/defense programs that can deploy customer-owned autonomous vehicles on defined routes or repetitive haul cycles.
  businessModel: Asset-light autonomy licensing and service model built around recurring per-truck or per-mile fees, with customers owning and operating the vehicles.
  stage: 'Public (Nasdaq: KDK)'
  fundingStatus: Early financing included a $40M Series A in 2018 and a $125M Series B in 2021. In April 2025 Kodiak announced a de-SPAC transaction with Ares Acquisition Corporation II at approximately $2.5B pre-money; the September 2025 closing update cited more than $275M raised despite redemptions, followed by a discounted $100M PIPE in May 2026.
  disclosureProfile: public
  claimRefs: [CO001, CO002, CO003, CO006, CO018, CO019, CO020, CO022, CO026]
