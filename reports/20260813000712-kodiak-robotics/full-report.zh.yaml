      - number: '5.6'
        title: 证据展项
        blocks:
          - type: callout
            title: 自研三层栈：Kodiak Driver + Kodiak Driver + Kodiak Dispatcher
            body: >
              Kodiak 选择自研 Kodiak Driver、Kodiak Driver 和 Kodiak Dispatcher，而不是依赖开源 ROS
              或商业中间件；这形成了一个垂直集成栈，让公司能完整看见实时确定性、安全属性和 OTA
              更新安全。这种架构控制相对于使用通用中间件的竞争者，是有意义的技术护城河；但它也把工程风险集中在内部，并限制了外部生态工具的可用性。
            calloutType: insight
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE019
          - type: callout
            title: 技术成熟度缺口：商业化发布时间线尚未确认
            body: >
              截至 2026 年 Q1，Kodiak 尚未公开披露商业无人驾驶发布时间线，尚未发布安全论证或自愿安全自评，也尚未提交无人驾驶运营所需的 FMCSA 豁免文件。最领先的竞争对手 Aurora Innovation
              从成立到商业无人驾驶发布用了四年以上。Kodiak 距 2022 年成立约 3.5 年，却没有宣布公开商业化门槛里程碑。这个缺口是投资者面对的主要技术阶段风险。
            calloutType: insight
            claimRefs:
              - CE028
              - CE029
              - CE031
              - CE034
          - type: callout
            title: Aurora 2025 年 4 月商业化发布是行业标尺
            body: >
              Aurora Innovation 2025 年 4 月 28 日商业无人驾驶卡车首秀，是美国历史上第一次商业 Class 8 无人驾驶卡车运营，为 Kodiak 必须达成的目标设下了具体标尺。Aurora
              的路径包括一份 400,000 英里自动驾驶安全论证、FMCSA 豁免文件、Texas 专项许可，以及承运商和保险伙伴承诺。Kodiak 的投资者和管理团队应参照 Aurora
              已记录的监管和运营门槛，建模自身商业化关键路径。
            calloutType: insight
