  - id: TI001
    title: 收入来源表
    description: >
      Maps each revenue stream available to Kodiak with its mechanism, unit, current status, quality of evidence, and
      key diligence asks as of mid-2026.
    columns:
      - 收入来源
      - 机制 / 单位
      - 当前状态
      - 证据质量
      - 尽调追问
    rows:
      - - DaaS 按英里收费（核心）
        - Level 4 系统让卡车在商业线路上无人驾驶运行时，按每个自动驾驶英里向车队承运商收费
        - 商业化前；未披露合同或定价
        - 中 — CEO 确认按英里模式（FreightWaves Q&A，2023 年 9 月）；未披露定价或合同
        - 确认目标每英里收费；取得任何 LOI 或试点框架协议；对照 Aurora 基准核验定价
      - - 安全服务监控费（早期阶段）
        - 商业化爬坡期，在有监督自动驾驶中覆盖人工远程监控和兜底监督，可按英里或按行程收费
        - 推测；纯自动驾驶卡车公司尚无证据披露这种收费结构
        - 低 — 从早期商业运营要求推断；尚无公司公开把它披露为独立收入线
        - 询问 Kodiak，有监督自动驾驶阶段是否包含单独安全费，或已打包进基础 DaaS 价格
      - - 数据授权（长期）
        - 将专有运营数据（传感器、安全事件、线路表现）授权给 OEM、保险公司、高精地图提供商和政府研究项目
        - 推测；截至 2026 年中，自动驾驶卡车行业没有披露可比案例
        - 低 — 未来收入来源合理，但没有牵引证据；Aurora 10-K 未披露数据授权收入
        - 索取与 OEM 或保险合作伙伴围绕运营数据价值签署的任何 MOU 或讨论记录；评估数据排他条款
      - - 平台订阅费（长期）
        - 与 AV 技术栈打包，为车队集成、调度 API、车联网和司机转岗项目服务按每车每月收取固定费用
        - 推测；需要商业车队规模和承运商集成深度，当前尚未证明
        - 很低 — 邻近领域的 ELD/TMS 平台参考价格为每车每月 $25–$50；尚无 AV 平台披露这条收入线
        - 确认 Kodiak 路线图是否包含平台 SaaS 层；评估承运商是否愿意在 DaaS 按英里费用之外继续付费
    claimRefs:
