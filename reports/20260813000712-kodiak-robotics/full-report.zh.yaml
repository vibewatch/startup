      - number: '2.2'
        title: 市场规模测算：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              自动驾驶卡车的市场规模需要从多个角度交叉校准，因为没有单一权威公开估计能精确界定可服务可寻址市场。总可用市场（TAM）最适合用 American Trucking Associations 2024
              年数据锚定：美国卡车运输总收入 $906 billion。如果自动驾驶系统完全替代全部卡车运营，这是理论天花板；短期并不现实，但可作为 TAM 锚点。

              具体到自动驾驶卡车市场——技术驱动的 AV 平台收入、硬件和服务——Mordor Intelligence 估计 2026 年全球规模为 $42.6 billion，到 2031 年增至 $74.2
              billion，CAGR 为 11.73%。North America 约占全球市场份额 37.5%，也就是 2026 年约 $16 billion 的 AV 卡车价值。Level 4 系统是增速最快的细分，估计
              CAGR 为 15.21%，与 Kodiak 的技术目标一致。

              枢纽到枢纽 AV 卡车的自下而上 SAM 估计，来自美国卡车运输收入中长途部分（约 $317 billion），再按短期监管、路线成熟度和车队电动化约束打折。10 年期美国全部可寻址市场里，合理 SAM 估计落在
              $100–200 billion 区间。像 Kodiak 这样的商业化前初创公司在 2025–2030 年的可获取市场（SOM）没有公开量化，但 Aurora Innovation 在特定 Texas
              走廊商业发布说明，最初能打穿的 SOM 以数百条卡车路线和数十亿美元计，而不是数百亿美元。

              司机人工成本是另一种测算视角：美国年度司机工资为 $128 billion，即便 10 年内只有 20% 被自动驾驶替代，也对应每年 $25 billion 的经济价值处在争夺中。
