      - number: '4.5'
        title: 资本充足性与现金跑道评估
        blocks:
          - type: paragraph
            body: >
              Kodiak 的资本充足性无法精确判断：实际现金余额和月度烧钱速度都未公开。按已披露财务信息，2024 年 8 月的 $150 million Series B，加上种子轮和 Series A 估计 $111
              million，累计融资 $261 million。扣除 2023 年 9 月至 2026 年中估计消耗的 $30–$60 million 现金后，剩余流动性估计为 $200–$231
              million。若月烧钱速度估计为 $3–$6 million，从 2026 年中算起意味着 33–77 个月现金跑道；但这个区间不可靠，因为没有计入 SoftBank
              未宣布的分期出资，也没有计入任何商业收入贡献。更关键的情景是假设 Kodiak 必须在 2026–2027 年融资 Series
              C，支撑商业化发布阶段；历史上，这一阶段需要的资本显著高于商业化前阶段。Aurora 2024 年 8 月融资 $466 million，FY2025 又融资 $874
              million，以维持商业化爬坡；Kodiak 的商业化发布同样需要追加投入，用于购置或租赁卡车、安全监控基础设施、客户上线和外场运营扩张。

              RAND Corporation 的 AV 政策研究指出，自动驾驶汽车部署收益的兑现时间可能比乐观预测更长——投资者应把这一风险放进 Kodiak 的商业化时间表里权衡。SoftBank 据报道承诺超过 $1
              billion；如果这笔资金按技术或商业里程碑分期投放，它既是资本兜底，也可能约束部署节奏。若基于里程碑的分期资金不能按 Kodiak 所需时间到账，Series C
              融资就会成为关键依赖，并且可能需要从新投资者处取得。未来融资、商业收入时间线和备考模型均未公开，这意味着资本充足性判断完全建立在估算以及 Aurora 公开文件的类比之上。
