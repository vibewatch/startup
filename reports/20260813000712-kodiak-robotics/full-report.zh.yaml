      - number: '5.2'
        title: 技术架构与运营模式
        blocks:
          - type: paragraph
            body: >
              Kodiak 的技术栈围绕三层自研软件组织：它们位于硬件平台之上、运营支持工具链之下。Kodiak Driver
              是专为自动驾驶车辆打造的操作系统，为传感器处理、感知、预测和运动规划提供实时执行环境。不同于通用操作系统，Kodiak Driver 面向安全关键 AV 应用的严格延迟、确定性和功能安全要求而设计。[CE002]
              [CE003]

              Kodiak Driver 是中间件层，负责 Kodiak Driver 各模块之间对时序敏感的编排。确定性中间件对自动驾驶系统架构至关重要：如果感知模块晚 50
              毫秒交付检测更新，规划模块就可能基于过期的世界状态生成轨迹——这种故障模式会级联到安全关键的车辆执行。Kodiak Driver 通过确定性任务调度、模块间消息代理和时序看门狗来处理这一问题。[CE004]
              [CE014]

              Kodiak Dispatcher 负责车队级软件分发和 OTA 更新，让 Kodiak 无需逐车手工干预，就能向整个测试车队推送感知模型更新、规划算法变更和安全补丁。这是把开发阶段 AV 与商业阶段 AV
              区分开的关键扩展基础设施之一：ML 栈持续改进需要一个安全、可靠、可审计的更新交付系统。[CE005] [CE037]

              传感器套件由多模态输入组成：远距 LiDAR 负责生成 3D 点云和测距，多通道雷达负责速度估计和恶劣天气鲁棒性，多光谱摄像头负责车道线和交通信号检测，GNSS/IMU 负责绝对定位。这些输入进入 Kodiak
              Driver 的感知模块，由其进行传感器融合并生成统一的世界模型。高性能边缘计算硬件——与 NVIDIA DRIVE AGX 或同等级车规 GPU 平台一致——加速感知和预测所需的神经网络推理。[CE007]
              [CE008] [CE009] [CE013]

              这个架构体现了研究文献中被广泛记录的端到端 AV 栈范式：原始传感器输入被处理成世界模型，世界模型进入动态目标轨迹预测，预测结果再进入运动规划器生成车辆轨迹，最后通过卡车底盘 CAN
              总线接口交由低层车辆控制器执行。Baidu 的 Apollo 开源平台和 Torc Robotics 的 SEE-THINK-ACT 框架，都是这种路径的公开参考架构。[CE010] [CE011]
              [CE015]
