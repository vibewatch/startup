  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品边界与商业模式
        blocks:
          - type: paragraph
            body: >-
              Kodiak Robotics 于 2018 年 4 月在 California 的 Mountain View 创立，现在公开定位为 Kodiak AI，一家在 Nasdaq 上市、提供 AI
              驱动自动驾驶地面运输技术的公司。核心产品 Kodiak Driver 是一套虚拟驾驶员，把 AI
              软件、模块化硬件和车外服务组合成车辆无关的自动驾驶平台。官方材料把业务定义为资产轻自动驾驶模式：客户保留卡车所有权，Kodiak
              通过每车或每英里的经常性费用以及配套运营支持变现。这个差异重要，因为相比垂直一体化持有车队，它可能提升资本效率。

              到 2026 年，Kodiak 的身份已不只是高速公路卡车公司。投资者材料和产品页面描述的是一套自动驾驶技术栈，正在适配长途卡车、工业运输和公共部门防务项目。公司强调可维护性、模块化硬件和 360
              度传感器覆盖，以此作为跨领域扩张的基础。上行空间在于，故事从单一货运车道变成更大的平台；代价是每进入一个新垂直，都要增加集成、支持和监管复杂度。
