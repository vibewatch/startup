        - 很低 — 第一性原理模型；没有公开 AV 公司披露成熟期单位经济模型
        - 决定长期毛利潜力；必须优于司机成本平价，投资逻辑才站得住
        - 基于 Aurora 规模化成本结构建模；用公开云计算成本基准三角校验
