  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Kodiak 面对一组分层且尚未解决的监管和法律风险，这是商业化的主要障碍。最关键的监管缺口是缺少联邦 FMCSA 无人驾驶豁免：49 CFR §383.3 要求所有商用机动车（CMV）运营必须配备 CDL
              持有人，而 FMCSA 尚未发布最终规则，允许完全自动驾驶的无人 CMV 在美国公共道路上运营。没有这项豁免，Kodiak 无论技术是否成熟，都不能商业运营无人驾驶卡车。[CR002]

              NHTSA 关于碰撞报告的常设通用命令（第三次修订于 2025 年 6 月生效）对所有 ADS 运营商施加强制碰撞报告义务，罚款最高为每次违规每天 $27,874（相关系列上限 $139M）。任何涉及
              Kodiak ADS、且发生在事故前后 30 秒内的碰撞都会触发公开报告，在每次事故上制造声誉和监管暴露。[CR001]

              州级层面，Kodiak 目标走廊横跨 TX、PA、CA 和 AZ；四个州的 AV 测试和运营规则差异显著，带来合规开销，并限制近期哪些走廊可以无人驾驶运营。Texas Transportation Code
              §545 允许 AV 无驾驶员运营，但 FMCSA 的联邦叠加监管让商业化更复杂。California Vehicle Code §38750 要求商业无人驾驶部署另行取得 DMV 制造商批准。NCSL AV
              Legislation Database 跟踪 50 多个州不断演进的 AV 法律，记录了这种拼图式风险。[CR003] [CR004] [CR005] [CR039]

              产品责任暴露尚无定论：没有联邦法律最终规定 ADS 碰撞责任应归 ADS 开发商、OEM 还是承运商。若发生碰撞，Kodiak 会在缺少确定联邦标准的情况下面对灾难性侵权暴露；其 49 USC §30120
              召回补救义务也会适用于任何有缺陷的 ADS 组件。[CR010] [CR011] [CR012]

              IP 风险具有实质性。Argo AI 专利（CTO Brett Browning 被列为发明人）已转让给 Argo AI LLC；通过创始团队从 Argo AI 到 Kodiak 的 IP
              链条需要独立法律核验。Aurora Innovation 和 Waymo 持有覆盖轨迹预测、地图和传感器融合系统的大量 AV 专利组合，与 Kodiak 的技术路径存在重叠。[CR006] [CR007]

              EPA 的 Clean Trucks Plan 对 2027+ 车型年的重型卡车平台施加 NOx 和 GHG 标准；Kodiak 的 OEM 卡车采购必须合规，否则会面对不合规车队风险。FTC
              Safeguards Rule 下的数据隐私暴露也可能适用于 Kodiak 对地理空间、货运路线和操作员数据的收集。[CR008] [CR009] [CR041]
