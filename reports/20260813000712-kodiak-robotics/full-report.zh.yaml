  - id: TM001
    title: 市场定义表
    description: Defines included and excluded spend, buyers, and relevance for Kodiak's addressable market.
    columns:
      - 市场细分
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Kodiak 相关性
    rows:
      - - 美国长途卡车运输（>250-mile 路线）
        - $906B 卡车运输总 TAM (2024)；估计长途细分 $300–360B
        - 本地 / 区域配送、LTL 城市集拼、专业货物（hazmat、flatbed）
        - 资产型 TL 承运人、车主兼司机、签约运力的大型货主
        - 核心 TAM；枢纽到枢纽州际路线是 Level 4 AV 的主要部署目标
      - - 自动驾驶卡车平台（SaaS / RaaS 收入）
        - 技术授权费、按英里计费的自动驾驶服务费、安全系统订阅
        - 卡车硬件采购价、司机工资、非 AV 里程燃料成本
        - 授权 AV 系统的承运人；货主通过承运人转嫁定价支付
        - Kodiak 的直接收入模型；SAM 受可部署、符合 ODD 的路线约束
      - - 自动驾驶卡车传感器 / 硬件（估计 $50K/vehicle）
        - LiDAR、摄像头、雷达、计算、执行器等单车物料清单
        - 不计入 AV 软件 TAM；构成 COGS 和单车资本支出的一部分
        - 从 tier-1 OEM 供应商采购传感器套件的 AV 技术公司
        - 按 2025 价格，每车约 $50K 的成本限制车队部署速度和单位经济性
      - - 车队管理 / TMS（相邻）
        - 路线优化、配载规划、合规工具、ELD 集成
        - 不属于 AV 平台支出；相邻 SaaS 垂直
        - 承运人、3PL、货运经纪管理运输运营
        - 集成界面：AV 平台必须接入现有 TMS / 调度工作流才能规模化
      - - 司机劳动力市场（可释放价值）
        - 估计美国司机劳动力年成本 ~$128B（2.235M 名司机 × $57,440 中位工资）
        - AV 平台无法直接获取；代表自动化释放的经济价值
        - 承运人作为司机劳动力的雇主付款方；司机是被替代劳动力
        - 承运人采用自动驾驶卡车的长期 ROI 论证主要来源
