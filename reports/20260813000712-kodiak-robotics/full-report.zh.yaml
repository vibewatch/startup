  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: |
      从承运商认知到车队扩张的五阶段客户旅程，映射 Kodiak 要达到商业收入必须跑通的获客与留存路径。
    data:
      items:
        - label: 承运商认知
          detail: |
            货运承运商借助 OEM 合作伙伴介绍、行业会议，或对 Aurora 商业化项目的竞争情报，识别 AV 卡车试点机会。关键触发点：司机短缺痛点达到决策者阈值。
        - label: LOI / 试点协议
          detail: |
            承运商针对特定枢纽到枢纽走廊签署意向书或试点协议。需要走廊所在州监管放行、保险协议，以及 CDL-A 运营专员人员配置方案。Kodiak 尚未达到这一阶段。
        - label: 监督测试
          detail: |
            CDL-A 运营专员在指定走廊监控 AV 系统。收集安全事件数据；承运商运营团队接受 Mission Control 界面培训。截至 2026 年 Q2，Kodiak 在五条走廊处于这一阶段。
        - label: 商业无人驾驶上线
          detail: |
            监管放行和安全里程碑签字后，承运商在获批走廊启动商业无人驾驶货运。Aurora 于 2025 年 4 月达到这一阶段。Kodiak 尚未公布无人驾驶上线日期。
        - label: 车队扩张
          detail: |
            承运商把自动驾驶单元扩展到更多走廊；3PL 订舱中介把 AV 运力接入货源匹配平台。扩张受 OEM 卡车供应、更多州监管放行和每英里经济性约束。
    claimRefs:
      - CU001
      - CU004
      - CU006
      - CU007
      - CU027
      - CU036
