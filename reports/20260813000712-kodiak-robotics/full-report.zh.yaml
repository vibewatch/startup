      - number: '5.5'
        title: 路线图、部署与技术成熟度
        blocks:
          - type: paragraph
            body: >
              Argo AI 2022 年 10 月关停后，Kodiak 又开发了约一年，并于 2023 年 9 月走出隐身状态。创始团队在首次公开声明中披露了 Kodiak Driver、Kodiak Driver 和
              Kodiak Dispatcher 三大自研技术支柱，并报告 SoftBank Vision Fund 2 为初始投资方。据报道，$150M Series B 于 2024 年 8
              月宣布，但截至撰写时，未能访问到确认条款的一手来源（新闻稿或 SEC 文件）。[CE016] [CE031]

              截至 2025 年中，Denver（CO）、Atlanta（GA）、Phoenix（AZ）、Dallas（TX）和 Miami（FL）的 CDL-A 运营专员职位发布，以及 Pittsburgh 和 New
              Stanton（PA）的岗位，佐证了跨州主动测试运营。招聘页还列出
              合约分诊分析师岗位，负责审核真实道路驾驶和仿真中的自动驾驶事件，按问题类型和优先级进行标注，并汇总性能报告。这暴露出一套结构化、数据驱动的测试闭环，是成熟 AV 开发项目的典型特征。[CE022] [CE032]

              Kodiak 的夜间车队监控与支持专员（3rd shift）岗位确认 Mission Control 运营已经启动。夜间自动驾驶运营期间的远程监督，是无人驾驶商业运营模式的前置能力。[CE033]

              Aurora 2025 年 4 月在 Texas 的 Fort Worth-to-Dallas 和 Fort Worth-to-Houston 走廊上完成商业无人驾驶发布，证明 FMCSA 豁免、州级 AV
              法律（Texas 对 AV 友好）、承运商保险框架和安全论证发布共同构成商业无人驾驶运营的关键路径。Kodiak 在自身发布前也必须走完同一路径。[CE034]

              截至 2026 年 Q1，Kodiak 尚未公开披露商业发布时间线，整体技术成熟度仍处于开发和早期测试阶段。可能延迟商业化的关键技术风险包括：恶劣天气（雨、雪、雾、眩光）下的感知系统鲁棒性、LiDAR
              硬件供应链集中、单车传感器和计算成本高（估计每辆约 ~$50K）、OEM
              集成复杂度，以及监管批准时间不可预测。数据飞轮——采集、标注、训练、验证、部署——必须在车队规模上跑起来，才能针对具体边缘案例提出安全论证。[CE038] [CE040] [CE012]
