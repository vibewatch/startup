  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >
              Kodiak 的产品是一套面向 Class 8
              长途货运卡车的自动驾驶系统，设计目标是在起点和终点物流货站之间的固定高速公路走廊上替代人类驾驶员。公司专注枢纽到枢纽场景，是因为州际高速驾驶相比城市环境，车道几何形态更可预测，行人交互更少，边缘案例密度更低——在今天的传感器和计算技术下，这些条件让
              SAE Level 4 自动驾驶更容易落地。[CE001] [CE006]

              在客户工作流里，承运商或托运人在起点货站把一票货分配给装有 Kodiak 系统的卡车。运营专员——持 CDL-A 的安全驾驶员——完成出车前检查并监督发车。车辆上高速后，Kodiak Driver
              负责整个高速路段的自动驾驶运行。Mission Control 提供实时远程监控。到达终点货站后，运营专员监督到站和收车后流程。[CE022] [CE033]

              这个枢纽到枢纽模型直接瞄准长途卡车运输最大的两类结构性痛点：司机短缺（ATA 预测估计缺口为 60,000，到 2030 年可能达到 160,000）以及服务小时限制（人类驾驶员每班最多 11
              小时）。在限定运行设计域（ODD）内运行的自动驾驶系统原则上可以连续跑 24 小时，从而大幅提升资产利用率。[CE035] [CE006]

              截至 2026 年 Q1，Kodiak 至少在五条州际走廊进行有运营专员随车的高速公路主动测试；活跃的 CDL-A 职位发布佐证了
              Denver-to-Atlanta（CO/GA）、Phoenix（AZ）、Dallas（TX）和 Miami（FL）路线。公司尚未公布无人驾驶商业化发布时间线。[CE022] [CE031]
            claimRefs:
              - CE001
              - CE006
              - CE022
              - CE031
              - CE033
