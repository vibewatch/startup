          PitchBook 融资数据；FreightWaves 与 Don Burnette 的问答确认由 Sequoia 领投的 $81M Series A （2024 年 1 月）以及由 SoftBank VF2 领投的约
          $150M Series B（2024 年 8 月）。
        - SoftBank 未领投或参与 Series C，释放信心丧失信号。
