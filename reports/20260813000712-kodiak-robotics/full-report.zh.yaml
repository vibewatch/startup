      - number: '2.5'
        title: 竞争格局与市场动态
        blocks:
          - type: paragraph
            body: >
              自动驾驶长途卡车竞争格局集中在少数资本充足的玩家手里。按商业部署进度看，Aurora Innovation（NASDAQ: AUR）是最领先的竞争者，已于 2025 年 5 月在 Dallas–Houston
              走廊启动无人驾驶货运运营，承运商合作伙伴包括 Werner Enterprises、Hirschbach Motor Lines 和 Volvo Autonomous Solutions。Aurora 截至
              2025 年初约 $4.6 billion 的市值，说明机构投资者仍在投入该板块，也给 Kodiak 这类进入者带来更高竞争压力。

              Daimler Truck 收购的 Torc Robotics 作为 OEM 集成型自动驾驶卡车系统运营，专注枢纽到枢纽高速公路自动化，并持续在美国州际公路进行公共道路测试。Kodiak Robotics
              专注长途自动驾驶卡车，采用与 Kodiak 类似的枢纽到枢纽运营模式；Plus AI（Plus）则走有监督自动化路线，以技术授权模式面向 Class 8 卡车。Waymo 的开放数据集体现了与高速公路 AV
              相关的传感器感知成熟度，不过 Waymo 通过 Waymo One 服务主要聚焦 robotaxi，而非长途卡车。竞争差异最终会落在安全记录、路线覆盖、OEM
              伙伴和每自动驾驶英里成本上；这些指标需要多年商业运营才能验证。

              UNCTAD 自动驾驶汽车准备度指数把美国列为最适合 AV 商业化的国家之一，驱动因素是公共基础设施质量和技术投资。Congressional Research Service 分析指出，联邦是否优先于州级 AV
              监管仍未解决，给寻求全国规模化的运营商持续制造合规复杂度。
