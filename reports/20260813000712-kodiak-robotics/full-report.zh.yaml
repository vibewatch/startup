      - number: '6.3'
        title: 具名客户证据
        blocks:
          - type: paragraph
            body: >
              截至 2026 年中，Kodiak 已经有一些自己的具名客户证据，但公开记录仍集中在少数旗舰关系上，而不是广泛的承运商名单。Aurora
              的商业项目仍是判断规模化自动驾驶卡车客户关系形态的最佳行业标尺，因此同行证据仍可用于框定 Kodiak 可能的买方、线路和渠道结构。Aurora 的投资者关系披露和货运页面列出的伙伴包括 Werner
              Enterprises、FedEx、Hirschbach Motor Lines、Schneider National、Uber Freight、Ryder、PACCAR、Toyota、Volvo Trucks
              和 Volvo Autonomous Solutions。[CU017]

              Werner Enterprises 是美国前十整车承运商，也是知名度最高的生产参考客户。Werner 的 CDO Rhonda Robb 公开背书该项目；该承运商将与 Aurora 的试点项目扩大三倍，扩展到
              Fort Worth–Phoenix 走廊——这是行业内最强的具名客户背书。Uber Freight 在 Dallas–Houston 无人驾驶线路上担任订舱中介，是主要 3PL
              第一次商业化经纪自动货运。Hirschbach 的副总裁 Rachel Carr 提供了具名推荐，提到司机生活质量收益。Aurora IR 材料把 FedEx 同时列为投资者和伙伴。[CU018] [CU019]
              [CU020] [CU022]

              Kodiak 尚未拥有同样广泛且经独立佐证的公开客户名单。公开记录指向的是一组更小的旗舰关系——最明显的是 Atlas 以及部分货运、工业和公共部门项目——而不是 Aurora
              如今描述的多承运商网络。因此，尽调应追查任何未披露的 LOI、承运商推荐、续约行为，以及可能藏在头部合作关系背后的 照付不议或最低量承诺。[CU021] [CU023] [CU024]
