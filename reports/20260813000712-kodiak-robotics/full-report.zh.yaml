  - id: FE001
    slug: product-architecture-map
    title: 产品架构图 — Kodiak
    type: stack
    summary: |
      从物理感知到实时 OS、中间件、AI 管线、车队管理和运营支持的六层自动驾驶卡车技术栈。
    approximationNotes: |
      架构层由公司公开披露（kodiak.ai、招聘页面）和 AV 行业常规推断。Kodiak 未发布正式架构图。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
      - CE015
    data:
      layers:
        - id: l1
          label: 传感器套件
          detail: 物理感知层，为 Kodiak Driver 提供多模态环境感知输入
          modules:
            - 长距 LiDAR（3D 点云、目标测距）
            - 多通道 Radar（速度、恶劣天气鲁棒性）
            - 多光谱摄像头（车道标线、交通信号、目标分类）
            - GNSS / IMU（绝对定位、航位推算）
        - id: l2
          label: 边缘计算平台
          detail: 车规级 GPU 计算硬件，在 AV 延迟要求下执行神经网络推理
          modules:
            - 车规级 GPU（NVIDIA DRIVE AGX 级或同等）
            - 硬件安全模块（OTA 完整性）
            - 自定义 BSP / 认证驱动
        - id: l3
          label: Kodiak Driver — 自动驾驶车辆操作系统
          detail: 专用实时 AV OS，提供确定性执行、安全分区和传感器管线
          modules:
            - 实时任务调度器
            - 传感器输入处理管线
            - 内存隔离与安全分区
            - 功能安全接口层
        - id: l4
          label: Kodiak Driver — 确定性中间件
          detail: 对时序敏感的模块间编排，确保 AV 模块通信同步且延迟有界
          modules:
            - 模块间时序编排
            - 消息代理（发布-订阅）
            - 时序看门狗与截止时间执行
        - id: l5
