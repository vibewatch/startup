      - number: '1.4'
        title: 里程碑、部署与运营规模
        blocks:
          - type: paragraph
            body: >-
              Kodiak 2025–2026 年的里程碑显示，公司正在从展示性部署转向可重复运营。2026 年 Q1，公司报告拥有 28 辆客户自有无人驾驶车辆，累计付费无人驾驶时长超过 23,500 小时，累计交付货物超过
              15,600 车次。到 2026 年 Q2，这些数字升至 35 辆车、累计付费无人驾驶时长超过 40,000 小时、累计载货超过 20,000 车次，并在该季度运输超过 300,000 吨货物。收入也从 Q1 的
              $1.8 million 增至 Q2 的 $3.5 million。

              运营故事不只局限于 Atlas 在 Permian 的部署。Kodiak 与 Roehl Transport 推出自动驾驶货运服务，将示范从 Sunbelt 扩展到 Ohio 和 Indiana，宣布与 West
              Fraser 在 Alberta 开展首个国际木材运输试点，并继续搭建与 Bosch、NVIDIA、Verizon 和 Pilot Company 的赋能关系。防务也成为真正的第二曲线：Kodiak 2023
              年发布军用原型，2026 年获得美国 Marine Corps ROGUE-Fires 合同，并与 General Dynamics Land Systems 建立战略合作，以争取 Army
              机会。剩下的考验是，这些里程碑能否足够快地复合成可持续收入，从而降低融资依赖。
