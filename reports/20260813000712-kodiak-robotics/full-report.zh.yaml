              - CE028
              - CE034
          - type: callout
            title: 计算平台和传感器供应商是推断项，尚未确认
            body: >
              本章提到 NVIDIA DRIVE 级计算硬件和 Luminar 级 LiDAR，依据的是 Level 4 AV 系统行业惯例和供应商市场背景推断。Kodiak
              尚未披露计算平台供应商、传感器供应商或物料清单配置。尽调应具体确认硬件合作关系、单车传感器成本和供应集中风险。
