      - number: '8.4'
        title: 展项
        blocks:
          - type: callout
            title: 观察建议：FMCSA 豁免锚定的期权价值
            body: >
              Kodiak 的投资逻辑是单一催化剂驱动的二元期权：FMCSA 无人驾驶豁免打开商业化；没有豁免，业务在法律上无法规模化运营。 Aurora April 2025 的商业上线和 McLane 交易，验证了企业级
              AV 卡车买家存在，且愿意为无人驾驶服务付费。Kodiak 的 Argo AI 背景和 Tier-1 VC 背书提供技术与资本可信度。不过，在没有 FMCSA 申请、首个客户或经审计财务的公开证据前， 当前
              $500M–$1B 的隐含估值无法独立证实。建议姿态是积极跟踪，并设定明确尽调清单：确认 FMCSA 申报、首份已签 LOI、 财务报表。若这些事项在 mid-2027 前正向解决，$1.5B–$3B
              的基准情景估值区间支持开始建仓。[CV001] [CV002] [CV005] [CV028]
            calloutType: insight
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV028
          - type: callout
            title: TuSimple 先例：Series B 估值要求无人驾驶证明
            body: >
              TuSimple 的轨迹——April 2021 $1.1B IPO、$8.5B 峰值、January 2024 以 $0.30/share 自愿退市——是最清晰的数据点： 一家 AV
              卡车公司如果无法把资本转成商业运营，会发生什么。Kodiak 在 Series B 阶段与 TuSimple 有三个结构性相似点： 收入前、无人驾驶前、深度依赖监管。差异在于 Kodiak 继承了 Argo AI
              更强 IP，并获得 Sequoia 和 SoftBank 下注， 而不是 TuSimple 那类企业合作伙伴。即便如此，TuSimple 的失败仍抬高了 AV 卡车商业化前投资应使用的折现率，也要求资本投入前
              设置更高尽调门槛。Goldman Sachs 对 Aurora 维持 $5 Hold 目标价（较 May 2026 价格下行 35%），说明在大型卖方机构眼中， 即便是已商业化上线的 AV
              卡车龙头，也有显著执行风险。[CV021] [CV020] [CV030]
            calloutType: insight
            claimRefs:
              - CV020
              - CV021
              - CV030
