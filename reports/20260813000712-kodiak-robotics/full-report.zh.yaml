          modules:
            - 感知与传感器融合（目标检测、状态估计）
            - 预测引擎（动态智能体轨迹预测）
            - 运动规划器（路线 + 轨迹生成）
            - 车辆控制器（CAN 总线执行命令）
        - id: l6
          label: Kodiak Dispatcher + 运营支持
          detail: 面向车队规模的软件分发、远程监控和数据分析，支撑持续改进飞轮
          modules:
            - 车队级 OTA 软件分发
            - 软件版本注册表与回滚
            - Mission Control（24/7 远程监控）
            - 故障分流与数据分析（事件标注、模型改进循环）
