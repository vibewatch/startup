      - number: '8.3'
        title: 投资 KPI、尽调要求与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >
              Kodiak 的投资案例要验证到 2028 年 $1.5B–$3B 的基准情景估值，需要按顺序跨过四个里程碑：(1) 确认 FMCSA 无人驾驶豁免；没有豁免，商业部署就没有法律授权；(2) 至少部署 100
              辆卡车并产生 AaaS 收入；(3) 至少签下一份与具名承运人的商业 AaaS 合同；(4) 运营成本证明低于 $3/mile，这是与人类司机运营成本竞争的门槛。 Aurora 公开提出的 sub-$2/mile
              目标设定了商业基准。截至 May 2026，Kodiak 尚未公开确认任何一个里程碑。[CV028] [CV037] [CV038] [CV041]

              到商业化上线前的资本需求估计为 $500M–$1B，区间覆盖至 2028；假设 Kodiak 从 2026 起为商业化准备扩张， 每年烧钱速度为 $150–200M。约 $150M 的 Series B
              轮融资在交割后（August 2024）大约提供 12–18 个月现金跑道，意味着最晚 Q1–Q2 2026 需要 Series C。若截至 May 2026 尚未披露 Series C，要么实际烧钱低于估计，
              要么正在考虑内部融资。公司完全没有公开财务披露，因此这份现金跑道分析带有推测性。[CV029] [CV031] [CV032]

              可比的 SPAC 上市 AV 公司——Aurora、TuSimple、Luminar——上市后 24 个月内股价均下跌 >80%，这塑造了 Kodiak 未来任何流动性事件的风险画像。投资者以 $500M–$1B
              的 Series B 隐含估值进入，若要获得 5–10x 回报，需要 $5B–$10B 退出；只有在乐观情景，即 1,000+ 辆卡车和 $300M+ AaaS 收入时才可能实现，而这一水平高于 Aurora
              截至 mid-2026 已商业化达到的规模。[CV030] [CV033] [CV034]

              有组织劳工风险（Teamsters、OOIDA）、EPA Clean Trucks Plan 对 2027+ model year 卡车的合规要求，以及司机短缺的 双刃剑属性（支撑 AV
              需求，同时也强化劳工反对），都会让商业化时间线更复杂。美国卡车司机缺口超过 80,000，给自动化 带来结构性需求；但即便联邦 FMCSA 框架建立后，有组织反对仍可能拉长州级监管时间线。[CV035]
              [CV036] [CV039] [CV040] [CV042]
