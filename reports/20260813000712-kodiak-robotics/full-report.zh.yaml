        - Argo AI 技术传承：Kodiak 创始团队曾任 Argo AI 的 CEO、CTO 和总裁，继承了来自 $3.6B 项目的深科技 AV 经验、安全系统和潜在 IP。
        - FreightWaves 与 Don Burnette 的问答；Aurora FY2025 10-K 将 Kodiak 列为竞争对手，验证创始团队的 行业合法性。
        - 独立 IP 审计显示从 Argo AI 转移的可防御 IP 有限，显著削弱技术先发优势。
      - - 反向逻辑
        - >-
          Aurora 拥有 18+ 个月商业领先：2025 年 4 月上线无人驾驶路线，已有 7 个付费客户，并在 2026 年 5 月签下 McLane（Berkshire Hathaway），还有 Hirschbach
          500 辆卡车 MOU。
        - Aurora FY2025 10-K；Aurora 2026 年 Q1 新闻稿（BusinessWire，2026 年 5 月）；TechCrunch 2026 年 5 月 McLane 交易报道。
        - Kodiak 在 12 个月内宣布首条商业无人驾驶路线，并公布具名承运客户。
      - - 反向逻辑
        - TuSimple 失败是具体警示先例：估值峰值 $8.5B，36 个月内退市至 $0.30/股，伴随治理、逾期报告和监管失败。
        - FreightWaves：TuSimple 2024 年 1 月自愿从 Nasdaq 退市；KPMG 辞任审计师；SEC 文件逾期。
        - 监管框架成熟，且未来 24 个月没有 AV 卡车运输失败案例重演。
      - - 反向逻辑
        - 财务和运营完全不透明：无收入、无客户、无经审计财务、未披露 FMCSA 申请——投资尽调基本面对的是黑箱。
        - Kodiak 网站；PitchBook；无 SEC 文件（私营公司）；Aurora 10-K 将 Kodiak 列为竞争对手，但未提供 Kodiak 财务信息。
        - 尽调资料室披露经审计财务以及具名客户签署的 LOI。
  - id: TV003
    slug: bull-base-bear-scenario-table
    title: 乐观 / 基准 / 悲观情景表
    notes: >-
      概率信号是基于赛道先例、监管时间线和 Aurora 可比情况的定性评估。估值区间采用 20-40x 远期 AaaS 收入倍数， 与 Aurora 从 2025 年 6 月至 2026 年 5 月重估中观察到的早期商业化 AV
      赛道溢价一致。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
    columns:
      - 情景
      - 核心假设
      - 估值区间
      - 概率信号
      - 下行触发器
    rows:
      - - 乐观
        - 2026 年取得 FMCSA 无人驾驶豁免；到 2028 年部署 500+ 辆卡车；AaaS 收入 $150M+；签下大型车队客户 （例如 J.B. Hunt、Werner 或类似一线承运商）。
        - $3B–$6B（2028E，20–40x AaaS 收入）
        - 20%
        - 监管延迟至 2027 年之后，或到 2028 年底车队爬坡低于 300 辆。
      - - 基准
        - 2027 年取得 FMCSA 豁免；到 2028 年部署 100–300 辆卡车；AaaS 收入 $50–75M；签下 1–2 个中型车队客户， 并具备经常性合同条款。
        - $1.5B–$3B（2028E，20–30x AaaS 收入）
        - 35%
        - Series B 现金跑道在 Series C 交割前耗尽；Aurora 车队先达到 1,000+ 辆，而 Kodiak 尚未达到 100 辆。
      - - 悲观
        - FMCSA 延迟至 2029 年之后；部署少于 50 辆卡车；AaaS 收入低于 $10M；需要降价轮或困境融资。
        - $300M–$700M（IP 和资产价值）
        - 25%
        - Series C 之前资本耗尽；FMCSA 无人驾驶豁免被直接拒绝。
      - - 极端悲观
        - 技术或监管失败；无法建立可行商业化路径；公司关闭或困境出售，仅剩 IP 残值。
        - <$150M（仅 IP 残值）
        - 20%（合计悲观 + 极端悲观 = 45%）
        - 致命 ADS 事故引发监管暂停；Ford 或 VW 提出 Argo AI IP 索赔；SoftBank 撤资；关键高管离任。
  - id: TV004
    slug: comparable-valuation-table
    title: 可比估值表
    notes: 可比公司集合受限于公开披露财务的 AV 卡车运输公私营公司很少。只有 Aurora 和 Mobileye 完整披露了公开市场数据。 TuSimple、Waymo 和 Kodiak 估值基于最后已知标记或公开来源估计。
    enumerationScope:
      coverage: partial
      basis: >-
        Selected peer set limited by small AV trucking universe; only two public comps with disclosed financials.
        Private valuations are point-in-time estimates from reported funding rounds; no secondary marks available.
    claimRefs:
      - CV016
      - CV018
      - CV019
      - CV021
      - CV024
      - CV025
    columns:
      - 公司
      - 资产类型
      - 最近估值
      - 核心指标
      - 指标值
      - 相关性
      - 局限
    rows:
      - - Aurora Innovation (AUR)
        - 公开股票（Nasdaq）
        - $15.12B 市值（2026 年 5 月 15 日）
        - FY2025 收入
        - $3M
        - 直接 AV 卡车运输可比公司；2025 年 4 月推出商业无人驾驶；在 FY2025 10-K 中将 Kodiak 列为竞争对手；McLane 和 Hirschbach 交易显示商业爬坡。
        - 商业进度领先 18+ 个月；公开股票溢价不适用于预商业化 Kodiak；Aurora 重估意味着市场已折现商业化成功。
      - - Mobileye (MBLY)
        - 公开股票（Nasdaq）
        - $8.44B 市值（2026 年 5 月 15 日）
        - FY2025 收入
        - $1.89B
        - 披露收入的 AV 技术赛道可比公司；为 Kodiak 达到商业规模后的轨迹提供收入倍数锚点（约 4.5x P/S）。
        - ADAS 产品模式，不是自动驾驶 AaaS 卡车运输；已具备规模化商业收入——商业模式和阶段都不同于 Kodiak。
      - - TuSimple（历史）
        - 公开公司（2024 年 1 月从 Nasdaq 退市）
        - $8.5B 峰值（2021）/ 退市时约 $0.05B
        - 峰值收入
        - <$5M
        - 唯一直接可比的 AV 卡车运输 IPO 至退市先例；说明治理、监管和执行风险可在 36 个月内摧毁几乎全部价值。
        - 业务失败由治理和报告失败驱动；不是可行上行可比；KPMG 审计师辞任和文件逾期，使其在当前阶段不同于 Kodiak。
      - - Waymo
        - 私营（Alphabet 子公司）
        - 约 $45B 隐含估值（2024 年 Alphabet 融资轮估计）
        - 收入
        - 未披露
        - AV 赛道估值天花板；验证已跑通商业规模的 AV 运营商可获得长期数十亿美元估值。
        - 无人出租车模式，不是 AV 卡车运输；Alphabet 资产负债表提供了 Stack AV 不具备的近乎无限资本；路线类型和监管路径不同。
      - - Kodiak Robotics
        - 私营
        - 约 $500M 估计（2021 年 Series B；无 2021 年后数据）
        - 收入
        - 未披露
        - 与 Kodiak 最接近的私营 AV 卡车运输可比公司；融资阶段和路线重点相似；获得 $140M 美国陆军合同，提供非商业收入。
        - 自 2021 年 Series B 以来未公开披露估值或财务数据；陆军合同不能验证商业 AaaS 收入。
  - id: TV005
    slug: thesis-break-and-kill-triggers-table
    title: 打破投资逻辑与终止触发器
    notes: 触发器按严重性排序。阈值是会导致评级下调或退出的具体可观察条件。所有触发器都是二元或近二元事件； 不代表渐进恶化情景。
    claimRefs:
      - CV028
      - CV030
      - CV031
      - CV038
      - CV039
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的影响
      - 时间线风险
      - 行动
    rows:
      - - FMCSA 无人驾驶豁免被拒或无限期延迟
        - 到 2028 年 12 月仍未出台联邦无人驾驶 CMV 框架
        - 投资逻辑完全破裂——全国范围内无法合法开展商业无人驾驶运营
        - 高
        - 下调至回避；进入负面观察；评估仅 IP 退出选项。
      - - 致命 ADS 事故触发监管暂停
        - 任何 Kodiak 或全行业事件导致 NHTSA/FMCSA 暂停 AV 卡车测试许可
        - 全行业暂停；Kodiak 商业部署冻结；投资者信心和保险覆盖被摧毁。
        - 关键
        - 立即卖出触发器；任何重新进入前先观察暂停后的监管回应。
      - - Aurora 先达到 1,000+ 辆卡车，而 Kodiak 尚未达到 100 辆
        - Aurora Hirschbach MOU（500 辆卡车）转化并开始规模部署，而 Kodiak 尚未实现任何商业无人驾驶运营。
        - 竞争护城河差距扩大到可追赶范围之外；Kodiak 在 AV 卡车运输中永久沦为二线；客户切换成本偏向 Aurora。
        - 高
        - 从观察下调至回避；只有 Kodiak 拿下美国前 5 大承运商作为锚定客户后才重新评估。
      - - Series C 以持平或降价轮估值融资
        - 新融资估值等于或低于 Series B 隐含的约 $750M
        - 释放投资者信心崩塌信号；现有进入价被下调；稀释加速；说明里程碑未按预期时间线达成。
        - 高
        - 若退出价格意味着 Series B 进入价回报 <2x，则卖出；只有出现新的 FMCSA 进展证据时才持有。
      - - Don Burnette（CEO）或 Brett Browning（CTO）离任
        - CEO 或 CTO 宣布离开 Kodiak 或辞职
        - Argo AI IP 链条和技术路线图承压；关键人物风险兑现；投资者信心和 Sequoia/SoftBank 信念动摇。
        - 中
        - 触发全面尽调复盘；继任确认前暂停任何追加资本承诺。
  - id: TV006
    slug: final-diligence-asks-table
    title: 最终尽调要求
    notes: 投资承诺前必须完成全部六项尽调。1–3 项是阻断项：没有 FMCSA 豁免状态、财务和客户合同，基准情景无法验证。 4–6 项具有重大影响。
    claimRefs:
      - CV031
      - CV032
      - CV036
      - CV037
      - CV042
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人
      - 尽调路径
    rows:
      - - FMCSA 无人驾驶豁免申请
        - 公开渠道没有 Kodiak 向 FMCSA 提交的文件、豁免申请或监管往来，无法确认任何豁免策略或时间线。
        - 没有联邦豁免，无论技术准备度如何，所有商业无人驾驶计划都被法律卡住；这是最关键的单项尽调。
        - Kodiak 管理层和监管顾问
        - 要求提供已提交的任何 FMCSA 豁免申请或询问信；确认内部监管时间线估计，以及是否已与 FMCSA 讨论 AV 专用 CDL 豁免。
      - - 经审计财务与现金跑道
        - 公开渠道没有经审计 P&L、资产负债表、烧钱速度或持续经营评估。Series B 于 2024 年 8 月交割，但之后没有财务披露。
        - 无法判断 Kodiak 是否能在需要追加资本前达到下一个商业或技术里程碑；现金跑道不确定是主要持续经营风险。
        - Kodiak CFO
        - 要求提供经审计或审阅的财务报表；18 个月现金流预测；由 CFO 确认当前现金余额和月度烧钱速度。
      - - 已签收入合同或意向书
        - 截至 2026 年 5 月，未披露客户、已签路线或 AaaS 合同意向书。
        - 商业准备度无法验证；没有客户证据，所有收入时间线主张都缺乏支撑；AV 卡车运输的企业买家确实存在（Aurora / McLane）。
        - Kodiak 商务拓展和销售
        - 要求提供已签 LOI 或有约束力合同；确认客户身份、合同条款、路线地理、定价以及任何排他性条款。
      - - Argo AI IP 转让文件
        - 没有公开文件确认 Argo AI 专利、商业秘密、训练数据和软件已转让给 Stack AV；Brett Browning 是 Argo AI LLC 有效专利的具名发明人。
        - 未转让的 Argo AI IP 可能被 Ford、Volkswagen 或 Argo AI 债权人主张，进而阻断商业运营或要求支付权利金。
        - 外部独立 IP 律师
        - 委托独立 IP 转让审计；审查所有创始工程师的雇佣合同；与 Ford 和 Volkswagen 律师确认 Argo AI LLC 清算中的 IP 处置。
      - - 股权结构表与优先权结构
        - Series A 或 Series B 轮未公开披露股权结构表、清算优先权条款、反稀释条款、认股权证或棘轮条款。
        - 不了解优先权悬垂和稀释堆叠，就无法计算真实投资者回报；低于全额优先清算金额的退出中，普通股回款可能接近零。
        - Kodiak 总法律顾问
        - 要求提供截至 Series B 交割时的资本结构表，并完整列出所有优先权条款、转换比例、认股权证和棘轮条款。
      - - ADS 独立技术评估
        - 未披露 Kodiak ADS 传感器套件性能、安全论证、ODD 边界或系统架构的第三方验证。
        - 相较于 Aurora 和 Kodiak 的竞争护城河主张无法独立验证；没有外部评估，就无法量化技术风险和差异化。
        - 独立 AV 工程公司
        - 委托独立技术评估 ADS 架构、传感器套件性能包络、ODD 边界、安全论证完整性和软件验证证据。
