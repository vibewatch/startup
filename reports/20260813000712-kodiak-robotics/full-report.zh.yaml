      - number: '3.3'
        title: 相邻竞争者与替代方案分析
        blocks:
          - type: paragraph
            body: >
              Gatik AI 已在约 15–80 英里的固定 B2B 中程路线上证明商业无人驾驶（无安全员）运营可行，客户包括 Arkansas 和 Texas 的 Walmart 以及 Canada Ontario 的
              Loblaw。Gatik 更短、更受控的路线 ODD 让监管审批更早到来，但代价是可寻址市场远小于开放州际长途。Gatik 不是 Kodiak 长途业务的直接竞争威胁，不过它的商业成功验证了今天在更窄 ODD
              中无人驾驶货运运营具备经济可行性。

              Einride 在美国（Tennessee、Wisconsin、Florida、California）的私有和专用货运路线上运营自动驾驶电动 T-pod 车辆，并依据美国 DOT 对远程运营车辆的豁免。客户包括
              GE Appliances、Electrolux 和 DB Schenker。Einride 按英里收费，打包车辆、电力、维护和远程运营。Einride 的价值主张依赖零排放转型——它不是 Kodiak
              柴油卡车长途业务的货运无关 Level 4 竞争者。不过，Einride 说明自动驾驶货运的按英里打包定价模式能够吸引企业托运人。

              Waymo Via 于 2023–2024 年收缩商业卡车业务，把 Alphabet 的无限资本优势从短期竞争场中移走。它的缺席为资本受限的独立公司打开 2025–2030
              年窗口，让它们能在潜在重返前建立车队关系。现状替代方案——人类 CDL 司机——仍是主导在位者。约 2.24 million 名持证重型卡车司机提供完全可扩张的劳动力，长途运营估计全成本为每英里
              $2.00–$2.50，为 AV 按英里定价设下最终需要接近或低于的基准，才能撬动承运商 ROI。
