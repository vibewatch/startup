      - number: '2.6'
        title: 图表与论据
        blocks:
          - type: callout
            title: 司机短缺制造了持久需求信号
            body: >
              美国结构性司机短缺，是自动驾驶卡车短期最有说服力的需求驱动。ATA 数据确认承运商持续面临招聘困难；在长期货运量增长背景下，BLS 预计到 2034 年就业仅增长
              4%。不同于周期性货运下行，司机供给是由人口结构和职业偏好驱动的长期约束。这给自动驾驶部署提供了持久 ROI 理由，不需要技术成本降到与人工同等水平才成立。
            calloutType: insight
            claimRefs:
              - CM003
              - CM017
              - CM019
              - CM037
          - type: callout
            title: 市场规模估计高度不确定
            body: >
              本章审阅的所有自动驾驶卡车市场规模估计，都来自单一来源分析师报告，方法论无法独立验证。Mordor Intelligence 的 $42.6 billion 2026 年数字，无法与其他已发布预测交叉验证。基于
              ATA 总收入和长途细分占比的一阶 SAM 估计，需要对路线适配性和短期可部署性做大量假设。投资者和分析师应把所有具体 TAM/SAM 数字视为方向性的数量级锚点，而不是精确预测。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM043
              - CM044
          - type: callout
            title: EPA Phase 3 推动 AV 与 ZE 部署走向融合
            body: >
              EPA Phase 3 GHG 标准要求到 2032 车型年，Class 8 卡车新车销售中 40%
              为零排放，这与自动驾驶部署之间形成了被低估的融合动态。电池电动重卡面临续航和充电基础设施约束，而这些问题在定义清晰的枢纽到枢纽路线中最容易处理——这也正是 Level 4 AV 最可行的路线。AV
              系统可以用人类司机做不到的方式优化 ZE 续航管理，可能让 AV+ZE 打包方案比单独任一技术更有经济吸引力。2024–2027 年作出 $50B+ ZE 基础设施承诺的 OEM
              和车队，可能更偏好能接入自身电动化战略的 AV 平台。
            calloutType: insight
            claimRefs:
              - CM020
              - CM021
              - CM029
          - type: callout
            title: 枢纽到枢纽 SAM 估计是一阶近似
            body: >
              本章引用的美国枢纽到枢纽自动驾驶卡车 $100–200 billion SAM 区间，来自一阶推导：ATA 卡车运输总收入（$906B）× 估计长途细分占比（35–40%）× 短期 ODD
              约束下的可适配折扣。没有发现独立公开研究直接用这一方法测算美国枢纽到枢纽自动驾驶卡车 SAM。Kodiak 自身 SOM 也没有公开量化。投资者尽调时，应使用专有路线密度和承运商采用模型验证这些数字。
            calloutType: insight
            claimRefs:
              - CM043
              - CM044
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              截至 2026 年中，自动驾驶卡车竞争格局由技术进展、资本出清和战略退出共同塑造，活跃玩家从 2021 年的十余家收窄到约五个可信的长途赛道竞争者。Aurora Innovation 于 2025 年 5 月 1
              日实现行业首个商业里程碑——Level 4 无人驾驶卡车运输——为商业经济性建立第一批真实世界证据。Torc Robotics 由 Daimler Truck AG
              的资产负债表和分销网络支持，是资本最安全的竞争者，但商业运营推进最慢。Kodiak Robotics 通过军方合同多元化形成差异，在商业货运市场之外获得收入和测试里程。Plus AI 以 ADAS
              优先模式竞争，一边产生当前订阅收入，一边向完整 Level 4 迈进。

              两个相邻竞争者——Gatik AI 和 Einride——处在结构上不同的细分市场。Gatik 已在固定中程路线（15–80 英里）上证明商业无人驾驶运营可行，与 Kodiak
              面向开放高速公路长途场景的目标并不重叠。Einride 在美国 DOT 豁免下，为私有 / 专用货运走廊打包电动自动驾驶，以按英里收费模式服务有零排放要求的客户，而不是追求最大路线覆盖。两者今天都不是
              Kodiak 长途业务的直接威胁，但它们说明，在更窄 ODD 中，商业无人驾驶货运经济性已经可以跑通。

              三次重大退出重塑了格局。Embark Trucks 曾是一家 SPAC，募资约 $614 million，但在没有后续资本且未达商业里程碑后，于 2023 年 2 月关闭。TuSimple/Hydron
              在因涉嫌与中国关联 Hydron Inc. 未披露数据共享而遭 SEC 执法后，到 2023 年基本退出美国市场。Waymo Via 本可凭 Alphabet 资产负债表成为财务上最强的竞争者，但其在
              2023–2024 年收缩商业卡车开发，转向聚焦 Waymo One 乘用车网约车。现状替代方案仍是人类 CDL 司机，约 2.24 million 名持证重型卡车司机构成可在所有路线扩张的在位劳动力。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP027
      - number: '3.2'
        title: 直接竞争者画像
        blocks:
          - type: paragraph
            body: >
              Aurora Innovation 是 Kodiak 最领先的直接竞争者。公司 2017 年由 Chris Urmson（前 Waymo CTO）、Sterling Anderson（前 Tesla
              Autopilot VP）和 Drew Bagnell（前 Uber ATG 负责人）创立，把 robotaxi 和货运经验组合进同一技术平台。Aurora 于 2021 年 10 月通过与 Reinvent
              Technology Partners Y 的 SPAC 合并上市（Nasdaq: AUR），累计股权融资约 $3.5 billion 或更多。Aurora 商业服务于 2025 年 5 月 1 日在
              Dallas–Houston–El Paso 走廊启动，使用 Peterbilt 579 卡车，合作伙伴包括 Werner Enterprises、Uber Freight 和 FedEx。Aurora
              Driver 平台包含已发布的 Voluntary Safety Self-Assessment（VSSA）和自有 Safety Case Framework（SCF）。公司主要弱点是财务：年运营亏损约 $600
              million，10-K 文件中的持续经营披露反映其依赖持续进入资本市场。

              Torc Robotics 的模式在结构上不同。自约 2022 年起，Torc 由 Daimler Truck AG 全资持有，受益于 OEM 资本托底和 Freightliner 在 North America
              的 2,400 个网点经销商网络。其 Level 4 技术栈在 Freightliner Cascadia 卡车平台内共同开发，硬件和软件集成更紧，但可寻址车队受限于 Freightliner 品牌车辆。自
              2019 年收购以来，尽管有 Daimler 支持的六年多开发，Torc 截至 2026 年中仍未宣布商业服务发布日期。

              Kodiak Robotics 由 Don Burnette 以及来自 Google/Waymo、Uber ATG 和 Cruise 的同事于 2018 年创立，是资本效率最高的独立竞争者。Kodiak
              已融资超过 $250 million，与 Werner Enterprises 和 Prime Inc. 维持货运合作，并获得总额超过 $140 million 的美国 Army
              自动驾驶物流合同。这些军方订单提供非商业收入和真实世界自动驾驶里程，让 Kodiak 在货运市场下行中更有缓冲。Kodiak 截至 2026 年中尚未宣布公共道路商业无人驾驶货运运营。

              Plus AI 通过 SuperDrive Level 2+ 产品采取 ADAS 优先商业策略，该产品在 Peterbilt 579 和 PACCAR
              卡车上通过硬件套件产生经常性收入，并覆盖中国和美国市场。Plus AI 与 PACCAR、FAW Group 的 OEM 合作搭出从改装到 OEM 的迁移路径，但它对 Kodiak
              的短期竞争威胁是间接的：Plus 用一个风险更低、成本更低、已经产生收入的 ADAS 产品争夺承运商技术预算，可能推迟承运商承诺纯 Level 4 供应商。
