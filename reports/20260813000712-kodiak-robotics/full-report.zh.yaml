      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              自动驾驶卡车市场的买方结构分层。最上层是大型自有资产整车（TL）承运商——Werner Enterprises、Hirschbach Motor Lines 等拥有 500+
              牵引车的运营商——它们是主要技术买方和最早采用者。这些承运商拥有卡车、持有运营资质并承担责任，因此直接支付 AV
              技术授权费或按英里计的自动驾驶服务费。它们采用技术的触发点，是司机供给约束与长期降本目标的组合；Werner 和 Hirschbach 与 Aurora Innovation
              的合作说明，美国大型承运商正在主动评估 AV 技术。

              大型托运人和第三方物流商（3PL）是第二层买方——它们向承运商采购运力，并制造足以支撑承运商投资自动驾驶技术的需求信号。托运人关心货运可靠性、停留时间压缩和车道价格可预测性；它们不直接购买 AV
              技术，但当可靠性提升后，会偏好具备 AV 能力的车道，从而影响承运商采用。Daimler Truck（通过 Torc Robotics）和 Volvo Autonomous Solutions
              这类原始设备制造商（OEM）代表第三类买方——它们在硬件层集成 AV 技术，形成不同于纯软件授权的买方—技术关系。

              采用路径像一个监管漏斗：技术验证 → FMCSA 豁免或州级许可 → 承运商试点 → 在特定走廊商业发布 → 地理扩张。Aurora 2025 年 5 月的商业发布，是美国 Level 4
              自动驾驶卡车首次被证明能穿过这个漏斗，既验证路径存在，也为 Kodiak 立下竞争先例。
