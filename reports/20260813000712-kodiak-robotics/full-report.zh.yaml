      - number: '3.5'
        title: 竞争护城河与反向证据
        blocks:
          - type: paragraph
            body: >
              Aurora 的先发商业合作形成初始切换成本：Werner Enterprises、Uber Freight 和 FedEx 正把 Aurora Driver 接入调度、车联网和维护框架，替换周期可能需要
              12–24 个月。如果这些安排含有排他条款（未公开披露），Kodiak 通往同一批承运商的路径会被实质性压缩。Torc 的 Daimler 分销护城河很强但窄——只惠及购买新 Freightliner
              卡车的客户。Kodiak 的军方合同多元化提供了商业单一竞争者没有的财务缓冲。Kodiak 的护城河更依赖技术继承和人才密度，而不是商业锁定，因此外部更难评估耐久性。

              反向竞争动态很重要。Aurora 每年 $600 million 运营亏损和持续经营披露构成系统性风险：如果 Aurora 像 Embark 和 TuSimple 一样，在实现商业规模收入前失败，Level 4
              卡车整体声誉受损，可能让所有 AV 供应商的承运商合作推迟 12–24 个月。高资本强度既是护城河，也是脆弱性：开发一套经验证、商业规模的 Level 4 AV 系统，估计成本为 $1–3 billion
              或更多，这已经证明是把幸存者（Aurora、Torc、Kodiak、Kodiak）与失败者（Embark、TuSimple）分开的生死门槛。2023–2024
              年货运衰退进一步压缩卡车行业资本开支预算，推迟了承运商 AV 投资决策。
