      - number: '6.5'
        title: 扩张与集中风险
        blocks:
          - type: paragraph
            body: >
              Kodiak 在五条走廊（Denver–Atlanta、Phoenix、Dallas、Miami）的测试项目表明，公司可能先集中在南部和西南部扩张，再推向全国，类似 Aurora 的 Texas 优先策略。若
              Kodiak 复制 Aurora 的锚定客户模式，近期客户基础可能只有 2–3 家承运商、1–2 条走廊，从而产生严重收入集中风险：任何单一承运商暂停或延迟，都会不成比例地影响 Kodiak
              的商业化爬坡。[CU031] [CU032]

              各州 AV 法律拼图进一步强化了地理集中。全国扩张需要按走廊逐一取得州级监管放行；监管友好的州（Texas、Arizona、Florida）会优先部署，其他州则需要额外立法铺路。这把早期客户获取限制在 AV
              友好司法辖区内拥有线路量的承运商上，压缩了发布后最初 2–3 年的可触达客户基础。[CU033] [CU036]

              OEM 集成依赖代表供给侧渠道集中：Kodiak 必须先与 PACCAR、Volvo 或 Daimler Truck 签下集成协议，才能以承运商规模部署，这给少数 OEM 伙伴带来结构性议价权。Uber
              Freight 作为 Aurora 货源匹配中介的角色，确立了一种也可能适用于 Kodiak 的 3PL 渠道依赖模式：单一 3PL 中介如果控制 AV 运力订舱入口，就能塑造承运商定价和运量。[CU034]
              [CU035]

              竞争格局（Aurora、Torc、Kodiak、Plus.ai、Einride）让大型承运商在商业规模上拥有多个 AV 卡车供应商选择，这会削弱 Kodiak
              的定价权，并提高合同续约时的潜在流失风险。Kodiak 的 Series A 现金跑道支持其走到商业发布，但在没有披露时间线或客户承诺的情况下，首笔收入时间仍是关键未决变量。[CU037] [CU038]
