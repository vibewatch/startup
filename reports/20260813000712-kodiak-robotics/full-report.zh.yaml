      - number: '7.5'
        title: 证据展项
        blocks:
          - type: callout
            title: FMCSA 无人驾驶豁免是关键路径监管阻断
            body: >
              FMCSA 尚未发布允许商业无人 CMV 运营的规则；49 CFR §383.3 下的 CDL 要求仍然适用。没有联邦豁免，Kodiak 无论技术是否成熟，都不能商业部署无人驾驶卡车。Aurora 已为其
              Dallas–Houston 无人驾驶项目取得运营授权，但所有 AV 开发商获得 FMCSA 无人驾驶豁免的路径仍未定义。这是最重要的单项监管尽调事项：确认 Kodiak
              是否已提交豁免申请，以及处于哪个阶段。如果到 2028 年仍无法取得联邦框架放行，就构成打断投资逻辑的触发条件。
            calloutType: insight
            claimRefs:
              - CR002
              - CR012
          - type: callout
            title: SoftBank 集中造成收入前二元融资风险
            body: >
              SoftBank Vision Fund 作为 Kodiak $81M Series A 领投方的角色，在一家仍处收入前、还需要 $500M+ 才能达到商业发布规模的公司里，形成单点融资依赖。SoftBank
              Vision Fund 1 和 2 对包括 WeWork 在内的组合损失累计减记超过 $30B；LP 对后续跟投信心的压力处于高位。若 SoftBank 不领投或不实质参与 Series B，Kodiak
              就会面对持续经营情景。投资者在投入更多资本前，应要求公司证明 Series B 管线已经多元化，并存在替代资本来源。
            calloutType: insight
            claimRefs:
              - CR023
              - CR024
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Kodiak 的投资逻辑建立在三根结构性支柱上。第一，美国 Class 8 卡车运输市场年规模超过 $900B， 结构上容易被自动驾驶冲击：ATA 2023 记录的司机缺口超过 80,000
              个岗位，燃料与劳动力成本占运营开支 60% 以上；监管窗口也奖励抢在规模化商业化前拿到 FMCSA 无人驾驶豁免的先行者。AV 卡车运输市场估计 2026 年为 $42.63B，2031 年增至
              $74.23B，CAGR 为 11.73%；Level 4 平台预计 CAGR 为 15.21%。[CV009] [CV035] [CV036] [CV039]

              第二，Sequoia Capital 和 SoftBank Vision Fund 2 是顶级资本配置者，并且直接押注创始团队。Don Burnette (CEO)、Brett Browning
              (CTO)、Peter Rander (President) 都是 Argo AI 共同创始人，在创立 Kodiak 前已在 AV 技术前沿推进六年。Argo AI 留下的 IP，包括在 Ford 和
              Volkswagen 支持的 $3.6B 项目中打磨出的传感器融合架构与安全系统，给 Kodiak 提供了从零起步的初创公司拿不到的技术起跑优势。 Aurora Innovation 在 FY2025 10-K
              中明确将 Kodiak 列为竞争对手，证实其行业合法性。[CV001] [CV004] [CV007] [CV010]

              反向逻辑同样有证据支撑。Aurora Innovation 拥有 18+ 个月商业化领先优势，已有真实付费客户（截至 Q1 2026 为 7 家）、已签 McLane 交易，以及 Hirschbach 500
              辆卡车 MOU——这些都发生在 Kodiak 公开宣布 任何商业路线或客户之前。TuSimple 的失败说明，AV 卡车的治理、监管与执行风险并非理论问题：三年内摧毁了 $8.5B 价值。Kodiak
              在财务和运营上完全不透明——没有收入、没有客户、没有经审计财务报表、没有披露 FMCSA 申报——截至 May 2026，公开资料几乎无法支撑独立尽调。45% 的悲观情景概率（悲观 + 极端悲观合计）
              反映的正是这种结构性不透明。[CV005] [CV006] [CV008] [CV011] [CV012]
            claimRefs:
