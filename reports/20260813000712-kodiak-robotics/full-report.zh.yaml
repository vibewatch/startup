      - number: '4.2'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Kodiak 的资本形成比典型私有 AV 初创公司记录更完整，因为公司现在提供上市公司历史背景。官方来源支持 2018 年 $40 million Series A 和 2021 年 $125 million
              Series B；此后 Kodiak 继续与战略伙伴一起扩大货运和自动驾驶项目。2025 年 4 月，公司宣布与 Ares Acquisition Corporation II 进行业务合并，投前股权价值约
              $2.5 billion，同时有超过 $110 million 承诺融资，并在赎回前拥有约 $551 million 信托现金。

              2025 年 9 月交割更新称，尽管 SPAC 赎回严重，该交易仍募得超过 $275 million；2026 年 5 月又以折价价格完成进一步 $100 million PIPE。这些融资相较 Kodiak
              早期私有轮，显著提升了披露质量，但也引入了私有轮融资新闻常遮住的稀释和市场情绪风险。剩余尽调缺口包括交割后精确所有权、Atlas 相关商业承诺，以及如果季度现金消耗仍接近 2026
              年上半年水平，公开资本需求会多快重新出现。
            claimRefs:
              - CI009
              - CI010
      - number: '4.3'
        title: 成本结构与烧钱速度分析
        blocks:
          - type: paragraph
            body: >
              Kodiak 的运营成本结构没有公开披露。公司的商业化前阶段意味着成本画像约 70–85% 为研发，接近 Aurora FY2024 研发占总运营费用 86% 的比例（$786 million 中的 $676
              million）。Kodiak 规模更小——估计 200–300 名员工，而 Aurora 商业发布时约 1,800 人——意味着绝对烧钱额按比例更低。把 Aurora FY2024 每员工总运营费用（每年
              $438,000）套到 Kodiak 250 人估计上，得到隐含年成本 $109 million，即每月 $9 million。这个每员工代理值可能高估 Kodiak 烧钱，因为 Aurora
              承担商业服务交付成本（收入成本、现场运营基础设施），Kodiak 尚未产生这些成本。较低区间估计为每员工 $150,000–$290,000，符合没有商业服务开销的更早期工程组织，对应每月估计现金消耗 $3–6
              million。

              Kodiak 的主要成本驱动是感知、运动规划、仿真和系统工程方面的工程人员；GPU 训练和仿真计算基础设施；测试卡车车队所有权和运营成本；以及车队仪表化所需传感器硬件。BLS
              伤害和疾病数据确认，长途卡车是伤害率最高的职业之一，为承运商采用框架中除按英里定价之外的安全价值论点提供支撑。FMCSA 的强制商业驾驶执照要求规范了在位人工标准；CDL 持有人在工时规则下每天合法驾驶上限为
              11 小时，而自动驾驶系统理论上每天可运营 22 小时或更久，这构成 AV 溢价定价的利用率论点。ATA 报告 2024 年美国卡车运输总收入为 $906 billion，司机人工约占货运总成本的
              35–40%，对应估计每年 $317–$362 billion 可寻址司机成本替代空间，锚定 AV DaaS 供应商的收入机会。
