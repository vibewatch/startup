      - number: '7.3'
        title: 财务、伙伴与人员风险
        blocks:
          - type: paragraph
            body: >
              Kodiak 的财务风险集中在收入前、资本密集的位置，以及 SoftBank Vision Fund 在 $81M Series A 中担任领投所造成的单一投资者集中。按 Aurora 的路径，AV 卡车行业需要
              $500M–$2B+ 资金才能达到商业发布规模；Kodiak 距商业发布可能还有 18–36 个月，必须在现金耗尽前融资 Series B。SoftBank Vision Fund 的组合历史——包括
              WeWork 在内累计减记超过 $30B——会引发 LP 审视，可能约束后续跟投信心。Sequoia Capital 共同投资了 Series A，但承诺规模更小。[CR023] [CR024] [CR025]
              [CR026]

              持续经营风险是二元的：如果 Kodiak 不能在 Series A 完成后约 12–18 个月内融资 Series B，公司会撞上现金跑道悬崖。没有已披露的收入、客户或商业协议可以抵消这一风险。CRS 和
              RAND 研究文献确认，AV 商业化资本密集，且依赖仍未排期的监管解决。[CR027] [CR029] [CR031]

              保险风险重大且未解决。无人驾驶卡车规模化运营尚不存在商业保险定价；Kodiak 需要自保，或设计类似 Lloyd's
              的定制保险，从而在任何碰撞场景下形成资产负债表暴露。缺少已披露保险安排，是一个尽调缺口。[CR030]

              伙伴集中风险沿三个向量显著存在：（1）SoftBank 作为主要资本来源；（2）NVIDIA 和 Luminar 作为集中的硬件供应商；（3）Peterbilt 和 / 或 Freightliner 作为 OEM
              卡车平台伙伴，但合同条款未披露。[CR017] [CR021] [CR024]

              人员风险很关键。CEO Don Burnette、CTO Brett Browning 和 President Dax Rander 都是前 Argo AI 高管。CTO 是覆盖核心 AV IP 的 Argo
              AI 专利发明人；如果他离职，会同时带来关键人风险和潜在 IP 所有权争议。Aurora、Waymo 和 Tesla 争夺同一批 CV
              工程师人才，推高人员流失风险。有组织劳工反对力量——Teamsters（3.5M 会员基础）和
              OOIDA（个体车主卡车司机）——积极游说反对自动驾驶卡车立法，延长收入前现金跑道风险，并在关键走廊州制造政治逆风。[CR032] [CR033] [CR034] [CR035] [CR036] [CR037]
