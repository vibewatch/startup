  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Kodiak 竞争的是美国商业卡车市场，具体是最适合 SAE Level 4 自动驾驶运营的长途（>250 英里）枢纽到枢纽细分市场。2024 年，美国卡车运输总收入达到 $906
              billion，占全部货运重量的 72.7%，是国内主导货运方式。其中，长途整车（truckload）细分市场以受控出入州际公路上的配送枢纽间点到点路线为特征，估计占总收入的 35–40%，约 $300–360
              billion。这才是自动驾驶卡车平台短期内有现实替代可能的可服务市场。

              市场边界不包括本地和区域配送（最后一英里）、需要复杂交接的零担（LTL）整合网络，以及需要人类判断的特殊货物（危化品、平板车、装载复杂的温控货物）。它也不包括车队管理软件、运输管理系统（TMS）和相邻物流
              SaaS；这些是集成接口，不是 Kodiak 的直接收入机会。

              主要现状替代方案是由个体车主或受雇司机驾驶的 Class 8 卡车。美国约有 2.235 million 名重型卡车司机在岗，年薪中位数为 $57,440，对应约 $128 billion
              的年度司机人工成本，自动驾驶系统有机会部分替代。SAE J3016 Level 4 自动化定义了 Kodiak
              系统必须在没有人类干预下运行的运营设计域（ODD），也把初始部署限制在界定清晰、抗天气扰动、货量高的货运走廊。
