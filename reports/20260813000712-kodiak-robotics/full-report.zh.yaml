  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现策略
        blocks:
          - type: paragraph
            body: >
              Kodiak 的收入模式是 Driver-as-a-Service（DaaS，司机即服务）的按自动驾驶英里收费机制：当 Kodiak 的 Level 4 系统在没有人类驾驶员的情况下驾驶 Class 8
              卡车时，车队运营商按英里付费。这个模式与 Aurora Innovation 已商业部署的 DaaS 结构相似；Aurora FY2025 10-K
              将其描述为向承运商伙伴按运营自动驾驶英里收取的服务费。对自动驾驶卡车来说，按英里模式在结构上有吸引力，因为它直接替代 CDL 司机的可变人工成本——仅工资估计为每英里
              $0.45–$0.80，若纳入福利、保险和差旅补贴则为每英里 $1.20–$1.60——让评估自建还是外购的承运商车队运营商更容易看清经济账。CEO Don Burnette 在 2023 年 9 月
              FreightWaves Q&A 中确认按英里变现模式，但没有披露具体定价或合同条款。

              截至 2026 年中，Kodiak 尚未公开披露具体 DaaS 定价，也没有给出完全透明的每英里单位经济性桥接。Aurora FY2025 10-K 报告称，其商业服务于 2025 年 5 月 1
              日启动，首个完整商业年产生 $3 million 收入，收入成本为 $17 million——显示早期单位经济性处于深度负毛利状态，符合商业发布早期运营规模低、固定基础设施开销高的特征。Kodiak
              公开材料则强调客户自有、资产轻部署结构，自动驾驶供应商不需要为完整卡车车队融资；相比垂直一体化持有模式，这应降低资本需求。次级收入流——受监督自动驾驶爬坡期的安全监控费、向 OEM
              和保险公司授权数据、每车平台订阅费——仍属猜测；截至 2026 年中，任何自动驾驶卡车供应商都没有公开证据支持。
            claimRefs:
