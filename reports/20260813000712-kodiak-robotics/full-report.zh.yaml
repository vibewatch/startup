      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >
              Kodiak 的运营和技术风险集中在五个相互咬合的暴露点：传感器硬件供应链集中、恶劣天气性能限制、网络安全漏洞、OTA 软件失败风险和 OEM 集成依赖。

              传感器硬件集中度很高。Luminar Technologies 是包括 Argo AI 遗留栈在内多家 AV 开发商的主要 LiDAR 供应商；该公司 2024–2025
              年报告了财务挑战，包括裁员，这提高了单一来源传感器供应商的破产风险。NVIDIA DRIVE 是 AV 训练和推理的主导计算平台；Kodiak
              尚未公开披露替代计算栈。感知和计算硬件双重单一来源依赖，会形成可能叫停测试或延迟商业化的供应链脆弱性。[CR016] [CR017]

              对依赖 LiDAR 的 AV 系统来说，恶劣天气性能是有记录的全行业挑战。雨、冰、雪会削弱点云质量和传感器精度。Kodiak 的 Pittsburgh 起源和 PA
              走廊扩张意图，直接面对恶劣天气约束。Kodiak 尚未公布其全天候性能包络的独立验证。[CR013] [CR020]

              搭载 ADS 的卡车存在更高网络安全风险，因为 OTA 软件交付和车载通信数据传输需要远程访问。Kodiak
              尚未公开披露任何第三方安全审计。车辆劫持或数据泄露事件会造成责任、监管和声誉损害，并向客户和投资者信心级联扩散。[CR015]

              车队规模 OTA 软件更新失败——即一次有缺陷的软件推送触达所有已部署车辆——会触发 NHTSA 权限下的召回，并带来安全事故风险。Kodiak 仍处商业化前阶段，OTA 架构尚未经过独立验证。对
              Peterbilt 和 / 或 Freightliner 平台线控系统的 OEM 集成依赖，也会在 OEM 合作优先级变化时形成发布风险。[CR018] [CR019] [CR021]

              Kodiak 创始团队把 Argo AI 的技术设计决策带入 Kodiak 平台；来自前公司的 IP 转让核验和软件来源仍是未解决的尽调事项。[CR022]
