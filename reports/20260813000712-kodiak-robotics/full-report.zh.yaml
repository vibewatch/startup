      - number: '6.2'
        title: 采用轨迹
        blocks:
          - type: paragraph
            body: >
              自动驾驶卡车的宏观采用轨迹，正由 Aurora Innovation 设定；截至 2026 年中，它是该行业唯一的商业无人驾驶运营商。Aurora 于 2025 年 4 月下旬在 Dallas–Houston
              走廊与 Werner Enterprises 和 Uber Freight 作为锚定伙伴商业发布无人驾驶货运，代表美国第一次在商业规模上产生收入、且无驾驶员在车内的自动货运动作。Kodiak
              的商业化前开发轨迹将以这个里程碑为标尺。[CU010] [CU011]

              Mordor Intelligence 估计，全球自动驾驶卡车市场 2026 年为 $42.63B，并以 11.73% CAGR 增长，到 2031 年达到 $74.23B。McKinsey
              估计，自动驾驶卡车在完全部署规模下可将长途每英里成本降低 30–45%；这是技术风险可接受后，承运商采纳在经济上变得理性的根本价值主张。[CU009] [CU013]

              Kodiak 的采用信号是间接的。截至 2026 年 Q2，五条走廊上的活跃 CDL-A 招聘证明测试在扩张；FreightWaves 2025 年 CTO
              访谈描述的技术开发路线图，重点在工程里程碑而非客户获取，这与商业化前状态一致。FMCSA 尚未针对商业自动驾驶卡车运营发布具体认证框架，因此监管放行时间仍是任何承运商采购决策的主要门槛。反过来，GAO
              认为自动驾驶汽车采用需要解决责任、保险和联邦标准缺口，这意味着 Kodiak 首批商业客户除了接受技术，还需要配合定制化监管沟通。[CU012] [CU015] [CU016]

              截至 2026 年中，JB Hunt（美国最大的整车承运商之一，每天运营数万票货）尚未宣布任何 AV 卡车合作；在 Aurora 初始伙伴组之外，大型承运商行业采用仍存在一个实质性缺口。[CU014]
            claimRefs:
