      - number: '4.4'
        title: 对标 Aurora Innovation 的财务基准
        blocks:
          - type: paragraph
            body: >
              Aurora Innovation, Inc.（Nasdaq: AUR）是唯一上市交易的纯 Level 4 自动驾驶卡车公司，因此其提交 SEC 的财务数据，是 Stack AV
              预期财务轨迹最严谨的公开代理。Aurora FY2024 10-K 披露研发费用 $676 million、SG&A $110 million，在零收入情况下净亏损 $748 million。Aurora
              FY2025 10-K 于 2026 年提交，覆盖截至 2025 年 12 月 31 日的年度，记录公司商业运营第一年：收入 $3 million、收入成本 $17 million、研发 $745
              million、SG&A $142 million，净亏损 $816 million。Aurora 截至 2025 年 12 月 31 日流动性约 $1.46 billion——现金 $221
              million、短期投资 $1.055 billion、长期投资 $183 million——由 FY2025 通过 ATM 股权净融资 $874 million 以及 2024 年 8 月公开发行融资 $466
              million 支撑。

              Aurora 在 FY2024 10-K 中的持续经营披露承认，如果没有持续资本渠道，预计运营亏损可能让其持续经营能力受到怀疑。2025 年 5 月商业发布和后续融资部分缓解了这一披露，但 Aurora
              FY2025 $3 million 商业收入对应 $17 million 收入成本，毛利率约为负 467%——符合资本密集型服务爬坡阶段的特征，即基础设施投入先于运营规模。Kodiak
              首个商业年应预期出现类似甚至更极端的负毛利。Aurora 的货运页面描述了资产轻 DaaS 路线：合作伙伴拥有、融资并维护实体卡车资产，Aurora 以及延伸到 Stack AV
              通过自动驾驶运营赚取按英里费用，而不是赚资产所有权回报。Aurora FY2023–FY2025 研发支出稳定在 $676–$745 million，说明商业规模 Level 4
              卡车平台的技术开发成本平台期处于每年 $600–$750 million 区间，Kodiak 当前资金规模远未达到这一完整规模。
