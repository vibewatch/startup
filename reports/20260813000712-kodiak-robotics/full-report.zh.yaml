      - number: '5.3'
        title: 产品差异化与 IP 位置
        blocks:
          - type: paragraph
            body: >
              Kodiak 最核心的技术差异是组织资产：创始团队（Salesky、Rander、Browning）在 Argo AI 累计了六年以上 AV 专项研发经验，包括 Miami 和 Austin
              真实公共道路上的自动驾驶出行部署。这个出身代表一套训练过的感知算法资产、安全方法论框架和工程流程 诀窍；新进入者要复制，可能需要数年时间和数亿美元投入。在 Aurora 和 Torc 之外，没有其他 Level
              4 AV 卡车初创公司拥有同等的创始团队履历。[CE016] [CE017]

              Kodiak 战略上只聚焦 SAE Level 4 高速长途卡车运输，不做城市 robotaxi、不做短途配送，也不做 Level 2/3 驾驶辅助；相比尝试更宽 ODD 的同行，这降低了产品运营复杂度。聚焦
              ODD 让公司可以更深入地验证较窄的一组驾驶场景——这是 Argo AI 乘用车多 ODD 开发经验中明确提炼出的教训。[CE018]

              Kodiak Driver + Kodiak Driver + Kodiak Dispatcher 作为自研层做垂直集成，使 Kodiak 能控制完整软件栈，不依赖 Apex.AI 或基于 ROS 的商业 AV
              中间件供应商；后者在商业规模上可能带来供应商锁定或授权风险。Bosch、NVIDIA 等一级技术供应商开发了宽泛的 AV 软件栈，Kodiak 要么授权使用其中部分组件，要么在垂直集成层与其竞争。[CE019]
              [CE020]

              Luminar 等供应商的 LiDAR 传感器技术已经显著进步，长距检测能力如今更贴合商用车应用。传感器供应商选择、集成方法和训练数据管线构成执行层差异化；这些差异外部不可见，却是关键尽调面。Daimler
              Truck 和其他 OEM 已投入 AV 集成项目，既可能成为合作方向，也可能成为竞争向量。[CE021] [CE036] [CE039]
            claimRefs:
              - CE016
              - CE017
              - CE018
              - CE019
              - CE020
              - CE021
              - CE036
              - CE039
      - number: '5.4'
        title: 信任、安全与合规框架
        blocks:
          - type: paragraph
            body: >
              Kodiak 的安全治理从安全顾问委员会开始。该委员会由五位前联邦机构领导人组成：Robert Sumwalt（NTSB）、Annette Sandberg（FMCSA）、David
              Kelly（NHTSA）、Christopher Doss（FBI）和 Don Osterberg（Schneider National）。这个外部机构提供战略监督和监管可信度，在商业化前 AV
              初创公司中并不常见。委员会的存在说明 Kodiak 正在为正式安全论证提交做准备，而不是只依赖内部验证。[CE023]

              美国自动驾驶卡车监管框架依赖对 NHTSA AV 政策框架（AV 4.0 及后续指引）的自愿合规；该框架鼓励但不强制要求上市前安全自评。FMCSA 规则约束商用卡车运营，并要求无人驾驶车辆取得豁免。SAE
              J3016 的 Level 4 定义限定了运行设计域：Level 4 系统必须在其 ODD 内完成全部驾驶任务，且无需人类兜底。[CE024] [CE025] [CE026]

              安全论证方法——用结构化论证和配套证据说明系统在限定 ODD 内足够安全——正在成为 Level 4 AV 卡车商业化前的事实门槛。Aurora Innovation 在 2025 年 4 月 Texas
              商业无人驾驶发布前公布了安全论证，为此类文件应包含的内容提供了公开标尺。截至 2026 年 Q1，Kodiak 尚未发布自愿安全自评或同等文件。[CE027] [CE028] [CE029]

              Kodiak 由安全驾驶员（运营专员）随车的运营方式，符合商业化前有监督 AV 测试协议。公司尚未提交 NHTSA 常设通用命令下的碰撞报告；该报告只要求达到特定阈值的 AV
              事故提交，这与当前规模下的开发阶段运营相一致。ISO 26262 功能安全和 ISO 21434 网络安全标准，是硬件和软件架构预期的合规框架，但正式认证状态尚未公开确认。[CE030] [CE027]

              Einride 2024 年获得 NHTSA 批准，可在美国公共道路上运行专门设计的无人驾驶电动卡车；这证明新型 AV 配置存在监管路径。不过每项批准都针对具体配置，Kodiak 的 Class 8
              高速卡车仍需与 NHTSA 和 FMCSA 单独沟通。[CE024] [CE025]
