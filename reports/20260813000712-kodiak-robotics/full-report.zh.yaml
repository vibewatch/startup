  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层
        blocks:
          - type: paragraph
            body: >
              Kodiak 的可触达客户基础由约 580,000 家活跃美国机动车承运商构成，它们共同争夺每年 $900B+
              的卡车运输市场。但在这个总体市场内，第一代自动驾驶卡车系统真正可执行的买方群体更窄：大型整车承运商（100+
              动力单元）以及有专属线路合同和采购基础设施、能够吸收多年试点周期的第三方物流供应商（3PL）。[CU001] [CU002]

              AV 卡车运输里的买方 / 用户 / 付款方分层，比典型 SaaS 销售更复杂。用户是运营卡车的承运商运营团队；买方通常是评估技术合作的承运商创新副总裁或 CDO；付款方是承运商的 P&L，并可能部分由 3PL
              订舱中介带来的货运收入抵消。Aurora 与 Uber Freight 的商业模式说明了 Kodiak 可能也需要复制的 3PL 中介付款结构：Uber Freight（管理 $17B+ 货运，服务 1/3 的
              Fortune 500 托运商）在 Aurora 无人驾驶运力上订舱。[CU003] [CU008]

              目标用例是 250 英里以上州际走廊上的枢纽到枢纽长途高速货运；这个场景的运营域可预测性最高，司机短缺痛点也最强。大型车队承运商和 3PL
              是战略买方群体，因为它们有专属线路量、能吸收试点成本的财务规模，以及在货站和调度层集成 AV
              系统的工程资源。零担（LTL）承运商和个体车主因多站路线复杂、规模经济不足，被结构性排除在初始可触达客群之外。[CU004] [CU005] [CU006]

              到 2026 年中，Kodiak 已披露 Atlas Energy Solutions
              是旗舰商业客户，并继续提及其他货运、工业和公共部门关系；但公开记录对最高知名度项目之外的经常性客户基础已经多元化到什么程度，仍然可见度有限。[CU007]
            claimRefs:
