      - number: '1.2'
        title: 创始人、领导层与治理班底
        blocks:
          - type: paragraph
            body: >-
              创始人与市场的匹配度，是 Kodiak 最清晰的优势之一。Don Burnette 创办公司前，曾参与 Google 自动驾驶项目、联合创立 Otto，之后又在 Uber
              的自动驾驶卡车业务任职。历史创始报道和最初的 Series A 公告也将曾任 Battery Ventures 的 Paz Eshel 列为联合创始人。这一组合让 Kodiak 创立之初同时具备直接 AV
              运营经验和风险市场搭建经验。

              Kodiak 准备上市时，治理深度明显增强。Surajit Datta 加入担任 CFO，Ken Goldman、Kristin Sverchek 和 Mohamed Elshenawy 于 2025
              年进入董事会。这些任命带来上市公司财务、交通平台和大规模 AV 系统经验，正是后期自动驾驶公司需要的能力。即便如此，公开材料仍把 Burnette
              放在战略设计者、技术可信度锚点和主要对外发言人的位置；班底更强了，关键人物依赖仍然不轻。
