      - number: '7.4'
        title: 风险摘要、缓释措施与放弃标准
        blocks:
          - type: paragraph
            body: >
              合并风险热力图显示四项剩余严重性为 Critical 的风险，每一项都可能打断投资逻辑：（1）FMCSA 无人驾驶豁免受阻，导致商业运营无法启动；（2）SoftBank 撤回资金，引发持续经营风险；（3）致命
              AV 碰撞引发监管停摆和责任级联；（4）Aurora 或 Waymo IP 禁令叫停部署。高剩余风险包括 50 州监管拼图、网络安全暴露、规模化 OTA 失败和关键人离职。中等剩余风险包括 EPA 排放不合规和
              OEM 集成延迟。[CR001] [CR002] [CR006] [CR014] [CR023] [CR026]

              缓释充分性差异很大。监管缓释偏弱——Kodiak 尚未公开与 FMCSA 接触以提交无人驾驶豁免申请，也没有披露专门的监管事务团队。IP 缓释尚未确认——尚未公布自由实施（FTO）分析或 Argo AI
              专利转让确认。财务缓释仅限于 $81M Series A 现金跑道。运营缓释相对成熟——团队的 Argo AI 背景提供了安全工程基础设施，但尚未发布第三方安全论证验证。[CR019] [CR033]
              [CR038]

              放弃标准可以被明确监控，应嵌入投资者监控框架。五个打断投资逻辑的事件是：（1）FMCSA 拒绝或无限期拖延无人驾驶豁免路径；（2）SoftBank 未在 18 个月内承诺 Series B；（3）发生可归因于
              Kodiak ADS 的致命 AV 碰撞；（4）Aurora 或 Waymo 发起 IP 禁令；（5）CEO 或 CTO 在第 1–3 年离职。二级监控触发项包括 Aurora
              商业化速度（投资逻辑标尺）、Luminar 财务健康度和各州 AV 立法日程。[CR014] [CR032] [CR033]

              尽调优先事项：（1）确认 FMCSA 豁免申请状态；（2）核验 Argo AI 前员工的 IP 转让；（3）OEM
              合同条款；（4）保险结构和限额；（5）网络安全审计；（6）持续经营披露审查；（7）用于判断监管可行性时间的 Aurora 货运量基准。
