      - number: '3.6'
        title: 图表与论据
        blocks:
          - type: callout
            title: Aurora 的持续经营风险也是行业风险
            body: >
              Aurora Innovation 每年 $600 million 运营亏损和持续经营披露，代表整个 Level 4 卡车行业的系统性风险。如果 Aurora 像 Embark 和 TuSimple
              一样，在实现商业规模收入前失败，Level 4 卡车声誉受损，可能让承运商在 12–24 个月内降低与任何 AV 供应商合作的意愿。Kodiak 的发布时间应纳入这一情景：等 Aurora
              证明持续商业可行性后再发布，可以降低技术风险；但发布时间过近，则可能共同暴露于 Aurora 早期事故带来的声誉风险。
            calloutType: insight
            claimRefs:
              - CP009
              - CP027
              - CP043
          - type: callout
            title: Waymo Via 退出，移走最危险的长期竞争者
            body: >
              Waymo 决定收缩 Via（卡车）业务，把短期格局中财务上最强的潜在竞争者移走。Alphabet 的资产负债表和 Waymo One 的世界级 AV
              技术，本可支撑持续亏损和在车队合作中激进抢地盘，这是资本受限的独立公司无法匹配的。Waymo Via 的缺席为 Kodiak 打开 2025–2030 年窗口，使其能在 Alphabet
              潜在重返前建立车队关系。投资者应监测 Waymo 在 Arizona 的卡车测试，将其作为重返领先指标。
            calloutType: insight
            claimRefs:
              - CP003
              - CP025
          - type: callout
            title: 竞争者退出验证了资本强度护城河
            body: >
              Embark 和 TuSimple 退出，反而强化了资金充足幸存者的投资逻辑；两家公司巅峰时拥有的公开资本都超过 Kodiak。经验证据显示，规模化商业 Level 4 AV 系统的成本为 $1–3
              billion 或更多，构成进入新竞争者的财务门槛。截至 2026 年中，商业阶段竞争场很可能已接近最终构成，关键问题不再是“市场有多拥挤？”，而是“剩下五家谁能活到商业规模？”
            calloutType: insight
            claimRefs:
              - CP002
              - CP026
              - CP027
              - CP042
          - type: callout
            title: Plus AI 的 ADAS 模式推迟承运商承诺完整 Level 4
            body: >
              Plus AI 商业成功的 SuperDrive ADAS 产品，给 Kodiak 带来间接竞争风险：它向车队运营商提供一个成本更低、风险更低、能提升司机表现的技术产品，从而降低承运商承诺 Level 4
              的紧迫性。已经支付 ADAS 订阅费的车队运营商，技术变更预算更少，也可能把 Level 4 视为未来升级。Kodiak 应跟踪 Plus AI 的承运商渗透率，把它作为 Level 4
              前窗口期车队运营商技术饱和度的代理指标。
