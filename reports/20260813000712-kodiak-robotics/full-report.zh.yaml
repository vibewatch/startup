      - number: '4.6'
        title: 财务风险与投资者考量
        blocks:
          - type: paragraph
            body: >
              Kodiak 投资者面对的财务风险主要有五类。第一，商业化延迟风险：技术成熟、监管许可或承运商采纳若推迟到 2028 年之后，收入前周期会被拉长，累计资本需求也会显著上升。Aurora 的路径——六年开发、约
              $3.5 billion 资本投入，才产生第一年 $3 million 收入——说明 Level 4 卡车业务跑到完整规模需要多深的资本。若 Kodiak 也需要类似资本厚度，盈利前总资金需求可能达到
              $1.5–$3 billion，远高于当前融资额。

              第二，资本市场准入风险：自动驾驶卡车公司要维持运营，已经表现出对股权市场环境的严重依赖。2022–2023 年 SPAC 泡沫破裂淘汰了 Embark Trucks（累计融资约 $614
              million，关停时商业收入为零），也让 Aurora 面临持续经营压力。若市场再次恶化，Kodiak 以可行条款融资 Series C 或后续轮次的能力会受到严重削弱。第三，Aurora 竞争锁定风险：如果
              Aurora 迅速扩大商业运营，并通过多年期 DaaS 协议锁定主要 TL 承运商——已披露伙伴包括 Werner Enterprises、Uber Freight、FedEx 和
              Hirschbach——Kodiak 商业化启动时可触达的合作伙伴池会收窄。第四，SoftBank 集中风险：据报道 SoftBank 占 Kodiak 承诺资本的大部分；SoftBank Vision Fund
              2 策略或基金表现一旦变化，可能减少跟投，或加入里程碑条件，压缩运营灵活性。第五，持续经营先例风险：Aurora FY2024 10-K 中的持续经营披露，是公开信号中最清楚的一项，说明 Level 4
              商业可行性需要持续的股权市场支持；Kodiak 作为阶段更早、没有公开财务披露的私营公司，也面对同样的结构性依赖，却没有 SEC 注册报告带来的透明度优势。
