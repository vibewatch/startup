      - number: '8.2'
        title: 估值情景与可比分析
        blocks:
          - type: paragraph
            body: >
              Kodiak 的可比公司集合很薄，也不完美。唯一直接 AV 卡车上市可比公司 Aurora Innovation (AUR)，市值 $15.12B，对应 FY2025 收入 $3M——隐含收入倍数约
              5,040x，反映的是纯期权价值，而不是当前财务表现。 Aurora 从 $5.71B (June 2025) 重估到 $15.12B (May 2026)，动力来自 April 2025 商业无人驾驶上线和
              McLane/Hirschbach 公告，说明市场会给第一个商业化上线催化剂极高的非线性价值。[CV016] [CV017] [CV018] [CV026]

              Mobileye (MBLY) 市值 $8.44B，FY2025 收入 $1.89B（约 4.5x P/S），为 Kodiak 达到商业规模后的收入倍数 提供下限。Aurora 5,040x 的期权价值倍数与
              Mobileye 4.5x 的成熟收入倍数之间，就是 Kodiak 必须走完的估值弧线： $750M–$1B 的收入前入场估值，意味着市场已计入到达商业规模的显著概率，但相对 Aurora
              当前溢价仍有大幅折价。[CV019] [CV025] [CV026] [CV027]

              TuSimple 的轨迹仍是任何 Kodiak 情景模型的警示锚点。April 2021 以 $1.1B IPO、峰值估值 $8.5B，January 2024 以 $0.30/share
              自愿退市——从峰值到谷底跌幅 >99%——这就是一家无法把资本转成商业运营的 AV 卡车公司已经 兑现的下行。Goldman Sachs 分析师 Mark Delaney 维持对 Aurora $5 的 Hold
              目标价（较 May 2026 水平下行 35%），代表即便是已商业化上线的龙头，也存在悲观离群观点。[CV020] [CV021] [CV022] [CV024]

              Waymo 在 2024 Alphabet 融资轮中估值约 $45B，树立了赛道天花板，但并非直接可比公司（自动驾驶出租车、Alphabet 支持、没有卡车 AaaS 模型）。Kodiak Robotics
              是最接近的私有 AV 卡车可比公司，但自 2021 Series B 后未披露估值， 也没有商业化部署的无人驾驶车队。[CV023] [CV024]
