      - number: '6.6'
        title: 证据展项
        blocks:
          - type: callout
            title: 工会和个体车主反对限制大型承运商买方基盘
            body: >
              Teamsters 民调（83% 的 Pennsylvania 选民对无人驾驶半挂卡车感到不安）和 OOIDA 对缺少人类安全员要求的无人驾驶 AV
              立法进行有组织反对，都不是边缘信号——它们反映的是结构化、资源充足且拥有立法关系的倡议力量。任何与 Teamsters 签有合同的 Kodiak 目标承运商，在采用 AV
              时都会面对内部反对，从而把近期可触达市场结构性压缩到非工会或获工会豁免的承运商群体。尽调必须绘制 Kodiak 潜在承运商伙伴的工会化率。
            calloutType: risk
            claimRefs:
              - CU028
              - CU029
          - type: callout
            title: 具名客户证据缺口符合阶段特征，但必须主动尽调缓释
            body: >
              截至 2026 年中，Kodiak 具名客户证据为零，这与其商业化前开发阶段一致——Aurora 自己也是到商业测试阶段较深时才宣布具名承运商伙伴。不过，这个缺口是尽调风险，不是验证加分项：缺少已披露的
              LOI、承运商引荐或试点协议，意味着分析无法确认商业客户获取已经开始。投资者应通过行业网络做承运商参考访谈，并要求管理层提供任何未披露意向书，作为尽调条件。
            calloutType: insight
