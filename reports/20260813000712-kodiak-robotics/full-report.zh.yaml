  - id: TM004
    title: 增长驱动因素与约束因素表
    description: Key growth drivers and adoption constraints for the autonomous trucking market, with timing and diligence asks.
    columns:
      - 驱动因素 / 约束因素
      - 方向
      - 时间
      - Kodiak 启示
      - 尽调问题
    rows:
      - - 结构性司机短缺与招聘难
        - 驱动因素（正向）
        - 近期（2024–2030）
        - 承运商更容易算过 AV 部署 ROI；从车队经济性看，自动化阻力下降
        - 量化每季度实际空缺 CDL 岗位数；评估司机供给的区域差异
      - - FMCSA 服务时长（HOS）生产率上限
        - 驱动因素（正向）
        - 持续 / 监管基线
        - AV 绕过 11 小时/14 小时窗口和每周 60/70 小时上限；长途线路吞吐量相较合规人类司机可释放约 50% 增量
        - FMCSA 是否已经发布或提议适用于 Level 4 运营的 AV 专属 HOS 豁免框架？
      - - EPA Phase 3 GHG 要求（MY2032 年 ZE 销售占比 40%）
        - 驱动因素（正向）
        - 2027–2032（爬坡）
        - 推动 OEM 和车队投资零排放 Class 8 卡车；AV 系统更适合按续航最优管理 ZE 路线；可能加速 AV+ZE 捆绑部署
        - OEM 电动化时间线与 Class 8 AV 系统集成时间线如何匹配？
      - - 货运量长期增长（FHWA FAF 2050 预测）
        - 驱动因素（正向）
        - 长期（2025–2050）
        - 关键州际走廊上的货运吨英里增加，提升固定 ODD AV 系统的利用率经济性；降低盈亏平衡所需线路密度
        - FHWA 货运预测是否按走廊拆分，以识别最适合自动驾驶部署的高密度线路？
      - - 联邦 / 州监管碎片化（无统一 AV 框架）
        - 约束因素（负向）
        - 近期（2024–2028）
        - 每条跨州线路都要满足多个州许可制度；没有联邦优先立法，全国部署规模会被拖慢
        - NHTSA 或国会是否推进过针对商业 AV 卡车运营的联邦优先提案？
      - - AV 保险与责任框架刚起步
        - 约束因素（负向）
        - 近期（2024–2028）
        - 保险公司缺少 Level 4 卡车精算数据；早期部署规模下保费可能高到难以承受；多方碰撞事故中承运商责任敞口未定义
        - 按现行州法，Level 4 AV 事故中谁承担碰撞责任？是否已有承运商获得 AV 专属商业保险？
      - - 传感器硬件成本（2025 年价格约 $50,000 / 车）
        - 约束因素（负向）
        - 中期（下降中）
        - 当前价格限制单车经济性和部署速度；LiDAR / 摄像头价格预计下降，到 2027–2030 年会削弱这道门槛
        - 当前传感器成本曲线如何？AV 卡车在 500 辆车队中实现正向单位经济性，需要降到多少 $/车？
      - - 公众信任与安全事故风险
        - 约束因素（负向）
        - 持续
        - 一起公开致死事故或重大事件，就可能触发多州暂停；监管时间表对公众感知很敏感；NHTSA SGO 要求 24 小时事故报告
        - NHTSA 常设通用命令数据是否已披露任何 Level 4 卡车事故？Aurora 自 2025 年 5 月上线以来事故率是多少？
