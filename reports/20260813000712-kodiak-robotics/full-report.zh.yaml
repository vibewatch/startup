      - number: '1.3'
        title: 融资历史、上市与资本环境
        blocks:
          - type: paragraph
            body: >-
              Kodiak 的资本形成路径已从风险融资走向公开市场融资。公司 2018 年宣布由 Battery Ventures 领投的 $40 million Series A，2021 年又完成超额认购的 $125
              million Series B，使当时披露融资额达到 $165 million。早期轮次支持车队增长和商业化工作，但即便在 2021 年，报道也已清楚说明，Kodiak 扩张还需要更多资本。

              2025 年 4 月，Kodiak 宣布以约 $2.5 billion 投前股权价值与 Ares Acquisition Corporation II 进行业务合并。公告提到，新老投资者承诺融资超过 $110
              million，信托账户现金约 $551 million，同时 Atlas 承诺初始订购 100 辆卡车。经历赎回后，Kodiak 和 AACT 于 2025 年 9 月表示，该交易仍募得超过 $275
              million。

              上市没有消除融资风险。2026 年 5 月，Kodiak 又通过 PIPE 融资 $100 million，但 TechCrunch 报道称，股票以大幅折价出售，盘后股价下跌
              37%。这个反向信号说明，投资者愿意继续给公司资金，但只愿意以明显低于市场报价的保守价格进入。
