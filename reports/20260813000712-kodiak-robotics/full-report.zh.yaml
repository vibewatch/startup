      - number: '2.4'
        title: 增长驱动与市场约束
        blocks:
          - type: paragraph
            body: >
              自动驾驶卡车最持久的增长驱动，是结构性司机短缺。American Trucking Associations 已连续多年把司机供给列为行业首要问题；ATA 新闻稿记录了即便工资上涨，承运商仍难以吸引和留住合格
              CDL 持有人。FMCSA 工时规则把载货司机限制在 14 小时工作窗口内最多驾驶 11 小时，连续驾驶 8 小时后必须休息 30 分钟，并设有每周 60/70 小时上限。自动驾驶卡车在自己的 ODD
              内可连续运行，消除了这些生产率上限，在长途路线上相对人工驾驶车辆拥有理论上 50–100% 的吞吐优势。

              EPA Phase 3 GHG 标准于 2024 年通过 Federal Register 规则制定最终确定，要求从 2032 车型年开始，新的 Class 8 重型车销售中 40% 为零排放。这让 AV
              采用与电动化之间产生融合压力：自动驾驶系统更适合管理电池电动卡车的续航优化路线，可能加快 OEM 和投资 ZE 基础设施的车队采用 AV 平台。货运量增长是长期顺风；FHWA Freight Analysis
              Framework 预计美国货运将持续增长至 2050 年，主要州际走廊的货量预计会持续增加。

              约束包括监管碎片化（Level 4 卡车没有统一联邦框架）、保险责任标准仍早期、传感器硬件成本高（2025 年价格约 $50K /
              车），以及公众信任风险。乘用车自动驾驶早期事故引发的监管涟漪已经说明，单起高关注安全事故就可能拖慢多个州的监管时间表。
