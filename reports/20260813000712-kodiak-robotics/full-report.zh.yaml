      - number: '3.4'
        title: 能力对比与功能分析
        blocks:
          - type: paragraph
            body: >
              Aurora、Torc 和 Kodiak 都瞄准美国公共州际高速公路上 Class 8 卡车的 SAE Level 4，与 Kodiak 处在同一 ODD 类别。截至 2026 年中，只有 Aurora
              证明了不配安全员的持续商业运营。主要长途 AV 竞争者都没有发布外部分析师可访问、经独立验证的安全里程、接管率或审计安全表现基准；NHTSA 的 Standing General Order
              要求上报碰撞事故，但不要求按里程基准化。这种信息不对称意味着，直接性能比较只能依赖里程碑公告和代理信号，而不是已验证指标。

              Kodiak 的差异化定位来自：（1）继承 Argo AI 技术，包括传感器套件和感知技术栈；该项目曾获得 Ford 和 Volkswagen 约 $3.6 billion 总投资；（2）由 Bryan
              Salesky（Argo AI CEO）和 Peter Rander（Argo AI COO）带领的创始团队，以及约 40+ 名 Argo AI 前员工形成的组织连续性；（3）不带 robotaxi
              技术债的货运专注创始身份；（4）来自 Sequoia Capital 的 Series A 融资。主要能力尽调缺口在于，Kodiak 没有发布可与 Aurora 对比的 Safety Case Framework
              或 VSSA，因此难以独立比较安全架构。

              Torc 的 OEM 集成路线不同于 Kodiak 和 Aurora 的可移植软件技术栈：Torc 在 Freightliner 硬件内共同开发，集成更紧，但可寻址卡车受限。Gatik 和 Einride
              证明今天可以产生商业收入，但它们的 ODD（固定中程路线；私有工业走廊）比 Kodiak 面向开放高速公路的目标简单得多。
