  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sizing-gap
      missingEvidence: >-
        Segment-level average selling prices, qualified customer volumes, contract durations,
        utilization, and product mix needed to estimate revenue TAM, SAM, or SOM.
      whyItMatters: >-
        Nameplate capacity cannot be converted into market share, revenue, or valuation without
        commercial and operating assumptions.
      diligencePath: >-
        Obtain the customer pipeline, transferred order schedules, site utilization plan,
        pricing sheets, and bottom-up segment model from management and validate them against
        signed contracts.
      relatedQuestionRefs: [QM003, QM008]
      relatedTableRefs: [TM002]
