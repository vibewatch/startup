callouts:
  - calloutType: "risk"
    title: "Capital Intensity of European Gigafactory Restarts"
    body: "Acquiring Northvolt's manufacturing infrastructure in Sweden and Poland provides Lyten with 16 GWh of cell capacity and Europe's largest BESS plant at a steep discount to historical book value ($5B). However, restarting idle gigawatt-scale production lines, hiring more than 600 workers, and retrofitting facilities to handle new battery chemistries requires substantial recurring cash burn that could rapidly deplete equity reserves in the absence of customer advance payments or binding commercial off-take agreements."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
  - calloutType: "insight"
    title: "Divergence Between Third-Party Estimates and Audited Reporting"
    body: "While market aggregators such as GetLatka publish estimated 2025 revenue figures of $110 million ARR, primary source analysis reveals that Lyten does not publicly release audited financial statements, revenue breakdowns, or gross margin figures. Underwriters and diligence analysts must treat private-market revenue models as speculative proxies rather than verified operational performance."
    claimRefs:
