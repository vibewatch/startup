chapter:
  number: 5
  title: "Product & Technology"
  summary: "Lyten now presents a broad battery and materials platform: Voltpack mobile storage for stationary use, lithium-sulfur cells for weight-sensitive autonomous systems, NMC cells for mobility, and 3D Graphene-derived materials. The technical record shows credible prototype engineering and candid historical failure modes, but current third-party durability, qualification, certification, and post-acquisition quality evidence remains insufficient to treat the platform as fully production-proven."
sections:
  - id: "portfolio-and-workflows"
    title: "Portfolio spans distinct customer workflows"
    body: >-
      Lyten's current product surface is not a single lithium-sulfur offering. It positions the Voltpack
      Mobile System for data-center, stationary, behind-the-meter, and grid-backup workflows; lithium-sulfur
      cells for drones, robotics, and other autonomous systems where mass matters; and NMC cells for electric
      vehicles, defense vehicles, and fleets. The same 3D Graphene materials platform also feeds concrete,
      sensing, printing, and adhesive products. This breadth creates optionality, but it also means maturity
      must be assessed product by product: the public evidence does not establish that battery-system,
      cell-chemistry, and advanced-material lines share the same qualification stage, customer acceptance,
      or support model.
    claimRefs: ["CE001", "CE002", "CE003", "CE016"]
    tableRefs: ["TE001"]
  - id: "cell-architecture-and-maturity"
    title: "The cell design is specific; commercial durability remains the constraint"
    body: >-
      The lithium-sulfur design is technically concrete rather than a generic graphene claim. Lyten-authored
      workshop materials describe a sulfur-infused 3D Graphene cathode, protected composite lithium anode,
      proprietary electrolyte, coated separator, cell-design controls, and formation protocols intended to
      contain polysulfide shuttle and dendritic failure. Historical performance also exposes the maturity
      boundary. A 2023 workshop deck reported six third-party pouch cells that reached no more than 110
      cycles before soft shorting, while a 2025 deck listed a May 2024 pouch specification of 248 Wh/kg and
      at least 238 cycles to 70% capacity under stated test conditions. These are meaningful prototype
      results, not proof of current automotive or grid-life qualification.
    claimRefs: ["CE004", "CE005", "CE006", "CE007", "CE008"]
    tableRefs: ["TE002"]
    figureRefs: ["FE001"]
  - id: "manufacturing-reliability-and-controls"
    title: "Scale assets increase execution capacity and quality exposure"
    body: >-
      Lyten's April 2025 technical presentation said its pilot line used conventional production equipment,
      had produced more than 5,500 cells, and had an 80% lifetime average yield, with daily yields as high as
      93%. The same deck reported that one of two tested 18650 cells entered thermal runaway during
      third-party crush or impact testing, despite broader pouch-cell passes. Since then, the product system
      has expanded through acquired Northvolt assets: the Gdansk site was described as capable of ramping to
      6 GWh and later 12 GWh for Voltpack production, while Reuters documented both the planned restart and
      Northvolt's prior customer-quality criticism. Capacity is therefore visible, but current yield,
      certification, field reliability, inherited quality remediation, and the status of the planned ISS
      qualification campaign remain material diligence items.
    claimRefs: ["CE009", "CE010", "CE011", "CE012", "CE013", "CE014", "CE015"]
    tableRefs: ["TE003"]
