evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-statements
    missingEvidence: >-
      Audited financial statements confirming revenue, cash burn, gross margins, and operating expenses across fiscal
      2024 through 2026.
    whyItMatters: >-
      Without audited financial statements, independent valuation modeling cannot substantiate third-party ARR estimates
      or verify operational cash runway.
    diligencePath: >-
      Obtain confidential information memorandum (CIM) or auditor review reports during formal investor data-room
      diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Complete executive officer roster and verified subsidiary legal representatives across European operating
      entities.
    whyItMatters: Partial public disclosures leave subsidiary governance and historical founding officer transitions unverified.
    diligencePath: Inspect commercial register filings in California, Luxembourg, Sweden, and Poland.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Exhaustive capitalization table disclosing share class ownership percentages, liquidation preferences, and debt
      covenants.
    whyItMatters: Sample disclosure conceals exact economic rights and voting control among strategic corporate partners.
    diligencePath: Review formal cap table schedule in confidential diligence data room.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Segment-level average selling prices, qualified customer volumes, contract durations, utilization, and product mix
      needed to estimate revenue TAM, SAM, or SOM.
    whyItMatters: >-
      Nameplate capacity cannot be converted into market share, revenue, or valuation without commercial and operating
      assumptions.
    diligencePath: >-
      Obtain the customer pipeline, transferred order schedules, site utilization plan, pricing sheets, and bottom-up
      segment model from management and validate them against signed contracts.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Independent commercial-format lithium-sulfur test data covering cycle life, safety, energy density, yield, and
      levelized cost for each target application.
    whyItMatters: >-
      Application fit and qualification timing cannot be underwritten from company positioning or a low-reputation
      market summary alone.
    diligencePath: >-
      Request third-party laboratory reports, OEM qualification protocols, warranty assumptions, and production-lot
      yield histories tied to the cells offered to customers.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: private-evidence-only
    severity: material
    topic: demand-risk
    missingEvidence: >-
      Transferred customer contracts, repeat shipment history, factory utilization, warranty performance, site-level
      restart budgets, and contribution margin.
    whyItMatters: >-
      These data determine whether acquired capacity represents a viable operating business or a capital-intensive
      option with uncertain demand.
    diligencePath: >-
      Review executed customer agreements, monthly shipment and yield records, warranty data, working-capital forecasts,
      and board-approved restart budgets by site.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: customer-offtake
    missingEvidence: >-
      Binding commercial off-take agreements or customer volume delivery figures for Lyten's BESS units or
      lithium-sulfur cells.
    whyItMatters: >-
      Evaluating competitive traction against incumbents requires verified commercial shipments rather than plant
      equipment capacity.
    diligencePath: >-
      Request customer contracts, shipment records, or delivery confirmations for Voltpack Mobile System units from
      Gdańsk.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: cycle-life-verification
    missingEvidence: >-
      Independent third-party laboratory test data validating commercial-scale pouch cell cycle life for Lyten's
      lithium-sulfur chemistry.
    whyItMatters: >-
      Independent industry analyses document 200-500 cycle limits in commercial Li-S cells due to polysulfide shuttling,
      directly conflicting with multi-thousand cycle requirements.
    diligencePath: >-
      Obtain independent certification reports from certified test agencies evaluating commercial-format Lyten Li-S
      cells under standard C-rate discharge.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: audited financial disclosure
    missingEvidence: >-
      Audited financial statements including income statement, balance sheet, cash flow from operations, and gross
      margins by product line.
    whyItMatters: >-
      Without audited figures, revenue scale, operating cash burn rate, and gross margin viability cannot be
      independently validated.
    diligencePath: Request audited GAAP financial statements under confidential non-disclosure agreement during formal diligence.
    relatedQuestionRefs:
      - QI004
      - QI008
  - type: missing-source
    severity: material
    topic: EXIM Bank loan status
    missingEvidence: >-
      Formal conversion documentation of the $650M Export-Import Bank Letter of Interest into an executed, binding
      credit facility.
    whyItMatters: Non-binding LOIs do not guarantee capital disbursement and may expire or fail final underwriting conditions.
    diligencePath: Review formal loan commitment documents, debt covenants, and drawdown prerequisites with EXIM Bank officers.
    relatedQuestionRefs:
      - QI005
  - type: conflicting-data
    severity: material
    topic: commercial cycle life validation
    missingEvidence: >-
      Independent third-party validation reports proving commercial lithium-sulfur cell cycle life under standard
      automotive and grid operating protocols.
    whyItMatters: >-
      Lab claims of high cycle life conflict with industry data showing 200 to 500 commercial cycle limits, impacting
      bankability.
    diligencePath: >-
      Obtain independent testing lab reports (e.g., UL, DNV) measuring pouch cell degradation curves under standard
      charge-discharge C-rates.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: missing-source
    severity: material
    topic: space-qualification
    missingEvidence: >-
      Current launch status, on-orbit telemetry, completion status, and post-flight analysis for the planned SOLSTISE
      campaign.
    whyItMatters: The campaign was presented as a path toward TRL-7, so its outcome materially changes aerospace readiness.
    diligencePath: >-
      Request the mission identifier, launch manifest, telemetry summary, and qualification report from Lyten and its
      integration partners.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: quality-and-compliance
    missingEvidence: >-
      Current product-by-product safety certifications, quality-system certifications, reliability reports, warranty
      data, field returns, cybersecurity controls, and privacy controls where software is involved.
    whyItMatters: >-
