      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports capacity lenses, not a defensible revenue TAM, SAM, or SOM. Lyten's Poland
              facility is equipped for 6 GWh of BESS manufacturing with a stated expansion path to 12 GWh, while the
              acquired Swedish assets include 16 GWh of existing battery manufacturing capacity. A Skelleftea
              data-center site may scale to 1 GW, but that is potential powered-land capacity rather than battery
              demand, commissioned load, or contracted sales. The company homepage separately displays 1.3 GW of
              data-center power and 6.5 GWh of BESS manufacturing without publishing the methodology needed to reconcile
              those figures with the site-level disclosures. None of these measures can be multiplied into revenue
              without utilization, product mix, average selling price, qualified demand, and contract-duration data. The
              resulting market model should remain scenario-based until those inputs are available.
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM011
              - CM014
      - number: '2.3'
        title: Buyers, budgets, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Budget ownership changes by segment. Facilities, energy, or resilience teams can sponsor modular BESS when
              uptime, local power constraints, or behind-the-meter control justify the spend. Data-center developers can
              fund powered-land infrastructure, but their capital does not automatically become a battery order. Defense
              and autonomous-system programs may accept a higher battery cost when lower weight improves mission
              capability, making them a more credible early lithium-sulfur beachhead than price-sensitive grid storage.
              Automotive and fleet programs offer scale but require longer qualification and repeatable yield. Lyten's
              near-term sequence therefore depends on restarting conventional BESS and NMC output while lithium-sulfur
              progresses through application-specific qualification. Public support for local battery supply and
              European energy resilience can accelerate site development, but it does not replace customer validation or
              operating economics.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM012
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM012
              - CM013
              - CM016
      - number: '2.4'
        title: Adoption constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The principal constraint is execution, not a shortage of broad demand narratives. Reuters reported that
              Northvolt once held an order book above $50 billion yet still failed after quality and scale-up problems,
              showing that announced demand cannot offset poor yield. Battery-Tech similarly reports that Morrow began
              deliveries before running out of liquidity. For lithium-sulfur, the available analyst source places
              commercial cycle life below the multi-thousand-cycle range expected for grid BESS; this is directional,
              low-confidence evidence rather than an independently validated Lyten performance result. Investors should
              therefore value qualified output, transferred contracts, repeat shipments, warranties, utilization, and
              contribution margin more heavily than nameplate capacity or generic market forecasts. Until those data are
              disclosed, the acquired footprint creates strategic option value but also exposes Lyten to factory-ramp,
              working-capital, and management-bandwidth risk.
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capacity is not demand
            body: >-
              The 6 GWh, 12 GWh, and 16 GWh figures describe equipment or acquired capacity. They do not establish
              utilization, qualified shipments, transferred orders, or gross margin.
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM015
          - type: callout
            title: Underwrite milestones, not a generic battery TAM
            body: >-
              Gate valuation upside on repeat BESS deliveries, Swedish NMC yield and qualification, independently
              validated lithium-sulfur durability, and disclosed contract economics.
            calloutType: recommendation
            claimRefs:
