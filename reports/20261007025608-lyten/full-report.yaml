chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Lyten was founded in 2015 and maintains its global headquarters in San Jose, California, alongside a
              European headquarters in Luxembourg. The company commercializes a proprietary tunable material platform
              termed Three-Dimensional Graphene (3DG), derived by capturing carbon from methane feedstocks. Rather than
              remaining an early-stage materials science licensing vehicle, Lyten operates a vertically integrated
              industrial model spanning material synthesis, electrode formulation, lithium-sulfur battery cell
              fabrication, and modular battery energy storage systems (BESS). The core strategic premise rests on
              substituting scarce or geopolitically constrained cathode minerals—notably nickel, manganese, cobalt, and
              mined graphite—with sulfur and carbon-based 3D graphene architectures designed to achieve high energy
              densities while localizing North American and European supply chains. Complementary business segments
              operated under the LytwrX R&D umbrella market 3DG additives for concrete, structural composites,
              lightweight polymer additives, and sensor devices.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO009
              - CO010
              - CO011
              - CO014
              - CO015
      - number: '1.2'
        title: Executive Leadership, Governance, and Corporate Organization
        blocks:
          - type: paragraph
            body: >-
              Lyten's corporate structure combines Silicon Valley executive management with regional operating
              subsidiaries across North America and Europe. The company is led by Chief Executive Officer and Co-Founder
              Dan Cook, who guides the firm's strategic expansion, capital formation, and major transactional
              activities. Regional European operations are organized under dedicated legal entities, including Lyten
              Poland led by Robert Chryc-Gawrychowski, who formerly served as CEO of Northvolt Poland and oversaw the
              initial design and construction of the Gdańsk BESS facility. Company governance balances transatlantic
              industrial perspectives across its board of directors, reflecting strategic investment from major
              strategic partners including Stellantis, FedEx, Honeywell, and European public funds. Unofficial
              third-party industry directories present conflicting executive listings naming alternative leadership
              figures, emphasizing the necessity of verifying corporate officer designations against primary legal
              filings.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
