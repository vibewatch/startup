      - number: '1.4'
        title: Industrial Scaling Footprint and Milestone Evolution
        blocks:
          - type: paragraph
            body: >-
              Between 2024 and 2026, Lyten transitioned from pilot-scale domestic manufacturing in California to
              operating a multi-national manufacturing and industrial hub network. A major pivot occurred following the
              March 2025 bankruptcy of Swedish battery manufacturer Northvolt AB, after which Lyten entered binding
              agreements to acquire key European assets totaling approximately $5 billion in original asset book value.
              In October 2025, Lyten finalized the acquisition of Northvolt Dwa in Gdańsk, Poland—a 270,000-square-foot
              BESS manufacturing plant equipped for 6 GWh to 12 GWh of capacity—restarting commercial production of the
              Voltpack Mobile System. In July 2026, Lyten signed an exclusive Memorandum of Understanding (MoU) with
              German promotional bank KfW and state authorities to acquire the Northvolt Drei 110-hectare gigafactory
              project near Heide, Germany. These extensive acquisitions represent a high-stakes operational bet on
              rehabilitating distressed European clean-tech assets.
