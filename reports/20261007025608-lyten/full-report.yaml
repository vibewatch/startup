    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - Sweden adds 16 GWh of existing manufacturing capacity and a major R&D center.
        - Verified production yield and recognized commercial sales from restarted lines.
      - - Thesis
        - At least $200M of 2025 equity was reported in connection with acquisition-led expansion.
        - Closing statements and a sources-and-uses schedule showing adequate funded runway.
      - - Anti-thesis
