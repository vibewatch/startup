  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Lyten spans three commercially distinct markets rather than one homogeneous battery TAM. The immediate
              boundary includes modular BESS for commercial, industrial, data-center, and behind-the-meter use; NMC
              cells from the restarted Swedish assets for BESS and mobility; and lithium-sulfur cells for
              weight-sensitive drones, robotics, satellites, and defense systems. Generic global battery demand,
              data-center construction spending, concrete additives, and other 3D-graphene products are adjacencies, not
              battery revenue addressable by the same product or sales process. Status-quo substitutes also differ:
              mature LFP systems compete in stationary storage, incumbent lithium-ion chemistries compete in vehicles,
              and conventional generators or grid reinforcement compete for resilience budgets. This boundary prevents
              infrastructure headlines from being counted as product demand and keeps the analysis tied to buyers that
              can actually qualify and procure Lyten products.
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM007
              - CM013
