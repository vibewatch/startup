  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Rule, approval, or legal area
      - Jurisdiction / scope
      - Public status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Product-safety and transport approvals
        - US and EU products; exact regimes not established in assigned evidence
        - Company-authored preliminary abuse tests on 1.5 Ah cells; larger-cell full test suite was planned
        - Medium; evidence-limited
        - High
        - 'Early: preliminary tests disclosed'
        - No independent certification matrix or complete larger-cell report in the assigned sources
        - >-
          Request applicable approval list, issuing bodies, certificates, test reports, exceptions, and renewal dates by
          product
      - - Environmental, worker-safety, and facility compliance
        - San Jose baseline plus enlarged US/EU footprint
        - 2024 data covered San Jose; formal EHS-MS was still under development
        - Medium; footprint has expanded
        - High
        - 'Developing: policies, training, and management-system work are described'
        - No plant-by-plant permits, audit findings, or current incident record in the assigned sources
        - >-
          Review permits, regulator correspondence, audit findings, corrective actions, and incident logs for every
          operating site
      - - Secondary securities structure and liquidity
        - US accredited-investor StartEngine series offering
        - Investor buys series membership interests linked to Lyten common stock, not direct Lyten shares
        - Structural illiquidity
        - High for secondary investor; limited direct operating effect
        - 'Disclosed: transfer, valuation, fee, and loss warnings are stated'
        - Economic rights may differ from Lyten shares, costs reduce proceeds, and exit timing is uncertain
        - >-
          Review series documents, cap-table position, fees, transfer restrictions, preference stack, and valuation
          basis
    notes: >-
      Partial public-source register, ordered by analyst-assessed severity. Likelihood labels are qualitative and
      evidence-limited; no absence-of-incident inference is made.
