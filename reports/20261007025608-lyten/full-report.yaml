      - number: '1.3'
        title: Capital Structure, Financing, and Strategic Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Lyten has raised more than $625 million in cumulative equity investment from an international consortium
              of corporate strategics and institutional venture funds, including Stellantis, FedEx, Honeywell, Nokia,
              Prime Movers Lab, the European Investment Fund, and the Luxembourg Future Fund. Company disclosures assert
              that no individual external investor holds greater than a 5% equity stake, establishing a fragmented cap
              table devoid of a single controlling corporate sponsor. In addition to equity financing, Lyten secured
              Letters of Intent (LOIs) for up to $650 million in export-credit debt financing from the Export-Import
              Bank of the United States (EXIM Bank). Secondary private trading venues indicate pricing discovery
              mechanisms, though liquidity remains subject to restricted accreditation standards and OTC alternative
              trading system rules. Independent trackers aggregate differing round amounts up to $1B when including
              non-dilutive government grants and European regional assistance packages.
