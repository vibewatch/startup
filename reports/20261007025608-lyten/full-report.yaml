  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The lithium-sulfur product stack runs from tunable active material through cell components and formats to
      application-level qualification.
    data:
      layers:
        - label: Material platform
          detail: 3D Graphene morphology and surface chemistry are tuned for the target application.
          modules:
            - 3D Graphene
            - Sulfur host
          outputs:
            - Cathode active material
        - label: Cathode
          detail: Sulfur-infused 3D Graphene and aqueous binder are coated on conventional equipment.
          modules:
            - 3DG-sulfur composite
            - Binder
            - Conductive framework
          outputs:
            - High-loading cathode
        - label: Anode
          detail: Lithium composite structures and protective coatings target corrosion and dendritic failure.
          modules:
            - Lithium composite
            - Protective coating
          outputs:
            - Protected anode
        - label: Electrolyte and separator
          detail: Electrolyte formulations and coated separators target shuttle control and low electrolyte loading.
          modules:
            - Electrolyte
            - Coated separator
          outputs:
            - Managed ion transport
        - label: Cell formats
          detail: The components are assembled into pouch, 18650, and 21700 formats using conventional line equipment.
          modules:
            - Pouch
            - '18650'
            - '21700'
          outputs:
            - Prototype and sample cells
        - label: Qualification and deployment
          detail: >-
            Application testing, production yield, and safety controls determine readiness for autonomous, aerospace,
            and mobility use.
          modules:
            - Abuse testing
            - Cycle testing
            - Customer qualification
          outputs:
            - Qualified product by use case
    approximationNotes: >-
      Conceptual stack reconstructed from company-authored technical materials; it is not a disclosed production bill of
      materials.
