  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure / monitor
    rows:
      - - Automotive qualification and offtake
        - Stellantis development relationship; BMW and former Northvolt customers as prospective buyers
        - No binding volume commitment was established in assigned sources
        - Validation or commercial terms fail and vehicle programs select other suppliers
        - Thesis-breaking
        - Demonstrate consistent low-volume quality before broad ramp; diversify applications
        - Monitor signed awards, qualification stage, committed volume, price, warranty, and cancellation rights
      - - Growth capital and facility funding
        - Private-investor syndicates, potential grants, and undisclosed acquisition financing
        - Reuters reported substantial additional funding need; purchase price was not disclosed
        - Capital arrives late or on dilutive/restrictive terms while fixed costs rise
        - Thesis-breaking
        - Stage capex to contracted demand and secure committed facilities before expansion
        - Monitor audited cash, burn, capex, debt, covenant headroom, draw conditions, and runway
      - - Poland industrial-hub partnerships
        - Public and private partners, infrastructure and utility providers
        - March 2026 status was a feasibility study, not a completed financing or construction decision
        - Required infrastructure, utility capacity, or public-private funding does not materialize
        - High
        - Use milestone-gated feasibility, permitting, financing, and build decisions
        - Monitor permits, utility agreements, committed counterparties, financing close, and construction notice
      - - Vertically integrated operating scope
        - Internal and external dependencies across minerals, electrodes, cells, packs, and systems
        - Official site describes broad integration; supplier and stage-level concentration are not disclosed
        - A bottleneck or quality issue in one stage delays multiple product lines
        - High
        - Dual-source critical inputs, qualify alternate processes, and track stage-level yield
        - >-
          Request supplier concentration, sole-source inputs, qualification lead times, inventory buffers, and recovery
