  - id: TV003
    title: Bull / base / bear scenarios
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks and probability signal
    rows:
      - - Bull
        - Commercial cells ship from Sweden, Poland output is validated, and binding customers support utilization.
        - >-
          Potential upside to the $1.29B reference only after audited contribution economics; no numeric range is
          supportable.
        - Low-evidence signal until deliveries and customer acceptance are independently verified.
      - - Base
        - Restart progresses but utilization, margins, and retrofit capital remain only partly disclosed.
        - Use $1.29B solely as a negotiation anchor and pay no unverified execution premium.
        - Most supportable public-evidence case; trigger is continued absence of audited economics.
      - - Bear
        - Restart delays, quality remediation persists, or additional senior capital is required.
        - Material impairment below the reported mark is plausible, but cannot be quantified from public inputs.
        - Credible downside; triggers include missed delivery timing, weak qualification, or punitive new preferences.
    notes: >-
      Cases are qualitative because audited operating forecasts, acquisition consideration, and fully diluted ownership
      are unavailable; probability signals are evidence grades, not assigned percentages.
