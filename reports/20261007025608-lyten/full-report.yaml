  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Mapping advanced battery competitors on specific energy advantage (gravimetric weight reduction) versus
      demonstrated commercial cycle durability.
    data:
      xAxis:
        min: 0
        max: 10
        label: Commercial Durability & Bankability (Cycle Life & Field Proof)
      yAxis:
        min: 0
        max: 10
        label: Specific Energy & Mineral Independence (Wh/kg & Non-Ni/Co)
      points:
        - label: CATL (LFP Grid Benchmark)
          x: 9.5
          'y': 3
          description: Dominant cycle life (3,000-10,000 cycles) and bankability; moderate gravimetric density
        - label: Tesla (Megapack & 4680 Mobility)
          x: 8.5
          'y': 4.5
          description: High commercial deployment velocity and bankability; conventional mineral supply chain
        - label: QuantumScape (Solid-State Prototype)
          x: 4
          'y': 8
          description: Promising specific energy and safety; multi-year automotive qualification pending
        - label: Nex Tech Batteries (Defense Li-S)
          x: 2.5
          'y': 8.5
          description: High specific energy for defense/space; limited commercial cycle durability
        - label: Valgotech (Lithium-Sulfur Pilot)
          x: 2.5
          'y': 8
          description: New Indiana Li-S production facility; constrained commercial cycle life
        - label: Lyten (3D Graphene Li-S Platform)
          x: 3
          'y': 9
          description: Highest specific energy and Ni/Co-free composition; restricted commercial cycle durability
        - label: Lyten (Acquired European NMC & BESS)
          x: 5.5
          'y': 5
          description: Acquired 16 GWh Sweden and 6 GWh Poland assets provide conventional manufacturing bridge
    approximationNotes: >-
      Axes represent normalized ordinal scores (0-10) derived from documented performance benchmarks: demonstrated
      commercial cycles (X-axis) and gravimetric energy density / non-China mineral independence (Y-axis).
