        - Repeatable morphology, loading, and coating control
        - Polysulfide shuttle can reduce capacity and cycle life
      - - Protected composite lithium anode
        - Reduces corrosion and dendritic failure
        - Coating integrity and lithium inventory
        - Shorting and thermal behavior remain qualification concerns
      - - Electrolyte
        - Supports sulfur kinetics at low electrolyte-to-sulfur ratio
        - Salt, solvent, additive, and temperature stability
        - Lower electrolyte quantity can trade against life and manufacturability
      - - Coated separator
        - Limits crossover and thermal shrinkage
        - Commercial separator supply and coating consistency
        - Defect control is not independently quantified
      - - Pouch and cylindrical cell design
        - Packages components into application formats
        - Formation protocols, pressure, and inactive-material reduction
        - Published results vary by format, rate, depth of discharge, and test vintage
      - - Conventional production line
        - Coats, assembles, forms, and tests cells
        - Dry-room operation, equipment control, and yield learning
        - Pilot repeatability does not establish gigafactory-scale quality
