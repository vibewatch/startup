  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence-based likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap / kill criterion
    rows:
      - - Pilot-to-industrial lithium-sulfur scale-up misses yield, quality, or schedule
        - 'High concern: pilot-scale status and buyer caution were independently reported'
        - Thesis-breaking
        - 'Early: acquired assets and a proposed single-customer ramp strategy do not prove yield'
        - Extended cash use and delayed customer qualification
        - >-
          Kill if disclosed restart milestones slip materially or saleable yield and qualified output remain
          unverifiable
      - - Acquired Northvolt operations repeat predecessor execution failures
        - 'Medium-high concern: predecessor lost orders and support after quality and production problems'
        - High
        - 'Early: purchase and restart intent are public; integration KPIs are not'
        - Large fixed-cost footprint without restored order coverage
        - Obtain site-level output, scrap, uptime, warranty, staffing, order backlog, and integration-budget data
      - - Lithium-sulfur durability remains below application requirements
        - 'High technical concern: polysulfide shuttle is acknowledged and automotive timing is disputed'
        - High
        - 'Developing: company materials describe design work, but independent commercial-format validation is absent'
        - Near-term adoption may remain limited to weight-sensitive use cases
        - >-
          Kill automotive thesis if independent full-format testing cannot meet named OEM duty-cycle and warranty
          requirements
      - - Safety and EHS controls do not scale with cell size or facility count
        - Medium; no adverse incident is established, but evidence coverage is incomplete
        - High
        - 'Developing: preliminary abuse tests and an EHS-MS buildout are disclosed'
        - Larger-cell behavior and multi-site control effectiveness remain unverified
        - >-
          Require independent larger-cell reports and current site-level incident, audit, and corrective-action
          histories
    notes: >-
      Rows separate installed or announced capacity from qualified output. Severity and likelihood are analyst judgments
      tied to cited evidence, not measured probabilities.
