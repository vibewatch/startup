        - 高影响
        - 颠覆投资论点的影响
      rows:
        - label: 当前有直接证据
          values:
            - 二次发行流动性不足
            - 追加资本需求
            - 从试点到认证规模化的缺口
        - label: 部分证据或仅有公司证据
          values:
            - 波兰项目可行性延迟
            - 多基地 EHS 控制缺口
            - 工业资产整合失败
        - label: 发生可能性未量化
          values:
