        - 指定来源中未确立具有约束力的采购量承诺
        - 验证或商业条款失败，车辆项目选择其他供应商
        - 破坏论点
        - 在大规模爬坡前证明低批量质量稳定；分散应用
        - 监测已签署奖项、认证阶段、承诺量、价格、质保和取消权
      - - 增长资本与设施融资
        - 私人投资者联合体、潜在补助和未披露的收购融资
        - Reuters 报道需要大量额外融资；收购价格未披露
        - 固定成本上升期间，资本延迟到位或以稀释性 / 限制性条款到位
        - 破坏论点
        - 将资本开支与已签约需求分阶段匹配，并在扩张前锁定已承诺的设施
        - 监测经审计现金、消耗、资本开支、债务、契约余量、提款条件和资金续航
      - - 波兰工业枢纽合作
        - 公私合作伙伴、基础设施和公用事业供应商
        - 2026 年 3 月的状态是可行性研究，而非已完成的融资或建设决定
        - 所需基础设施、公用事业容量或公私融资未能落地
        - 高
        - 采用里程碑门控可行性、许可、融资和建设决策
        - 监测许可证、公用事业协议、已承诺交易对手方、融资交割和开工通知
      - - 垂直整合的运营范围
        - 覆盖矿产、电极、电芯、电池包和系统的内部及外部依赖
        - 官方网站描述了广泛整合；供应商和阶段层面的集中度未披露
        - 某一阶段的瓶颈或质量问题拖慢多条产品线
        - 高
        - 关键投入实行双供应源，认证替代工艺，并跟踪阶段良率
        - 索取供应商集中度、单一来源投入、认证交付周期、库存缓冲和恢复计划
    notes: 登记表区分已报道的关系或计划与具有约束力的合同。公开分母不可得时，集中度数值记为未知。
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR007
      - CR009
      - CR010
      - CR011
  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 跟踪 / 继续研究
        - 工业规模已可见，但经审计的经济性和收购对价尚未披露。
        - 不要仅凭公开证据接受某一价格。
      - - 信心与风险
        - 低至中等信心；高风险
        - Reuters 记录了继承而来的质量担忧和客户不确定性；情景输入仍不完整。
        - 在将回报计入投资判断前，要求一手尽调。
      - - 估值立场
        - 在报道的 $1.29B 估值下尚未证明
        - Forge 报道了投后估值参考，而融资数据库对轮次和总额存在冲突。
        - 寻求估值重置或里程碑保护。
    notes: 评估综合截至 2026-10-07 的公开来源；不构成交易建议，也不估算可用现金。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV010
      - CV016
  - id: TV002
    title: 投资论点与反论点
    columns:
      - 立场
      - 论点
      - 哪些情况会改变判断
    rows:
      - - 投资论点
        - 瑞典增加 16 GWh 的现有制造产能和一个主要研发中心。
        - 重启产线的生产良率得到验证，并实现有记录的商业销售。
      - - 投资论点
        - 据报道，2025 年至少有 $200M 股权融资与收购驱动的扩张有关。
        - 交割报表及来源与用途明细表显示资金续航充足。
      - - 反论点
        - Northvolt 收购对价未披露，无法搭建购买价格与改造回报桥接。
        - 已签署的收购文件，加上设施层面的资本开支和营运资金计划。
      - - 反论点
        - 继承而来的电芯质量批评和不确定的客户订单，使产能利用率只能推测。
        - 具有约束力且已认证的客户订单，附带验收标准和交付计划。
    notes: 产能和融资为来源报道的数字；任何一行都不把资产账面价值、已筹融资或意向书视为可用现金。
    claimRefs:
      - CV006
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险与概率信号
    rows:
      - - 乐观
        - 商业电芯从瑞典发货，波兰产出得到验证，具有约束力的客户支持产能利用率。
        - 只有在经审计的贡献经济性得到确认后，$1.29B 参考值才存在上行空间；无法支持任何数值区间。
        - 在交付和客户验收得到独立验证前，证据力度较低。
      - - 基准
        - 重启推进，但产能利用率、利润率和改造资本仍仅部分披露。
        - 仅将 $1.29B 用作谈判锚点，不为未经验证的执行溢价买单。
        - 最有公开证据支持的情景；触发条件是经审计的经济性持续缺失。
      - - 悲观
        - 重启延误，质量整改持续，或需要额外高级别资本。
        - 低于报道估值的重大减值是可能的，但无法用公开输入量化。
        - 可信的下行情景；触发因素包括交付时点错过、认证疲弱或新增苛刻优先权。
    notes: 由于经审计的运营预测、收购对价和完全摊薄后持股比例均不可得，各情景为定性判断；概率信号是证据等级，而非指定百分比。
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
      - CV016
