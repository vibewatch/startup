  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资结论
        blocks:
          - type: paragraph
            body: >-
              公开案例在战略上有吸引力，但尚未达到可以按证据定价的承销标准。Lyten 控制着广泛的制造布局，而 Forge 报告称 2025 年 7 月融资后的投后估值为 $1.29
              billion。这些事实证明了规模和市场参考价，却不能构成回报逻辑：指定证据中没有经审计的收入、利润率、现金消耗、改造资本开支或可用现金数据。Reuters 还报道 Northvolt
              的购买价格未披露，且卖方曾遭遇电芯质量批评。合适的结论是跟踪 / 继续研究，风险高、置信度低至中，直到运营证据和交易经济性能够与入场价格对账。
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV015
              - CV016
