      - number: '4.4'
        title: 单位经济、市场障碍与财务结论
        blocks:
          - type: paragraph
            body: >-
              从单位经济看，锂硫化学体系使用低成本、丰富的硫原料（<$200/ton），并避开波动且昂贵的镍、锰、钴供应链，理论上比标准锂离子更有吸引力。但独立技术分析指出，锂硫技术仍受多硫化物穿梭效应限制，商业循环耐久性只有
              200 至 500 次。专用卫星和航空航天应用可以用较低循环寿命换取重量能量密度；公用事业级电网储能要求 3,000 至 10,000 次循环，汽车平台则要求 1,000 至 2,000 次。行业基准记录显示，自
              2025 年 1 月以来已有 14 家西方电池初创公司破产，烧掉超过 $20 billion 资本，说明在缺乏银行认可度的情况下扩大电池制造会带来严重的资不抵债风险。总的来看，Lyten
              拥有差异化材料平台和世界级实体资产，但缺少经审计财务报表，BESS 和汽车单位经济尚未验证，且工厂重启资本成本高；在经审计的进展和有约束力的客户合同出现前，投资结论应为高风险、估值偏高。
            claimRefs:
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 欧洲超级工厂重启的资本密集度
            body: >-
              以远低于历史账面价值的价格（$5B）收购 Northvolt 在瑞典和波兰的制造基础设施，为 Lyten 带来 16 GWh 电芯产能和欧洲最大的 BESS 工厂。但重启闲置的 GW 级产线、雇用超过 600
              名员工，并改造设施以处理新的电池化学体系，都需要持续大量现金消耗；若没有客户预付款或有约束力的商业承购协议，股权储备可能迅速耗尽。
