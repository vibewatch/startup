  - id: FU001
    title: 客户采用与化学体系转型旅程
    type: journey-map
    summary: 客户采用分阶段从利基国防应用，推进至千兆瓦级数据中心基础设施和长期汽车交通应用。
    data:
      items:
        - label: 阶段 1 - 利基国防与自主系统
          touchpoints:
            - 瞄准国防无人机、机器人和卫星应用（2024-2026）
            - 在可容忍循环寿命限制的场景利用高重量能量密度
            - San Jose 试点设施首次发运商业电芯
        - label: 阶段 2 - 模块化 BESS 与工业储能
          touchpoints:
            - 使用 Voltpack Mobile System 重启 Gdańsk BESS 制造工厂（2025-2026）
            - 满足商业、工业和微电网备用储能需求
            - 在验证锂硫电池包整合的同时使用传统锂离子电芯
        - label: 阶段 3 - 共址 AI 数据中心基础设施
          touchpoints:
            - 与 EdgeConneX 合作建设 Skellefteå 1 GW 工业园区（2026-2027）
            - 将清洁电力供应、电池储能与高密度算力协同布局
            - 通过表后缓冲应对电网输电瓶颈
        - label: 阶段 4 - 汽车动力系统集成与概念验证
          touchpoints:
            - 与 Hofer Powertrain 共同开发 800V 模块化电池包方案
            - 与 Stellantis 合作，将测试电芯集成到 Chrysler Halcyon 概念电动车中
            - 开展机械、热和电气负载测试
        - label: 阶段 5 - 超级工厂规模化与商业产线转换
          touchpoints:
            - 在瑞典重启 Northvolt Ett 电芯产线，生产锂离子 NMC 电芯
            - 2026 年下半年用瑞典电芯供应波兰 BESS 组装厂
            - 先完成单线认证，再扩大多线产能
        - label: 阶段 6 - 长期汽车规模化生产
          touchpoints:
            - 解决枝晶导致的软短路和多硫化物穿梭降解问题
            - 按汽车行业标准协议实现数千次循环的耐久性
            - 自 2028 年起，将锂硫化学体系扩展到大众出行市场
    approximationNotes: 按时间排列的部署阶段取自 Fastmarkets 和公司公告中管理层给出的路线图；具体时间仍取决于技术认证。
