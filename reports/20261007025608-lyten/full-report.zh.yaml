      - number: '3.4'
        title: 壁垒持久性、切换障碍与行业洗牌逆风
        blocks:
          - type: paragraph
            body: >-
              Lyten 的竞争壁垒依托庞大的知识产权组合（覆盖 3D Graphene 和硫笼技术的已授权或待授权专利超过 550 项）以及把电池制造与 AI
              数据中心电力基础设施放在同一工业枢纽的布局。但商品化电池买方切换成本低、供应商关系根深蒂固，加上宏观经济逆风，都在严重挑战壁垒的持久性。先进电池行业正经历激烈洗牌：自 2025 年 1 月以来，已有 14
              家西方电池初创公司申请破产，尽管它们合计融资超过 $20 billion。Northvolt 的高调崩溃——债务累积达数十亿美元，却未能为 Scania 和 BMW
              等锚定客户实现合格良率——凸显了超级工厂规模化制造的巨大难度。Lyten 虽以远低于原始账面价值的价格（$5
              billion）收购这些设施，却继承了重大的运营整合风险、工厂重启成本和汽车客户疑虑。与此同时，竞争性钠离子电池快速进展，为固定式储能提供了即时、风险更低且不依赖关键矿物的替代品，可能在 Li-S
              跨过商业耐久性障碍之前将其取代。
            claimRefs:
              - CP004
              - CP009
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 双轨战略跨越化学体系成熟度不足
            body: >-
              Lyten 的竞争战略把下一代化学体系与当下工业现实分成两条轨道。Lyten 认识到锂硫电池 200 至 500 次的循环寿命会阻碍其立即进入公用事业级 BESS 和汽车市场，因此利用瑞典收购的
              Northvolt Ett 资产生产传统锂离子 NMC 电芯。这些电芯可立即供应其波兰 Northvolt Dwa BESS 工厂，在硅谷和瑞典研发团队推进 3D Graphene Li-S
              超大规模制造的同时，带来近期商业收入。
            calloutType: insight
            claimRefs:
              - CP008
              - CP009
              - CP012
          - type: callout
            title: 循环寿命差距使 Lyten 暴露于 LFP 和钠离子商品化风险
            body: >-
              Lyten 宣传丰富硫（<$200/ton）的理论成本优势，但现有 LFP 制造成本在全球范围内大幅下降，巩固了 LFP 作为 4 至 12
              小时电网储能事实标准的地位。与此同时，钠离子电池快速商业化；它们不受多硫化物穿梭降解机制影响，对固定式储能构成即时且低成本的威胁。如果 Lyten 无法在商业产品中证明至少 2,000 次可靠循环，Li-S
              进入电网储能的市场窗口可能永久关闭。
            calloutType: risk
            claimRefs:
              - CP003
