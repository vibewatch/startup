chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Lyten 成立于 2015 年，全球总部设在美国加州 San Jose，同时在卢森堡设有欧洲总部。公司将一种名为 Three-Dimensional
              Graphene（3DG）的专有可调材料平台商业化，该平台通过捕获甲烷原料中的碳制成。Lyten
              没有停留在早期材料科学授权模式，而是运营覆盖材料合成、电极配方、锂硫电芯制造和模块化电池储能系统（BESS）的垂直一体化工业模式。其核心战略是以硫和碳基 3D
              石墨烯结构替代稀缺或受地缘政治约束的正极矿物，尤其是镍、锰、钴和开采石墨，在实现高能量密度的同时，把供应链本地化到北美和欧洲。LytwrX
              研发体系下的互补业务还销售用于混凝土、结构复合材料、轻质聚合物和传感器设备的 3DG 添加剂。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO009
              - CO010
              - CO011
              - CO014
              - CO015
      - number: '1.2'
        title: 管理层、治理与公司组织
        blocks:
          - type: paragraph
            body: >-
              Lyten 的公司结构将硅谷管理团队与覆盖北美和欧洲的区域运营子公司结合起来。公司由 CEO 兼联合创始人 Dan Cook 领导，负责战略扩张、资本运作和重大交易。欧洲区域业务由专门的法人实体承载，其中
              Lyten Poland 由 Robert Chryc-Gawrychowski 领导；他曾任 Northvolt Poland CEO，并负责 Gdańsk BESS
              工厂最初的设计和建设。公司董事会在跨大西洋工业视角之间寻求平衡，也反映了 Stellantis、FedEx、Honeywell
              和欧洲公共基金等战略伙伴的投资。非官方第三方行业目录列出的高管人选互相矛盾，因此仍须以主要法律文件核实公司高管任命。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: 资本结构、融资与战略利益相关方
        blocks:
          - type: paragraph
            body: >-
              Lyten 已从国际企业战略投资者和机构风险基金组成的财团获得累计超过 $625 million 的股权投资，投资者包括 Stellantis、FedEx、Honeywell、Nokia、Prime Movers
              Lab、European Investment Fund 和 Luxembourg Future Fund。公司披露称，没有任何单一外部投资者持有超过 5%
              的股权。股权结构表显示持股较为分散，没有单一控股企业赞助方。除股权融资外，Lyten 还获得了美国进出口银行（EXIM Bank）最高 $650 million
              出口信贷融资的意向书（LOI）。二级私人交易平台显示出价格发现机制，但流动性仍受限于受限投资者认证标准和 OTC 另类交易系统规则。独立跟踪机构在计入非稀释性政府拨款和欧洲地区援助计划后，将不同轮次金额合计至
              $1B。
            claimRefs:
