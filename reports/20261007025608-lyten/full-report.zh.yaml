  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局、行业分类与替代化学体系
        blocks:
          - type: paragraph
            body: >-
              Lyten 所处的先进电池和储能市场拥挤且变化迅速，竞争者分为三类：根基深厚的锂离子和磷酸铁锂（LFP）制造商、新兴固态及替代化学体系企业，以及专门的锂硫直接竞争者。现有厂商由全球超大规模电池制造商主导，包括
              Contemporary Amperex Technology Co. Limited（CATL）、Panasonic 和 Tesla（4680
              电芯生产），以及区域龙头。这些企业掌握巨大的规模经济、成熟的全球汽车客户关系和高度优化的供应链。不过，现有化学体系仍高度依赖镍、钴、锰等关键矿物；LFP
              则存在明显的重量能量密度劣势。QuantumScape、Samsung SDI 和 Nissan 等新兴创新者正在推进固态电池结构，以提高能量密度和热稳定性。同时，Valgotech LLC 和 Nex Tech
              Batteries 等专业锂硫开发商瞄准高比能细分市场。除电芯制造商外，现有公用事业 BESS 集成商和 OEM 自有电池项目也是有力替代方案，决定了客户的采购选择。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
