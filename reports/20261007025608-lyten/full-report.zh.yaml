              GetLatka 等市场聚合平台公布 2025 年收入估算 $110 million ARR，但主要来源分析显示，Lyten
              没有公开发布经审计财务报表、收入拆分或毛利率数据。承销方和尽调分析师应将私营市场收入模型视为推测性替代指标，而不是已验证的运营表现。
            calloutType: insight
