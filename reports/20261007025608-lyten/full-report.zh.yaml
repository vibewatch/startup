      - number: '1.4'
        title: 工业扩张布局与里程碑演进
        blocks:
          - type: paragraph
            body: >-
              2024 至 2026 年间，Lyten 从加州的试点级国内制造，转向运营跨国制造和工业枢纽网络。瑞典电池制造商 Northvolt AB 于 2025 年 3 月破产后，Lyten
              进入了收购关键欧洲资产的有约束力协议，原始资产账面价值合计约 $5 billion。2025 年 10 月，Lyten 完成收购位于波兰 Gdańsk 的 Northvolt Dwa：这是一座 270,000
              平方英尺、配备 6 GWh 至 12 GWh 产能的 BESS 制造工厂，并重新启动 Voltpack Mobile System 的商业生产。2026 年 7 月，Lyten 与德国促发展银行 KfW
              及州政府部门签署独家谅解备忘录（MoU），拟收购德国 Heide 附近 Northvolt Drei 的 110 公顷超级工厂项目。这些大规模收购押注于修复陷入困境的欧洲清洁技术资产，运营风险很高。
