      - number: '4.2'
        title: 市场进入战略、销售周期与商业进展
        blocks:
          - type: paragraph
            body: >-
              Lyten 的市场进入战略高度依赖战略企业合作、国防和政府采购项目，以及协同开发协议，而非直销或标准分销渠道。Stellantis Ventures、FedEx Corporation 和 Honeywell
              等战略企业支持者同时扮演股权投资者和试点锚定客户的角色。在汽车出行领域，Stellantis 已将 Lyten 技术整合到 Chrysler Halcyon Concept
              等概念车中，但高批量商业供应协议仍受多年汽车 OEM 严格认证流程约束，包括 A 样、B 样和量产里程碑。Defense Innovation Unit（DIU）和美国太空军 SBIR
              奖励支持的国防与航空航天客户周期可提供非稀释性拨款和早期高毛利收入，但销售周期较长，为 18 至 36 个月。非官方第三方聚合平台 GetLatka 估算 2025 年收入为 $110 million
              ARR；但主要来源核查发现没有公开经审计收入，因此第三方运行率数字只是推测性估算，并非已确认的会计事实。
