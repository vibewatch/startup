      - number: '3.3'
        title: 能力比较、定价动态与采购权衡
        blocks:
          - type: paragraph
            body: >-
              将 Lyten 与现有及替代化学体系比较，会看到目标细分市场之间明显的性能、经济性和供应链权衡。在国防无人机、自主机器人和航空航天平台等重量敏感应用中，Lyten 的锂硫化学体系可减重最高
              40%，理论能量密度为传统锂离子的两倍，且不需要钴、镍等关键矿物。此外，Lyten 在美国国内生产电池级锂金属合金（2025 年 4
              月建成），并在美国和欧盟制造，为西方国防和工业买家提供有吸引力的非中国供应链。但在固定式电网储能和大众汽车市场，Lyten 面临严峻商业障碍。电网级 BESS 的行业基准要求 3,000 至超过 10,000
              次循环，而成熟 LFP 技术很容易达到这样的运行寿命。商业化展示过的 Li-S 电芯只能实现 200 至 500
              次循环，原因是多硫化物穿梭效应造成活性材料损失；没有经过验证的数千次循环耐久性，公用事业项目的储能平准化成本（LCOS）就缺乏竞争力。虽然丰富的硫（<$200/ton）长期能降低正极物料清单成本，但现有 LFP
              电芯价格仍在下降，形成激进的成本目标。
            claimRefs:
              - CP002
