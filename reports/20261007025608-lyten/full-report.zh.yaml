            title: 决策门槛
            body: 不要把已宣布的产能、意向书、可行性研究或初步电芯测试当作有资金支持的商业产出证据。只有可独立验证的良率和安全数据、有约束力的客户承诺，以及足以支撑收购资产布局的经审计资金，才能改善风险判断。
