              年投资共同开发锂硫电动车电池和轻质复合结构，包括在 Chrysler Halcyon 车型中的概念整合 [CU001, CU012]。至于欧洲动力总成工程，Hofer Powertrain 与 Lyten
              合作设计并进行功能验证，开发可支持 800V 的模块化 Li-S 电池包 [CU006]。基础设施这边，EdgeConneX 与 Lyten 合作开发毗邻 Skellefteå 的 AI 数据中心园区，规模可扩至
              1 GW [CU013]。但客户集中度风险偏高，因为 Northvolt 的传统汽车客户——包括 Scania、BMW 和 Volkswagen——尚未承诺向 Lyten 采购电芯
              [CU010]。此外，关键独立评估显示，Lyten 软包电芯在压力测试中因枝晶软短路而仅达到 110 次循环就停止工作，长期客户留存和质保可行性仍有未解缺口 [CU014, CU015]。
            claimRefs:
              - CU001
              - CU006
