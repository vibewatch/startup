      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 缺少有约束力的商业承购合同
            body: >-
              尽管 Lyten 收购了估计账面价值接近 $5 billion 的超级工厂资产，但尚未披露与主要汽车 OEM 或公用事业运营商签订的有约束力长期承购协议或最低采购量承诺。Scania 等 Northvolt
              传统客户采取观望态度，在工厂运营和电芯质量得到独立证明前拒绝承诺订单。
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
          - type: callout
            title: 数据中心共址作为降低资本风险的模式
            body: >-
              Lyten 与 EdgeConneX 合作，在 Skellefteå 电池工厂旁开发 1 GW AI 数据中心园区，试图绕开清洁技术领域的风险投资放缓。该共址模式把电池生产直接连接到高毛利、资本充足的 AI
              基础设施需求，并为公用事业级储能提供即时本地客户。
            calloutType: insight
            claimRefs:
              - CU002
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与论点失效条件
        blocks:
          - type: paragraph
            body: >-
              最大的剩余暴露是工业规模化、客户认证和融资之间的相互作用。Reuters 于 2025 年 8 月报道，Lyten 正在以试点规模生产锂硫电芯，需要大量资金，而且没有 Northvolt
              原有的订单簿。报道还称，汽车制造商在承诺之前希望看到技术验证、工业规模、本地化产能、商业条款和稳定交付。因此，资金需求与客户验证相互强化：认证推迟会延长现金需求，而融资受限又会拖慢认证所需的质量和产能里程碑。论点失效指标包括已披露的生产重启未实现、没有可独立验证的生产良率、没有锚定客户的有约束力承诺，或在固定成本设施爬坡时融资仍无法提款。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR010
              - CR012
              - CR013
              - CR016
      - number: '7.2'
        title: 监管、法律、安全与 EHS 暴露
        blocks:
          - type: paragraph
            body: >-
              公开证据不足以支持监管或法律状况良好的结论。Lyten 的 2024 年影响力报告称，其数据仅覆盖 San Jose，占当时运营的 85% 以上，且正式 EHS
              管理系统仍在开发中。这个基线早于公司后续公告所述的欧洲布局扩大。Lyten 编写的技术摘要报告了 1.5 Ah 电芯令人鼓舞的初步滥用测试，但也表示计划对更大的 4–5 Ah
              原型进行完整安全测试。这些披露只是缓解风险的信号，不代表所有产品认证、环境许可、工人安全控制或场址特定合规义务都已独立核实。因此，尽调路径应以文件为核心：取得每种产品和每个场址当前的审批矩阵、许可证、事故日志、审计发现和第三方测试报告。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.3'
        title: 运营、技术与质量执行
        blocks:
          - type: paragraph
            body: >-
              Lyten 正试图从试点锂硫生产，跳跃到其网站所称的从矿物到系统垂直一体化运营模式。公司称收购的 Gdansk BESS 工厂可实现 6 GWh 并扩展到 12
              GWh，但装机容量不等于合格产出、可销售良率或客户接受度。先例并不利：Reuters 将 Northvolt 的崩溃与订单流失、投资者支持流失、生产未达标和质量担忧联系起来。技术风险与工厂风险是两回事。Lyten
              编写的会议摘要把多硫化物穿梭确定为锂硫循环寿命不佳的主要原因，Reuters 引述的专家则预计汽车应用在 2030 年前都难以实现。公开证据因此尚未弥合实验室或试点性能与持久商业产出之间的差距。
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
              - CR009
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
              - CR009
              - CR015
              - CR016
      - number: '7.4'
        title: 合作伙伴依赖、资本暴露与监测
        blocks:
          - type: paragraph
            body: >-
              合作伙伴证据是有条件的，而非合同性的。Stellantis 告诉 Reuters，任何供应协议都取决于验证、规模化、本地产能和商业条款；BMW 表示，只有未来项目才会考虑 Northvolt
              的继承者，而该项目距离实现还很远。Lyten 2026 年 3 月关于波兰的公告提到可行性研究和对公私合作伙伴关系的需求，其波兰高管也明确指出制造需要重大资本投资。StartEngine
              二级发行还带来单独的投资者层面警示：购买者取得的是持有 Lyten 普通股的系列会员权益，而不是 Lyten
              的直接股份，该工具具有投机性且缺乏流动性。监测应聚焦有约束力的客户授予、经审计的流动性和资本开支、融资可提款性、工厂良率、质保表现，以及可行性研究转化为获许可并有融资支持的项目。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR010
              - CR011
              - CR012
