  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Lyten 覆盖三个商业上不同的市场，而不是一个同质化的电池 TAM：面向商业、工业、数据中心和表后应用的模块化 BESS；来自重启后的瑞典资产、用于 BESS 和移动出行的 NMC
              电芯；以及面向无人机、机器人、卫星和国防系统等重量敏感场景的锂硫电芯。全球电池需求、数据中心建设支出、混凝土添加剂和其他 3D
              石墨烯产品只是相邻市场，不能按同一产品或销售流程计入可触达的电池收入。现有替代品也各不相同：成熟的 LFP
              系统竞争固定式储能，现有锂离子化学体系竞争车辆市场，传统发电机或电网加固则争夺韧性预算。这样的边界避免把基础设施新闻当成产品需求，并让分析锚定在真正能够认证和采购 Lyten 产品的买方上。
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
