      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有证据只能支持产能视角，无法支撑可辩护的收入 TAM、SAM 或 SOM。Lyten 的波兰工厂可生产 6 GWh BESS，且已有扩产至 12 GWh 的路径；收购的瑞典资产还包括 16 GWh
              的现有电池制造产能。Skelleftea 的数据中心园区可能扩展至 1 GW，但那是潜在的供电土地容量，不等于电池需求、已投运负荷或签约销售。公司主页另行展示 1.3 GW 数据中心电力和 6.5 GWh
              BESS 制造能力，却没有公布将这些数字与场址层面披露对账所需的方法。没有利用率、产品组合、平均售价、合格需求和合同期限数据，任何这些指标都不能直接乘成收入。在这些输入具备之前，市场模型应维持情景分析。
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM011
              - CM014
      - number: '2.3'
        title: 买方、预算与采用路径
        blocks:
          - type: paragraph
            body: >-
              不同细分市场的预算归属不同。当正常运行时间、当地电力约束或表后控制足以支撑支出时，设施、能源或韧性团队可以主导模块化
              BESS。数据中心开发商可以为供电土地基础设施提供资金，但这笔资本不会自动转化为电池订单。国防和自主系统项目可能接受更高的电池成本，因为减重能提升任务能力；相较价格敏感的电网储能，这使它们更像锂硫电池的早期落脚市场。汽车和车队项目规模大，却要求更长的认证周期和可重复的良率。因此，Lyten
              近期需要一边重启传统 BESS 和 NMC 产出，一边让锂硫产品完成针对具体应用的认证。地方电池供应和欧洲能源韧性的公共支持可以加快场址开发，但不能替代客户验证或经营经济数据。
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM012
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM012
              - CM013
              - CM016
      - number: '2.4'
        title: 采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              主要约束是执行，而不是缺少宏观需求叙事。Reuters 报道称，Northvolt 曾持有超过 $50 billion
              的订单簿，却仍因质量和规模化问题失败，说明已宣布的需求无法弥补低良率。Battery-Tech 同样报道，Morrow 在流动性耗尽前就开始交付。对于锂硫电池，现有分析师来源认为其商业循环寿命低于电网 BESS
              所要求的数千次循环；这属于方向性、低置信度证据，并非经过独立验证的 Lyten
              性能结果。因此，投资者应更多看重合格产出、转移的合同、重复发货、质保、利用率和贡献毛利，而不是铭牌产能或泛化的市场预测。在这些数据披露之前，收购的产能既带来战略期权价值，也让 Lyten
              暴露于工厂爬坡、营运资金和管理带宽风险。
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 产能不等于需求
            body: 6 GWh、12 GWh 和 16 GWh 描述的是设备或收购产能，并不能证明利用率、合格出货、转移订单或毛利率。
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM015
          - type: callout
            title: 评估里程碑，而非泛化的电池 TAM
            body: 只有重复 BESS 交付、瑞典 NMC 良率与认证、经独立验证的锂硫耐久性以及披露的合同经济数据，才应成为估值上行空间的门槛。
            calloutType: recommendation
            claimRefs:
              - CM006
