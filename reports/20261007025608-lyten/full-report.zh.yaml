      - number: '8.2'
        title: 融资与入场背景
        blocks:
          - type: paragraph
            body: >-
              融资披露在方向上规模可观，但内部并不一致。Lyten 称已获得超过 $625 million 股权，并取得 $650 million EXIM 意向书；后者是融资意向，而非手头现金。Tracxn 报告五轮融资合计
              $625 million，FundedIQ 则报告单轮 $650 million，并将最近一轮放在 2024 年 12 月。Forge 另行报告 2025 年 7 月 Series B，投后估值 $1.29
              billion，清算优先权为 1.0x 且不参与剩余分配。轮次标签和总额互相冲突，因此在建立普通股回报模型前，必须先核对股权结构表。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV013
              - CV014
      - number: '8.3'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是：Lyten 以大幅低于原始资产价值的价格收购了稀缺工业产能，并能足够快地重启生产，把基础设施转化为商业产出。瑞典资产包含 16 GWh 现有电芯产能，波兰工厂被描述为可以爬坡至 6 GWh BESS
              产能。反论点是：继承的执行问题、客户重新认证和未披露的改造资本，在持久经济性出现前就耗尽融资。Reuters 提到 Northvolt 此前受到质量批评，并报道 Scania
              尚未承诺订单，因此客户接受度是决定性里程碑，而非装饰性指标。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 情景与决策门槛
        blocks:
          - type: paragraph
            body: >-
              由于证据不支持精确的收入预测或估值区间，情景分析应继续以里程碑为基础。乐观情景要求及时实现商业产出、客户重新认证，并且融资不会让新的普通股处于次级地位。基准情景把 Forge
              的估值视为未经核实的市场锚点，在经审计经济数据出现前不计入运营价值溢价。悲观情景是重启延迟并伴随额外资本需求，导致一项本已缺乏流动性的证券面临稀释或优先权悬置。达到投资准备状态需要购买价格桥接表、经审计财务、场址层面资本开支、有约束力的订单，以及完全稀释后的优先权分配瀑布。
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV016
