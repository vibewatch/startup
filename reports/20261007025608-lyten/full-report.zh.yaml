              - CP014
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与商业定价架构
        blocks:
          - type: paragraph
            body: >-
              Lyten 的商业架构围绕专有 3D Graphene 平台形成三大产品支柱：锂硫电芯和电池包、轻质复合材料，以及工业物联网传感器阵列。此外，随着欧洲扩张，Lyten 收购了 Northvolt
              的电池储能系统（BESS）组合，核心是位于波兰 Gdańsk、面积 25,000 平方米的 Northvolt Dwa 工厂组装的 Voltpack Mobile
              System（VMS）。不同细分市场的商业变现机制不同：BESS
              单元和电池系统以设备销售为基础，配套服务和软件监控合同；面向国防、无人机和太空应用的特种锂硫电芯采用定制样品批次和原型开发合同；复合材料则通过按数量计价的材料供应协议销售。由于 Lyten
              是非上市企业，官方价格表和实际合同利润率严格保密，第三方无法获得目录价格。行业基准显示，早期先进化学电芯在初始认证周期通常能获得 $500 至 $1,500/kWh 的原型溢价，而公用事业级 BESS
              和汽车合同要求长期价格低于当时 LFP 和 NMC 电芯成本曲线。
