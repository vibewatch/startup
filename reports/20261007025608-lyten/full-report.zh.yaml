            - 大电芯安全性或耐久性未达标
            - 未转化为有约束力的锚定客户
        - label: 历史警示证据
          values:
            - 未分配可控项
            - 锂硫电池汽车化时间表
            - 前身公司的质量与生产失败
        - label: 已披露缓解措施，但效果未验证
          values:
