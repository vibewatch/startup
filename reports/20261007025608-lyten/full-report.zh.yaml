      - number: '4.3'
        title: 成本结构、资产收购与资本充足性
        blocks:
          - type: paragraph
            body: >-
              商业化下一代储能需要巨额前期资本开支和运营现金跑道。Lyten 在五轮机构融资中累计获得超过 $625 million 股权投资，Prime Movers Lab 领投，Stellantis、FedEx 和
              Honeywell 参与。2024 年末至 2026 年初，Lyten 激进实施无机扩张战略，收购欧洲电池先驱 Northvolt 的破产资产，包括加州 San Leandro 的 Cuberg
              制造工厂（2024 年 11 月）、波兰 Gdańsk 的 Northvolt Dwa BESS 工厂（2025 年 10 月完成），以及瑞典 Skellefteå 的 Northvolt Ett 和 Ett
              Expansion、Västerås 的 Northvolt Labs（2026 年 2 月完成）。虽然 Lyten 以大幅低于约 $5 billion
              原始账面价值的困境折价收购这些制造资产，但重启超大规模产线、为工厂改造融资并重新雇用超过 600 名员工，都会带来巨额持续现金义务。此外，Lyten 持有美国进出口银行 $650 million
              出口信贷融资的不具约束力意向书，但是否转化为有约束力的债务工具仍未确认，因此公司高度依赖外部资本市场和 EdgeConneX 等合作方的共同投资。
