      - number: '3.2'
        title: 竞争者画像、规模、产品范围与市场定位
        blocks:
          - type: paragraph
            body: >-
              直接和相邻竞争者在资本规模、商业化阶段、制造布局和主要市场焦点上差异显著。全球现有厂商 CATL 拥有巨大的全球市场份额和规模，以成本有效的数千次循环 LFP 电芯支撑公用事业级 BESS 部署，例如
              Grenergy 的 11,000 MWh Oasis de Atacama 项目。QuantumScape
              等新兴固态开发商已募集大量风险资本和公开市场资本，主要为乘用电动车开发锂金属固态电芯，但批量商业生产仍处于多年认证阶段。在锂硫细分市场，Valgotech 于 2026 年 4 月在 Indiana 州
              Noblesville 开设专用生产设施以扩大 Li-S 制造；Nex Tech Batteries 则于 2026 年 1 月获得 $1.9 million 美国太空军 SBIR
              第二阶段奖励，用于推进高能量密度国防应用的 Li-S 技术。Lyten 通过把专有 3D Graphene 正极平台与激进的困境基础设施收购结合起来，与这些专业竞争者形成差异。收购波兰 Gdańsk 的
              Northvolt BESS 工厂（Northvolt Dwa）和瑞典 Skellefteå 的电芯超级工厂资产（Northvolt Ett）后，Lyten 控制 16 GWh 电芯产能和 6 GWh BESS
              设备，能够近期生产传统 NMC 电芯，同时推进 Li-S 工业化。
