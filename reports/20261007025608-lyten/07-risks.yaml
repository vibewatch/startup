figures:
  - id: "FR001"
    title: "Risk heatmap: evidence strength versus investment impact"
    type: "matrix"
    summary: "Qualitative placement separates well-evidenced exposures from high-impact risks whose likelihood remains unquantified."
    data:
      columns:
        - "Contained impact"
        - "High impact"
        - "Thesis-breaking impact"
      rows:
        - label: "Direct current evidence"
          values:
            - "Secondary-offering illiquidity"
            - "Additional-capital requirement"
            - "Pilot-to-qualified-scale gap"
        - label: "Partial or company-only evidence"
          values:
            - "Poland feasibility delay"
            - "Multi-site EHS control gap"
            - "Industrial asset integration failure"
        - label: "Unquantified likelihood"
          values:
            - "Permit or approval delay"
            - "Large-cell safety or durability miss"
            - "No binding anchor-customer conversion"
        - label: "Historical warning evidence"
          values:
            - "No contained item assigned"
            - "Lithium-sulfur automotive timing"
            - "Predecessor quality and production failure"
        - label: "Mitigation disclosed, effectiveness unverified"
          values:
            - "Preliminary small-cell abuse tests"
            - "EHS management-system buildout"
            - "Single-customer quality-ramp strategy"
        - label: "Missing public denominator"
          values:
            - "Secondary fee and exit outcome"
            - "Facility yield and warranty exposure"
            - "Liquidity relative to fixed-cost ramp"
    approximationNotes: "This is not a probability model. Placements synthesize cited public evidence as of 2026-10-07; unknown likelihood is preserved where denominators, contracts, approvals, or operating data are unavailable."
    claimRefs:
