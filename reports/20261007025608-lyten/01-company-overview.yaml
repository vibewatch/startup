company:
  name: "Lyten"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Lyten is a San Jose-headquartered advanced battery materials and energy storage company founded in 2015 that develops 3D Graphene (3DG) and lithium-sulfur (Li-S) battery cells, alongside acquiring bankrupt European gigafactory and BESS infrastructure. The company reports over $625M in cumulative equity raised and a $650M non-binding EXIM Bank Letter of Interest, while aggressive European asset expansions create substantial capital expenditure burdens and unresolved operational integration risks."
sections:
  - id: "company-identity-and-business-model"
    title: "Company Identity and Operating Model"
    body: "Lyten was founded in 2015 and maintains its global headquarters in San Jose, California, alongside a European headquarters in Luxembourg. The company commercializes a proprietary tunable material platform termed Three-Dimensional Graphene (3DG), derived by capturing carbon from methane feedstocks. Rather than remaining an early-stage materials science licensing vehicle, Lyten operates a vertically integrated industrial model spanning material synthesis, electrode formulation, lithium-sulfur battery cell fabrication, and modular battery energy storage systems (BESS). The core strategic premise rests on substituting scarce or geopolitically constrained cathode minerals—notably nickel, manganese, cobalt, and mined graphite—with sulfur and carbon-based 3D graphene architectures designed to achieve high energy densities while localizing North American and European supply chains. Complementary business segments operated under the LytwrX R&D umbrella market 3DG additives for concrete, structural composites, lightweight polymer additives, and sensor devices."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance, and Corporate Organization"
    body: "Lyten's corporate structure combines Silicon Valley executive management with regional operating subsidiaries across North America and Europe. The company is led by Chief Executive Officer and Co-Founder Dan Cook, who guides the firm's strategic expansion, capital formation, and major transactional activities. Regional European operations are organized under dedicated legal entities, including Lyten Poland led by Robert Chryc-Gawrychowski, who formerly served as CEO of Northvolt Poland and oversaw the initial design and construction of the Gdańsk BESS facility. Company governance balances transatlantic industrial perspectives across its board of directors, reflecting strategic investment from major strategic partners including Stellantis, FedEx, Honeywell, and European public funds. Unofficial third-party industry directories present conflicting executive listings naming alternative leadership figures, emphasizing the necessity of verifying corporate officer designations against primary legal filings."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholder-map"
    title: "Capital Structure, Financing, and Strategic Stakeholders"
    body: "Lyten has raised more than $625 million in cumulative equity investment from an international consortium of corporate strategics and institutional venture funds, including Stellantis, FedEx, Honeywell, Nokia, Prime Movers Lab, the European Investment Fund, and the Luxembourg Future Fund. Company disclosures assert that no individual external investor holds greater than a 5% equity stake, establishing a fragmented cap table devoid of a single controlling corporate sponsor. In addition to equity financing, Lyten secured Letters of Intent (LOIs) for up to $650 million in export-credit debt financing from the Export-Import Bank of the United States (EXIM Bank). Secondary private trading venues indicate pricing discovery mechanisms, though liquidity remains subject to restricted accreditation standards and OTC alternative trading system rules. Independent trackers aggregate differing round amounts up to $1B when including non-dilutive government grants and European regional assistance packages."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "operational-footprint-and-milestones"
    title: "Industrial Scaling Footprint and Milestone Evolution"
    body: "Between 2024 and 2026, Lyten transitioned from pilot-scale domestic manufacturing in California to operating a multi-national manufacturing and industrial hub network. A major pivot occurred following the March 2025 bankruptcy of Swedish battery manufacturer Northvolt AB, after which Lyten entered binding agreements to acquire key European assets totaling approximately $5 billion in original asset book value. In October 2025, Lyten finalized the acquisition of Northvolt Dwa in Gdańsk, Poland—a 270,000-square-foot BESS manufacturing plant equipped for 6 GWh to 12 GWh of capacity—restarting commercial production of the Voltpack Mobile System. In July 2026, Lyten signed an exclusive Memorandum of Understanding (MoU) with German promotional bank KfW and state authorities to acquire the Northvolt Drei 110-hectare gigafactory project near Heide, Germany. These extensive acquisitions represent a high-stakes operational bet on rehabilitating distressed European clean-tech assets."
    claimRefs:
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
