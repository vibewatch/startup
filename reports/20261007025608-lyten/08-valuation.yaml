schemaVersion: "report-v2"
artifact: valuation
slug: lyten
runDate: "2026-10-07"
company:
  name: Lyten
chapter:
  number: 8
  title: Valuation
  summary: >-
    Lyten has assembled substantial battery infrastructure and reports more than
    $625 million of equity backing, but public evidence does not disclose audited
    operating economics or the Northvolt purchase price. A $1.29 billion
    post-money mark reported by Forge is therefore a reference point rather than
    a defensible intrinsic value, supporting a track / research-more stance.
sections:
  - id: investment-conclusion
    title: Investment conclusion
    body: >-
      The public case is strategically interesting but not yet underwritable at
      an evidence-based price. Lyten controls a broad manufacturing footprint,
      while Forge reports a $1.29 billion post-money valuation for a July 2025
      financing. Those facts establish scale and a market reference, not a
      return case: the assigned evidence contains no audited revenue, margin,
      cash-burn, retrofit-capex, or cash-available figures. Reuters also reported
      that the Northvolt purchase price was undisclosed and that the seller had
      faced cell-quality criticism. The appropriate conclusion is track /
      research-more, with high risk and low-to-medium confidence, until operating
      proof and transaction economics can be reconciled with the entry price.
    claimRefs: [CV001, CV009, CV010, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-entry-context
    title: Financing and entry context
    body: >-
      Financing disclosures are directionally substantial but internally
      inconsistent. Lyten says it has received more than $625 million in equity
      and secured $650 million of EXIM letters of interest, which are financing
      indications rather than cash on hand. Tracxn reports $625 million across
      five rounds, whereas FundedIQ reports $650 million across one round and
      places the latest event in December 2024. Forge separately reports a July
      2025 Series B at a $1.29 billion post-money valuation with a 1.0x,
      non-participating liquidation preference. The conflicting round labels and
      totals make cap-table reconciliation a prerequisite to any common-equity
      return model.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV013, CV014]
  - id: thesis-and-antithesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Lyten acquired scarce industrial capacity at a
      substantial discount to original asset value and can restart production
      quickly enough to convert infrastructure into commercial output. The
      Sweden assets include 16 GWh of existing cell capacity, and the Poland
      facility was described as capable of ramping to 6 GWh of BESS capacity.
      The anti-thesis is that inherited execution problems, customer
      requalification, and undisclosed retrofit capital absorb the financing
      before durable economics emerge. Reuters noted prior Northvolt criticism
      over quality and reported that Scania had not yet committed to orders,
      making customer acceptance a decisive rather than cosmetic milestone.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: scenarios-and-decision-gates
    title: Scenarios and decision gates
    body: >-
      Scenario analysis should remain milestone-based because the evidence does
      not support precise revenue forecasts or valuation ranges. The bull case
      requires timely commercial output, customer requalification, and financing
      that does not subordinate new common equity. The base case treats the
      Forge mark as an unverified market anchor and withholds an operating-value
      premium until audited economics appear. The bear case is a delayed restart
      combined with additional capital needs, creating dilution or preference
      overhang against an already illiquid security. Investment readiness
      requires the purchase-price bridge, audited financials, facility-level
      capex, binding orders, and a fully diluted preference waterfall.
    claimRefs: [CV001, CV007, CV008, CV009, CV010, CV013, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - [Recommendation, "Track / research-more", "Industrial scale is visible, but audited economics and acquisition consideration are not.", "Do not accept a price from public evidence alone."]
      - [Confidence and risk, "Low-to-medium confidence; high risk", "Reuters documents inherited quality concerns and customer uncertainty; scenario inputs remain incomplete.", "Require primary diligence before underwriting returns."]
      - [Valuation stance, "Unproven at the reported $1.29B mark", "Forge reports a post-money reference, while funding databases conflict on rounds and totals.", "Seek a valuation reset or milestone protection."]
    notes: "Assessments synthesize public sources as of 2026-10-07; they are not a transaction recommendation or an estimate of cash available."
    claimRefs: [CV001, CV002, CV003, CV009, CV010, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [Thesis, "Sweden adds 16 GWh of existing manufacturing capacity and a major R&D center.", "Verified production yield and recognized commercial sales from restarted lines."]
      - [Thesis, "At least $200M of 2025 equity was reported in connection with acquisition-led expansion.", "Closing statements and a sources-and-uses schedule showing adequate funded runway."]
      - [Anti-thesis, "The Northvolt consideration was undisclosed, preventing a purchase-price and retrofit-return bridge.", "Executed purchase documents plus facility-level capex and working-capital plans."]
      - [Anti-thesis, "Inherited cell-quality criticism and uncertain customer orders make utilization speculative.", "Binding, qualified customer orders with acceptance criteria and delivery schedules."]
    notes: "Capacity and financing are source-reported figures; no row treats asset book value, funding raised, or an LOI as cash available."
    claimRefs: [CV006, CV009, CV010, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenarios
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks and probability signal
    rows:
      - [Bull, "Commercial cells ship from Sweden, Poland output is validated, and binding customers support utilization.", "Potential upside to the $1.29B reference only after audited contribution economics; no numeric range is supportable.", "Low-evidence signal until deliveries and customer acceptance are independently verified."]
      - [Base, "Restart progresses but utilization, margins, and retrofit capital remain only partly disclosed.", "Use $1.29B solely as a negotiation anchor and pay no unverified execution premium.", "Most supportable public-evidence case; trigger is continued absence of audited economics."]
      - [Bear, "Restart delays, quality remediation persists, or additional senior capital is required.", "Material impairment below the reported mark is plausible, but cannot be quantified from public inputs.", "Credible downside; triggers include missed delivery timing, weak qualification, or punitive new preferences."]
    notes: "Cases are qualitative because audited operating forecasts, acquisition consideration, and fully diluted ownership are unavailable; probability signals are evidence grades, not assigned percentages."
    claimRefs: [CV001, CV007, CV008, CV009, CV010, CV013, CV016]
figures:
