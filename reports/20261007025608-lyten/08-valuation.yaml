        - id: scale
          label: "Industrial scale"
          detail: "Company-reported manufacturing footprint and acquired capacity"
        - id: financing
          label: "Financing reference"
          detail: "More than $625M equity claimed; databases conflict on round history"
        - id: entry
          label: "Entry-price anchor"
          detail: "Forge reports a $1.29B post-money valuation"
        - id: overhang
          label: "Capital-structure gate"
          detail: "Purchase consideration, dilution, and complete preference stack require verification"
        - id: proof
          label: "Operating-proof gate"
          detail: "Commercial output, quality, customer acceptance, and audited economics"
        - id: decision
          label: "Track / research-more"
          detail: "Re-rate only after evidence clears both gates at a disciplined price"
    approximationNotes: "The flow is qualitative and does not imply a numeric probability, valuation range, or conversion rate."
    claimRefs: [CV001, CV004, CV006, CV007, CV009, CV010, CV013, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price and evidence discipline
    body: >-
      Do not convert manufacturing asset value or funding raised into enterprise
      value. Advance only after primary diligence reconciles the cap table,
      purchase consideration, funded runway, facility economics, and binding
      customer commitments.
    claimRefs: [CV001, CV004, CV005, CV009, CV013, CV016]
