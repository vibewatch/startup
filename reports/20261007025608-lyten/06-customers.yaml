    title: Customer Adoption and Chemistry Transition Journey
    type: journey-map
    summary: Phased progression of customer adoption from niche defense applications to gigawatt-scale data center infrastructure and long-term automotive mobility.
    data:
      items:
        - label: Phase 1 - Niche Defense & Autonomous Systems
          touchpoints:
            - "Targeting defense drones, robotics, and satellite applications (2024-2026)"
            - "Leveraging high gravimetric energy density where cycle life limits are tolerable"
            - "Initial commercial cell shipments from San Jose pilot facility"
        - label: Phase 2 - Modular BESS & Industrial Energy Storage
          touchpoints:
            - "Restarting Gdańsk BESS manufacturing plant with Voltpack Mobile System (2025-2026)"
            - "Supplying commercial, industrial, and microgrid backup storage demands"
            - "Utilizing conventional lithium-ion cells while validating Li-S pack integration"
        - label: Phase 3 - Co-Located AI Data Center Infrastructure
          touchpoints:
            - "Partnering with EdgeConneX on Skellefteå 1 GW industrial campus (2026-2027)"
            - "Co-locating clean power delivery, battery storage, and high-density compute"
            - "Providing behind-the-meter buffering against grid transmission bottlenecks"
        - label: Phase 4 - Automotive Powertrain Integration & Concept Validation
          touchpoints:
            - "Co-developing 800V modular pack concepts with Hofer Powertrain"
            - "Integrating test cells into Chrysler Halcyon concept EV with Stellantis"
            - "Conducting mechanical, thermal, and electrical load testing"
        - label: Phase 5 - Gigafactory Scale & Commercial Line Conversions
          touchpoints:
            - "Restarting Northvolt Ett cell lines in Sweden with lithium-ion NMC cells"
            - "Supplying Polish BESS assembly plant with Swedish cells in second half of 2026"
            - "Executing single-line qualification before expanding multi-line throughput"
        - label: Phase 6 - Long-Term Automotive Mass Production
          touchpoints:
            - "Resolving dendritic soft-shorting and polysulfide shuttle degradation"
            - "Achieving multi-thousand-cycle durability under automotive standard protocols"
            - "Scaling lithium-sulfur chemistry to mass mobility markets from 2028 onward"
